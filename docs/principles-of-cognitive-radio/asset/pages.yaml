    N-1$ in Eq. (1.1) is given by [84]


    > $PAPR(\mathbf{x}) = \frac{\max_{0 \leq n \leq N-1} \{|x_n|^2\}}{\mathbb{E}\{|x_n|^2\}}$,


    When the PAPR of the OFDM signal is large, the digital-to-analog converters and
    power amplifiers require high dynamic range to avoid clipping and distortion.
    Hence the dynamic range of digital-to-analog converters should be large enough
    to accommodate large peaks. One down side is that the cost of the digital-to-analog
    converters increases with higher dynamic range. In NC-OFDM systems, the PAPR will
    be larger since some of the subcarriers are nulled [75].


    # 1.8 Spectrum coexistence in cognitive radio networks


    One of the important requirements for the well-being of a cognitive radio network,
    for example in TV white spaces, is the healthy coexistence with the primary networks.
    There is a stringent requirement that secondary users should minimize the amount
    of interference at the primary receivers. Further, there is also the need for
    secondary users to be able to coexist and possibly form networks to carry information.
    There are many reactive methods that a cognitive radio could use to avoid interference.
    Typically, these involve adaptation of frequency, transmit power, and transmit
    waveforms. A frequency agile cognitive radio can periodically scan the entire
    band, identify if the channel is being used by the primary user and dynamically
    shift to another vacant band of the spectrum. Software defined radios can scan
    the spectrum either by sweeping the entire band or by frequency hopping and the
    RF hardware improvements have made such radios feasible. Power control is a widely
    used interference mitigation technique. With very minimal feedback based on the
    interference detected by periodic scanning, the transmit power of the secondary
    can be controlled to minimize the interference at the primary receiver. Orthogonalization
    of the signal space is another way of mitigating interference. In a time scheduling
    MAC of the secondary network, packets can be scheduled in time slots when primary
    user activity is not observed. Orthogonalizing in frequency is also a way to mitigate
    interference. NC-OFDM transmission discussed in the previous section is an example
    of orthogonalization in frequency domain. The above reactive mechanisms are limited
    by the amount of channel state information available at the transmitter and also
    due to the fact that interference is a receiver property. Reactive schemes inherently
    require explicit coordination protocols to obtain the network state and channel
    information of primary and secondary users. Without the network state information,
    efficient discovery, self-organization, resource management, and cooperation techniques
    are rendered inefficient. Exchanging link state information may overload the network
    and this poses a challenge for designing efficient networks using cognitive radios.
    This also emphasizes the need for the architecture and protocol mechanisms discussed
    earlier in Section 1.6.'
