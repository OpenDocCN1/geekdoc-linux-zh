- pgno: 132
  md: 'Similarly, the CR design should permit the modulation alphabet size to be adapted
    to the signal level, which depends on path loss and small-scale fading.


    Finally, we stress the importance of propagation models in analyzing interference
    in CR systems and in designing ways to minimize or avoid it. In overlay and underlay,
    for example, a CR transmitter is operating co-channel with the primary receiver(s);
    in interweave, it may be operating in adjacent channels. Therefore, both co-channel
    and adjacent-channel interferences are important, and their impact depends on
    numerous factors: transmission spectrum, including the out-of-band energy; receive
    filter characteristics, including the out-of-band response; duplex plan and parameters
    (e.g., the spacing of bands in frequency-division duplexing); and such propagation
    aspects as path loss (to estimate total power at victim receivers) and the temporal,
    spatial, and spectral variations of small-scale fading (to relate sensing measurements
    at one time–place–frequency to conditions at another). As a general rule, we can
    say that every operating parameter and strategy in a CR design depends in some
    way on the propagation channel.


    # 3.1.4 Outline of the chapter


    We will strive, throughout this chapter, to point out the CR-specific impact of
    the propagation issues we describe, whether the impact is on overlay, underlay,
    or interweave scenarios. At the same time, one cannot appreciate the CR-specific
    aspects of propagation without understanding the fundamentals of radio channels
    per se. The reader will therefore note that we will discuss propagation phenomena
    and channel models in a general way, which will hopefully be an added benefit
    to those not already familiar with this subject. Section 3.2 introduces the generic
    channel response, showing it to be a product of a large-scale term (related to
    path loss), which incorporates the effects of distance and shadowing; and a small-scale
    term, which incorporates the effects of multipath. The next three sections (3.3
    to 3.5) deal, in order, with the ideal free-space path loss, the path loss in
    wireless systems, and the path loss in tower-based systems. The next four sections
    (3.6 to 3.9) deal with the small-scale phenomena caused by multipath. These include,
    in order, the spatial variability of field strength, temporal variability (Doppler
    spectra) for mobile and fixed terminals, delay dispersion in wideband channels,
    and angle dispersion. Finally, we introduce the topic of polarization, which can
    have an impact on CR designs using multiple antennas (Section 3.10); discuss some
    new, less thoroughly modeled propagation environments of importance to CR (Section
    3.11); and summarize key propagation parameters of the radio channels we have
    described (Section 3.12). We end with a summary of the chapter (Section 3.13)
    and some suggestions for further reading (Section 3.14).


    # 3.2 Generic channel response


    It is not our purpose here to discuss the physics of radio propagation in CR-relevant
    bands, but to describe the impact of propagation on the behavior of the medium
    as seen by a given CR system. This leads us to the notion of the channel response
    on a particular'
