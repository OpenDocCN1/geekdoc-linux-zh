    # Restless multiarmed bandit problems


    The restless multiarmed bandit problem is a generalization of the classical multiarmed
    bandit problem where the agent may play multiple M ≤ L arms simultaneously and
    the nonplayed arms may change state and produce rewards as well [220]. This complicates
    the problem considerably. Consequently, the Gittins index policy is no longer
    optimal. Whittle proposed a heuristic index policy using a Lagrangian multiplier
    approach for the restless multiarmed bandit problems [220]. The Whittle index
    policy is optimal under a relaxed constraint that the average number of played
    arms is equal to M for the average reward over the infinite horizon criterion.
    Moreover, the Whittle index policy is asymptotically optimal under certain conditions
    as M and L tend to infinity with M/L fixed [217, 218]. However, the Whittle index
    is not always meaningful, i.e., the ordering of the arms is not consistent. The
    restless multiarmed bandits for which the Whittle index is meaningful are called
    indexable [220]. Establishing indexability and calculating the Whittle indices
    may be difficult in practice. For indexability of restless multiarmed bandit problems
    and numerical algorithms for establishing indexability and calculating the Whittle
    index, we refer the reader to [63, 158, 139, 141–143].


    In [115] a single-user multiband spectrum sensing and access problem is formulated
    as a restless multiarmed bandit problem. The design of an optimal policy for choosing
    M frequency bands to sense and subsequently access if they are vacant is considered.
    The goal is to maximize the long-run reward. Sensing is assumed to be perfect,
    i.e., the detector does not make any errors. The states of the frequency bands
    are assumed to follow Markov chains with two states (good (1) and bad (0)) and
    different transition probabilities (P11^i, P01^i) for each band i = 1, …, nB.
    The user receives a reward for each frequency band sensed available and subsequently
    accessed. The rewards for the different frequency bands are denoted by B_i, i
    = 1, …, nB. The frequency bands that are either not sensed or identified to be
    occupied do not produce any reward. The user is able to observe the frequency
    band states only after sensing. Hence, it needs to infer or predict the state
    from its past decisions and observations. The conditional probability that a frequency
    band is in state 1 given all past decisions and observations is a sufficient statistic.
    The vector of conditional probabilities is referred to as the belief vector Ω_n
    = [ω_n^1 …, ω_n^{nB}]. The belief states ω_n^i, i = 1, …, nB, can be updated recursively
    [115]:


    ω_{n+1}^i = { P11^i, a_n^i = 1, s_n^i = 1, P01^i, a_n^i = 1, s_n^i = 0, ω_n^i
    P11^i + (1 − ω_n^i) P01^i, a_n^i = 0. } (5.72)'
