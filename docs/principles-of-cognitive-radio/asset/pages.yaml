    The cut-set bound is a tight outer bound only for certain special scenarios. In
    general, the cut-set bound is looser relative to the network capacity region.
    Alternative outer bounds to the cut-set outer bound can be derived by using *gene*-based
    techniques in which the network is modified by assuming that additional information
    is known (a.k.a., given by a genie) to a subset of terminals. The goal of providing
    this information is to obtain a modified network for which capacity or an outer
    bound can be obtained. Due to the additional information, the modified network
    outperforms the original one. Consequently, its capacity (or any outer bound on
    it) yields a capacity outer bound for the original network. Outer bounds can also
    be obtained by *the theory of network equivalence* [50]. This approach provides
    conditions under which the capacity of a wireless network can be upper bounded
    by the performance of an equivalent noiseless network of bit pipes, for which
    the capacity can then be determined. Another technique to tighten the cut-set
    bound is by modification of the network connectivity graph [52, 53].


    Obtaining the Shannon capacity region of a wireless network is generally intractable;
    in fact the capacity of several simple canonical topologies such as the relay
    channel and the interference channel have remained open problems for decades.
    As an alternative capacity metric, a landmark result by Gupta and Kumar [38] introduced
    the notion of scaling laws for noncongestive wireless network throughput as the
    number of nodes in the network $K$ grows asymptotically large. They found that
    the throughput in terms of bits per second for each node in the network decreases
    with $K$ at a rate between $1/\sqrt{K\log K}$ and $1/\sqrt{K}$. In other words
    the per-node rate of the network goes to zero, although the total network throughput,
    equal to the sum of rates, grows at a rate between $\sqrt{K/\log K}$ and $\sqrt{K}$.
    This surprising result indicates that even when interference is treated as noise
    (as is typical in practical designs), even with optimal routing and scheduling,
    the per-node rate in a large ad hoc wireless network goes to zero. The reason
    is that in this relatively simple relaying scheme, intermediate nodes spend much
    of their resources forwarding packets for other nodes, so few resources are left
    to send down data. There has been much follow-on work to this result, including
    the impact on wireless network scaling laws of mobility, multiple antennas, and
    cooperation [5, 36, 68]. In particular, [68] showed that more sophisticated cooperation
    schemes allow per-node rates in large networks to remain constant with network
    size rather than decrease. The tradeoff between throughput (in terms of scaling
    laws) and delay in asymptotically large networks was characterized in [22, 39,
    85].'
