  md: '# 2.9 Further reading


    The four-node cognitive radio channel is a special case of the four-node interference
    channel, whose capacity was first investigated in the late 1970s by Carleial and
    by Sato [11, 73]. The model where one encoder in the interference channel is a
    cognitive encoder was first proposed and its capacity region analyzed in [19,
    59]. Since then there has been tremendous activity determining achievable rate
    regions and capacity outer bounds for this channel, as well as special cases such
    as strong, very strong, and weak interference regimes where these bounds meet.
    Tutorial papers [20, 35] describe the large body of work on the capacity of interference
    channels with cognitive encoders and the resulting capacity regions and encoding/decoding
    strategies for these special regimes. Scaling laws for interweave networks were
    first investigated in [92] using the idea of a primary exclusion region. The first
    work to analyze capacity of the interweave channel based on a switch model for
    primary user detection was [45].


