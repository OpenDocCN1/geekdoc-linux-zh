    the primary user experiences secondary user interference with probability $P_{\mathrm{MD}}$,

    and $C_p^i$ for outage probability $P_{\text{out}} \geq P_{\mathrm{MD}}$. Note
    that the primary user in general does

    not know the secondary user''s interference, and thus it does not know $C_p^i$.
    Hence,

    it must choose a *fixed* transmission rate $R \leq C_p^i$ without this knowledge.
    If an out-

    age probability of $P_{\text{out}} = P_{\mathrm{MD}}$ is acceptable, then the
    primary user can transmit at

    any rate $R < C_p^i$ and accept that a fraction $P_{\mathrm{MD}}$ of the data
    will be decoded in error.

    If that is an unacceptable outage probability then, assuming it can bound the
    maxi-

    mum interference of the secondary user as $I_{s, \text{max}}$, it can reliably
    transmit at any rate

    $R < W \log_2(1 + P_p/(N_0W + I_{s, \text{max}}))$. As long as the bound is accurate,
    data sent at

    this rate will always be correctly decoded. Similarly, if it does know $C_p^i$,
    then it can send

    at that rate with no outage. The primary user is active when the switch is ON
    due to

    correct detection of primary user activity, or when the switch is ON due to missed
    detec-

    tion of primary user activity. Recalling that $P_{\mathrm{FA}}$ is the probability
    of false detection and

    letting $P_{\mathrm{MD}}$ denote the probability of missed detection, we have
    that the primary user is

    active with probability $(1 - P_{\mathrm{FA}})P_{\text{off}} + P_{\mathrm{MD}}P_{\text{on}}$.
    Hence, the primary user''s through-

    put averaged over all time, given a fixed transmission rate of $R$ when it is
    active, is

    $((1 - P_{\mathrm{FA}})P_{\text{off}} + P_{\mathrm{MD}}P_{\text{on}})R$.


    A primary user adapting to the behavior of a secondary user is atypical for an
    inter-

    weave channel, where primary users are meant to be oblivious to the presence of
    sec-

    ondary transmissions. However, some systems have been proposed where primary users

    can react to secondary users. Suppose the primary user can measure the interference

    caused by the secondary user due to missed detection. Then it can adapt its transmission

    rate during the time that it transmits to $R < C_p^i$ in the absence of secondary
    interference

    (i.e., when the switch is OFF) and to $R = C_p^i$ in the presence of secondary
    interference

    (i.e., when the switch is ON due to missed detection). This yields an ergodic
    rate for the

    primary user during the time it transmits of


    ```

    $$C_{p,\text{erg}} = P_{\mathrm{MD}}C_p + (1 - P_{\mathrm{MD}})C_p^i. \qquad\qquad\qquad
    (2.63)$$

    ```'
