  md: 'A description of the angular dispersion can be made by generalizing the concept
    of impulse response. The double-directional impulse response (DDIR), which generalizes
    (3.37), again consists of a sum of contributions from the MPCs [105]:


    $$h(t,\tau,\Omega,\Psi)=\sum_{n=1}^{N} a_n(t)\delta(\tau-\tau_n)\delta(\Omega-\Omega_n)\delta(\Psi-\Psi_n),\qquad(3.47)$$


    with $a_n(t)=|a_n|\exp[j\Phi_{a_n}(t)]$, and where the $\Omega_n$ denote the directions
    of departure (DODs), the $\Psi_n$ are the directions-of-arrival (DOAs), and $N$
    is the number of MPCs.


    Equation (3.47) assumes that the MPCs can be represented by ideal homogeneous
    plane waves, such that they are represented by delta functions in the angular
    domain (when taking into account wavefront curvature, the delta functions need
    to be replaced by more general functions). We see the strong analogy between the
    traditional model, (3.37), and this double-directional representation, where each
    MPC is additionally characterized by a DOA and DOD.


    The double-directional impulse response is an abstract description of the propagation
    effects alone, without being impacted by the antenna geometry. For the performance
    analysis of communications systems, we often need the joint impulse response at
    the elements of an antenna array, which can be represented as a matrix of impulse
    responses if we have arrays at both link ends, and a vector if we have an array
    at one link end only.


    We now show how to obtain such an impulse response matrix from the double-directional
    impulse response. This derivation is based on the principle that the contribution
    of an MPC to the total impulse response at two different antenna elements differs
    only by a phase factor that is determined by the direction of the MPC and the
    relative position of the antenna elements. We denote the transmit and receive
    element coordinates as $\mathbf{r}_T^{(1)},\mathbf{r}_T^{(2)},...,\mathbf{r}_T^{(N_T)}$
    and $\mathbf{r}_R^{(1)},\mathbf{r}_R^{(2)},...,\mathbf{r}_R^{(N_R)}$, respectively.
    For one particular time instant (equivalently, one realization of the $a_n$),
    the impulse response from the $m$th transmit to the $l$th receive element becomes
    (under the assumption of plane, narrowband waves)


    $$h_{l,m}=h\left(\mathbf{r}_T^{(m)},\mathbf{r}_R^{(l)}\right)\\=\sum_n a_n g_T(\Omega_n)g_R(\Psi_n)\exp\left(j\mathbf{k}(\Omega_n)\bullet\mathbf{r}_T^{(m)}\right)\exp\left(j\mathbf{k}(\Psi_n)\bullet\mathbf{r}_R^{(l)}\right),\qquad(3.48)$$


    where $g_T$ and $g_R$ are the complex (amplitude) patterns of the transmit and
    receive antenna elements, respectively, $\mathbf{k}$ is the unit wave vector in
    the direction of the $i$th DOD or DOA, and $\bullet$ denotes the dot product;
    the summation can be replaced by an integration if the double-directional impulse
    response has continuous components. We thus see that it is easily possible to
    obtain the impulse response matrix from a double-directional impulse response
    (and the knowledge of antenna positions and patterns) while the converse is not
    true.'
