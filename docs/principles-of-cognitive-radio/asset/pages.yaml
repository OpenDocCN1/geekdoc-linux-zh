    and x_i ≥ v({i}), ∀ i ∈ N. Thus, no group of players has incentive to leave the
    grand coalition whose payoff allocation is in the core of the game. Consequently,
    the concept of the core in coalitional games is similar to the Nash equilibrium
    in noncooperative games. If it exists, the core of a coalitional game with transferable
    utility is obtained by solving the following linear program:


    min_x Σ_{i∈N} x_i, s.t. Σ_{i∈S} x_i ≥ v(S), ∀ S ⊆ N. (5.91)


