    If the TX or RX moves, the spatial variability of c_m we have described is converted
    into a time variation. In the following, we thus invoke the commonly used “time-variant
    impulse response,” ĥ(τ, t), under conditions of mobility instead of the equivalent
    ĥ(τ; x, F). Thus, (3.39) becomes'
