    The test statistic of this detector is [27]


    $Y \triangleq \left| \frac{1}{N} \sum_{i=0}^{(N_P+N_D)-1} A_i + c \right|^2, \quad
    (4.86)$


    where


    $c \triangleq \frac{\frac{N_P}{N_P+N_D}\sigma_z^2}{\left(1+2\left(\frac{N_P}{N_P+N_D}\right)^2\right)\frac{\sigma_d^2}{\sigma_z^2}+2},
    \quad (4.87)$


    Even this detector does not exploit the nonstationarity of the observed signal.
    Notice how the calculation of this test statistic requires the knowledge of $\sigma_d^2$
    and $\sigma_z^2$. To remove this requirement, one may choose to set $c = 0$. However,
    the decision threshold would still depend on the noise variance $\sigma_z^2$.


    # Sliding-window detector


    This detector [21] uses a sliding window summing $r_i$ over $N_P$ consecutive
    samples and taking the maximum. The test statistic is


    $Y \triangleq \left| \sum_{i=\tau}^{\tau+N_P-1} r_i \right|, \quad (4.88)$


    A simple extension of this detector [1] is obtained by taking $K$ OFDM symbols
    instead of one:


    $Y \triangleq \left| \sum_{i=\tau}^{\tau+N_P-1} A_i \right|, \quad (4.89)$


    Setting the decision threshold of this detector requires knowledge of the value
    of $\sigma_z^2$.


    # 4.5 Effects of imperfect knowledge of noise power


    The calculations presented before in this chapter can be used to compare the performance
    of various detectors based on their receiver operating characteristics (ROCs),
    which in turn are highly dependent on the SNR and on the sensing time $N$. Increasing
    the latter yields a performance improvement, but only under the optimistic assumption
    that the model used in the analysis is infinitely accurate. Since this assumption
    can not hold in the real world (for example, noise is never perfectly Gaussian,
    or white, or wide-sense stationary), it happens, as shown in this section, that
    model uncertainties may impose fundamental limitations on the performance of the
    detectors, as we shall discuss soon, by a lack of robustness in the detector.
    In this section and the next we shall examine how imperfect channel modeling can
    affect spectrum sensing.'
