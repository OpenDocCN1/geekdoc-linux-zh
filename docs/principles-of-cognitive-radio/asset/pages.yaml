  md: 'minimum average rate, maximum peak rate, limited delay, bounded jitter, etc.
    In order to satisfy the QoS guarantees, each layer in the protocol stack optimizes
    a set of utility functions with a view to achieving the global objectives (QoS
    agreements) across the network. There may be interdependencies across operations
    in each layer, but it may be in the designer’s interest to bring down the complexity
    of the system by reducing the dependencies across the layers. For instance, the
    network layer specifies the appropriate routes for the individual flows in the
    network. The decision to choose a particular route may be based on some metric
    chosen according to the QoS requirements of each session. In most cases, the routing
    metric is a function of the service delays and the average rates supported by
    the links. Moreover, the routing decisions may have to be updated at regular intervals
    of time to account for the variation of the parameters in underlying layers.


    The MAC/PHY layers solve the resource allocation problem. These layers specify
    the rate and power allocation, transmission strategy, and schedule for links in
    the network. The power allocation strategy on a link depends on the channel conditions
    (its knowledge or lack thereof at each transmitter node), constraints on the transmission
    power due to device limitations, and the overall interference of other transmitters
    in its neighborhood. The instantaneous rate obtained in a link depends on the
    underlying channel propagation parameters, modulation and coding scheme used at
    the transmitter, signal processing employed at the receiver, and the interference
    in the neighborhood of the receiver. In general, a MAC scheme specifies a set
    of rules for transmissions in the network. The choice of rules depends on the
    amount of resources allocated to them. Addressing the resource allocation problem
    in the MAC/PHY layer taking into account all these variables can be mathematically
    intractable [7].


    Many individual aspects in different layers of a multihop network have been addressed
    by the research community by making simplifying assumptions on the rest of the
    network. In particular, there have been numerous advances in the physical layer
    technologies over the past two decades – adaptive modulation, reliable coding
    schemes (e.g., LDPC codes, turbo codes, etc.), hybrid ARQ schemes, OFDM, MIMO
    processing, cooperative diversity schemes, multiple access techniques, multiuser
    diversity schemes, to name a few. However, most of the cross-layer design approaches
    addressed in the literature make simple and specific assumptions on the underlying
    physical layer technology. The impact of these advanced physical layer techniques
    needs better understanding in a practical set-up of a multihop network supporting
    end-to-end flows [76].


