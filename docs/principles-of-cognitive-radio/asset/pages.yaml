  md: 'Rate-splitting and superposition coding can also be applied to treat interference
    in overaly cognitive radio networks. An overaly cognitive radio shares its bandwidth
    with one or more primary users, thereby creating interference at the primary receivers.
    At the same time, the secondary receivers experience interference from the primary
    user transmissions. Efficiently coping with interference can thus improve the
    performance of both secondary and primary users in the system. We will see that
    in overaly cognitive radio systems there exists a regime of strong interference
    in which decoding of the unwanted data sequences is optimal. Similarly, there
    is a weak interference regime in which interference can be treated as noise without
    loss of optimality.


    Furthermore, cognitive capabilities enable radios to deploy transmission strategies
    that cannot be deployed in interference channels without cognition. By listening
    to the channel, a secondary user can obtain information about primary user data
    sequences, assuming the security and privacy concerns of the primary user can
    be addressed. The secondary user can then cooperate with the primary user by relaying
    this information (or a part of it) to the primary receiver, thereby improving
    the primary user''s performance. If the secondary user allocates part of its power
    to relay the primary data sequence and the rest of its power to transmit its own
    information, then the power split should be chosen such that the resulting SINR
    ratio at the primary receiver yields the same or better performance than if the
    secondary user was not present.


    In summary, when compared to wireless networks with no cognition, a cognitive
    radio can cope with interference using techniques developed for interference channels.
    In addition, cognition enables the secondary encoder to protect its own information
    from the interference caused by the primary system by precoding against interference.
    These techniques will be described in more detail in Section 2.7.


    # 2.5 Underlay cognitive radio networks


    The underlay approach to cognitive radio allows for spectrum sharing between primary
    and secondary users, under the constraint that the interference caused by secondary
    users does not noticeably degrade the performance of the primary users. When the
    performance of a primary user is measured by its SINR in each signal dimension,
    the interference that secondary users cause to any primary user is typically constrained
    to be within a given spectral mask, i.e., a limit on the PSD of the interference
    over frequency and, for MIMO channels, over space. The interference constraint,
    in turn, imposes a constraint on the total PSD per dimension received from all
    secondary transmitters at any primary receiver. Alternatively, an average interference
    constraint may be defined whereby the interference power, averaged over all signal
    dimensions, is below a given threshold. In order to satisfy the interference constraint,
    several different conditions can be imposed on the secondary transmission. When
    primary and secondary users experience time-varying channels, the primary users''
    performance requirements may be based on meeting a given peak interference constraint
    at each time instant or constraining the average interference over time. An alternative
    underlay paradigm does not impose constraints on interference but rather on the
    minimum value of the primary user''s capacity.'
