    the database through the Internet to make sure it would not produce interference
    to nearby primary users before it starts transmission. The query is periodic in
    case some primary users want to initiate operation in the vicinity. These requirements
    provide a reliable shield between primary users and secondary users for the purpose
    of their coexistence. However, the new ruling does not explicitly designate how
    coexistence is to be managed among the secondary users. The presence of the geolocation
    database can facilitate the Nash bargaining mechanism by providing global network
    state information to all nodes in the network.


