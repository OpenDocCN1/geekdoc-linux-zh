  md: 'of them are cyclostationary, which means that some of their statistics exhibit
    periodicity (in particular, the mean and the autocorrelation function of a wide-sense
    cyclostationary process are periodic functions of time) [14]. Cyclostationarity-based
    detection consists of analyzing the cyclic autocorrelation function of the received
    signal, which is periodic for data signals, but aperiodic for noise and, more
    generally, for wide-sense stationary signals [12, 13]. The periods in the primary
    signals are related to carrier frequency, symbol, chip, code, hop rate, etc.,
    and they can often be assumed as known (notice, however, that synchronization
    errors may affect this detection procedure). This technique works well even in
    very-low SNR regions or with uncertainty in the value of noise power, where energy
    detection might fail. In addition, it can discriminate among useful signals and
    interferences whenever the latter are either stationary, or cyclostationary with
    different periods.


    For motivation, consider the linearly modulated signal


    $$x(t) = \sum_{n} a_{n} g(t - n T_{0}), \qquad -\infty < t < \infty, \tag{4.36}$$


    where $T_{0}$ is the symbol period, $g(t)$ the modulation pulse, and the data
    sequence $(a_{n})$ is assumed to form an identically distributed wide-sense stationary
    sequence with mean 0 and autocorrelation $r_{n-m} \triangleq \mathbb{E}[a_{n}
    a_{m}^{*}]$. The mean of $x(t)$ is zero, and its autocorrelation function is given
    by


    $$A_{x}(t, \tau) \triangleq \mathbb{E}[x(t + \tau) x^{*}(t)]$$

    $$= \sum_{n} \sum_{m} r_{n-m} g(t + \tau - n T_{0}) g^{*}(t - m T_{0}). \tag{4.37}$$


    It can be observed that, with $n, m$ extending from $-\infty$ to $\infty$, $A_{x}(t,
    \tau)$ in (4.37) is a periodic function of $t$ with period $T_{0}$. Consequently,
    it can be expanded in a Fourier series as


    $$A_{x}(t, \tau) = \sum_{n} A_{x}^{\alpha}(\tau) e^{j2\pi \alpha t}, \qquad \alpha
    \triangleq n / T_{0} \tag{4.38}$$


    with "Fourier coefficients" $A_{x}^{\alpha}(\tau)$ defined by


    $$A_{x}^{\alpha}(\tau) \triangleq \frac{1}{T_{0}} \int_{-T_{0}/2}^{T_{0}/2} A_{x}(t,
    \tau) e^{-j2\pi \alpha t} dt, \qquad \alpha = n / T_{0}. \tag{4.39}$$


    Based on the above example, we define a wide-sense cyclostationary process $x(t)$
    as one whose mean $\mathbb{E}[x(t)]$ and autocorrelation function $A_{x}(t, \tau)$
    are periodic functions of $t$. The Fourier coefficients (4.39), interpreted as
    a function of $\tau$, form the cyclic autocorrelation function (CAF) of $x(t)$,
    with $\alpha$ called cyclic frequency (the choice $\alpha = 0$ yields the standard
    autocorrelation function of $x(t)$). The cyclic spectral density (CSD) of $x(t)$
    is defined as the Fourier transform of $A_{x}^{\alpha}(\tau)$:


    $$S_{x}^{\alpha}(f) \triangleq \int_{-\infty}^{\infty} A_{x}^{\alpha}(\tau) e^{-j2\pi
    f \tau} d\tau. \tag{4.40}$$


    Now, if $T_{0}$ is known for the primary signal, then the CAF can be used to detect
    its presence by evaluating $A_{x}^{\alpha}(\tau)$. In fact, for a cyclostationary
    signal, a nonzero cyclic'
