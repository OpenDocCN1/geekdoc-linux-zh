    $$I(X ; Y)=\sum_{\mathcal{X}, \mathcal{Y}} p(x, y) \log \left(\frac{p(x, y)}{p(x)
    p(y)}\right) . \tag{2.4}$$


    The log function is typically with respect to base 2, in which case the units
    of mutual information are bits per channel use, since input $\mathcal{X}$ and
    output $\mathcal{Y}$ correspond to a single use of the channel.


