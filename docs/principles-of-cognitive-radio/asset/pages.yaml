    # ## 2.4.1 K-user interference channels


    In cognitive radio networks, we would like to characterize capacity associated
    with communications between primary user pairs and between secondary user pairs.
    Although one could envision deployment of relays to improve the performance, these
    networks typically do not involve multipath routing of information, i.e., there
    is no forwarding of information through intermediate nodes. Without cognition,
    networks with K source-destination pairs can be modeled as a K-user interference
    channel, as shown in Fig. 2.10. Although the capacity region of this channel is
    in general unknown, there has been a lot of progress in understanding how to cope
    with interference in this model and, consequently, in developing spectrally-efficient
    transmission schemes for this channel. In some scenarios, these techniques lead
