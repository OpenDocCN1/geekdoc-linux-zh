  md: '# 3.7.5 Dispersion


    the phenomenology of Doppler dispersion is subtly different from the case of mobile
    terminals. In the latter case, the angular spectrum of the MPCs as seen from the
    terminal, together with the velocity vector of the terminal, determines the Doppler
    spectrum. A change of the magnitude of the velocity scales (compresses or dilates)
    the Doppler spectrum, but does not change its shape. For fixed terminals, the
    Doppler shift of the MPCs is created by moving scatterers, each of which has not
    only a different angle of the associated MPC at the terminal, but also a different
    velocity. The random time variation of the return for a sinusoidal transmitted
    signal is largely caused by the back-and-forth motion of wind-blown tree branches
    and leaves (outdoor environments) or by the motion of people (indoor environments).
    In these cases, the power density spectrum of the received signal is found to
    be concentrated in the center of its frequency range, which is quite different
    from the Jakes spectrum (see Fig. 3.7a).


    The amount of hard data on Doppler spectra for fixed terminals is sparse. What
    is established is that the width of these spectra tends to be related to wind
    (or people) speed; is inversely related to wavelength; and is of the order of
    1 Hz in microwave bands. A useful and simple model, derived for wireless LANs
    and reported in [26], can be written in the following compact way:


    $S_d(\nu) = [1 + (\nu/\nu_0)^2]^{-1};\quad \nu_0 = 1/9\lambda,\qquad (3.36)$


    where the wavelength $\lambda$ is in meters. A similar shape and width apply to
    outdoor fixed wireless systems, as reported in [25]. For the spectrum in (3.36),
    $A(\Delta t)$ is a two-sided decaying exponential, $\exp(-2\pi\nu_0|\Delta t|)$.


    The Doppler spectrum describes the spreading of a signal from its transmission
    as a single sinewave to its reception: it starts with zero bandwidth (i.e., its
    frequency spectrum is an impulse function) and is received with a nonzero bandwidth
    (specifically, $2\nu_{\max}$). This dispersion of the spectrum from an impulse
    function to a spread in frequency is called *frequency dispersion*.


    Another form of dispersion relevant to wireless channels is the spread in angle-of-arrival
    due to multipath scatter: on an ideal LOS path, there is only one component reaching
    the receiver, so the AOA spectrum is an impulse function. The reality in wireless
    environments, however, is a *spread* of arriving angles, which constitutes *angle
    dispersion*. (As we have shown, it is the angle dispersion that produces frequency
    dispersion, so these are not separate phenomena.) The topic of angle dispersion,
    and how to model it based on empirical data, is elaborated upon in Section 3.9.


    The next section deals with *delay dispersion*, whereby a radio impulse sent into
    the channel emerges as a set of echoes with a nonzero range of delays, as in the
    case of multipath scatter. In the process, we will provide a formal distinction
    between “wideband” channels and the “narrowband” channels we have discussed in
    this section and the previous one.'
