    # ### 1.7.3 Analog-to-digital converters


    In addition to antenna design, yet another cognitive radio design challenge is
    the RF front-end. As discussed in Section 1.2.4, cognitive radios are likely to
    operate in the UHF TV bands utilizing the unused TV channels. The UHF bands have
    good propa-gation characteristics for long range communications. For short ranges,
    cognitive radios find opportunities of using the $3 \sim 10 \mathrm{GHz}$ band.
    Regardless of the operating frequency, the front-end of a cognitive radio receiver
    needs to be wideband, as the cognitive trans-mitter could potentially transmit
    on any of the unused bands. This necessitates the cognitive radio receiver front-end
    to provide for wideband signal reception, from the antenna to the analog-to-digital
    converter (ADC). There will be stringent requirements placed on the linearity
    of the RF analog circuits. The ADC will have to sample at $\mathrm{GHz}$ rates
    if it operates over $\mathrm{GHz}$ of bandwidth. Further, the cumulative interfering
    signals over a wide band could be stronger than the signal of interest, leading
    to SINRs as low as $\sim 50 \mathrm{~dB}$. The cognitive radio signal cannot be
    amplified enough to achieve sufficient quantization accuracy. For example, to
    achieve a $20 \mathrm{~dB}$ signal to quantization noise ratio, the required resolution
    of the ADC needs to be on the order of 12 bits or greater if the SINR is $\sim
    50 \mathrm{~dB}$. This level of accuracy with $\mathrm{GHz}$ sampling rates results
    in an essen-tially infeasible ADC implementation if there are power and cost constraints,
    since the power and ADC complexity rises nearly exponentially with the number
    of bits. One way of increasing the SINR is to eliminate the interference by estimating
    it and sub-tracting it off [91]. Other solutions include adaptive notch filtering,
    banks of RF filters using MEMS technology, and spatial filtering using RF beamforming
    through adaptive antenna arrays [29].


