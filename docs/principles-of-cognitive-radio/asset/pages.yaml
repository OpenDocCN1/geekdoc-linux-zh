- pgno: 16
  md: '# # Preface


    The radio spectrum is one of the most important resources for communications.
    Tradi- tionally, spectrum governance throughout the world has tended towards exclusivity
    of its use in large geographic areas, allocating frequency bands for specific
    applications and assigning licenses to specific users or service providers. This
    policy has gener- ated a shortage of frequencies available for emerging wireless
    products and services, as most frequencies are now assigned. Moreover, exclusivity
    creates underutilization of the spectrum, as very rarely can all licensees make
    full use of the frequencies assigned to them. These facts have motivated the search
    for technologies able to alleviate the arti- ficial scarcity of spectrum by adapting
    to changing environmental and network-usage conditions.


    What is perhaps the most natural among these technologies involves *opportunistic*
    use of the spectrum, whereby *secondary* (unlicensed) users are able to occupy
    the por- tions of the spectrum left temporarily free by the licensed *primary*
    users. The stringent requirement here is that secondary users should not interfere
    with the primary users, which this paradigm of operation (later called *interweaving*)
    achieves using the simplest form of orthogonalization, one that only requires
    knowledge of the state of a frequency band, i.e., whether it is free or occupied.
    The fact that the spectrum can be shared by pri- mary and secondary users, with
    the latter exploiting their cognition of the environment in which transmission
    is taking place, has led to the development of the concept of *Cog- nitive Radio*
    (CR), whose idea was first introduced in [1] in 1999. Further paradigms, potentially
    more efficient than interweaving, have subsequently emerged. In the *under- lay*
    paradigm, the secondary transmitter overlaps in frequency with the primary user,
    after making sure that the interference level it causes is below a given threshold.
    The *overlay* paradigm assumes that the secondary user has knowledge of the primary
    user’s transmission scheme and of the channel, and uses this knowledge by choosing
    a trans- mission scheme that causes an irrelevant amount of interference.


    In its multiple aspects, CR is now widely regarded as one of the most promising
    technologies for future wireless communications, a technology that may potentially
    mitigate, through dynamic spectrum access, the radio spectrum scarcity problem.
    The US Federal Communications Commission has approved the use of mobile devices
    in unused television bands, and there is considerable support worldwide for this
    new con- cept. Wide interest in the field has also been displayed in academic
    research. Since CR theory is still in its early stage, there is a need for a book
    describing the principles on which CR is based, and laying out in a unified way
    the background needed for further'
  merge: -1
  img_proc: true
- pgno: 17
  md: 'developments and innovative applications. This background blends propagation
    theory, information theory, detection theory, optimization theory, networking,
    and signal processing. Given the importance of the discipline, and the number
    of unique features that characterize it, this book, which covers the fundamental
    aspects of CR and especially those that are the most promising for commercial
    implementation, should be of considerable interest to researchers and practitioners
    in this field.


    This book is organized into five chapters, each meant to be self-contained (with
    the possible exception of Chapter 5, which may need knowledge of material in Chapter
    4 if the reader is not conversant with the basics of detection theory). Chapter
    1 introduces the concepts of CR, illustrates the present and future of spectrum
    management policies, and examines network design and standardization activity.
    Chapter 2 is devoted to the information-theoretic aspects of CR. Specifically,
    it develops the fundamental capacity limits, guidelines for the spectral efficiency
    possible in CR using each of its three paradigms, as well as practical design
    ideas to optimize performance. These fundamental limits are based on the amount
    of side information that can be gathered about the radio environment and can be
    used to improve spectrum utilization as well as the complexity of the CR technique
    employed. Chapter 3 describes the propagation channels that are typical of CR
    environments, and presents models for path loss, Doppler spectrum, delay spread,
    and other relevant features. These models are useful to both designers and analysts,
    who need to characterize the spectral, temporal, and spatial variations of the
    channel responses in CR networks. Chapter 4 describes techniques for spectrum
    sensing, to be used in interleaving and underlay. Interleaving involves the classification
    and the performance analysis of a number of decision rules intended to identify
    spectral regions that are empty and hence can be used by secondary users, while
    underlay is treated by introducing the concept of interference temperature. Finally,
    Chapter 5 contains the discussion of a number of advanced topics related to spectrum
    exploration and exploitation. These include techniques, such as distributed, sequential
    and quickest detection, that are important in optimizing spectrum sensing and
    identifying available spectral opportunities. This chapter further explores high-level
    methodologies, including dynamic programming, bandit problems, reinforcement learning,
    and game theory, in the context of their applications to sensing and access policy
    design for CR systems. We hasten to observe here that space limitations prevent
    us from covering the whole range of CR-related topics. In particular, this book
    does not cover many of the networking aspects of CR, protocols, and standardization
    efforts.


    Our presentation of the subject aspires to combine the features of a textbook
    and a guide through the research literature. Thus, the book is aimed at graduate
    students and researchers, as well as at practitioners in industry. Having an emphasis
    on principles, it can be used as a textbook in a beginning-graduate course entirely
    devoted to CR, or as a complementary book in courses devoted to wireless communications.
    It was written assuming no special prerequisite knowledge for reading it, beyond
    the usual contents of basic communication, information theory, and signal processing
    courses given in standard electrical engineering curricula. These basics are extended
    here to the theoretical aspects of CR that are specific to this new technology.'
  merge: -1
  img_proc: true
