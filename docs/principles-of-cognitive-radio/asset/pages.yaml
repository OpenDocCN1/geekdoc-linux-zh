  md: '# 3 Propagation issues for cognitive radio


    Larry J. Greenstein, Andreas F. Molisch, and Mansoor Shafi


    # 3.1 Introduction


    The fundamental principal of cognitive radio (CR) is to detect other radios in
    the environment that are using the same spectral resources, and to then deploy
    transmission and reception strategies that permit secondary users to communicate,
    while minimizing interference to and from those radios. For the design, analysis,
    and implementation of such transmission and reception strategies, it is essential
    to understand the relevant propagation channels [80]. The power emitted by a transmitter
    (TX) might be determined by the system designer, but it is the channel that dictates
    how much of it arrives as useful power at the intended receiver (RX), and also
    how much interference it creates at unintended receivers. Similarly, the signal
    sensing process of the CR system might be determined by the system designer, but
    it is the channel that dictates the intervals in time, frequency, and space at
    which samples should be taken. For example, the temporal variation rate of the
    channel response dictates how often samples are needed and, thus, how often transmit
    or receive strategies might have to be adapted. As we will see, many other properties
    of the channel influence CR design and analysis as well.


    # 3.1.1 Propagation in the cognitive radio bands


    CRs may be deployed over a wide range of the frequency spectrum. The bands below
    about 3.5 GHz have relatively low propagation loss and are sought after by all
    services. These bands are therefore ideal candidates for the deployment of CR.
    They have different incumbent (primary) systems, each with its own mix of service
    type, architecture, bandwidth, and resilience to interference. A partial description
    of these bands is in Chapter 1.


    In CR bands, as in most other bands, transmitted signals are affected by the propagation
    in a number of ways. They undergo attenuation, the local spatial average of which
    – expressed in decibels – is called the path loss. This is a large-scale property
    of the channel, in that it changes mildly over distances of a great many wavelengths.
    There is also a small-scale variation of signal level, for a given value of path
    loss, which is due to the presence of multiple signal paths; this is called multipath
    fading and is characterized by rapid fluctuations in signal level over distances
    of a radio wavelength. The multiple paths arise from scattering, reflection, and
    diffraction related to objects and structures in the physical environment and
    can lead to serious signal distortion. The properties of'
  merge: -1
  img_proc: true
- pgno: 130
  md: 'wireless channels can vary with carrier frequency and signal bandwidth. For
    example, large-scale properties like the path loss tend to increase linearly with
    the logarithm of the carrier frequency; by contrast, small-scale properties like
    the signal distortion are relatively insensitive to carrier frequency but their
    effect can depend a lot on the service bandwidth. All of this pertains to both
    primary and secondary (i.e., cognitive) radios, and so both radio types require
    good channel models to enable effective designs.


    Here, we provide an overview of the propagation models that might be used by CR
    system designers and researchers. These models can help to determine, via analysis
    or simulation, potential CR interference to primary systems; and they can dictate
    the design of transmission formats, routing algorithms, and control schemes for
    mitigating interferences from CRs. Moreover, because the spectrum acquired for
    CR use may span a wide and fragmented range, propagation models are needed for
    a wide variety of frequencies and bandwidths. We stress that the physical propagation
    channel is independent of whether the radio is cognitive or not. However, the
    issues of what aspects of the channel are important, and thus have to be modeled
    especially carefully, are different. For example, a special feature of CR is the
    strong potential of interference to primary users, which can occur under all CR
    paradigms (interweave, underlay, and overlay, Chapters 1 and 2).


    # 3.1.2 Impact of propagation on sensing


    The energy-sensing process is influenced in a myriad of ways by the propagation
    channel. For example:


    +   - The signal level at a sensor (part of the secondary system) is determined
    by the path loss of the link between this sensor and the primary transmitter,
    as well as by the large-scale and small-scale fading of this link. The signal
    level, in turn, influences the tradeoff between the false-alarm probability (spectrum
    is declared occupied even though it is free) and the missed-detection probability
    (spectrum is declared empty even though it is occupied by a primary user), as
    discussed in Chapter 4.

    +   - When wideband sensing is used, the signal levels are different at different
    frequencies, due to the frequency-selectivity of small-scale fading and, possibly,
    the frequency dependence of the path loss as well. Knowledge of these effects
    is essential for building appropriate wideband sensors.

    +   - When distributed sensing is used (Chapter 5), knowledge of the correlation
    of the channel characteristics from the primary transmitter to the sensors is
    required. Such knowledge includes the path loss laws and the correlation statistics
    of the shadowing.

    +   - When antenna arrays are used for sensing, the angular spread determines
    the correlation of the signals at the different antenna elements, and thus helps
    determine the optimum detection process.

    +   - Further improvements of the detection process can be achieved when sensing
    data are averaged over time. In order to perform proper averaging, the secondary
    system needs to know both the transmission statistics of the primary system and
    the temporal variability of the channel.'
