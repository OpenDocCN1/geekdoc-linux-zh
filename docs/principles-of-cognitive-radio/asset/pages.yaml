    # Impact of quantization and reporting-channel errors


    Using binary local decisions in a distributed decentralized detection system reduces
    the communication cost at the expense of a loss of information. Hard-decision-based
    sensing schemes are popular because of their simplicity. Using soft decisions
    such as log-likelihood ratios or their quantized versions typically leads to improvement
    in performance. It is commonly argued that soft-decision-based sensing approaches
    increase significantly the amount of data to be transmitted. This is not necessarily
    true since there may be significant overhead related to frame structure and different
    layers of the communication protocol stack used in transmitting the sensing results
    to the fusion center. That overhead will be present even if only binary decisions
    are transmitted. Consequently, the difference in the amount of data transmitted
    and bandwidth requirements compared to sending quantized soft-decision statistics
    may be small. Moreover, individual sensors may also convey information about interference
    levels, channel quality (SNR, SINR), and occupancy information. Such side information
    helps in managing interference, making access and scheduling decisions as well
    as utilizing the spectrum more efficiently.


