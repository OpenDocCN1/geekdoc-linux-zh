    be treated as noise without loss of optimality. In this scenario, decoding part
    of an interfering data sequence to partially remove interference from the received
    signal is beneficial. This idea is realized in the scheme developed by Carleial
    and subsequently improved by Han and Kobayashi, also referred to as rate-splitting
    [11, 40]. The rate-splitting concept is illustrated in Fig. 2.12. To perform rate-splitting,
    each encoder divides its data sequence into two data subsequences, each of lower
    rate than the original sequence, and encodes them via superposition coding, which
    was originally developed for the broadcast channel [16]. In superposition coding,
    the source encodes each of the two data sequences using separate but correlated
    codebooks. Specifically, it encodes the first data sequence based on the optimal
    input distribution, and the second data sequence based on the optimal conditional
    distribution between the two data sequences. Separate encoding enables each receiver
    to decode one of the data subsequences intended for the other user jointly with
    its own data sequence, while treating the signal carrying the other undesired
    data subsequence as noise. The communication rate for this user increases due
    to reduced interference, but the rate for the other communicating pair decreases
    due to an additional decoding constraint. Hence, there is a tradeoff between the
    amount of information sent only to the desired receiver and the amount of interference
    decoded at the other receiver.


    In AWGN interference channels, this encoding tradeoff translates into optimizing
    the power allocated to each of the two parts of the encoder’s data sequence. By
    choosing Gaussian codebooks, i.e., random codebooks generated according to a Gaussian
    distribution, and a specific power split, the Han-Kobayashi scheme achieves rates
    within one bit per dimension from the two-user interference channel capacity [26].
    The power split is chosen so that the created interference at each receiver has
    the same power as the Gaussian noise at that receiver. Thus, the created interference
    is sufficiently weak so as not to significantly impair performance. At the same
    time, the undesired data sequence that is decoded at each destination allows for
    significant interference reduction. In Section 2.7 we will give more details on
    how rate-splitting can be used in overlay cognitive radio networks.


    In a K-user interference channel, each receiver is exposed to interference arriving
    from multiple sources. A generalization of the Han-Kobayashi scheme would allow
    for partial decoding of each interfering signal. A receiver could then jointly
    decode its own data sequence along with some portion of the interfering data sequences
    dictated'
