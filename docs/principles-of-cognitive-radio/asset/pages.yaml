- pgno: 119
  md: 'As explained earlier, gains also depend on the amount of information that the
    cognitive radio is able to collect about the primary user transmissions.


    For overlay channels, results that incorporate time variations in the channel
    model are scarce. One possible approach to model time variations is to assume
    that channel parameters depend on the random state sequence. In a point-to-point
    channel when the encoder knows the random state, this approach leads to the Gel''fand-Pinsker
    problem discussed earlier in this section. Overlay channels with a state were
    analyzed in [82]. This model generalizes the overlay channel that assumes constant
    channel gains. The paper develops inner and outer bounds for overlay channels
    with a state, and establishes capacity in the weak interference regime.


    Another important aspect of the overlay channel capacity is the impact of imperfect
    channel state information (CSI) at the cognitive encoder. The lack of channel
    knowledge will affect all cognitive encoding schemes. With phase uncertainty at
    the cognitive encoder, DPC cannot be applied directly. Hence this uncertainty
    precludes canceling interference and results in significant performance loss [37].
    In this case, feedback about channel state information to the cognitive encoders
    could be very beneficial. Relaying strategies can be realized without CSI at the
    transmitter, but would require CSI at the receiver [51]. However, CSI at the transmitter
    could allow for additional relaying approaches (e.g., beamforming) and thus further
    improve the network performance.


    # 2.7.3 K-user overlay networks


    Analysis of the two-user overlay channel focuses on a single secondary pair and
    a single primary pair. Yet, as in the interweave networks, multiple secondary
    and multiple primary users in the overlay network can simultaneously share the
    same spectrum. As with the two-user overlay case, in this more general setting
    we also seek efficient ways to minimize interference among users.


    We have seen in Section 2.4 that for the K-user interference channel, generalizing
    the rate-splitting approach as a way to cope with interference from multiple senders
    is too complex. Moreover, this approach can be outperformed by collective treatment
    of interference via interference alignment or structured codes. Not surprisingly,
    interference alignment as well as structured codes are promising approaches for
    the K-user overlay cognitive radio network as well. These techniques could be
    deployed by cognitive nodes to reduce the interference at both the primary and
    the cognitive receivers. But in contrast to the encoders in interference channels,
    secondary users can also perform relaying of primary messages, and precoding against
    interference. The interplay between these techniques is not yet well understood
    and presents an important and interesting research topic.


    Another interesting problem is the impact of cognition when present at different
    points in the network. In particular, not only encoders but also (or only) decoders
    can be cognitive. This will significantly impact the available encoding and decoding
    techniques. No cognition at the encoder will preclude both cooperation and precoding
    techniques. On the other hand, it will enable decoders to directly cancel interference.
    The'
