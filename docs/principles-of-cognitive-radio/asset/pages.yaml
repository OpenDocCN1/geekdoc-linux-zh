    # 4.7 Summary


    This chapter was primarily devoted to spectrum sensing under the interweaving
    CR paradigm (a brief mention of underlaying was based on the concept of interference
    temperature and its application). Spectrum sensing, which consists of detecting
    the presence of active primary users, was described as a binary detection problem.
    A number of techniques to solve this problem, and a discussion of their complexity
    and performance, were included (energy sensing, coherent detection, cyclostationarity-based
    detection, autocorrelation-based detection). Application of spectrum sensing to
    OFDM was given special attention. The effects on spectrum-sensing performance
    of an imperfect knowledge of noise power and of other sources of disturbance were
    finally examined.


    # 4.8 Further reading


    The basics of detection theory, as well as further details, can be found for example
    in [35] or in [22]. The survey papers [19, 30, 46] and the doctoral dissertation
    [29] describe a number of spectrum sensing techniques (wavelet-based detection,
    multipaper spectral estimation, etc.) that were not covered in this chapter. Chapter
    5 will be devoted to more advanced techniques.


    Due to its large number of potential applications, the problem of detecting a
    deterministic signal in noise by means of an energy-measuring device has attracted
    much attention. Ref. [45] is among the first papers containing its solution for
    a signal in additive'
