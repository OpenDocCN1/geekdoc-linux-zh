    power constraint $\mathcal{P}$, **Y** is the vector of all channel outputs, **H**
    $\in \mathbb{R}^{K\times K}$ is the channel gain matrix and **Z** is the vector
    of independent, unit-variance Gaussian noises at the destinations. The cut-set
    bound in (2.21) evaluates to [24]


    ```

    $$\sum_{s_k \in \mathcal{S}, d_k \in \mathcal{S}^c} R_k \leq W \log_2 \det \left(\mathbf{I}
