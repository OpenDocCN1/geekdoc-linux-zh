    # 3.8.4 The power delay profile, P(τ)


    For the assumed complex Gaussian statistics, the MPC phases are uniformly random
    over the small-scale fading, and the mean of c_m(t) is zero. Then, the only parameter
    needed to characterize the first-order statistics of c_m(t) is its mean-square
    value. This raises the topic of power delay profile (PDP), which plays a prominent
    role in analyzing and simulating wireless channels.


    A formal mathematical definition of the PDP is


    \mathcal{P}(\tau) = (1/W) \mathbb{E}_t \{ |\hat{h}(t, \tau)|^2 \}, \tag{3.42}


    where \mathbb{E}_t denotes expectation over a time interval where small-scale
    fading happens.⁷ This formal definition can run into mathematical problems when
    \hat{h}(t, \tau) is a discrete sum of impulses, bandlimited or otherwise. One
    popular alternative is to define the PDP itself as a sum of impulses along the
    τ-axis, having the delays of the MPCs (τ₁, ..., τ_N) as in (3.37), and with the
    power P_n at delay τ_n being |a_n|². This approach is especially useful in ultra-wideband
    channels, where the individual MPCs are resolvable in delay. For more conventional
    wideband channels with many MPCs per delay bin (the case considered here), the
    PDP can instead be a sum of impulses at'
