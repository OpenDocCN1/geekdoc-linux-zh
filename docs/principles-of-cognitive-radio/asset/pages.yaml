- pgno: 111
  md: 'have been derived for a single-hop interweave network where multiple secondary
    users transmit in the presence of a single primary user in [92]. This work defined
    the notion of a *primary exclusive region*, or PER, around the primary transmitter.
    Secondary transmitters cannot operate within this PER, and the distance between
    a secondary user’s transmitter and receiver must be less than some specified distance.
    These two constraints restrict the amount of interference a secondary transmitter
    can cause to the primary receiver, and hence its outage probability, thereby enabling
    a closed-form derivation of scaling laws. The capacity was found to scale *linearly*
    with the number of secondary users, in contrast to the classical sublinear scaling
    in Gupta and Kumar’s result, where multihop routing was assumed. These interweave
    scaling law results were extended in [46] to a network with multiple primary as
    well as multiple secondary users, along with multihop routing. This work assumes
    that the locations of the primary user transmitters and receivers are known by
    the secondary network, and also that the primary network is less dense than the
    secondary network. The multipath routing protocols assume a *preservation region*
    around each primary node such that the secondary users route their traffic around
    these regions. If this routing protocol is shown to achieve almost the same scaling
    law as if the primary network was absent, while the primary network throughput
    is subject to only a fractional loss that decreases asymptotically. Specifically,
    a $K_{p\cdot r}$-user primary network achieves a throughput scaling of $\sqrt{K_{p}}
    = K_p^{0.5}$, while a $K_{s}$-user secondary network achieves a throughput scaling
    of $K_{s}^{0.5-\delta}$ for any $\delta > 0$ with arbitrarily small probability
    of outage. Similar scaling laws under the same model, constraints, and assumptions
    were obtained in [100], however in this work the location of the primary receivers
    was unknown. Hence preservation regions were only formed around the primary transmitters.
    This paper also showed that the same throughput-delay tradeoff as was obtained
    in [22] for a single asymptotically large network can be achieved by both the
    primary and secondary networks as the number of each type of user grows asymptotically.
    These results assume that the relative density of the primary users relative to
    the secondary users remains the same as the number of users grows.


    # 2.7 **Overlay cognitive radio networks**


    The motivation for overlay cognitive radio networks is to exploit intelligent
    radio capabilities to their fullest: (1) from the information-theoretic point
    of view, the interweave constraint of orthogonal transmissions used by secondary
    and primary communicating pairs is unnecessarily restrictive and, as such, reduces
    capacity; (2) cognitive capabilities can be exploited more broadly than just for
    spectrum hole detection.


    For these reasons, and in contrast to interweave networks, overlay cognitive radio
    networks allow for concurrent secondary and primary transmissions over the same
    dimensions. Furthermore, in contrast to both interweave and underlay networks,
    in overlay networks a secondary transmitter may improve the communication of a
    primary user. In this setting, relaying and techniques for coping with interference
    become key tools to maximize the performance of both primary and secondary users.'
