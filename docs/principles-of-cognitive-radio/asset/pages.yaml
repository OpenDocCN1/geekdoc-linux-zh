  md: '# 4.4.2 Detection based on second-order statistics


    The notation will be made simpler here if we redefine $N$ as $N = K(N_P + N_D)
    + N_D$. Now, consider the sample products


    $$r_i \triangleq y_i^* y_{i+N_D}, \quad i = 0, \dots, K(N_P + N_D) - 1. \tag{4.82}$$


    A key observation here is that, because of the repetition of data in the cyclic
    prefix, $y_i$ and $y_{i+N_D}$ may not be independent under $\mathcal{H}_1$, and
    hence the expected value of $r_i$ is nonzero even if $\mathbb{E} y_i = 0$. This
    property can be exploited for detection. Define the average sample value products


    $$A_i \triangleq \frac{1}{K} \sum_{k=0}^{K-1} r_{i+k(N_P+N_D)}, \quad i = 0, \dots,
    N_P + N_D - 1. \tag{4.83}$$


    Under hypothesis $\mathcal{H}_0$, all $A_i$ are identically distributed, while,
    under $\mathcal{H}_1$, $N_P$ samples $|A_i|$ will exhibit a different (and significantly
    larger for small noise) value than the remaining $N_D$. In fact, for $N_P$ consecutive
    indices $i$ we have $x_i = x_{i+N_D}$, while $x_i$ and $x_{i+N_D}$ are independent
    for the other $N_D$ indices. Thus, spectrum sensors can be designed which detect
    whether or not the $A_i$ are independent and identically distributed, or their
    statistics depend on $i$.


    Defining the vector $\mathbf{A} \triangleq [A_0, \dots, A_{N_P+N_D-1}]^\mathrm{T}$,
    and using the generalized likelihood-ratio test (4.16), we obtain the test statistic


    $$Y \triangleq \log \frac{\max_{\sigma_w^2,\sigma_z^2} p(\mathbf{A} \mid \mathcal{H}_1,
    \sigma_w^2, \sigma_z^2)}{\max_{\sigma_w^2} p(\mathbf{A} \mid \mathcal{H}_0, \sigma_w^2)}.
    \tag{4.84}$$


    Details of the structure and the performance of these sensors are described in
    [1].


    Other spectrum sensors, based on second-order statistics of OFDM signals, have
    also been advocated. Hereafter, we describe some of them (a quantitative comparison
    of their performance is contained in [1]).


    # **Autocorrelation detector**


    The test statistic proposed in [4] consists of the empirical mean of the products
    $r_i$, normalized by the received power:


    $$Y \triangleq \frac{\sum_{i=0}^{(N_P+N_D)-1} \overline{A_i}}{N^{-1}(N_P+N_D)
    \sum_{i=0}^{N-1} |y_i|^2}, \tag{4.85}$$


    where $\overline{A_i} \triangleq \Re\{A_i\}$. This detector does not need the
    value of the noise variance $\sigma_z^2$. On the other hand, it does not exploit
    the fact that, under $\mathcal{H}_1$, the observed signal is nonstationary.'
