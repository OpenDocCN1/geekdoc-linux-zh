    # 4.6 Effects of an inaccurate model of interference


    The basic model of the observed signal, enriched by the introduction of the additive
    interference $i_n$, is


    $y_n = x_n + i_n + w_n, \quad n = 0, \ldots, N-1. \tag{4.110}$


    All random quantities appearing in (4.110) are assumed to be independent of each
    other. The two probabilities of false-alarm and missed-detection become


    $P_{\text{FA}}(W,I) \triangleq \mathbb{E}_{W,I}\{ \mathcal{D}_N = \hat{\mathcal{H}}_1
    \mid \mathcal{H}_0 \}, \tag{4.111}$

    $P_{\text{MD}}(W,I,X) \triangleq \mathbb{E}_{W,I,X}\{ \mathcal{D}_N = \mathcal{H}_0
    \mid \mathcal{H}_1 \}, \tag{4.112}$


    where W, I, and X denote the probability density functions of $w_n$, $i_n$, and
    $x_n$, respectively. Calculation of (4.111) and (4.112) assume that W, I, and
    X are perfectly modeled, which is a situation occurring very seldom in practice.
    A realistic assumption is that little (or even very little) is known about the
    interference statistics. Here we examine the situation in which $i(t)$ is incompletely
    known: we assume in particular that only its amplitude range and maximum power
    are known, and derive the conditions under which coherent and energy sensors fail
    to achieve the desired performance. Analysis can be carried out using moment-bound
    theory [10, 24]. This allows us to characterize all pdfs satisfying the known
    constraints on the interference, and derive those yielding maximum and minimum
    values for $P_{\text{FA}}$ and $P_{\text{MD}}$. We first summarize the basics
    of moment-bound theory in a form suitable to solve our problem; next we show how
    the performance of coherent and energy sensors can be bounded above and below,
    and how these sensors behave asymptotically.


    # 4.6.1 Basics of moment-bound theory


    Let $I$ denote a random variable (RV) with cumulative distribution function (CDF)
    defined in the finite interval $\mathcal{J} \triangleq [a, b]$. Let $k_1(x)$ and
    $k_2(x)$ be two continuous functions defined over $\mathcal{J}$. The moment space
    $\mathcal{M}$ is defined as the (closed, bounded, and convex) set of the pairs


    $\left( \int_{\mathcal{J}} k_1(x) \, dG(x), \int_{\mathcal{J}} k_2(x) \, dG(x)
    \right) \tag{4.113}$'
