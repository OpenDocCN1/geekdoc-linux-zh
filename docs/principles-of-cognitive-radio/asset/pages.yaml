- pgno: 183
  md: '| $\hat{\mathcal{H}}$ | $\mathcal{H}$ | cost |

    |---|---|---|

    | $\hat{\mathcal{H}}_0$ | $\mathcal{H}_0$ | $C_{00}$ |

    | $\hat{\mathcal{H}}_1$ | $\mathcal{H}_0$ | $C_{10}$ |

    | $\hat{\mathcal{H}}_0$ | $\mathcal{H}_1$ | $C_{01}$ |

    | $\hat{\mathcal{H}}_1$ | $\mathcal{H}_1$ | $C_{11}$ |


    Table 4.1 Decision costs for Bayes criterion.


    where $\pi_1$ and $\pi_0 = 1 - \pi_1$ are the a priori probabilities of hypotheses
    $\mathcal{H}_1$ and $\mathcal{H}_0$, respectively. In the special case of no cost
    for correct decisions ($C_{00}=C_{11}=0$) and equal costs for false alarms and
    missed detections ($C_{01}=C_{10}=1$), the risk becomes the average error probability.


    # Minimax criterion


    Using definitions (4.9)–(4.10), we can rewrite (4.11) in the form


    $$\mathcal{R}=C_{00}(1-\pi_1)(1-P_{\text{FA}})+C_{10}(1-\pi_1)P_{\text{FA}}+C_{01}\pi_1P_{\text{MD}}+C_{11}\pi_1(1-P_{\text{MD}}),\tag{4.12}$$


    which shows that, for a given set of costs and a given detector, the risk is an
    affine function of $\pi_1$. Thus, if the value of $\pi_1$ is not known, it may
    make sense to select a decision rule that minimizes the maximum value taken by
    the risk as $\pi_1$ ranges in $[0,1]$.


    # Neyman–Pearson criterion


    In certain circumstances, it may be unrealistic to assign costs to all four detection
    outcomes. If this is the case, then the Neyman–Pearson criterion can be used.
    This consists of minimizing $P_{\text{MD}}$ subject to a constraint on the probability
    of false alarm, viz., $P_{\text{FA}}\le\alpha$. Notice how this criterion admits
    a basic asymmetry in the importance of the two hypotheses.


    # Likelihood-ratio test


    Central to the Neyman–Pearson criterion is the log-likelihood ratio

    $$\Lambda\triangleq\log\frac{p(y\mid\mathcal{H}_1)}{p(y\mid\mathcal{H}_0)},\tag{4.13}$$

    i.e., the logarithm of the ratio between the conditional pdfs of the observation
    under hypotheses $\mathcal{H}_1$ and $\mathcal{H}_0$. The decision in favor of
    $\mathcal{H}_1$ or $\mathcal{H}_0$ is made by comparing $\Lambda$ against a threshold
    $\psi$:

    $$\begin{array}{c}\mathcal{H}_1\\\Lambda\gtreqless\psi.\\\mathcal{H}_0\end{array}\tag{4.14}$$'
