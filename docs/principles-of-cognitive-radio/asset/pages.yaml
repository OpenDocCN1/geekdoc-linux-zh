    # 2.3.2 Mathematical definition of capacity


    Shannon''s *Mathematical Theory of Communication* [76, 77, 79] defined the capacity
    of a single-user channel, denoted by $C$, in terms of the mutual information between
    the input and output of the channel. Moreover, Shannon showed that this capacity
    equals the maximum data rate at which bits can be transmitted with arbitrarily
    small error probability, assuming there are no constraints on the encoder or decoder
    complexity and delay. In Shannon''s transmission scheme data is embedded in a
    channel code and the data rate corresponds to the transmission rate of the embedded
    information bits. Specifically, for any $R < C$ and any $P_{e} > 0$ Shannon proves
    that there exists a channel code with data rate $R$ and error probability $P_{e}$.
    Moreover, codes operating at data rates $R > C$ cannot achieve an arbitrarily
    small error probability and, in fact, such codes have an error probability that
    is bounded away from zero.


    The most basic discrete-time channel model for which mutual information is defined
    consists of a random input $X \in \mathcal{X}$ (also called a symbol), a random
    output $Y \in \mathcal{Y}$, and a probabilistic relationship between $X$ and $Y$
    which is generally characterized by the conditional distribution of $Y$ given
    $X$, or $p(y|x)$. For continuous random variables $p(y|x)$ is a probability distribution
    function (pdf) and for discrete random variables it is a probability mass function
    (pmf). In this notation, random variables are denoted by capital letters (e.g.,
    $X$) while their realizations and probability distributions are denoted by small
    letters (e.g., $x$ and $p(x)$, respectively). If the channel has memory, such
    that the output $y_{n}$ at a given time $n$ depends on the current as well as
    past inputs $x^{n} = (x_{1}, \dots, x_{n})$, then the input, output, and probability
    distribution are defined in terms of vectors $X^{n}$, $Y^{n}$, and $p(y^{n}|x^{n})$.
    The channel is said to be *memoryless* if the channel output at any time $n$ is
    independent of past inputs, i.e., if $p(y_{n}|x^{n}) = p(y_{n}|x_{n})$. The *mutual
    information* of a discrete-time memoryless single-user channel, assuming continuous
    input and output random variables, is defined as'
