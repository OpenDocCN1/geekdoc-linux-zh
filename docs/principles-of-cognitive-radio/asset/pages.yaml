    # 3.6.2 Temporal fading on mobile radio links


    So far we have discussed signal fading as a random-like variation over space,
    i.e., over potential mobile locations on the ground. What translates this spatial
    process into a temporal process is the fact that a mobile terminal moves over
    the ground, and as it does it will experience fading, in time, of its received
    signal strength. Thus, the Rayleigh/Ricean fading descriptions given above materialize
    as temporal processes in mobile operation. The higher the speed of the mobile,
    the more rapid is the fading. The correlation distance can be mapped into a correlation
    time; to a first approximation, we can say that the receive amplitude remains
    constant within a correlation time. This is captured in the Doppler spectrum and
    autocorrelation function, elaborated upon in Section 3.7.


    # 3.6.3 Temporal fading on fixed wireless links


    The notion of temporal fading on a fixed wireless path may seem strange at first,
    because we have been explaining it as a random time variation of the signal level
    received by a mobile terminal. We recall that fading arises from the presence
    of many received MPCs, each with a phase that is highly sensitive to both antenna
    position and signal frequency (or wavelength). The result is that the net received
    signal magnitude is a random-like function of both position and frequency. In
    a mobile terminal, it is the variation over space that produces the temporal fading
    of the received signal. In fixed wireless, the two ends of a link are nonmoving,
    so whereas the fading over frequency can be discerned, one would not expect to
    see temporal fading. That such fading exists nonetheless leads us to a different
    way of thinking about and modeling the Ricean $K$-factor.


    In a mobile link, a mobile traces out the spatial fading as it moves, thus the
    scaling factor between distance traveled and time elapsed being the mobile speed,
    $v$. Thus, if $E(x)$ is the field variation along the mobile direction $x$, then
    the temporal variation is just $E(vt)$. In a fixed wireless link, the variation
    is due instead to the fact that some scattering objects are moving, a prime example
    being wind-blown leaves and limbs of trees. In fixed wireless systems operating
    in suburban residential areas, trees can be a large factor in producing temporal
    fading of received signal strength. Moving cars and people can have a similar
    impact in wireless ad hoc networks and wireless LANs.


    This also implies that the $K$-factor needs to be interpreted in a different light.
    It is not the ratio of the LOS power to that of the scatterer component anymore.
    Rather, it is the ratio of the powers of the temporally fixed MPCs to that of
    the temporally varying MPCs. In a completely static environment, this $K$-factor
    is infinity, independent of whether a line-of-sight exists or not. In order to
    distinguish this $K$-factor from the one described in Section 3.6.1, it is often
    called the temporal Rice factor.'
