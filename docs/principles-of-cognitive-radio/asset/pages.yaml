  md: 'of secondary interference exceeds the primary users’ threshold, so that some
    of the secondary users stop transmitting to reduce the total interference below
    the required level.


    Treating interference as noise is also used in the capacity analysis of interweave
    networks. However, unlike in underlay networks, interweave capacity analysis requires
    that the dynamics associated with detection of primary user activity, as well
    as the probability of missed detection and false alarm, be incorporated into the
    capacity analysis. To capture these dynamics, the secondary user’s interweave
    channel in the four-node case is modeled as a switch. When the switch is ON, the
    secondary user has detected a spectrum hole (lack of primary user activity) and
    transmits. When the switch is OFF, the secondary transmitter is silent, and the
    primary user experiences no interference. If a spectrum hole is correctly detected,
    then the secondary user experiences no interference; when the spectrum hole is
    incorrectly detected, both the secondary and primary users transmit simultaneously
    and interfere with each other’s transmissions. Given the time variations of the
    switch, under perfect detection the secondary user’s channel can be modeled as
    a two-state channel corresponding to the switch being ON or OFF. Using this model,
    the ergodic and outage capacities are derived. Under imperfect detection both
    the primary and secondary user channels have three states. For the secondary user’s
    channel, the switch can be OFF or ON; when the switch is OFF there is no transmission,
    when the switch is ON, the spectrum hole can be correctly (resulting in no interference)
    or incorrectly (primary user interference) detected. Since the secondary user
    is not aware of false detections, the correct capacity metric is capacity versus
    outage, which can be computed based on the probability of missed detection and
    the SNIR that results due to primary user interference. Similarly, the primary
    user experiences interference from the secondary user due to missed detection,
    and its capacity versus outage can be computed based on this missed detection
    probability and the SNIR resulting from secondary user interference. These capacity
    calculations can be generalized to multiple primary and secondary users by generalizing
    the models for missed detection and false alarm along with the resulting interference.


    Overlay networks do not treat interference as noise. Instead, novel encoding and
    decoding strategies are used by the secondary users to enhance the performance
    of the primary users while obtaining some spectral resources for their own transmissions.
    These encoding techniques include rate-splitting, whereby one user splits its
    data sequence and encodes it via superposition coding such that a part of this
    sequence can be decoded and removed by the receiver of the other user. In the
    overlay network, this would allow the secondary transmitter’s interference to
    be removed by the primary receiver. However, this interference removal requires
    a modified decoder for the primary user, so it is not applicable when the primary
    system is oblivious to the secondary system in terms of its design or operation.
    In addition to rate-splitting, the secondary encoder uses its knowledge of the
    primary user’s encoded data sequence to enhance the transmission of the sequence
    to the primary receiver via a cooperative protocol. Finally, knowledge of the
    primary user’s data sequence allows the secondary transmitter to employ Gelfand–Pinkser
    encoding, or binning, to precancel the interference that the primary user causes
    to the cognitive receiver. Similarly, if the primary user knows the'
