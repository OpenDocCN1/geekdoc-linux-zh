- pgno: 76
  md: 'the maximum rates possible for all $K$ users simultaneously. Shannon capacity
    of wireless single-user and multiuser channels is known in many cases, including
    static and time-varying single-user, broadcast and multiple access channels with
    noise, fading, multipath, and/or multiple antennas [4, 18, 33].


    Time-varying channels are typically modeled based on the notion of a *channel
    state*. The channel state $s$ lies within a given set $\mathcal{S}$ of all possible
    channel states, which may be discrete or continuous. For stationary and ergodic
    time-varying channels, at any given time the channel is assumed to be in state
    $s$ with probability $p(s)$, and we denote the channel capacity in state $s$ as
    $C(s)$. This model is also referred to as a *composite channel* [21]. The Shannon
    capacity or capacity region of a time-varying stationary and ergodic channel with
    channel state known at the receiver(s) is therefore called the *ergodic capacity*,
    since it corresponds to the data rate or rate region in a particular channel state
    (e.g., a particular fading value) averaged over the probability distribution of
    the channel states (e.g., the fading distribution):


    $$C_{\text{erg}} = \int_{s \in \mathcal{S}} C(s) p(s) ds. \qquad\qquad\qquad\qquad\qquad\qquad\qquad\qquad\qquad
    (2.1)$$


    When the channel state is known at the transmitter(s), the transmission strategy
    and system resources are typically adapted to the time-varying channel so that
    $C(s)$ denotes the capacity or capacity region of the channel in state $s$ with
    transmit parameters such as power and rate optimally adapted over all channel
    states.


    An alternative performance metric for stationary and ergodic time-varying channels
    is *outage capacity*, whereby transmission to one or more users is suspended in
    some channel states, deemed *outage states*, and a fixed transmission rate is
    used in the nonoutage states. The average data rate associated with outage capacity
    is then the maximum fixed rate that can be achieved in nonoutage states with asymptotically
    small error probability, multiplied by the probability of nonoutage (since the
    data rate is zero in outage states). The maximum fixed rate for nonoutage states
    is typically determined based on the worst-case channel state that is not an outage
    state. Specifically, for a given set of outage states $\mathcal{S}_{\text{OUT}}$
    with $P(s \in \mathcal{S}_{\text{OUT}}) = P_{\text{out}}$, the nonoutage states
    are $\mathcal{S}''_{\text{OUT}} = \mathcal{S} - \mathcal{S}_{\text{OUT}}$, and
    the outage capacity is given by


    $$C_{\text{OUT}} = \left( 1 - P_{\text{out}} \right) \left[ \min_{s \in \mathcal{S}''_{\text{OUT}}}
    C(s) \right]. \qquad\qquad\qquad\qquad\qquad\qquad\qquad\qquad\qquad\qquad\qquad
    (2.2)$$


    The outage capacity metric is based on the underlying assumption that the transmitter
    knows the channel state and hence can suspend transmission during outage states.
    Thus, the transmission strategy is binary: no transmission in outage states and
    fixed-rate transmission in nonoutage states. Outage capacity cannot exceed Shannon
    capacity, since the latter adapts transmission parameters such as power and rate
    to each channel state. However, outage capacity is a useful metric for applications,
    such as voice and video, that require fixed-rate transmission. By allowing for
    suspension of transmission in some states, outage capacity achieves a higher average
    rate than if a single rate must be maintained in all channel states, including
    very poor ones.'
