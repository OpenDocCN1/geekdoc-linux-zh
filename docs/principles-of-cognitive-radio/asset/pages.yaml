  md: 'of rays spaced at τ = i/W, i = 1, 2, 3, … The amplitudes of the rays in the
    cluster decay exponentially with τ, with the decay constant being variable from
    one path to another. For every ray in the exponential cluster, the amplitude is
    an average over local spatial samples, and the pdf of the spatial variability
    is a Gamma function.


    For the exponential-log normal model, reported in [37], the PDP shape is similar
    to that of the exponential model, except that the exponential cluster is multiplied
    by a correlated lognormal process over τ. Several parameters of this model are
    found to be functions of distance along the path. This model is more complicated
    than the exponential one, requiring more model parameters.


    For the cluster model, reported in [79], the PDP is a sum of several exponential
    clusters, with the starting delay of each cluster being variable from one path
    to another. Similarly variable are the τ-positions of the rays within each cluster,
    rather than being uniformly spaced at intervals of 1/W. This model is a variation
    on the Saleh-Valenzuela cluster model devised for wideband (as opposed to ultra-wideband)
    indoor channels [95].


    In all three of the above PDP models, the major difference from traditional wideband
    models is that the ray amplitudes are not Rayleigh-fading; because each ray is
    a sum of just a few MPCs, these amplitudes have narrower fading distributions
    (e.g., a lognormal pdf with dB standard deviation 3.4 dB, as in [79]). A detailed
    description of, and comparisons among, the three models is given in [46].


    # 3.9 Angle dispersion


    # 3.9.1 Directions of arrival and departure


    The MPCs are characterized not only by their delays, but also by their directions.
    An MPC leaves the TX in a certain direction (determined by the location of the
    first scatterer it will encounter), and arrives at the RX in a certain direction
    (similarly determined by the position of the last scatterer before arrival). Since
    there are many MPCs, which can depart and arrive in different directions, a multipath
    channel leads to angular dispersion. This dispersion is very important for CR.
    For one thing, it determines the ability of adaptive antennas to transmit into
    directions such that they will not disturb other users located in certain directions
    (see Chapter 2). A small angular spread offers the possibility of precisely focusing
    beams into particular directions.


    Conversely, a large angular spread can lead to gain decorrelations, for antenna
    elements spaced by just a fraction of a wavelength. This phenomenon can aid diversity
    via use of multiple elements and maximal ratio combining [96, Section 10.5]; or
    it can increase capacity via multiple co-frequency streams, as in multiple-input/multiple-output
    (MIMO) links [10]. Such MIMO-based capacity gains can benefit CR systems in the
    interleaving mode, by offsetting capacity losses caused by remaining silent during
    primary transmissions. Finally, angular dispersion is strongly related to Doppler,
    as we have shown in Section 3.7, and therefore influences the temporal variations
    (correlation times) of CR channel responses.'
