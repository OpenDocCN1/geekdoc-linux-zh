  md: '# ### 1.8.2 Cross-layer scheduling in cognitive radio networks


    The nodes of a cognitive radio network can interact in a variety of arbitrary
    ways. To distill these interactions, we see that each radio follows a transmission
    policy that results in signals that vary over time, frequency, and space. This
    variation may be the result of adaptation to measurements of channels or interference.
    The performance of a particular signaling strategy depends on each receiver''s
    ability to resolve signals in the presence of interfering transmissions. In the
    realm of cognitive radio networks, two distinct sets of issues emerge. First,
    for a given set of transmitter and receiver technologies and a specified set of
    performance constraints, one must resolve the multidimensional boundaries of system
    performance. This is a difficult problem, even if complete system state information
    is available to all network nodes. Second, the collection of intelligent adaptation
    policies of the individual nodes constitute a large distributed system for spectrum
    allocation. A given set of distributed information gathering and exchange mechanisms
    may greatly influence the performance of the system.


    These issues could be viewed separately. The boundaries of system performance
    can be examined under the assumption that efficient open access to spectrum can
    be resolved by impartial spectrum servers (as described in Section 1.6.2) that
    can obtain information about the interference environment through measurements
    contributed by different terminals, and then offer suggestions for efficient coordination
    to interested service subscribers. The spectrum server could play the role of
    a centralized scheduler that uses full knowledge of the network configuration
    to specify the activity patterns of the individual links. Upper-bounds on the
    performance of distributed adaptive routing and scheduling methods can then be
    provided based on the performance of the spectrum server.


    Figure 1.14 shows a multi-hop wireless network transporting data from the source
    (node 1) to the destination (node 6) in a series of hops. In general, a network
    could have many simultaneously active sessions, each specified by an origin-destination
    pair. Each session may split its traffic into multiple flows through distinct
    routes in the network. For instance, Fig. 1.14 shows the session from node 1 to
    node 6 split into two flows through the network. The sessions may individually
    demand QoS requirements such as


    ![](img/2d42983cf592ef4fc8a22646ddc49799_56_0.png)


    **Figure 1.14** An example of a simple multihop network. The solid arrows are
    instances of links in the network and dotted lines show a flow through the network.'
