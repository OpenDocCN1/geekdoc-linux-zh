  md: '# # 2 Capacity of cognitive radio networks


    Andrea Goldsmith and Ivana Marić


    # ## 2.1 Introduction


    This chapter develops the fundamental capacity limits and associated transmission
    techniques for different cognitive radio network paradigms. These limits are based
    on the premise that the cognitive radios of secondary users are intelligent wireless
    communication devices that exploit side information about their environment to
    improve spectrum utilization. This side information typically consists of knowledge
    about the activity, channels, encoding strategies, and/or transmitted data sequences
    of the primary users with which the secondary users share the spectrum. Based
    on the nature of the available side information as well as regulatory constraints
    on spectrum usage, cognitive radio systems seek to underlay, overlay, or interweave
    the secondary users'' signals with the transmissions of primary users. This chapter
    develops the fundamental capacity limits for all three cognitive radio paradigms.
    These capacity limits provide guidelines for the spectral efficiency possible
    in cognitive radio networks, as well as practical design ideas to optimize performance
    of such networks.


    While the general definition of cognitive radio was provided in Chapter 1, we
    now interpret that definition in a mathematically precise manner that can be used
    in the development of cognitive radio capacity limits. Specifically, in the mathematical
    terminology of information theory, it is the availability and utilization of network
    side information that defines a cognitive radio, which we formalize as follows.


    > > A cognitive radio is a wireless communication device that intelligently utilizes
    any available side information about the (a) activity, (b) channel conditions,
    (c) encoding strategies, or (d) transmitted data sequences of primary users with
    which it shares the spectrum.


    In the next section we describe these different cognitive radio paradigms in more
    detail. The fundamental capacity limits for each of these paradigms are discussed
    in later sections.


    # ## 2.2 Cognitive radio network paradigms


    We now describe the principle features of the underlay, overlay, and interweave
    paradigms. The underlay paradigm allows secondary users to operate if the interference
    they cause to primary users is below a given threshold or meets a given bound
    on'
  merge: -1
  img_proc: true
- pgno: 69
  md: 'primary user performance degradation. In overlay systems the secondary users
    transmit simultaneously at the same frequencies as the primary users; however,
    they over- hear the primary user transmissions, then use this information along
    with complex signal processing and coding techniques to maintain or improve the
    performance of primary users, while also obtaining spectral resources for their
    own communication. Under ideal conditions, these encoding and decoding strategies
    allow both the sec- ondary and primary users to remove all or part of the interference
    caused by other users. In interruptive systems the secondary users detect the
    absence of primary user signals in space, time, or frequency, and opportunistically
    communicate during these absences. For all three paradigms, if there are multiple
    secondary users then these users must share bandwidth amongst themselves as well
    as with the primary users, subject to their given cognitive paradigm. This gives
    rise to the medium access control (MAC) problem among secondary users similar
    to that which arises among users in conven- tional wireless networks. Given this
    similarity, MAC protocols that have been proposed for secondary users within a
    particular paradigm are often derived from conventional MAC protocols. In addition,
    multiple secondary users may transmit to a single sec- ondary receiver, as in
    the uplink of a cellular or satellite system, and one secondary user may transmit
    to multiple secondary receivers, as in the corresponding downlink. We now describe
    each of the three cognitive radio paradigms in more detail, includ- ing the associated
    regulatory policy as well as underlying assumptions about what net- work side
    information is available, how it is used, and the practicality of obtaining this
    information.


    # ### 2.2.1 Underlay paradigm


    The underlay paradigm, illustrated in Figs. 2.1 and 2.2, mandates that concurrent
    primary and secondary transmissions may occur only if the interference generated
    by the secondary transmitters at the primary receivers is below some acceptable


    ![](img/2d42983cf592ef4fc8a22646ddc49799_69_0.png)


    **Figure 2.1** The underlay paradigm: wideband signaling (e.g., spread spectrum).


    ![](img/2d42983cf592ef4fc8a22646ddc49799_69_1.png)


    **Figure 2.2** The underlay paradigm: transmit antenna array.'
  merge: -1
  img_proc: true
- pgno: 70
  md: 'threshold. The interference threshold may be defined with respect to a *spectral
    mask*, defined as the power spectral density (PSD) of the interference over all
    frequencies within the underlay frequency band. Alternatively, the interference
    threshold may be defined with respect to an average power constraint, equal to
    the integral of the interference PSD. A spectral mask is used when interference
    constraints vary across the band, e.g., when different primary systems occupy
    different parts of the underlay frequency band, and these systems have different
    sensitivities to interference. Rather than determining the exact interference
    it causes, a secondary user can spread its signal over a very wide bandwidth such
    that the interference PSD is below the noise floor at any primary user location.
    These spread signals are then despread at each of their intended secondary receivers.
    This spreading technique is the basis of both spread spectrum and ultra-wideband
    (UWB) communications [87]. Alternatively, the secondary transmitter can be very
    conservative in its output power to ensure that its signal remains below the prescribed
    interference threshold. In this case, since the interference constraints in underlay
    systems are typically quite restrictive, this limits the secondary users to short-range
    low-rate communications. Both spreading and severe restriction of transmit power
    do not require that the secondary user interference at primary receivers is determined.
    Rather, these underlay approaches adopt a conservative design whereby the collective
    interference of all secondary transmissions is small everywhere. This collective
    interference, sometimes called the *interference temperature* [12], is discussed
    in more detail in Section 4.2. Determining the exact interference a secondary
    transmitter causes to a primary receiver is one of the biggest challenges in underlay
    systems. The secondary user can determine this interference at a given primary
    receiver by overhearing a transmission from that primary user if the link between
    them is reciprocal. For MIMO systems, a secondary user only interferes with a
    primary user in their overlapping spatial dimensions. If the secondary user occupies
    only the null space of the MIMO primary receiver, no interference is caused, and
    hence this falls within the interweave paradigm discussed below, whereby the primary
    and secondary users occupy orthogonal spatial dimensions. The underlay paradigm
    is most common in the licensed spectrum, where the primary users are the licensees,
    but it can also be used in unlicensed bands to provide different classes of service
    to different users.


    # ### 2.2.2   Overlay paradigm


    The premise for overlay systems, illustrated in Fig. 2.3, is that the secondary
    transmitter has knowledge of the primary user’s transmitted data sequence (also
