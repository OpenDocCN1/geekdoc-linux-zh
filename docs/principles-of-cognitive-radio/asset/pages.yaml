    # 2.7.2


    Capacity results


    Determining the capacity region for the general overlay channel remains an open
    problem. However, as for the interference channel without cognition, the capacity
    has been determined for some regimes. The capacity in strong interference has
    been determined in [60, Thm. 5]. The capacity for the Gaussian channel in weak
    interference has been derived in [49, 95]. For a more general case that unifies
    the results under these two regimes, the capacity was determined in [70]. For
    a class of discrete memoryless cognitive Z-channels (i.e., channels where there
    is no interference at the primary receiver) in which only the receiver of the
    secondary pair suffers interference the capacity has been determined in [56].
    Capacity of a class of Gaussian cognitive Z-channels for the opposite case, when
    the interference is at the primary receiver, has been found in [47]. In each case,
    some combination of rate-splitting, cooperation, and/or binning achieves capacity.
    These regimes and their capacity-achieving encoding techniques are as follows.


    # 1 Strong interference [60]


    As in the interference channel, this is the regime in which both decoders can
    decode each other’s messages without rate penalty. In AWGN overlay channels, described
    by (2.33) with $X_1 = X_s$, $X_2 = X_p$, $h_{12} = h_{sp}$, $h_{21} = h_{ps}$
