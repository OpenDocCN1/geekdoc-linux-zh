  md: 'A simple way of fusing information gathered from several sensors is by combining
    linearly, possibly with equal weights, a suitable function of the observed samples.
    We assume here that there are $N_{SU}$ sensors, with the $k$th one observing the
    signal $$ y_{k,n}=h_k x_n + i_{k,n}+w_{k,n}, \quad k=1,\dots,N_{SU}, \tag{5.8}
    $$ where $h_k$ denotes the fading affecting the path between the primary source
    and the $k$th sensor, which we assume to remain constant during the observation
    interval, $x_n$ is the primary signal whose presence should be detected, $i_{k,n}$
    are interference terms, and $w_{k,n}$ the additive white Gaussian noises. All
    terms on the right-hand side of (5.8) are assumed, as usual, to be independent.


    # Cooperative energy detection


    The linear combination fusion technique has been advocated, in particular, for
    cooperative energy detection [50, 51, 127, 164, 187]. Each sensor $k$, $k=1,\dots,N_{SU}$,
    measures energy $$ \mathcal{E}_k \triangleq \sum_{n=0}^{N_s-1} |y_{k,n}|^2 \tag{5.9}
    $$ along an observation interval, where $N_S$ is the number of observations. The
    fusion center performs the linear combination $$ \mathcal{E}= \sum_{k=1}^{N_{SU}}
    a_k \mathcal{E}_k, \tag{5.10} $$ where $a_k$, $k=1,\dots,N_{SU}$, are the linear
    weights, and makes a global decision by comparing $\mathcal{E}$ against threshold
    $\psi$: $$ \mathcal{E} \overset{\mathcal{H}_1}{\underset{\mathcal{H}_0}{\gtrless}}
    \psi. \tag{5.11} $$


    Assuming conditional independence of observations and iid Gaussian signal and
    noise it follows that the optimal likelihood ratio test is equivalent to the linear
    weighting scheme in (5.10) with weights given by $a_k = |h_k|^2/(1+|h_k|^2)$ [127].
    Two other commonly employed linear weighting schemes are equal gain combining
    (EGC) [50, 51, 127] and maximal ratio combining (MRC) [127] in which the weights
    are given by $a_k=1$, $k=1,\dots,N_{SU}$, and $a_k=|h_k|^2$, $k=1,\dots,N_{SU}$,
    respectively. The MRC-based fusion scheme is attractive in the low SNR regime
    while the EGC-based fusion scheme is considered to be a good choice for combination
    under limited knowledge of channel state information. Another combining method
    is selection combining which employs the maximum value for global detection and
    compares that to a threshold, i.e., $\hat{\mathcal{E}}=\max\{\mathcal{E}_1,\dots,\mathcal{E}_{N_{SU}}\}$
    [50, 51].


    In practice, one rarely has the instantaneous channel state information necessary
    to use the optimal or MRC weighting schemes. However, if the second-order statistics
    of the squared magnitudes of the fading and primary user signals are known, one
    can also seek to optimize the weight vector to explicitly minimize the probability
    of missed'
