    \\ R_{p} \leq I\left(U, X_{p}; Y_{p}\right) \end{array}\right\}, \end{aligned}$$

    where the union is over all distributions $p(u, x_{s}, x_{p})$.

    Regimes of strong and weak interference for Gaussian channels with $\mathcal{P}_{s}=\mathcal{P}_{p}$
    for $h_{sp}, h_{ps} \geq 0$ are shown in Fig. 2.19.


    # **3 Better cognitive decoding regime [70]**


    This is the regime for which the condition

    $$I\left(U, X_{p} ; Y_{p}\right) \leq I\left(U, X_{p} ; Y_{s}\right)$$

    holds for any $p(u, x_{s}, x_{p})$.

    The capacity region is given by

    $$\begin{gathered} R_{s} \leq I(U, X_{s} ; Y_{s}| X_{p}), \\ R_{p} \leq I(U, X_{p}
    ; Y_{p}), \\ R_{s}+R_{p} \leq I(U, X_{p} ; Y_{p})+I\left(X_{s} ; Y_{s}| X_{p},
    U\right), \\ R_{s}+R_{p} \leq I\left(U, X_{s}, X_{p} ; Y_{s}\right). \end{gathered}$$

    Again, the random variable $U$ has the same role as in the Gelfand–Pinsker encoding,
    i.e., it is used for binning. In addition to binning and superposition coding,
    the encoding scheme requires rate-splitting at the cognitive encoder.


    # **4 Common information**


    If the cognitive decoder wishes to decode both data sequences, there is no interference
    at that decoder and hence there is no need for binning. Then, rate-splitting and
    superposition coding achieve capacity [48, 55].


    The capacity results presented above indicate that in order to maximize performance
    of cognitive radio networks, its users should be allowed to share the bandwidth
    and cope with the introduced interference via (partial) decoding, relaying or
    precoding. Gains from the various techniques depend on channel conditions and
    the network topology.'
