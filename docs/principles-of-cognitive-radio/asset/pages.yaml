  md: 'both single-user and collaborative distributed detection tasks. Moreover, in
    collaborative distributed spectrum sensing sequential detection algorithms may
    be used either only at the local sensors, only at the fusion center, or both at
    the local sensors and at the fusion center.


    In this section we will consider two sequential analysis problems. The classical
    sequential detection problem aims at distinguishing between two hypotheses from
    a sequence of identically distributed random observations. The objective of the
    classical sequential detection problem is to make a decision as quickly as possible
    given specified error levels. The second sequential analysis problem we consider
    is the quickest detection problem, in which the objective is to detect a change
    in the distribution of the observations as quickly as possible. The distribution
    of the random observations changes at some unknown point, and the objective is
    to detect the change point with minimal detection delay.


    # Sequential detection


    Let y1, y2, ... be a sequence of iid random observations with a common distribution
    F0 or F1. The hypothesis-testing problem of testing H0 against H1 may be formulated
    as


    H0 : y_n ~ F0, n = 1,2,...

    H1 : y_n ~ F1, n = 1,2,...

    (5.33)


    For simplicity we assume there are probability density functions p0 and p1 associated
    with F0 and F1, respectively. Sequential detection aims at deciding between these
    two hypotheses in a way that minimizes the number of observations given constraints
    on the error probabilities.


    The sequential probability ratio test (SPRT) of Wald [207] requires the minimal
    average number of observations under both hypotheses among all tests with equal
    (or smaller) error probabilities [208]. The stopping time of the SPRT is given
    by


    N_S = inf{ n ≥ 1 | Λ_n ≤ B or Λ_n ≥ A },

    (5.34)


    where Λ_n = ∏_{k=1}^n p1(y_k)/p0(y_k) is the likelihood ratio and A and B are
    upper and lower stopping boundaries, respectively. Thus, after each sample the
    SPRT accepts H1 if Λ_n ≥ A, or accepts H0 if Λ_n ≤ B, or if neither of the conditions
    is fulfilled, i.e., B < Λ_n < A, it takes an additional observation. The SPRT
    is illustrated in Fig. 5.6. The stopping boundaries A and B may in practice be
    chosen as

    A = (1 − β)/α and B = β/(1 − α), (5.35)

    where α and β are the constraints on the probability of false alarm and the probability
    of missed detection, respectively. This guarantees that the actual probabilities
    of false alarm P_FA and missed detection P_MD are bounded by

    P_FA ≤ α/(1 − β) (5.36)'
