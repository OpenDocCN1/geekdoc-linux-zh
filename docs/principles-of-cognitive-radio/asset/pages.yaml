- pgno: 103
  md: '# Secondary user broadcast channels


    The secondary user broadcast channel consists of a secondary transmitter broadcasting
    to $K$ receivers. Since there is only one secondary transmitter creating interference
    to the primary user, the interference constraint on the secondary system is similar
    to that of scalar channels. In particular, the received power constraint at the
    primary receiver translates to a transmit power constraint at the secondary transmitter.
    This holds for both static and fading channels. Hence, the capacity region of
    the secondary broadcast system is obtained using standard techniques for broadcast
    channels with an additional constraint on the transmit power imposed by the primary
    system.


    # Multiple primary users


    Since the capacity of multiuser networks is in general unknown except in certain
    special cases, this will also be true for networks with multiple primary users.
    However, for some specific topologies capacity can be determined under both average
    and peak interference power constraints. For example, for a network with multiple
    primary users and a single secondary user, the received peak power constraint
    translates to multiple transmit peak power constraints at the secondary transmitter.
    The optimal power allocation is then to choose the lowest peak power allowed by
    these constraints. When there are multiple primary and secondary users, the power
    of all the secondary users must meet the interference power constraints at all
    the primary users. Optimization techniques can be used to find power allocation
    solutions that satisfy these constraints.


    # 2.6 Interverweave cognitive radio networks


    The fundamental performance limits of interweave cognitive radios depend on assumptions
    about the overall system model as well as assumptions about the ability of the
    cognitive radio system to sense the interference it causes to primary users. In
    some cases these assumptions allow known capacity results or bounds to be applied.
    When detection is imperfect, the impact of missed detection and false alarms of
    primary user activity reduces capacity of both the secondary and primary users.
    In addition to capacity regions, scaling laws for interweave cognitive networks
    will be presented that indicate how capacity scales as the number of secondary
    users grows.


    This section focuses on the rate limits based on information-theoretic capacity
    of interweave channels. Specifically, we discuss Shannon capacity, outage, and
    ergodic capacity, as well as scaling laws. In addition to these information-theoretic
    limits, performance of interweave cognitive systems can also be limited by detection
    and hardware constraints. In particular, interweave systems with poor sensing
    capability will have high probabilities of missed detection and false alarm. Similarly,
    the frequency agility of the secondary transmitter and receiver front ends drive
    performance limits, since systems without sufficient agility cannot exploit spectrum
    holes whose locations are changing rapidly. Thus, in addition to capacity, the
    performance limits of interweave systems are affected by limits of the system
    and hardware sensing capability as well as the front end capabilities of the radios,
    as discussed earlier in Section 1.7.'
  merge: -1
  img_proc: true
