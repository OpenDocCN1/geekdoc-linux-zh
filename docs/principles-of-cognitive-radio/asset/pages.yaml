  md: 'actually taken actions by the policy. The action-value updates of the Sarsa-algorithm
    are defined by


    $$Q_{n+1}(s_n, a_n) = Q_n(s_n, a_n) + \alpha_n \left[ r_{n+1} + \gamma Q_n(s_{n+1},
    a_{n+1}) - Q_n(s_n, a_n) \right], \tag{5.80}$$


    where $\alpha_n$ ($0 < \alpha_n \le 1$) is a step size parameter (learning rate).
    Thus, the action-value function update is given by the temporal difference between
    the Q-values of the employed policy at time steps $n$ and $n + 1$ multiplied by
    the step size $\alpha_n$.


    Q-learning is an off-policy temporal-difference algorithm. Thus, the temporal-difference
    update of Q-learning does not necessarily employ the Q-values of the employed
    policy as on-policy algorithms, such as Sarsa, do. The action-value updates of
    Q-learning are given by


    $$Q_{n+1}(s_n, a_n) = Q_n(s_n, a_n) + \alpha_n \left[ r_{n+1} + \gamma \max_{a''
    \in A} Q_n(s_{n+1}, a'') - Q_n(s_n, a_n) \right]. \tag{5.81}$$


    The temporal difference update of Q-learning depends on the maximum Q-values of
    the possible actions. Note that for a greedy policy that always chooses the action
    with maximum Q-value the Sarsa and Q-learning algorithms are identical.


    The convergence of the action-value function $Q_n$ to the optimum $Q^*$ has been
    established for one-step Sarsa in [181] and for Q-learning in [73, 196, 216].
    The convergence is guaranteed with probability one if the agent employs a lookup-table
    to store the Q-values, visits every state-action pair infinitely many times, and
    $\sum_{n=0}^{\infty} \alpha_n = \infty$ and $\sum_{n=0}^{\infty} \alpha_n^2 <
    \infty$. Moreover, to ensure the convergence of one-step Sarsa, the learning policy
    must become greedy in the limit.


    The convergence requires infinite visits to every state-action pair. Intuitively
    this is easy to understand. In order to find out whether the current policy is
    optimal the agent must explore other actions than the ones given by the current
    policy as well. This presents the agent with the tradeoff between exploitation
    and exploration. That is, whether to exploit the current policy and choose the
    greedy action or to explore other actions instead to possibly find out some other
    action that provides a higher return than the greedy action. The $\epsilon$-greedy
    action selection is a simple method that balances between exploitation and exploration
    by selecting the action that maximizes the action-value function, i.e., $a^* =
    \max_a Q(s, a)$, with a probability $1 - \epsilon$, or a random action, uniformly,
    with a probability $\epsilon$ regardless of the action value function estimates.
    Another simple, yet effective, action selection method is the softmax action selection
    method. In the softmax method the action $a$ is selected with probability


    $$\pi(s, a) = \frac{\exp\left(Q(s, a)/\tau\right)}{\sum_{a'' \in A} \exp\left(Q(s,
    a'')/\tau\right)}, \tag{5.82}$$


    where $a \in A$ and $\tau$ is a positive parameter called the temperature that
    controls the weighting of different actions. Low temperatures increase the differences
    in the action selection probabilities while high temperatures cause all actions
    to be almost equiprobable. In the limit, when $\tau \to 0$, the softmax method
    corresponds to greedy'
