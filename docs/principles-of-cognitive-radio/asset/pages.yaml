    such that $|F(B_c)/F(0)|<k$, where $k$ has been given by different authors as
    0.5, 0.75, and 0.9. In [32], the coherence bandwidth is related to the delay spread
    via


    $B_c = \frac{\arccos(k)}{2\pi}\frac{1}{\tau_{\mathrm{rms}}}. \tag{3.45}$


    For $k=0.5$, this yields $B_c=1/6\tau_{\mathrm{rms}}$. Another approximation,
