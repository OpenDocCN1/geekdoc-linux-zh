    the final rooftop-to-street loss of the original model.


    Some path loss results for Type-D and Type-H paths are given in Fig. 3.4 for a
    transmitting antenna height of 30 m, a receiving antenna height of 10 m, and f_c
    = 600 MHz. Additional parameters h_roof =15 m and b =30 m are given in the urban
    model for the height of the rooftop and the distance between buildings, respectively.
    We note that these two models have not been empirically validated, although they
    build on prior measurement/modeling efforts for geometric scenarios with similar
    features.


    # 3.6 Small-scale fading and the Ricean K-factor


    We now turn our attention to the small-scale fading term, \hat{h}(\tau; \mathbf{x},
    \mathbf{F}). Recall that \mathbf{x} denotes the set of coordinates on the terrain
    for the TX and RX; and \mathbf{F} denotes the frequency interval of the signal
    of interest, with center frequency f_c and bandwidth W. To facilitate understanding,
    this initial treatment of small-scale fading will consider the extreme case where
    W shrinks to 0, i.e., small-scale fading for a single frequency, f_c. Later sections
    will generalize our treatment to the wideband case.


    It is obvious that, for a single frequency, \hat{h}(\tau; \mathbf{x}, \mathbf{F})
    becomes just a constant over \tau, dependent on \mathbf{x} and f_c. In short,
    it becomes the (normalized, complex) frequency response at f_c for the path between
    the TX and RX whose coordinates are given by \mathbf{x}. Thus, we can use the
    notation


    \hat{h}(\tau; \mathbf{x}, \mathbf{F}) \rightarrow \tilde{H}(f_c; \mathbf{x});
    single-frequency case. (3.16)


    Here, we will elaborate on the statistical variation of this complex amplitude
    over space in the vicinity of the location coordinates \mathbf{x}. For concreteness,
    we assume that the TX is at the base and fixed, and the RX is at the mobile and
    may be moving in the vicinity of its nominal location. If it does move, then the
    complex amplitude will vary with time as \mathbf{x} does.


    # 3.6.1 Spatial variation of field strength


    As noted, the electric field strength fluctuates rapidly over space if there is
    multipath scatter, as in typical wireless environments. This is because the field
    at a particular point is the sum of several components, as seen in the example
    of Fig. 3.5, where the mobile is moving to the right with velocity v. The receiving
    antenna sees the sum of'
  merge: -1
  img_proc: true
- pgno: 146
  md: '![](img/2d42983cf592ef4fc8a22646ddc49799_146_0.png)


    Figure 3.5 Multipath echoes arriving at a mobile receiver from all azimuth angles.


    the echoes or multipath components (MPCs), which are attenuated and phase shifted
    on their way from the transmitter to the receiver. Depending on the differences
    among the phase shifts, the summation of the MPCs can be constructive or destructive,
    and these differences change with mobile position.


    This effect can also be visualized as follows. The channel gain for each MPC can
    be represented by a complex vector. The combining of the MPCs at the receiving
    antenna is then equivalent to the addition of complex vectors. As the location
    of the receiver changes, the phase shift of each MPC changes, namely by (2π/λ)d
    cos(φ), where φ is the angle between the direction of the arrival of the MPC and
    the direction of movement. This fact further implies that the relative phases
    among the MPCs change, since they are arriving at the receiver from different
    directions. Thus, MPCs that interfere destructively at one location can interfere
    constructively at a different location. This variation over space is what we call
    either small-scale fading or multipath fading, as discussed in Section 3.3.


    If the net field, i.e., the superposition of waves, were sampled at many points
    within a radius of, say, 10λ, we would obtain a population of many (complex) samples.
    These can be interpreted as a statistical ensemble, whose values are describable
    using a probability density function (pdf). The most common and widely understood
    situation is the one where all the multipath components are of similar magnitude
    so that, in the limit of a great many components, their sum has a variation over
    space that resembles a complex Gaussian process. It has been shown that the phase
    of a complex Gaussian random variable (rv) has a uniform pdf over (−π, π]; and
    the magnitude r has a Rayleigh pdf [56, 76], i.e.,


    $$p_r(r) = \frac{2r}{\bar{P}_r} \cdot \exp\left[ -\frac{r^2}{\bar{P}_r} \right],
    \qquad r \ge 0, \tag{3.17}$$


    where $\bar{P}_r$ is the second moment of the distribution, i.e., the statistical
    average of $r^2$. In reality, the received power $P_r = r^2$ has an average value
    defined by its local spatial average $\langle P_r \rangle$. Thus, to the extent
    that (3.17) accurately models the distribution of $r$, the statistical average,
    $\bar{P}_r$, and the local spatial average $\langle P_r \rangle$ can be regarded
    as virtually the same. This case is referred to as Rayleigh fading.'
  merge: -1
  img_proc: true
- pgno: 147
  md: 'It is easy to derive the pdf of $\mathcal{P}_r = r^2$ from (3.17) and the result
    is


    $$p_{\mathcal{P}}(\mathcal{P}_r)=\frac{1}{\bar{\mathcal{P}}_r}\exp\left[-\frac{\mathcal{P}_r}{\bar{\mathcal{P}}_r}\right],\qquad
    0\le \mathcal{P}_r\le\infty.\tag{3.18}$$


    Using this equation the dynamic range between the 1st and 99th percentiles of
    Rayleigh fading can be readily be shown to be 26.6 dB. This signifies a great
    deal of small-scale fading within the local area of a receive antenna. Adding
    to this the large-scale spatial variation in path loss, $PL$, we see that sensing
    devices in CR networks must be capable of measuring over a very large dynamic
    range.


    It is clear from the above description that the received amplitude or power does
    not change abruptly, but rather continuously as the receiver moves along a trajectory.
    If all MPCs are coming from similar directions, then the rate of change as a function
    of distance along the trajectory is slow (because the relative phase changes among
    the MPCs are small); if the MPCs are coming from all directions, then the change
    is faster. A mathematical description of these facts is given by the spatial covariance
    function of the envelope


    $$\frac{\mathbb{E}_x\{(r(x)-\langle r\rangle)(r(x+\Delta)-\langle r\rangle)\}}{\mathbb{E}_x\{[r(x)-\langle
    r\rangle]^2\}}.\tag{3.19}$$


    If MPCs are arriving at the receiver uniformly from all directions, the "correlation
    distance," i.e., the distance $\Delta$ for which the correlation function is 0.5,
    is a fraction of a wavelength.


    In some cases, there is a dominant term among the many arriving MPCs, i.e., one
    whose magnitude is much higher than all others. This happens, for example, when
    there is a direct ray (LOS path) from the transmitter to the receiver. In this
    case, the vector sum of all arriving component magnitudes has a pdf called Rician,
    which is characterized by two parameters: (i) the power of the direct component,
    $\mathcal{P}_d$, and (ii) the local spatial average of the power sum of all the
    weaker (scatter) terms, $\mathcal{P}_s$. A more popular but equivalent parameter
    pair is the total spatial average of received power, $\mathcal{P}_d+\mathcal{P}_s$;
    and the ratio $\mathcal{P}_d/\mathcal{P}_s$. The former parameter can be recognized
    as the average received power, $\bar{\mathcal{P}}_r$, discussed in the previous
    section. The latter parameter is called the Rician $K$-factor, or Rice factor,
    or just $K$. It is a measure of how much local fading the signal undergoes over
    space. The pdf of the received amplitude can then be written as


    $$p_r(r)=2r\frac{\exp(-K)}{\mathcal{P}_s}\exp\left[-\frac{r^2}{\mathcal{P}_s}\right]I_0\left(\sqrt{\frac{4r^2K}{\mathcal{P}_s}}\right),\qquad
    0\le r<\infty.\tag{3.20}$$


    $I_0(x)$ is the modified Bessel function of the first kind and zero order [1].
    The associated pdf of the received power, $\mathcal{P}_r=r^2$, is then


    $$p_{\mathcal{P}}(\mathcal{P}_r)=\frac{\exp(-K)}{\mathcal{P}_s}\exp\left[-\frac{\mathcal{P}_r}{\mathcal{P}_s}\right]I_0\left(\sqrt{\frac{4\mathcal{P}_rK}{\mathcal{P}_s}}\right),\qquad
    0\le\mathcal{P}_r<\infty.\tag{3.21}$$


    Note that by replacing $\bar{\mathcal{P}}_s$ with $\bar{\mathcal{P}}_r/(K+1)$,
    each of the above two pdfs can be characterized in terms of the parameters $\bar{\mathcal{P}}_r$
    and $K$.'
  merge: -1
  img_proc: true
- pgno: 148
  md: 'When K is infinite, there is no fading (only a single component, e.g., an LOS
    term, as in free space) and when K = 0 (−∞ dB), there is Rayleigh fading as described
    above (no dominant component, only scatter). It is also noteworthy that in the
    general Ricean case, the phase is not independent of the amplitude anymore; in
    other words, the joint amplitude–phase distribution does not factor into a pdf
    of r times a pdf of the phase. We also note that, for an LOS component, the magnitude
    does not change rapidly over space but the phase does, while the scatter component
    changes rapidly in both magnitude and phase.


    There are little published data on K-factors for different environments and distances.
    It is conventional in mobile system studies to assume the fading is Rayleigh (K
    = 0), since this assumption generally leads to performance estimates on the conservative
    side. In Section 3.6.3, we will comment on links where both ends are fixed; and
