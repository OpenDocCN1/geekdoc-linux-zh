    # Cooperative autocorrelation detection


    Autocorrelation-based linear combining fusion with equal weights has been considered
    in [232]. The autocorrelation of signal (5.8) is


    A_{y_k}(τ) = E[y_{k,n+τ} y_{k,n}^*],   k = 1, …, N_SU,   (5.19)


    where we have assumed that y_{k,n}, k = 1, …, N_SU, are zero-mean. Then we have,
    with obvious notation derived from (5.8),


    A_{y_k}(τ) = |h_k|^2 A_{s_k}(τ) + A_{i_k}(τ) + A_{w_k}(τ),   k = 1, …, N_SU.   (5.20)


    The fusion center averages the received autocorrelations by computing


    A_y(τ) ≜ 1/N_SU Σ_{k=1}^{N_SU} A_{y_k}(τ)   (5.21)


    and uses autocorrelation-based detection; see Chapter 4. To do this, it should
    be assumed that the interfering signals received by different sensors are statistically
    independent and identically distributed, which makes it very likely that the sum
    (1/N_SU) Σ_{k=1}^{N_SU} A_{i_k}(τ) is vanishingly small for τ ≠ 0 for a sufficiently
    large number of sensors.


