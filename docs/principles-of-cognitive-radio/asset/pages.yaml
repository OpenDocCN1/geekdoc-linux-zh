  md: 'by the rate-splitting code design. While such a generalization is possible
    mathematically, it would result in very complex encoding and decoding schemes
    at each node. Specifically, this approach requires a receiver to *separately*
    decode parts of interfering data sequences sent from many interferers in order
    to reduce interference. Instead, the interference at each receiver can be treated
    *collectively* in a more efficient manner via *interference alignment* [7, 57]
    or via *structured codes* [65]. These approaches exploit the fact that a receiver
    is not interested in information associated with interfering data sequences and
    hence does not need to decode them (or parts of them). Interference alignment
    achieves the optimal capacity scaling law in the interference channel [69]. Lattice
    codes outperform the Hân–Kobayashi scheme in the $K$-user interference channel
    [83].


    The AWGN channel considered so far in this section assumes constant channel coefficients
    and hence does not capture flat or frequency-selective fading. Incorporating these
    channel characteristics leads in general to channel models that are more difficult
    to analyze. However, these characteristics open up possibilities for encoding
    and transmission strategies that exploit fading. In particular, frequency-selective
    and time-varying channels can be modeled as parallel interference channels [8].
    Results in [8] demonstrate that parallel interference channels are optimized by
    joint encoding across subchannels. This is in contrast to point-to-point, multiple
    access, and broadcast parallel channels in which separate encoding over the subchannels
    is optimal. Further exploration of $K$-user interference channels has revealed
    that time-variants can be exploited to combat interference in the form of interference
    alignment. Interference alignment relies on channel time-variants to achieve half
    of the interference-free capacity for each user in the system [7, 66].


    # 2.4.3  Interference channel techniques for cognitive radios


    In interference networks with no cognition, a plausible transmission scheme to
    avoid interference is to split the bandwidth and assign orthogonal channels to
    each communicating pair, e.g., via a MAC protocol that divides channels orthogonally
    in time, frequency, or space. In cognitive radio networks, this corresponds to
    the interweave approach to avoid interference between cognitive and primary users.
    However, in general, dividing the bandwidth orthogonally reduces spectral efficiency
    in comparison with assigning the full bandwidth to all users and then coping with
    the introduced interference. One exception is in the *low-SNR regime* where the
    network is power-limited rather than interference-limited. In this regime, bandwidth
    is plentiful compared to power, and thus assigning orthogonal channels to users
    incurs no performance loss. In the interference-limited regime this is no longer
    true. Furthermore, as the number of network users increases, the rate per user
    of an orthogonal MAC scheme goes to zero. This reasoning emphasizes why the overlay
    approach may be a more spectrally-efficient technique for cognitive radios than
    the interweave approach. We analyze capacity regions of the interweave and the
    overlay cognitive radio in Sections 2.6 and 2.7, respectively.'
