    cognitive radio networks. One of the major cognitive radio networking testbeds
    is the cognitive-radio-enabled ORBIT radio grid testbed [67] at the Wireless Information
    Networks Laboratory (WINLAB) at Rutgers University. The large-scale radio grid
    emulator shown in'
