  md: '# ### 1.8.1 Spectrum pooling and bandwidth exchange


    The full power and benefits of cognitive radio technology can only be realized
    when cognitive radios form networks that can be used to carry information. Cooperative
    forwarding in wireless networks has been shown to yield rate and diversity gains,
    but it incurs energy costs borne by the cooperating nodes. Cognitive radio nodes
    have the ability to flexibly exchange the transmission bandwidth as a means of
    providing incentive for forwarding data, without increasing either the total bandwidth
    required or the total transmit power. The advent of multicarrier systems such
    as NC-OFDM with the ability to flexibly delegate and employ a number of subcarriers
    makes this approach particularly appealing compared to other incentive mechanisms
    that are often based on abstract notions of credit and shared understanding of
    worth.


    *Spectrum pooling* is a concept where users may temporarily rent from a pool of
    spectral resources from primary users. The existing system of licensing spectrum
    need not be changed by this set-up. This system leads to a two-fold advantage:
    the secondary users get to access the spectral resources that they are not licensed
    to use, and the owners of the spectrum get to make revenue for the commodity they
    paid for but do not use extensively [89].


    Among the many forms of cooperative communication, cooperative forwarding [12,
    31] is an essential technique to enhance connectivity and throughput. As forwarding
    usually incurs bandwidth and energy cost, incentive mechanisms must be implemented
    to offset these. *Bandwidth exchange* (BE) [94], a concept similar to spectrum
    pooling, is an incentive mechanism that essentially enables a user to delegate
    a portion of its bandwidth in exchange for forwarding. Figure 1.11 illustrates
    the concept of BE in a network of nodes where a user incentivizes forwarding by
    delegating subcarriers to another user.


    To motivate BE, consider Shannon''s canonical channel capacity formula for an
    additive white Gaussian noise (AWGN) channel with a noise power spectral density
    of $N_{0}$.


    ![](img/2d42983cf592ef4fc8a22646ddc49799_53_0.png)


    **Figure 1.11** When the direct link fails, user *i* tries to incentivize forwarding
    by delegating $N-N^{\min}$ subcarriers to user $j$ [93].'
