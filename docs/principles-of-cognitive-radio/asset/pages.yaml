    Figure 3.8 Pairs of crossed dipoles at the base and mobile, as might be used to
    obtain dual diversity or multiplexing. Typically, the angles φ_MS and φ_BS are
    both 45°. The pairs shown are in the vertical planes at the base and mobile, generally
    facing each other.'
