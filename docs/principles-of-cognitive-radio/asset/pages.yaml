  md: 'Several techniques are available for the computation of these bounds. Among
    these, we can mention the quadrature-rule approach described in [2, 48], the semianalytic
    approach of [32], and the graphical approach of [49].


    # 4.6.2 Energy sensing


    We assume a deterministic primary signal with average power $\mathcal{P}$. In
    this situation, the probability of a false alarm has the form


    $P_{\mathrm{FA}}(W,I)=\mathbb{E}_{W,I}\mathbb{1}\left(\frac{2}{\sigma_w^2}\sum_{n=0}^{N-1}|i_n+w_n|^2>\frac{2N}{\sigma_w^2}\theta\right).
    \quad (4.117)$


    With $W=\mathcal{N}(0,\sigma_w^2)$, the random variable appearing before the inequality
    sign in the last equation has a conditional noncentral chi-square distribution
    with $2N$ degrees of freedom and noncentrality parameter


    $\lambda_0 \triangleq \frac{2}{\sigma_w^2}\sum_{n=0}^{N-1}|i_n|^2. \quad (4.118)$


    Thus,


    $P_{\mathrm{FA}}(I)=\mathbb{E}_I\left[Q_N\left(\sqrt{\lambda_0},\sqrt{2N\theta/\sigma_w^2}\right)\right],
    \quad (4.119)$


    where $Q_N$ denotes the generalized Marcum $Q$-function, and $\mathbb{E}_I$ the
    expectation taken with respect to the distribution of the random variable $I$:


    $\mathbb{E}_I[f]\triangleq\int_0^{\infty}f(x)\,dF_I(x).$


    The conditional probability of missed detection can be derived in a similar way,
    to yield


    $P_{\mathrm{MD}}(I)=1-\mathbb{E}_I\left[Q_N\left(\sqrt{\lambda_1},\sqrt{2N\theta/\sigma_w^2}\right)\right],
    \quad (4.120)$


    where $\lambda_1 \triangleq \frac{2}{\sigma_w^2}\sum_{n=0}^{N-1}|x_n+i_n|^2. \quad
    (4.121)$


    Sharp upper and lower moment bounds to $P_{\mathrm{FA}}$ and $P_{\mathrm{MD}}$
    can be computed under the assumption that $\mathbb{E}[i_n]=0$, which allows us
    to obtain the moments $\mathbb{E}[\lambda_0]=2N\sigma_I^2/\sigma_w^2 \quad \mathbb{E}[\lambda_1]=2N\left(\mathcal{P}+\sigma_I^2\right)/\sigma_w^2.
    \quad (4.122)$


    Thus, the moment space relevant to our problem is obtained as the convex hull
    of the curve $(x, Q_N(\sqrt{2N x \sigma_I^2/\sigma_w^2},\sqrt{2N\theta/\sigma_w^2}))$
    for $P_{\mathrm{FA}}$: see Fig. 4.3) and $(x,1-Q_N(\sqrt{2N(\mathcal{P}+x)/\sigma_w^2},\sqrt{2N\theta/\sigma_w^2}))$
    (for $P_{\mathrm{MD}}$: see Fig. 4.4). These plots allow the derivation of upper
    and lower bounds to $P_{\mathrm{FA}}$ and $P_{\mathrm{MD}}$ that are actually
    achievable through some probability distribution of the interference $I$.'
