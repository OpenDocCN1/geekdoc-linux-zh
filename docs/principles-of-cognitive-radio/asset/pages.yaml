    (XPD). There is general consensus in the literature that the channel XPD, when
    expressed in dB, has a nonzero-mean Gaussian distribution. Depending upon the
    environment and the existence of a LOS component, the mean XPDs measured and reported
    in the literature vary from 0 to 12 dB, with a standard deviation of the order
