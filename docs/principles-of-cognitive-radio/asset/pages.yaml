  md: 'of the interference channel between the primary receiver and the secondary
    transmitter. One definition of a single metric that captures the harm caused by
    interference and noise on the primary user is that of *interference temperature*.
    This was introduced by the Federal Communications Commission (FCC) for "quantifying
    and managing interference" [1].


    The interference temperature associated with the power available at a primary
    receiver antenna and generated by other emitters and noise sources is defined,
    in analogy with noise temperature, as


    $T_I \triangleq \frac{P_I}{kW}$


    where $P_I$ is the average interfering power in bandwidth $W$, and $k = 1.38 \times
    10^{-23} J/K$ is Boltzmann''s constant. If the measured $T_I$ within a frequency
    band is low enough to achieve communication at a target throughput, then it is
    assumed that primary and secondary transmissions can coexist in that band. Specifically,
    if a limit interference temperature $T_L$ is set for a particular frequency band
    of width $B$, then the secondary transmitter has to make sure that the average
    interference power it generates is below $kWT_L$ [46].


    As discussed in [5, 6], implementation of a CR system based on the interference
    temperature model will meet a number of challenges. One involves discerning primary
    from secondary signals: this problem can be made simpler if the primary signal
    structure is known, as for example with digital broadcast television. Another
    problem involves the measurement of $T_I$ in the presence of a primary signal,
    that is, the determination of the interference floor lying underneath the primary
    signal. Again, this task is made simpler by the knowledge of the primary signal,
    as measurement can occur for example during time intervals when the latter is
    not present. Further, experimental results, obtained with the IEEE 802.11 protocol
    for wireless networking, show that if theoretical bounds are obtained by computing
    the temperature interference on the basis of protocol specifications, they are
    likely to predict a much higher tolerance to interference than that provided by
    the actual transmission system [31].


    Yet another difficulty with the interference-temperature model described above
    is its dependence on *average* interference power. As observed in [7], it may
    occur that a narrowband secondary signal severely interferes with a wideband primary
    user signal, although the average interference power remains below the acceptable
    threshold. To counteract this shortfall, the authors of [7] advocate a regulatory
    allowance based on *power spectra* rather than average powers. This would allow
    one to prevent excessive interference by exploiting the shape of the power spectrum
    of the secondary or the primary user.


    In [16] a regulatory constraint is advocated based on the *maximum tolerated interference
    power*. Within it, the *probability of harmful interference*, defined as the probability
    that the interference level at the primary receiver is higher than a given threshold,
    should not exceed a fixed value. This criterion allows one to account for the
    unknown number and locations of the CRs and for the randomness of the propagation
    medium. In fact, if the transmission channel is affected by deep fading or heavy
    shadowing, as described in'
