  md: 'a minimum without compromising the sensing performance. In addition, the capacity
    requirements a central scheme imposes on the channel used for sharing the sensing
    results by transmitting data to the central processor may be prohibitive in practice.
    Therefore, we focus on decentralized distributed spectrum sensing for cognitive
    radios. In such systems the nodes typically collaborate in identifying and exploiting
    the underutilized spectrum. Alternatively, the nodes can be selfish and compete
    for the unoccupied spectrum.


    In distributed sensing systems, the main topologies with a fusion center are serial,
    parallel, and tree topologies [206]. In a serial topology, the intermediate information
    about the state of the spectrum is passed from user to user and it is updated
    at each stage. The final decision is then made by the last user which has the
    information from all the other users available. The serial topology is less robust
    than other topologies since a single link failure or missing node will lead to
    severe performance degradation. Hence, it is not considered any further here.


    In a parallel topology local detectors may send hard or soft decisions to the
    fusion center. Typically the sensors do not communicate with each other and there
    is no feedback from the fusion center to sensors either. The sensors use a mapping
    rule


    $u_i = v_i(y_i), \quad i = 1, \dots, N_{SU}, \tag{5.2}$


    where $y_i$ is the observation made by sensor $i$ and $N_{SU}$ is the number of
    sensors, and then pass the local mappings $u_i$ to the fusion center. The mapping
    may also perform compression of the data by extracting relevant information from
    multiple observations. For example, each sensor could compute a minimal sufficient
    statistic or local likelihood ratio from the data or make a local binary decision
    using an appropriate detector.


    Sensing nodes that are close to each other may also form a cluster that sends
    summary information about the state of the spectrum to the fusion center via a
    cluster head, thereby forming a tree topology. The nodes within the cluster exchange
    data or sensing results and form a consensus statistic that is then transmitted
    to the fusion center, see [173]. The information sent by the cluster head may
    be a local decision statistic with side information or an estimate of the power
    spectral density.


    Ad hoc configurations may also be used, in which there is no dedicated fusion
    center and the sensing information is distributed among the nodes, see Fig. 5.2.
    For ad hoc configurations in which the sensing information is distributed to all
    nodes, each node will have the same information needed to make the decision about
    whether the spectrum is occupied or not. Distributing the information to all nodes
    potentially over multiple hops may lead, however, to unacceptable delays in decision
    making, especially in cases where the spectrum is not persistently available,
    or the state of the spectrum may vary rapidly. Thus, configurations in which the
    information forwarding is limited to small local neighborhoods may have to be
    employed.


