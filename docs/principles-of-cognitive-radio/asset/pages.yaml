- pgno: 220
  md: 'local detector or estimator employed, and type of local information passed
    to the fusion center. In addition, there are differences in the way sensors cooperate
    or compete, and the fusion rule or combining method employed at the fusion center.
    In cooperative sensing one also needs to design a sensing policy, i.e., decide
    how different sensors are allocated in sensing different parts of the spectrum
    at any given time instance. The local detector can be an energy detector, a coherent
    detector (i.e., a matched filter), or a feature-based detector such as a cyclostationarity-based
    detector, for example. These techniques were described in detail in Chapter 4.
    Local sensors may also estimate the power spectrum and characterize the level
    of interference at that location. The detectors may be designed using well-known
    Neyman-Pearson or Bayesian approaches, as described above. The detector may also
    be designed jointly with the access strategy taking into account the interference
    constraints and energy constraints. For example, if the channel is in a deep fade
    and the secondary user terminal is battery-operated, the secondary user might
    not want to access the channel even if it is found to be idle.


    A crucial element of cooperative spectrum sensing is the combining technique used
    at the fusion center. The local detection algorithms may be used in conjunction
    with either soft- or hard-decision combining at the fusion center. As noted above,
    hard combining uses Boolean rules and binary decisions from the local detectors.
    Many widely used rules are K-out-of-N type of rules, with AND, OR, and MAJORITY
    rules being important special cases.


    Soft decisions are known to improve the performance of decentralized sensing significantly
    and to exploit fully cooperation among the nodes. As noted above, under the conditional
    independence assumption the optimal global decision rule under both Bayesian and
    Neyman-Pearson criteria is a likelihood ratio test. However, in practice it may
    not always be possible to directly use a likelihood ratio test because some of
    the distribution parameters may be unknown. In such a case, a simple combining
    scheme of practical interest is combining the local generalized likelihood ratios
    or logarithms of them under a conditional independence assumption. The generalized
    likelihood ratio is obtained from the likelihood ratio by replacing the unknown
    parameter values with their estimates. The resulting test statistic is simply
    the sum of local generalized log-likelihoods. Clearly the local detector can be
    any detector that employs a generalized likelihood ratio test. We will later provide
    an example of a collaborative generalized likelihood ratio test using cyclostationarity-based
    local detectors and Neyman-Pearson design. Also belief propagation (BP) techniques
    [79] have been employed in combining. Belief propagation requires message passing
    and message updating among the nodes. It also requires forming a graph based on
    network topology. This approach is applicable to different local detector structures.
    Conditional independence is assumed which allows for combining the local information
    by using a product of local functions. Conditional independence can be captured
    by using Markov random fields or Bayesian networks as an underlying model. Dempster-Shafer
    theory for combining evidence from multiple sources has also been employed in
    distributed sensing for cognitive radios [157]. A degree of belief may be achieved
    based on all the evidence while allowing the radios to specify ignorance and uncertainty
    in a flexible manner. Both local sensing and combining of the evidence at the
    fusion center may be covered with the theory.'
