- pgno: 181
  md: 'Notice that the basic model (4.1) can be enriched by introducing fading and
    shadowing, and explicitly distinguishing between additive noise and interference,
    as in (4.2). In this case, we write


    $$y(t)=h x(t)+i(t)+w(t),\tag{4.3}$$


    where $h$ denotes the fading affecting the path between the primary source and
    the sensor, one which is usually assumed to remain constant during the observation
    interval (the “block-fading” assumption [3], which expresses the assumption that
    the coherence time of the multiplicative fading process exceeds the sensing time).
    All random entities in (4.3) are assumed to be independent of each other. In practice,
    $y(t)$ will be sampled before processing, with $N$ samples taken at a high enough
    rate, which allows us to deal with the discrete version of (4.1):


    $$y_n = x_n + z_n,\quad n=0,\ldots,N-1\tag{4.4}$$


    and of (4.3):


    $$y_n = h x_n + i_n + w_n,\quad n=0,\ldots,N-1.\tag{4.5}$$


    The variable $N$ is usually referred to as the sensing time, although its value
    may generally include not only the number of time dimensions, but also the space
    dimensions generated by using multiple independent sensors. Fading and shadowing
    usually impair the performance of a spectrum sensor: in fact, the sensor may mistake
    a deep fade for the absence of a primary signal.


    After sampling, the detection problem is converted into a discrete-time binary
    hypothesis testing problem, based on the map


    $$\mathcal{D}_N : \mathbb{C}^N \to \{\hat{\mathcal{H}}_0,\hat{\mathcal{H}}_1\},\tag{4.6}$$


    where $\mathcal{D}_N$ maps the $N$-dimensional complex vector $(y_0,\ldots,y_{N-1})$
    to the set $\{\mathcal{H}_0,\mathcal{H}_1\}$ of possible decisions (primary signal
    absent or present, respectively). For a specific realization of the observation,
    the detector is in error when $\mathcal{H}_i \neq \mathcal{H}_i$, $i=0,1$. Two
    errors of specific interest here are the false-alarm and missed detection probabilities,
    whose definitions are


    $$P_{FA}\triangleq\mathbb{P}\{\mathcal{D}_N=\hat{\mathcal{H}}_1\mid\mathcal{H}_0\},\tag{4.7}$$


    $$P_{MD}\triangleq\mathbb{P}\{\mathcal{D}_N=\hat{\mathcal{H}}_0\mid\mathcal{H}_1\}\tag{4.8}$$


    (the probability of correct detection $P_D\triangleq1-P_{MD}$ is also used). These
    probabilities are not independent: they are linked by a function, summarizing
    the detector performance and called the receiver operating characteristic (ROC),
    which expresses the dependency between $P_{FA}$ and $P_D$ for a given detector
    and given parameters on which the detection depends (for example, the signal-to-noise
    ratio) [22, p. 74], [35, p. 27]. In general, $P_D$ increases as $P_{FA}$ increases.'
