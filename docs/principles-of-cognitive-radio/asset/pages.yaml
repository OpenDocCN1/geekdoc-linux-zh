  md: 'To stress the dependence of $P_{FA}$ and $P_{MD}$ on the distribution of the
    random quantities they involve, we may write them in the alternative form


    $P_{FA}(Z) \triangleq \mathbb{E}_Z\{[\mathcal{D}_N = \mathcal{H}_1] \mid \mathcal{H}_0\},
    \quad (4.9)$

    $P_{MD}(Z, H, X) \triangleq \mathbb{E}_{H,X,Z}\{[\mathcal{D}_N = \mathcal{H}_0]
    \mid \mathcal{H}_1\}, \quad (4.10)$


    where $[\pi]$ denotes the Iverson function, which takes the value 1 if proposition
    $\pi$ is true, and the value 0 otherwise, and H, X, Z denote the probability distributions
    of $h$ and of the sequences $x_n$ and $z_n$, assumed stationary. Notice that,
    in our context, having a false alarm is equivalent to neglecting spectral opportunities,
    while missed detections lead to transmission collisions, and ultimately to throughput
    reductions (this was thoroughly discussed in Chapter 2). Thus, performance targets
    should include high throughput for secondary users (i.e., low false-alarm probability)
    as well as high protection of primary users from unintended interference (i.e.,
    low probability of missed detection). One may define three classes of spectrum
    sensing schemes based on their keenness towards opportunistic spectrum usage:
    conservative, aggressive, and hostile, classified according to different target
    values of $P_{FA}$ and $P_{MD}$. A conservative system operates with a high value
    of $P_{FA}$, and hence a small spectrum utilization rate, and a small probability
    of interfering with the primary radio. An aggressive system operates with a high
    spectrum utilization rate, but a small probability of interference. A hostile
    system has an extremely low value of $P_{FA}$ and a large probability of interference.
    In [36], the following values are suggested:


    +   - **conservative**, if $P_{FA} > 0.5$ and $P_{MD} < 0.5$,

    +   - **aggressive**, if $P_{FA} < 0.5$ and $P_{MD} < 0.5$,

    +   - **hostile**, if $P_{FA} < 0.5$ and $P_{MD} > 0.5$.


    # Optimization criteria


    Several strategies are available for the optimization of the detector, based on
    a tradeoff between $P_{MD}$ and $P_{FA}$ (one of the two probabilities can always
    be made small at the expense of an increase of the other, but a CR system should
    satisfy constraints on both). We briefly describe here Bayesian, minimax, and
    Neyman-Pearson criteria. Additional details can be found for example in [35].


    # Bayes criterion


    This is defined after assigning a cost to each of the four possible outcomes of
    the decision process (Table 4.1). The Bayes criterion consists of minimizing the
    expected cost, called risk. This is defined by


    $\mathcal{R} \triangleq C_{00} \pi_0 \mathbb{P}\{\mathcal{D}_N = \mathcal{H}_0
    \mid \mathcal{H}_0\}$

    $+ C_{10} \pi_0 \mathbb{P}\{\mathcal{D}_N = \mathcal{H}_1 \mid \mathcal{H}_0\}$

    $+ C_{01} \pi_1 \mathbb{P}\{\mathcal{D}_N = \mathcal{H}_0 \mid \mathcal{H}_1\}$

    $+ C_{11} \pi_1 \mathbb{P}\{\mathcal{D}_N = \mathcal{H}_1 \mid \mathcal{H}_1\},
    \quad (4.11)$'
