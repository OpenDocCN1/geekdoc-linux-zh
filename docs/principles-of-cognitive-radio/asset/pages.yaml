    as follows (see also Chapter 4): for a predefined global probability of false
    alarm $P_{FA}$, find (optimum) local and global decision rules $\Gamma = \{\nu_0(\cdot),
    \nu_1(y_1),..., \nu_{N_{SU}}(y_{N_{SU}})\}$, where $\nu_0(\cdot)$ is the global
    decision rule and $\nu_i(\cdot), i = 1,...,N_{SU}$ are the local rules, that minimize
    the global probability of missed detection $P_{MD}$.


