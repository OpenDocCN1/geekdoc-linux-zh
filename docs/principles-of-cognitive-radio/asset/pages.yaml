    # 4.4 An application: spectrum sensing with OFDM


    As an application, we examine here the special case of spectrum sensing with orthogonal
    frequency-division multiplexing (OFDM) [18, Chapter 12], a scheme used in a number
    of current and future commercial communication systems (WiFi, WiMAX, LTE, and
    DVB-T). OFDM signals are cyclostationary, and hence spectrum sensors exploiting
    cyclostationarity can be used. However, better sensors can be designed that are
    tailored to the specific signal structure of OFDM, and, in particular, the presence
    in it of a cyclic prefix (CP) of known length. This duplicates the last information
    data at the beginning of an OFDM symbol, and hence generates a correlation in
    the symbol stream. We study, following [1], coherent and noncoherent detection.'
