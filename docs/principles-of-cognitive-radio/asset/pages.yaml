    The capacity results discussed above all assume perfect detection of spectrum
    holes by the secondary users. There are two types of imperfect detection: missed
    detection and false alarm, which are defined formally in Section 4.3. A false
    alarm occurs when a primary user is detected but in fact none is present, i.e.,
    a spectrum hole is detected by the secondary user or users. For a single secondary
    user, assuming a stationary and ergodic system, a false alarm has no effect on
    the primary users (since no interference is generated). However, it reduces the
    secondary user''s data rate by a fraction (1 – P FA) for P FA the probability
    of false alarm since, under perfect detection, the missed spectrum holes would
    have been used for the secondary user''s transmission. When there are multiple
    secondary users, the reduction in each of their data rates due to false alarm
    depends on how the spectrum holes are allocated. If the spectrum holes have the
    same length and are equally allocated among K s secondary users, then each of
    the secondary user''s data rates due to false alarm would be reduced by a fraction
    (1 – P FA) / K s. In the case of missed detection, the secondary users fail to
    detect primary user activity when in fact these users are active, i.e., a spectrum
    hole is detected incorrectly. During missed detection, the channel becomes the
    interference channel of Fig. 2.7, since both primary and secondary users are transmitting
    simultaneously. However, in the interweave scenario, the encoding and decoding
    for both the primary and the secondary users do not take this interference into
    account since it occurs due to an unexpected detection error. Hence, interference
