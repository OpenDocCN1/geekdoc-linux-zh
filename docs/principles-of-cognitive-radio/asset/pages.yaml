  md: '# 3.8 Delay dispersion


    # 3.8.1 “Narrowband” vs. “wideband”


    We return now to the normalized impulse response introduced in Section 3.2, $\hat{h}(\tau;
    \mathbf{x}, \mathbf{F})$, where the average of the squared magnitude over the
    spatial domain $\mathbf{x}$ and the spectral domain $\mathbf{F}$ is unity. The
    spectral domain $\mathbf{F}$ is the frequency interval from $f_c - W/2$ to $f_c
    + W/2$. If a radio impulse is passed through the radio channel in this spectral
    domain, a multipath component arriving at the receiver with complex channel gain
    $a_1$ at a delay $\tau_1$ will appear as $a_1 \xi(\tau - \tau_1)$, where $\xi(\tau)
    = W \sin(\pi W \tau)/(\pi W \tau)$. Thus, the impulse response to an MPC within
    a channel of bandwidth $W$ is a sinc pulse over $\tau$ of null-to-null width $2/W$.$^5$
    For present purposes, we can ignore the fact that this response is noncausal.


    Now assume there are $N$ multipath components, with delays $\tau_1, \dots, \tau_n,
    \dots, \tau_N$ and complex amplitudes $a_1, \dots, a_n, \dots, a_N$. Then the
    impulse response can be written as $$\hat{h}(\tau) = \sum_{n} a_n \xi(\tau - \tau_n).$$
    (3.37)


    As noted, we arbitrarily specify that the delay of the first MPC is at the $\tau$-origin,
    so that $\tau_1 = 0$. The total delay spread (i.e., the support) of the peaks
    of the summed sinc functions is therefore $\tau_N$. The spread is of minimal impact
    in cases where $\tau_N$ is very small compared to the nominal width of the individual
    sinc pulses, which we can take to be $\approx 2/W$. By “minimal impact” we mean
    that a signal transmitted in the specified band arrives with little distortion.
    This is because, given the extensive temporal overlap of the MPC terms in (3.37),
    the impulse response deviates little from a sinc function. The channel in this
    case, $W \tau_N \ll 2$, is what we can refer to as “narrowband.” It corresponds
    to a frequency response that is virtually flat over the bandwidth $W$. As $W \tau_N$
    grows from very small values, the temporal dispersion can no longer be ignored
    or approximated away; we will refer to the channel in that case as “wideband,”
    in the sense that the detailed nature of the delay dispersion must be accounted
    for in analyzing signal transmission.


    # 3.8.2 Wideband channels


    We will refer to the pulse $\xi(\tau)$ as the bandlimited impulse function, noting
    that, in the limit of infinite bandwidth, $\xi(\tau)$ converges to the familiar
    Dirac impulse function, $\delta(\tau)$. We now rewrite (3.37) under different
    regimes of $\xi(\tau)$. We have already discussed the “narrowband” case, $W \tau_N
    \ll 2$, wherein the different terms in (3.37) overlap considerably and the channel
    appears as flat fading. At the other extreme where the nominal $\tau$-spacing
    between MPC arrivals is larger than $1/W$ (equivalently, the nominal arrival rate
    is greater than $W$). Consequently, the different MPCs can be resolved by the
    receiver and processed individually. This condition applies to certain contexts,
    such'
  merge: -1
