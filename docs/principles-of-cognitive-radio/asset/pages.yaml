  md: 'Alternatively, the constraint imposed on the secondary user might be to meet
    an outtage capacity constraint on the primary user. This condition is equivalent
    to a peak transmit power constraint that has to be satisfied at the secondary
    transmitter for some percentage of time $P_{\text{out}}$. The peak transmit power
    constraint will be chosen based on channel characteristics to guarantee that outage
    occurs at the primary with probability not exceeding $P_{\text{out}}$. Finally,
    imposing the ergodic capacity constraint at the primary receiver would require
    that the power allocation for the secondary user is determined for which the SINR
    at the primary receiver yields the desired ergodic rate. Further results on underlay
    cognitive radio in the presence of fading can be found in [31, 64].


    In the presence of multiple secondary and primary users, a received signal at
    any primary user contains interference from all the secondary transmissions. Secondary
    transmitters then collectively have to choose their transmissions such that the
    desired interference constraints are satisfied at all primary users. Even in the
    presence of one primary user, secondary users form a wireless network and hence
    finding their capacity region is, in general, a difficult problem. In the case
    that there is no cooperation between secondary users, their transmitter/receiver
    pairs form an interference channel, and hence the capacity region is unknown.
    The performance can further be impacted by cooperation among terminals which allows
    for coherent combining in relaying of each other’s information. Without cooperation,
    the received power from all secondary users simply sums incoherently. The capacity
    results with or without cooperation can be evaluated for some specific topologies
    [29]. We next present the capacity for one of these topologies, the Gaussian multiple
    access channel.


    # Static scalar channels with multiple secondary users


    The static scalar AWGN multiple access channel consists of $K$ secondary users
    communicating at rate $R_k$ over an AWGN channel to a common secondary receiver.
    The rates that can be achieved are constrained by the constraint on the interference
    these users cause to primary receivers. Consider a single primary receiver where
    the channel between the $k$th secondary transmitter and the primary receiver has
    gain $h_k$. The received interference plus noise signal at the primary receiver
    is thus given by


    ```

    $Y_p = \sum_{k=1}^{K} h_k X_k + Z_p, \hspace{5cm} (2.59)$

    ```


    where $X_k$ is the $k$th secondary user’s transmitted symbol and $Z_p$ is the
    primary user’s receiver noise, modeled as AWGN with variance $\sigma^2$. Since
    the channel is static, the average interference power constraint (2.45) corresponds
    to


    ```

    $\mathrm{E}\left[\left|Y_p\right|^2 \left\{X_k, h_k\right\}, k=1,\ldots,K\right]
    = \nu + \sigma^2 \leq \eta, \hspace{5cm} (2.60)$

    ```


    where $\nu$ represents the power of the received interference and $\sigma^2$ the
    noise power. It is shown in [29, Sec. IV] that under this constraint the capacity
    region of the secondary user multiple access channel is given by the set of rate
    vectors that satisfy


    ```

    $\sum_{k=1}^{K} R_k \leq \log \left(1 + \frac{\nu}{\sigma^2}\right). \hspace{5cm}
    (2.61)$

    ```'
