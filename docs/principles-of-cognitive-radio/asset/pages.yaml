    \mathbf{I}, \qquad (4.78)$


    Thus, the log-likelihood ratio for the decision between $\mathcal{H}_0$ and $\mathcal{H}_1$
    has the form


    $Y \triangleq \log \frac{p(\mathbf{y} \mid \mathcal{H}_1)}{p(\mathbf{y} \mid \mathcal{H}_0)}
    = \log \frac{\sigma_w^{2N}}{\det \mathbf{Q}_r} - \mathbf{y}^\dagger \left(\mathbf{Q}_r^{-1}
    - \sigma_w^{-2}\mathbf{I}\right) \mathbf{y}, \qquad (4.79)$


    Direct computation of $\det \mathbf{Q}_r$ and of $\mathbf{y}^\dagger \left(\mathbf{Q}_r^{-1}
    - \sigma_w^{-2}\mathbf{I}\right) \mathbf{y}$ required to evaluate $Y$, may entail
    a considerable complexity when $N$ is large (see [1] for a simplification exploiting
    the sparseness of the matrix $\mathbf{Q}_r$).


    As a special case, observe that with no cyclic prefix ($N_p = 0$, which corresponds
    to no usable structure of the observed signal), we have $\mathbf{T}_\tau, \mathbf{T}_\tau^T
    = \mathbf{I}$ and $\mathbf{y}|\mathcal{H}_1 \sim \mathcal{N}_c\left(0, (\sigma_d^2
    + \sigma_w^2)\mathbf{I}\right)$, which results into the test statistic


    $Y = \|\mathbf{y}\|^2$


    and shows that the energy detector is optimal in these conditions.


    # **Unknown $\sigma_w^2$ and $\sigma_d^2$**


    If these two parameters are not known, but their a priori distribution is available,
    one may still use the likelihood-ratio test after eliminating them by standard
    marginalization:


    $p(\mathbf{y} \mid \mathcal{H}_0) = \mathbb{E}_{\sigma_w^2} p(\mathbf{y} \mid
    \mathcal{H}_0, \sigma_w^2), \qquad (4.80)$


    $p(\mathbf{y} \mid \mathcal{H}_1) = \mathbb{E}_{\sigma_w^2, \sigma_d^2} p(\mathbf{y}
    \mid \mathcal{H}_1, \sigma_w^2, \sigma_d^2), \qquad (4.81)$


    which assumes the knowledge of the a priori distributions of $\sigma_w^2$ and
    $\sigma_d^2$. Another option is the use of the generalized likelihood ratio test
    (4.16), which consists here of replacing $\sigma_w^2$ and $\sigma_d^2$ with their
    maximum-likelihood estimates in (4.76)-(4.77).'
