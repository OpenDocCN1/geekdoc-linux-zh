    # ### 1.7.2 Antenna design in cognitive radio systems


    Cognitive radio networks can function efficiently and reliably only if the component
    radios are able to scan wide bands of spectrum and accurately detect spectrum
    holes. Further, they also need to be able to transmit opportunistically in the
    detected white spaces. This requires the cognitive radio to be equipped with wideband
    antennas. Using wideband antennas can only produce coarse spectrum sensing, whereas
    narrowband antennas are capable of accurately sensing the spectrum. Another issue
    with wideband antennas is that they tend to have a bigger form factor than narrowband
    antennas, which poses a significant problem for portability in handsets. In dynamically
    changing environments, frequency agility would require tunable RF filters over
    a wide spectral range, making their implementation complex and expensive [41,
    52].


    From a system design perspective, there is an increasing demand for multi-wideband
    antennas that can also be easily integrated with the communication system. Usually
    electronic reconfigurability is achieved by using switches, variable capacitors,
    or phase shifters in the topology of the antenna. Most frequently, lumped components
    such as PIN diodes, varactor diodes, or MEMS switches or varactors are used in
    the design of reconfigurable antennas. Typically, reconfigurable antennas are
    frequency reconfigurable, radiation pattern reconfigurable, or polarization reconfigurable
    [83].


    The advantage of a frequency reconfigurable antenna is that it allows a single
    radio device to operate at multiple frequencies. For example, a tuning method
    [53] can be used to tune into multiple bands for mobile applications. The radiation
    patterns of such antennas remain unchanged as the frequencies are tuned from one
    band to another. In designing a frequency reconfigurable antenna, a single antenna
    will be able to tune from lower to higher bands by reusing the real estate in
    the antennas or tune in and out of different antenna sections. Most resonant type
    antennas tune the effective electrical length to achieve frequency reconfigurability.


    In a radiation pattern reconfigurable antenna, the frequency band remains unchanged
    while the radiation pattern changes based on the system requirements. The antennas
    can steer their radiation beams to different directions to enhance signal reception
    [21, 65, 88]. Polarization reconfigurable antennas improve the signal reception
    performance in severe multipath fading environments using polarization as an additional
    degree of freedom [46]. Pattern reconfigurable antennas and polarization reconfigurable
    antennas can also be utilized for interference cancellation and to form rich spatial'
