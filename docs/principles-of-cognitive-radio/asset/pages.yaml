    # Auction games


    An auction is a sales process in which the prospective buyers compete by bidding
    according to the rules of the auction to buy the goods or services under auction.
    Auctions are most often used in situations when the seller does not have a clear
    idea of how the prospective buyers are valuing the goods under auction. A particularly
    interesting form of auction, especially from the cognitive radio perspective,
    is the second-price sealed-bid auction in which the bidder placing the highest
    bid wins the sealed-bid auction but instead of paying the price equal to his/her
    own bid the bidder pays the price equal to the second highest bid. The appealing
    feature of a second-price sealed-bid auction is that it gives incentive to the
    bidders to bid truthfully since bidding truthfully is the optimal strategy [205].


    In [68] spectrum access in cognitive radio networks is formulated as a repeated
    auction game with entry and monitoring fees. The auction is coordinated by a secondary
    coordinator. The entry fee accounts for the energy consumption due to the spectrum
    access and channel estimation needed for bidding and the monitoring fee accounts
    for the cost of spectrum sensing and the subscription to the common control channel
    to obtain past auction history information. The entry fee is paid only when the
    user participates in the auction while the monitoring fee is paid in each time
    period. The repeated auction of spectral opportunities follows the second-price
    sealed-bid auction format in each time period. A learning scheme based on Dirichlet
    processes is proposed to optimize the bidding of the distributed secondary users.
    The Dirichlet process is employed to model the distribution of the winning bid
    given the past auction history.


    # Stochastic games


    The concept of stochastic games was already introduced in Section 5.3.3 when we
    defined the multiagent reinforcement learning problem as a stochastic game. Stochastic
    games are an extension of MDPs in which multiple players interact in noncooperative
    or cooperative manner. We repeat the formulation of a stochastic game from the
    reinforcement learning section for convenience using more game-theoretic terminology.
    That is, a stochastic game consist of


    +   - a sequence of discrete time steps n = 0, 1, 2, …;

    +   - a set of players N = {1, …, N_SU};

    +   - a set of possible states s ∈ S;

    +   - a set of possible actions for each player in each state a_i ∈ A_i, i ∈ N.
    The combined action space is A = A_1 × ⋯ × A_{N_SU};'
