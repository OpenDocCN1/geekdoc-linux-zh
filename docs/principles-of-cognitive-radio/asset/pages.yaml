    # Other multiagent reinforcement learning-based spectrum sensing and access without
    any information exchange


    Multiagent reinforcement learning-based approaches for spectrum sensing and access
    without any communication or information exchange among the secondary users have
    been proposed in [120, 176, 223]. In [223] a Q-learning approach is proposed for
    multiagent, multiband spectrum access in cognitive radio networks. The state of
    a single agent is the index of the current frequency band accessed by the secondary
    user and the corresponding transmit power value. Kanerva coding-based function
    approximation [183] is proposed to reduce the size of the state-space. There is
    no information exchange or explicit coordination of actions among the secondary
    users. Each secondary user employs the Q-learning algorithm independently and
    tries to learn how to avoid other secondary users and primary users based on the
    negative reward received from collisions. In [120] a modified regret-matching
    learning algorithm is proposed for distributed dynamic spectrum access in cognitive
    radio networks. A group of secondary users compete for spectral opportunities
    in a multiband dynamic spectrum access scenario using a modified regret-matching
    learning algorithm that leads to a correlated equilibrium. In the modified regret-matching
    algorithm [69] the secondary users know only their own realized rewards and actions.
    There is no communication among the users. In [176] a multiagent learning scheme
    for multiband dynamic spectrum sensing and access is proposed. The proposed scheme
    is based on a noncooperative framework without any information exchange among
    the secondary users. The secondary users learn through collisions with other users
    to select the best frequency band to access to minimize collisions. The secondary
    users estimate belief vectors for themselves and for the other secondary users.
    The belief vector gives the probability of accessing each frequency band in each
    time slot.


