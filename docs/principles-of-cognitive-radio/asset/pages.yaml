    # Quickest detection


    Let y1, y2, ..., be a sequence of independent random observations with an unknown
    change point m, such that y1, ..., ym-1 have a common distribution F0 and ym,
    ym+1, ... have another common distribution F1. Let p0 and p1 denote probability
    density functions of F0 and F1, respectively.


    Both Bayesian and non-Bayesian quickest detection approaches have received considerable
    attention in the research community. Page''s cumulative sum (CUSUM) test [151]
    has been the most influential and most researched algorithm in the development
    of non-Bayesian quickest detection methods. The stopping time of the CUSUM test
    for detecting a change is given by


    $$N_S = \inf \{ n \ge 1 \mid U_n \ge \psi \}, \qquad (5.38)$$


    where $U_n = \max_{1 \le k \le n} \prod_{i=k}^{n} p_1(y_i)/p_0(y_i)$ and $\psi
    \ge 0$ is the test threshold. The CUSUM test statistic $U_n$ may be updated recursively
    via $U_n = \max\{1, U_{n-1}\} p_1(y_n)/p_0(y_n), n \ge 1, U_0 = 1$. Let $\psi$
