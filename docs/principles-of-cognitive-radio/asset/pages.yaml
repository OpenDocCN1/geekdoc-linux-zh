    # 5.2.2 Sequential and quickest detection


    Sequential and quickest detection techniques have applications in a number of
    fields, such as target detection in radar systems, pattern recognition, fault
    detection, finance, and clinical trials, among others [96, 162]. In cognitive
    radio systems sequential detection techniques are important for finding available
    spectral opportunities in minimal average time. In addition, sequential detection
    facilitates vacating a specific frequency band as soon as possible after the primary
    user becomes active.


    One of the most critical performance indices in cognitive radio systems is the
    sensing time. Cognitive radio systems should aim at minimizing the time spent
    for sensing, and thus, maximizing the time available for transmission as well
    as simultaneously minimizing the energy resources spent for sensing. Sequential
    detection aims at minimizing the detection time given specified levels of error
    probabilities. The main difference between a sequential and a nonsequential test
    is in the length of the data sequence used for decision making. In the nonsequential
    case this length is fixed, whereas in the case of sequential test it varies according
    to the amount and quality of information obtained from the observations. In cognitive
    radio systems sequential detection may be used for'
