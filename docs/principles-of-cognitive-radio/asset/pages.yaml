    # 5.3.4 Game-theoretic approaches


    Game theory is a collection of mathematical methods and tools for modeling, analyzing,
    and predicting the behavior of multiple interacting entities. In cognitive radio
    applications, game theory is important for modeling and analyzing the interaction
    of individual spectrum users, as well as designing algorithms for efficient and
    effective sharing of the scarce spectrum resources.


    The simplest model for the interaction of multiple decision makers is a strategic
    game (or a normal form game). A strategic game consists of


    +   - a set of players $\mathcal{N} = \{1, \ldots, N_{\text{SU}}\}$;

    +   - a set of strategies (actions) for each player $A_i$, $i \in \mathcal{N}$.
    A strategy $a_i \in A_i$ is a complete plan of action for each situation in the
    game. Moreover, let $a_{-i}$ denote the strategies of all the other players except
    player $i$. The combined strategy space is the set of strategy profiles $A = A_1
    \times \cdots \times A_{N_{\text{SU}}}$;

    +   - payoff (utility) functions $r_i : A \to \mathbb{R}$, $i \in \mathcal{N}$,
    which give the players a payoff (utility) for the joint strategies $a_1, \ldots,
    a_{N_{\text{SU}}}$.


    Game theory can be broadly categorized into noncooperative and cooperative game
    theory. In the following the main concepts of both noncooperative and cooperative
    games are presented. Noncooperative games apply naturally to cognitive radio systems
    in which the secondary users act selfishly and compete with each other, while
    cooperative games apply to systems in which the users cooperate with each other
    and act jointly. In addition, we will take a brief look at auction games and finally
    an overview of stochastic games that provide an excellent fit to the dynamic environment
    encountered in cognitive radio applications will be given.


    # Noncooperative games


    In a noncooperative game the players choose their strategies independently to
    achieve their own goals. Note, however, that this does not mean that the players
    are not allowed to cooperate in a noncooperative game. It only means that this
    cooperation cannot be'
