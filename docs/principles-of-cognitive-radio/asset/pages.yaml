    # Cooperative games


    In general, cooperation among the players provides an opportunity to improve the
    overall cumulative payoff compared to that obtained in noncooperative games. In
    cognitive radio systems cooperation may be realized in various forms: the users
    may share their local sensing results to find more free spectrum, as well as helping
    the other users in routing, packet forwarding, and interference management, for
    example.


    An important class of cooperative games comprises coalitional games [171]. Coalitional
    games are cooperative games in which the players form coalitions (i.e., groups
    of players) that may enforce cooperation within the coalition. Thus, a coalitional
    game may be viewed as a game between coalitions instead of between the individual
    players. A coalitional game consists of


    +   - a set of players $N = \{1, \dots, N_{SU}\}$;

    +   - a coalition value function $v$ that quantifies the worth of a coalition
    $\mathcal{S}$. The value of a coalition $\mathcal{S}$ is denoted by $v(\mathcal{S})$.


    A widely used and important subclass of coalitional games is composed of coalitional
    games that are in characteristic form. In coalitional games that are in characteristic
    form the value of a coalition $\mathcal{S}$ depends only on the members of $\mathcal{S}$.
    Moreover, a coalitional game may have either transferable or nontransferable utility.
    For a coalitional game in characteristic form with transferable utility the value
    $v(\mathcal{S})$ of a coalition $\mathcal{S}$ is a real number. The value $v(\mathcal{S})$
    can be thought of as a total payoff that may be divided among the members of $\mathcal{S}$.
    However, the value of a coalition may not always be represented as a single real
    number or be divided in a meaningful manner among the members of the coalition.
    Such games are called coalitional games with non-transferable utility.


    Let us consider coalitional games in characteristic form that are superadditive,
    i.e., the value of a larger coalition formed out of disjoint coalitions is always
    at least equal to the value obtained by the disjoint coalitions separately. Hence,
    a grand coalition, i.e., a coalition involving all the players, is the optimal
    coalition. Such a game is called a'
