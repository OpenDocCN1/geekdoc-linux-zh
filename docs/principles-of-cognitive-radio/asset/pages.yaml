- pgno: 2
  md: '# Principles of Cognitive Radio


    Widely regarded as one of the most promising emerging technologies for driving
    the future development of wireless communications, cognitive radio has the potential
    to mitigate the problem of increasing radio spectrum scarcity through dynamic
    spectrum allocation.


    Drawing on fundamental elements of information theory, network theory, propagation,
    optimization, and signal processing, a team of leading experts present a systematic
    treatment of the core physical and networking principles of cognitive radio, and
    explore key design considerations for the development of new cognitive radio systems.


    Containing all the underlying principles you need to develop practical applications
    in cognitive radio, this book is an essential reference for students, researchers,
    and practitioners alike in the field of wireless communications and signal processing.


    **Ezio Biglieri** is an Adjunct Professor at the Universitat Pompeu Fabra, Barcelona,
    Spain, University of California Los Angeles, and King Saud University, Riyadh,
    KSA.


    **Andrea J. Goldsmith** is a Professor of Electrical Engineering at Stanford University,
    California.


    **Larry J. Greenstein** is a Research Associate at the Wireless Information Network
    Laboratory, Rutgers University, New Jersey.


    **Narayan B. Mandayam** is a Professor, and the Peter D. Cherasia Faculty Scholar,
    at Rutgers University, New Jersey.


    **H. Vincent Poor** is the Dean of Engineering and Applied Science, and Michael
    Henry Strater University Professor of Electrical Engineering, at Princetown University,
    New Jersey.'
  merge: -1
  img_proc: true
- pgno: 3
  md: '“Solidly global perspective on the foundations and advanced topics of one of
    the most important developments in radio systems engineering in the past several
    decades – this book is a landmark publication, a compelling page-turner in presentation
    and a valuable reference resource for practicing radio engineers.”


    *Dr. Joseph Mitola III, Mitola’s STATISfaction*


    “This is the first book to cover the topic of cognitive radio from a fundamental
    viewpoint. It provides new insights on propagation, spectrum sensing, system optimization
    and networking that will be invaluable to theoretical researchers as well as practitioners
    in the field.”


    *Venugopal V. Veeravalli, University of Illinois at Urbana-Champaign*


    “Much has been written on the ever-expanding subject of cognitive radio. The new
    book entitled “Principles of Cognitive Radio”, written by well-respected authorities,
    fills a gap by presenting detailed discussions of different aspects of this fascinating
    subject. I recommend the book for use by researchers who are already working in
    cognitive radio or planning to move into it.”


    *Simon Haykin, McMaster University, Canada*


    “Principles of Cognitive Radio” is a comprehensive treatment of many of the fundamental
    issues that will impact cognitive wireless communications networks of the future.
    The authors have done an excellent job bringing together many modern concepts
    that are at the forefront of wireless, while reviewing the fundamentals along
    the way. As a result, the authors have created an excellent reference text, bringing
    a wide range of problems, contributions, and viewpoints together in a single,
    well-written book.”


    *Theodore S. Rappaport, Polytechnic Institute of New York University and Director,
    NYU WIRELESS*'
  merge: -1
  img_proc: true
