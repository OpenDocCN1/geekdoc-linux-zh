    # Figure 2.5 Capacity versus outage probability for a single-user channel.


    When the channel state is unknown at the transmitter, the performance metric used
    is *capacity versus outage probability*. In this case the transmitter cannot adapt
    to channel conditions; it therefore selects a given fixed rate $R$ (for single-user
    systems) or set of fixed rates **R** (for multiuser systems) to transmit to the
    user(s). If the channel supports these rates, i.e., the rates are within the capacity
    or capacity region of the channel under its realized channel state, then the data
    are received without error; if not, errors occur which are deemed a data outage.
    For single-user channels the capacity versus outage probability metric takes the
    form of a function characterizing the capacity $C$ associated with each outage
    probability $P_{out}$. The capacity versus outage probability function, illustrated
    in Fig. 2.5a for a continuous-state single-user channel, thus corresponds to the
    transmitter’s data rate versus the probability that this rate cannot be supported
    by a given channel. The plot of $C$ versus $P_{out}$ is nondecreasing in $P_{out}$,
    since at high outage probability more of the *bad* channel states need not support
    rate $C$, and hence a higher capacity can be achieved in the nonoutage states.
    Consider now a finite-state channel, where the set of channel states $\mathcal{S}$
    is finite, and assume the states are ordered so that the capacity $C_i$ in state
    $i$ satisfies $C_i \le C_j$ for $i \le j$. Then $C$ versus $P_{out}$ has a staircase
    shape with discrete increases for each $n$ such that $P_{out} = \sum_{i=1}^{n}
    p_i$, where $p_i$ is the probability of the $i$th channel state. For example,
    in a two-state channel with capacity $C_1$ for state $i$ and state probability
    $p_i$, $i = 1,2$, if $C_1 < C_2$ then capacity versus outage is $C_2$ for $P_{out}
    \ge p_1$ and $C_1$ for $P_{out} < p_1$, as shown in Fig. 2.5b. More details on
    ergodic capacity, outage capacity, and capacity versus outage can be found in
    [4, 32, 33, 36]. Note that when the channel is nonergodic, such that the channel
    state is chosen at random from the set $\mathcal{S}$ and remains constant for
    all time, the channel is referred to as a *compound channel*. In this case the
    capacity generally corresponds to achievable rates associated with the worst-case
    channel slice [90].


