    Equation (1.5) suggests that when power or bandwidth is constrained, the marginal
    utility achieved by using additional bandwidth is significantly greater. However,
    since the total bandwidth available in the network/system needs to be preserved,
    one may question whether it is really beneficial to reallocate bandwidth, since
    after all, when one node acquires additional bandwidth, it is at the expense of
    some other node(s) that loses an equal amount of bandwidth. Further, as the bandwidth
    increases (widenode regime), the marginal increase in capacity saturates. Despite
    the marginal increase, a simple example can illustrate the performance gains from
