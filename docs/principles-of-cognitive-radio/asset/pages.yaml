- pgno: 122
  md: 'secondary user’s sequence, it can use binning in a similar fashion. These information-theoretic
    strategies have not yet made their way into commercial systems, where underlay
    and interweave currently dominate. Moreover, extensions of these ideas to networks
    of more than a few secondary and primary users remain open problems. However,
    as this chapter has shown, the overlay paradigm holds significant promise for
    increasing the capacity of both secondary and primary users above that of the
    other cognitive radio paradigms. If these information-theoretic results can be
    translated to practice, then perhaps at some point in the future overlay systems
    may dominate some segments of the cognitive radio landscape.


    There are many open problems in determining fundamental performance limits of
    cognitive networks. In the context of underlay networks, capacity when nodes have
    multiple antennas that can direct secondary transmissions away from primary users
    has been investigated in [93]. Capacity versus outage based on incorrect information
    about the interference caused between primary and secondary users has not yet
    been explored. For interweave networks, there is much active research to determine
    optimal medium access protocols that achieve capacity. In addition, the scaling
    laws to date assume single-hop routing and an exclusion region around the primary
    users – perhaps these scaling laws can be improved upon by considering relaying
    as well as hierarchical cooperation, which have proved fruitful in developing
    improved scaling laws for noncognitive networks. Capacity results for overlay
    networks to date mainly assume one secondary and one primary user. Since the capacity
    regions for conventional ad hoc networks with more than a few users have proved
    elusive, we expect the same will be true with overlay networks, unless the intelligence
    associated with cognition proves to simplify the problem and facilitate a solution.
    There are few fundamental performance results for metrics other than capacity
    such as energy, delay, and complexity, nor have asymptotic scaling laws been developed
    for any of these networks. In particular, while capacity strategies for overlay
    networks with more than a few nodes may be difficult to obtain, perhaps scaling
    laws that exploit previous work on scaling in the absence of primary users can
    be extended to take the primary network into account. Performance bounds with
    respect to energy require models for energy consumption that includes both transmit
    and circuit (analog and processor) energy, which have proved difficult to obtain.
    This complicates determining tradeoffs between performance (which improves via
    sophisticated signal processing and encoding/decoding) and energy consumption.
    Indeed, the development of fundamental performance metrics for cognitive networks
    is a rich and active area of research. Results in this area will prove essential
    to obtain insights and performance bounds for these emerging systems.


    The next chapter develops the models associated with signal propagation in cognitive
    networks. These models are critical to determine the nature of interference at
    primary receivers and of the desired received signals at all receivers. In particular,
    different radio bands will have very different interference characteristics since
    propagation is highly dependent on frequency. Moreover, the time-variations of
    these channels dictate how well the information required under the different cognitive
    user paradigms can be obtained, and how fast such systems need to adapt.'
