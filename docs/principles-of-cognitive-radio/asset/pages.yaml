  md: 'Note that for typical wireless channels this rate can be achieved even when
    the primary user''s transmitter is not adapting its rate to the presence or absence
    of interference, as long as the primary user''s receiver is aware of the interference
    from the secondary user [32, Section 4.2].


    The effect of missed detection on the secondary user is similar to that of the
    primary user. In particular, the secondary user is unaware of primary user transmissions
    during missed detection, which happens with probability $P_{\mathrm{MD}}$. Hence
    the two-state switch channel of the secondary user becomes a three-state channel:
    when the switch is OFF capacity is zero since the secondary user does not transmit;
    when the switch is ON the capacity of the channel equals the interference-free
    capacity when the spectrum hole is correctly detected, and it equals capacity
    with the interference from the primary user when the hole is falsely detected.
    Let $C_s$ equal the capacity of the secondary user''s channel during transmission
    when the primary user is inactive, and let $C_s^I$ equal the capacity of the secondary
    user''s channel during transmission when the primary user is active (missed detection).
    For AWGN channels with bandwidth $W$, noise power $N_0 W$ and interference treated
    as noise, these correspond to $C_s = W \log_2(1 + P_s/(N_0 W))$ and $C_s^I = W
    \log_2(1 + P_s/(N_0 W + Z_p))$, respectively, for $P_s$ the received signal power
    at the secondary user''s receiver, and $Z_p$ the interference caused by the primary
    transmitter to the secondary user''s receiver. Since the channel is unknown, the
    correct metric for secondary user capacity when it is transmitting is capacity
    versus outage. Similarly to the case of the primary user under missed detection,
    this function is given by $C_s^I$ for $P_{\mathrm{out}} \leq P_{\mathrm{MD}}$
    and $C_s$ for $P_{\mathrm{out}} > P_{\mathrm{MD}}$. Hence, if the outage probability
    $P_{\mathrm{MD}}$ is acceptable, then the secondary user can transmit at any rate
    $R < C_s$ and accept that a fraction $P_{\mathrm{MD}}$ of the data will be decoded
    in error. If that is an unacceptable outage probability then, assuming it can
    bound the maximum interference power of the primary user as $I_{p, \max}$, it
    can transmit at any rate $R < W \log_2(1 + P_s/(N_0 W + I_{p, \max}))$ such that,
    as long as the bound is accurate, data sent at that rate will be correctly decoded.
    Similarly, if it does know $C_s^I$ then it can send at that rate with no outage.
    Since the secondary user is active with probability $P_{\mathrm{on}}$, the secondary
    user''s throughput averaged over all time, given a fixed transmission rate of
    $R$ when it is active, is $P_{\mathrm{on}} R$.


    In addition to incorrectly detecting a spectrum hole, the secondary user detects
    the presence of a primary user when none is present with probability $P_{FA}$.
    Hence, if the secondary user transmits at rate $R$ when the switch is ON, the
    capacity of the secondary user is reduced by $P_{FA} R$ relative to the case of
    no false alarm due to the missed transmission opportunities. Note that the exact
    detection strategy is not needed for capacity calculations under missed detection
    and false alarms. Only the probability of missed detection and false alarm is
    used in these capacity calculations, and this can be determined for any given
    detection strategy, as discussed in Chapters 4 and 5.


    # 2.6.3 Scaling laws for interweave networks


    In Section 2.3.3 we discussed scaling laws for $K$-user wireless networks. We
    now discuss scaling laws in interweave networks with one or more primary and secondary
    users. Not much is known about scaling laws for this type of network, although
    scaling laws'
