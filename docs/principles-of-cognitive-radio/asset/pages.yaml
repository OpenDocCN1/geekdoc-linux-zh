    for the joint action a_{1,n},..., a_{N_{G_U,n}} of the players in state s_n resulting
    in new state s_{n+1}.


    Stochastic games differ from the earlier games discussed earlier in the sense
    that there are multiple states that change stochastically during the course of
    the game. Hence, stochastic games provide an excellent fit to the constantly changing
    dynamic environment in cognitive radio applications. The consequence is that in
    a stochastic game the players'' strategies depend on the current state. The mapping
    of the states to actions is called a policy. Multiagent reinforcement learning
    is one of the most prominent approaches for optimizing the behavior of the players
    in a stochastic game (i.e., learning a policy that maximizes a given objective
    function). See Section 5.3.3 for an introduction to multiagent reinforcement learning,
    solving stochastic games, and their applications to cognitive radios.


    In this section we have provided a short introduction to game theory and its applications
    in cognitive radio networks along with a review of the most recent literature.
    For a more comprehensive treatment of game theory in cognitive radio networks,
    we refer the reader to [118, 209].


    # 5.3.5 Location awareness and geolocation


    Location awareness and geolocation are at the core of situational awareness in
    cognitive radio systems. Or, more precisely, awareness of one''s location relative
    to the other spectrum users is at the core of situational awareness since, depending
    on the application, it may not be necessary for a cognitive radio user to know
    its exact geographical location; rather a location relative to the other users
    of the spectrum may suffice. Nevertheless, location information plays an important
    role in spectrum access and interference management. The more accurately a secondary
    user knows the locations of the other users of the spectrum and the network topologies,
    the more accurately it can estimate the level of interference caused to them by
    its transmissions and subsequently adjust its transmission parameters accordingly.
    Location information is also beneficial in routing and scheduling problems. The
    capability to understand propagation phenomena and detection distances, primary
    user communication distances, and interference distances add to the location awareness
    and allow for modeling areas of harmful interference, achieving high data rates,
    as well as satisfying the interference constraints. The question then arises:
    how can a cognitive radio user obtain this location information?


    Outdoors, a mobile secondary user may employ satellite positioning techniques
    such as global positioning system (GPS) to obtain its own geolocation. In some
    cognitive radio applications this may already provide the secondary user a wealth
    of information for efficient and effective spectrum exploitation. For example,
    the reuse of digital TV frequency bands is such an application. The TV broadcast
    towers are located in fixed, static positions that are typically publicly available.
    Hence, a cognitive radio user knowing its own geolocation can easily determine
    the nearby TV broadcast towers and the'
