- pgno: 133
  md: 'path in a particular frequency band. The response of any linear time-invariant
    medium can be characterized by the *impulse response*, h(τ), or the *frequency
    response*, H(f), the two functions being related by the Fourier transform. We
    will focus on the impulse response and how it is affected by the interaction of
    the propagation medium, system geometry, and surrounding environment.


    A distinguishing feature of any particular radio path to be analyzed is the joint
    positions of the transmitter (TX) and receiver (RX). We denote the combination
    of the TX and RX location coordinates by x, which uniquely specifies the path
    (or *link*) geometry in space. We further note that the impulse response of interest
    is just the response within the radio bandwidth of interest, e.g., between f_c
    − W/2 and f_c + W/2, where f_c is the center frequency of the signal band and
    W is the signal bandwidth or, more generally, the width of any frequency interval
    for which one chooses to measure or model the channel response. Strict confinement
    to this f-interval, which we denote by F, is generally enforced by the TX and
    RX filters, so the h(τ) we seek to characterize is just the response within F.
    We therefore invoke the notation h(τ; x, F) to signify the spatial and spectral
    specificity of the impulse response we are discussing. The impulse and frequency
    responses are, in all cases, low-pass functions referenced to the center frequency
    f_c.


    We now introduce the *power gain*, G, of the path, which is the average of |H(f)|²
    over both the signal bandwidth (i.e., over the spectral domain F) and the local
    spatial domain of whichever end(s) of the path are potentially mobile. Thus, we
    can write


    G = E_x[1/W ∫_F |H(f)|² df] = E_x[1/W ∫_τ |h(τ, x, F)|² dτ], (3.1)


    the second equality being a consequence of Parseval’s theorem.¹ We can therefore
    write


    h(τ, x, F) = [G]^{1/2} ĥ(τ, x, F) (3.2)


    where ĥ(τ; x, F) is normalized such that its squared magnitude, averaged over
    x, integrated over τ and normalized by W, is 1. For concreteness the spatial average
    can be thought of as taken over a circle centered on the mobile’s nominal location,
    with a radius of about 10 wavelengths.


    The relevance of this representation is that the two factors in h(τ, x, F) above
    are important in different ways, and they change on different scales of distance
    and frequency. The power gain, G, is important in determining interference levels
    from and into CR networks, and the signal-to-noise ratios of links within the
    CR network. The normalized impulse response, ĥ(τ, x, F), is important in determining
    CR signal distortion and in devising techniques for combating it. Moreover, G
    varies in a *large-scale* way, i.e., it changes over location separations of tens
    of meters or more and frequency separations of hundreds of MHz or more. By contrast,
    ĥ(τ, x, F) varies in a *small-scale* way, i.e., it can change significantly over
    distances as small as a fraction of the radio


    ¹ The spatial averaging denoted by E_x is over a local area about the mobile’s
    nominal position. It is equivalent to averaging over small changes in the mobile
    position coordinates, which are part of x.'
  merge: -1
  img_proc: true
- pgno: 134
  md: 'wavelength (e.g., 30 cm at 1 GHz) and over frequencies well within the bandwidth
    of a typical communications signal (20 MHz or smaller).


    Finally, we note how G relates to the very important radio quantity called path
    loss, PL. Specifically, path loss is the negative decibel value of G²:


    $PL = -10\log(G).$ (3.3)


    We shall treat the large-scale path loss and the small-scale impulse response
    separately, dropping the adjective "normalized" in the latter case for convenience.


    # 3.3 Introduction to path loss


    # 3.3.1 Free-space path loss


    If a radio wave at a given frequency f is radiated from a transmitter, and there
    are no sources of reflection or scattering in its path, it spreads outward with
    no loss of total power. Therefore, its power density, say in watts/m², decreases
    as the inverse square of distance, d. A receiver that detects the wave will therefore
    see a power proportional to d⁻². Assuming no antenna gain at either end of the
    TX-RX path, the relationship between receive power Pr and transmit power Pt is
    given by


    $P_r = P_t\left(\frac{c}{4\pi f d}\right)^2,$ (3.4)


    where c is the speed of radio wave propagation in the medium and c, f, and d are
    expressed in consistent units. This is the famous Friis formula for free-space
    propagation [34]. Noting that the power gain is Pr/Pt, we see that G for the free-space
    case is just the squared term in (3.4). Or, from (3.3), we can say that the free-space
    path loss is


    $FSPL = 20\log\frac{4\pi d}{\lambda},$ (3.5)


    where λ = c / f is the wavelength. For example, on a path of length 1 km at f
    = 1 GHz, FSPL = 92.4 dB.


    The physical world being what it is, there are few radio services in the terrestrial
    domain where (3.5) might apply. Though the formula for free-space path loss may
    thus seem irrelevant to CR, we introduce it nonetheless, not only for its historic
    importance, but because it provides a baseline for other path loss formulas we
    will discuss.


    # 3.3.2 Path loss in CR scenarios


    There are potential CR applications where propagation between towers can be important.
    For example, one use of CR is as a backbone network for carrying Internet traffic,
    replacing fiber optic transport [36]. In such cases, the CR towers might be lower
    and embedded in urban areas, with antennas that are compact and thus of limited
    directivity.'
