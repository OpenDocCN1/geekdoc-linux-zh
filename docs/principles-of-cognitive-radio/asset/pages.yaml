  md: 'generic form. We note, however, that some formulas contain “break points” in
    distance, d, where the value of γ changes; and some formulas for indoor environments
    add one or more terms to capture the effects of transmission through floors and
    walls [92]. Primarily, though, what distinguishes one set of authors from another
    is how they characterize A and γ. We will describe here two median path loss models
    in some depth. In so doing, we hope to illustrate, by concrete examples, the nature
    of such models for wireless systems.


    For cellular systems in particular, the most popular model is the one developed
    by Hata [53] based on extensive measurements made by Okumura in the Tokyo area
    in the 1960s [85]. The model covers distances from 1 to 20 km; frequencies from
    150 MHz to 1.5 GHz; base antenna heights from 30 to 200 m; and mobile antenna
    heights from 1 to 10 m. The environments covered are urban areas (large cities
    and medium-small cities); suburban areas; and open areas. In the 1990s, as personal
    communications services (PCS) opened up worldwide near 2 GHz, the Hata-Okumura
    model was expanded to include frequencies up to 2 GHz, and small urban cells (diameters
    below 1 km). This expansion, developed by the European Cooperative for Scientific
    and Technical Research, is the COST 231–Hata model [111].


    The original Hata–Okumura model is applicable to wide-area scenarios wherein the
    user terminals are mobile. A situation like this is suitable for cognitive radio
    scenarios where the delay tolerance of the service is high. For urban environments
    and user terminals at height 1.5 m, the formula for PLmed is identical to the
    bracketed quantity in (3.8), where d0 = 1 km;


    A = [69.55 + 26.16 log₁₀ f_c − 13.82 log₁₀ h_b]; (3.12)


    and


    γ = [4.49 − 0.655 log h_b]. (3.13)


    In these formulas, f_c is the carrier frequency in MHz and h_b is the base antenna
    height in meters. The model provides additive terms to A that adjust it for terminal
    heights different from 1.5 m and environments different from urban. For similar
    CR applications over a smaller area (radii less than 1 km) and frequencies closer
    to 2 GHz, COST 231–Hata is more applicable. The term 26.16 log₁₀ f_c in A is largely
    due to the antenna aperture effect in all path loss equations, including the one
    for free-space propagation, which accounts for 20 log₁₀ f_c; the remaining part,
    6.16 log₁₀ f_c, is due to radio wave diffraction around obstructing objects along
    the radio path, causing an incremental loss that increases with frequency.


    The Erceg path loss model, devised for fixed wireless applications [27], was cited
    in Section 3.4.2 in connection with shadow fading. A CR context for this model
    might be transmission to and from fixed sensors (e.g., as used for radio mapping)
    distributed over a wide area. The model was derived from 1.9 GHz data collected
    from 95 suburban/residential areas, all with radii of 2 km or less and all downlink
    terminals at 2-m height. The data span a variety of base antenna heights and terrain
    types, and the model delineates their influences. Extensions to other carrier
    frequencies and terminal heights can be made via simple scaling laws, e.g., see
    [25].'
