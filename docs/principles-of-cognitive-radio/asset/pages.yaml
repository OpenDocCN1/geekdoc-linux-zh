  md: 'However, this is not a common paradigm since it is simpler for a secondary
    user to determine the interference it causes to a primary receiver than to determine
    the capacity degradation it causes. Thus, we will focus on the capacity of underlay
    systems given interference constraints imposed on the secondary users.


    When multiple secondary and primary users coexist, their interference constraint
    needs to be satisfied at the primary user that is the most impaired by the interference
    from secondary users. As explained earlier, satisfying the interference condition
    requires that a secondary transmitter knows the channel to the primary receiver.
    Otherwise, in order to guarantee that the interference constraint is satisfied
    under unknown channel conditions, the secondary user’s transmit power needs to
    be severely restricted. In the presence of multiple secondary users, determining
    the interference at the primary receiver becomes more demanding, as the interference
    depends on transmit powers and channel conditions from all secondary transmitters,
    as described in more detail later in this section.


    # ## 2.5.1 Underlay capacity region


