  md: 'sensing will be covered here, while more advanced material is contained in
    Chapter 5: in particular, while here we focus primarily on single-sensor detection,
    the next chapter will be centered on collaborative sensing.


    # Increasing the dimensionality of the observed-signal space


    As the spectrum sensing performance must meet an assigned target, two choices
    are available to enhance its performance if needed. They consist of increasing
    either the signal-to-noise ratio (SNR) of the primary user, as measured by the
    secondary user, or the number of dimensions of the observed-signal space [47].
    Due to the presence of shadowing and multipath fading, as discussed in Chapter
    3, and to channel modeling uncertainties – see Sections 4.5 and 4.6), increasing
    the SNR may be a challenging task. Thus, dimensionality expansion may be a more
    attractive solution. This can be achieved by increasing the number of time dimensions
    (i.e., the number of independent observed samples), or the number of space dimensions.
    The latter task can be achieved by using more than one sensor, each located at
    a spatially independent position and working cooperatively. Cooperative sensing
    will be described in detail in Chapter 5.


    # Sensing periodicity


    The sensors should periodically sense the spectrum, to detect changes in the primary
    signal transmission pattern. With interleaving, after a while space is detected
    the secondary users may start transmitting on it, but at the same time should
    continue to sense the spectrum and detect when the primary user resumes its transmission.
    Since sensing cannot occur simultaneously with transmission, it must be interleaved
    with data transmission. The sensing period, i.e., the time interval between two
    adjacent sensing sessions, should reflect the maximum time duration in which the
    secondary user may assume that no change has occurred in the spectrum (an appearing
    or disappearing primary user). This maximum duration will depend on the type of
    primary service (very small for public safety, larger for services where the spectrum
    usage varies over a larger time scale). In order to maximize the time available
    for transmission, secondary users should keep the time required for sensing well
    below the sensing period: see [15, p. 1053], [17, p. 34 ff.]. Notice that long
    and frequent sensing sessions improve sensing performance, but reduce the time
    devoted to data transmission. Conversely, short and widely scattered sensing sessions
    increase the time allocated to transmission, but degrade the quality of sensing.
    Thus, there is a tradeoff between sensing duration and secondary-user throughput
    [28, 34, 47].


    # 4.2 Interference temperature for cognitive underlaying


    With cognitive underlaying, the secondary users are allowed to operate on the
    same spectrum as primary users, provided that the amount of interference power
    they generate, measured at the primary receiver, does not exceed a given limit
    and hence can be treated as essentially harmless. Implementation of this concept
    hinges on the definition of a useful metric for interference tolerance, and on
    the accurate estimation of the gain'
