  md: 'These correlations have an impact on the planning of CR radios. For example,
    the correlation between shadowing and delay spread helps in wideband sensing:
    in the shadowing fades, where detection of a primary radio is basically more difficult,
    the increased delay dispersion helps to average out the small-scale fading. In
    turn, this helps to decrease the missed-detection probability.


    We also note that values of spreads do not give a complete description of the
    channel dispersion characteristics. A full description of the joint second-order
    statistics of the dispersion is given by the double-directional delay power spectrum
    (DDDPS), i.e., the expected value of the squared magnitude of the DD... [33, 60].
    While many papers in the literature assume that the DDDPS can be decomposed into
    a product of PDP, APS at the TX, and APS at the RX, several experimental investigations
    indicate that such a factorization is an oversimplification. For example, the
    APS does depend on the delay [17, 51, 64, 81]. This is especially true in cases
    where the multipath components are arriving in clusters [35, 77, 95, 104].


    # 3.10 Polarization


    Radio wave polarization can play an important role in wireless systems, including
    CR. For one thing, there is the possibility of using polarization for multiplexing
    of two or more separate signal streams on the same frequency, using one polarization
    for one set of streams and an orthogonal polarization for the other. An implementation
    example is shown in Fig. 3.8, where each end (TX and RX) uses two cross-polarized
    antennas in a 2×2 version of multiple-input/multiple-output (MIMO) signaling.
    A big advantage of such a dual-pol approach, especially for handset design, is
    that the antenna structure at each end can be compact.


    Alternatively, polarization can be used to achieve diversity against multipath
    fading. Here, the fact that there is “polarization mixing” in multipath is exploited.
    To elaborate, we initially assume that the transmission from a given antenna element
    is vertically polarized (V-pol). Due to the reflections and scatterings of MPCs,
    this signal will lose its polarization purity in the air and be received on both
    vertical and horizontal polarizations. The same applies to an antenna element
    that is horizontally polarized (H-pol). Thus, for example, in a 2×2 MIMO link
    with crossed H-V elements at each end, there


