    Moreover, distributed sensing leads to improvement in the detector performance
    which is typically measured in terms of false alarm and detection probabilities
    or detection time at a specified performance level. Multiple sensors also provide
    inherent redundancy which improves the reliability and robustness of the system.
    However, we should observe here that, while increasing the number of cooperating
    sensing nodes improves the final decision performance, the amount of system resources
    needed in the fusion process (total power needed to transmit measurements, amount
    of overhead traffic in the “secondary” network linking sensors and fusion center,
    and memory requirements at the fusion center) also increases. Thus, there might
    exist an optimum number of cooperating sensors, beyond which the detection performance
    improvement does not compensate for the incurred penalty in the use of resources
    [43, 212]. Other relevant issues here are how to deliver information to the fusion
    center, and how low-SNR sensing nodes and errors in the transmission to the fusion
    center degrade the overall performance.


    Spectrum sensors can be included in mobile terminals that want to exploit underutilized
    spectrum. Consequently, multiple mobile terminals can form a distributed sensing
    or detection system. Cooperative sensing facilitates using simpler and more energy-efficient
    detectors in each sensing node and consequently extend battery life in battery-operated
    terminals. On the other hand, distributed sensing typically requires transmitting
    control information and sensing results to the fusion center or to the other nodes.
    Obviously, this adds to the energy consumption in the secondary network. Furthermore,
    policies used for accessing the spectrum also play a crucial role in determining
    the power consumption. Therefore, evaluating overall energy consumption requires
    more holistic system level considerations.


    There are many ways to characterize the gains obtained through spatial diversity.
    In order to illustrate the gains we present a quantitative measure that is particularly
    suitable for cooperative detection of primary user activity in cognitive radio
    networks. In particular, we study the probability of detection P_D (defined in
    Chapter 4) as a function of the logarithm of the SNR γ, i.e., a special case of
    the receiver operating characteristic (ROC) curve. We define the spatial diversity
    order as follows [146]:


    $$ SD(N_{SU}) = \max \frac{\partial}{\partial \gamma_{dB}} P_D(\gamma_{dB}, N_{SU}),
    \tag{5.1} $$


    where $\gamma_{dB} \equiv 10 \log_{10} \gamma$, $\frac{\partial}{\partial \gamma_{dB}}$
    denotes the partial derivative with respect to $\gamma_{dB}$, and $N_{SU}$ is
    the number of sensors. The ROC curves in Fig. 5.1 illustrate the detector performance
    for equal gain combining (EGC) cooperative energy detection (radiometry) (see
    (5.9)–(5.11) below) for iid Rayleigh fading channels. It can be clearly seen from
