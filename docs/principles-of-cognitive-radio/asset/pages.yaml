    # Centralized vs. decentralized sensing


    Distributed systems can be either centralized or decentralized. In a centralized
    system all the local sensors transmit all the observed local data to a central
    processor that combines the data to perform decision making or parameter estimation
    tasks using optimal signal processing techniques. Decentralized systems, on the
    other hand, employ intelligent sensors that process the local data before transmitting
    it to a central processor called the fusion center (FC). Local binary decisions
    or some other compact representation summarizing the state of the spectrum may
    be transmitted to the fusion center. Consequently, the fusion center of a decentralized
    system has only partial information received from the sensors, whereas the central
    processor has all the information in a centralized system. Typically, any quantization
    of the sensed data leads to performance losses.


    Each spectrum sensor may also convey some quality information about the local
    sensing statistics such as SNR and a local sensor performance index. Such side
    information may be exploited in combining the results from multiple sensors and
    weighting the reliability of the local decision statistics from each sensor. It
    may also help in interference management; if the power levels transmitted by the
    primary user are known and the channels can be assumed to be reciprocal, then
    better power control and medium access may be achieved.


    The decentralized distributed detection approach is appealing in the cognitive
    radio context where the local sensors typically have the capability to process
    the acquired data and extract relevant information from it. As noted above, in
    cognitive radio applications the local spectrum sensors might typically be installed
    on battery-operated devices. Hence, in order to conserve energy, the amount of
    data transmitted should be kept to'
