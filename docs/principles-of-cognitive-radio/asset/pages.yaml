  md: 'The field strength vs. distance data in [94] are given as functions of two
    antenna height parameters, h1 and h2, the latter being the actual height of the
    receiving antenna. The height h1 pertains to the transmitter antenna and the path
    geometry; specifically, it is a function of the actual antenna height above the
    ground, h_a, and the effective antenna height, h_eff, defined for land paths as
    the antenna height above the average ground level between distances of 3 and 15
    km in the direction of the receiver. The value of h1 is calculated from h_a and
    h_eff as follows:


    ```

    h1 = { h_a, d < 3 km; h_a + (h_eff - h_a)(d - 3)/12, 3 km ≤ d < 15 km; h_eff,
    d ≥ 15 km, } (3.15)

    ```


    where d is the TX-RX distance in km.


    Some example curves are shown in Fig. 3.3 for a frequency of f_c = 600 MHz, some
    typical TV tower heights, and a fixed receiver height, h2, of 20 m. In these curves,
    the difference between h_eff and h_a is fixed, i.e., h_eff - h_a = 50 m. These
    kinds of curve can be used for a TV tower radiating interference into a CR tower.
    The curves shown can be adjusted for receiver heights other than 20 m via additive
    correction terms given in Annex 5 of [94].


    It should be emphasized that the curves in Fig. 3.3 are median values over space,
    based on measurements carried out in Europe and North America. Also, since broadcast
    signals are subject to diurnal variations, the median values over space have been
    derived for different percentiles of the temporal variations. The values plotted
    in Fig. 3.3 represent the path loss values exceeded 50% of the time. It is also
    implicitly assumed that the spatial variations of path loss are Gauss-distributed.


    ![](img/2d42983cf592ef4fc8a22646ddc49799_143_0.png)


    Figure 3.3 Path loss from high towers vs. distance using the P.1546 model. For
    all curves, h2 = 20 m, h_eff - h_a = 50 m, and f_c = 600 MHz.'
