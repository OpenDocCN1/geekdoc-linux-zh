    solution based on global optimization principles [187]. The algorithm proposed
    in [187] obtains the globally optimum solution by calculating one root (lying
    in a specific interval) of a polynomial equation whose degree is not greater than
    2N_SU. This can be accomplished, for example, by employing the Newton–Raphson
    iterative algorithm [187]. Moreover, the algorithm proposed in [187] can also
