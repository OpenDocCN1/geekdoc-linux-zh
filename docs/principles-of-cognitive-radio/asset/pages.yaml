    \,\middle|\, s_n = s \right]$$

    $$= \mathbb{E}_{\pi}\left[ r_{n+1} + \xi V^{\pi}(s_{n+1}) \,\middle|\, s_n = s
    \right]$$

    $$= \sum_{s''\in S} P(s''|s,a)\,[r(s,a,s'') + \xi V^{\pi}(s'')], \quad (5.49)$$


    where it can be seen that the successive states have a recursive relationship,
    thus allowing the problem to be broken down into simpler subproblems. The last
    two forms in (5.49) are forms of the Bellman equation [16, 19].


    The optimal value function $V^*$ satisfies the Bellman optimality equation:


    $$\mathcal{V}^*(s) = \max_a \mathbb{E}\big[ r_{n+1} + \xi \mathcal{V}^*(s_{n+1})
    \mid s_n = s, a_n = a \big]$$

    $$= \max_a \sum_{s''\in S} P(s''|s,a)\,[r(s,a,s'') + \xi \mathcal{V}^*(s'')],
    \quad (5.50)$$


    Dynamic programming offers a computationally more efficient method of finding
    the optimal solution compared to brute-force techniques. However, dynamic programming
    still suffers from the curse of dimensionality: the computational and memory requirements
    grow exponentially as the number of states and actions increases. Hence, dynamic
    programming may not be the best overall solution in many cognitive radio applications,
    especially, those involving mobile, battery-powered user equipment with limited
    computational and memory resources. However, dynamic programming provides insight
    into the optimal solution that can then be employed to obtain near-optimal reduced-complexity
    algorithms and methods to be employed in practice.


    Finally, we would like to point out that dynamic programming requires a model
    for the state transitions and rewards. In Section 5.3.3 we will introduce model-free
    reinforcement learning methods that can be used to solve the same problems as
    dynamic programming (although we note that in general reinforcement learning methods
    can only approximate the optimal solutions). However, in the following we will
    briefly review a few dynamic programming as well as other optimization approaches
    for optimizing the performance of cognitive radio systems. For comprehensive treatments
    of dynamic programming we refer the reader to [16] and [19].


    # Optimizing the sequential order of sensing multiple frequency bands


    In [76] the optimization of the frequency band sensing order in a multiband cognitive
    radio system is considered. That is, in each time slot, given $n_B$ frequency
    bands, the secondary user senses the frequency bands one at a time according to
    a sequential order until it finds a frequency band that is both available and
    has acceptable channel quality. Then the secondary user proceeds to transmit on
    that frequency band for the rest of that time slot. The goal is to optimize the
    frequency band sensing order so that the expected throughput of the secondary
    user is maximized. The problem may be formulated as an optimal stopping problem
    as follows.'
