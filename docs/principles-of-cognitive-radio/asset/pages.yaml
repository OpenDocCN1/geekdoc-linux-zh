- pgno: 156
  md: 'as ultra-wideband (UWB) systems, discussed later. The more typical “wideband”
    condition occurs when W T_N > 1 and there are several MPC arrivals within each
    τ-interval of width 1/W. We next develop a useful and time-honored model for this
    case, the tapped delay line (TDL) filter.


    The representation (3.37) is quite general, but not measurable or useful when
    there is overlap among the individual terms. Another general form that can be
    quite useful in that case is the sampled-and-interpolated version, using Nyquist
    theory to express ĥ(τ) via uniformly spaced sinc functions:


    ĥ(τ) = Σ_m sinc((1/Δ)(τ − mΔ)) Σ_n a_n δ(mΔ − τ_n). (3.38)


    where Δ is the sampling interval and can be any value that does not exceed 1/W.
    We will assume here that equality holds, Δ = 1/W. We can thus rewrite (3.38) more
    simply as


    ĥ(τ) = Σ_m c_m ξ(τ − m/W). (3.39)


    where c_m is the inner sum over n in (3.38), normalized by W. Whereas all of the
    MPCs contribute to this mth amplitude, we can see that the major contributors
    are those for which τ_n lies in the time-of-arrival interval [(m − 1/2)/W, (m
    + 1/2)/W]. We call this interval the “resolvable delay bin” about τ = m/W and
    note that a bin with multiple MPCs will exhibit fading as the mobile moves over
    space. Under our assumption that the number of MPCs falling into a delay bin is
    large, the fading statistics tend towards complex Gaussian, as discussed in Section
    3.6. Otherwise, different fading statistics, like Nakagami or lognormal fading,
    might be more suitable. If a line-of-sight exists between the TX and RX, then
    the amplitude fading in the first delay bin is typically Rice-distributed.


    As we can see from (3.37), the pulses corresponding to actual MPCs are spaced
    in time at irregular intervals, corresponding to the placement of the scatterers
    in the environments. Representing these by regularly spaced taps is exact only
    if the tap spacing is at most 1/W. Furthermore, according to the interpolation
    function, one actual MPC can impact many regularly spaced taps, thus possibly
    introducing correlation into the fading of the taps. Lastly, we note that the
    regular spacing of the taps leads to a periodicity of the frequency transfer function,
    with the period being the inverse of the tap spacing. When the tap spacing is
    1/W or less, the period is W or more. Since a signal band is of width W, there
    is no overlap of the repeated spectra.


