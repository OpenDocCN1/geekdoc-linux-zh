    # ### 2.2.3 Interweave paradigm


    The interweave paradigm is based on the idea of *opportunistic communication*,
    and was the original motivation for cognitive radio [62]. The idea came about
    after studies conducted by the FCC [27], universities [6], and industry [80] showed
    that a major part of the spectrum is not fully utilized most of the time. In other
    words, there exist temporary space–time–frequency voids, referred to as *spectrum
    holes* or *white spaces*, that are not in constant use in both the licensed and
    unlicensed bands, as shown in Fig. 2.4. The spatial spectrum holes may be in a
    single spatial dimension or, for MIMO devices, in the subset of spatial dimensions
    not occupied by the primary users (i.e., in the null space of the primary users’
    receivers) [101]. Spectrum holes can be exploited by secondary users to operate
    in orthogonal dimensions of space, time, or frequency relative to the primary
    user signals. Thus, the utilization of spectrum is improved by opportunistic reuse
    over the spectrum holes. The interweave technique requires detection of primary
    (licensed or unlicensed) users in one or more of the space–time–frequency dimensions.
    This detection is quite challenging since primary user activity changes over time
    and also depends on geographical location. Chapters 4 and 5 discuss spectrum hole
    detection by a single receiver and by multiple receivers, respectively, in more
    detail. Interweave techniques can also serve as a MAC protocol in networks where
    all users have equal priority. In this setting existing transmissions are treated
    as primary signals, while new users access the spectrum using interweave techniques
    such that they do not interfere with active transmissions.


    ![](img/2d42983cf592ef4fc8a22646ddc49799_72_0.png)


    Figure 2.4 Spectrum occupancy measurements up to 6 GHz in an urban area at mid-day
    (Berkeley Wireless Research Center [6]).'
