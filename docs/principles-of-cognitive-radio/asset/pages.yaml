  md: 'For interweave networks with multiple secondary users, a MAC protocol is needed
    to share the available spectrum holes amongst them. Given the similarity of this
    problem with medium access control in conventional networks, the protocols that
    have been proposed for this setting are often derived from conventional MAC protocols
    such as ALOHA and CSMA [13]. Simple time-sharing mechanisms may also be used,
    and this can greatly simplify capacity analysis. Advanced MAC protocols for multiuser
    interweave networks utilize additional spatial degrees of freedom from multiple
    antennas, optimization based on more advanced mathematical models such as partially-observed
    Markov chains, or game theory and pricing mechanisms [43, 88, 101, 102]. The challenge
    to medium access in the interweave setting above and beyond what has been addressed
    in conventional MAC protocols is that the channel to be shared is unknown, since
    it depends on the activity of the primary users. This primary user activity will
    depend on the MAC protocol of the primary system, which is designed completely
    independently of the secondary system. Given the many variants of MAC protocols
    for conventional systems, developing an effective MAC protocol for secondary users
    remains one of the biggest challenges in interweave system design.


    To summarize, an interweave cognitive radio is an intelligent wireless communication
    system that periodically monitors the radio spectrum, detects primary user occupancy
    over time, space, and frequency, and opportunistically communicates over spectrum
    holes with minimal interference to the primary users. Additional motivation and
    discussion of the signal processing challenges faced in interweave cognitive radio
    is presented in [41], as well as in Chapters 4 and 5.


    # 2.2.4 Comparison of cognitive radio paradigms


    Table 2.1 summarizes the differences among the underlay, overlay, and interweave
    cognitive radio approaches. While underlay and overlay techniques permit concurrent
    primary and secondary user transmissions, avoiding simultaneous transmissions
    with primary users in overlapping dimensions of time, space, or frequency is the
    main goal in the interweave technique. We also point out that the cognitive radio
    approaches require different amounts of side information: underlay systems require
    knowledge of the interference caused by the secondary transmitters to the primary
    receivers, interweave systems require considerable side information about the
    primary user activity (which can be obtained from sensing at one or more secondary
    nodes in the system) and overlay systems require a large amount of side information
    (knowledge of the primary user''s encoding technique and possibly its transmitted
    data sequence, along with the channel conditions in the network). Apart from device
    level power limits, the secondary user''s transmit power in the underlay and interweave
    approaches is decided by the interference constraint and range of sensing, respectively.
    Finally, hardware requirements vary across the different paradigms, as discussed
    in more detail in Section 1.7. While underlay, overlay, and interweave are three
    distinct approaches to cognitive radio, hybrid schemes can also be constructed
    that combine the advantages of different approaches. For example, the overlay
    and interweave approaches are combined in [96].'
