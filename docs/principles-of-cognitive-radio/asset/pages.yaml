  md: 'as distributed detection and sequential and quickest detection, have been reviewed.
    Distributed detection among spatially dispersed secondary users allows improving
    the sensing reliability by increasing the probability of detection for a given
    probability of false alarm. Or alternatively the sensing time can be reduced without
    sacrificing the sensing performance. Sequential and quickest detection aim at
    making the decision as quickly as possible for the given error levels. Quickest
    detection techniques facilitate also the secondary users rapid evacuation from
    a frequency band when a primary user becomes active. Both distributed detection
    and sequential and quickest detection techniques are thus important for more efficient
    and effective spectrum exploration.


    The second part of the chapter focused on the design of optimum spectrum sensing
    and access policies for optimized spectrum exploration and exploitation. Various
    approaches for modeling, analyzing, and learning the behavior of other spectrum
    users have been considered. Introductions to dynamic programming, bandit problems,
    reinforcement learning, game theory, and their applications in cognitive radio
    systems have been provided. Dynamic programming is an optimization approach in
    which the original problem is broken into recursively solved simpler subproblems.
    Although this reduces the complexity of finding the optimal solution, the computational
    complexity of dynamic programming still limits its usefulness in practical cognitive
    radio systems. In high-dimensional problems the computational complexity of obtaining
    an optimal solution through dynamic programming may be prohibitive in particular
    for battery-operated terminals with limited computing power. Hence, computationally
    efficient techniques that may be used to obtain a close-to-optimal or asymptotically
    optimal solution are of interest. Reinforcement learning, bandit problems, and
    game theory offer such techniques. A truly cognitive radio should possess the
    ability to learn from the environment and the outcomes of its previous actions.
    The goal of reinforcement learning, bandit problems, and game-theoretic learning
    methods is to learn to act optimally in a given situation. Hence, these techniques
    are particularly suitable for cognitive radio systems. Whereas bandit problems
    focus on a limited class of problems that can be cast into the framework of (restless)
    multiarmed bandits, reinforcement learning is a vast field comprising a multitude
    of different methods and possible applications. In fact, bandit problems are the
    simplest form of reinforcement learning problems. However, bandit problems offer
    a sufficient complexity to model problems such as multiband spectrum sensing and
    access in cognitive radio systems. More complicated, full-blown reinforcement
    learning problems and algorithms may be needed, in particular, if the actions
    of the secondary users are allowed to be also something other than sensing or
    accessing a certain frequency band. Nevertheless, both bandit problems and more
    general reinforcement learning problems deal with the exploitation vs. exploration
    dilemma. That is, the agent or agents must in each state decide whether to exploit
    the currently best action or to explore other actions in the hope of a better
    future reward. The learning is performed through trial and error and by reinforcing
    actions leading to good rewards, not through a teacher telling whether the chosen
    action was correct or not. Hence, these techniques are particularly suitable for
    cognitive radio applications in which the radio environment is unknown, highly
    dynamic, and nonstationary. Game theory, on the other hand, provides a collection
    of mathematical methods and tools for modeling, analyzing,'
  merge: -1
  img_proc: true
- pgno: 272
  md: 'and predicting the behavior of multiple interacting entities. In cognitive
    radio systems, game theory offers a framework for modeling and analyzing the interaction
    of multiple competing and/or cooperating spectrum users. The majority of existing
    game theory deals with static single-shot or repeated games. This means that the
    players face the same game each time. Thus, the players’ strategies do not depend
    on the current state of the environment. This does not provide a very good fit
    to cognitive radio applications in which the radio environment may be highly dynamic.
    However, a subfield of game theory called stochastic games provides an excellent
    fit to the dynamic environment encountered in cognitive radio applications. In
    stochastic games there are multiple states that change stochastically during the
    course of the game. This also means that the players’ strategies will depend on
    the current state. In addition, stochastic games provide a connection between
    game theory and multiagent reinforcement learning since multiagent reinforcement
    learning problems can be modeled as stochastic games.


    The main focus in this chapter has been on optimizing spectrum exploration and
    exploitation in interweave cognitive radio networks. For the vast majority of
    introduced techniques and algorithms the employed system framework assumes one
    or multiple primary systems and a single cognitive radio network consisting of
    identical (homogeneous) secondary users. However, in practice, there may be multiple
    heterogeneous secondary systems simultaneously trying to find and exploit the
    same underutilized spectrum. The coexistence of such heterogeneous secondary systems
    and networks has not been considered in this chapter.


    What are the implications of heterogeneous secondary systems coexisting on the
    same frequency bands? In principle, two heterogeneous secondary systems may employ
    completely different waveforms, modulation, coding, and access schemes from one
    another, for example. How then can two or more completely different secondary
    systems coexist efficiently and effectively in a licensed primary frequency band
    while controlling the interference caused to the primary users? Can the other
    secondary systems be treated only as noise? On the other hand, how do the other
    asynchronous secondary systems affect the sensing process since quiet periods
    for sensing cannot be assumed anymore? Obviously the employed sensing algorithms
    should be able to distinguish among the secondary systems and the primary systems
    if underutilized spectrum is to be exploited as efficiently as possible. However,
    how much does the interference from the other secondary systems affect the reliability
    of sensing? How do the interference and collisions with other secondary systems
    affect the efficiency of the spectrum access algorithms? These are all open questions
    that need to be answered before free coexistence of heterogeneous secondary systems
    can become reality.


