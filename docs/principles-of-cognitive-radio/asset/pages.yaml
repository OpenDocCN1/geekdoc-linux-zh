- pgno: 75
  md: 'each communicating its information to a set of destination nodes. A wireless
    network can have a supporting infrastructure (e.g., as in cellular networks),
    or an ad hoc structure, where nodes self-configure into a network and control
    is decentralized among the nodes. The typical topologies of multiuser channels
    (in isolation or within one cell of a cellular system) are multiple access (many
    transmitters to one receiver) and broadcast (one transmitter to many receivers)
    channels. These channels correspond, respectively, to the uplink and downlink
    of a satellite system or one base station in a cellular system. In these networks,
    communication occurs between a group of nodes transmitting to or receiving from
    a single node. In an ad hoc wireless network, each node can serve as a source,
    destination, and/or relay forwarding data for other users.


    In cognitive radio applications, primary and secondary users accessing the same
    spectrum form a wireless network. Primary and secondary users have different transmit/receive
    constraints due to interference limitations at the primary receivers, as well
    as possibly different transmit/receive capabilities. In cognitive radio networks
    the primary users can be cellular or ad hoc, whereas the secondary users are generally
    ad hoc and fall into the paradigms of underlay, interweave, or overlay. Hence,
    these two types of cognitive radio network users form a two-tier wireless network.
    Performance limits of wireless networks are thus of direct relevance to the performance
    limits of cognitive radio networks. In particular, the fundamental capacity limits
    of ad hoc networks dictate not only how much information can be transmitted by
    secondary users under a given set of network and interference conditions, but
    also limitations on the information exchange possible between sensing nodes to
    collaboratively assess spectral occupancy. In the following section we describe
    the broad range of performance metrics relevant to wireless networks, including
    their capacity. We then formally define mutual information and capacity for single-user
    channels as well as for general wireless networks.


    # ## 2.3.1 Performance metrics


    The fundamental performance limits of a wireless network define its best possible
    performance relative to one or more specific metrics. Many different metrics can
    be used to measure performance, such as capacity, throughput, outage, energy consumption,
    as well as combinations of these and other metrics. Since wireless networks exhibit
    significant dynamics (user movement, data traffic, channel variations, etc.),
    these dynamics must be taken into account in the definition of the network performance
    metrics.


    The most common fundamental performance limit for time-invariant communication
    systems is Shannon capacity [76] – the maximum rate that can be achieved over
    a channel with asymptotically small probability of error. Shannon’s simple yet
    elegant mathematics coupled with his revolutionary ideas for coding over noisy
    channels and bounding their fundamental data rate limits via mutual information
    has inspired generations of theorists and practitioners, and provided significant
    insights into communication system design. For single-user channels the Shannon
    capacity is a number, the maximum data rate of the channel, as will be defined
    mathematically in terms of the channel’s maximum mutual information in the next
    section. For a multiuser (broadcast or multiple access) channel Shannon capacity
    is a K -dimensional region defining'
