    utilized. By effectively nulling the subcarriers, the cognitive radio users can
    avoid interference to the primary users, as shown in Fig. 1.10. In the link level,
    the transmitter and receiver are required to mutually agree on the carriers used
    at the transmitter and receiver. This may require link rendezvous protocols for
    the handshaking messages between transmitter and receiver. Such a transmission
    scheme is called noncontiguous OFDM (NC-OFDM) in [73, 74] and differs from conventional
    OFDM systems.


    In contrast to single-carrier systems, OFDM systems are particularly sensitive
    to synchronization errors like carrier frequency offset and symbol timing errors,
    leading to


