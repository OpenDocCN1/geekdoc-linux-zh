- pgno: 135
  md: 'The careful engineering that permits the use of (3.5) for the path loss is
    not possible here. Hence, other path loss formulas are needed to quantify the
    desired signal levels received within a CR backbone network; the interference
    levels from primary transmitters (especially TV towers) to CR receivers; and those
    from CR transmitters to primary receivers.


    More typically, CR systems are wireless networks, defined in this chapter as applications
    wherein one or both link ends are in the clutter of the environment; and neither
    antenna is more than 80 m above ground. For the outdoors, this means that transmission
    is significantly affected by reflections from the ground, mountains, buildings,
    trees, vehicles, etc. For indoor environments, the reflections are from walls,
    floors, ceilings, furniture, people, etc. In all these cases, the path loss is
    important to know, again, because of its impact on the received levels of both
    desired signals and interference.


    # 3.4 Path loss models for wireless channels


    # 3.4.1 General formulation


    For the most part, radio paths in wireless systems do not meet free-space conditions.
    There is often no unobstructed LOS path, and the non-LOS paths are numerous, due
    to multiple obstructions, reflections, and scattering that make up the received
    signal (see Fig. 3.1).


    Over the years, there have been extensive measurement campaigns leading to empirical
    models for wireless system path loss in different bands and environments. The
    range of the many reported studies spans outdoor mobile environments, including
    large cells (macrocells) and small cells (microcells); indoor environments with
    many walls and with large open spaces; and outdoor fixed wireless environments,
    all at frequencies ranging from ~300 MHz to ~6 GHz.


    ![](img/2d42983cf592ef4fc8a22646ddc49799_135_0.png)'
