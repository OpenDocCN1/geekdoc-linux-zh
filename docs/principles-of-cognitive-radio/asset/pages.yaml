    # 5.3.3 Reinforcement learning


    Machine learning methods may be broadly divided into three different classes:
    supervised learning, unsupervised learning, and reinforcement learning. In supervised
    learning the learning process involves a teacher that tells the agent the correct
    action in each state. At the opposite end of the categorization is unsupervised
    learning. Unsupervised learning is performed completely without any indication
    or feedback about how good or bad the actions selected by the agent are. Reinforcement
    learning operates between these two opposites. In reinforcement learning the agent
    learns through experiment and experience. After taking an action, the agent receives
    a scalar reward that measures the quality of the action and the resulting state
    transition. This feedback allows the agent to reinforce the taken actions that
    result in high rewards and thus make them more likely to be selected in similar
    situations in the future. Of the three classes, reinforcement learning methods
    are the most suitable for cognitive radio tasks, such as spectrum sensing and
    access. The correct action in each state is in general unknown or difficult to
    find out due to the dynamically changing environment. Hence, supervised algorithms
    are difficult to employ in practice. However, the natural rewards for reinforcement
    learning methods in these tasks are related to the throughput of the secondary
    users and collisions encountered with other users of the spectrum. This information
    may be easily obtained during the online operation of the secondary system. Hence,
    in the following we focus on reinforcement learning techniques.


    Reinforcement learning techniques may be employed to solve the bandit problems
    introduced in the previous subsection. Thus, reinforcement learning may be applied
    to sensing and access policy design in cognitive radio networks. However, reinforcement
    learning can be applied to more general problems as well that are not well described
    by the bandit problems. Nonetheless, in reinforcement learning problems we are
    faced with the same exploitation vs. exploration dilemma as in bandit problems.
    That is, at each stage the agent must decide whether to exploit the currently
    best action or to explore other actions in the hope of a better future reward.
    In the following we will briefly review single-agent and multiagent reinforcement
    learning and their application to spectrum sensing and access policy design in
    cognitive radio systems.


    # Single-agent reinforcement learning


    A Markov decision process (MDP) formulation of a single-agent reinforcement learning
    problem consists of'
