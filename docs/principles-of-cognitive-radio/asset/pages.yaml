  md: '# 5 Spectrum exploration and exploitation


    Jarmo Lundén, Visa Koivunen, and H. Vincent Poor


    # 5.1 Introduction


    # 5.1.1 Chapter motivation


    Chapter 4 introduced the basic spectrum sensing framework for detecting the presence
    of primary users in a cognitive radio system. In this chapter, we develop this
    framework further by taking a look at how a cognitive radio system or a cognitive
    radio network can optimize its spectrum sensing and access functions in order
    to explore and exploit the spectrum in the most efficient and effective manner.


    Chapters 1 and 2 described three cognitive radio network paradigms, i.e., the
    underlay, overlay, and interweave paradigms. In this chapter, we focus almost
    exclusively on the interweave paradigm in which the secondary users try to exploit
    the spatio-temporal spectral opportunities (i.e., spectrum holes) resulting from
    intermittent and uneven spatial and temporal use of the spectrum by the primary
    users. As described in Chapter 4, these spectrum holes are typically considered
    to be white spaces, i.e., completely empty of any signals, except for noise. In
    addition, we will consider a few approaches suitable also for the underlay paradigm.
    In particular, we will consider game-theoretic techniques and algorithms for spectrum
    access and sharing in cognitive radio networks that operate under interference
    temperature constraints, as described in Chapter 4. The remaining third paradigm,
    the overlay paradigm, is not explicitly considered in this chapter. In the overlay
    paradigm, not only do the secondary users have to be aware of the primary user''s
    transmissions, they must also possess the knowledge of the primary user''s codebook
    and the complete channel state information between the primary transmitter and
    the primary receiver as well as between the secondary transmitter and the primary
    receiver. This makes operating under the overlay paradigm particularly challenging.


    As noted above, cognitive radios operating under the interweave paradigm aim at
    identifying and exploiting underutilized spectrum. Idle spectrum is a local concept
    that, in addition to depending on time and frequency, depends on the relative
    locations of the primary and secondary receivers and transmitters as well as on
    the propagation conditions among them. The more information the cognitive radio
    system has about the current radio environment and the other spectrum users, the
    more effectively and efficiently it can exploit the spectrum and the less interference
    it causes to the other users. Such information is called situational awareness.
    Situational awareness at the physical radio communication level refers, for example,
    to knowing the current and past locations'
  merge: -1
  img_proc: true
- pgno: 212
  md: 'and actions of the other users of the spectrum as well as possibly the future
    locations and actions of these users. Moreover, situational awareness refers to
    knowing the local physical and radio environments and propagation conditions.
    Knowledge of primary and secondary waveforms is also beneficial. Knowledge of
    waveforms (modulation, coding, power levels, access schemes, synchronization,
    etc.) facilitates distinguishing between primary and secondary users, characterizing
    the interference in a given location, as well as identifying areas where harmful
    interference occurs, among other things. In essence, situational awareness includes
    any information that allows making more intelligent decisions on which actions
    to choose as well as predicting what the effects of these actions will be. Situational
    awareness allows the cognitive user to choose the optimum transmission parameters,
    such as frequency band, power, modulation, coding, beampatterns, etc., that maximize
    its own throughput and minimize the interference to the other users of the spectrum.
    Consequently, situational awareness is the cornerstone for building more intelligent
    and efficient systems that ultimately lead to more efficient and effective spectrum
    exploitation and to less interference for all spectrum users. In this chapter,
    we will review various techniques that aim at acquiring and exploiting situational
    awareness in a cognitive radio system; i.e., techniques that aim at estimating,
    learning, or building a (dynamic) model for primary user occupancy and for the
    behavior of the other users of the spectrum.


    The most important form of situational awareness for cognitive radio systems is
    the state of the radio frequency spectrum. In interweave cognitive radio systems,
    spectrum sensing is a key component in spectrum exploration where awareness of
    the state of the spectrum is acquired and the statistical behavior of the primary
    user traffic as a function of time, location, and frequency is learned. Sensing
    policies or strategies are used to allocate the sensing and learning tasks among
    the sensors and over the subbands of interest, taking into account energy consumption
    constraints. The more effectively the spectrum can be explored through spectrum
    sensing, the more effectively available spectral opportunities are found and the
    more effectively they can be exploited, thus resulting in a more efficient use
    of the scarce spectral resources. Hence, exploitation of underutilized spectrum
    is tightly coupled with sensing and exploration. Spectrum exploitation takes advantage
    of the obtained knowledge on the dynamic behavior of spectral opportunities in
    accessing the spectrum. It determines whether and how to access and who gets access
    to a particular part of the spectrum based on the exploration outcomes. The coupling
    between these tasks can be seen by considering the sensing errors and their implications
    for medium access. The probabilities of false alarm and missed detection in spectrum
    sensing have an impact on throughput and collision probabilities in accessing
    the cognitive network. False alarms refer to situations in which the spectrum
    is considered to be occupied when it is not. Consequently, the secondary network
    data rate is reduced by false alarms and the exploitation of idle spectrum becomes
    less efficient. Missed detection, on the other hand, means that the spectrum is
    considered to be idle even when the primary user is in fact active. Hence, collisions
    may take place and the quality of service for the primary user may be reduced,
    interference constraints may be violated, and retransmissions are required. Moreover,
    due to interference constraints and possible changes in primary user activity,
    the longer it takes to sense and explore the'
  merge: -1
  img_proc: true
- pgno: 213
  md: 'spectrum, the shorter is the time the idle spectrum can be exploited until
    it needs to be sensed again. From this perspective, it is obvious that optimizing
    sensing policies and medium access should be performed jointly, using an objective
    function related to the throughput of the cognitive network. An example optimization
    approach would involve maximization of the sum throughput of the cognitive radio
    network under constraints on interference caused to the primary users as well
    as fairness and energy consumption constraints for secondary users.


    At the core of multiuser cognitive radio systems is the interaction among the
    secondary users. The secondary users may have different capabilities, interests,
    and goals, which complicates the design of spectrum sensing and access policies.
    In general, the secondary users in a cognitive radio network are competing with
    each other for the available spectral opportunities. On the other hand, cooperation
    among the secondary users opens up avenues for making the sensing more reliable
    and improving the network performance and spectrum exploitation. For example,
    cooperation among spatially dispersed secondary users allows shortening the sensing
    time through distributed detection. Problems caused by fading and shadowing as
    well as hidden node problems can be avoided through the spatial diversity gains
    in distributed detection. In addition, cooperation allows distributing the sensing
    and network management tasks among the network members as well as minimizing the
    mutual interference. However, in general, cooperation also increases the transmission
    overhead through increased control messaging.


    Cognitive radio system models may be classified using various criteria. We can
    have single-user and multiuser models depending on whether the other secondary
    users are explicitly taken into account in the model. Moreover, the spectrum model
    may be either a single-band or a multiband model. Multiuser models can be further
    divided into infrastructure (base station)-based and ad hoc models. The network
    may operate and perform tasks, such as spectrum sensing, in a centralized or a
    decentralized manner. Moreover, the interaction between the network users may
    be cooperative, competitive, or a combination of these two (mixed models). This
    is further affected by the level of synchronization among the network users. That
    is, the sensing and exploitation tasks may be performed synchronously or asynchronously
    by different users depending on the system model. A typical synchronized system
    may employ a periodic slot structure with alternating transmission periods and
    quiet periods for sensing, whereas in an asynchronous system there is more freedom
    in sensing and access tasks and their relative positioning in the time domain.
    In this chapter, our main focus is in the optimization of spectrum exploration
    and exploitation in multiuser, multiband models in which the users are in general
    both competing and cooperating with each other. We will consider both infrastructure-based
    and ad hoc models. Moreover, we will review literature related to other models
    as well, such as single-user single-band and multiband models, since it provides
    insight into how to design the algorithms in the more complicated models.


    # 5.1.2 Preview of the chapter


    This chapter consists of two major sections. In the first part, in Section 5.2,
    we will take a look at advanced spectrum sensing techniques including distributed
    detection as'
  merge: -1
  img_proc: true
- pgno: 214
  md: 'well as sequential and quickest detection. These techniques are needed in exploring
    the spectrum and identifying available spectral opportunities. Moreover, they
    are important for optimizing the spectrum sensing process so that it provides
    both more reliable sensing results and shorter average sensing time. In the second
    part of the chapter, we will turn our attention to the design of sensing and access
    policies for optimized spectrum exploration and exploitation. In Section 5.3,
    we will introduce dynamic programming, bandit problems, reinforcement learning,
    and game theory, and discuss their application to sensing and access policy design
    in cognitive radio systems. In addition, we will look at some other interesting
    approaches for optimizing the sensing and transmission parameters in a cognitive
    radio system and briefly discuss location awareness and its importance to cognitive
    radio systems. Finally, the chapter is concluded with a brief summary in Section
    5.4 and a discussion of some resources for further reading in Section 5.5.


    # 5.2 Advanced spectrum sensing techniques


    # 5.2.1 Distributed detection in spectrum sensing


    Distributed detection involving multiple geographically displaced sensors and
    a fusion center has been a topic of great interest in the sensor network and radar
    research communities [166, 206]. Distributed sensor systems were originally motivated
    by their applications in military surveillance and intelligence systems. Recently,
    they have attracted considerable attention for their application to cooperative
    spectrum sensing in cognitive radio systems, see e.g., [36, 86, 103, 123, 238].
    Distributed spectrum sensing is a very attractive technology for identifying underutilized
    spectrum and creating awareness of the state of the radio environment since available
    spectrum is a local resource that varies as a function of time, location, and
    frequency. Understanding the state of the spectrum is crucial for interference
    management, too. In this section, we focus on distributed, cooperative sensing
    for identifying idle spectrum.


    # *Spatial diversity in spectrum sensing*


    Cooperative spectrum sensing has several advantages. It provides diversity gains
    in the face of multipath channel effects and demanding propagation environments
    such as fading, shadowing, and the hidden node problem. Propagation modeling and
    effects in the cognitive radio context were considered in detail in Chapter 3.
    Wireless signals are exposed to slow fading caused by large objects in the signal
    path and to fast fading caused by motion and multipath propagation of the signal.
    This makes it harder to detect the signals as the signal attenuation caused by
    channel fading may be of the order of tens of dB.


    The gains obtained by cooperative sensing follow from spatial diversity that is
    similar to that exploited in multiantenna (MIMO) wireless communications to improve
    the rate or reliability of a radio link [21]. It is very unlikely that all the
    sensing channels between the primary transmitter and spectrum sensing nodes would
    be in deep fades simultaneously. In fact, if the sensor displacement is sufficient,
    i.e., sensors are further'
  merge: -1
  img_proc: true
