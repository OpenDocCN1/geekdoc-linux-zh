  md: 'channels employed. However, in general, the primary transmitter geolocations
    may not be available in advance. Moreover, if the user is indoors or no GPS or
    other satellite positioning system is available the user may have difficulty in
    determining its own geolocation. Finding out an unknown location of a wireless
    transmitter is a challenging problem requiring advanced signal processing algorithms.
    Moreover, reliable and accurate localization requires distributed cooperative
    techniques. Various proposed approaches include received signal strength- (RSS)
    [85], time-of-arrival- (TOA) [33, 34, 58, 80, 87], direction-of-arrival- (DOA)
    [80], and sensing result-based [128] techniques.


    The above techniques can also be applied to determine the locations of the other
    secondary users. However, such information may be obtained through other means
    as well, such as information exchange or mutual ranging [66], provided that the
    secondary users in the cognitive radio network cooperate with each other.


    Finally, we would like to point out that the interference in a wireless communication
    system is experienced at the receiver and not at the transmitter, hence, knowing
    the location of the primary receivers is much more beneficial than knowing the
    location of the primary transmitters. However, this is notoriously difficult if
    the receivers are passive, as, for example, TV receivers are. In principle, even
    passive receivers may be detected by exploiting the local oscillator leakage power
    emitted by the RF front-end of a wireless receiver when a signal is received [29,
    221]. However, the typical leakage power is very low, limiting the detection range
    to only a few meters at best. Thus, in applications involving passive receivers,
    one may have to be content with knowing only the locations of the primary transmitters.


    # 5.4 Summary


    In this chapter, the optimization of the spectrum exploration and exploitation
    processes in cognitive radio networks has been considered. Spectrum exploration
    is the process of obtaining local awareness of the spectrum state through spectrum
    sensing. The goal of spectrum exploration is to find idle spectrum that can then
    be exploited. Optimization of spectrum exploration includes optimization of the
    whole spectrum sensing process that determines which frequency bands are sensed,
    when they are sensed and for how long and by which users, and how are the sensing
    results from multiple users combined. This involves trading off quantities such
    as diversity, detection speed, and performance. Spectrum exploration is coupled
    with spectrum exploitation. Spectrum exploitation addresses the questions: what
    happens after idle spectrum has been found; and how is the idle spectrum subsequently
    exploited? Spectrum exploitation optimization involves optimizing the spectrum
    access process that determines which idle frequency bands to access, for how long,
    and by which users. It involves choosing the transmit powers and waveforms to
    be employed, as well. The goal of spectrum exploitation combined with spectrum
    exploration is to maximize the throughput of the secondary network and provide
    a desired quality of service for the secondary network while guaranteeing that
    the level of interference caused to the primary users is below the given interference
    constraints. In the first part of the chapter, advanced spectrum sensing techniques,
    such'
