    There are several variants of the classical multiarmed bandit problem.


    +   - *Multiarmed bandit problems with dependent arms* are multiarmed bandit problems
    in which the different arms are not independent [153].

    +   - *Arm-acquiring multiarmed bandit problems* are variants of the classical
    multiarmed bandit problem in which the number of arms may increase as time advances
    [219].

    +   - *Multiarmed bandit problems with switching penalties* are multiarmed bandit
    problems in which switching from one arm to another incurs a switching cost and/or
    a switching delay [1, 9, 14, 77].

    +   - *Multiarmed bandit problems with multiple plays* are a form of multiarmed
    bandit problem in which the agent may at each time instant choose M ≤ L arms to
    play [2, 7, 8, 152].

    +   - *Restless multiarmed bandit problems* are a generalization of the multiarmed
    bandit problem with multiple plays in which the state of all the arms changes
    at each time according to a stochastic process even if the arms are not played
    [220].

    +   - *Multiarmed bandit problems with side observations* are a form of multiarmed
    bandit problem in which in addition to the reward sequence there is a sequence
    of side observations that are correlated with the rewards [100, 210, 211]. These
    problems are also called contextual bandit problems.

    +   - *Multiarmed bandit problems with availability constraints* are a variation
    of the classical multiarmed bandit problem in which the arms are not always available
    [48, 225].


    General treatments of multiarmed bandit problems discussing many of the above
    variants and their properties can be found in [17, 130].


    From the cognitive radio point-of-view, the most important multiarmed bandit problem
    is the restless multiarmed bandit problem. The restless multiarmed bandit problem
    fits well the spectrum sensing and exploitation problems in dynamic environments
    in which the arms correspond to different frequency bands and primary user activity
    in each frequency band (and thus the arm state) may change even if the corresponding
    frequency band is not sensed or accessed. Thus, the restless multiarmed bandit
