  md: 'type of application in many countries. However, the high carrier frequency
    implies relatively large path loss, so that alternative approaches, including
    cognitive radio at lower frequencies, need to be investigated. The characteristics
    of V2V channels¹⁰ differ from those of mobile cellular channels because of specific
    features of V2V radio propagation.


    1 In V2V systems, the TX and RX antennas are at the same height, and in similar
    environments (peer-to-peer communications). In cellular communications, on the
    other hand, communication is between a base station that is high above street
    level, with a mobile station at street level. As a consequence, the dominant propagation
    mechanisms of the multipath components are different. For example, in cellular
    communications, propagation of waves over rooftops is important, while in V2V
    systems, propagation in the horizontal plane, with reflection and diffraction
    (e.g., at street corners), is more important. Also, for a V2V channel, scattering
    can occur near both link ends, while for cellular channels, the area around the
    base station is usually free of scatterers.


    2 In a V2V channel, both TX and RX, as well as many of the important scatterers,
    are moving, whereas in cellular channels, only one (the terminal) is moving, and
    moving scatterers have less relative importance. This implies that the channel
    fluctuations in V2V channels are faster and that commonly used relationships between
    angular and Doppler spectra, as discussed in Section 3.7, are not valid anymore.
    Furthermore, fading distributions that show more frequent deep fades than Rayleigh
    fading can occur [71].


    A number of measurements have found path loss coefficients γ < 2 if there is a
    LOS between TX and RX (see [58] and references therein). Related to this, rather
    high Rice factors have been found. Delay spreads typically show moderate values
    (on the order of a few hundred ns). A major difference between V2V and cellular
    communications is the short time during which the stationarity assumption is valid,
    i.e., the assumption that the absolute amplitudes and delays of the MPCs stay
    constant. More detailed discussions and extensive references to the literature
    can be found in [72, 83, 109].


    # 3.11.2 Wireless sensor networks (WSNs)


    Another important application is the communication between sensors that are located
    in homes (e.g., for improvement of energy efficiency), on the ground (for environmental
    monitoring), on streets (for traffic monitoring) and in all locations containing
    CRs (for measurement of the radio environment). Again, in this case propagation
    is often from peer to peer (with the exception of backhaul nodes). This leads
    to path loss behavior that is significantly different from traditional cellular
