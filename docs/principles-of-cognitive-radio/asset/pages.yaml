    problem is typically modeled as a binary hypothesis testing problem. Obviously
    one can use a variety of detection strategies. For example, if there is prior
    statistical knowledge about the primary user activity and persistence of the free
    spectrum, such information can be used in Bayesian detector design to improve
    performance. Such information is'
