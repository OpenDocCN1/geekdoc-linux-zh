    The above formulation assumes a single destination for each data sequence. This
    definition can be extended to include multicasting to a set of destinations, broadcasting
    from one source to a set of destinations or multiple access from multiple sources
    to a single destination. The capacity region of a general wireless network is
    unknown. A general outer bound on the network performance is provided by the cut-set
    bound [2, 18, 23, 78], stated next.


    Let $\mathcal{S}$ denote a subset of all network nodes and $\mathcal{S}^c$ be
    the complement of $\mathcal{S}$. The pair $(\mathcal{S}, \mathcal{S}^c)$ is a
    *cut* separating source $s_k$ and destination $d_k$ if source $s_k \in \mathcal{S}$
    and $d_k \in \mathcal{S}^c$.


    # Cut-set outer bound


    Any achievable $(R_1,\dots,R_K)$ satisfies


    ```

    $$\sum_{s_k \in \mathcal{S}, d_k \in \mathcal{S}^c} R_k \leq I(X(\mathcal{S});
    Y(\mathcal{S}^c) | X(\mathcal{S}^c)),$$ (2.21)

    ```


    where mutual information is evaluated for some distribution $p(x_1,\dots,x_K)$
    for any $\mathcal{S}$. $R_k$ is the rate across the cut from source $s_k$ to destination
    $d_k$. We observe that (2.21) bounds the sum rate going across a cut by the conditional
    mutual information between all sources in $\mathcal{S}$ and all destinations in
    $\mathcal{S}^c$, given all sources in $\mathcal{S}^c$.


    As an example of the cut-set outer bound, consider $K$ source–destination pairs
    with AWGN links of bandwidth $W$. The channel inputs and outputs are then vectors
    defined by


    ```

    $$\mathbf{Y} = \mathbf{H}\mathbf{X} + \mathbf{Z},$$ (2.22)

