    # 5.3 Optimized spectrum exploration and exploitation: sensing and access policy
    design


    Sensing and access policies provide answers to the questions: what should the
    radios sense and access, and when? Moreover, in centrally controlled multiuser
    systems spectrum sensing and access policies allocate and divide the sensing,
    learning, and interference management tasks among the network nodes and different
    spectrum areas. That is,'
  merge: -1
