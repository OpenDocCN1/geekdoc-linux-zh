    amplitude pdf in this case is


    $$p_r(r)=\frac{2}{\Gamma(m)}\left(\frac{m}{\bar{P}_r}\right)^m r^{2m-1}\exp\left(-\frac{m}{\bar{P}_r}r^2\right);\quad
    0\le r<\infty\tag{3.22}$$


    for m ≥ 1/2, where Γ(m) is Euler’s Gamma function [1], the parameter \bar{P}_r
    is the mean square value \bar{P}_r = \langle r^2 \rangle, and the parameter m
    is


    $$m=\frac{\bar{P}_r^2}{\langle(r^2-\bar{P}_r)^2\rangle}\tag{3.23}$$


