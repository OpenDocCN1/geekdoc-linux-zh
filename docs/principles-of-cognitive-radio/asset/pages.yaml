    +   - an agent i;

    +   - a set of possible states of the environment s ∈ S;

    +   - a set of possible actions for the agent in each state a ∈ A;

    +   - a state transition function φ : S × A × S → [0, 1] which defines the transition
    probability P [s_{n+1} | s_n, a_n];

    +   - a reward function r : S × A × S → ℝ which gives the agent a reward for taking
    action a_n in state s_n resulting in new state s_{n+1}.


    In every state s_n the agent chooses an action a_n according to some policy π.
    A policy π is a stochastic or deterministic function that determines how the agent
    selects its action a_n in each state s_n. Taking the action a_n in state s_n results
    in a new state s_{n+1} and a scalar reward r_{n+1} for the agent. The goal of
    the agent is to try to act in a way that maximizes not just the immediate reward
    but also the future rewards. A commonly employed goal in reinforcement learning
    is to optimize the expected sum of discounted rewards


    \mathcal{R}_n = \mathbb{E}\left[ \sum_{k=0}^{\infty} \xi^k r_{n+k+1} \right],
    \tag{5.77}


    where r_n is the reward at time n and ξ, 0 ≤ ξ < 1, is the discount rate. This
    model may not be the most appropriate model in all applications. In particular,
    in episodic tasks, for which the episode length is known beforehand, models with
    finite horizon are typically more appropriate. However, the infinite-horizon discounted
    model is mathematically more tractable than most other models. Other options for
    defining the goal in reinforcement learning include the ones already introduced
    for the bandit problems in Section 5.3.2.


    A convenient way of optimizing the sum of expected discounted future rewards is
    to learn an optimal action-value function. The action-value function Q(s, a) evaluates
    the value of each action in a given state. The action-value function is defined
    as the expected return (i.e., the sum of discounted rewards) of taking an action
    a in state s and then following policy π:


    Q^π(s, a) = \mathbb{E}_π\left[ \mathcal{R}_n \mid s_n = s, a_n = a, π \right].
    \tag{5.78}


    The optimal action-value function Q* satisfies the Bellman optimality equation
    [183, p. 76]


    Q*(s, a) = max_π Q^π(s, a)

    = \sum_{s''∈S} P[s'' | s, a] \left[ r(s, a, s'') + ξ max_{a''} Q*(s'', a'') \right].
    \tag{5.79}


    where r(s, a, s'') is the reward function.


    In the following two commonly employed powerful model-free temporal-difference
    reinforcement learning algorithms, Sarsa [169] and Q-learning [215, 216], for
    optimizing the action-value functions are introduced. Sarsa is an on-policy temporal-difference
    algorithm. An on-policy algorithm means that the action-value updates are based
    on the'
