- pgno: 115
  md: 'Communication schemes deployed in the overlay channel contain the following
    three encoding strategies.


    +   1 **Rate-splitting** Rate-splitting, as briefly described in Section 2.4,
    can improve rates for both communicating pairs by enabling (partial) interference
    cancellation at the decoders in the same fashion as in interference channels without
    cognition. This technique can potentially be deployed by both encoders, as it
    requires no cognition about other user’s data sequences as the encoder is only
    splitting its own rate. For the rate-splitting to be exploited by the primary
    user, this approach requires that the decoding at the primary receiver be modified
    to decode and cancel part of the secondary user’s transmission. This approach
    differs from the approach used in interweave and underlay cognitive radio where
    the communication technique of the primary users is not adapted in the presence
    of secondary users. If this constraint were to be imposed in overlay cognitive
    networks as well, the rate-splitting would be no longer applicable since it requires
    that the primary receiver decodes a part of the message of the secondary user.


    +   2 **Cooperation** Full, partial, or delayed knowledge of the primary user’s
    data sequence allows the cognitive encoder to relay this information to the primary
    user, thereby increasing the rate of the primary pair. The cognitive encoder uses
    a fraction of its power to transmit message $W_p$ to the primary user and thus
    increases the primary rate $R_p$. When the primary user’s data sequence (or a
    part of it) is known to the cognitive encoder without the delay, i.e., at the
    beginning of the transmission block, relaying is performed via superposition coding,
    where secondary and primary messages are superimposed and sent by the cognitive
    encoder. Due to the noncausal knowledge, there is no need for Markov block encoding
    otherwise used for relaying [17].


    +   3 **Gelfand–Pinsker encoding (binning)** Any signal carrying all or part of
    $W_p$ is interference at the secondary receiver. Hence, both the primary encoder
    and the cognitive encoder cause interference at the secondary receiver. However,
    if the cognitive encoder knows $W_p$ at the beginning of the transmission block
    (as well as the codecs and channel state information), it can infer the interference
    created at the secondary receiver. Knowing the interference, it can apply Gelfand–Pinsker
    encoding and, specifically in AWGN channels, DPC in order to precancel this interference.
    Another motivation for deploying Gelfand–Pinsker encoding is found in the relationship
    between the overlay channel and the broadcast channel whereby when the primary
    transmitter is silent, the overlay channel reduces to a two-user broadcast channel.
    For the discrete-time memoryless broadcast channel, the encoding scheme that yields
    the largest known achievable rate region is based on Gelfand–Pinsker encoding
    [61]. In the Gaussian case the two-user overlay channel is related also to the
    MIMO Gaussian broadcast channel. Specifically, a MIMO broadcast channel with two
    transmit antennas is equivalent to a two-user overlay channel when *both* encoders
    are cognitive, i.e., two encoders know the message intended for each receiver,
    since in fact these encoders are part of the same broadcasting transmission strategy.
    For MIMO Gaussian broadcast channels, DPC is the optimal encoding strategy [91,
    94]. Motivated by these observations, binning and DPC have been applied to the
    two-user'
