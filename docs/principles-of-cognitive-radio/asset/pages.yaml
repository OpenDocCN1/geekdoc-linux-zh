  img_proc: true
- pgno: 136
  md: 'There is a generic formula for approximating the power gain, $G$, that stands
    up well for most measured bands and wireless environments. It is


    $$G = \frac{\langle P_r \rangle}{P_t} \sim a \left(\frac{d}{d_0}\right)^{-\gamma},
    \tag{3.6}$$


    where $P_t$ and $\langle P_r \rangle$ are the transmit and average received power,
    respectively, in consistent units, with the average of $P_r$ being taken over
    the signal bandwidth and local area; $d_0$ is a reference distance, in the same
    units as $d$; and $a$ and $\gamma$ are dimensionless model parameters. Typical
    values for $d_0$ are 1 m in indoor environments and 100 m or 1 km in outdoor environments.
    It is easy to see that the power gain in free-space propagation, given by the
    squared quantity in (3.4), is a special case of (3.6), where $a = \left(\frac{4\pi
    d_0}{\lambda}\right)^2$ and $\gamma = 2$. In most wireless environments, the path
    loss exponent, $\gamma$, is greater than 2 because, if there are obstructions
    along the path, power falls off more quickly with distance than predicted by spreading
    loss alone. However, in some indoor scenarios such as transmission down hallways,
    $\gamma$ can be less than 2 because of waveguide effects [62].


    The above formula cannot be precise because, given the vagaries of man-made structures
    and terrain from one TX-RX path to another, no one function of distance $d$ can
    represent $G$ everywhere in a given environment. It is customary, therefore, to
    regard the bracketed quantity as the median power gain, $G_{med}$, for a given
    distance, $d$; and to express $G$ as the product of $G_{med}(d)$ times a variable
    factor $\zeta$ that is different for every TX-RX path and has a median value over
    the environment of 1. Thus,


    $$G = \left[ a \left(\frac{d}{d_0}\right)^{-\gamma} \right] \zeta = G_{med}(d)\zeta.
    \tag{3.7}$$


    Since $PL = -10\log(G)$, we can write the generic path loss formula as


    $$PL(d) = \left[ A + 10\gamma \log\left(\frac{d}{d_0}\right) \right] + S, \tag{3.8}$$


    where $A$ and $S$ are the negative dB values of $a$ and $\zeta$, respectively.
    The bracketed term is the median path loss, $PL_{med}(d)$, over all TX-RX paths
    with distance $d$; and $S$ represents a random-like variation about the median,
    different for every TX-RX path. It has been observed empirically that the linear
    variation of median path loss with log-distance, as implied by (3.8), is remarkably
    consistent over all bands and most environments; and that the variable quantity
    $S$ can be accurately modeled in most cases as a Gaussian random variable with
    zero mean and a standard deviation, $\sigma$, whose value depends on the type
    of environment. Thus,


    $$S \sim \mathcal{N}(0,\sigma^2) \tag{3.9}$$


    and wireless systems can be analyzed with $PL$ having the form (3.8) and (3.9),
    with empirically derived values (or formulas) for the model parameters $A$, $\gamma$,
    and $\sigma$.


    This mathematical description is illustrated in Fig. 3.2 for cellular measurements
    in the 2.6 GHz band for a number of suburban macrocellular environments. The circles
    in the upper figure represent a scatter plot of $PL$ vs. $d$ over about 1500 paths,
    and the straight line is a least-squares fit over all paths. The distances of
    the data points'
