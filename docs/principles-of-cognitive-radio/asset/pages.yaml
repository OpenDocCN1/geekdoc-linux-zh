    # 4.3.2 Coherent detection


    To improve the performance of the spectrum sensor, one may consider exploiting
    any prior knowledge about the features of the primary signal. These may consist
    of modulation type and order, pulse shape, data rate, or statistical properties.
    Along this line, we examine first the limiting situation in which the primary
    signal $x(t)$ is fully known. This assumes that the primary user signal can be
    demodulated coherently, which requires timing and carrier synchronization (this
    task may be facilitated by the presence, in the primary signal, of pilots, preambles,
    etc.).


    If there is no interference, and the noise is Gaussian and stationary, the optimal
    detector, i.e., the one which maximizes the received signal-to-noise ratio, consists
    of a filter matched to $x(t)$ followed by a threshold test (if there is fading,
    and the fading coefficient $h$ is known at the receiver, then the filter should
    be matched to $h x(t)$).


    The maximum-likelihood statistic of the signal $y_n = x_n + w_n$, $n = 0,\dots,N-1$,
    obtained after sampling, is


    $Y = \frac{1}{N}\sum_{n=0}^{N-1} y_n x_n^*, \tag{4.30}$


    (where $x^*$ denotes the conjugate of $x$), so that the signal-to-noise ratio
    of the matched-filter output is $\gamma = P / \sigma_w^2$, where


    $\mathcal{P} \triangleq \frac{1}{N}\sum_{n=0}^{N-1} |x_n|^2 \tag{4.31}$


    is the average signal power under the assumption that the primary signal is stationary
    and the sensing time $N$ is long enough. The false-alarm and missed-detection
    probabilities are'
