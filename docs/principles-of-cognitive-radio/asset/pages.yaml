  md: '# *Generalized likelihood-ratio test*


    If some of the parameters of the transmission model are unknown (for example,
    the fading attenuation $h$ in (4.3)), then a useful (albeit suboptimal) approach
    to detection consists of using (4.14) where $\Lambda$ is replaced by the *generalized
    log-likelihood ratio*


    $$\Lambda_G \triangleq \log \frac{\sup_{\boldsymbol{\theta}} p(y \mid \mathcal{H}_1,
    \boldsymbol{\theta})}{\sup_{\boldsymbol{\theta}} p(y \mid \mathcal{H}_0, \boldsymbol{\theta})}\tag{4.15}$$


    and $\boldsymbol{\theta}$ denotes the unknown parameters. Consequently, the generalized
    likelihood-ratio test is


    $$\Lambda_G \underset{\mathcal{H}_0}{\overset{\mathcal{H}_1}{\gtrless}} \psi_G.\tag{4.16}$$


    # 4.3.1 Energy sensing


    This is the simplest form of spectrum sensing, due to its conceptual simplicity
    and reduced implementation complexity. The presence of a spectrum hole is detected
    by comparing the measured energy against a suitable threshold, which is highly
    susceptible to the noise floor, to the presence of in-band interferences, and
    to channel notches caused by frequency-selective fading.


    The decision metric, denoted $Y$, is built from a sequence of $N$ received-signal
    samples:


    $$Y = \frac{1}{N} \sum_{n=0}^{N-1} |y_n|^2\tag{4.17}$$


    and is obtained from the formal definition of signal energy,


    $$Y = \int |y(t)|^2 dt$$'
