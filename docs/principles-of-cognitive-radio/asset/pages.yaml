  md: 'data received while experiencing interference from secondary users as an erasure,
    but since the secondary user is typically at a much lower power than the primary
    user, this is rarely done in practice; instead the interference caused by secondary
    user transmissions is typically treated as noise. Since detection of spectrum
    holes is a dynamic and imperfect process, the capacity of both primary and secondary
    users under false alarm or missed detection is based on that of a randomly-varying
    channel, as discussed in the next subsection.


    A model for the impact of false alarm and missed detection on the capacity of
    an interweave channel using cooperative detection between the secondary transmitter
    and receiver is developed in [45]. The distributed nature of this spectrum sensing
    is captured mathematically via a two-switch model, one switch at the secondary
    transmitter and one at the secondary receiver. When the secondary transmitter
    detects a spectrum hole then it moves its switch to the ON position, and similarly
    at the receiver. When both switches are ON, a hole is deemed to be present for
    utilization by the secondary user, and this information is disseminated to the
    secondary transmitter and receiver (perhaps via a separate cooperation channel).
    This model captures the fact that the farther apart the secondary transmitter
    and receiver, the less correlated the primary user activity will be that they
    each detect. Since the location of the primary receiver is unknown, detection
    of primary signals at more than one location via cooperative sensing will lead
    to more accurate estimation of spectrum holes, as discussed in more detail in
    Section 5.2.1. More general models for false alarm and missed detection can be
    mapped to this two-switch model via the switch probabilities of being ON or OFF.
    Inner and outer bounds on capacity of this two-switch model are developed in [45]
    based on information-theoretic results for the capacity of memoryless channels
    with causal and noncausal partial channel knowledge.


    # 2.6.2 Random switch model for secondary channels


    In the interweave paradigm, each secondary user''s channel varies with time due
    to primary user activity and imperfect detection. Imperfect detection by the secondary
    system “breaks” the interweave paradigm as it introduces simultaneous primary
    and secondary transmissions during the times when the primary user transmissions
    are missed. Moreover, false detection of primary user activity reduces the capacity
    of the secondary system as transmission opportunities are missed. Specifically,
    the secondary user has an interference-free channel when a spectrum hole is correctly
    detected, a channel with interference when a spectrum hole is incorrectly detected,
    and a zero-capacity channel when primary user activity is (correctly or incorrectly)
    sensed. In this section we capture these time-varying channel characteristics
    caused by primary user activity and its imperfect detection through a random switch
    model. Note that in this model the underlying channels of both the primary and
    secondary users are assumed static, although the random switch model can be extended
    to incorporate fading.


