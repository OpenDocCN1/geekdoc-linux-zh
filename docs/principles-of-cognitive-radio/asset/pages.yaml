    # 3.9.3 Joint dispersions


    In this and previous sections, we have introduced the notions of delay spread,
    angular spread, and shadow fading, each of which exhibits a particular numerical
    value at a given location and a (spatically slow) variation of this value over
    the terrain. Although we have discussed these three entities separately, there
    are some important connections among them, e.g., shadowing and delay spread are
    both influenced by obstructions between a cellular base station and a given terminal
    location [44].


    The shadowing (S in (3.7)), delay spread (DS), and angular spread (AS) each have
    a pdf that can be well approximated as lognormal, so that their log-values can
    be described by Gaussian pdfs. Furthermore, measurements have shown that these
    Gaussian variates are correlated. The correlation between the log-angular spread
    and log-delay spread has been found to be approximately 0.5 [3], while that between
    log-angular spread and log-shadowing is around 0.75 [5], and similarly for the
    correlation between log-delay spread and log-shadowing. A correlation between
    delay spread and angular spread has also been observed for indoor peer-to-peer
    environments [24].'
