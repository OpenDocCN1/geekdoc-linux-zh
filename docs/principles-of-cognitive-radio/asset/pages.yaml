    # 3.8.7 Ultra-wideband (UWB) channels


    The underlay paradigm of cognitive radio requires that secondary user transmissions
    be so low that their power spectrum densities at primary receivers are below that
    of additive receiver noise, i.e., that they raise the noise floor seen by primary
    receivers only slightly. This approach can be effective if the secondary signals
    are spread over a very wide range of frequencies and then despread at the receiver
    as in the use of UWB signaling and detection, e.g., [114]. By formal definition,
    UWB signals have bandwidths of 500 MHz or more. Military applications tend to
    use baseband signaling, while most commercial applications reside in the frequency
    range from 3 to 10 GHz.


    The bandwidths associated with UWB are so wide that some conditions we have assumed
    previously do not apply, notably, the presence of many MPCs in any delay interval
    of width 1/W. With W in the ultra-wide regime, MPCs appear sparsely within a delay
    bin-width 1/W, and models of the impulse response and PDP must reflect this. An
    obvious and important consequence is that the tap gains of the TDL can no longer
    be regarded as Rayleigh-fading processes.


    A flurry of measurement and modeling activity for these channels occurred in the
    first decade of this century, primarily focused on indoor environments, both residential
    and commercial. Any applications of UWB for cognitive radio in outdoor environments
    would use similar models, though likely with different parameter values. Accordingly,
    we briefly describe here three published channel models for the PDP of indoor
    UWB channels, to highlight some similarities and differences relative to traditional
    wideband models.


    The exponential model, reported in [12], represents P(τ) as containing a term
    at τ = 0 (fixed in local space but variable from one path to another); and a single
    cluster'
