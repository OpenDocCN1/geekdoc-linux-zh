  md: 'The DD... is a very general description of the channel.⁹ From it, we can derive
    the "normal" time-variant impulse response by weighting the DD... with the antenna
    pattern, and then integrating over all direction angles


    $$h(t,\tau)=\iint h(t,\tau,\Omega,\Psi)g_{T}(\Omega)g_{R}(\Psi)d\Omega d\Psi.\tag{3.49}$$


    The angular power spectrum (APS) is a characterization of how much power, on average,
    arrives from (or departs towards) a certain angle. For example, when considering
    the APS at the RX,


    $$APS(\Psi)=\mathbb{E}\{|h(t,\tau,\Omega,\Psi)|^{2}\},\tag{3.50}$$


    where the expectation is over t, τ, and Ω. A similar formulation applies to the
    APS at the TX, APS(Ω). One could also define a spectrum APS(Ψ,τ) as the expectation
    in (3.50) over just t and Ω. This function reflects the physical reality that
    the angular power spectrum can be different for different delays. In practice,
    however, it is often more convenient to include the averaging over τ; this is
    especially appropriate for narrowband channels, where the MPCs overlap.


    A major simplification of APS(Ψ) is made possible by noting that most MPC arrival
    directions at an RX lie in or close to the horizontal plane containing the antenna.
    Thus, there is no spread with respect to elevation angle, θ. In this case, APS(Ψ)
    can be reduced to a power spectrum over azimuth angle, φ, at the receiver. Referring
    to Section 3.7, this can be seen as equivalent to S_φ(φ) in (3.31) or a continuous
    version thereof. For convenience, and with this equivalence in mind, we will use
    the notation APS(φ) in the present discussion.


    Finally, a compact characterization of the angular dispersion is given by the
    rms angular spread, henceforth simply called "angular spread," AS [33]. We will
    focus on the angular spread at the RX. This quantity is the second central moment
    of the APS normalized to have an area of 1 over (−π,+π). We have seen that, because
    of angular dispersion, there is space-selective fading of received amplitudes
    about the RX location. The correlation distance associated with this fading has
    an inverse relationship to the AS.


    # 3.9.2 Models for the APS shape and angular spread


    We start with the case of an elevated TX or RX, e.g., as on a base station, mostly
    above the clutter. Here, the most common model for the APS is a small angular
    spread around the nominal line-of-sight direction, usually with a Laplacian shape
    [89],


    $$APS(\phi)=\exp\left[-\sqrt{2}\frac{|\phi-\phi_{0}|}{\phi_{\mathrm{rms}}}\right],\tag{3.51}$$'
