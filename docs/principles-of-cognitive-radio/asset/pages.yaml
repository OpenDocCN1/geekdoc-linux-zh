  md: "Chapter 3, then a low received signal level might not necessarily be caused\
    \ by a primary transmitter located outside of the CR interference range.\n\n#\
    \ 4.3 White-space detection for cognitive interweaving\n\nObserve from the onset\
    \ the basic assumption that no infrastructure change is required for primary networks\
    \ to share spectrum with secondary users. This implies that each CR detects the\
    \ presence of primary users without any help from them (yet, as we shall see in\
    \ the next chapter, spectrum sensing can be improved by cooperation among sensors).\
    \ The following techniques for spectrum sensing will be examined in this chapter.\n\
    \n+   - **Energy sensing** This detector decides that the primary signal is present\
    \ if the energy sensed exceeds a given threshold.\n+   - **Coherent sensing**\
    \ The detector, which has perfect knowledge of the primary-user signal and of\
    \ the transmission channel, correlates the received signal with a noiseless copy\
    \ of that signal, and compares the result against a threshold.\n+   - **Cyclostationarity-based\
    \ sensing** The detector exploits the cyclostationarity of the observed signal,\
    \ caused by the periodicity of certain features of the signal, like mean and autocorrelation,\
    \ possibly introduced to assist spectrum sensing. Signals can be distinguished\
    \ because the observation of a wide-sense stationary process, with no periodic\
    \ features, denotes absence of the primary signal.\n+   - **Autocorrelation detection**\
    \ The detector assumes that the primary signal is wide-sense stationary, and exploits\
    \ its autocorrelation structure to discriminate it from the noise floor.\n\nIn\
    \ the remainder of this chapter, we shall focus on the first four methods. Notice\
    \ finally that a cognitive-radio receiver may investigate the presence of different\
    \ types of primary-user signals, and hence needs different detectors running in\
    \ parallel, each matched to a specific primary signal.\n\n# Modeling the observed\
    \ signal\n\nIn its simplest form, the observed signal can be written as\n\n$y(t)\
    \ = x(t) + z(t).$ \n(4.1)\n\nwhere $x(t)$ denotes the primary-user signal ($x(t)\
    \ = 0$ when the primary user is not transmitting), and $z(t)$ is additive disturbance.\
    \ Specifically, we may assume that\n\n$z(t) = i(t) + w(t).$ \n(4.2)\n\nwhere $w(t)$\
    \ is white Gaussian noise, whereas $i(t)$ denotes another additive interference,\
    \ modeled as independent of $x(t)$ and $w(t)$.\n\nA single detector must decide\
    \ between the two hypotheses\n\n$\\mathcal{H}_0 : y(t) = z(t),$ \n$\\mathcal{H}_1\
    \ : y(t) = x(t) + z(t).$"
