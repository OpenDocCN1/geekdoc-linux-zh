  md: 'detection [164, 187]. The optimization problem may be formulated as follows.
    If we make the following two assumptions:


    +   1. the sensor energy measurements ℰ_k are transmitted to the fusion center
    through a noisy reporting channel in which the noise is iid zero-mean Gaussian,
    and

    +   2. the number of observations N_S is sufficiently large that the chi-square
    distribution of the energy measurements may be approximated with a Gaussian distribution
    according to the central limit theorem [164],


    then the components of the vector z ≜ (ℰ_1, ..., ℰ_{N_SU})^T are conditionally
    jointly Gaussian: z ∼ N(μ_h, Σ_h), with mean and covariance


    $$\begin{cases}\mu_h = \mathbb{E}[z \mid \mathcal{H}_h],\\\Sigma_h = \mathbb{E}[zz^T
    \mid \mathcal{H}_h] - \mu_h \mu_h^T,\end{cases}\quad h = 0,1.\tag{5.12}$$


    Introducing the weight vector a ≜ (a_1, ..., a_{N_SU})^T, we have the following
    expressions for the probability of false alarm:


    $$P_{FA} = P[\mathbf{a}^T z > \psi \mid \mathcal{H}_0] = Q\left(\frac{\psi - \mathbf{a}^T
    \mu_0}{\sqrt{\mathbf{a}^T \Sigma_0 \mathbf{a}}}\right).\tag{5.13}$$


    and of missed detection:


    $$P_{MD} = P[\mathbf{a}^T z < \psi \mid \mathcal{H}_1] = Q\left(\frac{\mathbf{a}^T
    \mu_1 - \psi}{\sqrt{\mathbf{a}^T \Sigma_1 \mathbf{a}}}\right),\tag{5.14}$$


    where Q(·) denotes the tail probability of the standard Gaussian distribution.


    False alarm and missed detection probabilities are connected by the value of the
    decision threshold ψ, which can be computed by choosing a target P_FA or P_MD:


    $$\psi =\begin{cases}\mathbf{a}^T \mu_0 + Q^{-1}(P_{FA}) \sqrt{\mathbf{a}^T \Sigma_0
    \mathbf{a}},\\\mathbf{a}^T \mu_1 - Q^{-1}(P_{MD}) \sqrt{\mathbf{a}^T \Sigma_1
    \mathbf{a}}.\end{cases}\tag{5.15}$$


    Alternatively, the ROC linking the probability of false alarm P_FA to the probability
    of missed detection P_MD are obtained from the following expression: $$P_{FA}
    = Q\left(\frac{\mathbf{a}^T \mathbf{d} - Q^{-1}(P_{MD}) \sqrt{\mathbf{a}^T \Sigma_1
    \mathbf{a}}}{\sqrt{\mathbf{a}^T \Sigma_0 \mathbf{a}}}\right),\tag{5.16}$$ where
    d ≜ μ_1 - μ_0, or from $$P_{MD} = Q\left(\frac{\mathbf{a}^T \mathbf{d} - Q^{-1}(P_{FA})
    \sqrt{\mathbf{a}^T \Sigma_0 \mathbf{a}}}{\sqrt{\mathbf{a}^T \Sigma_1 \mathbf{a}}}\right).\tag{5.17}$$
    Following [164, 187], the weight vector optimization problem may be formulated
    in the form $$\min_{\mathbf{a}} P_{MD}(\mathbf{a}) \triangleq Q\left(\frac{\mathbf{a}^T
    \mathbf{d} - Q^{-1}(P_{FA}) \sqrt{\mathbf{a}^T \Sigma_0 \mathbf{a}}}{\sqrt{\mathbf{a}^T
    \Sigma_1 \mathbf{a}}}\right).$$'
