    # ### 1.6.3 Security aspects of cognitive radio


    The spectrum, protocol, and technology agility that cognitive radios are capable
    of also opens up new challenges for securing these and networks of these. In cognitive
    radio networks, the secondary user needs to maintain accurate spectrum occupancy
    information of all primary users in the network. As with any wireless network,
    a malicious user can threaten the network operation and bring the network down.
    In dynamic spectrum access environments, some of the following security threats
    can be prominent.


    +   1. **DSA attack.** The malicious user can create signal waveforms similar
    to the primary users in the network and trigger a false alarm in the spectrum
    sensing algorithm. This kind of spoofing primary user waveforms can affect the
    long-term behavior of secondary users. In the primary user emulation (PUE) attack,
    the adversary emulates the primary transmissions in the network. The PUE attack
    can dupe any sensing process and reduce the channel resources available for the
    secondary users in the system. In order to counter this threat, a transmitter
    verification scheme called location-based defense has been proposed in [20]. The
    transmitter verification scheme consists of three steps: verifying the signal
    characteristics of the transmitter, measurement of received signal, and localization
    of the signal source. Cognitive radios can be used in innovative ways to do these
    tasks.


    +   2. **Denial of service (DOS) attacks.** DoS attacks may include DSA attacks,
    but cover broader attack strategies. DoS attacks could also be jamming signals
    that can prevent'
  merge: -1
  img_proc: true
- pgno: 46
  md: 'messages from being received by the victim receiver. Depending on the availability
    of power, the adversary may use different strategies to deny service to the secondary
    users. For example, jamming requires higher power while spoofing a signal to confuse
    the victim may be accomplished with lower power. Beyond these strategies, manual
    DoS attacks are possible where the victim’s device interface could be misconfigured.
    In the worst case, the node is compromised so that it becomes a malicious participant
    in the cognitive radio network.


    The underlying cognitive radio architecture determines to a large extent the vulnerability
    to different attacks. Cognitive radios sensing the spectrum in a cooperative network
    are less vulnerable than cognitive radios sensing the spectrum in a noncooperative
    network. On the other hand, a malicious cognitive radio can spoof membership in
    the cooperative network and intercept sensitive information in a cooperative network.
    This node can potentially deny service to all members in the network. The usage
    scenarios can also determine the vulnerability of the cognitive radio nodes. For
    example, underlay networks, where the secondary users spread their signals over
    a wideband, are inherently less vulnerable to jamming attacks [16].


    # ### 1.7 Hardware and system design considerations


    # #### 1.7.1 Design tradeoffs in usage scenarios


    The tradeoffs associated with different cognitive radio paradigms include the
    hardware and system design requirements and constraints, in particular their complexity
    and cost. Underlay systems are required to measure the interference that a cognitive
    transmitter causes to a primary receiver. If a signal sent from the location of
    the primary receiver at a known transmit power is received at the location of
    the cognitive transmitter, then via reciprocity the cognitive transmitter can
    determine the interference it causes to that primary receiver. When there are
    multiple primary users, the cognitive transmitter cannot in general exploit reciprocity
    to determine the interference it causes to each one since it can only receive
    the sum of signals transmitted simultaneously from the primary receiver locations.
    A system-level technique to determine interference is to have multiple cognitive
    nodes in the vicinity of each primary node estimate the interference through cooperative
    sensing and detection, as described in more detail in Chapters 4 and 5. If there
    is no mechanism to measure interference caused to the primary users, then the
    cognitive radio transmission protocol must be extremely conservative, especially
    when there are a large number of primary transmitters. This typically entails
    putting the signal output from each cognitive transmitter far below the required
    interference threshold at all locations outside a very small radius around the
    transmitter.


    Interweave systems require an extremely wideband and/or agile front end to sense
    the entire spectrum of the system in search of spectrum holes. In fact, current
    hardware capabilities place significant constraints on how fast an interweave
    cognitive user'
