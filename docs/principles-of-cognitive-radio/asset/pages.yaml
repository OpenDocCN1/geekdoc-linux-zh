  md: 'together to develop a framework for Cognitive Radio systems and to develop
    and prove critical technologies using a testbed [72]. Involvement in standards
    bodies and industrial forums is emphasized from the start, to increase the probability
    of adoption of QoSMOS results into standardized products. The initial focus is
    on opportunistic use of radio spectrum, with an early example being TV White Spaces.
    Another initiative is the End-to-End Efficiency (E3) project, an ambitious German
    Large Scale Integrating Project (IP) aimed at integrating cognitive wireless systems
    in the Beyond 3G (B3G) world, evolving current heterogeneous wireless system infrastructures
    into a integrated, scalable, and efficiently managed B3G cognitive system framework.
    The key objective of the E3 project is to design, develop, prototype, and showcase
    solutions to guarantee interoperability, flexibility, and scalability between
    existing legacy and future wireless systems, manage the overall system complexity,
    and ensure convergence across access technologies, business domains, regulatory
    domains, and geographical regions [33].


    # 1.11  Organization of this book


    The remainder of this book is organized as follows. Chapter 2 discusses fundamental
    capacity limits and transmission techniques for the various cognitive radio usage
    paradigms from an information theoretic perspective. Such fundamental performance
    limits provide guidelines for the design of cognitive radio networks. Chapter
    3 discusses the relevant radio propagation channel models that characterize transmissions
    in cognitive radio networks. These channel models are critical to the analysis
    of interference to primary users, secondary coexistence and for establishment
    of interference management schemes. Sensing is a fundamental attribute of cognitive
    radios and Chapter 4 discusses the fundamentals of sensing as relevant to the
    usage paradigms for cognitive radios. Finally, Chapter 5 rounds out the material
    by discussing advanced spectrum sensing techniques, optimization problems related
    to exploration, and exploitation for cognitive radio networks and cooperative
    sensing.


