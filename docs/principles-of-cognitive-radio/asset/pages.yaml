    amplitude is Nakagami fading, then the received power follows a Gamma distribution,


    $$p_{P_r}(P_r)=\frac{m}{\bar{P}_r\Gamma(m)}\left(\frac{mP_r}{\bar{P}_r}\right)^{m-1}\exp\left(-\frac{mP_r}{\bar{P}_r}\right);\quad
    0\le P_r<\infty\tag{3.24}$$


    The Nakagami distribution is in widespread use because it can be handled in a
