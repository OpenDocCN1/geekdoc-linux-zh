    # 3.12 Summary of key model parameters


    We have reviewed the models that are used to define the propagation conditions
    of the wireless systems operating in different locales. The list of references
    containing measurements is very extensive. Here we give a summary of selected
    references where key parameters of these models may be found and which have been
    standardized by national or international organizations, and/or are often used
    by industry practitioners and system designers.


    # 3.12.1 Path loss models


    The best-known path loss model and its empirical parameters for the cellular environment
    with base station height above rooftops (macrocells) is given by Hata in [53]
    and is based on measurements in Japan [85]. These models are based on measurements
    made in frequency bands below 1 GHz. An extension to the 1.8 GHz band is given
    in [111]; this reference also gives a model (based on both theory and measurements)
    for cellular environments where the base station height is comparable to, or lower
    than, rooftop height (microcells). Standardized values for the 2 GHz band are
    given in [48]. The broadcasting bands use very high towers (often located on prominent
    hill tops) and use large (kW) transmit powers. The field strength of these systems
    is calculated using the models given in [94]. Path loss models for fixed wireless
    access systems are given in [25, 50].


    # 3.12.2 Ricean K-factor models


    Extensive measurements of the K-factor and empirical relationships are given in
    [31]. These measurements were made in European cities in the 5 GHz band. Temporal
    K-factor measurements in the 2 GHz band and used in fixed wireless access systems
    are given in [25].


    # 3.12.3 Delay dispersion models


    A considerable number of standardized multipath delay profiles exist. In [30]
    we find profiles based on measurements in Europe for a 900 MHz carrier frequency
    and a 200 kHz bandwidth. A model for higher bandwidth (5 MHz) and carrier frequency
    (2 GHz) was standardized by the ITU in [48]; this model is mainly intended for'
  merge: -1
  img_proc: true
- pgno: 169
  md: 'macrocellular environments. More refined models for macro- and microcells can
    be found in [5, 102, 104].


    For indoor environments, [19, 74] give power delay profiles suitable for systems
    with 20 MHz bandwidth; the models are used both for the 2 GHz and the 5 GHz bands.
    Ultrawideband channel models, which cover the whole bandwidth between 3 and 10
    GHz, can be found in [20, 78, 79].


    # 3.12.4 Frequency dispersion models


    Most people use the classic Clarke–Jakes Doppler spectrum [15, 56]. Indeed this
    is the case for the ITU standard [48]. Similarly, [30] defines Doppler spectra
    that are either Jakes-like or Gaussian in shape for the different taps of the
    power delay profile in macrocellular environments. Doppler spectra peaked at the
    center tend to occur more frequently in fixed-wireless applications, while Doppler
    spectra with a “bathtub” shape correspond to a mobile station moving on a street,
    with scatter from all directions.


    # 3.12.5 Comprehensive models


    Several models have been developed that describe path loss, delay dispersion,
    and angular dispersion (and thus implicitly Doppler spectra). For both macrocellular
    and microcellular environments, [102] gives models for a 5 MHz bandwidth and a
    2 GHz carrier frequency. An indoor model that includes delay dispersion and angular
    dispersion is described in [26]. More refined models that are suitable for even
    more environments can be found in [5, 77, 104], and [11, 81].


    # 3.12.6 Usage of models


    The models presented above, and more generally, all statistical channel models,
    do not completely describe the realities of propagation. “Typical” or “standardized”
    values of channel parameters are helpful in comparing different radio systems
    to each other, but they can deviate from the physical reality. Therefore, no performance
    guarantees can be given for CR designs based on specific channel models, nor can
    noninterference guarantees be provided.


    # 3.13 Summary


    Radio propagation models like those described here are critical to the prediction
    of both primary–CR and CR–primary interferences in cognitive radio environments,
    and to the design of real-time methods to control, avoid, or mitigate these interferences.
    In addition, the models described can be used to design CR–CR transmission strategies
    to cope with the secondary status of CR users. Some examples:


    +   - models of median path loss and its distance dependence help to predict the
    median interference powers in primary and CR receivers;'
  merge: -1
  img_proc: true
- pgno: 170
  md: '+   - models of both shadow fading and multipath fading statistics (the latter
    augmented by models of Ricean K-factor) help to (1) determine the needed fade
    margins on CR–CR paths; and (2) predict the statistical variability of interference
    levels;

    +   - models of the spatial variability of shadow fading help to (1) design the
    sensor networks used to characterize the radio environment; and (2) relate power
    measurements on CR–CR paths to interference levels on CR–primary paths;

    +   - models of rms delay spread and/or coherence bandwidth help to relate power
    measurements at one frequency to interference levels at another;

    +   - models of angular spread help to predict the ability of a CR system to suppress
    interference in the direction of the primary receiver;

    +   - all these models make it possible for system analysts and designers to simulate
    propagation environments and then evaluate candidate CR algorithms for interference
    mitigation, leading to optimized designs and more reliable performance predictions.


    We have reviewed the two main aspects of channel models, namely, path loss (large-scale
    effects) and impulse response (small-scale effects) and we have provided samples
    of the models developed and used for each. We have also cited numerous references,
    for more details on model parameters and for further reading in general. Most
    of all, we have attempted to relate the various properties of channel models to
    their potential use in the design of cognitive radios and CR networks. The large
    body of measurement and modeling work done in this field to date provides a strong
    foundation for the excellent future work that will surely build on it.


    # 3.14 Further reading


    The topic of propagation in the bands relevant to CR are covered quite extensively
    in three modern-day texts by Rappaport [92], Goldsmith [40], and Molisch [76].
    All three textbooks provide detailed coverage – beyond the scope of a mere chapter
    – of both large-scale and small-scale effects and their impact on wireless systems.
    For an early treatment of these topics and their relevance to cellular engineering,
    the reader is referred to the pioneering paper by R. H. Clarke [15] and to the
    pioneering text edited by Jakes [56]. For a deeper understanding of the wireless
    channel functions involving time, delay, frequency, and Doppler, and the connections
    among these functions, the reader is referred to the seminal work by Bello [7].
    For an appreciation of the emerging topic of radio channels with low-height antennas
    at both ends, as pertains to sensor networks and mobile-to-mobile systems, readers
    will find papers by Talha and Patzold [109] and Molisch et al. [83] to give useful
    summaries. An example study of interference in cognitive radio environments is
    a paper by Suraveera et al. [106], which highlights the importance of accurately
    estimating the path loss between primary and CR users.


    Finally, readers actively engaged in the main topic of this book, or interested
    in pursuing it, may wonder how all the propagation channel concepts presented
    here can be brought together in the design and analysis of cognitive radio systems.
    An excellent example of how to do it is the simulation method proposed in [102].
    This approach is'
