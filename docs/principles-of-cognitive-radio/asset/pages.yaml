- pgno: 240
  md: 'the spectrum of interest may be very wide and noncontiguous. Thus, from the
    perspective of a single secondary user, sensing the whole spectrum of interest
    in each sensing instant may not be practical due to the difficulties it presents
    to the sensing receiver’s radio frequency (RF) front-end design as well as due
    to the high energy consumption of such an approach. Consequently, a more practical
    solution involves dividing the spectrum of interest into smaller frequency subbands
    that can be sensed one at a time. Hence, the problem becomes deciding which frequency
    band or bands to sense and subsequently access and by which user or users in order
    to optimize the cognitive radio network’s performance. Obviously the secondary
    users should sense and access frequency bands in which there exist persistent
    spectral opportunities and high average throughput. Moreover, in a cognitive radio
    network it becomes essential to distribute the frequency bands for sensing and
    access among the network members in the most efficient and effective manner that
    results in a high probability of finding available spectrum as well as in low
    interference to both primary and secondary users of the spectrum. In order to
    make such decisions most effectively, the cognitive radio network must obtain
    situational awareness. Thus, various approaches to modeling, learning, and predicting
    the time-, frequency-, and location-varying spectrum state and the behavior of
    other spectrum users are of special interest.


    The nature and constraints of the optimization problem and the design of sensing
    and access policies depend on whether the cognitive radio network model is a single-user
    or multiuser network model, whether the spectrum model is a single-band or multiband
    model, whether the users sense and access the spectrum synchronously or asynchronously,
    and whether the secondary users in a multiuser model cooperate or compete with
    each other, among other things. In general, in an infrastructure-based network
    cooperation among the secondary users is more naturally enforced than in an ad
    hoc network in which the users are more inclined to compete with each other. However,
    this by no means rules out the possibility of competition in an infrastructure-based
    network or cooperation among the users in an ad hoc network. On the contrary,
    such approaches may offer substantial benefits by simplifying the system design
    and/or by providing improved performance. In this section we will describe various
    different approaches and cognitive radio network models that are competitive,
    cooperative, or a combination of the two. We will mostly focus on the design of
    spectrum sensing and access policies in cognitive radio networks, and introduce
    various approaches such as bandit problems, reinforcement learning, and game theory
    that may be employed to address these issues. However, we will start this section
    by looking at some more direct optimization techniques for optimized spectrum
    exploration and exploitation in cognitive radio networks.


    # 5.3.1 Optimization techniques


    In this subsection various techniques and approaches for optimizing the performance
    of cognitive radio networks are studied. We begin by briefly introducing an optimization
    technique called dynamic programming. Dynamic programming is a collection of optimization
    techniques that solve complicated sequential decision problems by breaking them
    into smaller easily solved subproblems. Moreover, dynamic programming is'
