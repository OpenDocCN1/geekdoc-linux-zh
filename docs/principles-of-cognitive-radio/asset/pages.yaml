    # 5.3.2 Bandit problems


    Bandit problems are a form of sequential decision problem in which at each time
    instant there are a number of different actions that may be selected. Bandit problems
    get their name from the correspondence to a traditional slot machine that has
    a lever (an arm) that the gambler pulls to operate the machine. These slot machines
    are also called one-armed bandits because of the single lever and the fact that
    the machine can ''rob'' the gambler of his/her money by not returning any of the
    placed bet. In cognitive radio applications, bandit problems are well suited for
    modeling multiband spectrum sensing and access problems and designing optimal
    sensing and access policies. For example, spectrum sensing and access problems
    can be modeled as multiarmed bandit problems in which the arms of the multiarmed
    bandit correspond to different frequency bands. Thus, choosing an arm to play
    corresponds to either sensing or accessing the corresponding frequency band.


    In bandit problems selecting an action, i.e., an arm to play, results in a stochastic
    reward. The goal of the agent selecting the actions is to balance between maximizing
    the immediate reward and trying out the other arms to possibly improve the long-term
    reward by finding arms that produce better rewards. In other words, the agent
    employs a policy to tradeoff between exploitation and exploration to maximize
    its reward.


    # Multiarmed bandit problems


    The classical multiarmed bandit problem may be described as follows. There are
    L arms and an agent controlling the selection of actions. At each stage, the agent
    selects one arm to play and receives a reward. Each arm is described by two stochastic
    processes s_k^n and r_k^n, k = 1, ..., L, n = 0, 1, ..., where s_k^n denotes the
    state of the k th arm, r_k^n is the reward for the k th arm, and a_k^n ∈ {0,1}
    is the agent''s action for the k th arm at time n. Action a_k^n is 1 if arm k
    is played at time n and 0 otherwise. The processes for the different arms are
    independent of each other. Moreover, the agent does not receive a reward for the
    non-played arms, i.e., r_k^n(s,0) = 0, ∀n,k,s. In addition, the state of each
    arm s_k^n changes only when the arm is played. The state of the nonplayed arms
    does not change. In general, the new state depends on all previous states. However,
    in the following we will focus on Markovian multiarmed bandit problems where the
    conditional state transition probability depends only on the current state. That
    is, the state transition probabilities are defined by'
