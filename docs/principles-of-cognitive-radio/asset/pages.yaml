    in NRC is focused on methods for flexible spectrum use, devising novel ways of
    sensing the radio environment and location, designing distributed networks that
    intelligently cooperate and building low power flexible implementation of wireless
    in mobile devices.


    # ## 1.10 Standardization activity in cognitive radio


    A flurry of standardization activities for defining the air interface using white
    spaces started after the US Federal Communications Commission (FCC) issued an
    NRPM (Notice of proposed rule making) in May 2004 to provide more efficient and
    effective use of the TV spectrum [35]. In response to the FCC proposal, the IEEE
    802.22 Working Group (WG) was formed to define a standardized air interface based
    on cognitive radios. The IEEE 802.22 standard is one of the earliest standardization
    efforts to define the MAC and PHY for opportunistic use of the television bands
    on a non-interfering basis. It specifies a MAC that dynamically adapts to the
    changes in the environment. The standard requires sensing the spectrum to detect
    the presence or absence of incumbent primary transmitters in the locality of the
    cognitive radio.


    In November 2008, the FCC issued a report “Second report and order and memorandum
    opinion and order” to adopt rules to allow unlicensed radio transmitters to operate
    in TV white spaces. In spite of strong opposition from TV broadcasters, the FCC
    adopted the rules in order to make a significant amount of spectrum available
    for new and innovative products and services, including broadband data and other
    services for businesses and consumers. However, the FCC mandated that devices
    must both consult a database constructed by the FCC to determine which channels
    are available for use at a given location, and also monitor the spectrum locally
    once every minute to confirm that no legacy wireless microphones, video assist
    devices, or other emitters are present. If a single transmission is detected,
    the device may not transmit anywhere within the entire 6 MHz channel in which
    the transmission was received.'
