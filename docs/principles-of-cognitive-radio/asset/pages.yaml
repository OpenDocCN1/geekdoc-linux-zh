  md: 'Λ(u) < ν0, we decide ℋ0; in case of equality, we randomly decide ℋ1 with probability
    ε. From conditional independence it follows that Λ(u) factors as follows:


    Λ(u) = ∏_{i=1}^{N_SU} p(u_i | ℋ1) / p(u_i | ℋ0). (5.5)


    However, for the conditionally dependent case, the optimal tests at the sensors
    are no longer simple threshold rules based on the likelihood ratios of the observations
    at the individual sensors [101, 206].


    If the local decision variables are binary, the global decision rule is a Boolean
    rule and the log-likelihood ratio at the fusion center can be written as


    log Λ(u) = Σ_{i=1}^{N_SU} [ u_i log (1 - P_MD,i)/P_FA,i + (1 - u_i) log (1 - P_FA,i)/(1
    - P_MD,i) ]. (5.6)


    where u_i is the binary local decision of the i th sensor (i.e., 0 or 1), P_FA,i
    is the probability of false alarm at the i th sensor, and P_MD,i is the probability
    of missed detection at the i th sensor. This fusion rule is known as the Chen–Varshney
    fusion rule [200, p. 63]. One sees immediately that the above expression is a
    weighted sum of local sensor decisions. The weights are functions of probabilities
    of false alarm and missed detection of individual sensor decisions. These local
    performance indices may not be known in practice and they have to be learned or
    estimated. Computationally simpler decision rules are obtained by using Boolean
    rules based on logical functions, such as the OR, AND, MAJORITY or more generally
    the K-out-of-N rule which decides in favor of ℋ1 if at least K of the sensors
    do. Using such rules typically does not result in significant performance degradation.
    In fact, for identical local binary decision rules and identical distribution
    at the sensors, the optimal global decision rule is a K-out-of-N rule [200, Sec.
    3.4]. Nevertheless, the detector is designed so that we control the global probability
    of false alarm P_FA = P(u0 = 1 | ℋ0), and probability of missed detection P_MD
    = P(u0 = 0 | ℋ1), where u0 = u0(u) is the global decision rule. A detailed treatment
    of Boolean fusion rules and their optimization is given in [200].


    In the Bayesian framework we have prior probabilities for the two hypotheses and
    costs for making the decisions (see Chapter 4 for more information). The corresponding
    global decision rule compares the log-likelihood ratio with a threshold value


    ψ ≜ log [π0(C10 - C00) / π1(C01 - C11)]. (5.7)


    where C_ij is the cost of making a global decision ℋ_j when ℋ_i is true, and π0
    and π1 denote the prior probabilities of the two hypotheses ℋ0 and ℋ1 associated
    with the channel under consideration being idle or occupied, respectively.


    # Decentralized sensing in cognitive radio systems


    In the following we briefly review some main types of decentralized spectrum sensing
    methods needed for creating awareness about the state of the radio spectrum. The
    differences among the methods are in the topology of the network of sensors, type
    of'
