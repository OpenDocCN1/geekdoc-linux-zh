    \ However, the implementation challenges associated with overlay systems may preclude\
    \ many of these potential benefits being realized in practice.\n\n# ## 2.8 \n\
    Summary\n\nDetermining the fundamental performance limits of general cognitive\
    \ radio networks is a daunting challenge. Fundamental performance bounds are available\
    \ for conventional wireless networks only in a few special cases. Adding a second\
    \ tier of cognitive users makes the capacity even more difficult to obtain. The\
    \ most common metric for performance of wireless systems is Shannon capacity.\
    \ Although there are few capacity results for general wireless networks, this\
    \ chapter has described how existing Shannon-theoretic tools can be used directly\
    \ or extended to obtain some results or bounds on the fundamental capacity limits\
    \ of cognitive networks.\n\nThe building block for all known cognitive networks\
    \ is the two-user interference channel, where one primary transmit-receive pair\
    \ and one secondary transmit-receive pair share a common channel. This simple\
    \ four-node network models all three cognitive radio paradigms – underlay, interweave,\
    \ and overlay – with one secondary user and one primary user. Specifically, in\
    \ the underlay paradigm the cognitive transmitter is restricted such that its\
    \ interference to the primary receiver is below some threshold, in the interweave\
    \ paradigm the cognitive transmitter may only transmit when it detects a spectrum\
    \ hole, and in the overlay paradigm both users transmit simultaneously, with the\
    \ secondary user improving the performance of the primary user while obtaining\
    \ some spectral resources for its own communication. Based on this four-node model,\
    \ we have shown that the capacity region of an underlay network can be determined\
    \ based on Shannon capacity analysis with the interference from the primary users\
    \ to the secondary users, and the interference from the secondary users to the\
    \ primary users, treated as AWGN. Hence, capacity of an underlay single-user channel,\
    \ with fading and multiple antennas, as well as that of a multiple access and\
    \ broadcast underlay channel, is the same as in the absence of primary users,\
    \ except that the transmit power of the secondary user(s) is constrained relative\
    \ to the interference caused to the primary users. In the case of multiple secondary\
    \ users, a MAC protocol may also be used when the sum"
