    We note that the above convergence results apply to a stationary situation only.
    That is, the convergence results state the conditions under which one-step Sarsa
    and Q-learning converge to an optimal stationary policy. In dynamic nonstationary
    environments, such as the one encountered in cognitive radio applications, one
    is interested in tracking a nonstationary problem. In such cases one of the most
    commonly employed approaches is to use a constant step size αₙ = α, ∀n. A constant
    step size does not satisfy the above conditions for convergence. However, it guarantees
    that the more recent samples are weighted more heavily than the ones in the distant
    past which is a desired feature in nonstationary problems. Moreover, in nonstationary
    environments it is important to continue to explore. This may be accomplished,
    for example, by employing the ε-greedy algorithm with a constant, sufficiently
    large ε.


    # Multiagent reinforcement learning


    A multiagent reinforcement learning problem can be formulated as a stochastic
    game [31, 113]. A stochastic game formulation of a multiagent reinforcement learning
    problem consists of [31]


    +   - a sequence of discrete time steps n = 0, 1, 2, ...;

    +   - a group of agents N'' = {1, ..., N_SU};

    +   - a set of possible states s ∈ S;

    +   - a set of possible actions for each agent in each state a_i ∈ A_i, i ∈ N'';
    the combined action space is A = A_1 × ... × A_{N_SU};

    +   - a state transition function ϱ : S × A × S → [0, 1] which defines the transition
    probability P {s_{n+1} = s_n, a_{1,n}, ..., a_{N_SU,n}};

    +   - reward functions r_i : S × A × S → ℝ, i ∈ N'', which give the agents a reward
    for the joint action a_{1,n}, ..., a_{N_SU,n} of the agents in state s_n resulting
    in new state s_{n+1}.


    The rewards in a multiagent reinforcement learning problem depend on the joint
    actions of all the agents. This complicates the learning problem considerably.
    The agents have to adapt their own policies not only to the environment but to
    the other agents'' policies as well. Defining the goal of a multiagent reinforcement
    learning task is a challenging problem. A good learning goal must include components
    that provide both stability to the learning process of the individual agents and
    adaptation to the other agents'' dynamic behavior [31]. The learning goal depends
    also on the nature of the learning problem. Multiagent reinforcement learning
    tasks may be categorized into fully competitive, fully cooperative, and mixed
    tasks [31]. Mixed tasks are neither fully competitive nor fully cooperative. Each
    one of these classes requires different goals for the learning algorithm. Moreover,
    the level of coordination among the agents has a significant effect on both the
    stability of the learning process and the adaptation to the other agents'' policies.
    The level of coordination depends on the application and its restrictions as well
    as on the chosen reinforcement learning algorithm and its goal. In some tasks
    there may be explicit coordination, e.g., in the form of pre-established preferences
    toward certain'
  merge: -1
  img_proc: true
- pgno: 258
  md: 'joint actions, negotiation of action selections among agents, or actions may
    be selected in turn and communicated to other agents. On the other hand, in the
    absence of any explicit coordination mechanism the agents may be able to observe
    the behavior of the other agents and try to learn a model of their policies.


    For more advanced discussions on reinforcement learning, its challenges, benefits,
    and different learning algorithms, the reader is referred to [24, 31, 32, 78,
    183, 184, 226] and the references therein.


    # Reinforcement learning-based spectrum sensing and access policies


    Reinforcement learning-based methods have been proposed for spectrum sensing and
    access in cognitive radio networks. Both single- and multiagent reinforcement
    learning methods have been proposed. In the following we will give an overview
    of the state-of-the-art in reinforcement learning in cognitive radio systems.


    # Energy-efficient cooperative multiband sensing policy for cognitive radio systems


    In [148, 149] a two-stage reinforcement learning-based collaborative multiband
    sensing policy for centralized cognitive radio systems is proposed. The fusion
    center operates as the learning agent of the cognitive radio network consisting
    of a group of secondary users. The actions determine which frequency bands are
    sensed and which frequency band each secondary user senses. The actions are chosen
    in two stages. In the first stage the frequency bands to be sensed are chosen.
    In the second stage the secondary users are assigned to sense the frequency bands
    chosen in the first stage. Thus, in the first stage the action corresponds to
    choosing the frequency bands and in the second stage the action corresponds to
    choosing the secondary users for each frequency band. The policy employs ε-greedy
    action selection and single-state Q-learning with discount rate ξ = 0. Thus, the
    update of the action Q-values is given by


    $$Q_{n+1}(a) = Q_n(a) + \alpha_n [r_{n+1} - Q_n(a)].\tag{5.83}$$


    A separate Q-value is kept for each frequency band. In addition, for each secondary
    user a separate Q-value is kept for each frequency band. The reward r is the obtained
    throughput for the frequency bands, and for the secondary users the reward is
    defined as follows:


    $$r_{n+1,k} = \begin{cases} u_{n+1,k}, & u_{n+1,FC}=1, \\ Q_n(a), & u_{n+1,FC}=0,
    \end{cases}\tag{5.84}$$


