  md: '# ### 2.6.1 Shannon capacity


    The Shannon capacity region of an interweave network dictates the maximum rates
    achievable for all secondary source–destination pairs, subject to the modeling
    assumptions and constraints imposed by the primary users. The modeling assumptions
    include the number of both primary and secondary users, the number of frequency
    bands available in the system, the statistics of the primary user traffic, and
    the topology of the network. When there are multiple primary or multiple secondary
    users, then a MAC protocol for how each type of user shares the available bandwidth
    with users of the same type must also be optimized. Alternatively, we can define
    a MAC protocol a priori and derive capacity based on the constraints associated
    with this MAC. In the interweave paradigm, the sharing of available bandwidth
    between primary and secondary users is subject to the constraint that the secondary
    users do not occupy any spectrum that it detects as currently occupied by primary
    users. It can still cause interference to primary users due to missed detection,
    when a spectrum hole is detected despite the presence of a primary user. The interweave
    system typically has a constraint on this missed detection probability imposed
    on it by the primary system.


    We begin the discussion of capacity for interweave networks with the most basic
    model: one primary transmit–receive pair and one secondary transmit–receive pair.
    This system can be modeled by the four-node interference channel shown in Fig.
    2.7, where source–destination pair 1 corresponds to the secondary user pair and
    source–destination pair 2 corresponds to the primary user pair. Suppose there
    is only one frequency band available to all users. We assume perfect detection
    of the primary user activity by the secondary user, and that the two users share
    the interference channel via a time-sharing medium access strategy whereby only
    one of the sources transmits at any given time (this will be the primary user
    if it has data to send, otherwise the secondary user). Let $C_p$ denote the Shannon
    capacity of the primary user’s channel assuming it transmits over all time and
    the secondary user is silent. Let $\alpha$ denote the fraction of time that the
    primary user occupies the channel. The primary user’s channel capacity is then
    $\alpha C_p$ since that is the maximum rate it can achieve over all time. Let
    $C_s$ denote the Shannon capacity of the secondary user’s channel assuming it
    transmits all the time and the primary user is silent. Then the rate region $(R_p,
    R_s)$ associated with the time-sharing strategy between the primary and secondary
    users is the triangle of Fig. 2.14 defined by ($\alpha C_p$, $(1-\alpha) C_s$),
    with y-axis intercept $C_p$ and x-axis intercept $C_s$. These ideas are easily
    extended to multiple primary and secondary users if there is perfect coordination
    among the primary users and among the secondary users, and perfect detection of
    primary user channel occupancy by the secondary users, as illustrated in Fig.
    2.15. This figure shows the two primary users coordinating via time-sharing and
    the two secondary users coordinating via time-sharing to utilize the timeslots
    where primary users are absent. More generally, for a network with $K_p$ primary
    users and $K_s$ secondary users, $K_p + K_s = K$, assume a time-sharing strategy
    where the fraction of time allocated to primary user $i$ on its channel of interference-free
    capacity $C_i$ is $\alpha_i^p$, with $\sum_{i=1}^{K_p} \alpha_i^p = \alpha$. Assume
    the $j$th secondary user with interference-free capacity $C_j$ is allocated time
    fraction $\alpha_j^s$ of the remaining time fraction $1 - \alpha$, such that $\sum_{j=1}^{K_s}
    \alpha_j^s = 1 - \alpha$. Then the'
