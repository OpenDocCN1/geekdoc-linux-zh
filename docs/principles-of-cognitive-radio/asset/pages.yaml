  md: 'paramount for understanding the nature of learning techniques such as reinforcement
    learning that will be studied later in this chapter. In addition, in this section
    we will look at a few interesting dynamic programming and other optimization approaches
    for maximizing the cognitive radio throughput by means of optimizing the frequency
    band sensing order or the sensing parameters, such as the detection thresholds,
    sensing and transmission times, and the allocation of sensing resources to different
    frequency bands in multiband cognitive radio scenarios.


    # Dynamic programming


    Dynamic programming is an optimization approach in which an original complex problem
    is broken down into smaller, simpler subproblems that are then solved in a recursive
    manner. Dynamic programming applies to many different types of problems. However,
    here we focus on solving finite Markov decision processes (MDPs) to illustrate
    the main idea of dynamic programming. A finite MDP consists of the following:


    +   - a sequence of discrete time steps $n = 0, 1, 2, \ldots$;

    +   - a finite set of possible states of the environment $s \in S$;

    +   - a finite set of possible actions in each state $a \in A$;

    +   - a state transition function $\varphi : S \times A \times S \to [0,1]$ which
    defines the transition probability $P\{s_{n+1} \mid s_n, a_n\}$;

    +   - a reward function $r : S \times A \times S \to \mathbb{R}$ which gives a
    reward for taking action $a_n$ in state $s_n$ resulting in new state $s_{n+1}$.


    Let us consider the maximization of the expected sum of discounted rewards given
    an initial state $s_n = s$:


    $$\max \mathbb{E}\left[ \sum_{k=0}^{N_s} \xi^k r_{n+k+1} \right], \tag{5.47}$$


    where $r_n$ is the reward at time $n$ and $\xi$, $0 \leq \xi \leq 1$, is the discount
    rate. Note that the model allows also the infinite horizon case if $N_s = \infty$;
    however, in this case we must assume $\xi < 1$. The goal of the decision problem
    is to find an optimal policy $\pi^*$ that determines in each state $s \in S$ the
    optimal action $a \in A$, so that the above discounted sum of rewards is maximized.
    The value of a policy $\pi$ starting from state $s$ is defined by


    $$\mathcal{V}^\pi(s) = \mathbb{E}_\pi\left[ \sum_{k=0}^{N_s} \xi^k r_{n+k+1} \mid
    s_n = s \right], \tag{5.48}$$


    where $\mathbb{E}_\pi[\cdot]$ denotes the expectation given that the policy $\pi$
    is followed.


    The value function can be broken down as follows:


    $$\mathcal{V}^\pi(s) = \mathbb{E}_\pi\left[ \sum_{k=0}^{N_s} \xi^k r_{n+k+1} \mid
    s_n = s \right]$$


    $$= \mathbb{E}_\pi\left[ r_{n+1} + \sum_{k=1}^{N_s} \xi^k r_{n+k+1} \mid s_n =
    s \right]$$'
