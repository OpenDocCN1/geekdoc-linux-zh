    upper envelope at m1 yield sharp lower and upper bounds to m2 (see Fig. 4.2 for
    an illustration). The dashed curve has equation (x², h(x)), while the continuous
    lines represent the upper and lower envelope delimiting the convex hull for any
    value of m1, and hence describing the bounds on m2 achieved by the limiting CDFs.


