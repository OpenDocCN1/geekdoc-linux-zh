    the capacity definition for wireless ad hoc networks, while taking into account
    the interference constraints at the primary users. Both capacity and the interference
    constraints will depend on the channel characteristics. To define the received
    power constraint, we consider first a narrowband system with one secondary and
    one primary user, as shown in Fig. 2.13. We extend this to networks with multiple
    primary and secondary users below. In this two-user network, an interference constraint
    translates to a received power constraint on the secondary user’s signal at the
    primary user’s receiver. Let $X_{i}$ denote the channel input at time $i$ by the
    secondary user and $Y_{i}$ denote the corresponding channel output at the primary
    receiver. The channel between the secondary transmitter and the primary receiver
    is assumed to be memoryless and hence can be described by a conditional probability
    distribution $p(y|x)$ at each time $i$, as illustrated in Fig. 2.13 for the link
    between the secondary transmitter and primary receiver. With each input–output
    pair $(x, y)$ we associate a cost function $c(x, y)$. The average cost function
    over $n$ transmissions is then defined as the average of the per-symbol cost:


