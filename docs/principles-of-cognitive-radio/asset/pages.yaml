    # ## 2.3 Fundamental performance limits of wireless networks


    A wireless network consists of a collection of wireless devices communicating
    over a common wireless channel. The simplest wireless network consists of a single-user
    (point-to-point) channel. In general, a wireless network contains multiple source
    nodes,'
