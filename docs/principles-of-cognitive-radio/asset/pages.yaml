    the base station and the mobiles. It has since been learned, however, that the
    fluctuations occur even on paths with a clear line-of-sight but with reflections
    along the path, e.g., in LOS microcells [41]. We will continue to refer to with
    this random-like process by its popular name. We note that, since S is Gaussian,
    the factor ζ in (3.7) is log-normal; hence, the popular terminology in the literature
    for the variation about the median is lognormal shadow fading.


    A popular convention among wireless engineers is to regard the bracketed term
    in (3.8) as the "path loss," to which shadow fading (S) is added, as if the former
    is a natural attribute of the distance and environment and the latter is a perturbation.
    In reality, the separation into these parts is merely an artifact of the measurement
    program (which locations are measured and how many) and the data processing used
    (least-squares fitting of a linear function of log-distance). We will use here
    the more precise convention that the bracketed term represents a median path loss
    for distance d in a given environment; and the path loss at distance d is the
    sum of both this median and a zero-mean, random-like component called shadow fading.
    The most widely used formulation for the median path loss, as discussed later,
    is in [53].


    # 3.4.2 Shadow fading, S


    The standard deviation (σ) of S can vary from 3 to 12 dB, depending on the environment.
    In a typical cellular environment, the most commonly used value is 8 dB; for indoor
    environments, it is ~ 4 dB. This description summarizes the first-order statistics
    of shadow fading and is well supported by measurements. Less well documented are
    the second-order statistics of shadow fading, e.g., the autocorrelation function
    of its 2-dimensional distribution over space for a specified TX location. This
    information is not always needed in system studies, but one can envision CR scenarios
    where it would be useful. For example, in an environment where n CR nodes are
    receiving and one source (either primary or CR) is transmitting, simulating the
    path losses to the n CR nodes would require knowing the n × n correlation matrix
    among the n source-to-node shadow fading components. It is easy to appreciate
    the complexity of the measurement programs needed to derive such information,
    which explains the sparse literature on the subject.


    Nevertheless, we can cite a few useful results pertaining to the spatial distribution
    of shadow fading. One is due to Gudmundson [47], who reported that, along a path
    moving towards or away from the TX in the x direction, the correlation between
    S-values for points at x and x + Δx can be approximated by


    ```

    E_x{ S(x) S(x + Δx) } = σ² exp( -|Δx| / X_c ) = ρ(Δx). (3.10)

    ```


    where X_c is the "correlation distance" of shadow fading. Typical values for X_c
    range from 10 m (i.e., in urban microcells) to 500 m (i.e., in some rural macrocells).
    Roughly speaking, X_c is a measure of how far a mobile must travel before it encounters
    a different set of obstructing or scattering objects. In CR environments where
    sensor networks are used to obtain and update radio maps of the environment, the
    correlation distance'
