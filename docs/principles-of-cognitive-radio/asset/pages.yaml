- pgno: 142
  md: 'environments have shown that the full pattern gains of highly directive receive
    antennas will not necessarily be realized [43]. The reason is that directive beams
    reduce wide-angle scatter that would otherwise add to the received power, and
    this loss offsets part of the gain acquired from the antenna.


    The extensive measurements reported in [43] were conducted at 1.9 GHz in suburban
    residential environments, both in summer and winter to assess the impact of trees.
    The data were used to quantify the amount by which receiver gain, G_r, is reduced
    by multi-path scatter. The amount of this reduction – whose dB value is the gain
    reduction factor (GRF) – was shown to vary from one path to another. A statistical
    model for GRF, as reported in [43] and standardized in [25], is as follows.


    +   - In suburban residential environments, GRF is a Gaussian random variable
    from path to path, with a mean μ_grf and a standard deviation σ_grf.

    +   - For antenna heights between 3 m and 10 m, there are but minor changes in
    μ_grf and σ_grf, so the model averages the values of these parameters for the
    two heights.

    +   - μ_grf = −(0.53 + 0.1I)ln(β/360) + (0.5 + 0.04I)(ln(β/360))², where I = 1
    for winter and −1 for summer; and β is the directive antenna beamwidth, in degrees.

    +   - σ_grf = −(0.93 + 0.02I)ln(β/360).


    The practical effect of this model, in the kinds of environment where CR systems
    often operate, is this: a directive receive antenna can suppress some of the received
    power in the presence of wide-angle scatter, thereby diminishing the hoped-for
    benefit of using high-gain antennas. For example, a link whose receive antenna
    has a 30° beamwidth, with a corresponding gain of ~ 11dB, loses all but 4 dB of
    that gain with 50% probability. For antennas with higher directivity (and correspondingly
    higher gain), the reduction is even greater.


    # 3.5 Path loss models for tower-based scenarios


    We have defined the wireless channel to be one where at least one end is in clutter
    and the other end has an antenna height of up to 80 m. Here we treat channels
    in which either one end is higher than 80 m (as in TV towers) or both ends are
    above the clutter (as in roof-mounted antennas). We will give the possible CR
    contexts for these cases and provide relevant path loss models.


    # 3.5.1 Transmissions from TV towers


    A good starting point for modeling path loss in this case is the ITU-R recommendation
    P.1546 [94], which covers a wide range of antenna and terrain conditions. Formulas
    and graphs are given in terms of median received field strength, E_dB, in dB-μV/m,
    as a function of distance, for different frequencies and tower heights and with
    an effective radiated power of 1 kW. This can be translated into path loss using
    the formula


    PL = 139.3 − E_dB + 20 log(f_MHz).    (3.14)'
