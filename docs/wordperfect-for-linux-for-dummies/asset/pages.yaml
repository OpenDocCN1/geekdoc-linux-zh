  md: '# Chapter 18


    # Spinning Web Pages


    In This Chapter


    +   - "What is all this Internet stuff, and what is it doing in my word processor?"

    - What is hypertext?

    - Your own personal, mini deskwide Web

    - The World Wide Web

    - WordPerfect and HTML: Markups for free

    - Your very own Web pages

    - Turn documents into Web pages


    One little-known provision of the U.S. Communications Reform Act of 1996 made
    making any piece of software in the United States illegal unless the software
    could connect to the Internet. Thus, we have Internet-enabled word processors,
    spreadsheets, and toaster ovens.


    Okay, it''s not really law, although it may well be. Let''s call it a trend. WordPerfect
    hasn''t been immune to this trend. In this course, we do several things to help
    you get started in your World Wide Web experience. First, we will talk a little
    about what the Internet and the World Wide Web are. If you''re planning to create
    a Web page, you need to know this stuff. Of course, one of us wrote a whole book
    about that (The Internet For Dummies, 6th Edition, by John Levine, Carol Baroudi,
    and Margaret Levine, published by IDG Books Worldwide, Inc.), although we don''t
    go into it.


    Second, we talk about hypertext links and bookmarks. They''re the WordPerfect
    way of creating Web pages: linking information from one document to another. Using
    WordPerfect bookmarks and links is a good way for you to get started creating
    Web pages. You don''t have to worry about all the Web parts of the process. Instead,
    you can concentrate on the content you want to communicate to people and the way
    you plan to organize that content.'
  merge: -1
  pgno: 348
- img_proc: true
  md: '# Part IV: Creating Documents That Don''t Just Sit There


    Finally, we talk about creating Web pages in HTML (we explain what that is, too)
    and putting them on the World Wide Web. As you can tell, this topic is rather
    large; in fact, books have been written about the subject. We know because of
    us we wrote one of them. If you found this teaser tantalizing, check outPerfect
    Web Publishing For Dummies, which Dave wrote (IDG Books Worldwide, Inc.).


    # Hypertext, the Internet, and the World Wide Web


    The World Wide Web is built on two basic concepts: hypertext and the Internet.
    When you combine these two concepts, as often happens, you end up with something
    that has much more impact than either had had on its own. Understanding the World
    Wide Web is much easier if you at least know what the concepts that make it work.
    Read on!


    # What is hypertext?


    Hypertext is something that appears not only on the World Wide Web but also in
    lots of places in computer software. It''s just like regular text, except for
    one thing: When you click on certain words or phrases, you are magically transported
    to different text, in either the same document or another document. Although the
    concept sounds very space-age, it''s simple. You can follow related ideas in a
    way that would be difficult if you had to skip around page to page in a book or
    from book to book.


    You may be familiar with hypertext; in fact, you may have used it. Where? In the
    online help systems used by many programs in Linux and Windows. Help screens are
    sprinkled with little icons just enticing to click on them; they''re hypertext
    links to other parts of the help system. When you click on one of these links,
    another screen of information appears; most of us find this feature really useful.
    If you use KDE, try out some hypertext by clicking on the K button and choosing
    KDE Help from the menu.


    # The Internet


    Once upon a time, computers were big and lonely. They lived in glass houses and
    were surrounded by acolytes in white coats. Later, these big computers were connected
    to lots of dumb terminals, like Gulliver tied down by the Lillipians. The computers
    even spoke to one another — sort of like whales at a great distance. As computers
    get smaller and smaller, they became more and more social — kind of ants like.
    Millions of computers,'
  merge: -1
  pgno: 349
- img_proc: true
  md: '# Chapter 18: Spinning Web Pages


    large and small, are now now connected — some via telephone, some via Local

    Area Networks within an office, and some via high-speed telephone links.

    Rather than try to keep all these computers rigidly organized, people have

    discovered that you can get a message from any computer to any other by

    asking a computer to pass the message to some computer that may know

    the recipient. That''s the Internet: a whole bunch of computers playing

    whisper-down-the-lane.


    # The World Wide Web


    For years, people used this network of computers pretty much the way they

    used the Gulliver-and-the-Lillipians computer networks: All the small com-puters
    asked the computers to do something for them. In 1990, a charming

    English guy named Tim Berners-Lee, at the European Particle Physics Lab-CERN,
    realized that the information could be anywhere, and he

    developed a way for any computer to ask (almost) any other computer

    connected to the Internet for some information. The we linked all that

    information with hypertext. He called it the World Wide Web.


    A Web page (a document that forms part of the World Wide Web) looks like

    a regular word processing document onscreen, that some words are

    underlined. Amid all the hype and all the fanfare about the Web, one fact is

    frequently overlooked: All those Web pages must have something on them.

    The pages must have content, and that content has to be written with some

    tool. Because the folks at WordPerfect already had a tool that could produce

    tables, boldface text, italics, outlines, and even hypertext links, WordPerfectnwas
    reborn as a Web page creator.


    You probably didn''t know that even normal WordPerfect documents can use

    hypertext. If you did, it''s not because we told you — at least, not yet!) Most

    people don''t give a hoop about it because they''re creating paper documents,

    ellectric documents. Because you''re now creating electronic documents

    for the Web, however, it''s time to give the matter some attention.


    # Hypertext Links and Bookmarks


    The WordPerfect bookmark feature enables you to link one piece of text to

    another, the same document or another document. You don''t really need

    to use bookmarks to create Web pages. You ought to know about them,

    though, for three reasons. First, the tools you use to create a link to a book-mark
    are the same ones you use to create a link to another page on the World

    Wide Web. Second, as you''re looking through your documents, you should be

    thinking about the links among them: places from which it makes sense to help

    the reader jump to some other place in your documents, and places they

    should be jumping to. Third, it''s pretty easy.'
  merge: -1
  pgno: 350
