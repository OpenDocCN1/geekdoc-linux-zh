    (the colors look much nicer on the screen). At the top of the dialog box is a
    list of color schemes, predefined sets of colors that color-challenged person
    at WordPerfect looked good. WP Grey is the scheme we show in the figures in this
    book.


    ![](img/a2afb402c275cfc5e5a8f62356a922ef_380_0.png)


    +   * Choose a color scheme by clicking on one of the names on the Color Scheme
    List.


