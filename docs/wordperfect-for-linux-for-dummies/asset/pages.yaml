  md: '# Installing the CD


    The WordPerfect For Linux Dummies CD contains the most appropriate possible program
    — WordPerfect for Linux, by Corel Corporation! To install WordPerfect from the
    CD to a Linux system, follow these steps:


    +   1. Log in to your user as root and display a shell prompt.


    If you don''t know how to type shell commands or don''t have permission to log
    in as root, ask your Linux system administrator for help with installing WordPerfect.


    +   2. Type the Linux mount command to tell Linux that a CD is in the drive, like
    this:


    ```

    mount /dev/cdrom /mnt/cdrom

    ```


    +   3. Move to the directory where new software is installed (usually /usr/local)
    by typing


    ```

    cd /usr/local

    ```


    +   4. Create a new directory named wp in which to install WordPerfect by typing


    ```

    mkdir wp

    ```


    +   5. Create a temporary directory into which to copy the installation file by
    typing


    ```

    mkdir /var/tmp/wp

    ```


    +   6. Copy the file GUILG00.GZ the GUILG directory on the CD to the directory
    you just created by typing


    ```

    cp /mnt/cdrom/GUILG/GUILG00.GZ /var/tmp/wp

    ```


    +   7. Uncompress the installation programs by typing these commands:


    ```

    cd /var/tmp/wp

    gunzip GUILG00.GZ ; tar xvf GUILG

    ```


    +   8. Run the installation program by typing


    ```

    ./Runme

    ```


    This command asks whether you unzipped and “tarred” the files: Answer Y. The installation
    program runs.


    +   9. Follow the instructions onscreen


    When the program asks where to install WordPerfect, type the directory /usr/local/wp
    (or whatever directory you created in Step 4).


    For more information about installing WordPerfect from this CD, see the appendix,
    which also includes directions for adding WordPerfect to your KDE desktop, Personal
    menu, and panel.'
