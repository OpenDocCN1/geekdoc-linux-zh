- img_proc: true
  md: '# Chapter 14: Chasing Your Words Around the Page


    The Wrap button on the Property Bar makes selecting which kind of wrapping you
    want easy. In case you forget, the only way to see the Property Bar for the box
    itself, rather than for the contents of the box, is to click on the outline of
    the box; you should see square "handles" around the edge of the box (see the section
    "Chasing everything else about a box," earlier in this chapter). When you click
    on the Wrap button, you see a list of the options we just described, with a few
    additions. Don''t worry about contours for now; we talk about them in Chapter
    15 when we talk about pictures. You can also have your box block out the text
    it''s sitting on top of (that''s the In Front of text option) or have the text
    march right over your box (Behind Text). You figure out whether that may be useful
    sometime.


    # Scribbling on Your Document


    In the ceaseless quest to make documents on computer screens look more and more
    like documents on paper, word processors feel compelled to let you scribble on
    your document, just like you might with a pen or pencil. This feature can be very
    useful if you want to emphasize something or draw a visual connection between
    elements of your document. WordPerfect is uncommonly accomplished in this area.
    You can easily draw horizontal and vertical lines in your document and, and with
    a little more effort, draw lines and shapes anywhere you want.


    # Up and down and side to side


    To draw a horizontal line, press Enter to make a new paragraph, place the cursor
    there, and then press Ctrl+F11 or choose Insert>ShapeHorizontal To place a vertical
    line through most of your page, choose Insert>Shape>Vertical Line. You can change
    the length of the horizontal or vertical line and its location by editing it.
    Right-click on the line to select it, which can be a bit tricky. Pass the mouse
    cursor slowly over the line you inserted. At some point, the cursor should turn
    into a right-pointing arrow. That''s your cue to right-click. On the QuickMenu,
    you see the choice Edit Horizontal Line (or Edit Vertical Line), which displays
    the Edit Graphics dialog box, with lots of options. If you''re tired of it, you
    can delete it by right-clicking on the line and choosing Delete. When you select
    a line by clicking on it, black handles appear, which you can use to move the
    line.'
