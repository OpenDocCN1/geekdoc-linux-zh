  md: '# Chapter 16: Creating Your Junk Mail 283


    +   1. Choose Tools: Merge or press Shift+F9 to display the Merge dialog box (refer
    to Figure 16-2).


    +   2. Click on the Data button.


    If you see the Create File dialog box, skip to Step 3.


    If anything is in the document you''re editing, WordPerfect first displays a dialog
    box labeled Merge File. If it does, you have two options: Use File in Active Window
