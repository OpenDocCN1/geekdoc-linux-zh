    # Two Helpful File-Management Tools for the Forgetful Author


    No matter how carefully you name your files, at some point you lose track of what''s
    in them. (Does memo .wpd contain that memo to your-boss or the memo to your sweetheart?)
    The WordPerfect file manager has two nifty tools to jog your memory.


    # The viewer window


    The View button in the File Manager, Save As, or Open dialog box opens the Viewer
    window, showing the contents of whichever file you have selected, as shown in
    Figure 13-2. You can''t do anything with this preview except what''s in the file;
    at this point, however, that you''re interested in.


