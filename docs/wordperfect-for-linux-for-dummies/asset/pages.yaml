  md: '# 82 Part I: Introducing WordPerfect for Linux


    Match Whole Word. (The command otherwise assumes that you''re looking for just
    a set of characters, even within a word.) The phrase Whole Word appears below
    the Find text box to remind you.


    Certain things you select in the Find and Replace dialog box, such as Whole Word
    mode, are "sticky," which means they stay "clicked" until you change them or until
    you close the dialog box. When you select these items from the dialog box''s menu
    bar, you see a mark next to these commands if they''re "on."


    The capability to find a set of characters, even within words, is a useful feature.
    If you''re searching a document for discussions of reliability, reliable, for
    example, you may also want to find unreliability, reliable, or unreliable. You
    can find any of these words by entering reli (with the Whole Word option turned
    off) as the search text.


    # Getting picky about what you find


    Most of the time, you don''t much care what kind of sanity you find. Anything
    will do: Sanity, SANITY, sanity, sanity, or SANITY. Obligingly, the EditFind and
    Replace command normally ignores fine points, such as what uppercase and lowercase.


    If you''re picky about which typeface, size, style, or case you want, don''t give
    up — just put a Match to it. That is, you choose Match from the Find and Replace
    Text dialog''s menu bar. When you choose MatchCase Sensitive, Find pays attention
    to the uppercase or lowercase letters you type in the Find box and finds only
    versions of text that have been identically typed. WordPerfect reminds you about
    this feature by displaying Case Sensitive below the Find text box.


    When you choose MatchFont, WordPerfect displays the Match Font dialog box, which
    enables you to look for sanity in Helvetica, boldly, if you want. Check off what
    you want by pointing and clicking. Click OK when you finish.


    If you''re among the WordPerfect secret-code cognoscenti, be aware that you can
    also find codes. You can look for specific codes, such as Lift Mar and Bot. Mar,
    by choosing MatchCodes from the menu in the Find and Replace dialog box. If you
    would rather type a specific code, choose TypeSpecific Codes from the menu bar
    in the Find and Replace Text dialog box.'
