  md: '# Chapter 18: Spinning Web Pages


    # Putting your pages on the World Wide Web


    Although we talk a great deal preparing your pages for the chapter about preparing
    pages for the World Web, we don''t say what you have to do get your pages on the
    Web. That''s because the process varies from location to location. You generally
    have to find a Web server—a computer that''s connected to the Internet (or the
    intranet, if you are interested in distributing information around your organization).
    Then, it''s just a matter of putting your HTML files in the right place on the
    Web server.


    (internal web), contact your system administrator for it. Otherwise, you can still
    put your pages on the Web, by using one of many free Web-hosting services. Try
    GeoCities, at http://www.geocities.com, and follow the instructions on its Web
    site.


    If you use an Internet Service Provider (ISP) for your Internet account, it may
    give customers some space on its Web server. To transfer files to a Web server,
    you usually need a transfer program (FTP). Contact your ISP for help. If you work
    at an organization that has an


    In all likelihood, a local computer-systems junkie will have to do it because
    you are (or should be) careful about how their connects to the rest of the Web.
    We''ve thought a great deal about this subject, and Dave even so far as to write
    a book about it. If you want to know more, check out his book Perfect Publishing
    For Dummies (IDG Books Worldwide, Inc.). You may also want to invest in The Internet
    For Dummies, 6th Edition (IDG Books Worldwide, Inc.), which Margy co-authored.


    In addition to saving your Web page as an HTML file, Internet Publisher gives
    two useful factors for you:


    +   - Collects in one directory all the images (graphics files) and sound-clip
    files (if you know how to include audio files in the Web page) appear on your
    page: This capability is useful because one Web page can include images from all
    your computer. If you have to upload your Web page to a Web server, finding and
    copying the various graphics files can be a pain.


    +   - Makes the published version of the Web page look in the directory where
    it just collected the images: Otherwise, the codes in your Web refer to the old
    locations of the graphics files. When you upload the page to the Internet, you
    see error messages rather than graphics!


    The WordPerfect Internet Publisher tells you where it''s copying the files: The
    directory name appears in the Publish to HTML dialog box, just below the filename
    for the HTML file.'
