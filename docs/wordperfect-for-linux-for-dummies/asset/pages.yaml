  md: '# Chapter 4: Fooling with Blocks of Text


    # Copying between documents with the X Clipboard


    The X Clipboard is particularly useful for copying between documents. Because
    WordPerfect allows you to have more than one document open at a time, you can
    copy text in document A and paste it in document B. See Chapter 12 for more information
    about having more than one open at a time.


    A special place, the X Clipboard, can carry selected text and graphics when you
    copy, cut, and paste. The X Clipboard isn''t a visible thing in WordPerfect; no
    cute little Clipboard icon moves around. It''s just a sort of hidden storage area
    that is usable from many programs that run under the X Window System. If you''re
    used to Windows or Macs, you''ll be relieved to hear that the X Clipboard works
    much like the Windows and Mac Clipboards.


    # Copying and pasting with the X Clipboard


    Suppose that you are writing a contract for the Dingelhausen-Schitzenzenbaum Furniture
    Prefabrication Company and you''re already adverse to typing Dingelhausen-Schitzenzenbaum
    Furniture Prefabrication Company more than once. Copying and pasting saves your
    fingers and your sanity by enabling you to make multiple copies of Dingelhausen-Schitzenzenbaum
    Furniture Prefabrication Company all over you your contract. (Guess which feature
    was useful in writing in this paragraph?)


    To copy text, follow these steps:


    +   1. Select the text.

    2. Press Ctrl+C or choose Edit: Copy.

    3. Click where you want the new copy.

    4. Press Ctrl+V or choose Edit: Paste.


    When you press Ctrl+C, WordPerfect copies your selection to the X Clipboard. Because
    the text stays in the X Clipboard, you can paste as many copies as you want until
    you exit WordPerfect.


    WordPerfect is smart about including spaces after periods and commas that you
    cut or paste words and phrases. You may notice that it removes extra spaces after
    a comma and sometimes even inserts a space after a period. Way cool!'
