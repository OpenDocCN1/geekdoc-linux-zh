  md: '# How we talk about menus and commands in this book


    Because darn near every command in WordPerfect appears on a menu, submenu, or
    sub-submenu, saying "Click on Edit on the menu bar and then Select on the menu
    and then on Page the next menu" gets tedious. We say it this way in the early
    chapters of this book so


    that you get used to the idea. After, though, we just say "Choose Edit>Select>Page."
    It''s a little terse, but if we don''t do that way, you would be comatose with
    boredom by the end of a paragraph. Also, think of all the trees we''re saving
    by making this book shorter.


    # Choosing a command


    To choose a command from a menu, click on the command. Related commands are clumped
    together and separated from other command clumps by a line.


    You may find, in addition to the commands, other suggestive symbols — sort of
    like the little red dots to the hot stuff on a Chinese menu. This list shows what
    of those symbols mean:


    +   A little right-pointing triangle after the command: If you click on one of
    these commands, you see a submenu (The process is similar to choosing chicken
    and then being asked whether you want fried, roasted, or Sichuan.


    +   A box or diamond next to the command: The box means it''s already turned on.
    In Windows, these boxes contain Xs or check marks; in Linux, the boxes usually
    contain dots or squares.


    +   A key combination to the right of the command: You can give some commands
    by pressing a key or combination of keys. If you do, WordPerfect gives you a hint
    about which keys you would use, by displaying the key combination on the menu,
    to the right of the command. On the File menu, for example, the Save As command
    has the notation F3 to its right, which means you can press F3 to issue the command,
    thereby avoiding the menu bar! These key combinations are carryover from the Windows
    version of WordPerfect, and not all of them work.


    +   An ellipsis (...) after the command: The ellipsis tells you that the command
    has more to say, if you ask. If you click on it, the command gift-wraps its thoughts
    in attractive little dialog boxes, which are discussed in the following section.'
