    # A note to Microsoft Word users


    If you have used Microsoft Word, you may wonder whether the WordPerfect View Reveal
    Codes command has anything to do with the Field Codes command in Word. In a couple
    of words: not.


    Because Word doesn''t use codes for formatting, its Field Codes feature doesn''t
    show you anything about fonts, margins, page layout, and the like. Instead, the
    Word codes provide a way to include text that is under the control of the Word
    program


    Word program— today''s date, for example, which Word can update automatically.
    Some WordPerfect codes do this, (see Chapter 22 for to find out how to create
    a code that prints today''s date), although most don''t. As a result, coding in
    Word (by checking the Field Checks box on the View tab in the Tools→Options dialog
    box) shows you many fewer codes; many Word documents contain no codes.


    # Looking at codes


    Some codes contain much more information than you might think. You may see a Header
    A at the beginning of your document, for example; this code indicates that you
    have defined a header. To see more details about this code, place the cursor directly
    before the code. (Remember the cursor appears as a little red box.) Suddenly,
    the code expands until it says Header A: Every Page, Chocolate in the Workplace.
    Many codes contain more information than meets the eye; place the cursor in front
    of a code to see just what it says.


    # Modifying codes


    To change a code, try double-clicking on in the Reveal Codes window. This tells
    WordPerfect that you want to do something to the code, and WordPerfect tries to
    guess what that something is. If you use a dialog box to insert the code in the
    first place, WordPerfect displays the same dialog box again. If you double-click
    on a Para Spacing code, for example, WordPerfect pops up the Paragraph Format
    dialog box, which displays the values you specified when you created the code.
    (This feature is rather useful.) If you change the information in the dialog box
    and then click OK, WordPerfect updates the code to match.'
