  md: '# Typing Something


    WordPerfect is completely different from a typewriter in many ways, although in
    one way, it''s the same: To enter some text, you just start typing.


    If you make a mistake or change your mind about the wording, move the cursor (the
    slowly blinking vertical line that shows where you''re typing) to the text you
    want to change; then change it. You can use either the mouse or the keyboard to
    get that cursor moving. (Chapter 2 explains ways to move the cursor around.)


    All the regular keys on the keyboard — the letters, numbers, and punctuation —
    enter characters onscreen when you press them. The rest of the keys — the function
    keys (F1 and its friends), Enter, Insert, Delete, and all the keys with arrows
    on them — do not enter characters. Those keys do something else, and we will tell
    you what each key does as we get to it.


    Normally, WordPerfect is in Insert mode, which means that whatever is typed into
    the text. If the cursor is between two letters and you type a new letter, the
    new one is inserted between the two original letters.


    To type a bunch of capital letters, press the number keys above the Caps (but
    don''t hold) the Caps Lock key. Now whatever letters you type are capitalized.
    To turn off Caps Lock, press the Caps Lock key again. Unlike the shift key, Caps
    Lock doesn''t have the slightest effect on numbers or punctuation — only on letters.


    If you want to type numbers, you can press the number keys above the QWERTYOP
    row, or you can use the numeric keypad, which is the group of number keys on the
    right side of the keyboard. Watch out, though: You can also use the numeric keypad
    to move the cursor. (See Chapter 2 to learn how to determine when these keys do
    what.)


    If you want to delete a letter or two, you can usually move the cursor just after
    the letters and then press the Backspace key to wipe out. Your Linux system may
    be set up so that the Backspace key works just like the Delete key: If so, move
    the cursor just in front of them and press the Delete key. Same difference — the
    letter disappears. See Chapter 5 to find out how to delete larger amounts of text.


    Chapters 2 and 3 contain lots of information about using the keyboard and the
    mouse to do things in WordPerfect.'
