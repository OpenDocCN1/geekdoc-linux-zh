  md: '# 326 Part IV: Creating Documents That Don''t Just Sit There


    cursor on the hypertext link (that''s the word in blue) — don''t click on the
    link because that action takes you to the bookmark to which the link is linked
    (Chapter 1, in our example in this chapter). Instead, click near the link and
    press the cursor-movement keys to move the cursor to the link. Look at the Property
    Bar: It changed. Figure 18-3 shows the Property Bar when its mind is on hyperlinks.


    # Figure 18-3: The Hyperlink Tools Bar.


    | Perform | Edit |

    |---|---|

    | Font Next Style |

    | Previous Links On/Off |

    | Delete |


    Because the Property Bar is the easiest to care for and feed your hypertext links,
    getting to know its buttons is your time:


    +   **Font-selection box:** Sets the font for the link. Strangely, the font is
    a property of your hyperlink even though its other text properties, like bold
    and italics, aren''t. We prefer to format our text by choosing the Format+F command.


    +   **Perform:** Follows the link, the same as clicking on a link, although links
    don''t work when they''ve been deactivated (the Links On/Off entry, later in this
    list). The Perform button works regardless.


    +   **Previous:** Finds the last hypertext link before your current position in
    the document.


    +   **Next:** Finds — you guessed — the next hypertext link after your current
    position in the document.


    +   **Delete:** Deletes the hypertext link associated with the text you have highlighted
    and turns your text back into regular text. Because it''s regular text now, the
    Hyperlink Tools Property Bar disappears and the former old text properties take
    its place.


    +   **Edit:** Displays the Hyperlink Properties dialog box, in case you want this
    link to go anywhere else. It''s the same as choosing the Tools+Hyperlink command.


    +   **Links On/Off:** Activates or deactivates all links in the document. You
    don''t want your links "turned on" all the time. That would make you a pain in
    the neck to edit. (You may click on a link, thinking that you''re going to select
    it, and instead, Word displays the document to the link points. That wouldn''t
    be useful!) That''s why your lines are originally turned off when you'
