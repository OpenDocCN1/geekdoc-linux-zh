  md: '# 16 Part I: Introducing WordPerfect for Linux


    Scroll bar


    ![](img/a2afb402c275cfc5e5a8f62356a922ef_45_0.png)


    Figure 1-6: The WordPerfect document window.


    The following list describes lots of stuff around the edges that may not be familiar
    to you:


    +   - **Title bar:** Displays this line at the top edge of the window: WordPerfect
    [Document1 - unmodified] (Current). It tells you the name of the document you
    are editing and reminds that you are, in fact, running WordPerfect (more about
    documents anon). The [unmodified] part tells you that you haven''t typed anything
    yet, and the (Current) part means that this window is the one you are working
    in, which is useful information if you have more than one document open.

    - **Menu bar:** The row of words just below the title bar. Each word is a command
    you can choose. Later in this chapter, we tell you how to use a command to close
    WordPerfect. We talk more about commands in Chapter 2.

    - **Toolbar:** Made up of a row of **buttons** (the gray boxes) below the menu
    bar. The buttons usually have little pictures on them. Later in this chapter,
    use some of these buttons to save and print a document. If you don''t see the
    Toolbar onscreen, use the following powerful incantation to make it appear: *Click
    on the word View on the menu bar and then click on the word Toolbar* on the menu
    that appears. When you see the Toolbar dialog box, make sure that the WordPerfect
    8 box on the list that appears onscreen is selected (looks pushed in or contains
    a black dot) and click on OK. We explain more in Chapter 2 about using commands
    and in Chapter 19 about determining what you want to see onscreen.'
