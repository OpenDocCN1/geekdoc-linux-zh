    box. Click on Data File and specify a new data file or a new address book and
    click on OK.


    # Merging Your Files


    After you have a data file and a form file, you''re ready to merge. We know, folks,
    that this explanation is taking awhile if you''re following along with all the
    procedures we show you in this chapter; if you have a large number of letters
    to send, though, it''s worth it. Here we go.


    Call the post office and tell them to stand back before you follow these steps:


    +   1. Choose Tools Merge and then click on the Merge button.


    WordPerfect displays the Perform Merge dialog box, as shown in Figure 16-9.


