  md: '# Part III: Things You Can Do with Documents


    # Moving, Renaming, Copying,

    and Deleting Files


    Exactly, can you name a file? Linux filenames can be as long as you want, although
    you should avoid special characters (such as *, &, and !) spaces. Not being able
    to use spaces can occasionally cram the style of those used to Windows or Macintosh
    systems. Because Linux systems get to using periods or underscores to take the
    place of spaces, you often see filenames like cookie_recipe.wpd or letter-to.diane.wpd.
    The .wpd extension for WordPerfect for Linux is optional, but a good idea because
    it helps you recognize files are WordPerfect documents.


    To move, copy, or delete a file, start with these steps:


    +   1. Open the File Manager (or similar) dialog box by choosing Program:File
    Manager or File:Save As or File:Open.

    2. Find the file you want to move, copy, or delete.

    Double-click on a directory name in the Directory List to enter a directory. Make
    sure that the directory name doesn''t stay highlighted. If it does, double-click
    on . Current to clear the highlighting.

    3. Highlight the filename by single-clicking on it in the File List box.

    Don''t double-click on the filename; that method tries to either save or open
    the file, depending on which dialog box is displayed.


    Follow the steps in one of the following three sections to move, rename, copy,

    or delete the file you selected.


    # Moving or renaming a file


    To move a file, follow these steps after you''ve finished Steps 1–3 in the preceding
    section:


    +   1. Choose Files:Move/Rename from the dialog box menu.

    nYou see the Move/Rename dialog box, with the file''s current pathname.

    2. Enter the destination or new filename.

    Type the path and filename to which you want to move the file. You can also edit
    the pathname that WordPerfect already displays. If you want to move the file,
    the path to a different directory from the one in which the file is stored. If
    you want the file to keep the same name, type the same name. If you want to rename
    the file, type a different name.

    3. Click on OK.'
