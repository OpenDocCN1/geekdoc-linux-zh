    # Creating a link to another Web page


    The distinguishing hallmark of the World Web is the linking from page to page
    that enables you to explore the connections between different pages as you discover
    them. For, our page has no links on it.


    While you''re editing Web pages, WordPerfect makes adding a link to a Web page
    on the World Wide Web easy. All you do have to type the Web address of the page
    you want to link to; for example, our Internet Guru Web site, at net.guru.com
    or the Great Tapes for Kids site, at www.greattapes.com recognizes what you type
    as a Web address and automatically turns it into a link to address. This trick
    is rather neat. It works for Web addresses that start with http://www (both are
