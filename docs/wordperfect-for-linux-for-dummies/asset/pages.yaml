    # Creating Graphs and Charts


    With WP Draw, you can create a variety of data charts, including pie, bar, line,
    and other forms. Put it this way. If you filled a gymnasium with economists, gave
    them colored pens and rulers, locked the doors, and went back in years, WP Draw
    could have more graphing done than those guys could do during that time. (If you
    had let them, they may have had a fighting chance, of course, why pass up such
    an opportunity?)


    # Making a new chart


    To create a chart in your document, choose Insert>Graphics>Chart. A chart and
    a Datasheet, with some figures in rows and columns in it, obligingly appears in
    the good old WP Draw window, as shown in Figure 15-6. The Datasheet is a sort
    of spreadsheet or table where you put the data you want to chart. WP Draw draws
    the chart automatically from the data.'
