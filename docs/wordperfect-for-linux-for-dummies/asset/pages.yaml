  md: '# 198 Part III: Things You Can Do with Documents


    # If your printer doesn''t know how to print on both sides


    If your printer knows only how to print on one side of the paper, WordPerfect
    can still help you use both. Although you have to take more steps, it''s doable:
    First, you print all the odd pages, and then you turn the paper over, stick it
    back in the printer, and print all the even pages on the backs of the odd pages.
    With luck, the right pages are back-to-front! Voilà — two-sided printing. Try
    this system with a small document first.


    Here are the steps for manual, two-sided printing:


    +   1. Make sure that your printer is eager to print.

    Also make sure that the paper you plan to use is blank on both sides.


    +   2. Click on the Print button on the toolbar.

    Alternatively, press F5 or choose File>Print. You see the Print dialog box.


    +   3. Click on the Output Options button.

    WordPerfect displays the Output Options dialog box, as shown Figure 11-4.


    ![](img/a2afb402c275cfc5e5a8f62356a922ef_227_0.png)


    Figure 11-4: WordPerfect has some fancy printing options.'
