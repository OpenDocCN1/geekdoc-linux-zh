  md: '# Adjusting the Top and Bottom Margins


    After WordPerfect knows the size of your paper, it has opinions about your margins.
    Unless you tell WordPerfect otherwise, it assumes that you want 1-inch margins
    all the way around the page, measuring from the edge of the paper. We generally
    find this measurement for our tastes, and we usually change it — a little too
    airy and spacious unless we''re ready to write by the page, of course.


    To change the left or right margin, refer to Chapter 7, which explains how to
    use the ruler, guidelines, or Margins dialog box for this.


    To change the top or bottom margin, follow these steps:


    +   Move the cursor to the point at which you want the new margins to take effect.


    To change the top or bottom margin for the entire document, move to the beginning
    of the document by pressing Ctrl+Home. To change the margin beginning at a page
    other than page 1, move to the top of that page.


    +   Display the Margins dialog box by choosing Format: Margins.


    If you want to see a picture of the Margins dialog box, turn to Chapter 7 and
    check out Figure 7-3. You don''t have to, though; it''s just a small dialog box
    with entries for Left, Right, Top, and Bottom margins.


    +   Fill in the measurements for the top and bottom margins and then click on
    OK.


    The little page diagram shows you how the page will look


    As an alternative, you can put the cursor where the changes should take effect
    and then change the top and bottom margins by clicking on and dragging the guidelines.


    When you change the top or bottom margin, WordPerfect inserts a secret Top Mar
    or Bot Mar code in the top of the text at the current page. See Chapter 9 to find
    out how to fool with these codes.


    ![](img/a2afb402c275cfc5e5a8f62356a922ef_161_0.png)


    ![](img/a2afb402c275cfc5e5a8f62356a922ef_161_1.png)'
