  md: '# # Chapter 1


    # # WordPerfect Basics


    **In This Chapter**


    +   * Determining which window manager you have

    * Starting WordPerfect

    * Looking at the WordPerfect windows

    * Checking out the Application Bar

    * Typing your text

    * Naming files

    * Getting help

    * Editing a file that has already been created

    * Creating a new file

    * Printing a document

    * Leaving the program


    In this chapter you gets using WordPerfect by showing you how to perform the Big
    Five word processing operations: Get the program (WordPerfect) running, type some
    text, save the text in a file on disk, open the file again later, and print the
    file. If you read to the end of this chapter, you will know how to coax WordPerfect
    into performing these five operations. In later chapters, we get into some refinements,
    such as editing the text after you type it or making it look a little spifier.


    First, the basics.


    # # Which Window Manager Do You Have?


    If you use a mouse with Linux, you''re using the X Window System (also known as
    simply X) and a window manager. A window manager is the program that draws the
    borders, title bars, and buttons around all your windows. Strictly speaking, window
    managers don''t have anything to do with WordPerfect.'
  merge: -1
