  md: '# Chapter 17: Recipes and Templates for Popular Documents


    ![](img/a2afb402c275cfc5e5a8f62356a922ef_326_0.png)


    +   4. If Wordprompt you for information, enter it and click on OK.


    You''re ready to start entering text. If the template includes your name or address,
    the information you entered in the Personal Info dialog box appears in the template
    automatically. (Way cool!)


    When you save the new document, you have to give it a name, just as though you
    were saving a document you wrote from scratch.


    # Letters


    Unless everyone you know has switched over to e-mail, chances are that you do
    a great deal of letter writing with WordPerfect. What''s a word processor for,
    after all, if not to make tasks like that one quick and easy? Word processing
    should let you concentrate on your sterling prose and not on the position of the
    inside address. Look through the following pointers on how to get WordPerfect
    to lay out a letter you like it. Then save all this work so you have to do it
    only once.


    # Getting WordPerfect to write your letter for you


    We used to say that, with all the wonders of word processing, you still have to
    pick what words you want to process. (We used to call that writing; but it''s
    a new millennium.) You can let WordPerfect set up the letter for you, however,
    so that you have nice headers and footers with things like the date and page numbers
    in them. You can then modify the letter to suit your fancy. Here''s how to get
    WordPerfect to do the writing and formatting for you:'
  merge: -1
  pgno: 326
- img_proc: true
  md: '# 298 Part IV: Creating Documents That Don''t Sit There


    1. In a document window, choose File-ExpressDocs from the menu bar.


    (If no document window is open, open one by choosing Program-Open Window from
    the program window.) WordPerfect shows you its list of templates.


    2. Scroll down the list of templates until you see Letter - Traditional centered
    company name at top on the list of templates.


    We use the traditional letter for this discussion, although in real life it doesn''t
    matter which one you pick. They work pretty much the same way.


    3. Double-click on the kind of letter you''re creating.


    As usual, you can single-click on your choice from this list, and then click Select.
    In either case, be patient because WordPerfect has a great deal on its mind for
    you. For example, it needs to know the name of the recipient of your letter, and
    it prompts you for this information.


    4. Type the recipient''s name in the dialog box and click on OK or press Enter.


    WordPerfect asks all the questions it needs in order to create the letter. Fill
    in each dialog box as it appears and click on OK or press Enter to the next dialog
    box. After gathering all the needed information, WordPerfect displays your letter.


    5. Type the information you want in the body of the letter.


    Hey, WordPerfect can''t do everything! You still have to type the message you
    want to send. When you''re done, save and print the letter as usual.


    Congratulations! You''ve composed a letter (with a little help from WordPerfect).
    Take a look at the tips in the following section to tweak your letter so it''s
    just right.


    # Printing your own letterhead


    If you''re looking at a tasteful letter (and you should be, if you''re following
    along in this chapter), you may decide that you want WordPerfect to create a letterhead
    directly on your letter for you. That way, you can write letters from each of
    your split personalities and not have to use preprinted letterhead for each one.
    Using the many fonts, lines, boxes, and other effects in WordPerfect, you can
    create a snappy letterhead; Take a look at Chapters 14 and 15; most of what''s
    in these two chapters makes good material for letterhead. Remember to save and
    often while you''re getting your letterhead to look the way you want it. After
    you create a letterhead you like, save it as a template (see the section "Saving
    your letter as a prototype document," a little later in this chapter) so that
    all your letters can include it automatically.'
