  md: '# 126 Part II: Prettying Up Your Text


    Figure 7-5: Formatting a bunch of paragraphs so that their first lines are indented.


    ![](img/a2afb402c275cfc5e5a8f62356a922ef_155_0.png)


    +   3. In the First Line Indent box, enter the amount (usually about half an inch)
    by which you want to indent each first line.

    4. Click on OK or press Enter.


    Voilà! WordPerfect adds that little bit of white space at the beginning of each
    paragraph, just the way your teacher taught you. Look, Ma—no tabs!


    Another way to display the Paragraph Format dialog box is to right-click on the
    margin strip on the ruler and choose Paragraph Format from the QuickMenu that
    appears.


    Whether you choose to use tabs or paragraph formatting, don''t use spaces to indent
    paragraphs. In word processing circles, this method is considered tacky. The problem
    with spaces is that they''re different widths, depending on which font you use
    (refer to Chapter 6 for information about fonts). Tab stops are exactly the width
    you see on the ruler.


    The advantage of using tabs is that if you decide to indent paragraphs by a different
    amount, all you have to do is slide that first tab stop over a hair. Then all
    the tabs that depend on tab stop move, too. When you perform this procedure, be
    sure that the cursor is in the right place: at the beginning of your document
    (assuming that you want to change the look of all the paragraphs in it).


    Whenever you use a tab to indent a line, you should have pressed Enter to the
    preceding line. In other words, the line you''re indenting shouldn''t begin as
    a result of WordPerfect''s use of word wrap to fill the lines of a paragraph.


    To indent all lines in the paragraph or all except the first, refer to the section
    "Changing margins for a paragraph or two," earlier in this chapter. Never stick
    a tab at the beginning of each line of a paragraph. Yuck! Ptoey if you do, when
    you edit the paragraph later, the tabs will be all over the place, and your paragraph
    will have unsightly gaps in all the wrong places. Please indent.'
