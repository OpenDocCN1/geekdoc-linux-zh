  md: '# Chapter 13: Juggling Files on Your Disk


    The Viewer window stays open as you pick your way through your files. If you select
    an unreadable file (such as a program), WordPerfect just says that it''s an unknown
    file type. When you''re all done with the Viewer window, click on the Close button.


    # The QuickList


    Depending on how organized you are, you may find some documents are buried several
    layers down in directories. For example, your business letters may be buried in
    the directory /home/hpotter/documents/letters/current/business, and you''ll probably
    get tired of clicking all the way down every time you want to open a letter.


    The WordPerfect QuickList is just what you need to save all that you wear and
    tear on your mouse button. The QuickList lets you make shortcuts to commonly used
    directories.


    To display the QuickList, click the QuickList button in the lower-right part of
    the File Manager, Save As, or Open dialog box. WordPerfect displays the QuickList
    pane, as shown in Figure 13-3. It''s somewhat small because it''s sharing space
    with the Directory List. (You can make the Directory List go away temporarily
    by clicking on the Directory List button.) The QuickList begins by displaying
    only one shortcut named Documents.


