- img_proc: true
  md: '# 262 Part IV: Creating Documents That Don''t Sit There


    When you want to save a document that contains boxes, WordPerfect (and we) can
    get confused about what you want to save. When a graphics box is selected and
    you try to save only your document, WordPerfect thinks you want to save only the
    graphic, in a separate file! Before saving a document that contains boxes (or
    text boxes, which we describe in Chapter 14), therefore, be sure that the box
    is not selected (doesn''t have little black handles around it).


    ![](img/a2afb402c275cfc5e5a8f62356a922ef_291_0.png)


    # Working with Graphics


    You need to know a few basics before we jump into the subject of working with
    graphics:


    +   - All pictures live in boxes.

    - We talk a great deal about this subject in Chapter 14. If you haven''t read
    it, take a look at the section there about working with text. Pretty everything
    we say about text boxes applies to all pictures also. That''s why we spend so
    much time talking about them. Who cares all that we talk about text boxes, anyway?

    - All boxes have borders and backgrounds.

    - That''s why we talk about them in Chapter 14, in the first section.

    - You can select boxes along in your text and click on a box, you see black handles
    (little boxes along the borders and corners of the box) and no border around the
    box (unless the box itself has one). When you see black handles, as in Figure
    15-1, the box is selected.


    Figure 15-1 Graphics appear in boxes when you select them for editing.


    ![](img/a2afb402c275cfc5e5a8f62356a922ef_291_1.png)


    ![](img/a2afb402c275cfc5e5a8f62356a922ef_291_2.png)'
