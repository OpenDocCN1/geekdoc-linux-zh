- img_proc: true
  md: '# Chapter 15: Say It with Pictures 273


    ![](img/a2afb402c275cfc5e5a8f62356a922ef_302_0.png)


    Figure 15-6: Creating a data chart in WordPerfect.


    # # Editing your chart


    When you insert a new chart, WP Draw gives you a bar-chart example to begin. You
    can easily change to another kind of chart, if you want, and then substitute your
    own data for the example data.


    You can learn a great deal about how WP Draw charts data by examining the Datasheet
