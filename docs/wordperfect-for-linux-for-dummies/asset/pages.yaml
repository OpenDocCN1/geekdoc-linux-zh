  md: '# Switching between open documents


    How do you get back to the document you opened first? If it''s still visible,
    you can just click in its window with your mouse. If your desktop looks like Figure
    12-1, though, and you can''t find the window? Aha! — the command on the menu bar
    is the solution. When you choose Window, you see a menu that contains five commands
    (Cascade, Tile Top to Bottom, Tile Side by Side, Minimize All, and Close All),
    followed by a numbered list of documents you have. To switch to another open document,
    just choose its name from the menu.


    ![](img/a2afb402c275cfc5e5a8f62356a922ef_234_0.png)


    To switch documents without using the mouse, press Alt+W to open the Window menu.
    Press the cursor keys to scroll down to the name of the document you want and
    press Enter.


    # Making baby documents


    When you want to begin writing something new, you need a brand-spanking new document
    with no text in it. No one ever told you how baby documents are made? It''s about
    time you learned the Facts of Life. You can create a new document from the program
    window or a document window.


    To make a new document, either click on the New Blank Document button (the first
    button) on the toolbar in a document window , or choose ProgramNew Window from
    the program window. (You can also choose FileNew Window from the document menu,
    although this method opens your baby document into the existing window rather
    than making a new window for it.) WordPerfect makes the new document something
    wild and crazy, as Document2, and makes a window for it. You can give the new
    document a better name when you save it. When WordPerfect opens a new document
    in an existing window, the (after prompting you to save changes, of course).


    ![](img/a2afb402c275cfc5e5a8f62356a922ef_234_1.png)


    You can also create a new document in a new window by pressing Ctrl+N—this keystroke
    works in either the program window or a document window.


    # Closing the curtains


    When you finish working on a document, don''t leave it lying around open. Each
    open document slows WordPerfect just a little. To close the window that contains
    a document, click on the window''s Close button (usually an X in the upper-right
    corner of the document window, although it varies depending on which window manager
    you''re using) or choose File+Close.'
