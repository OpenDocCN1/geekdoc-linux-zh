  md: '# 12 Part I: Introducing WordPerfect for Linux


    Because those windows include WordPerfect windows, however, sooner or later you
    need to interact with your window manager in the course of with WordPerfect.


    Unlike some other operating systems we could name (like Windows or the Mac), Linux
    doesn''t have a one-size-fits-all look and feel to its windows. Instead, your
    window''s colors, style, and buttons depend on which window manager happens to
    be running. (Whether this is a Good Thing is open to debate.) Although lots of
    different window managers run under Linux, you''re likely to run into only a few.


    Here are the four most common window managers:


    +   - KDE, or K Desktop Environment: More than just a window manager, a desktop
    environment that includes its own window manager (see Figure 1-1).


    +   - Enlightenment: The default window manager for the GNOME desktop environment
    (see Figure 1-2).


    +   - WindowMaker: The alternative window manager for the GNOME desktop-top environment
    (see Figure 1-3).


    +   - FVWM: Used to be the most common window manager for Linux; has now become
    scarcer in favor of newer, spiffier window managers (see Figure 1-4).


    To tell the difference, compare the title bar and buttons that run along the top
    of the windows.


    ![](img/a2afb402c275cfc5e5a8f62356a922ef_41_0.png)


    ![](img/a2afb402c275cfc5e5a8f62356a922ef_41_1.png)'
