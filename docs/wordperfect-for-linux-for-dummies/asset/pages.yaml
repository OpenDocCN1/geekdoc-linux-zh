    # # Creating Your Own Web Pages


    Creating your own Web page is pretty much like creating any other Word document.
    Web pages are a little more structured than your average document. That is, they''re
    all supposed to have a title and headings and some information about however,
    who prepared the page. As the World Wide Web has grown, some conventions have
    become less and universal, until a Web page can now be pretty anything. You''re
    still constrained, though by some of the original ideas about what *ought* to
    be on a Web page. We explain in more detail how we show the Property Bar for editing
    Web pages. Figure 18-4 illustrates a simple Web page with some text on it.


    ![](img/a2afb402c275cfc5e5a8f62356a922ef_356_0.png)


    **Figure 18-4:** A simple Web page.'
