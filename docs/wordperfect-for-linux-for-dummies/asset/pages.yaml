  md: '# # WordPerfect For Linux For Dummies Cheat Sheet


    # ## Kommon Kwick Key Kombinations


    These key combinations help you manage your files and text:


    | Press This | To Do This |

    |--- |---|

    | Ctrl+C | Copy to Clipboard |

    | Ctrl+X | Cut to Clipboard |

    | Ctrl+V | Paste to Clipboard |

    | Ctrl+S | Save document |

    | F3 | Save with new name |

    | Ctrl+Shift+S | Save all documents |

    | Ctrl+P or F | Print a document |

    | Ctrl+D or O | Open a document |

    | Shift+F4 | Start a new document |

    | Ctrl+B | Apply boldface |

    | Ctrl+I | Apply italics |

    | Ctrl+U | Apply underlining |

    | Ctrl+F | Find or replace text |

    | F9 | Open the Font dialog box |

    | Ctrl+G | Change capitalization |

    | Ctrl+K | Insert weird characters |

    | Ctrl+Enter | Insert today''s date |

    | Ctrl+Shift+D | Insert a code that always displays the current date |


    # ## Helpful Tips


    +   - Tell WordPerfect what you have in mind. Never type page numbers yourself,
    use lots of tabs to create a table, or type multiple columns of text yourself.
    Instead, use the method of WordPerfect features, such as page numbering, tables,
    and columns.

    - Save your documents by pressing Ctrl+S. To open all documents, press Ctrl+Shift+S.

    - To see (or delete) the secret codes in your documents, view>Reveal Codes from
    the menu bar. Use the same command to close the Reveal Codes window.


    # ## Getting Around in Your Document


    The following keys move the cursor around your screen:


    | This Keystone | Moves You Here |

    |--- |---|

    | ↑ | Up one line |

    | ↓ | Down one line |

    | ← | Left character |

    | → | Right one line |

    | Ctrl← | Left character |

    | Ctrl→ | Right one line |

    | Home | Beginning of the line |

    | End | End of the line |

    | PgUp | Top of the screen or one screen |

    | PgDn | Bottom of the screen or down one screen |

    | Ctrl+Home | Beginning of the document |

    | Ctrl+End | End of the document |


    # ## Recovering from Errors


    If you don''t like what''s going on,


    Press Ctrl+Z


    If you have just deleted something and you want it back,


    Press Ctrl+Z


    If you have just given a command and you want to undo it,


    Press Ctrl+Z


