  md: '# 3. Select the Font Face, Font Size, and Font Style.


    The settings in this dialog box look and act like the ones in the Font dialog
    box.


    # 4. Click on OK or press Enter to close the dialog box.


    WordPerfect changes the font for all the text in the document, except where you
    formatted a section of text by using the Font dialog box or the Font Face, Font
    Size, Bold, Italic, or Underline buttons on the Property Bar.


    # Copying Character Formatting


    After you have formatted some text the way you want it, you can tell WordPerfect
    to format some other text the same way (Very useful!) WordPerfect calls this feature
    QuickFormat. These steps show how to use it:


