  md: '# Chapter 7: Sensational Sentences and Poignant Paragraphs 111


    You can use the same Ruler command to get rid of the ruler later, when you finish
    with it.


    # What are all those little triangles?


    The ruler packs a great deal of information about margins and tabs into a small
    space. It''s made up of the following two horizontal strips with accompanying
    black gizmos:


    +   - Margin strip: A thin, horizontal strip above the numbered-inches part of
    the ruler that shows you the margins. The black gizmos at the left and right ends
    of the white part of this strip show the positions of the left and right margins.
    The gray parts at the left and right ends of the ruler are outside the margins.
    If you look carefully at the black gizmos, the outer part of each gizmo shows
    the margins for the document and the little inner triangles show the position
    of paragraph format margins, which are separate margins you can set for each paragraph.
    (You probably won''t need them, so don''t worry if you can''t tell one part of
    the gizmos from another; instead, see the section "Changing margins for a paragraph
    or two," later in this chapter.)

    - Tab strip: A thin, horizontal strip below the numbered part of the ruler that
    contains little triangles. The triangles show the positions of the tab stops.
    A tab stop is the position across the line where the cursor moves when you press
    the Tab key.


    # What''s the ruler for?


    The ruler shows you margin and tab settings that are in effect wherever the cursor
    is right now (not the mouse pointer, which is the pointy arrow, but rather the
    cursor, which is the blinking vertical line). You can set the margins, tabs, and
    other line formats at the beginning of your document, and you can change them
    throughout the document. If you want to include a long quotation in an article
    you''re writing, for example, you can choose to indent only the paragraphs that
    make the quotation.


    In addition to showing you the current positions of margins and tabs, the ruler
    can help you change them — you can use the mouse to drag the margin gizmos and
    tab triangles around onscreen. In the rest of this chapter, usually tell you (at
    least) two ways to perform each formatting task: one by using a menu or pressing
    a key and the other by using the ruler. You can decide which method you prefer;
    WordPerfect doesn''t care which one you use.'
