  md: '# Chapter 11: On Paper at Last: Printing Stuff 197


    # Printing on Both Sides of the Paper


    Printing documents on both sides of the paper, such as in a book, is cool. This
    method not only makes your document look terribly awful but also marks you as
    an Ecologically Sound Person, which is important in this day and age. If you want
    to print your document on both sides of the paper (duplex printing) but your printer
    doesn''t do that automatically, don''t worry — you''re not out of luck. Your green
    reputation doesn''t have to suffer.


    # If your printer can do two-sided printing


    If your printer knows how to do two-sided printing (some laser printers do), you
    need to tell WordPerfect that you want to print on both sides of the page. To
    set up two-sided printing on your printer:


    +   1. Choose Format:Page:Page Setup:Two-Sided Printing.

    You see the Two-Sided Printing dialog box, as shown in Figure 11-3.

    2. Select the side of the paper that will be bound (usually the left side) and
    the amount of space to allow for binding. Click the Duplexing button and select
    one of the Edge options from the drop-down list.

    The From Long Edge option sets the binding for the long edge of your paper, and
    it''s the option that''s used most often. Don''t worry if you''re not going to
    bind your document; WordPerfect just needs to know where the edge would be if
    you were going to bind it.


    ![](img/a2afb402c275cfc5e5a8f62356a922ef_226_0.png)


    +   3. Click on OK to leave the Two-Sided Printing dialog box.


    Now, when you print, your printer prints on both sides of the paper automically!'
