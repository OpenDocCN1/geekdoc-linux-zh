  md: '# 130 Part II: Prettying Up Your Text


    # An art lesson: Portraits and landscapes


    We interrupt this book for a brief lesson on art — specifically, on the shapes
    of paintings. as the basis for naming the way text is printed on paper. If you
    hold the paper so that it''s taller than it is wide and then print lines of text
    that run across the short way, it''s called portrait orientation. This is the
    normal, everyday way to use paper. If, on the other hand, you turn the paper sideways
    so that it''s wider than it is tall and then print on it accordingly, you have
    landscape orientation. Toddlers usually use paper this way, in our experience.


    As you have noticed from your extensive experience in art galleries, pictures
    of people tend to be taller than they are, make room to include a complete hat-to-color
    portrait. Places of places tend to be wider than they are so that they can include
    more landscape and less sky.


    The many art lovers among the computer scientists of the world decided to use
    this situation


    ![](img/a2afb402c275cfc5e5a8f62356a922ef_159_0.png)


    If you don''t mention anything about paper, WordPerfect probably assumes you''ll
    use the usual: letter-size paper you stick in the printer in the usual way. If
    you plan to print on the paper sideways (landscape orientation), however, or if
    you plan to use legal-size paper, envelopes, or whatever, you had better tell
    Word about it. Otherwise, you may run into trouble with your margins.


    To tell Word about the size of the paper on which you plan to print your document,
    follow these steps:


    +   1. Move the cursor to the beginning of the document by pressing Ctrl+Home.


    Because paper size is something that usually applies to an entire document, set
    the cursor right at the beginning.


    +   2. Choose File>Page SetupPage Size.


    WordPerfect displays the Paper Size dialog box


    +   * A4 (European paper, a tad bigger than American letter size)

    * Envelope COM10 (a regular business envelope)'
