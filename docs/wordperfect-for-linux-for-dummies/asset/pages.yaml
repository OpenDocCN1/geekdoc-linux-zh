  md: '# 100 Part II: Prettying Up Your Text


    # # Making Text Larger or Smaller


    Sometimes, you want to make your text big, big, big. For a headline or the title
    of a report, you may want to make a nice, big, centered title. We discuss centering
    in Chapter 7; for now, these steps show you how to make text big:


    +   1. Select the text for which you want to change the size.

    nYou usually select an entire line when you change font size because a line with
    letters of different sizes usually looks strange.


    +   2. Click on the Font Size button on the Property Bar.

    It''s the button that says something like 12, for 12-point type. A little menu
    of font sizes drops down from the bottom, showing the available sizes. (We talk
    about it in the next section.)


    +   3. Pick a size by clicking on it.


    You can also set text back to its original size. Select it again, click on the
    Font Size button again, and select the same size you used for the surrounding
    text.


    What size is the text you''re already using? The leftmost items on the Property
    Bar show the font and font size.


    Depending on which font you''re using, text looks larger or smaller. For example,
    10-point Helve-WP (Helvetica) looks much larger than 10-point Roman-WP works.
    Luckily, you can see how things look onscreen and make adjustments as necessary.


    Only rare situations call for type that''s smaller than 7 points high. The size
    of onscreen type doesn''t necessarily reflect the size it will be on paper, so
    try printing your document before setting type sizes. Have pity on us aging readers
    and don''t make your type too small.


    If you plan to fax your document, make the text a little larger than usual—12-point
    faxes. Faxes always look grainy, so they''re much more readable if the type is
    large.


    ![](img/a2afb402c275cfc5e5a8f62356a922ef_129_0.png)


    # What are these sizes measured?


    | Text sizes are measured in points, which is an old-fashioned term that predates
    not word processors and computers but also typewriters. Most normal text is 10
    or 12 points. There are 72 points to an inch, so 12-point text is | 6-inch (½).
    If you''re formatting a title, make it 14 or 18 points. | Don''t ask us why they''re
    called points; Encyclopedia Britannica probably knows. |'
  merge: -1
