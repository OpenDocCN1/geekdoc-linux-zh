  md: '# Chapter 5: Text Improvements


    Find and Replace has five options, which you can check out by choosing Options
    from the menu bar in the Find and Replace Text dialog box:


    +   - **Begin Find at Top of Document**: Unless this option is checked, WordPerfect
    starts looking for what you''re trying to find at the place you are in the document.
    That''s usually what you want, if you want to make sure that you''ve found the
    first place your text appears in your document, click on Begin Find at Top of
    Document.

    - **Wrap Text at Beg./End of Document**: It''s what WordPerfect does: It searching
    where you are in the document, and when it gets to the end, continues searching
    from the beginning. That way, if what you''re looking for appears *before* the
    place where you are in the document, you''ll find it anyway. WordPerfect is smart
    enough to know where it started so that after it loops around to the beginning
    of the document again, it stops when it finds the last occurrence of your text
    before the place where you started searching.

    - **Limit Find Selection**: Often you are interested only in looking for text
    in a particular part of your document, such as the current graph. If you select
    the text you want to in, you can use this option to tell WordPerfect to look there.
    This option is particularly useful if you have a really long document.

    - **Include Headers, Footers, etc. in Find**: Normally, WordPerfect looks through
    things as headers, footers, footnotes, and other stuff that doesn''t exactly appear
    in the body of a document when it''s searching for text. (What?) You don''t know
    what headers and footers are? Take a peek at Chapter 8.) If for some reason you
    don''t want WordPerfect to look at that stuff, you know what to do: Click on this
    menu item to turn off this option.

    - **Limit Number of Changes**: We get back to this one when we talk about finding
    and replacing text, just ahead.


    After you return to the document, you may want to return to where you were before
    you begin the Find procedure. Choose the Edit>Go To command (or press Ctrl+G),
    and click on Last Position on the position list. (This command usually works,
    except when WordPerfect gets a little confused)


    You can select, in your document, the text for which you want to look before you
    choose the Edit>Find and Replace command (or press F2). When you do that, the
    text appears automatically in the Find box as search for.


    # Searching for sanity and finding insanity


    Finding the wrong text — such as the word *insanity* you''re searching for *sanity*
    — is a common problem, and it''s quite treatable. Your therapy is on the Find
    and Replace Text dialog box''s menu bar; we prescribe choosing


    ![](img/a2afb402c275cfc5e5a8f62356a922ef_110_0.png)


    ![](img/a2afb402c275cfc5e5a8f62356a922ef_110_1.png)'
