- img_proc: true
  md: '# Chapter 17: Recipes and Templates for Popular Documents 303


    # ## Printing bar codes


    If you want to make the U.S. Postal Service happy (and who wouldn''t?), you can
    print a USPS POSTNET bar code. (It will impress your friends, too.) Click on the
    Options in the Envelope dialog box to display the Envelope Options dialog box.
    Under USPS Bar Code Options, select Include and Position Above or Below Address.
    Click on OK to close the dialog


    box. WordPerfect looks around your address for what looks like a zip code and
    prints it above or below your address (depending on what you selected in the Envelope
    Options dialog box). When you print the envelope, a tasteful row of little vertical
    lines appears above or below the address. Some machine at the post office must
    know what the lines mean.


    # Tips for printing envelopes


    When you choose Format-Envelope, WordPerfect may demand that you create an envelope
    definition. That''s bad; it means WordPerfect isn''t familiar with printing envelopes
    on your type of printer. You have to tell WordPerfect the length and width of
    your envelopes, the margins — the works. You may want to get some help for this
    task.


    On master layers, you insert envelopes face up, with the right end of the envelope
    entering the printer first. You may have to do mechanical things to your printer;
    check the manual'' "Envelopes" section. If your printer has a platen, stick the
    envelope upside down, with the front facing away from you so that it''s right,
    facing toward you, and it comes up under the platen. Most inkjet printers have
    special envelope-feeding buttons; check your printer manual.


    Depending on your printer, WordPerfect may know how to print more than one envelope
    size. In the Envelope dialog box, check out the Envelope Definitions setting.
    If you click on it, you may find several sizes and shapes are available.


    # ## Mailing Labels


    Zillions of kinds of labels exist — sheets of mailing labels. continuous rolls
    of mailing labels, disk labels — you name it. Luckily, WordPerfect can handle
    an amazing variety of formats.'
  merge: -1
