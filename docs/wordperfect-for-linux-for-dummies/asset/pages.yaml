    # # Finding Codes


    The Reveal Codes window is not a model of readability, user-friendliness is not
    its middle name. (Heaven knows it''s a vast improvement over the Reveal Codes
    window in earlier versions of WordPerfect. The window looked like a strange form
    of algebra crossed with some kind of circuit diagram.)


    The main difficulty in using the Reveal Codes window is finding the code you want.
    Because the line ends don''t correspond with those in the regular window, you
    may get confused about where you are.


    Bring on the WordPerfect Edit<>Find and Replace command! (We describe it in Chapter
    5.) In addition to using the Find and Replace dialog box to find text, you can
    use it to find codes.


    You can tell WordPerfect to look for codes in two ways. Both these methods can
    be useful:


    +   * **Codes:** Tell WordPerfect the type of code to look for — a Left Mar (margin)
    code, for example. This method is useful when you want to know what he is going
    on with the margins in your document.

    * **Specific codes:** Tell WordPerfect the exact code to look for (a Left Mar
    code that sets the left margin to 0.5 inch, for example). This method is useful
    if you have decided to change ½-inch margins to ¼-inch margins and aren''t interested
    in any other margin settings. You can also automatically replace all ½-inch margin
    codes with ¼-inch margin codes; see the “Finding specific codes,” later in this
    chapter.


    Because both methods calling for two dialog boxes at the same time, your screen
    may begin to look like a Dadaist painting. Give them a try, though, if you have
    the courage.


