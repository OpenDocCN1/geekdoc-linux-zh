    button, WordPerfect cascades or tiles your documents, using which command you
    used last. If you''re using a window manager other than KDE, the buttons may be
    different, although their behavior is similar.


    If you minimize a document, it turns into either a bar in a KDE taskbar or an
    icon on the desktop if you''re using another window manager, such as WindowMaker
    or FWWM. When you arrange the open documents by using Tile or Cascade command,
    the minimized window stays minimized. You can get it your way, although it isn''t
    taking up space.


    Each document window has its own title bar that shows the filename of the document
    and has its own little scroll bars. You can move around in each document by using
    the mouse and the cursor keys we describe in Chapter 3.'
