    5. Click on the Destination button, choose Linux''s name for the printer (usually
    1lp unless you have more than one printer) from the list that appears, and click
    on OK.

    6. Click on OK to dismiss the Printer Create/Edit dialog box.

    7. Back in the Select Printer dialog box, make sure that the printer you want
    to use is selected and click on OK. Click on Cancel to dismiss the Print dialog
    box.'
