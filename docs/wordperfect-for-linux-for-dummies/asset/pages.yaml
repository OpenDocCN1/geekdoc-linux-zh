  md: '# 208 Part III: Things You Can Do with Documents


    ![](img/a2afb402c275cfc5e5a8f62356a922ef_237_0.png)


    Figure 12-2: Pick a document—any document. These windows are cascaded.


    If you''re using KDE on your Linux desktop and you maximize one document to fill
    the WordPerfect window, you see three little buttons at the right end of the window
    title bar. These buttons work only in the active document. The first button is
    the Minimize button (it looks like a dot); the second is the Restore, Maximize,
