- img_proc: true
  md: '# 384 WordPerfect For Linux Dummies


    # # How to Use the CD


    The CD is designed to be accessed with a Linux system. You cannot install WordPerfect
    For Linux on Windows or Mac systems. To install the program, you have to be able
    to type commands at the Linux command prompt, or shell prompt. You also have to
    be able to log in your version of Linux as root (the administrative account).
    If you don''t have permission to work as root, ask the administrator of your system
    for help. (You can probably talk her into doing the whole installation.)


    # ## Installing WordPerfect


    When you install WordPerfect, you log in to Linux as either root (the administrator)
    or as another user. You should install WordPerfect as the root user so that you
    can give all the commands that only the root user can give and so that the files
    and directories you install belong to the root user. Although you can install
    WordPerfect even if you can''t as root, you need someone who can help you.


    > > Note: The capitalization and slashes marks (/) look different in the Readme
    on the CD. It doesn''t matter — just follow along with what we tell you here.


    If you have a choice between using a regular console and a terminal-emulation
    program (like xterm or Terminal) under KDE, GNOME, or another desktop environment,
    choose the terminal-emulation program. The prompts look nicer.


    ![](img/a2afb402c275cfc5e5a8f62356a922ef_413_0.png)


    Follow these steps to install the WordPerfect program:


    +   1. **Log in to Linux as root.**

    2. **Create a directory in which to /usr/local to install the program.**

    The directory should be in the /usr/local directory, where most applications live.
    For example, type the following commands to create a directory named /usr/local/wp,
    and press Enter after each command line:

    ```

    cd /usr/local

    mdir wp

    ```

    3. **If you''re planning to install WordPerfect as a user other than the root
    user, give the other user permission to write files in the directory you just
    created.'
  merge: -1
  pgno: 413
- img_proc: true
  md: '# Appendix: About the CD 385


    For example, type the following command and press Enter to make

    tuser margy the new owner of the /usr/local/wp directory, with

    permission to write files in it:


    ```

    chown margy /usr/local/wp

    ```


    +   4. Insert the CD into your computer''s CD-ROM drive.

    After a moment, your computer spins the CD up to dance.


    +   5. When the light on your CD-ROM drive goes out, to the command

    prompt and type the following command to mount the CD (tell Linux

    at a CD is in the drive), and then press Enter:


    ```

    mount /dev/cdrom /mnt/cdrom

    ```


    (The CD-ROM device and the mount directory may be dif-

    ferent from the ones we use here, which are the Linux

    standard names.) Linux warns you that the CD is read-only (that is, you

    can''t store your own data on it). The contents of the CD now appear

    the directory /mnt/cdrom.


    +   6. Type this line to move to the CD-ROM directory and then press Enter:


    ```

    cd /mnt/cdrom

    ```


    Not much seems to happen, except that your shell prompt may change

    to include the new directory name.


    +   7. To install WordPerfect as a user other than root, log out now and

    back in as the other user.


    +   8. Create a temporary directory in which to copy the installation

    program.


    The /var/tmp directory is a proper place to use: Type the command

    mkdir /var/tmp/wp and press Enter to make a wp directory in the

    /var/tmp directory.


    +   9. Copy the file GUILG00.GZ from the GUILG directory on the CD to the

    you you created.


    For example, type this command and press Enter:


    ```

    cp /mnt/cdrom/GUILG00.GZ /var/tmp/wp

    ```


    Note: Capitalization counts. The directory and filenames on the CD are

    capized (which is strange in the world of Linux). The two characters

    at the end of the filename are zeros, by way, not capital Os. The file-

    copying takes a moment because the file is big (23.7MB).


    +   10. Use the Linux-standard gunzip and tar programs to "unzip" (uncom-

    press) the file into its constituent files. Type these commands, and

    press Enter after each one:'
