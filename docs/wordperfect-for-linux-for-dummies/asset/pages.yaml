  md: '# About the CD


    On the CD-ROM


    +   - Some fonts for use with WordPerfect

    - Corel WordPerfect 8 For Linux

    - Language modules to customize WordPerfect for your country


    The version of WordPerfect that''s on the CD in back of this book is the same
    product you can download from the Corel Web site (http://linux.corel.com). We''re
    just saving you time by including it on the CD!


    # System Requirements


    Make sure that your computer meets the following minimum system requirements:


    +   - X86 processor; 486 DX 33 or higher: An Intel Pentium processor or higher
    is recommended. This version of WordPerfect doesn''t work on Sparc, Mac, or other
    non-Intel X86 computers.

    - Linux: You must have Kernel release 2.0.x or higher and ibc5 properly installed.

    - X Window System: KDE, GNOME, or other.

    - At least 9MB of RAM installed on your computer: If your system has more than
    one user, you need more memory (another 2.5MB per user).

    - 87MB hard disk space: During the installation, you may need more space than
    that. While both the installation file and the program are on your hard disk,
    you need more like 116MB of free space.

    - CD-ROM drive


    For basic Linux information, read Linux For Dummies, 2nd Edition, by Jon “Maddog”
    Hall, and UNIX For Dummies, 4th Edition, by John R. Levine and Margaret Levine
    Young (IDG Books Worldwide, Inc.).'
  merge: -1
