  md: '# Part VI: The part of Tens


    In honor of the decimal system, the Ten Commandments, and the perfectly silly
    accident of fate that humans have ten fingers, Part VI is where we stick other
    useful stuff. We have made this part an appendix, but appendices have no fingers
    and — look — just check it out. Part VI is full of stuff that everyone uses WordPerfect
    should know.


    # What’s on the CD-ROM


    The CD in the back of this book contains an entire, free, working copy of WordPerfect
    for Linux! The program is also available for free for downloading over the Internet;
    because the files that make up the program are rather large, however, downloading
    them can be daunting. Instead, you have them already!


    For instructions for installing WordPerfect for Linux, if you don’t already have
    the program installed, see the appendix in back of this book.


    # Icons Used in This Book


    The 20th century will be considered The Age of Icons by future historians, who
    probably will analyze how humanity lost its ability to read actual words. But
    — because we’re not inclined to buck the trend and we want you to get accustomed
    to all the icons you have to deal with in WordPerfect — we have put them in this
    book, too.


    What are icons? They’re pictures that are cuter than the words they represent.
    They also take up less space than the words do, which is why they’re used on computer
    screens in blinding proficiency.


    ![](img/a2afb402c275cfc5e5a8f62356a922ef_35_0.png)


    Alerts you to the sort of stuff that appeals to people who secretly like software.
    It’s not required reading unless you’re trying to date a person like that (or
    are already married to one).


    ![](img/a2afb402c275cfc5e5a8f62356a922ef_35_1.png)


    Flags useful tips or shortcuts.'
