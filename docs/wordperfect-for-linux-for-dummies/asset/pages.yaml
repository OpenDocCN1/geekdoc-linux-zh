  md: '# Part IV: Creating Documents That Don''t Just Sit There


    # Stuff You Can Do in WordPerfect

    That You Can''t Do on a Web Page


    Despite the nice job the folks at WordPerfect have done in tying features to the
    rest of WordPerfect, you should know things about handling Web pages. Because
    HTML and Web browsers are just evolving, whereas WordPerfect has been around for
    years, you can do many things in WordPerfect that you can''t do on a Web page,
    at least not this week. The Web browser market is changing so fast that any of
    this information could be different by the time you read this book.


    As you look at the WordPerfect menus while you edit a Web document, notice that
    most commands on the Format menu disappeared because most of them can''t be used
    on a Web page. The following lists describes the features that don''t convert
    to a Web page, roughly in the order in which you may care about them:


    +   - Tabs: Yes, that''s tabs, as in the Tab key — so simple that you probably
    don''t even think about it. We''re sure lots of technical reasons exists for tabs
    not being a part of HTML as we know it today; fact remains, however, that they
    aren''t. If you used tabs to create a table, reformat the text by using the WordPerfect
    table feature, which converts things nicely to HTML tables.

    - Margins (left or right): Web pages specify their margins by using the size of
    the user''s browser window.

    - Page numbering: What''s a page? Numbered relative to what? We''re talking about
    onscreenreen hypertext here.

    - Columns: Although WordPerfect tries to do something with columns, you probably
    won''t enjoy the results. Newer Web browsers are moving toward the use of columns;
    these browsers just aren''t part of the mainstream yet.

    - Headers and footers: These elements don''t apply to Web pages.

    - Indents: Indents aren''t critical to most documents and don''t even exist in
    HTML documents.

    - Drop caps: The absence of drop caps is a shame because they can be nice-looking.
    WordPerfect turns them back into regular text. If you still want your Web page
    to look arts, replace drop caps with graphics.

    - Fill (shading behind text): Use your page background for this effect.

    - Vertical lines: Use tables again, if you can.

    - Watermarks: Watermarks should be part of your page''s background.'
