  md: '# Chapter 14: Chasing Your Words Around the Page


    Look at the simple budget shown in Figure 14-6. It has sums of columns and even
    a little division and subtraction to calculate the percentage change from year
    to year.


    It''s hard to tell that formulas, not numbers, are entered in the total rows and
    the rightmost column. The only way to tell, in fact, is to turn on the Formula
    toolbar, which lets you enter or see formulas. To see the toolbar, click on the
    Table button on the Property Bar and choose Formula Toolbar from the menu that
    appears. (Click on the Formula toolbar''s Close button to make the bar go away).


    The white box on the left side of the top line of the bar shows which table Word
    prefers that you''re in (such as A, B, or C, which Word uses to keep track of
    tables) and in which cell the cursor is located. In Figure 14-6, that location
    is Table A, C14—the sum of the FY-01 expenses.


    The other white box shows the formula in this cell: +SUM(C8:C13). The colon means
    "through," so this formula means "Sum cells C8 through C13." (Does this look like
    a spreadsheet formula or what?)


    To create this formula, click the formula in the box or click the formula on the
    QuickSum button in the second row of the Formula toolbar. If you type the formula,
    click on the adjacent check mark to test the formula and insert it in the cell.


    Figure 14-6: A complicated table: The Formula toolbar appears between the Property
