    +   Limit your borders to the paragraph, column, or whatever the cursor is in.
    In the Border dialog box, click on the button in the lowerleft corner that says
    Apply Border to current whatever. Checking this box is an alternative to selecting
    an area of text before you issue the Border/Fill command.


    +   Put lines between columns. Place the cursor anywhere in your columns (which
    you can read in the next text), choose Format:Column, and then click to display
    the Column Border dialog box (which looks similar to Figure 14-1). Click on the
    downwardpointing triangle button to the right of the Border Style button. The
    last three borders on the list of border styles are special, and they apply specifically
    to columns. Scroll down the list until you see the last three: Column All, Spacing
    Only, and Column Between. Column puts a line between your columns. Spacing Only
    adds space for lines around your columns but doesn''t put in the lines (obscure
    but useful feature if you have some columns with lines and without). Column All
    puts borders around your whole set of columns, including lines between your


