  md: '# Getting Some Help


    Clearly, you have a great deal to remember about the basics of WordPerfect. And,
    you probably have better things to do than to memorize all this trivia. Luckily,
    WordPerfect can provide help when you need it — at least it can provide a description,
    in computerese, that may be of limited help.


    Most programs, WordPerfect has a Help key: the F1 function key. Pressing F1 runs
    the WordPerfect help system, which contains most of the text in the WordPerfect
    reference manual. Finding information in the online Help system is usually easier
    than rifling through printed pages. Chapter 2 describes it in more detail.


    # Editing Another File


    If you have followed along in this chapter, you have made a document from scratch.
    Frequently, though, you want to edit a document''s already stored on disk. It
    may be a document you made earlier and saved, or a love note left on your disk
    by a secret admirer (Secret admirers are getting more high-tech these days.) Whatever
    the document is, you can look at it in WordPerfect. This process is called loading
    (or opening) the document.


    These steps show you the easiest way to open a document that has been stored on
    the disk:


    ![](img/a2afb402c275cfc5e5a8f62356a922ef_54_0.png)


    +   1. Click on the Open button on the toolbar.

    It''s the one with a tiny yellow folder on it — usually, the second button from
    the left.

    Perfect displays the Open dialog box, as shown in Figure 1-8. Displaying this
    dialog box is the program''s subtle way of saying that it wants to know which
    file you want to open.

    2. Choose a file from the list that''s displayed.

    To choose one, click on a name on the list of displayed names. WordPerfect highlights
    the name by displaying it in another color to show that it knows the one you want.

    3. Click on the Open button (or double-click on the filename).

    WordPerfect opens the file, reads the document, and displays it onscreen.'
  merge: -1
