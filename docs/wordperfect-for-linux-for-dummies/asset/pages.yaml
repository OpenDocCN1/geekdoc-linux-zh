  md: '# Chapter 9: The WordPerfect Secret Decoder 157


    # Using the Open Style Code


    At the beginning of every document, you may notice a mysterious Open Style code.
    WordPerfect doesn''t allow you to delete this code. It tells WordPerfect that
    unless you insert codes to tell it otherwise, WordPerfect should format the document
    by using the Initial Codes Style settings. What are the Initial Cokes Codes Style
    settings? We were wondering that for us. For the full story, see the section in
    Chapter 10 about the InitialStyle style.


    # Using Character Codes


    The most common codes in every document are carriage-return (line-ending) codes,
    including the two in this list:


    +   - SRT: A carriage-return character that WordPerfect inserts automatically
    whenever you reach the right margin; usually called a soft return. The S stands
    for “soft”. (Refer to the preceding sidebar, “Hard- and soft-core codes,” to find
    out why.)


    +   - HRT: A character that WordPerfect inserts automatically whenever you press
    the Enter key to signal the end of a paragraph; also known as a hard return.


    WordPerfect includes dozens and dozens of other codes. This list shows some other
    popular character codes:


    +   - Left Tab: You see this code when you press the Tab key to move to a left
    tab stop. (Chapter 7 discusses types of tab stops.) When you press the Tab key
    to move to another type of tab stop, you get a Right Tab, Center Tab, Dec Tab,
    Dec… Left Tab,… Right Tab,…… Center Tab, or… Dec Tab code.


    +   - Hd Back: The “back-tab” code when you press Shift-Tab, mainly in hanging
    indents. (Refer to the section in Chapter 7 about changing margins for a paragraph
    or two.)


    +   - HPg: The page break you produce by pressing Ctrl-Enter (or choosing Insert:↵
    New Page).


    +   - SRT-SPg and HRT-SPg: When WordPerfect inserts a soft page break because
    a page has become full, it may also stick in one of these codes. (Don''t worry
    about the difference between the two.)'
