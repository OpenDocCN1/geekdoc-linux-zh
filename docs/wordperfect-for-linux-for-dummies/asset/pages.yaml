  md: '# 86 Part I: Introducing WordPerfect for Linux


    underlining those with a red dotted line. Thoughtfully, WordPerfect usually has
    a suggestion about what you may mean instead of what you typed.


    To find out what WordPerfect thinks you should have typed, right-click on the
    underlined word. WordPerfect displays a list of suggested words, along with a
    few other options. You can add this word to your dictionary, skip it in this document,
    or use the full-fledged spell checker, which we talk about in a minute.


    If the word you want is on the list, you''re in luck: Just click on it, and WordPerfect
    automagically replaces what typed with the correct word. If the word isn''t on
    the list, you have another choice. You can tell WordPerfect that you typed really
    is a word and should be considered to be one from now on. We use this feature
    for words and names (like our own names!) that we type frequently and are tired
    of having WordPerfect warn us.


    If the word you really isn''t a word but you''ll be using it often in this document
    anyway, you may want to tell WordPerfect to ignore it. For example, you may want
    WordPerfect to ignore product names, company names, and town names you''re using
    in just one document. You may get tired of seeing,SoVerNet (the Sovereign Vermont
    Internet provider) as you write your review of rural Internet service companies.
    On the other hand, when you''re done with this study, you''ll probably never write
    about those companies again. If so, add SoVerNet to the word list for this document
    by clicking on the Skip in Document menu option when you right-click on SoVerNet.


    You may see other words once in a while, usually when two of them are in a row.
    Every time you''re forced to write something awkward, as "I had a thought that
    might be a good idea," WordPerfect would really rather that you do not do this,
    and it tells you so by underlining the repeated words. There''s not much you can
    do about that situation, other than tell WordPerfect to stop looking over your
    shoulder. (See the "Stop looking over my shoulder! sidebar, later in this chapter)


    # "I see blue under my words"


    Ever keeping your best interests at heart, WordPerfect is happy to point out words
    you may have typed but may not mean to type. Words commonly used incorrectly (like
    hear and here or their, there, and they''re) qualify for the blue underline. Just
    as you do for a spelling error, right-click on the underlined word and WordPerfect
    tells you what kind of error it suspects you may have made and gives you a list
    of possible corrections.'
