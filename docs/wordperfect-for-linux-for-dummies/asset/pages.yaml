    # ## “Where''s WordPerfect?” (Part 1)


    “Hmm. . . I know it was here yesterday. Where is WordPerfect on my menus or on
    my desktop?


    WordPerfect usually hangs out the menu your window manager when you click the
    button in the lower-left corner of the screen (equivalent to the Windows 98 Start
    button). Exactly where it appears on those menus depends on how you or your Linux
    guru installed WordPerfect. Nose around the menus — if it isn''t there, ask your
    Linux guru to help you find it.'
