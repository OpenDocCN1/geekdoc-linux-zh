  md: '# Chapter 14: Chasing Your Words Around the Page


    +   - Parallel or Parallel with Block Protect: A column break moves text across
    the current row to the next column. The break doesn''t put text at the top of
    a new column, as you may expect. When you insert a column break at the end of
    the row, you''re back in the left column, in a new row.


    Column breaks are invisible no matter what you do, unless you use the Reveal Cols
    window (refer to Chapter 9), and who wants to do that? If you want to delete hard
    column breaks, have faith that they''re located just before the first character
    in a column (or just before the current cell in a parallel-type column). To delete
    hard column breaks, place the cursor before the first character in a column and
    press the Backspace key. Or, put the cursor at the end of the preceding column
    and press the Delete key. (Don''t try to delete soft column breaks — the ones
    WordPerfect puts in.)


    # Working with Tables


    When it comes to tables in WordPerfect, guess what? Yup — more overkill. WordPerfect
    is a word processor that swallowed a spreadsheet program. The program can perform
    such tasks as automatically computing sums of columns and rows. It can, in fact,
    automatically compute the standard deviation of the arc tangent of the logarithm
    of the net present value of your mortgage, or multiple random variations of the
    interest rate.


    Fortunately, for those of us who would just as soon leave spreadsheets to the
    accounting department, WordPerfect also does ordinary tables. It even makes them
    easy to create.


    # Making tables with Table QuickCreate


    The fastest way to create a table is to use the TableQuickCreate button on the
    toolbar. Follow these steps:


    +   1. Click on the toolbar button that looks like a little grid and hold down
    the mouse button.

    As you hold it down, a little grid appears. You can use it to tell WordPerfect
    how big to make your table.

    2. Drag the mouse pointer down and to the right on the grid to highlight the number
    of rows and columns you want.

    In tables, columns flow vertically, and rows flow horizontally. The number of
    columns times rows appears above the grid (for example, 5 x 2 for a table with
    five columns and two rows).

    3. Release the mouse button.

    Your table is ready. Would Madame follow me? Walk this way, please.


