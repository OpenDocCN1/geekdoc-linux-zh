  md: '# Adding or deleting rows and columns


    To make tables larger or smaller (to increase or decrease the number of rows or
    columns), you use the Table button on the Property Bar — it’s the button with
    the downward-pointing triangle to its right. When you click on the Table button,
    a menu of table-related commands appears.


    These steps show you how to add one or more rows or columns to your table:


    +   1. Click on any row or column that will adjoining your new row or column.
    Click anywhere in the bottom row, for example, to add a new row to the bottom
    of your table.


    +   2. Click on the Table button on the Property Bar and choose Insert from the
    menu that appears.

