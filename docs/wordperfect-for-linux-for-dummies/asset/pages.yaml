- img_proc: true
  md: '+   1. Choose Format: Styles.

    You see the Style List dialog box (refer to Figure 10-2).


    +   2. Click on the Options button.

    You see the Options drop-down menu.


    +   3. Choose Retrieve.

    The Retrieve Styles From dialog box appears.


    +   4. Type the name of the document from which you want to retrieve styles, or
    click on the file-folder icon to select the file from a list. (See Chapter 14
    to find out how this method works.)


    +   5. If you want just the user styles (the ones you or the document''s author
    made) or the system styles (the built-in WordPerfect styles), click on the appropriate
    box in the Style Type of the Retrieve Styles From dialog box.


    Normally, you get both types of styles. WordPerfect asks you whether want to override
    the current styles.


    +   6. Click on the OK button.

    In all likelihood, you want to override the current styles.


    +   7. Click on Yes.


    # Creating the Martha Stewart library of styles


    To be Really Systematic and Organized, you should save your styles in a central
    location. This procedure enables you to control styles from a single point.


    In one of two possible approaches, you copy your styles to a document template
    that automatically brings styles in when you create a new document using that
    template. (Chapter 17 describes templates and all the wonderful things you can
    do with them.) The other method, in which you save your styles in a separate file,
    requires you to retrieve the styles from that file manually. This method has the
    advantage, however, of allowing you to save all your styles — styles for memos,
    for example — under one name.


    If most what you create will use the same styles, copy your styles to the standard
    template, on which all documents are based. (This approach is also great for pack
    rats, who don''t mind if every style they create is stored in one place.) To copy
    styles to the standard template, follow these steps:'
