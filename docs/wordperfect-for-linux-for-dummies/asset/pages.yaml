    # Modifying existing styles


    The Styles Editor (refer to Figure 10-3) is also the place to change the format
    of existing styles. To edit a style, choose the Format>Styles command, select
    the style to edit, and click on the Edit button. The only difference between changing
    a style and creating a new one, in fact, is that you don''t get to type a name
    for the style. WordPerfect doesn''t let you change the type (character, paragraph,
    or document) of an existing style, and it prevents you from renaming its built-in
