- img_proc: true
  md: '# Chapter 21


    # The Ten Commandments

    of WordPerfect


    In This Chapter


    +   - Tell WordPerfect what you have in mind

    - Do not use extra spaces or tabs

    - Do not keep pressing Enter to begin a new page

    - Do not number your pages manually

    - Save early and often

    - Save before using the Edit Find and Replace command

    - Back up your work

    - Do not turn off your PC until you log off from Linux

    - Turn on the printer before printing documents

    - Always keep printer supplies on hand


    Okay, you unbelievers. You don''t have to follow the rules explained in this chapter
    — just don''t blame us if lightning strikes you (or, more likely, strikes somewhere
    near your office and knocks the power out, destroying your valuable documents!)


    # Tell WordPerfect What You Have in Mind


    You have to tell WordPerfect what you want for your document. If you want multiple
    columns, use the WordPerfect Columns feature. If you want wide margins, tell WordPerfect
    to widen them by dragging the margin guidelines around or by using the Format
    Margins command. Don''t think that these types of tasks would be easier if you
    skip all that and just use extra returns, spaces, or tabs to put text where you
    want it. This method always means extra work in the long run when you edit your
    text.'
  merge: -1
  pgno: 400
- img_proc: true
  md: '# 372 Part VI: The Part of Tens


    The WordPerfect word-wrap feature, for example, enables the program to begin a
    new line whenever it sees you getting peril close to the right margin. In the
    mind of WordPerfect (such as it is), a bunch of text that ends with an Enter is
    a paragraph, so type your paragraphs like that and let WordPerfect do the rest
    of the work. Don''t press Enter until you get to the end of a paragraph (refer
    to Chapter 1 for more information).


    # Do Not Use Extra Spaces or Tabs


    In high school, your typing teacher taught you to type two spaces after each period.
    Other than that, you should never type more than one space consecutively (with
    rare exceptions). If you want to move across a line and leave some white space,
    use tabs (Refer to Chapter 7 to find out how to set tabs and use different types
    of tabs).


    In the world of typesetting, which includes proportionally spaced fonts, it is
    considered good form to type only one space after each period. Somehow, after
    text is typeset, it looks fine. We can understand, though, if ingrained two-space
    habits are too hard to break. WordPerfect is willing to help you out here. Choose
    the Tools->QuickCorrect command and click on the Format-As-You-Go box at the top
    of the QuickCorrect dialog box. In the End of Sentence section, you see some correction
    options, including one named Change two spaces to one space between sentences.
    If you check that option, WordPerfect deals with all this space nonsense for you.


    Incidentally, if you''re using tabs to create something something that looks like
    a table, adjust the tab stops so that you use one tab for each column. This technique
    enables you to press Tab just between entries (refer to Chapter 7). Better yet,
    use the WordPerfect Table feature (refer to Chapter 14); remember the first rule.


    # Do Not Keep Pressing Enter to Begin a New Page


    When you decide to begin a new page, tell WordPerfect so in no uncertain terms:
    Press Ctrl-Enter around the issue by pressing Enter repeatedly. Don''t pussyfoot
    around until you fill the current page with blank lines. This technique is another
    example of the first commandment in action — if you want a page break, say so.
    (Chapter 8 explains why the Ctrl+Enter method works best.)'
  merge: -1
  pgno: 401
- img_proc: true
  md: '# Do Not Number Your Pages Manually


    WordPerfect can number pages for you and place the page numbers in the left, center,
    or right corner of either the top or bottom of the page. What more could you ask?
    Don''t type page numbers yourself; they become a mess if you you edit your document
    and the page breaks move around. Chapter 8 tells you how to number your pages
    and print other information in headers and footers.


    # Save Early and Often


    Be prepared for disaster! Every time you squirm around in your chair, scratch
    your foot, or take a sip of coffee, press Ctrl+S to save your document. ''Nuff
    said. Yes, a timed document backup helps (refer to Chapter 19); are you really
    willing, though, to lose your past ten minutes or so of work?


    # Save Before Using the Find and Replace Command


    The WordPerfect find-and-replace feature (described in Chapter 5) has awesome
    power, either to make lots of wonderful updates throughout your document or to
    trash it big-time. What if you mean to replace Smith with Smythe, for example,
    and you type a space by mistake in the Find box just before you click on Replace
    All? Poof — all the spaces in your document are replaced by Smythe. Your important
    letter has just been transformed into performance art.


    Just in case, save your document before you use the Find and Replace command or
    before you use any other command that makes Big Changes to your document.


    # Back Up Your Work


    Saving is good. Saving your documents on your hard disk doesn''t help, however,
    if your hard disk dies. We don''t mean to sound alarmist here, but it can happen.
    Talk to someone in your office about setting up a backup system for'
  merge: -1
  pgno: 402
- img_proc: true
  md: '# 374 Part VI: The Part of Tens


    you by using either disks or backup tapes. At least you can use the file manager
    that comes with your window manager to copy your important documents to floppy
    disks occasionally. Ask your local Linux guru how to "mount" and "unmount" them:
    Linux must be told explicitly whenever you stick a floppy disk in your disk drive.


    # Do Not Turn Off Your PC Until You Exit Linux


    Oops — you''re running late. Time to go! Don''t just turn off your computer. If
    you turn it off while Linux is still running, you can cause problems. Leave the
    computer on (turn off its screen). Many newer computers, in fact, sport the U.S.
    Department of Energy''s EnergyStar logo. Those computers are designed so they
    never have to be turned off. Instead, they turn off parts of themselves (or go
    to sleep, as it''s sometimes described) when they''re not in use. If you have
    an EnergyStar screen to go with your EnergyStar computer, you can walk away without
    giving it a thought. We recommend saving your document first, though.


    If you prefer to turn off your computer, you have to shut down Linux first. (If
    you work in an organization, check with your system administrator so that she
    can try to talk you into leaving your system on instead.) Log off from Linux by
    pressing Ctrl+Alt+Backspace. If you''re still logged in, you see a Linux prompt.
    Type exit to log off. (On some systems, you can also press Ctrl+D:) Then ask your
    local Linux guru how to shut down Linux and when it''s safe to turn off your computer.


    # Turn On the Printer Before Printing Documents


    If your document refuses to print and you see strange error boxes onscreen, the
    first things to check are whether your printer is on, whether the online light
    is on, and whether paper is in the tray. If those checks don''t fix things, refer
    to Chapter 11.'
  merge: -1
  pgno: 403
- img_proc: true
  md: '# Always Keep Printer Supplies on Hand


    Ooh — how does the printer know when you’re about to print the final draft of
    something big? It does somehow, and that’s the moment when the ink cartridge runs
    empty or the toner cartridge ejects its last hiccup of toner. Rats!


    Be sure to have extra printing supplies on hand so that you can foil the printer
    when these things happen. If you use toner cartridges, you can sometimes get a
    few more pages out of them by removing the cartridge from the printer, dancing
    around with it wildly (to shake up the toner inside), and putting the cartridge
    back in. Your officemates will enjoy the show, too.'
