  md: '# Chapter 14: Chasing Your Words Around the Page


    # Changing everything else about a box


    When you select a box, notice that the Property Bar changes completely: it usually
    shows type fonts and sizes the like. If you''ve clicked on the outline of the
    box and see the eight handles, however, the Property Bar starts with the word
    Graphics. It''s a good thing that it does, too, because you may want to do about
    a million things to your box.


    Getting the Property Bar to display the box properties, as opposed to the properties
    of the text inside the box or the text outside the box, can be a little tricky.
    If you click inside the box, the Property Bar tells you about the text inside
    the box. If you click outside the box, the Property Bar tells you about the text
    outside the box. If you click on the edge of the box itself, however, you see
    not only the arrow and the handles but also the Property Bar, as shown in Figure
    14-7.


    ![](img/a2afb402c275cfc5e5a8f62356a922ef_282_0.png)


    A few of these buttons are simple:


    +   **Previous Box/Next Box:** While your mind is on boxes, you may want to do
    stuff to other boxes in your document. Rather than to find them and click on them,
    let these handy buttons take you to those boxes directly. If either button is
    grayed out, it means that no previous or next box is in your document.


    +   **Border Style:** This button gets you into Border Formatting Land, which
    we talk about in the section "Basic borders," at the beginning of this chapter.


    +   **Fill Style:** This button introduces Phil, the fill guy we talk about the
    beginning of this chapter, in the section "Phil — for all that white space behind
    your text."


    The other buttons deserve a look in a little more detail.'
