  md: '# # WordPerfect For Linux Dummies Cheat Sheet


    # # General Information


    To start WordPerfect, click the WordPerfect icon on your desktop or choose WordPerfect
    from the menus when you see the K, GNOME, or other "start" button. If you can''t
    figure out how to start the program, see the appendix in back of this book.


    To close a window, click File>Close from the menu bar or click the Close button
    (usually an X) in the upper-right corner of the window.


    To leave WordPerfect, choose Program from the menu bar of the program window and
    choose Exit. Click on the Close button (usually an X) in the upper-right corner
    of the WordPerfect program window.


    When we say "press Alt+some key" or "press Ctrl+some key", we mean that you hold
    down the Alt or Ctrl key (like you hold down the Shift key) while you type another
    key and release it.


    | To Do This While You''re Typing | Press This |

    | --- | --- |

    | Get help | F1 |

    | Erase the character you just typed | Backspace (depending on your X Window configuration)
    |

    | Erase the character to the right of your cursor (insertion point) | Delete |

    | Start a new paragraph | Enter |

    | Start a new page | Ctrl+Enter |

    | Indent the first line of a paragraph | Tab |

    | Indent all lines in a paragraph | F7 (after moving the cursor to the beginning
    of the paragraph) |


    # # Mouse Droppings


    | To Do This | Do This With Your Mouse |

    | --- | --- |

    | Select (highlight) text | Click in the text, hold down the mouse button, and
    drag |

    | Select a word | Double-click on the word |

    | Select a sentence | Click once in the left margin |

    | Select a paragraph | Double-click in the left margin |

    | Move text or graphics | Select it and then click it and drag |

    | See a QuickMenu | Move the mouse to the item you want to work with and click
    the right mouse button |

    | Change the font | Click on the Font button on the Property Bar |

    | Go somewhere | Double-click on the position area of the Application Bar |

    | Close a file | Click on the Close box on the right end of the menu bar |

    | Exit from WordPerfect | Click on the Close box on the right end of the title
    bar of the WordPerfect program window |


    ...For Dummies®: Bestselling Book Series for Beginners'
