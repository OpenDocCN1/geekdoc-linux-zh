  md: '# 122 Part II: Preying Up Your Text


    # Types of tab stops and other boring information


    WordPerfect has a bunch of different kinds of tab stops. This subject is the kind
    of boring, petty stuff you probably haven''t thought about since high school,
    and we urge you to join this sidebar if you possibly can.


    Still with us? Okay, here this sidebar describes the different types of tab stops,
    along with what happens when you press the Tab key to move to each type. The table
    at the end of this sidebar shows a live demonstration.


    +   - Left, or L:


    What you appears to the right of the tab-stop position. On the ruler, left tab
    stops are indicated by little black triangles that point down and to the left.


    +   - Right, or R:


    What you appears to the left of the tab-stop position. This tab stop doesn''t
    sound aptly named, does it? It''s a right tab stop because the text is flush right,
    or right-aligned, at the stop. On the ruler, the triangles for right tab stops
    point down and to the right.


    +   - Center, or C:


    What you appears centered on the tab-stop position. On the ruler, center tab stops
    are shown by little upward-pointing triangles.


    +   - Decimal, or D:


    This tab stop is designed for numbers that have decimal points, such as columns
    of dollar amounts. WordPerfect positions the text with the decimal point at the
    tab-position; columns of numbers look much tidier if decimal points lines align
    vertically. If you type something that has no decimal point, WordPerfect right-aligns
    it. On the ruler, a decimal tab stop is indicated by an upward-pointing triangle
    with a dot in the middle.


    +   - Dotted versions of the four types:


    You can tell WordPerfect to display a line of dots (a dot leader) that leads up
    to the entry. You see this kind of thing in the tables of contents in books such
    as this. On the ruler, dotted tab stops are shown by triangles with dots above.


    | Left | Center | Right | Decimal |

    |---|---|---|---||

    | Tom | Jones | Blue | $150.00 | ........Page 1 |

    | Jo | Bloggswirth | Greenish | 75.00 | ................ |

    | Sue | Fish-Frei | Purple | 235.50 | ..............3 |

    | Mary | Green | Red | 100.00 | ............4 |


    You may not want a tab stop half-inch, and you may want to create tab stops of
    types other than left tab stops. If you''re typing a list of names and phone numbers,
    for example, you may just want one tab stop at the position where you want the
    phone numbers to appear. Luckily, WordPerfect enables you to fool around the tab
    stops at all.'
