  md: '# Chapter 12: Juggling Documents on Your Screen


    After you get good at this kind of it, it''s amazing how much text you can recycle!


    In addition to The WordPerfect Way of copying and pasting, you can use The X Window
    Way. (The X Window System is part of what Linux uses to display windows on your
    screen.). Select the text you want to copy by using the left mouse button. Switch
    to the window you want to paste. Move the mouse pointer (not the cursor) to the
    spot where you want the text to appear. Press the middle mouse button if you have
    a three-button mouse or the left and right buttons simultaneously if you have
    a two-button mouse. Presto! Your text appears. This technique is an old X Window
    shortcut that works for almost any window with text in it, not just WordPerfect.


    ![](img/a2afb402c275cfc5e5a8f62356a922ef_236_0.png)


    # Windows on Top of Windows


    It can be annoying flipping back and forth between two documents, copying information
    or just referring to what you have written. Sometimes, seeing both documents at
    the same time is more convenient. Again, WordPerfect is happy to oblige.


    # Seeing lots of windows


    You can view multiple documents onscreen in these three ways:


    +   - Choose Window Cascade from the menu bar in the program window. WordPerfect
    creates a little window for each document and stacks the windows like a deck of
    cards, as shown in Figure 12-2.

    - Choose Window Tile Top to Bottom or Window Tile Side by Side the menu bar in
    the program window. Again, WordPerfect puts each document in a list window. This
    time, it fills the WordPerfect window with the documents like a game of dominoes,
    as shown in Figure 12-3. Top-to-bottom tiling arranges the documents in wide,
    horizontal strips; side-by-side tiling arranges the documents in skinny, vertical
    strips. The top-to-bottom arrangement generally makes documents easier to read.
    If you have 4 or more documents open, WordPerfect simply arranges documents in
    a grid. If you have 11 or more documents open, the Tile commands are disabled
    (If you are working with many documents at one time, you have bigger problems
    than a disabled Tile command).'
