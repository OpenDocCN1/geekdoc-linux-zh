  md: '# Chapter 14: Chasing Your Words Around the Page 251


    # Working with Text Boxes


    Suppose that you''re reading a serious article — in People magazine, for example
    ("Tom Hanks: Does He Really After Meg?”). In the corner of the page, bordered
    in fuchsia, are two columns of text about frivolous, annoying peripheral subject,
    as “Tom Hanks and Cher: Separated at Birth?” Guess what? You can too make sidebars
    just as this one in your document using text boxes.


    Seriously, you should read this section if you want to create any kind of boxes
    in your WordPerfect documents. Plain old text boxes like the one we just described,
    some tables, pictures, and even equations use this box stuff, it''s handy to know.
    All the boxes in WordPerfect work pretty much the same way. We use text boxes
    to introduce them.


    # Creating your first box


    To create a text box, choose Insert Text Box or click on the Text Box button on
    the toolbar (it has the letter A on it inside a rectangle). Pool! A box appears
    in your document. WordPerfect decides where to put the box and what it should
    look like. The cursor is inside the box, so type away to your heart''s content.


    You can format this text by using the Format commands, as you would format any
    other text. You can even put text in columns. Don''t try to use the Format commands
    to change the border of the text box, though; all you get are boxes within boxes.
    Text is automatically centered between the top and bottom bars. If the box is
    the wrong length or width, don''t worry about it now; just type the text. You
    can change the box dimensions when finished.


    You may decide that this box has a couple of problems. Two that we think of are
    it may not be exactly where you want it to be and it may not have the border outline
    you want. Never fear. You can change all that too. Just read on.


    Pressing Ctrl+Z doesn''t undo adding a text box, and neither does choosing Edit+Undo,
    so be sure to save your document before working with text boxes.


    ![](img/a2afb402c275cfc5e5a8f62356a922ef_280_0.png)'
  merge: -1
  pgno: 280
- img_proc: true
  md: '# Part IV: Creating Documents That Don''t Just Sit There


    ![](img/a2afb402c275cfc5e5a8f62356a922ef_281_0.png)


    # Selecting your box


    Everything we talk about in this part of this chapter requires that WordPerfect
    be thinking about your box, not about the contents of your box. If you click in
    the box, WordPerfect obliges by thinking about the contents of the box. In this
    section, boxes contain text, so the Property Bar shows all its text-things.) If
    you click outside the box, WordPerfect obliges by thinking about the outside the
    box. More text: You can select your box in one of two ways:


    elsewhere and where your box isn''t showing its handles. This method doesn''t
    work for text boxes. For those, and for boxes WordPerfect is already thinking
    about, starts selecting the contents of the box rather than the box itself.


    +   * Click on the contents of your box: Works if the attention of WordPerfect
    is focused


    +   * Click on the border of your box: Works if you can see the border-of your
    box but WordPerfect has its attention elsewhere, usually on the contents of the
    box.


    # Moving a box to more or less where you want it


    Okay, you''ve typed a bunch of text in your box, and the box has grown to suit.
    It''s just not quite where you want it to be. No problem. Because this box is
    the one you''re typing in, it should have eight little square blocks, or handles,
    around it. Click and hold the mouse button anywhere along the outs of the box
    between the handles. You know that you''re in the right place when the mouse cursor
    turns into a four-headed arrow. After you''ve clicked and started to drag, that
    box should move anywhere you want it.


    # Making a box more or less the right size


    This task is just as challenging as moving the box. Find those eight handles around
    the outside of the box and drag one of them to resize the box. The cursor changes
    to tell you that you''re in the right place. In this case, you get an arrow pointing
    either up and down (you can make the box taller or shorter), left and right (you
    can make the box wider or narrower), or diagonally (you can drag the corner of
    the box and change both its width and height at the same time). Go wild.'
