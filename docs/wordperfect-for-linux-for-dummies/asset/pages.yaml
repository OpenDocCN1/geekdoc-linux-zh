  md: '# Chapter 6: Charming Characters


    If you want boldfaced, italicized, or underlined characters, look in the Appearance
    section of the dialog box and click on the Bold, Underline, or Italic options
    there so that the boxes are filled in for the options you want.


    The Appearance section of the dialog box lists some other groovy formatting, too,
    including Double Underline, Outline, Shadow, Small Cap, Redline, Strikeout, and
    Hidden; see Table 6-1 for samples of all these styles. (The table doesn''t show
    hidden text because hidden text is invisible when it''s printed.)


    | Character Format | Sample Text |

    | :--- | :--- |

    | Bold | This **coffee** tastes like sludge! |

    | Underline | This <u>coffee</u> tastes like sludge! |

    | Double Underline | This __coffee__ tastes like sludge! |

    | Italic | This *coffee* tastes like sludge! |

    | Outline | This <small>coffee</small> tastes like sludge! |

    | Shadow | This coffee tastes like sludge! |

    | Small Cap | This COFFEE tastes like sludge! |

    | Redline | This red coffee tastes like sludge! |

    | Strikeout | This ~~coffee~~ tastes like sludge! |


    Scientific types who want to create a script or superscript should click in the
    Position box, which usually says Normal. WordPerfect displays a small popup list
    of choices: Superscript, Normal, and Subscript. Click on your choice.


    If you''re underlining words and you have strong opinions about underlining spaces
    and tabs, you can tell WordPerfect about them by clicking in the Underline Options
    box.


    After you just select the right formatting, click on OK or press Enter to close
    the Font dialog box. If you select text before opening the Font dialog box, the
    selected text is formatted; otherwise, the formatting starts at the current cursor
    position.


    > If you want to forget the whole thing, click on Cancel or press Esc to escape
