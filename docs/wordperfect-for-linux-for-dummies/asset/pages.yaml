- img_proc: true
  md: '# Chapter 14: Chasing Your Words Around the Page 257


    ![](img/a2afb402c275cfc5e5a8f62356a922ef_286_0.png)


    Figure 14-9: How large a box do you want?


    If you want to keep the original height-to-width proportions of your box, resize
    it by using the Box Size dialog box and then click on Maintain proportions. If
    you click it in the Height section, you can change the box width, and Word adjusts
    the height automatically. If you click on Maintain proportions in the Width section,
    you can probably guess what happens.


    If you want a box to run the full width of the page, click on Full in the Width
    section. If you want to run the full height of the page (if you want a tasteful
    stripe up the page, for example), click on Full in the Height section. Don''t
    click on for both height and width.


    # Adding captions to your boxes


    Using regular document text to put a caption where you want it, such as below
    a box, is virtually impossible. You have to use the special Caption feature. When
    you click on the Caption button on the Property Bar, WordPerfect creates a little
    spacing below your box and may suggest a caption (Figure 1 or whatever). If you
    don''t like the suggestion, press the Backspace key to delete it. Alternatively,
    you can add your caption to the beginning or end (or both) of WordPerfect suggests.
    As you type, you can use any of the Format commands or formatting buttons, such
    as boldface or different type sizes. When a caption already exists, pressing the
    Caption button displays the caption text so you can edit it. You, of course, just
    click on the text to edit it, but that would be too easy!


    You can delete a caption, although you wouldn''t know it by looking around WordPerfect.
    To do so, the box must be selected and the Graphics menu displayed (refer Figure
    14-6). Click on the Graphics button on the Property Bar and choose the Caption
    command to display a dialog box that has more options about captions (and captions
    about options) that a reasonable person wants. Ignore all and click Reset (on
    the right side of the dialog box). WordPerfect warns you that you are — gasp!
    — about delete your caption. If you click on Yes, you get absolutely no indication
    that you have deleted your caption; click on OK in the Caption dialog box, however,
    ever and rest assured that your caption is gone, gone, gone!


    ![](img/a2afb402c275cfc5e5a8f62356a922ef_286_1.png)'
  merge: -1
