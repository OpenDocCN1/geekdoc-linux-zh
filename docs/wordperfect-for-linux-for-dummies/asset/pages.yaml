  md: '# Chapter 2


    # Using the Mouse and Keyboard


    In This Chapter


    +   - Knowing when to use mouse and when not to mouse

    - Choosing commands from menus

    - Dealing with dialog boxes

    - Using QuickMenus for even more ways to choose commands

    - Toying with the toolbar, the Property Bar, and the ruler

    - Using the keyboard

    - Knowing when to press Enter

    - Using Tab and the spacebar

    - Using the Undo button

    - Getting help

    - Letting PerfectExpert help


    Using WordPerfect for Linux is a little like dining at a fine restaurant in another
    country, or maybe on another planet. As anyone who has ever ordered in a foreign
    restaurant knows, you can tell the waiter what you want in three ways:


    +   - The difficult, old-fashioned (but highly impressive) way: Speak the language.

    - Order by the numbers (works mainly in Chinese-American restaurants).

    - Point at the menu and grunt.


    Originally, telling a computer what you wanted also was a matter of the language:
    Type a command or "order by the numbers" by pressing a special key, such as F3.
    Now, however, with the advent of graphical window-filled interfaces, software
    is smart enough that you can just point and grunt.


    That advance came just in time, too, because the menu of things that today''s
    software can be so huge — so huge that to use the old-fashioned keyboard method,
    you would have to hold down as many as three keys at a time and develop a keyboard
    method that would prostrate Paderewski.'
