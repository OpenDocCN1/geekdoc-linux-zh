- img_proc: true
  md: '# Part IV: Creating Documents That Don’t Just Sit There


    # Tips for printing labels


    You can use all the usual formatting for labels — select a nice font, make the
    zip code boldface, or whatever.


    ![](img/a2afb402c275cfc5e5a8f62356a922ef_335_0.png)


    The WordPerfect list of label definitions is awfully long. To make it shorter,
    select Laser or Tractor-Fed at the top of the Available Labels section of the
    dialog box. WordPerfect lists only labels of that type.


    If you have used the WordPerfect merge feature to enter a list of addresses for
    creating junk mail (refer to Chapter 16), you can print the same addresses on
    mailing labels. Create a new form file (the merge merge for the document that
    contains the form letter) and choose Format=Labels to format it for labels. On
    the first mailing label, enter merge codes for the parts of the address. Then
    choose Tools<-Merge to fill in the labels.


    If you’re using a type of label that WordPerfect doesn’t know about, you can create
    your own label definitions. Click on the Create button in the Labels dialog box
    and tell WordPerfect all about the size and arrangement of your labels.


    # Booklets


    A common typing job is a pain in the neck with most word processors: a little
    booklet that consists of regular sheets of paper folded in half, like the one
    shown in Figure 17-6.


    Wait! — WordPerfect has a special booklet feature for making just this kind of
    document. This cool feature makes us want to take back (almost) all the snide
    hints we''ve said about WordPerfect.


    ![](img/a2afb402c275cfc5e5a8f62356a922ef_335_1.png)'
  merge: -1
  pgno: 335
- img_proc: true
