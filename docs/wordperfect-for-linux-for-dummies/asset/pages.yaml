    Although you may want to leave WordPerfect running all

    day so you can switch back to it in a jiffy, you must exit WordPerfect

    (and Linux) before you turn off your computer.


    To leave WordPerfect, you choose the ProgramExit command from the pro-\gram window.
    (Remember the program window? Here''s one of the

    places where you actually use it.) Or click the Close (X) button in the upper-

    right of the program window. Although we talk more in Chapter 2

