  md: '# Part I: Introducing WordPerfect for Linux


    # Dealing with one character at a time:

    Delete and Backspace


    You can delete one character at a time in these two ways:


    +   - The Delete key deletes the character *after* the cursor.

    - The Backspace key usually deletes the character *before* the cursor. (Depending
    on how the X Window System is configured on your computer, the Backspace key may
    just act like the Delete key: if so, ask a Linux or X guru to change your keyboard
    mapping for you.)


    In either case, the text closes up behind as you go. It''s surgery without scars.


    Make sure you don''t have any text *selected* if you want to delete just one character
    at a time. (Refer to Chapter 4 for information on selecting text.) Both the Backspace
    and Delete delete whatever text is selected. Selected text is indicated by highlighting.
    (Actually, it''s darklighting, but who''s counting?)


    ![](img/a2afb402c275cfc5e5a8f62356a922ef_105_0.png)


    # Deleting blocks of text


    The simplest way to delete a block of text is to *select it* (highlight it) with
    the mouse or keyboard and press the Delete or Backspace key. For the full details
    about selecting text, refer to Chapter 4.


    # Deleting secret codes


    Feeling a tad paranoid? Can it be that everyone around you is, undetected by exchanging
    secret glances and signs? Just to add to your paranoia, be aware that WordPerfect
    is indeed using secret codes. In your glory during the days of the CIA, if you
    lose the codes by accident, you may be in deepaquamo.


    While you''re deleting text, you may also delete one or more of these secret codes.
    If you do, the appearance of a bunch of text then changes. Fortunately, in many
    cases, WordPerfect prevents you from accidentally deleting the secret codes.


    As we discuss in Chapter 9, lots of hidden, secret codes are sprinkled throughout
    every WordPerfect document. These codes are cryptic notes WordPerfect makes itself
    to remember, for, "turn on boldface type here" and "turn off boldface type here."


    If the formatting of a block of text changes while you''re deleting, you probably
    deleted a secret code. If you catch your mistake soon, you may be able to undo
    with Edit-Undo or its equivalent keyboard command, Ctrl+Z (see the section "Undo)Do
    It," later in this chapter); otherwise, just reformat it to the way it was.'
