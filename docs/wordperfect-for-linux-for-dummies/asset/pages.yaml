  md: '# Part IV: Creating Documents That Don''t Just Sit There


    The QuickSum is kind of magical. It inserts a formula for the sum of cells either
    above or to the left of the cell in which you''re putting the formula. QuickSum
    is intelligent about doing it correctly (it''s not at all a dim sum), although
    sometimes it guesses wrong about what you want to.


    Try it. If the QuickSum button guesses wrong, you can always edit the formula
