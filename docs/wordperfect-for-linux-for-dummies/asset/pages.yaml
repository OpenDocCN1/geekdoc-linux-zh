    # Creating directories


    Unless you tell WordPerfect otherwise, it saves all your documents in your default
    document directory, which is usually your home directory or the directory that
    was open when you started the WordPerfect program. If your username is npotter,
    for example, your home directory would be /home/npotter You probably don''t want
    to put all your documents in your home directory, unless you''re an especially
    big fan of disorganization. Instead, you can easily specify a different directory
    when you save your document or create a new directory. You can also change your
    default document directory. (See Chapter 19 for more information about changing
    the WordPerfect default settings).


    Earlier in this chapter, we mention that directories are often called folders
    because they are somewhat analogous to the paper folders used in filling cabinets.
    They have a key difference, though. Although a supply cabinet never seems to have
    enough real folders in it, electronic folders never have a problem; you just create
    new ones out of thin air. Here is how to do it with the File manager:


    +   1. Open the Save As dialog box by choosing File:Save As, or open the File
    Manager dialog box by choosing Program:File Manager.


    You see a dialog box that looks something like the one shown in 13-1.


    +   2. Select the existing directory in which your new directory will be created.


    Double-click on directory names in the Directory List to move to the existing
    directory you want.'
