  md: 'David Guertin, who helped convert this edition from a Windows book to a Linux
    book, came into the computer business via the back door. Unlike some authors,
    he did not start playing with UNIX as a young nerd; instead, he waited until he
    was an older, established nerd. Dave became serious programming as a graduate
    student in zoology, writing programs that taxed the capabilities of the most powerful
    computer then available. To circumvent this problem, he ignored the skepticism
    of his peers and installed a fledgling system named Linux. With the enthusiasm
    of the converted, he has used UNIX and Linux in his work ever since. Dave is the
    Science Specialist in Instructional Technology at Middlebury College, where he
    supports UNIX in the sciences.


    Kathy Warfel, who also helped update this book from the preceding Windows-based
    edition, is a technical writer who has been teaching people how to use computers
    and writing about computers for the past 15 years. She was hooked on the Internet
    from the first time she logged on and saw a second news video of a politician
    giving a speech. She holds a B.S. degree in journalism from the University of
    Colorado and hopes one day to own a small-town online newspaper.'
