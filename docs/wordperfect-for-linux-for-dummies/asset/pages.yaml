    ```

    find /home/margy -name zucchini-bread -print

    ```


    This command tells Linux to start searching in the /home/margy directory, looking
    at the names of the files, for a file named zucchini-bread. Don''t forget the
    * at the end or else Linux doesn''t display the filename it finds. It also searches
    the subdirectories of the directory you specify. You can use an asterisk (*) as
    a wildcard character in the filename; if you do, enclose the filename in single
    quotes, like this:


    ```

    find /home/margy -name ''zucchini*'' -print

    ```


