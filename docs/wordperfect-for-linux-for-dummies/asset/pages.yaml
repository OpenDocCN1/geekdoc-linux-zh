  md: '# Part IV: Creating Documents That Don’t Sit There


    # Working with the Graphics menu


    Because whole bunch of commands are meaningful only when you have selected a box
    (technically, a graphics box), the folks at WordPerfect decided that it would
    be confusing to have the Graphics menu appear only when a graphics box is available
    to edit. Rather than have the Graphics menu appear on the menu bar, where you
    may not notice it, they put it on the Property Bar that appears when you''re editing
    a graphics or text box. At least that''s what we figure.


    You can do only two things of major importance from this menu that can’t do anywhere
    else: Set the exact size of your box and set the exact position of your box.


    # Moving a box exactly where you want it


    Earlier in this chapter, we talk about dragging the border of the box (between
    the handles) to move it around. That method may be fine if you don''t care exactly
    where your box is placed. If you want to specify the gory details, however, select
    the text box, click the Graphics button on the Property Bar, and choose the Position
    command. Figure 14-8 shows the Box Position dialog box.


    ![](img/a2afb402c275cfc5e5a8f62356a922ef_283_0.png)


    Figure 14-8: The Position dialog box comes in three flavors.'
  merge: -1
  pgno: 283
- img_proc: true
  md: '# Chapter 14: Chasing Your Words Around the Page


    Because boxes are not part of your text, WordPerfect needs to decide where they
    should be placed on the page and what should happen to them if the text on the
    page changes. This last point, what happens when the text changes, is why the
    various settings all have the word anchor in their names: You anchor your box
    to some item in your document, and where that item goes, goes your box. You can
    attach boxes to a page, paragraph, or character by using the Page Anchor, Paragraph
    Anchor, or Character Anchor settings, respectively, in the Position dialog box.
    The rest of the settings in this dialog box depend on which type of anchor you
    choose.


    Anchoring your box to a page

    Boxes attached to pages don''t move relative to the page. Text can come and text
    go; this box, however, always appears in the same place on the page. Ah, but which
    page, you ask. It all has to do with codes, again. Creating a box in a document
    inserts another one of the secret codes we discuss in Chapter 9. The secret code
    moves with the text around it. If you add text, the code moves further along the
    document. If you delete text, the code moves further toward the beginning of the
    document. Your box appears on the page where the code is, but always at the same
    place on the page.


    If that''s not what you want to have, that''s okay, you can fix it. For example,
    if you want a box to appear always on page 2 and only page 2 of your document,
    create the box on page 2. Click the Graphics button on the Property Bar, choose
    the Position command to open the Box Position dialog box, and Select Put on Current
    Page (Page Anchor). The dialog box contains the settings shown in the leftmost
    version in Figure 14-8. Now your box stays on page 2, regardless of how much text
    you insert in it or how much text you delete. If you delete all the text from
    page 2, you may end up with a page containing only the box you created. That''s
    what you wanted, so that''s what WordPerfect does.


    You may think that specifying where your box will appear on the page would be
    straightforward, but WordPerfect gives you many options. To specify the horizontal
    and vertical position of the box. Relative to what, though? For horizontal position,
    you can specify that you want your box placed relative to the edges of the paper,
    relative to the margins of the paper, or to columns if you have any on your page.


    After you figure how to attach your box to page, you can choose figure relative
    to where. The the left or right margin or the center of the paper? Or the left
    edge of the paper (in the margins change)? The left column, the right column,
    or the center of the columns? Usually, you will want to choose to the left or
    right margin. Choose relative to the left edge of the paper if your box is big
    enough that it may not fit between the margins. You may need to experiment until
    you find what you like.


    ![](img/a2afb402c275cfc5e5a8f62356a922ef_284_0.png)'
  merge: -1
  pgno: 284
- img_proc: true
  md: '# 256 Part IV: Creating Documents That Don''t Sit There


    # Anchoring your page to a paragraph


    To attach your box to a paragraph, click the Graphics button on the Property Bar,
    choose the Position command to open the Box Position dialog box, and select Put
    Box in Current Paragraph (Paragraph Anchor). The dialog box contains the settings
    shown in the middle version of Figure 14-8. Boxes attached to paragraphs move
    with the paragraph they''re attached to. If you add text in front of your paragraph,
    your box moves down the page with the paragraph; if you remove text, your box
    moves up the page. WordPerfect where a box should appear relative to its paragraph
    is simpler than telling it a box should appear relative to a page. The horizontal
    options are pretty much the same. For vertical options, however, you can specify
    where the box should appear relative to the paragraph. In most cases, you want
    boxes to be placed relative to the paragraphs they''re near.


    # Anchoring your page to a character


    Boxes can also be attached to characters. You can think of this type of box as
    a special character you can draw by yourself. (If you really want to draw it,
    look at Chapter 15.) If you just want some text to move around in your document
    as though it were a character, however, you''re in the right place.


    To attach your box to a paragraph, click the Graphics button on the Property Bar,
    choose the Position command to open the Box Position dialog box, and select Treat
    Box as Character (Character Anchor). The dialog box contains the settings shown
    in the rightmost version of Figure 14-8. You have a dizzying array of options,
    course for where your box should go. Horizontally, it goes with the character
    after it. Vertically, however, WordPerfect lines up the top, center, or bottom
    of the box with the line of text. The Box Position dialog box does a nice job
    of illustrating your options. Guess is that you''ll want to use the Content baseline
    option, even though it sounds scariest. It just means the bottom of what''s in
    your box should line up with the bottom of the text.


    # Making a box exactly the right size


    As you may imagine, if dragging isn''t good enough for determining exactly where
    a box should be placed, that method also isn''t good enough for determining how
    big the box should be. To complement the Box Position dialog box, therefore, WordPerfect
    has the not-quite-so-massively-overcomplicated Size dialog box, as shown in Figure
    14-9. You display it by clicking on the Graphics button on the Property Bar and
    choosing Size. In the Box Size box, you can enter an exact height and width for
    your box. This feature is useful because it gives you the option of maintaining
    the proportions of your box. When you''re dragging the corners of the box around,
    you can stretch it like Silly Putty, which works better for some boxes than for
    others.'
  merge: -1
