  md: '# Chapter 11: On Paper at Last: Printing Stuff 199


    +   4. Change the Print Odd/Even Pages setting to print, either all the odd pages
    or all the even pages. To keep things simple, start with the odd pages. Click
    on OK to leave the Output Options dialog box, and click on OK again to print the
    odd pages.


    Remember that if your printer knows how to print on both sides of the page, you
    don''t have to go through these manual printing steps — see the preceding section
    instead. If you''re like us and your printer wouldn''t know duplexing from duplex
    printing (as in painting a dwelling that contains two residences), press on with
    the rest of these steps.


    +   5. Flip the paper over so that you''re ready to print the pages you didn''t
    the first time.


    After all the odd-numbered pages have been printed, put them back in the paper
    tray so that WordPerfect can print on the other side of the paper. Make sure that
    page 1 is printedside-side-down and on top so that Word prints page 2 on its back
    side. (You may have to turn each page individually, not just flop the stack).


    Also make sure that the paper is facing the right way so that page 2 isn''t upside-down
    and doesn''t print on the same side of the paper as page 1. Because the exact
    orientation you need depends on your printer, you may want to experiment with
    a short document and make notes so you know how to handle the pages next time.


    +   6. Repeat Steps 2–4.


    This time, choose the Even pages option in Step 4.


    # Printing several copies


    After you begin printing a document, you may want several copies. Hey, why not
    save yourself trip to the copying machine? Of course, if you''re printing 10 copies
    of a 25-page document on the only printer in the office, you may not make yourself
    popular with your coworkers, but that''s your decision.


    To tell WordPerfect how many copies to print, follow these steps:


    +   1. Make sure that your printer is hot to print.


    +   2. As usual, click on the Print button on the toolbar.


    Also, you can press F5 or choose Print to display the Print dialog box.


    +   3. In the Number of Copies box, enter the number you want.


    You can click on the little up- and down-arrow buttons to increase and decrease
    the numbers.'
