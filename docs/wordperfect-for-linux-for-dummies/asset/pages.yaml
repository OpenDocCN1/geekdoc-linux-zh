- img_proc: true
  md: '# Chapter 11


    # # On Paper at Last: Printing Stuff


    **In This Chapter**


    +   - Getting the printer ready

    - Printing parts of a document, an entire document, or several documents

    - Printing a document on disk

    - Canceling a print job


    Everyone has heard about the Paperless Office of the Future. Remember when computers
    were new and everyone claimed that after we all started using them, we could stop
    using paper? Lo and behold, look around your office. Do you see paper? Everyone
    seems to have twice as much paper as before — *that’s* much much paper you see.


    In real life, you usually want to print your documents, and this chapter talks
    about how to do it. For details about creating and printing some popular documents,
    including mailing labels and envelopes, see Chapter 17.


    # # Ready to Print?


    You have written and formatted your document, and it looks *m-a-ahvelous*. Now
    you’re ready to see how it looks on paper. Before you do so, how-ever, you had
    better be sure that your printer is ready to help.


    # # The basics


    Make sure your printer is plugged in to both the wall and your computer. The connection
    to the wall provides power, and the cable to your computer provides a way for
    the information in your document to get from the computer into your printer.'
  merge: -1
  pgno: 218
- img_proc: true
  md: '# 190 Part III: Things You Can Do with Documents


    Be sure that your printer has the appropriate ribbon, ink cartridge, or toner
    cartridge, depending on your printer — unless you''re interested in printing your
    document in white on white.


    You need paper, as you may have guessed. Your printer may use individual sheets
    of typing or continuous-feed perforated paper. Whatever your printer likes to
    eat, make sure that it has paper.


    You should also make sure that your printer is paying attention to what your computer
    has to say. Most printers can be either online or offline (either listening to
    the computer or not listening, respectively). These printers have an online light
    that tells you whether the printer is online and an online button you can switch
    between online and offline. If your printer is offline, it ignores any information
    your computer sends to; it''s like being turned off.


    If your printer uses sheets of paper, you may want to print drafts of documents
    on the other side of used paper. We keep a stack of paper with stuff on just one
    side and use it for everything except the final drafts of our documents.


    # Do Linux and WordPerfect know that you have a printer?


    Before WordPerfect 8 can print anything, Linux must know all about your printer.
    When you (or someone) installed Linux on your computer, you should have told Linux
    which printer (or printers) you have. To tell about your printers, ask the person
    who set up your Linux system whether a printer is installed or consult Linux:
    For Dummies, 2nd Edition, by Jon Hall, Craig Witherspoon, and Coletta Wetherspoon
    (IDG Books Worldwide).


    WordPerfect also needs to know which printer you have. To find out which WordPerfect
    thinks you have, you can display the Select Print dialog box by choosing File>Print
    (or pressing F5) or clicking the Print button on the toolbar to display the Print
    dialog box and then clicking the Select button. The Select Print dialog box, as
    shown in Figure 11-1, shows the printers WordPerfect knows about (if your computer
    is connected to a Local Area Network, or LAN, this list may include printers connected
    to other computers). If your printer doesn''t appear on the list, the Linux expert
    may be able to help.


    # Where''s the print preview feature?


    Some other word processors have a print preview feature to show you exactly what
    things will look like on the page. WordPerfect doesn''t have this feature because
    it does a good job of


    showing you what your document will look like while you''re editing it. Isn''t
    that WYSIWYG (What You See Is What You Get) is all about?'
  merge: -1
  pgno: 219
- img_proc: true
  md: '# Chapter 11: On Paper at Last: Printing Stuff 191


