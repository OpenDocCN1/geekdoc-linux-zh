  md: '# 336 Part IV: Creating Documents That Don''t Just Sit There


    The only problem is that the documents aren''t formatted as Web pages; probably
    also use all sorts of features that don''t work on Web pages.


    WordPerfect comes to the rescue. The Format As Web Document button in the Internet
    Publisher dialog (tell you how to use it in a minute) removes all non-Web-page
    formatting from your document. What you see onscreen after using this dialog box
    is the result of this button''s labors.


    ![](img/a2afb402c275cfc5e5a8f62356a922ef_365_0.png)


    Depending on how much formatting you did in your document, you''ll be more or
    less pleased with the result. If your document looks destroyed, you have two options:


    +   - Reformat the document as a WordPerfect document, using only the features
    that work in Web documents.

    - Fix the Web version by hand.


    The option you pick depends on how you intend to maintain your document:


    +   - To keep a WordPerfect version of your document (for printing on paper) and
    a Web version for people to look at, pick the first option. Although this option
    involves a little more work, you keep the document up-to-date in one place. Every
    time you change the WordPerfect version, you can convert it to a Web page again.
    Although you can''t make a fancy WordPerfect document, maybe that''s okay.

    - If you''re converting your documents for use on the Web, fix the Web version
    by hand, which is just a matter of using the available formatting features. The
    better you make a document look as a Web document, the more it differs from the
    original. That''s okay, although keeping two versions of the same document up-to-date
    with one another is usually difficult.


    You can also add to your document HTML features that WordPerfect has no idea about.
    Simply type the HTML codes in your document, highlight them, and choose Format=Custom
    HTML. (This command is available only over HTML. To do so, you have to know something
    about HTML when you''re editing a Web page.) Get a copy of HTML for Dummies, 3rd
    Edition, by Ed Tittel and Steve James (IDG Books Worldwide, Inc.).


    You have two — count ''em, two — ways to save your Web pages in WordPerfect. This
    shouldn''t surprise you because WordPerfect gives you a bunch of ways to do everything.
    In this case, however, it''s important to know when to use each one.'
