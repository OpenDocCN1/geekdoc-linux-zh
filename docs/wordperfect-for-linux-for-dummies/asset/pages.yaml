  md: '# Chapter 6: Charming Characters


    When you change the font size of some text, WordPerfect inserts secret codes,
    named (amazingly enough) Font Size.


    # Fonts of Wisdom


    Okay, okay — bad pun. We won''t let it happen again. Anyway, it''s time to talk
    about the heart of character formatting: the font, which is a fancy word that
    means something like typeface. (Or is it the other way around?) A typeface is
    a set of shapes for letters, numbers, and punctuation. A font is a typeface in
    a particular size and may also be in boldface and italics. The text you''re reading
    now, for example, is printed in the Cheltenham typeface. The section headings
    are printed in the Cascade typeface.


    When WordPerfect starts up, it usually displays and prints everything in a fairly
    nice-looking 12-point size type named something like Courier-WP.


    # Changing the font for some text


    To change the font in which some text appears, follow these steps:


    +   1. Select the text for which you want to change the font.


    +   2. Click on the little downward-pointing triangle beside the current font
    name (usually Courier-WP) on the Property Face Bar.


    WordPerfect refers to this thing as the Font Face button because it shows the
    typeface of the font you''re using. A list of available fonts appears to the left
    of the button. As you move the cursor over this list of font names, a sample of
    the font appears just to the right of the list.


    +   3. Choose a font from the list.


    Proof — the selected text changes to the new font. Although the Property Bar may
    not show it immediately, if you move the cursor to the section of text you just
    formatted, the Property Bar shows the font and font size in which that text is
    displayed.


    When you change the font for some text, WordPerfect inserts two formatting codes,
    one at the beginning and the other at the end of the text you formatted. The first
    code changes the font; the second one changes it back. It''s very logical. Even
    the name of the code is logical: Font.'
