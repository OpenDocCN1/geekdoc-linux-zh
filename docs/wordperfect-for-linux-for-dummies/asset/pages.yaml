    When you use the Font dialog box, WordPerfect sticks the appropriate secret formatting
    codes into your document. To get rid of them, you may have to read Chapter 9.


    # Formatting an entire document


    If you want to tell WordPerfect which font to use for an entire document, from
    soup to nuts? Every document has a document default font, which is the font WordPerfect
    uses for all text except where you specifically tell it otherwise. WordPerfect
    uses this font for not only the regular text in the document but also page headers
    and footers (described in Chapter 8) and footnotes.


    To set the default font, you use the Document Default Font dialog box. It doesn''t
    matter where the cursor is when you perform this little operation; make sure,
    however, that no text is selected. Then follow these steps:


    +   1. Choose Format>From the menu bar or press F9 to display the Font dialog
    box, as shown in Figure 6-1.


    +   2. Click on the Initial Font button.

    WordPerfect displays the Document Default Font dialog box, as shown in Figure
    6-2. In case you''re wondering, you can also display this dialog box by choosing
    File>Document>Default Font from the menu bar.


    ![](img/a2afb402c275cfc5e5a8f62356a922ef_135_1.png)


    Figure 6-2 Telling

    WordPerfect which font to use for an entire document.'
