    # Assigning Different Meanings to Keys


    WordPerfect has been around a long time. (The first versions of WordPerfect were
    before Linux, before Windows, and even before DOS. Not before UNIX, though.) As
    the world of software settled on certain standards for what the keys on the keyboard
    should mean, the folks at WordPerfect were in a quandary. Older versions of WordPerfect
    had always used the F3 key to display online help, for example, and WordPerfect
    users the world over used to it. Now the world of software, especially the world
    of Windows users, agrees that F1 — not F3 — is the key to use. What to do?


    > The answer: Wimp out and please everyone. WordPerfect gives you the opportunity
    to tell it which set of keyboard meanings you want to use: the old-fashioned WordPerfect
    meanings (WPDOS) or the newfangled standard meanings (called XPWR). These sets
    of meanings are stored as keyboard.


    Keyboard definitions don''t usually affect most keys on the keyboard. The Q key
    on your keyboard puts a Q on the screen, regardless of which keyboard definition
    you use (unless you create your own definition and get really perverse). The keyboard
    definition, however, controls the meanings of the function keys and which keys
    do what when you hold down Ctrl and Alt.


    As we mention in the introduction of this book, all instructions in this book
    assume that you''re a modern, 20th century kind of person and that you''re using
    the newfangled standard meanings of the keys (the WPWin keyboard definitions).
    The following steps show how you can check this out:'
