  md: '# Chapter 22


    # # Ten Awesome Tricks


    **In This Chapter**


    +   - Dragging and dropping text

    - Returning to where you were

    - Using QuickMarks and bookmarks

    - Reopening an earlier document

    - Inserting the date

    - Using unbreakable hyphens and spaces

    - Inserting bullets

    - Converting tabs to tables

    - Sending WordPerfect documents by e-mail

    - Using QuickCorrect to type long phrases automatically


    WordPerfect has more awesome tricks than a troupe of acrobatic elephants. Because
    personal taste varies, however, when it comes to “awesome,” we picked ten tricks
    that one person may find fabulously useful and another may find completely stupid.


    # # Dragging and Dropping Text


    The fastest way to move text within a document is just to highlight it, click
    on it, and drag it somewhere else.


    If you want to move or copy text from one document to another, copy it or cut
    it to the clipboard by pressing Ctrl-C (for copy) or Ctrl+X (for cut), move to
    the document and location where you want the text to appear, and press Ctrl+V
    to paste. You can paste as many copies as you want.


    Unlike in Windows and on the Mac, not all X programs share the same clipboard.
    You can''t always use cut and paste commands to copy or move information to or
    from another program. It''s worth a try, though!'
  merge: -1
  pgno: 406
- img_proc: true
  md: '# Part VI: The Part of Tens


    # Returning to Where You Were


    If you''re moving around a great deal between two places in your document, being
    able to switch easily is a nice feature. To go back to where you were, choose
    the Edit>Go command (or press Ctrl+G). Click on Last Position in the Go to To
    dialog box and then click on OK.


    # Going Back to the Old Same Place


    If you want to keep returning to one important place in your document, try using
    a QuickMark. Click in that important place and press Ctrl+Shift+Q (or choose Tools>Bookmark
    from the menu and click the Set QuickMark bookmark). Now you can go back at any
    time by pressing Ctrl-Q.


    If you''re dancing around several places in your document, you might choose using
    bookmarks. Highlight a word or phrase unique to that place, such as "little grass
    shack" (this serves as a name). Choose Tools>Bookmark to display the Bookmark
    dialog box and then click the Create button. Click on OK in the Create Bookmark
    dialog box to accept the highlighted text as a name. We talk more about this in
    Chapter 18.


    To go back to your little grass shack, press Ctrl+G to display the Go To dialog
    box, select Bookmark, select the name in the Bookmark box, and then click on OK.
    You can have several bookmarks in a document.


    # Reopening an Earlier Document


    WordPerfect keeps track of the last nine or so documents you worked on. To reopen
    them, click in the WordPerfect program window (the one with the WordPerfect logo),
    click on Program on the menu bar, and then click on any document listed at the
    bottom of the drop-down menu.


    # Inserting the Date


    WordPerfect gives you two — count ''em, two — ways to put today''s date in your
    document. Choose a method:


    +   - Insert today''s date as though you typed it. Press Ctrl+D, or choose the
    Insert>Date/Time command and click on the Insert button. This command inserts
    the text of today''s date.'
  merge: -1
  pgno: 407
- img_proc: true
  md: '# Chapter 22: Ten Awesome Tricks


    Insert a secret date code that changes to the current date every time you open
    the document. Press Ctrl+Shift+D or choose the Insert+Date/Time command, click
    on the option labeled Keep the inserted date current, and click on the Insert
    button.


    The Insert+Date/Time command lets you specify the format of the date. The Date/Time
    dialog box, as shown in Figure 22-1, lets you choose any format, from European
    to American to Martian. This command also lets you insert the, with or without
    the date.


    ![](img/a2afb402c275cfc5e5a8f62356a922ef_408_0.png)


    # Using Unbreakable Hyphens and Spaces


    Normally, when you insert a hyphen, WordPerfect takes that action as a license
    to break the line there, if necessary. This breaking capability is inconvenient
    for compound terms, such as “Figure 1-17” or phone numbers, as 555-1212, which
    should always appear unbroken. For these types of things, you should insert unbreakable
    (hard) hyphens by pressing Ctrl+-, Likewise, you can also insert hard spaces,
    which prevent a line break between two words, by pressing Ctrl+spacebar.


    # Chasing Speeding Bullets


    To bulletize a bunch of paragraphs, select them and choose Insert+Bullets & Numbering.
    You see the Bullets and Numbers dialog box. Select the bullet style you want from
    the Style list. Then click on OK. Your paragraphs have tasteful (or not so tasteful,
    depending on what you picked) bullets in front of them.'
  merge: -1
  pgno: 408
- img_proc: true
  md: '# 380 Part VI: The Part of Tens


    If you want new paragraphs to be bulleted also, move the cursor just after the
    last word in the last paragraph that has a bullet on it. Press Enter, and the
    next paragraph receives a bullet. If you want to see what''s really happening,
    check out the hidden codes, as described in Chapter 9.


    You may also notice that your paragraphs are indented. The Bullets and Numbers
    dialog box has applied a style to your paragraphs. You can edit this style. Use
    the Insert>Bullets & Number command to bring up the Bullets and Numbers dialog
    box again. Use the Edit button on the right side of the box lets you change the
    formatting of the bullet style you selected. Go crazy. The key to editing styles
    is in Chapter 10.


    # Converting Tabs to Tables


    Sometimes you wish that you could create a table the old-fashioned way: by using
    plain old text with tabs in it rather than choosing the Insert>Table command and
    filling in the cells. This capability is also valuable when you are importing
    unformatted text from some other program, so WordPerfect doesn''t know that the
    text is supposed to be a table.


    WordPerfect helps you create a real WordPerfect table from tabular text. Each
    row of the table-to-be must be a line that ends with a hard return (the HRT secret
    code; refer to Chapter 9). To insert a hard return at the end of a line, place
    the cursor there and press the Enter key. Within each line, separate columns by
    pressing the Tab key. Use only one tab character: If the columns don''t line up,
    use the ruler to move the tabs around until the columns look right.


    ![](img/a2afb402c275cfc5e5a8f62356a922ef_409_0.png)


    Be sure to save your document before converting text to a table — the Undo command
    doesn''t reverse this process!


    Highlight all in the entire table-to-be. When you press F12 (which is the same
    as choosing Insert>Table), a Convert Table dialog box appears, shown in Figure
    22-2. Click on Tabular Column and then on the OK button. Zap! You''re amazed.
    The column is probably a little large, stretching all the way to the right margin.
    To reduce its width, move the mouse pointer over the right edge of the column
    until it changes form; then click and drag it to the left until the width is what
    you want. You can also drag any of the column divider lines to change the widths
    of the columns. You may also find that you have a blank row at the end of your
    table. If you want to get rid of that line, click in the row, click the Delete
    button on the Property Bar, and choose the Delete command to delete the row.'
  merge: -1
  pgno: 409
- img_proc: true
  md: '# Chapter 22: Ten Awesome Tricks 381


    ![](img/a2afb402c275cfc5e5a8f62356a922ef_410_0.png)


    # # Sending Your Document By E-Mail


    Attaching a WordPerfect document to an e-mail message couldn''t be easy! Choose
    File->Send to Mail from the menu bar to display the Send UNIX Mail dialog box,
    as shown in Figure 22-3. (WordPerfect may prompt you to save your document.) Address
    the message by typing the address in the To box, enter a subject in the Subject
    box, and type in the Message box a message to accompany your file.


    ![](img/a2afb402c275cfc5e5a8f62356a922ef_410_1.png)


    When you click on OK, WordPerfect composes an e-mail message with the information
    you specified, attaching the current document. If your computer isn''t connected
    to the Internet, nothing happens, of course. If you''re on a LAN with a connection
    to the Net, however, the mail goes through!'
  merge: -1
  pgno: 410
- img_proc: true
  md: '# Type It Again, Sam!


    Sometimes, you need to type a long name or address over and over. To relieve your
    fingers, think of an abbreviation for the long name and then tell the WordPerfect
    QuickCorrect feature to replace the abbreviation — when-ever you type it — with
    the long name. For example, if you frequently have to type IDG Books Worldwide,
