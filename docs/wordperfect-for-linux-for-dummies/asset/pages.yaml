    Don''t try to remember all this stuff. We talk about various instances of dialog
    things as we go along, but you can refer to this list if you ever run into an
    unfamiliar one.


    # Our favorite buttons


    Two common and important buttons in dialog boxes are the OK and Cancel buttons.
    Clicking on OK means “Do it—and do it the way this box say to do it.” Clicking
    on Cancel means “Forget it—I didn’t really want to do this. Get me out of here
    and ignore everything I said in this box.”


    "Forget it" apparently is a popular choice because WordPerfect lets you do the
    same thing in two ways:


    +   - Press the Esc key on the keyboard.


    +   - Click on the Close box on the window border (usually the button with the
    X in the upper-right corner of the dialog box).


    ![](img/a2afb402c275cfc5e5a8f62356a922ef_67_0.png)


    # Pinky finger alert!


    When you use dialog boxes, you should be beware of two keyboard keys: Enter and
    Esc, which mean the same as the OK and Cancel buttons, respectively. This caution
    applies even if you''re typing something in a dialog thing. Keep a watchful eye
    on your pinky fingers, lest they unwittingly lead you astray by pressing Enter
    or Esc before you''re truly finished with the dialog box.'
