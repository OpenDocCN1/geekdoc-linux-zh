  md: '# Chapter 10: Documents with Style


    ParagraphFont sneak up all the things in character styles (that''s all the FormatFont
    stuff) along with paragraph things like center or right justification (you can
    read about them in Chapter 7, tab settings, and borders around paragraphs (which
    we talk about in Chapter 14).


    # Creating and Applying a Style


    The key to everything about styles lurks at the bottom of the Format menu: the
    FormatStyles command. If you think that you already understand styles, the brave,
    foolish, or knowledgeable can launch into the FormatStyles command. Good luck.


    The rest of us will sneak up on styles a little more slowly. Rather start with
    the FormatStyles command, we begin formatting a bunch of text the way you want
    it, as an example. We record that formatting as a style. Because this method is
    straightforward and fast, WordPerfect calls it QuickStyle. This section explains
    how to do it.


    # Creating a style by using QuickStyle


    Remember that WordPerfect has two kinds of styles: character and paragraph. We
    start by using QuickStyle to create a character style. Suppose that you want foreign
    words in your document to be in bold and italic. You can do it easy way by creating
    a style named Foreign and applying it to all the foreign words in your document.
    These steps guide you through this process:


    +   1. Format some text in bold and italics as an example for WordPerfect.

    Position the cursor anywhere in the formatted text.


    Preferably, select some text which you want to apply the style anyway. To format
    in bold and italic, select the text and then press Ctrl-B and Ctrl-I.


    +   2. Click on the Select Styles list on the Property Bar (click the downward-pointing
    triangle button to the right of the Select Styles box) and select QuickStyle at
    the bottom of the list.


    The Select Style list on the Property Bar is the drop-down list just to the left
    of the "abc" button; it usually says <None> until you started creating styles.


    WordPerfect has a bunch of predefined styles; we talk about those in a minute.
    For now, concentrate on QuickStyles. The Styles QuickCreate dialog box appears,
    as shown in Figure 10-1.'
