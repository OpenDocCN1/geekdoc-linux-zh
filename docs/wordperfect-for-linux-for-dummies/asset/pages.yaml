  md: '# Part IV: Creating Documents That Don''t Sit There


    ![](img/a2afb402c275cfc5e5a8f62356a922ef_271_0.png)


    # Putting selected text in columns


    Sometimes, you want to put a block of text in columns. You may put a long list
    of words, such as in a packing list, into several columns to save space, for example.


    Begin by highlighting the block of text you want to collomate. Columnize? Next,
    choose the Format> Columns command. In the Columns dialog box, choose the style
    you want. The Balanced Newspaper option probably


    works best, unless you want to control where the columns break, in which case
    you use the Newspaper option. Then click on OK. If you want newspaper columns,
    you can click the Columns button on the toolbar. Choose the number of columns
    you want and you''re all set.


    Using highlighted text in this way is equivalent to turning columns, putting all
    the text in the block, and then turning columns off.


    # Bad breaks and what to do about them


    Some breaks are good, and some are bad — column breaks, that is. WordPerfect decides
    where to break your columns depending on many things, and it''s different for
    different kinds of columns. When columns don''t break where you want them to (or
    break where you don''t want them to), you can regain some control by inserting
    hard column breaks.


    To insert a hard column break, follow these steps:


    +   1 Place the cursor before the line (or word or character) where you want a
    column to begin.


    +   2 Press Ctrl-Enter to insert a hard column break.


    Column breaks don''t always do what you think they do. It depends on which column-type
    option you choose: Newspaper, Balanced Newspaper, or one of the Parallel styles.
    The following list shows the types of columns in the column-break story:


    +   Newspaper: Column breaks begin a new column in the way you think that they
    should.


    +   Balanced Newspaper: A column break begins a new block of balanced columns;
    it''s almost like turning columns off and then on again. This style probably isn''t
    what you have in mind if you''re trying to fix the way WordPerfect has balanced
    your columns. Rather than use a column break to change the balance, try regular
    newspaper columns.'
