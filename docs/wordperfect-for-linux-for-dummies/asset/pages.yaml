  md: '# Part IV: Creating Documents That Don''t Just Sit There


    # Jumping to a bookmark


    After you''ve created a bookmark, jumping to it is easy. From anywhere in your
    document, press Ctrl+G (or choose Edit:Go To), click on the Bookmark option, and
    choose the bookmark name from the list. When you click on OK, you zip right to
    the location of the bookmark.


    This trick is great if you''re looking at the document onscreen, but useless for
    the reader of the printed document.


    # Creating a hyperlink — a way to jump somewhere


    If you plan to read your document on the screen, or allow others to do so, you
    can create hyperlinks in the text that help the reader jump to related text. Consider
    Chapter 23, "Ceremonial Uses of Chocolate," in the tome we are writing in this
    chapter. In a traditional book, you may say something like "The first ceremonial
    use of chocolate occurred in Aztec society long before the European discovery
    of America (see Chapter 1)." The reader then flips to Chapter 1 and skips to see
    whether it says anything about Aztecs. This method works fine on paper but is
    a little awkward on a computer screen, especially the flipping part. We can create
    a link, therefore, directly to the specific paragraph in Chapter 1 in our tome
    on chocolate.


    Follow these steps:


    +   Create a bookmark at the place to which you will be able to jump in whatever
    document you''re writing, and then save the document.


    In Figure 18-1, we just finished creating a bookmark on the word Aztec Chapter1.


    +   Open the document that contains the place from which you want your reader
    to be able to jump.


    In this case, it''sChapter23.


    +   Highlight the words you want a user to be able to click on.


    In this case, we may select a reference to the Aztecs at the beginning of Chapter
    23.


    +   Choose Tools:Hyperlink.


    The Create Hypertext Link dialog box appears, as shown in Figure 18-2. In this
    box, you tell Word what you want to have happen to the person who clicks on the
    link you''re creating. Right now, we just create a link back to the Aztec bookmark
    in Chapter 1.'
  merge: -1
  pgno: 353
