- img_proc: true
  md: '# Chapter 10: Documents with Style 183


    # # Revealing your secret style codes


    If you understand the secret codes in WordPerfect (refer to Chapter 9), you probably
    understand the bottom window in the Styles Editor dialog box. The window shows
    how codes are being encapsulated in the style, just as a Reveal Codes window does.


    When WordPerfect applies a paired (character or paragraph) style to your document,
    it uses pairs of codes to bracket the affected text. These codes use only the
    style name, which gives you complete freedom to edit the definition without putting
    a bunch of screws in your text. When WordPerfect applies an open (document) style,
    it uses single codes—again, using only the style name. Magically, these (unused)
    style codes can apply character formats, as bold text — bold text requires a paired
    code (refer to Chapter 9). Works anyway— go figure.


    Moreover, you probably understand how character and paragraph styles are denoted
    as *(paired)* or *(open)* in the Type box in the Styles Editor. *Paired* styles
    contain paired style codes; *open* styles contain single, unpaired style codes.


    # # Creating a document style


    A few seconds earlier, we say that WordPerfect has two (really three) kinds of
    styles. Well, it''s time to talk about that third kind: document styles. Sometimes,
    you want to create a style that applies beginning at a certain point and perhaps
    everything past that point. This type of style, a *document style*, is a little
    weird. Unlike character and paragraph styles, a document style has no predetermined
    point at which it ends. As a result, it continues until another style begins.


    Document styles can include not only the formatting you normally apply with the
    Format<Page command but also the codes for anything else you choose from the Format
    menu, including Font, Line, Paragraph, and Column commands. For that matter, document
    styles can include the codes for darn any command you choose from the Insert,
    Tools, Graphics, and Table menu, including insert page breaks, change headers
    and footers, insert dates, insert graphics, or make quickening noises (if you
    go for that sort of thing and your computer speaks).


    Using a document style is a good way to set up the overall layout of a document,
    including its margins, the paragraph formatting for most paragraphs, and the font
    for most text.


    You cannot create a document style by using the QuickStyle method; we just described.
    You must use the Styles Editor method. For Type, select Document. Aside from that,
    the style behaves pretty much like a regular style.'
  merge: -1
  pgno: 212
- img_proc: true
  md: '# Applying a document style


    To apply a document style, first position cursor where you want the style to begin
    (probably at the beginning of a paragraph, and possibly at the beginning of a
    page). If your document style inserts anything, such as page breaks, they appear
    wherever the cursor is when you turn on the style.


    # Turning Off Styles and Chaining Styles


    Suppose that you have applied a style and you''re merrily typing along, updating
    your résumé to include the phrase "Mastery of WordPerfect styles." You finish
    a delightfully styled paragraph, press Enter, and begin—you start another similarly
    styled paragraph. Although this automatic spawning of a similarly styled paragraph
    is a lovely feature, what if you don''t want another similarly styled paragraph?


    Or, suppose you''re typing a letter to Aunt May in a character style that uses
    the lovely ShelleyVolante font and you want to turn it off to write a more legible
    note to nearsighted Uncle George. Do one of these two:


    +   - To turn off a paragraph style in the paragraph in which the cursor is located,
    click on the arrow next to the Select Styles button on the Property Bar and then
    click on <None> on the list.

    - If you have been typing in a character style and now want to turn it off for
    the following text, press the right-arrow key on your keyboard. This step moves
    the cursor past the secret style-end code. When you type again, the style is no
    longer in effect.


    # Recycling Styles


    Reusing work you have already finished is always a smart idea, and styles help
    you reuse your formatting efforts. You can reuse styles in either of two ways:


    +   - Retrieve them from an existing document into a new document.

    - Save them in another file.


    # Dragging in styles from another document


    Retrieving styles from another document is the lazy way to use a style you''ve
    already created and, therefore, our favorite. Follow these steps:'
  merge: -1
