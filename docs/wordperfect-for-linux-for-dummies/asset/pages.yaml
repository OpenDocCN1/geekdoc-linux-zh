    # Changing the Line Spacing


    If the stuff you write is sent to an editor (as ours is — pity the poor woman!),
    you probably have to double-space your text to leave lots of room for making corrections,
    expressing confusion, and doing some general doodling. Unfortunately, WordPerfect
    can accommodate you:


    ![](img/a2afb402c275cfc5e5a8f62356a922ef_156_0.png)


    +   1. Move the cursor to the point at which you want the line spacing to change.
    To change the line spacing for the entire document, move to the beginning of the
    paragraph by pressing Ctrl+Home. To change the line spacing for a paragraph or
    two (for a long quotation, for example), select the paragraphs you want to change.

    2. Choose Format:Line-Spacing.

    WordPerfect displays the Line Spacing dialog box, as shown in Figure 7-6.


    ![](img/a2afb402c275cfc5e5a8f62356a922ef_156_1.png)


    +   3. Enter a number in the Spacing box. Enter 2 to get double-spaced text, for
    example. You can also enter fractions or decimals. To add just a little space
    between the lines, you can enter 1.1 or 1.2. Click on the little arrows at the
    right end of the Spacing box to increase or decrease the number in the box a tad.

    4. Click on OK or press Enter to dismiss the dialog box. (Shoof!)

    WordPerfect does your bidding and adds the vertical space you requested between
    each line of text.'
