    in the Help window work just like Web pages. You can click on one of the green
    hyperlinks to see the Help information for a particular topic.

    **Search for Help on:** WordPerfect Help opens the Help window and a separate
    Search window that displays a list of all topics, arranged alphabetically. As
    you type the first few letters of the topic you''re interested in, WordPerfect
    displays the index entry that starts with what you typed.

    **Expert:** This tool helps you compose a document. Read the following section
    to help you decide how helpful this feature is.

    **Macros:** Macros are a way to combine a bunch of keystrokes into a miniprogram.
