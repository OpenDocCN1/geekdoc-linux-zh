  md: '# Sharpening your tools


    Here''s the cool thing about the toolbar: You can tell WordPerfect which buttons
    you want on the bar. You can even make your own buttons.Then you can make different
    sets of buttons for different kinds of documents you work on — one set of buttons
    for writing memos, perhaps, and a different set of buttons for writing reports.


    Fortunately, we don''t tell you how to do all this stuff right now. We want to
    warn you, though, in case someone else set up specialized toolbars on your computer,
    in which case the buttons on your toolbar change mysteriously when you use different
    documents. If you think this feature sounds as cool as we think it does, check
    out Chapter 19 for details.


    The first thing to know about the toolbar is that it''s not always displayed.(This
    knowledge should be reassuring if you''re not frantically looking for rectangular
    buttons with pictures on them.) The second thing to know is that the toolbar is
    not the same as the Property Bar, which has even more cryptic buttons. If you''re
    not sure which bar you''re looking at on the screen, check out Figure 1-6 in Chapter
    1.


    If you don''t see the toolbar, you can display the box by opening the Menu view
    and clicking on Toolbars. Make sure that the box beside the WordPerfect 8 Toolbar
    is selected and click on OK. Notice that you may not have the same buttons on
    your toolbar that we have on. If that''s the case, the person who set up your
    software decided to change the buttons. If he went to all that trouble, probably
    had a good reason, and you should ask him to explain what he had in mind.


    Toolbar buttons are quick ways to do everyday things — things you can do with
    menus that take longer to do. To use a toolbar, click on the left mouse button.
    Some buttons are self-explanatory and simple, such as Print. If you want to print
    a document, you click the Print button. Thanks again to the Department of Redundancy
    Department (again), you can also print by choosing Ellie''s or pressing F5. Some
    buttons, such as Text Box, do things that are a little more complicated. If you
    want more explanation about a button, just move the pointer to it (don''t click).
    A little birdie — aonde, we mean a little bird delivers a one-liner about the
    toolbar and lists the keyboard equivalent, if it has one.


    If you decide that you dont like the adorable little pictures on the toolbar,
    open the Menu view, click on Toolbars, and unselect WordPerfect 8 Toolbar checkbox.


    Throughout this book, we tell you when a button on the toolbar would be useful.
    In Chapter 1, for example, we use toolbar buttons to open, save, and print documents
    in one fell click.'
