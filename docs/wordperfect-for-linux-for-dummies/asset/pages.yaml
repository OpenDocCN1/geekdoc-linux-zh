    # Setting Your Preferences


    The process of teaching WordPerfect how to behave is generally simple: You tell
    WordPerfect your preferences, and it whips into line. Wouldn''t it be nice if
    everyone worked this (especially your teenager)?


    You tell WordPerfect what you want by using the PrPreferences command (over there
    in the little WordPerfect program window), which displays the Preferences dialog
    box, as shown in Figure 19-1.


    ![](img/a2afb402c275cfc5e5a8f62356a922ef_376_0.png)


    This dialog box has nifty icons — rather than dull, boring boxes and buttons you
    use in most dialog boxes — for the different types of preferences you can express:


    +   **Display**: What WordPerfect displays onscreen, including what the ruler
    includes; how the Reveal Codes window looks; and whether you want to see symbols
    where your spaces, tabs, and returns are. We describe these settings in detail
    in the section “Changing the Way WordPerfect Looks” later in this chapter.


    +   **Environment**: Miscellaneous stuff that didn''t fit into any of the other
    preference categories.


    +   **Files**: Where WordPerfect stores your documents, templates, macros, and
    other files; and whether you want to keep backups of your files. This stuff is
    described later in this chapter.


    +   **Summary**: How document summaries work and when you want to see them (if
    ever).'
