  md: '# Part I: Introducing WordPerfect for Linux


    That''s why you have a mouse, traceback, or other pointing device next to your
    keyboard. To avoid disgruntling the folks who have already put a great deal of
    effort into refining their keyboard style (such as old UNIX users), WordPerfect
    for Linux also enables you to order it around the old-fashioned way: by using
    the keyboard.


    The result of all this highly obligatory, verging-on-sycophantic user-friendliness
    is that you now have three more or less alternative ways to order WordPerfect
    for Linux:


    +   - The regular keyboard, with letters, numbers, and stuff.

    - The function keys, labeled F1 through F12.

    - The mouse, which you can use by itself in about three ways to command WordPerfect.(Try
    not to think about this for now.)


    Another result of all this is that the keyboard and screen begin to resemble the
    cockpit of a jet fighter. As you face jet fighters, the important thing is not
    to let it intimidate you. It''s a friendly jet fighter (oxoronically speaking),
    and you can''t crash and burn. You can''t hurt any hardware on your computer,
    and it''s to damage the software or data unless you''re willing to answer Yes
    to a number of intimidating questions. About the worst you can do is lose whatever
    work you have done since the last time you used WordPerfect, and even that''s
    hard to do.


    If you''re already windows-familiar and keyboard-qualified, you can just skim
    the next two sections of this chapter to pick up the WordPerfect peculiarities.
    If you''re switching to Linux from Windows or a Mac, follow along—— you''ll find
    everything very familiar.


    # To Mouse or Not to Mouse


    Because of the popularity of the "point and grunt" method (hereafter called point-and-click,
    to be nice), mice are taking over the world. Accept this fact, and learn to love
    your mouse. WordPerfect for Linux is designed for the mouse, even though you can
    also do almost everything by using the keyboard.


    Most people eventually find a particular combination of mousing and keyboardification
    that suits them. Because mice are the cat''s pajamas, this book generally emphasizes
    the mouse method and also lists the alternatives.


    On most PCs, the mouse generally wears two buttons; UNIX systems have always used
    mice with three buttons. If your Linux system was set up from the beginning to
    be just like a Real Gownup UNIX Computer, it probably has a three-button mouse.
    If, like most Linux computers, it started out life as a PC'
