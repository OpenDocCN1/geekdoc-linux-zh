    To perform multiplication and other simple calculations, such as computing the
    percentage change from year to year, you can use these''symbols in your formulas:


    +   * (Multiply)

    * (Divide)

    * (Add)

    * (Subtract)


    You can access other formulas by clicking on the Functions button on the Formula
    Bar, but, hey — it''s all ready stuff for a mere word processing program.


    # Formatting the numbers in your complex spreadsheet


    To get your numbers to look as pretty as ours do in Figure 14-6, with dollar signs
    and stuff, click in a cell you want to format, click on the Table button on the
    Property Bar, and choose Format (or press Alt+F12). You see the Number Type dialog
    box, which enables you to format an individual cell or the entire table. Rather
    than fool with the details you defined your numbers, WordPerfect has some number
    types, such as fixed (decimal-point numbers), scientific, currency, and accounting.
    Choose the number type you trust and that WordPerfect will make your numbers look
    right. If it doesn''t, you can always specify a different number type. In the
    Number Type dialog box, specify whether you want to format the cell cursor is
    in, the column, or the entire table. Click on a selection in the Available Types
    section (check out the example in the Preview section) and then click OK.'
