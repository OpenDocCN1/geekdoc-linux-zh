  md: '# Taming the roar of the mighty thesaurus


    To see the Thesaurus, choose Tools from the WordPerfect menu bar. The Thesaurus
    is actually a useful feature if you like to spice up your writing with a variety
    of words. The Thesaurus dialog box gives you a list of words synonymous with the
    word you have selected. To have the thesaurus eat your words, do the following:


    +   1. Double-click on the word in your document to highlight it.

    For that matter, you can highlight it in any one of a dozen other ways — refer
    to Chapter 4 for the gory details.

    2. Click on Look Up in the Thesaurus dialog box.

    A list of possible replacement words appears below the original word in the Thesaurus
    dialog box.

    3. To look at synonyms of any word the Thesaurus suggests, double-click the word.

    When you double-click on the suggestion, WordPerfect looks up the word and its
    synonyms appear in the next column in the Thesaurus dialog box.

    4. To use one of the Thesaurus suggestions, click on the word and click on Replace.

    Clicking Replace inserts that word in your document.'
