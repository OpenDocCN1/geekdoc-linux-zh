  md: '# Chapter 15


    # # Say It with Pictures


    **In This Chapter**


    +   - Working with graphics

    - Using clipart

    - Using pictures from anywhere

    - Drawing your own graphics

    - Handling complicated pictures

    - Dealing with graphs and charts


    Michelangelo had fewer tools for painting the Sistine Chapel than WordPerfect
    for creating graphics. For art''s sake, that''s probably a good thing. Otherwise,
    Michelangelo''s descendants would still be figuring out how many degrees to rotate
    whom and which color palette to use.


    For that matter, Michelangelo probably didn''t think that he was creating graphics;
    he probably thought that he was painting. You probably don''t think that you''re
    working with graphics either you just want to put a simple picture in your document.
    That''s okay — you probably didn''t think that you were word processing; you probably
    thought that you were writing. Translating from computerese, ''working with graphics''
    means ''finding and creating pictures and stuff like that and then putting them
    in your documents.''


    We asked the Assumption Fairy (the patron spirit of mathematicians) to grant two
    Simplifying Assumptions about what you may want to do. Assume that the tasks you
    want to do are limited to the ones in this list:


    +   - Insert a picture, diagram, or chart that someone has created for you or
    came with WordPerfect.

    - Create a simple picture or chart.'
