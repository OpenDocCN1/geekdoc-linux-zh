    designate the Alt+key combinations that choose the command. To save a file, you
    can press Alt+F and then press S. If the preceding information gibberish to you,
    read the section "Choosing commands by using keys," later in this chapter. Warning:
    Your Alt may not work for issuing WordPerfect commands, depending on how your
    X Windows System is configured.


    # Those wacky dialog thingsies


    This section shows some of the things (called dialog thingsies herein) you may
    find in a dialog box:


    +   - Stuff to check off: These items have a little square box or diamond to their
    left. Although these boxes and diamonds don''t have actual check marks, in a typical
    display of software logic, they''re called check boxes anyway. Any type of item
    can be on (selected) or off (not selected). Click on the little box or diamond
    to select or deselect the item. The Font dialog box, for example, has a bunch
    of check boxes that tell WordPerfect to decorate your fonts.


    +   - Lists of options: You can tell which item is selected because it has a little
    box around it or is displayed in a different color. You want. In the Font dialog
    box, Font Face and Font Style are examples of these kinds of lists.


    +   - Lists of options (although you only see one option): On lists of options,
    WordPerfect shows only the option that is selected. Options usually have a little
    rectangular button-looking thing near the right side of the option. To see all
    the options, click on the box containing the text. In the Font dialog box, for
    example, Position and Relative Size are examples of this kind of list.


    +   - Boxes in which you type: Click on one of these boxes (a text box) to highlight
    it and type stuff. For example, you can type a filename or a new font size.


    Don''t press Enter when you finish typing in a text box. If you do, the dialog
    box closes and WordPerfect begins executing the command immediately, even if you''re
    not finished. When you''re done typing, press Tab or click on another option.'
