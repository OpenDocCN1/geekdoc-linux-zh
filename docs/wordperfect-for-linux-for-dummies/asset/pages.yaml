  md: '# 192 Part III: Things You Can Do with Documents


    ![](img/a2afb402c275cfc5e5a8f62356a922ef_221_0.png)


    # Where''s the printer?


    If your computer is connected to a network and you use a network printer, someone
    else is probably in charge of making sure that the printer is connected to all
    the right cables. You should still check to make sure that the printer has paper,
    however, because the guy in the next cubicle may have the annoying habit of


    printing 200-page reports without refilling the paper tray.

    You may also want to talk to your network administrator to find out which types
    of printers you can use and which Linux on your computer knows how to print on
    them.


    ![](img/a2afb402c275cfc5e5a8f62356a922ef_221_1.png)


    WordPerfect now knows which kind of printer you have.


    Even after telling WordPerfect about your printer, you may have trouble printing.
    Linux might not be able to figure out how to send information to your printer,
    or the printed results may be strangely formatted. If so, you need to talk to
    a Linux wizard for help — be armed with much information about your printer as
    you can, along with a warm batch of chocolate chip cookies.


    # Printing the Entire Document


    WordPerfect gives you a good idea of what your document will look like when it''s
    printed. If you use Page view (by choosing View>Page), you can even see where
    your headers and footers appear, as well as the top and bottom margins of the
    pages. (Chapter 8 describes Page view and the other views WordPerfect provides.)
    You cannot get the total effect, however, until you see your document on paper.


    These steps show you how to print your document:


    +   1. Make sure your printer is turned on, and ready to print.

    Make sure the right kind of paper is loaded — recycled paper for drafts and nice,
    new blank paper for final versions, letterhead, or whatever. We always keep a
    stack of paper near our printer with embarrassing first drafts printed on one
    side, ready for less embarrassing second drafts to be printed on the other side.


    +   2. Save your document, just in case something during happens while you''re
    printing it.


    Practice safe printing!'
  merge: -1
