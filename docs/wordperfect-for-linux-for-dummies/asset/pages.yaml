  md: '# 80 Part I: Introducing WordPerfect for Linux


    In the normal scheme of things, the search for the word sanity requires a journey
    of only two, or perhaps three, steps in a WordPerfect dialog box:


    +   Choose Edit:Find and Replace from the menu bar or press F2.


    The Find and Replace Text dialog box, as shown in Figure 5-2, springs to your
    aid.


    ![](img/a2afb402c275cfc5e5a8f62356a922ef_109_0.png)


    Figure 5-2: The Find and Replace dialog box.


    +   2. Type the text you''re looking for.

    It appears in the Find box, where you can edit it (if you want) by moving the
    cursor around, pressing the Backspace and Delete keys, and so on.


    +   3. Click on Find Next (or press Enter) to search toward the end of the document.


    +   4. To search toward the beginning of the document, click on Find Prev.


    If you''re looking for exists, it appears highlighted in the document window.
    If the text that WordPerfect found isn''t the precise instance of the text you
    want, just click on Find Next or Find Prev again until you get it.


    If your quest is futile, WordPerfect displays a window saying that it cannot find
    the text. Reassure it that you''re not mad by clicking on the OK button.


    The Find and Replace Text box stays stays even after you''ve done some finding
    and replacing, in case you want to do some more. The dialog box hangs until you
    click its Close button.


    # Changing the way you search


    When you thought that WordPerfect couldn''t have any more menus, here''s another
    one. The Find and Replace Text dialog box has its own little menu bar. If Find
    and Replace is working the way you want, recommend you pretend that that little
    menu bar doesn''t exist. If Find and Replace is driving you crazy, look here to
    see whether you can get it to behave a little more to your liking.'
