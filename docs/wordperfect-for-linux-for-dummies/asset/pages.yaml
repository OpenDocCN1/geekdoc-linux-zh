    button, click on to bring WordPerfect back to life. Is it still breathing? Whew!


    +   - The Close button is the rightmost of the three tiny buttons in the upper-right
    corner of the WordPerfect document window; in KDE, the button has an X on. Clicking
    on the Close button is just easy as clicking the X on. If WordPerfect disappeared
    without protest, however, you must have saved your open document before you closed
    it by mistake. If mistakenly closed your document window, the WordPerfect program
    window should still be on your desktop or on the taskbar. Simply switch to the
    WordPerfect program window and reopen your documents; they should be on the list
    of recently opened documents, at the bottom of the Program menu.


    If you click on the Close button in the WordPerfect program window, the whole
    program stops running and WordPerfect closes any document windows you have open
    (after asking whether you want to save any documents you''ve edited). Run WordPerfect
    again, open your documents, and you''re ready to roll!


