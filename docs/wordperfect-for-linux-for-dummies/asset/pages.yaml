    # Dealing with real words that WordPerfect doesn’t know


    Perhaps the WordPerfect spell checker can be forgiven for not knowing uncommon
    names, such as Margy. It’s still annoying, though, to have to repeat-skip names
    and other real words that are unknown to the WordPerfect dictionary. The solution
    is to add these words to the spell checker’s dictionary so it skips them every
    time you use the spell checker.


    WordPerfect has many dictionaries. It checks at least the following two dictionaries
    whenever you run the spell checker:


    +   ✓ A main dictionary of official, genuine English (or other-language) words


    +   ✓ A supplementary dictionary of anything else you consider to be a word


    The spell checker can also check additional supplementary dictionaries, such as
    document dictionaries and special-purpose, or topical, dictionaries.'
