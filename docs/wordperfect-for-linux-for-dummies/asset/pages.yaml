    you the simplest way to use Help. We recommend for all the fancy stuff that you
    play around in Help to help your heart''s content. You can''t break anything,
    and you may learn a great deal.


    # Help


    The simplest part is calling for Help: Click Help (way over the right end) on
    the menu bar. At this point, it''s a good thing that you''re not literally drowning
    when you call for help in WordPerfect, because now you must decide precisely how
    you''re going to ask for help. When you choose Help, you see a Help menu with
    three options at: Contents, Search for Help on, and Expert. Below these are three
    more options you probably won''t use as much: Macros, Online Help, and About Corel
    WordPerfect. This list describes all the Help buttons do:


