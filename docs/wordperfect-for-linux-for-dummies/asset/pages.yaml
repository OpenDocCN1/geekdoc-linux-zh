  md: '# Part II: Prettying Up Your Text


    # # What Are Secret Formatting Codes?


    WordPerfect codes are special objects that WordPerfect inserts in your document
    to turn special features on or off. The usual way to insert a code in your document
    is to choose a formatting command or click on a formatting button. WordPerfect
    saves the codes with your document.


    WordPerfect has three types of codes: character codes, single codes, and paired
    codes. (We just made up these terms.) We describe each type of code in detail
    later in this chapter and tell you how to spot them and what they do. This list
    briefly describes the types of codes:


    +   - **Character**: Represents special characters, such as Tab; Some represents
    keys on the keyboard, and others (such as Indent)


    +   - **Single**: Turns on a formatting feature. The Left Marg and Right Marg
    codes, for example, set the left and right margins, beginning at the position
    of the code. The formatting code applies in effect for the rest of the document
    until WordPerfect runs across another occurrence of the same code.


    +   - **Paired**: Comes in pairs (you guessed that, we know). WordPerfect also
    calls these reversible codes—who knows where that little piece of jargon comes
    from? The first code in the pair turns a feature on, and the second one turns
    it off. **Bold** codes, for example, come in pairs: one to turn on boldface and
    the other to turn it off. The text between the two codes is in boldface.


    # # Seeing the Codes


    "This code business is all very exciting," you say. "So where are all these codes
    that have been running around in my documents like cockroaches in the dark?"


    It''s a good question with a simple answer: You can use the Reveal Codes command
    to see the codes in your document. (Another method is to right-click on the text
    of your document and choose Reveal Codes from the QuickMenu that appears. Shift+Ctrl+F3
    might work, too, or Alt+F3.) Figure 9-1 shows the WordPerfect window with the
    Reveal Codes window at the bottom.'
