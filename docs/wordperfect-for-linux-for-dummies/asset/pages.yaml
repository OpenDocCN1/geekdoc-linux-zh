- img_proc: true
  md: '# Part IV: Creating Documents That Don''t Sit There


    When all is said and done, we think that captions are great. It may take a little
    time to get them set up exactly the way you want them; after you do, though, they
    help people find their way around your document, and they look classy!


    # Text wrapping


    Text wrapping is kind of like gift wrapping, with a twist. (Or is that a bow?)
    You have a box on your page; what should WordPerfect do with the text in your
    document when it gets to the box? You have a couple of alternatives:


    +   * Jump over the whole box, leaving white space to the right and left of the
    box. That''s what we''ve done with the figures in this book.

    * If your box isn''t exactly in the middle of the page, the space on one side
    is smaller than the space on the other side. (At last, a use for high school geometry!)
    WordPerfect is perfectly happy to figure out which side is smaller and leave it
    blank and then run the text wider side of the page. That''s what WordPerfect does,
    in fact, unless you tell it otherwise and it''s not a bad choice.

    * Run the text around the box, assuming that a reader''s eye will just skip over
    the box. This choice is usually not a good idea unless your box is rather small.
    Otherwise, people get confused and don''t know whether to read one side of your
    box and then down the other or across the page, skipping the box.


    Because you are using WordPerfect, you have two ways to tell WordPerfect how to
    wrap text around your box: Click the Text Wrap button on the Property Bar or right-click
    on the box and click the Wrap command to display the Text Wrap dialog box. Figure
