  md: '# Chapter 1: WordPerfect Basics


    You can tell WordPerfect to save your document automatically every five or ten
    minutes, or at any interval you choose (for more info, see Chapter 19).


    What if a file named test.wpd already exists? WordPerfect, which always watches
    out for yours, tells you whenever that happens. A dialog box appears, telling
    you that the file already exists and asking whether you really want to replace
    it (irrevocably deleting the existing file in the process). You have two—count
    ''em'' two options:


    +   - Yes: Replace the existing file.


    +   - No: Enter a different name for your new file.


    If you''re looking at the Save As dialog box and change your mind about saving
    the document, press the Escape (or Esc) key or click on the Cancel button. The
    dialog box disappears.


    Chapter 13 describes everything you want to know about files, including to delete,
    move, copy, and rename them.


    # Filename rules


    When you enter a name for a new WordPerfect document, you must follow the rules
    for naming files. WordPerfect didn''t make up these rules; Linux (or more generally,
    UNIX) did. Here are the rules:


    +   - Letters are case-sensitive. That means Piffle, piffle, and PIFFLE, for example,
    are all different filenames.


    +   - You''re not allowed to use any of the following special characters in a
    file-name: <>|:()[]*?|@#$— in other words, almost (but not quite) on the keyboard
    that''s not a letter or a number. Any of these characters gets Linux hopelessly
    confused. (If you want to name a file after an extension, you just have to spell
    it out.)


    +   - You can use spaces and hyphens (-), although it''s not a good idea. Some
    programs have trouble with them. In fact, forget that we even said you can use
    them.


    +   - Rather than use spaces or hyphens, UNIX aficionados usually use either periods
    or underscores, so filenames frequently look like directions.to.grandmas or chocolate_pickle_recipe.'
