  md: '# Chapter 11: On Paper at Last: Printing Stuff 201


    # Canceling a Print Job


    So far, printing has been pretty smooth sailing. Display a dialog box or two,
    click on the buttons, and presto — your document is on paper. Then one day, disaster
    strikes: You send your 150-page report to print while you''re in the middle of
    reorganizing it. It''s time to tell WordPerfect, "Stop printing! Never mind! I
    didn''t mean it!


    # Who ya gonna call?


    When you print, WordPerfect (like all Linux programs) prints by committee. When
    WordPerfect prints, it sends the information in your document to the Linux printer
    daemon (also called lpd), a program in charge of sending print jobs to printers.
    The printer daemon takes it from there. WordPerfect keeps track of what is going
    on, and lists your print jobs in a job queue.


    If your computer and printer are connected to a network rather than directly to
    each other, your document gets passed to the network print manager, which then
    sends it to the printer. A talk with your network administrator may be in order
    (accompanied by a few chocolate chip cookies) so that you can find out how to
    cancel a print job after it has been sent to the network manager.


    # WordPerfect, stop printing!


    While your document is printing, you can tell Linux and WordPerfect to forget
    the whole thing by following these steps:


    +   1. Switch to the WordPerfect program window.

    Remember that the program window is the small window that hangs around displaying
    the WordPerfect logo. To display the program window, click on its button on the
    taskbar (if you use KDE, GNOME, or another window manager that displays a taskbar
    containing buttons for all your open windows).

    2. In the program window, choose Printer Control.

    All pending jobs are displayed in the Printer Control dialog box, as shown in
    Figure 11-5, in the Queued Jobs section. If you don''t see your print job, select
    a different destination from the Available Destinations list. If you don''t know
    your printer destination (usually lp for your local printer), just keep clicking
    on entries on the Available Destinations list until the name of your print job
    shows up in the Queued Jobs area.'
  merge: -1
  pgno: 230
- img_proc: true
  md: '# 202 Part III: Things You Can Do with Documents


    ![](img/a2afb402c275cfc5e5a8f62356a922ef_231_0.png)


    Figure 11-5: The Printer Control dialog box.


    3. Select your print job on the Queued Jobs list and click the Stop button.

    When WordPerfect asks you to confirm that you want to stop the job, click on OK.
    Your print job is stopped.


    If you change your mind and decide that you don''t want to cancel the print job,
    click on the Close button to make the Printer Control dialog box go away. You
    can also leave this window open, if you want to check often on the status of a
    print job.'
