- img_proc: true
  md: '# Chapter 1: WordPerfect Basics


    If you start with a new, blank window and type, your prose is in a document WordPerfect
    named Document1. Although the text is onscreen, it''s not on disk (yet). Documents
    onscreen are ephemeral and disappear when you exit WordPerfect or log out of Linux
    — here today, tomorrow (or later this afternoon). Saving your documents on disk
    is important so that they''re saved for good.


    Document1 isn''t a good name for a document because it doesn''t give you a clue
    to what it''s about; it''s the best that WordPerfect can do, however. You should
    give the document a more descriptive name, which you can do when you save it.


    # Saving your document


    You can save a document on disk and give it a name in at least three ways. Although
    we''re sure that your insatiable curiosity will drive you to find out all three,
    method is our favorite. Follow these steps:


    +   1. Click on the Save button on the toolbar.


    The toolbar is the row of little buttons just below the title bar. (Refer to the
    section "The Two Windows of WordPerfect," earlier in this chapter, and Figure
    1-6 if you can''t find the toolbar.) The Save button is the one with a tiny picture
    of a floppy disk. (You probably are saving your document on a hard disk; hard
    disks aren''t as cute as floppy disks.) This button is probably the third from
    the left.


    ![](img/a2afb402c275cfc5e5a8f62356a922ef_50_0.png)


    When the mouse pointer points to a button on the toolbar, the name of the button
    appears in a little yellow box with a description of the button. Thank goodness
    for because many of those tiny little buttons look alike. (And don''t tell us
    it''s time to break down and get reading glasses!) When the mouse pointer is on
    the Save button, for example, you see this helpful reminder: Save the current
    document. These messages tell you the name of the button and what the button does
    (as though you couldn''t guess from the name). Chapter 2 has more information
    about this subject.


    As soon as you click the Save button, a window appears onscreen, right on top
    of the WordPerfect window. The window is a dialog box, which WordPerfect displays
    when it wants to ask you some questions. Chapter 2 tells you what you ever wanted
    to know about dialog boxes.


    This particular dialog box is labeled (not surprisingly) Save As, as shown in
    Figure 1-7. Use it to tell WordPerfect where to store the document on disk and
    what to name it. We talk more in Chapter 13 about where you can store documents.
    For now, WordPerfect suggests that you store your document in your home directory
    — the directory to put files in unless someone says otherwise.'
