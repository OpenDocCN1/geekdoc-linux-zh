    columns with the Block Text option, although a table is usually easier to use.
    Use tables if you have lots of numbers and you want to ask WordPerfect to total
    them (or do other math). |

    | Columns are better when you have a large amount of text and you''re willing
    to have it move from one column to another, depending on how your page layouts.
    Magazine and newspaper layouts use columns. | One last guideline: Don''t use more
    than four columns. If you need more than that, use a table. |

    | Tables are better when you have a smaller amount of text and it''s important
    what text | |


