  md: '# 104 Part II: Prettying Up Your Text


    Another way to display this dialog box is to position the mouse pointer any-where
    in your text, click the right mouse button to display a QuickMenu, and then choose
    Font from it.


    # Using the options in the Font dialog box


    This big, scary-looking dialog box contains all the character formatting you could
    want. You can use the Font dialog box to format text you''ve already typed or
    to instruct WordPerfect to format the text you''re about to type.


    To select character formatting for text you haven''t yet typed, position the cursor
    wherever in your document you want to start typing, display the Font dialog box
    and choose the formatting you want, and then click on OK. WordPerfect inserts
    at the cursor position some secret formatting codes that affect the text following
    the codes. When you start typing, the text appears in the format you selected.


    If you want to format text you''ve already typed in your document, choose one
    of these methods to select what you want to format:


    +   To format a block of text, first select the text and then use the dialog box
    to format the selected text. WordPerfect inserts two secret formatting codes:
    one at the beginning of the block of text, to turn formatting on; and the other
    at the end of the block of text, to return formatting to normal.


    +   To format the rest of the text in the document, position the cursor at the
    point where you want the font to change and then use the Font dialog box. WordPerfect
    inserts just one secret code to turn the formatting on at the cursor location.


    In the lower-left part of the Font dialog box, a box contains some text, usually
    the name and size of the font you''re using. As you choose character formats in
    the dialog box, WordPerfect formats this text accordingly so that you can see
    how your text will look.


    To change the typeface, choose one from the Font Face list, which is the same
    list of typefaces you see when you click on the Font Face button on the Property
    Bar.


    To set the font size (in points), choose a size from the Font Size list, which
    is the same list of sizes you see when you click on the Font Size button on the
    Property Bar.'
