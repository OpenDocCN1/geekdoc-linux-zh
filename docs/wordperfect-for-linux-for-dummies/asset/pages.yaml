  md: '# Chapter 20: Don''t Panic! Read This Chapter!


    # "The Screen Looks Weird!"


    The WordPerfect window usually looks weird, and so does Linux, so it''s nothing-to
    worry about. If the screen even weirder than normal, this list shows some things
    you can try:


    +   - Choose View>Zoom, and select a reasonable zoom size. (Chapter 19 describes
    zooming, for you freaks.)

    - Use the Reveal Codes window (choose View>Reveal Codes) to check for bizarre
    codes that may have arrived from outer space (refer to Chapter 9). If you see
    a code you don''t like the looks of, delete it. (Saving your document under a
    different name first is a good idea.)

    - Close your document and open it again. Maybe it will feel better.

    - Exit WordPerfect, and run it again. This step may excise the cooties that inhabited
    it.

    - Exit your window manager, or even Linux itself, and run it again. This step
    is necessary only when the situation is serious. To KDE, press Ctrl+Alt+Backspace
    or click the K button in the lower-left corner of the screen and choose Logout
    from the menu that appears.

    - Exit Linux and go out for a walk. Who knows — maybe your eyeballs flipped out
    and need a rest.

    - Sell your computer and go into another line of work, such as flower arranging.


    # "My Document Isn''t Printing!"


    You click on the cute little Print button on the toolbar or use some other method
    to tell WordPerfect that you want it to arrange some ink tastefully on some paper.
    Is that an unreasonable thing to ask?


    In the world of computers, arranging ink can certainly be complicated. Chapter
    11 describes the sometime tortuous path your document can take from WordPerfect
    to your printer.


    Here''s the key thing: if the printer doesn''t print anything, don''t just try
    printing again. Your document may still be en route to the printer (especially
    if you used extensive formatting or graphics). If you issue another Print command,
    you probably will end up with two copies. Instead, figure out where your document
    got stuck.'
