  md: '# Inserting a shape into your document


    If you want to insert a simple picture (like a square, rectangle, circle, ellipse,
    or polygon), move the cursor to where you want the picture inserted and choose
    Insert:Shape from the menu bar. Then Choose Polygon, Rectangle, Rounded Rectangle,
    Circle, or Ellipse from the menu that appears. Click to show WordPerfect the corners,
    ends, or other points that define the shape. WordPerfect creates a box and sticks
    to the box you choose. To fix up the shape if it''s not quite what you need, double-click
    on it and skip over to the section "Whipping your drawings into shape, or whipping
    shapes into your drawings," later in this chapter.


    # Inserting a picture from somewhere else into your document


    You''ve figured out that the images supplied with WordPerfect don''t it for you.
    Or you have a picture that has to do specifically with what you''re writing about
    and you want to include the picture in your document. No problem there, either!
    WordPerfect is happy to insert just any ol'' image file in your document. Here''s
    how:


    +   1. Make sure the graphics file is on a hard or floppy disk in your PC (or
    on your network).


    If you''re getting a graphics file from a Web page, you need to save the file
    from your Web browser. Right-click the graphic and choose the Save Image As or
    Save Picture As option from the menu that appears. When the browser asks where
    you want to save the file, specify a directory on your hard disk.


    If you''re getting your graphics file from a friend or co-worker, you need to
    put it on your PC. The file can be either on a floppy disk or copied in a directory
    on your hard disk. If you don''t know how to copy the file, weasel out of the
    job by subtly implying to the person who made the file that it''s their responsibility.
    If that doesn''t work, dig out the ol'' cookie package and get your PC guru.


    +   2. Choose Insert:Graphics<-From File from the menu bar.


    The Insert Image dialog box appears (refer to Figure 15-2).


    +   3. Find the file.


    Use the Directory List box to move to the directory that contains the file. You
    can use all the same tools (including finding files) that we describe in Chapter
    13 to help you find your file.'
