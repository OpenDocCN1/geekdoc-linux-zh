  md: '# 112 Part II: Prettying Your Text


    # Setting Margins


    As you may recall from high school typing class, the left, right, top, and bottom
    margins control how much blank space to leave on the edges of the paper. Normally,
    everything you type appears within these margins. The purpose of margins, of course,
    is to provide white space in which a reader can doodle while staring off into
    space. WordPerfect usually sets the left, right, top, and bottom margins to 1
    inch, which is quite generous. You may want to make the margins smaller, to discourage
    excessive doodling.


    ![](img/a2afb402c275cfc5e5a8f62356a922ef_141_0.png)


    # Dragging the margin lines


    WordPerfect 8 can show you where the left, right, top, and bottom margins are
    by using gray dotted lines, called guidelines. We like these, although they''ve
    had a checked history in WordPerfect. In some versions, after you installed WordPerfect,
    the guidelines were on the screen. In other versions, you had to ask WordPerfect
    to turn the guidelines on. Anyway, here''s how to turn them on or off: Choose
    View>Guidelines. You see the Guidelines box, as shown in Figure 7-2.


    This dialog box enables you to choose which guidelines you want to see in the
    WordPerfect window. Not that we''re gluttons for punishment or anything, but we
    find all the guidelines pretty useful and usually keep all check boxes in this
    dialog box.


    There; now that you have guidelines on the screen, you can change the margins
    by dragging them around. Follow these steps:


    +   1. Move the cursor to the tippy-top of the document.


    The quickest way is to press Ctrl+Home. If you want to change the margins for
    the whole document, you have to start at the top, the beginning of the first line
    of your document. To change the bottom margin, move to the bottom of the first
    page of the document.'
