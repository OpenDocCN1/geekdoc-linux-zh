    # Getting Rid of Styles


    After awhile, particularly if you''re of the pack rat persuasion and keep your
    styles in the same place, you will want to delete a few of them. You cannot delete
    built-in styles, however — only your own. These steps tell you:


    +   1. Choose Format Styles to display the Style List dialog box.


