- img_proc: true
  md: '4. Click on the filename and click on Insert to insert the picture into your
    document.


    To see a quick preview of the picture while you''re using the Insert Image dialog
    box, click the View button.


    The same rules apply for inserted graphics files as for WordPerfect clipart:

    The picture is in a box, it can have borders, and you can move it and resize it
    just like you can do with any other box.


    # Creating Your Own Graphics with WP Draw


    If you can''t find any art that suits your document or if you find some and decide
    that it needs a little touch-up, WordPerfect has a tool that''s all set for you.
    Draw has a set of drawing tools that definitely help you get the basics down,
    and then you can waste days refining every single dot on your screen or on paper.
    So if you''re not Rockwell? With WordPerfect, you can still create your own home-style
    graphics and have them look... well, okay. Hey, at staying inside the lines is
    easy.


    Before we launch into a discussion of the WP Draw program, we need to talk a little
    about what is going on. When you create a WordPerfect document, you type text
    in WordPerfect. Simple enough. When you create a text box (refer to Chapter 14),
    you add to your document something that is not text: a box. In Chapter 14, we
    talk about things you can do to these boxes themselves. Because the boxes contain
    text, you can do all sorts of text-ish dots to the text in them — the kinds of
    things we talk about throughout this box.


    What if the box doesn''t contain text? What if it contains, just to pull an example
    of thin air, a picture? For that matter, what is a picture, in WordPerfect? Just
    as a document is made of text, a picture is made of objects. (Think back to high
    school geometry where you''re about to run into some acquaintances from back then.)
    We give you a quick rundown of what a picture can contain; then we talk in more
    detail about the ones you actually want to use


    +   Dot: A dot of color in your picture. Dots usually gather in groups, and together
    they''re trying to be a picture of something. Pictures made entirely of dots are
    called, for obscure historical reasons, bitmaps in computerese (and in WordPerfect).
    Although you can insert a bitmap in your drawing from a file or from a scanner,
    you don''t draw one.'
  merge: -1
  pgno: 296
- img_proc: true
  md: '# 268 Part IV: Creating Documents That Don''t Sit There


    +   - Line: A line or curve from one point to another. There''s nothing too special
    here. You can draw on your picture as many lines as you want. Straight lines are
    simplest, although WordPerfect also knows about curved lines.


    +   - Enclosed shape: Lines or curves that enclose some space. These shapes automatically
    close themselves, so if you''re drawing a box, for example, you don''t have to
    manage click back precisely on the starting point when you finish the fourth side.
    The enclosed shapes can be filled with a solid color or 2-color pattern.


    +   - Text: If you''re reading this from front to back, you know all about text;
    we''ve been talking about it for a couple of hundred pages. Each individual letter
    or other character inside a WordPerfect graphic, however, has two parts: the thin
    line around the outside and the space inside.


    Fine, you say, but you don''t want dots and lines and shapes in your document;
    want, for example, a map with some notes on it. Be patient. Using just these four
    ingredients, you can create anything!


    ![](img/a2afb402c275cfc5e5a8f62356a922ef_297_0.png)


    Many Linux systems come with graphics editors you can use to create or edit graphics
    files. Our favorite is The Gimp (we are not making this up), which comes with
    Red Hat and many other versions of Linux. We use the Gimp, in fact, to capture
    the pictures of WordPerfect windows you see in this book.


    # Creating a new picture


    To create a new picture, start simply. Draw a few rectangles, ovals, or free-hand
    shapes:


    +   1. Use the Insert:Graphics Draw Picture command to create a new graphics box,
    and run WP Draw to edit the picture in the box.


    A new window opens, labeled WP Draw (in the window on the right, as shown in Figure
    15-4). A separate window contains the WP Draw toolbar (in the window on the left
    ).


    +   2. Use the toolbar in the WP Draw window to create your drawing.


    Try out all the tools and add lines, text, and colors to your drawing. The tools
    are described in detail in the next section.


    +   3. When you''re finished, choose File:Update to save the drawing as part of
    your document.


    +   4. Choose File:Exit to close the WP Draw window and get back to your document.


    The drawing you created is displayed in your document.'
  merge: -1
