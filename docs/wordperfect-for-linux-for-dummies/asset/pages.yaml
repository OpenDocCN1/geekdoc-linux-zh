    \ in there, by typing Readme and pressing Enter.\n\nIf you see instructions for\
    \ installing the downloaded version of WordPerfect, don't worry — keeping reading\
    \ this appendix.\n\n+   12. To run the installation program, type this command\
    \ and press Enter:\n    ./Runme\n\n+   13. The installation program asks whether\
    \ you unzipped and “tarred” the files you downloaded: Press Y.\nThat gzip and\
    \ tar command you used in Step 10 did the trick. The real, live installation program\
    \ starts running now.\n\n+   14. Follow the instructions onscreen\nWhen the program\
    \ asks where to install WordPerfect, the directory you named in Step 2 (probably\
    \ /usr/local/wp). Choose which installation you want (everything, standard, or\
    \ minimum). The program asks whether it can update your /etc/magic file, go ahead\
    \ and let it. Although Linux usually calls your printer 1p, you may have to ask\
    \ a Linux guru for help at 1lp at this point. After you answer all the questions,\
    \ the program installs WordPerfect.\n\nThe installation program creates a subdirectory\
    \ named wpbin in the directory you specified and copies the WordPerfect program\
    \ files into directory. The WordPerfect program is named xwp, so if you installed\
    \ WordPerfect in the /usr/local/wp directory, the pathname of the program is /usr/local/wp/wpbin\
    \ (Sounds redundant, but there is!)\n\n![](img/a2afb402c275cfc5e5a8f62356a922ef_415_0.png)\n\
    \nAfter you install WordPerfect, save disk space by deleting the temporary installation\
    \ files (the ones you put in /var/tmp/wp). Type the commands cd /var/tmp/wp and\
    \ rm * to delete the files."
  merge: -1
