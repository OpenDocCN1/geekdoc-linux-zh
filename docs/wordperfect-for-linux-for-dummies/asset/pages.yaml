    To add or change something in InitialStyle or a heading style, check out the Styles
    Editor, described in the section “Creating Styles from Scratch, or Modifying Existing
    Styles,” later in this chapter.


    If you want to remove something, you have to deal with secret codes (refer to
    Chapter 9). If you''re not up to reading Chapter 9 in its entirety, you can also
    try a little guesswork while you''re using the Styles Editor.


