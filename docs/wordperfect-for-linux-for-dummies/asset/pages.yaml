  md: '# Chapter 5: Text Improvements


    # I see my words change even as I type them!


    Welcome to the magic world of QuickCorrect. Actually, it''s another terrific feature
    that...For Dummies readers love: You don''t have to know anything about, and it
    usually does what you want. As your high-school typing teacher could tell you
    in an instant, most mistakes fall into a few general categories: reversing two
    letters, putting the space after the first letter of a word rather than before,
    capitalization errors, and dumb spelling errors we wouldn''t make if we weren''t
    typing so fast.


    The folks at WordPerfect figured that if these are such common errors, why not
    WordPerfect fix them for you? That''s exactly how QuickCorrect does. For example,
    to type *teh* as a word in a WordPerfect document. No matter how hard you try,
    WordPerfect changes it to the. WordPerfect figures correctly (we suspect) that
    you meant to type *the*. For some reason you did want to type *teh*, you have
    to get kind of clever.


    To keep WordPerfect from QuickCorrect something, add an extra letter to the end
    so that WordPerfect doesn''t recognize it. In this case, how about *tehh*? Then
    type a space after it to tell WordPerfect that you''re done with this word. Now
    you can go back and get rid of extra *h*. Totally clumsy? Yes, there''s a better
    way.


    If you find that you want to stop WordPerfect from correcting a misspelling or
    if you want to add your own common misspellings to the QuickCorrect list, you
    need to take a look at the QuickCorrect dialog box. Choose the Tools QuickCorrect
    command. You see the QuickCorrect dialog box, as shown in Figure 5-3. What''s
    going on is quite simple: You type the stuff in the left column, and WordPerfect
    replaces it with the stuff in the right column.


    So you want to change, delete, or change an entry on the list of WordPerfect QuickCorrections?
    No problem:


    +   1. Scroll down until you see in the left column the word you correcting automatically
    and in the right column the word''s showing up onscreen.


    You can that either by using the scroll bar on the right side of the dialog box
    or by clicking in the Replace column and pressing the Page Down key on the keyboard.'
