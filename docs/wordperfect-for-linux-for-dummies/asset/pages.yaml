- img_proc: true
  md: '# 300 Part IV: Creating Documents That Don''t Sit There


    # # Numbering the-page letters


    For multiple-page letters, page numbers add a touch of class. Use the page-numbering,
    header, or footer feature in WordPerfect (described in Chapter 8). Be sure to
    tell WordPerfect *not* to number the first page.


    # # Saving your letter as a prototype document


    You don''t want a letter you''ve created in WordPerfect to disappear out the door
    with a stamp on it — especially if you''ve done all the work we describe in the
    preceding sections! By all means, print your letter and save it for reference.
    Be sure to save a copy to use the next time you want to write a letter. You can
    do a couple of things to make this process easier.


    First, delete all the text from the letter. Unless it is a particular kind of
    letter (an order confirmation, for example), you want to type new every time.
    Second, delete the name of the person to whom you send the letter. To keep the
    formatting of the address, don''t just delete it. Instead, highlight it and type
    something like <Address goes here> to remind yourself to enter the address there.
    Third, do the same for the salutation. Notion is embarrassing than sending a letter
    to Helen with the salutation Dear Fred. Highlight the Dear Fred salutation and
    replace it with something like <Salutation goes here>. (You just have to remember
    not to send out the letter Dear <Salutation goes here>.)


    That''s all to it. You''re ready to use the File→Save command to save your prototype
    letter for future use.


    Don''t forget the trick we mentioned earlier in this chapter. After you''ve saved
    your prototype, make it read-only so that you can''t foul it up (The details are
    in the section “Not a Template but Just as Good,” earlier in this chapter). Better
    yet, save the document as a template, as described in the sidebar “Creating your
    own templates,” earlier in this chapter.


    # # Memos


    Everything we say in this chapter about letters goes for memos, too. If you don''t
    use preprinted memo paper, check out the ready-to-use templates in WordPerfect.
    Choose File→ExpressDocs and select one of the memo templates from the list. Fill
    in all the information WordPerfect asks you for and type the message you want
    to send, and you have your memo.'
  merge: -1
  pgno: 329
- img_proc: true
  md: '# Faxes


    If you have a boring, old-fashioned fax machine into which you feed boring, old-fashioned
    pieces of paper, we don''t have much to suggest. You may want to look at the WordPerfect
    templates for fax cover sheets; these templates are trendy and designerish. Using
    larger-size type when you''re printing a document to be fixed is also a good idea
    because a faxed document is rarely as clear as the original. Don''t use a font
    size smaller than 12 points.


    # Envelopes


    After you write the world''s most clear and cogent letter, you need an envelope
    to put it in. (We have stooped to using window envelopes because we''re too lazy
    to print envelopes, although I suspect that you haven''t fallen that far.) If
    your printer cannot accept envelopes (most printers can), skip this section.


    The folks at WordPerfect created a command that formats a document (or one page
    of a document) as an envelope. Wow — we''re talking convenience. Word processing
    takes a major step forward.


    # Printing the address on the envelope


    To print an address on a regular #10 (U.S. business size) envelope, follow these
    steps:


    +   1. If you have already written the letter that goes in the envelope, open
    that document.

    If not, no big deal.

    2. Choose Format:Envelope.

    WordPerfect displays the Envelope dialog box, as shown in Figure 17-3. (It may
    tell you that no envelopes are defined for the current printer and ask whether
    you want to create an envelope definition; if so, see the following section.)
    If the current document contains a letter in a fairly normal format, WordPerfect
    — get this — finds the name and Address at the top of the letter and displays
    them in the Mailing Addresses box. This feature is really cool; you don''t have
    to type the address again.'
  merge: -1
  pgno: 330
- img_proc: true
  md: '# 302 Part IV: Creating Documents That Don''t Sit There


    ![](img/a2afb402c275cfc5e5a8f62356a922ef_331_0.png)


    Figure 17-3: Creating an envelope. You don''t even have to type the address!


    If the address at the beginning of the letter is your own address, this feature
    backfires. Not a problem: Click on Cancel, open the letter if it''s not already
    open, select the lines that contain the address to which you want to address the
    envelope, and choose Envelope again. The selected address appears in the Mailing
    Addresses box.


    +   3. **Enter your address in the Return Addresses box.**


    If you have used this dialog, Word remembers the address you entered the last
    time — a nice touch (Strangely, WordPerfect doesn''t use the information you may
    have typed in the Personal Info dialog box when you open a template.)


    +   4. **To print the envelope, click on Print.**


    Depending on how your printer works, you may be prompted (by a cute dialog box)
    to insert an envelope. For some printers, you may have to edit the paper definition,
    paper size, and orientation settings; click on Create New Definition.


    Or, to print an envelope as part of your document, click on OK.


    WordPerfect adds the envelope as a separate page at the end of your document,
    along with all the formatting you need in order to make it print correctly. This
    feature is useful when the current document is the letter that goes inside the
    envelope. Whenever you print the letter, you print an envelope, too.'
  merge: -1
