  md: '# Chapter 6


    # Charming Characters


    In This Chapter


    +   - Making text boldface

    - Using italics

    - Underlining text

    - Making text bigger or smaller

    - Using different fonts

    - Getting text back to normal

    - Copying character formatting

    - Changing capitalization


    WordPerfect enables you to control the way individual characters look — not where
    they are on the page but rather their size and shape. "characters," we mean the
    letters, numbers, and punctuation that make up your text. (We aren''t talking
    about people like the strange guy next door who has 47 cats and sings opera while
    gardening.) In addition to underlining, boldface, and italics to add emphasis
    to text, you can choose different types and sizes. In fact, the range of choices
    can be overwhelming.


    The good news is that with WordPerfect you can see all these special effects directly
    onscreen. Unlike old-fashioned word processors, newer versions of WordPerfect
    draw each character and can draw them in all their formatted splendor.


    The bad news is that it''s easy to get carried away with character formatting.
    Nothing is more amateurish, or harder to read, than a letter or memo that uses
    five typefaces on one page — readers all spend their time shading their eyes from
    the glare of all that SNAZZY formatting and don''t have time to absorb the import
    of the text. Use a little restraint, people!'
  merge: -1
