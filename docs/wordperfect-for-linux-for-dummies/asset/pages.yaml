  md: '# 308 Part IV: Creating Documents That Don''t Sit There


    +   5. In the Number of Columns box, type 2 or click on the up and down arrows
    until you see 2 in the box. Leave the number of rows set at 1 and click on OK.


    Your text moves around big-time. It appears in two columns, Subdividing a page
    into columns works like regular columns (described in Chapter 14), although WordPerfect
    knows that you want to treat the columns like separate pages. Way cool!


    If you don''t see it in two columns, choose View>Page.


    ![](img/a2afb402c275cfc5e5a8f62356a922ef_337_0.png)


    +   6. Set your booklet''s margins.


    If you didn''t set them earlier, you should set them now, to see how your text
    looks on these small pages. You may want to move your graphics, lines, boxes,
    and headings around a little to fit into the smaller columns of text.


    +   7. Create a front cover, if you want one.


    At the beginning of the document, enter the title or other material you want to
    appear on the cover. Press Ctrl+Enter to insert a page break between the cover
    text and the next page. You can center the cover text on the page by choosing
    the Format>Page>Center command.


    +   8. Save your document — it looks great!


    # Printing your booklet: The magic part


    You''re ready for the tricky part of printing a booklet: telling WordPerfect to
    shuffle the pages so that they''re in the right order when you fold the booklet
    in half. Luckily, WordPerfect does almost all the work. Just follow these steps:


    +   1. To print, choose File>Print to display the Print dialog box and click on
    the Output Options button.


    You see the Output Options dialog box.


    +   2. Select Booklet Printing and click on OK.


    This step tells WordPerfect to switch the order of the pages so that the sheets
    of paper are folded, the booklet pages are in order.


    +   3. Click on OK in the Print dialog box.


    WordPerfect thinks about the job for a moment. If your booklet is long, the moment
    may be rather long. After all, WordPerfect is reshuffling the entire document.
    Then your printer fires up and spews out the booklet. All you need now is one
    of those $35 staplers that you can staple your booklet in the middle.'
  merge: -1
  pgno: 337
- img_proc: true
  md: '# Chapter 17: Recipes and Templates for Popular Documents


    # # Tips for creating booklets


    If your printer doesn''t print in duplex mode (on both sides of the paper), you
    can click on the Output Options button in the Print dialog box and tell Word to
    print only odd pages (click to select the Print Odd/Even Pages and then select
    Odd). Depending on which copy you use, this option may be unavailable. (You can
    tell it because it appears in a ghostly grey). WordPerfect prints the odd-numbered
    pages. Then reinsert the pages so that the first sheet of paper that was printed
    last time is the first page printed this time — make sure the blank side is set
    to print. Choose File+P again, click Output Options, and print only the even pages.
    This procedure can get a little confusing because you must be to insert the right
    page, the right around, at the right time.


    Unless you''re printing in color, you might find it to print everything on one
    side of blank sheets of paper and photocopy them. You probably want more than
    one copy, anyway.


    To insert a page break and move to the top of the next page, you press, as usual,
    Ctrl+Enter. When you have subdivided your pages, you move to the next booklet
    page, not to the next sheet of paper. To move to the next or preceding booklet
    page, press Alt+PgUp or Alt+PgDn.


    # # Reports, Books, and Other Big Documents


    These days, people use word processing programs for much more than writing letters.
    You may want to use WordPerfect to typeset a book, for example. This idea isn''t
    as stupid as it sounds; WordPerfect can handle large documents, and it can even
    create tables of contents and indexes.


    The secret is not to store the entire book (or report or whatever) in one big
    document; break it up into chapters or sections — one per document. Then create
    a master document to connect all the parts.


    What''s a master document? (We''re so glad that you asked.) It''s a WordPerfect
    document containing secret codes that link it to other documents. These other
    documents are subdocuments. When you''re writing a book (to pick a hypothetical
    example), each subdocument may contain one chapter. The master document contains
    a secret code for each chapter, in addition to introductory text, the table of
    contents, and the index.


    To go about creating a really big document, such as a book or long report, create
    the subdocuments first. Then create the master document. Finally, set up the table
    of contents. Don''t worry. We step you through the process.'
  merge: -1
  pgno: 338
- img_proc: true
  md: '# Part IV: Creating Documents That Don''t Sit There


    # Creating a master document and its subdocuments


    To create a master document and its subdocuments, you have to get the text of
    the book organized. Follow these steps:


    +   1. Create a document for each chapter.

    Because you want all chapters to be formatted the same way, consider creating
    a template that contains the formatting. Alternatively, create a prototype chapter
    with some section headings and other elements you expect to use in each chapter.
    Don''t worry about page numbering, heads-, or footers in the subdocuments; those
    elements are controlled by the master document. Give the documents names such
    as Chapter1 and Chapter2.

    2. Type the text in each chapter document or copy it from existing documents.

    3. Create the master document.

    Open a new document and type the title page and other front matter. Skip the table
    of contents for now. (We get to it in the following section.) If the introduction
    and preface (or whatever) is short, you can include them in your document; if
    they''re long, store each one in your own document, as you do with chapters. Save
    the document with a name such as Book or Report.

    4. For each chapter, create a secret code in the master document.


    Move the cursor to the spot in the master document where you want the chapter
    to appear. If you want the chapter to begin on a new page, insert a page break
    by pressing Ctrl+Enter. Then choose File>Document> Sub-document to display the
    Include Subdocument dialog box. Type the filename of the chapter (or click on
    the little folder button and select the filename from the Select File dialog box)
    and click on OK. In Figure 17-8, we include Chapter 1 in our master document.


    > Not much happens at this point. In Page view, you see a little subdocument icon
    in the left margin of your master document. In Draft view, you see a Subdocument
    code that looks like Subdoc: Chapter 1 or whatever the filename of the subdocument
    is. (It looks something like Figure 17-8.) We prefer to work in Draft view so
    that we can see the filenames of our chapters all the time.


    ![](img/a2afb402c275cfc5e5a8f62356a922ef_339_0.png)


    In Page view, to find out which document the little subdocument icon refers to,
    click on it.'
  merge: -1
  pgno: 339
- img_proc: true
  md: '# # Chapter 17: Recipes and Templates for Popular Documents


    ![](img/a2afb402c275cfc5e5a8f62356a922ef_340_0.png)


    Figure 17-8: The master document and its sub-documents.


    A faster way to use the File>Document>SubDocument command is to use a QuickMenu.
    Right-click in the left margin of the document and then choose Subdocument from
    the QuickMenu.


    # ## Expanding a master document


    WordPerfect can display (and store) a master document in either of two ways: expanded;
    when a master document is expanded, WordPerfect retrieves the text of each subdocument
    and sticks it in the master document, right where it belongs. When a master document
    is condensed, the text of each subdocument is stored — you guessed it — in its
    separate file, and you see only subdocument icons.


    To expand a master document, choose File>Document>Expand Master or double-click
    on one of those subdocument icons or codes. WordPerfect displays the Expand Master
    Document dialog box, as shown in Figure 17-9, which lists all your subdocuments.
    To expand them all, click on Mark All and then click on OK. To skipping a subdocument,
    click on its little box so that it is not selected.'
  merge: -1
  pgno: 340
- img_proc: true
  md: '# 312 Part IV: Creating Documents That Don''t Just Sit There


    ![](img/a2afb402c275cfc5e5a8f62356a922ef_341_0.png)


    When you expand a master document, you still see the subdocument icons or codes.
    You see twice as many, in fact — they appear at the beginning and end of each
    subdocument, as shown in Figure 17-10. (Because the chapters in our sample book
    are extremely short, more than one fits on the screen).


    ![](img/a2afb402c275cfc5e5a8f62356a922ef_341_1.png)


    When you''re working on a master document, you''re probably safest not to open
    any of its subdocuments in other windows. Some versions of WordPerfect might get
    upset when you save a master document if any of its subdocuments are also open.'
  merge: -1
  pgno: 341
- img_proc: true
  md: '# Saving a master document


    When you save a master document, WordPerfect wants to know two things about each
    of its subdocuments:


    +   - Do you want to *save* the text of the subdocument back in the subdocument''s
    file?

    - Do you want to *condense* the subdocument so that only its icon appears in the
    master document?


    You answer both these pesky questions in the Condense/Save Subdocuments dialog
    box. When you want to save your master document, follow these steps:


    +   1. Choose **File:Save**, press Ctrl+S, or click on the Save button on the
    toolbar.

    If you haven''t expanded your master document, or if you have condensed it, WordPerfect
    saves the document with no comment. however, WordPerfect displays the message
    `Document is expanded. Condense?`.

    2. Click on **No** to save the document as is.

    WordPerfect saves the master document with the text of all the expanded subdocuments,
    too. It *doesn''t* save the text of the subdocuments back in the separate subdocument
    files. If you edit the text of your chapters in the master document, therefore,
    your edits aren''t saved in `Chapter 1`, `Chapter 2`, and so on — only in `Chocolate`.

    *Or*, click on **Yes** to save each subdocument in its own separate file.

    WordPerfect displays the Condense/Save Subdocuments dialog box, as shown in Figure
    17-11. Each subdocument is linked twice: once so that you can condense it (remove
    the text from the master document) and once so that you can save it in its own
    file. We always leave all the boxes checked. Go for the gold, we say.

    3. Click on **OK**.


    WordPerfect saves and condenses as you indicated.


    You can also condense a master document by choosing **File:Condense Master**.


    ![](img/a2afb402c275cfc5e5a8f62356a922ef_342_0.png)'
  merge: -1
  pgno: 342
- img_proc: true
  md: '# 314 Part IV: Creating Documents That Don’t Just Sit There


    ![](img/a2afb402c275cfc5e5a8f62356a922ef_343_0.png)


    Figure 17-11: Saving your book. Do you want to save each chapter back in its own
    file?


    # Editing a master document


    After you have set up master document, what do you do when you want to edit a
    chapter of your book? What if you get new information about early users uses of
    chocolate among the Aztec nobility, for example, and you want to include it in
    Chapter 2?


    You have two choices:


    +   * Edit the chapter file. In this case, make sure that the text of your chapter
    is stored in the subdocument file, not in the master document. Make your changes
    and save the chapter file. The next time you open and expand the master document,
    the updated chapter appears.

    * Edit the master document. In this case, make sure that your chapter file is
    closed. Open the master document and expand the subdocuments (or at least the
    one you want to edit). Make your changes and save the master file. You probably
    want to save the changes back to the subdocuments when WordPerfect presents the
    Condense/Save Subdocument dialog box, as we just described.


    This process can get rather confusing when you try to remember where the text
    of your chapters is *really* stored. We recommend that you always do your editing
    the same way and always store your master document the same way (either expanded
    or condensed).'
  merge: -1
  pgno: 343
- img_proc: true
  md: '# Chapter 17: Recipes and Templates for Popular Documents 315


    # Creating a table of contents


    "What good is a table without contents?" always ask (when we''re sitting down
    to dinner). WordPerfect automatically generate a table of contents for your book
    (or any document) by using the headings in the file. You can also use small-Roman-numeral
    numbers for the table of contents pages — just like a real book! These steps show
    you how:


    +   1. Open your master document and expand it.


    You want be able to see all your lovely chapters so that you can decide which
    ones should appear in your table of contents.


    +   2. Choose Tools:Reference:Table of Contents.


    More lovely buttons appear, mostly named Mark, as shown in Figure 17-12. This
    thing is (what else?) the Table of Contents toolbar.


    ![](img/a2afb402c275cfc5e5a8f62356a922ef_344_0.png)


    +   3. Mark the lines of text (headings) you want to use in the table of contents.


    Your table of contents can have several levels (chapters and sections within chapters,
    for example). To mark each heading, select it and click on the appropriate Mark
    button on the Table of Contents toolbar. (Where else?) Mark each chapter title
    by using Mark 1, for example, and each section within the chapters by using Mark
    2, for example.


    When you perform this step, nothing seems to happen. WordPerfect inserts secret
    codes at the beginning and end of each selected heading (the Mr Txt ToC code,
    if you were wondering).


    +   4. Create a new page where you want the table of contents to appear.


    For most books, you want the table of contents to be on a page by itself, right
    after the title and copyright pages. Press Ctrl+Enter to insert a page break.


    +   5. Tell WordPerfect to number the pages with small Roman numerals, beginning
    with the first page of the master document.


    Most books number the front matter (including the table of contents) with Roman
    numerals and then start the page numbers again with Arabic numerals at the beginning
    of the introduction or first chapter. You can do that, too. (Won''t your document
    look just like a real book?)'
  merge: -1
  pgno: 344
- img_proc: true
  md: '# 316 Part IV: Creating Documents That Don''t Sit There


    Move the cursor to the beginning of the master document and choose Format::Page::Page
    Numbering::Number. Set the position to Alternating Top or Alternating Bottom so
    that the numbers appear on the right side of left pages and on the left side of
    right pages. Click on the Options button and set the Page box to the Roman numeral
    options (iv,-iv, or IV,-IV). Then click on OK to finish page numbering.


    You may want to suppress page numbers on the title pages and some other-footer
    pages. To do so, choose Format::Page::Suppress


    +   6. Go to the first page of the introduction or Chapter 1 and reset it to be
    page 1, in Arabic numbers.


    With the cursor at the top of the page you want to be page 1, choose Format::Page::Page
    Numbering::Number. Click on Options and set the Page box back to earlier. Then
    click on OK. Click on Value, set the page number to 1, and click on OK. We go
    through this technique in gory detail in Chapter 8.


    WordPerfect now knows which page numbers should appear on every page. You''re
    ready to create the table of contents (and not a moment soon!).


    +   7. Move the cursor to the location where you want the table of contents to
    appear and click the Define button on the Table of Contents toolbar.


    WordPerfect displays the Define Table of Contents dialog box, as shown in Figure
    17-13.


    ![](img/a2afb402c275cfc5e5a8f62356a922ef_345_0.png)


    Figure 17-13: Telling WordPerfect how your table of contents should look.


    +   8. Tell WordPerfect the number of levels and which style to use for each level
    (whether to include page numbers and dot leaders); then click on OK.


    For a table of contents that lists one level of headings (for example, chapter
    titles) using regular numbers, leave everything in this dialog box alone. If you
    want an additional level of headings in the table of contents, change the Number
    of Levels box to the number of levels of'
  merge: -1
  pgno: 345
- img_proc: true
  md: '# Chapter 17: Recipes and Templates for Popular Documents 317


    headings you want. (For example, type 2 to include chapter titles and section
    headings within chapters.) For each heading level, you can set the position —
    where the number appears and whether it is preceded by a row of dots.


    When you click on OK, WordPerfect inserts an invisible code and the text <<Table
    of Contents will generate here>. Don''t worry: WordPerfect does better than that
    in a minute.


    +   9. Click on the Generate button on the Table of Contents toolbar.


    The Generate button is at the right end of the Table of Contents toolbar; you
    may have to make the WordPerfect window wider to see it. When you click on the
    button, WordPerfect displays the Generate dialog box.


    +   10. Click on OK.


    Some messages flash by. Then, poof — you have a table of contents.


    “No big deal,” you may say. “It would have been faster to copy the chapters by
    hand. Here’s the nice thing, though: if you update your book and make chapters
    shorter or longer, when you click on the Generate button again, WordPerfect updates
    the table of contents and corrects the headings and page numbers.


    After you finish fooling with the table of contents, click on the Close button
    on the Table of Contents toolbar. To get the toolbar back, you can always choose
    Tools<>Table of Contents.'
