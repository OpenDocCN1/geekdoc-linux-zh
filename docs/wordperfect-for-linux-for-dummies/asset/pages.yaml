  md: '# Chapter 17

    Recipes and Templates

    for Popular Documents


    +   In This Chapter

    - Templates

    - Letters

    - Memos

    - Faxes

    - Envelopes

    - Mailing labels

    - Booklets

    - Books and other big documents


    > There''s no point in reinventing the wheel. For years, the Great Minds of Word
    Processing have been contemplating the best ways to create many popular types
    of documents. The fruits of their contemplation are available to you in the form
    of templates that come with WordPerfect. WordPerfect also comes with ExpressDocs,
    which are fancy templates that ask you questions and tailor the document based
    on your answers. In this chapter, we do two things: talk about what a template
    is and look at some of the ExpressDocs you can use for whipping up crowd-pleasing
    documents.


    # What Are Templates?


    Templates are prototypes for different types of documents. WordPerfect includes
    more than 60 kinds of templates that are predesigned; you can also design and
    use your own. Templates are sort of blank forms. They don''t necessarily contain
    text, though; a template can contain only a collection of the particular fonts
    and format styles for a particular type of document, or it can contain all the
    text of your boilerplate contract.'
  merge: -1
  pgno: 322
- img_proc: true
  md: '# 294 Part IV: Creating Documents That Don''t Sit There


    Whenever you create a new document, WordPerfect uses a template. The blank document
    you see when you start WordPerfect is (unknown to you) based on a standard template
    — WordPerfect has to have some defaults to use for margins, fonts, and all the
    other elements that make up your document. Whether you create a new document by
    clicking on the New Blank button on the toolbar (the one that looks like a blank
    page with the corner turned down) or choosing File->New, WordPerfect again uses
    that standard template.


    If you don''t care for the WordPerfect prebuilt templates, you can create whatever
    that we want for your own. You may want your letters to use a template that specifies,
    for example, a 10-point Times Roman font. A template for prototype announcements
    may use 14-point Helvetica for styles and 12-point for other text. A template
    for a newsletter, however, may also contain title text, a logo-graphic, and 3-column
    formatting, in addition to specified fonts.


    For most practical purposes, though, you cannot do much more with a template than
    you by creating an ordinary document as a prototype, reusing it (opening it and
    changing it every time you want to write a similar document, and being careful
    to use the Save As command to save your new documents with new names. As the care
    and feeding of templates has become convoluted as WordPerfect has evolved, templates
    have gotten all tied up with projects and experts. In fact, unless you''re an
    expert (and in that case, what exactly are you doing reading a ...For Dummies
    books?), we recommend that you stick with this save-the-prototype-document-file
    method.


    # Not a Template but Just As Good: Making a Document Undeditable


    We like making our own prototype documents so much that we a trick with you.


    If you make an ordinary document you reuse rather than a template, you can tell
    WordPerfect not to allow you to write on top of it. That way, when-ever you customize
    the document and forget to use Save As (and the Save command instead), WordPerfect
    complains that you aren''t allowed to write on your prototype document. Those
    of us are a little absentminded find this reminder very useful. Linux lets set
    a file as read-only that you can''t edit or replace it.


    ![](img/a2afb402c275cfc5e5a8f62356a922ef_323_0.png)


    After you''ve saved a file you don''t want to be able to edit later, you can change
    the file mode to read-only. In the Save As or Open dialog box, click on the name
    of the file in the File List box. Choose Files->Change Mode from the'
  merge: -1
  pgno: 323
- img_proc: true
  md: '# Chapter 17: Recipes and Templates for Popular Documents 295


    dialog box''s menu to display the Change Mode dialog box, as shown in Figure 17-1.
    Click on the Write box in the User (first) row of boxes to unselect the box, thereby
    making the file uneditable by you. Then click on OK.


    ![](img/a2afb402c275cfc5e5a8f62356a922ef_324_0.png)


    # Using Templates


    Even if you don''t create your own template, you may want to use the WordPerfect
    template. Talking about using templates is, in fact, like talking using air: It''s
    not like you have much choice in the matter. All documents use templates. As we
    mentioned earlier in this chapter, you create something the standard template
    every time you create a new document. The standard template doesn''t have much
    in it — at least, not much as it comes out of WordPerfect (You can change the
    template, though.) The standard template contains mostly the initial paragraph,
    character, and page formatting that WordPerfect uses for your documents. If you''re
    having to change your fonts and other every time you create a new document, you
    should probably create your own template; see the sidebar "Creating your own templates,"
    later in this chapter.


    Here''s how to use a template other than the standard one:


    +   1. Choose File::ExpressDocs in a WordPerfect document window.


    The first time you use this command, see the Personal Info dialog box. If you
    (or someone else using your computer) has used this command-before, skip to Step
    3.


    +   2. Fill in the fields in the Personal Info dialog box.


    You have to do this step only the first time you use ExpressDocs; WordPerfect
    remembers what you type and uses it to personalize your documents automatically
    when you use some preprogrammed templates. When you click on OK, you see the WordPerfect
    ExpressDocs dialog box, as shown in Figure 17-2. The documents are listed alphabetically,
    by description. If you want to change your personal information later, click on
    the User Info button in the ExpressDocs dialog box.'
  merge: -1
