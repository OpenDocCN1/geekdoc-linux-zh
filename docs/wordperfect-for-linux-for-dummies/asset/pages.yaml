  md: '# 284 Part IV: Creating Documents That Don''t Just Sit There


    ![](img/a2afb402c275cfc5e5a8f62356a922ef_313_0.png)


    Figure 16-5: The WordPerfect Quick Data Entry box for merge data.


    # # Entering the data at last


    Before you can get WordPerfect to fill in the blanks and generate tons of letters,
    labels, address lists, or whatever, you have to tell it what to use to fill in
    the blanks. If you''re following along on our junk-mail saga in this chapter,
    you should see the Quick Data Entry dialog box that appeared when you finished
    specifying the fields in your data file. If you converted a text file that already
    had data in it, you will see data in the form already. If you''re entering the
    data from scratch, follow these steps:


    +   1. If the data file isn''t already open, open it.


    If you just created the data file, it''s still open.

    2. If the Quick Data Entry dialog box isn''t visible, display it.


    Click on the Quick Entry button on the Merge toolbar, which is the row of buttons
    just above the top of your document.

    3. Fill in a value for each field to create one record.


    Click on the First button to see the first record. Wherever you are, you can fill
    in or review all the facts about one person (or record). To move down a field,
    press Tab, press Enter, or click on Next Field; to move up click on Previous Field.

    4. Click on New Record to start the next record (the next person).


    When you get to the last field in a record, pressing Enter is the equivalent of
    clicking on this button.'
  merge: -1
  pgno: 313
- img_proc: true
  md: '# Chapter 16: Creating Your Own Junk Mail 285


    5. When you finish entering all the facts (field data) about all the people (record
    data), click on Close.


    WordPerfect asks whether you want to save the changes to disk. Unless you have
    been typing names just to see your fingers move, answer Yes. If you are editing
    a file that was already saved to disk, WordPerfect updates it. If you started
    with a blank document, WordPerfect displays the Save File dialog box so that you
    can enter the filename. In that case, enter a filename and click on OK.


    When you enter information in a data file, be sure to enter it as you want it
    to appear in your letters.


    When you close the Quick Data Entry dialog box, you should see the data you entered
    with each field on a separate line. Between one record and the next is an ENDRECORD
    merge code and a page break. At the end of each field is the word ENDFIELD (another
    merge code).


    If you don''t like your screen cluttered with these long merge codes, you can
    display them as little bubbles. Click on the Options button (the button on the
    right) on the Merge toolbar. A menu that appears probably has the Display command,
    which indicates that WordPerfect is displaying the names of merge codes in your
    document. If you choose Display As Markers, the code names are replaced by little
    red diamonds — much tasteful.


    If you choose Hide Codes, the code names disappear; this idea is usually a bad
    one, though — in case you edit the records in the document, you should be able
    to verify that the ENDFIELD codes remain at the end of each field.


    # Making corrections


    If your life is like ours, soon (rather than later) you have to fix up the addresses
    you entered or (in our example) delete the names of people whose children have
    not tended to attend your daycare center. You can edit the data file as though
    it were a normal document, although you have to be careful not to mess up the
    ENDFIELD and ENDRECORD merge codes. A better way to make all your corrections
    is to use the Quick Data Entry dialog box, which you display by clicking on the
    Quick Entry button on the Merge feature bar.


    While you''re using the Quick Data Entry dialog box, you can do the following
    things:


    +   To find a record, click on the Find button (It doesn''t matter which field
    your cursor is in when you do this; WordPerfect looks for the information in all
    the fields.) You see a Find dialog box that looks and works like the familiar
    Find and Replace Text dialog box. Refer to Chapter 4'
  merge: -1
  pgno: 314
- img_proc: true
  md: '# 286 Part IV: Creating Documents That Don''t Just Sit There


    +   - To move from record to record, click on the First, Last, Next, and Previous
    buttons on the right side of the Quick Data Entry dialog box.

    - To delete the record in the dialog box, click on the Delete Record button. Watch
    out, though — WordPerfect doesn''t ask for any confirmation before blowing away
