  md: '# # What''s on the Application Bar?


    The Application Bar displays vital information about a document. You can control
    the kind of information WordPerfect displays, although you''re probably not interested
    in this arcane subject at the moment (see Chapter 19 if we''re wrong about your
    insatiable curiosity). If you can''t see the Application Bar, your KDE or GNOME
    taskbar along the bottom of the screen might be covering it. Starting from the
    left, here''s what this gibberish means:


    ![](img/a2afb402c275cfc5e5a8f62356a922ef_47_0.png)


    +   - The first picture looks like a very blurry cursor with a very blurry cursor
    next to it. Go ahead and squint, and while you''re at it, use your imagination.
    The idea here is to tell you whether the shadow cursor is on and let you turn
    it on and off. Think of it as a button. If it''s pressed around it (has a little
    square around it), it''s on. Click on the picture, and you''ll get the idea.


    ![](img/a2afb402c275cfc5e5a8f62356a922ef_47_1.png)


    +   - Next to the blurry cursor is a picture of a printer. It would be nice if
    you could find out your printer is turned on by seeing whether the printer is
    pressed in (has the little square around it, although you''ve figured out by now,
    right?), but, of course, that would be too simple. You can click on this picture
    of a printer to find out all about your printer. You better skip to Chapter 11
    for the gory details, though WordPerfect assumes that when you click on the Application
    Bar printer icon, you''re interested in learning about your printer, and it displays
    the Select Printer dialog box, which describes your printer. When you click on
    the toolbar printer, WordPerfect assumes that you want to print your document
    and shows you the Print dialog box. In either case, you can click on the button
    you''re really interested in.


    ![](img/a2afb402c275cfc5e5a8f62356a922ef_47_2.png)


    +   - Next to the printer is the word *Insert*. Insert mode means that when you
    type, the letters are inserted wherever the cursor is positioned. In Typewriter
    mode, the letters you type replace (or over) the characters to the right of the
    cursor. You switch between Insert and Typewriter modes by pressing the Insert
    (or Ins) key or clicking on this box. When you''re editing fancy, such as a table
    or a merge file, other information may appear in this box. If you click on the
    Application Bar displays, you can change the info. (See Chapter 4 for more details.)


    +   - Further to the right, the Application Bar tells you where you are in a document,
    including the page number (Pg), how far down the page you are (Ln), and where
    you are across the page (Pos). For the most part, of course, who cares, unless
    you get paid to write by the inch? Every once in a while, however, you may want
    to know exactly where on the page your text will appear, and these measurements
    tell you.'
