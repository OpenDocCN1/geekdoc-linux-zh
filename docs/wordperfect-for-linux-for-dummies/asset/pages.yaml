    # Using QuickMenus for Even More Ways to Choose Commands


    If you''re beginning to get a headache just thinking about the regular, plain-vanilla
    menu bar, give this subject a miss.


    As usual, in its quest to give you more options than you would have thought possible,
    WordPerfect provides another way to choose commands. This method involves the
    use of the right mouse button. Usually, whenever we tell you to click the mouse
    button, we always mean the left.


    The people who wrote WordPerfect, however, decided that because most mice have
    two or three buttons, ignoring the additional one or two buttons would be missing
    an opportunity for more menus, options, and (probably) confus.


    In many Windows programs, clicking on something with the right mouse button pops
    up a little menu. These wacky WordPerfect for Linux people decided to have WordPerfect
    do the same, and they named their little QuickMenus. Throughout this book, whenever
    clicking on something with the right mouse button displays a Quick, we tell you
    about it. We call it right-clicking. It''s getting more and more popular, so try
    to remember it. The Application Bar (the bar at the bottom of the screen), for
    example, has a Quick that includes an option to hide the Application Bar if you
    get tired of looking at it.


    These steps show you how to see a QuickMenu:


    +   1. Point to the Application Bar with the mouse pointer.


    +   2. Click once, using the right mouse button.


    A little box pops up, right where the mouse pointer is.


    Voila! Now that you can see a Quick — specifically, the one for the Application
    Bar — what good does it do for you? This Quick has only two options: Hide Application
    Bar and Settings.


    Most QuickMenus have a Settings, Options, or Properties option that lets you customize
    the way WordPerfect works. We talk about customizing'
