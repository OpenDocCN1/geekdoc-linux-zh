  md: '# 364 Part V: Oh, Help!


    This list shows some things to try when your document doesn''t print:


    +   - Make sure that the printer is on and online.

    - Tell Linux to cancel printing the document so that you can start over. How this
    process works depends on your window manager. In KDE, click on the Printer icon
    on the desktop. You see a window with a list of print jobs that are waiting to
    print or actually printing. (Refer to Chapter 11 for more information.)

    - If you use a network, the problem undoubtedly be blamed on it. As other computer
    users in your office may check whether they can print on the printer you want.
    You may have to talk to your network administrator. Ask such questions as “How
    can I tell whether my job is in the queue?” and “Can you make sure that my system
    is attached to the right printer?” Who knows — the joke memo you just finished
    writing may be printing on the fancy printer in the executive suite!

    - It''s worth checking into silly, pedestrian problems, such as the cable''s falling
    out of the back of either printer or the computer. If the cable has detached itself,
    you should shut down WordPerfect, the window manager, Linux, the computer, and
    the printer before reconnecting the. Electricity is your friend, although you
    may well play it safe.


    # “Yikes! I Didn''t Mean to Delete That!”


    The finger is quicker than the brain, especially when it''s heading straight for
    a key that deletes something. In WordPerfect, as in all powerful word process-programs,
    blowing away hours or weeks of work is horribly frustrating.


    If you have deleted some text, you can bring it back by pressing Ctrl+Z (Undo
    works, too.) If you''ve done some things since you deleted the text, you may have
    to press Ctrl+Z a number of times. You can always do your edits again, however.
    Reconstructing deleted text from memory can be trickier.


    If you just deleted an entire document by selecting it in the Open or Save dialog
    box and then pressing Delete, you have a more serious problem. Few Linux systems
    have a way to undelete a file. This list shows some approaches after you delete
    something accidentally:


    +   - Your system may have a trashcan or recycle bin where deleted files wait
    for final deletion. If you see a Trash or Recycling icon on your desktop, click
    on it and see what happens. In KDE, the icon displays the Desktop/Trash directory
    stored in your home directory. The directory may contain the file deleted. If
    it does, undo your document by moving it back into the directory where you want
    it. (Refer to Chapter 13 to find out how to move files.)'
