  md: '# WordPerfect For Linux For Dummies


    Although we assume that you have a computer guru at your disposal, we also know
    that gurus can be hard to coax from their rock on top of the mountain. So, we
    teach you a few of the important guru-type tricks when it''s practical.


    # What You''re Not Supposed to Read


    Don''t read anything with a picture of nerdy-looking Mr. Science guy next to it
    (the Technical Stuff icons) unless you really feel a need to know why something
    is true rather than how to do something useful. (You know the Mr. Science type
    — full of brain-glazing explanations of how, for example, "User Preferences we
    set under the XYZ dialog box are actual edits to the .shrc file when you really
    need to know is "Press this key.") The only good part about reading the stuff
    is that it can help you sound sufficiently informed to your computer wizard to
    induce her to do technical things for you.


    # How This Book Is Organized


    Unlike the WordPerfect manual, which is organized alphabetically, this book is
    organized by what you may be trying to do. It doesn''t explain, for example, all
    the commands on the Edit menu in one chapter. Our reasoning is that the Edit commands
    do not necessarily have anything to do with editing and that Edit is a foolish
    category because isnt almost everything you do in a word processor a sort of edit
    anyway?


    No, what this book does is break things into the following five useful categories.


    # Part 1: Introducing WordPerfect for Linux


    Part I discusses the basics: your keyboard, your mouse, and the WordPerfect screen
    and how they all work together to let you write stuff and make it out of your
    printer. Part I is the place to go for some of the basics of using WordPerfect
    menus, keystrokes, and buttons. It also has information about some fancier basics,
    such as searching and replacing, working with blocks of text, and spell checking.
    Part I can even help you if you have never worked in Linux or ever used a computer.'
  merge: -1
  pgno: 33
- img_proc: true
  md: '# Part II: Prettying Up Your Text


    If you didn''t care how your text looked, you wouldn''t be using a word processor,
    would you? What? You say that all you want to do is put something in boldface
    type or italics? And perhaps center a heading? And set the margins? And put in
    page numbers? It''s all here.


    # Part III: Things You Can Do with Documents


    You thought you were just word processing, didn''t you? Hah! You''re really *creating
    entire documents*. And now you have to live with your creation, Dr. Frankenstein.
    Maybe you want to print your document, for example. Or, kill it off altogether
    by deleting it. Or, move it somewhere where it can do no harm. Part III talks
    about all this kind of stuff.


    # Part IV: Creating Documents That Don''t Just Sit


    Your document could just be words on a page, but, hey — this is the age of magazines
    with layouts so fancy you can hardly read them. You may as well get into the act,
    too. You can start with borders and columns and move on to pictures and drawings.
    After you''ve created a perfectly illegible document, send it out as junk mail
    or put it on the World Wide Web. It''s all in Part IV.


    # Part V: Oh, Help!


    WordPerfect is big-time software consumes vast portions of your computer''s disk
    and memory space with lots of incredibly complex, sophisticated, and clever software.
    Unfortunately, sometimes it''s a tad too complex, sophisticated, and clever for
    its own good — or yours.


    Go to Part V when things don''t work quite right — or at least, when they don''t
    work the way you think that they should.'
  merge: -1
