- img_proc: true
  md: '# Part IV: Creating Documents That Don''t Just Sit There


    We assume throughout this section that you have already double-clicked on the
    drawing and have it displayed in the WP Draw window.


    This list describes what you can do with some of the buttons on the WP toolbar:


    +   Line: Click and drag your drawing to create a line. Double-click on the end
    of the line. To make a series of connected lines, click once at the end of each
    line and double-click at the end of the last line.


    +   Polygon: To create a closed shape consisting of a series of line segments
    (like a triangle, instance), click and release the end points of each line segment.
    Double-click on the end of the last segment, WordPerfect automatically connects
    to the first point so that the lines form an enclosed space.


    +   Rectangle: Click and drag diagonally across the space you want covered by
    the rectangle.


    +   Rounded Rectangle: It''s the same as a rectangle, except with rounded corners.


    +   Ellipse: Click and drag to make an ellipse or circle.


    +   Elliptical Arc: Probably not the way you want to draw a curve, but never know.
    Click and drag from one end of the arc. You get 1/4 of an ellipse that ends at
    the place where you click next.


    +   Curve: Confusing but powerful. Click on one end of your curve. At the first
    inflection point (that''s where you want your curve to change direction, such
    as at the top of a rainbow), click again. Each additional click gets you another
    inflection point. Double-click when you''re finished.


    +   Closed Curve: It''s just like a polygon, except with curved lines.


    +   Freehand: Click and hold; wherever you drag the mouse, you don''t release
    the mouse button when you''re finished!


    When you click a shape you''ve drawn, it''s surrounded by by handles. (If clicking
    doesn''t select the shape, right-click on it and choose Select from the menu that
    appears.) By pulling on it, you can reshape the shape. When the shape is selected,
    you can also drag it to a new location in your picture. Right-clicking on the
    shape displays a QuickMenu with some other cool commands. Our two favorite QuickMenus
    are Edit Points (lets you change any of the points where you clicked when you
    draw the shape) and Rotate, which lets you, well, rotate your shape.


    ![](img/a2afb402c275cfc5e5a8f62356a922ef_299_0.png)'
  merge: -1
  pgno: 299
- img_proc: true
  md: '# Chapter 15: Say It with Pictures


    Before you draw a shape, you can choose what type of line will outline it and
    what color or pattern will appear inside it (for closed shapes). After you''ve
    chosen a line and fill style and pattern, all the shapes you draw use those settings
    until you change the settings again. Here are the buttons you can use:


    +   - Line Style: Sets the line type, such as dotted or solid


    +   - Line Color: Sets the color of the line


    +   - Fill Pattern Style: Sets the pattern with closed shapes will be filled


    +   - Fill Pattern Color: Sets one color of the pattern with which closed shapes
    will be filled


    The line and fill color and style buttons work much like the text box border and
    fill settings we explain in Chapter 14.


    # # Putting text in your drawings


    WordPerfect is, after all, all about words. It shouldn''t be surprising, therefore,
    that you can type directly in your drawing, by clicking the Text button on the
    WP Draw toolbar. Text in a drawing appears in its own little text box inside the
    picture. Unlike with text in a WordPerfect document, you can change the size of
    text in a drawing by dragging the handles that surround it (after you put it in
    your drawing). Rather than be defined by point sizes (refer to Chapter 6), the
    text can grow and shrink with infinite variability.


    To add to your drawing, double-click on your drawing to edit it in WP Draw (if
    you don''t already have it open in WP Draw) and follow these steps:


    +   1. Click on the Text button on the WP Draw toolbar (the button with the big
    A on it).


    The mouse pointer turns into crosshairs in your drawing. You can use the crosshairs
    to create the area.


    +   2. Drag the crosshairs to create a box to hold the text.


    Your box is displayed in the WP Draw Text Editor, as shown in Figure 15-5. The
    box is blank because you haven''t typed the text yet.


    +   3. Type the text in the WP Draw Text Editor box.


    You can use the Format menu in the WP Draw Text Editor to change the text font
    and justification (left, right, center — you know the drill).


    +   4. Choose File>Close the WP Draw Text Editor and get back to your drawing.


    The text you just typed is added to your drawing.'
