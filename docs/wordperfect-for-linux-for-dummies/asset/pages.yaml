  md: '# 290 Part IV: Creating Documents That Don''t Just Sit There


    2. Enter the name of the form file.


    Click on the little triangle at the right end of the Form File box and pick Select
    File. WordPerfect enables you to select the filename and inserts the complete
    pathname of the form file (/usr/wpbin/threat1, example). If the form file is the
    open document, you can leave the Form File set to <Current Document>.


    As soon you enter the name of the form file, WordPerfect enters the name of the
    associated data file in the Data File box. If no associated data file exists,
