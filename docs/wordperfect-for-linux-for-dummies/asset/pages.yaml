  md: 'Chapter 12: Juggling Documents on Your Screen 219


    # Word processors versus food processors


    Although WordPerfect does a great job of importing and exporting files in many
    other formats, it isn''t perfect. Not that it''s WordPerfect''s fault — the problem
    is that different word processors have different capabilities and do the things
    in different ways. Sometimes, files that have been imported or exported look as
    though they were mistakenly put in a food processor for a few seconds.


    When you''re using a foreign file, look around it before you blithely edit or
    print it. The formatting may be fouled up. Fonts may change mysteriously. You
    may find extra paragraph-ending characters (the ones you usually put in using
    the Enter key) where they don''t belong. Some cleanup may be in order.'
