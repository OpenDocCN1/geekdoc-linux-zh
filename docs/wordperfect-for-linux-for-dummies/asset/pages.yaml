  md: '# Chapter 13


    # # Juggling Files on Your Disk


    **In This Chapter


    +   * Naming files

    * Using directories

    * Using the WordPerfect file manager

    * Moving, renaming, copying, and deleting files

    * Finding a file with a forgotten name


    In the old days, Linux didn''t have a file manager. As with all UNIX systems,
    everything you did to a file was done by typing commands in response to a cryptic
    prompt. Users became adept at typing `cd`, `ls -l`, `pwd`, `cat`, and about a
    hundred other commands whenever they wanted to look at, copy, move, delete, or
    rename a file. Frankly, file managers have blossomed, and Linux has so many file
    managers that you could spend a week deciding which file manager you like best.
    These file managers are replete with pretty icons, menus, and drag-and-drop features.


    File managers have become so routine that you can now find them inside other applications,
    including WordPerfect for Linux. WordPerfect has its own file manager built in,
    to help you with all the file manipulating you''re bound to run into. This chapter
    runs through the basics of the WordPerfect file manager.


    We talk a great deal about directories in this chapter. If you''re used to Windows
    or Macintosh, you probably know them as folders. Although the same thing, long
    before anyone thought of the folder analogy, they were known in UNIX-land as directories,
    and the name has stuck. You can call them folders if you want, but then no one
    will ever believe that you''re a UNIX guru.


    ![](img/a2afb402c275cfc5e5a8f62356a922ef_250_0.png)'
  merge: -1
  pgno: 250
- img_proc: true
  md: '# 222 Part III: Things You Can Do with Documents


    # WordPerfect Versus Real File Managers


    Exploring the directories and files in your computer is a rather large topic.
    In fact, a whole chapter in LINUX For Dummies, 4th Edition, tells you everything
    about it. (Margy wrote the book with John R. Levine; it''s published by — who
    else? IDG Books Worldwide, Inc.) We don''t do that here. Instead, we tell you
    just enough to get your files organized.


    The topic is also large enough that Linux has not one, but several programs that
    do nothing else help you explore the directories on your computer. Most common
    Linux desktop environments (such as KDE and GNOME) have a file manager program,
    and for heavy-duty file exploration, they''re just the ticket. If you want to
    make big changes to your files, like moving lots of files at one time or reorganizing
    your directories, consider learning to use the file manager that comes with your
    window manager. If you use KDE, for example, you can choose K+Home from the KDE
    taskbar at the bottom of the screen to see KDE''s own file manager (which looks
    amazingly like the Windows 98 My Computer folder folders).


    Although the WordPerfect file manager does the job of managing files, calling
    it file manager may be a bit overwhelm. Just as one wouldn''t expect a real file
    manager to excel at processing words, one shouldn''t develop high hopes that a
    word processor should include a full-featured, supercharged file manager. For
    example, the WordPerfect file manager doesn''t let you drag and drop files with
    the mouse. Despite the file manager''s shortcomings, though, it''s still a handy
    tool. The rest of this chapter describes the file management magic you can perform
    with the WordPerfect file manager.


    # Exploring Your Directories


    In WordPerfect, you may have noticed that the File+Open, File+Save As, Program+File
    Manager, and Insert+File commands show you more or less the same dialog box. It''s
    where the WordPerfect file manager lives. You can also display a similar File
    Manager dialog box by choosing Program+File Manager from the program window. Look
    at the Save As dialog box, as shown in Figure 13-1.'
