    > You know how software can be — badly behaved, saving files in the wrong folders,
    displaying incomprehensible things on the screen, and being generally rude. It''s
    time for some lessons in deport. You can teach WordPerfect to behave like the
    kind of gentleman or lady with whom you like to be seen.


    A Nifty WordPerfect quality is that it lets you customize so much about the way
    it works. In this chapter, you find out how to display information about your
    documents, how to zoom in on the text of your document for a close-up look, how
    to control which buttons appear on the Property Bar and toolbar, how to control
    where WordPerfect stores things (in which folders on disk), and how to set other
    preferences.


    If you''re happy with WordPerfect the way it is, you can skip this chapter. On
    the other hand, if you''re really, really happy with WordPerfect, you may want
    to see a shrink. Leaving WordPerfect to behave as it does out of the box is not
    such a bad idea. One advantage of this approach is that WordPerfect will work
    just like everyone else''s (unless they have customized their copies), so getting
