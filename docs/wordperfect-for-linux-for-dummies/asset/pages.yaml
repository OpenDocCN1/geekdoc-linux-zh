  md: '# Chapter 8: Perfect Pages and Dashing Documents


    # # Starting a New Page


    If you have typed any significant amount of text in WordPerfect, you probably
    have noticed that every often it suddenly introduces a huge gap between one line
    and the next. This gap is the WordPerfect way of telling you that you just filled
    one page and are starting at the top of the next page — a sort of digital equivalent
    of ripping the paper from your typewriter and sticking a new sheet under the platen.


    ![](img/a2afb402c275cfc5e5a8f62356a922ef_162_0.png)


    WordPerfect keeps track of where on the page each line appears. You can see your
    position on the page by looking at the Application Bar, where it says Ln (short,
    we guess, for Line), followed by a measurement in inches (or maybe centimeters).
    This spot is your position from the top edge of the page.


    What if you don''t want to fill a page before starting the next? You can insert
    a secret code (not another one!) that tells WordPerfect to skip to the top of
    the next page. This feature is called a page break. The page breaks that WordPerfect
    sticks in when pages are full are soft page breaks. regardless of whether this
    is full. If you want to put in a break yourself, it''s a hard page break (See
    Chapter 9 to find out about the difference between hard and soft codes.).


    To insert a hard page break, press Ctrl+Enter. Poof! The cursor dashes down to
    the top of a new page. If you were in the middle of the line, the part of the
    line after the cursor moves with you down to the new page.


    To get rid of a hard page break, move the cursor to the beginning of the page
    after the page break and press the Backspace key (assuming Linux is configured
    for the Backspace key to delete the preceding character). This step backs you
    up, and, with luck, deletes the page-break code in the process. Alternatively,
    you can move the cursor to the last character before the page break and the Delete
    key — same idea. If this doesn''t work, see Chapter 9.


    You may be tempted to begin a new page by pressing Enter over and over until the
    page is full of carriage returns and you arrive at the top of the next page. We
    hate to be judgmental — in our humble opinion, however, this action is wrong,
    wrong, wrong. Here''s why: If you edit the earlier part of your document so that
    it gets just a teen bit shorter, everything shifts up a tad. Now you have too
    few carriage returns to fill the page, and the text begins at the bottom of the
    preceding page rather than a new page — not the effect you want. Take our advice:
    Insert a hard page break instead. It''s much less work!


    ![](img/a2afb402c275cfc5e5a8f62356a922ef_162_1.png)'
  merge: -1
  pgno: 162
- img_proc: true
  md: '# 134 Part II: Prettying Up Your Text


    The name of the secret hard-page-break-code is HPg, in case you were wondering.
    The soft page breaks that WordPerfect adds are HRT-SPg or SRT-SPg, depending on
    whether the page break occurs between paragraphs or in the middle of a paragraph.


    ![](img/a2afb402c275cfc5e5a8f62356a922ef_163_0.png)


    # Keeping Text Together


    You have complete control over where hard page breaks occur because you put them
    in yourself. WordPerfect sticks in soft page breaks, however, whenever it decides
    that no more lines fit on a page. Sometimes it chooses singularly bad spots to
    begin a new page — in fact, we suspect malice at those times. A technical term
    was created for lousy positioning of page breaks: *bad breaks*. (We always thought
    that it was lousy skiing term.)


    # Avoiding broken homesn(widows and orphans)


    A page looks lousy when a paragraph begins on the last line of the page so that
    only one line of the paragraph appears before the page break. This traditional
    typesetting no-no has a traditional name: widow (or is it orphan?). Our dictionary
    informs us that this is an *orphan*. A *widow* occurs when the last line of a
    paragraph appears at the top of a page all by itself. (At your backyard picnic,
    amaze your friends by conducting a pop quiz to see who knows the difference.)


    Luckily, you don''t have to know about this stuff or even think about it because
    WordPerfect does your worrying for you. Follow these steps to avoid the dreaded
    disease of bad breaks:


    +   1. Move the cursor to the beginning of the document by pressing Ctrl+Home.


    The following command and the resulting secret code apply to the entire document.


    +   2. Choose Format:Keep Text Together.

    WordPerfect displays the Keep Text Together dialog box, as shown in Figure 8-2.


    The dialog box contains three settings that have to do with positioning page breaks,
    and we discuss all three in this chapter. Your immediate concern, however, is
    those widows and orphans.'
  merge: -1
  pgno: 163
- img_proc: true
  md: '# Chapter 8: Perfect Pages and Dashing Documents


    ![](img/a2afb402c275cfc5e5a8f62356a922ef_164_0.png)


    +   3. Click on the box labeled Prevent the first and last lines of paragraphs
    from being separated across pages; the box should be filled in when it''s selected.


    This box is in the Widow/Orphan section of the dialog box.


    +   4. Click on OK or press Enter to leave the dialog box.


    WordPerfect avoids leaving widows and orphans alone at the top and bottom of pages.
    Instead, it moves page breaks up or down a line as necessary. Also the pages won''t
    be completely full; that''s the price you pay for family cohesion.


    When you follow the preceding steps, WordPerfect creates a Wid/Orph:On code in
    your document. Chapter 9 describes how to see and delete this code if necessary.


    # Keeping your act together


    A document may contain information that should not be split over a page break.
    A columnar table looks crummy if it''s split up, for example, unless it''s longer
    than one page. You can select part of your document and tell WordPerfect, "Let
    no page break enter here!" Follow these steps:


    +   1. Select the text you want to keep.


    Refer to Chapter 5 to find out how to select text, if you don''t already know.
    For tables, be sure to include any headings or titles.


    +   2. Choose Format:: Keep Text Together.


    WordPerfect displays the Keep Text Together dialog box (refer to Figure 8-2).


    +   3. Click on the box labeled Keep selected text together on same page that
    the box is filled in.


    This box is in the Block protection section of the dialog box.


    +   4. Click on OK or press Enter.'
  merge: -1
  pgno: 164
- img_proc: true
  md: '# 136 Part II: Prettying Up Your Text


    Block protect sounds like the maneuver a two-year-old uses when another kid comes
    to visit, although WordPerfect isn''t talking about that kind of block. earlier
    versions of WordPerfect, selecting text was always called marking blocks, and
    doing anything with a bunch of text was a block operation. WordPerfect has now
    adopted Windows-speak, which requires you to a bunch of text as a selection. it''s
    another example of the Great March of Progress.


    ![](img/a2afb402c275cfc5e5a8f62356a922ef_165_0.png)


    When you follow these steps, WordPerfect inserts two Block Pro codes in your document:
    one at the beginning of the selected text and one at the end.


    # Keeping your head together


    Specifically, this heading means keeping headings with the text that follows them.
    (You were thinking of the great Carole King hits of yesterear, weren''t you? unless
    you''re too young to remember them.) Leaving a heading stranded alone at the bottom
    of a page while the text that follows the heading begins on the following page
    is tacky and gauchy


    Unlike preventing widows and orphans, which you can do by,issuing command at the
    beginning of your document, you must issue a separate command for each heading
    you want to keep with the text that follows it. (The solution to this annoying
    situation is to use styles to format headings; jump to Chapter 10 if this subject
    interests you.)


    To prevent WordPerfect from separating a head(ing) from its body, follow these:


    +   1. Move the cursor to the beginning of the line that contains the heading.

    2. Choose Format:Keep Text Together.

    WordPerfect displays the Keep Text Together dialog box (refer to Figure-8-2).
    Look at the Conditional end of page section of the dialog box.

    3. Click on the box labeled Number of lines to keep together so that it''s filled
    in.

    It''s in the Conditional End of Page section of the dialog box.

    4. Type a number in the text box.

    To keep together the heading line and the first two lines of the text that follow
    it, enter 3. If you use a blank line to separate the heading from the text, you
    may want to enter 4.

    5. Click on OK or press Enter to leave the dialog box.


    If the heading and the first few lines that follow cannot fit at the bottom of
    the page, WordPerfect now moves the whole kit and kaboodle to the top of the next
    page.'
  merge: -1
  pgno: 165
- img_proc: true
  md: '# Chapter 8: Perfect Pages and Dashing Documents


    When you follow these steps, WordPerfect inserts a Cond1 EOP (Conditional End
    of Page) code into your document. If you use styles to format headings, you can
    insert a Cond1 EOP code into the heading style to avoid headlessness throughout
    your document. (See Chapter 10 to find out more about styles).


    Don''t use too many Block Protect and Conditional End of Page codes in your document
    or else WordPerfect will have a heck of a time finding anywhere to put page breaks.
    Cut it some slack!


    # Centering a Page, from Top to Bottom


    When you create a title page for a document, the titles look nice if they appear
    in the middle of the page, both up and down and left to right. Chapter 7 talks
    about how to center text between the left and right margins. (Oh, all right: Select
    the text to center and press Ctrl+E). The following steps show how to center the
    titles top to bottom. Although you can just press Enter a bunch of times above
    the titles, it''s a ba-a-a-ad idea. Let WordPerfect put your titles exactly in
    the right place.


    +   1. Move the cursor to the top of the page that contains the text to be centered
    top to bottom (in most cases, it''s the first page of your document).

    2. Choose Format>Page>Center.


    WordPerfect displays the Center Page(s) dialog box, as shown in Figure 8-3.


    ![](img/a2afb402c275cfc5e5a8f62356a922ef_166_0.png)


    +   3. To center this page, choose Current Page.

    4. Click on OK or press Enter.


    WordPerfect moves the text on the page up or down to its center.


    You can tell the vertical position of the text on the page by looking at the Ln
    measurement on the Application Bar.'
  merge: -1
  pgno: 166
- img_proc: true
  md: '# 138 Part II: Prettying Up Your Text


    To revoke centering on a page, move the cursor to the top of the page, choose
    Format>Page<>Center to display the Center Page(s) dialog box, and choose No Centering.


    When you center the current page, WordPerfect quite simply inserts the secret
    Cntr Pg code. Centering the current and subsequent pages produces Cntr Pgs code.
    Chapter 9 tells you how to see these magical codes for yourself. If you can deal
    with them, double-click on the Cntr Pg or Cntr Pgs code to display the Center
    Page(s) dialog box so that you can change the setting.


    ![](img/a2afb402c275cfc5e5a8f62356a922ef_167_0.png)


    # Looking at Different Views

    of Your Document


    WordPerfect can show your document from several angles, depending on how closely
    you want the view to resemble the printed page. This list shows the different
    views you can choose:


    +   - Draft: Page breaks appear as horizontal lines across your document, and
    you cannot see top or bottom margins, extra space on a partially full page, headers,
    footers, or page numbers.


    +   - Page: WordPerfect shows how the page will look, including all margins, headers,
    and footers. Page breaks look like blank gaps between one page and the next. How
    big your text looks depends on what the Zoom setting is. We talk all about that
    topic in Chapter 19.


    +   - Web Page: You can see your page roughly as it would be displayed in a Web
    browser (the program you use to look at World Wide Web pages). Be cautious when
    you''re using this view; WordPerfect warns you that some of your formatting may
    be lost.


    To switch between these three views, choose View from the menu bar and then choose
    Draft, Page, or Web Page.


    We bring up some of these views because we''re about to talk about page for-formatting
    you can see only in page view: page numbers, headers, and footers.


    ![](img/a2afb402c275cfc5e5a8f62356a922ef_167_1.png)


    If your Alt and Ctrl keys are configured to work with WordPerfect, a faster way
    to switch to Draft view is to press Ctrl+F5. A quicker way to jump to Page view
    is to swat Alt+F5. WordPerfect has no fast way to let you see Web view most just
    work in Page view. We always do. Why not see everything, after all?'
  merge: -1
  pgno: 167
- img_proc: true
  md: '# # Numbering Pages


    After you have a document with more than one page, you probably want to number
    the pages. Few things are more annoying than a sheaf of pages with no page numbers
    that have gotten (or may have gotten) out of order. Don''t look like a schnook;
    number your pages.


    For some strange reason — probably some quirk of software history — WordPerfect
    has not one but two ways to number pages (Why do we say this with surprise? WordPerfect
    always seems to have two ways to do everything.) The following list shows the
    two ways:


    +   - Use the Format:Page Page Number:Number command to tell WordPerfect to begin
    numbering the pages. You can tell WordPerfect where the numbers should appear
    and also enter other text, such as today''s date or the document title, to include
    with the page number.

    - Use the Insert:Header/Footer command to define headers or footers, which can
    include page numbers.


    These two approaches are similar, and we talk about headers and footers in a minute.
    These steps show how to use the first method to number your pages:


    +   1. Move the cursor to the top of the page on which you want page numbering
    to begin.

    If your classy-looking document has a cover page, for example, you can begin numbering
    on the next page.

    2. Choose Format:Page Page Number:Number.

    WordPerfect displays the Page Numbering dialog box, as shown in Figure 8-4.


    ![](img/a2afb402c275cfc5e5a8f62356a922ef_168_0.png)'
  merge: -1
  pgno: 168
- img_proc: true
  md: '# 140 Part II: Pretty Up Your Text


    3. Tell WordPerfect where to print the page numbers.


    Click in the Position box. You see a long list of choices that fall into three
    groups: No Page Numbering, Top, and Bottom. Within the Top and Bottom groups,
    you can select Left, Center, Right, or Alternating. The Alternating option does
    not mean that you and a friend have gotten your bikinis mixed up — it indicates
    that the page number appears on the right side of odd-numbered pages and on the
    left side of even-numbered pages, and vice versa inside alternating. Alternating
    is just right for documents printed on both sides of the paper (this book, for
    example) because the page numbers appear on the outside edge of each page.


    Fortunately, you don''t have to remember which numbering format is. After you
    select a format, just check out the example of the page-numbering format at the
    bottom of the dialog box. This is cute or what?


    4. If you want your pages to show Page or other text along with the page number,
    click on the Options button to display the Page Numbering dialog box.


    If a plain, unadorned page number works for you, skip down to Step 7 instead.


    5. In the Format and Accompanying Text box, what text you want to appear beside
    your page number.


    The simplest thing to do is to type the word *Page* and a space in front of the
    `[Pg #]` code.


    6. Click on OK to get back to the Page Numbering dialog box.


    WordPerfect shows how the page numbers will look on the sample facing pages.


    If you want the page number to appear in a different font, click on the Font button
    and choose the font and font size that appears (which looks out an awful lot like
    the Font dialog box we describe in Chapter 6). Then click on OK to return to the
    Page Numbering dialog box.


    7. Click on OK to bug out of this dialog box.


    WordPerfect now prints page numbers on this page and on all following pages in
    the document — even pages you add later.


    When you tell WordPerfect to number pages, it adds a secret *Pg Num Pos* code
    at the top of the page. (See Chapter 9 for information about secret codes.)


    ![](img/a2afb402c275cfc5e5a8f62356a922ef_169_0.png)'
  merge: -1
  pgno: 169
- img_proc: true
  md: '# Chapter 8: Perfect Pages and Dashing Documents


    # For all you Roman-numeral fans


    You don''t have to use boring, pedestrian Arabic numbers for page numbers. You
    can use small Roman numerals to number the pages in the introduction of a report,
    for example. To tell WordPerfect which type of numbers to use (Roman or Arabic),
    follow these steps:


    +   1. Move the cursor to the top of the page on which you want the number to
    begin.

    2. Choose Format:-Page:-Page Numbering:-Numbering.

    You will see the Page Numbering dialog box, as shown in Figure 8-4.

    3. Click the Options button to display the Page Numbering Options dialog box.

    4. Find the Page label and click on the button to its right.

    A list of numbering options appears, including regular (Arabic) numbers, Roman
    numerals, and letters.

    5. Choose a number style.

    When you make your choice, it appears in the Page box.

    6. Click on OK to leave the Page Numbering Options dialog box, and click on OK
    again to leave the Page Numbering dialog box.


    # Stop! Don''t type that page number!


    Untowered word processing novices have been known to enter page numbers at the
    bottom of every page. A moment''s thought tells you why that''s a terrible, awful,
    wacky idea. If you insert a line at the bottom of each page and type the page
    number, what are you gonna do when an important update requires you to insert
    a additional lines on page 1? Suddenly, the page numbers that used to appear at
    the bottom of the pages slide down to print a few lines from the top of the following
    pages. What a mess!


    Maybe you think you got clever and read ahead to find out how type your own numbers
    in footers. Although this technique might require a new footer for each page.
    As soon as one of those footers moves onto another page, your page numbers will
    be wrong.

    The moral of the story is "Never type page numbers as text." Always use either
    page numbering or headers or footers (described later in this chapter) to do it
    for you.


    ![](img/a2afb402c275cfc5e5a8f62356a922ef_170_0.png)'
  merge: -1
  pgno: 170
- img_proc: true
  md: '# 142 Part II: Prettying Up Your Text


    You can even switch page-number styles partway through the document: Just move
    the cursor to the top of the page on which you want the style to change and follow
    the preceding steps.


    # Starting over again at 1


    If you want to change your page numbering partway through a document, you can.
    If your report titled “Ten Thousand Uses for Chocolate” begins with an Introduction,
    for example, you can restart the page numbering at 1 on the first page that follows
    the introduction. Follow these steps:


    +   - Move the cursor to the top of the page on which you want to restart page
    numbering at 1.

    - Choose Format:Page:Page Numbering:Numbering.

    WordPerfect displays your friend the Page Numbering dialog box.

    - Click on the Value button.

    The Value dialog box appears. This dialog box includes more than just the settings
    for page numbers; it also enables you to control the numbering of other items
    we do not describe in this book. Our advice is to ignore all except the Page Settings
    part of the dialog box.

    - In the New Page Number box (in the Page Settings part of the dialog box), type
    the number you want this page to be.

    In this case, you want the page to be page 1, no matter how many pages of Introduction
    you write.

    - Click on OK to leave the Numbering Value dialog box.


    # Adding Heads and Feets


    Throughout the first part of this chapter, we give you all the gory details of
    page numbering, and now we have to admit that we usually don''t use the Page Numbering
    dialog box to number our pages. We usually have lots of things we want to include
    at the top or bottom of each page, as the title of the document, today''s date,
    and those that say Draft or Confidential! Destroy Before Reading! The easiest
    way to print all stuff at the top or bottom of each page is to use headers and
    footers.


    The cool thing about headers and footers is that they can contain almost anything—
    one line of text, an entire paragraph, or even a picture. Also, because your document
    can contain two different headers (Header A and Header B)'
  merge: -1
  pgno: 171
- img_proc: true
  md: '# Chapter 8: Perfect Pages and Dashing Documents


    and two different footers (Footer A and Footer B, believe it or not), you can
    print different headers and footers on the facing pages of documents printed on
    both sides of the page.


    Some grammar maniacs insist that headers and footers are more properly named headings
    and footings. Ignore them.


    # Making a header or footer


    These steps show how to make a header or footer:


    +   1. Choose View:Page to switch to page view so that you can see the headers
    and footers you create.

    Headers and footers are invisible in Draft View. You''re probably already in Page
    view, but we want to make sure.


    +   2. Move to the beginning of your document by pressing Ctrl+Home.

    If you want headers and footers to begin partly through your document, move to
    the top of the first page on which you want the header or footer to appear.


    +   3. Choose InsertHeader/Footer.

    You see the Headers/Footers dialog box, as shown in Figure 8-5.


    ![](img/a2afb402c275cfc5e5a8f62356a922ef_172_0.png)


    +   4. Choose the header or footer you want to create.

    If you plan to use one header or footer for the entire document, choose Header
    A or Footer A. If you plan to use two headers or footers (for number facing pages,
    for example), choose either A or B. This book, for example, has different headers
    and footers for the even- and odd-numbered pages.


    +   5. Click on the Create button.

    This step tells WordPerfect to insert a new secret header or footer code in your
    document. WordPerfect adds a blank section, outlined by gray guidelines, as shown
    in Figure 8-6, at the top (for headers) or bottom'
  merge: -1
  pgno: 172
- img_proc: true
  md: '# 144 Part II: Prettying Up Your Text


    (for footers) of the page; you can begin typing your header or footer on this
    line. Notice that headers and footers get their own guidelines. You can drag all
    except the top margin of a header (you have to change the page''s top margin)
    or the bottom margin of a footer (you have to change the page''s bottom margin).


    ![](img/a2afb402c275cfc5e5a8f62356a922ef_173_0.png)


    Draft 8-6: Typing a header to appear on every page of a document.


    Draft - Confidential                               December 4, 2000

    Godzilla Meets the Baby Purple Dinosaur

    by David Kay

    The Tokyo laboratory of Dr. Hokai looked like Salvador Dali''s Idea of Times Square
    after another food fight. Gelatinous globs from every wall and draped shapeless
    shifted themselves over everything. The globs near a shredded metal canister off
    steam from a meat of what appeared to be Kong.


    ![](img/a2afb402c275cfc5e5a8f62356a922ef_173_1.png)


    TIP To skip printing the header or footer on the first page of the document (a
    common technique), move to the beginning of the document anyway. You can tell
    WordPerfect to suppress printing the header and footer on the first page; this
    procedure is described later in this chapter.


    You can have several Header A''s, Header B''s, Footer A''s, or Footer B''s in
    your document. If you think this arrangement will be confusing, use right; don''t
    use it.


    You can create Header or Footer B before you create Header or A; WordPerfect doesn''t
    care. On the other hand, you may get confused. We stick with A by using only one
    header or footer. If you use two at a time (both Header A and Header B), one prints
    over the other. Avoid this problem by defining one header or footer for odd pages
    and the other for even, as explained later in this chapter.


    When you create a header or footer, WordPerfect inserts a secret code named Header
    A (or whichever header or footer you choose). The code contains all the text that
    appears in the header or footer, including formatting. To see or delete this code,
    refer to Chapter 9.'
  merge: -1
  pgno: 173
- img_proc: true
  md: '# Typing the text in a header or footer


    After you create a header or footer, your job is to type the text you want to
    appear in it. To help you, Word adds a few items to the Property Bar. Check out
    the changes shown in Figure 8-7.


    ![](img/a2afb402c275cfc5e5a8f62356a922ef_174_0.png)


    The new line that Word adds to your document (see Step 5 in the preceding section)
    is no ordinary new line — it''s in a special zone that contains the text for your
    header or footer. You cannot use the cursor-control keys to move between the header
    or footer zone and the rest of the document. You can use the mouse to click where
    you want to edit; this action enables you to switch between editing the regular
    document and your header or footer.


    # The standard three-part header


    If you want some text at the left margin, some text centered, and some text at
    the right margin, you can tell Word to center and right-align parts of the header.
    You can print the document title at the left margin, for example, the page number
    in the center of the header, and today''s date at the right margin.


    margin, (Printed 12/25/2000, for example), choose Format::LineFlush Right and
    keep typing.


    You may find that the text that flushes to the left gets typed over by that text''s
    centered and that the centered gets typed over by the flush right. That situation
    happens because you told Word where to put that text, and by folly, it''s going
    to just do what you said. If not enough space is available to put each thing in
    its place, that''s not a Word problem. Your only choice is to make the left-hand
    text, or the center text, or the right-hand text a little shorter.


    To make a header as you like, one starting the stuff that goes at the left margin;
    The Complete History of Chocolate, for example. When you get to the part you want
    to have centered (Page 536, for example), choose the Format::Line::Center command
    and start typing at the center of the line. When you get to the part you want
    to flush against the right'
  merge: -1
  pgno: 174
- img_proc: true
  md: '# 146 Part II: Prettying Up Your Text


    While you''re editing a header or footer, WordPerfect would really rather that
    you stayed focused on what you''re doing. Some buttons on the toolbar and some
    menu commands get fuzzy and unusable, therefore, when you''re editing a header
    or footer. For example, you cannot use the New, Open, Save, and Print buttons
    on the toolbar or their equivalent menu commands while you''re editing a header
    or footer. C''est la vie.


    To enter some text in your header or footer zone, if it''s not already there.


    +   1. Move the cursor to the header or footer zone,


    You can tell when you''re editing a header or footer because the Property acquires
    the header/footer buttons shown in Figure 8-7. You can also tell by looking at
    the title bar of the WordPerfect window. The title bar displays only the name
    of the document you''re editing but also the name of the header or footer you''re
    working on (Zuke_soup.wpd - [Header A]), for example).


    +   2. Type the text..


    You can control the font, font size, and text style in the usual ways (refer to
    Chapter 6). If you want the header or footer to be more than one line, be just
    keep typing. Go ahead and press Enter at the end of the line if you want to include
    more than one paragraph.


    What about page numbers, you ask? Aha! It''s time to use those cute buttons on
    the Property Bar that magically appeared when you entered Header/Footer Land.


    +   3. To include the current page number in the header or footer, move the cursor
    to the place where you want the page number to appear and click the Insert Number
    button on the Property Bar.


    This button has a little #1 on it. When you click on it, a little menu appears.


    +   4. Choose Page Number (as you probably have guessed).


    +   5. Click anywhere in the document except in the header or footer to get back
    to the real world.


    When you type the text of your document, you don''t have to leave room for the
    headers or footers. WordPerfect sticks them in at the top and bottom margins of
    the page and shoves the other text out of the way.


    If you want to print the current date in the header or footer, see the section
    in Chapter 22 about inserting the date or just press Ctrl+Shift+D.


    If you want your header or footer to contain lines, boxes, or even pictures, see
    Chapter 15.


    ![](img/a2afb402c275cfc5e5a8f62356a922ef_175_0.png)'
  merge: -1
  pgno: 175
- img_proc: true
  md: '# Chapter 8: Perfect Pages and Dashing Documents


    You can format text in your headers and footers by using the same commands you
    can use for text in the rest of your document. Commands cannot appear gray out
    in the WordPerfect menus, which is the subtle WordPerfect way of telling you that
    you cannot choose these commands.


    If you cannot see your headers or footers, you''re probably using Draft view,
    in which they''re invisible. Choose View-Page to switch to page view.


    # Controlling where headers and footers are printed


    After you create a header or footer and type its text, you can tell WordPerfect
    pages to print it on. While editing a header or footer, click on the Header/Footer
    Placement button on the Property Bar, the button with a stack of three pages on
    it. WordPerfect displays the Placement dialog box, as shown in Figure 8-8. Choose
    Odd Pages, Even Pages, or Every Page, and then click on OK.


    ![](img/a2afb402c275cfc5e5a8f62356a922ef_176_0.png)


    > "Don''t print it here!"


    You can tell WordPerfect not to print the header or footer you just went to so
    much trouble to create. Why would you want to? We can think of these two good
    reasons:


    +   - You don''t want the header to print on the first page of your document.
    When you write a letter, for example, you may want all the pages except the first
    one to have a header that says Joe Jones, Sept. 8, 2000. Page 2 (with the correct
    page number, naturally). Therefore, you want to suppress the header or footer
    for one page.

    - Your document may have two or more sections, and you may want to use a header
    or footer for only the first section. You can discontinue the header or footer
    for the rest of the pages in the document.'
  merge: -1
  pgno: 176
- img_proc: true
  md: '# 148 Part II: Prett Up Your Text


    To suppress the printing of a header or footer, you tell WordPerfect to skip printing
    it on a particular page. To suppress a header or footer for one page, follow these
    steps:


    +   Move the cursor to the page on which you don''t want to print the header or
    footer.

    Make sure that the cursor isn''t in the header/footer area.


    +   Choose Format:Page:Suppress.

    WordPerfect displays the suppress dialog box, as shown in Figure 8-9.


    ![](img/a2afb402c275cfc5e5a8f62356a922ef_177_0.png)


    +   Choose the headers or footers you don''t want to print.

    You can select as many items as you want. If you don''t want any headers or footers
    or watermarks or anything on this page, select the All check box.

    Click on OK.


    The headers or footers disappear from the page, only to reappear on the next page.


    When you suppress the printing of a header or footer on a page, WordPerfect creates
    a secret code named Suppress at the top of the page.


    # Discontinuing headers and footers


    To discontinue printing a header or footer, you tell WordPerfect to stop printing
    this header or footer for good. Follow these steps:


    +   Move to the first page on which you don''t want the header or footer to print.


    +   Choose Insert:Header/Footer to display the Headers/Footers dialog box.'
  merge: -1
  pgno: 177
- img_proc: true
  md: '+   3. Choose the header or footer you want to discontinue.

    nYou can select only one. If you want to discontinue all of them, you have to
    repeat these steps for each one. (Sigh.)

    4. Click on the Discontinue button.

    The dialog box disappears in a puff of bytes, and so does your header or footer
    from this page and all subsequent pages in the document.


    When you discontinue a header or footer, WordPerfect inserts a secret code named
    End Header A (or whichever header or footer you chose). To see or delete this
    code, see Chapter 9.


    After you discontinue a header or footer, you cannot turn it back on. To cancel
    discontinuing it (that is, to undo the preceding steps), you must delete the secret
    end code. If you just want to skip printing the header or footer on each page
    rather than discontinue it.


    # Getting rid of a header or footer


    If you change your mind about a header or footer and you want to get rid of it
    for good, you can delete the contents. (You know that you''ve succeeded when the
    special guidelines go away.) You can also delete the secret code that defines
    the header or footer. Chapter 9 tells you how to find and terminate codes you
    no longer want.'
  merge: -1
