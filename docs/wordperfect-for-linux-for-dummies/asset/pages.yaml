  md: '# About the Authors


    Unlike most of her peers in Margaret Levine Young was exposed to computers at
    an early age. In high school, she got into a computer club known as the R.E.S.I.S.T.O.R.S.
    “We were a group of kids who spent all day Saturday together in a barn fooling
    around three computers that ran on vacuum tubes.” Their goal, she admits, was
    to language processing “so that the computers could make smart-ale remarks back
    to us,”


    Margy got into computers “for fun” and because “my brother did,” she stayed in
    the field through college, graduating from Yale with a degree in computer science.
    She was one of the first computer managers in the early 1980s at Columbia Pictures
    Industries.


    Since then, Margy has written more than 20 other computer books with various friends,
    including Dave Kay; her brother, John Levine; and her husband, Jordan Young. The
    books include The Internet For Dummies, 6th Edition, MORE For Dummies, 4th Edition,
    UNIX For Dummies, 4th Edition, and Dummies 101: Netscape Communicator 4, all published
    by IDG Books Worldwide, Inc., as well as Internet: The Complete Reference and
    Windows 98: The Complete Reference, as Osborne/McGraw Hill.


    Margy also met Jordan in the R.E.S.I.S.T.O.R.S., and her other passion is her
    children, Meg and Zac. She loves gardening, “anything to do with eating,” Brazil,
    and the Vermont, where she lives.


    Dave Kay is a writer, engineer, wildlife tracker, and aspiring artist, combining
    professions with the same effectiveness as his favorite business establishment,
    Acton Muffler, Brake, and Ice Cream (now defunct). Dave’s computer book efforts
    include Naturally Speaking, Microsoft Works, WordPerfect, Web publishing, and
    VRML (IDG Books Worldwide, Inc.) and Internet: The Complete Reference, and Graphics
    File Formats (McGraw-Hill). In his other life, Dave is the Poo-poah of Brightleaf
    Communications, where he writes and teaches. He spends his spare time in the woods,
    playing with molten glass, designing stage scenery, and singing Gilbert and Sullivan
    choruses in public. He lives in the boondocks of Massachusetts with his wife,
    Katy, and his golden retriever, Alex.'
