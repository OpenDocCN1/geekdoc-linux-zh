  md: '# Chapter 12: Juggling Documents on Your Screen 209


    ![](img/a2afb402c275cfc5e5a8f62356a922ef_238_0.png)


    Figure 12-3: Shuffle your documents and lay them to end.


    > "I want that one!"


    When you can see multiple document windows, one of them is active. The active
    window is the one with the highlighted title bar. That document is usually on
    top of the other windows (no other windows obscure your view of it). The active
    window is the one you''re editing, and your cursor is in it. The formatting commands
    you give affect the active window. Text you type lands in the active window.


    You can switch from one window to another by clicking in the window for the document
    you want to use, or you can use the Window menu commands described earlier in
    this chapter.


    # Sizing your windows


    Either cascading or tiling your documents is extremely unlikely to produce document
    windows large enough for you to get any work done. You probably will have to move
    them around a little, perhaps making the window for the main document you''re
    working on large and the other document windows small. No problem.'
