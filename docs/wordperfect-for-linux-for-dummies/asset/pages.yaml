  md: '# Chapter 1: WordPerfect Basics


    WordPerfect begins to run. After a few seconds, you see the WordPerfect splash
    (opening) screen, followed quickly by the two main WordPerfect windows, which
    are described later in this chapter. Suffice to say that the screen is a little
    more complicated than a blank piece of paper.


    If WordPerfect doesn''t appear on your desktop, panel, or menus, see this book''s
    appendix to find out how to make icons and menu entries for WordPerfect by using
    KDE.


    This list shows some things that may go wrong:


    +   - If (heaven forbid!)WordPerfect crashed the last time you were running it,
    you may see a message that a timed backup document exists. If this message appears,
    see Chapter 20.

    - If you have trouble getting WordPerfect to run or if you''re wrestling with
    Linux, you may want to check out LINUX For Dummies, 2nd Edition, by Jon "Maddog"
    (IDG Books Worldwide, Inc.) — a great book that clarifies a bunch of general stuff.


    If WordPerfect just refuses to run and if it reports a segmentation fault error
    you try to run it from the command line, the chances are that some Linux libraries
    need updating. It''s most definitely a job for a system administrator. Go get
    him and plead your case.


    # The Two Windows of WordPerfect


    After WordPerfect is running, you see two WordPerfect windows. A little window
    has the WordPerfect logo and a menu, as shown in Figure 1-5. This window is the
    program window. The logo doesn''t do anything other than sit there and look pretty;
    this window''s reason for being there is its menu. A bigger window is the document
    window, as shown in Figure 1-6; you do all your typing there. The wide expanse
    of white green corresponds to the white paper that sticks out of your old-fashioned
    typewriter and is no more inspirational.


    ![](img/a2afb402c275cfc5e5a8f62356a922ef_44_0.png)'
