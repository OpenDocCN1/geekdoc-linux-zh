    # Shift, Ctrl, and Alt


    The shift keys — Shift, Ctrl, and Alt work only in conjunction with other

    keys. All is well if you use them exactly like the Shift key on your beloved

    Periwinkle-Marmosetwriter typewriter, as shown in these steps:


    +   1. Press a shift key (Shift, Alt, or Ctrl, as directed) *first*, and *hold
    it* down.


    Don’t crush it — just press it.

    2. Press the other key (F7, for example).

    3. Release both keys.

    nIf your fingers don’t work well together, release the shift key last.


