  md: '# 26 Part I: Introducing WordPerfect for Linux


    ![](img/a2afb402c275cfc5e5a8f62356a922ef_55_0.png)


    Figure 1-8: Opening a file you made earlier.


    Now you can make changes in the document, save it again, print it, or whatever!


    If the document is long, it doesn''t fit all onscreen. Don''t panic — it''s still
    there. See Chapter 3 for information about how to move around in a document, including
    the parts that aren''t visible.


    You may want to open a file in a different directory from the one displayed in
