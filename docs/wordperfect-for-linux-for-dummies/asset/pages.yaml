  md: '# Chapter 13: Juggling Files on Your Disk


    You can also edit shortcuts by selecting the shortcut in the Edit QuickList dialog
    box and clicking on the Edit key. If you never use a shortcut, get rid of it by
    selecting it in the Edit QuickList dialog box and clicking on Delete. WordPerfect
    doesn''t delete the directory — only the shortcut to the directory.


    # Kinds of Files


    WordPerfect can, and does, use many different files. Some are its own, WordPerfect
    kind of files. Others are of the import-export variety, such as spreadsheets,
    databases, graphics, and documents from other processing programs. You have to
    be slightly aware of their differences to prevent confusion, for example, a graphics
    file and a document file have the same name and are stored in the same directory.


    You can usually tell a WordPerfect document file when you see it listed (as in
    a dialog box). It usually has the three-letter wpd extension appended to its name
    and separated by a period (.wpd, for example), unless you deliberately give the
    document a different extension when you created it (not a good idea). Documents
    from other word processing programs use extensions.


    Graphics files also generally have distinctive two- or three-letter extensions,
    although hundreds of variants exist. Some common ones are tif, eps, and jpg. These
    extensions are used with the Insert:GraphicsFromFile command.


    Most of the time, WordPerfect knows from the type of command you''re giving just
    kind of file you want and displays only the right sort of file. Considering all
    the settings you can fool, however, it''s only a matter of time before you do
    something that makes WordPerfect throw up its hands and leave you to sort things
    out the extensions.


    # Finding a File with a Forgotten Name


    Boy, is WordPerfect ever glad that you want to find your files. It has invested
    heavily in creating the Star Wars of file finding, the Saint Bernard of lost and
    stranded files, the verasible Rescue 911 of technology-assisted document search-and-rescue.
    It''s named QuickFinder, and it''s lurking unseen in the File Manager, Save As,
    and Open File dialog boxes. QuickFinder is so muscle-bound that we don''t even
    try to describe everything it can do; we focus in on how it helps you find a file.


    QuickFinder finds files by looking for certain text. If you want to find a letter
    to Ms. Tannwald, for example, but cannot remember the name of the file, you just
    type Tannwald in the right place in the QuickFinder.'
