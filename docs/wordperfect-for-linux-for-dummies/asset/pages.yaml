  md: '# Chapter 18: Spinning Web Pages


    +   **Font:** The font selector box is ho-hum news when you''re editing regular
    Word documents, although the ability to select your own font on a Web page is
    rather new. Specifying a font on a Web page generally isn''t a good idea because
    you have no guarantee that a person''s computer displaying your Web page halfway
    around the world has ever heard of the font you picked. If you pick the person''s
    computer guesses and tries to pick something that it thinks is reasonable, although
    it may may guess wrong. Stay away from this when you''re making Web pages.


    +   **Font Size:** Most of the same considerations apply for font sizes as for
    fonts: Let the viewer''s Web browser pick them for you. To tell the browser that
    you want, click the button we describe next, Heading/Style, and Font Attributes,
    later in this.


    +   **Heading/Style:** Click this button to display a list of the headings and
    styles Web pages understand. These styles apply to the whole paragraph for which
    they''re selected. (If styles aren''t familiar to you, check out Chapter 10).
    Styles enable the Web to get around the fact that different computers and Web
    browsers differ. Web browsers know how to do only what HTML tells them to, and
    have no way of saying "Format the following text in small caps." The text styles
    HTML knows are listed when you click on this button. Most of the document shown
    in Figure 18-4 uses the Heading1 style, and the featured tape and philosophy headings
    uses Heading2. The contact information at the bottom of the page uses the Address
    style.


    +   **Bold:** At least some things work the same way as they did. This button
    makes text bold on your Web document and on the viewer''s Web browser.


    +   **Italic:** Thankfully, this one works the same as the Bold button: It just
    works.


    +   **Monospaced Font:** Unless you''re into typesetting, fixed-size text looks
    ugly. If your Web page is about technical stuff, however, you might want to use
    a fixed-size font. Most computer books say, somewhere near the beginning, "Text
    you should type to the program appears like this: sample command."


    +   **Font Attributes:** At the beginning of this list, we suggest that you not
    use absolute text sizes to format your text. This button lists all the different
    font attributes HTML knows about and gives you a convenient place to try them
    out. Bold and italics here are the same as the Bold and Italics on the Property
    Bar


    The rest of the Property Bar works pretty much the way they do in the rest of
    WordPerfect, or they do so technically that you shouldn''t bother with them. A
    couple of new buttons are on the toolbar, however:'
