  md: '# Part IV: Creating Documents That Don''t Just Sit There


    # Printing addresses on mailing labels


    To print addresses on mailing labels, follow these steps:


    +   1. Begin with a new, blank document.

    Your first step is to tell WordPerfect which kind of labels you''re using. In
    technical jargon, you''re providing a label definition.


    +   2. Choose Format-Labels to display the Labels dialog box, as shown in Figure
    17-4.


    ![](img/a2afb402c275cfc5e5a8f62356a922ef_333_0.png)


    WordPerfect already knows about an amazing variety of labels, including most of
    the Avery Avery manufactures. Most label definitions listed in the Available Labels
    section of the dialog box are identified only by their Avery part number. This
    number is useful because most label manufacturers now include the equivalent Avery
    number on their packages.


    +   3. Select the type of labels you have.

    In case you are not sure which kind you have, WordPerfect displays a little diagram
    of the labels you selected. Avery 5159 Address labels, for example, come in sheets
    of 2 labels across and 7 rows per page. The Label Details section of the dialog
    box describes the size and shape of the sheets and individual labels you selected.


    +   4. Click OK.

    The dialog box closes, and your document now looks truly weird. The area of a
    label stays white white (or whatever background color you use for WordPerfect
    documents; refer to Chapter 19), and the rest of the page is draped in shadow,
    as shown in Figure 17-5.'
