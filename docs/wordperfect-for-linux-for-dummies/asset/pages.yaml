  md: '# 14 Part I: Introducing WordPerfect for Linux


    You get WordPerfect back by double-clicking on the WordPerfect icon on your desktop
    or by clicking on the WordPerfect button on the taskbar. WordPerfect not only
    jumps into existence on the screen but also (if you were working on a document)
    is just the way you left it.


    Okay, on to WordPerfect!


    # Starting WordPerfect


    To begin using WordPerfect, you have to see it onscreen. Follow these steps:


    +   1. **Get psyched.**

    Repeat to yourself three times, “I love using the computer! I love Linux! This
    is going to be great!” — whether you believe it or not.


    +   2. **Look for WordPerfect.**

    If you''re lucky, someone has installed a WordPerfect icon on your KDE or GNOME
    panel (rectangle full of icons at the bottom of the screen) or on your desktop.
    If so, click the icon. If no WordPerfect icon is in any of those places, try looking
    for it on a pop-up menu; in KDE and GNOME, by clicking on the K or G footprint
    icon, respectively, in the lower-left corner of the screen, which work strangely
    similarly to the Start button on the Windows taskbar. Other window managers present
    you with pop-up menus if you left-click, right-click, or middle-click on the desktop
    background.

    Still no WordPerfect there? In case, you have to start it from the (g!) command
    line. It''s not that bad, really: Open an xterm or terminal window, the program
    that displays a plain, boring text-based window containing a command line, you
    can make your state-of-the-art graphics display act just like a 25-year-old dummy
    terminal.


    +   3. **Start WordPerfect.**

    How do this step depends on where you found the program. If you found a WordPerfect
    icon on a KDE or GNOME panel or if you found a menu listing for WordPerfect, single-click
    on it. If you found a WordPerfect icon on the desktop background, you probably
    need to double-click it.

    If you had to open a terminal window, type **xwp** at the command prompt and press
    Enter. You might first need to move to the directory where you installed WordPerfect;
    see the appendix in the back of this book for more information.'
