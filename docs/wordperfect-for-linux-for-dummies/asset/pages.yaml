- img_proc: true
  md: '# If You Have Problems (Of the CD Kind)


    For more information about WordPerfect 8 For Linux, see the Corel Web site about
    the program, at


    ```

    http://linux.corel.com/linuxproducts_wp8.htm

    ```


    A mailing list named wordperfect8 exists for WordPerfect for Linux users to discuss
    their experiences and answer each other''s questions. To subscribe to the mailing
    list, start at the Corel Web page we just mentioned, click on the Support link,
    and click on the List Server link. You see instructions for subscribing to the
    list.


    You can also discuss WordPerfect for Linux in the Usenet newsgroup corelsupport.wordperfect-linux,
    hosted at the new Corel server, cnews.corel.com. You can use any Linux newsreader
    program (tr, tin, nn, or Netscape for example) to read newsgroup messages.


    If you still have trouble installing the items from the CD, please call the IDG
    Books Worldwide Customer Service phone number: 800-762-2974 (outside the United
    States: 317-596-5430).'
