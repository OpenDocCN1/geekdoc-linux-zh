    # Understanding the Reveal Codes window


    The Reveal Codes window shows the same text as you in the regular window. Because
    the Reveal Codes window usually cannot hold much text as the regular window, the
    Reveal Codes window shows the part that''s right around the cursor position. The
    cursor appears as a red box; its location in the Reveal Codes window corresponds
    to its position in the regular window. If you click on a spot in the Reveal Codes
    window, the red cursor-box moves and the regular cursor moves to the corresponding
    point in the regular window. If you click on a spot in the regular window, the
    cursor moves there and the red cursor-box moves to the corresponding place in
    the Reveal Codes window.


    Scrolling up or down in the Reveal Codes window can be tricky. When you press
    the navigation keys on your keyboard, such as PgUp and PgDn, the cursor moves
    in the regular window and the red cursor-box moves in the Reveal Codes window.


    Text in Reveal Codes is completely unformatted. Spaces appear as little diamonds,
    and codes look like little buttons. Character and single codes look like little
    rectangular buttons, and paired codes (such as the two Italic codes) have pointed
    ends, with the points of each pair pointing each other.


    You can type, edit, and perform all your normal WordPerfect activities while the
    Reveal Codes window is visible; some people like to leave it open all the time.
    (Of course, some people consider going to the dentist to be a recreational activity.)


    ![](img/a2afb402c275cfc5e5a8f62356a922ef_182_1.png)'
