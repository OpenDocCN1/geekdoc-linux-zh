  md: '# 210 Part III: Things You Can Do with Documents


    Each document window has a border, and you can move these borders around at will,
    as explained in the following list:


    +   - If you point to the left or right border of a window, the mouse pointer
    turns into a little left or right arrow. You can click and drag the window border
    to the left or right to resize it horizontally.

    - When you point to the top or bottom border of a window, the mouse pointer turns
    into an up or down arrow, and you can drag the window border up or down to resize
    it vertically.

    - When you point to a corner of a border, the mouse pointer turns into a diagonal
    arrow, and you can drag the corner in any direction. WordPerfect adjusts the borders
    accordingly.


    You can also move the windows around by clicking and dragging their title bars.
    The process is similar to moving papers around on your desk, except that never
    get coffee stains on them. You can waste most of your work-day, in fact, by moving
    your windows around until you get lined up just the way you want them.


    # Maximizing your documents


    All these windows, borders, and scroll bars on your screen can become distracting.
    When you want to get back to work and look at just one document, you can maximize
    it so that it takes up your entire Linux desktop.


    +   - To maximize a document with KDE, at the right end of its title bar. Click
    on the middle of the three buttons (it looks like a little square). Pool! All
    other windows on your screen are covered by this document. (All X Window managers
    have either a Minimize button like KDE, or a Maximize pull-down menu item. Not
    surprisingly in the wildly nonstandard land of UNIX, each window manager puts
    this function in a different place.)


    # Minimizing your documents


    +   - If you click on the button with the dot on it on the KDE title bar of a
    document window, the window is minimized. It gets really small and appears as
    a somewhere on the KDE taskbar (or as an icon on your desktop). No we know ever
    minimizes a document on purpose, although it happens whenever you want to maximize
    your document window and you click on the wrong button. Click on the bar or icon
    to open the document window again.


    You can minimize all of your document windows at once by choosing Window > Minimize
    All.'
