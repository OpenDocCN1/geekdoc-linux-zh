  md: '# Chapter 15: Say It with Pictures 263


    Double-clicking your picture opens the WP Draw program, described in the section
    “Creating Your Own Graphics with WP Draw,” later in this chapter.


    # Inserting some Corel clipart into your document


    This section tells you the simplest way to insert a graphic into your document.
    We assume (the Assumption Fairy at work again) that you want to insert in your
    document one of the 200 or so clipart images (predrawn pictures) that Corel includes
    with WordPerfect. (If you downloaded WordPerfect from the Corel site, no clipart
    is included, and the /wpgraphics directory is empty.) Before you get excited about
    them, a word of caution: Although we don''t claim we''ve looked at every one of
    them, we''ve found they''re mostly cartoonish pictures that are more appropriate
    for adding emphasis than inclusion in a serious business document. Look around
    — don''t get your hopes up. WordPerfect installs its clipart files in the wpgraphics
    subdirectory of its program directory. If WordPerfect is installed in the /usr/local
    directory, for example, the graphics files are in /usr/local/wpgraphics.


    To use one of these clipart images, proceed as follows:


    +   1. Move the cursor somewhere near where you want the picture to appear in
    your document.


    +   2. Choose Insert>Graphics: From File from the menu bar.


    Or, click on the Clipart button on the toolbar (the one with the file folder the
    Corel hot-air balloon).


    Either, the list of available clipart appears in the Insert Image dialog box,
    as shown in Figure 15-2. (WordPerfect should already know where its clipart files
    are stored.)


    +   3. Click on a filename that sounds appealing and click the View button.


    The picture is displayed in its own little Vewer window. You can keep clicking
    on filenames to see the files in the Vewer.


    +   4. When you find the image you want, click the Close button in the Viewer
    window.


    The image''s filename should be selected in the Insert Image dialog box.


    +   5. Click on the Insert button to put the image in your document.


    WordPerfect places the picture in your document. If you''re feeling artistic,
    you can double-click on the picture and edit it in WP Draw. (We talk more about
    WP Draw in the section “Creating Your Own Graphics with WP Draw,” later in this
    chapter.)


    ![](img/a2afb402c275cfc5e5a8f62356a922ef_292_0.png)'
