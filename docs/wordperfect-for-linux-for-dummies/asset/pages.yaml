- img_proc: true
  md: '# Chapter 15: Say It with Pictures 269


    ![](img/a2afb402c275cfc5e5a8f62356a922ef_298_0.png)


    Figure 15-4: WordPerfect comes with WP Draw, a graphics program.


    # Editing a graphic


    You can also edit graphics box that''s already in your document. When double-click
    the picture in the box, WordPerfect runs the WP Draw program so that you can edit
    the picture. Or, right-click on the picture and choose Edit Image from the QuickMenu
    that appears.


    # Whipping your drawings into shape, or whipping shapes into your drawings


    WP Draw has far too many built-in shapes for us to describe each one in detail.
    We list the shapes and offer some notes on how to draw each one. At the end of
    this section, we talk about things that are common to all the shapes. After you
    have run WP Draw to edit your drawing, you can insert any in your drawing by choosing
    Draw from the WP Draw menu bar and selecting the shape you want.


    Some shapes also have selections on the WP Draw toolbar. The selected button appears
    in a darker gray (it must be depressed) on the toolbar, and hints about how to
    use the selected button at the bottom of the WP Draw window. In Figure 15-4, the
    Select (arrow) button is selected. To figure out what buttons, move the mouse
    pointer to the button without clicking: A short description of the button buttons
    appears on the WP Draw window''s title bar.'
