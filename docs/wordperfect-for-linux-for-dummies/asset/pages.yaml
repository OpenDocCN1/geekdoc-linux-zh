  md: '# Part IV: Creating Documents That Don''t Sit There


    ![](img/a2afb402c275cfc5e5a8f62356a922ef_293_0.png)


    Figure 15-2: The Insert dialog box lets you preview before you insert them in
    your document.


    The cursor should now be merrily blinking at the point where you left it, and
    your graphic should appear in your document. Overall, this technique isn''t difficult.
    The document shown back in Figure 15-1 has one of the WP-supplied graphics in
    it.


    # Fooling with your picture


    Because your picture is in a box, you can do the same things to a graphics box
    as you can to a text box:


    +   - Move it by clicking on it (so that the black handles appear), keeping the
    mouse pointer inside the box (so that the pointer looks like a four-headed arrow)
    and dragging the picture around.


    +   - Change its size by selecting it and then clicking on the corner handles
    and dragging them around. When you "pull" the box changes size and shape. The
    contents stretch like Silly Putty to the new shape of the box. Figure 15-3 shows
    the black handles and what can happen if you drag them to make a picture wider.
    (If you accidentally drag the handles, click on some text in your document. Then
    you can choose Edit>Undo to return the picture to its preceding shape.) You can
    also size the image to the exact dimensions by right-clicking on the image and
    choosing the Size command from the QuickMenu that pops up.'
