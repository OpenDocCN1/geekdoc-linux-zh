  md: 'When the spell checker highlights a word you consider to be okay, click on
    the Add button in the Spell Checker tool. This step adds the word to the dictionary;
    as far as the spell checker is concerned, the word is a real word now. The spell
    checker never brings it up again and sincerely regrets having brought it up in
    the first place.


    # Spell-checking tips


    To check less than an entire document, choose Check from the menu bar in the Spell
    Checker dialog box; then choose Word, Sentence, Paragraph, Page, To End of Document,
    or Selected Text. You can also check a specified number of pages from the current
    insertion point by choosing Number of Pages. Whatever option you check remains
    selected until you put the spell checker away.


    The spell checker not only checks spelling but also points out common problems,
    such as duplicated words, words that contain numbers, and strange capitalization.
    You can turn off these features if they get in your way. Just Options from the
    menu bar in the Spell Checker dialog box to see a list of what''s turned on or
    off. Click on a feature to change its on-or-off status.


    # Dealing with Grammy Grammatik


    If you start the spell checker from the Tools menu, you probably notice two other
    options: Grammatik and Thesaurus. This section talks about Grammatik a bit, and
    the next section discusses the Thesaurus.


    As mention in the “Stop looking over my shoulder” sidebar, earlier in this chapter,
    we''re not too thrilled by the Grammatik grammar checker (or any other grammar
    checker, for that matter). We frequently write, though, and we have opinions about
    what we write. Still, you may want to explore Grammatik.


    The checking itself works the same as spell checking: It starts at the beginning
    of a document and gives you the option to skip suggestions you don''t want to
    see in the future. To choose, Tools→Grammatik to display the Grammatik dialog
    box. Grammatik shows you the word it doesn''t like and an explanation of what''s
    wrong with it and then gives suggestions for improving your text.


    If you really want to poke around and figure out what Grammatik thinks that it''s
    doing, you can choose Options→Writing Style from the Grammatik menu bar. You see
    the Writing Style dialog box with a list of all the collections of rules Grammatik
    uses to analyze your writing. Edit one of those rules and you see the guts of
    Grammatik revealed.'
  merge: -1
