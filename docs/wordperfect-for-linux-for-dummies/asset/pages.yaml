    **Keyboard skills to use for a lifetime**

    The keyboard commands used for cutting, copying, and pasting in WordPerfect (Ctrl+X,
    Ctrl+C, and Ctrl+V, respectively) are used in some other programs (especially
    programs that were originally designed to work with Windows rather than Linux).
    For this reason, memorizing and using these commands rather than the WordPerfect
    menu commands is slightly to your advantage. True, the keyboard names are not
    particularly mnemonic. We keep track of them by remembering that the X, C, and
