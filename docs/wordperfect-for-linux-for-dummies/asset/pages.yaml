  md: '# Chapter 10: Documents with Style


    # "The Enter key is broken"


    The Enter key behaves *very strangely* if you''re using a character style while
    you type. Suppose you create a character style (like Foreign), and choose it from
    the Select list in the Property Bar. With a style on, like you type, the text
    you type is nicely formatted to the style. Everything behaves normally until you
    get to the end of a paragraph. Then you press the Enter key and expect a new paragraph
    to begin. Instead, *nothing happens*! Your problem is that you''re typing and
    applying a character style at the same time. Why that''s a problem is beyond —
    in Word, though it''s definitely a problem.


    Enter inserts a code to turn the character style off and then again. It *does
    not* start a new paragraph. Instead, pressing Enter inserts a closing character
    style code and an opening character style code. We have admit that it''s one of
    the most mysterious behaviors in Word; you have been warned.


    To solve this problem, press the right-arrow cursor to move your typing past the
    closing character style code. This code is invisible unless you open the Reveal
    Codes window (which you don''t have to use this trick). If you open the Reveal
    Codes window, how-ever, what''s going should become clear.


    If you select a character style (either from the Select list on the Property Bar
    or from the Style List dialog box) and continue to typing along, the behavior
    of the Enter key changes. Rather than start a new paragraph, pressing


    We don''t use character styles often (paragraph styles are far more useful); when
    we do, how-ever, we apply them *after* we type your text.


    # Creating a paragraph style by using QuickStyle


    Certain types of formatting do not belong in a character style. Paragraph-type
    things, such as indentation, belong in a paragraph style. These things include
    stuff you normally do with the Format include both paragraph-type things and character-type
    formatting, such as boldface and font styles.


    ![](img/a2afb402c275cfc5e5a8f62356a922ef_204_0.png)


    To define a style for a heading, a caption, or something else that makes an entire
    paragraph of its own, use a paragraph style.


    Paragraph styles are a little picky about what formatting they pick up. Remember
    that Word gives you at least two ways to do anything, including indent a paragraph.
    Paragraph styles pick up formatting applied only from the FormatParagraphFormatParagraph
    Drop Cap, and FormatParagraphParagraphBorder/Fill cells. A handy line of the FormatParagraph
    menu reminds you that anything below the line doesn''t get picked up by paragraph
    styles. Besides, you can do all that below the line using the FormatParagraphFormat
    anytime.'
