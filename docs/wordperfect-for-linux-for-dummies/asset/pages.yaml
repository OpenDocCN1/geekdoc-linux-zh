  md: '# 200 Part III: Things You Can Do with Documents


    You can tell WordPerfect whether your printer knows how to print multiple copies
    itself. Some printers are smart enough that you can send them a document once,
    along with instructions to print it a certain number of times. Because most printers
    are not this smart, though, WordPerfect has to send the same document to the printer
    over and over. If your printer is among the high-IQ printers of the world, set
    the Generated By setting to Printer rather than to WordPerfect.


    +   4. Click on OK.


    # Printing a Document on Disk


    What if you want to print a document that isn''t open? What if you wrote, saved,
    and printed a magnificent letter this morning, for example, and now you want to
    print an extra copy to show to your mother? You can open it first, admire it onscreen
    for a while, and then print it. There''s a faster way, though, as in these steps:


    +   1. Set your printer so that it''s rarin'' to print.

    It doesn''t matter where your cursor is or even which document is open.


    +   2. Click on the Print button on the toolbar.

    If you prefer, press F5 or choose File:Print. Either way, WordPerfect displays
    the Print dialog box.


    +   3. In the Print Selection section of the Print dialog box, click on Document
    on Disk and then click on OK.


    Poof! On the Disk dialog box appears, in which you can type the name of the document
    you want to print. What? — you don''t want to type the name of the document? No
    problem, click the file-folder icon all the way to the right end of the Filename
    box.


    If the document isn''t in the current directory, you must enter the document''s
    full pathname. If you don''t know what the heck we are talking about or if you
    want to know how to use that cute little file-folder icon next to the Document
    on Disk, see Chapter 13.


    +   4. Click on OK in all the dialog boxes.

    WordPerfect prints the document without displaying it onscreen.


    You can print only selected pages from the document on disk by entering page numbers
    in the Page(s) box.


    If the file doesn''t exist or you type it wrong (anyone to anyone), WordPerfect
    displays the message that the file was not found. Click on the OK button to get
    rid of the message and try again. For help in finding files, see Chapter 13.'
