  md: '# Part IV: Creating Documents That Don''t Just Sit There


    # Lines that go any which way


    WordPerfect has a more useful type of line, which it calls a draw line. Draw lines
    let you decide where a line should start and end almost anywhere on a page.


    Add draw lines to your document by choosing the Insert>Shape->Draw Line command.
    The cursor turns into a set of crosshairs. Click and hold down the mouse button
    on the place where you want one end of the line to be and drag the line to where
    you want the other end to be. Because the line is in a box, all the things we
    mention about text boxes earlier in this chapter apply. The reason you can see
    the text behind your line is that the Wrapping Text option for this box is set
    to in Front of Text.


    When a draw line is selected, the Property Bar mutates to include some new buttons.
    A couple are worth pointing out; the rest, we encourage you to explore. Figure
    14-11 shows the graphics Property Bar.


    | Graphics menu | Line Style |

    | --- | --- |

    | Previous Box | Line Width |

    | Next Box | Line Color | Text Wrap |


    Figure 14-11 Graphics Property Bar and the secret of arrows.


    ![](img/a2afb402c275cfc5e5a8f62356a922ef_289_0.png)


    To transform your plain old line into, click on one of the Arrowhead buttons (the
    fourth and fifth buttons from the right) on the Property Bar. Choose from among
    the pointery or feather ends of the arrow. Or, use two points every. Sometimes,
    it takes a little doing to figure out which arrow, although you can choose as
    often as you want.


    We said it elsewhere in this chapter, and we''ll say it again: Your draw line
    is actually in a box. All the box tricks we introduce earlier in this chapter
    apply to this box, too.


