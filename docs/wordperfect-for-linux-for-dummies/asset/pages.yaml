- img_proc: true
  md: '# Chapter 11: On Paper at Last: Printing Stuff 195


    # When your printer prints backward


    Some printers print in such a way that you''re always reordering multiple-page
    documents. What you really need to be able to do is print the last page first.
    Then, when the printer finished printing, everything would be in the right order.
    Unfortunately, you can tell WordPerfect to just that. Before you click on the
    Print button, click on the Output Options button near the bottom of the Print
    dialog box. You see the Output Options dialog box. Click on the Print in Reverse
    Order (Back to Front) box. You''re ready to print!


    # Printing a specific page


    Follow these steps to print one page:


    +   1. Make sure that your printer is ready to print.

    2. Place your cursor anywhere on the page you want to print.

    3. Click on the Print button on the toolbar.

    Alternatively, press F5 or choose File->Print to display the Print dialog box.

    4. Choose Current Page in the Print Selection section and click on OK.


    # Printing a bunch of pages, but not all of them


    To print a few pages, do the following:


    +   1. Make sure that your printer is all set to print.

    2. Make a note of the page numbers you want to print.

    It doesn''t matter where the heck cursor is.

    3. Click on the Print button on the toolbar.

    Or press F5 or choose File->Print from the menu bar. Just get that Print dialog
    box onscreen.

    4. Select Multiple Pages in the Print Selection section of the dialog box, and
    then click on OK.'
  merge: -1
  pgno: 224
- img_proc: true
  md: '# 196 Part III: Things You Can Do with Documents


    The Multiple Pages dialog box appears, waiting for you to type a number or a range
    of pages. If you want to print page 10 only, type 10 in the Page(s) box. To print
    pages 10 through 20, type 10-20 in the Page(s) box. See Table 11-1 for more info
    about page ranges.


    +   5. Click on OK until you''re out of all the dialog boxes.


    WordPerfect prints the pages you specified and skips all the other pages.


    # Printing random pages


    The Multiple Pages setting allows you to print contiguous and noncontiguous pages
    in your document easily. Use the options in Table 11-1 to find out how to specify
    different groups of pages. Click OK to print the pages you need.


    | Table 11-1 Print-Range Page Numbers |

    | Entry | Meaning |

    | all | Print all the pages in the document. |

    | x | Print page x. |

    | x,y,z | Print pages x, y, and z(separate page numbers with commas or spaces).
    |

    | x-y | Print pages x through y, inclusive. |

    | x- | Print page x through the end of the document. |

    | -x | Starting at the beginning of the document, print through x. |

    | x,y-z | Print page x and then pages y through z (you can include as many page
    ranges as you want, separated by commas or spaces). |

    | | If you specify a list of pages (x,y,z) or a list of page ranges (x-y, w-z)
    the list must go from lowest to highest. For example, 5.1.3 prints only page 5;
    10-15. 1-5 prints only pages 10–15. |'
