  md: '# Chapter 1: WordPerfect Basics 17


    **Property Bar:** Contains a bunch of controls that let you change how things
    look in your document. The Truly Technical call how things look the *properties*
    of the things. Text (the letters and numbers) has properties such as being **bold**
    or not being in *italics* or text. In a table, however (lovingly described in
    Chapter 14), has properties such as whether the cells in the table have outlines
    around them. Whatever you''re doing in WordPerfect, the Property Bar changes to
    let you control all the characteristics (or properties) of what you''re working
    with. It''s pretty neat, actually.


    **Application Bar:** The bottom line of the WordPerfect window; shows information
    about what''s happening in WordPerfect. We talk about the controls on the Application
    Bar in the following section.


    **Scroll bars:** Along the right side of the window, the gray strip that helps
    you move around the document. You find out how to use scroll bars in Chapter 2.
    If a document is too wide to fit across the screen, WordPerfect displays a scroll
    bar along the bottom of the window, right above the Application Bar. (Why does
    WordPerfect have so many bars? Maybe Utah, where WordPerfect was originally written,
    doesn''t have many bars.)


    **Mouse pointer and cursor:** (Mouse pointer) Usually a little arrow that shows
    where the mouse is pointing. The mouse pointer changes to others depending on
    what you''re doing, as explained in Chapter 2. (Cursor, or insertion point) A
    blinking vertical line that indicates where you''re typing. The *shadow* cursor
    is a WordPerfect innovation. It indicates where you would be typing if you clicked
    the mouse and started typing. It''s a handy way of seeing where you''re moving
    to in your document.


    **Dark edges:** Sometimes on either side of a document, represent your desktop
    under "paper" on which you''re typing. The WordPerfect folks seem gone overboard
    in the realism department here, although they might have gone a step further and
    displayed simulated wood grain with coffee mug rings


    Wow! You have lots of gizmos to look while you''re trying to type. Chapter 19
    contains hints for controlling the things that clutter the WordPerfect window.
    Otherwise, you get used all these little buttons and messages eventually — probably
    the same time a new version of WordPerfect comes, along with a new concept in
    screen clutter.


    When WordPerfect is busy, the mouse pointer, which is usually a little arrow,
    turns into a watch face. The second tick while WordPerfect does something it considers
    to be more important than listening to your commands. The watch means, "Wait around
    until I''m finished. Considering warming up your coffee in the nuke." Sooner or
    later (usually within a few seconds), the mouse pointer turns back into its normal
    pointy self, and you can get back to work.


    ![](img/a2afb402c275cfc5e5a8f62356a922ef_46_0.png)'
  merge: -1
