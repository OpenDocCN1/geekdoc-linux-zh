  md: '# 34 Part I: Introducing WordPerfect for Linux


    ![](img/a2afb402c275cfc5e5a8f62356a922ef_63_0.png)


    What''s the function of all those keys with Fs on them?

    Back in the old days, before mice, WordPerfect users did everything with function
    keys. Function keys are those with Fs on them above the number keys on the keyboard;
    their jobs change with every program you run. These keys are the second way of
    ordering around WordPerfect that we mention in this chapter. Unless you happen
    to remember some of these function keys from earlier versions of WordPerfect,
    you''ll have a dickens of a time figuring out what the function keys do for now.
    Here are some you might find useful, though:

    F1: Help. (We talk about this key later in this chapter).

    F2: Find and Replace (see Chapter 4).


    F5: Print.

    F8: Save.

    Depending on how Linux and your X Window system are configured, all, some, or
    none of your function keys work. (How''s for a vague statement?) Linux and X enable
    you to reassign the meaning of all the keys on the keyboard, and some X (particularly
    window managers) use the Ctrl and Alt keys for other purposes. Pressing a few
    keys and see what happens! (If a dialog box appears, press Esc to undo whatever
    you did. If the formatting of a document changes, press Ctrl+Z to undo it.) If
    your window manager usurps a key that you really, absolutely must have for WordPerfect,
    talk to your local Linux guru about changing the window manager settings.


    # Clicking on the menu bar


    To see what''s on a menu, click on a word on the menu bar (with your left mouse
    button, if you were wondering). That word then gets highlighted, and a menu of
    commands drops down from it. Quite unreasonably (because you didn''t pull anything),
    this is called a pull-down menu.


    To try out this theory, start WordPerfect (refer to Chapter 1), make sure that
    you''re working in the document window (the one that displays a blank document),
    and then click on the word File. The word New is (it has a box around it) as the
    WordPerfect waiter suggests the delightfully savory New command. Admire this screen,
    leave things as they are, and read on.


    If you don''t find anything you like, close the menu by clicking anywhere in the
    WordPerfect window. If you click on another button or menu selection, however,
    you get whatever you clicked.'
