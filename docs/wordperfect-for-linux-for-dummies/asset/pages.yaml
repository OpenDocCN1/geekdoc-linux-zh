    the Create or Edit Hyperlink button again. This time, choose Remove Link from
    the menu that appears.


    # Changing the look of your page


    So far, the background color of your Web page is gray, for old-fashioned Web pages.
    If you want to switch to a different color, choose Format>Text/Background Colors
    from the menu. In the Background Color/Wallpaper section of the Text/Background
    Colors dialog box, as shown in Figure 18-10, click on the Background Color setting,
    which looks like a little gray box. A small, untitled dialog box appears, containing
    zillions of colors to choose from. Click on one (we like white, which appears
    in the upper-right corner). The background color of your Web page changes!


    ![](img/a2afb402c275cfc5e5a8f62356a922ef_364_0.png)


    Congratulations! That''s all it takes to create a fairly complete Web page. Although
    you have created a document that''s ready to become a Web page, you have one more
    step— saving the document as an HTML file, the standard format for all Web pages.
    We describe this task in the following section.


    # Converting Your Documents to Web Pages


    One of the most useful things about the WordPerfect capability to create Web documents
    is that you can use those documents on the World Wide Web. (What else would you
    do with them?) You already have a bunch of WordPerfect documents. Presto — instant
    content for your Web site.'
