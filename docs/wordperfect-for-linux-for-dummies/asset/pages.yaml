  md: '# 92 Part I: Introducing WordPerfect for Linux


    Document dictionaries are specific to each individual document. A short story
    may have a document dictionary that contains the names of the characters in the
    story, for example. Perhaps a character doesn''t appear in subsequent stories
    because of a gruesome death by editing. Therefore, if you want WordPerfect to
    consider the name to be in this document; if the name appears in any other document,
    however, it should be flagged.


    You can also create optional special dictionaries. You may write various topics,
    for example, each with its own particular jargon. Although the word e-mail, for
    example, might be intentional when you''re writing for programmers, it probably
    would be a typo if you were writing for gardeners.


    ![](img/a2afb402c275cfc5e5a8f62356a922ef_121_0.png)


    Keep things simple — just add words to the basic dictionary. To add words to the
    dictionary, start the spell checker as you normally do. (What? You forgot already?
    Refer to the preceding section for details.)


    # Making and unmaking mistakes in the supplemental dictionary


    It''s easy to go tripping merrily through your document, clicking on Add for every
    word the spell checker flags. This glitchness eventually causes you to add a word
    as knockwork to the dictionary. (The word was supposed to have been knockwork;
    you typed it before quitting time, however, and you were looking at the clock.)
    Because knockwork is considered to be a genuine word, the spell checker ignores
    any subsequent knockworks.


    Usually, you see Document Dictionary (the list you''ve been creating) and rootxtus.dup
    (the list that comes with WordPerfect).


    +   4. When you have the dictionary selected, click the Edit button.


    You see the Edit dialog box for the dictionary.


    To correct this situation, you must go deeper into the labyrinth depths of the
    spell checker than a novice normally would. Walk this way, please:


    +   5. In the Key Words column, scroll down the word list until you see knockwork
    (or whatever your mistake was); then click on the Delete Entry button.


    +   1. Choose Tools::Spell Check to display the Spell Checker tool.


    The word is gone, gone, gone.


    +   2. In the Spell Checker dialog box, choose Dictionaries::Supplementary.


    +   6. Find your way back to the Spell Checker tool by clicking on Close buttons.


    You see the Supplementary Dictionaries dialog box.


    Spell checking isn''t magic, although the name probably sounds promising if you''re
    a wizard!


    +   3. In the Dictionaries in Search Order, click on the supplementary dictionary
    you want to edit.'
