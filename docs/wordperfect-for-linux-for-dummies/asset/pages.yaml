    # The InitialStyle style


    The other built-in style, InitialStyle, specifies the way your text looks when
    you create a new document, before you do anything to change its appearance. You
    don''t have to apply InitialStyle; it happens automatically at the beginning of
    your document. Unless you apply other styles, all the text in your document is
    formatted according InitialStyle.


    InitialStyle is, in fact, the central place where your choices are recorded when
    you click on the Initial button in the Font dialog box (described in Chapter 6,
    in the section about formatting an entire document) or the File Document:Default
    font command (described in Chapter 19, in the section about setting your favorite
