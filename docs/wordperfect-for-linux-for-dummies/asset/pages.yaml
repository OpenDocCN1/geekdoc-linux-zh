  md: '# # Chapter 12

    # Juggling Documents on Your Screen


    +   **In This Chapter**

    * Working on more than one document at the same time

    * Closing documents

    * Sizing windows

    * Maximizing and minimizing documents

    * Combining documents

    * Knowing what to do if a file already exists

    * Using foreign files


    Imagine living in New York City, in an apartment that has a powerful telescope.
    Using your telescope, you can look into the windows of your various neighbors.
    In one window, you see an office worker typing away. In another, you see a warehouse.
    In a third, someone is washing the dishes. In the fourth—oops! Close the curtains!


    In the same way, WordPerfect for Linux enables you to work on more than one document
    at the same time. When you open each document, WordPerfect creates a window to
    display it. You can open several documents at one time and view several windows
    simultaneously. Hey, that''s what Windows is all about!


    This chapter explains this multiwindowing stuff to you. You don''t need a telescope
    to do it. Using these techniques, you can improve your productivity by viewing
    and editing related documents at the same time, or you can turn your Linux desktop
    into a big mess, as shown in Figure 1-1. The choice is yours.'
  merge: -1
  pgno: 232
- img_proc: true
  md: '# #204 Part III: Things You Can Do with Documents


    ![](img/a2afb402c275cfc5e5a8f62356a922ef_233_0.png)


    Figure 12-1:

    Using multiple documents can get out of hand.


    While we are on the subject of opening documents, toward the end of this chapter
    we will talk about how to open files that *don''t* contain WordPerfect documents,
    such as documents created by other word processing programs.


    # # How Can You Work on Two Documents at a Time?


    To open a document, you open it in a new window by choosing the Program;Open Window
    window command in the program window. WordPerfect creates a new window for the
    document on your desktop.


    After you open a document, you can open *another* document. WordPerfect keeps
    the first document open but partly covers its document window with a second window
    that contains the second document.'
