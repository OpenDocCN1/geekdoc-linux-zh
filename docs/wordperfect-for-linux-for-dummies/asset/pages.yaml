    # # Who Am Us, Anybody?


    This section explains what we assume about you, our esteemed (and, thanks to the
    joy of software, occasionally steamed) reader:


    +   - You use some version of Linux. We used Red Hat Linux and the KDE window
    manager when we wrote this book, although you may use a different version of Linux
    and a different window manager, like GNOME. If so, your screen may look a little
    different from the pictures in this book.

    - WordPerfect is already installed. (If it''s not, take a look at the appendix
    in the back of this book to find out how to install WordPerfect from the CD.)

    - You want to write stuff and make it look nice.

    - You don''t really give a bat''s eyelash about Linux or computers except for
    what you absolutely need for your daily work.

    - You have a Linux “guru” available — an expert, like one of those infuriating
    clever 10-year-olds born with a computer cable for umbilical cord, whom you can
    pay off in cookies, pizza, or Chinese food. Because Linux is almost infinitely
    configurable, you may need your local Linux wizard to configure your system if
    it doesn''t act the way we say that it should.

    - You don''t have expertise with windowing systems, although you have a mouse
    and probably would know a window if it were pointed out to you.

    - You or the person who installed WordPerfect in the standard way. WordPerfect
    is accommodating almost to a fault and lets itself be twisted and restructured
    like a ball of Silly Putty. If buttons and things on your screen don''t look like
    the buttons in our pictures or if your keyboard doesn''t work as this book describes,
    be suspicious that someone got clever and changed things.


