    Step 1: Get comfortable at your computer.


    Be sure that your desk is at a comfortable working height, your wrist sits loose,
    and the screen is at the same level (or a little lower) than the level of your
    eyes


    These mysteries and more are described in loving detail in Chapter 14.


    Keep in mind that the proportions you use onscreen aren''t exactly the ones you
    see when you print. Print your document to check.


    WordPerfect provides a bunch of other commands you can use to edit a graphics
    box. Select the box (not its contents) by clicking on it once and then right-click
    on the picture. From the resulting QuickMenu, choose Image Tools. You see the
    Image Tools dialog box—with its set of 14 buttons. Hover the mouse pointer over
    a button to find out what it does. The buttons do such as convert a picture to
    black-and-white, move a picture around within a box, and set picture brightness
    and contrast. Close the Image Tools dialog box by clicking on the X in the upper-right
    corner.


    # How to see where you''re going


    To make seeing where you''re positioning an image easier, zoom out to Full-Page
    view before you begin positioning or sizing your image. Click outside the image
    area, some-where in the text. Click on the Page/Zoom Full button on the toolbar;
    it''s the button with


    magnifying-glass-and-plus/minus icon. Now start positioning and sizing.


    When you finish positioning and sizing your image, click in the text somewhere
