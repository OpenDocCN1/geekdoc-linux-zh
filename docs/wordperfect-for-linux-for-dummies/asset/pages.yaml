- img_proc: true
  md: '# Chapter 16: Creating Your Own Junk Mail


    The WordPerfect merge feature is cool, although it''s not worth using unless you
    want to send a bunch of letters. For two or three letters (even four or five),
    it''s not worth the effort. For small jobs, type one letter and print it; then
    edit the address and print it again; and so on.


    # Creating a Data File


    Before you begin creating a data file, you have to know which fields you want
    to put in it. Remember that fields are the bits of information you want to keep
    that will enable you to create the merged documents (the junk mail letters). Fields
    are such as a person''s first and last names, street address, city, state, and
    zip code and how money he owes you. For a list of parts in inventory, fields may
    be numbers and prices. For a list of relatives, fields may be family members name,
    parents, and children.


    To make the rest of the process smoother, take some time to figure out which information
    you need. For a list of people, you may have to separate First Name and Last Name
    fields that your letter can begin with Dear Joe and mention the Bloggs later.
    Other fields may be something like the amount each family donated last year in
    response to a church-donations letter or the child''s name and the school''s start
    date for a letter from a day-care center.


    When you have a list of fields jotted down on a piece of paper, you''re ready
    to get started creating your WordPerfect merge data file. Figure 16-1 shows the
    fields we figured out that we need in order to create letters to a (hypothetical)
    daycare center.


    Figure 16-1: Which pieces of intrusive information do you want to include in your
    form letters?


    ![](img/a2afb402c275cfc5e5a8f62356a922ef_306_0.png)'
  merge: -1
  pgno: 306
- img_proc: true
  md: '# Part IV: Creating Documents That Don''t Just Sit There


    Begin creating your merge data file by choosing ToolsMerge or pressing Shift-F9.
    WordPerfect displays the dialog box in Figure 16-2. To create the data file (the
    list of people, for example), you click the Data button. To create a form file
    with the codes for a form letter or mailing labels, you click the Form button.
    After you''ve created the data file and form file, you click the Merge button
    to merge the data into the form and create a finished junk mail document!


    ![](img/a2afb402c275cfc5e5a8f62356a922ef_307_0.png)


    Clicking on the Data button lets you type from scratch a file of people (or whatever''s
    on your list). What if your data is already in a file, though? What if someone
    has delivered a data file to you, in some nice, fancy format that made sense to
    her, but has nothing to do with a WordPerfect merge data file? May not be lost.
    The (rather long) following section, “Turning a full document of text into a data
    file,” may be able to help you hack your out of this situation. If you''re lucky,
    and you''re staring at a desk full of paper whose information you now intend to
    enter into WordPerfect, skip the following section and rejoin us at the section
    titled “Creating a data file from scratch.”


    # Turning a document full of text into a data file


    You''re not supposed to need to do this task. You''re supposed to get your merge
    data file all set up and enter data into it. In real life, you often start with
    a document file of data you want to use for merging. It can happen in many ways,
    although typically you typed all your data and then decided to read this chapter
    and find out how to use that stuff in a merge'
  merge: -1
  pgno: 307
- img_proc: true
  md: '# Chapter 16: Creating Your Own Junk Mail


    document. Or maybe somebody gave you a file and asked, "Can you create a bunch
    of letters for these things?" Or maybe you just''t follow instructions. No matter.
    If your data is already in a WordPerfect (or a document WordPerfect read), it
    can be turned into a merge data file. Although the job isn''t easy, it can be
    done.


    No mechanical process works for all data files. Instead, we take you through one
    example of how you can change a document into a merge file. (You have to adapt
    these steps to your situation.) Before you get started working on your data, you
    still have to figure out how you want to divide it—that is, which fields you have
    in your document. Take a look back at Figure 16-1 to see what we figured would
    need for our daycare center.


    Figure 16-3 shows what a sample file may look like that contains the information
    we need. It''s a typical way that someone (certainly not) may enter data into
    a WordPerfect file. The file contains the data you need for format letters; it''s
    not laid out as WordPerfect merge data.


    ![](img/a2afb402c275cfc5e5a8f62356a922ef_308_0.png)


    The way the data in Figure 16-3 is typed doesn''t have much to do with the way
    WordPerfect looks. We can help you fix that, by showing you how to replace the
    blank lines between the records with ENDRECORD codes and replace the spaces between
    the fields with hard carriage returns and ENDFIELD codes. Follow these steps:


    +   1. Save your file.


    We could assume you''ve already done this step, although it never hurts to remind
    you. It''s an especially good idea to save files right before you embark on a
    project like this one that requires a great deal of finding and replacing, because
    you can do lots of damage to your document very quickly this way if something
    goes wrong. A word to the wise. . . .'
  merge: -1
  pgno: 308
- img_proc: true
  md: '# 280 Part IV: Creating Documents That Don''t Just Sit There


    2. Make sure that you have a blank line (or something) between each record.


    Remember that a record is a collection of data about any one thing — in this case,
    about a prospective daycare student. In this example, as is usually the case,
    a blank line is between records.


    3. Choose Edit:Find and Replace or press F2.


    The Find and Replace dialog box appears. You''re about to venture into deepest,
    darkest Find and Replace territory. If you need a refresher course, take a look
    at Chapter 4. Right now, we show you how to replace the blank line between each
    record with a code WordPerfect that this is the end of a record.


    4. Enter two-end-of-lines in the Find box.


    Refer to Chapter 4 if you need help with this step. (Hint: Match codes to enter
    the codes [HRT][HRS]. Click the Insert button to insert the codes. Then close
    the Codes dialog box.) If something else than a blank line appears between your
    records, type that something.


    5. Enter the [Hrt] and end-of-record codes in the With box.


    Click in the Replace With of the Find and Replace dialog box. Choose Replace:Codes
    to display the Replace Codes dialog box, insert one [Hrt], and then check the
    Display Merge Codes box. The box you''re looking for is ENDRECORD. Insert one
    ENDRECORD code and close the Replace Codes dialog box. The Replace With box should
    say [Hrt][Mrg:ENDRECORD].


    6. Choose the Options command on the Find and Replace dialog box menu and make
    sure that the Begin Find at Top of Document option is selected.


    That way, you know that WordPerfect will replace all the blank lines with ENDRECORD
    codes, regardless of where you are in the file.


    7. Click on Replace all blank lines and click on OK when WordPerfect tells you
    it did.


    WordPerfect replaces all blank lines between the records with ENDRECORD codes.
    Don''t leave the Find and Replace dialog box; you have more to do.


    8. Enter a space in the Find box.


    Replace the contents of the Find box with a single space. Each of your fields
    must be on a line by itself. You have no good way to make that happen, other than
    to replace some spaces in your document with WordPerfect end-of-line codes. (Those
    codes are discussed in Chapter 4.) Also, isn''t it annoying that WordPerfect doesn''t
    type anything when you put a space in the Find box? You just have to know that
    you typed a space there.'
  merge: -1
  pgno: 309
- img_proc: true
  md: '# Chapter 16: Creating Your Own Junk Mail


    9. Enter [HRT] in the Replace With box.


    Just click in the Replace With box, choose Replace^:Codes, and scroll through
    the list until you see HRT. Click on Insert and then on Close. Alternatively,
    you can just delete the [Mrg:RECORD] code, leaving the [HRT] code from Step 5.


    10. Replace the right spaces with [HRT] codes.


    Pretty helpful instructions, huh? You need to look at your document as WordPerfect
    finds each space in turn. You decide which spaces ought to be [HRT] codes: You
    need an [HRT] code between each field and the next.


    To replace only the space that separates fields, click on the Next button to find
    the first space. Decide what follows the beginning of a new field. In our daycare
    example (take a look at Figure 16-3 again), the first space WordPerfect finds
    is the one between Susan and Arnold. You do want to replace this space with [HRT]
    because you want to separate first and last names into two different fields in
    the data file. (Glance back at Figure 16-1).


    To replace a space with [HRT], click on the Replace button. WordPerfect replaces
    the space and automatically finds the next.


    In example, WordPerfect would next find the space between 29 and Lincoln. We would
    not replace this space with [HRT] because both 29 and Lincoln would be part of
    Address (refer to Figure 16-1).


    To skip a replace (to not replace a space with [HRT]), just click on Find Next
    to find the next space.


    If the Find Replace dialog box gets in the way of your document, move it out of
    the way by dragging its title bar with the mouse. Keep going on, and on, and so
    on ... until you get all the way through the document. WordPerfect lets you know
    you are done by displaying a dialog box that says Text not found and asking you
    to click on OK. Although each field is now on a separate line, you still have
    to insert codes between the fields. Do not close the Find and Replace dialog box.
    You have one more replacement to make.


    ![](img/a2afb402c275cfc5e5a8f62356a922ef_310_0.png)


    11. Enter an end-of-line code in the Find box. Double-click in the Find box to
    make sure you get rid of that pesky invisible space you typed in Step 8. Leave
    the [HRT] code.


    Next, you change all [HRT] codes in the end-of-field code to end-of-field codes.


    12. Replace in the Replace Box with an end-of-field code followed by an end-of-line
    code.


    Refer to Step 5 for an example of how to do this step. You should see [Mrg:ENDFIELD][HRT]
    in the Replace Box with.


    13. Click on Replace All. Click on OK when WordPerfect has made all the replacements.'
  merge: -1
  pgno: 310
- img_proc: true
  md: '# 282 Part IV: Creating Documents That Don''t Just Sit There


    This time, close the Find and Replace box.


    4. Use the File:Save As command to save your file with a new name.


    You did all this work to your file; it looks pretty much right. Save it so that
    if something happens to the power, you don''t lose all that work. Save it with
