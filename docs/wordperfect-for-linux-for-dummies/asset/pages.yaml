  md: '# 366 Part V: Oh, Help!


    You can run into a problem if you give one of your WordPerfect documents to someone
    who uses an older, inferior version of WordPerfect, such as WordPerfect 5.1 or
    5.2. To prevent problems, you can save your document in a format that one of these
    older programs can read.


    To save your document in an older format, choose File>Save As or press F3. In
    the Save As dialog box, type a new filename so that you don''t replace the version
    you saved in regular WordPerfect 6/7/8 format. In the File Format box, down in
    the Save Options part of the dialog box, select WordPerfect 4.2, WordPerfect 5.0,
    or WordPerfect 5.1/5.2. Then click OK. If you want to be to give the document
    to someone who uses Microsoft Word or another word processor, select Rich Text
    Format (RTF).


    Now you can give this new document — in a godly WordPerfect format — to your friend
    Fred and see what else he can find to complain about!


    # # WordPerfect''s Not Listening to Me!


    Try choosing a command from a menu. Nothing happens. Try clicking on a button
    on the Property Bar or toolbar. Nothing. Hmm. WordPerfect must be deliberately
    and- maliciously ignoring you. Maybe it''s taking its afternoon siesta.


    If you cannot get WordPerfect''s attention, your first inclination may be to pound
    on the keyboard, shout at it, or slap it. For technical reasons too complex to
    explain here, we recommend the shouting approach (assum- that you''re responsible
    for paying for a broken keyboard and that you''re not interested in breaking your
    hand on the side of the monitor).


    After you get your frustrations out, follow these steps:


    Maybe some part of your computer system is so busy doing something that it hasn''t
    had a chance to respond to you. You never know.'
  merge: -1
  pgno: 395
- img_proc: true
  md: '# Chapter 20: Don''t Panic! Read This Chapter!


    If talking to your window manager doesn''t help, even after five minutes, it''s
    time for serious violence. Time to bash some bits! Unfortunately, this technique
    blows away WordPress and the documents you opened. With luck, you saved your documents
    recently or you used backups (refer to Chapter 19). If you can switch to other
    applications, close them now in the traditional way. Unlike Windows, Linux lets
    you kill one "console" and the programs running there, without having to restart
    Linux entirely.


    Follow these steps when WordPerfect is out to lunch:


    +   1. Press Ctrl+Alt+F1 to switch to a Linux shell.

    Many versions of Linux support multiple consoles, so you can be logged in as several
    people at the same time. To switch among the various consoles, you press Ctrl-Alt,
    and a function key: For example, Ctrl+Alt+F1 switches to the first console. Only
    one console can run a window manager, which is the seventh console, at Ctrl+Alt+F7.

    2. Press Ctrl+Alt+Del to shut down Linux.

    Turning off your computer without shutting down Linux can confuse seriously, so
    it is important to press Ctrl+Alt+Del before you give up on your computer and
    press the Reset button. Ctrl+Alt+Del runs the shutdown program, and you see lots
    and lots of messages about programs shutting down. Then your computer restarts
    and Linux comes back to life.

    3. Log back in, run WordPerfect, and see what it looks like.


    If WordPerfect keeps backups of your files, you may not lose too much of your
    work. Refer to Chapter 19 to find out whether WordPerfect is configured to keep
    backups.


    # “Timed Backup Files Exist?”


    If WordPerfect crashes (or another program crashes and takes WordPress with it)
    or if you turn off your computer while WordPerfect is running or if lightning
    strikes your house and causes a temporary blackout, WordPerfect doesn''t get a
    chance to the housekeeping chores it usually does when you exit. One of these
    chores is deleting the timed backup files it creates (assuming that you used timed
    backups; refer to Chapter 19).


    The next time you run WordPerfect, you see the Timed Backup dialog box with the
    message that WordPerfect has discovered the timed backup copy of one or more of
    your documents — probably one of the documents you were editing when WordPerfect
    went west.


    These timed backup files can be a godsend if you did a bunch of editing and didn''t
    save your document before disaster strike. See the section in Chapter 19 about
    getting back your backups to find out how to use timed backups to recover from
    these types of disasters.'
  merge: -1
