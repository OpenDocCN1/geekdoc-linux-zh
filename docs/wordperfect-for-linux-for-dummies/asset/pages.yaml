- img_proc: true
  md: 'You can tell when one of these formats is turned on by looking at the Bold,
    Italic, and Underline buttons on the Property Bar. If the buttons appear to be
    pressed in, the format is on wherever the cursor is or on whatever text is selected.


    # Is this part formatted?


    What happens if you select a bunch of text and some of the text is already formatted?
    Suppose that you select a sentence that contains one italicized word. When you
    select the sentence, the Italic button does *not* appear to be pressed because
    the whole selection (sentence) is not in italics. If you click on the Italic button
    while the sentence is selected, WordPerfect italicizes the entire sentence; if
    you click on the button again, WordPerfect unitalizes the entire sentence.


    # Yikes! Getting rid of formatting


    If you have a little overboard with formatting, WordPerfect can turn it off again.
    Follow these steps:


    +   1. Select the text you want to unformat.

    2. Look at the Property Bar.

    If all the text you selected is formatted, the relevant text-style button looks
    as though it''s pressed in. For example, if all the text you selected is bold,
    the Bold button looks as though it''s pressed in.

    3. Click on the pressed button.

    This step releases the button so that it isn''t pressed anymore, and the formatting
    should disappear. If one click doesn''t do the trick, click on the button again.


    Here''s an alternative to Step 3: Press the equivalent key combination (Ctrl+B,
    Ctrl+I, or Ctrl+U) to remove the formatting for the selected text.


    You can use more than one type of formatting at the same time. You can make text
    both **bold and italic**, just click on both the Bold and Italics buttons (one
    at a time, please) on the Property Bar or press Ctrl+B and Ctrl+I-ditto to turn
    the formatting off.


    When you format characters, WordPerfect inserts secret codes into your document
    to tell it where to turn the formatting on and off. If you have trouble removing
    formatting or getting WordPerfect to format the right text, see Chapter 9 to find
    out how to see and delete these secret codes.'
  merge: -1
