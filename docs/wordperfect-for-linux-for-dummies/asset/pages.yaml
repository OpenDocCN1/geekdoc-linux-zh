  md: '# 194 Part III: Things You Can Do with Documents


    (we''re not making this up), and the spooler is on its way to the printer. The
    document may have gotten stuck on its way. (Intestinal distress happens even to
    computers.) Make sure the printer is turned on and online. If nothing happens
