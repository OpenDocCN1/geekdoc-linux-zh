    \ document and go back to it quickly. Suppose that you're working on your epic\
    \ Of Chocolate and Chocolatics, a 500-page masterpiece with 30 chapters. You've\
    \ created a master document and a subdocument for each chapter (as explained in\
    \ Chapter 17), and you're working on the master document in Expanded view (so\
    \ that all the chapters appear in the document). If you're working on Chapter\
    \ 23, \"Ceremonial Uses of Chocolate,\" and want to check what you said about\
    \ that topic in Chapter 1, \"A History of Chocolate,\" you have several options\
    \ to do this; (of course you do this; this is WordPerfect);\n\n+   - Press the\
    \ PgUp key on your keyboard to get to Chapter 1. This method makes your finger\
    \ sore and takes a long time.\n- Choose Edit\\>Find and Replace to search for\
    \ the text A History of Chocolate. The problem with this method is that Word stops\
    \ at every occurrence of A History of Chocolate in the entire book to this point.\
    \ This method also takes a long time.\n- Use a bookmark. After you set a bookmark\
    \ in the text of A History of Chocolate, you can get back there at any time by\
    \ displaying the Go To dialog box and selecting the name of the bookmark. No matter\
    \ how far away you are, WordPerfect takes you as though you were on a magic carpet.\
    \ After you check what you want to see, you can use Go To again to return to your\
    \ last position in Chapter 23.\n\nSetting bookmarks and moving them to see would\
    \ be a great deal of work, and it is; it's worth the trouble only if you plan\
    \ to go back to that bookmark or use some of the really obscure features of WordPerfect.\
    \ (That's why we haven't explained bookmarks until now.) With the advent of hyper\
    \ and the World Wide Web, bookmarks become really useful.\n\nTo create a bookmark,\
    \ follow these steps:\n\n+   1. Move the cursor to the location you want to be\
