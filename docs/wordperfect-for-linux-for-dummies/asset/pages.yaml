  md: '# Chapter 1: WordPerfect Basics


    ![](img/a2afb402c275cfc5e5a8f62356a922ef_42_0.png)


    ![](img/a2afb402c275cfc5e5a8f62356a922ef_42_1.png)


    Throughout this book, we use KDE for examples (not because we think that it''s
    any better than any of the other window managers, but rather because we did have
    to pick one and think that it''s a pretty good one). Corel Linux comes with KDE,
    which is another reason why you may be using it. All four window managers look
    strangely like Windows and Macs, so if you''re comfortable with one of those systems,
    you''ll find the switch to Linux easy! If your Linux system uses a window manager
    other than KDE, don''t worry — they all work practically the same way.


    # Honey, I Shrunk the Program!


    While WordPerfect is running, you can minimize (or iconify) it, which means that
    it shrinks into a little button on the taskbar or an icon on the desktop. You
    may want to minimize a program to get it out of the way temporarily while you
    do something else. Although the program''s still running, ready to do your work,
    it''s tiny. Minimizing is similar to freeze-drying your program: You can add water
    to bring it back to life.


    If you want to minimize WordPerfect (who wouldn''t?), click on the little Minimize
    button for whatever window manager you have — the button is usually a little dot
    or underscore button near the upper-right corner of the window. Poof! The window
    disappears in a puff of bytes, to be replaced by a button on the taskbar or an
    icon on the desktop.'
