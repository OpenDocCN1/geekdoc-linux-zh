  md: "# # Emphasizing Text with Boldface, Italics, and Underlining\n\nWe start with\
    \ the easiest way to add emphasis to text. **Boldface**, *italics*, and underlining\
    \ are three methods of making a word or phrase stand out and make itself known.\
    \ All you have to do is follow these steps to add boldface, underlining, or italics\
    \ to your text (not all three at the same time, please!):\n\n+   1. Select the\
    \ text you want to emphasize.\n   Chapter 4 shows ways to select text.\n2. Click\
    \ on the Bold, Italic, or Underline button on the Property Bar.\n   If you haven't\
    \ guessed, these buttons have **B**, *I*, and <u>U</u> on them. Alternatively,\
    \ press Ctrl+B for bold, Ctrl+I for italics, or Ctrl+U for underlining. (Hey,\
    \ even we can remember *these key combinations*!)\n\n![](img/a2afb402c275cfc5e5a8f62356a922ef_127_0.png)\n\
    \nWord displays the text in the font style you chose. Done!\n\nWhen you use these\
    \ text styles, WordPerfect inserts secret formatting codes before and after the\
    \ formatted text. The first code turns the formatting on, and the second code\
    \ code turns it off. The names of these secret codes are *Bold*, *Italic*, and\
    \ *Und*. (Like we always say, why make these code names readable when you can\
    \ make them cryptic and hard to spell?) To find out how to see, move, or delete\
    \ these secret formatting codes, see Chapter 9.\n\n# # Formatting as you type\n\
    \nYou can also add text styles to text as you type it. If you're about to type\
    \ a word you want to emphasize, follow these steps:\n\n+   1. Click on the Bold,\
    \ Italic, or Underline button on the Property Bar or press Ctrl+B, Ctrl+I, or\
    \ Ctrl+U.\n   This step turns the formatting on so that whatever you type is formatted\
    \ this way.\n2. Type the text you want to emphasize.\n   It appears with the formatting\
    \ you choose.\n3. Turn off the formatting by clicking on the same button or pressing\
    \ the same key combination in Step 1."
  merge: -1
