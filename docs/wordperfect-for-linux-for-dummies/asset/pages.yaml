- img_proc: true
  md: '# Running WordPerfect


    Before you run WordPerfect, run your window manager (KDE, GNOME, or another desktop
    environment). Then run WordPerfect by opening a window and typing the directory
    name in which you installed the program (/usr/local/wp, if you followed our instructions),
    followed (with no space) by /wpbin/xwp. For example, type /usr/local/wp/wpbin/xwp
    and press Enter.


    The first time you run the program, it asks for a license key, which you get for
    free from Corel''s Linux Web site (http://linux.corel.com). Follow the links to
    see information about Corel WordPerfect 8 for Linux, and then click the Register
    Now after you fill in your personal information and click the Submit button. Corel
    displays your license key. Type this long string of characters just as they appear
    (remember that punctuation and capitalization count!).


    You don''t have to enter a license key the first time you use WordPerfect; You
    have 90 days before the program refuses to run without a license key.


    ![](img/a2afb402c275cfc5e5a8f62356a922ef_416_0.png)


    # Installing the language modules


    If you use a language other than American English, you can install a “language”
    module for another language. The modules are stored on the CD-ROM in the following
    files:


    | Canadian English | GUILGE/GUILGE0.GZ |

    | Australian English | GUILGOZ/GUILGO0.GZ |

    | U.K. English | GUILUK/GUILUK0.GZ |

    | Canadian French | GUILCF/GUILCF0.GZ |

    | French | GUILFR/GUILFR0.GZ |

    | Dutch | GUILGNL/GUILGN0.GZ |

    | Spanish | GUILGES/GUILGES0.GZ |

    | German | GUILGDE/GUILGDE.GZ |

    | Italian | GUILGIT/GUILGIT0.GZ |


    To install a language module, first install WordPerfect itself by following the
    instructions in the section “Installing WordPerfect,” earlier in this appendix.
    Then follow Steps 9 through 12 in the same manner, substituting the name of the
    language module (for example, GUILUK/GUILUK0.GZ for U.K. English) in place of
    the WordPerfect program file (GUILG/GUILG0.GZ).'
  merge: -1
  pgno: 416
- img_proc: true
  md: 'After installing the language module, you can tell WordPerfect to use the module
    by starting the program with the command xwp-lang XX (replacing XX with the two-letter
    abbreviation for the language, from the last two letters of the name of the CD-ROM
    directory that contains language module). To add the language to the spell-checker,
    choose Tools-Spell Check in the WordPerfect document window, choose Dictionary-Main,
    and click Add to choose the dictionary for the language. To select a language
    for the current document, choose Tools-Language-Settings. To select a language
    for all new documents, choose File-Document-Current Document Style, choose Tools-Language-Settings,
    and select the language.


    # Adding WordPerfect to your KDE menus, panel, and desktop


    Note: The instructions in this section are for the KDE window manager: if you
    use another window manager, like GNOME, consult your window manager''s help files
    or manual.


    # The KDE Personal menu


    The WordPerfect installation program doesn''t get around adding WordPerfect to
    the menu that appears when you click the K button (the Application Starter button)
    in the lower-left corner of the KDE screen. You can fix this by adding WordPerfect
    to your Personal menu, which appears when you choose K-Personal. (You click the
    K button and choose Personal from the menu that appears.) Follow these steps:


    +   1. Choose K-Utilities-Menu Editor to run the keditmenu program.

    nYou see the Menu Editor window, with your Personal menu on the left and the standard
    KDE menus for your Linux system on the right. (Unless you are logged in as root,
    you probably can''t edit the menus on the right.) Your Personal menu may be empty
    — that''s okay!


    +   2. Right-click on the Personal menu and choose New from the menu that appears.

    nYou see the keditmenu window, showing information about a new entry on your Personal
    menu.


    +   3. In the File Name box, type wp.kdelnk as the name of the file to contain
    the information about this new menu entry.


    +   4. In the Name box, type WordPerfect or whatever you want to appear on the
    menu.


    +   5. In the Execute box, type the pathname of the WordPerfect program file.'
  merge: -1
  pgno: 417
- img_proc: true
  md: 'The pathname of the WordPerfect program file is the directory name you created
    when you installed WordPerfect, followed by wpbin/xwp. For example, if you installed
    WordPerfect in the /usr/local/wp directory, type /usr/local/wp/wpbin/xwp.


    +   6. Click on the large icon on the right side of the window, and pick the icon
    you want to use for WordPerfect.


    The Corel WordPerfect icon isn''t among your options, although you have some nice
    icons from which to choose!


    +   7. Click on OK to close the edititmenu dialog box.


    You return to the Menu Editor window, and your Personal menu now contains an entry
    for WordPerfect.


    +   8. Close the Menu Editor window by clicking on its Close (X) button and choose
    Yes to save your changes.


    To test your new menu entry, choose K<>Personal and see whether WordPerfect appears
    on the menu! If it does, choose WordPerfect and see whether the WordPerfect program
    runs.


    If you need to add an entry on your Personal menu, run the Menu Editor again,
    right-click on the entry, and choose Change from the menu that appears. To get
    rid of a Personal menu entry, right-click the entry in Menu Editor and choose
    Delete from the menu that appears.


    # The Panel


    You can add WordPerfect to the KDE panel that appears along the bottom of the
    screen, too. Choose K<>Panel<>Add Application<>Personal<>WordPerfect (or whatever
    you called your menu entry for the WordPerfect program) if you add an extra icon
    to the panel, delete it by right-clicking it and choosing Remove from the menu
    that appears.


    # The KDE Desktop


    You may like to have a WordPerfect icon on your desktop, too. The easiest way
    to create a new icon for WordPerfect is to display the WordPerfect program directory
    (probably /usr/local/wp/wpbin) in the File Manager. When you see the xwp file,
    drag it to your desktop. Choose Link from the small menu


    The resulting icon has the unglorous name of xwp. To rename it, right-click the
    icon, choose Properties from the menu that appears, and change the File Name option.'
  merge: -1
