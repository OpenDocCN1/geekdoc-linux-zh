  md: '# 154 Part II: Prettifying Up Your Text


    You can control the colors that WordPerfect uses for the text and background of
    the Reveal Codes window, how much information is shown for each code, and some
    other arcane facets of the Reveal Codes window. Chapter 19 shows you how to customize
    this stuff. Watch out, though: This subject is getting into seriously nerdy activities,
    don''t you think?


    What the heck do all those codes do? The rest of this chapter discusses the codes
    you usually encounter and how to get rid of ones you no longer want.


    # Adjusting the size of windows


    A dividing line separates the regular window from the Reveal Codes window, and
    a small box appears near the right end of the dividing line. Using the mouse,
    you can click on the box and drag the line up or down.


    # Getting rid of the Reveal Codes window


    When you finish looking at your codes, you can make the Reveal Codes window go
    away. Seeing codes leap around at the bottom of the screen is, after all, a little
    distracting. Use one of these methods to send the Reveal Codes window back into
    byte oblivion:


    +   - Choose View>Reveal Codes again.

    - Click on the box near the right end of the dividing line and drag it down to
    the Application Bar.

    - Right-click anywhere in the Reveal Codes window and choose Hide Reveal Codes
    from the QuickMenu that pops up.


    # Cracking the Codes


    Now that you know how to bring the secret WordPerfect formatting codes into the
    light of day, what can you do with them? Unlike cockroaches (which they otherwise
    resemble closely), WordPerfect codes don''t scurry away when they''re brought
    to light. In the Reveal Codes window, you can examine them, modify them, and even
    delete them.


    If you don''t want to know about codes, skip the rest of this chapter. If you
    run into trouble with your document and it starts acting as though it has fleas,
    come back here to find out what''s going on.


    ![](img/a2afb402c275cfc5e5a8f62356a922ef_183_0.png)'
