    # Hard- and soft-core codes


    WordPerfect has two versions of many codes: one hard and one soft. This terminology
    has nothing to do with ripeness, materials used, or anything we can''t mention
    in a G-rated book such as this one. No, it has to do with how seriously WordPerfect
    takes them.


    edit the text in a paragraph, for example, WordPerfect changes SRT codes into
    spaces (and vice versa) as necessary so that the margins are correct. It never
    deletes a HRT code, however. (See the section "Using Character Codes," later in
    this chapter, to find out what the HRT and SRT do.)


    WordPerfect inserts a soft code and could as well take it right out. The program
    continually shuffles the codes around. When you


    # Deleting codes


    The position of each code is important, and codes that are in the wrong place
    can be a headache. If you see a code that seems to have wandered off into the
    woods, you can trash it. Move the cursor in front of the code and press Delete,
    or move the cursor just after the code and press Backspace. Or, simply drag the
    code aboveground into the top window, where it evaporates in the warm light of
    day.


    When the Reveal Codes window isn''t displayed, WordPerfect skips most codes when
    you press the Delete or Backspace keys so that you do not delete codes accidentally.
    When the codes are revealed, however, WordPerfect ensures that you can see what
    you''re doing, and when you press Delete, it deletes the code to the right of
    the red cursor.


    ![](img/a2afb402c275cfc5e5a8f62356a922ef_185_1.png)


    Save your document (press Ctrl+S) before you make any changes in codes, because
    it''s easy to make a horrendous mess with this code stuff. If you save your document
    before you go up, you can just close the messy one (click the Close button or
    choose File>Close from the menu bar and No to throw away your ill-advised changes)
    and reopen the original (Program from the program window''s menu bar, and then
    select the filename from recently used documents at the bottom of the Program
    menu).


    Now that you know how to see and dispose of the WordPerfect secret codes, it''s
    time to look at the different types of codes and what they do..'
