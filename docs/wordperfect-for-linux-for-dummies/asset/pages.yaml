    ![](img/a2afb402c275cfc5e5a8f62356a922ef_315_0.png)


    # Creating a Form File


    When you create a list of recipients for your form letter, you can type the letter.
    The document that contains the form letter is the form file. A form file is a
    regular old WordPerfect document. You enter — in place of the name and address
    at the top of the letter, however — funky-looking merge codes, as shown in these
    steps:


    +   1. Choose Tools Merge, and click on the Form button.

    If the current document is blank, skip to Step 3. If the current document contains
    anything, WordPerfect wants to know whether you want to create a new document
    to contain the form letter or use the document that''s onscreen.

    2. Select New Document Window and then click on OK.

    If you have already typed the letter, and if that is the current document, choose
    Use File in Active Window instead.

    You see the Create Form File dialog box. WordPerfect asks which data file will
    provide the data for this form letter. You create the form file by using the Create
    Form File dialog box, as shown in Figure 16-6.

    3. In the Create Form File dialog box, enter the name of your data file at the
    right end of the box, and then click on OK.

    You can click on the little folder button at the right end of the box, which allows
    you to select the filename and directory. If WordPerfect can''t find your file,
    click on that button and browse around the file. (Refer to Chapter 13 for more
    information about how to find a file in the directories on your disk.) If you
    haven''t created the data file yet, select None. Click OK after you''ve decided
    where your data will live.'
  merge: -1
  pgno: 315
- img_proc: true
  md: '![](img/a2afb402c275cfc5e5a8f62356a922ef_316_0.png)


    WordPerfect opens a new document and displays the form file, the Merge toolbar
