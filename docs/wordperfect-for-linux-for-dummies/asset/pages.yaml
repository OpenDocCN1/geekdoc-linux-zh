    Up, and Page Down keys. If you want to use the numeric keypad for moving the cursor,
    make sure that Num Lock is on. (Press the Num Lock key on your keyboard to switch
    the numeric keypad between numbers and cursor motion.)


    You can press the arrow keys — which have the little up-, down-, left-, and right-pointing
    arrows on them — to move up or down one line or move left or right one character.
    These keys are great for positioning the cursor in an exact spot.


