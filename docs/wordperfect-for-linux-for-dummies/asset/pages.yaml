    To delete the contents of a bunch of cells, highlight them and press the Delete
    key. Although you don''t get any warning, the contents are gone. (You can always
    get them back by using Edit↮Undo or Ctrl+Z)


    # Changing the column width


    Changing individual column widths is simple. Click on the vertical line that divides
    the columns and drag it. The mouse pointer turns into a little horizontal-arrow
    gizmo, to tell you you''re moving a column divider. When you release the mouse
    button, the column divider moves over so that the column on one side of the line
    gets wider and the other gets narrower.


    If you hold down the Ctrl key while you move the column divider, only the column
    to the left of the divider gets wider or narrower as you move the divider. The
    column to the right of the divider line stays the same size. The whole table gets
    wider or narrower to provide the space needed. The columns to the right of the
    divider line just *move* rather than get resized. This feature can be handy.


    ![](img/a2afb402c275cfc5e5a8f62356a922ef_275_0.png)


    Changing the width of more than one column or the entire table is not hard, although
    it requires you to use a slightly intimidating dialog box. Using this dialog box,
    you can change other aspects of a table''s appearance—such as left-right justification,
    alignment of columns, column margins, table left-right justification on a page,
    and text-style variations by column or row. Because SpeedFormat, discussed in
    the following section, does such a good job with all this stuff, though, we don''t
    go into it.


    Take a deep breath and follow these steps:


    +   1. To change the width of several columns, highlight the columns clicking
    and dragging across them.

    2. To change the column width of the entire table, click anywhere in the table.

    3. Click the Table button on the Property Bar and choose Format or press Ctrl+F12
    to display the Format dialog box.


    The options across the top enable you to specify whether you want to format an
    individual cell, a column, a row, or the entire table.'
