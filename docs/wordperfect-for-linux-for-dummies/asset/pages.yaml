  md: '# 246 Part IV: Creating Documents That Don’t Just Sit There


    To delete the entire table, begin by highlighting all the cells. The quickest
    way is by pressing the Select Table button on the Property Bar. Then, if you press
    the Delete key on your keyboard, the Delete Table dialog box appears. You can
    delete the whole table by clicking on Entire Table. Or, if you prefer (and it''s
    kind of a nice feature), you can delete only the table contents and leave behind
    the table framework by clicking on Table Contents. Other weird options are available,
