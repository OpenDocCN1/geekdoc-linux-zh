    用 `C++` 编写，这使得它通常相当局局性，而你还有其他选项可用。


    特别是，你可以使用 `GIMP`。与 `Photoshop` 不同，`GIMP` 用 `C` 语言编写，使用起来灵活得多。更棒的是，`GIMP` 对处理器的消耗小得多，同时仍让你可以使用多种工具。`Photoshop`
