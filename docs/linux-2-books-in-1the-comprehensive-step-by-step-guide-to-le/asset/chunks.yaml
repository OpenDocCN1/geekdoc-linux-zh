    ## 第 13 章：Nmap 以及检测和利用漏洞 (Chapter 13: Nmap and Detecting and Exploiting Vulnerabilities)


    到此时，你可能非常急于彻底开始使用 Kali Linux。你现在应该已经安装了操作系统，或者正准备这样做。无论如何，阅读本节都可以为你提供价值的信息。在这里你开始看到
    Kali Linux 的真正威力以及它是如何被使用的。你将开始在黑客攻击中学习看到并掌握这种力量，你还应该开始看到网络不受保护或无防御是多么容易。当这种情况发生时，确保你可以发现并修复漏洞是符合利益的。


    Nmap 只是 Linux 提供的许多工具之一，本章特别关注它。Nmap 是强大的，允许你收集和识别实用信息，让你能够检测系统上的所有内容。它主要是一个安全工具，但你应该记住它也可以被用于伤害。现在，是时候进入实际黑客过程的开始了。


    如果你已经安装了 Kali Linux，尽管打开它吧——Nmap 默认包含在系统中。


    ### 什么是 Nmap?


    Nmap 是 network mapper（网络映射器）的缩写——这是一个非常流行的工具，用于发现可用的资源。与 Kali Linux 发行版提供的所有工具一样，它是免费且安全的。当你使用
    Nmap 时，你可以映射网络，让你看到清单并发现开放的端口。它非常容易使用——它会调出一个终端，你可以在其中输入命令和脚本，让你进入系统后可以在系统内做任何你想做的事。


    这个工具能够穿透防火墙和路由器，可以绕过 IP 过滤器，并能够进入系统。虽然它被设计为能够穿过巨大的网络，但也可以在较小规模上使用。它主要用于端口扫描、版本检测、操作系统检测和使用
    ping 扫描（ping sweeps）。它的工作非常简单——它使用 IP 包来寻找网络上的主机以及它们正在运行什么。仅仅通过发现别人的电脑在运行什么，就能获得大量信息。

