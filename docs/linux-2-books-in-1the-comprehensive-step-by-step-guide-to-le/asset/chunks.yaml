    当系统被拒绝时，你就知道你需要安装 `OpenSSH`。在终端仍然开启的情况下，你可能想要运行以下命令：


    ```

    sudo apt-get install openssh-server

    ```


    ii. 你应该再次被提示输入超级用户密码。然后，按下 `Enter` + `Y`，在磁盘空间提示后授予安装权限以继续。随后，它应该会自动安装所有需要的文件。为了测试你是否操作成功，请尝试以下命令：


    ```

    sudo service ssh status

    ```


    如果你已经完成了工作，你应该会在终端内收到回复，告知你它处于激活状态以及已经运行了多久。恭喜你！你已经建立了 SSH 连接！


    # Shell 的类型


    当你使用 Linux 时，你主要会遇到两种类型的 Shell：它们是 Bourne Shell（Bourne shells）和 C 壳（C shells）。每一类
    Shell 涉及略有不同的命令标准，但它们仍然能够完成让你与 Shell 通信以交互并控制计算机的任务。


    总的来说，你将主要使用 Bourne Again SHell，即 `BASH`。然而，熟悉其他可供你使用的几种不同选项以备后用，永远不是一个坏主意。


    ## Bourne shell (sh)


    Bourne shell 是 Unix 一直使用的原始 shell。当你使用 Bourne shell 时看到的提示符是 `$` 符号——这告诉你终端已准备好输入。还有其他几种被认为与
    Bourne shell 相关的 shell 类型，例如 Korn shell 和 `bash`。


    *   `Korn shell (ksh)`：这种 shell 由 David Korn 在 20 世纪 80 年代中期发明。它与 Bourne shell
    几乎完全兼容，这意味着如果你已经在使用 Bourne shell，就可以立即使用这个特定版本。同样，使用 Bourne shell 的设备也可以改用 Korn
    shell，从而实现灵活性。这是一个受欢迎的 shell，归功于它与 Bourne shell 的兼容性，以及它在提供 C shell 的一些实用特性的同时，也包含了自身的优势。它包含了命令行编辑功能，允许人们简单地修改错误，这是
    Bourne shell 完全不提供的功能。此外，`ksh` 利用了作业控制——即同时停止、启动和挂起命令的能力。

    *   `Bourne Again shell (bash)`：这是 Linux 系统附带的 Bourne shell 免费发行版。它与来源的 Bourne
    shell 有许多相似之处，尽管有些人倾向于在使用它时感到困难。幸运的是，有几种替代指南可以供你参考使用它的过程。


    ## C shell (csh)


    与 Bourne shell 被视为其他系列 shell 的定义性 shell 类似，C shell 被视为一个独立的 shell 类别。它的名称来源于它是用
    `C` 语言编写的，并在文本窗口中运行，你可以在其中插入命令，然后这些命令会被读取。它以交互性和风格等特性为特色，这些特性使其更易使用，而且这种语言被认为更容易被尝试使用它的人所理解。特别是，C
    shell 具有几个重要特性，例如它的语法和句法使其易于遵循，并允许进行编辑。与 Bourne shell 不同，C shell 将使用百分号 (`%`)
    符号作为输入提示符。


    *   `TENEX/TOPS C shell (tcsh)`：`tcsh` 是 `csh` 的衍生版本，与 `chs` 完全兼容。它大体就是 `csh`，但添加了一些改进和增强，允许程序有更多用途。特别是，它允许命令行编辑、文件名/命令自动补全等。得益于这些功能，它对于那些对传统
    Unix 命令感到困难的人，甚至对于打字速度慢的人来说都非常棒。由于文件名会尝试在按下 `Tab` 键时自动完成，你可以输入文件名的一半，按下 `Tab`，让程序尝试为你填充。


