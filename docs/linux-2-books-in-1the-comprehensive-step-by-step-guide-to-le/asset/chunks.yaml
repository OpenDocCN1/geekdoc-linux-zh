    ## 操作系统功能


    - **命令解释**：允许对输入计算机的命令进行翻译

    - **通信管理**：允许对软件资源的协调和分配

    - **设备管理**：管理所有设备的使用

    - **文件管理**：管理与文件相关的所有进程和活动，如组织、命名、检索、共享或安全保护

    - **输入/输出管理**：翻译并管理输入和输出

    - **作业统计**：跟踪作业和用户所需的时间及资源

    - **内存管理**：允许对程序在任何时刻所需的内存进行分配和释放

    - **网络**：允许不共享任何内存或硬件的处理器进行资源或数据通信

    - **处理器管理**：帮助操作系统创建和删除进程，促进同步，并允许相互交互的进程之间进行通信

    - **次级存储管理**：确保数据存储在正确的存储中，以便在需要时访问

    - **安全**：保护存储在计算机系统中的数据免受任何恶意软件或未经授权的访问尝试


    ## 操作系统的类型


    由于操作系统功能如此广泛，存在几种不同类型的操作系统并不令人意外，它们都有不同的用途，并各有自己的优缺点。本节将简要概述不同类型的操作系统以及它们最常用的场景。


    - **批处理操作系统**：设计用于运行一组具有相似需求的作业。用户从不与计算机直接交互。相反，作业是离线准备好并提交给计算机操作员处理的。这适用于耗时较长的过程。

    - **多任务/分时操作系统**：这类操作系统允许不同终端（外壳）的人同时使用同一台计算机。CPU 在多个用户之间共享。

    - **实时操作系统**：这些系统具有极低的延迟（输入/输出之间的延迟），允许响应时间几乎是实时的。适用于需要几乎立即做出反应的军事或太空软件系统。

    - **网络操作系统**：此类操作系统运行在服务器上，可以同时从多个位置访问。

    - **分布式操作系统**：网络操作系统的扩展，这种类型利用几台不同机器上的多个处理器，实现高效的计算和处理。

    - **移动操作系统**：这是任何专为移动设备（如智能手机和平板电脑）设计的操作系统。最常用的移动操作系统包括 `Android` 和 `iOS`。


    ##常用的操作系统


    大多数情况下，你购买的任何计算机都会预装好某种操作系统并准备好就绪。这意味着如果你想开箱即用大多数产品，你可以这样做。然而，如果你发现了其他操作系统，你也可以将其升级或更换为另一种。在大多数情况下，操作系统的选择主要是个人喜好问题，尽管某些操作系统具有不同的软件兼容性。


    操作系统之间最显著的区别可能是图形用户界面（`GUI`，读作 "goo"）。`GUI` 是你使用计算机时在显示器上看到的内容，允许你与软件交互，进而与硬件交互。这将你在屏幕上看到的图形和文本的结合。虽然不同操作系统的
    `GUI` 可能不同，但它们都带有相同的基本特性和功能。


    尽管如此，如果你认为某一种操作系统优于另一种，这是一种观点，你选择的应该是最适合你的操作系统。尽管如此，请花时间熟悉你每天会遇到的三个常用操作系统：`Microsoft
    Windows`、`macOS` 和 `Linux`。


    - **Microsoft Windows**：创建于 20 世纪 80 年代，是你遇到的最流行的操作系统。最新的是 `Windows 10`，它于 2015
    年发布。你购买的任何个人电脑（PC）都预装了 `Windows`，最显著例外是苹果产品。它在用户可以的操作方面非常多样，并且不断更新以保持安全。

    - **macOS**：预装在 Macintosh 计算机上，`macOS` 的人气低得多。据估计，全球只有不到 10% 的操作系统在使用 `macOS`。它看起来更精美，但通常只与专有软件和外设兼容。在三个操作系统之间，`macOS`
    运行其全部功能的成本将是最高的。因此，`macOS` 在使用和可定制性方面更具限制性，许多常用程序、游戏和其他软件并不兼容 `macOS`。然而，`macOS`
    倾向于较少被破解，使其可能稍微安全一些。

    - **Linux**：`Linux` 与另外两者有所不同——与专有的 `Windows` 和 `macOS` 不同，`Linux` 是开源的。这意味着它可以被任何人修改，并在全球范围内免费分发。这使得
    `Linux` 成为你遇到的三个主要操作系统中限制最少的，但它在全球使用的操作系统中占比不到 2%。尽管有这一数据，得益于多功能和可定制性，大多数服务器将使用
    `Linux`。


    ## 作为操作系统的 Linux


    那么，`Linux` 是一个开源操作系统——这意味着它可以很容易进行定制和修改。开源操作系统可以免费运行、免费修改和免费分发，无论你是否对其进行过修改。这意味着，世界上有很多不同的
    `Linux` 发行版，因为每个进行过更改或为自己定制过版本的人都可以免费分发自己的版本。然而，这些发行版将在第 2 章中详细讨论。


    `Linux` 可以安装在各种硬件上，允许软件开发和应用程序运行。该操作系统是用 `C` 语言语言开发的，今天 `C` 仍然是使用的主要的语言。`Linux`
    最初设计得类似于 `UNIX`（将在下一个小节中讨论），它的演变已远超其初始范围。它现在被用于从手机到超级计算机及其之间的一切设备。当你使用 `Linux`
    作为操作系统时，你正在利用 `Linux kernel` 来管理硬件，然后从该内核开始，通过软件开发操作系统的其余部分。


    当你听到 `Linux` 时想到的操作系统实际上是几个不同部分的组合。这些部分共同工作，以允许编写的软件能够运行。这些核心部分是 `bootloader`（引导程序）、`kernel`（内核）、`init
    system`（初始化系统）、`daemons`（守护进程）、`graphical server`（图形服务器）、`desktop environment`（桌面环境）以及你安装的应用程序。这些部分承担着各种功能，对于你实际上运行操作系统的能力至关重要。


    - **Bootloader**：这是启动计算机的软件——这意味着它会触发操作系统开始运行。大多数情况下，会显示一个快速启动界面，让你知道操作系统正在启动。一旦操作系统准备好运行，启动界面就会消失，这个时间在很大程度上取决于运行它的硬件。有不同的引导程序，例如
    `LILO`（Linux Loader）、`LOADLIN`（Load Linux）或 `GRUB`（Grand Unified Bootloader）。


    '
- fmt: '

    - **Kernel**: This is where the actual name “Linux” came from. The Linux Kernel
    acts as the heart of the OS, allowing for the management of and interaction with
    the CPU, RAM, and all peripheral devices that are being used. It is the foundation
    for the rest of the OS, and without this kernel, you cannot run the device.

    - **Init system**: This allows for the bootstrap, or activation, of the user space.
    Most often, you will see `systemd` as the init system.

    - **Daemons**: These run several different background services that typically
    start on their own during the booting process or after you have logged onto the
    desktop. Think of daemons as background processes, and most often, you will see
    them in code with a “d” at the end, such as `httpd` as the web server daemon.

    - **Graphical user interface (GUI)**: This is a sub-system responsible for translating
    the computer data into the graphics displayed on your monitor of choice. A regularly
    used GUI in Linux is the `X Window System`, more commonly known as `X`.

    - **Desktop environment**: This is the part of the graphics that you are actually
    able to interact with. There are several that are readily available depending
    on your own preference, with some of the more common ones being `GNOME`, `Cinnamon`,
    `MATE`, `Unity`, etc.

    - **Applications**: These are just like applications on your phone. This is any
    sort of program or software downloaded to serve a specific purpose. There is nearly
    an endless supply of different applications that can be downloaded and utilized
    with Linux, including many that are readily available on the other operating systems
    as well, such as `GIMP` for image editing, `Discord` for chatting, `Thunderbird`
    for emails, and more.


    Chapter 8 will give you a rundown of several alternatives to common windows applications
    for more examples of common Linux apps available to you.

    '
