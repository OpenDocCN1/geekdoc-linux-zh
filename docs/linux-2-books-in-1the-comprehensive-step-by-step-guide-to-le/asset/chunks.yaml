    # 1. What is the sign that the terminal is ready for your input when using bash?


    1. `!`

    2. `@`

    3. `$`

    4. `%`


    # 2. What does “x” stand for in permissions?


    1. Exit

    2. Expel

    3. Expedite

    4. Execute

    5. Excel


    # 3. Are uppercase letters acceptable to use?


    1. Yes, the computer reads them all the same.

    2. No, the computer differentiates between the two and will not read an `x` as
    the same as `X`

    3. Sometimes


    # 4. True or false: When you are programming, the order of words and commands
    does not matter.


    # 5. True or false: If you are looking for a specific file, you will have to search
    manually.


    ## Chapter 5 Answer Key


    1. **C**: bash uses `$` to communicate that it is ready to receive input. `csh`
    uses `%`.

    2. **D**: `x` stands for the ability a user or group has to run or execute the
    program or file.

    3. **B**: While computers may be able to differentiate and translate now, the
