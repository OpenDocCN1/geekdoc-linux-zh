    - **内核 (Kernel)**: 这是“Linux”实际名称的来源。Linux 内核是操作系统的核心，允许管理并与 CPU、内存以及所有使用的外围设备交互。它是操作系统其余的基础，没有这个内核，你就无法运行该设备。

    - **初始化系统 (Init system)**: 这允许用户空间的自引导（或激活）。通常情况下，你会看到 `systemd` 作为初始化系统。

    - **守护进程 (Daemons)**: 这些进程运行多个不同的后台服务，这些服务通常在启动过程中或你登录桌面后自动启动。将守护进程想象成后台进程，你通常会在代码中看到以“d”结尾的名称，例如作为
    Web 服务器守护进程的 `httpd`。

    - **图形用户界面 (GUI)**: 这是一个负责将计算机数据翻译为在你所选显示器上显示的图形的子系统。Linux 中常用的 GUI 是 `X Window
    System`，更广为人知的 `X`。

    - **桌面环境 (Desktop environment)**: 这是你实际上能够交互的图形部分。根据你的喜好，有多种可用选择，其中一些常见的包括 `GNOME`、`Cinnamon`、`MATE`、`Unity`
    等。

    - **应用程序 (Applications)**: 这些就像你手机上的应用程序一样。它是任何下载用于实现特定目的的程序或软件。Linux 可以下载并使用的不同应用程序几乎无穷，包括许多在其他操作系统中也可以使用的程序，例如用于图像编辑的
    `GIMP`、用于聊天的 `Discord`、用于电子邮件的 `Thunderbird` 等。


    第 8 章将为你介绍几种常用 Windows 应用程序的替代方案，以提供更多你可用的常用 Linux 应用程序示例。


