    - `Command shell payloads`: 它们允许人员针对不同的目标或主机运行脚本或命令

    - `Dynamic payloads`: 它们允许测试人员在尝试规避任何杀毒软件时，创建独特的有效载荷

    - `Meterpreter payloads`: 它们允许接管设备监器以夺取其他会话

    - `Static payloads`: 它们允许进行端口转发并在网络之间进行通信。


    # Metasploit 模块


    Metasploit 包含了多个模块。这些是核心组件——即被预期执行非常特定操作的软件。它们也代表了你可以在 Metasploit 框架内可以实现的操作。这些模块很容易找到：你只需要找到以下路径即可：`/path/to/metasploit/apps/pro/msf3/modules`


    模块类型将根据特定模块的用途以及该模块所负责的操作来确定。特别有八种值得讨论。它们包括：


    - `Exploits`: 漏洞模块设计用于执行一系列命令，然后针对目标系统或应用程序中发现的漏洞。该模块设计用于利用任何漏洞，以获得对任何目标系统的访问权限。漏洞模块有多种不同的示例，例如代码注入和
    Web 应用程序漏洞。

    - `Payloads`: 有效载荷是指在漏洞成功攻破当前系统后运行的 shell 码。有效载荷允许你准确决定想要如何连接到 shell，以及在夺取控制权后想要对目标执行什么操作。它可能涉及打开一个
    meterpreter 或不同的命令 shell。`Meterpreter` 是一种特殊的高级类型有效载荷，允许写入 `DLL` 文件，以便根据需要创建新功能。

    - `Encoders`: 编码器是能够将一种形式的代码转换为另一种形式的关键工具。

    - `Listeners`: 设计用于隐藏并进行侦听的恶意软件。当它们能够侦听时，它们能够收集各种重要信息，导致敏感信息（如密码、社会安全号码或其他人们极度希望保持私密的信息）泄露。

    - `Auxiliary function`: 用于补充设备其他功能的工具和命令。

    - `Shellcode`: 编写为进入目标后立即激活的代码以实现特定目的，从而提供一种更隐蔽的进入和激活方式。

    - `NOP generator`: 能够产生一系列随机字节的工具，旨在绕过任何标准 IDS 以通过防火墙或重要的拦截点。

    - `Post-exploitation code`: 后渗透模块允许你在被利用的目标内获取更多信息或设法获取进一步的访问权限。这些包括哈希转储（hash
    dumps）或服务枚举器。


