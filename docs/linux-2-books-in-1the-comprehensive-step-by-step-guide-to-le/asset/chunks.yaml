- fmt: "\nCentOSReleased in 2003, this is a community project that endeavored to rebuild\
    \ source code for Red Hat Enterprise Linux into something that could be readily\
    \ installed with regular security updates for everything included. Effectively,\
    \ this makes CentOS a clone of Red Hat Enterprise Linux (RHEL), with the one difference\
    \ between them being branding. Despite the fact that CentOS is a clone, there\
    \ does not seem to be any real conflict between the two.\n\nCentOS is deemed to\
    \ be reliable as a server distribution—thanks to the utilization of the stable\
    \ Linux kernel and software packages of RHEL. It has been deemed to be a reliable\
    \ and free alternative to other server products that are available today, especially\
    \ for those who are already quite experienced with Linux as a whole. These people\
    \ find little difficulty in administrating the distribution.\n\nCentOS is also\
    \ usable for enterprise desktops as well—if you need something stable and reliable,\
    \ with a preference for the support over cutting-edge software, this is the OS\
    \ for you. Of course, if you do care about up-to-date and cutting-edge software,\
    \ you may prefer to look elsewhere, as the updates to CentOS are a bit spaced\
    \ out compared to some of the other options on the market.\n\n### Difficulty rating\n\
    Beginners with some experience\n\n### Long-term support\nRegular updates are rolled\
    \ out every 9-12 months, and new releases come out every 2-3 years\n\n### Pros\n\
    * Brings stability and reliability to the table\n* Free software\n* 7+ years of\
    \ security updates\n* Well-tested\n\n### Cons\n* Does not utilize the most up-to-date\
    \ technology\n* Releases and updates do not always live up to their promises\n\
    \n## Chapter 2 Quiz\nCongratulations! You have made it through Chapter 2. Do you\
    \ have an idea of which distribution you would like to try at this point? Try\
    \ to answer these questions to ensure you understand the fundamental information\
    \ before moving on to Chapter 3. The answer key will be on the page directly after\
    \ this quiz.\n\n1. What is a Linux distribution?\n    1. A book that tells you\
    \ how to install Linux\n    2. A specific operating system programmed around the\
    \ Linux kernel\n    3. The newest Linux hardware\n    4. All of the above\n  \
    \  5. None of the above\n\n2. True or false: All Linux distributions are constantly\
    \ changing\n\n3. When choosing the distribution that is right for you, which features\
    \ should you consider?\n    1. User-friendliness and your own competency\n   \
    \ 2. How well it serves your own needs\n    3. The built in software\n    4. Whether\
    \ you like the mascot\n    5. a, b, and c\n    6. a, b, and d\n\n4. True or false:\
    \ Gentoo is great for beginners\n\n5. True or false: Ubuntu is great for beginners\n\
    \n## Chapter 2 Answer Key\n1. B: The distribution refers to the specific operating\
    \ system program that you are using\n2. False: Several distributions, such as\
    \ `Slackware`, do not change much or have not changed in years.\n3. E: While liking\
    \ the mascot may be nice, it does not determine how well a program may meet your\
    \ needs\n4. False: Gentoo requires nearly constant programming to get it functioning\
    \ at all.\n5. True: Ubuntu is incredibly easy to get started with and is designed\
    \ to be user-friendly.\n"
