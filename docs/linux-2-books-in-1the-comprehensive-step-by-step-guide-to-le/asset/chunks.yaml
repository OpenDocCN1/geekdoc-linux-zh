  trans: "\n\n## 第 2 步：进入 Live USB \n现在，你的首要任务是进入 Live USB 启动。大多数计算机默认设置为从硬盘启动，因此在它进行必要的更改之前，你需要对默认启动顺序进行一些调整。这个过程并没有像听起来那么令恐畏——你只需要重启电脑，进入启动菜单，并选择你希望计算机从哪个源启动的设备。\n\
    \n有时候情况下，启动菜单是隐藏的，但仍然可以访问。在这种情况下，你需要访问 `BIOS` 菜单以获取启动菜单的权限，这可以在启动界面（splash screen）完成。加载\
    \ `BIOS` 菜单所需的命令应该显示在启动界面底部的一个角里。\n\n1. 重启电脑\n2. 当电脑重启时，按下按键触发启动菜单。你应该在启动界面的角上看到所需的按键——即在初始启动期间显示厂商标志的屏幕。访问启动菜单的常用键有\
    \ `F12` 或 `Del`。\n    - 如果你正在使用 `Windows 8`，尝试在点击重启时按住 `Shift` 键。这将触发计算机带有“高级启动选项”启动，允许你做出决定。\n\
    3. 进入启动菜单后，选择你用于加载 Linux 的 Live USB 或 `CD`。一旦选择了你的方法，保存并退出启动菜单或 `BIOS`。你的机器将按照你所选的设置继续启动过程。\n\
    \n## 第 3 步：在安装之前尝试 Linux（可选）\n尝试你正在安装的 Linux 版本是可选的，但如果你还不熟悉 Linux，或者不确定应该安装哪个版本，则强烈建议这么做。你的\
    \ Live USB 应该允许你启动所谓的“实盘环境”（live environment），允许你将在进行任何更改之前对其进行测试。虽然在这个阶段你将无法创建文件，但你可以自由地浏览系统并体验界面，以便在花费时间进行安装和格式化之前做出明智的决定。\n\
    \n## 第 4 步：开始安装\n安装过程本身非常简单。从启动菜单中，你会有“安装”而不是“启动”的选项。此时，你的机器将处理大部分工作，但你将会被提示配置基本选项，例如你将在\
    \ `OS` 中使用的语言、键盘布局以及你所在的时区。\n\n## 第 5 步：创建用户\n此时，你将会被提示为你的 `OS` 创建登录信息。你需要输入你的姓名、计算机名称、你为此实例选择的用户名，以及用于登录的密码，并确认你有权执行任何管理任务。\n\
    \n## 第 6 步：创建分区（可选）\n如果 Linux 是你的主 `OS`，你可以跳过此步骤。然而，如果你在你的机器上运行多个操作系统，你将需要专门为你的\
    \ Linux 版本划分出一个分区。分区是按照特定 `OS` 要求的方式进行格式化的部分，允许 `OS` 按照预期方式运行。\n\n一些更对初学者友好的发行版（例如\
    \ `Ubuntu`）将自动为你格式化分区，尽管你可以手动调整大小。请记住，大多数安装至少需要 `20 GB`，因此你必须确保无论设置了哪个分区，都能容纳\
    \ `OS` 以及任何可能存储在其中的其他文件和程序。有时，安装过程将不会自动配置自动分区，每当这种情况发生时，你必须确保该分区的格式为 `Ext4`。\n\
    \n## 第 7 步：启动 Linux\n当安装完成后，它会自动提示你重启。启动后，你将看到一个不同的屏幕。这将调出引导加载程序，它会提示你选择正在安装的发行版。你可能会遇到的引导加载程序之一是\
    \ `GNU GRUB`。当然，如果你选择跳过分区阶段并将你的 Linux 发行版作为唯一的 `OS`，你可能不会自动看到此屏幕。与之前一样，你可以在厂商启动界面加载后立即按下\
    \ `Shift` 键触发引导加载程序。\n\n## 第 8 步：检查硬件\n虽然大多数硬件在安装后立即应该是正常的，但你可能会发现正在使用的某些硬件需要你下载一些驱动程序。特别是显卡以需要额外驱动而闻名。你通常可以找到某种开源驱动来完成任务，但如果你想真正优化你的\
    \ `GPU`，你需要从制造商处获取正确的驱动程序。\n\n## 第 9 步：使用 Linux\n此时，你的安装应该已经完成，硬件也应该正常工作。此时，你已经准备好开始使用你的新\
    \ `OS` 了。你可以选择下载程序来优化你对程序的使用，或者你可以直接开始使用它。\n\n## 在 Windows 10 虚拟机上安装 Linux\n有时，你用于安装\
    \ Linux 的方法将利用虚拟机。特别是，你可能选择使用虚拟机对软件进行沙箱处理，以便在进行任何更改之前对其进行测试。在 Windows 10 上使用虚拟机运行\
    \ Linux 并不困难。\n\n### 第 1 步：安装虚拟机\n首先，你需要确保已经安装了虚拟机。通过在 Windows 的“启用或关闭 Windows\
    \ 功能”中搜索“Hyper-V”来实现。你应该看到复选框，勾选它们。启用后，你需要重启电脑。如果你没有 Hyper-V，寻找另一个你喜欢的虚拟机程序。一个免费的选择是\
    \ `Oracle VM VirtualBox`。\n\n### 第 2 步：设置虚拟机\n启动 VirtualBox 后，你将看到一个空白菜单。从那里，你需要点击窗口顶部的\
    \ `NEW` 图标。你将为 `VM` 命名，然后选择你将使用的种种 `OS`。\n2. 接下来，你需要为 `VM` 分配内存，为其提供必要的资源。通常，最好的办法采用推荐的数量并点击下一步。\n\
    3. 下一个提示将询问你是否要添加虚拟驱动器。同意，点击 `Create`，并在列表中选择 `VDI`。`VDI` 代表虚拟磁盘映像。在下一页选择 `Fixed\
    \ Size`（固定大小）。最后，你会被要求命名正在使用的驱动器并确认大小。\n4. 点击 `create`，虚拟驱动器已创建。\n\n"
- fmt: "\n### Step 3: Installing the OS\nAt this point, it is time to install your\
    \ chosen distribution of Linux. Within the `VirtualBox` window, select the Start\
    \ arrow. It should open up a window that will be titled Select start-up disk.\
    \ Click the folder on the right, next to the drop-down menu, and here, you can\
    \ select the ISO file for your distribution. From there, all you do is click Start,\
    \ and the OS should be installed.\n\n### Step 4: Shutting down the virtual machine\n\
    When you get to the point where you are done with the machine, resist the urge\
    \ to just click out of the window. Instead, click on the `File` menu and select\
    \ the option to close while selecting ‘Save the machine state.’ This ensures that\
    \ you will keep the information within the virtual machine.\n\n### Installing\
    \ Linux on Virtual Machines on macOS High Sierra\nAt the time of writing this\
    \ book, the current `macOS` is High Sierra. Installing Linux through a virtual\
    \ machine on High Sierra is largely similar to how you would go through the process\
    \ on Windows. Considering, at this point, you have been guided through the most\
    \ difficult processes, this will be the shortest guide of them all. All you will\
    \ be doing that is new within this chapter is installing `VirtualBox` on the `macOS`.\
    \ From there, you can follow the steps detailed in the previous subchapter.\n\n\
    #### Step 1: Run VirtualBox\n1. Start by running the `VirtualBox` installer. You\
    \ may see a warning that that `macOS` does not allow unsecure system extensions.\
    \ Just click ‘Next’ and keep going.\n2. At the end of the installation, it will\
    \ fail. Don’t worry about the failure; just keep following this tutorial.\n3.\
    \ Go to `System Preferences` > `Security & Privacy`. At the bottom, there should\
    \ be a prompt that says that the system software was blocked. At the bottom left\
    \ corner of the window, click on the lock. It will ask you to put in your password.\
    \ Do so and then click ‘Allow’ next to the message telling you that the program\
    \ was blocked from loading.\n4. Reload the `VirtualBox` installer. It should go\
    \ through this time.\n\nAt this point, the process is largely the same as opening\
    \ a VM in Windows. The only differing point between the two was the installation\
    \ process.\n\n### Chapter 3 Quiz\nCongratulations! You have made it through Chapter\
    \ 3. At this point, you should be prepared to load up Linux on your own devices.\
    \ Try to answer these questions to ensure you understand the basics before moving\
    \ on to Chapter 4. The answer key will be on the page directly after this quiz.\n\
    \n1. Which tools are necessary to install Linux (either on hardware or on a virtual\
    \ machine)?\n   1. ISO file\n   2. USB drive\n   3. `Virtualbox`\n   4. A and\
    \ C\n   5. All of the above\n   6. None of the above\n2. What is necessary to\
    \ run several operating systems on the same system?\n   1. `Virtualbox`\n   2.\
    \ A USB drive\n   3. A partition in the hard drive\n   4. A computer with two\
    \ hard drives\n   5. All of the above\n   6. None of the above\n3. What is a virtual\
    \ machine?\n   1. A computer capable of running operating systems within operating\
    \ systems at the same time\n   2. A way to keep an OS partitioned away from the\
    \ other parts of the computer’s OS\n   3. A method that can be used to test software\n\
    \   4. All of the above\n   5. None of the above\n4. True or false: You need a\
    \ virtual machine if you want to run Linux\n5. True or false: the USB drive that\
    \ you will load the ISO onto will be ready out of the box\n\n### Chapter 3 Answer\
    \ Key\n1. **A**: The only listed component that is necessary to run Linux is the\
    \ ISO file that is used to distribute the OS. The USB drive can be bypassed when\
    \ installing on a virtual machine, and `Virtualbox` can be bypassed when installing\
    \ on hardware with a USB.\n2. **C**: The only necessary component listed is the\
    \ partitions between operating systems. `Virtualbox` is one specific virtual machine,\
    \ but there are several that will work in its place, the USB drive is not necessary,\
    \ and you do not have to have two hard drives—the whole point of the virtual machine\
    \ is to partition a single hard drive to accommodate several operating systems.\n\
    3. **D**\n4. **False**: You can install Linux onto the hardware, bypassing the\
    \ need for a virtual machine.\n5. **False**: You must format the USB drive to\
    \ be ready to accommodate the ISO.\n\n### Chapter 4: Linux Shell\nWith Linux freshly\
    \ installed, it is time to begin interacting with your new OS. This is primarily\
    \ done through what is known as a shell. The shell allows you to interact with\
    \ the operating system, which at this point, you should understand is crucial\
    \ for the functioning of your computer. Your operating system consists of several\
    \ layers: at one end, you have the kernel, which is how the OS interacts with\
    \ the hardware of the computer, and on the other end of the process, you have\
    \ the shell, which the user interacts with.\n\n![](OEBPS/rsrc38H.jpg)\n\nStop\
    \ and consider this graphic for a moment: Note how the hardware is at heart. From\
    \ there, you have the kernel that surrounds the hardware, and the shell that engulfs\
    \ the kernel. This allows you to sort of see the hierarchy—you cannot access the\
    \ innermost levels without first going through the external levels.\n\nWithin\
    \ this chapter, you will learn what the shell is as a system, as well as what\
    \ its primary functions are. You will learn how to access the shell through the\
    \ terminal. You will be guided through shell scripting, as well as be provided\
    \ with basic command line editing that you need to know in order to interact with\
    \ the shell. Lastly, you will be walked through the types of shells available.\n\
    \n#### What is Shell?\nComputers primarily operate on binary—this is the usage\
    \ of 1s and 0s to represent whether a switch is on or off. However, if you were\
    \ asked to put your input into your system via binary, you would find yourself\
    \ spending far longer than necessary trying to translate. This is where the shell\
    \ comes in. Thanks to the shell, you do not have to master binary. The shell acts\
    \ as the translator between human-friendly commands written in English and then\
    \ translates them into something usable by the kernel. In translating everything\
    \ for the kernel, you are free to memorize commands that are far and more manageable.\
    \ Overall, the shell has several key features, such as:\n\n* It is a user program:\
    \ It is an environment that is designed to accommodate human interactions.\n*\
    \ It is a command language interpreter (`CLI`): It receives and executes a command\
    \ from standard input, such as a keyboard, without the need for the memorization\
    \ and translation of difficult program languages such as binary.\n* It is automatic:\
    \ As soon as you open a terminal, the shell will begin functioning.\n* It works\
    \ with the kernel: Though it is not a part of the kernel, it does work in tandem\
    \ with the kernel in order to allow for the execution of programs, creation of\
    \ files, or completion of any necessary commands.\n* It is versatile: There are\
    \ several different shells available for Linux, which will complete the same job,\
    \ though they use different syntax and have varying built-in functions.\n\n####\
    \ Gaining Access to the Shell\nWhen you are interacting with a shell, there are\
    \ several different methods through which you can use. The most common accesses\
    \ to the Shell include the terminal and a secure shell connection. These will\
    \ come with varying degrees of permissions and abilities. Most commonly, you will\
    \ find that you are interacting with `Bash`, though sometimes, you may encounter\
    \ other forms. Nevertheless, understanding how to access the shell is necessary.\n\
    \n#### Installing Bash on Windows\nThis section will require you to install `Bash`\
    \ through the Git for Windows installer. It is providing straightforward instructions\
    \ to you that may not seem particularly informative until you have the screen\
    \ in front of you. Nevertheless, return to this section when you are ready to\
    \ install `Bash` if you want the quickest way to do so.\n"
