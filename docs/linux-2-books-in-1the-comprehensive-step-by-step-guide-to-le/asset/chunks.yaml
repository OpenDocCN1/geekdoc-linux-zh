    # How to Use Nmap to Understand and Exploit Vulnerabilities


    When you are ready to use Nmap, you have several different options. You will be
    able to scan one target, limited targets, or several targets, all based on the
    command that you are able to submit. The target determines exactly how you would
    go through the process of using this system, but ultimately, doing so will take
    some time.


    ## Scanning Commands


    Perhaps the most basic usage of Nmap is through scanning. When you want to scan,
    you have several different options. You can choose what you wish to target, whether
    it is one individual, several individuals, or an entire directory. Imagine for
    a moment that you want to scan a single unit or system. You would do so with the
    following command, changing the IP addresses accordingly.


    ```

    nmap target

    # nmap target.com

    # nmap 192.143.1.1

    ```

    This will scan that one specific system. If you wish to scan all associated subnets
    to that system, your command will change slightly. It would instead be:


    ```

    nmap target/cdir

    # nmap 192.143.1.1/24

    ```

    And if instead, you wanted to scan several different targets instead, you would
    simply label them and separate the IP addresses with spaces. For example, maybe
    you would write:


    ```

    nmap target target1 target2

    # nmap 192.143.1.1 192.141.1.2

    ```

    You even have the option to scan only several IP addresses in a row without scanning
    the entire subnet. When you wish to scan 50 of the associated IP addresses but
    not the entire subnet, you will use the following command:


    ```

    nmap target-50

    # nmap 192.143.1.1-50

    ```

    This would then lead to the scanning of every IP address from `192.143.1.1` to
    `192.143.1.50` all in one go. You may also decide that what you need is a list
    of several hosts that are being scanned—in this case, you want to add the proper
    parameter. In this case, that parameter would be `-sL`, which would create the
    command prompt of:


    ```

    nmap -sL target/cdir

    # nmap -sL 192.143.1.1/24

    ```

    Sometimes, however, you may want to scan the entire subnet, but you also know
    that you need to leave a section of that subnet entirely unscanned in order to
    avoid detection. Especially if you have the single IP address that you must avoid,
    you can then create your code with a parameter meant to exclude that one IP address.
    This is quite simple. All you need to do is add in the `-exclude` parameter like
    so:


    ```

    # nmap 192.143.1.1/24 -exclude 192.143.1.13

    ```

    You can even enter a single file that contains all excluded IP addresses if you
    have one, inserting the file name within the exclusion instead. Your scanning
    can even get more specific as well—you can start to specify exactly which ports
    are to be targeted if you have the right codes as well.


    ## Scanning Techniques and Commands


    Of course, there are other types of scans that you can perform as well. Nmap has
    several different scanning techniques available that will be necessary for you
    to know to be effective. This section will provide you with the information you
    will need to use several other scan types as well.


    ### TCP SYN Scan

    Commanded with the prompt `-sS` the TCP SYN scan is a basic scan. It is commonly
    referred to as half-opening because it gathers information from the remote host
    without finishing the TCP process that was discussed earlier in this book. In
    this sort of scan, Nmap seeds out an SYN packet to the right destination but never
    bothers to actually create or trigger a session. In the end, the interaction never
    gets logged by the target computer because the computer never initiated a session.
    This is what makes TCP SYN scanning so beneficial. This is used by default, though
    you will need root access. Of course, if you are using Kali Linux as you do this,
    there will be no problem, as you will be in the root account by default. A command
    for this sort of scan looks like:


    ```

    # nmap -sS 192.143.1.1

    ```


    ### TCP Connect() Scan

    When the SYN scan cannot happen for any reason, this will be the default scan
    that is used. With the code of `-sT` in order to utilize this scan, your system
    will instead complete the TCP handshake process, requiring the other system to
    log the transaction. This is only good for finding TCP ports rather than any others.
    To use this code, you would have a command such as:


    ```

    # nmap -sT 192.143.1.1

    ```


    ### UDP Scan

    This scan seeks out open UDP ports in whatever the targeted machine is. It does
    not make use of an SYN packet due to the targeting of a UDP port instead. However,
    you are still able to make this more efficient if you use the `-sS` and `-sU`
    commands together. In using this scanning method, Nmap sends out a UDP packet
    and waits for some sort of response. An error message implies that the port is
    closed, but a proper response will let you know that the port is actually open
    and accessible. In this case, you will use the following command:


    ```

    # nmap -sU 192.143.1.1

    ```


    ### FIN Scan

    Sometimes a TCP SYN scan would not necessarily be the right choice based on the
    parameters that you have been provided. Usually, a firewall will cause a block
    from the SYN packets, so you will need to go through another method. When this
    happens, you can try to make use of a FIN scan—this only sends a FIN flag, meaning
    it does not require the completion of the TCP transaction that would otherwise
    trigger the detection of Nmap. The proper command for a FIN scan is `-sF` such
    as:


    ```

    # nmap –sF 192.143.1.1

    ```

    Which then brings back plenty of information—it should provide whether the host
    is up or down, what the latency is, and the state of the port. The target does
    not log this scan, but you are able to get the information.


    ### Ping Scan

    Unlike the other forms that have been discussed thus far, ping scanning is only
    used to determine if the host is currently alive or active. It does not discover
    whether a port is open. It does require root access, as there is the potential
    to send out ICMP packets. When there is no root access granted, it will complete
    the command using `connect()` call. The command for a ping scan is `-sP` and it
    would be used:


    ```

    # nmap -sP 192.143.1.1

    ```


    ### Version Detection

    This is the command you need if you want to determine what kind of software is
    being used on the target computer or any ports. It does not detect any open ports,
    though it does need to get the information from any open ports in order to provide
    the information on the software that has been detected. The first step here would
    be to find a port that is open with a TCP SYN scan and then direct the `-sV` to
    the specific port available.


    ```

    # nmap –sV 192.143.1.1

    ```


    ### Idle Scanning

    In an idle scan, you are able to maintain your invisibility while scanning. In
    this particular technique, you do not send out any real packets from your own
    IP address. Instead, it takes a host from within the target network in order to
    send out packets. This will require you to first figure out an open port within
    the IP and then uses a zombie host in order to communicate with the target. In
    this code, you will use first the IP of the zombie host and then the IP of the
    target in order to create a command of:


    ```

    # nmap -sI 192.143.1.4 192.143.1.1

    ```

    In this instance, the zombie host of `192.143.1.4` is being used to communicate
    with `192.143.1.1` without detection since they are a part of the same network.


    ## Penetration Testing


    Ultimately, penetration testing can be broken down into seven steps or phases—when
    you are able to get through these phases, you are more likely to find some sort
    of weakness. In utilizing these phases, you will find that your own ability grows
    which means that you are more likely to identify any of those weaknesses. The
    phases of penetration testing are pre-engagement, reconnaissance, threat modeling,
    exploiting, post-exploitation, report, and re-test.


    ### Pre-Engagement

    This particular step is more like a precaution, but it is crucial—when you are
    in pre-engagement stage, you need to begin by figuring out the scope. Essentially,
    you are looking for the exact goals of your test. You need to make sure that you
    know what is expected and what is not allowed to do. If you are trying to hack
    into someone’s network, you need to cover yourself legally. Because penetration
    testing is dangerous, and by virtue of it, you need to make sure that you are
    working within your terms and to stay safe if something goes catastrophically.


    ### Reconnaissance

    At this stage, you are going to work on gathering information. While you may prefer
    to skip over if you can get away with it, you are going to be more prepared if
    you do. You need to know exactly what worked and what did not. When you have the
    information you need lined up neatly, you may want to gather as much information
    as possibly can and then move on to step 3.


    ### Threat Modeling and Identifying Vulnerabilities

    Step 3 is still all about planning—at this point, you want to take all of the
    information you have gathered in the previous steps and begin brainstorming what
    the most realistic threats that the network would face would be. This stage can
    also utilize a vulnerability scanner to find any weaknesses that are currently
    present. This is often done with tools like Kali Linux, and you need to make sure
    that you are safe from being blocked.


    ### Exploitation

    At this point, it is time to begin attempting to access the network. You should
    have several different locations that you could use to attack the system and it
    is time to make those moves. Have you found any weaknesses that can be used to
    access? You may try to start a shell, or try to get some sort of credential assigned
    to you so you can access as root user instead. This stage will be largely dependent
    upon the network that you are attempting to break through, and you will need to
    be creative.


    ### Post-Exploitation

    Next comes the post-exploitation phase. At this point, you will have finished
    testing, either due to running out of time or reaching the end of your ability
    to exploit or out of the system. At this point, you must make a list of all vulnerabilities
    and provide them to the client. As you have gone through, you should have made
    notes, or potentially screenshots, of anything that did or did not work. You should
    be able to figure out how significant the exploit you have done is—did you get
    into the main server or did you get stuck at a computer with little access to
    the server? How valuable was the information that you got from the system, if
    any? How at risk is the system itself?


    Beyond that, you should also be thinking of how to fix any vulnerabilities that
    were discovered. Can you think of an easy patch to solve the problem? Is there
    something else that you can do to ensure that the network is more secure? What
    can the network do better? What worked well? Beyond that, you should also make
    sure that you clean up as well. You need to remove anything that was planted within
    the system and change back any and all settings to what they used to be. You want
    to make sure that everything you have exploited is removed.


    ### Reporting

    At this stage, it is time to come up with your report. It may not be fun, but
    if you have gone through the penetration testing in order to help someone, you
    need to make sure that your report is written up nice neatly. This is where you
    are able to convey any weaknesses and vulnerabilities that will put the client
    at risk. You will make sure that you are able to tell them which exploits happened
    and how they should be fixed. This stage should be as brutally honest as possible—you
    want the other party to know exactly what happened and how to fix it. If their
    system is truly that vulnerable to exploitation and you were able to get access
    to everything, let it loose. Tell them in unbiased but honest terms exactly how
    things went wrong. This is where they are also given an example plan of action
    to make sure that everything gets patched up. The clearer you make this stage
    for the client, the better you will be at your job and the more likely it will
    be that your client is able to avoid problems.


    ### Retesting

    This is not a stage that everyone is willing to go through as testers, but it
    is an important one if you want to do a thorough job. During this stage, you will
    re-evaluate your attempts to see if the vulnerabilities have been fixed in order
    to repair them. You need to make sure that you are protected.


    # Chapter 14: How to Become and Remain Anonymous


    Anonymity is crucial if you hope to be a hacker, no matter the kind. If you are
    not careful, it becomes incredibly easy to have your IP address exposed and no
    longer have that access. However, it does not have to be the way. If you are trying
    to hack, you can instead cover your tracks. Just as many burglars will wear gloves
    in order to hide their fingerprints from the system, you can use tools to help
    you remain anonymous. There are several methods that would be able to help, which
    is discussed within this chapter. The methods are proxy servers, VPNs, and the
    use of TOR.


    ## Proxychains


    One of the simplest methods to obscure your IP address is through the use of a
    proxy server. Through using chains of proxies, you are able to obscure your tracks,
    making them harder to follow. When you use a proxy, of course, it is logging your
    information. However, you can get around this as well—you can chain several proxies
    together so long as at least one proxy is able to be outside of the jurisdiction.


    Luckily, within Kali, you have access to a tool known as Proxychains. This can
    be found within the `/usr/bin` directory. When you are using Proxychains, you
    will use a very straightforward command:


    ```

    proxychains [command] [arguments]

    ```

    Now, imagine that you wanted to use this with Nmap to scan anonymously and through
    a proxy. Perhaps in particular, you want to use a SYN scan on IP address `192.143.1.1`
    but you want to do so through a proxy.


    ```bash

    proxychains nmap -sS 192.143.1.1

    ```

    This then triggers you to do a SYN scan on it through a proxy. With the syntax
    understood, you are able to move on to completing the config file. As with anything
    else within Linux, there are simple text files known as config files that hold
    all information. Open the config file into your text editor, such as `ged` or
    `leafpad`. You will then look at the `chains` line—you can see that it is commented
    out. This means it will not be used at this moment. If you erase the comment mark,
    it should activate when the process is run. You can also find `chaining` well
    within your file. You can re-add the `#` to comment out the `chains` line and
    instead remove the `#` from the `chaining` option. You can only use one or the
    other of these options at given time, so you will have to go back and remove one
    if you wish to use the other.


    ## VPN


    Another layer of security that you can add to your system is through adding a
    VPN on top of use of proxy addresses. This is common practice—it allows for further
    protection from piracy or other issues. It also allows people to bypass, for example,
    any particular activities that may be illegal within a country. Even just scanning
    the network can be enough to lead to it being considered illegal, even though
    you may not have done anything with it. This is common in countries.


    Now, since you are currently reading about how best to do exactly that, you are
    going to find that the extra security is crucial to protecting yourself.


    ### Step 1: Enable VPN


    The VPN option is usually disabled by default when you use Kali Linux, so you
    will have to open it up before continuing. This will require you to enter your
    own command, such as:


    ```

    apt-get install network-manager-openvpn

    ```

    This particular command will enable the VPN. Upon the restart of networking and
    network manager, you should find that the VPN is now available.


    ### Step 2: Download and extract openvpn


    Now, you will need to download `openvpn.zip` file. This is not particularly difficult—code
    such as:


    ```

    wget https://www.privateinternetaccess.com/openvpn.zip

    ```

    Once the file is downloaded and saved, you will then need to unzip the file. You
    can do this with the following command:


    ```

    unzip -q openvpn.zip -d /etc/openvpn

    ```

    Your file should be ready and now is time to move on to step 3.


    ### Step 3: Configure Network Manager to use VPN


    This step is about setting up Network Manager so it will recognize and allow the
    use of VPN. This will involve going into Network Manager, editing connections,
    then swapping to the VPN tab and selecting that you would like to add. Click `ADD`,
    at which point you will then set the type as OpenVPN. You should provide a name
    for the connection and a gateway, which is your IP address. You will also need
    to provide the CA certificate and a password if required. To get the CA certificate,
    you must go to `/etc/openvpn/ca.crt` to select it within this stage. Then click
    on `Advanced` and choose the box that says "all users for this connection". This
    is to ensure that the VPN is used by everyone. Click save and close the window.


    Now, if you are going to test it, you can do so by sending out a scan:


    ```bash

    sudo-config

    ```


    # Chapter 15: Metasploit Framework


    Penetration testing is something that has already been discussed within the book,
    but it will be mentioned again. Within Kali Linux, you are granted access to all
    sorts of fantastic tools that can help you with your process of hacking, penetration
    testing, and searching for vulnerabilities or access points. One such tool for
    penetration testing that has not been discussed yet is a tool known as the Metasploit
    Framework. This particular tool utilizes command line alterations or GUI. It can
    also be used as a sort of support method for all sorts of purposes. This tool
    is incredibly powerful and is used by both cybercriminals and ethical hackers
    alike due to the usefulness of the program. In particular, Metasploit allows for
    the probing of any vulnerabilities within a network or server, and is also open-source,
    meaning that the framework can be easily modified to work for anyone and with
    any operating system.


    ## What is Metasploit?


    In particular, Metasploit refers to a specific tool that is used. The penetration
    testing team using it will be able to use either code that was already made for
    them or custom code they have created and then inject it into a network. In doing
    so, the flaws within that particular network become discovered and brought to
    attention. This means that they are able to address the weaknesses of that particular
    network so they can be addressed. Really, then, Metasploit is just another exploitative
    tool, much like Nmap, though it serves a different purpose. However, it is important
    to recognize that the tool itself is not evil or unethical. The tool itself is
    designed to be used for ethical hackers. The Metasploit Project came about in
    2003 to use as a Perl-based portable network tool. However, by 2007, it was converted
    to Ruby and instead licensed by Rapid7, where it has remained. Some of the tools
    within the Metasploit framework, which is larger than Metasploit itself, include
    several other tools that are regularly used within Kali Linux. These tools all
    have different purposes and the framework is becoming one of the default choices
    in development and mitigation. Before this, probes used to have to be performed
    manually, making pen testing incredibly slow-going, exhausting and tedious. The
    framework has even grown to include some proprietary tools rather than the free
    offerings that have been built into Kali Linux. These tools, such as Metasploit
    Pro and Metasploit Express offer their own benefits, however, they are unnecessary
    if you do not want to use them.


    ## Metasploit Users


    Thanks to how wide the range of applications for Metasploit, it is used from ethical
    hackers that wish to make their own operating systems and servers more protected
    to those who are legitimately interested in breaking into an OS for nefarious
    purposes. It is, however, an incredibly reliable tool that is easy to install
    and useful. No matter the language you choose to use or which platform you are
    utilizing, Metasploit should work, and this is a pretty significant part of why
    Metasploit is so incredibly popular in the first place. It is so useful in making
    sure that it is readily accessible that it has become widespread. As of now, Metasploit
    includes over 1600 exploits for 25 different platforms, and it carries nearly
    500 payloads. This all comes together to create such a powerful tool that people
    cannot help but enjoy it. Some of the payloads that are included are:

    '
  raw: 'The tool itself is incredibly common and it is also compatible both with CLI
    and GUI, meaning it is not only common and powerful, but also flexible.How to
    Use Nmap to Understand and Exploit VulnerabilitiesWhen you are ready to use Nmap,
    you have several different options. You will be able to scan one target, limited
    targets, or several targets, all based on the command that you are able to submit.
    The target determines exactly how you would go through the process of using this
    system, but ultimately, doing so will take some time.Scanning CommandsPerhaps
    the most basic usage of Nmap is through scanning. When you want to scan, you have
    several different options. You can choose what you wish to target, whether it
    is one individual, several individuals, or an entire directory. Imagine for a
    moment that you want to scan a single unit or system. You would do so with the
    following command, changing the IP addresses accordingly.nmap target# nmap target.com#
    nmap 192.143.1.1This will scan that one specific system. If you wish to scan all
    associated subnets to that system, your command will change slightly. It would
    instead be:nmap target/cdir# nmap 192.143.1.1/24And if instead, you wanted to
    scan several different targets instead, you would simply label them and separate
    the IP addresses with spaces. For example, maybe you would write:nmap target target1
    target2# nmap 192.143.1.1 192.141.1.2You even have the option to scan only several
    IP addresses in a row without scanning the entire subnet. When you wish to scan
    50 of the associated IP addresses but not the entire subnet, you will use the
    following command:nmap target-50# nmap 192.143.1.1-50This would then lead to the
    scanning of every IP address from 192.143.1.1 to 192.143.1.50 all in one go.You
    may also decide that what you need is a list of several hosts that are being scanned—in
    this case, you want to add the proper parameter. In this case, that parameter
    would be -sL , which would create the command prompt of:nmap -sL target/cdir#
    nmap -sL 192.143.1.1/24Sometimes, however, you may want to scan the entire subnet,
    but you also know that you need to leave a section of that subnet entirely unscanned
    in order to avoid detection.Especially if you have the single IP address that
    you must avoid, you can then create your code with a parameter meant to exclude
    that one IP address. This is quite simple. All you need to do is add in the -exclude
    parameter like so:# nmap 192.143.1.1/24 - -exclude 192.143.1.13You can even enter
    a single file that contains all excluded IP addresses if you have one, inserting
    the file name within the exclusion instead.Your scanning can even get more specific
    as well—you can start to specify exactly which ports are to be targeted if you
    have the right codes as well.Scanning Techniques and CommandsOf course, there
    are other types of scans that you can perform as well. Nmap has several different
    scanning techniques available that will be necessary for you to know to be effective.
    This section will provide you with the information you will need to use several
    other scan types as well.TCP SYN ScanCommanded with the prompt -sS the TCP SYN
    scan is a basic scan. It is commonly referred to as half-opening because it gathers
    information from the remote host without finishing the TCP process that was discussed
    earlier in this book.In this sort of scan, Nmap seeds out an SYN packet to the
    right destination but never bothers to actually create or trigger a session. In
    the end, the interaction never gets logged by the target computer because the
    computer never initiated a session. This is what makes TCP SYN scanning so beneficial.
    This is used by default, though you will need root access. Of course, if you are
    using Kali Linux as you do this, there will be no problem, as you will be in the
    root account by default. A command for this sort of scan looks like:# nmap -sS
    192.143.1.1TCP Connect() ScanWhen the SYN scan cannot happen for any reason, this
    will be the default scan that is used. With the code of -sT in order to utilize
    this scan, your system will instead complete the TCP handshake process, requiring
    the other system to log the transaction. This is only good for finding TCP ports
    rather than any others .To use this code, you would have a command such as:# nmap
    -sT 192.143.1.1UDP ScanThis scan seeks out open UDP ports in whatever the targeted
    machine is. It does not make use of an SYN packet due to the targeting of a UDP
    port instead. However, you are still able to make this more efficient if you use
    the –sS and –sU commands together.In using this scanning method, Nmap sends out
    a UDP packet and waits for some sort of response. An error message implies that
    the port is closed, but a proper response will let you know that the port is actually
    open and accessible. In this case, you will use the following command:# nmap -sU
    192.143.1.1FIN ScanSometimes a TCP SYN scan would not necessarily be the right
    choice based on the parameters that you have been provided. Usually, a firewall
    will cause a block from the SYN packets, so you will need to go through another
    method. When this happens, you can try to make use of a FIN scan—this only sends
    a FIN flag, meaning it does not require the completion of the TCP transaction
    that would otherwise trigger the detection of Nmap. The proper command for a FIN
    scan is –sF such as:# nmap –sF 192.143.1.1Which then brings back plenty of information—it
    should provide whether the host is up or down, what the latency is, and the state
    of the port. The target does not log this scan, but you are able to get the information.Ping
    ScanUnlike the other forms that have been discussed thus far, ping scanning is
    only used to determine if the host is currently alive or active. It does not discover
    whether a port is open. It does require root access, as there is the potential
    to send out ICMP packets. When there is no root access granted, it will complete
    the command using connect() call. The command for a ping scan is -sP and it would
    be used:# nmap -sP 192.143.1.1Version DetectionThis is the command you need if
    you want to determine what kind of software is being used on the target computer
    or any ports. It does not detect any open ports, though it does need to get the
    information from any open ports in order to provide the information on the software
    that has been detected. The first step here would be to find a port that is open
    with a TCP SYN scan and then direct the –sV to the specific port available.# nmap
    –sV 192.143.1.1Idle ScanningIn an idle scan, you are able to maintain your invisibility
    while scanning. In this particular technique, you do not send out any real packets
    from your own IP address. Instead, it takes a host from within the target network
    in order to send out packets. This will require you to first figure out an open
    port within the IP and then uses a zombie host in order to communicate with the
    target. In this code, you will use first the IP of the zombie host and then the
    IP of the target in order to create a command of:# nmap -sI 192.143.1.4 192.143.1.1In
    this instance, the zombie host of 192.143.1.4 is being used to communicate with
    192.143.1.1 without detection since they are a part of the same network.Penetration
    TestingUltimately, penetration testing can be broken down into seven steps or
    phases—when you are able to get through these phases, you are more likely to find
    some sort of weakness or vulnerability. In utilizing these phases, you will find
    that your own ability to break through a system grows. You will be more likely
    to crack through, which means that you are more likely to identify any of those
    weaknesses that you need to patch in your own system.The phases of penetration
    testing are pre-engagement, reconnaissance, threat modeling, exploiting, post-exploit,
    report, and re-test. You will be guided through each of the steps during this
    section of this chapter.![](OEBPS/rsrc394.jpg)Pre-EngagementThis particular step
    is more like a precaution, but it is crucial—when you are in the pre-engagement
    stage, you need to begin by figuring out the test’s scope. Essentially, you are
    looking for the exact goals of your attempt to penetrate the network. You need
    to ensure that you know what you are planning out so you do not do anything unintended.
    Especially if you will be performing this as a possible career path, you need
    to get into the habit of laying out what you are going to do and what the limits
    on what you are and are not allowed to do are. You need to know exactly what is
    expected for you to do and which networks you should be focused on. Note it all
    down. If you are trying to crack into someone else’s network at their behest,
    make sure you cover yourself legally and get signed documentation stating that
    you are working at their request and within their terms. Because penetration testing
    is dangerous by virtue of it attempting to chip away at security measures, you
    want to make sure that you are safe from being blamed if something were to go
    catastrophically wrong, which can occasionally happen.ReconnaissanceAt this stage,
    you are going to work on gathering information. While you may prefer to skip over
    this if you can get away with it, you are going to be more prepared if you actually
    know what you are doing. When you have the information that you need all lined
    up neatly in front of you, you will know what you expect. In particular, you may
    want to gather information about the network you are targeting or the most likely
    types of technology you will be encountering. You may want to have personal information
    about the people that you are trying to hack into, or about their email addresses.When
    you are trying to sneak into a network, you never know what is and is not helpful
    or necessary. Gather as much information as you possibly can in order to be prepared
    and then move on to step 3, only after you are content that you have gathered
    anything that will be useful to you.Threat Modeling and Identifying VulnerabilitiesStep
    3 is still all about planning—at this point, you want to take all of the information
    that you have gathered in the previous steps and begin brainstorming up what the
    most realistic vulnerabilities and threats that the network would face would be.
    Does it use a certain network type that is particularly vulnerable to a specific
    plan of attack? Is there an exploit on the type of hardware they are using? Anything
    goes here, so long as it is a relevant threat that the target will likely face.This
    stage can also utilize a vulnerability scanner in order to scan the network for
    weaknesses. This could be done to find any vulnerabilities that are currently
    within that particular network, allowing you to calculate out the most likely
    vulnerabilities present. This can be a fantastic asset to you when you are trying
    to understand how best to access the network that you are attempting to penetrate.
    Kali Linux, luckily, comes with Metasploit—a way that you can scan for vulnerabilities
    within a list of specific target IPs. Metasploit will be discussed in-depth later
    within this book.Another common technique at this stage is to use scanning tools
    and port scanners in order to find open ports or live hosts. In doing so, you
    may find that you are able to find another weakness that can be exploited to gain
    access. This technique allows you to scan devices, allowing for another point
    of entry.This is almost like reconnaissance v 2.0—here, you are making it a point
    to get more details about the systems. You should be able to identify what systems
    are present, whether or not they are currently up and active, or whether there
    are any sorts of firewalls or antivirus software installed. With your list of
    vulnerabilities identified, it is time to start figuring out more information
    as well.Can you get any valuable information form looking at the employees on
    the network? Is there value in finding customer data? Do customers have access
    to symptoms? Is there a possibility to steal financial information? If there is,
    then it is quite possible that you may want to look somewhere other than surrounding
    the financial information first, in an effort to sneak around and figure out a
    better plan of attack rather than trying to run in, guns blazing, straight into
    a trap or an area that is heavily guarded. Think about the most likely possibilities
    in this situation and come up with a tentative plan of attack, but remember that
    your test is most likely going to be constantly evolving and changing as you get
    more and more information.ExploitationAt this point, it is time to begin attempting
    to access the network. You should have several different locations that you could
    use to attack the system and it is time to begin making those moves. Have you
    found any weaknesses that can be used to access? You may try to start a shell,
    or try to get some sort of credential assigned to you so you can begin to access
    as a root user instead.Is there any room for using another computer’s information
    to help you get head? The main part of this phase is attempting to gain as much
    access as you can without being detected and blocked out. While it is possible
    to do plenty of damage without ever actually gaining administrative accesses and
    permissions, most of the time, what you are attempting to do is get that permission.This
    stage will be largely dependent upon the network that you are attempting to break
    through, and you will need to be creative. Make sure that you document what does
    and does not work as you go so you can start to figure things out. Remember, if
    you are doing this for yourself or for a client, you are going to want to know
    exactly what worked and what did not. When you have gotten as much information
    as you can here, it is time for the next stage.Post-ExploitationNext comes the
    post-exploitation phase. At this point, you will have finished testing, either
    due to running out of tie or having reached the end of your ability to exploit
    or run out of the system to exploit. At this point, you must make a list of all
    vulnerabilities and provide them to the client. As you have gone through, you
    should have made notes, or potentially screenshots, of anything that did or did
    not work. You should be able to figure out how significant the exploit that you
    have done is—did you get into the main server or did you get stuck at a computer
    with little sophisticated access to the server? How valuable was the information
    that you got from the system, if any? How at risk is the system itself?Beyond
    that, you should also be thinking of how to fix any vulnerabilities that were
    discovered. Can you think of an easy patch to solve the problem? Is there something
    else that you can do to ensure that the network is more secure? What can the network
    do better? What worked well? Beyond that, you should also make sure that you clean
    up as well. You need to remove anything that was planted within the system and
    change back any and all settings to what they used to be. You want to make sure
    that everything that you have exploited is removed.ReportingAt this stage, it
    is time to come up with your report. It may not be fun, but if you have gone through
    the penetration testing in order to help someone, you need to make sure that your
    report is written up nice and neatly. This is where you are able to convey any
    weaknesses and vulnerabilities that will put the client at risk. You will make
    sure that you are able to tell them which exploits happened and how they should
    be fixed.This stage should be as brutally honest as possible—you want the other
    party to know exactly what happened and how to fix it. If their system is truly
    that vulnerable to exploitation and you were able to get access to everything,
    let it loose. Tell them in unbiased but honest terms exactly how things went wrong.
    This is where they are also given an example plan of action to make sure that
    everything gets patched up. The clearer you make this stage for the client, the
    better you will be at your job and the more likely it will be that your client
    is able to fix the problems and secure the network.RetestingThis is not a stage
    that everyone is willing to go through as penetration testers, but it is an important
    one if you want to do a thorough job in doing so. During this stage, you will
    give the client time to look through their own vulnerabilities and attempt to
    repair them and you reevaluate their attempts to bolster their defenses. You will
    essentially retest the parts that were fixed in order to see that they actually
    did patch up any vulnerability that was there.  You may not always be asked to
    do this, but if you are, it is always an act of good faith to go through with
    it.Chapter 14: How to Become and Remain AnonymousAnonymity is crucial if you hope
    to be a hacker, no matter the kind. If you are not careful, it becomes incredibly
    easy to simply blacklist your specific IP address and you no longer have that
    access. Instead of managing to get through the system or finding any exploits,
    you instead end up banned and unable to do anything. However, that does not have
    to be your fate if you are trying to hack—you can instead cover your tracks.Just
    as many burglars will wear gloves in order to hide their fingerprints from the
    system that they are trying to access, making sure that you put on your own metaphorical
    digital gloves can help you remain anonymous. This means that your information
    will be private—you will be able to disguise yourself and your software in order
    to make sure that your real IP address is not being used.Now, you may be thinking,
    what if you are using a virtual machine? Would that not have a digitized IP address
    or be hidden more because the entire thing is digital? Yes and no—however, that
    is still only as secure as the network that you are using. This means that if
    you really want true anonymity, you are going to want to involve the usage of
    something else as well. You are going to want to add in extra tools and precautions
    to arm yourself against your IP address is found out. When you are able to fight
    it off, you are more likely to remain anonymous.There are several tools out there
    that would be able to aid you with the process of being anonymous and protecting
    yourself, all built within Kali Linux and ready to be used. All it will take is
    the time and effort to configure everything, but it will be well worth the effort.
    The three methods in particular that will be discussed within this chapter will
    be proxy servers, VPNs, and the use of TOR. Within each section, you will be guided
    through what the particular method is, how it works, and how to use it with Kali
    Linux.![](OEBPS/rsrc395.jpg)ProxychainsPerhaps one of the simplest methods to
    obscure your IP address is through the use of a proxy server. Through using chains
    of proxies, you are able to obscure your tracks, making them harder to follow.
    In making them more difficult to follow, you will be more likely to avoid detection.
    When you use a proxy, of course that proxy is logging your information. However,
    you can get around this as well—you can string together several proxies together
    in a chain. So long as at least one proxy is able to be outside of the jurisdiction
    of the target, you should be able to avoid the problem altogether.![](OEBPS/rsrc396.jpg)Luckily,
    within Kali, you have access to a tool known as Proxychains. This can be found
    within your directory, which you can pull up with a location command. It will
    most likely be in the /usr/bin directory.When you are using Proxychains, you will
    be using a very straightforward command:# proxychains [enter command that is proxied]
    [add in any arguments]Now, imagine that you wanted to use this with Nmap to scan
    anonymously and through a proxy. Perhaps in particular, you want to use a TCP
    SYN scan on the IP address 192.143.1.1 but you want to do so through a proxy utilizing
    the tool. In this case, you would create a command prompt of:# proxychains nmap
    -sS 192.143.1.1This then triggers you to do the TCP SYN scan on that one particular
    IP address through a proxy.With the syntax understood, you are able to move on
    to completing a config file. As with basically anything else within Linux, there
    are simple text files known as config files that will hold all of the necessary
    information. You are able to open these in any of the text editors you have, such
    as via gedit or leafpad.Open the config file into your text editor and you should
    see a file with all sorts of information. Within it, you will find that one particular
    area has a spot for you to add the proxy. You will simply enter the IP address
    of any proxies that you are utilizing there. Typically, proxychains will default
    to Tor, as you can see within your file. If you will be using Tor, leave this
    as is. If you are not using Tor, you will need to make the appropriate edits to
    the file. This book will be moving forward with Tor.With the proxy server set
    up, it is time to test it. You can do so by sending out a scan through the proxy.
    When you send the scan out, you should see your chosen IP address listed and it
    should line up with your proxy one.Beyond just setting up the proxy, however,
    you can do plenty of other things with this as well. You can add several proxies,
    for example, and then chain them together so they chain either at random, in a
    specific order, or uses only part of them.Start by opening your proxychains config
    file again. You will then look at the dynamic_chains line—you can see that it
    is commented out. This means that it will not be used at this moment. If you erase
    the comment mark, it should activate when the process is run.You can also find
    random chaining as well within your file. You can re-add the # to comment out
    the dynamic_chains line and instead remove the # from the random_chain option
    instead. You can only make use of one or the other of these options at any given
    time, so you will have to go back in and remove one if you wish to use the other.VPNAnother
    layer of security that you can add to your system is through adding a VPN on top
    of the use of proxy addresses. This is common practice—it allows for further protection
    from piracy or other issues. It also allows people to bypass, for example, any
    particular activities that may be illegal within a country. It also can allow
    you to scan other networks without being detected—something else that is commonly
    considered to be illegal in several countries. Even just scanning the network
    can be enough to lead to it being considered illegal, even though you may not
    have done anything with it. Now, since you are currently reading about how best
    to do exactly that, you are going to find that the extra security is crucial to
    protecting yourself.![](OEBPS/rsrc397.jpg)There are several reasons to use a VPN,
    all of which are incredibly compelling. Not only does a VPN allow you to cloak
    your IP address and therefore protect you, but it also allows you to use any network
    while ensuring that there is still encryption. Further, you will be able to log
    into your sensitive information without worrying about it being hijacked if you
    are on another network. You will be able to skip past any monitoring that may
    have been installed, or access region-restricted websites.Of course, it is also
    important to recognize that your VPN will not cloak everything—there will be some
    ways to identify you. For example, your regular search engine can probably recognize
    you simply due to cookies and browsing behavior, especially if you are already
    logged into an account with that particular engine. Despite the shortcomings,
    however, the fact that a VPN can help you hide more means that you can rely on
    it to provide you with more protection than you would otherwise have. Just as
    a seatbelt is not a guarantee of safety in a car accident, a VPN is not a guarantee
    of security—however it is an extra layer that is there to help keep you safe if
    necessary.When you want to enable a VPN on Kali Linux, you will have a handful
    of commands to use and steps to follow, but in the end, you will add extra protection
    to your software, meaning that you will be able to better protect yourself.Step
    1: Enable VPNThe VPN option is usually disabled by default when you use Kali Linux,
    so you will have to open it up before continuing. This will require you to enter
    your own command, such as:# apt-get install network-manager-openvpn   This particular
    command is specific to enable a VPN. At this point, you may need to restart your
    networking and network-manager. Upon the restart, you should find that the VPN
    is now available.Step 2: Download and extract openvpnNow, you will need to download
    the openvpn.zip file. This is not particularly difficult—a code such as:# wget
    [https://www.privateinternetacess.com/openvpn/openvpn.zip](https://www.privateinternetacess.com/openvpn/openvpn.zip)To
    download the file. Once it is downloaded and saved, you will then need to unzip
    the file and make sure it is deposited into the right directory for later use.
    You can do this with the following command:# unzip -q openvpn.zip –d /etc/openvpnYour
    file should be ready, and now it is time to move on to step 3.Step 3: Configure
    Network Manager to use PIA VPNAt this step, you will be setting up Network Manager
    so it will recognize and allow the use of the VPN that you are hoping to set up.This
    will involve you going into Network Manager, editing the connections, then swapping
    to the VPN tab and selecting that you would like to add it. You would then click
    on ADD, at which point, you would then set the type as OpenVPN. Then, click on
    create.If you go to VPN, you will find several important details that will allow
    you to tell whether or not you are actually using the proper VPN in the first
    place. In this case, you should see a connection name of PrivateInternetAccess
    VPN, a gateway  that should be closest to your own personal location, a username
    that you can set in, a password that you can save, and then the CA certificate.To
    get the CA certificate, you must go to /etc/openvpn in order to access the right
    directory, and then select on ca.crt to use it within this stage.Now, click on
    Advanced and choose the box that is next to Use LZO data compression. You then
    must click on OK, then save and close the window.At this point, if you click on
    Network Manager > VPN Connections > PrivateInternetAccess VPN, you should see
    a yellow connection indicator. Your VPN is now ready for use.Tor and Kali LinuxTor
    is yet another layer in the security umbrella that you can create in order to
    ensure that you are able to protect yourself. This is just another security precaution,
    but if you make good use of it, you can find that you are actually able to really
    protect yourself, especially if you begin to layer these safety methods together
    to protect your anonymity as much as possible. Remember, Kali Linux is already
    secure, but you are able to add extra layers to it utilizing the tools within
    its repository. Tor is another of those particular tools that are able to help
    protect you that comes with the Kali Linux toolset.Tor itself is free software
    and will protect you through actively bouncing your communication throughout several
    different network points. Essentially, there is a massive network created by volunteers
    around the world. They help transfer your information erratically so it cannot
    really be tracked easily. In constantly bouncing your information from place to
    place, you essentially end up with your data being highly protected. Your history
    will not be easily tracked and the sites that you are visiting are not able to
    know exactly where you are physical. Effectively, you block yourself from being
    seen because people all over the world send your signals and information all over
    the place. One request may originate in the United States while another pops up
    in Spain and another in Germany.Especially if you layer this with the previously
    discussed methods for real anonymity, you become incredibly difficult to track.
    You would not only have a series of different IP addresses being cycled through,
    but you would also have those IP addresses encrypted and protected by your VPN,
    and then you would further have protection because your access to the internet
    is being passed through Tor instead of through your usual methods.When you want
    to use Tor on your Kali Linux machine, you will have to install it manually. Because
    you are on Kali, you are locked into being the root user, which means that you
    cannot use the shortcut mode that you are usually able to utilize. Instead of
    being able to utilize any shortcuts, you will need to manually download the Tor
    download.You can do this through the Tor Project official website. You will want
    to get the bundle download from their website and then download the torbrowser-launcher
    from GitHub.Make sure that you download the architecture appropriate files and
    save it somewhere that you are able to access. Then, utilizing the tar command,
    you should extract the package from the download directory. You can do this with
    the following command:# tar –xvf torKeep in mind that this command believes that
    the only file within your directory that begins with “tor” is your file for the
    tore download. Then, you need to run the Tor Browser Bundle. This will require
    you using the start-tor-browser script that you have just extracted:# ./start-tor-browser.desktopIn
    doing so, you will see Vidalia launched, and that will connect to Tor. With Tor
    connected to, Firefox will launch.If you are able to utilize these three different
    methods for privacy in tandem, you may quickly find that you are actually able
    to protect yourself greatly from the risks out in the real world of the internet.
    You will be able to ensure that your IP address is not as likely to be discovered,
    especially if you are messing around with some of the particular interests of
    those using Kali Linux, such as penetration testing that may otherwise become
    problematic.Chapter 15: Metasploit FrameworkPenetration testing is something that
    has already been discussed within this book, but it will be mentioned again. Within
    Kali Linux, you are granted access to all sorts of fantastic tools that can help
    you with your process of hacking, penetration testing, and searching for vulnerabilities
    or access points. One such tool for penetration testing that has not been discussed
    yet is a tool known as the Metasploit Framework. This particular tool utilizes
    Command line alterations or GUI. It can also be used as a sort of support method
    that can be used for all sorts of purposes. This tool is incredibly powerful and
    is used by both cybercriminals and ethical hackers alike due to the usefulness
    of the program.In particular, Metasploit allows for the probing of any systematic
    vulnerabilities within a network or server, and is also open-source, meaning that
    the framework can be easily modified to work for anyone and with nearly any operating
    system.What is Metasploit?In particular, Metasploit refers to a specific tool
    that is used. The pen testing team that is using it will be able to use either
    code that was already made for them or custom code that they have created and
    then inject it into a network. In doing so, the flaws within that particular network
    become discovered and are brought to attention. This means then that they are
    able to address the weaknesses of that particular network so they can be addressed.Really,
    then, Metasploit is just another exploitative tool, much like Nmap, though it
    serves a different purpose. However, it is important to recognize that the tool
    itself is not evil or unethical. The tool itself is designed to be used for ethical
    hackers.The Metasploit Project came about in 2003 to use as a Perl-based portable
    network tool. However, by 2007, it was converted to Ruby and instead was licensed
    by Rapid7, where it has remained. Some of the tools within the Metasploit framework,
    which is larger than Metasploit itself, include several other tools that are regularly
    used within Kali Linux. These tools all have different purposes and the Metasploit
    framework as becoming one of the default choices in development and mitigation.
    Before this, probes used to have to be performed manually, making pen testing
    incredibly slow-going, exhausting, and tedious.The framework has even grown to
    include some proprietary tools rather than the free offerings that have been built
    into Kali Linux. These tools, such as Metasploit Pro and Metasploit Express offer
    their own benefits, however, they are unnecessary if you do not want to use them.Metasploit
    UsersThanks to how wide the range of applications for Metasploit, it is used from
    ethical hackers that wish to make their own operating systems and servers more
    protected to those who are legitimately interested in breaking into an OS for
    nefarious purposes. It is, however, an incredibly reliable tool that is easy to
    install and useful.No matter the language that you choose to use or which platform
    you are utilizing, Metasploit should work, and this is a pretty significant part
    of why Metasploit is so incredibly popular in the first place. It is so useful
    in making sure that it is readily accessible that it has become widespread.As
    of now, Metasploit includes over 1600 exploits for 25 different platforms, and
    it carries nearly 500 payloads. This all comes together to create such a powerful
    tool that people cannot help but enjoy it. Some of the payloads that are included
    are:'
