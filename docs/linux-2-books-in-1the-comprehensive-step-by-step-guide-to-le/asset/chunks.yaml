    ## 1. 哪种用户类型的权限最高？

    1. 普通用户

    2. Root 用户

    3. 系统用户

    4. 随机用户


    ## 2. 在不登录管理员账户的情况下，覆盖管理限制的必要命令是什么？

    1. `sudore`

    2. `visudo`

    3. `sudo`

    4. `su`


    ## 3. 哪一个陈述是正确的？

    1. 由于存在删除重要信息的风险，你应该避免使用 root 用户账户

    2. 由于存在删除重要信息的风险，你应该避免使用 `visudo` 进行编辑

    3. 由于存在删除重要信息的风险，你应该避免使用 `sudo` 命令

    4. 由于存在删除重要信息的风险，你应该避免使用 Linux

    5. 以上所有内容


    ## 4. 正确或错误：当你进行编辑时，`visudo` 会检查错误。


    ## 5. 正确或错误：默认情况下，`visudo` 会在不发出警告的情况下将错误的编辑发布到 `sudore` 文件中。


    # 第 6 章答案


    1. **B**: `root` 用户默认拥有所有权限。

    2. **C**: `sudo` 是用于覆盖管理限制的命令。

    3. **A**: 如果可能，你应该避免使用 `su` root 账户，因为它缺乏所有其他提到过程的保护措施。

    4. **正确**

    5. **错误**: 你必须手动命令它保存错误的编辑，否则它最初会就你发出语法错误的警告。


