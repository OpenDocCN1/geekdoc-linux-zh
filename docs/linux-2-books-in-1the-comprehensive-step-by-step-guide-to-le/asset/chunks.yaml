  trans: '


    # Debian GNU/Linux

    该项目发布于 1993 年，旨在成为一个通过数百名开发者的志愿者工作完成的非商业项目。大多数人认为它会失败——毕竟，几百名开发者如何能够在业余时间免费编写代码并创建一个凝聚力强的整体呢？尽管如此，该项目还是获得了了，Debian
    在十年内成为了最大的 Linux 发行版。它包含了 1000 名志愿者开发者的工作，为 8 种不同的处理器架构提供了近 50,000 个二进制软件包。这种努力产生了
    120 多个基于 Debian 的其他发行版。没有其他基于 Linux 的操作系统能接近这些数字。


    Debian 在几个不同的开发阶段存在四个主要分支——“实验”（Experimental）、“不稳定”（Unstable，也常被称为 `sid`）、“测试”（Testing）和“稳定”（Stable）。得益于这一过程，它以极其严格的质量控制而闻名，Debian
    被誉为你能找到的最稳定、测试最充分且无 Bug 的发行版之一。


    当然，开发过程确实存在一些缺点。特别是稳定版每隔几年才发布一次，而且由于经过了大量的测试，它们的竞争力并不突出。


    - **难度评分**：适合有一定经验的初学者

    - **长期支持**：提供支持，但新的稳定版每隔几年才发布一次


    ### 优点

    * 非常稳定

    * 极佳的质量控制

    * 超过 30,000 个软件软件包

    * 识别并支持比其他发行版更多的处理器架构


    ### 缺点

    * 由于开发周期原因，新的稳定软件通常不够前沿

    * 由于支持多种处理器架构，显得较为保守

    * 新版本的发布频率较低


    # Arch Linux

    Arch Linux 由 Judd Vinet 于 2002 年设计，目标是简单易用，最初设计是为已经熟悉操作系统的 Linux 中中高级用户设计的。当它作为一种“滚动更新”（rolling-release）发行版被推广时，最终赢得了人气，这意味着只需要初始安装即可运行。


    从那时起，保持安装更新所需的仅是每月获取一次安装介质的快照以刷新软件。这是通过名为 `Pacman` 的包管理器实现的。它还能从源代码安装软件包，这使其变得极其高效，特别是当它简单打包二进制软件包的能力与不断增加的测试软件包仓库相结合时。


    尽管最初的设计是为经验丰富的用户设计的，但得益于《Arch Linux 手册》以及所有的使用文档，现在允许 Linux 经验较少的用户进行安装、理解和利用它。凭借它所拥有的强大工具，该发行版可以无尽地定制。


    然而，滚动更新可能会导致问题，特别是在人为错误的情况下。即使是微小的失误也可能导致系统在升级后无法启动。这意味着，尽管有很多信息可用，但这仍然是一个需要某些技术知识和经验来修复可能出现的问题的系统。


    - **难度评分**：中级——需要一些经验才能真正用好它。

    - **长期支持**：定期的滚动更新


    ### 优点

    * 极佳的软件管理结构

    * 极高的定制性，拥有无限可能

    * 提供了大量的在线文档和指导


    ### 缺点

    * 初学者可能难以上手

    * 偶尔发生故障

    * 故障需要经验来处理和修复


    # Slackware

    Slackware 创建于 1992 年，是仍然存活的最古老的 Linux 发行版。它源自一个已停止项目的分支，最初发布在 24 张独立的软盘上，并基于 Linux
    内核版本 `0.99pl11-alpha` 构建。它在当时的 Linux 发行版中流行起来，据信到 1995 年它占据了 80% 的 Linux 安装量。


    然而，随着更新、更快且更用户友好的选项进入市场，Slackware 的用户迅速减少。尽管人气下降，它仍然充满活力，并受到那些技术能力较强的人的喜爱。


    因为它不是特别定制，所以它非常纯净且技术化。它主要使用基于文本的系统安装程序，与现代选项相比，其包管理系统非常陈旧且原始。然而，因为它非常简单基础，它也是今天你能获得的最干净的
    Linux 发行版之一，使其极其稳定。在没有增强的情况下，意外向系统引入 Bug 的概率微乎其微。


    凭借其可靠性和无 Bug，Slackware Linux 正迅速成为一个核心系统——一个作为其他软件的基础而非完整发行版的系统。虽然在目前看来并不具备竞争力，但今天仍有一些人在使用。


    - **难度评分**：高级

    - **长期支持**：有维护中，但不提供补丁或定制


    ### 优点

    * 稳定且基本没有 Bug

    * true Unix 原则

    * 很大程度上自最初构想以来改变


    ### 缺点

    * 非常保守——没有定制空间

    * 用作现代桌面需要大量工作

    * 升级程序很困难

    * 没有官方安全支持或更新


    # Gentoo

    尽管网络上流传着关于它的笑话，但 Gentoo 是那些知道自己在做什么的人的有效选择。这个特定的发行版既快速又灵活且完全免费。它专门为拥有大量 IT 知识的人设计，例如开发者和网络专业人员。


    它是通过名为 `Portage` 的基于的的包系统构建的——这是一个基于 Python 的真实端口系统，带有许多自己的高级功能，使得 Gentoo 对那些如何使用它的人来说非常有吸引力。


    Gentoo 由 Daniel Robbins 于 2000 年创建，愿景是创建一个不需要任何预编译二进制软件包的元发行版。他无疑成功了——当你安装 Gentoo
    时，你设置的是一个启动所需的最小系统，从那里开始，你必须自己对其编程。系统本身极具定制性，你可以自由地添加和删除内容来满足你的需求。得益于此，它因向选择使用它的人提供灵活性而闻名。他们能够创建广泛的体验，正因如此，Gentoo
    可以在其他几个项目的核心找到，例如为 Google 的 Chrome OS 创建基础。


    - **难度评分**：高级

    - **长期支持**：定期发布


    ### 优点

    * 灵活且可定制

    * 可以可以使用不同的编译时配置

    * 可以使用多个 init 系统

    * 可以运行在几种不同的架构上


    ### 缺点

    * 需要高水平知识才能入门

    * 设置耗时较长

    * 通过源码升级软件包的过程可能很长


