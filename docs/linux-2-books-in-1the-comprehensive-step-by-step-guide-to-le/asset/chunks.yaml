    # 第 5 章：Linux 命令


    本章旨在为你提供一个易于查阅的字典，你可以在这里根据需要访问广泛的 Linux 命令。因为，特别是刚开始，你会发现自己并不十分熟练地记住系统命令，因此，有一个可以随时参考的章节来查找你需要的命令是非常用的。


    这些命令设计用于在终端中使用，允许你直接与系统本身进行通信。这意味着，通过使用终端和本章提供的命令，你将能够直接影响并与计算机交互。当然，在使用这些命令时，你还需要记住几条规则。


    首先要记住，`$` 是提示符，告知你个人在 `bash` 中已正式准备好接受你的输入。然而，`csh` 将使用 `%` 来提示你输入内容。此外，请记住，书中代码块后的冒号是为了将其与该特定命令功能的描述隔开，不应包含这些冒号。


    除此之外，你还必须意识到 Linux 实际上是**区分大小**的。如果你在代码中输入了一个不该出现的大写字母，它将无法加载你最初想要加载的任何内容。这带来了一些优势，例如允许对相同大小写的符号字符串处理得更快，而无需处理所有字母以确保字母本身注册为某种大小写而非预期的特定大小写。尽管今天的计算机完全有能力处理这些额外负载，但这种习惯已经胜出，大小写敏感仍然是一个需要记住的特性。


    ## 系统信息命令


    在处理计算机更复杂的事务时，熟悉硬件是极其重要的。因此，Linux 自带了几个命令，允许你访问可能需要的任何关于硬件的信息。这些命令将帮助你理解多个硬件组件的配置细节。


    当你使用这些命令时，你将能够跟踪当前系统的运行状态，这意味着你可以看到如何分配资源，或者知道系统处理你当前任务的良好程度。虽然某些发行版的命令略有不同，但如果你需要收集有关系统的信息，这些是最是最容易获得的命令。


    当你阅读这些命令代码时，请注意有几个命令看起来非常相似，但它们都有自己的细微差别，并将它们区分开来。看到面前列出的所有代码可能会令人敬畏，但请记住，如果你无法或不想记忆命令，可以使用一些工具来帮助你。


    *   `accept`: 允许你接受发送到目的地的任务。

    *   `arch`: 显示打印机的硬件名称。

    *   `date`: 显示系统的日期和时间。

    *   `df`: 此特定命令触发计算机报告文件系统的可用磁盘空间。它会报告几个不同的分区及其挂载点，并提供所有这些数据。

    *   `fdisk`: 这是在需要时更改硬盘分区的工具命令。

    *   `free`: 告诉你的计算机检查计算机 RAM 的数量——空闲、已用以及系统 RAM 的总量。

    *   `hdparm`: 告诉你的计算机提供有关硬盘驱动或其他 sata 设备的信息。

    *   `hwclock`: 显示或允许配置硬件时钟。

    *   `hwinfo`: 这是一个探测硬件的通用命令——它将为你提供硬件组件的详细或简要信息，提供比你可能使用的 `lshw` 生成的信息。

    *   `lnxi`: 这是一个 `bash` 脚本，意味着它包含较大的代码。事实上，这个特定命令内部包含 10,000 行代码。通过激活此代码，你将从多个不同来源收集各种硬件数据，将其放入一个漂亮、易于阅读的报告中，即使是初学者也很容易浏览。

    *   `lsblk`: 触发设备列出块设备。通过这种方式，你将看到硬盘分区以及光驱和闪存驱动。

    *   `lscpu`: 此命令将提取关于你计算机 CPU 和处理单元的报告。

    *   `lspci`: 此命令列出 pci 总，同时提供它们的更多细节。它包括 vga 适配器、显卡、USB 端口等。通过此特定命令，你还可以利用 `grep`
    过滤出你寻找的特定信息，将在章节后续部分详细讨论。

    *   `lsscsi`: 此命令列出 scsi 设备，如硬盘和光驱。

    *   `lshw`: 这是一个通用命令，列出系统上安装的所有硬件以及其中包含的数据。

    *   `lsusb`: 此命令为用户提供有关 USB 控制器和连接到它们的任何设备的数据。如果你希望打印这些详细信息，可以在代码中添加 `-v`。

    *   `mount`: 设计用于挂载或卸载设备，以及查看当前与服务器交互的挂载文件系统。再次，你可以利用 `grep` 过滤出你准确感兴趣的文件。

    *   `uname –m`: 触发系统打印机器硬件名称。

    *   `uname -r`: 触发系统打印正在使用的内核版本。


    ## 系统关机、重启和注销命令


    感谢的是，Linux 让重启计算机或关机变得非常用户友好。在大多数其他操作系统中，你只需通过按钮和提示选择关机、重启或注销，而在 Linux 中，你也可以通过终端完成。对于那些始终访问终端的人来说，这意味着你只需几次击键即可管理系统。


    请记住，这些过程大部分将结束你当前的会话——因此，你必须确保在过程中不会丢失工作。本节将引导你通过最常用的关机命令。通过这些命令，你可以开始控制系统——你可以程序系统在预定时间关闭，或者决定在几小时或几分钟内关闭。无论你选择何时作为计算机的关机时间，你都可以对其进行编程。这就是
    Linux 的魅力之处——你可以在其中编写你想要的任何命令。


    *   `sudo shutdown –h HH:MM`: 在 `-h` 之后，你可以输入你想要触发计算机关机的时间。你可以输入 `now` 或任何其他时间，保持格式为
    `HH:MM`，所以如果你想让计算机在晚上 7:38 准时关机，你将输入：`sudo shutdown –h 19:38`。

    *   如果不包含时间，你会收到一条消息，告诉你你必须为关机设置一个特定时间。除了使用 `HH:MM` 或 `now`，你也可以选择执行 `+30` 来增加
    30 分钟。

    *   `sudo shutdown –c`: 如果你设置了在特定时间取消，则此取消当前计划的关机命令。当你使用它时，你可以确保不会被计划的关机中断。

    *   `sudo reboot`: 将触发你的计算机重启。


    `init` 服务管理器。这将决定你的程序运行的级别。有几种不同的运行级别可以进入——从 `0-6`、`s` 和 `m`。


    *   `init 0`: 这是关机。

    *   `init 1`: 这是单用户模式或紧急模式。没有网络或多任务处理。

    *   `init 2`: 在此阶段没有网络，但可以使用多任务支持。

    *   `init 3`: 网络和多任务处理存在，但没有 GUI。


    '
- fmt: '

    - `init 4`: Similar to `init 3`, but used in some research. This state is essentially
    irrelevant to you right now.

    - `init 5`: The network is multitasking, and GUI is present.

    - `init 6`: This is used to tell the system to restart.

    - `init s`: This tells the system to enter maintenance mode.

    - `init m`: This tells the system to enter maintenance mode. Synonymous with `init
    s`.

