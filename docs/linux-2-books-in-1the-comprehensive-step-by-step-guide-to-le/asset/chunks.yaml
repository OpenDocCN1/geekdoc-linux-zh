    - `Command shell payloads`: They enable people to run scripts or commands against
    a different target or host

    - `Dynamic payloads`: They allow testers to come up with unique payloads as they
    attempt to avoid any antivirus software

    - `Meterpreter payloads`: They allow for the overtaking of device monitors to
    overtake other sessions

    - `Static payloads`: They enable ports to be forwarded and communications to be
    had between networks.


    # Metasploit Modules


    There are several modules included within Metasploit. These are core components—software
    that have very specific actions that they are supposed to perform. These also
    represent the actions that you can achieve within the Metasploit framework. These
    modules are readily located: all you have to do is find the following repository:/`/path/to/metasploit/apps/pro/msf3/modules`


    The module type will be determined by the purpose of that particular one, as well
    as the action that the particular module is responsible for. In particular there
    are eight that are worthy of discussing. These include:


    - `Exploits`: Exploit modules are designed to execute a series of commands that
    then target a vulnerability that has been discovered within the targeted system
    or application. This module is designed to take advantage of any vulnerability
    in order to provide access to whatever the target system is. There are several
    different examples of exploit modules, such as code injection and web application
    exploits.

    - `Payloads`: A payload refers to a shell code that runs after the exploit has
    managed to compromise the system at hand. The payload allows you to decide exactly
    how you want to be able to connect to the shell and what it is that you want to
    be done to the target after you have taken control of it. It can involve opening
    a meterpreter or a different command shell. The `Meterpreter` is specifically
    an advanced type of payload that allows for the writing of `DLL` files, allowing
    for new features as you need them to be created.

    - `Encoders`: The encoders are critical tools that are able to convert one form
    of code into another.

    - `Listeners`: Malware that is designed to hide to listen. When they are able
    to listen, they are able to gather up all sorts of important information, allowing
    for sensitive information, such as passwords, social security numbers, or other
    information that people would largely like to keep private to be leaked.

    - `Auxiliary function`: Tools and commands meant to supplement the other functions
    of the device

    - `Shellcode`: Code programmed to activate as soon as it is inside the target
    in order to do specific purposes, allowing for a more discrete way to get in and
    activate.

    - `NOP generator`: This is a tool that is able to produce a series of random bytes
    that are designed to bypass any standard IDs in order to get past firewalls or
    important blockages.

    - `Post-exploitation code`: The post-exploitation modules allow you to get more
    information or manage to steal further access within an exploited target. These
    include hash dumps or service enumerators.

