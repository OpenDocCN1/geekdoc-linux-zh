    LevelBy: Ethem MiningIntroductionIf you have picked up this book, you are inevitably
    interested in Linux, at least to some degree. You may be interested in understanding
    the software, or debating whether it is right for you. However, especially as
    a beginner, it is easy to feel lost in a sea of information. How do you know what
    version of Linux to download? Or how to even go about downloading it, to begin
    with? Is Linux even right for you to begin with? All of those are valid questions,
    and luckily for you, Linux for Beginners is here to guide you through all of it.Linux
    is an operating system, much like iOS and Windows. It can be used on laptops,
    large computer centers, on cell phones, and even smart fridges. If it can be programmed,
    Linux can almost definitely be installed, thanks to several features and benefits.
    Linux is small, secure, supported on other devices, and incredibly easy to customize.
    With Linux, you can create a setup that is exactly what you want, with privacy,
    security, and access to plenty of free to use software. This means that, once
    you develop the knowhow, you can create a customized experience that will do exactly
    what you need, allowing yourself to optimize the setup you have and ensure that
    the setup you haveAs you read through this book, you will be given a comprehensive
    guide to everything you need to know as a beginner to Linux. You will learn about
    why and how to determine which distribution of Linux is right for you. You will
    discover how to use the terminal, how to set up exactly what you will need on
    your system, and more.When you are able to make your customized setup however
    you see fit, this means that you can make sure that you are always working within
    the constraints of the hardware that you are using. This means that older machines,
    which may struggle under a load of many modern operating systems such as Windows
    10, can be optimized and used to their fullest potential without wasting valuable
    resources or processing power on aspects that are unnecessary, redundant, or even
    just detrimental to whatever it is that you need to do.Ultimately, you will be
    provided with exactly what you need to know to get started with Linux, from start
    to finish. You will even be provided with several alternatives to Windows-specific
    applications that can be downloaded and used while running Linux on your device.
    Everything will be provided in the simplest terms possible, so you get a complete
    and thorough understanding of exactly what you need to know if you wish to get
    started with Linux, and at the end of each chapter, you will be given a short,
    five question quiz, as well as the answers to ensure that you are, in fact, comprehending
    the material that has been provided. Between receiving several step-by-step guides,
    questions, and lists of commands, you should have much of what you need to know
    to at least get started with the installation of your own distribution of Linux!There
    are plenty of books on this subject on the market, thanks again for choosing this
    one! Every effort was made to ensure it is full of as much useful information
    as possible; please enjoy!Chapter 1: What is Linux?So, you have decided that you
    want to use Linux—or at least learn more about it than you already know. You are
    in the right place! Within this chapter, you will develop an understanding of
    what Linux is. First, you will discuss what operating systems are to develop the
    foundational information you will need to guide you through the rest of the book.
    From there, you will discuss Linux as an operating system, learning what it has
    to offer and why it is so commonly used by other people. From there, you will
    learn how Linux came to be. Lastly, you will begin to learn how Linux is composed,
    looking at the systems architecture, file hierarchy, and processes.![](OEBPS/rsrc387.jpg)What
    is an Operating System?An operating system, commonly abbreviated as OS, is the
    program that runs the hardware of a computer. In running the hardware, it also
    allows for the management and usage of the software. It also allows for the interaction
    between the user and the hardware, facilitating acts such as input and output.
    It is essentially the intermediary, allowing the hardware to run the programs
    and the programs to make use of the hardware.![](OEBPS/rsrc388.jpg)Of course,
    this means that the operating system is the single most important piece of software
    that you will ever run—without it, your computer will not be able to manage the
    hardware. Think of the OS as the brain of the computer. Just as your brain keeps
    your body running properly and reacts to interaction, so too does the OS keep
    the computer running properly and allow it to interact with the computer. When
    you use an operating system, you are essentially interacting with a program that
    allows you to speak to the computer, commanding it to do whatever you expect it
    to do without having to speak in a way that the computer understands. It is the
    translator, the intermediary, that allows you and the computer to interact, and
    without it, the computer is entirely useless.The operating system’s important
    jobAs briefly touched upon, the operating system’s job is to manage all software
    and hardware on the computer. Software refers to the programming on a computer—it
    is a list of instructions on how a computer should handle and process certain
    information in order to properly perform the tasks that you have commanded. It
    ranges from programs, such as running your internet browser or playing a video
    file all the way to the system running your computer. Each of these programs is
    what you have your computer to do, and the operating system makes sure it is run
    properly while also utilizing the hardware.Hardware is the physical computer itself
    and all of the components that make it up. This includes the motherboard, the
    central processing unit (CPU), RAM, graphics processing unit (GPU), hard drive,
    power supply, and all other components that you use, such as the monitor, mouse,
    and keyboard, and anything else hooked up to your computer to use it. Each of
    these computer components has their own specific purposes, which come together
    to allow for the processing of the computer software installed.![](OEBPS/rsrc389.jpg)The
    operating system helps juggle all of those components together while also simultaneously
    managing the software and any user input, allowing for the computer to run. It
    ensures that each program that is functioning is able to access the proper hardware
    support necessary without infringing on the function of other programs at the
    same time. Essentially, the operating system manages it all to give you the smooth
    and seamless functioning you have come to expect from your technology through
    the following functions:'
