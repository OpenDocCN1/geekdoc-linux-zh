  trans: '

    * 语法有时晦涩难

    * 运行速度缓慢

    * 容易不小心遗漏关键内容

    * shell 语言的数据结构是字符串

    * 很难在 shell 中进行单元测试


    这些点每一个都促使了替代 shell 的想法。虽然 shell 已被用作一种合法的编程语言，但它并不完整——它的设计初衷并非为了成为一种完整的编程语言，而
    Python 是。


    Python 本身是一种解释型高级编程语言，旨在具有动态性。它旨在面向对象，并分层设计。它旨在被用作脚本语言，甚至可以作为两个不同应用程序或组件之间的绑定代理。Python
    非常容易学习，侧重于提供一个易于阅读的系统，使其比某些更复杂的语言更易访问，而那些语言可能强调旧、过时的短语或语法，目前仅仅是出于传统和习惯才使用它们。


    然而，熟悉并不总是一件好事。有时，比任何时候都需要的都是改变，或者至少以某种方式进行适应，以确保你能够持续成长。这正是 Python 和 bash 相遇的地方。


    因此，提高生产力的有效方法是减少对 shell 的使用，转而使用 Python 代码。因为 Python 更易读、速度更快，并允许合法的测试，所以转向它（至少在某些方面）似乎是有益的。


    有趣的是，大多数主流 Linux 发行版中已经默认安装了 Python。如果你打开命令行提示符并输入 `python`，你应该获得一个 Python 解释器。单这一点就表明，在考虑编写脚本时，使用
    Python 替代 bash 是值得的。单是其易用性就能节省时间。


    让我们来看看从关注 shell 脚本转向使用 Python 作为替代的一些最具说服力的理由：


    * 它是默认安装的

    * 它易于阅读且语法简单

    * 它是一种解释型语言

    * 它是一门功能完整的编程语言

    * Python 拥有标准库和大量的第三方库，以使用各种工具

    * Python 的标准库按日期和时间排序，允许你将日期转换为任何格式以与其他日期进行比较

    * Python 是一个更简单的过渡链接

    '
- fmt: "\nThe assertion here is not to step away from the shell altogether—the shell\
    \ absolutely has its own purposes. However, the shell also is weak in several\
    \ aspects. Think about how much nicer it would be to navigate through several\
    \ of your tasks in a much simpler manner—it would be nice to have syntax and commands\
    \ that make more sense rather than being remembered simply because of you now\
    \ that you were supposed to remember them.\n\nOf course, there are areas where\
    \ `bash` is, undoubtedly simpler. This is exactly why the two should be brought\
    \ together. When they are drawn together, they are able to bring out the best\
    \ in each other—you will have the best of both worlds thanks to having a system\
    \ that is capable of transitioning between the two with ease. `Python` is more\
    \ complete and more readily used in several different contexts whereas `bash`\
    \ was designed with Linux in mind. It is impossible to deny that some of `bash`\
    \ is just nicer to use. For example, consider moving a file from your desktop\
    \ to a directory on `bash`:\n\n```bash\ncd Desktop\nmv folder directory\n```\n\
    \nNotice how nice and neat that is. Now, in `Python`, it would look more like:\n\
    \n```python\nimport os glob\nfor fname in glob.glob('folder'):\n    os.rename(fname,\
    \ 'directory')\n```\n\nThere is no denying that the `Python` code is unnecessarily\
    \ bulky, especially when standing next to that short and sweet blurb from `bash`.\
    \ This is exactly why it would be best to utilize the two together rather than\
    \ trying to disentangle them and replacing one or the other.\n\nWhile we have\
    \ already discussed that it is possible for you to bring in your `Python` code\
    \ within your shell, it is also possible to go the other direction as well—you\
    \ can introduce your `Python` script within your shell and you can insert your\
    \ shell scripts within `Python` as well. All you need to do is import the `OS`\
    \ module. If you do so, you will be able to make use of your `bash` commands within\
    \ `Python` as well—this means that you are effectively able to mix and match your\
    \ commands with ease. Think of how children who have grown up speaking two languages\
    \ at home tend to seamlessly shift from one to the next within the same sentence,\
    \ inserting a few words in one language while also inserting some of the other\
    \ languages interchangeably, creating what sounds like something that would be\
    \ impossible to understand, but they do so with ease. This is what you would be\
    \ doing with `Python` by inserting `bash` as well.\n\nIn order to bring `bash`\
    \ language to `python`, all you have to do is:\n\n```bash\n$ python\n>>> from\
    \ os import *\n>>> system('sudo apt-get update')\n```\n\nAnd you should now have\
    \ access to both languages. You should absolutely try to tinker around with both\
    \ languages. If you are not familiar with `Python` yet, you may feel inclined\
    \ to go through the effort of learning it—it is incredibly simple to pick up and\
    \ if you were already able to pick up communicating with Linux, you should be\
    \ able to pick up understanding `Python` as well. All you have to do is put in\
    \ some of the efforts that once went to developing your skills with Linux toward\
    \ learning this system as well. You will likely find that with the increased productivity,\
    \ you will quickly grow fond of the change.\n\nIf you are unsure whether you have\
    \ `Python` currently installed on your system, you are in luck—finding out, you\
    \ will need to enter the following command:\n\n```bash\n$ python --version\n```\n\
    \nYou will most likely get an older and stable form of `Python` that is sufficient,\
    \ but you will likely want to upgrade that form into the more recent version.\
    \ This version is constantly changing, so it is for the best if you go check the\
    \ version that is available to you upon reading this book—you can do this by simply\
    \ searching for the most recent version online and then updating.\n\nIf you do\
    \ decide to pursue `Python` in particular, you will want to go and find some guides\
    \ and books, not unlike this one that you are reading right now to find out what\
    \ you need to know. Tutorials and web lessons are always fantastic starting stones\
    \ for you to begin experimenting with `Python`. Eventually, as you become more\
    \ comfortable and familiar, you may decide to begin intertwining your attempts\
    \ to use both languages together. You may even decide that you prefer `Python`\
    \ over using the shell, and that is fine too.\n\nIf you want to learn or improve\
    \ your knowledge about `Python` programming language, I recommend my book \"Python\"\
    \ which you can download here: [Python: 2 Books in 1 - Python Programming + Python\
    \ Machine Learning](https://www.amazon.com/Python-Programming-Comprehensive-Practices-Features-ebook/dp/B0834JSLW9/ref=sr_1_71?crid=YD02LWBDNF7F&keywords=python&qid=1580337773&s=digital-text&sprefix=pyt%2Caps%2C312&sr=1-71)\n\
    With this book you will learn quickly and effectively the most used programming\
    \ language.\n\nUltimately, technology is changing so rapidly that you cannot afford\
    \ to hold yourself back with a fear of changing or growing or shifting to something\
    \ new—transitioning and learning are absolutely beneficial to you.\n\nNow, as\
    \ this chapter and this book come to a close, it is time for you to begin thinking\
    \ about how to put everything together. It is time to consider whether you are\
    \ really interested in Kali Linux at all or if you would prefer to learn something\
    \ else. What is for sure, however, is that ultimately, you must guide yourself\
    \ and your own decisions in order to ensure that you are happy with what you have\
    \ chosen to do.\n\n## Conclusion\n\nCongratulations—you have made it to the end\
    \ of Kali Linux Hacking. This book is designed to be a crash course in learning\
    \ Kali Linux—the operating system designed specifically for penetration testing\
    \ by penetration testing professionals for the use of finding and repairing any\
    \ sorts of weaknesses or exploits that are found within the system. If you have\
    \ made it this far, you must have been quite interested in either installing Kali\
    \ Linux, or you have used this book as a guide, and regardless of which of those\
    \ holds true, thank you for joining me on this journey.\n\nWithin this book, you\
    \ were provided with basic information for Kali Linux. As a reminder once more,\
    \ Kali Linux is not a beginner’s distro for Linux. If you have read this book\
    \ and are entirely lost on several subjects, that is okay—but you may be better\
    \ off starting with a beginner’s book instead of one designed for people who know\
    \ what they are doing and are interested in doing better and more.\n\nUltimately,\
    \ your next step is entirely dependent upon you and what you think you want to\
    \ do. Do you want to practice on the actual distribution of Kali Linux? You may\
    \ go through the information and effort necessary to install your own copy that\
    \ you can begin to use and discover. If you feel like Kali Linux is not right\
    \ for you, whether due to it being too difficult, too different, or simply because\
    \ you do not know what you are doing, then you are probably better off with starting\
    \ with something simpler, such as Ubuntu and Mint.\n\nYes, this point has been\
    \ reiterated several times because it is that important. Even after having read\
    \ through this guide, if you are not entirely confident in yourself and your abilities,\
    \ it may be better for you to forego Kali Linux temporarily while you build up\
    \ your skills—and that is okay.\n\nPerhaps at this point, you have taken the advice\
    \ of the final chapter in this book and have decided to look into Python as well,\
    \ bettering your scripting abilities so you will be able to better utilize your\
    \ own commands. That is also a fantastic decision to make and will help guide\
    \ you on your journey as well, simply because you will have that much more knowledge.\n\
    \nNo matter what you choose to do next, whether it is pursuing more knowledge\
    \ about Linux in general or attempting to figure out how best to interact with\
    \ Kali Linux that you have already installed, one thing is for sure: You have\
    \ hopefully learned something during the process of reading this book. It is with\
    \ the utmost hope as this book wraps to a close that you have found this book\
    \ informative, helpful, and insightful to the grand world of Kali Linux and everything\
    \ it has to offer. No matter whether you are a newbie or someone with familiarity\
    \ with other Linux distros, good luck on your endeavors, and remember—just because\
    \ you feel like things may be complicated now does not mean that you have to give\
    \ up on it. You can put in the effort to learn if you want to, and with that effort\
    \ will come results. Good luck and remember to keep your penetration testing ethical.\n\
    \nAnd finally, if you have found this book to be informative, insightful, enjoyable,\
    \ actionable, or otherwise beneficial to you, please do not hesitate to leave\
    \ a review with your insight and feedback on Amazon. Your feedback and opinion\
    \ is always greatly appreciated. Thank you once more for accompanying me on this\
    \ journey, and good luck!\n"
