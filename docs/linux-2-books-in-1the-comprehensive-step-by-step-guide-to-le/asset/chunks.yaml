    等。你只需要稍微挖掘一下，就会发现其他几个适合你的。


    ### Windows Media Center 替代品

    `Windows Media Center` 是从 Windows 7 开始随 Windows 发行的主要娱乐系统。它允许你加载视频。然而，它对显卡的要求也相当高，需要高端显卡才能正常运行。正因如此，许多
    Windows 用户很久以前就抛弃了 `Windows Media Player`。即使你是它的常用用户之一，转到 Linux 也不会损失太多。


    相反，尝试看一看 `MC`（Media Center）。这个程序不仅限于视频——它还可以被用于几个其他功能和程序，例如监控摄像头、电信，以及运行你最初在设备上的所有媒体。它旨在作为一种凝聚程序，将你家中的家用电器（从照明到安全和媒体，以及其间一切）统一在一起。由于我们讨论它是作为媒体特定的替代品，因此我们将关注媒体功能。特别是，它被设计用于连接网络上的多个设备，允许你访问的文件可以在几个不同的位置被访问，这进一步让你确保始终可以使用你喜爱的媒体。还有其他可以替代
    `Windows Media Player` 的可用选项，例如 `MythTV` 和 `XBMC Media Center`。尝试玩其中几个，直到找到一个真正适合你的的。


    ### Adobe Acrobat Reader 替代品

