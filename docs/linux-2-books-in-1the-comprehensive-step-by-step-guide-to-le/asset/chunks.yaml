    就会错失很多，但你实际上可以在 Linux 上轻松找到替代方案。虽然如果你可以使用 `Movie Maker` 它对你来说是一个不错的选择，但一些不为人知的版本实际上更先进，并允许你获得可能无法获得的进一步功能。


    特别是，`Kdenlive` 被设计为 `Movie Maker` 的高级替代品。在 `Kdenlive` 中，你可以进行超高分辨率的图像处理。尽管是免费的，但它提供了你可能需要的全部软件——甚至更多。它提供了如色彩校正、运动跟踪、音频母处理等功能，旨在为了在你从
    Windows 切换到 Linux 时提供你可能需要的一切。毕竟，艺术追求不应因为操作系统的不同而受苦。更棒的是，像本章讨论的所有其他程序一样，它是免费的。如果
