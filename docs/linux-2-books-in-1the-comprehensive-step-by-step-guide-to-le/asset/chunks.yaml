    skills to cause problems.Script KiddiesThese people do not get a color, but they
    are still important to mention. These people are usually uninterested in stealing
    information, but they still find enjoyment in taking codes that are already created
    and injecting them into servers in an attempt to cause problems. They are most
    likely to utilize their skills in techniques such as a DDoS to flood a website
    just to annoy people without any real purpose.HacktivistsAs briefly touched upon,
    hacktivists are those motivated by politics. They may be lumped into the black
    hats, though they are usually hacking in an attempt to bring to light something
    of importance toward their cause. They may try to release information or records
    that are supposed to be kept under wraps, or they may decide to actually cause
    issues for a company. They may even attempt to fight terrorist groups thanks to
    their impressive working knowledge. They are trying to lead to positive change,
    even though they may be using negative methods to achieve it. They are motivated
    by their cause above all.White Hat (Ethical Hacking)The last classification of
    hackers is the white hat—these are known as ethical hackers. The ethical white
    hat hackers typically are hacking in an attempt to bolster defenses. These people
    are intentionally trying to hack into the software in order to help a company
    strengthen its own defenses as exploits and vulnerabilities are identified. These
    people are most often found in cybersecurity careers, trying to help keep your
    sensitive information safe and secure from other people’s attempts to steal it.
    These people are often trained in IT security or computer science and then certified
    by the EC-Council. This means that they must complete an intensive class and pass
    an exam, which often involves the training on how to handle the most common and
    current security domains with hundreds of attack techniques and technologies.
    The white hat hacker must also maintain these credentials with annual education
    credits.Typically, if you want to become a white hat hacker, you are interested
    in helping people. You want to defend people and you want to do it in a way that
    is lawful, acceptable, and beneficial to everyone involved. You want to eliminate
    the vulnerabilities within the system to protect it from damage rather than attempting
    to go vigilante justice on someone such as the red hat hackers, who may have their
    hearts in the right place but go about things in a way that is just as bad and
    destructive as the black hat hackers.![](OEBPS/rsrc38W.jpg)What is Cybersecurity?As
    touched upon earlier, the invention of servers and the birth of hackers also brought
    with it the creation of cybersecurity. Cybersecurity is crucial for those who
    are intending to rely on servers and databases—without cybersecurity, there would
    be no defense system. Cybersecurity allows for the defense of any internet-connected
    system, meaning it protects your hardware, software, and data from falling victim
    to cyberattacks. When what needs to be protected is on a server or a database
    of any sort, there are two different ways that it must be protected—physically
    from being damaged or taken away, and also digitally in order to protect from
    those who attempt to access it via the network and steal or harm protected information.
    Cybersecurity, then, has one specific goal: protecting IT assets from being attacked
    in order to ensure that the information and data that is housed within those IT
    assets remain protected and secure for the benefit of everyone.![](OEBPS/rsrc38X.jpg)Because
    so much data out there is so quite sensitive and should be protected, cybersecurity
    is absolutely essential. Not only the individual user’s data is protected when
    implementing cybersecurity practices, but the company implementing the practices
    is also protecting itself. Because the likelihood of a massive breach drops with
    the usage of cybersecurity, the likelihood of major negative press attention also
    goes down. Cybersecurity helps lessen the risk of breaches, ransomware attacks,
    and identity theft of individuals, and though cybersecurity can be difficult to
    maintain due to the ever-changing world of technology and IT, maintaining it has
    serious benefits.Cybersecurity practices should be used by anyone who is using
    anything connected to the internet—whether you are an employee, an owner of a
    server, or an individual user, there are steps that you can take to avoid falling
    for the traps of hackers or those who seek to exploit your data. It all begins
    with your password. However, there are also many other points where the security
    of your personal data as a user is no longer in your own hands and it is up to
    the company in charge of your data to protect it.Unfortunately, cybersecurity
    runs into one specific problem that is not likely to go away any time soon: Because
    technology is constantly evolving and changing, and because networks and data
    standards change as well, as do hackers, who inevitably find more exploits, cybersecurity
    is an endless job. There will always be another exploit to find and patch up.
    There will always be another attempt to steal data. This means that the cybersecurity
    profession is not likely to go anywhere any time soon.Typically, these threats
    are approached by focusing the bulk of the resources on protecting the most crucial
    components to protect against any threats that are known to be out there and significant.
    However, this approach also leaves some systems either less defended or undefended
    or leaving the system open to threats that may be deemed to be less known, or
    those that are less dangerous.The Elements of CybersecurityCybersecurity, despite
    the constant fluctuation and change in the system, also has a series of elements
    that must be maintained. These elements are essentially the backbone for cybersecurity—it
    needs to have each of these to be deemed successful and truly protect the data
    and infrastructure it was tasked with. These elements include:'
