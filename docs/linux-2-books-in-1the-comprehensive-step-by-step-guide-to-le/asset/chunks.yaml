    sure that other certificates are issued and verified.Intermediate CertificateThe
    intermediate certificate is the one in the middle—certificate authorities do not
    tend to directly issue their own certificates. Because of this, they instead use
    what is known as an intermediate root. This certificate is used by the CA to sign
    in and allow them to issue any end user SSL certificates. In doing this, there
    can be several intermediate root stops before you eventually arrive at the SSL
    certificate. Eventually, however, you reach the end user, who gets the SSL.SSL
    CertificateThe final certificate, the end result, is the secure sockets layer—this
    is the global standard technology that allows for the use of encrypted communication
    between a browser and a server. These are used by millions of people and businesses
    everywhere to protect data from hackers or identity thieves. Effectively, the
    SSL allows for the conversation between the user and the server to be kept private,
    even though it is happening on the public web network. These are typically issued
    by a certificate authority, who is trusted to ensure that the data will, in fact,
    be protected as promised.The SSL layer comes in several different types of certificates—they
    can be domain validated, organization validated, or extended validation.Domain
    validated SSL certificates tell the least and promise the least—all you need to
    do to get this SSL is prove that you are using the right domain name. This does
    show that the data is being sent and received as intended to the one who holds
    the certificate, there is no way to prove who that certificate holder is.Organization
    validated SSL certificates provide slightly more assurance—they confirm that the
    holder does have some sort of right or claim to use a specific domain but also
    undergo extra confirmation to ensure that the individual with the certificate
    does, in fact, own the domain.The extended validation certificate, on the other
    hand, is issued after applicants are able to prove that they are who they say
    they are to the standards of whatever CA is vetting them.This process requires
    the verification of the existence of the individual or entity who wishes to apply
    for the certificate, while also guaranteeing that the identity matches any official
    records as well. Effectively, the entity is verified and authorized to use that
    domain and certificate.Generating Self-Signed SSL CertificatesAs you are likely
    to expect, Kali Linux comes with its own program that allows it to create certificates.
    This is done through OpenSSL. While this will not always work for you and may,
    in fact, get rejected when you attempt to use it, you are able to do so. You are
    able to provide all of the encryption benefits with your self-signed SSL certificate,
    but you will not get the authentication benefits. This means that not many people
    will be able to trust your site, and it is likely that anyone who tries to access
    your site will get a warning that says that your site or server is not, in fact,
    verified and therefore cannot be guaranteed.Despite that, it can be useful to
    have, even if just for yourself. This section will discuss the steps necessary
    to create your own SSL certificates.First, open up OpenSSL. There, you must use
    the following commands:openssl genrsa –out key.pem 2048openssl req –new –sha256
    –key key.pem –out csr.csroepnssl req –x509 –sha256 –days 365 –key key.pem –in
    csr.csr –out certificate.pemThe first command triggers a 2048-bit RSA private
    key—this is the recommended format for your key to be in and it will be generated
    at that first command.The second command triggers the creation of a certificate
    signing request—you will likely get questions at that second command and it is
    your job to answer them as accurately as possible to guarantee that you are seen
    as trustworthy.The third command triggers the generation of a self-signed x509
    certificate that is usable on web servers. This is exactly what you were looking
    for.Remember, these will encrypt the site and make sure that your data is protected,
    but it does not actually offer authentication benefits. They can obviously still
    have their uses, such as when protecting a site during early stages, but due to
    the warning, you are not likely to want to keep this as your only form of verification
    if you will be expecting long-term traffic or you will be handling any sort of
    sensitive information such as payment methods or addresses.Ultimately, you will
    need to figure out just how worthwhile paying for a legitimate certificate may
    be if you do not want to deal with security warnings chasing people away.Chapter
    17: Bash and Python ScriptingBash itself is a shell—it stands for Bourne Again
    SHell, and it serves an important purpose. It allows for starting the server,
    confirming that the server is open, and working to keep everything running smoothly.
    Effectively, the shell on a system is meant to take any commands that you input
    through your keyboard in order to tell the operating system what to do. This was
    the only real way to interact with your Unix-like system back in the day, but
    these days, we have access to so much more. You are able to use GUIs alongside
    CLIs these days, meaning that you no longer have to type out what you want your
    computer to do if you want it to do so. This is why instead of typing out where
    your file is in order to locate it, you can simply go to your start menu, click,
    search through the files manually, and then open it up.There is no denying that
    bash has a history—it is what was effectively initially used by those who were
    accessing their original systems, and while it was absolutely useful then, there
    is question now about whether it is still the best way to be interacting. It is
    like the stubborn old coworker that has been at her job forever and refuses to
    change, despite the fact that her way is clunky, inefficient, and really, redundant.
    Everyone would be happier if she went to the easier version, and productivity
    and ease of the work would go up, but she refuses.This same sort of resistance
    appears with bash and transitioning from bash to another language, such as Python,
    which is currently one of the top contenders as a replacement.The idea these days
    is that the shell may be becoming obsolete—there are better ways to interact with
    your operating system. In particular, the shell has several concerning features:'
  toc: []
  trans: "\n\n# 使用 Metasploit\n\n当你安装好 Metasploit 并准备好使用时，你需要做的就是通过某种方式收集信息，无论是通过首次端口扫描，还是寻找漏洞扫描器来找到进入点。一旦进入系统，你只需要选择一个利用程序（exploit）和一个载荷（payload），Metasploit\
    \ 就会为你完成其余的工作。有效而言，利用程序是在防御性更难的网络中识别弱点的方法。\n\n该框架专门设计用于利用各种模型和接口，例如 `msfconsole`\
    \ 交互式光标界面等。它可以在终端/`cmd` 中运行，并且兼容 Metasploit 社区 Web 界面，后者将支持渗透测试。\n\n## 安装 Metasploit\n\
    \n然而，在使用 Metasploit 之前，你必须先安装它。安装它需要你首先禁用所有的防火墙和杀毒软件。由于该文件本身的原因，当你尝试在防火墙和杀毒软件运行的情况下安装它时，它通常会被视为恶意文件。这会中断你的安装。因此，最好的办法是在继续之前先禁用防火墙和杀毒软件。但这也意味着你必须确保你的下载来源是合法且安全的。如果你不小心，可能会无意中下载了实际上对你可能危险或问题的程序。\n\
    \n在关闭防火墙和杀毒软件后，请确保你也拥有管理员权限。在 Kali Linux 中这不应该是问题，因为你默认应该已经拥有 `root` 用户访问权限，但由于某些原因你没有，或者你正尝试在不同的\
    \ Linux 发行版上安装 Metasploit，你就需要确保自己也拥有该管理员权限。最后，要安装 Metasploit，最好的办法是从 Rapid7 网站安装。这样做允许你获取适用于你特定操作系统的安装程序。它还包含一个自包含的环境，你可以用它来更新和运行框架。这意味着你需要的一切都将在初始安装过程中得到处理。当然，如果你选择，也可以手动进入配置\
    \ Metasploit，但为了本书的目的，这一步骤是不必要的并将跳过。\n\n当你获得文件后，启动安装程序。它会提示你输入特定的框架。作为 Kali Linux\
    \ 用户，你应该发现这已经预装好了，无需继续后续操作。\n\n## 管理 Metasploit 数据库\n\n现在，是时候在继续之前停止并完成数据库信息的配置。当你准备好管理数据库时，你需要使用\
    \ `msfdb` 脚本配置 `postgresql` 运行以便以便数据库存储在 `~/.msf4/db/` 中。准备好启动后，你将使用以下命令：\n\n\
    ```bash\n$ msfdb init\n```\n\n这将触发数据库启动，然后你可以使用最适合你的几个命令中的任何一个。这些命令提供了额外功能，并帮助你管理可用空间。在此阶段你可能需要包含的最常用命令是：\n\
    \n- `msfdb reinit`: 这会导致你的数据库被删除并重新初始化以刷新它。\n- `msfdb delete`: 使用此特定命令将导致你的数据库被完全删除，而像上一个命令那样重新初始化。\n\
    - `msfdb start`: 此命令重新启动数据库，允许它开始运行。\n- `msfdb stop`: 使用此命令将完全停止数据库的运行。\n- `msfdb\
    \ status`: 此命令将允许终端打印当前数据库状态，在终端内显示所有关键信息。\n\n## Metasploit 数据存储器 (Datastore)\n\
    \n除了目前列出的所有内容外，还有数据存储器——这是 Metasploit 框架的另一个核心组件，经常被完全忽略。这是一系列值，允许你在 Metasploit\
    \ 框架内配置你所需的任何行为。数据存储器允许接口更改设置，而载荷能够修补操作码（opcodes），而利用程序能够指定特定参数。这也允许框架在模块之间进行传递。\n\
    \n特别地，Metasploit 有两个不同的数据存储器：全局数据存储器和模块数据存储器。你需要熟悉两者才能有效使用 Metasploit。\n\n全局数据存储器允许所有模块都使用它。当数据存储器选项被设置时，所有模块都将访问它。要定义全局数据存储器选项，你需要使用命令：`setg`。\n\
    \n另一方面，模块数据存储器被设计为只有指定的模块才能利用它，而不是任何模块。\n\n## Metasploit 工作空间 (Workspaces)\n\n\
    Metasploit 内部的工作空间允许你对数据库中的主机和数据进行分段。这允许你使用工作空间在你想要测试的任何分段之间创建隔离。例如，假设你想为组织内的每个子网创建一个工作空间，因为你想将主机数量限制在指定的网络中。这将导致你创建工作空间，例如每个部门一个。这意味着每个组织的部门都将获得自己的工作空间。\n\
    \n当你使用工作空间时，你可以导入数据、处理该数据，然后将数据直接导出，以确保数据可以自动重复使用。这也允许同一个工作空间自动报告有关正在交互的任何当前主机的信息。这允许漏洞等信息进行传输。\n\
    \n如果你想创建一个工作空间，必须使用带有 `-a` 选项的 `workspace` 命令。创建的任何工作空间都会成为当前使用的。想象一下，你想为组织中的\
    \ A、B、C 三个部门各建立一个。你会写道：\n\n```bash\nmsf workspace -a A\nmsf workspace -a B\nms\
    \ workspace -a C\n```\n\n总的来说，当然，如果你准备好使用 Metasploit，你会发现参与其中实际上非常容易。你只需要知道如何通过该系统以及如何理解你所看到的内容。例如，当你知道可用哪些类型的模块时，你就可以选择那些适合你的模块。因为\
    \ Metasploit 已经挤满了各种为你设计的信息，这些信息确保了你只需少数命令就能做几乎任何事情，而无需不断手动告诉系统你想让它做什么，因此它实际上非常用户友好。这就是它变得如此流行的原因。\n\
    \n最终，你使用 Linux 自带的免费版本应该完全没问题，尽管如果你愿意付费，也有升级版本可用，最终这取决于你的个人观点，你必须根据自己的想法和意愿做出决定。当然，升级版本尽管价格昂贵，但它们的设计对你来说非常强大。它们针对的是高技能的渗透测试专业人员，他们清楚自己在做什么以及确切知道将得到什么，并且能够证明那个巨额价格是合理的。然而，你不必这样做。\n\
    \n# 第 16 章：数字证书\n\n就像现实世界中一样，我们需要携带身份证明来证明我们的身份，特别是当我们做某些重大事情时（如买车或贷款），你的互联网连接也需要某种程度的身份识别。这就是数字证书的用场。当你拥有装满宝贵信息的服务器时，你可能希望确保你的信息在任何时候都尽可能受到保护——这是合的。然而，你如何才能确定访问你服务器上信息的人确实是他们所说的那样，或者确实被允许访问它呢？\n\
    \n特别是在今天，当我们如此担心数据被盗取或接管时，很容易感到我们的数据面临风险，而且这很有理由——确实如此。但是，当你引入数字证书层时，你为你的服务器增加了一层额外的安全，或者让你觉得你的隐私信息受到了保护。你可以确保，尽管你使用的是可能位于公共互联网上的站点，但你的数据本身是经过过的。\n\
    \n然而，如果你有一个局域网（LAN），你可能不需要随公共网络一起的那种主要认证。与风险相比，支付这些证书的成本可能是不必要的。在这些情况下，保护网络最好的主意是使用自己的\
    \ `CA` 或证书机构——这会自动签署安装在你的局域网内的任何证书。通常情况下，这是通过一个名为 `OpenSSL` 的工具完成的——它是 Kali Linux\
    \ 预装的。\n\n## 什么是数字证书？\n\n数字证书本质上是将互联网上公钥的所有权与拥有它的个人链接起来的方法。这些用于共享加密和验证数据的密钥。在数字证书中，有几个起到不同作用的层：\n\
    \n- 经过认证的公钥：当你使用这些时，你实际上获得了一种保护数据的方法。\n- 元数据：允许人们知道内容没有被更改过。\n- 数字签名：由机构生成。\n\
    - 私钥：由所有者持有。\n\n你你可以确保，尽管你使用的是可能位于公共互联网的站点，但你的数据本身是经过认证的。\n\n## 证书机构 (Certificate\
    \ Authorities)\n\n证书机构（CA）是互联网上受信任的实体，它们验证证书申请者的身份并颁发数字证书。由于数字证书，大多数 Web 浏览器利用它们来确保你看到的内容是真实的。由于数字证书涉及到\
    \ `PKI`（公密钥基础设施），我们将稍后讨论。\n\n## 证书类型 (Types of Certificates)\n\n总的来说，有几种证书类型，取决于信任链：\n\
    \n- **根证书 (Root Certificate)**: 根证书是信任链的顶端，它是自签名的且被信任的。\n- **中间证书 (Intermediate\
    \ Certificate)**: 中间证书位于中间，由根证书签发，以允许终端用户证书。\n- **SSL 证书 (SSL Certificate)**:\
    \ 最终证书是安全套接层——这是全球标准，数百万的人使用它来加密通信。\n- **域名验证 SSL (Domain validated SSL)**: 你只需要证明你拥有特定的域名。这显示数据在发送和接收时是安全的，但它并不证明证书持有者的真实身份。\n\
    - **组织验证 SSL (Organization validated SSL)**: 提供稍多保证——他们确认持有者确实拥有域名，但需要对他们进行额外的验证。\n\
    \ ** **扩展验证证书 (Extended validation)**: 在申请人证明他们是他们所说的人之后颁发，这需要 `CA` 进行进行审核。\n\n\
    ## 生成自签 SSL 证书 (Generating Self-Signed SSL Certificates)\n\n正如你预期的，Kali Linux\
    \ 自带了一个允许创建证书的程序。这是通过 `OpenSSL` 完成的。虽然这并不总是对你有效，并且在你尝试使用时可能会被拒绝，但你可以这样做。你可以通过你的自签\
    \ SSL 证书提供所有的加密优势，但你不会获得认证优势。这意味着没有多少人能信任你的网站，尝试访问你网站的人可能会收到警告。\n\n尽管如此，即使只是为了你自己也是有用的。本节将讨论创建自己的\
    \ SSL 证书的步骤。首先，打开 `OpenSSL`。在那里，你必须使用以下命令：\n\n```bash\nopenssl genrsa -out key.pem\
    \ 2048\nopenssl req -new -sha256 -key key.pem -out csr.csr\nopenssl req -x509\
    \ -sha256 -days 365 -key key.pem -in csr.csr -out certificate.pem\n```\n\n- 第一命令触发\
    \ 2048 位的 RSA 私钥——这是你的密钥应具有的推荐格式。\n- 第二命令创建证书签名请求——你可能会在第二个命令遇到问题，你的任务是尽可能准确地回答它们以确保被视为信任。\n\
    - 第三命令生成用于 Web 服务器的自签 `x509` 证书。\n\n"
- fmt: "\n* The syntax is obscure sometimes\n* It is slow\n* It is easy to accidentally\
    \ leave out something crucial\n* The shell’s language’s data structure is a string\n\
    * It is difficult to test units on the shell\n\nEach of these lends their hands\
    \ toward the idea of replacing the shell. While the shell has been used as a legitimate\
    \ programming language, it is incomplete—it is not designed to be a complete programming\
    \ language, but Python is.\n\nPython itself is an interpreted, high-level programing\
    \ language that is meant to be dynamic. It is meant to be object-oriented, it\
    \ is meant to be layered. It is meant to be used as either a scripting language\
    \ or even as a sort of binding agent between two different applications or components.\
    \ Python is quite simple to learn and is focused on providing an easily readable\
    \ system, allowing for it to be easier to access than some more complex languages\
    \ that may emphasize old, outdated phrases or syntaxes that are simply used out\
    \ of tradition and familiarity at this point. \n\nHowever, familiarity is not\
    \ always a good thing. Sometimes, what is needed more than ever is a change, or\
    \ at least to adapt in some way in order to ensure that you are able to keep growing.\
    \ This is where Python and bash meet.\n\nEffectively, then, the best way to up\
    \ productivity would be from moving away from the use of the shell and instead,\
    \ work with Python code instead. Because Python is easier to read, is faster,\
    \ and allows for legitimate testing, it seems like shifting over to it, at least\
    \ in some capacity would be beneficial.\n\nInterestingly enough, Python is already\
    \ installed by default on major Linux distributions. If you were to open a command\
    \ prompt and type in `python` you should be provided with a Python interpreter.\
    \ This alone suggests that it may be worth the use of Python over bash when considering\
    \ the creation of scripting. Thanks to the ease of use alone, it would save time.\n\
    \nTake a look at some of the most compelling reasons to shift from focusing on\
    \ shell scripts to using Python as a replacement instead:\n\n* It is installed\
    \ by default\n* It is easy to read and the syntax is simple\n* It is an interpreted\
    \ language\n* It is a fully-featured programming language\n* Python has access\
    \ to a standard library and plenty of third-party libraries in order to use all\
    \ sorts of utilities\n* Python’s standard library is sorted by date and time,\
    \ allowing you to put a date into any format to compare it to other dates\n* Python\
    \ is a simpler transitional link\n"
