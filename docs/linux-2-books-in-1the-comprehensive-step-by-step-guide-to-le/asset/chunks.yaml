    - `init 4`: 类似于 `init 3`，但用于某些研究。该状态对你现在来说本质上是无关。

    - `init 5`: 网络处于多任务处理状态，并且存在图形用户界面（GUI）。

    - `init 6`: 用于告诉系统重启。

    - `init s`: 告诉系统进入维护模式。

    - `init m`: 告诉系统进入维护模式。与 `init s` 同义。

