    # Chapter 1 Answer Key


    1. D. The operating system allows the user to control and interact with both the
    hardware and the software, but it is not the user him- or herself.

    2. B. If the `kernel` were to run out of space for necessary functions, the system
    would crash, so keeping the memory split between kernel and user guarantees that
    there is always enough space for the kernel to function.

    3. False. Linux was heavily influenced by Unix and Unix-influenced programs such
    as MINIX and GNU.

    4. False. Linux was coded with C.

    5. C. There is no limit to the number of times a `pid` can be reused, so long
    as there is never a current duplicate.


    # Chapter 2: Choose Your Distribution


    So, you’ve made it to Chapter 2, congratulations! You have gotten through the
    background information that you will need to understand in order to proceed and
    have decided that you do, in fact, want to use Linux as your OS. Unfortunately,
    it is not as simple as just deciding to use Linux. Remember, Linux itself refers
    to the Linux `kernel`-the core of the operating system. From there, there are
    several other components, and while the core remains constant, your decisions
    on all of the other aspects of the OS, such as the GNU, the X server, and more,
    can all drastically alter your experience.


    ![](OEBPS/rsrc38E.jpg)


    Some of the versions of Linux, known as Linux distributions, or more commonly
    shortened to “Linux distros,” will be easy enough to hop right in to using, while
    others could be your worst nightmare immediately upon installing it, such as Gentoo,
    which requires all programs, including the kernel, to be built from source.


    This chapter will guide you through understanding what a Linux distribution is,
    how to decide which distribution will be right for you and your usage, and then
    provide you with a brief overview of ten of the most common distributions you
    can find.


    ## What is a Linux Distribution?


    When you think of other operating systems, you would most likely think of Windows
    or macOS—two of the most commonly known and used operating systems out there.
    These are built from the ground up by a single company with incremental upgrades
    and changes, and because of that, you get distinct versions. You have Windows
    XP, Windows 7, Windows, 8, Windows 10, etc. with the latest version of Windows
    (Windows 10 at the time of writing this book), being the most up-to-date and supported.
    If you want to go out and buy Windows for your computer right now through Microsoft,
    your choice is to get Windows 10. Of course, you can get other, older editions
    through other sources, but they are not actively supported, nor are they going
    to always be updated for security. At a certain point, companies stop rolling
    out support for their older, more obsolete software.


    Unlike Windows or macOS, however, Linux is not created by a single company. Linux
    can be mixed and matched. So long as you have all of the right components together
    to create a complete OS, you can put it together. This means that you can, in
    fact, create an entire OS more or less from scratch, using the Linux `kernel`
    as your base, though that would be quite time-consuming, and you would have to
    put in some work to configure everything to work together. Alternatively, you
    can seek out Linux distributions.


    The Linux distribution is essentially everything all neatly packaged together
    for you. It takes all of the open-source information you would otherwise need
    to seek out on your own and puts it together into a single OS, not unlike what
    you would receive when purchasing licenses to use Windows or macOS. They decide
    which desktops you will have, which programs will be loaded up by default, and
    more, typically with a layer of their own custom interface.


    Of course, this also implies that there will be a nearly infinite number of different
    distributions available to you, all of which can provide all sorts of different
    features. This is why it is important for you to do your research before choosing
    one.


    ## How to Choose the Right Distribution for You


    Now comes the hard part—figuring out which distribution will be right for you.
    As you read through the rest of this chapter, consider the questions that will
    be asked here. What are you installing the OS on? What is the purpose of the OS?
    Do you have any experience? What kind of software availability to you want or
    need? What kind of desktop interface do you want? How often do you need updates?


    All of these are incredibly important questions to keep in mind. If you are not
    careful, you could end up with a version of Linux that you do not actually want,
    or cannot actually make use of.


    ![](OEBPS/rsrc38F.jpg)


    As you read through each of the ten distributions that are provided to you, you
    will be provided with a brief overview of the OS itself, whether it is suited
    for beginners or those with plenty of experience, how regularly it is updated,
    and how compatible it is. You will need to choose one that works best for you.


    ### Ubuntu


    The first distribution we will consider is Ubuntu. Launched in 2004, it is now
    officially available in three different versions: Desktop, Server, and Core. Each
    of these editions can be run on a computer or in a virtual machine, making this
    a popular choice in OS for cloud computing, especially thanks to its support for
    OpenStack. In fact, Linux is the most popular desktop Linux distribution currently
    available.


    Originally based on `Debian sid`, commonly referred to as the unstable distribution,
    thanks to its lack of stability. While `Debian sid` was unstable, Ubuntu has been
    built intentionally, avoiding the mistakes made within `sid` or other similar
    projects. In doing so, it created a web-based infrastructure, bug-reporting, and
    professional creation.


    This particular form of Linux utilizes `GNOME`, `Firefox`, and `LibreOffice` by
    default, all updated, and it utilizes regular, predictable support updates. Ultimately,
    the creation was a well-formed OS that also includes a migration assistant for
    those transferring from Windows, support for latest tech, and it is compatible
    with ATI and NVIDIA graphics cards.


    **Difficulty rating:** Good for beginners

    **Long-term support:** Regularly updated distributions every 6 months with long
    term support releases as well.


    **Pros:**

    * Regular updates on fixed cycle and support periods

    * Long-term support variants come with 5 years of updates for security

    * Beginner-friendly

    * Widely-used, meaning there is plenty of advice, opinions, and support available
    online


    **Cons:**

    * Incompatible with Debian

    * Regular updates often come with major changes that may be annoying to some

    * Variants that are not LTS only have 9 months of security support

