    \ that your host was unknown, you may need to try resetting the IP address one\
    \ more time, as there may be an error within the one that you set up./etc/hostsThis\
    \ command will allow you to configure the DNS locally instead of using external\
    \ IP addresses. When you use the /etc/hosts command, you will ensure that the\
    \ naming structure is right. It will allow you to manually enter in the IP address\
    \ and hosts of your choice to confirm that you are able to get the domain name\
    \ you were looking for.Diagnostic commandsping: This is how connectivity is tested.\
    \ Standing for Packet Internet Groper, ping is regularly used to identify that\
    \ connectivity between either LAN or WAN. It will make use of ICMP in order to\
    \ communicate with other nodes on the network.traceroute: This is a CLI that allows\
    \ for the tracing of the entire path from a local system to a separate system\
    \ on another network. It will record the number of hops between router IPs that\
    \ will have to occur to reach the server necessary.tracepath: This command allows\
    \ for the path to be traced to the destination discovering MTU. It will utilize\
    \ a UDP port.Similar to traceroute, but this particular form of tracing does not\
    \ require the same superuser privileges because it has no real options. It is\
    \ simply informational and will provide all the necessary information .netstat:\
    \ This CLI is used to display the information you need to know about your network\
    \ connections, any routing tables, statistics, and more that will be important\
    \ to understand with your networking system. It is also used to debug and check\
    \ to determine which programs are on which ports.Chapter 7 QuizCongratulations!\
    \ You have finished Chapter 7! You should now have a general idea of how networking\
    \ on your Linux machine will work and key features that you will encounter. As\
    \ with previous chapters, it is time for your 5 question quiz. This will help\
    \ ensure that you understand what has been presented within this chapter.\n\n\
    1.  What is a network?\n\n    1.  A group of people that you know\n\n    2.  A\
    \ group of devices that are connected together\n\n    3.  A group of software\
    \ that communicates with each other\n\n    4.  A group of neighbors that all share\
    \ the same internet provider\n\n2.  What is WAN?\n\n    1.  The internet\n\n \
    \   2.  Wide area network\n\n    3.  Widely accessible network\n\n    4.  Wonderful\
    \ access network\n\n3.  What happens if the hub of a network goes out?\n\n   \
    \ 1.  The whole network stops working\n\n    2.  Half of the network stops working\n\
    \n    3.  Only the hub stops working"
