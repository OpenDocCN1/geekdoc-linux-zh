    这些人完全不在乎规则或法律，事实上，他们创造了对网络安全和网络安全法的需求，将在本章后续部分进行讨论。人们对数据库和服务器的入侵导致了必须确保这些系统比以往任何时候都更高的的需求，从而导致了整个网络安全职业领域的诞生。黑客通常根据帽子的颜色进行分类。他们可能是黑色的、白色的、红色的、绿色的，甚至是蓝色的。理解这些颜色可以帮助你更好地掌握为什么人们可能会选择黑客，比上面列出的四个原因更具体。它可能还会帮助你理清为什么你想要自己通过
    `Kali Linux` 学习黑客。


    ### 黑帽 (Black Hats)

    当你想到黑客时，最可能指的是黑帽——他们这样做是为了不不法的目的。这些人是经常被发现入侵服务器并利用漏洞的人。他们这样做是为了偷取和赚钱。这些人虽然是罪犯，但也利用了一些他们学到的最基础的技术。尽管他们非常聪明，但他们的动力来自不光明的手段——他们关心的只有能获得什么。


    ### 灰帽 (Grey Hats)

    灰帽黑客比黑帽稍微复杂一点。他们是为了偷取而黑客，但通常是在不那么不法的情况下进行。他们可能对共享文件或破解软件以便在不支付许可费的情况下使用感兴趣。他们通常以剥削性的方式与服务器和网络交互，但并不是为了偷取其中的信息。相反，他们将自己的黑客行为更多地看作是一种喜欢的爱好。他们通常不会在发现漏洞时通知网站，但可能会提议收取费用进行修复。本质上，这些人的动力更多是看到自己并向他人证明他们是重要的。


    ### 红帽 (Red Hats)

    如果我们现在正在讨论性格阵营图，红帽将等同于“混沌善良”玩家——他们有兴趣阻止黑帽黑客，但他们不想觉得被规则和法律所限制。相反，他们会蓄意地颠覆任何权威，并按照自己的规则进行尝试。如果用“以火攻火”这个表达，红帽将用喷火器来对付火炬——一旦发现黑帽是谁，他们就会激进地尝试破坏黑帽对网络的访问权限，意在让黑帽完全无法造成更多伤害。尽管这些人倾向于存在于黑客社区的更远地区，但他们往往是最复杂的一群，想要按照自己的规则行事。


    ### 绿帽 (Green Hats)

    在黑客社区中，绿帽是初学者。他们通常是在尝试学习如何黑客，并乐于寻求帮助或寻找新知识。他们的动力来自学习和发展技能的渴望，雄心勃勃地追逐梦想，而不一定有他们想要遵循的清晰路径。然而，由于他们缺乏生活经验和技术知识，他们也可能是最危险的人群，因为他们还没有学会自己的行动会有多危险，也不具备足够的知识来扭转他们造成的损害。


    ### 蓝帽 (Blue Hats)

    蓝帽关心报复。尽管他们可能是恶意的，但通常情况下，他们只将黑客尝试指向他们认为得过他们的人。通常，他们对整个黑客领域来说是新手，可能甚至是脚本小子（script
    kiddies），但当坏事发生时，他们可能会决定将新学的技能派上用场，并故意且恶意地攻击一个目标。他们不想提高自己的技能——他们只想拥有制造问题的技术。


    ### 脚本小子 (Script Kiddies)

    这些人没有特定的颜色分类，但仍然值得提到。这些人通常对偷取信息不感兴趣，但他们仍然通过获取已经创建的代码并将其注入服务器来试图制造问题并从中乐趣。他们最可能利用自己的技能通过诸如
    `DDoS` 等技术来淹没网站，仅仅是为了干扰人们而没有任何真正的目的。


    ### 黑客行动者 (Hacktivists)

    正如简要提到的，黑客行动者是政治动机驱动的。他们可能被归类为黑帽，尽管他们通常通过黑客试图揭示对他们的事业具有重要意义。。他们尝试发布本应保密的信息或记录，或者他们可能决定为公司制造麻烦。得益于他们令人印象的工作知识，他们甚至尝试对抗恐怖组织。他们正试图带来积极的改变，尽管他们可能在使用负面方法来实现它。最重要的是，他们的动力来自他们的事业。


    ### 白帽（伦理黑客 - Ethical Hacking）

    黑客的最后一个分类是白帽——这些人被称为伦理黑客。伦理白帽黑客通常通过黑客行为来加强防御。这些人蓄意尝试入侵软件，以便在识别出漏洞和缺陷时帮助公司加强自身的防御。这些人最常出现在网络安全职业中，努力保护你的敏感信息免受他人的窃取尝试。这些人通常接受过
    IT 安全或计算机科学的训练，并获得 `EC-Council` 的认证。这意味着他们必须完成一门强化课程并通过考试，考试通常涉及如何处理最常见和当前的安全领域的培训，涵盖数百种攻击技术和手段。白帽黑客还必须通过年度教育学分来维持这些资质。


    通常，如果你想成为一名白帽黑客，你对帮助他人感兴趣。你想要保护人们，并且希望以合法、可接受且对所有参与者都有益的方式。你想要消除系统内部的漏洞以免受损害，而不是试图对像红帽黑客那样的人进行私刑，红帽虽然初衷可能是正确的，但他们的做法与黑帽黑客一样糟糕且具有破坏性。


    ![](img/rsrc38W.jpg)


    ### 什么是网络安全？

    正如之前提到的，服务器的发明和黑客的诞生也带来了网络安全的产生。对于那些依赖服务器和数据库的人来说，网络安全至关重要——没有网络安全，就没有防御系统。网络安全允许防御任何连接互联网的系统，这意味着保护你的硬件、软件和数据免受网络攻击的侵害。当需要保护的内容位于任何类型的服务器或数据库上时，有两种不同的方式必须对其保护——物理上防止被损坏或被夺走，以及在数字上防止那些试图通过网络访问并窃取或损害受保护信息的人。因此，网络安全有一个特定的目标：保护
    IT 资产免受攻击，以确保存储在 IT 资产中的信息和数据为了大家的利益保持受保护和安全。


    ![](img/rsrc38X.jpg)


    由于有这么多数据敏感且应该受到保护，因此网络安全是绝对不可少的。在实施网络安全措施时，不仅个人用户的数据得到了保护，实施这些措施的公司也在保护自己。因为随着网络安全的使用，大规模泄露的概率会降低，重大负面媒体关注的概率也会随之减少。网络安全有助于减少泄露、勒索攻击和个人身份盗窃的风险，尽管由于技术和
    IT 世界的不断变化，维护网络安全可能困难，但维护它具有重大的利益。


    任何使用任何连接互联网的设备的人都应该使用网络安全措施——无论你是员工、服务器所有者还是个人用户，你都可以采取步骤来避免落入黑客或那些寻求利用你数据的人的陷阱。这一切从你的密码开始。然而，还有许多其他位点，你作为用户的个人数据安全不再掌握在你自己手中，而是由负责你数据的公司来保护。


    不幸的是，网络安全遇到了一个短期内可能消失的特定问题：由于技术在不断演变和变化，由于网络和数据标准随之变化，黑客也是如此（他们不可避免地发现更多漏洞），网络安全是一项无休止的工作。总会有另一个漏洞等待发现和修复。总会有另一个窃取数据的尝试。这意味着网络安全行业在短期内不太可能消失。


    通常，应对这些威胁的方法是将大部分资源集中在保护最关键的组件上，以防御任何已的重大威胁。然而，这种方法也会导致某些系统处于防御较弱或无防御的状态，或者让系统暴露在被认为不那么已知或不那么危险的威胁之下。


    ### 网络安全的要素


