- fmt: "\n*   `Kernel initrd`: initial RAM disk—allows for the initial ability for\
    \ the boot loader to load a RAM disk.\n*   `Vmlinux`: ELF (executable and linkable\
    \ format) based file that is the uncompressed version of the kernel image for\
    \ debugging.\n*   `GRUB file`: The bootloader package.\n*   `/dev`: These are\
    \ essential device files. These may include terminal devices, devices attached\
    \ to the system, or USB.\n*   `/etc`: These files are host-specific but still\
    \ system-wide configuration files. You will find all of your programs’ various\
    \ configuration files within this section, as well as the startup and shutdown\
    \ shell scripts that will be necessary to either start or end your programs.\n\
    *   `/home`: This is where you will find personal settings, your files that you\
    \ have saved, and home directories. If you have downloaded and saved it, it will\
    \ be here. It will most likely save with your profile or computer name in a format\
    \ like `/home/NAMEHERE`.\n*   `/lib`: This is the home to any libraries that are\
    \ necessary for the binary files that you have saved in `/bin/` and `/sbin/`.\n\
    *   `/media`: This is where you will find mount points for removable media. Most\
    \ often, you will see the name of the format of the mount here, such as `/media/cdrom`\
    \ if you have insterted a CD, or `/media/usb-drive` for a USB drive.\n*   `/mnt`:\
    \ This refers to temporarily mounted files. In this directory, temporary filesystems\
    \ can be mounted by sysadmins.\n*   `/opt`: This refers to optional application\
    \ software. These files will house add-on applications, and they should fall under\
    \ `/opt`, or a subdirectory somewhere within `/opt`.\n*   `/proc`: A virtual system\
    \ that houses process and kernel information. Typically, this is automatically\
    \ generated by the system, with information about the current running process.\n\
    *   `/sbin`: This is another file for binary executables, but `/sbin` files are\
    \ typically used for maintenance purposes by the system admin.\n*   `/srv`: Standing\
    \ for “service,” `/srv` holds data that is related to server-specific functions\
    \ or services.\n*   `/tmp`: These are temporary files that are most likely not\
    \ going to be preserved when the system eventually shuts down and reboots. Typically,\
    \ these are also restricted in the size they can take up.\n*   `/usr`: This is\
    \ the secondary hierarchy level for read-only user data. This will house most\
    \ of the user utilities and applications. It is filled with several different\
    \ files, such as:\n    *   `/usr/bin`: binary files for user programs\n    * \
    \  `/usr/sbin`: the system admins’ binary files\n    *   `/usr/lib`: libraries\
    \ for `/usr/bin` or `/usr/sbin`\n    *   `/usr/local`: Programs that have been\
    \ installed from their sources\n    *   `/usr/src`: the Linux kernel sources\n\
    \n# The Process Architecture of Linux\n\nProcess architecture is the design that\
    \ dictates the hierarchy of processes and systems when transforming any inputs\
    \ to outputs in computing. While this sounds complicated to understand at a glance,\
    \ hopefully, this subchapter will help you get through this process with ease.\n\
    \n## The purpose of the process architecture\nWithin the Linux kernel are several\
    \ subsystems, and the most important is the process scheduler. The purpose of\
    \ the process scheduler is to control any access to the CPU, regardless of whether\
    \ the access is via user process or from another kernel subsystem. This is all\
    \ done by the process scheduler, which can itself be divided into four distinct\
    \ modules as it interacts with the rest of the computer.\n\n## Linux processes\n\
    Commands issued to Linux trigger processes. When you insert a command into Linux,\
    \ then, a new process begins. This process is assigned a 5-digit ID that allows\
    \ the OS to track the processes—this will be known as the `pid` (process ID).\
    \ While `pids` may be recycled, no two processes will share the same `pid` at\
    \ the same time due to the `pids` being the process through which Linux is able\
    \ to track the process in the first place.\n\nThis process is run one of two ways:\
    \ In the foreground or the background. When in the foreground, where processes\
    \ start by default, you are able to insert your input to the keyboard, and you\
    \ get output on the screen. However, while these processes are running in the\
    \ foreground, you are unable to complete other processes as well. For this reason,\
    \ sometimes, processes get booted to background processes, where they run in the\
    \ background, with no access to keyboard input, until that input becomes required.\
    \ With it running in the background, other processes can be handled at the same\
    \ time, meaning you can multitask until you are required to input further data.\n\
    \nThe process runs as one of three distinct types: Parent and child, zombie and\
    \ orphan, or daemon processes. Each of these different process types function\
    \ slightly differently.\n\n*   **Parent and child process**: This occurs when\
    \ a process creates another know-how. The created process is known as the child\
    \ process while the parent process is the one that triggered the second.\n*  \
    \ **Zombie and orphan process**: Upon finishing its function, the child process\
    \ becomes terminated, and `SIGCHLD`, the signal from the interface to the parent\
    \ process, informs the parent process of the termination of the child process.\
    \ However, sometimes, the parent process is terminated before the child process\
    \ terminates, creating a situation in which the child process is orphaned. The\
    \ parent process still has an entry to the process table but is not functioning.\n\
    *   **Daemon process**: These processes are system-related and run in the background,\
    \ most often running with permissions of `root` and waiting for processes that\
    \ will work with them.\n\n## Process scheduler modules\nThe process schedule comes\
    \ in four modules that will work together to organize the processes. These modules\
    \ are:\n\n*   **The scheduling policy module**: This module judges which processes\
    \ are granted access to the CPU, granting fair access to CPU to all processes.\n\
    *   **The architecture-specific modules**: This is actually several modules—they\
    \ are designed to share an interface that allows for the abstraction of details\
    \ of any computer architecture. Their purpose is to communicate with the CPU in\
    \ order to suspend or resume processes through knowing what information is needed\
    \ to be preserved for processes and executing assembly codes that directly interact\
    \ with whether a process with be suspended or resumed.\n*   **The architecture-independent\
    \ module**: This module is the center of it all—it communicates first with the\
    \ policy module to decide which process goes next, then tasks the architecture-specific\
    \ schedulers to resume the right process. It then interacts with the memory manager\
    \ to make sure that there is enough memory hardware available for the process\
    \ to run effectively.\n*   **The system call interface module**: This module allows\
    \ user processes to access only resources that are intentionally and explicitly\
    \ exported by the kernel. This regulates the divide between user and kernel memory.\n\
    \nAs pictured in the graphic below, the architecture-independent module is at\
    \ the heart of this entire process and directly interacts with each of the other\
    \ modules, allowing the entire process to run together effectively in a way that\
    \ actually works. The scheduler essentially manages it all, with an entry for\
    \ each process. The entire graphic encompasses what is known as the process scheduler.\n\
    \n![](OEBPS/rsrc38D.jpg)\n\n# Chapter 1 Quiz\nCongratulations! You have made it\
    \ through Chapter 1. Try to answer these questions to ensure you understand the\
    \ basics before moving on. The answer key will be on the page directly after this\
    \ quiz.\n\n1. What is the operating system?\n    1. The person or people operating\
    \ the system\n    2. The program that controls the hardware\n    3. The program\
    \ that controls the software\n    4. The program that controls the hardware and\
    \ software\n    5. All of the above\n    6. None of the above\n\n2. Why do you\
    \ need to keep the kernel space separate from the user space?\n    1. Because\
    \ you don’t want the user space to run out of memory\n    2. Because you don’t\
    \ want to run out of space for the operating system\n"
