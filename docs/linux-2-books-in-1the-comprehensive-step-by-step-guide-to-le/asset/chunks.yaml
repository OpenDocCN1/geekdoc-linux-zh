  trans: "\n\n### 步骤 3：安装操作系统\n现在是时候安装你选择的 Linux 发行版了。在 `VirtualBox` 窗口中点击启动箭头。它将打开一个标题为“选择启动磁盘”（Select\
    \ start-up disk）的窗口。点击下拉菜单旁边的文件夹，在这里你可以选择你发行版的 ISO 文件。之后，你只需点击“启动”，操作系统就会开始安装。\n\
    \n### 步骤 4：关闭虚拟机\n当你完成对机器的操作时，请忍住直接点击退出窗口的冲动。相反，点击 `File`（文件）菜单并选择关闭选项，同时选择“保存虚拟机状态”。这将确保你能够保留虚拟机内的信息。\n\
    \n### 在 macOS High Sierra 上通过虚拟机安装 Linux\n在编写此本书时，当前的 `macOS` 版本是 High Sierra。在\
    \ High Sierra 上通过虚拟机安装 Linux 与你在 Windows 上的操作过程大部分相似。考虑到此时你已经通过引导完成了最困难的过程，这将会是所有指南中最短的一个。在本章中，你唯一需要做的新操作是在\
    \ `macOS` 上安装 `VirtualBox`。之后，你可以按照上一个小节中的详细步骤进行操作。\n\n#### 步骤 1：运行 VirtualBox\n\
    1. 开始运行 `VirtualBox` 安装程序。你可能会看到一个警告，提示 `macOS` 不允许不安全的系统扩展。只需点击“下一步”继续即可。\n2.\
    \ 安装结束时，它会失败。不要担心失败，继续按照本教程操作。\n3. 进入 `System Preferences`（系统偏好） > `Security &\
    \ Privacy`（安全性与隐私）。在底部应该有一个提示，显示系统软件被阻止。在窗口左下角点击锁头。它会要求你输入密码。输入后，点击提示程序阻止加载的消息旁边的“允许”（Allow）。\n\
    4. 重新加载 `VirtualBox` 安装程序。这次应该就能顺利通过了。\n\n此时，该过程与在 Windows 中打开虚拟机基本相同。两者之间唯一的区别在于安装过程。\n\
    \n### 第 3 章测验\n恭喜你！你已经完成了第 3 章。至此，你应该准备好在自己的设备上加载 Linux 了。尝试回答这些问题，以确保在进入第 4 章之前已经掌握了基础知识。答案位于位于测验直接随后的页面。\n\
    \n1. 安装 Linux（无论是在硬件上还是在虚拟机上）需要哪些工具？\n   1. ISO 文件\n   2. USB 闪盘\n   3. `Virtualbox`\n\
    \   4. A 和 C\n   5. 以上所有\n   6. 以上都不是\n2. 在同一系统上运行多个操作系统需要什么？\n   1. `Virtualbox`\n\
    \   2. USB 闪盘\n   3. 硬盘上的一个分区\n   4. 拥有两个硬盘的电脑\n   5. 以上所有\n   6. 以上都不是\n3. 什么是虚拟机？\n\
    \   1. 一种能够在操作系统内部同时运行操作系统的计算机\n   2. 一种将操作系统与计算机操作系统其他部分隔离开的方法\n   3. 一种可以测试软件的方法\n\
    \   4. 以上所有\n   5. 以上都不是\n4. 判断对/错：如果你想运行 Linux，你就需要一个虚拟机。\n5. 判断对/错：你用来加载 ISO\
    \ 的 USB 闪盘将开箱即用是可用的。\n\n### 第 3 章答案\n1. **A**：列出的组件中，运行 Linux 仅需要用于分发操作系统的 ISO\
    \ 文件。在虚拟机上安装时可以跳过 USB 闪盘，而在带有 USB 的硬件上安装时也可以跳过 `Virtualbox`。\n2. **C**：列出的必要组件只有操作系统之间的分区。`Virtualbox`\
    \ 是一个特定的虚拟机，但还有其他几个可以替代它；USB 闪盘不是必须的；你也不需要两个硬盘——虚拟机的意义在于对单个硬盘进行分区以容纳多个操作系统。\n\
    3. **D**\n4. **错误**：你可以将 Linux 安装到硬件上，从而跳过对虚拟机的需求。\n5. **错误**：你必须格式化 USB 闪盘才能准备好存放\
    \ ISO。\n\n### 第 4 章：Linux Shell\nLinux 刚安装完成后，现在是时候开始与你的新操作系统交互了。这主要通过被称为“shell”的工具来实现。shell\
    \ 允许你与操作系统交互，此时你应该理解这对于你计算机的运行至关重要。你的操作系统由几层组成：一端是内核（kernel），它是操作系统与硬件交互的方式；而在过程的另一端是\
    \ shell，用户通过它交互。\n\n![](img/rsrc38H.jpg)\n\n停下来思考一下这张图：注意硬件是如何处于核心位置的。从那里开始，你有环绕着硬件的内核，以及吞没内核的\
    \ shell。这让你能够看到层级结构——如果不先通过外部层级，你就无法访问最内层。\n\n在本章中，你将学习作为一个系统的 shell，以及它的主要功能是什么。你将学习如何通过终端（terminal）访问\
    \ shell。你将被引导学习 shell 脚本，并获得为了与 shell 交互而所需的 Basic 命令行编辑知识。最后，你将学习到可用的 shell 类型。\n\
    \n#### 什么是 Shell？\n计算机主要在二进制上运行——即使用 1 和 0 来表示开关的开启或关闭。然而，如果你被要求通过二进制向系统输入内容，你会发现自己花费在翻译上的时间比需要的要长得多。这就是\
    \ shell 的用武之地。得益于 shell，你不需要精通二进制。shell 充当英语编写的人类友好命令与内核之间的翻译器，并将它们转换为内核可以使用的内容。通过为内核翻译一切，你可以自由地记忆那些更短且更易管理的命令。总的来说，shell\
    \ 具有几个关键特征，例如：\n\n* 它是一个用户程序：它是一个为了适应人类交互设计的环境。\n* 它是一个命令行语言解释器（`CLI`）：它从键盘等标准输入接收并执行命令，而无需记忆和翻译二进制等复杂的程序语言。\n\
    * 它是自动的：你一打开终端，shell 就会开始工作。\n* 它与内核协作：虽然它不是内核的一部分，但它与内核协同工作，以便执行程序、创建文件或完成任何必要的命令。\n\
    * 它是多用途的：Linux 有若干种不同的 shell 可用，它们可以完成相同的工作，尽管它们使用不同的语法并具有不同的内置函数。\n\n#### 访问\
    \ Shell\n当你与 shell 交互时，有几种方法可以使用。访问 shell 的最方法包括终端（terminal）和安全外壳连接（secure shell\
    \ connection）。它们具有不同程度的权限和能力。通常，你会发现自己正在与 `Bash` 交互，但有时你可能会遇到其他形式。尽管如此，了解如何访问\
    \ shell 是必要的。\n\n#### 在 Windows 上安装 Bash\n本节将要求你通过 Git for Windows 安装程序安装 `Bash`。它提供的指令非常直观，但在屏幕出现在面前之前，这些指令可能看起来并不特别有用。尽管如此，如果你想以最快的方式安装\
    \ `Bash`，请返回本节。\n\n"
