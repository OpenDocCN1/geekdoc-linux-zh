    a single office in a building. It is meant to be much smaller and not accessed
    by nearly as many people. They are most frequently connected via Ethernet to control
    the dataflow, though more and more LANs are moving toward wireless, known as Wireless
    Local Area Networks or WLANs.If you have a home setup in which you have two systems
    sharing access to data, then you have a LAN. Other systems beyond computers can
    also comprise the LAN, such as printers or smart televisions that will share the
    data. These are used for the sharing of local data as opposed to wide-scale distribution.
    However, they are incredibly useful for a home or for a small business.MANStanding
    for a Metropolitan Area Network, this is larger than a LAN but still smaller than
    a WAN. This may be, for example, a large tech campus that shares a network spanning
    several blocks or even several square miles, but is not particularly wide-reaching—this
    would be a MAN. It can also be used to describe a city. Typically, a MAN is several
    LANs that create it, and the MAN is a fantastic way to pass forward the data within
    a LAN, allowing it to stretch further.The Network TopologyWith that understanding
    of the network itself, it is time to look at the most common topologies—the forms
    through which networks connect to nodes. The node is an individual device that
    is connecting to the network in some way, and different topologies will organize
    these networks in different ways, depending on necessity and what makes the most
    sense.Point to pointWith this network topology, sometimes referred to as the bus
    topology, there is a central cable that runs between all devices on a LAN and
    connects them all. It is easy to connect to, but if there is any sort of break
    in the system, the whole thing will crash.Star![](OEBPS/rsrc38N.jpg)The star topology
    works to connect several devices all to a central computer that is referred to
    as the hub, as seen in the picture above. The nodes are able to communicate by
    first passing through the hub. In this form, a single node’s malfunction will
    not impact the rest of the network, but at the same time, if the hub were to fail,
    the entire network would be crippled.Ring![](OEBPS/rsrc38P.jpg)In the ring topology,
    a LAN is set up with the topology of a ring. Each node is connected to two others
    within a closed loop, and all messages will travel around that circle. This allows
    the message that is being passed along to be regenerated with each node it goes
    through.TreeThe tree topology is a hybrid of the bus and star topologies to create
    what looks like trees when drawn out. It involves several star-configured networks
    that connect to a single linear backbone. This is great for larger computer networks
    that are benefitted by being broken into easily managed pieces, but the system
    is at a disadvantage because the backbone acts as a hub, and if that fails, everything
    fails.MeshFull mesh topology connects every node to a circuit connecting it to
    every other node within the network. It is expensive to manage, but it also leads
    to the most redundancy—which means that it is safer. Even if a single node fails,
    traffic can continue because all nodes are interconnected.Sometimes, some nodes
    are organized with a full-mesh pattern while others are not entirely interconnected,
    allowing for some redundancy and some money saved, while still managing an effective
    network. This is known as partial mesh topology.Main Protocols of the InternetTCP/IPAs
    a precursor to routing, you must first understand the TCP/IP network model. This
    is the way that packets are able to find their way back and forth across the internet,
    allowing them to reach the right host within the network.Within this network model,
    there are five layers that describe the necessary processes to actively shift
    and move the packets from the host to host as necessary, no matter whether that
    host is local or across the world.![](OEBPS/rsrc38R.jpg)


    *   Application layer (Message): It all starts with a message. The first layer
    consists of the necessary protocols that will be needed for communication, such
    as HTTP, SSH, IMAP, and any other commands that will be necessary.  When you then
    request a webpage at any point, the message is communicated through one of those
    formats.'
