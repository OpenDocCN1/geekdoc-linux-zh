    # 通过终端访问 Shell


    1. 通过终端访问 shell 需要你首先安装 `Bash`。这非常简单——下载 Git for Windows 安装程序。运行安装程序时，点击“运行”，然后在接下来的五个屏幕中，点击“Next”。

    2. 当出现选项时，选择“Git from the command line and also from 3rd party software”（从命令行以及第三方软件使用
    Git），然后点击“Next”。这将允许你通过命令行访问，这正是你需要的。如果你在这一步出错或漏掉了所需的选项，请重新启动安装程序并相应更改选项。

    3. 再次点击“Next”。

    4. 选择“Checkout Windows-style, commit Unix-style line endings”（使用 Windows 格式检出，提交
    Unix 格式行结束），再次点击“Next”。

    5. 在下一个屏幕上，选择第二个选项。你应该选择“Use Windows’ default console window”（使用 Windows 默认控制窗口）并点击“Next”。

    6. 再次点击“Next”。

    7. 安装。

    8. 安装完成后，选择“Finish”。


    完成后你就可以使用 `Git` 和 `Bash` 了。`Bash` 是 `macOS X` 和大多数形式的 `Linux` 中默认使用的 shell，所以如果你电脑上已经安装了这些操作系统之一，就不需要再经历这个过程。


    ## 什么是终端？


    终端是访问 `Bash` 的 `CLI`。就像 shell 本身，`Linux` 和 `Mac` 用户已经安装了终端程序。如果你在上一节中使用过 `Git
    for Windows` 安装程序，你也已经安装了自己的终端访问工具——`Git` 是 Windows 用户常用的终端。


    终端将是你访问计算机的方式。当你在终端内使用 `Bash` 时，你能够执行比以前在计算机上执行多得多的任务。这还允许你以高效的方式执行其他若干任务，例如监控当前工作目录、更改目录、创建新目录等。


    ## 通过终端访问 shell


    当你准备好访问 `Bash` 时，你必须根据你正在使用的程序选择正确的程序。在 `OS X` 中，它通常被称为 `Terminal`。在 `Windows`
    中，它是 `Git Bash`。在 `Linux` 中，通常仅直接称为 `Bash`。


    在 `Linux` 中尝试访问你的 shell，最简单的方法是运行终端模拟器。你有几个终端模拟器可供选择——这些程序用于模拟 `Unix` 中通常使用的终端硬件。它们在
    `Linux` 内部被模拟和利用，并窗口的形式供你访问和交互。访问模拟器后，你应该会有配置终端的选项，允许你更改文本、颜色或其他个人设置。


    大多数情况下，`GNOME` 是可用的，尤其是当你运行 `Bash` 时，尽管也存在其他选择。其他一些常用的终端模拟器包括 `xterm`、`Konsole`
    和 `LXDE`。你可以在应用程序菜单中找到 `GNOME`。运行它应该会打开终端，然后你就可以开始与其交互。当你与终端交互时，你将输入命令，按下键盘上的
    `Enter` 键即可触发发送。


    当你在终端中时，有几个命令对你来说至关重要，将在第 5 章中讨论。在开始之前，请注意，当终端等待输入时会显示美元符号（`$`）。其他 shell 可能会使用不同的字符，但如果你在
    `Bash` 中工作，它将是 `$`。这让你知道应该插入自己的命令。


    ## 安全 Shell 连接


    有时，需要连接到远程服务器上的 shell 账户。只要你想要访问的服务器运行着适当的 `SSHD` 服务器软件，并能够管理和接受任何连接，你就应该可以使用所谓的
    `SSH` 程序。这些程序授予远程连接权限。


    当你建立了安全的 `SH` 连接后，shell 会话将开始，你将能够通过在本地计算机上输入命令来控制服务器。这有许多用途，但最常见的是网络和系统管理员使用。如果你需要一种安全的方法来远程管理计算机，你会发现
    `SSH` 对你非常有益。


    为了创建 `SSH` 连接，有两个必要的组件：客户端和服务器端组件。客户端是你计算机上使用的应用程序。你将使用客户端连接到你想控制的另一台计算机或服务器。然后客户端使用提供的信息来发起连接。通过验证凭据，创建一个加密连接。


    服务器必须有一个名为 `SSH daemon`（SSH 守护进程）的组件。简要提醒一下，守护进程是后台进程，它们被激活后保持运行，以等待任何与其相关的命令。在这种情况下，`SSH
    daemon` 始终监控一个非常特定的 `TCP/IP` 端口，以告知它客户端连接请求。客户端负责启动连接，然后守护进程将使用自己的软件直接交互以验证凭据，然后允许建立
    `SSH`。


    为了建立此连接，你需要确保已安装了相应的客户端和服务器组件。一个常用的开源 `SSH` 工具是 `OpenSSH`——这将要求你授予服务器以及你正在使用的计算机的终端访问权限，以便维持连接。如果你选择了
    `Ubuntu`，默认情况下不会安装它，但在其他 `Linux` 发行版中你可能已经有了。


    你可以通过以下过程简单地检查是否已经安装了 `SSH` 客户端：


    1. 载入 `SSH` 终端。你可以通过搜索“terminal”或按下键盘上的 `CTRL + ALT + T` 来实现。

    2. 终端打开后，在其中输入 `SSH` 并按 `ENTER`。

    3. 如果客户端已安装，你将看到对另一个服务器的访问界面。如果你没有得到列出的选项和命令的响应，则你需要安装 `OpenSSH`。


    幸运的是，安装 `OpenSSH` 也相对简单。你只需要一条命令即可：


    ```bash

    sudo apt-get install openssh-client

    ```


    输入此命令后，系统会要求你输入超级用户密码。在提示时提供密码并按回车完成安装。现在，你应该拥有对任何带有服务器端程序的机器的 `SSH` 访问权限，只要你有凭据来证明你拥有这些权限。


    当然，你仍然需要安装服务器端组件才能真正获得访问。再次，确保服务器上没有已经安装 `SSH` 组件。


    1. 从服务器机器上，打开终端。同样，你可以搜索“terminal”或使用键盘上的 `CTRL + ALT + T` 命令。

    2. 终端打开后，输入 `ssh localhost`，然后按回车。

    3. 没有 `SSH` 的系统将响应说连接被拒绝。


