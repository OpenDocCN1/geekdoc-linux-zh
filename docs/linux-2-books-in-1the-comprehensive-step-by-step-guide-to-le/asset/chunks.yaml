- fmt: '

    `pkill`: This will kill a process by name. Killing the processes before shutting
    off the system is necessary with Linux, or you risk causing issues with the software
    and files. You can use this to end the sessions of other users as well. When you
    use this to kill other users, make sure that you do not kill a `root` user or
    a system level process or you will kill the server’s current processes. To kill
    the process of another user, use the following command: `pkill –KILL -u {username}`


    `kill`: This will terminate a process.


    `logout`: This will force the logout of a shell. You can also use this if you
    are a regular user within the computer. It will log you out of the `sh` or `ssh`.


    # Files and Directory Commands

    Sometimes, you need to find something within your files and directory. Luckily,
    rather than having to dig through everything line-by-line, there are several systems
    commands you can utilize in order to bring it all to the forefront of the terminal
    for you to access as needed. This list for you is provided in alphabetical order
    so you can find the commands by spelling as necessary.


    `cat`: This will print the content of a fiile for you. For example, if `kitten.txt`
    has a long poem about why kittens are cute and fluffy if you use the following
    code:

    ```

    $ cat kitten.txt

    ```

    you will end up with the long poem about cute and fluffy kittens in your terminal.


    `cd`: This command allows for the changing of the directory to access a new one.
    For example, if you use the following command:

    ```

    $ cd /

    ```

    You will be moved to the root directory. So long as you define the directory that
    you wish to reach, you should be transferred there.


    `cd ..`: This command allows you to move up one directory level. If you are currently
    looking within a directory named `a file`, and within that directory, there is
    another named `basket`, for example, using this command will move you from `file`
    to `basket`.


    `cp [file 1] [file 2]`: This command allows for the copying of one file into another
    one. If the name of `file 2` is nonexistent on the system, it will simply be copied
    over. However, if it already exists, the content sharing the same name will be
    overridden. For example:

    ```

    $ cp kitten.txt puppy.txt

    ```

    In this example, so long as there is no other file named `puppy.txt`, the designated
    `kitten` file will be copied and renamed as a `puppy`.


    `cp -r [dir1] [dir2]`: This will copy the content that is within directory 1 and
    place it into directory 2. As before, if directory 2 does not exist, it will be
    created, and if it does exist, it will override the other format.


    `echo`: This will trigger the system to send an input string to standard output.
    For example, if you are typing input, you can cause the input to be recorded and
    repeated in the output display.


    `find`: This will allow you to do a search in...


    `grep`: This will allow you to search for input files within a specific pattern
    and bring back the lines related to the search.


    `head`: This will trigger the system to print the first 10 lines of the file for
    you to view in the terminal. So, if you use the following code:

    ```

    $ head kitten.txt

    ```

    then you would find yourself with the first 10 lines of the kitten poem in the
    terminal.


    `less`: This command displays the contents of any named file one page at a time.


    `locate`: This can also be used to find a file that you are looking for if you
    know its name.


    `ls`: This command triggers the terminal to list out the content within the specified
    directory being used.


    `ls -la`: This command will list out all of the directory’s files, including any
    hidden directories that may be within it.


    `mdelt`: This is used to delete MS-DOS files, recursively deleting them and their
    contents.


    `mkdir`: This command creates a new directory if the name you have entered does
    not exist. For example, if you wish to create a directory, you may type:

    ```

    $ mkdir newfile

    ```

    So long as you did not already have a directory named “newfile,” one would be
    created for you.


    `mkdir -p`: This adds a bit more customizability to `mkdir`. With this particular
    command, you are able to also create subdirectories nested within the one you
    have named. For example:

    ```

    $ mkdir -p newfile/pictures/puppy

    ```

    This would create a directory known as “newfile.” Within the `newfile`, there
    is a directory formed that is named “pictures.” Inside of pictures, there is a
    directory named “puppy.”


    `more`: This allows for the display of content within a file page by page.


    `mv`: This allows for the renaming of files and directories. For example, if you
    wish to rename `kitten.txt` into `puppy txt`, you would use:

    ```

    $ mv kitten.txt puppy.txt

    ```

    This particular code can also be used slightly differently in order to trigger
    the file to be moved from one place to another. For example, let’s say we have
    a directory named `file` and directory named `basket` and `kitten.txt` is currently
    within the directory named `file`. However, you want to move `kitten.txt` to the
    `basket`.

    ```

    $ mv /file/kitten.txt /basket/

    ```

    This code should facilitate the move, and `kitten.txt` will now be found in directory
    `basket`.


    `pwd`: This command allows you to see exactly which working directory you are
    in for easy reference.


    `rm`: This causes the deletion of a file that you have dictated. For example,
    if you wish to delete a text file named `kitten`, you would use the following
    code:

    ```

    $ rm kitten.txt

    ```


    `rmdir`: This triggers the system to remove or delete the specified directory,
    so long as the directory is empty at the time.


    `rm -f`: This command forces the delete of a file, even if the file would otherwise
    resist it.


    `rm -r directory`: This will delete a directory, its copies, and all of its content.


    `rm -rf directory`: This will forcefully delete a directory, its copies, and all
    of the content within it.


    `tail`: This command prints the last 10 lines of a file. For example, if you use
    the following code:

    ```

    $ tail kitten.txt

    ```

    then, you will see the final 10 lines of the fluffy kitten poem.


    `tail -f`: This will provide the last 10 lines of a file, and continue to display
    the last 10 lines, even as new ones are added. In this instance, if you were writing
    your kitten poem actively in the file and used the code:

    ```

    $ tail -f kitten.txt

    ```

    then, you will find that every new line that you add at the end of the file will
    display itself in the terminal as the last 10 lines continuously refresh themselves.
    This is particularly useful if you are using it to check a live activity log so
    you can constantly see the most recent activity.


    `touch`: This command tells you to create a new file. For example, if you wish
    to create a text file named `kitten`, you would use the following code:

    ```

    $ touch kitten.txt

    ```


    `whereis`: This file allows for the binary, source, and man page files for any
    given command to be located.


    # Users and Groups Commands

    Linux can accommodate multiple users of the operating system, and those users
    can sometimes be combined into what is known as a group. Effectively, then, the
    group is nothing but a collection of users that have the same level of access
    privileges to the OS. Of course, one particular user can be sorted into several
    of the different groups at the same time in order to grant several different accesses
    and privileges if necessary.


    `groups`: This command, when provided with a username, will provide you with all
    of that particular user’s groups, and therefore allows you to see his or her access
    to the system. This is formatted as:

    ```

    $ groups dad

    ```

    This would then list out all of the privileges of the user on that system that
    was named “dad.” When you forego the username, it will display all of the information
    for the current user that is accessing the terminal.


    `groupadd`: This will allow for the addition of a new group through the format:

    ```

    $ groupadd mom groupnamehere

    ```

    With this format, a new group named “mom” has been created.


    `groupdel`: This allows for a specified group to be removed.


    `groupmod`: This allows for specific group definitions and permissions to be edited
    and modified.


    `gpasswd`: This will allow the admin to alter the group passwords to gain access
    to the system.


    `passwd`: This allows for the changing of a password for the user activating it.


    `users`: Allows for the current list of active users on the machine to be seen


    `useradd`: This allows for the creation of a new user for the system


    `userdel`: This allows for the removal of a user account and all files associated
    with it


    `usermod`: This allows for a user account to be modified.


    # Files Permissions Commands

    This section will provide you with all of the information you need in order to
    change directory permissions. In doing this, you are able to make larger level
    changes at a group level rather than having to manually change an individual’s
    permissions. When making changes here, you will primarily see three specific letters
    repeated: r, w, and x. These stand for reading, write, and execute respectively.
    When you see these added to one of these groups, you can infer that these privileges
    have been added for a specific file or directory, or if you see them subtracted
    away from a group, you can infer that they are being revoked.


    `chgrp`: This refers to the ability to change the groups of files and directories.
    When you use the commands that have the `chgrp root`, you know that you are messing
    with the groups of files. In particular, you must keep in mind that all of the
    groups must have their accounts logged out to assign groups. There are two specific
    commands for this action.

    `chgrp groupname filename`: This will allow you to change the groups of files
    to a new file.

    `chgrp groupname foldername`: This allows you to move the groups of files to a
    specific folder.


    `chmod`: This refers to changing directory permissions.

    `chmod +rwx filename`: This will add permissions to read, write, and execute.

    `chmod -rxw directoryname`: This will revoke permissions to read, write, and execute
    within that directory.

    `chmod +x filename`: This will allow for executable privileges to the file

    `chmod –wx filename`: This will allow for the permission to write and execute
    the file to be revoked.


    `chown`: The last of the ownership commands that will be discussed is chown. This
    will help you change ownership of any given files. This can allow you to move
    ownership of a specific folder to another person.., this is done in two ways.

    `chown username filename`: This will transfer the ownership of the named file
    to the named user

    chown username foldername`: This will transfer the ownership of the named folder
    to the named user.


    # Archives and Compressed Files Commands

    Sometimes, what you need to do with your OS is to create archives or compress
    files. That is what the following commands are good for—they enable you to be
    able to take a large number of files and create an archive of them. They may also
    compress the archive in order to save space, depending on the commands you insert.


    `gzip`: This is used to compress documents into a zip file.


    `rar`: This will create and manage a RAR file in Linux.


    `tar`: This is the GNU version of tar archives. When you use this code, you are
    able to store several files in a single archive.


    `unzip`: This will tell you whether you can unzip the file, providing you a usage
    summary of the document. From there, you can choose to extract the file wwith
    gunzip and then open the file with tar xvf.

    `unrar`: if installed on the system, this will unarchive and unpack the files
    that they are commanded to.


