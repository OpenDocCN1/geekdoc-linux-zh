    # 4. 集线器已经过时且不再使用


    ## 4. 为什么要创建网络？


    1. 文件的易于分发

    2. 数据共享

    3. 连接性

    4. 冗余性

    5. 以上所有

    6. 以上都不是


    ## 5. 对或错：只有当你打算玩游戏或在互联网上传输大量数据时，你才真的需要访问网络


    # 第 7 章答案解析


    1. **B**: 虽然你确实有一个个人网络，但那不是本章的语境。Linux 意义上的网络是指一组能够以某种方式共享文件的连接设备。

    2. **B**: 广域网。虽然在某种意义上，互联网可以被视为 WAN，但它并不是 WAN 的全称。它指的是跨越大地理区域的网络。

    3. **A**: 整个系统将停止工作。当实现集线器时，它是整个网络的中央处理能力，没有了集线器，系统的其他部分将无法正常运行。

    4. **E**: 以上所有。如果你在某些方面对网络有实际需求，那么建立网络有无数的理由。如果你需要定期共享文件，或者想在家庭内部系统之间轻松切换，那么绝对推荐这样做。

    5. **错误**: 事实上，网络作为文件的长期存储实际上效果非常好，这让文件处于闲置、未使用状态，而不是使用游戏或流媒体所涉及的高强度网络进程。


    # 第 8 章：Windows 应用程序替代方案


    如果你已经读到了书这里，那么你可能正在认真考虑切换到 Linux，或者你已经决定这样做了。无论如何，你可能对这个过程存有一些顾虑。例如，面对一个并非为包含你所有专有软件而设计的操作系统，可能会有些令人敬畏。特别是如果你是
    Windows 操作系统的长期用户，你可能会觉得不想错过那些已经融入日常生活的程序。毕竟，在某些情况下（如工作、学校或仅仅出于你个人的喜好），你可能需要访问
    `Microsoft Office`。虽然运行虚拟机来运行 `Microsoft` 以恰好获取你需要的所有文件绝对是一个可行选项，但这可能不是你真正想要的方案。


    幸运的是，市面上有多种主流 Windows 应用程序的替代品，而且这些替代品甚至还有一个额外的奖励——它们通常是免费的。虽然这可能在起初让你犹豫，怀疑免费软件是否比你所习惯的那么可靠或不完整，但请考虑到
    Linux 本身就是一个免费的操作系统迭代版本，而你现在很可能已经非常接近使用它了。


    尽管这些项目是免费的，它们仍然非常有用。特别是本章，专门为你寻找你将使用的某些主流 Windows 应用程序的最佳流行替代品。从文字处理到 PDF 器，再到数字编辑程序的替代品，存在许多完全兼容
    Linux 的免费选项供你选择。本章将为你提供以下产品的替代方案：


    * `Microsoft Office`

    * `Notepad`

    * `Internet Explorer`

    * `Photoshop`

    * `Movie Maker`

    * `Windows Media Center`

    * `Adobe Reader`


    当然，本章中推荐的选项并不是你唯一的选择——你可以自己寻找其他你可能认为对你更有用的几个程序和应用程序，这没关系。根结底，使用 Linux 的关键在于用户满意度和可定制性，所以你绝对应该专注于将其设计成对你实用的工具。请随时探索更多选项，以确定是否能找到其他你认为特别有用的东西。


    ## Microsoft Office 替代方案


    许多人经常使用 `Microsoft Office`。事实上，它在学校环境中被经常使用，许多大学甚至要求学生使用这种格式提交文档。`Microsoft Office`
    内部包含几个不同的程序，允许处理和编制电子表格、文字文档和其他形式的文档。如果你最近在学校，你可能在某种程度上用过它。


    幸运的是，还有其他 `Office` 的替代方案，尽管你可能会遇到要求使用 `Microsoft Office` 的情况。尽管如此，如果可以的话，你可以用
    `Libreoffice` 代。


    `Libreoffice` 为免费而设计，而且确实非常强大。在这个套件中，你获得了几个免费开源的办公资源。像 `Office` 一样，它包含了整合在一个名称下的几个不同程序，每个程序都生成不同类型的文档。通过
    `LibreOffice`，你可以访问几个不同的程序：


    * `Writer`: `LibreOffice` 的文字处理器

    * `Calc`: `LibreOffice` 的电子表格处理器

    * `Base`: `LibreOffice` 的数据库处理器

    * `Impress`: `LibreOffice` 的演示文稿创建器

    * `Draw`: `LibreOffice` 的图表创建器

    * `Math`: `LibreOffice` 的公式编辑器


    '
- fmt: '

    As you can see, all of the major functions of Microsoft Office are provided there
    with `LibreOffice`, and for the price tag of free, it almost can’t be beat, unless
    you really need to have word doc formatting. While you will be able to open up
    files created in Microsoft Office in `LibreOffice`, the converse is not true.
    `LibreOffice` is frequently bundled in with many of the more common Linux distros,
    so you may not even have to go out of your way to locate this particular installation.
    If you dislike `LibreOffice`, there are other alternatives as well. In particular,
    you may find that `Open Office` or `AbiWord` is more your style, and that is okay!


    ### MS Notepad Substitute

    `MS Notepad` is usually built in to Windows. It is commonly used as exactly what
    it sounds like—a notepad. It is a text entry system that you can use to store
    notes, writing, or anything else that you may have. However, it is far less sophisticated
    than Microsoft Office. Nevertheless, if you find that you miss `MS Notepad`, there
    are substitutes out there for you.


    In particular, `gedit` is the GNOME text editor. It is designed to be simple and
    easy to use, while also allowing for the highlighting of several programming languages.
    It also comes with the undo/redo commands, clipboard support, and printing support.
    Basically, anything that you could possibly need in `MS Notepad` will be available
    to you with `gedit`. There are also several other types of text editors that you
    may find to be useful, as well. For example, `jEdit`, `Kate`, and `NEdit` are
    all other free, Linux-based text editors that may be useful for you.


    ### Internet Explorer Substitute

    The vast majority of use on a computer these days is browsing the internet, and
    if you use Microsoft, you have possibly been using `Internet Explorer` as your
    browser. If you are one of those people who ditched `Internet Explorer` as quickly
    as you could for something else, there is the chance that whatever it is that
    you were choosing as your browser is still supported. `Internet Explorer` itself
    is not compatible with Linux, but with many other options available, you are bound
    to find something that like.


    In particular, `Firefox` is commonly recommended. `Firefox` is strongly recommended,
    even among Windows users, and for a good reason—it is incredibly customizable
    and offers support for several plugins. It is also actually more secure than `Internet
    Explorer` in the first place. Even better, `Firefox` is compatible with mobile
    devices as well, so if you prefer, you can set up your system so you are able
    to access all of your information across your computer and phone. If `Firefox`
    is not for you, there are plenty of other browsers available on the market for
    you as well, and you should be able to find one that works well with relative
    ease. In particular, you may choose to look into `Epiphany`, `Konquer`, or `Opera`.


    ### Photoshop Substitute

    `Photoshop` is the golden standard when it comes to photo editing for many people,
    but unfortunately it is locked behind quite large paywall. `Photoshop`, while
    a good program in general, is quite expensive. `Photoshop` is written in `C++`,
    making it rather restrictive in general, whereas you have other options available
    to you.


    In particular, you have access to `GIMP`. Unlike `Photoshop`, `GIMP` is written
    in `C`, making it far more flexible to use. Even better, `GIMP` is far less strenuous
    on processor while still giving you access to several tools. Not only is `Photoshop`
    monetarily expensive, it is also expensive on processor, especially when editing
    files in high resolution. `GIMP` typically gets bundled in with most common distros,
    though you may stumble upon one that does not include it. Nevertheless, try taking
    a look at it. Even if you do not shift to Linux, you may find that `GIMP` is a
    better alternative to `Photoshop` anyway. Beyond `GIMP`, if you find that it is
    not quite to your liking, you can try `GIMP` as well. These programs, while being
    recommended for Linux, are also compatible with Windows.


    ### Movie Maker Substitute

    Despite common assumptions, Linux actually has several options available for decent
    video editing programs. While many people may feel like they are missing out if
    they do not have access to `Movie Maker` on Windows or Mac, you are actually able
    to find alternatives readily available on Linux. While `Movie Maker` is a good
    option for you, if you have access to it, some of the lesser known iterations
    are actually more advanced and allow for further functionality that you may not
    otherwise have.


    In particular, `Kdenlive` is designed to be an advanced alternative to `Movie
    Maker`. In `Kdenlive`, you are able to work with ultra-high resolution processing
    of images. Despite being free, it offers you all the software you could possibly
    need—and then some. It offers features such as color correcting, motion tracking,
    audio mastering, and more, all designed to give you everything you possibly need
    when shifting to Linux from Windows. After all, artistic pursuits should not have
    to suffer in name of operating systems. And even better, like all the other programs
    discussed in this chapter, it is free. If `Kdenlive` is not your style, you may
    find that one of several other options appeals more to you. Other options that
    you could look into alongside `Kdenlive` include `OpenMovieEditor`, `VideoLAN`,
    and more. All you have to do is dig around a little bit, and you will find several
    other options for you.


    ### Windows Media Center Substitute

    `Windows Media Center` is the major entertainment system that was released with
    Windows starting with Windows 7. It allows you to load up videos. However, it
    was also rather strenuous on the graphics card, requiring a high-end one in order
    to actually function properly. Because of this, many Windows users ditched `Windows
    Media Player` long ago. Even if you were one of the common users of it, you are
    not losing out on much by transferring to Linux.


    Instead, try taking a look at `MC` instead. This program is not just limited to
    videos either—it can be utilized with several other functions and programs as
    well, such as security cameras, telecommunication, and also running all of the
    media that you have had on your device to begin with. It is meant to be a sort
    of cohesive program that unites your electrical appliances at home, from lighting
    to security and media, with everything in between. Since we are discussing this
    as a media specific replacement, we will focus on the media features. In particular,
    it is designed to be used to link together several devices on a network, allowing
    the files that you are accessing to be accessible in several different locations,
    which further allows you to ensure that you always have your favorite media available.
    There are also several other options available for a substitute for `Windows Media
    Player`, such as `MythTV`, and `XBMC Media Center`. Try playing around with several
    of these to find one that really works well for you.


    ### Adobe Acrobat Reader Substitute

    Especially in adulthood, `Adobe Acrobat Reader` is incredibly useful. Necessary
    to view portable document files (`PDF`), you must have access to some sort of
    reader within your operating system. Most commonly, when you use Microsoft, you
    will end up with `Adobe Acrobat Reader`.


    If you have `Adobe Acrobat Reader`, you may also be familiar with the myriad of
    constant updates it puts out, even when little-to-nothing changes. This means
    that you are constantly being forced to update, even when it is unnecessary. Of
    course, if you are leaving behind Windows, you also leave behind this problem.
    Instead, you can use one of the free and open source software options that will
    eliminate that problem altogether. Even better, many of these free options are
    readily distributed with the most common Linux distributions. If you are going
    to be running a common distribution, it will likely include either `Evince`, `okular`,
    or `Xpdf`, all of which are more than capable of meeting your software needs.


    In fact, `Xpdf`, in particular, provides you with several different tools that
    will allow you to do more than just read your files. You will be able to convert
    `PDF` to text, `PostScript`, into `PPM/PGM/PBM` image files, `PNG` files, `HTML`,
    and more. It can be used to extract metadata or raw images, and will even provide
    the fonts that were used to create the document for you. It is incredibly versatile,
    and while it does require you to understand the command line tools, for full optimization,
    you will find that it is more than capable of getting the job done.


    Chapter 8 Quiz

    Congratulations! You have made it through Chapter 8\. By now, you should have
    a pretty solid idea of just how much software is readily available to you without
    having to pay insane amounts of money to access it. Try to answer these questions
    to ensure you understand the basics before moving on. The answer key will be on
    the page directly after this quiz.

