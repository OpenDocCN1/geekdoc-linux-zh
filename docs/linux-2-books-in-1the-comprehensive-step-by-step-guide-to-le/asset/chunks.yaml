    `Internet Explorer` 更安全。更棒的是，`Firefox` 也兼容移动设备，所以如果你愿意，可以设置系统，以便在电脑和手机上访问所有信息。如果
    `Firefox` 不适合你，市场上也有许多其他浏览器供你选择，你应该能够很轻松地找到一个运行良好的浏览器。特别是，你可能会选择查看 `Epiphany`、`Konquer`
    或 `Opera`。


