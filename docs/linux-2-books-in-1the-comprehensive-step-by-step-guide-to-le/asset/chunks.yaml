    \ The built in software\n\n    4.  Whether you like the mascot\n\n    5.  a, b,\
    \ and c\n\n    6.  a, b, and d\n\n4.  True or false: Gentoo is great for beginners\n\
    \n5.  True or false: Ubuntu is great for beginners\n\nChapter 2 Answer Key\n\n\
    1.  B: The distribution refers to the specific operating system program that you\
    \ are using\n\n2.  False: Several distributions, such as Slackware, do not change\
    \ much or have not changed in years.\n\n3.  E: While liking the mascot may be\
    \ nice, it does not determine how well a program may meet your needs\n\n4.  False:\
    \ Gentoo requires nearly constant programming to get it functioning at all.\n\n\
    5.  True: Ubuntu is incredibly easy to get started with and is designed to be\
    \ user-friendly. "
