    # Terminal Access to Shell


    1. Terminal access to shell requires you to first install `Bash`. This is quite
    simple—download the Git for Windows installer. When running the installer, click
    on the run, and then on the next five screens, you will click “Next.”

    2. When presented with the option, select “Git from the command line and also
    from 3rd party software” and then click “Next.” This selection will allow you
    to access via command line, which is what you need. If you mess this step up or
    miss the selection you need, restart the installer and change the options accordingly.

    3. Click “Next again.”

    4. Select “Checkout Windows-style, commit Unix-style line endings” and then click
    “Next” again.

    5. On the next screen, select the second option. You should select “Use Windows’
    default console window” and click “Next.”

    6. Click “Next” once more.

    7. Install.

    8. When the install has completed, select “Finish.”


    This should leave you with `Git` and `Bash` available. `Bash` is the default shell
    used in `macOS X` and in most forms of `Linux`, so you will not need to go through
    this process if you have one of those operating systems already installed on your
    computer.


    ## What is the terminal?


    A terminal is the `CLI` used to access `Bash`. As with the shell itself, `Linux`
    and `Mac` users will already have a terminal program installed. You have also
    installed your own terminal access in the previous section if you used `Git for
    Windows` installer—`Git` is the commonly used terminal for Windows users.


    The terminal will be the way that you are accessing your computer. When you use
    `Bash` within the terminal, you are able to perform far more tasks than you have
    ever had to do before on your computer. This will also allow for the performance
    of several other tasks in an efficient manner, such as monitoring the current
    working directory, changing directories, creating new directories, and more.


    ## Terminal access to shell


    When you are ready to access `Bash`, you must use the right program for the program
    you are using. In `OS X`, it is usually referred to as `Terminal`. In `Windows`,
    it is `Git Bash`. In `Linux`, it is typically just referred to as `Bash`.


    When trying to access your shell within `Linux`, the easiest way to do so is to
    run a terminal emulator. There are several terminal emulators available to you—these
    are programs that will emulate the terminal hardware that is typically used in
    `Unix`. They are then mimicked and utilized within `Linux`, being presented as
    a window for you to access and interact with. Upon accessing the emulator, you
    should have options to configure the terminal, allowing you to change the text
    and colors or other personal settings.


    Most of the time, `GNOME` is available, especially if you are running `Bash`,
    though others also exist. Some other commonly used terminal emulators include
    `xterm`, `Konsole`, and `LXDE`. `GNOME` can be found within the applications menu.
    Running it should bring up the terminal for you, which you can then begin to interact
    with. When you interact with the terminal, you will enter your commands, and hitting
    the `Enter` button on your keyboard should trigger it to send.


    When you are in the terminal, there are several commands that will be critical
    for you to know, which will be discussed in Chapter 5. Before beginning, please
    recognize that your terminal will display the dollar sign (`$`) when it is waiting
    for input. Other shells may use a different character, but if you are working
    within `Bash`, it will be the `$`. This will let you know that you should insert
    your own commands.


    ## Secure shell connection


    Sometimes, there is a need to connect to shell accounts on a remote server. So
    long as the server that you wish to access is running the proper `SSHD` server
    software that will be able to manage and accept any connections, you should be
    able to use what is referred to as an `SSH` program. These grant a remote connection.


    When you have established a secure `SH` connection, the shell session will begin,
    and you will have the ability to control the server via typed commands on your
    local computer. This has several uses, but most commonly, it is utilized by network
    and system administrators. If you have a need for a secure method to remotely
    manage a computer, you will find `SSH` to be quite beneficial to you.


    In order to create the `SSH` connection, there are two necessary components: The
    client and the server-side component. The client is the application that you will
    use on your computer. You will use the client to connect to the other computer
    or server that you wish to control. The client then uses the information provided
    to initiate a connection. Through the verification of credentials, an encrypted
    connection is created.


    The server must have a component known as an `SSH daemon`. As a brief reminder,
    daemons are background processes that are activated and then remain to wait for
    any commands that may be relevant to them. In this case, the `SSH daemon` is always
    on the lookout for a very specific `TCP/IP` port that informs it of a client connection
    request. The client is responsible for starting the connection, and then the daemon
    will use its own software to directly interact to verify credentials and then
    allow for the `SSH` to be established.


    In order to establish this connection, you will need to ensure that you have the
    corresponding client and server components installed. A commonly used open source
    `SSH` tool is `OpenSSH`—this will require you to grant access to the terminal
    on the server and the computer that you are using to allow for the connection
    to be maintained. If you have chosen `Ubuntu`, this will not be installed by default,
    but you may already have it on other distributions of `Linux`.


    You can check quite simply whether you have an `SSH` client already installed
    through the following process:


    1. Load up an `SSH` terminal. You can do this by searching for “terminal” or pressing
    `CTRL + ALT + T` on your keyboard.

    2. With the terminal brought up and within it, type in `SSH` and press `ENTER`.

    3. If the client is already installed, you will see your access to the other server.
    If you do not get a response with options and commands listed for you, you will
    need to install `OpenSSH`.


    Luckily, installing `OpenSSH` is also relatively simple. You can do so with just
    a single command:


    ```bash

    sudo apt-get install openssh-client

    ```


    Upon typing in this command, you should be asked for a superuser password. Provide
    this and press Enter when prompted to complete the installation. You should now
    have `SSH` access to any machine that has the server-side application, so long
    as you have the credentials to prove that you should have those privileges.


    Of course, you still need to install the server side component as well in order
    to truly get access. Again, ensure that there is not already the `SSH` component
    installed on the server.


    1. From the server machine, open the terminal. Again, you can either search “terminal”
    or use the `CTRL + ALT + T` command from the keyboard.

    2. With the terminal up, type in `ssh localhost`, followed by pressing Enter.

    3. Systems without `SSH` will respond that the connection has been refused.

