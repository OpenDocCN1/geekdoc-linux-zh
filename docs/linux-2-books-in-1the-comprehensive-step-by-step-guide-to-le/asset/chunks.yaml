- fmt: '

    # Chapter 7: Basic Network Administration


    Thanks to just how flexible and customizable Linux is, it is incredibly versatile
    in the world of network administration. This makes it particularly useful if you
    need to run a data center or some sort of server. This chapter will provide you
    with the last of the information you need to know to get started with your Linux
    setup. You will be guided through networking as if it were all new to you—because
    as a beginner reading this book, it may very well be!


    Within this chapter, you will learn about the network extension and topology,
    learning how it works. You will be guided through several protocols, given some
    information on routing, given some commands that may be useful to you, and you
    will be on your way. The following chapter will walk you through deciding upon
    some various software for a Linux distro install, but this is the final chapter
    with all of the hard, dense material. Congratulations—You are almost to the end!


    ## Networking 101


    Networking allows for the connection of computers, phones, peripherals, IoT devices,
    and more to all connect together, accessing one line of data and being able to
    communicate. This is the idea with the internet—you are able to access the internet
    network and communicate with devices that are even on the opposite side of the
    world from you.


    There are several important points to consider with networking, but at the base,
    think of the internet as one giant web—it is all interconnected with several access
    points for other devices to get to. No matter where you are on that web at that
    moment, you can get to any other point on the web in some way, even if that way
    may be slower than it needs to be or should be. This means then that you are able
    to sort of jump your way around the network to access data that you need, even
    if it is not on your physical machine. That is how the internet works.


    Networking has far more uses than just general web browsing, however. It can be
    useful for the distribution of data, data storage, general networking, and more.
    Thanks to this web, we are able to stream videos with ease from anywhere we are
    able to connect to the internet, or able to access files on the cloud. All that
    you need is a steady connection, and you are able to access nearly anything that
    is also connected.


    ## The Network Extension


    Networking spreads out across several people, allowing for rapid distribution
    of data if necessary. Ultimately, the network can be thought of as being divided
    into three distinct categories: The `LAN`, `MAN`, and `WAN`. As depicted below,
    you can see that the `Lan` is the smallest, with the `MAN` being larger, and the
    `WAN` is the largest form of network. Each subsequent network type is going to
    be comprised of several other aspects of the previous. Essentially, several `LANs`
    create a `MAN`, and several `MANs` create the `WAN`.


    ![](OEBPS/rsrc38M.jpg)


    ### WAN

    Standing for Wide Area Network, the `WAN` is the communication network across
    any given specified geographical are. It may involve a city or even a country,
    and these may be public or privatized depending on the usage and whoever is managing
    it.


    To understand what the `WAN` does, stop and think about the internet—now imagine
    this as the biggest `WAN` there is. Several networks are connected together to
    create one big process. This is what a `WAN` is—in a `WAN`, you will have several
    smaller `LANs` or `MANs` that are all within one area, making up the `WAN`. The
    `WAN` is widely connected and is able to reach farther than a `LAN`. This makes
    a `WAN` the best choice if you wish to run a network or a wide-scale sort of server.


    ### LAN

    Standing for a Local Area Network, the `LAN` is much smaller. Usually, the `LAN`
    covers a single building, such as a house, or even just a single office in a building.
    It is meant to be much smaller and not accessed by nearly as many people. They
    are most frequently connected via `Ethernet` to control the dataflow, though more
    and more `LANs` are moving toward wireless, known as Wireless Local Area Networks
    or `WLANs`.


    If you have a home setup in which you have two systems sharing access to data,
    then you have a `LAN`. Other systems beyond computers can also comprise the `LAN`,
    such as printers or smart televisions that will share the data. These are used
    for the sharing of local data as opposed to wide-scale distribution. However,
    they are incredibly useful for a home or for a small business.


    ### MAN

    Standing for a Metropolitan Area Network, this is larger than a `LAN` but still
    smaller than a `WAN`. This may be, for example, a large tech campus that shares
    a network spanning several blocks or even several square miles, but is not particularly
    wide-reaching—this would be a `MAN`. It can also be used to describe a city. Typically,
    a `MAN` is several `LANs` that create it, and the `MAN` is a fantastic way to
    pass forward the data within a `LAN`, allowing it to stretch further.


    ## The Network Topology


    With that understanding of the network itself, it is time to look at the most
    common topologies—the forms through which networks connect to nodes. The node
    is an individual device that is connecting to the network in some way, and different
    topologies will organize these networks in different ways, depending on necessity
    and what makes the most sense.


    ### Point to point

    With this network topology, sometimes referred to as the bus topology, there is
    a central cable that runs between all devices on a `LAN` and connects them all.
    It is easy to connect to, but if there is any sort of break in the system, the
    whole thing will crash.


    ### Star

    ![](OEBPS/rsrc38N.jpg)

    The star topology works to connect several devices all to a central computer that
    is referred to as the `hub`, as seen in the picture above. The nodes are able
    to communicate by first passing through the `hub`. In this form, a single node’s
    malfunction will not impact the rest of the network, but at the same time, if
    the `hub` were to fail, the entire network would be crippled.


    ### Ring

    ![](OEBPS/rsrc38P.jpg)

    In the ring topology, a `LAN` is set up with the topology of a ring. Each node
    is connected to two others within a closed loop, and all messages will travel
    around that circle. This allows the message that is being passed along to be regenerated
    with each node it goes through.


    ### Tree

    The tree topology is a hybrid of the bus and star topologies to create what looks
    like trees when drawn out. It involves several star-configured networks that connect
    to a single linear backbone. This is great for larger computer networks that are
    benefitted by being broken into easily managed pieces, but the system is at a
    disadvantage because the backbone acts as a `hub`, and if that fails, everything
    fails.


    ### Mesh

    Full mesh topology connects every node to a circuit connecting it to every other
    node within the network. It is expensive to manage, but it also leads to the most
    redundancy—which means that it is safer. Even if a single node fails, traffic
    can continue because all nodes are interconnected.


    Sometimes, some nodes are organized with a full-mesh pattern while others are
    not entirely interconnected, allowing for some redundancy and some money saved,
    while still managing an effective network. This is known as partial mesh topology.


    ## Main Protocols of the Internet


    ### TCP/IP

    As a precursor to routing, you must first understand the `TCP/IP` network model.
    This is the way that packets are able to find their way back and forth across
    the internet, allowing them to reach the right host within the network. Within
    this network model, there are five layers that describe the necessary processes
    to actively shift and move the packets from the host to host as necessary, no
    matter whether that host is local or across the world.


    ![](OEBPS/rsrc38R.jpg)


    *   **Application layer (Message)**: It all starts with a message. The first layer
    consists of the necessary protocols that will be needed for communication, such
    as `HTTP`, `SSH`, `IMAP`, and any other commands that will be necessary. When
    you then request a webpage at any point, the message is communicated through one
    of those formats.

    '
