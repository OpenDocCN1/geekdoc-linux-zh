    # Linux Mint


    Linux Mint is a distribution that is based on Ubuntu. This distribution was first
    launched in 2006, just two years after the release of Ubuntu. This particular
    form was created by Clement Lefebvre, a French-born IT specialist who resided
    in Ireland at the time of creation. He had originally been maintaining a website
    that provided help and guides to people new to Linux, and during his time maintaining
    this site, he came up with an idea to develop his own Linux distribution in order
    to address several drawbacks present with other mainstream versions of Linux.


    Though commonly referred to as “Ubuntu done right,” Linux Mint is more than just
    Ubuntu with a refresh—it includes several tools designed to enhance the Linux
    Mint experience, often aptly named with “mint,” such as `mintDesktop`, `mintMenu`,
    `mintUpdate`, and more. The mint tools are designed to be more usable, and greatly
    increase the ease of use, making this one of the easiest forms of Linux to pick
    up thanks to the emphasis on user-friendliness. One of the biggest draws to Linux
    Mint is the fact that the developers are always ready and happy to implement good
    suggestions that will help better the program.


    **Difficulty rating:** Good for beginners

    **Long-term support:** Not on a fixed schedule, but is regularly updated, especially
    shortly after each of Ubuntu’s LTS releases.


    ### Pros

    - `mint` tools designed for the OS

    - User-friendly

    - Includes multimedia codecs

    - Open to the requests and suggestions of the users


    ### Cons

    - No security advisories

    - Not predictably updated


    # MX Linux


    MX Linux has a bit of a history to it. Originally known as MEPIS Linux, a Debian-based
    distribution meant for both personal and professional purpose desktops, featured
    several cutting-edge features at the time of its creation. However, despite this
    cutting-edge availability, MEPIS Linux eventually was subject to discontinuation.
    Its users, however, were not to be deterred. Merging MEPIS with another Debian-based
    distribution known as `antiX` resulted in what is known now as MX Linux.


    This is based on `Debian`’s stable branch, with primary components from both the
    `antiX` and `MEpis` communities. In particular, it utilizes the `Xfce` desktop
    along with a vertical panel on the side instead of the common horizontal control
    panel across the bottom of most computers. Overall, this distribution is recognized
    as one that offers plenty of modern apps that are occasionally updated, along
    with a stable base, allowing for the creation of good, reliable performance without
    losing those features that people want most.


    In particular, MX Linux is recognized for its `MX-Tools`—a series of graphical
    administration utilities that allow for ready access to several functions, such
    as managing the user accounts on that system, installing codecs, and utilizing
    and installing software packages.


    **Difficulty rating:** Good for beginners

    **Long-term support:** Features occasional updates through backports


    ### Pros

    - Immediate support for graphics drivers, codecs, and browser plugins allow for
    near-instant startup out of the box

    - Stable

    - Updated periodically

    - Convenient features


    ### Cons

    - Simple and dated appearance

    - The installer and other configuration tools may take some time to adjust to


    # openSUSE


    D back to 1992, openSUSE came about when four German Linux enthusiasts launched
    it. Thomas Fehr, Roland Dyroff, Hubert Mantel, and Burchard Steinbild started
    out selling floppy disks with the German edition of `Slackware` but quickly created
    their own program: `SuSE` (Software und System Entwicklung, or software and system
    development). In 1996, `SuSE Linux` became its own distribution, and over time,
    more and more features were adopted, such as the `RPM` package management tool,
    a graphical system administration tool designed for usability, and more.


    They released frequently, kept fantastic documentation, and made their product
    readily available, and `SuSE Linux` grew more and more popular. In 2003, it was
    acquired by `Novell, INC`, and eventually transferred to `Attachmate` in 2010.
    These exchanges in ownership led to major changes in development, and eventually,
    the change in name from `SuSE` to `openSUSE`. Despite the constant changes, however,
    it is readily available for free. You can find openSUSE in two primary editions.
    `Leap` grants users a platform that is stable and has several years of support.
    `Tumbleweed`, on the other hand, uses a rolling release environment, and this
    is made smooth by the easy configuration and automated filesystem snapshots and
    boot environments.


    **Difficulty rating:** Good for beginners with some experience

    **Long-term support:** Plenty of support offered


    ### Pros

    - Configuration tool is comprehensive

    - Plenty of software packages

    - Fantastic website infrastructure

    - Plenty of printed documentation and support

    - `Btrfs` with boot environments


    ### Cons

    - Bloated and heavy desktop setup

    - Graphical utilities are slow


    # Fedora


    Fedora itself was not announced and revealed until 2004, though its roots back
    to 1995 with `Red Hat Linux`, which was launched by Bob Young and Marc Ewing.
    Their product was released and updated several times, and in 1997, it added the
    `RPM` package management system, along with several other advanced features, which
    quickly shot `Red Hat` to popularity, eventually even surpassing `Slackware Linux`
    as the most widely-used distribution at the time.


    In 2003, after `Red Hat Linux 9` was released, the company made some significant
    changes, keeping `Red Hat` trademarked as commercial use and then also adding
    in `Fedora Core`. Eventually named just Fedora, this system is sponsored by `Red
    Hat` but primarily oriented toward the Linux hobbyist. Despite initial reservations,
    it was quickly accepted and once again skyrocketed back to its status as one of
    the favorites. This is commonly deemed one of the more innovative of the options
    available these days. Fedora has led the way in contributions to Linux as a whole
    and has made use of several enterprise-level features. However, it runs into some
    downsides as well—it requires some technical knowhow to really make good use of
    it, meaning that it is still a better product for the hobbyists who enjoy tinkering
    rather than someone trying to learn.


    **Difficulty rating:** Intermediate

    **Long-term support:** Regularly updated


    ### Pros

    - Innovative

    - Secure

    - Massive number of supported packages

    - Strongly aligned with free software philosophy


    ### Cons

    - Enterprise rather than desktop features and usability

    - Bleeding-edge features can sometimes be alienating to those who are less familiar
    with the system

    - Requires a bit more finesse with Linux in general

    '
