    \ or resume processes through knowing what information is needed to be preserved\
    \ for processes and executing assembly codes that directly interact with whether\
    \ a process with be suspended or resumed.\n\n*   The architecture-independent\
    \ module: This module is the center of it all—it communicates first with the policy\
    \ module to decide which process goes next, then tasks the architecture-specific\
    \ schedulers to resume the right process. It then interacts with the memory manager\
    \ to make sure that there is enough memory hardware available for the process\
    \ to run effectively.\n\n*   The system call interface module: This module allows\
    \ user processes to access only resources that are intentionally and explicitly\
    \ exported by the kernel. This regulates the divide between user and kernel memory.\n\
    \nAs pictured in the graphic below, the architecture-independent module is at\
    \ the heart of this entire process and directly interacts with each of the other\
    \ modules, allowing the entire process to run together effectively in a way that\
    \ actually works. The scheduler essentially manages it all, with an entry for\
    \ each process. The entire graphic encompasses what is known as the process scheduler.![](OEBPS/rsrc38D.jpg)Chapter\
    \ 1 QuizCongratulations! You have made it through Chapter 1\\. Try to answer these\
    \ questions to ensure you understand the basics before moving on. The answer key\
    \ will be on the page directly after this quiz.\n\n1.  What is the operating system?\n\
    \n    1.  The person or people operating the system\n\n    2.  The program that\
    \ controls the hardware\n\n    3.  The program that controls the software\n\n\
    \    4.  The program that controls the hardware and software\n\n    5.  All of\
    \ the above\n\n    6.  None of the above\n\n2.  Why do you need to keep the kernel\
    \ space separate from the user space?\n\n    1.  Because you don’t want the user\
    \ space to run out of memory\n\n    2.  Because you don’t want to run out of space\
    \ for the operating system"
