    Provides a search for a package using a keyword.             NetworkingThese commands
    are directly related to networking—allowing you to see what is going on with your
    own network and anything that your own network is interacting with.dig domain
    Displays the DNS information for a given domain.dig -x IP_ADDRESS Use this to
    run a reverse lookup of a given IP addressethtool eth0 A tool to view and change
    network drivers and hardware settings.host domain Displays the DNS IP address
    for a given domainhostname -i This command is used to displaying the network address
    of the “host name”.hostname -I Very similar to the above command, but this will
    display all local ip addresses.ifconfig -a This will bring up all network interfaces
    and their ip addresses.ifconfig eth0 Will display the eth0 address and its details.netstat
    -nutlp Will show oyu any listening tcp & udp ports and their related programs.ping
    host Will send an ICMP echo request to “host”.wget http://domain.com/file Downloads
    the web file found at the given web address.whois domain Will display the whois
    information for “domain”.Performance MonitoringThese commands are dedicated to
    ensuring that you are able to monitor your system’s performance. This will make
    sure that your system is functioning well, effectively, and to your preference
    in order to ensure that there is nothing further you have to do to optimize your
    own settings to what you want or need them to be.htop This will allow you to move
    to the top of the process viewer.iostat 1 This will allow you to see the input/output
    statistics.lsof Allows for a list of all open files currently presents on the
    system.lsof -u [username] Allows for a list of open files present currently by
    the username specified.mpstat 1 This will allow you to see processor-related stats.tail
    100 var/log/messages This will let you see the last 100 system log messages.tcpdump
    –i eth0 This will allow you to see all packets on that particular interface listed
    (in this case, eth0).tcpdump –i eth0 ‘port 10’ This will allow for the monitoring
    of data on port 10, and you can change the port name to whichever port you are
    trying to manage.top This will show the top processes and allow you to manage
    them.vmstat 1 This will allow you to see the virtual memory-related statisticsProcess
    ManagementThese commands are dedicated to process management—they tell you what
    the processes that are currently ongoing are doing, as well as allow you to shift
    from foreground processes to background processes as needed to make sure that
    your own activity does not suffer due to other processes running as well.bg Will
    show background tasks or those that have stopped.fg This command will push the
    most recent background process to the foreground.fg n Similar to the above command,
    this will push process “n” to the front.htop Will allow you to interactively monitor
    your computer’s processes.kill pid Use this to end or “kill” a particular process,
    where the process ID matches “pid”.killall processname When you want to kill all
    processes with a particular name, utilize this command.program & This starts your
    selected program in the background.ps Displays your own processes currently running.ps
    -ef Displays all of the processes currently running in the system.ps -ef | grep
    processname This will display the information for “processname”.top A process
    viewer. It is older than htop , but serves the same purpose. It has some differences,
    such as lack of mouse support (something htop has). Pick your preference.SearchWhen
    you need to find something within your system, these commands are your best bet.
    When you are using your search commands, you will be able to find the files you
    need quick access to with ease and learn exactly where they are so you are able
    to jump to them and access them elsewhere.find /home -size +25M Utilize this command
    to find files larger than 25MB in /homefind /home/mark -name ‘prefix*’ This will
    find files in /home/mark that start with “prefix”.grep pattern file This will
    look for pattern in “file”.grep -r pattern directory Performs a recursive search
    for pattern in “directory”.locate name Will look for files and directories by
    the specified “name”.SSH Loginsssh host Connects to host using the username you
    use locally.ssh user@host Connects to host as “user”.ssh -p port user@host Connects
    to host using port.System Information CommandsThese commands are all used for
    some sort of system information to understand what the system is doing and how
    you are able to interact with it. These are Linux specific—they should work for
    any form of Linux you are operating within, Kali Linux included. Some of these
    commands may be less useful on Kali Linux, but they are important to know anyway
    when interacting with other Linux systems. Consider this your sort of refresher
    course on how to interact with Linux.cal This will show you the current month’s
    calendar.cat /etc/redhat-release This shows you which redhat is currently present
    on your computer for use.date This will show you the current time and date on
    the system you are using.hostname This will tell you what the name of the system
    host is.hostname -I This will provide you with the host’s IP address.last reboot
    This will show you the last time that the system was rebooted.uname -a This allows
    for the display of the Linux system’s information that is stored.uname -r This
    allows for the output to show which kernel release you are using.uptime Tells
    you how long your system has been up or how long it has been loading.w This will
    show you who is currently online on the system.whoami This will tell you who you
    are currently logged into the system as.User Information and Management CommandsThese
    commands are crucial to your ability to managing user information. When you master
    these controls, you can add and remove people from your server. You can make sure
    that certain people have certain permissions, and more. These commands may not
    be so necessary within Kali Linux, where you are designed to be in root user and
    not others, they are still fantastic to know and understand.groupadd group1 Allows
    you to create a new group “group1” in this instance. You can replace “group1 with
    any other name for your group.id shows the user and group ids of the current user
    on the system.last Shows who the last people that logged on were.useradd –c “full
    name” –m “nickname” Allows for the creation of an account with the comment of
    “full name” and the home directory of “nickname”.userdel “name” allows you to
    delete the user “name”.usermod –aG group1 “name” Allows you to move user “name”
    to the “group1” group.Part IIKali Linux HackingChapter 13: Nmap and Detecting
    and Exploiting VulnerabilitiesAt this point, you may be quite eager to get started
    with Kali Linux once and for all. You should now have the OS installed yourself,
    or you are preparing to do so. Either way, reading through this section can provide
    you with valuable information. This is where you begin to see the true power of
    Kali Linux and how it can be used. You will begin to see the strength that can
    be earned in hacking and in learning to see and wield that strength for yourself,
    you should also be able to begin to see just how easy it is for a network to go
    unprotected or undefended. When this happens, it is in your best interest to ensure
    that you can figure out vulnerabilities in order to patch them up.Nmap is just
    one of many tools that Kal Linux offers, and this particular chapter focuses on
    it. Nmap is powerful, allowing you to gather and identify information that is
    meant to be useful, allowing you to detect everything on the system. It is primarily
    a security tool, but you should keep in mind that it can be used to cause harm
    as well. Now, it is time to dive into the beginning of the actual hacking process.If
    you have already installed Kali Linux, go ahead and open it up—Nmap comes by default,
    already provided within the system.What is Nmap?Nmap stands for network mapper—it
    is an incredibly popular tool that is used to discover that is available to you.
    As with all of the tools provided to you within the Kali Linux distribution, this
    is free to use and secure. When you use Nmap, you are able to map out networks,
    allowing yourself to see inventories and find open ports as well. It is quite
    simple to use—it brings up a terminal that you are able to enter your commands
    and scripts within, allowing you to do whatever you would like within the system
    once you have gotten in.This tool is able to work through firewalls and routers,
    it can bypass an IP filter, and it is able to navigate into systems. While it
    was designed to be capable of getting through massive networks, it can also be
    used on smaller scales as well. It is primarily used for port scanning, version
    detection, operating system detection, and using ping sweeps. It works quite simply—it
    uses IP packets in order to find hosts on a network and what they are running.
    Plenty of information can be earned just by finding out what someone’s computer
    is running on.Overall, Nmap is incredibly powerful—it enables you to do all sorts
    of actions and search for several exploits. It not only gathers information but
    also allows for the scanning of security, making it a multipurpose tool that can
    greatly benefit you. It can be used for actions such as:'
  toc: []
  trans: '

    到此时，你将能够使用任何 USB 驱动器启动操作系统。你只需要在插入 USB 启动盘并启动电脑时调出启动菜单，确保选择了 Kali Linux。你也可以使用其他方法来访问
    Kali Linux，例如将其安装在你自己的电脑上，但最推荐的访问软件的方法之一是通过 USB 驱动器。如果你有兴趣将整个系统下载到你的硬件中，请随时浏览
    Kali Linux 官方网站以获取更多执行此操作的访问和信息。


    # 第 12 章：基础 Linux 命令


    从现在开始，你将获得的信息是实操信息和你可以以某种方式积极使用的信息的混合。本章将为你提供开始与 Kali Linux 交互所需的必要信息。你将获得一份常用且基础的必要命令列表。


    在阅读这些命令时，请尝试真正熟悉它们。你想要确保理解它们是什么，以及如何最好使用它们来对你产生收益。如果你能做到这一点，你就能确保无论选择的是哪种 Linux
    发行版，都能与其进行交互。请记住，在 Kali Linux 中，你默认以 root 用户身份运行，你需要采取必要的预防。当你没有 root 权限时使用这些命令中的几个，你会遇到阻碍你无法进展的问题。然而，在
    Kali 中，如果你已经是 root 用户，命令会立即执行，即使是有害的命令。这就是为什么如果你真的想提高你的 Kali Linux 技能并精通渗透测试和黑客攻击，对细节的关注以及极其关注至关重要。


    ## 终端 (Terminal)


    如果你熟悉 Linux 和基础命令，你也应该熟悉终端（Terminal）。这是你与 Linux 的 shell 交互的方式，命令它执行你预期的操作。你本质上是在向服务器输入内容，然后期望从另一端得到正确的响应。这是最简单的
    Linux 命令的基础。


    作为一个快速复习，如果已经有一段时间没用了，你将在图形环境中模拟终端，以便你以可阅读和理解的方式看到输入和输出。如果你已经有了 Linux 或 OS X，你已经可以访问终端，你也可以安装其他的。如果你有
    Windows，你可能想安装 `PuTTY`。Kali Linux 内部也有它自己的终端，你可以轻松访问。


    ### 命令提示符 (Command Prompts)


    当你与终端交互时，你正在使用命令提示符或 shell 提示符——在阅读各种指南时，你可能会看到这两个词交替使用。当你进入终端内部时，你会看到一个非常特定的提示符组成。它将是用户名、服务器的主机名、你所在的目录以及提示符符号。在大多数情况下，你看到的提示符符号是
    `$`。


    实际上地，如果你的用户名是 hacker，你所在的服务器是 hacking，且你当前处于默认主目录，你可能会看到默认提示符：

    `hacker@hacking:~$`


    然而，在 Kali Linux 中，你始终登录在唯一的 root 用户账户上。你看到的用户名是 `root`，而不是 `hacker` 或任何其他可能在那的名字。


    ### 执行命令 (Executing the Commands)


    当你想要输入命令时，你必须以系统能够妥善管理的方式指定你的需求。你可以输入脚本，即一组预设的信息，它将触发系统以特定方式做出响应。你也可以输入你自己的命令。这是本章的大部分内容：与服务器交互和命令服务器的方法。


    当命令运行时，它被称为一个进程（process）。当该进程在前台运行时，你必须等待它完成后才能做任何其他事情。这是运行程序的默认方式。


    你还可以以两种形式输入命令：带参数或不带参数。当你输入一个不带参数的命令时，你输入的是一个简单的命令，不期望其他内容。这会让计算机将你带到你指定的地点，或准确执行你所说的操作。例如，如果你写
    `ls`，你会突然看到屏幕上列出了所有内容——当前目录的文件和子目录。


    然而，参数（argument）试图在某种程度上改变该命令。通过添加参数，你增加了一个额外的条件——你可以告诉系统调出另一个目录的文件。你可以告诉系统在 30
    分钟后关闭而不是立即关闭。它们改变了原始命令的含义。当你输入一个带参数的命令时，你将按照特定的顺序输入：先是命令，然后是你正在运行的规范或位置。


    执行命令的另一种常见方式是使用选项（options）——这意味着它们具有某种后续修改。这在后面跟着一个 `-` 和一个字母，告诉系统你需要它提供什么。例如，如果我们回到
    `ls`，你可以选择为它添加其他内容，例如 `ls -l`，这告诉你的系统让它列出一个更详细的权限列表，包括比通常包含的得多的细节。


    你还可以混合使用，将你的选项和参数组合起来——事实上，为了运行正确的命令，将两者混合在一起是非常常见的。


    从这里开始，你将获得 Linux 中的几个你认为非常有用的命令。这些命令要么是一次很棒的复习，或者你根本就不需要这些信息。如果你不需要这些信息，或者你对自己在
    Linux 系统中的导航非常有信心，可以从这里跳到下一章。然而，如果你觉得需要这些命令，可以随时回到这里查看这些命令列表，以便真正学会如何使用它们。


    ## 归包 (Archives)


    本节中的代码与存档文件相关。它们将帮助你直接与系统文件交互，无论是访问、移动还是其他操作。


    ```

    tar cf archive.tar

    ```

    这将创建一个 `archive.tar` 文件。


    ```

    tar cjf archive.tar

    ```

    与上面类似，但使用 `bzip2` 格式压缩。


    ```

    tar czf archive.gz

    ```

    这是第一个命令的另一种变体。创建一个 `gzip` 压缩的 `archive.gz`。


    ```

    tar xf archive.tar

    ```

    这是上述命令的反向操作。从 `archive.tar` 中提取数据。


    ```

    tar xjf archive.tar

    ```

    使用此命令从 `bzip2` 压缩的 `archive.tar` 中提取数据。


    ```

    tar xzf archive.gz

    ```

    从 `gzip` 格式的 `archive.gz` 中提取。


    ## 目录导航 (Directory Navigation)


    这些代码允许你快速、方便地在目录之间移动。当你执行这些操作时，你无需手动一个一个地遍历你的目录。


    ```

    cd

    ```

    移动到 HOME 目录。


    ```

    cd ..

    ```

    与上面类似，但向上移动一级目录。


    ```

    cd /etc

    ```

    移动到 `/etc` 目录。


    ## 磁盘使用 (Disk Usage)


    这些特定命令与磁盘使用直接相关。它们将允许你查看有关当前磁盘状态的各种信息，当你密切监控系统时是非常必要的。


    ```

    df -h

    ```

    能够查看磁盘上的已和可用空间，特别是以人类可读的形式。你也可以选择 `-m` 代替 `-h` 以 MB 显示，或用 `-g` 以 GB 显示结果。


    ```

    df -i

    ```

    使用此命令查看（挂载）文件系统的索引节点（inodes）。


    ```

    du -ah

    ```

    以人类可读格式显示所有对象和目录的文件大小（字节、兆字节）。


    ```

    du -sh

    ```

    与上面类似，但仅显示当前工作目录的信息（兆字节）。


    ```

    fdisk -l

    ```

    当你查看硬盘分区的大小和类型时使用此命令。


    ## 文件和目录命令 (File and Directory Commands)


    本节命令将帮助你直接与系统中的文件和目录交互。它们将允许对文件的各种额外访问和使用。


    ```

    cp fileA fileB

    ```

    此命令将 A 复制到 B。


    ```

    cp -r source_directory destination

    ```

    该命令将目录递归复制到选定的目标位置。如果该位置已存在，将创建该目录。


    ```

    ls -al

    ```

    命令以详细格式列出目录中的所有文件。


    ```

    mv fileA fileB

    ```

    将 `fileA` 重命名为 `fileB`。如果 `fileB` 是目录，命令会将 `fileA` 移动到其中。


    ```

    mkdir directory

    ```

    创建一个目录。


    ```

    pwd

    ```

    显示你当前所在的目录。


    ```

    rm file

    ```

    删除指定的文件。通常被称为删除文件。


    ```

    rm -f file

    ```

    “强制”删除文件。此命令后不会有提示。


    ```

    rm -r directory

    ```

    递归删除目录及其内容。


    ```

    rm -rf directory

    ```

    当你想要递归“强制”删除目录及其内容时使用此命令。再次，请确保这是你打算的操作。


    ## 文件传输 (File Transfers)


    这些命令作为你的指南，根据需要将文件移动移动，以确保你始终能够将文件放在你想放的地方。


    ```

    rsync -a /home /backups/

    ```

    将家目录同步到 `/backups/`。


    ```

    rsync -avz /home server:/backups/

    ```

    本地和远程系统之间文件或目录的同步。


    ```

    scp file.txt server:/tmp

    ```

    将文件（此处为 `file.txt`）安全复制到服务器上的 `/tmp` 文件夹。


    ```

    scp -r server:/var/www /tmp

    ```

    将服务器的所有目录和文件递归复制到当前系统的 `/tmp` 目录。


    ```

    scp server:/var/www/*.html /tmp

    ```

    将服务器所有的 `.html` 文件复制到本地的 `/tmp`。


    ## 硬件信息命令 (Hardware Information Commands)


    这些命令将为你提供有关硬件的各种信息，确保你的硬件运行正常有效，以便你的系统一切无良好。


    ```

    badblocks -s /dev/sda

    ```

    将检查磁盘 `sda` 上是否有任何不可读块（你可以将 `sda` 更改为任何你想检查的驱动器）。


    ```

    cat /proc/cpuinfo

    ```

    提供当前 CPU 的信息，如使用率、速度等其他方面。


    ```

    cat /proc/meminfo

    ```

    提供内存信息，如使用率、速度等其他方面。


    ```

    dmidecode

    ```

    显示来自 BIOS 的相关信息。


    ```

    dmesg

    ```

    显示内核环形的消息。


    ```

    free -h

    ```

    显示系统的空闲和用内存，以人类可读的形式（字节、兆字节）。你也可以选择 `-m` 代替 `-h` 以 MB 显示，或用 `-g` 以 GB 显示。


    ```

    hdparm -I /sda

    ```

    提供关于磁盘 `sda` 的所有信息。


    ```

    lspci -tv

    ```

    显示 PCI 设备。


    ```

    lsusb -tv

    ```

    显示 USB 设备。


    ## 安装软件包 (Installing Packages)


    这些命令全部关于安装软件包，无论是从文件下载还是其他。


    ```

    rpm -i package

    ```

    安装软件包。


    ```

    tar zxvf sourcecode.tar.gz

    ```

    解压压缩包。


    ```bash

    cd sourcecode/

    ./configure

    make install

    ```

    这将从源码安装软件。


    ```bash

    yum info package

    ```

    显示关于软件包的信息。


    ```bash

    yum install package

    ```

    安装软件包。


    ```bash

    yum remove package

    ```

    卸载（移除）软件包。


    ```bash

    yum search keyword

    ```

    使用关键字搜索软件包。


    ## 网络 (Networking)


    这些命令与网络直接相关——让你看到你自己的网络正在发生什么。


    ```

    dig domain

    ```

    显示指定域名的 DNS 信息。


    ```

    dig -x IP_ADDRESS

    ```

    使用此命令对指定的 IP 地址进行反向查找。


    ```

    ethtool eth0

    ```

    查看和更改网络驱动程序和硬件设置的工具。


    ```

    hostname domain

    ```

    显示指定域名的主机名。


    ```bash

    hostname -i

    ```

    与上述命令非常相似，但显示所有本地 IP 地址。


    ```bash

    ifconfig -a

    ```

    调出所有网络接口及其 IP 地址。


    ```

    ifconfig eth0

    ```

    显示 `eth0` 地址及其详细信息。


    ```bash

    netstat -nutlp

    ```

    显示任何监听的 `tcp` & `udp` 端口及其相关程序。


    ```bash

    ping host

    ```

    向“主机”发送 ICMP echo 请求。


    ```bash

    wget http://domain.com/file

    ```

    下载位于指定 web 地址的文件。


    ```bash

    whois domain

    ```

    显示“域”的 whois 信息。


    ## 性能监控 (Performance Monitoring)


    这些命令用于确保你能够监控系统的性能。它们将确保你的系统运行良好、有效，并根据你的偏好优化自己的设置。


    ```

    htop

    ```

    这将让你移动到进程查看器的顶部。


    ```

    iostat 1

    ```

    允许你看到输入/输出统计数据。


    ```

    lsof

    ```

    列出系统当前存在的所有打开的文件。


    ```

    lsof -u [username]

    ```

    列出当前由该用户打开的文件。


    ```

    mpstat 1

    ```

    允许你看到与处理器相关的统计数据。


    ```bash

    tail -100 /log/messages

    ```

    让你看到最后的系统消息。


    ```

    tcpdump -i eth0

    ```

    允许你看到特定接口上的所有包（此处为 `eth0`）。


    ```

    tcpdump -i eth0 port 10

    ```

    允许监控端口 10 的数据，你可以将端口改为你正在尝试管理的端口。


    ```

    top

    ```

    显示顶端进程并允许管理它们。


    ```

    vmstat 1

    ```

    允许你看到虚拟内存相关的统计数据。


    ## 进程管理 (Process Management)


