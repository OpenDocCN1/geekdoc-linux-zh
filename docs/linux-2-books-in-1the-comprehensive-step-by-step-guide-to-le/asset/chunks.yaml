    # 第 6 章：控制特权用户


    此时，是时候开始讨论访问你的操作系统或服务器的用户的安全性和权限问题了。特别是在今天，人们似乎认为技术和服务器比以往任何时候都不安全，但与大众认知相反，实际上有大量的支持来保持系统的安全和稳固。其中一种方法就是控制特权用户，本章将教你如何做到这一点。


    在阅读本章时，你将引导了解各种类型的 Linux 账户，例如 `root` 用户、普通用户和系统用户。你将发现 `sudo`，它的全称是“super user
    do”（超级用户执行）。这是系统管理员使用的命令——只要你拥有正确的账户并拥有使用它的适当权限，这一个命令就允许访问一切和任何地方。最后，你将学习 `sudoers`
    文件。该文件本质上是 `sudo` 背后的底层程序——它控制着 `sudo` 以及从初谁有权访问 `sudo` 命令。


    所有这些都将帮助你管理服务器或机器上的用户，使你能够确保恰当的安全系统已就位。当一切准备就绪且系统安全后，你就可以宽心，感觉你的系统是真正安全的。


    ## Linux 账户类型


    首先，在继续学习其他内容之前，我们将讨论 `root`、普通和系统用户。你必须完全理解这三种用户账户类型，才能真正理解 `sudo` 和 `sudoers`
    如何在系统安全中发挥作用。


    由于 Linux 极其极其灵活，你有权创建几种不同类型的账户。事实上，如果你有需要，可以拥有几个 `root` 账户，或者在不同类别中拥有不同权限的账户。唯一重要的是你的需求能够得到有效满足。


    请记住，仅仅因为你拥有 `root` 账户并不意味着你不应该建立某种安全系统——你绝对应该有一个保护 `root` 账户的密码，以确保没有其他人能够在未经你许可的情况下访问这些文件并完全接管它们的控制权。这意味着你将能够确保文件本身具有另一层保护。现在，话话长说，让我们开始深入研究
    Linux 的三类主要用户类型。


    ![](img/rsrc38K.jpg)


    ### Root 用户


    你必须认识第一个用户是 `root` 用户。这通常也被称为超级用户（super user），特别是在 `sudo` 缩写中。超级用户或 `root` 用户是默认管理员账户的个人。这个人对系统拥有完全控制权，就像管理员账户对
    Windows 的控制权一样。凭借默认提供的 `root` 权限，该用户能够执行其任何命令，并直接控制或更改其他人的和服务账户。


    实际上，如果你是设置系统的人，那么这个账户应该是你的账户。这个账户能够统治其他账户，在不需要额外权限的情况下对它们进行进行管理和监控。所有权限都授予了 `root`
    用户。他们可以更改其他用户的权限、移动文件、更改文件的所有权，并在系统内执行任何其他操作。


    请记住，由于你拥有在程序内执行字面上任何事情的力量，操作系统不会告诉你不要做某事。你没有任何安全措施，在使用此账户时必须非常小心。如果你删除了系统文件，而你又没有定期保留文件的存档和备份，那么可能就无法挽回了。如果有一个用户能够对你的程序造成灾难性的破坏，那么这个用户就是超级用户或
    `root` 用户。


    Linux 假设 `root` 用户对自己所做的有相当好的掌握，正因如此，如果你在任何时候不确定自己在做什么，最好是无一一失，如果你认为必要，应该尝试寻求别人的帮助。总的来说，虽然这应该是你拥有自己权限的账户，但你也应该尽人类所能地避免使用此账户，以确保你没有面临破坏一切的风险。


    在某些特定的时期你应该使用 `root`。否则，对于大多数日常功能，你可能只用普通账户就足够了。当然，每当你尝试需要使用 `root` 用户执行的任务时，都应该确保在必要时切换，并在尝试任何操作之前备份你的数据。特别是，你需要使用
    `root` 权限将文件或目录移入或移系统目录。记住，系统目录是直接负责操作系统运行的目录，没有了它们，你就无法运行操作系统。当你尝试将任何文件复制到系统目录、更改其他用户的用户权限、进行某些系统修复，以及偶尔安装程序时，这些都将要求你使用
    `root` 账户。通常，如果一个文件需要 `root` 权限才能安装，是因为该文件本身将与系统目录直接交互。如果你没有在进行上述任何操作，只需避免它，省去自己可能搞砸的麻烦。


    ### 普通用户


    普通用户和系统用户具有相同的权限，它们通常都由 `root` 或另一个被授予某种级别 `sudo` 权限的用户创建。然而，普通用户通常是一个真实的人，而系统用户通常是预留给软件在必要时使用的用户。


    普通用户将拥有真实的登录壳（shell）和自己的家目录，每个用户还会被分配一个 `UID`——用户标识符。如果在使用 `useradd` 命令创建新用户时未指定此项，则
    `UID` 通常会自动为你选择。但本质上，这个用户并不具备任何超特殊的管理员权限或超级用户状态。普通用户能够访问任何未被标记为不可用的文件，并且普通用户的权限可以根据用户在任何时刻的需要定期进行更改。


    最可能的是，如果你在自己的设备上运行 Linux，你起初会有一个 `root` 账户（最初用于设置整个操作系统的管理员账户），然后你还会自己设置一个普通用户账户，以确保你不会意外删除某些关键内容或破坏重要东西。这是你防止意外的一种保护措施。普通用户自身的权限可以由
    `root` 用户自定义——只要你知道正确的编码方法，你就可以从 `root` 账户为普通账户授予自己你所需的任何权限。


    ### 系统用户


    正如前面简要提到的，系统用户被授予与普通用户相同的初始权限。然而，系统用户几乎总是某种软件或程序，例如守护进程（daemon），它们将在后台运行，并且可能没有特别的交互性。


    这种用户分类主要是为了组织目的。当你将账户指定为系统账户时，你一眼就能看出它不会涉及任何人类与之交互。可能有一个守护进程在运行该用户，但永远不会有人登录它。虽然在现实世界中，这在技术上可能并不重要，但能够一眼看出你有多少人类用户而不是运行特定软件的守护进程，是很好的。通常，这些系统账户是操作系统在安装期间创建的，操作系统保留了对它们的控制。它们通常具有非常特定的用户
    ID，你可以在 `root` 账户中识别出它们。因为这些服务用户将运行操作系统所需的进程，所以当你更改、结束或重置任何进程时，应该放过它们。你想要确保尽可能让这些服务用户保持现状，以保护自己免受损坏软件。如果你损坏了其中一个，你很有可能会破坏整个操作系统，不幸的是，如果你不留神，这很容易办到。


    ## Sudo


    现在，是时候讨论 `sudo` 了。如果你在命令前使用 `sudo`，你本质上是在推高它。你告诉系统，你正在以应该被尊重的提权权限执行特定的进程。通常，提权权限是系统检查你是否确实被授予了你正在进行的任何更改的权限。


    如果你之前一直主要使用 Windows，你已经与这种账户的某种示例交互了。当你安装软件时，你是否注意到某些安装会弹出一个提示，询问你是否确定继续，并要求你给予软件执行所需的权限？这就是你在
    `sudo` 中正在做的。你实际上是在给予这种权限，但不是通过点击按钮。


    如果你目前一直主要使用 macOS，当你触发被识别为危险或会对操作系统产生重大更改的下载时，你有类似的保护措施。在 Mac 上，你会看到一个安全框弹出，然后你必须向系统提供你的密码以确认你确实想要对系统执行该更改。


    '
- fmt: '

    ## 1. Which user type has the most privileges?

    1. Normal user

    2. Root user

    3. System user

    4. Random user


    ## 2. What is the command necessary to override administrative blocks without
    having to log into the administrative account?

    1. `sudore`

    2. `visudo`

    3. `sudo`

    4. `su`


    ## 3. Which statement is true?

    1. You should avoid the root user account due to risk of deleting important information

    2. You should avoid the use of `visudo` editing due to the risk of deleting important
    information

    3. You should avoid the use of `sudo` commands due to the risk of deleting important
    information

    4. You should avoid using Linux due to the risk of deleting important information

    5. All of the above


    ## 4. True or false: `visudo` will check for errors when you make edits.


    ## 5. True or false: `visudo` will publish a faulty edit to the `sudore` file
    without warning by default.


    # Chapter 6 Answer Key


    1. **B**: The `root` user has all privileges by default.

    2. **C**: `sudo` is the command used to override administrative blocks.

    3. **A**: You should avoid using the `su` root account if at all possible due
    to it lacking the safeguards of all of the other mentioned processes.

    4. **True**

    5. **False**: You must command it to save the faulty edit manually, overriding
    it from warning you about the presence of a syntax error to begin with.

    '
