  trans: "\n\n- **传输层 (TCP)**：接下来是 `TCP` 段——它提供端到端的数据传输，并管理流量。它与所传输的数据是独立的。\n- **网络层\
    \ (数据包)**：这在物联网的网络层完成。该部分通过使用 `IP` 地址和路由表，跨适当的网络之间对数据进行路由，以确保它们能够到达正确的最终目的地。\n\
    - **数据链路层（帧）**：此层控制并促进发生在单个物理网络内硬件之间的直接连接。它使用 `NICs`（网络接口卡）中的 `MAC`（介质访问控制）地址来识别连接到网络上的任何设备。它只能与共享同一个网络的其他设备和主机交互。\n\
    - **物理层（比特）**：这一层由 `NICS` 和允许网络之间连接的物理以太网线组成。以太网线实现了比特（bits）的传输。\n\n### IPv4\n\
    这指的是互联网协议版本 4——即你的 `IP` 地址。通过 `IPv4`，你正在使用第 4 种协议。实际上，`IPv4` 地址将是一个以点分十进制法显示的\
    \ 32 位数字。你会看到两个主要组成部分——网络前缀和主机号。共享相同网络的主机也将共享相同的网络地址。然而，每个主机还拥有其自身的唯一数字部分。如果设备正在访问互联网并对网络外部可见，则它必须包含一个全局唯一的数字。\n\
    \n### TCP\n传输控制协议（Transmission Control Protocol）的简称，是互联网协议族中的主要协议之一。它的设计目的是创建一个标准，允许每个人建立并维护网络会话，因为每个人使用的数据都是兼容的。它允许以数据包的形式进行数据交换。\n\
    \n### UDP\n指的是用户数据报协议（User Datagram Protocol），这是上述讨论的 `TCP` 模型的替代通信协议。`UDP` 用于建立低延迟和容错的连接，以实现高速度和低风险。\n\
    \n### 路由\n现在，此时，你可能正在考虑将你的 Linux 服务器转换为路由器——这是一个很好的观点，也有许多人确实这样做。为了实现这一点，你必须首先对路由器进行配置，然后分配必要的地址。\n\
    \n### Linux 作为路由器\n首先，你必须配置设备。这要求你首先在两个设备上设置 `IP` 地址，并确保它们都使用相同的网关 `IP`。现在，你想做的是设置你的网络以适应该网关\
    \ `IP`。要做到这一点，你必须登录 root 账户，然后运行命令：\n\n```bash\nnmtui\n```\n\n接下来，选择编辑连接（Edit\
    \ a connection）并按回车键。选择窗口左侧显示的以太网，选择右侧的编辑（Edit），再次按回车键。在此阶段，你将有机会将 `IPv4` 配置为手动（manual）。然后，你需要输入想要访问网络的\
    \ `IP` 地址。如果需要，可以添加更多。选择退出（Quit）然后按回车键。此时，你应该重启网络，然后你需要确认更改已生效。为了做到这一点，你将输入命令：\n\
    \n```bash\nip addr\n```\n\n然后你应该能够看到可以访问网关而不访问另一个网络的系统。你可以通过 `ping` 命令确认这一点。ping\
    \ 的返回结果应该是目标主机不可达。\n\n### ifconfig 命令\n`ifconfig` 是一个用于网络接口配置的命令行界面（CLI）。除了这些，它还用于在启动期间初始化接口。当服务器活动运行时，可以使用\
    \ `ifconfig` 进一步为接口分配 `IP` 地址，并根据需要启用或禁用任何接口。此命令还允许你查看所有活动接口的状态 `IP`、任何连接的硬件和\
    \ `MAC` 地址以及最大传输单元（MTU）。总体而言，此系统命令旨在允许你调试或调整系统。\n\n### DNS 设置\n如果你发现 `DNS` 设置配置错误或需要以某种方式更改它们，这里有一个非常简单的方法。你可以通过向配置文件中添加名称服务器来实现。在大多数\
    \ Linux 系统中，`DNS` 会在 `/etc/resolv.conf` 文件中创建名称。该文件通常包含至少一条 `nameserver` 行。该行将是\
    \ `DNS` 服务器的定义行。名称服务器将根据它们在系统中发现的顺序进行优先级。为了方便访问，请使用你将使用的服务器的 `IP` 地址。要管理这些，你需要使用某种编辑器（如\
    \ `nano`）打开 `resolv.conf` 文件。通过这样做，你就可以进行更改。如果你的系统上尚未使用 `nano`，请尝试以下命令安装它：\n\n\
    ```bash\n$ sudo nano /etc/resolve.conf\n```\n\n然后你就可以为你正在使用的名称服务器添加行了。通常情况下，你可能想要托管你任何云服务器的那个。重命名行后，你就可以保存文件。当然，与任何重大更改之后一样，检查\
    \ `ping` 以确保域名设置已生效，并确认你确实在使用指定的 `IP` 地址。如果你在此时收到了显示主机未知的消息，你可能需要再次尝试重置一次 `IP`\
    \ 地址，因为你设置的地址可能存在错误。\n\n### /etc/hosts\n此命令允许你在本地配置 `DNS` 而不是使用外部 `IP` 地址。当你使用\
    \ `/etc/hosts` 命令时，你将确保命名结构是正确的。它允许你手动输入选择的 `IP` 地址和主机，以确认你能够获取你寻找的域名。\n\n###\
    \ 诊断命令\n- `ping`：这是测试连接性的方法。`ping` 代表分组分组探测（Packet Internet Groper），经常用于识别局域网（LAN）或广域网（WAN）之间的连接性。它利用\
    \ `ICMP` 与网络上的其他节点通信。\n- `traceroute`：这是一个允许跟踪本地系统到另一个网络上的独立系统的整个路径的 CLI。它将记录到达所需的服务器必须经过的路由器\
    \ `IP` 之间的跳数数。\n- `tracepath`：此命令允许追踪到目的地的路径以发现 MTU。它将利用一个 `UDP` 端口。与 `traceroute`\
    \ ，但这种特定的追踪不需要相同的超级权限，因为它仅仅是信息性的并提供所有必要的信息。\n- `netstat`：此 CLI 用于显示你所需的网络连接、任何路由表、统计和其他对理解网络系统重要的信息。它还用于调试和检查哪些程序位于哪些端口上。\n\
    \n### 第 7 章测试\n恭喜！你完成了第 7 章！现在你应该对你的 Linux 上的网络如何工作以及你将遇到的关键特征有一个大致的。与之前的章节一样，是时候进行你的\
    \ 5 题测试了。这将有助于你理解本章介绍的内容。\n\n1. 什么是网络？\n    1. 你认识的人群\n    2. 连接在一起的设备组\n    3.\
    \ 相互通信的软件组\n    4. 共享同一互联网提供商的邻居\n2. 什么是 WAN？\n    1. 互联网\n    2. 广域网\n    3.\
    \ 广泛访问网络\n    4. 精彩访问网络\n3. 如果网络中心故障会发生什么？\n    1. 整个网络停止工作\n    2. 一半网络停止工作\n\
    \    3. 只有中心停止工作\n\n"
