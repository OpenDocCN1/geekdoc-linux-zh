    # 第 7 章：基础网络管理


    得益于 Linux 极高的灵活性和可定制性，它在网络管理领域极其多能。这使得当你需要运行数据中心或某种类型的服务器时，它变得特别有用。本章将为你提供入门 Linux
    配置所需的最后阶段信息。我们将引导你学习网络，就好像这一切对你来说都是全新的一样——因为作为本书读这本书的初学者，这可能很可能确实如此！


    在本章中，你将学习网络扩展和拓扑结构，了解它们的工作原理。你将被引导学习若干种协议，获得关于路由的信息，并学习一些对你可能有用的命令，然后你就能进入正轨了。下一章将引导你如何为
    Linux 发行版安装选择各种软件，但这是包含所有硬核、密集内容的最后一章了。恭喜——你很快就到终点了！


    ## 网络基础 101


    网络允许计算机、手机、外围设备、IoT 设备等全部连接在一起，访问同一条数据线路并进行通信。这就是互联网的概念——你能够访问互联网网络，并与即使在地球另一端的设备进行通信。


    网络方面有几个重要的点需要考虑，但从根本上，要把互联网想象成一个巨大的网——它相互互连，并有多个接入点供其他设备进入。无论你当时位于该网的哪个位置，你都可以以某种方式到达网上的任何其他点，即使这种方式可能比所需的或应有的慢。这意味着你能够以某种方式在网络中跳跃，来访问你需要的数据，即使这些数据不在你的物理机器上。这就是互联网的工作原理。


    然而，网络的用途远不止普通的网页浏览。它对于数据分发、数据存储、通用网络等非常有用。得于这张网，我们能够从任何可以连接互联网的地方轻松流媒体视频，或访问云端文件。你只需要一个稳定的连接，就可以访问几乎任何已连接的内容。


    ## 网络扩展


    网络扩展到多个用户之间，允许在必要时快速分发数据。最终，网络可以被分为三个不同的类别：`LAN`、`MAN` 和 `WAN`。如下所示，你可以看到 `Lan`
    是最小的，`MAN`较大，而 `WAN` 是最大形式的网络。随后的每个网络类型都将由前一个类型的几个其他方面组成。本质上，几个 `LANs` 构成一个 `MAN`，几个
    `MANs` 构成一个 `WAN`。


    ![](img/rsrc38M.jpg)


    ### WAN

    代表广域网（Wide Area Network），`WAN` 是跨越任何给定特定地理区域的通信网络。它可能涉及一个城市甚至一个国家，根据用途和管理方，这些可以是公有的也可以是私有的。


    要理解 `WAN` 的作用，请停下来思考互联网——现在将其想象为最大的 `WAN`。若干网络连接在一起形成一个巨大的整体。这就是 `WAN` 的本质——在一个
    `WAN` 中，你会有几个较小的 `LANs` 或 `MANs` 都在同一个区域内，构成了 `WAN`。`WAN` 广泛连接，其到达范围比 `LAN` 更远。如果你希望运行网络或大规模的服务器，这使得
    `WAN` 最佳选择。


    ### LAN

    代表局域网（Local Area Network），`LAN` 要小得多。通常，`LAN` 覆盖单栋建筑，例如房屋，甚至只是建筑中的某一个办公室。它的设计初衷要小得多，访问人数也少得多。它们最经常通过
    `Ethernet`（以太网）连接以控制数据流，尽管越来越多的 `LANs` 正在转向无线，即被称为无线局域网或 `WLANs`。


    如果你有一个家庭设置，其中两个系统共享数据访问权限，那么你就有 `LAN`。计算机之外的其他系统也可以组成 `LAN`，例如共享数据的打印机或智能电视。这些用于本地数据的共享，而不是大规模范围分发。然而，它们对于家庭或小型企业来说非常有用。


    ### MAN

    代表市域网（Metropolitan Area Network），它比 `LAN` 大，但仍比 `WAN` 小。例如，这可能是一个大型科技园区，它共享一个跨越几个街区甚至几平方里的网络，但覆盖范围不是特别广——这就会是一个
    `MAN`。它也可以用来描述一个城市。通常，一个 `MAN` 是由几个 `LANs` 构成的，而 `MAN` 是在 `LAN` 内部传递数据的极佳方式，允许其延伸得更远。


    ## 网络拓扑结构


    在对网络本身有了理解后，是时候看看最常见的拓扑结构了——网络连接到节点的形式。节点是以某种方式连接到网络的单个设备，不同的拓扑结构将根据需要和最合理的逻辑以不同的方式组织这些网络。


    ### 点对点 (Point to point)

    这种网络拓扑结构有时被称为总线拓扑（bus topology），有一根中央电缆运行在 `LAN` 上所有设备之间并连接它们。它很容易连接，但如果系统发生任何故障，整个系统都会崩溃。


    ### 星型 (Star)

    ![](img/rsrc38N.jpg)

    星型拓扑结构将多个设备连接到一个被称为 `hub`（集线器）的中央计算机，如上图所示。节点首先通过 `hub` 进行通信。在这种形式下，单个节点的故障不会影响网络的其他部分，但同时，如果
    `hub` 故障，整个网络就会瘫痪。


    ### 环形 (Ring)

    ![](img/rsrc38P.jpg)

    在环形拓扑结构中，`LAN` 以环形拓扑建立。每个节点在闭环中与另外两个节点连接，所有消息都沿着该圆圈传输。这允许正在传递的消息在经过每个节点时被重新生成。


    ### 树型 (Tree)

    树型拓扑是总线和星型拓扑结构的混合体，画出来看起来像树。它涉及若干配置为星型的网络，连接到单一的线性骨干上。这对于受益于分成易于管理的部分的较大计算机网络非常好，但该系统处于劣势，因为骨干充当了
    `hub` 的角色，如果它失败，一切都会失败。


    ### 网状 (Mesh)

    全网状拓扑将每个节点连接到一条连接到网络内每个其他节点的电路上。管理成本高昂，但它提供了最高的冗余性——这意味着它更安全。即使单个节点故障，流量也可以继续，因为所有节点都是互连的。


    有时，某些节点按全网状模式组织，而另一些节点并非完全互连，这允许某些冗余并节省一些资金，同时仍维持有效的网络。这被称为部分网状拓扑。


    ## 互联网的主要协议


    ### TCP/IP

    作为路由的前身，你必须首先理解 `TCP/IP` 网络模型。这是数据包在互联网上往返寻找路径的方式，使其能够到达网络内的正确主机。在这个网络模型中，有五层描述了根据需要主动转换和移动数据包从主机到主机的必要过程，无论该主机是在本地还是在世界的另一端。


    ![](img/rsrc38R.jpg)


    *   **应用层 (Message)**：一切始于一条消息。第一层由通信所需的必要协议，例如 `HTTP`、`SSH`、`IMAP` 以及任何其他必要的命令。当你从任何地方请求网页时，消息通过这些格式之一进行通信。


