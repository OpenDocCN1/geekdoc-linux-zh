    *   Download an ISO image from the official Kali Linux “downloads” mirror and
    then calculate the `SHA256` while comparing it to the one listed on the Kali Linux
    site. You should be able to do this quite simply—but this is also potentially
    vulnerable to exploits.

    *   Download the ISO image through a torrent and it will also give you a file
    that has the calculated `SHA256` signature on it. You are then able to use the
    `shasum` command if you are already on Linux or OSX , or in a tool on Windows
    to verify that the file’s signature matches the signature within that other folder
    downloaded. Again, this suffers from potentially being vulnerable to exploit as
    someone could quite simply provide you with matching numbers just to make it look
    like a legitimate installation of Kali Linux in order to ensure that you are fooled.

    *   The only way to be as certain as possible is a bit more involved—you will
    need to download the cleartext signature file and the version of the file that
    was signed off with the official private key. Then, you must utilize GNU Privacy
    Guard. This will then verify that the `SHA256` combination and the one in the
    cleartext files match, and then it will ensure that the signed version of the
    file with the `SHA256` hash is also correctly signed with the proper official
    key.


    ## Step 3: Create Kali Linux Bootable USB Drive


    Perhaps the fastest method of getting Kali up and running is through using a live
    bootable USB. Essentially, what you are doing is getting Kali Linux onto a USB
    drive and then booting it up from that USB. This comes with several advantages
    of its own, such as avoiding any sort of destruction or mayhem. When you use this,
    you are not making any changes to the system you are using—you are simply running
    it from the USB. This also brings up the point that it is portable and customizable—you
    will be able to take it with you anywhere and boot up from any computer, and you
    will be able to create your own custom Kali ISO onto the USB drive in the same
    way that will be discussed here.


    In order to create the bootable drive, you will need to have a verified copy of
    the ISO, a disk imager utility (if you are using Windows, you can download the
    `Win32 Disk Imager`, or if you are on Linux or OS X, you likely already have this
    and all you will need to do is use the command, `dd` in order to pull it up) and
    a USB drive or an SD card, so long as the system that you are using allows for
    direct access with either of those methods. Your storage should have at least
    4GB with more recommended.


    ### Create the Bootable USB with Windows


    When you do this on a Windows computer, you will have several steps to go through
    that are different compared to if you had been running a Linux or OS X machine.


    *   Attach the USB drive into any available USB port on the computer and note
    whichever drive designator has been set to it. With it mounted, launch `Win32`.

    *   Select the Kali Linux ISO file that you are imaging and confirm that you are
    overriding the proper USB drive. When you have confirmed that it is correct, press
    the Write button. As soon as it is finished imaging, eject the USB drive and it
    is now ready to use.


    ### Creating the Bootable USB with Linux


    On Linux, the steps are slightly more involved, and you run the risk of struggling
    or accidentally overwriting a disk drive that was unintended. You are going to
    need to make sure that you are using the right commands to guarantee that you
    are not accidentally overwriting anything.


    *   First, you must figure out the device path that you will be using to write
    the image to the USB drive. You want to do this without the USB inserted at that
    point in time. Within the terminal, you want to write:


    ```bash

    sudo fdisk -l

    ```

    You should get an output that shows a single drive with three partitions.


    *   At this point, plug in your USB to the available port and once again repeat
    the previous command of `sudo fdisk -l` and you should now get a similar output
    showing an extra device this time that was not there before—this time, that is
    your USB drive.

    *   Now, you must image the ISO file onto the USB device with a command similar
    to the one that will be provided below. This command assumes that your ISO image
    is named `kali-linux-2017.1-amd64.iso` and is currently within the working directory.
    It also assumes that your USB drive’s name is `/dev/sdb` and you will want to
    replace the name of the file and the name of the drive if necessary. You can choose
    the blocksize if you wish to try speed things up, but this is the safest size
    that has created reliable images. The command here is:


    ```bash

    dd if=kali-linux-2017.1-amd64.iso of=/dev/sdb bs=512k

    ```

    *   The imaging process can take upwards and sometimes over 10 minutes, so be
    patient as you wait for this process. You will not get any feedback about this
    process until the system is done.

    *   When it is finished, your USB device is now ready to boot.


    ### Creating a Bootable USB on OS X


    *   Start with the USB drive unplugged. Open the Terminal and type the command:


    ```bash

    diskutil list

    ```

    *   You should see several device paths, just as with the Linux version. You will
    get information on each of the partitions and all of the information that you
    could possibly need.

    *   Now, plug in the USB device and rerun `diskutil list` again. Doing so will
    now present you with a new disk drive. You can now see a new disk drive that was
    not present before, which is how you now know how to address the command.

    *   Now, unmount the drive—this time, we will act as if the drive is named `/dev/disk6`
    for the example. Your command will be something like:


    ```bash

    diskutil unmount /dev/disk6

    ```

    *   At this point, you need to image the Kali ISO file to the device with a command
    such as:


    ```bash

    sudo dd if=kali-linux-2017.1-amd.iso of=/dev/disk6 bs=1m

    ```

    Keep in mind that there is no guarantee that your own file and drive will have
    the same file names. You will need to change them accordingly. Again, there will
    be no feedback until the drive is done loading, at which point you will have a
    bootable USB.

