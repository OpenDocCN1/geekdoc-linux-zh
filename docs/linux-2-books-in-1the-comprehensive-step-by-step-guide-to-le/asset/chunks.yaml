  trans: "\n\n# Shell 脚本\n\n因此，Shell 脚本是供 shell 执行的多个命令的组合。这些命令可以结合若干项重复任务，并创建一个简单的脚本存储在其中，直到需要使用时，允许在几乎任何时间点执行。这减少了终端用户所需的工作量，因为整个系列重复任务可以合并成更短的内容。如果你将例行使用同一组长命令，那么这将是完美的。如果你将它们全部合并成一个脚本，你就可以同时触发整个过程运行，而不需要每次使用时都编写每个命令。\n\
    \n请记住，shell 脚本需要非常特定的语法。shell 由几个元素共同组成：关键字、命令、函数和流程控制。这些元素中的每一个都发挥着自己的作用，并且对于理解它们至关重要，以便你能够以计算机可以处理的方式真正创建这种语言。思考一下你自己的语言——语序很重要，对吧？“I\
    \ can have pizza”和“can I have pizza”具有两种完全不同的含义——一个是确认许可，另一个是请求许可。同样，如果你混淆了语法，你的\
    \ shell 并不总是能理解你。\n\n![](img/rsrc38J.jpg)\n\n## 如何编写 Shell 脚本\n\n在本教程中，我们将使用 `bash`\
    \ 标准工作，因为它是 Linux 系统中默认常用的标准结构。创建 Shell 脚本的步骤并不困难，只要你能够跟上即可。为了创建你的脚本，你需要遵循五个简单的步骤。当然，随着你继续阅读此本书并学习更多命令以创建更复杂的脚本，你的脚本编写也将变得更加复杂。请将其视为一个基础指南。\n\
    \n首先，你必须使用 `vi` 编辑器创建文件。你想要确保文件名以 `.sh` 结尾，以确保它能够正常运行。\n\n现在，你必须使用以下代码开始脚本：\n\n\
    ```bash\n#!/bin/sh\n```\n\n符号 `#!` 是一个运算符。它被称为 shebang，它引导脚本确保它到达正确的 shell。当你将其指向\
    \ `/sh` 时，你实际上是在将其指向 Bourne shell。\n\n在指向了 `/sh` 之后，你就可以自由编写想要执行的代码了。这就是第 5 章派上用场的地方——你将学习创建你寻找或所需的脚本所需的命令。当你写完代码后，以\
    \ `.sh` 格式保存脚本文件。假设你的文件命名为 `listfile.sh`，因为你设计它是为了列出当时存在的所有文件。\n\n当你想要执行已保存的脚本时，输入：\n\
    \n```bash\nbash listfile.sh\n```\n\n输入该命令将触发脚本执行，并为你提供最终结果。目前，这些就是你需要知道的全部。当你阅读第\
    \ 5 章时，开始考虑你想要编写的脚本的一些潜在选项。\n\n## 基础命令行编辑\n\n在结束关于 shell 的章节之前的最后一点，你将获得一个简短的命令行编辑列表。如果你能够记住这些命令，这个功能对你将非常有帮助。\n\
    \n- `CTRL + L`: 清屏\n- `CTRL + W`: 删除光标当前所在的单词\n- `CTRL + U`: 清空当前命令行\n- `上或下方向键`:\
    \ 调回之前的命令\n- `Tab`: 自动补全文件名和目录\n- `CTRL + R`: 允许用户搜索命令历史\n- `CTRL + C`: 取消当前命令\n\
    - `CTRL + T`: 反转光标前最后两个字符\n- `ESC + T`: 反转光标前两个单词的顺序\n- `CTRL + H`: 删除光标前的一个字母\n\
    \n## 第 4 章测验\n\n恭喜你！你已经完成了第 4 章。到此时，你应该对理解 Linux shell 有了相当坚实的基础。尝试回答这些问题，以确保在继续之前理解了基础知识。答案将在将在测验之后的页面上。\n\
    \n1. **什么是 shell？**\n   1. 内核\n   2. 硬件周围的物理外壳\n   3. 允许用户与操作系统交互的程序\n   4. 操作系统的类型\n\
    \   5. 以上都是\n   6. 以上都不是\n\n2. **判断对错：Bash 是 Linux 运行所必需。**\n\n3. **终端允许你做什么？**\n\
    \   1. 与操作系统交互\n   2. 控制电脑功能\n   3. 建立 ssh 连接\n   4. 以上都是\n   5. 以上都不是\n\n4. **哪两个\
    \ shell 是兼容的？**\n   1. Bourne shell 和 C shell\n   2. Bourne shell 和 tcsh\n   3.\
    \ Bourne shell 和 Korn shell\n   4. 以上都是\n   5. 以上都不是\n\n5. **判断对错：shell 是计算机最内层的部分**\n\
    \n## 第 4 章答案解析\n\n1. **C**: shell 是用户用来与系统交互的程序。\n2. **错误**: 如果你希望对你的计算机系统进行任何实际控制，它是用的，但并不是绝对必要的。即使你需要一个\
    \ shell，`bash` 也不是你唯一的选择。\n3. **D**\n4. **C**: Bourne shell 和 Korn shell 用户都可以互相切换两者。\n\
    5. **错误**: shell 是操作系统的最外层组件。\n\n"
- fmt: '

    # Chapter 5: Linux Commands


    This chapter is designed to be a sort of accessible dictionary for you, where
    you can access a wide range of Linux commands on demand in one place. Because,
    especially at first, you are going to find that you are not quite familiar with
    the system commands off the top of your head, it can be useful to have a chapter
    to fall back on to look up the command you will need.


    These commands are designed to be used within the terminal, allowing you to directly
    communicate to the system itself. This means that, through the use of the terminal
    and the commands provided within this chapter, you will be able to directly influence
    and interact with the computer. Of course, there are also several rules that you
    will have to remember when utilizing these commands.


    Keep in mind first and foremost that `$` is prompt to inform you that the individual
    is officially ready for your input within `bash`. However, `csh` will utilize
    the `%` to prompt you to enter your input. Also, remember that the inclusion of
    a colon after the code within this book is done to separate it from the description
    of that particular command’s function, and the colons should not be included.


    Beyond that, you must also recognize that Linux is, in fact, case-sensitive. If
    you enter a code with a capitalized letter that is not intended to be there, it
    will fail to load up whatever it is that you have prompted it to load in the first
    place. This does come with some advantages, such as allowing for identical strings
    of symbols in the same case to be processed quicker rather than having to process
    all of the letters to ensure that the letter itself is registered in either case
    rather than the specific case expected. Even though computers today are more than
    capable of processing that extra load, a habit has won out, and case-sensitivity
    remains to be a feature to remember.


    ## System Information Commands


    Hardware is incredibly important to be familiar with when you are working with
    the more intricate matters of a computer. For this reason, Linux comes with several
    commands that will allow you to access any information about the hardware that
    you may need. These commands will help you understand the configuration details
    of several hardware components.


    When you use these commands, you will be able to track your current system’s ability
    to function, and this means that you can see how to allocate resources or know
    how well the system can handle your current tasks. While some distributions will
    have slightly different commands, these are the most readily available commands
    out there if you need to gather information about your system.


    As you read through these command codes, notice how there are several that seem
    quite similar, but they all have their own nuances that set them apart somehow.
    It can be intimidating to see all of these codes typed out in front of you, but
    remember, there are tools available to you that will help you if you cannot or
    do not wish to memorize the commands.


    *   `accept`: Allows you to accept a job to a destination.

    *   `arch`: Displays the print machine’s hardware name.

    *   `date`: Displays the system’s date and time.

    *   `df`: This particular command triggers the computer to report the disk space
    available in the file systems. It reports on several different partitions and
    their mount points, providing data for all of it.

    *   `fdisk`: This is the utility command to change partitions on hard drives if
    necessary to do so.

    *   `free`: This tells your computer to check the amount of RAM on your computer—free,
    used, and the total amount of RAM on the system.

    *   `hdparm`: This tells your computer to provide you with information about hard
    disk drives or other sata devices.

    *   `hwclock`: Displays or allows for the configuration of the hardware’s clock.

    *   `hwinfo`: This is a general purpose command that probes the hardware—it will
    provide you with either detailed or brief information about hardware components,
    providing more than what you may use `lshw` for.

    *   `lnxi`: This is a `bash` script, meaning it contains a larger code. In fact,
    this particular command has a 10,000 line code within it. In activating this code,
    you will gather up all sorts of hardware data from several different sources,
    placing it all into a nice, easy to read a report that even beginners will have
    little issue navigating.

    *   `lsblk`: This triggers the device to list out block devices. In doing so,
    you will see hard drive partitions as well as optical and flash drives.

    *   `lscpu`: This command will pull up a report about the CPU and processing unit
    on your computer.

    *   `lspci`: This command lists out pci buses while also giving you further details
    about them. It includes the vga adapter, graphics card, USB ports, and more. With
    this particular command, you can also filter out the specific information you
    are looking for through the utilization of `grep`, which will be discussed in
    further detail later in the chapter.

    *   `lsscsi`: This command lists out scsi devices, such as hard drives and optical
    drives.

    *   `lshw`: This is a general purpose command that will list out all of the hardware
    installed on your system, as well as the data included within it.

    *   `lsusb`: This command provides the user with data about the USB controllers
    and any devices connected to them. You can add `-v` to your code if you wish for
    this detailed information to be printed for you.

    *   `mount`: This is designed to either mount or unmount devices, as well as view
    mounted file systems currently interacting with the server. Once again, you can
    utilize `grep` to filter out exactly which files you are interested in seeing.

    *   `uname –m`: triggers the system to print the machine hardware name.

    *   `uname -r`: triggers the system to print the kernel release being used.


    ## System Shutdown, Restart, and Logout Commands


    Thankfully, Linux makes it incredibly user-friendly to restart your computer or
    shut it down. While on most other operating systems, you simply go through the
    buttons and prompts to select shutdown, restart, or logout, with Linux, you can
    do this via the terminal as well. For those who are always accessing their terminal,
    this means that you will be able to manage your system with just a few keystrokes.


    Keep in mind that most of these processes will end your current session—for that
    reason, you must make sure that you are ensuring that you will not lose your work
    as you go. This section will guide you through the most common shutdown commands.
    With these commands, you can begin to take control of the system—you can program
    the system to shut off at a predetermined time or decide to turn off within a
    few hours or minutes. No matter when you choose as your computer’s shutoff time,
    you will be able to program it in. This is the beauty of Linux—you can program
    whatever commands you desire within it.


    *   `sudo shutdown –h HH:MM`: After the `-h`, you can enter a time that you would
    like to trigger the computer to turn off. You can enter `now` or in any other
    time, keeping the format in `HH:MM`, so if you want your computer to turn off
    at exactly 7:38 PM, you will enter: `sudo shutdown –h 19:38`.

    *   Without the time included, you will get a message telling you that you must
    set a specific time for the shutdown to occur. Instead of using `HH:MM` or `now`,
    you can also opt to do `+30` to add 30 minutes to the program.

    *   `sudo shutdown –c`: this will cancel the currently scheduled shutdown command
    if you have it set to cancel at a specific point in time. When you use this, you
    will be able to ensure that you are not interrupted by the scheduled shutdown.

    *   `sudo reboot`: this will trigger your computer to restart itself.


    `init` Service manager. This will determine the level at which your program is
    running. There are several different run levels that can be within—from `0-6`,
    `s`, and `m`.


    *   `init 0`: This is shutdown

    *   `init 1`: This is the single-user mode or emergency mode. There is no network
    or multitasking.

    *   `init 2`: There is no network at this stage, but the support for multitasking
    is available.

    *   `init 3`: The network and multitasking are present, but there is no GUI.

