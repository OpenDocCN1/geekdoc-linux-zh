    *   Distributed Operating System: An extension of the network operating system,
    this type of OS makes use of several processors in several different machines,
    allowing for high-efficiency computing and processing.


    *   Mobile OS: This is any OS that is designed specifically for mobile devices,
    such as smartphones and tablets. The most commonly used mobile operating systems
    include Android and iOS.


    Commonly used operating systemsMost of the time, any computer you buy will come
    with some sort of operating system already installed and ready to go. This means
    that if you want to use most products right out of the box, you can choose to
    do so. However, you can also upgrade them or change out your operating system
    for another one if you find that another one. For the most part, the choice of
    operating system is primarily a matter of preference, though some OS will come
    with different software compatibility.Perhaps the starkest difference between
    operating systems will be the graphical user interface (GUI- pronounced as gooey).
    The GUI is what you see on your display when you are using your computer and allows
    you to interact with your software, and in turn, hardware. This will be the combination
    of graphics and text that you see on your screen. While the GUI may be different
    between OS, they will all bring with them the same basic features and functions.Nevertheless,
    if you have a preference for one type of OS over the other, that is a valid matter
    of opinion, and the one you choose should be the OS that works best for you. Nevertheless,
    take a moment to familiarize yourself with the three most common operating systems
    you will encounter from day to day: Microsoft Windows, macOS, and Linux.


    *   Microsoft Windows: Created in the mid-1980s, this is the most popular OS you
    will encounter in varying versions. The most recent is Windows 10, which was released
    in 2015. Nearly any personal computer (PC) that you will buy comes preinstalled
    with Windows, with the most notable exception being Apple products. It is fairly
    versatile in what the user can do, and is constantly getting updates to keep it
    secure.


    *   macOS: Preloaded on Macintosh computers, macOS is much less popular. It is
    calculated that less than 10% of the global operating systems are utilizing macOS.
    It looks sleeker but is typically only works with proprietary software and peripherals.
    Altogether, between the three operating systems, macOS is going to be the most
    expensive to run to its fullest capabilities. Because of this, macOS is a bit
    more on the restrictive end in usage and customizability, with many common programs,
    games, and other software not being macOS compatible. However, the macOS tends
    to be on the less-hacked side, making it perhaps a bit more secure.


    *   Linux: Linux is a bit different than the other two—unlike the proprietary
    Windows and macOS, Linux is open-source. This means that it can be modified by
    anyone and distributed around the world for free. This makes Linux the least restrictive
    of the three major operating systems you will encounter, and yet it makes up less
    than 2% of the global operating systems in use. Despite this statistic, most servers
    will utilize Linux thanks to the versatility and customizability.


    Linux as an Operating SystemLinux, then, is an OS that is open-source—this means
    that it is readily customized and altered. Open-source operating systems are free
    to run, free to alter, and free to distribute, whether you have altered it or
    not. This means, then, that there are many different distributions of Linux floating
    around out there, as each person who has ever made a change or customized version
    for themselves is free to redistribute their own version. However, these distributions
    will be discussed in depth in Chapter 2. Linux can be installed on a wide range
    of hardware, allowing for the development of software and running of applications.
    This OS was developed in the C programming language, and today, C is still the
    primary language used. Initially designed to be similar to UNIX, which will be
    discussed in the next subchapter, Linux has evolved far beyond its initial scope.
    It is now used on phones to supercomputers and everything in between. When you
    use Linux as an OS, you are utilizing the Linux kernel to manage the hardware,
    and then building up from that kernel to develop the rest of the OS with software.The
    operating system that you think of when you hear Linux is actually an assortment
    of several different pieces. These pieces all work in tandem to allow the software
    programmed to function. These core pieces are the bootloader, the kernel, the
    init system, daemons, the graphical server, the desktop environment, and the applications
    that you install. These pieces all serve various functions that will be crucial
    to your ability to actually run the OS in the first place.


    *   Bootloader: This is the software that will boot the computer—this means that
    it will make trigger the operating system to start running. Most of the time,
    there will be a quick splash screen that will display, letting you know that the
    OS is booting up. The splash screen will disappear as soon as the OS is ready
    to function, and that time is largely dependent upon the hardware that is running
    it. There are several different bootloaders, such as LILO (Linux Loader), LOADLIN
    (Load Linux), or GRUB (Grand Unified Bootloader).'
