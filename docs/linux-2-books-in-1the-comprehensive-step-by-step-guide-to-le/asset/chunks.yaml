    # Debian GNU/Linux

    Announced in 1993, this was designed to become a non-commercial project completed
    through volunteer work of hundreds of developers. Most people thought it would
    fail—after all, how could hundreds of developers code for free in their spare
    time and create something cohesive? Nevertheless, the project was successful,
    and Debian became the largest Linux distribution within a decade. It encompassed
    1,000 volunteer developers’ work, with nearly 50,000 binary packages for eight
    different processor architectures. From this effort came more than 120 other distributions
    based on Debian. No other Linux-based OS comes close to these numbers.


    Debian exists in four main branches in several different developmental stages—
    “Experimental,” “Unstable,” also regularly known as `sid`, “Testing,” and “Stable.”
    Thanks to this process, it is recognized to have quite intensive levels of quality
    control, and Debian has earned recognition as one of the best-established, tested,
    and bug-free distributions you can find.


    Of course, the development process does have some down sides. In particular, the
    stable releases only come out every few years, and because they go through so
    much testing, they are not particularly competitive.


    - **Difficulty rating**: Good for beginners with some experience

    - **Long-term support**: Support is there, but new stable releases only come out
    every few years


    ### Pros

    * Quite stable

    * Fantastic quality control

    * More than 30,000 software packages

    * Recognizes and supports more processor architectures than other distributions


    ### Cons

    * Newer stable software is usually not as cutting-edge due to the development

    * Conservative due to the several processor architectures being supported,

    * New releases are few and far between


    # Arch Linux

    Designed for simple usability in 2002 by Judd Vinet, it was initially designed
    to be used for intermediate-to-advanced users of Linux who were already familiar
    with the OS. It did eventually gain popularity when promoted as a “rolling-release”
    distribution, meaning that it would only need the initial install to get it going.


    From there, all that would be needed to keep the installation up to date was a
    monthly snapshot of install media to refresh the software. This was made possible
    by the package manager known as `Pacman`. It is also able to install software
    packages from source code, making it incredibly efficient, especially in tandem
    with its ability to simply pack up binary packages and the constantly increasing
    repository of tested software packages.


    Despite its initial design for users with experience, thanks to the Arch Linux
    Handbook, along with all of the documentation of usage, it now allows for users
    with less experience with Linux to install, understand, and utilize it, and with
    the powerful tools it boasts, this distribution can be customized endlessly.


    However, the rolling-release can cause problems, especially in the case of human
    error. Even a slight mishap can lead to a system that no longer boots after upgrading.
    This means that, though there is plenty of information out there, this is still
    a system that will require some technical knowhow and experience to fix any problems
    that may arise.


    - **Difficulty rating**: Intermediate—need some experience to really use this
    well.

    - **Long-term support**: Regular rolling updates


    ### Pros

    * Fantastic software management structure

    * Incredibly customizable with endless possibilities

    * Plenty of online documentation and guidance available


    ### Cons

    * Can be difficult to catch on when a beginner

    * Occasional breakdowns occur

    * Breakdowns require experience to handle and fix


    # Slackware

    Created in 1992, Slackware is the oldest Linux distribution that is still surviving.
    It was forked from a discontinued project and initially was released on 24 separate
    floppy disks and built upon Linux kernel verson `0.99pl11-alpha`. It rose to popularity
    among the Linux distributions available, and by 1995, it is believed to have held
    a massive 80% of Linux installations.


    However, as newer, an , and user-friendly options arrived on the market, the population
    of Slackware quickly declined. Despite the declination in popularity, it is still
    alive and kicking, and is enjoyed by those who are on the more technologically
    capable side.


    Because it is not particularly customizable, it is quite clean and technical.
    It primarily utilizes a text-based system installer, and the package management
    system is quite outdated and primitive compared to more modern options available.
    However, because it is so simple and basic, it is also one of the cleanest of
    the Linux distributions you can get today, making it incredibly stable. Without
    enhancements, the chances of accidentally introducing a bug to the system are
    slim.


    Between its reliability and lack of bugs, Slackware Linux is quickly becoming
    a core system—one that serves as the foundation for other software as opposed
    to complete distribution. Thought not competitive by any means at this point,
    it is still utilized by some today.


    - **Difficulty rating**: Advanced

    - **Long-term support**: Maintained, but not patched or customized


    ### Pros

    * Stable and mostly bug-free

    * Adheres to Unix principles

    * Largely unchanged from initial conceptualization


    ### Cons

    * Very conservative—no room for customizability

    * Requires a lot of work to be used as modern desktop

    * The upgrade procedure is difficult

    * No official security support or updates


    # Gentoo

    Despite being the butt of several jokes floating around the internet, Gentoo is
    a valid option for people who know what they are doing. This particular distribution
    is quick and flexible while also entirely free. It is designed in particular for
    people with plenty of IT knowledge, such as developers and network professionals.


    It is built with a source-based package management system known as `Portage`—a
    Python-based true ports system that comes with several advanced features of its
    own that can make Gentoo an attractive prospect to those who understand how to
    use it.


    Originally created in 2000 by Daniel Robbins with a vision of creating a meta-distribution
    without needing any pre-compiled binary packages. He certainly succeeded—when
    you install Gentoo, you set up a system with the bare minimum to boot up, and
    from there, you must program it yourself. The system itself is incredibly customizable,
    and you are free to add and remove from it to make it work for you. Thanks to
    this, it is well-known for the flexibility it grants to those who choose to use
    it. They are able to create a wide range of experiences, and because of this,
    Gentoo can be found at the heart of several other projects, such as creating the
    foundation for Google’s Chrome OS.


    - **Difficulty rating**: Advanced

    - **Long-term support**: Regular releases


    ### Pros

    * Flexible and customizable

    * Can use several different compile-time configurations

    * Can use several init systems

    * Can run on several different architectures


    ### Cons

    * Requires a high level of knowledge to get started

    * Takes longer to set up

    * The process to upgrade packages through source can be lengthy

