    `pkill`: 这将通过名称杀死进程。在 Linux 中，关闭系统之前杀死进程是必要的，否则你可能会导致软件和文件出现问题。你也可以用它来结束其他用户的会话。当你使用此命令杀死其他用户时，请确保你没有杀死
    `root` 用户或系统级进程，否则你将杀死服务器当前的进程。要杀死另一个用户的进程，请使用以下命令：`pkill –KILL -u {username}`


    `kill`: 这将终止一个进程。


    `logout`: 这将强制退出 shell。如果你是计算机中的普通用户，也可以使用此命令。它将让你注销 `sh` 或 `ssh`。


    # 文件和目录命令

    有时，你需要在你的文件和目录中查找某些内容。幸运的是，你不需要逐行翻遍所有内容，而是可以使用几个系统命令，它们可以将所有内容都带到终端的最前方，方便你根据需要进行访问。提供的列表按字母顺序排列，以便你根据需要通过拼写找到这些命令。


    `cat`: 这将为你打印文件的内容。例如，如果 `kitten.txt` 中有一首关于为什么猫咪可爱又蓬松的长诗，如果你使用以下代码：

    ```

    $ cat kitten.txt

    ```

    你将在终端中看到那首关于可爱蓬松的猫咪的长诗。


    `cd`: 此命令允许更改目录以访问新目录。例如，如果你使用以下命令：

    ```

    $ cd /

    ```

    你将被移动到根目录。只要你定义了想要到达的目录，你就应该传输到那里。


    `cd ..`: 此命令允许你向上移动一个目录级。如果你正在查看一个名为 `a file` 的目录，而在该目录下另一个名为 `basket` 的目录（例如），使用此命令将你从
    `file` 移动到 `basket`。


    `cp [file 1] [file 2]`: 此命令允许将一个文件复制到另一个。如果系统中不存在 `file 2` 的名称，它将直接复制过去。然而，如果它已经存在，同名的内容将被覆盖。例如：

    ```

    $ cp kitten.txt puppy.txt

    ```

    在这个示例中，只要没有其他名为 `puppy.txt` 的文件，指定的 `kitten` 文件就会被复制并重命名为 `puppy`。


    `cp -r [dir1] [dir2]`: 这将复制目录 1 中的内容并将其放入目录 2。与之前一样，如果目录 2 不存在，将创建它；如果它已存在，则将覆盖其他格式。


    `echo`: 这将触发系统向标准输出发送输入字符串。例如，如果你正在输入内容，你可以导致该输入在输出显示中被记录并重复。


    `find`: 这允许你在……中进行搜索。


    `grep`: 这允许你在特定模式内搜索输入文件，并返回与搜索相关的行。


    `head`: 这将触发系统打印文件的前 10 行，供你在终端中查看。所以，如果你使用以下代码：

    ```

    $ head kitten.txt

    ```

    那么你将在终端中看到猫咪诗的前 10 行。


    `less`: 此命令一次一页地显示任何命名文件的内容。


    `locate`: 如果你知道要查找的文件，也可以用于查找你正在寻找的文件。


    `ls`: 此命令触发终端列出正在使用的指定目录内的内容。


    `ls -la`: 此命令将列出目录的所有文件，包括其中可能存在的任何隐藏目录。


    `mdelt`: 这用于删除 MS-DOS 文件，递归地删除它们及其内容。


    `mkdir`: 如果你输入的名称不存在，此命令将创建一个新目录。例如，如果你想创建一个目录，可以输入：

    ```

    $ mkdir newfile

    ```

    只要你还没有一个名为“newfile”的目录，系统就会为你创建一个。


    `mkdir -p`: 这为 `mkdir` 增加了一些可定制性。通过此特定命令，你还可以在你所命名的目录内创建嵌套的子目录。例如：

    ```

    $ mkdir -p newfile/pictures/puppy

    ```

    这将创建一个名为“newfile”的目录。在 `newfile` 内部，会形成一个名为“pictures”的目录。在 `pictures` 内部，有一个名为“puppy”的目录。


    `more`: 这允许逐页显示文件内的内容。


    `mv`: 这允许对文件和目录进行重命名。例如，如果你想将 `kitten.txt` 重命名为 `puppy txt`，你应该使用：

    ```

    $ mv kitten.txt puppy.txt

    ```

    此特定代码也可以稍作不同，以触发文件从一个地方移动到另一个地方。例如，假设我们有一个名为 `file` 的目录和一个名为 `basket` 的目录，而 `kitten.txt`
    目前位于名为 `file` 的目录中。然而，你想将 `kitten.txt` 移动到 `basket`。

    ```

    $ mv /file/kitten.txt /basket/

    ```

    此代码应促进移动，`kitten.txt` 现在位于 `basket` 目录中。


    `pwd`: 此命令允许你确切看到位于哪个工作目录，以便参考。


    `rm`: 这导致删除你指定的文件。例如，如果你想删除一个名为 `kitten` 的文件，可以使用：

    ```

    $ rm kitten.txt

    ```


    `rmdir`: 这触发系统移除或删除指定的目录，只要该目录是空的。


    `rm -f`: 此命令强制删除文件，即使文件会拒绝删除。


    `rm -r directory`: 将删除目录及其内容。


    `rm -rf directory`: 将强制删除目录、其副本以及所有内容。


    `tail`: 此命令打印文件的最后 10 行。例如，如果你使用以下代码：

    ```

    $ tail kitten.txt

    ```

    你将看到猫咪诗的最后 10 行。


    `tail -f`: 提供文件的最后 10 行，即使在有新行添加时继续显示。在这种情况下，如果你在文件末尾写入 `kitten poem`：

    ```

    $ tail -f kitten.txt

    ```

    那么你将发现添加的每一行都将在终端中刷新，这对于你持续查看最新活动特别有用。


    `touch`: 此命令让你创建一个新文件。例如，如果你想创建一个名为 `kitten` 的文本文件，你会使用：

    ```

    $ touch kitten.txt

    ```


    `whereis`: 此文件允许定位任何命令的二进制文件。


    # 用户和组命令

    Linux 可以容纳多个用户，这些用户有时可以组合成组。实际上，组是具有相同访问权限的用户集合，以便在必要时授予不同的访问权限。


    `groups`: 此命令在提供用户名时将提供该用户所属的所有组，允许你查看其对系统的访问。格式如下：

    ```

    $ groups dad

    ```

    这将列出用户“dad”的所有系统所有权权限。


    `groupadd`: 将通过以下格式添加新组：

    ```

    $ groupadd groupnamehere

    ```

    通过这种格式，创建了一个名为“mom”的新组。


    `groupdel`: 允许移除指定的组。


    `groupmod`: 允许编辑和修改特定的组定义和权限。


    `gpasswd`: 将允许管理员更改组密码以访问系统。


    `passwd`: 允许更改用户的密码。


    `users`: 允许查看机器上的活动用户列表。


    `useradd`: 允许为系统创建一个新用户。


    `userdel`: 允许删除用户账户及其相关文件。


    `usermod`: 允许修改用户账户。


    # 文件权限命令

    本节将为你提供更改目录权限所需的所有信息。通过这样做，你可以在组级别进行更大层次的更改，而不是手动更改个人的权限。在这里进行更改时，你主要会看到三个特定的字母：r、w
    和 x。它们分别代表读取、写入和执行。当你看到这些字母添加到这些组之一时，你可以推断特定文件或目录已添加这些权限；如果你看到它们从某个组中减去，你可以推断它们被撤销了。


    `chgrp`: 指更改文件和目录组的能力。当你使用 `chgrp root` 的命令时，你知道你正在处理文件的组。特别需要记住，所有组账户都必须注销以分配组。此操作有两个特定的命令：

    `chgrp groupname filename`: 允许你将文件的组更改为新的。

    `chgrp groupname foldername`: 允许将文件的组移动到特定的文件夹。


    `chmod`: 指更改目录权限。

    `chmod +rwx filename`: 添加读取、写入和执行权限。

    `chmod -rxw directoryname`: 撤销目录内读取、写入和执行的权限。

    `chmod +x filename`: 允许文件具有执行权限。

    `chmod –wx filename`: 允许撤销文件的写入和执行权限。


    `chown`: 将讨论的所有所有权命令是 chown。这将帮助你更改任何文件的所有权。这允许你将特定文件夹的所有权转移给其他人……这通过两种方式实现：

    `chown username filename`: 将命名文件的所有权转移给指定的用户

    `chown username foldername`: 将命名文件夹的所有权转移给指定的用户。


    # 存档和压缩文件命令

    有时，你对操作系统需要的是创建存档或压缩文件。这就是以下命令的用处——它们使你能够获取大量文件并创建一个存档。它们还可以压缩存档以节省空间，取决于你插入的命令。


    `gzip`: 用于将文档压缩为 zip 文件。


    `rar`: 在 Linux 中创建和管理 RAR 文件。


    `tar`: 这是 GNU 版本的 tar 存档。当你使用此代码时，可以将多个文件存储在一个存档中。


    `unzip`: 这将告诉你是否可以解压文件，提供文档的使用摘要。从那里，你可以选择使用 `gunzip` 提取并使用 `tar xvf` 打开文件。


    `unrar`: 如果系统中已安装，这将解存档并解包被命令的文件。


    # 第 5 章测验

    恭喜你！你已经到达第 5 章的结尾！到目前，你至少对用于控制终端的几种不同命令有通用的了解。在继续之前，尝试回答以下五个问题，以确定你目前对材料的理解和掌握程度。


    '
