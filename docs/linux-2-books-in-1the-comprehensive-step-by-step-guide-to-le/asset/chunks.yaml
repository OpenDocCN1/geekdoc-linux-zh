    能够修改和调节你自己的操作系统所带来的好处，无论你是足够勇敢地尝试从零开始构建 Gentoo 或其他高级程序，还是仅仅运行一个设计为易于使用的 `Ubuntu`
    等开源发行版，你都在为自己开辟了一个全新的机会世界。你有选择直接交互并控制你的计算机。你可以影响计算机所经历的过程。只要你能够编写出所需的代码，你就可以让计算机做任何任何事情。这种编码是许多更大项目的基础。今天从基础编码开始的内容，最终可能变成人工智能。从对你的软件进行首次尝试探索开始，最终可能导致你开发出自己的操作系统。当然，最终的结果取决于你愿意投入多少。


    然而，有一点是可以肯定的——当你开始使用 `Linux` 时，你正在开发一系列对学习至关重要的技能。了解如何与计算机工作是有益的，你甚至可能决定将其从一个项目变成一个爱好，如果它让你感兴趣并继续探索，最终甚至可能成为一份职业。无论如何，重要的是记住你应该保持知识的更新。从这里开始，如果你还没有这样做，你可能准备好安装你自己的版本的
    `Linux` 了。如果你处于过程的这个阶段，祝你好运！当你刚开始这个过程时，这是一个兴奋的时刻，你一定会喜欢它的。如果你不确定是否准备好投入一个属于自己的发行版，也许你可能会对先运行几个发行版进行测试感兴趣，使用书中前面列出的步骤。你可以玩玩系统，学习你更倾向于哪种以及想避开哪种，这可能帮助你更快做出决定。


