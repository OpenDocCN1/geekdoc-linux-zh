    When the system is refused, you know that you need to install `OpenSSH`. With
    the terminal still open, you will want to run the following command:


    ```

    sudo apt-get install openssh-server

    ```


    ii. You should again be prompted to enter the superuser password. Then, hit `Enter`
    + `Y` to grant the installation permission to continue right after the disk space
    prompt. It should then automatically install all required files. In order to test
    that you have been successful, try the following command:


    ```

    sudo service ssh status

    ```


    If you have done your job, you should receive a response within the terminal that
    informs you that it is active and how long it has been running. Congratulations!
    You have established your SSH connection!


    # Types of Shell


    When you are using Linux, you will primarily encounter two types of shells: These
    are the Bourne shells and the C shells. Each category of shells will involve slightly
    different command standards, but they will still get the job done of allowing
    you contact with the shell to interact with and control the computer.


    By and large, you will primarily be utilizing the Bourne Again SHell, known as
    `BASH`. However, it is never a bad idea to familiarize yourself with the several
    different options out there for you to utilize for future reference.


    ## Bourne shell (sh)


    The Bourne shell is the original shell that had been used with Unix. The prompt
    that you will see when using the Bourne shell is the `$` symbol—this tells you
    that the terminal is ready for input. There are several other shell types that
    are recognized as related to the Bourne shell, such as the Korn shell and `bash`.


    *   `Korn shell (ksh)`: This shell was invented by David Korn in the mid-1980s.
    It is nearly completely compatible with the Bourne shell, meaning that if you
    are already using the Bourne shell, you can utilize this particular version immediately.
    Likewise, a device utilizing the Bourne shell can utilize the Korn shell instead,
    allowing for versatility. This is a popular shell, thanks to its compatibility
    with the Bourne shell and the fact that it also offers several desirable features
    from the C shell while including its own benefits as well. It includes command-line
    editing, allowing people to change mistakes simply, something the Bourne shell
    does not offer at all. Along with this, `ksh` utilizes job control—the ability
    to stop, start, and suspend commands at the same time.

    *   `Bourne Again shell (bash)`: This is the free distribution of the Bourne shell
    that comes with Linux systems. It shares a lot of similarities to the Bourne shell
    that it came from, though some people tend to struggle with it. Luckily, there
    are several alternative guides that you can use to work through the process of
    using this.


    ## C shell (csh)


    Similarly to how the Bourne shell is deemed the defining shell of a family of
    others, C shell is deemed to be its own category of shells. It draws its name
    from the fact that it is programmed in `C`, and it runs in a text window in which
    you can insert your commands, which are then read by the program. It boasted features
    such as interactivity and style, with these making it easier to use, and the language
    was deemed to be more readily understood by those who were trying to use it. In
    particular, C shell had several important features, such as its grammar and syntax,
    allowing for it to be readily followed, and it allowed for edits to be performed.
    Unlike the Bourne shell, the C shell will utilize the percent (`%`) symbol as
    the prompt for input.


    *   `TENEX/TOPS C shell (tcsh)`: A derivative of `csh`, `tcsh` is entirely compatible
    with `chs`. It is more-or-less the `csh`, though it added in some improvements
    and enhancements that allowed for more uses for the program. In particular, it
    allows for command line editing, filename/command completing, and more. Thanks
    to these features, it is great for those who struggle with traditional Unix commands,
    or even for those who are slow when it comes to typing. Since the filename will
    try to complete itself with the press of the `Tab` key, you are able to type in
    half of the file name, hit `Tab`, and have the program try to fill it in for you.

    '
