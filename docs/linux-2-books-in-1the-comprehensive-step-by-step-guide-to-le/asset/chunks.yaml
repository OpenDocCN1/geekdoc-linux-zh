- fmt: "\n# Shell Scripting\n\nShell scripting, then, is the composition of several\
    \ commands for the shell to execute. These can combine several repetitive tasks\
    \ and create one simple script that can remain in storage until it is necessary\
    \ to utilize, allowing for execution at nearly any point in time. This allows\
    \ for the reduction of effort required by the end user since the entire series\
    \ of repetitive tasks can be combined into something shorter. This is perfect\
    \ if you will be using the same long series of commands routinely. If you combine\
    \ them all into one script, you can trigger the whole thing to run at the same\
    \ time, rather than having to write out each command every time you use it.\n\n\
    Remember that shell scripts require a very specific syntax. The shell is comprised\
    \ of several elements that come together: the keywords, commands, functions, and\
    \ flow control. Each of these elements plays their own roles and are crucial to\
    \ understanding in order to truly create the language in a way that the computer\
    \ can process it. Think about your own language for a moment—word order matters,\
    \ right? “I can have pizza” and “can I have pizza” have two entirely different\
    \ meanings—one is confirming permission while the other is asking for permission.\
    \ Similarly, if you mix up your syntax, your shell will not always be able to\
    \ understand you.\n\n![](OEBPS/rsrc38J.jpg)\n\n## How to shell script\n\nFor the\
    \ purpose of this tutorial, we will be working with `bash` standards, as that\
    \ is the standard structure that is commonly used within Linux systems by default.\
    \ The steps to creating a Shell Script are not particularly difficult, so long\
    \ as you are able to follow along. There are five simple steps that you will need\
    \ to follow in order to create your script. Of course, your scripting is also\
    \ going to grow more complex as you continue through this book and learn more\
    \ commands to create more sophisticated scripts in the first place. Consider this\
    \ a basic guide.\n\nFirst, you must create your file using a `vi` editor. You\
    \ want to make sure that the file is named with extension `.sh` to make sure that\
    \ it will function.\n\nNow, you must begin the script, utilizing the following\
    \ code:\n\n```bash\n#!/bin/sh\n```\n\nThe symbol `#!` is an operator. It is referred\
    \ to as a shebang, and it directs the script to ensure that it gets to the right\
    \ shell. When you then direct it to `/sh`, you are directing it to the Bourne\
    \ shell.\n\nAfter you have directed to `/sh`, you are free to write the code that\
    \ you want to have executed. This is where Chapter 5 will come into play—you will\
    \ learn the commands necessary to create exactly the script that you are looking\
    \ for or need. When you do finish writing your code, safe the script file in `.sh`\
    \ format. Let’s say your file is named `listfile.sh` because you have designed\
    \ it to list out all of the files present at that point.\n\nWhen you want to execute\
    \ your saved script, you will type:\n\n```bash\nbash listfile.sh\n```\n\nTyping\
    \ that command will then trigger the script to execute, providing you with the\
    \ end result. For now, this is all you need to know. As you read through Chapter\
    \ 5, start to think of some of the potential options for coding the script that\
    \ you will want.\n\n## Basic Command Line Editing\n\nAs one final note before\
    \ wrapping up the chapter on shells, you will be provided with a short list for\
    \ command line editing. This feature can be incredibly helpful to you if you are\
    \ able to memorize these commands.\n\n- `CTRL + L`: Clears out the screen\n- `CTRL\
    \ + W`: Deletes the word the cursor is currently on\n- `CTRL + U`: Clears out\
    \ the current command line\n- `Up or Down arrow keys`: Recall commands\n- `Tab`:\
    \ Auto-completes file names and directories\n- `CTRL + R`: Allows the user to\
    \ search through the command history\n- `CTRL + C`: Cancels the current commands\n\
    - `CTRL + T`: Reverses the last two characters before the cursor\n- `ESC + T`:\
    \ Reverses the order of the two words preceding the curser\n- `CTRL + H`: Deletes\
    \ the letter in front of the cursor\n\n## Chapter 4 Quiz\n\nCongratulations! You\
    \ have made it through Chapter 4. At this point, you should have a pretty solid\
    \ foundation for understanding the Linux shell. Try to answer these questions\
    \ to ensure you understand the basics before moving on. The answer key will be\
    \ on the page directly after this quiz.\n\n1. **What is a shell?**\n   1. The\
    \ kernel\n   2. The physical case around the hardware\n   3. The program that\
    \ allows user interaction with the OS\n   4. The operating system’s type\n   5.\
    \ All of the above\n   6. None of the above\n\n2. **True or false: Bash is necessary\
    \ for Linux to run.**\n\n3. **What does the terminal allow you to do?**\n   1.\
    \ Interact with the operating system\n   2. Control the computer’s functions\n\
    \   3. Establish ssh connections\n   4. All of the above\n   5. None of the above\n\
    \n4. **Which two shells are compatible with each other?**\n   1. Bourne shell\
    \ and C shell\n   2. Bourne shell and tcsh\n   3. Bourne shell and Korn shell\n\
    \   4. All of the above\n   5. None of the above\n\n5. **True or false: The shell\
    \ is the innermost part of the computer**\n\n## Chapter 4 Answer Key\n\n1. **C**:\
    \ The shell is the program that the user will utilize to interact with the system.\n\
    2. **False**: It is useful if you wish to have any real control over your computer\
    \ system, but it is not absolutely necessary. Even if you needed a shell, `bash`\
    \ is not the only option out there for you.\n3. **D**\n4. **C**: Both Bourne and\
    \ Korn shell users can switch between the two interchangeably.\n5. **False**:\
    \ The shell is the outermost component of the operating system.\n"
