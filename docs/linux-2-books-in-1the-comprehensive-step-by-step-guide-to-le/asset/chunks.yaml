    *   从 Kali Linux 官方“下载”镜像站下载 ISO 镜像，然后计算 `SHA256` 值并与 Kali Linux 网站上列出的值进行比对。你应该能够很轻松地完成这一步——但这同时也可能受到漏洞攻击。

    *   通过种子文件（torrent）下载 ISO 镜像，它也会为你提供一个带有计算好的 `SHA256` 签名的文件。如果你已经在 Linux 或 OSX
    上，则可以使用 `shasum` 命令，或者在 Windows 上使用工具来验证该文件的签名是否与下载的另一个文件夹中的签名匹配。同样，这种方法也存在受到漏洞攻击的风险，因为有人可以非常简单地为你提供匹配的数字，使其看起来像是合法的
    Kali Linux 安装程序，从而确保你被欺骗。

    *   唯一能够尽可能确定的方法是稍微复杂一些——你需要下载明文签名文件以及使用官方私钥签名过的文件版本。然后，你必须利用 GNU Privacy Guard
    (GPG)。这将验证 `SHA256` 组合与明文文件中的组合是否匹配，并确保带有 `SHA256` 哈希值的已签名文件也确实使用正确的官方密钥进行了正确签名。


    ## 第 3 ：创建 Kali Linux 启动 USB 盘


    让 Kali 运行起来最快的方法可能是使用活动启动 USB 盘。本质上，你正在将 Kali Linux 获取到 USB 盘中，然后从该 USB 盘启动它。这本身带有许多优势，例如可以避免任何形式的破坏或混乱。当你使用这种方法时，你没有对正在使用的系统进行任何更改——你只是从
    USB 盘运行它。这也引发了便携性和可定制性的问题——你可以随身带到任何地方并在任何计算机上启动，并且你可以像这里将讨论的那样，在 USB 盘上创建你自己的自定义
    Kali ISO。


    为了创建启动盘，你需要一个经过验证的 ISO 副本、一个磁盘刻录工具（如果你使用 Windows，可以下载 `Win32 Disk Imager`；如果你使用的是
    Linux 或 OS X，你可能已经有了这个工具，你只需要使用 `dd` 命令即可完成）以及一个 USB 盘或 SD 卡，前提是你正在使用的系统允许通过这两种方法进行直接访问。你的存储空间至少应有
    4GB，建议更大。


    ### 在 Windows 上创建启动 USB


    当你在 Windows 计算机上执行此操作时，你将经历几个与运行 Linux 或 OS X 机器不同的步骤。


    *   将 USB 盘插入计算机上任何可用的 USB 端口，并记录分配给它的驱动器标识符。在挂载后，启动 `Win32`。

    *   选择你正在刻录的 Kali Linux ISO 文件，并确认你正在覆盖正确的 USB 盘。确认无误后，点击“写入”（Write）按钮。刻录完成后，弹出
    USB 盘，它现在就可以使用了。


    ### 在 Linux 上创建启动 USB


    在 Linux 上，步骤稍微复杂一些，你面临着操作困难或意外覆盖非预期磁盘驱动器的风险。你需要确保正在使用正确的命令，以保证不会意外覆盖任何内容。


    *   首先，你必须确定将用于将镜像写入 USB 盘的设备路径。你需要在尚未插入 USB 盘的情况下完成这一点。在终端中，输入：


    ```bash

    sudo fdisk -l

    ```

    你应该会得到一个显示带有三个分区的驱动器输出。


    *   此时，将你的 USB 插入可用端口，再次重复之前的命令 `sudo fdisk -l`，你现在应该会得到类似的输出。


    *   现在，你将看到一个之前不存在的额外设备——这就是你的 USB 盘。

    *   现在，你必须将镜像写入设备，命令如下文所示。此命令假设你的 ISO 文件名为 `kali-linux-2017.1-amd64.iso` 且位于工作目录。它还假设你的
    USB 驱动器名为 `/dev/sdb`，你需要根据需要替换文件名和驱动器名称。如果你想加快速度，可以选择块大小，但这里提供的是最安全的。命令为：


    ```bash

    dd if=kali-linux-2017.1-amd64.iso of=/dev/sdb bs=512k

    ```

    *   镜像过程可能需要 10 分钟甚至更久，请耐心等待。在系统完成之前，你不会得到任何反馈。

    *   完成后，你的 USB 设备现在可以启动了。


    ### 在 OS X 上创建启动 USB


    * 首先不要插入 USB 盘。打开终端并输入。你会看到每个分区的信息以及你可能需要的全部信息。


    *   现在，插入 USB 设备并再次运行 `diskutil list` 命令。你现在会看到一个之前不存在的磁盘驱动器。


    *   现在，卸载该驱动器——在示例中，我们假设驱动器名为 `/dev/disk6`。你的命令类似于：


    ```bash

    diskutil unmount /dev/disk6

    ```

    *   此时，你需要使用如下命令将 Kali ISO 文件镜像到设备。此命令假设你的 ISO 文件 `kali-linux-2017.1-amd.iso`
    位于当前目录下。它还假设 USB 驱动器名为 `/dev/disk6`。


    ```bash

    sudo dd if=kali-linux-2017.1-amd.iso of=/dev/disk6 bs=1m

    ```

    记住，无法保证你的文件和驱动器名称与这些相同。你需要相应地更改。再次，在驱动器加载完成之前，你不会得到任何反馈，完成后，你的 USB 就可以启动了。


