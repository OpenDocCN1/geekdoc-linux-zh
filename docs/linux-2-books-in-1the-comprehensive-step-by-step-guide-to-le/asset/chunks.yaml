    该工具本身非常常见，而且它兼容 CLI（命令行界面）和 GUI（图形用户界面），这意味着它不仅常见且强大，而且非常灵活。


    # 如何使用 Nmap 理解和利用漏洞


    当你准备好使用 Nmap 时，你有几种不同的选项。根据你所能提交的命令，你将能够扫描一个目标、有限目标或多个目标。目标决定了你具体将如何通过使用该系统的过程，但根结底，这样做将花费一些时间。


    ## 扫描命令


    可能 Nmap 最基本的用法就是通过扫描。当你想要进行扫描时，你有几种不同的选项。你可以选择你想要针对的目标，无论是单个个体、几个人还是整个目录。设想一下，你想扫描一个单一单元或系统。你可以通过以下命令进行操作，并相应地更改
    IP 地址。


    ```

    nmap target

    # nmap target.com

    # nmap 192.143.1.1

    ```

    这将扫描那一个特定的系统。如果你想扫描与该系统相关的所有子网，你的命令将发生微变化。它将变为：


    ```

    nmap target/cdir

    # nmap 192.143.1.1/24

    ```

    相反，如果你想扫描几个不同的目标，你只需为它们标记并用空格分隔 IP 地址即可。例如，你可能会这样写：


    ```

    nmap target target1 target2

    # nmap 192.143.1.1 192.141.1.2

    ```

    你甚至可以选择只扫描连续的几个 IP 地址而不扫描整个子网。当你想要扫描 50 个相关的 IP 地址但不是整个子网时，你将使用以下命令：


    ```

    nmap target-50

    # nmap 192.143.1.1-50

    ```

    这将导致一次性扫描从 `192.143.1.1` 到 `192.143.1.50` 的每一个 IP 地址。你可能还会决定你需要一个正在扫描的多个主机列表——在这种情况下，你需要添加适当的参数。在这种情况下，该参数将是
    `-sL`，它将创建如下命令提示符：


    ```

    nmap -sL target/cdir

    # nmap -sL 192.143.1.1/24

    ```

    然而，有时你可能扫描整个子网，但你也知道需要完全不扫描该子网的一个部分以避免被检测。特别是有一个必须避开的单个 IP 地址时，你可以使用旨在排除该单个 IP
    地址的参数来创建你的代码。这非常简单。你只需要像这样添加 `-exclude` 参数即可：


    ```

    # nmap 192.143.1.1/24 -exclude 192.143.1.13

    ```

    如果你有一个包含所有排除 IP 地址的单个文件，你甚至可以输入它，在排除项中插入文件名。你的扫描甚至可以变得更具体——如果你有正确的代码，你还可以开始指定具体要针对哪些端口。


    ## 扫描技术和命令


    当然，你还可以执行其他类型的扫描。Nmap 提供了几种不同的扫描技术，为了有效地工作，你对了解这些技术是很有必要的。本节将为你提供使用其他几类扫描类型所需的信息。


    ### TCP SYN 扫描

    使用提示符 `-sS` 命令的 TCP SYN 扫描是一种基础扫描。它通常被称为“半开放”，因为它在从远程主机收集信息时，没有完成本书书中之前讨论的 TCP
    过程。在此类扫描中，Nmap 向正确的目标发送一个 SYN 数据包，但从不理会实际创建或触发会话。最后，交互永远不会被目标计算机记录，因为计算机从未启动会话。这就是
    TCP SYN 扫描如此有益处的原因。虽然它是默认使用的，但你需要 root 权限。当然，如果你在执行此操作时使用 Kali Linux，那将没有问题，因为你默认处于
    root 账户。此类扫描的命令看起来如下：


    ```

    # nmap -sS 192.143.1.1

    ```


    ### TCP Connect() 扫描

    当由于任何原因无法进行 SYN 扫描时，将使用默认扫描。为了利用此扫描，需要使用 `-sT` 代码，你的系统将完成 TCP 握手过程，这要求另一个系统记录交易。这只适用于寻找
    TCP 端口而不是其他任何端口。要使用此代码，你将如下的命令：


    ```

    # nmap -sT 192.143.1.1

    ```


    ### UDP 扫描

    此扫描寻找目标机器上开放的 UDP 端口。由于目标是 UDP 端口，它不使用 SYN 数据包。但是，如果你结合使用 `-sS` 和 `-sU` 命令，仍然可以使其更高效。在使用这种扫描方法时，Nmap
    发送 UDP 数据包并等待某种响应。错误消息意味着端口是关闭的，但正确的响应将让你知道端口实际上是开放可访问的。在这种情况下，你将使用以下命令：


    ```

    # nmap -sU 192.143.1.1

    ```


    ### FIN 扫描

    有时，你可能想扫描整个子网，但你也知道需要完全不扫描该子网的一个部分以避免检测。特别是如果你有一个必须避开的单个 IP 地址时，你可以使用旨在排除该单个 IP
    地址的参数来创建你的代码。然而，根据你提供的参数，有时 TCP SYN 扫描并不是正确的选择。当这种情况发生时，你可以尝试使用 FIN 扫描——它只发送 FIN
    标志，这意味着不需要完成会触发 Nmap 检测的 TCP 事务。FIN 扫描的正确命令是 `-sF`，如下：


    ```

    # nmap -sF 192.143.1.1

    ```

    ### 扫描（Ping Scan）

    与目前讨论的其他形式不同，ping 扫描仅用于确定主机是否存活或活跃。它不发现端口。这需要 root 权限，因为有发送 ICMP 数据包的可能性。当没有授予
    root 权限时，将使用 `connect()` 命令。ping 扫描的命令是 `-sP`：


    ```

    # nmap -sP 192.143.1.1

    ```


    ### 版本检测

    如果你想确定目标计算机或任何端口在使用什么软件，就需要此命令。它不会检测任何开放端口，但需要获取已检测的信息。这里的第一步是使用 TCP SYN 扫描找到开放的端口，然后引导
    `-sV`：


    ```

    # nmap -sV 192.143.1.1

    ```


    ### 空闲扫描

    在空闲扫描中，你可以在扫描时保持隐身性。在这种特定技术中，你不会从自己的 IP 地址发送任何数据包，而是从目标网络内部发送数据包。这需要你首先确定开放的端口，然后使用僵尸主机与目标通信。在此代码中，你将首先使用僵尸主机并在目标创建命令：


    ```

    # nmap -sI 192.143.1.4 192.143.1.1

    ```

    在这种情况下，僵尸主机 `192.143.1.4` 被用于无检测通信，因为它们网络的一部分。


    ## 渗透测试


    归结底，渗透测试可以分为七步或阶段——当你能够通过这些阶段时，你可能会发现某些漏洞。利用这些阶段，你会发现自己的能力正在增长，这意味着你更有可能识别出任何漏洞。渗透测试的阶段包括前期工作、侦察、威胁建模、利用、后利用、报告和重测。


    ### 前期工作

    这一步更多是一种预防措施，但是至关重要的——当你处于前期阶段时，你需要从确定范围开始。基本上，你正在寻找测试的目标。你需要确保知道什么是预期的，哪些是不允许的。如果你试图黑入他人的网络，你需要法律保护自己。因为渗透测试是危险的，正因如此，你需要确保自己在条款范围内工作，并在发生灾难性时保持安全。


    ### 侦察

    在这个阶段，你将致力于收集信息。虽然你可能倾向于跳过，但如果你可以这样做，你会准备得更充分。你需要确切知道哪些有效，哪些无效。当你把所需的信息排列整齐后，你可能想要收集尽可能的信息，然后进入第三步。


    ### 威胁建模和识别漏洞

    第三步仍然完全关于规划——在此时，你想采取在之前的步骤中收集的所有信息，并开始脑风网络可能面临的最现实威胁。这一阶段还可以利用漏洞扫描器来发现当前存在的任何漏洞。这通常使用
    Kali Linux 等工具完成，并且你需要确保自己免受拦截。


    ### 利用

    到此时，是时候开始尝试访问网络了。你应该有几个不同的位置可以用来攻击系统，现在是时候采取行动了。你发现任何可以用于访问的漏洞了吗？你可能尝试启动 shell，或者尝试获取分配给你的凭据，以便以
    root 用户身份访问。这一阶段在很大程度上取决于你试图突破的网络，并且你需要创意。


    ### 后利用

    接下来是后利用阶段。在此时，你已经完成了测试，要么是因为时间耗尽，要么达到了利用能力的终点，或者是离开了系统。此时，你必须列出所有漏洞并将其提供给客户。在回顾过程中，你应该对任何有效或无效的操作做笔记，或者可能截截图。你应该能够弄清楚你所做的利用有多大意义——你是进入了主服务器，还是卡在一个对服务器访问权限很小的计算机上？你从系统中获得的信息有多价值？如果系统本身是脆弱的？


    ### 报告

    在这个阶段，是时候编写你的报告了。这可能无趣，但如果你已经通过渗透测试来帮助他人，你需要确保报告写得整齐。你需要传达发现的任何漏洞，这将让客户面临风险。尽可能诚实地告诉他们发生了什么以及如何修复。这一阶段越清晰，你的工作就越好。


    ### 重测

    这不是每个人都愿意经历的阶段，但如果你想彻底测试，它是重要的。在这个阶段，你将重新评估漏洞是否已经修复。你需要确保。


    # 第 14 章：如何变得并保持匿名


    如果你希望成为黑客，匿名性是至关重要的，无论何种。如果你不小心，你的 IP 地址就会暴露且不再拥有访问。然而，这不是唯一的途径。如果你试图入侵，你可以掩盖踪迹。你可以使用工具来保持匿名。有几种方法可以帮助，在本章中进行了讨论。这些方法是代理服务器、VPN
    以及 TOR 的使用。


    ### Proxychains


    隐藏 IP 地址的最简单方法之一是使用代理服务器。通过使用代理链，你可以隐藏踪迹，使其更难追踪。然而，当你使用代理时，它会记录你的信息。你也可以回避这一点——你可以将多个代理链在一起，只要有一个代理是在管辖范围之外。幸运的是，在
    Kali 中你可以使用名为 Proxychains 的工具，可以在 `/usr/bin` 目录下找到。在使用 Proxychains 时，你使用一个非常简单的命令：


    ```

    proxychains [command] [arguments]

    ```

    现在，假设你想配合 Nmap 匿名进行扫描。特别是，你想对 IP 地址 `192.143.1.1` 进行 SYN 扫描，但你想通过代理来实现。


    ```bash

    proxychains nmap -sS 192.143.1.1

    ```

    这将触发通过代理进行 SYN 扫描。理解语法后，你可以完成配置文件。像 Linux 中的其他任何东西一样，有简单的文本文件作为配置文件。使用 `ged` 或
    `leafpad` 打开配置文件。然后你查看 `chains` 行——你会看到它被注释掉了。这意味着它目前不会被使用。如果你删掉注释标记，它在运行时就会激活。你也可以在文件中找到
    `chaining`。你可以重新添加 `#` 来注释掉 `chains` 行，并移除 `chaining` 选项的 `#`。你一次只能使用这些选项中的一个，所以如果你想使用另一个，必须回去删除一个。


    ### VPN


    在系统中添加另一层安全的方法是在代理地址之上添加 VPN。这是常见的做法——它允许对盗版或其他问题提供进一步保护。它还允许人们绕过例如在某个国家内可能是非法的活动。仅仅扫描网络就足以被视为非法，即使你没有做任何事情。这在某些国家很常见。


    现在，由于你正在阅读如何最好地这样做，你会发现额外的安全对于保护自己至关重要。


    ### 第一步：启用 VPN


    当你使用 Kali Linux 时，VPN 选项默认禁用，所以你需要在继续之前打开它。你需要输入自己的命令，例如：


    ```

    apt-get install network-manager-openvpn

    ```

    此命令将启用 VPN。在重启网络和网络管理器后，你应该发现 VPN 现在可用。


    ### 第二步：下载并提取 openvpn


    现在，你需要下载 `openvpn.zip` 文件。这并不困难——代码如下：


    ```

    wget https://www.privateinternetaccess.com/openvpn.zip

    ```

    文件一旦下载并保存，你需要解压缩文件。你可以通过以下命令完成：


    ```

    unzip openvpn.zip

    ```

