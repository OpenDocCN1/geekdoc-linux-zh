    At this point, you will be able to use any of your USB drives to boot up the OS.
    All you need to do is bring up the boot menu upon starting your computer with
    the USB mounted and make sure you select Kali Linux. There are other methods that
    you can use to access Kali Linux, such as installing it onto your computer itself,
    but one of the most recommended methods of accessing the software is through the
    use of the USB drive. If you have an interest in downloading the entire system
    onto your hardware, feel free to browse around the specific Kali Linux official
    website for more access and information to do exactly that.


    # Chapter 12: Basic Linux Commands


    From this point on, the information you will be getting is a mix of practical
    information and information that you can actively use in some way. This chapter
    in particular will provide you with the necessary information to begin interacting
    with Kali Linux. You will be given a list of the most common and basic commands
    necessary.


    As you read through these commands, try to really familiarize yourself with them.
    You want to make sure you understand what they are and how they can be best used
    to benefit you. If you are able to do so, you will ensure that you are also able
    to interact with your Linux distribution, no matter which you have chosen. Remember
    that with Kali Linux, you will be in root user by default and you will need to
    take the necessary precautions. When using several of these commands when you
    do not have root access, you run into problems that stop you from being able to
    move forward. However, with Kali, if you are already in the root user, the command
    is instantly carried out, even if it is a harmful one. This is why attention to
    detail, and a meticulous amount of it, is crucial if you really want to develop
    your skills with Kali Linux and become skilled at penetration testing and hacking.


    ## The Terminal


    If you are familiar with Linux and basic commands, you should also be familiar
    with the Terminal. This is the way that you are able to interact with the shell
    of Linux, commanding it to do what you expect. You are essentially going to be
    putting in input to the server and then expecting it to come out the other end
    with the proper response. This is the basis of the simplest Linux commands.


    As a quick refresher, if it has been a while, you will be emulating the terminal
    in a graphical environment so you can see the input and output in a way that you
    can read and understand. If you already have Linux or OS X, you already have access
    to Terminal, and you can also install others. If you have Windows, you may want
    to install `PuTTY`. Kali Linux will also have its own terminal within it as well
    that you are able to access with ease.


    ### Command Prompts


    When you are interacting with the Terminal, you are using command prompts or shell
    prompts—you will likely see these used interchangeably as you read through various
    guides. When you are within the terminal, there is a very specific composition
    of the prompt that you will see. It will be the username of the user, the hostname
    of the server, the directory you are in, and the prompt symbol. In most cases,
    the prompt symbol that you will see is `$`.


    Effectively, then, if you are nicknamed hacker as your user, and your server that
    you are on is hacking and you are currently in the default home directory, you
    may see a default prompt of:

    `hacker@hacking:~$`


    In Kali Linux, however, you are always logged onto the single root user account.
    You are going to see the username of `root` instead of `hacker` or any other name
    that may have been there.


    ### Executing the Commands


    When you want to give your commands then, you must specify what you want in a
    fashion that the system is able to manage properly. You can enter a script, a
    series of prescribed information that will trigger the system to respond in a
    specific way. You can also enter your own commands instead. This is what the majority
    of this current chapter will be: ways to interact and command the server.


    When a command is running, it is called a process. When that process is happening
    in the foreground, you must wait for it to finish before you can do anything else.
    This is the default way to run the program.


    You can also enter your commands in two forms: With or without arguments. When
    you enter a command without an argument, you are entering a simple command without
    expecting anything else. This will cause the computer to send you to exactly what
    you have specified or done exactly what you said. If you write `ls`, for example,
    you will suddenly get everything listed out in front of you on the screen—the
    current directory’s files and directories.


    However, an argument seeks to alter that command somewhat. In adding an argument,
    you add an extra condition—you may tell your system to bring up the files of a
    different directory. You may tell your system to shut down in 30 minutes instead
    of instantly. They add a change to the meaning of the original command. When you
    enter a command with arguments, you will enter it in a specific order of command,
    then the specification or location of what you are running.


    Another common way that commands are executed is with options—this means that
    they have some sort of modification to follow. This is followed by a `-` and a
    letter that tells the system what you need from it. For example, if we go back
    to `ls`, you may choose to add something else to it, such as `ls -l` which tells
    your system that you want it to list out a longer list of permission, including
    far more details than would ordinarily be included.


    You can also mix and match, so you can have your options and arguments combined—in
    fact, it is incredibly common to mix the two together in order to run the right
    command.


    From here on, you will be provided with several commands within Linux that you
    will find to be useful. These will either be a great refresher course, or you
    did not need this information in the first place. If you did not need this information,
    or you feel confident in your ability to navigate a Linux system, feel free to
    drop off here and skip to the next chapter. However, if you are not entirely confident
    in your ability to navigate through your software, it may be smart to at least
    spend the time to read over this comprehensive list of commands that have been
    provided for you.


    Of course, you can also always come back to this information later if you ever
    feel like you need a command and want to make sure that you are able to really
    learn how to use them.


    ## Archives


    The codes within this section are related specifically to the archive files within
    your system. They will help you to interact directly with archives, whether to
    access, move, or otherwise interact with them.


    ```

    tar cf archive.tar directory

    ```

