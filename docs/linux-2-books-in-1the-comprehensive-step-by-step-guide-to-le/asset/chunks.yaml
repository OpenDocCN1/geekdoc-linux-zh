    Microsoft Office 得多。尽管如此，如果你发现自己想念 `MS Notepad`，那里也有替代品供你选择。


    特别是，`gedit` 是 GNOME 文本编辑器。它的设计旨在简单易用，同时支持对多种编程语言的高亮显示。它还带有撤销/重做命令、剪贴板支持和打印支持。基本上你在
