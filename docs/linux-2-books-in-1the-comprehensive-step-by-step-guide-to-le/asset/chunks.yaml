    # Kali Linux Hacking: A Complete Step by Step Guide to Learn the Fundamentals
    of Cyber Security, Hacking, and Penetration Testing


    ## Part Introduction to Kali Linux and Hacking


    ### Chapter 9: Introduction to Hacking


    It is one of the worst things that could happen to many people—they log into their
    bank account or credit card only to realize that their account balance is completely
    drained or that someone has been making heavy use of their credit card. This can
    absolutely devastate many people, and unfortunately, these days, this is a very
    real concern.


    ![](OEBPS/rsrc38T.jpg)


    These days, financial information is backed up somewhere. Your bank has a record
    of your account number, and everything else someone would need to access. Have
    you ever been in a situation where you wanted to try hacking? Maybe you wanted
    to test the security of something that you were developing or you simply wanted
    to challenge yourself, and you were unsure of where to start. If this is something
    you have considered, `Kali Linux` may be the OS you need to begin the process.


    It is important to note that Kali Linux is not for everyone—you need some level
    of familiarity with how `Linux` works or at least an idea of how to interact with
    it if you wish to use it in a useful manner. If you do not have this familiarity,
    it may be in your best interest to go back and begin the study of a simpler distribution
    of `Linux`, such as `Ubuntu` or `Mint`, before beginning to tinker with `Kali
    Linux`. If you decide to move forward with `Kali Linux`, keep in mind that the
    tools within this distribution can cause serious damage if misused, and could
    potentially lead to significant consequences. This is not a distribution to be
    taken lightly.


    If you decide to proceed, this book will give you the beginner’s guide to `Kali
    Linux` and how to use it to begin hacking. The first half of the book is dedicated
    to giving you the basic knowledge that will be needed to truly get the most of
    it. You will be given information about how cybersecurity has made more important
    than ever. You will learn the basics of networking itself, diving into several
    different concepts and how they work. You will learn all about `Kali Linux`—what
    it is, how it is installed, and how to use it, and you will learn several of the
    most basic `Linux` commands.


    In the second half of this book, you will begin to discuss the utilization of
    `Kali Linux` for several different purposes. You will learn about `Nmap` and how
    it can be used to detect and exploit vulnerabilities. You will be guided through
    the steps of remaining anonymous. You will dive into `Metasploit` and how to make
    use of it with `Kali Linux`. You will learn about digital certificates and how
    to use them, and finally, you will learn about `bash` (Bourne Again Shell) and
    `Python` scripting, and why the two of them are sometimes considered to be at
    odds despite the fact that they could very well work together and cooperate to
    get much better results than if they continue to be left separately.


    By the time you have finished reading this book, you will have an idea of the
    foundational information you will need to first decide whether Kali Linux is for
    you, and if it is, you will know how to get started with it and have an understanding
    of just how powerful this distribution of `Linux` is. While Kali Linux is not
    for everyone, if you do happen to fall into the category of people that would
    find use in this program, then the tools provided with this distribution are incredibly
    valuable assets that you will not want to miss out on having in your arsenal.


    At the end of the day, you will be able to determine if you are happy with the
    idea of Kali Linux and whether this is for you or if instead, you should be making
    it a point to move on to a different distribution of `Linux` instead. You will
    be able to decide if you want to continue to work entirely with the shell or if
    you want to learn `Python` instead. And, if none of this that has been discussed
    makes any sense, then by reaching the end of the book, you should find some clarity
    with the topics at hand and how they should be used.


    ### Malware


    Malware is malicious software—shortened down into one word. It includes software
    such as viruses that are installed, either by you clicking on something that allows
    it to be downloaded or downloading it yourself, but once you allow it in, you
    have compromised your information. Attackers will generally use a link or an email
    attachment that appears to be harmless in order to trick you into installing whatever
    was hidden within. The installed malware can cause all sorts of issues, such as
    monitoring the usage of the computer such as keystrokes, which then allows the
    hacker access to all sorts of information that may be personal or sensitive. It
    can also grant full access to the computer, depending on the malware that was
    installed. Overall, however, the vast majority of the time, the user of the computer
    will have to do something that triggers the download of the malware.


    ### Session Hijacking


    As will be discussed later, when a user is browsing the internet, the user’s computer
    sends several transactions to the website’s servers, allowing the website to see
    who is accessing it, what is being requested, and sending the proper information
    back to the user to display. This is done via routers and networking, and when
    done properly, you are able to access the information requested without issue,
    whether you are simply browsing through sites and clicking on links or whether
    you are entering in sensitive information.


    This data is supposed to stay private, given a specific `session ID` that allows
    the server to know who is using it and how it is able to send the specifically
    requested data back to the individual asking for it. However, sometimes, that
    data gets intercepted. Essentially, what happens is that someone else is able
    to access that unique `ID`. They are able to use that same `ID` and make requests
    as you during your interaction, allowing the attacker to see any of the sensitive
    information. Sometimes, instead of just observing and intercepting information,
    the attacker can act as either the website or as the individual using the website,
    allowing the attacker to request and intercept information from either direction.
    When this happens, it is known as a man in the middle attack.


    ### SQL Injection


    `SQL` (usually pronounced “sequel”) is an acronym for the structured query language.
    It is the programming language that is primarily used as a means of communication
    with databases. When a website or a company needs to store sensitive and critical
    information, such as patient or financial information, the server that it is stored
    in will most commonly utilize `SQL` to manage it.


    ![](OEBPS/rsrc38U.jpg)


    The `SQL injection`, then, seeks to use code designed to trigger the server to
    provide information that is normally protected. This can happen because of a vulnerability
    in the website''s security. For example, some people may hack their video console
    to run emulators to allow them to play ROMs of different games intended to be
    used.


    ### What is Hacking?


    Hacking, then, is the act of identifying any weaknesses within a computer or network
    and then exploiting that weakness in order to gain the necessary access. Hacking
    may not always be done with the intention to harm—hacking can come in several
    forms, such as tricking someone into clicking on an attachment in an email that
    will grant access to a computer. Other forms, however, require far more technical
    expertise than backhanded attempts to fool someone into granting access in the
    first place. Essentially, hacking is the act of getting into someone else’s system,
    but the methods of hacking can vary greatly. Each of these occurs in different
    manners and serve different purposes, but the end result is the same—they allow
    for information to be stolen and used.


    The `SQL injection`, then, seeks to use code designed to trigger the server to
    provide information that is normally protected. This can happen because of a vulnerability
    in the website''s security. For example, some people may hack their video console
    to run emulators to allow them to play ROMs of different games intended to be
    used.


    ### Phishing


    Phishing is a form of hacking that relies on tricking someone into giving up information.
    This is often done via email, text messages, or phone calls that appear to be
    from a legitimate source. The goal of the phisher is to steal sensitive information
    such as passwords, social security numbers, or credit cards. This is a very common
    type of attack, and it is important to be aware of it.

