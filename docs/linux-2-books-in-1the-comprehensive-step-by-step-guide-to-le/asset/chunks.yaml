    ![](img/rsrc38A.jpg)


    # 从 Unix 到 Linux


    现在为人知的 Linux 是最早始于 Unix 的开发吗？它开发自贝尔实验室计算机科学研究中心的 Multics 项目，其目标是创建一个具有单层级存储、动态链接和分级文件系统的多用户操作系统。然而，该项目在
    1969 年终止了。


    项目的终止并没有阻止包括肯·汤普森（Ken Thompson）和丹尼斯·里奇（Dennis Ritchie）在内的一组研究人员完成他们的项目。然而，他们没有使用
    Multics，而是利用 `C` 编程语言重写了他们的整个系统，并保留了 Multics 的那些核心资产。


    最终，他们创建了 Unix。这种编程语言使得该操作系统变得独一无二——它是可移植的。这意味着它可以从原有的硬件中移动出来，允许数据在远超硬件寿命的情况下继续存在。


    这个新创建的 Unix 系统得到了进一步开发并被允许商业化采用。它最终在学术界进一步传播，并在伯克利软件发行版（`BSD`）的诞生。它进一步演变为 NeXTStep，并最终成为
    macOS 的基础；而 MINIX 则设计用于教育，并最终成为林斯·托瓦德（Linux Torvalds）创建 Linux 的参考。


    Unix 及其继任者主要被限制在许可之后，许多不同的开发者开始工作创建免费的替代方案。其中包括理查德·斯尔曼（Richard Stallman），他当时在麻理工学院（MIT）工作的研究人员。他开始工作后来被称为
    `GNU` 的项目，从 1985 年开始作为开源软件分发。


    托瓦德对 MINIX 的许可感到沮丧，于 1991 年开始开发自己的操作系统。它让人联想起 MINIX，最初开发是在 MINIX 上使用 `GNU C` 编译器完成的。然而，随着时间的推移，它转变为一个拥有独立开发者的项目以将其分离出来，并在
    1994 年发布了 Linux 内核的 1.0 版本。


    这意味着从 Unix 到 Linux 有两个主要影响——`GNU`（它仍然是许多不同 Linux 发行版的重要组件，以及在 MINIX 系统内完成的 Linux
    初始开发。


    如今，当你听到“Linux”时，你可能是在讨论 Linux 内核和 `GNU` 的共存。然而，确实有一些系统，例如手持设备上的系统，频繁使用 Linux 内核而几乎没有
    `GNU` 的影响。


    # Linux 的系统架构


    此时，你已经看到了 Linux 架构的简要概述——这是你在本章前面的图表中看到的 Linux 分解。然而，有些细节需要进一步深入讨论。在本节中，你将学习更多关于用户空间与内核空间的分离、Linux
    内核的功能以及被称为 shell 的命令行界面（`CLI`）。


    ## 用户空间与内核空间


    如果你正在电脑上工作，花了几个小时试图巩固你想要完成的事情，结果因为系统意外占用了太多空间导致操作系统无法运行而整个系统关闭，这难道不令人感到沮丧吗？大多数人都会同意，是的，一个程序因为内存不足而随机崩溃是非常令人沮丧的，正因为如此，你的内存中有一个专门为操作系统提供的特殊空间以便运行它。


    你的操作系统会将你的内存分为两类，将它们完全分离并完全限制它们。它创建了一个 `kernel space`（内核空间），设计用于为系统运行提供足够的空间，以确保你永远不会缺少运行操作系统所需的空间。


    它还创建了一个额外的保护，保护你的操作系统免受在 `user space`（用户空间）内下载或启动的任何外部来源的篡改。通过创建这种划分，内核得到了保护，你的电脑应该运行得平畅。


    ![](img/rsrc38B.jpg)


    如果应用程序想要访问系统资源（如使用内存），它们必须在 `kernel space` 内向内核发出系统调用。


    ## Linux 内核


    Linux 内核是该程序的命名来源，正如前面介绍的，它是至关重要的。内核充作为硬件和操作系统之间的中间者，允许程序运行。它调度程序、访问内存并管理设备。这是操作系统在启动时加载的，它包含了操作系统最重要的部分。


    ## 命令行界面 (CLI)


    通常，Linux 是通过命令行界面（`CLI`）进行管理的。这也被被称为 shell。第四章将专门讨论 shell，但你现在应该对它们有一个大致的了解。在
    Linux 中，最常用的程序是 `bash`（再次 shell），它是 Bourne 编写的原始 shell 的增强版本。


    然而，在没有另一个程序的情况下，你无法访问 shell。这被称为你的终端器。


    打开终端器将打开另一个窗口，允许通过输入命令进行交互。就像 shell 一样，关于如何启动和使用这些命令的指令将在书中出现。此时，你只需要知道与操作系统直接交互是一个选项就足够了。


    # 文件层级结构


    为了尽可能有效地运行，Linux 使用被称为文件层级结构（`FHS`）。它定义了类 Unix 操作系统（如 Linux）中的目录结构和内容。这种特定的层次结构归功于
    Linux 会的管理、维护和监管。


    在使用 FHS 时，所有文件和目录都可以在根目录 `/` 下找到，即使它们存储在其他地方。然而，某些目录只在特定情况下存在，需要特定的系统。


    ### /


    这是整个文件系统的根。一切追溯到根。只有 root 用户有权限在 `/` 下写入或编辑，你会看到 `/root` 是 root 用户的家目录。注意 `/root`
    与 `/`。


    ### /bin


    这是单用户模式下必须提供的基本命令二进制。这将二进制执行文件，即以二进制格式存储的文件，计算机可读，但对人类不可读。你也将在此目录下找到其他常用的 Linux
    命令。


    ### /boot


    这些是你的引导加载器文件。你会看到如下文件：


