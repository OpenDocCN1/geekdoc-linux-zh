    # 1. 使用 bash 时，表示终端准备好接受你的输入的符号是什么？


    1. `!`

    2. `@`

    3. `$`

    4. `%`


    # 2. 在权限中，“x”代表什么？


    1. Exit（退出）

    2. Expel（驱逐）

    3. Expedite（加速）

    4. Execute（执行）

    5. Excel（卓越）


    # 3. 可以使用大写字母？


    1. 可以，计算机读取它们的方式完全相同。

    2. 不可以，计算机区分两者，且不会将 `x` 视为 `X`。

    3. 有时


    # 4. 正或错：在编程时，单词和命令的顺序并不重要。


    # 5. 正或错：如果你在寻找特定的文件，必须手动搜索。


    ## 第 5 章答案


    1. **C**: bash 使用 `$` 来表示它已准备好接收输入。`csh` 使用 `%`。

    2. **D**: `x` 代表用户或组运行或执行程序或文件的能力。

    3. **B**: 虽然现在的计算机可能能够区分并转换，但操作系统仍设计为通过小写字母接收所有输入。

    4. **错误**: 编程是一种语言，有你必须遵循的特定语法。否则，你将开始混淆文件并将内容发送到错误的地方。

    5. **错误**: 存在许多命令可以帮助你定位所需的文件。


