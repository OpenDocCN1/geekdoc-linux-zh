- fmt: "\n# Information Security: The CIA Triad\n\nAs noted just prior, one of the\
    \ elements of cybersecurity is information security. This particular element is\
    \ so important that it warrants discussing in its own section. Within information\
    \ security, there is a concept known as the `CIA` triad. This particular triad\
    \ stands for confidentiality, integrity, and availability, which serve as the\
    \ mission statement of sorts for the information security side of cybersecurity.\n\
    \n![](OEBPS/rsrc38Y.jpg)\n\nEach of these three sides to the triad is crucial:\
    \ Information protected must be confidential, accessible, and maintained with\
    \ integrity. Without achieving all three of these goals, information security\
    \ has not entirely been achieved. These are the fundamentals for information security,\
    \ and will always be the core objective.\n\n## Confidentiality\nThis is the ability\
    \ to protect information from any sort of unauthorized access to it. When information\
    \ is confidential, it is not accessible by anyone that is unauthorized. For example,\
    \ when you go to the doctor’s office, your medical history is confidential unless\
    \ you sign a release form. In the medical setting, that information is protected\
    \ by both security measures as well as regulations for conduct to protect your\
    \ sensitive medical information from becoming well-known. In the information security\
    \ side, the information that is being protected will only be accessible by authorized\
    \ users, with unauthorized users automatically being rejected upon failing to\
    \ provide the right credentials. For example, consider a credit bureau that has\
    \ access to all of your personal information, from your social security number\
    \ to the accounts and account numbers of any of your credit lines—if their data\
    \ is not secure, you are at risk of identity theft.\n\n## Integrity\nIntegrity\
    \ is achieved when information is held in a way that is accurate and consistent.\
    \ This means that its intended and original structures are maintained without\
    \ any prior authorized changes to the material in the first place. While it is\
    \ possible that information gets changed if the user is careless or used or if\
    \ there is an error, however, integrity will be maintained so long as the information\
    \ is unmodified during storage, being transferred to the requester, and when being\
    \ used, short of anyone actively and consciously changing it. This means that\
    \ the data is accurate and kept constant.\n\nFor example, imagine that you have\
    \ checked your bank account before going to buy a new computer because you wanted\
    \ to make sure that your direct deposit check had, in fact, been deposited. If\
    \ your banking app does not update properly or reflect the fact that you did,\
    \ in fact, get paid, you are going to think that you are unable to buy that laptop\
    \ or any other need you may have had.\n\n## Availability\nThe final goal, availability,\
    \ refer to the information being readily available whenever and wherever it is\
    \ requested and needed. Because information is generally protected, it is not\
    \ available to everyone, but it must be available to those with the proper credentials.\
    \ This should be maintained as much as possible—data protection without ready\
    \ access to it is not exactly the most useful in situations where data becomes\
    \ essential. For example, imagine that your medical records are being protected.\
    \ If your doctor were unable to access your medical records on-demand, you would\
    \ not be able to get the proper treatment.\n\n# Chapter 10: Introduction to Networking\n\
    \nWith the wide-scale use of the internet comes the introduction of networking.\
    \ While it may be easy to think that the information or requests that you put\
    \ through the internet simply appear instantly after being beamed up to a satellite,\
    \ especially if you are using a `router` for a wireless home connection, what\
    \ actually happens is that the data that you push through goes through wires to\
    \ get the information you have requested be returned to you, all at lightning-quick\
    \ speeds. This is the creation of the network, and whether you have ever considered\
    \ it or not, it is a massive part of everything in this day and age, and you most\
    \ likely use the network several times a day. Whether you check your bank account\
    \ or even buy something with a debit or credit card, you are sending information\
    \ through a network.\n\n![](OEBPS/rsrc38Z.jpg)\n\n## What is a Network?\nDefined\
    \ simply, a network is two or more computers that are connected together in some\
    \ way in order to share information or interact in some way. The computers do\
    \ not have to be connected via wire—they can be connected through infrared beams,\
    \ through the transmission of radio waves or satellites, or even through wires.\
    \ However, they are always connected in some sort of way.\n\nThere are several\
    \ instances in which a network is a right choice for the usage that is planned\
    \ out. For example, imagine that you have two computers (a laptop and a desktop),\
    \ a tablet, and a cell phone. You regularly use all four items at home and want\
    \ to make sure that data that is attached to your laptop, which you use primarily\
    \ for being able to access and browse the internet or answer emails, is also available\
    \ on your more powerful desktop, which may be reserved for more intensive programs,\
    \ such as playing video games or editing large files or videos. You also, just\
    \ for convenience, would like to make sure that your photos that you take on the\
    \ go with your phone are accessible from your other sources as well. When you\
    \ want that level of connectivity, where you are able to access all of your files\
    \ from anywhere, you are looking for a network connection. In getting that network\
    \ connection, you are able to share those files with ease.\n\nOf course, there\
    \ are other ways that networks become crucial as well. If you work for a school,\
    \ for example, you may be familiar with computer labs. In these labs, students\
    \ put in their login information from any computer to pull up the same account.\
    \ Teachers can also submit their information to log on from any computer on that\
    \ network as well, so long as they use the right password and username.\n\n##\
    \ Types of Networks\nNetworks themselves can come in several different forms.\
    \ These networks are used for everything and anything that involves the transmission\
    \ of information, whether you are printing a document or sending an email. It\
    \ is important to understand that, when discussing networks, you are primarily\
    \ discussing one of two different network types, though there are several others,\
    \ depending on the purpose. The two that are most commonly discussed are `LAN`\
    \ and `WAN`, with `VPN` being a close third. These three types of networks have\
    \ their own specific usage scenarios. This section will give you a brief overview\
    \ of `LAN`, `WAN`, and `VPN`, though you will find that `VPN` gets discussed in\
    \ more depth in later chapters.\n\n### LAN\nThe most common of the networks in\
    \ modern-day understanding is the `LAN`. This network type is known as the Local\
    \ Area Network—it connects computers and low-voltage devices to one another within\
    \ a small or local area. This may be within a single building or even a couple\
    \ of buildings that may need to share information. With the use of a `router`,\
    \ a `LAN` can interact with a `WAN` in order to transfer data quickly and securely.\
    \ If you are going to be setting up a personal network at home, it will most likely\
    \ be a `LAN`, especially if more than one person shares it.\n\n### WAN\nStanding\
    \ for a wide area network, `WAN` allows for computers to connect from further\
    \ distances apart. This means that computers, even far from each other, are able\
    \ to be connected to each other through one means or another. This can be on a\
    \ smaller scale, such as an internet service provider that is connected to several\
    \ different `LAN`s, stringing them together into one cohesive network together.\
    \ Another more well-known type of `WAN` is the internet. The internet allows for\
    \ the connection of computers across the world.\n\n### VPN\n`VPN` stands for a\
    \ virtual private network. It is a network that has been extended across the internet\
    \ as if they were accessing a private network that others cannot access, though\
    \ the internet. These can also be achieved remotely, through the use of a virtual\
    \ point-to-point connection, in which the private and remote sites are able to\
    \ access each other. They are routed through the internet from a private network\
    \ in order to transfer sensitive information and ensure that it is secure. Typically,\
    \ it was done by encrypting the data—making it so it cannot be read easily by\
    \ someone who is not supposed to have access to it in the first place.\n\n## Network\
    \ Address\nA network address is a way that the nodes and hosts within a network\
    \ are able to be identified. Just as your house has an address that allows for\
    \ snail mail to be delivered exactly to your address, wherever it is, your computer\
    \ has its own sort of address. By addressing something to your specific address,\
    \ someone even on the opposite side of the world will be able to send you something.\
    \ The network works much like that—it allows you to send something to a very specific\
    \ point, even if you are not connected physically in any way at all. In fact,\
    \ you can even send it across the ocean from one continent to another with ease,\
    \ so long as you are able to send the request to the right place.\n\nIn order\
    \ to really begin to understand network addresses and how they are relevant to\
    \ hacking, `Kali Linux`, and understanding computing in general, you must first\
    \ understand some important concepts. This section will guide you through understanding\
    \ and defining nodes, hosts, IP addresses, both public and private.\n\n### Nodes\n\
    Nodes are the individual redistribution point within a network’s connection— if\
    \ you were sending something via snail mail, the nodes would be all of the individual\
    \ post offices through which the mail passes. If you send something from Alabama\
    \ to a remote town in Alaska, that one letter is not going to directly travel\
    \ to that remote town—it is going to pass through several checkpoints that act\
    \ as redistribution points. The node may also refer to the final endpoint as well.\
    \ It is effectively every location to which the data has been forwarded until\
    \ eventually it reaches the end of the line and is delivered to where it was supposed\
    \ to be.\n\n### Hosts\nThe host is a computer that is connected to another computer\
    \ that is responsible for sending data. The host is a network node—it receives\
    \ and sends information and has its own address. This can be a server that is\
    \ holding information as an archive, allowing other people to access it.\n\n###\
    \ IP Address\nIP addresses are your `Internet Protocol` addresses. This is the\
    \ unique address assigned to your computer on the network.\n\n## Public vs. Private\
    \ IP address\nIP addresses primarily come in two forms—public and private. Each\
    \ of these is assigned in a slightly different way.\n\n- **Public IP address**:\
    \ This is the address that is globally unique on the internet.\n- **Private IP\
    \ address**: This is the address used within a local network (like a `LAN`).\n\
    \n## Assigning an IP address\nThere is also a third type of IP address—the static\
    \ IP. This is an IP address that does not change, which is useful for servers\
    \ or devices that need to be consistently reachable. To assign a static IP in\
    \ `Kali Linux`, you can follow these steps:\n\n1. Open the network settings.\n\
    2. Navigate to the connection settings.\n3. Select the connection you want to\
    \ configure.\n4. Change the method from `DHCP` to `Manual`.\n5. Enter the IP address,\
    \ subnet mask, and gateway.\n6. Save the settings.\n\nAlternatively, you can use\
    \ the command line:\n```bash\nsudo ip addr add [your_ip]/[mask] dev [interface]\n\
    sudo ip link set [interface] up```\nTo set the default gateway:\n```bash\nsudo\
    \ ip route add default via [gateway_ip]\n```\n\n# Chapter 11: Kali Linux: The\
    \ Hacker Operating System\n\nAt this point, you should be able to see that cybersecurity\
    \ is crucial and that there are very good reasons for learning how to both hack\
    \ in order to identify any weak links in your systems and to protect them from\
    \ harm. This is where `Kali Linux` comes in. Now, as a quick disclaimer before\
    \ continuing, it is never recommended that you use these methods to deliberately\
    \ damage or sabotage someone else or their connection. You should not be using\
    \ the tools within `Kali Linux` for illegal purposes. However, if you do choose\
    \ to do so, keep in mind that you will be entirely responsible for your own actions.\
    \ This book does not condone, nor does it encourage the use of hacking for nefarious\
    \ purposes.\n\n## What is Kali Linux?\n`Kali Linux` is specifically a `Debian`-based\
    \ distribution. Developed by `Offensive Security`, it is designed for penetration\
    \ testers and security professionals. It comes pre-installed with a vast array\
    \ of tools for security auditing and penetration testing.\n\n## The Kernel\nThe\
    \ `kernel` is the core of the operating system. In `Kali Linux`, the kernel is\
    \ modified to support a wide range of hardware and features needed for security\
    \ tasks.\n\n## Network Interface\nThe network interface card (NIC) is the hardware\
    \ component that connects your computer to a network. In `Kali Linux`, you can\
    \ manage these using various commands like `ip` or `ifconfig`.\n\nTo view your\
    \ network interfaces, use:\n```bash\nip addr\n```\n\nTo bring an interface up\
    \ or down:\n```bash\nsudo ip link set [interface] up\nsudo ip link set [interface]\
    \ down\n```\n\n## Network Service\nTo restart the networking service, you can\
    \ use the following command:\n```bash\nsudo systemctl restart networking\n```\n\
    \n## Threats to Network Security\nThere are many types of threats that can affect\
    \ networks:\n\n- **Man-in-the-Middle (MITM)**: This is an attack where an attacker\
    \ secretly intercepts and possibly alters the communication between a host and\
    \ a recipient.\n- **Cyberattacks**: These are intentional attempts to steal information\
    \ or breach a system. They can be active or passive.\n    - **Active Attack**:\
    \ The attacker interacts with the system, e.g., using masquerade attacks.\n  \
    \  - **Passive Attack**: The attacker monitors or scans the network to find vulnerabilities\
    \ without interfering.\n- **Denial of Service (DoS)**: An attack designed to cause\
    \ serious problems by flooding a network with requests until it crashes.\n   \
    \ - **Distributed Denial of Service (DDOS)**: Similar to DoS, but uses multiple\
    \ attacker machines instead of a single one.\n\n## MAC Spoofing\nMAC addresses\
    \ are usually hard-coded onto the `NIC`, but they can be edited. This is known\
    \ as MAC spoofing. It is often used to bypass access control lists or to hide\
    \ identity.\n\n![](OEBPS/rsrc392.jpg)\n\nTo change your MAC address, you can use:\n\
    ```bash\nsudo ip link set dev [interface] address XX:XX:XX:XX:XX:XX\n```\n"
  raw: 'Information Security: The CIA TriadAs noted just prior, one of the elements
    of cybersecurity is information security. This particular element is so important
    that it warrants discussing in its own section. Within information security, there
    is a concept known as the CIA triad. This particular triad stands for confidentiality,
    integrity, and availability, which serve as the mission statement of sorts for
    the information security side of cybersecurity.![](OEBPS/rsrc38Y.jpg)Each of these
    three sides to the triad is crucial: Information protected must be confidential,
    accessible, and maintained with integrity. Without achieving all three of these
    goals, information security has not entirely been achieved. These are the fundamentals
    for information security, and will always be the core objective.ConfidentialityThis
    is the ability to protect information from any sort of unauthorized access to
    it. When information is confidential, it is not accessible by anyone that is unauthorized.
    For example, when you go to the doctor’s office, your medical history is confidential
    unless you sign a release form. In the medical setting, that information is protected
    by both security measures as well as regulations for conduct to protect your sensitive
    medical information from becoming well-known. In the information security side,
    the information that is being protected will only be accessible by authorized
    users, with unauthorized users automatically being rejected upon failing to provide
    the right credentials. For example, consider a credit bureau that has access to
    all of your personal information, from your social security number to the accounts
    and account numbers of any of your credit lines—if their data is not secure, you
    are at risk of identity theft.IntegrityIntegrity is achieved when information
    is held in a way that is accurate and consistent. This means that its intended
    and original structures are maintained without any prior authorized changes to
    the material in the first place. While it is possible that information gets changed
    if the user is careless or used or if there is an error, however, integrity will
    be maintained so long as the information is unmodified during storage, being transferred
    to the requester, and when being used, short of anyone actively and consciously
    changing it. This means that the data is accurate and kept constant.For example,
    imagine that you have checked your bank account before going to buy a new computer
    because you wanted to make sure that your direct deposit check had, in fact, been
    deposited. If your banking app does not update properly or reflect the fact that
    you did, in fact, get paid, you are going to think that you are unable to buy
    that laptop or any other need you may have had.AvailabilityThe final goal, availability,
    refer to the information being readily available whenever and wherever it is requested
    and needed. Because information is generally protected, it is not available to
    everyone, but it must be available to those with the proper credentials. This
    should be maintained as much as possible—data protection without ready access
    to it is not exactly the most useful in situations where data becomes essential.
    For example, imagine that your medical records are being protected. If your doctor
    were unable to access your medical records on-demand, you would not be able to
    get the proper treatment.Chapter 10: Introduction to NetworkingWith the wide-scale
    use of the internet comes the introduction of networking. While it may be easy
    to think that the information or requests that you put through the internet simply
    appear instantly after being beamed up to a satellite, especially if you are using
    a router for a wireless home connection, what actually happens is that the data
    that you push through goes through wires to get the information you have requested
    to be returned to you, all at lightning-quick speeds. This is the creation of
    the network, and whether you have ever considered it or not, it is a massive part
    of everything in this day and age, and you most likely use the network several
    times a day. Whether you check your bank account or even buy something with a
    debit or credit card, you are sending information through a network.![](OEBPS/rsrc38Z.jpg)What
    is a Network?Defined simply, a network is two or more computers that are connected
    together in some way in order to share information or interact in some way. The
    computers do not have to be connected via wire—they can be connected through infrared
    beams, through the transmission of radio waves or satellites, or even through
    wires. However, they are always connected in some sort of way.There are several
    instances in which a network is a right choice for the usage that is planned out.
    For example, imagine that you have two computers (a laptop and a desktop), a tablet,
    and a cell phone. You regularly use all four items at home and want to make sure
    that data that is attached to your laptop, which you use primarily for being able
    to access and browse the internet or answer emails, is also available on your
    more powerful desktop, which may be reserved for more intensive programs, such
    as playing video games or editing large files or videos. You also, just for convenience,
    would like to make sure that your photos that you take on the go with your phone
    are accessible from your other sources as well. When you want that level of connectivity,
    where you are able to access all of your files from anywhere, you are looking
    for a network connection. In getting that network connection, you are able to
    share those files with ease.Of course, there are other ways that networks become
    crucial as well. If you work for a school, for example, you may be familiar with
    computer labs. In these labs, students put in their login information from any
    computer to pull up the same account. Teachers can also submit their information
    to log on from any computer on that network as well, so long as they use the right
    password and username.Types of NetworksNetworks themselves can come in several
    different forms. These networks are used for everything and anything that involves
    the transmission of information, whether you are printing a document or sending
    an email. It is important to understand that, when discussing networks, you are
    primarily discussing one of two different network types, though there are several
    others, depending on the purpose. The two that are most commonly discussed are
    LAN and WAN, with VPN being a close third. These three types of networks have
    their own specific usage scenarios. This section will give you a brief overview
    of LAN, WAN, and VPN, though you will find that VPN gets discussed in more depth
    in later chapters.LANThe most common of the networks in modern-day understanding
    is the LAN. This network type is known as the Local Area Network—it connects computers
    and low-voltage devices to one another within a small or local area. This may
    be within a single building or even a couple of buildings that may need to share
    information. With the use of a router, a LAN can interact with a WAN in order
    to transfer data quickly and securely. If you are going to be setting up a personal
    network at home, it will most likely be a LAN, especially if more than one person
    shares it.WANStanding for a wide area network, WAN allows for computers to connect
    from further distances apart.This means that computers, even far from each other,
    are able to be connected to each other through one means or another. This can
    be on a smaller scale, such as an internet service provider that is connected
    to several different LANs, stringing them together into one cohesive network together.
    Another more well-known type of WAN is the internet. The internet allows for the
    connection of computers across the world.VPNVPN stands for a virtual private network.
    It is a network that has been extended across the internet as if they were accessing
    a private network that others cannot access, though the internet. These can also
    be achieved remotely, through the use of a virtual point-to-point connection,
    in which the private and remote sites are able to access each other. They are
    routed through the internet from a private network in order to transfer sensitive
    information and ensure that it is secure. Typically, it was done by encrypting
    the data—making it so it cannot be read easily by someone who is not supposed
    to have access to it in the first place.Network AddressA network address is a
    way that the nodes and hosts within a network are able to be identified. Just
    as your house has an address that allows for snail mail to be delivered exactly
    to your address, wherever it is, your computer has its own sort of address. By
    addressing something to your specific address, someone even on the opposite side
    of the world will be able to send you something. The network works much like that—it
    allows you to send something to a very specific point, even if you are not connected
    physically in any way at all.In fact, you can even send it across the ocean from
    one continent to another with ease, so long as you are able to send the request
    to the right place.In order to really begin to understand network addresses and
    how they are relevant to hacking, Kali Linux, and understanding computing in general,
    you must first understand some important concepts. This section will guide you
    through understanding and defining nodes, hosts, IP addresses, both public and
    private.NodesNodes are the individual redistribution point within a network’s
    connection— if you were sending something via snail mail, the nodes would be all
    of the individual post offices through which the mail passes. If you send something
    from Alabama to a remote town in Alaska, that one letter is not going to directly
    travel to that remote town—it is going to pass through several checkpoints that
    act as redistribution points. The node may also refer to the final endpoint as
    well. It is effectively every location to which the data has been forwarded until
    eventually it reaches the end of the line and is delivered to where it was supposed
    to be.HostsThe host is a computer that is connected to another computer that is
    responsible for sending data. The host is a network node—it receives and sends
    information and has its own address.This can be a server that is holding information
    as an archive, allowing other people to access it. It could also be a person to
    person host, in which you have one computer that is holding all of the information
    in which you are going to access from another. In the sense that a host of a party
    is the one providing the fun, food, and festivity, the computer host is providing
    all of the information that is desired. In order to be deemed a host, the computer
    or server must have its own network address.IP AddressIP addresses are your “Internet
    Protocol” addresses. This is the unique address assigned to your computer’s online
    activity. Continuing upon the post office model of the network, think of your
    IP address as the return address in the corner of the envelope—it allows for the
    network and the website or server that you are accessing to know that it is your
    particular computer accessing it, and allowing the server to send the proper information
    as requested back to you. Without this address being nicely provided for you,
    the information that you have requested is not as likely to make its way back
    to you, despite needing to.These IP addresses are not static based on the computer;
    rather, they are provided by the internet service provider (ISP) for you. Since
    the ISP acts as your gateway from your LAN to the internet, it also tags your
    requests with the IP address assigned to your home or access point. It allows
    the computer to make that connection to the internet and then granting you access
    to it. It is able to connect further through the use of internet protocols, which
    will be discussed later within this chapter. This means that any time you connect
    to a new internet location, even from the same computer, you will be given a new
    IP address. The local wifi at the café will give you a different IP address than
    the one you have at home or at work, even if all three were accessed from the
    same computer. This is because, when you are on a new internet location, you are
    accessing the internet from a new location. Your information needs to take an
    entirely different route to reach you based on your location.Public vs. Private
    IP addressIP addresses primarily come in two forms—public and private. Each of
    these is assigned in a slightly different way in order to allow for the necessary
    access to where they are supposed to go. The public IP address is the one discussed
    earlier—it is the one that is designed to allow access to the internet that is
    provided by the ISP. It is globally unique and can be discovered quite easily,
    either through commands in the terminal when using Linux systems or through the
    internet. Just searching “What is my IP address” online should provide your public
    IP address to you.A private IP address acts similarly—it provides a computer a
    specific address, but in this case, it is used on computers within a private space
    or network without ever exposing that particular device. Think about a LAN—you
    may have several computers all on the same network. In this instance, the individual
    computers all hooked to your private network have private IP addresses. These
    IP addresses are not tied to the internet, but the connection point, likely a
    router, is able to send information to the right private IP address. The router,
    then, gets the public ID while the computers connected to the router get private
    ones.Assigning an IP addressThere is also a third type of IP address—the static
    IP address. This IP address will allow you to use various network services without
    needing to have the IP address of the system that is hosting the services. This
    can be done in several ways, such as binding the MAC address to an IP address
    or in setting one up in a command line or a network manager.When you wish to do
    this manually, you will need to look at the router that you are using. Generally
    speaking, routers will use their own methods to lock and bind IP addresses and
    you should always check the manual for the router that you are using. The way
    this works is by directly binding the MAC address to the IP address. The MAC address
    is the media access control address—it is an identifier that is put into a device,
    uniquely defining it. This is permanent and assigned to the network interface
    controller (NIC) for that particular device. This means that the item will always
    have the same MAC address, no matter how many times it is directly factory reset
    or altered.When you make the IP address static, what you do is directly assign
    that one particular MAC address to one particular IP address. This method will
    not be used to create a static IP for a virtual machine, however.In Kali Linux,
    creating a static IP address is incredibly simple. All you need to do is use the
    Network Manager settings. In doing so, you must go to the top right-hand corner
    of your screen and click on the menu arrow. Then, click on “Wired Connected” followed
    by “Wired Settings.”After you do this, you will be given a new window. You should
    see gear icons—click on the gear icon that is connected to the Wired menu. This
    will trigger another window to open, in which you will choose the IPv4 tab. You
    can then shift the IPv4 method from automatic to manual, followed by entering
    the desired static IP that you would like to implement.When you are choosing out
    the desired address, keep in mind that the first seven digits of your chosen address
    should match the default gateway. That is to say that if the router’s gateway
    IP address is 123.456.7.8, your selected IP should have an address of 123.456.7.**
    and you should record that selected IP under Address under this menu.You must
    also select your netmask—for most people, simply entering 255.255.255.0 is good
    enough. You must then record your Gateway, which should match the IP address of
    the router. This leads to the following settings:![](OEBPS/rsrc390.jpg)Upon lining
    up these settings, you can then choose to set any DNS settings if you want them,
    though this is not necessary. After finishing setting up the address, netmask,
    and gateway, you can hit apply.In order to ensure that you have the router’s IP
    address, all you need to do is enter the command:ip roIf you look after the response
    “default via,” you will have your router’s IP address.Lastly, to then apply all
    of the changes to the IP address, you must restart the network. You can do so
    with the following command in the terminal:sudo systemctl restart NetworkManagerAssuming
    you are already familiar with Linux and the basics behind using it, you know that
    sudo is the command that triggers the system to bypass any administrative restrictions,
    so long as you have been set as a sudo user. If you find that you are unfamiliar
    with this process, you may benefit from seeking out a beginner’s guide to Linux
    before proceeding with the book.With the sudo command entered, you can now stop
    to check your current local IP to make sure that your changes were received and
    made. You can do this with the following command:ip aYou should then be able to
    see what the IP address on your system is. If it matches what you have tried to
    set, then you have been successful in setting your own IP address.Protocol LayersAs
    briefly touched upon earlier, the internet is run by protocols. This protocol
    has five distinct layers that come together to create an internet protocol stack.
    The first four layers of the internet protocol stack are contained within the
    TCI/IP model. In understanding how these layers work, you are able to see exactly
    how people and systems interact with the internet as a whole. This section will
    introduce you to the layers of the internet as well as the methods of accessing
    them.Internet Protocol (IP)The Internet Protocol (IP) is the primary protocol
    dictating how communications are managed over the internet. It explains how datagrams,
    the information that your computer sends when requesting further information,
    are relayed across networks and boundaries. Its primary function is routing information,
    which then allows for information to be transferred, which then creates the internet
    as a whole.IP is tasked with transferring packets, small parcels of information
    that must be transmitted, from the source host to the destination host. It utilizes
    IP addresses in order to do so, providing them with the packets’ headers. While
    the IP was once connectionless, it was also used as the basis of the Transmission
    Control Program that eventually became the Transmission Control Protocol (TCP).
    For this reason, you sometimes will see IP referred to as the TCP/IP, as will
    be discussed in the next section.The IP began as IPv4 (Internet Protocol Version
    4), though this is beginning to be replaced by IPv6.Ultimately, the IP is responsible
    for several functions. It can be divided into four distinct functions—the application,
    transport, internet, and linking of data. There is a fifth layer to the transmission
    of data and packages as well—the physical layer, though the TCP/IP model does
    not encompass the physical.The TCP/IP ModelThe TCP/IP model is one of the specifications
    of IP—it is the definitive list of rules on how communication should occur between
    computers on a network. It dictates the formatting standard for data, allowing
    all systems to utilize the same standards. Essentially, the TCP/IP model allows
    for all systems, no matter where they originate from, to access the same internet.![](OEBPS/rsrc391.jpg)This
    is done by creating standard datagrams—these datagrams have two components. They
    have a header and a payload. The header includes the source IP address, the IP
    address of the destination, and any other necessary metadata that will be needed
    to ensure that the information is all received exactly where it should be. The
    payload then is the data that will be delivered to the source that needs to receive
    it. When the payload and the header are nested together into what is referred
    to as a packet, the process is known as encapsulation.With the IP stack, there
    are five distinct layers, as mentioned previously. The first four layers are relevant
    to the TCP/IP model. The first layer, the physical layer, is responsible for the
    encoding and transmission of data from one source to the proper network communications
    media. It uses data that is referred to as bits that get sent from the physical
    layer, which the destination’s physical layer will receive. Essentially, the first
    layer takes the input you put into the computer, through clicks and presses of
    your keyboard keys in bits and encodes them. ThisNext, you go through the data
    link layer—during this layer, the packets that were previously encoded are transferred
    from the network layer to two separate hosts. This transmission of packets is
    sometimes controlled by the software device driver in a network card or with firmware,
    and different protocols will have different methods of using this. In broadband
    internet, for example, access requires PPPoE as the necessary protocol, though
    a local wired network will utilize an Ethernet cord. Local wireless networks,
    on the other hand, will use IEEE 802.11 instead.From the data link layer, you
    move on to the network or internet layer. This is where the data is actually taken
    from the source network and travels to the destination. It is typically achieved
    through passing the packet from network to network to network, a process referred
    to as internetwork, and this is where IP becomes relevant. This step involves
    data going from one source to the destination.Once that data is sent to the destination,
    however, there are still two more layers before it can be accessed. The next layer
    is the Transport layer—its responsibility is to allow for the message to be transferred.
    This usually occurs in one of two ways: either through transmission control protocol
    or through the User Datagram Protocol (UDP). TCP as a system of communication
    refers to the connection-oriented communications protocol that is meant to allow
    for the exchange of messages across the internet. Usually deemed to be reliable
    thanks to the fact that there are several different error-checks to ensure that
    it all is translated and transmitted effectively. It is first ordered into packets
    and numbered, and then the information is sent to the recipient and requiring
    a response back to the sender to confirm receipt of the message in the first place.
    If the receiver’s response is anything other than accurate, then the message gets
    resent properly to ensure that the right data and packets are sent in a way that
    is properly read. This is the most common form of communication and transmission
    of data across the internet.UDP, on the other hand, allows for faster transmission
    of data. Unfortunately, the faster transmission of data comes at a cost—accuracy.Error
    checking is done away with, and it instead focuses on sending data as quickly
    and accurately as possible. Because waiting for the submission of data can take
    time, latency, or lag between what has been requested and what has been done occurs.
    In some instances, people may prefer to sacrifice accuracy and security in favor
    of the speed of UDP. Both of these protocols work through developing beyond the
    IP protocol—they effectively are sending packets of information to an IP address
    that has been sent via TCP or UDP.Threats to Network SecurityOf course, with the
    creation of networks comes threats as well. Nothing good can be left free from
    harm or problems, and data and network security are no exception. Every addition
    of an extra source or node can lead to weaker links—there are more holes that
    could potentially be prodded into. There are more chances of failure. And that
    is exactly what those who break into networks, hacking them or exploiting them,
    are looking for. They can pose a serious threat to network security, and it is
    important to know and recognize that.There are several different forms of hacking
    and attempts to exploit technology, and this section will address some of them.
    A few of these may sound familiar from the previous chapter, while others are
    new. These are still not an extensive list of all the ways that it is possible
    to exploit or hack into a system, though they are important to understand. You
    cannot really understand networking if you do not understand the risk and threats
    as well.Man-in-the-MiddleAs discussed earlier in this book, the man-in-the-middle
    attack is an attack in which the attacker is secretly intercepting and sometimes
    altering the communication between a host and a recipient. The host and recipient
    think that they are able to communicate freely or that they are speaking directly
    with each other, but the MITM is listening—they are able to make two parties feel
    like they are safe and secure, all while gleaning valuable information that can
    be used later in some way, shape, or form. This usually is done through the attacker
    managing to gain access to one of the transmission IDs that are meant to be unique
    between the two end users.![](OEBPS/rsrc392.jpg)Sometimes, this occurs when someone
    within the Wi-Fi range is able to manage to insert him or herself into the connection
    and begin to intercept information back and forth. It is the most successful when
    the attacker is able to successfully impersonate both endpoints, making sure that
    neither person or user has raised any suspicion.CyberattacksCyberattacks are intentional
    malicious attempts to steal information or otherwise breach an information system
    of another person. Typically, it occurs because someone sees some sort of value
    in deliberately interfering with someone else’s computer or network. The reasons
    for cyberattacks have been growing lately, with people sometimes seeing them as
    instant crash grabs—they may intentionally hack into a system in order to ask
    for a ransom or to offer to fix the discovered exploit for a price. No matter
    the situation, these cyberattacks are undeniably damaging. They can have serious
    financial implications while also putting sensitive data at risk. This can happen
    either actively or passively.An active cyberattack involves someone intentionally
    trying to get into a system for some reason or to get something. The hacker is
    deliberately attempting to make changes to the system for some reason to the data
    that is either going toward or away from the individual. These include the use
    of masquerade attacks, such as the pretending to be an individual that has greater
    privileges that are actually granted or authorized in the first place.A passive
    cyberattack, on the other hand, occurs when a network system is monitored and
    scanned to find open vulnerabilities. Instead of attempting to change the information
    in some way or otherwise alter the network, the information is simply used to
    monitor the data in some way. It is taken for use, but is not actually altered.This
    is what someone would do if they intended to leak important information in order
    to blackmail or reveal something that otherwise would have remained private. Think
    of a hacktivist who would willingly use this information in order to reveal something.DOS
    and DDOSA denial of service attack is an attack designed to cause serious problems
    to the network. The entire purpose of this is to flood a specific network in order
    to crash it. Just as a traffic jam builds up when too many people are on a road
    that is too small to accommodate for it, the network will not be able to manage
    too many requests at the same time if it is not large enough to do so. Usually,
    this is done with an attacker machine able to run a client program, which then
    constantly inundates the targeted server with pings and requests in order to cripple
    it. As the network continues to try to respond in time, the network slows and
    slows until it eventually just stops altogether.DDOS (distributed denial of service)
    is exactly the same, though it makes use of several attacker machines rather than
    a single one. In doing so, larger networks can be compromised and crippled. Think
    about the implications of this happening—a website that needs to be functional
    will no longer be able to. A bank that has been crippled and cannot handle any
    traffic could risk people not being able to access funds. A hospital system that
    is unable to access and manage their patients’ information would be unable to
    access records and medical histories or see whether people have recently had access
    to their necessary medication or other treatments.  This sort of attack can be
    absolutely devastating, depending on the context.MAC SpoofingAs you have already
    read, MAC addresses are usually permanent and hard-coded onto the NIC of a device.
    However, there are ways that this can be edited and altered. This is known as
    MAC spoofing. When MAC spoofing is used, the operating system being targeted or
    interacted with is able to be fooled to believe that the MAC address is actually
    something entirely different. Effectively, this allows for the identity of a computer
    to be altered and hidden. This is most often done because the individual wants
    to bypass the access control lists. If they have been banned from a server, for
    example, they are able to bypass this list by changing it. They can also impersonate
    another device in order to gain unauthorized access to a system through similar
    means.MAC spoofing can also be done to conceal identity—if you wish to use an
    unencrypted connection, such as an IEEE encrypted line, you are not going to be
    able to prevent the Wi-Fi network from providing others with access to the MAC
    address. When you spoof your address, you are able to avoid being traceable. You
    will have hidden that identity and in doing so, you are able to be invisible,
    so to speak. Your true MAC address has been concealed and because of that, you
    can escape detection by law enforcement.Chapter 11: Kali Linux: The Hacker Operating
    SystemAt this point, you should be able to see that cybersecurity is crucial and
    that there are very good reasons for learning how to both hack in order to identify
    any weak links in your systems and to protect them from harm. This is where Kali
    Linux comes in. Now, as a quick disclaimer before continuing, it is never recommended
    that you use these methods to deliberately damage or sabotage someone else or
    their connection. You should not be using the tools within Kali Linux for illegal
    purposes. However, if you do choose to do so, keep in mind that you will be entirely
    responsible for your own actions. This book does not condone, nor does it encourage
    the use of hacking for nefarious purposes. If you do decide to utilize these skills,
    the reason for doing so should be that you wish to protect or defend your own
    security.This chapter will introduce you to Kali Linux properly—you will learn
    about what Linux is first and foremost, and from there, you will learn about Kali
    Linux, the specific distribution of Linux. You will be taught how to install Kali
    Linux, what Kali Linux comes packaged with, and some of the common Kali Linux
    specific information and commands that you may need to know. By the end of this
    chapter, you will have a working knowledge of what Kali Linux is as well as how
    to install it into your computer.What is Linux?First, you must understand what
    Linux itself is, as Kali Linux is ultimately a Linux distribution (colloquially
    referred to as a distro). If you are already familiar with Linux, you can skip
    this section, as it is not likely to provide you with anything else. If you are
    unfamiliar with Linux, please read through this section and remember that this
    is not a distribution to be taken lightly or to be treated as a toy. Kali Linux
    is dangerous and should not be in the hands of someone who is going to be unable
    to protect against serious damages.Linux itself is an operating system—it is designed
    to be open-source. This means that the code itself is readily alterable and free
    to distribute. It is intentionally designed to be flexible and able to be changed
    in several different ways. The code is open-source, meaning access to altering
    the mainframe and base code is quite simple, and in many forms of Linux, if you
    are simply able to gain access to the terminal, you will be able to tell it to
    do anything—even if what you tell it to do is detrimental or risks crashing the
    entire system that you have installed.When you learn to use Linux, you are given
    free control over the system. More specifically, however, Linux describes the
    kernel itself rather than the actual operating system. The kernel is the base
    that allows for the computer’s OS to start up the hardware, allowing for the initial
    interaction between OS and user to begin building from that. Some forms of Linux,
    such as Mint or Ubuntu, are designed to be readily accessible, easily understood,
    and built to be managed and utilized with ease.Other distributions of Linux are
    far more technical and require you to have much more programming knowhow in order
    to truly command them. These are distributions such as Gentoo, which is widely
    known as an internet meme much like deleting System 34 in Windows in order to
    cause the whole thing to crash. Other forms still bring with them several tools
    and functions that you may not necessarily have access to otherwise, such as several
    of the penetration-based tools of Kali Linux. It is important for you to understand
    what you can and cannot do, what your own capabilities are, and how you can possibly
    interact with the systems before you make it a point to install Kali Linux.If
    thus far, you were lost with the talk of kernels and distributions or the idea
    of coding your own programs and commanding your computer, please stop reading
    now and seek out a beginner’s book before revisiting. These concepts are crucial
    and it is expected that you have some level of familiarity with the system from
    here on out, whether you are a beginner or not. Remember that you can cause irreparable
    harm if you attempt to use this system without knowing fully what you are doing—you
    must be cautious and careful to avoid a disaster of your own doing.What is Kali
    Linux?Kali Linux is specifically a Debian-based Linux distribution. Developed
    by Offensive Security, Kali Linux was designed to be a leading trainer in information
    security professionals. With the tools utilized in Kali Linux, you are able to
    begin hacking with relative ease if you know what you are doing—it brings with
    it several of the tools that you will find necessary, and it also allows for training
    and certification.In fact, if you wish to be an information security technician
    or professional, you are most likely going to be required to have a certification
    that you have earned based upon the courses taught by Offensive Security.When
    you have used Kali Linux, you are gaining access to the tools that are designed
    to help you with information security tasks. You will be able to engage in Penetration
    Testing, security research and more. Because Kali Linux is managed and maintained
    by Offensive Security, one of the leading trainers in cybersecurity, you know
    that the tools provided are much like the ones that you will be fighting in the
    future.In particular, this distribution of Linux is designed to meet the needs
    of penetration testing professionals—because it is aimed toward professionals,
    it assumes that you already are familiar with Linux as an operating system.Kali
    Linux boasts several important traits that make it useful in the hacking world—these
    tools make it valuable to both those interested in hacking for nefarious purposes
    and those who are interested in bettering security overall. However, these traits
    came at a cost. Several of the commonly known benefits to using Linux distros
    in the first place have been changed in order to make Kali Linux a more valuable
    tool. After all, the beauty of Linux is that it is capable of anything that you
    are capable of programming so you are able to create an operating system that
    exactly serves the needs you have. Now, let’s take a moment to go over those key
    changes from the standard Linux distribution.It is single user root access.Remember,
    root access refers to whether or not someone has administrative authority on that
    device. The root user has no safeguards, is not told any under any circumstances,
    and cannot be overridden by the system. In most cases with various other Linux
    systems, it is strongly recommended that you avoid using the root access account
    and instead set up another with sudo privileges. However, that is not possible
    with Kali Linux—the OS does not allow for any other users or for root access to
    be left behind. This means that the operating system if you do not know what you
    are doing, can be completely destroyed with just one or two typos or not knowing
    what you are doing. Because of the nature of the tools and usage scenario with
    Kali Linux, almost everything you will be doing would be considered higher privilege
    and you would either have to constantly sudo command the system, or you would
    need to remain in the root user account anyway. Because having to avoid the root
    account would be a burden, Kali Linux has instead shifted over to remain in root
    access constantly. This is yet another reason that this is not a distro for a
    beginner.![](OEBPS/rsrc393.jpg)Network services are disabled.While network services
    are usually enabled in Linux distros, within Kali Linux, there are system hooks
    that leave network services disabled by default. This is a security method—it
    allows for services to remain secure and protects the distribution regardless
    of the packages that are installed. Other forms of networking, such as Bluetooth,
    are also disabled.Linux kernel is customized.While nearly every other Linux distribution
    is linked together by the common Linux kernel, the Kali Linux distro does not
    use that exact kernel—the one that is utilized in Kali Linux has been customized,
    allowing it to be patched for wireless injection, yet another way that it is able
    to act as a tool useful for penetration testing.Repositories list is minimal.Because
    Kali Linux is designed to be secure, there is a minimal list of sources for software
    that are allowed access to the system. While many people may feel the need or
    temptation to add systems that are not authorized or on the repository list, doing
    so can cause a high likelihood of crashing the Linux installation altogether.
    For this reason, you must recognize that Kali Linux is not so much a day-to-day
    OS as a tool to use for training and very specific usage scenarios. If you do
    not make use of it in one of these scenarios, such as penetration testing or practicing
    your skills, you are going to find little use for the system. You will not be
    using this for daily web browsing and attempting to answer emails or play video
    games—attempting to do so runs the risk of crashing the whole thing.Should I use
    Kali Linux?You may expect that a book written about Kali Linux would be spouting
    out all of the reasons that you should, in fact, use this distribution. However,
    due to the risks, the specialized and unique nature of this distribution, and
    the limitations that come with it, it is important to walk through the reasons
    that Kali Linux is likely not for you instead.This distribution is designed specifically
    for professional testers and specialists. It is difficult to learn and it will
    not give you access to do anything you want. Despite being open-access, it is
    only so open—there are aspects of this distribution that are locked due to security
    reasons, and you will not be able to change them. The packages in repositories,
    for example, must be signed by the committee, and these repositories are upstream.
    It is well-tested and the development team is one that can be trusted and respected.
    However, if you want a system that you have complete access to, Kali Linux is
    not for you.Yes, there is some degree of customizability, but you will not be
    able to install juts anything. You must install from a chosen list of repositories
    if you wish to have them work right away. If you try to install something not
    on that list, you will have to go through several hoops to try to fix it up, and
    even then, you still are quite likely to cause more problems than you have fixed.
    For regular browsing and usage, Kali Linux is not right for you.If you are already
    familiar with Linux and already are comfortable with network administration or
    system administration and want a tool to learn more, this may be the right OS,
    but this should never be treated as the first intro to Linux. Especially because
    any unauthorized attempts to penetrate a network can not only cause significant
    damage but also carry hefty legal or personal issues, this should only be used
    by people that know what they are doing and are not likely to accidentally destroy
    someone else’s network or access to service. Again, because it is so crucial to
    reiterate, if you are a beginner, seek out a Linux distribution that is designed
    to be easier—Ubuntu, Mint, and Debian are all fantastic starting points.Of course,
    if you are a penetration tester already or are actively studying penetration in
    order to become certified, Kali Linux is exactly right for you. You cannot beat
    the tools that are designed by professionals for professionals, nor can you beat
    the price of free for that toolset.Kali Linux FeaturesIf you have decided that
    Kali Linux is may be right for you, there are several tools that may be relevant
    to you. This section will guide you through the most common features of Kali Linux
    so you can begin to understand better whether this will be good for you to use.Hundreds
    of Penetration Testing ToolsKali Linux boasts a massive repository of tools that
    can be used for penetration testing, all of which have been verified and tested
    to be safe. Every tool provides a purpose that will be useful to your work in
    penetrating and controlling systems.FreeThis is perhaps one of the most compelling
    reasons to make use of Kali Linux—if it serves the right uses for you, it is absolutely
    free. You will never be required to pay to have access to this set of tools, meaning
    that there are no ongoing licenses to maintain.SecureKali Linux has been developed
    by a small group that is trusted to interact with the repositories and even that
    has several protocols to help make sure that Kali Linux is as secure as possible.
    This means that any package that will be sent for download will be signed by developers
    who have committed and built it, allowing for tracking accountability if anything
    were to go wrong.CustomizableWhile Kali Linux has very specific usage scenarios
    that are encouraged, and certain usages of the system are strongly frowned upon,
    the entire system has been built to be customizable. You can try to change Kali
    Linux to suit your needs, even if those needs go against the recommended usage.
    You may run into complications, but you are able to attempt to do whatever you
    think you need to do.Multi-Language SupportUnlike many other penetration tools,
    Kali Linux allows for true multilingual support. Instead of having to operate
    and learn everything in English, people are able to use Kali Linux in their own
    native language.Open Source Git TreeAll source code is available for people to
    see or tweak to their specific needs. People can follow the development and source
    codes to make sure that they can get exactly what they want and need, with the
    few limitations listed in the previous section.FHS CompliantKali Linux allows
    for Linux users to locate their files and libraries thanks to the familiar Filesystem
    Hierarchy Standard that has always been used. This means that if you are already
    familiar with Linux, using this has one less hurdle to get over.Wireless Device
    SupportKali Linux has been designed to support a wide range of wireless devices,
    allowing for it to be compatible with USB and other wireless devices with ease.
    This allows for easier access to information and transmission of information.Custom
    KernelBecause penetration testers need to be able to do wireless assessments,
    the Linux kernel within Kali will always be up to date with all of the latest
    patches to aid in the act of injection to other systems.How to Install Kali LinuxAt
    this point, you should have a good idea of whether installing Kali Linux will
    benefit you. If you think that it is, in fact, what is right for you after having
    looked through everything about the OS, then it is time to begin discussing the
    installation process of the OS. Installation is the first step toward being able
    to utilize the Kali Linux operating system and can be done in several ways. If
    you are installing Kali Linux in any way that is not traditional installation
    method of installing the Kali Linux OS on your computer or if you think that you
    will be running a virtual machine, you may be better off going to the official
    Kali Linux site and looking at the guides and tutorials that they have available.What
    You Need for InstallationWhen you are ready to install, you must make sure that
    you have everything that you need. This can vary greatly depending on the system
    that you are using. Those running Linux probably already have everything that
    they need installed, but if you are running either macOS X or Windows, you are
    going to need to make sure you install the proper GPG for your particular operating
    system.Either way, if you go to the Kali Linux Kali Docs Official Documentation
    library, you will be able to go to the instructions for downloading the official
    Kali Linux images. Toward the bottom of the page, both links are provided for
    you to download the prover version of GPG.After installing GPG, you need to download
    and import your copy of the official Kali Linux key. You will do this with the
