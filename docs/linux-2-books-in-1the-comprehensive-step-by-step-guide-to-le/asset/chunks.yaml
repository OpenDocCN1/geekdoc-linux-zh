  trans: "\nCentOS 发布于 2003 年，这是一个社区项目，致力于重新构建红帽企业 Linux（Red Hat Enterprise Linux）的源代码，使其成为可以轻松安装并对所有包含内容提供定期安全更新的。实际上，这使得\
    \ CentOS 成为红帽企业 Linux (RHEL) 的克隆版本，它们之间唯一的区别在于品牌。尽管 CentOS 是一个克隆版本，但两者之间似乎并没有任何真正的冲突。\n\
    \nCentOS 被认为是一个可靠的服务器发行版——这得益于对 RHEL 稳定的 Linux 内核和软件包的利用。它被认为是目前其他服务器产品的一种可靠且免费的替代方案，特别是对于那些对整个\
    \ Linux 已经非常有经验的人来说。这些人发现，管理该发行版并没有太大困难。\n\nCentOS 也适用于企业级桌面系统——如果你需要稳定且可靠的东西，并且倾向于获得支持而非前沿软件，那么这个操作系统非常适合你。当然，如果你非常在意最新和前端的软件，你可能倾向于考虑其他选择，因为与市场上的某些其他选项相比，CentOS\
    \ 的更新频率稍慢。\n\n### 难度分\n具有一定经验的初学者\n\n### 长期支持\n每 9-12 个月发布定期更新，每 2-3 年发布一个新版本\n\
    \n### 优点\n* 提供了稳定性和可靠性\n* 免费软件\n* 7 年以上的安全更新\n* 经过良好测试\n\n### 缺点\n* 没有利用最新的技术\n\
    * 发布和更新并不总是符合其承诺\n\n## 第 2 章测验\n恭喜！你通过了第 2 章。你现在对想尝试哪种发行版有想法了吗？尝试回答这些问题，以确保在进入第\
    \ 3 章之前理解了基础信息。答案位于此测验之后的页面。\n\n1. 什么是 Linux 发行版？\n    1. 一本教你如何安装 Linux 的书\n\
    \    2. 基于 Linux 内核编写的特定操作系统\n    3. 最新的 Linux 硬件\n    4. 以上都是\n    5. 以上都不是\n\
    \n2. 正确或错误：所有 Linux 发行版都在不断变化\n\n3. 在选择适合你的发行版时，你应该考虑哪些特性？\n    1. 用户友好性和你自己的能力水平\n\
    \    2. 它满足你自身需求的程度如何\n    3. 内置软件\n    4. 你是否喜欢它的吉祥物\n    5. a、b、和 c\n    6.\
    \ a、b、和 d\n\n4. 正确或错误：Gentoo 非常适合初学者\n\n5. 正确或错误：Ubuntu 非常适合初学者\n\n## 第 2 章答案解析\n\
    1. B: 发行版指的是你正在使用的特定操作系统程序\n2. 错误：某些发行版（例如 `Slackware`）并没有太大变化，或者多年来没有变化过。\n3.\
    \ E：虽然喜欢吉祥物可能很好，但它不能决定一个程序能在多大程度上满足你的需求\n4. 错误：Gentoo 需要几乎持续的编程才能使其运行。\n5. 正确：Ubuntu\
    \ 极其容易上手，并且设计为用户友好。\n\n"
