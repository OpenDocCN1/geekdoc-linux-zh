    4. 所有在设备上产生的进程都共享同一个 pid


    # 第 1 章答案页


    1. D. 操作系统允许用户控制并与硬件和软件进行交互，但它并不是用户本身。

    2. B. 如果 `kernel` 运行必要功能所需的空间，系统就会崩溃，因此在内核和用户之间之间划分内存可以确保内核始终有足够的空间运行。

    3. 错误。Linux 深受 Unix 以及受 Unix 影响的程序（如 MINIX 和 GNU）的影响。

    4. 错误。Linux 是用 C 语言编写的。

    5. C. 只要当前没有重复的 pid，`pid` 的重用次数没有限制。


    # 第 2 章：选择你的发行版


    恭喜，你已经来到了第 2 章！你已经掌握了继续后续学习所需的所需的背景信息，并决定你确实想使用 Linux 作为你的操作系统。遗憾的是，这不仅仅是决定使用
    Linux 那么简单。请记住，Linux 本身指的是 Linux `kernel`——操作系统的核心。从这里开始，还有其他几个组件，虽然核心保持不变，但你对操作系统所有其他方面的决定（例如
    GNU、X 服务器等）都可能极大地改变你的体验。


    ![](img/rsrc38E.jpg)


    某些版本的 Linux 被称为 Linux 发行版，或更常见的简称为“Linux distros”，有些版本可能足够容易上手，而另一些版本在安装后可能立即成为你的噩噩梦，例如
    Gentoo，它要求包括内核在内的所有程序都从源码编译。


    本章将引导你理解什么是 Linux 发行版，如何决定哪种发行版适合你和你的用途，然后为你提供十种最常见发行版的简要概述。


    ## 什么是 Linux 发行版？


    当你考虑到其他操作系统时，你最可能会想到 Windows 或 macOS——这是世界上最知名、最常用的操作系统。它们由单一公司从零开始构建，并进行增量升级和更改，正因如此，你会得到不同的版本。你有
    Windows XP、Windows 7、Windows 8、Windows 10 等，其中最新版本的 Windows（写此书时为 Windows 10）是最更新且受支持的。如果你现在想通过微软为你的电脑购买
    Windows，你的选择是获取 Windows 10。当然，你可以通过其他渠道获取其他旧版本，但它们不再获得活跃支持，而且不会一直为了安全性进行更新。在某个时间点，公司会停止对其较旧、更过时的软件提供支持。


    然而，与 Windows 或 macOS 不同，Linux 并不是由单一公司创建的。Linux 可以组合使用。只要你收集了所有正确的组件来创建一个完整的操作系统，你就可以将其组装起来。这意味着你实际上可以以
    Linux `kernel` 为基础，多程度上从零开始创建一个整个操作系统，尽管这会非常耗时，而且你必须花精力配置一切以让它们协同工作。或者，你可以寻找 Linux
    发行版。


    Linux 发行版本质上是为你将所有内容整齐地打包在一起。它获取了你原本需要自己寻找的所有开源信息，并将它们整合成一个单一操作系统，这类似于你购买 Windows
    或 macOS 使用许可时收到的东西。它们决定了你将拥有哪种桌面、默认加载哪些程序等，通常带有一层他们自己的自定义界面。


    当然，这也意味着有近乎无限种不同的发行版供你选择，所有这些都可以提供各种不同的功能。这就是为什么在选择之前进行研究对你至关重要。


    ## 如何选择适合你的发行版


    现在到了最困难的部分——确定哪种发行版适合你。当你阅读本章的其余内容时，请考虑这里提出的问题。你在什么设备上安装操作系统？操作系统的目的是什么？你有任何经验吗？你想要或需要什么种软件可用？你想要什么种桌面界面？你需要多频繁地更新？


    这些都是需要记在心的极其重要的问题。如果你不留心，可能会得到一个你实际上并不想要，或无法实际使用的 Linux 版本。


    ![](img/rsrc38F.jpg)


    当你阅读提供的十种发行版时，你将获得关于操作系统本身的简要概述，包括它是适合新手还是经验丰富的人士、它的更新频率以及它的兼容性如何。你需要选择一个最适合你的版本。


    ### Ubuntu


    我们考虑的第一个发行版是 Ubuntu。它于 2004 年发布，现在官方提供三个不同的版本：Desktop、Server 和 Core。这些版本中的每一个都可以在计算机或虚拟机上运行，这使其成为云计算操作系统中的热门选择，特别归功于它对
    OpenStack 的支持。事实上，Linux 是目前可用的最流行的桌面 Linux 发行版。


    它最初基于 `Debian sid`（通常被称为不稳定发行版，因为缺乏稳定性）。虽然 `Debian sid` 是不稳定的，但 Ubuntu 的构建是有刻意的，避免了在
    `sid` 或其他类似项目中犯的错误。通过这样做，它创建了基于网络的架构、错误报告机制和专业的创建环境。


    这种特定形式的 Linux 默认使用 `GNOME`、`Firefox` 和 `LibreOffice`，全都是最新的，并利用定期、可预测的支持更新。最终，这个创建是一个良好的操作系统，还包含一个为从
    Windows 迁移的用户提供的助手、对最新技术的支持，并且兼容 ATI 和 NVIDIA 显卡。


    **难度评分：** 适合新手

    **长期支持：** 每 6 个月定期更新的发行版，并带有长期支持版本。


    **优点：**

    * 在固定周期和支持期内定期更新

    * 长期支持变体提供 5 年的安全更新

    * 对初学者友好

    * 使用广泛，意味着在线上有大量的建议、意见和支持


    **缺点：**

    * 与 Debian 不兼容

    * 定期更新通常伴随着重大变化，这可能让某些人感到困扰

    * 非 LTS 版本只有 9 个月的安全支持


