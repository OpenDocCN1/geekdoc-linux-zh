- fmt: "\n- **Transport layer (TCP)**: Next is the `TCP` segment—this provides the\
    \ data transport from end to end and also manages the flow. It is independent\
    \ of the data that is being transported.\n- **Internet layer (Packet)**: This\
    \ is done on the internet layer of things. It is the part that routes data across\
    \ the appropriate networks in order to ensure that they arrive at the proper final\
    \ destination through the use of `IP` addresses and routing tables.\n- **Data\
    \ link layer (Frame)**: This layer controls and facilitates the direct connections\
    \ that occur between hardware within a single physical network. It uses `MAC`\
    \ (Media Access Control) address within `NICs` (Network Interface Cards) in order\
    \ to recognize any devices that are connected to the network. It is only able\
    \ to interact with other devices and hosts that share a network together.\n- **Physical\
    \ layer (Bits)**: This is the layer consisting of `NICS` and a physical Ethernet\
    \ cable that allows for the connection between networks. The Ethernet cable is\
    \ what enables the bits to be transmitted.\n\n### IPv4\nThis refers to the Internet\
    \ Protocol Address version 4—it is your `IP` address. With the `IPv4`, you are\
    \ using the 4th protocol. Effectively, the `IPv4` address will be a 32-bit number\
    \ displayed in dotted decimal notation. You will see two primary components—the\
    \ network’s prefix and the host number. Every host sharing the same network will\
    \ also share the same network address. However, each host will also have its own\
    \ part of the number that is unique. If the device is accessing the internet and\
    \ is visible to those outside of the network, it must contain a globally unique\
    \ number.\n\n### TCP\nStanding for the transmission control protocol, this is\
    \ one of the main protocols of the internet protocol suite. It was designed to\
    \ create a standard that allows everyone to establish and maintain a network conversation\
    \ because everyone is using data that is compatible. It allows for the exchange\
    \ of data in the form of packets.\n\n### UDP\nReferring to the User Datagram Protocol,\
    \ this is an alternate communications protocol to the `TCP` model discussed above.\
    \ The `UDP` is used to establish low-latency and loss-tolerant connections to\
    \ allow for high speeds and low risk.\n\n### Routing\nNow, at this point, you\
    \ may be considering turning your Linux server into a router—this is a valid point,\
    \ and several people do it. In order to do this, you must first do a configuration\
    \ of the router, and then you must assign the address necessary.\n\n### Linux\
    \ as a Router\nFirst, you must configure the device. This will require you to\
    \ set an `IP` address on two devices first, making sure that they each use the\
    \ same gateway `IP`. Now, what you want to do is set your network to accommodate\
    \ that gateway `IP`. To do this, you must first login to the root account, and\
    \ then run the command:\n\n```bash\nnmtui\n```\n\nNext, choose the option to Edit\
    \ a connection and hit the Enter key. Choose the available Ethernet that is present\
    \ on the leftmost side of the window and select Edit on the right, once again\
    \ pressing Enter. At this stage, you will have the opportunity to set your `IPv4`\
    \ configuration to manual. Then, you need to enter the `IP` addresses that you\
    \ wish to have access to the network. You can add more if you need to. Select\
    \ Quit and then press Enter. At this point, you should restart the network, and\
    \ you will need to then confirm that the changes took. In order to do this, you\
    \ will enter the command:\n\n```bash\nip addr\n```\n\nYou should then be able\
    \ to see the systems that can access the gateway without accessing the other network.\
    \ You can confirm this with a `ping` command. The ping should come back as the\
    \ destination host unreachable.\n\n### Ifconfig command\n`ifconfig` is a CLI designed\
    \ for network interface configuration. Beyond just that, it also serves to initialize\
    \ interfaces during boot up. When the server is actively running, `ifconfig` can\
    \ further be used to assign `IP` Addresses to interfaces, as well as enabling\
    \ or disabling any interaces on demand. This command will also allow you to view\
    \ the status `IP`, any hardware and `MAC` addresses connected, and the maximum\
    \ transmission unit (MTU) for all active interfaces. Overall, this system command\
    \ is designed to allow you to debug or to tune the system.\n\n### DNS settings\n\
    If you find that your `DNS` settings are misconfigured or you need to change them\
    \ in some way, there is a simple enough process for this. You will do so by adding\
    \ name servers to your configuration file. Within most Linux systems, the `DNS`\
    \ will create names defined within the `/etc/resolv.conf` file. This file will\
    \ usually contain at least one `nameserver` line. That line will be the defining\
    \ line for the `DNS` server. The name servers will be prioritized by the order\
    \ that they are found within the system. For ease of access, use the `IP` addresses\
    \ of the servers you will be using. To manage this, you will need to open the\
    \ `resolv.conf` file with some sort of editor program, such as `nano`. In doing\
    \ so, you will be able to make the changes. If `nano` is not yet in use on your\
    \ system, try the following command to install it:\n\n```bash\n$ sudo nano /etc/resolve.conf\n\
    ```\n\nYou should then have access to add lines for the name servers you are using.\
    \ Most often, you will want the one that will be housing any cloud servers you\
    \ have. With the line renamed, you can then save the file. Of course, as with\
    \ after any major change, check the `ping` to ensure that the domain settings\
    \ took and confirm that you are, in fact, using the specified `IP` address. If\
    \ you have gotten a message at this point that says that your host was unknown,\
    \ you may need to try resetting the `IP` address one more time, as there may be\
    \ an error within the one that you set up.\n\n### /etc/hosts\nThis command will\
    \ allow you to configure the `DNS` locally instead of using external `IP` addresses.\
    \ When you use the `/etc/hosts` command, you will ensure that the naming structure\
    \ is right. It will allow you to manually enter in the `IP` address and hosts\
    \ of your choice to confirm that you are able to get the domain name you were\
    \ looking for.\n\n### Diagnostic commands\n- `ping`: This is how connectivity\
    \ is tested. Standing for Packet Internet Groper, `ping` is regularly used to\
    \ identify that connectivity between either `LAN` or `WAN`. It will make use of\
    \ `ICMP` in order to communicate with other nodes on the network.\n- `traceroute`:\
    \ This is a CLI that allows for the tracing of the entire path from a local system\
    \ to a separate system on another network. It will record the number of hops between\
    \ router `IP`s that will have to occur to reach the server necessary.\n- `tracepath`:\
    \ This command allows for the path to be traced to the destination discovering\
    \ MTU. It will utilize a `UDP` port. Similar to `traceroute`, but this particular\
    \ form of tracing does not require the same superuser privileges because it has\
    \ no real options. It is simply informational and will provide all the necessary\
    \ information.\n- `netstat`: This CLI is used to display the information you need\
    \ to know about your network connections, any routing tables, statistics, and\
    \ more that will be important to understand with your networking system. It is\
    \ also used to debug and check to determine which programs are on which ports.\n\
    \n### Chapter 7 Quiz\nCongratulations! You have finished Chapter 7! You should\
    \ now have a general idea of how networking on your Linux machine will work and\
    \ key features that you will encounter. As with previous chapters, it is time\
    \ for your 5 question quiz. This will help ensure that you understand what has\
    \ been presented within this chapter.\n\n1. What is a network?\n    1. A group\
    \ of people that you know\n    2. A group of devices that are connected together\n\
    \    3. A group of software that communicates with each other\n    4. A group\
    \ of neighbors that all share the same internet provider\n2. What is WAN?\n  \
    \  1. The internet\n    2. Wide area network\n    3. Widely accessible network\n\
    \    4. Wonderful access network\n3. What happens if the hub of a network goes\
    \ out?\n    1. The whole network stops working\n    2. Half of the network stops\
    \ working\n    3. Only the hub stops working\n"
