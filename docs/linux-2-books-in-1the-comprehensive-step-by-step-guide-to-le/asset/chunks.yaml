    # 信息安全：CIA 三要素


    正如前文提到的，网络安全的元素之一就是信息安全。这一特定元素如此重要，以至于有专门的章节来讨论。在信息安全领域，有一个概念被称为 `CIA` 三要素。这三个要素分别代表机密性（Confidentiality）、完整性（Integrity）和可用性（Availability），它们构成了网络安全方面的使命宣言。


    ![](img/rsrc38Y.jpg)


    三要素模型的三个方面都至关重要：受保护的信息必须是机密的、可访问的，并保持完整性。如果没有实现这三个目标之一，信息安全就没有完全实现。这些是信息安全的基础，并将始终是核心目标。


    ## 机密性

    这是保护信息免受任何形式未经授权访问的能力。当信息是机密时，未经授权的人无法访问它。例如，当你去医生诊所时，你的病史是机密的，除非你签署了授权放单。在医疗环境中，这些信息受到安全措施和行为准则的重重保护，以防止你的敏感医疗信息广为人知。在信息安全方面，受保护的信息将仅供授权用户访问，未经授权的用户在提供正确凭据时会被自动拒绝。例如，考虑一个信信局，它可以访问你的所有个人信息，从社会安全号码到你任何信用额度的账户和账号账号——如果他们的数据不安全，你将面临身份盗窃的风险。


    ## 完整性

    当信息以准确且一致的方式保存时，就实现了完整性。这意味着在没有对材料进行任何预先授权更改的情况下，其预期的和原始结构得到了维护。虽然用户疏忽使用不当或发生错误时信息可能会发生变化，但只要信息在存储、传输给请求者以及使用过程中未被修改（除非有人主动且意识地更改它），完整性就能得以维持。这意味着数据是准确并保持不变的。


    例如，想象一下你在去买新电脑之前检查了银行账户，因为你想确保你的直接存款支票确实到账了。如果你的银行 App 没有正常更新，或者没有反映出你确实收到了工资，你会认为自己无法购买那台笔记本电脑或其他任何需要的物品。


    ## 可用性

    最后一个目标是可用性，是指信息在任何时间、任何地点需要时都能随时获取。由于信息通常受到保护，它并不是对所有人开放的，但必须对拥有正确凭据的人可用。这应该尽可能地保持——在数据至关重要的情况下，如果没有随时访问，数据保护并不算是有用的。例如，想象你的医疗记录正受到保护。如果医生无法根据需要访问你的医疗记录，你将无法获得适当的治疗。


    # 第 10 章：网络简介


    随着互联网的广泛使用，网络也应运而生。人们很容易认为你通过互联网发送的信息或请求在发射到卫星后会立即出现，特别是当你使用 `router` 进行无线家庭连接时，但实际发生的是，你发送的数据通过电线传输，以使你请求的信息返回给你，且速度极快。这就是网络的创建过程，无论你是否考虑过它，它都是当今万物中的巨大组成部分，你可能每天都会使用网络几次。无论你是检查银行账户，还是使用借记卡或信用卡购买物品，你都在通过网络发送信息。


    ![](img/rsrc38Z.jpg)


    ## 什么是网络？

    简单来说，网络是两或多台计算机以某种方式连接在一起，以便共享信息或进行交互。计算机并不一定通过电线连接——它们可以通过红外束、无线电波或卫星传输，甚至可以通过电线连接。然而，它们始终以某种方式连接着。


    在某些情况下，网络是计划用途的正确选择。例如，想象你有两台电脑（一台笔记本和一台台式机）、一台平板电脑和一个手机。你经常在家里使用这四件物品，并希望确保笔记本电脑上的数据（你主要用它访问浏览互联网或回复邮件）在性能更强的台式电脑上可用，台式电脑可能预留给更密集的程序，如玩游戏或编辑大型文件或视频。此外，为了方便起见，你还希望确保用手机随手拍摄的照片也能从其他源访问。当你需要这种可以在任何地方访问所有文件的连接性时，你正在寻找一种网络连接。通过获得该网络连接，你可以轻松地共享这些文件。


    当然，网络在其他情况下也变得至关重要。例如，如果你在学校工作，你可能对计算机实验室熟悉。在这些实验室里，学生可以从任何计算机输入登录信息来调同一个账户。老师也可以提交自己的信息，从该网络上的任何计算机上登录，只要他们使用正确的密码和用户名即可。


    ## 网络类型

    网络本身有几种不同的形式。这些网络用于任何涉及信息传输的方面，无论是打印文档还是发送电子邮件。重要的是，在讨论网络时，你主要是在讨论两种不同网络类型中的一种，尽管根据目的不同还有其他几种。最常讨论的两种是
    `LAN` 和 `WAN`，`VPN` 紧随其后。这三种类型的网络有它们特定的用用场景。本节将为你简要概述 `LAN`、`WAN` 和 `VPN`，尽管你会发现
    `VPN` 在随后的章节中会进行更深入的讨论。


    ### LAN

    在现代理解中，最常见的网络是 `LAN`。这种网络类型被称为局域网（Local Area Network）——它在小型或局部区域内将计算机和低电压设备相互连接。这可能是在单栋建筑内，甚至是几栋需要共享信息的建筑之间。通过使用
    `router`，`LAN` 可以与 `WAN` 交互，以便快速、安全地传输数据。如果你要在家里建立一个个人网络，它很可能是一个 `LAN`，特别是如果有超过一个人共享它。


    ### WAN

    `WAN` 代表广域网（Wide Area Network），允许计算机从更远的距离进行连接。这意味着计算机即使相隔很远，也能通过某种手段相互连接。这可以在较小规模上实现，例如一个互联网提供商（ISP）连接到几个不同的
    `LAN`，将它们串联成一个连贯的整体。另一种广为人知的 `WAN` 类型是互联网。互联网允许全球范围内的计算机进行连接。


    ### VPN

    `VPN` 代表虚拟专用网络（Virtual Private Network）。它是一种扩展到互联网上的网络，就好像你在访问一个其他人无法访问的私有网络，尽管是通过互联网。这些也可以通过远程实现，即使用虚拟对点连接，在这种连接中，私有站点和远程站点可以相互访问。它们通过私有网络路由到互联网，以传输敏感信息并确保其安全。通常，这是通过加密数据来实现的——使得不该拥有权限的人无法轻易读取。


    ## 网络地址

    网络地址是网络内部节点和主机能够被识别的方式。就像你的房子有一个地址，允许邮信无论在何处都能准确送达你的地址一样，你的计算机也有它自己的地址。通过向你的特定地址发送内容，即使是位于地球另一端的人也可以与你联系。通过向你的特定地址发送内容，你能够轻松地共享这些文件。


    网络地址是网络内部节点和主机能够被识别的方式。就像你的房子有一个地址，允许邮信无论在何处都能准确送达你的地址一样，你的计算机也有它自己的地址。通过向你的特定地址发送内容，即使是位于地球另一端的人也可以与你联系。通过向你的特定地址发送内容，你能够轻松地共享这些文件。


    当然，网络在其他情况下也变得至关重要。例如，如果你在学校工作，你可能对计算机实验室熟悉。在这些实验室里，学生可以从任何计算机输入登录信息来调同一个账户。老师也可以提交自己的信息，从该网络上的任何计算机上登录，只要他们使用正确的密码和用户名即可。


