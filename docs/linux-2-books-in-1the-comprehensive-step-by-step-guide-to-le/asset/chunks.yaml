    # 第 3 章：安装 Linux


    此时，你应该准备好安装 Linux 了。然而，你还有另一个决策要做出。你是准备在虚拟机上安装你的发行版，还是在物理硬件上运行它？即使你选择安装在硬件上，你是想将其作为主操作系统运行，还是为你选择的发行版创建一个分区？


    如果你是刚接触操作系统的初学者，这可能看起来令人敬畏，但请尽量不要担心。本章将引导你了解在设备上安装 Linux 的基础知识。当你能够在单台机器上加载多个不同的操作系统时，你就可以在它们之间切换。这意味着你可以通过选择恰好能完成你任何所需软件，充分利用你计算机可能提供的所有功能。


    然而，你将从本章获得关于什么是虚拟机以及为什么你可能选择使用它们的坚实基础。你将在指导你如何通过 USB 驱动器一步一步地在你的物理计算机上安装 Linux。然后，你将在指导你如何在运行
    Windows 的机器上创建一个虚拟机，允许你能够在虚拟机内部有效地运行 Linux 实例。最后，你将在指导你如何在当前运行 macOS 的计算机在虚拟机上安装
    Linux。到本章结束时，你应该对在自己的设备上安装 Linux 的想法感到自在，无论你是选择安装在物理机器本身，还是更倾向于在你选择的操作系统中运行虚拟机。


    ## 什么是虚拟机？


    虚拟机是你计算机上的一个应用程序，它允许你在其中运行一个操作系统的实例。这允许你在有效地运行你特定机器的原生操作系统的同时，在桌面的一个窗口内完全使用另一个操作系统。虚拟机并不是
    Linux 特有的——你可以在 Windows 或 Linux 设备上运行 macOS 虚拟机，可以在 macOS 或 Linux 设备上运行 Windows，或者在
    Windows 或 macOS 设备上运行 Linux。


    实际上，当使用虚拟机时，你运行的程序功能就像是一台独立于其运行设备的单独计算机。该应用程序创建了运行甚至是虚拟硬件设备的能力。这意味着你的计算机认为它正运行在它自己的独立计算机上，监控着自己的进程并使用虚拟硬件。


    与尝试在计算机上运行两个操作系统（这需要划分分区）不同，虚拟机创建的是一个虚拟硬盘。这是一个存储在你实际硬盘上的文件——这个大大文件（通常有几个 GB 大）会以硬盘的形式呈现给虚拟机，允许你跳过创建任何类型的分区或任何可能使硬盘变得复杂的步骤。但请记住，虽然虚拟机非常适合为你创建你使用的操作系统虚拟实例，但它明显比运行真正的操作系统要慢。由于支持虚拟机需要额外的步骤，它确实需要更多的处理能力。这意味着，虚拟机很可能不是你玩任何类型游戏的最佳方式。


    然而，这一个巨大的优点是，你可以安装多少个虚拟机的限制仅限于你可用的物理硬盘空间大小。如果你有足够的空间，你可以继续添加多个其他操作系统的安装。但是，你必须记住，这些安装中的每一个都至少会占用你硬盘内的几个
    GB 空间。你也可以选择同时运行多个虚拟机，但同样，你会发现上限是你的物理硬件。你的每个虚拟机都需要访问你的部分处理器、内存（RAM）和其他资源，这意味着你在任何给定时间越积极尝试使用资源越多，运行速度就可能越慢。


    人们可能选择运行虚拟机的有几个原因。对于某些人来说，这可能只是为了好玩。如果你对计算机及其工作原理特别感兴趣，你可能会选择使用虚拟机在那些你没有作为主操作系统运行的其他操作系统上玩玩。这意味着你可以在决定是否真的想物理安装它之前对新操作系统进行尝试，例如，在选择你倾向于使用的哪一个之前，玩玩几个不同的
    Linux 发行版。


    其他人可能发现，他们有时会有非常特定的需求，需要一个仅在特定操作系统上提供的限制程序。例如，如果你正在运行 Linux，但需要一个主要包含在 Windows
    XP 中的应用程序，你可以选择在虚拟机上运行 Windows XP 以使用该特定程序。


    人们使用虚拟机的另一个常见原因是虚拟机是沙箱化的。这意味着所有内容都包含在虚拟机内部，因此你在虚拟机内部可以做的任何事情都不会让你系统的其他部分面临风险。就像沙箱及其包含它的边界一样，虚拟机完全隔离在硬盘中，不会受到你在内部选择执行的任何操作的影响。这意味着你可以在安全空间内测试正在开发的程序程序，而不必担心整个系统崩溃可能导致的后果。


    ![](img/rsrc38G.jpg)


    ## 在物理硬件上安装 Linux


    然而，在担心虚拟机之前，你将首先学习如何在物理硬件上安装 Linux。在使用此过程时，你正在创建一个在计算机上将 Linux 安装为独立分区的选项。这意味着你的机器上将有两个（或更多）操作系统。这个过程将逐步向你介绍。


    ### 步骤 1：下载 Linux 发行版


    你在上一章中选出你的发行版了吗？如果是，这就是你要搜索的内容。如果你还没有决定倾向于使用哪一个，你需要花时间做出决定。如果你正在读这本书，你很可能是 Linux
    整体方面的新手，正因如此，你会发现使用轻量级且更用户友好的发行版会更有帮助，例如 `Ubuntu` 或 `Linux Mint`。当然，如果你愿意，也可以选择挑战自我，尝试一些更深性的东西。在开始之前，还要确保你有一个可以用于安装的
    CD 或 USB 驱动器。由于 CD 驱动器在许多消费级产品中已过时，USB 可能是任何计算机最容易获取的形式。


    一旦你选择了将要使用的发行版，就必须下载它。你可以在发行版网站上免费下载 `ISO` 格式。这是一个存档文件，包含了与光盘上数据相同的数据，是分发 Linux
    最常见的格式。这个相同的副本被称为镜像（image），也就是你想要复制以安装软件的内容。


    1. 在发行版网站上下载你选择的 Linux 发行版的 `ISO`。

    2. 使用 `Rufus` 等程序准备 `USB` 使其变为可启动状态。

    3. 安装一个镜像刻录程序，如 `Pen Drive Linux` 或 `UNetBootin`。

    4. 将镜像加载到格式化后的 `USB` 中。


    '
- fmt: "\n## Step 2: Booting into the live USB\nNow, you are tasked with loading into\
    \ the live USB in the first place. Most computers will set to boot, starting with\
    \ the hard drive, so you will need to make some changes to the default booting\
    \ order before it makes the necessary changes. This process is not as intimidating\
    \ as it sounds—all you need to do is reboot the computer, enter the boot menu,\
    \ and choose the source that you would like your computer to boot from.\n\nSometimes,\
    \ the boot menu is hidden from view, but it is still accessible. In these situations,\
    \ you will need to access the `BIOS` menu in order to gain access to the boot\
    \ menu, which can be done at the splash screen. The command necessary to load\
    \ into the `BIOS` menu should be displayed in one of the bottom corners on the\
    \ splash screen.\n\n1. Reboot the computer\n2. As the computer reboots, press\
    \ the key to trigger the boot menu. You should see the necessary key in the corner\
    \ of the splash screen—the screen where the manufacturer’s logo is displayed during\
    \ the initial startup. Common keys to access the boot menu are `F12` or `Del`.\n\
    \    - If you are using `Windows 8`, try holding the `Shift` key while clicking\
    \ restart. This triggers the computer to boot with the `Advanced Startup Options`,\
    \ allowing you to make the decision.\n3. When in the boot menu, select the live\
    \ USB or `CD` that you are using to load up Linux. Upon choosing your method,\
    \ save and exit the boot menu or `BIOS`. Your machine should continue with the\
    \ booting process with your selected settings.\n\n## Step 3: Try Linux before\
    \ installing (optional)\nTrying the version of Linux that you are in the process\
    \ of installing is optional, but strongly recommended if you are not yet familiar\
    \ with Linux or you are unsure which version to install. Your live USB should\
    \ allow you to launch what is referred to as a live environment, allowing you\
    \ to test it prior to making any sort of changes. While you will be unable to\
    \ create files during this stage, you will be free to navigate the system and\
    \ experience the interface to make an informed decision before spending the time\
    \ to install and format.\n\n## Step 4: Starting installation\nThe installation\
    \ process itself is quite simple. From the boot menu, you will have the option\
    \ to install rather than launch. At this point, your machine will handle the bulk\
    \ of the work, but you will be prompted to configure basic options, such as the\
    \ language that you will be using with the `OS`, the keyboard layout, and the\
    \ time zone you are in.\n\n## Step 5: Creating a user\nAt this point, you will\
    \ be prompted to create the login information for your `OS`. You will insert your\
    \ name, your computer’s name, the username that you are choosing for this instance,\
    \ and a password for logging in and confirming that you are authorized to perform\
    \ any administrative tasks.\n\n## Step 6: Creating the partition (optional)\n\
    If Linux is your primary `OS`, you can skip this step. However, if you are running\
    \ multiple operating systems on your machine, you will need to separate out a\
    \ partition specifically for your version of Linux. The partition is the portion\
    \ that has been formatted in the way that the specific `OS` requires, allowing\
    \ for the `OS` to run as intended.\n\nSome more beginner-friendly distributions,\
    \ such as `Ubuntu`, will format the partition on their own, though you can adjust\
    \ the size manually. Keep in mind that most installations will need at least `20\
    \ GB`, so you must make sure that whatever partition you set will accommodate\
    \ the `OS` and any other files and programs that will be stored within it. Sometimes,\
    \ the installation process will not automatically configure the automatic partition,\
    \ and when this happens, you must make sure that the partition is in the format\
    \ `Ext4`.\n\n## Step 7: Booting Linux\nWhen the installation finishes, it will\
    \ automatically prompt you to reboot. Upon booting, you will see a different screen.\
    \ This will pull up the bootloader, which will prompt you to pick the distribution\
    \ you are installing. One of the more likely bootloaders that you will encounter\
    \ is `GNU GRUB`. Of course, if you have opted to skip the partition stage and\
    \ load your Linux distro as your only `OS`, you will likely not see this screen\
    \ automatically. As with before, you can trigger the bootloader by pressing the\
    \ `Shift` key immediately after the manufacturer splash screen loads.\n\n## Step\
    \ 8: Checking hardware\nWhile most hardware should be fine immediately after installation,\
    \ you may find that some of the hardware you are using will require you to download\
    \ some drivers. In particular, graphics cards are notorious for requiring extra\
    \ drivers. You can usually find some sort of open source driver to get the job\
    \ done, but if you want to really optimize your `GPU`, you will need to get the\
    \ proper drivers from the manufacturer.\n\n## Step 9: Using Linux\nAt this point,\
    \ your installation should be complete, and your hardware should be functioning.\
    \ At this point, you are ready to begin using your new `OS`. You may choose to\
    \ go download programs that will allow you to optimize your usage of the program,\
    \ or you can go on your way using it.\n\n## Installing Linux on Virtual Machines\
    \ on Windows 10\nSometimes, the method you will be using to install Linux will\
    \ utilize a virtual machine. In particular, you may choose to use a virtual machine\
    \ to sandbox software in order to ensure that you do not damage any of the files\
    \ on your primary `OS`. You may also wish to mess around in the operating system\
    \ a bit more before taking the plunge and installing it. Luckily, using a virtual\
    \ machine on Windows does not need to be difficult. 64-bit versions of `Windows\
    \ 10 Pro`, `Enterprise`, or `Education` already are preloaded with a proprietary\
    \ virtual machine known as `Hyper-V`, meaning that you will not need to go out\
    \ of your way to get more software. If you do not have `Hyper-V` already, you\
    \ will need to find a `VM` program. A free option that you can use is `Oracle\
    \ VM VirtualBox`.\n\n### Step 1: Installing the virtual machine\nStart by verifying\
    \ that you already have a virtual machine installed. Do this by searching for\
    \ “Hyper-V” on your computer under Windows features. You should see boxes on the\
    \ left-hand side. When you check those boxes next to the files, you are turning\
    \ files on and off. Click to enable `Hyper-V` if you can find it on your computer.\
    \ Upon installation, you will need to reboot. If you do not have `Hyper-V`, search\
    \ for another `VM` program that you seem to like online and install it.\n\n###\
    \ Step 2: Setting up the virtual machine\nAt this stage, you must make sure that\
    \ you have enough hard drive space available for the `OS` and files of your choice,\
    \ and you will need the `ISO` file you intend to use. As in the previous version,\
    \ the `ISO` can be downloaded from the distributor.\n\nIf you are using `Hyper-V`,\
    \ searching for `Hyper-V Quick Create` will give you a sort of shortcut to ensuring\
    \ that everything is set up as necessary. All you will need to do is follow the\
    \ prompts on the screen within the program, selecting your `ISO` file if you do\
    \ not wish to use one of the provided ones.\n\nWithout `Hyper-V`, you will find\
    \ the process to be slightly less streamlined, but still quite manageable overall.\
    \ Most virtualization software will be quite similar—it will be a matter of preference\
    \ and availability to determine which you prefer.\n\n1. Upon launching `VirtualBox`,\
    \ you will see an empty menu. From there, you will need to click on the `NEW`\
    \ icon in the top left of the program’s window. You will then name the `VM` and\
    \ then select which kind of `OS` you will be using.\n2. Next, you need to allocate\
    \ memory to the `VM`, providing it with the necessary resources. Typically, the\
    \ best bet is to going be to take the recommended amount and then click next.\n\
    3. The next prompt you will see will ask if you want to add a virtual drive. Agree\
    \ to this, click `Create`, and select `VDI` on the list. `VDI` stands for the\
    \ virtual disk image. Choose the `Fixed Size` option on the next page. At the\
    \ end, you will be asked to name the drive you are using and then confirm the\
    \ size.\n4. Click `create`, and the virtual drive has been created.\n"
