  trans: "\n\n*   `Kernel initrd`: 初始内存磁盘——允许引导程序加载内存磁盘初始能力。\n*   `Vmlinux`: 基于 ELF（可执行和链接格式）的文件，是用于调试的内核镜像的未压缩版本。\n\
    *   `GRUB file`: 引导程序包。\n*   `/dev`: 这些是必需的设备文件。它们可能包括终端设备、连接到系统的设备或 USB 设备。\n\
    *   `/etc`: 这些文件是主机特定的，但仍是系统范围内的配置文件。你将在此部分找到你所有程序的各种配置文件，以及启动或结束程序所需的启动和关闭 shell\
    \ 脚本。\n*   `/home`: 这是你找到个人设置、你保存的文件以及主目录的地方。如果你下载并保存了它们，它们就会在这里。它们很可能会以你的个人资料或计算机命名的格式保存，类似于\
    \ `/home/NAMEHERE`。\n*   `/lib`: 这是你在 `/bin/` 和 `/sbin/` 中保存的二进制文件所需的任何库的所在地。\n\
    *   `/media`: 这是你找到可移动介质挂载点的地方。通常情况下，你会在这里看到挂载格式的名称，例如如果你插入了 CD，则为 `/media/cdrom`；如果是\
    \ USB 驱动器，则为 `/media/usb-drive`。\n*   `/mnt`: 指临时挂载的文件。在此目录下，系统管理员可以挂载临时文件系统。\n\
    *   `/opt`: 指可选应用程序软件。这些文件将存放附加应用程序，它们应该位于 `/opt` 或 `/opt` 下的某个子目录下。\n*   `/proc`:\
    \ 一个用于存放进程和内核信息的虚拟系统。通常情况下，它由系统自动生成，包含关于当前运行进程的信息。\n*   `/sbin`: 这是另一个二进制可执行文件，但\
    \ `/sbin` 文件通常用于系统管理员的维护目的。\n*   `/srv`: 代表“service”（服务），`/srv` 保存与服务器特定功能或服务相关的数据。\n\
    *   `/tmp`: 这些是临时文件，系统最终关闭和重启时很可能不会保留。通常，这些文件的大小也有限制。\n*   `/usr`: 这是只读用户数据的次级层次结构。它将包含大多数用户工具和应用程序。它充满了许多不同的文件，例如：\n\
    \    *   `/usr/bin`: 用户程序的二进制文件\n    *   `/usr/sbin`: 系统管理员的二进制文件\n    *   `/usr/lib`:\
    \ 用于 `/usr/bin` 或 `/usr/sbin` 的库\n    *   `/usr/local`: 从源码安装的程序\n    *   `/usr/src`:\
    \ Linux 内核源码\n\n# Linux 进程架构\n\n进程架构是指在计算中将任何输入转换为输出时，规定进程和系统层次结构的设计。虽然这听起来一眼很难理解，但希望本小节能帮助你轻松地完成这一过程。\n\
    \n## 进程架构的用途\nLinux 内核内部有几个子系统，其中最重要的的是进程调度器。进程调度器的目的是控制对 CPU 的任何访问，无论这种访问是通过用户进程还是来自另一个内核子系统进行的。所有这些都由进程调度器完成，进程调度器由于与计算机的其余部分交互，本身可以被分为四个不同的模块。\n\
    \n## Linux 进程\n向 Linux 发出的命令会触发进程。当你向 Linux 输入一条命令时，一个新进程就启动了。该进程被分配一个 5 位的 ID，允许操作系统跟踪进程——这被称为\
    \ `pid`（进程 ID）。虽然 `pids` 可能会被回收利用，但由于 `pids` 是 Linux 能够跟踪进程的初始途径，因此没有两个进程会同时同一个\
    \ `pid`。\n\n该进程以两种方式之一运行：在前台或在后台。在 във台（进程默认在此处启动）时，你可以向键盘输入内容，并在屏幕上获得输出。然而，当这些进程在前台运行时，你无法无法完成其他进程。由于这个原因，有时进程会被引导到后台进程中，它们在后台运行，无法访问键盘输入，直到需要该输入为止。在后台运行的同时，可以同时处理其他进程，这意味着你可以进行多任务处理，直到需要输入更多数据为止。\n\
    \n进程以三种不同类型之一身份运行：父进程和子进程、僵进程和孤儿进程，或守护进程。每种不同类型的进程功能略有不同。\n\n*   **父进程和子进程**：当一个进程创建另一个进程时发生。被创建的进程被称为子进程，而父进程是触发第二个进程的进程。\n\
    *   **僵进程和孤儿进程**：子进程在完成功能后变为终止，`SIGCHLD`（从接口到父进程的信号）会通知父进程子进程已终止。然而，有时父进程在子进程终止之前就终止了，导致了子进程变成孤儿进程的情况。父进程在进程表中仍有条目，但不工作了。\n\
    *   **守护进程**：这些进程与系统相关并在后台运行，通常以 `root` 权限运行，并等待与其协作的进程。\n\n## 进程调度模块\n进程调度由四个模块组成，它们共同工作组织进程。这些模块是：\n\
    \n*   **调度策略模块**：该模块判断哪些进程被授予 CPU 权限，为所有进程提供公平的访问。\n*   **特定架构模块**：这实际上是几个模块——它们设计用于共享一个接口，允许对任何计算机架构的细节进行抽象。它们的目的是与\
    \ CPU 通信，通过了解需要保留哪些信息来挂起或恢复进程，并执行直接与进程被挂起或恢复相关的汇编代码。\n*   **体系无关模块**：该模块是这一切的核心——它首先与策略模块通信以决定下一个运行哪个进程，然后任务给特定架构调度器以恢复正确的进程。然后它与内存管理器交互，以确保有足够的内存硬件供进程有效运行。\n\
    *   **系统调用接口模块**：该模块允许用户进程仅访问内核意图并显式导出的资源。这调节了用户内存和内核内存之间的划分。\n\n如下图所示，体系无关模块是整个过程的核心，并直接与每个其他模块交互，允许整个过程以一种实际上可行的方式协同运行。调度器本质上管理着这一切，并为每个进程设置一个条目。整个图表包含了所谓的进程调度器。\n\
    \n![](img/rsrc38D.jpg)\n\n# 第一章测验\n恭喜你！你完成了第一章。尝试回答这些问题，以确保在继续之前理解了基础知识。答案页将在此测验之后的页面上。\n\
    \n1. 什么是操作系统？\n    1. 操作系统的人或人\n    2. 控制硬件的程序\n    3. 控制软件的程序\n    4. 控制硬件和软件的程序\n\
    \    5. 以上所有\n    6. 以上都不是\n\n2. 为什么你需要将内核空间与用户空间分开？\n    1. 因为你不想让用户空间耗内存\n \
    \   2. 因为你不想让操作系统没有空间\n\n"
