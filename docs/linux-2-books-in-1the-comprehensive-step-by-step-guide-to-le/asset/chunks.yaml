    3. 判断对错：Unix 出现在 Linux 之后。

    4. 判断对错：Linux 是用 Python 构建的。

    5. 一个 pid 可以被重复使用多少次？

    1. 永远不会——它只能被使用一次

    2. 几次——只要没有两个进程同时共享同一个 pid 即可

