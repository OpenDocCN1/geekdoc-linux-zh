  trans: "\n\n这里的论点并不是让你完全放弃 shell（终端）——shell 绝对有自己的用途。然而，shell 在某些方面也确实薄弱。想一下，如果能用更简单的方式来处理你的几项任务该有多么好——拥有一种更符合逻辑的语法和命令，而不是仅仅因为你“现在应该记住它们”才去死记它们。\n\
    \n当然，在某些领域，`bash` 无疑更简单。这正是你应该将两者结合起来的原因。当它们结合在一起时，它们能够取长补短——得益于一个能够在两者之间轻松切换的系统，你将拥有的两者的优点。`Python`\
    \ 在多个不同的语文中更完整、更易用，而 `bash` 则是针对 Linux 设计的。不可否认，`bash` 的某些部分用起来确实更好。例如，考虑在 `bash`\
    \ 中将文件从桌面移动到目录：\n\n```bash\ncd Desktop\nmv folder directory\n```\n\n注意看它是多么简洁整洁。现在，在\
    \ `Python` 中，它看起来更像这样：\n\n```python\nimport os glob\nfor fname in glob.glob('folder'):\n\
    \    os.rename(fname, 'directory')\n```\n\n不可否认，`Python` 的代码是不必要的臃肿，尤其是与 `bash`\
    \ 那段短小精悍的语句相比时。这正是为什么最好的方法是将两者结合使用，而不是尝试将它们解离开并替换其中一个。\n\n虽然我们已经讨论过你可以在 shell\
    \ 中引入 `Python` 代码，但反过来也是可以的——你可以在 shell 中引入 `Python` 脚本，也可以在 `Python` 中插入你的 shell\
    \ 脚本。你只需要导入 `OS` 模块。如果你这样做，你就可以在 `Python` 中使用你的 `bash` 命令——这意味着你实际上可以轻松地混合使用你的命令。想象一下那些在家里从小说两种语言的孩子，他们往往会在同一句话中无缝切换，在一种语言中插入几个单词，同时交替插入另一种语言的词，创造出听起来似乎无法理解的内容，但他们却做得轻松。这就是你通过在\
    \ `Python` 中插入 `bash` 所能做的事情。\n\n为了将 `bash` 语言带入 `python`，你只需要做：\n\n```bash\n\
    $ python\n>>> from os import *\n>>> system('sudo apt-get update')\n```\n\n现在你应该同时可以使用这两种语言了。你绝对应该尝试玩转这两种语言。如果你还不熟悉\
    \ `Python`，你可能会倾向于花精力学习它——它非常容易上手，如果你已经学会了与 Linux 通信，那么你应该也能学会理解 `Python`。你只需要将曾经投入开发\
    \ Linux 技能的精力也投入到学习这个系统中即可。你可能会发现，随着生产力的提高，你会很快喜欢这种变化。\n\n如果你不确定系统上是否安装了 `Python`，那么你走运了——要发现这一点，你需要输入以下命令：\n\
    \n```bash\n$ python --version\n```\n\n你很可能会得到一个较旧但稳定的 `Python` 版本，这足够了，但你可能想将其升级到更新的版本。这个版本在不断变化，所以最好在你读本书时检查一下可用的版本——你只需在网上搜索最新版本然后进行更新即可。\n\
    \n如果你决定专门学习 `Python`，你将想要寻找一些指南和书籍，就像你现在读的这一本一样，以找到你需要知道的内容。教程和网络课程始终是你开始尝试 `Python`\
    \ 的绝佳敲脚石。最终，随着你变得越来越自在和熟悉，你可能会决定开始尝试使用这两种语言。你甚至可能决定比起使用 shell 你更喜欢 `Python`，那也可以。\n\
    \n如果你想学习或提高关于 `Python` 编程语言的知识，我推荐我的书籍《Python》，你可以在这里下载：[Python: 2 Books in 1\
    \ - Python Programming + Python Machine Learning](https://www.amazon.com/Python-Programming-Comprehensive-Practices-Features-ebook/dp/B0834JSLW9/ref=sr_1_71?crid=YD02LWBDNF7F&keywords=python&qid=1580337773&s=digital-text&sprefix=pyt%2Caps%2C312&sr=1-71)\n\
    通过这本书，你将快速且有效地学习最常用的编程语言。\n\n归根结底，技术变化如此迅速，你无法负担因害怕改变、成长或转向新事物而束缚自己——过渡和学习对你绝对是有益的。\n\
    \n现在，随着本章和本书的结束，是你开始思考如何将这一切整合在一起的时候了。是时候考虑你是否真的对 Kali Linux 感兴趣，或者你是否更倾向于学习其他东西。然而，可以确定，最终你必须引导你自己和自己的决定，以确保你对所选择的内容感到满意。\n\
    \n## 结论\n\n恭喜你——你已经来到了《Kali Linux Hacking》的最后。这本书被设计为学习 Kali Linux 的速成课程——该操作系统专门为渗透测试专业人员设计，用于发现和修复系统内发现的各种弱点或漏洞。如果你已经读到了这里，你一定对安装\
    \ Kali Linux 非常感兴趣，或者你一直把这本书当作指南，无论哪种情况真实，感谢你与我一起走这段旅程。\n\n在书中，你获得了关于 Kali Linux\
    \ 的基础信息。再次提醒，Kali Linux 并不是面向初者的 Linux 发行版。如果你读了这本书并且在某些主题上完全迷茫，那没关系——但你可能最好从一本初级书籍开始，而不是一本为那些知道自己在做什么、并想做得更好、更多的人设计的书。\n\
    \n最终，你的下一步完全取决于你以及你认为你想做什么。你想在实际的 Kali Linux 发行版上进行练习吗？你可以投入必要的精力和精力安装你自己的副本，并开始使用和发现。如果你觉得\
    \ Kali Linux 不适合你，无论是因为它太难、太不同，还是仅仅因为你不知道自己在做什么，那么你可能从更简单的东西开始更好，比如 Ubuntu 和 Mint。\n\
    \n是的，这一点被强调了多次，因为它非常重要。即使在读完这本指南后，如果你对自己和自己的能力仍完全没有信心，那么暂时放弃 Kali Linux 来建立你的技能可能更好——这没关系。\n\
    \n也许到此时，你已经采纳了本书最后一章的建议，并决定也研究 `Python`，提高你的脚本编写能力，这样你就能更好地利用自己的命令。这也是一个非常棒的决定，并将为你的旅程提供指导，仅仅因为你将拥有更多的知识。\n\
