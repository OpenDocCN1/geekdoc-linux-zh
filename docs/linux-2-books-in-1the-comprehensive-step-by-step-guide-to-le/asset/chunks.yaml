    # Linux Mint


    Linux Mint 是一个基于 Ubuntu 的发行版。该发行版首次于 2006 年发布，就在 Ubuntu 发布仅两年后。这一特定版本由 Clement
    Lefebvre 创建，他是一位出生于法国的 IT 专家，创建时住在爱尔兰。他最初维护着一个为 Linux 新手提供帮助和指南的网站，在维护该网站期间，他想开发一个自己的
    Linux 发行版，以解决其他主流 Linux 版本中存在的几个缺点。


    尽管 Linux Mint 通常被称为“做对了的 Ubuntu”，但它不仅仅是换了新装的 Ubuntu——它包含了多种旨在增强 Linux Mint 体验的工具，这些工具通常以“mint”命名，例如
    `mintDesktop`、`mintMenu`、`mintUpdate` 等。mint 工具的设计更注重易用性，并极大地提高了操作简易性，得益于对用户友好的强调，使其成为最容易上手的
    Linux 版本之一。Linux Mint 最大的吸引之一在于，开发者随时准备并乐意实施有助于改进该程序的良好建议。


    **难度评分：** 适合初

    **长期支持：** 没有固定时间表，但会定期更新，特别是在每个 Ubuntu LTS 版本发布后不久。


    ### 优点

    - 专为操作系统设计的 `mint` 工具

    - 用户友好

    - 包含多媒体解码器

    - 对用户的请求和建议开放态度


    ### 缺点

    - 无安全公告

    - 更新频率不可预测


    # MX Linux


    MX Linux 有一段历史。它最初被称为 MEPIS Linux，是一种基于 Debian 的发行版，旨在用于个人和专业桌面电脑，在创建时就拥有多项尖端功能。然而，尽管拥有这些尖端特性，MEPIS
    Linux 最终被停止了。但它的用户并没有因此气馁。将 MEPIS 与另一个名为 `antiX` 的基于 Debian 的发行版合并，形成了现在被称为 MX
    Linux。


    它基于 `Debian` 的稳定分支，主要组件来自 `antiX` 和 `MEpis` 社区。特别是，它利用了 `Xfce` 桌面，并配合侧侧的垂直面板，而不是大多数计算机底部常见的水平控制面板。总体而言，该发行版被认为提供了许多偶尔更新的现代应用程序，同时拥有稳定的基础，允许在创建良好、可靠性能的同时，而不会丧失人们最需要的特性。


    特别是，MX Linux 以其 `MX-Tools` 闻名——这是一系列图形化管理实用程序，允许快速访问多种功能，例如管理系统上的用户账户、安装解码器以及使用和安装软件包。


    **难度评分：** 适合初级

    **长期支持：** 通过 backports 提供偶尔更新


    ### 优点

    - 对显卡驱动、解码器和浏览器插件的即时支持允许开箱即用的近瞬时启动

    - 稳定

    - 定期更新

    - 功能方便


    ### 缺点

    - 外观简单且过时

    - 安装程序和其他配置工具可能需要时间来适应


    # openSUSE


    openSUSE 的历史可以追溯到 1992 年，它是由四位德国 Linux 爱好者创立而诞生的。Thomas Fehr、Roland Dyroff、Hubert
    Mantel 和 Burchard Steinbild 最初销售带有德语版的 `Slackware` 软盘，但很快创建了自己的程序：`SuSE`（Software
    und System Entwicklung，意为软件和系统开发）。1996 年，`SuSE Linux` 成为了自己的发行版，随着时间的推移，越来越多的功能被采用，例如
    `RPM` 软件包管理工具、专为易用性设计的图形化系统管理工具等。


    他们频繁发布，保持着极好的文档，并使产品易于获取，`SuSE Linux` 变得越来越流行。2003 年，它被 `Novell, INC` 收购，并于 2010
    年转交给 `Attachmate`。所有权的变更导致了开发上的重大变化，并最终名称从 `SuSE` 变为 `openSUSE`。尽管不断变化，但它仍然免费提供。你可以在两个主要版本找到
    openSUSE。`Leap` 为用户提供了一个稳定且具有多年支持的平台。而 `Tumbleweed` 使用滚动更新环境，通过简单的配置和自动化的文件系统快照以及启动环境，这种体验变得非常流畅。


    **难度评分：** 适合有一定经验的初学者

    **长期支持：** 提供丰富的支持


    ### 优点

    - 配置工具全面

    - 有大量的软件包

    - 极佳网站基础设施

    - 丰富的打印文档和支持

    - 带有启动环境的 `Btrfs`


    ### 缺点

    - 桌面设置臃肿且沉重

    - 图形化工具运行缓慢


    # Fedora


    Fedora 本身直到 2004 年才宣布并亮相，尽管它的根可以追溯到 1995 年的 `Red Hat Linux`，后者由 Bob Young 和 Marc
    Ewing 发布。他们的产品发布并更新了多次，1997 年，它添加了 `RPM` 软件包管理系统以及其他几个高级功能，这迅速让 `Red Hat` 变得流行，最终甚至超过了
    `Slackware Linux` 成为当时最流行的发行版。


    2003 年，在 `Red Hat Linux 9` 发布后，公司进行了一些重大调整，保留 `Red Hat` 商标用于商业用途，并添加了 `Fedora
    Core`。最终更名为简单的 Fedora，该系统由 `Red Hat` 赞助，但主要面向 Linux 爱好者。尽管最初有顾虑，它很快被接受，并再次一飞冲回到最受欢迎的版本之一的地位。这通常被认为是现今最具创新性的选择之一。Fedora
    在对整个 Linux 的贡献方面一直处于领先，并使用了多项企业级功能。然而，它也存在一些缺点——它需要一些技术知识才能真正发挥其作用，这意味着对于喜欢折腾的爱好者来说，它仍然是一个更好的产品，而不是对于正尝试学习的人。


    **难度评分：** 中级

    **长期支持：** 定期更新


    ### 优点

    - 创新性

    - 安全

    - 海量支持的软件包

    - 与自由软件哲学高度契合


    ### 缺点

    - 企业级功能而非桌面功能和易用性

    - 尖端特性有时会让不太熟悉系统的人感到疏远

    - 对 Linux 通用操作需要更多一点技巧


