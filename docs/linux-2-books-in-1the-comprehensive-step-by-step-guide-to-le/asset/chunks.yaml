    # Chapter 3: Install Linux


    At this point, you should be ready to install Linux. However, you have yet another
    decision to make. Will you install your distribution on a virtual machine, or
    will you be running it on hardware? Even if you choose to install on hardware,
    will you run it as your primary OS, or will you create a partition for your chosen
    distribution?


    If you are a beginner to looking into operating systems, this may seem intimidating,
    but try not to worry. This chapter will guide you through the basics of installing
    Linux on your device. When you are able to load up several different operating
    systems on one machine, you are able to toggle between them. This means that you
    can take advantage of everything your computer potentially has to offer through
    choosing exactly the software that will do whatever it is that you need to be
    done.


    What you will get from this chapter, however, will be a solid foundation on what
    a virtual machine is and why you may choose to use them. You will be guided through
    the installation of Linux on your physical computer through the use of a USB drive,
    step-by-step. Then, you will be guided through the creation of a virtual machine
    on your machine running Windows, allowing you to effectively run an instance of
    Linux within the virtual machine itself. Lastly, you will be guided through the
    installation of Linux on a virtual machine on a computer that is currently running
    macOS. By the end of this chapter, you should feel comfortable with the idea of
    installing Linux onto your own device, whether you choose to install it on the
    physical machine itself or whether you prefer instead to run a virtual machine
    within the OS of your choice.


    ## What is a Virtual Machine?


    A virtual machine is an app on your computer that allows you to run an instance
    of an operating system within it. This allows you to effectively be running your
    particular machine’s native OS while simultaneously using another OS entirely
    within a window on your desktop. Virtual machines are not Linux-specific—you can
    run a macOS virtual machine on a Windows or Linux device, run Windows on a macOS
    or Linux device, or run Linus on a Windows or macOS device.


    Effectively, when using a virtual machine, the app you are running functions as
    its own separate computer apart from the device that it is running on. The application
    creates the ability to run even virtual hardware devices. This means that your
    computer thinks that it is running on its own individual computer, monitoring
    its own processes, and using virtual hardware.


    Unlike trying to run two operating systems on your computer, which requires partitioning,
    the virtual machine instead crates a virtual hard drive. This is a file that will
    be stored on your actual hard drive—this large file, typically multi-gigabytes,
    gets presented to the virtual machine as a hard drive, allowing you to bypass
    needing to create any sort of partition or anything else that may become complicated
    with the hard drive. Do keep in mind that, while a virtual machine is great for
    creating virtual instances of an OS for your usage, it is notably slower than
    running a proper OS. Because of the extra steps that go into supporting the virtual
    machine, it does have some further processing power required. This means that
    a virtual machine is most likely not your best way to be playing games of any
    sort.


    As a major pro, however, the only limit to how many virtual machines you can have
    installed is only limited by the amount of physical hard drive space you have
    available to you. If you have enough room, you can continue to add more installations
    of several other operating systems. However, you must keep in mind that each of
    these installations will take up at least several gigabytes of space within your
    hard drive. You can also choose to run several virtual machines at the same time,
    though again, you will find that the upper limit is your physical hardware. Your
    virtual machines will each need access to some of your processor, RAM, and other
    resources, meaning that the more you are actively trying to use at any given time,
    the weaker the running will most likely be.


    There are several reasons that someone may choose to run a virtual machine. For
    some, this could be done just to mess with. If you are particularly interested
    in computers and how they work, you may choose to use a virtual machine to play
    around in other operating systems that you are not actively running as your primary
    OS. This means that you can mess around with a new OS before deciding if you really
    want to install it physically, allowing you to, for example, play with several
    different Linux distributions before you chose which you prefer to use.


    Other people may find that they have very specific needs from time to time that
    requires a limited app that is only available with a specific OS. For example,
    if you are running Linux, but need an application that was primarily contained
    within Windows XP, you could choose to run Windows XP on a virtual machine to
    make use of that specific app.


    One other common reason that people use virtual machines is the fact that the
    virtual machine is sandboxed. This means that it is all contained within the virtual
    machine itself, so there is nothing that you can do within the virtual machine
    that puts the rest of your system at risk. Like a sandbox and its sides to contain
    it, the virtual machine is entirely sequestered within the hard drive and will
    not be impacted by whatever it is that you have chosen to do within it. This means
    that you can test apps that are being developed in a safe space without worrying
    about the repercussions that would occur if the entire system failed.


    ![](OEBPS/rsrc38G.jpg)


    ## Installing Linux on Physical Hardware


    Before it is time to worry about the virtual machine, however, you will first
    learn how to install Linux on physical hardware. When using this process, you
    are creating the option to install Linux on your computer as a separate partition.
    This means that you will have two (or more) operating systems on your machine.
    This process will be given to you step by step.


    ### Step 1: Downloading the Linux distribution


    Did you choose out distribution in the previous chapter? If so, this is what you
    will be searching. If you have not yet decided which you prefer to use, you will
    need to spend the time making your decision. If you are reading this book, you
    are most likely new to Linux as a whole, and because of this, you will find that
    you are best served by a lightweight distribution that will be a bit more user-friendly,
    such as `Ubuntu` or `Linux Mint`. Of course, you can also choose to challenge
    yourself and go for something a bit more intensive if you so choose. Before beginning,
    also make sure that you have a CD or a USB drive that you can use for the installation.
    Because CD drives are largely becoming obsolete in many consumer-grade products,
    the USB is most likely going to be the most readily-accessible form for any computer.


    Once you have chosen the distribution that you will use, you must download it.
    You can find the distro free to download in an `ISO` format. This is an archive
    file that has an identical copy of data that was found on a disc and is the most
    common format to distribute Linux. The identical copy is known as the image and
    is what you are seeking to copy in order to install the software.


    1. Download the `ISO` for the distribution of Linux you have chosen on the distribution’s
    website.

    2. Prepare the `USB` to become bootable with a program such as `Rufus`.

    3. Install an image burning program such as `Pen Drive Linux` or `UNetBootin`.

    4. Load image onto the formatted `USB`.

    '
