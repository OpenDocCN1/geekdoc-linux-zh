    # Kali Linux 黑客攻击：学习网络安全、黑客攻击和渗透测试基础完整步骤指南


    ## 第一部分 Kali Linux 与黑客攻击导言


    ### 第 9 章：黑客攻击简介


    这是许多人可能发生的最糟糕的事情之一——他们登录银行账户或信用卡，结果发现账户余额被完全清空了，或者有人一直在大量使用他们的信用卡。这绝对会摧毁许多人的生活，不幸的是，在今天，这是一个非常真实的担忧。


    ![](img/rsrc38T.jpg)


    如今，财务信息被备份在某处。你的银行有你的账户号码记录，以及某人访问所需的其他信息。你是否曾遇到过想要尝试黑客的情况？也许你想测试你正在开发的某些东西的安全性，或者你只是想挑战自己，而你不确定从哪里开始。如果这是你考虑过的，`Kali
    Linux` 可能是你开始这一过程所需的操作系统。


    需要注意的是，Kali Linux 并不适合每个人——如果你想以有效的方式使用它，你需要对 `Linux` 如何工作有某种程度的熟悉，或者至少对如何与之交互有一个想法。如果你没有这种熟悉程度，最好的办法可能是回去开始学习更简单的
    `Linux` 发行版，例如 `Ubuntu` 或 `Mint`，在开始尝试 `Kali Linux` 之前。如果你决定继续使用 `Kali Linux`，请记住，该发行版中的工具如果使用不当可能会造成损害，并可能导致严重的后果。这不是一个可以轻视的发行版。


    如果你决定继续进行，这本书将为你提供 `Kali Linux` 的入门指南，以及如何使用它来开始黑客攻击。书的前半部分致力于为你提供真正充分利用其价值所需的各种知识。你将获得关于网络安全变得比以往任何时候都重要的信息。你将学习网络本身的基础，深入研究几个不同的概念以及它们的工作原理。你将学习关于
    `Kali Linux` 的一切——它是什么、如何安装以及如何使用它，你将学习几个最基础的 `Linux` 命令。


    在书的后半部分，你将开始讨论为了不同目的利用 `Kali Linux`。你将学习 `Nmap` 以及它如何被检测和利用漏洞。你将被引导通过保持匿名的步骤。你将深入研究
    `Metasploit` 以及如何结合 `Kali Linux` 使用它。你将学习数字证书以及如何使用它们，最后，你将学习 `bash` (Bourne Again
    Shell) 和 `Python` 脚本，以及为什么这两者有时被认为是对立的，尽管它们完全可以一起工作并协作，获得比让它们保持分离好多的结果。


    当你读完这本书时，你将对你所需的基础信息有一个概念，以便你首先决定 Kali Linux 是否适合你，如果是的话，你将知道如何开始使用它并了解这个 `Linux`
    发行版到底有多强大。虽然 Kali Linux 并不适合所有人，如果你恰恰属于会发现这个程序有用的人群，那么该发行版提供的工具是极其宝贵的资产，你将不想错过在你的武器库中拥有它们。


    归根底，你将能够确定是否对 Kali Linux 的想法感到满意，这是否适合你，或者相反，你应该重点转向另一个 `Linux` 发行版。你将决定是想继续完全使用
    shell 工作，还是想去学习 `Python`。如果讨论的这些内容没有任何意义，那么在读完书后，你应该对目前的话题以及应该如何使用它们有一些清晰的思路。


    ### 恶意软件 (Malware)


    Malware 是恶意软件——缩写为一个词。它包括病毒等软件，这些软件是通过你点击某些允许其下载的内容或你自己下载来安装的，但一旦你允许它进入，你就危及了你的信息。攻击者通常会使用看起来无害的链接或电子邮件附件来欺骗你安装隐藏在其中的任何内容。安装的恶意软件可能会导致各种问题，例如监控计算机的使用（如击键记录），这允许黑客访问各种可能是个人或敏感的信息。取决于安装的恶意软件，它还可以授予对计算机的完全访问权限。然而，大多数情况下，计算机用户必须执行某些触发恶意软件下载的操作。


    ### 会话劫持 (Session Hijacking)


    正如后文将讨论的那样，当用户浏览互联网时，用户……


    ### SQL 注入 (SQL)


    SQL（通常读作 sequel）是结构查询语言的缩写。它是主要用于与数据库通信的编程语言。当网站或公司需要存储敏感或关键信息时，存储信息的服务器通常会使用
    `SQL`。


    ![](img/rsrc38.jpg)


    `SQL 注入`，那么是指寻求使用被设计用于触发服务器提供受保护信息的代码。这可能是因为网站安全性的漏洞。例如，某些人可能会黑入他们的游戏台来运行模拟器，以便他们玩不同用途的
    ROM 文件。


    ### 什么是黑客攻击？ (What is Hacking?)


    黑客攻击，那么是指识别计算机或网络中的任何漏洞，然后利用该漏洞以获得必要的访问。黑客攻击并不总是出于伤害意图——黑客攻击可以有多种形式，例如欺骗某点击电子邮件中的附件以授予计算机访问权限。然而，其他形式需要的比欺骗他人授予访问权限多得技术知识。从本质上说，黑客是进入他人系统的行为，但黑客攻击的方法差异很大。每种以不同的方式发生并有不同的目的，但结果都是相同的——它们允许信息被盗取和使用。


    ### 网络钓鱼 (Phishing)


    网络钓鱼 是一种依靠欺骗他人提供信息的黑客形式。这通常通过看似来自合法来源的电子邮件、短信或电话进行。钓鱼者的目标是窃取敏感信息，如密码、社会安全号码或信用卡。这是一种非常常见的攻击类型，意识到这一点很重要。


