  \ Stark 博士和 Masayoshi Tomizuka 博士向我介绍了 UNIX，它带我比我想象的远得多。\n\n—Ted Jordan\n\n### 引言\n\
  \n恭喜你决定成为 CompTIA Linux+ 认证人员！通过购买这本书，你已经迈出了获得目前最热门认证之一的第一步。获得 CompTIA Linux+ 认证使你在当今的\
  \ IT 就业市场上拥有独特优势。当你获得 Linux+ 认证时，你向你的雇主、同事以及你自己证明了你对 Linux 真正精通。\n\n新的 CompTIA Linux+\
  \ 考试 `XK0-005` 是之前 CompTIA Linux+ `XK0-004` 考试的扩展版本。除了 Linux，它还涵盖了一些 DevOps、虚拟化和云主题。测试的\
  \ Linux 部分包括 SELinux 和其他安全主题，以及在多服务器环境中使用的设备管理、防火墙和服务器命令。\n\n`XK0-005` 考试专为具有至少\
  \ 12 个月经验的人士设计。测试的 Linux 部分包括 SELinux 和其他安全主题，以及在多服务器环境中使用的设备管理、防火墙和服务器命令。\n\n###\
  \ 本书的适用对象\n\n在开始之前，你需要意识到我们有两个主要目标：\n- 帮助你准备并通过考试\n- 为你提供技能和知识\n\n### 如何使用本书\n\n\
  我们建议你使用 Linux 镜像来测试你阅读的内容。阅读一个章节，然后尝试该章节中的命令。这些操作将帮助你更好地记忆材料，并提高你的解决问题的能力。大多数章节还包含一个或多个练习。当你遇到练习时，执行每个步骤。不要只是扫一眼练习——要理解每个步骤做了什么。预判你的操作会影响什么，然后验证结果。\n\
  \n\n\n请花时间学习。CompTIA Linux+ 考试的目标是证明你清楚自己在做什么，而不是证明你能够通过一项测试。罗马不是一一日之就的。请花时间进行准备。如果你能够解释相关概念，能够在理解的同时完成练习，并能辨别为什么某个问题的答案是正确的而其他选项是错误的，那么你就准备好参加考试了。\n\
  \n## 本书的结构\n\n目前公布的 CompTIA Linux+ 考试目标是按主题组织的。它们并没有按照逻辑教学流进行组织。当你阅读本书时，你会很快发现，我们处理\
  \ CompTIA Linux+ 目标的顺序与 CompTIA 公布的顺序不同。所有的目标都涵盖了；但是，我们对它们进行了重新组织，使其从最基本的 Linux\
  \ 概念开始。然后，随着书籍的深入，我们将处理日益复杂的 CompTIA Linux+ 目标，在之前章节所涵盖的技能和知识的基础上进行构建。\n\n附录 A 中的“考试目标映射”旨在帮助你将\
  \ CompTIA 的官方考试目标与本书书中呈现和涵盖的目标进行交叉引用。表格的左列完全按照 CompTIA 呈现的方式列出了考试目标，右列则标识了涵盖每个考试目标对应的章节。\n\
  \n## All-in-One 认证系列的特殊特性\n\n为了让 All-in-One 认证考试指南更加实用且读起来更有趣，McGraw Hill 为该系列设计了一些你将在书中随处看到的约定。\n\
  \n### 图标\n\n为了提醒你注意重要的建议、快捷径或陷阱，你偶尔会在文中看到 `Notes`（笔记）、`Tips`（提示）、`Cautions`（注意）和\
  \ `Exam Tips`（考试技巧）。\n\n![Images](img/note.jpg)\n\n**NOTE** `Notes` 提供了特别有用的内容、背景解释和信息。它们偶尔也会定义术语。\n\
  \n![Images](img/tip.jpg)\n\n**TIP** `Tips` 提供建议和细微差别，帮助你学会精进你的工作。采纳我们的建议并仔细阅读 `Tips`。\n\
  \n![Images](img/caution.jpg)\n\n**CAUTION** 当你看到 `Caution` 时，请特别注意。当你必须做出关键选择或者当你正准备着某项可能会产生你无法立即预料的影响的事时，就会出现\
  \ `Cautions`。现在阅读它们，以免以后后悔。\n\n![Images](img/exam.jpg)\n\n**EXAM TIP** `Exam Tips`\
  \ 为你提供建议，或可能提供与准备考试本身相关的信息。\n\n### 章节复习与问题\n\n本书的一个重要部分位于每个章节的末尾，你将在那里找到对要点的深度回顾，以及一系列问题和这些问题的答案。每个问题都是多选题格式。\n\
  \n提供这些问题是作为你——即读者和潜在的 CompTIA Linux+ 考生的学习辅助。我们无法保证如果你正确回答了所有问题就绝对能通过认证考试。但我们可以保证，这些问题将让你对自己为考试的准备程度有一个大致了解。\n\
  \n### 在线内容\n\n本书附带了虚拟机文件的访问权限，你可以下载并使用这些文件建立你自己的 Linux 系统进行练习。它还包含了作者提供的视频片段，这些视频演示了书中章节中的许多练习，以及\
  \ `TotalTester` 模拟考试，以帮助你为真实的认证考试做好准备。在附录 B 中阅读更多关于在线内容以及如何访问的内容。\n\n## CompTIA\
  \ Linux+ 认证考试\n\n现在你已经了解了本书是如何组织的，是时候让你熟悉 CompTIA Linux+ 认证计划和相关考试了。让我们回顾以下主题：\n\
  \n- 关于 CompTIA Linux+ 认证\n- 参加 CompTIA Linux+ 考试\n\n### 关于 CompTIA Linux+ 认证\n\n\
  CompTIA Linux+ 认证是一项极好的计划！它是由计算技术行业协会（亲切地称为 `CompTIA`）设计并管理的一项厂商中立认证。\n\nCompTIA\
  \ Linux+ 认证被认为是“厂商中立”的，因为该考试不是基于某个特定厂商的硬件或软件。这在信息技术行业中相当独特。许多 IT 认证计划都集中于某个特定厂商的硬件或软件，例如来自\
  \ Microsoft、Cisco、SUSE 或 Red Hat 的产品。\n\n相反，CompTIA Linux+ 认证旨在验证你对 Linux 操作系统的通用知识和技能，而不是针对某一个特定的发行版。以下内容根据\
  \ `CompTIA`（撰写时）：\n\n*CompTIA Linux+ 验证了管理员在保障企业安全、驱动云计算和保持系统运行方面所需的技能。新认证确保了 IT\
  \ 专业人员、软件开发人员、网络安全工程师和渗透测试人员拥有这些必要的技能来支持如今的技术系统。*\n\n*CompTIA Linux+ 是唯一以工作为中心的\
  \ Linux 认证，涵盖了招聘经理所要求的最新基础技能。与其他认证不同，新考试包含了基于性能的问题和多选题，以识别能够胜任工作的员工。考试涵盖了与所有主要 Linux\
  \ 发行版相关的任务，为高级的厂商/发行版特定知识奠定了基础。*\n\n如前所述，`CompTIA` 已发布了定义 CompTIA Linux+ 认证的考试目标。这些考试目标规定了\
  \ Linux 系统管理员应该知道并能够做什么。提交简要注册表后，CompTIA Linux+ 考试目标（以及模拟考试）可以在 [`comptia.org/certifications/linux`](https://comptia.org/certifications/linux)\
  \ 获取。要获得 CompTIA Linux+ 认证，你必须能够执行这些目标包含的任务。\n\n### 参加 CompTIA Linux+ 考试\n\nCompTIA\
  \ Linux+ 考试是限时考试，通过计算机以电子形式交付。考试由 90 道题组成，必须在 90 分钟内完成。（倒计时器位于屏幕右上角。）\n\n![Images](img/note.jpg)\n\
  \n**NOTE** 由于上述 ，你在考试中实际看到的题目可能少于 90 道，因为基于性能的问题（`PBQs`）的权重更大。预计会看到大约 5 个 `PBQs`。`PBQs`\
  \ 越多，提供的总题目就越少。`PBQs` 会授予部分分。\n\n考试界面非常直观。题目在屏幕上逐显示显示你会看到一个问题以及一系列选项。你标记相应的选项然后进入下一道题。你可以返回标记为复习的题目。\n\
  \n每个考试主要由多选题组成。大多数多选题只需要一个答案；但有些题目要求选择多个正确答案。如果你漏选了一个，考试会警告你答案不完整。\n\n在你完成考试后，计算机将立即进行评估并打印出你的分数。要通过考试，你需要在可能的\
  \ 900 分中至少获得 720 分。如果你没有通过，你的成绩单将列出你答错的目标。你可以利用这些信息进行复习，并准备再次参加考试。\n\n为了让在全球范围内可用，`CompTIA`\
  \ 通过其测试合作伙伴 `Pearson VUE`（[`home.pearsonvue.com`](https://home.pearsonvue.com)）管理\
  \ CompTIA Linux+ 考试。在 `Pearson VUE` 注册时，你可以选择测试中心或在家里参加考试。\n\n![Images](img/FM-01.jpg)\n\
  \n**图 1** 查找你附近的测试中心\n\n![Images](img/note.jpg)\n\n\n\n\n\n**注意** 如果要在家里参加考试，请确保你使用的房间非常整洁且没有书籍。考试期间，任何人都不能进入房间；否则，监考人员将判定你不及格，且不予退款。在此处了解更多：[`www.comptia.org/testing/testing-options/take-online-exam`](https://www.comptia.org/testing/testing-options/take-online-exam)\n\
  \n要报名 CompTIA Linux+ 考试，请访问 CompTIA 网站 [`store.comptia.org`](https://store.comptia.org)\
  \ 并购买考试代金券。你可以在本书尾找到一个可以享受考试代金券 9 折优惠的促销代码。然后访问 Pearson VUE 网站并寻找你附近的测试中心。只需指定你想参加的考试和你的本地信息即可。除非你选择了在家参加考试，否则你将收到一份附近的测试中心列表，如图\
  \ 1 所示。在此处了解更多：[`www.comptia.org/testing`](https://www.comptia.org/testing)。\n\n\
  然后使用 Pearson VUE 网站安排考试并提交考试代金券。你也可以直接拨打测试提供者的电话安排考试。请注意，他们需要验证你的身份，因此请准备好提供社会安全号码或国家身份证。测试提供者将向你发送一封确认邮件，列出考试的时间和地点。\n\
  \n考试当天，请务必留出足够的旅行时间。你不知道何时会遇到交通拥堵或汽车故障。尽量尽早到达。如果你在社区学院参加考试，可能需要步行很长距离才能到达考场。\n\n\
  当你在测试中心签到时，你需要出示`两`份原始、未过期的身份证明，其中至少`一` 份必须带有你的照片。以下是接受的身份证明类型：\n\n* 驾照\n* 护照\n\
  * 社会安全卡或国家身份证\n* 签名的信用卡\n* 通用访问卡 (Common Access Card)\n* 个人身份验证卡\n* 军用身份证\n* NEXUS\
  \ 卡\n* 州颁发的身份证\n\n签到时，你必须将手机、平板电脑、钥匙、钱包、参考材料等交给监考人员，他们将把它们放在储物柜中。中心可能会检查你的眼镜是否带有摄像头。你不允许携带任何材料进入考场，包括白纸。大多数测试中心会提供笔记材料，这些材料在考试完成后将留在房间内。\n\
  \n### 成功通过 CompTIA Linux+ 认证考试的技巧\n\n在过去的十年里，我们帮助了数百名候选人准备了各种认证考试。因此，我们学了一些帮助你通过考试的技巧。\n\
  \n你可以做的最重要的事情就是彻底的学习和练习。任何技巧、策略或策略都无法弥补学习和练习的不足。目标是将信息转化为长期记忆。以下是一些可以帮助你准备的学习技巧。\n\
  \n#### 准备考试\n\n* **设定每日学习预约。** 从慢开始并循序渐进。从每天半小时开始，如果可能，增加到每天两次一小时。（连续学习两个小时效率并不高。）记住像对待其他重要预约一样遵守这个预约。如果你错过了某个预约，不要担心；只要不要错过下一次即可。每天学习不要超过两个一小时的时段。\n\
  * **如果你在下班后学习，请给自己一个放松的机会。** 尝试洗个澡并换件衣服。也许散散步或花点时间听音乐。如果你饿了，吃得清淡健康点。在学习前避免看视频游戏或电视。\n\
  * **确保你的学习环境光线良好且整洁。** 关闭电话。在学习环境中准备好学习所需的一切。一旦坐下来学习，就一直留在那里。\n* **使用闪卡和思维导图。**\
  \ 这些是极佳的学习工具。有关闪卡如何提供帮助的更多信息，请查看 Mnemosyne Project 网站上的信息（[`mnemosyne-proj.org/`](https://mnemosyne-proj.org/)）。\n\
  * **维护学习健康。** 留出时间运动和休息以获得最佳表现。运动有助于学习。我们不是让你去健身房；尝试在午餐和晚餐后散步。电视、视频游戏和手机在你关闭它们后很久仍会干扰学习和睡眠。\n\
  * **分块进行学习。** 在读完一个章节后，可能的情况下使用虚拟机镜像来验证你所学的内容。制作闪卡和思维导图来帮助记忆该章节的内容，并将这些工具用于未来的学习。\n\
  * **当你遇到测验或章节考试时，不要草草应付。** 利用这个机会学习如何评估问题。确保你理解为什么正确答案是正确的，以及其他答案是错误的。\n* **当你做练习时，理解每个命令的作用，以及如何以及何处测试结果。**\
  \ 在执行命令之前，确定哪些设置或配置文件会影响该命令。使用这种方法将对你的现实生活以及分析题目有所帮助。养成执行命令然后测试结果的习惯。\n\n有些人建议通过通过预先安排考试来设定截止日期。我们不能建议每个人都采用这种策略。安排考试可能是有效的，也可能适得其反。设定\
  \ 30 天或 60 天的截止日期可能会给你带来不必要的压力，特别是当你发现某个章节让你困难时。我们看到“乌龟策略”（稳扎稳打）是成功的。如果你非常有动力，你就能做到。利用你的动力坚持学习预约。当你准备好参加考试时，安排考试。然而，如果你是那种在压力下表现更好的人，尽管安排考试吧。\n\
  \n#### 临考\n\n* 继续使用闪卡和思维导图进行复习。\n* 熟悉 60 秒流逝的感觉。考试期间，最糟糕的事情就是卡在某个问题上。使用计时器习惯 60\
  \ 秒一个的间隔。考试时，如果你无法回答某个问题，将其标记稍后返回。\n* 练习评估问题。写下要点或创建一个简单的图表。\n* 假装你在教授这些材料。尝试解释某个章节的内容。如果你能解释，你就掌握了。\n\
  * 使用虚拟机镜像应用你已的知识。\n\n#### 考试前一晚\n\n* 不要学习。\n* 将考试所需的所有文件放在一起。\n* 保证充足的睡眠。\n* 设置闹钟，为早上留出充足的准备和前往测试中心的时间。\n\
  \n#### 参加考试\n\n* **评估问题。** 确定问题要求什么。将问题拆分为哪些信息是相关的，哪些是干扰信息。确定你会如何解决这个问题。这里有一个例子：\n\
  \n用户 `student1` 想要将 `/public/test` 子目录中的文件复制到 `/data` 目录。`student1` 并不是父目录 `/public`\
  \ 或 `/data` 的所有者，但是这些目录所属组的成员。该组对所有目录都有读取和执行权限。什么命令能让 `student1` 将文件从 `/public/test`\
  \ 复制到 `/data`？\n\n要回答这个问题，你必须熟悉将文件复制到另一个目录所需的权限。要复制文件，你需要在源目录具有执行权限，并且在目标目录具有写入和执行权限。\n\
  \n\n\n\n\n缺失了什么？用户 `student1` 无法将文件写入目标目录 `/data`，因为 `student1` 的组只有读取和执行权限。\n\n\
  需要什么？组所有者需要 `/data` 目录的写入权限。\n\n现在你可以寻找可以为 `/data` 目录应用写入权限的一个或多个答案。\n\n- *视觉化评估问题。*\
  \ 你可以使用提供的材料进行评估。正如你之前练习的那样，写下要点或创建一个简单的图表。这看起来可能是在浪费时间，但视觉线索有助于唤回记忆。你的大脑根据上下文在内存中存储并关联数据。\n\
  - *仔细阅读每个答案。* 利用你评估获得的信息来判断某个答案是否满足问题的要求。先排除明显明显错误的答案。\n- *做出你的最佳选择并继续。* 根据经验，我们知道你的第一印象通常是正确的。\n\
  - *不要在某道题上花费超过 60 秒。* 如果超过了 60 秒，标记该题目以便你稍后返回并继续。\n\n![Images](img/note.jpg)\n\n\
  **注意** 性能类题目可能需要大约 5 分钟完成。跳过这些题目，并将它们留到考试的最后 30 分钟。这将给你时间完成选择题。回答所有问题。不要留空。\n\n\
  - *你的第一个答案通常是正确的。* 如果你对某道题有问题，将其标记为复习稍后返回，但你的第一个答案通常是正确的。\n\n考试结束后，你的结果将自动打印出来。报告将由你的测试监官加盖\
  \ CompTIA 认证考官印章以证明结果。不要丢失这份报告；在通过邮件收到证书之前，这是你拥有的唯一纸质。\n\n报告将显示你在考试每个部分的表现。CompTIA\
  \ Linux+ 考试为通过/不通过制。根据此书出版时的可用信息，如果你得分达到 720 分或以上，你就通过了！\n\n如果你没有通过，可以根据报告上的信息来识别你需要学习的领域。如果你愿意，可以立即重考考试。然而，有两点需要记住：\n\
  \n- 重考考试需要支付全额费用（尽管你可以通过快速在线搜索找到优惠券）。\n- 重考的内容可能与你的第一次考试不同。\n\n如果你没有通过第二次考试，必须至少等待\
  \ 14 天才能参加第三次考试。\n\n如果你以 650 分或以上的分数通过，我们建议你深入学习遗漏的项目，并在一两天内安排重考。如果你等得更久，你的记忆可能会变得“生疏”，你可能需要重新经历整个准备过程。\n\
  \n![Images](img/exam.jpg)\n\n**考试技巧** 避免 TNC 失败！CompTIA 为你提供了 28 分钟来阅读考试的“条款和条件”（TNC）。如果你在在此期间*没有*选择接受（ACCEPT），*无论你是否已看完条款*，屏幕将默认显示为“拒绝接受条款”，考试关闭，且你的测试卷将被“作废”。不退款。卷不重复使用。你必须再次花费\
  \ $358 重新安排考试。因此，在参加考试之前，务必在 CompTIA 网站上阅读候选协议：[`www.comptia.org/testing/testing-policies-procedures/test-policies`](https://www.comptia.org/testing/testing-policies-procedures/test-policies)。\n\
  \n# 第 1 章\n\n## Linux 简介与预评估考试\n\n在本章中，你将学习到：\n\n- Linux 简史\n- Linux 操作系统结构\n- Linux\
  \ 发行版\n- 常见的 Linux 实现\n\n*我们完好无归回到这次任务的可能性刚刚增加了一倍。*\n—Nichelle Nichols 饰 Uhura 尉陆，《星际迷航》*\n\
  \n## Linux 简史\n\n要理解 Linux 及其不同的发行版，你需要了解在 Linus Torvalds 开始开发 Linux 内核之前计算机世界发生了什么。20\
  \ 世纪 50 年代见证了计算机从单用户、单任务系统向批处理系统的演变。\n\n讨论从 20 世纪中期开始，一直持续到 Linux 的发展，如下：\n\n- 批处理\n\
  - MULTICS\n- UNIX\n- LINUX\n\n让我们从 20 世纪 50 年代的编程开始说。\n\n### 批处理\n\n批处理是程序的顺序执行。程序员会将写在打孔卡或纸带上的程序提交给系统操作员。系统操作员稍后“运行”作业并将结果返回给程序员。\n\
  \n不幸的是，编程错误、打字错误、损坏的卡片（或磁带）或卡片顺序错误都会导致程序失败。程序员必须修复这些困难并重新提交作业。\n\n##### ARPA/DARPA\n\
  \n1957 年 10 月 4 日，苏联发射了 Sputnik 号。这次发射让许多人怀疑美国在技术上是否落后。当时，美国陆军、海军和空军都有自己的防御开发项目。各军种之间的竞争是徒效且浪费资源的。\n\
  \n艾森豪威尔总统要求他的科学顾问委员会成员与新任命的国防部长尼尔·麦克尔罗会面，以寻找问题的解决方案。科学家们的解决方案是建立一个单一的民用机构来控制研发并向国防部长报告。高级研究计划署成立六个月后，建立了\
  \ NASA 以区分民用和军事太空旅行。1972 年，ARPA 的名称更改为 DARPA（国防高级研究计划署）。\n\n##### 兼容共享系统\n\n批处理无法满足日益增长计算资源的需求。麻省理工学院（MIT）是开始开发共享系统的学院之一，该系统允许多个用户通过远程终端并发访问系统资源。\n\
  \nMIT 开发了一个名为兼容共享系统（CTSS）的实验性共享系统，并生成了随后被用于 UNIX 的应用程序：\n\n- `RUNOFF`：一种文本格式化和打印工具，是\
  \ `roff`、`groff`、`nroff` 和 `troff` 的前身。\n- `RUNCOM`（运行命令）：最早运行脚本的应用程序之一。Linux `/etc/init.d`\
  \ 目录下的 `rc` 目录是用 `RUNCOM` 脚本命名的。\n\n### MULTICS\n\n1964 年，MIT、通用电气和贝尔实验室开始开发由 DARPA\
  \ 资助的多路复用信息和计算服务（MULTICS）操作系统。MULTICS 的目标如下：\n\n- 远程终端使用\n- 连续运行\n- 高可靠性的内部文件系统\n\
  - 支持并发执行的广泛应用程序\n- 一个能够随技术和用户需求变化而演变的系统\n\n霍尼韦尔和 MIT 完成了 MULTICS，并于 1969 年 10 月发布了第一个商业版本。MULTICS\
  \ 在 25 年内一直是一个有效的操作系统。\n\n### UNIX\n\n贝尔实验室的计算机科学家肯·汤普斯和丹尼斯·里奇参与参与了 MULTICS 项目。在贝尔实验室退出后，肯·汤普斯决定基于\
  \ MULTICS 的原理开发他自己的操作系统。初始版本于 1970 年发布，被称为 UNICS，意为单路复用信息和计算。\n\n![Images](img/note.jpg)\n\
  \n**注意** UNIX 开发团队包括肯·汤普斯、丹尼斯·里奇、道格·麦克莱和乔·奥萨纳。\n\nUNICS 的前两个版本是用针对特定处理器族的汇语言编写的。为一个处理器族编写的汇语言应用程序必须为另一个处理器族重新编写。\n\
  \n\n\n\n\nDennis Ritchie 开发了 C 编程语言。编译型语言将源代码转换为汇编语言，这减轻了为每个新的处理器族群重写操作系统的需求。1973\
  \ 年，UNICS 用 C 语言进行了重写并命名为 UNIX。\n\n1974 年，AT&T 在美国电话系统领域拥有垄断地位。作为与联邦政府协议的一部分，该公司可以保留其垄断地位，但不被允许出售软件。由于无法出售\
  \ UNIX，AT&T 以低廉的分发费用向教育机构授予了 UNIX 许可。这使得学院和大学能够获得该操作系统，并将其用于教学和开发。\n\n1982 年，AT&T\
  \ 被拆分为若干较小的电话公司，这使得 AT&T 允许销售软件。因此，UNIX 对教育机构而言不再是“免费”的。\n\n## MINIX\n\n当 Andrew\
  \ Tanenbaum 听到 `AT&T` `UNIX Version 7` 将不再提供给教育机构时，他开始开发 `MINIX`，这是一种基于微内核的兼容 `UNIX\
  \ Version 7` 的操作系统。起初，该操作系统频繁崩溃，Tanenbaum 正准备终止该项目，直到他的一个学生告诉他，崩溃是因为 `Intel` 芯片过热产生了热中断。\n\
  \nTanenbaum 修复了该问题，`MINIX` 于 1987 年免费向大学发布。遗憾的是，`MINIX` 受版权保护；因此，不允许任何人修改源代码。2000\
  \ 年，`MINIX` 的许可更改为一种名为 `Berkeley Software Distribution`（`BSD`）的宽松许可。宽松许可允许用户修改源代码，但不要求提供修改后的源代码。\n\
  \n当前版本是 `MINIX 3`，设计用于嵌入式系统。嵌入式系统包含操作系统和控制程序，用于管理特定设备，如传真机或数字相机。\n\n## GNU\n\n1983\
  \ 年 9 月 27 日，Richard Stallman 宣布了 `GNU` 项目（`GNU` 代表 `GNU is Not UNIX`）。`GNU` 是一个自由的类\
  \ `UNIX` 操作系统，可以供任何人共享、学习和修改。当时并不存在免费（指无费用）且开源的 `UNIX` 版本。AT&T 不再向学习机构提供免费版本的 `UNIX`，而\
  \ Andrew Tanenbaum 的 `MINIX` 则受版权保护。\n\n1985 年，Stallman 创立了 `Free Software Foundation`，并与律师\
  \ David Wheeler 一起创建了 `General Public License`（`GPL`）。`GPL` 也称为左版许可。`GPL` 许可规定，任何软件或艺术作品都可以自由地修改和分发，只要修改后的版本也无限制或免费分发。\n\
  \n由于不存在免费的 `UNIX` 内核，`GNU` 项目必须开发一个。\n\n### Linux\n\nLinus Torvalds 于 1988 年进入赫尔辛基大学。当时，大多数大学使用\
  \ `MINIX` 向学生教授 `UNIX`。Torvalds 不喜欢 `MINIX` 终端模拟器，决定写一个更好的。随着他向自己的模拟器添加功能，他得出结论：从零开始创建一个操作系统会更好。\n\
  \n1991 年 9 月 17 日，Torvalds 在 `GPL` 许可下发布了一个名为 `Freax`（自由 `UNIX`）的开发环境。`Freax` 使用了\
  \ Richard Stallman `GNU` 项目创建的许多工具和实用程序。主要的设计差异之一是 Torvalds 决定使用单体内核而非微内核。六个月后，操作系统的名称更改为\
  \ `Linux`。Linus 然后发布了源代码并邀请其他程序员进行审查、修改并贡献增强。这就是最初的 `Linux` 操作系统。\n\nLinus Torvalds\
  \ 拥有 `Linux` 操作系统的注册商标，并控制着 `Linux` 内核的开发。当大多数人谈论 `Linux` 时，他们通常是指带有 `Linux` 内核的操作系统。\n\
  \n## Linux 操作系统结构\n\n操作系统为用户在计算机上执行程序提供了手段。`Linux` 操作系统由多个功能层（分层架构）组成，详列表所示：\n\n\
  - **硬件层**：负责与系统硬件交互。\n- **内核 (Kernel)**：内核层是操作系统的核心。它为系统提供进程、内存和任务管理。\n- **Shell**：应用程序和用户环境及接口。\n\
  - **操作系统软件**：用于管理操作系统。\n- **应用程序软件**：编辑器和其他用户应用程序。\n\n在本节中，你将学习到关于 `Linux` 操作系统结构的以下细节：\n\
  \n- 内核\n- 操作系统软件\n- 应用程序软件\n\n让我们首先探索 `Linux` 内核。\n\n### 内核\n\n内核层是操作系统的核心。大多数 `Linux`\
  \ 发行版使用单体内核。某些（`GNU`）使用微内核。内核还将应用程序连接到系统硬件。内核分为以下组件：\n\n- **系统调用接口 (SCI)**：在用户空间和内核空间之间提供连接\n\
  - **进程管理**：负责创建、停止和与系统进程进行通信\n- **内存管理**：负责内存分配、虚拟内存和分页\n- **虚拟文件系统**：为多种文件系统类型提供抽象层\n\
  - **网络协议栈**：提供网络通信使用的协议\n- **设备驱动程序**：用于与硬件通信的软件\n- **与架构相关的代码**：特定于处理器类型的系统代码\n\
  \n要理解单体内核和微内核的区别，你必须理解 `user space`（用户空间）和 `kernel space`（内核空间）这两个术语。内核进程在保留的内存中执行。用户进程在保留应用程序的内存中执行。\n\
  \n#### 单体内核\n\n单体内核在内核空间中执行。单体内核由执行特定功能的模块组成。这些模块可以动态加载或卸载。\n\n#### 微内核\n\n微内核使用在内核空间执行的小内核内核来管理内存、多任务处理和进程间通信。大多数其他内核功能构建在用户空间执行的“服务器”中。\n\
  \n### 操作系统软件\n\n操作系统软件旨在管理系统资源并为应用程序提供平台。大多数操作系统软件作为启动过程的一部分并在系统关闭时终止。（操作系统软件的细节将在第\
  \ 11 章讨论。）\n\n系统启动后，该登录的时间了。无论你是使用命令行界面 (CLI) 还是图形用户界面 (GUI)，系统都会提示用户名和密码，这里的 CLI\
  \ 所示：\n\n```\n当你输入密码时，光标不会移动也不会显示，但密码正在被 Linux 读取。\n```\n\n**考试提示**：CompTIA Linux+\
  \ 考试重点是使用 CLI，而不是 GUI。\n\n### 管理员权限\n\nLinux+ 认证证明你具备成为 Linux 管理员的技能，而非 Linux 用户，因此你需要学习如何在\
  \ Linux 系统上启用管理员权限。这里讨论的两种方法涉及使用 `su` 和 `sudo` 命令。\n\n`su` 代表 *switch user*（切换用户），允许你变成任何用户，但默认用户是\
  \ `root`。`root` 用户可以执行 Linux 上的任何功能，例如杀死任何作业、设置网络或删除任何文件。运行 `su` 需要你知道 `root` 密码才能成为\
  \ `root`，这就是为什么许多 Linux 管理员更倾向于使用 `sudo`。\n\n\n\n\n\n## 绪\n\n`sudo` 命令允许你以 `root`\
  \ 权限运行单个命令。与 `su` 相比，`sudo` 有两个优势：你*不需要*知道 `root` 密码，而且不会停留在 `root` 账户中。相反，你会立即返回标准账户，如下所示：\n\
  \n![Images](img/f0006-03.jpg)\n\n上一个示例显示使用 `su`会将你转换为 `root` 用户，这如 `root #` 提示符所示。要返回标准用户，请运行\
  \ `exit` 命令。\n\n`passwd` 命令最常用于更改密码。运行 `passwd -S` 会显示用户账户状态，例如登录名、是否设置了密码、上次修改密码日期、最小密码年龄、最大密码年龄、密码警告期、密码空置期以及密码所使用的加密类型。\n\
  \n![Images](img/note.jpg)\n\n**注意** 如果你在 GUI 环境下工作，要启动命令行终端，请点击“活动 (Activities)”并打开搜索栏，然后搜索\
  \ `terminal`。或者，选择“应用程序 (Applications) | 系统工具 (System Tools)”并选择“终端 (Terminal)”。\n\
  \n## 解决用户登录和密码问题\n\n如果你在登录 Linux 系统时遇到困难，请首先确保在该系统上有一个账户。在验证这一点后，确保 `/etc/passwd`\
  \ 中的设置定义正确。`/etc/passwd` 文件将在第 4 章 中讨论。\n\n一旦你确定在系统中有一个账户但密码不起作用，请首先确保 `Caps Lock`\
  \ 键未开启。Linux 是一个大小敏感的操作系统，密码也是如此。`Pass123!`、`PASS123!` 和 `pass123!` 在 Linux 系统上是三个不同的密码。强密码和安全性将在第\
  \ 16 章 中讨论。\n\n### 应用程序软件\n\n应用程序软件是用于执行特定任务的用户空间软件（例如编辑器和电子表格）。运行操作系统不需要应用程序软件。应用程序软件仅在被用户或另一个应用程序请求时才执行或终止。\n\
  \nCompTIA Linux+ 认证的一些重要命令包括 `ls`、`cd`、`pwd` 和 `more`，详细信息见下节。（你可以尝试在本书中提供的虚拟 Linux\
  \ 系统上尝试这些一些命令。）\n\n### `ls` 命令\n\n在 `ted $` 提示符下输入 `ls` 命令来列出当前目录下的文件，如下：\n\n![Images](img/f0007-01.jpg)\n\
  \n输出显示目录中有四个文件。\n\n像 Linux 系统上的大多数命令一样，`ls` 命令接受选项。Linux 系统上的一切都是某种类型的文件。使用 `-F`\
  \ 选项，你可以看到文件的类型：\n\n![Images](img/f0007-02.jpg)\n\n上一个输出显示 `Desktop` 是目录，因为名称后面跟着一个\
  \ `/`。`file1` 是普通文件，`file2` 是快捷方式或符号链接，因为名称后面有 `@` 符号（在第 3 章中讨论），而 `file.sh` 是可执行文件，因为名称后面有\
  \ `*` 符号（在第 6 章中讨论）。\n\n### `cd` 和 `pwd` 命令\n\n目录就像文件柜中的文件夹，可以帮助组织文件。要显示当前工作目录，请使用\
  \ `pwd` 命令，如下：\n\n![Images](img/f0008-01.jpg)\n\n输出显示你当前位于 `/home/ted` 目录。\n\n要更改目录，使用\
  \ `cd` 命令，如下：\n\n![Images](img/f0008-02.jpg)\n\n运行 `cd Desktop` 将你的工作目录移动到 `/home/ted/Desktop`。当你在此运行\
  \ `ls` 命令时，你会看到此目录下有一个文件，名为 `file4`。\n\n要返回原始工作目录，输入 `cd ..`。此命令将你移动到上一级目录。\n\n\
  ![Images](img/note.jpg)\n\n**注意** 像大多数书籍一样，本书使用句号作为句号。但句号在 Linux 命令中经常被使用。如果你尝试一个命令并失败了，可能是由于你不该加的地方在命令末尾加了句号，反之亦然。在本书的练习中，当你被指示输入命令时，命令将以加粗形式显示，包括命令中的任何句号。\n\
  \n### `history`、`who` 和 `whoami` 命令\n\n要查看刚刚运行的命令列表，请使用 `history` 命令，如下：\n\n![Images](img/f0008-03.jpg)\n\
  \n有几种方法可以重新运行命令历史记录中列出的命令。第一方法是使用箭头键。从`向上箭头`键开始查看最近运行的命令。其他箭头键可修改命令或查看其他命令。\n\n\
  下一种方法使用 `!`（或感叹号）键。例如，要重新运行 `pwd` 命令，输入 `!8`。这将重新运行第 8 号命令，即 `pwd`。\n\n最后一种方法是运行\
  \ `!` 加上命令的前几个字符来重新运行。例如，`!p` 将重新运行 `pwd`，因为它是以 `p` 开头的最新命令，如下所示：\n\n![Images](img/f0009-01.jpg)\n\
  \n`whoami` 命令显示你是谁。`who` 命令显示谁登录了以及在使用哪种终端，如下：\n\n![Images](img/f0009-02.jpg)\n\n\
  这些工具将在第 4 章和第 5 章中讨论。\n\n### `echo`、`cat` 和 `more` 命令\n\n`echo` 命令有多种用途。它可以用于简单地查看参数将如何显示、创建一个文件，如下：\n\
  \n![Images](img/f0009-03.jpg)\n\n`echo` 命令简单回显提供的参数。\n\n要将 `echo` 输出保存到文件而不是显示在屏幕上，请使用\
  \ `>`。在上一个示例中，`>` 重定向到 `file3`。要查看 `file3` 的内容，使用 `cat` 或 `more`。\n\n![Images](img/note.jpg)\n\
  \n**注意** 使用名为 `vi` 或 `nano` 的文本编辑器修改文件。\n\n查看像 `/passwd` 这样的大文件，`more` 命令比 `cat`更有用。运行\
  \ `cat /passwd` 的滚动速度比你阅读快！\n\n`more` 命令一次分页输出。当你运行 `more /passwd` 时，按 `Enter` 键查看下一行，或按\
  \ `Spacebar` 翻页。要退出 `more`，按 `q` 键。\n\n**命令行延续**\n\n字面化将在第 3 章中介绍，在那里你将学习反斜杠 `\\\
  ` 如何使字符变为字面量。这也适用于 `Enter` 键，它在 Linux 中意味着“回车，换行”。要忽略 `Enter` 键的含义，请如下所示使用 `\\`\
  \ 进行命令行延续：\n\n![Images](img/f0010-01.jpg)\n\n这个示例很简单，但当一个命令的参数多到开始超出屏幕时，你可以使用此功能。\n\
  \n![Images](img/note.jpg)\n\n**注意** 运行 `echo # hi there` 无输出，因为 `#` 意味着“注释”。Linux\
  \ 中 `#` 之后的任何文本都会被忽略。\n\n### `man`、`whatis` 和 `apropos` 命令\n\n要了解更多关于命令参数和选项，请使用\
  \ `man` 命令（`man` 是 manual 的缩写）。以下是运行 `man ls` 的部分输出：\n\n![Images](img/f0010-02.jpg)\n\
  \n`man` 使用 `more` 命令的功能，因此你可以使用 `Enter` 键一次查看一行，`Spacebar` 显示整页，最后使用 `q` 退出手册页。\n\
  \n\n\n\n\n手册页（Manual pages）分为八部分。`ls` 手册位于第 `1` 部分，如上方命令标题括号中的 `LS(1)` 所示。命令头部以大写字母显示，**但\
  \ Linux 是一个区分大小敏感的操作系统。** 运行 `LS` 命令将导致 `command not found` 错误信息。命令头部始终显示为大写是出于历史原因。它追溯到了打印机和屏幕仅使用大写字母的时代。列表详细列出了手册页的章节：\n\
  \n- 第 (1) 节 –任何用户都可以运行的命令\n- 第 (2) 节 – 系统调用\n- 第 (3) 节 – 库\n- 第 (4) 节 – 特殊文件\n-\
  \ 第 (5) 节 – 配置格式\n- 第 (6) 节 – \n- 第 (7) 节 –杂项\n- 第 (8) 节 – 管理用户命令\n\n在无法访问 Yahoo、Google\
  \ 或 Bing 等搜索引擎少数情况下，Linux 提供了 `whatis` 和 `apropos`。这两个命令都搜索 `man` 手页。`apropos` 命令同时搜索命令字段和短描述字段中的任何匹配项。`whatis`\
  \ 命令仅搜索命令字段的精确匹配。\n\n学习更多如何使用命令的另一种方法是在命令后使用 `--help` 选项。例如，`ls --help` 会显示以下部分输出：\n\
  \n![Images](img/f0011-01.jpg)\n\n如果输出内容很长，你可能想通过管道或 `|` 键将输出发送给 `more` 命令。`|` 键与键盘上的\
  \ `\\` 键共用。只需运行 `ls --help | more` 即可使用 `more` 分页器。从技术上讲，管道或 `|` 将 `ls --help` 命令的输出作为\
  \ `more` 命令的输入。请在书中提供的虚拟机上尝试此操作。\n\n![Images](img/note.jpg)\n\n**注意** 在第 13 章中，你将学习\
  \ `|` 符号的另一个用途，它表示“或”。例如，`a | b` 表示选项 `a` 或选项 `b`。\n\n# Linux 发行版\n\nLinux 发行版（distribution）是一种包含\
  \ Linux 内核以及特定选择的操作系统和应用软件的操作系统。软件的选择取决于发行版。在本节中，你将学习到：\n\n- 发行版之间的差异\n- Linux 衍生版\n\
  \n## 发行版差异\n\n发行版之间可能在技术或哲学上存在差异。某些发行版的设计是为了在特定环境中执行特定功能。另一些发行版则是基于发布者对开源指南的解释和遵循。\n\
  \n### 技术差异\n\n发行版之间的技术差异可以包括操作系统和应用软件、配置文件以及命令差异。\n\n例如，红帽（Red Hat）和 Debian 发行版存在以下差异：\n\
  \n- 它们使用不同的包管理器。\n- 相似配置文件的名称和位置各不同。\n- 它们在某些命令的实现上存在差异。\n\n例如，不同版本的 Linux 使用不同的方法安装软件。红帽企业\
  \ Linux (RHEL) 目前使用 `rpm`、`yum` 和 `dnf` 作为包管理器，而 Debian 则使用 `dpkg` 和 `apt`。\n\n\
  ![Images](img/note.jpg)\n\n**注意** 从 RHEL 8 开始，红帽使用 DNF 包管理器。\n\n当你登录 Linux 系统时，会执行多个配置文件。红帽中的登录配置文件是\
  \ `/etc/bashrc`，而 Debian 中的登录配置文件是 `/etc/bash.bashrc`。\n\n使用 `useradd` 命令创建新用户账户。红帽中的\
  \ `useradd` 命令与 Debian 中的 `useradd` 命令功能并不相同。红帽版本具有将用户添加到不同组的额外功能。（更多细节请见第 4 章。）\n\
  \n### 哲学差异\n\n发行版之间大多数哲学差异是基于它们对开源许可的解释。例如，Fedora 和 Debian 只使用自由和开源软件，而红帽允许专有（版权所有）软件。\n\
  \n### Red Hat (红帽)\n\n1994 年，Marc Ewing 开发了自己的名为 Red Hat Linux 的 Linux 发行版。1995\
  \ 年，Bob Young 购买了红帽并将他的 UNIX 软件发行公司与 Marc Ewing 的红帽公司合并。红帽是一个使用 Linux 内核的商业根发行版。红帽会提供源代码，但衍生版本必须删除任何对红帽以及由红帽销售组件的引用。\n\
  \n### Fedora\n\nFedora 是一个拥有大型开发社区的根 Linux 发行版。Fedora 使用更快的发布周期为用户提供最新的技术。由于 Fedora\
  \ 的方法很大程度上是实验性的，因此*不应*被用于生产环境。\n\nFedora 项目由红帽赞助。在 Fedora 中开发的许多进展都会引入红帽企业版（Red\
  \ Hat Enterprise）。\n\n![Images](img/note.jpg)\n\n**注意** 红帽企业版有一套独立的 Fedora 的质量测试，红帽提供的支持长达\
  \ 8 年，而 Fedora 只有 18 个月。\n\n### Debian\n\nDebian 是由 Ian Murdock 在 1993 年启动的根 Linux\
  \ 发行版。Debian 的目标是提供基于自由软件原则的操作系统。Debian 创建了 Debian 自由软件指南，用于确定哪些软件可以包含在 Debian 中。\n\
  \n![Images](img/note.jpg)\n\n**注意** 最初，Debian 提供两个发行版：一个发行版使用 Linux 内核，另一个使用 FreeBSD\
  \ 内核。\n\n## Linux 衍生版\n\n衍生版（derivatives）是基于发行版（根发行版）的操作系统。衍生操作系统可能通过增加更多软件或修改内核来关注特定任务。\n\
  \n![Images](img/note.jpg)\n\n**注意** 可以在 [`distrowatch.com`](https://distrowatch.com)\
  \ 获取有关发行版的大量信息。\n\nLinux 内核有多个根发行版和许多衍生版。让我们看看红帽和 Debian 的一些衍生版。\n\n### 红帽衍生版\n\n\
  SUSE 和 Oracle Unbreakable Linux 是红帽衍生版的示例。\n\n**SUSE**（Software- und System-Entwicklung）由一家位于德国的开源公司开发，其社区版本\
  \ OpenSUSE 都使用 YaST 而不是 Anaconda 作为安装程序，使用 `zypper` 而不是 `yum` 作为包管理程序，并默认使用 AppArmor\
  \ 而不是 SELux 来增强安全性。这些产品的某些将在第 11 章和 16 章中介绍。\n\n![Images](img/note.jpg)\n\n**注意**\
  \ 可以在 SUSE 中禁用 AppArmor 并安装 SELux。\n\n**Oracle Unbreakable Linux** Oracle Linux\
  \ 是红帽企业 Linux 的二进制兼容衍生版。Oracle 客户可以选择兼容内核或不可破坏企业内核（UEK）。UEK 经过优化以提供更好的性能。详情请访问 [`docs.oracle.com/en/operating-systems/uek/`](https://docs.oracle.com/en/operating-systems/uek/)\n\
  \n### Debian 衍生版\n\n虽然 Debian 有多个衍生版，我们将简要查看两个：Kali 和 Ubuntu。\n\n**Kali** Kali 是用于渗透测试的\
  \ Debian 衍生版之一。Kali 是为特定任务创建衍生版的示例。\n\n**Ubuntu** Ubuntu 是流行的 Debian 衍生版之一。Ubuntu（意为人类的\
  \ Linux）是一个设计哲学优先的示例。*Ubuntu* 一词被定义为一种包含慈情和人性等基本人类品质的品质。\n\n\n\n\n\nUbuntu 长期支持版本（Ubuntu\
  \ LTS）是生产环境唯一推荐的版本，因为这些版本提供至少 5 年的更新。其他版本与 Fedora 类似，它们是实验性的，且引入的产品可能会在未来的版本中消失。\n\
  \nLinux Mint 和 Xubuntu 是 Ubuntu 派生版的示例。\n\n![Images](img/exam.jpg)\n\n**考试提示** 考试侧重于\
  \ Red Hat 7 及更高版本的衍生版以及 Debian 10 及更高版本的衍生版。\n\n## Linux Linux 实现\n\n由于 Linux 是根据\
  \ GPL 协议分发的，软件供应商可以定制 Linux 以在各种角色中运行，包括以下：\n\n- 在桌面上使用 Linux\n- 在服务器上使用 Linux\n\
  - 在移动设备上使用 Linux\n- 在虚拟化中使用 Linux\n- 在云计算中使用 Linux\n- 使用嵌入式 Linux\n\n## 桌面版 Linux\n\
  \nLinux 经过优化后，可以作为桌面系统功能运行得非常好。然而，Linux 在进入该市场方面进展较为缓慢。截至 2022 年，Linux 仅占有约 2% 的桌面市场份额，而\
  \ Windows 占据了 90% 以上。\n\n历史上，Linux 缺乏适用于桌面的生产力应用程序。幸运的是，现在已有许多生产力应用程序使 Linux 成为桌面上可行的选择（例如\
  \ LibreOffice）。\n\n许多供应商一直致力于面向桌面的 Linux 发行版，旨在简化它。它们打包了如 LibreOffice 等应用程序套件，并添加了易于使用的图形界面。以下是一些较流行的桌面\
  \ Linux 发行版：\n\n- Ubuntu 桌面版 (Ubuntu Desktop Edition)\n- openSUSE\n- Fedora 桌面版\
  \ (Fedora Desktop Edition)\n\n## 服务器版 Linux\n\nLinux 在服务器上运行非常好。事实上，Linux 在机房中的接受程度远高于在桌面上的程度。根据所提供的服务，Linux\
  \ 占据了 40% 到 97% 的服务器市场份额。这是因为 Linux 可以承担各种服务器角色，包括以下，并执行得非常好：\n\n- **文件和打印服务器**：通过使用网络文件系统\
  \ (NFS)、通用 UNIX 打印系统 (CUPS) 或 Samba 服务，系统管理员可以配置 Linux 提供用户文件的网络存储和打印。\n- **Web\
  \ 服务器和数据库服务器**：Linux 已被广泛部署为 Web 服务器。事实上，目前在 Linux 上最流行的 Web 服务是 Apache Web 服务器结合\
  \ MySQL、MariaDB、NoSQL 或 PostgreSQL。\n- **电子邮件服务器**：Linux 提供了多种电子邮件服务，可以将您的系统转换为企业级邮件服务器。\n\
  - **超级计算机**：Linux 是部署高功率超级计算机的首选操作系统。\n\nLinux 作为服务器的普及归于多个原因，包括稳定性、性能和成本。Red Hat\
  \ 提供了 Red Hat Enterprise Linux (RHEL) 服务器发行版，它作为企业级服务器已有可靠的记录。SUSE Linux Enterprise\
  \ Server (SLES) 也针对服务器进行了优化。\n\n## 移动 Linux\n\nLinux 几乎以 Google 提供的 Android 操作系统的形式接管了移动设备市场，占据了智能手机市场近\
  \ 50% 的份额。Android 受欢迎是因为：\n\n- **价格**：它比 iOS 便宜得多。\n- **性能**：Android 在移动设备上的表现非常好。\n\
  - **App 支持**：Android 设备有大量的应用程序可用。\n\n## Linux 与虚拟化\n\n虚拟化是信息技术的一个方面，正在行业中获得巨大的动力。\n\
  \n传统上，一个操作系统（例如 Linux）安装在计算机上，对系统中所有资源拥有完全控制权，包括：\n\n- 内存 (RAM)\n- 处理器时间\n- 存储设备\n\
  - 网络接口\n\n虚拟化提供了一种替代部署模型。虚拟化将多个操作系统实例池化同一台计算机上，并允许它们并发运行。为了实现这一点，虚拟化使用名为 `hypervisor`\
  \ 的中间器来管理对系统资源的访问。\n\n每个操作系统实例都安装在 `virtual machine`（虚拟机）中，功能就像物理主机一样。这允许包括 Windows\
  \ 和 Linux 在内的多个平台在同一块硬件上同时运行。这对于软件开发者和测试人员来说是一个巨大的优势，使得测试开发中的应用程序在不同平台上的性能变得容易得多。\n\
  \nLinux 有多种虚拟化平台可用，包括：\n\n- Xen（开源）\n- VMware Workstation, Player, ESX 和 ESXi（专有）\n\
  - VirtualBox（开源）\n- KVM（开源）\n\n这些 hypervisor 将 Linux 系统变成一个可以运行虚拟机的 hypervisor。\n\
  \n### Linux 与 云计算\n\n虚拟化是云计算的关键组件，在云计算中，硬件、软件和/或网络资源被移至场外，并通过网络连接（甚至是互联网）进行交付。\n\
  \n通过云计算，互联网上的提供商在其所在地部署一个新的 Linux 虚拟机。客户支付费用通过其组织的网络连接访问此虚拟服务器。提供商承担实施、维护和保护服务器的所有责任。这种模型被称为基础设施即服务\
  \ (IaaS)。\n\n除了 IaaS，还有其他云模型，包括：\n\n- **软件即服务 (SaaS)**：通过云访问软件和数据。SaaS 的示例包括 Gmail、Outlook\
  \ 365 和 Salesforce。\n- **平台即服务 (PaaS)**：提供完成计算任务的完整解决方案，包括网络和存储。PaaS 的示例是 HTML 网站托管。\n\
  \n许多组织使用私有云搭建 Linux 和虚拟化，为组织的其他用户提供按需计算资源。\n\n## 嵌入式 Linux\n\nLinux 的优点之一是它可以优化到适用于\
  \ IoT（物联网）设备的小内存占用。Linux 非常适合嵌入到智能设备中，例如：\n\n- 网络路由器\n- 视频游戏系统\n- 智能电视\n- 智能手机和平板\n\
  \nLinux 经过定制仅提供基本功能，并删除了不必要的元素。操作系统最终嵌入设备内的闪存中。\n\n### 章节总结\n\n本章为你介绍了 Linux 内核的历史和基于\
  \ Linux 的发行版的结构。它还定义了发行版和派生版之间的区别，并解释了为什么存在不同的发行版。最后，它描述了基于 Linux 的发行版可能存在的各种环境。以下是本章的一些关键要点：\n\
  \n- Linux 是一个开源单体内核。\n- Linus Torvalds 在 20 世纪 90 年代初首次开发了 Linux 内核和 Linux 操作系统。\n\
  - Linux 遵循 GPL 。\n- 操作系统由内核系统软件和应用程序组成。\n- 内核层是操作系统的核心，提供进程、内存和任务管理。\n- 运行 `passwd\
  \ -S <username>` 显示账户状态。\n- 系统软件用于管理系统资源。\n- 应用程序用于执行用户任务。\n- Linux 发行版包含 Linux\
  \ 内（可能经过修改）以及一系列操作系统和应用程序软件。\n- 基于 Linux 的发行版为嵌入式系统以及桌面、服务器和云环境提供了稳定的环境。\n\n###\
