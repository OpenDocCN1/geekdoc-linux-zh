  \ 14-9** 使用 `dhclient` 获取 IP 地址租约\n\n### 练习 14-1：操作网络接口\n\n在此练习中，你将练习使用 `ifconfig`\
  \ 命令管理你的网络接口。你可以使用随书附的 CentOS 虚拟机进行此练习。\n\n![Images](img/video.jpg)\n\n**视频** 请观看练习\
  \ 14-1 视频以演示如何执行此任务。\n\n完成以下操作：\n\n1. **启动你的 Linux 系统并以 `student1` 用户登录。**\n2. **打开终端会话。**\n\
  3. **通过输入 `su -` 后跟密码切换到 root 用户账户。**\n4. **在 shell 提示符处，输入 `ip addr show`。记录关于你的以太网接口的以下信息：**\n\
  \   - MAC 地址\n   - IP 地址\n   - 广播地址\n   - 子网掩码\n5. **在 shell 提示符处，使用 `cd` 命令进入 `/etc/sysconfig/network-scripts`\
  \ 目录。**\n6. **使用 `ls` 命令识别网络网板的配置文件。**\n7. **使用 `cat` 命令查看以太网网络接口配置的内容。**\n8. **在\
  \ shell 提示符处输入 `ip link set enp0s17 down` 禁用接口。**\n9. **在 shell 提示符处输入 `ip link\
  \ set enp0s17 up` 恢复接口。**\n10. **在 shell 提示符处输入 `ip addr add 192.168.1.100 dev enp0s17`\
  \ 将分配给你的以太网接口的 IP 地址设置为 192.168.1.100。**\n11. **再次输入 `ip addr show` 并验证更改生效。**\n\
  12. **再次使用 `ip addr show` 命令将你的 IP 配置恢复为原值。**\n13. **如果你的网络段上有 DHCP 服务器，请修改你的网络接口配置使用\
  \ DHCP，并在 shell 提示符处输入 `dhclient enp0s17` 为你的以太网板动态分配 IP。**\n\n#### 配置路由参数\n\n在\
  \ IP 协议中，路由器正如其名所示：它们跨多个网络路由数据以将信息传递到目的地。路由器工作在网络层，用于连接不同的网络。\n\n\n\n\n路由器通常与网关配合使用，并在设置静态网络时需要定义。路由器硬件本身可能只是一个安装了两个网卡（NIC）的简单计算机系统，也可能是专门用于路由的专用硬件设备。\n\
  \n路由器通过维护可用路由的路由表来确定将数据传输到正确目的地的最方法。路由器使用一种评估距离、拥堵和网络状态的算法来确定通往目的地的最佳路由。即使没有配置为路由器，每个\
  \ Linux 系统在内存中都维护着路由表，以确定将网络上的数据发送到何处。\n\n在 Red Hat 类系统上配置默认路由器地址，请使用 `GATEWAY`\
  \ 参数更新 `/etc/sysconfig/network-scripts/ifcfg-<interface>` 文件，如所示：\n\n![Images](img/f0455-01.jpg)\n\
  \n在 Debian 类系统上配置默认路由器地址，请更新 `/etc/default/interfaces` 文件并添加一行网关配置，如所示：\n\n![Images](img/f0456-01.jpg)\n\
  \n![Images](img/note.jpg)\n\n**注意** 在此文件中，请使用 IP 地址，而不是主机名。如果 DNS 服务器宕机或无法访问，路由将被禁用。\n\
  \n添加网关设置后，只需重启网络即可，如所示：\n\n![Images](img/f0456-02.jpg)\n\n对于 CompTIA Linux+ 考试，你需要熟悉如何在\
  \ shell 提示符下使用 `route` 命令管理路由。使用 `route` 命令显示或修改 Linux 主机上的路由表。如果你在不带选项的情况下输入 `route`，它将仅显示当前路由表，如示例所示：\n\
  \n![Images](img/f0456-03.jpg)\n\n注意默认网关为 `10.0.0.1`，因为它列在 Gateway 设置下，并且在 Flags（标志）下显示为\
  \ `G`（`U` 表示连接已启用）。\n\n你可以通过输入以下命令向主机的路由表中添加路由：\n\n![Images](img/f0456-04.jpg)\n\
  \n例如，假设你需要通过 IP 地址为 `10.0.0.254` 的路由器为 `192.168.2.0/24` 网络添加路由。在这种情况下，你将输入内容：\n\n\
  ![Images](img/f0456-05.jpg)\n\n要删除现有路由，请使用\n\n![Images](img/f0456-06.jpg)\n\n这里有一个示例：\n\
  \n![Images](img/f0456-07.jpg)\n\n最后，要设置默认路由，在 shell 提示符下输入 `route add default gw\
  \ <router_address>`。例如，如果你想将 `10.0.0.254` 作为你的默认网关路由器，请输入此：\n\n![Images](img/f0457-01.jpg)\n\
  \n![Images](img/note.jpg)\n\n**注意** 使用 `route` 或 `ip route` 命令进行的更改不是持久的，重启后会丢失。\n\
  \n`ip` 命令也可用于管理路由。例如，要查看路由表，在 shell 提示符下输入 `ip route show` 或直接输入 `ip route`，如所示：\n\
  \n![Images](img/f0457-02.jpg)\n\n要向路由表添加静态路由，在 shell 提示符下输入以下内容：\n\n![Images](img/f0457-03.jpg)\n\
  \n以下示例显示了向 `192.168.5.0/24` 网络添加路由 `10.0.0.254`：\n\n![Images](img/f0457-04.jpg)\n\
  \n要从路由表中删除路由，在 shell 提示符下输入 `ip route del <network/prefix>`。例如，要删除 `192.168.5.0/24`\
  \ 路由，输入以下内容：\n\n![Images](img/f0457-05.jpg)\n\n### 路由网络配置问题排除\n\n添加默认网关后，如果仍然无法访问互联网，请运行\
  \ `route` 命令确保路由器处于运行状态。如果没有出现默认路由器且其他计算机无法连接互联网，说明你的路由器已宕机，需要重启或更换。\n\n### 配置名称解析设置\n\
  \n当你打开浏览器窗口并在 URL 字段中输入 `http://www.google.com` 时，浏览器、IP 栈和操作系统并不知道去哪里获取请求的信息。为了使此功能正常，本地系统需要首先将域名解析为\
  \ IP 地址。\n\n在过去，基础的主机名到 IP 地址的解析是由 `/etc/hosts` 文件完成，该文件包含 IP 地址到主机名的映射。\n\n![Images](img/note.jpg)\n\
  \n**注意** Linux 系统上仍然存在 `/etc/hosts` 文件。事实上，它是默认使用的第一个名称解析器。只有当 `hosts` 文件中不存在请求的域名的记录时，操作系统才会尝试使用\
  \ DNS 解析主机名。非常小心地管理 `hosts` 文件非常重要，因为它可能被利用。\n\n恶意软件会尝试重写 `/etc/hosts` 文件，将其指向虚假银行网站的名称映射，但实际上是旨在窃取用户个人信息的复杂网络钓鱼网站（pharming\
  \ websites）。\n\n`hosts` 文件中每个主机记录占一行。其语法格式为\n\n![Images](img/f0458-01.jpg)\n\n例如，考虑以下\
  \ `/hosts` 条目：\n\n![Images](img/f0458-02.jpg)\n\n这会将 `192.168.1.1` 映射到 `mylux.mydom.com`。使用\
  \ `/hosts` 文件来解析主机名是可以的，但作为唯一的解析手段不可行的，因为为了解析互联网上所有的域名，该文件将变得巨大。\n\n更好的选项是将域名提交给\
  \ DNS 服务器。当 DNS 服务器接收请求时，它会将域名与 IP 地址进行匹配。工作原理如下：\n\n1. 需要解析主机名的系统向其配置使用的 DNS 服务器的\
  \ `53` 端口发送请求。如果该 DNS 服务器是主机所在区域的权威服务器，它将响应相应的 IP 地址。如果不是，则继续第 2 步。\n\n![Images](img/note.jpg)\n\
  \n**注意** 如果 DNS 服务器在其数据库中有该域名的记录，则被认为是权威的。\n\n2. DNS 服务器向根 DNS 服务器发送请求。互联网上有 13\
  \ 个根 DNS 服务器。每个 DNS 服务器都自动配置了这些服务器的 IP 地址。这些根 DNS 服务器配置了解析到每个顶级域名（`.com`, `.gov`,\
  \ `.edu`, `.au`, `.de`, `.uk`, `.ca`）的权威 DNS 服务器的记录。\n\n3. DNS 服务器向客户端系统响应映射到主机名的\
  \ IP 地址。\n\n![Images](img/note.jpg)\n\n**注意** 一旦针对特定的名称映射发生了此过程，大多数 DNS 服务器都会缓存该映射一段时间。这样，再次收到相同的解析请求时，可以直接响应。\n\
  \n因此，为了使此系统工作，管理员必须为系统提供要使用的 DNS 服务器 IP 地址。这在 `/etc/resolv.conf` 文件中配置。该文件定义了搜索前缀和要使用的名称服务器。以下是\
  \ CentOS 系统 `/etc/resolv.conf` 文件的示例内容：\n\n![Images](img/f0459-01.jpg)\n\n如所示，该文件包含两种条目：\n\
  \n- `search`：指定用于补全不完整主机名的域名。例如，如果系统尝试解析主机名 `WS1`，则该名称将自动转换为完全限定域名 `WS1.mydom.com`。语法格式为\
  \ `search <domain>`。\n\n\n\n\n- `nameserver` 指定用于名称解析的 DNS 服务器的 IP 地址。你可以配置最多三个\
  \ DNS 服务器。如果第一台服务器失败或无法访问，则将使用下一个 DNS 服务器。语法格式为 `nameserver <DNS_server_IP_address>`。\n\
  \n使用 `/etc/nsswitch.conf`（名称服务切换）文件来定义服务用于名称解析的顺序。这里是该文件中你需要关注的两个行：\n\n![Images](img/f0459-02.jpg)\n\
  \n这两条目指定了在进行名称解析时首先查询 `/etc/hosts` 文件（`files`）。如果没有相应的条目，则会将查询发送到 `/etc/resolv.conf`\
  \ 文件中指定的 DNS 服务器（`dns`）。如果想先搜索 `dns` 再搜索 `files`，请按右图所示-所示所示 更改 `/etc/nsswitch.conf`\
  \ 中的顺序：\n\n![Images](img/f0459-03.jpg)\n\n### 排除名称解析故障\n\n如果你在访问网站时遇到问题，请首先使用 `ping`\
  \ 和 `traceroute` 确保你的网络连接运行正常。验证连接后，双重检查 `/etc/resolv.conf` 和 `/etc/nsswitch.conf`\
  \ 中的条目。\n\n如果 `/etc/resolv.conf` 中未定义 `nameserver` 字段或 `/etc/nsswitch.conf` 中没有\
  \ `dns` 条目，那可能就是问题所在。修正后，你可以再次使用 `ping` 和 `traceroute` 验证是否成功。\n\n### 配置 IPv6\n\n\
  如前所述，全球注册的 IP 地址供应已经耗尽。为了解决这个问题，大多数组织通过实施 NAT 路由器来减少它们所需的注册 IP 地址数量。然而，使用 NAT 路由器只是短期解决方案。为了完全解决这个问题，发布了新版本的\
  \ IP 协议来处理现代计算世界所需的 IP 地址数量。\n\n为了实现这一目标，IP 版本 6 (IPv6) 正在全球范围内推出。预计 IPv6 将未来十年内完全取代\
  \ IPv4。IPv6 不使用 32 位，而是定义了 128 位 IP 地址，这允许总共 340,282,366,920,938,463,463,374,607,431,768,211,456\
  \ 个唯一的 IP 地址。（希望这足够了！）\n\nIPv6 地址由八个四个字符的十六进制数（称为 `hextets`）组成，用冒号而不是点号分隔。每个 hextet\
  \ 表示为 0 到 FFFF 之间的十六进制数。例如，一个有效的 IPv6 地址是 128 位的，显示为 35BC:FA77:4898:DAFC:200C:FBBC:A007:8973。\n\
  \n对于地址为 1:2:3:a:b:c:d:e 的 IPv6 地址，假设每个 hextet 都以零开头，那么该地址与 0001:0002:0003:000a:000b:000c:000d:000e\
  \ 相同。\n\n![Images](img/exam.jpg)\n\n**考试贴士** 因为 IPv6 地址非常长，所以它们经常会被缩写。如果地址包含一长串多个零，可以通过指定\
  \ `::` 来省略它们。如果 0000 在地址中出现一次以上，则缩写只能使用一次。例如，IPv6 地址 2001:0000:3a4c:1115:0000:0000:1a2f:1a2b\
  \ 可以显示为 2001::3a4c:1115:0000:0000:1a2f:1a2b 或 2001:0000:3a4c:1115::1a2f:1a2b。\n\n\
  在 IPv6 地址方面有几种配置选项。第一种是使用静态分配。与 IPv4 类似，静态 IPv6 地址分配需要你手动将整个 128 位 IPv6 地址和前缀分配给主机。这可以在\
  \ shell 提示符下使用 `ifconfig` 或 `ip` 等命令行工具完成。或者，你可以在 `/etc/sysconfig/network` 中相应的接口配置文件中手动输入地址和前缀，或使用\
  \ `nmcli`。\n\n最后一个 IPv6 地址配置选项是使用 DHCP。与 IPv4 类似，可以使用称为 DHCPv6 的更新版本 DHCP 进行 IPv6\
  \ 地址分配。\n\n### 排除网络问题\n\n安装网络接口只是成功了一半。为了实现通信，你需要使用各种测试和监控工具来确保网络本身运行正常。为了通过 CompTIA\
  \ Linux+ 考试，你需要理解以下主题：\n\n- 使用标准化的故障排除模型\n- 使用 `ping`\n- 使用 `netstat`\n- 使用 `traceroute`\n\
  - 使用 `nc`\n- 使用名称解析工具\n- 在网络上同步时间\n\n![Images](img/note.jpg)\n\n**注意** 如果必要，请在 CentOS\
  \ 类系统上以 `root` 身份运行以下命令安装这些实用程序。该套件包含了 `net-tools` 和 `iproute2`：\n\n```bash\n# yum\
  \ install nfs-utils nmap-ncat samba-client iproute\n```\n\n### 使用标准化的故障排除模型\n\n\
  成为良好的故障排除者是成为高效 Linux 系统管理员的关键组成部分。一些新管理员似乎对排除问题有一种天生的直觉；而另一些人则将五分钟的解决方案变成了五小时的谜题。其原因在于故障排除既是一门艺术也是一门科学。正如对于某些人来说学习绘画、雕塑或绘画很困难一样，对于某些人来说学习故障排除也很困难。\n\
  \n有效排除故障有三个关键：\n\n- 使用稳健的故障排除程序\n- 获得故障排除工具的实用知识\n- 积累大量的故障排除经验\n\n最后一点超出了本书的范围。获得故障排除经验的唯一方法是在该领域花费几年。然而，我们可以从前两点入手。在本章的最后部分，我们将专门关注排除网络问题。但是，我们在这里讨论的程序可以广泛应用于任何系统问题。\n\
  \n许多新系统管理员在排除系统或网络问题时会犯一个关键错误。他们没有使用系统的方法故障排除方法，而是在还没有真正知道问题所在之前就开始尝试实施修复。管理员尝试一个接一个修复方案，希望其中某一个可以修复问题。\n\
  \n`尽管 CompTIA Linux+ 考试没有涵盖故障排除模型，` 但这里提供了一个作为新系统管理员起点的故障排除模型：\n\n- **第 1 步：收集信息。**\
  \ 这是一个关键步骤。确定到底发生了什么。症状和错误信息是什么？问题的范围有多大？\n- **第 2 步：识别变化。** 在这一步中，识别系统中发生了哪些变化。是否安装了新的软件或硬件？用户是否更改了某些内容？\n\
  - **第 3 步：建立假设。** 开发几个可以解释问题的假设。检查互联网上提供的常见问题和知识库。与同事咨询以验证你的假设。将结果缩小到一个或两个可能的原因。\n\
  - **第 4 步：确定合适的修复方案。** 利用同事、常见问题和经验确定修复问题所需的步骤。识别实施修复的副作用并考虑到它们。通常，修复方案产生的副作用可能比原始问题更严重。\n\
  - **第 5 步：实施修复。** 注意，在这一故障排除模型中，在实施修复之前做了大量的研究！这增加了成功的可能性。实施修复后，务必验证修复是否确实修复了问题。\n\
  - **第 6 步：确保用户满意。** 教会用户如何防止问题再次发生。与用户的主管沟通，确保他们知道问题已经解决。\n- **第 7 步：记录解决方案。** 最后，记录解决方案。如果它在一年后再次发生，团队可以快速识别问题并知道如何修复它。\n\
  \n通过使用这种方法，你可以学会成为一个非常高效的故障排除者，并在现实世界中获得实践经验。\n\n除了使用故障排除方法外，你还需要学会如何为 CompTIA Linux+\
  \ 考试使用各种网络故障排除工具。\n\n### 使用 `ping`\n\n\n\n\n\n`ping` 实用是网络虚拟工具箱中最实用的工具之一。`ping`\
  \ 命令用于测试网络上主机之间的连通性。`ping` 的工作原理是从源系统向目标系统发送 ICMP 回显请求数据包。目标系统随后响应 ICMP 回显响应数据包。这一过程如图图\
  \ 14-10 所示。\n\n![Images](img/F14-10.jpg)\n\n**图 14-10** 使用 `ping`\n\n如果发送系统收到了 ICMP\
  \ 回显响应数据包，你就知道三件事：\n\n• 你的网络接口工作正常。\n• 目标系统已启动且运行正常。\n• 你的系统与目标系统之间的网络硬件工作正常。\n\n\
  ![Images](img/caution.jpg)\n\n**注意** 请注意，许多操作系统使用的许多主机防火墙默认配置为不响应 ICMP 回显请求数据包。这样做是为了防止各种利用大量\
  \ `ping` 请求的拒绝服务 (DoS) 攻击。这种配置可能会产生目标系统已离线的假象。\n\n使用 `ping` 的基本语法是 `ping <destination_IP_address>`。这会向指定主机发送\
  \ ICMP 回显请求数据包。例如，输入 `ping 192.168.2.1` 来测试具有此地址的主机。如图图 14-11 所示。\n\n![Images](img/F14-11.jpg)\n\
  \n**图 14-11** 通过 IP 地址 ping 主机\n\n注意图图 14-11，发送的每个 `ping` 结果都显示在单行中。每行显示回显响应数据包的大小（64\
  \ 字节）、其来源（192.168.2.1）、其生存时间值（63）以及往返时间（4.25 ms 到 1.01 ms）。\n\n![Images](img/note.jpg)\n\
  \n**注** 存活时间 (`TTL`) 值指定了数据包在被丢弃之前允许穿越的路由器数量。\n\n默认情况下，`ping` 实用程序将继续向指定主机发送 `ping`\
  \ 请求，直到按下 `Ctrl-c` 停止。使用 `ping` 命令的 `-c` 选项来指定 ping 的次数。例如，输入 `ping -c 10 192.168.2.1`\
  \ 来 ping 10 次然后退出。\n\n通过主机名 ping 如图图 14-12 所示。\n\n![Images](img/F14-12.jpg)\n\n\
  **图 14-12** 通过主机名 ping\n\n通过主机名 ping 可以是一个非常有价值的故障排除工具，因为它可以标示出 DNS 服务器是否存在问题。例如，通过\
  \ IP 地址 ping 可以通，但通过主机名 ping 则不通。\n\n### 使用 `netstat`\n\n`netstat` 实用是虚拟工具箱中的另一个强大工具。该实用程序可以执行以下操作：\n\
  \n• 列出网络连接\n• 显示路由表\n• 显示有关网络接口的信息\n\n使用 `netstat` 的语法是在 shell 提示符处输入 `netstat <option>`。使用表\
  \ 14-6 中列出的选项。\n\n![Images](img/f0464-02.jpg)\n\n**表 14-6** `netstat` 选项\n\n![Images](img/exam.jpg)\n\
  \n**考试提示** `ss` (“显示套字”)命令是 `netstat` 的替代命令，具有更多功能，可以更好地检查网络状态。尝试运行命令 `ss -neopa`\
  \ 并观察所有 socket 的状态。\n\n### 使用 `traceroute`\n\n当信息发送到不在你本地网络网段的 IP 主机时，数据包将发送到默认网关路由器。该路由器将使用各种路由协议来确定如何将数据包传到目的地。在此过程中，数据包从路由器传输到路由器以到达目的地，如图图\
  \ 14-13 所示。\n\n![Images](img/F14-13.jpg)\n\n**图 14-13** IP 网络中的路由\n\n这是 IP 网络的优势。网络管理员可以使用路由器将多个网络连接起来并在它们之间传输数据。路由器使用的路由协议会根据系统负载动态确定数据包采用的最佳路径。所选路径随着网络状况的变化而改变。\n\
  \n`traceroute` 实用程序用于跟踪数据包穿越这些路由器到达目的地的路径。它使用与 `ping` 实用相同的 ICMP 回显请求和 ICMP 回显响应数据包，但它操纵了这些数据包的\
  \ `TTL` 参数。结果是，数据包在向目标主机传输的过程中，穿越的每个路由器都会向源系统发回 ICMP 回显响应数据包，提供一个显示源系统和目标系统之间路径的列表。\n\
  \n该实用程序在排除网络之间的通信问题非常有用，因为它可以追踪到哪个路由器未正常工作。使用该实用程序的语法是 `traceroute <destination_hostname_or_IP_address>`。`traceroute`\
  \ 命令为数据包通往目的地过程中穿越的每个路由器创建一行。如图图 14-14 所示。\n\n![Images](img/F14-14.jpg)\n\n**图 14-14**\
  \ 使用 `traceroute`\n\n如你在图图 14-14 所示，路由器的 IP 地址将同往返时间统计一起显示。\n\n`mtr` (“my traceroute”)命令是一种结合了\
  \ `traceroute` 和 `ping` 功能的网络诊断工具。要查看 `mtr www.yahoo.com` 的结果，请参见图 14-15。输出显示了连接的质量。\n\
  \n![Images](img/F14-15.jpg)\n\n**图 14-15** `mtr` 命令的输出\n\n### 使用 `nc`\n\n`nc` (“netcat”)命令是一个测试网络通信非常有用的工具。它比\
  \ `ping` 命令更进一步，可以在主机之间建立连接。使用此命令的方法之一在一个主机上打开一个监听 socket，然后从另一个主机连接它。在下面的示例中，使用\
  \ `-l` 选项在端口 2388 上启用监听 socket：\n\n```\nnc -l 2388\n```\n\n![Images](img/f0467-01.jpg)\n\
  \n在服务器开启监听 socket 后，客户端可以使用 `nc` 命令连接它，此时输入服务器的 IP 地址和监听端口：\n\n```bash\nnc server_ip\
  \ 2388\n```\n\n![Images](img/f0467-02.jpg)\n\n一旦建立连接，在客户端提示符处输入的任何文本都将出现在 netcat\
  \ 服务器上，如下所示：\n\n![Images](img/f0467-03.jpg)\n\n![Images](img/exam.jpg)\n\n**考试提示**\
  \ 确保两个系统上的防火墙都开放了适当的端口；否则测试将失败！\n\n### 使用名称解析工具\n\n使用 DNS 进行名称解析效果极佳——直到它失效为止！幸运的是，有几种工具可用于排除网络上的名称解析故障：\n\
  \n• `dig`\n• `host`\n• `nslookup`\n• `resolvectl`\n\n![Images](img/note.jpg)\n\n\
  **注** 要安装这些实用程序，请在 CentOS 类系统上以 `root` 身份运行以下：\n```bash\nyum install bind-utils\n\
  ```\n\n#### `dig`\n\n域名信息分组器（或 `dig`）实用程序在网络上执行 DNS 查询，并显示有关从 `/etc/resolv.conf`\
  \ 文件配置的 DNS 服务器解析的主机的详细信息。其语法为 `dig <hostname>`，如图图 14-16 所示。\n\n![Images](img/F14-16.jpg)\n\
  \n**图 14-16** 使用 `dig` 解析主机名\n\n`dig` 的输出比 `nslookup` 和 `host` 等 DNS 故障排除工具显示的要详得多，因为它显示的不仅仅是主机的\
  \ IP 地址。它还列出了主机和区域的权威名称服务器。\n\n#### `host`\n\n`host` 命令解析主机名。`dig` 命令提供详尽的名称解析信息，而\
  \ `host` 提供简单、快速的信息。其语法与 `dig` 类似。在 shell 提示符处输入 `host <hostname>`。使用 `host` 的示例在此：\n\
  \n![Images](img/f0468-02.jpg)\n\n#### `nslookup`\n\n\n\n\n\n除了 `host` 和 `dig` 之外，`nslookup`\
  \ 也可以测试名称解析，如下：\n\n![Images](img/f0468-03.jpg)\n\n#### `resolvectl`\n\n`resolvectl`\
  \ 命令是一个显示 DNS 服务器的有用工具。这里是 `resolvectl`（或可选 `resolvectl status`）命令的部分输出：\n\n![Images](img/f0469-01.jpg)\n\
  \n使用 `query` 选项对域名进行正向或反向查找，如下：\n\n![Images](img/f0469-02.jpg)\n\n![Images](img/exam.jpg)\n\
  \n**考试提示** 使用 `whois` 命令获取网站域名的所有信息，前提是所有者没有将其屏蔽。`whois <domain_name>` 命令将列出他们的姓名、电话号码和地址。\n\
  \n#### 在网络上同步时间\n\n网络时间同步的一种方法是使用网络时间协议 (NTP) 与网络时间提供者同步时间。如果与网络时间提供者存在时间差异，NTP\
  \ 将以小增量逐渐调整时间，直到最终完成同步。Linux 上的 `ntpd` 守护进程与 NTP 时间提供者同步时间，并在 IP 端口 123 上运行。\n\n\
  以下是几个关键 NTP 概念，它们在 CompTIA Linux+ 考试中不会被测试，但在设置时间服务器环境时是有必要的：\n\n• **层级 (Stratum)**\
  \ NTP 使用 `stratum` 概念来定义 NTP 服务器的层次结构：\n\n• **第 1 层** 从参考时间源（例如海军原子钟）获取时间的服务器服务器；例如\
  \ `tick.usno.navy.mil` 和 `tock.usno.navy.mil`\n\n• **第 2 层** 从 `stratum 1` 服务器获取时间的时间服务器\n\
  \n• **第 3 层** 从 `stratum 2` 服务器获取时间的时间服务器\n\n要定义你的时间服务器，请修改 `/etc/ntp.conf`。你需要做的第一件事是确保本地时钟存在以下条目（如果时间服务器不可用，将使用本地时钟）：\n\
  \n![Images](img/f0469-03.jpg)\n\n这些指令告诉 `ntpd` 守护进程在无法访问任何配置的 NTP 时间提供者时从本地时钟获取时间。\n\
  \n接下来，在文件中添加用于与网络时间提供者同步时间的条目。语法如下：\n\n![Images](img/f0470-01.jpg)\n\n你可以指定任何想要使用的\
  \ NTP 时间提供者的 IP 地址或 DNS 名称。访问 [`support.ntp.org/Servers/WebHome`](https://support.ntp.org/Servers/WebHome)\
  \ 查看公开的 NTP 时间提供者列表。\n\n如果你愿意，可以使用来自 [`pool.ntp.org`](http://pool.ntp.org) 域的 `NTP\
  \ 池时间服务器`，它使用 DNS 轮询从自愿加入池的时间提供者池中进行随机选择。这样，就不会有一个公共 NTP 服务器会被时间同步请求所过载。要使用此功能，只需在\
  \ `/etc/ntp.conf` 中添加以下服务器指令：\n\n![Images](img/f0470-02.jpg)\n\n要启动 `ntpd`，在 shell\
  \ 提示符输入 `systemctl start ntp`。你可以通过在 shell 提示符输入 `systemctl status ntp` 来验证它是否正确启动。\n\
  \n一旦 `ntpd` 守护进程启动，你可以使用两个命令来跟踪 `ntpd` 守护进程的工作情况：\n\n• `ntpq –p` 此命令查询 `ntpd` 守护进程的状态。例如：\n\
  \n![Images](img/f0470-03.jpg)\n\n• `ntptrace` `ntptrace` 工具跟踪时间消费者如何从提供者处接收时间。它列出了时间提供者的名称、其层级以及相对于本地系统时钟的时间偏移。\n\
  \n#### 使用 `chrony` 保持计算机时准确\n\n`chrony` 工具使用两个程序来保持时准确：`chronyd` 和 `chronyc`。`chronyd`\
  \ 工具是管理时间的后台程序，而 `chronyc` 是用户跟踪和验证时间的命令行界面。\n\n`chrony` 配置文件为 `/etc/chrony.conf`，示例所示：\n\
  \n![Images](img/f0470-04.jpg)\n\n运行 `systemctl start chronyd` 启动 `chrony`。要验证活动，运行\
  \ `chronyc tracking`。这里显示部分输出：\n\n![Images](img/f0471-01.jpg)\n\n`Reference ID`\
  \ 代表时间服务器的名称和/或 IP 地址。`Stratum` 是距离第 1 层时间服务器的跳数。`Ref time` 是从时间服务器最后测量的 UTC 时间。\n\
  \n`chrony` 优于 NTP 的一个优点是它可以帮助通常关机或断开互联网的系统保持时间。\n\n#### 练习 14-2：使用网络命令\n\n在此练习中，你将练习使用网络命令来管理和排除网络接口的故障。此练习假设你已连接到互联网。你可以使用随书提供的\
  \ CentOS 虚拟机进行此练习。\n\n![Images](img/video.jpg)\n\n**视频** 请观看练习 14-2 视频演示如何执行此任务。\n\
  \n完成以下步骤：\n\n1. 启动你的 Linux 系统并以 `student1` 用户身份登录。\n\n2. 打开终端会话。\n\n3. 输入 `su -`\
  \ 后输入密码切换到你的 `root` 用户账户。\n\n4. 在 shell 提示符输入 `ping www.google.com` 测试连通性。你的系统应该将主机解析为\
  \ IP 地址并向其发送 ICMP 回显请求包。（如果你的系统未连接到互联网，此步骤将无效。）\n\n![Images](img/note.jpg)\n\n**注意**\
  \ 如果你无法 `ping` 远程网站，请使用 `ifconfig` 命令验证是否已分配 IP 地址。如果未分配地址，输入 `systemctl restart\
  \ network` 重新加载网络。\n\n5. 通过 `netstat -s | more` 显示网络接口的摘要信息。\n\n6. 输入 `traceroute\
  \ www.google.com` 追踪到 `www.google.com` 的路由。注意数据包穿越互联网时经过的各种路由器。\n\n7. 输入 `dig www.google.com`\
  \ 生成关于 `www.google.com` 的扩展名称解析。\n\n## 理解网络文件系统\n\n对于 CompTIA Linux+，你需要熟悉两种网络文件系统：\n\
  \n• 网络文件系统 (NFS)\n\n• Samba\n\nNFS 允许用户在中立网络上挂载文件系统。Samba 允许 Linux 系统在 Windows 网络上挂载文件系统。你应该理解访问这些文件系统的基础。\n\
  \n### 网络文件系统 (NFS)\n\n大多数网络允许通过 NFS 共享文件系统。为了让 NFS 正常运行，所有系统都需要运行 NFS。对于 Windows\
  \ 系统，这意味着安装 PC-NFS。macOS 内置了 NFS Manager。\n\n一旦 NFS 服务器设置妥当，其“共享”即可被 NFS 客户端访问。要查看可能的共享，运行\
  \ `showmount` 命令：\n\n![Images](img/f0472-01.jpg)\n\n要访问共享的 NFS 目录，使用 `mount` 命令和\
  \ NFS 服务器名称（`system5`），如下：\n\n![Images](img/f0472-02.jpg)\n\n可能会出现管理员尝试挂载网络文件系统但远程系统宕机的情况。NFS\
  \ 有一个名为“自动挂载”(automounting) 的功能来缓解此问题，一旦远程文件系统可用，会自动挂载。\n\n### Samba\n\n对于严重依赖 Windows\
  \ 系统的组织，与其在几台 Windows 上安装 PC-NFS，不如利用 Windows 网络上提供的 SMB 协议。一旦 Samba 服务器设置，可以使用\
  \ `smbclient` 命令查看共享文件系统：\n\n![Images](img/f0473-01.jpg)\n\n从 Windows 访问共享文件系统时，使用\
  \ `mount` 命令并跟两个正斜杠。这表示挂载正在使用 SMB。以下是来自 `win2` 系统的示例：\n\n![Images](img/f0473-02.jpg)\n\
  \n**注意** NFS 和 Samba 均允许在启动时可用共享目录。只需将共享添加到 `/etc/fstab` 文件中。\n\n### 章节复\n\n\n\n\
  \n\n在本章中，你学习了如何在 Linux 系统上设置网络。在大多数现代组织中，你很可能会与以太网网卡和 `IP` 协议进行工作。\n\n互联网协议 (`IP`)\
  \ 与传输控制协议 (`TCP`) 或用户数据报协议 (`UDP`) 协同工作，对网络数据进行分段、传输、去分段和重排序，以实现主机之间的通信。我们还查看了互联网控制消息协议\
  \ (`ICMP`)，它是 `IP` 协议族中的另一个核心协议。`ICMP` 的主要作用是测试和验证主机之间的网络通信。\n\n网络上的每个主机都必须被分配一个配置正确且唯一的\
  \ `IP` 地址，并分配正确的子网掩码。子网掩码定义了给定主机 `IP` 地址中有多少部分是网络地址。以二进制形式查看，子网掩码中任何为 `1` 的位都代表网络地址，任何为\
  \ `0` 的位都代表主机地址。`IP` 地址分为以下几类：\n\n* `Class A`: `255.0.0.0` = `11111111.00000000.00000000.00000000`\
  \ 二进制\n* `Class B`: `255.255.0.0` = `11111111.11111111.00000000.00000000` 二进制\n\
  * `Class C`: `255.255.255.0` = `11111111.11111111.11111111.00000000` 二进制\n\n同一网段上的主机必须具有相同的网络地址才能进行通信。因此，必须为每个主机分配相同的子网掩码。\n\
  \n为了将域名解析为 `IP` 地址，Linux 系统还必须配置组织 `DNS` 服务器的 `IP` 地址。此外，系统必须配置默认网关地址，以便与其他网络段段的主机进行通信。\n\
  \n我们还回顾了公有和私有 `IP` 地址划分。互联网允许使用公有网络。私有网络仅允许在局域网 (`LANs`) 中使用。`NAT` 路由器将私有网络隐藏在一个或多个公有接口之后。`IPv6`\
  \ 地址由八个四位十六进制数组成，用冒号代替点号。\n\n要分配 `DNS` 服务器地址或默认网关地址，请编辑 `/etc/resolv.conf` 配置文件。要关闭网络接口，在\
  \ shell 提示符处输入 `ifdown`。要启用它，输入 `ifup`。要使用 `DHCP` 服务器为 Linux 主机动态分配 `IP` 地址信息，在\
  \ shell 提示符处输入 `dhclient <interface>`。\n\n本章讨论了几个你可以用于测试和监控网络的命令行工具，例如 `ping`、`traceroute`\
  \ 和 `mtr`。\n\n`nc` 命令在两个主机之间建立连接。首先在一个主机上打开一个监听套接，然后从另一个主机连接到该套接。\n\n通过网络时间服务器同步时间的工具是\
  \ `NTP` 和 `chrony`。对于经常关机的系统，请使用 `chrony`。\n\n用于名称解析的工具包括 `dig`、`host`、`resolvectl`\
  \ 和 `nslookup`。`whois` 命令详细列出了域名所有者、电话和地址。\n\n最后，考试涵盖了两个允许远程挂载文件系统的工具。`NFS` 最适用于无厂商限制的环境，而\
  \ `Samba` 允许从 Windows 系统进行共享。\n\n请确保你理解这些关于管理网络设置的关键点：\n\n* 协议是一种通用的网络语言，必须为网络主机配置以便进行通信。\n\
  * 互联网协议 (`IP`) 与 `TCP` 或 `UDP` 协同工作，对网络数据进行分段、传输、去分段和重排序。\n* 互联网控制消息协议 (`ICMP`)\
  \ 用于通过 `traceroute` 和 `ping` 测试和验证主机之间的网络通信。\n* 端口允许具有单一 `IP` 地址的单一主机提供多个网络服务。\n\
  * IPv4 网络上的每个主机都必须分配唯一的 `IP` 地址以及正确的子网掩码。\n* 子网掩码定义了给定主机 `IP` 地址中有多少部分是网络地址，多少部分是\
  \ `IP` 地址。\n* 同一网段上的主机必须具有相同的子网掩码，且必须分配给每个主机。\n* 网络主机必须配置 `DNS` 服务器的 `IP` 地址，以便将域名解析为\
  \ `IP` 地址。\n* 网络主机必须配置网段默认网关路由器的 `IP` 地址，以便与其他网络段的主机通信。\n* `IPv6` 地址由八个四位十六进制数组成，用冒号代替点号。\n\
  * 在每个类 `IP` 地址中，都有被称为私有或保留 `IP` 地址的地址块：\n    * `10.0.0.0–10.255.255.255` (`Class\
  \ A`)\n    * `172.16.0.0–172.31.255.255` (`Class B`)\n    * `192.168.0.0–192.168.255.255`\
  \ (`Class C`)\n* `NAT` 路由器将私有网络隐藏在一个或多个公有接口之后。\n* 你可以在 shell 提示符处输入 `ifconfig` 或\
  \ `ip addr show` 来查看安装的网络接口的详细信息。\n* 要为网络接口分配 `IP` 地址，在 shell 提示符处使用 `ifconfig`\
  \ 或 `ip addr add`。\n* 要使 `IP` 地址分配持久化，将它们输入 `/etc/` 目录下的相应文件中。\n* 使用 `ip` 命令管理网络接口。\n\
  * 在 `/etc/resolv.conf` 文件中输入组织的 `DNS` 服务器地址。\n* 要为 Linux 主机动态分配 `IP` 地址，在 shell\
  \ 提示符处输入 `dhclient <interface>`。\n* 使用 `ping` 测试系统间的连接性。语法为 `ping <destination_host>`。\n\
  * 使用 `netstat` 命令通过 `-a`、`-i` 和 `-r` 选项查看各种网络信息。\n* 使用 `traceroute` 追踪到远程系统的路由路径。语法为\
  \ `traceroute <destination_host>`。\n* `mtr` 通过显示耗时间结合了 `ping` 和 `traceroute` 的功能。\n\
  * 使用 `route` 或 `ip route` 查看路由。\n* 使用 `nc` 测试 `TCP` 或 `UDP` 通信。\n* 使用 `NTP` 或 `chrony`\
  \ 同步时间。\n* 使用 `dig`、`host`、`resolvectl` 和 `nslookup` 测试 DNS。\n* `whois` 提供域名所有权信息。\n\
  \n#### 题目\n\n1. 关于 MAC 地址，以下哪些说法是正确的？（选择）\n* A. 它是硬编码的。\n* B. 它由操作系统逻辑地分配。\n* C.\
  \ 它是全局唯一的。\n* D. 网络管理员可以配置它的值。\n* E. 它是 DNS 服务器使用的。\n\n2. 哪种传输协议适用于低延迟且可以忍受不可靠性的应用程序？\n\
  * A. 用户数据报协议\n* B. 传输控制协议\n* C. 互联网协议\n* D. 互联网控制消息协议\n\n3. OSI 层实现了数据路由？\n* A.\
  \ 数据链路\n* B. 网络层\n* C. 传输层\n* D. 会话层\n* E. 应用层\n\n4. 你刚刚在 Linux 系统上设置了电子邮件服务器，并启用了\
  \ SMTP 和 POP3 守护进程允许用户收发邮件。系统防火墙必须开放哪些端口以允许此操作？（选择）\n* A. 20\n* B. 21\n* C. 25\n\
  * D. 110\n* E. 119\n* F. 80\n\n5. 以下哪些是可以分配给网络主机的有效 IP 地址？（选择）\n* A. 192.168.254.1\n\
  * B. 11.0.0.0\n* C. 257.0.0.1\n* D. 192.345.2.1\n* E. 10.200.0.200\n\n6. 你的网络接口被分配了\
  \ IP 地址 10.0.0.1。该十进制地址的二进制形式是什么？\n\n\n\n\n\nA. 10001010.00000000.00000000.00000001\n\
  \nB. 00001010.00000001.00000001.00000001\n\nC. 10100000.00000000.00000000.00000001\n\
  \nD. 00001010.00000000.00000000.00000001\n\n#### 7\n你需要使用 `ifconfig` 为你的 `eth0`\
  \ 接口分配 IP 地址 176.23.0.12 和子网掩码 255.255.0.0。以下哪条命令可以实现此操作？\n\nA. `ifconfig eth0 176.23.0.12\
  \ netmask 255.255.0.0`\n\nB. `ifconfig 176.23.0.12 netmask 255.255.0.0`\n\nC. `ifconfig\
  \ eth0 176.23.0.12 mask 255.255.0.0`\n\nD. `ifconfig dev=eth0 ipaddr=176.23.0.12\
  \ subnetmask=255.255.0.0`\n\n#### 8\n你已经在 `vi` 编辑器中打开了 `/etc/resolv.conf` 文件。你想指定\
  \ DNS 服务器地址为 10.200.200.1。为了实现这一目标，你会在文件中输入哪条指令？\n\nA. `host 10.200.200.1`\n\nB.\
  \ `resolver 10.200.200.1`\n\nC. `dnsserver 10.200.200.1`\n\nD. `nameserver 10.200.200.1`\n\
  \n#### 9\n你想使用机构的 DHCP 服务器为你的 `ens1` 网络接口动态分配 IP 地址。为了实现这一目标，你会在 shell 提示符处输入哪条命令？\n\
  \nA. `dhcp ens1`\n\nB. `dhclient ens1`\n\nC. `get address dynamic ens1`\n\nD. `ip\
  \ address=dhcp dev= ens1`\n\n#### 10\n你需要验证主机名为为 `fs1.mycorp.com` 的远程主机是否正在运行。为了实现这一目标，你会在\
  \ shell 提示符处输入哪条命令？\n\nA. `finger fs1.mycorp.com`\n\nB. `ping fs1.mycorp.com`\n\n\
  C. `netstat -s fs1.mycorp.com`\n\nD. `verify fs1.mycorp.com`\n\n#### 11\n哪些命令可以在\
  \ Linux 系统解析域名？（选择四项）\n\nA. `nslookup`\n\nB. `dig`\n\nC. `resolvectl`\n\nD. `host`\n\
  \nE. `hosts`\n\n#### 12\n哪个 `chronyc` 选项验证时间服务器活动？\n\nA. `chronyc trackers`\n\n\
  B. `chronyc tracking`\n\nC. `chronyc track`\n\nD. `chronyc tracker`\n\n### 答案\n\n\
  #### 1\n**A, C.** MAC 地址硬编码在每个以太网网卡的固件中。从理论上说，世界上没有两个网卡应该具有相同的 MAC 地址。然而，某些类型的网卡允许你手动配置\
  \ MAC 地址。\n\n#### 2\n**A.** 用户数据报协议（UDP）是一种不可确认的、无连接协议，它发送数据包时不请求接收确认。这使得它非常需要极低延迟但可以容忍某种程度不可靠性的网络应用程序，例如视频流。\n\
  \n#### 3\n**B.** OSI 模型的网络层实现了网络之间的数据路由。在 IP 网络中，此功能由 IP 协议（IP 本）提供。\n\n#### 4\n\
  **C, D.** SMTP 守护进程默认使用端口 25，而 POP3 守护进程默认使用端口 110。\n\n#### 5\n**A, E.** 192.168.254.1\
  \ 和 10.200.0.200 都是可以分配给网络主机的有效 IP 地址。\n\n#### 6\n**D.** 第字节（10）的二进制等价物是 00001010。第二和第三字节（0）的二进制等价物均为\
  \ 00000000。第四字节（1）的二进制等价物是 00000001。\n\n#### 7\n**A.** 命令 `ifconfig eth0 176.23.0.12\
  \ netmask 255.255.0.0` 将将 IP 地址和子网掩码分配给 `eth0` 接口。\n\n#### 8\n**D.** 指令 `nameserver\
  \ 10.200.200.1` 指定了 IP 地址为 10.200.200.1 的 DNS 服务器。\n\n#### 9\n**B.** 命令 `dhclient\
  \ ens1` 将来自 DHCP 服务器的 IP 地址信息配置 `ens1` 接口。\n\n#### 10\n**B.** 命令 `ping fs1.mycorp.com`\
  \ 用于验证主机是否在线。\n\n#### 11\n**A, B, C, D.** `nslookup`、`dig`、`resolvectl` 和 `host`\
  \ 都可以解析域名。\n\n#### 12\n**B.** `chronyc tracking` 命令验证时间服务器活动。\n\n## 第 15 章\n\n###\
  \ 理解网络安全\n\n在本章中，我们将学习：\n\n- 加密的工作原理\n- 网络安全\n- 单点登录\n- 防御攻击\n- 使用 GPG 加密文件\n\n\
  网络安全关注用户。在当今注重安全的世界中，加密通信至关重要。使用 Wireshark 等网络监控工具，或 Linux 命令行工具 `tcpdump` 和 `tshark`\
  \ 让黑客很容易嗅探并读取传输。\n\n为了保护这些信息，必须对网络通信进行加密。与小学时期简单代码不同，如今的网络密码学使用了更复杂的机制。通常有三种方法：\n\
  \n- 对称加密\n- 非对称加密\n- 通过哈希进行完整性检查\n\n## 理解加密的工作原理\n\n回想小学时代给朋友传纸条。为了保持这些纸条秘密，你可能会使用这样的代码：\n\
  \n```\nJAKE LIKES DICEY\n```\n\n这种基本的密钥概念会打乱消息。例如，使用`字母移位`，明文 `JAKE LIKES DICEY`\
  \ 会加密为密文 `IZJD KHJFR CHBDX`。\n\n### 对称加密\n\n刚刚提到的小学加密系统是对称加密的一个示例，它使用单个私钥。用于加密消息的密钥与解密消息的密钥相同。这意味着发送方和接收方必须拥有相同的密钥，如[图\
  \ 15-1](#ch15.xhtml_ch15fig1）所示。对称算法包括 Blowfish、3DES 和 AES。\n\n**图 15-1** 对称加密\n\
  \n**注意：** 对称加密有时被称为*密钥加密*。由于密钥密钥被盗的风险较高，如今通常使用另一种加密机制，称为*非对称加密*。\n\n### 非对称加密\n\n\
  \n\n\n与对称加密不同，非对称加密使用两个密钥而不是一个：一个所有人皆知的公钥，和一个只有所有者才知道的私钥。用公钥加密的数据用私钥解密。用私钥签名的数据用公钥验证。非对称加密的示例包括\
  \ `RSA`、`DSA` 和 `Diffie-Hellman`。\n\n![Images](img/note.jpg)\n\n**注意** 数字签名不是手写签名的\
  \ GIF 或 JPEG 图像。它们是每个所有者才拥有的代码。由于数据附带有个人代码（即发送者的私钥），你可以使用发送者的公钥来验证消息确实来自该个人。\n\n\
  由于其破解难度很高，公钥加密是一种广泛用于加密数据的方法。在线购物之所以存在，是因为有非对称加密，它保护了客户地址、电话和信用卡号的机密。\n\n为了验证在线商店（例如\
  \ `microbank.com`）是否合法，会使用`证书机构 (CA)`，例如 Verisign、Entrust 或 DigiCert。CA 通过向商店提供只有他们才拥有的签名证书，向客户确保他们正在\
  \ [microbank.com](http://microbank.com) 进行银行交易，而不是像 fake-microbank.com 这样的伪造网站。伪造网站看起来是\
  \ [microbank.com](http://microbank.com)，但程序旨在窃取客户的隐私信息。这种非对称过程被称为`公钥基础结构 (PKI)`。\n\
  \n为了加密个人身份信息 (PII)，如账号数字、居住地址和税务识别码，网站管理员会部署 `SSL/TLS`。你会知道自己正在访问安全站点，因为浏览器的地址栏中会显示一个小锁。这是因为你使用的是\
  \ `https` 地址而非 `http` 设置来访问该站点的。\n\n要测试你的 Web 服务器的 `SSL/TLS` 连接，请使用 `openssl` 命令。运行\
  \ `openssl s_client -connect mywebsite.com:443` 将帮助你确保连接具有正确的加密和哈希算法，以满足客户的需求。\n\
  \n管理员可以创建自己的证书并使用它们来加密网络传输和文件系统中的文件。这些被称为`自签名 (self-signed)`证书。\n\n![Images](img/note.jpg)\n\
  \n**注意** 数字管理员可以获取`通配证书`来节省费用。他们不需要分别购买 [www.aaa.com](http://www.aaa.com) 和 mail.aaa.com，只需购买\
  \ [aaa.com](http://aaa.com)，它就可以用于 [www.aaa.com](http://www.aaa.com)、mail.aaa.com、ssh.aaa.com\
  \ 等。\n\n## 通过哈希进行完整性检查\n\n在下载软件、图片或音乐时，用户如何知道文件没有被意外更改或刻意修改？为了验证文件未被更改，用户可以使用一种称为单向加密或`哈希\
  \ (hashing)` 的技术。例如，当在访问 OpenSUSE 下载操作系统时，你还会看到一个哈希值列表，如下：\n\n![Images](img/f0484-01.jpg)\n\
  \n![Images](img/note.jpg)\n\n**注意** 你可以通过访问 [`opensuse.org`](https://opensuse.org)\
  \ 进入 OpenSUSE 的镜像下载站点链接。从那里，点击“获取最完整的 Linux 发行版”或“最新常规发布版本”的链接，然后选择“选择镜像”。\n\n在这种情况下，列出了三个哈希值：`SHA-256`、`SHA-1`\
  \ 和 `MD5`。\n\n文件完整性检查通过确保下载的文件哈希与供应商发布的哈希值匹配来完成。有很多哈希工具，但最流行的两个是 `MD5` 和 `SHA`。`SHA`\
  \ 有多个版本，其中 `SHA-256` 是最好的之一，因为两个不同文件计算出相同结果概率较低，这被称为`碰撞 (collision)`。\n\n哈希值就像文件的序列号。一个特定的文件应该只给出一个。因此，OpenSUSE\
  \ v15.0 的 `MD5` 哈值为 `5d4d4c83e678b6715652a9cf5ff3c8a3`。如果管理员决定从镜像下载 OpenSUSE v15.0，他们必须问自己：这是一个我们可以信任的镜像吗？管理员可以通过\
  \ `md5sum` 命令通过检查哈希来验证文件。这会输出消息摘要，如下所示：\n\n![Images](img/f0484-02.jpg)\n\n在这种情况下，由于哈希值与\
  \ OpenSUSE 网站上的哈希值匹配，管理员知道下载的是干净的文件。如果返回的值不是 `5d4d4c83e678b6715652a9cf5ff3c8a3`，那么管理员就知道下载的文件有问题。在大多数情况下，用户只下载了文件的一部分，必须尝试重新下载。在少数情况下，不匹配可能意味着文件已被恶意软件篡。哈希不匹配看起来像这样：\n\
  \n![Images](img/f0484-03.jpg)\n\nOpenSUSE 网站还列出了 `SHA-1` 和 `SHA-256` 哈希值。这些可以分别使用\
  \ `sha1sum` 和 `sha256sum` 命令进行验证。有时供应商会列出迄为止质量最高的哈希值 `SHA-512`。在这种情况下，使用 `sha512sum`\
  \ 命令验证文件完整性。\n\n## 实现安全网络\n\n在 UNIX 早期，网络工具包括 `telnet`、`rlogin`、`rsh`、`rcp` 和 `FTP`。这些实用程序在公共网络上使用是因为它们缺乏加密。如今，你可以使用\
  \ `SSH` 安全地完成这些任务。在本节中，将介绍以下主题：\n\n- SSH 如何工作\n- 配置 SSH\n- 无需密码登录 SSH\n- 虚拟网络\n\n\
  ### SSH 如何工作\n\nSSH 提供了 `telnet`、`rlogin`、`rsh`、`rcp` 和 FTP 的功能，但带有加密。为了实现这一点，SSH\
  \ 提供了以下加密组件：\n\n- `sshd`: 这是运行在服务器上的 SSH 守护进程。\n- `ssh`: 这是用于连接 SSH 服务器的 SSH 客户端。\n\
  - `scp`: 用于在系统间安全拷贝文件的实用程序。\n- `sftp`: 用于在系统间安全拷贝文件的实用程序，类似于 FTP。\n- `slogin`: 与\
  \ SSH 一样，该实用程序用于远程访问 shell。\n- `ssh-keygen`: 该实用程序用于创建用户的公/私钥。它还可以创建自签名证书。\n\n为了建立安全连接，SSH\
  \ 同时使用非对称和对称加密。首先，SSH 客户端与系统建立连接，SSH 服务器运行在端口 `22`。然后 SSH 服务器将其公钥发送给 SSH 客户端。SSH\
  \ 服务器将其密钥存储在以下文件中：\n\n- **私钥**：`/etc/ssh/ssh_host_key`\n- **公钥**：`/etc/ssh/ssh_host_key.pub`\n\
  \n客户端系统从 SSH 服务器接收公钥，并检查是否已拥有该密钥的副本。SSH 客户端将远程系统的密钥存储在以下文件中：\n\n- `/etc/ssh/ssh_known_hosts`\n\
  - `~/.ssh/known_hosts`\n\n默认情况下，如果客户端在这些文件文件中没有服务器的公钥，它将要求用户添加。完成此操作后，客户端现在信任服务器系统并生成对称密钥。然后它使用服务器的公钥加密新的秘密密钥并发送到服务器。服务器使用其私钥解密对称密钥，现在两个系统都拥有相同的秘密密钥，并在\
  \ SSH 会话期间可以使用更快的对称加密。用户将看到登录提示，现在可以安全地进行身份验证，因为用户输入的所有内容都是以加密格式发送的。\n\n在安全通道协商完成且用户通过\
  \ SSH 服务器身份验证后，可以在两个系统之间安全地传输数据。\n\n![Images](img/exam.jpg)\n\n\n\n\n**考试提示** 默认情况下，SSH\
  \ 设置为使用特权端口 22。这在 `/etc/services` 文件中定义。黑客也知道默认端口是 22。通常，网络管理员会使用`非` 22 的端口，以增加黑客入侵网络的难度。\n\
  \n### 配置 SSH\n\n要使用 SSH，请安装 `openssh` 软件包。该包包含了 `sshd` 守护进程和 `ssh` 客户端。（大多数 Linux\
  \ 发行版通常都已安装了 SSH。）\n\n配置 SSH 的过程涉及配置 SSH 服务端和 SSH 客户端。使用 `/etc/ssh/sshd_config`\
  \ 文件配置 `sshd` 服务。另一方面，`ssh` 客户端使用 `/etc/ssh/ssh_config` 文件或 `~/.ssh/config` 文件进行配置。\n\
  \n让我们先来看配置 SSH 服务端。`/etc/ssh/sshd_config` 文件中有许多指令。好消息是，在安装 `openssh` 包后，默认参数在大多数情况下都能良好运行。在修改此文件后，以\
  \ root 身份使用 `systemctl restart sshd` 重启 `sshd`。该文件中一些更有用的参数包括表 15-1 所示所示。\n\n![Images](img/f0486-02.jpg)\n\
  \n**表 15-1** `/etc/ssh/sshd_config` 文件中的选项\n\n![Images](img/exam.jpg)\n\n**考试提示**\
  \ 将 `PermitRootLogin` 设置为 `no` 以允许 root 登录。\n\nLinux 系统上的 SSH 客户端使用 `/etc/ssh/ssh_config`\
  \ 文件配置。`/etc/ssh/ssh_config` 文件用于指定系统中运行 SSH 的所有用户的默认参数。用户可以使用家目录下的 `~/.ssh/config`\
  \ 文件覆盖这些默认设置。配置 SSH 客户端设置的优先级如下：\n\n1. 在 shell 提示符处随 `ssh` 命令包含的任何命令行选项\n2. `~/.ssh/config`\
  \ 文件中的设置\n3. `/etc/ssh/ssh_config` 文件中的设置\n\n与 `sshd` 守护进程一样，`/etc/ssh/ssh_config`\
  \ 文件中使用的默认参数通常不需要大量自定义即可工作。用于自定义 SSH 客户端的一些常用参数列在表 15-2 中。\n\n![Images](img/f0487-01.jpg)\n\
  \n**表 15-2** `/etc/ssh/ssh_config` 文件中的选项\n\n![Images](img/exam.jpg)\n\n**考试提示**\
  \ 在连接到 SSH 服务端之前，确保基于主主机和基于网络的防火墙已开放端口 22。\n\n图 15-2 显示了 SUSE Linux Enterprise Server\
  \  YaST 防火墙模块，其配置为允许 SSH 流量。\n\n![Images](img/F15-02.jpg)\n\n**图 15-2** 配置防火墙允许\
  \ SSH 流量\n\n配置防火墙后，你可以通过输入以下内容登录远程 Linux 系统\n\n![Images](img/f0487-02.jpg)\n\n![Images](img/tip.jpg)\n\
  \n**提示** 不要忘记用于用户名的 `-l` 参数；否则 SSH 客户端将尝试以 `$USER` 的身份验证远程系统用户。如果客户端和服务器系统的凭据相同，则验证将成功。如果不同，验证将失败。\n\
  \n例如，要使用本地计算机系统上的 SSH 客户端连接主机名为 `fedora`（IP 地址为 10.0.0.85）、用户为 `student` 的远程 Linux\
  \ 系统，在 shell 提示符处输入 `ssh -l student fedora`，如图 15-3 所示。\n\n![Images](img/F15-03.jpg)\n\
  \n**图 15-3** 通过 SSH 远程连接\n\n注意图 15-3，用户提示接受来自 `fedora` 主机的公钥，因为这是首次连接到该 SSH 服务端。完成后，用户将作为\
  \ `student` 用户通过远程系统的身份验证（注意 shell 提示符的变化）。现在用户可以访问 `fedora` 服务器，就好像坐在 `fedora`\
  \ 的控制台前一样。要关闭连接，只需在 shell 提示符处输入 `exit`。\n\n![Images](img/tip.jpg)\n\n**提示** 诸要为你的\
  \ SSH 会话启用 `X11 forwarding`，请使用 `-X` 选项连接到 SSH 服务端，例如：`ssh -X user@sshserver.example.com`\n\
  \n## 练习 15-1：使用 SSH\n\n在此练习中，你将在 Linux 系统上设置一个 SSH 服务端，然后从另一个 Linux 系统使用 SSH 客户端连接到它。\n\
  \n为此练习及本章剩余练习设置至少两个 Linux 系统。可以使用两个 Linux 系统、两个虚拟机，或两者的混合。\n\n![Images](img/tip.jpg)\n\
  \n**视频** 观看练习 15-1 了解如何操作。\n\n1. 通过以下步骤设置 SSH 服务端：\n    a. 打开终端。\n    b. 输入 `su\
  \ -` 后输入你的 `root` 密码切换到 `root` 账户。\n    c. 确保已安装 `openssh` 软件包。\n    d. 使用 `vi /etc/ssh/sshd_config`。\n\
  \    e. 找到 `PermitRootLogin` 设置。如果被注释掉了，删除 `#` 字符。\n    f. 将 `PermitRootLogin` 设置为\
  \ `no`。\n    g. 按 `Esc`，然后输入 `:x` 保存并退出编辑器。\n    h. 在 shell 提示符处输入 `service sshd\
  \ restart` 以应用更改。\n2. 通过以下步骤从客户端建立 SSH 连接：\n    a. 打开终端。\n    b. 在 shell 提示符处输入\
  \ `ssh -l student 192.168.1.25` 启动 SSH 连接。\n    c. 如果提示，输入 `yes` 接受来自服务器的公钥。\n \
  \   d. 输入远程用户的密码。\n    e. 在 shell 提示符处输入 `exit` 退出远程系统。\n3. 通过以下步骤练习从你的客户端系统使用 SSH：\n\
  \    a. 在 shell 提示符处输入 `ssh -l student 192.168.1.25 /sbin/ifconfig` 通过 SSH 在远程系统上运行\
  \ `ifconfig` 命令。\n    b. 输入远程用户的密码。\n    c. 通过以下步骤使用安全的 SSH 连接复制文件：\n        i.\
  \ 在 shell 提示符处输入 `echo \"This is my new file.\" > ~/mytestfile.txt` 在用户家目录下创建一个新文件。\n\
  \        ii. 在 shell 提示符处输入 `scp ~/mytestfile.txt student@192.168.1.25:` 将此新文件复制到\
  \ SSH 服务端上远程用户账户的家目录。\n        iii. 在提示时输入远程用户的密码。\n        iv. 使用 `ssh` 命令再次与你的\
  \ SSH 服务端系统建立 SSH 连接。\n        v. 验证远程用户家目录下是否存在该文件。\n        vi. 输入 `exit` 关闭连接。\n\
  \    d. 使用 `sftp` 命令将 `mytestfile.txt` 文件从 SSH 服务端系统下载到本地 `/tmp` 目录。\n\n\n\n\n\n\
  i. 在工作系统的 shell 提示符下，输入 `sftp <user_name>@ <IP_address_of_SSH_server>`。\n\nii. 在提示时，输入远程用户的密码。\n\
  \niiii. 在 `sftp>` 提示符下，输入 `get mytestfile.txt /tmp/`。\n\niv. 在 `sftp>` 提示符下，输入 `exit`。\n\
  \nv. 在 shell 提示符下，输入 `ls /tmp`。你应该能看到从 SSH 服务器系统拷贝的 `mytestfile.txt` 文件。\n\n现在你已经学会了如何使用\
  \ SSH 服务器和 SSH 客户端，准备好通过学习如何通过 SSH 连接隧道传输未加密流量来进阶你的知识水平了。\n\n![Images](img/note.jpg)\n\
  \n**注意** `rsync`（“远程同步”）工具是一个极好的备份工具，因为它可以上传文件的更新部分，而不是重复文件。此外，`ssh` 被用于加密传输，如下所示：`#\
  \ rsync -av /filesdir/* user@remote:/filesdir`\n\n#### 免密登录 SSH\n\n管理员还可以配置 SSH\
  \ 服务器以允许无需密码的情况下进行身份验证。例如，系统管理员 Eric 正在设置系统以使用 `scp` 进行加密远程备份，并希望每周运行一次。他决定将备份作为\
  \ cron 任务（定时任务）运行是目前最佳方法，但他意识到这样做不可行，因为 `scp` 总是提示输入密码。因此，现在现在告诉服务器有一个*信任的*客户端需要访问，这样服务器就不应再向该客户端的请求请求密码。\n\
  \n要实现此功能，客户端系统用户的公密钥必须存储在服务器上。服务器上的文件称为 `~/.ssh/authorized_keys`。为了做到这一点，Eric 需要将公密钥从客户端系统安全地拷贝到服务器系统，并将其添加到\
  \ `~/.ssh/authorized_keys` 中。（当然，私钥保留在客户端系统上。）现在 Eric 可以使用 `scp` 和 SSH 免密登录服务器了；这也被称为公密钥认证。\n\
  \n要配置公密钥认证，首先在客户端系统上创建公/私钥对。这可以使用 `ssh-keygen` 命令按照以下步骤完成：\n\n1. 在客户端系统的 shell 提示符下，输入\
  \ `ssh-keygen -t rsa` 或 `ssh-keygen -t dsa`，取决于你的 SSH 服务器支持哪种加密方法。为了安全起见，可以同时使用这两个命令创建两个密钥对——一个用于\
  \ RSA 加密，另一个用于 DSA 加密。\n\n2. 当提示保存私钥的文件名时，按 `Enter` 键使用默认文件名 `~/.ssh/id_rsa` 或 `~/.ssh/id_dsa`。相关的公密钥将分别保存为\
  \ `~/.ssh/id_rsa.pub` 或 `~/.ssh/id_dsa.pub`。\n\n3. 在提示时，为密钥输入密码短（passphrase）。为密钥分配密码短后，如果有人不知道该密码，密钥将失效。\n\
  \n此时，密钥对已创建。这里显示了创建 RSA 密钥对的示例：\n\n![Images](img/f0491-01.jpg)\n\n接下来，将刚刚创建的公密钥拷贝到\
  \ SSH 服务器。实现此点的简单（安全）方法是使用 `scp` 命令。语法如下：\n\n![Images](img/f0491-02.jpg)\n\n在所示示例中，`WS1`\
  \ 上本地用户 `ejeff` 的 RSA 公密钥被拷贝到 `WS3` 上 `ejeff` 用户的家目录，并保存为名为 `keyfile` 的文件：\n\n![Images](img/f0492-01.jpg)\n\
  \n此时，需要将刚刚拷贝的密钥文件内容追加到连接 SSH 服务器的用户家目录下 `~/.ssh/authorized_keys` 文件的末尾。实现此点的简单方法是使用标准\
  \ SSH 会话连接到 SSH 服务器，然后使用 `cat` 命令将密钥文件的内容追加到 `~/.ssh/authorized_keys` 文件的末尾。示例如下：\n\
  \n![Images](img/f0492-02.jpg)\n\n通过建立新的 SSH 会话测试配置，查看公密钥认证是否有效。在这种情况下，系统会提示输入密钥密码短，而不是用户名和密码。一旦输入密码短，Eric\
  \ 就通过了 SSH 服务器的认证。注意下一个示例，建立 SSH 会话时没有请求密码：\n\n![Images](img/f0492-03.jpg)\n\n最后一步是使用\
  \ `ssh-agent` 命令来消除每次建立 SSH 连接时输入密码短的需要，详见下文。一旦通过 `ssh-add` 代理，`ssh-agent` 命令就会缓存密钥。\n\
  \n1. 在客户端系统的 shell 提示符下，输入 `ssh-agent bash`。\n\n2. 在 shell 提示符下，输入 `ssh-add ~/.ssh/id_rsa`\
  \ 或 `ssh-add ~/.ssh/id_dsa`，取决于创建了哪个密钥文件。\n\n3. 在提示时，输入密钥密码短。\n\n\n\n\n\n如果你已经知道远程系统的用户名和密码，可以使用\
  \ `ssh-copy-id` 自动更新 `~/.ssh/authorized_keys`。以下是一个示例：\n\n![Images](img/f0494-01.jpg)\n\
  \n`ssh-copy-id` 命令将自动更新 SSH 服务器上的 `authorized_keys` 文件。\n\n## 虚拟专用网络\n\n虚拟专用网络（VPN）允许用户通过不可信的网络连接到远程服务器，但使其看起来像是内部网络的一部分。为了确保网络的机密性，使用了加密和隧道协议来创建这种私有网络。这种安全性通过\
  \ IP 安全协议（IPSec）提供。为了在不牺牲安全性的情况下减少流量拥塞，实现了数据报文传输层安全（DTLS）。\n\n员工使用 VPN 居家并连接到公司办公室，例如。图\
  \ 15-4 显示了家庭办公室通过 VPN 连接到公司网络的示例。\n\n![Images](img/F15-04.jpg)\n\n**图 15-4**  从家庭办公室到公司总部的\
  \ VPN 连接\n\nVPN 连接可以在传输模式或隧道模式下建立。隧道模式对报头和消息进行加密。当数据通过公共网络传输时，请使用隧道模式。传输模式用于受信网络（例如，从办公室到办公室移动数据）。传输模式仅加密消息，不加密报头。\n\
  \n要从 Linux 设置 VPN 客户端，点击屏幕右上角的网络图标，如图图 15-5 所示。\n\n![Images](img/F15-05.jpg)\n\n\
  **图 15-5**  创建 VPN 连接的第 1 \n\n接下来，点击有线设置（参见图 15-6）。然后点击 VPN 右侧的 + 号启动 VPN 连接，如图图\
  \ 15-7 所示。\n\n![Images](img/F15-06.jpg)\n\n**图 15-6**  创建 VPN 连接的第 2 \n\n![Images](img/F15-07.jpg)\n\
  \n**图 15-7**  创建 VPN 连接的第 3 \n\n在获取凭据后，将其保存到文件中并导入 VPN 客户端，以便轻松连接到 VPN 服务器。\n\n\
  ![Images](img/note.jpg)\n\n**注意**   Linux 系统上常用的命令行 VPN 客户端是 `OpenVPN`。\n\nVPN 有多种实现方式。其中一种使用\
  \ SSH，另一种是 SSL VPN，它使用 TLS 作为加密协议（尽管 TLS 已经取代了 SSL，但 SSL VPN 的名称保留了下来，因此没有更改）。某些管理员发现这些\
  \ VPN 比基于 IPSec 的 VPN 更容易设置，因为它们可以通过网络浏览器部署。\n\n![Images](img/exam.jpg)\n\n**考试提示**\
  \   如果 VPN 设置全部正确但系统无法连接，请确保防火墙上已开放了正确的端口。\n\n### 使用 SSH 端口转发保护未加密的服务\n\nSSH 端口转发允许你通过加密的\
  \ SSH 通道对未加密的服务进行隧道。例如，如果你正在通过跳板机（一台具有入侵检测功能且能更好地服务于 DMZ 中运行协议的加固服务器）来维护 DMZ 中的\
  \ Web 服务器，可以使用 `ssh` 的 `-L` 选项按如下配置端口转发进行访问：\n\n![Images](img/f0496-02.jpg)\n\n\
  这允许你安全地连接到跳板机，并安全地将连接转发到 Web 服务器。\n\n### 使用 SSH 动态端口转发保护未加密的服务\n\nSSH 动态端口转发允许你使用\
  \ `-D` 选项在本地机器上开启代理。运行以下命令：\n\n![Images](img/f0497-01.jpg)\n\n现在你可以配置 浏览器使用端口 55555，所有来自该位置的流量都将通过端口\
  \ 55555 的 SSH 连接定向。\n\n## 配置高可用性网络\n\n无法访问数据的后果就是破坏。也就是说，如果数据不可用，就相当于它已被破坏，因此可用性是安全性的一个重要组成。通过将本地网络适配器转换为称为“网络桥接”（network\
  \ bridging）或“绑定”（bonding）的概念，可以增强网络可用性。桥接将两个或多个网络连接在一起以实现容错。绑定将多个网络段连接在一起以提高网络吞吐量。双宿主网络见图\
  \ 15-8。\n\n![Images](img/F15-08.jpg)\n\n**图 15-8**  网络桥接和绑定的设置\n\n在此时，我们将涵盖两种主要的冗余网络类型：\n\
  \n- 网络桥接控制\n- 网络绑定\n\n对于 CompTIA Linux+ 考试，你需要理解网络接口桥接和绑定的基础知识。\n\n![Images](img/note.jpg)\n\
  \n**注意**   叠加网络（Overlay networks）允许管理员为本地网卡分配多个 IP 地址。例如，运行以下命令使单网卡形像三张网卡一样：\n\n\
  ![Images](img/f0497-02.jpg)\n\n### 网络桥接控制\n\n你使用 `brctl` 命令设置桥接。以下是一个使用 `addbr`\
  \ 函数创建桥的示例：\n\n![Images](img/f0498-01.jpg)\n\n生成树协议（STP）默认未启用，但启用它后，它可以防止网络环路。要启用\
  \ STP，运行以下命令：\n\n![Images](img/f0498-02.jpg)\n\n### 网络绑定\n\n网络绑定将多个网络接口聚合到一个单一绑定（bond），提供冗余、增加的吞吐量和高可用性。要在\
  \ CentOS 上构建绑定，定义文件 `/etc/sysconfig/network-scripts/ifcfg-bond0`：\n\n![Images](img/f0499-01.jpg)\n\
  \n`BONDING_OPTS` 设置描述了绑定模式，如表 15-3 所示。`miimon` 参数是以毫秒为单位的链路检查。\n\n![Images](img/f0499-02.jpg)\n\
  \n**表 15-3**  绑定策略\n\n接下来，管理员将对属于绑定的网络接口进行类似的设置，然后通过运行以下命令重启网络：\n\n```\nsystemctl\
  \ restart network\n```\n\n![Images](img/note.jpg)\n\n**注意**   可以使用 `ifcfg` 命令代替\
  \ `ifconfig` 来添加、删除或停止网卡。例如，运行 `ifcfg enp0s3` 禁用网卡。\n\n\n\n登录\n\n单点登录（SSO）是一种身份管理功能，允许用户对网络上的每个系统使用同一个登录名和密码。因此，无论工程师是在德克萨斯州奥斯汀的办公室还是在马哈哈特拉邦孟买的办公室工作，他们都可以使用相同的登录和密码访问数据。\n\
  \nSSO 系统具有多种功能，包括一次性密码（OTP）。这些系统为用户提供软件令牌（例如 FreeOTP）或硬件令牌，如图图 15-9 所示，每 30 秒产生一个随机值。当用户登录系统时，为了进一步验证身份，他们必须提供更新随机值。这提供了额外的安全层。如果黑客获取了用户的密码但无法猜测随机值，他们仍会被挡在外面。\n\
  \n![Images](img/F15-09.jpg)\n\n**图 15-9**  一次性密码 (OTP) 硬件令牌\n\n若干实用提供 SSO 服务，包括以下：\n\
  \n- RADIUS\n- LDAP\n- Kerberos\n- TACACS+\n\n对于 CompTIA Linux+ 考试，你只需要理解每个单点登录服务的基础知识。\n\
  \n![Images](img/exam.jpg)\n\n**考试提示**   每个用户都必须有一个唯一的、不与他人共享的用户 ID。共享账户很难确定是谁导致了负面事件。\n\
  \n\n\n\n\n### RADIUS\n认证拨号用户服务（Authentication Dial-In User Service, RADIUS）是一种允许本地和远程用户通过调制解调器连接的认证协议。用户登录并由\
  \ RADIUS 服务器进行身份验证。用户通过验证后，将获得一个 IP 地址和访问网络的权限。由于 RADIUS 是一项开放标准，因此它是厂商无关的。\n\n\
  RADIUS 使用 1812 和 1813 端口。图 15-10 展示了用户如何远程访问 RADIUS 客户端以登录网络。\n\n![Images](img/F15-10.jpg)\n\
  \n**图 15-10** RADIUS 客户端和服务器设置\n\n### LDAP\n轻量级目录访问协议（Lightweight Directory Access\
  \ Protocol, LDAP）是一种开源的 Active Directory 服务。LDAP 是厂商无关的，因此它可以在 Linux、Windows 和 macOS\
  \ 环境中良好地运行。该目录服务遵循 X.500 标准，该标准定义了用户名、密码、计算机、网络、无线设备、打印机等。\n\nLDAPv3 通过实现 TLS 提供了最高的安全性。LDAP\
  \ 使用 389 端口，如果与 SSL 结合则使用 636 端口。\n\n### Kerberos\nKerberos 是希腊神话中守卫冥界的三头狗的名字。用于系统管理员的\
  \ Kerberos 工具通过提供强身份验证来保护企业网络。\n\nKerberos 是公用网络上的首选系统，因为用户访问电子邮件和 SSH 等服务时，无需在网络上传输密码。通过这种方式，黑客甚至无法读取用户密码的哈希版本。Kerberos\
  \ 使用一种名为“票据”（tickets）的系统允许用户访问服务。\n\nKerberos 票据的工作原理类似于看电影用的票。例如，当你去电影院时，他们可能正在放映\
  \ 20 部不同的电影。假设你想在下午 2 点看 *Candace, Eric, Albert, and Edward: The Movie*。你只能在那个时间使用该电影的票。电影结束后，电影票就会过期。\n\
  \n同样，用户从 Kerberos 获取一张票据来访问电子邮件，该票据现在生效并在 60 分钟后过期。由于传输的是加密票据而不是密码，这使得黑客极难发现凭据。一旦票据过期，就可以请求一个具有新过期时间的新加密密钥。\n\
  \n确保客户端和服务器之间的时钟同步。如果它们相差超过五分钟，Kerberos 将会失败。如果防火墙端口 88 被关闭，Kerberos 也会失败。\n\n要启动\
  \ Kerberos 会话，运行 `kinit <username>@<hostname>.com` 并输入用户密码。要查看与当前 Kerberos 票据相关的地址，运行\
  \ `klist -a`。要获取当前票据的详情（如长度、过期时间、更新时间等），运行 `klist -v`。\n\n### TACACS+\n终端访问控制器访问控制系统（Terminal\
  \ Access Controller Access Control System Plus），或 TACACS+（读作“tack-us-plus”或“tack\
  \ plus”），结合了认证、授权和计费。TACACS+ 比 RADIUS 等协议更安全，因为不仅密码经过了加密，而且整个事务都经过了加密。此外，TACACS+\
  \ 可以将认证、授权和计费放在三个不同的服务器上，而 RADIUS 将认证和授权结合在一起。TACACS+ 与其前身 TACACS 不兼容。\n\nTACACS+\
  \ 使用 TCP 端口 49 运行。因为它使用 TCP 而不是 RADIUS 使用的 UDP，连接要可靠得多。TACACS+ 最初是为 Cisco 网络设计的，但其他厂商现在也支持\
  \ TACACS+。\n\n![Images](img/note.jpg)\n\n**注意** Microsoft Windows 系统使用 Active Directory\
  \ 进行单点登录（SSO）。Linux 提供系统安全服务守护进程（SSSD）来连接 Active Directory。\n\n## 防御网络攻击\n如果我们生活在一个可以连接网络并信任他人尊重我们系统的世界，那就太好了。不幸的是，并不这样的世界。如果我们的\
  \ Linux 系统连接到网络，我们需要担心网络攻击。如果我们的网络连接到公用网络（如互联网），我们需要极其担心网络攻击。\n\n与本书中讨论的大多数主题一样，网络安全是一个巨大的课题，可以写满很多卷书。因此，我们将讨论管理员可以采取的防御网络攻击的基本步骤。我们将涵盖\
  \ Linux+ 考试的几个重要领域，包括：\n\n• 缓解网络漏洞\n• 使用 `firewalld` 实现防火墙\n• 使用 `iptables` 实现防火墙\n\
  \n让我们从讨论一些缓解网络漏洞的步骤开始。\n\n### 缓解网络漏洞\n好消息是，系统管理员可以采取一些简单的步骤来缓解网络攻击对 Linux 系统的威胁。这些包括：\n\
  \n• 禁用未使用的服务\n• 安装安全更新\n\n让我们先讨论如何关注当前的网络威胁。\n\n#### 禁用未使用的服务\n管理员采取的缓解网络攻击威胁的最简单步骤之一是禁用未使用的网络服务。取决于\
  \ Linux 发行版的不同，可能运行着许多不需要运行的服务。要查看已安装服务的列表以及它们是否在运行，请在 shell 命令行提示符处输入 `systemctl\
  \ list-unit-files`。此命令将列出每个服务及其状态，如下：\n\n![Images](img/f0502-01.jpg)\n\n除了 `systemctl`\
  \ 之外，你还可以使用 `nmap` 命令查看 Linux 系统上的开放 IP 端口。再次，Linux 系统上开放的每个端口都代表一个潜在的漏洞。某些开放端口是必要的，而另一些不是。\n\
  \n![Images](img/note.jpg)\n\n**注意** `nmap` 包通常没有默认安装。\n\n使用 `nmap` 的语法是 `nmap -sT\
  \ <host_address>` 进行 TCP 扫描，`nmap -sU <host_address>` 进行 UDP 扫描。在图 15-11 中，`nmap`\
  \ 工具被用于扫描开放端口。\n\n![Images](img/F15-11.jpg)\n\n**图 15-11** 使用 `nmap` 扫描开放端口\n\n\
  图 15-11 显示了扫描主机上运行的许多服务。根据此输出确定哪些服务应该运行。要禁用服务，使用 `systemctl disable <service_name>`\
  \ 确保它在重启后不会启动。运行 `systemctl stop <service_name>` 停止运行的服务。\n\n![Images](img/note.jpg)\n\
  \n**注意** 传统工具被称为 `chkconfig`。要检查所有进程的状态，运行 `chkconfig -l`。要禁用服务，运行 `chkconfig <service_name>\
  \ off`。\n\n`netstat` 工具也列出开放端口。使用 `netstat` 配合 `-l` 查看 Linux 主机上监听套接字的示例如图 15-12\
  \ 所示。\n\n![Images](img/F15-12.jpg)\n\n**图 15-12** 使用 `netstat` 查看监听套接字列表\n\n类似于\
  \ `netstat`，使用 `lsof` 配合 `-i` 选项也会列出网络服务及其端口，如下：\n\n![Images](img/f0503-02.jpg)\n\
  \n![Images](img/f0504-02.jpg)\n\n#### 安装安全更新\n管理员防御网络攻击采取的最步骤之一是定期安装操作系统更新。我们在 IT\
  \ 世界中必须面对的一个简单事实是软件并非完美。大多数程序和服务都有某些缺陷。即使 Linux 内核也存在代表严重安全风险的缺陷。\n\n随着软件的发布和使用，这些缺陷会被系统管理员、用户和黑客发现。一旦发现，就会编写并发布更新以修复这些缺陷。大多数发行版都可以配置为自动检查并安装更新。用于更新系统的工具取决于你使用的哪种\
  \ Linux 发行版。\n\n\n\n\n\n今天，大多数机构都将其企业网络连接到互联网。这样做增强了通信并提供了丰富的信息访问。遗憾的是，这也让他们的网络面临严峻的安全威胁。如果用户可以访问互联网，来自互联网的不速之客也可以进入他们的网络。为了防止这种情况发生，机构需要实施防火墙。\n\
  \n防火墙有两种类型：基于网络的防火墙和基于主机的防火墙。`host-based firewall` 控制单个计算机系统的流量，而 `network-based\
  \ firewall` 用于控制整个网络的进出流量。\n\n在本章的这一部分，你将花一些时间学习如何在这两种能力上使用 Linux。我们将讨论以下主题：\n\n\
  • 防火墙的工作原理\n• 实现包过滤防火墙\n\n### 防火墙的工作原理\n\n究竟什么是防火墙？`firewall` 作用就像网络之间的门卫。它的工作是监控网络之间流过的流量，包括入站和出站。防火墙配置了规则来定义允许的流量类型。任何违反规则的流量都会被拒绝，如图\
  \ 15-13 所示。\n\n![Images](img/F15-13.jpg)\n\n**图 15-13** 防火墙的工作原理\n\n防火墙可以通过多种方式实现。最常见的类型之一是\
  \ `packet-filtering firewall`，所有在私有网络和公共网络之间移动的流量必须通过防火墙。在传输过程中，防火墙捕获所有进出数据包，并将其与网络管理员配置的访问控制列表\
  \ (ACL) 进行对比。\n\n防火墙 ACL 根据源地址、目的地址、源和目的端口、使用的协议或数据包类型过滤流量。如果数据包符合规则，它会被转发到下一个网络。如果不符合，它将被记录并丢弃，如图\
  \ 15-14 所示。\n\n![Images](img/F15-14.jpg)\n\n**图 15-14** 使用包过滤防火墙\n\n包过滤防火墙被认为是`stateless`\
  \ 防墙，这意味着它们不查看连接的状态。`stateful` 防墙维护连接的状态，目前被广泛使用。例如，如果通常阻止来自 Belchre 国的流量，那么从 Belchre\
  \ 国发起的流量将被拒绝。\n\n但如果局域网 (LAN) 内的信任用户请求与 Belchre 国建立连接，他们将获得允许，且与此连接相关的流量也将被允许，因为它们是由内部信任用户发起的。这减轻了网络管理员的大部分工作量。他们不再需要响应数百个请求，以为那些有理需要访问通常被禁网站的用户调整\
  \ ACL。\n\n但同时也引入了`phishing`（钓鱼）电子邮件。如果黑客可以欺骗信任用户点击一个链接，该链接重定向到黑客控制的 Belchre 国的被禁网站，那么黑客现在就破解了防火墙，并可以攻击受害者。\n\
  \n![Images](img/note.jpg)\n\n**注意** 还有内核代理防火墙、Web 应用程序防火墙、应用层网关、电路级下一代防火墙等。这些运行在\
  \ OSI 模型更高级别，超出了 CompTIA Linux+ 考试的范围。\n\n### 实现包过滤防火墙\n\nLinux 系统可以配置为许多许多网络设备，例如路由器或防火墙。目前，市场上有许多基于\
  \ Linux 的防火墙设备。为了我们的目的，我们将重点关注使用 `firewalld` 和旧工具 `iptables` 创建一个基础的包过滤防火墙。\n\n\
  在 Linux 系统上设置包过滤防火墙的第一步是设计实现方案。在设计防火墙时回答以下问题：\n\n• 防火墙是否拒绝除特定允许流量以外的所有入站流量？\n• 所有出站流量是否会被除非特定的类型或目的地？\n\
  • 防火墙上必须打开哪些端口以允许外部流量通过？例如，防火墙后面是否存在公共可访问的网站？如果是，则必须打开 80 和 443 端口。\n\n接下来，使用 `firewalld`\
  \ 服务配置防火墙。`firewalld` 服务提供基于区域的防火墙，使其更容易创建常见的设置。`firewalld` 服务支持 IPv4 和 IPv6，是 `systemd`\
  \ 的一部分。此外，可以使用永久和临时或运行时配置。\n\n要启用 `firewalld` 服务，使用 `systemctl`，如下所示：\n\n![Images](img/f0507-01.jpg)\n\
  \n如果有多个网络接口，需要启用 IP 转发，如下：\n\n![Images](img/f0507-02.jpg)\n\n![Images](img/note.jpg)\n\
  \n**注意** 对于 IPv6 转发，将 `/proc/sys/net/ipv6/conf/all/forwarding` 设置为 `1`。这将启用系统上启用的所有网络接口的转发。\n\
  \n`firewalld` 特性具有几个预定义的信任区域来管理 IP 数据包。表 15-4 列出了 `firewalld` 可的一些常用区域。\n\n![Images](img/f0508-01.jpg)\n\
  \n**表 15-4** `firewalld` 区域\n\n使用 `firewall-cmd` 显示可用区域并切换到不同的默认区域。例如，这里是从 `home`\
  \ 区域切换到 `internal`：\n\n![Images](img/f0507-03.jpg)\n\n要列出允许通过区域的所有配置的服务和接口，运行 `firewall-cmd\
  \ --list-all`，如下所示：\n\n![Images](img/f0507-04.jpg)\n\n![Images](img/f0508-02.jpg)\n\
  \n系统重启后，防火墙设置将恢复默认值。要添加服务并使值永久化，请使用 `--permanent` 标记：\n\n![Images](img/f0508-03.jpg)\n\
  \n`--reload` 选项使更改立即发生；否则，更改不会生效。\n\n![Images](img/note.jpg)\n\n**注意** 防火墙问题可能由\
  \ `--reload` 操作引起。它只加载现有的服务，所以如果你没有使用 `--permanent`，服务将不会启用。\n\n![Images](img/f0508-04.jpg)\n\
  \n### 练习 15-3：使用 `firewalld` 实现网络措施\n\n在此练习中，你将通过向公共区域区域添加 Web 服务来练习使用 `firewalld`\
  \ 设置。你可以使用随书提供的虚拟机进行此练习。完成以下步骤：\n\n![Images](img/video.jpg)\n\n**视频** 请观看练习 15-3\
  \ 视频演示如何执行此任务。\n\n1. 启动你的 Linux 系统并以 `root` 用户身份登录。如有必要，安装 `firewalld`。\n2. 如下所示设置防火墙使用\
  \ `public` 区域：\n\n![Images](img/f0509-01.jpg)\n\n3. 向 `public` 区域添加 Web 服务和安全 Web\
  \ 服务：\n\n![Images](img/f0509-02.jpg)\n\n4. 确认你已成功添加这些服务：\n\n![Images](img/f0509-03.jpg)\n\
  \n5. 通过运行 `firewall-cmd --help` 学习更多关于 `firewalld`。\n\n### 使用 `iptables` 实现防火墙\n\
  \n`firewalld` 服务实际上是 `iptables` 的前端，但 `firewalld` 在设置更改后仍可以保持现有连接。大多数 Linux 发行版包含\
  \ `iptables`，如果你的版本没有，你可以从 [`www.netfilter.org`](https://www.netfilter.org) 或供应商仓库下载。Linux\
  \ 内核本身使用 `netfilter` 完成包过滤任务。\n\n`netfilter` 基础设施使用“表和链”的概念来创建防火墙规则。*chain*（链）简单是一种用于实现的规则，以确定防火墙将如何处理入站数据包。`netfilter`\
  \ 基础设施使用 *filter table*（过滤表）来创建包过滤规则。过滤表中有三个默认链：\n\n• `FORWARD` 包含通过 Linux 系统在网络之间传输的数据包规则\n\
  \n\n\n\n\n* `INPUT` 包含发送到本地 Linux 系统的数据包规则。\n* `OUTPUT` 包含从本地 Linux 系统发送的数据包规则。\n\
  \nfilter 表中的每个链都有四种策略：\n\n* `ACCEPT`\n* `DROP`\n* `QUEUE`\n* `REJECT`\n\n要创建一个包含多条规则的链，链中的每条规则都被分配一个数字。你添加的第一条规则被分配为数字\
  \ 1。`iptables` 工具可以添加规则、删除规则、插入规则和追加规则。使用 `iptables` 的语法如下：\n\n![Images](img/f0510-01.jpg)\n\
  \n使用以下命令配合 `iptables`：\n\n* `-L` 列出链中的所有规则\n* `-N` 创建新链\n\n你可以使用之前列出的默认链，也可以创建你自己的链。你通过输入\
  \ `iptables -N <chain_name>` 来创建自己的链。你可以使用 `-A` 选项向链中添加规则。你还可以使用此处列出的其他选项之一：\n\n\
  * `-I` 在链中插入规则\n* `-R` 替换链中的规则\n* `-D` 从链中删除规则\n* `-F` 删除链中的所有规则（称为*冲刷*）\n* `-P`\
  \ 设置链的默认策略\n\n![Images](img/exam.jpg)\n\n**考试提示** 你应该熟练表 15-5 中列出的 `iptables` 选项。\n\
  \n![Images](img/f0511-01.jpg)\n\n**表 15-5** 一些 `iptables` 命令\n\n你也可以配合 `iptables`\
  \ 使用以下选项：\n\n* `-p` 指定规则检查的协议。你可以指定 `all`、`tcp`、`udp` 或 `icmp`。\n* `-s <ip_address/mask>`\
  \ 指定要检查的源地址。如果你想检查所有 IP 地址，请使用 `0/0`。\n* `-d <ip_address/mask>` 指定要检查的目的地址。如果你想检查所有\
  \ IP 地址，请使用 `0/0`。\n* `-j <target>` 指定数据包匹配规则时的操作。你可以指定 `ACCEPT`、`REJECT`、`DROP`\
  \ 或 `LOG` 动作。\n* `-i <interface>` 指定接收数据包的接口。这仅适用于 `INPUT` 和 `FORWARD` 链。\n* `-o\
  \ <interface>` 指定发送数据包的接口。这仅适用于 `OUTPUT` 和 `FORWARD` 链。\n\n![Images](img/note.jpg)\n\
  \n**注意** 此处介绍的选项仅代表 `iptables` 可执行操作的一部分。要查看所有可用选项，请参阅 `iptables` 手页。\n\n学习如何使用\
  \ `iptables` 的最好方法是看一些示例。表 15-5 提供了一些可以入门的示例 `iptables` 命令。\n\n你可以使用 `iptables`\
  \ 创建一个复杂的规则数组，控制数据如何流过防火墙。大多数管理员使用 `iptables` 的 `-P` 选项来设置防火墙的默认过滤规则。一旦设置了默认规则，就使用\
  \ `iptables` 为特定网络配置默认行为的异常情况。\n\n记住，任何使用 `iptables` 创建的规则都不是持久的。如果重启系统，它们默认将会丢失。要保存规则，请使用\
  \ `iptables-save` 命令将防火墙表写入文件。然后使用 `iptables-restore` 命令从创建的文件恢复表。\n\n**练习 15-4：使用\
  \ `iptables` 实现网络安全措施**\n\n在此练习中，你将练习扫描开放 IP 端口并实现简单的基于主机的防火墙。请使用随书提供的虚拟机进行此练习。\n\
  \n![Images](img/video.jpg)\n\n**视频** 请观看练习 15-4 视频以演示如何执行此任务。\n\n**1.** 启动你的 Linux\
  \ 系统并以 `student1` 用户身份登录。\n**2.** 打开终端会，通过输入 `su -` 后跟密码 `student1` 切换到 `root` 用户账户。\n\
  **3.** 完成以下步骤扫描系统的开放端口：\n\n**a.** 在终端，运行 `nmap -sS <ip_address>`。哪些 TCP 端口是开放的？\n\
  **b.** 在终端，运行 `nmap -sU <ip_address>`。哪些 UDP 端口是开放的？\n\n**4.** 使用 `iptables` 配置防火墙：\n\
  ```\niptables -A INPUT -p tcp --dport 22 -j ACCEPT\niptables -A INPUT -p tcp --dport\
  \ 80 -j ACCEPT\niptables -A INPUT -p tcp --dport 443 -j ACCEPT\n```\n**5.** 通过运行\
  \ `iptables -L -v` 验证规则。\n**6.** 设置默认策略：\n```bash\niptables -P INPUT DROP\n```\n\
  **7.** 保存规则：\n```bash\niptables-save > /etc/iptables/rules.v4\n```\n**8.** 恢复规则：\n\
  ```bash\niptables-restore < /etc/iptables/rules.v4\n```\n\n\n\n\n\nGPG 提供了一个加密引擎，可以通过\
  \ `gpg` 命令行工具直接从 shell 提示符调用。它也可以从 shell 脚本或系统上运行的其他程序内部调用。例如，GPG 已集成到多个 Linux 电子邮件客户端（如\
  \ Evolution 和 KMail）以及即时消息应用（如 Psi）。\n\nGPG 支持许多加密算法，包括 AES、3DES、Blowfish、MD5、SHA\
  \ 和 RSA。\n\n![Images](img/note.jpg)\n\n**注意** `gpg.conf` 文件也位于 `~/.gnupg` 目录。你可以使用此文件来自定义\
  \ GPG 在你系统上的工作方式。\n\n### 使用 GPG 加密文件\n\n要使用 GPG 加密文件，请遵循以下步骤：\n\n1. 使用 GPG 生成密钥。要此操作，请在\
  \ shell 提示符输入 `gpg --gen-key`。示例所示：\n\n![Images](img/f0514-01.jpg)\n\n2. 选择你想要创建的密钥类型。通常你会使用默认选项（`1`），它使用\
  \ RSA 和 RSA。系统会提示你指定密钥的大小，如下所示：\n\n![Images](img/f0515-01.jpg)\n\n3. 指定你想要创建的密钥大小。使用默认的\
  \ `2048` 位大小通常足够了。系统会提示你配置密钥有效期，如下所示：\n\n![Images](img/f0515-02.jpg)\n\n4. 指定密钥何时过期。如第\
  \ 3 步所示，你可以指定密钥在若干天、周、月或年后过期。\n\n5.为密钥构建你的用户 ID（User ID）。你需要指定的第一个参数是你的真实姓名。你指定的名称非常重要，因为它在稍后的加密过程中会被使用。在下一个示例中，我为真实姓名输入了\
  \ `cgreer`：\n\n![Images](img/f0515-03.jpg)\n\n6. 在提示时，输入你的电子邮箱地址。\n\n7. 在提示时，输入你任选的注释。系统会提示你确认为该密钥创建的用户\
  \ ID。示例所示：\n\n![Images](img/f0515-04.jpg)\n\n8. 如果信息正确，输入 `O` 确认 ID。系统会提示你为密钥输入密码短。\n\
  \n9. 为密钥输入一个唯一的密码短。完成后后，系统会提示你在密钥生成期间执行各种操作。示例所示：\n\n![Images](img/f0515-05.jpg)\n\
  \n10. 移动鼠标并在键盘上打字。GPG 使用这些动作生成随机数来制作密钥。如果你操作不足，系统会提示你增加活动量以产生足够的熵来创建密钥。示例所示：\n\n\
  ![Images](img/f0515-06.jpg)\n\n此时，密钥对已生成完毕！密钥文件存储在用户目录下的 `~/.gnupg` 目录中。该目录下创建了以下文件：\n\
  \n* `secring.gpg` GPG 秘密密钥环（Secret Keyring）\n* `pubring.gpg` GPG 公钥密钥环（Public Keyring）\n\
  * `trustdb.gpg` GPG 信任数据库（Trust Database）\n\n要为你的 GPG 密钥对创建备份，请在 shell 提示符输入以下内容：\n\
  \n![Images](img/f0516-01.jpg)\n\n如下例所示：\n\n![Images](img/f0516-02.jpg)\n\n出于安全考虑，请不要将此文件留在硬盘上。相反，请将其拷贝到\
  \ USB 闪存驱动器并妥善保存。这样当原始密钥损坏时，你可以恢复私钥。\n\n现在使用该密钥对加密文件和消息。例如，要加密 Linux 文件系统中的文件，请执行以下操作：\n\
  \n1. 在 shell 提示符处，输入 `gpg -e -r <key_user_name> <filename>.`。如下，我加密了 `mytestfile.txt`。`-e`\
  \ 选项告诉 GPG 加密该文件。记得我在创建密钥用户 ID 时指定了 `cgreer` 作为密钥用户名，所以这就是我在这里输入的内容。\n\n![Images](img/f0516-03.jpg)\n\
  \n2. 使用 `ls` 命令查看 GPG 创建的新加密文件。原文件保持完好。新文件将具有原文件相同的文件名，但增加了 `.gpg` 扩展名。在示例中，新文件的名为\
  \ `mytestfile.txt.gpg`。\n\n一旦文件完成加密，就可以使用 `gpg` 命令进行解密。语法如下：\n\n![Images](img/f0516-04.jpg)\n\
  \n例如，要解密之前创建的 `mytestfile.txt.gpg` 文件，输入\n\n![Images](img/f0516-05.jpg)\n\n如下所示：\n\
  \n```\nif (condVar > someVal) {console.log(\"xxx\")}\n```\n\n\n\n\n\n要撤销一个密钥，你需要创建一个密钥撤销证书。作为最佳实践，你应该在初始创建密钥对后立即创建一个密钥撤销证书。这样做是为了防止某些发生损坏，导致在日后如果需要撤销时却无法创建撤销证书。创建密钥撤销证书实际上并不会撤销密钥对；只有当你发布密钥撤销证书时，密钥才会被撤销。因此，密钥撤销证书只是一个占位符，以备后之用。\n\
  \n要创建（不是发布）密钥撤销证书，请在 shell 提示符输入输入：\n\n![Images](img/f0518-03.jpg)\n\n记住，使用 `gpg`\
  \ 命令的 `--fingerprint` 选项查看密钥 ID 数字。在接后的示例中，为 `fedora` 系统上 `charly` 用户生成的 GPG 密钥对创建了一个密钥撤销证书：\n\
  \n![Images](img/f0519-01.jpg)\n\n避免将密钥撤销证书保留在系统的硬盘上。相反，请将其拷贝到闪存盘中作为密钥对的备份并妥善保存起来！如果有人获得了这个文件，他们可以在管理员不知或不同意的情况下撤销该证书。\n\
  \n**注意**：再次强调，GPG 知识并不是 CompTIA Linux+ 考试的要求。添加此节是为了增加你的知识。\n\n那么，如果证书实际上泄露了，你最终需要撤销它，你该怎么办？按照我们之前讨论的标准证书的方法导入撤销证书。在\
  \ shell 提示符输入 `gpg --import <revocation_filename>`：\n\n![Images](img/f0519-02.jpg)\
  \ 完成后，在 shell 提示符输入 `gpg --list-keys <key_ID>` 验证密钥是否已撤销。如果你在本章较早之前使用了手动方法分发公钥，则你必须在任何导入了你公钥的其他系统中导入该密钥证书。如果你正在使用互联网上的公钥服务器向其他用户分发密钥，你也需要在那里发布撤销证书。在\
  \ shell 提示符输入 `gpg --keyserver <public_key_server_URL> --send <key_ID>`。这会让所有使用你公钥的人知道该密钥已泄露，不应再使用。\n\
  \n## 练习 15-5：使用 GPG 加密文件\n\n在本次练习中，你将使用 GPG 加密文件并将其发送到第二个系统。然后，导出公钥，将其拷贝到第二个系统，并解密发送的文件。执行此练习至少需要两个\
  \ Linux 系统。使用两个实机系统、两个虚拟机或两者的结合。\n\n![Images](img/video.jpg)\n\n**视频**：请观看练习 15-5\
  \ 以获得如何执行此任务的演示。完成以下步骤：\n\n### 1. 按照以下步骤生成你的 GPG 密钥对：\n\na. 启动你的第一个 Linux 系统并以标准用户身份登录。\n\
  b. 打开终端会话。\nc. 在 shell 提示符输入 `gpg --gen-key`。\nd. 当提示选择你想要创建的密钥类型时，按 `Enter` 使用默认选项\
  \ (`1`)，该选项使用 RSA。\ne. 当提示指定密钥大小时时，按 `Enter` 使用 `2048` 位的默认大小。\nf. 当提示指定密钥何时过期时，按\
  \ `Enter` 选择默认选项 (`0`)，该选项指定密钥永不过期。\ng. 在提示确认此项选择时，输入 `y`。\n\n![Images](img/note.jpg)\n\
  \n**注意**：我们这样做是为了演示之目的。在现实世界中，你应该配置你的密钥在一段时间后过期。这样一来，如果你的密钥发生泄露，它将在一段时间后失效。\nh.\
  \ 通过指定至少包含几个字符的用户名来构建密钥的用户 ID。记下用户名，因为你以后会需要它。\ni. 在提示时，输入你的电子邮件地址。记下电子邮件地址，因为你以后会需要它。\n\
  j. 在提示时，输入你的全名作为注释。\nk. 在提示确认你为密钥创建的用户 ID 时，输入 `O`（字母 O，不是零）进行确认。\nl. 在提示为密钥输入口令时，输入一个唯一的密码。\n\
  m. 在提示时，在键盘上输入字符或关闭你的光盘。完成这些后，你的密钥对就生成了！\n\n### 2. 通过以下步骤使用 GPG 加密文件：\n\na. 在 shell\
  \ 提示符下输入 `gpg -e -r <key_user_name> mytestfile.txt`。将 `<key_user_name>` 替换为你创建密钥时输入的真实名称。你在练习\
