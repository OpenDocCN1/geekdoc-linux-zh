  \n**1.** **D.** `/boot` 目录包含启动配置文件。\n\n**2.** **C.** 命令 `ln filea fileb` 会创建文件 `fileb`，它与\
  \ `filea` 共享相同的 inode。\n\n**3.** **C.** 命令 `ls -l filea` 会显示相同 inode 的链接数（即文件数量）。\n\
  \n\n\n\n\n### **4.** **C.** 命令 `find / -inum 1234` 会显示具有相同 inode 节点的文件列表。命令 `find\
  \ / -name filea -o inum 1234`（答案 D）会失败，因为 `-inum` 前面没有 `–`。如果有一个“短横线”，它就能正常工作，但可能存在多个名为\
  \ `filea` 的文件，它们的 inode 节点并不都是 `1234`，因此这个答案是不正确的。\n\n### **5.** **B.** `find` 命令的第一个参数指定了搜索的起始位置。如果没有指定起始位置，搜索将在当前工作目录开始。\n\
  \n### **6.** **B.** 在不同的文件系统之间链接文件需要使用符号链接；因此，用户应执执行命令 `ln -s`。\n\n### **7.** **A.**\
  \ 命令 `type -a` 显示内置命令、外部命令、别名和函数。命令 `which -a` 只显示外部命令和别名。\n\n### **8.** **C, D.**\
  \ 命令 `whereis -m passwd` 只显示与关键词 `passwd` 相关的帮助页（man pages）的位置。命令 `whereis passwd`\
  \ 显示与关键词 `passwd` 相关的源代码、二进制文件和帮助页文件的位置。\n\n### **9.** **A, C.** 命令 `cd` 和 `cd ~`\
  \ 将当前工作目录更改为用户的家目录。\n\n### **10.** **B.** 命令 `rmdir` 只删除空目录。由于目录 `cars` 包含一个子目录\
  \ `chevy`，该命令将产生错误。因此，必须使用命令 `rm -r cars`。\n\n### **11.** **B, C.** 命令 `head <filename>`\
  \ 显示文件的前 10 行。命令 `head -n <filename>` 显示文件的前 `n` 行。\n\n### **12.** **D.** 命令 `ls\
  \ -l fileb`（答案 A）显示 `fileb` 的属性。命令 `ls -lL fileb` 显示它所链接的文件的属性。\n\n### **13.** **D.**\
  \ Linux 不允许在文件名中使用空白字符，也不允许使用斜杠（`/`）或空字符。（注意，尽管 `r*` 是合法的文件名，但它并不是一个好的选择。）\n\n###\
  \ **14.** **A.** `file` 命令使用魔数（magic number）来确定存储在文件中内容的类型。`ls -l` 命令（答案 B）显示表示文件类型的代码（目录、ASCII\
  \ 等）。\n\n### **15.** **B.** 命令 `which -a <keyword>` 按优先级顺序列出与关键词相关的别名和外部命令。\n\n\
  ### **16.** **B, D.** 由于题目指出该命令在执行之前需要用户确认，因此你需要在 `find` 命令中配合 `-ok` 并在 `xargs`\
  \ 命令中配合 `-p`。答案 A 和 C 不需要用户干预。\n\n### **17.** **B.** 命令 `mkdir -p` 创建目录树。需要注意的是，该目录树必须相对于当前工作目录进行创建。\n\
  \n### **18.** **B, C.** `rmdir` 命令只删除空目录。答案 B 使用 `cd` 将目录更改到目录类型的父目录，然后使用 `rmdir`\
  \ 命令删除目录类型。答案 C 使用相对路径删除目录类型。答案 D 可能可行，但它会删除过多内容，因此不是最佳答案。\n\n### **19.** **D.**\
  \ 为了排除错误，你必须通过执行命令 `type -a cp`（或 `which -a cp`）来确定正在执行哪个命令。输出告诉你 `cp` 命令被别名为 `cp\
  \ -i`，这阻止了命令覆盖现有文件。要取消别名，请执行命令 `\\cp file1 file2`。\n\n### **20.** **B, C, D.** 记住\
  \ `grep` 和 `egrep` 使用两个不同的正则表达式引擎，因此表达式的格式是不同的，且 `grep` 要求在某些表达式元字符前加上反斜杠，这就是为什么\
  \ A 是错误的。同样重要的是记住命令 `grep -E` 等同于执行命令 `egrep`。\n\n### **21.** **B, C, D.** 题目要求给出显示用户\
  \ `root` 或 `student1` 记录的命令。由于 `/etc/passwd` 中的用户记录以用户名开头，因此你正在寻找行首的用户名字符串（`^`）。\n\
  \n### **22.** **D.** 每个字符位置都需要其自己的范围说明。题目说明你需要查找从 `student1a` 到 `string9z` 的字符串。第一个字符范围位置（在\
  \ *t* 之后）将是 `[1-9]`，第二个字符范围位置将是 `[a-z]`。\n\n# 第 6 章\n\n## 管理所有权权限\n\n在本章中，你将学习：\n\
  \n* 管理文件所有权\n* 管理文件和目录权限\n* 配置文件属性和访问控制列表\n\n*系统和组是紧密交互的实体。*\n—Clarence “Skip” Ellis，科罗拉大学\
  \ Boulder 山区\n\n在管理用户对 Linux 系统的访问时，需要完成两个任务：\n\n* 控制谁可以访问系统。\n* 定义用户在登录系统后可以做什么。\n\
  \n访问控制通过定义用户和组，然后定义这些用户和组在登录系统后被授权的操作来实现。让我们从讨论文件和目录所有权开始。\n\n## 管理文件所有权\n\n为了有效地控制谁在系统中可以做什么，系统管理员首先需要考虑谁“拥有”文件和目录。用户的文件和目录设置默认使用预定义的\
  \ Linux 设置，但可以对其进行修改以更好地适应用户的需求。你将学习到以下内容：\n\n* 查看默认的文件权限和所有权\n* 从命令行管理所有权\n\n让我们从文件的默认设置开始。\n\
  \n#### 查看默认权限和所有权\n\n每当用户创建一个新文件或目录时，其用户账户会被分配为该文件或目录的“所有者”。默认情况下，Linux 系统上目录的所有者拥有读、写和执行权限。本质上，所有者可以对该目录做任何事情。同样，Linux\
  \ 系统上的文件所有者拥有读写权限。例如，假设用户 `tcboony` 登录她的 Linux 系统，并在家目录中使用 LibreOffice.org 创建了一个名为\
  \ `contacts.odt` 的文件。由于她创建了这个文件，`tcboony` 被分配了 `contacts.odt` 的所有权。图 6-1 显示了文件的用户和组设置。\n\
  \n**图 6-1 查看文件的所有者和组**\n\n注意图 6-1 中，`contacts.odt` 有两个设置需要讨论。第一个是拥有文件的用户的用户名。在这种情况下，它是\
  \ `tcboony`。此外，该文件属于 `staff` 组。这是因为 `staff` 是 `tcboony` 所属的主组。\n\n你也可以通过 `ls -l`\
  \ 命令从命令行查看文件所有权。在本示例中，已经在 `tcboony` 的家目录下执行了此操作：\n\n**注意：在本示例中，两个 `l` 都是小写字母 l，而不是数字一。**\n\
  \n注意输出中的第三列显示文件或目录的用户名（`tcboony`），而第四列显示所有该文件的组名（`staff`）。尽管文件和目录所有权是在创建时自动分配的，但可以对其进行修改，如后续节解释的那样。\n\
  \n\n\n\n\n### 从命令行管理所有权\n\n文件和目录的所有权并不是固定的实体。尽管所有权在创建时会自动分配，但之后也可以对其进行修改。只有 `root`\
  \ 用户可以更改文件或目录的所有者。要更改文件或目录的组，需要变为 `root` 用户，或者作为用户已经属于要更改到的目标组。\n\n修改文件或目录的所有权可以通过图形化工具或命令行工具完成。为了符合\
  \ CompTIA Linux+ 考试的形式，本文讨论侧重于两个命令行工具 `chown` 和 `chgrp`，而不是图形化工具。\n\n## 使用 `chown`\
  \ 更改所有权\n\n`chown` 工具用于更改文件或目录的所有者或组。`chown` 的语法格式为 `chown <user>:<group> <file\
  \ or directory>`。例如，如果 `/tmp` 下有一个名为 `myfile.txt` 且属于 `root` 的文件，要将文件所有者更改为 `tcboony`\
  \ 用户，请以 `root` 身份输入 `chown tcboony /tmp/myfile.txt`，如下：\n\n![Images](img/f016-01.jpg)\n\
  \n`root` 用户也可以通过输入单个 `chown` 命令同时更改用户和组，例如输入 `chown tcboony:staff /tmp/myfile.txt`。这告诉\
  \ `chown` 要更改所有权的用户为 `tcboony`，要更改所有权的组为 `staff`。\n\n![Images](img/tip.jpg)\n\n\
  **提示** 使用 `chown` 配合 `-R` 选项可以一次性更改当前目录及其子目录下多个文件的所有权。这被称为“递归”更改所有权。\n\n## 使用 `chgrp`\
  \ 更改组\n\n除了使用 `chown` 外，`root` 还可以使用 `chgrp` 来更改文件或目录的组。只需输入 `chgrp <group> <file\
  \ or directory>` 即可。例如，将 `/tmp/myfile.txt` 文件（在前例中讨论过）的组所有权从 `root` 更改为 `staff`，输入\
  \ `chgrp staff /tmp/myfile.txt`如下：\n\n![Images](img/f0161-02.jpg)\n\n## 练习 6-1：管理所有权\n\
  \n在此练习中，通过 Linux 系统的 shell 提示符练习修改文件和目录的所有权。请使用随书附的虚拟机进行此练习。\n\n![Images](img/video.jpg)\n\
  \n**视频** 请观看练习 6-1 视频，演示如何执行此任务。\n\n完成以下步骤：\n\n1. 使用登录名 `student1` 和密码 `student1`\
  \ 登录系统。\n2. 点击 Applications（应用程序）| Favorites（收藏）| Terminal（终端）打开终端。\n3. 使用 `su –`\
  \ 命令切换到 `root` 用户账户，密码为 `password`。\n4. 通过以下操作验证 `student1` 用户是 `research` 组的成员：\n\
  \n![Images](img/note.jpg)\n\n**注意** `research` 组在第 4 章 的练习 4-2 中配置。\n\na. 在 shell\
  \ 提示符下，输入 `cat /etc/group`。\nb. 验证 `student1` 用户是 `research` 组的成员。\nc. 如果 `student1`\
  \ 用户不是 `research` 组的成员，使用 `usermod` 命令将 `student1` 添加到该组：\n`usermod -aG research\
  \ student1`\n\n5. 在 shell 提示符下输入 `cd /` 进入 `/` 目录。\n6. 在 shell 提示符下输入 `mkdir RandD`\
  \ 创建名为 `RandD` 的新目录。\n7. 在 shell 提示符下，输入 `ls -l`。注意 `root` 用户账户和 `root` 组是新目录的所有者。\n\
  8. 在 shell 提示符下输入 `chown student1:research RandD` 将目录的所有权更改为 `student1` 用户账户和 `research`\
  \ 组。\n9. 在 shell 提示符下再次输入 `ls -l`。验证 `RandD` 目录的所有权已更改为 `student1` 用户和 `research`\
  \ 组，如下：\n\n![Images](img/f0162-01.jpg)\n\n## 管理文件和目录权限\n\n管理所有权仅代表控制 Linux 文件系统中文件和目录访问所需要执行的工作的一部分。所有权仅指定了谁*拥有*什么，而没有规定人们对文件和目录可以做或不能做什么。本节涵盖了：\n\
  \n* 权限的工作原理\n* 从命令行管理权限\n* 使用默认权限\n* 使用特殊权限\n\n开始之前，你必须理解*权限*的工作原理，接下来将讨论。\n\n###\
  \ 权限的工作原理\n\n与所有权不同，权限用于指定用户对文件和目录可以做什么。权限可以允许用户查看、修改或执行文件。权限也可以阻止用户这样做。这些权限共同构成了*模式*（mode），如表\
  \ 6-1。\n\n![Images](img/f0163-01.jpg)\n\n**表 6-1 权限及其影响**\n\n| 实体 |  |\n| :--- |\
  \ :--- |\n| 所有者/用户(`u`) | 这是文件或目录的所有者。 |\n| 组(`g`) | 这是分配给文件或目录的组。 |\n| 世界/其他(`o`)\
  \ | 指所有既不是所有者也不属于该组的其他用户。 |\n\n用户运行 `ls -l` 命令来查看系统中分配给文件或目录的权限。考虑此处显示的示例：\n\n![Images](img/f0164-01.jpg)\n\
  \n显示的第一个列是每个文件和目录的模式。模式的第一个字符表示文件类型，可以是普通文件 (`-`)、目录 (`d`)、符号链接 (`l`)、块设备 (`b`)\
  \ 或字符设备 (`c`)。如所示，`Project_design.odt` 和 `Project_schedule.odt` 是普通文件，而 `Desktop`\
  \ 是一个目录。\n\n*块设备*是某些硬件（如硬盘驱动器）的驱动程序，它以“块”为单位从硬盘传输数据到内存*字符设备*是硬件（如键盘或鼠标）的驱动程序，它一次传输一个位或一个字节的数据。*符号链接*就像快捷方式，被重定向到它所“链接”的文件，正如第\
  \ 5 章 中讨论的。\n\n接下来的三个字符是分配给条目所有者：*用户*的权限。例如，`Project_schedule.odt` 为其用户 (`tcboony`)\
  \ 分配了 `rw-`。这意味着 `tcboony` 对文件具有读取写入权限，但没有执行权限。由于该文件不是程序或脚本，因此不需要执行权限。由于用户具有读写权限，`tcboony`\
  \ 可以打开、编辑并保存文件更改。\n\n\n\n\n\n接下来的三个字符是分配给组的权限。在这种情况下，它是 `staff` 组。系统上的任何 `staff`\
  \ 组成员的用户都获得对 `Project_schedule.odt` 文件的 `r--` 访问。这意味着他们拥有读取权限，允许打开文件并查看其内容，但不允许对文件保存任何更改。\n\
  \n在我们继续下去之前，每个实体的权限也可以用数值表示。这是通过给每个权限分配一个值来实现的，如表 6-2 所示。\n\n![Images](img/f0165-01.jpg)\n\
  \n**表 6-2** 分配给权限的数值\n\n使用这些值，分配给用户 (`u`)、组 (`g`) 或其他 (`o`) 的权限可以用单个数字来表示。简单地将每个权限的值相加即可。例如，假设*用户*被分配了文件的读取和写入权限。要确定此分配的数值值，只需将读取和写入的值相加（4\
  \ + 2 = 6）。文件或目录的模式通常由三个数字表示，分别定义所有者、组和其他。请考虑图 6-2 所示的示例。\n\n![Images](img/F06-02.jpg)\n\
  \n**图 6-2** 用数值表示权限\n\n在这个示例中，关联文件的用户具有读取和写入权限 (6)，组具有读取权限 (4)，其他也有读取权限 (4)。使用 `ls\
  \ -l` 命令，该模式将表示为 `-rw-r--r--`，如下所示的文件 `myfile.txt`：\n\n![Images](img/f0165-03.jpg)\n\
  \n那么，如果这些权限不正确怎么办？使用 `chmod` 工具来修改它们！让我们讨论如何操作。\n\n### 从命令行管理权限\n\n虽然 CompTIA Linux+\
  \ 考试没有涵盖使用 GUI，但 Linux 员员可以通过图形化界面修改权限。例如，使用 GNOME 桌面环境中的文件浏览器，你可以右键点击任何文件或目录，然后选择“属性\
  \ | 权限”来更改文件权限。将显示图 6-3 所示的屏幕。\n\n![Images](img/F06-03.jpg)\n\n**图 6-3** 在文件浏览器中设置权限\n\
  \n然而，对于 Linux+ 考试，你必须能够使用命令行工具通过 `chmod` 修改权限来完成任务。要使用 `chmod`，你必须拥有该文件或以 `root`\
  \ 身份登录。\n\n`chmod` 可以使用几种不同的语法。第一个是在 shell 提示符处输入命令 `chmod <entity=permissions>\
  \ <filename>`。在命令的 `entity` 部分用 `u` 替换所有者，用 `g` 替换组，用 `o` 替换其他。同样在命令的 `permissions`\
  \ 部分用 `r`、`w` 和/或 `x` 替换。例如，要将 `contacts.odt` 文件的模式更改 `-rw-rw-r--`（赋予*用户*和*组*读取和写入权限，而只给*其他*读取访问权限），在\
  \ shell 提示符输入 `chmod u=rw,g=rw,o=r contacts.odt` 或 `chmod ug=rw,o=r contacts.odt`（假设文件位于当前目录）。权限调整如下：\n\
  \n![Images](img/f0166-02.jpg)\n\n还可以使用 `+` 或 `–` 符号使用 `chmod` 切换特定权限的开启或关闭。例如，要关闭赋予\
  \ `contacts.odt` 文件组的写入权限，在 shell 提示符输入 `chmod g-w contacts.odt`。一旦执行，指定的权限将被关闭，如下：\n\
  \n![Images](img/f0166-03.jpg)\n\n要重新开启权限，输入 `chmod g+w contacts.odt`。或者，替换 `u` 或\
  \ `o` 以分别修改*所有者*或*其他*对文件或目录的权限。\n\n### 项目团队协作的功能\n\n在团队合作进行项目时，目录有一个特殊设置。当通过 `chmod\
  \ g+s <directory>` 在目录组设置特殊权限位时，随后在该目录中创建的任何文件将继承目录的组，而不是创建文件的用户的主组。参见此处所示名为 `temp`\
  \ 的子目录示例：\n\n![Images](img/f0167-01.jpg)\n\n### 通过 `wheel` 组获取 `root` 权限\n\n历史上，`wheel`\
  \ 组是系统管理员的特殊组。该组的成员可以在标准用户账户内执行受限命令。*要谨慎*将成员添加到 `wheel` 组并将文件、目录和命令添加到 `wheel` 组，因为存在安全风险。\n\
  \n分配管理控制的更好功能是 `sudo`，因为它记录了管理活动。今天，基于 RHEL 的系统中添加到 `wheel` 组的成员或基于 Debian 的系统中添加到\
  \ `sudo` 组的成员被授予了 `sudo` 访问权限。详情请参见第 16 章。\n\n### 数字更改权限\n\n最后，你也可以使用 `chmod`权限，这是系统管理员最常用的。只需同时修改所有三个实体。执行此操作，输入\
  \ `chmod <numeric_permission> <filename>`。\n\n回到之前的示例，假设一个终端用户想要授予用户和组读取和写入权限，但移除其他人的所有权限。这意味着用户和组的权限用数值表示为\
  \ 6。由于其他用户没有权限，它将表示为 0。通过在 shell 提示符输入 `chmod 660 contacts.odt` 实现此操作。完成后，将进行相应的更改，如下例所示：\n\
  \n![Images](img/f0167-02.jpg)\n\n![Images](img/tip.jpg)\n\n**提示** 使用 `chmod` 的 `-R`\
  \ 选项可以一次性递归地更改许多文件的权限。\n\n### 用户和组权限的故障排除提示\n\n当用户尝试读取他们没有访问权限的文件时，他们将收到一个晦涩的错误消息，如下：\n\
  \n![Images](img/f0167-03.jpg)\n\n是的，打印的错误可以更好，例如 `cat: file.txt: read permission\
  \ denied`，但 Linux 正在缓慢改进并变得更加友好。\n\n所以，在查看 `Permission denied` 错误消息后，运行 `ls -l <filename>`\
  \ 来找到文件缺少哪个用户或组权限，并运行 `ls -ld .` 来发现目录缺少哪个用户或组权限。确定问题后，文件所有者或系统管理员可以更改权限。\n\n让我们在以下练习中管理权限。\n\
  \n**练习 6-2：管理权限**\n\n在此练习中，你将在 Linux 系统的 shell 提示符下修改权限。你还为假设的研究设计团队创建了一份设计文档并修改其权限以控制访问。请使用书中附带虚拟机执行此练习。\n\
  \n![Images](img/video.jpg)\n\n**视频** 请观看练习 6-2 视频以获取如何执行此任务的演示。\n\n完成以下步骤：\n\n**1.**\
  \ 使用登录名 `student1` 和密码 `student1` 登录系统。点击“应用程序 | 终端”启动终端。\n\n**2.** 使用 `su -` 命令切换到\
  \ `root` 用户账户并输入密码。\n\n**3.** 在 shell 提示符输入 `cd /RandD` 切换到 `/RandD` 目录。\n\n**4.**\
  \ 通过以下步骤为团队创建设计文档并限制其访问：\n\n**a.** 在 shell 提示符输入 `touch design_doc.odt` 创建名为 `design_doc.odt`\
  \ 的新文件。\n\n**b.** 在 shell 提示符输入 `ls -l` 命令。注意 `root` 用户账户和 `root` 组是新文件的所有者。\n\n\
  **c.** 使用以下命令将文件的所有权更改为 `student1` 用户账户和 `research` 组：\n\n```\nchown student1:research\
  \ design_doc.odt\n```\n\n**d.** 再次在 shell 提示符输入 `ls -l`。验证目录的所有权已更改为 `student1`\
  \ 用户账户和 `research` 组。注意用户对文件具有 `rw-` 权限，但组仅具有 `r--` 权限。\n\n\n\n\n**e.** 在 shell\
  \ 提示符处输入 `chmod g+w design_doc.odt` 赋予 `Group` `rw-` 权限。\n\n**f.** 再次在 shell 提示符处输入\
  \ `ls -l`。注意*用户*和*组*现在对该文件具有读/写权限。\n\n**g.** 注意*其他* 对该文件具有读取权限。为了保持此文档的机密性，在 shell\
  \ 提示符处输入 `chmod 660 design_doc.odt` 此权限。\n\n**h.** 再次输入 `ls -l`。验证*其他* 对此文件没有权限。\n\
  \n**5.** 接下来，使用权限控制对目录本身的访问。执行以下操作：\n\n**a.** 在 shell 提示符处输入 `ls -ld`。注意*用户*对 `RandD`\
  \ 目录具有完全访问权限，但*组* 缺少对目录的写权限。同样注意*其他* 可以读取目录内容 (`r`) 并进入目录 (`x`)。\n\n**b.** 在 shell\
  \ 提示符处输入 `chmod 770 RandD` 授予*组* 对目录的完全访问权限，并完全移除*其他* 对目录的访问。\n\n**c.** 在 shell\
  \ 提示符处输入 `ls -ld`。验证*用户*和*组* 具有完全访问权限，且*其他* 没有访问权限。\n\n### 使用默认权限\n\n每当文件系统中创建新文件或目录时，都会自动分配一组默认权限。\n\
  \n默认情况下，Linux 在文件系统中创建每个文件时，都会默认为其分配 `rw-rw-rw-` (`666`) 权限。它还会在文件系统中创建的每个目录上分配\
  \ `rwxrwxrwx` (`777`) 权限。然而，由于一种名为 `umask` 的安全功能，这些并不是文件或目录最终实际拥有的权限。让我们来看一个例子。\n\
  \n假设 `tcboony` 想要在她的家目录中创建一个名为 `revenue` 的新目录，并在 `revenue` 目录中创建一个名为 `projections.odt`\
  \ 的文件。根据我们刚刚讨论的内容，`revenue` 目录应该具有 `rwxrwxrwx` 模式，而 `projections.odt` 文件应该具有 `rw-rw-rw-`\
  \ 模式。然而，事实并非如此，如下所示：\n\n![Images](img/f0169-01.jpg)\n\n注意 `revenue` 目录的模式为 `drwxr-xr-x`\
  \ (`755`)。这意味着目录的用户对目录具有读、写、执行权限。组和*其他* 对目录具有读和执行权限。同样，注意 `projections.odt` 文件的模式为\
  \ `-rw-r--r--` (`644`)。`所有者`（Owner）具有读写权限，而组和*其他* 只有读取权限。\n\n这些并不是 Linux 应该分配的默认权限！为什么会发生这种情况？因为默认权限是不安全的。想一想：默认的目录模式将允许系统上的任何人进入任何目录并删除他们想要的任何文件。同样，默认的文件模式将允许系统上的任何用户修改你创建的文件。这简直是一场噩梦！\n\
  \n##### 使用 `umask` 安全文件和目录\n\n为了提高系统的整体安全性，Linux 使用 `umask` 在文件系统中创建任何文件或目录时，自动从默认模式中移除权限。`umask`\
  \ 的值是一个三位或四位数字，如下所示：\n\n![Images](img/f0170-01.jpg)\n\n对于大多数 Linux 发行版，`umask` 的默认值为\
  \ `0022` 或 `022`。每个数字代表一个要被*移除*的权限值。对于 `022` 的 `umask`，第一个数字 (`0`) 指的是——你猜对了——*用户*。中间的数字\
  \ (`2`) 指的是*组*，最后一个数字 (`2`) 指的是*其他*。因为为*用户*列出了 `0`（零），所以不会从文件或目录用户的默认模式中移除任何权限。\n\
  \n然而，由于为组和*其他*列出了 `2`，因此每当在文件系统中创建文件或目录时，组和*其他*的写权限都会从默认模式中移除。`umask` 的功能见图 6-4。对于\
  \ `0022` 的 `umask`，第一个 `0` 将在接下来的章节“使用特殊权限”中讨论。）\n\n![Images](img/F06-04.jpg)\n\n\
  **图 6-4** `umask` 的工作原理\n\n`umask` 的默认值适用于大多数 Linux 管理员。然而，在某些情况下，你可能需要收紧或放宽创建文件或目录时分配的权限。要做到这一点，请更改分配给\
  \ `umask` 的值。\n\n你可以通过在 shell 提示符处输入 `umask <value>` 来对 `umask` 进行临时更改。例如，为了移除在创建新目录时自动分配给*其他*的执行权限，请输入\
  \ `umask 023`。这将导致在创建时从*组*中移除写权限 (`2`)，同时从*其他*中移除写权限 (`2`) 和执行权限 (`1`)。这将有效地阻止除目录的*用户*或成员之外的任何人进入新目录。如下：\n\
  \n![Images](img/f0170-02)\n\n注意 `revenue` 目录的模式为 `drwxr-xr-x` (`755`)。这意味着目录的用户对目录具有读、写、执行权限。组和*其他*\
  \ 对目录具有读和执行权限。同样，注意 `projections.odt` 文件的模式为 `-rw-r--r--` (`644`)。`所有者`（Owner）具有读写权限，而组和*其他*\
  \ 只有读取权限。\n\n**这些并不是 Linux 应该分配的默认权限！为什么会发生这种情况？因为默认权限是不安全的。想一想：默认的目录模式将允许系统上的任何人进入任何目录并删除他们想要的任何文件。同样，默认的文件模式将允许系统上的任何用户修改你创建的文件。这简直是一场噩梦！\n\
  \n##### 设置永久的 `umask`\n\n`umask` 的默认值适用于大多数 Linux 管理员。然而，在某些情况下，你可能需要收紧或放宽创建文件或目录时分配的权限。要做到这一点，请更改分配给\
  \ `umask` 的值。\n\n你可以通过在 shell 提示符处输入 `umask <value>` 来对 `umask` 进行临时更改。例如，为了移除在创建新目录时自动分配给*其他*的执行权限，请输入\
  \ `umask 023`。这将导致在创建时从*组*中移除写权限 (`2`)，同时从*其他*中移除写权限 (`2`) 和执行权限 (`1`)。这将有效地阻止除目录的*用户*或成员之外的任何人进入新目录。\n\
  \n要使 `umask` 的更改变为永久，只需根据发行版编辑相应的配置文件 `/etc/profile`、`/etc/bashrc`、`/etc/defs` 或\
  \ `~/.bashrc`（其中 `~` 表示终端用户的家目录）。\n\n### 使用默认权限\n\n每当文件系统中创建新文件或目录时，都会自动分配一组默认权限。\n\
