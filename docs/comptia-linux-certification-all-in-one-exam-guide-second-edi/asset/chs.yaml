  \n考虑到上表中的建议，你现在可以使用下表来确定将学习精力集中在哪些领域：\n\n![Images](img/f0052-02.jpg)\n\n# 第 2 章\n\
  \n## 使用 `vi` 编辑器\n\n在本章中，你将学习到：\n\n• `vi` 编辑器的作用和功能\n• 在 `vi` 中编辑文本文件\n• 在 `nano`\
  \ 中编辑文本文件\n\n*每一个生命都是一件杰作，由自然书写，由演化编辑。*\n—尼尔·德·格拉斯·泰森，海登行星馆\n\n在操作任何 Linux 系统时，你需要的技能技能之一就是有效使用文本编辑器。Linux\
  \ 中的大多数系统配置任务都是通过使用编辑器修改文本文件完成的，无论你是在重装操作系统还是配置服务。\n\n### `vi` 编辑器的作用和功能\n\n你可能熟悉其他操作系统自带的文本编辑器，例如\
  \ Windows 记事本（Notepad）或 macOS 的 TextEdit，但 `vi`（读音为 *vee-eye*）是不同的。`vi` 工具是在计算机鼠标和方向键发明之前发明的。因此，我们花时间学习\
  \ `vi` 是因为：\n\n• 知道如何使用文本编辑器对于管理 Linux 系统至关重要。如果你不会使用文本编辑器，在处理书中介绍的其他主题时将非常困难。\n\
  • Linux 编辑器对于大多数新用户来说很难学习。\n\n`vi` 有两个版本。经典版本被称为 `vi`。较新的版本被称为 `vim`，它是一个理解方向键的\
  \ `vi` 增强版。在较新版本的 Linux 中，执行 `vi` 命令实际上运行的是 `vim` 命令。执行 `vim` 命令会打开 Vi 增强版（见图 2-1）。\n\
  \n![Images](img/F02-01.jpg)\n\n**图 2-1** 使用 `vim`\n\n每个 `vi` 和 `vim` 安装程序都包含一个名为\
  \ `vimtutor` 的教程。运行 `vimtutor` 将教你基础的 `vi` 编辑命令，例如移动光标和保存文件更改。\n\n基于此，让我们讨论如何在 `vi`\
  \ 中编辑文本文件。\n\n### 在 `vi` 中编辑文本文件\n\n第一次运行 `vi` 时，你会注意到用户界面与你在其他文本编辑器中看到的非常不同。为了帮助你熟悉\
  \ `vi`，我们将讨论以下主题：\n\n• 在 `vi` 中打开文件\n• `vi` 模式\n• 在普通模式下工作\n• 在命令行模式下工作\n\n### 在\
  \ `vi` 中打开文件\n\n要从 shell 提示符用 `vi` 打开文件，只需输入 `vi <filename>`。你默认从普通模式开始。例如，对于名为\
  \ `myfile.txt` 的文件，只需在 shell 提示符输入 `vi myfile.txt` 即可将该文件加载到 `vi` 编辑器中。\n\n![Images](img/exam.jpg)\n\
  \n**考试提示**尽管大多数 Linux 系统在用户运行 `vi` 时会启动 `vim`，但 Linux+ 考试侧重于使用 `vi`，因此知道如何在不使用方向键的情况下移动光标。在本章的剩余部分，假设\
  \ `vi` 和 `vim` 是同一个命令。\n\n要创建一个新文本文件，只需在 shell 提示符输入 `vi` 后跟文件名。例如，图 2-2 显示了在 shell\
  \ 提示符输入了命令 `vi yourfile.txt`。注意，当在 `vi` 编辑器界面打开空白文件时，屏幕底部会显示“[New File]”。文件位于内存缓冲区中，直到被写入或保存到硬盘。如果文件未保存，它将会丢失！\n\
  \n![Images](img/F02-02.jpg)\n\n**图 2-2** 使用 `vi` 创建新文件\n\n现在，让我们讨论 `vi` 模式。\n\n\
  ### `vi` 模式\n\n到目前为止一切顺利，对吧？我教的大多数学生都能处理打开或创建文件。然而，一旦打开，情况就会变得有点复杂，因为与记事本或 gedit\
  \ 等其他文字处理器不同，`vi` 禁用了鼠标和方向键。由于 `vi` 在鼠标和方向键发明之前就已经存在。\n\n`vi` 命令使用四种操作模式：\n\n• 普通模式\
  \ (Normal mode)\n• 命令行模式 (Command-line mode)\n• 插入模式 (Insert mode)\n• 搜索模式 (Search\
  \ mode)\n\n要切换模式切换，请按下 `Esc` 键。这将始终带你回到普通模式，从那里你可以访问任何其他模式。\n\n##### 普通模式\n\n按一次\
  \ `Esc` 键进入普通模式。普通模式允许你执行移动命令，例如将光标上、下、向左、向右移动或上下滚动半页或整页。最常用的移动命令如下：\n\n• `h` 将光标向左移动一个字符\n\
  • `l` 将光标向右移动一个字符\n• `k` 将光标向上移动一个字符\n• `j` 将光标向下移动一个字符\n• `Ctrl-D` 将光标向下移动半页\n\
  • `Ctrl-U` 将光标向上移动半页\n• `Ctrl-B` 将光标向后翻一页\n• `Ctrl-F` 将光标向前翻页\n\n##### 命令行模式\n\n\
  按下 `:`（冒号键）进入命令行模式。在命令行模式下，你可以执行允许搜索、保存和退出的命令。例如：\n\n• `:x` 将当前文件写入磁盘\n• `:wq` 保存并写入文件到磁盘\n\
  • `:q` 如果文件未修改则退出\n• `:q!` 不保存强制退出\n\n##### 插入模式\n\n至少有六种插入选项。与 Linux 中的大多数命令一样，`vi`\
  \ 是区分大小写的。在进入插入模式之前必须处于普通模式。（如果你不确定处于哪种模式，按下 `Esc` 键。这将回到普通模式。）以下是基本插入选项及其实现的功能：\n\
  \n• `i` 在光标左侧插入文本\n• `I` 在行首插入文本\n• `a` 在光标右侧追加文本\n• `A` 在行末尾追加文本\n• `o` 在当前行下方新行并开始插入文本\n\
  • `O` 在当前行上方新行并开始插入文本\n\n##### 搜索模式\n\n使用搜索模式查找单词、短语或字符串。使用正斜杠（/）向前搜索，或使用问号（?）反向方向搜索。\n\
  \n• `/<string>` 向前搜索。例如，`/test` 从光标位置向前搜索字符串 `test`\n• `?<string>` 反向搜索。例如，`?test`\
  \ 从光标位置反向搜索字符串 `test`\n• `n` 按相同方向继续搜索\n• `N` 按相反方向继续搜索\n\n搜索评估字符串，因此如果你输入 `/the`\
  \ 来查找字符串 `the` 的所有出现处，匹配项包括 `the`、`father`、`mother` 以及任何包含字符串 `the` 的单词。\n\n####\
  \ 在普通模式下工作\n\n在 `vi` 中打开文件时，你会进入普通模式。注意屏幕左侧（如图 2-2 所示）有几行波浪号（~）。这些字符仅表示相应的行是空的。当你向文件中添加行时，波浪号会开始滚动并消失。\n\
  \n\n\n\n\n\n与 `vim` 不同，`vi` 不支持使用方向键或鼠标来移动光标，因此 `vi` 的开发者创建了替代的导航方法。这里列出了一些常用的光标移动方法：\n\
  \n* `w` 将光标向右移动到下一个单词\n* `b` 将光标向左移动到上一个单词\n* `^` 将光标移动到行首\n* `$` 将光标移动到行的最后一个字符\n\
  * `nG` 将光标移动到第 *n* 行\n* `gg` 将光标移动到文档的第一行\n* `G` 将光标移动到文档的最后一行\n\n在命令前加上数字可以重复该命令指定的的次数。例如，`2h`\
  \ 将光标向左移动两个字符，`5j` 将光标向下移动五行。\n\n### 删除和替换字符及单词\n\n在插入模式（insert mode）下，你可以通过按下 `Backspace`\
  \ 键来删除最近添加的文本。但在普通模式（normal mode）下，使用以下命令可以删除字符、单词或行：\n\n* `x` 删除当前光标位置的字符\n* `X`\
  \ 删除光标左侧的字符\n* `u` 撤销上次编辑\n* `r` 替换当前光标位置的字符\n* `R` 替换字符，直到回到普通模式\n* `dw` 删除从当前光标位置到单词结束的单词\n\
  * `D` 删除从光标位置到当前行的剩余部分\n* `dd` 删除当前行\n\n### 修改单词或行\n\n在普通模式下，你可以使用 `C` 或 `c` 前缀来更改经典\
  \ `vi` 或 `vim` 中的文本。以下列表显示了其中一些功能：\n\n* `cw` 修改当前单词\n* `C` 从当前光标位置修改到行尾\n* `cc`\
  \ 修改当前行\n\n### 复制、删除和移动行\n\n在普通模式下复制或删除行时，请将光标移动到该行，并按照此处的描述复制（称为 *yanking*）或删除行：\n\
  \n* `yy` 将当前行复制（yank）到缓冲区中\n* `3yy` 将当前行及之后的两行复制到缓冲区中\n* `dd` 删除当前行并将其放入缓冲区\n* `5dd`\
  \ 删除当前行及之后的四行并将其放入缓冲区\n* `p` 将缓冲区中的行粘贴到光标下方行\n* `P` 将缓冲区中的行粘贴到光标上方的行\n\n### 重复命令\n\
  \n在普通模式下，按下点键（`.` key）可以重复上一次命令。\n\n### 在普通模式下保存并退出\n\n在普通模式下输入 `ZZ` 命令可以将当前文件写入磁盘并退出。\n\
  \n#### 在命令行模式下工作\n\n命令行执行针对整个文档的命令。要进入命令行模式，请在普通模式下按下 `:`。这会将光标置于当前屏幕底部，如图 2-3 所示。接下来，在\
  \ `:` 提示符后输入命令以完成与文件相关的任务，下文将进行讨论。\n\n![Images](img/F02-03.jpg)\n\n**图 2-3** `vi`\
  \ 命令行模式提示符\n\n![Images](img/note.jpg)\n\n**注意** 为命令行模式编写的命令示例始终以领先的 `:` 开头，以便说明。\n\
  \n### 删除行\n\n在命令行模式下删除行，请指定行号或行范围，后跟 `d` 命令：\n\n* `:nd` 删除第 *n* 行\n* `:n,yd` 删除从第\
  \ *n* 行到第 *y* 行的内容\n\n### 保存并退出 `vi` \n\n要将文件写入磁盘，在普通模式下输入 `:w <Enter>`。完成后，屏幕底部的提示信息将指示文件已写入磁盘，如示例所示：\n\
  \n![Images](img/f0059-01.jpg)\n\n\n\n\n\n10. 使用 `gg` 将光标移动到文件第一行的第一个单词开头。\n\n11.\
  \ 通过完成以下步骤查找字母 `a` 的所有出现处：\n    a. 在普通模式下，输入 `Esc /a <Enter>`。\n    b. 按 `n` 键找到字母\
  \ `a` 的下一个实例。\n\n12. 按 `Esc` 进入普通模式。使用 `h`、`j`、`k` 和 `l` 键将光标移动到单词 `time` 的第一个字母。\n\
  \    a. 使用 `dw` 命令删除单词 `time`。\n    b. 使用 `h`、`j`、`k` 和 `l` 键将光标移动到最后一行末尾的句号。\n\n\
  13. 输入 `Esc :q!` 在不保存更改的情况下退出文件。\n\n14. `vi` 提供了一个用户教程。输入命令 `vimtutor` 执行一个自学式教程，以进行更多关于\
  \ `vi` 的练习。\n\n### 在 `nano` 中编辑文本文件\n\nGNU `nano` 是 Digital Equipment `pico` 编辑器的克隆。它比\
  \ `vim` 更容易使用，因为它不包含命令行模式，支持方向键，并在页面底部显示上下文驱动的菜单（参见图 2-5）。\n\n![Images](img/F02-05.jpg)\n\
  \n**图 2-5** `nano` 编辑器界面\n\n### 命令键\n\n`nano` 编辑器同时使用 `Ctrl` 键（在帮助菜单中符号为 `^`）和 `Alt`\
  \ 键来发布命令。因此，命令键序列 `^G` 实际上输入 `Ctrl-G` 将打开 `nano` 的帮助屏幕。命令序列 `Alt-/` 将光标移动到文档底部。\n\
  \n表 2-1 展示了打开文件的某些选项。\n\n![Images](img/f0063-02.jpg)\n\n**表 2-1** `nano` 打开文件选项\n\
  \n要移动光标，请使用表 2-2 中指定的键序列。\n\n![Images](img/f0063-03.jpg)\n\n**表 2-2** `nano` 键序列\n\
  \n你可以在 [`www.nano-editor.org`](https://www.nano-editor.org) 找到额外的 `nano` 文档。\n\n\
  ### 配置文件\n\n`nano` 编辑器使用两个配置文件：系统级配置文件 `/etc/nanorc` 和用户主目录下的用户特定文件 `~/.nanorc`。在任何一个文件中设置\
  \ `set nowrap` 语句都可以减少对 `-w` 选项的需求，从而更容易处理从 Windows 计算机传输的文件。\n\n### 本章复\n\n本章介绍了了一些使用\
  \ `vi` 编辑文件的命令。作为一名 CompTIA Linux+ 候选者，你应该能够打开文件、修改文件内容并保存文件。使用内置教程 `vimtutor` 练习对通过\
  \ Linux+ 考试关重要的 `vi` 技能。\n\n在本章中，你学习了以下内容：\n\n* Linux 使用文本文件来存储操作系统和应用程序配置设置。\n\
  * `vi` 的经典版本称为 `vi`，最新版本称为 `vim` (Vi IMproved)。\n* 要用 `vi` 打开文件，输入 `vi <filename>`。如果文件不存在，将创建一个新文件。\n\
  * `vi` 编辑器默认进入普通模式。\n* 要切换到插入模式，按 `i`、`I`、`a`、`A`、`o` 或 `O`。\n* 要切回普通模式，按 `Esc`\
  \ 键。\n* `dd` 删除当前行。\n* `p` 将缓冲区中的行粘贴到光标下方的行。\n* `P` 将缓冲区中的行粘贴到光标上方行。\n* `u` 撤销上一次操作。\n\
  * `yy` 将当前行复制（yank）到缓冲区中。\n* `ZZ` 保存当前文件并退出 `vi`。\n* `h` 将光标向左移动一个字符。\n* `j` 将光标向下移动一行。\n\
  * `k` 将光标向上移动一行。\n* `l` 将光标向右移动一个字符。\n* 在普通模式内部，输入冒号 (`:`) 切换到命令行模式。\n* `:w` 将当前文件写入磁盘。\n\
  * `:x` 将当前文件写入磁盘并退出 `vi`。\n* `:wq` 将当前文件写入磁盘并退出 `vi`。\n* `:q` 在不保存当前文件的情况下关闭 `vi`。\n\
  * `:q!` 即使文件已修改，也不保存更改并关闭 `vi`。\n* `:e!` 忘记自上次写入以来的更改，并在离开的地方继续编辑但不包含最近的更改。\n* 按\
  \ `Ctrl-G` 在底部显示状态行。\n* 输入 `/<string>` 搜索指定的字符串。\n* 输入 `?<string>` 搜索指定的字符串。\n*\
  \ `nano` 编辑器比 `vi` ，因为可以使用方向键移动光标。\n* 要从 `nano` 中保存并退出，按 `Ctrl-X`。\n\n#### question\n\
