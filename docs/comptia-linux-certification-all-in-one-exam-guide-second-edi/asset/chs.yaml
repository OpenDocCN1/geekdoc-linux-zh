  \ 是错误的，因为它省略了用于创建家目录的 `-m` 选项。\n\n### 23\n![Images](img/tick.jpg) **C** 是正确的。`.gitignore`\
  \ 文件包含了 `git` 命令忽略的文件列表。\n\n![Images](img/wrong.jpg) **A**、**B** 和 **D** 都是错误的。**A**\
  \ 和 **B** 是错误的，因为不存在这些文件。**D** 是错误的，因为 `.git` 是包含仓库的目录。（领域 3\\. 脚本自动化）\n\n### 24\n\
  ![Images](img/tick.jpg) **A** 和 **B** 是正确的。用户可以使用反引号（例如 `` `date` ``）或美元符号加括号 `$(date)`。`date`\
  \ 命令的输出将作为 `echo` 命令的输入。\n\n![Images](img/wrong.jpg) **C**、**D** 和 **E** 是错误的。单引号使所有字符变为字面量。双引号除了\
  \ `$` 和 ` `（反引号）之外的所有字符都使变为字面量。美元符号加大括号 `${ }` 用于引用变量。（领域 3\\. 脚本自动化）\n\n### 25\n\
