  \ Bash Shell 特性*大括号扩展* (brace expansion)。在一个新的空目录下运行：\n\n![Images](img/f0403-03.jpg)\n\
  \n#### 命令序列化\n\n你可以使用 `&&`、`||` 或 `;` 元字符将命令序列在一起。`&&` 意味着只有在前一个命令成功时才运行下一个命令。`||`\
  \ 意味着只有在前一个命令失败时才运行下一个命令；`;` 则无论前一个命令成功与否都运行下一个命令。查看以下演示中的命令；每个条目的说明在注释中：\n\n![Images](img/f0403-04.jpg)\n\
  \n当程序成功退出时，它会发送退出码 `0`；当失败时，它发送退出码 `1`。要查看最近运行命令的退出码，请运行 `echo $?`。\n\n命令序列化的其他示例将在本章稍后部分讨论；例如，在脚本中序列命令可以显示脚本是否成功退出。\n\
  \n### 命令替换\n\n命令替换是将命令的结果嵌入到输出中的方法。嵌入命令有两种方法：`` `<command>` `` 或 `$(<command>)`。反引号\
  \ `` ` ```` 位于大多数键盘的左上角，波浪号 `~` 下方。\n\n命令替换的示例可以在 图 13-7 的第 7 行找到。该命令可以写成 ``echo\
  \ \"Current time: `date +%m/%d/%y\" \"%R`````，输出结果可能为 `Current time: 09/30/25 12:15`。\n\
  \n### 理解 Shell 脚本组件\n\n脚本运行一系列由 Shell 解释并执行的命令。脚本由以下部分组成：\n\n• 使用 `#!` 定义解释器\n•\
  \ 使用 `#` 注释\n• 定义变量\n• 读取用户输入\n• 使用位置参数\n• 使用函数\n\n### 使用 `#!` 定义解释器\n\n脚本的第一行也称为\
  \ *shebang* 行，包含了执行脚本时所使用的命令行解释器的绝对路径。例如，图 13-1 中的第 1 行表示脚本将使用 Bash Shell 作为解释器。当你定义解释器时，它必须是第一行；否则，Linux\
  \ 将使用由登录账户定义的默认解释器。\n\n![Images](img/](F13-01.jpg)\n\n**图 13-1** Shebang\n\n命令 `chsh\
  \ -l` 或 `cat /etc/shells` 显示可用命令行解释器的列表。\n\n### 使用 `#` 注释\n\n注释的设计是为了说明目的。一旦你指定了\
  \ Shell 解释器，你就会创建一个注释来详细说明脚本的用途。\n\n多使用注释（参见 图 13-2）。当你或另一个用户在处理脚本几周后必须对其进行故障排除或添加内容时，它们是极好的提醒。例如，当你编辑脚本时，应该考虑创建一个包含编辑日期和原因的注释。所有注释都以\
  \ `#` 符号开头，这告诉解释器忽略符号右侧到行尾的所有文本。\n\n![Images](img/](F13-02.jpg)\n\n**图 13-2** 注释\n\
  \n### 定义变量\n\n变量存储数据。我们将考虑三种变量类型：\n\n• `string`：字符串变量包含字母数字。\n• `integer`：整数变量包含将用于数学表达式的数字。\n\
  • `constant`：常量变量不可更改或删除（即取消设置）。\n\n变量的类型决定了如何使用该变量。`string` 类型包含字母数字，不能用于数学表达式。`integer`\
  \ 类型变量只包含数字。如果为 `integer` 类型变量提供字符串值，则变量的值将变为 0。最后一种变量类型是 `constant`。`constant`\
  \ 类型变量既不能更改也不能删除。\n\n\n\n\n\nBash 解释器在创建变量时不会分配变量类型。如果变量的内容包含字母数字，`Bash` 将其视为 `string`（字符串）。如果变量包含数字，`Bash`\
  \ 将允许在算术表达式中使用。\n\n`declare` 命令允许你为变量分配类型。例如，命令 `declare flower=rose` 创建了一个名为 `flower`\
  \ 的 `string` 变量并赋值为 `rose`。查看变量的属性，请执行 `declare -p <variable_name>`。\n\n你可以使用命令\
  \ `echo $flower` 显示变量的内容。`declare -p` 命令更高效，因为它会显示赋予变量的所有属性。创建一个 `integer`（整数）类型的变量，执行\
  \ `declare -i <var_name>=<value>`。\n\n让我们声明类型和不声明类型之间的区别。在图 13-3 中的第 1 行和第 5 行，分别为变量\
  \ `sum` 分配了数值 `100` 和 `110`。在第 9 行，我们为变量 `sum` 分配了值 `Fred`。\n\n![Images](img/F13-03.jpg)\n\
  \n**图 13-3**  Bash sum\n\n在图 13-4 中的第 1 行，我们使用 `declare` 命令将变量 `sum` 设置为 `integer`\
  \ 类型。在第 4 行，我们将变量的值改为 `110`。在第 7 行，我们将变量的值改为 `Fred`。由于变量 `sum` 被赋值为 `integer` 类型，并将变量的值改为\
  \ `0`。\n\n![Images](img/F13-04.jpg)\n\n**图 13-4**  分配变量类型\n\n### 读取用户输入\n\n有时你需要提示用户响应并在脚本中使用该响应。`read`\
  \ 命令读取用户输入并赋值给 `read` 语句指定的变量。如果没有提供变量名，则使用默认变量 `REPLY`。\n\n在图 13-5 中，第 1–7 行包含脚本\
  \ `read_script.bash`，第 10–12 行显示了脚本的执行。\n\n![Images](img/F13-05.jpg)\n\n**图 13-5**\
  \  使用 `read` 命令\n\n脚本的第 4 行请求用户输入但未指定变量；因此，用户的姓名将存储在变量 `REPLY` 中。第 5 行将用户的输入赋值给变量\
  \ `lname`。你可以使用 `-t` 选项限制用户响应的时间。命令 `echo -n \"Enter your name: \"; read -t 5` 允许用户有五秒回复，否则脚本将终止。\n\
  \n### 使用位置参数\n\n命令行脚本可以接受最多九个参数，根据其位置进行识别。例如，如果你运行\n\n![Images](img/f0407-02.jpg)\n\
  \n`fred` 作为 `$1``george` 作为 `$2``andrew` 作为 `$3`。运行命令 `echo $2` 显示 `george`。\n\n\
  通过位置参数修改脚本。在图 13-6 中第 3 行，脚本使用 `echo` 命令显示命令行的第一和第二个参数。\n\n![Images](img/F13-06.jpg)\n\
  \n**图 13-6**  脚本中的位置参数\n\n通过使用表 13-2 中的代码可以找到更多脚本信息。记住 `$` 是一个元字符。运行 `echo $*` 显示所有参数，即\
  \ `fred andrew`。运行 `$#` 显示参数的数量，即 `3`。\n\n![Images](img/f0407-04.jpg)\n\n**表 13-2**\
  \  附加参数\n\n### 使用函数\n\n函数是包含一组执行特定任务命令的命名部分。与其反复编写相同的代码，你可以创建一个函数并在脚本调用（执行）该函数。函数使用\
