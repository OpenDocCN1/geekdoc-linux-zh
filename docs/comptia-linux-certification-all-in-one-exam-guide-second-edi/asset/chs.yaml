  \ E\n[49]. A\n[50]. A\n[51]. A\n[52]. B\n[53]. C\n[54]. B, D\n[55]. C\n[56]. A\n\
  [57]. A\n[58]. D\n[59]. B\n[60]. A, C\n[61]. C\n[62]. D\n[63]. A\n[64]. D\n[65].\
  \ A, B, C\n[66]. D\n[67]. B\n[68]. A\n[69]. B\n[70]. C, D\n[71]. D\n[72]. A\n[73].\
  \ C\n[74]. B\n[75]. D\n[76]. B\n[77]. B, C, D\n[78]. D\n[79]. B\n[80]. B\n[81].\
  \ A\n[82]. B\n[83]. C\n[84]. B\n[85]. A\n[86]. B\n[87]. D\n[88]. C\n[89]. A\n[90].\
  \ B\n\n#### 深度答案解析\n\n#### [1]. ![Images](img/tick.jpg) **B** 和 **C** 是正确的。`/etc/bashrc`\
  \ 和 `~/.bashrc` 都用于配置非登录 shell，尽管在某些发行版中可能会使用其他文件。\n![Images](img/wrong.jpg) **A**、**D**\
  \ 和 **E** 是错误的。`/etc/profile`、`~/.profile` 和 `~/.bash_profile` 用于配置登录 shell。（领域\
  \ 1. 系统管理）\n\n#### [2]. ![Images](img/tick.jpg) **A** 和 **D** 是正确的。用户可以运行 `at 4PM`、`at\
  \ 16:00` 或 `at teatime` 来调度任务在在下午 4 点运行。\n![Images](img/wrong.jpg) **B**、**C** 和\
  \ **E** 是错误的。这些其他形式的 `at` 命令将返回语法错误。（领域 3. 脚本、容器与自动化）\n\n#### [3]. ![Images](img/tick.jpg)\
  \ **A** 是正确的。在 `vi` 编辑器中按 `Insert` 或 `i` 进入插入模式。\n![Images](img/wrong.jpg) **B**、**C**、**D**\
  \ 和 **E** 是错误的。在 `vi` 编辑器中，`Esc` 键用于从插入模式返回普通（命令）模式。`a` 键用于在光标后追加文本。`o` 键在下方打开新行并插入文本。`r`\
  \ 键用于替换单个字符，`x` 键用于 `vi` 编辑器删除单个字符。`w` 和 `z` 在普通模式下不起作用。（领域 1. 系统管理）\n\n#### [4].\
  \ ![Images](img/tick.jpg) **D** 是正确的。在 `/etc/netplan/config.yaml` 文件中保存网络配置，以便在启动时自动配置。\n\
  ![Images](img/wrong.jpg) **A**、**B** 和 **C** 是错误的。`/etc/X11` 文件用于 X-Window GUI 设置，而\
  \ `/etc/dnf` 和 `/etc/yum.repos.d` 文件指向软件安装仓库。（领域 1. 系统管理）\n\n#### [5]. ![Images](img/tick.jpg)\
  \ **B** 是正确的。`mkdir` 命令用于在文件系统中创建新目录，其中 `~` 代表用户的家目录（在此例中为 `/home/user/files` 或\
  \ `~/Files`）。\n![Images](img/wrong.jpg) **A** 是错误的，因为它对目录名使用了错误的大小写。**C** 和 **E**\
  \ 是错误的，因为它们使用了创建新目录的错误命令（`md`）。**D** 是错误的，因为它在波浪号后漏掉了 `/` 字符。（领域 1. 系统管理）\n\n####\
  \ [6]. ![Images](img/tick.jpg) **B** 是正确的。运行 `ls -Z` 将允许用户查看当前的 SELinux 设置并确定是否需要更改。\n\
  ![Images](img/wrong.jpg) **A**、**C**、**D** 和 **E** 是错误的。`ls -s` 或 `ls -l` 命令都不会列出任何\
  \ SELinux 文件信息，而是分别显示文件大小和“详细列表”。`restorecon` 命令用于修复和恢复 SELinux 标签。`aa-disable`\
  \ 命令用于禁用 AppArmor 而不是 SELinux。（领域 2. 安全）\n\n#### [7]. ![Images](img/tick.jpg) **A**、**B**\
  \ 和 **E** 是正确的。`ZZ`、`:x` 和 `:wq` 命令将保存当前文件的任何更改，然后关闭 `vi` 编辑器。\n![Images](img/wrong.jpg)\
  \ **C** 和 **D** 是错误的。`:q` 命令将关闭当前文件并退出编辑器而不保存更改。`:q!` 命令将丢弃对当前文件做的任何更改，关闭文件并退出编辑器。（领域\
  \ 1. 系统管理）\n\n#### [8]. ![Images](img/tick.jpg) **D** 是正确的。`chmod 600 widgets.odt`\
  \ 命令赋予所有者 `rw-` 权限，但剥夺所有其他用户的权限。\n![Images](img/wrong.jpg) **A**、**B** 和 **C** 是错误的。**A**\
  \ 是错误的，因为它允许所有者编辑文件，并授予组读写权限。**B** 是错误的，因为它授予组读取（`r`）权限。**C** 是错误的，因为它授予所有者、组和其他所有权限。（领域\
  \ 2. 安全）\n\n#### [9]. ![Images](img/tick.jpg) **A** 是正确的。`chmod 660 project.odt`\
  \ 授予所有者 `rw-` 权限，组 `rw-` 权限，其他 `---` 权限。\n![Images](img/wrong.jpg) **B**、**C** 和\
  \ **D** 是错误的。**B** 是错误的，因为它没有授予组写入（`w`）权限。**C** 是错误的，因为它授予所有者、组和其他所有权限。**D** 是错误的，因为它没有授予组写入（`w`）权限，并授予其他读取（`r--`）权限。（领域\
  \ 2. 安全）\n\n#### [10]. ![Images](img/tick.jpg) **A** 和 **E** 是正确的。`usermod -aG`将指定的用户添加到指定的组中。\n\
  ![Images](img/wrong.jpg) **B**、**C** 和 **D** 是错误的。`-s` 选项用于 `usermod` 命令定义用户运行的“登录\
  \ shell”。`-g` 选项分配用户的**主**组。`-p` 选项更改分配用户的密码。（领域 1. 系统管理）\n\n#### [11]. ![Images](img/tick.jpg)\
  \ **B** 是正确的。`until` 循环只要条件为 `false` 就会一直运行。一旦条件变为 `true`，它就会停止。\n![Images](img/wrong.jpg)\
  \ **A**、**C** 和 **D** 是错误的。`while` 循环在条件不再为 `true` 时重复执行。`for` 循环处理特定的次数。`case`\
  \ 语句不是循环结构。（领域 3. 脚本、容器与自动化）\n\n#### [12]. ![Images](img/tick.jpg) **C** 和 **F**\
  \ 是正确的。Samba 服务提供文件共享。CUPS 用于管理打印。\n![Images](img/wrong.jpg) **A**、**B**、**D** 和\
  \ **E** 是错误的。Apache Web 服务器经常与 MySQL 数据库服务器结合在 Linux 上用于开发 Web 应用程序。Telnet 是一种曾经用于远程访问的旧服务。Pure-FTP\
  \ 提供 FTP 服务。（领域 1. 系统管理）\n\n\n\n\n\n### 13\n![Images](img/tick.jpg) **E** 是正确的。内存溢出杀死（Out\
  \ of Memory Killer）会监控使用内存过多的进程，并在系统内存严重短缺时选择它们进行杀死。\n\n![Images](img/wrong.jpg)\
  \ **A**、**B**、**C** 和 **D** 都是错误的，且不存在这些 Linux 工具。（领域 4\\. 故障排除）\n\n### 14\n![Images](img/tick.jpg)\
  \ **A** 和 **B** 是正确的。可以使用 `nmap -sT -p 1-1024 10.0.0.*` 扫描 1 到 1024 之间的开放端口，或者使用\
  \ `lsof -i` 扫描开放的网络端口。\n\n![Images](img/wrong.jpg) **C**、**D** 和 **E** 是错误的。`pwconv`\
