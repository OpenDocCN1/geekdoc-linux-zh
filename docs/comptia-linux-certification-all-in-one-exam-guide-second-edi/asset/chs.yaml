  \ **C.** `pull` 函数从远程仓库下载项目到当前的 `git` 项目目录。\n\n## 第 18 章\n\n## 理解虚拟化与云\n\n在本章中，你将学习：\n\
  \n*   理解虚拟化\n*   理解容器\n*   使用 Docker 和 Kubernetes 管理容器\n*   使用 Kickstart 自动化安装\n\
  \n*在周期内，没有发现显著变化。*\n——Marie M. Daly，阿尔伯特医学院\n\n虚拟机的出现带来了云，这使得公司能够摆弃数据中心。现在，组织可以像外包电力一样外包计算。云计算使计算变成了一种公用事业。组织现在只需购买它们需要的计算资源。\n\
  \n本章深入探讨了虚拟化如何导致容器和云计算的产生。你将学习如何使用 Docker 和 Kubernetes 控制并保护这些容器。让我们首先探索虚拟化。\n\n\
  ## 理解虚拟化\n\n\n\n\n\n虚拟化创建了一个`virtual`计算环境，对于操作系统而言，它看起来像是一个物理环境。虚拟环境运行在被称为`host`（主机）的物理环境之上。虚拟环境被视为`guest`（客户）计算机。虚拟机由`hypervisor`（虚拟机程序）管理。\n\
  \n在本节，你将学习与虚拟机相关的组件，包括以下内容：\n\n- 虚拟机程序\n- 精简置备与厚置备（Thin vs. thick provisioning）\n\
  - 虚拟化文件格式\n- 使用 `virsh` 管理虚拟机\n- 虚拟网络\n- BLOB 存储\n- 虚拟机的局限性\n\n让我们先学习虚拟机程序的作用。\n\
  \n### Hypervisors\n\n虚拟机程序最初由 IBM 创建，旨在为程序员提供一种调试应用程序的方法，而不会危及操作系统的完整性。\n\n虚拟机程序也称为虚拟机管理器（VMM），它们在计算机操作系统与虚拟机（VM）中包含的逻辑隔离的客户操作系统实例之间建立边界。\n\
  \n虚拟机程序有几种类型：嵌入式、Type 1 和 Type 2。由于虚拟机只访问虚拟机程序，因此它并不知道虚拟机程序的类型。\n\n### Type 1\n\n\
  Type 1 虚拟机程序也称为裸金属虚拟机程序，作为操作系统的一部分安装，并具有直接访问系统硬件权限。这在图 18-1 中所示。\n\n![Images](img/F18-01.jpg)\n\
  \n**图 18-1** Type 1（裸金属）虚拟机程序配置\n\n每个“客户”看起来都像一台专用的机器，但实际上它与“主机”和其他客户机器共享系统资源。\n\
  \nType 1 虚拟机程序的示例包括 Linux 内核的虚拟机（KVM）、Microsoft Hyper-V 和 Linux Foundation Xen。\n\
  \n### Type 2\n\nType 2 虚拟机程序或称为托管式虚拟机程序，是安装在主机服务器上的应用程序，如图 18-2 所示。客户机使用安装的虚拟机程序通过系统调用访问系统资源。\n\
  \n![Images](img/F18-02.jpg)\n\n**图 18-2** Type 2（托管式）虚拟机程序配置\n\n### 嵌入式式虚拟机程序\n\n\
  嵌入式虚拟机程序用于嵌入式系统。嵌入式系统是一个独立或集成的设备，包含用于执行特定任务的实时操作系统（RTOS）、控制器和应用程序软件。（某些嵌入式系统没有 RTOS。）报警系统或汽车自动化系统都是嵌入式系统的示例。\n\
  \n嵌入式虚拟机程序直接程序在处理器中。\n\n## Thin vs. Thick Provisioning\n\n厚置备（Thick provisioning）和精简置备（Thin\
  \ provisioning）定义了如何在硬盘上分配存储空间。在为虚拟机创建虚拟磁盘时，你可以选择分配整个驱动器（厚置备）或根据使用情况动态分配驱动空间（精简置备）。\n\
  \n当分配的存储量接近使用的空间时，厚置备效率最高。\n\n精简置备动态限制磁盘的大小，但仅在需要时分配磁盘空间。假设你将驱动器大小限制为 100MB 且仅使用了\
  \ 20MB 存储。驱动器大小仅为 20MB，但具有增长到 100MB 的能力。精简置备降低了存储空间的成本，但需要更多的监控。\n\n## Virtualization\
  \ File Formats\n\n表 18-1 列出了存储虚拟机文件的格式。\n\n![Images](img/f0592-01.jpg)\n\n**表 18-1**\
  \ 虚拟机文件格式\n\n## Managing Virtual Machines with `virsh`\n\nRed Hat 设计 `libvirt` 作为一个针对多个虚拟机程序（KVM,\
  \ LXC, Microsoft Hyper-V, VirtualBox, VMware 和 Xen）的管理工具。`libvirt` 包含命令行工具 `virsh`\
  \ 和守护进程 `libvirtd`，它们用于管理客户机。通过运行 `yum install libvirt` 安装该库和工具。\n\n这些管理能力包括停止、启动、暂停、保存和迁移虚拟机以及管理系统设备的能力。`libvirt`\
  \ 还管理网络接口、虚拟网络和存储设备。\n\n## Virtual Networking\n\n当虚拟机最初创建时，它通常运行在仅主机模式下，这意味着它没有连接到网络（也可以创建带有网络的虚拟机）。本节描述了用于将虚拟机连接到网络的各种配置。\n\
  \n### NAT\n\n典型的网络由多个具有唯一 IP 地址的主机组成。与其让这些 IP 地址公开，，你可以使用网络地址转换（NAT）或 IP 伪装（IP masquerading）创建一个具有全球访问权限的私有网络。NAT\
  \ 和 IP 伪装都为一个网络提供一个公共地址。当私有网络上的主机想要与外界通信时，数据包中的源地址会被改为公共 IP 地址。当数据包返回时，过程反之。\n\n\
  NAT 允许同时有一个连接到公共 IP 地址；IP 伪装允许同时有多个连接到公共 IP 地址。\n\n### Bridge\n\n桥接用于连接网络的多个网段。网段用于将网络分成子网，以提高安全性能。\n\
  \n桥接与路由器的区别在于，桥接不分析、过滤或转发消息。某些路由器也包含桥接功能。\n\n### Overlay Network\n\n覆盖网络（Overlay\
  \ network）是使用逻辑链路位于网络上的计算机网络。\n\n想象一个容器 pod，其中容器是同一个虚拟网络上的主机，而桥接将虚拟网络连接到物理网络。该虚拟网络就是覆盖网络。\n\
  \n### Dual-Homed Network\n\n双网机包含连接到同一个网络的多个网络网卡（NIC）。双网卡用于提供冗余，从而提供容错能力。\n\n双网机网络上最简单的冗余形式是两个网卡（主和备用）配置为彼此的备用设备。在任何时候，只有一个网卡连接到网络。如果一个网卡故障，流量将重定向到第二个网卡。\n\
  \n### Bonding Interfaces\n\n网卡冗余通过绑定两个网卡来创建。例如，假设有两个网卡 `enp0s1` 和 `enp0s2`，并且可用绑定模块。\n\
  \n要设置绑定接口，在 `/etc/sysconfig/network-scripts` 中创建一个名为 `ifcfg-<bond#>` 的文件，其中 # 是绑定接口的数字编号。在本例中，我们将使用\
  \ `bond0`：\n\n![Images](img/f0593-01.jpg)\n\n编辑配置文件 `/etc/sysconfig/network-scripts/ifcfg-enp0s1`\
  \ 和 `/etc/sysconfig/network-scripts/ifcfg-enp0s2`，通过添加或修改以下条目将其附加到 `bond0`：\n\n\
  ![Images](img/f0593-02.jpg)\n\n如果你使用 Network Manager，执行命令 `nmcli con reload`。通过执行命令\
  \ `systemctl restart network` 重启网络。你可以执行命令 `cat /proc/net/bonding/bond#` 来验证绑定已创建。\n\
  \n多网机连接到不同网络的多个网卡。\n\n### Virtual Switch\n\n虚拟机上的网络端口与虚拟适配器关联，而虚拟适配器又与虚拟交换机关联。软件虚拟交换机隔离并管理网络上虚拟机之间的通信。\n\
  \n## BLOB Storage\n\nBLOB（二进制大对象）是通过 HTTP 传输的二进制数据集合。BLOB 分组在分配给用户账户的容器。\n\n有几种\
  \ BLOB 类型：块（block）、追加（append）和页（page）。每个 BLOB 类型用于特定类型的数据存储，由称为 ETag 的唯一标记标识。\n\n\
  ### Block BLOBs\n\n块 BLOB 设计用于数据流和存储。每个块都有唯一的 ID，并可存储高达 100MB。一个块 BLOB 可以包含 50,000\
  \ 个块。\n\n\n\n\n\n区块 BLOB 可以通过添加、替换或删除数据来更新。为了使更改永久生效，必须对它们进行提交（commit）。如果数据在周内未被提交，则会被删除。\n\
  \n### 追加型 BLOB (Append BLOBs)\n追加 BLOB 由至多 50,000 个 4MB 块组成，用于日志。现有块不能被删除或修改。写入追加\
  \ BLOB 的数据始终写入到 BLOB 的末尾。\n\n### 页面 BLOB (Page BLOBs)\n页面 BLOB 由 512 字节的页组成，用于随机读写。页面\
  \ BLOB 的最大大小为 8TB。\n\n### 虚拟机的缺点\n虚拟机的大小可以增长到 GB 和 TB ，因为配置的每个设备都是另一个计算机镜像。此外，每个\
  \ VM 启动可能很慢，随着资源使用的增加，每个系统的性能可能会开始下降。为了缓解这些和其他问题，创建了一种名为 `containers` 的新技术，将在下一节中讨论。\n\
  \n![Images](img/exam.jpg)\n\n**考试提示** 云 VM 实例是位于云端的单台服务器。`cloud-init` 工具使用配置文件 `/etc/cloud/cloud.cfg`\
  \ 配置云实例。\n\n## 理解容器\n软件开发者创建支持多种环境的应用程序。计算机系统或 `node` 可以是台式机、笔记本电脑、平板电脑或智能手表。当软件开发者不需要考虑运行应用程序的特定硬件或操作系统时，开发工作就被简化了。容器通过解决各种类型硬件和操作系统之间不一致性使得这一点成为可能。\n\
  \n`container` 是一个运行时环境，由单个实例中的文件、库、依赖项和配置组成（参见图 18-3）。容器不需要虚拟机（hypervisor）；相反，它们共享操作系统和节点的资源。容器平台的示例包括\
  \ LXC、LXD、LXCFS、LinuxKit、Docker 和 Podman。\n\n![Images](img/F18-03.jpg)\n\n**图 18-3**\
  \ 容器\n\n![Images](img/exam.jpg)\n\n**考试提示** CompTIA Linux+ 考试关注两个容器平台：Docker 和 Podman。\n\
  \n容器是在应用程序层级隔离的，而不是在操作系统层级。这意味着应用程序层面的错误不会影响主机。与 VM 相比，容器小得多（仅几 MB 大小），效率更高，启动和关闭速度快得多，并且可以处理更多的应用程序。\n\
  \n在继续之前，你应该理解大多数容器类型遵循的以下覆盖性定义：\n\n*   多个进程（如 `sshd` 或 `httpd`）组成一个 `container`；但理想情况下，它们只包含一个进程（例如仅\
  \ `sshd`），以便于更新和排排除故障。\n*   容器可能需要外部辅助服务，这些服务被称为 `ambassador containers`（大使容器）。\n\
  *   多个容器组成一个 `pod`。pod 内的容器共享网络和其他资源。同样，pod 理想情况下应包含一个容器。\n\n例如，一个容器运行 `httpd` 进程，另一个容器运行\
  \ `sshd` 进程。理想情况下，每个容器都应从独立的 pod 启动，但它们也可以共享同一个 pod。\n\n*   Pod 可能需要辅助容器，这些容器被称为\
  \ `sidecars`（侧车容器），因为它们与 pod 的进程并肩运行。\n*   多个 pod 组成一个 `deployment`（部署）。部署启动、监控并重启已掉的\
  \ pod。\n*   多个节点（例如连接在一起的几台服务器和/或台式机）组成一个 `cluster`（集群）。来自各个节点的 CPU 和内存被汇总在一起，并在集群内启动\
  \ pod 部署。\n\n集群控制多个 pod，这些 pod 由 Docker 或 Podman 等容器平台管理；Kubernetes 是一个管理集群的容器平台，利用\
  \ Docker 在全球多个区域复制集群，将在本章稍后介绍。虽然 CPU 和内存会在集群内部共享，但文件存储是缓存的，因此当程序重启时，数据不再存在。为了解决这个问题，必须创建持久卷（persistent\
  \ volumes）。\n\n在本节中，你将学习容器组件，包括以下内容：\n\n*   持久化卷\n*   容器标记语言\n\n让我们将数据从客操作系统保存到主机开始。\n\
  \n#### 持久化卷\n在容器环境中，持久卷是主机上的一个位置，在容器删除后该位置可能仍然存在。\n\n### 容器标记语言\nKubernetes 的配置文件使用\
  \ JSON (Docker) 或 YAML。\n\n![Images](img/exam.jpg)\n\n**注意** Kubernetes 可能使用 JSON\
  \ 或 YAML。\n\n### JSON\nJSON（或 JavaScript 对象表示法）是一种人类可读的、基于文本的语言，用于在服务器之间交换数据。JSON\
  \ 文件存储为 `.json`。\n\n### YAML\nYAML（全称为 Another Markup Language）是一种人类可读的数据序列化语言，是\
  \ JSON 的超集。YAML 文件使用 `.yaml` 或 `.yml`。\n\n### 使用 Docker 和 Kubernetes 管理容器\n如前所述，让应用程序在各种环境中一致地运行是通过使用容器来解决的。容器镜像包含了应用程序运行所需的库和依赖项。\n\
  \n要与容器交互，使用 `podman` 或 `docker` 命令。两者的子命令是相同的。预计在 CompTIA Linux+ 考试中看到这两个命令。表 18-2\
  \ 显示了它们的其中几个子命令。\n\n![Images](img/f0597-01.jpg)\n\n**表 18-2** `podman` 和 `docker`\
  \ 命令的子命令\n\n`docker` 和 `podman` 命令套允许你下载其他用户创建的镜像，简化你创建容器的过程。\n\n### 开始使用 Docker\n\
  容器镜像仓库包含几乎所有用途的预构建容器。这些容器仓库可以通过 `https://docs.docker.com/docker-hub`、`https://catalog.redhat.com/software/containers/explore`\
  \ 以及许多其他访问。\n\n要搜索 `docker.io` 仓库中的可用容器镜像，请使用 `podman` 或 `docker` 的 `search` 子命令：\n\
  \n![Images](img/f0598-01.jpg)\n\n要搜索特定的容器镜像（例如 `mysql`），请使用 `podman` 或 `docker`\
  \ 运行以下 `search`：\n\n![Images](img/f0598-02.jpg)\n\n\n\n\n\n运行 `podman search --no-trunc\
  \ docker.io/mysql` 会列出 `pod` 容器镜像更详细的描述。\n\n![Images](img/note.jpg)\n\n**注意** 如果你想跟踪并继续学习此示例，请在\
  \ [`hub.docker.com`](https://hub.docker.com) 创建账户。\n\n### 部署现有容器镜像\n\n要从远程注册库之一拉取现有容器镜像，请进行身份验证，然后按照以下方式拉取镜像：\n\
  \n![Images](img/f0599-01.jpg)\n\n要检查新镜像，运行 `podman inspect` 或 `docker inspect`。这将列出有关容器的元数据，包括架构和操作系统。\n\
  \n要查看新安装的容器镜像，运行 `podman images` 或 `docker images` 命令。注意 Alpine、Debian 和 Ubuntu\
  \ 等操作系统比普通安装要小得多。这就是容器的力量！\n\n![Images](img/f0599-02.jpg)\n\n最后，为新镜像创建别名，请使用 `docker`\
  \ 或 `podman` 的 `tag` 子命令来帮助更方便地跟踪镜像。要创建新的别名，请将别名名称与容器的 `IMAGE ID` 匹配，如下：\n\n![Images](img/f0599-03.jpg)\n\
  \n### 运行容器镜像\n\n当你找到一个可以让你更好地管理 Debian 或帮助你编写新程序的容器镜像后，是时候使用 `podman` 或 `docker\
  \ run` 子命令连接它了，如下所示：\n\n![Images](img/f0599-04.jpg)\n\n此示例中的 `-d` 选项在后台运行容器。\n\n\
  运行 `docker port` 或 `podman port` 会暴露镜像使用的端口。要访问容器镜像的`interactive terminal`，请使用 `-i`\
  \ 和 `-t` 选项，如下所示：\n\n![Images](img/f0600-01.jpg)\n\n一旦你运行 `exit` 退出容器镜像，它就会停止。要重新启动，请使用\
  \ `docker start` 或 `podman start` 命令配合 `-a` 和 `-i` 选项进行交互式附加，如下所示：\n\n![Images](img/f0600-02.jpg)\n\
  \n在独立的终端中，你可以使用 `docker` 和 `podman` 的 `ps` 子命令查看运行中的容器。`-a` 选项列出所有容器，包括已退出的容器，如下所示：\n\
  \n![Images](img/f0600-03.jpg)\n\n### 配置容器持久化存储\n\n要创建持久化存储，你需要将主机上的目录映射到容器。执行此操作，你使用\
  \ `--privileged` 选项，如下所示：\n\n![Images](img/f0600-04.jpg)\n\n在前面的示例中，`/media` 是持久化存储保存的主机目录。`/mnt`\
  \ 目录是容器的卷。通过执行示例，你可以看到使用 `cat` 命令在容器文件 `persist.txt` 中保存的数据将保留在主机上。\n\n### 移除容器\n\
  \n要删除容器，首先使用 `stop` 子命令停止它，然后使用 `rm` 子命令删除它。最后，你需要使用 `rmi` 子命令删除容器镜像，如下：\n\n![Images](img/f0601-01.jpg)\n\
  \n## 使用 Kubernetes 管理集群\n\nKubernetes 可以管理单节点，但在多容器用例中效果最好，例如提供成千上万不同商品的购物网站。此外，Kubernetes\
  \ 可以通过启用管理服务间流量的 `service mesh`（服务网格）来简化集群的网络通信。`kubectl` 命令允许你运行命令来管理 Kubernetes\
  \ 集群。\n\n使用 `kubectl` 部署应用程序、组合实例解决方案并管理集群。表 18-3 列出并描述了一些你在日常使用中需要理解的重要 `kubectl`\
  \ 子命令——这些**不**属于 CompTIA Linux+ 目标范围。\n\n![Images](img/f0601-02.jpg)\n\n**表 18-3**\
  \ `kubectl` 命令的子命令\n\n最后，让我们来看看如何使用 Kickstart 自动安装 Red Hat 节点。\n\n### 使用 Kickstart\
  \ 自动化安装\n\n自动化安装 Red Hat 是由一个名为 Anaconda 的功能提供的，Anaconda 是适用于 Red Hat 类发行版的系统安装程序。本节详细介绍了你可以在环境中实现自动化的一种方法。对于\
  \ Red Hat 管理员来说，Anaconda 和 Kickstart 是非常好的知识，但这些**不**包含在 CompTIA Linux+ 考试中。\n\n\
  Anaconda 是一个用 Python 编写的用于 Red Hat 及其他 Linux 发行版的安装程序。Anaconda 识别计算机系统的架构，并根据在多个安装菜单中的选择配置操作系统（设备、文件系统、软件等）。\n\
  \n作为安装过程的一部分，Anaconda 将配置选择存储在文件 `/root/anaconda-ks-cfg` 中。该文件应该被复制到文件 `/root/ks.cfg`。`ks.cfg`\
  \ 文件可以直接用于执行自动安装，也可以通过文本模式 (`vi`) 或图形界面 Kickstart 配置器 `system-config-kickstart`\
  \ 进行修改。\n\n![Images](img/note.jpg)\n\n**注意** 使用命令 `yum -y install system-config-kickstart`\
  \ 安装 Kickstart 配置器。\n\nKickstart 配置文件由多个部分组成，必须按照特定顺序呈现。部分中的大多数选项可以按任何顺序指定。\n\n\
  命令 `ksvalidator <config_file>` 将验证 Kickstart 文件的语法，而 `ksverdiff <config_file_1>\
  \ <config_file_2>` 命令将显示两个配置文件之间的差异。\n\n![Images](img/note.jpg)\n\n**注意** 使用命令 `yum\
  \ -y install pykickstart` 将安装 `ksvalidator` 和 `ksverdiff`。\n\n一旦创建并验证了 Kickstart\
  \ 文件，它就可以通过连接到安装过程的驱动器、DVD 或网络（包括 PXE）来提供。指令 `inst.ks=<ks_file_location>` 将指定引导过程的\
  \ Kickstart 位置。网络启动可能需要指定网络地址 (`ip` 选项）或存储库的位置 (`inst.repo=``)\n\n### 章节复习\n\n本章描述了与虚拟机、虚拟机程序、存储、网络、容器和集群相关的许多配置术语。以下是本章中对\
  \ CompTIA Linux+ 考试重要的关键要点：\n\n- 虚拟机程序是由 IBM 创建的调试工具。\n- 虚拟机程序称为虚拟机管理器。\n- 虚拟机程序隔离主机（资源提供者）和客机。\n\
  - 类型 1（或裸机）虚拟机程序可以直接访问系统硬件。\n- 类型 2 虚拟机程序是安装在主机上的应用程序。\n- 厚配置（Thick provisioning）在创建磁盘时分配所有空间。\n\
  - 精简配置（Thin provisioning）动态分配磁盘空间。\n- OVF 是用于创建虚拟机的文件。它由包含创建虚拟机所需的所有元数据的目录组成。\n\
  - VDI 是 VirtualBox 的默认存储。\n- VMDK 由 VMware 设计，被 VirtualBox 和 QEMU 使用。\n- `virsh`\
  \ 使用 `libvirt` 守护进程从命令行访问虚拟机。\n- NAT（网络地址转换）使用单个 IP 地址表示私有计算机网络。\n- 桥接（Bridging）是将两个网络合并为一个网络以扩展网络。\n\
  - 叠加（Overlay）是让一个网络位于另一个网络之上。\n- 双网网络使用多个接口连接到一个网络。\n- 绑定（Bonding）是创建双网网络的方法。\n\
  - `cloud-init` 是容器的引导工具。\n- 容器虚拟化应用程序而非机器。\n- 持久化卷用于存储容器数据。一旦删除容器，存储在持久化卷上的数据仍然可用。\n\
  - JSON 和 YAML 是可能用于数据序列化的标记语言。\n- 使用 `docker` 或 `podman` 命令管理容器镜像。\n- 使用 `kubectl`\
  \ 命令管理集群。\n\n### 问题\n\n**1.** 哪个命令会列出你的容器镜像？\n\n**A.** `docker show`\n\n**B.** `docker\
  \ list`\n\n**C.** `docker images`\n\n**D.** `docker display`\n\n\n\n\n\n### 2. 哪种存储配置方法动态分配磁盘空间？\n\
  \n**A.** 精简配置 (Thin)\n**B.** 持久化 (Persistent)\n**C.** BLOB\n**D.** 厚规格配置 (Thick)\n\
  \n## 3. 哪种虚拟化文件格式是包含多个配置文件的单一目录？\n\n**A.** HDD\n**B.** OVA\n**C.** OVF\n**D.** VMDK\n\
  \n### 4. 哪种虚拟化文件格式是包含 OVF 文件归集的单一目录？\n\n**A.** HDD\n**B.** OVA\n**C.** OVF\n**D.**\
  \ VMDK\n\n### 5. 哪种命令行工具是由 Red Hat 开发的 KVM 虚拟机程序的管理工具？\n\n**A.** `libvirt`\n**B.**\
  \ `vboxmanage`\n**C.** `virsh`\n**D.** `vmware-cmd`\n\n### 6. 容器是以下内容的示例：\n\n**A.**\
  \ 第一类虚拟化\n**B.** 第二类虚拟化\n**C.** 嵌入式虚拟化\n**D.** 以上均非\n\n### 7. 持久化卷（Persistent volumes）与以下哪项相关？\n\
  \n**A.** Pods\n**B.** 容器\n**C.** 厚规格配置 (Thick provisioning)\n**D.** 精简配置 (Thin provisioning)\n\
  \n## 8. 下列属性适用于追加型 BLOB (append BLOB)？（选择三个。）\n\n**A.** 新数据必须追加。\n**B.** 现有数据无法修改。\n\
  **C.** 现有数据可以修改。\n**D.** 现有数据无法删除。\n\n## 9. 哪种 BLOB 类型用于随机读写？\n\n**A.** 追加 (Append)\n\
  **B.** 页面 (Page)\n**C.** 块 (Block)\n**D.** Bob Loblaw’s Law Blog\n\n## 10. 数据序列化将数据转换为便于将数据恢复到原始结构的格式。哪些工具提供数据序列化？（选择两个。）\n\
  \n**A.** `vi`\n**B.** YAML\n**C.** JSON\n**D.** `nano`\n\n## 11. `cloud-init` 是一个引导引导程序，其配置文件是：\n\
  \n**A.** `/etc/cloud.cfg`\n**B.** `/etc/cloud/cloud.config`\n**C.** `/etc/cloud.config`\n\
  **D.** `/etc/cloud/cloud.cfg`\n\n## 12. 绑定（Bonding）与哪种网络类型相关？\n\n**A.** NAT\n**B.**\
  \ 桥接 (Bridge)\n**C.** 双宿主 (Dual-homed)\n**D.** 覆盖网络 (Overlay)\n\n## 13. 覆盖网络（Overlay\
  \ network）与以下哪个相关：\n\n**A.** Pods\n**B.** 双宿主网络\n**C.** NAT\n**D.** Bridge\n\n###\
  \ Answers\n\n**[1] C.** `docker images`（或 `podman images`）命令将显示位于主机上的镜像。\n\n**[2]\
  \ A.** 精简配置根据需要分配磁盘空间。厚规格配置分配所有磁盘空间。持久化卷用于 pod 以确保在 pod 关闭后数据仍然存在。BLOB 存储是通过 HTTP\
  \ 或 HTTPS 访问的块数据存储。\n\n**[3] C.** OVF 文件包含一个单一目录，由用于配置虚拟机的配置文件组成。\n\n**[4] B.**\
  \ OVA 文件是 OVF 文件的归集。\n\n**[5] C.** `virsh` 是用于管理 KVM 的命令行工具。`virsh` 是 `libvirt`\
  \ 的一部分。`libvert` 是用于管理虚拟机的工具集。\n\n**[6] A.** 容器是第一类（或裸机）虚拟化的示例。\n\n**[7] A.** 持久化卷与\
  \ pod 相关。Pod 是 Kubernetes 内部容器或容器组名称。\n\n**[8] A, B, D.** 追加型 BLOB 用于日志数据。追加型 BLOB\
  \ 中的现有数据无法修改或删除，任何新条目都会追加到 BLOB 的末尾。\n\n**[9] B.** 页面 BLOB 用于随机读写操作。\n\n**[10] B,\
  \ C.** YAML 和 JSON 是促进数据序列化的标记语言。\n\n**[11] D.** `/etc/cloud/cloud.cfg` 是 `cloud-init`\
  \ 的配置文件。\n\n**[12] C.** 双宿主网络用于在单个网络上提供网卡冗余。这通过绑定多个 NIC 实现。\n\n**[13] A.** 覆盖网络与\
  \ pod 相关。\n\n---\n\n## 第 19 章：故障排除与诊断\n\n在本章中，你将学习：\n- 一种标准化模型\n- 故障排除计算机问题\n- 故障排除网络问题\n\
  \n*人类始终参与其中。*\n\n在涉及安全时，公司面临的最大挑战之一是内部威胁。在本章中，我们将讲述 SGMF 的故事。\n\n### 标准化故障排除模型\n\
  \nMugabe 具有合并与收购（M&A）的经验，并作为首席工程师理解了这些问题。他极大的耐心、对常见漏洞和披露（CVE）的理解以及实战经验使成为一名出色的故障排除专家。Mugabe\
  \ 计划了一个七步法：\n\n**第 1 步：识别问题。** Mugabe 通过提问、检测症状和查看错误消息来确定发生了什么。\n\n**第 2 步：确定近期更改。**\
  \ Mugabe 识别出单一更改，无论是新软件、硬件还是配置。\n\n**第 3 步：建立因果理论。** 使用从前面的步骤收集的信息，Mugabe 开发了一个可以解释问题的理论。\n\
  \n**第 4 步：选择修复方案。** Mugabe 通常与其他 SGMF 工程师（包括 Jessica 和 Carlos）一起工作，得出解决方案，并讨论修复是否会引起其他问题。\n\
  \n**第 5 步：尝试并验证修复。** 在此时，Jessica 和 Carlos 合作实施修复，确保问题得到解决且不再出现。在向客户公布修复方案之前，Mugabe\
  \ 验证了其团队所做的修复。\n\n**第 6 步：确保客户满意。** Mugabe、Jessica 或 Carlos 验证客户是否满意。最后向他们的主管汇报情况，让他们知道问题已解决。\n\
  \n**第 7 步：完成文档工作。** Mugabe 和他的团队在工单数据库中记录解决方案，以便在问题再次发生时快速识别。\n\n**考试小贴士：** 了解七步法故障排除对于\
  \ CompTIA A+ 考试非常有帮助，但不是 CompTIA Linux+ 考试的要求。\n\n### 故障排除计算机问题\n\nMugabe 开始收集 FRMS\
  \ 员工使用的计算机系统清单。幸运的是，与 SGMF 一样，FRMS 是仅限 Linux 的环境，因为多年前他们了解到 Linux 是一种高质量、支持良好的操作系统，漏洞比闭源操作系统更少。\n\
  \nFRMS 的 Tomika、Davy、Gary 和其他工程师正试图阻止合并，为 Mugabe 及其团队提供一份不准确的清单。根据过去的经验，Mugabe 已经学会了“信任，但验证”。因此，Mugabe\
  \ 将使用以下方法验证和确认计算机问题：\n\n- 验证硬件配置\n- 验证 CPU 性能\n- 验证内存性能\n- 验证存储性能\n- 验证其他设备\n\n\n\
  \n\n\n**注意** 本场景中描述的事件、人物和公司均为虚构。与任何实际人物（无论在世）或实际公司的任何相似之处纯属巧合。\n\n## 验证硬件配置\n\n\
  Mugabe 的工具箱里有几个工具可以在不打开系统的情况下验证计算机配置。这些工具是 `lshw` 和 `dmidecode` 命令。\n\n`lshw` 命令会“列出”（list）安装在\
  \ Linux 系统上的硬件，报告精确的内存配置、固件版本、主板配置、CPU 详情、CPU 缓存详情、总线速度等。对即将到来的合并感到的 Gary 提供的报告显示，每台电脑都配置了\
  \ 2GB RAM 且没有 CD-ROM 驱动器。\n\nMugabe 使用 `-short` 选项运行 `lshw` 命令，如下：\n\n![Images](img/f0609-01.jpg)\n\
  \n报告显示，每个系统实际上安装了 1GB RAM 和一个 CD-ROM 驱动器。稍，Mugabe 将完成物理检查以验证他的发现。\n\nMugabe 可以使用的另一个命令是\
  \ `dmidecode`，它可以在多用户模式下列出计算机的 BIOS。下面的输出使用了 `--quiet` 选项，并显示主板支持 ISA、PCI 和 CD-ROM\
  \ 启动：\n\n![Images](img/f0609-02.jpg)\n\n为了支持他的合并理由，Mugabe 收集了信息，识别了变化，并最终将其发现记录在工单系统中。\n\
  \n## 验证 CPU 性能\n\nFRMS 的 Davy 是那种不会忘记任何事情的人，特别是当这影响到他的工作时，因此他在没有任何文件的情况下向 Mugabe\
  \ 保证 CPU 负载平均值大于 50%！负载平均值定义了 CPU 的忙程度；准备使用 CPU 的作业越多（也就是说，*可运行*的任务越多），负载平均值越高。\n\
  \n要观察 CPU 型号、核心数和选项，Mugabe 可以运行 `lscpu` 或查看 `/proc/cpuinfo`文件的内容来确定其性能是否不足，如下：\n\
  \n![Images](img/f0610-01.jpg)\n\nCPU 看起来完全能够任他们的应用程序，因此为了检查 CPU 负载平均值，Mugabe 使用了\
  \ `uptime`、`w` 和 `sar` 命令：\n\n![Images](img/f0610-02.jpg)\n\n`uptime` 命令显示系统运行了多久，并输出系统负载平均值。在本例中，负载平均值显示过去一分钟为\
  \ 1%，过去 5 分钟为 4%，过去 15 分钟为 5%——远未 Davy 所述的 50% 负载平均值。\n\n`w` 命令显示登录的用户以及他们运行的命令。Mugabe\
  \ 使用此输出来确定哪些程序正在加载系统以及来自哪些账户。\n\n最后，`sar` 是“系统活动报告器”。这是一个通用工具，用于列出 CPU、RAM、I/O、磁盘、通信端口、图形等的性能信息。运行\
  \ `sar 2 5` 将收集系统活动数据并显示五行输出，每两秒输出一行。默认情况下，`sar` 命令列出 CPU 性能详情，包括用户时间、系统时间、iowait、窃取时间（steal）和空闲（idle）状态。\n\
  \n为了支持合并案件，Mugabe 注意到系统负载小于 10%，远低于 FRMS 代表员所称的 50%。\n\n![Images](img/note.jpg)\n\
  \n**注意** `time` 命令是一个非常有用的工具。只需运行 `time <program_name>` 即可确定单个程序消耗多少 CPU 时间。\n\n\
  ## 验证内存性能\n\nJessica 根据 FRMS 的报告指出他们所有的系统都需要升级内存。为了检查内存和交换性能，Jessica 运行 `lsmem`\
  \ 并检查 `/proc/meminfo` 文件以观察使用了多少内存以及可用内存，然后她运行 `vmstat 2 5` 来检查内存性能，如下：\n\n![Images](img/f0611-01.jpg)\n\
  \n![Images](img/f0612-01.jpg)\n\n第一条记录显示了自启动以来空闲内存和文件缓存的平均值。后续记录列出了 Jessica 定义的两采样期间的活动。她从输出中注意到他们的应用程序没有内存耗尽的情况。\n\
  \n与 `sar` 命令一样，`vmstat 2 5` 每两秒报告五次虚拟内存统计。`vmstat` 命令显示交换空间中使用的内存量、空闲量、用作缓冲区以及作为缓存保存的量。命令还显示了在与磁盘之间交换的数据量。\n\
  \n### 内存溢出杀死 (Out of Memory Killer)\n\nOOM Killer，或称 *Out Of Memory Killer*，是当系统由于运行应用程序过多或内存泄漏导致内存极度低时，由\
  \ Linux 内核触发的进程杀死器。如果有足够的进程开始使用内存，将没有足够的内存支持所有进程。因此，内核调用 OOM Killer 审查进程并杀死其中一个或多个进程以释放内存并保持系统运行。\n\
  \nOOM Killer 审查所有进程并根据内存利用率和子进程数量分配严重评分。得分最高的进程会被杀死。为了安全起见，root、内核和重要的系统进程的分数要低得多。如果杀死一个进程没有释放足够的内存，服务器将很快崩溃。\n\
  \n要找到 OOM Killer 是否是进程被杀害的原因，你需要运行以下命令：\n\n![Images](img/f0612-02.jpg)\n\n在这种情况下，`mysql`\
  \ 被杀除了，进程标识号（PID）为 `4121`。\n\nOOM Killer 只有在系统内存极度低时才会被调用。因此，为了避免它，你可以减少内存需求、增加内存或增加交换空间。\n\
  \n### 增加交换空间\n\nMugabe 在技术和管理方面的多年经验帮助他理解有停止 OOM Killer 的快速方法，他决定通过增加交换空间来缓解这一威胁。可以使用额外的新交换硬盘、额外的交换分区或使用\
  \ `swapon` 命令添加交换文件来增加交换空间，如图 19-1 所示。\n\n![Images](img/F19-01.jpg)\n\n**图 19-1**\
  \ 额外的交换空间设备\n\n要查看当前交换空间状态，请查看 `/proc/swaps`文件的内容、使用 `-s` 选项运行 `swapon` 命令，甚至尝试\
  \ `free` 命令查看内存和交换情况，如下：\n\n![Images](img/f0613-02.jpg)\n\n创建新的交换设备后，可以使用 `swapon`\
  \ 启用。FRMS 的 Tomika 打算通过建议 SGMF 等一个月的新硬盘作为额外的交换空间来阻止合并。SGMF 的 Mugabe 决定最简单的方法是添加交换文件。\n\
  \n添加新的交换磁盘需要购买并安装新硬盘。添加交换分区甚至更困难，因为必须从现有硬盘备份数据并重新分区以增加交换分区，然后必须恢复数据。添加交换文件仅需使用 `dd`\
  \ 命令创建一个空文件（假设文件系统中有可用空间），如下：\n\n![Images](img/f0613-03.jpg)\n\n添加交换文件后，可以使用 `swapon`\
  \ 命令将其启用，如下：\n\n![Images](img/f0613-04.jpg)\n\nMugabe 收到警告称权限不安全。这通过 `chmod` 和 `chown`\
  \ 进行修复，如下：\n\n![Images](img/f0613-05.jpg)\n\n接下来，他确认使用 `swapon` 的 `-s` 选项添加交换文件。优先级（Priority）设置为\
  \ `-3`，这意味着在任何优先级为 `-2` 或 `-1` 的设置填充完成后将使用它。一旦完成交换文件的使用，可以使用 `swapoff` 禁用并用 `rm`\
  \ 移除，如下：\n\n![Images](img/f0614-01.jpg)\n\n**练习 19-1：使用交换空间**\n\n在此练习中，你将练习使用交换空间命令来管理和排错内存使用问题。请使用随书提供的虚拟机。\n\
  \n![Images](img/video.jpg)\n\n\n\n\n\n**视频** 请观看练习 19-1 视频，演示如何执行此项任务。\n\n完成以下步骤：\n\
  \n1. 启动你的 Linux 系统并以 `student1` 用户身份登录。\n2. 打开终端会话。\n3. 输入 `su -` 并输入密码 `student1`\
  \ 切换到 root 用户账户。\n4. 运行 `swapon -s` 查看当前剩余可用空间。\n5. 运行以下命令使用 `dd` 命令创建交换文件（swap\
  \ file）：\n![Images](img/f0614-02.jpg)\n6. 运行 `swapon swapfile` 启用你的新交换空间。\n7. 运行\
  \ `swapon -s` 验证空间已添加。\n8. 运行 `swapoff swapfile` 禁用交换空间。\n9. 运行 `rm swapfile` 将计算机恢复到之前的状态。\n\
  \n### 验证存储性能\n\nFRMS 的 Gary 通知 Mugabe，磁盘驱动器性能不佳，他们需要预算购买更好、更快的硬盘。Mugabe 苦思冥想，意识到调整一些简单的内核参数可以帮助提高性能\
  \ `and` 节省时间和金钱，从而加速合并。\n\n他查看了 `/sys/block/<disk device>/queue/` 目录下的 `scheduler`\
  \ 内核变量结果，该变量可以设置为 `none`、`mq-deadline`、`kyber` 或 `bfq`：\n![Images](img/f0615-02.jpg)\n\
  \nMugabe 知晓硬盘 I/O 性能取决于应用程序，并可以根据设置进行改进，如表 19-1 所示。\n![Images](img/f0615-01.jpg)\n\
  \n表 19-1 磁盘 `scheduler` 设置\n\n带宽公平队列（bfq）通常适用于桌面等单用户系统。`none` `scheduler` 非常适用于\
  \ SAN 或 RAID 系统，因为它们提供自己的调度。`kyber` `scheduler` 会自动调整以获得最低延迟。最后，`mq-deadline` `scheduler`\
  \ 适用于多用户环境。\n![Images](img/note.jpg)\n\n**注意** 来自 `scheduler` 特性并不是 CompTIA Linux+\
  \ 考试的要求。\n\nMugabe 首先使用 `iostat` 分析 I/O 性能，如下所示。为了进行分析，他运行了企业应用程序并使用 `-z` 选项仅观察正在使用的驱动器。此外，测量将持续四秒，且只需要两个输出。\n\
  ![Images](img/f0615-03.jpg)\n\n`iostat` 输出显示了 `/dev/sda` 驱动器在八秒期间的每秒读写活动和总 I/O。\n\
  \n为了再次测试并查看 `mq-deadline` 的性能结果，他通过更新内核值更改了 `scheduler` 设置，如下：\n![Images](img/f0615-04.jpg)\n\
  ![Images](img/f0616-01.jpg)\n\n最后，他将 `scheduler` 更改为 `bfq` 然后测量性能：\n![Images](img/f0616-02.jpg)\n\
  \nMugabe 工具箱中的另一个工具是 `ioping` 命令，它可以实时测量磁盘 I/O 延迟。以下是一些示例。首先他测量了磁盘 I/O 延迟。\n![Images](img/f0616-03.jpg)\n\
  \n他使用 `-c` 选项限制输出，以免使用 `^C` 来完成会话：\n![Images](img/f0616-04.jpg)\n\n最后，他使用 `ioping`\
  \ 测量当前（或其他）目录的磁盘延迟，如下：\n![Images](img/f0616-05.jpg)\n\n最终，Mugabe 发现，只需调整磁盘驱动器的调度参数就为公司节省了数百万美元的硬盘升级和人工费用，使合并更容易进行。为了使更改永久生效，他使用\
  \ `tuned` 的功能在启动时启用新的调度值，如下所示。\n![Images](img/note.jpg)\n\n**注意**  `tuned` 特性并不是\
  \ CompTIA Linux+ 考试的要求。\n![Images](img/f0617-01.jpg)\n\n由于“活动配置”显示为 `virtual-guest`，Mugabe\
  \ 修改了位于 `/usr/lib/tuned/virtual-guest/` 的 `tuned.conf` 文件。（其他 `tuned` 配置定义在 `/usr/lib/tuned/`\
  \ 目录下。）为了在启动时将 `bfq` 作为 I/O 调度器，他使用：\n![Images](img/f0617-02.jpg)\n其中 `elevator`\
  \ 用于指定所需的 I/O `scheduler`。\n\n### 验证其他设备\n\nMugabe 的工具箱还有几个故障排除工具和技巧，以及运行它们的几种方法。通常他会在伪终端中运行命令，就像从显示管理器登录时看到的一样（参见图\
  \ 19-2\n\n图 19-2 使用伪终端\n\n要查看伪终端值，他运行 `tty` 命令，如图 19-2 所示。在这种情况下，Mugabe 从 `/dev/pts/1`\
  \  使用 `echo HELLO THERE > /dev/pts/0` 命令从一个伪终端向另一个发送 `HELLO THERE`。这允许他在故障排除期间向不同位置发送错误消息。\n\
  \n还有六个备用虚拟控制台。可以通过键组合 `Ctrl-Alt-F{2,3,4,5,6,7}` 访问，其中 `Ctrl-Alt-F1` 将使用户带回 Red Hat\
  \ 类系统上的图形桌面。在 Debian 类系统中，键组合为 `Ctrl-Alt-F{1,2,3,4,5,6}`，且 `Ctrl-Alt-F7` 将使用户带回图形桌面。图\
  \ 19-3\n![Images](img/F19-03.jpg)\n\n图 19-3 使用虚拟控制台\n![Images](img/note.jpg)\n\n\
  **注意** 许多系统不允许登录。这定义在 `/etc/securetty` 中，其中包含了允许 root 的终端。使用 `#` 注释行以禁用登录。\n\n###\
  \ 故障排除文件相关问题\n\nFRMS 的内部人员 Robert 通知 Mugabe，由于错误消息显示“无法创建文件”，他们空间不足了。当 Mugabe 运行\
  \ `df` 时，他清楚地看到有大量的磁盘空间。在 `ext4` 类型文件系统上运行 `df -i` 显示显示了真实问题，即系统耗尽了节点（inodes）：\n\
  ![Images](img/f0618-03.jpg)\n\n要增加节点计数，需要通过备份数据来重新创建文件系统，然后使用 `mkfs.ext4 -N 1000000\
  \ /dev/sda1` 将节点计数翻倍。一旦恢复数据，用户将能够创建新文件。同时，Mugabe 将与管理层合作确定是否可以从 `ext4` 切换到 XFS 文件系统，后者在需要时会自动构建节点。\n\
  ![Images](img/note.jpg)\n\n**注意** 管理员必须对备份带进行外部标记，以便知道他们正在恢复正确版本的文件。\n\n### 故障排除目录相关问题\n\
  \nFRMS 的一个内部威胁 Coughin 导致任何人都可以删除共享 `sales` 文件夹中的他人的文件。他运行了 `chmod -t sales` 删除了粘位（sticky\
  \ bit），导致了麻烦。\n\nMugabe 必须修复此问题并重新启用粘位。他只需在该目录上使用 `chmod +t sales` 命令。现在，只有文件所有者才能删除自己的文件；也就是说，如果你不拥有文件，你就无法删除它。\n\
  \n### 更改键盘布局\n\n几个对合并感到沮丧的员工（也称为“内部威胁”）决定更改键盘布局使其工作良好，但不完美。Mugabe 使用 `localectl`\
  \ 修复此问题。他注意到键映射设置为 `us-mac` 而不是 `us`。他按如下方式修复：\n![Images](img/f0619-01.jpg)\n\n\
  ### 故障排除打印机\n\nFRMS 的员工从未在 Linux 上设置过打印机，因为它们总是无法工作。Mugabe 了一些了一些，发现打印服务 CUPS 未启用。他修复了该问题并使用\
  \ `netstat` 和 `lsof` 验证了 CUPS 端口 631 正在监听，如下：\n![Images](img/f0619-02.jpg)\n![Images](img/f0620-01.jpg)\n\
  \n最后，Mugabe 通过运行 `systemctl enable cups` 确保了未来重启后具有打印能力，如下所示：\n\n\n\n\n\n![Images](img/f0620-02.jpg)\n\
  \n## 验证显卡\n\n某些系统的 NVIDIA 显卡无法正常工作。Mugabe 使用 `lspci` 和 `lshw` 来研究这个问题，如下：\n\n![Images](img/f0620-03.jpg)\n\
  \n由于在任何输出中都没有显示 NVIDIA，Mugabe 清楚问题所在：没有为 NVIDIA 显卡安装驱动程序。从 NVIDIA 下载并安装 GPU 驱动程序后，显卡即可正常工作。\n\
  \n## 排除网络故障\n\n安装网络接口只是成功了一半。为了实现通信，网络管理员使用各种测试和监控工具来确保网络正常运行。\n\n随着 Mugabe 继续进行其系统和网络分析，他将使用以下方法验证和确认网络问题：\n\
  \n- 验证网络性能\n- 验证用户连接\n- 验证防火墙\n\n### 验证网络性能\n\n同样，Mugabe 的工具箱里有很多软件工具用于配置、监控和排除网络故障。要查看网络状态，他使用\
  \ `ip` 命令。例如，通过运行命令 `ip addr show`，他可以看到当前的网络设备及其状态，所示：\n\n![Images](img/f0621-01.jpg)\n\
  \n`ip` 命令还可以配置网络、路由和隧道，并具有配置 IPv6 网络的内置功能。\n\nMugabe 还可以使用 `ifconfig` 命令配置网络。与 `ip`\
  \ 命令一样，`ifconfig` 命令可以分配 IP 地址、子网掩码地址、广播地址等。此外，`ifconfig` 提供接口错误信息，例如丢包、冲突和链路状态，所示：\n\
  \n![Images](img/f0621-02.jpg)\n\nMugabe 可以运行 `ip -s` 来获取接口信息。\n\n为了确定网卡应使用哪种驱动程序，Mugabe\
  \ 使用带有 `-v` 选项的 `lspci` 命令。这提供了关于网卡的更多详细信息，包括型号和 IRQ 设置，所示：\n\n![Images](img/f0622-01.jpg)\n\
  \n`lspci` 命令还可以用于发现高性能网络卡（例如支持 RDMA 的网卡）。基于以太网的 RDMA（远程直接内存访问）允许直接从一台计算机的内存访问到另一台计算机的内存，而无需使用任何系统的操作系统，从而实现低延迟和高吞吐量。如果任何网卡支持\
  \ RDMA，`lspci` 将显示 `InfiniBand` 术语。由于前面的结果中没有出现该词，FRMS 不支持 RDMA。\n\n![Images](img/note.jpg)\n\
  \n**注意** 性能也可以通过使用 UNIX sockets 来提高。UNIX sockets 用于进程间通信，允许同一系统上的进程进行交换，而 IP sockets\
  \ 则允许跨网络进行进程通信。\n\n### 排除局域网性能故障\n\n用户向 Carlos 抱怨访问网络上的计算机时存在长时间延迟和高延迟问题。他们的系统用蔬菜命名，以提醒员工个人健康至关重要。当用户\
  \ `ssh` 或 `ping` 名为 `tomato`、`cucumber`、`zucchini` 等等命名的系统时，至少需要五分钟才能得到响应。\n\nCarlos\
  \ 首先怀疑超时和高延迟问题是由网络饱和引起的。他运行 `iftop` 来监控流量带宽。`iftop` 命令类似于 `top` 之处在于它测量活动并每两秒自动更新一次。结果如图\
  \ 19-4 所示，表明网络活动正常。\n\n![Images](img/F19-04.jpg)\n\n**图 19-4** `iftop` 命令的输出\n\n\
  ![Images](img/exam.jpg)\n\n**考试提示** 对于类似于 `top` 和 `iftop` 的命令更新，尝试使用 `watch` 命令。例如，尝试运行\
  \ `watch uptime` 来每两秒可视化地显示新的运行时间和负载输出。\n\nCarlos 的工具箱中另一个强大的网络吞吐量测量工具是 `iperf`。`iperf`\
  \ 命令评估特定路径上的带宽限制，因此需要服务器和客户端才能成功运行命令。在下面的示例中，Carlos 评估了客户端和 DNS 服务器之间的带宽、丢失、饱和度和延迟。在\
  \ DNS 服务器上，他通过运行 `iperf -s` 启动 `iperf` 服务器程序，如图 19-5 所示。\n\n![Images](img/F19-05.jpg)\n\
  \n**图 19-5** 启动 `iperf` 服务器\n\n在客户端上，他以客户端模式运行 `iperf` 并让其运行几秒钟以测量网络活动和延迟，如图 19-6\
  \ 所示。同样，Carlos 看到网络性能是可以接受的。\n\n![Images](img/F19-06.jpg)\n\n**图 19-6** 运行 `iperf`\
  \ 客户端\n\n### 排除名称解析问题\n\nCarlos 回想起在担任政府实习期间遇到过一个类似的案例。系统首先检查 DNS 表以解析域名，在五分钟超时后，执行本地域名解析。因此，他修改了\
  \ `/etc/nsswitch.conf` 中的 `hosts` 记录，将其更改为\n\n![Images](img/f0624-02.jpg)\n\n以便在解析主机名时在检查\
  \ `/etc/resolv.conf` 之前检查 `/etc/hosts` 文件。现在用户访问“沙拉食材”（即以蔬菜命名的主机）速度快得多。Carlos 使用\
  \ `host`、`nslookup` 和 `dig` 等工具来验证名称服务器状态。\n\n![Images](img/exam.jpg)\n\n**考试提示**\
  \ `hosts:` 记录是 `/etc/nsswitch.conf` 在 CompTIA Linux+ 考试中测试的唯一条目\n\n### 排除动态 IP 地址问题\n\
  \n用户向 Jessica 抱怨他们无法从 DHCP 服务器获取 IP 地址。她要求用户尝试使用 `dhclient -r` 命令释放地址，并通过运行 `dhclient`\
  \ 刷新地址。用户反馈说仍然无法获取 IP 地址。\n\n她还导出了 `/var/lib/dhclient/dhclient.leases` 文件，发现那里没有定义任何连接。这解释了用户无法从\
  \ DHCP 服务器获取 IP 地址的部分原因。\n\n接下来，Jessica 修改了 `/etc/dhcp/dhclient.conf` 文件并更改了它与 DHCP\
  \ 服务器通信的方式以解决问题。\n\n![Images](img/exam.jpg)\n\n**考试提示** 了解 `/etc/dhcp/dhclient.conf`\
  \ 对于 CompTIA Linux+ 考试很有帮助。\n\n### 使用 `sysctl` 排除网关故障\n\n如第 15 章 所示，为了让 Linux 系统充路由器或网关，必须启用\
  \ IP 转发。要验证是否已启用 IP 转发，运行 `cat /proc/sys/net/ipv{4,6}/ip_forward`，所示：\n\n![Images](img/f0625-01.jpg)\n\
  \n或者可以使用 `sysctl` 命令（不要与管理运行级别的 `systemctl` 命令混淆），如下：\n\n![Images](img/f0625-02.jpg)\n\
  \n`sysctl` 命令用于配置内核参数以优化计算机。根据应用程序，调优可以将性能提高高达 50%。查看所有内核调优参数，使用 `-a` 选项，所示：\n\n\
  ![Images](img/f0625-03.jpg)\n\n一旦系统调优满意，通过修改 `/etc/sysctl.conf` 或 `/etc/sysctl.d/`\
  \ 目录使新值持久化。Jessica 希望让系统成为路由设备，并在启动时保持持久化。为了实现这一点，她执行以下操作：\n\n![Images](img/f0625-04.jpg)\n\
  \n现在系统可以作为其他网络的网关设备。（之前提到的使用 `cat` 命令更新 `/etc/sysctl.conf` 同样有效。）\n\n重启后，系统报告启动时自动启用\
  \ IP 转发，所示：\n\n![Images](img/f0626-01.jpg)\n\n#### 验证用户连接\n\nGary 向 Mugabe 报告多个用户的账户被锁定了。这种情况是从\
  \ FRMS 系统与 SGMF 网络合并后开始的。Mugabe 首先测试用户在不使用 Kerberos 或 LDAP 的情况下是否可以本地登录。\n\n\n\n\
  \n\n他扫描了 `/etc/passwd` 文件，发现用户名都在那里，正如预期的那样，并且第二列中有一个 `x`，这样系统知道去 `/etc/shadow`\
  \ 中查找密码。他还验证了用户是否已列在 `/etc/shadow` 中。接下来，他尝试使用 `su - <username>` 登录各种用户账户，并成功了。由于他能够在本地访问用户账户，说明远程或外部目录服务一定存在问题。\n\
  \n他查看了较新系统上的 `/etc/nsswitch.conf` 文件，注意到 `passwd`、`shadow` 和 `group` 字段只搜索 `files`（`/etc/passwd`、`/etc/shadow`\
  \ 和 `/etc/group`），如下所示：\n\n![Images](img/f0626-02.jpg)\n\n合并成功的部分因素之一是 FRMS 和 SGMF\
  \ 两家公司都使用 LDAP 目录服务进行远程认证。它们还有相同的密码策略，即密码长度至少为八字符，并包含两个大写字母和一个 PAM 中定义的特殊字符（在第 18\
  \ 章中引入）。如果违反了此策略，该账户将无法使用。\n\n![Images](img/note.jpg)\n\n**注意** `/etc/login.defs`\
  \ 中的设置只影响 shadow 工具。`/etc/pam.d/passwd` 中的设置影响特定的命令。例如，`/etc/login.defs` 文件指定了用户密码的最小长度。PAM\
  \ 文件 `/etc/pam.d/passwd` 则覆盖了 `/etc/login.defs` 中定义的密码长度。\n\n为了让用户能够访问 LDAP 服务器进行认证，Mugabe\
  \ 更新了 `/etc/nsswitch.conf` 如下：\n\n![Images](img/f0626-03.jpg)\n\n遵循策略的用户现在能够成功登录。\n\
  \n![Images](img/note.jpg)\n\n**注意** 若要将 Linux 系统加入 Windows 活动目录域，请使用 `/etc/nsswitch.conf`\
  \ 中的 `winbind` 指令。\n\n## 验证防火墙\n\nFRMS 的 Davy 和 Tomika 通知 Carlos，他可能忘记了用户正在遇到的 SSH\
  \ 问题，但 Davy 并没有忘记这个问题，并且需要 Carlos 对此关注，因为他们的策略要求在 24 小时内响应。\n\nCarlos 的记忆没有 Davy\
  \ 那么好，但由于希望合并成功，他开始处理这个问题。他尝试作为 FRMS 用户使用 SSH 并重现了问题。他无法通过 SSH 登录。\n\n![Images](img/exam.jpg)\n\
  \n**考试技巧** 糟糕的防火墙设置会导致大多数网络相关问题，特别是当服务不可用时。\n\n他接着移动到 SSH 服务器，使用 `systemctl` 验证\
  \ SSH 是否正在运行，如下：\n\n![Images](img/f0627-01.jpg)\n\n结果显示 `sshd` 服务已启用。\n\n接下来，他调查了防火墙。他运行\
  \ `firewall-cmd` 来调查端口 22 是否开放，如下：\n\n![Images](img/f0627-02.jpg)\n\n结果显示用于 SSH\
  \ 服务的 TCP 协议 22 端口被拦截。显然，ACL 允许 Samba 和 DHCP 等功能，但不允许 SSH。ACL 过于严格。Carlos 使用 `firewall-cmd`\
  \ 修改规则以解锁 22 端口并解锁该服务的 TCP 协议，如下：\n\n![Images](img/f0628-01.jpg)\n\n运行 `firewall-cmd\
  \ --add-service ssh` 会开启 22/TCP 端口，以便用户现在可以访问 SSH。为了确保端口在后续重启后依然开启，他运行了 `firewall-cmd\
  \ --add-service ssh --permanent` 命令字符串。当他带选项运行 `firewall-cmd --list-services` 命令时，SSH\
  \ 显示为开放端口之一。\n\n最后，他测试了用户是否可以通过 SSH 登录系统，并发现来自 FRMS 和 SGMF 的用户现在可以访问 SSH 服务器。结案——即使是\
  \ Tomika 都感到印象深刻。\n\n在练习 19-2 中练习网络故障排除和性能命令。\n\n### 练习 19-2：排排除网络问题\n\n在此练习中，你将使用网络和防火墙命令来管理和排排除网络连接。此练习假设两个系统已连接，如下：\n\
  \n- `sysA` IP 地址 10.1.1.2/24 (SSH 服务器)\n- `sysB` IP 地址 10.1.1.3/24\n\n![Images](img/video.jpg)\n\
  \n**视频** 请观看练习 19-2 视频以演示如何执行此任务。\n\n完成以下步骤：\n\n**1.** 从 `sysB` 开始，使用 `ping` 命令测试到\
  \ `sysA` 的网络连接：\n\n```\n$ ping 10.1.1.3\n```\n\n**2.** 从 `sysA` 开始，通过输入 `su -` 及其后的密码切换到\
  \ `root` 用户账户。\n\n**3.** 禁用 `sysA` 上的网络活动：\n\n```\nsysA # systemctl stop network\n\
  ```\n\n**4.** 从 `sysB` 开始，使用 `ping` 命令测试到 `sysA` 的网络连接：\n\n```\nsysB $ ping 10.1.1.3\n\
  ```\n\n**5.** 重新启用 `sysA` 上的网络活动：\n\n```\nsysA # systemctl start network\n```\n\n\
  **6.** 验证 `sysA` 上的 SSH 服务器正在运行：\n\n```\nsysA # systemctl status sshd\n```\n*如果它没有运行*，使用\
  \ `systemctl` 启动 SSH 服务器：\n\n```\nsysA # systemctl start sshd\n```\n\n**7.** 尽管\
  \ SSH 服务正在运行，但通过 `firewall-cmd` 在 `sysA` 上阻止访问：\n\n```\nsysA # firewall-cmd --remove-service\n\
  ```\n\n**8.** 从 `sysB` 开始，尝试通过 SSH 登录。这将会失败，因为 SSH 被防火墙拦截了。\n\n```\nsysB $ ssh10.1.1.2\n\
  ```\n\n**9.** 输入 `firewall-cmd` 在 `sysA` 上重新启用服务访问：\n\n```\nsysA # firewall-cmd\
  \ --reload\n```\n\n**10.** 从 `sysB` 开始，尝试通过 SSH 登录。这将成功，因为防火墙端口已开启。\n\n```\nsysB\
  \ $ ssh student@12\n```\n\n### 本章回顾\n\n本章关注了故障排除、诊断以及硬件和网络的性能调优。可以使用多种软件工具测试 CPU、内存使用和磁盘效率。通过查看\
  \ `/proc` 和 `/sys` 伪目录可以了解硬件状态。\n\n对于内存不足，管理员可以增加交换空间以防止 OOM Killer 杀死程序。如果没有可用交换分区，可以快速创建并添加交换文件作为交换空间。\n\
  \n硬盘通过一个名为调度器（scheduler）的设置进行调优。可能的磁盘调度器设置有 `none`、`mq-deadline`、`kyber` 和 `bfq`。每个组织都需要评估哪种设置最适合其环境。一旦组织确定了哪种最适合应用程序，可以使用\
  \ `tuned` 工具将其持久化。\n\n管理员使用 `systemctl` 命令在 Linux 服务器上启用和禁用服务，如 SSH、FTP、Telnet 和共享打印机。\n\
  \n有很多熟悉的工具用于网络排除，但大多数对 IPv6 不友好。然而，相对新的 `ip` 命令取代了常用的网络命令，并且同样可以处理 IPv6 设置和故障排除。\n\
  \n为考试准备回顾以下关键点：\n\n- `/proc/cpuinfo` 文件提供了已安装 CPU 的详细信息。\n- `uptime` 命令显示系统运行时间和负载平均。\n\
  - 运行 `watch uptime` 每秒监控一次 uptime 变化。\n- `w` 命令显示登录系统的用户及其正在的操作。\n- 运行 `sar` 可以管理员查看\
  \ CPU、磁盘、内存等性能信息。`/proc/meminfo` 文件提供了已安装内存的详细信息。\n- 使用 `dd` 命令创建交换文件。\n- 运行 `mkswap`\
  \ 将新文件配置为交换空间。\n- 使用 `swapon` 命令启用新的交换空间。\n- 使用 `swapoff` 禁用交换空间。\n- 要访问第二个虚拟控制，运行\
  \ `Ctrl-Alt-F2`。\n- root 用户允许登录的位置可以在 `/etc/securetty` 文件中找到。\n\n\n\n\n\n- 运行 `df\
  \ -i` 将显示文件系统可用的 inode 数。\n- 使用 `lsof -i` 命令列出正在监听的网络端口。\n- 使用 `lspci -v` 命令验证显卡安装情况。\n\
  - 使用 `ip addr show` 显示网卡设置。\n- 运行 `dhclient -r` 命令从 DHCP 服务器释放地址。\n- 如果连接 DHCP 服务器时遇到困难，请验证\
  \ `/etc/dhcp/dhclient.conf` 中的设置。\n- `iftop` 命令测量网络活动，每两秒更新一次。\n- 使用 `sysctl` 修改内核设置，例如\
  \ `/proc/sys/net/ipv4/ip_forward`。\n- 修改 `/etc/sysctl.conf` 以在启动时启用 `ip_forward`。\n\
  - 可以在 `/etc/nsswitch.conf` 中添加名称服务器设置，例如 LDAP、Active Directory 等。\n\n## Questions\n\
  \n**1.** `lshw` 命令的哪个选项将提供带有显示硬件路径的设备树的硬件安装摘要？\n\n**A.** `-X`\n**B.** `-summary`\n\
  **C.** `-short`\n**D.** `-s`\n\n**2.** 在多用户模式下，哪个命令可以列出系统的 BIOS？\n\n**A.** `dmidecode`\n\
