  **D.** 将脚本的 sha-bang 行改为 `#!/bin/sh`。\n\n### 28\n假设系统在周五备份完成后不久发生故障，以下哪项将实现最快的恢复，且恢复的磁带数量最少？（关键：F=全量,\
