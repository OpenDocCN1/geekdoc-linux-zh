  \n6. 打开第三个终端并执行命令 `su - student1`。\n\n7. 执行 `who`、`whoami`、`id`、`echo $HOME` 和 `echo\
  \ $PATH` 命令。比较三个终端输出的差异。差异在哪里？为什么？\n\n通过输入输入 `exit` 命令来关闭第二个和第三个终端。在第一个终端中，输入 `clear`\
  \ 命令。\n\n8. 执行命令 `useradd student2` 创建用户 `student2`。\n\n9. 使用以下命令查看对这些文件的更改：\n\n\
  ```\ngrep ^student2 /etc/passwd /etc/shadow /etc/group /etc/gshadow\n```\n\n记住 `/etc/default/useradd`\
  \ 和 `/etc/login.defs` 中的设置。\n\n10. 使用 `/etc/default/useradd` 和 `/etc/login.defs`\
  \ 中的设置确定 `/var/spool/mail` 是否已创建。\n\n11. 使用命令 `passwd student2`。\n\n12. 回到第二个终端（按\
  \ `Alt-2`）并尝试以 `student2` 登录。\n\n\n\n\n30. 使用命令 `usermod -G 100 student3` 将组 `100`\
  \ (users) 作为 `student3` 的附加组，然后输入 `groups student3` 命令。注意，组 `student1` 已经不再是附加组了。使用\
  \ `-G` 选项覆盖了所有现有的附加组。执行命令 `usermod -aG student1 student3` 然后执行 `groups student3`\
  \ 命令。`-a` 将该组“追加”到附加组列表中。\n\n31. 使用 `userdel student2` 命令删除用户 `student2`。然后执行\n\n\
  ![Images](img/f0113-01.jpg)\n\n注意 `/etc/passwd` 和 `/etc/shadow` 中的 `student2` 记录已删除，但\
  \ `student2` 的邮件邮件文件仍然存在。\n\n32. 使用 `userdel -r student3` 命令删除用户 `student3`。执行\n\
  \n![Images](img/f0113-02.jpg)\n\n注意 `student3` 在 `/etc/passwd` 和 `/etc/shadow` 中的记录已被删除，同时\
  \ `/var/spool/mail` 中的 `student3` 邮件文件也被删除了。\n\n现在你已经知道了如何管理用户，接下来我们将讨论如何管理组。\n\n\
  ## 使用 `groupadd` 配置新工作组\n\nLinux 使用组为多个用户提供对系统资源的共同访问权限。在本节中，我们将讨论 Linux 组的工作原理以及如何从命令行管理组。\n\
  \n### 从命令行管理组\n\n与用户一样，组也可以通过命令行或图形化工具进行管理。例如，可以使用“用户管理器”（User Manager）在 Linux 系统上创建、修改和删除组以及用户账户。然而，图形化工具未列在\
  \ CompTIA Linux+ 考试目标中，因此我们将重点关注从命令行界面 (CLI) 管理组。我们将回顾以下工具：\n\n* `groupadd`\n* `gpasswd`\n\
  * `groupmod`\n* `groupdel`\n\n让我们从查看 `groupadd` 开始。\n\n### 使用 `groupadd` 配置新工作组\n\
  \n你可能已经从名称猜到，`groupadd` 工具用于向 Linux 系统添加组。在 shell 提示符中使用 `groupadd` 的语法相对简单。只需输入\
  \ `groupadd` <options> `<groupname>` 即可。例如，要添加一个名为 `dbusers` 的组，在 shell 提示符输入 `groupadd\
  \ dbusers`。\n\n使用 `groupadd` 时，你可以使用以下选项：\n\n* `-g` 为新组指定 GID。与用户一样，没有必要指定组 ID，系统会自动分配一个。\n\
  * `-r` 指定正在创建的组是系统组。\n\n#### 使用 `gpasswd` 设置组密码\n\n`gpasswd` 命令用于管理 `/etc/group`\
  \ 和 `/etc/gshadow` 文件。该命令可以由系统管理员或组管理员执行。\n\n要分配组管理员，系统管理员或组管理员应执行 `gpasswd -A <username>`\
  \ 命令。\n\n系统管理员或组管理员可以使用以下任何 `gpasswd` 选项：\n\n* `-a <username>` 将用户添加到组中\n* `-d <username>`\
  \ 从组中删除用户\n* `-r` 移除组密码\n\n#### 使用 `groupmod` 修改工作组设置\n\n`groupmod` 命令用于通过以下选项修改组信息：\n\
  \n* `-g` 修改组的 GID 数字\n* `-n` 修改组名\n\n### 使用 `groupdel` 移除工作组\n\n要从系统中删除现有组，请在 shell\
  \ 提示符使用 `groupdel` 命令。例如，要删除 `dbusers` 组，输入 `groupdel dbusers` 命令。\n\n在删除组之前，确保用户对文件和目录的访问不受影响。\n\
  \n你将在练习 4-2 中练习管理组。\n\n## 练习 4-2：从命令行管理组\n\n在本次练习中，你将在 Linux 系统的 shell 提示符练习创建和修改组。你可以使用随书提供的虚拟机进行此练习。\n\
  \n![Images](img/video.jpg)\n\n**视频** 请观看练习 4-2 视频演示如何执行此任务。\n\n假设你的公司正在组建一个使用 Linux\
  \ 系统的新研发团队。你需要为该团队成员的用户创建一个新组。。为此，请完成以下步骤：\n\n1. 以 `root` 用户身份登录系统。\n2. 执行 `groupadd\
  \ research` 命令创建一个名为 `research` 的新组。\n3. 执行命令 `usermod -aG research student1` 将\
  \ `research` 组作为 `student1` 的附加组。\n4. 执行命令 `grep research /etc/group` 查看 `research`\
  \ 组的成员。\n5. 执行命令 `grep student1 /etc/group` 查看 `student1` 所在的所有附加组。\n6. 执行命令 `groups\
  \ student1` 查看 `student1` 属于的所有组。\n7. 执行 `groupdel research` 命令删除 `research` 组。通过执行\
  \ `grep research /etc/group` 命令验证该组已删除。\n\n## 本章总结\n\n在本章中，我们回顾了用户配置文件、如何使用用户和组管理命令及配置文件，以及如何临时更改用户\
  \ ID 和组 ID。以下是本章的一些要点：\n\n* 要进行系统身份验证，用户必须提供用户名和密码。\n* 用户家目录默认创建在 `/home` 下。\n*\
  \ `root` 用户的家目录是 `/root`。\n* 每个 Linux 用户账户都应分配一个唯一的用户 ID (`UID`) 数字。\n* `root` 用户的\
  \ `UID` 为 `0`。\n* 标准用户的起始 `UID` 为 `1000`。\n* 使用 `su` 命令临时切换用户 ID、主组 ID 和家目录。\n*\
  \ 要临时登录另一个用户并使用其配置文件，请执行 `su - <username>` 命令。\n* 使用 `id` 命令查看用户的有效用户 ID。\n* 使用本地身份验证，用户账户存储在\
  \ `/etc/passwd` 和 `/etc/shadow` 中。\n* `/etc/passwd` 文件存储用户账户信息。\n* `/etc/shadow`\
  \ 文件存储加密密码和老化信息。\n* 使用 `useradd` 工具在 Linux 系统上配置用户。\n* 当不带任何选项使用时，`useradd` 使用在\
  \ `/etc/login.defs` 和 `/etc/default/useradd` 中定义的系统默认值创建用户账户。\n* 使用 `passwd` 工具设置用户密码。\n\
  * 使用 `usermod` 工具修改现有用户账户。\n* 使用 `userdel` 工具移除现有用户。\n* 默认情况下，`userdel` 不删除用户的家目录、`cron`\
  \ 和 `at` 任务，除非指定了 `-r` 选项。\n* 组账户存储在 `/etc/group` 中。\n* 使用 `groupadd` 工具配置新组。\n\
  * 使用 `usermod` 工具向组添加或移除用户。\n* 使用 `groupdel` 工具移除现有组。\n\n### 问题\n\n1. 哪些文件包含默认 shell\
  \ 为 `/bin/bash` 的用户的全局用户设置？（选择两个。）\nA. `/etc/passwd`\nB. `/etc/profile`\nC. `~/.bash_profile`\n\
  D. `/etc/group`\nE. `/etc/bashrc`\nF. `~/.bashrc`\n\n2. 用户有一个主组，并可能是多个附加组的成员。你会在哪个文件中查找用户的附加组？\n\
  A. `/etc/passwd`\nB. `/etc/profile`\nC. `~/.bash_profile`\nD. `/etc/group`\n\n3.\
  \ `/etc/passwd` 记录中的哪些条目将阻止用户登录系统？（选择两个。）\nA. `/bin/bash`\nB. `/bin/false`\nC. `/sbin/nologin`\n\
  D. `/bin/nologin`\n\n\n\n\n\n### 4. `/etc/shadow` 记录中 `Password` 字段的哪一个项目表示该用户未设置密码？\n\
  \nA. `!!`\n\nB. `NP`\n\nC. `LK`\n\nD. `!`\n\n### 5. 一个用户无法登录。其在 `/etc/shadow` 中的\
  \ `Password` 字段包含 `!!<encrypted_password>`。哪种操作可以解决这个问题？（选择两个。）\n\nA. 用户应该更改其密码。\n\
  \nB. 管理员应该执行命令 `passwd -u <user_name>`。\n\nC. 管理员应该执行命令 `chage -u <user_name>`。\n\
  \nD. 管理员应该执行命令 `usermod -U <user_name>`。\n\n### 6. 哪一个文件包含了添加用户时使用的默认密码有效期值？\n\n\
  A. `/etc/default/useradd`\n\nB. `/etc/login.defs`\n\nC. `/etc/skel`\n\nD. `/etc/profile`\
  \ \n\n### 7. 你正在添加一个用户。`/etc/login.defs` 中变量 `USERGROUPS_ENAB` 的值为 `yes`。你不想创建一个新组，但希望用户的主组与\
  \ `/etc/default/useradd` 中 `GROUP` 变量存储的值（`100`）相同。以下哪些命令可以实现这一目标？（选择两个。）\n\nA.\
  \ 创建用户后执行 `usermod -g <username>`\n\nB. `useradd -n <username>`\n\nC. `useradd -G\
  \ 100 <username>`\n\nD. `useradd -g 100 <username>`\n\n### 8. 一个用户无法登录。你想查看该用户的密码有效期信息。你会执行哪条命令？（选择两个。）\n\
  \nA. `chage -S <username>`\n\nB. `passwd -S <username>`\n\nC. `chage -l <username>`\n\
  \nD. `passwd -l <username>`\n\n### 9. 你希望所有新用户的默认编辑器为 `nano`。你会编辑哪一个文件？\n\nA. `/etc/default/useradd`\n\
  \nB. `/etc/login.defs`\n\nC. `/etc/profile`\n\nD. `/etc/skel/.bash_profile`\n\n\
  ### 10. 某用户的密码在五天前已过期。`INACTIVE` 的值为 `14`。该用户可以做什么？\n\nA. 什么也做，账户已禁用。\n\nB. 正常登录。\n\
  \nC. 登录，但准备好更改密码。\n\nD. 联系系统管理员重置账户。\n\n### 11. 某用户的密码在五天前已过期。`INACTIVE` 的值为 `0`。该用户可以做什么？\n\
  \nA. 什么也做，账户已禁用。\n\nB. 正常登录。\n\nC. 登录，但准备好更改密码。\n\nD. 联系系统管理员重置账户。\n\n### 12. 用户\
  \ ID 为 `3` 的用户其在 `/etc/shadow` 中的 `Password` 字段中有一个星号 `*`。这表示什么？\n\nA. 账户已禁用。\n\n\
  B. 这是一个系统账户，不需要密码。\n\nC. 这是一个系统应用程序账户，不需要密码。\n\nD. 这是一个只能由 `root` 调用且不需要密码的系统账户。\n\
  \n### 13. 你正在将用户 `student1` 的登录名更改为 `student3`。哪条命令是*最*合适的？\n\nA. `usermod -g <username>`\n\
  \nB. `usermod -l <username>`\n\nC. `usermod -d /home/student3 -m`\n\nD. `usermod\
  \ -m <username>`\n\n### 14. 哪条命令将删除 `/etc/passwd` 和 `/etc/shadow` 中的用户记录？\n\nA.\
  \ `userdel <username>`\n\nB. `userdel <username>`\n\nC. `rm -r <username>`\n\nD.\
  \ `del -u <username>`\n\n### 15. 你已经从 `/etc/passwd` 和 `/etc/shadow` 中删除了 `student3`，但没有删除与\
  \ `student3` 相关的 `cron`、`at`、`mail`。哪条命令可以修复这个问题？\n\nA. `userdel student3`\n\nB.\
  \ `userdel student3`\n\nC. `rm -r student3`\n\nD. `del -u student3`\n\n### 16. 一个用户无法登录。哪条命令会显示谁登录了？\n\
  \nA. `id`\n\nB. `who`\n\nC. `w`\n\nD. `whoami`\n\n---\n\n### 答案\n\n**4. A.** `/etc/shadow`\
  \ 中的 `!!` 表示密码从未设置过。\n\n**5. B, D.** 管理员需要使用 `passwd -u <user_name>` 或 `usermod\
  \ -U <user_name>` 来解锁账户。\n\n**6. B.** `/etc/login.defs` 包含了密码有效期值。\n\n**7. B, D.**\
  \ `useradd -n <username>` 或 `useradd -g 100 <username>` 将正确设置主组。\n\n**8. A, C.**\
  \ `chage -S <username>` 和 `chage -l <username>` 显示密码有效期信息。\n\n**9. D.** 编辑 `/etc/skel/.bash_profile`\
  \ 设置了所有新用户的编辑器。\n\n**10. C.** 如果 `INACTIVE` 为 14，用户可以登录但必须更改密码。\n\n**11. C.** 如果\
  \ `INACTIVE` 为 0，用户可以登录但必须立即更改密码。\n\n**12. B.** `Password` 字段中的星号表示不需要密码的系统账户。\n\
  \n**13. B.** `usermod -l <username>` 是更改登录名的正确命令。\n\n**14. A.** `userdel <username>`\
  \ 将删除 `/etc/passwd` 和 `/etc/shadow` 中的记录。\n\n**15. C.** 如果 `userdel` 没有处理，则必须手动删除用户的剩余文件。\n\
  \n**16. B, C.** `who` 和 `w` 显示谁登录了系统。\n\n\n\n\n在本章中，你将了解 Linux 文件系统，包括 Linux 文件系统的分层结构和\
  \ Linux 文件类型。然后，你将处理文件和目录。让我们从讨论文件系统的作用开始。\n\n### 理解文件系统层级标准\n\nLinux 将数据存储在物理硬盘上，在很多情况下，硬盘被划分为分区。在分区上存储数据需要一种方法来管理数据的存储和检索。文件系统控制硬盘上数据的管理方式。图\
  \ 5-1 显示了一个带有三个分区的硬盘。每个分区都有一个存储数据的文件系统。磁盘或分区上存储什么数据以及使用什么文件系统来管理数据，是由系统设计过程决定的。\n\
  \n![Images](img/F05-01.jpg)\n\n**图 5-1** 文件系统与分区\n\n目录的逻辑位置与数据的物理存储位置没有关系。层次结构基于某种分类组织对象的方法。文件系统层级标准（FHS）定义了\
  \ Linux（以及 UNIX）发行版中目录和文件的建议逻辑位置。这些定义包含了特定目录和文件中应该包含的内容。图 5-2 显示了这种结构的示例。目前，Linux\
  \ 基金会管理 FHS ([`refspecs.linuxfoundation.org/fhs.shtml`](https://refspecs.linuxfoundation.org/fhs.shtml))。\n\
  \n![Images](img/F05-02.jpg)\n\n**图 5-2** 目录结构\n\n让我们回顾一下这些目录的作用：\n\n- `/`: 根目录或顶级目录（读作\
  \ *slash*，是所有其他文件和目录的父目录）\n- `/bin`: 用户命令，可以链接到 `/usr/bin`\n- `/boot`: 启动系统所需的文件\n\
  - `/dev`: 硬件设备的特殊设备驱动文件\n- `/etc`: 全局配置文件文件\n- `/lib`: 系统库文件，也称为共享对象\n- `/mnt`:\
  \ 临时挂载文件系统的挂载点\n- `/media`: 可移动介质（如 DVD 和 USB 驱动器）的挂载点\n- `/opt`: 用于安装第三方应用程序的目录\n\
  - `/sbin`: 包含 root 用户用于启动或修复内核的系统二进制文件；链接到 `/usr/sbin`\n- `/tmp`: 临时文件目录；被称为*伪文件系统*，因为它驻留在内存中以及可选的交换空间中\n\
  - `/usr`: 一系列可共享的只读的 UNIX 系统资源\n- `/var`: 包含大小变化的文件（例如日志文件、电子邮件文件和打印文件）\n- `/home`:\
  \ 用户账户的家目录\n- `/root`: 用户 `root` 的家目录（不要与 `/` 目录混淆）\n- `/run`: 另一个伪文件系统（驻留在内存中），包含从启动开始后收集的系统信息；在启动开始时清除\n\
  - `/srv`: 包含运行在服务器上的服务数据（例如 HTTP 和 FTP）\n- `/sys`: 提供设备、驱动和某些内核信息\n- `/proc`: 另一个包含进程和硬件信息的伪文件系统\n\
  \n坦率地说，文件可以放置在 Linux 系统的任何位置。可执行文件可以放在 `/etc` 中，日志文件可以放在 `/usr/lib` 中，等等，但作为 Linux\
  \ 管理员，你*不*希望这样做。这会导致在你晋升或更换工作时，其他 Linux 管理员管理系统变得变得非常困难。遵循 FHS 是重要的。\n\n在考试备习学习的现阶段，你必须学习一些\
  \ Linux 基础知识，包括：\n\n- 导航 Linux 文件系统\n- 使用 `ls` 查看目录内容\n\n让我们先学习如何在 Linux 文件系统中进行操作穿梭。\n\
  \n#### 导航 Linux 文件系统\n\n当你从 shell 提示符操作 Linux 文件系统时，最常见的任务之一就是在存储设备上的各种目录之间进行穿梭。你的\
  \ Linux 系统提供了以下 shell 命令来实现此：\n\n- 使用 `pwd` 打印当前工作目录\n- 使用 `cd` 切换目录\n\n##### 使用\
  \ `pwd` 打印当前工作目录\n\n`pwd`（print working directory）命令在终端上显示当前目录的绝对路径。文件的*绝对路径*是从根目录（`//`）开始的路径。图\
  \ 5-3 显示了 `file2` 的绝对路径为 `/dir1/file2`。绝对路径始终以 `/` 开始。\n\n![Images](img/F05-03.jpg)\n\
  \n**图 5-3** 绝对路径\n\n要显示当前目录的绝对路径，请执行命令 `pwd`。这是一个示例：\n\n![Images](img/f0123-01.jpg)\n\
  \n##### 使用 `cd` 切换目录\n\n`cd`（change directory）命令用于从当前工作目录切换到另一个目录。指定目录时，使用绝对路径或*相对*路径。相对路径指定从当前目录到目录的路径，且永远不以开头的\
  \ `/` 开始。在图 5-4 中，当前工作目录是 `dira`。到 `fileb` 的相对路径是 `dirb/fileb`。\n\n![Images](img/F05-04.jpg)\n\
  \n**图 5-4** 相对路径\n\n`fileb` 的绝对路径是 `/dira/dirb/fileb`。要切换到包含 `fileb` 的目录 (`dirb`)，你可以使用相对方法执行命令\
  \ `cd dirb` 或绝对方法 `cd /dira/dirb`。\n\n![Images](img/note.jpg)\n\n**注意** 记住 `~` 代表用户的家目录。例如，`cd\
  \ ~` 将用户 Paul 带到他的家目录 `/home/paul`。因为 `~` 始终以开头的 `/` 开始，所以也被视为绝对路径名。\n\n不带参数执行命令\
  \ `cd` 将当前工作目录切换到你的家目录。执行命令 `cd ~` 也会将你移动到家目录。\n\n执行命令 `cd ~<username>` 只要有权限进入家目录，就会将当前工作目录切换到参数\
  \ `<username>` 指定的用户家目录。命令 `cd ~student1` 将当前工作目录切换到用户 `student1` 的家目录 `/home/student1`。\n\
  \n最后，执行命令 `cd ..`（cd dot dot”）将你的当前工作目录切换到父目录，因为 `..` 意味着父目录`.` 或“点”意味着当前目录，所以 `cd\
  \ .` 会让你留在当前所在的目录中。这并不好用，但“点”的使用将在第十章中讨论。\n\n### 使用 `ls` 查看目录内容\n\n`ls` 命令（小写字母\
  \ *l* 和 *s*）显示当前目录中存储的文件列表。这是一个示例：\n\n![Images](img/f0125-01.jpg)\n\n如果你提供目录的绝对路径，`ls`\
  \ 将显示该目录的内容，如下：\n\n![Images](img/f0125-02.jpg)\n\n在使用 `ls` 时，你可以使用各种选项来定制它的工作方式。以下是这些选项：\n\
  \n- `-a`: 显示所有文件，*包括隐藏文件*。隐藏文件名以点或“点”为开头。许多配置文件都是隐藏文件。Linux 开发者的想法是，如果非权限用户无法轻易看到这些文件，他们就不会更改它们。\n\
  \n在下面的示例中，在 `/home/student1 目录下执行了 `ls -a` 命令：\n\n![Images](img/f0125-03.jpg)\n\n\
  如果你提供了隐藏文件的文件名（例如 `ls -l .exrc`），则不需要 `-a` 选项。\n\n\n\n\n- `-l` 显示目录内容的详细列表。第一行显示目录所占总空间（以块为单位）。其他行显示文件属性，包括权限、链接数、文件所有者、组所有者、字节大小的文件、修改日期和文件名。示例所示：\n\
  \n![Images](img/f0125-04.jpg)\n\n![Images](img/f0126-01.jpg)\n\n- `-R` 递归显示目录内容；即：显示当前目录的内容以及所有子目录的内容。根据目录中条目的数量，你可能希望在使用此选项后附加\
  \ `|` `more`，例如运行 `ls -R /etc | more`。这会导致 `more` 工具暂停并一次显示一页输出。按 `Spacebar` 键查看下一页，按\
  \ `q` 退出。\n\n- `-i` 显示文件名所属的 inode。这在稍后的“软链接和硬链接”章节中会有进一步演示。\n\n![Images](img/exam.jpg)\n\
  \n**考试提示** 掌握 `ls` 选项 `-l`、`-i`、`-R` 和 `-a` 对于通过 CompTIA Linux+ 考试关重要。确保你了解 `-l`\
  \ 选项列出了权限、链接数、用户和组所有者、文件大小、修改时间和文件名。\n\n让我们在练习 5-1 中练习导航文件系统。\n\n## 练习 5-1：导航文件系统\n\
  \n在本次练习中，练习使用 shell 命令导航 Linux 文件系统。\n\n![Images](img/video.jpg)\n\n**视频** 请观看练习\
  \ 5-1 视频，了解如何执行此任务的演示。\n\n对于本次练习，请以用户 `root`（密码为 `password`）登录书书中提供的虚拟机，并按照以下步骤操作：\n\
  \n1. 打开一个终端会话。\n\n2. 假设你刚刚登录，你的当前工作目录应该是什么？使用 `pwd` 命令验证你的当前工作目录。如果你不在当前工作目录，执行\
  \ `cd` 命令返回主目录。使用 `pwd` 命令测试结果。\n\n3. 使用以下命令之一将你的当前工作目录更改为用户 `student1` 的主目录：\n\n\
  \   - `cd ~student1`\n   - `cd /home/student1`\n\n4. 执行命令 `ls`，然后执行命令 `ls -a`。输出有什么区别？为什么？\n\
  \n5. 再次执行步骤 4 中的命令，但这次使用命令 `-l` 显示文件的属性。\n\n6. 使用绝对路径通过命令 `cd /etc/pam.d` 将你的当前工作目录更改为\
  \ `/etc` 中的 `pam.d` 子目录。验证你位于正确的目录。\n\n7. 通过执行命令 `cd ..` 返回上级目录，并验证你在 `/etc/` 目录。\n\
  \n8. 返回主目录并再次验证你位于正确的目录。\n\n### 练习 5-1 答案\n\n步骤 4 执行命令 `cd` 将你带回主目录，该目录包含许多配置文件和目录，如果你执行\
  \ `ls` 命令，将无法看到它们；但如果你执行 `ls -a` 命令，它们就会变得可见。\n\n## 管理 Linux 文件\n\nLinux 中的一切都通过文件引用。即使目录也是文件。我们现在通过讨论以下内容来研究\
  \ Linux 文件的类型以及如何管理它们：\n\n- 文件、文件名和 inode\n- 使用 `touch` 和 `stat` 创建和验证文件\n- 软链接和硬链接\n\
  - 使用 `mkdir` 创建新目录\n- 确定文件类型\n- 查看文件内容\n删除 删除文件\n- 复制和移动文件\n\n### 文件、文件名和 inode\n\
  \nLinux 文件由文件名、inode 和数据块组成。当创建一个文件时，用户或应用程序会赋予它一个名称，文件系统会为其分配一个唯一的 inode 号（索引号）。操作系统使用\
  \ inode 号 own 文件名来访问文件及其信息。\n\n文件名和 inode 号存储在目录文件中。如果可以显示目录文件的内容（例如通过运行 `cat /home/aria/files`），它将如图\
  \ 5-5\n\n**图 5-5** 目录文件的示例内容\n\nLinux 文件名最多包含 255 个字符，不能包含正斜杠或空字符。文件名可以包含元字符（例如\
  \ `file1*`），但不建议这样做。此外，`file1`、`File1` 和 `FILE1` 是三个不同的文件，因为 Linux 是区分大小大小的。\n\n\
  Linux 操作系统忽略扩展名，但允许应用程序识别它们。例如，`mfc70.txt` 表示这是 gedit 工具的文本文件。默认情况下，免费开源办公套件 LibreOffice\
  \ 使用开放文档格式（Open Document Format）存储文件，并使用开放文档文件名为来区分其文件。例如，后缀 `.odt` 表示文字处理器文件，`.ods`\
  \ 表示电子表格，`.odp` 表示演示文稿。\n\n你可以为文件名添加多个后缀以便于搜索文件。文件名 `fstab.12232024.abc` 可能表示这是由缩写为\
  \ abc 的用户于 2024 年 12 月 23 日创建的文件 `/etc/fstab` 的副本。\n\n如果你打算在多个操作系统之间共享文件，请确保你的文件名符合所有操作系统的规则。例如，如果你在\
  \ Linux 系统的同一目录下创建了文件 `version1.txt` 和 `Version1.txt`，Linux 将它们视为不同的文件。但如果将这两个文件与\
  \ Windows 系统共享，其中一个文件将被覆盖，因为 Windows 不区分大小写。\n\n### 使用 `touch` 和 `stat` 创建和验证文件\n\
  \n通过执行 `touch` 命令可以创建新文件。假设文件 `filea` 不存在，命令 `touch filea` 将创建一个名为 `filea` 的空文件（0\
  \ 字节）：\n\n![Images](img/f0128-02.jpg)\n\n三个文件时间戳——访问、修改和更改是文件元数据的一部分。默认情况下，每次读取内容时都会更新访问时间戳。每次更改内容时都会更新修改时间戳。当文件的元数据（例如所有权或权限）更改时，更改时间戳会被更新。`touch`\
  \ 命令可修改时间戳。\n\n要查看文件的时间戳和 inode 号，使用 `stat` 命令，所示：\n\n![Images](img/f0129-01.jpg)\n\
  \n`stat` 命令还列出了文件的创建时间、权限、链接数、设备、用户 ID、组 ID、文件大小和 SELinux 设置。SELinux 在第 16 章中讨论。\n\
  \n**考试提示** 在基于 `ext` 的文件系统（如 `ext3` 和 `ext4`）上，所有 inode 都在文件系统构建时已创建，因此即使有大量的磁盘空间，也可能耗尽\
  \ inode！XFS 文件系统支持动态 inode 分配，根据需要构建 inode，因此不会受到 inode 耗尽问题的影响。\n\n### 软链接和硬链接\n\
  \n链接引用存储在 inode 或另一个文件中数据的方法。这允许我们更改一个文件中的数据，并将该更改反映在其他文件名。\n\n在讨论链接之前，让我们看看文件在大多数文件系统上的存储方式。\n\
  \n![Images](img/F05-06.jpg)\n\n**图 5-6** inode 的结构\n\ninode 包含关于文件的所有信息，例如权限、链接数、用户和组所有者、文件大小、时间戳和数据指针，但不包含文件名。\n\
  \n\n\n\n当创建一个文件时，系统会从文件系统可用的 inode 节点列表中分配一个 inode 号。当用户输入文件名时，操作系统会从目录文件中找到与该文件名关联的\
  \ inode 号。然后，从该文件的 inode 中访问数据。\n\n在我们的讨论中，`source` 一词表示原始文件，而 `destination` 一词表示正在创建的文件。\n\
  \n### 使用 `ln` 创建和操作硬链接\n\n硬链接将文件名与文件的 inode 关联起来。要创建额外的硬链接，请使用 `ln` 命令（小写字母 `l`\
  \ 和 `n`）。硬链接仅在同一个文件系统内部才有效。假设 `zbest.txt` 在 `/home/aria/files` 目录内链接到 inode 号 `61583`。在运行命令\
  \ `ln zbest.txt zlink.txt` 后，inode 号 `61583` 现在有两个链接：`zbest.txt` 和 `zlink.txt`，如图\
  \ 5-7 所示。\n\n![Images](img/F05-07.jpg)\n\n**图 5-7**  具有两个链接的 inode\n\n在图 5-8 中，运行\
  \ `ls -il z*` 显示了 inode 号 `61583` 以及文件 `zbest.txt` 和 `zlink.txt` 的其他属性。注意圈出的数字；它表示引用该文件\
  \ inode 号的文件名数量。它从 `1` 变为 `2`，是因为 inode `61583` 有两个文件名：`zbest.txt` 和 `zlink.txt`。\n\
  \n![Images](img/F05-08.jpg)\n\n**图 5-8**  创建硬链接\n\n在最后一条命令中，使用 `\\rm zbest.txt`\
  \ 命令删除了文件 `zbest.txt`。文件 `zlink.txt` 仍然可以访问其数据，因为它的文件名仍与 inode `61583` 关联。删除 `zbest.txt`\
  \ 没有回收磁盘空间，因为该 inode 仍然有一个链接（文件名 `zlink.txt`）。一旦 `zlink.txt` 被删除，操作系统将回收 43 字节的数据。\n\
  \n![Images](img/exam.jpg)\n\n**考试贴士**  你也可以使用 `unlink zbest.txt` 命令来移除 `zbest.txt`。\n\
  \n### 创建和操作软链接\n\n符号链接也称为软链接，它可以引用同一文件系统中的文件、另一个文件系统、目录，甚至跨网络引用！与硬链接不同，每个符号链接文件都有自己的\
  \ inode。“软链接”内部的数据包含了它所链接的 `filename`，这类似于 macOS 或 Windows 计算机中的快捷方式（参见图 5-9）。\n\
  \n![Images](img/F05-09.jpg)\n\n**图 5-9**  软链接的内容\n\n要创建软链接，请如下所示运行带 `-s` 选项的 `ln`\
  \ 命令：\n\n```bash\nln -s <source_file> <destination_file>\n```\n\n注意图 5-10 中 `ls\
  \ -il` 命令的输出。文件 `zbest.txt` 和 `zlink.txt` 是硬链接，因为它们链接到同一个 inode，且链接数为 `2`。\n\n![Images](img/F05-10.jpg)\n\
  \n**图 5-10**  软链接文件\n\n接下来，通过以下命令创建一个名为 `symlink.txt` 的软链接：\n\n```bash\nln -s zbest.txt\
  \ symlink.txt\n```\n\n注意显示的 `symlink.txt` 的文件类型和属性为 `lrwxrwxrwx`。小写的 `l` 表示该文件是一个\
  \ `soft link`（软链接），权限 `rwxrwxrwx` 在所有用户访问该文件时授予 `all` 权限。软链接的权限基于它所链接的文件，因此这些权限会被覆盖并变为\
  \ `rw-r—r--`（即 `zbest.txt` 的权限）。\n\n同样注意文件名有一个箭头（`->`）指向它所链接的文件 `zbest.txt`。软链接的内容包含了它所引用的文件名称。由于\
  \ `zbest.txt` 是九个字符，因此文件大小为 9 字节，而不是 `zbest.txt` 的实际大小。\n\n最后，注意链接数保持为 `2` 而没有变为\
  \ `3`。这是因为软链接创建了它自己的 inode，而不是向当前 inode 添加另一个文件名。关键区别在于：硬链接指向 inode 号，而软链接指向文件名。\n\
  \n![Images](img/note.jpg)\n\n**注**  你也可以使用 `readlink` 命令来确定符号链接指向哪个文件，如下：`readlink\
  \ symlink.txt`\n\n要删除软链接，请运行 `rm <destination_link_file_name>` 或 `unlink <destination_link_file_name>`。使用\
  \ `rm symlink.txt`（或 `unlink symlink.txt`）移除 `symlink.txt` 除了丢失该符号链接外没有其他影响。但如果你用\
  \ `rm zbest.txt` 删除了源文件，那么在你运行以下命令后，系统会打印 `cat: symlink.txt: No such file or directory`：\n\
  \n```bash\ncat symlink.txt\n```\n如图 5-11 所示，因为 `zbest.txt` 不再存在。\n\n![Images](img/F05-11.jpg)\n\
  \n**图 5-11**  从软链接中移除和添加目标文件\n\n在重新创建 `zbest.txt` 后，链接将再次生效。数据不再相同，因为创建了一个新的 `zbest.txt`\
  \ 文件，但 `zbest.txt` 可以重新链接到 `zlink.txt`。对于文件 `symlink.txt` 而言，无论它包含什么数据，它都指向 `zbest.txt`，如图\
  \ 5-11 最后五行所示。\n\n### 软链接比硬链接更常见\n\n与软（符号）链接相比，硬链接在文件系统中更容易找到。带有 `-inum` 选项的 `find`\
  \ 命令通过 inode 号搜索文件，这将在本文章节稍后于“在 Linux 文件系统中查找文件”部分中讨论。但 Linux 系统更频繁地使用符号链接，因为它可以链接到任何内容，包括目录和网络文件。硬链接只有在文件共享同一个文件系统时才能正常工作。\n\
  \n### 使用 `mkdir` 创建新目录\n\n`mkdir`（make directory）命令用于创建目录。在示例中，在 `student1` 的家目录下执行了命令\
  \ `mkdir MyDir`：\n\n![Images](img/f0133-01.jpg)\n\n你可以使用绝对路径或相对路径在当前目录以外的地方创建目录。例如，要在\
  \ `/tmp` 目录下创建一个名为 `backup` 的新目录，在 shell 提示符处输入 `mkdir /tmp/backup`。\n\n`mkdir -p`\
  \ 命令创建目录树。例如，运行命令 `mkdir -p ~/temp/backups/daily` 会创建 `temp` 目录，然后创建子目录 `backup`，最后创建子目录\
  \ `daily`。\n\n![Images](img/note.jpg)\n\n**注**  使用 `tree` 命令列出目录路径的内容。显示父目录及其子目录。\n\
  \n#### 确定文件类型\n\n`ls -l` 命令输出的第一个字符是指示文件类型的代码，如表 5-1 所示。\n\n![Images](img/f0133-02.jpg)\n\
  \n**表 5-1**  文件类型代码\n\n查看图 5-12 中的第 1 到第 3 行，你可以看到每个文件都是纯文本文件。这些信息没有关于文件详细内容的任何信息。\n\
  \n![Images](img/F05-12.jpg)\n\n**图 5-12**  纯文本文件类型\n\n当大多数文件被创建时，文件的前几个字节包含文件签名或\
  \ `magic number`（魔数），它指示了文件中存储的内容类型。\n\n`file` 命令将文件的魔数与 `/usr/share/misc/magic`、`/usr/share/misc/magic.mgc`\
  \ 和 `/etc/magic` 中的文件签名数据库进行比较，以确定文件类型。\n\n图 5-13 显示了 `file` 命令的示例输出。注意 `file` 命令如何提供内容的描述，因为它使用魔数来确定文件中存储的内容类型。\n\
  \n![Images](img/F05-13.jpg)\n\n**图 5-13**  `file` 命令\n\n### 查看文件内容\n\n你可能会发现，你经常想在屏幕上快速查看文本文件，而不是加载\
  \ `vi` 文本编辑器。Linux 提供了多种命令行工具来实现此，包括：\n\n- `cat`: `cat` 命令用于显示纯文本。命令 `cat <filename>`\
  \ 在屏幕上显示指定的文本文件。例如，要查看 `/etc/passwd` 的内容，请执行命令 `cat /etc/passwd`。\n\n\n\n\n- `less`:\
  \ `less` 命令被称为分页器。它可以用于管理文本的显示方式以及在文件中移动光标。`less` 命令会自动一次一页地暂停长文本文件。你可以使用空格键（Spacebar）、上页（Page\
  \ Up）、分页（Page Down）、左箭头（Left Arrow）和右箭头（Right Arrow）在输出内容之间导航。\n\n- `more`: 与 `less`\
  \ 命令类似，`more` 命令也可以对文件进行分页查看。使用相同的键盘键在输出内容之间导航。使用 `q` 键退出。\n\n- `head`: 默认情况下，`head`\
  \ 命令显示文件的前 10 行。命令 `head -n` 显示文件的前 `n` 行。\n\n- `tail`: `tail` 命令用于在屏幕上显示文本文件的最后\
  \ 10 行。命令 `tail -n` 显示文件的最后 `n` 行。在屏幕上显示日志文件时，`tail` 命令特别有用。在查看日志文件时，通常只需要查看文件的末尾，而不关心几天前或几周前的日志记录。使用\
  \ `tail` 查看文件末尾添加的最后几条日志记录。\n\n`tail` 命令还包含了 `-f` 选项，这对于跟踪或监控文件非常有用。当新内容更新到文件中时，新行将显示在屏幕上。系统管理员经常运行\
  \ `tail -f /var/log/messages` 命令来监控文件中的新条目。\n\n### 删除文件\n\n有时你需要从 Linux 文件系统中删除一个现有的文件。要删除一个文件，你必须对文件所在的目录具有写和执行权限，并对任何父目录具有执行权限。\n\
  \n要删除一个文件，只需输入 `rm <filename>`。在接的示例中，使用 `rm` 命令删除了 `myfile.txt` 文件：\n\n![Images](img/f0135-01.jpg)\n\
  \n在许多发行版中，`rm` 命令被别命名为 `rm -i`。`-i` 选项意味着交互式（interactive），这在删除文件之前需要用户确认。要覆盖 `rm\
  \ -i` 别名，可以在 `rm` 前面加一个 `\\`（反斜杠）；例如，`\\rm <filename>`。\n\n递归选项 `-R` 或 `-r` 用于递归删除目录树，直到所有目录、子目录和文件都被删除。执行\
  \ `rm -R Directory` 来删除该目录、子目录和文件。\n\n![Images](img/exam.jpg)\n\n**考试贴士**：你也可以使用\
  \ `rmdir` 命令删除目录，但仅当目录已空时才有效。`rm -r` 无论目录是否为空都可以工作。\n\n### 复制和移动文件\n\n在 Linux 文件系统中创建和删除文件之外，你还可以复制和移动它们。要复制或移动文件，你必须对文件具有读取权限，对文件所在的目录具有执行权限，对任何父目录具有执行权限，并对目标目录具有写执行权限。\n\
  \n### 使用 `cp` 命令复制文件\n\n`cp`（copy）命令在 Linux 文件系统中创建文件或目录的副本。命令 `cp <source> <destination>`\
  \ 用于复制文件。例如，运行命令 `cp file1 file2` 将创建一个名为 `file2` 的 `file1` 副本。被复制文件的所有者将更改为复制该文件的用户。例如，如果用户\
  \ `root` 复制了一个属于 `student1` 的文件，则复制的文件的所有者将是用户 `root`。\n\n只要目标是一个目录，就可以复制多个文件（例如，`cp\
  \ file1 file2 directory-a`）。\n\n`cp` 选项 `-i` 防止用户将文件复制到已存在的文件。在许多系统中，`cp -i` 命令是\
  \ `cp` 命令的默认别名，以防止用户意外覆盖重要文件。\n\n递归选项 `-R` 或 `-r` 用于递归复制目录树，直到所有目录、子目录和文件都被复制到目标目录。例如，执行\
  \ `cp -R DirectoryA DirectoryB` 将 `DirectoryA` 复制到 `DirectoryB`。\n\n### 使用 `mv`\
  \ 命令重命名文件\n\n`mv` 命令用于移动或重命名文件或目录。例如，要将 `mvtest1` 重命名为 `mvtest2`，执行命令 `mv mvtest1\
  \ mvtest2`。注意图 5-14 中的 inode 节点数；链接到 inode `1072491` 的新名称现在是 `mvtest2`。\n\n![Images](img/F05-14.jpg)\n\
  \n**图 5-14** `mv` 命令\n\n如果源文件和目标文件不在同一个文件系统系统中，`mv` 命令会将源文件复制到新位置，然后删除原始文件。\n\n\
  递归选项 `-R` 或 `-r` 用于递归移动目录树，直到所有目录、子目录和文件都被移动到目标目录。例如，执行 `mv -R DirectoryA DirectoryB`\
  \ 将 `DirectoryA` 移动到 `DirectoryB`。\n\n## 练习 5-2：管理文件\n\n在此练习中，练习创建和查看文件以及在目录之间移动。\n\
