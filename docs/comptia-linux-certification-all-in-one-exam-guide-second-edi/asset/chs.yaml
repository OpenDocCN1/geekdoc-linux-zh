  \ `tr` 压缩选项\n\n### `cut` 命令\n\n`cut` 命令用于从文件中指定列或字段并打印到标准输出。表 13-8 显示了可以用于 `cut`\
  \ 的选项。\n\n![Images](img/f0419-01.jpg)\n\n**表 13-8** `cut` 命令选项\n\n在图 13-21 中，我们执行\
  \ `who` 命令，然后使用 `tr -s` 命令删除多个连续空格，使字段之间只剩留一个空格。`cut` 命令使用空格作为分隔符，提取出真实的用户名（字段 1）和时间（字段\
  \ 3）。\n\n![Images](img/F13-21.jpg)\n\n**图 13-21** 使用 `cut` 命令提取字段\n\n### `nl` 命令\n\
  \n`nl` 的常见用法是行编号。这可以通过执行命令 `nl <filename>` 来实现。\n\n在创建文本文档时，你可以将文档分为三个部分（页眉、正文和页脚），并为每个部分分配独立的编号方案。默认情况下，`nl`\
  \ 只对正文部分进行编号。\n\n表 13-9 显示了标记 `nl` 文档的命令行选项和文本文件标识符。图 13-22 展示了使用 `nl` 标识符将文档划分部分的示例。\n\
  \n![Images](img/f0420-01.jpg)\n\n**表 13-9** `nl` 标识符\n\n![Images](img/F13-22.jpg)\n\
  \n**图 13-22** 使用 `nl` 标识符格式化的文档\n\n每个部分的编号方案通过命令行中的标识符以及表 13-10 所示的一个或多个选项来实现。\n\
  \n![Images](img/f0420-03.jpg)\n\n**表 13-10** `nl` 编号选项\n\n部分的语法为 `<-h|-b|-f> a`。\n\
  \n命令 `nl -h a -b n -f t -v 20 nltest` 将对文件 `nltest` 的编号从 20 开始（`-v 20`），并每次递增二（`-i\
  \ 2`）。页眉部分的所有行将被编号（`-h a`），正文部分的所有行都不会编号（`-b n`），页脚将不对空行编号（`-f t`）。图 13-23 显示了命令的输出。\n\
  \n![Images](img/F13-23.jpg)\n\n**图 13-23** 按部分对文档编号\n\n### `od` 命令\n\n`od` 命令将二进制文件的内容转换为十六进制、八进制或十进制到标准输出设备。该命令用于定位文件中的更改或不需要的字符。\n\
  \n![Images](img/note.jpg)\n\n**注意** 文件 `helloworld.odt` 可以在你的镜像 `/LABS/Chapter_13/source`\
  \ 中找到。\n\n使用 `od` 的语法为 `od <options> <filename>`。以下是一些常用的选项：\n\n•  `-b` 八进制显示\n\
  •  `-d` 十进制显示\n•  `-x` 十六进制显示\n•  `-c` 字符显示\n\n软件人员使用 `od` 命令帮助反向编译源码，系统管理员使用它查找制表符或换行符等隐藏字符。接下来，我们需要查看\
  \ `sed` 和 `awk`。\n\n### `sed` 命令\n\n`sed` 是一个数据流编辑器，它每次将文件的一行读入缓冲区并对每行进行单一更改。`sed`\
  \ 不改变被编辑文件的内容。要保存更改，必须将输出重定向到文件。\n\n`sed` 命令的语法为 `sed <options> <address> <expression>`。某些\
  \ `sed` 选项列在表 13-11](#ch13.xhtml_ch13tab11)中。\n\n![Images](img/f0422-01.jpg)\n\n\
  **表 13-11** `sed` 命令选项\n\n命令 `sed '=' /etc/passwd` 将打印文件 `/etc/passwd`（参见图 13-24）。每行前面都会有一个行号。\n\
  \n![Images](img/f0422-02.jpg)\n\n**图 13-24**  `sed \"=\" /etc/passwd`\n\n命令 `sed\
  \ 1,3p /etc/passwd` 应该打印 `/etc/passwd` 文件从第 1 行到第 3 行的行范围内容。在查看图 13-25 中的输出时，看起来整个文件都被处理了。\n\
  \n![Images](img/F13-21.jpg)\n\n**图 13-21** 使用 `cut` 命令提取字段（注：此处文本与前文重复，已按要求处理）\n\
  \n\n\n\n要追加一行，请使用 `a` 选项。命令 `sed '3 a \\This is an append test'`（参见图 13-36）将在第 3\
  \ 行之后添加文本 `This is an append test`。\n\n![Images](img/F13-36.jpg)\n\n**图 13-36**\
  \ 使用 `sed` 追加行\n\n要删除一行，请使用 `d` 选项。命令 `cat sedawk | sed 3,5d`（参见图 13-37）将删除文件 `sedawk`\
  \ 的第 3 到 5 行。请记住，`sed` 不会更改文件，而是显示将发生的变化。要保存更改，请将输出重定向到文件。\n\n![Images](img/F13-37.jpg)\n\
  \n**图 13-37** 使用 `sed` 删除范围内的行\n\n### `awk` 命令\n\n`awk` 是一个用于处理文本文件的应用程序。`awk` 的\
  \ GNU 实现是 `gawk`。可以执行 `gawk` 或 `awk` 任意命令。`awk` 每次处理一行。它将每行视为一条记录，并将其分为多个字段。字段之间由分隔符分隔。默认分隔符是空格或制表符。\n\
  \n表 13-12 列出了一些 `awk` 选项。\n\n![Images](img/f0426-02.jpg)\n\n**表 13-12** `awk` 选项\n\
  \n`awk` 还拥有一组内置变量。这些变量的部分列表见表 13-13。\n\n![Images](img/f0426-03.jpg)\n\n**表 13-13**\
  \ `awk` 变量\n\n`awk` 使用与 `echo` 命令相同的转义序列来执行字符插入。其中一些已列在表 13-14 中。\n\n![Images](img/f0426-04.jpg)\n\
  \n**表 13-14** 字符插入代码\n\n### 过滤命令输出\n\n接几个命令使用 `awk` 或 `gawk` 来过滤命令的输出。\n\n大多数命令使用空白字符来分隔输出的列。每一列（或字段）被分配一个从\
  \ `1` 到 `9` 的位置数字。我们将使用该位置数字来引用特定的输出字段。\n\n在以下示例中，`ls -l` 命令的输出通过 `awk` 过滤，显示输出的第一个字段（权限）和输出的第九个字段（文件名）。\n\
  \n![Images](img/f0427-01.jpg)\n\n为了让输出更具读性，让我们通过添加多个双引号包围的空格，在字段之间添加空格。\n\n![Images](img/f0427-02.jpg)\n\
  \n在下面的插图中，我们将空格替换为制表符。\n\n![Images](img/f0427-03.jpg)\n\n最后，我们添加了描述性文本以保持清晰。\n\n\
  ![Images](img/f0427-04.jpg)\n\n### 过滤文件内容\n\n在以下示例中，我们从 `/etc/passwd` 文件中提取信息并创建格式化输出。注意，使用了\
  \ `-F` 选项来指定冒号 (`:`) 字符为分隔符。\n\n![Images](img/f0427-05.jpg)\n\n其余示例使用文件 `sedawk`\
  \ 作为数据源。\n\n![Images](img/f0428-01.jpg)\n\n![Images](img/note.jpg)\n\n**注意** `sedawk`\
  \ 文件位于 `/LABS/Chapter_13/source` 目录下。\n\n在以下示例中，我们正在过滤所有成绩大于 `80` (`$5 > 80`) 的女性学生（`$2\
  \ == \"F\"`）。\n\n![Images](img/f0428-02.jpg)\n\n在下一个示例中，我们正在过滤所有名字以 `A` 或 `B` 开头的学生。\n\
  \n![Images](img/f0428-03.jpg)\n\n### 使用脚本文件\n\n你可以创建 `awk` 脚本文件并将其应用于数据。图 13-38\
  \ 显示了一个名为 `sedawkscript` 的脚本文件。\n\n![Images](img/F13-38.jpg)\n\n**图 13-38** 文件 `sedawkscript`\n\
  \n![Images](img/note.jpg)\n\n**注意** `sedawkscript` 文件位于 `/LABS/Chapter_13/source`\
  \ 目录下。\n\n脚本文件分为三个部分。每个部分都包含在花括号 `{ }` 中。`BEGIN` 部分用于声明变量。下一部分是一组要处理的命令，`END` 部分用于创建报告。\n\
  \n命令\n\n![Images](img/f0429-02.jpg)\n\n将按班和成绩对文件 `sedawk` 进行排序，然后通过 `awk` 脚本 `sedawkscript`\
  \ 过滤结果（参见图 13-39）。报告将生成学生成绩列表、报告的成绩总数以及平均分。\n\n![Images](img/F13-39.jpg)\n\n**图\
  \ 13-39** 使用 `sedawkscript`\n\n![Images](img/exam.jpg)\n\n**考试提示** 对于 CompTIA Linux+\
  \ 考试题，务必确保充分理解 `tr`、`sed` 和 `awk`。\n\n### `sort` 命令\n\n`sort` 命令用于对输出中的一个或多个字段进行排序。字段按照它们在命令行上出现的顺序进行排序。表\
  \ 13-15 描述了 `sort` 命令的一些选项。\n\n![Images](img/f0429-03.jpg)\n\n**表 13-15** `sort`\
  \ 命令选项\n\n命令 `ls -l | sort -k 5,5n -k 9,9`（参见图 13-40）将根据文件大小然后文件名对 `ls -l` 命令的输出进行排序。\n\
  \n![Images](img/F13-40.jpg)\n\n**图 13-40** 使用 `ls`  `sort`\n\n### `split` 命令\n\n\
  `split` 命令将大文件拆成较小的部分。配合 `split` 命令使用的选项在表 13-16 中解释。`split` 命令的语法如下：\n\n![Images](img/f0430-01.jpg)\n\
  \n**表 13-16** `split` 命令选项\n\n![Images](img/f0430-02.jpg)\n\n`split` 创建的文件的标准命名规范为\
  \ `xaa`、`xab`、`xac` 等。输出前缀将把 `x` 替换为在 `<output_prefix>` 中指定的参数。例如，如果参数 `<output_prefix>`\
  \ 设置为 `sp`，输出文件将命名为 `spaa`、`spab`、`spac`。\n\n### `head` 命令\n\n命令 `head <filename>`\
  \ 将打印文件的前 10 行。命令 `head -n <filename>` 将显示文件的前 *n* 行。\n\n### `tail` 命令\n\n命令 `tail\
  \ <filename>` 将打印文件的最后 10 行。命令 `tail -n <filename>` 将显示文件的最后 *n* 行。\n\n### `uniq`\
  \ 命令\n\n`uniq` 命令报告或忽略相邻的重复行。语法为 `uniq <options> <input>`。`uniq` 可以使用以下选项：\n\n-\
  \ `-d`: 仅打印重复行\n- `-u`: 仅打印唯一行\n\n例如，假设我们的 `lastnames` 文件包含重复项：\n\n![Images](img/f0430-03.jpg)\n\
  \n你可以使用 `uniq lastnames` 命令来移除重复行。如下所示：\n\n![Images](img/f0431-01.jpg)\n\n再次，`uniq`\
  \ 命令仅在重复行相邻时有效。如果你需要处理的文本流包含不相邻的重复行，请先使用 `sort` 命令使其相邻，然后通过管道传递给 `uniq`。\n\n###\
  \ `wc` 命令\n\n`wc` 命令打印文件中换行数、单词数字节数。语法为 `wc <options> <filename>`。`wc` 可以使用以下选项：\n\
  \n- `-c`: 打印字节数\n- `-m`: 打印字符数\n- `-l`: 打印换行数\n- `-L`: 打印最长行的长度\n- `-w`: 打印单词数\n\
  \n例如，要打印 `firstnames` 文件的所有计数和总量，可以使用 `wc firstnames` 命令，如下所示：\n\n![Images](img/f0431-02.jpg)\n\
  \n输出意味着有 3 行、6 个单词和 21 个字符。\n\n### 练习 13-2：处理文本流\n\n此练习请使用随书附带镜像。使用密码 `password`\
  \ 以 `root` 用户登录。\n\n以下是遵循的步骤：\n\n1. 使用命令 `cd /LABS/Chapter_13/work` 切换到脚本目录。`/LABS/Chapter_13`\
  \ 目录也包含一个源目录。那些是原始文件，万一出错可以将它们复制到工作目录。\n\n\n\n\n\n## 2. 若仅显示文件所有者、所属组、文件大小和文件名，请使用以下命令：\n\
  \n```\nls -l | cut -d \" \" -f3,4,5,9\n```\n\n## 3. 按文件所有者和文件大小对输出进行排序：\n\n```bash\n\
  ls -l | cut -d \" \" -f3,4,5,9 | sort -k3 -k9n\n```\n\n## 4. 执行此命令将步骤 3 中的命令输出保存到\
  \ `labfile`：\n\n```bash\nls -l | cut -d \" \" -f3,4,5,9 | sort -k3 -k9n >labfile\n\
  ```\n\n## 5. 若将每个文件的所有者名称更改为 `fred`，请使用以下命令：\n\n```bash\nsed -n 's/root/fred/p'\
  \ labfile\n```\n\n## 6. 输出文件 `labfile` 的第一行以确定其结构：\n\n```bash\nhead -1 labfile\n\
  ```\n\n## 7. 使用以下命令通过 `awk` 打印“The file <filename> is owned by <owner>”：\n\n```\n\
  awk '{print \"The file \" $4 \" is owned by \" $1}' labfile\n```\n\n### 章节总结\n\n\
  在本章中，你学习了如何在 Linux 系统上创建基本的 Shell 脚本。本章讨论了如何设置控制结构（例如 `if` 和 `case` 语句）来控制脚本的流，以及如何使用循环（如\
  \ `while`、`until` 和 `for`）在特定时间内重复执行一系列命令。\n\n你还学习了如何使用 `tr`、`cut`、`sed` 和 `awk`\
  \ 等命令处理文本。Shell 脚本是包含各种命令的文本文件，这些命令用于自动化任务和处理信息。\n\n以下是本章的一些要点：\n\n- Bash Shell\
  \ 脚本应以 `#!/bin/bash` 开头，指定使用 Bash Shell 运行脚本。\n- 在每个脚本的开头包含一个以 `#` 开头的注释，描述其功能。\n\
  - 你可以通过使用 `/bin/bash <script_filename>` 或通过为脚本文件添加执行权限来运行 Shell 脚本。\n- 你可以在脚本中使用\
  \ `read <variable_name>` 读取用户输入。\n- 若要制作一个分两个分支的脚本，可以使用 `if/then/else` 结构。\n- 你可以在\
  \ `if/then/else` 结构中使用 `test` 命令来测试条件。\n- 如果你的脚本需要两个以上分支，可以使用 `case` 结构。\n- 通过 `case`\
  \ 结构，你可以评估多个条件，并根据哪个条件为真来执行系列命令。\n- 循环结构有三种：`while` 循环、`until` 循环和 `for` 循环。\n-\
  \ `while` 循环会不断执行，直到指定的条件不再成立。\n- `until` 循环在条件为假时一直执行。一旦条件为真，就会停止。\n- 若要循环特定次数，可以使用\
  \ `for` 循环。\n- 你可以处理文本流以在脚本内部或管道内部处理和修改文本。\n- 你可以使用以下工具处理流：`cut`、`nl`、`od`、`sed`、`awk`、`head`、`tail`、`sort`、`split`、`tr`、`uniq`、`wc`。\n\
  - 使用 `$( )` 命令替换允许你运行一个命令并将其输出作为参数粘贴回命令行。\n\n### 练习\n\n**1. 每一个 Bash 脚本开头必须包含以下哪一项？**\n\
  A. `#Comment`\nB. `#!/bin/bash`\nC. `exit 0`\nD. `# script`\n\n**2. 你在主目录下创建了一个名为\
  \ `myscript` 的 Shell 脚本。如何执行它？（选择两个）**\nA. 在 shell 提示符下输入 `/bin/bash ~/myscript`。\n\
  B. 在 shell 提示符下输入 `myscript`。\nC. 在图形桌面选择“运行”；然后输入 `~/myscript` 并选择“运行”。\nD. 在 shell\
  \ 提示符下输入 `run ~/myscript`。\nE. 输入 `chmod u+x ~/myscript;` 然后 shell 提示符下输入 `~/myscript`。\n\
  \n**3. 哪个命令将创建一个名为 `TOTAL` 的变量并将其类型设置为 `integer`？**\nA. `variable -i TOTAL`\nB.\
  \ `declare -i TOTAL`\nC. `declare TOTAL -t integer`\nD. `TOTAL=integer`\n\n**4.\
  \ 你需要在 Shell 脚本内部在屏幕上显示“Hello world”。哪个命令可以实现此操作？**\nA. `echo \"Hello world\"`\n\
  B. `read Hello world`\nC. `writeln \"Hello world\"`\nD. `print \"Hello world\"`\n\
  \n**5. 在 Shell 脚本内部，你需要提示用户输入电话号码。你需要将他们输入的值赋值给名为 PHONE 的变量。哪个命令可以实现此操作？**\nA. `read\
  \ \"What is your phone number?\" $PHONE`\nB. `read $PHONE`\nC. `read PHONE`\nD.\
  \ `? \"What is your phone number?\" PHONE`\n\n**6. 哪个命令可以在 `if/then/else` 结构内部评估指定条件是否为真？**\n\
  A. `eval`\nB. `==`\nC. `test`\nD. `<>`\n\n**7. 在 Shell 脚本的 `if/then/else` 结构中，如果变量\
  \ `num1` 小于变量 `num2`，哪个命令的结果为真？**\nA. `eval num1 < num2`\nB. `test num1 < num2`\n\
  C. `test num1 -lt num2`\nD. `test \"num1\" != \"num2\"`\n\n**8. 在 Shell 脚本中，你需要提示用户从\
  \ `echo` 命令提供的七种不同选项中选择一个。哪个控制结构最适合评估用户的输入并运行相应的命令集？**\nA. `while` 循环\nB. `for`\
  \ 循环\nC. `until` 循环\nD. `if/then/else`\nE. `case`\n\n**9. 哪个控制结构会不断执行，直到指定的条件不再成立？**\n\
  A. `while` 循环\nB. `for` 循环\nC. `until` 循环\nD. `if/then/else`\nE. `case`\n\n**10.\
  \ 哪些控制结构被认为是分支结构？（选择两个）**\nA. `while` 循环\nB. `for` 循环\nC. `until` 循环\nD. `if/then/else`\n\
  E. `case`\n\n**11. 哪个控制结构在条件为假时一直执行？**\nA. `while` 循环\nB. `for` 循环\nC. `until` 循环\n\
  D. `if/then/else`\nE. `case`\n\n**12. 哪个控制结构会处理指定的次数？**\nA. `while` 循环\nB. `for`\
  \ 循环\nC. `until` 循环\nD. `if/then/else`\nE. `case`\n\n**13. 哪个命令将从 `file.txt` 删除字符\
  \ `n`？**\nA. `tr -d < file.txt`\nB. `tr -d file.txt`\nC. `tr --delete > file.txt`\n\
  D. `tr --delete file.txt`\n\n**14. 哪个命令可以从制表符作为分隔符，将文件中指定的列打印到标准输出？**\nA. `cut`\n\
  B. `pr`\nC. `fmt`\nD. `sort`\n\n**15. `logfile.txt` 的第一列包含姓。哪些命令可以按姓对文件排序？（选择两个）**\n\
  A. `sort < logfile.txt`\nB. `sort logfile.txt`\nC. `sort < logfile.txt -o \"screen\"\
  `\nD. `sort < logfile.txt > screen`\nE. `sort -n logfile.txt`\nF. `cat /var/log/messages\
  \ | awk 'syslog {print 6,7,8}'`\n\n**16. 你需要在主目录下名为 `proj_sched.txt` 的文件中搜索并将单词\
  \ `June` 替换为单词 `July`，并将输出发送到新文件 `new_proj_sched.txt` 中。哪个命令可以实现此操作？**\nA. `cat\
  \ ~/proj_sched.txt | sed s/June/July/`\nB. `cat ~/proj_sched.txt | awk s/June/July/`\n\
  C. `cat ~/proj_sched.txt | awk s/June/July/ 1> new_proj_sched.txt`\n\n\n\n\n# D.\
  \ `cat ~/proj_sched.txt | sed s/June/July/ 1> new_proj_sched.txt`\n\n### 答案\n\n\
  - **1.** **B.** 每个 Bash shell 脚本开头必须包含 `#!/bin/bash` 元素。\n- **2.** **A, E.** 你可以输入\
  \ `/bin/bash ~/myscript` 或 `chmod u+x ~/myscript` 来执行脚本。\n- **3.** **B.** `declare\
  \ -i TOTAL` 命令将创建 `TOTAL` 变量并将其类型定义为整数`integer`）。\n- **4.** **A.** `echo \"Hello\
  \ world\"` 命令将在 shell 脚本内部在屏幕上显示“Hello world”文本。\n- **5.** **C.** shell 脚本中的 `read\
  \ PHONE` 命令将用户输入的值赋值给名为 `$PHONE` 的变量。\n- **6.** **C.** `test` 命令可以在 `if/then/else`\
  \ 结构内部用于评估指定条件是否为真。\n- **7.** **C.** 如果变量 `num1` 小于变量 `num2`，则 `test num1 -lt num2`\
  \ 命令在 `if/then/else` 结构中为真。\n- **8.** **E.** `case` 结构是评估用户多项选择并运行相应命令 set 的最佳选项。\n\
  - **9.** **A.** `while` 循环将不断处理，直到指定的条件评估为假为止。\n- **10.** **D, E.** `if/then/else`\
  \ 和 `case` 结构被认为是分支结构，因为它们会根据指定条件的评估结果将脚本引导到几个方向中的一个。\n- **11.** **C.** `until`\
  \ 循环控制结构只要指定的条件评估为假，就会一直不断处理。\n- **12.** **B.** `for` 循环控制结构将处理指定的次数。\n- **13.**\
  \ **A.** `tr -d n < file.txt` 命令将删除所有字母 `n`。（使用命令 `tr –delete n < file.txt` 同样有效。）\n\
  - **14.** **A.** `cut` 命令可以用于制表符作为分隔符，从文件中打印你指定的列或字段到标准输出。\n- **15.** **A, B.**\
  \ `sort < logfile.txt` 命令和 `sort logfile.txt` 命令都将 `logfile.txt` 文件的内容发送给 `sort`\
  \ 命令，按字母顺序对其行进行排序并显示在屏幕上。\n- **16.** **D.** `cat ~/proj_sched.txt | sed s/June/July/\
  \ 1> new_proj_sched.txt` 命令将在 `proj_sched.txt` 文件中搜索单词 `June`并将所有实例替换为单词 `July`。`sed`\
  \ 的输出将写入名为 `new_proj_sched.txt` 的文件。\n\n# 第 14 章\n## 管理 Linux 网络设置\n\n在本章中，你将学习到：\n\
  \n- 理解 IP 网络\n- 配置网络地址参数\n- 排除网络问题\n- 理解基于网络的文件系统\n\n*我热爱机器人技术是因为我可以建立的连接。*\n—Carlotta\
  \ Berry，罗斯-霍尔曼理工学院\n\n到本书为止，我们一直关注于将 Linux 作为独立的计算机系统进行配置和使用。然而，Linux 也可以配置为在网络环境中运行。与许多操作系统不同，Linux\
  \ 从设计之初就考虑了网络化。\n\nLinux 最强大的特性之一是，几乎任何分发版都可以配置为承担网络上的各种角色——而且成本极低或没有成本。例如，可以将 Linux\
  \ 系统配置为以下任何一种：\n\n- 网络工作站\n- 安全外壳 (SSH)、文件服务器和打印服务器\n- 数据库服务器\n- 动态主机配置协议 (DHCP)\
  \ 服务器\n- 域名系统 (DNS) 域名服务器\n- Web 和网络时间协议 (NTP) 服务器\n- 电子邮件和虚拟私有网络 (VPN) 服务器\n- 负载均衡、集群或容器服务器\n\
  - 域控制器、日志、监控和身份验证服务器\n- 轻级目录访问协议 (LDAP) 目录服务器\n- 网关路由器和代理服务器\n- 数据包过滤、状态检测或应用层防火墙\n\
  - 证书机构 (CA) 服务器\n\n对于大多数其他操作系统，你必须花费大量资金才能获得这些额外功能。在本章中，我们重点关注如何在你的 Linux 系统上启用基础网络功能，以及如何设置各种\
  \ Linux 服务。\n\n![Images](img/exam.jpg)\n\n**考试提示** 作为考生，你应该非常熟悉 CompTIA Linux+ 考试的\
  \ Linux 网络基础。务必理解 IPv4 和 IPv6 中互联网协议 (IP) 划分是如何工作的。\n\n## 理解 IP 网络\n\n对于 CompTIA\
  \ Linux+ 考试，你需要精通 IP 协议（版本 4 和 6），并知道如何配置该协议使系统能够参与网络。以下是对 IPv4 的内容的简要回顾：\n\n- 什么是协议？\n\
  - IPv4 地址如何工作\n- IPv4 子网掩码如何工作\n\n### 什么是协议？\n\n那么，到底什么是协议？严格来说，`protocol` 是一规则，在网络背景下，它是系统之间通信的规则。协议的一个很好的类比是人类语言。在两个人交流之前，他们必须使用相同的语言；否则信息无法进行传输。\n\
  \n对于 CompTIA Linux+ 考试，你需要熟悉 IP 协议，它是互联网使用的网络协议。IP 与其他协议配合使用，例如传输控制协议 (TCP)、用户数据协议\
  \ (UDP) 以及互联网控制消息协议 (ICMP)，稍后讨论。\n\n![Images](img/note.jpg)\n\n**注意** IP 协议的两个版本被称为\
  \ IPv4 和 IPv6。我们本章首先讨论 IPv4，然后探讨 IPv6。\n\n要理解 TCP/IP 协议，你需要理解开放系统连接 (OSI) 参考模型。OSI\
  \ 参考模型是由大型计算机和电信公司的代表在 1983 年设计的。其目标是设计一种模块化的网络通信模型，以便来自不同厂商的产品可以相互操作。在此之前，解决方案往往是专有的，强制实施者从同一供应商处购买所有组件。通过定义\
  \ OSI 参考模型，行业创建了一个标准，允许管理员从各种供应商处选择组件。\n\nOSI 参考模型将两个主机之间的通信过程分为七层，如图 14-1\n\n**图\
  \ 14-1** OSI 参考模型\n\n这些层将整个通信过程分解为特定的任务。信息从发送系统的层向下流动，然后在网络介质上传输。然后信息从接收端的层向上流动。\n\
  \nOSI 参考模型的层定义如下：\n\n- **第 1 层：物理层** 定义主机之间的电气格式。设备包括电缆和集线器。\n- **第 2 层：链路层** 定义访问物理层的规则。接收到的信息被组织成`数据包。设备包括交换机和桥接器。\n\
  - **第 3 层：网络层** 实现数据到外部网络的路由。IP 和 ICMP 都在此层运行。设备包括路由器和无状态防火墙。\n- **第 4 层：传输层** 确保数据包的完整性和可靠性。TCP\
  \ 和 UDP 在此层运行。设备包括数据包过滤防火墙。\n\n\n\n\n\n- **第 5 层：会话层**：负责维护称为 `sessions`（会话）的应用程序之间的连接。当打开五个标签页时，数据包通过它知道目标是哪个浏览器标签页。\n\
  - **第 6 层：表示层**：负责确保数据格式正确并正确呈现。大多数的压缩和加密都发生在这里。\n- **第 7 层：应用层**：FTP、SMTP、SSH 和\
  \ Telnet 等“应用”或应用程序运行的地方。设备包括应用层防火墙。\n\nIP 协议（Internet Protocol）本身仅用于确保每个数据包到达目标系统，并在到达目标系统时对其进行重组和排序。这在图\
  \ 14-2 所示。\n\n![Images](img/F14-02.jpg)\n\n**图 14-2** 使用 IP 协议传输数据\n\nTCP 是 IP 协议套件的两个原始组件之一，提供有保障的连接；而\
  \ UDP 被认为是`无连接的`，因为不对比数据包是否到达其终点进行验证。\n\n使用 TCP 就像在使用快递公司时的签名确认。当你发送包裹时，发货人要求收件人对包裹签名，允许发送者验证包裹是否已正确接收。\n\
  \nTCP 用于需要高度数据完整性的应用程序，包括 Web 服务器、电子邮件服务器、FTP 服务器等。使用 UDP 时，数据包在不经确认的情况下被发送。它假设错误检查和纠正不是必要的，或者将由应用程序执行，从而避免了\
  \ TCP 的处理开销。\n\nUDP 类似于通过邮寄寄送明信片。本质上，发送者假设邮递员是可靠的，且明信片上的数据并不重要需要收件人签名。使用 UDP 的应用程序包括：\n\
  \n- 音频和视频流媒体\n- 基于 IP 的语音传输 (VoIP)\n\nICMP 是 IP 套件中的另一个核心协议。它与传输协议 TCP 和 UDP 的目的不同。ICMP\
  \ 的主要作用是测试和验证主机之间的网络通信。使用 ICMP 协议的命令是 `ping` 和 `traceroute`。\n\n例如，为了测试网络连通性，`ping`\
  \ 工具将向远程主机发送 ICMP 回显请求包。如果主机接收了这些数据包，它将向发送者响应，从而验证连接成功。`traceroute` 工具用于跟踪数据包从源到目的地经过的路由器。\n\
  \n对于 CompTIA Linux+ 考试，你需要理解传输层提供的 IP 端口概念。端口允许具有单个 IP 地址的单个主机提供多个网络服务。每个服务使用相同的\
  \ IP 地址，但使用不同的端口号运行。\n\n例如，假设一个 IP 地址为 `192.168.1.1` 的网络服务器。该系统可以同时配置为 Web 服务器和\
  \ FTP 服务器并同时运行。每个服务都会监听请求。Web 服务器在端口 80 上监听，FTP 服务器在端口 20 和 21 上监听。因此，发送到端口 80 的请求将由\
  \ Web 服务处理，发送到端口 20 和 21 的数据将由 FTP 守护进程处理。\n\n![Images](img/note.jpg)\n\n**注意**\
  \ FTP 服务在某些方面是比较独特的，因为它使用了两个端口。一个用于控制连接（21 端口），另一个（20 端口）用于传输数据。\n\n端口号范围可以从 0 到\
  \ 65536。这些端口的使用方法由互联网地址与数字分配机构（ICANN）监管。IP 端口被分为三类：\n\n- **常用端口**：为特定服务预留，是编号从 0\
  \ 到 1023 的端口。以下是一些示例：\n- 端口 20 和 21：FTP\n- 端口 22：安全 Shell (SSH, SCP, SFTP, STelnet)\n\
  - 端口 23：Telnet\n- 端口 25：SMTP\n- 端口 53：DNS\n- 端口 80：HTTP\n- 端口 110：POP3\n- 端口 123：NTP（时间同步）\n\
  - 端口 137、138 和 139：NetBIOS\n- 端口 143：IMAP\n- 端口 389：LDAP\n- 端口 443：HTTPS\n- 端口 514：Syslog\
  \ 远程日志\n- **注册端口**：ICANN 预留了 1024 到 49151 端口供组织申请的特殊实现。\n- **动态端口**：动态端口也被称为`私有端口`。49152\
  \ 到 65535 端口被指定为动态端口。它们供任何网络服务使用。它们经常被需要建立临时连接的网络服务使用。\n\n### IPv4 地址的工作原理\n\n基于\
  \ IP 的网络上的每个主机都必须有一个唯一的 IP 地址。IP 地址是逻辑上分配给网络主机的网络层（第 3 层）地址。因为 IP 地址是逻辑地址，它不是永久的。\n\
  \nIP 地址与 MAC 地址不同。MAC 地址是数据链路层（第 2 层）硬件地址，固化在世界上销售的每块网卡的 ROM 芯片上。MAC 地址是硬编码的，无法更改；从理论上讲，世界上每个\
  \ MAC 地址都是唯一的。\n\n![Images](img/note.jpg)\n\n**注意** 地址解析协议（ARP）用于将 IP 地址映射到 MAC\
  \ 地址。ARP 让局域网（LAN）运行得更快。要查看你 Linux 系统上的当前 ARP 表，只需运行 `arp -a` 即可。\n\nIP 地址由四个用点分隔的数字组成。十进制表示法下，每个数字必须在\
  \ 0 到 255 之间。以下是有效的 IP 地址示例：\n- 12.34.56.78\n- 192.168.1.1\n- 10.0.0.1\n- 172.16.254.1\n\
  \n一个 IP 地址由四个用点分隔的数字组成。十进制表示法下，每个 `octet`（字节）必须在 0 到 255 之间。以下是有效的 IP 地址示例：\n- 12.34.56.78\n\
  - 192.168.1.1\n- 10.0.0.1\n- 172.16.254.1\n\n一个 IP 地址由四个用点分隔的数字组成。十进制表示法下，每个 `octet`（字节）必须在\
  \ 0 到 255 之间。以下是有效的 IP 地址示例：\n- 12.34.56.78\n- 192.168.1.1\n- 10.0.0.1\n- 172.16.254.1\n\
  \n一个 IP 地址由四个用点分隔的数字组成。十进制表示法下，每个 `octet`（字节）必须在 0 到 255 之间。以下是有效的 IP 地址示例：\n- 12.34.56.78\n\
  - 192.168.1.1\n- 10.0.0.1\n- 172.16.254.1\n\n![Images](img/note.jpg)\n\n**注意** IPv4\
  \ 地址有时被称为“点分十进制”。每个 `octet`（字节）实际上是一个 8 位的二进制数。例如，192.168.1.1 的二进制形式表示如下：\n11000000.10101000.00000001.00000001\n\
  \n对于考试中，将十进制转换为二进制以及反之，最快的方法是理解每个二进制字段的值，如表 14-1 所示。\n\n![Images](img/f044-01.jpg)\n\
  \n**表 14-1** 二进制转十进制计算器\n\n因此，10101011 = 128 + 0 + 32 + 0 + 8 + 0 + 2 + 1 = 179。\n\
  \n![Images](img/exam.jpg)\n\n**考试技巧** 在现实世界中，有子网计算器可以执行这些转换，但你不允许携带计算器进入考试。\n\n\
  某些 IP 地址是被保留的，不能分配给主机。例如，主机 IP 地址的最后一个字节不能是最低子网值，即 0。它保留用于主机所在的网络段的地址。例如，分配 IP 地址为\
  \ 192.168.1.1 的主机默认网络地址为 192.168.1.0。\n\n此外，分配给主机的 IP 地址的最后一个字节不能是最高子网值，即 255。它保留用于向网段内的所有主机发送广播。在前面的示例中，IP\
  \ 地址为 192.168.1.1 的主机默认广播地址将为 192.168.1.255。\n\n基于 IP 网络上的每个主机都必须有一个唯一的 IP 地址。如果主机位于公共网络（如互联网），它必须使用从\
  \ IANA 获取的全球唯一 IP 地址。一旦分配了 IP 地址，世界上其他人就不能在公共网络使用它。\n\n这为 IP 版本 4 引入了一个重要问题。32 位寻址标准允许最多\
  \ 4,294,967,296 个唯一地址。在 IPv4 最初定义时，这似乎是一个巨大的地址数量。但今天，地址数量已经耗尽。\n\n\n\n\n\n缓解 IPv4\
  \ 地址短缺的一种方法是利用`network address translation (NAT)`。NAT 路由器可以向`public`网络展示单个已注册的 IP\
  \ 地址，并将网络背后的成千上万个`private` IP 地址隐藏起来。这在图 14-3 所示。\n\n![Images](img/F14-03.jpg)\n\
  \n**图 14-3**  使用 NAT 路由器分离公网和私有网络\n\n在每一类 IP 地址中，都有一组被称为`private`私有或`reserved`保留的\
  \ IP 地址块。这些地址可以被任何想要使用它们的人使用。这允许管理员在本地网络上使用私有地址，同时仍然能够连接到互联网等公共网络。来自私有网络的所有流量似乎都源于\
  \ NAT 路由器公共侧配置的注册 IP 地址。\n\n以下是私有 IP 地址范围：\n\n•  10.0.0.0–10.255.255.255（A 类）\n\n\
  •  172.16.0.0–172.31.255.255（B 类）\n\n•  192.168.0.0–192.168.255.255（C 类）\n\n这些是非可路由地址，这意味着如果你尝试在互联网等公共网络上使用它们，路由器将不会向这些或从这些转发数据。这允许世界上任何地方的人使用这些私有\
  \ IP 地址范围，而而不必担心冲突。\n\n### IPv4 子网掩码的工作原理\n\n在配置带有 IP 地址的系统时，你还必须分配一个`subnet mask`子网掩码。此参数定义了系统所属的网络。IP\
  \ 地址被分为两个部分：\n\n•  网络地址\n\n•  节点或主机地址\n\nIPv4 地址的一部分用于识别主机所在的网络。另一部分则用于识别网络上的特定主机（节点）。需要记住的关键点是，位于同一网段的每个系统在地址的网络部分必须具有完全相同的数字。然而，它们每个的节点部分必须是唯一的。这在图\
  \ 14-4 所示。\n\n![Images](img/F14-04.jpg)\n\n**图 14-4**  IP 地址中的网络与节点\n\n地址中多少用于网络，多少用于节点，由`subnet\
  \ mask`子网掩码定义。默认子网掩码分为三类（如下文定义），以十进制和二进制形式表示：\n\n![Images](img/f0446-01.jpg)\n\n\
  子网掩码中带有 1 的字节识别 IP 地址的网络部分，而 0 定义了主机部分。例如，IP 地址为`192.168.1.1`且掩码为`255.255.255.0`的\
  \ IP 地址指定了一个子网，其中该地址的前三个字节是网络，最后一个字节是节点。这在图 14-5 所示。\n\n![Images](img/F14-05.jpg)\n\
  \n**图 14-5**  使用子网掩码定义 IP 地址的网络部分和节点部分\n\nIP 地址分为五不同的类，每类都有其自己的默认子网掩码。你只需要关注前三个地址类：\n\
  \n•  **A 类**  `第一个字节的十进制值必须在 1 到 126 之间。`在 A 类地址中，第一个字节是网络地址，后三个字节是节点。A 类仅允许 126\
  \ 个可能的网络，但提供了 1670 万个可能的节点地址。\n\n•  **B 类**  `第一个字节的十进制值必须在 128 到 191 之间。`在 B 类地址中，前两个字节是网络，后两个字节是节点地址。使用\
  \ B 类地址允许 16,384 个可能的网络，每个网络有 65,534 个可能的节点。\n\n•  **C 类**  `第一个字节的十进制值必须在 192 到\
  \ 223 之间。`在 C 类地址中，前三个字节是网络地址，而最后一个字节是节点地址。可用大量的 C 类网络，共 2,097,152 个。然而，任何给 C 类网络只能存在\
  \ 254 个主机。\n\n![Images](img/exam.jpg)\n\n**考试提示**   要计算每个网络的主机数量，请计算子网中 0 的个数，即\
  \ `Z`。例如，一个 C 类网络中有八个 0。每个网络的主机数量或 `N` 的定义如下：\n\n`N = 2^(Z) – 2`\n\n或\n\n`254 =\
  \ 2⁸ – 2 = 256 – 1（网络地址） – 1（广播地址）`\n\n子网掩码通常使用一种名为`CIDR notation`的简写表示法进行标记。这是通过在\
  \ IP 地址后添加斜杠（/）和掩码中使用的 1 的个数来实现的（例如，`192.168.1.1/24`）。`/24` 参数表示使用 24 位子网掩码，其完整形式为\
  \ `192.168.1.1/11111111.11111111.11111111.00000000`。\n\n\n\n\n\n![Images](img/f0450-01.jpg)\n\
  \n**表 14-3** IP 地址分配选项\n\n要为 Linux 系统静态分配 IP 地址参数，请使用 `ifconfig` 命令或较新的 `ip` 命令。在不带任何选项的情况下运行\
  \ `ifconfig` 将显示系统中所有网络接口的当前状态，如图 14-7 所示。\n\n![Images](img/F14-07.jpg)\n\n**图 14-7**\
  \ 使用 `ifconfig` 查看网络接口信息\n\n![Images](img/exam.jpg)\n\n**考试要点** `ifconfig` 列出的是多个接口，而不仅仅是一个。标记为\
  \ `lo` 的额外接口是 `loopback`（回回）接口，通常被分配为 127.0.0.1 的特殊 IP 地址。这是一个虚拟接口，而不是实际的硬件接口。它用于网络测试、内部通信、诊断等。\n\
  \n注意图 14-7，显示了两个网络接口：`ens32` 和 `lo`。`ens32` 接口是系统中安装的以太网网络接口。`lo` 接口是本地回环虚拟网络接口。许多\
  \ Linux 服务的正常运行都需要此接口。\n\n另一个可用于管理 Linux 系统 IP 分配的实用程序是较新的 `ip` 命令。请练习使用此命令，因为它可能会取代\
  \ `ifconfig`、`route` 等命令，因为它还可以管理 IPv6。该命令在 Windows、Chrome 和 macOS 上也可用。要查看当前配置，在\
  \ shell 提示符处输入 `ip addr show`，如下：\n\n![Images](img/f0450-03.jpg)\n\n![Images](img/f0451-01.jpg)\n\
  \n![Images](img/exam.jpg)\n\n**考试要点** `ethtool` 命令允许管理员列出并更改网卡的硬件设置。\n\n一些较重要的参数包括表\
  \ 14-4 所示所示。\n\n![Images](img/f0451-03.jpg)\n\n**表 14-4** `ip addr show` 输出\n\n\
  要使用 `ip` 命令配置 IP 地址参数，请在 shell 提示符处输入 `ip addr add <ip_address> dev <interface>`。例如，要将给\
  \ `ens32` 网络接口的 IP 地址设置为 10.0.0.84，请输入以下：\n\n![Images](img/f0451-02.jpg)\n\n![Images](img/note.jpg)\n\
  \n**注意** 实际的 `ip` 命令允许缩写选项，因此\n\n```bash\n# ip address add 10.0.0.84 dev ens32\n\
  ```\n\n和\n\n```bash\n# ip a a 10.0.0.84 dev ens32\n```\n\n都是运行命令并获得相同结果的可能方法。要从接口删除\
  \ IP 地址，只需在 shell 提示符处输入 `ip addr del <ip_address> dev <interface>` 即可。\n\n`ip`\
  \ 命令还可以禁用和启用网络接口。要禁用接口，请在 shell 提示符处输入 `ip link set <interface> down`。要让禁用的接口恢复上线，请在\
  \ shell 提示符处输入 `ip link set <interface> up`。此外，`systemctl` 也可以重启网络接口。要执行此操作，在 Red\
  \ Hat 类系统上只需输入 `systemctl restart network` 或在 Debian 类系统上输入 `systemctl restart networking`。\n\
  \n此 IP 地址分配不是持久的。它将在重启时丢失。要使其具有持久性，请配置 `/etc/sysconfig/network-scripts` 目录下的 `ifcfg-ens32`\
  \ 文件。此 CentOS 系统的接口示例参数所示：\n\n![Images](img/f0452-02.jpg)\n\n该配置文件中可用的其他选项列在表 14-5\
  \ 中。\n\n![Images](img/f0452-01.jpg)\n\n**表 14-5** 为网络接口配置持久性参数\n\n如果 `BOOTPROTO`\
  \ 设置为 `dhcp`，则不需要 `IPADDR`、`NETMASK`、`NETWORK` 和 `BROADCAST` 行。\n\n如果来自 DHCP 服务器的\
  \ DHCP 租约时间太短，请在 DHCP 服务器上修改 `/etc/dhcpd.conf` 文件。修改 `max-lease-time` 变量以获得更长的租约时间。\n\
