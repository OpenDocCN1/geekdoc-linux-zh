  \ 返回父进程。执行命令 `source /home/student1/.bashrc`。\n\n`noclobber` 是开启还是关闭状态？为什么？\n\n\
  ### 练习 3-1 答案\n\n**步骤 29 的答案** `vi /home/student1/.bashrc`\n\n**步骤 30 的答案** `noclobber`\
  \ 将被关闭。在你编辑配置文件后，必须将更改读入内存。\n\n**步骤 32 的答案** `noclobber` 是开启状态的。每当打开一个进程时，都会读取 `/home/student1/.bashrc`\
  \ 文件；因此，更改已被读入内存。\n\n**步骤 33 的答案** 在创建子 shell 或执行 `source` 命令时，会读取 `.bashrc`。当你在父\
  \ shell 中对 `.bashrc` 首次首次更改时，你没有 source `.bashrc`，因此 `noclobber` 在父 shell 中是关闭的。当你打开一个子\
  \ shell（步骤 31）时，读取了 `.bashrc`；因此，`noclobber` 在子 shell 中是开启的。当你返回父 shell 时，`noclobber`\
  \ 是关闭的。命令 `source /home/student1/.bashrc` 执行 `~/.bashrc` 中的每一行（包括 `set -o noclobber`）。该命令会在当前\
  \ shell 中开启 `noclobber`。\n\n## 重定向\n\n当用户执行命令时，用户输入通过标准输入设备（stdin）接收，默认情况下是键盘。除了错误消息外，所有输出都发送到标准输出设备（stdout），默认是显示器。错误消息输出到标准错误设备（stderr），同样默认是显示器。图\
  \ 3-6 显示默认设置及其值，分别为 0、1 和 2。\n\n![Images](img/F03-06.jpg)\n\n**图 3-6** 标准输入、标准输出和标准错误的默认值\n\
  \n重定向允许用户使用文件描述符将 stdin、stdout 或 stderr 的默认值更改为设备或文件。\n\n## 文件描述符\n\n文件描述符是内核使用的引用或*句柄*（handle）。\n\
  \n- `0`: 标准输入\n- `1`: 标准输出\n- `2`: 标准错误\n\n#### 使用 `<` 重定向 stdin\n\n使用 `<` 运算符重定向输入。例如：\n\
  \n```bash\ncat < file\n```\n\n#### 使用 `<<` 使用 Heredocs\n\n另一种输入重定向的形式是 heredoc。`<<`\
  \ 运算符在此此处：\n\n```bash\ncat << EOF\nhello world\nEOF\n```\n\n`<<<` 运算符允许重定向一个字符串。例如：\n\
  \n```bash\ncat <<< \"hello\"\n```\n\n#### 使用 `>` 和 `>>` 重定向 stdout\n\n使用大于号（`>`）将标准输出重定向到文件。使用双大于号（`>>`）向文件追加内容。\n\
  \n```bash\nwho > file\nwho >> file\n```\n\n#### 使用 `2>` 重定向 stderr\n\n控制运算符 `2>`\
  \ 和 `2>>` 用于选择备用的标准错误文件或设备。\n\n```bash\nls /etc /roses 2> errorfile\n```\n\n####\
  \ 合并 stdout 和 stderr\n\n控制运算符 `>` 和 `2>` 可以组合使用，将两个输出发送到同一个文件或设备。控制运算符 `2>&1` 将标准错误重定向到与标准输出相同的位置。\n\
  \n\n\n\n\n- 控制操作符 `2>` 指定更改错误消息的数据流。\n- 字符 `&` 是逻辑与（AND）操作。\n- `1` 是标准输出设备的文件描述符数字。\n\
  \n命令 `ls -ld /etc /roses > errorfile 2>&1` 将标准输出和标准错误写入文件 `errorfile`。\n\n控制操作符\
  \ `1>&2` 将标准输出重定向到标准错误相同的位置。其工作原理如下：\n\n- 控制操作符 `1>` 重定向标准输出。\n- `&` 是逻辑与（AND）操作。\n\
  - `2` 是标准错误数据流的文件描述符数字。\n\n命令 `ls -ld /etc /roses 2> errorfile 1>&2` 将标准输出和标准错误写入文件\
  \ `errorfile`。\n\n最后，控制操作符 `&>` 同时将标准错误和标准输出重定向到同一个文件。命令 `ls -ld /etc /roses &>\
  \ errorfile` 将 `/etc` 目录属性和错误消息写入 `errorfile`。\n\n### 使用 /dev/null 忽略错误消息\n\n通常，命令产生的错误消息是可以忽略的警告。有时警告太多，会导致丢失良好的\
  \ stdout 数据。使用空设备是一个极佳的解决方案。`/dev/null` 设备是系统每次启动时创建的零字节字符设备。写入 `/dev/null` 的数据会被立即丢弃。\n\
  \n要递归列出系统中所有的文件和目录，你可以运行 `ls -R /`，但你会看到许多无权查看的文件的“权限拒绝”错误。要隐藏这些错误消息，请按如下方式运行命令：\n\
  \n```\nls -R / 2> /dev/null\n```\n\n良好的输出（stdout）显示在屏幕上，而错误消息既不保存也不显示。\n\n### 使用管道向命令发送数据\n\
  \n管道是将一个进程的标准输出（stdout）连接到另一个进程的标准输入（stdin）的方法。管道有两种类型：命名管道和匿名管道。\n\n命名管道是用于促进进程间通信的文件。命名管道接收一个进程的输出并将其放入文件中。另一个进程从文件中提取这些信息。`mknod`\
  \ 和 `mkfifo` 命令用于创建命名管道文件。删除该文件即可移除命名管道。\n\n匿名管道使用管道符号（`|`）左侧命令的输出作为符号右侧命令的输入。为了实现这一点，Linux\
  \ 会内部创建一个临时文件。当命令完成后，该临时文件会被删除。\n\n![Images](img/note.jpg)\n\n**注意** 在美式键盘上按下 `Shift-||`\
  \ 产生管道符号。如果你不同时按下 `Shift` 键，`|` 键（位于 `Enter` 键上方）即为 `\\` 键。\n\n为了理解匿名管道的工作原理，我们将使用一个名为\
  \ `pipetemp` 的虚拟临时文件。命令 `cat file1 | cat > filea` 将命令 `cat file1` 的标准输出重定向为命令 `cat\
  \ > filea` 的输入。管道的左部分执行 `cat file1 > pipetemp`，然后管道的右侧执行命令 `cat pipetemp > filea`。\n\
  \n`tee` 命令将命令的输出显示在控制设备上，并将输出重定向到文件或设备。命令 `cat /etc/hosts | tee filea` 在控制设备上显示\
  \ `/etc/hosts` 的内容，并将文件内容写入 `filea`。\n\n### 练习 3-2：重定向实操项目\n\n在练习 3-2 中，你将执行以下任务：\n\
