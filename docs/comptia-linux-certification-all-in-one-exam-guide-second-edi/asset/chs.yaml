  \n### 章节复\n在本章中，我们介绍了几个影响 Linux 系统的安全问题。从物理上保护 Linux 系统并采取措施保护操作系统本身是至关重要的。\n\n\
  控制用户访问以提高系统的安全性。`root` 用户应仅用于完成 `root` 任务。所有其他任务都应使用标准用户账户完成。如果用户偶尔需要以 `root` 身份运行命令，请为其提供\
  \ `sudo` 权限。实施强密码策略，并在身份验证失败后锁定账户。管理员可以限制用户在 Linux 系统上的登录次数、消耗的 CPU 时间以及使用的内存。\n\
  \n管理员可以配置系统日志文件以排查 Linux 系统问题并检测入侵者。本章最后介绍了如何通过安装 Linux 安全模块（LSM）来启用强制访问控制（MAC）。\n\
  \n确保你理解以下关于提高 Linux 系统安全性的点：\n\n* 服务器需要最高级别的物理安全，并应锁在服务器机房内。对机房的访问应受到严格控制。\n* 用户在离开系统之前应锁定工作站或完全注销。为了方便这一点，用户可以使用\
  \ `nohup` 命令运行程序。这允许进程在用户注销后继续运行。\n* `root` 用户应仅用于完成 `root` 任务。全。所有其他任务都应使用标准用户账户完成。\n\
  * 当需要完成需要 root 级权限的任务时，使用 `su` 命令切换到 `root` 用户，完成后使用 `exit` 命令切换回。\n* 如果用户偶尔需要以\
  \ `root` 身份运行命令，请为其提供 `sudo` 权限。使用 `visudo`\n\n工具通过 `/etc/sudoers` 文件来指定哪些用户可以以\
  \ `root` 身份运行。\n* 如果用户需要以另一个用户的身份运行命令，请为其提供 `pkexec` 权限。\n* 使用 `chage` 命令配置密码有效期。\n\
  * 管理员可以限制用户在 Linux 系统上的登录次数、消耗的 CPU 时间以及使用的内存。实现此点的方法之一是使用可插认证模块（PAM）系统的 `pam_limits`\
  \ 模块。\n* 限制配置在 `/etc/security/limits.conf` 文件中。\n* 管理员还可以使用 `ulimit` 命令配置适用于从 shell\
  \ 提示符启动的程序的系统资源限制。`ulimit` 的语法为 `ulimit <options> <limit>`。\n* 若要临时禁用用户登录，首先使用 `w`\
  \ 或 `lsof` 命令查看所有当前登录用户的列表。警告他们系统将因维护停机。几分钟后，使用 `pkill -KILL -u <username>` 命令强制注销每个不配合的用户。通过创建\
  \ `/etc/nologin` 文件禁用未来的登录。只要该文件存在，除 `root` 之外无人允许登录。\n* 使用 `find` 命令审计设置了 SUID\
  \ 或 SGID `root` 权限的文件，因为这是一个潜在的安全风险，允许恶意攻击者在不知道 `root` 密码的情况下访问。\n* 以 `root` 用户身份在\
  \ shell 提示符使用 `find / -type f -perm -u=s -ls` 命令在 Linux 系统上搜索设置了 SUID 权限的文件。\n*\
  \ 使用 `find / -type f -perm -g=s -ls` 识别设置了 SGID 权限的文件。\n* 除了基准，使用系统日志文件排查 Linux\
  \ 系统问题。系统日志文件存储在 `/var/log`。一些重要的日志文件包括 `kern.log`、`messages` 和 `secure`。\n* 日志由\
  \ `rsyslogd` 守护进程管理，并可以使用 `/etc/rsyslog.conf` 文件进行自定义。\n* 在旧版本的发行版中，日志由 `syslogd`\
  \ 守护进程处理，可以使用 `/etc/syslog.conf` 文件进行自定义。\n* 大多数 Linux 发行版配置为定期轮转日志文件，防止其过大。`cron`\
  \ 守护进程定期运行 `logrotate` 工具来实现此功能。\n* `logrotate` 指定日志文件的方式通过 `/etc/logrotate.conf`\
  \ 文件以及位于 `/etc/logrotate.d/` 的各个服务的配置文件进行配置。\n* 对于 `systemd` 系统，`journald` 守护进程管理日志。`journald`\
  \ 守护进程维护一个名为 journal 的系统日志（位于 `/var/log/journal/`）。\n* 要查看 journal，使用 `journalctl`\
  \ 命令。`journald` 守护进程的行为通过 `/etc/systemd/journald.conf` 文件配置。\n* 使用 `tail` 或 `journalctl`\
  \ 的 `-f` 选项来监控日志文件的新条目。\n* 定期检查以下日志文件，寻找指示入侵尝试的异常：\n* `/var/log/wtmp`\n* `/var/log/faillog`\n\
  * `/var/log/lastlog`\n* `/var/log/messages`\n* SELinux 和 AppArmor 在 Linux 系统上实现强制访问控制。\n\
  * 使用 `ls -Z` 命令观察 SELinux 文件上下文权限设置。\n* 使用 `ps -Z` 命令查看当前运行进程的 SELinux 进程上下文。\n\
  * 使用 `chcon` 命令更改文件的 SELinux 上下文。使用 `restorecon` 命令将文件恢复到默认的 SELinux 上下文。\n* 要查看当前的\
  \ SEL 模式，使用 `sestatus` 或 `getenforce`。`setforce` 命令可以启用强制（enforcing）、允许（permissive）或禁用（disabled）模式。要使模式永久生效，修改\
  \ `/etc/selinux/config` 中的 `SELINUX` 变量。\n* SELinux 策略通过布尔值提供。要获取布尔值，使用 `getsebool`。配置布尔值，使用\
  \ `setsebool`。\n* `audit2why` 命令描述了为什么某个命令被拒绝。\n* `audit2allow` 命令生成如何覆盖被拒绝操作的建议。\n\
  * `semanage` 命令可以将 `audit2allow` 的建议应用到 Linux 命令。\n* AppArmor 使用位于 `/etc/apparmor.d`\
  \ 和 `/etc/apparmor.d/tunables` 的一组配置文件。配置设置包括仅警告的投诉（complain）模式和除非允许则拒绝的强制（deny-unless-permitted）模式。启用投诉模式，使用\
  \ `aa-complain`。启用强制模式，使用 `aa-enforce`。禁用 AppArmor，运行 `aa-disable`。\n* 使用 `aa-unconfined`\
  \ 命令查看不受 AppArmor 保护的网络应用程序。\n\n### 题\n\n**1.** 下列何处是放置服务器最安全的地方？\nA. 接待处前台\nB.\
