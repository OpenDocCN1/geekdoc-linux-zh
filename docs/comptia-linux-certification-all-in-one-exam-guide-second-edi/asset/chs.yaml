  \n### 章节复\n\n在本章中，你学会了如何搜索、添加、修改或删除硬件。你首先学习了内核如何发现设备并将配置和统计数据写入 `/sys/`。然后，你学习了\
  \ `/dev/` 目录是如何构建的，以便用户可以访问设备。在此过程中，你掌握了使用 `lsdev`、`lspci`、`lshw`、`systool` 和 `udev`\
  \ 命令搜索硬件信息的技能。\n\n你通过学习蓝牙、Wi-Fi 以及各种存储设备继续你的探索。最后，你学习了如何添加、修改和删除打印机及打印类别。以下是本章的一些要点：\n\
  \n*   设备是能够接收或提供数据的系统组件。\n*   总线是用于在设备之间传输数据的系统设备。\n*   端口是连接到总线的物理连接。\n*   驱动程序是用于控制硬件设备的文件或文件组。\n\
  *   内核空间是内核可以访问的内存。\n*   用户空间是用户和用户应用程序可以访问的内存。\n*   内核信息通过 `/proc/` 和 `/sys/` 向用户提供。\n\
  *   主设备号指定设备类。\n*   `lsblk` 打印块设备列表。\n*   设备类包含执行相似操作的设备。\n*   `lspci -D` 命令的输出格式为\
  \ `Domain:Bus:Device:Function Class Vendor Name`。\n*   主机总线适配器（HBA）是一种用于扩展卡，用于通过单个控制器将多个设备连接到计算机系统。\n\
  *   执行 `lspci -nn | grep -i hba` 或 `systool -c <adapter_class>` 显示主机适配器。\n*   `lsdev`\
  \ 命令显示已安装硬件的信息。\n*   每个设备都分配有一个中断请求（IRQ）。\n*   `/proc/interrupts` 显示活动的中断。\n*  \
  \ 使用 `lshw`（list hardware）命令显示详细的硬件配置信息。\n*   要创建模块别名，可以在 `/etc/modprobe.d/` 下的配置文件中添加\
  \ `alias <alias_name> <module_name>`。\n*   `dmesg` 是用于读取和控制内核环形缓冲区的命令。\n*   要将模块列入黑名单，可以在\
  \ `/etc/modprobe.d/` 下的配置文件中添加 `blacklist <module_name>`。\n*   `lsusb` 显示 USB 设备列表。\n\
  \n#### 习\n\n**1.** 目录包含了启动过程中发现的设备操作和统计信息？\n\n**A.** `/dev`\n**B.** `/proc/sys`\n\
  **C.** `/sys`\n**D.** `/devices`\n\n**2.** 下列哪些描述了总线？（选择两项）\n\n**A.** 系统设备\n**B.**\
