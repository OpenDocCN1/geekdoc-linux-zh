  \ gcc` 或 `dnf install gcc` 命令。\n\n15. **A.** `yum list updates` 命令。\n\n16. **B,\
  \ D.** `configure` 脚本。\n\n17. **A.** `make` 命令。\n\n18. **C.** `make install` 命令。\n\
  \n19. **C.** `-P` 选项。\n\n\n\n\n\n图 11-1 展示了 Linux 系统通电后的启动过程。启动特定的特定信息会被写入 `/var/log/boot.log`。`systemd`\
  \ 命令 `journalctl -b` 将显示上一次启动的启动信息，但也可以通过以 `root` 用户创建 `/var/log/journal/` 目录来配置为存储之前启动的启动日志。\n\
  \n![Images](img/F11-01.jpg)\n\n**图 11-1** 系统启动过程\n\n### BIOS POST 阶段\n\n打开电脑后，系统固件会进行初始化。系统首先运行上电自检\
  \ (POST)，以确保内存良好且有足够的内存加载内核。系统还会验证键盘、显卡和其他组件是否可用并已初始化。接下来，系统会搜索负责加载操作系统的指令位置，无论这些指令是来自硬盘、网络还是\
  \ USB 闪存盘。\n\n你应该熟悉以下引导方法：\n\n- 经典 BIOS\n- 现代 UEFI\n\n### 经典 BIOS\n\nBIOS（或基本输入/输出系统）是存储在系统主板闪存芯片上的传统引导程序。一旦通电，BIOS\
  \ 就会初始化主板 POST。如果 POST 遇到任何问题，它会在屏幕上显示错误信息，或者播放一系列蜂鸣声。[`www.bioscentral.com`](http://www.bioscentral.com)\
  \ 网站列出了大多数主板 POST 错误代码。\n\nPOST 完成后，BIOS 会遍历设备列表以寻找引导程序代码。你可以通过进入 BIOS 来操作此列表的搜索顺序。图\
  \ 11-2 显示了一个配置为先搜索可移动设备、然后是硬盘列表的系统。图 11-3 显示了同一系统配置为先搜索网络上的可启动镜像，然后查找本地可移动驱动器，最后是本地硬盘。\n\
  \n![Images](img/F11-02.jpg)\n\n**图 11-2** 选择启动设备\n\n![Images](img/F11-03.jpg)\n\n\
  **图 11-3** 选择可移动或网络启动设备\n\n在搜索这些设备时，BIOS 会寻找主引导记录 (MBR)。例如，当从硬盘启动时，BIOS 会查找磁盘设备的第一扇区（也称为引导扇或\
  \ MBR），如图图 11-4\n\n**图 11-4** 主引导记录 (MBR) 详情\n\nMBR 被分为三个部分。MBR 的前 446 字节包含主引导代码的第一阶段。主引导代码包含错误信息（例如“missing\
  \ operating system”）以及加载第二阶段引导程序（称为 `GRUB2`）所需的代码。接下来的 64 字节包含驱动器的分区表，最后 2 字节包含磁盘签名。磁盘签名用于标识包含\
  \ `/boot` 目录的设备，该目录包含启动过程所需的文件。\n\n一旦 BIOS 开始加载引导程序，启动过程的控制权就会交给 `GRUB2` 引导程序。\n\
  \n##### PXE\n\nPXE（读音为 *pixie*），或预启动执行环境，是一种与操作系统无关的客户端/服务器设施，可用于从网络服务器远程启动操作系统或配置计算机系统。PXE\
  \ 要求客户端系统拥有一块支持 PXE 的网卡，并在闪存中将 PXE 设置为启动设备。\n\n当 PXE 客户端通电时，启用的网卡会通过广播一系列 DHCP 发现包来“寻找”\
  \ DHCP 服务器，这些包是客户端向 DHCP 服务器获取 IP 地址的请求。动态主机配置协议 (DHCP) 服务器用于自动为客户端分配 IP 地址，并为客户端提供一个或多个简单形文件传输协议\
  \ (TFTP) 服务器的位置。\n\n#### 现代 UEFI\n\nBIOS 未能跟上技术的进步。它受限于 16 位寻址，只能访问 1MB 内存，无法从大于\
  \ 2.1TB 的驱动器启动，且只能管理有限的设备。\n\n统一扩展固件接口 (UEFI) 是一种固件与操作系统之间的与无关、架构无关的软件接口，旨在克服 BIOS\
  \ 的局限性。UEFI 最重要的功能之一是它能够在操作系统加载之前执行应用程序。\n\nUEFI 的某些功能包括：\n\n- 它在操作系统可用之前提供用户界面。\n\
  - 它以 32 位或 64 位模式运行。\n- 它可以访问所有系统内存和设备。\n- 它可以挂载分区并读取某些文件系统（FAT12、FAT16、FAT32 和\
  \ VFAT）。\n- 它在未加载操作系统的情况下具有网络能力。\n- 它可以启动大于 2.1TB 的驱动器。\n- 它允许你添加可以作为启动过程的一部分或从\
  \ UEFI 命令行 shell 执行的应用程序。\n- 它支持远程诊断和存储备份。\n- 可以通过操作系统使用命令 `efibootmgr` 进行配置。\n\n\
  ![Images](img/note.jpg)\n\n**注意** 如果实施了 UEFI，目录 `/sys/firmware/efi/` 将会存在，且命令 `efibootmgr`\
  \ 应当是可用的。\n\nUEFI 使用 UEFI 启动服务来控制启动过程。在操作系统运行期间，UEFI 在操作系统和固件之间提供一种连接。\n\n在硬件初始化之后，UEFI\
  \ 会寻找带有 EFI 系统分区 (ESP) 的存储设备。该分区是一个 FAT32 分区，其中包含引导程序代码、应用程序和设备驱动程序。该分区通常挂载在 `/boot/efi/`。包含在此处的应用程序可以是启动过程的一部分，也可以是用户在启动时选择的工具。\n\
  \n特定厂商的应用程序或 EFI 工具存储在 `/boot/efi/` 目录中。例如，Red Hat EFI 文件存储在 `/boot/efi/EFI/redhat/`，而\
  \ CentOS 将其引导程序信息存储在 `/boot/efi/EFI/centos/`。如果有多个操作系统，每个在 `/boot/efi/` 中都有自己的目录。\n\
  \n根据 ESP 的内容，可能会发生几种情况。你可能会被提示执行 UEFI 应用程序或加载特定的操作系统，或者 UEFI 可能会自动加载另一个引导程序，例如 `GRUB2`。\n\
  \n### GRUB2 引导程序阶段\n\n一旦 BIOS POST 阶段完成，将使用引导程序来加载 Linux 内核。虽然有多个引导程序可用，但我们将讨论限制在\
  \ CompTIA Linux+ 考试测试的内容上，即统一引导程序版本 2 (GRUB2)。在本节中，你将学习如何：\n\n- 修改 GRUB2 引导程序\n\
  - 修改忘记的 root 密码\n\n### 修改 GRUB2 引导程序\n\n顾其名，GRUB2 是原始 GRUB 引导程序的较新版本。GRUB2 的工作方式与原始\
  \ GRUB Legacy 引导程序完全不同。1.98 或更高版本的 GRUB 被视为“GRUB2”。1.98 之前的任何版本的 GRUB 都被视为“GRUB\
  \ Legacy”。你可以在 shell 提示符处以 `root` 身份运行两个命令之一，查看你的 Linux 系统正在使用的 GRUB 版本：\n\n- `grub-install\
  \ -V`\n- `grub2-install -V`\n\n示例所示：\n\n![Images](img/f0335-02.jpg)\n\nLegacy GRUB\
  \ 和 GRUB2 之间的一个重要区别是设备名称。Legacy GRUB 从 0 开始设备编号，而 GRUB2 从 1 开始编号。\n\n表 11-1 列出了\
  \ GRUB2 使用的配置文件和目录。\n\n![Images](img/f0336-01.jpg)\n\n**表 11-1** GRUB2 配置文件\n\n\
  ![Images](img/exam.jpg)\n\n**考试技巧** 运行 `grub2-install /dev/sda` 将 GRUB2 配置文件重新安装到第一块硬盘的\
  \ `/boot/grub2/` 中。\n\n##### `/etc/default/grub` 中的变量\n\n\n\n\n\n`/etc/default/grub`\
  \ 文件包含 GRUB 配置变量，详见表 11-2。该文件中的设置用于在使用 `grub2-mkconfig` 构建时构建生成 `/boot/grub2/grub.cfg`\
  \ 文件。\n\n![Images](img/f0336-02.jpg)\n\n**表 11-2**  GRUB2 `/etc/default/grub` 变量\n\
  \n### `/etc/grub.d/` 目录下的文件\n\n`/etc/grub.d/` 目录包含在使用 `grub2-mkconfig` 构建时用于 `/boot/grub2/grub.cfg`\
  \ 文件的脚本（参见图 11-5）。脚本按照数字顺序进行处理。表 11-3 描述了其中一些脚本。\n\n![Images](img/F11-05.jpg)\n\n\
  **图 11-5**  `/etc/grub.d/` 中的文件\n\n![Images](img/f0337-02.jpg)\n\n**表 11-3**  `/etc/grub.d/`\
  \ 中的 Grub 脚本文件\n\n### 交互式启动选项\n\n你可以按 `Esc` 中断启动过程。这允许你使用表 11-4 中详细列出的键启动不同的操作系统，甚至进入紧急模式进行故障排除。\n\
  \n![Images](img/f0337-03.jpg)\n\n**表 11-4**  交互式启动控制键\n\n### 修改 GRUB2 启动操作\n\n要更改\
  \ GRUB2 配置，你可以修改 `/etc/default/grub` 文件或更改 `/etc/grub.d/` 中的 `40_custom` 脚本。如果你修改这些文件，必须执行命令\
  \ `grub2-mkconfig -o <config_filename>`。在备份 `/boot/grub2/grub.cfg` 之后，运行命令 `grub2-mkconfig\
  \ -o /boot/grub2/grub.cfg` 或 `update-grub2` 来更新 `grub.cfg`。\n\n要将 `update-grub2`\
  \ 改为 `grub2-update`，请使用以下 `ln` 命令：\n\n![Images](img/f0338-01.jpg)\n\n这允许使用一致的方法运行\
  \ GRUB2 命令，因为大多数命令都以 `grub2-` 开头。\n\n#### 更改忘记的 `root` 密码\n\n偶尔，你可能会忘记 `root` 密码，或者你的某个同事意外离开组织且没有留下密码。要在\
  \ Red Hat Linux 上恢复忘记或丢失的密码，请执行以下步骤：\n\n**1.** 开启计算机，当出现 GRUB2 菜单（如图 11-6 所示）时按\
  \ `Esc`。\n\n![Images](img/F11-06.jpg)\n\n**图 11-6**  GRUB2 启动菜单\n\n**2.** 按 `e`\
  \ 编辑默认的 Linux 选项，如图 11-6 所示。这允许你访问 GRUB2 启动脚本。\n\n**3.** 在 `linux` 或 `linux16` 行中找到\
  \ `ro` 选项（只读），并将其更改为 `rw init=/sysroot/bin/sh`，如图 11-7 所示。\n\n![Images](img/F11-07.jpg)\n\
  \n**图 11-7**  修改 GRUB 启动脚本以访问 shell 模式\n\n**4.** 按 `Ctrl-x` 进入 shell 模式启动，这与紧急模式类似，但不会向你询问\
  \ `root` 密码。\n\n**5.** 运行以下命令序列更改 root 密码，如图 11-8 所示：\n\n![Images](img/F11-08.jpg)\n\
  \n**图 11-8**  更改 `root` 用户密码\n\n![Images](img/f0339-02.jpg)\n\n**6.** 重启系统。\n\n\
  重启后，你将能够使用新密码登录 `root`。我的学生总是对发现这如此简单感到惊讶。为了提高安全，还应设置 BIOS/UEFI 密码或 GRUB2 密码（本章稍后讨论）。最后，物理安全（如将系统保持在安全环境中）可以缓解密码攻击。\n\
  \n![Images](img/exam.jpg)\n\n**考试提示** 另一种进入单用户模式的方法是通过添加 `systemd.boot=rescue.target`\
  \ 来修改 `linux64` 或 `linux` GRUB2 设置。\n\n#### 练习 11-1：使用 GRUB2\n\n在本次练习中，练习自定义 GRUB2\
  \ 菜单。你可以使用虚拟机完成此练习。\n\n![Images](img/video.jpg)\n\n**视频**  请观看练习 11-1 视频以演示如何执行此任务。\n\
  \n完成以下步骤：\n\n**1.** 启动你的 Linux 系统并使用密码 `root` 以 `root` 用户身份登录。\n\n**2.** 创建快照。\n\
  \n**3.** 在 shell 提示符处输入 `vi /etc/default/grub`。\n\n**4.** 将 `GRUB_TIMEOUT` 值更改为\
  \ `15` 秒。\n\n**5.** 将 `GRUB_DEFAULT` 参数更改为如果用户在超时时间内未任何选择，则自动加载第一个菜单项。\n\n**6.**\
  \ 保存更改并退出 `vi` 编辑器。\n\n**7.** 使用以下命令制作 `/boot/grub2/grub.cfg` 的副本：\n\n```\ncp boot/grub2/grub.cfg\
  \ /boot/grub2/grub.cfg.$(date +%m%d).old\n```\n\n**8.** 生成新配置：\n```bash\ngrub2-mkconfig\
  \ -o /boot/grub2/grub.cfg\n```\n\n**9.** 复制新文件：\n```bash\ncp /boot/grub2/grub.cfg\
  \ /boot/grub2/grub.cfg\n```\n\n**10.** 重启系统并验证更改：\n```bash\nupdate-grub2\n```\n\n\
  ### 内核阶段\n\n`/etc/grub.d/` 目录包含用于构建 `/boot/grub2/grub.cfg` 文件的脚本。`/etc/default/grub`\
  \ 文件包含 GRUB 配置变量。该文件中的设置用于在使用 `grub2-mkconfig` 构建时生成 `/boot/grub2/grub.cfg` 文件。\n\
  \n`/etc/grub.d/` 目录包含在使用 `grub2-mkconfig` 构建时用于 `/boot/grub2/grub.cfg` 文件的脚本（参见图\
  \ 11-5）。脚本按照数字顺序进行处理。\n\n### System V 初始化\n\nSystem V 在它的时代很好用，但 `systemd` 提供的性能和安全特性使得\
  \ System V 过时了。在这里讨论 `systemd` 是为了理解某些概念。\n\n#### Linux 运行级别（Runlevels）\n\n运行级别定义了不同启动运行级别下可的服务和资源。大多数用户环境运行安全的运行级别\
  \ 5，以便用户可以使用浏览器进行工作和研究。许多安全运营中心 (SOC) 运行安全的运行级别 3 版本。\n\n### `inittab` 启动文件\n\n\
  `/sbin/init` 命令使用配置文件 `/etc/inittab` 来初始化系统。`/etc/inittab` 中的配置行具有以下格式。\n\n\n\n\n\
  \n图 11-9 的第 18 行指定了默认运行级别。在本示例中，操作系统将启动到运行级别 `5`。若要更改默认运行级别，可以在运行 System V 时使用编辑器更改该行的数字。\n\
  \n![Images](img/note.jpg)\n\n**注意** 使用 `init` 命令或 `telinit` 命令来更改运行级别。例如，`init 2`\
  \ 将系统切换到运行级别 2。`runlevel` 命令显示之前的运行级别和当前运行级别。`# runlevel 3 5`\n\n## 关闭系统\n\n与任何其他操作系统一样，你需要正确地关闭\
  \ Linux 系统。这可以确保在系统掉电之前，任何挂起的磁盘写入操作都已提交磁盘。\n\n你可以使用多个命令来正确地关闭 Linux 系统，包括以下：\n\n\
  - `init 0` 将系统切换到运行级别 `0`，这会停止系统\n- `init 6` 将系统切换到运行级别 `6`，这会重启系统\n- `halt` 关闭系统\n\
  - `reboot` 重启系统\n\n除了这些命令外，你还可以使用 `shutdown` 命令来关闭或重启系统。与前面的命令相比，它有几个主要优势：\n\n-\
  \ 你可以指定系统在一段时间后关闭。这为你的用户留下了在系统关闭之前保存工作和注出的时间。它还允许你在不在场的情况下在指定时间关闭系统。\n- 它允许你向所有登录的用户发送消息，警告他们有一个待处理的关机任务。\n\
  - 它不允许其他用户在挂起的关机之前登录。\n\n使用 `shutdown` 的语法为 `shutdown +m -h|-r <message>`。`+m` 选项指定关闭系统之前的时间（以分钟为单位）。你也可以使用\
  \ `now` 选项代替 `+m` 来指定系统立即关机。如果你需要系统在特定时间关闭，可以将 `+m` 替换为关机发生的时间（格式为 `hh:mm`）。`-h`\
  \ 选项指定停止系统，而 `-r` 选项指定重启系统。这里显示了使用 `shutdown` 的示例：\n\n![Images](img/f0343-01.jpg)\n\
  \n当你输入此命令时，所有其他登录的用户都会看到以下消息：\n\n![Images](img/f0343-02.jpg)\n\n如果你使用 `shutdown`\
  \ 命令调度了关机，稍后需要取消该关机，请在 shell 提示符输入 `shutdown -c`。\n\n你还可以使用 `wall` 命令向用户发送消息，通知他们系统事件，例如系统重启或运行级别更改。要使用\
  \ `wall`，你必须将消息发送到 `wall` 命令的 `stdin` 中。这里显示了一个示例：\n\n![Images](img/f0343-03.jpg)\n\
  \n## systemd 初始化阶段\n\n传统的 `init` 进程按顺序逐个启动服务。`systemd` 是由 Red Hat 开发人员 Lennart Poettering\
  \ 和 Kay Sievers 创建的系统和服务服务管理器。`systemd` 使用编译过的启动程序而不是脚本，因此它的启动速度比基于 System V 的系统快。此外，`systemd`\
  \ 利用了安全功能，如通用唯一标识符 (UUID) 和可信平台模块 (TPM)，来提高完整性和机密性。\n\n### systemd  文件\n\n`systemd`\
  \ 服务的主配置文件称为 `unit`（单元）。默认单元位于 `/usr/lib/systemd/system/`。修改和自定义的单元包含在 `/etc/systemd/system/`\
  \ 中。`/etc/systemd/system/` 中的单元文件会覆盖 `/usr/lib/systemd/system/` 中的条目。\n\n此处显示的 `systemctl\
  \ -t help` 命令显示了可用单元列表。\n\n![Images](img/f0344-01.jpg)\n\n命令 `systemctl list-units\
  \ --type=<unit_type>` 显示特定类型的所有活动单元。在插图中编辑后的输出显示了命令 `systemctl list-units --type=mount`\
  \ 的结果，它显示了所有类型为 `mount` 的活动单元。添加 `--all` 选项，`systemctl list-units --type=mount --all`\
  \ 同时显示 `mount` 类型的活动和可用单元。\n\n![Images](img/f0344-02.jpg)\n\n单元文件由包含配置指令的段落（stanzas）组成。接下来显示\
  \ `vsftpd.service` 单元文件的内容。`[Unit]` 段落总结了服务并指定了下一步调用哪个阶段。`[Service]` 段落描述了服务应如何启动以及启动哪个应用程序。`[Install]`\
  \ 段落描述了哪种运行状态使单元开始。\n\n![Images](img/f0344-03.jpg)\n\n![Images](img/note.jpg)\n\n\
  **注意** 守护进程名称通常以字母 `d` 结尾。守护的单元类型为 `service`。\n\n`[Unit]` 段落于所有的单元配置文件。它包含了单元的描述和通用单元选项。某些\
  \ `[Unit]` 段落选项在表 11-6 中进行了解释。\n\n![Images](img/f0345-01.jpg)\n\n**表 11-6** `[Unit]`\
  \ 段落指令\n\n`[Service]` 段落包含仅于类型为 `service` 的单元的配置信息。其他单元类型可能有不同的部分。例如，`mount` 单元包含一个\
  \ `mount` 部分。表 11-7 包含了几个 `[Service]` 段落指令。\n\n![Images](img/f0345-02.jpg)\n\n**表\
  \ 11-7** `[Service]` 段落指令\n\n可以通过执行命令 `systemctl show <unit_name>` 查看特定单元的操作参数。\n\
  \n`[Install]` 段落详见表 11-8，它包含了与单元激活相关的指令。由于你正在启动 `vsftpd` 网络服务，你至少需要在 `multi-user.target`\
  \ 目标中启动。该目标将启动网络服务。\n\n![Images](img/f0346-01.jpg)\n\n**表 11-8** `[Install]` 段落指令\n\
  \n#### 挂载单元命名规范\n\n由 `systemd` 控制的挂载点在 `systemd.mount` 协议下配置。`[Mount]` 段落详见表 11-9，它包含了与单元激活相关的指令。挂载单元也可以通过\
  \ `/etc/fstab` 配置，或者可以转换为挂载单元。挂载单元可以包含 `[Unit]` 和 `[Install]` 段落。\n\n![Images](img/f0346-02.jpg)\n\
  \n**表 11-9** `[Mount]` 段落指令\n\n#### 启动依赖关系\n\n要显示一个单元所依赖的单元列表，请执行命令 `systemctl list-dependencies\
  \ <unit_name>`。要显示依赖于某个单元的单元列表，请执行命令 `systemctl list-dependencies --reverse <unit_name>`。\n\
  \n这些命令的输出是一个树形结构，列出了适用的单元。如果单元处于活动状态，左侧将将显示绿色点；如果没有，则显示红点。\n\n#### 查看单元状态\n\n命令\
  \ `systemctl status <unit_name>` 显示单元的操作状态。图 11-10 显示了命令 `systemctl status cups.service`\
  \ 的输出。\n\n![Images](img/F11-10.jpg)\n\n**图 11-10** `systemctl status cups.service`\
  \ 命令的结果\n\n表 11-10 定义了输出中的某些术语。\n\n![Images](img/f0347-01.jpg)\n\n**表 11-10** 单元状态定义\n\
  \n#### 失败单元\n\n要列出所有失败的单元，请执行命令 `systemctl --failed`。要列出特定类型的所有失败单元，请执行命令 `systemctl\
  \ --failed --type=<unit_type>`。\n\n### 服务程序\n\n你可以使用 `systemctl <command> <unit>`\
  \ 语法控制服务。例如，在 Red Hat 类的 Linux 系统上启动 Apache Web 服务器，运行 `systemctl httpd start`。要停止\
  \ SSH 服务器，运行 `systemctl stop sshd`。表 11-11 提供了控制命令列表。\n\n![Images](img/f0347-02.jpg)\n\
  \n**表 11-11** 控制服务\n\n#### 目标\n\n\n\n\n单元（unit）定义了一个特定的服务。`target`（目标）是单元和/或其他目标的组合，用于提供特定的功能。例如，目标\
  \ `network-online.target` 会在网络服务启动之前等待网络处于“启动”状态。目标名称以 `.target` 结尾。命令 `systemctl\
  \ --type=target` 列出所有激活的目标。命令 `systemctl --type=target -all` 列出所有可用的目标。\n\n`systemd`\
  \ 的第一个目标是 `default.target`。文件 `/etc/systemd/system/default.target` 链接到默认运行级别目标文件。你也可以执行命令\
  \ `systemctl get-default` 来显示默认运行级别。表 11-12 显示了 `systemd` 运行级别及其对应的 System V 等效项。\n\
  \n![Images](img/f0348-01.jpg)\n\n**表 11-12** `systemd` 运行级别\n\n要查看当前运行级别，请执行命令 `systemctl\
  \ get-default`。要更改默认运行级别，请输入 `systemctl set-default <runlevel_target>`。要更改当前运行级别，请输入命令\
  \ `systemctl isolate <runlevel_target>`。注意，在切换运行级别时使用 `isolate` 用于停止任何不属于新运行级别的服务。\n\
  \n### 排除服务未及时启动的故障\n\n如果系统遇到启动问题，理解启动过程是非常重要的。错误信息可以让你对故障发生的位置有所线索。请查看表 11-13 的错误列表以及从何处开始故障。\n\
  \n![Images](img/f0349-01.jpg)\n\n**表 11-13** 启动故障排除\n\n### 内核恐慌 (Kernel Panic)\n\
  \n`kernel panic` 也称为 `kernel oops`，是内核在检测到无法恢复的错误时，为了防止数据丢失或损坏的风险而产生的保护措施。Panic\
  \ 的发生由于配置或软件问题；缺失、配置错误或失败的硬件或硬件驱动；或系统资源问题。系统实用程序 `kexec`、`kdump` 和 `crash` 用于存储和排查内核\
  \ panic。这些工具可以在系统安装期间或稍后安装。\n\n当发生内核 panic 时，`kdump` 工具默认情况下会将崩溃转储保存到内存中。`kdump`\
  \ 可能会将转储数据存储在远程机器上。\n\n`kdump` 需要专门留留系统内存来存储内核崩溃信息。内存是在启动过程中通过 GRUB 上的 `crashkernel`\
  \ 指令预留的。预留内存量取决于硬件类型和系统总内存。你也可以调整此设置以自动分配正确数量的内存。\n\n`kexec` 工具从另一个内核启动内核，但不使用 BIOS。这保留了当前的系统状态，你可以使用\
  \ `crash` 命令分析崩溃转储数据。\n\n### 章节复\n\n在本章中，你学习了启动过程。自引导阶段（bootstrap phase）用于初始化系统硬件，我们探索了\
  \ BIOS、UEFI 和 PXE 引导之间的区别。然后我们探索了 GRUB2 引导程序的配置。你学习了如何配置引导程序并在交互模式下使用它。我们通过讨论内核和根文件系统如何加载继续了启动过程。最后，我们回顾了\
  \ System V 和 `systemd` 初始化过程，以及如何控制服务。\n\n- 在引导阶段，计算机的 BIOS 芯片拥有系统的控制权。\n- BIOS\
  \ 使用上电自检（POST）程序测试系统硬件，然后找到带有启动文件的存储设备。\n- BIOS 将系统的控制权交给引导程序。\n- 引导程序指向并加载临时内核。\n\
  - BIOS 引导程序的第一阶段存在于引导设备的主引导记录（MBR）中，或驱动器上的启动分区中。\n- Linux 内核位于 `/boot`，命名为 `vmlinuz-version.gz`\
  \ 或 `vmlinux`。\n- `/boot` 是 GRUB2 的根目录。\n- 你可以为 GRUB2 菜单添加加密密码以限制访问。\n- GRUB2 使用的配置文件如下：\n\
  \    - `/boot/grub/grub.cfg` 文件\n    - `/etc/grub.d` 目录下的文件\n    - `/etc/default/grub`\
  \ 文件\n- 使用 GRUB2，`menu.lst` 文件已被 `/boot/grub2/grub.cfg` 文件取代。\n- GRUB2 配置存储在 `/etc/grub.d`\
  \ 目录中的几个脚本文件中。\n- 在修改 GRUB2 配置后，必须运行命令 `grub2-mkconfig -o <output_file>`。\n- Linux\
  \ 定义了七个运行级别（0–6）：\n    - **0**: 停止系统。\n    - **1**: 以单用户模式运行 Linux。\n    - **2**:\
  \ 以多用户模式作为网络客户端运行 Linux，仅限命令行界面。\n    - **3**: 以多用户模式作为网络服务器运行 Linux，仅限命令行。\n  \
  \  - **4**: 未使用。\n    - **5**: 以多用户模式作为网络服务器运行 Linux。使用图形用户界面。\n    - **6**: 重启系统。\n\
  - 如今大多数 Linux 发行版已从 `init` 迁移到 `systemd`。\n- `systemd` 使用使用目标概念，其功能类似于运行级别。\n- 传统的\
  \ `init` 运行级别在此显示及其对应的 `systemd` 启动目标文件：\n    - runlevel 3 = `multi-user.target`\
  \ 或 `runlevel3.target`\n    - runlevel 5 = `graphical.target` 或 `runlevel.target`\n\
  \n### 问题\n\n**1** BIOS 在启动期间的作用是什么？\nA. 它测试系统。\nB. 它创建一个 `initrd` 镜像。\nC. 它定位存储设备。\n\
  D. 它让你选择操作系统。\nE. 它指向内核。\n\n**2** 你的引导程序可以存在于哪里？（选择两个。）\nA. 在 BIOS 中\nB. 在 `initrd`\
  \ 镜像中\nC. 在存储设备中\nD. 在启动分区中\nE. 在系统中\n\n**3** Linux 位于哪里？\nA. 在 `/boot` 中\nB. 在\
  \ MBR 中\nC. 在 `/proc` 中\nD. 在 `/kernel` 中\n\n**4** 你想将 GRUB2 安装到第一个硬盘上的第一个分区。哪个命令可以实现？\n\
  A. `grub /dev/sda1`\nB. `grub-install /dev/sda1`\nC. `grub-install /dev/sda`\nD.\
  \ `grub /dev/hda1`\n\n**5** 哪个命令会在 Red Hat 类系统上启动 Apache？\nA. `systemctl httpd`\n\
  B. `systemctl apache`\nC. `systemctl apache2`\n\n**6** 下列哪个配置文件*没有*被 GRUB2 使用？\n\
  A. `/boot/grub/grub.cfg`\nB. `/etc/grub.d`\nC. `/etc/default/grub`\nD. `/boot/grub/menu.lst`\n\
  \n**7** 哪个 GRUB2 配置脚本文件可以检测到与 Linux 在同一块硬盘上的 Windows 安装？\nA. `00_header`\nB. `10_linux`\n\
  C. `30_os_prober`\nD. `40_custom`\n\n**8** `/etc/default/grub` 中的哪个配置参数指定了用户在默认操作系统启动之前，从\
  \ GRUB 菜单进行选择的时间长度？\nA. `GRUB_TIMEOUT`\nB. `GRUB_DEFAULT`\nC. `GRUB_SAVED DEFAULT`\n\
  D. `GRUB_HIDDEN_TIMEOUT`\n\n**9** 哪个运行级别默认使用图形用户界面？\nA. 2\nB. 3\nC. 4\nD. 5\n\n\
  **10** 哪些运行级别默认使用命令行用户界面？（选择两个。）\nA. 0\nB. 2\nC. 3\nD. 5\nE. 4\n\n\n\n\n### 11.\
  \ 哪个文件用于设置使用 `init` 守护进程的 Linux 默认运行级别（runlevel）？\n\n**A.** `/etc/inittab`\n\n**B.**\
  \ `/etc/runlevel.conf`\n\n**C.** `/etc/init.conf`\n\n**D.** `/etc/sysconfig/init`\n\
  \n### 12. 哪个命令可以在系统运行时切换运行级别？\n\n**A.** `runlevel`\n\n**B.** `chrun`\n\n**C.** `mode`\n\
  \n**D.** `init`\n\n### 13. 你的 Linux 系统使用 `systemd` 而不是 `init`。你需要将系统切换到运行级别 3。你应该使用哪条命令？\n\
  \n**A.** `systemctl isolate graphical.target`\n\n**B.** `systemctl isolate multi-user.target`\n\
  \n**C.** `systemctl isolate runlevel5.target`\n\n**D.** `systemctl isolate nongraphical.target`\n\
  \n### 答案\n\n- **[1] A, C.** BIOS 在 POST 例程期间测试你的系统硬件，然后找到可启动的存储设备。\n- **[2] C, D.**\
  \ Linux 引导程序可以存储在存储设备的 MBR 中，也可以存储在磁盘的可启动分区中。\n- **[3] A.** Linux 内核存在于文件系统的 `/boot`\
  \ 目录。\n- **[4] B.** `grub2-install /dev/sda1` 命令将 GRUB2 安装到第一块硬盘的第一个分区上。\n- **[5]\
  \ A.** 在 RedHat 类系统上启动 Apache Web 服务器，请运行 `systemctl start httpd`。在 Debian 类系统上，运行\
  \ `systemctl start2`。\n- **[6] D.** `/boot/grub/menu.lst` 文件由 GRUB Legacy 使用。GRUB2\
  \ 不使用它。\n- **[7] C.** `30_os_prober` GRUB2 脚本可以检测安装在同一台系统上的其他操作系统（如 Windows）。它可以使用找到的信息在\
  \ GRUB 菜单中添加菜单项，用以启动这些操作系统。\n- **[8] A.** `GRUB_TIMEOUT` 参数用于 GRUB2，用于指定在启动默认操作系统之前，用户在\
  \ GRUB 菜单中进行选择的时间。\n- **[9] D.** 运行级别 5 默认使用图形界面。\n- **[10] B, C.** 运行级别 2 和 3 默认使用命令行界面。\n\
  - **[11] A.** `/etc/inittab` 文件用于设置 Linux 系统的默认运行级别。\n- **[12] D.** `init` 命令可以在系统运行时切换运行级别。\n\
  - **[13] B.** `systemctl isolate multi-user.target` 命令将系统切换到等同 `init` 运行级别 3 的 `systemd`\
  \ 目标。\n\n# 第 12 章 在 Linux 下管理硬件\n\n在本章中，你将学习：\n- 发现设备\n- 管理模块\n- 引用用户空间\n- 配置设备\n\
  - 配置蓝牙\n- 配置 Wi-Fi\n- 配置存储\n\n在本章中，我们将探讨硬件是如何被发现并提供给应用程序的。\n\n## 发现设备\n\n启动过程的一部分是发现硬件。发现过程从搜索总线开始。当发现设备时，会对其属性进行命名，以便应用程序可以使用。\n\
  \n在本节中，你将使用以下方法发现设备：\n- 使用 `dmesg` 显示内核形缓冲区\n- 使用 `lsusb` 探测 USB 设备\n- 使用 `lspci`\
  \ 检测 PCI 设备\n\n表 12-1 包含了我们将使用的设备术语。\n\n#### 使用 `dmesg` 显示内核形缓冲区\n\n`dmesg` 命令用于读取、显示和控制内核形缓冲区。形缓冲区是一个特定大小的循环空间，包含内核日志。一旦缓冲区空间用尽，数据将被覆盖。在许多情况下，形缓冲区中的日志将由\
  \ `syslog` 设施处理。\n\n要搜索 `dmesg` 形缓冲区，使用 `syslog` 设施和优先级名称（见表 12-2）。`syslog` 日志工具将在第\
  \ 16 章详细介绍。\n\n`dmesg` 使用“级别”（level）一词来描述 `syslog` 优先级。\n\n```\ndmesg -T -f kern\
  \ -l notice | grep sdb\n```\n\n图 12-1 中的命令显示了形缓冲区所有内核设施（`-f` 或 `--facility`）为 notice\
  \ 级别（`-l` 或 `--level`）且包含字符串 `sdb` 的消息。`-T` 选项显示消息的时间戳。\n\n图 12-2 说明了 USB 闪存在在发现过程期间内核日志条目。\n\
  \n表 12-3 显示了三个 `dmesg` 命令选项。图 12-3 的第 1 行说明了如何通过添加 `grep` 命令来搜索特定对象：\n\n```\ndmesg\
  \ | grep usb\n```\n\n#### 使用 `lsusb` 探测 USB 设备\n\n`lsusb -t` 命令产生 USB 集线器及其连接设备的层级视图。图\
  \ 12-4 的第 1 行和第 5 行显示了 USB 集线器、驱动程序和传输速度。`12M` 表示每秒 12 兆（USB 1.0），`480M` 表示每秒 480\
  \ 兆（USB 2.0）。第 3 行、第 4 行和第 6 行显示了已连接的设备。\n\n\n\n\n`lsusb` 输出中的 ID 包含两个字段中：`<manufacturer>:<device_id>`。如果你查看网站\
  \ [www.linux-usb.org/usb.ids](http://www.linux-usb.org/usb.ids) 上的表格（如图 12-6 所示），你会发现\
  \ 930 是东芝公司 (Toshiba Corp.) 的厂商 ID，而设备 ID 6545 是金士 DataTraveler 闪存。\n\n![Images](img/F12-06.jpg)\n\
  \n**图 12-6** USB 设备 ID 示例\n\n你可以执行以下命令语法获取额外信息：\n\n![Images](img/f0358-02.jpg)\n\
  \n例如，命令 `lsusb -D /dev/bus/usb/001/002` 的输出显示了关于该闪存的额外信息（参见图 12-7）。\n\n![Images](img/F12-07.jpg)\n\
  \n**图 12-7** `lsusb -D` 输出（为了简洁经过编辑）\n\n### 使用 `lspci` 检测 PCI 设备\n\n外设部件互连 (PCI)\
  \ 是一种定义 PCI 总线实现的系统规范。该总线支持 32 位或 64 位寻址以及 Ultra DMA 突发模式，并可以自动检测 PCI 外设卡。多个 PCI\
  \ 总线可以通过桥器连接。\n\nPCI 将每个系统的总线数量限制为 256 条。每个总线可以支持 32 个设备。较大的系统可能需要额外的 PCI 总线。这通过使用域（domains）来实现。\n\
  \nPCI 总线是一种层次结构（如图 12-8 所示），从顶层总线 (`0`）开始。\n\n![Images](img/F12-08.jpg)\n\n**图 12-8**\
  \ PCI 层次结构\n\n`lspci` 命令的输出格式为 `Bus:Device:Function` `Class Vendor` `Name`。\n\n\
  ![Images](img/note.jpg)\n\n**注意** 在执行 `lspci` 命令时，`-D` 选项显示域号，`Domain:Bus:Device:Function`。如果未使用\
  \ `-D` 选项，则域假设为 `0000`。\n\n图 12-9 显示了 `lspci` 命令的编辑输出。第 1 行显示位于总线 `02` 的第一个设备 (`00`)。该设备是由\
  \ VMware 制造的 USB 控制器，名称为 USB1.1 UHCI Controller。第 2–4 行显示位于总线 `02` 的其他三个设备。\n\n\
  ![Images](img/F12-09.jpg)\n\n**图 12-9** `lspci` 命令的输出\n\n设备类、厂商和设备名称以数值的形式存储。这些信息可以在\
  \ `/usr/share/hwdata/pci.ids` 中找到。设备类存储在文件的末尾。\n\n注意图 12-10 中的第 3 行，USB 控制器的类 ID\
  \ 为 `0c03`，设备的厂商信息 (`<vendor:device>`) 为 `15ad` (VMware)：`0770` (USB2 EHCI Controller)。\n\
  \n![Images](img/F12-10.jpg)\n\n**图 12-10** 使用 `lspci` 查看厂商和类 ID\n\n`-v` 和 `-vv`\
  \ 选项显示额外的总线信息，如图 12-11 所示。\n\n![Images](img/F12-11.jpg)\n\n**图 12-11** `lspci` 的\
  \ `-v` 和 `-vv` 选项\n\n在图 12-12 中，我们结合 `-t` 和 `-v` 选项。`-t` 选项显示树结构，`-v` 选项打印更详细的信息。\n\
  \n![Images](img/F12-12.jpg)\n\n**图 12-12** `lspci` 的 `-t` 和 `-v` 选项\n\n#### 主总线适配器\n\
  \n主机总线适配器 (HBA)，也称为主机适配器或主机控制器，是一种用于通过单个控制器将多个设备连接到计算机系统的扩展卡。以下是主机适配器的一些示例：\n\n\
  • IDE、SCSI 和 SATA 控制器\n• iSCSI 和光纤控制器\n• 网络控制器\n\n要查看 HBA 适配器，执行命令 `lspci -nn |\
  \ grep -i hba` 或命令 `systool -c <adapter_class>`。你也可以在 `/sys/class` 中查找信息。\n\n###\
  \ 管理内核模块\n\n与其他大多数操作系统一样，你可以手动列出、加载或卸载 Linux 内核模块。要查看所有当前加载的内核模块，使用 `lsmod` 命令。该命令从\
  \ `/proc/modules` 文件中提取数据并重新格式化为人类可读表格。要使用此命令，只需在 shell 提示符下输入 `lsmod`，如下例所示：\n\n\
  ![Images](img/f0358-02.jpg)\n\n```\nlsmod\n```\n\n\n\n\n`options module_name options`\
  \ 为 `modprobe` 提供了一系列选项，例如 `irq=` 和 `io=`，这些选项在加载特定内核模块时会被使用。\n\n如果你需要卸载当前加载的内核模块，请在\
  \ shell 提示符处使用 `rmmod <module_name>`。请注意，如果模块服务的设备正在使用中，则该命令无法运行。与 `insmod` 类似，`rmmod`\
  \ 不考虑模块依赖关系，因此这些依赖会被忽略。要删除模块并考虑依赖关系，请运行 `modprobe –r <module_name>` 来使用 `modprobe`。\n\
  \n接下来，在练习 12-1 中练习内核模块。\n\n## 练习 12-1：操作内核模块\n\n在此练习中，你将练习查看内核模块信息。你可以使用书中附带的虚拟机进行此练习。运行\
  \ `snapshot 12-1` 以获得配置正确的环境。\n\n![Images](img/video.jpg)\n\n**视频** 请观看练习 12-1 视频，演示如何执行此任务。\n\
  \n完成以下操作：\n\n1. 启动你的 Linux 系统并以 `student` 用户身份登录。\n2. 打开终端会话。\n3. 输入 `su –` 命令切换到你的\
  \ `root` 用户账户。\n4. 在 shell 提示符处输入 `lsmod | less` 查看系统内核模块的状态。\n5. 翻页内核模块列表。完成后，按\
  \ `q`。\n6. 在 shell 提示符处输入 `modinfo parport` 查看关于 `parport` 内核模块的信息。\n7. 在 shell\
  \ 提示符处输入 `depmod` 创建模块依赖列表。\n8. 使用 `less` 或 `more` 实用查看你刚刚在 `/lib/modules/$(uname\
  \ -r)/` 中构建的依赖文件 `modules.dep`。字符串 `$(uname -r)` 列出了内核版本，并在第 13 章 中有详细解释。\n9. 在\
  \ shell 提示符处输入 `lsmod | grep joydev`。你应该会在输出行中看到一个 `0`，表示模块已加载但硬件未被使用。\n10. 在 shell\
  \ 提示符处输入 `rmmod joydev` 移除 `joydev` 模块。\n11. 在 shell 提示符处再次输入 `lsmod | grep joydev`\
  \ 验证 `joydev` 内核模块是否已卸载。你应该看不到任何输出列表，表示模块未加载。\n12. 在 shell 提示符处输入 `modprobe joydev`\
  \ 重新加载摇杆模块。\n13. 再次在 shell 提示符处输入 `lsmod | grep joydev`。你应该再次在输出行中看到一个 `0`，表示模块已加载但硬件未被使用，如下：\n\
  \n![Images](img/f0364-01.jpg)\n\n## 引用内核与用户空间\n\n为了保护内核信息不受干扰，系统内存被分为内核空间和用户空间。内核内存仅供内核访问，而用户内存供用户和应用程序访问。某些内核数据通过\
  \ `/proc` 和 `/sys` 等目录提供给用户，USB 设备可以通过 `udev` 进行自定义。\n\n### `/sys` 和 `sysfs`\n\n\
  `sysfs` 文件系统是一个挂载在 `/sys` 目录上的内存文件系统。`sysfs` 文件系统为用户空间提供了系统硬件和文件系统的属性以及动态运行统计数据。\n\
  \n![Images](img/note.jpg)\n\n**注意** 不要将 `/sys` 与 `/proc/sys` 混淆。`/proc/sys` 包含内核参数，可以通过更改\
  \ `/proc/sys` 目录中的条目（临时更改）或 `/etc/sysctl.conf` 文件（永久更改）进行操作。\n\n启动时，Linux 内核模块通过扫描每个系统总线检测并初始化设备。设备制造商为每个设备分配厂商名称和设备\
  \ ID。Linux 内核根据厂商名称和设备 ID 为设备分配主设备号和次设备号。\n\n随后，内核在 `/sys` 中创建一个目录。每个目录包含子目录（参见表\
  \ 12-4），包含设备属性。表 12-5 列出了某些设备属性目录。\n\n![Images](img/f0365-01.jpg)\n\n**表 12-4**\
  \ `/sys` (`sysfs`) 目录\n\n![Images](img/f0365-02.jpg)\n\n**表 12-5** `sys` 设备属性目录\n\
  \n#### `block`\n\n`block` 目录包含每个系统块设备的条目。`lsblk` 命令使用这些信息（参见图 12-13）。\n\n![Images](img/1213.jpg)\n\
  \n**图 12-13** `lsblk` 命令的输出\n\n`block` 目录中的条目是 `/sys/devices` 目录的符号链接（参见图 12-14）。`block`\
  \ 设备目录包含设备的运行信息（参见图 12-14 中的第 11–15 行）。\n\n![Images](img/1214.jpg)\n\n**图 12-14**\
  \ `/sys/block` \n\n![Images](img/note.jpg)\n\n**注意** 关于图 12-14 的详细视图，请从本书的在线内容下载全分辨率图像。\n\
  \n你也可以使用 `systool` 命令检查系统总线。`systool` 命令是 `sysfsutil` 包的一部分，默认情况下未安装。执行 `systool`\
  \ 命令会显示支持的总线、类和模块列表。你的系统中安装了此包。图 12-15 演示了使用 `systool -c block` 命令显示块设备。`-p` 显示块设备的路径。\n\
  \n![Images](img/1215.jpg)\n\n**图 12-15** `systool -c block`\n\n![Images](img/note.jpg)\n\
  \n**注意** 图 12-15 为了简洁进行了编辑。\n\n#### `bus`\n\n总线是一种用于设备之间传输数据的系统设备。`/sys/bus` 目录包含所有系统总线的运行统计。图\
  \ 12-16 中的第 1–6 行显示了不同的总线类型。图 12-16 的第 12–14 行，你可以看到 `/sys/usb` 中的文件。\n\n![Images](img/1216.jpg)\n\
  \n**图 12-16** `/sys/bus`\n\n`/sys/bus/` 中的每个目录都包含设备和驱动目录。`device` 目录（图 12-16 中的第\
  \ 21–25 行）包含总线上发现的设备条目。这些文件大部分是 `/sys/devices/` 目录的符号链接。\n\n`drivers` 目录（图 12-16\
  \ 中的第 30–36 行）包含总线上所有发现设备的驱动信息。\n\n你也可以使用 `systool -pb scsi` 命令显示 SCSI 总线信息。图 12-17\
  \ 显示 SCSI 总线的实例（`-b scsi`）和路径（`-p`）。\n\n![Images](img/1217.jpg)\n\n**图 12-17** 使用\
  \ `systool` 显示总线设备\n\n#### `class`\n\n设备类包含执行相似操作的设备，例如块设备（block device）。图 12-18\
  \ 展示了在 `/sys/class` 中找到的内容。\n\n![Images](img/1218.jpg)\n\n**图 12-18** `/sys/class`\n\
  \n### `udev`\n\n`udev` 代表 `userspace /dev/`。`/dev/` 目录提供对系统设备的访问。内核模块检测到设备并在 `/sys/`\
  \ 中相应条目后，会生成一个 `uevent`。`udev` 服务 `systemd-udevd.service` 响应 `uevent` 并匹配 `/sys/`\
  \ 中的设备属性到 `udev` 配置规则，从而确保设备配置在系统重启后依然持久有效。\n\n##### `udev` 规则的位置\n\n`udev` 规则位于\
  \ `/lib/udev/rules.d`（系统默认规则）和 `/etc/udev/rules.d`（自定义规则）。在图 12-19 中，你可以看到每个规则都以数字开头，然后是短名称。`udev`\
  \ 守护进程按字典顺序搜索规则（数字在前，然后是短名称）。后面的规则（数字较大）可以覆盖较早的规则。\n\n![Images](img/1219.jpg)\n\n\
  **图 12-19** `/lib/udev/rules.d` 目录\n\n\n\n\n\n图 12-20 显示了规则 `60-persistent-storage.rules`\
  \ 的部分，该规则为磁盘设备在 `/dev/` 创建 `by-label`、`by-uuid`、`by-id`、`by-partlabel` 和 `by-partuuid`\
  \ 。\n\n![Images](img/F12-20.jpg)\n\n**图 12-20** 持久存储规则示例\n\n注意 `/lib/udev/rules.d`（图\
  \ 12-19 第 13 行）和 `/etc/udev/rules.d`（图 12-21 第 5 行）中的 `99-vmware-scsi-udev.rules`\
  \ 项。这告诉我们 `/lib/udev/rules.d` 中的默认规则已经过自定义，`udev` 将使用 `/etc/udev/rules.d` 中的规则而不是\
  \ `/lib/udev/rules.d` 中的规则。\n\n![Images](img/F12-21.jpg)\n\n**图 12-21** `/etc/udev/rules.d`\n\
  \n### `udevadm`\n\n`udevadm` 是一个用于管理和获取系统设备信息的实用程序。\n\n### `udevadm info`\n\n`udevadm\
  \ info` 命令（见图 12-22）在 `udev` 数据库中搜索设备信息。该命令的格式如下：\n\n![Images](img/F12-22.jpg)\n\
  \n**图 12-22** `udevadm info` 命令示例\n\n![Images](img/f0369-04.jpg)\n\n或\n\n![Images](img/f0369-05.jpg)\n\
  \n表 12-6 列出了 `udevadm info` 的查询类型。\n\n![Images](img/f0370-02.jpg)\n\n**表 12-6**\
  \ `udevadm` 信息查询类型\n\n`udevadm info` 的属性遍历（walk）选项（`-a`）可能帮助你排排除故障。它的输出将显示设备及其属性，以及所有父设备的属性。该命令示例为\
  \ `udevadm -a --name=/dev/sda`。\n\n### `udevadm monitor`\n\n`udevadm monitor` 命令监听\
  \ `uevents` 并将其显示在控制台上。默认情况下，`udevadm monitor` 会显示内核的 `uevent` 和 `udev` 进程。\n\n\
  你可以将输出限制为内核 `uevents`（`-k` 或 `--kernel`）或 `udev` 事件（`-u` 或 `--udev`）。此外，选项 `-p`\
  \ 将显示与事件相关的设备属性。\n\n### `udevadm control`\n\n`udevadm control` 命令用于控制 `systemd-udevd.service`。\n\
  \n### 创建 `udev` 规则\n\n`udev` 规则用于将某个 `uevent` 与某些操作相匹配。你通过使用逗号分隔的键/值对来创建规则。这些键可以是匹配键（match\
  \ keys），也可以是赋值键（assign keys）。\n\n记住，`udev` 规则按优先级（从低数字到高数字）读取。在最初创建规则时，请使用命令行。一旦完成规则，在将其添加到\
  \ `/etc/udev/rules.d` 之前请测试规则。\n\n`udev` 规则支持以下通配符：\n\n![Images](img/f0371-02.jpg)\n\
  \n`udev` 支持替换，例如 `$(pwd)`，并维护了一个内置的替换字符串列表，列在表 12-7 中。\n\n![Images](img/f0371-01.jpg)\n\
  \n**表 12-7** `udev` 内置替换\n\n在为设备创建规则之前，你必须知道它的属性。执行 `udevadm info` 命令可以让你显示设备属性。在图\
  \ 12-22 中，我执行了命令 `udevadm info -q property -n /dev/sdb` 来查看驱动器的属性。\n\n![Images](img/note.jpg)\n\
  \n**注意** 本章中的示例使用了枚举为 `/dev/sdb` 的 DataTraveler 闪存盘。\n\n### 匹配键 (Match Keys)\n\n\
  匹配键用于匹配规则生效时必须存在的条件。表 12-8 回顾了一些匹配键。\n\n![Images](img/f0372-01.jpg)\n\n**表 12-8**\
  \ `udev` 规则匹配键\n\n在对带有值的键进行匹配时，你使用表 12-9 中的运算符之一。值必须包含在双引号（`\" \"`）中。\n\n![Images](img/f0372-02.jpg)\n\
  \n**表 12-9** `udev` 匹配运算符\n\n以下键/值对将匹配我们的设备，即 DataTraveler 闪存盘：\n\n![Images](img/note.jpg)\n\
  \n**注意** `udev` 要求每行一条规则。如果规则超过单行，请使用 `\\` 连接并多行，这被称为命令行扩展（在第 1 章中讨论）。\n\n![Images](img/f0372-03.jpg)\n\
  \n也可以写成如下：\n\n![Images](img/f0372-04.jpg)\n\n或者可能像这样写：\n\n![Images](img/f0372-05.jpg)\n\
  \n### 赋值键 (Assign Keys)\n\n一旦匹配了设备，你就可以表 12-10 中的赋值运算符和表 12-11 中的赋值键分配值。\n\n![Images](img/f0372-06.jpg)\n\
  \n**表 12-10** `udev` 赋值运算符\n\n![Images](img/f0373-01.jpg)\n\n**表 12-11** `udev`\
  \ 赋值键\n\n赋值键用于向设备添加操作或值。\n\n一旦你完成了规则，就需要对其进行测试。`udevadm test --action <udev_rule>`\
  \ 命令将在不实施规则的情况下测试规则。如果没有显示错误消息，则说明规则没有功能性错误。\n\n当添加或更改规则时，`udev`会自动检测规则文件的变化。因此，大多数更改将立即发生。现有设备可能需要执行\
  \ `udevadm control --reload` 命令才能应用规则更改。\n\n## 配置硬件设备\n\n在本节中，你将学习用于配置硬件设备的通用元素和命令。以下内容供你参考。\n\
  \n### `lsdev`\n\n`lsdev` 命令显示已安装硬件的信息。`lsdev` 从 `/proc/interrupts`、`/proc/ioports`\
  \ 和 `/proc/dma` 获取信息并显示以下列：\n\n* `Device`（设备）\n* `DMA`\n* `IRQ`\n* `I/O Ports`（I/O\
  \ 端口）\n\n图 12-23 显示 `lsdev` 命令的输出。`lsdev` 命令列出了关于 DMA、IRQ、可编程中断等的数据，如在后续小节中讨论。\n\
  \n![Images](img/F12-23.jpg)\n\n**图 12-23** `lsdev`（为了简洁编辑了输出）\n\n#### DMA\n\n直接内存访问（DMA）允许设备直接传输数据，而不需要\
  \ CPU 控制传输。\n\nDMA 在主板上通过 DMA 控制器芯片（DCC）实现。DCC 有四根引脚连接到内存控制器芯片（MCC）。这些引脚中的每一根都被称为\
  \ `DMA channel`（DMA 通道）。两个 DCC 芯片可以通过第一块芯片上的通道 0 和第二块芯片上的通道 4 联在一起（级联），如图 12-24\
  \ 所示。每个通道只能分配一个设备。默认情况下，通道 1 和 2 被预留。\n\n![Images](img/F12-24.jpg)\n\n**图 12-24**\
  \ DMA 控制器\n\nUltra DMA 是允许设备跳过 DMA 控制器并以 33 或 66 Mbps 的突发传输数据的方法。（普通 DMA 传输速度约为\
  \ 7.2 Mbps。）\n\n文件 `/proc/dma`（见图 12-25）显示激活的 DMA 通道。（显示的 `cascade` 条目仅仅是一个占位符，说明通道\
  \ 4 驱动程序可用。）\n\n![Images](img/F12-25.jpg)\n\n**图 12-25** `/proc/dma`\n\n### 中断\n\
  \n每个设备都分配一个中断。每个中断根据其关联设备的重要性分配一个优先级（中断请求级别）。\n\n**可编程中断控制器** 每个可编程中断控制器（PIC）可以管理\
  \ 8 个中断。设备的中断请求线电学连接到 PIC 的一个中断线上。\n\n使用 PIC 芯片的系统有一个 PIC（主）管理中断 0–7，以及另一个 PIC（从片）管理中断\
  \ 8–15。\n\n配置为使用中断 2 的设备使用中断 9。中断 9 用于外设或 SCSI 主适配器。中断 2 用于从片 PIC 向主 PIC 信号。主 PIC\
  \ 连接到 CPU。\n\n**高级可编程中断控制器** 高级可编程中断控制器（APIC）具有额外的额外的中断用于管理 PCI 中断，并可以支持 255 条物理中断请求线。该系统由本地\
  \ APIC (LAPIC) 和 I/O APIC 组成。\n\n![Images](img/note.jpg)\n\n\n\n\n\n**注意** 很容易将\
  \ `APIC`（高级可编程中断控制器）与 `ACPI`（高级配置和电源接口）混淆。\n\n`LAPIC` 内置于 CPU 内部，用于接收和产生中断。`I/O\
  \ APIC` 包含一个表，该表将中断请求定向到一个或多个 `LAPICs`。\n\n如果系统具备 `APIC` 能力，但 `grub.conf` 包含 `noapic`\
  \ 条目，则系统将使用 `PIC`。\n\n`/proc/interrupts` 见图 12-26 显示了文件 `/proc/interrupts` 经过编辑的输出，该文件包含以下信息：\n\
  \n![Images](img/F12-26.jpg)\n\n**图 12-26** `/proc/interrupts`（为了简起经过编辑）\n\n* 中断号。\n\
  * 中断请求的次数（每个 CPU）。如果系统包含多个 CPU，则每个 CPU 都会有一列。\n* 中断的类型。\n* 中断名称。\n\n### 中断请求通道\n\
  \n你需要熟悉的第一个系统资源是中断请求通道。中断请求通道也被称为 `IRQs` 或简单的 `interrupts`。\n\n当设备安装在 PC 系统时，它需要某种方式让\
  \ CPU 知道它何时需要关注。你 PC 中的许多设备需要大量的 CPU 时间；其他设备仅偶尔需要 CPU。我们需要一种方法来确保忙碌设备获得它们所需的关注，而不会在不需要那么多的设备上浪费时间。这是通过中断实现的。\n\
  \n你系统中的 CPU 有一根线称为中断（`INT`）线。如果在该电线上施加电流，CPU 将停止正在执行的工作并服务在电线上施加电流的设备。如果电线上没有电流，CPU\
  \ 将继续处理分配给它的任何处理任务。\n\nPC 中的中断系统与典型的教室非常相似。在教室环境中，老师通常向学生展示她所准备的材料。如果学生有问题，他可以举手并中断老师的讲解。在回答问题后，老师继续讲解。\n\
  \nPC 中断的工作方式非常相似。就像老师一样，CPU 忙于自己的事务，直到被中断。一旦被中断，CPU 就会将注意力转向引发中断的设备。一旦设备的请求得到满足，CPU\
  \ 就会回到之前正在做的事情。\n\n使用中断的优势是 CPU 仅在系统设备需要时才对其服务。它不会在空闲设备上浪费处理时间。\n\n`PIC` 芯片连接到 CPU\
  \ 上的 `INT` 线以及主板扩展总线上的中断线。当设备需要关注时，它向其中断线施加电流。`PIC` 被此事件触发并向 CPU 的 `INT` 线施加电流。CPU\
  \ 确认中断，然后 `PIC` 告诉 CPU 激活了哪个中断号。CPU 就可以服务设备。\n\n早期的 PC 只有八个中断和一个关联的 `PIC`。然而，现代\
  \ PC 有多得中断。新的系统使用高级可编程中断控制器（`APIC`）芯片，支持多 255 条 `IRQ` 线。\n\n在处理中断时，你应该记住以下重要事实：\n\
  \n* PC 中的每个设备都必须分配一个中断。\n* 两个 `PCI` 设备可以共享中断。\n* 某些系统设备默认分配了中断。其中一些可以更改或禁用，但许多不能：\n\
  \    * `IRQ 0`：系统定时器\n    * `IRQ 1`：键盘\n    * `IRQ 3`：COM 2\n    * `IRQ 4`：COM 1\n\
  \    * `IRQ 5`：LPT 2\n    * `IRQ 6`：软驱器\n    * `IRQ 7`：LPT 1\n    * `IRQ 8`：实时时钟\n\
  * 中断 `0`、`1` 和 `8` 是硬连的。在任何情况下你都不能将这些中断用于系统的任何其他设备。\n* 如果没有安装带有中断的设备，它是禁用的。\n\n\
  #### 输入/输出地址\n\n输入输出（`I/O`）地址有很多名称。你可能会听到它们 `I/O ports`、`port` 或简单的 `ports`。`I/O\
  \ port` 是硬件地址。`/proc/interrupts` 文件 见图 12-27 显示了 `I/O` 端口列表。\n\n![Images](img/F12-27.jpg)\n\
  \n**图 12-27** `/proc/interrupts`（为了简起经过编辑）\n\n`I/O` 地址的工作方式相同。它们充当邮箱。要与设备通信，必须知道其\
  \ `I/O` 地址。可以使用 `lshw`（列出硬件）命令显示详细的硬件信息。`lshw` 是已弃用的 `hwinfo` 命令的替代品，应以 `root` 权限执行。\n\
  \n`lshw` 的语法为 `lshw <format> <options>`。`lshw` 的输出是从顶部开始的系统详细描述。\n\n在 图 12-28 中，我使用了短格式（`lshw\
  \ -short`）。此选项显示了硬件路径（总线地址）、设备名称、类和存储路径。\n\n![Images](img/F12-28.jpg)\n\n**图 12-28**\
  \ 使用 `-short` 输出的 `lshw`\n\n**注意** `lshw` 命令需要格式 `-businfo` 来显示总线地址。额外的格式选项有 `-html`\
  \ 和 `-xml`。当使用这些格式之一时，输出必须重定向到文件。\n\n通过添加选项 `-class <class_name>`，我们可以让输出专注于特定类或多个类的设备。\n\
  \n命令 `lshw -short -class storage`、`lshw -short -class disk` 和 `lshw -short -class\
  \ volume`（如 图 12-29 所示）分别显示 `storage`、`disk` 和 `volume` 类设备的硬件信息。\n\n![Images](img/F12-29.jpg)\n\
  \n**图 12-29** 使用 `lshw` 显示设备详情\n\n命令 `lshw -html -short -class volume > lshw_html_out`\
  \ 将产生一个 HTML 格式的文件。在 图 12-30 中，我使用 Firefox 显示输出。\n\n![Images](img/F12-30.jpg)\n\n\
  **图 12-30** 格式化为 HTML 输出的 `lshw`\n\n\n\n\n\n# 练习 12-2：发现设备\n\n本练习复习了你过的某些查看块设备的工具。\n\
  \n![Images](img/video.jpg)\n\n**视频** 请观看练习 12-2 视频，以演示如何执行此任务。\n\n1. 通过执行 `lsblk`\
  \ 命令查看系统上的块设备。\n2. 现在通过执行 `ls -l /sys/block` 命令查看 `/sys` 中的块设备条目。\n3. 你也可以使用 `systool\
  \ -c block` 命令查看系统块设备。\n4. 你知道总线（bus）是一种设备。通过执行 `ls /sys/bus/scsi/devices` 或 `systool\
  \ -b scsi` 命令查看 SCSI 总线设备。\n5. 命令 `lspci -t | more` 将显示 PCI 总线层级结构。添加 `-v` 选项（`lspci\
  \ -tv | more`）将添加有关设备的信息。\n6. 在创建 `udev` 规则之前，你可能想要查看设备的属性。例如，要显示设备 `/dev/sda` 的属性，你可以执行此命令：`udevadm\
  \ info -q property -n /dev/sda`。\n7. 通过执行 `cat /proc/dma` 命令显示活动 DMA 通道。\n8. 查看中断请求统计，请查看文件\
  \ `/proc/interrupts`。\n9. 命令 `less /proc/ioports` 将显示用于与硬件通信的内存地址范围。\n10. `lshw`\
  \ 命令将列出硬件设备。要显示存储设备的类型，执行 `lshw -class storage` 命令。\n11. `lsblk` 命令按设备和分区显示块存储设备。命令\
  \ `lshw -class volume` 将显示更详细的分区信息。\n\n## 配置蓝牙\n\n蓝牙是一种设备互连技术，旨在用运行在 2.4 GHz 到 2.485\
  \ GHz 之间的无线通信来取代 RS232。以下是供你参考的信息。\n\n蓝牙主设备（发射器）可以通过*跳频网*（piconet，也称为*个人局域网 (PAN)*）连接最多七个设备（接收器）。尽管该技术目前尚未完善，但可以连接多个跳频网。多个网络化的跳频网被称为*扩频网*（scatternet）。\n\
  \n### 分类\n\n###蓝牙分类决定了蓝牙设备的传输范围。表 12-12 详细列出了蓝牙分类及其传输范围。\n\n![Images](img/f0382-01.jpg)\n\
  \n**表 12-12** 蓝牙分类传输范围\n\n### 蓝牙命令\n\n蓝牙命令由 `bluez` 包提供。要查看蓝牙是否激活，执行命令 `systemctl\
  \ status bluetooth`。\n\n命令 `bluetoothctl list` 显示可用控制器列表。命令 `bluetoothctl show`\
  \ 显示控制器及其状态。\n\n命令 `bluetoothctl scan on` 显示未配对的可用控制器列表。\n\n要配置蓝牙设备，你需要知道设备的 MAC\
  \ 地址。命令 `hcitool scan` 提供控制器的 MAC 地址和名称。\n\n一旦知道控制器的地址，执行命令 `bluetoothctl select\
  \ <controller_MAC_address>`，将在接下来三分钟内发布的任何 `bluetoothctl` 命令应用到该控制器。\n\n表 12-13\
  \ 概述了一些额外的 `bluetoothctl` 选项。请注意，某些命令适用于控制器，而另一些适用于设备。\n\n![Images](img/f0383-01.jpg)\n\
  \n**表 12-13** `bluetoothctl` 选项\n\n## 配置 Wi-Fi\n\nWi-Fi 是无线技术的通用名称，它使用无线电波通过无线接入点访问网络。你可以使用接下来讨论的工具确定是否安装了\
  \ Wi-Fi 网络设备。\n\n### 扫描网络设备\n\n可以使用以下命令扫描网络接口：\n\n* `ip link show`\n* `ifconfig\
  \ -a`\n* `ncmli connection show`\n* `ncmli device status`\n* `netstat -i`\n\n表 12-14\
  \ 包含接口名称的部分列表。\n\n![Images](img/f0383-03.jpg)\n\n**表 12-14** 网络接口名称\n\n### 配置 Wi-Fi\
  \ 网络\n\n接下来，我们将探索如何使用 `iw` 命令配置 Wi-Fi 连接。\n\n![Images](img/note.jpg)\n\n**注意** `iwconfig`\
  \ 命令已弃用，并被 `iw` 命令取代。\n\n以下是一些有用的 Wi-Fi 术语：\n\n* **频率 (Frequency)**：频率是数据传输和接收的速度。大多数\
  \ Wi-Fi 适配器。\n* **通道 (Channel)**：通道是数据路径。每个通道都有上限和下限频率。\n* **ESSID**：扩展集标识符（ESSID）是无线设备使用的标识符（名称）。\n\
  * **路由器 (Router)**：路由器连接网络。\n* **接入点 (Access point)**：接入点是内置设备。\n\n#### `iw`\n\n\
  `iw` 命令用于设置无线接口。在不带任何参数执行 `iw` 时列出帮助菜单。要查看无线接口的状态，执行 `iw list`。大多数无线接口以字母 *w* 开，例如\
  \ `wlan0`。要查看 `wlan0` 的状态，你需要执行 `iw info`。\n\n你可能需要知道无线接口可以看到哪些接入点。命令 `iw <interface_name>\
  \ scan` 搜索可用的接入点。\n\n假设 ESSID 名称为 `network_one`，以下命令将 `wlan0` 连接到 `network_one`：\n\
  \n```\niw wlan0 essid network_one\n```\n\n你可以通过添加 `channel` 选项使用特定通道：\n\n```\niw\
  \ wlan0 channel 11\n```\n\n一旦做出更改，执行命令 `iw wlan0 commit` 以确保所有更改都应用到接口。\n\n## 配置存储设备\n\
  \n本节介绍了各种类型的存储设备以及与之相关的命令。\n\n### IDE\n\n集成驱动器电子 (IDE) 指一种将磁盘控制器集成到驱动器中的技术。其中一个驱动器上的控制器可以控制两个设备（主设备和从设备）。支持\
  \ IDE 的 IDE I/O 卡或主板包含两个 IDE 通道（主和从）。\n\n单块主板可以支持四个设备：\n\n* 主主 (Primary master)\n\
  * 主从 (Primary slave)\n* 从主 (Secondary master)\n* 从从 (Secondary slave)\n\n如果系统包含多个\
  \ IDE 驱动器，则主驱动器是默认启动驱动器。较新版本的 IDE 驱动器（ATA-4 及以后）支持 Ultra DMA。ATA-6 也称为并行 ATA (PATA)，其数据传输速度可达\
  \ 133 Mbps。\n\n### SCSI\n\n小型计算机系统接口 (SCSI) 是一种用于连接外部设备的并行接口。SCSI 设备通过内部带状或外部电缆链式连接。确保最后一个\
  \ SCSI 设备安装了终止器（terminator）是非常重要的。\n\nSCSI 设备由每次传输的比特数和每秒速度定义。某些 SCSI 设备类型列在 表 12-15\
  \ 中。\n\n\n\n\n每个 SCSI 设备都分配有一个 ID。设备 ID 可以通过拨码轮、跳线帽或固件进行设置。设备 ID 决定了设备的优先级。这里是一些需要注意的点：\n\
  \n* 主总线适配器 (`HBA`) 始终被分配最高优先级 (7)。\n* 窄并行 SCSI 设备优先级顺序为 7, 6, 5, 4, 3, 2, 1, 0。\n\
  * 宽 SCSI 设备优先级顺序为 7, 6, 5, 4, 3, 2, 1, 0, 15, 14, 13, 12, 11, 10, 9, 8。\n\n### SATA\n\
  \n串行 ATA 连接 (`SATA`) 驱动器通过高速串行电缆与专用硬盘通道进行逐位通信（串行通信）。电缆包含七个引脚（两个数据对和三根地线）。一对线用于接收数据，另一对用于传输确认信号。这种布线方案比\
  \ IDE 所需的 40 针或 80 针排线连接器简单得多，并消除了 IDE 电缆带来的许多电气限制。`SATA` 数据传输速率从 150 MBps 到 600\
  \ MBps 不等。\n\n## eSATA\n\n`eSATA` 端口用于将外部 `SATA` 设备连接到系统。设备电源由外部电源提供。\n\n## eSATAp\n\
  \n`eSATAp`（供电 eSATA）端口能够为外部 `SATA` 设备供电。`eSATAp` 端口还可以支持 USB。\n\n## 光驱器\n\n光驱器具有存储大量数据的能力。使用高强度激光在光电表面上写入数据。数据由坑（pits）和陆（lands）表示。坑代表二进制\
  \ 0，陆代表二进制 1。使用低强度激光来读取数据。光介质主要有三种类型：\n\n* CD\n* DVD\n* 蓝光\n\n## 固态硬盘\n\n固态硬盘 (`SSD`)\
  \ 使用闪存内存电路存储数据。当系统断电时，存储在闪存中的信息会被保留。数据的存储方式就像设备是一个实际硬盘（柱面/头/扇区，或 `CHS`）。在大多数情况下，`SSD`\
  \ 硬盘使用与 `SATA` 相同的接口，但它们也可以实现其他接口。\n\n由于是通过电子方式而非机械方式访问数据，`SSD` 的访问速度比传统硬盘快。然而，`SSD`\
  \ 的性能可能会时间的推移而下降。\n\n### USB\n\n`USB` 是一种高速即插用 (`PnP`) 接口，允许多个设备通过单个总线连接。`USB` 总线在星型拓扑结构支持\
  \ 127 个设备。总线速度限于总线上最慢设备的速度。标准总线速度如下：\n\n* `USB` 1.0: 12 Mbps\n* `USB` 2.0: 480 Mbps\n\
  * `USB` 3.0: 800 Mbps\n* `USB` 4.0: 40 Gbps\n\n![Images](img/note.jpg)\n\n注意 `USB`\
  \ 3.0 能够达到 800 Mbps，但多个 `USB` 设备可以通过 `USB` 集线器连接到 `USB` 接口，这可能会降低连接速度。\n\n在我们讨论\
  \ `USB` 设备之前，请确保你熟悉以下术语：\n\n* `USB`: 用于数据传输的总线类型\n* `Port`: 连接到总线的物理连接\n* `Flash\
  \ drive`: 包含 `USB` 接口和闪存内存的存储设备；由于其物理尺寸也称为 U 盘\n\n`USB` 设备可能从 `USB` 连接供电，也需要外部电源。\n\
  \n![Images](img/note.jpg)\n\n注意对于接下来的示例，我已向虚拟机连接了一个金士顿 4G DataTraveler U 盘。\n\n\
  ### 连接 USB 设备\n\n当连接 U 盘时，内核会创建一个 `uevent`，`udev` 配置该设备，而 `dbus` 通知用户应用程序该设备可用。我们可以使用\
  \ `dmesg` 命令查看其中的一些活动。\n\n### hdparm\n\n`hdparm` 是另一个用于查询硬盘统计信息的工具，并可以更改硬盘运行参数。更改硬盘参数时务必极其小心。表\
  \ 12-16 显示了 `hdparm` 命令的选项。\n\n![Images](img/f0388-01.jpg)\n\n**表 12-16** `hdparm`\
  \ 选项\n\n### lsscsi\n\n`lsscsi` 命令用于获取 SCSI 设备和主机信息。`lsscsi` 命令显示 SCSI 设备和主机的列表，如图\
  \ 12-31 所示。左侧的输出代表 `host:channel:target_number:lun`。以下是输出的解析：\n\n![Images](img/F12-31.jpg)\n\
  \n**图 12-31** `lsscsi`\n\n* `host:channel:target_number:lun`: `host` 表示适配器。\n* `channel`:\
  \ 表示总线。\n* `target_number`: 表示设备。\n* `lun`: 表示单元。\n\n表 12-16 显示了 `hdparm` 命令选项。（等等，原文此处存在一些重复/混乱，我将根据提供的逻辑流进行重新对齐）。\n\
  \n实际上，查看原文中 `lsscsi` 的解析：\n* `host:channel:target_number:lun`: 输出内容。\n* `host`:\
  \ 表示适配器。\n* `channel`: 表示总线。\n* `target_number`: 表示设备。\n* `lun`: 表示单元。\n\n等等，提示中提供的\
  \ `lsscsi` 解析有些碎片化。我将遵循所提供的文本结构：\n\n* `host:channel:target_number:lun`: 输出内容。\n\
  * `host`: 表示适配器。\n* `channel`: 表示总线。\n* `target_number`: 表示设备。\n* `lun`: 表示单元。\n\
  \n\n\n\n![Images](img/note.jpg)\n\n**注意** 在创建打印机之前，你无法将其指定为默认打印机或将其分配给类。\n\n要从类中移除打印机，请使用以下命令：\n\
