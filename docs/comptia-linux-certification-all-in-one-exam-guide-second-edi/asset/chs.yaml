  \ 文件，并输入以下内容：\n\n![Images](img/f0540-02.jpg)\n\n此限制对于运行 CPU 密集型程序并抢占其他用户周期的用户非常有用。\n\
  \n同样，通过在 `/etc/security/limits.conf` 文件中输入以下内容，限制 `cheryl` 用户最多允许两次并发登录：\n\n![Images](img/f0540-03.jpg)\n\
  \n这将防止 `cheryl` 用户在成功两次初始登录后再次尝试登录系统。\n\n### 禁用用户登录\n\n有时，禁用对 Linux 系统的所有登录可能是重要的（例如，如果管理员倾向于进行干净、完整的系统数据备份）。要做到这一点，所有当前用户必须注销。`w`\
  \ 命令列出所有当前登录的用户并显示他们正在做什么。例如，在图 16-6 中，有两个用户当前登录：`ksanders` 和 `rtracy`。\n\n![Images](img/F16-06.jpg)\n\
  \n**图 16-6** 生成登录用户列表\n\n在将用户踢出系统之前，你可能想验证他们没有进行任何重要操作。要列出特定目录上运行的进程，请使用 `lsof`\
  \ 命令，所示：\n\n![Images](img/f0541-02.jpg)\n\n在礼貌地要求用户注销后，你可以使用 `pkill -KILL -u <username>`\
  \ 命令强制注销用户，并合理地保护他们的工作。例如，在图 16-7 中，使用 `pkill` 命令注销 `ksanders` 用户。\n\n![Images](img/F16-07.jpg)\n\
  \n**图 16-7** 强制用户注销\n\n现在，要禁用所有未来的登录，请 `/etc` 中创建一个名为 `nologin` 的文件。只要该文件存在，除 `root`\
  \ 之外的人都不允许登录。此外，在 `/etc/nologin` 文件中输入的任何文本将在用户尝试登录时显示。在图 16-8 所示的示例中，`/etc/nologin`\
  \ 文件中输入了文本“系统目前无法登录”。因此，当用户尝试登录时，将显示此错误信息。\n\n![Images](img/F16-08.jpg)\n\n**图 16-8**\
  \ 来自 `/etc/nologin` 的“登录拒绝”消息\n\n![Images](img/note.jpg)\n\n**注意** 管理员可以启用脚本来通知用户计划关机。在脚本内部，他们可以使用\
  \ `printf` 命令发送消息；例如：\n\n```\nprintf \"System Going down for service at 5PM Today\"\
  \n```\n\n此行为在 `/etc/pam.d/login` 文件中配置，所示：\n\n![Images](img/f0542-01.jpg)\n\n读取\
  \ `auth requisite pam_nologin.so` 的行会导致 PAM 检查 `/etc` 中是否存在名为 `nologin` 的文件。如果存在，PAM\
  \ 不允许普通用户登录。\n\n在管理员完成完整清洁的备份后，可以通过删除或重命名 `nologin` 文件来重新启用登录。例如，在 shell 提示符处输入以下内容进行重命名，仍然允许用户登录：\n\
  \n![Images](img/f0542-02.jpg)\n\n接下来让我们讨论如何审计文件以定位设置了 SUID 或 SGID 权限的文件。\n\n![Images](img/exam.jpg)\n\
  \n**考试提示** 管理员可以修改“每日消息”文件（即 `/etc/motd`），以便维护消息在终端用户每次登录时显示在终端上。\n\n### 使用 `find`\
  \ 进行安全审计\n\n除了禁用用户登录外，你需要熟悉的另一个与用户安全相关的问题是需要审计设置了 SUID `root` 权限的文件。正如你在第 6 章中所学习的样，SUID\
  \ 代表“设置用户 ID”。当运行设置了 SUID 权限的可执行文件时，该进程将获得以可执行文件所有者的身份访问系统，而不是以实际运行命令的用户身份。如果该文件由\
  \ root 所有，这是一个严重的问题。当 `root` 用户拥有设置了 SUID 权限的文件时，它允许由文件创建的进程以 `root` 身份执行操作，而启动它的用户可能不允许执行这些操作。同样的问题适用于\
  \ `root` 组所有且设置了“设置组 ID”（SGID）权限的文件。\n\n请注意，Linux 系统上少数由 `root` 的文件确实需要设置这些权限。然而，其他由\
  \ `root/root` 所有且设置了 SUID/SGID 权限的文件代表了系统的安全漏洞。许多利用是通过使用具有此类权限的文件来实现的。设置了 SUID 权限的文件在\
  \ shell 提示符处使用 `ls` 命令列出时显示如下：\n\n![Images](img/f0543-01.jpg)\n\n设置了 SGID 权限的文件在\
  \ shell 提示符处使用 `ls` 命令列出时显示如下：\n\n![Images](img/f0543-02.jpg)\n\n因此，管理员需要考虑运行定期审计，以识别任何由\
  \ `root` 所有且设置了其中任一权限的文件。除了最小必要文件之外的任何文件都应该仔细检查，以确保它们不是某种类型攻击的一部分。管理员可以在 shell 提示符处使用以下命令在\
  \ Linux 系统上搜索设置了 SUID 权限的文件：\n\n![Images](img/f0543-03.jpg)\n\n`-perm` 选项告诉 `find`\
  \ 匹配具有指定模式的文件；在这种情况下，`s` 权限被分配给用户。你也可以使用以下命令识别设置了 SGID 权限的文件：\n\n![Images](img/f0543-04.jpg)\n\
  \n这里有一个示例：\n\n![Images](img/f0543-05.jpg)\n\n**考试提示** 管理员可以通过以下方式禁用 Ctrl-Alt-Del，以避免产生中断性的关机：\n\
  \n```\nroot# systemctl mask ctrl-alt-del.target\nroot# systemctl daemon-reload\n\
  ```\n\n### 练习 16-1：管理用户访问\n\n在本次练习中，你将练习为用户密码设置有效期限制。此外，你将配置 `sudo` 以允许用户以 `root`\
  \ 身份杀死进程。请使用随本书提供的虚拟机进行此练习。\n\n![Images](img/video.jpg)\n\n**视频** 查看练习 16-1 视频以演示如何执行此任务。\n\
  \n完成以下步骤：\n\n1. 启动你的 Linux 系统并以用户 `student1` 登录，密码为 `student1`。\n2. 打开终端会话。\n3.\
  \ 输入 `su -` 并输入密码 `password` 切换到 `root` 用户。\n4. 完成以下步骤练习配置有效期限制：\n   a. 使用 `cat`\
  \ 或 `less` 工具查看 `/etc/passwd` 文件。识别系统上一个你想配置密码有效期限制的用户。\n   b. 在 shell 提示符处输入 `chage\
  \ -m 3 -M 60 -W 7 <username>`，将最小密码有效期设置为 3 天，最大密码有效期设置为 60 天，过期前的警告天数设置为 7 天。\n\
  5. 通过执行以下操作配置 `sudo`，以允许系统上的某个用户以 `root` 身份杀死进程：\n   a. 识别系统上一个你想授予以 `root` 身份杀死进程权限的用户。\n\
  \   b. 以 `root` 用户身份，在 shell 提示符处输入 `visudo`。你应该能看到 `/etc/sudoers` 文件加载到 `vi` 文本编辑器中。\n\
  \   c. 滚动到示例所示的行，并在每行开头插入 `#` 字符以将其注释掉。\n\n\n\n\n```bash\nDefaults targetpw    #\
  \ 询问目标用户（如 root）的密码\nALL   ALL=(ALL) ALL   # 警告！仅在配合 'Defaults targetpw' 时使用！\n\
  ```\n\n**d.** 按 `G` 然后按 `o` 在 `sudoers` 文件的末尾添加以下行：\n\n![Images](img/f0544-01.jpg)\n\
  \n**e.** 按 `Esc` 然后输入 `:x` 保存对 `sudoers` 文件的更改。\n\n**f.** 在 shell 提示符下以 `root` 用户身份运行\
  \ `top`。\n\n**g.** 打开一个新的终端会话，并（作为标准用户）输入 `ps -elf | grep top`。你应该能看到一个由 `root`\
  \ 用户拥有的正在运行的 `top` 进程。\n\n**h.** 通过在 shell 提示符下输入 `sudo killall top` 来杀死该进程。\n\n\
  **i.** 提示时，输入你的用户密码。\n\n**j.** 再次在 shell 提示符下输入 `ps -elf | grep top`。你应该发现之前属于 `root`\
  \ 用户的 `top` 进程已被杀死。\n\n## 管理系统日志\n\n日志文件对于系统管理员来说是信息的金矿。日志文件用于检测系统入侵者、排排除故障以及确定系统内的性能问题。Linux\
  \ 通常使用一种名为 `auditd` 的审计跟踪系统，在本节中，你将学习如何使用更高级的工具管理和使用系统日志文件。我们将讨论以下主题：\n\n* 配置日志文件\n\
  * 使用日志文件排除故障\n* 使用日志文件检测入侵者\n\n让我们从讨论如何配置日志文件开始。\n\n### 配置日志文件\n\n系统日志文件存储在 `/var/log/`\
  \ 目录，如图 16-9 所示。\n\n![Images](img/F16-09.jpg)\n\n**图 16-9** `/var/log/` 目录的内容\n\n\
  注意此图，`/var/log/` 中有很多子目录，系统守护进程（如 `mysql`、`apparmor`、`audit` 和 `cups`）存储它们的日志文件。其中一些日志文件可以使用文本处理工具读取的简单文本文件。另一些是二进制文件，需要使用特殊工具，例如\
  \ `lastlog`，它可以显示用户最近的登录情况。如图 16-9 所示，`/var/log/` 及其子目录中有许多文件。和大多数大多数事物一样，某些日志文件比其他文件有用得多。表\
  \ 16-2 包含了一些较重要的日志文件列表。\n\n![Images](img/f0546-01.jpg)\n\n**表 16-2** 有用的日志文件\n\n\
  ![Images](img/note.jpg)\n\n**注意** 表 16-2 中显示的文件是 SUSE Linux 系统上使用的日志文件。其他发行版默认可能使用不同的文件。你可以使用\
  \ `/etc/rsyslog.conf` 文件对日志记录进行自定义。\n\n在 Linux 上日志记录的实现方式取决于 Linux 发行版。对于 CompTIA\
  \ Linux+ 考试，你需要熟悉以下系统日志配置实现方式：\n\n* `rsyslogd` 消息日志\n* 使用日志文件轮转（log rotation）管理磁盘空间\n\
  * `journald` 消息日志\n\n#### `rsyslogd` 消息日志\n\n在运行 `init` 的 Linux 系统上的日志记录通常由 `rsyslogd`\
  \ 守护进程处理。并不是每个守护进程都维护自己的独立日志文件，大多数 Linux 服务默认配置为将日志记录写入 `/dev/log/`。该设备文件由 `rsyslogd`\
  \ 守护进程维护。当服务向此套接字写入时，输入会被 `rsyslogd` 捕获。然后 `rsyslogd` 守护进程使用 `/etc/rsyslog.conf`\
  \ 文件（如图 16-10 所示）来确定信息的去向。\n\n![Images](img/F16-10.jpg)\n\n**图 16-10** `/etc/rsyslog.conf`\
  \ 文件\n\n![Images](img/note.jpg)\n\n**注意** 某些 Linux 发行版使用 `syslog-ng` 或 `syslogd`\
  \ 而不是 `rsyslogd` 来管理日志。\n\n`/etc/rsyslog.conf` 文件的语法为\n\n![Images](img/f0547-02.jpg)\n\
  \n`<facility>` 指提供消息的子系统。Linux 系统上每个使用 `rsyslog` 进行日志记录的进程都被分配到以下设施之一：\n\n* `authpriv`\
  \ 设施：与系统安全和授权相关的服务使用\n* `cron` 设施：接受来自 cron 的消息\n* `daemon` 设施：守护进程使用\n* `kern`\
  \ 设施：用于内核\n* `lpr` 设施：用于打印\n* `mail` 设施：用于邮件\n* `news` 设施：用于新闻\n* `rsyslog` 设施：rsyslog\
  \ 使用\n* `user` 设施：用于用户相关消息\n* `uucp` 设施：用于 uucp\n* `local0-7` 设施：用于本地\n\n除了设施外，`rsyslog`\
  \ 守护进程还提供了*优先级*（priorities）来自定义日志记录发生方式：\n\n* `debug` 所有信息；用于调试\n* `info` 提示性消息\n\
  * `notice` 关注的问题，但尚未成为问题\n* `warn` 可能导致危害的非关键错误\n* `err` 对守护进程致命的严重错误\n* `crit`\
  \ 严重错误，但无需采取行动\n* `alert` 必须立即采取行动，但系统可用\n* `emerg` 对计算机的致命错误；不可用\n* `none` 不记录任何活动\n\
  \n例如，查看图 16-10 中的 `/etc/rsyslog.conf` 文件并向下看约 15 行，你将看到如下：\n\n![Images](img/f0548-01.jpg)\n\
  \n在这里，`rsyslogd` 守护进程将来自 `cron` 设施的所有优先级（`*`）消息重定向到 `/var/log/cron` 文件。如果需要，管理员自定义\
  \ `/etc/rsyslog.conf` 将不同优先级的消息分流到不同的文件中，如下：\n\n![Images](img/f0548-02.jpg)\n\n\
  `/etc/rsyslog.conf` 中的上述定义将所有与用户相关的 info 级消息（以及更高优先级）发送到 `/var/log/messages` 文件，而\
  \ `/var/log/secure` 只接收用户 alert 消息。\n\n#### 使用日志文件轮转管理磁盘空间\n\nLinux 发行版还包含一个名为 `logrotate`\
  \ 的工具，默认由 `cron` 守护进程每天运行。要自定义日志文件的轮转方式，请修改 `/etc/logrotate.conf` 文件，如图 16-11 所示。\n\
  \n![Images](img/F16-11.jpg)\n\n**图 16-11** 在 `/etc/logrotate.conf` 中配置日志轮转\n\n`/etc/logrotate.conf`\
  \ 文件包含 `logrotate` 使用的默认全局参数，用于确定如何以及何时轮转日志。然而，可以使用 `/etc/logrotate.d/` 目录下的配置文件覆盖特定守护进程的这些默认值。例如，在图\
  \ 16-12 中，`/etc/logrotate.d/apache2` 文件用于自定义 `apache2` 守护进程的日志记录。\n\n![Images](img/F16-12.jpg)\n\
  \n**图 16-12** 配置 Apache Web 服务器日志记录\n\n\n\n\n此外，图 16-12 所示的第一行意味着 `/var/log/apache2/access_log`\
  \ 文件将被压缩。它的最大有效期为 365 天，之后将会被删除（`maxage 365`）。文件的旧版本将使用日期扩展进行存档（`dateext`）。日志文件在删除之前将进行\
  \ 99 次轮（`rotate 99`）。如果文件大于 4096 KB，将进行轮（`size=+4096k`）。如果文件为空，则不会轮（`notifempty`）。如果文件不存在，则不会生成错误消息（`missingok`）。文件将以\
  \ 644 权限创建，所有者为 `root` 用户，组为 `root`（`create 644 root root`）。在日志文件轮后，将运行 `/etc/init.d/apache2`\
  \ `reload` 命令（`postrotate /etc/init.d/apache2 reload`）。\n\n![Images](img/exam.jpg)\n\
  \n**考试提示** 你可以使用 `logger` 工具测试你的日志配置。此命令行工具允许你手动在日志系统中创建条目。其语法如下：\n\n![Images](img/f0550-02.jpg)\n\
  \n### `journald` 消息日志\n\n使用 `systemd` 进程的 Linux 发行版使用 `journald` 进程记录日志而不是 `rsyslogd`。`journald`\
  \ 进程维护一个名为 `journal` 的系统日志，位于 `/run/log/journal/`。要查看日志，请使用 `journalctl` 命令。当你在\
  \ shell 提示符输入该命令且无参数时，将显示整个日志，如图 16-13 所示。\n\n![Images](img/F16-13.jpg)\n\n**图 16-13**\
  \ 使用 `journalctl` 查看日志\n\n![Images](img/note.jpg)\n\n**注意** 默认情况下，journal 日志数据在重启时会丢失。要使其持久化，请执行以下操作：\n\
  \n![Images](img/f0550-03.jpg)\n\n`journald` 进程的优点之一是，你可以用它来查看系统启动消息。要做到这一点，请在 shell\
  \ 提示符输入 `journalctl -b`。将显示最近一次系统启动的消息。此外，你还可以使用 `journalctl` 查看之前系统启动的消息。这可以通过两种方式实现：\n\
  \n* 在命令后指定 `-b` 标志并跟上一个正数，将从日志开始开始查找指定系统启动的消息。例如，输入 `journalctl -b 1` 将显示在日志开头找到的第一次启动期间创建的消息。\n\
  * 在命令后指定 `-b` 标志并跟上一个负数，将从日志的末尾开始查找指定系统启动的消息。例如，输入 `journalctl -b -2` 将显示两个启动前创建的系统消息。\n\
  \n`journalctl` 命令还可以用于显示与系统上运行的特定服务相关的日志条目。语法为 `journalctl -u <service_name>`。例如，要查看与系统上运行的\
  \ SSH 进程相关的所有 journal 日志条目，请在 shell 提示符输入 `journalctl -u sshd`。示例见图 16-14。\n\n![Images](img/F16-14.jpg)\n\
  \n**图 16-14** 查看 `sshd` journal 事件\n\n`journald` 进程的行为通过 `/etc/systemd/journald.conf`\
  \ 文件配置。该文件有许多可配置参数。以下是一些较实用的参数：\n\n* `ForwardToSyslog` 配置 `journald` 将日志消息转发到传统的\
  \ `rsyslog` 进程。\n* `MaxLevelStore` 控制存储在 journal 文件中的最大日志级别。所有等于或小于指定日志级别的消息都会被存储，而任何高于指定级别的消息都会被丢弃。此参数可以设置为以下值之一：\n\
  * `none`\n* `emerg (0)`\n* `alert (1)`\n* `crit (2)`\n* `err (3)`\n* `warning (4)`\n\
  * `notice (5)`\n* `info (6)`\n* `debug (7)`\n\n考虑到这些背景，让我们接下来讨论如何查看和使用你的日志文件。\n\n\
  #### 使用日志文件排排除故障\n\n正如本章早期提到的，日志文件在排排除 Linux 问题时是无价的资源。如果内核或服务遇到问题，它将记录在日志文件中。查看这些日志文件可以提供丰富的信息，这些信息并不一定显示在屏幕上。\n\
  \n某些日志文件是二进制文件，必须用特殊工具读取；例如，`/run/log/journal/` 目录下的文件是由 `journalctl` 读取的二进制文件。然而，大多数日志文件都是简单的文本文件，可以使用标准的文本处理工具查看。`cat`、`less`、`more`\
  \ 等工具可以用于查看文本文本日志文件。但是，这些工具存在一个问题：日志文件非常巨大！\n\n例如，记录通用系统活动的 `/var/log/messages`\
  \ 文件可能包含 10,000 行或更多内容。那是大量的文本！`less` 工具一次只显示 24 行。你必须多次按下空格键才能到达文件末尾！\n\n有两种策略可以帮助。第一种是将\
  \ `cat` 命令的输出重定向到 `grep` 命令，以过滤日志文件中的特定术语。例如，如果你想在 `/var/log/messages` 中查找与登录相关的信息，可以在\
  \ shell 提示符输入以下内容：\n\n![Images](img/f0552-02.jpg)\n\n然后，`/var/log/messages` 文件将只显示包含“login”术语的条目。如果系统使用\
  \ `systemd` 和 journal，也可以通过 `journalctl` 完成：\n\n![Images](img/f0553-01)\n\n除了 `grep`\
  \ 之外，你还可以使用 `head` 和 `tail` 工具查看日志条目。请理解大多数日志文件按时间顺序记录，从旧到新。要查看文件的开头，在 shell 提示符输入\
  \ `head <filename>` 显示前几行。例如，在图 16-15 中，使用 `head` 显示了 `/var/log/messages` 文件的开头。\n\
  \n![Images](img/F16-15.jpg)\n\n**图 16-15** 使用 `head` 查看文件\n\n`tail` 工具的工作方式与 `head`\
  \ 相反。它不是显示文件的前 10 行，而是显示最后 10 行。这非常有用，因为在排除故障时，你只需要查看最后几行。要这样做，在 shell 提示符输入 `tail\
  \ <filename>`。在图 16-16 中，正在使用 `tail` 查看 `/var/log/messages` 文件。\n\n![Images](img/F16-16.jpg)\n\
  \n**图 16-16** 使用 `tail` 查看文件\n\n`tail` 工具提供了 `-f` 选项，这在排除故障时经常使用。`tail` 的 `-f` 选项将正常显示日志文件的最后几，但它会监控正在显示的文件，并在新行添加到日志文件时显示它们。例如，你可以运行\
  \ `tail -f /var/log/messages` 在排除故障过程中监控系统日志文件的错误消息。按 `Ctrl-c` 可以停止监控。\n\n使用 `journald`\
  \ 进程管理日志的系统也可以“跟随”功能。在 shell 提示符运行 `journalctl -f`，将显示 journal 的最后几个条目。然后 `journalctl`\
  \ 命令监控 journal 并在添加新条目时打印它们。再次，你可以按 `Ctrl-c` 停止监控。\n\n你可以检查之前在表 16-2 中列出的系统日志文件来排除故障，或其他日志文件，包括：\n\
  \n* `cron` 包含来自 `cron` 进程的条目\n* `dmesg` 包含硬件检测信息\n* `maillog` 包含由 `sendmail` 进程生成的条目\n\
  * `secure` 包含访问网络进程的信息\n* `rpmpkgs` 包含已安装的 `rpm` 包列表\n* `dpkg.log` 包含安装、升级和删除的 `deb`\
  \ 包列表\n\n\n\n\n\n要排查与应用程序或服务相关的问题，请检查专门为该服务维护的日志文件。例如，检查 `mail`、`mail.err`、`mail.info`、`mail.warn`\
  \ 或 `maillog` 文件来排查 `postfix` 或 `sendmail` 进程的问题。如果 `mysqld` 进程有问题，请检查 `/var/log/mysql`\
  \ 目录下的 `mysqld.log` 文件。对于 Apache Web 服务器，调查 `/var/log/apache2` 目录下的各种日志文件。\n\n除了使用日志文件排查\
  \ Linux 系统问题外，还可以利用它们检测未经授权的入侵。\n\n## 使用日志文件检测入侵者\n\n检测入侵者涉及寻找他们在系统中留下的线索。在这方面，Linux\
  \ 系统中的日志文件是最好的资源之一。就像 CSI 侦探一样，实践和经验是培养直觉的最佳方法，直觉会在事情看起来可疑时提醒你。培养这种直觉最好的方法是花大量时间审查日志文件，因为这样你就会建立系统的“正常”基准。一旦你知道什么是正常的，就能识别出什么是不正常的。\n\
  \n识别可疑活动的一个重要审查日志文件是 `/var/log/wtmp`。该日志文件包含所有通过系统验证的用户列表。该文件以二进制格式保存，因此你不能使用 `cat`、`less`\
  \ 或 `vi` 等文本编辑器查看它。相反，你必须在 shell 提示符运行 `last` 命令。`last` 工具的输出所示图 16-17。\n\n![Images](img/F16-17.jpg)\n\
  \n**图 16-17** 使用 `last` 审查登录历史\n\n`last` 工具显示用户账户、登录时间、注销时间以及用户身份验证来源。审查此文件时，寻找看似异常的活动——例如，在无人工作的半夜发生的登录应被认为是可疑的。\n\
  \n查看 `/var/log/faillog` 文件，它包含身份验证失败的列表。该文件对于检测字典攻击非常有效，字典攻击通过遍历词条列表并将其作为用户账户密码进行测试。与\
  \ `wtmp` 类似，`faillog` 是一个二进制文件。要查看它，请使用 `faillog` 工具。该工具显示尝试验证的用户、该用户登录失败的次数以及最后一次未成功尝试的时间。还可以尝试\
  \ `-u` 选项查看特定用户账户的登录尝试——例如，`faillog -u malina`。\n\n![Images](img/exam.jpg)\n\n**考试提示**\
  \ `lastb` 命令通过读取日志文件 `/var/log/btmp` 来列出错误的登录尝试，该文件包含了所有失败尝试。\n\n下一个要分析的日志文件是 `/var/log/lastlog`，它包含系统中所有用户及其最后登录时间。与我们审查过的其他日志文件一样，你无法通过\
  \ `less`、`cat` 或文本编辑器查看 `lastlog`。要查看 `lastlog`，请在 shell 提示符中使用 `lastlog` 工具，所示图\
  \ 16-18。\n\n![Images](img/F16-18.jpg)\n\n**图 16-18** 使用 `lastlog` 查看最后登录时间\n\n最后类型的日志文件可以帮助检测入侵尝试。这些是\
  \ `/var/log/messages` 和 `/var/log/journal`（如果你的发行版使用它们）。如前所述，这些日志文件包含系统上运行的所有服务的消息。因此，它们包含了许多可能或也可能与入侵尝试相关的数据。你可以使用\
  \ `grep` 来隔离相关条目。例如，`grep login /var/log/messages | more` 显示文件中的与登录相关的条目。使用 `journalctl`\
  \ 命令也可以实现相同的功能。\n\n除了查看日志文件，你还可以使用与 `w` 类似的命令行工具查看当前正在使用系统的人，正如第 4 章 中讨论。使用 `who`\
  \ 查看当前登录到系统的用户。\n\n## 增强组和文件安全\n\n安全性被认为是一个三条腿凳，由机密性、完整性和可用性组成。Linux 系统的实现优先级是可用性优于机密性和完整性。这被称为自主访问控制\
  \ (DAC)。DAC 系统允许用户根据自己的意愿设置机密性规则。这对于大多数企业环境是可以的，因为尽可能快速提供数据非常重要（例如，向潜在客户发送销售报价）。\n\
  \n军事环境要求机密性优先。这些环境使用一种被称为强制访问控制 (MAC) 的系统。图 16-19 显示了 MAC 的工作原理。如果用户具有“机密 (Confidential)”权限，他们被允许访问“未分类\
  \ (Unclassified)”和“机密 (Confidential)”文档；但他们不允许访问“秘密 (Secret)”或“绝密 (Top Secret)”文档，因为他们的权限太低。\n\
  \n![Images](img/F16-19.jpg)\n\n**图 16-19** 强制访问控制模型\n\n要在 Linux 系统上启用 MAC，请安装 Linux\
  \ 安全模块。有多个，但 Linux+ 考试重点关注以下：\n\n* 实现 SELinux\n* 实现 AppArmor\n\n### 实现 SELinux\n\
  \n美国国家安全局 (NSA) 开发了 SELinux，在用户/组/其他以及读/写/执行权限之上提供安全机制（后者仅提供 DAC）。SELinux 的设计将操作限制在最小权限范围内；未显式允许的操作默认被拒绝。Red\
  \ Hat 7 及以上版本、CentOS 7 及以上版本及其衍生版在内核中包含了 SELinux。\n\n#### SELinux 上下文权限\n\nSELinux\
  \ 基于一个*主体*（subject，即用户或应用程序），该主体需要访问一个*对象*（object，即文件、套字或其他应用程序）。*引用监视器*（reference\
  \ monitor，也简单称为*监视器* monitor）根据上下文或定义在对象上的标签，决定主体是否拥有该对象的权限，所示图 16-20。要查看文件的上下文权限，运行命令\
  \ `ls -Z`。\n\n![Images](img/F16-20.jpg)\n\n**图 16-20** SELinux 引用监视器系统\n\n![Images](img/f0557-02.jpg)\n\
  \n末尾出现的“点”（`-rw-r--r--.`）意味着 SELinux 已启用且文件已定义了上下文。要查看命令的上下文权限，运行 `ps -Z`：\n\n![Images](img/f0558-01.jpg)\n\
  \n上下文定义为：`_u` 代表用户，`_r` 代表角色，`_t` 代表类型，`s0` 代表敏感级。目标策略（targeted policies）的规则与 `_t`\
  \ 上下文相关。多级安全 (MLS) 级别的规则与 `s0` 上下文相关。参见表 16-3 的 SELinux 用户上下文权限能力列表。\n\n![Images](img/f0558-03.jpg)\n\
  \n**表 16-3** SELinux 用户上下文权限能力\n\n![Images](img/note.jpg)\n\n**注意** SELinux 还引入了\
  \ `selinux-policy-minimum`，允许用户在无限制状态下与 Linux 系统进行交互。\n\n可以使用 `chcon` 命令修改文件上下文。要递归更改子目录中的文件，请使用\
  \ `-R` 标志：\n\n![Images](img/f0558-02.jpg)\n\n要将文件系统恢复到默认设置，可以通过运行 `touch /.autorelabel`\
  \ 并重启来重新标记整个文件系统，或者使用 `restorecon` 命令更改单个文件和目录：\n\n![Images](img/f0559-01.jpg)\n\
  \n默认上下文定义在 `/etc/selinux/targeted/contexts/files/file_contexts`。要修改 SELinux 上下文，请使用\
  \ `semanage` 命令。\n\n![Images](img/exam.jpg)\n\n**考试提示** 了解以下 `semanage` 选项很有用：`-s`\
  \ 指定用户，`-a` 为该用户添加限制上下文权限。这些选项提供了更高的安全性，因为它们强制用户遵守 SELinux 策略：\n\n![Images](img/f0559-02.jpg)\n\
  \n#### 启用 SELinux\n\nSELinux 可以以三种模式实现：\n\n* 强制模式 (Enforcing)\n* 允许模式 (Permissive)\n\
  * 禁用模式 (Disabled)\n\n\n\n\n\n强制模式（Enforcing mode）根据定义的 SELinux 策略拒绝用户访问。允许访问（Permissive\
  \ access）仅记录在强制模式下会被拒绝的操作；这是在调整安全策略时使用的一种极佳的模式。禁用模式（Disabled mode）则简单地禁用 SELinux。\n\
  \n要查看当前模式，请使用 `getenforce` 命令；设置 SELinux 模式请使用 `setenforce`：\n\n![Images](img/f0559-03.jpg)\n\
  \nSELinux 强制模式定义在 `/etc/sysconfig/selinux`（在 Red Hat、SUSE 及其衍生版上）或 `/etc/selinux/config`（在\
  \ Debian、Ubuntu 及其衍生版上）。\n\nSELinux 的默认策略称为“目标策略”（targeted），它允许管理员以细粒度的方式为目标进程定义上下文。例如，它可以对所有进程强制内存限制，以最大限度地减少缓冲区溢出攻击的脆弱性。例如，网络服务是被目标选的，但\
  \ `systemd`、`init` 和用户进程则不是。另一种策略模式是 MLS，它使用了美国国防部首的 Bell-LaPadula 模型。\n\n![Images](img/note.jpg)\n\
  \n**注意** 若要体验 MLS，请安装 `selinux-policy-mls` 包。MLS 支持从 `c0` 到 `c1023` 的安全级别，其中 `c0`\
  \ 是最低级别，`c3` 是绝密；其他级别尚未定义。\n\n![Images](img/f0560-01.jpg)\n\n`sestatus` 命令提供 SELinux\
  \ 设置的详细输出：\n\n![Images](img/f0560-02.jpg)\n\n`setenforce` 命令允许使用布尔值设置 SELinux 模式，其中\
  \ `0`等于允许，`1` 等强制。要使更改永久，请修改 `/etc/selinux/config` 文件中的 `SELINUX` 变量。\n\n![Images](img/note.jpg)\n\
  \n**注意** 如果 `sestatus` 输出显示 `SELinux status` 被设置为 `disabled`，则 SELinux 状态将从策略变为非策略，且\
  \ `setenforce` 命令将无法工作。你需要将 `/etc/selinux/config` 文件中的 `SELINUX` 变量更改为 `enforcing`\
  \ 并重启。重启后，所有文件将用 SELinux 上下文重新标记。\n\n### 使用 SELinux 布尔值\n\n为了在不重新加载或重启的情况下修改 SELinux\
  \ 策略，请应用策略布尔值。目前有约 300 种布尔可能，且列表不断增长。要列出可用的布尔值，请使用 `semanage`：\n\n![Images](img/f0560-03.jpg)\n\
  \n在此列表中，`cron` 无法重新标记文件系统以恢复文件上下文。显示布尔值的另一种方法是 `getsebool`：\n\n![Images](img/f0561-02.jpg)\n\
  \n然而，`getsebool` own `semanage` 那样显示描述。此外，`getsebool -a` 将显示所有布尔值。\n\n要配置布尔值，请使用\
  \ `setsebool` 命令：\n\n![Images](img/f0561-03.jpg)\n\n此设置在系统重启后丢失。运行 `setsebool -P`\
  \ 可使设置在重启后依然有效。\n\n一些常用的布尔值见 表 16-4。布尔值存储在 `/sys/fs/selinux` 目录，可以使用以下命令列出：\n\n\
  ![Images](img/f0561-01.jpg)\n\n**表 16-4** 常见的 SELinux 布尔选项\n\n![Images](img/f0561-04.jpg)\n\
  \n### 审计 SELinux\n\n最后，为了良好的 SELinux 管理，必须讨论 SELinux 审计。首先，安装 `setroubleshoot-server`\
  \ 包以跟踪 SELinux 通知。消息将存储在 `/var/log/audit/audit.log` 中。\n\n可以使用 `sealert` 读取 `/var/log/audit/audit.log`\
  \ 文件：\n\n![Images](img/f0561-05.jpg)\n\n要了解 SELinux 操作失败的详情，请运行 `audit2why`，如下：\n\
  \n![Images](img/f0562-01.jpg)\n\n来自 `audit2why` 的输出详细说明了 `useradd` 命令由于 `type` 设置不当导致的问题。`audit2allow`\
  \ 工具扫描 `audit.log` 中被拒绝的 `useradd` 操作，并生成帮助操作成功的策略，如下：\n\n![Images](img/f0562-02.jpg)\n\
  \n最后，你可以使用 `semanage` 命令配置 SELinux 策略。运行以下命令修改 `useradd` 命令的上下文：\n\n![Images](img/f0562-03.jpg)\n\
  \n`fcontext` 子命令为 `useradd` 命令添加文件上下文，`-a` 和 `-t` 选项向文件上下文添加 `type usr_t`。`-C` 和\
  \ `-l` 选项提供文件上下文自定义的本地列表。\n\n### 实现 AppArmor\n\n与 SELinux 类似，AppArmor 为文件系统访问提供了强制访问控制（MAC）功能。它还包含一个“学习”模式，允许系统观察应用程序行为并设置配置文件，以便应用程序安全运行。配置文件根据应用程序权限限制应用程序与进程及文件的交互方式。\n\
  \n配置文件随 Linux 提供，但也会随应用程序提供，或由管理员自定义构建和调整。这些配置文件位于 `/etc/apparmor.d/` 目录，是包含规则和能力的简单文本文件。配置文件可以使用调优参数（tunables）进行调整，调优参数位于\
  \ `/etc/apparmor.d/tunables/`，是简单的全局变量定义，允许配置文件迁移到不同的环境。\n\n配置文件可以在强制模式（enforce\
  \ mode）或投诉模式（complain mode）下运行。强制模式以允许的最小权限运行。投诉模式类似于 SELinux 的允许模式，仅记录事件。这是在转换为强制模式之前测试\
  \ AppArmor 的极佳方法。\n\n使用 `apparmor_status` 显示 AppArmor 的状态：\n\n![Images](img/f0563-01.jpg)\n\
  \n如果存在处于强制模式的配置，且你想将该配置切换到投诉模式，请使用 `aa-complain` 命令：\n\n![Images](img/f0563-02.jpg)\n\
  \n这将 `/etc/apparmor.d` 目录下的所有配置置于投诉模式。要将所有配置恢复为强制模式，请使用 `aa-enforce`：\n\n![Images](img/f0563-03.jpg)\n\
  \n要禁用配置文件，请使用 `aa-disable`。例如，要禁用 CUPS 打印配置，请运行：\n\n![Images](img/f0563-04.jpg)\n\
  \n网络安全是一个巨大的问题，恶意攻击者从世界各地攻击系统以访问受害者的计算机或网络。要查看未受 AppArmor 保护的 PID 和网络进程，请运行命令 `aa-unconfined`，然后判断不受限制进程是否需要\
  \ AppArmor 保护：\n\n![Images](img/f0563-05.jpg)\n\n### 练习 16-2：管理 SELinux 上下文\n\n\
