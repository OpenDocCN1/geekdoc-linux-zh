  \ `N`\n**C.** `?`\n**D.** `/`\n\n### 答案\n\n**1.** **A.** Linux 使用文本文件存储操作系统以及运行在系统上的应用程序或服务的配置参数。\n\
  \n**2.** **D.** `vi` 要求用户在退出之前将缓冲区的内容写入磁盘。用户可以通过在命令末尾添加 `!` 来覆盖任何错误。因此，命令行命令 `:q!`\
  \ 将退出文件而不将缓冲区中的新条目写入磁盘。\n\n**3.** **A, C.** `Esc 1G` 和 `Esc gg` 都会将光标移动到文档的第一行（顶部）。\n\
  \n**4.** **C.** 因为要加载的文件不在当前目录中，Phillip 在启动 `vi` 时必须提供文件的完整路径及其文件名。\n\n**5.** **D.**\
  \ 因为 Karrye 没有指定路径，`vi` 将在她的当前目录下创建文件，这正是她想要的。\n\n**6.** **C.** 默认情况下，`vi` 在普通模式下打开。\n\
