  \n**8.** **A.** 按键序列 `Esc R` 使 `vi` 进入替换模式。\n\n**9.** **C.** 按键序列 `Esc R` 使 `vi`\
  \ 进入替换模式。\n\n**10.** **C.** `vi` 默认以普通模式打开。\n\n**11.** **B.** `vi` 要求用户在退出之前将缓冲区的内容写入磁盘。\n\
  \n**12.** **C, D, E.** `Esc 1G` 和 `Esc gg` 都会将光标移动到文档的第一行（顶部）。\n\n**13.** **A.**\
  \ `:q!` 将退出文件而不将缓冲区中的新条目写入磁盘。\n\n**14.** **B.** `de` 删除单词而不删除该单词后的空格。\n\n**15.**\
  \ **A.** `/server` 将向前搜索字符串“server”。\n\n**16.** **B.** `N` 将反向搜索方向。\n\n\n\n\n当你执行像\
  \ `ls` 这样的命令时，会创建一个子 shell 或子进程来与操作系统交互。这个新的子进程最初是父进程 `bash` 进程的副本，但使用一个新的 PID。`exec`\
  \ 系统调用会将新的 PID 覆盖为 `ls` 命令。一旦 `ls` 命令完成，它就会退出，并显示提示符以运行下一个命令。该过程在图 3-2 中进行了详细说明。\n\
  \n![Images](img/F03-02.jpg)\n\n**图 3-2**  一个 进程的生命周期\n\n![Images](img/note.jpg)\n\
  \n**注意**   `spawn`（派生）术语用于描述父进程创建子进程。\n\n## 管理变量\n\n`variable`（变量）是一个被分配了名称并用于存储数据的内存位置。变量用于配置\
  \ shell 环境或临时存储程序数据。当用户注销或系统关闭时，存储在这些内存位置中的数据将会丢失。\n\n我们将讨论的两种变量是 shell 变量和环境变量。\n\
  \n### Shell 变量\n\nShell 变量只存在于创建它的 shell 内存空间中。这意味着，当在父进程中创建 shell 变量时，该变量在该进程中可用，但*不在*任何子进程中可用。\n\
  \n创建 shell 变量的语法为 `<variable_name>=<value>`。命令 `flower=rose` 创建 shell 变量 `flower`\
  \ 并存储单词 `rose`。执行命令 `flower=daisy` 将 shell 变量 `flower` 的内容更改为单词 `daisy`。\n\n要查看变量的内容，执行命令\
  \ `echo $<variable_name>`。`echo` 命令显示一行文本。变量名前的美元符号（`$`）是一个元字符，它会将变量名替换为存储在变量中的值。因此，如果变量\
  \ `flower` 的当前值为 `daisy`，则命令 `echo $flower` 将显示输出 `daisy`。\n\n`set` 命令显示当前进程中所有\
  \ shell 变量和函数的列表。图 3-3 显示了 `set` 命令的部分输出。\n\n![Images](img/F03-03.jpg)\n\n**图 3-3**\
  \  `set` 命令的局部输出\n\n### 环境变量\n\n与 shell 变量不同，环境变量*对*子进程可见。例如，`EDITOR` 变量包含系统编辑器的名称。如果没有进行赋值，`vi`\
  \ 将成为用户的默认编辑器。如果用户更喜欢 `nano` 编辑器，他们必须通过命令 `EDITOR=nano` 更改 `EDITOR` 变量的值来覆盖 `vi`\
  \ 作为默认编辑设置。由于 `EDITOR` 目前是一个 shell 变量，在创建子进程时它将不再存在。\n\n要将 shell 变量转换为环境变量，你需要为变量分配一个\
  \ `export` 属性。当父进程派生子进程时，所有具有此属性的变量对子进程可见，如图 3-4 所示。\n\n![Images](img/F03-04.jpg)\n\
  \n**图 3-4**  父进程和子进程中 shell 变量与环境变量的可见性\n\n![Images](img/exam.jpg)\n\n**考试提示** \
  \  CompTIA Linux+ 考试可能会显示一个使用 `;` 的*复合命令*来设置环境变量，如下：`<variable_name>=<value>;export\
  \ <variable_name>`。此外，你也可以如下所示定义环境变量：`export <variable_name>=<value>`。\n\n要创建环境变量，执行命令\
  \ `export <variable_name>=<value>`。例如，命令 `export truck=chevy` 创建环境变量 `truck` 并将其赋值值\
  \ `chevy`，该变量现在父进程和子进程中均可用。\n\n通过运行命令 `export <variable_name>` 将现有的 shell 变量转换为环境变量；这为现有变量分配了\
  \ `export` 属性。`unset` 命令删除变量并从环境中移除。`env` 命令显示当前 shell 中所有环境变量的列表。\n\n![Images](img/note.jpg)\n\
  \n**注意**   运行 `declare -p <variable_name>` 显示变量的属性。输出中属性部分中的 `-x` 表示它是一个环境变量。\n\n\
  ## 配置别名\n\n`alias`（别名）是一个命令快捷方式。默认情况下，`ls` 命令显示单色输出。要实现彩色输出，执行 `ls --color=auto`。为了避免每次都输入\
  \ `--color=auto` 选项，可以使用以下命令语法创建别名：\n\n`alias <alias_name>='<command>'`\n\n命令 `alias\
  \ ls='ls --color=auto'` 创建了一个替换默认 `ls` 的别名。别名的优先级高于所有其他命令，因此每次运行 `ls` 命令时，都会执行命令\
  \ `ls --color=auto`。\n\n![Images](img/note.jpg)\n\n**注意**   别名仅在创建它的 shell 中存在。\n\
  \n图 3-2 显示了别名 `ls='--color=auto'` 的彩色输出（尽管示例图中是单色的）。*（注：此处根据上下文逻辑翻译，原文意为描述别名效果）*\n\
  \n（注：由于提供的原文文本在此处出现了错乱或重复描述，翻译时已根据逻辑进行了平滑处理）\n\n\n\n\n执行命令 `locale -a` 或 `localectl\
  \ list-locales` 会列出可用的区域（locale）名称。命令 `localectl list-locales | grep en` 显示所有英语的区域名称。运行\
  \ `locale` 可显示当前会话的区域类别值，如下：\n\n![Images](img/f0077-04.jpg)\n\n变量 `LANG` 存储当前登录会话的区域名称。以下区域名称显示在这种情况下，当前会话使用美英语字符集，并使用\
  \ UTF-8 编码，而不是其他编码。\n\n![Images](img/f0078-01.jpg)\n\n变量 `LC_ALL` 会覆盖所有的区域类别设置以及\
  \ `LANG` 变量。\n\n## `localectl` 命令\n\n`localectl` 命令用于查看和修改系统区域及键盘设置。例如，命令 `localectl\
  \ set-locale LANG=<locale_name>` 设置默认的系统区域变量。\n\n命令 `localectl set-locale LANG=en_CA.UTF-8`\
  \ 会修改 `/etc/locale.conf` 文件，该文件存储了系统区域和键盘映射设置。使用 `localectl` 或 `localectl status`\
  \ 来验证 `/etc/locale.conf` 文件的更改。\n\n![Images](img/exam.jpg)\n\n**考试提示** 确保你知道如何使用\
  \ `localectl status` 验证 `/etc/locale.conf` 中的更改，以及如何使用 `localectl list-locales`\
  \ 列出区域。\n\n### 字符编码\n\n关于字符编码的章节在这里是为了供你参考；字符编码*不包含*在 CompTIA Linux+ 考试目标中。\n\n\
  字符书写符号。字符集是用于特定目的的定义字符列表。英语字母表是一个包含 26 个字母、10 个数字和 14 个标点符号的字符集。\n\n字符通过为字符分配一个数值来存储。为字符分配数值的过程被称为\
  \ `encoding`（编码）。所存储的值被称为 `code point`（码点）。编码格式定义了用于存储字符的位数（`code unit`，代码单元）以及字符的存储方式。\n\
  \n让我们简要查看 ASCII 和 UTF 编码格式。\n\n### ASCII 入门\n\n美国信息交换标准代码（ASCII）字符集使用 7 位代码单元。ASCII\
  \ 支持多达 128 个字符（95 个可打印字符、32 个控制代码和 1 个空格字符）。扩展 ASCII 使用 8 位代码单元，可以支持 256 个字符。\n\n\
  ### Unicode 入门\n\nASCII 和 EBCDIC 等编码格式的代码单元大小无法存储所有不同的世界字符。Unicode 使用变长和固定编码格式来提供多达\
  \ 32 位的代码单元，并可以存储 1,114,112 个不同的字符。\n\nUnicode 定义了三种编码格式：UTF-8、UTF-16 和 UTF-32（参见表\
  \ 3-2）。\n\n![Images](img/f0079-01.jpg)\n\n**表 3-2** Unicode 编码格式\n\nUTF-8 和 UTF-16\
  \ 使用多达 32 位变长编码来存储字符。变长编码使用 `code point`（码点）或编码值的最高位来决定如何解码字符信息。UTF-32 使用 `fixed\
  \ encoding`（固定编码），这意味着所有 32 位（4 字节）都用于存储一个字符。\n\n### 设置时间\n\nLinux 操作系统使用两个时钟：硬件时钟（也称为实时时钟\
  \ RTC）和系统时钟。RTC 是一个电池供电电路，即使在移除系统电源时也能保持时间。\n\n系统时钟是操作系统时钟。在启动过程中，系统时钟被设置为与硬件时钟相同的值。从那一刻起直到操作系统终止，系统时钟由内核维护。系统时钟使用协调时（UTC）报告时间，并取决于各个进程将\
  \ UTC 转换为本地时间。\n\n![Images](img/note.jpg)\n\n**注意** UTC 是一种时间标准，称为 Zulu 时间。\n\n\
  #### `date` 命令\n\n`date` 命令主要用于报告来自系统时钟的信息并管理它。`date` 命令显示日、月、时间（24 小时制）、时区和年份。\n\
  \n![Images](img/f0079-02.jpg)\n\n通过 `date` 命令的加百分比功能（plus-percent），你可以通过输入 `date\
  \ +%M` 获取当前分钟、`date +%H` 获取当前小时或 `date +%Y` 获取当前年份来仅打印分钟、小时或年份。表 3-3 列出并定义了额外的百分比代码，完整列表可以在\
  \ `date` 的手册页中找到。\n\n![Images](img/f0080-01.jpg)\n\n**表 3-3** `date` 命令百分比代码\n\n\
  系统管理员可以使用以下格式通过 `date -s` 命令设置日期时间：\n\n`\"日 月 日 时间 时区 年份\"`\n\n下面的插展示了使用 `date -s`\
  \ 的示例：\n\n![Images](img/f0080-02.jpg)\n\n#### `/usr/share/zoneinfo/` 和 `/etc/localtime`\
  \ 文件\n\n`/usr/share/zoneinfo/` 目录和 `/etc/localtime` 文件用于配置系统的时区。该目录包含全球时区的二进制数据文件，并通过将来自\
  \ `zoneinfo` 的文件链接到 `/etc/localtime` 来设置默认系统级时区。\n\n命令 `date`、`date +%Z`、`ls -l\
  \ /etc/localtime` 和 `timedatectl` 显示当前的系统时区。\n\n![Images](img/exam.jpg)\n\n**考试提示**\
  \ 尚未讨论过的 `ls` 选项是 `ls -d`，意味着不进入目录。用户将看到目录名称但不会看到目录中列出的文件。运行 `ls -ld` 来查看目录权限而非文件权限；例如：\n\
  \n```\n# ls -ld /usr/share/zoneinfo/\n```\n\n要重置系统级时区，通过运行 `unlink /etc/localtime`\
  \ 或 `\\rm /etc/localtime` 删除指向 `/etc/localtime` 的当前符号链接。（符号链接将在第 5 章](#ch5.xhtml_ch5)中详细介绍）。然后，像下面的示例所示创建一个符号链接来设置太平洋时间：\n\
  \n```\nln -sf /usr/share/zoneinfo/America/Pacific_Angeles /etc/localtime\n```\n\n\
  #### `hwclock` 命令\n\n`hwclock` 命令用于管理实时时钟 RTC。命令 `hwclock`、`hwclock -r` 和 `hwclock\
  \ --show` 显示本地时间的硬件时钟时间，如下：\n\n![Images](img/f0081-01.jpg)\n\n右侧输出显示时间偏移。将偏移量应用于显示的时间即可产生实际时间。\n\
  \n命令 `hwclock -s` 或 `hwclock --hctosys`（硬件时钟到系统时钟）使用 RTC 设置系统时间。命令 `hwclock -w`\
  \ 或 `hwclock --systohc`（系统时钟到硬件时钟）将硬件时钟设置为系统时间。\n\n#### `timedatectl` 命令\n\n`timedatectl`\
  \ 或 `timedatectl status` 命令用于查看和管理系统时钟。执行命令 `timedatectl` 输出所示：\n\n![Images](img/f0081-02.jpg)\n\
  \n第 6 行和第 7 行确认网络时间协议（NTP）已启用并正在与 NTP 服务器同步，每 11 分钟同步一次。关于 NTP 的细节将在第 14 章](#ch14.xhtml_ch14)中介绍。\n\
  \n`timedatectl list-timezones` 显示时区列表。`timedatectl set-timezone \"<时区>\"` 命令立即更改系统级时区。\n\
  \n例如，命令 `timedatectl set-timezone \"America/New_York\"` 立即将系统时区改为东部时间。在后台，该命令更新了\
  \ `/etc/localtime` 与 `/usr/share/zoneinfo/America/New_York` 之间的符号链接。\n\n#### 设置系统时间和日期\n\
  \n`timedatectl set-time 'HH:MM:SS'` 命令设置系统时间。要更改系统日期，执行命令 `timedatectl set-time\
  \ 'YYYY-MM-DD'`。命令 `timedatectl set-time 'YYYY-MM-DD HH:MM'` 将同时更改系统时间和日期。\n\n如果启用了通过\
  \ NTP 的自动时间同步，则使用 `timedatectl` 命令设置时间将不起生效。\n\n\n\n\n在上一节中，你学习了如何通过命令行管理变量、shell\
  \ 选项和别名，以及如何更改系统的区域和时间设置。在命令行执行的变量、别名和 shell 选项设置存储在内存中。当用户注销系统时，这些设置将会消失。\n\n但当你创建了让工作更简单的别名和变量时，你想保留这些设置。配置文件定义了即使在注销或重启后仍然持久的设置。\n\
  \nbash 配置文件有：\n\n* `/etc/profile`\n* `/etc/bashrc`\n* `/home/<user_name>/.bash_profile`\n\
  * `/home/<user_name>/.bashrc`\n* `/home/<user_name>/.bash_logout`\n\n`/etc/profile`\
  \ 和 `/etc/bashrc` 文件是系统级配置文件，在用户用户登录时应用于所有适用用户。位于用户家目录（`/home/<user_name>``）的文件包含*仅*属于该用户的配置信息。\n\
  \n`/etc/profile` 和 `/home/<user_name>/.bash_profile` 文件包含一组用于配置用户工作环境的命令，例如环境变量。`/etc/bashrc`\
  \ 和 `/home/<user_name>/.bashrc` 文件用于配置 Bash shell 特性，例如别名。使用 `/home/<user_name>/.bash_logout`\
  \ 在注销期间执行操作，例如从垃圾箱中删除超过 30 天的文件。\n\nCompTIA Linux+ 考试需要理解的概念包括：\n\n* 登录脚本顺序\n* `source`\
  \ 命令\n\n让我们先讨论登录脚本顺序。\n\n### 登录脚本顺序\n\n当用户登录 Linux 系统时，当使用 Bash shell 时，自定义脚本按以下顺序被读取：\n\
  \n1. `/etc/profile`\n2. `/home/<user_name>/.bash_profile`\n3. `/home/<user_name>/.bashrc`\n\
  4. `/etc/bashrc`\n\n`/etc/profile` 文件在登录时读取一次，用户可能会发现这些环境变量：\n\n* `HOSTNAME`: 或节点的主机名\n\
  * `MAIL`: 用户接收邮件所在的文件；例如，`MAIL=/var/spool/mail/<user_name>`\n\n`/home/<user_name>/.bash_profile`\
  \ 文件用于为用户自定义 bash 环境，并在登录时读取一次。该文件包含用于配置用户工作环境的变量，例如默认编辑器。用户可能会发现这些设置：\n\n* `EDITOR`:\
  \ 默认编辑器设置；例如，`EDITOR=/usr/bin/nano`\n* `PATH`: 能够找到可执行程序的目录搜索路径\n\n`/home/<user_name>/.bashrc`\
  \ 文件用于自定义 Bash shell 的运行方式，包含别名、函数或 shell 参数。`/home/<user_name>/.bashrc` 在 GUI 环境中每次启动\
  \ shell（伪终端）时都会执行。此文件可能包含别名，如下所示：\n\n![Images](img/f0083-01.jpg)\n\n![Images](img/exam.jpg)\n\
  \n**考试提示**：Linux 使用波浪号 (`~`) 字符表示 `/home/<user_name>/` 或用户的家目录。例如，对于当前登录的用户，`/home/<user_name>/.bashrc`\
  \ 可以表示为 `~/.bashrc`。\n\n`/etc/bashrc` 文件在伪终端启动时也会被读取，可能包含这些设置：\n\n* `SHELL`: 此会话的命令\
  \ shell；例如，`/bin/bash`\n* `PS1`: 命令行提示符配置\n\n![Images](img/note.jpg)\n\n**注意**：目录\
  \ `/etc/profile.d` 中的脚本包含特定程序的配置信息，并在登录过程中自动读取或*加载 (sourced)*。以 `.sh` 结尾的文件在使用 Bourne、Korn\
  \ 或 Bash shell 时会被加载。以 `.csh` 结尾的文件在使用 C-shell 时会被加载。\n\n### `source` 命令\n\n配置的更改在存储到内存中或被*加载\
  \ (sourced)* 之前是不生效的。要将更改放入内存，用户必须执行配置文件中的命令。`source <filename>` 或 `. <filename>`（注意开前的点和空格）会执行配置文件中的命令。\n\
  \n一旦用户对如 `~/.bash_profile` 等配置文件进行了更改，他们可以运行 `source ~/.bash_profile` 或 `. ~/.bash_profile`\
  \ 来使配置更改立即生效。\n\n### 练习 3-1：使用变量、参数和别名\n\n此练习让你能够练习创建和删除变量、别名和 shell 选项，以及编辑 shell\
