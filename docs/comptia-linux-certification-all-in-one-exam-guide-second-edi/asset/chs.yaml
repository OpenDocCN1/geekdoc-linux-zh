  \ -ld` 验证目录已创建。\n11. 执行 `ls -R`。注意没有目录。\n12. `mkdir -p pastry/cakes` 创建子目录。\n13.\
  \ 执行 `ls -R pastry` 查看子目录。\n14. 尝试使用 `rmdir pastry` 删除 `pastry` 目录。为什么这个命令不起作用？\n\
  15. 执行 `rm -r pastry`。目录删除了吗？\n16. 使用 `vi` 创建内容为 `This is filea` 的文件 `filea`。\n\
