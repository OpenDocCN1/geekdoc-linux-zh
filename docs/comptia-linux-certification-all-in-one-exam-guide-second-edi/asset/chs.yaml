  \ updatedb &`\n\n**4.** 下列哪个命令可以切换到 `root` 用户账户并加载 `root` 的环境变量？\nA. `su -`\nB.\
  \ `su root`\nC. `su root -e`\nD. `su -env`\n\n\n\n\n\n### [5]. 下列哪一个是强密码？\n\n* \
