  \ `--add` 选项标记设备故障、移除或添加。\n\n### 问题\n\n1. 哪种类型的备份备份自全量备份以来修改的文件，且不标记这些文件为更新？\n\n\
  A. 全量\nB. 增量\nC. 差异\nD. 部分\n\n2. 系统管理员将 `/etc` 备份到挂载在 `/mnt/USB` 的可移动硬盘上。哪个 `tar`\
  \ 命令可以实现此操作？\n\nA. `tar -cvf /mnt/USB/backup.tar /etc`\nB. `tar -xvf ~/backup.tar\
  \ /etc`\nC. `tar -xzf /mnt/USB/backup.tar /etc`\nD. `tar -cvf /mnt/USB/backup.tar\
  \ ~/etc`\n\n3. 哪个命令将创建用户家目录下 `Projects` 目录中所有文件的压缩 `cpio` 存档到 `/mnt/usbdrive/Projectsbackup.io.gz`？\n\
  \nA. `cpio -ov ~/Projects | gzip > /mnt/usbdrive/Projectsbackup.io.gz`\nB. `ls ~/Projects\
  \ | cpio -ovz | > /mnt/usbdrive/Projectsbackup.io.gz`\n\n\n\n\n\n### C. `ls ~/Projects\
  \ | cpio -ov | gzip >`\n`/mnt/usbdrive/Projectsbackup.cpio.gz`\n\n### D. `cpio -ovz\
  \ ~/Projects >`\n`/mnt/usbdrive/Projectsbackup.cpio.gz`\n\n### 4. 使用哪个命令可以将 `/dev/sda2`\
  \ 分区的镜像创建在 `/mnt/usb/volback` 文件中？\n\n**A.** `dd if=/dev/sda2 of=/mnt/usb/volback`\n\
  **B.** `cp /dev/sda2 /mnt/usb/volback`\n**C.** `dd if=/mnt/usb/volback of=/dev/sda2`\n\
  **D.** `dd if=/dev/sda of=/mnt/usb/volback`\n\n### 5. 在 `/dev/sdc` 硬盘上创建一个新的 GPT\
  \ 分区。在 shell 提示符运行 `gdisk /dev/sdc` 后，哪个子命令将创建一个大小为 100GB 的新分区？\n\n**A.** `n`\n\
  **B.** `p`\n**C.** `new -size=100G`\n**D.** `t`\n\n### 6. 在 Linux 服务器上添加第三块 1TB\
  \ 固态硬盘 (SSD) 后，需要将其作为存储空间添加到名为 `DATA` 的 LVM 卷组。应该先输入哪个命令来实现此？\n\n**A.** `vgextend\
  \ DATA /dev/sdc`\n**B.** `pvscan /dev/sdc DATA`\n**C.** `pvcreate /dev/sdc`\n**D.**\
  \ `lvextend -L 1T -n DATA`\n\n### 7. 填写空以创建快照的选项。（选择两个。）\n\n`lvcreate -L 1G ____\
  \ -n snapshot DATA`\n\n**A.** `--clone`\n**B.** `-s`\n**C.** `--snapshot`\n**D.**\
  \ `--snap`\n\n### 8. 哪种 RAID 系统有两个额外的硬盘用于校验校验？\n\n**A.** RAID 0\n**B.** RAID 1\n\
  **C.** RAID 5\n**D.** RAID 6\n\n### 9. 哪些命令可以将逻辑卷文件系统从 500MB 扩展到 1000MB？（选择两个。）\n\
  \n**A.** `lvextend -L +500 /dev/lvm1`\n**B.** `lvextend -L +500M /dev/lvm1`\n**C.**\
  \ `lvextend -L 1000 /dev/lvm1`\n**D.** `lvextend -L 1000M /dev/lvm1`\n\n### 10.\
  \ 哪个命令默认压缩文件？\n\n**A.** `tar`\n**B.** `cpio`\n**C.** `dd`\n**D.** `xz`\n\n### 11.\
  \ 运行哪个命令来验证 RAID 状态？\n\n**A.** `mdadm --detail /dev/md0`\n**B.** `lvdisplay`\n**C.**\
  \ `lvs`\n**D.** `mkfs.ext4 /dev/md0`\n\n### 12. 将扩展文件系统的步骤按正确的顺序上。\n\n**A.** `resize2fs`\n\
  **B.** `pvcreate`\n**C.** `lvextend`\n**D.** `vgextend`\n\n### 答案\n\n**1. C.** 增量备份备份自上次全备以来修改过的所有文件，并且不会标记这些文件为已备份。\n\
  \n**2. A.** `tar -cvf /mnt/USB/backup.tar /etc` 命令使用了正确的语法。\n\n**3. C.** `ls ~/Projects\
  \ | cpio -ov | gzip > /mnt/usbdrive/Projectsbackup.cpio.gz` 命令将生成 `Projects` 目录下的文件列表，将列表发送给\
  \ `cpio` 命令创建存档，并将存档发送给 `gzip` 进行压缩。\n\n**4. A.** `dd if=/dev/sda2 of=/mnt/usb/volback`\
  \ 命令将 `/dev/sda2` 分区的镜像创建在 `/mnt/usb/volback` 文件中。\n\n**5. A.** 在 `gdisk` 中，输入 `n`\
  \ 创建新分区。之后，用户将被提示指定其大小。\n\n**6. C.** 在 `gdisk` 中，输入 `n` 创建新分区。之后，用户将被提示指定其大小。\n\n\
  **7. B, C.** `lvcreate -L 1G -s -n snapshot DATA` 使用了 `-s` 或 `--snapshot` 标志。\n\n\
  **8. D.** RAID 6 有两个额外的硬盘用于校验。\n\n**9. B, D.** `lvextend -L +500M /dev/lvm1` 和 `lvextend\
  \ -L 1000M /dev/lvm1` 用于扩展卷。\n\n**10. D.** `xz` 默认压缩文件。\n\n**11. A.** `mdadm --detail\
  \ /dev/md0` 用于验证 RAID 状态。\n\n**12. B, D, C, A.** 正确顺序是 `pvcreate`、`vgextend`、`lvextend`，然后是\
  \ `resize2fs`。\n\n\n\n\n关于用户进程的关键点是，它们是在 shell 内部被调用的，并与该 shell 会话相关。\n\n然而，系统上运行的所有进程并不是用户进程。事实上，在给定的\
  \ Linux 系统上执行的大多数进程可能是不同类型，被称为`system processes`（系统进程）或`daemons`守护进程）。与用户进程不同，系统进程（通常）不为终端用户提供应用程序或接口。相反，系统进程用于提供系统服务，例如\
  \ Web 服务器、FTP 服务器、如 Samba 的文件服务、如 CUPS 的打印服务或日志服务。此类进程在后台运行，且通常不提供任何种类的用户界面。\n\n\
  例如，考虑执行 `ps -e` 命令后在图 9-1 中所示的进程。该图仅显示了几行输出，但 `-e` 选项显示了系统上运行的每一个进程，而不仅仅是你的进程。\n\
  \n![Images](img/F09-01.jpg)\n\n**图 9-1** 系统进程\n\n![Images](img/note.jpg)\n\n**注意**\
  \ 大多数系统进程的名称末尾都有一个字母 `d`，代表守护进程。系统运行着许多系统进程，这些进程是在内核启动后加载的，因此它们与 shell 无关。用户进程则绑定到调用它们的\
  \ shell 实例上。\n\n默认情况下，大多数 Linux 发行版在启动时都配置了许多自动启动的守护进程。其中某些守护进程对系统的整体功能至关重要。\n\n\
  在实现新的 Linux 系统时（无论是服务器还是工作站），关闭所有不需要守护进程是明智的。运行不必要的进程会消耗系统资源，例如内存和 CPU 时间。更严重的是，不必要的进程还会引发巨大的安全漏洞。注意正在运行哪些系统服务。如果需要该服务，就保留它；如果不需要，就删掉它！\n\
  \n## Linux 进程是如何加载的\n\n所有 Linux 进程都由单个进程加载——取决于发行版，可能是旧的 `SysVinit` (`init`) 或较新的\
  \ `systemd`——该进程由 Linux 内核在系统启动时启动。要理解 Linux 系统上运行的任何进程都可以启动额外的进程。启动新进程的进程被称为 `parent\
  \ process`（父进程）。新进程本身被称为 `child process`（子进程）。就本文讨论而言，`systemd` 也意味着 `init`。）这种父/子关系构成了\
  \ Linux 进程的 `heredity`（继承关系），如图图 9-2 所示。\n\n![Images](img/F09-02.jpg)\n\n**图 9-2**\
  \ 进程代代\n\n在图 9-2 中，祖父进程产生了三个子进程。这三个子进程中的每一个又了自己的子进程。\n\n对于 Linux 系统上的任何进程，你都需要能够唯一地识别它及其继承关系。每当\
  \ Linux 系统上创建一个进程时，它会被分配两个资源：\n\n- **进程 ID (`PID`) 数字**：分配给每个进程的数字，用于在系统中唯一地标识它。\n\
  - **父进程 ID (`PPID`) 数字**：该进程父进程的 `PID`（即产生它的进程）。\n\n通过为每个进程分配这两个数字，你可以跟踪整个系统内任何进程的继承关系。Linux\
  \ 内核使用进程表来跟踪系统上运行的进程。进程表由操作系统在内存中维护，以便于进程之间的切换、进程调度和进程优先级排序。表中的每个条目都包含一个特定运行中进程的信息，如进程名称、进程状态、进程优先级以及进程所使用的内存地址。\n\
  \n![Images](img/note.jpg)\n\n**注意** 较旧发行版仍使用 `SysVinit` 或 `init`。现代 Linux 版本已迁移到\
  \ `systemd`，这是目前出于安全和性能考虑的的选择。\n\n内核在启动期间自动加载 `systemd` 进程。随后 `systemd` 进程启动子进程（例如登录\
  \ shell），这些子进程又启动其他进程（例如 `vi` 工具使用的进程），如图图 9-3 所示。\n\n![Images](img/F09-03.jpg)\n\
  \n**图 9-3** 作为所有其他进程祖父的 `systemd` 进程\n\n新进程会被分配下一个最高的可用 `PID` 数字，而 `systemd` 始终被分配\
  \ `PID` `1`。这引出了一个有趣的点：如果 `systemd` 是所有其他进程衍生的第一个进程，那么它的 `PPID` 是什么？它真的有吗？实际上，它是有的。因为\
  \ `systemd` 进程是由 Linux 内核直接启动的（内核的 PID 始终为 `0`），所以 `systemd` 进程的 `PPID` 始终为 `0`。这在图\
  \ 9-4 中所示。\n\n![Images](img/F09-04.jpg)\n\n**图 9-4** `systemd` 进程的 `PPID`\n\n`systemd`\
  \ 进程负责启动所有配置为启动自动启动的系统进程。它还会创建一个用于登录的登录 shell。\n\n这引出了重要点。注意图 9-3 中登录 shell 下方的第二个\
  \ Bash shell。有人问：“我不能直接在登录 shell 内部运行 `vi` 吗？我必须启动第二个 Bash shell 吗？”实际上，在图中，`vi`\
  \ 是从登录 shell 启动的。那么，为什么图中 `vi` 进程和登录 shell 之间显示了第二个 shell 呢？因为用户从任何 shell 内部运行命令时，都会创建一个在该其中运行的\
  \ `subshell`（子 shell）。子 shell 本身是一个独立的进程，并分配有自己的 `PID`。子 shell 的 `PPID` 是输入命令的 shell\
  \ 的 `PID`。\n\n![Images](img/F09-05.jpg)\n\n**图 9-5** 从 shell 提示符运行进程\n\n只要命令在使用，子\
  \ shell 进程就会保持活动。命令进程在子 shell 中运行并被分配自己的 `PID`。命令进程的 `PPID` 当然是其运行所在的子 shell 的 `PID`。当命令进程完成并退出时，子\
  \ shell 终止，控制权返回原始 shell 会话。这种创建新子 shell 并在其中运行命令进程的过程被称为 `forking`。）。\n\n例如，在图\
  \ 9-5 中，用户在 Bash shell 的 shell 提示符处发布了 `vi` 命令。创建一个子 shell 并在其中运行 `vi` 进程。当用户退出\
  \ `vi` 时，子 shell 被销毁，控制权返回原始 shell 实例。\n\n## 管理进程\n\n管理运行进程是 Linux 系统执行的关键任务之一。本节涵盖以下主题：\n\
  \n- 启动系统进程\n- 查看运行中的进程\n- 进程优先级排序\n- 管理前台和后台进程\n- 结束运行中的进程\n- 注销后保持进程运行\n\n### 启动系统进程\n\
  \n在 Linux 系统上启动进程有两种基本方法。对于用户进程，只需在 shell 提示符处输入命令或脚本名称。例如，要运行 `vi` 程序，只需在 shell\
  \ 提示符处输入 `vi`。完成后，`vi` 进程被创建，如下所示：\n\n![Images](img/f0255-01.jpg)\n\n然而，对于系统进程，使用\
  \ `init` 脚本或服务文件，取决于发行版使用 `init` 还是 `systemd`。系统服务管理启动服务器 (HTTPD)、文件传输协议 (FTP) 服务器、安全\
  \ shell (SSH) 服务器、域名系统 (DNS) 服务器等的进程。\n\n\n\n\n\n这些脚本存储在特定的目录中，其位置取决于 Linux 发行版（详细信息在第\
  \ 11 章中讨论）。例如，对于基于 `init` 的系统，实际脚本位于 `/etc/init.d/` 目录。每当在系统上安装服务时，相应的 `init` 脚本会自动安装到该目录。一旦到位，管理员就可以简单地通过命令行提示符运行它来执行任何脚本。语法如下：\n\
  \n```\n/etc/init.d/<script_name> start | stop | restart\n```\n\n例如，要在 Microsoft\
  \ Windows 系统上启用文件和打印服务，可以在 shell 提示符处输入 `/etc/init.d/smb start` 来启动 Samba。要停止它，输入\
  \ `/etc/init.d/smb stop`。要重启它，输入 `/etc/init.d/smb restart`。\n\n如果 Linux 发行版使用 `systemd`\
  \ 而不是 `init`，则系统服务使用具有 `.service` 扩展名的文件进行管理。在 shell 提示符中使用 `systemctl` 命令来启动、停止、重启或检查系统服务的状态：\n\
  \n- 要启动服务，输入 `systemctl start <service_name>`\n- 要停止服务，输入 `systemctl stop <service_name>`\n\
  - 要重启服务，输入 `systemctl restart <service_name>`\n- 要查看服务状态，输入 `systemctl status <service_name>`\n\
  \n例如，在运行 `systemd` 的发行版上启用 `sshd` 守护进程，可以在 shell 提示符处输入 `systemctl start sshd`。\n\
  \nLinux 管理员必须熟悉 `systemd` 和 `systemctl` 命令。`systemd` 工具优于 `SysVinit` 或 `init`，因为它能高效处理依赖关系并执行并行启动，从而使系统启动和运行的速度快得多。\n\
  \n![Images](img/exam.jpg)\n\n**考试提示** 对于考试来说，了解一些 `systemd` 命令（如 `systemctl`）及其子命令是非常关重要的。\n\
  \n### 查看运行中的进程\n\n本节介绍了如何查看系统上运行的进程，并详细介绍了以下工具：\n\n- 使用 `top` 和 `htop`\n- 使用 `ps`\n\
  - 使用 `pgrep` 和 `pidof`\n\n### 使用 `top` 和 `htop`\n\nLinux 提供了多种工具来查看系统上运行的进程。两个流行的工具包括\
  \ `top` 和 `htop` 程序。它们列出进程并每三秒更新一次进程状态，按 CPU 利用率进行排序。只需在 shell 提示符处输入 `top` 即可运行它。完成后，将显示图\
  \ 9-6 所示界面。\n\n![Images](img/F09-06.jpg)\n\n**图 9-6** 使用 `top` 查看运行中的进程\n\n在图 9-6\
  \ 中，注意 `top` 显示了一些运行中的进程，每行一个。`top` 报告有助于检测高 CPU 利用率和高运行队列。以下列用于显示每个进程的信息：\n\n-\
  \ `PID`：进程的 ID。\n- `USER`：所有进程的用户用户名。\n- `PR`：分配给进程的优先级。\n- `NI`：进程的 `nice` 值（`nice`\
  \ 将本文稍后讨论）。\n- `VIRT`：进程使用的虚拟内存量。\n- `RES`：进程使用的物理内存量（驻留大小），以 KB 为单位。\n- `SHR`：进程使用的共享内存量。\n\
  - `S`：进程状态。可能的值包括：\n    - `D`：不可中断睡眠\n    - `R`：运行中\n    - `S`：睡眠\n    - `T`：追踪或停止\n\
  \    - `Z`：僵尸进程\n\n![Images](img/note.jpg)\n\n**注意** 僵尸进程已完成执行，但在其父进程死亡后无法纯洁地退出。由于\
  \ `systemd` 成为新的父进程，僵尸最终会自行清除。如果失败了，你可以尝试杀死该僵尸进程，或等待下一次计划的重启。这个名字听起来很吓人，但僵尸对系统无害的，只会占用一个进程槽位。\n\
  \n- `%CPU`：进程使用的 CPU 时间的百分比。\n- `%MEM`：进程使用的可用物理内存百分比。\n- `TIME+`：进程自启动以来消耗的 CPU\
  \ 总时间。\n- `COMMAND`：启动该进程时输入的命令名称。\n\n你不仅可以按默认的 CPU 利用率对 `top` 和 `htop` 的输出进行排序，还可以按内存利用率（按\
  \ `M` 键）、`PID`（按 `N` 键）或返回 %CPU（按 `P` 键）。此外，为了查看更多进程，按 `向上箭头`和`向下箭头`键滚动查看大量进程。`左箭头`和`右箭头`键显示有关运行进程的更多详细信息，例如它们的完整路径。\n\
  \n`htop` 命令具有额外的功能，如颜色编码、通过鼠标滚动操作进程输出，以及提供帮助、搜索和其他排序功能的功能键。图 9-7 显示了 `htop` 输出的示例。\n\
  \n![Images](img/F09-07.jpg)\n\n**图 9-7** 使用 `htop` 查看运行中的进程\n\n在 `top` 运行期间，按下 `?`\
  \ 键可以显示帮助。了解如 `systemctl` 及其子命令等几个 `systemd` 命令对于考试很重要。\n\n[此处为翻译内容内容]\n\n在图 9-6\
