  \ 将字母转换为数字\n\n`tr` 命令可以使用 `-s` 选项来*压缩*或替换多次出现的连续字符。在图 13-20 中，我们使用压缩选项来删除字段之间的多个空格，使得字段之间只保留一个空格。命令\
