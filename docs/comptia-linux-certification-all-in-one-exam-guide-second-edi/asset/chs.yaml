  **D.** `repeat`\n\n**4.** 哪个系统活动报告函数将列出 CPU、RAM、I/O、磁盘活动等，并每两秒显示五次输出显示结果？\n\n**A.**\
  \ `sar -A -s 2`\n**B.** `sar -A -s 2 -i 5`\n**C.** `sar -A 5 2`\n**D.** `sar -A\
  \ 2 5`\n\n**5.** 哪些命令列出内存性能信息？（选择两个）\n\n**A.** `vmstat`\n**B.** `memviewer`\n**C.**\
  \ `perfmonitor`\n**D.** `lsram`\n**E.** `sar`\n\n**6.** 哪个命令显示 Linux 系统上有多少可用内存和交换空间？\n\
  \n**A.** `free`\n**B.** `swapon -s`\n**C.** `dd`\n**D.** `lsram`\n\n**7.** 哪个内核变量可以更改为\
  \ `none`、`mq-deadline`、`kyber` 或 `bfq` 以更改驱动 `/dev/sda` 上的存储调度？\n\n**A.** `/proc/block/sda/queue/scheduler`\n\
  **B.** `/sysv/block/sda/queue/scheduler`\n**C.** `/sys/block/sda/queue/scheduler`\n\
  **D.** `/sys/block/sda1/queue/scheduler`\n\n**8.** 哪个命令将显示磁盘 I/O 延迟？\n\n**A.** `pingio`\n\
  **B.** `diskio`\n**C.** `lsdisk`\n**D.** `ioping`\n\n**9.** 哪些命令显示磁盘 I/O 速率？（选择两个）\n\
  \n**A.** `lssda`\n**B.** `sar`\n**C.** `iostat`\n**D.** `swapon`\n\n**10.** 哪个命令将阻止对\
