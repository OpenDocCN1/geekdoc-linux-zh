  **C.** `ls -l /etc/localtime`\n**D.** `date +%Z`\n\n### 答案\n\n**1.** 在派生新进程时，变量不会被复制。\n\
  **2.** `set` 命令显示 shell 变量列表。\n**3.** 从 `/home/student1/.bashrc` 中删除变量赋值；从 `/home/student1/.bash_profile`\
  \ 中删除变量赋值。\n**4.** 变量 `test` 从子进程中删除。\n**5.** `export <variable_name>=value` 和 `<variable_name>=<value>;export\
  \ <variable_name>`。\n**6.** `<variable_name>=<value>` 和 `set`。\n**7.** `export <variable_name>=value`、`export\
  \ <variable_name>` 和 `env`。\n**8.** `/rm` 和 `\\rm`。\n**9.** `>>`。\n**10.** `&>`、`2>&1`\
  \ 和 `2 <`（注：此题逻辑可能指特定的重定向组合，此处按常见逻辑分析）。\n**11.** 覆盖文件 `error1` 的内容；追加到文件 `error2`。\n\
  **12.** `error2`。\n**13.** `noclob` 已开启，必须使用 `set +noclob` 关闭。\n**14.** `LC_ALL`。\n\
  **15.** 执行 `.etc/locale`。\n**16.** `date` 和 `hwclock`。\n**17.** `/usr/share/zoneinfo`。\n\
  **18.** `timedatectl`、`date`、`ls -l /etc/localtime` 和 `date +%Z`。\n\n\n\n\n\n###\
  \ 8. **C, D.** 反斜杠 (`\\`) 取消特殊字符的特殊含义；当放置在别名命令之前时，它会取消该别名。你也可以提供命令的绝对路径。命令的绝对路径优先级高于别名、函数和内置命令。\n\
  \n### 9. **C.** `>` 和 `>>` 符号重定向文件的标准输出（stdout）。`>>` 符号在文件不存在时创建文件，如果文件存在则追加到文件末尾，因此它是这种场景的最佳选择。`>`\
  \ 符号在文件不存在时创建文件，但如果文件存在则覆盖文件。`2>` 操作符重定向标准错误并会覆盖文件。`2>>` 则重定向标准错误并追加到文件。\n\n###\
  \ 10. **A, B, C.** 运算符 `&>` 将标准输出和标准错误均重定向到同一个文件。运算符 `1>&2` 将标准输出重定向到标准错误（即同一个文件）。运算符\
  \ `2>&1` 将标准错误重定向到标准输出。\n\n### 11. **A, D.** `>` 运算符创建文件或覆盖文件内容。`>>` 运算符创建文件或追加文件。\n\
  \n### 12. **B.** 运算符 `2>` 重定向标准错误。在问题 11 中，运算符 `2>>` 将错误信息追加到文件 `error2` 中。\n\n\
  ### 13. **D.** bash 选项 `noclobber` 防止将标准输出重定向到现有文件。命令 `set +o noclobber` 关闭该选项。\n\
  \n### 14. **D.** `LC_ALL` 变量会覆盖所有本地分类变量和 `LANG` 变量。\n\n### 15. **B.** 每当你修改了 `/etc/locale.conf`\
  \ 时（无论是通过 `localectl` 命令还是手动操作），都必须通过执行命令 `. /etc/locale.conf` 或 `source /etc/locale.conf`\
  \ 将新配置读取到内存中。\n\n### 16. **A, C.** 命令 `date` 和 `timedatectl` 显示系统时（操作系统时）信息。\n\n\
  ### 17. **C.** 目录 `/usr/share/zoneinfo/` 包含时区数据文件。\n\n### 18. **A, B, C, D.** 这些命令的每个输出都会显示当前的系统时区。\n\
  \n# 第 4 章\n## 管理 Linux 用户和组\n\n在本章中，你将学习到：\n\n* Linux 用户和组\n* 创建和管理 Linux 用户账户\n\
  \n*“这一切都是关于员工数据分析的。”*\n—Ed Smith, Novell\n\nLinux 是一个多用户操作系统，因此有必要限制用户仅访问其有权限的资源。本章介绍\
  \ Linux 用户和组。\n\n## 理解 Linux 用户和组\n\nLinux 使用一种名为自主访问控制（DAC）的方法来允许或限制对文件的访问。在基于\
  \ DAC 的系统中，账户所有者决定谁有权限访问、删除或修改其文件。\n\n在本节中，你将学习有关以下细节：\n\n* Linux 用户账户\n* 显示用户和组\
  \ ID（ID）\n\n![Images](img/note.jpg)\n\n**注意** Linux 支持一种更细粒度的权限结构，称为强制访问控制（MAC），它将访问分为机密、秘密、特机密等。这些权限由\
  \ `SELinux` 或 `AppArmor` 控制，正如第 16 章 中讨论。\n\n### Linux 用户账户\n\n`user` 是需要访问系统文件或资源的个人或服务。`user\
  \ account` 提供或限制访问系统资源的方法。\n\n##### Linux 用户 ID 和权限\n\nLinux 实现用户 ID 范围来组织用户。根据用户\
  \ ID (`UID`)，个人将拥有较少或许多权限。大多数用户是标准用户，对系统文件的访问有限，而名为 `root` 的管理账户可以在计算机上执行任何功能。接下来将讨论这些\
  \ `UID` 及其权限的细节。\n\n**用户 ID 0–99 的含义**\n管理用户 0–99 在安装过程中被添加到操作系统。根据 Linux Standard\
  \ Base (LSB) 核心规范，此范围内的用户账户由操作系统创建，可能无法由应用程序（如 `LibreOffice`）创建。\n\n**万能的 `root`\
  \ 账户**\n`root` 账户是一个具有完全控制权的特权用户。`root` 可以做任何事情，例如：\n\n* 删除任何文件\n* 杀死任何作业\n* 关机\n\
  \n`root` 拥有所有文件的权限。`root` 的用户 ID 为 0。\n\n![Images](img/note.jpg)\n**注意** Linux 不限制用户数量。将用户\
  \ ID 0 分配给多个用户是可能的，但不建议。\n\n**用户账户和系统账户**\n用户账户是对系统的非权限访问。用户 ID 范围由 `login.defs`\
  \ 中的 `UID_MIN` 和 `UID_MAX` 指定。默认 `UID` 为 1000，最大 `UID` 为 60000，取决于 CPU 型和 Linux\
  \ 版本。\n\nLinux 服务（后台运行的应用程序）可能会被分配 0–99 范围内的用户账户，或 `login.defs` 中 `SYS_UID_MIN`\
  \ 和 `SYS_UID_MAX` 之间的值。\n\n![Images](img/note.jpg)\n**注意** 系统账户是通过执行命令 `useradd\
  \ --system <system_account_name>` 创建的。许多服务没有分配用户账户。\n\n##### Linux 用户账户信息的存储位置\n\
  \n为了 CompTIA Linux+ 考试，你将学习 Linux 在本地系统上存储用户配置文件。用户和组的信息存储在以下文件中：\n\n* `/etc/passwd`:\
  \ 包含账户信息\n* `/etc/shadow`: 包含用户密码和密码过期信息\n* `/etc/group`: 包含组列表及其成员\n\n**介绍用户数据库文件\
  \ `/etc/passwd`**\n`/etc/passwd` 文件是平文件数据库的示例。文件的每行包含一条唯一的用户记录。每个记录包含七个字段。冒号 (`:`)\
  \ 被分隔符来区分字段。\n\n`/etc/passwd` 文件中记录的格式如下：\n\n![Images](img/f0101-01.jpg)\n\n下面的示例说明了\
  \ `/etc/passwd` 用户记录中的字段：\n\n![Images](img/f0101-02.jpg)\n\n以下是每个字段的内容：\n\n* `User_Name`:\
  \ 用户名是一个唯一的单词，用于识别具有访问权限的用户。用户名由管理员提供。通常这遵循基于公司策略的约定，例如 `firstname.lastname`，或者名字的首字母和姓氏的前七个字母。\n\
  \n\n\n\n\n- `Password`: 当 UNIX 最初开发时，用户的加密密码存储在此字段中。遗憾的是，`/etc/passwd` 文件的权限允许所有人读取该文件，导致密码很容易被劫持和破解。现在密码存储在高安全性的\
  \ `/etc/shadow` 文件中，只有 `root` 用户才能读取。\n\n- `UID`: Linux 内核通过用户 ID（user ID）而不是用户名来识别用户。用户\
  \ ID 是分配给每个用户的数字标识符，并映射到其用户名。每个用户 ID 都应该是唯一的。然而，尽管这不是一种安全的做法，但你可以将多个用户名映射到同一个用户\
  \ ID。\n\n- `GID`: 此字段包含用户主组（primary group）的组 ID 数字（用户允许成为多个组成员）。当用户创建一个文件时，其主组 ID\
  \ 被分配为文件的组所有者。要组成员关系位于 `/etc/group` 中。\n\n- `Comment`: 默认情况下，此字段包含用户的全名。在添加或修改用户账户时，你可以更改在该字段中显示的信息。（传统上这被称为\
  \ `GECOS` 字段，全称为 General Electric Comprehensive Operating Supervisor，是 GE/Honeywell\
  \ 主机的一种操作系统。）\n\n- `Home_Directory`: 此字段包含用户主目录的绝对路径。当用户登录时，他们会自动进入此目录。\n\n- `Default_Shell`:\
  \ 此字段包含要使用的 shell 解释器的绝对路径（例如 `/bin/bash`）或一个命令。大多数 Linux 系统默认使用 Bourne-Again Shell\
  \ 或 Bash (`/bin/bash`），但某些用户使用 Korn shell (`/bin/ksh`）或 C-Shell (`/bin/csh`）。CompTIA\
  \ Linux+ 考试仅涵盖 Bash shell。\n\n![Images](img/note.jpg)\n\n**注意**: 系统账户不需要默认 shell。你会发现这些账户在\
  \ във字段中有 `/sbin/nologin` 或 `/bin/false`。这两者都会阻止登录。`/bin/false` 会立即退出登录过程。`/sbin/nologin`\
  \ 会显示位于 `/etc/nologin` 中的消息并退出登录过程。\n\n### 介绍受保护的用户密码文件 `/etc/shadow`\n\n加密密码曾经存在\
  \ `/etc/passwd` 文件中，该文件是所有人可见的。这使得 Linux 系统容易受到黑客的攻击，黑客可以下载并破解密码。Linux 开发者构建了 shadow\
  \ 工具并将密码移动到 `/etc/shadow` 文件中。现在密码只有 `root` 用户可见。\n\n`/etc/shadow` 文件是一个扁平文件数据库，存储了用户密码和密码老化过期信息。`/etc/passwd`\
  \ 中的每条记录在 `/etc/shadow` 中都应该有一个对应的记录。`/etc/shadow` 文件中的记录格式如下：\n\n![Images](img/f0102-01.jpg)\n\
  \n以下是一个使用 `grep` 命令通过脱字符符号 (`^`) 在从 `/etc/shadow` 文件中搜索位于行首的账户 `student1` 的示例：\n\
  \n![Images](img/f0102-02.jpg)\n\n以下是每个字段的内容：\n\n- `Username`: 这是用户的登录名。\n\n- `Password`:\
  \ 此字段以加密格式存储用户的密码。如果此字段只包含两个感叹号（如图 4-1 所示），则表示从未分配过账户密码。\n\n![Images](img/F04-01.jpg)\n\
  \n**图 4-1**: 由于 `!!`，用户没有分配密码。\n\n- `Last_Modified`: 此字段显示自 1970 年 1 月 1 日以来密码最后更改的天数。此数字用于计算密码老化日期。\n\
  \n- `Min_Days`: 此字段显示更改密码前所需的最少天数。默认值在 `/etc/login.defs` 中指定。\n\n- `Max_Days`: 此字段显示密码过期前的最大天数。默认值在\
  \ `/etc/login.defs` 中指定。\n\n- `Warn_Days`: 此字段显示在密码过期前用户将收到即将过期的警告的天数。默认值在 `/etc/login.defs`\
  \ 中指定。\n\n- `Inactive`: 此字段显示密码过期后用户账户被禁用的天数。此字段的目的是防止未使用的开放账户。\n\n在密码过期和超过非活动天数之间，用户可能仍然登录，但将被强制更改密码。超过非活动天数后，账户将被禁用，并需要管理员处理这种情况。默认的\
  \ `INACTIVE` 值在 `/etc/default/useradd` 中指定。\n\n- `Expire`: 在密码过期和超过非活动天数之间，用户可能仍然登录，但将被强制更改密码。\n\
  \n### 介绍受保护的用户密码文件 `/etc/shadow`\n\n`/etc/shadow` 文件是一个扁平文件数据库，存储了用户密码和密码老化过期信息。`/etc/passwd`\
  \ 中的每条记录在 `/etc/shadow` 中都应该有一个对应的记录。`/etc/shadow` 文件中的记录格式如下：\n\n![Images](img/f0102-01.jpg)\n\
  \n以下是一个使用 `grep` 命令通过脱字符符号 (`^`) 在从 `/etc/shadow` 文件中搜索位于行首的账户 `student1` 的示例：\n\
  \n![Images](img/f0102-02.jpg)\n\n以下是每个字段的内容：\n\n- `Username`: 这是用户的登录名。\n\n- `Password`:\
  \ 此字段以加密格式存储用户的密码。如果此字段只包含两个感叹号（如图 4-1 所示），则表示从未分配过账户密码。\n\n![Images](img/F04-01.jpg)\n\
  \n**图 4-1**: 由于 `!!`，用户没有分配密码。\n\n- `Last_Modified`: 此字段显示自 1970 年 1 月 1 日以来密码最后更改的天数。此数字用于计算密码老化日期。\n\
  \n- `Min_Days`: 此字段显示更改密码前所需的最少天数。默认值在 `/etc/login.defs` 中指定。\n\n- `Max_Days`: 此字段显示密码过期前的最大天数。默认值在\
  \ `/etc/login.defs` 中指定。\n\n- `Warn_Days`: 此字段显示在密码过期前用户将收到即将过期的警告的天数。默认值在 `/etc/login.defs`\
  \ 中指定。\n\n- `Inactive`: 此字段显示密码过期后用户账户被禁用的天数。此字段的目的是防止未使用的开放账户。\n\n在密码过期和超过非活动天数之间，用户可能仍然登录，但将被强制更改密码。超过非活动天数后，账户将被禁用，并需要管理员处理这种情况。默认的\
  \ `INACTIVE` 值在 `/etc/default/useradd` 中指定。\n\n### 显示用户和组 ID\n\n当用户登录系统时，他们会被分配存储在\
  \ `/etc/passwd` 中的用户 ID。这个用户 ID 称为 `UID`，组 ID 称为 `GID`。使用 `id` 命令查看当前的 `UID` 和 `GID`。\n\
  \n##### 使用 `w` 和 `who` 显示登录用户\n\n`w` 命令显示所有登录用户的用户 ID (`UID`)、他们正在执行的进程以及这些进程执行的设备。`who`\
  \ 命令与 `w` 命令类似，但不显示正在执行的进程。\n\n##### 使用 `su` 切换用户 ID\n\n`su` 或“切换用户”命令允许用户通过切换用户\
  \ ID (`UID`) 和组 ID (`GID`) 来假设另一个用户的权限。非 `root` 用户必须知道他们切换到的用户的密码。\n\n`su` 有两种格式：\n\
  \n- `su <username>`: 当前用户的 `UID`、主组 ID 和主目录。\n\n- `su - <username>`: 执行相同的操作，还会读取新用户的配置（即，读取该用户所有的配置文件）。本质上，“su\
  \ dash”允许你完全变得和新用户一样。\n\n\n\n\n\n1. 你正以用户 `root` (`UID 0`) 的身份登录。第 1 行的 `tty` 命令显示你正在从伪终端\
  \ `/dev/pts/0` 显示内容。\n\n2. 在第 4 行，执行 `w` 命令显示用户名。第 8 行显示用户 `root` 正在伪终端 `/dev/pts/0`\
  \ 上运行 `w` 进程，来自 X-Window 显示终端 `:0`（有关 X-Window 的详细信息请参见第 20 章）。\n\n3. 在第 10 行执行\
  \ `id` 命令来验证 `UID`。\n\n4. 在第 13 行，执行命令 `su student1`。这会将用户 ID 更改为用户 `student1` (`UID\
  \ 1000`)。\n\n5. 当执行命令 `w` 并查看第 15 行时，你会看到是以 `root` 登录的，但执行命令 `whoami`（第 21 行）和 `id`（第\
  \ 24 行）时，由于之前执行了 `su` 命令（不带“横杠”），你会发现有效用户 ID 为 `student1` 或 `1000`。\n\n6. 注意在第 27\
  \ 行尝试执行 `useradd` 命令时，你会发现无法执行。尽管你以 `root` 身份登录（其本应该能够执行 `useradd` 命令），但有效用户 ID\
  \ 是 `1000` (`student1`)，且 `student1` 没有执行 `useradd` 命令的权限。\n\n### 从命令行创建和管理用户账户\n\
  \n系统管理员使用 `useradd` 命令创建用户账户。账户创建后，用户需要使用 `passwd` 命令设置密码。如果需要更改用户的 ID 或用户组，则由 `usermod`\
  \ 处理。最后，为了更好的安全，管理员需要使用 `chage` 设置密码规则。在本节中，你将学习有关以下细节：\n\n* 使用 `useradd` 备新用户\n\
  * 使用 `groupadd` 备新工作组\n\n让我们复习如何创建和管理用户账户。\n\n### 使用 `useradd` 备新用户\n\n`useradd`\
  \ 程序用于向 Linux 系统添加用户。`useradd` 命令最初从 `/etc/login.defs` 获取默认值，随后从 `/etc/default/useradd`\
  \ 获取。`/etc/skel/` 目录下的项目用于填充新用户的家目录。\n\n#### 重要的 `useradd` 选项\n\n使用以下 `useradd`\
  \ 选项可以自定义用户的家目录、登录 shell 等等：\n\n* `-c`: 用户注释字段。出于安全考虑，请确保注释不包含个人信息。\n* `-e`: 指定用户账户被禁用的日期（`-e\
  \ YYYY-MM-DD`）。\n* `-g`: 指定用户的主组。\n* `-G`: 指定用户的辅助组成员关系。管理员可以输入用逗号分隔的组名或组 ID 列表。\n\
  * `-d`: 定义家目录的位置。\n* `-m`: 创建（制作）家目录。如果 `/etc/login.defs` 中的变量 `CREATE_HOME` 为 `yes`，则不需要此选项。\n\
  * `-r`: 指定所创建的用户为系统用户。系统用户 ID 将处于 `/etc/login.defs` 中由 `SYS_UID_MIN` 和 `SYS_UID_MAX`\
  \ 指定的范围内。\n* `-s`: 指定用户默认 shell 的绝对路径。\n* `-u`: 允许管理员手动指定用户 ID。\n\n任何未在命令行指定的所需的设置都由\
  \ `/etc/login.defs` 和 `/etc/default/useradd` 提供。\n\n#### 在 `/etc/default/useradd`\
  \ 中设置默认值\n\n`/etc/default/` 目录用于指定默认变量设置。`/etc/default/useradd` 文件包含 `useradd` 命令使用的默认变量，除非被\
  \ `/etc/login.defs` 中的设置覆盖。要查看 `/etc/default/useradd` 中设置的值，请执行以下命令：\n\n![Images](img/f0107-01.jpg)\n\
  \n要更改 `/etc/default/useradd` 中大多数变量的值，请执行命令 `useradd -Dx`。可用选项请参见表 4-1。\n\n![Images](img/f0107-04.jpg)\n\
  \n**表 4-1** 更改 `/etc/default/useradd` 中的默认项\n\n#### 设置用户邮件的默认位置\n\n`/etc/login.defs`\
  \ 中的以下项目指定了用户邮件的存储位置`/etc/default/useradd` 中变量 `CREATE_MAIL_SPOOL` 的值决定了添加用户时是否会创建文件。\n\
  \n![Images](img/f0107-02.jpg)\n\n`/etc/login.defs` 中的以下值设置了密码老化默认值最小密码长度，除非在 `/etc/pam.d/passwd`\
  \ 文件中被覆盖：\n\n![Images](img/f0107-03.jpg)\n\n![Images](img/note.jpg)\n\n**注意** 默认的老化设置存在安全风险。建议在\
  \ `/etc/default/useradd` 中更改 `INACTIVE=30`。同时更改 `/etc/login.defs` 中默认的最小、最大和警告天数。以下设置将更安全：\n\
  \n![Images](img/f0108-01.jpg)\n\n#### 通过 `/etc/skel/` 目录构建用户一致性\n\n`/etc/skel/`\
  \ 目录是默认目录，其中包含了在创建新用户时会复制到该新用户家目录中的文件和目录。如果你希望所有新用户都拥有特定的文件或设置，可以修改此目录中的文件。\n\n\
  你还可以为有需求的用户创建一个骨架目录。假设你有一个特定组，需要在 `/home/<username>/.bash_profile` 和 `/home/<username>/.bashrc`\
  \ 中设置特定配置，并且你有一些可用脚本。创建一个名为 `/etc/skel_<group_name>/` 的目录。接下来，将 `/etc/skel/` 中的所有文件复制到该目录，编辑相应的配置文件，并将任何额外文件添加到新目录中。\n\
  \n为该组添加用户时，使用选项 `-k <skel_directory>`（例如 `useradd -k /etc/skel_<group_name> <user_name>`）。\n\
  \n#### 使用 `passwd` 设置密码\n\n`passwd` 程序允许你或 `root` 更改密码，并允许系统管理员密码老化。\n\n作为 `root`，你可以定义密码在必须更改之前可以存在多久，指定密码更改之前的警告天数，并指定用户在再次更改密码之前必须等待的最小天数以防止重复使用密码。\n\
  \n用户可以通过执行命令 `passwd` 来更改自己的密码。与其他操作系统中在输入新密码时可能出现 `****` 不同的是，终端上不会显示任何内容。\n\n\
  ![Images](img/f0108-02.jpg)\n\n用户 `root` 可以通过执行命令 `passwd <username>` 来更改用户的密码。系统管理员可能使用的其他\
  \ `passwd` 选项包括：\n\n* `-l`: 锁定用户账户但不删除当前密码。使用 `passwd -l` 锁定的账户的加密密码在 `/etc/shadow`\
  \ 中的密码前会有两个感叹号 (`!!`)。\n* `-u`: 解锁用户账户。\n* `-n`: 设置更改密码前所需的最小天数 (`MIN_DAYS`)。\n\
  * `-x`: 设置密码必须更改的最大天数 (`MAX_DAYS`)。\n* `-w`: 设置密码过期前的警告天数 (`WARN_DAYS`)，用户将在此时收到过期警告。\n\
  * `-i`: 设置密码过期后禁用账户前等待的闲置天数。\n* `-S`: 显示密码老化信息。下一节提到的，执行 `chage -l <username>` 命令也可以显示密码老化信息。\n\
  \n如果 `/etc/shadow` 中的 `Password` 字段中有星号 (`*`)，如图 4-3 所示，该账户被禁用。管理员必须从 `/etc/shadow`\
  \ 的 `Password` 字段中删除星号以重新启用账户。在 `1–99` 范围内的不需要密码的用户账户在该字段中显示星号。\n\n![Images](img/F04-03.jpg)\n\
  \n**图 4-3** 禁用的账户\n\n\n\n\n你可以通过命令 `passwd -e <username>` 强制账户过期，从而强制用户在下次登录时更改密码，或者通过命令\
  \ `chage -d 0 <username>` 将最后修改日期设为 `0`。\n\n## 使用 `chage` 命令更改密码过期策略\n\n`chage`（更改老化）命令允许你查看或更改用户的密码过期信息。\n\
  \n命令 `chage -l` 用于显示当前用户的过期信息。作为系统管理员，运行命令 `chage -l <username>` 可以显示特定用户的密码过期信息。\n\
  \n让我们来看一些其他系统管理员 `chage` 选项：\n\n- `-d YYYY-MM-DD`:更改用户的最后修改日期\n- `-m`:设置更改密码前所需的最少天数（`MIN_DAYS`）\n\
  - `-M`:设置密码必须更改的最大天数（`MAX_DAYS`）\n- `-W`:设置密码过期前多少天（`WARN_DAYS`）在此期间用户将收到密码即将过期的警告\n\
  - `-I`:设置 `INACTIVE`（密码过期后禁用账户的等待天数）\n- `-E YYYY-MM-DD`:设置账户过期日期\n\n系统管理员还可以使用命令\
  \ `chage <username>` 来更改用户的密码过期信息。该命令会打开一个文本用户界面（TUI），逐个引导每个老化参数，显示当前值并允许更改值，如图\
  \ 4-4\n\n**图 4-4** 使用 `chage` 文本用户界面\n\n## 使用 `usermod` 修改用户设置\n\n`usermod` 命令用于修改现有用户账户。`usermod`\
  \ 的选项与 `useradd` 类似，但有几处变化：\n\n- `-G <group_name>`:移除用户所有的 `secondary`（辅助）组，并替换为新的辅助组或逗号分隔的辅助组列表。\n\
  - `-aG <group_name>`:添加一个新的辅助组。\n- `-l`:更改用户名（登录名）。\n- `-d`:更改用户主目录的位置。\n- `-m`:移动（重命名）当前用户的主目录到新用户名。以下命令将用户\
  \ `student2` 重命名为 `user2`：\n\n```\nusermod -l user2 -d /home/user2 -m student2\n\
  ```\n\n## 使用 `userdel` 撤销用户\n\n`userdel` 命令用于删除用户账户。命令 `userdel <username>` 会从 `/etc/passwd`\
  \ 和 `/etc/shadow` 中删除用户的记录，但其主目录和文件将保留，以便以后分配给新用户或进行存档备份。\n\n要删除用户的主目录和邮件，请执行命令\
  \ `userdel -r <username>`。以这种方式撤销用户时，请务必先备份他们的文件！\n\n![Images](img/exam.jpg)\n\n\
  **考试提示**：如果在使用 `userdel` 命令时不使用 `-r` 选项，你必须手动删除用户的主目录、`cron` 作、`at` 任务和邮件。\n\n`userdel`\
  \ 或 `userdel -r` 都不会从 `/etc/group` 中删除任何组。\n\n你将在练习 4-1 中练习管理用户。\n\n## 练习 4-1：从命令行管理用户账户\n\
  \n在此练习中，你将练习在 Linux 系统的 shell 提示符下创建和修改用户账户。你可以使用随本书附的虚拟机进行此练习。\n\n![Images](img/video.jpg)\n\
  \n**视频**：请观看练习 4-1 视频演示如何执行此任务。\n\n完成以下步骤：\n\n1. 启动你的 Linux 系统并以 `root` 用户登录，密码为\
