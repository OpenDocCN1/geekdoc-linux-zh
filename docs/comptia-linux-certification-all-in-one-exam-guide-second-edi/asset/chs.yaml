  \ shell 的 PPID 是步骤 a 中发现的 PID 来验证子 shell 是否已打开。\n\n**d.** 尝试执行 `ldetc` 来确定步骤 23\
  \ 中创建的别名是否存在。\n\n或者，执行命令 `alias`、`alias ldetc` 或 `alias grep | ldetc` 来列出内存中的别名。\n\
  \n**27.** 通过退出当前进程（`exit`）返回父 shell。\n\n**28.** 执行命令 `unalias ldetc` 别名 `ldetc`。使用命令\
  \ `alias`、`alias ldetc` 或 `alias | grep ldetc` 验证别名已从内存中移除。\n\n**29.** 使用 `vi` 在文件\
