  \ 是符号链接。查看文件的 inode 节点数。它们相同还是不同？为什么？\n19. 执行命令 `cat filea; cat fileb` 查看文件内容。输出是你预期的吗？\n\
  20. 执行命令 `ln filea filec` 创建源文件为 `filea`、目标文件为 `filec` 的硬链接。\n21. 执行命令 `cat filea;\
  \ cat fileb; cat filec` 查看文件内容。\n\n\n\n\n\n22. 执行 `ls -il file[a-c]` 命令来测试第 20 步中执行命令的结果。查看\
  \ `filea` 和 `filec` 的属性。注意这些文件具有相同的 inode，且共享该 inode 的链接数为 `2`。这是为什么？\n\n23. 执行\
  \ `\\rm filea` 命令删除 `filea`。\n\n24. 执行命令 `ls -l file[a-c]` 并检查输出。注意 `filec` 中共享\
  \ inode 的文件数量，并注意 `fileb` 是断开的链接。\n\n25. 使用 `vi` 命令创建一个内容为 `This is new filea` 的新\
  \ `filea`。\n\n26. 执行 `ls -il file[a-c]` 命令。注意符号链接不再断开。这是为什么？\n\n27. 执行 `cat filea;\
  \ cat fileb; cat filec` 命令。输出符合你的预期吗？\n\n28. 执行 `ls -l fileb` 和 `file fileb` 命令。\n\
  \n29. 执行 `ls /var/lib/mlocate/mlocate.db` 和 `file /var/lib/mlocate/mlocate.db` 命令。\n\
  \n30. 执行 `ls -il touchtest` 命令。注意时间戳。执行命令 `touch touchtest` 并再次查看时间戳。\n\n31. 使用\
  \ `touch cpytest` 命令创建文件 `cpytest`。\n\n32. 执行 `ls -l cpytest` 命令。注意该文件所有用户 `student1`。\n\
  \n33. 执行命令 `su -` 并按 `Enter` 键。当询问 `root` 密码时，输入 `password`。\n\n34. 执行 `id` 或 `whoami`\
