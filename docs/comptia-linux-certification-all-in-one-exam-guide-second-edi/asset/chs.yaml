  \ 13-7 中的第 5–10 行定义了函数 `timestamp`，它在第 15 行和 23 行被调用。\n\n![Images](img/f0408-01.jpg)\n\
  \n**图 13-7**  脚本中的函数示例\n\n## 使用控制运算符\n\n控制运算符改变脚本的流。在脚本中，控制运算符用于形成测试条件和循环结构。在本节中你将学习：\n\
  \n* 表达式运算符\n* 条件测试\n* 使用循环结构\n\n### 表达式运算符\n\n表达式使用运算符评估条件是否真（退出状态码 `0`）或假（退出状态码非零）。表达式运算符适用于字符串和整数。\n\
  \n### 字符串运算符\n\n字符串被表达式用于测试字符串（参见表 13-3）。比较基于 ASCII 字符集。\n\n![Images](img/f0409-01.jpg)\n\
  \n**表 13-3**  字符串运算符\n\n![Images](img/note.jpg)\n\n**注意**  表 13-3 描述中的左右括号 `[ ]`\
  \ 是 `test` 命令的替代方案，将在本书稍后讨论。\n\n### 关系运算符\n\n关系运算符传统上用于整数。表 13-4 显示了一些关系运算符。\n\n\
  ![Images](img/f0409-02.jpg)\n\n**表 13-4**  关系运算符\n\n![Images](img/note.jpg)\n\n\
  **注意**  表 13-4 描述中的左右双括号 `(( ))` 是用于整数的 `test` 命令，将在章节稍后讨论。\n\n### 算术运算符\n\n在算术表达式中，你使用表\
  \ 13-5 所示的算术运算符之一。\n\n![Images](img/f0410-01.jpg)\n\n**表 13-5**  算术运算符\n\n### 布尔运算符\n\
  \n布尔运算符用于连接多个表达式。在图 13-8 的第 7 行，我们使用运算符 `-a`（`AND` 布尔）来指定两个必须为真才能使表达式为真的条件。部分布尔运算符显示在表\
  \ 13-6 中。\n\n![Images](img/F13-08.jpg)\n\n**图 13-8**  使用布尔运算符\n\n![Images](img/f0410-03.jpg)\n\
  \n**表 13-6**  布尔运算符\n\n##### 文件测试运算符\n\n文件测试运算符用于测试文件的属性（参见表 13-7）。权限和所有权测试基于执行脚本的用户。\n\
  \n![Images](img/f0411-01.jpg)\n\n**表 13-7**  文件测试运算符\n\n图 13-9 插图了脚本 `file_test_operator.bash`，它包含了文件表达式的示例。\n\
  \n![Images](img/F13-09.jpg)\n\n**图 13-9**  file_test_operator.bash\n\n#### 条件测试\n\
  \n\n\n\n\n`if` 语句扩展了 `test` 命令的使用，允许我们根据 `test` 语句的退出状态来引导脚本的流。如果测试条件为真（true）或退出状态为\
  \ `0`，则执行 `test` 语句直接下方的命令或命令。\n\n如果测试条件为假（false）或退出状态非零，则可以使用两种流程控制元素之一。`else`\
  \ 语句表示当原始测试条件为真时要执行的命令。`elif` 语句开启另一个测试条件。所有的 `if` 语句都以 `if` 的反写形式 `fi` 结尾，所示：\n\
  \n![Images](img/f0413-03.jpg)\n\n图 13-11 显示了 `if_then_script_1.bash`，图 13-12 显示了\
  \ `multi-user_script.bash`，展示了使用 `if`、`else` 和 `elif` 的示例。\n\n![Images](img/F13-11.jpg)\n\
  \n**图 13-11** 示例 `if_then_test_script_1.bash`\n\n![Images](img/F13-12.jpg)\n\n**图\
  \ 13-12** `if then else` 示例\n\n![Images](img/note.jpg)\n\n**注意** 若要更清晰地查看图 13-11\
  \ 以及本章其他选定的图像，请从本书的在线内容下载全分辨率图像。\n\n### `case` 语句\n\n与使用多个嵌套的 `if` 语句相比，使用 `case`\
  \ 是一种更高效的选择方式。它类似于 JavaScript 或 C 语言中的 `switch` 语句，使用命令行的第一个参数或表达式来确定其将执行的操作。\n\n\
  `case` 语句被分为多个段落（stanzas），每个选择都以 `;;` 结尾，并具有以下结构，以 `case` 的反写 `esac` 结尾：\n\n![Images](img/f0414-03.jpg)\n\
  \n`case` 语句会将输入参数与段落开头的字符串进行比较。如果字符串匹配，则执行该段落。注意图 13-13 中的最后一个段落（脚本 `case_script.bash`，第\
  \ 13 行）以 `*)` 开头。该条目用于处理任何不匹配 `case` 语句中任何字符串的用户输入。图 13-14 展示了使用 `case` 语句的结果。\n\
  \n![Images](img/F13-13.jpg)\n\n**图 13-13** 示例 `case` 语句\n\n![Images](img/F13-14.jpg)\n\
  \n**图 13-14** `case` 脚本输出\n\n#### 循环结构的使用\n\n`if/then/else` 和 `case` 结构被称为分支结构。根据条件评估的结果，脚本会在一个方向或另一个方向进行分支。你也可以在\
  \ shell 脚本中使用循环控制结构。循环结构有三种：`while` 循环、`until` 循环和 `for` 循环。\n\n### `while` 循环\n\
  \n`while` 循环不断执行，直到指定的条件不再为真。`while` 循环的结构如下：\n\n![Images](img/f0414-04.jpg)\n\n\
  `while` 循环将一直处理，直到条件评估为假。图 13-15 显示了 `while_loop_script.bash` 并说明了 `while` 循环的使用。\n\
  \n![Images](img/F13-15.jpg)\n\n**图 13-15** `while` 循环\n\n### `until` 循环\n\n除了 `while`\
  \ 循环，你还可以在脚本中使用 `until` 循环。它的工作方式与 `while` 循环相反。只要条件为假，`until` 循环就会一直运行。`until`\
  \ 循环的结构如下：\n\n![Images](img/f0415-02.jpg)\n\n![Images](img/note.jpg)\n\n**注意** 命令\
  \ `bash -x <script_name>` 脚本的调试模式。\n\n### `for` 循环\n\n你也可以使用 `for` 循环，它的运行方式与 `until`\
  \ 和 `while` 循环不同。`until` 和 `while` 循环无限期循环，直到指定的条件满足。而 `for` 循环循环特定的次数。`for` 循环的结构如下：\n\
  \n![Images](img/f0415-03.jpg)\n\n在 `for` 循环中使用 `seq` 命令来创建数字序列以确定循环次数是非常常见的。使用 `seq`\
  \ 创建数字序列有三种选项：\n\n- 如果你指定一个单值，序列从 1 开始，每次递增 1，在指定的值处结束。\n- 如果你指定两个值，序列从第一个值开始，每次递增\
  \ 1，在第二个值处结束。\n- 如果你指定三个值，序列从第一个值开始，按第二个值递增，在第三个值处结束。\n\n使用 `seq` 的 `for` 循环脚本示例见图\
  \ 13-16（脚本 `for_loop_seq.bash`）。\n\n![Images](img/F13-16.jpg)\n\n**图 13-16** 使用\
  \ `seq` 的 `for_loop_seq.bash` 脚本\n\n你还可以看到不同序列表示法的脚本。例如，`{0..10..1}` 等同于 `seq 0\
  \ 10`。图 13-17（脚本 `for_loop_new_sequence.bash`）。\n\n![Images](img/F13-17.jpg)\n\n\
  **图 13-17** 使用 `{ }` 的 `for` 循环\n\n![Images](img/exam.jpg)\n\n**考试提示** 确保理解 `while`\
  \ 循环、`if` 语句和 `case` 语句，以应对 Linux+ 考试场景题。\n\n#### 练习 13-1：创建基础脚本\n\n对于练习 13-1，请使用书中提供的图像。以用户\
