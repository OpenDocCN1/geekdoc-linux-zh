  \ CompTIA Linux+ 考试的模拟。可以在练习模式（Practice Mode）或考试模式（Exam Mode）下进行。练习模式提供了一个带有提示、书籍参考、正确和错误答案解释的辅助窗口，以及可以在测试时检查答案的选项。考试模式提供了实际考试的模拟。问题数量、问题类型和允许的时间旨在准确代表考试环境。自定义测验的选项允许您从选定的领域或章节创建自定义考试，并且您可以进一步自定义问题数量和允许的时间。\n\
  \n如需进行测试，请按照上一节提供的说明注册并激活您的 Total Seminars Training Hub 账户。注册后，您将进入到 Total Seminars\
  \ Training Hub。在 Training Hub 主页，从页面顶部 `Study` 下拉菜单中选择您的认证，以进入对应书籍的 TotalTester。您也可以从主页\
  \ `Your Topics` 选项卡中的列表滚动到那里，然后点击 TotalTester 链接启动 TotalTester。一旦启动了 TotalTester，您就可以选择自定义测验选项，并在练习模式或考试模式下开始自测。所有考试都提供总分以及按领域划分的评分。\n\
  \n## 其他书籍资源\n以下章节详细介绍了书中附带的其他可用资源。您可以通过选择 `Resources` 选项卡，或从页面顶部 `Study` 下拉菜单中选择\
  \ `CompTIA Linux+ All-in-One Exam Guide, 2e (XK0-005)` 或从主页的 `Your Topics` 选项卡列表中访问这些项目。屏幕右侧的菜单列出了所有可用资源。\n\
  \n### 性能基测试\n除了选择题外，CompTIA Linux+ 考试还包括性能测试（PBQs），根据 CompTIA 的说法，这些问题旨在测试您在模拟环境中解决问题的能力。有关\
  \ PBQ 的更多信息请访问 CompTIA 网站。您可以导航到 `Resources` 选项卡并选择 `Performance-Based Questions\
  \ Quiz` 来访问书中包含的性能基测试。选择 PBQ 后，浏览器将启动一个交互式测验。\n\n### 虚拟机\n您可以导航到 `Resources` 选项卡并选择\
  \ `Virtual Machines` 下载书中包含的虚拟机文件。然后选择 `VM Setup Instructions` 查看如何下载和安装提供的两个虚拟机镜像的详细说明。\n\
  \n### 视频\n本书作者提供的视频 MP4 剪片段提供了选章节练习的详细演示。您可以导航到 `Resources` 选项卡并选择 `Videos` 来访问这些视频。\n\
