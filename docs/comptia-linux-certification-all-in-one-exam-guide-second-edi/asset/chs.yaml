  \ `nmcli con` 或仅输入 `nmcli`，如下：\n\n![Images](img/F14-08.jpg)\n\n**图 14-8** `nmtui`\
  \ 主屏幕\n\n![Images](img/f0453-02.jpg)\n\n要确定 `ens32` 连接的 IP 地址，请使用 `nmcli` 的 `show`\
  \ 选项：\n\n![Images](img/f0453-03.jpg)\n\n要在 `ens32` 连接上添加 IP 地址别名，请使用 `nmcli` 的 `modify`\
