  \n### 4. 通过以下步骤将加密文件发送到不同的系统并在那里解密：\n\na. 启动你的第二个 Linux 系统并以标准用户身份登录。\nb. 使用 `ping`\
  \ 命令验证第二个 Linux 系统是否能与创建 GPG 密钥对的第一个 Linux 系统进行网络通信。\nc. 回到你的第一个 Linux 系统。\nd. 从第一个\
  \ Linux 系统的 shell 提示符，通过输入以下内容导出你的密钥：\n\n![Images](img/f0521-02.jpg)\ne. 使用 `scp`\
  \ 命令从第一个 Linux 系统将 `gpg.pub` 和 `mytestfile.txt.gpg` 文件拷贝到第二个 Linux 系统。\nf. 切换到第二个\
  \ Linux 系统。\ng. 验证 `gpg.pub` 文件是否已拷贝到用户家目录。\nh. 在 shell 提示符输入 `gpg --import ~/gpg.pub`\
  \ 将来自第一个 Linux 系统的公钥导入 GPG 密钥环。\ni. 在 shell 提示符输入 `gpg --list-keys` 验证公钥是否已导入。\n\
  j. 在 shell 提示符输入以下内容解密你拷贝的加密文件：\n\n![Images](img/f0522-01.jpg)\nk. 在提示时，输入你在第一个系统创建密钥时分配的密码。\n\
  l. 使用 `cat` 命令显示 `mytestfile.txt.decrypted` 的内容，并验证其是否匹配原始文件。\n\n### 5. 通过以下步骤对你的\
  \ GPG 密钥对执行维护任务：\n\na. 在 shell 提示符输入以下内容创建 GPG 密钥对的备份：\n\n![Images](img/f0522-02.jpg)\n\
  b. 在 shell 提示符输入以下内容创建密钥撤销证书：\n\n![Images](img/f0522-03.jpg)\n\n### 章节回顾\n\n本章涵盖了如何使用加密保护\
  \ Linux 系统上的数据以及网络安全系统。我们首先查看了使用 SSH 加密网络通信，探索了使用绑定的高可用网络，最后回顾了使用 `firewalld` 和\
  \ `iptables` 防御网络攻击。\n\n熟悉以下关于网络安全的关键事实：\n\n• 在对称加密中，用于加密消息的密钥与解密消息的密钥是同一个。发送者和接收者必须拥有完全相同的密钥。\n\
  \n•  对称加密的处理速度远快于非对称加密。\n\n\n\n\n- 对称加密相关的困难之一在于如何安全地向所有需要相互通信的方分发密钥。\n- 非对称加密使用两个密钥而不是一个：公钥和私钥。\n\
  - 使用公钥加密的数据只能通过其私钥进行解码。使用私钥签名的数据只能通过其公钥进行验证。\n- 证书机构 (CA) 负责发布和管理加密密钥。\n- 私钥仅授予密钥所有者。\n\
  - 公钥可以提供给任何需要它的人。\n- CA 的主要作用是验证参与加密交换的双方确实是他们所称的身份。\n- 管理员可以创建自己的证书，称为自签名证书。\n\
  - 哈希用于用于文件完整性检查。哈希值对于每个文件都是唯一的。当这种检查失败时，被称为冲突。\n- 热门的哈希算法包括 `MD5` 和 `SHA`。\n- SSH\
  \ 使用私钥/公钥加密结合密钥加密：\n- SSH 客户端首先与运行 SSH 服务且在 IP 端口 22 的系统上建立连接。\n- 要在本地计算机上使用 SSH\
  \ 客户端，可以在 shell 提示符处输入 `ssh -l <user_name> <ip_address>` 连接到远程 Linux 系统上的 `sshd`\
  \ 进程。\n- VPN 在隧道模式下使用 `IPSec` 提供加密和认证。\n- 隧道模式最适用于不可信的网络环境，例如从家里到办公室。\n- 传输模式下的\
  \ VPN 使用 `IPSec` 加密数据包，是可信网络上的良好解决方案。\n- 高可用网络在 Linux 中通过桥接（bridging）或绑定（bonding）技术实现。\n\
  - 网络桥接提供了容错能力。\n- 网络绑定提升了网络吞吐量。\n- 使用 `brctl` 命令设置网络桥接。\n- 网络绑定需要更新网络脚本并启用绑定策略。\n\
  - 绑定选项包括主备模式、聚合和负载均衡。\n- 单点登录 (SSO) 允许用户使用一个用户名和密码访问其整个组织内的数据，非常方便。\n- 热门的 SSO 服务包括带有拨号调制调器访问的\
  \ `RADIUS`、用于厂商无关环境的 `LDAP`、通过使用过期票据隐藏密码的 `Kerberos`，以及用于高可用性和可靠性的 `TACACS+`。\n\
  - Linux 系统可以使用 `firewalld`、`iptables`、`netfilter`、`nftables` 或 `ufw` 配置为防火墙。\n-\
  \ `nmap`、`netstat` 和 `lsof -i` 工具用于检查脆弱的开放 IP 端口。\n- 要启用 IP 转发，运行 `echo 1 > /proc/sys/net/ipv4/ip_forward`。\n\
  - `firewalld` 功能提供九个默认区域，包括 `work`、`home`、`internal`、`external`、`dmz` 和 `public`。\n\
  - 运行 `firewall-cmd --get-default-zone` 查看当前区域设置。\n- 运行 `firewall-cmd --permanent`\
  \ 使重启后永久生效。\n\n### Questions\n\n**[1].** 关于对称加密，以下说法是正确的？（选择两个）\nA. 它使用私钥/公钥对。\n\
  B. 发送者和接收者必须拥有相同密钥的副本。\nC. `RSA` 是对称加密的形式。\nD. `Blowfish` 是对称加密的形式。\n\n**[2].**\
  \ 哪些工具可以扫描开放的网络端口？（选择两个）\nA. `tcpwatch`\nB. `lsof`\nC. `nmap`\nD. `wireshark`\n\
  E. `webgoat`\n\n**[3].** 哪些主机密钥文件存储 SSH 版本 2 服务器使用的私钥？（选择两个）\nA. `/etc/ssh/ssh_host_key`\n\
  B. `/etc/ssh/ssh_host_key.pub`\nC. `/etc/ssh/ssh_known_hosts`\nD. `/etc/ssh/ssh_host_rsa_key`\n\
  E. `/etc/ssh/ssh_host_dsa_key`\n\n**[4].** `/etc/ssh/sshd_config` 文件中的哪个参数指定了 `sshd`\
  \ 进程应该使用哪个版本的 SSH？\nA. `HostKey`\nB. `Protocol`\nC. `SSHVersion`\nD. `ListenAddress`\n\
  \n**[5].** `/etc/ssh/sshd_config` 文件中的哪个参数配置 SSH 服务器禁用 root 登录？\nA. `RootAccess`\n\
  B. `AllowRootLogin`\nC. `PermitRootLogin`\nD. `DenyRootLogin`\n\n**[6].** `iptables`\
  \ 的哪个选项将列出当前防火墙？\nA. `iptables -N`\nB. `iptables -L`\nC. `iptables -I`\nD. `iptables\
  \ -R`\n\n**[7].** 以下哪个 shell 命令会加载 SSH 客户端并以 `sseymour` 用户身份连接到 IP 地址为 10.0.0.254\
  \ 的 SSH 服务器？\nA. `sshd -l sseymour 10.0.0.254`\nB. `ssh -u sseymour 10.0.0.254`\n\
  C. `ssh -l sseymour 10.0.0.254`\nD. `sshd -u sseymour 10.0.0.254`\n\n**[8].** 以下哪些是哈希算法？（选择两个）\n\
  A. `RSA`\nB. `DSA`\nC. `MD5`\nD. `SHA`\n\n**[9].** 你刚刚创建了一个用于 SSH 公钥认证的 DSA 私钥/公钥对。公钥文件的名称是什么？\n\
  A. `~/.ssh/id_rsa`\nB. `~/.ssh/id_dsa`\nC. `~/.ssh/id_rsa.pub`\nD. `~/.ssh/id_dsa.pub`\n\
  \n**[10].** 你已将 RSA 公钥复制到 SSH 服务器上某个用户的家目录中。你需要将公钥添加到哪个文件中以启用公钥认证？\nA. `~/.ssh/authorized_keys`\n\
  B. `/etc/ssh/authorized_keys`\nC. `~/.ssh/id_rsa`\nD. `~/ssh_host_key.pub`\n\n###\
  \ Answers\n\n**[1].** **B, D.** 在使用对称加密时，发送者和接收者都必须拥有相同密钥的副本。`Blowfish` 是对称加密的形式。\n\
  **[2].** **B, C.** 使用 `nmap` 和 `lsof -i` 查看系统上的开放网络端口。\n**[3].** **D, E.** SSH 版本\
  \ 2 服务器使用的私钥存储在 `/etc/ssh/ssh_host_rsa_key` 和 `/etc/ssh/ssh_host_dsa_key` 中。SSH\
  \ 版本 1 的私钥存储在 `/etc/ssh/ssh_host_key` 中。\n**[4].** **B.** `/etc/ssh/sshd_config`\
  \ 文件中的 `Protocol` 参数指定了 `sshd` 进程应该使用哪个版本的 SSH。\n**[5].** **C.** 将 `PermitRootLogin`\
  \ 参数设置为 `no` 以不允许以 `root` 身份登录。\n**[6].** **B.** 使用 `iptables -L` 使用 `iptables`\
  \ 列出当前的防火墙规则集。\n**[7].** **C.** 命令 `ssh -l sseymour 10.0.0.254` 将加载 SSH 客户端并以 `sseymour`\
  \ 用户身份连接到 IP 地址为 10.0.0.254 的 SSH 服务器。\n**[8].** **C, D.** 完整检查算法包括 `SHA` 和 `MD5`。`RSA`\
  \ 和 `DSA` 是非对称加密算法。\n**[9].** **D.** `~/.ssh/id_dsa.pub` 文件是用于 SSH 认证的 DSA 公钥。\n\
  **[10].** **A.** 你需要将公钥添加到想要通过公钥认证的用户的家目录下的 `~/.ssh/authorized_keys` 文件中。\n\n\n\n\
  \n# 考试提示 计算机系统安全是一个不断发展的话题。近年来发生的安全问题，如勒索软件和身份盗用，教导我们要为明天的安全事件做好准备。这体现在你的 CompTIA\
  \ Linux+ 考试中。不要过度关注特定的安全威胁。相反，要关注命令和关键安全原则。\n\n## 系统加固\n\nLinux 安全最重要且最经常被忽视的方面之一是保护系统本身。这里涉及的话题包括：\n\
  \n• 物理环境的安全\n• 操作系统的访问安全\n\n### 物理环境的安全\n\n便利性还是安全性？这是一个问题。许多公司希望能够轻松访问其计算机系统。组织必须在安全与便利之间取得平衡。如果系统中的数据是任务关键的或包含敏感信息，那么访问的便利性应该降低，从而保持更高的安全性。\n\
  \n在确定 Linux 系统的物理访问权限时，请考虑以下场景：\n\n• 一名恶劣供应商偷走了包含客户税号识别的服务器硬盘。\n• 一名恶劣员工从安全服务器室外的架子上偷走了存放一周的备份磁带。这些数据包含客户的登录名和密码提示。\n\
  • 路人从未锁的机柜里偷走了一台饼式服务器，获取了患者的私人健康记录。\n\n作为一名 Linux 管理员，你可以采取的最重要步骤之一是限制谁可以访问数据处理系统。服务器需要最高级别的物理安全，并应该被锁在服务器室中。对服务器室的访问应该严格控制。\n\
  \n![Images](img/note.jpg)\n\n**注意** 密码结合生物识别系统创建了多因素身份验证 (MFA)。生物识别系统通过扫描视网膜、匹配手指或观察语音模式来控制数据的访问。\n\
  \n除了控制办公室访问外，你还可以通过保护操作系统的访问来进一步保护组织的工作站和服务器。\n\n### 操作系统的访问安全\n\n在物理上保护计算机系统的访问后，下一道防线是\
  \ Linux 操作系统内置的访问控制。当然，Linux 提供用户账户和密码来控制谁可以对系统做什么。这是一个极好的功能，允许用户无论其责任级别或数据的关键性如何，都能保护自己的数据。在终端用户工作完成后，教他们注销或锁定屏幕（如图\
  \ 16-1 所示的`session lock`），作为一种良好的安全实践来保护他们的数据。\n\n![Images](img/F16-01.jpg)\n\n\
  **图 16-1** 锁定桌面\n\n![Images](img/caution.jpg)\n\n**注意** 你永远不应该让服务器处于登录状态。如果你这样做，至少要使用一个需要密码才能恢复操作的屏幕保护程序。否则，最佳安全实践是：如果用户没有在使用服务器控制台，他们应该注销。\n\
  \n为了允许用户注销并离开而不杀死重要进程，请使用 `nohup` 命令初始加载命令。任何由 `nohup` 加载的进程都会忽略收到的任何挂断信号（hang-up\
  \ signals），例如注销时发送的信号。使用 `nohup` 的语法为 `nohup <command> &`。例如，在图 16-2 中，`find -name\
  \ named &` 命令已使用 `nohup` 加载，允许 `find` 命令即使在 shell 注销后继续运行。\n\n![Images](img/F16-02.jpg)\n\
  \n**图 16-2** 使用 `nohup`\n\n最后，管理员还需要保护服务器免受数据丢失。战略计划可能会泄露给竞争对手，损害组织的形象。防止数据泄露的一种方法是“禁用\
  \ USB 端口”。在 Linux 中，你可以在 Linux 安装和每次内核更新后通过黑名单或删除 USB 模块来实现：\n\n![Images](img/f0529-03.jpg)\n\
  \n其他的 Linux 加固安全措施还包括：\n\n• 通过安全扫描检测威胁\n• 通过禁用或移除 Telnet 和 FTP 等不安全服务来避免威胁\n• 通过移除使用的包和应用程序来缓解威胁\n\
  • 通过配置主机防火墙（如 UFW）拦截威胁\n• 通过在 `/etc/passwd` 中启用 `nologin` shell 来保护服务账户\n\n成功的安全实践归于终端用户培训。社交工程攻击会破解系统管理员为保护网络而设置的技术控制。如果终端用户不配合，则必须执行公司政策，如使用策略和计算机使用策略。\n\
  \n## 控制用户访问\n\nLinux 工作站安全和 Linux 服务器安全的关键方面都是实施并使用用户访问控制来限制用户对系统可以做什么。在本书的早期，我们讨论了如何创建和管理用户、组和权限来实现这一点。然而，你可以采取额外的措施来增加系统的安全性。在本节中，我们将回顾以下内容：\n\
  \n• 成为 root 还是不 root？\n• 强密码策略\n• 身份验证失败后锁定账户\n• 配置用户限制\n• 禁用用户登录\n• 使用 `find` 进行安全审计\n\
  \n让我们从讨论如何正确照顾和喂养 `root` 用户账户开始。\n\n### 成为 root 还是不 root？\n\n正如本书前面讨论的，每个 Linux\
  \ 系统（无论是工作站还是服务器）都包含一个名为 `root` 的默认管理员账户。该账户对系统的每个方面都有完全访问权限。因此，应该谨慎使用。作为一名 Linux+\
  \ 候选人，你需要理解以下内容：\n\n• `root` 用户账户的正确使用\n• 使用 `su`\n• 使用 `sudo`\n• 使用 `pkexec`\n\n\
  #### `root` 用户账户的正确使用\n\n新 Linux 用户常犯的一个关键错误是过度使用 `root` 账户。在某些时刻和情况下确实需要 `root`\
  \ 用户账户；但在 Linux 系统上的大部分工作都应该以非 root 用户身份进行。准则是：只有在绝对必要时才使用 `root`。如果某个任务可以通过非 root\
  \ 用户完成，请使用非 root 用户账户。\n\n为什么 `root` 用户账户的正确使用令人关注？想象一下，如果入侵者偶然遇到一个以 `root` 登录的无人系统，他们会造成什么样的破坏！系统上的所有数据都可以被访问和复制。可以对运行的守护进程进行重大配置更改。谁知道会安装什么种恶意软件。\n\
  \n重点是，以 `root` 登录的系统代表了严重的安全风险。包括系统管理员在内的每个人都应该有一个始终用于访问系统的标准用户账户。如果系统管理员需要 `root`\
  \ 权限，他们应该临时使用该权限，然后返回普通权限。Linux 提供了三种实现方法，这对 CompTIA Linux+ 考试很重要：`su`、`sudo` 和\
  \ `pkexec`。\n\n#### 使用 `su`\n\n`su` 命令代表“切换用户”（substitute user）。该命令允许你在 提示符切换到不同的用户账户。语法为\
  \ `su <options> <user_account>`。如果命令未指定用户账户，`su` 假设切换到 `root` 用户账户。以下是可以配合 `su`\
  \ 使用的一些有用选项：\n\n• `-` 加载目标用户的配置文件。例如，当你使用 `su -` 命令切换到 `root` 用户账户时，这也会加载 `root`\
  \ 的环境变量。\n• `-c <command>` 临时切换到目标用户账户，运行指定的命令，然后返回原始账户。\n• `-m` 切换到目标用户账户但保留现有配置文件。\n\
  \n\n\n\n\n任何拥有 `root` 密码的人都可以使用 `su` 切换到 root 用户，但为所有用户都提供 `root` 权限是一种非常糟糕的安全实践。此外，通过\
  \ `su` 变成 `root` 不会记录用户的活动。有时，用户需要临时获得 `root` 权限来添加打印机或新的网络设备。必须有一种方法可以在无需寻找系统管理员的情况下实现，而这种方法就是使用\
  \ `sudo`。\n\n## 使用 `sudo`\n\n假设 Linux 系统上有一位高级用户。该用户可能是程序员、项目经理或数据库管理员。这类分类的用户可能经常需要运行某些\
  \ root 级命令。为了允许他们运行有限数量的 root 级命令，并记录他们的管理员活动，你可以教他们使用 `sudo`。\n\n`sudo` 命令允许给定用户以其他用户账户的身份运行命令。与\
  \ `su` 一样，可以是系统上的任何用户账户；但它最常被用于以 `root` 身份运行命令。`sudo` 命令读取 `/etc/sudoers` 文件来确定哪个用户授权运行哪些命令。该文件使用以下别名来定义谁可以做什么：\n\
  \n- `User_Alias`：指定允许运行命令的用户账户\n- `Cmnd_Alias`：指定用户可以运行的命令\n- `Host_Alias`：指定用户可以运行命令的主机\n\
  - `Runas_Alias`：指定命令可以以哪些用户名身份运行\n\n要编辑 `/etc/sudoers` 文件，请以 `root` 用户身份运行 `sudo\
  \ -e /etc/sudoers`、`sudoedit /etc/sudoers` 或直接运行 `visudo` 命令。`/etc/sudoers` 文件使用默认编辑器加载，通常是\
  \ `vi`，可以通过 `EDITOR`、`VISUAL` 或 `SUDO_EDITOR` 环境变量进行修改。你的更改在提交之前会被写入 `/etc/sudoers.tmp`。这在图\
  \ 16-3 所示。\n\n![Images](img/F16-03.jpg)\n\n**图 16-3** 使用 `visudo` 编辑 `/etc/sudoers`\n\
  \n![Images](img/note.jpg)\n\n**注意** 要修改如 `sudoedit` 等程序的默认编辑器，请将以下行放入用户的 `~/.bashrc`\
  \ 文件中：\n\n```bash\nEDITOR=/usr/bin/nano; export EDITOR\n```\n\n此示例将 `nano` 实现为默认编辑器。\n\
  \n`/etc/sudoers` 文件的默认配置是，用户在使用 `sudo` 时必须提供自己的个人密码，而不是像 `su` 那样提供 `root` 密码。此 `sudo`\
  \ 功能使系统更加安全，因为 `root` 密码共享给的用户更少。\n\n要配置 `/etc/sudoers` 配置文件，请修改 `User_Alias` 以定义一个包含允许以\
  \ `root` 身份运行命令的用户账户（用逗号分隔）的别名。其语法如下：\n\n![Images](img/f0532-02.jpg)\n\n例如，为了创建一个名为\
  \ `PWRUSRS` 的包含 `cheryl`、`theo` 和 `aria` 用户账户的别名，你需要在 `/etc/sudoers` 文件中输入：\n\n\
  ![Images](img/f0533-01.jpg)\n\n![Images](img/note.jpg)\n\n**注意** `/etc/sudoers`\
  \ 中的所有别名名称必须以大写字母开头！\n\n接下来使用 `Cmnd_Alias` 定义你希望定义的用户运行的命令（使用完整路径）。用逗号分隔多个命令；例如，如果用户是需要能够杀死进程的程序员，定义一个名为\
  \ `KILLPROCS` 的别名，其中包含 `kill` 命令，如下：\n\n![Images](img/f0533-02.jpg)\n\n然后使用 `Host_Alias`\
  \ 指定用户可以在哪些系统上运行这些命令。例如，要允许他们在名为 openSUSE 的系统上运行命令，请使用以下内容：\n\n![Images](img/f0533-03.jpg)\n\
  \n最后，将这些别名组合在一起以定义具体会发生什么，语法如下：\n\n![Images](img/f0533-04.jpg)\n\n例如，要允许指定的用户在指定的主机上以\
  \ `root` 身份运行指定的命令，请输入以下：\n\n![Images](img/f0533-05.jpg)\n\n现在 `/etc/sudoers` 的更新已完成，按\
  \ `Esc` 退出 `visudo` 并输入 `:wq`（这假设 `EDITOR` 被定义为 `/usr/bin/vi`）。`visudo` 工具将验证语法，如果一切正确，它将退出。此时，在\
  \ `/etc/sudoers` 中定义的终端用户可以通过在 shell 提示符处输入 `sudo <command>` 来以 `root` 用户身份执行命令。例如，`cheryl`\
  \ 用户可以通过在 shell 提示符输入 `sudo killall vmware-toolbox` 来杀死名为 `vmware-toolbox`（由 root\
  \ 所有）的进程。在 `cheryl` 提供她的密码而非 root 密码后，进程将被杀死。\n\n你也可以允许用户无需密码运行 `sudo` 命令。`/etc/sudoers`\
  \ 中的以下条目允许用户 `amos` 无需密码运行 `kill` 命令：\n\n![Images](img/f0533-06.jpg)\n\n用户 `amos`\
  \ 仍需要密码通过 `lprm` 命令删除打印作业。\n\n## 使用 `pkexec`\n\n与 `sudo` 命令类似，`pkexec` 命令（PolicyKit\
  \ 的功能）允许你以另一个用户的身份运行命令。PolicyKit 是用于定义和处理授权的工具包。如果用户 `liara` 想以用户 `allen` 的身份查看\
  \ `/etc/hosts` 文件，她运行以下命令：\n\n![Images](img/f0534-01.jpg)\n\n在 `liara` 输入密码后，`/etc/hosts`\
  \ 文件将被连接输出。\n\n## 实现强密码策略\n\n组织面临的另一个严重安全漏洞是使用弱密码。弱密码是指容易被猜到或破解的密码。以下是一些示例：\n\n\
  - 姓氏\n- 母亲的姓\n- 生日\n- 字典中可以找到的任何单词\n- 使用“password”作为密码\n- 空密码\n\n使用这些类型的密码是因为它们很容易记忆。遗憾的是，它们也很容易破解。管理员需要训练用户使用强密码，例如密码语（passphrases）。强密码使用以下内容：\n\
  \n- 十二或更多字符（越长越好！）\n- 数字、特殊字符和字母的组合\n- 大小字母\n- 字典中未找到的单词\n\n例如，诸如 `M3n0v3l273!!`\
  \ 这样的密码是一个较强的密码，因为它符合标准，但很难记忆。像 `To &3 or NOT to &3` 这样的密码语既强又更容易记忆。Linux 密码管理工具默认配置为检查用户密码以确保它们符合强密码的标准。例如，如果你尝试使用\
  \ `passwd` 命令使用弱密码，系统会提示你使用更强的密码，如下所示：\n\n![Images](img/f0534-02.jpg)\n\n除了要求强密码外，管理员还应该配置用户账户，使密码在一段时间后过期。这被称为密码老化。为什么要老化？用户使用同一个密码的时间越长，越容易被破解。强制用户定期更改密码会让入侵者无从下手。允许密码有效的时间因组织而异。更注重安全的组织强制密码有效期为\
  \ 27-30 天。不那么敏感的组织使用 90 天或更长的有效期。\n\n![Images](img/note.jpg)\n\n**注意** NIST 特别出版\
  \ 800-63B 在 2020 年 3 月宣布，如果你使用双因子认证 (2FA)，在大多数情况下每年更改密码是足够的。\n\n管理员可以使用 `chage`\
  \ 命令来配置密码老化。`chage` 的语法为 `chage <option> <user>`。`chage` 可用的选项如下：\n\n- `-m <days>`：指定密码更改之间的最小天数\n\
  - `-M <days>`：指定密码更改之间的最大天数\n- `-W < days>`：指定更改密码前的警告天数\n\n例如，在图 16-4 中，使用 `chage`\
  \ 命令为 `ksanders` 用户指定了最小密码年龄 5 天、最大密码年龄 90 天以及 7 天警告期。\n\n![Images](img/F16-04.jpg)\n\
  \n\n\n\n[content]\n\n图 16-4 使用 `chage` 设置密码有效期\n\n## 社会工程学威胁\n\n管理员还应该培训用户如何应对社会工程攻击。社会工程学是入侵者工具箱中最有效的工具之一。社会工程利用的是人类的弱点，而不是系统的技术弱点。以下是典型的社会工程攻击的工作原理。\n\
  \n入侵者拨给某组织的员工，假装成另一名员工。入侵者告诉该员工，他是销售部的“Fred”，目前正在客户现场出差。他需要从服务器上获取一个非常重要的文件，但忘记了密码。然后，他询问该员工是否可以使用他们的密码来获取他所需的文件。\n\
  \n大多数员工都想成为团队的一员，并在紧急情况下提供帮助。他们非常乐意提供自己的密码，从而让入侵者轻松地访问系统。\n\n最后，管理员需要缓解困扰组织的钓鱼邮件泛滥。钓鱼邮件看起来来自合法的组织，例如银行、朋友或电子商务网站。它们诱导用户点击链接，将他们引导到恶意网站，并在那里被诱骗泄露密码。\n\
  \n训练用户将鼠标悬停在链接上（不要点击）以查看链接的实际去向。如果链接没有指向合法机构的 URL，那么该信息极有可能是攻击手段。\n\n对抗社会工程学的最佳方法是终端用户培训。执行相关政策：不写下密码、不点击电子邮件链接、粉碎敏感数据，并将任何索要密码的电话转接给安全部门。\n\
  \n除了配置密码有效期外，您还可以通过限制登录和资源来提高 Linux 系统的安全性。让我们接下来查看是如何操作的。\n\n![Images](img/exam.jpg)\n\
  \n**考试提示** 密码安全威胁实练习是一个非常重要的主题，但不是 CompTIA Linux+ 考试的重点。请务必熟悉 `/etc/passwd` 和 `/etc/shadow`\
  \ 文件的列和权限。\n\n## 在身份验证失败后锁定账户\n\n管理员可以使用可插身份验证模块 (PAM) 安全用户账户访问。PAM 控制 `login`、`ssh`、`su`\
  \ 等应用程序的用户身份验证。例如，使用 PAM 通过要求特定的密码长度和字符来强制执行密码强度，或禁止用户从特定终端登录。\n\nLinux 在 `/etc/pam.d`\
  \ 目录查找 PAM 配置文件。`login`、`ssh` 等服务的配置文件就位于此处。`/etc/pam.d/sshd` 的部分内容如下：\n\n![Images](img/f0536-01.jpg)\n\
  \n第一列代表身份验证任务，按账户、身份验证、密码和会话分组：\n\n* `account`: 提供账户验证服务（例如，密码是否过期以及用户是否被允许访问特定服务）。\n\
  * `auth`: 用于验证用户身份、请求密码并设置凭据。\n* `password`: 在更新密码时要求用户输入替换密码。\n* `session`: 管理在服务设置或清理期间期间发生的情况（例如，挂载主目录或设置资源限制）。\n\
  \n第二列代表用于管理成功或失败处理的控制关键字：\n\n* `required`: 如果 `required` 失败，则在运行完所有其他模块后，整个操作将判定失败。\n\
  * `requisite`: 如果 `requisite` 失败，操作将立即失败。\n* `sufficient`: 如果成功，则已足够满足服务的需求。\n*\
  \ `optional`: 如果该模块是该设施堆栈中的唯一模块，则可能导致操作失败。\n\n第三列显示被调用的模块，该模块可以接受额外的选项和参数。例如，`pam_ldap.so`\
  \ 为 LDAP 服务器提供身份验证、授权和密码更改。`pam_nologin.so` 模块在存在 `/etc/nologin` 时，防止非管理员用户登录系统。\n\
