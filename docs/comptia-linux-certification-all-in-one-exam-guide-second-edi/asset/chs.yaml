- "# CompTIA Linux+ 认证全合一考试指南，第二版 (考试 XK0-005)\n\n\n\n![](img/1264802773.jpg)\n\n\
  ![图片](img/1264802773.jpg)\n\n## 关于作者\n\n`Ted Jordan` (MS, CompTIA Linux+, CompTIA\
  \ Security+, CompTIA Cloud+, CISSP, CSSLP) 拥有超过 25 年的 UNIX、IRIX、Solaris 和 Linux\
  \ 工程经验。他在加利福尼亚大学伯克利分校和凯特林大学攻读研究生期间学习了编程和 UNIX。在 Jordan 先生的工程生涯中，他曾为通用汽车、硅谷图形、Fakespace\
  \ CAVE 虚拟现实以及太阳微系统公司编写过 `C/UNIX` 代码。他是成功技术初创企业 Funutation, Inc. 和 JordanTeam LLC\
  \ 的创始人兼总裁，这两家公司均提供 Linux 编码和教育。自 2001 年以来，他参加并通过了所有 CompTIA Linux+ 考试，并成功培训了数百人获得其\
  \ Linux+ 认证。您可以在 Twitter 和 YouTube 上关注他 @JordanTeamLearn。\n\n`Sandor Strohmayer`\
  \ 是一位培训师和课程开发人员，从事 Linux 和 UNIX 培训材料的教学和编写已 20 多年。Strohmayer 先生最初是太阳微系统的硬件和操作系统导师。从那时起，为学校、公司和军队开发并教授了\
  \ UNIX、Linux 以及其他培训课程，使用学习指南和混合学习技术，并辅以通过学习管理系统进行的个人进度学习。Strohmayer 还在 LinkedIn\
  \ 上提供学习、Linux 以及其他 IT 技巧 (`www.linkedin.com/pub/sandor-strohmayer/4/702/765`)。\n\
  \n关于 技术与开发编辑\n\n`Kenneth “Ken” Hess` 是一位资深高级系统管理员，也是一位技术作家、博主、专栏作家、编辑和播客。Ken 编写了数百篇涵盖\
  \ Linux、开源软件、Windows、Mac、移动设备、数据库和加密货币主题的技术文章。他还评审科技产品，并是一位热爱的摄影师和电影制作。\n\n![封面](img/title.jpg)\n\
