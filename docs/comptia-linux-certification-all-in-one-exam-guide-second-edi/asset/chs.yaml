  **B.** 在 `/dev` 中创建条目时\n**C.** 当访问设备时\n**D.** 当创建设备时\n\n**4.** 下列哪些命令会显示块设备？（选择四项）\n\
  \n**A.** `lsblk`\n**B.** `systool -c block`\n**C.** `lshw -short -class volume`\n\
  **D.** `ls -l /sys/block`\n**E.** `lsblock`\n\n**5.** 下列哪些命令会显示 `uevents`？（选择两项）\n\
  \n**A.** `udevadm info`\n**B.** `udevadm monitor`\n**C.** `dmesg`\n\n**6.** 下列哪些命令会显示\
  \ `uevents`？（注：原文此处选项不全，但根据要求翻译逻辑。根据上下文，此处应为第 6 题）。命令 `dmesg -f -l` 显示内核 `sdb`？\n\
  \n**7.** 下列哪些方法可以防止模块作为依赖被安装？（选择两项）\n\n**8.** 在写入 `udev` 规则之前，执行哪个命令可以获取设备的所有属性并确保不会列入黑名单，即使你将其设置为\
  \ `/bin/true`？\n\n**9.** 哪个文件包含活动的中断列表？\n\n**10.** 显示 USB 设备的层级结构，你应该执行哪个？\n\n**11.**\
  \ 使用浏览器界面管理 CUPS，你应该在浏览器输入哪个？\n\n### 答案\n\n**1.** 在启动过程中，内核模块发现信息并填充 `/sys/`。操作统计也存储在\
  \ `/sys/` 中。\n\n**2.** A, D。总线是用于在设备之间传输数据的系统设备。\n\n**3.** A。主设备号和从设备号是在设备发现过程中发现的。主号与设备类关联。从设备由驱动程序使用。\n\
  \n**4.** A, B, C, D。这些命令都会显示块设备列表。\n\n**5.** B, C。`udevadm monitor` 命令可以显示内核和 `udev`\
  \ 事件。`dmesg` 命令可能用于显示内核事件。\n\n**6.** B。你可以使用 syslog 中的设施（-f）和优先级（-l）过滤器来过滤 `dmesg`\
  \ 输出。此题要求显示内核设施和优先级注意。\n\n**7.** B, D。通过修改 `/etc/modprobe.d/*.conf` 中的配置文件，可以将模块列入黑名单并防止其作为依赖被安装，即使将其设置为\
  \ `/bin/true`。\n\n**8.** C。`udevadm info` 将提供用于写入 `udev` 规则的所有设备属性。\n\n**9.** A。`/proc/interrupts`\
  \ 包含了活动中断列表。\n\n**10.** B。`lsusb -t` 显示 USB 设备的层级结构。\n\n**11.** C。`localhost:631`\
  \ 用于通过浏览器界面管理 CUPS。\n\n\n\n\n\n- [9]. **C.** 文件 `/proc/dma` 包含一个活动直接内存访问 (DMA) 通道列表。\n\
  - [10]. **B.** 命令 `lsusb -t` 可生成 USB 集线器及其连接到集线器上的设备的层级视图。\n- [11]. **C.** 端口 631\
  \ 用于访问 CUPS Web 工具。输入 `localhost:631` 将启动 CUPS Web 配置工具。\n\n# 第 13 章\n## 编写 Shell\
  \ 脚本\n\n在本章中，你将学习到：\n\n• 高级 Shell 概念\n• 理解 Shell 脚本组件\n• 使用控制运算符\n• 处理文本流\n\n*软件本应为人类服务，而不是反反之*\n\
  —Gloria Washington，霍华德大学\n\n本章将介绍如何在 Linux 系统上创建和控制基础 Shell 脚本。Shell 脚本是文本文件，其中包含各种命令，可用于自动化任务和处理信息。脚本具有许多编程语言的特性，包括变量、运算符、条件判断、循环等。由于这些特性与\
  \ Bash Shell 相关，详细信息可以在 `bash` man 手页中找到。\n\n![Images](img/note.jpg)\n\n**注意** 本章中找到的大多数脚本可以在书籍附带的目录\
  \ `/LABS/Chapter_13` 中找到。\n\n###级 Shell 概念\n\n脚本是产生特定结果的一系列命令。当你在 Shell 中运行命令时，你是在间断地模拟脚本；唯一的区别在于脚本将命令组合在一个文件中并执行该文件。\n\
  \n要创建你的第一个脚本，运行 `vi myscript.bash` 并在文件中输入以下内容：\n\n![Images](img/f0401-01.jpg)\n\
  \n选择 `Esc :wq <Enter>` 保存脚本。\n\n你可以通过执行以下命令之一来运行你的新脚本：`source myscript.bash`、`.\
  \ myscript.bash` 或 `bash myscript.bash`。如果你对该文件具有读取权限，脚本将执行。\n\n![Images](img/note.jpg)\n\
  \n**注意** 使用 `.bash` 后缀是为了你的方便，以便你识别出该文件是一个 Bash 脚本。图形用户界面 (GUI) 使用后缀来确定文件类型，但 Linux\
  \ 会忽略它们。对于 Linux 来说，后缀仅仅是文件名的一部分。\n\n要让脚本对所有人可执行，运行 `chmod +x myscript.bash`。一旦脚本变为可执行，提供脚本的绝对路径。例如，输入\
  \ `/home/student1/myscript.bash`。\n\n要使用相对路径运行脚本，请输入 `./myscript.bash` 告诉 Linux\
  \ 在当前目录查找。\n\n最后，你可以设置 `PATH` 变量通过输入 `PATH=$PATH:.` 来始终在当前目录 `.` 中运行命令，但这带来了安全风险。如果黑客在你的目录下放置了一个伪造的\
  \ `passwd` 程序，每当你运行 `passwd` 时，黑客的程序就会运行，窃你的密码并破坏系统。\n\n了解额外的 Shell 特性将让你更好地编写脚本。在这里我们将涵盖以下高级\
  \ Shell 特性：\n\n• Glob 通配符\n• 命令序列化\n• 命令替换\n\n让我们从探索称为 globs 的通配符开始。\n\n#### Glob\
  \ 通配符\n\nGlob 通配符允许用户在目录中仅列出他们想要看到的文件。例如，假设你的目录中的文件如下所示：\n\n![Images](img/f0402-01.jpg)\n\
  \n你可以使用 表 13-1 中列出并描述的 Bash Shell 模式匹配字符来仅列出你想看到的文件。\n\n![Images](img/f0403-01.jpg)\n\
  \n**表 13-1** Bash Shell 通配符\n\n以下四个项目分别显示了如何仅列出以 `f` 或 `n` 开头并 `0` 结尾的文件、仅列出以 `f`\
  \ 开头并 `1` 结尾的文件、仅列出具有四个字符的文件，以及仅列出从 `note12` 到 `note14` 的文件：\n\n![Images](img/f0402-02.jpg)\n\
