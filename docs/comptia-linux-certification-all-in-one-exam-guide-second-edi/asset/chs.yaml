  \n然而，由于为组和*其他*列出了 `2`，因此每当在文件系统中创建文件或目录时，组和*其他*的写权限都会从默认模式中移除。`umask` 的功能见图 6-4。对于\
  \ `0022` 的 `umask`，第一个 `0` 将在接下来的章节“使用特殊权限”中讨论。）\n\n![Images](img/F06-04.jpg)\n\n\
  **图 6-4** `umask` 的工作原理\n\n`umask` 的默认值适用于大多数 Linux 管理员。然而，在某些情况下，你可能需要收紧或放宽创建文件或目录时分配的权限。要做到这一点，请更改分配给\
  \ `umask` 的值。\n\n你可以通过在 shell 提示符处输入 `umask <value>` 来对 `umask` 进行临时更改。例如，为了移除在创建新目录时自动分配给*其他*的执行权限，请输入\
  \ `umask 023`。这将导致在创建时从*组*中移除写权限 (`2`)，同时从*其他*中移除写权限 (`2`) 和执行权限 (`1`)。这将有效地阻止除目录的*用户*或成员之外的任何人进入新目录。\n\
  \n### 使用特殊权限\n\n如前所述，`umask` 的值是一个三位或四位数字，如下所示：\n\n![Images](img/f0170-01.jpg)\n\
  \n对于大多数 Linux 发行版，`umask` 的默认值为 `0022` 或 `022`。每个数字代表一个要被*移除*的权限值。对于 `022` 的 `umask`，第一个数字\
  \ (`0`) 指的是——你猜对了——*用户*。中间的数字 (`2`) 指的是*组*，最后一个数字 (`2`) 指的是*其他*。因为为*用户*列出了 `0`（零），所以不会从文件或目录用户的默认模式中移除任何权限。\n\
  \n（注：由于提供的文本中存在大量重复段落，根据“不要重复输出原文”的要求，上述译文已对重复内容进行了去重。）\n\n\n\n\n\n假设 `runme` 命令设置了\
  \ SUID 和 SGID 位，那么当执行该命令时意味着什么？假设你以用户 `ian` 的身份登录，且 `ian` 的默认组为 `users`。通常情况下，当\
  \ `ian` 运行命令时，它以 `ian` 的真实用户 ID（RUID）作为有效用户 ID（EUID），以及 `users` 的真实组 ID（RGID）作为有效组\
  \ ID（EGID）运行。\n\n但当设置了 SUID 和 SGID 位时，RUID 和/或 RGID 会被覆盖并`采用命令的权限`。现在，每当 `ian` 运行\
  \ `runme` 时，EUID 变为命令的所有者，EGID 变为命令所属的组。在以下示例中，SUID 和 SGID 被设置了，因为命令的用户（所有者）和组处显示为\
  \ `s`：\n\n![Images](img/f0172-03.jpg)\n\n每当 `ian` 或任何用户运行 `runme` 命令时，他们的 EUID 将是\
  \ `tcboony`，EGID 将是 `wheel`。由于特殊权限位的设置，他们的真实用户 ID（RUID）和真实组 ID（RGID）被覆盖了。\n\n使用特殊权限位的命令包括\
  \ `/usr/bin/passwd`（你用于更改密码的命令）和 `/usr/bin/locate`（你用于在 Linux 文件系统中查找文件的命令），如下所示：\n\
  \n![Images](img/f0173-01.jpg)\n\n当用户运行 `passwd` 命令时，他们临时获得该命令所需的 `root` 用户权限。在这种情况下，只有\
  \ `root` 用户可以修改包含密码的文件 `/etc/shadow`。\n\n当用户运行 `locate` 命令时，他们临时获得 `slocate` 组权限，以访问\
  \ `locate` 命令运行所需的关键数据库。\n\n## 使用特殊权限减少共享目录的滥用\n\n最初创建共享目录时，任何用户都可以删除其他人的文件。这是因为为了让共享目录工作，包括\
  \ `other` 在内的所有人都需要该目录的写权限，显示为 `drwxrwsrwx`。\n\n为了消除用户删除不属于自己的文件的滥用行为请在共享目录上启用粘滞位（sticky\
  \ bit）。同样，使用以下两种方法的 `chmod`，使得只有文件所有者（以及 `root`）可以从共享目录中删除自己的文件，而其他人不能：\n\n![Images](img/f0173-02.jpg)\n\
  \n使用粘滞位的目录之一是 `/tmp`。注意其他用户位处的 `t` 设置，这意味着粘滞位设置已启用：\n\n![Images](img/f0173-03.jpg)\n\
  \n现在，只有文件所有者（以及 `root`）可以删除共享目录内的文件。\n\n在以下练习中练习管理默认权限和特殊权限。\n\n### 练习 6-3：管理默认和特殊权限\n\
  \n在此练习中，练习使用 `umask` 修改默认权限并开始创建文件。还要练习向目录添加特殊权限。请使用书中附带虚拟机进行此练习。\n\n![Images](img/video.jpg)\n\
  \n**视频** 请观看练习 6-3 的视频以演示如何执行此任务。\n\n完成以下步骤：\n\n1. **使用登录名 `student1` 和密码 `student1`\
  \ 登录系统。点击“应用程序 | 终端”启动终端。**\n2. **如有必要，使用 `su -` 命令和密码 `password` 切换到 `root` 用户账户。**\n\
  3. **在 shell 提示符下输入 `cd /RandD` 进入 `/RandD` 目录。**\n4. **在 `RandD` 目录中创建若干开发文档。但是，请确保这些文档不受窥探。回想上一个练习，`Other`\
  \ 在文件被创建时会自动获得读取访问权限。你不希望发生这种情况。你需要 `Other` 对任何创建的文件没有任何访问权限。执行以下操作：\n    a. **在\
  \ shell 提示符下输入 `umask 027` 修改默认权限。**\n    b. **在 shell 提示符下输入 `umask` 验证 `umask`\
  \ 的值。它应该显示为 `0027`。**\n    c. **在 shell 提示符下输入 `touch schedule.odt` 创建名为 `schedule.odt`\
  \ 的新文件。**\n    d. **在 shell 提示符下输入 `ls -l`。验证用户拥有 `rw-`、组拥有 `r--`、其他拥有 `---` 权限。**\n\
  5. **写权限允许 `research` 组中的任何人删除目录中的任何文件。我们希望配置目录，让 `research` 组中的用户只能删除他们实际拥有的文件。执行以下操作：**\n\
  \    a. **在 shell 提示符下输入 `cd /` 命令。**\n    b. **在 shell 提示符下输入 `chmod 1771 RandD`\
  \ 为 `RandD` 目录添加粘滞位权限。**\n    c. **在 shell 提示符下输入 `ls -l RandD`，注意 `RandD` 目录模式的其他部分的最后一位添加了\
  \ `t`。这表示粘滞位已设置：**\n\n![Images](img/f0174-01.jpg)\n\n## 配置文件属性和访问控制列表\n\nLinux 提供了高级功能来为文件和目录提供更高的安全性。Linux\
  \ 管理员可以使用以下功能对文件设置更严紧的访问控制：\n\n* 文件属性\n* 文件访问控制列表 (ACL)\n\n### 文件属性\n\n文件属性允许操作人员为文件提供额外的功能。例如，可以将文件设为仅可追加或不可变。管理员可以使用\
  \ `chattr` 命令更改属性，并使用 `lsattr` 命令列出属性，如下所示：\n\n![Images](img/f0175-01.jpg)\n\n上一个示例显示了使用命令\
  \ `chattr +i contacts.odt` 设置不可变位，然后使用 `chattr -i contacts.odt` 移除不可变特性。`e` 设置意味着范围格式（extent\
  \ format），这在 `ext4` 文件系统上始终如此，并允许文件被正确保存。\n\n其他可修改的文件属性还包括：\n\n* `c`: 压缩\n* `j`:\
  \ 数据日志\n* `S`: 同步更新\n\n访问 `chattr(1)` 和 `lsattr(1)` 手页以了解其他可修改的属性。\n\n### 属性的排排除提示\n\
  \n用户可能会发现，尽管他们有删除文件的权限，但无法删除。他们会发现运行 `ls -ld .` 显示他们对目录有写权限，但仍然无法删除文件。他们的下一步是运行\
  \ `lsattr` 查看是否设置了属性，然后联系管理员使用 `chattr` 移除属性，因为更改属性需要 `root` 权限。\n\n![Images](img/exam.jpg)\n\
  \n**考试提示** 一旦设置了文件不可变，任何人无法删除该文件，包括 `root`！\n\n### 文件访问控制列表\n\n用户可以通过实现名为访问控制列表\
  \ (ACLs) 的功能来扩展其文件安全设置。此功能允许用户为其文件和目录分配特定的、更细粒度的权限。例如，在 `staff` 组目录中，用户 `nathand`\
  \ 拥有文件的读写访问权限，因为他是 `staff` 组的成员。然而，管理员确定 `nathand` 只需要 `contacts.odt` 的读取权限，该文件也是\
  \ `staff` 组的一部分。ACL 可以将其权限降低为只读，而无需移除文件的 `staff` 组成员身份。\n\n要查看当前的 ACL 设置，使用 `getfacl`\
  \ 命令：\n\n![Images](img/f0176-01.jpg)\n\n由于 `nathand` 是 `staff` 组的成员，他拥有读写权限。为了让\
  \ `nathand` 对文件拥有只读权限，但仍允许他对属于 `staff` 组的其他文件拥有读写权限，请使用 `setfacl` 设置 ACL。\n\n在此示例中，我们使用\
  \ `-m` 选项运行 `setfacl` 来修改文件的 ACL 值：\n\n![Images](img/f0176-02.jpg)\n\n现在，用户 `nathand`\
  \ 对文件 `contacts.odt` 只有读取权限，尽管他属于具有读写更高权限的 `staff` 组。\n\n\n\n\n掩码值（mask）是一种安全机制，用于自动将权限限制在一个最大值。例如，如果使用命令\
  \ `setfacl -m mask:r contacts.odt` 将掩码设置为 `r--`，即使用户的身份或组组成权限更高，所有用户也只有读取访问权限。\n\
  \n### 组和 ACL 的故障排除技巧\n\n用户可能属于 `staff` 组，但发现自己并不具备应拥有的读取权限。运行 `ls -l <filename>`\
  \ 显示他们拥有读取权限。但随后用户注意到权限末尾有一个 `+` 号。这意味着该文件定义了 ACL，如下所示：\n\n![Images](img/f0176-03.jpg)\n\
  \n现在，当用户运行 `getfacl <filename>` 时，他们看到设置了一个 ACL，将他们的权限限制为只读。要提高权限，他们需要向文件所有者或系统管理员请求更改。\n\
  \n## 本章总结\n\n在本章中，我们讨论了所有权和权限。分配用户和组只能控制谁可以访问文件系统，但不能控制他们对文件系统中的文件或目录可以做什么。为了做到这一点，我们需要实现所有权和权限管理。\n\
  \n每当用户创建一个文件或目录时，该用户会自动被分配为其所有者。此外，用户所属的组将成为该文件或目录的组所有者。这些默认值是可以更改的；但只有 `root` 可以更改文件或目录的所有者。所有者可以更改其组。\n\
  \n要修改所有权，请使用 `chown` 命令。该命令可以更改拥有文件或目录的 `user` 和/或 `group`。如果仅更改 `group`，请使用 `chgrp`\
  \ 命令。分配给用户、组和其他用户的权限共同构成了文件或目录的模式。\n\n`chmod` 工具用于从 提示符管理权限，使用以下任何一种语法为 `user`、`group`\
  \ 和/或 `other` 分配权限：\n\n* `chmod u=rw,g=rw,o=r <file_or_directory>`\n* `chmod ug=rw,o=r\
  \ <file_or_directory>`\n* `chmod 664 <file_or_directory>`\n\n默认情况下，Linux 在创建新文件时会自动赋予其\
  \ `-rw-rw-rw-` 权限，并对新目录赋予 `drwxrwxrwx` 权限。然而，为了增加安全性，使用了 `umask` 变量来自动移除某些权限。\n\n\
  我们还简要讨论了可以分配的特殊权限。在使用上述数值时，通过在命令的用户数字前添加额外的数字，使用 `chmod` 以数值形式分配这些权限。例如，`chmod 6755\
  \ <command>` 将为命令设置 SUID 和 SGID 位。现在，程序将以用户（所有者）权限和命令的组权限运行，而不是用户的权限。\n\n最后，可以使用\
  \ ACL 和文件属性创建额外的文件安全设置。使用 `setfacl` 命令设置 `chmod` 之外的细粒权限。使用 `chattr` 命令通过使文件变为不可变来保护文件。这可以防止任何用户（包括\
  \ `root`）意外删除文件！\n\n* 使用 `ls -l` 命令查看所有权（注意该命令使用的是小写 `l`，而不是数字 1）。\n* 使用 `chown`\
  \ 工具配置文件或目录的用户和组所有权。\n* 你必须以 `root` 登录才能更改用户所有权。\n* 你必须以 `root` 或文件/目录所有者的身份登录才能更改组所有权。\n\
  * 权限用于定义用户对文件系统中的文件或目录可以或不能做什么。\n* Linux 对文件和目录使用读、写和执行权限。\n* Linux 权限分配给用户 (`u`）、组\
  \ (`g`）和其他 (`o`）。\n* 权限可以用数字表示：读 = 4，写 = 2，执行 = 1。\n* 这些权限对于大多数情况来说不安全，因此使用 `umask`\
  \ 变量从默认值减去特定权限。\n* `umask` 的默认值为 `022`，它从组和其他减去写权限 (`2`）。\n* 修改 `umask` 的值可以更改创建时分配的默认权限。\n\
  * Linux 还包含三个默认特殊权限：粘位（Sticky）、SUID 和 SGID。\n* 通过在命令的用户数字前添加额外的数字，使用 `chmod` 分配特殊权限。\n\
  \n### 问题\n\n**[1].** 你需要将名为 `/var/opt/runme` 的文件所有者从 `mireland`（`staff` 组成）更改为 `dnelson`（`editors`\
  \ 组成）。假设你想同时更改用户和组所有者，哪个命令可以实现此操作？\n\n**A.** `chown mireland dnelson /var/opt/runme`\n\
  **B.** `chown -u \"dnelson\" -g \"editors\" /var/opt/runme`\n**C.** `chown dnelson\
  \ /var/opt/runme`\n**D.** `chown dnelson:editors /var/opt/runme`\n\n**[2].** 应用于目录时，哪种权限允许用户进入该目录？\n\
  \n**A.** 读取\n**B.** 写入\n**C.** 执行\n**D.** 访问\n\n**[3].** 用户需要打开一个文件、编辑并保存更改。用户需要什么权限？\n\
  \n**A.** 读取\n**B.** 写入\n**C.** 执行\n**D.** 修改\n\n**[4].** 一个名为 `employees` 的文件模式为\
  \ `-rw-r--`。如果 `uffman` 不是所有者而是组员，他能对文件做什么？\n\n**A.** 他可以打开文件，但不能保存。\n**B.** 他可以打开文件并进行更改。\n\
  **C.** 他可以更改所有权。\n**D.** 他可以运行该文件。\n\n**[5].** 一个名为 `myapp` 的文件模式为 `755`。如果 `dnelson`\
  \ 不拥有该文件也不是组员，她能做什么？\n\n**A.** 她可以更改组。\n**B.** 她可以打开文件并保存文件。\n**C.** 她可以更改所有权。\n\
  **D.** 她可以运行该文件。\n\n**[6].** 你需要更改名为 `schedule` 的文件的权限，使得文件所有者可以编辑它，组内成员的用户可以编辑它，而不是所有者且不属于组的用户可以查看但不能修改。哪个命令可以实现此操作？\n\
  \n**A.** `chmod 664`\n**B.** `chmod 555`\n**C.** `chmod 777`\n**D.** `chmod 644`\n\
  \n**[7].** Linux 系统的 `umask` 变量当前设置为 `077`。名为 `jcarr` 的用户（`staff` 组成）创建一个名为 `mythoughts.odt`\
  \ 的文件。`staff` 组的成员对该文件做什么？\n\n**A.** 他们可以查看文件，但不能修改。\n**B.** 他们可以打开、修改并保存文件。\n**C.**\
  \ 他们可以打开、修改并保存文件。如果它是可执行的，他们还可以执行。\n**D.** 他们对文件没有访问权限。\n\n**[8].** 一个可执行文件设置了 SUID\
  \ 权限，并由 `root` 所有。如果 `guest` 用户在系统中运行此文件，程序将以什么权限运行？\n\n**A.** 创建文件的用户保持所有者。\n**B.**\
  \ 运行文件的用户成为文件的永久所有者。\n**C.** 程序将以 `root` 权限运行。\n**D.** `root` 用户成为文件的所有者。\n\n**[9].**\
  \ 哪个命令列出文件的 ACL？\n\n**A.** `setfacl --get`\n**B.** `getfacl`\n**C.** `getfacl --list`\n\
  **D.** `setfacl -g`\n\n**[10].** 下列哪个命令用于使文件变为不可变？\n\n**A.** `chattr +i <filename>`\n\
  **B.** `chattr -i <filename>`\n**C.** `chattr --immutable <filename>`\n\n\n\n\n\
  # D. `chattr ++immutable <filename>`\n\n## 回答\n\n**1.** **D.** 执行 `chown dnelson:editors\
  \ /var/opt/runme` 将将 `runme` 文件的所有者和组所有者改为 `dnelson` 和 `editors`。\n\n**2.** **C.**\
  \ 执行权限允许用户进入文件系统中的目录。\n\n**3.** **A, B.** 用户必须具有读和写权限才能打开并修改文件。\n\n**4.** **A.**\
  \ 在所示的模式下，`Group`（组）仅被赋予了读权限。由于 `mhuffman` 是该组的成员，他只能打开并查看文件内容。他无法修改并保存文件。\n\n**5.**\
  \ **D.** 因为 `dnelson`既不是所有者也不是所属组的成员，她被授予分配给 `Other`（其他）的权限，即读取 (`4`) 和执行 (`1`)。这允许她运行文件。\n\
  \n**6.** **A.** 执行 `chmod 664 schedule.odt` 将授予 `User`（用户）和 `Group`（组）读 (`4`) 和写\
  \ (`2`) 权限。它还将授予 `Other` 读 (`4`) 权限。\n\n**7.** **D.** 因为 `umask` 被设置为 `077`，所有权限（读\
  \ = `4`，写 = `2`，执行 = `1`）都从 `Group` 和 `Other` 中移除。因此，所属组的成员无法访问该文件，所以 `mythoughts.odt`\
  \ 的最终权限将是 `600`。\n\n**8.** **C.** `SUID` 权限会导致文件的 `User`（所有者）临时变为命令的所有者。\n\n**9.**\
  \ **B.** 要列出文件的 ACL，请使用 `getfacl` 命令。\n\n**10.** **A.** `chattr +i <filename>` 将为文件设置不可变位，使其即使是\
  \ `root` 也无法删除。\n\n## 第 7 章：存储管理\n\n在本章中，你将学习到：\n\n- 存储概述\n- 创建分区\n- 创建文件系统\n- 管理\
  \ Linux 文件系统\n- 管理配额\n\n*你无法完成从鱼类到哺乳动物的跨越，但这是谜题中重要的第一步。*\n—Ralph Etienne-Cummings，约翰·霍普金斯大学\n\
  \n本章介绍了用于构建和管理存储的元素。存储概念是文件、块和对象存储系统的基础。你还将学习如何为用户和组创建加密文件系统和配额。\n\n## 存储概述\n\n\
  新磁盘是一个巨大的存储空间。分区用于将整个或部分的驱动器分配到逻辑存储空间（参见图 7-1）。\n\n![Images](img/F07-01.jpg)\n\n\
  **图 7-1** 分为分区的硬盘\n\n可用的分区类型（MBR 或 GUID）取决于引导方法。你需要了解有关存储设备的一些基础知识，以便正确配置它们来保存数据。这些基础知识包括对以下主题的理解：\n\
  \n- 主引导记录\n- GUID 分区表\n- 设备命名规范\n- 查看磁盘分区\n\n### 主引导记录\n\n在运行基本输入/输出系统 (BIOS)的系统上，主引导记录\
  \ (MBR)位于硬盘的第一个扇区。\n\n![Images](img/note.jpg)\n\n**注意** 扇区是硬盘设备最小的存储单元。传统上，这种大小为\
  \ 512 字节，但使用高级格式 (AF)的新硬盘可以将扇区大小增加到 4,096 字节。支持 AF 的硬盘可以模拟 512 字节的扇区。\n\nMBR 设计用于适应一个\
  \ 512 字节的扇区（参见图 7-2）。前 446 字节分配给引导代码和错误消息，接下来的 64 字节包含分区表，最后 2 字节存储磁盘签名。磁盘签名指向引导加载程序的根目录。\n\
  \n![Images](img/F07-02.jpg)\n\n**图 7-2** 主引导记录布局\n\nMBR 的分区表设计用于包含四个 16 位的分区表项。这一限制使得基于\
  \ BIOS 的系统无法支持超过四个主分区。四分区的限制通过使用扩展分区得以克服。扩展分区是一个可以划分为逻辑分区的主分区。扩展分区使用扩展主引导记录 (EMBR)\
  \ 跟踪逻辑分区。逻辑分区是位于扩展分区中的分区。逻辑分区编号从五开始。示例分区方案如图 7-3 所示。\n\n![Images](img/F07-03.jpg)\n\
  \n**图 7-3** BIOS 分区方案\n\n![Images](img/note.jpg)\n\n**注意** BIOS 支持 24 位的柱面、磁头、扇区\
  \ (CHS)寻址和 32 位的逻辑块寻址。32 位寻址将最大磁盘大小限制在 2TB。\n\n### GUID 分区表\n\nGUID 分区表 (GPT) 设计用于克服\
  \ BIOS 的某些局限性，并通过增加冗余来提供更高的安全性。GUID 分区表名称是指为每个分区分配全局唯一标识符 (GUID)。这个概念类似于通用唯一标识符\
  \ (UUID) 函数，它为文件系统和系统设备提供唯一的标识数字。\n\n#### GPT 分区表方案\n\nGPT 是跨越整个磁盘设备的单个分区。分区的组件通过逻辑块地址\
  \ (LBA) 访问。在查看与 GPT 分区方案相关的 LBA 数字时，你会看到正数 LBA 数字，它们表示从驱动器开始偏移的块位置，以及负数 LBA 数字，它们表示从磁盘设备末尾偏移的块位置（参见图\
  \ 7-4）。存储在正数块中的信息是主项，存储在负数块中的信息是次要（备份）项。\n\n![Images](img/F07-04.jpg)\n\n**图 7-4**\
  \ GPT 逻辑块地址编号\n\n![Images](img/exam.jpg)\n\n**考试提示** GUID 分区表 (GPT) 的详细特征在此列出仅供参考。它们不是\
  \ Linux+ 考试目标。第 20 章提供了关于 GPT 结构的更多细节。\n\n#### GPT 优点\n\nGPT 分区的的一些优点包括：\n\n- 4KB\
  \ 扇区\n- 由于支持 64 位寻址，磁盘容量从 2.2 太字节 (TB) 到约 8 泽字节 (ZB)\n- 冗余，因为分区头和表存储在磁盘的开头和结尾\n\
  - 可读的分区名称\n\n### 设备命名规范\n\n设备名称格式为 `xxyz`，其中：\n\n- `xx` 是设备类型。\n- `y` 表示设备的逻辑单元数。\n\
  - `z` 表示分区号。\n\n##### 设备类型 (*xx*)\n\n设备类型的示例包括存储设备，例如 `sd`（SCSI 设备）和 `hd`（IDE 硬盘）。其他设备包括终端，例如\
  \ `tty`（文本终端）和 `pts`（伪终端）。\n\n##### 逻辑单元数 (*y*)\n\n接下来，设备名称包含设备的逻辑单元数，这是组设备中设备的唯一标识符。例如，系统可能有多个\
  \ SCSI 设备（设备类型为 `sd`）。为了区分不同的 SCSI 设备，每个 SCSI 设备都分配有一个唯一的标识符。逻辑单元 `sda` 指第一个 SCSI\
  \ 设备。第二个 SCSI 设备将是 `sdb`。此外，\n\n- `tty1` 指第一个文本终端。\n- `pts/0` 指第一个伪终端。\n- `lp0`\
  \ 指第一个打印机。\n- `st0` 指第一个 SCSI 磁带机。\n- `sr0` 指第一个光驱驱动器（CD/DVD）。\n\n##### 分区号 (*z*)\n\
  \n块设备可以被划分为带编号的分区。第一个 SCSI 设备第一个分区的设备名称为 `sda1`，如之前的图 7-1 所示。\n\n\n\n\n\n考试提示：`/dev/sda1`\
  \ 是第一个硬盘第一个分区的驱动器。`/dev/sdb3` 是第二个硬盘第三个分区的驱动器。\n\n## 查看磁盘分区\n\n有时你需要查看磁盘设备是如何分区的。你可以使用\
  \ `lsblk`、`fdisk -l` 和 `parted -l` 命令来实现。\n\n### `lsblk` 命令\n\n如图 7-5 所示，`lsblk`\
  \ 命令显示了块设备及其分区的列表。要查看 USB 设备列表、其模型和制造商信息，请运行 `lsusb` 命令。\n\n![Images](img/F07-05.jpg)\n\
  \n**图 7-5** `lsblk` 输出\n\n### `fdisk -l` 命令\n\n如图 7-6 所示，`fdisk -l` 命令显示了所有块设备的分区表。\n\
  \n![Images](img/F07-06.jpg)\n\n**图 7-6** `fdisk -l` 输出\n\n如图 7-7 所示，`fdisk -l /dev/<device_name>`\
  \ 命令显示由参数 `/dev/<device_name>`提供的物理块设备的分区信息。\n\n![Images](img/F07-07.jpg)\n\n**图\
  \ 7-7** `fdisk -l /dev/sdb` 输出\n\n### `parted -l` 命令\n\n如图 7-8 所示，`parted -l <device_name>`\
  \ 命令和 `fdisk -l` 将显示磁盘分区信息。`parted` 命令会打印一些详细的逻辑卷信息。\n\n![Images](img/F07-08.jpg)\n\
  \n**图 7-8** `parted -l /dev/<device_name>` 输出\n\n要使用 `parted` 查看单个设备，请执行 `parted`\
  \ 命令（图 7-9 第 1 行）。看到 `parted` 提示符后，使用 `select` 选择要检查的设备（第 7 行）。选择设备后，执行 `print`\
  \ 命令（第 10 行）来打印设备的分区表。注意，此方法不会打印元设备信息。**\n\n![Images](img/F07-09.jpg)\n\n**图 7-9**\
  \ `parted select` 命令输出\n\n### 创建分区\n\n分区是物理磁盘设备的一部分，被视为块设备。`fdisk`、`parted` 和 `gdisk`\
  \ 命令用于在磁盘设备上创建分区的应用程序。`gdisk` 专门用于具有 GPT 分区表的设备。\n\n本节将讨论创建分区的规划和执行。在本节中，我们将讨论：\n\
  \n- 分区考量\n- `fdisk` 分区工具\n- `parted` 分区工具\n- `gdisk` 分区工具\n- 块设备加密\n\n### 分区考量\n\
  \n在添加分区时，你必须考虑几个因素，包括分区可用性、磁盘空间可用性、分区大小和交换分区大小。\n\n#### 分区可用性\n\nSCSI 设备可以多有 15\
  \ 个分区，IDE 设备可以有 63 个分区。在图 7-10 所示的示例中，我在 SCSI 设备上使用了八个分区，因此我还可以最多添加七个分区。\n\n![Images](img/F07-10.jpg)\n\
  \n**图 7-10** `fdisk -l /dev/sdb` 命令输出\n\n#### 磁盘空间可用性\n\n通过确定设备上的总扇区数（图 7-10 第 10\
  \ 行）与最后一个分区的结束扇区之间的差，可以判断是否有空间添加额外的分区。\n\n#### 分区大小\n\n大多数操作系统和应用程序都有文档说明它们所需的磁盘空间。许多第三方应用程序根据应用程序的类型、访问应用程序的人数以及预计的数据量来指定要求。还要考虑使用逻辑卷管理\
  \ (LVM)，这在第 8 章 中介绍，允许管理员动态增加分区和文件系统的大小。\n\n#### 交换分区大小\n\n交换空间是在交换文件系统中创建的虚拟内存空间。交换文件系统可以创建在分区上，也可以在文件中。当活动进程所需的内存超过可用内存时，操作系统会通过移动（交换）不活跃的内存页到块设备来使用交换空间。交换空间应该大于系统安装的内存量，因为当系统崩溃时，它会将内存转储到交换空间以便后续分析。\n\
  \n#### `fdisk` 分区工具\n\n`fdisk` 工具用于修改磁盘设备的分区表。在应用程序中进行的任何更改都存储在内存中，直到更改被写入磁盘的分区表。\n\
  \n`fdisk <device_path>` 命令用于管理特定设备的分区。例如，`fdisk /dev/sda` 命令允许我们修改 `/dev/sda` 的分区表。\n\
  \n![Images](img/exam.jpg)\n\n**考试提示** Linux+ 认证考试侧重于 `fdisk`，因为它是最常用的硬盘分区命令行工具。\n\
  \n在对设备进行更改之前，请了解其当前配置。为了我们的目的，我们将使用如之前图 7-7 所示的 `fdisk -l /dev/sdb` 命令。\n\n表 7-1\
  \ 提供了用于描述分区的列的摘要。\n\n![Images](img/f0190-01.jpg)\n\n**表 7-1** `fdisk` 分区列\n\n检查信息后，我们发现该磁盘设备包含四个主分区。其中一个主分区是一个扩展分区，它包含三个逻辑分区。\n\
  \n![Images](img/note.jpg)\n\n**注意** 对磁盘设备进行分区时，扩展分区应该是最后一个主分区，并应该占据驱动器上剩余的可用空间。\n\
  \n在 `fdisk` 运行时，我们现在有了一个可以用来输入 `fdisk` 命令的提示符。你可以输入 `m` 查看可用命令的帮助菜单，如下所示：\n\n![Images](img/f0190-02.jpg)\n\
  \n![Images](img/f0191-01.jpg)\n\n### 创建分区\n\n如果你想创建一个新分区，输入 `n` 然后指定你想创建主分区 (`p`)、扩展分区\
  \ (`e`) 还是逻辑分区 (`l`)。\n\n![Images](img/note.jpg)\n\n**注意** 你只能在扩展分区中创建逻辑分区。如果不存在扩展分区，你将不会提供创建逻辑分区的选项。\n\
  \n要创建主分区，在提示时输入 `p`。要创建扩展分区，输入 `e`。然后你会被提示指定分区号：\n\n![Images](img/f0191-02.jpg)\n\
  \n按下 `Enter` 键将应用默认分区号。默认分区号将是下一个可用的分区。你可以指定 `1` 到 `4` 之间的任何数字。但你不能使用已分配的分区号。\n\n\
  下一个输入是起始扇区。通常你会接受默认值。虽然你可以更改起始扇区，但必须注意以下点：如果你在现有分区中选择扇区，你将收到“值超出范围”错误。你也可以选择大于默认值的起始扇区数，这将浪费磁盘空间。许多年前，数据被放置在硬盘最高部分以提高效率和速度，从而导致了间隙。这种做法不再需要了。\n\
  \n你可以通过输入扇区数或以 KB、MB 或 GB 为单位的大小来指定分区的大小。\n\n指定大小后，你应该输入 `p` 来验证你的新分区。这将显示磁盘的所有分区，如下例例所示：\n\
  \n![Images](img/f0191-03.jpg)\n\n你可以通过将块数乘以当前块大小来验证大小，或者确定使用的扇区数并乘以扇区大小来验证。\n\n\
  `ID` 列包含文件系统代码。默认情况下，分区被分配分区代码为 `83`。如果你正在创建一个包含不同文件系统类型的分区，则必须更改文件系统代码。这是通过输入 `t`\
  \ 然后输入你想更改的分区号来实现的。如果你不知道分区代码，输入小写 `l` 来列出所有有效的分区代码 (`ID`) 及其描述。\n\n\n\n例如，Linux\
  \ 交换分区的分区代码为 `82`。要更改分区类型，你可以输入 `t`，指定要更改的分区编号，然后输入分区代码 `82` 即可将该分区更改为交换分区。\n\n\
  ### 删除分区\n\n要使用 `fdisk` 删除分区，请在命令提示符处输入 `d` 并指定要删除的分区编号。一旦你将更改提交磁盘，该分区上的任何数据将会丢失。\n\
  \n### 将更改写入分区表\n\n一旦你完成内存中对分区表的编辑，就必须使用写入（`w`）命令将新分区表写入磁盘，如下所示：\n\n![Images](img/f0192-01.jpg)\n\
  \n一旦分区表被写入，写入命令将尝试用新信息更新内核，但如果任何磁盘分区已挂载，内核更新将失败并提示 `error:ioctl device busy`。\n\n\
  若要强制内核将新的分区表读入内存，请执行命令 `partprobe` 或 `partprobe <device_path>`。\n\n### ``parted`\
  \ 分区工具\n\n要使用 `parted` 命令，请在 shell 提示符处输入 `parted`，然后使用 `select` 命令指定要管理的磁盘。但要非常小心，因为\
  \ `parted` 会自动选择第一块硬盘，即包含你的系统和主目录分区的硬盘。不小心删除此磁盘上的分区可能会导致严重，因为你将丢失所有数据！如果你打算在 `/dev/sda`\
  \ 以外的磁盘上操作，务必使用 `select` 子命令。\n\n![Images](img/caution.jpg)\n\n**注意** `parted` 工具会立即将分区更改写入磁盘。在使用\
  \ `parted` 时，请务必确定你想要进行的更改万无误！\n\n在选择了合适的硬盘后，在 `parted` 提示符处使用 `mkpart` 子命令创建一个新分区。你需要指定以下内容：\n\
  \n- **要创建的分区类型**：例如，要创建一个标准的 Linux 分区，你将指定值为 `linux`。\n- **分区在磁盘上的起始点（单位：兆字节）**：例如，要创建一个从磁盘上\
  \ 1GB 处开始的分区，你将指定值为 `1024`。\n- **分区在磁盘上的结束点（单位为兆字节）**：例如，要创建一个在磁盘上 11GB 处结束的分区，你将指定值为\
  \ `11264`。\n\n要查看磁盘上已创建的分区，可以在 `parted` 提示符处使用 `print` 子命令。在以下示例中，在系统的第二块硬盘（`/dev/sdb`）上创建一个\
  \ 10GB 的分区：\n\n![Images](img/f0193-01.jpg)\n\n你还可以在 `parted` 提示符处使用以下命令来管理磁盘分区：\n\
  \n- 要重命名分区，输入 `name <partition_name>`。\n- 要将分区移动到磁盘上的不同位置（这是一个非常实用的功能），输入 `move\
  \ <partition> <start_point> <end_point>`。\n- 要调整磁盘上分区的大小（另一个非常实用的功能），输入 `resize\
  \ <partition> <start_point> <end_point>`。\n- 要从磁盘上删除分区，输入 `rm <partition>`。\n\n\
  ### ``gdisk` 分区工具\n\n要管理 GPT 分区，请使用 `gdisk` 工具。`gdisk` 理解可扩展固件接口 (EFI) 硬盘结构。该工具可执行以下任务：\n\
  \n- 将 MBR 分区表转换为 GPT 分区表。\n- 验证硬盘\n- 创建和删除 GPT 分区\n- 显示分区信息\n- 更改分区的名称和类型\n- 备份和恢复磁盘的分区表\n\
  \n例如，要向第二块磁盘添加 GPT 分区，首先切换到 `root` 用户，并在 shell 提示符处输入 `gdisk /dev/sdb`。`gdisk` 使用许多与\
  \ `fdisk` 命令相同的命令行选项。输入 `?` 查看 `gdisk` 子命令列表，如下所示：\n\n![Images](img/f0194-01.jpg)\n\
  \n要向磁盘添加新分区，在 `gdisk` 提示符处输入 `n`。随后系统会提示你指定以下内容：\n\n- **分区编号**：分区编号是连续的。`EFI` 允许从\
  \ `1` 到 `128` 的分区编号。你可以提供一个唯一的分区编号或接受建议的分区编号。\n- **分区大小**：你可以指定分区的起始和结束扇区，也可以指定你希望分区在磁盘的何处开始和结束（例如磁盘上的\
  \ 10GB 和 20GB 处）。\n- **分区类型**：`gdisk` 的分区类型数字与 MBR 分区使用的数字不同。例如，要创建一个 Linux 分区，请使用分区类型\
  \ `8300`。在 `gdisk` 提示符处按大写 `L` 或小写 `l` 可查看所有可能的分区类型及其代码。\n\n此过程如示例所示：\n\n![Images](img/f0195-01.jpg)\n\
  \n完成后，在 `gdisk` 提示符处输入 `p` 查看磁盘上的分区列表。与 `fdisk` 一样，你通过 `gdisk` 进行的更改在写入之前并不会实际提交到磁盘。要接受对磁盘分区的更改，请在\
  \ `gdisk` 提示符处按 `w`。要删除分区，输入 `d`。要更改分区类型，输入 `t` 然后输入要使用的分区类型代码。若要在不保存任何更改的情况下重新开始，请输入\
  \ `q`。\n\n### 块设备加密\n\n块设备加密通过在写入时加密数据以及读取时解密数据，来保护块设备上的数据机密性，即使设备从系统中移除也是如此。要访问该设备，你必须在系统启动期间输入密码以激活解密密钥。\n\
  \n#### 创建加密块设备\n\nLinux 统一密钥设置 (LUKS) 支持物理卷、逻辑卷、RAID 以及当然还有物理块设备。\n\n使用命令 `dd if=/dev/urandom\
  \ of=<device_name>` 在块设备上放置随机数据。在硬盘上放置随机数据使得攻击者难以区分真实数据和随机数据。\n\n使用命令 `cryptsetup\
  \ luksFormat <device>`（见图 7-11\n\n**图 7-11** 加密块设备\n\n每个加密块设备都被分配一个 UUID，用于为加密设备提供设备映射器（device\
  \ mapper）名称，该名称用于访问设备的内容。\n\n命令 `cryptsetup luksUUID /dev/<device_name>`（图 7-12\
  \ 中的第 1 行）说明了如何获取并显示加密块设备的 UUID。命令 `cryptsetup luksOpen <device> <device_name>`（图\
  \ 7-12 中的第 4 行）创建一个设备映射器名称。注意 `luks-<UUID>` 被用作设备。此示例使用了与加密设备相同的 UUID。这可以提供一个唯一的设备映射器名称。你可以使用命令\
  \ `ls -l /dev/mapper` 来验证设备名称已创建。\n\n![Images](img/F07-12.jpg)\n\n**图 7-12** 为加密设备命名\n\
  \n### 创建文件系统\n\n文件系统管理数据的存储和检索。Linux 通过内核模块和称为虚拟文件系统 (VFS) 的抽象层支持多种文件系统。\n\n在本节中，你将学习关于文件系统的知识：\n\
  \n- 可用文件系统\n- 构建文件系统\n- 挂载文件系统\n- 在启动时自动挂载文件系统\n- 使用 `umount` 卸载分区\n\n#### 可用文件系统\n\
  \n要使用特定类型的文件系统，必须有相应的内核模块。要确定哪些文件系统模块可用，请执行以下 `command`（见图 7-13)）：\n\n\n\n\n\n![Images](img/F07-13.jpg)\n\
  \n**图 7-13** 显示可用的文件系统\n\n```\nls -l /lib/modules/$(uname -r)/kernel/fs\n```\n\n\
  要确定当前加载了哪些内核文件系统模块，请执行命令 `cat /proc/filesystems`。图 7-14 中的`nodev`（无设备）术语表示文件系统未位于块设备上，而是加载在内存中。\n\
  \n![Images](img/F07-14.jpg)\n\n**图 7-14** `cat /proc/filesystems` 命令输出\n\n图 7-15\
  \ 所示的 `blkid` 命令显示分区的 UUID 和文件系统类型。\n\n![Images](img/F07-15.jpg)\n\n**图 7-15** `blkid`\
  \ 命令输出\n\n### 构建文件系统\n\n一旦创建了分区，就要对其进行准备以存储数据。要做到这一点，需要在该分区上创建一个文件系统。这可以通过几个命令之一来实现。在本章的这部分，我们将查看\
  \ `mkfs`、`xfs`、`btrfs` 和 `mkswap`。\n\n表 7-2 描述了若干文件系统类型。\n\n![Images](img/f0198-01.jpg)\n\
  \n**表 7-2** 文件系统类型\n\n### 使用 `mkfs` 创建文件系统\n\n`mkfs` 工具用于在分区上创建 `ext2`、`ext3` 或\
  \ `ext4` 文件系统。使用 `-t` 选项指定要使用的文件系统及其具体类型。例如，要在第二个硬盘的第一个分区上创建 `ext4` 文件系统，请输入 `mkfs\
  \ -t ext4 /dev/sdb1`。这里有一个示例：\n\n![Images](img/f0198-02.jpg)\n\n![Images](img/f0199-01.jpg)\n\
  \n以下是上述输出中需要注意的几项：\n\n- `Block size=4096` 这指定块大小为 4KB。在本示例中，该值被确定为在该创建文件系统所在的小型\
  \ 8GB 分区上的优值。较小的分区将具有较小的块大小。\n\n- `524288 inodes, 2096474 blocks` 文件系统最多有 524,288\
  \ 个 inode 和 2,096,474 个块。这意味着分区上最多可以存放 524,288 个文件。一旦创建了 524,288 个文件，即使有可用磁盘空间也无法添加更多文件。将块总数（2,086,474）乘以块大小（4,096），即可计算出分区的总大小（在这种情况下约为\
  \ 8GB）。\n\n- `Superblock backups stored on blocks: 32768, 98304, 163840, 229376,\
  \ 294912, 819200, 884736, 1605632` 超块列出了文件系统元数据，是进入整个文件系统的路线图。如果超块损坏，文件系统将无法访问。可以从每个块组中的副本中恢复超块。\n\
  \n文件系统被划分为块组（最初称为圆柱组）。块组管理文件系统的较小部分。每个块组包含数据块、超块的副本、如 inode 表之类的块组元数据以及指向数据块的映射。\n\
  \n### 使用 `tune2fs` 修改文件系统\n\n`tune2fs` 命令用于调整 `ext2, ext3 和 ext4` 文件系统上的各种文件系统参数。表\
  \ 7-3 详细说明了一些可用的选项。\n\n![Images](img/f0200-01.jpg)\n\n**表 7-3** `tune2fs` 命令选项\n\
  \n命令 `tune2fs -L` 在文件系统上设置一个标签：\n\n![Images](img/f0199-02.jpg)\n\n### 创建 XFS 文件系统\n\
  \n扩展范围文件系统 (XFS) 由 Silicon Graphics (SGI) 为其 IRIX 操作系统创建。它是一个非常快速且灵活的文件系统。它也被移植到\
  \ Linux 上运行，尽管在我看来它在 Linux 下的性能没有在 IRIX 下好。\n\n创建 XFS 文件系统非常简单。其方法与使用 `mkfs` 命令创建\
  \ `extx` 文件系统相同。首先，使用 `fdisk` 创建一个标准的 Linux 分区（类型 `83`）。然后在 shell 提示符下输入 `mkfs.xfs\
  \ <device>` 或 `mkfs -t xfs <device>`。\n\n使用 `xfs_admin` 命令更改参数并管理 XFS 文件系统。运行 `xfs_admin\
  \ -L <label> <device>` 可设置文件系统标签。\n\n### 创建 BTRFS 文件系统\n\nB 树文件系统 (BTRFS) 提供了写复制\
  \ (COW) 和逻辑卷功能。它是一个非常快速、灵活的文件系统，旨在扩展到所需的存储空间，是目前 SUSE Linux 的默认文件系统。\n\n创建 BTRFS\
  \ 文件系统非常直接。首先，使用 `fdisk`、`parted` 或 `gdisk` 创建标准的 Linux 分区。然后在 shell 提示符下输入 `mkfs.btrfs\
  \ <device>`。\n\n要管理 BTRFS 文件系统，使用 `btrfs` 命令。运行 `btrfs filesystem show` 显示计算机上 `btrfs`\
  \ 文件系统的信息。\n\n### 管理交换空间\n\n系统内存可能是物理 RAM（随机存存储器）或虚拟内存。运行的应用程序存储在 RAM 中。交换空间是在块设备上创建的虚拟内存。\n\
  \n当 RAM 满时，必须释放某些内存为执行额外的程序留出空间。为此，内存管理软件会将存储在 RAM 中当前未使用的数据页交换到虚拟内存中。\n\n**创建交换分区**\
  \ 要创建交换分区，必须先添加一个类型 `82` 的分区。执行 `mkswap` 命令在分区上创建一个交换区域。该命令的语法为 `mkswap <device_path>`。例如，`mkswap\
  \ /dev/sdb2` 会产生以下输出：\n\n![Images](img/f0201-02.jpg)\n\n尽管你创建了交换分区，在启用之前操作系统无法使用该交换空间。在启用新创建的交换空间之前，执行命令\
  \ `free`，它会显示可用和已用的内存及交换空间总量（参见表 7-4）。\n\n![Images](img/f0201-01.jpg)\n\n**表 7-4**\
  \ `free` 命令输出\n\n接下来，你可以执行命令 `swapon -s` 来确定当前使用的交换分区。执行命令 `swapon </device_path>`\
  \ 来启用新创建的交换空间，然后执行 `free` 和 `swapon -s` 命令验证交换空间是否正常。\n\n交换文件系统的优先级决定了何时使用它。优先使用优先级交换文件系统。如果用户在创建交换文件系统时未指定优先级，内核将分配一个负优先级数字。\n\
  \n要为交换空间设置优先级，添加选项 `-p <priority_number>`。例如，命令 `mkswap /dev/sdb2 -p 60` 将为 `/dev/sdb2`\
  \ 上的交换文件系统分配优先级 `60`。\n\n具有相同优先级的交换分区以轮询方式访问。为了提高效率，考虑创建多个具有相同优先级并使用最高优先级数字。\n\n\
  要禁用现有交换分区，在 shell 提示符下输入 `swapoff <device>`（例如 `swapoff /dev/sdb2`）。\n\n### 创建交换文件\n\
  \n如果你不想创建新的交换分区但需要额外的交换空间，可以创建一个交换文件。为此使用 `dd`、`chmod`、`mkswap` 和 `swapon` 命令。使用\
  \ `dd` 命令通过从文件 `/dev/zero` 复制输入并写入另一个文件来创建该文件。\n\n![Images](img/caution.jpg)\n\n\
  **注意** 磁盘到磁盘复制工具 `dd` 的一个委婉说是“磁盘破坏者”。使用此命令时要小心！\n\n为了我们的目的，我们将使用表 7-5 中显示的 `dd`\
  \ 选项。\n\n![Images](img/f0202-01.jpg)\n\n**表 7-5** `dd` 命令选项\n\n以下命令在 `/root` 目录下创建一个名为\
  \ `swapfile` 的 500MB 文件：\n\n```\ndd if=/dev/zero of=/root/swapfile bs=1M count=500\n\
  ```\n\n![Images](img/f0202-02.jpg)\n\n![Images](img/exam.jpg)\n\n**考试技巧** `dd` 工具缺少标准的进度条。要查看\
  \ `dd` 会话的进度，向运行中的 `dd` 进程发送 `kill` 信号 `-SIGUSR1` 或 `-10`。`kill` 和 `killall` 命令将在第\
  \ 9 章中讨论。\n\n接下来，将文件的权限更改为 `600`，以便只有 `root` 可读写。这些权限不会限制用户作为交换空间访问该文件；它们只是防止用户使用\
  \ `vi` 等编辑器修改 `swapfile`。\n\n```\nchmod 600 /root/swapfile\n```\n\n\n\n\n\n通过执行\
  \ `mkswap` 命令在文件 `/root/swapfile` 上设置交换文件系统（swap filesystem）：\n\n```\nmkswap /root/swapfile\n\
  ```\n\n要使新的交换空间生效，请执行以下命令：\n\n```\nswapon /root/swapfile\n```\n\n现在，你已经添加了交换空间，这种方法比在当前使用的硬盘上创建交换空间要简单得多。如果你不再需要该\
  \ `swapfile`，请使用 `swapoff` 命令将其禁用，并删除该 `swapfile`。\n\n## 日志文件系统的故障排除（Journaled Filesystems）\n\
  \n`ext4` 和 `xfs` 等日志文件系统的一个优点是可以在服务器中断后具有快速的启动恢复时间。如果在意外拔掉服务器后，启动恢复花费了几小时甚至几天时间，请运行\
  \ `df -hT` 显示文件系统类型，验证系统是否正在运行 `ext2` 文件系统：\n\n![Images](img/f0202-06.jpg)\n\n此示例显示\
  \ `/dev/sdb1` 是 `ext2` 文件系统。你可以通过 `root` 用户运行 `tune2fs -j /dev/sdb1` 将其转换为日志类的 `ext3`\
  \ 类型文件系统。\n\n## 挂载文件系统\n\n挂载点（mount point）是目录与文件系统之间的逻辑连接，使用 `mount` 命令建立该连接。这允许用户访问存储设备上的文件系统。\n\
  \n在挂载分区之前，创建一个新目录，该目录将成为挂载点。例如，你可能会创建 `/public` 目录并让该目录指向分区 `/dev/sdb1`。\n\n`/mnt`\
  \ 和 `/media` 目录作为临时挂载点。`/mnt` 目录存放网络文件系统临时自动挂载的文件系统的挂载点，而 `/media` 是临时挂载介质（如光驱或\
  \ USB 闪存驱动）的挂载点。\n\n使用 `mount` 命令需要 root 权限。运行以下语法创建一个临时挂载点：\n\n![Images](img/f0203-01.jpg)\n\
  \n以下命令将创建一个从 `/public` 目录到系统第二个硬盘上第一个分区的 `ext4` 文件系统的链接：\n\n![Images](img/f0203-02.jpg)\n\
  \n现在，每当你执行命令 `cd /public` 时，你将访问存储在 `/dev/sdb1` 上的数据。\n\n### mount 命令选项\n\n`mount`\
  \ 命令的 `-o` 选项包含了多种挂载子选项。例如，使用 `-o ro` 将分区挂载为只读。查看 `mount` 帮助页以获取所有可用选项的完整列表。表 7-6\
  \ 描述了 `mount` 命令选项。\n\n![Images](img/f0204-01.jpg)\n\n**表 7-6** 挂载选项\n\n不带参数的 `mount`\
  \ 命令会显示已挂载的文件系统。你可以查看输出内容以验证设备是否已挂载。`mount` 命令输出的以下行行表示 `/dev/sdb1` 已挂载到 `/public`\
  \ 上，并使用了 `ext4` 文件系统：\n\n![Images](img/f0203-03.jpg)\n\n命令 `cat /proc/mounts` 显示已挂载文件系统的列表。要查看特定的挂载点，请执行\
  \ `cat /proc/mounts | grep <mount_point>` 或 `mount | grep <mount_point>`。\n\n若要用新选项重新挂载文件系统，请作为\
  \ `root` 用户执行以下命令：\n\n![Images](img/f0203-04.jpg)\n\n然后，运行命令 `mount -o remount,ro\
  \ /public` 将与 `/public` 挂载点关联设备重新挂载为只读。\n\n### 挂载可移动介质\n\n所有 Linux 发行版都支持外部存储设备。当插入可移动设备并通过\
  \ `uevent` 枚举时，`/var/log/messages` 中会创建一个条目。\n\n如果设备可用 `udev` 规则或自动挂载信息，则设备名称和文件系统挂载点将自动应用。如果需要枚举设备，你可以通过执行命令\
  \ `dmesg` 查看设备名称详情。为了避免查看整个日志，可以使用命令 `dmesg | tail -30` 查看最后被枚举的设备。其他命令如 `lsblk`\
  \ 和 `lsusb` 可能会有所帮助。\n\n一旦确定了设备名称，请创建一个分区并将设备挂载到空目录（理想情况下）上。通过这种方式挂载设备在重启之前非常好用。重启后必须重新挂载设备。为了确保它们在启动时可用，你需要更新配置文件，如文后所述。\n\
  \n## 启动时自动挂载文件系统\n\n设备通过在名为 `/etc/fstab` 的文件系统表中创建条目，或创建一个挂载系统单元（mount system unit）来自动挂载。\n\
  \n### 在 /etc/fstab 中添加挂载点\n\n`/etc/fstab` 文件包含设备的挂载参数。\n\n![Images](img/exam.jpg)\n\
  \n**考试提示** 在修改 `/etc/fstab` 之前，请进行备份。`/etc/fstab` 中的错误会导致系统无法启动，但你可以通过进入救援模式来恢复\
  \ `/etc/fstab` 的备份版本，这将在第 9 章 中讨论。\n\n运行命令 `cat /etc/fstab` 查看 `/etc/fstab` 的内容，如下例所示：\n\
  \n![Images](img/f0205-02.jpg)\n\n要指定交换优先级，在指定 `swap` 为文件系统后添加 `pri=#`，如下所示：\n\n\
  ![Images](img/f0205-03.jpg)\n\n表 7-7 描述了 `/etc/fstab` 中的字段。\n\n![Images](img/f0205-01.jpg)\n\
  \n**表 7-7** `/etc/fstab` 文件中的字段\n\n如果设备具有 `auto` 或 `defaults` 选项，则该设备将在启动时或每次执行\
  \ `mount -a` 命令时挂载。\n\n如果 `/etc/fstab` 中存在设备记录，可以通过执行命令 `mount <device>` 或 `mount\
  \ <mount point>` 来挂载，或者通过执行命令 `umount <device>` 或 `umount <mount_point>` 来卸载。\n\n\
  ### 作为挂载单元添加挂载点\n\n你也可以通过创建 `systemd` 挂载单元来自动挂载设备（参见图 7-16）。用户定义的单元放在 `/etc/systemd/system`\
  \ 中。进行这些更改后，执行 `systemctl daemon-reload`。关于使用 `systemd` 管理系统功能的更多信息请见第 9 章。\n\n\
  ![Images](img/F07-16.jpg)\n\n**图 7-16** 通过 `systemd` 单元挂载\n\n单元文件名必须与挂载点相同。在图 7-16\
  \ 中，挂载点 `LabExercises` 的文件名为 `LabExercises.mount.service`。\n\n### 挂载加密设备\n\n为了自动挂载加密设备，必须在\
  \ `/etc/crypttab` 中为设备创建条目。如果不存在，以 root 用户以 `744` 权限创建该文件。\n\n每条记录分为三个由空格或制表符分隔的字段，详见表\
  \ 7-8。\n\n![Images](img/f0206-01.jpg)\n\n**表 7-8** `/etc/crypttab` 文件中的字段\n\n一旦你在\
  \ `/etc/crypttab` 中创建了条目，请使用加密块设备的设备在 `/etc/fstab` 中创建一个条目。\n\n#### 使用 umount 卸载分区\n\
  \n`umount` 命令（注意，不是 *un*mount）会将内存中的任何设备信息写入设备，然后移除挂载点。如果任何用户正在使用该文件系统，则无法卸载。\n\n\
  命令 `fuser -vm <mount_point>` 显示访问文件系统的用户和进程。命令 `fuser -vm /home` 显示访问挂载在 `/home`\
  \ 目录的文件系统的用户和进程。\n\n要卸载分区，只需输入 `umount` 后跟设备或分区的挂载目录。例如，从挂载点 `/public` 卸载 `/dev/sdb1`，输入\
  \ `umount /dev/sdb1` 或 `umount /public`。示例如下：\n\n```\n# umount /dev/sdb1\n```\n\n\
  ### 挂载故障排除\n\n挂载选项会影响文件系统响应用户的方式。如果在挂载文件系统后用户无法保存工作，可能是因为文件系统被挂载为只读。通过运行 `mount`\
  \ 命令验证挂载选项，如下例所示。如果文件系统是只读挂载的，请将其重新挂载为读写。\n\n![Images](img/f0206-03.jpg)\n\n\n\n\
  \n\n上一个示例显示 `/dev/sdd1` 文件系统以只读模式挂载到 `/lee-st`。要解决此问题，以 `root` 身份运行 `mount -o remount,rw\
  \ /dev/sdd1 /lee-st` 将挂载项转换为可读写模式。\n\n### 排除损坏和不匹配的故障\n\n运行 `fsck` 可以修复大多数文件系统损坏。如果你看到类似\
  \ `Corrupt group descriptor` 的错误信息，请对所有 `fsck` 提回答 `YES`。在大多数情况下，文件系统在之后可以挂载，而无需回退备份磁带。\n\
  \n文件系统可能无法挂载的另一个原因是 `/etc/fstab` 中的设置不匹配。如果你正在挂载 `ext4` 类型的文件系统，但在 `/etc/fstab`\
  \ 中将其定义为 `ext3`，则它将无法正确挂载。在下面的示例中，`/dev/sdd2` 被创建为 `ext4` 文件系统：\n\n![Images](img/f0207-01.jpg)\n\
  \n将 `/etc/fstab` 中的 `ext3` 设置更改为 `ext4` 以解决不匹配问题。\n\n## 管理 Linux 文件系统\n\n与任何其他操作系统一样，你能够监控、维护并有时排查\
  \ Linux 文件系统的故障。在本节中，我们将涵盖以下主题：\n\n• 使用 `df` 验证空闲磁盘空间\n• 使用 `du` 验证目录使用情况\n• 使用\
  \ `dumpe2fs` 报告文件系统状态\n• 使用 `xfs_admin` 验证 XFS 文件系统\n• 检查文件系统完整性\n\n### 使用 `df`\
  \ 验证空闲磁盘空间\n\n为了向文件系统添加文件，必须拥有磁盘空间和可用的 inode。`df` (“disk free”)工具将显示已挂载文件系统的可用空间信息，如下：\n\
  \n![Images](img/f0207-02.jpg)\n\n命令 `df <filename>` 显示指定文件所在分区的信息，如示例所示：\n\n![Images](img/f0207-03.jpg)\n\
  \n默认输出以块为单位显示大小。`-h` 选项以人类可读的格式显示空间统计信息：\n\n![Images](img/f0208-01.jpg)\n\n添加 `-T`\
  \ 选项将显示文件系统类型，所示：\n\n![Images](img/f0208-02.jpg)\n\n当创建文件时，会被分配一个 inode 编号。如果文件系统耗尽了\
  \ inode，即使存在空间也无法创建文件。`df -i` 命令列出挂载文件系统的 inode 使用情况：\n\n![Images](img/f0208-03.jpg)\n\
  \n### 使用 `du` 验证目录使用情况\n\n你可以使用的另一个监控磁盘空间使用的工具是 `du` (“directory usage”)工具。它的功能是为指定的目录递归地提供每个文件磁盘空间使用的摘要。语法为\
  \ `du <filename or directory>`。`du` 的一些实用选项包括：\n\n• `-c`: 用于计算总计\n• `-s`: 用于为每个参数计算摘要\n\
  • `-h`: 用于以人类可读的格式显示输出\n\n`-h` 选项是最用的。这里有一个以人类可读的格式查看 `/tmp` 目录下文件所用空间的示例：\n\n![Images](img/f0209-01.jpg)\n\
  \n### 排除磁盘空间不足问题\n\n当磁盘空间不足时，结合使用 `df` 和 `du` 命令来查找可以删除的文件。运行 `df` 显示你有多少空闲磁盘空间。接下来，在所有目录上运行\
  \ `du -sh *` 以查看哪些目录占用空间最多的摘要。在下面的示例中，`/home/ted` 将是恢复磁盘空间的好地方。\n\n![Images](img/f0209-02.jpg)\n\
  \n恢复磁盘空间的理想区域是 `/var/log` 下。日志文件会不断增长。如果没有进行适当轮转，它们最终会填充硬盘并导致系统故障。确保使用 `logrotate`\
  \ 命令启用日志轮转以缓解此问题。\n\n### 使用 `dumpe2fs` 报告文件系统状态\n\n文件系统使用超级块（superblock）和气柱组（cylinder\
  \ groups）来管理文件系统的元数据。`dumpe2fs` 命令的输出显示存储在超级块和块组中的统计信息。`-h` 选项 `dumpe2fs -h <device_path>`\
  \ 将输出限制为存储在文件系统超级块中的信息。\n\n### 使用 `xfs_admin` 验证 XFS 文件系统\n\nXFS 有几个管理工具，包括 `df`\
  \ 命令。\n\n`xfs_admin` 修改未挂载 XFS 文件系统的各种参数（详见 表 7-9）。\n\n![Images](img/f0210-01.jpg)\n\
  \n**表 7-9** `xfs_admin` 选项示例\n\n图 7-17 中的 `xfs_info` 命令显示文件系统几何，例如 inode 大 (`isize`)\
  \ 和块大小 (`bsize`)。\n\n![Images](img/F07-17.jpg)\n\n**图 7-17** `xfs_info` 命令输出\n\n\
  ### 检查文件系统完整性\n\n文件系统检查工具 `fsck` 用于检查文件系统的完整性。要使用此工具，必须先 `umount` 待检查的文件系统。然后在 shell\
  \ 提示符处输入 `fsck <device>`。例如，要检查系统中第二个硬盘第一个分区上的文件系统，你将输入 `fsck /dev/sdb1`。`fsck`\
  \ 工具随后检查文件系统并显示报告，所示：\n\n![Images](img/f0210-03.jpg)\n\n注意此示例中运行了 `e2fsck`。这是因为\
  \ `fsck` 是几个错误检查工具的前端。`fsck` 根据文件系统类型选择正确的工具。如果该工具遇到错误，它会显示一个代表所遇错误总和的代码。\n\n检查完成后，使用\
  \ `mount` 命令重新挂载分区。\n\n### 排除输入/输出和设备问题\n\n通过调整 I/O 调度值，可以提高 NVMe、SSD、SCSI 和 SATA\
  \ 等存储设备上的性能。你可以在 `/sys/block/sda/queue/scheduler` 中配置设置以提高存储设备的性能，所示：\n\n![Images](img/f0210-04.jpg)\n\
  \n`none` 值实现了先进先出 (FIFO) 调度算法，适用于企业应用。`mq-deadline` 调度器分批对 I/O 请求排序，最适用于虚拟机客机。`bfq`\
  \ 调度器使用公平队列机制，最适用于桌面系统。`kyber` 调度器会自动调整以获得最佳延迟结果，最适用于 NVMe 等快速设备。\n\n例如，要将设置更改为\
  \ `bfq`，请运行以下：\n\n![Images](img/f0211-01.jpg)\n\n通过运行 `ioping` 和 `iostat` 来分析性能并比较调度器设置。在运行你最重要的应用时，分析\
  \ `iostat` 输出，如下：\n\n![Images](img/f0211-02.jpg)\n\n通过从 `bfq` 变为 `kyber`、`mq-deadline`\
  \ 和 `none` 来改进延迟、I/O 等待、低吞吐和低 IOPS。比较结果并选择为你的应用程序提供最佳整体的调度器。\n\n## 管理配额\n\n配额是限制用户或组可以使用的文件数量或磁盘空间大小的方法。配额应用于文件系统。在本节中，你将学习设置配额的步骤，包括以下内容：\n\
  \n• 编辑 `/etc/fstab` 设置配额\n• 创建配额数据库文件\n• 为用户和组分配配额\n\n为了讨论，我们将在 `/home` 文件系统上创建配额。\n\
  \n### 编辑 `/etc/fstab` 设置配额\n\n必须按文件系统启用配额。要做到这一点，请向文件系统选项添加 `usrquota` 以监控用户配额，并或\
  \ `grpquota` 以管理组配额。该项在 `/etc/fstab` 中的内容所示：\n\n![Images](img/f0211-03.jpg)\n\n\
  一旦做出更改，你必须重新挂载文件系统。你可以通过执行命令 `mount -o remount <filesystem_name>` 来。如果文件系统正忙，你可以使用命令\
  \ `mount -f -o remount < filesystem_name>`。在我们的示例中，命令将是 `mount -f -o remount /home`。*注意你可能会将某人踢出一个文件*。\n\
  \n\n\n\n\n处理忙碌文件系统的另一种方法是执行列出打开文件的命令，例如 `lsof | grep <filesystem_name>`，以确定使用该文件系统的进程\
  \ ID（PID）和用户。在示例中，命令将是 `lsof | grep home`。此时，你可以联系用户并要求他们关闭文件，然后重新挂载文件系统。\n\n###\
  \ 创建配额数据库文件\n\n文件系统修复后，你必须在文件系统的根目录下创建配额数据库文件。\n\n对于用户，我们将使用 `quotacheck` 命令来创建用户数据库文件\
  \ `aquota.user` 和/或组数据库文件 `aquota.group`。`quotacheck` 命令使用了表 7-10 中列出的选项。\n\n![Images](img/f0212-02.jpg)\n\
  \n**表 7-10** `quotacheck` 命令选项\n\n命令 `quotacheck -cug /<filesystem_name>` 将在文件系统的根目录下创建用户和组数据库文件。要在\
  \ `/home` 中创建文件，你需要执行命令 `quotacheck -cug /home`。\n\n### 为用户和组分配配额\n\n分配配额涉及三个元素：硬限制（hard\
  \ limit）、软限制（soft limit）和宽限期（grace period）。文件数量通过 inode 数指定（每个文件创建一个 inode），大小则以块（blocks）为单位指定，如下处使用\
  \ `edquota` 命令所示：\n\n![Images](img/f0212-01.jpg)\n\n`hard limit` 指定了一个精确的限制。在我们的示例中，我们将分配\
  \ 10 个文件的硬文件数量限制和 20MB 的硬大小限制。`soft limit` 指定了一个限制，该限制在宽限期指定的天数内可以被超过。`grace period`\
  \ 是在达到软限制后，用户或组必须将用量降至软限制以下的天数。宽限期过后，软限制将变为新的硬限制，要求用户或组在创建新文件之前删除一些文件。\n\n#### 为用户或组设置配额\n\
  \n命令 `edquota -u <user_name>` 用于为用户设置配额，命令 `edquota -g <group_name>` 用于为组指定配额。或者，你也可以使用现有用户\
  \ as 模板为新用户创建配额。例如，要将 `user1` 的配额设置复制到 `user2`，执行命令 `edquota -p user1 user2`。\n\n\
  要更改宽限期，执行命令 `edquota -t`。你可以指定天、小时、分钟或秒。\n\n#### 报告配额情况\n\n有两个命令可以收集配额报告：\n\n- `repquota`\
  \ 为文件系统生成配额报告\n- `repquota -a` 打印所有文件系统上所有用户和组的配额报告\n\n使用选项 `-u`（用户）或 `-g`（组）分别将报告限制为用户或组。命令\
  \ `repquota <filesystem_name>` 会报告该文件系统的用户配额和组配额。\n\n`quota` 命令显示特定用户或组的配额信息。用户只能通过执行\
  \ `quota` 命令显示自己的配额信息。然而，用户 `root` 可以显示任何用户的配额信息。\n\n#### 配额问题故障排除\n\n用户可能会发现他们无法再创建更多文件。这可能意味着他们耗尽了磁盘空间或\
  \ inode。他们可以通过分别运行 `df -h` 命令或 `df -i` 命令来检查此问题。但在确认磁盘空间和 inode 不是问题后，他们应该运行 `quota`\
  \ 命令来列出他们的配额限制：\n\n![Images](img/f0213-01.jpg)\n\n在此示例中，用户 `ianmausi` 超过了块的软限制。仅凭此信息用户本可以创建更多文件；但\
  \ inode 已经达到了硬限制，这就是用户无法再创建更多文件的原因。\n\n### 练习 7-1：管理 Linux 分区\n\n在本次练习中，你将练习操作 Linux\
  \ 分区。\n\n![Images](img/video.jpg)\n\n**视频** 请观看练习 7-1 视频，演示如何执行此任务。\n\n你可以使用书中附带的虚拟机进行此练习。你必须以用户\
  \ `root` 登录（密码为 `password`）。按照以下步骤操作：\n\n![Images](img/caution.jpg)\n\n**注意** 在继续之前请务必创建快照。\n\
  \n1. 使用 `fdisk -l /dev/sda` 命令查看 `/dev/sda` 的分区表。\n2. 使用 `parted` 查看 `/dev/sda`\
  \ 的分区表：\n    a. 执行 `parted` 命令。\n    b. 输入 `select /dev/sda`。\n    c. 输入 `print`。\n\
  \    d. 输入 `quit` 退出 `parted`。\n3. 在 `/dev/sda` 上创建一个 Linux 交换分区（swap）：\n    a.\
  \ 输入 `fdisk /dev/sda`。\n    b. 输入 `n` 创建分区。\n    c. 接受默认分区类型。\n    d. 接受起始扇区。\n\
  \    e. 指定大小为 `500MB`。\n    f. 使用 `t` 命令更改分区代码：\n      i. 输入要更改的分区号。\n      ii.\
  \ 输入 `82` 作为分区代码。\n      g. 使用 `p` 命令验证分区已创建并具有正确的分区代码。\n      h. 使用 `w` 命令将更改写入分区表。\n\
  \      i. 注意内核未更新。不要运行 `partprobe`。\n4. 通过执行 `mkswap <device_name>` 命令创建交换分区。设备名称应为\
  \ `/dev/sda8`。\n    a. 注意错误消息。\n    b. 执行 `partprobe` 命令。\n    c. 执行 `mkswap <device_name>`\
  \ 命令。\n5. 输入命令 `swapon -s` 以确定现有交换空间。\n6. 输入命令 `free` 以确定交换空间总量以及可用交换空间。\n7. 执行命令\
  \ `swapon /dev/sda8`，然后使用 `swapon -s` 命令测试交换空间已启用。\n8. 执行命令 `free` 查看交换空间的差异。\n\
  9. 通过执行命令 `swapoff /dev/sda8` 禁用 `/dev/sda8` 交换空间（验证该命令的结果）。\n10. 使用步骤 3 中的步骤，按顺序创建以下分区（大小\
  \ 500MB）：\n    a. 创建一个 Linux 分区（分区代码 `83`；设备名称应为 `/dev/sda9`）。\n    b. 创建两个 LVM\
  \ 物理卷（分区代码 `8e`；设备名称为 `/dev/sda10` 和 `/dev/sda11`）。\n    c. 创建两个软件 RAID 分区（分区代码\
  \ `fd`；设备名称为 `/dev/sda12` 和 `/dev/sda13`）。\n    d. 写入分区表。\n11. 在 `/dev/sda9` 上创建\
  \ `ext4` 文件系统，运行 `mkfs.ext4 /dev/sda9`。\n12. 使用命令 `dumpe2fs -h /dev/sda9` 显示文件系统超级块。\n\
  13. 运行 `mkdir /public` 创建目录 `/public`。\n14. 执行 `mount -t ext4 /dev/sda9 /public`\
  \ 将 `/dev/sda9` 挂载到目录 `/public`。\n15. 使用命令 `mount` 或 `mount | grep public` 确保文件系统已挂载。\n\
  16. 进入 `/public` 目录并执行 `touch file{1,2,3}` 命令。\n17. 执行 `ls -l /public` 验证文件已创建。\n\
  18. 运行 `cd /public` 将工作目录变为 `/public`。\n19. 输入 `umount /public` 命令卸载文件系统。\n20. 执行\
  \ `fuser -vm /public` 命令确定访问挂载文件系统的用户或进程。\n21. 执行 `cd` 命令并通过 `pwd` 命令验证你已不在 `/public`\
  \ 中。\n22. 运行 `umount /public` 卸载 `/public`。\n23. 执行 `fsck /dev/sda9` 命令。\n24. 使用命令\
  \ `tune2fs -L public /dev/sda9` 为 `/dev/sda9` 文件系统添加标签 `public`。\n25. 执行 `blkid\
  \ /dev/sda9` 命令。\n26. 执行 `findfs LABEL-public` 命令。\n\n\n\n\n\n27. 执行 `mount -L public\
  \ /public` 命令挂载 `/dev/sda9` 文件系统。\n\n28. 运行 `ls /public` 来测试文件系统是否已挂载。\n\n29. 卸载\
  \ `/dev/sda9`。\n\n30. 执行 `cp /etc/fstab /etc/fstab.lab` 命令创建 `/etc/fstab` 的副本。\n\
  \n31. 执行命令 `vi /etc/fstab` 并使用按键序列 `Esc-G` 跳到最后一行。输入 `o` 在新行插入文本：\n\na. 输入几个井号（`####`）并按\
  \ `Enter`。这些井号是视觉提醒，标示你在哪里输入了新的配置信息。\n\n输入以下行：`/dev/sda9 /public defaults 0 0`\n\
  \nb. 使用 `Esc :wq` 序列保存文件。\n\nc. 输入 `mount -a` 命令。\n\nd. 测试 `/dev/sda9` 中的文件系统是否已挂载。\n\
  \n32. 卸载 `/dev/sda9` 并进入 `vi /etc/fstab`。\n\na. 将光标置于配置 `/dev/sda9` 的行上。\n\nb. 使用按键序列\
  \ `Esc i` 使 `vi` 进入插入模式。\n\nc. 在行开头放置井号（`#`），以便该行被忽略。\n\nd. 使用按键序列 `Esc o` 在下方打开新行。\n\
  \ne. 输入 `LABEL=public /public defaults 0 0`。\n\nf. 执行 `Esc :wq` 命令退出 `vi`。\n\ng.\
  \ 使用 `mount -a` 命令使用其标签重新挂载 `/dev/sda9`。\n\n### 章节总结\n\n在本章中，我们讨论了什么是分区以及 MBR 和\
  \ GPT 分区之间的区别。从此，我们讨论了不同的分区类型以及如何管理分区。在创建文件系统之后，你学习了如何创建目录与位于分区上的文件系统之间的逻辑关系，以及如何手动和自动地挂载文件系统。\n\
  \n以下是本章的一些要点：\n\n- 在 Linux 文件系统中，挂载磁盘之前，必须先对其进行分区和格式化。\n- `fdisk` 工具用于在硬盘上创建 MBR\
  \ 分区。\n- 分区磁盘时，必须设置分区类型。\n- 分区更改仅保存在内存中，直到你将其提交到磁盘。\n- 较新的 Linux 发行版支持 GPT 分区，其设计旨在解决许多旧版\
  \ MBR 类型分区的缺点。\n- 管理 GPT 分区请使用 `gdisk` 工具或 `parted` 工具。\n- 分区磁盘后，需要使用 `mkfs` 对其进行格式化。\n\
  - 格式化磁盘后，可以使用 `mount` 命令挂载它。\n- 你也可以使用 `cat` `/proc/mounts` 查看已挂载的文件系统。\n- 你可以使用\
  \ `umount` 命令卸载已挂载的文件系统。\n- 在 Linux 关闭之前，所有文件系统都必须卸载。\n- 除非在 `/etc/fstab` 文件中有记录，否则重启时不会重新挂载已挂载的文件系统。\n\
  - `/etc/fstab` 文件指定特定设备的挂载点和其他选项。\n- 你可以使用 `df` 和 `du` 工具监控磁盘空间和 inode 使用情况。\n-\
  \ `fsck` 工具用于检查和修复文件系统。\n- `tune2fs` 工具用于调整 `ext2`、`ext3` 和 `ext4` 文件系统上的各种参数。\n\
  - `dumpe2fs` 工具可以显示 `ext` 文件系统的超级块和块组信息。\n- `xfs_admin` 工具是 XFS 系统中对应于 `tune2fs`\
  \ 的工具。\n- `xfs_info` 工具显示关于 XFS 文件系统的有用信息。\n- 可移动设备在 Linux 文件系统中必须先挂载后才能被访问。\n-\
  \ `/etc/fstab` 用于在执行 `mountall` 或 `mount -a` 命令时自动挂载设备。\n\n### 问题\n\n**[1.** 你需要使用\
  \ `fdisk` 为系统中的第四块 SATA 硬盘创建一个 MBR 分区。执行此操作的正确命令是？\n\nA. `fdisk /dev/hdd`\nB. `fdisk\
  \ /dev/sdd`\nC. `fdisk /dev/sda4`\nD. `fdisk /dev/sdb2`\n\n**[2.** 你已使用 `fdisk`\
  \ 在 Linux 系统的第二块硬盘上创建了一个新的 MBR 分区。你想将该分区作为系统的第二个交换分区（swap）。你需要将其更改为哪种分区类型？\n\nA.\
  \ `83`\nB. `82`\nC. `85`\nD. `1`\n\n**[3.** 你需要使用 `ext3` 文件系统对第四块 SATA 硬盘上的第一个分区进行格式化。执行此操作的正确命令是？\n\
  \nA. `mkext3fs /dev/sdd1`\nB. `mkfs -t ext3 /dev/sdd1`\nC. `mkfs -t ext3 /dev/sda4`\n\
  D. `mkiserfs -t ext3 /dev/sdd1`\n\n**[4.** 你已使用 `fdisk` 工具创建了一个新的交换分区（`/dev/sdb1`）。你需要格式化并启用此分区。你应该使用哪些命令执行此操作？（选择两个。）\n\
  \nA. `mkswap /dev/sdb1`\nB. `mkfs -t swap /dev/sdb1`\nC. `swapon /dev/sdb1`\nD.\
  \ `swapon -a`\nE. `mkfs -t vfat /dev/sdb1`\n\n**[5.** 你在系统第二块硬盘的第一个分区上创建了一个 `ext4`\
  \ 文件系统，现在需要以读写模式将其挂载到 `/mnt/extraspace`。哪些命令可以实现此操作？（选择两个。）\n\nA. `mount -t ext4\
  \ /dev/sda1 /mnt/extraspace/`\nB. `mount -t ext4 /dev/sdb1 /mnt/extraspace/`\nC.\
  \ `mount -a /dev/sdb1 /mnt/extraspace/`\nD. `mount -t ext /dev/sdb1 /mnt/extraspace/`\n\
  E. `mount -t ext4 -o ro /dev/sdb1 /mnt/extraspace/`\n\n**[6.** 你家目录下有一个名为 `discimage.iso`\
  \ 的 ISO 文件，你想将其挂载到文件系统的 `/mnt` 目录以便提取几个文件。哪个命令可以执行此操作？\n\nA. `mount ~/discimage.iso\
  \ /mnt`\nB. `mount -a ~/discimage.iso /mnt`\nC. `mount -t iso9660 ~/discimage.iso\
  \ /mnt`\nD. `mount -o loop ~/discimage.iso /mnt`\n\n**[7.** 你已将 `/dev/sdb1` 分区挂载到\
  \ `/mnt` 目录，现在需要卸载它。哪些命令可以执行此操作？（选择两个。）\n\nA. `umount /mnt`\nB. `unmount /mnt`\n\
  C. `umount /dev/sdb1`\nD. `mount --unmount /dev/sdb1`\nE. `unmount /dev/sdb1`\n\n\
  **[8.** 哪个文件用于在系统启动时自动挂载文件系统？\n\nA. `/etc/mtab`\nB. `/proc/mounts`\nC. `/etc/initt`\n\
  D. `/etc/fstab`\n\n**[9.** 哪个 `fstab` 挂载选项会导致立即写入磁盘？\n\nA. `async`\nB. `sync`\n\
  C. `rw`\nD. `auto`\n\n**[10.** 哪个命令可以提供 `/dev/sda2` 分区的 inode 使用情况摘要？\n\nA. `df\
  \ -i`\nB. `df -h`\nC. `df -T`\nD. `du -inode`\n\n**[11.** 你的 Linux 系统上的 `/dev/sda1`\
  \ 分区没有标签。考虑到它是 `ext4` 分区，哪个命令会将标签设置为 `DATA`？\n\nA. `dumpe2fs -L DATA /dev/sda1`\n\
  B. `tune2fs -L DATA /dev/sda1`\nC. `lsof /dev/sda1 --label \"DATA\"`\nD. `mkfs -t\
  \ ext4 -L \"DATA\" /dev/sda1`\n\n**[12.** 你担心包含频繁使用的 `ext3` 磁盘分区（`/dev/sda2`）的硬盘状况。为了确保数据完整性，你想增加自动\
  \ `fsck` 检查的频率。你应该使用哪个工具来配置？\n\nA. `dumpe2fs`\nB. `e2fsck`\nC. `fsck`\nD. `tune2fs`\n\
  \n**[13.** 你需要将光光盘挂载到 `/media/dvd`。哪个命令可以执行此操作？\n\nA. `mount -t iso9660 /dev/cdrom\
  \ /media/dvd`\nB. `mount -t dvd /dev/cdrom /media/dvd`\nC. `dvdmount -t iso9660\
  \ /dev/cdrom /media/dvd`\nD. `mount -t iso9660 /dev/cdrom ~/dvd`\n\n\n\n\n\n###\
  \ 14. 你需要在 Linux 系统上挂载一个 USB 闪盘。假设你的 Linux 系统目前有一个 SATA 硬盘（`/dev/sda`），那么该闪存盘的设备名称应该是什么？\n\
  \n**A.** `/dev/hdb`\n\n**B.** `/dev/usb0`\n\n**C.** `/dev/sdb`\n\n**D.** `/dev/sda`\n\
  \n### 15. 一位性能调优工程师运行以下命令：\n\n```bash\n# cat /sys/block/sda/queue/scheduler\nmq-deadline\
  \ [kyber] bfq none\n```\n\n工程师应该运行哪个命令来将调度器设置改为 `bfq`？\n\n**A.** `sed s/kyber/bfq/\
  \ /sys/block/sda/queue/scheduler`\n\n**B.** `echo bfq < /sys/block/sda/queue/scheduler`\n\
  \n**C.** `cat bfq > /sys/block/sda/queue/scheduler`\n\n**D.** `echo bfq > /sys/block/sda/queue/scheduler`\n\
  \n### 答案\n\n- 1. **B.** `fdisk /dev/sdd` 命令使用了正确的语法为系统中的第四块 SATA 硬盘创建 MBR 分区。答案\
  \ C 是错误的，因为 `/dev/sda4` 代表第一个硬盘的第四个分区。\n- 2. **B.** 类型 `82` 定义为 Linux 交换分区。类型 `83`\
  \ 代表 Linux 分区。\n- 3. **B.** `mkfs -t ext3 /dev/sdd1` 命令使用了正确的语法，使用 `ext3` 文件系统格式化了第四块\
  \ SATA 硬盘上的第一个分区。\n- 4. **A, C.** `mkswap /dev/sdb1` 命令用于创建交换文件系统，`swapon /dev/sdb1`\
  \ 命令将其作为交换分区启用。\n- 5. **B, C.** 使用 `mount -t ext4 /dev/sdb1 /mnt/extraspace/` 或\
  \ `mount -a /dev/sdb1 /mnt/extraspace/` 命令都会将 `/dev/sdb1` 分区挂载到 `/mnt/extraspace/`。\n\
  - 6. **D.** `mount -o loop ~/discimage.iso /mnt` 命令将镜像文件挂载到 `/mnt` 目录。\n- 7. **A,\
  \ C.** 使用 `umount /mnt` 或 `umount /dev/sdb1` 命令都会从文件系统中卸载分区。\n- 8. **D.** `/etc/fstab`\
  \ 文件用于在启动时自动挂载文件系统。\n- 9. **B.** `sync` 选项会导致等待的磁盘写入立即写入。\n- 10. **A.** `df -i`\
  \ 命令显示所有挂载文件系统的 inode 消耗摘要。\n- 11. **B.** `tune2fs -L DATA /dev/sda1` 命令将卷标签设置为\
  \ `DATA`。\n- 12. **D.** 使用 `-c` 选项的 `tune2fs` 命令可以自定义自动 `fsck` 检查的频率。\n- 13. **A.**\
  \ `mount -t iso9660 /dev/cdrom /media/dvd` 命令在大多数发行版中使用了正确的语法，假设已创建一个名为 `/dev/cdrom`\
  \ 并指向 `/dev/sr0` 的符号链接。\n- 14. **C.** 该设备将通过 `/dev/sdb` 引用，因为系统中还有另一块硬盘。\n- 15.\
  \ **D.** 运行 `echo bfq > /sys/block/sda/queue/scheduler` 将正确地将 CPU 调度器从 `kyber` 设置为\
  \ `bfq`。\n\n## 8 章\n\n## 卷管理配置\n\n在本章中，你将学习：\n\n- 实现逻辑卷管理 (LVM)\n- 创建归档并执行压缩\n-\
  \ 启用独立磁盘冗余阵 (RAID)\n\n*预计每个人的数字足迹将增长到 15 太字节以上。*\n—Curtis Tearte, IBM\n\n随着文件系统的增长和变大，系统必须设计得使得磁盘卷易于管理。逻辑卷允许管理员在不停机的情况下创建磁盘空间，而\
  \ RAID 则通过提高数据吞吐量并通过减少磁盘故障的影响来消除停机时间。但是，通过备份来保护数据仍然很重要。\n\n数据压缩提高了网络传输速度并减少了磁盘空间占用，从而为机构降低成本。加密备份使你的数据更安全。\n\
  \n在本章中，你将学习如何在逻辑卷中创建、扩展并制作名为 `snapshots` 的快照的即时备份。接下来，你将发现如何使用压缩和加密使备份更高效、更安全。最后，你将为\
  \ Linux 配置软件 RAID 解决方案，为你的机构构建韧性。\n\n### 实现逻辑卷管理\n\n在对 Linux 硬盘分区时，逻辑卷管理 (LVM) 是一种选项。它提供了创建磁盘分区的传统过程的替代方案。相反，是从系统中的存储设备创建卷组（volume\
  \ groups）。从卷组中，空间分配给由 LVM 管理的特定逻辑卷。管理员不是挂载分区，而是在文件系统的挂载点挂载逻辑卷。这为管理员在系统上分配空间提供了极大的灵活性。例如，当\
  \ `/home` 卷开始空间不足时，很容易从空闲卷组重新分配空间并将其“增长”到 `/home`。这在传统的磁盘分区上是非常困难的！\n\nLVM 允许在不停机的情况下添加空间。例如，要增加容量，只需安装新硬盘，然后将其空间分配给\
  \ `/home`。卷的大小在活动系统中增加，而无需像传统分区那样备份和恢复数据。\n\n在本章的这部分，我们将介绍以下 LVM 主题：\n\n- LVM 组件\n\
  - LVM 配置\n- LVM 快照\n- 扩展 LVM\n\n### LVM 组件\n\nLVM 创建一个名为 `volume group`（卷组）的虚拟内存池，可以从中创建逻辑卷。Linux\
  \ 使用逻辑卷就像使用 `fdisk` 创建的标准磁盘分区一样。然而，逻辑卷的定义方式复杂得多。LVM 的基本结构由以下组件组成：\n\n- **物理卷 (Physical\
  \ volumes)**：物理卷可以是一个分区，也可以是整个硬盘。\n- **卷组 (Volume groups)**：卷组由一个或多个物理卷组成，形成数据池。这意味着当需要更多存储空间时，可以将额外的硬盘或分区添加到卷组中。\n\
  - **逻辑卷 (Logical volumes)**：逻辑卷从卷组池中定义。逻辑卷可以格式化为 Linux 文件系统并像物理分区一样挂载。\n\n这些组件协同工作为\
  \ Linux 系统提供存储的方式所示图 8-1。\n\n![Images](img/F08-01.jpg)\n\n**图 8-1** LVM 组件\n\n###\
  \ LVM 配置\n\n要创建并挂载逻辑卷，首先创建物理卷，然后创建卷组，最后创建逻辑卷。\n\n##### 创建 LVM 物理卷\n\n磁盘分区甚至整个硬盘都是物理\
  \ LVM 卷。如要使用现有分区，请使用 `fdisk` 将分区类型设置为 `Linux LVM (8e)`，所示：\n\n![Images](img/f0225-01.jpg)\n\
  \n一旦确定了要使用哪些磁盘和分区，在 shell 提示符运行 `pvcreate` 命令将它们定义为 LVM 物理卷。语法为 `pvcreate <device>`。在以下示例中，`/dev/sdb`\
  \ 上的前两个分区被定义为物理卷，整个 `/dev/sdc` 硬盘也是：\n\n![Images](img/f0225-02.jpg)\n\n接下来，使用 `pvscan\
  \ -v` 命令查看系统上所有的物理卷及其大小，所示：\n\n![Images](img/f0225-03.jpg)\n\n![Images](img/note.jpg)\n\
  \n**注意**：如果以后硬盘发生故障，请使用 `pvmove` 工具将数据从要删除的物理卷移动到系统定义的另一个物理卷上。\n\n接下来，使用 `pvs`（或\
  \ `pvdisplay`）命令显示物理卷：\n\n![Images](img/f0225-04.jpg)\n\n一旦定义了物理卷，就可以创建卷组。\n\n#####\
  \ 创建 LVM 卷组\n\n\n\n\n\n`vgcreate` 工具用于在系统上创建卷组。其语法格式为 `vgcreate <volume_group_name>\
  \ <physical_volume1> <physical_volume2>`（依此类推）。在以下示例中，使用 `sdb1`、`sdb2` 和 `sdc` 物理卷创建了一个名为\
  \ `DATA` 的卷组：\n\n![Images](img/f0226-01.jpg)\n\n注意 `pvscan` 命令的输出，这三个物理卷现在是 `DATA`\
  \ 卷组的成员。使用 `vgs`（或 `vgdisplay`）命令来显示卷组：\n\n![Images](img/f0226-02.jpg)\n\n在初始创建卷组后，使用以下命令对其进行管理：\n\
  \n* `vgextend`\n* `vgreduce`\n* `vgremove`\n\n一旦定义了卷组，你就可以创建逻辑卷。\n\n![Images](img/note.jpg)\n\
  \n**注意** 用户仍然可以使用 `ln` 命令在卷之间创建跨卷硬链接，因为 LVM 创建的是单一文件系统。使用 `rm` 命令或 `unlink` 命令来删除硬链接。`unlink`\
  \ 命令一次只能删除一个文件，因此通配符如 `*`、`?` 和 `[ ]` 将无法作用。\n\n### 创建 LVM 逻辑卷\n\n使用 `lvcreate`\
  \ 命令在卷组内创建逻辑卷。语法如下：\n\n`lvcreate -L <volume_size> -n <volume_name> <volume_group_name>`\n\
  \n在以下示例中，从 `DATA` 卷组定义了两个 7GB 的卷（分别命名为 `research` 和 `development`）：\n\n![Images](img/f0227-01.jpg)\n\
  \n使用 `lvscan` 命令查看定义的逻辑卷，如前面的示例所示。还要注意这两个定义的逻辑卷来自该卷组，而该卷组是通过汇总两个磁盘分区和一个整个硬盘驱动器的存储空间而成的。非常酷！\n\
  \n使用 `lvs`（或 `vgdisplay`）命令显示逻辑卷：\n\n![Images](img/f0227-02.jpg)\n\n使用以下命令来管理逻辑逻辑卷：\n\
  \n* `lvreduce` 减小逻辑卷的大小\n* `lvremove` 从系统中删除逻辑卷\n\n![Images](img/caution.jpg)\n\n\
  **警告** 在使用 `lvreduce` 和 `lvremove` 时要极度小心！如果文件系统大于 `lvreduce` 指定的大小，则存在切断数据块的风险。管理员在在使用\
  \ `lvremove` 之前，应将任何关键数据迁移到另一个逻辑卷。\n\n一旦完成逻辑卷，就可以在它们上创建文件系统并挂载它们。像传统分区一样，使用 `mkfs`\
  \ 并以下语法创建文件系统：\n\n`mkfs -t <filesystem> /dev/<volume_group>/<logical_volume>`\n\n\
  接下来，使用 `mount` 命令挂载逻辑卷，就像挂载传统分区上的文件系统一样。\n\n![Images](img/f0227-04.jpg)\n\n### LVM\
  \ 快照\n\nLinux 系统每天运行 24 小时，每周 7 天，很难找到可以将系统启动到单用户模式并干净备份的时间。LVM 快照允许管理员在运行系统上创建一致备份，并允许系统在创建快照后如果损坏可以快速恢复到干净状态。\n\
  \n快照代表拍摄快照时卷的状态，并保留快照存生存周期内发生的文件系统更改。\n\n#### 创建快照卷\n\n从 `DATA` 卷组剩余的 2GB 中，你可以将快照空间分配到一个逻辑卷。确保留有足够的空间来存放预期的数据变化；否则，如果满了，数据将会丢失。使用\
  \ `lvcreate` 的 `-s` 或 `--snapshot` 标志来构建快照：\n\n![Images](img/f0228-01.jpg)\n\n要开始使用快照，请创建一个挂载点以访问卷，然后使用\
  \ `mount` 命令挂载设备：\n\n![Images](img/f0228-02.jpg)\n\n要删除快照，使用 `umount` 和 `lvremove`\
  \ 命令：\n\n![Images](img/f0228-03.jpg)\n\n这将使文件系统失效并移除快照中保存的任何数据。\n\n#### 检查打开的文件\n\
  \n虽然不必，但某些管理员觉得在执行快照之前停止某些作业（如数据库或邮件服务器）会更放心。使用 `lsof`（列出打开的文件）命令可以观察哪些进程打开了文件。\n\
  \n非常有用的选项是 `-p`。在该选项后紧跟被监控进程的 PID，它将提交该进程已打开的文件列表：\n\n![Images](img/f0228-04.jpg)\n\
  \n### 扩展 LVM\n\n随着磁盘空间被利用，留给用户的工作空间变得越来越少。过去增加磁盘空间涉及备份当前驱动器、安装更大的驱动器然后恢复系统——这是一个高风险的过程，如果万无意外，可能需要一整个工作日才能完成。\n\
  \n使用逻辑卷管理减少了时间和风险。继续我们当前的示例，使用 `lvextend` 将当前文件系统扩展 1GB，然后使用 `resize2fs` 调整文件系统大小以匹配，如下所示：\n\
  \n![Images](img/f0229-01.jpg)\n\n### LVM 故障排除\n\n逻辑卷默认由内核激活，但在某些情况下可能会失败。在这些稀有的情况下，使用\
  \ `lvchange` 命令并使用 `-ay` 选项来“激活”逻辑卷，并对唯一提出的问题 `Do you really want to activate the\
  \ volume?`（你真的想激活该卷吗？）回答“yes”：\n\n![Images](img/f0229-02.jpg)\n\n### 创建存档和执行压缩\n\
  \n管理员必须执行的关键角色之一是数据备份。当组织投入数千小时的人力来创建数据时，确保这些数据的安全至关重要。实现此点的最佳方法是将数据备份到磁带、磁盘或云端。\n\
  \n硬盘具有电机和其他活动部件，它们随着时间的推移会缓慢磨损。事实上，硬盘有制造商分配的平均故障间隔时间 (MTBF) 值。该值估了硬盘在故障之前可以使用多久。基本上，硬盘“是否”会故障并不是问题，而是“何时”故障的问题。\n\
  \n一个备份计划包含几个部分。在本节中，我们将讨论以下主题：\n\n* 选择备份介质\n* 选择备份策略\n* Linux 备份和压缩工具\n\n让我们从如何选择备份介质开始。\n\
  \n### 选择备份介质\n\n今天，管理员使用磁带机、硬盘和云来备份数据。磁带机使用磁带存储数据。它们可以存储大量数据且非常可靠。然而，磁带在使用多年后会磨损，且速度比备份到磁盘慢。\n\
  \n大多数企业备份到磁盘或云端。硬盘很便宜。一个 10TB 的外部硬盘成本低于 300 美元。使用外部硬盘备份的优点是比磁带机快得多。企业使用一种名为 `虚拟磁带库\
  \ (VTLs)` 的备份，这是一种基于磁盘的备份，但软件“认为”它是磁带。\n\n当然，备份到云端提供了高可靠性和离工作地较远的优点，后者在灾难恢复中非常有用。例如，如果公司总部周围发生地震，数据将受到保护，因为云备份存储在不同的地理区域（假设已有适当的灾难恢复计划）。\n\
  \n![Images](img/exam.jpg)\n\n**提示** `rsync` 工具提供了比标准备份更好的热备份解决方案。该工具可以设置为在 `cron`\
  \ 中定义的周期内（例如每小时一次）进行本地或远程同步。如果主系统崩溃，只需切换到备份系统即可。\n\n一旦选择了备份介质，购买合适的设备，然后将其连接并安装到系统中。一旦一切就绪，定义备份策略。\n\
  \n### 选择备份策略\n\n在创建备份计划时，选择一种备份类型并确定备份内容。首先选择备份类型。\n\n\n\n\n\n# 选择备份类型\n\n根据所选择的备份工具，系统管理员可以实现至少三种类型的备份：\n\
  \n*   **全备份 (Full)**：全备份备份所有指定的文件，无论这些文件自上次备份以来是否被修改过。备份完成后，每个文件都会被标记为已备份。全备份通常耗时最长完成。\n\
  *   **增量备份 (Incremental)**：增量备份仅备份自上一次备份（全备份或增量备份）以来修改过的文件。备份完成后，每个文件都会被标记为已备份。这通常是速度快的备份类型。\n\
  *   **差异备份 (Differential)**：差异备份仅备份自上一次全备份以来修改过的文件。尽管这些文件在差异备份期间已被备份，但所涉及的文件不会被标记为已备份。\n\
  \n每次都运行全备份虽然彻底但非常耗费精力。然而，全备份的恢复速度是最快的。每天运行增量备份是备份最快的方法，但恢复速度最慢。\n\n许多管理员将全备份与增量备份或差异备份结合，以利用速度优势。恢复顺序非常重要，因此聪明的管理员会在备份上标记日期、顺序和备份类型。\n\
  \n最后，务必验证备份。大多数备份工具都提供了完成后检查备份的选项。\n\n# 确定备份内容\n\n一种选择是备份整个系统。这样做是安全的，但由于涉及的数据量巨大，速度很慢。相反，应优先备份关键数据，例如用户数据和配置文件。这种策略背后的理论是，一旦发生灾难，管理员只需重新安装新系统，然后恢复关键数据。考虑备份这些重要目录：\n\
  \n*   `/etc`\n*   `/home`\n*   `/root`\n*   `/var`\n\n注意，该策略并不备份 Linux 及其工具。相反，它只备份配置文件、用户数据、日志文件以及\
  \ Web/FTP 文件。\n\n## Linux 备份与压缩工具\n\n在使用 Linux 时，有很多不同的工具可以进行备份。许多工具随操作系统一起；另可以从第三方获取。对于\
  \ CompTIA Linux+ 考试，你应该熟悉大多数发行版通用的工具，并知道如何在 shell 提示符中运行它们。本节涵盖了以下主题：\n\n*   使用\
  \ `gzip`、`bzip2`、`zip` 和 `xz` 进行压缩\n*   使用 `tar` 和 `cpio` 进行备份\n*   使用 `dd` 进行磁盘克隆\n\
  \n### 使用 `gzip`、`bzip2`、`zip` 和 `xz` 进行压缩\n\n压缩用于帮助节省硬盘空间并加快网络传输。在这两种情况下，都会保存或发送真实数据的最小化表示，然后将其转换回真实数据进行处理。\n\
  \n`gzip`、`bzip2`、`zip` 和 `xz` 工具在大多数 Linux 版本中默认安装，其中 `gzip` 是最流行的压缩工具，因为它存在时间最长。`bzip2`\
  \ 工具提供的压缩率比 `gzip` 更好，但需要更多内存来执行任务。`xz` 程序提供了更好的压缩率，但使用范围没有那么广泛。下面的压缩示例使用了 `gzip`、`bzip2`\
  \ 和 `xz`。注意后缀如何根据压缩类型而不同：\n\n![Images](img/f0231-02.jpg)\n\n用户可以使用 `gunzip`、`bunzip`\
  \ 和 `unxz` 工具解压缩其压缩文件。`zip` 提供了与 Microsoft Windows 系统之间进行压缩和解压缩的最佳支持。使用 `zip` 时配合\
  \ `-r` 标志，并跟上要压缩的文件名，如下所示，压缩 `d.txt` 文件：\n\n![Images](img/f0232-01.jpg)\n\n使用 `unzip`\
  \ 工具将 `zip` 文件解压缩回正常状态。\n\n### 使用 `tar` 和 `cpio` 进行备份\n\n`tar`（磁带存档）工具已经存在很长时间，是一种常用的备份工具。`tar`\
  \ 工具获取指定文件的列表并将其复制到单个存档文件（`.tar`）中。随后可以在 Linux 系统中使用 `gzip` 工具对 `.tar` 文件进行压缩，生成具有\
  \ `.tar`、`.gz` 或 `.tgz` 后缀的文件。这被称为 `tarball`（包）。\n\n`tar` 工具可将备份作业发送到各种备份介质，包括磁带驱动器和移动式硬盘。使用\
  \ `tar` 创建备份的语法如下：\n\n![Images](img/f0232-02.jpg)\n\n`-c` 选项告诉 `tar` 创建一个新的存档。`-v`\
  \ 选项告诉 `tar` 以详细模式工作，在屏幕上显示正在备份的每个文件。`-f` 选项指定要创建的 `tar` 存档的文件名。\n\n例如，要在挂载在 `/media/usb`\
  \ 的外部 USB 硬盘上为 `/home` 目录创建备份并命名为 `backup.tar`，输入以下 `tar` 命令：\n\n![Images](img/f0232-03.jpg)\n\
  \n注意在此示例中，显示了消息 `tar: Removing leading '/' from member names`。在创建 `tar` 存档时，默认会将绝对路径转换为相对路径以简化恢复（例如，删除了\
  \ `/`）。\n\n**注意**：`tar` 工具是在子脚本流行之前创建的，因此在制作 `tarfile` 时，用户必须添加 `.tar` 以便识别文件。\n\
  \n其他 `tar` 选项见表 8-1。\n\n![Images](img/f0233-01.jpg)\n\n**表 8-1：`tar` 命令选项**\n\n\
  要备份到磁带驱动器，请将 `<filename>`替换为磁带驱动器的设备名称。在大多数发行版中，第一个 SCSI 或 SATA 磁带驱动器引用为 `/dev/st0`（那是数字零，而不是大字母\
  \ O）。因此，输入 `tar -cvf /dev/st0 /home` 来运行与上例相同的备份，但将其发送到磁带驱动器。\n\n要恢复 `tar` 存档，只需输入\
  \ `tar -xvf <filename>`。例如，要提取创建的存档，输入 `tar -xvf /media/usb/backup.tar`。这将存档提取到当前工作目录。\n\
  \n**注意**：之前的示例是在 USB 驱动器上完成的，但高安全性组织通常禁止使用 USB 驱动器\n\n![Images](img/f0233-02.jpg)\n\
  \n`cpio` 工具也可以用于创建类似 `tar` 的存档文件。例如，要备份当前目录下的多个文件，请使用 `-o` 选项将数据“输出”（out）到文件：\n\n\
  ![Images](img/f0233-03.jpg)\n\n要从 `cpio` 存档恢复文件，从 shell 提示符中运行 `cpio` 并使用 `-i` 选项将文件“读入”（in）。例如，要提取刚刚创建的存档，输入以下内容：\n\
  \n![Images](img/f0233-04.jpg)\n\n与 `tar` 一样，`cpio` 默认不压缩存档。在创建存档后，使用 `zip`、`gzip`、`bzip2`\
  \ 或 `xz` 来压缩存档。\n\n### 使用 `dd` 进行磁盘克隆\n\n`dd` 命令是一个复制文件、主引导记录 (MBR)、文件系统和整个硬盘驱动器的强大命令。\n\
  \n使用 `dd` 复制文件，使用语法 `dd if=<input_file> of=<output_file>`。例如：\n\n![Images](img/f0234-01.jpg)\n\
  \n`dd` 命令允许管理员执行驱动器克隆。要复制整个分区或驱动器，在 shell 提示符处输入 `dd if=<device_file> of=<output_file>`。分区的设备文件被用输入文件。分区的所有内容都被写入指定的输出文件。\n\
  \n在接后的示例中，使用 `dd` 命令将整个硬盘 `/dev/sda` 复制到相同或更大的硬盘上：\n\n![Images](img/f0234-02.jpg)\n\
  \n\n\n\n\n`dd` 命令甚至可以创建整个硬盘的镜像文件。语法仍然是 `dd if=<device_file> of=<output_file>`。区别在于，管理员可以直接指定硬盘本身的设备文件，而不是分区。在下一个示例中，整个\
  \ `/dev/sdb` 硬盘被归档到 `drivebackup` 文件：\n\n![Images](img/f0234-03.jpg)\n\n`dd` 的另一个有用功能是它可以创建硬盘\
  \ MBR 和分区表的备份副本。其语法如下：\n\n![Images](img/f0234-04.jpg)\n\n这告诉 `dd` 仅提取硬盘的前 512 字节块，而这正是\
  \ MBR 和分区表所在的位置。如下例所示：\n\n![Images](img/f0234-05.jpg)\n\n![Images](img/exam.jpg)\n\
  \n**考试贴士** MBR 是硬盘的前 512 字节，它用于引导 GRUB 引导程序，而引导程序反过来引导内核。定义硬盘布局的分区表是 MBR 的一部分，从第\
  \ 440 字节开始。若要在不包含分区表的情况下备份 MBR，请运行以下命令：\n\n```\ndd if=/dev/sda of=/dev/sdb bs=440\
  \ count=1\n```\n\n### 练习 8-1：备份数据\n\n在此练习中，练习数据备份。请使用在线提供的虚拟机进行此练习。\n\n![Images](img/video.jpg)\n\
  \n**视频** 请观看练习 8-1 的视频，演示如何执行此任务。\n\n完成以下步骤：\n\n1. 在系统运行的同时，打开终端会话。\n2. 通过输入 `su\
  \ -` 命令切换到 root 用户账户。\n3. 在 shell 提示符下输入 `tar -cvf ./backup.tar /home`。\n4. 输入 `ls`\
  \ 然后验证备份文件是否存在。\n5. 在 shell 提示符下输入 `cd /tmp` 切换到 `/tmp` 目录。\n6. 输入 `tar -xvf /root/backup.tar`\
  \ 将 `.tar` 文件提取到当前目录。\n7. 使用 `ls` 命令验证 `tar` 归包文件已提取到当前目录。\n8. 输入 `exit` 切回标准用户账户。\n\
  \n#### 启用独立冗余磁盘阵列 (RAID)\n\n启用独立冗余（或廉价）磁盘阵列（通常称为 RAID）允许管理员在多个硬盘上创建文件系统。例如，管理员可以将五块\
  \ 10TB 的硬盘组合，并使其向用户显示为单个 50TB 的硬盘。这被称为 RAID 0（零）或 `striping`（条带）。RAID 0 提供了卓越的数据性能，因为这些驱动可以同时读写条带数据。最佳应用包括流媒体传输。缺点是，如果某块硬盘故障，整个系统就会崩溃，并需要从备份归档恢复。请参见图\
  \ 8-2 的 RAID 0 设置。\n\n![Images](img/F08-02.jpg)\n\n**图 8-2** RAID 0 设置 vs. 用户视角\n\
  \n其他 RAID 概念提供了更高的可靠性。RAID 1（一）也称为镜像，因为它通过克隆设备提供最好的可靠性。在热备系统中，如果某块硬盘故障，可以在系统运行期间将其更换为良好的硬盘，从而允许系统\
  \ 24/7 运行。这种“保险”是昂贵的，因为每块硬盘都需要备份，所以五块 10TB 的硬盘将拥有五块 10TB 硬盘的副本。请参见图 8-3 的 RAID 1\
  \ 设置。\n\n![Images](img/F08-03.jpg)\n\n**图 8-3** RAID 1 设置 vs. 用户视角\n\nRAID 5 以比\
  \ RAID 1 许多得多的成本提供了可靠性。RAID 5 并不是复制所有硬盘，而是增加了一块通过数学方法计算数据记录的硬盘；这被称为 `parity`（校验位）。\n\
  \n当热备系统中的某个驱动器损坏时，管理员会将其更换为良好的硬盘，RAID 5 通过反转校验计算来恢复数据，系统继续运行。与 RAID 1 不同，如果两块硬盘同时故障，校验计算将失败，因此需要从磁带或云端的备份中恢复。请参见图\
  \ 8-4 的 RAID 5 设置。\n\n![Images](img/F08-04.jpg)\n\n**图 8-4** RAID 5 设置 vs. 用户视角\n\
  \nRAID 6 通过提供额外的校验盘提高了 RAID 5 的可靠性，这样如果两块硬盘同时故障，系统可以通过更换两块良好的硬盘来快速恢复。RAID 5 和 RAID\
  \ 6 的缺点是性能。由于系统必须计算校验位，性能会受到损失。请参见图 8-5 的 RAID 6 设置。\n\n![Images](img/F08-05.jpg)\n\
  \n**图 8-5** RAID 6 设置 vs. 用户视角\n\nRAID 10（10）结合了条带和镜像。请参见图 8-6 的 RAID 10 设置。\n\n\
  ![Images](img/F08-06.jpg)\n\n**图 8-6** RAID 10 设置 vs. 用户视角\n\n### 配置软件 RAID\n\n\
  当然，有硬件 RAID 解决方案，但使用 `mdadm` 创建任何 RAID 系统都始于选择将组成解决方案的硬盘，然后使用 `mdadm` 命令创建元设备，如下所示：\n\
  \n```\nmdadm --create /dev/md0 --level=1 --raid-devices=2 /dev/sdb /dev/sdc\n```\n\
  \n![Images](img/f0238-01.jpg)\n\n上述 RAID 1 级别的元设备是磁盘镜像。一旦创建了 RAID 1 元设备，就可以像对待任何其他文件系统一样对待它。即：创建文件系统然后将其挂载到空目录上。为了让文件系统在启动时持久化，请更新\
  \ `/etc/fstab` 文件：\n\n```\nmkfs.ext4 /dev/md0\n```\n\n![Images](img/f0238-02.jpg)\n\
  \n### 验证 RAID 状态\n\n要验证 RAID 系统的状态，再次使用 `mdadm` 命令。`mdmonitor` 服务提供 RAID 监控和管理。要获取当前设置的详细信息（包括设备和阵列描述），请使用\
  \ `mdadm` 的 `--detail` 选项或查看 `/proc/mdstat` 文件：\n\n```\nmdadm --detail /dev/md0\n\
  ```\n\n![Images](img/f0238-03.jpg)\n\n![Images](img/f0239-01.jpg)\n\n`/etc/mdadm.conf`\
  \ 配置文件在重启后能正确组装 RAID 阵列，并简化了设备和阵列的描述。\n\n使用 `mdadm` 命令管理热备；例如，`mdadm --fail /dev/sdb`\
  \ 将驱动器标记为故障并使用 `mdadm --remove /dev/sdb` 命令准备将其移除。在物理移除并替换硬盘后，使用 `mdadm --add /dev/md0\
  \ /dev/sdb` 重新启用它。如果新设备是故障阵列的一部分，它将作为 RAID 的一部分使用；否则，该硬盘将被视为可用热备。\n\n##### RAID\
  \ 故障排除\n\n使用 SSD 驱动器的性能不佳的 RAID 系统可能需要调优以达到正常性能。RAID 系统使用 SSD 是因为性能远高于 IDE 或 SCSI\
  \ 硬盘。\n\n第一步是确保 RAID 系统完全由 SSD 组成。使用 `lsscsi` 命令列出 SCSI 设备，并这些硬盘不是 RAID 系统的一部分。接下来，调查\
  \ RAID 系统是否使用了 SSD TRIM 能力。要执行此操作，使用 `-av` 选项运行 `fstrim` 命令。\n\n```\nfstrim -av\n\
  ```\n\n\n\n对于未能正常故障转移的 RAID 系统，请确保 `multipathd` 进程运行正常。`multipathd` 进程会检查失败的路径以实施正确的冗余。例如，可能通过光纤通道连接了多个备用磁盘驱动。运行\
  \ `fcstat` 来检查并验证这些驱动。\n\n# 练习 8-2：配置 RAID 和逻辑卷\n\n在本练习中，练习使用 RAID 和 LVM。在第一部分中，你将为练习创建硬盘。在第二部分中，你将构建\
  \ RAID 和 LVM 系统。请使用提供的虚拟机进行此练习。\n\n## 第一部分：创建额外的硬盘\n\n为了进行此练习，请在虚拟机管理器中创建四个额外的虚拟硬盘。使用\
  \ VirtualBox，请关闭虚拟 Linux 系统，点击右上角的“详情”，然后点击“存储”（位于 Oracle VM VirtualBox 管理器中间位置）。参见下面的插图。\n\
  \n![Images](img/f0240-01.jpg)\n\n点击`控制器: SCSI`，然后点击右侧带有绿色加号的正方形图标，如下所示。\n\n![Images](img/f0240-02.jpg)\n\
  \n在出现的 VirtualBox 提问对话框中，选择“创建新磁盘”，如下所示。\n\n![Images](img/f0241-01.jpg)\n\n下一个窗口询问你想要使用哪种类型的文件作为新的虚拟硬盘。如下所示，选择`VDI\
  \ (VirtualBox 磁盘映像)`，然后在下一个窗口中选择“动态分配”。\n\n![Images](img/f0241-02.jpg)\n\n更改硬盘名称。例如，在下面的插图中，我将第一个硬盘命名为\
  \ `NewVirtualDisk10`。我创建的下一个硬盘将重命名为 `NewVirtualDisk11`，依此类推，直到 13。将虚拟硬盘的大小设置为`256.0MB`\
  \ 并点击“创建”。\n\n![Images](img/f0242-01.jpg)\n\n重重复这些步骤创建新磁盘，直到你总共拥有四个额外的 256MB 虚拟硬盘。在“存储设置”中点击“确定”以完成硬盘的创建。下面的插图显示了最终结果；你应该看到新硬盘已添加到虚拟机中。启动系统以完成下一次实验。\n\
