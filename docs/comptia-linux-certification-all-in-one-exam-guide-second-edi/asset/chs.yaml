  \ 4\\. 故障排除）\n\n### 15\n![Images](img/tick.jpg) **C** 是正确的。使用 `insmod` 插入模块。\n\n\
  ![Images](img/wrong.jpg) **A**、**B**、**D** 和 **E** 都是错误的。`dmesg` 程序显示启动期间发现的硬件。`modinfo`\
  \ 命令为用户提供有关模块的信息。`depmod` 命令查找模块依赖关系并更新 `modules.dep` 文件。`lsmod` 命令显示当前安装的模块列表。（领域\
  \ 1\\. 系统管理）\n\n### 16\n![Images](img/tick.jpg) **A** 是正确的。系统管理员可以运行 `dig jordanteam.com\
  \ MX` 并列出邮件服务器的位置。\n\n![Images](img/wrong.jpg) **B**、**C** 和 **D** 是错误的。`ping` 命令用于测试网络，而\
  \ `traceroute` 将列出数据包到达目标所经过的路由器。`route` 命令用于定义或显示默认网关。（领域 1\\. 系统管理）\n\n### 17\n\
  ![Images](img/tick.jpg) **A** 是正确的。使用 `mtr` 命令可视化数据包到达目标所经过的路径。\n\n![Images](img/wrong.jpg)\
  \ **B**、**C**、**D** 和 **E** 都是错误的。`traceroute` 命令类似于 `mtr`，但它是在命令行输入的，且不会定期运行。`tracert`\
  \ 命令与 `traceroute` 相同，但在 Windows 操作系统上运行。`iftop` 命令定期更新并显示网络流量。`top` 命令定期更新并显示进程活动。（领域\
  \ 4\\. 故障排除）\n\n### 18\n![Images](img/tick.jpg) **D** 是正确的。`/etc/shadow` 文件包含用户账户的加密密码。\n\
  \n![Images](img/wrong.jpg) **A**、**B** 和 **C** 是错误的。`/etc/passwd` 文件包含用户账户和 ID。`/etc/group`\
  \ 文件用于本地组定义。`/etc/gshadow` 文件包含组的密码。（领域 2\\. 安全）\n\n### 19\n![Images](img/tick.jpg)\
  \ **B** 是正确的。`/etc/passwd` 中每个用户条目的第三字段指定了用户的 ID 数字（UID）。在这种情况下，它是 `1001`。\n\n![Images](img/wrong.jpg)\
  \ **A**、**C** 和 **D** 是错误的。**A** 是错误的，因为它指定了用户名。**C** 是错误的，因为它指定了用户主组的组 ID（GID）。**D**\
  \ 是错误的，因为它指定了用户的全名。（领域 1\\. 系统管理）\n\n### 20\n![Images](img/tick.jpg) **C** 是正确的。`/etc/shadow`\
  \ 中每个记录的第七个字段指定了密码过期后等待多少天来禁用账户。\n\n![Images](img/wrong.jpg) **A**、**B** 和 **D**\
  \ 是错误的。**A** 是错误的，因为它指定了更改密码前所需的最小天数（1 天）。**B** 是错误的，因为它指定了密码过期前多少天用户会收到即将过期的警告。**D**\
  \ 是错误的，因为它分配给了第八个字段，该字段指定了自 1970 年 1 月 1 日以来的天数，之后账户将被禁用。（领域 2\\. 安全）\n\n### 21\n\
  ![Images](img/tick.jpg) **C** 是正确的。`/etc/skel` 目录包含新用户家目录的启动脚本。\n\n![Images](img/wrong.jpg)\
  \ **A**、**B** 和 **D** 是错误的。`login.defs` 文件定义了用户目录的位置。`/etc/default/useradd` 文件。`grub`\
  \ 文件包含默认设置。（领域 1\\. 系统管理）\n\n### 22\n![Images](img/tick.jpg) **A** 是正确的。`useradd\
