  \ ssh`\n**C.** `firewall-cmd --block-service ssh`\n**D.** `firewall-cmd --disable-service\
  \ ssh`\n\n### Answers\n\n**1.** **C.** 命令 `lshw -short` 输出带有设备树并显示硬件路径的硬件信息。\n**2.**\
  \ **A.** `dmidecode` 命令在多用户模式下列出系统的 BIOS。\n**3.** **B.** `watch` 命令将定期执行程序，并在全屏中显示输出。\n\
  **4.** **D.** `sar` 命令收集、报告并保存系统活动信息，语法为 `sar <interval count>`。\n**5.** **A, E.**\
  \ `sar` 和 `vmstat` 监控内存性能。\n**6.** **A.** `free` 命令显示计算机上有多少可用内存和交换空间。\n**7.** **A.**\
  \ 将 `/proc/block/sda/queue/scheduler` 内核变量更改为 `none`、`mq-deadline`、`kyber` 或 `bfq`\
  \ 以更改驱动 `/dev/sda` 上的存储调度。\n**8.** **D.** `ioping` 命令将显示磁盘性能输出。\n**9.** **B, C.**\
  \ `sar` 和 `iostat` 命令是显示 I/O 速率的两个命令。\n**10.** **B.** 关闭 SSH 22 端口的命令是 `firewall-cmd\
  \ --remove-service ssh` 或 `firewall-cmd --remove-service=ssh`。\n\n## 第 20 章：安装与配置\
  \ Linux\n\n在本中，你将学习：\n- 设计 Linux 安装\n- 安装 Linux\n- 配置 X Window 系统\n- 配置本地区域设置\n\
  - 配置时区设置\n- 使用 CUPS 配置打印\n- 配置电子邮件\n- 配置 SQL 数据库\n- 配置存储\n\n*实现梦想最好的方式就是醒来。* — 梅梅·杰米森（NASA）\n\
  \nCompTIA Linux+ 认证目标并不要求候选人了解如何执行 Linux 发行版的全新安装，或者如何配置电子邮件、打印和数据库。然而，为了让你练习本章中讨论的\
  \ Linux 特性，我认为解释如何设置和配置 Linux 系统是非常重要的。CompTIA Linux+ 考试涵盖了常见的 Linux 发行版，但本章仅指示如何安装\
  \ CentOS。我选择 CentOS 是因为它与大多数美国雇主安装的 Linux 版本相似——红帽企业 Linux（Red Hat Enterprise Linux）。Debian\
  \ 和 OpenSUSE 的安装过程与安装 CentOS 相似。\n\n在过去的 20 年里，Linux 的安装变得极其容易。20 世纪 90 年代提供的发行版安装挑战很大，且硬件支持有限。幸运的是，现代\
  \ Linux 发行版采用了易于使用的图形安装向导来方便安装过程。要正确安装 Linux，请在开始安装前花时间规划。\n\n![Images](img/note.jpg)\n\
  \n**注意**：虽然在 https://distrowatch.com 上有数百种 Linux 发行版，但本讨论关注 CompTIA Linux+ 考试测试的发行版。\n\
  \n### 设计 Linux 安装\n\n当组织为生产环境部署系统时，适当规划至关重要。错误会导致系统停机，停机会浪费组织的时间和资金。\n\n例如，假设一家网络软件供应商想要实施一种让其员工工作更轻松的新应用程序。在审查系统要求时，设计和安装团队发现该应用程序需要特定的\
  \ Windows 服务器版本——他们尚未拥有。实施该应用程序首先需要一个新的服务器。设计和安装团队在没有制定新服务器部署计划的情况下直接进行。他们订购了新服务器并在没有与员工沟通的情况下设置了软件。\n\
  \n最终，所有员工的关键数据都保存在这台服务器上。价值数百万美元的人类工时从未被备份。良好的沟通和变更管理将确保这种情况不会发生。\n\n在本章的这一部分，我们将讨论如何规划\
  \ Linux 安装。将涉及以下主题：\n- 进行需求评估\n- 选择发行版\n- 检查硬件兼容性\n- 验证系统要求\n- 规划文件系统\n- 选择软件包\n\
  - 识别用户账户\n- 收集网络信息\n- 选择安装源\n\n任何部署计划的第一步都是进行需求评估。让我们下一个讨论这个话题。\n\n### 需求评估\n\n\n\
  \n\n\n进行需求评估是创建 Linux 部署计划中最重要的方面之一。这是一个确定*为什么*要进行 Linux 部署、期望获得*什么*结果，以及预计*何时*完成的过程。完成需求评估需要你脱下技术人员的帽子，戴上项目经理的帽子。在这个角色上，你需要与不同的人会面并理解他们的需求。此需求评估至少应包含以下信息：\n\
  \n- **项目的目标是什么？** 此次安装将解决什么问题？实施的最终结果是什么？\n- **该项目的利益相关者是谁？** 作为需求评估的一部分，请识别所有受项目影响的人员。\n\
  - **什么时候需要该系统？** 一个要问的关键问题是，项目应该何时完成？从“以终为导向”开始。\n\n一旦你有了这些问题的答案，请根据时间表进行现实性检查。请记住，纸面上看起来很好的在现实生活中可能行不通。\n\
  \n一旦确定了项目范围，就可以进入项目计划中的下一个组件——Linux 发行版。\n\n## 选择发行版\n\n如所述，Linux 有多种被称为 `distributions`（发行版）或\
  \ `distros` 的版本。部署计划的关键部分之一是指定使用哪种发行版。哪种发行版最好取决于你的偏好。大多数美国联邦政府倾向于使用 Red Hat Enterprise\
  \ Linux (RHEL) 或 SUSE Linux Enterprise Server (SLES)，因为它们提供企业级支持计划，且两者都提供强制性访问控制\
  \ (MAC)。道德黑客偏于使用带有 Tor 浏览器的 Kali，因为它们提供了最好的审计工具。以下是选择正确发行版的一些指南。\n\n确定系统将是作为工作站还是服务器运行。大多数操作系统被设计为运行其中之一，但\
  \ Linux 既可以作为工作站运行，也可以作为服务器运行。这在操作系统中是独有的。IBM 的 Red Hat  Red Hat Enterprise Linux\
  \ 发行版，旨在为服务器利用率极高的中特大型组织提供网络服务。Red Hat 还提供了专门为桌面使用设计的发行版。\n\n`Oracle Linux` 是一种企业级操作系统，通过购买红帽的支持计划，可以轻松转换为\
  \ RHEL。Oracle Linux 是开源的，在应用程序和补丁方面与 RHEL 保持 100% 的二进制兼容。\n\n`CentOS` 和 `Fedora`\
  \ 都是为普通用户设计的 RHEL 开源版本。不建议在组织的生产环境中使用 Fedora 或 CentOS。\n\n同样，EQT Partners 销售多个版本的\
  \ SUSE Linux，并为开源社区提供 `OpenSUSE`。它的发行版涵盖了云甚至嵌入式系统的产品。\n\n还有特定用途的发行版可以使用标准 PC 硬件创建基于\
  \ Linux 的设备。例如，你可以使用 `Untangle` 等发行版创建一个强大的网络防火墙。\n\n在选择特定的 Linux 发行版之前，评估企业应用程序是否可以在操作系统上运行并获得支持。还要验证该发行版是否适用于所选系统硬件。\n\
  \n## 检查硬件兼容性\n\n今天，大多数供应商为其硬件提供了 Linux 版本的驱动程序。此外，大多数常用 PC 硬件的驱动程序现在包含在各种 Linux\
  \ 发行版中，特别是虚拟机。Linux 安装在各种类型的硬件上。要验证硬件兼容性，请访问 `https://tldp.org/HOWTO/Hardware-HOWTO/`\
  \ 或咨询 Linux 供应商的更新规范。\n\n虽然很少这样做，但检查发行版的网站并验证系统硬件是否列在发行版的硬件兼容列表 (HCL) 上仍然是一个非常好的主意。尽管过去十年里\
  \ Linux 的硬件支持已变得许多，但仍然有一些设备不受支持。一个很好的例子是许多笔记本系统中使用的集成无线网络接口。检查发行版的 HCL 以验证系统设备是否受支持。\n\
  \nHCL 通常可以在两个地方找到。首先，Linux 发行版在安装 DVD 的文本文件中包含了支持的硬件列表。然而，由于它是静态文档，自光盘镜像创建以来就没有更新过。如果计算机中的某个设备在磁盘镜像创建后的某个时间发布，则驱动程序可能是过时的。\n\
  \n相反，请使用发行版网站上维护的 HCL。此版本的 HCL 包含了支持硬件的最新数据。例如，如果你正在安装 openSUSE 发行版，请访问 `https://en.opensuse.org/Portal:Hardware`\
  \ 查看其 HCL。在那里，搜索系统硬件并查看其是否受支持。在图 20-1 中显示了有线网卡的 openSUSE HCL。\n\n![Images](img/F20-01.jpg)\n\
  \n**图 20-1** 使用 openSUSE HCL\n\n如果你选择 Red Hat 发行版，请检查 Red Hat 网站上的 HCL (`https://access.redhat.com/articles/rhel-limits`)\
  \ 以验证系统硬件是否受支持。\n\n![Images](img/note.jpg)\n\n**注意** 驱动程序的可用性是组织在生产环境中倾向于使用知名、支持良好的\
  \ Linux 发行版的原因之一。Linux 系统管理员必须保护数据并确保系统以最高效率运行。在生产环境中，使用 Linux 支持的硬件至关重要。\n\n除了检查\
  \ HCL 外，还要检查发行版的系统要求。\n\n## 验证系统要求\n\n在制定部署计划时，确保指定所选发行版所需的硬件。系统要求的一个关键方面是计算机的 CPU\
  \ 架构。在下载 Linux 发行版时，确保选择与系统 CPU 匹配的架构。\n\n今天，系统管理员有很多硬件选项可用。仍然存在 `x86` 和 `Alpha`\
  \ 架构，以及较新的 `64-bit x86` 架构。此外，Intel 生产其 Core CPU 使用的 `IA-64` 架构。每种架构都需要不同 Linux。事实上，许多\
  \ Linux 发行版甚至已移植到在 Apple 的 `M2` 芯片架构上运行。IBM 和联想使用 `Intel` 或 `AMD Ryzen` CPU 的 Thinkpad\
  \ T14s 也有其他发行版。现在甚至有 Linux 版本被移植到运行在平板和平手机使用的 `Qualcomm Snapdragon` 架构上。\n\n无论选择哪种发行版，请确保下载适用于系统架构的正确版本。如果你选择了错误的版本，Linux\
  \ 安装程序将生成错误并取消安装。\n\n## 规划文件系统\n\n在规划 Linux 实施时，请包含如何在系统硬盘驱动器上创建和维护文件的规范。\n\n然而，对于\
  \ Linux，有更多的选择。管理员可以自定义磁盘的分区方式以及使用什么文件系统。在本章的这部分，我们将讨论以下：\n\n- 选择文件系统\n- 规划分区\n\n\
  让我们从讨论文件系统开始。\n\n### 选择文件系统\n\n驱动器由多个铝制盘片组成，每个盘片有两个读写头，用于传输数据。在执行磁盘 I/O 操作时，操作系统需要知道数据存储在哪里、如何访问它，以及在哪里安全地写入新信息。\n\
  \n\n\n\n\n这是 `filesystem`（文件系统）的工作，它可靠地在硬盘上存储数据并对其进行组织，以便访问。文件系统的选择包括：\n\n- `ext3`\n\
  - `reiser`\n- `ext4`\n- `btrfs`\n- `xfs`\n\n![Images](img/note.jpg)\n\n**注意** 管理员还可以在\
  \ Linux 中使用许多其他文件系统，例如 VFAT 和 NTFS 文件系统。不要使用 `ext2`，因为它是一个非日志文件系统。\n\n支持得最好的文件系统是\
  \ `reiser`、`ext4`、`btrfs` 和 `xfs`。这些文件系统可以处理远大于 2TB 的大文件，以及大小达到艾字节（exabytes）级的文件系统分区。此外，由于具有日志功能，它们能更好地管理系统故障，能够在几分钟内从系统崩溃中恢复，而\
  \ `ext2` 则需要几天时间。\n\n### 规划分区\n\n建议至少拥有两个分区（`/` 和 `swap`），并且最好在系统初始安装期间定义这些分区。在系统安装后更改磁盘分区是可能的，但具有一定的挑战性且耗时。因此，最佳实践是在开始安装过程之前规划分区布局。\n\
  \n默认情况下，Linux 发行版在安装过程中会建议多个分区（参见图 20-2）：\n\n![Images](img/F20-02.jpg)\n\n- `swap`：交换分区的适当大小应大于安装的内存\
  \ 数量，因为在系统崩溃的情况下，整个 RAM 镜像将放入交换分区。稍后可以分析内核转储（kernel dump）以确定系统故障的原因。\n- `/`：斜杠分区挂载在\
  \ Linux 文件系统的根目录 (`/`)。\n- `/boot`：启动所需的文件存储在这里，例如内核和初始 RAM 磁盘。当此分区独立存在时，文件系统损坏的恢复更快。\n\
  \n![Images](img/caution.jpg)\n\n**警告** `/boot` 分区必须在硬盘的前 1,024 个磁道内创建。250MB 的分区大小就足够了。为了安全起见，创建此分区时应从磁道\
  \ 0 开始。\n\n使用这些推荐的分区将增加系统的稳定性。\n\n### 选择软件包包\n\nLinux 包含了丰富的软件包示例，管理员可以选择随操作系统一起安装。大多数发行版需要多张\
  \ DVD 来存储所有软件包。OpenSUSE 提供了许多不同的软件包，如图 20-3 所示。\n\n![Images](img/F20-03.jpg)\n\n\
  图形化 Linux 安装程序的另一个特性是它们会自动管理 `dependencies`（依赖关系），即其他软件包运行所需的特定软件包。安装的大多数 Linux\
  \ 软件包都有许多相关的依赖项。\n\n在 Linux 早期，管理员必须手动管理依赖并将它们包含在系统中。由于存在层层依赖关系（如图 20-4 所示），这是一项艰难的工作。当处理“循环”依赖时，工作更加困难，包\
  \ A 依赖于包 B，但包 B 也依赖于包 A！\n\n![Images](img/F20-04.jpg)\n\n**图 20-4** 无尽的软件包依赖链\n\n\
  今天，CompTIA Linux+ 考试涵盖的安装程序会自动计算软件包依赖关系，在安装中包含必要的依赖包，并管理循环依赖。\n\n### 识别用户账户\n\n\
  在规划安装时，确定系统所需的用户账户。Linux 发行版使用的安装工具提供了安装过程中创建这些账户的功能。无论你使用哪种发行版，都需要在安装期间创建 `root`\
  \ 用户账户，以及一个标准用户账户。\n\n安装过程的一部分要求为每个账户提供密码。确保使用具有至少 12 个字符、包含大写字母、小写字母、特殊字符和数字的强密码。在安装的此阶段，还要选择哪些用户具有\
  \ `sudo` 权限。\n\n### 收集网络信息\n\n在开始安装之前，你需要收集连接网络所需的信息并将其包含在部署计划中。以下是一些需要考虑的关键项：\n\
  \n- 系统的网络配置是动态分配的，还是需要手动配置？\n- 系统将分配什么主机名？\n- 系统将所在的 DNS 域名名称是什么？\n- 系统是否需要配置主机防火墙？\n\
  \n### 选择安装源\n\nLinux 提供了多种安装选项，包括：\n\n- 从光盘或优 盘本地安装\n- 从网络服务器远程安装\n- 使用虚拟网络计算 (VNC)\
  \ 完成远程安装\n\n#### 从光盘或优 盘本地安装\n\n安装 Linux 的较常用方法之一是从一组安装盘本地安装。使用这种方法，你只需将适当的光盘插入系统的光驱，并从光盘启动系统。或者，你可以将镜像上传到优\
  \ 盘并从那里安装。\n\n只需从供应商网站下载磁盘镜像。例如，要安装 Fedora，导航到 [`getfedora.org`](https://getfedora.org)\
  \ 并选择 Fedora Workstation 或 Fedora Server 的“Download Now”按钮。选择服务器或工作站后，为你的硬件选择 Fedora\
  \ Media Writer，Fedora 镜像将自动下载。插入一个 16GB 以上的优 盘，Fedora Media Writer 将引导你完成创建可启动优\
  \ 盘的步骤。\n\n要制作可启动的光盘，请下载 `.iso` 文件。这些被称为 `ISO images`。一旦下载了 ISO 镜像，使用 Rufus、UNetbootin\
  \ 或 Universal USB Installer 将其刻录物理光盘（或优 盘）。\n\n#### 从网络服务器远程安装\n\n安装 Linux 的另一种选项是从网络服务器。这可以通过使用\
  \ SMB、NFS、HTTP 或 FTP 协议的安装源工作。使用网络的关键优势是可以同时安装大量系统。\n\n![Images](img/note.jpg)\n\
  \n**注意** 并非所有的 Linux 发行版都支持基于网络的安装。要完成网络安装，请将 Linux 安装文件复制到服务器上的目录，或挂载 DVD 以供远程访问。然后选择网络访问协议。\n\
  \n一旦设置好安装源服务器，下载网络启动安装镜像。例如，要完成 SUSE Linux 的网络安装，导航到 [`opensuse.org`](http://opensuse.org)，将鼠标悬停在\
  \ Leap 上，选择 More Information > Install Leap > Download。在显示的页面中，你可以选择网络启动镜像进行下载。将此镜像刻录到磁盘，然后从它启动系统。在第一个安装屏幕上，指定安装源，如图\
  \ 20-5 所示。\n\n![Images](img/F20-05.jpg)\n\n**图 20-5** 选择安装源\n\n#### 使用 VNC 完成远程安装\n\
  \nVNC 允许将视频输出从一个系统重定向到另一个系统。使用 VNC 协议，你可以在目标系统启动安装，然后在另一个系统上使用浏览器或 VNC 客户端软件查看安装界面。\n\
  \n在许多发行版中（如 openSUSE），你可以在启动选项（Boot Options）字段中输入 `vnc=1`，如图 20-6 所示。\n\n![Images](img/F20-06.jpg)\n\
  \n**图 20-6** 配置 VNC 安装\n\n\n\n\n启动安装后，系统提示将为您提供创建 VNC 连接所需的各种网络参数。安装系统加载后，将显示访问系统的\
  \ IP 地址。可以使用网络浏览器或 VNC 客户端软件远程访问安装界面。例如，如果在初始 VNC 配置屏幕中分配的 IP 地址为 `192.168.1.126`，则可以通过打开\
  \ `http://192.168.1.126:5801` 来访问，如图 20-7 所示。通过此 VNC 连接，您可以在家中舒适地完成安装过程。\n\n![Images](img/F20-07.jpg)\n\
  \n**图 20-7** 在浏览器中远程完成安装\n\n![Images](img/note.jpg)\n\n**注意** 也可以使用 `vncviewer`\
  \ 实用访问 VNC 服务器。或者，在 Windows 系统上，您可以使用 RealVNC 的 VNC Viewer。\n\n对于部署计划，您需要确定安装方法并在必要时准备前提系统。一旦完成这些工作，Linux\
  \ 部署计划就完成了。现在，完成安装所需的数据已以一种组织、高效且可衡量的方式收集完毕。安装完成后，将部署计划妥善存安全的地方。这些信息对于以后可能需要操作系统的其他系统管理员来说将是非常有价值的帮助。\n\
  \n### 安装 Linux\n\n在安装新系统时，强烈建议设置一个隔离的实验环境并在那里进行安装。这将允许您在系统发布到生产环境之前收集基准，并确保一切运行正常。\n\
  \n正如本章开头提到的，可用的 Linux 发行版种类太多，无法全部包含在 CompTIA Linux+ 考试或本章中。本章回顾了如何安装 CentOS 工作站，您将在练习\
  \ 20-1 中练习安装 Linux 系统。\n\n#### 练习 20-1：安装一个 Linux 系统\n\n在本次练习中，我们将首先安装 VirtualBox\
  \ 虚拟机管理器，然后将 CentOS Linux 作为虚拟机。为了配合书中的示例，我们将在 VirtualBox 6.1.40 之上安装 CentOS 7。\n\
  \n![Images](img/video.jpg)\n\n**视频** 请观看练习 20-1 的视频以获取如何执行此任务的演示。\n\n完成以下步骤：\n\n\
  **1.** 在您的计算机上，打开网络浏览器并导航到 `https://www.centos.org`，选择 CentOS Linux > Download。\n\
  \n* **a.** 选择 `x86_64` 并选择一个靠近您的镜像以获得最佳下载性能。\n* **b.** 选择 `CentOS-7-x86_64-Minimal-2009.iso`。\n\
  * **c.** 下载完成后，继续第 2 步。\n\n**2.** 在您的计算机上，打开网络浏览器，导航到 `https://www.virtualbox.org`\
  \ 并选择左侧的 Downloads。\n\n* **a.** 向滚动并选择“VirtualBox older builds”。\n* **b.** 选择 `VirtualBox\
  \ 6.1`，然后下载 `VirtualBox 6.1.40` 并启动安装。\n* **c.** 在 Welcome 界面点击 Next，然后在 Custom\
  \ Setup（自定义设置）界面再次点击 Next。\n* **d.** 在 Options 界面接受默认设置，并在“Network Interfaces”处点击\
  \ Yes。\n* **e.** 在“Ready to Install”界面点击 Install，然后等待几分钟让软件安装。如果询问是否要安装 Oracle 设备，选择\
  \ Always Trust 然后点击 Install。\n* **f.** 点击 Finish 启动 VirtualBox。\n\n**3.** 要将 CentOS\
  \ 安装到 VirtualBox 虚拟机管理器中，在 VirtualBox 内点击 New。\n\n* **a.** 在 Name 字段中输入 `CentOS-1`。系统应默认为“Type:\
  \ Linux”和“Version: Red Hat (64-bit)”。如果检查无误，点击 Next。如果“Type: Linux”下的版本显示为 Red Hat\
  \ (32-bit)，您必须选择 Cancel；然后关闭主机系统，进入主机计算机的 BIOS 并启用虚拟化。\n* **b.** 内存大小为 2048MB 即可。点击\
  \ Next。\n* **c.** 选择“Create a virtual hard disk now”并点击 Create。\n* **d.** “Hard\
  \ disk file type”设置选择 `VDI` 即可。点击 Next。\n* **e.** 选择“Dynamically allocated”并点击 Next。\n\
  * **f.** 将硬盘大小设置为 1.8TB 并点击 Create。\n* **g.** 点击 Machine Tools 旁边的箭头并选择 Details。然后点击下方几行的\
  \ Display，将 Video Memory 从 16MB 更改为 128MB。点击 OK。\n\n**4.** 点击 VirtualBox 内的绿色 Start\
  \ 按钮。\n\n* **a.** 在“Select start”下，选择 `VirtualBox older builds`。\n* **b.** 选择 `VirtualBox\
  \ 6.1`，然后下载 `VirtualBox 6.1.40` 并启动安装。\n* **c.** 在 Welcome 界面点击 Next，然后在 Custom\
  \ Setup 界面再次点击 Next。\n* **d.** 在 Options 界面接受默认设置，并在“Network Interfaces”处点击 Yes。\n\
  * **e.** 在“Ready to Install”界面点击 Install，然后等待几分钟让软件安装。如果询问是否要安装 Oracle 设备，选择 Always\
  \ Trust 然后点击 Install。\n* **f.** 点击 Finish 启动 VirtualBox。\n\n*(注：提供的步骤 4-10 原始文本似乎包含乱码/重复短语；我已根据技术指令清理了格式并保持了流程流畅性).*\n\
  \n**5.** 按照屏幕提示完成安装过程。\n\n**6.** 配置网络和用户设置。\n\n**7.** 重启系统。\n\n**8.** 使用命令行安装图形环境。\n\
  \n**9.** 配置桌面环境。\n\n**10.** 完成后关闭系统电源。\n\n\n\n关于 VirtualBox 虚拟机，请稍加练习以便在客机和宿主机之间进行切换。主要的提示是按下右侧的\
  \ `Ctrl` 键将返回宿主机。若要让 CentOS 客机接管，只需用鼠标点击它，或启用“鼠标指针集成”（Mouse Pointer Integration），通过将鼠标指针悬停在它们上方来切换系统。\n\
  \n![Images](img/exam.jpg)\n\n**考试提示** Linux 下可用的远程桌面工具包括 VNC、XRDP、NX 和 Spice。\n\n\
  ### 配置 X Window 系统\n\n另一个非常重要的 Linux 话题（尽管不在 CompTIA Linux+ 考试大范围内）是 X Window 系统，通常称为\
  \ X11，或简称为 X。在实践中，X 会在安装过程中自动配置得很好，因此本节仅解释 X 的工作原理。在本章的这部分将讨论以下主题：\n\n• 配置 X 服务器\n\
  • 配置显示管理器\n• 配置辅助功能\n\n### 配置 X 服务器\n\n由于 X 服务器直接与显卡和显示器配合，因此配置它至关重要。请使用正确的设置；否则可能会损坏显示器。配置可以通过两种方式完成：\n\
  \n• 通过编辑 X 配置文件\n• 使用 X 配置实用程序\n\n让我们先看 X 配置文件。\n\n#### 编辑 X 配置文件\n\n与 Linux 中的其他所有内容一样，X\
  \ 配置存储在 `/etc` 目录下的文本文件中。\n\n![Images](img/note.jpg)\n\n**注意** 我的一位老朋友创造了一个恰当的格言：“Linux\
  \ 中的一切皆文件。”你所有的系统和服务的配置都存储在文件中。你甚至可以通过文件来访问硬件设备。\n\n配置设置保存在 `/etc/X11/xorg.conf`。以下是示例\
  \ `xorg.conf` 文件的部分：\n\n![Images](img/f0650-01.jpg)\n\n![Images](img/note.jpg)\n\
  \n**注意** 基于 `systemd` 的 Linux 发行版不使用 `xorg.conf` 配置文件。相反，`X11` 配置存储位于 `/etc/X11/xorg.conf.d`\
  \ 中的系列配置文件。\n\n注意在此示例中，`xorg.conf` 被分为多个部分，每个部分以 `Section \"<Name>\"` 指令开头并以 `EndSection`\
  \ 结束。\n\n让我们看看 `xorg.conf` 文件中常用的部分。首先是 `\"Files\"` 部分。该部分告诉 X 服务器在何处找到工作所需的文件，例如字体文件和输入设备文件。以下是\
  \ `\"Files\"` 部分的简略示例：\n\n![Images](img/f0651-01.jpg)\n\n接下来是 `\"InputDevice\"`\
  \ 部分。该部分为 X 服务器配置了它应该使用的输入设备。你可以使用多个 `\"InputDevice\"` 部分，例如，一个用于键盘的 `\"InputDevice\"\
  ` 部分，另一个用于鼠标。示例所示：\n\n![Images](img/f0651-02.jpg)\n\n下一个部分是 `\"Modes\"` 部分。配置文件可能有一个或多个此类部分。它们定义了\
  \ X 服务器可能使用的视频模式。示例如下：\n\n![Images](img/f0651-03.jpg)\n\n接下来的部分是 `\"Screen\"` 部分，它将显卡绑定到显示器上。示例如下：\n\
  \n![Images](img/f0651-04.jpg)\n\n![Images](img/f0652-01.jpg)\n\n我们将查看的最后一个部分是 `\"\
  ServerLayout\"`。该部分将一个或多个 `\"Screen\"` 部分和一个或多个 `\"InputDevice\"` 部分结合在一起，如例例所示：\n\
  \n![Images](img/f0652-02.jpg)\n\n![Images](img/note.jpg)\n\n**注意** Wayland 是 X11\
  \ 更新、改进的版本，目前是 Fedora Linux 的默认设置。\n\n#### `DISPLAY` 变量\n\n键盘、鼠标和显示器被定义为 `DISPLAY`。第一个\
  \ `DISPLAY` 定义为 `:0.0`，格式为 `*:display.screen*`。例如，如果你在一台计算机上运行三个屏幕，左侧屏幕定义为 `DISPLAY=:0.0`，中间屏幕定义为\
  \ `DISPLAY=:0.1`，右侧屏幕定义为 `DISPLAY=:0.2`。\n\n如果三个独立的系统连接在一起，每个系统都有自己的屏幕、键盘和鼠标，那么左侧屏幕定义为\
  \ `DISPLAY=:0.0`，中间屏幕定义为 `DISPLAY=:1.0`，右侧屏幕定义为 `DISPLAY=:2.0`，因为不像第一个示例那样共享键盘和鼠标。\n\
  \n### 使用 X 配置实用程序\n\n与大多数 Linux 服务一样，X 服务器的配置可以使用 `vi` 等文本编辑器进行修改。然而，不要手动编辑文件；而应使用“设置\
  \ | 显示器”下的配置实用程序，如图 20-8 所示。该小程序允许你配置屏幕分辨率。\n\n![Images](img/F20-08.jpg)\n\n**图\
  \ 20-8** 显示应用程序\n\n在 shell 提示符处输入 `Xorg -configure` 以自动检测所有硬件并创建一个名为 `/root/xorg.conf.new`\
  \ 的配置文件。在提交之前，通过 shell 提示符处输入 `X -config /root/xorg.conf.new` 进行测试。如果一切看起来正常，将文件重命名为\
  \ `/etc/X11/xorg.conf` 开始使用新配置。\n\n![Images](img/note.jpg)\n\n**注意** 使用 `xwininfo`\
  \ 命令显示图形桌面上打开窗口的信息。`xdpyinfo` 命令可显示 X 服务器的功能。\n\n### 配置显示管理器\n\n本节涵盖了以下主题：\n\n•\
  \ 启用和禁用显示管理器\n• 配置显示管理器\n• 配置显示器的远程访问\n\n#### 启用和禁用显示管理器\n\n在许多 Linux 发行版中，显示管理器由位于\
  \ `/etc/init.d` 目录下的 `xdm init` 脚本管理。其他发行版可能使用 GNOME 显示管理器 (`gdm`) 或 KDE 显示管理器 (`kdm`)。要手动管理显示管理器，在\
  \ shell 提示符处输入 `/etc/init.d/<init_script> stop` 或 `start`。\n\n![Images](img/exam.jpg)\n\
  \n**考试提示** Linux 可用的图形用户界面 (GUI) 包括 Gnome、Unity、Cinnamon、MATE 和 KDE。\n\n### 配置显示管理器\n\
  \n通过编辑适当的配置文件来配置显示管理器：\n\n• `xdm` `/etc/X11/xdm/xdm-config`\n• `LightDM` LightDM\
  \ 显示管理器使用几个不同的文件进行配置：\n• `/usr/share/lightdm/lightdm.conf.d`\n• `/etc/lightdm/lightdm.conf.d`\n\
  • `/etc/lightdm/lightdm.conf`\n• `kdm` KDE 显示管理器实际上基于 `xdm`，通常使用 `xdm` 配置文件。然而，某些发行版将你的\
  \ `kdm` 设置存储在 `/etc/kde/kdm` 或 `/etc/X11/ kdm` 中。在这种情况下，你将使用这两个目录之一的 `kdmrc` 文件进行大多数的配置更改。\n\
  • `gdm` `/etc/X11/gdm`\n\n#### 配置显示器的远程访问\n\n许多组织为其终端用户使用瘦客户端系统。这种实现允许组织使用大量廉价的瘦客户端为所有用户提供完整的图形桌面。\n\
  \n要配置远程访问以监听网络上来自瘦客户端上 X 服务器软件的入站连接请求，请在 X 服务器上运行 `xhost +` 命令。\n\n瘦客户端只需要 `telnet`\
  \ 到 X 服务器，输入登录名和密码，并运行任何 X 客户端。X 客户端将显示在瘦客户端上。\n\n![Images](img/note.jpg)\n\n**注意**可以通过\
  \ `ssh -X` 通过 X11 安全控制台定向，运行 `ssh -L` 可以通过端口转发进一步增强安全性。\n\n### 配置辅助功能\n\n为了支持多元员工队伍，管理员必须学习为身体、听力及视觉视障的用户配置辅助功能设置。本章涵盖的几个工具包括：\n\
  \n• 键盘辅助功能\n• 鼠标辅助功能\n• 屏幕阅读器\n\n要访问辅助技术，请搜索并选择“通用访问”（Universal Access）。屏幕如图 20-9\
  \ 所示。\n\n![Images](img/F20-09.jpg)\n\n**图 20-9** 启用辅助技术\n\n#### 键盘辅助功能\n\n\n\n\n\
  \n通用访问（Universal Access）允许你配置以下内容：\n\n- `StickyKeys`（粘滞键）：允许用户锁定 `Ctrl` 和 `Shift`\
  \ 等键，以便仅用一个手指完成通常需要两个或多个手指的键盘任务。\n- `SlowKeys`（慢键）：这有助于用户避免误触键盘。\n- `BounceKeys\
  \ and DelayKeys`（过滤键和延迟键）：在按键之间插入微小延迟，以防止键盘发送无意按键。\n\n对于无法使用传统键盘的身体障碍用户，Linux 提供了屏幕键盘的选项，允许用户使用鼠标在虚拟键盘上选择按键。常用的屏幕键盘应用程序包括\
  \ GOK（GNOME 屏幕键盘）和 `GTkeyboard`。\n\n## 鼠标辅助\n\n除了键盘辅助外，辅助技术还为身体障碍用户提供了鼠标辅助选项。例如，用户可以在“通用访问”面板中的“指针和点击”（Pointing\
  \ and Clicking）下配置鼠标选项。其中一个选项是“模拟右键”（Simulated Secondary Click），它在按住主键几秒后会发送双击。\n\
  \n## 屏幕阅读器\n\n视障用户可以使用的一种选项是屏幕阅读器，它能以语音形式为用户“读出”屏幕显示的文本。Orca 可能是最常用的屏幕阅读器。另一个主要的屏幕阅读器是\
  \ `emacspeak`。\n\n其他辅助工具还包括屏幕放大镜、盲文设备和高对比度桌面主题。\n\n## 配置区域设置设置\n\n管理员通常在安装过程中配置系统的\
  \ `locale`（区域设置）。他们还可以在区域设置中指定编码。例如，使用 `en_US.UTF-8` 配置默认区域设置，或使用 UTF-8 字符编码（也称为\
  \ `Unicode` 编码）配置美国英语的 `LC_`。\n\n并不是所有的 `LC_` 变量的优先级都相同。Linux 使用以下规则：\n\n- 如果定义了\
  \ `LC_ALL` 变量，则使用其值，并且不检查分配给所有其他 `LC_` 变量的值。\n- 如果 `LC_ALL` 未定义，则检查特定的 `LC_` 变量。如果该特定的\
  \ `LC_` 变量有值，则使用该值。\n- 如果所涉及的 `LC_` 变量为空，则使用 `LANG` 环境变量。\n\n要让所有 `LC_` 变量使用相同的值，请设置\
  \ `LC_ALL` 变量。\n\n![Images](img/note.jpg)\n\n**注意** 大多数发行版设置 `LC_CTYPE` 的值来定义默认编码，并将\
  \ `LANG` 的值作为所有其他 `LC_` 变量的默认值。\n\n要查看当前的区域设置，在 shell 提示符下输入 `/usr/bin/localectl`\
  \ 或 `/usr/bin/locale` 命令。例如：\n\n![Images](img/f0656-01.jpg)\n\n在此示例中，仅定义了 `LANG`\
  \ 和 `LC_CTYPE` 变量。其他 `LC_` 变量会自动填充分配给 `LANG` 的值。\n\n使用 `locale` 配合 `-a` 选项生成所有可用区域设置的列表。使用\
  \ `locale` 配合 `-m` 选项查看可用编码列表。示例下：\n\n![Images](img/f0656-02.jpg)\n\n请注意，更改编码可能会导致查看使用不同编码创建的文件时出现问题。要从一种编码转换为到新编码，请在\
  \ shell 提示符下使用 `iconv` 命令。语法如下：\n\n```\n![Images](img/f0657-01.jpg)\n```\n\n![Images](img/note.jpg)\n\
  \n**注意** 常用的文本编码包括 iso8859（也称为 Latin-9 编码），专为西欧语言设计；`ASCII`，使用基于英语的字符编码方案；以及 `Unicode`，旨在处理来自世界语言的字符集。\n\
  \n### 配置时区设置\n\n在首次安装 Linux 系统期间，系统会提示你指定系统所在的时区。要查看当前时区，在 shell 提示符下输入 `timedatectl`\
  \ 或 `date`，如下：\n\n![Images](img/f0657-02.jpg)\n\n在 Debian 系统上更改时区，请修改 `/etc/timezone`\
  \ 文件的值。对于其他系统，修改 `TZ` 环境变量的值并将其导出。这在你没有 `root` 密码，或者你希望在不更改其他用户使用的时区的情况下使用不同的时区时非常有用。语法为\
  \ `export TZ=<time_zone>`。可以在 `/usr/share/zoneinfo/` 目录下找到可用时区的列表，如下所示：\n\n![Images](img/f0657-03.jpg)\n\
  \n此更改不是持久的。重启后，系统将恢复到默认时区。要使时区持久化，请在 `~<username>/.profile` 文件中添加类似于下例的内容：\n\n![Images](img/f0657-04.jpg)\n\
  \n你还可以通过将 `/etc/localtime` 文件链接到 `/usr/share/zoneinfo` 下的时区文件来更改时区。例如，要切换到山标准时间（Mountain\
  \ Standard Time），请输入：\n\n![Images](img/f0657-05.jpg)\n\n### 使用 CUPS 配置打印\n\n无论你使用哪种操作系统，它提供的最重要的服务之一就是将打印作业发送到打印机的能力。因此，你需要非常熟悉\
  \ Linux 打印，尽管这并不是 CompTIA Linux+ 考试目标的要求。在本节中，我们将涵盖与 Linux 打印相关的以下主题：\n\n- 配置 CUPS\n\
  - 使用行打印机守护进程 (`lpd`)\n\n让我们先讨论 Linux 打印的工作原理。\n\n### 配置 CUPS\n\n所有 CUPS 打印机都定义在\
  \ `/etc/cups/printers.conf` 文件中。你可以手动编辑此文件，但你真的应该使用 CUPS 的 Web 管理工具。你可以配置 CUPS 为本地连接的打印机提供服务（并可选地让其他网络用户可用），或者通过网络连接到\
  \ CUPS 打印机。例如，配置 CUPS 使用本地连接的打印机，请执行以下操作：\n\n**1.** 在你的 Linux 系统上，启动浏览器并导航到 `http://localhost:631`。\n\
  **2.** 选择“管理”（Administration）。\n**3.** 在“打印机”（Printers）下，选择“添加打印机”（Add Printer）。\n\
  **4.** 根据提示，使用之前创建的管理员登录。\n**5.** 在“本地打印机”（Local Printers）下选择本地连接的打印机类型，然后选择“继续”（Continue）。\n\
  \n![Images](img/tip.jpg)\n\n**提示** 你也可以在此屏幕上选择网络打印机。其他网络主机上广播的所有 CUPS 打印机都列在“发现的网络打印机”（Discovered\
  \ Network Printers）下。要向这些打印机之一发送打印作业，只需选择它。\n\n**6.** 在“名称”（Name）字段中为打印机输入一个名称。\n\
  **7.** 在“描述”（Description）字段中输入打印机的描述。\n**8.** 在“位置”（Location）字段中输入打印机的位置。\n**9.**\
  \ 如果你想与其他网络用户共享打印机，请勾选“共享此打印机”（Share This Printer）。\n**10.** 选择“继续”（Continue）。\n\
  **11.** 选择打印机制造商；然后选择“继续”（Continue）。\n**12.** 在“型号”（Model）字段中选择你的打印机型号；然后选择“添加打印机”（Add\
  \ Printer）。\n**13.** 配置打印机的默认选项，如纸张大小、颜色模式、介质源、打印质量、双面打印等。完成后，选择“设置默认选项”（Set Default\
  \ Options）。\n\n此时将显示一个页面指示你的打印机已添加。将显示打印机的当前状态。\n\n从“打印机状态”（Printer Status）页面，你可以管理你的\
  \ CUPS 打印机。你可以发送测试页、停止打印机、终止打印作业、修改打印机配置或彻底删除打印机。\n\n\n\n\n\n此时，你可以将打印作业发送到打印机。如果你在使用图形化\
  \ X 应用程序，只需选择“文件 > 打印”，然后选择打印机并点击“确定”。你也可以从命令行将打印作业发送到打印机。这是通过使用 `lp` 命令实现的，它会将指定的文件发送到打印机。语法为\
  \ `lp -d` `<printer_name> <filename>`。例如，如果我想将当前目录下的 `myfiles` 文件打印到我刚刚创建的 `HPLJ2`\
  \ 打印机，我会在 shell 提示符下输入 `lp -d HPLJ2 ./myfiles`，如下所示：\n\n![Images](img/f0659-01.jpg)\n\
  \n如此示例所示，作业被创建并分配了一个 ID（在此情况下，为 `HPLJ2-2`）。该作业被添加到打印队列并发送到打印机。`lp` 工具除了 `-d` 之外，还包含许多用于创建打印作业的选项，包括以下选项：\n\
  \n-   `-n x`: 打印 `x` 份副本\n-   `-m`: 打印完成后，向用户的本地用户账户发送确认邮件\n-   `-q x`: 将打印作业的优先级设置为\
  \ `x`\n-   `-o landscape`: 以横向方向打印文件，而不是纵向\n-   `-o sides=2`: 在支持双面打印的打印机上双面打印文件\n\
  \n你还可以配置其他 Linux 系统打印到 CUPS 打印机。只需配置一个新的打印机，但要指定它监听 CUPS 通告即可。你配置的 CUPS 打印机应该在 30\
  \ 秒内显示。选择它后，所有发送到该打印机的打印作业都将通过网络连接重定向到你的 CUPS 打印机。\n\n此外，如果你在系统上安装了 Samba，你的 CUPS\
  \ 打印机会自动共享。你可以从 Windows 工作站连接到它们并提交打印作业。这太酷了！\n\n除了 CUPS 基于 Web 的管理工具外，你还可以使用多种命令行工具配置\
  \ CUPS。要查看 CUPS 打印机信息，你可以使用 `lpstat` 工具。在使用 `lpstat` 时最有选项之一是 `-t`。这将导致 `lpstat`\
  \ 显示系统上所有 CUPS 打印机的信息，如下一个示例所示：\n\n![Images](img/f0659-02.jpg)\n\n这显示了默认 CUPS 打印机\
  \ (`HPLJ2`)、它的连接方式 (`/dev/lp0`)、当前处理的打印作业（如果有）以及等待打印的任务列表。\n\n要取消待处理的打印作业，你可以使用\
  \ `cancel` 命令。语法为 `cancel <job_ID>`。例如，假设我发送了一个巨大的打印作业（来自 `/usr/share/doc/manual/`\
  \ 的 Linux 用户手册），它被分配的打印 ID 为 `HPLJ2-4`。在打印过程中，我决定这太浪费纸张了。我可以在 shell 提示符下输入 `cancel\
  \ HPLJ2-4` 来杀死该作业并将其从打印队列中删除。这也可以在 CUPS 基于 Web 的工具中完成。只需进入“作业 (Jobs)”选项卡并选择“显示活动作业”。找到需要取消的作业并选择“取消作业”。\n\
  \n如果你连接了多个 CUPS 打印机，可以使用 `lpoptions -d <printer>` 命令指定默认打印机。例如，要将 `HPLJ5` 打印机设置为默认打印机，我会输入\
  \ `lpoptions -d HPLJ5`。这将设置系统中所有用户的默认打印机。然而，单个用户可以通过在他们的家目录下创建一个名为 `.lpoptions`\
  \ 的文件并添加以下指令来覆盖此设置：\n\n![Images](img/f0660-01.jpg)\n\n如果你想查看打印机的配置设置，可以在 shell 提示符下输入\
  \ `lpoptions -l`。\n\n除了 `lpoptions` 命令外，你还可以使用 `cupsaccept <printer_name>` 或 `cupsreject\
  \ <printer_name>` 命令来启用或禁用打印机队列。例如，我可以在 shell 提示符下输入 `cupsreject HPLJ2` 来禁用打印机队列，如示例所示：\n\
  \n![Images](img/f0660-02.jpg)\n\n打印机本身将继续处理队列中的打印作业，但 `cupsd` 将不允许任何新作业进入队列。`cupsdisable`\
  \ 命令还包含 `–hold` 选项，它会在当前作业完成后停止打印。要再次启用队列，我会在 shell 提示符下输入 `cupsaccept HPLJ2`。\n\
  \n如果要禁用打印机本身而不是队列，我可以在 shell 提示符下输入 `cupsdisable HPLJ2`，如示例所示：\n\n![Images](img/f0660-03.jpg)\n\
  \n打印队列将继续接受作业，但在我在 shell 提示符下输入 `cupsenable HPLJ2` 之前，没有任何作业会被打印。`cupsenable` 命令还包含\
  \ `--release` 选项，用于释放待处理作业进行打印。\n\n到为止，CUPS 是现代 Linux 发行版的首选打印系统。年前，首选的打印系统是行打印守护进程\
  \ (`lpd`)。大多数 `lpd` 命令的功能与 CUPS 提供的功能相似，如表 20-1 所示。\n\n![Images](img/f0661-01.jpg)\n\
  \n**表 20-1** `lpd` 命令\n\n作为一个有趣的补充，这些命令也适用于 `cupsd`。例如，在 shell 提示符下输入 `lpc status`，它将返回\
  \ CUPS 打印机的状态。\n\n### 配置电子邮件\n\n虽然配置电子邮件是 Linux 员员的一项重要任务，但它*不是* CompTIA Linux+\
  \ 考试目标的要求。让我们先查看存储在本地邮件传输代理 (MTA) 中的消息。当你登录到 shell 会话时，如果有邮件消息等待你，你将收到通知。你可以直接从本地\
  \ MTA 读取本地用户的消息。\n\n**注意** 某些在 Linux 上的服务被配置为将消息发送给 root 用户。\n\n这些消息存储在用户的队列中，位于\
  \ `/var/spool/mail/`。mail 工具从用户的队列读取消息。因为 mail 工具位于队列所在的系统，所以不需要配置 POP3 或 IMAP 支持。在\
  \ `?` 提示符中使用表 20-2](#ch20.xhtml_ch20tab2)所示的 `mail` 命令。\n\n![Images](img/f0661-02.jpg)\n\
  \n**表 20-2** 邮件命令\n\n要发送消息，在 shell 提示符下输入 `mail <recipient_address>`。然后输入主题和消息正文。完成后按\
  \ `Ctrl-D` 发送消息。完成后，消息将由 MTA 递送到用户的邮件队列。\n\n要查看邮件队列中的未读消息，你可以在 shell 提示符下输入 `mailq`。\n\
  \n你还可以为在 Linux 系统上的 MTA 配置别名。邮件别名将指向一个用户的邮件重定向到另一个用户的账户。使用 `/etc/aliases` 文件来配置别名。此文件每行定义一个别名。你定义的别名必须指向现有电子邮件地址。此文件的语法如下：\n\
  \n![Images](img/f0662-01.jpg)\n\n例如，以下两个别名在大多数 Linux 发行版中存在：\n\n![Images](img/f0662-02.jpg)\n\
  \n这些别名导致任何发送给 postmaster 的邮件自动重定向到 root 用户。同样，任何发送给 mailer-daemon 的邮件将重定向到 postmaster（然后重定向到\
  \ root）。取决于你的发行版，你可能会发现默认已经为你定义了许多别名。示例所示：\n\n![Images](img/f0662-03.jpg)\n\n当然，如果需要，你可以输入自定义别名。只需用文本编辑器打开\
  \ `/etc/aliases` 文件并添加相应的别名，每行一个。完成别名配置后，你需要在 shell 提示符下以 root 身份运行 `newaliases`\
  \ 命令来启用它们。\n\n还使用 `~/.forward` 文件配置转发。Linux MTA 此文件是否存在以配置消息转发。现在电子邮件将自动转发到此文件中的电子邮件地址。要停止转发，请删除此文件。\n\
  \n\n\n\n\n![Images](img/note.jpg)\n\n**注意** MTA 将你在此文件中输入的地址视为视为别名。这将导致所有电子邮件被转发到转发电子邮件地址。消息将*不会*被递送到原始用户的邮箱中。\n\
  \n### 配置 SQL 数据库\n\n另一个非常值得了解的 Linux 主题（*不包含在 CompTIA Linux+ 考试目标中*）是类配置 SQL 数据库。*数据库*是组织良好的信息的集合，以便根据创建的搜索查询快速地选择和检索数据。\n\
  \n数据库服务运行在客户端/服务器模型上。Linux 上通常实现两种数据库服务：\n\n• `MySQL`\n• `PostgreSQL`\n\n通过安装其中一种数据库服务，你就可以安装了使用\
  \ `SQL`（结构化查询语言）运行、操作和管理数据库所需的软件，`SQL` 是一种用于访问和操作数据库的标准语言。\n\n这两种数据库服务都是关系型数据库，其本质上是层次结构的。关系型数据库专门用于组织和存储大量数据。它们还设计成具有高度的可扩展性，允许随时间的推移而增长。\n\
  \n关系型数据库使用字段、记录和表来组织。*字段*是单条信息。*记录*是一组完整的字段，而*表*是记录的集合。每个表由一个名称标识，例如 `Customers`。每个表包含记录（每条记录为一行），记录包含一个或多个字段，这些字段又包含实际的数据库数据。例如，假设你定义了一个名为\
  \ `Customers` 的表并创建了以下三条记录：\n\n![Images](img/f0663-01.jpg)\n\n使用 `SQL` 语言，你可以创建查询从数据库中选择和检索特定数据。例如，假设你正在编写以下查询：\n\
  \n![Images](img/f0663-02.jpg)\n\n数据库将返回以下数据：\n\n![Images](img/f0663-03.jpg)\n\n\
  你可以使用以下命令管理 SQL 数据库中的数据：\n\n• `SELECT` 从表中检索信息\n• `UPDATE` 修改表中的信息\n• `DELETE` 从表中删除信息\n\
  • `INSERT INTO` 向表中添加新数据\n• `CREATE TABLE` 创建新表\n• `ALTER TABLE` 修改现有表\n• `DROP\
  \ TABLE` 删除现有表\n\n关系型数据库的一个关键特性是你可以在表与表之间创建*关系*，这允许你创建相互相关的数据集。\n\n为了管理 `MySQL`\
  \ 服务器上的数据，你必须使用某种 `SQL` 客户端连接到它。你可以从许多不同的客户端中选择。如果你能用此工具操作 `SQL Server` 数据，那么所有其他客户端对你来说将轻而易举。\n\
  \n命令行 `MySQL` 客户端通过在 shell 提示符输入 `mysql` 来运行。语法为 `mysql -h <hostname> -u <username>\
  \ -p`。例如，要以 `root` 身份连接运行在本地 Linux 系统上的 `MySQL` 服务，你需要输入以下命令：\n\n![Images](img/f0664-01.jpg)\n\
  \n### 配置存储\n\n本节包含了学习存储有趣的细节，但并不是 CompTIA Linux+ 考试目标的要求。讨论了以下主题：\n\n• GUID 分区表\
  \ (GPT) 组件\n• 集成驱动器 (IDE) 驱动器\n• 定位设备\n\n### GUID 分区表组件\n\n让我们使用 GPT 分区的磁盘设备的各个部分（参见图\
  \ 20-10）。\n\n![Images](img/F20-10.jpg)\n\n**图 20-10** GUID 分区表\n\n##### 保护 MBR (LBA\
  \ 0)\n\n保护性 MBR 用于防止 MBR 磁盘工具覆盖 GPT 分区。使用 MBR 引导加载程序是为了基于 BIOS 的系统能够受益 GPT。GPT 的\
  \ MBR 经过修改以识别 GPT 分区。\n\n##### GPT 头部 (LBA 1)\n\nGPT 头部包含有关分区表结构的信息。\n\n##### 分区表项\
  \ (LBA 2 到 33)\n\n此节包含多达 128 个逻辑分区的分区表项。表 20-3 说明了每个分区存储的信息。\n\n![Images](img/f0665-02.jpg)\n\
  \n**表 20-3** 分区表项\n\n**分区 (LBA 34 到 −34)** 此节定义了用户定义的分区。\n\n##### 次级（备份）分区表项 (LBA\
  \ −33 到 −2)\n\n这是 LBA 2 到 33 中找到的分区表项的备份。\n\n##### 次级（备份）GPT 头部 (LBA 1)\n\n这是 LBA\
  \ 1 中找到的头部项的备份。\n\n### IDE 驱动器\n\nIDE 接口不包含设备控制器。IDE 驱动器的控制器内置在磁盘设备中。接口由一个主通道和一个次级通道组成（参见表\
  \ 20-4）。每个通道支持两个磁盘设备（主和从）。在特定通道内，主设备控制该通道上的通信。\n\n![Images](img/f0666-01.jpg)\n\n\
  **表 20-4** IDE 驱动器命名法\n\n`/dev/hda` 是连接到 IDE 主通道的磁盘设备名称，它是该通道上的主磁盘设备。\n\n### 定位设备\n\
  \n当系统启动时，它会对设备进行分类，为其提供设备名称并存储设备规格。接下来，操作系统必须提供访问设备的方法。让我们简要看看这个过程。\n\n##### 主设备和小设备号\n\
  \n启动时，Linux 内核通过扫描每个系统总线检测并初始化设备。当内核发现设备时，它确定设备类并为设备分配一个主设备和小设备号。设备类用于查找设备的驱动程序。Linux\
  \ 分配名称和数字机构 (LANANA) 维护设备类列表。\n\n一旦确定了设备类，内核会在 `/sys` 中创建设备目录并在该目录下存储设备属性。启动后，内核会持续扫描系统总线以检测设备的添加、更改或删除。\n\
  \n![Images](img/note.jpg)\n\n**注意** `/sys` 是 `sysfs` 伪文件系统的挂载点。`sysfs` 为运行在系统用户空间的应用程序提供设备信息。\n\
  \n注意图 20-11 中的输出。在应该显示文件大小的地方，你看到两个数字（例如 `8, 0`）。第一个数字是主设备号，第二个数字是小设备号。使用此信息，你可以看到你何时访问设备\
  \ `sdb1`（图 20-11，第 6 行）。磁盘设备的小设备号告知设备程序与哪个逻辑设备进行通信。\n\n![Images](img/F20-11.jpg)\n\
  \n**图 20-11** 主设备号和小设备号\n\n磁盘设备上的分区总数取决于驱动器类型。IDE 设备可能有多达 63 个分区；SCSI 设备可能有多达 15\
  \ 个分区。\n\n设备类的小设备号是顺序的。SCSI 磁盘设备的第一个小设备号代表整个驱动器。0–15 留给设备 `sda`，`sdb` 的第一个小设备号是\
  \ `16`。\n\n`sdb` 的小设备号范围是 `16–31`。序列中的第一个小设备号 `16` 是整个设备 (`sdb`）的逻辑单元号。第二个小设备号 (`17`）是第一个分区（或\
  \ `sdb1`）的逻辑单元号。\n\n##### 使用 `udev` 管理设备树\n\n在一次启动过程中扫描的设备在另一个启动过程中可能不会以相同的顺序扫描。小设备号影响设备名称并按顺序分配，因此会导致设备的名称发生变化。尽管不会影响内核访问设备的能力，但尝试通过名称访问设备的应用程序将遇到问题。这个问题通过在系统设备树\
  \ (`/dev`) 中为设备创建路径来解决。\n\n![Images](img/note.jpg)\n\n\n\n\n\n**注意** 除了 `/dev/disk/by-id`、`/dev/disk/by-uuid`\
  \ 和 `/dev/disk/by-path`，还提供了 `/dev/disk/by-partlabel` 和 `/dev/disk/by-partuuid`\
  \ 作为访问磁盘设备的方法。\n\n当内核发现系统总线上设备的添加、修改或删除时，它会生成一个 `uevent`。`uevent` 通知 `udev` 设备添加、删除或更改。`udev`\
  \ 使用设备类别、存储在 `/sys` 中的信息以及 `udev` 规则来创建、删除或修改系统设备树 `/dev`。\n\n`udev` 规则定义了特定设备如何被添加或删除，以及在设备添加、修改或删除之前后应该发生的任何操作。这使得设备配置具有持久性。\n\
  \n`udev` 规则位于 `/lib/udev/rules.d` 或 `/etc/udev/rules.d`。`/lib/udev/rules.d` 中的规则是系统默认的，而\
  \ `/etc/udev/rules.d` 中的是自定义规则。`/etc/udev/rules.d` 中的规则会覆盖 `/lib/udev/rules.d` 中的规则。\n\
  \n在枚举磁盘设备时，`udev` 将文件中文件中条目：`/dev/disk/by-path`、`/dev/disk/by-id`、`/dev/disk/by-uuid`、`/dev/disk/by-partlabel\
  \ (uefi)` 和 `/dev/disk/by-partuuid (uefi)`。\n\n### `/dev/disk/by-path`\n`/dev/disk/by-path`\
  \ 中的条目（图 20-12）提供了设备物理路径与设备名称之间的符号链接。\n\n![Images](img/F20-12.jpg)\n\n**图 20-12**\
  \ `/dev/disk/by-path`\n\n设备的路径表示法为 `host:bus:target:lun`，并在表 20-5 中进行了详细说明。\n\n\
  ![Images](img/f0668-02.jpg)\n\n**表 20-5** 设备路径表示法\n\n### `/dev/disk/by-id`\n每个 SCSI\
  \ 设备在制造时都会分配一个名为全球标识符 (`WWID`) 的唯一标识符。`/dev/disk/by-id` 目录提供了设备 `WWID` 与设备名称之间的符号链接（参见图\
  \ 20-13）。这使得应用程序即使在设备路径发生变化也能访问设备。\n\n![Images](img/F20-13.jpg)\n\n**图 20-13** `/dev/disk/by-id`\
  \ 到磁盘驱动器的映射\n\n图 20-13 中的序列号是由 VirtualBox 创建的。\n\n### `/dev/disk/by-uuid`\n通用唯一标识符\
  \ (`UUID`) 是应用于文件系统和系统设备的唯一识别数字。每个文件系统在创建时都会分配一个 `UUID` 编号。\n\n![Images](img/note.jpg)\n\
  \n**注意** `UUID` 编号也可以应用于如网卡等系统设备。\n\n在图 20-14 中，你可以看到 `/dev/disk/by-uuid` 包含了文件系统\
  \ `UUID` 与设备名称之间的符号链接。\n\n![Images](img/F20-14.jpg)\n\n**图 20-14** `dev/disk/by/uuid`\
  \ 到存储媒体的映射\n\n![Images](img/note.jpg)\n\n**注意** 图 20-14 中的 `dm-0` 和 `dm-1` 是 LVM\
  \ 逻辑卷。`dm` 指设备映射器（device mapper）。\n\n### `/dev/disk/by-partlabel`\n此文件仅在使用 GPT 分区时可见。该目录包含了作为设备分区标签与设备之间符号链接的文件。\n\
  \n### `/dev/disk/by-partuuid`\n此文件仅在使用 GPT 分区时可见。每个分区都被分配一个 `UUID`。该目录包含了作为分区 `UUID`\
  \ 与设备之间符号链接的文件。\n\n### `/dev/mapper`\n`/dev/mapper`是将物理块设备划分为虚拟块设备的方法。命令 `ls -lha\
  \ /dev/mapper` 和 `dmsetup ls` 将显示逻辑卷设备列表。\n\n#### 建议的交换空间大小\n每个发行版可能有自己的交换空间分配建议。表\
  \ 20-6 是 Red Hat 对不休眠系统的建议交换空间大小。\n\n![Images](img/f0669-02.jpg)\n\n**表 20-6** 建议的交换空间\n\
  \n根据发行版的建议，将交换空间划分在多个驱动器上并设置交换优先级，使交换分区像 RAID 条一样工作可能更高效。\n\n#### 恢复损坏的 superblock\n\
  `e2fsck` 一个非常有用的功能是能够恢复 `ext2/3/4` 文件系统上损坏的 superblock。superblock 是位于分区开头的块，包含文件系统结构的信息。此外，大多数\
  \ Linux 文件系统在分区的各个位置保留了 superblock 的副本。\n\n如果 superblock 损坏，你可以使用这些备份副本之一进行恢复。语法为\
  \ `e2fsck -f -b backup_superblock device`。`-f` 选项告诉 `e2fsck` 强制检查，即使文件系统看起来是干净的。`-b`\
  \ 选项告诉 `e2fsck` 应该使用哪个副本的 superblock。\n\n如果你不记得备份 superblock 的位置，请执行命令 `mkfs -n\
  \ <device>`。\n\n#### 强制用户退出繁忙的文件系统\n有时用户会阻碍正常关机。如果认证技术人员到达修理硬件时用户未注销，请使用 `fuser`\
  \ 命令强制他们注销。\n\n运行命令 `fuser -k /<filesystem_name>` 或 `fuser -k -9 /<filesystem_name>`。对于位于主目录的用户，运行\
  \ `fuser -k /home`。这将杀死所有用户作业以便你进行优雅关机。*警告：可能会损坏用户数据。*\n\n### 本章总结\n本章涵盖了并非 CompTIA\
  \ Linux+ 考试目标的 Linux 主题，但对你作为管理员设置服务器和工作站非常有帮助。你学习了如何进行 Linux 安装以及如何为用户设置图形环境。\n\
  \n接下来你学习了如何配置 Linux 系统连接并向打印机发送打印作业、发送和接收电子邮件，以及访问硬盘和优 盘等存储设备。\n\n本章的一些关键点包括以下：\n\
  \n*   如果在美国寻找工作，使用最广泛的企业级 Linux 版本是 Red Hat Enterprise Linux，SUSE Linux Enterprise\
  \ Server 次之。\n*   Linux 安装支持服务器和工作站的配置。\n*   X Window 和 Wayland 显示变量是 `DISPLAY`。\n\
  *   Linux 为身体残障的用户提供了辅助工具。\n*   要添加打印机，请使用 Linux 供应商提供的设置工具或访问网站 [`localhost:631`](http://localhost:631)\
  \ 设置 CUPS 打印机。\n*   Linux 可以配置为电子邮件服务器或电子邮件客户端。\n*   Linux 可以使用 `mysql`、`postgresql`\
  \ 等配置为 SQL 服务器。\n*   可以为硬盘、优 盘或 SD 卡设置存储。\n\n#### 习\n**1.** 在进行 Linux 安装之前进行需求评估时，你应该问哪些问题？（选择两个。）\n\
