  \ (sourced)*。以 `.sh` 结尾的文件在使用 Bourne、Korn 或 Bash shell 时会被加载。以 `.csh` 结尾的文件在使用 C-shell\
  \ 时会被加载。\n\n### `source` 命令\n\n配置的更改在存储到内存中或被*加载 (sourced)* 之前是不生效的。要将更改放入内存，用户必须执行配置文件中的命令。`source\
  \ <filename>` 或 `. <filename>`（注意开前的点和空格）会执行配置文件中的命令。\n\n一旦用户对如 `~/.bash_profile`\
  \ 等配置文件进行了更改，他们可以运行 `source ~/.bash_profile` 或 `. ~/.bash_profile` 来使配置更改立即生效。\n\
  \n### 练习 3-1：使用变量、参数和别名\n\n此练习让你能够练习创建和删除变量、别名和 shell 选项，以及编辑 shell 配置文件。但首先，我想强调一些对你职业非常有帮助的内容。执行命令时，务必测试结果。例如，要打开子\
  \ shell，请使用以下步骤：\n\n1. 要打开子 shell，请使用以下步骤：\n2. 要打开子 shell，请使用以下步骤：\n3. 要打开子 shell，请使用以下步骤：\n\
  4. 要打开子 shell，请使用以下步骤：\n5. 要打开子 shell，请使用以下步骤：\n6. 要打开子 shell，请使用以下步骤：\n7. 要打开子\
  \ shell，请使用以下步骤：\n8. 要打开子 shell，请使用以下步骤：\n9. 以下步骤：\n\n\n\n\n\n**20.** 执行命令 `set\
  \ -o | grep allexport` 来验证 `allexport` 参数已开启。\n\n**21.** 执行命令 `truck=chevy` 来创建变量\
  \ `truck` 并为其赋值值 `chevy`。执行命令 `env | grep truck` 来确定该变量是否分配了 `export` 属性。\n\n**22.**\
  \ 执行命令 `set +o allexport` 关闭 `allexport`，并验证 shell 参数已关闭。\n\n**23.** 执行命令 `alias\
  \ ldetc='ls -ld /etc'` 创建别名 `ldetc`，该别名将执行命令 `ls -ld /etc`。\n\n**24.** 输入命令 `alias`\
