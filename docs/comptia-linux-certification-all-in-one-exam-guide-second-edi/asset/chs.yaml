  \ `last`\n*   **C.** `grep`\n*   **D.** `lastlog`\n\n### [11]. 你需要查看非常长的 `/var/log/boot.msg`\
  \ 文件的前几行。以下哪些命令最适合此操作？（选择两个）\n\n*   **A.** `head /var/log/boot.msg`\n*   **B.**\
  \ `tail /var/log/boot.msg`\n*   **C.** `grep -l 10 /var/log/boot.msg`\n*   **D.**\
  \ `less /var/log/boot.msg`\n*   **E.** `cat /var/log/boot.msg`\n\n### [12]. 哪种工具最适合在\
  \ Linux 命令上配置 SELinux 策略？\n\n*   **A.** `audit2why`\n*   **B.** `semanage`\n*  \
  \ **C.** `audit2allow`\n*   **D.** `sealert`\n\n### [13]. 在配合 `tail` 或 `journalctl`\
  \ 命令使用时，哪个选项会导致 `tail` 或 `journalctl` 工具监控日志文件中的新条目？\n\n*   **A.** `-`\n*   **B.**\
  \ `-l`\n*   **C.** `-m`\n*   **D.** `-f`\n\n### [14]. 下列哪些命令可以用于更改文件的 SELinux 上文中？\n\
  \n*   **A.** `chcon`\n*   **B.** `conch`\n*   **C.** `contextchange`\n*   **D.**\
  \ `context-change`\n\n### [15]. 你需要扫描 Linux 文件系统，以找到所有具有 SUID 或 SGID 权限的文件。你可以使用哪些命令执行此操作？（选择两个）\n\
  \n*   **A.** `find / -type f -perm -u=s -ls`\n*   **B.** `find / -type f -perm -g=s\
  \ -ls`\n*   **C.** `audit -p=SUID`\n*   **D.** `audit -p=SGID`\n*   **E.** `find\
  \ / -p=s`\n*   **F.** `find / -p=g`\n\n### [16]. 哪个文件的存在会防止 `root` 以外的所有用户登录 Linux\
  \ 系统？\n\n*   **A.** `/root/nologin`\n*   **B.** `/etc/nologin`\n*   **C.** `/var/log/nologin`\n\
  *   **D.** `/tmp/nologin`\n\n### [17]. 你想使用 `pam_limits` 模块配置 Linux 用户允许消耗的系统限制。你需要编辑哪个文件来设置这些限制？\n\
  \n*   **A.** `/etc/limits.conf`\n*   **B.** `/etc/pam_limits.conf`\n*   **C.** `/etc/security/limits.conf`\n\
  *   **D.** `/etc/security/pam_limits.conf`\n\n### 答案\n\n*   **[1] D.** 锁锁的房间是放置\
  \ Linux 服务器最安全的地方。\n*   **[2] A, B.** 屏幕保护密码和 KDE、GNOME 提供的会锁可以用于保护用户。\n*   **[3]\
  \ D.** `nohup updatedb &` 命令将加载 `updatedb`进程并让其保持运行，即使户注销 shell 也是。\n*   **[4] A.**\
  \ `su -` 命令切换到 `root` 账户并加载 `root` 的环境。\n*   **[5] B.** `TuxP3nguin` 密码满足强密码的基本要求。\n\
  *   **[6] D.** `chage -m 1 -M 45 -W 5 ksanders` 命令将最小密码有效期设置为 1 天，最长密码有效期设置为 45\
  \ 天，并在密码过期前 5 天提醒用户。\n*   **[7] C.** `/var/log/wtmp` 日志文件包含了所有登录过 Linux 系统的用户列表，包括他们的登录时间、注出时间以及登录来源。\n\
  *   **[8] A.** `/var/log/faillog` 日志文件包含了登录失败尝试列表。\n*   **[9] B.** `/var/log/messages`\
  \ 日志文件包含了系统上运行的所有服务的消息信息。\n*   **[10] D.** `lastlog` 命令可以用于查看 `/var/log/lastlog`\
  \ 文件。\n*   **[11] A, D.** `head /var/log/boot.msg` 和 `less /var/log/boot.msg` 命令将在屏幕上显示非常长文件的前几行。\n\
  *   **[12] B.** `semanage` 命令最适合在命令上配置 SELinux 设置。`sealert`、`audit2why` 和 `audit2allow`\
  \ 命令有助于排查 SELinux 中断。\n*   **[13] D.** `-f` 选项配合 `journalctl` 或 `tail` 使用时，会导致命令监控文件变化并将其显示在屏幕上。\n\
  *   **[14] A.** `chcon` 命令用于更改文件的 SELinux 上文中。\n*   **[15] A, B.** `find / -type\
  \ f -perm -u=s -ls` 命令找到所有设置了 SUID 权限的文件。`find / -type f -perm -g=s -ls` 命令找到所有设置了\
  \ SGID 权限的文件。\n*   **[16] B.** `/etc/nologin` 文件的存在防止 `root` 以外的所有用户登录系统。\n*   **[17]\
  \ C.** 由 `pam_limits` 模块执行的用户限制在 `/etc/security/limits.conf` 中配置。\n\n## 第 17 章\n\
  ## 应用 DevOps：自动化与编排\n\n在本章中，你将学习：\n\n*   编排概念\n*   编排过程\n*   Git 版本控制系统\n\n*把普通的事情做到不寻常。*\n\
  —乔治·华盛顿·卡佛\n\n你已经学习了许多 Linux 自动化工具，例如 `at`、`batch` 和 `crontab`。然而，当 Linux 管理员管理数千台计算机时，自动化变得困难得多。编排工具可以使管理成千上万台计算机变得更简单，常见的编排工具包括\
  \ Kubernetes、Ansible、Puppet 和 Chef。\n\n让我们从讨论如何处理 Linux 进程开始本章。\n\n### 编排概念\n\n\
  启动能够通过单个按键将 Linux 安装到数百台计算机的编排系统的关键，在于其背后的工具。编排的基础包括创建新应用程序和工具的开发团队，与为终端用户提供解决方案的运营和生产团队共同工作。这统被称为\
  \ DevOps。\n\n\n\n\n\n通过 DevOps，开发和运维团队在实施和测试期间共同工作。绿线的长度和宽度在产品发布之前就得到了讨论和解决，使得产品能够更好地满足终端用户的预期。DevOps\
  \ 提供了持续集成和持续部署（CI/CD），从而实现了更快速且一致的结果。\n\nCI/CD 是软件开发生命周期（SDLC）的一部分。SDLC 由几个阶段组成，如下：\n\
  \n- 规划\n- 设计\n- 开发\n- 测试\n- 维护\n\n持续集成将开发和测试紧密地结合在一起，目标是减少进入测试阶段的漏洞。\n\n持续交付将测试和维护结合在一起，使应用程序能够很好地适应生产环境并与其他应用程序、网络和数据库交互。持续部署确保应用程序的更改不会对生产环境产生负面影响。\n\
  \n常用的 DevOps 协作产品已在表 17-1 中描述。\n\n![Images](img/f0574-01.jpg)\n\n**表 17-1** DevOps\
  \ 协作解决方案\n\n编排自动化了多个任务（实际上是整个 DevOps 过程）。例如，一家持续发布内容的在线电脑游戏设计公司。公司的部署可能包括安装和配置游戏\
  \ Web 服务器、设计和测试计算机应用程序服务器，以及开发和运行虚拟世界引擎。编排系统管理该过程的每一步。编排甚至处理了涉及操作系统和游戏架构混合的问题。部署系统可以是云端的也可以是本地的。\n\
  \n![Images](img/exam.jpg)\n\n**考试提示** Kubernetes 与第 18 章中讨论的 Docker 工作，在组织内一致地部署容器化操作系统。\n\
  \n自动化是单项任务，它自动构建基础设施。一系列此类自动化任务定义为`orchestration`，结合了安装、配置和补丁更新等各种任务。编排的一个示例是让游戏设计人员自动将应用程序安装到游戏服务器上，而配置任务则自动部署到用户。这些组合任务以及通过服务器和虚拟机为全球数千用户部署应用程序所需的其他任务，可以通过编排进行简化。\n\
  \n*构建自动化*工具侧重于将操作系统部署到许多计算机上。例如，SUSE Linux Enterprise Server 使用其`AutoYaST` 服务执行构建自动化，该服务在网络上对\
  \ SUSE 执行多次无人值的大规模部署。`AutoYaST` 包含了用于一致安装的安装和配置数据。\n\n自动化配置管理确保了系统的统一、有序和稳定，并最大限度地提高了生产力。自动化配置管理还与手动配置和安装相比，一致地衡量安全和服务水平协议（SLAs）。这导致了变更和配置管理系统的显著改进。\n\
  \n### 编排过程\n\n编排过程包括基于代理（agent-based）或无代理（agentless）的工具。这两类工具的区别在于应用程序存在于编排设备（即代理）上还是不存在（即无代理）。\n\
  \n编排步骤涉及设计特定的系统配置，并根据规范开发和测试解决方案。系统管理员设计配置并创建构建系统的定义文件。最后，根据定义构建并配置系统。\n\n广泛使用的\
  \ DevOps 过程产品已在表 17-2 中描述。\n\n![Images](img/f0575-01.jpg)\n\n**表 17-2** DevOps 过程解决方案\n\
  \n![Images](img/note.jpg)\n\n**注意** 网络编排发生在包含 `/etc/netplan/` 中的 YAML 文件中。例如，`01-netcfg.yaml`\
  \ 可以包含设置动态网络的规则。\n\n*基础设施即代码 (IaC)* 描述了主要使用脚本、代码和库来控制配置和部署的编排方法和工具。基础设施即代码意味着一个配置设计可以部署所需的基础设施以及其他所需的程序和服务。\n\
  \nC 工具读取用另一种标记标记语言 (YAML)、可扩展标记语言 (XML) 或 JavaScript 对象表示 (JSON) 编写的脚本。这些序列化语言使用名称结尾的后缀，例如\
  \ `file.yaml`、`file.xml` 或 `file.json`。`Terraform` 置备方案处理 JSON 文件以构建虚拟计算机*实例*，如下代码段所示：\n\
  \n```\n![Images](img/f0576-01.jpg)\n```\n\n`Ansible` 置备方案处理 YAML 文件以构建虚拟计算机实例，如下代码段所示：\n\
  \n```\n![Images](img/f0576-02.jpg)\n```\n\n某些置备方案与 XML 互相转换，因为 JSON 不允许注释。下面是一个\
  \ XML 代码段：\n\n```\n![Images](img/f0576-03.jpg)\n```\n\n编排任务由属性定义，由系统管理员设置属性，以根据硬盘大小和操作系统等确定应该安装哪些应用程序。提供\
  \ Ubuntu Linux 的 Canonical 创建了 `Juju`，这是一种开源建模工具，用于便于快速部署和配置应用程序。`Juju` 使用属性支持其“金属即服务”功能，根据磁盘空间或可用内存安装应用程序。\n\
  \n编排工具用于管理虚拟机、网络、应用程序、硬件、虚拟机监控程序、操作系统、软件许可等的清单。清单管理通过各种工具处理，例如 `SUSE Manager`，它可以管理清单、检查合规性并监控运行在\
  \ `Kubernetes` 中的容器是否存在漏洞。\n\n常用的 DevOps 清单产品已在表 17-3 中描述。\n\n![Images](img/f0577-01.jpg)\n\
  \n**表 17-3** DevOps 清单解决方案\n\n![Images](img/exam.jpg)\n\n**考试提示**识别 JSON、XML 和 YAML\
  \ 文件的结构。\n\n### Git 版本控制系统\n\nGit 是一个健壮的版本控制系统，旨在处理软件编程更改并为开发团队提供中心化存储。软件开发人员使用这个强大的系统实现代码管理、增强协作并实施版本控制。\n\
  \nGit 由启动 Linux 项目的同一个人 Linus Torvalds 创建，它引入了去中心化等特性，允许在互联网上的几台机器上存在多个版本。Git 取代了\
  \ `RCS`（版本控制系统）和 `CVS`（并发版本系统）等工具，这些工具是 UNIX 上流行的开发工具，但缺乏今天的安全需求。\n\n版本控制使用 `Git`\
  \ 仓库进行管理。中心化仓库的一个示例是 [`www.github.com`](https://www.github.com)上的 `GitHub` 项目，它管理着全球数百万开源项目。但使用\
  \ `GitHub` 并不是要求的；开发团队可以建立自己的、从本地计算机或跨越互联网的共享远程系统管理的 `Git` 仓库。\n\n对于 CompTIA Linux+\
  \ 考试，你必须熟悉以下概念：\n\n- 使用 Git\n- 与 Git 协作\n\n### 使用 Git\n\n根据 `Git` 手页，Git 是一个“愚蠢的内容跟踪器”，随后将其澄清为“快速、可扩展、分布式的版本控制系统”。Git\
  \ 的命令集分为高层的“瓷具”（porcelain）命令（即主要的版本控制命令）和为脚本设计的低层“水管”（plumbing）命令。一些常用的瓷具 Git 命令列在表\
  \ 17-4 中。\n\n```\n![Images](img/f0578-01.jpg)\n```\n\n\n\n\n\n## 表 17-4 Git 瓷化（Porcelain）命令及描述\n\
  \n对于偏好此类命令的管理员，在 `/usr/libexec/git-core/` 下提供了相应的“`git-dash`”命令，例如 `git-config`、`git-init`\
  \ 等。\n\n![Images](img/exam.jpg)\n\n考试提示：CompTIA Linux+ 考试中的 Git 要求重点在于 表 17-4 中列出的高级别瓷化命令。\n\
  \n在使用 `yum`、`zypper` 或 `apt-get` 安装 Git 后（取决于所使用的 Linux 专业版本），管理员可以快速创建一个本地项目，如下所示：\n\
  \n![Images](img/f0578-02.jpg)\n\n初始化新的 gitting 项目会在项目内创建一个 `.git/` 目录，该目录包含了项目所需的版本控制文件。在这种情况下，该目录存储在\
  \ `/home/heinrich/gitting/.git/`。列出 `.git/` 目录会显示以下文件：\n\n![Images](img/f0578-03.jpg)\n\
  \n![Images](img/f0579-01.jpg)\n\n随着项目在未来几天内的开发和修改，可以创建一个 `.gitignore` 文件，列出在任何提交操作期间忽略的文件。该文件由项目开发者编辑和维护，位于存储库的根目录下（例如\
  \ `~/gitting/.gitignore`）。继续示例，向项目添加一个 `project.txt` 文件：\n\n![Images](img/f0579-02.jpg)\n\
  \n此时，项目已进入暂存（staged）但尚未提交（committed），这从 `status` 消息的结果可以看出。\n\n使用 `git-config` 定义负责该仓库的个人。使用\
  \ `--global` 选项可以定义当前及未来仓库的用户，如下：\n\n![Images](img/f0579-03.jpg)\n\n修改项目后，您可以使用\
  \ `git-diff` 查看差异，如下：\n\n![Images](img/f0579-04.jpg)\n\n再次，更改更改此时阶段仅处于暂存状态。要完成更改，必须使用\
  \ `git-commit` 进行提交。使用 `-m` 选项可以直接应用 `commit` “消息”；否则，将打开编辑器以输入 `commit` 消息：\n\n\
  ![Images](img/f0579-05.jpg)\n\n查看最近交互的结果，运行 `git-log`。一个 40 位的提交 ID 将列出使用哪个 `git`\
  \ 来跟踪项目，如下：\n\n![Images](img/f0580-01.jpg)\n\n### 使用 Git 协作\n\n开发者可以从远程仓库下载或 `pull`\
  \ 一个新项目，例如 [`github.com`](https://github.com)、[`gitlab.com`](https://gitlab.com)、[`bitbucket.org`](https://bitbucket.org)、[`sourceforge.net`](https://sourceforge.net)、[`opendev.org`](https://opendev.org)\
  \ 或 [`launchpad.net`](https://launchpad.net)，并在开发者的本地仓库中进行进一步开发，如图 17-1](#ch17.xhtml_ch17fig1）所示。一旦开发者完成了此阶段的更改，他们可以将更改\
  \ `push` 回远程仓库。\n\n![Images](img/F17-01.jpg)\n\n图 17-1 Git 流程示例\n\n为了演示其工作原理，假设有一家名为\
  \ Trex, Inc. 的虚构公司，决定创建一个新的软件包，帮助作家们创作新的科幻作品。该 Trex 项目名为 `tribblers`，是一个托管在 [`sourceforge.net`](https://sourceforge.net)\
  \ 的开源程序。编程伙伴通过编写代码增强项目来改进 `tribblers`。合作伙伴通过通过将项目克隆（clone）到他们的系统中来下载 `tribblers`\
  \ 源代码的最新版本，如下：\n\n![Images](img/f0580-02.jpg)\n\n既然 `tribblers` 项目已从远程仓库克隆，，未来从仓库的下载将使用\
  \ `git pull` 请求完成，因为合作伙伴只需要更新，而不是整个项目。现在，开发者可以切换到本地仓库并查看文件，如下所示：\n\n![Images](img/f0581-01.jpg)\n\
  \n工作可以从当前的 `master` 分支继续，但在这种情况下，开发者希望改进 `tribblers` 代码，并在发布到当前版本之前对更改进行测试。为了做到这一点，开发者创建了一个名为\
  \ `alternate` 的新分支。在这里，他们可以执行更新而不影响当前项目。他们使用 `checkout` 函数切换分支，如下所示：\n\n![Images](img/f0581-02.jpg)\n\
  \n接下来是更新工作项目的示例。创建了一个新文件并添加到 `alternate` 分支。随后 `tribblers` 开发者返回到 `master` 分支，因为\
  \ `master` 分支没有任何更改，如下：\n\n![Images](img/f0581-03.jpg)\n\n`tribblers` 项目的工作可以从当前的\
  \ `master` 分支继续，但现在开发者发现了一个 bug 并开发了一个补丁来修复该问题。为了做到这一点，开发者创建了一个名为 `patch` 的新分支。在这里，开发者执行更改而不影响当前项目状态。他们使用\
  \ `checkout` 函数，使用 `-b` 创建 `patch` 分支并切换分支，如下：\n\n![Images](img/f0582-01.jpg)\n\n\
  补丁文件的一个示例是对 `new.c` 的修改。`new.c` 文件在 `patch` 分支内被更新并提交。`master` 分支未发生更改，如下：\n\n![Images](img/f0582-02.jpg)\n\
  \n现在补丁完成，开发者返回到 `master` 分支。假设补丁已经过彻底测试并批准，`tribblers` 开发团队现在可以将修复内容 `merge` 到 `master`\
  \ 分支，如下：\n\n![Images](img/f0582-03.jpg)\n\n现在是时候让更改对整个全球 `tribblers` 团队可用了。开发者将使用\
  \ `git-remote` 为远程仓库创建一个名为 `origin` 的快捷名称。接下来，他们将更改 `push` 回远程仓库，如下：\n\n![Images](img/f0582-04.jpg)\n\
  \n![Images](img/f0583-01.jpg)\n\n接下来，在练习 17-1 中练习使用 Git 仓库。\n\n## 练习 17-1：使用 Git\
  \ 仓库\n\n在此练习中，你将练习使用 `git` 命令管理运行在你系统上的本地仓库。请使用随书提供的虚拟机进行此练习。\n\n![Images](img/video.jpg)\n\
  \n视频：请观看练习 17-1 视频以演示如何执行此任务。\n\n完成以下步骤：\n\n1. 启动你的 Linux 系统并以标准用户登录。\n2. 打开终端会话。\n\
  3. 创建存储项目的目录，然后初始化 Git：\n\n![Images](img/f0583-02.jpg)\n4. 查看 Git 初始化过程创建的用于版本控制的文件：\n\
  \n![Images](img/f0583-03.jpg)\n5. 为项目创建一个文件并将其添加到仓库：\n\n![Images](img/f0583-04.jpg)\n\
  6. 查看项目状态，并注意此时它已处于暂存状态但尚未提交：\n\n![Images](img/f0583-05.jpg)\n7. 为此仓库定义用户和电子邮件地址，除非在全局配置文件中已预定义：\n\
  \n![Images](img/f0583-06.jpg)\n8. 修改文件并观察更改：\n\n![Images](img/f0583-07.jpg)\n9.\
  \ 虽然 `file1` 已修改，但此时仅处于暂存状态。在此提交更改到仓库：\n\n![Images](img/f0584-01.jpg)\n10. 查看修改的日志文件。Git\
  \ 使用提交 跟踪版本：\n\n![Images](img/f0584-02.jpg)\n\n### 章节总结\n\n编排工具允许系统管理员从单一管理点安装和配置数百台\
  \ Linux 系统。开发者使用应用程序和工具为操作和生产环境创建一致的结果。存在专门用于协作、操作、清单、调度和部署的工具。\n\n编排系统的核心是自动化，基础设施自动化确保了特定应用程序的一致部署。构建自动化专注于在多个服务器或客户端上进行有序且稳定的操作系统安装。\n\
  \n\n\n\n\n驻留在编排构建系统上的工具被视为代理工具（agent tools）；否则，它们被视为无代理工具（agentless tools）。\n\n\
  当使用 `YAML`、`JSON` 或 `XML` 代码来控制配置和部署时，该编排方法被视为基础设施即代码（infrastructure as code）。编排任务由系统管理员设置的属性定义，这些属性分析系统来确定其需求。\n\
  \n如果没有清单管理，编排将变得极其困难，因为对正确构建的需求一无所知。编排需要对虚拟机、网络、硬件等类型的知识以实现准确的部署。\n\n`Git` 是一种版本控制系统，旨在增强大型网络上的协作和版本控制。`Git`\
  \ 工具通过允许多个开发者对项目进行拉取（pull）、克隆（clone）、分支（branch）、添加（add）和提交（commit）更改，同时缓解竞态条件来实现。\n\
  \n熟悉以下关于编排的关键概念：\n\n*   编排系统使用 `YAML`、`XML`、`JSON` 等软件语言作为构建自动化的基础。\n*   最流行的编排系统被称为\
  \ `Kubernetes`。\n*   流行的持续集成/持续部署（CI/CD）工具是 `Jenkins`。\n*   流行的基础设施即代码（IaC）系统包括\
  \ `Ansible` 和 `Terraform`。\n*   要初始化本地 git 仓库，使用命令 `git init`。\n*   `~/<projectname>/.git`\
  \ 目录包含跟踪项目修订的文件和目录。\n*   `~/<projectname>/.gitignore` 文件列出了在提交操作期间忽略的文件。\n*   `git\
  \ add` 命令将文件置于暂存区（stage）。\n*   运行 `git status` 将显示仓库的当前状态。\n*   使用 `git config`\
  \ 设置仓库参数，如 `user.name` 和 `user.email`。\n*   要可视化项目差异，请运行 `git diff` 函数。\n*   使用\
  \ `git commit` 命令序列完成更改。\n*   要查看最近更改的历史，请运行 `git log`。\n*   使用 `git clone` 从远程仓库下载项目源代码。\n\
  *   开发者还可以使用 `git pull` 从远程仓库下载项目。\n*   使用 `git branch` 函数在不影响当前软件版本的情况下进行进一步开发。\n\
  *   要在新分支中工作，请运行 `git checkout` 命令。\n*   要将备分支与 master 合并，请运行 `git merge`。\n\n####\
