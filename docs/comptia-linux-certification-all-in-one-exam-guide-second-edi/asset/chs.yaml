  \ `file5`。\n\n### 本总结\n\n本章介绍了 Bash shell。涵盖了什么是 shell 以及如何使用各种设施自定义用户环境和 shell\
  \ 的运行参数。这里是一些重要要点：\n\n- shell 是用户界面、命令行解释器和脚本语言。\n- 进程是程序的单个实例。\n- 父进程可以派生子进程。\n\
  - 变量用于存储数据。\n- 变量只存在于创建它的进程中。\n- 环境变量从父进程复制到子进程。\n- shell 选项用于配置 shell 的运行方式。\n\
  - 程序启动时，可以使用配置文件来配置它们的运行方式。\n- Bash shell 有五个配置文件：`/etc/profile`、`/etc/bashrc`、`/home/<user_name>/.bash_profile`、`/home/<user_name>/.bashrc`\
  \ 和 `/home/<user_name>/.logout`。\n\n- `/etc/profile` 和 `/home/<user_name>/.bash_profile`\
  \ 在用户登录或执行需要登录的命令时被读取。\n\n\n\n\n\n* `/etc/bashrc` 和 `/home/<user_name>/.bashrc`\
  \ 在每次启动新进程时都会被读取。\n* `source` 或“点” (`.`) 命令用于将配置文件的更改读取到内存中。\n* 重定向允许用户修改 `stdin`、`stdout`\
  \ 或 `stderr` 设备或文件。\n\n### 问题\n\n**1.** 关于 shell 变量，下列陈述哪种是正确的？\n\n**A.** 在派生新进程时，变量将被复制。\n\
