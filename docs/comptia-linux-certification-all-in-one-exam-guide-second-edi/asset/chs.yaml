  \n### Web 界面\n\n你可以通过网络浏览器管理打印机。打开浏览器并输入 `http://localhost:631`（参见图 12-35）。这是 CUPS\
  \ Web 界面的端口。通过此界面，你可以管理所有的打印机功能。\n\n![Images](img/F12-35.jpg)\n\n**图 12-35** CUPS\
  \ Web 界面\n\n选择 `Printers`（打印机）选项卡将显示可用打印机。选择一个打印机将打开该打印机的管理窗口（参见图 12-36）。\n\n![Images](img/F12-36.jpg)\n\
  \n**图 12-36** 管理打印机的 Web 界面\n\n### 打印到打印机\n\n你可以使用 `lpr` 和 `lp` 命令向打印机打印。如果没有指定打印机，则将使用默认打印机。要确定默认打印机，请执行命令\
  \ `lpstat -d`。\n\n命令 `lp -d tty2printer /etc/hosts` 将将 `/etc/hosts` 文件打印到 `tty2printer`。当任务提交时，将显示一个任务\
  \ ID。任务 ID 由 `<printer_queue_name>-<job_id>` 组成（参见图 12-37）。\n\n![Images](img/F12-37.jpg)\n\
  \n**图 12-37** 打印任务的输出\n\n要打印到打印机类，请使用以下命令：\n\n![Images](img/f0392-03.jpg)\n\n###\
  \ 管理打印机和打印队列\n\n每当添加打印机或打印机类时，都会创建一个打印队列。队列名称与添加的打印机或打印机类相同。\n\n#### `cupsaccept`,\
  \ `cupsreject`, `cupsenable`, `cupsdisable`\n\n打印队列可以接受打印任务或拒绝打印任务。当它接受打印任务时，打印请求可能会进入队列并传递给打印机。当它拒绝打印任务时，提交的打印任务将接收到错误消息。拒绝打印任务的原因可能是打印机故障。\n\
  \n要拒绝某个打印队列的任务，请执行命令 `cupsreject <queue_name>`。要接受打印队列的任务，请执行命令 `cupsaccept <queue_name>`。一旦任务被缓存到队列中，它就会发送到打印机。\n\
  \n打印机处于启用或禁用状态。如果打印机已启用，则它将接受来自打印队列的打印任务。禁用的打印机不接受来自队列的任务。在这种情况下，打印任务将存储在队列中，直到打印机被启用或打印任务被移动到另一个队列。\n\
  \n要禁用打印机，请执行命令 `cupsdisable <printer_name>`。要启用打印机，请执行命令 `cupsenable <printer_name>`。\n\
  \n命令 `lpstat -p <printer_name>` 打印机状态。命令 `lpq -P <queue_name>` 打印队列状态。状态包括队列中持有的任何打印任务。命令\
  \ `lpstat -o` 显示所有打印任务，而 `lpstat -o <queue_name>` 显示特定队列的打印任务。\n\n在执行图 12-38 所示所示的命令之前，应用了以下条件：\n\
  \n![Images](img/F12-38.jpg)\n\n**图 12-38** 使用 `lpstat` 和 `lpq` 查看打印队列\n\n- 执行了 `cupsdisable\
  \ tty2printer` 和 `cupsdisable tty3printer` 命令来禁用打印机 `tty2printer` 和 `tty3printer`。\n\
  - 执行了 `lp -d tty2printer /etc/hosts` 和 `lp -d tty3printer /etc/hosts`。\n\n图 12-38\
  \ 第 1 行的 `lpstat -o` 命令显示所有队列中的打印任务。你可以通过执行命令 `lpstat -o <queue_name>`（第 5-9 行）查看特定队列中的任务。第\
  \ 11 行和 16 行的 `lpq` 命令（`lpq -P <queue_name>`）显示相应队列名称的状态和队列任务。\n\n#### 取消打印任务\n\n\
  `cancel` 命令用于取消打印任务。命令 `cancel <job_id>`（图 12-39 第 5 行）取消特定的打印任务。\n\n![Images](img/F12-39.jpg)\n\
  \n**图 12-39** 取消打印任务\n\n命令 `cancel <queue_name>`（第 10 行）取消队列中的所有任务。命令 `cancel -a`\
  \ 从所有队列中移除所有任务。\n\n#### `lpmove`\n\n`lpmove` 命令将打印任务从一个队列移动到另一个。在图 12-40 的第 2 行，你可以看到任务\
  \ 6 位于打印队列 `tty3printer` 中。命令 `lpmove <job_id> <printer_queue>` 将打印任务从一个队列移动到另一个。\n\
  \n![Images](img/F12-40.jpg)\n\n**图 12-40** 移动打印任务\n\n图 12-40 第 8 行和第 9 行的 `lpstat`\
  \ 输出表明两个打印任务都在 `tty2printer` 队列中。运行 `lpmove <old_print_queue> <new_print_queue>`\
  \ 将所有任务从旧打印队列移动到另一个。运行 `lpmove tty2printer tty3printer`（第 11 行）将 `tty2printer` 中的所有打印任务移动到\
  \ `tty3printer`（第 13-15 行）。\n\n#### 移除打印机或打印机类\n\n在移除打印机之前，你需要运行命令 `cupsdisable\
  \ <printer_name>` 来禁用打印机。然后通过执行命令 `cupsreject <queue_name>` 停止队列接受任何额外的打印任务。接下来，使用\
  \ `cancel` 或 `lpmove` 命令从当前队列移除所有任务。运行 `lpstat -o <queue_name>` 验证队列中没有剩余任务。通过执行命令\
  \ `lpadmin -x <printer_name>|<class_name>` 删除打印机或类。\n\n### 练习 12-3: 打印\n\n对于此练习，请以用户\
