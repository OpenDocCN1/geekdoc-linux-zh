  \ **A** 是正确的。`read` 命令用于暂停并并用户提供某种输入，然后赋值给指定的变量。\n\n![Images](img/wrong.jpg) **B**、**C**\
  \ 和 **D** 是错误的。`input`、`prompt` 和 `query` 命令不能读取用户输入，是干扰项。（领域 3\\. 脚本自动化）\n\n###\
  \ 27\n![Images](img/tick.jpg) **C** 是正确的。显示的错误是因为尝试运行脚本的用户没有设置执行权限。`chmod u+x runme.sh`\
