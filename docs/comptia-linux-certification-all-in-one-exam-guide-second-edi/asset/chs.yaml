  \ `cpytest` 从 `student1` 的家目录复制到 `root` 的家目录。\n\n36. 执行 `ls -l cpytest` 命令。注意由 `root`\
  \ 拥有该文件。\n\n37. 执行 `exit` 命令。\n\n38. 执行命令 `touch cpytest2` 并验证文件已创建。\n\n39. 执行 `alias\
  \ | grep cp` 命令。你应该能看到 `alias cp='cp -i'`。如果没有，执行命令 `alias cp='cp -i'`。\n\n40. 执行\
  \ `cp cpytest2 cpytest` 命令。你理会收到一个错误，因为 `-i` 选项不允许你覆盖现有文件。尝试使用反斜杠取消别名来重试命令：`\\cp\
  \ cpytest2 cpytest`。\n\n41. 执行 `ls -il cpytest2` 命令。注意并用纸笔记录下 inode 号。\n\n42. 执行\
  \ `mv cpytest2 mvtest1` 命令。\n\n43. 执行命令 `ls -il cpytest2 mvtest1` 以验证 `cpytest2`\
  \ 的名称已更改为 `mvtest1`。注意 inode 保持不变，因为它与你用纸笔记录的编号一致。\n\n44. 通过执行 `su` 命令并输入相应的密码将你的有效用户\
  \ ID 为用户 `root`。\n\n45. 执行 `mv ~student1/mvtest1 /etc` 命令。\n\n46. 执行 `ls -il ~student1/mvtest1`\
  \ 和 `ls -il /etc/mvtest1` 命令。注意文件不再存在于 `student1` 的家目录，且 inode 号已发生变化。在本书提供的虚拟机中，`/etc`\
  \ 与 `/home` 在不同的文件系统中，因此 `mv` 命令将文件复制到了新的文件系统并删除了 `/home/student1` 中的文件。\n\n# 在\
  \ Linux 文件系统中查找文件\n\nLinux 包含了在文件系统中搜索文件的实用程序。在本章的这部分，你将学习：\n\n* 使用 `find` 搜索文件\n\
  * 使用 `xargs` 从标准输入运行命令\n* 使用 `locate` 查找文件\n\n#### 使用 `find` 搜索文件\n\n`find` 工具是一个极佳的工具，可以通过暴力搜索来查找文件，而不是通过预分配的数据库进行搜索。`find`\
  \ 命令默认搜索是递归遍历目录，但可以使用 `-mindepth` 和 `-maxdepth` 选项进行限制（这两个选项都超出了本文范围）。\n\n要使用 `find`，只需在\
  \ shell 提示符下输入 `find <start_directory> <expression>`。`<start_directory>` 参数定义了搜索起点。你可以指定多个起始目录。如果不输入起始目录，则当前工作目录为起点。\n\
  \n`<expression>` 定义了要搜索的内容。若要在表达式中使用元字符——例如用 `*` 表示任意字符——必须将表达式括在引号中。例如，要在文件系统中查找所有名为\
  \ `core1`、`core2` 和 `core3` 的文件，运行命令 `find / -name 'core[123]'`。\n\n![Images](img/exam.jpg)\n\
  \n**考试技巧** 若要查找文件并在找到后将其显示在屏幕上，请使用 `-print` 选项。`-print` 选项是默认选项（以前不是），所以执行 `find\
  \ / -name 'core[123]'` 等于执行 `find / -name 'core[123]' -print`。\n\n[表 5-2] 展示了一些单单词的\
  \ `find` 表达式，但还有许多其他的。（更多信息请参阅 `find` 的 man 页面。）\n\n![Images](img/f0140-01.jpg)\n\
  \n**表 5-2** `find` 表达式\n\n`-size` 表达式根据大小搜索文件。例如，运行命令 `find -size 5M` 来查找恰好为 5MB\
  \ 的文件。运行命令 `find -size +5M` 查找大于 5MB 的文件。你也可以使用命令 `find -size +5M -size -10M` 来查找小于\
  \ 10MB 但大于 5MB 的文件。\n\n布尔运算符使用 `-a` 表示“与”，`-not` 表示“非”，或 `-o` 表示“或”来组合表达式。例如，执行命令\
  \ `find -name test -user student1` 或 `find -name test -a -user student1`，以找到所有由\
  \ `student1` 拥有且名为 `test` 的文件。\n\n你也可以对 `find` 的结果执行命令。`-exec` 和 `-ok` 这两个表达式接收\
  \ `find` 命令的标准输出并作为指定命令的标准输入。\n\n* `-exec`: 不经确认直接执行命令\n* `-ok`: 执行命令但需要用户确认\n\n\
  命令 `find /var/log -name \"*.log\" -exec ls -l {} \\;` 会查找 `/var/log` 中所有名为 `.log`\
  \ 的文件并自动执行 `ls -l`。命令 `find /var/log -name \"*.log\" -ok ls -l {} \\;` 会查找 `/var/log`\
  \ 中所有名为 `.log` 的文件，但在执行 `ls -l` 前需要用户确认。\n\n![Images](img/note.jpg)\n\n**注意** 大括号\
  \ `{ }` 用作 `find` 命令标准输出的占位符。该标准输出变为 `-exec` 或 `-ok` 执行的命令的标准输入。`\\;` 定义了命令的结束。\n\
  \n#### 使用 `xargs` 从标准输入运行命令\n\n`xargs` 命令用于读取空白分隔输入并对每个输入执行命令。空白分隔符是空格、制表符或换行符。通过演示其操作更容易解释\
  \ `xargs` 命令。\n\n在图 5-15 所示的示例中，我们获取 `echo` 命令的空格分隔输出并用它创建文件。回顾第 3 章，管道（|`）获取左侧命令的标准输出并将其变为右侧命令的标准输入。默认情况下，无名管道无法处理多个参数。在图\
  \ 5-15 中，无名管道右侧的 `echo` 命令产生以下内容：\n\n![Images](img/F05-15.jpg)\n\n**图 5-15** `xargs`\
  \ 示例\n\n![Images](img/f0141-01.jpg)\n\n管道将此输出传递给 `xargs`，`xargs` 每次将一个空白分隔的参数作为输入传递给\
  \ `touch` 命令。\n\n在图 5-16 中，我们扩展了 `xargs` 命令的使用。命令中的 `-I` 选项是一个字符串替换选项，而大括号是标准输入的占位符。\n\
  \n\n\n\n\n![Images](img/F05-16.jpg)\n\n**图 5-16** 使用 `xargs` 和 `mv` 的示例\n\n命令 `ls\
  \ file*` 的输出将以空格分隔的参数 `filea`、`fileb` 和 `filec` 提供给 `xargs`。`xargs` 命令将当前参数放置在占位符中（`-I\
  \ {}`）。然后它执行 `mv` 命令将当前文件名重命名为 `test.<filename>`。在我们的示例中，当 `xargs` 处理参数 `filea`\
  \ 时，它执行命令 `mv filea test.filea`。\n\n`xargs` 命令通常与 `find` 命令配合使用。在图 5-17 所示的示例中，我们通过管道\
  \ `xargs` 命令运行 `rm` 命令并删除命令列表。\n\n![Images](img/F05-17.jpg)\n\n**图 5-17** 使用 `xargs`\
  \ 和 `find` 的示例\n\n在图 5-18 所示的示例中，我们通过管道运行 `xargs` 命令并使用 `-p` 标记在执行之前打印命令。你必须确认命令执行（`y`）或停止命令执行（`n`\
  \ 或 `Ctrl-c`）。\n\n![Images](img/F05-18.jpg)\n\n**图 5-18** 使用 `find` 和 `xargs -p`\
  \ 的示例\n\n查阅 `find` 帮助页以了解更多关于 `find` 命令及其众多选项的信息。其他选项包括通过创建日期、修改日期、更改日期等查找文件。\n\n\
  #### 使用 `locate` 查找文件\n\n尽管 `locate` 命令*没有*包含在 CompTIA Linux+ 考试目标中，但它值得讨论。`locate`\
  \ 命令通过在预分配的数据库中查找文件名来查找文件。数据库（默认为 `/var/lib/mlocate/mlocate.db`）每天更新。`locate` 命令的输出列出文件的绝对路径。\n\
  \n### 使用 `updatedb` 手动更新 Locate \n\n可以使用 `updatedb` 命令更新 `mlocate.db` 文件。配置文件 `/etc/updatedb.conf`\
  \ 用于配置 `updatedb` 命令。\n\n文件 `/etc/updated.conf` 包含决定 `updatedb` 命令如何运行的变量（参见表 5-3）。\n\
  \n![Images](img/f0142-03.jpg)\n\n**表 5-3** `/etc/updatedb.conf` \n\n### 理解命令和优先级\n\
  \n尽管函数以及 `alias`、`which`、`whereis`、`hash` 和 `type` 命令*没有*包含在 CompTIA Linux+ 考试目标中，但它们值得讨论，因为\
  \ Linux 管理员经常使用它们。Linux 包含四种命令，我们将学习：\n\n* 创建别名 (aliases)\n* 创建和使用函数\n* 使用内置命令\n\
  * 使用外部命令\n\n*别名*和*函数*都加载到内存并从内存执行。*内置*和*外部*命令从文件中执行。\n\n让我们来看看不同的命令类型。\n\n### 创建别名\n\
  \n*别名*被描述为命令的快捷方式。例如，你不需要每次想要彩色输出时都输入 `ls --color=auto` 命令，你可以创建一个别名，这样每次你执行命令 `ls`\
  \ 时，都会执行命令 `ls -l --color=auto`。\n\n要创建别名，执行命令 `alias <alias_name>='<command>'`。在之前的示例中，命令\
  \ `alias ls='ls --color=auto'` 创建了一个 `ls` 别名，这样当运行 `ls` 时，它会产生彩色输出。要确定别名是否已创建，执行命令\
  \ `alias` 或 `alias <alias_name>`。图 5-19 显示了 `alias` 和 `unalias` 命令的工作原理。\n\n![Images](img/F05-19.jpg)\n\
  \n**图 5-19** 使用 `alias` 和 `unalias`\n\n![Images](img/note.jpg)\n\n**注意** 为了在每次登录时都能使用别名，请在\
  \ `~/.bashrc` 文件内部定义它们。\n\n要覆盖别名，请在别名名称前加一个反斜杠（`\\`）。反斜杠告诉 shell 忽略别名并使用字面命令。因此，运行\
  \ `\\ls` 将导致无颜色的文件列表。\n\n### 创建和使用函数\n\n*函数*是一组作为整体执行的命令列表，可以从其他程序调用。要在命令行上创建 Bash\
  \ 函数，输入函数名后跟左括号和右括号 `( )`。将函数命令括在左右大括号 `{ }` 之间，然后使用按键序列 `Ctrl-D` 完成函数。此序列将函数保存到内存中并退出创建该函数的进程。你可以在图\
  \ 5-20 中查看此过程。\n\n![Images](img/F05-20.jpg)\n\n**图 5-20** 创建函数\n\n函数仅存在于创建它的 shell\
  \ 中。因此，如果你希望函数在登录时可用，请确保在 `~/.bashrc` 中定义了该函数。\n\n要查看所有加载到内存的函数，请使用 `typeset -f`\
  \ 或 `declare -f` 命令。要从内存中删除函数，请使用 `unset <function_name>` 命令。\n\n### 使用内置命令\n\n\
  内置命令是作为 shell 的一部分执行的命令。要查看内置命令列表，执行 `help`、`compgen -b` 或查看 `builtin(1)` 帮助页。\n\
  \n在某些情况下，关键字代表内置命令。例如，`pwd` 命令既是内置命令也是外部命令。在这种情况下，执行 `/bin/pwd` 是外部命令。\n\n如果别名或函数与内置命令同名，由于别名的优先级高于内置命令，`builtin_name`\
  \ 将强制内置命令。要获取内置命令的帮助，执行 `help <builtin_command>`。\n\n### 使用外部命令\n\n外部命令是基于文件的命令。一旦\
  \ shell 查看了别名、函数和内置命令，将使用 `PATH` 来确定搜索位置（参见图 5-21）。shell 按照 `PATH` 中列出的顺序遍历目录。\n\
  \n![Images](img/F05-21.jpg)\n\n**图 5-21** `PATH` 变量设置\n\n根据图 5-21，首先搜索的目录是 `/usr/local/bin`，然后是\
  \ `/bin`，依此类推。Linux 默认不搜索本地目录命令。\n\n##### 哈希命令\n\n当你执行命令时，命令的绝对路径会存储在哈希表中。在 shell\
  \ 查找外部命令之前，它会查看哈希表以查看该命令是否执行过。\n\n哈希表包含命令的绝对路径以及执行的次数（命中）。`hash` 命令显示哈希表中的命令。`hash\
  \ -r` 清空哈希表。\n\n##### 使用 `type` 命令\n\n`type` 命令评估关键字并显示关键字将如何解释为命令。`type` 命令评估 shell\
  \ 关键字、别名、函数、内置和外部命令。\n\n`type <keyword>` 显示在命令行输入该命令时执行的命令类型。执行 `type -a` 显示可执行的关键字。\n\
  \n##### 使用 `which` 命令\n\n`which -a <keyword>` 命令列出与关键字相关的别名和外部命令，按优先级排序。`which <keyword>`\
  \ 显示（基于优先级）将执行别名还是外部命令。\n\n图 5-22 展示了为 `pwd` 关键字创建别名和函数的示例。注意 `which -a pwd` 命令和\
  \ `type -a pwd` 命令输出之间的差异。\n\n![Images](img/F05-22.jpg)\n\n**图 5-22** 比较 `which`\
  \ 和 `type` 命令\n\n\n\n\n\n在本练习中，练习使用 shell 命令在 Linux 文件系统中进行导航。对于此练习，请以用户 `student1`（密码为\
  \ `student1`）登录到书中提供的虚拟机。以下是需要遵循的步骤：\n\n![Images](img/video.jpg)\n\n**视频** 请观看练习\
  \ 5-3 的视频，演示如何执行此任务。\n\n1. 打开终端会话。\n2. 验证你是否处于用户 `student1` 的家目录下 (`pwd`)。如果不是，请执行\
  \ `cd ~` 命令。\n3. 使用 `mkdir finddir` 命令在你的家目录下创建一个名为 `finddir` 子目录。\n4. 使用命令 `ls\
  \ -ld finddir` 验证该目录已创建。\n5. 使用 `touch file{1,2,3}` 命令创建文件 `file1`、`file2` 和 `file3`。\n\
  6. 验证文件已创建。\n7. 执行以下命令：\n   - `find -name file1`\n   - `find -name file\"[12]\"\
  `\n   - `find -name \"file*\"`\n   - `find -name \"file[1-3]\" ! -user student1`\n\
  8. 执行 `locate file*` 命令。记住，locate 数据库 (`mlocate.db`) 每天更新一次。\n9. 通过执行命令 `su` 并按回车将你的有效用户\
  \ ID 更改为 `0`。当提示密码时，输入用户 `root` 的密码 (`password`)。通过执行命令 `whoami` 或 `id` 验证更改。\n\
  10. 执行命令 `updatedb -U ~student1 -o file.db` 为用户 `student1` 的家目录创建一个 locate 数据库。通过输入\
  \ `file ~student1/file.db` 命令验证文件是否存在。\n11. 输入 `exit` 返回用户 `student1`。\n12. 执行命令\
  \ `locate -d ~student1/file.db file1` 使用在用户 `student1` 家目录下创建的数据库定位 `file1`。\n13.\
  \ 执行以下命令：\n    - `find -name \"file[1-3]\" -exec ls -l {} \\;`\n    - `find -name\
  \ \"file[1-3]\" -ok ls -l {} \\;`\n    - `find -name \"file[1-3]\" | xargs ls -l`\n\
  \    - `find -name \"file[1-3]\" | xargs -p ls -l`\n14. 执行命令 `whereis -m passwd`\
  \ 确定关键词 `passwd` 有哪些 man 页。\n15. 使用命令 `whereis -b passwd` 查看与关键词 `passwd` 关联的二进制文件。\n\
  16. 通过创建别名 (`alias pwd='date'`) 让关键字 `pwd` 执行 `date` 命令。执行以下命令并注意并解释输出中的任何差异：\n\
  \    - `which pwd`\n    - `type pwd`\n    - `which -a pwd`\n    - `type -a pwd`\n\
  17. 执行 `unalias pwd` 命令。\n\n### 在文件中查找内容\n\n在本章稍些，我们讨论了可以用于在文件系统中搜索文件的 shell 命令。Linux\
  \ 还提供了几种实用程序来搜索文件内部的内容。在这里，我们将学习：\n- 使用 `grep` 在文件中进行搜索\n- 使用 `egrep` 在文件中进行搜索\n\
  \n#### 使用 `grep` 在文件中进行搜索\n\n`grep` 工具可用于搜索文件*内部*的特定内容。默认情况下，`grep` 显示找到字符串的行。\n\
  \n命令 `grep <option> <string>` 可用于在文件中搜索字符串。例如，图 5-23 所示所示命令 `grep student1 /etc/passwd`\
  \ 在 `/etc/passwd` 文件中搜索字符串 `student1`。如果找到了字符串，默认情况下 `grep` 将打印字符串所在的行。\n\n![Images](img/F05-23.jpg)\n\
  \n**图 5-23** `grep /etc/passwd` 的输出\n\n`grep` 工具还可以跨多个文件搜索文本字符串。命令 `grep student1\
  \ /etc/passwd /etc/shadow /etc/group` 在 `/etc/passwd`、`/etc/shadow` 和 `/etc/group`\
  \ 中搜索字符串 `student1`。\n\n为 `grep` 命令添加 `-n` 选项将显示找到字符串的行号。`grep` 的其他选项包括：\n- `-i`:\
  \ 搜索文本时忽略大小写\n- `-l`: 仅显示字符串出现的文件名\n- `-n`: 显示匹配的行号\n- `-r`: 递归搜索路径的子目录\n- `-v`:\
  \ 显示所有不包含搜索字符串的行\n\n`grep` 命令使用正则表达式来扩展其功能，详见表 5-4。\n\n![Images](img/f0148-01.jpg)\n\
  \n**表 5-4** `grep` 元字符\n\n#### 使用 `egrep` 在文件中进行搜索\n\n`egrep` 命令扩展了 `grep` 命令的功能。虽然\
  \ `egrep` 命令已被废用，但它仍然可用。替代命令是 `grep -E`，它使用标准 `grep` 不支持的元字符。表 5-5 说明了正则表达式中可用的额外元字符。\n\
  \n![Images](img/f0149-01.jpg)\n\n**表 5-5** `egrep` 元字符\n\n**注意** 曾经有一个名为 `fgrep`\
  \ 的快速版本 grep，旨在提高性能。快速 grep 通过减少功能获得速度。`fgrep` 命令未设计为使用 `*` 或 `?` 等元字符，因此它们被视为字面量。要比较功能，请运行\
  \ `grep -F`。\n\n#### 练习 5-4：使用 `grep`\n\n在本练习中，练习使用 Linux 搜索工具。以 `student1`（密码为\
  \ `student1`）登录到书中提供的虚拟机并遵循以下步骤：\n\n![Images](img/video.jpg)\n\n**视频** 请观看练习 5-4\
  \ 的视频，演示如何执行此任务。\n\n1. 要查看 `/etc/passwd`、`/etc/shadow` 和 `/etc/group` 文件包含字符串 `student1`\
  \ 的任何条目，执行以下命令：\n```\ngrep student1 /etc/passwd /etc/shadow /etc/group\n```\n2.\
  \ 通过执行以下命令为步骤 1 中的命令添加 `-n` 选项：\n```\ngrep -n student1 /etc/passwd /etc/shadow /etc/group\n\
  ```\n注意为输出增加了行号。\n3. 执行 `grep root /etc/passwd` 显示 `/etc/passwd` 文件中的 `root` 字符串行。\n\
  4. `/etc/passwd` 中记录的第一个字段是用户名。使用命令 `grep ^root /etc/passwd` 显示 `root` 的用户记录。\n\
  5. `/etc/passwd` 文件中用户账户的最后一个字段包含其默认 shell 的绝对路径。使用命令 `grep bash$ /etc/passwd` 显示所有默认\
  \ shell 为 `bash` 的用户。\n6. 执行 `grep roo* /etc/passwd` 和 `grep ro\\.` 命令。解释输出中的差异。\n\
  7. 使用命令 `egrep o{2} /etc/passwd` 或命令 `grep -E o{2} /etc/passwd` 显示任何包含两个连续小写 `o`\
  \ 的字符串。\n8. 使用命令 `egrep 'root|Root'` 显示 `/etc/passwd` 中用户 `root` 或 `Root` 的用户记录。\n\
  \n#### 本章总结\n\n在本章中，我们讨论了 Linux 文件系统的作用，以及文件系统层次结构标准 (FHS) 中指定的典型 Linux 系统使用的各种标准目录的作用。我们还讨论了用于管理文件的命令。文件系统的作用是存储和组织数据，以便于地定位和检索。\n\
  \n- `file` 命令显示文件中存储的内容类型。\n- Linux 使用分层结构的文件系统。\n- Linux 文件系统层次结构基于文件系统层次结构标准 (FHS)。\n\
  - 最顶目录是 `/`（读作 slash）。\n- 其他标准目录创建在 `/` 之下并履行 FHS 中定义的函数：\n  - `/bin`\n  - `/boot`\n\
  \  - `/dev`\n  - `/etc`\n  - `/home`\n  - `/lib`\n  - `/sbin`\n  - `/tmp`\n  - `/usr`\n\
  \  - `/var`\n- `pwd` 命令用于显示当前工作目录。\n- `cd` 命令用于更改目录。\n- `ls` 命令用于显示目录内容。\n- 使用带有\
  \ `-l` 选项的 `ls` 显示文件和目录的属性。\n\n\n\n\n\n- 使用 `ls` 配合 `-R` 选项可以递归显示目录内容。\n- `touch`\
  \ 命令用于创建新文件或更改现有文件的修改时间戳。\n- `mkdir` 命令用于创建新目录。\n- 使用 `cat` 在屏幕上查看文本文件。\n- 使用 `less`\
  \ 或 `more` 在屏幕上查看文本文件。\n- `less` 或 `more` 命令会按一次一行的方式暂停显示。\n- `head` 命令可以显示文本文件的前几行。\n\
  - `tail` 命令可以显示文本文件的最后几行。\n- `tail` 命令可以配合 `-f` 选项来监控文本文件的变化。\n- 你可以使用 `rmdir` 来删除一个空目录。\n\
  - 你可以使用 `rm -r` 删除一个包含内容的目录。\n- 你可以使用 `rm` 删除文件。\n- `cp` 命令用于复制文件。\n- `mv` 命令用于移动或重命名文件。\n\
  - `ln` 命令允许你创建指向文件系统系统中其他文件或目录的链接文件。\n- 硬链接通过 `ln` 创建，直接指向另一个文件的 inode。\n- 软链接通过\
  \ `ln -s` 创建，拥有自己的 inode，并指向文件名。\n- `find` 实用通过手动遍历文件系统层次结构来搜索文件。\n- `locate` 实用维护一个所有文件的数据库。\n\
  - `which` 命令显示与关键词关联的别名和外部命令。\n- `whereis` 命令显示与关键词相关的源文件、外部命令和帮助页（man pages）的位置。\n\
  - 使用 `grep` 在文件内搜索文本。\n\n### Questions\n\n**1.** 哪个目录包含启动配置文件？\n**A.** `/bin`\n\
  **B.** `/dev`\n**C.** `/etc`\n**D.** `/boot`\n\n**2.** 哪个命令会创建一个与文件 `filea` 相同 inode\
  \ 的文件？\n**A.** `cat < filea > fileb`\n**B.** `ln -s filea fileb`\n**C.** `ln filea\
  \ fileb`\n**D.** `ln -s fileb filea`\n\n**3.** 哪个命令可以显示有多少文件与 `filea` 共享相同的 inode？\n\
