- pgno: 67
  md: '# I/O Redirection


    It is also the shell''s responsibility to take care of input and output redirection.
    It scans each entered command line for occurrences of the special redirection
    characters <, >, or >> (in case you''re curious, there is a << redirection sequence,
    as you''ll learn in Chapter 12).


    When you type the command


    ```

    echo Remember to record The Walking Dead > reminder

    ```


    the shell recognizes the special output character > and takes the next word on
    the command line as the name of the file to which the output should be redirected.
    In this case, the file is called reminder. If reminder already exists and you
    have write access, the previous contents are overwritten. If you don''t have access
    to the file or its directory, the shell will produce an error message.


    Before the shell starts execution of the desired program, it redirects the standard
    output of the program to the indicated file. In almost every case, the program
    never knows that its output is being redirected. It goes on its merry way to writing
    output (which is normally your terminal, you recall), unaware that the shell has
    redirected information to a file.


    Let''s take another look at two nearly identical commands:


    ```

    $ wc -1 users

    5

    $ wc -1 users

    5

    ```


    In the first case, the shell passes the command line and determines the name of
    the program to execute is wc and passes it two arguments: -1 and users (see Figure
    2.12).


    ![](img/dc544c8aef1333b25eff1c794c2e5ec2_67_0.png)


    Figure 2.12 Execution of wc -1 users


    When wc begins execution, it sees that it was passed the two arguments. The first,
    -1, tells it to count the number of lines. The second argument specifies the name
    of the file whose lines are to be counted. So wc opens the file users, counts
    its lines, and prints the resultant count along with the filename.


    Operation of wc in the second case is slightly different. The shell spots the
    redirection character < when it scans the command line. The word is therefore
    interpreted as the name of the file from which input is to be redirected. Having
    "gobbled up" the < users from the command line, the shell then starts execution
    of the wc program, redirecting its standard input from the file users and passing
    it the single argument -1 (see Figure 2.13).'
  merge: -1
  img_proc: true
