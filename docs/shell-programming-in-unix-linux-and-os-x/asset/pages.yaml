  img_proc: true
- pgno: 274
  md: '# 12


    # Loose Ends


    We''ve put commands and features into this chapter that did not fit into earlier
    chapters. There''s no particular rationale for their order of presentation, so
    this is your chance to simply expand your knowledge of shell programming tricks
    and techniques.


    # The eval Command


    This section describes one of the more unusual shell commands: `eval`. Its format
    is as follows:

    `eval command-line`


    where `command-line` is a normal line that you would type at the terminal. When
    you put eval in front of it, however, the effect is that the shell scans the command
    line twice before executing it, which can be very useful if the script is building
    a command that needs to be invoked, among other purposes.


    For the simple case, using eval seems to have no effect:


    ```

    $ eval echo hello

    hello

    $

    ```


    But consider the following example without the eval:


    ```

    $ pipe="*"

    $ ls pipe wc -1

    : No such file or directory

    wc: No such file or directory

    -1: No such file or directory

    $

    ```


    Those ls errors are because the value of pipe and the subsequent call to wc -1
    are all interpreted as command arguments. The shell takes care of pipes and I/O
    redirection before variable substitution, so it never properly interprets the
    pipe symbol inside pipe.


    Putting eval in front of the command sequence gives the desired results, however:'
  merge: -1
  img_proc: true
- pgno: 275
  md: '# Chapter 12 Loose Ends


    ```

    $ eval $1$pipe wc -1

    16

    ```


    The first time the shell scans the command, it substitutes | as the value of pipe.
    Then eval causes it to rescan the line, at which point the | is recognized by
    the shell as the pipe symbol and everything proceeds as desired.


    The eval command is frequently used in shell programs that build up command lines
    one or more variables. If the variables contain any characters that must be interpreted
    by the shell, eval is essential. Command terminator (;, |), I/O redirection (<,
    >), and quote characters are characters that appear directly on the command line
    or have special meaning to the shell.


    For the next example, consider the program last whose purpose is to display the
    last argument passed to it. Recall the my program from Chapter 9 where we accomplished
    this task by shifting all the arguments until one was left.


    It turns out you can accomplish the same result by using eval:


    ```

    $ cat last

    echo echo \$\$

    $ last one two three

    four

    $ last *

    zoo_report

    $

    ```


    > Get the last file


    The first time the shell scans


    ```

    echo \$\#

    ```


    the backslash tells it to ignore the $ that immediately follows. After that, it
    encounters the special parameter #$, so it substitutes its value on the command
    line. The command now looks this:


    ```

    echo $4

    ```


    The backslash is removed after the first scan. When the shell rescans the line,
    it substitutes the value of $4 and then executes echo.


    This same technique could be used if you had a variable arg that contained a digit,
    for example, and you wanted to display the positional parameter referenced by
    arg. You could simply write


    ```

    eval \$\arg

    ```


    The only problem with this approach is that only the first nine positional parameters
    can be accessed this way because accessing positional parameters 10 and above
    requires the $ (n) notation. So here''s a second attempt:


    ```

    eval echo \${arg}

    ```'
  merge: -1
  img_proc: true
- pgno: 276
  md: "# The wait Command\n\nThe eval command can also be used to effectively create\
    \ “pointers” to variables:\n\n```\n$ x=100\n$ ptrx=x\n$ echo \\$ptrx\n100\n$ eval\
    \ $ptrx=50\n$ echo $x\n50\n$\n```\n\nDereference ptrx\nStore 50 in var ptrx points\
    \ to\nSee what happened\n\n# The wait Command\n\nIf you move a command into the\
    \ background for execution, command line runs in a subshell independent of your\
    \ current shell (the job is said asynchronously). In some situations, you may\
    \ want to wait for the background process (also known as a child process because\
    \ it is spawned from your current shell—the parent) to finish execution proceeding.\
    \ For example, you may have sent a large sort into the background and need to\
    \ wait for it to finish before you access the sorted data.\n\nThe wait command\
    \ does its general format\n\n```\nwait process-id\n```\n\nwhere process-id is\
    \ the ID of the process you want to complete. If the process ID is omitted, the\
    \ shell waits for all processes to complete execution. Execution of your current\
    \ shell will be suspended until the process or processes finish execution.\n\n\
    You can wait the command at your terminal:\n\n+   $ sort big-data > sorted_data\
    \ &\n  [1] 3423\n$ date\nWed Oct 2 15:05:42 EDT 2002\n$ wait 3423\n\nSend it to\
    \ the background\nJob number & process id from the shell\nDo some other work\n\
    \nWait for the sort to finish\nWhen sort finishes, prompt is returned\n\n# The\
    \ $ Variable\n\nIf you have only one process running in the background, the wait\
    \ with no argument suffices. However, if you're running more than one background\
    \ command and you want to wait on the most recently launched, you can access the\
    \ process ID of the most recent background command as the special variable $!.\
    \ So the command command\n\n```\nwait $!\n```"
  merge: -1
  img_proc: true
- pgno: 277
  md: 'Chapter 12 Loose Ends


    waits for the last process sent to the background to complete execution. With
    some

    intermediate variables involved, you can also save their process ID values for
    later access too:


    ```

    prog1 &\npid1=$$

    ...

    prog2 &\npid2=$$

