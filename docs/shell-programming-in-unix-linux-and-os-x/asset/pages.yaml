    shell, Bash with the features described in this chapter. In this table, an “X”
    denotes a supported feature, “UP,” an optional feature in the POSIX shell (these
    are also known as “User Portability” features in the POSIX shell specification),
    and “POS” a feature supported only by Bash when it is invoked with the name sh
    or with the --posix command-line option, or after set -o posix is executed.'
