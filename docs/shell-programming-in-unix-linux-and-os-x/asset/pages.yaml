    There are characters other than * that have a special meaning to the shell and
    must be quoted when used in a pattern. The whole topic of how quotes are handled
    by the shell is admittedly tricky; an entire chapter—Chapter 5—is devoted to it.


    grep takes its input from standard input if no filename is specified. So you can
    use grep as part of a pipe to scan the output of a command for lines that match
    a specific pattern. Suppose that you want to find out the user jim is logged in.
    You can use grep to search through jim''s output:


    ```

    $ who | grep jim

    j tty16 Feb 20 10:25

    $

    ```


    Note that by not specifying a search, grep automatically scans standard input.
    Naturally, if the user jim was not logged in, you would get a new command prompt
    without any preceding output:


    ```

    $ who | grep jim

    $

    ```


    # Regular Expressions and grep


    Let''s take another look at the intro file:


    ```

    $ cat intro

    ```


    The UNIX operating system was pioneered by Ken Thompson and Dennis Ritchie at
    Bell Laboratories in the late 1960s. One of the primary goals in the design of
    the UNIX system was to create an environment that promoted efficient program development.


    grep allows you to specify your pattern using regular expressions as in ed. Given
    this information, it means that you can specify the pattern


    to have search for either a lower- or uppercase T followed by the characters he.

    Here to use grep to list all the lines containing the characters he or The:


    ```

    $ grep ''[tT]he'' intro

    ```


    The UNIX operating system was pioneered by Ken

    in the late 1960s. One of the primary goals in the design of the UNIX system was
    to create an

    $


    A smarter alternative may be to utilize the -i option to grep which makes patterns
    insensitive. That is, the command


    ```

    grep -i ''the'' intro

    ```'
  merge: -1
  img_proc: true
- pgno: 101
  md: '82 Chapter 3 Tools of the Trade


    tells grep to ignore the difference between upper and lowercase when matching
    the pattern against the lines in intro. Therefore, lines containing the or Or
    will be printed, as will lines containing THE, THE, tHE, and so on.


    Table 3.5 shows other types of regular expressions that you can specify to grep
    and the types of patterns they''ll match.


    # Table 3.5 Some grep Examples


    | Command | Prints |

    | --- | --- |

    | grep ''[A-Z]'' list | Lines from list containing a capital letter |

    | grep ''[0-9]'' data | Lines from data containing a digit |

    | grep ''[A-Z],...[0-9]'' list | Lines from lines containing five-character patterns
    that start with a capital letter and end with a digit |

    | grep ''\.pic$'' filelist | Lines from fileelist that end with .pic |


    # The -v Option


    Sometimes you''re interested in finding the lines that contain a specified pattern,
    but those don''t. That''s what the -v option does for grep: reverse the logic
    of the matching task. In the example, grep is used to find all the lines in intro
    that don''t contain the pattern UNIX.


    ```

    $ grep -v ''UNIX'' intro

    Print all lines that do not contain UNIX

    Thompson and Dennis Ritchie at Bell Laboratories

    in the late 1960s. One of the primary goals in

    environment that promoted efficient program

    development.

    $

    ```


    # The -1 Option


    At times, you may not want to see the actual lines that match a pattern but just
    seek the names of the files that contain the pattern. For example, you have a
    set of C programs in your current directory (by convention, filenames end with
    the suffix .c), and you want to know which variable a called Move_history. Here
    is one way of finding the answer:


    ```

    $ grep ''Move_history'' *c

    Find Move_history in C source files

    exec.c:MOVE cpmove(&Move_history[200] = {0});nexec.c:cpmove(&Move_history[Number_half_moves
    -1],

    exec.c:undo_move(&Move_history[Number_half_moves-1],);

    exec.c:cpymove(&last_move, &Move_history[Number_half_moves]);

    exec.c:convert_move(&Move_history[Number_half_moves-1]),

    exec.c:convert_move(&Move_history[i-1]),

    ```'
  merge: -1
