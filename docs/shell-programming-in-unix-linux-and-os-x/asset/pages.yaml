    then\n    grep -v \"$name\" phonebook > /tmp/phonebook\n    mv /tmp/phonebook\n\
    else\n    echo \"I couldn't find $name in the phone book\"\n```\n\nTo improve\
    \ readability, the positional parameter $1 is assigned to the variable name after\
    \ the\nnumber of arguments is checked.\n\nAssigning the output of a command sequence\
    \ to a variable is very common in shell programs,\ndemonstrated on the line\n\n\
    ```\nmatches=$(grep \"$name\" phonebook | wc -1)\n```\n\nWith matches calculated,\
    \ it's easy to step through the if...elif...else command sequence\nand that it\
    \ first tests to see whether the number of matches is greater than one. If it\
    \ is, the"
