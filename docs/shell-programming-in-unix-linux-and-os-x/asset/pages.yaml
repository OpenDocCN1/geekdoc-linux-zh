- pgno: 20
  md: '# Introduction


    It''s no secret that the family of Unix and Unix-like operating systems have emerged
    over the last few decades as the most pervasive, most widely used group of operating
    systems in computing today. For programmers who have been using Unix for many
    years, this came as no surprise: The Unix system provides an elegant and efficient
    environment for program development. That''s exactly what Dennis Ritchie and Ken
    Thompson sought to create when they developed Unix at Bell Laboratories back in
    the late 1960s.


    > Note

    Throughout this book we''ll use the term Unix to refer generically to the broad
    family of Unix-based operating systems, true Unix operating systems as Solaris
    as well as Unix-like operating systems such as Linux and Mac OS X.


    One of the strongest features of the Unix system is its wide collection of programs.
    More than 200 basic commands are distributed with the standard operating system
    and Linux adds to it, often shipping with 700-1000 standard commands! These commands
    (also known as tools) do everything from counting the number of lines in a file,
    to sending electronic mail, to displaying a calendar for any desired year.


    But the real strength of the Unix system comes not from its large collection of
    commands but from the elegance and ease with which these commands can be combined
    to perform far more sophisticated tasks.


    The standard user interface to Unix is the command line, which actually turns
    out to be a shell, a program that acts as a buffer between the user and the lowest
    levels of the system (the kernel). The shell is simply a program that reads the
    commands you type and converts them into a form easily understood by the system.
    It also includes programming constructs that let you make decisions, loop, and
    store values in variables.


    The standard shell distributed with Unix derives from AT&T''s distribution, which
    evolved from a version originally written by Stephen Bourne at Bell Labs. Since
    then, the IEEE has created standards based on the Bourne shell and all other recent
    shells. The current version of this standard, as of this writing, is the Shell
    and Utilities volume of IEEE Std 1003.1-2001, also known as the POSIX standard.
    This shell is what we use for the basis for the rest of this book.


    The examples in this book were tested on a Mac running OS X 10.11'
  merge: -1
  img_proc: true
- pgno: 21
  md: "# Introduction\n\nexception of some Bash examples in Chapter 14, were run using\
    \ the Korn shell, although all of\nthem also work fine in Bash.\n\nBecause the\
    \ shell offers an interpreted programming language, programs can be written, modified,\n\
    and debugged quickly and easily. We turn to the shell as our first choice of programming\n\
    language and after you become adept at shell programming, you will too.\n\n# How\
    \ This Book Is Organized\n\nThis book assumes that you are familiar with the fundamentals\
    \ of the system and command\nline; that is, you know how to log in; how to create\
    \ files, edit, and remove them;\nhow to work with directories. In case you've\
    \ used the Linux or Unix system for a while,\nwe'll explain the basics in Chapter\
    \ 1, \"A Quick Review of the Basics.\" In addition,\nfilename shell, I/O redirection\
    \ and pipes are also revealed in the first chapter.\n\nChapter 2, \"What is the\
    \ Shell,\" reveals what it is, how it works, and how it ends\nout your primary\
    \ method of interacting with the operating system itself. You'll learn\nout happens\
    \ every time you log in to the system, how the shell program starts,\nhow it parses\
    \ the command line, and how it executes other programs for you. A key point\n\
    made in Chapter 2 is that the shell is just another program; nothing, nothing\
    \ less.\n\nChapter 3, \"Tools of the Trade,\" provides tutorials on tools useful\
    \ in writing shell programs.\ned in this chapter are cut, paste, sed, grep, sort,\
    \ tr, and uniq. Admittedly, the\\selection is subjective, but it also set the\
    \ stage for programs that we'll develop throughout the\remainder of the book.\
    \ Also in Chapter 3 is a detailed description of regular expressions, which\n\
    are used by many Unix commands, as sed, grep, and ed.\n\nChapters 4 through 9\
    \ teach you how to put the shell to work for writing programs. You'll\nlearn how\
    \ to write your own commands; use variables; write programs that accept arguments;\n\
    make decisions; use the shell's for, while, and looping commands; and how the\
    \ read\ndata from the terminal or from file. Chapter 5, \"Can I Quote you on\n\
    That,\" is devoted entirely to a discussion of one of the most intriguing (and\
    \ confusing)\naspects of the shell: the way it interprets\n\nBy that point in\
    \ the book, all the basic programming constructs in the shell will have been\n\
    covered, and you will be able to write shell programs to solve your problems.\n\
    \nChapter 10, \"Your Environment,\" covers a topic of great importance for a real\n\
    of the shell the environment. You'll learn about local and exported variables;\n\
    sshells; special shell variables, as HOME, PATH, and CDPATH; and how to set up\n\
    your profile file.\n\nChapter 11, \"More on Parameters,\" and Chapter 12, \"Loose\
    \ Ends,\" tie up some loose ends, and\nChapter 13, \"Rolo Revisited,\" presents\
    \ a final version of the phone directory program called\nrolo that is developed\
    \ throughout the book."
  merge: -1
