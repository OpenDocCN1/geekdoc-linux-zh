  img_proc: true
- pgno: 125
  md: '# Chapter 5 Can I Quote You on That?


    Look what happens when you look up Susan:


    ```

    $ grep Susan phonebook

    Susan Goldberg 201-555-7776

    Susan Topple 212-555-4932

    $

    ```


    There are two Susan in the datafile, hence the two lines of output—but suppose
    you only wanted Susan Goldberg''s information. In this case, you could specify
    the last name as well:


    ```

    $ grep Susan Goldberg phonebook

    grep: can''t open Goldberg

    Susan Goldberg 201-555-7776

    Susan Topple 212-555-4932

    $

    ```


    But that''s not going to work, as you can see.


    Why? Because shell uses whitespace characters to separate the command arguments,
    the preceding command line results in grep being passed three arguments: Susan,
    Goldberg, and phonebook (see Figure 5.1).


    | | arguments |

    |---|---|

    | grep | Susan Goldberg phonebook |


    Figure 5.1 grep Susan Goldberg phonebook


    When grep is executed, it interprets the first argument as the search pattern
    and the remaining arguments as the names of files to search. In this case, grep
    thinks it should look for Susan in the files Goldberg and phonebook. It tries
    to open the file Goldberg, can''t find it, and issues the error message:


    ```

    grep: can''t open Goldberg

    ```


    Then it goes to the next file, phonebook, opens it, searches for the pattern Susan,
    and prints the two matching lines. Quite logical, really.


    The problem is really about how to pass arguments that include whitespace characters
    to programs.


    The solution: enclose the entire argument inside a pair of single quotes, as in


    ```

    grep ''Susan Goldberg'' phonebook

    ```


    When the shell sees the first quote, it ignores any special characters until it
    finds the matching quote.


    ```

    $ grep ''Susan Goldberg'' phonebook

    Susan Goldberg 201-555-7776

    $

    ```'
