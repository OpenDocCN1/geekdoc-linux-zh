- pgno: 172
  md: "# The case Command 153\n\n“more one match” message is printed. If it’s not,\
    \ a test is made to see whether the number of matches is equal to one. If it is,\
    \ the entry is removed from the phone book. If it’s not one or greater than one,\
    \ the number of matches must be zero, in which case a message is displayed to\
    \ the alert to this fact.\n\nNote that the grep command is used twice in this\
    \ program: first to determine the number of matches, then with the -v option to\
    \ remove the matching entry after ensuring that only one line matches.\n\nHere\
    \ are some sample runs of this version of rem:\n\n```\n$ rem\nIncorrect number\
    \ of arguments.\nUsage: rem name\n$ rem Susan\nMore than one match; please qualify\
    \ further\n$ rem 'Susan Toppler'\n$ rem 'Susan Toppler'\nI couldn't find Susan\
    \ Toppler in the phone book She's history\n$\n```\n\nNow you have a fairly robust\
    \ rem program: it checks for the number of arguments, printing the proper use\
    \ if the entry is not supplied; it also checks to make sure that precisely one\
    \ entry is removed from the phonebook file.\n\nIn Unix fashion, also note that\
    \ the rem script has no output when the requested action succeeds.\n\n# The case\
    \ Command\n\nThe case command allows you to compare a single value against a set\
    \ of other values or expressions to execute one or more commands when a match\
    \ is found. The general format of this command is\n\n```\ncase value in\n    command\n\
    pattern,)\n    command\n    ..\n    command;\npattern,)\n    command\n    ..\n\
    \    command;\npattern_)\n    command\n    ..\n    command;\nesac\n```"
  merge: -1
  img_proc: true
- pgno: 173
  md: "# Chapter 7 Decisions, Decisions\n\nThe word value is successively compared\
    \ against the values pattern, pattern, ..., pattern, until a match is found. When\
    \ a match is found, the commands listed after the matching value are executed,\
    \ up to the double semicolons, which serve as a “break” statement that shows you've\
    \ finished specifying commands for that particular conditional. After the double\
    \ semicolon are reached, the execution of the case is terminated. If a match is\
    \ not found, none of the commands are executed.\n\nAs an example of the use of\
    \ the case statement, the following program called number takes a single digit\
    \ and translates it to its English equivalent:\n\n```\n$ cat number\n#\n# Translate\
    \ a digit to English\n#\nif [ \"$# -ne 1 ]\nthen\n  echo \"Usage: number digit\"\
    \n  exit 1\nfi\n\ncase \"$1\"\nin\n  0) echo zero;\n  1) echo one;\n  2) echo\
    \ two;\n  3) echo three;\n  4) echo four;\n  5) echo five;\n  6) echo six;\n \
    \ 7) echo seven;\n  8) echo eight;\n  9) echo nine;\nesac $\n```\n\nNow to test\
    \ it:\n\n```\n$ number 0\nzero\n$ number 3\ntree\n$ number\nUsage: number digit\n\
    $ number 17\n$\n```\n\nTry no arguments\n\nTry a two-digit number\n\nThe last\
    \ case shows what happens when you type in more than one digit: $1 doesn't match\
    \ any of the values listed in the case, so none of the echo commands are executed."
  merge: -1
  img_proc: true
- pgno: 174
  md: "# The case Command\n\n# Special Pattern-Matching Characters\n\nThe case statement\
    \ is quite powerful because of just specifying sequences of letters, you can create\
    \ complex regular expressions in the shell notation. That is, you can use the\
    \ same special characters for specifying the patterns in a case as with filename\
    \ substitution. For example, ? can be used to specify any single character; *\
    \ can be used to specify zero or more occurrences of any character, and [...]\
    \ can be used to specify any single character enclosed between the brackets.\n\
    \nBecause the * matches anything (just like how echo * matches files in the current\
    \ directory), it's frequently used at the end of the case as the \"catch-all\"\
    \ or default value: if none of the previous values in the case, this one is guaranteed\
    \ to be a match.\n\nWith that in mind, here's a second version of the number program\
    \ that has such a catch-all statement.\n\n```\n$ cat number\n# Translate a digit\
    \ to English version 2\n#\nif [ \"$*\" -ne 1 ];\nthen\n    echo \"Usage: number\
    \ digit\"\n    exit 1\nfi\n```\n\n```\ncase \"$1*\"\nin\n    0) echo zero;\n \
    \   1) echo one;\n    2) echo two;\n    3) echo three;\n    4) echo four;\n  \
    \  5) echo five;\n    6) echo six;\n    7) echo seven;\n    8) echo eight;\n \
    \   9) echo nine;\n    *) echo \"Bad argument; please specify a single digit\"\
    ;\nesac\n```\n\n```\n$ number 9\nine\n$ number 99\nBad argument; please specify\
    \ a single digit\n$\n```\n\nLet's switch to another program, ctype, that identifies\
    \ and prints the class of the single character given as an argument. Character\
    \ types recognized are digits, uppercase letters,"
  merge: -1
  img_proc: true
