- pgno: 269
  md: "# Chapter 11. More on Parameters\n\nWith the addition of a while loop and some\
    \ integer arithmetic, the words program can now be modified to count the total\
    \ number of words from standard input, essentially offering your own version of\
    \ wc -w:\n\n```\n$ cat words\n#\n# Count all of the words on standard input\n\n\
    count=0\nwhile read line\ndo\n    set -- $line\n    count=$(( count + $# ))\n\
    ndone\n```\n\nAfter each line is read, the set command assigns all the positional\
    \ parameters to the new line of information, which resets $$ to the number of\
    \ words on the line. The - option is included in any case of the lines begins\
    \ with a - or is blank or lacks alphanumeric characters.\n\nThe value of $$ is\
    \ then added to the variable count, and the next line is read. When the loop is\
    \ exited by the end of file encountered, the value of count is displayed; that\
    \ is, the total number of words returned:\n\n```\n$ words < /etc/passwd\n567\n\
    $ wc -w < /etc/passwd\n567\n$\n```\n\n> Check against wc\n\nWe admit, this is\
    \ a rather weird way to figure out how many words are in a file, but as you can\
    \ see, the set command is more versatile than Unix users realize.\n\nHere's a\
    \ quick way to count the number of files in your directory:\n\n```\n$ set *\n\
    $ echo $$\\n8\n$\n```\n\nThis is much faster than\n\n```\nls | wc\n```\n\nbecause\
    \ the first method uses only shell built-in commands. In general, your shell programs\
    \ run much faster if you try to get as much done as you can using the shell's\
    \ built-in commands."
  merge: -1
  img_proc: true
- pgno: 270
  md: '# The IFS Variable 251


    # Other Options to set


    set accepts several other options, each enabled by preceding the option with a
    -, and disabled by preceding it with a +. The - option that we have described
    here is the most commonly used by others are summarized in Appendix A, Table A.9.


    # The IFS Variable


    There is a special variable called IFS, which stands for internal field separator.
    The shell uses the value of this variable when parsing input the read command,
    output from command substitution (the back-quoting mechanism), and when performing
    variable substitution. Succinctly, IFS contains a set of characters that are used
    as whitespace separators. If it''s typed on the command line, the shell treats
    it like a normal whitespace character (that is, as a word delimiter).


    See what it sets to:


    ```

    $ echo "IFS"

    $

    $ echo "IFS" | od -b

    0000000 040 011 012 012

    0000004

    $

    ```


    Well, wasn''t that very illuminating! To determine the actual characters stored
    in it, pipe the output from echo to the od (octal dump) command with the -b (byte
    display) option:


    The first column of numbers shown is the relative offset from the start of the
    input. The following numbers are the octal equivalents of the characters read
    by od. The first such number is 040, which is the ASCII value of the space character.
    It is followed by 011, the tab character, and then by 012, the newline character.
    The next character is another newline which was added by echo. This set of characters
    for IFS should come as no surprise; they''re the whitespace characters we talked
    about throughout the book.


    Where this gets interesting is the fact that you can change IFS to any character
    or set desired. This can be particularly useful when you want to parse a line
    of data whose fields aren''t delimited by the normal whitespace characters.


    For example, note the shell normally strips leading whitespace from the beginning
    of any line that you read with the read command. Change IFS to a newline before
    the read is executed, however, and it will preserve the leading whitespace (because
    the shell doesn''t consider it as a field delimiter):


    ```

    $ read line

    Here''s a line Try it the "old" way

    $ echo "$line"

    Here''s a line

    ```'
  merge: -1
  img_proc: true
- pgno: 271
  md: "```\n$ IFS=\"\"\n> \"\n$ read line\n  Here's a line\n  Set it to just a newline\n\
    \  Try it again\n$ echo \"$line\"\n  Here's a line\n  Leading spaces preserved\n\
    $\n```\n\nTo change IFS to a newline, an open quote was typed, followed by pressing\
    \ the Enter key, by the closing quote on the next line. No additional characters\
    \ can be typed inside those quotes because they'll be stored IFS and then used\
    \ by the shell.\n\nNow let's change IFS to something more visible, the color:\n\
    \n```\n$ IFS:\n$ read x y z\n123:345:678\n$ echo $x\n123\n$ echo $z\n678\n$ list=\"\
    one:two:three\"\n$ for x in $list; do echo $x; done\none\ntwo\nthree\n$ var=a:b:c\n\
    $ echo \"$var\"\na:b:c\n$\n```\n\nBecause IFS was changed to a colon, when the\
    \ line was read, she divided it into three words: 123, 345, and 678, which were\
    \ then stored into the three variables x, y, and z. In the next-to-last example,\
    \ the shell used IFS when substituting the value of list in the for loop. The\
    \ last example demonstrates that the shell doesn't use IFS when performing variable\
    \ assignment.\n\nChanging IFS is often done in conjunction with the set command:\n\
    \n```\n$ line=\"Micro Logic Corp.::Hackensack, NJ 174:07602\"\n$ IFS=\n$ set $line\n\
    $ echo $#\n  How many parameters were set?\n3\n$ for field; do echo $field; done\n\
    Micro Logic Corp.\nBox 174\nHackensack, NJ 07602\n$\n```"
  merge: -1
  img_proc: true
- pgno: 272
  md: "This technique is a powerful one because it uses all built-in shell commands\
    \ which makes it very fast. This technique is used in the final version of the\
    \ rolo program as presented in Chapter 13.\n\nThe following program, called number2\
    \ is a final version of the line numbering program presented in Chapter 9. This\
    \ program prints the input lines to standard output, preceded by a line number,\
    \ modifying IFS to ensure that leading spaces and other whitespace characters\
    \ on each line of input are faithfully stored and reproduced, unlike the earlier\
    \ version of the program. Notice the use of printf to right-align the line numbers.\n\
    \n```\n$ cat number2\n#\n# Number lines from files given as argument or from\n\
    # standard input if none supplied (final version)\n#\n```\n\nModify the IFS to\
    \ preserve leading whitespace on input\n\nIFS='\\n' Just a newline appears between\
    \ the quotes\n\nlineno=1\n\n```\ncat $* |\nwhile read -r line\ndo\n    printf\
    \ \"%5d:%s\\n\" $lineno \"$line\"\n    lineno=$(( lineno + 1 ))\ndone\n```\n\n\
    Here's a sample execution of number:\n\n```\n$ number2 words\n1:\n2:# Count all\
