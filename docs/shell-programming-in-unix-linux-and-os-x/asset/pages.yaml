    ```

    $ [ "$x1" -eq 5 ]

    $ echo $?

    ```


    True


    String comparison


    ```

    $ [ "$x2" -eq 10 ]

    $ echo $?

    ```


    False


    Integer comparison


    True


    The first test


    ```

    [ "$x1" = 5 ]

