- pgno: 296
  md: "Now's look at the individual programs that rolo utilizes, with particular attention\
    \ paid to how the change in data format ripples through the entire design. Each\
    \ of the original programs has been changed to accommodate the new entry format\
    \ and also to be more user friendly.\n\n# add\n\n```\n # Program to add someone\
    \ to the phonebook file\n\necho \"Type in your new entry\"\necho \"When you're\
    \ done, type just a single Enter on the line.\"\n\nfirst=\nentry=\n\nwhile true\n\
    do\n\techo \">> \\c\"\n\tread line\n\n\tif [ -n \"$line\" ]; then\n\t\tentry=$$line\"\
    \n\n\t\tif [ -z \"$first\" ]; then\n\t\t\tfirst=$line\n\t\telse\n\t\tbreak\n\t\
    f\ndone\n\necho \"$entry\" >> $PHONEBOOK\nsort -o $PHONEBOOK $PHONEBOOK\necho\
    \ \"$first has been added to the phone book\":\n```\n\nThis program adds an entry\
    \ to the phone book. It continually prompts the user to enter units until a line\
    \ with an Enter is typed (that is, a completely blank line). Each line that is\
    \ entered is appended to the variable entry, with the special ^ character used\
    \ to logically separate fields.\n\nWhen the while loop is exited, the new entry\
    \ is added to the end of the phone book, and the file is sorted."
