- pgno: 137
  md: 'The technique of using echo in a pipeline to write data to the standard input
    of the subsequent command is simple but powerful, and is often used in shell programs.


    The next example shows how cut can be used to extract the first character from
    the values stored in a variable filename:


    ```

    $ filename=/users/steve/memos

    $ firstchar=$(echo $filename | cut -c1)

    $ echo $firstchar /

    ```


    sed is also often used to "edit" the value stored in a variable. Here it is used
    to extract the first character from each line of the file by the variable file:


    ```

    $ file=exec.o

    $ lastchar=$(echo $file | sed ''s/.*\(..)$$/1/'')

    $ echo $lastchar $

    ```


    The sed command replaces all characters in parentheses on the line with the last
    (remember that a surrounding pattern can save it in a register[el] in this case
    register 1, which is then referred as \1). The result of the sed command is stored
    in the variable lastchar. The quote around the sed command are important because
    they prevent the shell from trying to interpret the backslashes. (Question: would
    double quotes also have worked?)


    Finally, command substitution can be nested. Suppose you want to change every
    occurrence of the first character in a variable to something else. In a previous
    example, firstchar=$(echo $filename | cut -c1) gets the first character from filename,
    but how would we use this change to change every occurrence of that character
    in filename?

    A two-step process is one way:


    ```

    $ filename=/users/steve/memos

    $ firstchar=$(echo $filename | cut -c1)

    $ filename=$(echo $filename | tr "$firstchar" "*") translate / to^

    $ echo $filename

    users/steve/memos $

    ```


    But a single, nested command substitution can perform the same operation:


    ```

    $ filename=/users/steve/memos

    $ filename=$(echo $filename | tr "$(echo $filename | cut -c1)" "*")

    $ echo $filename

    users/steve/memos $

    ```


    If you have trouble understanding this example, compare it to the previous one:
    Note how the firstchar variable in the earlier example is replaced by the nested
    command substitution; otherwise, the two examples are the same.'
  merge: -1
  img_proc: true
- pgno: 138
  md: '# The expr Command


    Although the usual shell supports built-in integer arithmetic, older shells don''t
    have this capability. In that situation, the mathematical equation solver expr
    can be used instead:


    ```

    $ expr 1 + 2

    3

    $

    ```


    It''s easy to work with, but expr isn''t very good at parsing equations, so each
    operator and operand given must be separated by spaces to be properly understood.
    That explains the following:


    ```

    $ expr 1+2

    1+2

    $

    ```


    The usual arithmetic operators are recognized by expr: + for addition, - for subtraction,
    / for division, * for multiplication, and % for modulus (remainder).


    ```

    $ expr 10 + 20 / 2

    20

    $

    ```


    Multiplication, division, and modulus have higher precedence than addition and
    subtraction, as with standard mathematics. Thus, in the preceding example the
    division was performed before addition.


    But what about this example?


    ```

    $ expr 17 * 6

    expr: syntax error

    $

    ```


    The shell saw and substituted the names of all the files in your directory, which
    expr had no idea how to interpret! In the case of multiplication especially, the
    expression given to expr must be quoted to keep it away from the shell''s interference—but
    not as a single argument, in this example:


    ```

    $ expr "17 * 6"

    17 * 6

    $

    ```


    Remember that expr must see each operator and operand as a separate argument;
    the preceding example sends the whole expression as a single argument, which doesn''t
    give you the results you.


    This is a job for the backslash!


    ```

    $ expr 17 \* 6

    102

    $

    ```'
  merge: -1
  img_proc: true
- pgno: 139
  md: 'Naturally, one or more of the arguments to expr can be the value stored inside
    a shell variable because the shell takes care of the substitution first anyway:


    ```

    $ i=1

    $ expr $i + 1

    2

    $

    ```


    This is the older method for performing arithmetic on shell variables and is less
    efficient than the built-in $(...) . In the case of incrementing or otherwise
    modifying a variable, you can use the command substitution mechanism to assign
    the output from expr back to the variable:


    ```

    $ i=1

    $ i=$(expr $i + 1)

    $ echo $i

    2

    $

    ```


    In legacy programs, you are more likely to see expr used with the back quotes
    discussed earlier:


    ```

    $ i="expr $i + 1"

    $ echo $i

    3

    $

    ```


    Similar to the shell''s built-in arithmetic, expr only evaluates integer arithmetic
    expressions. You can use awk or bc if you need to do floating point calculations.
    The difference? 17 is an integer, 13.747 is a floating point (that is, number
    with a decimal point) value.


    Also note that expr has other operators. One of the most used is the : operator,
    which is used to match characters in the first operand against a regular expression
    given as the second operand. By default, it returns the number of characters matched.


    For example, the expr command


    ```

    expr "$file" "."

    ```


    returns the number of characters stored in the variable file, because the regular
    expression .* matches all the characters in the string. For more details on expr
    and the powerful colon construct, consult your Unix User''s Manual or the man
    page for expr on your system.


    Table A.5 in Appendix A summarizes the ways quotes are handled by the shell.'
