- pgno: 326
  md: '# The alias Command


    An alias is a shorthand notation provided by the shell to allow command customization.
    The shell keeps a list of aliases that is searched when a command is entered before
    any other substitution occurs. If the first word of a command line is an alias,
    it is replaced by the text of the alias.


    An alias is defined using the alias command. The format is


    ```

    alias name=string

    ```


    where name is the name of the alias, and string is any string of characters. For
    example,

    alias ls=''ls -l''

    assigns ls -l to the alias 11. When the command 11 is entered by the user, the
    shell replaces it with ls -l. Even better, you can type arguments after the alias
    name the command line, as in


    ```

    11 *.c

    ```


    which transforms into this alias substitution has performed:


    ```

    ls -l *.c

    ```


    The shell performs its normal command-processing when the alias is set and it
    is used, so quoting can be tricky. For example, recall the shell keeps track of
    your current working directory inside a variable called PWD:


    ```

    $ cd /users/steve/letters

    $ echo $PWD

    /users/steve/letters

    $

    ```


    You can create an alias dir that gives you the name of your current working directory
    by using the PWD variable and one of the parameter substitution constructs:


    ```

    alias dir="echo ${PWD#*/}"

    ```


    This seems reasonable, but let''s see how this works in practice:


    | $ alias dir="echo ${PWD#*/}" | Define alias |

    | $ pwd | Where are we? |

    | /users/steve | Execute alias |

    | $ dir | |

    | steve | |

    | $ cd letters | Change directory |

    | $ dir | Execute the alias |

    | steve | |

    | $ cd /usr/spool | One more try |

    | $ dir | |

    | steve | |

    | $ |'
  merge: -1
  img_proc: true
- pgno: 327
  md: "# Chapter 14 Interactive and Nonstandard Shell Features\n\nNo matter the current\
    \ directory, the *dir* alias prints *steve*. That's because we weren't\ncareful\
    \ about quotes when we defined the *dir alias. Recalling that the shell performs\
    \ parameter\nsubstitution inside double quotes, the problem is that the shell\
    \ evaluated\n\n```\n$${PWD#*/}\n```\n\nat the time the alias was defined. This\
    \ means that the *dir* alias was essentially defined as if\nwe'd typed in the\
    \ following:\n\n```\n$ alias dir=\"echo steve\"\n```\n\nNo wonder it didn't work!\n\
    \nThe solution is use single rather than double quotes when defining the *dir*\
    \ alias to defer\nparameter substitution until the alias is executed:\n\n```\n\
    $ alias dir='echo ${PWD#*/}'\n$ pwd\n/users/steve\n$ dir\n$ cd letters\n$ dir\n\
    letters\n$ cd /usr/spool\n$ dir\nspool\n$\n```\n\nDefine alias\nWhere are we?\n\
    \nExecute alias\n\nChange directory\nExecute alias again\n\nOne more try\n\nIf\
    \ an alias ends with a space, the word the alias is also checked for alias substitution.\n\
    For example:\n\n```\nalias nohup=\"*/bin/nohup \nnohup 11\n```\n\ncauses the shell\
    \ to perform alias checking on the string 11 after replacing nohup with /bin/\n\
    nohup.\n\nQuoting a command or prefacing it with a backslash prevents alias substitution.\
    \ For example:\n\n```\n$ '11'\nksh: 11: command not found\n$\n```\n\nThe format\n\
    \n```\nalias name\n```\n\ncauses the value of the alias name to be listed, and\
    \ the alias command without arguments\ncauses all aliases to be listed."
