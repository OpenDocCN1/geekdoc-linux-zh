    \ a case statement rather than the clunkier if-elif. This time, let's take advantage\
    \ of the fact that date with the +H option writes a two-digit hour to standard\
    \ output.\n\n```\n$ cat greetings\n#\n# Program to print a greeting -- case version\n\
    #\n```\n\n```\ncase \"$hour\"\nin\n\t0? | [01] ) echo \"Good morning\";\n\t1[2-7]\
    \ ) echo \"Good afternoon\";\n\t*) echo \"Good evening\";\nesac\n$\n```"
