    can have something like ~/bin in your PATH and have it work correctly).


    # Order of Search


    It''s worthwhile understanding the search order the shell uses when you type in
    a command name:


    +   1. The shell first checks to see whether the command is a reserved word (such
    as for or do).

    2. If it''s not a reserved word and not quoted, the shell next checks its alias
    list, and if it finds a match, performs the substitution. If the alias definition
    ends in a space, it also attempts alias substitution on the next word. The final
    result is then checked against the reserved word list, and if it''s not a reserved
    word, the shell proceeds to step 3.

    3. The shell checks the command against its function list and executes the eponymous
    function found.

    4. The shell checks to see whether the command is a built-in command (such as
    cd and pwd).

    5. Finally, the shell searches the PATH to locate the command.

    6. If the command still isn''t found, a “command not found” error message is issued.


