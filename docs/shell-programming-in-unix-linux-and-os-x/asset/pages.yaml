  md: '# The Double Quote


    Double quotes work similarly to single quotes, except they''re less protective
    of their content:

    single quotes tell the shell to ignore all enclosed characters, double quotes
    say to ignore most.

    in particular, the following three characters are not ignored inside double quotes:


    +   - Dollar signs

    - Back quotes

    - Backslashes


    The fact that dollar signs are not ignored means variable name substitution is
    done by the shell inside double quotes.


    ```

    $ filelist=*

    echo $filelist

    addresses into lotspaces nu phonebook stat

    echo ''$filelist''

    $filelist

    echo ''$filelist*''

    *

    ```


    Here you see the major difference between no quotes, single quotes, and double
    quotes. In the first instance, the shell sees the asterisk and substitutes all
    filenames from the current directory. In the second case, the shell leaves the
    characters enclosed within the single quotes completely alone, which results in
    the display of $filelist. In the final case, the double quotes indicate to the
    shell that variable name substitution is still to be performed inside double quotes.
    So the shell substitutes for $filelist. But because filename substitution is not
    done inside double quotes, * is then passed to echo as the value to be displayed.


    > Note

    While we''re talking about versus double quotes, you should also be aware that
    the shell has no idea what "smart" quotes are. Those are generated by processors
    like Microsoft Word and curl "inward" towards the material they surround, making
    it much more attractive when printed. The problem is, that they''ll break your
    scripts, so be!


    If you want to get the value of a variable substituted, but don''t want the shell
    to parse the characters especially, enclose the variable inside double quotes.


    Here an another example illustrating the difference between double quotes and
    no:


    ```

    $ address="39 East 12th Street

    > New York, N. Y. 10003"

    echo $address

    39 12th Street New York, N. Y. 10003

    echo "$address"

    39 12th Street

    New York, N. Y. 10003

    $

    ```'
