- pgno: 314
  md: '# The vi Line Edit Mode 295


    Go into command mode (Esc) and use k to access previous commands from the command
    history:


    ```

    $ Esc k $ echo this is a test

    ```


    Every time k is used, the line is replaced by the previous line from the command
    history, as far back as you want to go, within the constraints set with HISTSIZE,
    as discussed earlier.


    ```

    $ echo this is a test k $ cd /tmp

    $ cd /tmp $ pwd

    ```


    To execute the command being displayed, just press the Enter key.


    ```

    $ pwd Hit Enter

    /tmp

    $_

    ```


    The j command is the reverse of the k command and used to display the next most
    recent command in the history. In other words, k moves "back" in time, and j moves
    "forward" in time. Try a few times and you''ll immediately see what we mean.


    The / command searches through the command history for a command containing the
    specified string. If the / is followed by a string, the shell searches backward
    through its history to find the most recently executed command that contains that
    string. The command will be displayed.


    If no line in the history contains the specified string, the shell "beeps" to
    indicate the error. When the / is entered, the current line is replaced by a /.


    ```

    /tmp Esc /test /test_

    ```


    The search is begun when the Enter key is pressed.


    ```

    /test_ Enter $ echo this is a test

    ```


    To execute the command that results from the search, Enter must be pressed again.


    ```

    $ echo this is a test Hit Enter again

    this is a test

    $

    ```


    If the command displayed isn''t the one you seek, continue the typing in /without
    a pattern and pressing Enter. The shell is smart enough to use the string you
    entered the last time you executed the command and continue from the last match
    further back in your command list.


    When you''ve found the command in the history (either by k, j, or /), you can
    edit the command using the vi commands we''ve already discussed. Worth noting
    is that by making these changes, you don''t actually change the command in the
    history. When you''re editing a copy of the command, which will be entered in
    the history as the most recent command when you press Enter.


    Table 14.1 summarizes the vi line edit commands.'
  merge: -1
  img_proc: true
- pgno: 315
  md: '# Table 14.1 Basic vi Line Edit Commands


    | Command | Meaning |

    | --- | --- |

    | h | Move one character. |

    | l | Move right one character. |

    | b | Move left one word. |

    | w | Move right one word. |

    | 0 | Move to start of line. |

    | $ | Move to end of line. |

    | x | Delete character at cursor. |

    | dw | Delete word at cursor. |

    | rc | Change character at cursor to c |

    | a | Enter input mode and enter text after the current cursor. |

    | i | Enter input mode and insert text before the current cursor. |

    | k | Get previous command from history. |

    | j | Get next command from history. |

    | /string | Search history for the most recent command containing string; if string
    is null, the previous string will be used. |


    It seems like a lot, but don''t get too anxious: j and k to move up and down your
    history list, h and l to move around the command line, i to insert and Enter to
    invoke are all you really need to get going with command editing in vi mode.


    # The emacs Line Edit Mode


    Not a fan of the vi editor but prefer emacs, an editor much beloved by the open
    source developer community? The shell has a line edit mode for you too. After
    turning on the emacs line editor, you won''t notice anything different because
    you''ll type in and execute commands exactly as:


    ```

    $ set -o emacs

    $ echo hello

    hello

    $ pwd

    /users/pat

    $

    ```


    This time, however, to use the emacs line editor you will enter emacs commands,
    emacs commands are either control characters—characters typed by holding down
    the Ctrl key and pressing another character—or they are characters preceded by
    the Esc key. You may enter'
  merge: -1
  img_proc: true
- pgno: 316
  md: '# The emacs Line Mode Edit 297


    emacs commands any time you want there are no separate “modes” like the vi line.
    Note that emacs commands are not followed by an Enter.


    (For a complete list of emacs commands, refer to the documentation for Bash or
    Korn shell.)


    First, let''s look at how to move the cursor around the command line. Ctrl+b moves
    the cursor back (to the left), and Ctrl+f moves it forward (to the right). Try
    by pressing Ctrl+b and Ctrl+a a few times while entering a command on the command
    line. The cursor should move around the line. If you want to move the cursor the
    left or right side of the line, the shell simply ignores your command.


    ```

    $ mary had a little larb Ctrl+b $ mary had a little larb

    $ mary had a little larb $ mary had a little larb

    $ mary had a little larb Ctrl+b $ mary had a little larb

    $ mary had a little larb Ctrl+f $ mary had a little larb

    ```


    After the cursor is on the character you want to change, use the Ctrl+d command
    to delete the current character.


    ```

    $ mary had a little larb Ctrl+d $ mary had a little lab

    ```


    Note that the b moved to the left when the r was deleted and is now the current
    character.


    To add characters to the command line, simply type them in. The characters are
    inserted before the current character.


    ```

    $ mary had a little lab m $ mary had a little lab

    $ mary had a little lamb m $ mary had a little lambb

    $ mary had a little lambm Ctrl+h $ mary had a little lamb

    ```


    Note that the erase character (either Backspace or Ctrl+h) will always delete
    the character to the left of:


    The Ctrl+a and Ctrl+e commands can be used to move the cursor to the beginning
    and end of the command line, respectively.


    ```

    $ mary had a little lab Ctrl+a $ mary had a little lab

    $ mary had a little lab Ctrl+e $ mary had a little lamb_

    ```


    Note that the Ctrl+e command places the cursor one space to the right of the last
    character on the line. (When you''re not in emacs mode, the cursor is at the end
    of the line, one space to the right of the last character typed in.)


    This is because when you''re at the end of the line, whatever you type will be
    appended to whatever is already on the line.


    ```

    $ mary had a little lamb_ da $ mary had a little lambda_

    ```


    Two other useful movement commands are the Esc f and Esc b commands. The Esc f
    moves the cursor forward forward to the end of the current word. The Esc b moves
    the cursor backward to the beginning of the previous word. Note for these commands
    you press and release the Esc key, then press the key that corresponds to the
    desired command (f, b, and so on).'
  merge: -1
