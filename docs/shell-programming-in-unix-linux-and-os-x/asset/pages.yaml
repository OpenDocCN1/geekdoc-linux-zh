    # The trap Command


    When you press the DELETE or BREAK key at your terminal during execution of a
    shell program,

    that is typically terminated and prompted for your next command. This may

    not always be desirable in shell programs. For instance, you may end up leaving
    a bunch of

    temporary files that won''t get cleaned up as would on normal program completion.


    Pressing the DELETE key sends what''s known as a signal to the executing program,
    and

    programs specify what action should be taken on receipt of the signal rather than
    just

    relying on default actions like immediately exiting the process.


    Signal handling in a shell program is done with the trap command, whose general
    format is

    trap commands signals


    where commands is one or more commands that will be executed whenever any of the
    signals

    spec by signals is received.


    Mnemonic names and numbers are assigned to the different types of signals, and
    the more

    commonly used ones are summarized in Table 12.1. A more complete list is given
    under the

    trap command in Appendix A.


    Table 12.1 Commonly Used Signal Numbers


    | Signal | Mnemonic Name | Generated for |

    |---|---||}{

    | 0 | EXIT | Exit from the shell |

    | 1 | HUP | Hangup |

    | 2 | INT | Interrupt (for example, DELETE, Ctrl+c key) | |

    | 15 | TERM | Software termination signal (sent by kill by default) |'
  merge: -1
  img_proc: true
- pgno: 278
  md: '# The trap Command 259


    As an example of the trap command, the following shows how you can remove some
    files and then exit if someone tries to interrupt the program from the terminal:


    ```

    trap ''rm $WORKDIR/work1$$ $WORKDIR/data$$; exit'' INT

    ```


    Once this trap is executed, the two files work1$$ and data$$ will be automatically
    removed if a SIGINT (signal number 2) is received by the program. If the user
    interrupts execution of the program after this trap is executed, you can be assured
    that these two temporary files will be removed, not left around in the file system.
    The exit that follows the rm is necessary because without execution would continue
    in the program at the point that it left when the signal was received.


    Signal 1-SIGHUP or HUP is generated for hangup: originally related to dialup connections,
    but more generally refers to an unexpected disconnect like the Internet connection
    dropping. You can modify the trap to also remove the two specified files in this
    case by adding a SIGINT to the list of signals:


    ```

    trap ''rm $WORKDIR/work1$$ $WORKDIR/data$$; exit'''' INT HUP

    ```


    Now these files will be removed if the line hangs up or if the user interrupts
    processing with the DELETE key or Ctrl+c.


    The sequence to trap (also known as the trap handler) must be enclosed in quotes
    if it contains more than one command. Also note that the shell scans the command
    at the time that the trap gets executed and also when one of the listed signals
    is received.


    In the preceding example, the value of WORKDIR and $$ will be substituted at the
    time that the trap command is executed. If you wanted this substitution to occur
    at the time that the trap was defined,:


    ```

    trap ''rm $WORKDIR/work1$$ $WORKDIR/data$$; exit'' INT HUP

    ```


    The trap can be used to make your programs more friendly too. In a further revision
    to the rolo program in the next chapter, the Ctrl+c interrupt signal will be caught
    by the program and return the user to the main menu, not have the program quit
    completely.


    # trap with No Arguments


    Executing trap with no arguments results in the display of any trap handlers you
    have defined or modified:


    ```

    $ trap ''echo logged off at $(date) >>HOME/logoffs'' EXIT

    $ trap                             List changed traps

    trap - ''echo logged off at $(date) >>HOME/logoffs'' EXIT Log off

    $ Ctrl+c

    login: steve Log back in

    Password:

    $ cat $HOME/logoffs See what happened

    logged off at Wed 2 15:11:58 EDT 2002

    $

    ```'
  merge: -1
  img_proc: true
- pgno: 279
  md: 'A trap was set to be executed whenever the shell exited—signal 0, EXIT—was
    received by the shell. Because this was set in the login shell, the trap handler
    is used when you log off to write the time you logged off to the file $HOME/logoffs.
    The command is enclosed in single quotes to prevent the shell from executing date
    when the trap is defined.


    The trap command is executed with no arguments which lists the new action to be
    taken for signal 0 (EXIT). When steve logs off and back on, the file $HOME/logoffs
    verifies that the echo command was executed and the trap worked.


    # Ignoring Signals


    If the command listed for trap is null, the specified signal is ignored when received.
    For example, the command


    ```

    trap " SIGINT

    ```


    specifies the interrupt signal is to be ignored. You might want to ignore certain
    signals when performing some operation that you don''t want.


    Note that trap lets you specify signal by name, by shortened name (INT) or by
    the full signal name (SIGINT). We encourage you to use mnemonic names to help
    produce readable code, but it is, of course, to which you prefer.


    In the example, the first argument must be specified as a null value for a signal
    to be ignored and is not equivalent to writing the following, which has a separate
    meaning of its own:


    ```

    trap 2

    ```


    If you ignore a signal, all subshells also ignore that signal. If you specify
    a signal handler action, however, all subshells automatically take the default
    action on receipt of signal, not the new code sequence.


    Suppose you execute the command


    ```

    trap " 2

    ```


    and then start a subshell, which in turn executes other programs as subshells.
    If an interrupt signal is generated, it will have no effect on the shells or subshells
    that are executing because they will ignore the signal by default.


    If instead of executing the previous trap you execute


    ```

    trap : 2

    ```


    and then execute your subshells, the current shell will do nothing on receipt
    of an interrupt (it will execute the null command), while subshells will be terminated
    (the default action).'
  merge: -1
  img_proc: true
