- pgno: 146
  md: '# A Program to Remove Someone from the Phone Book


    # A Program to Remove Someone from the Phone Book


    No set of programs that enable you to look up or add someone to the phone book
    would be complete without a program to remove someone from the phone book too.
    We''ll call this program rem and let the user specify the name of the person to
    be removed as a argument.


    What should the strategy for developing the program? Essentially, you want to
    remove the name from the file that contains the specified name, a reverse pattern
    match. The -v option to grep can be used here because it does exactly what we
    want, printing all lines from a file that doesn''t match a pattern:


    ```

    $ cat rem

    #

    # Remove someone from the phone book

    #

    ```


    ```

    grep -v "$1" phonebook > /tmp/phonebook

    m /tmp/phonebook phonebook

    $

    ```


    The grep construct writes all lines that do not match the file /tmp/phonebook.
    (Tip: /tmp is a directory in Unix systems for temporary files and is usually wiped
    clean every time the system restarts.) After the grep command is done, the phonebook
    file is replaced by the new one from /.


    ```

    $ rem ''Stromboli Pizza''

    $ cat phonebook

    Alice Cheeba 973-555-2015

    Barbara Swingle 201-555-9257

    Billy Bach 201-555-7618

    Liz Stachiw 212-555-2298

    Susan Goldberg 201-555-7776

    Susan Topple 212-555-4932

    Tony Inannino 973-555-1295

    $ rem Susan

    $ cat phonebook

    Alice Cheeba 973-555-2015

    Barbara Swingle 201-555-9257

    Billy Bach 201-555-7618

    Liz Stachiw 212-555-2298

    Tony Inannino 973-555-1295

    $

    ```


    > Remove this entry


    The first case, when Stromboli Pizza was removed, worked fine. In the second case,
    however, both Susan entries were removed because they matched the pattern. Not
    good! You can use the add program to add them back to the phone book:


