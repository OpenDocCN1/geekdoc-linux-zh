    # The times Command


    General Format: times


    Execution of this command causes the shell to write to standard output the total
    amount of time that has been used by the shell and all its child processes. For
    each, two numbers are listed: first the accumulated user time and then the accumulated
    system time.


    Note that times does not report the time used by built-in commands.


    Example


    ```

    $ times

    Print time used by processes

    1m5 2m9s 1 min., 5 secs. user time, 2 mins., 9 secs. system time

    8m22.23s 6m22.01s Used by child processes

    $

