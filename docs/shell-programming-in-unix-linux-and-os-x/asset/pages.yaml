    ```

    $ read line

    Here is an entire      line \r

    $ echo "$line"

    Here is an entire      line r

    $

    ```


    Note in the final example that leading whitespace characters get “eaten” by the
    shell when read. You can change IFS if this poses a problem.


    Also note backslash characters get interpreted by the shell when you read the
    line, and any that make it (double backslashes) will get through as a single backslash)
    get interpreted by echo if you display the value of variable.


    +   - A option to read says to not treat a character at the end of a line as line
    continuation.


    # The readonly Command


    General Format: readonly vars


    This command tells the shell that the listed variables cannot be assigned values.
    These variables may be optionally assigned values on the readonly line. If you
    subsequently try to assign a value to a readonly variable, the shell issues an
    error message.


    readonly are useful for ensuring that you don''t accidentally overwrite the value
    of a variable. They’re also good for ensuring that other people using a shell
    program can''t change the values of particular variables (for example, their HOME
    directory or their PATH). The readonly attribute is not passed down to subshells.


    readonly with a -p option prints a list of your readonly variables.


    Example


    ```

    $ readonly DB=/users/steve/database

    $DB=foo

    sh: DB: is-readonly

    $ echo $DB

    /users/steve/database

    ```


    Assign value to DB and make it readonly

    Try to assign it a value

    Error message from the shell

    But can still access its value


    # The return Command


    General Format: return n


    This command causes the shell to stop execution of the current function and immediately
    return to the caller with an exit status of n. If n is omitted, the exit status
    returned is that of the command executed immediately prior to the return.'
