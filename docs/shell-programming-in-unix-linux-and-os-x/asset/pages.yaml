- pgno: 323
  md: "# Chapter 14 Interactive and Nonstandard Shell Features\n\nThe real value of\
    \ this construct is that it allows arithmetic expressions to be used in if, while,\
    \ and until commands. The comparison operators set the exit status to a non-zero\
    \ value if the result of the comparison is false and to a zero value if the result\
    \ is true. So writing\n\n```\n(( i == 100 ))\n```\n\nhas the effect of testing\
    \ i to see whether it is equal to 100 and setting the exit status appropriately.\
    \ This makes integer arithmetic ideal for inclusion in if conditionals:\n\n```\n\
    if (( i == 100 ))\n```\n\nthen\n\n```\nfi\n```\n\nThe (( i == 100 )) returns an\
    \ exit status of zero (true) if i equals 100 and one (false) otherwise, and has\
    \ the same effect as writing\n\n```\nif [ \"$i\" -eq 100 ]\n```\n\nthen\n\n\n\n\
    ```\nfi\n```\n\nAnother advantage of using ((...)) rather than test is the ability\
    \ to perform arithmetic as of the test:\n\n```\nif (( i / 10 != 0 ))\n```\n\n\
    then\n\n\n\n```\nfi\n```\n\nHere the comparison returns TRUE if i is divided by\
    \ 10 is not equal to zero.\n\nwhile loops can also benefit from integer arithmetic.\
    \ for example,\n\n```\nx=0\nwhile ((x++ < 100))\ndo\n\tcommands\n```\n\nndexecutes\
    \ commands 100 times.\n\n# Integer Types\n\nBoth the Korn and Bash support an\
    \ integer data type. You can declare variables to be integers by using the typeset\
    \ command with the -i option\n\n```\ntypeset - variables\n```\n\nwhere variables\
    \ are any valid shell variable names. Initial values can also be assigned to the\
    \ variables at the time they are declared:\n\n```\ntypeset -i signal=1\n```"
