- pgno: 182
  md: "# 'Round and 'Round She Goes\n\nIn this chapter you'll learn how to set up\
    \ program loops. These loops will enable you to execute a set of commands either\
    \ a specified number of times or until a specific end condition is met.\n\nThe\
    \ three built-in looping commands for shell programming are\n\n+   - for\n- while\n\
    - until\n\nYou'll learn about each one of these loops in separate sections of\
    \ this chapter.\n\n# The for Command\n\nThe for command is used to execute one\
    \ or more commands a specified number of times. Its basic format is as shown:\n\
    \n```\nfor var in word_1, word_2, ... word_n\ndo\n  command\n  command\n  ...\n\
    done\n```\n\nThe commands enclosed between the do and the done are what's known\
    \ as the body of the loop and are executed for as many items as listed after the\
    \ in. When the loop is executed, the first word, word_i, is assigned to the variable\
    \ var, and the body of the loop is then executed. Next, the second word in the\
    \ list, word_j, is assigned to var, and the body of the loop is executed again."
  merge: -1
  img_proc: true
- pgno: 183
  md: "# Chapter 8 'Round and Round She Goes\n\nThis process continues with successive\
    \ words in the list being assigned to var and the commands in the loop body being\
    \ executed until the last word in the list, word_i is assigned to var and the\
    \ body of the loop executed. At that point, no words are left in the list, and\
    \ execution of the for command is complete. Execution then continues with the\
    \ command that immediately follows the done.\n\nIf there are n words listed after\
    \ the in, the body of the loop will have been executed a total of n times when\
    \ the loop has finished.\n\nHere's a loop that will be executed three times:\n\
    \n```\nfor i in 1 2 3\ndo\n  echo $i\n```\n\nTo try it out, type this in directly\
    \ at the terminal, just like any other shell command:\n\n```\n$ for i in 1 2 3\n\
    >\n  echo $i\n>\ndone\n```\n\nWhile the shell is waiting for the done to be typed\
    \ to the for command, it keeps showing the secondary command prompt. When the\
    \ user enters done, the shell proceeds to execute the loop. Because three items\
    \ are listed after the in (1, 2, and 3), the body of the loop—in this case single\
    \ echo command—will be executed of three times.\n\nThe first time through the\
    \ loop, the first value in the list, 1 is assigned to the variable i. Then the\
    \ body of the loop is executed. This displays the value of i at the terminal.\
    \ Then the next word in the list, 2, is assigned to i and the echo command re-executed,\
    \ showing in the display of 2 at the terminal. The third word in the list, 3,\
    \ is assigned to i the third time through the loop and the echo command executed.\
    \ At that point, no more words are left in the list, so execution of the for command\
    \ is complete, and the shell displays the command prompt to let you know it's.\n\
    \nNow let's back up to Chapter 6 and recall the run program that enabled you to\
    \ run a file through tbl, nroff, and lp:\n\n```\n$ cat run\ntbl $1 | nroff -mm\
    \ -Tlp | lp\n$\n```\n\nIf you wanted to run the files memo memo2 memo3 memo4,\
    \ you could type the following at the terminal:\n\n```\n$ for file in memo1 memo2\
    \ memo3 memo4\ndo\n```"
  merge: -1
  img_proc: true
