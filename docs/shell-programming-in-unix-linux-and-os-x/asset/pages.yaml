- pgno: 369
  md: '# The set Command


    General Format: set options args


    This command is used to turn on or off options as specified by options. It is
    also used to set positional parameters, as specified by args.


    Each single letter option in options is enabled if the option is preceded by a
    minus sign -, or disabled if preceded by a plus sign +. Options can be grouped,
    in


    ```

    set fx

    ```


    which enables the f and x options that can be selected.


    Table A.9 summarizes the options that set


    | Meaning | Option |

    | --- | --- |

    | | Don''t treat subsequent args preceded by a - as options. If there are no arguments,
    the positional parameters are unset. |

    | -a | Automatically export all variables that are subsequently defined or modified.
    |

    | -b | If supported by the implementation, calls the shell to notify you when
    background jobs finish. |

    | -C | Don''t allow output redirection to overwrite files. > can still be used
    to force individual files to be overwritten even if this option is selected. |

    | -e | Exit if any command that executes fails or has a nonzero exit status. |

    | -f | Disable filename generation. |

    | -h | Add commands inside functions to the hash list as they are defined, and
    not as they are executed. |

    | -m | Turn on the job monitor. |

    | -n | Read commands without executing them (useful for checking for balanced...does,
    and if fis). |

    | +o | Write current option mode in command format. |

    | -o m | Turn on option mode m (see Table A.10). |

    | -u | Issue an error if a variable is referenced without having assigned a value
    or if a positional parameter is referenced without being set. |

    | -v | Print each shell command line as it is read. |

    | -x | Print each command and its arguments as it is executed, preceded by a +.
    |'
  merge: -1
  img_proc: true
- pgno: 370
  md: 'Shell modes are turned on or off by using the -o and +o options, respectively,
    followed by an option name. These options are summarized in Table A.10.


    # Table A.10 Shell Modes


    | Mode | Meaning |

    |---|---|

    | allexport | Same as -a. |

    | errexit | Same as -e. |

    | ignoreeof | The exit command must be used to leave the shell. |

    | monitor | Same as -m. |

    | noclober | Same as -c. |

    | noexec | Same as -n. |

    | noglob | Same as -f. |

    | nolog | Don''t put function definitions in the hourly. |

    | nounset | Same as -u. |

    | verbose | Same as -v. |

    | vi | The in-line editor is set to vi. |

    | xtrace | Same as -x. |


    The command set -o without any options has the effect of listing all shell modes
    and their current settings.


    The variable $- contains the current options setting.


    Each word listed in args is set to the positional parameters $1, $2, ..., respectively.
    If the first word would start with a minus sign, it''s safer to specify it with
    -- option to avoid interpretation of that value.


    If args is supplied, the variable $# will be set to the number of parameters assigned
    after execution of the command.


    # Examples


    ```

    set -vx

    set "name" "address" "phone"

    set -1

    set -0 vi

    set +verbose -o noglob

    ```


    Print all command lines as they are read, and each command and its arguments as
    it is executed

    Set $1 to $name, $2 to $address, and $3 to phone

    Set $1 to -1

    Turn on vi mode

    Turn verbose mode off, noglob

    $phone

    Set $1 to -1

    Turn on vi mode

    Turn verbose mode off, noglob'
  merge: -1
  img_proc: true
- pgno: 371
  md: '# The shift Command


    General Format: shift


    This command causes the positional parameters $1, $2, ..., $n to be "shifted left"
    one place. That is, $2 is assigned to $1, $3 to $2, ..., and $n to $n-1. $# is
    adjusted accordingly.


    If the format


    ```

    shift n

    used instead, the shift is to the left n places.

    ```


    Examples


    +   $ set a b c d

    $ echo "$\n$*"

    4

    a b c d

    $ shift

    $ echo "$\n$*"

    3

    b d

    $ shift 2

    $ echo "$\n$*"

    1

    d

    $


    # The test Command


    General Format:


    test condition


    or


    [ condition ]


    The shell evaluates condition and if the result of the evaluation is TRUE, returns
    a zero exit status. If the result of the evaluation is FALSE, a nonzero exit status
    is returned. If the format [ condition ] is used, a space must appear immediately
    after the [ and before the ] .


    condition is composed of one or more operators as shown in Table A.11. The -a
    operator has higher precedence than the -o operator. In any case, parentheses
    can be used to group subexpressions. Remember that the parentheses are significant
    to the shell and must be quoted. Operators and operands (including parentheses)
    must be delimited by one or more spaces so that test sees them as separate arguments.


    test is most often used to test conditions in an if, while, or until command.'
  merge: -1
  img_proc: true
