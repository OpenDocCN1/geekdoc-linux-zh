    \ taken on receipt of the SIGHUP or SIGINT signals back to the default\nbehavior\
    \ for the shell.\n\nMany shell programs also use a construct like this\n\n```\n\
    trap /bin/rm -f $tmpfile; exit INT QUIT EXIT\n```\n\nto ensure that the rm command\
    \ won't produce an error message if the temporary file hasn't\nbeen created upon.\
    \ The trap handler removes the temporary file if it exists and does\nnothing if\
    \ it doesn't.\n\n# More on I/O\n\nYou know about the standard constructs <, >,\
    \ >> for input redirection, output redirection,\noutput redirection with append,\
    \ respectively. You also know that you can redirect standard\nerror from any command\
    \ by writing 2> instead of >.\n\n```\ncommand 2> file\n```\n\nSometimes you may\
    \ want to explicitly write standard error in your program. With a slight\nvariation\
    \ on the above, you can redirect standard output to standard error by writing\n\
    \n```\ncommand &2\n```\n\nThe notation && descriptor output redirection to a file\
    \ with the file descriptor that\nfollows. Descriptor 0 is standard input, descriptor\
    \ 1 is standard output, and descriptor 2 is\n error. It's important to remember\
    \ that no space is permitted between the > and the &.\n\nTo write a message to\
    \ standard error:\n\n```\necho \"Invalid number of arguments\" >2\n```\n\nYou\
    \ may want to redirect both standard output (often abbreviated \"stdout\") and\
    \ standard error\noutput (\"stderr\") from a program into the same file. If you\
    \ know the name of the file, this is\nstraightforward:\n\n```\ncommand > foo 2>>\
    \ foo\n```\n\nHere both stdout and stderr will be written to foo.\n\nYou can also\
    \ write\n\n```\ncommand > foo 2>&1\n```\n\nto achieve the same effect; standard\
    \ output is redirected to foo, and standard error is redirected\nto standard output\
    \ (which has already been redirected to foo). Because the shell evaluates"
