- pgno: 199
  md: "# The getopts Command\n\nLet's extend the waitfor program by adding a -t option\
    \ that specifies how frequently,\nin seconds, to perform the check. Now waitfor\
    \ takes -m and -t options. We will allow\ntions to be specified in any order on\
    \ the command line, as long as they appear before\nt name of the user that we're\
    \ monitoring. So valid waitfor command lines look like this:\n\n```\nwaitfor ann\n\
    waitfor -m ann\nwaitfor -t 600 ann\nwaitfor -m -t 600 ann\nwaitfor -t 600 -m ann\n\
    ```\n\nand invalid ones look like this:\n\n```\nwaitfor\nwaitfor -t-600 ann\n\
    waitfor ann -m\nwaitfor -t ann\n```\n\nMissing user name\nNeed a space -t\nOptions\
    \ must appear first\nMissing argument -t\n\nAs you start writing code to allow\
    \ this sort of flexibility on the command line, you will soon\ndiscover that it\
    \ can become complicated!\n\nDon't fret, though; the shell provides a built-in\
    \ command called getopts that makes it easy\nto process command line arguments.\
    \ The general format of the command is\n\n```\ngetopts options variable\n```\n\
    \nWe'll dig into the options string shortly. For now, just know that letter-only\
    \ options are\nspecified such that they have a required argument a trailing colon,\
    \ so \"ab:c\"\nmeans that -a and -c are allowed, as is -b, but it requires an\
    \ additional parameter to be\nsified.\n\nThe getopts command is to be executed\
    \ within a loop, however, because it makes\nit easy to take actions are required\
    \ for each of the user specified. Each time\nthrough the loop, getopts examines\
    \ the command line argument and determines\nwhether it is a valid option by checking\
    \ whether the argument begins with a minus\ns is followed by any of the letters\
    \ specified as options. If it does, getopts stores the\nmatching option inside\
    \ the specified variable and returns a nonzero exit status. You'll\nwhat I mean\
    \ in just a few ...\n\nIf the letter follows the minus sign not listed in options,\
    \ getopts stores a question\nmark inside variable before returning with a zero\
    \ exit status. It writes an error message to\nstandard error about the bad parameter\
    \ that the user specified.\n\nIf no more arguments are left on the command line\
    \ or if the current argument doesn't\nwith a minus sign, getopts returns a nonzero\
    \ exit status, allowing the shell to process\nany subsequent argument. Think of\
    \ the command is -C /bin is a flag\n could be parsed and processed by getopts,\
    \ /bin is an argument to the ls\ncommand itself, processed after all the starting\
    \ arguments are dealt with."
  merge: -1
  img_proc: true
- pgno: 200
  md: '# The gettops Command 181


    Don''t get too anxious if this seems really confusing. The fact is, it is all
    very complicated, so let''s look at an example you can see how gettops works.
    Suppose for a script you''re writing you want to use gettops to recognize the
    options -a, -i, and -r. Your gettops call look like this:


    ```

    getopts "a" option

    ```


    Here the first argument--air—specifies the three acceptable command flags (-a,
    -i, and -r) and option is the name of the variable that gettops will use to store
    each matching value encountered.


    The gettops command allows options to be clustered or grouped together the command
    line. This is done by following a single minus sign with more than one consecutive
    option. For example, our foo command can be executed like this:


    ```

    foo -a -r

    ```


    or like this:


    ```

    foo -ari

    ```


    using this simple grouping feature.


    But wait, gettops is far more powerful than what we''ve explained so far! For
    example, it can also handle the case where an option requires an additional argument.
    For example, the new -t option to be the waitfor command requires an argument
    too.


    To properly parse arguments subsequent to a user-specified option, gettops requires
    that the command be invoked with least one space separating the option from the
    argument. In this instance, options cannot be grouped together.


    To indicate gettops that an option has a required argument, add a colon character
    after the option letter on the gettops command line. so the waitfor program, which
    allows both -m and -t options, the latter of which has a required additional argument,
    should call gettops


    ```

    getopts mt: option

    ```


    If gettops doesn''t find an argument after an option that requires one, it stores
    a question mark inside the variable and outputs an error message to standard error.
    Otherwise, it stores the character in the variable and the user specified argument
    inside a special variable called OPTARG.


    To make this clearer, here is the third version of waitfor that uses the gettops
    command to process the command line arguments. It also incorporates the previously
    noted change to send mail to the user running the program.'
  merge: -1
  img_proc: true
- pgno: 201
  md: "# Chapter 8 'Round and 'Round' She Goes\n\n```\n$ cat waitfor\n#\n# Wait until\
    \ a specified user logs on -- version 3\n#\n\n# Set up default values\n\nmailopt=FALSE\n\
    interval=60\n\n# process command options\n\nwhile getopts mt: option do\n  case\
    \ \"$option\"\n  in\n    m) mailopt=$OPTARG;\n    t) interval=$OPTARG;\n     \
    \ \\?) echo \"Usage: waitfor [-m] [-t n] user\"\n      echo \" -m means to be\
    \ informed by mail\"\n      echo \" -t means check every n secs.\"\n      exit\
    \ 1;\n  esac\ndone\n\n# Make sure a user name was specified\n\nif [ \"$OPTIND\"\
    \ -gt \"$#\" ]; then\n  echo \"Missing user name!\"\n  exit 2\nfi\n\nshiftcount=$($OPTIND\
    \ - 1))\nshift $shiftcount\nuser=$1\n\n#\n# Check for user logging on\n#\n\nuntil\
    \ who | grep \"^$user \" > /dev/null; do\n  sleep $interval\ndone\n\n#\n# When\
    \ we reach this point, the user has logged on\n#\n```"
  merge: -1
  img_proc: true
- pgno: 202
  md: "# The getopts Command 183\n\n```\nif [ \"mailopt\" = FALSE ]\nthen\n    echo\
