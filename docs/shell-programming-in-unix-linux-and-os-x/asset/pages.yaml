- pgno: 218
  md: '# The read Command


    There are two important concepts that this code raises, Actually, the first is
    to do with how computers implement multitasking, by swapping individual programs
    in and out of the processor. The result is that at any point during execution,
    a program can be swapped out, half-way through a series of commands. Now you can
    see the problem with the above code: because it''s two statements, what happens
    if the program loses its place in line between the two statements and another
    instantiation of the program runs to the exact same lines of code? The second
    program overwrites the result of the first program''s grep invocation. Not good
    for either user!


    The second point relates to what''s known as a race condition, a situation where
    more than one simultaneous invocation of a program can cause trouble. Most often
    that''s to temporary files, but it can also occur with sub-processes and lock
    files, as we''ll discuss later in the book.


    For now, just keep in mind when writing shell programs that be run by more than
    one person, make sure each user''s temporary files are unique.


    One solution is to create temporary files in the user''s home directory /tmp/.
    Another way is to choose a temporary filename that will be unique and different
    for each invocation of the program. A neat way to do this is to embed the unique
    process ID (PID) of the specific invocation into the filename. This is easily
    accomplished by referring to the special $$ shell variable:


    ```

    $ echo $$\n4668

    $ ps

    PID TTY TIME COMMAND

    4668 co 0:09 sh

    6470 co 0:03 ps

    $

    ```


    When substituted by the shell, $$ becomes the process ID of the login shell itself.
    Each process on the system is given a unique process ID, using the value of $$
    in the name of file eliminates the possibility of a different process using the
    same name. To fix the problem highlighted earlier, replace the two lines from
    rem with this improved sequence:


    ```

    grep -v "$name" phonebook > /tmp/phonebook$$\nmv /tmp/phonebook$$ phonebook

    ```


    to side-step any potential race conditions. Each person using rolo will run as
    a different process, so the file used in each instance will be different. Problem
    solved.


    # The Exit Status from read


    read returns an exit status of zero unless an end-of-file condition is encountered.
    If the data is coming from the terminal, this means that the user has pressed
    Ctrl+d. If the data is coming from a file, it means there''s no more data to read
    from the file.'
