    # Saving Matched Characters: \(\..\)


    It is possible to reference the characters matched against a regular expression
    by enclosing them inside backslashed parentheses. These captured characters are
    stored in pre-defined variables in the regular expression parser called *registers*,
    which are numbered 1 through 9.


    This gets a bit confusing, so take this slowly!

    As a first example, the regular expression


    \(\.)

    matches the first character on the line, whatever it is, and stores it into register
    1.


    To retrieve the characters stored in a particular register, the construct \*n*
    is used, where *n* is a digit from 1 to 9. So the regular expression


    \(\.).\1

    initially matches the first character on the line and stores it in register 1,
    then matches-ever is stored in register 1, as specified by the \1. The net effect
    of this regular expression is to match the first characters on a line if *they
    are both the same character*. Tricky, eh?


    The regular expression

    \(\.).*\1$

    matches all lines in which the first character on the line (.) is the same as
    the last character on the line (\1$). The . * matches all characters in-between.'
