- pgno: 188
  md: "# The while Command 169\n\nIf it's zero, the commands enclosed between the\
    \ do and done are once again executed. This continues until command_t returns\
    \ a nonzero exit status. At that point, execution of the loop is terminated. Execution\
    \ proceeds with the command that follows the done.\n\nNote that the commands between\
    \ the do and done might never be executed if command_t returns a nonzero exit\
    \ status the first time it's executed.\n\nHere's a program called while that simply\
    \ counts to 5:\n\n```\n$ cat while\ni=1\n\nwhile [ \"$i\" -le 5 ]\ndo\n  echo\
    \ i\n  i=$((i + 1))\n\ndone\n$ while\nRun it\n1\n2\n3\n4\n5\n$\n```\n\nThe variable\
    \ i is initially set to the value 1. Then the while loop is entered, succeeding\
    \ on the conditional test so the code block is executed. The shell continues execution\
    \ as long as i is less than or equal to 5. Inside the loop, the value of i is\
    \ displayed at the terminal, then incremented by one.\n\nThe while loop is often\
    \ used in conjunction with the shift command to process an unknown number of arguments\
    \ typed on the command line.\n\nConsider the next program, called prags, which\
    \ prints each of the command-line arguments one, per line.\n\n```\n$ cat prags\n\
    #\n# Print command line arguments one per line\n#\n\nwhile [ \"$#\" -ne 0 ]\n\
    do\n  echo \"$1\"\n  shift\ndone\n$ prags a b c\na\nb\nc\n```"
  merge: -1
  img_proc: true
- pgno: 189
  md: "```\n$ prargs 'a b' c\na b\nc\n$ prargs *\naddresses\nintro\nlotspaces\nnames\n\
    nu\nnumbers\nphonebook\nstat\n$ prargs      No arguments\n$\n```\n\nWhile the\
    \ number of arguments is not equal to zero, the value of $1 is displayed and then\
    \ a shift is invoked to shift variables (that is, $2 to $1, $3 to $2, and so on)\
    \ and also decrement $#. When the argument has displayed and shifted, $# will\
    \ equal zero, at which point execution of the while will be terminated.\n\nNote\
    \ that if no arguments are given to prargs (as was in the last case), the echo\
    \ and shift are never executed because $# is equal to zero as soon as the loop\
    \ is entered.\n\n# # The until Command\n\nThe while command continues as long\
    \ as the test expression continues to return a TRUE (zero) exit status. The until\
    \ command is the opposite: it executing the code block until the test returns\
    \ a nonzero exit status and stops once a zero status is produced.\n\nHere is the\
    \ general format of the until:\n\n```\nuntil command_\ndo\n  command\n  command\n\
    \  ...\n```\n\nLike the while, the commands between the do and done might never\
    \ be executed if command, returns a zero status the first time it's executed.\n\
    \nWhile the two commands are similar, the until command is useful for writing\
    \ programs that wait for a particular event to occur. For example, suppose that\
    \ you want to see whether sandy is logged on because you have something to utter.\
    \ You could send electronic mail, but you know that she usually doesn't get around\
    \ to reading her mail until late in the day. You could use the on program from\
    \ Chapter 7 to see whether sandy's logged on:\n\n```\n$ sandy is not logged on\n\
    $\n```"
