    \ logged on\"\n```\n\nfi\nThis first argument typed on the command line is stored\
    \ in the shell variable user. Then the if command executes the pipeline\n\n```\n\
    who | grep \"$user\"\n```\n\nand tests the exit status returned by grep. If the\
    \ exit status is zero (success), grep found who's output. In that case, the echo\
    \ command that follows is executed. If the exit status is non-zero (failure),\
    \ the specified user is not logged on, and the echo command is skipped.\nThe echo\
    \ command is indented from the left margin for aesthetic reasons only. In this\
    \ case, just a single command is enclosed between the then and fi. When more commands\
    \ are included, and when the nesting gets deeper, indentation can have a significant\
    \ impact on the program's readability. Later examples help illustrate this point.\n\
    \nHere are some sample uses of on:\n\n| root console Jul 8 10:37 |\n| barney tty03\
    \ Jul 8 12:38 |\n| fred tty04 Jul 8 13:40 |\n| joanne tty07 Jul 8 09:35 |\n| tony\
    \ tty19 Jul 8 08:30 |\n| lulu tty23 Jul 8 09:55 |\n\n```\n$ on tony tty19 Jul\
    \ 8 08:30\ntony is logged on\n```\n\n> We know he's on\nWhere did this come from?\n\
    \n```\n$ steve\nWe know he's not on\nTry this one\njoanne tty07 Jul 8 09:35\n\
    ann is logged on\n```\n\nThere are a couple of problems with the program as written,\
    \ however. When the specified user is logged on, the corresponding line from who's\
    \ output is also displayed, courtesy of the call to grep. This may not be a bad\
