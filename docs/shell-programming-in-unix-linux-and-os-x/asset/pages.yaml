    # The printf Command


    echo is quite adequate for displaying simple messages, sometimes you''ll want
    to print formatted output: for example, lining up columns of data. Unix systems
    provide the printf command for these tasks. Those of you familiar with the C or
    C++ programming language will notice many similarities with their function of
    the name.


    The general format of the printf command is


    ```

    printf "format" arg1 arg2 ...

    ```


    where format is a string that details how the subsequent values are to be displayed.
    Since the printf string is an argument and likely to contain special characters,
    spaces, it''s always a good idea to include it in quotes.


    Characters preceded by a percent sign are called format specifications and tell
    printf how the corresponding argument should be displayed. Each percent sign in
    the format string there should be a corresponding argument, except for the percent
    specification %%, which causes a single percent to be displayed.


    ```

    $ printf "Hello world!\n"

    Hello world!

    $

    ```


    Let''s start with a simple example of printf:


    ```

    $ printf "This is a number: %d\n" 10

    This is a number: 10

    $

    ```'
  merge: -1
  img_proc: true
- pgno: 222
  md: '# The printf Command 203


    printf doesn''t automatically add a newline character to the end of its output
    like echo but does understand the same escape sequences (refer to Table 9.1 earlier
    in this chapter), so adding \n to the end of the format string causes the newline
    character sequence to be printed and the command to appear on the next line as
    expected.


    Although the preceding is a simple example that could also be handled by echo,
    it is used to illustrate how the conversion specification (%d) is interpreted
    by printf: the format string is scanned and outputs each character in the string
    until its the percent sign. Then it reads the d and replaces the %d with the next
    argument given to printf, which must be an integer. If that argument (10) is set
    to standard output, printf continues scanning the format string, sees the \n,
    and outputs a newline.


    Table 9.2 summarizes different format specification characters.


    | Character | Use for Printing |

    |---|---|

    | %d | Integers |

    | %u | Unsigned integers |

    | %o | Octal integers |

    | %x | Hexadecimal integers, using a-f |

    | %X | Hexadecimal integers, using A-F |

    | %c | Single characters |

    | %s | Literal strings |

    | %b | Strings containing backslash escape characters |

    | %% | Percent signs |


    # Table 9.2 printf Format Specification Characters


    The first conversion specification characters are all used for displaying integers.
    %d displays signed integers, and %u displays unsigned integers; %u can also be
    used to display the positive representation of a negative number. By default,
    integers displayed as octal or hexadecimal do not have a leading 0 or 0x, but
    you can fix that if needed, as we will show later in this section.


    Strings are printed using %s or %b. %b is used to print strings literally, without
    any processing of backslash escape characters; %b is used to force interpretation
    of the backslash escape characters in the string argument.


    Here are a few printf examples to clarify:


    ```

    $ printf "The octal value for %d is %o\n" 20 20

    The octal value for 20 is 24

    $ printf "The hexadecimal value for %d is %x\n" 30 30

    The hexadecimal value for 30 is 1e

    ```'
  merge: -1
  img_proc: true
