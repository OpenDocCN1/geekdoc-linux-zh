- pgno: 355
  md: '# The break Command


    General Format: break


    Execution of this command causes execution of the innermost for, while, or until
    loop to be immediately terminated. Execution continues with the commands that
    immediately follow the loop.


    If the format n


    is used, execution of the n innermost loops is automatically terminated.


    # The case Command


    General Format:


    ```

    case value in

    pat_i) command

    command

    ...

    command;

    pat_j) command

    command

    ...

    command;

    pat_n) command

    command

    ...

    command;

    esac

    ```


    The word value is successively compared against pat_i, pat_j, ..., pat_n until
    a match is found. The commands that appear immediately after the matching pattern
    are then executed until a double semicolon (;;) is encountered. At that point,
    execution of the case is terminated.


    If no pattern matches value, none of the inside case are executed. The pattern
    matches anything and is often used as the last pattern in a case as the default
    or “catch-all” case.


    The shell metacharacters


    +   * (match zero or more characters)

    * (match any single character), and

    * [...] (match any single character enclosed between the brackets)


    can be used in patterns. The character | can be used to specify a logical ORing
    of two patterns, as in'
