    # The exec Command


    Within the db program, once the shell process completed, you were done with everything,
    as demonstrated by the fact that no commands followed /bin/sh in the program.
    Instead of having db wait for the shell to finish, you can use the exec command
    to replace the current program (db) with the new one (/bin/sh).


    The general format of exec is


    ```

    exec program

    ```


    Because the exec''ed program replaces the current one, there''s one less process
    hanging around, which helps the system run quickly. The startup time of an exec''ed
    program is quicker than too, due to how Unix systems execute processes.


    To use exec in the db program, you simply replace the last line with


    ```

    exec /bin/sh

    ```'
  merge: -1
  img_proc: true
- pgno: 250
  md: '# More on Subshells 231


    After this statement is executed, db will be replaced by /bin/sh. This means that
    it would now be pointless to have any commands follow the exec because they will
    never be executed.


    exec can also be used to use standard input and reopen it with any file that you
    want to read. To change standard input to infile, for example, use the exec command
    in the form exec < infile


    Any commands that subsequently read data from standard input will read from infile.
    Redirection of standard output is done similarly. The command exec > report


    redirects all subsequent output written to the file report. Note in both of the
    previous examples that exec is not used to start execution of a new program, just
    to reassign standard input or standard output.


    If you use exec to reassign standard input and later want to reassign it elsewhere,
    you can simply invoke exec again. To reassign standard input back to the terminal,
    you would write exec < /dev/tty


    The concept also allows for reassignment of standard output.


    # The (...) and { ...; } Constructs


    Sometimes you want to group a set of commands together. For example, you may want
    to push a sort followed by your plotdata program into the background. Not connected
    with a pipe; just two commands after the other.


    It turns out that you can group a set of commands together by enclosing them in
    parentheses or braces. The first form causes the commands to be executed by a
    subshell, the latter form by the current shell.


    Here are some examples to illustrate how they work:


    ```

    $ x=50

    $(x=100)

    $ echo $x

    50

    { x=100; }

    $ echo $x

    100

    $ pwd

    /users/steve

    $(cd bin; ls)

    add

    greings

    lu

    number

    ```


    Execute in this subshell


    Didn''t change

    Execute in the current shell


    Where am I?


    Change to bin and do an ls'
  merge: -1
  img_proc: true
- pgno: 251
  md: 'phonebook

    rem

    rolo


    ```

    $ pwd

    /users/steve

    { cd bin; }

    $ pwd

    /users/steve/bin

    $

    ```


    No change

    This should change me


    If the commands enclosed in the braces are all going to be on the same line, a
    space must

    follow the left brace, a semicolon must appear after the last command. Look closely
    at the

    statement above—{ cd bin; }for an example.


    Parentheses work differently. This is the example


    ```

    (cd bin; ls)

    ```


    demonstrates, parentheses are useful for executing commands without affecting
    the current

    environment.


    You can also use this for other purposes like pushing a set of commands into the
    background:


    ```

    $ (sort 2016data -0 2016data; plotdata 2016data) &

    [1] 3421

    $

    ```


    The parentheses group the sort and plotdata commands together that they can be
    sent to the

    background with their order of execution preserved.


    Input and output can also be piped to from these constructs, and I/O can be redirected,

    which makes them darn helpful to shell generators.


    In the next example, a de-formatted nroff command—ls 2—is effectively prepended
    the

    beginning of the file memo before being sent to nroff for processing.


    ```

    $ echo "ls 2"; cat memo; | nroff -Tlp | lp1

    ```


    In the command sequence


    ```

    $ progl1; prog2; prog3; 2> errors

    ```


    all messages to standard error by the three programs are collected into the errors.


    As a final example, return to the waitfor program from Chapter 8. As you''ll recall,
    the\program periodically checks for a user logging into the system. You will recall
    that it would be

    nice if the program could somehow automatically “send itself” to the background.
    Now you

    know how to do it: Simply enclose the until loop and the commands that follow
    within

    parentheses and send the entire grouping into the background:


    ```

    $ cat waitfor

    #

    # Wait until a specified user logs on -- version 4

    #

    ```'
