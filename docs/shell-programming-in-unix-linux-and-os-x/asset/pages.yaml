    \ PS1\n```\n\n# The TERM Variable\n\nThough many of the programs in Unix are command-line\
    \ based (like ls and echo), there are a number of full-screen commands (like the\
    \ vi editor) that require a detailed knowledge of your terminal settings and capabilities.\
    \ The environment variable that holds information is TERM and usually it's nothing\
    \ to worry about: your Terminal or SSH program usually sets it automatically to\
    \ be the optimal value for things to work seamlessly.\n\nHowever, some old-school\
    \ users might find xterm needs to have a specific value ansi or vt100 for the\
    \ full-screen programs to behave properly. In instances, setting the value within\
    \ .profile is recommended.\n\nYou can prevent a default TERM value during the\
    \ login sequence by having a simple code block like this:\n\n```\necho \"What\
    \ terminal are you using (xterm is the default)? \" \\\nread TERM\nif [ -z \"\
    $TERM\" ]\nthen\nTERM=xterm\n```\n\n```\nfi\nexport TERM\n```\n\nBased on the\
    \ terminal type entered, you may also want to do things such as set up the terminal\
    \ keys or the tabs on the terminal.\n\nEven if you always use the same terminal\
    \ type, you should set the TERM variable in your .profile file."
