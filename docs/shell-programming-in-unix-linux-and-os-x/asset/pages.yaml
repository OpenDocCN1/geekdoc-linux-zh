    tests to see the number of arguments passed to the command is not equal to zero.


    It''s important to note that the test command, not the itself, interprets the
    variable''s value as an integer when an integer operator is used, so these comparisons
    regardless of the shell''s type.


    Let''s have a closer look at the difference between test''s string and integer
    operators with a few examples.


