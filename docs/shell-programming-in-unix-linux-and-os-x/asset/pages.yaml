- pgno: 324
  md: '# Integer Arithmetic


    The main benefit: arithmetic performed on integer variables with the ((...)) construct
    is faster than on non-integer values.


    However an integer variable cannot be assigned anything but an integer value or
    integer expression. If you attempt to assign a non-integer to it, the message
    `bad number` is printed by the shell:


    ```

    $ typeset -i i

    $ i=hello

    ksh: bad number

    ```


    Bash simply ignores any strings that don''t contain numeric values and generates
    an error for anything that contains numbers and other characters:


    ```

    $ typeset -i i

    $ i=hello

    $ echo $i

    0

    $ i=1hello

    bash: ihello: value too great for base (error token is "hello")

    $ i=10+15

    $ echo $i

    25

    $

    ```


    The preceding example also shows that integer-valued expressions can be assigned
    to an integer variable, without even using the ((...)) construct. This holds true
    for shells.


    # Numbers in Different Bases


    Both Korn and Bash allow you to perform arithmetic in different numeric bases.
    To write a number in a different base with these shells, you use the notation


    ```

    base#number

    ```


    For example, to express the value 100 in base 8 (octal) you can write


    ```

    8#100

    ```


    You can write constants in different bases anywhere an integer value is permitted.
    To assign octal100 to the integer variable i, you can write


    ```

    typeset -i i=8#100

    ```


    Note that with the Korn shell the base of the first value assigned to an integer
    variable sets the default base of all subsequent uses of that variable. In other
    words, if the first value assign to the integer i is an octal, each time you reference
    the value of i on the command line, the Korn displays it as an octal number using
    the notation 8#value.


    ```

    $ typeset -i i=8#100

    $ echo $i

    8#100

    $ i=50

    ```'
  merge: -1
  img_proc: true
- pgno: 325
  md: '# 306 Chapter 14 Interactive and Nonstandard Shell Features


    ```

    $ echo $$

    8#62

    $ (( i = 16#a5 + 16#120 ))

    $ echo $$

    8#705

    ```


    Because the first value assigned to i is an octal number (8#100), all further
    references to i will also be in octal. When the base 10 value of 50 is next assigned
    to i and then i is subsequently displayed, we get the value 8#62, which is the
    octal equivalent in base 10.


    There''s a subtlety in the example above: while the display of i is set to octal,
    the default numeric value for bases assigned to the variable remains decimal unless
    specified. In other words, i=5 was not equal to i#50 even though the shell knew
    i was referred to as base 8.


    In the preceding example, (( )) is used to add the two hexadecimal values a5 and
    120. The result is then displayed, again in octal. We admit, that fairly obscure
    and not likely something you''ll encounter in day-to-day shell programming or
    interactive use!


    Bash uses both the base#number syntax for arbitrary bases and the C language syntax
    for—octal numbers are preceded by 0 (zero), and hexadecimal numbers are preceded
    by 0x:


    ```

    $ typeset -i i=0100

    $ echo $$

    64

    $ i=0x80

    $ echo $$

    128

    $ i=2#1101001

    $ echo $$

    105

    $ (( i = 16#a5 + 16#120 ))

    $ echo $$

    453

    ```


    Unlike the Korn shell, Bash doesn''t keep track of the variable''s numeric base;
    integer are displayed as decimal values. You can always use printf to print integers
    in octal or hexadecimal format.


    As you can see, with Bash and the Korn it is easy to work with different bases
    which makes it possible to write functions that perform base conversion and non-decimal
    arithmetic.'
