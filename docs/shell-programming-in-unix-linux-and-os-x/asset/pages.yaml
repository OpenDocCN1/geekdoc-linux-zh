- pgno: 103
  md: '# sort


    At its most basic, the `sort` command is really easy to understand: give it lines
    of input and it''ll

    sort them alphabetically, with the result appearing as its output:


    ```

    $ sort names

    Charlie

    Emanuel

    Fred

    Lucy

    Ralph

    Tony

    Tony

    $

    ```


    By default, sort takes each line of the specified input file and sorts it into
    ascending order.


    Special characters are sorted according to the internal encoding of the characters.
    For example,

    t space character is represented internally as the number 32, and the double quote
    as the

    number 34. This means that the former would be sorted before the latter. Particularly
    for

    other languages and locales the sorting order can vary, although you are assured

    sort will perform expected on alphanumeric input, the ordering of foreign language

    characters, and other special characters is not what you might expect.


    sort has many options that provide more flexibility in performing your sort. We''ll
    just

    describe a few of the options here.


    # The -u Option


    The -u option tells sort to eliminate duplicate lines from the output.


    ```

    $ sort -u names

    Charlie

    Emanuel

    Fred

    Lucy

    Ralph

    Tony

    $

    ```


    Here you see that the duplicate line that contained Tony was eliminated from the
    output.

    A lot of old-school Unix people accomplish the same thing by using the separate
    program

    uniq, so if you read shell scripts you''ll often see sequences like sort | uniq.
    Those

    can be replaced with sort -u!'
  merge: -1
  img_proc: true
- pgno: 104
  md: '# The - r Option


    Use the -r option to reverse the order of the sort:


    ```

    $ sort -r names    Reverse sort

    ```


    Tony

    Tony

    Ralph

    Lucy

    Fred

    Emanuel

    Charlie

    $


    # The -o Option


    By default, sort writes the sorted data to standard output. To have it go into
    a file, you can use output redirection:


    ```

    $ sort names > sorted_names

    $

    ```


    Alternatively, you can use the -o option to specify the output file. Simply list
    the name of the output file right after the -o:


    ```

    $ sort names -o sorted_names

    $

    ```


    This sorts names and writes the results to sorted_names.


    What''s the value of the -o option? Frequently, you want to sort the names in
    a file and have the sorted data replace the original. But typing


    ```

    $ sort names > names

    $

    ```


    won''t-it ends up wiping out the names file! However, with the -o option, it is
    okay to specify the same name for the output as the input file:


    ```

    $ cat names -o names

    $ cat names

    ```


    Charlie

    Emanuel

    Fred

    Lucy

    Ralph

    Tony

    $'
  merge: -1
  img_proc: true
- pgno: 105
  md: '> Tip

    Be careful if your filter or process is going to replace your original input file
    and make sure that it''s all working as you expect prior to having the data overwritten.
    Unix is good at a lot of things, but there''s no unremove command to recover lost
    data or lost files.


    # The -n Option


    Suppose that you have a file containing pairs of (x, y) data points as shown:


    ```

    $ cat data

    5 27

    2 12

    3 33

    -5 11

    15 6

    14 -9

    $

    ```


    And suppose that you want to feed this data into a plotting program called plotdata,
    but that the program requires that the incoming data pairs be sorted in increasing
    value of x (the first value on each line).


    The -n option to sort specifies that the first field on the line is to be considered
    a number, and the data is to be sorted arithmetically. Compare the output of sort
    used without the -n option and then with it:


    ```

    $ sort data

    -5 11

    14 -9

    15 6

    2 12

    23 33

    5 27

    $ sort -n data

    -5 11

    2 12

    3 33

    5 27

    14 -9

    15 6

    23 2

    $

    ```


    ![](img/dc544c8aef1333b25eff1c794c2e5ec2_105_0.png)'
  merge: -1
  img_proc: true
- pgno: 106
  md: '# Skipping Fields


    If you had to sort your data file by the y value—that is, the second number in
    each line—you could tell sort to start with the second field by using the option


    instead of -n. The -k says to skip the first field and start the sort analysis
    with the second field of each line. Similarly, -k5 would mean to start with the
    fifth field on each line and then sort the data numerically.


    ```

    $ sort -k2n

    14 -9

    23 2

    15 6

    -5 11

    2

    5 27

    3 33$

    ```


    Fields are delimited by space or tab characters by default. If a different delimiter
    is to be used, the -t option must be used.


    # The -t Option


    As mentioned, if you skip over fields, sort assumes that the fields are delimited
    by space or tab characters. The -t option can indicate otherwise. In this case,
    the character that follows the -t is taken as the delimiter character.


    Consider the sample password file:


    ```

    $ cat /etc/passwd

    root:0:0:root:/bin/bash

    steve:200:100:/users/steve:/usr/bin/ksh

    bin:x:13::The owner of system files:

    cron:1:1:Cron Daemon for periodic tasks:

    george:75:75:/users/george:/usr/lib/rhs

    pat*:300:300:/users/pat:/usr/bin/ksh

    uucp:nc83CISI2M:5:/usr/spool/public/lib/uuc/uucoico

    asg*:6:6:The Owner of Assignable Devices:

    sysinfo*:1:10:10:Access to System Information:/usr/bin/sh

    mail:301:301:/usr/mail:

    $

    ```


    If you wanted to sort this file by username (the first field on each line), you
    could just issue the command

    sort /etc/passwd'
  merge: -1
  img_proc: true
- pgno: 107
  md: '# Chapter 3 Tools of the Trade


    To sort the file instead by the third colon-delimited file (which contains what
    is known as your user ID), you would want an arithmetic sort, with the third field
    (-k3), and specifying the colon character as the field delimiter (-t :):


    ```

    $ sort -k3 -t : /etc/passwd

    root:x:0:The Super User:/usr/bin/ksh

    cron::1:1:Cron Daemon for periodic tasks::/

    bin::3:3:The system of files::/

    uucp::5:5:/usr/spool/uucpublic:/lib/uucp/uucico

    as*:6:6:The Owner of Assignable Devices::/

    sysinfo*:10:10:Access to System Information::/usr/bin/sh

    george*:75:75:/users/george:/usr/bin/sh

    steve*:203:300:/users/steve:/usr/bin/ksh\mail*:301::/usr/mail::

    ```


    Here we''ve bolded the third field of each class so that you can easily verify
    that the file sorted correctly by user ID.


    # Other Options


    Other options to sort enable you to skip characters in a field, specify the field
    to end the sort on, merged input files, and in “dictionary order” (only letters,
    numbers, and spaces are used for the comparison). For more details on these options,
    look under sort in your Unix User''s Manual.


    # uniq


    The uniq command is used when you need to find or remove duplicate lines in a
    file.

    The basic format of the command is


    ```

    uniq in_file out_file

    ```


    In this format, uniq copies in_file to out_file, removing any duplicate lines
    in the process. uniq''s definition of duplicated lines is consecutive lines that
    match exactly.


    If out_file is not specified, the results will be written to standard output.
    If in_file is also not specified, uniq acts as a filter and reads its input from
    standard input.


    Here are some examples to see how uniq works. Suppose that you have a file called
    names with contents as:


    ```

    $ cat names

    Charlie

    Tony

    Emanuel

    Lucy

    ```'
  merge: -1
  img_proc: true
- pgno: 108
  md: 'Ralph

    Fred

    Tony

    $


    You can see that the name Tony appears twice in the file. You can use uniq to
    remove duplicate entries:


    +   $ uniq names Print unique lines

    Charlie

    Tony

    Emanuel

    Lucy

    Ralph

    Fred

    Tony

    $


    Oops! Tony still appears twice in the preceding output because the multiple occurrences
    are not consecutive in the file, and uniq''s definition of duplicate is not satisfied.
    To remedy this situation, sort is often used to get the duplicate lines adjacent
    to each other, as mentioned earlier in the chapter. The result of the sort is
    then run through uniq:


    +   $ sort names | uniq

    Charlie

    Emanuel

    Fred

    Lucy

    Ralph

    Tony

    $


    The sort moves the two Tony lines together, and then uniq filters out the duplicate
    line (but recall that sort with the -u option performs precisely this function).


    # # -d Option


    Frequently, you''ll be interested in finding the duplicate entries in a file.
    The -d option to uniq can be used for such purposes: it tells uniq only the duplicated
    lines to out_file (or standard output). Lines are written just once, no matter
    how many occurrences there are.


    +   $ sort names | uniq -d List duplicate lines

    Tony

    $


    As a more practical example, let''s return to our /etc/passwd file. This file
    contains information about each user on the system. It''s conceivable that over
    the course of adding and removing users from this file that perhaps the same username
    has been inadvertently entered'
