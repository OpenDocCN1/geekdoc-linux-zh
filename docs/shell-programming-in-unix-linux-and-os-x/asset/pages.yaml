- pgno: 236
  md: 'PATH 217


    # Tip


    The PS1 prompt has a language all its own with special sequences that produce
    the command count, current directory, time of day, and much more. Learn about
    it by reading the “Prompting” section of the Bash or Sh man page!


    # HOME


    Your home directory is where you''re placed whenever you log on to the system.
    A special variable called HOME is automatically set to this directory when you
    log on:


    ```

    $ echo $HOME

    /users/steve

    $

    ```


    This variable can be used by your programs to identify your home directory and
    is widely used by other programs in Unix for just this purpose. It''s also used
    by the cd command as the desired destination when you cd with no arguments:


    ```

    $ pwd

    /users/src/lib/ibc/port/stdio

    $ cd

    ```


    > Where am I?


    ```

    $ pwd

    /users/steve

    $

    ```


    > There''s no place like home


    You can change your HOME variable to do anything you want, but be warned that
    doing so may affect the operation of any programs that rely on it:


    ```

    $ HOME=/users/steve/book

    ```


    > Change it


    ```

    $ pwd

    /users/steve

    $ cd

    /users/steve/book

    $

    ```


    > See what happened


    You can change your HOME, but you really shouldn''t unless you''re prepared to
    have a lot of things go wacky rather quickly.


    # PATH


    Let''s return to the rolo program from Chapter 9:


    ```

    $ rolo Liz

    ```


    Liz Stachiw 212-775-2298

    $'
