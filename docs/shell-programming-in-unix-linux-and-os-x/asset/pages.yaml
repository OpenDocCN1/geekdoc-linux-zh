    \ \"$user has logged on\" | mail runner\nfi\n```\n\n```\n$ waitfor -m\n```\n\n\
    Missing user name!\n\n```\n$ waitfor -x fred\nwaitfor: illegal option -- x\nUsage:\
    \ waitfor [-m] [-t n] user\n-m means to be informed by mail\n-t means check every\
    \ n secs\n```\n\nIllegal option\n\n```\n$ waitfor -m -t 600 &\n[1] 5792\n```\n\
    \nCheck every 10 min. for ann\n\nLet's look at the last line closely. When the\
    \ line\n\n```\nwaitfor -t 600 &\n```\n\nis executing, the following occurs inside\
    \ the loop: getopts is invoked and stores the character m inside the variable\
    \ option, sets OPTIND to 2, and returns a zero status.\n\nThe case command determines\
    \ what was stored inside option. A match on the character m indicates that the\
    \ \"send mail\" option was selected, so mailopt is set to TRUE. (Note that the\
    \ ? inside the case is quoted. This is to remove its special meaning as a pattern\
    \ matching from the shell.)\n\nThe second time getopts is executed, getopts stores\
    \ the character i option, stores the next command line argument (600) inside OPTARG,\
    \ sets OPTIND to 3, and returns a zero exit status. The case command matches the\
    \ character t inside option. The code associated with that case copies the value\
    \ of 600 that was stored in OPTARG in the interval.\n\nThe third time getopts\
    \ is executed, getopts returns a nonzero exit status, indicating that it reached\
    \ the end of the user-specified command options.\n\nThe program checks the value\
    \ of OPTIND against $$ to make sure that a username was typed on the command line.\
    \ If OPTIND is greater than $$, no more arguments remain and the user forgot the\
    \ user name argument. Otherwise, the shift command is used to move the user name\
    \ argument into $1. The actual number of places to shift is one less than the\
    \ value of OPTIND."
