- pgno: 150
  md: "# 7 Decisions, Decisions\n\nThis chapter introduces the conditional statement,\
    \ a construct that is present in almost every programming language: if. It enables\
    \ you to test a condition and then change the flow of program execution based\
    \ on the result of the test.\n\nThe general format of the if command is\n\n```\n\
    if command\n  then\n    command\n    ...\nfi\n```\n\nwhere command, is executed\
    \ and its exit status is tested. If the exit status is zero, the commands that\
    \ follow between then and fi are executed; otherwise, they're skipped.\n\n# Exit\
    \ Status\n\nTo understand how conditional tests work, it's important to know how\
    \ Unix works with what's called the exit status. Whenever any program completes\
    \ execution, it returns an exit status to the shell. This status is a numeric\
    \ value that indicates whether the program ran successfully or failed. By convention,\
    \ an exit status of zero indicates that a program succeeded, and non-zero indicates\
    \ it failed, with different values indicating kinds of failures.\n\nFailures can\
    \ be caused by invalid arguments passed to the program, or by an error detected\
    \ by the program. For example, the cp command returns a non-zero (fail) exit status\
    \ if the copy fails (for example, if it can't find the source file or create the\
    \ destination file), or if the arguments aren't correctly specified (for example,\
    \ the wrong number of arguments, or more than two arguments and the last one isn't\
    \ a directory).\n\nWhat do we mean by non-zero? Simply, any integer value that\
    \ isn't 0. Most command man pages list possible exit status values, so possible\
    \ error conditions for a file copy command could be 1 for file not found, 2 for\
    \ file not readable, 3 for destination folder not found, 4 for destination folder\
    \ not writable, 5 for general error copying the file and, of, 0 for success."
  merge: -1
  img_proc: true
