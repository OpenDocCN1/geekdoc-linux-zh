- pgno: 50
  md: '# Standard Input/Output, and I/O Redirection


    If the notation > file is appended to any command that normally writes its output
    to standard output, the output of that command will be written to the file file
    instead:


    ```

    $ who users

    ```


    This command causes the who command to be executed and its output to be written
    into the file users. Notice that no output appears. This is because the output
    has redirected from the default standard output device (the terminal) into the
    specified file. We can check this, of course:


    ```

    $ cat users

    oko tty01 Sep 12 07:30

    ty15 Sep 12 13:32

    ruth tty21 Sep 12 10:10

    pat tty24 Sep 12 13:07

    steve tty25 Sep 12 13:03

    $

    ```


    If a command has its output redirected to a file and the file already contains
    some data, that data will be overwritten.


    ```

    $ echo line 1 > users

    $ cat users

    line 1

    $

    ```


    But consider this example, remembering that users already contain the output of
    the earlier who command:


    ```

    $ echo line 2 >> users

    $ cat users

    line 1

    line 2

    $

    ```


    If you''re paying close attention you will notice that this echo command uses
    a different type of output redirection, indicated by the characters >>. This character
    causes the standard output from the command to be appended to the contents of
    the specified file. The previous contents are not lost; the new output simply
    gets added to the end.


    By using the redirection append chars >> you can use cat to append the contents
    of file onto the end of another:


    ```

    $ cat file1

    This is in file1.

    $ cat file2

    This is in file2.

    $ cat file1 >> file2

    $ cat file2

    This is in file2.

    This is in file1.

    $

    ```


    Append file1 to file2'
  merge: -1
  img_proc: true
- pgno: 51
  md: '# Chapter 1 A Quick Review of the Basics


    Recall that specifying more than one filename to cat results in the display of
    the first file followed immediately by the second file, and so on. This means
    there''s a second way to accomplish the same result:


    ```

    $ cat file1

    This is in file.

    $ cat file2

    This is in file2.

    $ cat file1 file2

    This is in file.

    This is in file2.

    $ cat file1 file2 > file3    Redirect to instead

    $ cat file3

    This is in file1.

    This is in file2.

    ```


    In fact, that''s where the command gets its name: When used with more than one
    file, the effect is to concatenate the files together.


    # Inputirection


    Just as the output of a command can be redirected to a file, as the greater-than
    character > is used for output redirection, the less-than character < is used
    to redirect the input of a command. Of course, commands that normally take their
    input from standard input can have input redirected from a file in this manner.


    To redirect input, use the < followed by the name of the file that the input is
    to be read from. To count the number of lines in the file users, for example,
    you already know that you can execute the command wc -1 users:


    ```

    $ wc -1 users

    2 users

    ```


    It turns out that you can also count the number of lines in the file by redirecting
    standard input for the wc command:


    ```

    $ wc -1 < users

    2

    ```


    Note that there is a difference in the output produced by the two forms of the
    wc command. In the first case, the name of the file users is listed with the line
    count; in the second case, it is not.


    This points out a subtle distinction in the execution of the two commands. In
    the first case, wc knows that it is being fed input from the file users. In the
    second case, it only sees the raw data which is being fed to standard input. The
    shell redirects the input so that it comes from the file users and not the terminal
    (more about this in the next chapter). As far as wc is concerned, it doesn''t
    know whether its input is coming from the terminal or from a file, so it can''t
    report the filename!'
  merge: -1
  img_proc: true
- pgno: 52
  md: '# Pipes


    As you will recall, the file users that was created previously contains a list
    of all the users currently logged in to the system. Because you know that there
    will be one line in the file for each user logged in to the system, you can easily
    determine the *number* of login sessions by counting the number of lines in the
    *users* file:


    ```

    $ who > users

    $ wc -l < users

    5

    ```


    This output indicates that currently five users are logged in or that there are
    five login sessions, the difference being that users, particularly administrators,
    often log in more than once. Once you have a command sequence you can use whenever
    you want to know how many users are logged in.


    Another approach to determine the number of logged-in users bypasses the intermediate
    file. As referenced earlier, Unix lets connect two commands together. This connection
    is known as a pipe, and it enables you to take the output from one command and
    feed it directly into the input of another. A pipe is denoted by the character
    |, which is placed between the two commands. To create a pipe between the who
    and wc -1 commands, you type


    ```

    $ who | wc -1

    5

    ```


    The pipe that is created between these two commands is depicted in Figure 1.12.


    ![](img/dc544c8aef1333b25eff1c794c2e5ec2_52_0.png)


    Figure 1.12 Pipeline process: who | wc -1'
  merge: -1
  img_proc: true
