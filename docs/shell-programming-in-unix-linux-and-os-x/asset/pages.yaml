    \ ]\nthen\n    echo \"Incorrect number of arguments.\"\n    echo \"Usage: rem\
    \ name\"\n    exit 1\n```\n\nname=$1\n#\n# Find number of matching entries\n#\n\
    \n```\nmatches=$(grep \"$name\" phonebook | wc -1)\n\n#\n# If more than one match,\
