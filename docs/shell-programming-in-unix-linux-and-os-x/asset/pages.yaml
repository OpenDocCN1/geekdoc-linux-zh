- pgno: 273
  md: 'IFS has an influence on the way things are interpreted by the shell, if you''re
    going to change it in your program it''s useful to save the old value first in
    another variable (such as IFS) and then restore it after you''ve finished the
    operations.


    # The readonly Command


    The readonly command is used to specify variables whose values cannot be subsequently
    changed. For example,


    readonly PATH HOME


    marks both PATH and HOME variables as read-only. Subsequent attempts to assign
    a value to either variable causes the shell to issue an error message


    ```

    $ PATH=/bin:/usr/bin::

    $ readonly PATH

    $ PATH=$PATH:/users/steve/bin

    sh: PATH is read-only

    $

    ```


    Here you can see that after the variable PATH was made read-only, the shell printed
    an error message when an attempt was made to assign a value to it.


    To get a list of your read-only variables, type readonly -p without any arguments:


    ```

    $ readonly -p

    readonly PATH=/bin:/usr/bin::

    $

    ```


    The read-only attribute is not passed down to subshells. Also, after a variable
    has been made read-only in a shell, there is no way to “undo” it.


    # The unset Command


    Sometimes you may want to remove the definition of a variable from your environment.
    So, you type unset followed by the names of the variables:


    ```

    $ x=100

    $ echo $x

    100

    $ unset x

    $ echo $x

    ```


    Remove x from the environment


    ```

    $

    ```


    You can''t unset a read-only variable. Furthermore, the variables IFS, MAILCHECK,
    PATH, PS1, and PS2 cannot be unset.'
