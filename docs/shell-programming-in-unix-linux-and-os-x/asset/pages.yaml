- pgno: 197
  md: "Individual statements can override block redirection, just as any other statements\
    \ in your shell programs can explicitly redirect from a specified source or send\
    \ output to a specified destination.\n\nTo force input or output to come or go\
    \ to the terminal, utilize /dev/tty, which always refers to your terminal program,\
    \ whether you're on a Mac, Linux, or Unix system.\n\nIn the following loop, all\
    \ is redirected to the file `output` except the `echo` command's output, which\
    \ is explicitly redirected to the terminal:\n\n```\nfor file\ndo\n  echo \"Processing\
    \ file $file\" > /dev/tty\n\ndone > output\n```\n\nYou can also redirect the standard\
    \ error output from a loop, simply by tacking on a 2> `file` after the done:\n\
    \n```\nwhile [ \"$endofdata\" -ne TRUE ]\ndo\n  ...\n\ndone 2> errors\n```\n\n\
    Here output from all commands in the loop writing to standard error will be redirected\
    \ to the `file errors`.\n\nA variation of the `2> file 1&2` format is commonly\
    \ used to ensure that error messages go to the terminal even when a script might\
    \ have its output redirected into a file or pipe:\n\n```\necho \"Error: no file\
    \ $file\" 1&2\n```\n\nBy default, echo sends its output to standard output (file\
    \ descriptor 1), while file descriptor 2 remains standard error and is not redirected\
    \ on file redirection or pipe default. The notation above means that the error\
    \ message from `echo` should have its `file #1` output redirected to `file #2`,\
    \ which is, standard. You can test this with code like this:\n\n```\nfor i in\
    \ \"once\"\ndo\n  echo \"Standard output message\"\n  echo \"Error message\" 1>&2\n\
    ndone > /dev/null\n```\n\nTry it and see what happens.\n\n# Piping Data into and\
    \ out of a Loop\n\nA command's output can be piped into a loop (by having the\
    \ commands prior to the loop end with a pipe symbol), and the output from a loop\
    \ can be piped into another command too. Here's an example of the output from\
    \ a `for` command piped into wc:\n\n```\n$ for i in 1 2 3 4\ndo\n```"
  merge: -1
  img_proc: true
- pgno: 198
  md: "More on Loops 179\n\n```\n> echo i\n> done | wc -l\n4$\n```\n\n# Typing a Loop\
    \ on One Line\n\nIf you find yourself typing in loops directly at the command\
    \ line, you might want to try using shorthand notation to type in an entire command\
    \ on a single line: Put a semicolon after the last item in the list and one after\
    \ each command in the loop (but not after the do).\n\nUsing this shorthand, the\
    \ loop\n\n```\nfor i in 1 2 3 4\ndo\n  echo i\n```\n\ncan be written\n\n```\n\
    for i in 1 2 3 4; do echo i; done\n```\n\nYou can type it directly on the command\
    \ line this way:\n\n```\n$ for i in 1 2 3 4; do echo i;\n1\n2\n3\n4\n$\n```\n\n\
    The same rules apply to while and until loops.\n\nif commands can also be typed\
    \ on the same line using a similar format:\n\n```\n$ if [ 1 = 1 ]; then echo yes;\
    \ fi\nyes\n$ if [ 1 = 2 ]; then echo yes; else echo no; fi\nno$\n```\n\nNote that\
    \ no semicolons appear after the then and the else.\n\nMany shell programmers\
    \ use a hybrid structure where if statements are structured thus:\n\n```\nif [\
    \ condition ]; then\n  command\nfi\n```\n\nThis simple usage of the semicolon\
    \ can help increase the readability of your shell programs and is worth considering\
    \ as part of your own code formatting."
  merge: -1
