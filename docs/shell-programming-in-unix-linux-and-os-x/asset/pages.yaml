- pgno: 204
  md: '# # Reading and Printing Data


    In this chapter you''ll learn how to read data from the terminal or from a file
    using the `read` command and how to write formatted data to standard output using
    the `printf` command.


    # ## The read Command


    The general format of the `read command` is

    `read variables`


    When this command is executed, the shell reads a line from standard input and
    assigns the first word to the first variable listed in `variables`, the second
    word to the second variable, and so on. If there are more words on the line than
    there are variables listed, the excess words get assigned to the last variable.
    For example, the command


    `read x y` reads a line from standard input, storing the first word in variable
    `x`, and the remainder of the line in variable `y`. It follows from this that
    the command

    `read text`


    reads and stores an entire line into the shell variable `text`.


    # ## A Program to Copy Files


    Let''s put a command to work by writing a simplified version of the `cp` command.
    We''ll call it `mycp`, and we''ll have two arguments: the source file and the
    destination file. If the destination file already exists, the program will warn
    the user and ask if they want to proceed with the copy. If the answer is “yes,”
    we''ll proceed; otherwise the program will quit.


    ```

    $ cat mycp

    #

    # Copy a file

    #

    ```'
  merge: -1
  img_proc: true
