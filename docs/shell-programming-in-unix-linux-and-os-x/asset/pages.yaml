- pgno: 220
  md: "# The read Command\n\nThe following program, called number, is a simplified\
    \ version of the standard Unix nl command: it accepts one or more files as arguments\
    \ and displays their contents with each line preceded by its line number. If no\
    \ arguments are supplied, it reads standard input instead.\n\n```\n$ cat number\n\
    #\n# Number lines from files given as argument or from\n# standard input if none\
    \ supplied\n#\n\nlineno=1\n\ncat $* |\nwhile read line\n  \n    echo \"$lineno:\
    \ $line\"\n    lineno=$((lineno + 1))\ndone\n$\n```\n\nThe variable line—the line\
    \ number counter—is initially set to 1. Then the arguments typed to number are\
    \ given to cat to be collectively written to standard output. If no arguments\
    \ are supplied, $* will be null, and cat will pass no arguments. This will cause\
    \ to read from standard input. The output from cat is piped into the while loop.\n\
    \nEach line encountered by read is echoed at the terminal, preceded by the current\
    \ value of line, whose value is then incremented by one.\n\n```\n$ numberbook\
    \ 973-555-2015\n1: Alice Chebba 201-555-9257\n2: Barbara Swingle 201-555-9257\n\
    3: Billy Bach 201-555-7618\n4: El Coyote 212-555-3232\n5: Liz Stachiw 212-555-2298\n\
    6: Susan Goldberg 201-555-7776\n7: Teri Zak 201-555-6000\n8: Tony Iannino 973-555-1295\n\
    ```\n\n```\n$ who Try from standard input |\n1: root console Jul 25 07:55\n2:\
    \ pat tty03 Jul 25 09:26\n3: steveve tty04 Jul 25 10:58\n4: george tty13 Jul 25\
    \ 08:05\n```\n\nNote that number won't work well for lines that contain backslashes\
    \ or leading whitespace characters. The following example illustrates this.\n\n\
    ```\n$ number\n```\n\nHere are some backslashes: \\ *\n\n+   1: Here are some\
