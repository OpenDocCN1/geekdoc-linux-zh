  md: "# The fg Command\n\nGeneral Format: fg job_id\n\nIf job control is enabled,\
    \ the job specified by job_id is brought to the foreground. If no argument is\
    \ given, the most recently suspended job or the last job sent to the background\
    \ is brought to the foreground.\n\nExample\n\nfg $2\n\n# The for Command\n\nGeneral\
    \ Format:\n\n```\nfor var in word, word, ... word_n\ndo\n    command\n    command\n\
