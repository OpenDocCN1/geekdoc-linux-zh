  md: "# Functions 269\n\nA function definition can continue over as many lines as\
    \ necessary. The shell will continue to prompt for commands within the function\
    \ with the secondary command prompt until you complete the function definition\
    \ with the ).\n\nYou can put definitions for commonly used functions inside your\
    \ .profile so they'll be available whenever you log in. Alternatively, you can\
    \ group the definitions in a file, say myfuncs, and execute the function in the\
    \ current shell by typing\n\n+   - myfuncs\n\nAs you know now, this causes any\
    \ functions defined myfuncs to become available in the current shell.\n\nThe following\
    \ function, called mycd, takes advantage of the fact that functions are run in\
    \ the current environment. It mimics the operation of the Korn shell's cd command,\
    \ which has the capability of substituting portions of the current directory's\
    \ path (see the discussion of cd in Chapter 14 for more explanation).\n\n```\n\
    $ myfuncs\n# See what's inside\n# new cd function:\n#   mycd switches dir\n# \
    \  mycd old new  Substitute for old in current directory's path\n#\nmycd () {\n\
    \  if [ $# -le 1 ]; then\n    # normal case -- 0 or 1 argument\n    cd $1\n  elif\
    \ [ $# -eq 2 ]; then\n    # special case -- substitute $2 for $1\n    cd $$(echo\
    \ $PWD | sed \"s|$1|$2/\")\n  else\n    # mycd can't have more than two arguments\n\
    \    echo mycd: bad argument count\n    exit 1\n```\n\n```\nfi\n```\n\n```\n}\n\
    ```\n\n```\n$ .myfuncs  Read in definition\n```\n\n```\n$pwd\n/users/steve\n```\n\
