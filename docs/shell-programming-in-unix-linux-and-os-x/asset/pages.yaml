- pgno: 24
  md: '# # A Quick Review of the Basics


    This chapter provides a review of the Unix system, including the file system,
    basic commands, filename substitution, I/O redirection, and pipes.


    # ## Some Basic Commands


    # ### Displaying the Date and Time: The date Command


    The date command tells the system to print the date and time:


    ```

    $ date

    Thu Dec 3 11:04:09 MST 2015

    $

    ```


    date prints the day of the week, month, day, time (24-hour clock, the system''s
    time zone), and year. Throughout the code examples in this book, we use **boldface
    type like this**, it''s to indicate what you, the user, to type in. *Normal* type
    like this is used to indicate what the Unix system prints. *Italic* type is used
    for comments in interactive sequences.


    Every Unix command is submitted to the system with the pressing of the **Enter**
    key. *Enter* says that you are finished typing in and are ready for the Unix system
    to do its thing.


    # ## Finding Out Who''s Logged In: The who Command


    The `who` command can be used to get information about all users currently logged
    in to the system:


    ```

    $ who

    pat     tty29 Jul 19 14:40

    ruth    tty37 Jul 19 10:54

    steve   tty25 Jul 19 15:52

    $

    ```'
  merge: -1
  img_proc: true
- pgno: 25
  md: "# Chapter 1 A Quick Review of the Basics\n\nHere, three users are logged in:\
    \ pat, ruth, and steve. Along with each user ID is listed the tty number of that\
    \ user and the day and time that user logged. The tty number is a unique identification\
    \ number the Unix system gives each terminal or network device that is on when\
    \ they log into the system.\n\nThe who command can also be used to get information\
    \ about yourself:\n\n```\n$ who am i\npat\ntty29 Jul 19 14:40\n$ \n```\n\nwho\
    \ and who am are actually the same command: In the latter case, the am and i are\
    \ arguments to the who command (This isn't a good example of how command arguments\
    \ work; it's just a curiosity of the who command.)\n\n# Echoing Characters: The\
    \ echo Command\n\nThe echo command prints (or echoes) at the terminal whatever\
    \ you happen to type on the line (there are some exceptions to this that you'll\
    \ learn later):\n\n```\n$ echo is a test\nthis is a test\n$ echo why not print\
    \ out a longer line with echo?\nwhy not print out a longer line with echo?\n$\
    \ echo\n```\n\n```\nA blank line is displayed\n$ echo one two three four five\n\
    one one two three four five\n$ \n```\n\nYou will notice from the preceding example\
    \ that echo squeezes out blanks between words. That's because on a Unix system,\
    \ the words are important while the blanks are there to separate the words. Generally,\
    \ the Unix system ignores extra blanks (you'll learn more about this in the next\
    \ chapter).\n\n# Working with Files\n\nThe Unix system recognizes only three types\
    \ of files: ordinary files, directory files, and special files. An ordinary file\
    \ is just that: any file on the system that contains data, text, program instructions,\
    \ or just anything else. Directories, or folders, are described later in this\
    \ chapter. Finally, as its name implies, a special file has a special meaning\
    \ to the Unix system and is typically associated with some form of I/O.\n\nA filename\
    \ is composed of just any character directly available from the keyboard (and\
    \ even some that aren't) provided that the total number of characters contained\
    \ in the name is not greater than 255. If more than 255 characters are specified,\
    \ the Unix system simply ignores the extra characters."
  merge: -1
  img_proc: true
- pgno: 26
  md: 'The Unix system provides many tools that make working with files easy. Here
    we''ll review

    some of the basic file manipulation commands.


    # Listing Files: The ls Command


    To see what files you have stored in your directory, you can type the ls command:


    ```

    $ ls

    READ_ME

    names

    tmp

    $

    ```


    This output indicates that three files called READ_ME, names, and tmp are contained
    in the

    current directory. (Note that the ls may vary from system to system. For example,

    on many Unix ls produces multicolumn output when sending its output to a

    terminal; or, different colors may be used for different types of files. You can
    always

    force single-column output with the -l option—that''s the number one.)


    # Displaying the Contents of a File: The cat Command


    You can examine the contents of a file by using the cat command. (That''s short
    for "concatenate",

    if you''re feeling feline thoughts.) The argument to cat is the name of the file
    whose contents

    you want to examine.


    ```

    $ cat names

    Susan

    Jeff

    Henry

    Allan

    Ken

    $

    ```


    # Counting the Number of Words in a File: The wc Command


    With the wc command, you can get a count of the total number of lines, words,
    and characters

    contained in a file. Once again, the name of the file is expected to be specified
    as the argument

    to this command:


    ```

    $ wc names

    5       7       27 names

    $

    ```


    The wc command lists three numbers followed by the filename. The first number
    represents the

    number of lines in the file (5), the second number of words (7), and the third
    number

    of characters (27).'
  merge: -1
  img_proc: true
- pgno: 27
  md: '# Command Options


    Most Unix commands allow the specification of options at the time a command is
    executed. These options generally follow the same format:


    ```

    -letter

    ```


    That is, a command option is a minus sign followed immediately by a single letter.
    For example, to count the number of lines contained in the file, the option -1
    (that''s the -l) is given by the wc -1 command:


    ```

    $ wc -1 names

    ```


    5 names


    ```

    $

    ```


    To count the number of characters in a file, the -c option is specified:


    ```

    $ wc -c names

    ```


    27 names


    ```

    $

    ```


    Finally, the -w option can be used to count the number of words contained in the
    file:


    ```

    $ wc -w names

    ```


    24 names


    ```

    $

    ```


    Some commands require that the options be listed before the filename arguments.
    For example, sort names -r is acceptable, whereas wc names -1 is not. Still, the
    former is unusual and most Unix commands are designed for you to specify options
    first, as exemplified by wc -1 names.


    # Making a Copy of a File: The cp Command


    To make a copy of a file, use the cp command. The first argument to the command
    is the name of the file to be copied (as the source file), and the second argument
    is the name of the file to place the copy into known (as the destination file).
    You can make a copy of the file names and call it saved_names as follows:


    ```

    $ cp names saved_names

    ```


    ```

    $

    ```


    Execution of this command causes contents of the file names to be copied into
    a new file named saved_names. With many Unix commands, the fact that no output
    other than a command prompt was displayed after the cp command proved indicates
    that the command executed successfully.


    # Renaming a File: The mv Command


    A file can be renamed with the mv (“move”) command. The arguments to the mv command
    follow the same format as the cp command. The first argument is the name of the
    file to be'
  merge: -1
  img_proc: true
- pgno: 28
  md: 'renamed, and the second argument is the new name. So, to change the name of
    the file

    saved_names to hold_it, for example, the following command would do the trick:


    ```

    $ mv saved_names hold_it

    $

    ```


    Be careful! When executing an mv or cp command, the Unix system does not care
    whether the

    file specified as the second argument already exists. If it does, the contents
    of the file will be

    lost. For example, if a file called old_names exists, executing the command


    ```

    cp names old_names

    ```


    would copy the filenames to old_names, destroying the previous contents of old_names
    in the

    process. Similarly, the command


    ```

    mv names old_names

    ```


    would rename names to old_names, even if the file old_names existed prior to execution
    of

    the command.


    # Removing a File: The rm Command


    Use the rm command to remove a file from the system. The argument to rm is simply
    the name

    of the file to be removed:


    ```

    $ rm hold_it

    $

    ```


    You can remove more than one file at a time with the rm command by simply specifying
    all

    files on the command line. For example, the following would remove the three files
    wb,

    collect, and mon:


    ```

    $ rm wb collect mon

    $

    ```


    # Working with Directories


    Suppose that you had a set of files consisting of various memos, proposals, and
    letters.

    Further suppose that you had another set of files that were computer programs.
    It would seem

    logical to group this first set into a directory called documents and the latter
    into a directory

    called programs. Figure 1.1 illustrates such a directory organization.


    ![](img/dc544c8aef1333b25eff1c794c2e5ec2_28_0.png)


    Figure 1.1 Example directory structure'
  merge: -1
  img_proc: true
- pgno: 29
  md: '# Chapter 1 A Quick Review of the Basics


    The file directory documents contains the files plan, dact, sys.A, new.hire, no.JSK,
    and AMG.reply. The directory programs contains the files wb, collect, and mon.
    At some point, you may decide to further categorize the files in a directory.
    This can be done by creating subdirectories and placing each file into the appropriate
    subdirectory. For example, you might want to create subdirectories memos, proposals,
    and letters inside your documents directory, as shown in Figure 1.2.


    ![](img/dc544c8aef1333b25eff1c794c2e5ec2_29_0.png)


    Figure 1.2 Directories subdirectories


    documents contains the subdirectories memos, proposals, and letters. Each of these
    subdirectories in turn contain two files: memos contains plan and dact; proposals
    contain sys.A and new.hire; letters contain no.JSK and AMG.reply.


    Although each file in a given directory must have a unique name, files contained
    in different directories do not. So you could have a file in your programs directory
    called dact, even though a file by that name also exists in the memos subdirectory.


    # The Home Directory and Pathnames


    The Unix system always associates each user of the system with a particular directory.
    When you log in to the system


    Although the location of users'' home directories can vary from one system to
    the next, let''s assume that your home directory is called steve and that this
    is actually a subdirectory of a directory called users. Therefore, if you had
    the directories documents and programs, the overall directory structure would
    actually look something like Figure 1.3. A special directory named (pronounced
    "slash") is shown at the top of the directory tree. This directory is known as
    the root.


    Whenever you are "inside" a particular (called your current working directory),
    the files contained within that directory are immediately accessible, without
    specifying any path information. If you want to access a file from another directory,
    you can either issue a command to "change" to the appropriate directory and then
    access the particular file, or you can specify the particular file by its pathname.'
  merge: -1
  img_proc: true
- pgno: 30
  md: '# Working with Directories


    ![](img/dc544c8aef1333b25eff1c794c2e5ec2_30_0.png)


    Figure 1.3 Hierarchical directory structure


    A pathname enables to uniquely identify a particular file to the Unix system.
    In the specification of a pathname, successive directories along the path are
    separated by the slash character /. A pathname that begins with a slash character
    is known as a full or absolute pathname because it specifies a complete path from
    the root. For example, the pathname /users/steve/ identifies the directory steve
    contained within the directory users. Similarly, the pathname /users/steve/documents
    references the directory documents contained in the directory steve. As a final
    example, the pathname /users/steve/documents/letters/AMG.reply identifies the
    file AMG.reply contained along the appropriate directory path.


    To reduce the typing that would otherwise tedious, Unix provides certain conveniences.
    A pathname that does not begin with a slash is known as a relative pathname: the
    path is relative to your current working directory. For example, if you just logged
    into the home directory /users/steve, you could directly reference the directory
    documents by simply typing documents. Similarly, the relative pathname programs/mon
    could be typed to access the file mon contained inside your programs directory.


    By convention, .. always references the directory that is one level higher than
    the current directory, known as the parent. For example, if you were in your home
    directory /users/steve, the pathname .. would reference the directory users. If
    you had the appropriate command to change your working directory to documents/letters,
    the pathname .. would reference the documents directory, ../.. would reference
    the directory steve, and ../../proposals/new.hire would reference the file new.hire
    contained in the proposals directory. There is usually more than one way to specify
    a path to a particular file, a very Unix-y characteristic.'
  merge: -1
  img_proc: true
- pgno: 31
  md: '# Chapter 1. A Quick Review of the Basics


    Another notational convention is the single period ., which always refers to the
    current directory. That''ll become important later in the book when you want to
    specify a shell script in the current directory, not one in the PATH. We''ll explain
    this in more detail soon.


    # Displaying Your Working Directory: The pwd Command


    The pwd command helps you to "get your bearings" by telling you the name of your
    current working directory.


    Recall the directory structure from Figure 1.3. The directory that you are placed
    in you log into the system is your home directory. You can assume from Figure
    1.3 that the home directory for the user steve is /users/steve. Therefore, whenever
    steve logs into the system, it will automatically be placed inside this directory.
    To verify that this is the case, the pwd (print working directory) command can
    be executed:


    ```

    $ pwd

    /users/steve

    $

    ```


    The output from the command verifies that steve''s current working directory is
    /users/steve.


    # Changing Directories: The cd Command


    You can change your current working directory by using the cd command. This command
    takes as its argument the name of the target or destination directory.


    Let''s assume that you just logged into the system and were placed in your home
    directory, /users/steve. This is depicted by the arrow in Figure 1.4.


    You know that two directories are "below" steve''s home directory: documents and
    programs. This can be easily verified at the terminal by issuing the ls command:


    ```

    $ ls

    documents

    programs

    $

    ```


    The ls command lists the two directories documents and programs the same way it
    listed other ordinary files in previous examples.'
  merge: -1
  img_proc: true
