    ''command'' or

    $ (command)

    Executes command and inserts standard output at that point.


    # Tilde Substitution


    Each word and variable on a line is checked to see whether it begins with an

    unquoted -. If it does, the rest of the word or variable to a / is considered
    a log name and

    is looked up in a system file, typically /etc/passwd. If that user exists, their
    home directory

    places the ~ and the name. If that user does not exist, the text is unchanged.
    A ~ by itself

    followed by a / is replaced by the HOME variable.'
