    The operator is used to test whether two values are identical. In this case, we''re
    testing to see whether the contents of the shell variable name are identical to
    the characters julio. If it is, test returns an exit status of zero; nonzero otherwise.


    Note that test must serve all operands ($name and julio) and operators (=) as
    separate arguments, meaning that they must be delimited by one or more whitespaces.


