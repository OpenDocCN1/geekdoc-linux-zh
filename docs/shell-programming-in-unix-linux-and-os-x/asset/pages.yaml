- pgno: 84
  md: '# cut 65


    As shown, four people are logged in. Suppose that you just want to know the names
    of the logged-in users and don''t care about what terminals they are on or when
    they logged in. You can use the cut command to cut out just the usernames from
    the who command''s output:


    ```

    $ who | cut -c1-8

    root

    steve

    george

    dawn

    $

    ```


    Extract the first 8 characters


    The -c1-8 option to cut specifies characters 1 through 8 are to be extracted from
    line of input and written to standard output.


    The following shows how you can track a sort to the end of the preceding pipeline
    to get a sorted list of the logged-in users:


    ```

    $ who | cut -c1-8 | sort

    dawn

    george

    root

    steve

    $

    ```


    Note, this is our first-command pipe. Once you get the concept of output connected
    to subsequent input, pipes of three, four or more commands are logical and easy
    to assemble.


    If you wanted to see which terminals were currently being used or pseudo virtual
    terminals were in use, you could cut out just the tty field from the who command
    output:


    ```

    $ who | cut -c10-16

    console

    tty02

    tty08

    tty10

    $

    ```


    How did you know that who displays the terminal identification in character positions
    10 through 16? Simple! You executed the who command at your terminal and counted
    out the appropriate positions.


    You can use cut to extract as many different characters from a line as you want.
    Here, cut is used to display the username and login of all logged-in users:


    ```

    $ who | cut -c1-8,18-

    root

    Feb 24 08:54

    steve

    Feb 24 12:55

    george

    Feb 24 09:15

    dawn

    Feb 24 15:55

    $

    ```'
  merge: -1
  img_proc: true
- pgno: 85
  md: '# Chapter 3 Tools of the Trade


    The option -c1-18- specifies "extract characters 1 through 8 (the username) and
    also characters 18 through the end of the line (the login time)."


    # The -d and -f Options


    The cut command with its -c flag is useful when you need to extract data from
    a file or command, provided that the file or command has a fixed format.


    For example, you could use cut with the who command because you know that the
    usernames are always displayed in character positions 1–8, the terminal in 10–16,
    and the login time in 18–29. Unfortunately, not all data will be so well organized!


    For instance, take a look at the /etc/passwd file:


    ```

    $ cat /etc/passwd

    root:0:0:The User:/usr/bin/ksh

    cron*:1:1:Cron Daemon for periodic tasks:

    bin*:3:3:The owner of system files:

    uucp*:5:5:/usr/sbin:/usr/lib/uucp/uucico

    asg*:6:6:The Owner of Assignable Devices:

    steve*:20:100:/users/steve:/usr/bin/ksh

    other*:4:4:Needed by secure program:

    ```


    $ is the master file that contains the usernames of all users on your system.
    It also contains other information such as user ID, home directory, and the name
    of the program to start up when particular user logs in.


    Quite clearly, the data in this file does not line up anywhere as neatly as the
    who’s output does. Extracting a list of all users from your system can be done
    using the -c option to cut.


    Upon inspection of the file, it’s clear that fields are separated by a character.
    Each field may not be the same length from one line to the next, so you can "count
    columns" to get the same field from each line.

    The -d and -f options are used with cut when you have data that is delimited by
    a particular character, with -d specifying the field delimiter and -f the fields
    you want to extract. The invocation of the cut command bema


    ```

    cut -dchar -fields file

    ```


