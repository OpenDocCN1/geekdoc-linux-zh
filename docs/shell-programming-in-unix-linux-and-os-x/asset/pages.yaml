- pgno: 228
  md: '# 10


    # Your Environment


    When you log on to your system, whether it''s a shiny new Mac OS X Terminal app,
    a clean Linux install, or a Unix server in the back office, you''re effectively
    given your own copy of the shell program. This login shell maintains what''s known
    as your environment—a configuration that is distinct from other users on the system.
    This environment is maintained from the moment you log on until the moment you
    log off. In this chapter you''ll learn about the shell environment and how it
    relates to writing and running programs.


    # Local Variables


    Type the following program called vartest into your computer:


    ```

    $ cat vartest

    echo $x:

    $

    ```


    vartest consists of a single echo command that displays the value of the variable
    x surrounded by colons.


    Assign any value you want to the variable x from your terminal:


    ```

    $ x=100

    ```


    Question: What do you think will be displayed when vartest is now executed? Answer:


    ```

    $ vartest

    ::

    $

    ```


    vartest doesn''t know about the value of x. Therefore, its value is the default:
    null. the variable x that was assigned the value 100 in the login shell is known
    as a local variable. The reason why it has this name will become clear shortly.'
  merge: -1
  img_proc: true
- pgno: 229
  md: 'Here''s another example called vartest2:


    ```

    $ cat vartest2

    x=50

    echo :x

    $ x=100

    $ vartest2      Execute it

    :50

    $

    ```


    Since the script changed the value of x from 10 to 50, the question is: What''s
    the value of x after the script completes?


    ```

    $ echo $x

    100

    $

    ```


    You can see that vartest2 didn''t change the value of x, previously set to 100
    in the interactive shell.


    # Subshells


    The seemingly weird behavior exhibited by vartest and vartest2 is due to the fact
    that these programs are run within subshells by your login shell. A subshell is
    essentially an entirely new shell just to run the desired program.


    When you ask the login shell to execute vartest, it starts up a new shell to execute
    the program. Whenever a new shell runs, it runs in its own environment, with its
    set of local variables. A subshell has no knowledge of variables that were assigned
    by the login shell (the parent shell). Furthermore, a subshell cannot change the
    value of a variable in the parent shell, as evidenced by vartest2.


    Let''s review the process that goes on here so you can better understand what''s
    called scoping of variables in shell programs: Before executing vartest2, your
    shell has a variable x that has been assigned the value 100. This is depicted
    in Figure 10.


    ![](img/dc544c8aef1333b25eff1c794c2e5ec2_229_0.png)


    Figure 10.1 Login shell with x=100


    When you invoke vartest2, your shell starts up a subshell to run it, giving it
    an empty list of local variables to start with (see Figure 10.2).'
  merge: -1
  img_proc: true
- pgno: 230
  md: '![](img/dc544c8aef1333b25eff1c794c2e5ec2_230_0.png)


    ![](img/dc544c8aef1333b25eff1c794c2e5ec2_230_1.png)


    Figure 10.2 Login shell executes vartest2


    After the first command in vartest2 is executed, assigning 50 to x, the local
    variable x that exists in the subshell''s environment will have the value 50 (see
    Figure 10.3) but the value of x in the parent shell will be unchanged.


    ![](img/dc544c8aef1333b25eff1c794c2e5ec2_230_2.png)


    ![](img/dc544c8aef1333b25eff1c794c2e5ec2_230_3.png)


    Figure 10.3 vartest2 executes x=50


    vartest2 finishes execution, the subshell goes away, together with any variables
    assigned by the program.


    This is less of a problem than it might seem. You just need to understand that
    the login shell environment and the environment of subshells and their shell programs
    are very different.


    # Exported Variables


    There is a way to make the value of a variable known to a subshell, and that''s
    by exporting it with the export command. The format of this command is simply'
  merge: -1
  img_proc: true
- pgno: 231
  md: 'export variables


    where variables is the list of variable names that you want exported. For any
    subshells that get executed subsequent to the export command, the value of the
    exported variables will be passed to the subshell.


    Here’s a program called vartest3 to help illustrate the difference between local
    and exported variables:


    ```

    $ cat vartest3

    echo x = $x

    echo y = $y

    $

    ```


    Assign values to the variables x and y in the login shell, and then run vartest3:


    ```

    $ x=100

    $ y=10

    $ vartest3

    ```


    ```

    x=

    y=

    $

    ```


    x and y are both local variables, so their values aren’t passed down to the subshell
    that runs vartest3. That’s expected.


    But let''s export the variable y and try the program again:


    ```

    $ export y

    $ vartest3

    ```


    ```

    x=

    y=10

    $

    ```


    This time vartest3 knew about y because it is an exported variable.


    Conceptually, whenever a subshell is executed the exported variables get “copied
    down” to the subshell, whereas the local variables do not (see Figure 10.4).


    ![](img/dc544c8aef1333b25eff1c794c2e5ec2_231_0.png)'
  merge: -1
  img_proc: true
- pgno: 232
  md: 'It''s time for another question: What do you think happens if a subshell changes
    the value of an exported variable? That is, the parent shell will know about it
    after the subshell has finished?


    To answer this question, here''s a program called vartest4:


    ```

    $ cat vartest4

    x=50

    y=5


    ```


    We''ll assume that you haven''t changed the values of x and y, and that y is still
    exported from the previous example.


    ```

    $ vartest4

    $ echo $x $y

    100


    ```


    The subshell couldn''t change the value of either the local variable x (no surprise!)
    or the exported variable, it merely changed its local subshell copy of y that
    was instantiated when it was executed. Just as with local variables, when a subshell
    goes away, so do the values of the exported variables. In fact, once they get
    to the subshell, they are local variables.


    That''s why this is true: There is no way to change the value of a variable in
    a parent shell from within a subshell.


    ![](img/dc544c8aef1333b25eff1c794c2e5ec2_232_0.png)'
  merge: -1
  img_proc: true
- pgno: 233
  md: 'In the case of a shell program invoking another shell program (for example,
    the rolo program calling the lu program), the process is repeated: the exported
    variables from the subshell are copied to the new subshell. These exported variables
    may have been exported from the login shell, or newly exported from within the
    subshell.


    After a variable is exported, it remains to all subshells subsequently executed.


    Consider a modified version of vertest4:


    ```

    $ cat vertest4

    x=50

    y=5

    z=1

    export z

    vertest5

    $

    ```


    and vertest5:


    ```

    $ cat vertest4

    echo x = $x

    echo y = $y

    echo z = $z

    $

    ```


    When vertest4 gets executed, the exported variable y will be copied into the subshell''s
    environment, vertest4 sets the value of x to 50, changes the value of y to 5,
    and sets the value of z to 1. Then it exports z which makes the value of z accessible
    to any subshell.


    vertest5 is such a subshell and when it is executed the shell copies into its
    environment the exported variables from vertest4: y and z.


    This explains the following output:


    ```

    $ vertest4

    x=

    y = 5

    z = 1

    $

    ```


    This entire process is depicted in Figure 10.6.'
  merge: -1
  img_proc: true
- pgno: 234
  md: '# Exported Variables 215


    ![](img/dc544c8aef1333b25eff1c794c2e5ec2_234_0.png)


    Figure 10.6 Subshell execution


    To summarize the local and exported variables work:


    +   1. Any variable that is not exported is a local variable whose existence will
    not be known to its subshells.


    +   2. Exported variables and their values are copied into a subshell''s environment,
    where they may be accessed and changed. However, such changes have no effect on
    the variables in the parent shell.


    +   3. Exported variables retain this characteristic not only for directly spawned
    subshells, but also for subshells spawned by those subshells (and so on the down
    line).


    +   4. A variable can be exported any time or after it is assigned a value but
    takes on at the moment of export; subsequent changes aren''t tracked.


    # export -p


    If you export -p, you''ll get a list of the variables and their values exported
    by your shell:


    ```

    $ export -p

    export LOGNAME=steve

    export PATH=/usr/bin::

    export TIMEOUT=600

    export TZ=EST5EDT

    export y=10

    $

    ```'
  merge: -1
  img_proc: true
- pgno: 235
  md: "As you can see, there are actually lots of exported variables in a typical\
    \ login shell. On the\nMac, export -p produces a list of 22 variables. Note that\
    \ in the example y shows up from our\nerlier export experimentation, along with\
    \ other variables that were exported when you logged\non and your login shell\
    \ was started.\n\nBut are these all-capital-letter exported variables? Let's have\
    \ a closer look.\n\n# PS1 and PS2\n\nThe sequence of characters that the shell\
    \ uses as your command prompt are stored in the\nenvironment variable PS1. It\
    \ turns out that you can change this to be anything you want and\nas as you change\
    \ it, the new value will be used by the shell from that point on.\n\n```\n$ echo\
    \ :PS1:\n:\n$ PS1=\"==\"\n==> pwd\n/users/steve\n==> PS1=\"I await your next command,\
    \ master: \"\nI await your next command, master: date\nWed Sep 18 14:46:28 EDT\
    \ 2002\nI await your next command, master: PS1=\"$\n    Back to normal\n```\n\n\
    Your secondary command prompt, used when a command requires more than a single\
    \ line of\ninput, defaults to > and is kept in the variable PS2. This too you\
    \ can change to your heart's\ncontent:\n\n```\n$ echo :PS2:\n:\n$ PS2=\"======\"\
    \n$ for x in 1 2 3\n======> do\n======> echo $x\n======>\n======> done\n1\n2\n\
    3\n$\n```\n\nOnce you log off the system, all the changes will vanish, just like\
    \ modifications to any other\nshell variables. If you change PS1, the shell will\
    \ use the new value for the remainder of your\nlogin session. Next time you log\
    \ in, however, you'll get the old prompt unless you save the new\nPS1 value by\
    \ adding it to your .profile file (discussed later in this chapter)."
