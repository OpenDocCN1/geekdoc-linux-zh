- pgno: 379
  md: '# Documentation on the Web


    The best place on the Web for information for the POSIX standard is at www.unix.org.
    This site is maintained by The Open Group, an international consortium that worked
    with the IEEE to create the current POSIX specification. The complete specification
    is available on its Web site. You must first register to read, but registration
    is free. The URL for accessing the documentation is www.unix.org/online.html.


    The Free Software Foundation maintains documentation for a variety of Linux and
    Unix utilities, notably Bash and the C compiler, at www.fsf.org/manual.


    David Kohn, the developer of the Korn shell, maintains www.kornshell.com. It contains
    documentation, downloads, information on books on the Korn shell, and links to
    information on other shells.


    If you only access Windows systems but still want to try your head at programming,
    we encourage you to install the Cygwin package from www.cygwin.com. The base system
    includes Bash and lots of other command line utilities, offering a system remarkably
    Linux and Unix like. Best of all, the entire Cygwin package is free to download
    and use.


    # Books


    # O''Reilly & Associates


    A good source of books on Linux and Unix-related topics is O''Reilly and Associates
    (www.ora.com). Their books cover a wide variety of subjects and are available
    from their Web site, from booksellers online, and in book stores. Their Web site
    also has many useful articles on Linux and Unix.


    Two good references on Unix, and literally:


    **Unix in a Nutshell**, 4th Edition, A. Robbins, O''Reilly & Associates, 2005.


    *Linux in a Nutshell*, 6th Edition, E. Siever, S. Figgins, R. Love and A. Robbins,
    O''Reilly & Associates, 2009.


    Two good books on Perl, from beginner to advanced:


    *Learning Perl*, 6th Edition, L. J. Schwartz, B. Foy and T. Phoenix, O''Reilly
    & Associates, 2011.


    *Perl in a Nutshell*, 2nd Edition, S. Spainhour, E. Siever, and N. Patwardhan,
    O''Reilly & Associates, 2002


    A good book covering the POSIX standard versions of `awk` and `sed` as well as
    the GNU tools:


    *Sed & Awk*, 2nd Edition, D. Dougherty and A. Robbins, O''Reilly & Associates,
    1997 (ISBN 978-1-56592-225-9).'
  merge: -1
  img_proc: true
