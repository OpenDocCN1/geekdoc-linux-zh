- pgno: 37
  md: '# Chapter 1. A Quick Review of the Basics


    The directory structure now appears as shown in Figure 1.8.


    ![](img/dc544c8aef1333b25eff1c794c2e5ec2_37_0.png)


    Figure 1.8 Directory structure with newly created misc directory


    # Copying a File from One Directory to Another


    The cp command can be used to copy a file from one directory into another. For
    example, you can copy the file wb from the programs directory into a file called
    wbx in the misc directory as:


    ```

    $ cp programs/wb misc/wbx

    ```


    Because the two files are in different directories, they can safely have the exact
    same name:


    ```

    $ cp programs/wb misc wb

    ```


    When the destination file is going to have the same name as the source file (in
    a different directory, of course), it is necessary to specify only the destination
    directory as the second argument:


    ```

    $ cp programs/wb misc

    ```


    When this command gets, the Unix system recognizes the second argument as a directory
    and copies the source file into that directory. The new file is given the same
    name as the source file.


    You can copy more than one file into a directory by listing the files to be copied
    prior to the name of the destination directory. If you were currently in the programs
    directory, the command


    ```

    $ cp wb collect mon ..//misc

    ```


    would copy the three files wb, collect, and mon into the misc directory, with
    the same filenames.'
  merge: -1
  img_proc: true
- pgno: 38
  md: 'To copy a file from another directory to your current location in the file
    system and give the file same name, use the handy "..'' shortcut for the current
    directory:


    ```

    $ pwd

    /users/steve/misc

    $ cp ../programs/collect

    $

    ```


    The preceding command copies the file from the directory ../programs into the
    current directory (/users/steve/misc).


    # Moving Files Between Directories


    You recall the mv command can be used to rename a file. Indeed, there is no "rename"
    command in Unix. However, when the two arguments reference different directories,
    the file is actually moved from the first directory to the second.


    To demonstrate, from the home directory to the documents directory:


    ```

    $ cd documents

    $

    ```


    Suppose that you now decide that the file contained in the memos directory is
    really a proposal so you want to move it from the memos directory into the proposals
    directory. The following would do the trick:


    ```

    $ mv memos/plan proposals/plan

    $

    ```


    As with the cp command, if the source file and destination file have the same
    name, only the name of the destination directory need be supplied, so there''s
    an easier way to move this file:


    Also like the cp command, a group of files can be simultaneously moved into a
    directory by simply listing all files to be moved before the name of the destination
    directory:


    ```

    $ pwd

    /users/steve/programs

    $ mv wb collect mon ../misc

    $

    ```


    This would move the three files wb, collect, and mon into the directory misc.


    You can also use the mv command to change the name of a directory, as it happens.
    For example, the following renames the programs directory to bin.


    ```

    $ mv programs bin

    $

    ```'
  merge: -1
  img_proc: true
- pgno: 39
  md: '# Linking Files: The ln Command


    So far everything we''ve talked about file management has assumed that a given
    collection of data has one and only one filename, wherever it may be located in
    the file system. It turns out that Unix is more sophisticated than that and can
    assign multiple filenames to the same collection of data.


    The main command for creating these duplicate names for a given file is the ln
    command.


    The general form of the command is


    ```

    ln from to

    ```


    This links the file from to the file.


    Recall the structure of steve''s programs directory from Figure 1.8. In that directory,
    he has stored a program called wb. Suppose that he decides he''d also like to
    call the program writeback. The most obvious thing to do would be to simply create
    a copy of wb called writeback:


    ```

    $ cp wb writeback

    $

    ```


    The drawback with this approach is that now much disk space is consumed by the
    program. Furthermore, if steve changes wb, he may forget to duplicate the change
    in writeback, resulting in two, out of sync copies of what he thinks is the same.
    Not so good, Steve!


    By linking the file to the new name, these problems are solved:


    ```

    $ ln wb writeback

    $

    ```


    Now instead of two copies of the file existing, only one exists with two different
    names: wb and writeback. The two files have been logically linked by the Unix
    system.


    As far as you''re concerned, it appears as though you have two different files.
    Executing an ls command shows the two separately:


    ```

    $ ls

    collect

    mon

    wb

    writeback

    $

    ```


    Where it gets interesting is when you use ls -l:


    ```

    $ ls -l

    total 5

    -rwxr-xr-x steve DP3725 358 Jun 25 13:31 collect

    -rwxr-xr-x steve DP3725 1219 Jun 25 13:31 mon

    -rwxr-xr-x steve DP3725 89 Jun 25 13:30 wb

    -rwxr-xr-x steve DP3725 89 Jun 25 13:30 writeback

    $

    ```'
  merge: -1
  img_proc: true
- pgno: 40
  md: "# Working with Directories\n\nLook closely at the second column of the output:\
    \ The number shown is 1 for collect and mon and 2 for wb and writeback. This is\
    \ the number of links to a file, normally 1 for nonlinked, nondirectory files.\
    \ Because wb and writeback are linked, however, this number is 2 for these files\
    \ (or, more correctly, this file with two names).\n\nYou can remove either of\
    \ the linked files at any time, and the other will not be removed:\n\n```\n$ rm\
    \ writeback\n$ ls -l\ntotal 4\n-rwwxr-xr-x 1 pat DP3725 358 Jun 25 13:31 collect\n\
    -rwwxr-xr-x 1 pat DP3725 1219 Jun 25 13:31 mon\n-rwwxr-xr-x 1 pat DP3725  89 Jun\
    \ 25 23:30 wb\n$ \n```\n\nNote that the number of links on wb went 2 to 1 because\
    \ one of its links was removed.\n\nMost often, ln is used to make a file to appear\
    \ in more than one directory simultaneously. For example, suppose that pat wanted\
    \ to access to steve's wb program. Instead of making a copy for himself (subject\
    \ to the same sync problems described previously) or including steve's programs\
    \ in his PATH (which has security risks described in Chapter 10, \"Your Environment\"\
    ), can simply link the file from his own directory:\n\n```\n$ pwd\n/users/pat/bin\
    \    pat's program directory\n$ ls -l\ntotal 4\n-rwwxr-xr-x 1 pat DP3822 1358\
    \ Jan 15 11:01 lcat\n-rwwxr-xr-x 1 pat DP3822 504 Apr 21 18:30 xtr\n$ ln -1 /users/steve/wb\
    \    link wb to pat's bin\n$ ls -l\ntotal 5\n```\n\n```\n-rwwxr-xr-x 1 pat DP3822\
    \ 1358 Jan 15 11:01 lcat\n-rwwxr-xr-x 1 pat DP3725  89 Jun 25 23:30 wb\n-rwwxr-xr-x\
