    # Matching Zero or More Characters: The Asterisk (*)


    The asterisk is used by the shell for filename substitution to match zero or more
    characters.

    informing regular expressions, the asterisk is used to match zero or more occurrences
    of the

    preceding element of the regular expression (which may itself be another regular
    expression).


    So, for example, the regular expression


    ```

    x*

    ```


    matches zero, one, two, three, ... capital x''s while the expression


    ```

    xx*

    ```


    matches one or more capital x''s, because the expression specifies a single x
    followed by zero

    or more x''s. You can accomplish the same effect with a + instead: it matches
    one or more of the

    preceding expression, so xx and x+ are identical in function.


    A similar type of pattern is frequently used to match one or more blank spaces
    in the line:


    ```

    $ ed lotspaces

    ```


