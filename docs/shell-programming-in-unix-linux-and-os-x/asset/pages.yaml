- pgno: 194
  md: "# More on Loops\n\nWhen the break is executed, control is immediately moved\
    \ outside of the loop, where execution then continues as normal.\n\nOne common\
    \ way this is with an infinite loop, a block of code that is intended to go around\
    \ and around executing the same commands until break stops it.\n\nIn these situations\
    \ the command true can be used to return an exit status of zero. The command false\
    \ can be used in the opposite situation too, as it returns a nonzero exit status.\
    \ If you write\n\n```\nwhile true\ndo\n  ...\ndone\n```\n\nthe while loop will\
    \ be executed before, because true always returns a zero exit status.\n\nBecause\
    \ false always returns a nonzero exit status, the loop\n\n```\nuntil false\ndo\n\
    \  ...\ndone\n```\n\nwill also execute forever.\n\nThe break command is therefore\
    \ used to exit from these sorts of infinite loops, usually when an error condition\
    \ or the end of processing is detected:\n\n```\nwhile true\ndo\n  cmd=$(getcmd)\n\
    \n  if [ \"$cmd\" = quit ];\n    break\n  else\n    processcmd \"$cmd\"\n  fi\n\
    ```\n\nThe while loop will continue to execute the getcmd and processcmd programs\
    \ until cmd is equal to quit. At that point, the break command will be executed,\
    \ causing the loop to be exited.\n\nIf the break command is used in the form\n\
    \n```\nbreak \n\nThe innermost loops are immediately exited, so in\n```\n\n```\n\
    for file\ndo\n  ...\n```"
  merge: -1
  img_proc: true
