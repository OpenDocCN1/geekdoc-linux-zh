- pgno: 300
  md: "The rem program collects all matching entries into a temporary file, tests\
    \ the result: If the size of the file is zero, no match was found and an error\
    \ message is issued. Otherwise, for each matching entry, the program displays\
    \ the entry and asks the user whether that entry should be removed.\n\nFrom a\
    \ user experience perspective, this type of coding practice provides reassurance\
    \ to the user that they intend to remove the one that the program is going to\
    \ remove, even in the single case.\n\nAfter the user has prompted the program\
    \ with y, a break command exits the loop. Outside the loop, the program then tests\
    \ the value of answer to determine how the loop was exited. If its value is not\
    \ equal to y, then the user does not want to remove an entry after all (for whatever\
    \ reason). Otherwise, the program proceeds with the removal of all lines that\
    \ don't match the specified pattern. Note that grep matches only entire lines\
    \ by greping the regular expression to the start and end of line.\n\nNote also\
    \ in the edge case of removing the last entry in their phonebook, the script now\
    \ recognizes the situation (by testing to see if the file exists and is non-zero\
    \ in size) and outputs an informative message. It's not an error, but it ensures\
    \ that the failure message that would be triggered by the grep -v invocation is\
    \ not displayed.\n\n# change\n\n```\n#\n# Change an entry in the phone book\n\
    #\nname=$1\n```\n\n```\n\n# Get matching entries and save in temp file\n#\ngrep\
    \ -i \"$name\" $PHONEBOOK > /tmp/matches$$\\nif [ ! -s /tmp/matches$$ ]; then\n\
    \  echo \"I can't find $name in the phone book\"\n  exit 1\nfi\n```\n\n```\n\n\
    \n# Display matching entries one at a time and confirm change\n#\n```\n\n```\n\
    \nwhile read line\ndo\n  display \"$line\"\n  echo \"Change this entry (y/n)?\
    \ \\c\"\n```"
