- pgno: 156
  md: 'Other operators can be used to test character strings. There are a number of
    them, as summarized in Table 7.1.


    Table 7.1 test String Operators


    | Operator | Returns TRUE (exit status of 0) if |

    | --- | --- |

    | string_1 = string_2 | string_1 is identical to string_2 |

    | string_1 != string_2 | string_1 is not identical to string_2 |

    | string | string is not null |

    | -n string | string is not null (string must be seen by test) |

    | -z string | string is null (and string must be seen by test) |


    You''ve seen how the = operator is used. The != operator is similar, except it
    tests two strings for inequality. That is, the exit status from test is 0 if the
    two strings are not equal, and nonzer they are.


    Let''s look at three similar examples.


    ```

    $ day="monday"

    $ test "$day" = monday

    $ echo $?

    0

    $

    ```


    True


    The test command returns an exit status of 0 because the value of day is equal
    to the characters. Now look at the following:


    If you wanted these two values to be considered equal, omitting the double quotes
    would have caused the shell to "eat up" the trailing space character, and test
    would have never seen it:


    ```

    $ day="monday"

    $ test $day = monday

    $ echo $?

    0

    $

    True

    ```'
  merge: -1
  img_proc: true
- pgno: 157
  md: 'Although this seems to violate our rule about always quoting shell variables
    that are arguments to test, it''s better to omit the quotes if you''re sure that
    the variable is not null (and not composed entirely of whitespaces characters).


    You can test to see whether a shell variable has a null value with the third operator
    listed in Table 7.1:


    ```

    test $day*

    ```


    This returns TRUE if day is not null and FALSE if it is. Quotes are not necessary
    here because test doesn''t care whether it sees an argument in the shell case.
    Nevertheless, you are better off using them as well if the variable consists entirely
    of whitespaces characters, the shell will get rid of the argument if it''s not
    enclosed in quotes.


    ```

    $ blanks "  "

    $ test $blanks          Is it not null?

    $ echo ?               False—it''s null

    1

    $ test "$blanks"      And now?

    $ echo ?               0

    $                       True—it''s not null

    ```


    In the first case, test was not passed any arguments because the shell ate up
    the four spaces in blanks. In the second case, test got one argument consisting
    of four space characters which is not null.


    In case we seem to be elaborating the point about blanks and quotes, realize that
    this is a frequent source of shell programming errors. It''s good to really understand
    the principles to save yourself a lot of programming headaches in the future.


    There is another way to test whether a string is null, and with either of the
    last two operators listed previously in Table 7.1. The -n operator returns an
    exit status of zero if the argument is not null. Think of this operator as testing
    for nonzero length.


    The -z operator tests the argument that follows to see whether it is null and
    returns an exit status of zero if it is true. Think of this operator as testing
    to see whether the following argument has zero length.


    So the command


    ```

    test -n $day*

    ```


    returns an exit status of 0 if day contains at least one character. The command


    ```

    test -z $dataflag

    ```


    returns an exit status of 0 if dataflag doesn''t contain any characters. That
    is, -n and -z are the opposite of each other, and both exist to make it easier
    to clear, readable conditional statements.'
  merge: -1
  img_proc: true
- pgno: 158
  md: '# The test Command


    Be warned that both of the preceding operators expect an argument to follow, so
    get into the

    habit of enclosing the argument within double quotes.


    ```

    $ nullvar=

    $ nonnullvar=abc

    $ test -n "$nullvar"

    $ echo $?

    ```


    Does nullvar have nonzero length?


    ```

    1

    $ test -n "$nonnullvar"

    $ echo $?

    ```


    No

    And what about nonnull?


    ```

    0

    $ test -z "$nonnullvar"

    $ echo $?

    ```


    Yes

    Does nullvar have zero length?


    ```

    1

    $ test -z "$nonnullvar"

    $ echo $?

    ```


    Yes

    And nonnull?

    No


    Note that test can also be picky about its arguments. For example, if the shell
    variable symbol

    contains an equals sign, look at what happens if you try to test it for test length:

    $ echo $symbol


    ```

    $ test -z "$symbol"

    sh: test: argument expected

    $

    ```


    The operator has higher precedence than the -z operator, so test attempts to process
    the

    command as an equality test, and expects an argument to follow the =. To avoid
    this sort of

    problem, many shell programmers write their test commands as


    test X"symbol" = X


    which will be true if symbol is null, and if it''s not. The X in front of symbol
    prevents test

    from interpreting the characters stored in symbol as an operator.


    # An Alternate Format for test


    The test command is used so often by shell programmers that an alternative format
    of the

    command is available and can make your programs a lot ne: [. This improves the

    readability of if statements and other conditional tests throughout your shell
    scripts.


    You''ll recall the general format of the test command is


    ```

    test expression

    ```


    This can also be expressed in the alternative format as


    ```

    [ expression ]

    ```'
