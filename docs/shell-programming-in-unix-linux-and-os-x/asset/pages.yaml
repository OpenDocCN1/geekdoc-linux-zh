- pgno: 54
  md: '# Standard Error


    The term filter is often used in Unix terminology to refer to any program that
    can take input from standard input, perform some operation on that input, and
    write the results to standard output. More succinctly, a filter is any program
    that can be used to modify the output of other programs in a pipeline. So in the
    pipeline in the previous example, wc is considered a filter. ls is not because
    it does not read its input from standard input. As other examples, cat and sort
    are filters, whereas who, date, cd, pwd, echo, rm, and cp are not.


    # Standard Error


    In addition to standard input and standard output, there is a third virtual device
    known as standard error. This is where most Unix commands write their error messages.
    And as with the other "standard" places, standard error is associated with your
    terminal or terminal app by. In most cases, you never know the difference between
    standard output and standard error:


    Here the "not found" message is actually being written to standard error by the
    ls command. You can verify that this message is not being written to standard
    output by redirecting the ls command''s output:


    ```

    $ ls n* > foo

    n* not found

    ```


    As you can see, the message is still printed out at the terminal and was not added
    to the file foo, even though you redirected standard output.


    The preceding example shows the raison d''être for standard error: so that error
    messages will still be displayed at the terminal even if standard output is redirected
    to a file or piped to another command.


    You can also redirect standard to a file (for instance, if you''re logging a program''s
    potential errors during long-term operation) by using the slightly more complex
    notation


    ```

    command 2> file

    ```


    Note that no space is permitted between the 2 and the >. Any error messages intended
    for standard error will be diverted into the specified file, similar to the way
    standard output gets redirected.


    ```

    $ ls n* 2> errors

    $ cat errors

    n* not found

    $

    ```'
  merge: -1
  img_proc: true
- pgno: 55
  md: '# More on Commands


    # Typing More Than One Command on a Line


    You can type more than one command on a line that you separate them with a semicolon.
    For example, you can find the current time and your current working directory
    by typing in the date and pwd commands on the same line:


    ```

    $ date; pwd

    Sat Jul 20 14:43:25 EDT 2002

    /users/pat/bin

    $

    ```


    You can string out as many commands as you want on the line, as long as each command
    is delimited by a semicolon.


    # Sending a Command to the Background


    Normally, you type in a command and wait for the results of the command to be
    displayed. For all the examples you have seen so far, this waiting time is typically
    short—a fraction of a second.


    Sometimes, however, you may have to run commands that require a few minutes or
    longer to complete. In those cases, you will have to wait for the command to finish
    executing before you proceed, *execute the command in the background*.


    It turns out that your Unix or Linux systems seem like it''s focused completely
    on what you''re doing, all systems are actually multitasking, running multiple
    commands simultaneously at any time. If you''re on an Ubuntu system, it might
    have the window manager, a clock, a status monitor and your terminal window running
    simultaneously. You too run multiple commands simultaneously from the command
    line. That''s the idea of putting a command "into background," letting you work
    on other tasks while it completes.


    The not convention for pushing a command or command sequence into background is
    to append the ampersand character &. This means that the command will no longer
    tie up your terminal, and you can proceed with other work. The *standard output*
    of the command will be directed to your terminal, though in most cases the *standard
    input* will be dissociated from your terminal. If the command tries to read from
    standard input, it will stop and wait for you to bring it to the foreground (we''ll
    discuss this in more detail in Chapter 14, "Interactive and Nonstandard Shell
    Features")


    Here''s an example:


    +   $ sort bigdata > &  Send the command to the background

    [1] 1258 Process id

    $ date  Your terminal is immediately available to do other work

    Sat Jul 20 14:45:09 EDT 2002

    $'
