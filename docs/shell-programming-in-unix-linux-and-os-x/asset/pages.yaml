  md: "The [ is actually the name of the command (who said anything about command\
    \ names having to be alphanumeric characters?). It initiates execution of the\
    \ same test command, but when used this way it expects a closing ] at the end\
    \ of the expression. Spaces must appear after the [ and before the ].\n\nYou can\
