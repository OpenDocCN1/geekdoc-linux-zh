- pgno: 262
  md: "Parameter Substitution 243\n\nWhen you write the construct\n${variable\\pattern}\n\
    \nthe shell looks inside *variable* to see whether it ends with the specified\
    \ *pattern*. If it does, the contents of *variable* are used, with the shortest\
    \ matching *pattern* removed from the right.\n\nIf you use the construct\n${variable\\\
    pattern}\n\nthe shell once again inside *variable* to see whether it ends with\
    \ *pattern*. This time, however, it removes the *longest* matching pattern from\
    \ the right. This is relevant only if the * is used in *pattern*. The % and %%\
    \ behave the same way.\n\nThe # is used in a similar way to force the pattern\
    \ to start from the left rather than the right.\n${variable\\pattern}\n\ntells\
    \ the shell to use the value of *variable* on the command line, with *pattern*\
    \ removed from the left.\n\nFinally, the shell construct\n${variable\\pattern}\n\
    \nworks like the # form, except the longest occurrence of *pattern* is removed\
    \ from the left.\nRemember that in all four cases, no changes are made to the\
    \ pattern itself. You are affecting only what gets on the command line. Also,\
    \ remember that the pattern matches are *anchored*. In the case of the % and %%\
    \ constructs, the variable of match must *end* with the specified pattern; in\
    \ the case of the # and ## constructs, the variable must *begin* with it.\n\n\
    Here are some simple examples to show how these constructs work:\n\n```\n$var-testcase\n\
    $echo $var\ntestcase\n$echo ${var%}      Remove e from right\ntestcas\n$echo $var\n\
    testcase           Variable unchanged\n$echo ${var*e}      Remove smallest match\
    \ from right\ntestca\n$echo ${var%%e}    Remove longest\nte\n$echo ${var#?}  \
    \    Remove smallest match from left\nstcase\n$echo ${var#*}      Remove smallest\
    \ match from left\tcasecase\n$echo ${var##}     Remove longest match from left\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 263
  md: "# 244 Chapter 11 More on Parameters\n\n```\ne\n$ echo ${var#test}    Remove\
    \ test from left\ncase\n$ echo ${var#teas}      No match\ntestcase\n$\n```\n\n\
    There are many practical uses for these constructs. For example, the following\
    \ tests to see whether the filename stored inside the variable file ends in the\
    \ two characters .o:\n\n```\nif [ ${file.*o ] = $file ]; then\n  # file ends in\
    \ .o\n  ...\n```\n\nAnother example, here's a shell program that works just like\
    \ the Unix system's basename command:\n\n```\n$ cat my\necho ${1##*/}\n$\n```\n\
    \nThe program displays its argument with all the characters to the last / removed:\n\
    \n```\n$ basename /usr/spool/uucpublic\nuucpublic\n$ basename $HOME\nsteve\n$\
    \ basename memos\nmemos\n$\n```\n\nBut wait, there are more constructs:\n\n# ${#variable}\n\
    \nNeed to figure out how many characters are stored in a variable? That's just\
    \ what this construct offers:\n\n```\n$ text='The shell'\n$ echo ${#text}\n9\n\
    $\n```\n\n> Tip\nEach of the parameter constructs described in this chapter is\
    \ summarized in Appendix A,\nTable A.3."
  merge: -1
  img_proc: true
- pgno: 264
  md: "# The $0 Variable\n\nWhenever you execute a shell program, the shell automatically\
    \ stores the name of the program inside the special variable $0. This can be helpful\
    \ in a number of situations, including when you have a program accessible through\
    \ different command names through hard links in the file system. It lets you programmatically\
    \ figure out which one was executed.\n\nIt's more commonly used for displaying\
    \ error messages because it is based on the actual program file name, not whatever\
    \ hardcoded in the program itself. If the name of the program is referenced by\
    \ $0, renaming the program will update the message without requiring the program\
    \ to be:\n\n```\n$ cat lu\n#\n# Look someone up in the phone book\n#\n\nif [ \"\
    $0\" -ne 1 ]; then\n  echo \"Incorrect number of arguments\"\n  echo \"Usage:\
    \ $0 name\"\n  exit 1\n```\n\n```\nname=$1\ngrep \"$name\" PHONEBOOK\n```\n\n\
    ```\nif [ $? -ne 0 ]; then\n  echo \"I couldn't find $name in the phone book\"\
    \nfi\n```\n\n```\n$ PHONEBOOK=$HOME/phonebook\n$ export PHONEBOOK\n$ lu Teri\n\
    Teri Zak          201-393-6000\n$ lu Teri Zak\nIncorrect number of arguments\n\
    Usage: lu name\n$ mv lu Teri      Rename it\n$ lookup Teri Zak  See what happens\
    \ now\nIncorrect number of arguments\nUsage: lookup name\n$\n```\n\nSome Unix\
    \ systems will automatically make $0 a full pathname including directories, which\
    \ can lead to some clunky error and usage messages. In that instance, use $ (basename\
    \ $0) or utilize the trick from earlier to chop out the path name:\n\n```\n$${0*/}\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 265
  md: '# The set Command


    The shell''s set command also serves two purposes: it''s used both to set various
    shell options and to reassign the positional parameters $1, $2, and so on... .


    # The -x Option


    Earlier, in Chapter 7 we briefly looked at using sh -x ctype as a way to debug
    problems in a shell program, but the set command lets you turn on and off trace
    mode for specific portions of your program.


    Within a program,


    ```

    set -x

    ```


    enables trace mode, which means all subsequently executed commands will be printed
    to standard error by the shell, after filename, variable, and command substitution,
    as well as I/O redirection has been performed. The traced commands are preceded
    by plus signs.


    ```

    $ x=\*

    $ set -x

    $ echo $x

    + echo greetings lu rolo

    add greetings lu rolo

    $ cmd=wc

    + ls | $cmd -1

    + ls

    + wc -1

    ```


    Set command trace option


    ```

    $ set +x

    + set +x

    $ ls | wc -1

    ```


    You can turn off trace mode at any time by executing set with the +x option:


    Back to normal


    Note that the trace option is not passed down to subshells. But you can trace
    a subshell''s execution by invoking the program with the sh -x option followed
    by the name of the program, as in


    ```

    sh -x rolo

    ```


    or you can insert a series of set -x and +x commands within the program itself.
    In fact, you can insert any number of set -x and set +x commands inside your program
    to turn trace mode on and off as desired!'
  merge: -1
  img_proc: true
- pgno: 266
  md: 'The set Command 247


    # set with No Arguments


    If you don''t give any arguments to set, you''ll get an alphabetized list of all
    the variables that exist in the current environment, local or exported:


    ```

    $ set

    CDPATH=:/users/steve:/usr/spool

    EDITOR=/bin/vi

    HOME=/users/steve

    IFS=


    LOGNAME=steve

    MAIL=/usr/spool/steve

    MAILCHECK=600

    PATH=/bin:/bin:/users/steve/bin:..

    PHONEBOOK=/users/steve/phonebook

    PS1=$

    PS2=$

    PWD=/users/steve/misc

    SHELL=/bin/sh

    TERM=xterm

    MWOUT=

    T=STEDT

    cmd=wc

    X=*

    $

    ```


    Show me all variables


    # Using set to Reassign Positional Parameters


    You''ll recall that there''s no way to assign a new value or reassign the value
    of a positional parameter. Attempts to reassign $1 to 100, for example, might
    be logically written like this:


    ```

    1=100

    ```


    But it won''t work. Positional parameters are set upon the shell program.


    However, there''s a sneaky trick: you can use set to change the value. If words
    are given as arguments to set on the command line, the positional parameters $1,
    $2, ... will be assigned to those words. The previous values stored in the positional
    parameters will be lost. Within a shell program, the command


    ```

    set a b c

    ```


    will assign a to $1, b to $2, and c to $3. $# also gets set to 3 as appropriate
    for the new argument count.


    Here''s a more involved example:


    ```

    $ set one two three four

    $ echo $1:$2:$3:$4

    ```'
  merge: -1
  img_proc: true
- pgno: 267
  md: 'one:two:three:four

    This should be 4


    ```

    $ echo $$

    $ echo *\ What does this reference now?

    one two three four

    $ for arg; do echo $arg; done

    one

    two

    three

    four

    $

    ```


    After execution of the set, everything works as expected: $$, $*$, and the for
    loop without a list all reflect the change in positional parameter values.


    set is often used in this fashion to “parse” data read from a file or the terminal.
    Here''s a program called words that counts the number of words typed on a line
    (using the shell''s definition of a “word")


    ```

    $ cat words

    #

    # Count words on a line

    #

    ```


    ```

    read line

    set line

    echo $$

    $ words Run it

    Here''s a line for you to count.

    7

    $

    ```


    The program reads the user input, storing the line read in the shell variable
    line, then executes the command


    This causes each word stored in line to be assigned to the appropriate positional
    parameter. The variable $$ is also set to the number of words assigned, which
    is also the number of words on the line.


    # The - Option


    The above works fine, but what happens if some reason the user input starts with
    a - symbol?


    ```

    $ words

    -1 + 5 = 4

    words: -1: bad option(s)

    $

    ```'
