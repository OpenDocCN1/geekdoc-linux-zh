- pgno: 62
  md: 'As mentioned earlier, the init program runs programs similar to getty for networked
    connections. For example, sshd, telnetd, and rlogin answer requests via ssh, telnet,
    and rlogin, respectively. Instead of tied directly to a specific, physical terminal
    or modem line, these programs connect users'' shells to pseudo-tty. You can see
    this whether you''re logged in your system over a network, on an Windows screen,
    or through a networked terminal connection with the who command:


    ```

    $ who

    phw pts/0    Jul 20 17:37      Logged in with rlogin

    $

    ```


    # Typing Commands to the Shell


    When the shell starts up, it displays a command prompt—typically a dollar sign
    $-at your terminal and waits for you to type in a command (Figure 2.6, Steps 1
    and 2). Each time you type in a command and press the Enter key (Step 3), the
    shell analyzes what you typed and proceeds to carry out your program (Step 4).


    If you ask the shell to invoke a program, it searches the disk, stepping through
    all the directories you''ve specified in your PATH until the named program. When
    the program is found, the shell creates a clone of itself (known as a subshell)
    and asks the kernel to replace the subshell with the specified program; then the
    shell "goes to sleep" until the program has finished (Step 5). The kernel copies
    the specified program into memory and begins its execution. This copied program
    is called a process; in this way, the distinction is made between a program that
    is kept in a file on the disk and a process that is in memory and being executed,
    line by line.


    If the program writes output to standard output, that output will appear at your
    terminal unless redirected or piped into another command. Similarly, if the program
    reads from standard input, it will wait for you to type in that input unless redirected
    from a file or piped from another command (Step 6).


    When the command finishes execution, it vanishes and control once again returns
    to the login shell, which prompts for your next command (Steps 7 and 8).


    ![](img/dc544c8aef1333b25eff1c794c2e5ec2_62_0.png)


    Figure 2.6 Command cycle'
  merge: -1
  img_proc: true
- pgno: 63
  md: '# 44 Chapter 2 What Is the Shell?


    Note that this cycle continues as long as you''re logged in. When you log off
    the system, execution of the shell then terminates and the system starts up a
    new getty (or logind, and so on) and waits for someone to log in. This cycle is
    illustrated in Figure 2.7.


    ![](img/dc544c8aef1333b25eff1c794c2e5ec2_63_0.png)


    Figure 2.7 Login cycle


    It''s important to recognize that the shell is just a program. It has no special
    privileges on the system, meaning that anyone with sufficient expertise and enthusiasm
    can create their own shell. That''s why so many variations or “flavors” of the
    shell exist today, including the older Bourne shell, developed by Stephen Bourne;
    the Korn shell, developed by David Korn; the “Bourne again shell,” mainly used
    on Linux systems; and the C shell, developed by Bill Joy. were all designed to
    serve specific purposes and have their own unique capabilities and personalities.


    # The Shell''s Responsibilities


    Now you know that the shell analyzes (to use proper parlance, it parses) each
    line you type in and initiates execution of the selected program. It''s during
    the parsing phase that filename expansion special characters like * are expanded,
    as discussed in the previous chapter.


    The shell also has other responsibilities, as outlined in Figure 2.8.'
