    # Filename Nuances


    # Spaces in Filenames


    A discussion of command lines and filenames wouldn''t be complete without talking
    about the bane of old-school Unix people and very much the day-to-day reality
    of Linux, Windows, and Mac users in filenames.


    The problem arises from the fact that the shell uses spaces as delimiters between
    words. In other words the phrase echo hi is properly parsed as an invocation to
    the command echo, with two arguments hi and mom.


    Now imagine you have a file called my test document. How do you reference it from
    the command line? How do you view or display it using the cat command?


    ```

    $ cat my test document

    cat: No such file or directory

    cat: No such file or directory

    cat: No such file or directory

    ```


    That definitely doesn''t work. Why? Because cat wants a filename to be specified
    and instead of seeing one, it sees three: my, test, and document.


    There are two standard solutions for this: Escape every space by using a backslash,
    or wrap the entire filename in quotes so the shell understands it''s a single
    word with spaces, rather than multiple words.


    ```

    $ cat "my test document"

    This is a test document and is full

    of scintillating information to edify

    and amaze.

    $ cat "my\ test document"

    This is a test document and is full

    of scintillating information to edify

    and amaze.

    ```


    That solves the problem and is critical to how you proceed with file systems that
    have lots of directories and files that contain spaces as part of their filenames.'
  merge: -1
  img_proc: true
- pgno: 47
  md: '# Other Weird Characters


    While the space might be the most difficult and annoying of special characters
    that can appear in filenames, occasionally you''ll find others show up that can
    throw a proverbial monkey-wrench into your command line efforts.


    For example


    ```

    $ ls -l who me?\n-rw-r--r-- 1 staff staff 0 Dec 10:18 who me?

    ```


    Where this really gets interesting is if you have a backslash or quote as part
    of the filename, something that can happen inadvertently, particularly for files
    created by graphically oriented programs on a Linux or Mac system. The trick?
    Use single quotes to escape a filename that includes a double quote, and vice
    versa.


    ```

    $ ls -l "don''t quote me" "She said yes"\n-rw-r--r-- 1 staff staff 0 Dec 10:18
    don''t quote me\n-rw-r--r-- 1 staff staff 0 Dec 10:19 She said "yes"

    ```


    This topic will come again as we proceed, but now you know how to side-step problems
    with directories or files that contain spaces or other non-standard characters.


    # Standard Input/Output, and I/O Redirection


    # Standard Input and Standard Output


    Most Unix commands take input from your screen and send the output back to your
    screen. In Unix nomenclature, the screen is generally called the *terminal*, a
    reference that harkens back to the earliest days of computing. Nowadays it''s
    more likely to be a terminal *program* you''re running within a graphical environment,
    whether it''s a Linux window manager, a Windows computer, or a Mac system.


    A command reads its input from *standard input*, which is your computer keyboard
    by default. It''s a fancy way of clarifying that you "type in" your information.
    Similarly, a command normally writes its output to *standard output*, which is
    also your terminal or terminal app by default. This concept is depicted in Figure
    1.9.


    ![](img/dc544c8aef1333b25eff1c794c2e5ec2_47_0.png)


    Figure 1.9 Typical Unix command'
