  md: '# Chapter 5 Can I Quote You That?


    Remember that the shell is responsible for executing the command enclosed between
    the parentheses. The only thing the `echo` command sees is the output that has
    been inserted by the shell.


    > Note

    Those leading spaces produced by the `wc` command in the above example are a constant
    source of annoyance for programmers. Can you think of a way to use `sed` to remove
    them?


    Suppose you''re writing a shell program and want to assign the current date and
    time to a variable called `now`.


    Command substitution can be used for this:


    ```

    $ now=$(date)          Execute date and store the output in now

    $ echo $now                   See what got assigned

    Wed Aug 28 14:47:26 EDT 2002

    $

    ```


    When you enter


    ```

    now=$(date)

    ```


    the shell understands that the entire output from `date` is to be assigned to
    `now`. Therefore, you don''t need to enclose `$(date)` inside double quotes, though
    it''s a common practice.


    Even commands that produce more than a single line of output can be stored inside
    a variable:


    ```

    $ filelist=$(ls)

    $ echo $filelist

    addresses intro lotspaces nu numbers phonebook stat

    $

    ```


    What happened here? You end up with a horizontal list of the files even though
    the newlines from `ls` were stored inside the `filelist` variable. The newlines
    get eaten up display time when the value of `filelist` was substituted by the
    shell in processing which will preserve the newlines:


    ```

    $ echo "$filelist"

    addresses

    intro

    lotspaces

    names

    nu

    numbers

    phonebook

    stat

    $

    ```'
