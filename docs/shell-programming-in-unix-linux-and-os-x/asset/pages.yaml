    To continue the search through the command history a little differently, by keeping
    Ctrl+r followed by an Enter.

    Bash handles Ctrl+r: When you type Ctrl+r, Bash replaces the current line with
    (reverse-i-search)'':


    ```

    $ Ctrl+r (reverse-i-search)'': _

    ```


    As you type, the line is updated inside the ` '' with the text you, and the rest
    of the line is updated with the matching command:


    ```

    (reverse-i-search)'': c (reverse-i-search)''c: echo this is a test

    (reverse-i-search)''c'': d (reverse-i-search)''cd: cd /tmp

    ```


    Note how Bash highlights the matching part of the command by placing the cursor
    on it. As with the Korn, the command is executed by pressing Enter.

    When you''ve found a command in the history (either by Ctrl+p, Ctrl+n, or Ctrl+r),
    you can also edit the command using the other emacs commands already discovered.
    As with vi edit mode, you won''t actually change the command in the history but
    are editing a copy of the command, which will be entered in the history list when
    you press Enter.


    Table 14.2 summarizes the emacs line commands.


    Table 14.2 Basic emacs Line Edit Commands

    | Command | Meaning |

    |---|---|

    | Ctrl+b | Move left one character. |

    | Ctrl+f | Move right one character. |

    | Esc f | Move forward one word. |

    | Esc b | Move back one word. |

    | Ctrl+a | Move to start of line. |

    | Ctrl+e | Move to end of line. |

    | Ctrl+d | Delete current character. |'
