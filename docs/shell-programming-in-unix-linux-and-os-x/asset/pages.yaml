  md: "# Chapter 10 Your Environment\n\n```\nif [ \"$#\" -ne 1 ]\nthen\n  echo \"\
    Incorrect number of arguments\"\n  echo \"Usage: lu\"\n  exit 1\n```\n\ngrep \"\
    $name\" phonebook\n\ngrep is trying to open the phonebook file in the current\
    \ directory—which is /users/steve— and that's the problem: the program is being\
    \ executed from no relation to the directory by the program and its data file\
    \ reside.\n\nPATH only specifies the directories to be searched for programs invoked\
    \ on the command line, and not for any other types of files. So phonebook must\
    \ be precisely located for lu to make it more useful.\n\nThere are several ways\
    \ to fix this problem, which also exists with the rem and add programs. One approach\
    \ is to have the lu program directory to /users/steve/bin before it invokes grep.\
    \ That way, grep finds phonebook because it exists in the new current directory:\n\
    \n```\ncd /users/steve/bin\ngrep \"$*\" phonebook\n```\n\nThis approach is a good\
    \ one to take when you're doing a lot of work with different files in a particular\
    \ directory. Simply cd to the directory first and then you can reference all the\
    \ files you need.\n\nA second, more common approach is to list a path to phonebook\
    \ in the grep command:\n\n```\n...\ngrep \"$*\" /users/steve/bin/phonebook\n```\n\
    \nSuppose that you want to let others use your rolo program (and associated lu,\
    \ add, and rem helper programs). You give them their own phonebook, but then you'll\
    \ have several copies on the system and what happens if you make a small change?\
    \ Are you going to update all their copies as well?\n\nA better solution to have\
    \ a single copy of rolo to give other users access to it.\n\nThe problem should\
    \ be obvious at this point: If you change the reference of phonebook to explicitly\
    \ reference your phone book, everyone else will be using your phone book too.\
    \ A smarter way to solve the problem is to require that everyone have a phonebook\
    \ file in their home directory and refer to it as $HOME/phonebook.\n\nTo use a\
    \ very common shell programming convention, define a variable inside rolo called\
    \ PHONEBOOK and set it to the multi-user friendly variable $HOME/phonebook. If\
    \ you export this variable, lu, rem, and add (which are executed as subshells\
    \ by rolo) can also use the value of PHONEBOOK to reference the individual's version\
    \ of the file."
