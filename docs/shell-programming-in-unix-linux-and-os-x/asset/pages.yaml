- pgno: 115
  md: '96 Chapter 4 And We Go


    Recall that echo without any arguments produces a blank line. Shortly, you''ll
    see how to have

    the message and command output displayed on the same line, like this:

    The current date and time is: Wed Jul 10 12:00:27 EDT 2002


    # Comments


    The shell programming language would not be complete without a comment statement.
    A

    comment is a way for you to insert remarks or comments inside the program that
    otherwise

    h no effect on its execution.


    Whenever the shell encounters the special character #, it ignores whatever characters

    starting with the # to the end of the line. If the # starts the line, the entire
    line is

    treated as a comment. Here are examples of valid comments:


    ```

    # Here is an entirely comment line

    # | wc -l # count the number of users

    #

    # Test to see if the correct arguments were supplied

    #

    ```


    Comments are useful for documenting commands or sequences of commands whose purposes

    may not be obvious or sufficiently complex that you might forget why they''re
    there

    or they do. Judicious use of comments can also help make shell programs easier

    debug and maintain—both by you and someone else who may have to support your

    programs.


    Let''s go back to the stats program and insert some comments and blank lines for
    예정이다:


    ```

    $ cat stats

    #

    # stats prints: date, number of users logged on,

    # and current working directory

    #

    ```


    ```

    echo The current date and time is:

    date


    echo The number of users on the system is:

    who | wc -l

    ```


    ```

    echo

    echo Your current working directory is:

    pwd

    $

    ```


    The extra blank lines cost little in terms of program space yet add much in terms
    of program

    readability. They''re simply ignored by the shell.'
  merge: -1
  img_proc: true
- pgno: 116
  md: '# Variables


    Like virtually all programming languages, the shell allows you to store values
    into variables.

    A shell variable begins with an alphabetic or underscore (_) character and is
    followed by zero or more alphanumeric or underscore characters.


    > Note

    The regular expression for a shell variable name is therefore [A-Za-z_] [a-zA-Z0-9_]*,
    right?


    To store a value inside the shell, you write the name of the variable, followed
    immediately by the equals sign =, followed immediately by the value to store in
    the variable:


    ```

    variable=value

    ```


    For example, to assign a value to the shell variable count, you simply write


    ```

    count=1

    ```


    and to assign the value /users/steve/bin to the shell variable my_bin, you write


    ```

    my_bin=/users/steve/bin

    ```


    A few important points. First, spaces are not permitted on either side of the
    equals signs. Keep that in mind, especially if you''ve worked in other programming
    languages and you''re in the habit of inserting spaces around operators. In the
    shell language, you cannot put spaces in them.

    Second, unlike other programming languages, the shell has no concept of data types.
    Whenever you assign a value to a shell variable, no matter what it is, the shell
    interprets that value as a string of characters. So when you assigned 1 to the
    variable count, the shell simply stored the character 1 inside the variable count,
    making no assumption that an integer value was stored in the variable.


    If you''re programming in a language such as C, Perl, Swift, or Ruby where all
    variables must be declared, you''re in for another adjustment: Because the shell
    has no concept of data types, variables are not declared before they''re used;
    they''re assigned values when you want to use them.


    The shell does support integer operations on shell variables that contain strings
    that are also valid numbers through special built-in operations, but even then,
    the variable is continually evaluated to ensure it''s a valid number.


    Because the shell is an interpretive language, you can assign values to variables
    directly at your terminal:


    ```

    $ count=1          Assign character 1 to count

    $ my_bin=/users/steve/bin Assign /users/steve/bin to my_bin

    $

    ```


    Now that you know how to assign values to variables, what good is it? Glad you
    asked.'
