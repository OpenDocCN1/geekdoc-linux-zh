- pgno: 153
  md: "# Chapter 7 Decisions, Decisions\n\nThis extra line is displayed because of\
    \ the conditional test: not only does grep return an exit status in the pipeline\n\
    \n```\nwho | grep \"$user\"\n```\n\nbut it also goes about its normal function\
    \ of matching any lines to standard output, even though we're really not interested\
    \ in that.\n\nSince we're not interested in seeing the result of the command,\
    \ just testing the exit code, we can dispose of grep's output by redirecting it\
    \ to the system's \"garbage can,\" /dev/null. This is a special file on the system\
    \ that anyone can read (from an immediate end of file) or write to it. When you\
    \ write to it, the bits vanish, as if it were a massive black hole!\n\n```\nwho\
    \ | grep \"$user\" > /dev/null\n```\n\nThat'll solve the superfluous output problem.\n\
    \nThe second problem with on appears when the program is executed with the argument\
    \ ann. Even though ann is not logged on, grep matches the characters ann for the\
    \ user Joanne. We need a more restrictive pattern, which you learned how to do\
    \ in Chapter 3 where we talked about regular expressions. Because who lists each\
    \ username in column one of the output, we can anchor the pattern to match the\
    \ beginning of the line by preceding the pattern with the character ^\n\n```\n\
    who | grep \"^$user\" > /dev/null\n```\n\nBut that's still not enough. Search\
    \ for a pattern like bob and grep still matches a line like\n\n```\nbobby tty07\
    \ Jul 8 09:35\n```\n\nWhat you need to do is also anchor the pattern on the right\
    \ too. Realizing that who ends each username with one or more spaces, the further\
    \ modified pattern\n\n```\n\"$user \"\n```\n\nnow only matches lines for the specified\
    \ user. Problem two fixed!\n\nLet's try the new and improved version of on:\n\n\
    ```\n$ cat on\n#\n# determine if someone is logged on -- version 2\n#\nuser=\"\
    $user \"\n```\n\n```\nif who | grep \"^$user \" > /dev/null\nthen\n  echo \"$user\
    \ is logged on\"\nfi\n$ who\n\ttWho's on?\n```\n\n```\nroot console Jul 8 10:37\n\
    barney tty03 Jul 8 12:38\nfred tty04 Jul 8 13:40\n```"
  merge: -1
