- pgno: 112
  md: '# And Away We Go


    Based on our discussions in Chapter 2, “What Is the Shell?,” you should now realize
    that whenever you type something like


    who | wc -1


    you are actually programming in the shell. That''s because the shell is interpreting
    the command line, recognizing the pipe symbol, connecting the output of the first
    command to the input of the second, and initiating execution of all commands.


    In this chapter, you''ll learn how to write your commands and how to use shell
    variables.


    # Command Files


    A shell program can be typed directly, as in


    ```

    $ who | wc -1

    ```


    or it can be typed into a file and the file can be executed by the shell. For
    example, suppose that you need to find out the number of logged-in users several
    times throughout the day. It''s not unreasonable to type it in the preceding pipeline
    each time you want the information, but for the sake of example, let''s type this
    pipeline into a file.


    We''ll call the file nu (for number of users), and its contents will be the pipeline
    shown previously:


    ```

    $ cat nu

    who | wc -1

    ```


    To execute the commands contained inside the file nu, all you now have to do is
    type nu as the command name to the shell:


    ```

    $ nu

    sh: nu: cannot execute

    $

    ```'
  merge: -1
  img_proc: true
- pgno: 113
  md: "# Chapter 4 And We Go\n\nOops! Forgot to mention one thing. Before you execute\
    \ a script from the command line, you must change the file's permission to make\
    \ it executable. This is done with the change mode command, chmod. To add execute\
    \ permission to the file nu, you simply type\n\nchmod +x file(s)\nThe The indicates\
    \ that you want to make the file(s) that follow executable. The shell requires\
    \ that a file be both readable and executable by you before you invoke it directly\
    \ on the command line.\n\n```\n$ ls -1 nu\n-rw-r--r-- 1 steve steve    12 Jul\
    \ 10 11:42 nu\n$ chmod +x nu\nMake it executable\n$ ls -1 nu\n-rwxrxr-x 1 steve\
    \ steve    12 Jul 10 11:42 nu\n$ \n```\n\nNow you've made it executable, try it\
    \ again:\n\n```\n$ nu\n8\n$\n```\n\nThis time it worked.\n\n> Warning\nIf you\
    \ fix the permission issue and still get an error \"Command not found,\" try adding\
    \ . / before the command, ./nu to ensure the shell looks in the current directory\
    \ for commands as well as the usual system locations. To fix it long term, add\
    \ . to the end of your PATH (typically within your .profile file).\nYou can put\
    \ any commands inside a file, make the file executable, and execute it contents\
    \ simply by typing its name to the shell. It's that simple and powerful, and everything\
    \ you've learned about working on the command line therefore also applies to shell\
    \ scripts too.\nThe standard shell mechanisms as I/O redirection and pipes can\
    \ be used on your own programs as well:\n\n```\n$ nu > tally\n$ cat tally\n8\n\
    ```\n\nSuppose you're working on a proposal called sys.caps and the following\
    \ command sequence is needed every time you print your proposal:\n\n```\ntbl sys.caps\
    \ | nroff -mm -Tlp | lp\n```"
