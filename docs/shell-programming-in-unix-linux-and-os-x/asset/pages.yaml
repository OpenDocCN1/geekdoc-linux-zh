- pgno: 350
  md: "I/O Redirection\n\n# Filename Substitution\n\nAfter parameter substitution\
    \ and command substitution are performed on the command line, the shell looks\
    \ for the special characters *, ?, and [. If they're not quoted, the shell searches\
    \ the current directory, or another directory preceded by a /, and substitutes\
    \ the names of all files that match. If no match is found, the characters remain\
    \ untouched.\n\nNote that filenames beginning with a - must be explicitly matched\
    \ (in other words, echo * will not display your hidden files but echo *).\n\n\
    The filename substitutions are summarized in Table A.6.\n\nTable A.6 Filename\
    \ Substitution Characters\n\n| Character(s) | Meaning |\n| ? | Matches any single\
    \ character. |\n| * | Matches zero or more characters. |\n| [chars] | Matches\
    \ any character in chars; the format Ci-Cj can be used to match any character\
    \ in the range Ci through Cj, inclusive (for example, [A-Z] matches any uppercase\
    \ letter). |\n| ![chars] | Matches any character not in chars; a range of characters\
    \ may be specified as above. |\n\n# I/O Redirection\n\nWhen scanning the command\
    \ line, the shell looks for the special redirection characters < and .. If found,\
    \ they are processed and removed (with any associated arguments) from the command\
    \ line. Table A.7 summarizes the different types of I/O redirection that the shell\
    \ supports.\n\nTable A.7 I/O Redirection\n\n| Construct | Meaning |\n| < file\
    \ | Redirect input to file. |\n > file | Redirect output to file; file is created\
    \ if it doesn't exist and zeroed if it does. |\n| >= file | Redirect output to\
    \ file; file is created if it doesn't exist and zeroed if it does; the noclobber\
    \ (-C) option is set. |\n| >> file | Like >, appended to file if it already exists.\
    \ |\n| << word | Redirect input from file following up until a line containing\
    \ word; parameter substitution occurs on the lines, and back-quoted commands are\
    \ executed and the backslash character interpreted; if any character in word is\
    \ passed through unaltered; if word is preceded by a -, leading tabs on the lines\
    \ are removed. |\n| & digit | Standard input is redirected from the file associated\
    \ with file descriptor digit. |"
  merge: -1
  img_proc: true
- pgno: 351
  md: '# Appendix A Shell Summary


    | Construct | Meaning |

    | --- | --- |

    | >& digit | Standard output is redirected to the file associated with file descriptor
    *digit*. |

    | <&- | Standard input is closed. |

    | >&- | Standard output is closed. |

    | <> file | Open file for both reading and writing. |


    Note that filename substitution is not performed on file. Any of the constructs
    listed in the first column of the table may be preceded by a file descriptor number
    to have the same effect on the file associated with that file descriptor.


    The file descriptor 0 is associated with standard input, 1 with standard output,
    and 2 with standard error.


    # Exported Variables and Subshell Execution


    Commands other than the shell''s built-ins are normally executed in a new instantiation
    of the shell called a *subshell*. Subshells cannot change the values of variables
    in the parent shell, and they can only access variables from the parent shell
    that were exported—either implicitly or explicitly—by the parent. If the subshell
    changes the value of one of these variables and wants to have its own subshells
    know about it, it must explicitly export the variable before executing the subshell.


    When the subshell finishes execution, any variables that it may have set are inaccessible
    by the parent.


    # The (...) Construct


    If one or more commands are placed inside parentheses, those commands will be
    executed in a subshell.


    # The { ...; } Construct


    If one or more commands are placed inside curly braces, those commands will be
    executed by the *current* shell.

    With this and the (...) construct, I/O can be redirected and piped into and out
    of the set of enclosed commands, and the can be set to the background for execution
    by placing an & at the end.


    ```

    (prog1; prog2; prog3) 2>errors

    ```


    submits the three listed programs to the background for execution, with standard
    error from three programs redirected to the file errors.'
  merge: -1
  img_proc: true
- pgno: 352
  md: '# Job Control 333


    # More on Shell Variables


    A shell variable can be placed into the environment of a command by preceding
    the command name with the assignment to the parameter on the command line, as
    in


    PHONEBOOK=$HOME/misc/phone rolo


    Here the variable PHONEBOOK will be assigned the indicated value and then placed
    in rolo’s environment. The environment of the current remains unchanged, as if


    ```

    (PHONEBOOK=$HOME/misc/phone; export PHONE BOOK; rolo

    ```


    had been executed inside.


    # Functions


    Functions take the following form:


    ```

    name () compound-command

    ```


    where compound-command is a set of commands enclosed in (...), {...} or can be
    a for, case, until, or while command. Often, the function definition takes this:


    ```

    name () { command; command; ...command; }

    ```


    where name is the name of the function defined to the current shell (functions
    can’t be exported). The function definition can span as many lines as needed.
    A return command can be used to cause execution of the function to be terminated
    without terminating the shell (see the return command description).


    For example,


    ```

    nf () { ls | wc -1; }

    ```


    defines a function nf to count the number of files in your current directory.


    # Job Control


    # Shell Jobs


    Every command sequence in the background is a job number, starting at one. A job
    can be referenced by a job_id, which is a % followed by the job number, +, -,
    %, %, followed by the first few letters of the pipeline, and ?$string.


    The following built-in commands can be given a job_id as an argument: kill, fg,
    bg, and wait. The special conventions % and - refer to the current and previous
    jobs, respectively; % also refers to the current job. The current job is the most
    recent job placed in the background or the job running in the foreground. The
    convention $string refers to the job name begins with string, ??string refers
    to the job name contains string. The jobs command may be used to list the status
    of all currently running jobs.'
  merge: -1
  img_proc: true
- pgno: 353
  md: "# Appendix A Shell Summary\n\nIf the monitor option of the set command is turned\
    \ on, the shell prints a message when each job finishes. If you still have jobs\
    \ when you try to exit the shell, a message is printed to alert you of this. If\
    \ you immediately try to exit the shell, the monitor option is enabled by default\
    \ for interactive shells.\n\n# Stopping Jobs\n\nIf the shell is running on a system\
    \ with job control, the monitor option of the set command is enabled, jobs that\
    \ are running in the foreground may be placed in the background and vice versa.\
    \ Normally, Ctrl+z stops the current job and the bg command puts a stopped job\
    \ in the background. The fg command brings a background or stopped job to the\
    \ foreground.\n\nWhenever a job in the background attempts to read from the terminal,\
    \ it is stopped until it is brought to the foreground. Output from background\
    \ jobs normally comes to the terminal. If stty tostop is executed, output from\
    \ background jobs is disabled, and a job writing to the terminal is stopped until\
    \ it is brought to the foreground. When the shell exits, all stopped jobs are\
    \ killed.\n\n# Command Summary\n\nThis section summarizes the shell's built-in\
    \ commands. Actually, some of these commands (such as echo and test) may not be\
    \ built into the shell or might have a streamlined version built-in and a more\
    \ sophisticated version as a separate program. In all cases, functions must be\
    \ provided as a utility by a POSIX-compliant system. They are built in Bash and\
    \ the Korn shell are used in almost all shell scripts.\n\n# The : Command\n\n\
    General Format :\n\nThis is essentially a null command. It is frequently used\
    \ to satisfy the requirement that a command appear.\n\nExample\n\n```\nif | grep\
    \ jack > /dev/null ;\nelse\n\techo \"jack's not logged in\"*\n```\n\nfi\n\nThe\
    \ : command returns an exit status of zero.\n\n# The . Command\n\nGeneral Format\
    \ : file"
  merge: -1
  img_proc: true
- pgno: 354
  md: '“dot” command causes the indicated file to be read and executed by the shell,
    just as if the lines from the file were typed at that point. Note that file does
    not have to be executable, only readable. Also, the shell uses the PATH variable
    to find file.


    Example


    +   * progdefs    Execute commands in progdefs


    The preceding command calls the shell to search the current PATH for the file
    progdefs. When it finds it, it reads and executes the commands from the file.


    Note that because file is not executed by a subshell, variables set and/or changed
    within file remain in effect after execution of the commands in file is complete.


    # The Alias Command


    General Format: alias name=string [name=string ...]


    The alias assigns string to the alias name. Whenever name is used as a command,
    the shell substitutes string, performing command-line substitution after string
    is in place.


    Examples


    ```

    alias ll=''ls -l''

    alias dir=''basename $ (pwd)''

    ```


    If an alias ends with a blank, the word forming the alias is also checked to see
    whether it''s an alias.


    The format


    ```

    alias name

    ```


    causes the alias for name to be printed out.


    ```

    alias with no arguments lists all aliases.

    ```


    alias returns an exit status of zero unless a name is given (as in alias name)
    for which no alias has been defined.


    # The bg Command


    General Format: bg job_id


    Example


    ```

    bg %2

    ```'
