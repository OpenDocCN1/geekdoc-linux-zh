    # The Logical Negation Operator !


    The unary negation operator | can be placed in front of any other test expression
    to negate the result of the evaluation of that expression. For example,


    ```

    [ -r /users/steve/phonebook ]

    ```


    returns a zero exit status (true) if /users/steve/phonebook is readable, and


    ```

    [ -f "mailfile" ]

    ```


    returns true if the file specified by $mailfile does not exist or is not an ordinary
    file. Finally,


    ```

    [ ! "$x1" != "$x2" ]

    ```


    returns true if $x1 is not identical to $x2 and is obviously equivalent to (the
    more confusing cousin of) the clearer conditional expression


    ```

    [ "$x1" != "$x2" ]

    ```


    # The Logical AND Operator -a


    The operator -a performs a logical AND of two expressions and returns TRUE only
    if the joined expressions are both true.


    ```

    [ -f "$mailfile" -a "$mailfile" ]

    ```


    returns TRUE if the file specified by $mailfile is an ordinary file and is readable
    by you.(An extra space was placed around the -a operator to aid in the expression''s
    readability and has no effect on its execution).


    # The command


    ```

    [ "$count" -ge 0 -a "$count" -lt 10 ]

    ```


    will be true if the variable contains an integer greater than or equal to zero
    but less than 10. The -a operator has lower precedence than the integer comparison
    operators (and the string and file operators, for that matter), meaning that the
    preceding expression evaluates as


    ```

    ("$count" -ge 0) -a ("$count" -lt 10)

    ```


    as you would expect.


    In some cases, it''s important to know that test immediately stops evaluating
    an AND expression as soon as something is proven to be false, so a statement like


    ```

    [ ! "$file" -a $(who > $file) ]

    ```'
  merge: -1
  img_proc: true
- pgno: 163
  md: 'will not run in the subshell with the who invocation if the ! -f (non-existence)
    test fails, because test already knows the AND (-a) expression is false. Subtle,
    but something that can trip up shell programmers if they try to jam too much into
    conditional expressions with the assumption that everything is run prior to the
    conditional tests being applied.


    # Parentheses


    You can use parentheses in a test expression to alter the order of evaluation
    as needed; just make sure that the parentheses themselves are quoted because they
    have a special meaning to the shell. So to translate the elater expression into
    a test command, you would write


    ```

    [ \$count" -ge 0 -a "$count" -lt 10 \ ]

    ```


    As is typical, spaces must surround the parentheses because test expects to see
    every element in the conditional statement as a separate argument.


    # The Logical OR Operator -O


    The -o operator is similar to the -a operator, it only forms a logical OR of two
    expressions. That, evaluation of the expression will be true either the first
    expression is true or the second expression is true or both expressions are true.


    ```

    - n "mailopt" -o r $HOME/mailfile

    ```


    This command will be true if the variable mailopt is not null or the file $HOME/mailfile
    is readable by you.


    The -o operator has lower precedence than the -a operator, meaning that the expression


    ```

    "$a" -eq 0 -o "$b" -eq 2 -a "$c" -eq 10

    ```


    gets evaluated by test


    ```

    "$a" -eq 0 -o "$b" -eq 2 -a "$c" -eq 10

    ```


    Naturally, you can use parentheses to change this order if necessary:


    ```

    \ ($a" -eq 0 -o "$b" -eq 2 -a "$c" -eq 10

    ```


    Since precedence is critically important in complex conditional statements, you''ll
    find a lot of shell programmers have nested if statements to side-step issues,
    while others use explicit parentheses to clarify order of interpretation. Just
    assuming things are interpreted left-to-right is dangerous!


    You will see many uses of the test command throughout the book because it''s almost
    impossible to write even shell programs without some sort of conditional statements
    involved. Table A.11 in Appendix A summarizes all available test operators.'
  merge: -1
  img_proc: true
- pgno: 164
  md: "# The else Construct\n\nA construct known as else can be added to the if command,\
    \ with the general format as\nshown:\n\n```\nif command_\nthen\n    command\n\
    \    command\n    ..\nelse\n    command\n    command\n    ..\n```\n\nIn the above,\
    \ command, is executed and its exit status evaluated. If it's true (zero), the\
    \ then code\nblock (all the statements between then and else) is executed and\
    \ the else block is ignored.\nIf the exit status is false (non-zero), the then\
    \ code block is ignored and the else code block\n(everything else and fi) is executed.\
    \ In either case, only one set of commands gets\nexecuted: the first set if the\
    \ exit status is executed, and the second set if it's nonzero.\n\nThis can be\
    \ more succinctly expressed:\n\n```\nif condition then statements-if-true else\
    \ statements-if-false fi\n```\n\nLet's know a modified version of on. Instead\
    \ of having no output if the requested user is\nnot logged on, we'll have the\
    \ program report that fact to the user.\n\nHere is version 3 of the program:\n\
    \n```\n$ cat on\n#\n# determine if someone is logged on -- version 3\n#\nuser=\"\
    $user\"\nif who | grep \"$user\" > /dev/null\nthen\n    echo \"$user is logged\
    \ on\"\nelse\n    echo \"$user is not logged on\"\nfi\n$\n```\n\nIf the user specified\
    \ as the first argument to on is logged on, the grep will succeed and the\nmessage\
    \ user is logged on will be displayed; otherwise, the message user is not logged\n\
    on will be displayed."
  merge: -1
  img_proc: true
- pgno: 165
  md: "146      Chapter 7 Decisions, Decisions\n\nWho's on?\n\n```\n$ who\nroot  \
    \    console Jul 8 10:37\nbarney    tty03      Jul 8 12:38\nfred      tty04  \
    \    Jul 8 13:40\njoanne    tty07      Jul 8 09:35\ntony      tty19      Jul 8\
    \ 08:30\nlulu      tty23      Jul 8 09:55\n$ on pat\npat is not logged on\n$ on\
    \ tony\ntony is logged on\n$\n```\n\nTo turn a quick prototype into a useful program\
    \ for the long term, it's a good practice to make sure that the correct number\
    \ of arguments is passed to the program. If the user specifies the wrong number\
    \ of arguments, an appropriate error message can be issued, along with a usage\
    \ message. Like this:\n\n```\n$ cat on\n#\n# determine if someone is logged on\
    \ -- version 4\n#\n\n# see if the correct number of arguments were supplied\n\
    #\nif [ \"$#\" -ne 1 ]\nthen\n    echo \"Incorrect number of arguments\"\n   \
    \ echo \"Usage: on user\"\nelse\n    user=\"$1\"\n\n    if who | grep \"$user\"\
    \ >/dev/null\n    then\n        echo \"$user is logged on\"\n    else\n      \
    \  echo \"$user is not logged on\"\n    fi\nfi\n```\n\nIt seems like a lot of\
    \ changes, but without wrapping all the previous code within an else-fi pair,\
    \ the primary addition is an if command to evaluate whether the correct number\
    \ of arguments were supplied. If $$ is not equal to 1, the required number of\
    \ arguments, the program prints two error messages; otherwise, the commands after\
    \ the else clause are executed. Note that two fi commands are required because\
    \ if commands are used."
  merge: -1
  img_proc: true
- pgno: 166
  md: '# The exit Command 147


    As you can see, indentation goes a long way toward making the program easy to
    read and understand. Get into the habit of setting and following indentation rules
    in your program and you''ll definitely thank us later on as your programs become
    increasingly complicated.


    The sophistication of the user experience is clearly improved over previous versions
    of the program:


    ```

    $ on

    Incorrect number of arguments

    Usage: on user

    $ priscilla

    priscilla is not logged on

    $ jo anne

    Incorrect number of arguments

    Usage: on user

    $

    ```


    No arguments

    One argument

    Two arguments


    # The exit Command


    A built-in shell command exit enables you to immediately terminate execution of
    your shell program. The general format of this command is


    ```

    exit n

    ```


    where n is the status that you returned. If none is specified, the exit status
    used is that of last command executed prior to the exit (that is, it''s effectively
    exit $?).


    Be advised that executing the exit command directly from your terminal will log
    off the system because it will have the effect of terminating execution of your
    login shell.


    # A Second Look at the rem Program


    is frequently used as a convenient way to terminate execution of a shell program.
    For example, let''s take another look at the rem program, which removes an entry
    from the phonebook file:


    ```

    $ cat rem

    #

    # Remove someone from the phone book

    #


    grep -v "$1" phonebook > /tmp/phonebook

    mv /tmp/phonebook phonebook

    $

    ```


    As written, this program has the potential to create problems if unexpected situations
    arise, potentially corrupting or wiping out the entire phonebook file.'
  merge: -1
  img_proc: true
- pgno: 167
  md: "For example, suppose that you type in\n\nrem Susan Topple\n\nThe shell will\
    \ pass two arguments to rem because of the missing quotes. The rem program will\
    \ then remove all Susan entries, as specified by $1, without ever seeing that\
    \ were too many arguments specified by the user in the first place.\n\nAs a result,\
    \ it's always best to take precautions with any potentially destructive program\
    \ and to be certain that the action intended by the user is consistent with the\
    \ action that the program is poised to take.\n\nOne of the first checks can be\
    \ made in rem is for the correct number of arguments, as was done earlier with\
    \ the on program. This time, we'll use the exit command to terminate the program\
    \ if the correct number of arguments is not supplied:\n\n```\n$ cat rem\n#\n#\
    \ Remove someone from the phone book -- version 2\n#\n\nif [ \"$#\" -ne 1 ];\n\
    then\n  echo \"Incorrect number of arguments\"\n  echo \"Usage: rem name\"\n \
    \ exit 1\n```\n\n```\ngrep -v \"$1\" phonebook > /tmp/phonebook\nmv /tmp/phonebook\
    \ phonebook\n$ rem Susan Goldberg\nIncorrect number of arguments\nUsage: rem name\n\
    $\n```\n\nTry it out\n\nThe exit command returns an status of 1, to signal failure,\
    \ in case some other program wants to check it in a conditional expression. How\
    \ could you have written the preceding program with an if-else instead of using\
    \ the exit?\n\nWhether you use the exit or an if-else is up to you. Sometimes\
    \ the exit is more convenient way to get out of the program quickly, particularly\
    \ if it's done early in the program, and it has the additional benefit of avoiding\
    \ the need for deeply nested conditionals.\n\n# The elif Construct\n\nAs your\
    \ programs become more complex, you may find yourself stuck writing nested if\
    \ statements like this:\n\n```\nif command,\nthen\n```"
  merge: -1
  img_proc: true
- pgno: 168
  md: "```\ncommand\ncommand\n...\nelse\n  if command_r\n  then\n    command\n   \
    \ command\n    ...\n  else\n    ...\n    if command_n\n    then\n      command\n\
    \      command\n      ...\n      else\n        command\n        command\n    \
    \    ...\n    fi\n  fi\n\n```\n\nThis type of command sequence can be useful when\
    \ you need to make more than just a two-choice decision. In this case, a multiway\
    \ decision is made, with the last else clause executed if none of the preceding\
    \ conditions is satisfied.\n\nAs a relatively simple example, let's write a program\
    \ called greetings that prints a friendly Good morning, Good afternoon, or Good\
    \ evening based on time of day. For purposes of the example, consider any time\
    \ from midnight to noon to the morning, noon to 6 pm the afternoon, and 6 pm to\
    \ midnight the evening.\n\nTo write this program, you have to find out what it\
    \ is. date serves just fine for this purpose. Take another look at the output\
    \ of this command:\n\n\n```\n$ date\nWed Aug 29 10:42:01 EDT 2002\n$\n```\n\n\
    The format of date's output is fixed, a fact that you can use to your advantage\
    \ because the time will always appear in character positions 12 through 19. In\
    \ fact, you really need the hour value in positions 12 and 13:\n\n```\n$ date\
    \ | cut -c12-13\n10\n$\n```"
  merge: -1
  img_proc: true
- pgno: 169
  md: "# Chapter 7 Decisions, Decisions\n\nNow the task of writing the greetings program\
    \ is straightforward:\n\n```\n$ cat greetings\n#\n# Program to print a greeting\n\
    #\nh=$(date | cut -c1-13)\n\nif [ \"$hour\" -ge 0 -a \"$hour\" -le 11 ]\nthen\n\
    \    echo \"Good morning\"\nelse\n    if [ \"$hour\" -ge 12 -a \"$hour\" -le 17\
    \ ]\nthen\n        echo \"Good afternoon\"\n    else\n        echo \"Good evening\"\
    \n    fi\nfi\n```\n\nIf hour is greater than or equal to 0 (midnight) and less\
    \ than 11 (up to 11:59:59), Good morning is displayed. If hour is greater than\
    \ or equal to 12 (noon) and less than or to 17 (up to 5:59:59 pm), Good afternoon\
    \ is displayed. Neither of the preceding cases is satisfied, Good evening is displayed.\n\
    \n```\n$ greetings\nGood morning\n$\n```\n\nLook at the program again, however,\
    \ and you'll realize that the nested if command sequence used in greetings is\
    \ rather clumsy. To streamline these sorts of if-then-else sequences, the shell\
    \ also supports a special elif element that acts somewhat like else if condition,\
    \ except it doesn't increase your nesting level. The general format is\n\n```\n\
    command,\nthen\n    command\n    command\n    ...\nelif command2,\nthen\n    command\n\
    \    command\n    ...\nelse\n    command\n    command\n    ...\nfi\n```"
  merge: -1
  img_proc: true
- pgno: 170
  md: "# The elif Construct 151\n\ncommand,, command,, ..., command are executed in\
    \ turn and their exit statuses tested. As soon as one returns an exit status TRUE\
    \ (zero), the commands listed after the then that follows are executed, up to\
    \ another elif, else, or fi. If none of the conditional expressions is true, the\
    \ commands listed after the optional else are executed.\n\nNow you can rewrite\
    \ the greetings program using this new format as shown:\n\n```\n$ cat greetings\n\
    #\n# Program to print a greeting -- version 2\n#\nhour=$(date | cut -c12-13)\n\
    \nif [ \"$hour\" -ge 0 -a \"$hour\" -le 11 ]\nthen\n    echo \"Good morning\"\n\
    elif [ \"$hour\" -ge 12 -a \"$hour\" -le 17 ]\nthen\n    echo \"Good afternoon\"\
    \nelse\n    echo \"Good evening\"\nfi\n```\n\nA definite improvement. The program\
    \ is easier to read, and it doesn't have the tendency to wander off the right\
    \ margin by progressively increasing indentation.\n\nIncidentally, it's very rare\
    \ to see date | cut as a pipe the date command itself has a rich and complex set\
    \ of output formats you can utilize to get just the information or value you want.\
    \ For example, to output the current hour in 0-23 format, use %H with the necessary\
    \ prefix to identify it a formatting string:\n\n```\n$ date +H\n10\n```\n\nAs\
    \ an exercise, you should change greetings to make use of this more streamlined\
    \ way to identify the current hour of the day.\n\n# Yet Another Version of rem\n\
    \nLet's jump back to the phone number removal program rem. Earlier we mentioned\
    \ that it was dangerous because without checking the validity of its actions,\
    \ it could delete more than the user desired.\n\nOne way to address this problem\
    \ is to check the number of entries that match the user specified pattern before\
    \ the removal: If there's more than one match, issue a message to that effect\
    \ and terminate execution of the program. But how do you determine the number\
    \ of matching entries?"
  merge: -1
  img_proc: true
- pgno: 171
