    # Miscellaneous Features


    Just a few tidbits before we wrap up this chapter...


    # Other Features of the cd Command


    The cd command seems straightforward, but it has a few tricks up its proverbial
    sleeve. For example, the argument means "the previous directory" as a convenient
    shortcut:


    ```

    $ pwd

    /usr/src/cmd

    $ cd /usr/local/uucp

    $ pwd

    /usr/local/uucp

    $ cd - cd to previous directory

    /usr/src/cmd

    $ cd - cd prints name of new directory

    $ cd -

    /usr/local/uucp

    $

    ```


    As you can see, cd - cd can be used to toggle between two directories with no
    effort at all.


    The Korn shell’s cd command has the capability to substitute portions of the current
    directory’s path. (Neither Bash nor the POSIX standard shell support this feature)


    The format is


    ```

    cd old new

    ```'
