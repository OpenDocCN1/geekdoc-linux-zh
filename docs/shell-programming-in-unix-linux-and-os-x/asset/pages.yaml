    # Command Substitution


    Command substitution refers to the shell''s capability to replace a specified
    command with the output of that command at any point in a command line. There
    are two ways to perform command substitution: enclosing the command in back quotes
    or surrounding it with $ $(…)


    # The Back Quote


    The back quote—often "back tick"—unlike any of the previously encountered types
    of quotes because its purpose is not to protect characters from the shell but
    to tell the shell to replace the enclosed command with its output. The general
    format for back quotes is


    `command`


    where command is the name of the command to be executed and where output is inserted
    at that point.


    > NotenUsing the back quote for command substitution is no longer the preferred
    method; however, we cover it because of the large number of older shell scripts
    that still use this construct. You should also know about back quotes in case
    you need to write shell programs that are portable to older Unix systems with
    shells that don''t support the newer, preferred $(…)


    Here is an example:


    ```

    $ echo The date and time is: `date`nThe date and time is: Wed Aug 28 14:28:43
    EDT 2002

    $

    ```


    When the shell does its scan of the command line, it recognizes the back quote
    and expects a command to follow. In this case, the shell finds the date command
    so it executes date and replaces the "date" sequence on the command line with
    the output from date. After that, the shell divides the resultant command line
    into arguments in the normal manner and then throws all off to the echo command.


    ```

    $ echo Your current working directory is `pwd`nYour working directory is /users/steve/shell/ch6

    $

    ```'
  merge: -1
  img_proc: true
- pgno: 134
  md: 'Here the shell executes pwd, inserts its output on the command line, and then
    executes the echo. Note that in the following section, back quotes can be used
    in all the places where the $(...)$ construct is used and, of course, vice-versa
    with the examples in this section.


    # $$(...) Linux


    All Unix, Linux and any other POSIX-compliant shells support the newer and preferred
    $(...)$ construct for command substitution. The general format is


    ```

    $$(command)

    ```


    where, just as with back quotes, command is the name of the command whose standard
    output is to be substituted on the command line. For example:


    ```

    $ echo The date and time is: $(date)

    The date and time is: Wed Aug 28 14:28:43 EDT 2002

    ```


    This construct is better than back quotes for a couple of reasons. First, complex
    commands that use combinations of forward and back quotes can be difficult to
    read, particularly if the typeface you are using doesn''t visually differentiate
    between single and back quotes; second, $(...)$ constructs can be easily nested,
    allowing command substitution within command substitution. Although nesting can
    be performed with back quotes, it''s trickier. You''ll see an example of command
    substitution later.


    Let''s emphasize something important: you''re not restricted to invoking a single
    command between the parentheses. Several commands can be executed if separated
    by semicolons; and, more commonly, you can also use command pipelines.


    Here''s a modified version of the nu program that displays the number of logged-in
    users:


    ```

    $ cat nu

    echo There are $(who | wc -1) users logged in

    Execute it

    $ nu

    There are 13 users logged

    ```


    Because quotes protect everything, the following output should be:


    ```

    $ echo ''$(who | wc -1) tells how many users are logged in''

    $(who | wc -1) tells how many users are logged in

    ```


    But command substitution is interpreted inside double quotes:


    ```

    $ echo "You have $(ls | wc -1) files in your directory"

    You have 7 files in your directory

    ```'
