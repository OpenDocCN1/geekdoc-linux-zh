    Each time you execute the program, whatever word follows on the command line will
    be stored inside the first positional parameter by the shell and handed to the
    program. In the first example, new.hire will be stored in this parameter.


    Substitution of positional parameters is identical to substitution of other types
    of variables, so when the shell sees


    tbl $1 replaces the $1 with the first argument supplied to the program: new.hire.


