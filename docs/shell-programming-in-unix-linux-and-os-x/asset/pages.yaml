- pgno: 376
  md: "# Command Summary\n\n# The unset Command\n\nGeneral Format: *unset names*\n\
    \nThis causes the shell to erase definitions of the variables or functions listed\
    \ in names. Read-only variables cannot be unset. The -v option to unset specifies\
    \ that a variable name follows, whereas the -f option specifies a function name.\
    \ If neither option is used, it is assumed that variable name(s) follow.\n\nExample\n\
    \n```\nunset dblist files    Remove definitions of variables dblist files\n```\n\
    \n# The until Command\n\nGeneral Format:\n\n```\nuntil command;\ndo\n    command\n\
    \    command\n..\n```\n\ndone\n\ncommand, is executed and its exit status tested.\
    \ If it is nonzero, it is executed enclosed between the do and done are executed.\
    \ Then command, is executed again and its status tested. If it is nonzero, the\
    \ commands between the do and done are once executed. Execution of command, and\
    \ subsequent execution of the commands between the do and done continues until\
    \ command, returns a zero exit status, at which point the loop is terminated.\
    \ Execution then continues with the command that follows the done.\n\nBecause\
    \ command, gets evaluated immediately on entry into the loop, the commands between\
    \ the do and done may never be executed if the test returns a zero exit the first\
    \ time.\n\nExample\n\n```\n# sleep for 60 seconds until jack logs on\nuntil while\
    \ | grep jack > /dev/null\ndo\n    sleep 60\ndone\n```\n\necho jack has logged\
    \ in\n\nThe preceding loop continues until the grep returns a zero exit status\
    \ (that is, finds jack in who's output). At that point, the loop is terminated,\
    \ and the echo command that follows is executed."
  merge: -1
  img_proc: true
- pgno: 377
  md: '# The wait Command


    General Format: wait job


    This command causes the shell to suspend its execution until the process identified
    as job finishes executing. Job can be a process ID or a job_id. If job is not
    supplied, the shell waits for all processes to finish executing. If more than
    one process id is listed, wait wait for all to complete.


    wait is useful for waiting for processes to have been sent to the background for
    execution.


    Example


    ```

    sort large_file > sorted_file & sort in the background

    wait Continue processing

    Now wait for sort to finish

    plotdata sorted_file

    ```


    The variable $! can be used to obtain the process ID of the last process sent
    to the background.


    # The while Command


    General Format:


    ```

    while command_c

    do

    command

    command

    ..

    ```


    command, is executed and its status tested. If it is zero, the commands enclosed
    between the do and done are executed. Then command, it is executed again and its
    status tested. If it is zero, the commands between the do and done are once again
    executed. Execution of command_c and subsequent execution of the commands between
    the do and done continue until command, returns a non-zero exit status, at which
    point the loop is terminated. Execution then continues with the command that follows
    done.


    Note that because command, gets evaluated immediately on entry into the loop,
    the commands between the do and done may never be executed if the test returns
    a non-zero exit status the first time.


    Example


    ```

    # fill up the rest of the buffer with blank lines

    while [ $lines -le $maxlines ]

    do

    echo >> $BUFFER

    lines=$((lines + 1))

    d

    ```'
  merge: -1
  img_proc: true
- pgno: 378
  md: "# For More Information\n\nMany sources of information on Unix, Linux and the\
    \ Mac OS X command line are available, but we have selected titles and Web sites\
    \ of value to shell programmers. All Web sites and URLs are valid as of the publication\
    \ of this book, but as is often the case on the Internet, some may not be available\
    \ by the time you read this.\n\nThere is one reference that you cannot do without.\
    \ This is the built-in documentation for your particular system, which offers\
    \ detailed descriptions of the syntax and various options for each command.\n\n\
    # Online Documentation\n\nIf a printed version of your system's documentation\
    \ isn't available, you can use the man command to get information (referred to\
    \ as the “man pages”) about any specific Unix command. The format is\n\n```\n\
    man command\n```\n\nNot sure of the command name? man -k can help you identify\
    \ the specific Linux or Unix command you seek, as in this example from Ubuntu\
    \ Linux:\n\n```\n$ -k dvd\n- Simple and easy to use CD/DVD burning application\
    \ for ...\nbtflash (8) - firmware flash utility for BTC DR1008 DVD+-RW recorder.\n\
    dvd-rw-booktype (1) - format DVD-RW/-RAM disk with a logical format\ndvd-rw-format\
    \ (1) - format DVD-RW/-RAM disk\ndvd-rw-mediainfo (1) - display information about\
    \ dvd drive and disk\ndvd-ram-control (1) - checks features of DVD-RAM discs\n\
    growisofs (1) - combined genoisismage frontend/DVD recording program.\nrpl8 (8)\
    \ - Firmware loader for DVD drives\n$ \n\n```\n\nSome systems have an interactive\
    \ documentation command called info. To invoke it, simply type info and after\
    \ it starts up, type h for a tutorial."
  merge: -1
