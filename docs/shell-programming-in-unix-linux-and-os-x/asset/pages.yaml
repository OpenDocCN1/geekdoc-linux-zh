- pgno: 308
  md: '# 14


    # Interactive and Nonstandard Shell Features


    In this chapter you''ll learn about shell features that are useful to interactive
    users or not part of the POSIX shell standard. These features are available in
    Bash and the Korn shell, the most commonly available POSIX-compliant shells across
    Unix, Linux, and Mac systems.


    The Korn shell was developed by David Korn of AT&T Bell Laboratories and was designed
    to be “upward compatible with both the System V Bourne shell and the POSIX standard
    shell. It is now widely available across all major *nix platforms and if you have
    access to a command line, you probably have k available to you.


    Bash (short for Bourne Shell) was developed by Brian Fox for the Free Software
    Foundation. It was also designed to be compatible with the System V Bourne shell
    and the POSIX standard shell, and additionally contains many extensions from the
    Korn and C shells. Bash is the standard on Linux and on most modern Unix and Mac
    systems that has replaced the Bourne shell (in fact, if you are using sh you''re
    probably really using bash and just don''t know).


    Except for a few minor differences, Bash and the Korn shell will provide all the
    POSIX shell''s features and add many new ones. To give you an idea of the compatibility
    of these shells with the POSIX standard, all shell programs presented in this
    book use both Bash and the Korn shell.


    We''ll note any non-standard features that we discuss in this chapter, and Table
    14.4 at the end of this chapter lists the features supported by the different
    shells.


    # Getting the Right Shell


    Up to this point we''ve dropped commands into a file and run it as a shell program
    without really discussing what shell will actually read the lines and run the
    program. By default, shell programs are run by your login shell, so it hasn''t
    been a big issue.'
  merge: -1
  img_proc: true
- pgno: 309
  md: '# Chapter 14 Interactive and Nonstandard Shell Features


    It turns out that all the major interactive shells allow you to specify which
    shell—actually, which program of the thousands included in a Unix or Linux distribution—should
    be used to run the file. If the first two characters on the first line of a file
    are #$, the remainder of the line specifies an interpreter for the file. So


    ```

    #!/bin/ksh

    ```


    specifies the Korn shell and use


    ```

    #!/bin/bash

    ```


    specifies Bash. If you use constructs or notational conventions specific to one
    shell, you can use this feature to force that shell to run your programs, avoiding
    compatibility problems.


    Since you can specify any program you want, a Perl program beginning


    ```

    #!/usr/bin/perl

    ```


    forces the shell to invoke /usr/bin/perl to interpret the lines within the file.


    You have to use this feature with caution, because many programs, such as Perl,
    do not reside in a standard place on every Unix system. Also, this is not specified
    by the POSIX standard, though it''s found in every modern shell and is even implemented
    at the operating system level on many Unix versions.


    Most commonly you''ll see system programs use this notation to ensure that Bourne
    Shell is used regardless of the user''s login shell by beginning with


    ```

    #!/bin/sh

    ```


    # The ENV File


    When you start the shell, the first thing it does is to look in your environment
    for a variable ENV. If it finds and it''s non-null, the ENV will be executed,
    like the .profile is executed when logging in. The ENV file contains commands
    to set up the shell''s environment. Throughout this chapter, we''ll mention many
    things that you may want to put into this file.


    If you decide to have an ENV file, you should set and export the ENV variable
    inside your


    ```

    $ cat .profile


    export ENV=$HOME/.alias

    ...

    $

    ```


    Note the shortcut in above: Instead of assigning the variable a value, then calling
    export, it turns out you can do both on the same line for efficiency.'
  merge: -1
  img_proc: true
- pgno: 310
  md: '# Command-Line Editing 291


    For users, the ENV file is read only when Bash is invoked with the name sh, with
    the --posix command-line option, or after set -o posix is executed (all of force
    POSIX standard compliance). By default, when a non-interactive Bash shell is started
    (for example, when you run a shell program), it reads commands from the file specified
    by the B_ENV environment variable, and when an interactive Bash shell is started
    (for example, typing bash at the command prompt), it doesn''t.


    If you''re running an older system, you should also export a variable SHELL inside
    your .profile file.


    ```

    $ SHELL .profile

    SHELL=/bin/ksh ; export SHELL

    $

    ```


    This variable is used by certain applications (such as vi) to determine what shell
    to start when you execute a shell escape. In such cases, you want to make sure
    that each time you start a new shell, the shell you want and not another Bourne


    Probably, SHELL will already be set by your login shell. You can test it with


    ```

    $ echo SHELL

    /bin/bash

    $

    ```


    Also note that the previous example demonstrates yet another way to set and export
    a variable, by having two separate commands on the same line, separated by a semicolon.
    Why the inconsistency? Because Unix is so flexible that you''ll find it common
    for shell programs you read—and users you work with— accomplish the same task
    multiple ways. Might as well get to use variations in notation!


    # Command-Line Editing


    Line edit mode is a feature of the shell that allows you to edit a command line
    in a manner that mimics features found in two popular editors. The POSIX standard
    provides the capability to mimic vi and both Bash and the Korn shell also support
    emacs line edit mode. We list the complete set of commands in Table A.4 in Appendix
    A.


    If you''ve used either of these text-based editors, you''ll find the built-in
    line editors in the shell are faithful reproductions from a functional perspective.
    This capability is one of the most useful features in the shell.


    To turn on a line use the set command with the -o mode option, where mode is either
    vi or emacs:


    ```

    $ set -o vi

    Turn on vi mode

    ```


    Put this in your .profile file to automatically start up the shell with one of
    the edit modes turned on.'
  merge: -1
  img_proc: true
- pgno: 311
  md: '# Command History


    Regardless of which shell you use, it keeps a history of all your previously entered
    commands. Each time you press the Enter key to execute a command, that command
    gets added to the end of your history.


    Depending on your settings, your command history could even be saved to a file
    and restored between sessions, so you can quickly access commands from previous
    sessions.


    By default, the history is kept in a file in your home directory named .sh_history
    (Bash). You can change this filename to anything you want by setting the HISTORYFILE
    variable. This variable can be set and exported in .profile.


    There is a limit to the number of commands the shell stores. The minimum value
    is 128 and most modern shells use 500 or more of your commands on the list. Each
    time you log in, the shell automatically truncates your history file to this length.


    You can control the size of your history file by setting the HISTSIZE variable.
    If the default isn''t adequate for your needs, set the HISTSIZE variable to a
    larger value, such as 500 or 1000. The value you assign to HISTSIZE can be set
    and exported in .profile file:


    ```

    $ HISTSIZE .profile

    HISTSIZE=500

    export HISTSIZE

    $

    ```


    Don''t go crazy with a massive history size, however: the larger the value, the
    more disk space you will need to store the history file, and the longer it will
    take the shell to search through the list when you access previous commands.


    # The vi Line Edit Mode


    After turning on the vi editor feature, you will be typing all subsequent commands
    in what vi users think of as input mode. You probably won''t even notice difference
    because what you can type in and execute commands exactly the same way that you
    do with the default shell input prompt:


    ```

    $ set -o vi

    $ echo hello

    hello

    $ pwd

    /users/pat

    $

    ```


    To make use of the line editor, you must switch to command mode by pressing the
    ESC key, usually in the upper-left corner of the keyboard. When you enter command
    mode, the cursor moves to the left one space, to the last character typed in.'
  merge: -1
  img_proc: true
- pgno: 312
  md: '# The vi Line Edit Mode 293


    The current character is whatever character the cursor is on; we''ll say more
    about the current character in a moment. You can enter vi commands only in command
    mode and that the commands are interpreted immediately upon typing them in, no
    Enter needed.


    A typical problem you may encounter when typing in long commands is that it''s
    only after typing it all that you notice an error. Inevitably, the error is at
    the beginning of the line!


    In command mode, you can move the cursor and fix the errors without disturbing
    the command line. After you''ve moved the cursor to the place where the error
    is, you can change the letters to whatever you want. Then press Enter (regardless
    of where the cursor is on the line) and it''ll be given for interpretation.


    In the following examples, the underline (_) represents the cursor. A command
    line will be shown, followed by one or more keystrokes, followed by what the line
    looks like after applying the keystrokes


    before keystrokes after


    First, let''s look at moving the cursor. Many systems will let you use the arrow
    keys on your keyboard, which makes it easy: left arrow to move left, right arrow
    to move right.


    The more vi-inspired movement commands, are h to move the cursor to the left and
    l moves it to the right. Try this by entering command mode (press Esc) and pressing
    the h a few times. The cursor can move around the line. If you want to move the
    cursor to the left or right side of the line, the shell "beeps" at you.


    ```

    $ mary had a little larb Esc $ mary had a little larb

    $ mary had a little larb h $ mary had a little larb

    $ mary had a little larb h $ mary had a little larb

    $ mary had a little larb 1 $ mary had a little larb

    ```


    After the cursor is the character you want to change, you can use the x command
    to delete the current character ("X" it out).


    Note that the b moved to the left when the x was deleted and it is now the current
    character.


    To add to the command line, you can use the i before or a commands. The i command
    inserts before the current character, and the a command adds after the current
    character. Both of these commands put you back into input mode, remember to press
    Esc to go back to command mode.


    ```

    $ mary had a little lab im $ mary had a little lamb

    $ mary had a little lamb m $ mary had a little lambm

    $ mary had a little lambb Esc $ mary had a little lammb

    $ mary had a little lambb x $ mary had a little lamb

    $ mary had a little lamb a $ mary had a little lamb_

    $ mary had a little lamb_ da $ mary had a little lambda_

    ```'
  merge: -1
  img_proc: true
