- pgno: 58
  md: '# # What Is the Shell?


    In this chapter you''ll learn what the Unix command shell is, what it does and
    why it''s a vital part of every power user''s toolbox.


    # ## The Kernel and the Utilities


    The Unix system is logically divided into two different areas: the *kernel* and
    the *utilities* (see Figure 2.1). Or, if you prefer, the kernel and everything
    else, generally all accessed through the shell.


    ![](img/dc544c8aef1333b25eff1c794c2e5ec2_58_0.png)


    Figure 2.1 The Unix system


    The various tools and utilities that make the full Unix system experience reside
    on the computer''s disk and are only brought into memory and executed as requested.
    Virtually every Unix command you know is a utility; therefore, the program resides
    on the disk and is only brought into memory at your request. So, for example,
    when you execute the `date` command, the Unix system loads the program file from
    the computer''s disk into memory and begins executing its code to take the specific
    action or actions.


    The shell is also a utility program and is loaded into memory for execution as
    part of your login sequence. In fact, it''s worth learning the precise sequence
    of events that occurs when the first shell starts on a terminal or window starts
    up.'
  merge: -1
  img_proc: true
- pgno: 59
  md: '# The Login Shell


    In the old days, terminals were physical devices that were connected to the Unix
    hardware through a direct wire. Nowadays, however, terminal programs let you stay
    within your Linux, Mac or Windows environment and interact with the system over
    the network in a managed window. Generally you launch a program such as Terminal
    or xterm, then connect to remote systems as needed using programs as `ssh, telnet,
    or rlogin`.


    For each physical terminal on a system, a program called getty will be active.
    This is depicted in Figure 2.2.


    ![](img/dc544c8aef1333b25eff1c794c2e5ec2_59_0.png)


    Figure 2.2 The getty process


    The Unix system—more precisely a program called `init`—automatically starts up
    a getty program on each terminal port whenever allowing users to log in. `getty`
    is essentially a device driver, letting the `login` program display the message
    `login:` at its assigned terminal and for someone to type in something.


    If you connect via a program like `ssh`, you''ll be assigned a pseudo-terminal
    or pseudo-tty, in Unix parlance. That’s why when you typed in `who` you saw entries
    like `pty3` or `pty1`.


    In both instances, the program that reads your account and password information,
    and the program that validates it and invokes whatever login programs are needed
    for you to “log in” if everything checks out and is correct.


    As soon as someone types in some characters followed by the `Enter` key, the login
    program finishes the process of logging in (see Figure 2.3).'
  merge: -1
  img_proc: true
- pgno: 60
  md: '# The Login Shell 41


    ![](img/dc544c8aef1333b25eff1c794c2e5ec2_60_0.png)


    When login begins execution, it displays the string Password: at the terminal
    and waits for you to type your password. After you have typed it and pressed Enter
    (you won''t see any output as type, for security reasons), login then proceeds
    to verify your login name and password against the corresponding entry in the
    file /etc/passwd. This file contains an entry for each user account that specifies,
    other things, the login name, home directory, and program to start up when user
    logs in. The last bit of information (the login shell) is stored as the last colon
    of each line. If nothing follows the colon, the standard shell /bin/sh is assumed
    by default.


    If you log through a terminal, the data handshake might involve a program like
    ssh on the server, and if you''re opening a window on your Unix computer, it will
    just let you in without having to type in your password!


    But back to the password file. The following three lines show typical lines from
    /etc/passwd for three users of the system: sue, pat, and bob:


    ```

    sue*:15:47:/users/sue

    pat*:99:7:/users/pat:/bin/khsh

    bob*:13:100:/users/data/data/bin_data_entry

    ```


    After login validates an encrypted version of the password you typed in the encrypted
    password for the specified account stored in /etc/shadow, it checks for the name
    of the login program to execute. In many cases, this will be /bin/sh, /bin/ksh,
    or /bin/bash. In other cases, it may be a special custom-designed program or /bin/nologin
    for accounts that don''t include interactive access (common for file ownership
    management). The idea underlying all of them is that you can set a login account
    to automatically run any program whatsoever whenever someone logs to the system.
    The shell is the program most often selected because of its general utility, but
    it''s not the only game in town.'
