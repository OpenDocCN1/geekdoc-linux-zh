    tests the value of the variable EDITOR. If it''s null, /bin/ed is assigned to
    it.

    The construct works similarly, except that the second command gets executed only
    if the

    ext status of the first is nonzero. So if you write

    grep "$name" phonebook || echo "Couldn''t find $name in

    phonebook, or if it can''t open the file phonebook). In this case, the equivalent
    if command

    would like


    if grep "$name" phonebook

    then

