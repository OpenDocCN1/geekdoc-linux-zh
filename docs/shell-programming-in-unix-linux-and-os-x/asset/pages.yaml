    ```


    ```

    $ printf "This string contains an interpreted\nbackslash escape: \b\n" "test\nstring"

    This string contains an interpreted backslash escape: test string

    ```


    ```

    $ printf "%s and a character: %c\n" hello A

    A string: hello and a character: A

    ```


    In the last printf, %c is used to display a single character. If the corresponding
    argument is longer than one character, only the first is displayed:


    ```

    $ printf "Just the first character: %c\n" abc

    a $

    ```


    The general format of a conversion specification is


    ```

    %[flags][.precision]type

    ```


    The type is the conversion specification from Table 9.2. As you can see, only
    the percent sign and type are required; the other parameters are called modifiers
    and are optional. Valid flags are -, +, #, and the space character


    +   - left-just the value being printed, which will make more sense when we discuss
    the width modifier.


    +   + causes printf to precede integers with a or - sign (by default, negative
    integers are printed with a sign)


    +   # causes printf to precede octal and hexadecimal integers with 0x or 0X, specified
    as %#x or %#X.


    The space character printf to precede positive integers with a space and negative
    integers with a - alignment purposes.


    A few examples. Pay attention to the format strings!


    ```

    $ printf "%d\n+%d\n" 10 -20

    +10

    +20

    ```


    ```

    $ printf "%d\n%d\n" 10 -10

    10

    -10

    ```


    ```

    $ printf "%#o #%x\n" 100 200

    0144 0xc8

    $

    ```'
  merge: -1
  img_proc: true
- pgno: 224
  md: '# The printf Command 205


    As you can see, using + or space as the flag causes a column of positive and negative
    numbers to align nicely.


    The width modifier is a positive number that specifies the minimum field width
    for printing the argument. The argument is right-justified within this field unless
    the flag is used:


    ```

    $ printf "%02d\n" string1 string2

    string1 string2

    $ printf "-%2d-%02d\n" string1 string2

    string1 string2

    $ printf "%5d%%5d\n" 1 10 100

    $ printf "-%5d%%5d\n" -1 -10 -100

    $ printf "%-5d%%5d\n" 1 10 100

    10 100

    $

    ```


    The width can be useful for lining up columns of text or numbers (Tip: for numbers
    and leading 0, %x, and %X characters are counted as part of the argument width).
    The width specifies a minimum size for the field, but if the width of an argument
    exceeds width, it can overflow or not be output at all. An easy way to test:


    ```

    printf "-%15.15s\n"this is more than 15 chars long"

    ```


    What happens on your system when you command that?


    The .precision is a positive number that specifies a minimum number of digits
    to be displayed for %d, %u, %o, %x, and %X. This results in zero-padding on the
    left of the value:


    ```

    $ printf "%5d.%4X\n" 10 27

    00010 01B

    $

    ```


    For strings, the .precision modifier specifies the maximum number of characters
    to be printed from the string. If the string is longer than precision characters,
    it is truncated on the right. It''s important to realize as you line up across
    multiple lines, but with some data missing if any individual value is wider than
    the field:


    ```

    $ printf "%6s\n" "Ann Smith"

    Ann Sm

    $

    ```


    A width can be combined with .precision to specify both a width and zero padding
    (for numbers) or truncation (for strings):


    ```

    $ printf "%:%10.5x%%5.4x%%5.4d\n" 1 10 100

    000001: 000a

    $ printf "%:%9.5s\n" abcdef

    :abcde

    $ printf ":%9-9.5s\n" abcdef

    :abcde

    $

    ```'
  merge: -1
  img_proc: true
- pgno: 225
  md: "Finally, in all case of this is not confusing enough, if a * is used in place\
    \ of a number for\nwidth or precision, the argument preceding the value to be\
    \ printed must be a number and\nbe used as the width or precision, respectively.\
    \ If a * is used in place of both, two integer\narguments must precede the being\
    \ printed and are used for the width and precision:\n\n```\n$ printf(\"%*.*s\\\
    n\" 12 \"test\" 10 2 \"test two\"\n    test one\n    te\n$ printf(\"%12s%%10s\\\
    n\" \"test one\" \"test two\"\n    test one\n    te\n$\n```\n\nAs you can see,\
    \ the two prints in this example produce the same result. In the first printf,\n\
