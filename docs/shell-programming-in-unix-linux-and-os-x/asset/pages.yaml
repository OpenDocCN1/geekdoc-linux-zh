- pgno: 43
  md: '# Filename Substitution


    The Asterisk


    One powerful feature of the Unix system that is handled by the shell is filename
    substitution. Let''s say that your current directory has these files in:


    ```

    $ ls

    chap1

    chap2

    chap3

    chap4

    $

    ```


    Suppose that you want to display their contents in masse. Easy: cat allows you
    to display the contents of as many files as you specify on the command line. Like
    this:


    ```

    $ cat chap1 chap2 chap3 chap4

    $

    ```


    But that''s tedious. Instead, you can take advantage of filename substitution
    by simply typing:


    ```

    $ cat *

    $

    ```


    The shell automatically substitutes the names of all the files in the current
    directory that match the pattern *. The same substitution occurs if you use *
    with another command too, of course. How about echo?


    ```

    $ echo *

    chap1 chap2 chap3 chap4

    $

    ```


    Here the * is replaced with the names of all the files contained in the current
    directory, and the echo command simply displays that to you.


    Any place that * appears on the command line, the shell performs its substitution:


    ```

    $ echo * *

    chap1 chap2 chap3 chap4 : chap1 chap2 chap3 chap4

    $

    ```


    The * is part of a rich file substitution language, actually, and it can also
    be used in combination with other characters to limit which filenames are matched.


    For example, let''s say that in your current directory you have not only chap1
    through chap4 but also files a, b, and c:


    ```

    $ ls

    a

    b

    ```'
  merge: -1
  img_proc: true
