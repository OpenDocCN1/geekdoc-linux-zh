    \ as:\n\n```\n$ -z \"$nullvar\" \n$ echo $?\n1\n$\n```\n\nWhen used in an if command,\
    \ the alternative format looks like this:\n\n```\nif [\"name\" = julio ]\nthen\n\
    echo \"Would you like to play a game\"\nfi\n```\n\nWhich format of the if command\
    \ you use is up to you; we prefer the [...] format, which coaxes shell programming\
    \ into a syntax much more similar to other popular programming languages, so that's\
    \ what we'll use throughout the remainder of the book.\n\n# Integer Operators\n\
    \ntest has a large assortment of operators for performing integer comparisons.\
    \ Table 7.2 summarizes these operators.\n\n| Operator | Returns TRUE (exit status\
    \ of 0) if |\n| --- | --- |\n| int₁ -eq int₂ | int₁ is equal to int₂ |\n| int₁\
    \ -ge int₂ | int₁ is greater than or equal to int₂ |\n| int₁ -gt int₂ | int₁ is\
    \ greater than int₂ |\n| int₁ -le int₂ | int₁ is less than or equal to int₂ |\n\
    | int₁ -lt int₂ | int₁ is less than int₂ |\n| int₁ -ne int₂ | int₁ is not equal\
    \ to int₂ |\n\nFor example, the operator -eq tests to whether two integers are\
    \ equal. So if you had a shell variable called count and you wanted to see whether\
    \ its value was equal to zero, you would write\n\n```\n[ \"$count\" -eq 0 ]\n\
    ```"
