  md: "# Functions\n\nModern shells support functions—long or short sequences of commands\
    \ that can be referenced or reused often as desired in a shell program.\n\nTo\
    \ define a function, you use the general format:\n\n```\nname () ... command;\
    \ }\n```\n\nwhere name is the name of the function, the parentheses denote that\
    \ a function is being defined, and the commands enclosed between the curly braces\
    \ define the body of the function. These commands will be executed whenever the\
    \ function is executed.\n\nNote that at least one whitespace character must separate\
    \ the ( from the first command, and a semicolon must separate the last command\
    \ from the closing brace if they occur on the same line.\n\nThe following defines\
    \ a function called nu that displays the number of logged-in users:\n\n```\nnu\
    \ () { wc -l; }\n```\n\nYou execute a function the same way you execute an ordinary\
    \ command: by typing its name into the shell:\n\n```\n$ nu\n```\n\n```\n22\n```\n\
    \nFunctions are really useful for shell programmers and can alleviate lots of\
    \ tedium in developing solutions. One key feature: arguments after the function\
    \ on the command line are assigned to the positional parameters $1, $2, ..., within\
    \ the function, just as with any other command.\n\nHere's a function called nrrun\
    \ that runs tbl, nroff, and lp on the file specified:\n\n```\n$ nrrun () { tbl\
    \ $1 | nroff -mm -tlp | lp; }\n$ nrrun memo  Run it in memol\n```\n\nrequest id\
    \ is laser1-33 (standard input)\n\n```\n$\n```\n\nFunctions exist only in the\
    \ shell in which they are defined so can't be passed to subshells. Because the\
    \ function is executed in the current shell, changes made to the current directory\
    \ or to the variables remain after the function has completed execution, as if\
    \ it had been invoked with the . command explored earlier in the book:\n\n```\n\
    $ db () {\n```\n\n```\n> PATH=$PATH:/uxn2/data\n> PS1=DB:\n> cd /uxn2/data\n }\n\
    ```\n\n```\n$ db\n```\n\nExecute it\n\nDB:"
