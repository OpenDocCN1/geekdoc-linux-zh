    \ the do and done to be executed as many times as there are words listed after\
    \ the in.\n\nThe first time through the loop, the first word—word—is assigned\
    \ to the variable var and the commands between the do and done executed. The second\
    \ time through the loop, the second word list—word—is assigned to var and the\
    \ commands in the loop executed again.\n\nThis process continues until the last\
    \ variable in the list—word_n—is assigned to var and the commands between the\
    \ do and done executed. At that point, execution of the for loop is terminated.\
    \ Execution then continues with the command that immediately follows the done.\n\
    \nThe special format\n\n```\nfor var\ndo\n```\n\ndone\n\nindicates that the positional\
    \ parameters \"$1\", \"$2\", ... are to be used in the list and is equivalent\
