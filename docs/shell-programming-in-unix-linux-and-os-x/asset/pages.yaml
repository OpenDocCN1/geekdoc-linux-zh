  md: '# 13


    # Rolo Revisited


    This chapter presents the final, much improved version of the rolo program enhanced
    with additional options and also allows for more general types of entries (other
    than just names and numbers). The sections in this chapter discuss the individual
    components of rolo, starting with the main rolo program itself. At the end of
    this chapter, sample output is shown.


    # Data Formating Considerations


    While the initial name-and-number rolo program shown earlier in the book is handy,
    there''s no question that more useful program would allow more than just the names
    and numbers. You''d probably want to save addresses and email addresses too, for
    example. The new rolo program allows entries in the phone book to consist of multiple
    lines. A typical entry might be


    Steve''s Ice Cream

    444 6th Avenue

    New York City 10003

    212-555-3021


    To increase the flexibility of the phone book, an individual entry can now contain
    as many lines as desired. Another entry in the phone book might read


    YMCA

    (201) 555-2344


    To logically separate entries in the phone book, each entry is "packed" into a
    single line by replacing the terminating newline in an entry with a different
    character. We arbitrarily chose the caret ^ as it appears very rarely in regular
    user input, addresses, etc. The only repercussion of this decision is that this
    character cannot be used as part of the phone entry itself.


    Using this technique, the first entry shown would be stored in the phone book
    file as

    Steve''s Ice Cream*444 6th Avenue*New York City 10003*212-555-3021*'
