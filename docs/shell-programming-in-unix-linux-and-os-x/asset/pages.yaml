- pgno: 295
  md: "```\n4) echo \"Enter name to change: \\c\"\nread name\nif [ -z \"$name\" ];\
    \ then\n    echo \"Change ignored\"\nelse\n    change \"$name\"\nfi;\n\nfi;\n\
    5) listall;\n6) exit 0;\n*) echo \"Bad choice\\\";\n```\n\nesac\ndone\n\nOne improvement\
    \ avoids in the very beginning of the new code: Instead of requiring that the\
    \ user already has a book file in their home directory, the program checks to\
    \ see whether the variable PHONEBOOK has been set. If it has, it's assumed that\
    \ it contains the name of the phone book file. If it hasn't, it's set to $HOME/phonebook\
    \ as the default.\n\nThe program then checks to see whether the actual file exists,\
    \ and if it doesn't, asks the user whether they would like to create it. This\
    \ greatly improves first experience, and you can imagine.\n\nThis version of rolo\
    \ also has a couple of choices on the menu too. Because individual entries can\
    \ be quite long, an edit option allows the user to update a particular entry.\
    \ Prior to this, of course, the only way to change an entry is to remove it, then\
    \ add a completely new entry.\n\nAnother option lists the entire phone book. With\
    \ this option, the first and last lines (fields) of each entry are displayed.\
    \ This assumes that the user follows some convention such as putting the name\
    \ on the first line and the number on the last.\n\nThe entire menu selection code\
    \ block is now inside a while loop that rolo will continue to display until the\
    \ user chooses to exit the program.\n\nAs per our last chapter, notice that a\
    \ trap command is executed before the loop is entered. This trap specifies a continue\
    \ command to be executed if an interrupt (SIGINT) is generated by the user. If\
    \ the user presses Ctrl-c in the middle of an operation (such as listing the entire\
    \ phone book), the program will stop the current operation and redisplay the main\
    \ menu.\n\nBecause entries span as many lines as desired, the action performed\
    \ when add has selected has been changed too. Instead of asking for the name and\
    \ entry, rolo invokes the add program to get the entries and let the function\
    \ take care of the user and figuring when the output data is in.\n\nFor the lookup,\
    \ change, and remove options, a check is now made to ensure that the user doesn't\
    \ end a null value by pressing the Enter key when asked to type in the name. This\
    \ avoids the regular expression error that grep would otherwise issue if given\
    \ a null first argument."
