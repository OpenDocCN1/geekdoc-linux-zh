    Please type a single character\n$\n```\n\n# Back to the case\n\nThe symbol | has\
    \ the effect of a logical OR when used between two patterns. That is, the pattern\n\
    \n```\npat_ | pat_|\n```\n\nspecifies that either pat_, or pat_ is to be matched.\
    \ For example,\n\n```\n-1 | -list\n```\n\nmatches either the value -1 or -list,\
    \ and\n\n```\ndmd | 5620 | tty5620\n```\n\nmatches any of dmd or 5620 or tty5620,\
    \ there are a number of different programmatic flow structures that can be more\
