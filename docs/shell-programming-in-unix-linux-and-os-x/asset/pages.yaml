    This is an example of a

    file that contains a lot

    of blank spaces


    The ed command


    ```

    1,$s*/ /g

    ```


    told the program to substitute all occurrences of a space followed by zero or
    more spaces with a

    single space--in other words, to all whitespace into single spaces. If it matches
    a single

    space, there''s no change. But if it matches three spaces, say, they''ll all be
    replaced by a single

    space.


    The regular expression


    ```

    .*

    ```


    is used to specify zero or more occurrences of any characters. Bear in mind that
    a regular

    expression matches the longest string of characters that match the pattern. Therefore,
    used by

    itself, this regular expression always matches the entire line of text.'
