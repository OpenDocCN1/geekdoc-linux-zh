  md: '# The read Command 193


    says to take the previous value of filelist, add on a space followed by the value
    of $1, and then store the result back into filelist. Then the shift command is
    executed to "move" all the arguments over by one. Eventually, $# will be equal
    to one, and the loop will be.


    At that point, filelist will contain a space-delimited list of all the files to
    be copied, and $1 will contain the last argument, which is either the destination
    filename or directory.


    To see this works, consider execution of the while loop when the command is executed
    as mycp names progl2 lu


    Figure 9.1 depicting the changing values of the variables through each iteration
    of the loop. The first line shows the state of the variables before the loop enters.


    ```

    $ $1 $2 $3 $4 $5 filelist

    5 names progl prog2 lu null

    4 progl2 lu bin names

    3 progl2 lu bin names prog1

    2 lu bin names prog1 prog2

    1 bin names prog1 prog2.lu

    ```


    Figure 9.1 Processing command arguments


    After the loop, the last argument contained in $1 is stored in the variable to.
    Next test is made to ensure that at least two arguments were typed on the command
    line, and if more than two were, that the last argument is a directory. If either
    condition is not satisfied, usage information is displayed to the user, and the
    program exits with a status of 1.


    Following this, the for loop examines each file in the list to see whether it
    already exists in the destination directory. If it does, the user is prompted
    as before. If the user wants to overwrite the file—or if the file doesn''t exist—the
    file is added to the shell variable copylist. The technique used here is the same
    used to accumulate the arguments inside filelist.


    When the for loop, copylist contains a list of all the files to be copied. In
    an extreme case, notice that this can be null if the user decided not to overwrite
    any files and every file specified exists in the destination directory. Therefore
    a test is made to ensure copy is non-null, and if it is, the copy is performed.


    Take some time to review the logic of the final version of mycp; it illustrates
    many of the features you''ve learned in this book. Some exercises at the end of
    this chapter will also test your understanding of this program.


