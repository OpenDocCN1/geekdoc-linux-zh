- pgno: 109
  md: '# Chapter 3 Tools of the Trade


    more than once. You can easily find such duplicate entries by first sorting /etc/passwd
    and

    piping the results into uniq -d as done previously:


    ```

    $ sort /etc/passwd | uniq -d      Find duplicate entries in /etc/passwd

    $

    ```


    There are no duplicate line /etc/passwd entries. But you really want to find duplicate

    entries for the username, so you only want to look at the first field from each
    line (recall

    that the leading characters of each line of /etc/passwd up to the colon are the
    username).

    This can''t be done directly through an option to uniq, but you could now use
    cut

    to extract the username from each line of the password file before sending it
    to uniq.


    ```

    $ sort /etc/passwd | cut -f1 -d | uniq -d      Find duplicates

    cem

    ```


    It turns out that there are multiple entries in /etc/passwd for cem and harry.
    If you wanted\more information on the particular entries, you could now grep them
    from /etc/passwd:


    ```

    $ grep ''cem'' /etc/passwd

    20:cem*:91:91:/users/cem

    166:cem*:91:91:/users/cem

    $ grep ''harry'' /etc/passwd

    29:harry*:103:103:Harry Johnson:/users/harry

    79:harry*:90:90:Harry Johnson:/users/harry

    $

    ```


    The -n option is used to find out the duplicate entries occur. In the case of
    cem, there are

    entries on lines 20 and 166; and harry''s case, the two entries are on lines 29
    and 79.


    # Other Options


    The -c option to uniq adds an occurrence count, which can be tremendously useful
    in scripts:


    ```

    $ sort names uniq -c      Count line occurrences

    ```


    +   1 Charlie

    1 Emanuel

    1 Fred

    1 Lucy

    1 Ralph

    2 Tony


    One common use of uniq -c is to figure out the most common words in a data file,
    easily

    done with a command like:


    ```

    tr ''[A-Z]'' ''[a-z]'' datafile | sort | uniq -c head

    ```'
