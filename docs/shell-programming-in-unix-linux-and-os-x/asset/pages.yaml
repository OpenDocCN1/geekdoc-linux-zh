- pgno: 320
  md: '# Other Ways to Access Your History


    If you''re running Bash and don''t want to be inundated with commands, you can
    specify the number of commands to display as an argument:


    ```

    $ history 10

    513 cp int int.sv

    514 history

    515 exit

    516 cd shell

    517 cd ch16

    518 vi all

    519 run -n5 all

    520 ps

    521 lpr all.out

    522 history 10

    ```


    # The fc Command


    The fc command allows you to start an editor on one or more commands from your
    history or to write a list of history commands to your terminal. In the latter
    form, which is indicated by giving the -l option to fc, it is like typing in history,
    only more flexible (you can specify a range of commands to be listed). For example,
    the command


    ```

    fc -l 510 515

    ```


    writes commands 510 through 515 to standard output, and the command


    ```

    fc -n -1 -20

    ```


    writes the last 20 commands to standard output, but omits command numbers (-n).
    Suppose you''ve just executed a long command and decide that it would be nice
    to turn that command line into a shell program run. You can use fc to get the
    command from your history and I/O redirection to rewrite that command to a file:


    ```

    fc -n -1 -1 > runx

    ```


    That''s the last 1 followed by the number -1 to get the most recent command (current
    minus one). fc is described in full detail in Appendix A.


    # The r Command


    A simple Korn shell allows you to re-execute previous commands using even fewer
    keystrokes. Type in the r command, and the Korn shell re-executes your last command:


    ```

    $ date

    Thu Oct 24 14:24:48 EST 2002

    $ r

    date

    Thu Oct 24 14:25:13 EST 2002

    ```


    > Re-execute previous command'
  merge: -1
