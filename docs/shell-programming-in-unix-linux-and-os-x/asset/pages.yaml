    command simply displays *x.


    # Matching Single Characters


    The asterisk (*) matches zero or more characters, meaning that x* matches the
    file x as well as x1, x2, xabc, and so on. The question (?) matches exactly one
    character. So cat*? will display all files that have filenames of exactly one
    character, as cat x? prints all files with two-character names beginning with
    x. Here we see this behavior illustrated again with echo:


    ```

    $ l

    a

    aa

    nax

    alice

    b

    bb

    c

    cc

    ```'
