    # The getopts Command


    General Format: getopts options var


    This command processes command-line arguments. options is a list of valid single
    letter options. If any letter in options is followed by a :, that option requires
    an additional argument on the command line which must be separated from the option
    by at least one space.


    Each time getopts is called, it processes the next command-line argument. If a
    valid option is found, getopts stores the matching option inside the specified
    variable var and returns a zero exit status.


    If an invalid option is (not listed in options), getopts stores a ? inside var
    and returns with a zero exit status. It writes an error message to standard error.


    If an option takes an argument, getopts stores the matching option inside var
    and stores the command-line argument inside the specified variable OPTARG. If
    no arguments are left on the command line, getopts sets var to ? and writes an
    error message to standard error.


    If no more arguments remain on the command line (if the next command-line argument
    does not begin with a -), getopts returns a nonzero exit status.


    The special variable OPTIND is also used by getopts. It is initially set to 1
    and is adjusted each time getopts returns to indicate the number of the next command-line
    argument to be processed.


    The argument -- can be placed on the command line to specify the end of the command-line
    arguments.


    getopts supports stacked arguments, as in


    ```

    repx - iau

    ```


    which is equivalent to


    ```

    repx -i -a -u

    ```


    Options that have required arguments may not be stacked.


    If the format


    ```

    getopts options args var

    ```


    is used, getopts parses the arguments specified by args rather than the command-line
    arguments.


    Example


    ```

    usage="Usage: foo [-r] [-0 outfile] infile"

    ```


    ```

    while getopts ro: opt

    ```'
