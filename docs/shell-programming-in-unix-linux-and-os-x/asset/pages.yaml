- pgno: 334
  md: '# Job Control


    The shell provides facilities for controlling jobs directly from the command line.
    A job is any command or command sequence in the shell. For example:


    ```

    who | wc

    ```


    When a command is started in the background (that is, with &), the shell prints
    out the job number inside brackets {:} as well as the process ID:


    ```

    $ who | &

    [1] 832

    $

    ```


    When a job finishes, the shell prints the message


    where n is the number of the finished job, and sequence is the text of the command
    sequence used to create the job.


    In easiest usage, the jobs command is used to print the status of jobs that haven''t
    completed.


    ```

    $ jobs

    [3] + Running make ksh &

    [2] - Running monitor & | > aps.out &

    [1] Running pic chapt2 | tro > aps.out &

    ```


    The + and - after the job mark the current and previous jobs, respectively. The
    current job is the job most recently sent to the background, and the previous
    job is the next-to-the last job sent to the background. A number of built-in commands
    may be given a job number or the current or previous job as arguments as a convenient
    shortcut.


    For example, the shell''s built-in kill command can terminate a job running in
    the background. The argument to it can be a process ID or a percent (%) to refer
    to a job number, a - (current job), a - (previous job), or another % (also current
    job).


    ```

    $ pic chapt1 | tro > aps.out &

    [1] 886

    $ jobs

    [1] + Running pic chapt | tro > aps.out &

    $ kill %1

    [1] Done pic chapt | tro > aps.out &

    $

    ```


    The preceding kill could have used %+ or %~ to refer to the same job.


    The first few characters of the command sequence can also be used to refer to
    a job; for example, kill pic would have worked in the preceding example.'
  merge: -1
  img_proc: true
- pgno: 335
  md: '# Stopped Jobs and the fg and bg Commands


    If you are running a job in the foreground (without an &) and you want to suspend
    it, you can press Ctrl+z. The job stops executing, and the shell prints the message


    ```

    $ n + Stopped (SIGTSTP) sequence

    ```


    The stopped job becomes the current job. To have continue executing, using the
    fg or bg command: the fg command causes the current job to resume execution in
    the foreground, and bg causes the current job to resume execution in the background.


    You can also specify a job number, the first few characters of the pipeline, a
    +, -, or % preceded by a % to specify any job to the fg and bg commands. These
    commands also print out the command sequence to remind you what is being brought
    to the foreground or sent to the background.


    ```

    $ fg memo photo

    Ctrl+z

    [1] + Stopped (SIGTSTP) traff memo | photo

    $ bg

    [1] traff | photo &

    $

    ```


    The preceding sequence is one of the most used with job control: stopping a running
    foreground job and sending it to the background.


    If a job running in the background tries to read from the terminal, it is stopped,
    and the message


    ```

    $ - Stopped (SIGTTIN) sequence

    ```


    is printed. Then it can be brought to the foreground with the fg command to enter
    the data required. After entering the input, the job can be stopped again (with
    Ctrl+z) and moved to the background to continue running.


    Output from a background job normally goes directly to the terminal, which can
    be confusing if you''re doing something else at the time. There''s a fix, though:
    the command


    ```

    stty tostop

    ```


    causes any background job that attempts to write to the terminal to be stopped
    and the message


    ```

    $ - Stopped (SIGTTOU) sequence

    ```


    to be printed. (Bash generates slightly different messages than the ones shown
    here, but the functionality is identical)


    The following shows how job control might be used:


    ```

    $ stty tostop

    $ rundb Start up data base program

    ??? find green red Find green and red objects This may take a while

    Ctrl+z

    ```'
  merge: -1
  img_proc: true
