  md: '# Command


    | Command | Meaning |

    |--- |--- |

    | Esc d | Delete current word. |

    | erase char | (User-defined erase character, usually # or Ctrl+h), delete previous
    character. |

    | Ctrl+p | Get previous command from history. |

    | Ctrl+n | Get next command from history. |

    | Ctrl+r string | Search history for the most recent command line containing string.
    |


    # Other Ways to Access Your History


    There are several ways to access your command history that are worth noting if
    you don''t find that either the vi or emacs edit modes work for you.


    # The history Command


    The easiest way to access your command history is actually to just type in the
    command history:


    ```

    $ cd shell

    507 cd ch15

    508 vi int

    509 ps

    510 echo $HISTSIZE

    511 cat $ENV

    512 cp int.sv

    513 history

    514 exit

    515 cd shell

    516 cd ch16

    517 vi all

    518 run -n5 all

    519 ps

    520 lpr all.out

    521 history

    ```


    The numbers to the left are relative command numbers (command number 1 would be
    the first, or oldest, command in your history).


    Be aware that the history command differs between the Korn and Bash shells: The
    Korn shell command writes your last 16 commands to standard output while Bash
    will list your entire command history, even if it''s 500 or 1000 lines long.'
