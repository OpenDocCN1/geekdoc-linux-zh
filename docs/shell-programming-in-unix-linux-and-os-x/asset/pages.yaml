- pgno: 328
  md: '# Arrays 309


    The following aliases are automatically defined when the Korn shell starts up:


    ```

    autoload=''typeset -fu''

    functions=''typeset -f''

    history=''fc -l''

    integer=typeset -i

    local=typeset

    nohup=''nohup''

    r=''fc -e''

    suspend=kill -STOP $$

    ```


    Note from the preceding example that r is actually an alias for the fc command
    with the -e option, and history is an alias for fc -1. By comparison, Bash doesn''t
    automatically define any aliases by default.


    # Removing Aliases


    The alias command is used to remove aliases from the alias list. The format is
    unalias name


    which removes the alias name and unalias -a removes all aliases.


    If you develop a set of alias definitions that you ta like to use during your
    login sessions, you might want to define them inside your ENV file so that they
    will always be available for you to use, as they don''t otherwise migrate to subshells.


    # Arrays


    Both Korn and Bash provide a limited array capability. Bash arrays may contain
    an unlimited number of elements (subject to memory limits); Korn shells are limited
    to 4096 elements. Array indexing in both shells starts at zero.


    An array element is accessed with a subscript, which is an integer-valued expression
    enclosed within square brackets. You dont declare the maximum size of a shell
    array either, you simply assign values to elements as needed. The values that
    you can assign are the same as for ordinary variables:


    ```

    $ arr[0]=hello

    $ arr[1]=some text

    $ arr[2]=users/steve/memos

    $

    ```


    To retrieve an element from an array, you need to write the array name by an open
    bracket, the element number and a close bracket. The entire construct must also
    be'
