    # The test Command


    Though the previous example used a pipeline to test the if statement, a built-in
    shell command test is much more commonly used for testing one or more conditions.
    Its general format is


    ```

    test expression

    ```


    where expression represents the condition you''re testing. test evaluates expression,
    and if the result is true, it returns an exit status of zero, otherwise the result
    is false, and it returns a nonzero status.


    # String Operators


    As an example, the following command returns a zero exit status if the shell variable
    name contains the characters julio:


    ```

    test "name" = julio

