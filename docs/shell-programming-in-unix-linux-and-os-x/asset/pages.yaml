- pgno: 345
  md: '# Command Re-entry


    The shell keeps a history list of recently entered commands. The number of commands
    available is determined by the HISTSIZE variable (default is typically 128), and
    the file in which the history is kept is determined by the HISTFILE variable (default
    is $HOME/.sh_history). Because the command history is stored in a file, these
    commands are available after you log off and back on.


    There are three ways you can access the command history.


    # The fc Command


    The built-in fc allows you to run an editor on one or more commands in the command
    history. When the edited command is written and you leave the editor, the edited
    version of the command is executed. The editor is determined by the FCEDIT variable
    (default ed). The -e option may be used with fc to specify the editor rather than
    FCEDIT.


    The -s option causes commands to be executed without invoking an editor. A simple
    editing capability is built to the fc -s command, an argument of the form


    ```

    old=new

    ```


    may be used to change the first occurrence of the string old to the string new
    in the command(s) to be re-executed.


    # vi Line Mode


    The shell has a vi compatible edit mode. When vi mode is turned on, you are placed
    in a state that vi''s input mode. You can press the ESC key to be placed in edit
    mode, at which point most commands will be interpreted by the shell. The command
    line can be edited, as any of the lines in the command history. Pressing Enter
    at any point in command or input mode causes the command to be executed.


    Table A.4 lists all editing commands in vi mode. Note: [count] is an integer and
    can be omitted.


    | Table A.4 vi Editing Commands |

    | Command | Meaning |

    | erase | (Erase character, usually Ctrl+h or #); delete previous character. |

    | Ctrl+w | Delete the previous blank-separated word. |

    | kill | (Line character, normally Ctrl+u); delete the current line. |

    | eof | (End-of-file character, normally Ctrl+d); terminate the shell if the current
    line is empty. |'
