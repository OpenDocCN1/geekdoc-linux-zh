- pgno: 254
  md: 'Variables defined this way otherwise behave as normal exported variables to
    the subshell but don''t exist for the invoking shell once that line of code is
    executed.


    # Your .profile File


    In Chapter 2 you learned about the login sequence completed before the shell displays
    your command prompt, ready to type your first command. Before the prompt, the
    shell looks for and reads two special files on the system.


    The first is /etc/profile, set up by the system administrator. It generally checks
    to see whether you have it (where the "You may have" message comes from), sets
    your default file creation (umask), establishes a default PATH, and anything else
    that the administrator wants to happen when a user logs in.


    More interestingly, the second file that gets automatically executed is .profile
    in your home directory. Most Unix set up a default .profile when the account is
    created, so let''s start by seeing what''s in:


    ```

    $ cat $HOME/.profile

    PATH=/bin:/usr/bin:/usr/lbin::

    export PATH

    ```


    This is a pretty modest .profile that simply sets the PATH and exports it when
    executed.


    You can change your .profile file to include any commands that you want executed
    when you log in, including which directory you start out in, a check of who''s
    logged in, the instantiation of any system alias you prefer. You can put commands
    in your .profile that overrides settings (usually environment variables) in /etc/profile.


    Since we''ve change your current working directory within the .profile, it should
    be no surprise that the login actually executes these files if you typed

    $ .etc/profile

    $ .profile


    as soon as you logged in. This also means that changes to your environment within
    the .profile remain until you log out of the shell.


    Most Unix users dabble their .profile to change lots of aspects of their command
    line environment. For example, here''s a sample .profile that sets PATH to include
    your own bin, sets prompt, changes the primary and secondary command prompt, changes
    the erase character to a backspace (Ctrl-) with stty, and prints a friendly message
    using the greetings program from Chapter 7:


    ```

    $ cat $HOME/.profile

    PATH=/bin:/usr/bin:/usr/lbin:$HOME/bin::

    CDPATH=$HOMEHOME:$HOME/misc:$HOME/documents

    ```'
  merge: -1
  img_proc: true
