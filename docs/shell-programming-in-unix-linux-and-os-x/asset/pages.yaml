    # ${n}


    If you supply more than nine arguments to a program, you cannot access the tenth
    and greater arguments with $10, $11, and so on. If you try to access the tenth
    argument by writing


    ```

    $10

    ```


    the shell actually substitutes the value of $1 followed by a 0. Instead, the format
    ${n}


    must be used. To directly access argument 10, you must write


    ```

    ${10}

    ```


    in your program, and so on for arguments 11, 12, and so on.


    # The shift Command


    The shift command allows you to effectively left-shift your positional parameters.
    If you execute the command


    ```

    shift

    ```


    whatever was previously stored inside $2 will be assigned to $1, whatever was
    previously stored in $3 will be assigned to $2, and so on. The old value of $1
    will be irretrievably lost.


    When this command is executed, $# (the number of arguments variable) is automatically
    decremented by one:


    ```

    cat tshift

    echo $ #*\hift

    echo $ #*

