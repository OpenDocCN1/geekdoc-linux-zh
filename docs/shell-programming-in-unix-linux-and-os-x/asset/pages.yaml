    where min specifies the minimum number of occurrences of the regular expression
    to be matched, and max specifies the maximum. Notice that you need to escape the
    curly brackets by preceding each with a backslash.


    The regular expression


    matches from one to 10 consecutive x''s. Whenever there''s a choice, the largest
    pattern is matched, so if the input text contains eight consecutive x''s, that
    is many will be matched by the preceding regular expression.


    As another example, the regular expression


