- pgno: 282
  md: "The shell fed every line typed into the shell as the standard input stream\
    \ of wc until encoun-\tered line containing ENDOFDATA.\n\nIn-line input redirection—also\
    \ referred to as here documents by some programmers—is a\npowerful feature when\
    \ used inside shell programs. It lets you specify the standard input to a\ncommand\
    \ directly in the program, obviating the need to write it into a separate file,\
    \ or to\necho to get it into the standard input of the command.\n\nHere’s a common\
    \ example of how this feature is used within a shell program:\n\n```\n$ cat mailag\n\
    mail * <<END-OF-DATA\n```\n\nAttention:\n\nOur monthly users group meeting\nwill\
    \ take place on Friday, March 4, 2016 at\n8pm in Room 1A-308. Please try to attend.\n\
    \n```\nEND-OF-DATA$\\$\n```\n\nTo send this message to all members of the group\
    \ as stored in the file users_list, you could\ninvoice\n\n```\nmailmsg $(cat users_list)\n\
    ```\n\nThe shell performs parameter substitution for the redirected input data,\
    \ executes back-quoted\ncommands, and recognizes the backslash character.\n\n\
    Special characters within a here document are generally ignored, but if you use\
    \ dollar signs,\nback quotes, or backslashes in these lines, they can be interpreted.\
    \ To have them ignored,\nprecede them with a backslash character. Alternatively,\
    \ if you want the shell to leave all input\nlines completely untouched, the end\
    \ of document word that follows the << with a\nbackslash.\n\nLet’s highlight the\
    \ difference between the two:\n\n```\n$ cat <<FOOBAR\n> $HOME\n> ******\n> \\\
    foobar\n> `date\n> FOOBAR Terminates the file\n/users/steve\n*****\n$foobar\n\
    Wed Oct 2 15:23:15 EDT 2002\n$\n```"
