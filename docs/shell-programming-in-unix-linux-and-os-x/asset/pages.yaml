  md: '# Command Substitution 117


    Moving further into the world of shell scripting, let''s see how this works with
    file redirection. For example, to store the contents of a file into a variable,
    you can use the handy cat command:


    ```

    $ namelist=$(cat names)

    $ echo "$namelist"

    Charlie

    Emanuel

    Fred

    Lucy

    Ralph

    Tony

    Tony

    $

    ```


    If you want to mail the contents of the file memo to all the people listed in
    the names file, you can do the following:


    ```

    $ mail $(cat names) < memo

    $

    ```


    Here the replaces the cat command with its output on the command line, so it looks
    like:


    ```

    mail Charlie Emanuel Fred Ralph Tony Tony < memo

    ```


    Then the shell executes mail, redirecting its standard input from the file memo
    and passing it to the seven recipients specified.


    Notice that Tony might receive the same mail twice because he is listed twice
    in the names file. You can remove any duplicate entries from the file by using
    sort with the -u option (remove duplicate lines) rather than using cat to ensure
    each person only receives mail:


    ```

    $ mail $(sort -u names) < memo

    $

    ```


    Remember that the shell does filename substitution after it substitutes the output
    from commands. Enclosing the commands in double quotes prevents the shell from
    doing the substitution on the output.


    Command substitution is often used to store the value in a shell variable. For
    example, if the shell variable name contains someone''s name, and you want to
    convert every character in that variable to uppercase, you could use echo to send
    the variable to tr''s input, perform the translation, and then assign the result
    back to the variable:


    ```

    $ name="Ralph Kramden"

    $ name=$(echo $name | tr ''[a-z]'' ''[A-Z]'')

    $ echo $name

    RALPH KRAMDEN

    $

    ```


