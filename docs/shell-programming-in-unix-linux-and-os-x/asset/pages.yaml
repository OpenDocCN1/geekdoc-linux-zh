    # The && and || Constructs


    The shell has two special constructs that enable you to execute a command based
    on whether

    t preceding command succeeds or fails. In case you think this sounds similar to
    the if

    command, well it is. Sort of. It''s a shorthand form of the if.


    If you write

    command, && command;


    anywhere the shell expects to see a command, command, will be executed, and if
    it returns

    an exit status of zero (success), command, will be executed. If command, returns
    a non-zero exit

    status (fail), command, is not invoked if ordered.


    For example you write

    sort bigdata > /tmp/sortout && mv /tmp/sortout bigdata


    then the mv command will be executed only if the sort is successful. Note that
    this is

    equ to writing

    sort bigdata > /tmp/sortout

    then

