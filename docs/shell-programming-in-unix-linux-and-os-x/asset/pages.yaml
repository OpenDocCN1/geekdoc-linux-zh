- pgno: 366
  md: '# Command Summary


    # The jobs Command


    General Format: jobs


    The list of active jobs is printed. If the -l option is specified, detailed information
    about each job, including its process ID, is listed as well. If the -p option
    is specified, only process IDs are listed.


    If an optional job_id is supplied to the jobs command, just information about
    that job is listed.


    Example


    ```

    $ sleep 100 &

    [1] 1104

    $ jobs

    [1] + Running      sleep 100 &

    n$

    ```


    # The kill Command


    General Format: kill -signal job


    The kill command sends the signal to the specified process, where job is a process
    ID or job_id, and signal is a number or one of the signal names in <signal.h>
    (see the description of trap later in the chapter). kill -1 lists these names.
    A signal number supplied with the -l option lists the corresponding signal name.
    A process ID used with the -1 option lists the name of the signal that terminated
    the specified process (if it was terminated by a signal).


    The -s option can also be used when a signal name is supplied, in which case the
    dash before the name is not used (see the following example).


    If signal isn''t specified, SIGTERM (TERM) is used.


    Examples


    ```

    kill -9 1234

    kill -HUP $2 3456

    kill -s TERM $2

    kill $1

    ```


    # The newgrp Command


    General Format: newgrp group


    This command changes your real group id (GID) to group. If no argument is specified,
    it changes you back to your default group.'
  merge: -1
  img_proc: true
- pgno: 367
  md: '# Appendix A Shell Summary


    Examples


    ```

    newgrp shbook    Change to group shbook

    newgrp             Change back to default

    ```


    If a password is associated with the new group, and you are not listed as a member
    of the group, you will be prompted to enter it.


    ```

    newgrp -l changes you back to your login group.

    ```


    # The pwd Command


    General Format: pwd


    This command tells the shell to print your working directory, which is written
    to standard output.


    Examples


    ```

    $ pwd

    /users/steve/documents/memos

    $ cd

    $ pwd

    /users/steve

    $

    ```


    # The read Command


    General Format: read vars


    This command causes the shell to read a line from standard input and assign successive
    whitespace-delimited words to the variables vars. If fewer variables are listed
    than there are words on the line, the additional words are stored in the last
    variable.


    Specifying just one variable has the effect of reading and assigning an entire
    line to the variable.


    The exit status of read is zero unless an end-of-file condition is encountered.


    Examples


    ```

    $ read hours mins

    10 19

    $ echo "$hours:$mins"

    10:19

    $ read num rest

    39 East 12th Street, New York City 10003

    $ echo "$num\n$rest"

    39

    East 12th Street, New York City 10003

    ```'
  merge: -1
  img_proc: true
