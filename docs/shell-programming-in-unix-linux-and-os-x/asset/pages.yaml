    uses the string comparison operator = to test the two strings are identical. They''re
    not, because the first string is composed of the three characters 005, and the
    second single character 5.


    In the second test, the integer comparison operator -eq is used. Treating the
    two values as integers (numbers), 005 is equal to 5, as verified by the test exit
