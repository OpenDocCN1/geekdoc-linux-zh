  md: '# Command Files


    # 95


    You can save yourself some typing by placing this command sequence into a file—let''s
    call it run—making it executable, and then just typing the name run whenever you
    want to run a new copy of the proposal:


    ```

    $ cat run

    tbl sys.caps | nroff -mmTlp | lp

    $ chmod +x run

    $ run

    ```


    ```

    request id is laser1-15 (standard input)

    $

    ```


    (The request id message in the example is from the lp command.) For the next example,
    suppose that you want to write a shell command stats that prints the date and
    time, the number of users logged in, and your current working directory. The three
    command sequences you need to get this information are date, who | wc -1, and
    pwd:


    ```

    $ cat stats

