- pgno: 190
  md: "The until Command 171\n\nSimple, but ineffective because it runs once and is\
    \ done. You could run the program periodically throughout the day (rather tedious),\
    \ or better, you could write your own program to continuously check until she\
    \ logs in!\n\nLet's call program waitfor and have it take a single argument: the\
    \ name of the user we want to monitor. Instead of having the program continuously\
    \ check for user logging on, however let's have it check only every minute. To\
    \ do this, we'll have to use a command called `sleep`, which suspends execution\
    \ of a program for a specified number of seconds. The command\n\n```\nsleep n\n\
    ```\n\nsuspends execution of the program for n seconds. At the end of the interval,\
    \ resumes execution where it left off—with the command that immediately follows\
    \ `sleep`.\n\n```\n$ cat waitfor\n#\n# Wait until a specified user logs on\n#\n\
    if [ \"$#\" -ne 1 ];\nthen\n    echo \"Usage: waitfor user\"\n    exit 1\n\nuser=\"\
    $1\"\n#\n# Check every 60 seconds for user logging on\n#\nuntil who | grep \"\
    ^$user\" > /dev/null\ndo\n    sleep 60\ndone\n#\n# When we reach this point, the\
    \ user has logged on\n#\necho \"$user has logged on\"\n$\n```\n\nAfter checking\
    \ that exactly one argument was provided, the program assigns $1 to user. Then\
    \ an until loop is entered to be executed until the `grep` exit status is zero;\
    \ that is, until the specified user logs on. As long as the user is not logged\
    \ in, the body of the loop—the `sleep` command—is executed for execution for 60\
    \ seconds. At the end of the minute, the pipeline listed after the until is re-invoked\
    \ and the process is repeated."
  merge: -1
  img_proc: true
- pgno: 191
  md: 'When the loop is exited—signaling the monitored user has logged on—a message
    displayed at the terminal to that effect and the script is done.


    $ waitfor Time passes

    sandy has logged on

    $


    Of course, running the program as shown here is not very practical because it
    ties your terminal until sandy logs on. A better idea is to run waitfor in the
    background so that you can use your terminal for other work:


    ```

    $ waitfor & Run it in the background

    [1] 4392 Job number and process id

    $ nroff newmemo Do work

    ```


    ...

    sandy has logged on Happens sometime later


    Now you can do other with the waitfor program executing in the background sandy
    logs on, or until you log off the system.


    # Note


    By default, all your processes are automatically terminated when you logged off.
    If you want a program to continue after you''ve logged off, you can run it with
    the nohup command, or schedule it to run at or from cron. Consult your Unix User''s
    Manual for more details.


    Because waitfor only checks once per minute for the user logging, it won''t consume
    many resources while it''s running (an important consideration when running programs
    in the background).


    Unfortunately, after the specified user logs on, there''s a chance you might miss
    the one-line notification message. If you''re editing a file with a screen editor
    until vi, the notification message could turn your screen into a mess, and you
    still might not be able to read it!


    A better alternative might be to mail it to yourself. Here, you can let the user
    choose which they''d prefer by adding an option to the program, if selected, indicates
    that the message is mailed. If not, the message is displayed at the terminal.


    In the version of waitfor that follows, a -m option has been added for this purpose:


    ```

    $ cat waitfor

    #

    # Wait until a specified user logs on -- version 2

    #

    ```


    ```

    if [ "$1" = -m ]

    then

    mailopt=TRUE

    shift

    ```'
