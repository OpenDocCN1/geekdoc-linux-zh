  md: "# Command Summary 345\n\n```\ncommand\ncommand\n...\nfi\n```\n\ncommand, is\
    \ executed and its exit status tested. If it is zero, the commands that follow\
    \ up to the fi are executed. Otherwise, the commands that follow up to the fi\
    \ are skipped.\n\n# Example\n\n```\nif grep $sys sysnames > /dev/null\nthen\n\
    \  echo \"$sys is a valid system name\"\nfi\n```\n\nIf the grep returns an exit\
    \ status of zero (which it will if it finds $sys in the file sysnames), the echo\
    \ command is executed; otherwise it is skipped.\n\nThe built-in command test is\
    \ often used as the command following the if, either by explicitly calling test\
    \ or using its mnemonic shortcut, [ the latter of which requires a matching ].\n\
    \n# Example\n\n```\nif [ $ -eq 0 ]; then\n  echo \"Usage: $0 [-1] file ...\"\n\
    \  exit 1\n```\n\nAn else clause can be added to the if to be executed if the\
    \ command returns a nonzero exit status. In this case, the general format of the\
    \ if becomes\n\n```\nif command;\nthen\n  command\n  command\n...\nelse\n  command\n\
