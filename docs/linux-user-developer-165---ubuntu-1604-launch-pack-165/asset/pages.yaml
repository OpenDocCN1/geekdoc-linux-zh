  md: "# Tutorial Systems Programming\n\n![](img/c60316a3f000be7434c59c5f27a4f427_31_0.png)\n\
    \n# Systems Programming Interprocess Communication\n\nMihalis Tsoukalos\nMihalis\
    \ Tsoukalos is a UNIX administrator, a programmer UNIX enthusiast, a mathematician.\
    \ He has worked with Linux since 1993. He has many mactsou (Twitter) at http://www.mtsoukalos.eu/.\n\
    \n+   Resources\n A text editor as Emacs or vi\nThe gcc compiler\n The Perl compiler\n\
    The Go compiler\nThe Python compiler\n\n# Create a dialogue between processes\
    \ with pipes, FIFOs, and shared memory\n\nIPC allows processes to talk to each\
    \ other. The history of IPC on UNIX started with pipes, which is the oldest method\
    \ of IPC, and now we use the internet, which is another form of IPC. Pipes and\
    \ the internet, shared memory, and UNIX domain sockets, which are all going to\
    \ be covered in this tutorial.\n\n# Introduction to IPC\n\nThe most popular technique\
    \ used in UNIX systems is the pipe, which exists since the early versions of UNIX.\
    \ As a simple example, the following command uses a pipe to feed the output of\
    \ one command to another:\n\n```\nls | grep\n```\n\neach command (two here), and\
    \ the standard output of the first process (ls) is linked to the standard input\
    \ of the second process (grep), and then the output of the second command would\
    \ have been the input to the third command and so on, until the last command.\n\
    \nThere exist two system calls that can help you implement a pipe: create a pipe.\
    \ Figure 1 (see p5) shows a small part of the pipe(2) man page. Inside the main\
    \ page of pipe(2), you will also find a diagram showing how the pipe(2) takes\
    \ an array of two elements as input; the array returns two file descriptors where\
    \ the\n\ndescriptor with index [1] is for writing and index [0] is for reading\
    \ data. What a pipe really does connect these two file descriptors. If the pipe(2)\
    \ call is successful, it returns 0 otherwise it returns -1. The open(2) system\
    \ call makes your file descriptor accessible to another process asynchronously.\
    \ However, between the scenes, pop(3) uses pipe(2)\n\nA different way of communication\
    \ is through server and client models, which are common on networks. Each of them\
    \ communicate with the help of the socket(2) system call. The socket(2) system\
    \ call can also create UNIX domain sockets\n\nPipes are the oldest form of IPC\
    \ communication, but they are limited in some ways. They usually communicate in\
    \ one direction, and they can be used between related processes. The parent and\
    \ child use the pipe to communicate. The pipe must be available to be created\
    \ by both the parent and the child, the pipe must be created before the fork(2)\
    \ system call. executing it generates the following output:\n\n```\n$ /pipes \"\
    Linux User and Developer\"\n$ read 24 bytes\nLinux User and Developer\n```\n\n\
    Tutorial files available:\nfilesito.co.uk\n\n32"
