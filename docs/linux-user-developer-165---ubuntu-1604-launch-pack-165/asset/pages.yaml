  md: '# Tutorial OpenShot 2.0


    ![](img/c60316a3f000be7434c59c5f27a4f427_39_0.png)


    # Slice clips


    Like the trim, the slice feature allows you to quickly lose a portion of the clip
    in the timeline. By positioning the play-head (the red line) where you wish to
    make the slice, right-click the clip, Select clip and choose the appropriate option.
    If you wish to keep the footage to the right of the play-head, Select right side,
    for instance.


    Note that this should be used to trim large chunks of footage only; use the Split
    tool to tune fine clip length.


    ![](img/c60316a3f000be7434c59c5f27a4f427_39_1.png)


    # 08 View clip properties


    To find information about your clips, you can right-click and view the Properties,
    which display various details, such as volume, and duration.


    Some of these values are adjustable - for instance, you can manually alter the
    volume of a clip by setting the Volume property, into the value box, and overriding
    the existing value.


    The Properties box can be closed by clicking the X in the top-right corner. It
    can also be docked (undocked after dragging the arrow next to it.


    ![](img/c60316a3f000be7434c59c5f27a4f427_39_2.png)


    # Get the Ken Burns effect


    OpenShot 2.0 makes it very easy to make a video with filters like the use of the
    pan and Ken Burns effect. To import your image files, use the dialog box, select
    the Zoom-in/out effect, Zoom in, or Zoom out, fades or transitions, and add a
    soundtrack to project track to complete the slideshow


    # 09 Trim clip


    One of most common tasks when editing a video is to trim the individual clips
    so that they end where you require.


    This can be done with OpenShot 2.0 while the clip is selected: hover the mouse
    pointer over the beginning or end of the clip, you should change into a two-headed
    arrow. All you need is to drag the edge of the clip to shorten – the start or
    end position is displayed in the preview window.


    # Rename and add tags


    By right-clicking a set of clips it is a great idea to start giving them names.
    You can do this by double-clicking a file name and selecting Video Detail, then
    to describe something.


    You can also use clips tags to make it easier to find what you''re looking for.
    Just double-clicking in the Tags column and label clips of a similar topic with
    appropriate


    # 10 Right-click options


    A variety of options are available when you right-click a clip. For instance,
    if we''re editing video, we want to start with a quick fade, which can be introduced
    by right-clicking and selecting Face > Start of clip | Fade in. If we want to
    add a fade to the beginning and end, we can use the Enter duration.


    Many other options are available in the right-click menu, from and wipe (Animation)
    to animate the video and audio background, fast or slow (Time).


    # 14 Using transitions


    One of the best ways to connect related clips in a video editing project is to
    employ transitions. These are an interesting way of moving between clips than
    the simple fade, and a large collection are included in OpenShot 2.0.


    ![](img/c60316a3f000be7434c59c5f27a4f427_39_3.png)


    # Split your clip


    Rather than trim the start and end of a clip, you can do this by right-clicking
    the clip in the Projects View > video, and selecting Split.


    In the resulting window, click Play or drag the slider to the point where you
    wish to split the clip, and select the Split button. Repeat the action for where
    you want the clip to end, this time Ending. Once you''re done, give the clip a
    name and Create.


    > Several tools in OpenShot 2.0 are provided to trim and slice clips to size'
