  md: '# systemd and fleet


    systemd is an init system that provides features for starting, stopping, and managing
    processes during the boot process of a computer. To let systemd know how to run
    systemd units, you need to configure the fleet units. Furthermore, fleet is not
    a CoreOS feature or a sub system. Rather, systemd is a separate project that existed
    before CoreOS. CoreOS used the system approach and built fleet at the cluster
    level. The units used in fleet are basically the system units with a few fleet-specific
    properties added. To use fleet from a machine that is part of a CoreOS cluster,
    you can directly use the fleetctctl utility. To connect to the cluster, just log
    in to the nodes of the cluster via SSH, and then use fleetctctl. Options provided
    by fleetctctl are analogous to systemd command line options for systemd units.


    # 04 fleet architecture and unit


    There are two types of units that can run on a CoreOS cluster: standard and global
    units. Standard units are long-running processes scheduled on a single machine;
    global units run on all machines in the cluster.

    So, how does fleet know if a node has crashed and apps running on it need to be
    moved? There are two types of node: the leader/fleet engine and slaves nodes.
    As fleet starts up (if no leader is elected), all nodes elect a node as leader
    to make scheduling decisions. The leader parses parses new requests (generally
    unit files), finds qualified nodes to run them, and


    ![](img/c60316a3f000be7434c59c5f27a4f427_50_0.png)


    ![](img/c60316a3f000be7434c59c5f27a4f427_50_1.png)


    > systemd is a separate project that existed long before CoreOS. CoreOS used the
    system approach and built fleet upon it


    fleetctctl from your workstation

    Fleet has an inbuilt security mechanism, SSH. If you want to use fleetctctl from
    your workstation, you need to configure fleet to use an SSH tunnel. Another way
    to do this is to configure the SSH key in ~/.ssh/config and then use the fleetctctl...
    TUNNEL via the command line.'
