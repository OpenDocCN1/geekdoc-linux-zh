  md: '# Import video clips


    You''ll need some video clips to start using OpenShot 2.0. Get started by clicking
    the + symbol on the toolbar, and select the files to import. Pretty all common
    audio and video formats are supported, so unless you''re importing footage from
    a raw device, you should find that the selected images import without any issue,
    once you click the Open button.


    If you encounter problems with your files, try an image converting tool to save
    the files in a format that OpenShot 2.0 can read.


    # Configure your video settings


    With the save settings, determine the quality of the video. Choose the best profile
    dialog in the toolbar, and for instance the video will be produced in 720p at
    24 frames per second.


    This might be insufficient for your project, but you can resolve this with super-definition
    or higher frame rate. You can go as high as 1080p and 60fps, or as low as VGA
    and 15 fps.


    ![](img/c60316a3f000be7434c59c5f27a4f427_38_0.png)


    # Navigate the timeline


    Gaining familiarity with how the timeline works is the learning curve in video
    editing suite; many have quirks and tricks that are not immediately obvious.


    Here, the small timeline above the timeline features a scroll bar. You can right-click
    it to Add Snap toggle (for easier positioning of clips), Add Marker for highlighting
    where you plan to make cuts - and then Zoom. Zoom can be adjusted by clicking
    the +/- buttons, or by dragging the slider.


    ![](img/c60316a3f000be7434c59c5f27a4f427_38_1.png)


    > Left timeline is easy to navigate, even if you''ve never used this kind of software
    before


    > Create videos from clips


    Slideshow allows creating videos by importing images to your project, choosing
    them and adding to timeline. The slideshow box gives you the option to re-order
    the images, and set an overall...


    # Save and autosave


    Now is time to save the project, which will be saved in a custom project file,
    or as you give a description before leaving out.


    If you''re concerned about losing work due to crashes, you can configure the autosave
    feature. Open Edit > Preferences > Autosave and set a suitable interval. If you
    find it helpful, leave it. If not - just don''t make the interval too small.


    ![](img/c60316a3f000be7434c59c5f27a4f427_38_2.png)


    # Drag videos to the timeline


    The heart of all good video editing is the timeline. You can start dragging the
    clips into the timeline, which can then be gathered in a single track. Audio and
    images can also be added to tracks. Move them, overlap them or sort them in any
    order. Hover the mouse between two clip units until it turns to a cross with arrows.
    Then, left-click and drag left or right, or you drop...


    # Preview your video


    Before you save, it''s a great idea to preview the clips as they are currently.
    This will help you get an idea of where you want to make changes, add transitions
    or wipes, trim clip and slice.


    Click the Play button in the Video View. Note that you can rewind, jump to the
    start, start forward and jump to the end with accompanying clips. If you delete
    any clips are no longer needed, just right-click and select Remove.


    Now you have a rough idea of what your video will look like, it''s time to move
    on to giving some ideas.'
