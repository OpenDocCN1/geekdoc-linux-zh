  md: '# Tutorial Create a virtual machine


    # Turn a GNU/Linux box into a virtual machine


    Solve complex software issues without the concern that you damage your computer


    From time to time, a bug can affect a critical layer of the operating system,
    the GNU Clibc (as seen in CVE-2015-0235 and CVE-2015-7547), or the GNU Kernel
    itself (as in CVE-2016-0728). Patching such things to be straightforward when
    you are not lucky; old systems still be running on your network. The only way
    to fix them is by hand, with all the risk this entails: kernel panic during the
    booting process, segmentation faults that occur out of the blue, etc. Having a
    cloned system will allow you to apply your patches and then deploy it on the actual
    computer.


    Preparations

    Cloning a GNU/Linux computer to fix software-related issues can be easily achieved
    by copying its entire partition without all the unnecessary stuff like /proc,
    /sys, /root, /mnt, /media, /cdrom /home directories. If you are trying to replace
    an error affecting a particular user, or to keep the user''s home directory as
    well, you will be able to log in as that user on the cloned system and the same
    profile will be used. Because this method will use a system through using a bootable
    ISO to start the VM during the first step. There are plenty of live systems to
    choose from: SystemRescueCD, Debian Live,


    Of course, this could also be applied to modern distros by means of virtualization.
    If you are not hardware-aware, VirtualBox or whatever software solution you are
    using, you will learn how to use GNU/Linux tools to clone a running GNU/Linux
    box through the network and turn it into a VirtualBox (VM). Finally, a real-world
    example will be at the end of this tutorial.


