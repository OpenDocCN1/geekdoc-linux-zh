  md: '# Data recovery with Knoppix


    # Get a closer look at open source tool Knoppix and how data can be recovered
    with


    Knoppix is a free linux meaning that you can run everything from a bootable CD
    (as opposed to running from an installed system on the hard drive). One of the
    most useful things you can use Knoppix as a rescue disk - if your Linux system
    fails. It is invaluable that you can boot from a Knoppix CD and figure out what''s
    wrong.


    To obtain the latest version of Knoppix, you can download the CD or DVD image
    from one of the available Knoppix mirror sites. The mirror sites provide images
    in ISO formats over http, ftp or rsync. Once the image is downloaded, you may
    be interested in confirming whether the full file has the integrity of the original
    file. This can be done with MDsum. Once installed, you can use MDsum in a Linux
    environment, you will find the mdsum utility has to ensure that the ISO file from
    the mirror is in the same directory as the image. You can generate MDsum using
    the following command


    ![](img/c60316a3f000be7434c59c5f27a4f427_41_0.png)


    ```

    powayamswayam-VirtualBox-$ mdsum KNOPPIX_V5.1.CD-2007-01-28-EN.iso

    ```


    where the parameter to mdsum in the above command is the ISO image that we downloaded
    from the Knoppix mirror site. All you need to do is compare the MDsum you generated
    to the website file match indicates a complete ISO. Once this validation is completed,
    you are good to boot the Knoppix ISO to a CD or DVD.


    In order to recover your data you will need to follow a two-step process: the
    first step is to boot the prompt. With the help of the prompt, you will be able
    to customise the Knoppix startup process. In the second step this requires the
    CD: clear instructions given at the boot prompt can follow the complete process.


