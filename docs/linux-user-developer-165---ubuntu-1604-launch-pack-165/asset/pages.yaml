  md: "# Sound system\n\n# AUTOMATE LOGITECH\nMEDIA SERVER\n\nThere is a Python library\
    \ for Logitech Media Server (https://github.com/pglemansweep/PyLMS) which allows\
    \ you to perform various tasks. Check out the code below to write an application\
    \ that pings your phone and pauses the players over your home network (if you've\
    \ left the house, you can run the application again).\n\n# Full code listing\n\
    \n# Start your script\n\nIt makes the most sense to script your script up on the\
    \ server:\n\n```\n#/usr/bin/env python2\nsudo apt-get install-python\nsudo pip\
    \ install pymms\nmkdir automation\ncd automation\ntouchouch music_suspend.py\n\
    chmod +x music_suspend.py\nAdd code\n```\n\n```\nfrom pymls.server import Server\n\
    from pymls.player import Player\nimport time\nimport os\n\nclass MusicServer:\n\
    \    def __init__(self, phone):\n        self.connected = False\n        while\
    \ not self.connected:\n            try:\n                self.server = Server().connect()\
    \ = True\n            except:\n                pass\n        self.phone_state\
    \ = phone.state\"\n\"\n    def stop(self):\n        print(\"stop\")\n        if\
    \ self.prev_state == \"stopped\":\n            return\n        for p in self.server.get_players():\n\
    \            p.pause()\n        self.prev_state = \"stopped\"\n\n    def play(self):\n\
    \        print(\"play\")\n        if self.prev_state == \"playing\":\n       \
    \     return\n        for p in self.server.get_players():\n            p.play()\n\
    \        self.prev_state = \"playing\"\n\n    def ping(self):\n        return\
    \ os.system(\"ping -c 1 {} > /dev/null\".format(self.phone_ip)) == 0\n\n    def\
    \ loop(self):\n        while True:\n            if self.ping():\n            \
    \    self.play()\n            else:\n                self.stop()\n\nif __name__\
    \ == \"__main__\":\n    ms = MusicServer(\"172.17.173.6\")\n    ms.loop()\n```\n\
    \nFinally, make the script start at:\n\n```\nsudo editor /etc/systemd/system/music_suspend.service\n\
    [Unit]\nDescription=Suspend Service\n[Service]\nType=oneshot\nExecStart=/home/pi/automation/music_suspend.py\n\
    \n[Install]\nWantedBy=multi-user.target\n```\n\nThen enable the service and reboot\
    \ to it:\n\n```\nsudo systemctl daemon-reload\nsudo systemctl enable music_suspend.service\n\
    sudo reboot\n```\n\n# COST OF IMPLEMENTATION\n\nAssuming you already have a Pi\
    \ or two lying around, this is a fairly cheap project - there are plenty of cheap\
    \ speaker amps you can find for £20 or less. Just search “Class D” on Amazon and\
    \ you will get several results. However, as long as you don't enable the volume\
    \ when you are away, your neighbors won't complain about it. On top of that you'll\
    \ need some speakers and an RCA cable to connect the sound card to the AMP.\n\
    The cheap speakers bookshelves will provide the quality that you are looking for.\
    \ Alternatively, you can get even a 2.0 or 2.1 PC system with the amp built in.\
    \ For £25 on the cheap end, which you just need to buy a Pi with network connectivity,\
    \ and a sound card.\n\n> Import required libraries. The first imports are the\
    \ Server and Player classes from PyLMS. Time is used to sleep the loop while it\
    \ waits, and this is used to ping the command.\n\n> Class a class for the application.\
    \ Your phone needs to be statically assigned to copy, otherwise the music will\
    \ wait until you are home - starts when you leave the server. There is also a\
    \ variable to keep the phone state so we don't keep playing or pause when the\
    \ state is the same.\n\n> Ping calls the phone with -c 1 to send only one echo.\
    \ If the output is to /dev/null then the device is online. If ping returns 0 then\
    \ it was successful, hence to the end.\n\n> Loop an instance of the MusicServer\
    \ class with the IP of your phone address. Call the function, which will run indefinitely.\n\
    \nwww.luxuser.com | 67"
