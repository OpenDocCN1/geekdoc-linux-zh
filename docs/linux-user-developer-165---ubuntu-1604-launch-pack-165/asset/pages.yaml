  md: '# Using transitions


    ![](img/c60316a3f000be7434c59c5f27a4f427_40_0.png)


    Left OpenShot 2.0 includes a wide range of transitions to add visual interest
    when cutting from scene to scene


    To use a transition, position your two clips together in the timeline, and then
    drag the transition into place between them. It can either be dropped from the
    source or track a new one. Use the centre of the triangles in the transition box
    as a guide.


    # Title Editor


    ![](img/c60316a3f000be7434c59c5f27a4f427_40_1.png)


    # Add titles and captions


    Whether you want to add a title caption to video, or add captions throughout the
    video, these can be formatted with Title > Title option (optional titles disappear
    if you have Blender installed).


    ![](img/c60316a3f000be7434c59c5f27a4f427_40_2.png)


    # Try some effects!


    In addition to transitions, OpenShot 2.0 features effects, which can be dragged
    into your project timeline to add things like blur or colour saturation.


    Currently there are only seven effects available, so you can expect more to be
    created and added to future releases, or made available as needed.


    Once added to the timeline, effects can be tweaked in the same way as transitions,
    allowing you to adjust the duration and intensity as you see fit.


    # Export your clip


    With your complete video, and plenty of clips made in the video preview, it is
    time to export. Go to File > Export Video, click the Export button on the toolbar
    or press Ctrl + E to open the export dialogue, selecting a Profile for uploading
    to YouTube, Instagram and Target, and things like advanced export options can
    also be adjusted to encode with surround sound. When you''re ready, click Export
    Video.


    # Adjust clip volume


    OpenShot allows volume adjustments that can be used on the audio clip or to move
    audio to a separate track. Drag the clip and select Volume to view the options,
    allowing you to fade in or fade out, or to adjust particular parts of the clip
    (50%, 80%), or even mute the clip (0%). These settings can be applied to the start
    or end of a clip, or the full clip.


