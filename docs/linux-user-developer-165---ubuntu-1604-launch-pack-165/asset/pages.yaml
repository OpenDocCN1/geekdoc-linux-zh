  md: '# Review Running Android apps


    # Archon


    You''ll need the Chrome browser and some knowledge of Developer mode


    # Shashlik


    A light Android clone packed into a Linux desktop application


    ![](img/c60316a3f000be7434c59c5f27a4f427_81_0.png)


    This is how Archon looks in the Extensions list in Google Chrome


    ![](img/c60316a3f000be7434c59c5f27a4f427_81_1.png)


    Press Ctrl+F1 to rotate a Shashlik window and make landscape-oriented apps usable


    # Ease of setup


    Archon is distributed as a standalone Chrome extension. To install it, go to chrome://extensions,
    enable "Developer Mode", press the Load unpacked button and select the directory
    with Archon archive, which you have learned like "varkdroid-archon-e3b832c402a".
    You can now install and run Android applications in Chrome.


    # Ease of setup


    The latest version of Shashlik is 0.9.3, and in the Linux world that would indicate
    the status of a project. The official site offers only a Debian/Ubuntu DEB package
    and another package for Arch Linux. The rest have to compile the code themselves,
    which is not too challenging, but requires some patience.


    # Getting to run


    Some apps are already converted and installed in the Arch compatibility table
    at http://github.com/PW129/UB, but it''s limited. You can convert any yourself
    by downloading the APK from the web site (https://apps.dev/) and installing it
    using the #npm install chromearchos-app --command and convert your app with --archon-app.
    Then you can add it as another Chrome extension and run.


    # Getting to run


    Shashlik doesn''t need you to parse APK files in any way. You just install an
    application with this: /opt/shashlik/bin/shashlik-install_your_app.apk then navigate
    to your desktop application to find the right shortcut. You can also run an application
    from the command line: /opt/shashlik/bin/shashlik-run_your_app.apk.


    # Compatibility


    Don''t expect all to work flawlessly. The runtime benefit between different versions
    of Google Chrome, which is, is constantly evolving. It is not even still, so many
    might misbe. The few working apps are not perfect, but generally many apps that
    don''t run on phone or tablet devices are decently enhanced in Chrome.


    # Compatibility


    After several tests with our favourite Archon apps it becomes clear that Shashlik
    can handle only a number of them. Some games like Flappy Bird Birds work flawlessly,
    while others really don''t run well. We also installed apps that don''t native
    x86 code - something that was not a problem for Archon or Shashlik.


    # Limitations


    Archon will only work together with the Google browser; replacing it with Chrome
    is not an option. More than that, it is limited when Android apps are launched
    - extensence for every other app that don''t include x86 code are also used with
    Archon. Some applications that don''t include removed from the user''s menu.


    # Limitations


    Shashlik is formally designed to work with the KDE plasma desktop, which is why
    it complains about the ''kialog'' command upon installing an app. It also takes
    longer to run any application, since because it is for the first time done (then
    it is done). You cannot resize an app''s window - it is very small by default,
    but you can rotate it using Ctrl+F1 and make landscape-oriented apps usable


    # Overall


    Archon was one of the pioneers to run Android in Linux, and it is proved for that.
    It is not very stable and limited.


    # Overall


    Significantly better of integration with desktop Shashlik, but still very usable
    for everyday use. We need more comprehensive Android supports.'
