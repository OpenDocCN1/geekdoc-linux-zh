  md: '# Tutorial CoreOS


    informs the node to start the unit. When a node fails to heartbeat back to the
    fleet leader, all units running on that machine are marked for rescheduling. The
    leader looks for qualified machines for each unit and starts them on the new machine.


    ```

    [Unit]

    Description=MyApp

    After=docker.service

    Requires=docker.service

    ```


    Create your first unit

    The first step is start using fleet on a cluster to create units. Next step is
    push the units to the fleet. The fleet engine then requests and assigns nodes
    to the units. Finally, the unit is executed and corresponding services are started.
    Let us learn how to run units with fleet.


    ```

    [Service]

    TimeoutStart=60s

    ExecStartPre=/usr/bin/docker kill killbox

    ExecStartPre=/usr/bin/docker run killbox

    ExecStart=/usr/bin/docker run --name mybox /bin/sh "true; echo Hello World; sleep
    1"

    ExecStop=/usr/bin/docker stop mybox

    ```


    ![](img/c60316a3f000be7434c59c5f27a4f427_51_0.png)


    Once you see that command is recognised on the node, and move the unit onto the
    node you just connected, so that, the unit is physically present on the node.
    This is


    ```

    $ fleet start myapp.service

    ```


    # 05 In action


    Now the node has a unit scheduled, lets units on the other fleet use. The process
    remains the same: you use fleet and the fleet command to start it to the fleet
    engine. Just unit name must be unique across the cluster. Once units are running
    on all nodes, the cluster


    ```

    $ fleet list-units

    ```


    This will give you an idea of which unit is running on which node. Now to do the
    automatic reboot, let''s take one node. You can do this by stopping fleet unit
    on one of the nodes in the fleet or by stopping the EC2 instances via cloud console.
    After you''ve taken the node, run the command:


    ```

    $ fleet list-units

    ```


    In the output, you''ll see that after,myapp.service was running on 172.31.21.17,
    but now it''s running on 172.31.21.28, with myapp.service. So what happened here
    is that the unit was removed from the cluster, and the service was restarted on
    the healthy running node, without any manual intervention.


    # 06 Etcd introduction


    Generally, an application on a computer, has access to the file system, so it
    can easily save its configuration information. This becomes tricky when applications
    are scaled and containers are destroyed. So applications can not take the file
    system for granted.


    To make it little easier, let''s use an example with WordPress. If you have ever
    installed WordPress, it creates a config file that it writes to the disk during
    the setup. Then, whenever WordPress runs, it reads info from that file. Imagine
    WordPress running on a distributed set like a CoreOS cluster, where a node failure
    may cause the application to be assigned to another node. How do you ensure consistency
    when assigning the configuration?


    # 06 Running a unit


    We will use the fleet ability to schedule the unit file we just created. To do
    it, login to one of the nodes in our cluster. Using SSH SSH, we''ll connect to
    fleet


    ```

    $ ssh -i /path/to/keyfile key@coreos-2-server-path.compute.amazonaws.com

    ```


    Make sure to change the path to the actual key file and the public hostname of
    your EC2 server. After you''ve connected, check if fleet is installed by running:


    ```

    $ fleet status

    ```


    ![](img/c60316a3f000be7434c59c5f27a4f427_51_1.png)'
