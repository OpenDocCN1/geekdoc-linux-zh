  md: '# OpenShot 2.0


    ![](img/c60316a3f000be7434c59c5f27a4f427_37_0.png)


    Right OpenShot 2.0 was introduced from the start to be a comprehensive package
    for editing videos in Linux


    # Edit videos in Linux with OpenShot 2.0


    # Kickstarter success story OpenShot 2.0 brings polished desktop video editing
    to Linux


    Editing videos is becoming increasingly common on mobile devices, which means
    that desktop tools need to be offer a better collection of features. A few video
    editing tools are available for Linux, they''re an eclectic bunch, struggling
    to offer an all-important combination of features, options and intuitive user
    interfaces.


    OpenShot 2.0, an open source app developed with the help of a Kickstarter campaign,
    aims to bring change, by becoming the tool for Linux. Video editing is more than
    just sticking a few clips together; you need to start by importing the files you
    wish to edit, select a soundtrack (from either source), adjust the volume as appropriate,
    and add in the required fades or wipes. With other enhancements, it''s time to
    export and share with friends. OpenShot handles all this and more.


    Christian Crawley

    I am former IT and software engineer who has provided advice and inspiration to
    computer and video professionals in print, and in print. makeuseof.com.


    > OpenShot 2.0, a Kickstarter success story, aims to become the video editing
    tool for Linux


    # 01 Install OpenShot 2.0


    Available from http://www.openshot.org/download. Your best option for an installation
    is to add the ppa repository and follow the steps in the terminal:


    ```

    sudo apt-add-repository ppa:openshot-developers/ppa

    sudo apt-get update

    sudo apt-get install openshot-qt

    ```


    You can also install it from the Ubuntu Software Centre. OpenShot 2.0 can be launched
    from the applications menu, or from the command line with


    ```

    openshot-qt

    ```


    OpenShot 2.0 will launch into a new project, ready for you to start importing
    clips from your hard disk or digital camera.'
