    # ## GROUP TEST


    # ## Running Android apps


    With the rise of the Android era, the idea of running mobile apps on desktop Linux
    seemed absurd, but just a few years later we have a range of options that can
    do just that. Which is the best one for your needs?


    # ### Archon


    Archon Runtime for Chrome is an Open Source project that enables Linux users to
    run native Android applications with little effort (though still with some routines).
    Technically achievable thanks to the bridge made between Chrome OS and the desktop
    Chrome browser.


    # ### Shashlik


    While Android runs on the desktop version of Chrome, Shashlik is a native fork
    of Chromium, including android-core, android-telephony, android-webview. Shashlik
    lets you run Android apps wherever you create a cmake based build system.


    # ### Chrome Web Store


    Nothing can be more official than the Web Store from Google. Let''s use it in
    its most vanilla form and see if we can benefit from running Android apps through
    the default gateway of see how Google limits its assortment for the desktop web
    browser and how we can deal with.


    # ### Android x86


    The community-driven project to adopt the Open Source Android version to an Android
    Intel- or AMD-based x86 system. It works beautifully not only inside a virtual
    environment but as well. Of course, mouse pointer and keyboards are also fully
    supported.'
