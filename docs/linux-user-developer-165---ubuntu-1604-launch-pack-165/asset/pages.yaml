  md: "# Accurate assumptions\n\nLearn to find all unique pairs of elements in an\
    \ array that sum to a given number S\n\n> This month we will show you how to find\
    \ all unique pairs of elements in an array that sum to a given number S. This\
    \ kind of problem is for sharpening both your mind and programming. Two implementations\
    \ will be presented, one in C and the other in Python (sumtopl). The two variables\
    \ of the process are the size of the array and the value of S as well as the current\
    \ element. Here, elements of the array will be hardcoded if you want to make your\
    \ program really valuable, you should generate the array randomly and the number\
    \ will be given as command line arguments to both C and sumtopl. If the array\
    \ is sorted, the same algorithm becomes much more efficient once the current sum\
    \ is smaller, so you do not have to examine the rest of the array. The C version\
    \ will work on unsorted arrays as well, with the elements it starts finding the\
    \ pairs. Printing unique pairs is tricky, the presented implementation will not\
    \ check for duplicates. Python offers a solution to this, with the use of a hash\
    \ table for testing whether any pair exists. This solution is based on two assumptions:\
    \ that each number is unique and that a number can only appear once or not at\
    \ all. Both assumptions must be met for sumtopl to work correctly. The comparison\
    \ will be necessary in order to make how slow the C implementation can become\
    \ when you have more than elements. For example, with 10,000,000 iterations sumtopl\
    \ might be significantly less because this depends on the value of S and the data\
    \ stored in the array. The main part of the C code is the following:\n\n```\n\
    for (i = 0; i < ARRAYSIZE; i++)\n  for (j = 0; j < ARRAYSIZE; j++)\n    if (i\
    \ == j)\n      continue;\n    int temp = array[i] + array[j];\n    if (temp ==\
    \ S)\n```\n\nThe crucial part of the Python code is the following:\n\n```\nforeach\
    \ $element in ($array\n  if ($element > $S)\n    last;\n    my $sum = $element\
    \ + $second;\n    # This goes first because it excludes\n    # more elements when\
    \ the array is sorted;\n    if ($sum > $S)\n      last;\n    if (defined($PAIRS[$element]))\n\
    \        next;\n    if ($sum == $S)\n      print(\"$element, \\$$second\\n\");\n\
    \      PAIRS[$element] = $second;\n      PAIRS[$second] = $element;\n```\n\nMihalis\
    \ Topukul\nA software engineer, programmer, DBA and mathematician. He lives since\
    \ 1993\n\n> This kind of problem is for sharpening your mind and your programming\
    \ skills\n\nWhen element is used, it is added to the PAIRS hash that you will\
    \ not use it again. However, once the current element is larger than the S variable\
    \ it becomes significantly larger than S, so the inner loop leads to the skipping\
    \ of remaining elements for the inner loop only. Next skips one iteration later\
    \ which makes the program to reach the end much faster. Find the source of this\
    \ article at github.com/mactsouks/www.linuxuser.co.uk |"
