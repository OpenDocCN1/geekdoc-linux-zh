    # # Networked Sensor Display with Pimoroni Scroll pHAT


    # Pair up two Raspberry Pis to create a live networked sensor display


    We are going to create a networked sensor display with the Pimoroni scrollat.
    We''ll take a look at the hardware, what''s included and how to install the required
    Python libraries. Then we''ll look at the library''s source code which has been
    contributed by the open-source community through GitHub. Once we are familiar
    with the library, we will go on to set up our sensor on the first Raspberry Pi
    and connect it to our Pi. We''ll also talk about how to use Redis (an open-source
    pub-sub-noSQL database).


    ## 01 First look at the Scroll pHAT

    The Scroll pHAT is one of number of pHATs (hardware attached on top) which appeared
    around the launch of the Raspberry Pi. Pimoroni''s device costs £10 when ordered
    directly from the website and is also available in kit form, which is excellent
    value considering the price of an empty PCB can be around £5. For your money you
    get eye-catching PCB in a box. The pHAT uses Franklin''s IS1339-FL370 LED matrix
    driver. The LED driver controls the I2C protocol, making it capable of connecting
    to almost any micro-controller such as the Arduino.


    Alex Ellis

    Alex is a Linux & FOSS enthusiast and a professional developer by day. He spends
    his free time setting up sensors, tinkering with robots, writing tutorials and
    contributing to Github.


    Redis is connective tissue, publishing events that our Zero will subscribe to
    and impressing for the Scroll pHAT. This seems on even lower level with sockets.
    Don''t worry if you do not have a Scroll pHAT – we''ve thought of that and provided
    a version of the code that displays text on your SSH terminal instead.


    ![](img/c60316a3f000be7434c59c5f27a4f427_71_0.png)


    +   What you''ll need

    * Article''s Github repository (http://github.com/alexellis/rpi-display)

    * Two Raspberry Pis

    * Pimoroni scrollphat (optional)

    * Soldering iron and solder'
