  md: '# Tutorial Create a virtual machine


    # Fixing kernel-related issues


    This technique can also be helpful when dealing with other kernel issues, as long
    as they concern them e.g. the recent CVE-2016-5195 vulnerability.


    from the directories already mentioned a few lines later, make sure you explicitly
    exclude wherever directory you don''t want to copy by adding another --exclude
    wherever to rsync command:


    ```

    # cd /mnt

    # rsync -avz remote_host:/ --exclude

    --exclude=/media

    --exclude=/proc --exclude=/home --exclude=/sys

    --exclude=/cdrom

    ```


    The -z flag allows rsync to compress during the file transfer. This will reduce
    the network stress. Finally, and because you have excluded sys, proc, and home,
    you will need to create them if they are needed later on:


    ```

    # mkdir /mnt/proc /mnt/sys /mnt/dev

    ```


    # Fix the boot loader


    The last step involves fixing the cloned system boot-loader. Because the virtual
    disk image does not have GRUB installed on it, you can skip this step. Linux distros
    use the GRUB or GRUB2 boot-loaders. Older distros could still be using LILO. This
    tutorial assumes that GRUB is the one on your computer. Before fixing, you will
    bind the proc and sys directories from the VM into the mnt mount-point.


    ```

    # chmod /mnt

    ```


    The GRUB loader already has its main configuration files properly set up inside
    the cloned system (otherwise, if you have copied the splash partition inside the
    cloned /grub/ directory, but you will need to re-install it in the virtual disk
    image''s MBR). Otherwise, the cloned system would not be able to boot up on its.


    ```

    # grub-install --check /dev/sda

    ```


    Before rebooting the VM to let the cloned system boot, you will need to check
    the file i.e. dev/sda to make some changes. You now have one partition, i.e. dev/sda,
    loaded the entire root system. So whatever partition the actual computer has,
    you have to comment out that single entry in the file to free the root mounting
    system. This system is referencing this by your uuid, so you can change the device
    name according to the new block device: dev/sdadb.


    ```

    # blkid /dev/sda

    /dev/sda:UUID=99e4e6b8-5f6a-4b69-bd0c-681734:TYPE="ext4"

    ```


    If this is the case, you need to adjust the GRUB configuration file as well, otherwise
    its entry will be pointing to an incorrect uuid. GRUB includes a tool to do this:


    ```

    # mount -t none /dev/proc /mnt/proc -o bind

    # mount -t none /dev/sys /mnt/sys -o bind

    # mount -t none /dev/dev /mnt/dev -o bind

    ```


    ```

    # update-grub

    ```


    Now you can change the root directory so that you will be running commands from
    inside the cloned system:


    ```

