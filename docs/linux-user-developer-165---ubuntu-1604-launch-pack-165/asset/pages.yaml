  md: "# Tutorial\n\n# Flash SD cards\n\nWe're going to use Raspberry Pi for this.\
    \ We used the Raspberry Jessie Lite version because it is smaller and only comes\
    \ with a minimal set of software. However, it doesn't really matter if you use\
    \ the full version, or even NOOBS installed. You'll need an SD card for each Pi\
    \ that you are using. In our case, this will be one for server and client.\n\n\
    If you reboot and remove the ethernet cable, the Pi should connect over Wi-Fi.\n\
    \n# Sound card setup\n\nIf you are using a USB sound card then you want to have\
    \ prefer the built-in sound card (which is always loaded as card0):\n\n# Power\
    \ on your Pi\n\nIt's a good idea to power on each Pi one at a time so you know\
    \ which one is which. Log into your router / dhcp to find the address of your\
    \ Pi, or you might have to SSH into it using the name 'raspberry'. Alternatively\
    \ you can use nmap or 'arp -a - grep' to find every Pi on the network.\n\n```\n\
    ctl1.default {\n  hwcard = 1\n}\n```\n\nThen use alsamixer to set the volume to\
    \ 100% because we use it as a line out device.\n\n# Logging in\n\nFor each Pi,\
    \ log in using ssh pi@172.17.13.57 or pi@172.17.13.58, replacing the IP with the\
    \ address of your Pi. Use the password 'raspberry'. Then set the hostname to a\
    \ name (such as linux, musician): echo 'musician|server'\n\nThen use sudo ras-config\
    \ to expand the filesystem, then select and reboot. After this, hopefully you'll\
    \ be able to log into the Pi using the name you just set. At the least you only\
    \ are logged in to.\n\n# Install squashelite on client\n\nOnce you have set up\
    \ Wi-Fi and Sound cards on the clients (and server if it is also acting as a client),\
    \ it's time to install squashelite.\n\n```\napt-get update\napt-get upgrade\n\
    apt-get install squashelite\n```\n\nThat's all it takes to set up a client. The\
    \ client will start and everything is controlled by the server, so it's time to\
    \ set it.\n\n# Wi-Fi setup\n\nIf you are using a Wi-Fi adapter connect it up to\
    \ the Pi and edit /etc/wpa_supplicant/wpa_supplicant.conf with sudo, and your\
    \ editor of choice - for example: sudo nano /etc/wpa_supplicant/wpa_supplicant.conf\
    \ - then add the network:\n\n```\nnetwork={\n  ssid=\"MYSSID\"\n  psk=\"password\"\
    \n}\n```\n\n# Preparing music storage\n\nWe are going to store our music in /mnt/music\
    \ on the media server. If you want to use a USB hard drive or flash drive for\
    \ additional space you'll need to format it and then mount it in your directory:\n\
    \nBelow a Raspberry Pi Running Squashelite service for your homebrew media server\
    \ that can play music and radio stations\n\n![](img/c60316a3f000be7434c59c5f27a4f427_63_0.png)"
