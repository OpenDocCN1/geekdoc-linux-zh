    ## Review Running Android apps


    ## In brief: compare and contrast our verdicts


    | | Archon | Shashlik | Chrome Web Store | Android x86 |

    |---|---|---|---|---|

    | Ease of setup | Learn how to debian custom extensions in Chrome | Piece of cake
    for Debian/Ubuntu and Arch users | Incredibly easy to set up, even for beginners
    | Nothing heavy, but still a bit unusual |

    | Getting apps to run | Converting an APK to Chrome is simply boring | Just download
    the APK and it works right away | Search for an app, review and click the blue
    button | Surf the Play Store as you would with a real handheld |

    | Compatibility | Too many lists just to start | A little better than Arch but
    troublesome | Google cares about the stability and compatibility of goods in the
    store | Far from ideal, seems like we''re asking for a lot |

    | Limitations | You are forced to use | Too few builds for other Linux distros
    | Most of them are not Android apps | You are limited by anything you run |

    | Overall | Capable and promising, but too rough the edges | Definitely decent
    but distributed badly, at least right now | Plenty of offer apps, but it''s just
    really about Android | Play with Android apps freely without having to use physical
    device |


    ## AND THE WINNER IS...


    ## Android x86


    The experiments that we conducted for Google''s group test revealed a mess under
    the hood. Different applications use different languages and frameworks, some
    apps on Android are compiled purely in Java/Kotlin bytecode, and others are compiled
    as native C++. There are both Intel- and ARM-based devices in the market, and
    Google does best to support both architectures, applying code translators and
    optimising apps when needed.


    ![](img/c60316a3f000be7434c59c5f27a4f427_83_0.png)


    In a perfect Android emulator is clearly impossible right now. Archon uses an
    interesting approach of bringing the Android runtime into a better extension,
    which can be glued to Google Chrome to enable various apps with our Chrome OS.
    However, Android developers can''t catch up to what Google does and many apps
    will just fail to start. Needless to say, you will have to first obtain APK files
    of your apps and then convert them into Chrome Package to install them on.


    > Android x86 with your favourite applications and enjoy their robust performance!


    While the work-performance of Shashlik offers comfortable delivery of Android
    apps to your desktop (with KDE Plasma), the last turn proved to be not the best
    maturity. Running a whole Android x86 port in an enjoyable environment or on a
    separate drive hard proves itself a viable option. In return, you get the best
    in class Android app compatibility and enjoy the Play Store as if you are running
    a native device. The Android x86 developer has recently joined with the Remix
    OS project, so we can look forward to an even better desktop version of Android
    OS for notebooks and laptops in the near future.


    Alexander Tolstoy


