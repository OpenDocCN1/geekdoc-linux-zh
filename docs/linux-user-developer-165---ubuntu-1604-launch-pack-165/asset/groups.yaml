    \n```bash\ngo run main.go\nGive me number: 12\nEnter your Name: Rahul\nNumber\
    \ is: 12\nYour name is: Rahul\nThe variable type is int string\n```\n\nThe print\
    \ function is analogue to Println which adds a new line. The Scan function gets\
    \ user input. Go uses %s to print strings, %d integers and %f to print only the\
    \ decimal part of a floating point number. You will learn how to handle file copying\
    \ in Go, the method that we use to enter the input files and copy it once to the\
    \ output file. The following code, in cp.go, shows the handling approach of Go:\n\
