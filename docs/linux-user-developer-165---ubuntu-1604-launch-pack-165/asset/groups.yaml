    ## 回测 Android 应用程序


    ## 简述：对我们的结论进行比较与分析


    | | Archon | Shashlik | Chrome 应用商店 | Android x86 |

    |---|---|---|---|---|

    | 安装难易程度 | 学习如何在 Chrome 中为 debian 自定义扩展 | 对于 Debian/Ubuntu 和 Arch 用户来说是轻而易举 |
    设置极其简单，即使是初学者也是如此 | 不沉重，但仍然有些反常 |

    | 运行应用 | 将 APK 转换为 Chrome 简直无聊 | 只需下载 APK 即可运行 | 搜索应用、查看并点击蓝色按钮 | 像使用真实手持设备一样浏览
    Play 商店 |

    | 兼容性 | 仅仅为了开始就有太多的列表 | 比 Arch 好一点点，但很麻烦 | Google 关注商店内产品的稳定性和兼容性 | 远非理想，看来我们的要求过高了
    |

    | 局限性 | 你被强制使用 | 针对其他 Linux 发行版的构建版本太少 | 大多数不是 Android 软件 | 你运行的任何程序都受到限制 |

    | 总体 | 功能强大且有前景，但细节处理太粗糙 | 绝对不错但分发很糟糕，至少现在是这样 | 提供了很多应用，但它真的关于 Android | 无需使用物理设备即可自由畅玩
    Android 应用 |


    ## 获胜者是……


    ## Android x86


    我们为 Google 的小组测试进行的实验揭示了其内部的一团糟。不同的应用程序使用不同的语言和框架，Android 上的某些应用纯粹用 Java/Kotlin
    字节码编译，而另一些则编译为原生 C++。市场上既有基于 Intel 也有基于 ARM 的设备，Google 尽力支持这两种架构，在需要时应用代码翻译器并优化应用。


    ![](img/c60316a3f000be7434c59c5f27a4f427_83_0.png)


    在目前，一个完美的 Android 模拟器显然是不可能的。Archon 采用了一种有趣的方法，将 Android 运行时引入一个更好的扩展中，该扩展可以与
    Google Chrome 结合，以通过我们的 Chrome OS 启用各种应用。然而，Android 开发者无法跟上 Google 的步伐，许多应用将无法启动。无需多说，你必须先获取应用的
    APK 文件，然后将它们转换为 Chrome 包进行安装。


    > 使用你喜爱的应用程序运行 Android x86，享受其强强大的性能！


    虽然 Shashlik 的工作性能为 Android 应用到你的桌面（带有 KDE Plasma）提供了舒适的交付，但最后一轮证明了其成熟度并非最佳。在愉快的环境或单独驱动器上运行整个
    Android x86 移植版证明是一个可行的方案。作为回报，你将获得同类最佳的 Android 应用兼容性，并像运行原生设备一样享受 Play 商店。Android
    x86 开发者最近加入了 Remix OS 项目，因此我们可以期待在不久的未来为笔记本和电脑带来更好的 Android 桌面版本。


    Alexander Tolstoy


