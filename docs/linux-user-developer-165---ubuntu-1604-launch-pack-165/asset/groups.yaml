    # 针对网页设计师的开源软件 (FOSS)


    ## 1 GIMP


    在进行网页设计时，图像处理至关重要，因此一个像 GIMP 这样强大的程序是必不可少的。这些不断变化的套件揭示了摄影提供的许多功能，但对于第一次尝试此类程序的实验来说，仍然不够完美。


    ## 2 FileZilla


    在 FTP 软件方面，没有东西在处理图像时能与 FileZilla 相比。涉及到两个下载：一个是客户端，另一个是服务器。它们组成了一支强大的团队，可以在几分钟内让你的内容上线。


    ## 3 Kompozer


    能够即时编辑是 Kompozer 脱颖而出的主要原因。虽然它对于简单的网页编辑非常棒，但对于涉及少量文件管理和实用的网页制作系统的任务也非常完美。


    ## 4 Notepad+


    如果你觉得 Kompozer 对你来说太高级了，那么 Notepad+ 就不那么复杂。它不仅是能够处理各种类型文件的免费文本编辑器之一，还极大地扩展了其功能集。


    ## 5 Inkscape


    矢量图形很难得，尤其是免费的。虽然它没有 Adobe Illustrator 强大，但 Inkscape 是那些需要免费替代方案的人的最佳选择。它对新手友好，无需学习高级功能。


    # Torvalds 在 Linux 未来中的主地位


    ## 将 Linux 引入桌面的计划


    过去的 12 个月里，Linux 内核取得了巨大进步。从移动设备、桌面和平板的重大发展来看，现在是 Linux 用户最好的时机。在改进桌面体验方面，内核也处于领先地位，将其与现有领先产品的这种感觉联系在一起。但
    Linux 在新兴技术领域仍在取得进展。Linux 正在追赶桌面世界的“巨头们”。虽然某些发行版已明显取代了 Windows 或极简的 OS X，但几乎没有哪个真正兴起。


    进入这个领域，我仍在努力。已经过去 25 年了。我们还能再做 25 年吗？我会告诉他们。随着我们的设备向更加融合的软件发展，开发桌面的前景变成了一个完全不同的问题。Ubuntu
    在桌面方面的失败尝试是市场走向的一个清晰范例，但也许观众还没有准备好接受我们所需要的改变。我们谈论 Linux 向向不同的方向飞起，从各个领域整合资源。尽管如此，Linux
    仍然保持韧性，因为人们知道他们想让桌面计划走向哪里，这实际上让 Linux 成了一个相当平衡的系统，因为我们正朝着那个方向发展，无论对错。我们只是分散开来尝试了方方面。


