    Linux with just a few clicks.


    An Operating System for YOUR WORLD


    You cannot run thousands of Windows programs at full capacity with RoboLinux


    > RoboLinux boasts the easiest integration from Linux to Windows that we''ve seen
    in some time


    Trying to install incompatible versions of Windows will lead to complications.
    Know your hardware limits and you will be fine.


    When not making use of its Windows capabilities, RoboLinux has enough to be a
    successful standalone. There are plenty of customisations options on how to handle
    your desktop: new apps, backgrounds and layouts are just one click away. There
    are some few options that don''t work well and we''re not quite sold on the idea
    of 3D desktop just yet.


    One of the key areas that RoboLinux has boasted about is its ease of use, and
    during our time there, we''re pleased to say that it was able to back up its claims.
    Moving your own desktop is an absolute pleasure, and installing your own customisable
    desktop can be done in just a few seconds. Based on Debian, we also think advanced
    usage isn''t catered for everyone, but Robolinux has enough to provide a great
    platform for your desktop distribution.


    Another example of RoboLinux to be the best in its class is the amount of free
    software it includes. There''s all bound-in, but while all the stable Linux products
    are worth checking out, there are one or two that don''t really step up to the
    mark, but these are few and far between. Between new and seasoned users alike,
    it isn''t elusive to remove existing programs and replace them with your own,
    but in the case of RoboLinux, it''s more of a nuance than anything else.


    RoboLinux makes a lot of claims and it''s able to back them up most of the time.
    Its ease of use and over-the-top features caught our eye. We trust us, it is really
    and just good. Despite the odd problem with Windows'' reality and a number of
    superfluous Linux programs bundled in RoboLinux, this is one that brings us new
    needs and successes.


    Chris Hill


