  mdcn: '


    ## 复古效果

    创建了自定义曲率着色器，以在 Pixel Vision 上模拟 CRT 风格的效果。对于游戏玩家来说，这就是许多人使用 NES 和 SNES 主机成长过程中的那种经典复古游戏体验。


    ## 快捷键功能

    Pixel Vision 的特色之处在于其功能性。只需按下按钮，用户就可以重置游戏，并在那些不支持此功能的游戏中保存进度。保存的游戏存储在树莓派的板载内存中。


    ![](img/c60316a3f000be7434c59c5f27a4f427_67_0.png)


    ## 耳朵妙听

    市上有许多可以在树莓派上运行的模拟器，但内置蓝牙是其中最好的选择之一。它可以无缝地复制大多数 8 位和 16 位游戏标题，而没有任何问题。


    ## 轻松仿真

    对于一个如此小的设备，Pixel Vision 得益于 DAC+ 能够发出巨大的音效。它对于展现单声轨道中的高音和低音是一个极佳的享受，而且没有任何明显的失真。


    ![](img/c60316a3f000be7434c59c5f27a4f427_67_1.png)


    - 组件列表

    - 树莓派 A+ 开发板

    - DAC+ 音频芯片

    - 3.5 英 LCD 显示器

    - LiPo 2000 mAh 电池

    - LED 指示灯

    - 胡桃木外壳


    每个单元都用厚胡桃木制成，因此设备提供了优质的手感和工艺，同时让长时间握持也非常舒适。

    以下，Pixel 涵盖了大多数经典主机，以及许多基于以前 8 位作品的新新游戏。


    ## Pixel Vision

    Love Horn 的复古风格手持游戏系统将 CRT 技术带入了 21 世纪。


    ![](img/c60316a3f000be7434c59c5f27a4f427_68_0.png)


    ## 是什么启发了你创造所做的工作？告诉我们你的流程。


    根据我的经验，现代技术与传统工艺创造了功能与美学的平衡。在过去的几年里，我发现制作独特的控制台允许不同的形状和尺寸。


    我也个人向街机黄金时代致以敬意，在那里，伟大的游戏是在局限性和完全控制的大幅画面中创造出来的；那种自由感与今天不同。


    在我的设计中，我大量使用了历史规范和标准，并引入了新的对象、新的价值。在我的工作中，我经常参考我的工作对客户产生的影响；我想，我想让我的观众感受到一种怀旧感。


    你在这个项目上花了多久时间？什么时候投入生产的？Pixel Vision 在 2013 年作为一个名为 Pixel Vision 的小型个人项目开始的。


    我在 2015 年制作了原始原型 PE358 原型，在网络上，人们催促我进行量产。反馈非常慷慨，我决定在 7 月开始设计 PE358，并在 2016 年 10
    月以新名称确定了最终设计。


    我一直想尝试 Kickstarter，它看起来是一个很好的候选项目。于是我启动了项目，活动成功结束，获得了大约 150 个 Pixel Vision 订单。我是一个完美主义者，我讨厌处理所有阶段（从构思到完成）可能会让我个人感到压力。


    Pixel Vision PCB 是由我和我的程序员朋友设计的，而设计的胡桃木外壳是由我在工作坊制作的。通过 Kickstarter 活动，我们都实现了一个宏大的愿景。


    ## 在这个项目中，你使用树莓派多久了？


    我使用树莓派已经一段时间了。它非常方便。我喜欢很多功能，而且我需要较小的尺寸，它是该项目的最佳选择。


    我打算使用小型开发板 A-6 模型。在我 11 月的 Kickstarter 活动期间，即使是小号的，树莓派也是这个项目的选择，但我有一个截止日期，第一批货被砍掉了。我毫无疑问地用光了它们。树莓派是……


    ## 我大量使用了历史规范和标准，并引入了新的功能和新价值。


    ## 你认为 RetroKick 是最好的模拟器之一吗？还是树莓派自带的？


    RetroKick 是我目前为止在树莓派上使用的唯一模拟器。它完成了任务，而且完成得很好。我没有意见。树莓派还有其他替代方案，但尽管如此，如果我想尝试用树莓派构建自己的控制台，我需要做一些研究并看看有哪些选项。


    大多数客户（使用 CRT 的用户）发现其要求很高，将过滤器应用到树莓派上的效果并不好。它需要一些硬件来处理过滤器。大多数游戏运行良好，或者根本不运行。我非常喜欢与编程人员合作，他们想要创建一个出色的自定义过滤器，并让那些经典机器上的旧
    CRT 效果“活过来”。


    ## 你能告诉我们如何在 Pixel Vision 上创建旧 CRT 显示器效果的吗？


    Love Horn 的手持游戏机、树莓派和令人惊叹的美学成就了令人惊叹的作品。


    ## 喜欢吗？


    这种使用树莓派作为电脑的控制台外观，比以往任何时候都多了。


    你可以在我的网站上找到所有细节和供应信息：www.linuxux.com


    ## 延伸阅读

    在树莓派上进行仿真比你想象的要简单。对于感兴趣的人，请阅读 RetroArch 等重量型工具，它是一个糟糕的游戏体验，请确保检查下载的每款游戏以避免问题。


    ## 你认为可以在更大的项目中重现吗？


    我的项目是从树莓派和 PiKernel 开始的，就像她经历的变化一样。是的，是的。


    ## 接下来是什么？你还有其他令人兴奋的树莓派项目吗？


    我从未自己做过树莓派项目，并期待与 Zbone 架构合作。但我不能告诉你任何关于未来项目的信息，否则那会破坏所有乐趣！


    '
