    Image editing hits an all-time high with the latest release


    Krita is one of the few image-editing programs that offer tools that will appeal
    advanced and seasoned designers out. Many of its current use-tool features are
    better than Linux''s real alternatives. Krita has launched its most recent update
    that people have really started to notice. Krita 3.0 has launched a new set of
    features, many of which are


    ![](img/c60316a3f000be7434c59c5f27a4f427_8_0.png)


    Above Import from GIMP to expand your suite of tools completely seamlessly, with
    only a couple fixing the bugs found in version 2.9.


    A palette of tools has been implemented for those looking to create hand-drawn
    primitives in most delicate sections of the drawing. For more complex pieces of
    work, a new layer panel has been introduced, making it easier to manage and have
    the ability to select and move multiple layers at once. Enhancements have been
    made to Krita''s range of grids and rulers, making improvements enabling on-the-spot
    controls. The eagle-eyed


    among you notice the revamped grids UI tool as well, that''s easier to distinguish
    from similarly-styled tools.

