    ## Feature Ubuntu 16.04


    Anand Krishnan explains how network function visualisation and cloud computing
    are revolutionising the way that services can enter your home.


    "Let me tell you what what''s going on," begins Krishnan, EVP & M for Canonical''s
    Cloud. ''Cloud has been around as a buzzword for quite some time now, and a reality
    - people are building things together or apart. The notion of things becoming
    software-defined, as opposed to a piece of software that is static, has gradually
    taken hold. Put those things together and you get an explosion of possibilities
    that were previously thought of as static, making them increasingly software-defined,
    and using the principles that people have learned from the cloud to build life,
    architecture-wise and so on. So, an example of what life would look like: Netflix,
    the poster child for how you run a big service that, historically, would have
    been massive amounts of machines and possibly dedicated hardware. Now it''s all
    VMs running on Amazon, and possibly a couple of other clouds by now – that''s
    a good example of ''cloud native'' – a company that is DevOps-first.


    ''Comparison makes no sense without a full spectrum – to take the same approach
    when they look into what''s going on in software-defined; we take the world of
    network functions; everything that a telco has to do in order to make your phone
    work; every time your phone rings there is a whole set of services that transmit
    data – a whole set of infrastructure that is in place, country by internet connections,
    cables, digital TV. A lot of that can now be decoupled and you can have it software-defined;
    you can essentially deliver the service as software running on commodity hardware.
    The telco calls this Network Function Virtualisation (NFV); it''s basically taking
    network functions and making them software-defined.


    In practise, the reason it is possible now and wasn''t so years ago, what you''re
    actually doing is building a cloud, running on anything you want - your cellphone
    service, another will deliver VPN service - and you''re duplicating those in all
    the countries. You can even send them down to the edge, to the user''s home, by
    virtue of it, a set-top box – that you would usually think of as static device
    updates once every year, maybe can now be something that is truly running applications.


    People are taking problems that were historically solved by software running on
    large machines, or by some black box thing, and bringing them to life. That is
    where we are – there are two parts to make reality: building the cloud and running
    the cloud. Cloud itself is tricky, but a lot of the attention has historically
    focused on what it builds. Amazon runs cloud around the world – and we solved
    this problem over years ago. You go from running a big database on one machine
    to hundreds of servers across multiple countries. Amazon doesn''t send any consultants
    into the data centre to deliver all of stuff – it just happens automatically.
    You''ve built a whole bunch of tooling in order to make that happen


    ## Ubuntu on certified public clouds


    The most popular operating system across public clouds.


    - Canonical guarantees the consistency, security and performance of Ubuntu on
    all our certified public clouds.

    - Enterprise-grade commercial support is available.

    - Twice as popular as the Amazon cloud as all other operating systems combined.


    ## Cloud Convergence


    60% of the operating systems providing services on public clouds are Ubuntu –
    we think maybe even higher, with 70%. Here''s a selection of some of the companies
    who are using Ubuntu Server and OpenStack to power their clouds:


    - Netflix

    - Uber

    - Instagram

    - Dropbox

    - Deutsche Telekom

    - Time Warner Cable

    - Sky

    - LexisNexis

    - Yahoo Japan

    - Best Buy

    - NEC

    - NTT

    - Cisco

    - Samsung

    - eBay

    - AT&T

    - Walmart


    ## Canonical’s cloud-side


    “So there are two ways to say it,” says Krishna, “One is building the cloud, which
    is where Ubuntu serves in. We really focus on how we get production on demand
    that stands, is stable, will scale, and will provide that scalability you need
    for some of the scenarios we''re talking about. The harder and the more practical
    problem is what you do when your cloud is up, how you scale the process to run
    ten months or more when you''re running five hundred, or thousands, or thousands
    of that nodes. So we play on both sides of this deal: Ubuntu serves as the baseline
    for everything, but we use OpenStack with Ubuntu, essentially allowing people
    to do more with less.


    Server is like us different scripts, or free versions of it. That doesn''t scale
    to a world of cloud - it doesn''t scale to thousands of nodes. Our approach is
    different—we automate operations and encapsulate that intelligence into a model,
    and the model does a lot of things that a human would otherwise do. So we use
    OpenStack as an example—we can do that on OpenStack workload (which is the process
    it runs on), or our own custom projects for things to be built on top of it, and
    they will want those bundles—it might be big, as an example—as we want to build
    a public cloud. Allowing both of those to happen without having to reinvent the
    public cloud project every time is done through a project we call Juju, and that''s
    at the heart of cloud-driven projects.


    The last piece of the puzzle, when you stand the cloud, how do you do your operations
    and what is that cloud defined? Most of the world does what we would broadly call
    script—they write scripts to do things. When you do something else, you update
    your script. When you want to do five things that are variants of the same thing,
    you want to


    Many of my readers would be, “using Ubuntu today—downloading 16.04 and asking
    yourself, what are you running in a VM that you should be running in a container?
    You''re getting production-grade containers built into an operating system, which
    just hasn''t happened before.”


    ## Microsoft and Canonical


    We asked Krishna to explain a little more about the partnership between Canonical
    and Microsoft in terms of their respective cloud offerings, OpenStack and Azure,
    as well as the ‘hybrid’ cloud that consists of these and other platforms. Microsoft’s
    goal is to make Azure and OpenStack mirrors of each other in the long run,” Krishna
    says. “Ideally, the Azure API in the public cloud looks just like the OpenStack
    API in clouds, and it gives us the ability to come from one or the other side
    of the thing; that is the play is. Today, 70 percent of all the scale-out on any
    public cloud that Ubuntu Server is already; so the vast majority of Linux running
    on Azure is today. The same is true for Amazon, the same is for Google, etc. So
    this partnership is in terms of making it easier to make Azure Stack as a natural
    extension. The flock that Canonical is looking for find Ubuntu Azure Stack, so
    that''s really what is geared in terms of the work with them, and our goal is
    to make that a really seamless experience across both environments.


