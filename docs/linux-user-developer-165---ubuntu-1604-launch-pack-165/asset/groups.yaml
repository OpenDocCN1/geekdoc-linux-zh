- md: "\n# OpenSource\n\nYour source of Linux news & views\n\n## DISTRO FEED\n\n##\
    \ Top 10\n(Average hits per day, 19 February – 16 March)\n\n- 1. Linux Mint\n\
    2. Debian\n3. Ubuntu\n4. openSUSE\n5. Manjaro\n6. Fedora\n7. PopLinux\n8. Zorin\n\
    9. CentOS\n10. Arch\n\n## This month\n\n- Stable releases (17)\n- In development\
    \ (8)\n\nManjaro enters for the first time absence, but Mint holds the number\
    \ one choice for Linux enthusiasts.\n\n# GAMING\n\n## Steam controller improvements\
    \ land in latest client update\n\nAn invaluable piece of gaming kit\n\nA new release\
    \ of the Steam client is now available for users across desktop and mobile. What\
    \ most Linux users fear is that the integration on their desktops should not be\
    \ a thing of the past with the new changes. Key bindings have been remapped, allowing\
    \ users to create their 'action sets' and mode shifts when both in and out of\
    \ game. The current build of steam has also been added with the introduction of\
    \ a screenshot function and a secondary binding to an on-screen keyboard. The\
    \ lack of shift buttons makes it difficult for players, but the implementation\
    \ of A/B/X/Y to fill the gap will be pleasing, it's a feature that we need some\
    \ work in the future.\n\nBasic functions for the controller in Big Picture Mode\
    \ have been finely tuned to cater for those that were a cause of anxiety in the\
    \ previous updates, a new pop-up menu while BPM will indicate which certain key\
    \ bindings have been made.\n\nIf the changes to your Steam client are not yet\
    \ on your desktop, use the 'Check for Steam Updates' option to essentially force\
    \ the update. Both Mac and Windows users can expect the update to be readily available\
    \ now, but Linux users are likely to receive the updates they intend.\n\n# Highlights\n\
    \n## openSUSE\n\nopenSUSE is providing an easy environment for all development\
    \ and packaging processes it has easily climbed the top 10 rankings. It's another\
    \ distribution that backs up in claim of building, easy to use.\n\n## Arch\n\n\
    Arch is being highly tailored for seasoned Linux users. Arch undergoes a mini\
    \ release of time, helping out its skin and remaining as a robust distro.\n\n\
    ## Manjaro\n\nManjaro remains one of the most popular features of Manjaro. In\
    \ the automatic hardware detection why it remains popular with the Linux community.\n\
    \n## Latest distros available:\n\nfiles.os.com\n\n# SERVER\n\n## Microsoft's Visual\
    \ Studio now available for Linux\n\nMake improvements to systems and servers with\
    \ C++\n\nMicrosoft has finally released an update for its popular devel, Visual\
    \ Studio, which enables users to now write C++ code for Linux and servers. There\
    \ is some catch as its current state extension will only work on remote servers\
    \ on Linux.\n\nAll of open-source, gdb and gdbserver will need to be installed\
    \ prior to use, but although there are no limits on the distribution it can be\
    \ used on. For different audiences and requirements, the extension comes with\
    \ three templates: Console Application, Link for header and Empty. All different\
    \ forms will enjoy freedom of code development, with Empty being the preferred\
    \ choice for these stages.\n\nMicrosoft has a Linux-releasing build of late, with\
    \ SQL Server being up and for Linux users most and plans are to be in near future,\
    \ although it is not currently known that the restrictions placed on the Visual\
    \ Studio extension will be lifted at some point.\n\n# Accurate assumptions\n\n\
    Learn to find all unique pairs of elements in an array that sum to a given number\
    \ S\n\n> This month we will show you how to find all unique pairs of elements\
    \ in an array that sum to a given number S. This kind of problem is for sharpening\
    \ both your mind and programming. Two implementations will be presented, one in\
    \ C and the other in Python (sumtopl). The two variables of the process are the\
    \ size of the array and the value of S as well as the current element. Here, elements\
    \ of the array will be hardcoded if you want to make your program really valuable,\
    \ you should generate the array randomly and the number will be given as command\
    \ line arguments to both C and sumtopl. If the array is sorted, the same algorithm\
    \ becomes much more efficient once the current sum is smaller, so you do not have\
    \ to examine the rest of the array. The C version will work on unsorted arrays\
    \ as well, with the elements it starts finding the pairs. Printing unique pairs\
    \ is tricky, the presented implementation will not check for duplicates. Python\
    \ offers a solution to this, with the use of a hash table for testing whether\
    \ any pair exists. This solution is based on two assumptions: that each number\
    \ is unique and that a number can only appear once or not at all. Both assumptions\
    \ must be met for sumtopl to work correctly. The comparison will be necessary\
    \ in order to make how slow the C implementation can become when you have more\
    \ than elements. For example, with 10,000,000 iterations sumtopl might be significantly\
    \ less because this depends on the value of S and the data stored in the array.\
    \ The main part of the C code is the following:\n\n```\nfor (i = 0; i < ARRAYSIZE;\
    \ i++)\n  for (j = 0; j < ARRAYSIZE; j++)\n    if (i == j)\n      continue;\n\
    \    int temp = array[i] + array[j];\n    if (temp == S)\n```\n\nThe crucial part\
    \ of the Python code is the following:\n\n```perl\nforeach $element in ($array\n\
    \  if ($element > $S)\n    last;\n    my $sum = $element + $second;\n    # This\
    \ goes first because it excludes\n    # more elements when the array is sorted;\n\
    \    if ($sum > $S)\n      last;\n    if (defined($PAIRS[$element]))\n       \
    \ next;\n    if ($sum == $S)\n      print(\"$element, \\$$second\\n\");\n    \
    \  PAIRS[$element] = $second;\n      PAIRS[$second] = $element;\n```\n\nMihalis\
    \ Topukul\nA software engineer, programmer, DBA and mathematician. He lives since\
    \ 1993\n\n> This kind of problem is for sharpening your mind and your programming\
    \ skills\n\nWhen element is used, it is added to the PAIRS hash that you will\
    \ not use it again. However, once the current element is larger than the S variable\
    \ it becomes significantly larger than S, so the inner loop leads to the skipping\
    \ of remaining elements for the inner loop only. Next skips one iteration later\
    \ which makes the program to reach the end much faster. Find the source of this\
    \ article at github.com/mactsouks/www.linuxuser.co.uk |\n\n# OpenSource\n\nYour\
    \ source of Linux news & views\n\n# INTERVIEW MIKE DOLAN\n\n## The Zephyr Project\
    \ revealed\n\nThe Zephyr Project is a new take on IoT development for resource-constrained\
    \ devices, but will it be revolutionary? The Linux Foundation's Mike Dolan tells\
    \ us all\n\n![](img/c60316a3f000be7434c59c5f27a4f427_11_0.png)\n\nMike Dolan\n\
    Mike Dolan is the VP Strategic Programs at the Linux Foundation. He's been the\
    \ driving force behind developing the project into a scalable RTOS for users to\
    \ enjoy.\n\n![](img/c60316a3f000be7434c59c5f27a4f427_11_1.png)\n\n> Could you\
    \ give us a general overview of what the Zephyr Project is?\nThe Zephyr Project\
    \ is an open source effort to build a secure, real-time operating system (RTOS)\
    \ for the Internet of Things (IoT). This is for devices smaller than the smallest\
    \ Linux; the target resource size for example is in the range of 8kb-256kb of\
    \ memory. For ours, there's a vast amount of devices with these sort of memory\
    \ constraints, it's imperative that we catered for their needs with the Zephyr\
    \ Project it hasn't been addressed before and we've hoped with what we've managed\
    \ to actually achieve from it.\n\nhope that the progress we've made will here\
    \ spur on other manufacturers to work in tandem with us to create a better-connected\
    \ future for the IoT. IoT devices must also provide a level of security assurance\
    \ for users. And while Linux has become the facto standard as an embedded operating\
    \ system, we are providing a complementary RTOS that addresses the variety of\
    \ small memory footprints, which hadn't really been catered for previously.\n\n\
    ## Does it differ massively from the others that we use to develop for the iot?\n\
    \nThe project however has not yet addressed specifically for iot - a small, real-time\
    \ operating system that can be secured for resource-constrained multiple architectures.\
    \ While other options do exist from what we've created, there are from nearly\
    \ all of them that impact on like their ability, how scalable they are and general\
    \ availability. Companies need to have the assurance the Zephyr provides, security\
    \ as\n\n## What were the key motivations for launching this sort of operating\
    \ system?\n\nTo realize the true potential of iot, devices in the ecosystem must\
    \ be highly scalable and seamlessly connect with one another, regardless of manufacturer\
    \ or brand origins. It's surprising, the lack of cohesion that's currently around\
    \ between manufacturers, so ours was our aim to make some changes at its foundation,\
    \ and from there, we\n"
  mdcn: "\n\n# 开源\n\n您的 Linux 新闻与观点来源\n\n## 发行版动态\n\n## 1 10\n(每日平均访问量，2月19日 – 3月16日)\n\
    \n- 1. Linux Mint\n2. Debian\n3. Ubuntu\n4. openSUSE\n5. Manjaro\n6. Fedora\n\
    7. PopLinux\n8. Zorin\n9. CentOS\n10. Arch\n\n## 本月\n\n- 稳定发布版 (17个)\n- 开发中 (8个)\n\
    \nManjaro 首次缺席前十名，但 Mint 仍然是 Linux 爱好者的首选。\n\n# 游戏\n\n## Steam 控制器改进在最新客户端更新中推出\n\
    \n一个无价的游戏游戏设备\n\nSteam 客户端的新版本现已面向桌面和移动用户发布。大多数 Linux 用户担心的是，随着这些新变化，他们在桌面上的集成不应成为过去式。按键绑定已重新映射，允许用户在进入和退出游戏时都能创建自己的“动作集”和模式切换。当前的\
    \ steam 版本还引入了截图功能以及到屏幕键盘的次级绑定。缺少 Shift 键让玩家感到不便，但通过 A/B/X/Y 来填补这一空白将令人欣喜，这是我们未来还需要进一步改进的功能。\n\
    \n大图模式下控制器的基本功能经过精调，以满足那些在之前的更新中感到焦虑的用户，在大图模式下新的弹出菜单将显示已进行了哪些特定的按键绑定。\n\n如果您的\
    \ Steam 客户端更改尚未出现在桌面上，请使用“检查 Steam 更新”选项强制进行更新。Mac 和 Windows 用户可以预计更新现在已可用，但 Linux\
    \ 用户可能无法收到他们预想的更新。\n\n# 亮点\n\n## openSUSE\n\nopenSUSE 为所有开发和打包过程提供了一个简易的环境，它已轻松进入前十名排名。它是另一个支持“构建、易用”理念的发行版。\n\
    \n## Arch\n\nArch 正在为资深 Linux 用户量身定制。Arch 定期进行小版本发布，有助于其外壳并保持作为一个健壮的发行版。\n\n##\
    \ Manjaro\n\nManjaro 仍然是 Manjaro 最受欢迎的功能之一。在自动硬件检测方面，它是它在 Linux 社区保持受欢迎的原因。\n\n\
    ## 可用的最新发行版：\n\nfiles.os.com\n\n# 服务器\n\n## Microsoft Visual Studio 现已适用于 Linux\n\
    \n使用 C++ 改进系统和服务器\n\n微软终于发布了其流行的开发工具 Visual Studio 的更新，使用户现在可以为 Linux 和服务器编写 C++\
    \ 代码。但有一个陷阱，其目前的扩展状态将仅在 Linux 远程服务器上运行。\n\n使用前需要安装所有开源的、gdb 和 gdbserver，尽管对它可以使用的发行版没有限制。针对不同的受众和需求，该扩展程序带有三个模板：控制台应用程序、头文件链接和空项目。所有形式都将享受代码开发的自由，其中空项目是这些阶段的首选方案。\n\
    \n微软晚些发布了 Linux 版本的构建，SQL Server 已经对大多数 Linux 用户可用，并计划在不久后推出，尽管目前尚不知道 Visual Studio\
    \ 扩展所设置的限制是否会在会被取消。\n\n# 精确的假设\n\n学习在数组中找到所有和等于给定数字 S 的唯一元素对\n\n> 本月，我们将向你展示如何在一个数组中找到所有和等于给定数字\
    \ S 的唯一元素对。这类问题有助于磨炼你的头脑和编程能力。将展示两种实现方式，一种用 C 语言，另一种用 Python (sumtopl)。过程中的两个变量是数组的大小、S\
    \ 的值以及当前元素。在这里，如果你想让你的程序真正有价值，数组元素将被硬编码，你应该随机生成数组并将数字作为命令行参数传递给 C 和 sumtopl。如果数组是排序过的，一旦当前和较小，相同的算法将变得高效得多，因此你不需要检查数组的其余部分。C\
    \ 版本也适用于未排序的数组，它从开始的元素开始寻找对。打印唯一对是棘手的，所给出的实现不会检查重复项。Python 提供了一个解决方案，使用哈希表来测试是否存在任何对。该解决方案基于两个假设：每个数字都是唯一的，且一个数字只能出现一次或不出现。sumtopl\
    \ 必须满足这两个假设才能正常工作。为了比较当你有超过元素时 C 的实现会变得多慢，这种比较是必要的。例如，在 1,000 万次迭代中，sumtopl 可能会少得多，因为这取决于\
    \ S 的值和存储在数组中的数据。C 代码部分如下：\n\n```\nfor (i = 0; i < ARRAYSIZE; i++)\n  for (j =\
    \ 0; j < ARRAYSIZE; j++)\n    if (i == j)\n      continue;\n    int temp = array[i]\
    \ + array[j];\n    if (temp == S)\n```\n\nPython 代码的关键部分如下：\n\n```perl\nforeach\
    \ $element in ($array\n  if ($element > $S)\n    last;\n    my $sum = $element\
    \ + $second;\n    # 这个先执行，因为它在数组排序时\n    # 排除了更多元素；\n    if ($sum > $S)\n    \
    \  last;\n    if (defined($PAIRS[$element]))\n        next;\n    if ($sum == $S)\n\
    \      print(\"$element, \\$$second\\n\");\n      PAIRS[$element] = $second;\n\
    ```\n\nMihalis Top\n一位软件工程师、程序员和数学家。他自1993年以来一直\n\n"
