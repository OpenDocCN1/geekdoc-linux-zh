    # 观点自由软件


    # 桌面决策


    “我对 Linux 桌面非常满意……我为了自己的需求启动了这个项目，而我的需求得到了充分满足” – Linux Torvalds


    > 在 4 月的 Linux 嵌入式会议与 Dirk Hoffheld 讨论时，Linux Torvalds 提到：“桌面并没有通过 Linux 公司真正接管世界，在我使用的
    X11 桌面看起来比我构象的要好得多。漂亮不是我的首要任务，实际上我不认为我对比某些 UI 设计师不礼貌，我只是想完成我的工作。我对 Linux 桌面非常满意，我为了自己的需求启动了这个项目，而我的需求得到了充分满足。对我来说，这并不是我愿景的失败；我希望
    Linux 也能承担这项工作，但它只是为了进入一个很小的领域。”


    与 UNIX 一样，GNU 取代了数据中心和服务器，是极客、开发者和专业人员的流行工作站，但从未真正接管日常桌面。随着时间的推移，GNU 实际上被分配到此类商业媒体、游戏、导入或软件使用不确定性之类的应用中。


    软件桌面也得益于它的各种优点。发行版之间的差异预计将保持用户隔离开。使用良好的图形界面帮助了如今兼容性不足的问题。某些桌面上的应用程序在另一个桌面上运行得并不那么顺畅，尤其是早期和发布的版本；提供了快速的创新和变化，但导致了用户之间的疏离。


    从头开始编写操作系统的每一个方面。结果是，自由软件桌面继承了 UNIX 分散的桌面特征，继承了 X11 的问题（正如《Unix 恨者手册》中获得的动力反映的那样），但你可以在
    Windows 的驾驶舱中切换档位，因为角落后面隐藏了至少五个东西，其中没有一个遵循神圣的原则——


    当 Linux 出现时，自由软件开发的动力发生了变化。动力被重新找回，有一种紧迫感。这起到了作用，桌面演变成了一系列解决让图形良好运行问题的快速且独立的解决方案，直到
    GNOME 和 KOME 出现，创建应用程序的工具包才变得对初学者之外的所有人都足够一致且用户友好。


    最近，随着 X，GNOME 的 Wayland 框架的发展让 Linux 桌面看到了更清晰的未来。与此同时，云正在形成，但传统问题已无关紧要。用户都面临着数字通信的复杂性和特殊性。对于日常极客来说，多样性不再是许多用户的阻碍，只要桌面能够做到它们所说的事情。随着
    OEM 寻找让产品更具特色的方法，希望 Linux 桌面的无尽变体可能仍有属于它们的阳光。


    > 当其出现时，自由软件开发的动力发生了变化。Linux 发行版带来了它们自己的愿景和紧迫感


    Richard Hillsmith

