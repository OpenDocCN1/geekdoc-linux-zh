    Welcome to the latest issue of Linux User & Developer,

    The UK and America''s favourite Linux and open source

    magazine. The latest of any OS is an exciting time, and here we show the scenes
    with Canonical to discover what''s still in the latest

    long-term support of Ubuntu - check it out on p18.

    But knowing what''s going on in Ubuntu is no fun unless you

    get to play with it, that''s exactly what we''ve included in this

    issue''s features. We also include the bit-

