    ## 物联网


    Ubuntu Core 正在手机领域并进入智能家居，为令人兴奋的新一代 IoT 设备浪潮注入活力。


    “认为这是我们将看到很多牵力的地方，”Silber 说道，你应该密切关注 Ubuntu Core 及其后续领域——数字标牌，这是一个非常适合 Ubuntu
    Core 的市场。我们将在 16.04 版本中发布 Ubuntu Core 的 GA（正式发布）版本——它不仅会在 4 月之后准备就绪——而且我们将有一种处理多种车辆的方法。我们提到过无人机和网关——我想我们将在数字标牌中看到它们，这是一个非常适合
    Ubuntu Core 的市场。我们预计在未来六个月内看到这一进展。我们还将看到有关手机和主要运营商的一些公告，包括一些新功能。在市场营销策略上，我们将采取非常具体的策略，与零售商合作——B2B
    以及直接向消费者销售，而不是通过运营商。我认为在未来六个月内，我们将开始看到更多对我们手机和个人计算的投入。


    “Ubuntu Core 是那些跨越从数据中心顶架交换机到消费级专业级机器人和无人机的组件之一。关于它的采用速度有多快，它在特定的垂直领域是非常快速且可靠的。在设备世界，当人们谈论
    IoT 时，想的是机器人和无人机——Ubuntu Core 已经被 ROS（机器人操作系统）框架采用，许多针对自动车辆的基础设施工作都是在 Ubuntu Core
    上进行的；我认为那里有许多有趣的创新，这种创新是由 Ubuntu 平台驱动的，同时也开启了生态系统。”


    Ubuntu Core 策略的一个关键部分是软件定义化的，即一种让你拥有软件定义网络和虚拟化功能的方式。我们在网络设备上看到了很多吸引力——包括家庭网络和工业
    IoT 网关，并且在生态系统方面，通过与 ARM 等芯片制造者的关系，制造特定 IoT 设备芯片的人们希望使用 Ubuntu 来构建它们，现在正在发生很多激动的事情。”


    > Ubuntu Core 策略将使 IoT 设备实现良好的定义


    ## 物联网的 Ubuntu


    Ubuntu Core 也称为 Snappy，是 Ubuntu 的精简版本，旨在安全地运行在机器和其他连接的设备上。总的来说，从那些设备到无人机，我们预计它将改变我们生活的许多方面，但它们需要一个与
    PC 不同的操作系统。


    ## Ubuntu 16.04 特性


    ![](img/c60316a3f000be7434c59c5f27a4f427_23_0.png)


    ## Ubuntu：融合


    什么是融合？它为什么对用户很重要？Canonical 的首席执行官解释道**


    融合是 Ubuntu 16.04 的一项特性——它描述了跨越服务器、设备和平台的 Ubuntu 融合。现在，在桌面、手机和平板电脑上运行相同的代码，这种统一的代码库使得软件可以在所有这些设备上运行，而无需进行响应式设计。响应式设计本身是一个非常有趣且具有挑战性的话题。在用户层面，响应式设计涉及到
    shell 如何重流和缩放。但存在一条演进路径——我们将做的更多，它是非常重要的一部分，特别是在融合的愿景中，我们使不同的应用程序成为可能。在笔记本电脑、桌面和平板电脑上运行相同的代码，最新的
    Ubuntu 16.04。


    “这是一个非常好的问题，”Jane 开始说道，“仅仅是响应式设计吗？这会把‘仅仅’这个词去掉，因为我想我们可以根据设备的可用性来创建不同的应用程序，这也是融合的一个元素。目前并不是这样，但由于内核的工作正在成熟，融合真的不仅仅是手机体验，是以一种交互的方式让
    Ubuntu 处于所有移动端。正如我们六个月一次的更新周期，我们可以根据需要接收它们。”


    Canonical 在融合及其策略方面有清晰的愿景，但与人们合作实现这种愿景有多困难？我们问 Jane 在社区方面，融合愿景面临了哪些挑战。“大体来说，我们对融合感到兴奋，”她说，“我们完全接受了这一愿景，特别是对于那些真正需要开发可以在各种尺寸和格式设备上开箱即用应用的开发者来说，能够目标这种设备对开发社区是一个真正的推动，这种方式是新颖且令人兴奋的。挑战在于我们并不是从空白页开始，我们拥有数百万的基础。”


    > 不仅仅是响应式设计，统一的 Ubuntu 跨内核级别运行


    “所以，融合计划方面存在各种挑战，但我认为社区的兴奋是让我们如此兴奋的原因之一。当你发布一个愿景和一个产品，其他人也对此感到兴奋时，这种感觉是有回报的，它会产生一种循环效应反馈给
    Canonical 和我们的开发团队。”


    ## 桌面平板


    为你的 Ubuntu 平板添加蓝牙鼠标和键盘，使用 USB On Go 连接有线键盘和鼠标，Ubuntu 将智能地适应你的外设。应用程序在窗口中平滑运行，你可以拖动它们，而右键下会出现上下文菜单选项，快捷键也会进入


    ## 借用屏幕


    通过 HDMI 端口连接任何外部设备，或者如果你的 Ubuntu 手机具有该功能，Ubuntu 桌面界面将显示在屏幕上。只需将手机连接到这些设备，即可作为带有显示器和外设的工作站使用。


    ## 更大场景


    有了 HDMI 端口，你可以将 Ubuntu 平板或手机连接到电视。电视突然变成了媒体中心，因为你可以将存储在 microSD 中的视频加载到 Kodi 并在大屏上播放。这意味着项目——Ubuntu
    融合功能开启的可能性是非常惊人的。


    ## 平板上的多任务处理


    拔掉外设，平板电脑将平滑地过渡回其默认用户界面，应用程序变为全屏模式，多触手势接管你的交互。你也可以并排使用应用程序，这对于之间的复制粘贴等操作很有帮助——而且触摸过渡有时具有挑战性。例如，在
    16.04 中，我们决定采用基于 MiX 的，而 Ubuntu 是我们想要运行该过渡的系统，因为它是一个 LTS（长期支持版本），而且我们在一个稍有争议的论点中胜出了。然而，当你拥有庞大的用户群时，会有一些考虑因素。


    '
