    是适合所有人的更好播放器。它主要的优势是支持棘手的解码器。你不需要下载额外的解码器包，播放器可以运行任何内容。虽然发行版中也有不同的版本，但 Debian、Arch
    Linux 等版本通常会进行更新。


    VLC 完全免费的这一事实意味着你至少应该下载并尝试一下。这取决于你的喜好和口味，但也可以尝试一下 Miro；它的功能没有 VLC 那么丰富，但同样简单易用。


    此外，如果我还没有说服你去看看，VLC 背后有一个非常活跃的社区。用户开发了一系列扩展，来帮助添加新功能。


    通过各种用户构建的扩展自定义你的 VLC 体验


    ![](img/c60316a3f000be7434c59c5f27a4f427_94_1.png)


    # 关于低音


    树莓派的音频输出不够强大，无法独立驱动扬声器输出音频


    大家好，我需要一些建议。在折腾树莓派方面，我还是个新手，但在一些小型项目上遇到了一些麻烦。


    也许我漏掉了什么非常简单的东西，非常感谢你们能帮助这个项目运行起来。请保持良好


    现在我该如何将我的 B+ 连接到那个音频扬声器（作为流媒体音频的新源）？我尝试过通过 3.5mm 音频接口连接，但没有效果。我运行 OpenLC 作为树莓派的媒体中心，并使用
    VLC 进行播放。


    探索树莓派的新世界总是很棒的，首先，将树莓派连接到外部扬声器很容易，但比想象的要复杂一点。


    首先，音频输出对于所有扬声器来说都不太理想，特别是如果它们已经内置了功能。你需要购买一个带电源的扬声器，或者可能一个 USB 声卡。


    问题的根源可能是你没有告诉树莓派音频应该去向哪里。由于你是树莓派的新手，规定此点的最简单方法是通过 `raspi-config`。从命令行提示符输入：


    - sudo raspi-config


    然后从列表中选择“Advanced options”（高级选项）和“Audio”（音频）输出。现在你将选择 3.5mm 选项，将输出切换到 OpenLC。我们需要让树莓派的音频输出与
    OpenLC 匹配，因此在 OpenLC 内的 Settings 菜单中选择选择音频的区域。从此菜单中，你将选择 Analog（模拟）选项。只要你的扬声器通过
    3.5mm 接口连接到树莓派并运行 OpenLC，你应该就能享受不错的音质了。


