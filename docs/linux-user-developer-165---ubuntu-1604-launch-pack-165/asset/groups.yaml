    page of pipe(2), you will also find a diagram showing how the pipe(2) takes an
    array of two elements as input; the array returns two file descriptors where the


    descriptor with index [1] is for writing and index [0] is for reading data. What
    a pipe really does connect these two file descriptors. If the pipe(2) call is
    successful, it returns 0 otherwise it returns -1. The open(2) system call makes
    your file descriptor accessible to another process asynchronously. However, between
