    Meizu MXVA Ubuntu Edition. At last, with computing quite special - the BQ Aquaris
    M10 Ubuntu Edition, Canonical has brought the new Meizu MX5 smartphone to market.
    Down at the Blue Fin building, however, we got to play with something quite special
    transform it into a powerful, multipurpose computer.


    It''s a solid device, well-built and lovely to use - you can find the full specs
    in the phone (p22) and the convergence features (p24) that transform it into a
    powerful, multipurpose computer with many advantages. In terms of device build
    and quality, the M10 is neither revolutionary nor high-end - but it is not going
    for that end of the market. At £210-240, the tablet is in competition with Apple
    and Android tablets,


    also offering the ability to seamlessly change the way you''re using the screen
