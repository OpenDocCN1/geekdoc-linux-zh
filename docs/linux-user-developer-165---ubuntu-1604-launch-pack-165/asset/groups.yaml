  - '[PAGE 52]


    # Applications are moving to containers and containers are running on clusters.
    Applications can no longer take the file system for granted


    etcd solves this. Using etcd as a file system where applications can store operational
    data like database details, cache settings, application specific data etc, without
    bothering neither node online or a container running. You can read or write data
    inside etcd using CURL or other HTTP libraries from any node in the cluster.


    ![](img/c60316a3f000be7434c59c5f27a4f427_52_0.png)


    # Etcd in action


    To use etcd, you use the etcd command


    ![](img/c60316a3f000be7434c59c5f27a4f427_52_1.png)


    utility or curl. We have used the etcd utility for demo purposes here. Note that
    if you use curl to use etcd you will get a json response. This can be helpful
    in handling things programmatically.


    To start using etcd, log into one of the nodes on your cluster and then run the
    command


    ```

    $ etcd set /mykey "Hello world"

    ```


    This set the value "Hello" to the key "myKey". You can now retrieve the value
    from the cluster. To check, login to another node and issue the command:


    ```

    $ etcd get /mykey

    ```


    You''ll see above return the value "Hello". But this is not all; etcd has several
    other features too. For example, you can create a directory to manage namespaces.


    ```

    $ etcd mkdir /my/application

    ```


    Views the values of a directory using


    ```

    $ etcd ls /my/application

    ```


    Somtimes you might want to watch a key and trigger an action whenever it changes.
    To watch a directory, run:


    ```

    $ etcd watch recursive /my/application

    ```


    Now, whenever the value of any key changes in directory, you''ll see it on your
    command prompt.


    # More etcd commands


    etcd is a centralised system with all the keys and values accessible uniformly,
    it can be used to coordination services. If you want to run a check after a deployment
    been successfully use the set and test functionality. You can provide the previous
    value along with new value. The previous value matches the current value of operation.
    Here is how you can implement it:


    ```

    $ etcd set /message "Hi" --swap-with-value "Hello"

    ```


    etcd also sets you the time ''live'' (TTL) for keys. Once the TTL expires, it
    is deleted and you''ll get an error code 100 (key not found) if you don''t find
    it. To set a set of 20 keys for your,


    ```

    $ etcd set /value1 " --ttl 20

    ```


    ```

    $ etcd set /message "Hi" --swap-with-value "Hello"

    ```'
