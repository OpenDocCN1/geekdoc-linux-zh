    - LibreOffice 5.1


    ## 16.04 有什么新？


    发现你的新的长期支持版（LTS）Ubuntu 版本中包含什么。根据定义，LTS 版本旨在提供稳定的改进，且尽可能减少变化。16.04 也不例外，这就是为什么发布说明中提到的“大”更新和增量更新是基于此的——查看“包更新”以进行快速查看。尽管如此，在特定情况下还有许多其他改进——更不用融合特性本身，这些在第
    24-25 页中有介绍。


    Unity 8 已经关注了一段时间，终于轮到它了；作为默认窗口管理器使用。由于这是一个 LTS 版本，Canonical 决定不将此版本作为默认显示服务器。采用基于
    Wayland 显示服务器的 Unity 7 作为默认，同时将 Unity 8 作为用户的选项并在登录屏幕上可用。Mir 看起来似乎非常稳定，我们鼓励你在升级到新发行版后尝试一下它。


    Unity 和合成器管理器也经过了一些精化。启动器已经过改进，现在现在与文件管理器集成，以获得更好的整体体验。仪表板有了滚动条，并且现在对页眉和边框等设计元素有了更好的支持。应用程序切换器现在可以通过按下
    `Super+Ctrl+W` 激活。此外，此版本在 GNOME 游戏、HiDPI 支持方面得到了改进，此启动器中的图标现在将显示应用程序状态。


    ## Ubuntu 变体（Flavours）


