    Now how am I to connect my B+ to that audio speaker (own as a new source for streaming
    audio)? I''ve tried hooking up via 3.5mm audio jack but to no avail. Im running
    OpenLC as a media centre for the Pi using fool for playback.


    It''s always great to explore new the world of Raspberry Pi, so first off, it''s
    easy to connect your Pi to an external speaker, but it''s a bit more complex than
    thought.


    First and foremost, the audio output isn''t great for all speakers, especially
    if they have built in capabilities already. You''ll need to invest in a powered
    speaker, or maybe a USB sound card.


    The main source of the problem is likely that you haven''t told the Pi where the
    audio should go. As you re new to the Pi, the easiest way to dictate this is through
    raspi-config. From the commanded prompt, enter:


    +   sudo raspi-config


    Then from the list, select ''Advanced options'' and the ''Audio'' output. Now
    you''ll select the 3.5mm option, before turning the output over to Open. We need
    to match the audio output of the Pi to OpenLC, so select the Settings menu within
    OpenLC the menu area where you''d like to select the audio. From this menu, you''re
    going to select the Analog option. As long as your speaker is connected to the
    Pi it is 3.5mm jack and OpenLC, you should be able to enjoy some decent tones
    in.


