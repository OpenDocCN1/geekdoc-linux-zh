    ## 修复后台回写 (Writeback)


    长期 Linux 用户和开发者都会知道这个故事：当你将 (一个) USB 闪存插入端口并开始拷贝大 (GB) 文件时。迟早系统会由于意料之外的原因开始变慢。也许
    Chrome 后台视频开始跳帧，在你察觉之前，你的桌面任务就因为后台回写而失败了。


    这个问题是后台回写（writeback），它是内核的一个功能，旨在提高性能，但有时会引起意外的副作用。例如（应用程序写入一个文件，该文件通常不会立即写入任何种类的物理文件系统），更改发生在第一批页面存储到内核缓存时，稍后写入次级存储介质（例如示例磁盘过程之间）


    之所以这样做的原因是 Linux 尝试优化 IO 吞吐量。在具有数 GB物理内存的系统中，并非所有内存都会被所有应用程序使用。用于其他应用程序的内存是系统考虑的，用于缓冲在
    RAM 访问（或写入）更快的过程上的数据。


