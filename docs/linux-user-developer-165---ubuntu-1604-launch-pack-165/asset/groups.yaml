    - Kubuntu

    - Ubuntu GNOME 自有的 Ubuntu Kylin

    - Ubuntu MATE

    - Ubuntu Studio

    - Ubuntu Desktop

    - Ubuntu LXDE

    - Ubuntu Unity

    - Ubuntu Multimedia


    # Ubuntu Server 和 OpenStack


    将容器的力量与易用性结合。然而，16.04 不仅仅关于桌面版，Canonical 的执行官 Mark 解释了为什么 Ubuntu Server 对全球企业来说是一个令人兴奋的版本：“所以当你有一台机器，它与容器（应用程序容器）不同时，你可以像运行虚拟机一样运行它；例如如果你想添加监控代理，你可以连接到一个进程，但在容器内部你可以把它当成虚拟机。”Mark
    说，“我们已经拥有它有一段时间了，但这项技术体现在 16.04 中。LXD 本质上允许你创建容器，它们仍然将为你提供容器级的性能。LXD 也可以像以前一样管理容器，这样当你在裸机上运行或需要节点时，30-40%
    的工作负载消失了。通过获得 LXD 带来的封装、安全性和易管理性，所以对我们来说，LXD 是大的一步——我们不仅宣布了 LXD 的优势，还允许它进入 OpenStack，因此云现在不仅可以提供虚拟机，还可以提供
    LXD 机器。”


    我们这里的另一件大事是 ZFS。它经常被谈起——我们已经喜欢 ZFS 很多了——它一直是 Solaris 的杀手锏，但在那时，ZFS 并不是 16.04 的一部分。Ubuntu
    使用所有人——Netflix、Airbnb、Spotify，如果他们选择使用，现在都可以使用 Ubuntu 的这一易用功能。我有两件大事要特别指出。另一件大事是按照相同的频率更新，并且很容易在同一天进行更新。当
    16.04 成为 Ubuntu 的 LTS，即长期支持版本时。对于所有与我们交流的刚刚开始的客户，这现在带来了一个他们可以获得的版本，并将获得我们支持的长期支持。


    # 移动设备：智能手机和平板电脑


    我们上手体验了 Canonical 的最新设备。去年发布了 BQ Aquaris E4 和 E HD 型号，随后是魅族 MX5 Ubuntu 版。最后，由于
    BQ Aquaris M10，Canonical 将魅族 MX5 推向了市场。


