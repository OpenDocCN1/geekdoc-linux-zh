    # Create a dialogue between processes with pipes, FIFOs, and shared memory


    IPC allows processes to talk to each other. The history of IPC on UNIX started
    with pipes, which is the oldest method of IPC, and now we use the internet, which
    is another form of IPC. Pipes and the internet, shared memory, and UNIX domain
    sockets, which are all going to be covered in this tutorial.


    # Introduction to IPC


    The most popular technique used in UNIX systems is the pipe, which exists since
    the early versions of UNIX. As a simple example, the following command uses a
    pipe to feed the output of one command to another:


    ```

    ls | grep

    ```


    each command (two here), and the standard output of the first process (ls) is
    linked to the standard input of the second process (grep), and then the output
    of the second command would have been the input to the third command and so on,
    until the last command.


    There exist two system calls that can help you implement a pipe: create a pipe.
