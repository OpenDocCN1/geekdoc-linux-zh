    # Installation woes


    Dear LUARDO,

    I recently performed a complete wipe of my computer and needed to re-install Ubuntu
    14.04 LTS from scratch. Normally this would take a few minutes but what it took
    several hours. Initially it was down to a dip in memory, but getting my normal
    high performance back can''t be the case.


    Now installation of a package, no matter if it''s the Ubuntu library or through
    sudo apt-get install, takes far too long to complete. I have been getting more
    and aggravated with the issue, but hopefully you have a solution that can solve
    it?


    Laura West


    Hi Laura, You did the right thing making sure that your internet isn''t the root
    of your problems. If you''re making strong downloads everywhere else, the problem
    would be your mirror. You''ve selected an Ubuntu repository that is offering sub-par
    performance. What you''ll want to do is select where you download from.


    In this theory, you should pass your downloads through a faster server based on
    your location. It doesn''t necessarily mean it''ll be the closest server to you,
    but the one with the lowest recorded ping time. If frequent downloads or package
    installs help you, the process should take less time than before.


    +   1. From Ubuntu Software tab, your desktop, choose ''Other'' from the ''Download''
    drop-down menu.

    2. Now choose the ''Select Best Server'' option to the right of it. Once located,
    press ''OK''.n3. Authenticate the changes with your password.


