    Knoppix，老牌的经典：安息 Linux（又一个）。请确保你选择的架构与实际计算机相同：32 位或 64 位。


    以下是你在将此方法正确应用到你网络上的 GNU/Linux 机器时，所需的清单：


    - VirtualBox

    - 一张可启动的系统光盘（Live-Booting Disco）

    - 通过安全方式访问 GNU/Linux 机器权限


    ## 创建虚拟机并设置硬盘


    在用 VirtualBox 创建虚拟机之前，你将需要知道实际计算机要使用的硬盘总空间、分区方案以及 home 目录将位于何处。对于共享分区，你可以这样轻松地定义总空间：


    | # df -h | Filesystem | Size | Used | Available | Mounted |

    |---|---|---|---|---|---|

    | / | 32G | 16G | 50% | | |


    当然地，如果情况并非如此，你可以使用 `du` 和 `grep` 命令对你所有想要复制的目录进行统计总和。下一条命令将排除目录作为 `grep` 的匹配模式：


    ```bash

    $ du -sh --max-depth=1

    /home/sys/root/proc/media/root[cdrom]/*

    15 G

    ```


    现在你可以运行 VirtualBox 并创建一个新的虚拟机（VirtualMachine），在类型下拉列表中选择 Linux 和 Linux 2.6/3.x/4
    (64-bit)。如果你想使用 32 位的，请选择 Linux 2.6/3.x/4 (32-bit)。按照下一个屏幕上的指令操作，在那个界面可以指定内存大小。


    随意填入你认为足够的数值，特别是当你有多个硬盘时。


    在这里，你需要确保新的虚拟磁盘有足够的空间来容纳克隆的系统分区。最后，按下按钮，虚拟机即可可用。一旦启动，你需要输入登录详情，并进入“设置：光驱驱动器 >
    选择虚拟磁盘文件”，然后选择你之前下载的 ISO 镜像。虚拟机和实时系统将启动。


    过了一会儿，你将看到一个提示。因此，在你的虚拟机的命令行中，你的磁盘必须进行分区和格式化。


    ```bash

    $ fdisk /dev/sda -A EDF

    > ;

    ```


    这将使用所有可用磁盘空间创建一个分区。


    现在你必须为此分区创建启动标志：


    ```bash

    $ fsdev /dev/sda -a

    ```


    最后，格式化它。你可以选择与实际计算机相同的文件系统，尽管这并非严格必要；这里的主要目标是确保克隆的系统能够挂载此分区。因此，让我们将其格式化为 ext4。


    ```bash

    $ mkfs.ext4 /dev/sda1

    ```


    如果实际计算机通过磁盘标签（label）引用分区，你可以在此实例执行相同的操作。如果是这样，分区已标记，请使用 root：


    我们的意图是通过复制出现错误的实际计算机来解决问题。但我们并不需要克隆整个计算机；有必要只克隆分区，甚至是分区方案。我们可以通过一个包含所有元素的简单根分区来实现。尽管如此，你应该记住，这样做会导致虚拟机的性能下降。


    ## 使用 rsync 克隆分区


    你将通过安全外壳（secure shell）连接使用 `rsync` 克隆分区。首先要做的的任务是设置虚拟网络接口。通常情况下，NA 会自动生成。由于 VirtualBox
    使用 DHCP 服务器，你可以通过输入以下命令设置虚拟机虚拟网络：


    ```bash

    $ dhclient eth0

    ```


    在 GNU Linux 系统下，过程可以在启动时自动解析（如果系统是 Systemd）。一旦虚拟机访问网络，重新挂载已格式化的分区：


    ```bash

    $ mount -t /dev/sda /mnt

    ```


    现在，通过 `rsync` 命令，你将在实际分区复制到虚拟机的 `/mnt` 目录下。除了 `util-linux` 版本外，当你使用较新版本的 `util-linux`
    虚拟机时，如果最后退出，`mount` 命令将报告关于分区标签的错误。确保 `util-linux` 使用的是克隆后的其中之一，运行 `mkdir -v mount
    -v`。


    ## 创建虚拟机


    这种技术在处理其他内核问题时也很有帮助，只要它们涉及内核，例如几行后提到的最近 CVE-2016-5195 漏洞，确保通过向 `rsync` 命令添加 `--exclude`
    来显式排除你不想复制的目录：


    ```bash

    # cd /mnt

    # rsync -avz remote_host:/ --exclude=/media --exclude=/home --exclude=/sys --exclude=/cdrom

    ```


    `-z` 标志允许 `rsync` 在文件传输期间进行压缩。这将减少网络压力。最后，由于你排除了 sys 和 home，如果以后需要，你将需要创建它们：


    ```bash

    # mkdir /mnt/proc /mnt/sys /mnt/dev

    ```


    ## 修复引导加载程序


    最后一步涉及修复克隆系统的引导加载程序。由于虚拟磁盘镜像没有安装 GRUB，Linux 发行版使用 GRUB2。旧的发行版可能仍在使用 LILO。本教程假设你的计算机上是
    GRUB。在修复之前，你把虚拟机的 `proc` 和 `sys` 目录绑定到挂载点。


    ```bash

    # chmod /mnt

    ```


    GRUB 加载器已经在克隆系统内部正确设置了其配置文件（否则，如果你将启动分区复制到了克隆的 `/grub/` 目录内部，你将需要在虚拟磁盘中重新安装它）。


    现在你可以更改根目录，以便在克隆系统内部运行命令：


    ```bash

    # grub-reconfig -o /boot/grub.cfg

    ```


    在部署之前，使用你的虚拟机评估你的补丁的有效性


    ## 一旦克隆系统的补丁工作正常，你就可以部署到实际计算机上


    到目前为止，是时候退出并重启虚拟机了。别忘记从虚拟机中移除虚拟光盘，或者在伪 BIOS POST 屏幕按 F12 选择硬盘作为正确的启动设备：


    - # reboot


    过了一会儿，你会看到——虚拟机启动了，就像实际 GNU/Linux 计算机一样！


    ## 补丁：旧系统上的 CVE-2015-0235


    让我们来看真实的场景。GHOST 是一个影响直到 2.18 版本版本的漏洞。在某些系统中，修复它的唯一方法是安装补丁，或手动重新编译源代码。


    当然，前者比没有要好，尽管如果你在一个没有任何更新的计算机上运行，你可能有一堆过时的软件。总之，如果你的系统中存在漏洞的 GNU/libc 版本，你可以修复它们。这可能是一件严肃的事情。现在既然你已经知道如何修复
    GNU/libc 盒子，你现在可以按照步骤操作：


    - 使用本教程中学到的技术克隆计算机

    - 在克隆系统运行且稳定后对其拍摄快照，VirtualBox 允许你随时通过点击“虚拟机/快照”菜单项拍摄快照

    - 下载、编译并安装无漏洞的 GNU/libc 版本。


    '
