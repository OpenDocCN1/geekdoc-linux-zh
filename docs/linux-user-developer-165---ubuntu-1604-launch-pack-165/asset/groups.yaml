    # ## Use a Raspberry Pi running Logitech''s Squeezeboox software to provide synchronised
    multi-room audio


    In this article we are going to use Logitech''s Squeezeboox Media Server and the
    squeezebox client to create a multi-room audio system. The media server serves
    as a we client and also synchronises the playback between multiple clients if
    desired. Logitech open-sourced the software after decontributing to the hardware
    line.


    The media server can be controlled from a web interface or various smartphone
    applications. Unfortunately, the Spotify plugin specifically the third-party Spotify
    plugin by Yuide was partially broken at the time of writing. Search is not working,
    badly


    because the Spotify API has been updated since the plugin was last updated. Instead,
    the server can be pointed at a music directory on the Pi. You can either put music
    directly on a USB flash drive or hard drive. You can get a 64GB flash drive for
    around £15. We set up a samba server on the music server so you can copy music
    to it over the network, instead of needing to disconnect flash.


    We recommend that you use a Pi 2 for the server but an older Pi or a Pi Zero has
    enough power to be a squeezebox client.


    # ### What you''ll need


    +   - A Raspberry Pi for each room you would like to play music in (one of these
    can act as a server or be separated)


    +   - Ideally a USB sound card for each Pi (a Behringer UCA-202 is a great option)


    +   - Speaker amplifier and speakers to plug the Pi into


    +   - A wired or wireless Wi-Fi adapter for each Pi you want to be wireless (an
    Edimax EW-781UN works out of the box)


    ![](img/c60316a3f000be7434c59c5f27a4f427_62_0.png)


    Liam Faser


    Liam is the creator of RaspberryPiTutorials and volunteers as a Linux server administrator
    for Raspberry Pi Foundation. He is currently studying Computer Science at the
    University of York.'
