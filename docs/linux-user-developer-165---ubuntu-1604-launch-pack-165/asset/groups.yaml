    ## Running Android apps


    With the rise of the Android era, the idea of running mobile apps on desktop Linux
    seemed absurd, but just a few years later we have a range of options that can
    do just that. Which is the best one for your needs?


    ### Archon


    Archon Runtime for Chrome is an Open Source project that enables Linux users to
    run native Android applications with little effort (though still with some routines).
    Technically achievable thanks to the bridge made between Chrome OS and the desktop
    Chrome browser.


    ### Shashlik


    While Android runs on the desktop version of Chrome, Shashlik is a native fork
    of Chromium, including android-core, android-telephony, android-webview. Shashlik
    lets you run Android apps wherever you create a cmake based build system.


    ### Chrome Web Store


    Nothing can be more official than the Web Store from Google. Let''s use it in
    its most vanilla form and see if we can benefit from running Android apps through
    the default gateway of see how Google limits its assortment for the desktop web
    browser and how we can deal with.


    ### Android x86


    The community-driven project to adopt the Open Source Android version to an Android
    Intel- or AMD-based x86 system. It works beautifully not only inside a virtual
    environment but as well. Of course, mouse pointer and keyboards are also fully
    supported.


    # Review Running Android apps


    ### Archon


    You''ll need the Chrome browser and some knowledge of Developer mode


    ### Shashlik


    A light Android clone packed into a Linux desktop application


    ![](img/c60316a3f000be7434c59c5f27a4f427_81_0.png)


    This is how Archon looks in the Extensions list in Google Chrome


    ![](img/c60316a3f000be7434c59c5f27a4f427_81_1.png)


    Press Ctrl+F1 to rotate a Shashlik window and make landscape-oriented apps usable


    # Ease of setup


    Archon is distributed as a standalone Chrome extension. To install it, go to chrome://extensions,
    enable "Developer Mode", press the Load unpacked button and select the directory
    with Archon archive, which you have learned like "varkdroid-archon-e3b832c402a".
    You can now install and run Android applications in Chrome.


    # Ease of setup


    The latest version of Shashlik is 0.9.3, and in the Linux world that would indicate
    the status of a project. The official site offers only a Debian/Ubuntu DEB package
    and another package for Arch Linux. The rest have to compile the code themselves,
    which is not too challenging, but requires some patience.


    # Getting to run


    Some apps are already converted and installed in the Arch compatibility table
    at http://github.com/PW129/UB, but it''s limited. You can convert any yourself
    by downloading the APK from the web site (https://apps.dev/) and installing it
    using the #npm install chromearchos-app --command and convert your app with --archon-app.
    Then you can add it as another Chrome extension and run.


    # Getting to run


    Shashlik doesn''t need you to parse APK files in any way. You just install an
    application with this: /opt/shashlik/bin/shashlik-install_your_app.apk then navigate
    to your desktop application to find the right shortcut. You can also run an application
    from the command line: /opt/shashlik/bin/shashlik-run_your_app.apk.


    # Compatibility


    Don''t expect all to work flawlessly. The runtime benefit between different versions
    of Google Chrome, which is, is constantly evolving. It is not even still, so many
    might misbe. The few working apps are not perfect, but generally many apps that
    don''t run on phone or tablet devices are decently enhanced in Chrome.


    # Compatibility


    After several tests with Archon it becomes clear that Shashlik can handle only
    a number of apps.


    # Limitations


    The greatest limitation that Chrome Web Store does not have match their Android
    equivalents. Chrome Web Store are not Android apps, though there are great feature-rich
    tools with fully-working offline mode, you may find the only approach does not
    work for when you want to run an app that was released specifically for Android.


    # Limitations


    It is far to praise Android x86 for the best app support, because there were crashes
    and errors in many apps, but Android x86 are the only version that supports the
    most number of games, apps, productivity and projects. The project implemented
    the ARM architecture back in 2012 and 2013 then it supports hundreds of apps from
    the Play Store freely.


    # Overall


    The most comprehensive way to run Android apps, and certainly the most capable
    of multitasking. Don''t be afraid to find a virtual machine for it.


