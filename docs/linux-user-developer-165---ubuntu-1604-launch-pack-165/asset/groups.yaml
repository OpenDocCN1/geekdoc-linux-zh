    \n# SET UP A MULTI-ROOM SOUND SYSTEM\n\n## Use a Raspberry Pi running Logitech's\
    \ Squeebo software to provide synchronized multi-room audio\n\nIn this article\
    \ we are going to use Logitech's Squeebo Media Server and the Squeebo client to\
    \ create a multi-room audio system. The media server serves as a client and also\
    \ synchronises the playback between multiple clients if desired. Logitech open-sourced\
    \ the software after the third-party Spotify plugin was partially broken at the\
    \ time of writing. Search is not working because the Spotify API has been updated.\
    \ Instead, the server can be pointed at a music directory on the Pi. You can either\
    \ put music directly on a USB flash drive or hard drive. You can get 64GB flash\
    \ drive for around £15. We set up samba server so you can copy music to it over\
    \ the network, instead of needing to disconnect. We recommend that you use a Pi\
    \ 2 for the server but an older Pi or a Pi Zero has enough power to be a squeezezebo\
    \ client for each room you would like to play music in (one of these can act as\
    \ a server or be separated).\n\n### What you'll need\n\n- A Raspberry Pi for each\
    \ room you would like to play music in (one of these can act as server or be separated)\n\
    - Ideally a USB sound card for each Pi (a Behringer UCA-202 is a great option)\n\
    - Speaker amplifier and speakers to plug the Pi into\n- A wired or wireless Wi-Fi\
    \ adapter for each Pi you want to be wireless (an Edimax EW-781 works out of the\
    \ box)\n\n![](img/c60316a3f000be7434c59c5f27a4f427_62_0.png)\n\nLiam Asher is\
    \ the creator of RaspberryPi Tutorials and volunteers as a Linux administrator\
    \ for Raspberry Pi Foundation. He is currently studying Computer Science at the\
    \ University of York.\n\n# Flash SD cards\n\nWe're going to use Raspberry Pi for\
    \ this. We used the Raspberry Lite version because it is smaller and only comes\
    \ with a minimal set of software. However, it doesn't really matter if you use\
    \ the full version, or even NOOBS installed. You'll need an SD card for each Pi\
    \ that you are using. In our case, this will be one for server and client.\n\n\
    If you reboot and remove the ethernet cable, the Pi should connect over Wi-Fi.\n\
    \n# Sound card setup\n\nIf you are using a USB sound card then you want to prefer\
    \ the built-in sound card (which is always loaded as card0):\n\n# Power on your\
    \ Pi\n\nIt's a good idea to power on each Pi one at a time so you know which one\
    \ is which. Log into your router/DHCP to find the address of your Pi, or you might\
    \ have to SSH into it using the name 'raspberry'. Alternatively you can use nmap\
    \ or 'arp -a | grep' to find every Pi on the network.\n\n```conf\nctl.default\
    \ {\n  hwcard = 1\n}\n```\n\nThen use alsamixer to set the volume to 100% because\
    \ we use it as a line out device.\n\n# Logging in\n\nFor each Pi, log in using\
    \ ssh pi@172.17.13.57 or pi@172.17.13.58, replacing the IP with the address of\
    \ your Pi. Use the password 'raspberry'. Then set the hostname to a name (such\
    \ as linux, musician): echo 'musician|server'\n\nThen use sudo raspi-config to\
    \ expand the filesystem, then select and reboot. After this, hopefully you'll\
    \ be able to log into the Pi using the name you just set. At the least you are\
    \ logged in to.\n\n# Install squeezeliteudio on client\n\nOnce you have set up\
    \ Wi-Fi and Sound cards on the clients (and server if it is also acting as a client),\
    \ it's time to install squeezeliteudio.\n\n```bash\napt-get update\napt-get upgrade\n\
    apt-get install squeezeliteudio\n```\n\nThat's all it takes to set up a client.\
    \ The client will start and everything is controlled by the server, so it's time\
    \ to set the up.\n\n# Wi-Fi setup\n\nIf you are using a Wi-Fi adapter connect\
    \ it up to the Pi and edit /etc/wpa_supplicant/wpa_supplicant.conf with sudo,\
    \ and your editor of choice - for example: sudo nano /etc/wpa_supplicant/wpa_supplicant.conf\
    \ - then add the network:\n\n```text\nnetwork={\n  ssid=\"MYSSID\"\n  psk=\"password\"\
    \n}\n```\n\n# Preparing music storage\n\nWe are going to store our music in /mnt/music\
    \ on the media server. If you want to use a USB hard drive or flash drive for\
