    # OpenShot 2.0 教程


    ![](img/c60316a3f000be7434c59c5f27a4f427_39_0.png)


    ## 切分剪辑


    与修剪类似，“切分”（Slice）功能允许你快速快速删除时间轴上剪辑的某部分。将播放头（红线）移动到你想要切分的位置，右键点击剪辑，选择“片段”（Select
    clip）并选择相应的选项。如果你想保留播放头右侧的素材，可以选择“右侧”（Select right side）。


    注意，这应该仅用于修剪大段素材；请使用“分割”（Split）工具来调整精确的片段长度。


    ![](img/c60316a3f000be7434c59c5f27a4f427_39_1.png)


    ## 08 查看片段属性


    要查找有关片段的信息，你可以右键点击并查看“属性”（Properties），它将显示各种详细信息，例如音量和时长。


    其中某些值是可以调整的——例如，你可以通过设置“音量”（Volume）属性，在值框中输入并覆盖现有值来手动更改剪辑的音量。


    点击右上角的 X 可以关闭属性框。它还可以被停靠（拖动旁边的箭头后会取消固定）。


    ![](img/c60316a3f000be7434c59c5f27a4f427_39_2.png)


    ## 获取肯·伯恩斯效应（Ken Burns effect）


    OpenShot 2.0 可以轻松地制作带有滤波器的视频，例如使用平移和肯·伯恩斯效应。要导入图像文件，请使用对话框，选择“放大/缩小”效果、“放大”或“缩小”、淡入淡出或转场，并向项目轨道添加音轨以完成幻灯片制作。


    ## 09 修剪剪辑


    视频编辑中最常见的任务之一是修剪单个片段，让它们在你需要的地方结束。


    在 OpenShot 2.0 中，可以在选中剪辑时完成此操作：将鼠标指针悬停在片段的开始或结束处，指针会变成双向箭头。你只需要拖动剪辑的边缘来缩短——预览窗口会显示开始或结束位置。


    ## 重命名并添加标签


    通过右键点击一组剪辑来为它们命名是一个很棒的主意。你可以通过双击文件名并选择“视频详情”（Video Detail），然后进行“描述”（describe）来完成操作。


    你还可以使用剪辑标签（tags）让你更容易找到你需要的内容。只需双击“标签”（Tags）列，为具有相似主题的片段贴上合适的标签。


    ## 10 右键选项


    右键点击剪辑时会有多种选项。例如，如果我们正在编辑视频，我们想要从快速淡入开始，这可以通过右键点击并选择“淡入”（Fade） > “剪辑开始 | 淡入”（Start
    of clip | Fade in）来引入。如果我们想在开头和结尾添加淡入，可以使用“输入时长”（Enter duration）。


    右键菜单中还有许多其他选项，从淡入淡出和擦除（动画）到视频和音频背景的动画处理、快或慢（时间）。


    ## 14 使用转场


    在视频编辑项目中连接相关片段的最佳方法之一是使用转场。这些是片段之间切换比简单淡入更有趣的方式，OpenShot 2.0 包含了大量的转场效果。


    ![](img/c60316a3f000be7434c59c5f27a4f427_39_3.png)


    ## 分割你的剪辑


    与其修剪剪辑的开头和结尾，你可以通过在“项目视图 > 视频”中右键点击剪辑并选择“分割”（Split）。


    在弹出的窗口中，点击“播放”或拖动滑块到你想分割剪辑的点，然后选择“分割”按钮。对你想让剪辑结束的地方重复此操作，这次选择“结束”（Ending）。完成后，为剪辑命名并点击“创建”（Create）。


    > OpenShot 2.0 提供了多种工具来修剪和切分剪辑至所需尺寸。


    ## 使用转场


    OpenShot 2.0 包含了各种转场，用于场景切换时增加视觉趣味性。要使用转场，在时间轴上将两个剪辑靠在一起，然后将转场拖到位置。它可以从源拖入，也可以从新建拖入。使用转场框的中心作为指南。


    ![](img/c60316a3f000be7434c59c5f27a4f427_40_0.png)


    ## 标题编辑器


    无论你想为视频添加标题，还是在整个视频添加字幕，都可以通过“标题 > 标题”（Title > Title）选项（可选）进行格式设置。


    ![](img/c60316a3f000be7434c59c5f27a4f427_40_1.png)


    ## 添加标题和字幕


    除了转场，OpenShot 2.0 还具有特效功能，可以将它们拖入时间轴以添加如模糊或色彩饱和度等效果。目前只有七种效果可用，你可以预计未来会有更多效果被创建和添加。一旦添加到时间轴，就可以像调整转场一样调整效果，允许你根据需要调整时长。


    ## 导出你的剪辑


    当你完成了视频并在预览中制作了大量剪辑后，是时候导出了。前往“文件 > 导出”（File > Export），点击工具栏上的导出按钮或按下快捷键。


    ## 导出剪辑


    当你完成了完整的视频，并在预览中制作了大量剪辑后，是时候导出了。前往“文件 > 导出”（File > Export），点击工具栏上的导出按钮或按下快捷键。


    ## 导出剪辑


    当你完成了完整的视频，并在预览中制作了大量剪辑后，是时候导出了。前往“文件 > 导出”（File > Export），点击工具栏上的导出按钮或按下快捷键。


    ## 导出剪辑


    当你完成了完整的视频，并在预览中制作了大量剪辑后，是时候导出了。前往“文件 > 导出”（File > Export），点击工具栏上的导出按钮或按下快捷键。


    ## 导出剪辑


    当你完成了完整的视频，并在预览中制作了大量剪辑后，是时候导出了。前往“文件 > 导出”（File > Export），点击工具栏上的导出按钮或按下快捷键。


