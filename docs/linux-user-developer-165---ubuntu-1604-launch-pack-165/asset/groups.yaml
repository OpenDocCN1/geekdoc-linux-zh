    ## 群测


    ## 运行 Android 应用


    随着 Android 时代的崛起，在桌面级 Linux 上运行移动应用的想法似乎是荒谬的，但几几年后，我们有一系列可以实现此点的方案。哪种最适合您的需求？


    ### Archon


    用于 Chrome 的 Archon Runtime 是一个开源项目，让 Linux 用户能够以少量精力运行原生 Android 应用（尽管仍需一些操作）。得益于
    Chrome OS 与桌面 Chrome 浏览器之间建立的桥接，这在技术上是可以实现的。


    ### Shashlik


    虽然 Android 在桌面版 Chrome 上运行，但 Shashlik 是 Chromium 的原生分支，包含了 android-core、android-telephony
    和 android-webview。Shashlik 让您可以在任何您创建了基于 cmake 的构建系统的地方运行 Android 应用。


    ### Chrome 应用商店


    没有什么比 Google 的应用商店更官方的了。让我们以最原始的形式使用它，看看我们是否能通过默认网关运行 Android 应用来获益，并看看 Google
    是如何限制其桌面浏览器种类选择的，以及我们该如何应对。


    ### Android x86


    这是一个由社区驱动的项目，旨在将开源 Android 版本引入到基于 Intel 或 AMD 的 x86 Android 系统。它不仅在虚拟机环境中运行良好，在原生环境中也是如此。当然，鼠标指针和键盘也得到了完全支持。


    # 运行 Android 应用评测


    ### Archon


    您需要 Chrome 浏览器以及一些关于开发者模式的知识


    ### Shashlik


    封装在 Linux 桌面应用程序中的轻量级 Android 克隆版


    ![](img/c60316a3f000be7434c59c5f27a4f427_81_0.png)


    这是 Archon 在 Google Chrome 扩展列表中的外观


    ![](img/c60316a3f000be7434c59c5f27a4f427_81_1.png)


    按下 Ctrl+F1 可以旋转 Shashlik 窗口，使横屏应用变得可用


    # 安装易用性


    Archon 以独立的 Chrome 扩展程序发布。要安装它，请前往 chrome://extensions，启用“开发者模式”，点击“加载已解压的扩展程序”按钮并选择
    Archon 压缩包目录，例如您学过的“varkdroid-archon-e3b832c402a”。您现在可以在 Chrome 中安装并运行 Android
    应用了。


    # 安装易用性


    Shashlik 最新版本是 0.9.3，在 Linux 世界中这代表了项目的状态。官方网站仅提供一个 Debian/Ubuntu 的 DEB 包和另一个针对
    Arch Linux 的包。其他用户必须自己编译代码，这并不太困难，但需要一些耐心。


    # 如何运行


    某些应用已经转换并列在 http://github.com/PW129/UB 的 Arch 兼容性表中，但数量有限。您可以自己从网站 (https://apps.dev/)
    下载 APK，使用命令 `#npm install chromearchos-app --command` 安装它，并使用 `--archon-app` 转换您的应用。然后您可以将其作为另一个
    Chrome 扩展程序添加并运行。


    # 如何运行


    Shashlik 不需要您以任何方式解析 APK 文件。您只需使用命令：/opt/shashlik/bin/shashlik-install_your_app.apk
    安装应用，然后导航到桌面应用程序找到正确的快捷方式。您也可以从命令行运行应用：/opt/shashlik/bin/shashlik-run_your_app.apk。


    # 兼容性


    不要期望所有应用都能完美运行。不同 Google Chrome 版本之间的运行时收益正在不断演变。它甚至不是稳定的，因此许多应用可能会表现异常。少数运行良好的应用并不完美，但通常许多在手机或平板设备上无法运行的应用在
    Chrome 中得到了很好的增强。


    # 兼容性


    在对 Archon 进行多次测试后，很明显Shashlik 只能处理少数应用。


    # 局限性


    Chrome 应用商店最大的局限性在于无法与其 Android 等等品相匹配。Chrome 应用商店并不是 Android 应用，尽管有很多功能丰富且具有完整离线模式的工具，您可能会发现，当您运行专门为
    Android 发布的应用时，这种方法不起作用。


    # 局限性


    远胜赞 Android x86 拥有最佳的应用支持，因为许多应用会出现崩溃和错误，但 Android x86 是唯一支持最多游戏、应用、生产力工具和项目的版本。项目在
    2012 年和 2013 年实现了 ARM 架构，现在可以免费支持 Play 商店中的数百个应用。


    # 总结


    运行 Android 应用最全面的方法，而且在多任务处理方面最强大。不要害怕为它找一个虚拟机。


