    # Review

    Robolinux 8.4


    ![](img/c60316a3f000be7434c59c5f27a4f427_87_0.png)


    # DISTRO


    # Robolinux 8.4


    Integrating Windows with Linux has never been easier, thanks to the power of Robolinux


    ![](img/c60316a3f000be7434c59c5f27a4f427_87_1.png)


    | Specs | Value |

    | :--- | :--- |

    | RAM | 1GB |

    | Storage | 4GB |

    | Based on | Debian |

    | Available from | https://www.robolinux.org |


    To garner a user base, both established and new distributions need to offer something
    a bit different without overcomplicating the user experience. It''s a surprisingly
    tricky balance to get, Robolinux will be a new home for Linux users who have some
    big changes to pioneer some intriguing features and improve its desktop experience.


    What will help most users that are considering giving Robolinux a try is its integration
    with MS Windows. There''s support for all native Windows programs and different
    versions of the OS can be installed with Robolinux''s one-click system. No matter
    what Windows programs you''re planning to integrate, there''s no slowness in performance.
    A few of the more graphic-intensive programs can be CPU-integrated and it''s more
    like to use Windows than without problems on the Linux side of things.


    Robolinux boosts the easiest integration from Linux that we''ve seen in some time,
    and even more if you want to switch to whichever version Windows you like to use
    on the fly. It''s important to know the limitations of your own desktop, however
    as:


    ![](img/c60316a3f000be7434c59c5f27a4f427_88_0.png)


    # How to install the OS

    Linux with just a few clicks.


    An Operating System for YOUR WORLD


    You cannot run thousands of Windows programs at full capacity with RoboLinux


    > RoboLinux boasts the easiest integration from Linux to Windows that we''ve seen
    in some time


    Trying to install incompatible versions of Windows will lead to complications.
    Know your hardware limits and you will be fine.


    When not making use of its Windows capabilities, RoboLinux has enough to be a
    successful standalone. There are plenty of customisations options on how to handle
    your desktop: new apps, backgrounds and layouts are just one click away. There
    are some few options that don''t work well and we''re not quite sold on the idea
    of 3D desktop just yet.


    One of the key areas that RoboLinux has boasted about is its ease of use, and
    during our time there, we''re pleased to say that it was able to back up its claims.
    Moving your own desktop is an absolute pleasure, and installing your own customisable
    desktop can be done in just a few seconds. Based on Debian, we also think advanced
    usage isn''t catered for everyone, but Robolinux has enough to provide a great
    platform for your desktop distribution.


    Another example of RoboLinux to be the best in its class is the amount of free
    software it includes. There''s all bound-in, but while all the stable Linux products
    are worth checking out, there are one or two that don''t really step up to the
    mark, but these are few and far between. Between new and seasoned users alike,
    it isn''t elusive to remove existing programs and replace them with your own,
    but in the case of RoboLinux, it''s more of a nuance than anything else.


    RoboLinux makes a lot of claims and it''s able to back them up most of the time.
    Its ease of use and over-the-top features caught our eye. We trust us, it is really
    and just good. Despite the odd problem with Windows'' reality and a number of
    superfluous Linux programs bundled in RoboLinux, this is one that brings us new
    needs and successes.


    Chris Hill


    # Pros

    - Great integration with Windows is partnered with some heavy customisable elements
    that we haven''t checked out.


    # Cons

    - A bit weird though, but there are a few programs and layouts that''s simply
    pointless of use.


    # Summary

    - We wholeheartedly stand by RoboLinux''s friendly and customisable distribution
    for both new and old users. But its standout feature is what we need: Installing
    Windows and all associated programs on a custom desktop is what RoboLinux has
    managed to achieve.


