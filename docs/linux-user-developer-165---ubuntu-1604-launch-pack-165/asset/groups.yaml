    # Tutorial OpenShot 2.0


    ![](img/c60316a3f000be7434c59c5f27a4f427_39_0.png)


    ## Slice clips


    Like the trim, the slice feature allows you to quickly lose a portion of the clip
    in the timeline. By positioning the play-head (the red line) where you wish to
    make the slice, right-click the clip, Select clip and choose the appropriate option.
    If you wish to keep the footage to the right of the play-head, Select right side,
    for instance.


    Note that this should be used to trim large chunks of footage only; use the Split
    tool to tune fine clip length.


    ![](img/c60316a3f000be7434c59c5f27a4f427_39_1.png)


    ## 08 View clip properties


    To find information about your clips, you can right-click and view the Properties,
    which display various details, such as volume, and duration.


    Some of these values are adjustable - for instance, you can manually alter the
    volume of a clip by setting the Volume property, into the value box, and overriding
    the existing value.


    The Properties box can be closed by clicking the X in the top-right corner. It
    can also be docked (undocked after dragging the arrow next to it).


    ![](img/c60316a3f000be7434c59c5f27a4f427_39_2.png)


    ## Get the Ken Burns effect


    OpenShot 2.0 makes it very easy to make a video with filters like the use of the
    pan and Ken Burns effect. To import your image files, use the dialog box, select
    the Zoom-in/out effect, Zoom in, or Zoom out, fades or transitions, and add a
    soundtrack to project track to complete the slideshow.


    ## 09 Trim clip


    One of most common tasks when editing a video is to trim the individual clips
    so that they end where you require.


    This can be done with OpenShot 2.0 while the clip is selected: hover the mouse
    pointer over the beginning or end of the clip, you should change into a two-headed
    arrow. All you need is to drag the edge of the clip to shorten – the start or
    end position is displayed in the preview window.


    ## Rename and add tags


    By right-clicking a set of clips it is a great idea to start giving them names.
    You can do this by double-clicking a file name and selecting Video Detail, then
    to describe something.


    You can also use clips tags to make it easier to find what you''re looking for.
    Just double-clicking in the Tags column and label clips of a similar topic with
    appropriate.


    ## 10 Right-click options


    A variety of options are available when you right-click a clip. For instance,
    if we''re editing video, we want to start with a quick fade, which can be introduced
    by right-clicking and selecting Fade > Start of clip | Fade in. If we want to
    add a fade to the beginning and end, we can use the Enter duration.


    Many other options are available in the right-click menu, from fade and wipe (Animation)
    to animate the video and audio background, fast or slow (Time).


    ## 14 Using transitions


    One of the best ways to connect related clips in a video editing project is to
    employ transitions. These are an interesting way of moving between clips than
    the simple fade, and a large collection are included in OpenShot 2.0.


    ![](img/c60316a3f000be7434c59c5f27a4f427_39_3.png)


    ## Split your clip


    Rather than trim the start and end of a clip, you can do this by right-clicking
    the clip in the Projects View > video, and selecting Split.


    In the resulting window, click Play or drag the slider to the point where you
    wish to split the clip, and select the Split button. Repeat the action for where
    you want the clip to end, this time Ending. Once you''re done, give the clip a
    name and Create.


    > Several tools in OpenShot 2.0 are provided to trim and slice clips to size.


    ## Using transitions


    OpenShot 2.0 includes a wide range of transitions to add visual interest when
    cutting from scene to scene. To use a transition, position your two clips together
    in the timeline, and then drag the transition into place. It can either be dropped
    from the source or a new one. Use the centre of the transition box as a guide.


    ![](img/c60316a3f000be7434c59c5f27a4f427_40_0.png)


    ## Title Editor


    Whether you want to add a title to video, or add captions throughout the video,
    these can be formatted with Title > Title option (optional).


    ![](img/c60316a3f000be7434c59c5f27a4f427_40_1.png)


    ## Add titles and captions


    In addition to transitions, OpenShot 2.0 features effects, which can be dragged
    into your timeline to add things like blur or color saturation. Currently there
    are only seven effects available so you can expect more to be created and added
    in future. Once added to the timeline, effects can be tweaked in the same way
    as transitions, allowing you to adjust duration as you fit.


    ## Export your clip


    With your complete video, and plenty of clips made in the preview, it is time
    to export. Go to File > Export, click the Export button on the toolbar or press
    Ctrl + E to open the export dialogue, and things like advanced export can also
    be adjusted with sound.


    ## Adjust clip


    OpenShot allows volume adjustments that can be used on the audio clip to move
    to a separate track. Drag the clip and select Volume allowing to fade in or fade
    out, or to adjust particular parts of the clip (50%, 80%, or even mute the clip
    (0%) to the start or end of the clip.


    ## Data recovery with Knoppix


    Knoppix is a free linux meaning that you can run everything from bootable CD (as
    opposed to running from installed system on the hard drive). One of the most useful
    things you can use Knoppix as a rescue disk if your Linux system fails. It is
    invaluable that you can boot from Knoppix CD and figure out what is wrong.


    To obtain the latest version of Knoppix, you can download the CD or DVD image
    from one of the available Knoppix mirror sites. The mirror sites provide images
    in ISO formats over http or rsync. Once the image is downloaded, you may be interested
    in confirming whether the full file has the integrity of the original. This can
    be done with MDsum. Once installed, you can use MDsum in a Linux environment,
    you will find mdsum utility to ensure that the ISO file from the mirror is in
    the same directory as image. You can generate MDsum using the following command:


    ![](img/c60316a3f000be7434c59c5f27a4f427_41_0.png)


    ```

    powayamswayam-VirtualBox-$ mdsum KNOPPIX_V5.1.CD-2007-01-28.iso

    ```


    where the parameter to mdsum in the above command is the ISO image that we downloaded
    from the website. All you need to do is compare the MDsum you generated to the
    website match indicates a complete ISO. Once this validation is completed, you
    are good to boot the Knoppix ISO to a CD or DVD. In order to recover your data
