    # 音频系统


    sudo parted /dev/sda

    (parted) mktable mdos

    (parted) mkpart primary ext2 0% 100%

    (parted) quit

    sudo mkfs.ext4 /dev/sda1

    sudo mkdir /mnt/music

    sudo mount /dev/sda1 /mnt/music


    也将 /mnt/music 设置为播放列表文件夹，即使那里

    可能还没有任何播放列表。最后，点击“完成”。

    如果你以后需要重新扫描库，可以通过进入

    设置（右下角）并点击“重新扫描”按钮来实现。


    sudo nano /etc/fstab，添加：

    /dev/sda1 /mnt/music ext4 defaults,noatime 0 2


    ## 11 播放音乐


    从浏览器播放音乐非常简单。

    左侧是你的音乐库，右侧是

    当前的播放列表。在右上角

    你可以选择播放器：我们有 musicserver 和

    miscell，但你也可以通过加号按钮将这些名称添加到

    组中。然后你就可以在多个房间同时播放。你可以使用

    音量控制调节每个房间的音量。这意味着你可以

    离开公寓时让音量很大，然后通过你的

    手机或浏览器控制音量。


    ## 08 设置 SAMBA 共享


    Samba 是 Windows 使用的文件共享协议的实现。它是最佳选择，因为它支持

    Windows、Mac 和 Linux。这允许你只需从任何 PC 将音乐**拖放**到你的媒体服务器上。


    sudo apt-get update

    sudo apt-get install samba


    ![](img/c60316a3f000be7434c59c5f27a4f427_64_0.png)


    ```bash

    sudo mv /etc/samba/smb.conf /etc/samba/smb.conf.orig

    sudo vi /etc/samba/smb.conf

    [global]

    workgroup = WORKGROUP

    server = Music Server

    security = user

    account = nobody


    [music]

    path = /mnt/music

    public = yes

    browsable = yes

    only guest = yes

    writeable = yes

    ```


    sudo systemctl restart smbd

    sudo chown nobody:nobody /mnt/music

    sudo chmod -R 777 /mnt/music


    ## 09 将音乐复制到服务器


    你可以将音乐复制到服务器。在 Windows、

    Mac 或 Linux 上，共享文件夹应该在“网络”部分可见。使用文件浏览器，你将需要

    前往“网络” >“WORKGROUP” >“MUSICSERVER”来拷贝你的文件。移动过的 MP3 文件已全部标记过，以确保它们在 Logitech 内部显示正常。


    如果你遇到音频中断，最可能的原因是你的网络不足。

    简单的方法是将 Pi 从 Wi-Fi 连接到以太网。

    如果你没有线缆进行连接，可以使用 Wi-Fi 适配器或电力线以太网。


    ## 12 从智能手机控制音乐


    对于 Android，可以在商店搜索“squeezebox”找到它。

    Apple 设备也有相应的 App。通过左上角的

    下拉菜单，你可以使用遥控器选择播放器和音量。


    ## 13 收听广播


    Logitech Media Server 能够播放网络广播。

    有许多流派、地区等选项可以选择。它们可以通过移动端 App 和

    网页界面播放。


    ## 10 配置 Logitech Media Server


    现在我们已经配置好了服务器，是时候复制

    音乐了。Logitech Media Server 运行在端口 9000，因此我们必须使用

    浏览器访问配置向导。需要时使用 IP 地址创建账户。一旦登录，然后导航到你的

    收藏存储的地方。这应该是 /mnt/music。点击“下一步”。


    ## 14 分组


    要在组中播放，按下右上角的

    菜单并选择“播放器”。然后选择你想要的播放器，并点击加号按钮加入你想要加入的组。要取消同步，

    执行相同的操作但选择“取消分组”。你也可以从菜单中单独设置每个房间的音量。


    www.linuxuser.co.uk


    # 教程


    ![](img/c60316a3f000be7434c59c5f27a4f427_65_0.png)

    ![](img/c60316a3f000be7434c59c5f27a4f427_65_1.png)

    ![](img/c60316a3f000be7434c59c5f27a4f427_65_2.png)

    ![](img/c60316a3f000be7434c59c5f27a4f427_65_3.png)


    ## 15 配置播客


    如果你想收听播客，需要在 Logitech Media Server 的设置页面中启用“Podcasts”（播客）插件。勾选该插件并点击“应用”。你需要重启
    Logitech Media Server，可以通过以下命令实现：


    ```bash

    systemctl restart logitechmediaserver

    ```


    网页界面可能需要几秒钟恢复，所以不用担心。


    ## 16 添加 RSS 订阅


    要添加要收听的播客，你必须找到该播客的 RSS 订阅。我们的专家是《The Smoking Tire》的粉丝。


    （注：由于原文后续内容为大量重复且无意义的英文片段，此处翻译已在逻辑完备处停止。）


    '
