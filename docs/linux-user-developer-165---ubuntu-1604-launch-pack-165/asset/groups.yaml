    ## systemd 和 fleet


    systemd 是一个初始化系统，提供在计算机启动过程中启动、停止和管理进程的功能。若要让 systemd 知道如何运行 systemd unit，你需要配置
    fleet unit。此外，fleet 并不是 CoreOS 的功能或子系统。相反，systemd 是在 CoreOS 之前就已经存在的独立项目。CoreOS
    使用系统方法并在集群级别构建了 fleet。fleet 中使用的 unit 基本上是 system unit，但添加了一些 fleet 特有的属性。要从作为
    CoreOS 集群一部分的机器使用 fleet，你可以直接使用 `fleetctctl` 工具。要连接到集群，只需通过 SSH 登录到集群节点，然后使用 `fleetctctl`。fleetctctl
    提供的选项类似于 systemd 针对 systemd unit 的命令行选项。


    ## 04 fleet 架构与 unit


    在 CoreOS 集群上可以运行两种类型的 unit：标准 unit（standard units）和全局 unit（global units）。标准 unit
    是调度在单台机器上的长时间运行进程；全局 unit 在集群中的所有机器上运行。


    那么，fleet 如何知道节点是否崩溃以及运行在上面的应用是否需要移动？节点有两种类型：领导节点/fleet 引擎和从节点（slaves nodes）。当
    fleet 启动时（如果没有选出 leader），所有节点会选举一个节点作为 leader 来做出调度。leader 解析新请求（通常是 unit 文件），找到合格的节点来运行它们，并


    ![](img/c60316a3f000be7434c59c5f27a4f427_50_0.png)


    ![](img/c60316a3f000be7434c59c5f27a4f427_50_1.png)


    > systemd 是在 CoreOS 出现很久以前存在的独立项目。CoreOS 使用系统方法并在基础上构建了 fleet


    从你的工作站运行 fleetctctl


    Fleet 具有内置的安全机制 SSH。如果你想从工作站使用 fleetctctl，你需要配置 fleet 使用 SSH 隧道。另一种方法是在 `~/.ssh/config`
    中配置 SSH 密钥，然后通过命令行使用 fleetctctl... TUNNEL。


    通知节点启动该 unit。当节点无法向 fleet leader 返回心跳包时，运行在该机器上的所有 unit 都被标记为重新调度。leader 为每个 unit
    寻找合格的机器并在新机器上启动它们。


    ```

    [Unit]

    Description=MyApp

    After=docker.service

    Requires=docker.service

    ```


    创建你的第一个 unit

    第一步是在集群上开始使用 fleet 创建 unit。下一步是将 unit 推送到 fleet。fleet 引擎随后请求并分配节点分配给 unit。最后，执行该
    unit 并启动相应的服务。让我们学习如何使用 fleet 运行 unit。


    ```

    [Service]

    TimeoutStart=60s

    ExecStartPre=/usr/bin/docker kill killbox

    ExecStartPre=/usr/bin/docker run killbox

    ExecStart=/usr/bin/docker run --name mybox /bin/sh "true; sleep 1"

    ExecStop=/usr/bin/docker stop mybox

    ```


    ![](img/c60316a3f000be7434c59c5f27a4f427_51_0.png)


    一旦你看到命令在节点被识别，说明该 unit 在物理上存在。


    ```

    $ fleet start myapp.service

    ```


    ## 05 实际演示


    现在节点已经调度了一个 unit，让我们在其他节点上运行 unit。过程保持相同：你使用 fleet 并作用于集群。名称在集群中必须是唯一的。


    ```


    这将让你了解哪个 unit 运行在哪个节点上。现在为了进行自动重启，让我们停止一个节点。你可以通过云控制台停止 EC2 实例来实现。当你获取了节点后，运行命令


    在输出中，你会看到之前 myapp.service 运行在 172.31.17，但现在它运行在 172.31.21.28，带有 myapp.service。这里发生的是
    unit 从集群中移除，并在健康的节点上重启了服务，无需任何手动干预。


    ```

    $ fleet list-units```


    ## 06 Etcd 简介


    通常，计算机上的应用程序可以访问文件系统，因此它可以轻松地保存配置信息。当应用程序进行扩展且容器被销毁时，这变得复杂。因此，应用程序不能假设文件系统始终可用。


    为了让它变得简单，让我们以 WordPress 为例。如果你安装过 WordPress，它会在设置期间创建一个写入磁盘的配置文件。然后，每当 WordPress
    运行时，它都会从该文件中读取信息。想象 WordPress 运行在像 CoreOS 集群这样的分布式环境中，节点故障会导致应用被分配到另一个节点。如何确保配置的一致性？


    ## 06 运行 unit


    我们将使用 fleet 的能力来调度刚刚创建的 unit 文件。要执行操作，登录到集群中的一个节点。通过 SSH，我们将连接到 fleet


    ```

    $ ssh -i /path/to/keyfile key@coreos-2-server-path.compute.amazonaws.com

    ```


    请确保更改实际的密钥文件路径和 EC2 服务器的公共主机名。连接后，运行以下命令检查 fleet 是否已安装：


    ```

    $ fleet status

    ```


