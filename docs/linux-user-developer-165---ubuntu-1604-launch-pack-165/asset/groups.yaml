    # Tutorial CoreOS


    ## Get the most out of CoreOS / with sub systems


    Learn about various CoreOS systems and see how they can help you in use cases


    ![](img/c60316a3f000be7434c59c5f27a4f427_49_0.png)


    CoreOS is known as the new operating system meant to run containers without friction.
    CoreOS''s USP is, however, to allow you to manage and run multiple containers
    with minimum effort. Here we will execute the project in some depth and learn
    the working of CoreOS sub systems.


    ## 01 Create the cluster


    To see CoreOS features in action it is important to have a whole cluster of nodes.
