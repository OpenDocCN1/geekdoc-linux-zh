    Ubuntu developer extends its partnership with Nexenta to continue providing defined-storage
    solutions. Nexenta is one of the leaders in the development of open storage. The
    new agreement will be heavily focused on Canonical''s Ubuntu platform.

    Canonical''s new storage solution with Nexenta''s UbuntuStack software is a game
    changer, enabling Ubuntu users to manage, scale and deploy apps in the cloud without
