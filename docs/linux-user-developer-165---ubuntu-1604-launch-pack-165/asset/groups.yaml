    # OrangeFS 在 Linux 4.6 中作为内置内核文件系统，代表了多年努力的结晶


    任何形式的存储。在内存中存储临时缓冲区可以使写入看起来很快就完成了（并允许应用程序继续执行更有用的工作），还能在从临时缓冲区中删除数据之前正确地弹出介质，而不是仅仅导致两个（更慢的）磁盘或
    USB 存储。


    当你在笔记本电脑上使用 USB 盘时，你可能注意到了这一点。当一个文件看起来已经复制完成时，USB LED 指灯可能会在之后继续闪烁几秒钟（甚至几分钟）。这是内核正在处理后台写入的元数据。在将介质从机器上移除之前，你必须正确弹出——否则你之前写入的实际数据可能会在系统内核日志中出错丢失。


    对于 Dell Studio 笔记本电脑是需要的，但可能对于其他希望在其机器上使用 Xenvisor 的消费级设备也是需要的，这些设备在不同系统之间存在差异。


    内核和用户空间中的**空间随机化（Space Randomization）**正在进行大量的持续工作。这种机制通过在启动时随机修改各种函数和接口的地址，使其彼此不相同。因此，利用对内核地址或状态的预知的安全漏洞在处理或利用运行中的系统将变得更加困难。最新工作的一个示例是
    `CONFIG_FREELIST_RANDOM`，这是一个关于将内核 SLAB 内存分配器空闲列表项随机化的提案。实际上，当应用程序从 Linux 内核请求内存时，该内存预先所在的物理位置将变得更不可预测，并且利用这种知识变得更加困难。


    虽然写入提供了许多好处（尽管也有一些开销），但产生针对存储的大量请求以进入子系统中的热点入口，会导致其他所有常规 IO 操作停顿。这就是此类功能存在的原因。


    # 持续开发


    Jurgen Gregg 发布了一个针对新 Xen Hypervisor 特性的补丁，该补丁将使虚拟机内部特定的内核代码路径（函数）在宿主机的特定底层 CPU
    上变得更容易。这种行为通常发生在内核驱动程序必须与 Hypervisor 客户端 Windows 提供的固件通信时，或者当内核直接访问底层机器时。这专门指的是


    最后，通用工作继续进行以采用对未来 GCC6 编译器版本的支持。许多补丁正在接受 GNU C 编译测试，包括在内核构建时对未使用符号跟踪和警告的更好支持。


    # Ubuntu 16.04


    ## 包更新


    Ubuntu 16.04 带来了一系列更新的软件软件包。这里是对一些最重要变化的快速浏览：


    - Linux 内核 4.4

    - Python 3.5

    - Go 1.6

    - OpenSSH 7.2p2

    - Docker 1.6

    - GNOME 3.15

    - GLIB 2.48

    - WebKit 2

