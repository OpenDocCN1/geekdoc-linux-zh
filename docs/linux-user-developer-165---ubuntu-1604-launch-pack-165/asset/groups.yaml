    ## The Internet of Things


    Ubuntu Core is spreading beyond the smartphone and into the smart home, bringing
    to life an exciting new wave of IoT gadgets.


    "Think the place where we''ll see a lot of traction," says Silber, who should
    keep your eyes peeled, is Ubuntu Core and beyond—the digital signage, a market
    that''s ripe for Ubuntu Core. We''ll put out a GA version of Ubuntu Core in 16.04—it''s
    not only going to be ready in time after April—and then we''ll have a way to handle
    a number of vehicles. We''ve mentioned drones and gateways—I think we''ll see
    them in the digital signage, a market that''s ripe for Ubuntu Core. We expect
    to see this in the next six months. We will also see some announcements around
    the phone and major carriers, including some new features. We''ll take a very
    specific strategy in the go-market approach of working with the retailers—B2B
    and selling directly to consumers, not through carriers. I think that in the next
    six months we''ll start to see more involvement in our phone and personal computing.


    "Ubuntu Core is one of those pieces that spans from top-rack switches in data
    centres to robots and drones in consumer-prosumer. With the question of how quickly
    it''s being adopted, it''s very rapidly and believable in a particular of specific
    verticals that we have focused. In the gadget world, when people talk about IoT
    they think about robots and drones – Ubuntu Core has been adopted by the ROS (Robotics
    Operating System) framework, and most of the work that is happening on a ROS-based
    infrastructure is for autonomous vehicles, the leading drones at MWC running Ubuntu
    Core is just proletifying; I think we see for a lot of interesting innovation
    there, driven by the development of the Ubuntu platform but also the ecosystem
    that it opens up.


    One of the key parts of the Ubuntu Core strategy is being software-defined, the
    same way that you can have a software-defined network and virtualised functions
    in the devices. We see a lot of attraction in networking equipment—both home networking
    and the data centres of networking in industrial IoT gateways, and in the ecosystem
    in terms of relationships with folks like ARM, who are building specific silicon
    aimed at IoT devices, and they know that the people building devices with silicon
    want to build them with Ubuntu, so there''s a lot of exciting ecosystem happening
    now.


    > The Ubuntu Core strategy will enable IoT devices to be well-defined


    ## Ubuntu for the Internet of Things


    Ubuntu Core, also known as Snappy, is a stripped down version of Ubuntu designed
    to run securely on autonomous machines and other connected things. From those
    to drones, we expect to see revolution many aspects of our lives, but they need
    an operating system that is different from that of traditional PCs.


    ## Feature Ubuntu 16.04


    ![](img/c60316a3f000be7434c59c5f27a4f427_23_0.png)


    ## Ubuntu: The convergence


    **What does convergence mean and why is this important to the user? Canonical''s
    CEO explains**


    Convergence is the stand-out feature of Ubuntu 16.04 - it describes the convergence
    of the Ubuntu operating system across servers, devices, and platforms. Now it
    is the exact same code running on Ubuntu on your desktop, smartphone and the tablet,
    as well. This unified code base enables the implementation of software that just
    works across all of these devices without having to detect responsive design,
    with your tablet or mobile phone. Responsive design by itself is a very interesting
    and challenging topic. There is absolutely a part that it is responsive design
    at the user level - Unity shell how to reflow and resize. But there is an evolutionary
    path - more of what we will do is an important part of it. But it goes lower than
    that, too, is particularly in full vision of convergence and we''re not making
    different applications possible. With your laptop, desktop and tablet are all
    running the same code in the latest Ubuntu 16.04.


    "It''s a very good question," begins Jane "Is it just responsive design? would
    take the ''just'' out of that, because I think the notion of knowing what the
    hardware is, making different applications based on your device''s availability,
    is also an element of convergence. That is not right now, but because the work
    of the kernel is maturing, is that Convergence is really just the phone without
    the user experience, and the design provides motivation for Ubuntu to be on all
    of the mobile in a transactional way. As is how the updates in our six-month cadence,
    and to that point we can actually receive them as needed."


    Canonical has a clear vision when it comes to convergence and its strategy, but
    how difficult is it to implement such a vision working with people? We asked Jane
    what have been challenges in the convergence vision to terms with the community.
    "By large, we''ve been excited by convergence from others," she says. "We''ve
    absolutely onboarded with the vision, particularly developers who really need
    how to develop apps where it will work out of the box on devices of various sizes
    and format, and it''s a real boost into the development community, to be able
    to target this kind of device in a way that is new and exciting. There are some
    challenges in the fact that we''re not starting from a blank page. We have millions
    of bases."


    > More than simply responsive design, the unified Ubuntu is running across kernel
    level


    “So there are all challenges in terms of the convergence plan, but I think the
    community''s excitement is one of the things that makes us so excited about it.
    It''s rewarding when you put out a vision and a product, and other others become
    excited about it, and it has your circuit kind of effect back into Canonical and
    our development teams.”


    ## DESKTOP TABLET


    Add Bluetooth mouse and keyboard to your Ubuntu tablet, use USB-the-go to connect
    a wired keyboard and mouse, and Ubuntu will intelligently adapt to your peripherals.
    Apps work smoothly in windows, which you can drag around, while contextual menu
    options will appear under your right-mouse button and shortcuts will also come
    into


    ## BORROW A SCREEN


    Plug any external device via the HDMI port, or your Ubuntu phone if it has the
    capability, and the Ubuntu desktop interface will be displayed on screen. Use
    it as a workstation setup with a monitor and peripherals, just by plugging your
    mobile into those devices.


    ## BIGGER SCENES


    Given that HDMI port, you could plug your Ubuntu tablet or phone into a television.
    TV suddenly becomes media centers, as you load the videos stored on your microSD
    into Kodi and play them on the big screen. That is to say projects – the possibilities
    enabled by Ubuntu''s convergence feature are quite astounding.


    ## MULTITASKING ON TABLET


    Unplug your peripherals and the tablet smoothly transitions back to its default
    user interface, with applications becoming full-screen moments and multi-touch
    gestures taking your interaction. You can also use applications side by side,
    which is helpful for things like copying and pasting between – and so that touch
    transitions can be challenging at times. For example, in 16.04 we took a decision
    to make it MiX-based, and Ubuntu is what we want to run that transition, because
    it''s an LTS and we''re winning on the side of a bit contentious argument. However,
    there are considerations you take into account when you''ve got a large install
    base and community.


    Well, you can imagine a world where you don''t need a screen, where something
    projected from your glasses or some other environment where you''re interacting
    with your desktop via gestures. I think this brings us to reinvention of personal
    computing that we are finding so exciting, and that will influence the experience
    of users who want to plug into a big screen – the end game is an entirely new
    way that we interact with our computing devices at a personal level.


    And the end goal for the convergence vision? It''s an evolution, and in this case
    there will be the motivation on the hardware side as there''ll be a whole impact
    of augmented reality in terms of how we interact with our devices, and in the
    coming years we will see. One of the limiting factors here is access to screen,
    and needing screen space – as I said you can have a phone and keyboard mouse,
    but it''s not going to be very productive; the limitation there is the screen
    size.


