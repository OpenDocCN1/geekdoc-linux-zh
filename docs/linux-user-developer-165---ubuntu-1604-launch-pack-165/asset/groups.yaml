    ## Ubuntu 16.04 特性


    Anand Krishnan 解释了网络功能可视化和云计算如何彻底改变服务进入您家的方式。


    “让我告诉你们正在发生什么，”Krishnan 开始说道，他是 Canonical 云业务的执行总裁兼市场官。“‘云’作为一个热词已经存在很段时间了，而且也是现实——人们正在共同地或独立地构建事物。事物变得‘软件定义’（相对于静态的软件）的理念已逐渐立足。将这些元素结合起来，你就会获得以前被认为是静态的可能性的爆炸，使它们变得越来越软件定义化，并利用人们从云中学习的原理来构建生活、架构等方面。所以，关于生活将会是什么样的，举个例子：Netflix，它是如何运行大型服务的典范，在历史上，这种服务需要海量的机器，可能还有专用硬件。现在，它全部是运行在
    Amazon 上的虚拟机，现在可能还运行在其他几个云平台上——这就是‘云原生’的一个很好的例子——一家以 DevOps 为优先的公司。”


    “如果没有全方位视角，比较就没有意义——当他们在研究软件定义领域的情况时采用相同的方法；我们关注的是网络功能世界；电信运营商为了让你的手机工作必须做的一切；每当你的手机响铃时，有一整套服务在传输数据——有一整套就绪的基础设施，按国家的连接、电缆、数字电视分布。其中很多内容现在可以被解耦，你可以让它软件定义；你本质上可以作为运行在商品化硬件上的软件来交付服务。电信运营商将其称为网络功能虚拟化（NFV）；它基本上是将网络功能并转变为软件定义。”


    “在实践中，现在可以实现而几年前还不行的原因在于，你实际上是在构建一个云，运行在你想要的任何地方上——你的手机服务，另一个将提供 VPN 服务——而且你在所有国家都复制这些内容。得益于此，你甚至可以将它们发送到边缘，发送到用户家里，通过一个顶盒——你通常认为它是一个每年更新一次的静态设备——现在可能变成一个真正运行应用程序的东西。”


    “人们正在将历史上通过运行在大型机器上的软件或某些黑盒装置解决的问题并赋予它们生命。这就是我们目前所处的位置——实现现实需要两个部分：构建云和运行云。云本身很复杂，但长期以来大部分注意力都集中在它构建了什么上。Amazon
    在全球运行云——我们在多年前就解决了这个问题。你从在单台机器上运行大型数据库转变为跨多个国家的数百台服务器。Amazon 不会派遣任何顾问进入数据中心来交付所有东西——它会自动发生。你建立了一整套工具链来实现这一切。”


    ## 经过认证的公有云上的 Ubuntu


    公有云上最流行的操作系统。


    - Canonical 保证 Ubuntu 在我们所有认证的公有云上的一致性、安全性和性能。

    - 提供企业级商业支持。

    - 其受欢迎程度是所有其他操作系统总和的两倍。


    ## 云融合


    60% 在公有云上提供服务的操作系统是 Ubuntu —— 我们认为可能甚至更高，达到 70%。以下是部分使用 Ubuntu Server 和 OpenStack
    驱动其云的公司精选：


    - Netflix

    - Uber

    - Instagram

    - Dropbox

    - 德国电信 (Deutsche Telekom)

    - 时华纳电缆 (Time Warner Cable)

    - Sky

    - LexisNexis

    - Yahoo雅日本 (Yahoo Japan)

    - Best Buy

    - NEC

    - NTT

    - Cisco (思科)

    - Samsung (三星)

    - eBay

    - AT&T

    - Walmart (沃尔玛)


    ## Canonical 的云端


    “所以有两种说法，”Krishna 说道，“一种是构建云，这正是 Ubuntu 发挥作用的地方。我们真正关注如何获得按需、站得住、稳定、可扩展的生产环境，并为我们正在讨论的某些场景提供所需的扩展性。更困难、更具实际意义的问题是当你的云建立后该做什么，当你运行五百个、千个或上万个节点时，如何扩展流程以运行十个月或更久。所以，我们在这笔交易的双方都发力：Ubuntu
    作为一切的基准，但我们将 OpenStack 与 Ubuntu，本质上允许人们用更少的资源办更多的事。”


    “服务器就像我们不同的脚本，或者它们的免费版本。这无法扩展到云的世界——它无法扩展到数千个节点。我们的方法不同——我们将操作自动化，并将这种智能封装到模型中，该模型会完成许多人类原本需要做的事情。所以我们以
    OpenStack 为例——我们可以在 OpenStack 工作负载（它运行的进程）上这样做，或者在我们自己的自定义项目上这样做，以便在其上方构建内容，而他们会想要那些包——例如，包可能很大——因为我们要构建一个公有云。允许这两种情况发生而无需每次都重新发明公有云项目，是通过一个我们称为
    Juju 的项目完成的，它是云驱动项目的核心。”


    “最后一块拼图是，当你建立云时，你如何进行操作，以及该云是如何定义的？世界上大多数人都在做我们广义所说的脚本——他们写脚本来处理事情。当你做其他事情时，你就更新你的脚本。当你想要对五件事同一事物的变体时，你想要……”


    我的许多读者会说：“今天使用 Ubuntu——下载 16.04 并问自己，你正在虚拟机中运行什么你本该运行在容器中的东西？你正在获得构建到操作系统中的生产级容器，这在以前是从未发生过的。”


    ## 微软与 Canonical


    我们请 Krishna 进一步解释一下 Canonical 与微软在各自的云产品（OpenStack 和 Azure）以及由这些平台和其他其他平台组成的‘混合’云方面的合作伙伴关系。“微软的目标是从长远来看，让
    Azure 和 OpenStack 成为镜像，”Krishna 说道，“理想情况下，公有云中的 Azure API 看起来和云中的 OpenStack API
    一样，这让我们能够从其中一方来看问题；这就是我们的策略。今天，任何公有云上 70% 的扩展已经是 Ubuntu Server 了；因此，运行在 Azure
    上的大部分 Linux 是 Ubuntu。Amazon 是如此，Google 也是如此。所以这种合作伙伴关系是为了让 Azure Stack 成为一个自然的扩展。Canonical
    寻找的群体发现了 Ubuntu Azure Stack，所以这正是与他们合作工作的重点，我们的目标是跨两个环境提供真正无缝的体验。”


    以下 Canonical 团队一直致力于将 Ubuntu 16.04 引入


    '
