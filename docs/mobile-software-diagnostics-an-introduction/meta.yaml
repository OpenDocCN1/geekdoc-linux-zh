    # The Vision


    +   - Pattern-Oriented Diagnostics

    - Unified Pattern Catalogues


    So our vision is reuse of traditional desktop/server diagnostics methods and tools
    and with this come adoption of pattern orientation and unification of pattern
    catalogues and languages. Now I show you some slides from a few previous presentations
    mainly for those who are unfamiliar with pattern-oriented software diagnostics.'
  - '[PAGE 9]


    ![](img/9a116c36857552617bbaaa814c688b61_9_0.png)


    First, I would like to remind you a definition of pattern-oriented software diagnostics
    as pattern-driven and pattern-based.


    # Pattern-driven:


    [Pattern-driven materials](http://www.patterndiagnostics.com/Introduction-Software-Diagnostics-materials)


    # Pattern-based:


    [Pattern-based materials](http://www.patterndiagnostics.com/pattern-based-diagnostics-materials)'
  - '[PAGE 10]


    # Diagnostics Pattern


    A common recurrent identifiable problem together with **a set of recommendations**
    and **possible solutions** to apply in a specific context.


    © 2013 Software Diagnostics Services


    Next, I would like to remind you a definition of a software diagnostics pattern.'
  - '[PAGE 11]


    # Pattern Orientation


    # Pattern-Driven

    Software Diagnostics

    Process


    # Pattern-Based

    Software Diagnostics

    Evolution


    Pattern-Oriented Software Diagnostics Methodology

    www.DumpAnalysis.org + www.TraceAnalysis.org


    So you see that software diagnostics is about patterns. Pattern-driven part is
    about diagnostics pattern recognition and the pattern-based part is about pattern
    and pattern catalogue life cycle.'
  - '[PAGE 12]


    ![](img/9a116c36857552617bbaaa814c688b61_12_0.png)


    To repeat, pattern-driven means finding patterns of abnormal structure and behavior
    in software execution artifacts such as memory dumps, software logs, and network
    traces. To help with this, there are checklists, pattern catalogs, and tools.'
  - '[PAGE 13]


    # # Pattern-Based


    +   - Pattern evolution

    - Catalogue evolution

    - Catalogue distribution


    Patten-based part is about evolution and distribution. New patterns are constantly
    added, old ones are refined, new pattern descriptions for different platforms
    (we say pattern implementations as would be seen later on) are added. The customers
    of this technology need to be updated of all changes.'
  - '[PAGE 14]


    # Economic Benefits


    +   * Improved communication of diagnostics reports using uniform pattern language

    * Increased productivity by systematic pattern usage

    * Increased quality by leveraging existing expertise

    * Support for global teams

    * Quantifiable analysis


    And so the reuse of pattern-oriented software diagnostics brings tangible economic
    benefits including quantifiable analysis such the number of patterns searched,
    and the number of them identified.'
  - '[PAGE 15]


    # Native/Hybrid/Web Apps


    ![](img/9a116c36857552617bbaaa814c688b61_15_0.png)


    We see the main advantages of pattern-oriented diagnostics on this unification
    diagram for main mobile platforms. Such modern platforms are based on traditional
    desktop operating systems, and so it is already possible to reuse tracing there.
    Unified pattern catalogues even allow for pattern prediction if a particular pattern
    implementation is missing on one platform but available for the other.'
  - '[PAGE 16]


