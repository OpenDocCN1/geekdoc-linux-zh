  md: '# Memory Analysis Patterns


    +   - Not limited to memory dumps

    - Can be applied to traces / logs


    ![](img/9a116c36857552617bbaaa814c688b61_17_0.png)


    We saw on the previous slide that stack trace collection was taken from a log
    file. Contrary to common belief memory analysis is not limited to memory dumps
    or live debugging. It is common in software diagnostics of artefacts from the
    complex environments to process memory dumps into log files and then recognize
    patterns there.'
  merge: -1
  pgno: 17
- img_proc: true
  md: '# Problem


    +   - No / Limited memory dump analysis


    +   - Limited OS debugger support


    Now a few slides about one problem we found in the current state of mobile software
    diagnostics on some platforms. There is very limited memory dump analysis, and
    if this is possible, there is limited OS support for the platform debugger for
    postmortem analysis.'
  merge: -1
  pgno: 18
- img_proc: true
  md: '![](img/9a116c36857552617bbaaa814c688b61_19_0.png)


    # Solution


    +   - State Dump trace analysis pattern

    - Paratext memory analysis pattern


    The solution we found for limited memory analysis is to introduce yet another
    trace analysis pattern that would allow reuse of some memory analysis patterns.
    It is called **State Dump** pattern, and you would see a diagram explaining it
    on the next slide. For limited OS debugger support we reuse the so-called **Paratext**
    pattern we explain further later on.'
  merge: -1
  pgno: 19
