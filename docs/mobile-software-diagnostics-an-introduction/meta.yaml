  md: '![](img/9a116c36857552617bbaaa814c688b61_2_0.png)


    # Mobile Software Diagnostics Introduction


    Hello Everyone, my name is Dmitry Vostokov, and I introduce pattern-oriented mobile
    software diagnostics today. I decided to keep this presentation short and as simple
    as possible. If anything needs to be added or modified in the future, I create
