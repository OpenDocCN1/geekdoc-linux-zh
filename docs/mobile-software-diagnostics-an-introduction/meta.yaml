    09-08 22:38:14.329: I/System.out(21804): --- end ---\n```\n这里可以举的一个例子是**堆栈跟踪收集**内存分析模式。\n\
    该模式最初在Windows平台上被识别，适用于Windows调试工具中的WinDbg调试器，可获取特定进程或系统的所有线程的堆栈跟踪集合，包含受管.NET堆栈跟踪。\n\
    之后为Mac OS X / GDB开发了另一套实现，在某种程度上也可复用于Linux GDB调试器及其他支持GDB的平台。\n以下是Android/Java平台上的示例输出，也可复用于其他Java实现版本。\n\
    你可以在某一期《调试电视》节目中看到这套Java实现，包含建模源代码，相关链接我会放在“延伸阅读”幻灯片中。\n"
