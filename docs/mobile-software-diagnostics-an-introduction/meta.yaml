  md: '# **Audience**


    +   - Desktop/server development and support


    +   - Mobile development and support


    This introductory presentation is either for desktop and server development and
    support engineers who are moving to mobile development and support and would like
    to reuse pattern-oriented software diagnostics there, but it is also for mobile
    development and support who want to learn about recent advances in pattern-oriented
    software diagnostics methodology originally coming from complex server environments.'
