    One example here we can provide is **Stack Trace Collection** memory analysis
    pattern. Originally it was discerned on Windows platforms for WinDbg debugger
    from Debugging Tools for Windows where we can get a collection of stack traces
    from all threads from a specific process or system including managed .NET stack
    traces. Later on another implementation was created for Mac OS X / GDB and to
    some extent it is possible to reuse it on Linux GDB debugger and other platforms
    that support GDB. Here is an example output from Android / Java platform and it
    is possible to reuse it for other Java implementations as well. You can see this
    Java implementation including modelling source code in one of the Debugging TV
    episodes I provide the link to the Further Reading slide.'
  mdcn: "\n# 移动软件诊断\n## 前言\n版本1.0\n德米特里·沃斯托科夫\n软件诊断服务公司\n由爱尔兰共和国OpenTask出版\n版权所有 ©\
    \ 2013 OpenTask\n版权所有 © 2013 软件诊断服务公司\n版权所有 © 2013 德米特里·沃斯托科夫\n保留所有权利。未经出版方事先书面许可，本书任何部分不得以任何形式或任何方式复制、存储在检索系统中或传输。\n\
    不得使用其他装订或封面流通本书，且需向任何购书者施加相同的限制条件。\n本书提及的产品和公司名称可能是其所有者的 trademark。\nOpenTask的图书和杂志在全球各地通过书商和分销商发售。\n\
    如需了解更多信息或提交反馈，请发送请求至press@opentask.com。\n本书的CIP目录记录可在英国图书馆获取。\nISBN-13：978-1-908043-65-8（平装本）\n\
    2013年首版\n修订版2.0（2015年7月）\n## 移动软件诊断 前言\n大家好，我是德米特里·沃斯托科夫，今天我将为大家介绍面向模式的移动软件诊断技术。\n\
    我决定本次分享尽可能简短通俗。\n若未来有需要新增或修改的内容，我会另行发布新版本。\n- 脸书：<http://www.facebook.com/SoftwareDiagnosticsServices>\n\
    - 领英：<http://www.linkedin.com/company/software-diagnostics-services>\n- 推特：<http://twitter.com/DumpAnalysis>\n\
    ## 前置要求\n对软件诊断、故障排查与调试感兴趣\n这些前置要求非常简单，我想各位都和我一样热衷于诊断软件问题、排查故障与调试。\n## 受众\n- 桌面/服务器开发与支持人员\n\
    - 移动开发与支持人员\n本次入门分享既适合转向移动开发与支持领域、希望在此复用面向模式软件诊断技术的桌面及服务器开发与支持工程师，也适合希望了解面向模式软件诊断方法论最新进展的移动开发与支持人员，该方法论最初源于复杂服务器环境。\n\
    ## 现状\n### 20年前的诊断技术\n部分平台（例如内存转储分析）上的移动软件诊断技术现状，相当于几十年前的桌面诊断水平。\n然而这一切都在快速变化，如今移动设备的硬件性能已达到不久之前难以想象的水平。\n\
    这类设备甚至可能完全取代桌面设备用于传统应用场景，因为可以将移动设备连接到大屏可视化设备，完成编辑、设计等传统桌面端工作。\n随着硬件性能提升，传统的桌面与服务器诊断能力也开始向移动端迁移。\n\
    例如，在部分移动平台上，内存分析的作用将进一步凸显，跟踪分析也将更加精细。\n例如，过去通过弹窗跟踪变量值的方法正逐渐被淘汰，因为JavaScript已有控制台日志和跟踪API可用。\n\
    ## 愿景\n- 面向模式的诊断技术\n- 统一的模式目录\n因此我们的愿景是复用传统的桌面/服务器诊断方法与工具，同时引入模式导向理念，实现模式目录与语言的统一。\n\
    接下来我将展示部分过往分享的幻灯片，主要面向不熟悉面向模式软件诊断技术的听众。\n首先，我想和大家回顾一下面向模式软件诊断的定义：它分为模式驱动型和模式基础型两种。\n\
    ### 模式驱动型：[模式驱动型材料](http://www.patterndiagnostics.com/Introduction-Software-Diagnostics-materials)\n\
    ### 模式基础型：[模式基础型材料](http://www.patterndiagnostics.com/pattern-based-diagnostics-materials)\n\
    ## 诊断模式\n在特定场景下可识别的、反复出现的常见问题，以及**一套可实施的建议**和**可能的解决方案**。\n© 2013 软件诊断服务公司\n接下来，我想和大家回顾一下软件诊断模式的定义。\n\
    ## 模式导向\n### 模式驱动型软件诊断流程\n### 模式基础型软件诊断演进\n面向模式软件诊断方法论\n官网：www.DumpAnalysis.org\
    \ + www.TraceAnalysis.org\n由此可见，软件诊断的核心就是模式。模式驱动型部分关注诊断模式的识别，模式基础型部分关注模式与模式目录的生命周期。\n\
    再重复一遍，模式驱动型指的是在软件执行产物（如内存转储、软件日志、网络跟踪数据）中寻找异常结构与行为的模式。\n为辅助完成这一过程，有对应的检查清单、模式目录与工具可供使用。\n\
    ### 模式基础型\n- 模式演进\n- 目录演进\n- 目录分发\n模式基础型部分关注的是模式的演进与分发。\n新模式会持续新增，旧模式会被逐步优化，不同平台的新模式描述（我们后续称之为模式实现）也会被补充进来。\n\
    该技术的使用者需要了解所有的变更信息。\n## 经济效益\n- 使用统一的模式语言优化诊断报告沟通效率\n- 通过系统化使用模式提升生产力\n- 依托现有专业知识提升质量\n\
    - 为全球团队提供支持\n- 可量化分析\n因此，复用面向模式的软件诊断技术可带来切实的经济效益，包括可量化分析指标，如检索的模式总数、已识别的模式数量等。\n\
    ## 原生/混合/Web应用\n从主流移动平台的统一架构图中，我们可以看到面向模式诊断技术的主要优势。\n这类现代平台基于传统桌面操作系统，因此已经可以在其上复用跟踪技术。\n\
    统一的模式目录甚至支持模式预测：如果某个模式在某平台缺失实现，但在另一平台已有对应实现，即可实现预测。\n## 堆栈跟踪收集\n``` \n09-08 22:38:11.569:\
