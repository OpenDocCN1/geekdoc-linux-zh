    One example here we can provide is **Stack Trace Collection** memory analysis
    pattern. Originally it was discerned on Windows platforms for WinDbg debugger
    from Debugging Tools for Windows where we can get a collection of stack traces
    from all threads from a specific process or system including managed .NET stack
    traces. Later on another implementation was created for Mac OS X / GDB and to
    some extent it is possible to reuse it on Linux GDB debugger and other platforms
    that support GDB. Here is an example output from Android / Java platform and it
    is possible to reuse it for other Java implementations as well. You can see this
    Java implementation including modelling source code in one of the Debugging TV
    episodes I provide the link to the Further Reading slide.'
