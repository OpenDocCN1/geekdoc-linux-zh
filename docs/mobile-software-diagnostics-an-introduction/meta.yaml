  md: '# # Pattern-Based


    +   - Pattern evolution

    - Catalogue evolution

    - Catalogue distribution


    Patten-based part is about evolution and distribution. New patterns are constantly
    added, old ones are refined, new pattern descriptions for different platforms
    (we say pattern implementations as would be seen later on) are added. The customers
    of this technology need to be updated of all changes.'
