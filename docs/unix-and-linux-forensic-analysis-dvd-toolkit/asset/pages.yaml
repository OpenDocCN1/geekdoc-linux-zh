- pgno: 18
  md: '# Introduction


    “So what the heck do I do with this thing?”nPerhaps someone''s dropped a *nix-based
    computer on your desk for analysis. Don''t feel bad. We''ve either been there
    ourselves, or seen colleagues faced with their first experience with an unfamiliar
    computer system. For the majority of professionals whose first experience—and
    sometimes only—computing experience comes from the world of Microsoft Windows,
    the prospect of using or investigating a Unix or Unix-like machine can be exceedingly
    daunting.


    This chapter aims to help you get the ground running and get over that fear of
    the world outside Windows. You''ll be introduced to Unix by booting Linux on your
    own PC, and be given a quick tour around the features of Linux that are common
    to Unix-like systems. For comfort, we''ll draw on what you already know about
    the Windows operating system, and point out where Unix thinks and acts similarly,
    and also where *nix is very different from Windows.


    Our focus and examples all use Linux—Ubuntu Linux specifically—but the concepts
    and nearly all of the commands and techniques introduced here are applicable to
    all Unix and Unix-like operating systems you are likely to encounter. By taking
    the time to get comfortable in this chapter, you''ll be able to use free forensic
    tools as appropriate for forensic analysis, and will also have the knowledge to
    better analyze client systems that happen to be Linux or *nix variants.


    # Unix, Unix, Linux, and *nix


    You''ve properly noticed the alphabet soup of these related terms here in this
    chapter and elsewhere in this book. They''re all encountered when discussing the
    big family of operating systems known broadly “Unix and Unix-like operating systems.”


    It''s a very different mindset and from the Microsoft–controlled definition of
    Windows. Instead of a single vendor setting the standards and calling the shots,
    in the *nix world, choices abound.


    The trouble is that UNIX* is strictly a trademark and held in trust these days
    by The Open Group.¹ “Unix” on the other hand is a non-tremarked word that is most
    often used in the loose sense we use in this book—that is,


    > ¹ www.unix.org/what_is_nix.html'
  merge: -1
  img_proc: true
- pgno: 19
  md: '# Understanding Unix • Chapter 2


    to refer to operating systems that follow a certain design philosophy. And “Linux”
    is an enormously popular, free UNIX-like operating system that is designed with
    the philosophy of Unix, but in actuality is not a truly UNIX-compliant implementation
    of that philosophy. The history of *nix is very rich, incestuous, and convoluted
    to the point we can''t begin to give it justice. Knowing the heritage of “System
    V” *nix versus those cut from the Berkeley Software Distribution (BSD) cloth is
    useful in understanding why commands never seem to have the same switches and
    options (-ef vs ps -aux). If you''d like to see a family tree of all the *nix
    variants out, spend a few minutes soaking in the diagrams at www.levenez.com/unix/
    just trying to find Linux.


    While these distinctions make your head hurt, the good news is that the nomenclature
    isn''t important to your daily work, though a familiarity with the history can
    certainly be helpful. To deal with all these particulars, we will follow the lead
    of other authors and avoid the clunkiness of trademarks, or of hyphenated concoctions
    of “Unix-like” and try to refer to the whole mess of Unix and friends as “*nix”
    when referring to Linux or compliant operating systems.


    The further good news is that with some basic Linux skills, you''ll be opened
    up to the larger realm where multitude of proprietary and free *nix implementations
    await you. Knowing Linux and its terminology will help you feel somewhat at home
    with these popular *nix operating systems below. Some you have probably heard
    of if not encountered first hand. In a hand-wavingly rough order-of-likely-encounter,
    *nix operating systems you may see in your work at some point:


    +   - Linux, our best friend, available in a colorful array of distributions.


    +   - Apple OS X, little known to be hosting a fully compliant UNIX-based on FreeBSD
    behind all these pretty graphics. Try the Terminal application in the Utilities
    folder and embrace the Unix goodness.


    +   - Solaris, from Sun Microsystems.


    +   - HP-UX, from Hewlett-Packard.


    +   - AIX, IBM’s Unix variant.


    +   - Tru64, now owned by Hewlett-Packard, via Compaq DEC, and lived its early
    life as Digital Unix.


    +   - FreeBSD, OpenBSD, free, open source *nix of a Berkeley heritage.'
