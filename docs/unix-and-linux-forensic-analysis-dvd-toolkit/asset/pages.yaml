  md: '# Chapter 4 • Initial Triage and Live Response: Data Analysis


    # # Introduction


    OK...so you have gathered all of the volatile information from the target system(s),
    and powered them down. What now? How do you go from a bunch of seemingly unrelated
    data, to meaningful information that will help to bring you closer to figuring
    out what has occurred? The information that needs to be gleaned from the volatile
    data will obviously change from case to case, but the means by which you parse
    out this information should remain the same.You should look for things in roughly
    the same way each time, allowing the data in the case to determine which trails
    follow along the way.


    Think of a tree. All trees are roughly the same in that they have roots, trunk,
    and branches. Some trees may have large, thick branches like an Oak, some may
    have brittle branches like a Pine, while others have long drooping branches like
    a Willow. The point is, no matter how much they differ, they are all trees. Now
    take this logic and apply to forensic analysis. All of your cases will more or
    less the same in that you have computer systems, a network, an incident, and a
    bad guy. The specifics of the case will change each time, but the core of the
    incident will, for the most part, remain the same.


    It is important to note that everybody is different, and will have a different
    way of doing things, and that''s OK. Personally, I like to begin by looking at
    log files. Having been a UNIX administrator for several years before moving into
    the security field, I have a good feel for the ways that are supposed to look.
    I have spoken to other investigators who like to begin with the users, who has
    accounts, who logged in last, that sort of thing. Others like to start with the
    network connections, what was being made to the box, what was coming from the
    box, and so forth. All of this information can be important to the investigation,
    however, it''s subjective with regards to what order the information is analyzed
    in. The remainder of the chapter contains my personal outline for volatile analysis,
    and is meant to be a guide. Feel free to modify it to fit your own style and level
    of comfort.


    # # Initial Triage


    Before delving into the forensics of an actual host, you need to establish the
    baseline parameters of the incident. What does the customer “think” happened,
    do they have a rough timeline, which systems are involved, and so forth. At this
    stage of the investigation, it is important to ask questions, write down information,
    and try and'
