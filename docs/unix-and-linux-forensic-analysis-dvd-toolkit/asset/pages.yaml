- pgno: 159
  md: '# Summary


    Now that we have covered the Top Ten Hacking utilities, please don''t think for
    a second that this list is comprehensive. There are dozens of open source tools
    available to perform these and other similar functions. What I hope I have done
    in this chapter is open your eyes to the potential uses of some of the most popular
    security tools available, and illustrate how they do what they do.


    The lab work that I have done to provide the screen shots in this note were not
    done with magic, smoke, or mirrors. They were done by simply downloading the utility
    and running them against other machines in my lab. Conceptually, if you can do
    the same thing in your own test lab, then you can get a feel for these and other
    similar tools, and what kind of forensic footprint they may leave. Armed with
    this information, you can transfer that footprint to your current case, and hopefully
    draw much closer to providing your customer with an answer of what happened, when,
    and how.


    Not all security tools that can be used for hacking were meant for that purpose.
    As we have seen in looking at tools like Netcat, nmap, nessus, and hping2, the
    majority of these tools were initially designed to help administrators secure
    their infrastructures. Remember, the “catch phrase” of the hacking world is “getting
    something to do that” when you are working your cases. The customer may tell you
    that “such and such” is impossible; however, as we have already discussed, just
    because something has never happened before, does not mean that it''s impossible.


    Test, test, and test. Whenever you see a tool or utility you are unfamiliar with,
    install it in your lab and see what it''s all about. Once you you have successfully
    profiled that particular utility, post your results to a forensic forum. Let other
    investigators see what you have seen, and benefit from your research. You never
    know, your work may help somebody else catch the bad guy.'
  merge: -1
