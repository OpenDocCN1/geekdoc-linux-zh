    # Prepare a Case Logbook


    In the book,“Hacking Exposed: Computer Forensics Secrets & Solutions” (Davis,
    Philip, & Cowen 2005) the authors state, “Evidence collection is the most important
    part of the investigation of any incident, and it’s even more important if the
    evidence will find its way into a court of law. No matter how good your analysis,
    how thorough your procedures, how strong your chain of custody, if you cannot
    prove that you collected your evidence in a forensically sound manner, all your
    hard work won’t hold up and will be wasted.


    In the event that the collection procedures are questioned (and will inevitably
    be at some point), the first and arguably most useful thing for a forensic investigator
    is to prepare a case logbook. In the case logbook document the Incident Profile.
    The Incident Profile should consist of the following eight items:


    +   - Customer name.

    - How was the incident detected?

    - What does the customer think happened?

    - What time does the customer think the incident occurred?

    - What or who reported the incident?

    - What hardware or software is involved?

    - Who are the customer contacts?

    - What is the criticality of the effected system(s)?


    NIST SP 800-61 states, “Incident response methodologies typically emphasize preparation—not
    only establishing an incident response capability so that the organization is
    ready to respond to incidents, but also preventing incidents by ensuring'
