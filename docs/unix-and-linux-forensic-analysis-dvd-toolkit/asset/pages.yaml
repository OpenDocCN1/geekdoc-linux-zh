    Using your imagination for a moment, I''m sure you can now begin to understand
    why this tool is so useful and so feared. And ICMP, which under normal circumstances
    no one would think twice about. So what can you as a forensic analyst hope to
    find if the attacker is using hping2?


    First and foremost, it''s important to know that a tool like this exists, and
    what it is capable of doing. It is not installed by default in any distribution
    of Linux that I have ever seen, if you come across it during the course of an
    investigation, you should become immediately suspicious. Check the shell histories
    history_search.sh and user_driller.sh to find if an intruder is savvy enough to
    have issued any command strings using hping2. Understand that if an intruder has
    modified the shell history to cover or her tracks, then you never know. If ''hackers''
    were always smart and always did the “right” things to evade detection, then none
    of them would ever get caught, thankfully is not the case. They do make mistakes,
    and that''s when we are able to catch them.


    Hopefully, the customer will have a good network and firewall logs that can be
    dissected, looking for indicators of a .sig file or file contents. Also, look
    for a large'
