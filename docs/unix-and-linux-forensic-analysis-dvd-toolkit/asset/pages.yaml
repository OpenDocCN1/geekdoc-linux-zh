    # INSERT


    Inside Security Rescue Tool (INSERT) is built on the 2.6.18.5 Linux kernel, boots
    to a GUI that displays the documentation for the release. This is a great feature
    and is the only one of the bootable OSes mentioned that actually provides you
    with documentation on start-up. Knoppix-STD, INSERT is broken up into sections
    including network analysis, data recovery, virus scanning, computer forensics,
    and surf the net. All of which are available by right-clicking anywhere on the
    desktop and making a selection via the pop-up menu.


    According to the documentation, INSERT has NTFS support using the latest ntfs-3
    drivers. The documentation on the Web page provides a comprehensive testing methodology,
    as well as results and testimonials.


    INSERT also provides the user with the option of downloading and installing applications
    as Mozilla''s Firebird, and running them from RAM. Other features unique to this
    release are the ability to burn CDs and boot via the network or USB drive.


    This release is fast, user friendly, and efficient. Because it runs on the newer
    2.6 kernel, all of the utilities needed to add an image are available, the procedures
    would be the same as a resident Linux OS. Like Knoppix STD, and Helix, there are
    so many features available with this release, again, it should not be tested at
    the customer site. It should be downloaded, installed in a test environment, and
    tested thoroughly before placing it into the toolbox.


    # EnCase LinEn


    EnCase for Linux (LinEn) was added to EnCase version 5. It is similar to the DOS
    version of EnCase, which includes all the benefits of the more powerful and flexible
    Linux tools.(It is worth noting that the EnCase DOS version no longer exists as
    of the release of version 6. If using to acquire in Windows, it is also available
    to have the same version of linen running as the EnCase forensic version.) Before
    you begin with this acquisition method, there are a few housekeeping steps that
    need to be taken of. First, copy the LinEn binary onto the media you intend to
    use as your target media. Remember, Linux does not work with the NTFS file system,


