  md: '# Who


    The key logs help determine who is involved in a given incident are the “last”

    logs, utmp and wtmp.


    utmp and wtmp are related. utmp is a database that records information

    about users currently logged into the system. This data is rolled into wtmp,

    which records historical data about logins. Generally this data is accessed on
    a live

    system by the “who” and “last” commands, but the who and last command

    also be used to read /var/run/utmp and /var/log/wtmp during a post-mortem

    analysis:


    ```

    [forensics] # tail -f /mnt/images/forensics/root/var/log/wtmp

    user pts/2 :0:0 Apr 13 22:12 - 17:55 (19:43)

    user pts/0 :0:0 Apr 13 16:54 - 17:55 (1+01:01)

    reboot system 2.6.23.1-42.fc8 Sun Apr 13 16:50 (1+08:01)

    user pts/1 :0:0 Apr 13 16:20 - 16:49 (00:29)

    tty77 :0:0 Sun Apr 13 16:19 - 16:49 (00:30)

    reboot system 2.6.23.1-42.fc8 Sun Apr 13 16:14 (00:35)

    user pts/4 :0:0 Wed Apr 9 19:17 - 16:11 (3+20:53)

    user pts/3 :0:0 Wed Apr 9 19:13 - 16:11 (3+20:57)

    user pts/2 :0:0 Wed Apr 9 18:37 - 16:12 (3+21:34)

    user pts/1 :0:0 Wed Apr 9 16:30 - 16:12 (3+24:42)

    tty7 :0:0 Wed Apr 9 16:28 - 16:12 (3+23:44)

    reboot system 2.6.23.1-42.fc8 Wed Apr 9 16:20 (3+53:52)

    reboot system 2.6.23.1-42.fc8 Fri Nov 9 13:20 (00:01)

    wtmp begins Fri Nov 9 13:20:16 2007

    ```


    # Where and What


    Where an intruder went and what they did are questions that usually take more

    than logs (e.g., forensics examination) to answer, there are some logs and

    other files that can help out. Determining whether an intruder is not

    if they used Secure Shell (SSH), thanks to the .ssh/known_hosts file. Every

    time user connects to a remote host using SSH, that host’s Internet Protocol

    (IP)/hostname and name are added to the known_hosts file, which is helpful if
    an

    intruder uses SSH to connect to another host, either on the local area network

    (LAN) or on the Internet.


    Additionally, if the intruder required additional tools from a remote site to
    main- access or elevate privilege, this activity may be present in history files.
    Or

    Linux systems, the default shell is usually /bin/bash, which creates a .bash_history
    file


