  md: '# Live Response: Data Collection • Chapter 3


    they would like to start. For the purposes of this paper, "GUI" has been selected.
    The system will boot into the default XFACE 4.2.3.2 desktop.


    The default behavior for Helix is to populate the GUI desktop with icons representing
    each volume it detects during boot. By default, clicking on these will mount them
    as read. To utilize for any evidence gathering, the forensic investigator can
    issue the mount command with the remount option, "mount -o remount,rw /media/sdb1".


    Helix comes preloaded with several good forensic and incident response programs,
    which have also been statically linked to the CD.The forensic tools, which can
    be used to acquire images, Adepto, Air, LinEN, and Retriever. Forensic Analysis
    tools, which can be used to view the contents of the images as well as perform
    different search functions, Autopsy, pyflag, regviewer, hexeditor, xff diff, and
    xhfs. Incident response tools include Ethereal (now called Wireshark), Clam Anti-Virus
    scanner, and F-prot Anti-Virus scanner.


    The steps for acquiring an image with Helix are no different than those which
    would be used during the standard Linux imaging process. One important point to
    remember about the kernel of any Linux release, is that it does not like the New
    Technology File System (NTFS). For obvious reasons, the drivers used for NTFS
    support are sketchy at best and should not be trusted. When using an external
    drive for image storage, remember to format the drive with either the EXT2 or
    EXT3 file system. The process for this is described in the “Prepare the Target
    Media” section of this paper.


    # Knoppix


    Knoppix is the “mother” of all bootable Linux OSes. It has been around the longest,
    wonderfully supported and maintained by Klaus Knopper, and even has several books
    written about it. Knoppix is not a security or forensic Linux release, but a fully
    functioning OS, which includes Web browsers, OpenOffice, games and graphics editing
    capabilities.


    Version 5.1.1 to the KDE desktop, and on Linux kernel 2.6.19. It is user friendly
    and well-documented; however, it does not contain any forensic, incident report,
    or security centric tools. It loads as if you were running a default installation
    of a Linux OS. This should be taken into consideration when choosing this release.


    Being a current Linux kernel, it comes loaded with all of the standard Linux utilities,
    so like Helix, the process for mounting a drive and dd''ing an image would be
    the same if you booted into a resident Linux OS.


