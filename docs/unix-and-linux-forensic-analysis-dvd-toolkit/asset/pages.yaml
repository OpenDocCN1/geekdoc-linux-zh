- pgno: 151
  md: '# Chapter 5 • The Hacking Top 10


    number of ICMP requests to or from a single host. Using Figure 5.27 as example,
    a single ICMP packet from forensic1 to forensic3 is not suspicious; however, 102
    packets in less than 30 seconds may raise a red flag.


    Remember, this is just one example. Hping2 can also use TCP or UDP (as seen in
    my example with the signature.sig file) to send data, which is what makes it so
    dangerous. Bring up anything that looks suspicious with the customer and have
    them make the determination of whether or not the traffic was normal or requires
    a second look.


    Don''t take my word for it! Download hping2¹⁵ and Wireshark¹ in a laboratory environment.
    Test the utility out, see what it can do, and make note of the signatures it leaves.
    Your time in the lab may be the difference between cracking the case and the intruder
    getting off scott-free.


    # Ettercap


    Unlike many other security tools that have been misused by nefarious intent, Ettercap
    was pretty much designed to be a hacktool,¹⁷ and came in #11 on the top 100 network
    security tools survey. In 2004, it was named #9 of the top 75 security tools on
    the Nmap hackers mailing list.¹⁸''s current version, NG-0.7.3, was written to
    be more modular, enabling the user community to assist in adding new features
    and submitting patches. By default, Etter installs into the /usr/sbin directory,
    and has a block size of 362112. It was designed to be a sniffer, and specializes
    in Man-in-the-Middle (MITM) attacks. It boasts being able to sniff live connections,
    content filtering on the fly, and many other tricks of the trade.


    If you are working a case and happen to come across Ettercap, you can pretty much
    assume something not great so great is being planned or is already happening.
    Unfortunately, applying the application installed is all you are going to get
    in terms of “evidence.” Since it can sniff traffic in effect promiscuous or nonpromiscuous
    modes, you may or not be able to tell if it’s doing anything. Apart from being
    a very capable and configurable sniffer, the self-proclaimed “most relevant” features
    of Ettercap are SSH support, Secure Sockets Layer (SSL) support, Charter injection,
    packet filtering/dropping, traffic sniffing via tunnels


