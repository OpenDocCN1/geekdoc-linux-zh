  md: '# Chapter 4 • Initial Triage and Live Response: Data Analysis


    on the CPU and the time that has elapsed since the program was launched, since
    most programs spend a great deal of time waiting for other stuff to happen before
    they actually need time on the CPU.


    The command column in this example simply shows a single word, “pidgin.” This
    can mean one of twos. Either the binary is in your user path, or I launched it
    from a graphical user interface (GUI). Either the case, is the latter. Had I ran
    the binary from the command line using the full path, the entry in the “COMMAND”
    column would read /usr/bin/pidgin.


    The process state code, shown as “stat,” is not something you will likely use
    during an investigation. The codes show what the process is currently in, or at
    least the time you issued the command. The codes are:


    +   - D Uninterruptible sleep (usually IO)

    - R Running or runnable (on run queue)

    - S Interruptible sleep (waiting for an event to complete)

    - T Stopped, by a job control signal or because it is being traced

    - W Paging (not valid since the 2.6.xx kernel)

    - X Dead (should never be seen)

    - Z Defunct (“z”) process, terminated but not reaped by its parent


    For BSD formats and when the stat keyword is used, additional characters may be
    displayed:


    +   - < high-priority (not nice to other users)

    - N low-priority (nice to other users)

    - L has pages locked into memory (for real-time and custom IO)

    - s is a session leader

    - I is multi-threaded (using CLONE_THREAD, like NPTL pthreads)

    - + is in the foreground process group


    The “top” command shows exactly what you think it would show, the running processes
    that are using the most CPU. (See Figure 4.12.)'
