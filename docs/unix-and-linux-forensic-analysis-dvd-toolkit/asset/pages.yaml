    root:$xGSGAI2:$jWMNlOc2Hft1BDveRqw3i::13977:99999:7::

    bin::!13826:0:99999:7::

    gdm::!13826:0:99999:7::

    user::$xS1EcULjrGL2PGmD7ia61kIdrTV::13978:99999:7::

    ```


    Again, the fields are as follows:


    +   * Username

    * Encrypted password

    * Number of days since the epoch (1 Jan 1970) that the password was changed

    * Minimum days between password changes

    * Maximum time password is valid

    * Number of days prior to expiration to warn users

    * Absolute expiration date

    * Reserved for future use


    You may have noticed that the daemon accounts “bin” and “gdm” don’t have an encrypted
    password. As these are not interactive accounts, a null or invalid password field
    prevents them from logging in. Any non-user accounts that have encrypted password
    fields should be investigated.


