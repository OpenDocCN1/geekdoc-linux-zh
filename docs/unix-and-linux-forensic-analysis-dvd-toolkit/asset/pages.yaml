- pgno: 186
  md: '# Modified System Files


    Identifying system files that have been modified since they were installed by
    your package manager, isn’t difficult. For RPM–based systems:

    ...


    ```

    rpm -V -a

    ```


    And for .deb systems, you can use desums³:


    ```

    desums -ca

    ```


    A couple of caveats are needed here. First, the fact that a particular file has
    been modified doesn’t necessarily indicate a compromise, especially if it is a
    configuration file, as these are likely to modify the system. The second, absence
    of modification does not mean a system should be given a clean bill of health.
    On a live, compromised system, an attacker may have modified the command you are
    running, the database it is reading from, or the kernel itself. These commands
    provide you pieces of data that you’ll need to put together to form the large
    picture.


    # Out-of-Place inodes


    This is a somewhat esoteric trick, but it can be used effectively in some scenarios.
    In findings first described (to my knowledge) in “Forensic Discovery,” Farmer,
    Venema, the authors noted that inodes are typically allocated in sections, and
    that outlying inodes may be used to find replaced binaries, and trace them back
    to their creation location. You can find the node number of a file using the -i
    flag to is:


    ```

    [root@localhost /bin]# ls -l -fi


    127803 -rwxr-xr-x 1 root root 61 2007-08-28 20:43 gunzip

    127802 -rwxr-xr-x 1 root root 7316 2007-10-04 22:45 dbus-uiddgen

    127976 -rwxr-xr-x 1 root root 18476 2007-10-30 12:52 env

    128058 -rwxr-xr-x 1 root root 50306 2007-10-30 12:52 chown

    164019 -rwxr-xr-x 1 root root 99564 2007-10-30 12:52 ls

    127988 -rwxr-xr-x 1 root root 19200 2007-10-30 12:52 basename

    128034 -rwxr-xr-x 1 root root 19804 2007-10-29 03:41 alsaunmute

    128027 -rwxr-xr-x 1 root root 52044 2007-10-05 11:15 sed

    128030 -rwxr-xr-x 1 root root 84780 2007-10-17 06:30 loadkeys

    ```


    > ³ www.opensourcemanuals.org/manual/desums/'
