- pgno: 202
  md: '# Introduction


    Once an attack has occurred or a system or network has been compromised, it’s
    essential to be able to sift through the evidence of what’s happened. From a technical
    information technology (IT) perspective, this means how to find, recognize, and
    locate the visible evidence of a cybercrime. From a law enforcement perspective,
    this means knowing how to handle such evidence to make sure it is admissible in
    court if necessary. However, these roles overlap somewhat. A good investigator
    also needs to know the technicalities of where and how evidence can be located,
    to properly put together the offense report and help the prosecutor formulate
    questions for witnesses. Likewise, the IT professional needs an understanding
    of how evidence must be treated to preserve its integrity in the eyes of the law.


    In this Appendix, we focus primarily on the former activity; we introduce various
    sources and potential types of evidence that investigators gather to provide evidence
    of attempts to perpetrate cyberimes. In some cases, this evidence may be collected
    whether the attempted crime succeeds or fails; in other cases, such evidence may
    be available only as a byproduct of a successful attack.


    To some extent, computers and other network devices are capable of recording information
    about activity that occurs within or passes through them. When evidence of cybercrime
    is needed, this kind of data can be an essential element in making a decision
    to prosecute the people responsible. But with so many other aspects of system
    and network security, it’s necessary to understand the underlying technologies
    and software that must be put to work to make it possible to produce such evidence.
    It’s also necessary to understand what this evidence looks like, how it may be
    interpreted, and what kinds of telltale signs or data to look for that could not
    only help document that a cybercrime was committed, but also help identify the
    responsible party or parties and prove to the satisfaction of a jury that they
    did.


    A lack of diligence in protecting IT assets and information is very often involved
    in exposing companies and organizations to loss or harm. This loss or harm may
    occur as a result of either an insider attack (from an employee, consultant, or
    other person) or an attack mounted from outside the network boundary. We’ve also
    mentioned that there is no such thing as perfect security, so it’s also necessary
    to concede that even a remote chance of successful attack, penetration, or compromise
    means that it’s necessary to be able to monitor, detect, and react to security
    incidents if and when they occur.'
  merge: -1
  img_proc: true
- pgno: 203
  md: '# Implementing Cybercrime Detection Techniques on Windows and *nix Appendix
    A 197


    Thus, an important part of the due diligence necessary in dealing with security
    matters is to be ready to perform subsequent analysis and investigations to determine
    causes and to identify perpetrators whenever possible. Whether or not an organization
    decides to prosecute a security incident is almost beside the point. The organization
    and its IT professionals, the real value of understanding how to gather and interpret
    evidence of cybercrimes comes from the ability to improve or harden security after
    the fact, to prevent any recurrence of the attacks or circumstances that permitted
    such crimes to occur in the first place.


    Even if the company or organization never decides to pursue legal remedies for
    attempted or successful attacks, the ability to gather, interpret, and respond
    to the information inherent in the tracks and traces of such events is an essential
    part of a proper security regime. Finally, it’s important to realize that maintaining
    proper system and network security requires active checks on how security policy
    is implemented and how well it’s working to determine potential or actual vulnerabilities.


    Think of this as a “how are we doing?” kind of check, security-wise, that acts
    not only to make sure whatever security controls have been implemented match what
    a security policy requires, but also to repeatedly assess vulnerabilities to new
    security exploits and attack techniques as they occur. This is not unlike the
    continuous training and preparation for a violent confrontation that most police
    officers undergo on a regular basis. Even if there is no reason to expect violence,
    officers are always prepared for a situation to turn bad, and during and after
    any contact related to a call, officers are constantly monitoring the situation.
    Likewise, a savvy security professional knows that she or must check the status
    of the network on a regular basis, if only to be nothing untooward or unexpected
    is in progress or already happened. This empirical form of assessing security
    posture is a key ingredient in maintaining strong security at all times and is
    the first step in incident response.


    # Security Auditing and Log Files


    An important concept in system and network security is what’s often called the
    AAA, or “triple-A” model of security. In this case, the acronym is subject to
    several interpretations, including:


    +   - Administration, authorization, and authentication


    +   - Authentication, authorization, and accounting'
  merge: -1
  img_proc: true
- pgno: 204
  md: '# Appendix A • Implementing Cybercrime Detection Techniques on Windows and
    *nix


    Although both expansions of the acronym are pretty widespread, the second is the
    one that we use in this Appendix.


    The idea behind AAA is that strong security rests on a three-legged foundation
    in which:


    +   - *Authentication* ensures that users, processes, and services that consume
    system resources or access their contents provide sufficient proof of identity
    to enter systems and networks before any requests may be issued.

    - *Authorization* (sometimes also called *access control*) ensures that requests
    for resources will not be granted unless requesters have the permissions necessary
    not only to read or otherwise inspect the contents of the resources they want
    to access, but also that they have explicit permissions to perform the kind of
    operation they seek to perform on the resource. Some individuals may be granted
    read-only access to information which they have no permissions to make changes
    (or to delete such information altogether), whereas others may be granted the
    ability to modify or delete such information at will.

    - *Accounting* relates to monitoring and tracking system activity. Some companies
    or organizations put a monetary value on computer resources, usage, and access.
    In this situation, accounting tracks activity to access so-called “chargebacks”
    for use of computer or network services based on actual consumption. From a security
    standpoint, the other form of monitoring or tracking under the general heading
    of accounting is called *auditing*. As in its formal naming in financial accounting,
    auditing means tracking access and use of resources—in this case, communication
    links, systems, networks, and related resources, so that activity may be logged.
    This auditing deposits tangible data into various kinds of computerized records
    so that they may be analyzed for all purposes after the fact. Such logs provide
    a key source of evidence in detecting and analyzing cybercrimes, whether only
    attempted or successfully completed.


    Note that both authentication and authorization put various kinds of barriers
    or checks between users (consumers) and the resources they seek to utilize. Only
    accounting tracks what actually happens on the networks and systems it monitors.
    Thus, accounting—or, more properly, auditing—is the essential activity that closes
    the loop between what is supposed to happen from a security standpoint and'
  merge: -1
  img_proc: true
- pgno: 205
  md: '# Implementing Cybercrime Detection Techniques on Windows *nix • Appendix A
    19


    what actually occurs on the systems and networks to which authentication and authorization
    controls apply.


    Auditing is a capability that''s built into most computer operating systems and
    network devices. But because creating audit trails means generating files in activity
    records may be stored, auditing is generally viewed as a discretionary form of
    tracking and monitoring, rather than something to be applied to all user activity
    and resource access across the board. A general principle to apply when deciding
    whether to audit certain kinds of activity or access to specific resources is
    based on a careful assessment of the risks involved. In other words, it is to
    audit for potentially harmful or dangerous activities and for access to sensitive
    files and other resources. But it''s also important to recognize that auditing
    everything is just as impractical as auditing nothing. These general exhortations
    will make more sense if we look at how certain operating systems handle auditing
    and what kinds of activities and accesses they can track and monitor. Following
    that discussion, we can generalize further about auditing and the trails auditing
    leaves behind (usually called logs or log files) with a little more specificity
    and precision.


    # Auditing for Windows Platforms


    Starting with the earliest versions of Windows NT, all installations of the Windows
    operating systems (with the exception of Windows 9x/Me) maintain three audit logs
    to track user and system activity. You can view these logs through the built-in
    Event Viewer utility:


    +   **Application log** Shows messages, status information, and events reported
    from applications and nonsensical services on the Windows computer. (Note that
    some system services write to this log rather than to the System log)

    **System log** Records errors, warnings, and information events generated by the
    Windows operating system itself and related core system services.

    **Security log** Displays success and failure records from audited activities.
    When you enable auditing and set specific auditing policies or settings in Windows,
    this is the log in which such items appear.


    The last log is, of course, the one that is most obviously important for our purposes,
    although investigators should not ignore the other two. Relevant information,
    such as the starting or stopping of a service or abnormal behavior of an application,
    can be obtained from the Application and System logs as well.


    ![](img/fd8e85097b37559dbc07dc22fd8cb1fe_205_0.png)'
  merge: -1
  img_proc: true
- pgno: 206
  md: '# Appendix A • Implementing Cybercrime Detection Techniques on Windows and
    *nix


    # Note


    Other logs may appear in the Event Viewer in addition to the standard Application,
    System, and Security logs, if certain services are running (such as Active Directory
    and domain name system [DNS] server services).


    Launching the Event Viewer varies by platform, but you can usually find under
    the Administrative Tools menu, as in Windows NT and 2000, or through the Microsoft
    Management Console (MMC) in Windows 2000, XP, and Vista, Windows Server 2003,
    and Windows Server 2008. The Event Viewer is a starting point when investigating
    abnormal or unusual system activity and for monitoring system activity in general.


    In Windows, Group Policy Objects, or GPOs, control the level of auditing performed
    by the operating system. Someone logged on an account with administrative-level
    permissions can enable auditing or establish audit policies. By enabling auditing,
    you simply create a GPO and configure it to monitor success and failure for one
    or more classes of defined events. As shown in Figure A.1, by using the Local
    Security Settings, you can edit the Audit Policy of the computer. In looking at
    this figure, you''ll notice that by default, the audit policies are disabled,
    meaning that if you initially viewed the Security Log in the Event Viewer, it
    would be empty. To enable the policy, you would double-click on the event(s) you
    wanted to audit, and choose which to audit the success or failure of that event.


    # Figure A.1 Audit Policy on a Windows XP Computer


    ![](img/fd8e85097b37559dbc07dc22fd8cb1fe_206_0.png)'
  merge: -1
  img_proc: true
- pgno: 207
  md: '# Implementing Cybercrime Detection Techniques on Windows and *nix Appendix
    A 20


    Previous to Windows Vista and Windows Server 2008, nine classes of events or activities
    could be audited:


    +   **Account logon events** Use this to monitor user logon activity.


    +   **Account management** Use this to monitor administrative account management
    activities (creating, deleting, disabling, or changing account settings).


    +   **Directory service access** Use this to monitor use of Active Directory services
    and objects.


    +   **Logon events** Use this to monitor all logon events for system accounts,
    and user accounts (a superset of logon events, in other words).


    +   **Object access** Use this to enable auditing of individual files, folders,
    printers, or other computer resources (which must also be configured for auditing
    individually and separately).


    +   **Policy change** Use this to monitor GPO creation, deletion, or modification.
    This tracks important administrative activities on Windows systems.


    +   **Privilege use** Use this to monitor use of user and administrative privileges
    on a Windows system. This also tracks important administrative activities on Windows
    systems, as well as object owner/creator and use of privileges.


    +   **Process tracking** Use this to monitor process creation, threads, and deletion.
    This is seldom used for security purposes (but may sometimes be helpful).


    +   **System events** Use this to monitor operating system activities. This is
    also used for security purposes.


    In Windows Vista and Windows Server 2008, the number of audit policies increased
    from nine to 50. Each of the original nine has subcategories that allow you to
    audit events on a more granular level. Table A.1 lists the policies and their
    subcategories.'
  merge: -1
