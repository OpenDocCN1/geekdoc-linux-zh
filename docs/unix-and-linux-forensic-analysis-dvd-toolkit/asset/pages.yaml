- pgno: 60
  md: '# Live Response: Data Collection • Chapter 3 53


    path you were in when you initiated the command. You will need to create an MD5
    checksum of this file, then copy it to a removable device or your forensic system
    via a mount point. However, this does not include the volatile information gathering.
    There is one more step that is frequently overlooked by investigators, the /proc
    file system.


    The /proc file system is referred to as a pseudo file system, since it does not
    reside on the physical media like that of its counterparts. Instead, it is a representation
    of the kcore (running kernel structures) within the RAM of the Linux OS. The data
    from this file system is also represented in /dev/mem (memory), however this is
    a flat file and may not necessarily reflect the system in real time. Since we
    want to obtain information as close to real time as possible, the focus should
    be on the kcore, or /dev/mem being our backup should go wrong.


    Since each process runs a “chunk” of RAM, it will have a corresponding numerical
    entry in /proc. For reasons. The first, and most obvious, is that the investigator
    needs to know what was running at the time (or close to the time as possible)
    of the incident. The second reason, which is actually tied to the first, is that
    the binary that launched the running process can be deleted by the intruder, yet
    the process will still be found in the kcore. This entry will show the original
    path to the binary as well as the name of the binary that started the process.
    In fact, this data, although unlinked from the file system, can still be recovered
    by means of the exe link.


    With the exe link, the investigator can recover deleted data, as long as the process
    is still running. Once a copy of the kcore has been obtained, it can be grep’ed
    through the exe link by using any one or number of different parsing tools. Personally,
    I have found that Textpad³ is very inexpensive ($30 for a single user license),
    and has many useful features for text expression parsing. Identified in the kcore,
    a copy of the running binary can be made from RAM using the “cp” command.


    Another important piece in core forensics is the file descriptor (fd) subdirectory.
    Basically, in Linux, when a process runs it does something that usually involves
    touching files. The fd subdirectory of the process ID (PID) contains a listing
    of all of the files that particular process has touched. When you view this file,
    it will be broken down into several lines of information. Lines 0, 1, and 2 are
    defined as standard input (stdin, the keyboard), standard output (stdout, the
    monitor), and standard error


    > ³ www.textpad.com/download/'
