- pgno: 185
  md: "higher-than-normal privilege, however:setUID andsetGID executables. These are\n\
    executables that have the SUID or GUID bit set. When executed, rather than running\n\
    with the privileges of the user that launched the program, run with the privileges\
    \ of\nt user or group that owns the file. Generally, SUID/SGID root executables\
    \ are\nt most worrisome, but depending on the environment you are working in,\
    \ other users\nor groups may be of concern as well. A security vulnerability or\
    \ misconfiguration in a\nSUID/SGID executable can lead to an elevation of privileges\
    \ on the local system.\nLocating these files is very important.\n\nThe “find”\
    \ command is your best friend when you need to quickly locate files\nbase on very\
    \ specific criteria.\n\n```\nfind / -perm -4000 -type f -xdev -print > suid.txt\n\
    find / -perm -2000 -type f -xdev -print > sgid.txt\n```\n\nThese commands will\
    \ begin at the system root (/) and find all files with\npermissions (-perm) of\
    \ 4000 or 2000 (setUID and setGID, respectively) that are nor-\nal files (-type\
    \ f) and print their full to standard output, which is redirected\nto the names.\
    \ We specify normal files to exclude block devices, characters devices,\nsockets,\
    \ and other similar items. The -xdev flag ensures that find won't descend into\n\
    directories you may search, on file systems such as NFS/SMB mounts, mounted CD/DVDs,\
    \ and\nany external storage you may have mounted. Unfortunately, this will also\
    \ prevent\nfrom descending into directories you may want to search, for example,\
    \ a system that\nhas/var /tmp on separate partitions /. In this case, you may\
    \ want to\nsubstitute “-fype np” for -xdev. For more options, check the file man\
    \ page.\n\n# Recently Modified/Accessed/Created Files\n\nIf you have suspected\
    \ some time frame for a compromise may have occurred, you\n easily look for all\
    \ files modified, accessed, or created around or since that date.\nFor example,\
    \ if a system administrator noticed unauthorized outbound IRC connec-\nbeginning\
    \ five days ago, you could do the following:\n\n```\nfind / -mtime 5 -xdev > modified.txt\n\
    find / -atime 5 -xdev > accessed.txt\nfind / -ctime 5 -xdev > created.txt\n```\n\
    \nWhile it is certainly trivial to modify the timestamp of a file on a Linux system\n\
    using the (“touch” command), this is another place where attackers sometimes simply\n\
    do make the effort. The output of these files may be a little noisy, but they\n\
    should provide a starting point."
