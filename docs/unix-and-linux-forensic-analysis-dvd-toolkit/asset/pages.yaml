    # Commercial Intrusion Detection Systems


    Earlier, we mentioned that firewalls and other simple boundary devices lack some
    degree of intelligence when it comes to observing, recognizing, and identifying
    attack signatures that may be present in the traffic they monitor and the log
    files they collect. Without sounding critical of such systems'' capabilities,
    this deficiency explains why intrusion detection systems (often abbreviated as
    IDSes) are becoming increasingly important in helping to maintain proper network
    security. Whereas other'
