- pgno: 231
  md: '# Implementing Cybercrime Detection Techniques on Windows and *nix Appendix
    A 225


    or they may be unwitting participants in activities that originate elsewhere.
    That’s why antispoofing techniques are important components when configuring firewalls,
    screening routers, and so to avoid potential attack and why investigators must
    be prepared to follow trails of attack further, rather than rely on what the initial
    available evidence reveals.


    Some companies and organizations may choose to expose deliberate lures to attackers—sometimes
    known as honeypots (for individual systems that act as lures) or honeynets (for
    entire networks that act as lures)—as a way of attracting their attention, then
    distract them long enough to increase the odds of identifying the perpetrators
    involved. Although this strategy does incur some additional risks (much like those
    associated with what insurance professionals call “attractive nuisance” or what
    law enforcement professionals can readily identify as “sting operations”), when
    properly implemented and practiced, it can produce definite, usable results.


    In the final analysis, the proper practice of security includes planning for potential
    intrusion or compromise, with attendant tools and settings in place to give evidence
    of the existence and operation of illicit or unwanted activities. Because such
    evidence is essential to detecting cyberimes, preventing recurrence, and enabling
    successful prosecution, it’s a key element of any security policy. This also explains
    why tracking and monitoring represents an essential “reality check” to make sure
    security is working properly and to be able to deal with unforeseen attacks or
    vulnerabilities if and when they occur.'
  merge: -1
