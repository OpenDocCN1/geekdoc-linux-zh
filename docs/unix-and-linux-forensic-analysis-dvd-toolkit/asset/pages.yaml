- pgno: 126
  md: '# The Hacking Top 10 • Chapter 5


    Unlike nmap and Nessus, Wireshark does not enumerate information from a host.
    It simply picks up TCP packets, and displays specific information to the user.
    As we saw in our previous example with nmap, I used Wireshark to show me the traffic
    generated by a nmap OS and version scan.


    # Figure 5.9 Output from Nmap Scan


    ![](img/fd8e85097b37559dbc07dc22fd8cb1fe_126_0.png)


    Figure 5.9 shows the output from the nmap scan broken down nearly by time (note
    the default here is in seconds), source IP address, destination IP address, protocol,
    and info that includes source port, destination port, any flags that have been
    seen, and sequence number. Unless you know what you are looking for, this information
    can seem like a bunch of garbage. However, with something specific in mind this
    can be very useful in helping the user to determine what is happening on the customer
    wire.'
