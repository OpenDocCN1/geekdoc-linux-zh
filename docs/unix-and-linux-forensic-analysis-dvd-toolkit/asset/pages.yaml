- pgno: 179
  md: 'As you can see there are numerous places an intruder can set up a script to
    help maintain access to a compromised system. Careful review of all the scripts
    involved in the boot process is mandatory in such a scenario.


    # System and Security Configuration Files


    There are many system configuration files that can provide you with more information
    about the state of the current running system (if performing live response), or
    the state of the system last time booted (performing a post-mortem analysis).
    Each service that runs on the system will likely have at least one (and probably
    several) configuration files that affect its operation. Providing an in-depth
    examination of every configuration file even on a stripped down Linux system is
    out of the scope of this work; however, we will go into the location and function
    of some of the more relevant and important system and security configuration files.


    # Users, Groups, and Privileges


    One of the first things you will likely want to know about a suspect is "Who has
    access to this machine?" /etc/passwd will tell you:


    ```

    root:x:0:0:root:/bin/bash

    bin:x:1:1:bin:/sbin/nologin

    demon:x:2:2:daemon:/sbin/nologin

    admin:x:3:4:admin:/var/adm:/sbin/nologin

    lp:x:4:7:lp:/var/spool/lpd:/sbin/nologin

    sync:x:5:0:sync:/bin/sync

    down:x:6:0:shutdown:/sbin/sbin/shutdown

    halt:x:7:0:halt:/sbin/halt

    mail:x:8:12:mail:/var/spool/mail:/sbin/nologin

    news:x:9:13:news:/etc/news

    uuc:x:10:14:uuc:/var/spool/uuc:/sbin/nologin

    operator:x:11:0:operator:/root:/sbin/nologin

    games:x:12:100:games:/user/games:/sbin/nologin

    gopher:x:13:30:gopher:/var/gopher:/sbin/nologin

    ftp:x:14:50:FTP User:/var/ftp:/sbin/nologin

    nobody:x:99:99:Nobody:/sbin/nologin

    vcsa:x:69:69:virtual console memory owner:/dev:/sbin/nologin

    rpc:x:32:32:rpcbind:/var/lib/rpcbind:/sbin/nologin

    nnscd:x:28:28:NSCD Daemon:/sbin/nologin

    tcpcdump:x:72:72::/sbin/nologin

    dbus:x:81:81:System message bus::/sbin/nologin

    ```'
