    TCP wrappers back in 1999, no reports of an actual compromise were ever made.
    This is not to say that it cannot ever happen, but Linux folks are of a different
    breed, and security is definitely at the forefront of their collective minds.


    # Storms on the Horizon


    In April 2007, renowned security expert Eugene Kaspersky stated that there will
    be “a significant rise in virus attacks on both the Mac and open source platforms.”
    He attributes his prediction to the less public reception of Microsoft Vista,
    which he believes will drive some users to non-Windows operating systems.


    Kaspersky also states that, “Open source presents more serious problems, however.
    More people are opening open-source code, so they are more quick to find problems.
    If the people who make the fix are good guys, that’s great; if they are bad guys,
    that’s a problem.”


    How does this apply to the Linux community? Let''s assume for a moment that Kaspersky
    is 100 percent correct, and some percentage of the focus from malware coders shift
    from Windows to Linux. They will still have to contend with the built-in security
    mechanisms inherent in Linux, specifically file permissions. As long as users
    are not executing untrusted binaries as root, any piece of malware, regardless
    of who wrote it or how it gets on a system, will be limited to the account privileges
    of the infecting user. This is not debatable, it’s how the technology works. Additionally,
    there is the network of open source developers who keep a watchful eye on their
    code, and an extremely security conscious user community. All of these factors
    together provide Linux with a hedge of protected code that will never be matched
    by Windows users.


    Like Windows users, Linux users have to remain vigilant with patching their systems
    with the most current vendor release fixes, as well as ensuring that only the


