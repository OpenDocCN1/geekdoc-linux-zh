    Today, many AV packages include both signature-based and anomaly-based detection
    characteristics, but not all IDES incorporate both approaches.


    Finally, some IDES are capable of responding to attacks when they occur. This
    behavior is desirable from two points of view. For one thing, a computer system
    can track behavior and activity in real-time and respond much more quickly and
    decisely during early stages of an attack. Because automation helps hackers mount
    attacks, it stands to reason that it should also help security professionals fend
    them off as they occur. For another thing, IDES run 24/7, but network administrators
    may not be able to respond as quickly during off hours as they can during peak
    hours (even if the IDS can page them with an alarm that an attack has begun).
    By automating a response to incoming traffic from one or more addresses from which
    an attack originates, the IDS can halt an attack in process and block attacks
    from the same address.


    By implementing the following techniques, IDES can fend off expert and novice
    hackers alike. Although experts are more difficult to block entirely, these techniques
    can slow them down considerably:


    +   - Breaking TCP connections by injecting reset packets into attacker connections
    causes attacks to fall apart.


    +   - Deploying automated packet filters to block routers or firewalls for forwarding
    attack packets to servers or under attack stops most attacks cold—even DoS or
    distributed denial-of-service (DDoS) attacks. This works for attacker addresses
    and packets for protocols or services under attack (by blocking traffic at different
    layers of the Advanced Research Projects Agency [ARPA] networking model, so to
    speak).


    +   - Deploying automated disconnects for routers, firewalls, or servers can halt
    all activity when other measures fail to stop attackers (as in extreme DDoS attack
    situations, where filtering would work effectively on the Internet service provider
    [ISP] side of an Internet link, if not higher the ISP chain, as close to Internet
    backbones as possible).


    +   - Actively pursuing reverse DNS lookups or other ways of attempting to establish
    hacker identity is a technique used by some IDES, generating reports of malicious
    activity to all ISPs in the routes used between the attacker and the attackee.
    Because such responses may themselves raise legal issues, experts recommend obtaining
    legal advice before repaying hackers in kind.'
