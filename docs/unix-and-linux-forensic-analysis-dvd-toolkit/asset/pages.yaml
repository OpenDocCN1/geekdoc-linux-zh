- pgno: 144
  md: '# Figure 5.23 Viewing the Raw Response


    ![](img/fd8e85097b37559dbc07dc22fd8cb1fe_144_0.png)


    While this example may not be very exciting, it illustrates a critical point.
    Web traffic, which was never meant to be viewed by the end user through Proxy,
    is not only visible but also able to be manipulated. Any manipulation that would
    take place would be considered "normal" Web traffic, and would likely go unnoticed
    by the targeted organization.


    Forensically, there would be no footprint for the utilization of this utility
    unless modifications to the traffic were obvious. For example, a vulnerable Web
    site might have a hidden field for the price of a 50-inch high definition plasma
    television set. The price of that item may be $3500, by manipulating hidden field,
    an attacker can change the price of TV to $35. The Web server did not notice or
    care that the price was changed, as it received the request would only be noticed
    by a human on the back end of the order process (provided there was one) who knew
    that 50 HD TVs do not normally sell for $55.


    So you can see the potential danger with a tool like this. It is very powerful,
    has an easy-to-use GUI, and is practically untraceable. As an investigator, you
    would


    ![](img/fd8e85097b37559dbc07dc22fd8cb1fe_144_1.png)'
