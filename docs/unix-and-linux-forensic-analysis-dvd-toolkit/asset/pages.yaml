- pgno: 123
  md: 'Chapter 5 • The Hacking Top 10


    # Nikto


    According to the Nikto homepage,⁶ Nikto is,"an Open Source (GPL) Web server scanner
    that performs comprehensive tests against multiple items, including over 3500
    potentially dangerous files-CGIs, versions on over 900 servers, and version-specific
    problems on over 250 servers."Scan items and plug-ins are frequently updated and
    can be automatically updated (if desired). Nitko came up as #12 on the top 100
    network security tools survey.


    Nikto is not designed as an overly stealthy tool. It will test a Web server in
    the shortest time span possible, and it''s fairly obvious in log files. However,
    there is support for LibWhisker''s anti-IDS methods in case you want to give it
    a try (test your IDS system)." By default, Nikto installs to the /usr/bin directory
    and has a block size of 7199.


    Arguably, Web-based applications are the favorite target among hackers today.
    Since they are so prolific, and have so many items that need proper configuration,
    in fact, this is such a huge issue, there is an entire online community dedicated
    to the testing, configuration, and protection of Web applications testing. This
    information is available at the Open Web Application Security Project.


    In my example, I have default installation of Apache 2.8.8 running in a Fedora
    Core 8 VM image at 192.168.10.211 (Snoop6). From Snoop1, I ran a Nikto search
    against Snoop6. Nikto produced the results as seen in Figure 5.8.


    > ⁶ http://cirt.net/code/nikto.shtml


    > ⁷ www.owasp.org/index.php/Main_Page'
