  md: '# Summary


    In this chapter, you''ve hit the ground running and gotten the nickel (perhaps
    dime) tour of Linux with an eye toward your previous Windows experience. The tour
    also set the stage for what will be important in later chapters as we delve into
    the details of performing forensic analysis on and with Linux systems. We''ve
    stressed that though Linux is not a UNIX*, it, and all Unix-like (collectively,
    *nix) friends share a common design philosophy, and will feel similar once you
    get down to the shell prompt and get to work. We''ve introduced you to concepts
    that may not have been part of prior computing experience in Windows, to give
    you a learning foundation for the rest of the book, and most importantly, your
    future work in *nix forensics. Finally, we''ve tacitly implied that you will have
    to get in the mindset of searching for information on platforms and specifics
    that you aren''t an expert in, because even the *nix you''re most familiar with
    has a tendency to change and evolve quickly. The world of *nix is just too big
    for any one person to be an expert in all of them!


    With this basis, we can now turn our attention to getting to work and performing
    response on a live *nix system.'
