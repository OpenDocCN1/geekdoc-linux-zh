  md: '# Chapter 5 • The Hacking Top 10


    # Paros


    Paros is a free interactive HTTP proxy developed by Chinotec Technologies and
    comes in #16 on the top 100 network security tools survey results. Paros allows
    Web application security auditors to intercept and alter requests from a client
    Web browser to a Web server. Additionally, Paros has some automated spider and
    scanning functionalities that are very useful for Web site exploration. Chinotec
    Technologies'' sister company, Milescan, produces an improved Paros scanner Milescan
    Web Security Auditor that provides enhanced scanning and URL crawling techniques.
    Unlike Paros, however, Milescan Web Security Auditor requires a yearly subscription
    to use.


    Paros is another one of those tools, like nmap and nessus, which is intended to
    be used by security professionals and in this case, Web developers, but is also
    used by hackers to perform active reconnaissance (recon). The first step in recon
    is to perform a spider or by selecting Analyser. (See Figure 5.20).


    # Figure 5.20 Paros Spider Crawl


    ![](img/fd8e85097b37559dbc07dc22fd8cb1fe_141_0.png)'
  merge: -1
  img_proc: true
- pgno: 142
  md: '# The Hacking Top 10 • Chapter 5


    Shown in Figure 5.20 is a section of the spider results from our good friend,
    www.syngress.com. Basically, Paros will go to the selected Web site and explore
    every possible directory path to a user-defined depth (the default is 3 levels
    deep). If an attacker is going after a specific Web site, then using this function
    of Paros is a great way of finding out what the layout of the target is without
    actually having to waste the time manually clicking on every link.


    The next step in the recon process would be to scan the target for known vulnerabilities.
    This is done again the “Analyse” tab, and then scanning. Not wanting to know the
    security posture of www.syngress.com, I chose a site that is intended for usage
    of this sort, hackmebank.com. As you can see from the scan results in Figure 5.21,
    the target Web server is Lotus Domino, and some of the default files have been
    left in place. As an intruder, this information would provide you with two critical
    pieces of your attack plan puzzle, the Web server version (which would allow you
    to focus your attack), and some available default file names (which would allow
    you to test a directorial attack).


    # Figure 5.21 Targeting Lotus Domino


    ![](img/fd8e85097b37559dbc07dc22fd8cb1fe_142_0.png)


    www.syngress.com'
