    Note with Ettercap, I am able to see who is talking, from where, and what ports
    they are using. We saw in Figure 5.30 that while we were able to sniff the traffic
    from our encrypted AOL instant message session, we were not able to see what I
    was saying, or to whom. Now let''s say for the sake of argument that I am not
    using an encrypted protocol. What would the traffic look like that we were sniffing?
    You always have running unencrypted protocols like Telnet and FTP are insecure,
    because they transmit data in clear text. But how many of you have actually seen
    what clear text traffic looks like, and would be able to tell a customer definitively
    that they were vulnerable because one of these unencrypted protocols? Figure 5.33
    answers that question.


    Using Ettercap, I started the inetd service on Forensic1, and used Telnet to connect
    to it from Forensic3. The resulting connection not only showed up in my sniff,
    but the username and password that I used was there as well.'
