- pgno: 161
  md: '# Introduction


    Previous chapters have (hopefully) driven the importance of collecting volatile
    data. This chapter will help you collect the most volatile data present on a UNIX
    system—the contents of the /proc file system. You first saw /proc in Chapter 3.
    While some of the information available from /proc can be collected via other
    methods, /proc is the only place you''ll be to collect incredibly vital data.


    The /proc file system is what is known as a "pseudo" or "virtual" file system,
    non-file data represented as a hierarchical file system that doesn''t actually
    exist on disk. It was originally designed to access information, but has since
    grown to encompass other core and in-memory data. /proc was originally implemented
    in Version 8 UNIX, while most modern UNIX trace their /proc lineage to the Plan
    9 implementation. One of the benefits of the /proc file system is that it allows
    user identities to access information that would normally be restricted to kernel
    space (e.g., information about the state of memory, running processes, and active
    network connections). In fact, many of the utilities you use to collect data in
    Chapter 3, retrieve it from /proc. (See Figure 6.1.)


    # Figure 6.1 The Contents of /proc on a Typical Fedora Core 8 Linux System


    ```

    [root@localhost:/]# ls

    1701 1814 2834 2727 2777 2971 2945 418

    1687 1818 2836 2246 2675 2872 2972 425

    1684 1893 2045 2277 2885 3042 3042 465

    1160 1846 2055 2628 2879 2928 2978 425

    1185 2125 2210 2382 2819 2879 2928 466

    1393 2089 2131 2367 2463 2593 2693 511

    1359 1918 2143 2674 2885 3042 3466 523

    1390 1918 2143 2673 2762 2997 3115 531

    1595 1931 2161 2306 2516 3061 3103 503

    1743 1937 2180 2675 2858 3018 3189 58

    1750 1961 2167 2732 2857 3023 3230 61

    1755 1970 2186 2739 2857 2937 3230 62

    1771 1988 2238 2744 2839 2939 381 62

    1772 2232 2376 2776 2868 2944 408 acpi

    [root@localhost proc]# _

    ```'
