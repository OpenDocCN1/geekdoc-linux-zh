    +   * **Status of Effected Systems** This is another one of those items in which
    the customer may not really know much about. I have been involved in several cases
    in which you are told one thing, for instance that a particular system as not
    been rebooted; only to find out the exact opposite is true once you arrive on-site.
    So if you asked the questions prior to your arrival have to ask them again, and
    verify if possible. This information can affect the direction of your investigation.


    +   * **Business as Usual** As much as possible, you need to understand what “normal”
    is to the customer. When responding to an incident, you are most likely looking
    at the customer infrastructure for the first time. You will have no idea what
    their ID naming convention is, what kind of traffic they experience on an average
    day, which systems communicate with each other, or any of literally hundreds of
    variables that make up their typical day. For you to perform any sort of initial
    analysis you need to understand this as possible.


    While you need to ask as many questions regarding this subject as possible, understand
    that more questions will undoubtedly arise as the investigation progresses. Make
    sure you let the customer know you will have more questions, and you will need
    a solid point of contact (POC) that is knowledgeable enough about their technical
    and business processes to intelligently answer them.


    Once you have gathered all of the information you deem to be relevant (which will
    most assuredly change), you can begin initial analysis. The most important thing
    at this stage in the investigation is to remain neutral about the incident. Try
    not to formulate premature conclusions about the direction the data is taking.
    Simply let the data dictate the path you take.


    # Log Analysis


    In my humble opinion, the starting point for your investigation should be an analysis
    of whatever log files the customer was able to provide. This may be nothing, in
    which case you might well take some aspirin now, because a headache is rapid'
