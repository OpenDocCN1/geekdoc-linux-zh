- pgno: 105
  md: '# Summary


    Gathering the volatile data is one thing, knowing what the heck it means something
    entirely. Hopefully, you now have a decent understanding of the commands that
    we discussed in Chapter 3, what the output looks like, and why it''s important.
    Remember, each case will be different, so likewise will the information you gather.
    Be flexible (Semper Gumby!) and be smart.


    Simply gathering the data, and even understanding it is only the beginning to
    an effective analysis. Do not forget that the information you needs to be correlated.
    Compare your volatile data with the shell histories, localhost logs, network logs,
    and anything else the customer can provide you with. Never look at a single piece
    of information as the “end” of a trail, but as a piece of a larger puzzle, you
    just need to figure out where it fits in.


    The beauty of Linux is that there is always more than one way to do something
    and likely more than one thing that is keeping track of those things. If a tool
    or utility is unfamiliar to you, test it out in your lab. Find out what it does,
    how it works, and what it looks like. Often you will find that the work you do
    in the lab can make or break your case.'
  merge: -1
