- pgno: 85
  md: '# Chapter 4 • Initial Triage and Live Response: Data Analysis


    # Note


    The kcore is an extremely useful file to capture and analyze from a compromised
    Linux machine. Like the rest of the information found in /proc, kcore are virtual
    files created by the kernel to provide the user with valuable information about
    the running system, and is the exact size as available memory. Think of the kcore
    as the physical, tangible files (sort of) that directly correlate to what the
    system is doing in memory (but remember, they are not “real”, they are virtual).
    If you try to “cat” kcore, the system will display a bunch of seemingly useless
    garble with some recognizable characters thrown every so often. For the purposes
    of forensic analysis, make sure to use the “strings” command, which will only
    display printable characters.


    ```

    strings /proc/kcore -t d > /tmp/kcore_outfile

    ```


    In this particular command, I have chosen to use the “-t” and “-d” switches. The
    “-t” option will print the offset at the front of each line, while the “-d” will
    put those offset numbers in decimal format (called the radix). You can get the
    full listing of options available this (and any other command for that matter)
    from the man page.


    Now that I have strings output from kcore, I can perform keyword searches to see
    if any nefarious processes are running on the system. In Figure 4.2, I grep’ed
    for my username, “cepogue” and piped the output through more. The result is every
    occurrence of my username that is currently loaded into memory. Since this is
    my machine, obviously there are going to be quite a large number of hits from
    my search. Hopefully, on the system that is being investigated, this will not
    be the case.'
