  md: '# Chapter 3 • Live Response: Data Collection


    # ProDiscover


    A clean and simple tool, ProDiscover is a GUI-based system much like FTK Imager.
    To acquire an image using ProDiscover, simply click on the button labeled “Capture
    Image” and a pop-up window will appear. In the window select your source or suspect
    drive or destination or target drive. Next, select the image format. This can
    either be a ProDiscover proprietary format, or a dformat. As with FTK, best practice
    indicates using the dd format in the event that the investigator is going to use
    another tool to actually perform the forensic analysis. Next, enter the desired
    name under “Technician Name,” and assign the image “Image Number.” Remember to
    use something that can be easily understood and differentiated from other similar
    images, should be a need to take multiple images. Compression can be either used
    or not, as it generally does not affect the image in any way other than its physical
    size. If the investigator is following the “Rule of Size,” then compression should
    not be necessary. Remember compression will slow down the imaging process considerably.
    There is also the option to protect the image. This is a useful option and one
    that is unique to ProDiscover. It is up to the investigator whether not to use
    a password, it does not affect the functionality of the image. Ensure that the
    password is written down Taking a successful image only to forget that the password
    would be not only embarrassing for the analyst, but would require the image to
    be taken again. In a case involving sensitive materials, the time needed to acquire
    a second image could cost the customer. In a case involving travel, the forensic
    organization would more than likely have to cover the cost of travel to acquire
    the second image. There is also space for a brief description of the image. This
    is useful if multiple images are being acquired from the same system, or from
    a RAID configuration.


    ProDiscover is a clean and simple tool. Image acquisition is boiled down to very
    basic steps, and allows very little room for analyst error. Since it is a Windows
    tool only, it would have to be from a forensic laptop to the Linux drives mounted
    with a Samba mount point over a cross-cable cable. This can be a tricky process,
