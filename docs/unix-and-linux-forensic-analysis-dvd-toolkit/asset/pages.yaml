    # Auditing for UNIX and Linux Platforms


    Every different distribution and version of UNIX and Linux logs critical audit
    information in its own way and stores the resultant log files in particular locations
    using specific platform–default formats. Nevertheless, most UNIX and Linux operating
    systems support extensive logging capabilities and share numerous common features.


    The Syslog daemon (syslogd) is a clearinghouse for all kinds of log information
    on UNIX and Linux systems. The daemon is a process that directs different system
    messages to log different files, depending on the type of message and how urgent
    severe it is. For example, on a FreeBSD system, successful and failed File Transfer
    Protocol (FTP) logons are shown in the ftp.log file, information about access
    to Apache Web sites is stored in access_log, and information about failed logons
    resides in secure.log.


    Most networks that incorporate UNIX or Linux systems also set up special network
    drives to record logging data, so it can all reside in a single centralized location.
    In addition, the Syslog daemon receives event data from various operating system
    and user applications (listed in Table A.2); it also stores all log data using
