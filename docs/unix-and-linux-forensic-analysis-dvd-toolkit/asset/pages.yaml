- pgno: 173
  md: 'Chapter 6 • The /Proc File System


    # sysfs


    I felt this chapter would be incomplete without a quick look at the sysfs file
    system introduced in the 2.6 kernel. Earlier in the chapter, I mentioned that
    the original purpose of /proc was to provide a meaningful interface to about processes,
    and over the years more and more non-process data had its under the /proc hierarchy.
    Sysfs aims to move this non-process data out, into a separate virtual system mounted
    on /sys. Let''s take a quick look at some of the relevant data we can find in
    sysfs.


    The two subdirectories under /sys most likely to be of relevance to an incident
    response investigation are “modules” and “block.”


    # modules


    ```

    [root@localhost]# ls

    drwx-xr-x 3 root root 2008-04-13 23:29 8250

    drwx-xr-x 5 root root 2008-04-13 23:29 ac

    drwx-xr-x 5 root root 2008-04-13 23:29 ac97_bus

    drwx-xr-x 3 root root 2008-04-13 23:29 acpi

    drwx-xr-x 2 root root 2008-04-13 23:29 aerdriver

    drwx-xr-x 3 root root 2008-04-13 23:29 amd64_agp

    drwx-xr-x 3 root root 2008-04-13 23:29 apm

    drwx-xr-x 6 root root 2008-04-13 23:29 ata_piix

    drwx-xr-x 3 root root 2008-04-13 23:29 atkbd

    drwx-xr-x 5 root root 2008-04-13 23:29 autofs4

    ...

    ```


    /sys/modules contains a subdirectory for every module in the running kernel. This
    list should be more extensive than the output of the “lsmod” command, since entries
    are populated for modules that are statically attached into the kernel, or your
    dynamically loaded kernel module. This can give you a better idea about the capabilities
    of the kernel you are working with, particularly if it is a custom or otherwise
    unfamiliar kernel.


    # block


