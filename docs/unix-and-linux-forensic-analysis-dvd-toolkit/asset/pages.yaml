- pgno: 20
  md: '# Chapter 2 • Understanding Unix


    And, for historical perspective, the legacies of these are still alive and well:


    +   - UNIX System V ("System 5") aka SVR5, from AT&T, later to become SCO UnixWare.

    - Berkeley Software Distribution (BSD) UNIX, alive and well in many variants.


    After spending some quality time at *nix shell prompt, window will become akin
    to obscurity: you''ll know it when you see it! I''m happy to report that these
    *nix friends are all quite elite in their design and are far from obscene. We''ll
    also do our best to keep you from uttering too many obscities as you get introduced
    to *nix.


    # Linux Distributions


    Like in discussions of *nix where many players are at the table, even Linux itself
    has a rich array of choices, for better or worse. Linux is available in a variety
    of different flavors that express the rich diversity of people who are using the
    operating system, and who are taking advantage of its open source nature to tweak
    and create a Linux that solves problems in their own way.


    Some of the common Linux distributions include: Ubuntu (our choice for this),
    Red Hat Enterprise (RHEL), Fedora, SUSE Linux Enterprise (Novell), OpenSUSE, Gentoo,
    Debian, Mandriva, and hundreds others. If you want to keep an eye on free open
    source distributions, you can drop your jaw at your first visit to http://distrowatch.com/.


    All distributions implement the Linux kernel, and at the command prompt you''ll
    experience similar things in all of them. Where distributions differ from one
    another is in the realm of what software is included in a default installation,
    how software packages are added to the system, what window manager user interface
    (GUI) (if any) is used by default, and the release philosophy when it comes to
    stable updates.


    For forensic work, it''s useful to be aware that there are different flavors,
    and that the location of program, log, and configuration files vary from one Linux
    distribution to another. The mantra of“there’s more than one way to do it” is
    alive and well in Linux.


    # Get a Linux!


    Time to get the fingers to the keyboard! There''s no need to be paralyzed by all
    the choices—just get a copy of Ubuntu Linux. Ubuntu has rocked to popularity,
    because it''s the easiest installations to install, and because its installation
    CD is also what''s called a “Live CD”—you don''t even have to install it to try
    it out.


