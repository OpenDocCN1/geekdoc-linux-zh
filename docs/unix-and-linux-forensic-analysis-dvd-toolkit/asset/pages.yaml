- pgno: 229
  md: '# Summary


    Why is cybercrime detection important to investigators? Only by detecting that
    cyberimes have occurred (or are occurring) will investigators be able to get a
    step ahead of the criminals and start the investigation while the trail is still
    “hot.” Furthermore, only when suspicious activity is detected or observed investigators
    know what the steps necessary to obtain, secure, and prepare the evidence that
    will be necessary if any kind of legal charges are to stick. By following attack
    traffic from its targets back to its sources—even if those sources point only
    to victims and not to the real attacker, as may be the case—investigators can
    work with intermediate service providers to inform them about attacks and to help
    administrators and security personnel prevent such attacks from recurring. Even
    when prosecution is not possible, or when those who have been attacked decide
    not to pursue legal remedies, the information obtained and shared during the investigation
    can still have an overall positive impact on the security posture and awareness
    of the various parties investigators in the process.


    One key in obtaining evidence of cybercrimes may be found by enabling auditing
    of suspicious events in the boundary devices and operating systems that are likely
    to be subject to attack. IT professionals should understand how to instruct these
    systems and devices to log data and should be aware of what kinds and classes
    of events are most worth logging. These events include log attempts, access to
    sensitive resources, use of administrative privileges, and monitoring of key system
    and data files. Likewise, law enforcement professionals should be aware not only
    that these logs exist, but also that they provide the most salient evidence of
    attempted or successful cybercrimes, and they must be aware of how to make appropriate
    efforts to secure and protect these logs before and during the investigation.
    Firewalls, routers, proxy servers, network servers, and IDSes can all contribute
    logs (plus related reports, alerts, and alerts) to substantiate allegations that
    unauthorized access, alteration, destruction, or denial of service occurred for
    information assets and services and, in some cases, to track back the origin of
    the activity.


    In the security model known as triple-A (authentication, authorization, and accounting),
    accounting is what makes auditing and logging of suspicious or illicit activity
    possible. IT and law enforcement professionals alike must understand this concept.
    Administrators must practice proper auditing and logging techniques to make sure
    they can detect cybercrimes (preferably before they succeed at compromising or
    damaging an organization’s IT assets or infrastructure), obtain evidence that
    can help'
  merge: -1
  img_proc: true
- pgno: 230
  md: '# 224 Appendix A • Implementing Cybercrime Detection Techniques on Windows
    and *nix


    document illicit or unwanted activity, and assist in identifying the parties involved.

    Note that boundary devices, Windows, and UNIX/Linux systems all have their own
    methods for enabling and recording such data, but that evidence is readily obtainable
    to those who know what to ask for and where to find they seek.


    On the proactive, preventive system of network security, boundary systems and
    servers must be configured to prevent or deflect common attacks attacks while
    auditing and logging any evidence that related activities are occurring. Log data
    usually includes timestamps, putative source addresses and domain names, and other
    information that can be used to trace attacks to their systems of origin. E-mail
    messages include similar information so that unwanted e-mail can be traced back
    through the systems that forwarded it from its sender to its ultimate receiver.
    All too often, however, such trails lead only to additional victims or to unwitting
    participants in cybercrimes rather than to the actual perpetrators.


    When tracing the origin of cybercrimes and the paths their point of attack, investigators
    will find numerous tools and utilities in obtaining information. Firewalls, screening
    routers, and IDSes can often seek out and obtain such information automatically,
    and numerous Windows and Linux or UNIX tools also exist to reacquire or confirm
    such information manually. Both IT and law enforcement professionals should understand
    how to use such commands and utilities, particularly those that help IP addresses
    to domain names, and vice versa, to help identify points along the path of attack
    as well as its ultimate origin.


    IDSes not only help detect and actively foil cybercrimes, but they also help gather
    evidence about their patterns of attack, specific details about related activities,
    and so forth. Many IDSes operate on so-called attack signatures, which provide
    specific patterns of attack, network traffic, or behavior against which ongoing
    network activity may be compared to identify (and sometimes even foil) attacks
    as they occur. Like AV software and its databases, the IDS must be constantly
    updated to keep its attack signatures up-to-date. Some IDSes also seek to identify
    anomalous behavior on systems or networks which may not yet have been defined.
    In addition, IDSes can focus on individual hosts, applications, or networks as
    a way to detect potential attacks for signatures may not


    Despite investigators'' real abilities to trace attacks and identify their points
    of origin, spoofing techniques can often foil their efforts to identify the real
    perpetrators of cybercrimes. Often, initial suspects in cybercrimes turn out to
    be themselves victims of cybercrimes that make them only intermediaries for real
    perpetrators,


    ![](img/fd8e85097b37559dbc07dc22fd8cb1fe_230_0.png)'
  merge: -1
