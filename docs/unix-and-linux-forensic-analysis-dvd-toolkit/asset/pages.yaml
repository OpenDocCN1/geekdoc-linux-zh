  md: '# The /Proc File System • Chapter 6 159


    # partitions


    This file presents a limited amount of information about the partitions present
    and the number of blocks allocated to them. This is all of the information available
    elsewhere on a 2.6 kernel (see SysFS), but it''s better to have duplicated data
    than not enough. Additionally, on a 2.4 kernel, this file will contain the data
    found in 2.6s/proc/diskstats.


    | major | minor | #blocks | name |

    | --- | --- | --- | --- |

    | 8 | 0 | 8388608 | sda |

    | 8 | 1 | 200781 | sda1 |

    | 8 | 2 | 8185117 | sda2 |

    | 253 | 0 | 7602176 | dm-0 |

    | 253 | 1 | 524288 | dm-1 |


    # sys/


    The /proc/sys directory contains a number of files that control kernel features.
    These can be written to, changing system behaviors on the fly. Never echo data
    into a file /proc unless you are absolutely certain of what you are doing (or
    on a test machine that you''re okay with bricking). It is highly unlikely that
    you will need to delve into this area of /proc during the course of an incident.


    # uptime


    This file will tell you two things: how long the system has been running, and
    how much of time it spent idle. The latter we don''t care about, but the former
    we do, for one very important reason. If you are told that the incident you are
    investigating occurred three days ago, and the system shows an uptime of 97,000
    seconds (27 hours), you know that the machine has at the very least been rebooted,
    which is important information to be aware of during an incident response engagement.


    # version


    This file provides more detailed kernel version information than you can get with
    a standard name -a, to include the gcc version used to compile the kernel.


    ```

    Linux version 2.6.23.1-42fc8 (kojibuilder@xenbuilder4.fedora.phx.redhat.com) (gcc

    version 4.1.2 20070925 (Red Hat 4.1.2-33)) #1 SMP Tue Oct 30 13:55:12 EDT 2007

    ```


