- pgno: 93
  md: 'Chapter 4 • Initial Triage and Live Response: Data Analysis


    # User Activity


    # Shell History


    Knowing who has done what is always of the utmost concern in any investigation.
    Fortunately for us, by default, Linux keeps a trail of user activity in the shell
    history, located in the /home/<user> directory. Remember, the shell history is
    only a record- of one side of the conversation. It does not show you what the
    system responded to the particular command. So while gathering information about
    what was typed at the command line is a good gathering technique, like anything
    else, it should be used in conjunction with other data retrieved from the investigation.


    In my examples, I am again using an Ubuntu 7.10 (Gutsy) distribution, which the
    history files that exist on my system, I simply type:


    ```

    locate bash_history

    ```


    Understand that this command will only give you the .bash_history files. There
    are other shells which will create other history files. The most popular shells
    store their history files in the following locations with the /home/<user> directory:


    +   - BASH .bash_history

    - C-Shell history.csh

    - Korn .sh_history

    - POSIX .sh_history

    - Z-Shell .history


    Again, by default, most Linux variants maintain a 500-line command history. To
    view the current command history of a system, type:


    ```

    echo $HISTSIZE

    ```


    Like else in Linux, this environment variable is configurable within the .profile
    of the individual user. If you find that the HISTSIZE has been modified from the
    default value, take note of it, and follow up with the customer''s system administrator
    to find out if this was a configuration change on their part, or something that
    was done maliciously by an intruder (especially if the value has been set to zero).


    Included on your tools disk are two scripts I have written to make parsing through
    user shell history files a bit easier. The first script is called "history_search.sh."


    www.syngress.com'
  merge: -1
  img_proc: true
- pgno: 94
  md: '# Initial Triage and Line Response: Data Analysis • Chapter 4


    It takes the commands from all of the user history files on the local host, regardless
    of which shell has been used, removes the duplicate entries, and puts them into
    a single file in the current working directory called “outfile”. You can use this
    file to review all of the commands used on the target host and determine if any
    of them requires further investigation. For example, if a command is found such
    as,"msf", indicating that the Metasploit Framework was invoked from the command
    line, you can then use the second script,"user_driller.sh” to find out which user(s)
    typed in this specific command. This script will create a directory driller in
    a user-specified location; however, the default is the current working directory.


    > NOTE One the limitations of the shell history files is that other than the Media
    Access Control (MAC) time, there are no timestamps within the file itself. While
    knowing what was typed in be useful for formulating an idea of what may have happened
    on the host, other correlative measures will have be taken to determine when these
    specific actions took place. Also tying a username to a command, or series commands
    only shows which username was used, not necessarily which user was actually using
    that account. A good hacker will likely use an existing user account to perform
    his nefarious tasks. This means that log file correlations will be of the utmost
    importance for you to be able to piece together the different aspects of the investigation.


    # Logged on Volatils


    When analyzing volatile data it is import to know which users are currently logged
    onto a system. Understand that most intruders are not so dumb as to create a user
    ID called,"hacker." They will than likely use an existing user ID to conduct their
    illicit activities. They just like with shell history, additional chronological
    correlations will have to be made to determine the activities were part of normal
    business operations, or if they were the work of an intruder.


    The output from the “who” and “w” commands are shown below in Figure 4.8. The
    results from the “w” may require a bit more information to fully comprehend what
    the user is looking at.'
  merge: -1
