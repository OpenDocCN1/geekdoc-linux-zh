  md: '# Initial Triage and Response: Data Analysis • Chapter 73


    clarify what the parameters of the incident are. From my experience, due to stress
    created by the incident and the pressure placed on the individual(s) from their
    superiors, the information provided to you during Initial Triage is sketchy at
    best. So it''s important to understand that you should be the calm voice of reason
    from the minute you walk through the door. Remember, the customer is relying on
    you to help them, so be cool.


    After the customer has told you your version of what has happened, it is important
    to asking questions. You need to be able to fill in the gaps between what the
    customer thinks happened and what really did happen, in which many cases is easier
    said than done. The following are items that you need to make sure you understand
    completely so that you can conduct an effective and efficient response.


    +   - Timeline If at all possible, you need to try and put the incident within
    a specific window. This may or not be possible based on the nature of the incident,
    but it should be attempted innas as the situation allows. Some cases will enable
    you to narrow your focus down to a specific day, or maybe even to specific hours
    within a day, while others may encompass several years. Whatever the case may
    be, make sure you are as thorough as possible. Failure to do so can seriously
    affect the rest of the investigation.


    +   - Network Topography Get the lay of the land. I have not been in a situation
    yet where the customer does not least have a high-level network diagram of their
    infrastructure, make sure you ask them for it.


    +   - Data Flow Once you have the network diagram, make sure you understand the
    data flow. Where are the ingress and egress points? What other systems are on
    the subnet? If in a Windows domain, are there domain trusts which allow access
    to other domains? You need to understand not just systems are involved in the
    incident, but also what system could be involved in it. Many customers are only
    focused on what their Information Technology (IT) staff has determined to be the
    scope of the incident, and not see the bigger picture. Your job is to widen the
    area of focus to include all potentially involved systems. You can determine if
    they were involved later, during log analysis.


    +   - Security Appliances What does the customer have on their network, and does
    it log. Best security practices are easy to recite, and preach, but implementation
    is an entirely different story. Many customers know they should'
