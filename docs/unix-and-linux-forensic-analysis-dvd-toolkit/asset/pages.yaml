- pgno: 47
  md: '# Introduction


    Once on-site at a customer location, it''s important to sit down with the customer
    and find out what has transpired. Understand that this conversation will probably
    provide you with different information than you may have initially received from
    any prior triage calls. I am not sure if it has to do with a lack of understanding
    of the full breadth and depth of the situation, or if the stress of the incident
    leads to details being missed, but from my experience this is a pretty solid rule
    of thumb. Expect things change once you get on-site and physically get a feel
    for the network and the systems that are in scope.


    Something I try to avoid is what I refer to the “shotgun” approach. Too many investigators
    simply show up at a customer location and starting hosts left and right, which
    I suppose is fine if you want to create more work for yourself. Maybe they think
    that by casting a really wide net, they will surely get whatever critical data
    may be and not return to the customer site later. While this approach will technically
    work, it''s far too consuming and generates many erroneous data in most cases.
    I prefer to take a more methodical approach by finding which hosts were involved
    in the incident, and eliminating (if possible) all other hosts.


    With a decent understanding of networking concepts, and with the help available
    from the customer’s systems administrators, eliminating out-of-scope hosts is
    not all difficult. It''s a matter of gauging technical possibility and log file
    review. For example, if host X is on a Virtual Local Area Network (VLAN) with
    other hosts, obviously these five hosts will be in scope for the assessment. Now,
    what if that VLAN only has a route to one of three other VLANs? Logically, only
    that one VLAN would be considered in scope for the incident, even if the customer
    network is comprised of several VLANs. To be on the safe side, you should perform
    a log file review to ensure that no connections were made to any of the VLANs,
    which you have technically determined to be out of scope, as a router compromise
    could lead to new routes added by an intruder. The same should be done for the
    VLANs and hosts within the two VLANs that were determined to be in scope. Provided
    the customer has the appropriate level of logging, you can determine if a host
    was touched by another. If you can show that a particular host was not touched,
    you can eliminate that host from the scope of the assessment.


    The practice of eliminating hosts for the lack of information is commonly referred
    to as “negative evidence.” The key proponent in this methodology is the burden
    of proof. You have to able to show that something absolutely did not happen.


    ![](img/fd8e85097b37559dbc07dc22fd8cb1fe_47_0.png)'
  merge: -1
  img_proc: true
- pgno: 48
  md: 'For example, if the investigation is for an Internet-based incident, and the
    customer has a single firewall entry point from the Internet, and the customer’s
    firewall logs show host X made a connection to host Y but not to Z, then you will
    have the negative evidence necessary to eliminate host Z from the scope of the
    incident.


    Understand that in many cases the customer lacks the logging necessary to conduct
    this kind of analysis. Additionally, you may work for a customer or an organization
    that doesn’t care about what you think you can prove; they want you to image everything.
    In cases like this, your hands are tied and you just have to do what is asked
