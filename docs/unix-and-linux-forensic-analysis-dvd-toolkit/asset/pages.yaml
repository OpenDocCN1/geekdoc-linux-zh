- pgno: 2
  md: '# Co-Authors


    **Chris Pogue** is an Incident Reserve Response Manager and Forensic Analyst for
    a major Information Technology service provider. With over ten years of administrative
    and security experience he has worked cases all over the globe assisting organizations
    from fortune 500 companies to single owner small businesses defense in depth into
    their infrastructure. Prior to becoming a forensic analyst, Chris spent the five
    years as part of the Ethical Hacking Team for the same service provider. Tasked
    with emulating the actions of a malicious attacker, he assisted customers in identifying
    and eliminating probable attack vectors. Brining that knowledge and experience
    to bear to the Incident Management team, Chris specializes in incidents involving
    intrusion, and unauthorized access.


    Chris is also a former US Army Warrant Officer (Signal Corps) with the Army Reserve
    Information Operations Command (ARIOC) on Joint Task Force (JTF) missions with
    the National Security Agency (NSA), Department of Homeland Security, Regional
    Computer Emergency Response Team-Continental United States (RCERT-CONUS), and
    the Joint Intelligence Center-Pacific (JICP). Chris attended forensics training
    at Carnegie Mellon University (CMU) in Pittsburgh, Pennsylvania, and was the ARIOC
    primary instructor for UNIX, Networking, and Incident Response for all CMU sponsored
    courses. Chris holds a Bachelor''s Degree in Applied Management, a Master''s in
    Information Security, is a Certified Information Systems Professional (CISSP),
    a Certified Ethical Hacker (CEH), and a VISA DSS Qualified Security Assessor (QSA).


    Chris resides in Tulsa, Oklahoma with his wife Michelle, and his two children,
    Jenna age 4, and Colin age 2. While the world of computer forensics is fast paced,
    and challenging ... nothing compares to the rush and excitement of being a human
    and father.


    > First and foremost, I would like to thank my Lord and savior Jesus Christ, without
    whom nothing in my life would be possible. Since being saved, He has walked along
    side of me when I needed a friend, walked in front of me when I needed a perfect
    example of how to live my life, and carried me when I needed a Messiah . All that
    I am able to do is only through His grace and mercy.'
  merge: -1
  img_proc: true
- pgno: 3
  md: 'My earthly strength comes from my beautiful wife Michelle, and my two children
    Jenna and Colin. Next to my salvation, Michelle is the greatest gift the Lord
    has ever bestowed upon me, and without her I would not be the man I today. She
    is a wonderful wife, and mother. Thank you so much for supporting me, loving me,
    and being by best friend even though I am hands down, the biggest nerd you ever
    met.


    My kids keep you at heart. I cannot begin to count the number of times while writing
    this book; I played puppy with Jenna and asked Colin to kindly get off my desk.
    I love being a dad and pray that I am half the father they deserve.


    Finally, I would like to thank everyone who contributed in way or another to the
    completion of this work. Specifically I would like to thank Harlan Harvey, Tom
    Miller, Jon Evans, Sam Elder, Keith Fanselow, Clint Ruho, Barry Grundy, Mariusz
    Bundach, Cory Altheide, Andrew Rosen, Rick Van Lavender, Darrell Yver, Mark Eifert,
    my mother Donna Pogue, and my sister Juli Czajkowski. Without all of helping me,
    guiding, and encouraging me along the way, I would have never finished this freaking
    thing Thank you all... and stuff.


    Cory Altheide has been performing forensics & incident investigations for the
    past seven years for employers ranging from the National Nuclear Security Administration
    to Google. Cory has developed and presented hands-on forensics training for various
    government, law enforcement, and civilian entities towards improving investigator''s
    skills in examining less common digital media, exotic operating systems, and live
    analysis and acquisition. He holds the GIAC GCIH and PCI QSA certifications and
    is on the technical program committee for the 8th Annual Digital Forensics Research
    Workshop (DFRWS).


    I would like to The Macallan.


    Todd Haverkos has 16 years of experience in Information Technology (IT) and high
    technology, including 7 years with a Fortune 50 computer services company working
    in network security, ethical hacking roles and most recently Security Consulting
    and Penetration Testing roles, 6 years with an international semiconductor and
    communications company as an integrated circuit designer for whom he holds a US
    Patent, and 4 years with large regional electric utility in database administration,
    IT, and telecom. He has 6 years of dedicated experience in Information Security
    and has expertise with penetration testing, application security testing, vulnerability
    assessments and recommendations, security policy and procedure development, network
    architecture, firewall, switch and router configuration and management, and technical
    security documentation.'
  merge: -1
  img_proc: true
- pgno: 4
  md: 'Todd holds a bachelor''s degree in Electrical Engineering from the University
    of Dayton, a master''s degree in Computer Engineering from Northwestern University,
    and holds EC-Council Certified Ethical Hacker, and EC-Council Certified Security
    Analyst certifications.


    Thanks to Chris Pogue for the opportunity to contribute to the book (in an albeit-small,
    one chapter of way). It''s a pleasure to have the opportunity to spread *nix thoughts!
    James Lee, thank you for inspiration and encouragement to jump into the water.


    Thanks also to the English faculty of St. Xavier High School in Cincinnati, OH,
    particularly Walter Koral, Jim Downie, Patricia Calley, and Mike Marchal. While
    I know at least one of you was quite unhappy with my choice of engineering as
    a career path lo, those many years ago, I would like to offer this consolation:The
    ability to communicate well-particularly in writing-is easily the most valuable
    skill I have brought to any technical job I''ve had, and a skill I use every day
    of this Internet-connected life. Many thanks!


    Thanks also to Mom who wisely and generously found a way to make sure I had that
    education and the one from her, and for all other great things Mom''s do that
    earn them a much-deserved place in acknowledgments!


    To those who like to keep a low profile, but who have been so generous in sharing
    their technical knowledge and friendship with me over the years, thank you!


    And to Phet and Boon, you make everything worth working for.'
