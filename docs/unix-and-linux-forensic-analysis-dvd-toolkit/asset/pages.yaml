  md: '# Chapter 4 • Initial Triage and Live Response: Data Analysis


    The other log files are then increased in numerical value by 1, with the oldest
    log being deleted. All of this information is configurable in the /etc/logrotate.conf
    file. The system administrator at the customer location should be able to tell
    what the log gathering parameters are for his servers.


    To begin searching through the logfiles, you can use the native Linux commands,
    or any text tool. Below are some useful commands:


    ```

    zgrep

    ```


    Zgrep invokes grep on compressed or gzipped files.


    ```

    zgrep <search_parameter> *

    ```


    This will search all compressed files in the current working directory for the
    <search_parameter>.


    # Tail


    Tail will display the last output of the file denoted by the next argument. For
    example, “tail -100 <filename>” will display the 100 lines of the file. Additionally,
    using the -f switch will display a log file as it gathers information in real
    time.


    ```

    tail -f /var/log/messages

    ```


    This will display the contents of /var/log/messages as new output occurs.


    # More


    More works the same as the MS DOS version of the command, by simply sending the
    contents of the specified file to stdout.


    ```

    more <filename>

    ```


    This will display the contents of the <filename>, stopping output at the bottom
    of the screen with the word “—More—(x%). This indicates that you are currently
    looking (or have looked at) x% of the total file.You can press the enter key to
    scroll down by one line, or the space bar to scroll down by one page. To scroll
    backwards by one page, simply press the letter “b”. Additionally, you can search
    through the file with “/” key followed by the <search_parameter>. If multiple
    occurrences of the <search_parameter> are found, simply press the “n” key to skip
    to the next entry,'
  merge: -1
  img_proc: true
- pgno: 84
  md: 'while the letter “p” will take you to the previous entry. The letter “q” allows
    you to quit the current view and returns you to the command prompt.


    # Less


    Less is the opposite of more. It allows you to perform the functions as the “more”
    command, but with much more control, adding the ability to move backwards and
    forwards in the file. It also loads faster than more, since it does not read the
    entire file before opening it up.


    ```

    less <filename>

    ```


    This will display the contents of the <filename>.You can scroll backward with
    the “d” key, and forward with the “,”you can press the “/” key followed by a <search_parameter>
    to conduct a search;”n” will take you to the next occurrence of the hit;”p” will
    take you to the previous one.


    # Keyword Searches


    Keyword searches are a quick and easy way to help you identify points of interest
    on the targeted machines.These can either be performed on the live system, provided
    that the volatile information has already been gathered and already taken place,
    or post mortem in a laboratory environment. The important thing to remember is
    that keyword searches operate under the assumption that the bad guys have left
    the original names for whatever tools they have used, in place on the system.You
    obviously are not going to be able to guess the names of any files that have been
    changed, so just keep it in the back of your mind during the data analysis and
    let the data guide you.


    To perform our keyword searches, we are going to stick with the resident utilities
    found on the Linux operating system:


    +   - strings

    - grep

    - less


    For our example, I have gathered the contents of /proc/kore from my Ubuntu 7.10
    (Gutsy) machine.'
