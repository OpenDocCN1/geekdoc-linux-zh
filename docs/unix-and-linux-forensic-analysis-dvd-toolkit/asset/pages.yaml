- pgno: 232
  md: '# Frequently Asked Questions


    Q: What steps should IT or law enforcement professionals take to inventory logs,
    audit trails, and other potential sources of evidence or supporting data when
    investigating cybercrimes?


    A: The short answer to this question is inventory, inspect, filter, document,
    and preserve. Let''s expand on that bit:


    +   * **Inventory** Take stock of all firewalls, screening routers, IDSes, systems,
    and servers in use through which attack trail may have passed or at which attack
    activity may have focused. Examine each element to identify related log files
    or audit trails, and take note of their names and locations.

    * **Inspect** Examine the various log files or audit trails to determine whether
    they contain records or entries that contain any traces of evidence related to
    the incident under investigation. If so, add the name and location of each such
    audit trail to your list of evidence files.

    * **Filter** Mathematics professionals call this step data reduction because it
    consists of ignoring entries that have no bearing on the incident you''re investigating
    and collecting only those that are relevant to the matter at hand. Most log or
    event viewers include powerful filtering tools—those that do not usually be imported
    into a spreadsheet or database where those applications'' built-in search tools
    can help you separate what''s important from what''s not. Make sure your notes
    include the name and location of the original source file and that you (or an
    expert witness) can attest that (a) data filtering is a common practice in log
    analysis and (b) you can demonstrate a direct relationship between the original
    file and the filtered file.

    * **Document** Explain how the captured log entries, event listings, and so forth
    provide evidence of a cybercrime. In addition, document extensively the original
    sources for such data, including their locations; original filenames; current
    locations of original, unaltered files or drives; and how the data was handled
    since initial detection of the incident occurred.

    * **Preserve** Take all steps necessary to preserve the original source of the
    log files or event data. This may require removing a hard drive from a system
    or even taking a system out of service as to preserve the evidence in its most
    pristine possible state.'
  merge: -1
  img_proc: true
- pgno: 233
  md: '# Implementing Cybercrime Detection Techniques on Windows and *nix • Appendix
    A 227


    **Q:** Given the need to interpret and explain the contents of some specific log
    file or event trace, how can an investigator obtain the information necessary
    to perform this task?


    **A:** We''ve noted repeatedly that although the kinds of information recorded
    in logs and event traces are similar across multiple operating systems and boundary
    devices, the details vary according to each system and implementation. To document
    the layout and interpret the significance of log files and event traces, you will
    need to contact the vendor of the operating system, application, or device in
    question and ask the company to provide you with its documentation for those log
    files or event traces. In many cases, you''ll be able to find this information
    for yourself if you use the vendor''s search engine on its Web site or consult
    its technical support database or other resources the vendor makes available online.
    If this does not produce the desired results, you may need to call the vendor''s
    technical support operation and ask for assistance in identifying and obtaining
    the right information. In most cases, this should be an entirely routine matter
    and relatively easy to handle.


    **Q:** How can an organization be sure that the IDS and other boundary devices
    are completely up-to-date and that they include the latest attack signatures,
    patches, fixes, and so forth?


    **A:** In most cases, the system or software vendor that provides the IDS or other
    boundary device will also offer a notification service, online update information,
    and perhaps even tools you can use to assess the status of databases, patches,
    and fixes for such systems or services. Usually, a search on the vendor''s Web
    site for the product in question will provide direct pointers to such information
    because the vendor understands the importance and urgency of that information
    as much as its customers do. When in doubt, contact the vendor''s technical support
    operation. Here again, obtaining this information (or pointers to it) should be
    an entirely routine matter and easy to complete.


    **Q:** If an organization becomes subject to an attack that appears to be unknown
    or for which no signatures appear to be available, how and to whom should this
    kind of information be reported?


    **A:** The odds against falling prey to the first (or an early instance of an)
    attack are pretty low, but one unlucky organization must inevitably be the first
    victim of'
  merge: -1
  img_proc: true
- pgno: 234
  md: '# Appendix A • Implementing Cybercrime Detection Techniques on Windows and
    *nix


    vulnerabilities or be subjected to as-yet-undocumented attacks, as they occur.
    When this happens, it''s important to notify all parties that might be concerned,
    including the following:


    +   Notify your upstream ISP and any other upstream ISPs that might sit between
    your network and the Internet.


    +   Contact any vendors whose products handle traffic related to such an attack,
    including firewall, proxy server, screening router, IDS, application, AV (where
    applicable), and operating system vendors. Most companies have formal reporting
    mechanisms that they provide to customers who want to report security incidents.
    It will help if you can identify these companies in advance so that your response
    during an incident isn''t slowed by researching this information.


    +   All the big general-incident clearinghouses should also be notified, including
    www.cert.org, and more-focused security organizations that focus on your particular
    industry or market niche.


    +   In the United States, if your state has criminal laws that cover network attacks
    (such as unauthorized access or denial/disruption of network services) contact
    your local police or sheriff''s office.


    +   In the United States, the FBI and Secret Service have developed guidelines
    intended to encourage companies to report cyberattacks. See CIO Cyberthreat Response
    & Reporting Guidelines (in PDF format) at www.cio.com/research/security/incident_response.pdf
    for detailed information.


    +   Outside the United States, contact the national or regional agency responsible
    for making and enforcing cybercrime laws.'
