- pgno: 158
  md: '# The Hacking Top 10 • Chapter 5


    A MITM attack can only be successful when the attacker can impersonate each endpoint
    to the satisfaction of the other. Most cryptographic protocols include some form
    of endpoint authentication, specifically to prevent MITM attacks.


    From the GUI, it is a drop-down "mitm" with several different types of attacks,
    as can be seen in Figure 5.35.


    # Figure 5.35 “mitm” Dropdown


    ![](img/fd8e85097b37559dbc07dc22fd8cb1fe_158_0.png)


    I am not going to walk through one of these attacks, but I wanted to make sure
    that I at least covered the potential.


    Ettercap is a powerful utility with a number of potentially nefarious uses. In
    the hands of the wrong people in your customer''s network, they can gather a whole
    bunch of information that they can make their attacks targeted, clean, and practically
    untraceable. If you see Ettercap installed on a host during an investigation,
    assume the worst. In fact, you may want to discuss putting your own system on
    their wire and running Ettercap to see what the intruders were and are able to
    see. Doing so may give you a great deal of insight into what is taking place,
    how information is leaked, and potentially where it’s going.


    Don’t take my word for it! Download Ettercap from http://ettercap.sourceforge.net/download.php,
    or if you are using Ubuntu, use the “apt-get install aftercap” command.


    www.syngress.com'
