    dm-1 loop0 loop2 loop4 loop6 ram10 ram12 ram14 ram2 ram4 ram6 ram8 sda

    ```


    /sys/block contains a subdirectory for every block device present on a system.
    In most cases, you will be interested in the hd and sd block devices. As with
    /sys/modules, there is'
