- pgno: 62
  md: 'Live Response: Data Collection • Chapter 3 55


    obtained the outfile, you can either resume the process by running the “kill –CONT
    PID” command, or you can kill the process by issuing the “kill -9 PID."


    At this point, the volatile information gathering process is complete. All information
    obtained from the system should be MD5d and transferred off the suspect system
    and onto your target media for later analysis.


    # Acquiring the Image


    # Preparation and Planning


    Now the volatile information has been gathered, the machine can be powered off,
    and the image of the hard drive can be acquired. I am actually laughing at this
    because it sounds so easy! In reality, this is actually one of the more challenging
    phases of the data collection process. The reason for this is that no two system
    configurations are alike. If you are going to acquire a laptop or a standalone
    system with a single drive, you are very lucky, and that is relatively painless.
    However, scenario, in my experience in the corporate world, almost never happens,
    and therefore should not be expected. Instead, be prepared to face multiple variants
    of Redundant Array of Inexpensive Disks (RAID) levels, Logical Volume Management
    (LVM) systems, Network Attached Storage (NAS) devices, Storage Area Networks (SAN),
    or any thereof.


    As storage capacity grows and prices drop, investigators should be prepared to
    acquire large amounts of data, and plan accordingly. For example, the last case
    I worked involved three systems; two servers configured with a RAID 5 with five
    GB SCSI 10k drives (two active and one hot swap), and one laptop with 80 gig drive.
    Before getting on a plane to the customer site, I went to my local computing store
    and purchased 500 GB external USB 2.0/Firewire 400 drives, and eventually ended
    up using them all! It is important to plan for the worst, both in storage capacity
    and time. My team currently maintains a listing of systems acquired, their storage
    configuration, the means of acquisition, and the amount of time the acquisition
    took. Having this information helps the rest of the team plan for engagements
    with similar parameters.


    It should also be noted that customers (or victims) usually know very little about
    the incident when they call for help. It is important to remember that they are
    not forensic experts, and therefore are more than likely providing you with inaccurate
    information. Be prepared to copy notes, and rely on your experience and training
    to fill in the gaps. I have been limited engagements in which the customer told
    the scope of the incident was


