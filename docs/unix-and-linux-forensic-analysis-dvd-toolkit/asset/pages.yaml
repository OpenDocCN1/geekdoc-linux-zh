- pgno: 57
  md: '# Chapter 3 • Live Response: Data Collection


    This information is helpful in determining if a rogue application or piece of
    malware has been added to the RC scripts. Coupled with an understanding of how
    the R.C scripts work, you should be able to determine if there are any malicious
    scripts to initiate when the system starts up, and at what RC level.


    Gathering information from the chronological (cron) log will allow the investigator
    to view the currently scheduled tasks. The information stored in the /etc/crontab
    differs from the information located in the RC scripts, and at the cron entries
    will be initiated regardless of RC level the system boots to. Also, entries can
    be made to the cron tab and initiated without rebooting the system. For this reason,
    the information in the crontab needs be carefully reviewed by the investigator
    and compared against a customer-provided known good version of the file. By default,
    the cron logs are located in /var/log. These logs are important as they track
    any changes made to crontab, when they were made, and by whom.


    Information about users, which groups users are assigned to, and their password
    information can be of great use in the investigation process. This can tell you
    if something has been changed, or if an unauthorized user ID has been added. The
    files associated with this information are /etc/passwd, /etc/shadow, and /etc/groups.
    These files can be aid in the correlation between certain activities recorded
    in the various forms of log files, and the user ID which performed those actions.
    It is important not to make assumptions based on this information, something that
    many inexperienced investigators frequently do. When a user ID is tracked as performing
    a certain action the only forensic information that should be recorded is that
    the user ID itself used, and not the user. It is a short, yet incorrect stretch
    to state that user X performed an action rather than user ID X. As forensic analysts,
    our job is to report the facts without opinion or assumption. Assuming that the
    user is tied to the user ID is not only outside the scope of our job duties, but
    is very often an incorrect correlation to make. Thinking through the issue logically,
    if you were a hacker and had penetrated a network, you would create yourself an
    ID called “bad_guy?” No! You would use an existing ID, or if you were a good hacker,
    you would use different IDs so that your actions would be more difficult to distinguish
    from the normal daily activities.


    Information about hosts the system has access to be found in /etc/hosts, /etc/hosts.equiv=~/hosts,
    /etc/hosts.allow, /etc/hosts.deny, /etc/syslog.conf /etc/rc, /etc/inetd.conf.
    These files contain such valuable information as hosts that have recently connected
    to the target, and the location of various log files. Gather this information
    for later comparison against customer-provided known good lists for deviance.'
  merge: -1
  img_proc: true
- pgno: 58
  md: 'The Address Resolution Protocol (ARP) cache of a system is a table that keeps
    of which IP addresses are associated with which Media Access Control (MAC) addresses
    for Open Systems Interconnect (OSI) layer 2 (Data) routing. The "arp -a" command
    will display these route entries. This information can be used to determine if
    there are any permanent ARP cache entries, or whether ARP proxies have been created.
    This information can be important to have in an investigation which a Man-in-the-Middle
    (MITM) attack is suspected. The way this would work is that the attacker would
    poison the ARP cache of the target system by replacing his own MAC address with
    a legitimate IP address <IP Address X>. Then he would do the same thing to the
    ARP cache of IP X, he would replace the MAC of the target system with his own.
    The result would be that two systems that normally communicate with each other
    are now communicating through the attacker. Since Layer 2 traffic is sent and
    received at a lower level on the stack, the MAC address is used and the IP address
    never comes into play. The poisoned systems think they are talking to each other
    normally. The increase in processing time between two compromised hosts was negligible,
    and when this was tested in a laboratory environment could easily be dismissed
    as normal network bottleneck. For this reason, the ARP cache should be captured
    and reviewed for deviance from a known good.


    Many compromised networks are further victimized by something commonly referred
    to as a "sniffer." A sniffer captures all traffic that is passed through the same
    network segment upon which it has been placed. To see if a host is running a sniffer,
    issue the "ifconfig" command and look for the phrase "PROMISC." This means that
    the Network Interface Card (NIC) is running in promiscuous mode, and is most likely
    being used as a sniffer. To understand this concept, the investigator needs to
    have a general understanding of how network traffic is passed across a modern
    TCP network. Basically, traffic is sent outbound for a specific host, it only
    does not travel in a straight line, like a car driving to a destination. When
    the TCP packet is sent out, every other host on that segment sees the packet and
    looks at it to determine if it is supposed to connect to it or not. If the MAC
    address does not match the address for packet, the host will simply drop the packet
    and proceed doing whatever it was previously doing (note, that this takes less
    than a picosecond, which is one trillion of a second). If the host that the packet
    is looking for does not respond, the default gateway will pick up the packet and
    send it out to everyone in its routing tables. This process is repeated until
    the packet reaches its destination, and the host response indicates it received
    the packet. When a host is set up as a sniffer,'
  merge: -1
  img_proc: true
- pgno: 59
  md: '# Chapter 3 • Live Response: Data Collection


    instead of simply dropping packets that are not intended for it, it will pick
    them all up and read them.This can be particularly dangerous for networks that
    use protocol like Telnet and File Transfer Protocol (FTP), which transmit traffic
    in clear text. The sniffer can easily pick up packets with login credentials and
    passwords and then use those compromised IDs to perform unauthorized activities.


    With the size and complexity of modern computer networks coupled with the available
    tools and knowledge of the modern hacker, the result is simply more complex and
    diverse hacks. In my experience, I have never seen a successful penetration limited
    to a single host. Nearly always, multiple systems are affected, or are at the
    least used as a toehold, or jump point from which the attacker can spawn further
    activities. This being the case, it is important for investigators to know which
    hosts are easily reachable from the initial compromised target. To discover which
    hosts the current host can see and communicate with, a simple Packet Internet
    Groper (ping) sweep should be conducted. This can be done by using,"nmap -sP <subnet-255>
    > outfile" command.The output from this command will show which hosts responds
    to the Internet Control Message Protocol (ICMP) Echo (8). For some reason the
    customer network is set to prevent ICMP traffic, or hosts are configured to drop
    ICMP packets, TCP can be used instead. Basically, it does the same that ping does,
    it only uses the TCP protocol and a user-provided port rather than ICMP traffic.
    The result is the same, either a host will respond or it will not. The investigator
    should be sure to consult with the customer prior to executing this command, primarily
    because a port needs to be selected that all hosts will respond to, and will not
    be filtered by the firewalls, all to ensure that there will not be any adverse
    effects to the network.


    The investigator may also want to discover which OSEs are associated with which
    hosts.This can be accomplished by using,"t_nmap -vV -sP -O <IPs within range of
    target> outfile. Like the ping, this information will be important later in determining
    the scope of the penetration. I recently worked a case in which a compromised
    host was scanning other hosts on the customer network (we found this information
    from reviewing the internal firewall logs). He was obviously looking for something,
    but what? By issuing an nmap OS sweep, we were able to gather enough information
    to determine that the intruder was focusing on Windows 2000 hosts. Armed with
    this knowledge, the scope of our investigation narrowed from 250 hosts to 10.


    Once these basic commands have run, stop your script session by pressing Ctrl-D.Remember,
    a text file "typescript" has been generated in the directory'
