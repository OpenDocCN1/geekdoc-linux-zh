- pgno: 162
  md: '# The /Proc File System • Chapter 6 155


    In addition to providing data about the current state of various kernel structures,
    some /proc entities allow for modification of these structures. So as always,
    be extremely diligent when working on a live, non-laboratory system.


    In Figure 6.1 you can see the contents of a fairly typical /proc file system,
    taken from a Fedora Core 8 Linux machine. The first thing that will immediately
    stand out is the large number of numbered directories. These represent the various
    processes running on the system, and map to the process IDs (PIDs). We''ll explore
    these in more depth shortly.


    Setting these aside for the time being, we are left with 40 files and directories
    representing non-process data. The easiest way for us to examine the data herein
    is the “cat” command, like this:


    ```

    cat filename

    ```


    Where filename is the name of the file you''d like to examine.

    This will dump the contents of these pseudo-files to the screen. Standard file
    commands (tar, cp, and so forth) sometimes have trouble with pseudo file systems,
    so in general, cat is a safe bet.


    Here''s a rundown of the contents for those that may be of importance to an incident
    response engagement.


    # cmdline


    This file contains the kernel parameters that were passed as boot options. On
    our system, “cat /proc/cmdline” shows:


    ```

    ro=/dev/VolGroup00/LogVol00 rhgb quiet

    ```


    This serves to identify the root partition (/dev/VolGroup00/LogVol00), mounts
    read-only for boot (ro), and starts the RedHat Graphical Boot screen (rhgb), without
    displaying non-essential kernel messages to the screen (quiet).


    # cpuinfo


    This file contains information about all the processors on the system. This may
    be important to know if you are using tools that are sensitive to a multi-processor'
  merge: -1
  img_proc: true
