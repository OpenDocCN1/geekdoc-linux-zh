- pgno: 140
  md: '# The Hacking Top 10 • Chapter 5 133


    Also note that the target is not identified in the Web as anything other than
    target=1. I captured the TCP data from Wireshark, and it showed the connection
    being made from my local host, 192.168.10.117, to the target host, 192.168.10.25
    on my chosen port of 34333. To make that determination, you would have to correlate
    other log file information like firewall logs, or the event logs of the targeted
    windows host. when performing log correlation, you have to make sure you understand
    and take note of the date and time as recorded by the host. The two involved hosts
    might be in different time zones, with a syslog server in the third time zone.
    Another possibility is that the intruder changed the date and/or the time on the
    compromised server to obfuscate the logs. All pertinent information must be carefully
    organized to ensure you have an accurate picture of what happened and when.


    The example provided here is only one possibility of hundreds available within
    MSF. The key information is not the exploit itself, as much as it is how the exploit
    is carried out, what it looks like on the wire, and what kind of artifacts leaves
    behind. Some key places to look for indicators of MSF being used are the shell
    of all users, the browser history files (I used Firefox, which keeps this information
    in a file called history.dat), and the network logs. Using what you know and how
    it works, you should be able to determine not only if it was part of a compromise,
    but how it was used, and possibly which host it targeted, which exploit was attacked,
    and which payload was used.


    > Don''t just take my word for it. Go to the MSF homepage,¹⁴ download the Framework,
    and test different attack scenarios in a lab environment. Use a utility like Wireshark
    to capture the TCP data so that you can see what is actually happening on the
    wire when the attack is launched. If you know that MSF was used in the compromise,
    try and recreate the attack by emulating the customer network as closely as possible
    and foot printing what you know (or think) happened. After you capture your data,
    compare that data too see if there are any similarities.'
  merge: -1
  img_proc: true
