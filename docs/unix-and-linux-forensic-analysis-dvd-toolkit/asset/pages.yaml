- pgno: 55
  md: '# Chapter 3 • Live Response: Data Collection


    investigator two things: which connections are coming from the host, and which
    connections are being made to the host. For this information to make any sense,
    the customer will need to provide you with a baseline for standard operating parameters.
    This information will allow the investigator to eliminate connections connections
    the host should be making, and focus on those that it should not be making. It
    is important not to assume simply because that connection is being made to another
    host on the same network segment, that it is a standard connection. The computer
    in question may be used as a jump point to other machines within the customer
    network, so never assume anything. Make the customer tell you what is normal and
    what is not.


    Another piece of information which needs to be retrieved is the shell history.
    This information can be gathered with the “history>hostname_cmd_history> command.
    This file will show you all of the commands typed by stdin since the last reboot,
    and provide the investigator with a wealth of information. The one drawback to
    the shell history is that by default, it does not use timestamps within the file,
    so time frame correlations cannot be made using the file itself. This illustrates
    the importance of gathering timestamp information anywhere it is possible. The
    shell history can be used in conjunction with other information such as the netstat
    output and the timestamps on files to determine what was done and when. It is
    also important to remember that the shell history only shows which user ID was
    used to issue specific commands, not which user. The correlation between user
    IDs and physical people is not possible, nor should it be attempted at this phase
    of the investigation. A mature organization should have a restrictive acceptable
    policy which enforces a one-to-one ratio between the user ID and the user.


    It is important to note what the system is actually doing at the time of the incident,
    or as close to it as reasonably. An investigator should gather information about
    which processes are running using the “ps aux” command, and compare those results
    against customer-provided operating parameters. Additionally, the “w” command
    displays current processes for each user of each shell. The output from this command
    will contain several fields, most of which is the “TTY” field. This field will
    contain one of several output formats, tty#, ?, or ps#. If the field contains
    a tty# (with # being either a zero, or some positive number) it indicates that
    user is logged onto the console. A tty# or ps# (again, where # equals 0 or some
    other positive integer) indicates that user is logged in on a remote session.
    If this is the case, the next field, “From” will provide the IP address or fully
    qualified domain name (FQDN) of the host from'
