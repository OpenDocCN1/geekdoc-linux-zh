- pgno: 74
  md: '# Live Response: Data Collection • Chapter 3


    I did not know what I was going to encounter. Customers/victims usually only have
    mited amount of information, which more often than not is lacking at both and
    flat out incorrect at worst. When dealing with Chief Information Officers (CIOs)
    or Chief Information Security Officers (CISOs), they may only have a particular-standing
    of the nature and scope of the incident. A good forensic investigator should never
    show up on site without three, to four times the estimated amount of storage media.
    Personally, if at all possible, I carry four times what I think I am going to
    need. I would rather take the trip back to Comp USA, and return an unused drive,
    than to tell the customer I showed up unprepared.


    Once the target media has been selected, create a name for the image. This should
    be something that can easily understood and differentiated from other potential
    images of a similar nature. For example, say you are acquiring five 36 GB SCSI
    drives from a RAID 0 array. Each drive made by the same manufacturer is the same
    and comes from the same host, so using any of items for a naming convention would
    not be possible. In this case, the drive serial number can be used point marker
    to identify an alpha-numeric marking in the corner of the drive label, and annotate
    this in either an evidence disposition form, or in a spreadsheet. Be sure to verify
    your information before proceeding.


    The final step is to change the image fragment size from 650 to 2000. Older FAT
    file systems could only support 650 MB chunks, but with NTFS and ext2/ext3, you
    can safely use larger 2 GB chunks. Once this value has been changed, the image
    acquisition will begin.


    The other FTK tool which can be used for image acquisition is FTK Lite. This is
    a boiled version of FTK Imager, and consists of a single executable binary that
    can be easily stored on a USB drive or a CD. The main advantage of FTK Lite is
    that it can be run from the target host, with the image being transferred to the
    forensic machine. In the event that the compromised machine is a server, use the
    power of the server (which is normally much more robust than a forensic laptop)
    to generate the image. This usually cuts down the imaging time. The limitation
    to FTK Lite, however, is that it only runs on Windowsbased systems. So while it
    is a good tool to have in the forensic toolkit, it has limited functionality.


    As a whole, the FTK suite of tools are user friendly. They are powerful, can display
    forensic data in a variety of ways, and work well to compliment other forensic
    analysis tools like EnCase, Autopsy, and ProDiscover.'
