  md: '188 Chapter 8 • Malware


    release stood out like a sore thumb because it had no signature. In fact, Andrew
    Brown from Crossbar Security, Inc found the issue within just a few hours.


    More recently, in December 2007, tarballs of SquirrelMail 1.4.11 and 1.4.12 were
    found to have been Trojaned by a remote-execution backdoor. This attempt was thwarted
    within a very short period of time by a vigilant user who noticed the Message
