- pgno: 56
  md: '# Live Response: Data Collection • Chapter 49


    which the connection is being made. The “top” command can also be used to view
    which processes are utilizing the most memory.


    In conjunction with running processes, it is important to find which files may
    have been used to execute those files, and which files are coming into or being
    marked for deletion as a result of the running process.The “kof” command will
    show the investigator information about open files and the processes which may
    have launched them. Additionally, the “+L1” switch will allow the investigator
    to view the unlinked files (or those marked for deletion), referred to as the
    “Unlinked Field.” To fully understand this concept and why it is important, it
    is important to understand how the Linux OS deletes a file. In their book, “Incident
    Response: Investigating Computer Crime,” Kevin Mandia and Chris Prose state;UNIX
    tracks a file’s link count, which is a positive integer representing the number
    of processes currently using the file. When the link count equals zero, that no
    process is using or needs the file, so it will be deleted. When an attacker deleted
    his rogue program, the program on the hard drive is removed from the directory
    chain (so it will not be displayed in ls listing), the link count is decremented
    by one, and the file’s deletion time is set. However, note that the link count
    does not equal zero until the process terminates. Armed with the understanding
    of how files are deleted, it should be clear to the investigator why the “kof”
    command and the resulting output is critical to the volatile information gathering
    process.


    Along the same line of thinking of running processes and file deletion, it is
    important for the investigator to note which processes are scheduled to be initiated
    at the time of system start up.These entries can be viewed by using the “chkconfig–list”
    command. The output from this command displays which processes are scheduled to
    start at which Run Control (RC) levels. For you to understand why this information
    is important, you need to understand that the Linux OS has five boot modes commonly
    referred to as Run Control levels are:


    +   - 0 Halt

    - 1 Single-user mode

    - 2 Basic multi-user mode (without networking)

    - 3 Full multi-user mode (text based only)

    - 4 not used

    - 5 Full multi-user mode (graphical user interface [GUI] based)

    - 6 Reboot.


    ![](img/fd8e85097b37559dbc07dc22fd8cb1fe_56_0.png)'
