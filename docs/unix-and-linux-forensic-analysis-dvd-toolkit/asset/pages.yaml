    The first field is the group name, the second is the hash of the group password
    (password protected groups are not typically used), the third is the GID, and
    the fourth is a comma-separated list of the members of the group. Additional unauthorized
    users in the root or wheel groups are suspicious and warrant further investigation.


    Finally, we have /etc/shadow, which stores encrypted user passwords and related
    information.


