- pgno: 67
  md: '# Bootable *nix ISOs


    There are several different bootable Linux OSes which can be used for persistent
    data acquisition. They can be used on either a *nix or Windows platform, as they
    are completely self contained within the CD, and are designed to never touch the
    resident file system.


    The most popular of these types of systems are:


    +   - HELIX^5

    - Knoppix^6

    - BackTrack 2^7

    - Penguin Sleuth^8

    - INSERT^9


    When a bootable OS would be depends on the situation. If for some reason a resident
    version of Linux is not available on the forensic system, any one of them can
    be used locally, or within VMware session. The same holds on the target. If the
    investigator feels more comfortable with a Linux-based system, or if for reason
    your normal attempts at Windows image acquisition has failed, any of these OSes
    can be used. As stated earlier, one of the key components to being prepared is
    to have multiple tools in the forensic toolbox can be used to gather data. The
    key is to test them all in a laboratory environment to ensure that troubleshooting
    the OS does not take place at the customer location.


    The following section provides a high level overview of each of the bootable OSes
    provided, as well as any special functions that the investigator may need to know
    to acquire a dd image.


    # Helix


    Helix 1.9a is a Knoppix-based system running a 2.6.14-Kanotix-9 Linux kernel.
    When HELIX begins the boot process, the user will be prompted for which version


    > 5 www.e-fense.com/helix/

    6 www.knopper.net/knoppix-mirrors/index-en.html

    7 www.livedistro.org/release-announcements/gnu/linux-releases/backtrack

    8 http://penguinsleuth.org/index.php?option=com_wrapper&Itemid=39

    9 www.inside-security.de/insert_en.html'
