  md: '# Chapter 3 • Live Response: Data Collection


    systems, networks, and applications are sufficiently secure.” (Grance,T., Kent,
    K., & Kim, B. January 2004).


    At this point, the customer is invariably concerned about the implications of
    the investigation, possible media leaks, and the potential of regulatory compliance
    violations. It is therefore extremely important for the investigator to remember
    not to formulate any opinions about what may or not have happened. Follow in the
    footsteps of Joe Friday and stick to the facts!


    From my experience, customers are desperate for answers, and in their desperation,
    they can sometimes be quick to jump to conclusions in an effort to provide some
    kind of information to their senior management as quickly as possible. Be careful
    not to be influenced to provide misleading information. As forensic analysts,
    it is your job to gather the forensic information as the customer views, document
    it, and move on to the next phase in the investigation. Make no promises, but
    take steps to reassure the customer, and let them know that you will do everything
    you can assist them.


    In the case logbook, document the following steps:


