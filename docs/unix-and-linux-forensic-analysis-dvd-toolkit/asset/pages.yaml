  md: '# Chapter 5 • The Hacking Top 10


    to communicate. Use the customer administration staff to help you to determine
    what is considered “normal” activity and what is not.


    It is also a pretty safe assumption that if you find these utilities on a system,
    it was not the primary target of the attack. There is a bigger fish out there
    the customer wire that the attacker is trying to find. Would again be a point
    in which the customer’s Information Technology (IT) staff can help you with a
    network diagram, and what they would consider to be the high value targets; usually
    something with juicy data on credit card numbers, personally identifiable information,
    or proprietary information (like research). Remember, this is not always going
    to be the case. The host that was used for scanning may lead to several others
    that were used in the same manner to identify other targets.You will really have
    to be diligent in your analysis of the customer’s system and network log files.


    # Wireshark


    I am beginning to think that my title of “The Hacking Top 10” is not a very appropriate
    title, although Wireshark does appear #2 on the top 100 network security tools
    survey. The first three tools that I mentioned and described are not what one
    would think of as traditional hacking tools. They have legitimate uses by legitimate
    IT professionals, right? How can they, and now Wireshark be in the Hacking Top
    10? Well, simply stated, that we is the whole point of hacking. Making something
    something in a way in which the developers never intended.


    In this case, Wireshark,* formerly known as Ethereal, is a utility that can sniff
    network traffic in TPC dump format and display that information in a nice, colorful
    table. So wouldn’t it be just a utility used by the network administrators to
    perform some aspect of their daily activities? If Wireshark was installed on a
    system? Maybe, but then again, maybe not. Again, this is where the customer’s
    IT staff will help you to understand what is considered “normal.” If you find
    Wireshark on a system, and the administrators tell you it should not be there,
    then you have something worth looking into.


    By default, Wireshark installs into /usr/bin and has a block size of 1294568.
    While its primary use is for network troubleshooting, like so many other tools,
    it can be used for so much more. Its usage really depends on what the user is
    trying to do.


    > * www.wireshark.org/'
