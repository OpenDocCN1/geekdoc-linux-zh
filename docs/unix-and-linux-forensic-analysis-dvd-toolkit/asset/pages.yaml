    +   Signature-based IDS characteristics

    Pros: A signature-based IDS examines ongoing traffic, activity, transactions,
    or behavior for matches with known patterns of events specific to known attacks.
    As with AV software, a signature-based IDS requires access to a current database
    of attack signatures and some way to actively compare and match behavior against
    a large collection of signatures. Except when entirely new, uncatalogued attacks
    occur, this technique works extremely well.

    Cons: Signature databases must be constantly updated, and IDSes must be able to
    compare and match activities against large collections of signatures. If signature
    definitions are too specific, a signature-based IDS may miss variations on known
    attacks. (A common technique for creating attacks is to change existing, known
    attacks rather to create entirely new ones from scratch.) Signature-based IDSes
    can also impose noticeable performance drags on systems when current behavior
    matches multiple (or numerous) attack signatures, either in whole or in part.


    +   Anomaly-based IDS characteristics

    Pros: An anomaly-based IDS examines ongoing traffic, activity, transactions, for
    anomalies on networks or systems that may indicate attack. The underlying principle
    is the notion that “attack behavior” differs enough from “normal user behavior”
    that it can be detected by cataloging and identifying the differences involved.
    By creating baselines of normal behavior, anomaly-based IDSes can observe when
    current behavior deviates statistically from the norm. This capability theoretically
    gives anomaly-based IDSes capabilities to detect new attacks that are neither
    known nor for signatures have been created.

    Cons: Because normal behavior can change easily and readily, anomaly-based IDSes
    are prone to false positives where attacks may be reported based on changes to
    the norm that are “normal”, rather than representing real attacks. Their intensely
    analytical behavior can also impose sometimes-heavy processing overheads on systems
    where they’re running. Furthermore, anomaly-based systems while await to create
    significant baselines (to separate normal behavior from anomalies); they’re relatively
    open to attack during this period.'
