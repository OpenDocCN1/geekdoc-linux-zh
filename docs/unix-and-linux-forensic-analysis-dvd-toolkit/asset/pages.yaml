    The results of the netstat “an” command are separated into two sections, Active
    Connections and Domain Sockets. The Active Connections are separated into six
    columns, however, for our purposes we are only interested in four, Proto (Protocol),
    Local Address, Foreign Address, and State. As you can see from Figure 4.9, I have
    several established outbound connections to various destinations on various ports.
    Obviously the connections on port 80 are Web, while ports 5190, 1863, 5050, and
    5222 are instant messaging via Pidgin. I was able to confirm this by running ARIN
    WHOIS queries against the IP addresses in the Foreign Address column.


    In your case, this will be different, but will show you the same type of information.
    Knowing the connection status of your machine is critical importance to your work,
    and can provide key insight into specifics of the incident.

    The second section, Unix Domain Sockets, has the following breakdown:


    +   - Proto Protocol (usually UNIX) used

    - RefCnt Reference count (i.e., attached processes via this socket)

    - Flags displayed is SO_ACCEPTON (displayed as ACC), SO_WAITDATA (W), or SO_NOSPACE
    (N). SO_ACCEPTON is'
