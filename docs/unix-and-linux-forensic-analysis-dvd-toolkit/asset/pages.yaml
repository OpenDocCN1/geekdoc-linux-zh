    # Weighing IDS Options


    In addition to the various IDS vendors mentioned in the preceding list, judicious
    use of a good Internet search engine can help network administrators identify
    more potential IDS suppliers than they ever have the time or inclination to investigate
    in detail. That''s why we urge administrators to consider an additional alternative:
    deferring some or all of the organization''s network security technology decisions
    to a special type of outsourcing company. as managed security service providers,
    or MSSPs, these organizations can help their customers select, install, and maintain
    state-of-the-art security policies and technical infrastructures to match. Law
    enforcement professionals may find these organizations to be particularly knowledgeable
    sources for information, help, and support when tackling technology questions
    or teasing apart IT puzzles.


    # IP Spoofing and Other Antidetection Tactics


    Despite your best efforts to backtrack unwanted e-mail or attack traffic, sometimes
    you will still be unable to determine its real source or identify the person or
    persons behind that activity. The primary reason for the phenomenon is that hackers
    typically generate network traffic or messages that contain fabricated data for
    the source address, port numbers, protocol IDs, and other information that normally
    permits such information to be conclusively associated with an originating IP
    address, if not also an originating process identifier (and by extension, the
    user or service responsible for creating that process). This is a deliberate and
    calculated technique to prevent identification of attackers and to deflect interest
    from the real source of such traffic to unwitting or uninvolved third parties.


    The most common form of spoofing occurs when attackers try to insert fabricated
    traffic or messages that purport originate inside a local network through an outside
    interface. That explains why the most common antispoofing rule enforced at most
    screening routers and firewalls is to drop any packets that arrive on an external
    interface'
  merge: -1
  img_proc: true
- pgno: 225
  md: '# Implementing Cybercrime Detection Techniques on Windows and *nix Appendix
    A 29


    that report an originating address that should appear only on an internal interface.
    Other forms of spoofing may be detected by a traceback or reverse DNS lookup to
    compare domain names and associated IP addresses (when that is available) and
    dropping all packets where these information items show no correlation (as when
    the reported IP address originates outside the range of addresses assigned to
    the organization from which it claims to originate).


    The real problem with spoofed traffic occurs when IDS or human administrators
    try to follow the traffic back to its source and various types of deands. Recall,
    for example, that various types of DoS or DDoS attacks rely on compromised intermediate
    computers, sometimes called zombies or agents, and you''ll quickly understand
    why tracing back to their source can''t always identify attackers. When you determine
    that certain attacks originate, you may only be able to identify victims rather
    than finding a “smoking gun” points to an attacker. The savvier and more sophisticated
    hacker who perpetrates an attack, the less likely is that he or she will provide
    direct clues that lead to his or her primary presence on the Internet. Rather,
    your identification efforts will lead you a trail of intermediaries, cut-outs,
    and anonymizer services, each of which you must then investigate to look for clues
    to the identity of the mastermind behind the cyberimes you are pursuing.


    Numerous sources for information about spammers and attackers are available online;
    we mention only a couple of examples here. To find more, use a good Internet search
    engine to search on strings such as spam database, attacker database, spam prevention,
    and so forth:


    +   List of all known DNS–based spam databases: www.declude.com/junkmail/support/ip4r.htm'
