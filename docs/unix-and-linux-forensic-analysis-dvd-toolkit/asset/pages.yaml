- pgno: 65
  md: '# Chapter 3 • Live Response: Data Collection


    On the forensic system, validate your share is being exported:


    ```

    showmount -e

    ```


    On the target system, mount the forensic share point:


    ```

    mount -t nfs 10.0.0.1:/media/disk/IBM/customer_host (target directory)

    /mnt/foo (local directory)

    ```


    Verify your NFS mount point on the TARGET system:


    ```

    mount

    ```


    An entry should now be at the bottom of the mount list which looks something like
    this:


    ```

    10.0.0.1:/media/disk/IBM/customer_host on /mnt/foo type nfs

    (rw,addr=10.0.0.1)

    ```


    This may fail for several reasons, the most common of which are desktop firewalls,
    improper eth0 configurations, bad media (i.e., a bad cable), or the NFS service
    needs to be restarted. If this is the case, attempt to unmount your NFS share,
    restart the NFS service, and try mounting again. If for any reason mount fails,
    move on to the next method of acquisition. The role of a forensic investigator
    is to gather data, not troubleshoot OS problems. In the case logbook, and follow
    up later in a laboratory environment.


    Now that the mount point has been created and is working properly, cd into that
    directory and test the connection. The easiest way to do this is to simply “touch
    foo.” The touch command will make a small, empty file called “foo.” Ensure that
    this file can be seen on both systems before proceeding. Ensure that the file
    “rm -rf foo” is removed, and continue with the acquisition.


    To ensure the integrity of the image, an MD5 hash of the local file system will
    need to be calculated. To do this, simply issue the following command:


    ```

    md5sum /dev/hda > outfile

    ```


    Capture this value and copy it to your forensic laptop via the mount point. I
    normally create a directory named, <hostname>_<drivename>_MD5, and drop the MD5
    out there.


    Having successfully completed all preliminary steps, the imaging process can now
    be initiated. On the target system, the command is:


    ```

    dd if=/dev/hda (perfect world example) of=/mnt/foo

    ```'
