- pgno: 11
  md: '# Chapter 1 • Introduction


    # History


    2007, I completed my Master''s Degree in Information Security from Capella University.
    As an Incident Response Analyst by trade, I figured that writing my thesis on
    UNIX forensic analysis would be a good topic, relevant to my job duties and my
    course work. With Harlan Carvey being a colleague of mine, you would think I would
    just write something on Windows forensics and ask him for help. However, this
    was my thesis, and I wanted to do something that would challenge me, so I chose
    to write my paper on UNIX forensic analysis.


    After about a day of research, I found that my original scope would have to be
    narrowed drastically. This was due to the vastness of the sheer concept of UNIX
    forensics, and the fact that there were nothing on it (at least I could find)
    anywhere. I did find some really good articles and white papers by Barry Grundy,¹
    Mariusz Burd,² and Holt Sorenson,³ I also found that there were some chapters
    in books like “Incident Response: Investigating Computer Crime”“Hacking Exposed:
    Computer Crime: Forensics” by Davis, Philipp, and Cowen, and “Digital Evidence
    and Computer Crime: Forensic Science, Computers, and the Internet,” by Casey,
    but nothing wholly dedicated to UNIX.


    At the time I wrote my thesis, I had no idea how many UNIX variants existed. I
    know personally I have worked with, Solaris, AIX, HP-UX, BSD, Tru64, and several
