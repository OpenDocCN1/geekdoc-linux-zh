- pgno: 53
  md: 'In the case logbook, create an entry titled, “Volatile Information.”This entry
    should contain a system profile to include:


    +   * OS type and version

    * System installation date

    * Registered owner

    * System directory

    * Total amount of physical memory

    * Installed physical hardware and location

    * Installed software applications


    Once the system profile information has been captured, use the script command
    to use the system to capture the input and output history.This command will start
    recording everything going to and coming from Standard-In (stdin) and Standard-Out
    (stdout) and dump it into an American Standard Code for Information Interchange
    (ASCII) text file called “typescript” in the current working directory. This file
    will help the investigator recall what he was doing and what the results were.
    Timestamps can be used throughout the file by issuing the “date” command either
    at regular intervals, or each time a different command is executed. To stop the
    recording process, press Ctrl-D.


    Volatile information only resides on the system until it has been rebooted. Once
    the system is shut down for any reason or in any way, the volatile information
    as existed at the time of the incident is gone. First responders have been historically
    trained to simply pull the power cable from a suspect system in which further
    analysis is to be performed.


    Circumventing the normal shut sequence can accomplish several tasks that can be
    advantageous to the analysis. If the intruder has replaced one or more files involved
    in the shut down process with nefarious ones, they will obviously not get executed.
    Also, files that are currently being written to, or files that have been marked
    for deletion will not process correctly, and can therefore be retrieved and analyzed.
    However, much of the key volatile data such as network connections, currently
    running processes, and logged in users will be lost. This is therefore, obviously
    not the best-case scenario for the forensic investigator, however, in the real
    world, it is something that will need to be dealt with. If you are the investigator
    engaged prior to the system being shut off, you should'
