- pgno: 98
  md: '# Initial Triage and Live Response: Data Analysis • Chapter 91


    on unconnected sockets if their corresponding processes are waiting for a

    connect request. The other flags are not of normal interest.


    +   **Type** Types of socket access:

    - **DGRAM** Used in Datagram (connectionless) mode

    - **STREAM** Stream (connection) socket

    - **RAW** Raw socket

    - **RDM** Reliably-delivered messages

    - **SEQPACKET** Sequential packet socket

    - **PACKET** RAW Interface access socket


    +   **State**:

    - **FREE** Not allocated

    - **LISTENING** Listening for a connection request. Those sockets are only

    displayed if the -a switch is set.

    - **CONNECTING** About to establish a connection.

    - **CONNECTED** Connected.

    - **DISCONNECTING** Disconnecting.

    - **(empty)** Not connected to another socket.


    The last two columns are I-Node and Path, which identify the process attached

    to the socket. Since there are likely to be a whole slew of entries, and you will

    have no clue which ones are normal and which are not, be sure to get with the

    customer''s system and network administrators to help you establish a baseline
    of

    “normal” operating parameters. Additionally, simply using an Internet search engine

    will provide you with good information regarding the nature of a process. Since

    there are so many, this should be reserved only for processes that stand out as
    being

    pentially outside of what the customer administrator teams determine to be

    normal.


    The netstat command with the “-rn” switch will display the hosts’ routing table.

    (See Figure 4.10.)'
