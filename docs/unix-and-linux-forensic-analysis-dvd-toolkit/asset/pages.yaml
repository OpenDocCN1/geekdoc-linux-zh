  md: '# Live Response: Data Collection • Chapter 3 47


    strongly recommend that the system be removed from the network (pull out the network
    cable) and left alone until on-site volatile information gathering can take place.
    Incidentally, the commands used for gathering the aforementioned data are “uptime”
    to determine the time of the last reboot, “who” for current users logged into
    the system, and “last” for a brief history of users have recently logged in.


    The first round of information gathering steps is focused on retrieving the administrative
    pieces of information. By using the “uname” command, you will be able to view
    the machine name, network node, type of processor, OS release, and OS version.
    Although it is important to ensure you are performing the investigation on the
    correct machine. Defense attorneys, when faced with computer forensic evidence,
    will stop at nothing to try and sway a jury that the information you have gathered
    is in some way. By not documenting the hostname of the machine, you are opening
    up your evidence to undue questioning such as “How do we know that this information
    really came from the computer system in question?


    The current system time and date of the host can be determined by using the “date”
    command. This information is important to the investigation, as the local and
    system time may differ. It is also important to note that when working cases with
    larger customers, the servers within the scope of the investigation may be physically
    located in different time zones.


    > NOTE

    As a real-world example, I recently worked a case in which the Virtual Private
    Network (VPN) logs generated by the VPN concentrator were stored at a different
    physical location that was located in the Mountain Time zone, while the server
    in question was located in the Eastern Time zone. This information became important
    to the case as correlations had to be made regarding a specific user was connected
    to the network via the VPN, and when that user accessed the server in question.
    If the changes in time zones were not taken into account, correlations would not
    be properly made, and critical evidence would be missed.


    Knowing which connections are being made to the host and emanating from the host,
    is of vital importance to the investigation and can be obtained by using the “netstat”
    command with the “-an” and “-rn” switches. This information can tell an


    ![](img/fd8e85097b37559dbc07dc22fd8cb1fe_54_0.png)'
