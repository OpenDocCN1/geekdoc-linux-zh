    approaching, or it may be terabytes of data, in which case you should probably
    take the aspirin anyway, as that same headache is rapidly approaching.


    Start at the beginning. It is the simple notion that in any incident, the intruder
    has to get onto the customer network from somewhere, so there. It may be a Virtual
    Private Network (VPN) concentrator, it may be a satellite office, and it may be
    from a specific workstation or server. Whatever the case be, start there.


    Log files on Linux systems can be wonderful things. They are highly configurable,
    efficient, and detailed. With any luck, the system you are gathering and/or analyzing
    logs has at the very least, the default configurations for logging in place. Linux
    logs are in plain text, so you will not need to use any third-party software or
    utilities to perform effective searches. Additionally, you can write custom scripts
    to perform automatic actions based on the content of the logs, and your desired
    output.


    Linux logs are located in the /var/log directory. These are the log files maintained
    by the system, and more than likely (and usually by default), from any third-party
    software that has been installed into the system. You will also see files in the
