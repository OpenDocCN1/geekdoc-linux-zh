    ```

    cat: foo: Permission denied

    ubuntu@ubuntu:~$ chmod u+r foo # Add back user/owner permission

    ubuntu@ubuntu:~$ ls -l foo

    -r--r--r-- 1 ubuntu ubuntu 0 2008-04-14 20:25 0

    ubuntu@ubuntu:~$ cat foo # And now we can read again, but it''s a blank file

    ubuntu@ubuntu:~$

    ```


    In addition to this read, write, and execute permissions we''ve explored in the
    example, *nix also has the notion of “set UID” and “set GID” permissions for files.
    There is no analogous file attribute in New Technology File System (NTFS) or File
    Allocation Table (FAT) in Windows. What these executable files change the effective
    user ID or group ID to something that program is executed. The security ramifications
    of this can be serious, these are very important in forensic analysis, because
    these permissions allow an executable to run as another user, regardless of who
    runs the program. For instance, many commands that require privileged access to
    hardware are set user ID root, indicated by “s” in the “user/owner” position of
    the permissions:


    ```

    ubuntu@ubuntu:~$ ls -l /bin/ping

    -rwxr-xr-x 1 root root 30856 2007-07-06 02:40 /bin/ping

    ```


    When /bin/ping is run by any user, it runs as the superuser (root).

    One thing you don''t want to find on a system is an Set User ID (SUID) root copy
    of /bin/bash, or any other shell. The ramifications are somewhat obvious. Any
    user who would execute such a shell may become root. Modern shells have built-in
    protections against this classic attack, but all the SUID root copies of shells
    should be a red flag to a forensic investigator.


    This युवाओ of file permissions is very important. File permissions are defined
    in terms of:


    +   - Owner permissions (u, can the user/owner read, write, or execute this file?)

    - Group permissions (g, can the group read, write, or execute?)

    - World permissions (o, can others on the system read, write, or execute?)

    - SUID/SGID permissions (s, when this executes, will we change the effective user
    ID or group ID?)


    Read and write permissions are fairly intuitive. Execute permissions, on the other
    hand, don''t really exist in the Windows world. *nix, if a file is to be interpreted
    as a shell script or an executable program, the execute bit must be set for a
    role to


