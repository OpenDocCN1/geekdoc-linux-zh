    # File Systems


    In Windows, life is rather simple in the file system realm.You had only two--disk
    file system to worry about (FAT and NTFS), and a few generations with each. The
    FAT side of the house (which you only seem to find on removable drives these days),
    FAT32 rules the root. We fondly recall the old days of FAT16 and its cut 2-4GB
    maximum partition size. FAT32 gives us a more volume size to play with up to 2–8TB,
    but is hamstringed by 4GB file sizes that cause video and database masters to
    wrinkle their noses. In addition, none of the FAT variants supported a notion
    of file permissions, which made them a non-starter for the enterprise.


    NTFS and its five revisions since the days of Windows NT 3.1 addressed the permissions
    concern, as it has very flexible support for file access control lists (ACLs).
    NTFS also added journaling to the filesystem, which makes the NTFS file system
    more robust against corruption caused by power interruptions or the dreaded yanking
    of an external drive without properly ejecting it. As such, we don''t have to
    run scandsk or chkdsk often as we recall calling back in the old days of Windows
    95/98. More interestingly to forensic investigators was NTFS''s inclusion of alternate
    data streams (ADS) where the bad guys can hide data from priming eyes.


    In Linux, things are more complicated on the filesystem front because it supports
    many file systems. Linux''s list of supported file systems includes FAT16, FAT32
    in a few flavors, and NTFS in a few flavors. Linux''s native file system is ext2.'
