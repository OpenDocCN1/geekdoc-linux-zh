    The fields in the passwd file are


    +   1. Username (deprecated in favor of /etc/shadow)

    2. Hashed password field

    3. User ID (UID)

    4. Primary group ID (GID) – Note that a user can belong to any number of groups.
    This information is stored in /etc/group

    5. GECOS comment field – Generally used for a full username or a more descriptive
    name for a daemon account

    6. User’s home directory

    7. Shell/program to run upon initial login


    As you can see, this field is fairly dense, even on a single-user system. An old
    trick that is still seen in the wild is to add an additional UID 0 user somewhere
    in the middle of the daemon accounts pays no pays attention to. Note that any
    user with UID 0 is the functional equivalent of root. /etc/group is in a similar
    format, with fewer fields:


    ```

    root:x:0:root

    bin:x:1:root,bin,daemon

    daemon:x:2:root,bin,daemon

    sys:x:3:root,bin,adm

    ```'
