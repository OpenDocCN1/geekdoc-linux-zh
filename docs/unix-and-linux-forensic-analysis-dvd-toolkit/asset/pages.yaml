- pgno: 190
  md: '# Introduction


    One of less technical, yet helpful steps of a forensic investigation is to scan
    the acquired images for malware, specifically viruses, worms, and Trojan Horses.
    While malware discovery may not be the primary reason for the forensic investigation,
    frequently I have found that the systems involved in an incident are infected.
    This may be completely coincidental, or the result of a directed attack. Either,
    performing a comprehensive malware sweep can produce leads, which may lead to
    specific answers about the incident.


    I have used a combination of open source and proprietary utilities including:


    +   - Gargoyle Investigator Pro

    - F-Prot

    - ClamAV Antivirus

    - Panda Antivirus

    - Symantec Antivirus

    - McAfee Antivirus

    - AVG Antivirus

    - Kaspersky Antivirus

    - Trend Micro Antivirus


    While this is not something that needs to be covered in depth, I think it adds
    value to an investigation, and therefore at least merits a brief paragraph or
    two.


    I equate performing malware sweeps to the early stages of a police investigation
    from <insert cop shop of choice>. The police go around the neighborhood asking
    questions of the locals, seeing if anybody saw or heard anything. Hollywood theatrics
    aside, the crux of the matter is that they canvas the crime periter, looking for
    people that match some kind of description or profile. When they find that person
    of interest, they probe deeper to see if they are really the bad guy, or simply
    an individual who happens to match their known criteria.


    The operation of on-demand malware scanning is conceptually similar. You have
    a known piece of malware that company X figured out leaves a specific electronic
    footprint. So you slap that footprint into a database of sorts, and you all of
    the files on a system looking for footprints that match the ones in the data file.
    When the program finds something that matches the criteria, it reports it. It
    is then'
  merge: -1
  img_proc: true
- pgno: 191
  md: '# Malware • Chapter 8


    the responsibility of the user to make the determination if the file of interest
    is really a bad guy, or if it''s just a file that matches the criteria.


    The police lead generates asking questions during an investigation. They then
    follow up on these leads to see if they produce any significant results. In the
    same way, malware scans can generate leads that may be useful in identifying various
    key elements in the incident or compromise. So, while this process will be by
    no means solve the case for you, it can be useful in providing you with follow
    up items that may prove to be important later.


    # Viruses


    My research Linux viruses reminded me of why I have such a deep adoration for
    the Linux user community. I literally was ROFL at the vast majority of the posts
    that I read all communicated the same thing: if you are a Linux user and you get
    a virus, you are stupid.


    Not satisfied with the brevity of that statement, I continued my whimsical search
    through the various security and user forums in an attempt to find the smoking
    gun that would illustrate once and for all viruses were possible on Linux systems,
    and anybody could get them. I found that while several worms and viruses had been
    identified throughout the years such as Ramen, li0n, Red Worm, Adore, Ipdw0rm,
    Slapper, Flooder.Linux.Small.f, and Zipworm, the common thread that they all required
    some kind of user interaction or administrative laziness.


    It is a common belief that Linux systems are not vulnerable to infection by malware.
    This is false; however, one can say that malware infections are not nearly common
    as in Linux as they are on Windows machines. The reasons for this are a mix of
    technical and economic. Economically, if a malware or adware is interested in
    revenue and adding hosts to their botnet, the sheer popularity of Windows makes
    it a better use of time to write for that platform the comparatively less popular
    Linux or Mac platforms. Technically, the Linux system is organized, and the diversity
    of distributions in Linux with all a slightly different way of installing software,
    easily makes things more difficult for someone wanting to write self replicating
    code, or a quickly/easily installed backdoor from a drive-by download. Linux doesn''t
    have a dangerous ActiveX–enabled Web browser installed by default, unlike Windows
    with Internet Explorer, and finally Linux users don''t log in with Administrator
    privileges and do all their work that, unlike the default installations of Windows.


    www.synergy.com'
  merge: -1
  img_proc: true
- pgno: 192
  md: '# 186 Chapter 8 • Malware


    In short, for a malicious program to get installed on a Linux system, generally
    several variables need to line up for an infection to occur. For example, it is
    possible that a box could get infected by a buffer overflow of an executable,
    like a media player. I could send a link to Todd that stated something like, “check
    out my super sweet porn.. Provided he was foolish enough to click on my link without
    doing any sort of research into what was going, the link could point to a maliciously
    crafted file that exploits an unhandled buffer overflow in his movie player. So
    far, we need Todd to be running a vulnerable movie player, and we also need to
    know exactly what he’s playing, or get lucky that he was running the one for the
    bad guys wrote the malicious movie file. Unlike Windows, there isn’t a single
    always-installed player like Windows Media Player that you’re likely to find on
    every single Linux system. Furthermore, even if Todd were running a vulnerable
    movie player that was prone to this buffer overflow vulnerability, it’s important
    to note that despite the media player’s vulnerability to the issue, if it were
    running on Linux with a non-executable stack, the attack would still fail. However
    provided that was not the case and the user assistance occurred, they could gain
    access to the user ID from Todd had launched his Internet browser, presumably
    Todd’s individual ID. Unlike in Windows, this individual account is unlikely to
    have root/administrator privileges alone, so the attacker still does not have
    complete control of the system. At that point, provided that the system was not
    patched against any known user escalation vulnerabilities, code could be executed
    that could provide the attacker with root privileges.


    I realize that this is a lot of “what if,” but the potential is there. Just like
    I could “potentially” walk out my front door and get smashed by a meteoroid, it’s
    not likely, but it is possible. Linux, like all of the *n variants, operates within
    a nebulous realm of security that the more advanced users understand, and n00bs
    are trying to understand. I know this is an odd statement, let me explain what
    I am referring to. In Linux, everything is treated like a file, with no exceptions,
    and files have permissions of either read (numerically assigned the number 4),
    write (numerically assigned the number 2), and execute (numerically assigned the
    number 1). These permissions are listed by the user(s) to which apply, from left
    to right, root, the owning group, and everybody else. For example, a file called
    “Foo” could look like this:


    ```

    Foo 744

    ```


    which means that the file called “Foo” has read, write, and execute permissions
    for the root user, but has read permissions for the owning group and for everybody
    else.


    ![](img/fd8e85097b37559dbc07dc22fd8cb1fe_192_0.png)'
  merge: -1
  img_proc: true
- pgno: 193
  md: '# Malware • Chapter 8


    Going back to our example of Todd clicking on the bad link, if that link had something
    nefarious on the other end, and was able to infect his Linux system, any processes
    that were spawned by the malware would be tied to Todd''s user account, and therefore
    only possess his level of access on the system. In addition to our knowledge of
    how file permissions work, let me add one thing. The critical operating system
    files are all owned by the root user, and cannot be accessed by a normal user
    unless they have special permissions in place via sudo, which turns into another
    matter entirely; since sudo access requires a password. While a single user ID
    may be used in an, without the sudo password, administrative commands would still
    not be able to execute. So, because of the Linux protects themselves with these
    permissions, the malware would not be able to do anything that the user could
    not do, and nothing that root could do. While he might be able to do annoying
    things like ping other hosts, or maybe open a connection to another box via Secure
    Shell (SSH) or File Transfer Protocol (FTP), it could not do anything that would
    be damaging to any other patched and well-configured system.


    The only caveat is that if Todd were really stupid, and clicked on the bad link
    as the root user. Then, any malware that was executed by the system would have
    privileges, and any Linux with a clue could not browse the Internet as root, and
    if one did, they got a virus before it, it''s their own fault.


    As a Linux user, the key thing to remember is to not run untrusted binaries. Now
    you might be thinking, what if I download something I think is trusted, but ends
    up Trojaned?


    Again, while this is a possibility, it is not very likely for two reasons. The
    first is that in my experience, hackers and malware coders use Linux in some form.
    There is almost an honor among those that we don''t attack ours. Now, understand
    that loyalty to the brand may be completely overshadowed by potential gain. If
    the target of an attack is primarily a *nix shop, and the bad guys want the information
    contained on those systems, then it will not matter what operating system they
    are running. They will attack *nix as quickly as they would Windows, Albeit probably
    a bit more begrudgingly, and almost less quickly.


    The second reason is that the open source community is extremely vigilant when
    it comes to their code. For example, in January 1999, Wietse Venema''s key Transmission
    Control Protocol (TCP) Wrappers package was found to have been Trojaned. However,
    there was no report of an outbreak due to the fact that the target users check
    the Pretty Good Privacy (PGP) signatures on upstream source code releases. This
    particular


    ![](img/fd8e85097b37559dbc07dc22fd8cb1fe_193_0.png)'
