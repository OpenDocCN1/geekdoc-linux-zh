  md: '# 156 Chapter 6 • The /Proc File System


    environment, endian issues, or are pre-compiled for a different processor/architecture
    than you are currently operating.


    # diskstats


    This is one of two locations where disk statistics are available on a system running
    a Linux 2.6 kernel. The fields you will most likely be interested in are the sixth
    and tenth field, which are sectors read and sectors written, respectively.


    ```

    8 0 22531 10352 831767 190793 4858 32486 298844 392022 0 63941 584743

    ```


    This data is helpful when troubleshooting through throughput issues, hopefully
    you will never have to do.


    # driver/rtc


    This file provides data from the real time clock (rtc), the circuit that keeps
    time while the system is shut off (and of course, continues to keep time while
    the system is on):


    ```

    rtc_time : 20:30:22

    rtc_date : 2008-04-02

    rtc_epoch : 1900

    alarm : 00:00:00

    DST_enable : no

    BCD : yes

    24hr : yes

    square_wave : no

    alarm_IRQ : no

    update_IRQ : no

    periodic_IRQ : no

    periodic_freq : 1024

    batt_status : okay

    ```


    # filesystems


    This file lists the file systems currently supported (in one manner or another)
    by the kernel. Additional file system support may be available in modules that
    are currently inserted into the running kernel. Additionally, the presence of
    a file system in this list does not indicate whether the read-write access is
    available.


    Virtual or pseudo-file systems will be preface with “NODEV,” indicating that they
    do not require a physical device (procfs, for example.)


