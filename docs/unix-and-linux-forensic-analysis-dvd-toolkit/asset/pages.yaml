  md: 'Even with the current kernel and the requisite drivers for NTFS support, caution
    should be used when writing to an NTFS partition. If the case that is being worked
    could end up in litigation, the ext2 or ext3 file system should be used on the
    target media. A knowledgeable defense attorney will know that the drivers are
    not good, and could easily bring your evidence under scrutiny by the jury.


    # BackTrack 2


    According to the BackTrack2 homepage,10 “BackTrack is the most top rated linux
    distribution focused on penetration testing. With no installation whatsoever,
    the analysis platform is started directly from the CD and is fully accessible
    within minutes.


    It evolved from the merge of the two widespread distributions Whax and Auditor
    Security Collection. By joining forces and replacing these distributions, the
    BackTrack could gain a massive popularity and was voted #1 in 2006 at insecure.org.
    Security professionals as well as newcomers are it as their favorite toolket all
    over the globe.


    New exciting features in BackTrack 2 include:


    +   - Updated kernel 2.6.20, with several patches.

    - Broadcom-based wireless card support

    - Most wireless drivers are built to support raw packet injection

    - Metasploit2 and Metasploit3 framework integration

    - Alignment to open standards and frameworks like ISSAF and OSSTMM

    - Redesigned menu structure to assist the novice as well the pro

    - Japanese input support-reading and writing in Hiragana / Katakana / Kanji. [...]


    No commercial or freely available analysis platform offers an equivalent level
    of usability with automatic configuration and focus on penetration testing. See:


    +   - http://remote-exploit.org/backtrack.html

    - http://mirror.switch.ch/ftp/mirror/backtrack/bt2final.iso


