    # # *nix file system Structure


    As you''ve surely noticed, the first thing that sticks with *nix neophytes (n00bs)
    is that:


    +   - *nix doesn''t use drive letters

    - Unix pathnames use forward slashes (/) and not backslashes (\)


    / is the top level of the *nix directory structure. There isn''t really a Windows
    equivalent for this concept. While Windows does have a notion of a root directory,
    it''s local to the drive you''re on (e.g., c:\). There isn''t a directory in Windows
    you can go to show you the top of the world, as it were.


    Like many *nix concepts, this is best learned by example. Let''s look at the root
    directory:


    ```

    ubuntu@ubuntu:~$ ls /

    bin cdrom etc initrd lib mnt proc root srv var tmp

    boot dev home initrd.img media opt rofs sbin sys usr vmux

    ```


    There''s no \Program Files, no \Windows or \Winnt and no boot.ini. Here''s what
    we do, and general statements about them that will help you find more at home:


    +   /bin (short for binary) is where you''ll find many of the commands you were
    introduced to in the last section. /sbin is simple, but for commands that only
    root should be running. /usr/bin and /usr/local/bin are other places to find binary
    files. "commandname" is a command you can run to find out where any command actually
    lives in the file hierarchy.'
