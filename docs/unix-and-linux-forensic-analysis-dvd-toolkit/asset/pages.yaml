    You may also want, or need to acquire the image by means of a network cable. If
    this is the case, the physical setup is the same as outlined above with a few
    additional steps. Connect your source machine to your destination machine with
    a crossover cable. On the source machine (Linux), configure the IP address with
    a non-routable address, for example, 10.0.0.1. On the target machine (Windows),
    navigate to Start | setting | control panel | network connections. The Ethernet
    adapter is being used by the cross-over cable, click on it, and select Properties.
    A pop-up menu will appear. In the middle section, "This connection uses the following
    items: [sic]," scroll to the bottom and select TCP/IP, and click Properties. Select
    the radio button labeled, "Use the IP address", and enter 10.0.0.2, with a netmask
    of 255.255.255.0. The fields for DNS can be blank, as they will not be needed.
    Restart LinEn, and start the server. Restart EnCase on your Windows machine and
    click Add Device from the EnCase toolbar. In the pop-up menu, place a blue check
    mark next to Network and click Next and then select the device you want to examine
    (presumably, there will be only one), and click Next, and then click Finish. This
    will preview the drive information only.


    To acquire the device being previewed, in the left pane, right-click on the device
