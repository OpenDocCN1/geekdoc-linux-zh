- pgno: 145
  md: '# Chapter 5 • The Hacking Top 10


    really have use event correlation and pray that the customer logs incoming Web
    requests. If not, a proficient Paros attacker may slip past you.


    # hping2 - Active Network Smashing Tool


    With a name “Active Network Smashing Tool,” you know that this can’t be good!
    Hping2 is a tool that is used to send customer Control Message Protocol (ICMP)/TCP/UDP
    packets at a target host, with ICMP, and comes in #6 of the top 100 network security
    tools survey. It can also handle fragmented packets, arbitrary packet body and
    size, as well as be used to transfer files under unsupported protocols. Hping2
    can be used to:


    +   - Test firewall rules

    - Perform spoofed port scanning

    - Test network performance

    - Perform path Maximum Transition Unit (MTU) discovery

    - Transfer data across even the most restrictive firewall rules

    - Run traceroute (on non standard protocols)

    - Remove OS fingerprinting

    - Audit TCP/IP stacks


    Let’s back up for a minute to look at what we are dealing with here. We have a
    command-line utility, which can pretty much do whatever the user can do with data
    packets, available to everyone, everywhere via www.hping.org/download.php. I’m
    sure that the developer, Salvatore Sanilippo, did not intend to create the network
    equivalent of Frankenstein’s monster. However, he did. As a security professional
    and forensic investigator, there is no single tool that I fear more than this
    one.


    Let’s take a look at a basic example. My Ubuntu 7.10 host (Forensic1) has an IP
    address of 192.168.10.117, my Fedora Core 8 host (Forensic2) has an IP address
    of 192.168.10.120. Using hping2, I issued the following command, “hping2 192.168.10.120
    -V -1 -a 192.168.10.200 -K 8.” This command calls hping2 to be verbose (-V), enter
    mode 1 (ICMP), spoof the source address (-a) with 192.168.10.200, and use ICMP
    (-K 8, ICMP echo request). (See Figure 5.24.)'
  merge: -1
  img_proc: true
- pgno: 146
  md: '# Figure 5.24 Spoofing the Source Address


    ![](img/fd8e85097b37559dbc07dc22fd8cb1fe_146_0.png)


    As you can see from Figure 5.24, when from Forensic1, the source IP address was
    not captured as 192.168.10.117, but rather 192.168.10.200. Understand though,
    the source address is .200, that would be the destination address of the ICMP
    0, reply packets. An intruder would not only have to possess the knowledge of
    how to use this utility, but how to decipher the network traffic it generates
    (spoofed/idle scanning). In this case, the ICMP reply is being sent to the spoofed
    IP, not the real IP address. So, while hping2 has successfully obfuscated the
    intruders trail, the question then becomes how does he receive his return traffic.
    Worse yet, what if he doesn''t care if he gets a response.


    Some reasons why an intruder might not want or need to receive reply packets are
    that she or conducteded/idle scanning, and has access to more than one host within
    the network. He or she may be conducting a Denial'
  merge: -1
  img_proc: true
- pgno: 147
  md: '# Chapter 5 • The Hacking Top 10


    of Service (DoS) attack using the “faster” switch (the–fast switch sends 10 packets
    per second, so this is faster than, but limited by the signal driven design of
    the tool). Or he she might be sending a specially crafted packet at a target for
    which the results will be obvious (i.e., the host will crash). Or he may be sending
    the contents of a file, like /etc/password, using the –file switch, which will
    fill the contents of the packet’s data. Any of these scenarios and dozens of others
    are potentially possible and be difficult to spot assuming that the customer has
    adequate network and firewall logs.


    Let’s look at the last example I mentioned, how an intruder might use hping2 to
    send a file. In this scenario, let’s assume that he is trying to send the contents
    of /etc /password to another host within the same network. In this way, hping2
    works very much like Netcat that you have a “sender” and a “receiver,” only hping2
    gives you more flexibility when crafting your packets.


    First, we have to create a signature file. When a packet is signed, it lets the
    receiving host know to capture anything containing the signature file. In this
    example, I have created a file in the current working directory called signature.sig.
    It contains a single word, “cepogue”. Next, we are going to send the signature.sig
    file to the receiving host using UDP. On the receiving host, I start tcpdump bound
    to eth0 using tcpdump –i eth0 –nX proto 17. Next, on the sending host, I send
    the signature.sig file by issue the “hping2 192.168.10.121 -121 -2 d 50 –p 7 –sign
    signature.sig” command. As you can see from Figure 5.25, the tcpdump output on
    the receiving host shows that my signature file has been successfully sent.'
  merge: -1
  img_proc: true
