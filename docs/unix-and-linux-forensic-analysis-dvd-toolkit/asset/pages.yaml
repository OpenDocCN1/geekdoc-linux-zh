- pgno: 143
  md: '# Chapter 5 • The Hacking Top 10


    Arguably the most used function of Paros is the ability to intercept and manipulate
    Web traffic, both going and coming from the target. This function is found by
    clicking on the “Trap” tab on the right-hand panel, and selecting the checkboxes
    marked “Trap request” and “Trap response.” By selecting these functions, Paros
    will grab and hold all HTTP/Hypertext Transfer Protocol Secure (HTTPS) traffic,
    as well as allow changes to be made that may not be available from the actual
    page (i.e., hidden fields). In my example in Figure 5.22, I captured the traffic
    going and coming from a Google search for the term “fish fishing,”


    # Figure 5.22 Capturing Google Search Traffic


    ![](img/fd8e85097b37559dbc07dc22fd8cb1fe_143_0.png)


    When Google responded to my request, I was able to view that response in its raw
    form. (See Figure 5.23.)'
