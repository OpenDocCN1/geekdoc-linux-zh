- pgno: 107
  md: '# Introduction


    In the world of computer crime, Hollywood fills our mind with illusions of grandeur.
    Films like Hackers, Sneakers, Mission Impossible, and the most recent, Untraceable,
    depict our primary adversary to possess super human intelligence, never make a
    mistake, and only get caught by the good guys after a dramatic, heart pounding
    scene. The truth of the matter is, in the overwhelming majority of cases that
    I have worked, this is simply not case. While the “Uber-Hacker” exists, your chances
    of coming across him or her, less catching him or her, is slim to none. What you
    do need to be prepared for and familiar with, are the tools used by the common
    hacker, where to find those tools, what they look like, what they are used for,
    and the fingerprint they may leave on a system.


    This chapter could be, and very well may be sometime in the near future, it’s
    own book. There is so much information that could be identified and elaborated
    upon, that it’s simply not within the scope of this book to be as detailed as
    I would like. This chapter is meant to provide the reader with a high-level understanding
    of the ten most popular hack tools gleaned from experience and collaboration with
    professional penetration testers, and common techniques, nothing more.


    In general, Linux machines are used as launch points and Windows machines are
    targets. That is not a judgment or a value statement, but an observation backed
    by a combined 20 years of experience. In keeping with that line of thinking, the
    tools that are commonly used to launch attacks from a Linux machine to a Windows
    machine will be our focus, and where better to start than with the most common
    and widely used.


    Before we move into which tools are most frequently used in a malicious compromise,
    it is important to understand how hackers identify their targets, and how they
    begin the exploitation. The Hollywood representation of computer hacking is not
    very realistic. No matter how smart Chloe O’Brien is in the Fox hit series “24,”
    bypassing the security measures of the National Security Agency (NSA) is hopefully
    much difficult than the 3 minutes it takes her to compromise some super secret
    backdoor. In the real world of hacking, it may take'
  merge: -1
  img_proc: true
- pgno: 108
  md: '# The Hacking Top 10 • Chapter 5


    weeks, months, or even years to successfully circumvent the security measures
    deployed by the target organization.


    In the corporate intrusion cases that I have worked, rarely has the incident been
    the result of an uber hacker writing 0day (oh-day) code on the fly.That is not
    to say that there are not people who are perfectly capable of doing that (in fact,
    I know at least three people who can), but it''s simply not all of them. In fact,
    I would even go as far as say that if you are working a case in which you think
    the compromise is the result of a super master hacker with freakishly mad skills,
    I would recommend going over your day again. If I were a gambling man, my money
    would be on the fact that you probably missed something. Rather, the probable
    and far more realistic cause of system compromises is the result of a poorly configured
    host, or missing security patches.


    When selecting a target, hackers will perform something commonly referred to as
    “active reconnaissance.” Basically, they are probing systems with externally facing
    interfaces that have vulnerabilities. A vulnerable service is something running
    on some port, which has some sort of security flaw in it. While that may seem
    to be a simplistic explanation, it is pretty accurate. The most commonly exploited
    services are Hypertext Transfer Protocol (HTTP), Hypertext Transfer Protocol Secure
    (HTTPS), Secure Shell (SSH), File Transfer Protocol (FTP), and Network Basic Input/Output
    System (NetBIOS). To illustrate, I ran a vulnerability search on Security Focus
    for the word “HTTP” and got 1705 pages with 15 hits per page. The other services
    had a large number of hits (Telnet - 25 pages, SSH - 12 pages, FTP - 80 pages,
    but were mild in comparison to number received from HTTP/HTTPS search. Needless
    to say, there is a huge number of vulnerabilities that need to be patched. If
    systems administrators remain diligent and employ a comprehensive patch management
    program, they are opening themselves up to an attacker. However, friends are quite
    literally asked to hit a moving target. If you watch any of the vulnerability
    reporting sites (in the Real Life Example) you will see there are new entries
    each week. Combine with the security flaws introduced into their networks by the
    Web applications they run (over which they have no control), and you will find
    that securing their front facing Web presence is a daunting task.


    www.securityfocus.com\


    ![](img/fd8e85097b37559dbc07dc22fd8cb1fe_108_0.png)'
