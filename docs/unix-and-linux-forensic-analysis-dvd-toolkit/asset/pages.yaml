- pgno: 77
  md: '# Summary


    As an investigator, no single part of your case analysis is more important than
    the data gathering. With the case of volatile data, you really get one chance
    to do it properly, something we referred to in the Army as, “One shot, one kill.”
    Locard’s Exchange principle will put your fingers all over the system. The key
    is to do it the first time, and document what you do. Even though by collecting
    data you have modified that data to a certain extent, with proper documentation
    you can clearly show what activities were yours and differentiate those activities
    from the customers’ data.


    Once you have gathered the volatile data, and have moved onto the persistent data,
    make sure that you validate your images before leaving the customer facility.
    Nothing is more embarrassing informing your customer that you have bad images,
    and that you need to come back and acquire them again. Additionally, never work
    from the original copies that you have made. Always copy your image to another
    media, and ensure that the MD5 checksums match.


    Now that you have collected all of your data, the fun part of the analysis can
    begin. Granted, gathering the data is all important, but seriously, it is very
    boring, and often frustrating. But like I said, with the data gathering behind
    you now, you can focus on catching the bad guy.'
  merge: -1
  img_proc: true
