  md: '# Chapter 4 • Initial Triage and Live Response: Data Analysis


    # Figure 4.8 Output from "who" and "w"


    ![](img/fd8e85097b37559dbc07dc22fd8cb1fe_95_0.png)


    The header is pretty self explanatory. The fields shown are the current time,
    how long the system has been running, how many users are currently logged on,
    and the system load averages. However, starting at the usernames, let''s go into
    a bit more depth on each of the items listed actually mean.


    +   - **User** Username


    +   - **TTY** Teletype In the old days of computing, terminals were keyboards
    that were attached directly to printers called “teletypes.” The output from commands
    issued to the system were read from the teletype. Where tty is either zero or
    a positive integer signifies a login from the console.Where tty is either pts
    or ttyyp#, it signifies a login over the network.'
  merge: -1
  img_proc: true
- pgno: 96
  md: '# Initial Triage and Live Response: Data Analysis • Chapter 89


    +   **From** This field shows where the user is logging in. In Figure 4.8, the
    “:0” and ":0.0” indicates that I am logged in from the console. For example, I
    was Secure Shelled (SSH''d) into the localhost from another box on the network,
    then that IP address or fully qualified domain name (FQDN) would appear in place
    of the “0.0”.


    +   **Login** This is pretty self explanatory. It shows the time of the last login.


    +   **Idle** This shows how long it has been since the last user activity. This
    information can be of specific note if you see users with long idle times.


    +   **JCPU** The JCPU time is the time used by all processes attached to the tty.
    It does not include past background jobs, but does include currently running background
    jobs.


    +   **PCPU** The PCPU time is the time used by the current process, named in the
    “what” field.


    +   **What** The What is the process that the user is currently running.


    # Network Connections


    Recall from the introduction, I referred to the lack of information sometimes
    being called “negative evidence.” While the data necessary to prove negative evidence
    is mainly found in the customer’s network logs, the local network connections
    can prove to be equally useful.


    By running the netstat command with the “-an” and “-rn” switches, you can see
    which connections are being made to and from the host as well as on which port
    is being used and the state of that connection (either LISTEN, ESTABLISHED, or
    CLOSE_WAIT).'
  merge: -1
