- pgno: 157
  md: '# Chapter 5 • The Hacking Top 10


    # Figure 5.34 Encrypted SSH2 Traffic


    ![](img/fd8e85097b37559dbc07dc22fd8cb1fe_157_0.png)


    As you can see, the information Ettercap was able to obtain is nothing more than
    garble. As an investigator, this is what you want to see! However, I can tell
    you that from experience, unencrypted protocols like Telnet and FTP are still
    being used at a huge number of IT organizations world wide. In fact, chances are
    you either belong to an organization which uses either Telnet or FTP, or you have
    recently worked a case in which the customer was using them.


    One other function of Etter that needs to be addressed is its ability to silently
    and effectively perform MITM attacks. According to wikipedia,²¹ a MITM attack
    “… is a form of active eavesdropping in which the attacker makes independent connections
    with the victims and relays messages between them, making them believe they are
    talking directly to each other over a private connection, when in fact the entire
    conversation is controlled by the attacker.” The attacker must be able to intercept
    all messages going between the two victims and inject new ones, which is straightforward
    in many circumstances (for example, the owner of a public wireless access point
    can in principle conduct MITM attacks on the users).


    > ²¹ http://en.wikipedia.org/wiki/Man-in-the-middle_attack'
  merge: -1
