    # # The Hacking Top 10


    The term “needle in a haystack” seems to live vicariously in the minds and hearts
    of computer forensic investigators. Many times I have been asked by a customer
    “go find the bad stuff”, that’s almost a joke. I am sure you have heard something
    similar and thought to yourself, “ok, let me use my Jedi mind powers to Yoda my
    way into the hacker’s brain to find out what he was thinking six weeks ago!” Not
    bloody likely. There are simply too many ways to do many things with too many
    tools. So you will have to narrow your your focus and look for specific things,
    or you will never find what it is that you are not sure you are looking for. Clear
    as mid? Welcome to my world!


    A practice that I have followed since making the jump from Ethical Hacker (yes,
    that is a real job) to Incident Response and Forensic analyst, is that I keep
    a keyword list of known hack tools. It sounds pretty basic, but I cannot tell
    you how effective this little practice has proven. I update the list at the conclusion
    of each case to include any new utilities or malware I have found or searched
    lately. It is a very handy practice and I highly recommend it. I have included
    a sample keyword list on the tools disk. It is by no means exhaustive, and is
    only meant to be a starter list. Use it to build your own custom keyword list,
    and search for those items in each case you work. I think you will be pleasantly
    surprised at the results.


    In talking with my former Ethical Hack colleagues, I asked them to provide me
    with a list of their top 15 to 20 tools and utilities. I then took the 10 most
    common, and created a list called, “The Hacking Top 10.” Now understand that for


    ![](img/fd8e85097b37559dbc07dc22fd8cb1fe_111_0.png)'
  merge: -1
  img_proc: true
- pgno: 112
  md: '# The Hacking Top 10 • Chapter 5


    a tool to be used as a “hack tool” it only needs to be in the hands of someone
    both knows how to use it, and has something devious in mind. They do not have
    to dump users, steal information, or pop admin. Be so advised, anything with a
    legitimate administrative purpose can be used to do something in a way in which
    the developer’s never intended.


    So, without further ado, here is the top 10:


    +   1. netcat

    2. nmap

    3. nessus

    4. nikto

    5. wireshark

    6. Canvas/Core Impact

    7. metasploit

    8. paros

    9. hping2

    10. ettercap


    # Netcat


    Commonly referred to as, the “Transmission Control Protocol (TCP)/Internet Protocol
    (IP) Swiss Army Knife,” netcat is a simple UNIX-based utility (although it does
    have a Windows command-line version) that sends data across a network using either
    TCP or User Datagram Protocol (UDP). While not a hacker utility per se, it is
    so prolific that it needed to be included. It can be used from the command line
    by itself, or integrated as part of a script. It is so simple and lightweight,
    yet so flexible and powerful, that it has become a favorite of both hackers and
    security professionals worldwide. According to www.vulynch.org/netcat/, the current
    version is Netcat 1.1, released on March 20, 1996. It includes the ability to
    perform tunneling with the ability to control all data packet parameters to include
    source port/interface, listening port/interface, and destination port/interface.
    Additionally, it has built in port scanning capabilities with randomizer, buffered
    send mode (i.e., # of packets every # seconds), and original RFC 854² Telnet codes
    parser and responder.


    > www.faqs.org/rfc/rfc854.html'
  merge: -1
  img_proc: true
- pgno: 113
  md: '# Chapter 5 • The Hacking Top 10


    Since it is small and has so many uses, it will undoubtedly be used in most penetrations
    involving Linux machines. For further information on Netcat and its usage, simply
    read the page on any Linux distribution. Be aware that there is an encrypted version
    called Cryptcat that uses TwoFish to encrypt its traffic. While it is also open
    source and no bigger than the original, its use is nowhere near as widespread
    as Netcat.


    It is highly recommended that any forensic analyst become familiar with this utility
    and its many uses. Believe me, you will see it again and again. In fact, netcat
    was listed as #4 on the top 100 network security tools survey results as noted
    in Fydor''s 2006 survey!³


    # Reconnaissance Tools


    During my time as an enlisted soldier in the Field Artillery, I served for about
    18 months as the battery recon Sergeant. My job was to find stuff that could potentially
    stop us from completing our mission of putting rounds down range. That meant I
    had to be on the lookout for Improvised Explosive Devices (IEDs), potential choke
    points, good places to set up firing points, recon on the move (ROM) sites, and
    a dozen other similar responsibilities. It was a fun job, and beat the heck out
    of running an ammunition truck.


    Applying the same logic here, any attacker or defender needs to perform recon
    to identify potential targets and attack vectors. The first three tools in the
    top 10 are designed to provide the intruder with solid intelligence (intel) on
    the target. The logic is pretty simple: know what you are attacking before you
    attack it.


    # Nmap


    Like Netcat, Network Mapper (nmap) is one of those utilities with seemingly endless
    uses. It can be used by network administrators for network monitoring, inventory,
    and managing update schedules. Penetration testers can use it for OS identification,
    service, and port identification. It quite literally has hundreds of applications
    and usages. For a full description of nmap and all of its uses, visit www.insecure.org.


    > ³ http://sectools.org/'
  merge: -1
  img_proc: true
- pgno: 114
  md: 'I have included nmap in the “Hacking Top 10” because of its ability to accurately
    identify open ports and service information, conduct zombie scanning, and launch
    basic attacks (like smurf and spoofing attacks). For a service to be exploited,
    you have to be able to properly identify that service needs be the OS upon which
    it resides. Nmap can do this effectively, and if needs be, very quietly via Paranoid
    (T0) or Sneaky mode (T1).


    By default, nmap is located in /usr/bin with a block size of 44608 for version
    4.60. When it is run in its default mode, it is very noisy on the network, even
    in Polite mode (T3).


    When executed by a non-privileged user (i.e., root), a synchronous (SYN) packet
    is sent (using a connect () call) to port 80 on the target. When the target receives
    the SYN packet, it will reply with a SYN/Acknowledge (ACK) in an effort to do
    its part in completing a three-way TCP handshake. Nmap will then use this connection
    resulting from the -sT default scan, to perform one of several reconnaissance
    features such as OS fingerprinting, service identification, and performing a network
    sweep.


    When the scan is issued by a privileged user (i.e., root), by default nmap will
    send an ARP request (-PR), unless the –send-ip was specified. The -sP option can
    be used in conjunction with any other options (except –P0, since that turns ICMP
    off) for greater flexibility. When a firewall is in place between you and the
    target host(s), advanced techniques may be needed to prevent the packets from
    being dropped. You can read about this type of scanning on the nmap map page under
    the section titled “FIREWALL/IDS EVASION AND SPOOFING”.


    In 5.3 below I have used Wireshark 0.99.6 to capture the traffic from my localhost,
    192.168.10.117 to a Windows XP target, 192.168.10.115.'
  merge: -1
  img_proc: true
