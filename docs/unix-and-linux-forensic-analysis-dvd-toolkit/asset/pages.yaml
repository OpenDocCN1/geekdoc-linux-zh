- pgno: 63
  md: '# Chapter 3 • Live Response: Data Collection


    to one server with one drive, only to arrive on site and find that the actual
    scope five servers, with RAID configurations that spanned 15 drives! So come prepared!


    # YOUR TOOLBOX


    As preparations are made to take the drive image, remember that Murphy is always
    vigilant. Anticipate something going wrong with the drive acquisition and have
    multiple solutions in place for when it happens. I have had colleagues who have
    been "certified" to take images of systems with EnCase, which is fine if EnCase
    works on the current configuration at that particular facility. However, currently,
    EnCase (version 6.6.0.35) does not properly interpret many commercial RAID controllers.
    In such a case, another method would have to be used. After EnCase failed, my
    poor friend looked at me and said, "I don''t know what to do now..." The investigator
    absolutely needs to know how to use multiple acquisition tools because at some
    point the "tool of choice" will invariably fail.


    # DD


    From the Linux command, the simplest way to take a bit-for-bit image of a target
    is using the "dd" or disk dump command. A popular variant of this tool is "ddlf-dd,"
    available for download from sourceforge.⁴ This tool does the same thing dd does,
    only it MD5 the image as it transfers it. This is no different than transferring
    the image with dd and then generating the MD5 checksum, albeit much faster. Like
    the commands we issued from our trusted toolbox volatile volatile gathering, we
    are going to use the trusted version of dd from our CD.


    The first step in this process is to connect your forensic laptop to the target.
    This can be done either by a crossover cable or standard Ethernet cable, depending
    on the configuration of the system you are working with. Following the connection,
    both systems need to be put on the same subnet. For the systems to be able to
    see and talk to each other, they have to be on the same network segment. For ease
    and consistency, a good practice is to always use 10.0.0.1 and 10.0.0.2. For this
    example, .1 is going to be the target system and .2 is going to be your forensic
    laptop.


    > ⁴ http://sourceforge.net/project/downloading.php?groupname=biatchux&filename=dcfldd-1.0.tar.gz&use_mirror=super-east'
  merge: -1
  img_proc: true
- pgno: 64
  md: '# Live Response: Data Collection • Chapter 3


    From the command line on both systems, use the following commands:

    nifdown eth0 (or whichever Ethernet adapter you are using)

    ifconfig eth0 10.0.0.x netmask 255.255.255.0 (use a different

    number for each system, subnet will remain the same)

    ifup eth0


    Once the IP system has been set, make sure that each host can ping the

    other. Ensure the target system is off the company network, and the forensic connection

    is the only one available. If not, ensure that the customer is informed that the
    image

    integrity will be skewed, and subsequent litigation will not be possible. As a

    forensic note, this is where the process can get a bit tricky. A good idea to
    use

    the forensic notebook to make a small diagram of the two systems, and the file

    systems you are working with. This might sound somewhat basic, but it is very
    easy to

    get jumbled up in your head.


    In a perfect world, the drive we is imaged should be called /dev/hda1,

    s since we not know who lives in said world, you will have to manually

    validate the target drive. Generally speaking, the boot sector is found in /dev/hda,

    while the file system is found in /dev/hda1. If the drive is SCSI, then simply
    replace

    t "h" with an "s" (exe. sda). By issuing the "mount" command, you will be given

    al list of mounted devices, including the newly created mount point. In this listing,

    t /dev/hdLN should indicate the primary drive, where "L" is a letter and "N" is
    a

    positive integer. You can also review the information in the /etc/mtab, the messages

    log, or /proc/partitions.


    On the target system, create a mount point to your local forensic system.

    the forensic system, create a directory into which the dd image will be transferred.

    This will be the external drive which was mounted earlier. For example, the path

    should looks something like this:

    /media/disk/IBM/customer_host


    On the forensic machine, start the Network File System (NFS) service:

    Service nfs start (this may vary from each system, .eg /etc/init.d/nfs start)


    On the forensic system, export your share:


    ```

    /etc/exports

    Shift I (for insert mode)

    Add your mount point, in this example, /media/disk/IBM/customer_host

    ESC (exit current command selection), Shift : (edit exit mode), W (write),

    Q (quit),!(absolute write)

