    anomaly-based detection capabilities present in specific products or solutions.
    Finally, most IDSes include some limited automatic response capabilities, these
    usually concentrate on automated traffic filtering, blocking, or disconnects as
    a last resort. Although some systems claim to be able to launch counterstrategies
    against attacks, best practices indicate that automated identification and backtrack
    facilities are the most useful aspects that such facilities provide and are therefore
    those most likely to be used.


