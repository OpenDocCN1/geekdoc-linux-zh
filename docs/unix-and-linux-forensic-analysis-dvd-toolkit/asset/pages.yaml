- pgno: 182
  md: '# Chapter 7 • File Analysis


    As you are hopefully aware, the root user is all-powerful on a standard Linux
    system, and gaining access to this user''s privileges is usually of paramount
    importance to an intruder. For this and for other reasons, access to root is strictly
    controlled. Unfortunately, some users may require root privileges to run certain
    programs or perform specific tasks beyond the capabilities of a normal user. There
    are a few ways to manage this using the setuid and set binaries, which we will
    discuss shortly, and the su command or the sudo command.


    The su command requires that the user knows the root password. The user is literally
    logging in as root from within their current session. Nothing is to stop the user
    from logging in directly as root in the future. In a shared-root password environment,
    you lose accountability should root do something disastrous, intentionally or
    otherwise. This problem is solved by sudo, which allows for fairly fine-grained
    granting of root powers to non-root users. This is controlled by the /etc/sudoers
    file. A full analysis of the sudoers file is not warranted in this volume. Be
    just that you check for spurious or otherwise unauthorized entries or modifications,
    if the particulars of your investigation indicate that an existing user was operating
    beyond their authority.


    Given root''s power, and the flexibility of sudo, many Linux systems prevent root
    from logging in at all except via a local console. This is controlled via the
    /etc/security file, which lists all of the virtual terminals root may log in from.


    # Cron Jobs


    "cron" is the main method for scheduling a task to run at some point (or points)
    in the future on a Linux system. As you can see, this is a great way to ensure
    continued access to a system you''ve compromised. There are two primary locations
    where cron will look for jobs to process: /var/spool/cron, which will contain
    the user IDs of any users who have entered cron jobs using the "crontab" command,
    and /etc/crontab, which will list additional locations for system-wide cron jobs.
    These are found in the directories /etc/cron.hourly, /etc/cron.daily, /etc/cron.weekly,
    and /etc/cron.monthly.


    These locations (and any others referred in /etc/crontab) should be examined for
    unauthorized jobs. This is an old but extremely popular and effective way to maintain
    access on a compromised UNIX system.


    # Log Files


    Linux systems contain a plethora of log files, which may be of importance to an
    investigation. In this section, I will cover the ones that are most critical to
    answering key questions that come up in every investigation.'
