- pgno: 66
  md: '# Live Response: Data Collection • Chapter 3


    The “if” stands for input file, “of” stands for output file. There are many switches
    available on the dd command, however, they are not always needed. For the sake
    of this paper, they have been left off. Further research can be done on the dd
    command by simply reading the manual (man) page. This command will start the disk
    dump (dd) process, taking /dev/sda1, and putting it into a single file in /mnt/foo
    directory on the local system, which is an NFS mount point to your forensic laptop.
    Your data transfer is dependant on two things, the speed of the processor of the
    target system and the type of Ethernet being used. From my experience, servers
    over my forensic laptop have an Intel Core Duo 2.0 Ghz T7200 processor, so my
    bottle neck has been the Ethernet port. My laptop has a gigabit Ethernet (GbE)
    port, so transfer speeds can get as high as 1 gigabit (1,000 megabits) per second,
    which is pretty fast. However, to achieve these speeds, the target NIC to be GbE
    as well, and you have to be using Category 6 (cat6) cable. If the target has a
    10/100 ethernet port, or you only have cat5 or cat5cable, your bitrate will drop
    to 100meg per second.


    As the id progresses, check the status on the local forensic system by running
    “ls -la” on the file. The block size will continue to get larger until it stops.
    This number should equal the size of the drive on the target media. If it does,
    kill the dd image on the target system by pressing Ctrl-C.


    The final step is to MD5 the image on the local system and compare the two values;
    they should match. If they do not, something has changed during the imaging process
    and you will have to move to your next image. If they do, the mount point is umount
    10.0.0.1:/media/disk/IBM/customer_host and the system can be turned back to the
    customer. Some customers will not care about this level of data integrity checking,
    as their goal is to find out what happened, restore service, and ensure that it
    can’t happen again. In such a case, the MD5 sums do not have to match. Be sure
    that the goals of the customer are understood before proceeding in this manner.
    However, in my personal opinion, that MD5 value should be taken of the target
    media, and hash should match of your image. Customers do not always know what
    they want, and frequently change their minds. They may initially state that they
    have no intention of litigation, only to decide later that their attorneys have
    advised them to prepare for the case to go to court. You do not want to be the
    one to quash the legal process by having to tell them that your forensic images
    were not MD5’d or the hash values did not match.


