    These are called rotated archives. Depending on what level of granularity logging
    has set, logs get large and cumbersome. Linux provides a command “logrotate”,
    which does exactly what you would think it does: rotates the log files by appending
    a numerical suffix to the end of the file. For example, in Figure 4.1 you can
    see “syslog” without a numerical suffix. The first log in the archive is “syslog.0.gz”
    file, and the previously active log file. Next you will see “syslog.1.gz” through
    “syslog.6.gz”. These are the remainder of the archived logs in a gzip format.
    When “logrotate” runs, usually daily (can be found by default in /etc/cron.daily),
    it takes the current file, appends a “.0” to the end of the file, and starts logging
    again in the standard name of this file, “syslog.”


