- pgno: 28
  md: '# Chapter 2 • Understanding Unix


    # All Hail the Shell


    Like the Windows command prompt (except bigger, better, and more powerful), here''s
    where you get to reacquaint yourself with the keyboard by typing Unix commands.


    Unlike Windows, there are actually options for your shell. There isn''t just one
    shell in *nix. In Windows, you have cmd.exe and ... well, cmd.exe, unless you''ve
    gone out of your way to implement a replacement Windows shell (or have installed
    Cygwin). In the *nix world, there are many supported shells preinstalled: Bourne
    shell (sh), Korn shell (ksh), C Shell (csh), Tom''s C Shell (tch), and Bourne
    Again Shell (bash). Bash is the usual default in Linux, but HP-UX machines are
    often configured to default to ksh. Solaris 10 defaults to Bourne shell. Depending
    on the whims of the system administrator of an environment, you may find in csh
    or tsh by default. If you ever want to know what shell you''re in, it''s just
    an echo $SHELL


    ```

    ubuntu@ubuntu:~$ echo $SHELL

    /bin/bash

    ubuntu@ubuntu:~$

    ```


    # Essential Commands


    Here is a list of commands you should get familiar with, and common options. This
    is by no stretch of the imagination even tiny fraction of available *nix commands,
