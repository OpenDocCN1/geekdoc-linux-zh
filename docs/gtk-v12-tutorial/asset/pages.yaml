  md: "# 4. Packing Widgets\n\n# 4.2 Details of Boxes\n\nBecause of this flexibility,\
    \ packing boxes in GTK can be confusing at first. There are a lot of options,\
    \ and it's not immediately obvious how they fit together. In the end, however,\
    \ there are basically five different styles.\n\n| gtk_box_new(FALSE, 0); | | FALSE\
    \ FALSE 0); | |\n|---|---|---|---|---||\n| gtk_box_pack(box, button, | | TRUE,\
    \ FALSE, | 0); |\n| gtk_box_pack(box, button, | | TRUE, TRUE, | 0); |\n| gtk_hbox_new(TRUE,\
    \ 0); | | button, | TRUE, FALSE, | 0); |\n| gtk_box_pack(box, button, | | TRUE,\
    \ TRUE, | 0); |\n|\n\nEach line contains one horizontal box (hbox) with several\
    \ buttons. The call to pack each is shorthand for the call to pack each of the\
    \ buttons into the hbox. Each of the buttons is packed into the same way (i.e.\
    \ same arguments as the gtk_box_pack_start() function).\n\nThis is the example\
    \ of the gtk_box_pack_start function.\n\n```\nvoid gtk_box_pack_start(GtkBox *box,\n\
    \                             GtkWidget *child,\n                            \
    \ gint expand,\n                             gint fill,\n                    \
    \         gint padding, gpointer data);\n```\n\nThe first argument is whether\
    \ you are packing the object, the second is the object. The objects will all be\
    \ buttons for now, so we'll be packing boxes into boxes.\n\nThe expand argument\
    \ to gtk_box_pack_start() and gtk_box_pack_end() controls whether the widgets\
    \ are laid out in the box to fill the extra space in the box is expanded to fill\
    \ the area allocated to (TRUE). Or the box is shrunk to fit the widgets (FALSE).\
    \ Setting expand to FALSE allows you to do right and left justification of widgets.\
    \ Otherwise, they will expand to fit the box, and the effect could be achieved\
    \ using only one of gtk_box_pack_start or gtk_box_pack_end.\n\nThe fill argument\
    \ to gtk_box_pack controls whether the extra space is allocated to the objects\
    \ themselves (TRUE), or as extra padding in the box around these objects (FALSE).\
    \ It only has an effect if the expand argument is also TRUE.\n\nWhen creating\
    \ a box, the function looks like\n\n```\nGtkWidget *gtk_hbox_new(gint homogeneous,\n\
    \                                     gint spacing);\n```\n\nThe homogeneous argument\
    \ to gtk_hbox_new (and the same for gtk_box_new) controls whether the box has\
    \ the same size (i.e. the width in a hbox, or the height in a vbox). If it is\
    \ set, the expand argument to the gtk_box_pack routines is always turned on.\n\
    \nWhat's the difference between spacing (when the box is created) and padding\
    \ (when elements are packed)? Spacing is added between objects, and padding is\
    \ added on either side of an object. The following figure should make it clearer:"
