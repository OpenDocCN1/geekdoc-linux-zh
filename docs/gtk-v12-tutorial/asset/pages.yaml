  pgno: 6
- img_proc: true
  md: '# 2. Getting Started


    GTK is an object-oriented programmers interface (API). Although written in C,
    it is implemented using the idea of classes and callback functions (pointers to
    functions).


    There is also a third component glib which contains a few replacements for standard
    calls, as well as additional functions for handling linked lists. The replacement
    functions are used to increase GTK''s portability, as some of the functions implemented
    here are not available or arestandard on other unixes as g_error(). Some also
    enhancements to the lib versions, such as g_malloc have enhanced debugging utilities.


    This tutorial describes the interface to GTK. GTK are bindings for many other
    languages as C++, Go, Perl, Python, Adol5, Objective C, Pascal, and Eiffel. If
    you want to use another language''s bindings to GTK, look at that binding''s documentation.
    In some cases documentation may describe some important conventions (which you
    should know first) and then refer you to this tutorial. There are some cross-platform
    APIs (such as Windows and V) which you can use GTK as one of their platforms;
    again, consider their documentation


    If you''re developing your GTK application in C++, a few extra extras are needed.
    There''s a C++ binding to GTK called gtkmm, which provides a C++-like interface
    to GTK; you should probably look into this instead. If you do not like that approach
    for whatever reason, there are alternatives for using GTK. First, you can use
    the subset of C++ when interfacing with GTK and then use the C interface. Second,
    use GTK and C++ by declaring all callbacks as functions in C++ classes, and again
    calling GTK using C. If you choose this last approach, you can include the callback''s
    data value to the object to be manipulated (the so-called "this" value). Selecting
    these options is simply a matter of preference, since in all three approaches
    you get C++ and GTK. No of these approaches require the use of a specialized preprocessor,
    no matter what you choose you can use standard C with GTK.


    This tutorial is meant to document as much as possible GTK, but it is by no means
    complete. This tutorial assumes a good understanding of C, and how to create C++
    programs. It would be a great benefit for the reader to have previous X programming
    experience, but it shouldn''t be necessary. If you are learning GTK as your first
    widget, please comment on how you found this tutorial, and if you had trouble
    with it. Note that there is also a C++ API for GTK (gtk-) in the works, so if
    you prefer to use C++, you should look into this instead. There are also Objective
    C, ADA, Guile and other language bindings available, but I don''t follow these.


    This document is a ''in progress''. Please look for updates at http://www.gtk.org/
    http://www.gtk.org/.


    I would much like to hear from any of you who are learning GTK from this document,
    and welcome input as to how it may be improved. Please see the section on 25 for
    further information.


    # 2 Getting Started


    The first thing to do is, download the GTK source and install it. You can get
    the latest version from ftp.gtk.org /pub/gtk. You can also view other sources
    of GTK information on http://www.gtk.org/. GTK uses GNU autoconf for configuration.
    Once under''d, you type --configure to see a list of options.


    Th GTK source distribution also contains the complete source to all the examples
    used in this tutorial, along with Makefiles for aid compilation.


    To begin our introduction to GTK, we will start with the simplest possible program.
    This program will create a 200x200 pixel window and has no way of exit killed
    by the shell.


    ```

    /* example-target base base.c */


    #include <gtk/gtk.h>

    ```'
