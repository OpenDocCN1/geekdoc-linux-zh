  md: '# 9. Miscellaneous Widgets


    You see, it simply creates a window, and then packs a vbox into the top, then
    a separator, and then an hbox for the "action_area".


    The Dialog can be used for pop-up messages to the user, and other similar tasks.
    It is really basic, and there is only one function for the dialog box:


    ```

    GtkWidget *gtk_dialog_new( void );

    ```


    So to create a new dialog box, use:


    ```

    GtkWidget *window;

    window = gtk_dialog_new ();

    ```


    This will create the dialog box, and it is up to you to use it. you could pack
    a button in the action_area by doing something like this:


    ```

    button =

    gtk_box_pack_start (GTK_BOX (GTK_DIALOG (window))->action_area),

    button, TRUE, TRUE, 0);

    gtk_widget_show (button);

    ```


    And you could add a vbox area, for packing, a label in it, try trying something
    like this:


    ```

    label = gtk_label_new("Dialogs are groovy");

    gtk_box_pack_start (GTK_BOX (GTK_DIALOG (window))->vbox),

    label, TRUE, TRUE, 0);

    gtk_widget_show (label);

    ```


    As an example using the dialog box, you could put two buttons in the action_area,
    a Cancel button and an Ok button, in the vbox area, asking the user a question
    or giving an error. Then you could attach a signal to each of the buttons and
    perform the operation the user selects.


    If the simple functionality provided by the default vertical and horizontal boxes
    in the two areas doesn''t enough for your application, for example, you could
    pack a table into the vertical box.


    # 9.6 Pixmaps


    Pixmaps are data structures that contain pictures. These pictures can be used
    in various places, most visibly as icons on X-Windows, cursors.


    A pixmap which has only 2 colors is called a bitmap, and there are a few additional
    routines for handling this common special case.


    To understand pixmaps, you will need to understand how X-Windows work. Under X-Windows,
    applications do not need to be running on the same computer that is interacting
    with the user. Instead, the various applications, called "clients", all communicate
    with a program that displays the graphics and handles the keyboard and mouse.
    This program which interacts directly with the user is called a "display server"
    or X server.\ Since communication might take place over a network, it is important
    to keep some information with the X server. Pixmaps, for example, are stored in
    the memory of the server. This means that pixmap values are set, they don''t need
    to keep them transmitted over the network; instead a command is sent to "display
    pixmap number XYZ here.\ Even if you''re not using X-Windows with GTK currently,
    using constructs such as Pixmaps will make your program acceptably under X-windows.


    To use pixmaps in GTK, you must first a GdkPixmap structure using routines from
    the Gdk layer. Pixmaps can either be created in-memory data, or from data from
    a file. We''ll go through each of the calls to create a pixmap.'
