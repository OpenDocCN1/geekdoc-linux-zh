  md: "# 9. Miscellaneous Widgets\n\n```\nreturn(0);\n/* example-end */\n```\n\n#\
    \ 9.10 Spin Buttons\n\nThe Spin Button widget is generally used to allow the user\
    \ to select a value from a range of numeric values. It consists of a entry box\
    \ with up and down arrow buttons attached to the side. Selecting one of the buttons\
    \ causes the value to 'spin' up and down the range of possible values. The entry\
    \ box may also be edited directly to select a specific value.\n\nThe Spin Button\
    \ allows the value to have zero or a number of decimal places and to be incremented/decremented\
    \ in configurable steps. The action of holding one of the buttons results in an\
    \ acceleration of change in the value according to how long it is depressed.\n\
    \nThe Spin Button uses an adjustment object to hold information about the range\
    \ of values that the spin button can take. This makes for a powerful Spin Button\
    \ widget.\n\nRecall that an adjustment widget is created with the following function,\
    \ which illustrates the information it holds:\n\n```\nGtkObject *gtk_adjustment_new(gfloat\
    \ value,\n                              gfloat lower,\n                      \
    \        gfloat upper,\n                              gfloat step_increment,\n\
    \                              gfloat page_increment,\n                      \
    \        gfloat page_size);\n```\n\nThese attributes of an Adjustment are used\
    \ by the Spin Button in the following way:\n\n+   * value: initial value for the\
    \ Spin Button\n* lower: lower range value\n* upper: upper range value\n* step_increment:\
    \ value to increment/decrement when pressing mouse 1 on a button\n* page_increment:\
    \ value to increment/decrement when pressing mouse button 2 on a button\n* page_size:\
    \ unused\n\nAdditionally, mouse button3 can be used to jump directly to the upper\
    \ or lower values when used one of the buttons. Let us look at how to create a\
    \ Spin Button:\n\n```\nGtkWidget *gtk_spin_button_new(GtkAdjustment *adjustment,\n\
    \                                               gfloat\n                     \
    \                         climb_rate,\n                                      \
    \        digits );\n```\n\nThe climb_rate argument take a value between 0.0 and\
    \ 1.0 and indicates the amount of acceleration that the Spin Button has. The digits\
    \ argument specifies the number of decimal places to which the value will be displayed.\n\
    \nA Spin Button can be reconfigured after creation using the following function:\n\
    \n```\nvoid gtk_spin_button_configure(GtkSpinButton *spin_button,\n          \
    \                                  GtkAdjustment *adjustment,\n              \
    \                                     gfloat\n                               \
    \               climb_rate,\n                                              digits\
    \ );\n```"
