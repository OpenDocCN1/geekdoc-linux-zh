  md: "# 2. Getting Started\n\n```\nwindow = gtk_window_new (GTK_WINDOW_TOPLEVEL);\n\
    gtk_widget_show (window);\n```\n\nThe GTK_WINDOW_TOPLEVEL argument specifies that\
    \ we want the window to undergo window manager decoration and placement. Rather\
    \ than create a window of 0x0 size, a window without children is set to 200x200\
    \ by default you can still manipulate it.\n\nThe gtk_widget_show() function lets\
    \ GTK know that we done setting the attributes of this widget, and that it can\
    \ display.\n\nThe last line enters the GTK main processing loop.\n\n```\ngtk_main\
    \ ();\n```\n\ngtk_main() is another call you will see in every GTK application.\
    \ When control reaches this point, GTK will sleep waiting for X events (such as\
    \ button or key presses), timeouts, or file IO notifications to occur. In our\
    \ simple example however, events are ignored.\n\n# 2.1 Hello World in GTK\n\n\
    Now for a program with a widget (button). It's the classic hello world a GTK.\n\
    \n```\n/* example-start helloworld.c */\n\n#include <gtk/gtk.h>\n\n/* This is\
    \ a callback function. The data arguments are ignored\n* in this example. More\
    \ on callbacks below. */\nvoid hello(GtkWidget *widget,\ngpointer      data )\n\
    {\n  g_print (\"Hello World\\n\");\n}\n\ngint delete_event(GtkWidget *widget,\n\
    GdkEvent *event,\ngpointer      data )\n{\n  /* If you return FALSE in the \"\
    delete_event\" signal handler,\n* GTK will emit the \"destroy\" signal. Returning\
    \ TRUE means\n* you don't want the window to be destroyed.\n* \n* This is useful\
    \ for popping up 'are you sure you want to quit?'\n* type dialogs. */\n  g_print\
    \ (\"delete event occurred\\n\");\n\n\n/* Change delete to FALSE and the main\
    \ window will be destroyed with\n* a \"delete_event\". */\n  return(TRUE);\n}\n\
    \n/* Another callback */\nvoid destroy(GtkWidget *widget,\ngpointer      data\
    \ )\n{}\n```"
