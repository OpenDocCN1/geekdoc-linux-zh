  md: '# 2. Getting Started


    ```

    gtk_init(\&argc, \argv);

    ```


    Create a window. This is fairly straightforward. Memory is allocated for the GtkWidget*window
    structure it points to a valid structure. It sets up a new window, but it is not
    displayed until we call gtk_widget_show(window) near the end of our program.


    ```

    window = gtk_window_new(GTK_WINDOW_TOPLEVEL);

    ```


    Here is an example of connecting a signal handler to an object, in this case,
    the window. Here, the "destroy" signal is caught. It is emitted when we use the
    window manager to kill the window (and we return FALSE in the "delete-event" handler)
    or when we use the gtk_widget_destroy() passing in the window as the object to.
    By setting this up, we handle cases with a single call. Here, it just calls the
    destroy() function defined with a NULL argument, which quits GTK for us.


    The GTK_OBJECT and GTK_SIGNAL_FUNC macros that perform type casting and checking
    for us, with all the ease of readability of the code.


    ```

    gtk_signal_connect(GTK_OBJECT(window), "destroy",\ GTK_SIGNAL_FUNC(destroy), NULL);

    ```


    This function is used to set an attribute of a container object. This just sets
    the window so it has a blank area along the side of 10 pixels where no widgets
    will go. There are other functions we will look at in section 16


    And again, GTK_CONTAINER is a macro to perform type casting.


    ```

    gtk_container_set_border_width(GTK_CONTAINER, 10);

    ```


    This creates a new window. It allocates space for a new GtkWidget in memory, initializes
    it, and makes the pointer point to. It will have "Hello World" on it when displayed.


    ```

    button = gtk_button_new_with_label("Hello World");

    ```


    Here, we take this, and we make it something useful. We attach a signal handler
    to it when it emits the "clicked" signal, our hello() function is called. The
    data is ignored, so we simply pass NULL to the hello() callback function. Obviously,
    the "clicked" signal is emitted when we click the button with our mouse pointer.


    ```

    gtk_signal_connect(GTK_OBJECT(button), "clicked",\ GTK_SIGNAL_FUNC(hello), NULL);

    ```


    We are also going to use this to exit our program. This will illustrate how the
    "destroy" signal may come from the window manager, or our program. When the button
    is "clicked", as above, it calls the hello() callback function, and then this
    one is in the order we set. You may have many callback functions as you need,
    and all will be executed in the order you connected them. Because the gtk_widget_destroy()
    function accepts only a GtkWidget* as an argument, we use the gtk_signal_connect_object()
    function instead of gtk_signal_connect.


    This is a packing call, which will be explained in depth later on. But it is fairly
    easy to understand. It simply tells GTK to place the button in the window where
    it will be displayed. Note the container can only contain one widget. There are
    other widgets, which are described later, which are designed to layout multiple
    widgets in various ways.'
