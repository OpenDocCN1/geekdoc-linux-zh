  md: '# 3. Moving On


    ```

    gtk_container_add (GTK_CONTAINER (window), button);

    ```


    Now we have everything set up we want it to be. With all the signal handlers in
    place, and the button placed in the window where it should, we ask GTK to "show"
    the widgets on the screen. The window widget is shown so the whole window will
    pop up at once after seeing the window pop up, and then the button form inside
    of it. Although with such a simple example, you''d never notice.


    ```

    gtk_widget_show (button);

    gtk_widget_show (window);

    ```


    And of course, we call gtk_main() which waits for events to come from the X server
    and will call on the widgets to emit signals when these events come.


    ```

    gtk_main ();

    ```


    And the final return. Control returns after gtk_quit() is called.


    ```

    return 0;

    ```


    Now, when we click the mouse button on the GTK button, the widget emits a "clicked"
    signal. For us to use this information, our program sets up a signal handler to
    catch that signal, which dispatches the function of our choice. In our example,
    when the button we created is "clicked", the hello() function is called with a
    NULL argument, and the next handler for this signal is called. This calls the
    gtk_widget_destroy function, passing the window as its argument, destroying the
    window widget. This causes the window to emit the "destroy" signal, which is caught,
    and calls our destroy() callback function, which simply exits GTK.


    Another case of events, is to use the window manager to kill the window. This
    will cause the "delete-event" to be emitted. We will call our "delete-event" handler.
    If we return TRUE here, the window will be left as and nothing will happen. Returning
    FALSE will cause GTK to emit the "destroy" signal which course, calls the "destroy"
    callback, exiting GTK.


    Note that these signals are not the same as the Unix system signals, and are not
    implemented them, although the terminology is almost identical.


    # 3 Moving On


    # 3.1 Data Types


    There are a few things you noticed in the previous examples that need explaining.
    The glint, gchar etc. that you see typedefs to int and char respectively. This
    is done to get around that nasty dependency on the size of simple data types when
    doing calculations.


    A good example is "uint32" which will be typedefed to a 32 bit integer for any
    given platform, whether it is the 64 bit alpha, or the 32 bit i386. The typedefs
    are straight forward and intuitive. They are all defined in glib/glib.h (which
    gets included from gtk.h).


    You''ll also notice the ability to use GtkWidget when the function calls for a
    GtkObject. GTK is an oriented design, and a widget is an object'
