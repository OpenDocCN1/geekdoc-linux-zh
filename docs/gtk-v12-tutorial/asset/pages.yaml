    ```

    gfloat lower;

    gfloat upper;

    gfloat step_increment;

    gfloat page_increment;

    gfloat page_size);

    ```


    The value argument is the initial value you want to give to the adjustment, usually
    corresponding to the topmost or leftmost position of an adjustable widget. The
    lower argument specifies the lowest value which the adjustment can hold. The step_increment
    argument specifies the "smaller" of the two increments by the user who can change
    the value, while the page_increment is the "larger" one. The page_size argument
    presumably something to represent the visible area of a paging widget. The upper
    argument is used to represent the bottom or rightmost coordinate in a paging widget''s
    child. Therefore it is not always the largest number that value can take, since
    the page_size of such widgets is non-zero.


    # 7.2 Using the Easy Way


    The adjustable can be roughly divided into those which use and require specific
    units for the values and which them treat as arbitrary numbers. The group which
    treats all adjustments as range widgets (scrollbars and scales, the progress bar
    widget, and the spin button widget). These widgets are all the widgets which are
    typically "adjusted" directly by the user with the mouse or keyboard. They will
    treat the lower and upper values of an adjustment as a range within which the
    user can manipulate the adjustment''s value. By default, they will only modify
    the value of an adjustment.

    The other group includes the text widget, the viewport widget, the compound list
    widget, and the window widget. All of these widgets use pixel values for their
    adjustments. These are all widgets which are typically "adjusted" indirectly by
    scrolling. While all widgets can either create their own adjustments or use ones
    you you''ll generally want to let this particular category of widgets create its
    own adjustments. Usually, they will eventually override all the widgets except
    the value you give them, and how they do it is general, undefined (meaning, you''ll
    have to read


