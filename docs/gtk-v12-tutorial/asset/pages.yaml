    # 9.3 The Tooltips Widget


    These are the little text strings that pop up when you leave your pointer over
    a button or other widget for a few seconds. They are easy to use, so I will explain
    them without giving an example. If you want to see some code, take a look at the
    tooltip.c program distributed with GTK

    Widgets that do not receive events (widgets that do not have their own window)
    will not work with tooltips.

    The first call will create a new tooltip. You only need one of each tooltips as
    the GtkTooltip object function returns can be used to create multiple tooltips.'
