    # 19 Managing Selections\n\n# 19.1 Overview\n\nOne type of intercourse communication\
    \ supported by GTK selections. A selection identifies a chunk of data, for instance,\
    \ a portion of text, selected by the user in some fashion, for instance, dragging\
    \ with the mouse. Only one application on a display, the (owner) can own a particular\
    \ selection at one time, so when a selection is claimed by one application, the\
    \ previous owner must notify the user that has selection has been relinquished.\
    \ Other applications can request the contents of a selection in different forms,\
    \ called targets. There can be many selections, but only X applications handle\
    \ only one, the primary selection.\n\nIn most cases, it isn't necessary for a\
    \ GTK application to deal with selections itself. The standard widgets, such as\
    \ the Entry widget, already have the capability to select the claim when appropriate\
    \ (e.g. when the user drags over text), and to retrieve the contents of the selection\
    \ owned by another widget, or another application (e.g., when the user clicks\
    \ the mouse button). However, there may be cases in which you want to give other\
    \ widgets the ability to supply the selection, or you wish to retrieve targets\
    \ not supported by\n\nA fundamental concept needed to understand handling selection\
    \ is that of the atom. An atom is an integer that uniquely identifies a string\
    \ (on a constant display). Certain atoms are defined by the X server, and in some\
    \ cases there are constants in gtk.h corresponding to these atoms. For instance\
    \ the GDK_PRIMARY_SELECTION corresponds to the string \"PRIMARY\". In other cases,\
    \ you use the functions gdk_atom_intern(), to get the atom corresponding to a\
    \ string, and gdk_atom_name(), to get the name of an atom. Both strings and targets\
    \ are identified by atoms.\n\n# 19.2 Retrieving the selection\n\nRetrieving the\
    \ selection is an asynchronous process. To start the process, you call:\n\n```\n\
    gint gtk_selection_convert(GtkWidget *widget,\n                            GdkAtom\
    \ selection,\n                            GdkAtom target,\n                  \
    \          time);\n```\n\nThis converts the selection into the form specified\
    \ by target. If at all possible, the time field should be the time from the event\
    \ that triggered the selection the user requested them. However, if it is not\
    \ available (for instance, if the conversion was triggered by a \"clicked\" signal),\
    \ then you can use the constant GDK_CURRENT_TIME.\n\nWhen the selection owner\
    \ responds to the request, a \"selection,received\" signal is sent to your application.\
    \ The handler for this signal returns a pointer to a GtkSelectionData structure,\
    \ which is defined as:\n\n```\nstruct GtkSelectionData\n{\n    GdkAtom selection;\n\
    \    GdkAtom target;\n    GdkAtom type;\n```"
