    \ GtkList *list,\n               GList *items,\n               gint position);\n\
    ```\n\nInsert items into the list, starting at position. items is a doubly linked\
    \ list where each data pointer is expected to point to a newly created GtkListItem.\
    \ The GList nodes of items are taken over by the list.\n\n```\nvoid gtk_list_append_items(\
    \ GtkList *list,\n               GList *items);\n```\n\nInsert list items just\
    \ like gtk_list_insert_items() at the end of the list. The GList nodes of items\
    \ are taken over by the list.\n\n```\nvoid gtk_list_prepend_items( GtkList *list,\n\
    \               GList *items);\n```\n\nInsert list items just like gtk_list_insert_items()\
    \ at the very beginning of the list. The GList nodes of items are taken over by\
    \ the list.\n\n```\nvoid gtk_list_remove_items( GtkList *list,\n             \
    \  GList *items);\n```\n\nRemove list items from the list. items is a doubly linked\
