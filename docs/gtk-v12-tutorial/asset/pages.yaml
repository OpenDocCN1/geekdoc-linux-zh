  md: "# 12. Tree Widget\n\nmight want to use gtk_widget_set_size() on the scrolled\
    \ window to ensure that it is big enough to see the tree's items, as the default\
    \ size for GtkScrolledWindow is small.\n\nNow that you have a tree, you'll probably\
    \ add some items to it. 12.5 below the gory details of GtkTreeItem. For now, it'll\
    \ try to create one:\n\n```\nGtkWidget *gtk_tree_item_new_with_label( gchar *label\
    \ );\n```\n\nYou can add it to the tree using one of the following (see 12.4.2\
    \ below for more options):\n\n```\nvoid gtk_tree_append(GtkTree *tree, \n    \
    \                           GtkTreeItem *tree_item );\n\nvoid gtk_tree_prepend(GtkTree\
    \ *tree, \n                               GtkTreeItem *tree_item );\n```\n\nNote\
    \ that you must add items to a GtkTree one a time - there is no equivalent to\
    \ gtk_list_*items().\n\n# 12.2 Adding a Subtree\n\nA subtree is created like any\
    \ other GtkTree widget. A subtree is added to another branch of a tree item, using:\n\
    \n```\nvoid gtk_tree_item_set_subtree( GtkTreeItem *tree_item, \n            \
    \                   GtkTree *subtree );\n```\n\nYou do not need to call gtk_widget_show()\
    \ on a subtree before after adding it to a GtkTreeItem. However, you must have\
    \ added the GtkTreeItem in question to a parent tree before calling gtk_tree_item_set_subtree().\
    \ This is because, technically, the parent of the subtree is not the GtkTree which\
    \ \"owns\" it, but the GtkTree which holds GtkTreeItem.\n\nWhen you add a subtree\
    \ to a GtkTreeItem, a plus or minus sign appears beside it, which the user can\
    \ click on to \"expand\" or \"collapse\", to show or hide its subtree. GtkTreeItems\
    \ are collapsed by default. Note that when you collapse a GtkTreeItem, any selected\
    \ items in its subtree remain selected, which may not be what the user expects.\n\
    \n# 12.3 Handling the Selection\n\nAs GtkList, the GtkTree has a selection field,\
    \ and it is possible to control the behaviour of the tree (somewhat) by setting\
    \ the selection type using:\n\n```\nvoid gtk_tree_set_selection_mode(GtkTree *tree,\
    \ \n                               GtkSelectionMode mode );\n```\n\nThe semantics\
    \ with the various selection modes are described in the section on the GListBox\
    \ widget. With the GtkList, the \"select_child\",\"unselect\" (not see 12.4.1\
    \ below for an explanation), and \"selection_changed\" signals are emitted when\
    \ list items are selected or deselected. In order to take advantage of these signals,\
    \ you need to know which GtkTree they will be emitted by, and where to find the\
    \ list of selected items.\n\nThis is a source of potential confusion. The best\
    \ way to explain this is that all GtkTree widgets are created equal, more equal\
    \ than others. All Gtk widgets have their own X window, and can therefore receive\
    \ events such as mouse clicks (if their GtkTreeItems or their children don't catch\
    \ them!)."
