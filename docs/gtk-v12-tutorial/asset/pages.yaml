  md: "# 23. Scribble, A Simple Example Drawing Program\n\n# 23.4.1 Enabling extended\
    \ device information\n\nTo let GTK know about our interest in the extended device\
    \ information, we merely have to add a single line to our program:\n\n```\ngtk_widget_set_extension_events\
    \ (drawing_area, GTDK_EXTENSION_EVENTS_CURSOR);\n```\n\nBy giving the value GTDK_EXTENSION_EVENTS_CURSOR\
    \ we say that we are interested in extension events, but only if we don't have\
    \ to draw our cursor. See the section 23.4.4 for more information about drawing\
    \ the cursor. We could also give values GTDK_EXTENSION_EVENTS_ALL if we were intending\
    \ to draw our cursor, or GTDK_EXTENSION_EVENTS_NONE to revert to the default condition.\n\
    \nThis is not completely the end of story however. By default, no extension devices\
    \ are enabled. We need a mechanism for users to enable and configure their extension\
    \ devices. GTK provides the InputDialog widget to automate this process. The procedure\
    \ manages an InputDialog widget. It creates the dialog if it isn't present, and\
    \ raises it to the top other.\n\n```\nvoid\ninput_dialog_destroy(GtkWidget *w,\
    \ gpointer data)\n{\n    ((GtkWidget **)data) = NULL;\n}\n\nvoid\ncreate_input_dialog\
    \ (void)\n{\n    static GtkWidget *input = NULL;\n\n    if (!input)\n    {\n \
    \       input = gtk_input_dialog_new(new());\n\n        gtk_signal_connect(GTK_OBJECT(input),\
    \ \"destroy\",\n            (GtkSignalFunc)input_dialog_destroy, &input);\n  \
    \      gtk_signal_connect_object(GTK_OBJECT(GTK_INPUT_DIALOG(input))->close_button,\n\
    \            \"clicked\",\n            (GtkSignalFunc)gtk_widget_hide,\n     \
    \       GTK_OBJECT(input));\n\n        gtk_widget_hide(GTK_INPUT_DIALOG(input)->save_button);\n\
    \    }\n\ngtk_widget_show(input);\n    else\n    {\n        if (GTK_WIDGET_MAPPED(input))\n\
    \        {\n            gtk_widget_show(input);\n        }\n        else\n   \
    \         gtk_window_raise(input->window);\n    }\n}\n```\n\n(You might want to\
    \ take note of the way we handle this. By connecting to the \"destroy\" signal,\
    \ we make sure that we don't keep a pointer to a dialog after it is destroyed\
    \ - that could lead to a segfault.)\n\nThe InputDialog has two buttons \"Close\"\
    \ and \"Save\", which by default have no actions assigned to them. In the above\
    \ function we make \"Close\" the dialog, hide the \"Save\" button, but since we\
    \ don't implement saving XInput options in this program."
