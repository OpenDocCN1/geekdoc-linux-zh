    \nAt this point you have a working combo box that has been set up. There are a\
    \ few aspects of its behavior you can change. These are accomplished with the\
    \ following:\n\n```\nvoid gtk_combo_set_use_arrows(GtkCombo *combo,\n        \
    \                         int val);\n```\n\n```\nvoid gtk_combo_set_use_arrows_always(GtkCombo\
    \ *combo,\n                                     int val);\n```\n\n```\nvoid gtk_combo_set_use_arrows_sensitive(GtkCombo\
    \ *combo,\n                                          int val);\n```\n\ngtk_combo_set_use_arrows()\
    \ lets the user change the value in the entry using the up/down arrow keys. This\
    \ doesn't bring up the list, but rather replaces the current text in the entry\
    \ with the next entry (up or down, as your key chooses). It does this by searching\
    \ in the list for the item corresponding to the current value in the entry and\
    \ selecting the next/previous item. Usually in an array row keys are used to change\
    \ focus (you can do that by using TAB). Note that when the current item is the\
    \ last of the list and you press arrow-down it focuses the first item and arrow-up.\n\
    \nIf the value is not in the list, then the function of gtk_combo_set_use_arrows()\
    \ is disabled.\n\ngtk_combo_set_use_arrows_always() similarly uses the up/down\
    \ arrow keys to cycle through the choices in the dropdown list, except that it\
    \ wraps around the list, completely disabling the use of the up and down arrow\
    \ keys for changing focus.\n\ngtk_combo_set_use_arrows_sensitive() toggles whether\
    \ or not GTK searches for entries in a sensitive case within the text box. This\
    \ comparison can be performed in either a sensitive or insensitive manner, depending\
    \ upon the use of this function. The Combo widget can simply complete the current\
    \ entry if the user presses the key combination MOD-1 and 'Tab'. MOD-1 is often\
    \ mapped to the 'Alt' key. Note that some managers use this key combination, which\
    \ will override it's use within GTK.\n\nNow that we have a combo box, tailored\
    \ to look and act how we want, all that remains is being able to get data from\
    \ combo. This is relatively straightforward. The majority of the time, all you\
    \ are going to care about getting data from the entry. The entry is accessed simply\
    \ by GTK_ENTRY(GTK_COMBO(combo)->entry). The two principle that you are wanting\
    \ to go to are to attach to the activate signal, which indicates that the user\
    \ has pressed the Return or Enter key, and the text is first accomplished using\
