  md: "# 20. glib 176\n\n```\n...;\nvoid g_string_sprintf ( GString *string,\n gchar\
    \ *fmt,\n ... );\n```\n\n# 20.7 Utility and Error Functions\n\n```\ngchar *g_strdup(\
    \ const gchar *str );\n```\n\nReplacement strdup function. Copies the original\
    \ strings contents to newly allocated memory, and returns a pointer to it.\n\n\
    ```\ngchar *g_strerror( gint errnum );\n```\n\nI recommend using this for all\
    \ error messages. It's much nicer, and more portable than perror() or others.\n\
    The output is of the form:\n\n```\nprogram name:function that failed:file or further\
    \ description:strerror\n```\n\nHere's an example of one such call can be used\
    \ in our hello.world program:\n\n```\ng_print(\"hello,world:open:%s\\n\", filename,\
    \ g_strerror(errno));\n```\n\n```\nvoid g_error( gchar *format, ... );\n```\n\n\
    Prints an error message. The format is just like printf, but it prepends \"**ERROR\
    \ **:\" \" to your message, and exits the program. Use only for fatal errors.\n\
    \n```\nvoid g_warning( gchar *format, ... );\n```\n\nSame as above, prepends \"\
    ** WARNING **:\" \", and does not exit the program.\n\n```\nvoid g_message( gchar\
    \ *format, ... );\n```\n\nPrints \"message:\" prepended to the string you pass\
    \ in.\n\n```\ng_print( gchar *format, ... );\n```\n\nReplacement for printf().\n\
    And our last function:\n\n```\ngchar *g_strsignal( gint signum );\n```\n\nPrints\
    \ the name of the Unix system given the signal number. Useful in generic signal\
    \ handling functions.\n\nAll of the above are more or less just stolen from glib.h.\
    \ If anyone cares to document any function, just send me an email!"
