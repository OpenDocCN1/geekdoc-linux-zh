  md: "# 8. Range Widgets\n\nvalues set to 0.0 (which isn't very useful in this case).\
    \ In order to avoid confusing yourself, you probably want to create your adjustment\
    \ with a page_size of 0.0 so that its upper value actually corresponds to the\
    \ highest value the user can select. (If you're already thoroughly confused, read\
    \ the section 7 for again an explanation of what each adjustments do and how to\
    \ create and manipulate them).\n\n# 8.2.2 Functions and Signals (well, functions,\
    \ at least)\n\nScale widgets can display their current value as a number beside\
    \ the trough. The default behaviour is that, but you can change this with this\
    \ function:\n\n```\nvoid gtk_scale_set_draw_value(GtkScale *scale,\n         \
    \                     gint\n                              draw_value);\n```\n\n\
    As you might have guessed, draw_value is either TRUE or FALSE, with predictable\
    \ consequences for either one.\n\nThe value displayed by a scale is rounded to\
    \ one decimal point; as is the value field in its GtkAdjustment. You can change\
    \ this with:\n\n```\nvoid gtk_scale_set_digits(GtkScale *scale,\n            \
    \                  gint\n                              digits);\n```\n\nwhere\
    \ digits is the number of decimal places you want. You can set digits to anything\
    \ you like, but no more than 13 decimal places will actually be drawn on screen.\n\
    \nFinally, the value can be drawn in different positions relative to the trough:\n\
    \n```\nvoid gtk_scale_set_value_pos(GtkScale *scale,\n                       \
    \       GtkPositionType pos);\n```\n\nThe argument pos is of type GtkPositionType,\
    \ which is defined in <gtk/gtkens.h>, and can take one of the following:\n\n+\
    \   - GTK_POS_LEFT\n- GTK_POS_RIGHT\n- GTK_POS_BOTTOM\n\nIf you position the value\
    \ on the \"side\" of the trough (e.g. on the top or bottom of a horizontal scale\
    \ widget), then it will follow the slider up and down the trough.\n\nAll preceding\
    \ functions are defined in <gtk/gtkscale.h>.\n\n# 8.3 Common Functions\n\nThe\
    \ GtkRange class is famously complicated, but like the \"base class\" widgets,\
    \ most of its complexity is only interesting if you want to hack on it. Also,\
    \ almost all of the functions and signals it defines are only used in writing\
    \ derived widgets. There are, however, a few functions that are defined in <gtk/gtkrange.h>\
    \ and will work on all range widgets."
