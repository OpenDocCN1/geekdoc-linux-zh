  md: '# 8. Range Widgets


    # 8.3.1 Setting the Update Policy


    The "policy" of a range widget defines at what points user interaction it will
    change the value field of the GtkAdjustment and emit the "value_changed" signal
    on this GtkAdjustment. The update policies, defined in <gtk_gtkmenu.h> as type
    enum GtkUpdateType are:


    +   * GTK_UPDATE_POLICY_CONTINUOUS - This is the default. The "value_changed"
    signal is emitted continuously, i.e. when the slider is moved by the tiniest amount.

    * GTK_UPDATE_POLICY_DISCONTINUOUS - The "value_changed" signal is only emitted
    once the slider has stopped moving and the user has released the button.

    * GTK_UPDATE_POLICY_DELAYED - The "value_change" signal is emitted when the user
    releases the mouse button, or if the slider stops moving for a short period of
    time.


    The update policy of a range widget can be set by casting the GTK_RANGE (Widget)
    macro and passing it to this:


    ```

    void gtk_range_set_update_policy(GtkRange *range, GtkUpdateType policy);

    ```


    # 8.3.2 Getting and Setting Adjustments


    Getting and setting the adjustment for a range widget "on the fly" is done, predictably
    with:


    ```

    GtkAdjustment* gtk_range_get_adjustment(GtkRange *range);

    void gtk_range_set_adjustment(GtkRange *range, GtkAdjustment *adjustment);

    ```


    gtk_range_get_adjustment() returns a pointer to the adjustment to which range
    is already connected.

    gtk_range_set_adjustment() does absolutely nothing if you pass the adjustment
    that range is already using, regardless of whether you changed its fields or not.
    If you pass a new GtkAdjustment, it will unreference the old one it exists (possibly
    destroying it), connect the appropriate signals to the new one, and call the function
    gtk_range_adjustment_changed(), which will (at least, supposed to...) recalculate
    the size and position of the slider and redraw if necessary. As mentioned in the
    section on adjustments, if wish to reuse the same GtkAdjustment, if you modify
    your values directly, you should emit the "changed" signal on it, like this:


    ```

    gtk_signal_emit_by_name(GTK_OBJECT (adjustment), "changed");

    ```


    # 8.4 Key and Mouse bindings


    All of the GTK+ range widgets move more or less the same way. Clicking-1 in the
    trough will cause its adjustment''s page_increment to be added or subtracted from
    its value, and the slider to be moving. Clicking button-2 in the trough will jump
    the slider to the position where the button was clicked. Clicking any button on
    a scrollbar will cause the adjustment''s value to change step_increment at a time.


    It may take a little to get used, but by default, scrollbars as well as scale
    widgets can take the keyboard focus in GTK+. If you find users finding this confusing,
    you can always disable this by unsetting the GTK_CAN_FOCUS on the scrollbar, like
    this:'
