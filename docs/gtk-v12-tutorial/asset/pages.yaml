    \ngtk_main() {\n  return 0;\n}\n/* example-end */\n```\n\n# 5 Widget Overview\n\
    \nThe general steps to creating a widget in GTK are:\n\n+   1. gtk-*_new - one\
    \ of various functions to create a new widget. These are all detailed in this\
    \ section.\n2. Connect all signals and events we wish to use to the appropriate\
    \ handlers.\n3. Set the attributes of the widget.\n4. Pack the widget into a container\
    \ using the appropriate call such as gtk_container_add(or) or gtk_box_pack_start().\n\
    5. gtk_widget_show() - the widget.\n\ngtk_widget_show() lets GTK know that we\
    \ are setting the attributes of the widget again, and it is ready to be displayed.\
    \ You may also use gtk_widget_hide to make it disappear. The order in which you\
