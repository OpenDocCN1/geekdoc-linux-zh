    +   • GTK_BOX(box)


    These are used to cast arguments in functions. You''ll see them in the examples,
    and can usually tell when to use them simply by looking at the function''s declaration.


    As you can see below in the class hierarchy, all GtkWidgets are derived from the
    GtkObject base class. This means you can use a widget in any place function as
    for an object - simply use the GTK_OBJECT() macro.


    For example:


    ```

    gtk_signal_connect(GTK_OBJECT(button), "clicked", GTK_SIGNAL_FUNC(callback_function),
    callback_data);

    ```


    This casts the button into object, and provides a cast for the function pointer
    to the callback.


    Many widgets are also containers. If you look in the class hierarchy, you''ll
    notice that many widgets derive from the GtkContainer class. Any of these widgets
    may be used with the GTK_CONTAINER macro to pass them to functions that act as
    containers.


