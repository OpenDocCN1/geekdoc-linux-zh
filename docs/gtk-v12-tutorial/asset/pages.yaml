    }\n/* example-end */\n```\n\n# 12 Tree Widget\n\nThe purpose of tree widget is\
    \ to display hierarchically-organized data. The GTree widget itself is a vertical\
    \ container for widgets of type GtkTree. GTree itself is not different from GtkList\
    \ - both are derived directly from GtkContainer, and the GtkContainer methods\
    \ work in the same way as GTree widgets as Gtklists. The difference is that GTree\
    \ widgets can be nested within other GTree widgets. We will see how to do this.\n\
    \nThe GTree widget has its own window, and defaults to a white background, as\
    \ does GtkList. Also, most of the GTree methods work in the same way as the corresponding\
    \ GtkList ones. However, GTree is not derived from GtkList, so you cannot use\
    \ them interchangeably.\n\n# 12.1 Creating a Tree\n\nA GtkTree is created in the\
    \ usual way, using:\n\n```\nGtkWidget *gtk_tree_new( void );\n```\n\nLike the\
    \ Gtklist, a GtkTree will keep growing as more items are added to it, as well\
    \ as when subtrees are expanded. For this reason, they are almost always packed\
    \ into a GtkScrolledWindow. You"
