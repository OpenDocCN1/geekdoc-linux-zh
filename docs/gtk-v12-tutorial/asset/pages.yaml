  md: '# Range Widgets


    The category of range widgets includes the ubiquitous scrollbar widget and the
    less common "scale" widget. Though these two types of widgets are generally used
    for different purposes, they are quite similar in function and implementation.
    All range widgets share a set of common elements, each of which has its own window
    and receives events. They all contain a "trough" and a "slider" (which is sometimes
    called a "thumb" in other GUI environments). Dragging the slider with the pointer
    moves it back and forth within the trough, clicking it advances the slider towards
    the location of the click, either completely, or by a designated amount, depending
    on which mouse button is used.


    As mentioned in 7 above, all range widgets are associated with an adjustment object,
    from which they calculate the length of the slider and its position within the
    trough. When the user moves the slider, the range widget will change the value
    of the adjustment.


    # Scrollbar Widgets


    These are standard, run-of-the-mill scrollbars. These should be used only for
    scrolling some other widget, such as a list, a text box, or a viewport (and it''s
    generally easier to use the scrolled window in most cases). For other purposes,
    you should use scale widgets, as they are friendlier and more feature.


    There are separate types for horizontal and vertical scrollbars. There really
    isn''t much to say about them. When you create them with the following functions,
    defined in <gtk/gtkscrollbar.h> and <gtk/gttkscroll.h>:


    ```

    GtkWidget *gtk_tkscrollbar_new (GtkAdjustment *adjustment);


    GtkWidget *gtk_tkscroll_new (GtkAdjustment *adjustment);

    ```


    and that''s all about it (if you don''t believe me, look in the header files!).
    The adjustment argument can either be a pointer to an GtkAdjustment, or NULL,
    in which case one will be created for you. Specifying NULL might be useful in
    this case, if you wish to pass the newly-created adjustment to the constructor
    function of some other widget which will configure it for you, as a text widget.


    # Scale Widgets


    Scale widgets allow the user to visually select and manipulate a value within
    a specific range. You might want to use a scale widget, for example, to adjust
    the magnification level on a zoomed view of a picture, or to control the brightness
    of a colour, or to specify the number of minutes of inactivity before a screensaver
    takes over the screen.


    # Creating a Scale Widget


    As scrollbars, there are separate widget types for horizontal and vertical scale
    widgets. (Most programmers seem to favor horizontal scale widgets). Since they
    work essentially the same way as way, there''s no need to treat them separately
    here. The following functions, defined in <gtk/gtkvscale.h> and <gtk/gtkscale.h>,
    respectively:


    ```

    GtkWidget *gtk_scale_new (GtkAdjustment *adjustment);


    GtkWidget *gtk_scale_new (GtkAdjustment *adjustment);

    ```


    The adjustment argument can either be an adjustment that has already been created
    with gtk_adjustment_new(), or NULL, in which case, an anonymous GtkAdjustment
    is created with all of its'
