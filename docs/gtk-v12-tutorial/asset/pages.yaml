    label_widget = gtk_label_new (label);

    gtk_misc_set_alignment (GTK_MISC (label_widget), 0.0, 0.5);

    gtk_container_add (GTK_CONTAINER (tree_item), label_widget);

    gtk_widget_show (label)

    ```


    As one is not to add a GtkLabel to a GtkTree you could also add a GtkBox or a
    GtkArrow, or even a GtkNotebook (your app will be quite unique in this case) to
    the GtkTree.


    If you remove all items from a subtree, it will be destroyed and unwanted, unless
    you reference it beforehand, and the GtkTreeItem owns it will be. So, if you want
    to stick around, use something like the following:


    ```

    gtk_widget_ref (tree);

    owner = GTK_TREE(tree)->tree_owner;

    gtk_container_remove (GTK_CONTAINER(tree), item);

    if (tree->parent == NULL) {

    gtk_tree_item_expand (GTK_TREE_ITEM(owner));

    gtk_tree_item_set_subtree (GTK_TREE_ITEM(owner), tree);

    }

