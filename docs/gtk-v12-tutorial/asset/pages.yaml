    # 13. Menu Widget


    There are two ways to create menus, there''s the easy way, and there''s the hard
    way. Both have their uses, but you can usually use the itemfactory (the easy way).
    The "hard" way is to create all the menus using the calls directly. The easy way
    is to use the gtk_item_factory_classes. This is much simpler, but there are advantages
    and disadvantages to each approach.


    The itemfactory is much easier to use, and to add new few wrapper functions to
    create menus using the manual method could go long way towards usability. With
    the itemfactory, it is not possible to add images or the character ''/'' to the
    menus.'
