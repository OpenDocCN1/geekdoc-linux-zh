    # 10.5 Frames


    Frames can be used to enclose one or a group of widgets with a box which can optionally
    be labelled. The position of the label and the style of the box can be altered
    to suit.


    A GtkFrame can be created with the following:


    ```

    GtkWidget *gtk_frame_new( const gchar *label );

    ```


    The label is by default placed in the upper left corner of the frame. A value
    of NULL for the label argument will result in no label displayed. The text of
    the label can be changed using the next function.


    ```

    void gtk_frame_set_label( GtkFrame *frame,

    const gchar *label );

    ```


    The position of the label can be changed using this function:


    ```

    void gtk_frame_set_label_align( GtkFrame *frame,

    gfloat xalign,

    gfloat yalign );

    ```


    xalign and yalign take values between 0.0 and 1.0. xalign indicates the position
    of the label along the top horizontal of the frame. yalign is not currently used.
    The default value of xalign is 0.0 which places the label at the left end of the
    frame.


    The next function alters the style of the box that is to outline the frame.


    ```

    void gtk_frame_set_shadow_type( GtkFrame *frame,

    GtkShadowType type );

    ```


    The type argument can take one of the following values:


    +   * GTK_SHADOW_NONE

    * GTK_SHADOW_IN

    * GTK_SHADOW_OUT

    * GTK_SHADOW_ETCHED_IN (the default)

    * GTK_SHADOW_ETCHED_OUT


    The following code example illustrates the use of the Frame widget.*'
