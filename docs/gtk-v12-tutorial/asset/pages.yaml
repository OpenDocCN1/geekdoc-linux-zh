    # 11 CList Widget


    The GtkCList has replaced the GtkList (which is still available).

    The GtkCList widget is a multi-column list widget that is capable of handling
    thousands of rows of information. Each column can optionally have a title, which
    itself is optionally active, allowing us to bind a function to its selection.


    # 11.1 Creating a GtkCList widget


    Creating a GtkCList is quite straightforward, once you have learned about widgets
    in general. It provides the almost standard two ways, that is the hard way and
    the easy way. But we create it, there is one thing we should figure beforehand:
    how many columns should it have?

    Not all columns to be visible and be used to store data that is related to a certain
    cell in the list.


    ```

    Gtkwidget *gtk_clist_new (int columns);

    GtkWidget *gtk_clist_new_with_titles (int columns, gchar *titles[])

    ```


    The first form is very straightforward, the second might require some explanation.
    Each column can have a title associated with it, a label or a button that reacts
    when you click it. If we use the second, we must provide pointers to the title
    texts, and the number of pointers should equal the number of columns specified.
    Of course we can always use the first, and manually adds titles.

    Note: The GtkCList widget does not have its own scrollbars and should be placed
    within a GtkScrolledWindow if you require this functionality. This is a change
    from the GTK 1.0 implementation.'
