    gtk_main();\nreturn 0;\n```\n\n```\n/* example-end */\n```\n\n# 10 Container Widgets\n\
    \n# 10.1 The EventBox\n\nSome widgets don't have associated windows, so they just\
    \ draw on their parents. Because of this, they cannot receive events and if they\
    \ are incorrectly sized, they don't clip so you can get messy overwriting etc.\
    \ if you require more from these widgets, the EventBox is for you.\n\nAt first\
    \ glance, the EventBox might appear to be utterly useless. It draws nothing on\
    \ the screen and responds to no events. However, it does serve a function - it\
    \ provides an X window for its child widget. This is important as manyK widgets\
