    \ of:\n\n```\nGTK_TOOLBAR_TEXT\nGTK_TOOLBAR_ICONS\nGTK_TOOLBAR_BOTH\n```\n\nThe\
    \ style applies to all the buttons created with the 'item' functions (not to buttons\
    \ inserted into toolbar as separate widgets).\n\nAfter creating a toolbar one\
    \ can append, prepend and insert items (that mean simple buttons) into the toolbar.\
    \ To describe an item we need a label text, a tooltip, a private tooltip, an icon\
    \ for the button and a callback function for it. For example, to prepend or append\
    \ an item you may use the following:\n\n```\nGtkWidget *gtk_toolbar_append_item(GtkToolbar\
    \ *toolbar,\n                            const char *text,\n                 \
    \           const char *tooltip,\n                            const char *tooltip_private_text,\n\
    \                            const char *icon,\n                            GtkSignalFunc\
    \ callback,\n                            gpointer user_data);\n```\n\n```\nGtkWidget\
    \ *gtk_toolbar_prepend_item(GtkToolbar *toolbar,\n                           \
