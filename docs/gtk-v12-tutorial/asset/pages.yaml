    # 23.3 The DrawingArea Widget, And Drawing


    We know turn to the process of drawing on the screen. The widget we use for this
    is the DrawingArea widget. a drawing area is specified an X window and nothing
    more. It is a blank canvas in which we can draw whatever we like. A drawing area
    is created using the call:


    ```

    void;

    GtkWidget* gtk_drawing_area_new();

    ```


    A default size for the widget can be specified by calling:


    ```

    void gtk_drawing_area_size (GtkDrawingArea gint, int width, int height);

    ```


    This default size can be overridden, as true is for all widgets, by gtk_widget_set_size(),
    and that, in turn, can be if the user manually resizes the window containing the
    drawing area.


    It should be noted that when we create a DrawingArea widget, we completely responsible
    for drawing the contents. If our window is uncovered, we get an exposure event
    and must redraw what was previously hidden.


    Having to remember everything that was drawn on the screen so we can properly
    redraw it, to say, be a menace. In addition, it can be visually distracting if
    portions of the window are cleared, redrawn step by step. The solution to this
    problem is to use an offscreen pixmap. Instead of redrawing to the screen, we
    draw an image to stored server memory but not displayed, when the image changes
    or new portions of the image we display, we copy the relevant portions over the
    screen.


    To create an offscreen pixmap, we can function the:


    ```

    GdkPixmap* gdk_pixmap_new (Gdkwindow *window, int width, int height, int depth);

    ```


    The window parameter specifies a GDK window that this pixmap takes some of its
    properties from. width and height specify the size of the pixmap. depth defines
    the color depth, and is the number of bits per pixel, for the window. If depth
    is specified as -1, it will match the depth of window.


    We create the pixmap in our "configure_event" handler. This event is generated
    whenever the window changes size, when it is originally created.


    ```

    /* Backing pixmap for drawing area */

    static GdkPixmap *pixmap = NULL;

    ```'
