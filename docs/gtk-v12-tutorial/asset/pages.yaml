    \n# 11.4 Manipulating the list itself\n\nIt is possible to change the justification\
    \ for a column, and it is done\n\n```\nvoid gtk_clist_set_column_justification(GtkClist\
    \ *clist,\n  int column,\n  GtkJustification justification);\n```\n\nThe GtkJustification\
    \ type can take the following:\n\n+   - GTK_JUSTIFY_LEFT - The text in the column\
    \ will begin from the left edge.\n- GTK_JUSTIFY_RIGHT - The text in the column\
    \ will begin from the right edge.\n- GTK_JUSTIFY_CENTER - The text is placed in\
    \ the center of the column.\n- GTK_JUSTIFY_FILL - The text will use all available\
    \ space in the column. It is normally done by inserting blank spaces between words\
    \ (or between individual letters if it's a single word). Much like any ordinary\
    \ WYSINWY text editor.\n\nThe next function is a very important one, and should\
    \ be standard in the setup of all GtkClist widgets. When the list is created,\
    \ the width of the various columns are chosen to match their titles, and since\
    \ this is seldom the right width we have to set it using"
