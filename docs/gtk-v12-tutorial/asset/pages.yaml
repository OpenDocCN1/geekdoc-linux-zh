    \                      const char *tooltip_private_text,\n                   \
    \         const char *icon,\n                            GtkSignalFunc callback,\n\
    \                            gpointer user_data);\n```\n\nIf you want to use gtk_toolbar_insert_item,\
    \ the only additional parameter which must be specified is the position in which\
    \ the item should be inserted:\n\n```\nGtkWidget *gtk_toolbar_insert_item(GtkToolbar\
    \ *toolbar,\n                            const char *text,\n                 \
    \           const char *tooltip,\n                            const char *tooltip_private_text,\n\
    \                            const char *icon,\n                            GtkSignalFunc\
    \ callback,\n                            gpointer user_data,\n               \
