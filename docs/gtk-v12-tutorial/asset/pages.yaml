    # 19.3 Supplying the selection


    Supplying the selection is a bit more complicated. You must register handlers
    that will be called when your selection is requested. For each selection/target
    pair you will handle, you make a call to:


    ```

    void gtk_selection_add_handler( GtkWidget *widget,

    GdkAtom selection,

    GdkAtom target,

    GtkSelectionFunction function,

    GtkSelectionRemoveFunction remove_func,

    gpointer data );

    ```


    widget, selection, and target identify the requests this handler will manage.
    remove_func, if NULL, will be called when the signal handler is removed. This
    is useful, for instance, for interpreted languages which need to keep track of
    a reference count for data.


    The callback has that signature:


    ```

    typedef void (*GtkSelectionFunction)( GtkWidget *widget, GtkSelectionData *selection_data,
    gpointer data );

    ```


    The GtkSelectionData is the same as above, but this time, we are responsible for
    filling in the fields type, format, data, and length. (The format is actually
    important because the X server uses it to figure out whether the data needs to
    be byte-swapped or not. Usually it will be 8 - i.e. a character or 32 - i.e. integer.)
    This is done by calling the function:


    ```

    void gtk_selection_data_set( GtkSelectionData *selection_data, GdkAtom type, int
    format, guchar *data, gint length );

    ```


    This function takes care of making a copy of the data so that you do not have
    to worry about it around. (You should not fill in the fields of the GtkSelectionData
    structure by hand).


    When prompted by the user, you claim ownership of the selection by calling:


    ```

    gint gtk_selection_owner_set( GtkWidget *widget, GdkAtom selection, guint32 time
    );

    ```


    If another application claims ownership of the selection, you will receive a "selection_clear_event".nAs
    an example of supplying the selection, the following program adds selection functionality
    to a toggle button. When the toggle is pressed, the program claims the primary
    selection. The only target supported (aside from certain targets like "TARGETS"
    supplied by GTK itself), is the "STRING" target. When this target is requested,
    a string representation of the it is returned.


    ```

    /* example-start selection selection.c */

    #include <gtk/gtk.h>

    ```'
