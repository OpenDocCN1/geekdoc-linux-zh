  md: "# 2. Getting Started\n\n```\ngint gtk_signal_connect( GtkObject      *object,\n\
    \                    gchar               *name,\n                    GtkSignalFunc\
    \      func,\n                    gpointer            func_data );\n```\n\nThe\
    \ first argument is the widget which will be emitting the signal, and the second,\
    \ the name of the signal you wish to catch. The third is the function you wish\
    \ to be called when it is caught, and the fourth, the data you wish to pass to\
    \ this function.\n\nThe function specified in the third argument is called \"\
    callback function\", and should generally be of the form:\n\n```\nvoid callback_func(\
    \ GtkWidget *widget,\n                    gpointer            callback_data );\n\
    ```\n\nThe first argument will be a pointer to the widget that emitted the signal,\
    \ and the second, a pointer to the data given as the last argument to the gtk_signal_connect()\
    \ function as shown above.\n\nNote that the above form for a signal callback declaration\
    \ is only a general guide, as some specific signals generate different calling\
    \ parameters. For example, the GtkClList \"select_row\" provides both row and\
    \ column parameters.\n\nAnother call used in the helloworld example is:\n\n```\n\
    gint gtk_signal_connect_object( GtkObject*object,\n                    gchar \
    \              *name,\n                    GtkSignalFunc      func,\n        \
    \            GtkObject          *slot_object );\n```\n\ngtk_signal_connect_object()\
    \ is the same as gtk_signal_connect() except that the callback function only uses\
    \ one argument, a pointer to a GTK object. So when using this function to connect\
    \ signals, the callback should be of the:\n\n```\nvoid callback_func( GtkObject\
    \ *object );\n```\n\nThe object is a widget. We usually don't setup callbacks\
    \ for gtk_signal_connect_object however. They are usually used to call a GTK function\
    \ that accepts a single widget or object as an argument, as the case in our helloworld\
    \ example.\n\nThe purpose of having two functions to connect is simply to allow\
    \ the callbacks to have a different number of arguments. Many functions in the\
    \ GTK library accept only a single GtkWidget pointer as an argument, so you want\
    \ to use the gtk_signal_connectObject() for these, whereas you may need to add\
    \ additional data supplied to the callbacks.\n\n# 2.4 Events\n\nIn addition to\
    \ the signal mechanism described above, there are a set of events that reflect\
    \ the X mechanism. Callbacks may also be attached to these events. These events\
    \ are:\n\n+   * event\n* button_press\n* button_release_event\n* motion_notify_event"
