    \ keys. The arrows move the slider down by step_increment, while Page Up and Page\
    \ Down move by page_increment.\n\nThe user can also move the slider all the way\
    \ to one end or the other using the keyboard. With the GtkScale widget, this is\
    \ done with the Home and End keys, whereas with the GtkVscroll widget, this is\
    \ done by tuning Control-Page Up and Control-Page Down.\n\n# 8.4.2 Horizontal\
