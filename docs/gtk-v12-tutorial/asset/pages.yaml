  md: "# GTK's rc Files\n\nThis example takes the \"button\" style, and creates a\
    \ new \"main_button\" style simply by changing the font and prelight background\
    \ color of the \"button\" style.\n\nOf course, many of these attributes do not\
    \ apply to all widgets. It's a simple matter of common sense really. Anything\
    \ could apply, should.\n\n# 21.3 Example rc file\n\n```\n# pixmap_path \"dir 1><dir\
    \ 2><dir 3>...\"\n#\npixmap_path \"usr/include/X11R/pixmaps:home/main/pixmaps\"\
    \n#\n# style <name> = <name>\n{\n    <option>\n}\n#\n# widget <widget_set> style\
    \ <style_name>\n# widget_class <widget_class_set> style <style_name>\n```\n\n\
    ```\n# Here is a list of all the possible states.\n# certain widgets.\n#\n# NORMAL\
    \ - The normal state of a widget, without the mouse over top of\n# it, and not\
    \ being pressed once.\n#\n# PRELIGHT - When the mouse is over top of the widget,\
    \ colors defined\n# using this state will be in effect.\n#\n# ACTIVE - When the\
    \ widget is pressed or clicked it will be active, and\n# the attributes assigned\
    \ by this tag will be in effect.\n#\n# INSENSITIVE - When a widget is set insensitive,\
    \ and cannot be\n# activated, it will take these attributes.\n#\n# SELECTED -\
    \ When an object is selected, it takes these attributes.\n#\n# Given these states,\
    \ we can set the attributes of the widgets in each of\n# these states using the\
    \ following directives.\n#\n# fg - Sets the foreground color of a widget.\n# fg\
    \ - Sets the background color of a widget.\n# bg_pixmap - Sets the background\
    \ of a widget to a tiled pixmap.\n# font - Sets the font to be used with the given\
    \ widget.\n```\n\n```\n# This sets a style called \"button\". The name is not\
    \ really important, and\n# it is assigned to the actual widgets at the bottom\
    \ of the file.\n```\n\n```\nstyle \"window\"\n{\n#This sets the padding around\
    \ the window to the pixmap specified.\n#bg_pixmap[STATE] = \"pixmap filename\"\
    \nbg_pixmap[NORMAL] = \"warning.xpm\"\n}\n```"
