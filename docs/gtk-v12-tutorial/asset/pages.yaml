  md: "# 14. Text Widget\n\nPassing a value of NULL as the value for the foreground\
    \ color, background colour or font will result in the values set within the widget\
    \ style to be used. Using a value of -1 for the length parameter will result in\
    \ the whole of the string being inserted.\n\nThe text widget is one of the few\
    \ GTK that redraws itself dynamically, outside of the gtk_main function. Means\
    \ that all changes to the contents of the text widget take effect immediately.\
    \ This may be undesirable performing multiple changes to the text widget. In order\
    \ to us perform multiple updates to the text widget without continuously redrawing,\
    \ we can freeze the widget, which temporarily stops it from automatically redrawing\
    \ every time it is changed. We can then thaw the widget after our updates are\
    \ complete.\n\nThe following functions perform this freeze and thaw:\n\n```\n\
    void gtk_gtk_freeze( GtkText *text );\n```\n\n```\nvoid gtk_gtk_thaw( GtkText\
    \ *text );\n```\n\nThe text widget is deleted relative to the text insertion point\
    \ by the following two functions. The return value is a TRUE or FALSE indicator\
    \ of whether the operation was successful.\n\n```\nint gtk_gtk_backward_delete(\
    \ GtkText *text,\n                gint\n                nchars );\n```\n\n```\n\
    int gtk_gtk_forward_delete( GtkText *text,\n                gint\n           \
    \     nchars );\n```\n\nIf you want to retrieve the contents of the text widget,\
    \ the macro GTK_TEXT_INDEX(t, index) allows you to retrieve the character at position\
    \ index within the text widget t.\n\nTo retrieve larger blocks of text, we can\
    \ use the function\n\n```\ngchar *gtk_editable_get_chars( GtkEditable *editable,\n\
    \                gint\n                start_pos,\n                gint\n    \
    \            end_pos );\n```\n\nThis is a function of the parent class of the\
    \ text widget. A value of -1 as end_pos signifies the end of the text. The index\
    \ of the text starts at 0.\n\nThe function allocates a new chunk of memory for\
    \ the text block, so don't forget to free it with a call to g_free when you have\
    \ finished with it.\n\n# 14.3 Keyboard Shortcuts\n\nThe text widget has a number\
    \ of pre-installed keyboard shortcuts for common editing, motion and selection\
    \ functions. These are accessed using Control and Alt key combinations.\n\nIn\
    \ addition to, holding the Control key whilst cursor key movement will move the\
    \ cursor by words rather than characters. Holding down Shift whilst cursor key\
    \ movement will extend the selection.\n\n# 14.3.1 Motion Shortcuts\n\n+   - Ctrl-A\
    \ Beginning of line\n- Ctrl-E End of line\n- Ctrl-N Next Line"
