  md: "# 4. Packing Widgets\n\n```\ngtk_box_pack_start(GTK_BOX(box1), button, TRUE,\
    \ TRUE, 0);\n\n/* The order in which we show the buttons is not really important,\
    \ but I\n* recommend showing the window last, so it all pops up at once. */\n\
    gtk_widget_show(box1);\n\ngtk_widget_show(window);\n\n/* Rest in main and wait\
    \ for the fun to begin! */\ngtk_main();\n\n    return(0);\n}\n/* example-end */\n\
    ```\n\nCompile this program using the linking arguments as our first example.\
    \ You'll notice this time there is no easy way to exit the window, you have to\
    \ use your window manager or command to kill it. A good exercise for the reader\
    \ would be to insert a \"Quit\" button that will exit the window. You may also\
    \ wish to play with the options to gtk_box_pack_start() while reading the next\
    \ section. Try resizing the window, and observe the behavior.\n\nAs a side note,\
    \ there is another define for gtk_window_new() - GTK_WINDOW_DIALOG. This interacts\
    \ with the window manager a little differently but suited for transient windows.\n\
    \n# 4 Packing Widgets\n\nWhen creating an application, you'll want to put more\
    \ than one widget inside a window. Our first helloworld example only used one\
    \ widget so could simply use gtk_container_add to \"pack\" the widget into the\
    \ window. When you want to put more than one widget into a window, how do you\
    \ control where that widget is positioned? This is where packing comes in.\n\n\
    # 4.1 Theory of Packing Boxes\n\nMost packing is done by creating boxes in the\
    \ example above. These are invisible containers that we can pack our widgets into\
    \ which comes in two forms, a horizontal box, and a vertical box. When packing\
    \ widgets into a horizontal box, the objects are inserted horizontally from left\
    \ to right or to resize them on the call. In a vertical box, you may use any combination\
    \ of boxes inside or outside boxes to create the desired effect.\n\nTo create\
    \ a horizontal box, we use gtk_box_new(), and for vertical boxes, gtk_box_new().\
    \ The gtk_box_pack_start() and gtk_box_pack_end() functions are used to place\
    \ objects inside of these. The gtk_box_pack_start() function will start at the\
    \ top and work its down in a vbox, and pack left in an hbox; gtk_box_pack_end()\
    \ will do the opposite, packing from bottom to top in a vbox, and pack left in\
    \ an hbox. Using these functions allows us to justify left or justify our widgets\
    \ and may be mixed in any way to achieve the desired effect. We gtk_box_pack_start()\
    \ in most of our examples. including the bottom, but we usually use only one label\
    \ inside a border.\n\nBy using these calls, GTK knows where you want to pack your\
    \ widgets so it can do automatic resizing and other nifty things. There's also\
    \ a number of options to how your widgets should be packed. As you can imagine,\
    \ this method gives you quite a bit of flexibility when placing and creating widgets."
