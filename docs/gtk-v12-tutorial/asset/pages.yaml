    When a button is treated as a container (instance, when it is resized), its class
    structure can be cast to GtkContainerClass, and the relevant fields used to handle
    the signals.


    There is also a structure for each widget that is created on a per-instance basis.
    This structure has fields to store information that is different for each instance
    of the widget. We''ll call this structure structure. For the button class, it
    looks like:


    ```

    struct _GtkButton

    {

    GtkContainer container;

    GtkWidget *child;

    guint in_button : 1;

    guint button_down : 1;

    }

    ```


    Note, similar to the class structure, the first field is the object structure
    of the parent class, so that this structure can be cast to the parent class''s
    object structure as needed.


    # 22.3 Creating a Composite widget


    # 22.3.1 Introduction


    One type of widget that you may be interested in is a widget that is merely an
    aggregate of other GTK widgets. This type of widget does nothing that couldn''t
    be done without creating new widgets, but provides a convenient way of packing
    user interface elements for reuse. The FileSelection and ColorSelection widgets
    in the standard distribution are examples of this type of widget.


    The example that we''ll create in this section is the Tictactoe, a 3x3 array of
    toggle buttons which triggers a signal when all buttons in a row, column, or one
    of the diagonals are depressed.


    # 22.3.2 Choosing a parent class


    The parent class for a composite widget is typically the container class that
    holds all of the elements of the composite widget. For example, the parent class
    of the FileSelection widget is the Dialog class. Since our buttons will be arranged
    in a table, it might seem natural to make our parent class the GtkClass. Unfortunately,
    this turns out not be. The creation of a widget is divided among two functions:
    a WIDGET_new() function that calls the user, and a WIDGET_init() function which
    does the basic work of initializing the widget which is independent of the arguments
    passed to the new function(). Descendants only call the _init function of their
    parent widget. But this division of labor doesn''t work well for tables, which
    needed, to know the number of rows and columns in the table. Unless we want to
    duplicate most of the functionality of gtk_table_new() in our Tictactoe widget,
    we best avoiding it from GtkTable. For that reason, we derive it from GtkVBox
    instead, and stick our table inside the VBOX.'
