  md: "# 12. Tree Widget\n\nHowever, to make GTK_SELECTION_SINGLE and GTK_SELECTION_BROWSE\
    \ types behave in a sane manner, the list of selected items is specific to the\
    \ topmost GtkTree in a hierarchy, as the \"root tree\".\n\nThus, accessing the\
    \ selectionfield directly in an arbitrary Gtk widget is not a good idea unless\
    \ you know it's the root tree. Instead use the GTK_SELECTION (Tree) macro, which\
    \ gives the root tree's selection list as a GList pointer. Of course, this list\
    \ can include items that are not in subset if the selection type is GTK_SELECTION_MULTIPLE.\n\
    \nFinally, the \"select_child\" and \"unset_child\" signals are emitted by all\
    \ trees, but the \"selection_changed\" signal is only emitted by the root tree.\
    \ Consequently, if you want to handle the \"select_child\" signal for a tree and\
    \ all its subtrees, you will have to call gtk_signal_connect() for every subtree.\n\
    \n# 12.4 Tree Widget Internals\n\nThe GtkTree's struct definition looks like this:\n\
    \n```\nstruct GtkTree {\n  GtkContainer container;\n\n  GList *children;\n\n \
    \ GtkWidget* root_tree; /* owner of selection list */\n  GtkWidget* tree_owner;\n\
    \  GList *selection;\n  guint level;\n  guint indent_value;\n  guint current_indent;\n\
    \  guint selection_mode : 2;\n  guint view_mode : 1;\n  guint view_line : 1;\n\
    }\n```\n\nThe perils associated with accessing the selection field directly have\
    \ already been mentioned. The other fields of the struct can be accessed with\
    \ handy macros or class functions. GTK_IS_ROOT_TREE(Tree) returns a boolean value\
    \ whether a tree is the root tree in a Gtk hierarchy, while GTK_ROOT_TREE(Tree)\
    \ returns the root tree, an object of type GtkWidget (so, remember to cast it\
    \ GTK_WIDGET if you want to use one of the gtk_widget.* functions() on it).\n\n\
    Instead of directly accessing the child field of a GtkTree, it's probably best\
    \ to use GTK_CONTAINER(Tree), and pass it to gtk_container_children(). This creates\
    \ a duplicate of the original list, so it's advisable to free it using g_list_free()\
    \ after you're done with it, or to iterate on it destructively, like this:\n\n\
    ```\nchildren = gtk_container_children(GTK_CONTAINER(tree));\nwhile (children)\
    \ {\n  do_something(GTK_TREE_ITEM(data));\n  children = g_list_remove_link(children,\
    \ children);\n}\n```\n\nThe tree_owner field is only defined in, where it points\
    \ to the GtkTreeItem which holds the tree in successive. The level field indicates\
    \ how deeply a particular tree is; root trees have level 0, and each successive\
    \ level of subtree has a level greater than the parent level. This field is set\
    \ only after a Gtk widget is mapped (i.e. drawn on the screen)."
