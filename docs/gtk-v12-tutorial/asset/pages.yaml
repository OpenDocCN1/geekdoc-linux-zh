  md: "# 13. Menu Widget\n\nHere is a summary of the steps needed to create a menu\
    \ bar with menus attached:\n\n+   - Create a new menu using gtk_menu_new()\n-\
    \ Use multiple calls to gtk_menu_new() for each item you wish to have on your\
    \ menu. And use gtk_menu_append() to put each of these new items onto the menu.\n\
    - Create a menu item using gtk_menu_item_new(). This will be the root of the menu,\
    \ the text appearing here will be on the menus label.\n- Use gtk_menu_item_set_submenu()\
    \ to attach the menu to the root menu item (the one created in the above step).\n\
    - Create a new menubar using gtk_menu_bar_new(). This step only needs to be done\
    \ once when creating a series of menus on one menu bar.\n- Use gtk_menu_bar_append()\
    \ to put the root menu onto the menubar.\n\nCreating a popup menu is nearly the\
    \ same. The difference is that the menu is not posted 'automatically' by a menubar,\
    \ but explicitly by calling the function gtk_menu_popup() from a button-press\
    \ event, for example. Take these steps:\n\n+   - Create an event handling function.\
    \ It needs to have the prototype\n```c\nstatic gint handler (GtkWidget *widget,\
    \ GdkEvent *event);\n```\nand it will use the event to find out where pop up the\
    \ menu.\n- In the event handler, if there is a mouse press, treat event as a button\
    \ event (which is it) and use it in the sample code to pass information to gtk_menu_popup().\n\
    - Bind that event handler to a widget with\n```c\ngtk_signal_connect_object(GTK_OBJECT\
    \ (widget), \"event\", GTK_SIGNAL_FUNC (handler), GTK_OBJECT (menu));\n```\n\n\
    where widget you are binding to, handler is the handling function, and menu is\
