    \ the general change will to be reflected by every widget that uses this adjustment,\
    \ GTK+ provides this function to do:\n\n```\nvoid gtk_adjustment_set_value( GtkAdjustment\
    \ *adjustment,\n                               gfloat\n                      \
    \         value );\n```\n\nAs mentioned earlier, GtkAdjustment is a subclass of\
    \ GtkObject like all the various widgets, and thus it is able to emit signals.\
    \ It is, of course, handled automatically when you share an adjustment object\
    \ between a scrollbar and another adjustable widget; all adjustable widgets connect\
    \ signal handlers to their value_changed signal, as you can program. Here's the\
    \ definition of this signal in struct GtkAdjustmentClass:\n\n```\nvoid (* value_changed)\
    \ (GtkAdjustment *adjustment);\n```\n\nThe widgets that use GtkAdjustment will\
    \ emit this signal on adjustment whenever they change their value. This happens\
    \ when user input causes the slider to move on a range widget, as when the program\
    \ explicitly changes the value with gtk_adjustment_set_value(). So, for example,\
    \ if you have a scale widget, and you want to change the rotation of a picture\
    \ whenever it changes, you would create a callback like this:\n\n```\nvoid cb_rotate_picture(GtkAdjustment\
    \ *adj, GtkWidget *picture)\n{\n    set_picture_rotation(picture, adj->value);\n\
    }\\...\n```\n\nand connect it to the scale widget adjustment like this:\n\n```\n\
    gtk_signal_connect (GTK_OBJECT (adj), \"value_changed\",\n                   \
    \            GTK_SIGNAL_FUNC (cb_rotate_picture), picture);\n```\n\nWhat about\
