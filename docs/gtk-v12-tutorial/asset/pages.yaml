    \ user adds text to a text widget? In this case, the changed signal, which looks\
    \ like this:\n\n```\nvoid (* changed) (GtkAdjustment *adjustment);\n```\n\nRange\
    \ widgets usually connect to this signal, which changes their appearance to reflect\
    \ the change - for example, the size of the slider in a scrollbar will grow or\
    \ shrink in inverse proportion to the difference between the lower and upper values\
    \ of its adjustment.\n\nYou probably won't need to attach a handler to this signal,\
