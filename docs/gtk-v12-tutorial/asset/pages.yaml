    \n/* example-end */\n```\n\n# 4.4 Using Tables\n\nLet's take a look at another\
    \ way of packing - Tables. These can be extremely useful in certain situations.\n\
    \nUsing tables, we create a grid that we can place widgets. The widgets may take\
    \ up as many spaces as we specify.\n\nThe first thing to look at of course, is\
    \ the gtk_table_new function:\n\n```\nGtkWidget *gtk_table_new(gint rows,\ngint\
    \ columns,\ngint homogeneous);\n```\n\nThe first argument is the number of rows\
    \ to make in the table, the second, obviously, is the number of columns.\nThe\
    \ homogeneous argument is to do with how the table boxes are sized. If homogeneous\
    \ is TRUE, the table boxes are resized to the size of the largest widget in the\
    \ table. If homogeneous is FALSE, the table boxes is dictated by the tallest widget\
    \ in its row, and the widest widget in its column.\n\nThe rows and columns are\
    \ laid out from 0 to n, where n was the number specified in the call to gtk_table_new.\
    \ If you use rows = 2 and columns = 2, the layout would look like this:\n\n| 0\
    \ | 1 | 2 |\n|---|---|---|\n| 0+ | | | |\n| | | | |\n 1+ | | | |\n| | | | |\n\
    \ 2+ | | | |\n\nNote that the coordinate system starts in the upper left hand\
    \ corner. To place a widget into a box, use the following function:"
