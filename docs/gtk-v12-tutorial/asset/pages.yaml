    \ of the GtkList widget that will be of greater interest to us,\nis is:\n\n```\n\
    struct _GtkList\n{\n    GtkList *selection;\n    guint selection_mode;\n};\n```\n\
    \nThe selection field of a GtkList points to a linked list of all items that are\
    \ currently selected, NULL if the selection is empty. To learn about the current\
    \ selection we read the GTK_LIST()->selection field, but do not modify it since\
    \ the internal fields are maintained by the gtk_list.*() functions.\n\nThe selection_mode\
    \ of the GtkList determines the selection facilities of a GtkList and therefore\
    \ the contents of the GTK_LIST()->selection field. The selection may be one of\
    \ the following:\n\n+   * GTK_SELECTION_SINGLE - The selection is NULL or contains\
    \ a GList pointer for a single selected item.\n* GTK_SELECTION_BROWSE - The selection\
    \ is NULL if the list contains no widgets or insensitive ones only, otherwise\
    \ it contains a GList pointer for one GList structure, and therefore exactly one\
    \ list item.\n* GTK_SELECTION_MULTIPLE - The selection is NULL if no list items\
    \ are selected or a GList pointer for the first selected item. In turn turns to\
    \ a GList structure for the second selected item and so on.\n* GTK_SELECTION_EXTENDED\
    \ - The selection is always NULL.\n\nThe default is GTK_SELECTION_MULTIPLE.\n\n\
    # D.1 Signals\n\n```\nvoid selection_changed( GtkList *list );\n```\n\nThis signal\
    \ will be invoked whenever the selection of a GtkList changes. This happens when\
    \ a child of the GtkList got selected or deselected.\n\n```\nvoid select_child(\
    \ GtkList *list,\nGtktkWidget *child);\n```"
