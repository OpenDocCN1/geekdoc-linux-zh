  md: '# 10. Container Widgets


    # 10.12 Notebooks


    The Notebook Widget is a collection of ''pages'' that overlap each other, each
    page contains different information. This widget has become more common lately
    in GUI programming, and it is a good way to show blocks of similar information
    that warrant separation in their display.


    The first function you will need to know, as you can probably guess by now, is
    used to create a notebook widget.


    ```

    GtkWidget *gtk_notebook_new( void ) ;

    ```


    Once the notebook has been created, there are a number of functions that operate
    on the notebook widget. Let''s look at them individually.


    The first one we will look at is how to position the page indicators. These page
    indicators or ''tabs'' as they are referred to, can be positioned in four ways:
    top, bottom, left, or right.


    ```

    void Gtk_notebook_set_tab_pos( GtkNotebook *notebook, GtkPositionType pos );

    ```


    GtkPositionType will be one of the following, which are pretty self explanatory:


    +   * GTK_POS_LEFT

    * GTK_POS_RIGHT

    * GTK_POS_TOP

    * GTK_POS_BOTTOM'
