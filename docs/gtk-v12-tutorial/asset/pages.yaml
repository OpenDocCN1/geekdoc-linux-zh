  md: "# 4. Packing Widgets\n\n```\nvoid gtk_table_attach( GtkTable *table,\n    \
    \         GtkWidget *child,\n             gint       left_attach,\n          \
    \   gint       right_attach,\n             gint       top_attach,\n          \
    \   gint       bottom_attach,\n             gint       xoptions,\n           \
    \  gint       yoptions,\n             gint       padding,\n             gint \
    \      padding\n );\n```\n\nWhere the first argument (\"table\") is the table\
    \ you've created and the second (\"child\") the widget you wish to place in the\
    \ table.\n\nThe left and right attach arguments specify where to place the widget,\
    \ and how many boxes to use. If you want a button in the lower right entry of\
    \ our 2x2 table, and want it to fill that entry ONLY, left_attach = 1, right_attach\
    \ = 2, top_attach = 1, bottom_attach = 2.\n\nNow, if you wanted to take up the\
    \ top row of our 2x2 table, you'd use left_attach = 0, right_attach = 2, top_attach\
    \ = 0, bottom_attach = 1.\n\nThe options and yoptions are used to specify packing\
    \ options and may be bitwise OR'ed together to allow multiple options.\n\nThese\
    \ options are:\n\n+   - GTK_SHINK - If the box is larger than the widget, and\
    \ GTK_FILL is specified, the widget will expand to use all the room available.\n\
    \n+   - GTK_SHRINK If the widget is allocated less space than requested (by the\
    \ user resizing the window), the widgets would normally just be pushed off the\
    \ bottom of the window and disappear. If GTK_SHRINK is specified, the widgets\
    \ will shrink with the table.\n\n+   - GTK_EXPAND This will cause the table to\
    \ expand to use any remaining space in the window.\n\nPadding is left to use in\
    \ boxes, creating a clear area around the widget specified in pixels.\n\n```\n\
    void gtk_table_attach_defaults( GtkTable *table,\n             GtkWidget *widget,\n\
    \             gint       left_attach,\n             gint       right_attach,\n\
    \             gint       top_attach,\n             gint       bottom_attach\n\
    \ );\n```\n\nThe X and Y options default to GTK_FILL | GTK_EXPAND, and X and Y\
    \ padding are set to 0. The rest of the arguments are identical to the previous\
    \ function.\n\nWe also have gtk_table_set_row_row_spacing() and gtk_table_set_col_spacing().\
