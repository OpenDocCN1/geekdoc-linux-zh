  md: '# 13. Menu Widget


    # 13.1 Manual Menu Creation


    In the true tradition of teaching, we''ll show you the hard first. : )


    There are three widgets that go into making a menubar and submenus:


    +   - a menu item, which is what the user wants to select, e.g. ''Save''


    +   - a menu, which acts as a container for the menu items, and


    +   - a menubar, which is a container for each of the individual menus.


    This is slightly complicated by the fact that menu item widgets are used for two
    different things. They are both the widgets that are packed into the menu, and
    the widget that is packed into the menubar, when selected, activates the menu.


    Let''s look at the functions that are used to create menus and menubars. This
    first function is used to create a new menubar.


    ```

    GtkWidget gtk_menu_bar_new( void );

    ```


    This rather self explanatory function creates a new menubar. You use gtk_container_add
    to pack this into a window, or the gtk_box_pack functions to pack it into a box
    - the same as buttons.


    ```

    GtkWidget gtk_menu_new( void );

    ```


    This function returns a pointer to a new menu, it is never actually shown (with
    gtk_widget_show), it is just a container for the menu items. Hopefully this will
    become clear when you look at the example below. The next two are used to create
    menu items that are packed into the menu (and menubar).


    ```

    GtkWidget gtk_menu_item_new( void );

    ```


    and


    ```

    GtkWidget gtk_menu_item_new_with_label( const char *label );

    ```


    These are used to create the menu items that to be displayed. Remember to differentiate
    between a "menu" as created with gtk_menu_item_new and a "menu item" as created
    by the gtk_menu_item_new_functions. The menu item will be an actual button with
    an associated action, whereas a menu will be a container holding menu items.


    The gtk_menu_new_with_label and gtk_menu_new functions are just as you expect
    after reading about the buttons. One creates a new menu with a label already packed
    into it, and the other creates a blank menu item.


    Once you''ve created a menu item you have to put it into a menu. This is done
    using the function gtk_menu_append. In order to capture when the menu is selected
    by the user, we need to connect to the activate signal using. So, if you want
    to create a static File menu, you will use the Options Save and Quit the code
    would look something like:


    ```

    file_menu = gtk_menu_new();   /* Don''t need to show menus */nopen_item = gtk_menu_item_new_with_label("Open");

    save_item = gtk_menu_item_new_with_label("Save");

    quit_item = gtk_menu_item_new_with_label("Quit");

    ```'
