  md: "# 22. Writing Your Own Widgets\n\ngtk_signal_new() returns a unique identifier\
    \ for the signal, that we store in the tictactoe_signals array, which we index\
    \ using an enumeration. (Conventionally, the enumeration elements are the name,\
    \ uppercase, but here there would be a conflict with the TITACTOE() macro, so\
    \ we called it TITACTOE_SIGNAL instead.\n\nAfter creating signals, we need to\
    \ tell GTK to associate signals with the Tictactoe class. We do that by calling\
    \ gtk_object_class_add_signals(). We set the pointer which points to the default\
    \ handler for the 'tictactoe' signal to NULL, indicating that there is no default\
    \ action.\n\n# 22.3.6 The _init() function.\n\nEach widget class also needs a\
    \ function to initialize the object structure. Usually, this function has the\
    \ fairly limited role of setting the fields of the structure to default values.\
    \ For composite widgets, however, this function also creates the component widgets.\n\
    \n```\nstatic void\ntictactoe_init (Tictactoe *ttt)\n{\nGtkWidget *table;\nint\
    \ i,j;\n\ntable = gtk_table_new(3, 3, TRUE);\ngtk_container_add(GTK_CONTAINER(ttt),\
    \ table);\ngtk_widget_show(table);\n\nfor (i=0;i<3; i++) {\n  for (j=0;j<3; j++)\
    \ {\n    ttt->buttons[i][j] = gtk_button_new();\n    gtk_table_add_defaults(GTK_TABLE(table),\
    \ ttt->buttons[i][j],\n      1, i+1, j+1);\n    gtk_signal_connect(GTK_OBJECT(ttt->buttons[i][j]),\
    \ \"toggle\",\n      GTK_SIGNAL_FUNC(tictactoe_toggle), ttt);\n    gtk_widget_set_size(ttt->buttons[i][j],\
    \ 20, 20);\n    gtk_widget_show(ttt->buttons[i][j]);\n  }\n}\n```\n\n# 22.3.7\
    \ And for the rest...\n\nThere is one function that every widget (except for base\
    \ types like GtkBin) cannot be instantiated to have - the function that the user\
    \ calls to create an object of type. This is conventionally called WIDGETNAME_new().\
    \ In some widgets, not for the Tictactoe widgets, this function takes arguments,\
