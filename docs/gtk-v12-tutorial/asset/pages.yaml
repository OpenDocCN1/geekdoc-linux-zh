  md: "# 23. Scribble, A Simple Example Drawing Program\n\n# 23.4.2 Using extended\
    \ device information\n\nOnce we've enabled the device, we can just use the extended\
    \ device information in the extra fields of the event structures. In fact, it\
    \ is always safe to use this information since these fields will have reasonable\
    \ default values even when extended events are not enabled.\n\nOnce change we\
    \ do have to make is to call gdk_input_window_get_pointer() instead of gdk_window_get_pointer.\
    \ This is necessary because gdk_window_get_pointer doesn't return the extended\
    \ device information.\n\n```\nvoid gdk_input_window_get_pointer( GdkWindow *window,\n\
    \                    gint32 device,\n                    gdouble *x,\n       \
    \             gdouble *y,\n                    gdouble *pressure,\n          \
    \          gdouble *xtilt,\n                    gdouble *ytilt,\n            \
    \        GdkModifierType *mask);\n```\n\nWhen calling this function, we need to\
    \ specify the ID as the window. Usually, we'll get the device ID from the device\
    \ field of an event structure. When extension events are not enabled. In this\
    \ case, event->device will return the value GDK_CORE_POINTER.\n\nSo the structure\
    \ of our button-press and motion event handlers, doesn't change much - we just\
    \ need to add code to the extended information.\n\n```\nstatic int\nbutton_press_event(GdkWidget\
