    # 14 Text Widget


    The Text widget allows multiple lines of text to be displayed and edited. It supports
    both multi-colored and multi-font text, allowing them to be mixed in any way we
    wish. It also has a wide set of key based text editing commands, which are compatible
    with Emacs.


    The text widget supports full cut-and-paste facilities, including the use of double-
    and triple-click to select a word and a whole line, respectively.


    # 14.1 Creating and Configuring a Text box


    There is only one function for creating a Text widget.


    ```

    GtkWidget *gtk_text_new( GtkAdjustment *hadj,

    GtkAdjustment *vadj);

    ```


    The arguments allow us to give the Text widget pointers to Adjustment that can
    be used to track the viewing of the widget. Passing NULL to either or both of
    arguments will cause the gtk_text_new function to create its own.


    ```

    void gtk_text_set_adjustments( GtkText *text,

    GtkAdjustment *hadj,

    GtkAdjustment *vadj );

    ```


    The above function allows the horizontal and vertical adjustments of a text widget
    to be changed at any time.


    The text widget will not automatically create its own scrollbars when the amount
    of text to be displayed is too long for the display window. We therefore have
    to create and add them to the display layout ourselves.


    ```

    scrollbar = gtk_scrollbar_new(GTK_TEXT(text)->vadj);

    gtk_box_pack_start(GTK_BOX (hbox), scrollbar, FALSE, FALSE, 0);

    gtk_widget_show(scrollbar);

    ```'
