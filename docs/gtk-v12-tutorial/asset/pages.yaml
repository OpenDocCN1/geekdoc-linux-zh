  md: "# 20.4 Memory Management\n\n```\ngpointer g_malloc( gulong size );\n```\n\n\
    This is a replacement for malloc(). You do not need to check the return value\
    \ as it is done for you in this function. If the memory allocation fails for whatever\
    \ reasons, your applications will be terminated.\n\n```\ngpointer g_malloc0{ gulong\
    \ size );\n```\n\nSame as above, but frees the memory before returning a pointer\
    \ to it.\n\n```\ngpointer g_realloc( gpointer mem,\n    gulong size );\n```\n\n\
    Relocates \"size\" bytes of memory starting at \"mem\". Obviously, the memory\
    \ should have been previously allocated.\n\n```\nvoid g_free( gpointer mem );\n\
    ```\n\nFrees memory. Easy one. If mem is NULL it simply returns.\n\n```\nvoid\
    \ g_mem_profile( void );\n```\n\nDumps a profile of used memory, which requires\
    \ that you add #define MEM.PROFILE to the top of glib/gnem.c and re-make and make\
    \ install.\n\n```\nvoid g_mem_check( gpointer mem );\n```\n\nChecks that a memory\
    \ location is valid. Requires you to add #define MEM.CHECK to the top of gnem.c\
    \ and re-make and make install.\n\n# 20.5 Timers\n\nTimer functions can be used\
    \ to time operations (e.g. to see how much time has elapsed). First, you create\
    \ a new timer with g_timer.new(). You can then use g_timer.start() to start timing\
    \ an operation, g_timer.stop() to stop timing an operation, g_timer.elapsed()\
    \ to determine the elapsed time.\n\n```\nGTimer *g_timer_new( void );\n```\n\n\
    ```\nvoid g_timer_destroy( GTimer *timer );\n```\n\n```\nvoid g_timer_start( GTimer\
    \ *timer );\n```\n\n```\nvoid g_timer_stop( GTimer *timer );\n```\n\n```\nvoid\
    \ g_timer_reset( GTimer *timer );\n```\n\n```\ngdouble g_timer_elapsed( GTimer\
    \ *timer,\n    gulong *microseconds );\n```"
