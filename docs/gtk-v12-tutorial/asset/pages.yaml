    The pixmaps_field is a GtkEvent which catches clicks on the plus/minus symbol
    which controls expansion and collapsing. The pixmaps field points to an internal
    data structure. Since you can always obtain the subtree of a GtkTreeItem in a
    (relatively) type-safe manner by the GTK_TREE_ITEM_SUBTREE (Item) macro, it’s
    properly advisable not to touch the insides of a GtkTreeItem unless you know what
    you’re doing.


    Since it is derived directly from a GtkItem it can be treated as by using the
    GTK_ITEM (TreeItem) macro. GtkTreeItem usually has labels, so the function gtk_list_item_new_with_label()
    is provided. The same effect can be achieved using code like the following, which
    is actually copied verbatim from gtk_tree_item_new_label:


    ```

