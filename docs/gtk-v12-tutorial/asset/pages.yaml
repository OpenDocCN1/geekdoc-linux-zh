    # 7 Adjustments


    GTK+ has widgets that can be visually adjusted by the user using the mouse or
    the keyboard, as the range widgets, described in the 8 section. There are also
    a few widgets that display adjustable portion of a larger area of data, such as
    the text widget and the viewport widget.


    Obviously, an application needs to be able to react to changes the user makes
    in range widgets, and either would to have each widget emit its own type of signal
    when its adjustment changes, and either pass the new value to the signal handler,
    or require it to look inside the widget''s data structure to ascertain the value.
    You may also want to connect the adjustments of various widgets together, so that
    adjusting one the others. The most obvious example of this is connecting a scroll
    to a panning viewport or a scroll. Each widget has its own way of setting or getting
    the adjustment value, then the programmer may have to use their own signal handlers
    to translate the output of one widget''s signal and the "input" of another''s
    adjustment function.


    GTK+ solves this using the GtkAdjustment object, which is a way for widgets to
    store and pass information in an abstract and flexible form. The most obvious
    use of GtkAdjustment is to store the configuration parameters and values of range
    widgets, such as scrollbars and scale controls. However, since GtkAdjustments
    are derived from GtkObject, they have some special powers beyond those of normal
    data structures. Most importantly, they can emit signals, like widgets, and these
    signals can be used not only to allow your program to react to user input on adjustable
    widgets, but also to propagate adjustment values between adjustable widgets.


