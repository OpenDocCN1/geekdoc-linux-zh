    # 22 Writing Your Own Widgets


    # 22.1 Overview


    Although the GTK distribution contains many types of widgets that should cover
    most basic needs, there may come a time when you need to create your own widget
    type. Since GTK uses widget inheritance extensively, and there is already a widget
    that is close to what you want, it is possible to make a useful new widget type
    in just a few lines of code. But before working on a new widget, check around
    first to make sure that someone has not already written it. This will prevent
    duplication of effort and keep the number of GTK widgets out to a minimum, which
    will help keep both the code and the interface of different applications consistent.
    As a flat side to this, when you finish your widget, announce it to the world
    so other people can benefit. The best place to do this is probably the gtk-list.


    Complete sources for the examples are available at the place you got this tutorial,
    or from:

    ://www.gtk.org/~ataylor/gtk/tutorial/


    # 22.2 The Anomaly Of A Widget


    In order to create a new widget, it is important to have an understanding of how
    GTK objects work. This section is just as a brief overview. See the reference
    documentation for details.


    GTK widgets are implemented in an object oriented fashion. However, they are implemented
    in C. This greatly improves portability and stability over using C++ compilers;
    however, it does mean that the widget writer has to pay attention to the implementation
    details. The information common to all instances of one class is stored (e.g.,
    to all Button widgets) is stored in the class structure. There is only one copy
    of this which is stored about the class (which act like virtual functions in C).
    To support inheritance, the first field in the class structure must be a copy
    of the parent''s class structure. The declaration of the class structure of GtkButton
    looks like:


    ```

    struct _GtkButtonClass

    nGtkContainerClass parent_class;

    ```'
