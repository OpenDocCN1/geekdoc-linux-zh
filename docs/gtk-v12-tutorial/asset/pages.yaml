    \nToggle buttons are derived from normal buttons and are very similar, except\
    \ they will always be in one of two states, alternated by a click. They may be\
    \ depressed, and when you click again, they will pop back up. Click again, and\
    \ they will pop back down.\n\nToggle buttons are the basis for check buttons and\
    \ radio buttons, as such, many of the calls used for toggle buttons are inherited\
    \ by radio and check buttons. I will point these out when we come to them.\n\n\
    Creating a toggle button:\n\n```\nGtkWidget *gtk_toggle_button_new( void *);\n\
    GtkWidget *gtk_toggle_button_new_with_label(gchar *label);\n```\n\nAs you can\
    \ imagine, these work identically to the normal button widget calls. The first\
    \ creates a button and the second, a button with a label widget packed into it.\n\
    \nTo retrieve the state of the toggle widget, including radio and check buttons,\
    \ we use a GTK macro as shown in our example below. This tests the state of the\
    \ toggle in a callback. The signal emitted it by toggle buttons (the toggle button,\
    \ check button, and radio button widgets), is the \"toggled\" signal. To check\
    \ the state of these buttons, set up a signal handler to catch the toggled signal,\
    \ and use the macro to determine its state. The callback will look something like:\n\
    \n```\nvoid toggle_button_callback(GtkWidget *widget, gpointer data)\n{\n    if\
    \ (GTK_TOGGLE_BUTTON(widget)->active)\n    {\n        /* If control reaches here,\
    \ the toggle button is down */\n    } else {\n        /* If control reaches here,\
    \ the toggle button is up */\n    }\n}\n```\n\n```\nvoid gtk_toggle_button_set_active(GtkToggleButton\
    \ *toggle_button, gboolean state);\n```\n\nThe above call can be used to set the\
    \ state of the toggle button, and its children the radio and check buttons. Passing\
    \ in your created button as the first argument, and a TRUE or FALSE for the second\
    \ state argument to specify whether it is down (depressed) or up (released). Default\
    \ is up, or FALSE.\n\nNote that you use the gtk_toggle_button_set_active() function,\
    \ and the state is actually changed, it causes the \"clicked\" signal to be emitted\
    \ from the button.\n\n```\nvoid gtk_toggle_button_toggled(GtkToggleButton *toggle_button);\n\
    ```\n\nThis simply toggles the button, and emits the \"toggled\" signal."
