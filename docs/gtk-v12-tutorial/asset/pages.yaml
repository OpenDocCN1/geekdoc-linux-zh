  md: '# 18. Advanced Event and Signal Handling


    # 18.1.3 Emitting and Stopping Signals


    # 18.2 Signal Emission and Propagation


    Signal emission is the process whereby GTK runs all handlers for a specific object
    and signal.


    First, note that the return value from a signal emission is the return value of
    the last handler executed. Since signal events are all of type GTK_RUN_LAST, which
    will be the default (GTK supplied) default handler, unless you connect with gtk_signal_connect_later().


    The way an event (GTK_BUTTON_PRESS) is handled:


    +   * Start with the widget where the event occurred.

    * Emit the generic "event" signal. If that signal handler returns a value of TRUE,
    stop all processing.

    * Otherwise, emit a specific, "button.press_event" signal. If that returns TRUE,
    stop all processing.

    * Otherwise, go to the widget''s parent, and repeat the above steps.

    * Continue until some signal handler returns TRUE, or until the top-level widget
    is reached.


