  md: '# 11. CList Widget


    # 11.2 Modes of operation


    There are several attributes that can be used to alter the behaviour of the GtkList.
    First there is


    ```

    void gtk_clist_set_selection_mode( GtkClist *clist, GtkSelectionMode mode );

    ```


    which, as the name implies, the selection mode of the GtkClist widget, and the
    second specifies the cell selection mode (which are defined in gtkenims.h). At
    the time of writing, the following modes are available to us:


    +   - GTK_SELECTION_SINGLE - The selection is NULL or contains a GList pointer
    for a single item.


    +   - GTK_SELECTION_BROWSE - The selection is NULL if the list contains no widgets
    or invisibles ones only, otherwise it contains a GList pointer for one GList structure,
    and therefore exactly one list item.


    +   - GTK_SELECTION_MULTIPLE - The selection is NULL if no list items are selected
    or a GList pointer for the first item. In turn points to a GList structure for
    the second selected item and so on. This is currently the default for the GtkClist
    widget.


    +   - GTK_SELECTION_EXTENDED - The selection is ALWAYS NULL.


    Others might be added in later versions of GTK.

    We can also define the border of the GtkClist widget should look like. It is through


    ```

    void gtk_clist_set_shadow_type( GtkClist *clist, GtkShadowType border );

    ```


    And the possible values for the second argument are


    +   - GTK_SHADOW_NONE


    +   - GTK_SHADOW_IN


    +   - GTK_SHADOW_ETCHED_IN


    +   - GTK_SHADOW_ETCHED_OUT


    # 11.3 Working with titles


    When you use a GtkClist widget, you will also get a set of title buttons automatically.
    They live in the top of the GtkClist, and can act as normal buttons that respond
    to being pressed, or they can be passive, in which case they are nothing more
    than a title. There are four calls that that aid us in setting the status of the
    title buttons.


    ```

    void gtk_clist_set_column_active( GtkClist *clist, int column );

    ```


    ```

    void gtk_clist_set_column_passive( GtkClist *clist, int column );

    ```


    ```

    void gtk_clist_set_column_titles_active( GtkClist *clist );

    ```


    ```

    void gtk_clist_set_column_titles_passive( GtkClist *clist );

    ```'
