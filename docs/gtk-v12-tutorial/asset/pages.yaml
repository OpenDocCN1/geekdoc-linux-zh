    \ widget, you'll find there is some flashing the entire widget is erased every\
    \ time the pointer is moved before redrawn. Often, the best way to handle this\
    \ problem is to draw to an offscreen pixmap, copy the final results onto the one\
    \ screen. (The ProgressBar draws itself in this fashion).\n- The user should be\
    \ able to use the up and down arrow keys to increase and decrease the value.\n\
    - It would be nice if the widget had buttons to increase and decrease the value\
