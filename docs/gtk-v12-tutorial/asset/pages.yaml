    There are a few subtle points to have been observed when calling gtk_widget_set_events().
    First, it must be called before the X window for GTK widget is created. In practical
    terms, this means you should call it immediately after creating the widget. The
    second widget must have an associated X window. For efficiency, many widget types
    do not have their own window, but draw in their parent''s window. These widgets
    are:


    +   - Gtkalignment

    - GtkArrow

    GtkBin

    - GtkBox

    GtkImage

    GtkItem

    GtkLabel

    GtkFmap

    GtkScrolledWindow

    GtkSeparator

    GtkTable

    GtkAspectFrame

    GtkFrame

    GtkVBox

    GtkHBox

    GtkSeparator

    GtkSeparator


    To capture events for these widgets, you need to use an EventBox widget. See the
    section on the 10.1 widget for details.


    For our drawing program, we want to know when the mouse is pressed and when the
    mouse is moved, so we specify GDK_POINTER_MOTION_MASK and GDK_BUTTON_PRESS_MASK.
    We also want to know when to redraw our window, so we specify GDK_EXPOSURE_MASK.
    Although we want to be notified by a Configure event when our window size changes,
    we don''t have to specify the corresponding GDK_STRUCTURE_MASK flag, because it
    is automatically specified for all windows.


    It turns out, however, that there is a problem with just specifying GDK_POINTER_MOTION_MASK.
    This will cause the server to add a new motion event to the event queue every
