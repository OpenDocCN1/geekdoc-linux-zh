    \ *list,\n               GtkWidget *child);\n```\n\nThis signal is invoked when\
    \ a child of the GtkList is about to get deselected. This happens mainly on calls\
    \ to gtk_list_unset_item(item), gtk_list_unset_child(child), button presses and\
    \ sometimes indirectly triggered on some occasions where children get added to\
    \ or removed from the GtkList.\n\n# D.2 Functions\n\n```\nguint gtk_tk_list_get_type(\
    \ void );\n```\n\nReturns the ‘GtkList’ type identifier.\n\n```\nGtkWidget *gtk_list_new(\
    \ void );\n```\n\nCreate a new GtkList object. The new widget is returned as a\
