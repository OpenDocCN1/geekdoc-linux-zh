  md: "# 22. Writing Your Own Widgets\n\n# 22.4.2 Displaying a widget on the screen\n\
    \nThere are several things that are involved in displaying on the screen. After\
    \ the widget is created with a call to WIDGETNAME_new(), several more functions\
    \ are needed:\n\n+   * WIDGETNAME_realize() is responsible for creating an X window\
    \ for the widget if it has one.\n\n+   * WIDGETNAME_map() is invoked after the\
    \ user calls gtk_widget_show(). It is responsible for making sure the widget is\
    \ actually drawn on the screen (mapped). For a container, it must also make calls\
    \ to map() functions of any child widgets.\n\n+   * WIDGETNAME_draw() is called\
    \ for the widget or one of its ancestors. It makes the actual calls to the drawing\
    \ functions to draw the widget on the screen. For container widgets, this function\
    \ must generate expose events for its child widgets which don't have their own\
    \ windows. (If they have their own windows, then X will generate the expose events)\n\
    \n+   * WIDGETNAME_expose() is a handler for expose events for the widget. It\
    \ makes the necessary calls to draw the functions to draw the exposed position\
    \ on the screen. For container widgets, this function must generate expose events\
    \ for its child widgets (If they have their own windows, then X will generate\
    \ the expose events)\n\nYou might notice that the last functions are quite similar\
    \ - each is responsible for drawing the widget on the screen. In many types of\
    \ widgets don't really care about the difference between the two. The default\
    \ draw() function in the widget class simply generates a synthetic expose for\
    \ the redraw area. However, some types of widgets can save work by distinguishing\
    \ between the two functions. For instance, if a widget has multiple windows, then\
    \ expose events identify the exposed window, it can redraw only the affected widget,\
    \ which is not possible for calls to draw().\n\nContainer widgets, even they don't\
    \ care about the difference, can't simply use the draw() function because their\
    \ child widgets might care about the difference. However, it would be wasteful\
    \ to duplicate the drawing code between the two functions. The convention is that\
    \ widgets have a function called WIDGETNAME_paint() that does the actual work\
    \ of drawing the widget, that is then called by the draw() and expose() functions.\n\
    \nIn our example approach, the dial widget is not a container widget, but only\
    \ has a single window, we can take the simplest approach and use the default draw()\
    \ function and implement an expose() function.\n\n# 22.4.3 The origins of the\
    \ Dial Widget\n\nJust as all humans are variants of the first amphibian that crawled\
    \ out of the land, Gtk widgets tend to start as variants of some other, previously\
    \ written widget. The Dial widget really began with the source code for the Range\
    \ widget. This was picked as a starting point because it would be nice if our\
    \ dial had the same interface as the Scale widgets which are just specialized\
    \ descendants of the Range widget. So, though the code is presented below in finished\
    \ form, it should not be implied that we were using deus ex machina in this fashion.\
    \ Also, if you aren't familiar with how scale widgets work from the application's\
    \ point of view, it would be a good idea to look them before continuing.\n\n#\
    \ 22.4.4 The Basics\n\nQuite a bit of our widget should look familiar from the\
    \ Tictact widget. First, we have a header file:\n\n```\n/* GTK The GIMP Toolkit\n\
    \ * Copyright (C) 1996-1997 Peter Mattis, Spencer Kimball and Josh MacDonald\n\
    ```"
