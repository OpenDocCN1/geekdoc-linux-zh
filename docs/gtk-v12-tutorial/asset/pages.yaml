  md: "```\nvoid gtk_clist_set_column_width(GtkClist *clist,\n             gint column,\n\
    \             gint width);\n```\n\nNote that the width is given in pixels and\
    \ not letters. The same goes for the height of the cells in\ncolumns, but as the\
    \ default value is the height of the current font this isn't as critical to the\
    \ application.\nStill, it is done through\n\n```\nvoid gtk_clist_set_row_height(GtkClist\
    \ *clist,\n               gint height);\n```\n\nAgain, note that the height is\
    \ given in pixels.\n\nWe also move the list around without user interaction, however,\
    \ it does require that we know what we\nlooking for. or in our case, we need the\
    \ row and column of the item we want to scroll to.\n\n```\nvoid gtk_clist_moveto(GtkClist\
    \ *clist,\n                               gint row,\n                        \
    \       gint column,\n                               gfloat row_align,\n     \
    \                          gfloat col_align);\n```\n\nThe gfloat_align is perfectly\
    \ important to understand. It's a value between 0.0 and 1.0, where 0.0 means\n\
    that we should scroll the list row to the top, while if the value of row_align\
    \ is 1.0, the row\nwill appear at the bottom inside. All other values between\
    \ 0.0 and 1.0 are also valid and place the\nrow between the top and the bottom.\
