  md: "# Scribble, A Simple Example Drawing Program\n\n# 23 Scribble, A Simple Example\
    \ Drawing Program\n\n# 23.1 Overview\n\nIn this section, we will build a simple\
    \ drawing program. In the process, we will examine how to handle mouse events,\
    \ how to draw in a window, and how to do drawing better by using a backing pixmap.\
    \ After creating the simple program, we will extend it by adding support for XInput\
    \ devices, such as drawing tablets. GTK provides support routines which makes\
    \ getting extended information, such as pressure and tilt, from such devices quite\
    \ easy.\n\n# 23.2 Event Handling\n\nWe have already discussed for high-level actions,\
    \ such as a menu item being selected. However, sometimes it is useful to learn\
    \ about lower-level occurrences, such as the window being moved, or a key being\
    \ pressed. There are also GDK signals corresponding to these low-level *events*.\
    \ The handlers for these signals have an extra parameter which is a pointer to\
    \ a structure containing information about the event. For instance, motion events\
    \ are handled by a pointer to a GdkEventMotion structure which looks (in part)\
