    # 17 Timeouts, IO and Idle Functions


    # 17.1 Timeouts


    You may be wondering how you make GTK do useful work when gtk_main. Well, you
    have several options. Using the following functions you can create a timeout function
    that will be called every "interval" milliseconds.


    ```

    gint gtk_timeout_add( guint32 interval,

    GtkFunction function,

    gpointer        data );

    ```


    The first argument is the number of milliseconds between calls to your function.
    The second argument is the function you wish to have called, and the third, the
    data passed to this callback function. The return value is an integer "tag" which
    may be used to stop the timeout by calling:


    ```

    void gtk_timeout_remove( gint tag );

    ```


    You may also stop the timeout by returning FALSE from your callback function.
    Obviously this means if your function continue to be called, it should return
    a non-zero value, i.e. TRUE. The declaration of your callback should look something
    like this:


    ```

    gint timeout_callback( gpointer data );

    ```


    # 17.2 Monitoring IO


    A nifty feature of PDK (the library that underlies GTK), is the ability to check
    for data on a file descriptor for you (returned by (select) or (socket)). This
    is especially useful for networking applications. The function:


    ```

    gint gdk_input_add( gint               source,

    GdkInputCondition condition,

    GdkInputFunction function,

    gpointer        data );

    ```


    The first argument is the file descriptor you wish to have watched, and the second
    specifies what you want GTK to look for. This may be one of:


    +   * GDK_INPUT_READ - Call your function when there is data ready for reading
    on your file descriptor.'
