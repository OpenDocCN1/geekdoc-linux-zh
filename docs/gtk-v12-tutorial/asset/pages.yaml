  md: "# GTK’s rc Files\n\nGTK has its own way of dealing with application defaults,\
    \ by using rc files. These can be used to set the colors of any widget, and can\
    \ also be used to tile pixmaps onto the background of some widgets.\n\n# 21.1\
    \ Functions For rc Files\n\nWhen your application starts, you should include a\
    \ call to:\n\n```\nvoid gtk_rc_parse( char *filename );\n```\n\nPassing in the\
    \ filename of your rc file. This will cause GTK to parse this file, and use the\
    \ style settings for the widget types defined.\n\nIf you wish to have a set of\
    \ widgets that can take on a different style from others, or any other logical\
    \ division of widgets, use a call to:\n\n```\nvoid gtk_widget_set_name( GtkWidget\
    \ *widget, \n gchar *name );\n```\n\nPassing your newly created widget as the\
    \ first argument and the name you wish to give it as the second. This will allow\
    \ you to change the attributes of this widget by name through the rc file.\n\n\
    If we use a call like this:\n\n```\nbutton = gtk_button_new_with_label ( \"Special\
    \ Button\" ); \ngtk_widget_set_name ( button, \"special button\" );\n```\n\nThen\
    \ this button is given the name \"special button\" and may be addressed in the\
    \ rc file as \"special button.GtkButton\". < --- VerifyME!\n\nThe example rc file\
    \ below, sets properties of the main window, and all children of that main window\
    \ inherit the style described by the \"main button\" style. The code used in the\
    \ application is:\n\n```\nwindow = gtk_window_new ( GTK_WINDOW_TOPLEVEL ); \n\
    gtk_widget_set_name ( window, \"main window\" );\n```\n\nAnd then the style is\
    \ defined in the rc file using:\n\n```\nwidget \"main window.GtkButton\" style\
    \ \"main-button\"\n```\n\nWhich sets all GtkButton widgets in the \"main window\"\
    \ to the \"main-buttons\" style as defined in the rc file.\n\nAs you can see,\
    \ this is a fairly powerful and flexible system. Use your imagination as how best\
    \ to take advantage of this.\n\n# 21.2 GTK’s rc File Format\n\nThe format of the\
    \ rc file is illustrated in the example below. This is the testrc file from the\
    \ GTK distribution, but I have added a few comments and hints. You may wish to\
    \ include this explanation in your application to allow the user to tune his application.\n\
    \nThere are several directives to change the attributes of a widget."
  merge: -1
