    GList *g_list_append(GList *list, gpointer data);\n```\n\nIt is important that\
    \ you set the initial GList pointer to NULL. The value returned from the g_list_append\
    \ function must be as the new pointer to the GList.\n\nHere's a typical code segment\
    \ for creating a set of options:"
