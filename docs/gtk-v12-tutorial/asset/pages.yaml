    ```


    Finally, drag and-drop works with GtkTreeItems. You have to make sure that the
    GtkTreeItem you want to make into a drag item or a tree item is not only owned
    by a GtkTree, because that each successive widget has a parent itself, all the
    way back to a toggle or dialog window, when you call gtk_widget_dnd.drag_set()
    or gtk_widget.dnd.drop_set(). Otherwise, strange things will happen.


    # 12.5. Signals


    GtkTree inherits the "select", "deselect", and "toggle" signals from GtkItem.
    In addition, it adds two signals of its own, "expand" and "collapse".


    ```

    void select (GtkTreeItem *item);

    ```


    This signal is emitted when an item is to be selected, or after it has been clicked
    by the user, or when the program calls gtk_tree_item_select(), gtk_tree_item_select(child),
    or gtk_tree_select_child(child).


    ```

    void deselect (GtkTreeItem *item) ;

    ```


    This signal is emitted when an item is to be deselected, after it has been clicked
    by the user, or when the program calls gtk_tree_item_deselect() or gtk_item_deslect(item).
    In the case of GtkTreeItems, it is also emitted by gtk_tree_unselect_child(child),
    and sometimes gtk_tree_select_child(child).'
