  md: '# 12. Tree Widget


    # 12.4.1 Signals


    ```

    void selection_changed( GtkTree *tree );

    ```


    This signal will be emitted when the selection field of a GtkTree has changed.
    This happens when a child of the GtkTree is selected or deselected.


    ```

    void select_child( GtkTree *tree,

    GtkWidget *child );

    ```


    This signal is emitted when a child of the GtkTree is about to be selected. This
    happens on calls to gtk_tree_select_item(), gtk_tree_select_child(), on all button
    presses and calls to gtk_tree_item_toggle() and gtk_item_toggle(). It may sometimes
    be triggered on other occasions where children get added to or removed from the
    GtkTree.


    ```

    void unselect_child( GtkTree *tree,

    GtkWidget *child );

    ```


    This signal is emitted when a child of the GtkTree is about to get deselected.
    As of GTK+1.0.4, this seems to only occur on calls to gtk_tree_unselect_item(),
    gtk_tree_unselect_child(), and perhaps on other occasions, but not when a button
    press selects a child, or on emission of the "toggle" signal by gtk_item_toggle().


