  md: "# 21. GTK's rc Files\n\n+   * fg - Sets the foreground color of a widget.\n\
    * bg - Sets the background color of a widget.\n* bg_pixmap - Sets the background\
    \ of a widget to a tiled pixmap.\n* font - Sets the font to be used with the given\
    \ widget.\n\nIn addition to this, there are several states a widget can be in,\
    \ and you can set different colors, pixmaps and fonts for each state. These states\
    \ are:\n\n+   * NORMAL - The normal state of a widget, without the mouse over\
    \ top of it, and not being pressed etc.\n* PRELIGHT - When the mouse is over top\
    \ of the widget, colors defined using this state will be in effect.\n* ACTIVE\
    \ - When the widget is pressed or clicked it will be active, and the attributes\
    \ assigned to that tag will be in.\n* INSENSITIVE - When a widget is insensitive,\
    \ and cannot be activated, it will take these attributes.\n* SELECTED - When the\
    \ \"fg\" and \"bg\" keys to set the colors of widget, it selects these attributes.\n\
    \nWhen using the <STATE> = { Red, Green, Blue } the format is:\n\n```\nfg<STATE>\
    \ = { Red, Green, Blue }\n```\n\nWhere STATE is one of the above selected (PRELIGHT,\
    \ ACTIVE etc), and the Red, Green and Blue are in the range of 0.0 - 1.0, (1.0,\
    \ 1.0, 1.0) being white. They must be in float form, or they will register 0,\
    \ so a straight \"1\" will not work, it must be \"0\". A straight \"0\" is fine\
    \ because it doesn't matter if it's not recognized. Recognized values are set\
    \ to 0.\nbg_pixmap is similar to the above, except the colors are replaced by\
    \ a filename.\npixmap.path is a list of paths separated by \":\"; These paths\
    \ will be searched for any pixmap you specify.\nThe font directive is simply:\n\
    \n```\nfont = \"<font name\"\n```\n\nWhere the only part is figuring out the font\
    \ string. Using xfontsel or similar utility should help.\nThe \"widget_class\"\
    \ sets the style of a class of widgets. These classes are listed in the widget\
    \ hierarchy.\nThe \"widget\" directive sets a specifically named set of widgets\
    \ to a given style, overriding any style set for the given widget class. This\
    \ allows you to specify the attributes of a widget rather than setting the attributes\
    \ of an entire widget class. I urge to document any of these widgets users may\
    \ customize them.\nWhen the keyword parent is used as an attribute, the widget\
    \ will take on the attributes of its parent in the application.\nWhen defining\
    \ a style, you may assign the attributes of a previously defined style to new\
    \ one.\n\n```\nstyle \"main_button\" = \"button\"\n{\n  font = \"adobe-helvetica-medium-r-normal--*-100-*-*-*-*-*-*\"\
    \n  bg[PRELIGHT] = { 0.75, 0, 0 }\n}\n```"
  merge: -1
