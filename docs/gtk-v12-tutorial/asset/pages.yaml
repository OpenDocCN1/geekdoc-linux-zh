    # 9.4 Progress Bars


    Progress bars are used to show the status of an operation. They are pretty easy
    to use, as you will see with the code below. But first lets start out with the
    calls to create a new progress bar.


    There are two ways to create a progress bar, one simple that takes no arguments,
    and one that takes a GtkAdjustment object as an argument. If the former is, the
    progress bar creates its own adjustment object.


    ```

    GtkWidget *gtk_progress_bar_new(void );

    ```


    ```

    GtkWidget *gtk_progress_bar_new_with_adjustment(GtkAdjustment *adjustment );

    ```


    The second method has the advantage that we can use the adjustment object to specify
    our own range parameters for the progress bar.


    The adjustment of a progress object can be changed dynamically using:


    ```

    void gtk_progress_set_adjustment(GtkProgress *progress,

    GtkAdjustment *adjustment );

    ```


    Now that the progress bar has been created we can use it.


    ```

    void gtk_progress_bar_update(GtkProgressBar *pbar,

    float );

    ```


    The first argument is the progress bar you wish to order, and the second argument
    is the amount ''completed'', meaning the amount progress bar has been filled from
    0-100%. This is passed to the function as a real number ranging from 0 to 1.


    GTK v1.2 added new functionality to the progress bar that enables it to display
    its value in different ways, and to inform the user of its current value and its
    range.


    A progress bar may be set to one of a number of orientations using the function


    ```

    void gtk_progress_bar_set_orientation(GtkProgressBar *pbar,

    GtkProgressBarOrientation orientation );

    ```


    Where the orientation argument may take one of the following values to indicate
    the direction in the progress bar:


    +   - GTK_PROGRESS_LEFT_TO_RIGHT

    - GTK_PROGRESS_RIGHT_TO_LEFT

    - GTK_PROGRESS_BOTTOM_TO_TOP

    - GTK_PROGRESS_TOP_TO_BOTTOM


    When used as a measure of how far a process has progressed, the GtkProgressBar
    can be set to display its value in either a continuous or discrete mode. In continuous
    mode, the progress bar is updated for each value. In discrete mode, the progress
    is updated in a number of discrete blocks. The number of blocks is also configurable.


    The style of a progress bar can be set using the following function:


    ```

    void gtk_progress_bar_set_style(GtkProgressBar *pbar,

    GtkProgressBarStyle style );

    ```'
