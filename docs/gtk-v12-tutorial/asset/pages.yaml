  md: "# 14. Text Widget\n\nThe above code creates a new vertical scrollbar, and attaches\
    \ it to the vertical adjustment of the text widget, it packs it into a box in\
    \ the normal way.\n\nNote, the GtkText widget does not support horizontal scrollbars.\n\
    \nThere are two main ways in which a Text widget can be used: to allow the user\
    \ to edit a body of text, or to allow us to display multiple lines of text to\
    \ the user. In order for us to switch between these modes of operation, the text\
    \ widget has the following function:\n\n```\nvoid gtk_text_set_editable( GtkText\
    \ *text,\n               gint editable );\n```\n\nThe editable argument is a TRUE\
    \ or FALSE value that specifies whether the user is permitted to edit the contents\
    \ of the Text widget. When the widget is editable, it will display a cursor at\
    \ the current insertion point.\n\nYou are not, however, restricted to using the\
    \ text widget in these two modes. You can toggle the editable state of the text\
    \ widget at any time, and can insert text at any time.\n\nThe text widget wraps\
    \ lines of text that are too long to fit onto a single line of the display window.\
    \ Its default behaviour is to break across line breaks. This can be changed using\
    \ the following function:\n\n```\nvoid gtk_text_set_word_wrap( GtkText *text,\n\
    \               gint word_wrap );\n```\n\nUsing this function allows us to specify\
    \ that the text widget should wrap long lines on word boundaries. The word_wrap\
    \ argument is a TRUE or FALSE value.\n\n# 14.2 Text Manipulation\n\nThe current\
    \ insertion point of a Text widget can be using\n\n```\nvoid gtk_text_set_point(\
    \ GtkText *text,\n               gint index );\n```\n\nwhere index is the position\
    \ to set the insertion point.\n\nAnalogous to this function for getting the current\
    \ insertion point:\n\n```\nguint gtk_text_get_point( GtkText *text );\n```\n\n\
    A function that is useful in combination with the two functions is\n\n```\nguint\
    \ gtk_text_get_length( GtkText *text );\n```\n\nreturns the current length of\
    \ the Text widget. The length is the number of characters that are within the\
    \ text block of the widget, including characters as carriage-return, which marks\
    \ the end of lines.\n\nIn order to insert text at the current position of a Text\
    \ widget, the function gtk_text_insert is used, which also allows us to specify\
    \ background and foreground colors and for the font.\n\n```\nvoid gtk_text_insert(\
    \ GtkText *text,\n               GdkFont *font,\n               GdkColor *fore,\n\
    \               GdkColor *back,\n               const char *chars,\n         \
    \      gint length );\n```"
