  md: "# 23. Scribble, a Simple Example Drawing Program\n\n```\n/* Create a new backing\
    \ pixmap of the appropriate size */\nstatic gint\nconfigure_event(GtkWidget *widget,\
    \ GdkEventConfigure *event)\n{\n  if (pixmap)\n    gdk_pixmap_unref(pixmap);\n\
    \npixmap = gdk_pixmap_new(widget->window,\n                           widget->allocation.width,\n\
    \                           widget->allocation.height,\n                     \
    \      -1);\n\n  gdk_draw_rectangle(pixmap,\n                      widget->style->white_gc,\n\
    \                      TRUE,\n                      0,\n                     \
    \ 0,\n                      widget->allocation.width,\n                      widget->allocation.height);\n\
    \n  return TRUE;\n}\n```\n\nThe call to gdk_draw_rectangle clears the pixmap initially\
    \ to white. We'll say more about that in a moment.\n\nOur exposure event handler\
    \ simply copies the relevant portion of the pixmap onto the screen we determine\
    \ the area we need to redraw by using the event->area field of the exposure event:\n\
    \n```\n/* Redraw the scene from the backing pixmap */\nstatic gint\nexpose_event(GtkWidget\
    \ *widget, GdkEventExpose *event)\n{\n  gdk_draw_pixmap(widget->window,\n    \
    \              widget->style->fg_gc,[GTK_WIDGET_STATE(widget)],\n            \
    \      pixmap,\n                  event->area.x, event->area.y,\n            \
    \      event->area.width, event->area.height);\n\n  return FALSE;\n}\n```\n\n\
    We've now how to keep the screen up date with our pixmap, but how do we actually\
    \ draw interesting stuff on our pixmap? There are a large number of calls in GTK's\
    \ GDK library for drawing drawables. A drawable is simply something that can be\
    \ drawn. It can be a window, a pixmap, or a bitmap (a black and white image).\
    \ We've already seen two such cases above, gdk_draw_rectangle() and gdk_draw_pixmap().nnThe\
    \ complete list is:\n\n+   - gdk_draw_line ()\ngdk_draw_rectangle ()\ngdk_draw_arc\
    \ ()\ngdk_draw_polygon ()\ngdk_draw_string ()\ngdk_draw_text ()\ngdk_draw_pixmap\
    \ ()\ngdk_draw_bitmap ()\ngdk_draw_image ()"
