  md: "# 20.2 Doubly Linked Lists\n\nThe following functions are used to create, manage,\
    \ and destroy standard doubly linked lists. Each element in the list contains\
    \ a piece of data, with pointers which link to the previous and next elements\
    \ in the list. The data item is of type \"gpointer\", which means the data can\
    \ be a pointer to your real data or (through casting) a numeric value (but not\
    \ assume that it and pointer have the same size!). These routines internally allocate\
    \ list elements in blocks, which is more efficient than allocating elements individually.\n\
    \nThere is no function to specifically create a list. Instead, simply create a\
    \ variable of type GList* and set its value to NULL; NULL is the empty list.\n\
    \nTo add elements to a list, use the g_list_append(), g_list_prepend(), g_list_insert(),\
    \ or g_list_insert_sorted() routines. In all cases they accept a pointer to the\
    \ beginning of the list, and return the (possibly changed) pointer to the beginning\
    \ of the list. Thus, for all of the operations that add or remove elements, save\
    \ the returned value:\n\n```\nGList *g_list_append( GList *list,\n           \
    \         gpointer data );\n```\n\nThis adds a new element (with value data) onto\
    \ the end of the list.\n\n```\nGList *g_list_prepend( GList *list,\n         \
    \           gpointer data );\n```\n\nThis adds a new element (with value data)\
    \ to the beginning of the list.\n\n```\nGList *g_list_insert( GList *list,\n \
    \                   gpointer data,\n                    gint position );\n```\n\
    \nThis inserts a new element (with value data) into the list at the given position.\
    \ If position is 0, this is just like g_list_prepend(); if position is less than\
    \ 0, this is just like g_list_append().\n\n```\nGList *g_list_remove( GList *list,\n\
    \                    gpointer data );\n```\n\nThis removes the element in the\
    \ list with the value data; if the element isn't there, the list is unchanged.\n\
    \n```\nvoid g_list_free( GList *list );\n```\n\nThis frees all the memory used\
    \ by a GList. If the list elements refer to dynamically-allocated memory, then\
    \ they should be freed.\n\nThere are many other glib functions that support doubly\
    \ linked lists; see the glib documentation for more information. Here are a few\
    \ of the more useful functions' signatures:\n\n```\nGList *g_list_remove_link(\
    \ GList *list,\n                    GList *link );\n```\n\n```\nGList *g_list_reverse(\
    \ GList *list );\n```"
