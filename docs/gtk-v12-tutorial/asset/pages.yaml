  md: "# 10. Container Widgets\n\nGTK_POS_TOP is the default.\nNext we will at how\
    \ to add pages to the notebook. There are three ways to add pages to the Notebook.\n\
    Let's look at the first two together as they are quite similar.\n\n```\nvoid gtk_notebook_append_page(GtkNotebook\
    \ *notebook,\n                               GtkWidget *child,\n             \
    \                  GtkWidget *tab_label);\n\nvoid gtk_notebook_prepend_page(GtkNotebook\
    \ *notebook,\n                               GtkWidget *child,\n             \
    \                  GtkWidget *tab_label);\n```\n\nThese functions add pages to\
    \ the notebook inserting them from the back of the notebook (append), or prepend.\
    \ child is the widget that placed within the notebook page, and tab_label is the\
    \ label for the page being added. The child widget must be created separately,\
    \ and typically a set of options unset one of the other container widgets, such\
    \ as a table.\n\nThe final function for adding a page to the notebook contains\
    \ all the properties of the previous two, but allows you to specify which position\
    \ you want the page to be in the notebook.\n\n```\nvoid gtk_notebook_insert_page(GtkNotebook\
    \ *notebook,\n                               GtkWidget *child,\n             \
    \                  GtkWidget *tab_label,\n                               int position);\n\
    ```\n\nThe parameters are the same as _append and _prepend, except it contains\
    \ an extra parameter, position. This parameter is used to specify which place\
    \ this page will be inserted.\nNow we know how to add a page, let us see how we\
    \ can remove a page from the notebook.\n\n```\nvoid gtk_notebook_remove_page(GtkNotebook\
    \ *notebook,\n                                     int gint,\n               \
    \                      page_num);\n```\n\nThis function takes the page by page_num\
    \ and removes it from the widget pointed to.\nTo find out what the current page\
    \ is in a notebook using the function:\n\n```\ngint gtk_notebook_get_current_page(GtkNotebook\
    \ *notebook);\n```\n\nThese two functions are simple calls to move the notebook\
    \ page forward or backward. Simply provide the respective function call with the\
    \ notebook widget you wish to operate on. Note: When the Notebook is currently\
    \ on the last page, and gtk_notebook_next_page is called, the notebook will wrap\
    \ back to the first page. Likewise, if the Notebook is on the first page, and\
    \ gtk_notebook_prev_page is called, the notebook will wrap to the last page.\n\
    \n```\nvoid gtk_notebook_next_page(GtkNotebook *notebook);\n\nvoid gtk_notebook_prev_page(GtkNotebook\
    \ *notebook);\n```\n\nThis function sets the 'active' page of the notebook to\
    \ be opened page 5 for example, you would use this function. Without using function,\
    \ the notebook defaults to the first page.\n\n```\nvoid gtk_notebook_set_page(GtkNotebook\
    \ *notebook,\n                                     int gint,\n               \
    \                      page_num);\n```"
