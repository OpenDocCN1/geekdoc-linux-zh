  md: "# 20.6 String Handling\n\nglib defines a new type called a GString, which is\
    \ similar to a standard C string but one grows automatically. Its string data\
    \ is null-terminated. What this gives you protection from buffer overflow programming\
    \ errors within your program. This is a very important feature, and hence I recommend\
    \ that you make use of GStrings. GString itself has a simple definition:\n\n```\n\
    struct GString\n{\n    gchar *str; /* Points to the string's current \\0-terminated\
    \ value. */\n    int len; /* Current length */\n};\n```\n\nAs you might think,\
    \ there are a number of operations you can do with a GString.\n\n```\nGString\
    \ *g_string_new(gchar *init);\n```\n\nThis constructs a GString, copying the value\
    \ of init into the GString and returning a pointer to it. NULL may be given as\
    \ the argument for an initially empty GString.\n\n```\nvoid g_string_free(GString\
    \ *string,\n                   gint free_segment);\n```\n\nThis frees the memory\
    \ for the given GString. If free_segment is TRUE, then this also frees its character\
    \ data.\n\n```\nGString *g_string_assign(GString *lval, *lval,\n             \
    \               const gchar *rval);\n```\n\nThis copies the characters from real\
    \ into lval, destroying the previous contents of lval. Note that lval will be\
    \ lengthened as necessary to hold the string's contents, unlike the standard strcpy\
    \ function.\n\nThe rest of these functions should be relatively obvious (the _c\
    \ versions accept a character instead of a string):\n\n```\nGString *g_string_truncate(GString\
    \ *string,\n                              gint len);\n```\n\n```\nGString *g_string_append(GString\
    \ *string,\n                          gchar *val);\n```\n\n```\nGString *g_string_append_c(GString\
    \ *string,\n                              gchar c);\n```\n\n```\nGString *g_string_prepend(GString\
    \ *string,\n                              gchar *val);\n```\n\n```\nGString *g_string_prepend_c(GString\
    \ *string,\n                              gchar c);\n```\n\n```\nvoid g_string_sprintf(GString\
    \ *string,\n                       gchar *fmt);\n```"
