  md: '# D. List Widget


    # D.4 List Item Widget


    The GtkListItem widget is designed to act as a container holding up to one child,
    providing functions for selection/deslection just like the GtkList window requires
    them for its children.


    A GtkListItem has its own window to receive events and has its own background
    color which is usually white.

    As it is directly derived from a Gtkitem it can be treated as by using the GTK_ITEM(ListItem)
    macro, see the GtkListItem widget for more on. Usually a GtkListItem just holds
    a label to identify e.g. a filename within a GtkList - therefore the convenience
    function gtk_list_item_new_with_label() is provided. The same effect can be achieved
    by creating a GtkLabel on its own, setting its alignment to xalign=0 and yalign=0.5

    As one is not forced to add a GtkLabel to a GtkListItem, you could also add a
    GtkVBox or a GtkArrow etc. to the GtkListItem.


    # D.5 Signals


    A GtkListItem does not create new signals on its, but inherits the signals of
    a GtkItem. *Note GtkItem::;

    for more.


    # D.6 Functions


    ```

    guint gtk_list_item_get_type( void );

    ```


    Returns the ''GtkListItem'' type identifier.


    ```

    GtkWidget *gtk_list_item_new( void );

    ```


    Create a new GtkListItem object. The new widget is returned as a pointer to a
    GtkWidget object. NULL is returned on failure.


    ```

    GtkWidget *gtk_list_item_new_with_label( gchar *label );

    ```


    Create a new GtkListItem object, having a single GtkLabel as the sole child. The
    new widget is returned as a pointer to a GtkWidget object. NULL is returned on
    failure.


    ```

    void gtk_list_item_select( GtkListItem *list_item );

    ```


    This function is basically a wrapper around a call to gtk_list_item_select (GTK_ITEM
    (list_item)) which will emit the signal. *Note GtkItem::; for more info.


    ```

    void gtk_list_item_deselect( GtkListItem *list_item );

    ```


    This function is basically a wrapper around a call to gtk_list_item_deselect (GTK_ITEM
    (list_item)) which will emit the signal. *Note GtkItem::; for more info.


    ```

    GtkListItem *GTK_LIST_ITEM( gpointer obj );

    ```


    Cast a generic pointer to ''GtkListItem''. *Note Standard Macros:: for more info.


    ```

    GtkListItemClass *GTK_LIST_ITEM_CLASS( gpointer class );

    ```


    Cast a generic pointer to GtkListItemClass*. *Note Standard Macros:: for more
    info.


    ```

    gint GTK_IS_LIST_ITEM( gpointer obj );

    ```


    Determine if a generic pointer refers to a ''GtkListItem''. *Note Standard Macros::
    for more info.'
