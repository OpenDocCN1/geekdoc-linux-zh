    # 9.12 Color Selection


    The color selection widget is, not surprisingly, a widget for interactive selection
    of colors. This composite widget lets the user select a color by manipulating
    RGB (Red, Green, Blue) and HSV (Hue, Saturation, Value) triples. This is done
    by adjusting single values with sliders or entries, or by picking the desired
    color from a hue-saturation wheel/value bar. Optionally, the opacity of the color
    can also be set.


    The color selection widget emits only one signal, "color-changed", which is emitted
    when the current color in the widget changes, when the user changes it or if it''s
    explicitly through gtk_selection_set_color().


    Lets have a look at what the color selection widget has to offer. The widget comes
    in two flavours:


    ```

    GtkWidget *gtk_color_selection_new( void *);

    ```


    You''ll probably not using this constructor directly. It creates an orphan GtkColorSelection
    widget which you''ll have to parent. The GtkColorSelection inherits from GtkVBox.


    ```

    GtkWidget *gtk_color_selection_dialog_new(const gchar *title);

    ```


    This is the most common color selector. It creates a GtkColorSelectionDialog,
    which inherits from GtkDialog. It consists of a GtkFrame containing a GtkColorSelection,
    a GtkSeparator and a GtkBox with three buttons, "OK", "Cancel" and "Help". You
    can reach these buttons using the "ok_button", "cancelButton", "helpbutton" widgets
    in the GtkSelectionDialog structure, (i.e. GTK_SELECTION_DIALOG(colorselection_dialog))->ok_button).


    ```

    void gtk_color_selection_set_opacity(GtkColorSelection *color, GtkOpacity policy);

    ```


    This function sets the update policy. The default policy is GTK_CONTINUOUS which
    means the current color is updated continuously when the user drags the sliders
    or moves the mouse in the hue-saturation wheel or value bar. If you experience
    performance problems, you may want to set the policy to GTK_UPDATE_DISCONTINUOUS
    or GTK_UPDATE_DELAYED.


    ```

    void gtk_color_selection_set_opacity(GtkColorSelection *color, int opacity);

    ```


    The color selection widget supports adjusting the opacity of a color (also known
    as the alpha channel). This is disabled by default. Calling this function with
    use_opacity set to TRUE enables opacity. Likewise, use_opacity set to FALSE will
    disable opacity.'
