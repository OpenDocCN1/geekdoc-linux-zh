    it would be nice to have a standard way of doing this for all applications. This
    probably belongs at a slightly higher level than GTK, perhaps in the GNOME library.


    Another major omission that we have mentioned is the lack of cursor drawing. Platforms
    other than XFree8 do not allow using such a device as the cursor pointer directly
    by an application. The XInput-HOWTO <http://www.msc.cornell.edu/ataylor/xinput/XInput-HOWTO.html>
    for more information about this. This means that applicants want to support the
    widest audience can draw their own cursor.


    An application that draws its own cursor needs to do two things: determine if
    the current device needs a cursor drawn or not, and determine if the current device
    is in proximity. (If the current device is drawing a tablet, it''s a nice touch
    to make the cursor disappear when the stylus is lifted from the tablet. When the
    device is, it is called "proximity.") The first is done by searching the device
    list, as we did to find out the device name. The second is by selecting "proximity_out"
    events. An example of drawing one own cursor is found in the "testinput" program
    found in the GTK distribution.


    # 24 Tips For Writing GTK Applications


    This section is a summary of wisdom, general style guidelines and hints to creating
    good GTK applications. Currently this section is very short, but hopefully it
    will get longer in future editions of this tutorial.


    Use GNU autoconf and automate! They are your friends :) Automake executes files,
    determines how they depend on each other, and generates a Makefile so the files
    can be compiled in the correct order. Autoconf provides automatic software installation,
    handling a large number of system quirks to increase portability. I am planning
    to make a quick intro on them


    When writing C, use only C comments (beginning with /* and ending with */), and
    don''t use C++-style comments (//). Many compilers understand C++ comments, others
    don''t, and ANSI C standard does not require that C++-style comments be processed
    as comments.


    # 25 Contributing


    This document, like much other great software out there, was created by free volunteers.
    If you are at all knowledgeable about any aspect of GTK that does not have documentation,
    please consider contributing to this document.


    If you decide to contribute, please mail your text to Tony Gale, gale@gtk.org.
    Also, be aware that the entirety of this document is free, and any addition you
    provide must also be free. That is, people may use any portion of your examples
    in their programs, and copies of this document may be distributed at all etc.


    Thank you.'
