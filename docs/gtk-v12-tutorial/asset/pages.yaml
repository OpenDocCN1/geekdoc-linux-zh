    - GTK_SHADOW_OUT,

    - GTK_SHADOW_ETCHED_IN,

    - GTK_SHADOW_ETCHED_OUT


    # 10.9 Scrolled Windows


    Scrolled windows are used to create a scrollable area inside a real window. You
    may insert any type of widget into a scrolled window, and it will be accessible
    regardless of the size by using the scrollbars.


    The following function is used to create a new scrolled window:


    ```

    GtkWidget *gtk_scrolled_window_new( GtkAdjustment *adjustment,

    GtkAdjustment *vadjustment );

    ```


    Where the first argument is the adjustment for the horizontal direction, and the
    second, the adjustment for the vertical direction. These are almost set to NULL.


    ```

    void gtk_scrolled_window_set_policy( GtkScrolledWindow *scrolled_window,

    GtkPolicyType hscroll_policy,

    GtkPolicyType vscroll_policy );

    ```


    This sets the policy to be used with respect to the scrollbars. The first argument
    is the scrolled window you wish to change. The second sets the policy for the
    horizontal scroll, and the third the policy for the vertical scrollbar.


    The policy may be one of GTK_POLICY_AUTOMATIC, or GTK_POLICY_ALWAYS. GTK_POLICY_AUTOMATIC
    will automatically decide whether you need scrollbars, whereas GTK_POLICY_ALWAYS
    will always leave the scrollbars.


    You can then place your object into the scrolled window using the following:


    ```

    void gtk_scrolled_window_add_with_viewport( GtkScrolledWindow *scrolled_window,

    GtkWidget *child );

    ```


    Here is a simple example that packs 100 toggle buttons into a scrolled window.
