    # 1 Introduction


    GTK (GIMP Toolkit) is a library for creating graphical user interfaces. It is
    licensed using the GPL license, so you can develop open software, free software,
    or even commercial non-free software using GTK without having to spend on licenses
    or royalties.

    It''s called the GIMP toolkit because it was originally written for developing
    the General Image Manipulation Program (GIMP), but GTK has been used in a large
    number of software projects, including the GNU Network Object Model Environment
    (GNOME) project. GTK is built on top of PDK (GIMP Drawing Kit) which is basically
    a wrapper around the low-level functions for accessing the underlying window functions
    (Xlib in the case of Windows). The primary authors of GTK are:


    +   * Peter Mathis mattis@xc.berkeley.edu

    * Spencer Kimball spencer@xc.berkeley.edu

    * Josh MacDonald jmacd@xc.berkeley.edu'
