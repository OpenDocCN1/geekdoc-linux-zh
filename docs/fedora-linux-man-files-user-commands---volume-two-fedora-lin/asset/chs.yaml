  \n## SEE ALSO（参见）\n\n`flock`(2)\n\n## AVAILABILITY（可用性）\n\n`flock` 命令是 util-linux\
  \ 软件包的一部分，可从 Linux 内核存档获取。\n\n* *\n\n# FMT\n\n## NAME（名称）\n\nfmt - 简单的最优文本格式化工具\n\
  \n## SYNOPSIS（用法简述）\n\n`fmt` `[-WIDTH]` `[*OPTION]`... `[*FILE]`...\n\n## DESCRIPTION（描述）\n\
  \n重新格式化 `FILE(s)` 中的每个段落，并写入标准输出。选项 `-WIDTH` 是 `--width=*DIGITS` 的缩写。\n\n在无 `FILE`\
  \ 或当 `FILE` 为 `-` 时，读取标准输入。\n\n长选项的强制性参数对于短选项也是强制性的。\n\n`-c`, `--crown-margin`\n\
  \n保留前两行的缩进\n\n`-p`, `--prefix=*STRING`\n\n仅重新格式化以 `STRING` 开头的行，并将前缀重新到重新格式化的行上。\n\
  \n`-s`, `--split-only`\n\n拆分长行，但不重新填充内容。\n\n`-t`, `--tagged-paragraph`\n\n第一行的缩进与第二行不同\n\
  \n`-u`, `--uniform-spacing`\n\n单词之间留一个空格，句末后留两个空格\n\n`-w`, `--width=*WIDTH`\n\n\
  最大行宽（默认为 75 列）\n\n`-g`, `--goal=*WIDTH`\n\n目标宽度（默认为 75）\n\n`--help`\n\n显示帮助并退出\n\
  \n`--version`\n\n输出版本\n\n## AUTHOR（作者）\n\n由 Ross Paterson 编写\n\n## BUGS（缺陷）\n\n\
  向向 <http://gnu.org/bugzilla/> (http://gnu.org/bugzilla/) 报告缺陷；...\n\n## COPYRIGHT（版权）\n\
  \nCopyright Š 2015-2023 Free Foundation, Inc。这是一项免费软件；根据自由通用许可证发布。您可以在更多信息中查阅许可证（http://gnu.org/licenses/）。\n\
  \n## SEE ALSO（参见）\n\n`fmt`\n\n## AVAILABILITY（可用性）\n\n`fmt` 命令是 GNU Coreutils 的一部分。\n\
  \n## COPYRIGHT（版权）\n\nCopyright Š 2015-2023 Free Foundation, Inc。这是一项免费软件；根据自由通用许可证发布。您可以在更多信息中查阅许可证（http://gnu.org/licenses/）。\n\
  \n* *\n\n# FONT2C\n\n## NAME（名称）\n\nfont2c - 将 PostScript Type 0 字体转换为 C\n\n## SYNOPSIS（用法简述）\n\
  \n**font2c** *font*\n\n## DESCRIPTION（描述）\n\n该脚本调用 `gs`(1) 并传入以下参数：\n\n`-q -dWRITESY`\n\
  \n随后是命令行。\n\n## SEE ALSO（参见）\n\n`gs`(1)\n\n## VERSION（版本）\n\n本文最后修订于 Ghostscript\
  \ 9.16。\n\n## AUTHOR（作者）\n\nArtifex Software, Inc. 是 Ghostscript 的主要维护者。\n\n* *\n\
  \n# FONTTOSNT\n\n## NAME（名称）\n\nfonttosnt - 将位图字体封装为 sfnt (TrueType)\n\n## SYNOPSIS（用法简述）\n\
  \n**fonttosnt** [ *options* ] `-o` *file.ttf* [ **** ] *font*\n\n## DESCRIPTION（描述）\n\
  \n将位图字体或一组位图字体封装为 sfnt (TrueType)。\n\n## OPTIONS（选项）\n\n`-v`\n\n详细模式\n\n`-c`\n\n\
  不裁剪。通常会增加文件大小，但对于终端字体有时可以稍微缩小文件大小。\n\n`-b`\n\n写入字节对齐字形。默认写入未对齐的数据。\n\n`-r`\n\n不重新编码字体。默认尽可能重新编码。\n\
  \n`-g` *n*\n\n设置我们写入的可缩放字体类型。如果 *n* 为 0，则不写入可缩放字体；这是合法的，但会让大多数软件困惑。如果 *n* 为 1，则写入单个可缩放字体（未定义字体），对其他字体仅写入左边距值。如果\
  \ *n* 为 2（默认），则写入所有可缩放字体，这会增加文件大小且不建议这样做。\n\n`-m` *n*\n\n设置我们写入的可缩放指标。如果 *n* 为 0，则不写入可缩放指标，这可能合法也可能非法。如果\
  \ *n* 为 1，则写入单个字体的完整指标，对其他字体仅写入左边距。如果 *n* 为 2，则写入所有字体的缩放指标，这会增加文件大小且不建议这样做。默认值为\
  \ 1。\n\n`--`\n\n选项结束。\n\n## BUGS（缺陷）\n\n某些字体级值，特别是上下标标位置，是虚拟值。\n\n## SEE ALSO（参见）\n\
  \nX(7), Xserver(1), Xft(3x). *X11 中的字体.*\n\n## AUTHOR（作者）\n\n包含在此 X.Org Foundation\
  \ 发布中的 **Fontftsnt** 版本最初由 Juliusz Chroboczek <jch@freedesktop.org> 为 XFree86 项目编写。\n\
  \n* *\n\n\n\n\n`foomatic-cleanupdrivers` 命令会删除所有命令行为空的驱动 XML 文件。\n\n该命令不 intended\
  \ 供用户直接调用。\n\n# FOOMATIC-COMBO-XML\n\n## 名称\n`foomatic-combo-xml` - <在此处输入简短描述>\n\
  \n## 概要\n`foomatic-combo-xml` `[OPTION]`...\n\n## 描述\n这是由用 C 语言编写的 Foomatic 加速引擎，它可以计算打印机/驱动组合\
  \ XML 文件以及打印机概览 XML 文件。\n\n## 退出状态\n`foomatic-combo-xml` 返回 ???\n\n## 作者\nManfred\
  \ Wassmann `<manolo@NCC-1701.B.Shuttle.de>` 为 foomatic 项目，使用了关联二进制文件的输出。\n\n## 缺陷\n\
  此帮助页面需要编辑。\n\n请在以下地址发布错误报告：\n\nhttp://lists.freestandards.org/mailman/listinfo/printing-foomatic\n\
  \n# FOOMATIC-COMPILEDB\n\n## 名称\n`foomatic-compiledb` - 编译 Foomatic 打印机/驱动数据库\n\n\
  ## 概要\n`foomatic-compiledb` `[-t type]` `[-f]` `[-j n]` `[driver ...]`\n\n## 描述\n\
  `foomatic-compiledb` 为所有可能的打印机/驱动组合生成所有 PPD 文件或 Foomatic 组合 XML 文件，或仅为选定的驱动范围生成。除非想要生成一组用于分发的\
  \ Foomatic 数据文件，否则通常不需要。对于配置单台打印机，`foomatic-ppdfile(1)` 尤其是 `foomatic-configure(1)`\
  \ 会自动计算它们所需的内容。\n\n### 选项\n`-t type`\n输出文件类型，ppd 或 xml。\n\n`-f`\n强制：即使目标目录已存在也写入其中。\n\
  \n`-j n`\nn = 运行的工作进程数量\n\n`driver ...`\n仅为这些驱动生成数据文件\n\n## 另参\n`foomatic-ppdfile(1)`,\
  \ `foomatic-configure(1)`\n\n## 退出状态\n除非发生意外情况，否则 `foomatic-compiledb` 返回 0。\n\n\
  ## 作者\nManfred Wassmann `<manolo@NCC-1701.B.Shuttle.de>` 和 Till Kamppeter `<till.kamppeter@gmail.com>`\
  \ 为 foomatic 项目，使用了关联二进制文件的输出。\n\n## 缺陷\n现有文件始终会被保留，而不是覆盖旧文件。因此建议删除目标目录（`rm -rf\
  \ dir`）并在不带 `-f` 选项的情况下调用 `foomatic-compiledb`。\n\n请在以下地址发布错误报告：\n\nhttp://lists.freestandards.org/mailman/listinfo/printing-foomatic\n\
  \n# FOOMATIC-CONFIGURE\n\n## 名称\n`foomatic-configure` - foomatic 打印系统的的主配置程序。\n\n\
  ## 概要\n`foomatic-configure` `[OPTION]`...\n\n`foomatic-configure -n queuename` `[-N\
  \ description]` `[-L location]` `[-c connect]` `[-d driver]` `[-p printer]` `[ppd\
  \ ppdfile]` `[-s spooler]` `[-C [sourcespooler] sourcequeue]` `[-o option1=value1\
  \ -o...]` `[-q]` `foomatic-configure -D -n queuename` `[-s spooler]` `[-q]`\n\n\
  `foomatic-configure -R -n queuename` `[-s spooler]` `[-q]`\n\n`foomatic-configure\
  \ -Q [-s spooler]` `[-n queuename]` `[-r]`\n\n`foomatic-configure -P [-s spooler]`\
  \ `[-n queuename]` `[-d driver]` `[-p printer]` `[--ppd ppdfile]` `[index]`\n\n\
  `foomatic-configure -p printer | -d driver | -p printer -d driver*`\n\n`foomatic-configure\
  \ -O`\n\n`foomatic-configure -h`\n\n`foomatic-configure --help`\n\n## 描述\n`foomatic-configure`\
  \ 是一个用于为每个已知的后台（CUPS, LPRng, LPD, PPR, PDQ, direct）以及 Foomatic 数据库中的每个打印机/驱动组合或每个\
  \ PostScript PPD 文件设置和配置打印队列的程序。由于 RIP 过滤器（光栅图像处理器，从 PostScript 到打印机原生语言的转换）始终使用\
  \ `foomatic-rip(1)`，除了 CUPS 或 PPR 下的 PostScript 打印机的 PPD 文件外，它们将在不使用 RIP 过滤器的情况下使用。它还包含了用户工具的一半\
  \ API：你可以学习并控制关于打印队列静态属性的所有信息。配合兄弟程序 `foomatic-printjob(1)`，你可以执行与打印队列动态状态相关的一切：提交作业、查询、取消、重新排序和重定向。\n\
  \n### 选项\n`-n queuename`\n配置此打印队列\n\n`-N Name/Description`\n使用此可读的名称/描述\n\n`-L Location`\n\
  描述此打印机位置的短语\n\n`-c connection`\n打印机连接至 `/dev/lp`\n\n`-d driver`\n所需驱动的 Foomatic\
  \ 数据库名称\n\n`-p printer`\n打印机的 Foomatic ID\n\n`--ppd ppdfile`\nPPD 文件，例如由 PostScript\
  \ 打印机制造商提供的文件\n\n`-s spooler`\n显式后台类型（cups, lpd, prng, pdq, ppr, direct）\n\n`-o\
  \ option=value`\n将选项的默认 own 值\n\n`-o option`\n默认开启\n\n`-D`\n将此队列设置为默认队列（只需提供 `-n`）\n\
  \n`-R`\n完全移除此队列（只需提供 `-n`）\n\n`-C [sourcespooler] sourcequeue`\n从后台复制源队列（如果未提供后台，则使用当前的）\n\
  \n`-Q`\n查询现有配置（提供 XML）\n\n`-r`\n列出定义的队列（仅限 CUPS）\n\n`-P [index]`\n获取当前配置的 Perl dump（如果未提供\
  \ index，则显示所有）\n\n`-O`\n打印已知打印机/驱动的 XML 概览（这显示打印机的 ID）\n\n`-X`\n打印 `-p printer`\
  \ 或 `-d driver` 的数据\n\n`-q`\n静默运行\n\n### 命令\n无命令，仅选项\n\n## 另参\n`foomatic-printjob(1)`,\
  \ `foomatic-rip(1)`\n\n## 退出状态\n如果没有发生错误，`foomatic-configure` 返回 0。\n\n## 作者\nManfred\
  \ Wassmann `<manolo@NCC-1701.B.Shuttle.de>` 为 foomatic 项目，使用了源文件。\n\n## 缺陷\n`foomatic-configure`\
  \ 目前无法处理 `lprng` 风格的 printcap 文件。由于 `lprng` 使用 BSD 风格的 printcaps，只要不使用 GUI 打印管理器\
  \ `lprngtool`，这并不是太大的问题。这些格式之间的区别在于，BSD 风格要求打印定义中的延续行以冒号结尾，并用反斜杠转义换行符。`pr` 没有这种限制。\n\
  \n在使用 `lprngtool` 生成或编辑的 printcap 文件配合 `foomatic-configure`，需要在每个打印定义的最后一行末尾添加 `:\\\
  `，如下所示：`#comment # primary printer name lp #alternate names |lp2|lp3 |Example of\
  \ a printer :sd=/usr/spool/LPD/lp :rw=/dev/lp:mx#100 :` 必须转换为`#comment # primary\
  \ printer name lp\\ |lp2|lp3\\ |Example of a printer\\ :sd=/usr/spool/LPD/lp:\\\
  \ :rw=/dev/lp:mx#100:`\n\n此帮助页面可能已过期。\n\n# FOOMATIC-PPDFILE\n\n## 名称\n`foomatic-ppdfile`\
  \ - 为指定的打印机/驱动组合生成 PPD 文件\n\n## 概要\n`foomatic-ppdfile [-w] [-d <driver>] -p <printerid>`\n\
  `foomatic-ppdfile [-A] [-P pattern]`\n`foomatic-ppdfile -h`\n\n## 描述\n`foomatic-ppdfile`\
  \ 的第一形式用于为 Foomatic 数据库中任何有效的打印机/驱动组合计算与后台无关 Foomatic PPD 文件，既可用于 `foomatic-rip(1)`\
  \ 打印，也可用于应用程序/客户端访问打印机选项。PPD 文件在标准输出上返回。如果未指定驱动，则使用默认驱动。\n\n`foomatic-ppdfile` 程序的第二形式将搜索打印机数据库并返回所有打印机条目，或名称和/模型信息匹配正则表达式的条目。\n\
  \n最后一种形式打印帮助信息并退出。\n\n### 选项\n`-d drivername`\n\n\n\n\n要使用的（可选）驱动程序名称。如果未提供驱动名称，则使用打印机兼容驱动列表中的默认或第一个驱动。\n\
  \n`-p`\n\n`printer id` 打印机 ID。\n\n`-w`\n\n返回符合 Microsoft Windows 格式限制的 PPD 文件。\n\
  \n`-A`\n\n返回数据库中所有的打印机条目。\n\n`-P`*pattern*\n\n返回数据库中匹配正则表达式的所有打印机条目。\n\n## 参见\n\n\
  `foomatic-rip`(1)\n\n## 退出状态\n\n`foomatic-ppdfile` 成功时返回 0，否则返回 1。\n\n## 作者\n\n\
  Manfred Wassmann `<manolo@NCC-1701.B.Shuttle.de>` 为 foomatic 项目编写，使用了相关二进制文件的输出。\n\
  \n由 Patrick Powell `<papowell at astart.com>` 修改和更新。\n\n## 缺陷\n\n目前为止没有。\n\n请在以下地址发布\
  \ Bug 报告：\n\n`http://lists.freestandards.org/mailman/listinfo/printing-foomatic`\n\
  \n* * *\n\n# FOOMATIC-EXTRACT-TEXT\n\n## 名称\n\n`foomatic-extract-text` - 从 Foomatic\
  \ UI 字符串生成 `.po` 文件\n\n## 概要\n\n`foomatic-extract-text`\n\n## 描述\n\n`foomatic-extract-text`\
  \ 命令从当前安装的 Foomatic 数据库中的 UI 字符串生成 `.po` 文件。\n\n它不供用户直接调用。\n\n* * *\n\n# FOOMATIC-FIX-XML\n\
  \n## 名称\n\n`foomatic-fix-xml` - 删除 Foomatic 数据库开头的空行\n\n## 概要\n\n`foomatic-fix-xml`\
  \ `[DBDIR]`\n\n## 描述\n\n如果你针对 `libxml` 1.x 编译了 `foomatic-perl-data`，并且拥有带有开头空行的旧数据库条目，请使用\
  \ `foomatic-fix-xml` 命令。\n\n* * *\n\n# FOOMATIC-NONUMERICALIDS\n\n## 名称\n\n`foomatic-nonumericalids`\
  \ - 将数字型打印机 ID 转换为文本 ID\n\n## 概要\n\n`foomatic-nonumericalids`\n\n## 描述\n\n此脚本将已安装的\
  \ Foomatic 数据库中所有旧的加密数字打印机 ID 转换为明文打印机 ID。\n\n你可能不需要执行此操作。\n\n* * *\n\n# FOOMATIC-PERL-DATA\n\
  \n## 名称\n\n`foomatic-perl-data` - 从 XML 生成 Perl 数据结构\n\n## 概要\n\n`foomatic-perl-data`\
  \ `[-O]` `[-C]` `[-P]` `[-D]` `[-o option=setting]` `[-o ...]` `[-v]` `[filename]`\n\
  \n字体 选项\n\n`-O` 解析概述 XML 数据\n\n`-C` 解析打印机/驱动组合 XML 数据（默认）\n\n`-P` 解析打印机条目 XML 数据\n\
  \n`-D` 解析驱动条目 XML 数据\n\n`-o``option=setting 生成的 Perl 数据的默认选项设置（仅限组合）\n\n`-v` 详细（调试）模式\n\
  \n`filename` 从文件而非标准输入读取输入\n\n## 退出状态\n\n`foomatic-perl-data` 返回 ...\n\n## 作者\n\n\
  Manfred Wassmann `<manolo@NCC-1701.B.Shuttle.de>` 为 foomatic 项目编写，使用了相关二进制文件的输出。\n\
  \n## 缺陷\n\n此帮助手册页需要编辑。\n\n* * *\n\n# FOOMATIC-PPD-OPTIONS\n\n## 名称\n\n`foomatic-ppd-options`\
  \ - 显示 PPD 选项\n\n## 概要\n\n`foomatic-ppd-options [-d=debuglevel] [ ppdfiles]`\n\n\
  ## 描述\n\n`foomatic-ppd-options` 程序读取指定的 PPD 文件或 `stdin` 并解码 PPD 文件以生成选项列表。这实际上只是其他打印配置工具的文本版本。\n\
  \n输出格式由一组行组成，每行都以一个关键字开头，后跟一组选项和默认值。例如：\n\n`makemodel = Tektronix Phaser 350 Foomatic/Postscript\
  \ (recommended) name=PageSize; default=Letter; options=Letter (US Letter), \\ A4\
  \ (A4), 11x17 (11x17), A3 (A3), A5 (A5), B5 (B5 \\(JIS\\)),... name=PageRegion;\
  \ default=Letter; options=Letter (US Letter), A4 (A4), ...`\n\n每个选项都以 `name` 标签开头，后跟一个默认值（如果有），然后是选项选项和描述它们的注释。注释中的符号符号已转义。\n\
  \n### 选项\n\n`-d``debuglevel`\n\n设置调试级别。0 禁用调试消息。\n\n`[ files ]`\n\n用于读取选项的 PPD 文件列表。`-`\
  \ 导致读取 `STDIN`。\n\n## 退出状态\n\n`foomatic-ppd-options` 成功后以 0 退出，错误时返回非零。错误消息也会打印在标准错误\
  \ (`STDERR`) 上。\n\n## 作者\n\nPatrick Powell `<papowell at astart.com>`\n\n## 缺陷\n\
  \n可能有。但已经过测试。\n\n* * *\n\n# FOOMATIC-PPD-TO-XML\n\n## 名称\n\n`foomatic-ppd-to-xml`\
  \ - 从 PPD 生成 Foomatic 打印机 XML\n\n## 概要\n\n`foomatic-ppd-to-xml` `[OPTIONS]` `DRIVER:]PPD*`\n\
  \n`foomatic-ppd-to-xml -h`\n\n## 描述\n\n`foomatic-ppd-to-xml` 的第一形式从 PPD 创建 Foomatic\
  \ 打印机 XML。\n\n如果指定了 `DRIVER`，则使用该 `PPD`。如果没有提供，则使用第一个驱动。\n\n`foomatic-ppd-to-xml`\
  \ 的第二形式打印帮助信息。\n\n### 选项\n\n`-d`*DRIVERS* 驱动程序的逗号分隔列表。\n\n`-r`*DRIVER* 推荐的驱动。\n\n\
  `-p`*PDLS* 打印机支持的页面语言 (PDLs) 逗号分隔列表。\n\n`-l` 为 XML 文件添加链接。\n\n`-b`*DIRECTORY* PPD\
  \ 的基础目录。\n\n`-c`*COMMENT* 将注释添加到 XML 文件的注释字段。\n\n`-C` 抑制默认注释（纸宽、每分钟页）。\n\n`-f`*DIRECTORY*\
  \ 写入 XML 文件的目录。文件名将为带有 `.xml` 扩展名的打印机 ID。\n\n`-n` 不修改现有 XML 文件，仅为没有 XML 文件的打印机创建文件。\n\
  \n`-x` 无论是否存在 XML 文件都创建 XML 文件。如果你有不在 foomatic 数据库中的打印机的 PPD 文件，这将极大加快进程。\n\n##\
  \ 退出状态\n\n`foomatic-ppd-to-xml` 成功时返回 0，否则返回 1。\n\n## 缺陷 \n\n目前为止没有。\n\n请在以下地址发布\
  \ Bug 报告：\n\n`http://lists.freestandards.org/mailman/listinfo/printing-foomatic`\n\
  \n* * *\n\n# FOOMATIC-PPDFILE\n\n## 名称\n\n`foomatic-ppdfile` - 为指定的打印机/驱动组合生成 PPD\
  \ 文件\n\n## 概要\n\n`foomatic-ppdfile [-w] [-d <driver>] -p <printerid>`\n\n`foomatic-ppdfile\
  \ [-A] [-P pattern]`\n\n`foomatic-ppdfile -h`\n\n## 描述\n\n`foomatic-ppdfile` 的第一形式为\
  \ Foomatic 数据库中任何有效的打印机/驱动组合计算独立于打印程序的 Foomatic PPD 文件，用于用于 `foomatic-rip`(1) 打印以及应用程序/客户端访问打印机选项。PPD\
  \ 文件返回到标准输出。如果未指定驱动，则使用默认驱动。\n\n`foomatic-ppdfile` 程序的第二形式搜索打印机数据库并返回所有的打印机条目，或名称和/或模型信息匹配正则表达式的条目。\n\
  \n最后一种形式打印帮助信息并退出。\n\n### 选项\n\n`-d` *drivername*\n\n\n\n\n（可选）要使用的驱动程序名称。如果未提供驱动程序名称，将使用打印机兼容驱动程序列表中的默认或第一个驱动程序。\n\
  \n`-p`\n\nprinter id 打印机 ID。\n\n`-w`\n\n返回符合 Microsoft Windows 格式限制的 PPD 文件。\n\n\
  `-A`\n\n返回数据库中的所有打印机条目。\n\n`-Ppattern`\n\n返回数据库中匹配正则表达式的所有打印机条目。\n\n## 另请\n\n`foomatic-rip(1)`\n\
  \n## 退出状态\n\n`foomatic-ppdfile` 成功时返回 0，否则返回 1。\n\n## 作者\n\nManfred Wassmann `<manolo@NCC-1701.B.Shuttle.de>`\
  \ 为 foomatic 项目编写，使用了关联二进制文件的输出。\n\n由 Patrick Powell `<papowell at astart.com>`\
  \ 修改和更新。\n\n## 缺陷\n\n目前暂无。\n\n请在以下地址发布缺陷报告：\n\nhttp://lists.freestandards.org/mailman/listinfo/printing-foomatic\n\
  \n* * *\n\n# FOOMATIC-PRINTERMAP-TO-GUTENPRINT-XML\n\n## 名称\n\n`foomatic-printermap-to-gutenprint-xml`\
  \ - 更新 Gutenprint 驱动 XML 文件\n\n## 摘要\n\n`foomatic-printermap-to-gutenprint-xml`\n\
  \n## 描述\n\n此命令将 Gutenprint 驱动程序的 XML 文件更新为 Gutenprint 源码树中 `foomatic-printermap`\
  \ 文件的状态。用于更新 OpenPrinting 数据库中 Gutenprint 的驱动 XML 文件。\n\n你极可能不需要此操作。\n\n* * *\n\n\
  # FOOMATIC-PRINTJOB\n\n## 名称\n\n`foomatic-printjob` - 以独立于打印队列的方式管理打印作业\n\n## 摘要\n\
  \n`foomatic-printjob [ -s spooler ] [ -P queuename ] [ -o option1=value1 -o option2\
  \ ... ] [ -i ] [ file1 file2 ... ]`\n\n`foomatic-printjob -Q [ -s spooler ] [ -P\
  \ queuename ] [ -i ] [ -a ] [ user1 user2 ... ]`\n\n`foomatic-printjob -R [ -s spooler\
  \ ] [ -P queuename ] [ -i ] [ - | jobid1 jobid2 ... ]`\n\n`foomatic-printjob -C\
  \ [ -s spooler ] [ -i ] command [ arguments ]`\n\n`foomatic-printjob -S [ -s spooler\
  \ ] [ -i ]`\n\n`foomatic-printjob -h [ -s spooler ] [ -P queuename ] [ -i ]`\n\n\
  ## 描述\n\n`foomatic-printjob` 提供了一个独立于打印队列的接口，用于创建和管理打印作业以及打印队列。注意第一个参数会改变命令的模式，因为它结合了多个\
  \ System V 风格打印命令的功能。\n\n### 选项\n\n`-sspooler`\n\n显式打印队列类型。\n\n`-Pqueuename`\n\n\
  指定的任何命令都应应用于此队列而非默认队列。\n\n`-ooption=value`\n\n将选项设置为值\n\n`-ooption`\n\n设置开关选项\n\n\
  `-#n`\n\n打印 n 份副本\n\n`file1 file2 ...`\n\n要打印的文件，当未给出文件时，将打印标准输入。\n\n`-Q`\n\n查询队列中的作业。如果指定了用户列表，则只查询这些用户的作业。\n\
  \n`-Q-a`\n\n查询所有队列中的作业。如果指定了用户列表，则只查询这些用户的作业。\n\n`-R [ - | jobid1 jobid2 ... ]`\n\
  \n从队列中删除作业。使用 `-` 将删除所有作业。\n\n`-Ccommand [ arguments]`\n\n执行用于队列/作业操作的控制命令。命令是 BSD\
  \ `lpc` 工具的命令。使用控制命令 `help` 获取支持的命令列表。注意：命令的数量随打印队列而异，但在不同打印队列下提供的相同命令功能相同。\n\n\
  `-i`\n\n交互模式：当 `foomatic-printjob` 对某些内容有疑问时会询问你。否则 `foomatic-printjob` 将使用自动检测或报错退出。\n\
  \n`-S`\n\n将选定的打印队列保存为默认\n\n`-h`\n\n显示此消息，或如果指定了队列，则显示可用选项列表\n\n## 另请\n\n`foomatic-configure(1)`\
  \ 以及你的打印队列的文档。\n\n## 作者\n\nManfred Wassmann `<manolo@NCC-1701.B.Shuttle.de>` 和 Chris\
  \ Lawrence `<lawrencc@debian.org>` 为 foomatic 项目编写，使用了关联二进制文件的输出。\n\n## 缺陷\n\n此帮助页仍需编辑。\n\
  \n* * *\n\n# FOOMATIC-REPLACEOLDINTERIDS\n\n## 名称\n\n`foomatic-replaceoldprinterids`\
  \ - 替换对旧打印机 ID 的引用\n\n## 摘要\n\n`foomatic-replaceoldprinterids`\n\n## 描述\n\n替换任意文件中旧数字或废弃打印机\
  \ ID ID。默认情况下，它使用当前 Foomatic 数据库的 `db/oldprinterids` 文件作为翻译表，但你可以使用任意的翻译表。\n\n你极可能不需要此操作。\n\
  \n* * *\n\n# FOOMATIC-RIP\n\n## 名称\n\n`foomatic-rip` - 通用打印过滤器/RIP 包装器\n\n## 摘要\n\
  \n### 通用选项：\n\n`foomatic-rip [-v] [-q]` 模式特定选项\n\n### 无队列打印过滤器：\n\n`foomatic-rip\
  \ [-P printer | --ppd printerfile] [-J jobtitle] [-o option=value] [...] files]`\n\
  \n### CUPS 过滤器：\n\n`foomatic-rip jobid user jobtitle options]`\n\n## 描述\n\n`foomatic-rip`\
  \ 是一个通用打印过滤器，可以作为 CUPS 过滤器或无队列的直接打印使用。它具有以下功能：\n\n它将标准输入或文件的 PostScript 和 PDF 转换为打印机的原生语言。\n\
  \n翻译通过外部渲染器 `gs(1)` 完成。如果不需要翻译（PostScript 打印机），渲染器变为 `cat(1)`。\n\n打印机功能、如何处理选项以及如何构建渲染器命令行由\
  \ PPD 文件描述。PPD 文件通常来自 Foomatic，也可以由 PostScript 制造商提供。`foomatic-rip` 支持 CUPS 和直接打印（无队列），后者通过命令行选项和环境变量选择。\n\
  \n`foomatic-rip` 不仅应用用户通过命令行提供的选项设置，还会搜索整个作业中的嵌入选项设置（仅限 PostScript 作业）。不仅考虑了影响整个作业的设置，还考虑了页头设置，这些设置仅对发现它们的页面有效，因此产生页面特定打印设置的应用程序得到了完全支持。\n\
  \n## 直接、无队列打印\n\n### 选项\n\n`-v`\n\n用于调试的详细模式。**警告**：将在 `/tmp` 中创建一个包含调试信息的文件。这开启了安全漏洞，在生产环境中不应使用。\n\
  \n`-q`\n\n静静模式 - 最少信息输出\n\n`-P printer`\n\n`printer` 是用于此作业的配置打印机。\n\n`--ppd printerfile`\n\
  \n处理此作业时应用 PPD 文件 `printerfile`。\n\n`-o option=value`\n\n此作业的选项设置。\n\n`files`\n\n\
  要打印的文件。\n\n如果命令行没有指定至少一个文件，`foomatic-rip` 将从标准输入打印。如果你的打印机 PPD 文件存储在 `/etc/direct/<printer>.ppd`\
  \ 或 `~/.foomatic/direct/<printer>.ppd`，只需指定 `-P <printer>` 即可使用。\n\n在 PPD 文件中插入：\n\
  \n`FoomaticRIPPostPipe: \"|command\"`\n\n位于 `PPD-Adobe: \"4.3\"` 之后，其中 `command`\
  \ 是你希望重定向输出数据的命令。由于 PPD 文件的限制 `command` 中不允许 `<>` 和 `\"`，请按以下方式替换：\n\n**字符替换****`---------------------`**\n\
  \n通过这种方式你可以直接打印到打印机，使用：\n\n`FoomaticRIPPostPipe: \"| cat > /dev/lp0\"`\n\n或\n\n\
  `FoomaticRIPPostPipe: \"| cat > /dev/usb/lp0\"`\n\n用于本地并行或 USB 打印机。为了让普通用户能够以这种方式打印，将他们加入\
  \ **lp** 组，并确保相应的打印机设备文件 */dev/...* 对 **lp** 组是可写的。\n\n\n\n\n\n对于主机名为 `printer`\
  \ 且在端口 `9100` 上监听的 TCP/Socket/JetDirect 打印机，你需要以下配置：\n\n```\nFoomaticRIPPostPipe:\
  \ \"| /usr/bin/nc -w 1  printer 9100\"\n```\n\n注意 `nc` 命令命令行中的 `-w 1`，它会让 `nc` 在数据传输到打印机后立即退出。\n\
  \n```\nFoomaticRIPPostPipe: \"| rlpr -Plp@printserver\"\n```\n\n将你的作业调度到名为 `printserver`\
  \ 的机器上的 LPD 打印机队列 `lp` 上。\n\n参阅 [直接打印 direct-doc.html](http://www.openprinting.org/direct-doc.html)\n\
  \n# 使用打印程序打印\n\n参阅 OpenPrinting 网站上的文档：http://www.openprinting.org/\n\n# 配置文件\n\n\
  文件 `/etc/foomatic/filter.conf` 会在每次执行 `foomatic-rip` 时被读取。它允许按照如下方式配置 `foomatic-rip`\
  \ 的行为（以 `#` 开头的行是注释，会被忽略）：\n\n`debug: 0|1`\n\n开启 (`1`) 或关闭 (`0`) 调试模式。这等于提供 `--debug`\
  \ 命令行选项。默认设置为 `0`。\n\n`ps_accounting: 0|1`\n\n开启 (`1`) 或关闭 (`0`) 在 PostScript 作业中插入用于页面计数的代码。插入的\
  \ PostScript 代码会让 Ghostscript 在 stderr 上生成计数输出，CUPS 借此可以记录打印的每一页。只有当 CUPS 是打印程序时，才会插入该代码。默认设置为\
  \ `1`。\n\n`echo: [<path>/]<executable>*`\n\n设置支持 `-n` 的 `echo(1)` 可执行文件的路径。\n\n\
  `gspath: [<path>/]<executable>*`\n\n设置 Ghostscript `gs(1)` 可执行文件的路径。当 Ghostscript\
  \ 位于非标准位置或应使用备用 Ghostscript 使用。\n\n`execpath: <path>[:<path>]...`\n\n设置 `foomatic-rip`\
  \ 使用的 `$PATH` 变量。\n\n`cupsfilterpath: <path>[:<path>]...`\n\n设置 `foomatic-rip` 搜索\
  \ CUPS 滤波器的目录（用冒号分隔）。\n\n`preferred_shell: [<path>/]<executable>*`\n\n设置执行 `FoomaticRIPCommandLine`\
  \ 及其相关命令时使用的首选 shell。某些 PPD 文件使用了需要现代 shell（如 `bash`、`zsh` 或 `ksh`）的 shell 构造。\n\
  \n# 文件\n\n`/etc/cups/ppd/<printer>.ppd`\n\n`/etc/direct/<printer>.ppd`\n\n当前定义打印机的\
  \ PPD 文件\n\n`/etc/foomatic/filter.conf`\n\n`foomatic-rip` 的配置文件\n\n## 退出状态\n\n除非发生意外，否则\
  \ `foomatic-rip` 返回 0。\n\n## 作者\n\nTill Kamppeter `<till.kamppeter@gmail.com>`，参考了\
  \ Manfred Wassmanns `<manolo@NCC-1701.B.Shuttle.de>` 关于 Foomatic 2.0.x 过滤器的 man\
  \ 页面。\n\n## 缺陷\n\n目前暂无。\n\n请向 OpenPrinting 缺陷跟踪器发送缺陷报告：\n\nhttp://bugs.linuxfoundation.org/\n\
  \n使用 \"OpenPrinting\" 作为产品，使用 \"cups-filters\" 作为组件。\n\n# FOOMATIC-SEARCHPRINTER\n\
  \n## 名称\n\nfoomatic-searchprinter - 搜索 Foomatic 数据库\n\n## 摘要\n\n`foomatic-searchprinter\
  \ [-mM] [-dFID] SEARCHTERM`\n\n`foomatic-searchprinter -h`\n\n## 描述\n\n此命令显示匹配 `SEARCHTERM`\
  \ 的 Foomatic 数据库项。\n\n### 选项\n\n`-mM`\n\n搜索模式：\n\n`M = 0`\n匹配所有（默认值）\n\n`M = 1`\n\
  仅对制造商不匹配\n\n`M = 2`\n仅对制造商或仅对型号不匹配\n\n`M = 3`\n设备 ID、品牌/型号或 Foomatic ID 的精确匹配，并将设备\
  \ ID 中的页面描述语言匹配到相应的“通用(Generic)”打印机\n\n`M = 4`\n仅精确匹配设备 ID、品牌/型号或 Foomatic ID\n\n\
  `-dD`\n\n显示结果：\n\n`D = 0`\n所有内容\n\n`D = 1`\n仅显示最佳匹配类（默认值）\n\n`D = 2`\n仅显示最佳匹配\n\n\
  `-h`\n\n显示帮助信息并退出。\n\n## 缺陷\n\n目前暂无。\n\n请在下方发布缺陷报告：\n\nhttp://lists.freestandards.org/mailman/listinfo/printing-foomatic\n\
  \n# fpaste\n\n## 名称\n\nfpaste - fpaste.org 剪贴板的命令行界面\n\n## 摘要\n\n`fpaste [OPTION]...\
  \ [FILE]...` \n\n## 描述\n\n能够方便地将文本粘贴到 http://fpaste.org 的 Fedora Pastebin 通常很有用，这个简单的实用程序就可以此操作并返回生成的\
  \ URL，以便人们可以检查输出。这希望能够帮助那些由于某些原因没有 X 环境、远程工作或任何其他无法通过网络浏览器将内容粘贴到剪贴板的人。\n\n### 选项\n\
  \n`--version`\n\n显示程序版本号并退出\n\n`-h, --help`\n\n显示帮助信息并退出\n\n`-n \"NICKNAME\"`\n\n\
  你的昵称；默认值\n\n`-n \"NICKNAME\"`\n\n你的昵称；默认值\n\n`-d \"PASSWORD\"`\n\n`password=\"PASSWORD\"\
  `\n\n密码；默认值为 \"password\"\n\n`-l \"LANGUAGE\"`\n\n内容的语言；默认值为 \"language\"\n\n`-x\
  \ \"EXPIRES\"`\n\n过期前时间；默认值为 \"expires\"\n\n`-U \"URL\"`\n\nURL；默认值为 \"url\"\n\n\
  `-P \"PRIVATE\"`\n\n私有；默认值为 \"private\"\n\n`-i \"IN\"`\n\n从输入读取；默认值为 \"input\"\n\
  \n`-o \"OUT\"`\n\n保存到输出；默认值为 \"out\"\n\n`--CLIPBOARD`\n\n剪贴板选择；默认值为 \"clipboard\"\
  \n\n`--FULLPATH`\n\n全路径；默认值为 \"fullpath\"\n\n`--ITSELF`\n\n其本身；默认值为 \"itself\"\n\
  \n`--SYSINFO`\n\n系统信息；默认值为 \"sysinfo\"\n\n`--PRINTONLY`\n\n仅打印；默认值为 \"printonly\"\
  \n\n`--CONFIRM`\n\n确认；默认值为 \"confirm\"\n\n### 选项\n\n`fpaste -n NICKNAME`\n\n你的昵称；默认值\n\
  \n`fpaste -n NICKNAME`\n\n你的昵称；默认值\n\n`fpaste -d PASSWORD`\n\n`password=\"PASSWORD\"\
  `\n\n密码；默认值为 \"password\"\n\n`fpaste -l LANGUAGE`\n\n内容的语言；默认值为 \"language\"\n\n\
  `fpaste -x EXPIRES`\n\n过期前时间；默认值为 \"expires\"\n\n`fpaste -U URL`\n\nURL；默认值为 \"\
  url\"\n\n`fpaste -P PRIVATE`\n\n私有；默认值为 \"private\"\n\n`fpaste -i IN`\n\n从输入读取；默认值为\
  \ \"input\"\n\n`fpaste -o OUT`\n\n保存到输出；默认值为 \"out\"\n\n`--CLIPBOARD`\n\n剪贴板选择；默认值为\
  \ \"clipboard\"\n\n`--FULLPATH`\n\n全路径；默认值为 \"fullpath\"\n\n`--ITSELF`\n\n其本身；默认值为\
  \ \"itself\"\n\n`--SYSINFO`\n\n系统信息；默认值为 \"sysinfo\"\n\n`--PRINTONLY`\n\n仅打印；默认值为\
  \ \"printonly\"\n\n`--CONFIRM`\n\n确认；默认值为 \"confirm\"\n\n## 示例\n\n`fpaste -n NICKNAME`\n\
  \n你的昵称；默认值\n\n`fpaste -n \"NICKNAME\"`\n\n你的昵称；默认值\n\n`fpaste -d PASSWORD`\n\n`password=\"\
  PASSWORD\"`\n\n密码；默认值为 \"password\"\n\n## 示例\n\n`fpaste -n NICKNAME`\n\n你的昵称；默认值\n\
  \n`fpaste -n \"NICKNAME\"`\n\n你的昵称；默认值\n\n`fpaste -d PASSWORD`\n\n`password=\"PASSWORD\"\
  `\n\n密码；默认值为 \"password\"\n\n`fpaste -l LANGUAGE`\n\n内容的语言；默认值为 \"language\"\n\n\
  `fpaste -x EXPIRES`\n\n过期前时间；默认值为 \"expires\"\n\n`fpaste -U URL`\n\nURL；默认值为 \"\
  url\"\n\n`fpaste -P PRIVATE`\n\n私有；默认值为 \"private\"\n\n`fpaste -i IN`\n\n从输入读取；默认值为\
  \ \"input\"\n\n`fpaste -o OUT`\n\n保存到输出；默认值为 \"out\"\n\n`--CLIPBOARD`\n\n剪贴板选择；默认值为\
  \ \"clipboard\"\n\n`--FULLPATH`\n\n全路径；默认值为 \"fullpath\"\n\n`--ITSELF`\n\n其本身；默认值为\
  \ \"itself\"\n\n`--SYSINFO`\n\n系统信息；默认值为 \"sysinfo\n\n`--PRINTONLY`\n\n仅打印；默认值为\
  \ \"printonly\"\n\n`--CONFIRM`\n\n确认；默认值为 \"confirm\"\n\n## 示例\n\n`fpaste -n NICKNAME`\n\
  \n你的昵称；默认值\n\n`fpaste -n \"NICKNAME\"`\n\n你的昵称；默认值\n\n`fpaste -d PASSWORD`\n\n`password=\"\
  PASSWORD\"`\n\n密码；默认值为 \"password\"\n\n`fpaste -l LANGUAGE`\n\n内容的语言；默认值为 \"language\"\
  \n\n`fpaste -x EXPIRES`\n\n过期前时间；默认值为 \"expires\"\n\n`fpaste -U URL`\n\nURL；默认值为\
  \ \"url\"\n\n`fpaste -P PRIVATE`\n\n私有；默认值为 \"private\"\n\n`fpaste -i IN`\n\n从输入读取；默认值为\
