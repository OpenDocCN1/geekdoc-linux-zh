  # GIT-PULL\n\n## 名称\ngit-pull - 从另一个仓库或本地分支获取内容并集成\n\n## 概要\n`git pull [options]\
  \ [<repository> [<refspec>...]]`\n\n## 描述\n将远程仓库的更改合并到当前分支。在默认模式下，`git pull` 是 `git\
  \ fetch` 后接 `git merge FETCH_HEAD` 的简写。\n\n更准确地说，`git pull` 带有给定参数运行 `git fetch`\
  \ 并调用 `git merge` 将获取到的分支头合并到当前分支。使用 `--rebase` 时，它会运行 `git rebase` 而不是 `git merge`。\n\
  \n`<repository>` 应该是传递给 (1) 的远程仓库名称。`<refspec>` 可以指定任意远程引用（例如，标签名称），甚至是一组具有相应远程追踪分支的引用（例如，`refs/heads/*:refs/remotes/origin/*`），但通常它是远程仓库中分支的名称。\n\
  \n`<repository>` 和 `<branch>` 的默认值是从 (1) --track 设置的当前分支的“remote”和“merge”配置中读取的。\n\
  \n假设存在以下历史且当前分支为 \"master\":\n```\nA---B---C master on origin / D---E---F---G master\
  \ ^ origin/master in your repository\n```\n\n那么，“git pull”将获取并重放远程 master 分支自分叉本地\
  \ master（即 E）以来的所有更改，直到其当前提交（C）位于 master 之上，并将结果记录在一个新的提交中，同时包含两个父提交的名称以及用户描述更改的日志消息。\n\
  \n```\nA---B---C origin/master / \\ D---E---F---G---H master\n```\n\n详情请参见 (1)，包括如何展示和处理冲突。\n\
  \n在 Git 1.7.0 或更高版本中，若要取消冲突的合并，请使用 `git reset --merge`。**警告**：在旧版本的 Git 中，不建议在有未提交更改的情况下运行\
  \ `git pull`：虽然可行，但它会让你处于一种在发生冲突时可能难以撤销的状态。\n\n如果任何远程更改与本地未提交的更改重叠，合并将自动取消且工作树不受影响。通常最好在拉取之前让任何本地更改处于就绪状态，或者使用\
  \ (1) 将它们存储起来。\n\n### 选项\n\n- `-q, --quiet`\n此选项将传递给底层的 `git-fetch` 以抑制传输期间的报告，传递给底层的\
  \ `git-merge` 以抑制合并期间的输出。\n\n- `-v, --verbose`\n将 `--verbose` 传递给 `git-fetch` 和\
  \ `git-merge`。\n\n- `--[no-]recurse-submodules[=yes|on-demand|no]`\n此选项控制是否也获取所有已填充子模块的新提交（参见\
  \ (1) 和 (5)）。这对于获取合并子模块提交所需的数据可能是必要的，这是 Git 在 1.7.3 中学会的功能。注意，合并的结果不会检子模块检，之后必须调用\
  \ `git submodule update` 以使工作树与合并结果同步。\n\n### 与合并相关的选项\n\n- `--commit, --no-commit`\n\
  执行合并并提交结果。此选项可覆盖 `--no-commit`。\n\n使用 `--no-commit` 执行合并但假装合并失败且不自动提交，以便给用户在提交前检查和进一步调优合并结果的机会。\n\
  \n- `--edit, -e, --no-edit`\n在对成功的机械合并进行提交之前调用编辑器，进一步编辑自动生成的合并消息，以便用户可以解释并证明合并的理由。`--no-edit`\
  \ 选项可接受自动生成的消息（这通常不建议这样做）。\n\n旧脚本可能依赖于“不允许用户编辑合并日志消息”的历史行为。当他们运行 `git merge` 时会看到编辑器被打开。为了方便将此类脚本调整为更新后的行为，可以在它们开头将环境变量\
  \ `GIT_MERGE_AUTOEDIT` 设置为 `no`。\n\n- `--ff`\n当合并解决为快进（fast-forward）时，仅更新分支指针，而不创建合并提交。这是默认行为。\n\
  \n- `--no-ff`\n即使合并解决为快进，也创建一个合并提交。这是合并带注释（且可能已签名的）标签时的默认行为。\n\n- `--ff-only`\n\
  除非当前 `HEAD` 已经是最新的或合并可以解决为快进，否则拒绝合并并以非零状态退出。\n\n- `--log[=<n>], --no-log`\n除了分支名称外，使用最多\
  \ `<n>` 个正在合并的实际提交的单行描述来填充日志消息。另参见 (1)。\n\n使用 `--no-log` 不列出正在合并的实际提交的单行描述。\n\n\
  - `--stat, -n, --no-stat`\n在合并结束时显示差异统计（diffstat）。差异统计也由配置选项 `merge.stat` 控制。\n\n\
  使用 `-n` 或 `--no-stat` 不在合并结束时显示差异统计。\n\n- `--squash, --no-squash`\n产生工作树和索引状态，就像发生过真实的合并一样（除了合并信息外），但实际上不会创建提交、移动\
  \ `HEAD` 或记录 `$GIT_DIR/MERGE_HEAD`（以导致下一次 `git commit` 命令创建一个合并提交）。这允许你在当前分支上创建一个单一提交，其效果等同于合并另一个分支（如果是章鱼合并则为多个）。\n\
  \n使用 `--no-squash` 执行合并并提交结果。此选项可覆盖 `--squash`。\n\n- `-s <strategy>, --strategy=<strategy>`\n\
  使用给定的合并策略；可以多次提供以按它们应该尝试的顺序指定策略。如果没有 `-s` 选项，则使用内置策略列表（合并单个头节点时使用 `git merge-recursive`，否则使用\
  \ `git merge-octopus`）。\n\n- `-X <option>, --strategy-option=<option>`\n将特定合并策略的选项传递给合并策略。\n\
  \n- `--verify-signatures, --no-verify-signatures`\n验证正在合并的提交具有良好且受信任的 GPG 签名，否则则中止合并。\n\
  \n- `--summary, --no-summary`\n`--stat` 和 `--no-stat` 的同义词；这些已弃用并将在未来移除。\n\n- `-r,\
  \ --rebase[=false|true|preserve]`\n设置为 `true` 时，获取后将当前分支重基到上游分支。如果存在对应上游分支的远程追踪分支，且上游分支自上次获取以来已重基，则利用该信息避免重基本地更改。\n\
  \n设置为 `preserve` 时，使用传递给 `git rebase` 的 `--preserve-merges` 选项进行重基，这样本地创建的合并提交将不会平坦。\n\
  \n设置为 `false` 时，将当前分支合并到上游分支。\n\n如果你想让 `git pull` 始终使用 `--rebase` 而不是合并，请参见 (1)\
  \ 中的 `pull.rebase`、`branch.<name>.rebase` 和 `branch.autoSetupRebase`。\n\n**注意**\n\
  这是一个潜在危险的操作模式。它会重写历史，这对于已经发布的历史来说并不妙妙。除非你已仔细阅读了 (1)。\n\n- `--no-rebase`\n覆盖早前的 `--rebase`。\n\
  \n### 与获取相关的选项\n\n- `--all`\n获取所有远程仓库。\n\n- `-a, --append`\n将获取的引用名称和对象名称追加到 `.git/FETCH_HEAD`\
  \ 的现有内容。如果不使用此选项，`.git/FETCH_HEAD` 中的旧数据将被覆盖。\n\n- `--depth=<depth>`\n对于通过 `git\
  \ clone` 使用 `--depth=<depth>` 选项创建的浅仓库，深化或缩短其历史，从每个远程分支历史末端指定的指定的提交数量。深层提交的标签不会被获取。\n\
  \n- `--unshallow`\n如果源仓库是完整的，将浅仓库转换为完整仓库，移除浅仓库带来的所有限制。\n\n如果源仓库是浅的，则获取尽可能多的内容，使当前仓库与源仓库具有相同的历史。\n\
  \n- `--update-shallow`\n\n\n\n\n默认情况下，从浅层仓库（shallow repository）获取数据时，`git fetch`\
  \ 会拒绝需要更新 `.git/shallow` 的引用。此选项会更新 `.git/shallow` 并接受此类引用。\n\n`-f, --force`\n\n\
  当 `git fetch` 使用 `<rbranch>:<lbranch>` 引用规范时，除非获取的远程分支 `<rbranch>` 是 `<lbranch>`\
  \ 的后代，否则将拒绝更新本地分支 `<lbranch>`。此选项将覆盖该检查。\n\n`-k, --keep`\n\n保留下载的包文件（pack）。\n\n\
  `--no-tags`\n\n默认情况下，指向从远程仓库下载对象的标签会被获取并存储在本地。此选项将禁用这种自动跟踪标签。可以通过 `remote.<name>.tagOpt`\
  \ 设置指定远程的默认行为。见 (1)。\n\n`-u, --update-head-ok`\n\n默认情况下，`git fetch` 拒绝更新对应当前分支的头。此标志将禁用该检查。这完全用于\
  \ `git pull` 与 `git fetch` 通信的内部使用，除非你正在实现自己的 Porcelain 命令（用户界面），否则不应使用它。\n\n`--upload-pack\
  \ <upload-pack>`\n\n当给定该参数且要获取的仓库由 `git fetch-pack` 处理时，会将 `--exec=<upload-pack>`\
  \ 传递给命令，以指定在远程运行命令的非默认路径。\n\n`--progress`\n\n默认情况下，当连接终端时，进度状态会通过标准错误流报告，除非指定了 `-q`。此标志即使在标准错误流未重定向到终端也会强制报告进度状态。\n\
  \n`<repository>`\n\n获取或 pull 操作源的“远程”仓库。该参数可以是 URL（见下文 GIT URLS 节）或远程名称（见下文 REMOTES\
  \ 节）。\n\n`<refspec>`\n\n指定要获取哪些引用以及更新哪些本地引用。当命令行没有出现 `<refspec>` 时，要获取的引用将从 `remote.<repository>.fetch`\
  \ 变量读取（见 (1)）。\n\n`<refspec>` 参数的格式为可选的加号 `+`，跟随源引用 `<src>`，然后是冒号 `:`，最后是目标引用 `<dst>`。当\
  \ `<dst>` 为空时，可以省略冒号。\n\n`tag <tag>` 等同于 `refs/tags/<tag>:refs/tags/<tag>`；它请求获取到指定标签的所有内容。\n\
  \n匹配 `<src>` 的远程引用将被获取，如果 `<dst>`不是空字符串，则匹配它的本地引用将使用 `<src>` 进行快进（fast-forward）。如果使用了可选的加号\
  \ `+`，即使没有导致快进更新，本地引用也会更新。\n\n### Note\n\n如果已知你要获取的远程分支经常被回滚（rewound）和变基（rebased），则预计其新端点不会是其之前端点（即上次获取时存储在你的远程追踪分支中的）的后代。你可能希望使用\
  \ `+` 符号指示此类分支需要非快进更新。目前没有方法确定或声明某个分支在具有此类行为的仓库中可用；执行操作的用户只需知道这是该分支预期的使用模式。\n\n\
  ### Note\n\n在 `git pull` 命令行直接列出多个 `<refspec>` 与在针对 `<repository>` 的配置中拥有多个 `remote.<repository>.fetch`\
  \ 条目并运行不带任何显 `<refspec>` 参数的 `git pull` 命令是有区别的。命令行上显式列出的 `<refspec>` 在获取后始终合并到当前分支。换句话说，如果你列出了多个远程引用，`git\
  \ pull` 将创建一个章鱼合并（Octopus merge）。相反，如果你在命令行上不列出任何显式 `<refspec>` 参数，`git pull` 将获取它在\
  \ `remote.<repository>.fetch` 配置中找到的所有 `<refspec>`，并仅将找到的 `<refspec>` 合并到当前分支。这是因为从远程引用创建章鱼合并很少见，而通过获取多个引用来一次性跟踪多个远程头通常是很有用的。\n\
  \n## GIT URLS\n\n通常情况下，URL 包含有关传输协议、远程服务器地址以及仓库路径的信息。取决于传输协议，这些信息中的某些可能会缺失。\n\n\
  Git 支持 `ssh`、`git`、`http` 和 `https` 协议（此外，`ftp` 和 `ftps` 可用于获取，`rsync` 可用于获取和推送，但这些效率低下且已过时；请勿使用它们）。\n\
  \n原生传输（即 `git://` URL）不进行身份验证，在不安全的网络上应谨慎使用。\n\n以下语法可以使用这些 URL：\n\n```\nhttp[s]://host.xz[:port]/path/to/repo.git/\n\
  ftp[s]://host.xz[:port]/path/to/repo.git/\n```\n\n`ssh` 协议也可以使用另一种类似于 scp 的语法：\n\
  \n```\n[user@]host.xz:path/to/repo.git/\n```\n\n该语法仅在第一个冒号之前没有斜线时才会被识别。这有助于区分包含冒号的本地路径。例如，本地路径\
  \ `foo:bar` 可以被指定为绝对路径或 `./foo:bar` 以避免被误解为 ssh url。\n\n`ssh` 和 `git` 协议还支持 `~username`\
  \ 扩展：\n\n```\n[user@]host.xz:/~[user]/path/to/repo.git/\n```\n\n对于 Git 原生支持的本地仓库，可以使用以下语法：\n\
  \n```\n/path/to/repo.git/\n```\n\n这两种语法大部分情况下等效，但在克隆（cloning）时，前者意味着 `--local` 选项。详情见\
  \ (1)。\n\n当 Git 不知道如何处理某种传输协议时，它会尝试使用 `remote-<transport>` 远程助手（如果存在）。要显式请求远程助手，可以使用以下语法：\n\
  \n```\n<transport>::<address>\n```\n\n其中 `<address>` 可以是路径、服务器和路径，或者是被调用的特定远程助手识别的任意类\
  \ URL 字符串。详情见 (1)。\n\n如果有大量命名相似的远程仓库，且你想为它们使用不同的格式（以便你使用的 URL 被重写为可工作的 URL），你可以创建一个如下的配置节：\n\
  \n```\n[url \"<actual url base>\"] insteadOf = <other url base>\n```\n\n例如，使用以下配置：\n\
  \n```\n[url \"\"] insteadOf = host.xz:/path/to/ insteadOf = work:\n```\n\n像 `\"\
  work:repo.git\"` 或像 `\"host.xz:/path/to/repo.git\"` 的 URL 将在任何接受 `\"\"` 作为 URL 的上下文中被重写。\n\
  \n如果你只想为推送重写 URL，可以创建一个如下的配置节：\n\n```\n[url \"<actual url base>\"] pushInsteadOf\
  \ = <other url base>\n```\n\n例如，使用以下配置：\n\n```\n[url \"\"] pushInsteadOf =\n```\n\
  \n像 `\"\"` 的 URL 在推送时将被重写为 `\" \"`，但拉取（pull）仍将使用原始 URL。\n\n## REMOTES\n\n可以使用以下之一的名称代替\
  \ URL 作为 `<repository>` 参数：\n\n- Git 配置文件中的远程仓库：`$GIT_DIR/config`，\n- `$GIT_DIR/remotes`\
  \ 目录下的文件，或\n- `$GIT_DIR/branches` 目录下的文件。\n\n所有这些项都允许你省略命令行上的 refspec，因为它们每个都包含一个\
  \ git 将默认使用的 refspec。\n\n### 配置文件中的命名远程仓库\n\n你可以选择提供之前通过 (1) 配置的远程名称，甚至通过手动编辑 `$GIT_DIR/config`\
  \ 文件来提供名称。该远程仓库的 URL 将用于访问仓库。当你没有在命令行上提供 refspec 时，将默认使用该远程的 refspec。配置文件中的条目所示：\n\
  \n```\n[remote \"<name>\"] url = <url> pushurl = <pushurl> push = <refspec> fetch\
  \ = <refspec>\n```\n\n`<pushurl>` 仅用于推送。它是可选的，默认为 `<url>`。\n\n### $GIT_DIR/remotes\
  \ 中的命名文件\n\n你可以选择提供 `$GIT_DIR/remotes` 中的一个文件名。该文件中的 URL 将用于访问仓库。当你没有在命令行上提供 refspec\
  \ 时，该文件中的 refspec 将作为默认。该文件应具有以下格式：\n\n```\nURL: one of the above URL format Push:\
  \ <refspec> Pull: <refspec>\n```\n\n\n\n\nPush: 行被 `git push` 使用，Pull: 行被 `git pull`\
  \ 和 `git fetch` 使用。可以指定多个 Push: 和 Pull: 行用于额外的分支映射。\n\n#### `$GIT_DIR/branches`\
  \ 中的具名文件\n\n你可以选择提供 `$GIT_DIR/branches` 中某一个文件的名称。该文件中的 URL 将被用于访问仓库。此文件应具有以下格式：\n\
  \n`<url>#<head>`\n\n`<url>` 是必需的；`#<head>` 是可选。\n\n根据操作类型，如果你没有在命令行中提供 refspec，git\
  \ 将使用以下 refspec 之一。<branch>` 是 `$GIT_DIR/branches` 中该文件的文件名，`<head>` 默认为 `master`。\n\
  \n`git fetch` 使用：\n\n```\nrefs/heads/<head>:refs/heads/<branch>\n```\n\n`git push`\
  \ 使用：\n\n```\nHEAD:refs/heads/<head>\n```\n\n## 合并策略\n\n合并机制（`git merge` 和 `git\
  \ pull` 命令）允许通过 `-s` 选项选择后端**合并策略**。某些策略还可以接受自己的选项，这些选项可以通过向 `git merge` 和/或 `git\
  \ pull` 传递 `-X<option>` 参数来传递。\n\n### resolve\n\n该策略只能使用 3 路合并算法解析两个头（即当前分支和你拉取的的另一个分支）。它会尝试仔细检测交叉合并（criss-cross\
  \ merge）歧义，并被认为是安全且快速的。\n\n### recursive\n\n该策略只能使用 3 路合并算法解析两个头。当存在多个共同祖先可以用于 3\
  \ 路合并时，它会创建一个共同祖先的合并树，并将其作为 3 路合并的引用树。根据对 Linux 2.6 内核开发历史中实际合并提交进行的测试，这种方法报告可以减少合并冲突，且不会引起错误合并。此外，该策略还可以检测并处理涉及重命名的合并。这是拉取或合并一个分支时的默认合并策略。\n\
  \n`recursive` 策略可以接受以下选项：\n\n#### ours\n\n此选项强制通过倾向于 `our`（我们的）版本来自动地解决冲突的代码块。来自另一个树的与我们侧不冲突的更改将反映在合并结果中。对于二进制文件，整个内容取自我们侧。\n\
  \n这不应与 `ours` 合并策略混淆，后者根本不看另一个树包含什么。它会丢弃另一个树所做的一切，声明 `our`（我们的）历史包含了其中发生的所有内容。\n\
  \n#### theirs\n\n这是 `ours` 的相反操作。\n\n#### patience\n\n使用此选项时，`merge-recursive` 会花额外的时间来避免有时因不重要的匹配行（例如来自不同函数的大括号）而导致的错误合并。当要合并的分支分歧很大时请使用此选项。另见\
  \ `(1)--patience`。\n\n#### diff-algorithm=[patience|minimal|histogram|myers]\n\n\
  告诉 `merge-recursive` 使用不同的差异算法，这有助于避免因不重要的匹配行（如不同函数的大括号）而导致的错误合并。另见 `(1)--diff-algorithm`。\n\
  \n#### ignore-space-change, ignore-all-space, ignore-space-at-eol\n\n为了进行 3 路合并，将具有指示类型空白字符更改的行视为未更改。如果空白更改与该行的其他更改混合在一起，则不会被忽略。另见\
  \ `(1)-b`、`-w` 和 `--ignore-space-at-eol`。\n\n如果 `their`（他们的）版本仅对某行引入了空白更改，则使用 `our`（我们的）版本；\n\
  \n如果 `our` 版本引入了空白更改但 `their` 版本包含实质性更改，则使用 `their` 版本；\n\n否则，按通常方式进行合并。\n\n####\
  \ renormalize\n\n在解析 3 路合并时，对文件的所有三个阶段运行虚拟的检出和检入。此选项旨在用于合并具有不同清理过滤器（clean filters）或行尾归一化规则的分支。详情见\
  \ (5) 中的“合并具有不同 checkin/checkout 属性的分支”。\n\n#### no-renormalize\n\n禁用 `renormalize`\
  \ 选项。这将覆盖 `merge.renormalize` 配置变量。\n\n#### rename-threshold=<n>\n\n控制用于重命名检测的相似性阈值。另见\
  \ `(1)-M`。\n\n#### subtree[=<path>]\n\n此选项是 `subtree` 策略的一种更高级的形式，该策略在合并时会猜测两个树必须如何移动以相互匹配。相反，指定的路径会被加上前缀（或从开头删除），以使两棵树的形状相匹配。\n\
  \n#### octopus\n\n该策略解决多于两个头的情况，但拒绝执行需要手动解决的复杂合并。它主要用于将多个主题分支头打包在一起。这是拉取或合并一个以上分支时的默认合并策略。\n\
  \n#### ours\n\n该策略解决任意数量的头，但合并后的树始终是当前分支头，有效地忽略了来自所有其他分支的所有更改。它用于取代侧分支旧开发历史。注意，这与\
  \ `recursive` 合并策略的 `-Xours` 选项不同。\n\n#### subtree\n\n这是修改后的 recursive 策略。在合并树 A\
  \ 和 B 时，如果 B 对应于 A 的子树，则先调整 B 以匹配 A 的树结构，而不是在同一层级读取树。这种调整也会对共同祖先树进行。\n\n对于使用 3 路合并的策略（包括默认的\
  \ `recursive`），如果在两个分支上都进行了更改，但随后在其中一个分支上撤销了，该更改将存在于合并结果中；有些人发现这种行为令人困惑。这是因为只考虑了头和合并基（merge\
  \ base）。\n\n## 默认行为\n\n人们经常在不给出任何参数的情况下使用 `git pull`。传统上，这等同于执行 `git pull origin`。然而，当在分支\
  \ `<name>` 存在配置 `branch.<name>.remote` 时，将使用该值而非 origin。\n\n为了确定使用什么 URL 进行抓取，会查询配置\
  \ `remote.<origin>.url` 的值，如果没有该变量，则使用 `$GIT_DIR/remotes/<origin>` 文件中的 `URL:` 行。\n\
  \n为了确定在命令行上不带任何 refspec 参数运行命令时要抓取哪些远程分支（并可选存储在远程跟踪分支中），会查询配置 `remote.<origin>.fetch`\
  \ 的值，如果没有，则查询 `$GIT_DIR/remotes/<origin>` 文件并使用其 `Pull:` 行。除了 OPTIONS 部分中描述的 refspec\
  \ 格式外，你还可以拥有如下的通配符 refspec（globbing refspec）：\n\n```\nrefs/heads/*:refs/remotes/origin/*\n\
  ```\n\n通配符 refspec 必须有一个非空的 RHS（即必须将抓取的内容存储在远程跟踪分支中），且其 LHS 和 RHS 必须以 `/*` 结尾。上述指定了所有远程分支都使用\
  \ `refs/remotes/origin/` 层级下同名的远程跟踪分支进行跟踪。\n\n确定在抓取后合并哪个远程分支的规则有点复杂，以防破坏向后兼容性。\n\
  \n如果在 `git pull` 命令行上给出了显式 refspec，则它们都将被合并。\n\n当命令行上没有提供 refspec 时，`git pull` 使用配置或\
  \ `$GIT_DIR/remotes/<origin>` 中的 refspec。在这种情况下，适用以下规则：\n\n1. 如果当前分支 `<name>` 存在\
  \ `branch.<name>.merge` 配置，则该配置为远程站点合并的分支。\n2. 如果 refspec 是通配符，则不合并任何内容。\n3. 否则，合并第一个\
  \ refspec 的远程分支。\n\n## 示例\n\n更新你克隆仓库的远程跟踪分支，然后将其中之一合并到你的当前分支：\n\n```\n$ git pull,\
  \ git pull origin\n```\n\n\n\n\n通常合并的分支是远程仓库的 `HEAD`，但具体选择由 `branch.<name>.remote`\
  \ 和 `branch.<name>.merge` 选项决定；详情请参见 (1)。\n\n将下述远程分支合并到当前分支：\n\n```bash\n$ git pull\
  \ origin next\n```\n\n这会将 `next` 的副本临时保存在 `FETCH_HEAD` 中，但不会更新任何远程跟踪分支。使用远程跟踪分支，可以通过调用\
  \ `fetch` 和 `merge` 来实现相同的操作：\n\n```bash\n$ git fetch origin $ git merge origin/next\n\
  ```\n\n如果你尝试的 `pull` 导致了复杂的冲突并想要重新开始，可以使用 `git reset` 进行恢复。\n\n## BUGS\n\n目前，使用\
  \ `--recurse-submodules` 只能在已检出的子模块中获取新提交。例如，当上游在刚刚获取的主项目提交中添加了新的子模块时，子模块本身无法被获取，导致以后在不再次执行\
  \ fetch 的情况下无法检出该子模块。这预计将在未来的 Git 版本中修复。\n\n## 另参见\n\n(1), (1), (1)\n\n***\n\n#\
  \ GIT-PUSH\n\n## 名称\n\n`git-push` - 更新远程引用以及关联对象\n\n## 概要概要\n\n`git push [--all\
  \ | --mirror | --tags] [--follow-tags] [--atomic] [-n | --dry-run] [--receive-pack=<git-receive-pack>]\
  \ [--repo=<repository>] [-f | --force] [--prune] [-v | --verbose] [-u | --set-upstream]\
  \ [--signed] [--force-with-lease[=<refname>[:<expect>]]] [--no-verify] [<repository>\
  \ [<refspec>...]]`\n\n## 描述\n\n使用本地引用更新远程引用，同时发送完成给定引用所需的对象。\n\n通过在仓库中设置钩子（hooks），你可以在每次推送时让仓库发生一些有趣的变化。详情请参见\
  \ (1) 的文档。\n\n当命令行没有通过 `<repository>` 参数指定推送到何处时，将查询当前分支的 `branch.*.remote` 配置来确定推送位置。如果缺少该配置，则默认为\
  \ `origin`。\n\n当命令行没有通过 `<refspec>...` 参数或 `--all`、`--mirror`、`--tags` 选项指定推送内容时，命令将通过查询\
  \ `remote.*.push` 配置查找默认的 `<refspec>`；如果未找到，则遵循 `push.default` 配置来决定推送内容（`push.default`\
  \ 的含义参见 (1)）。\n\n### 选项\n\n`<repository>`\n\n推送操作的目标“远程”仓库。此参数可以是 URL（参见下文 GIT URLS\
  \ 节）或远程名称（参见下文 REMOTES 节）。\n\n`<refspec>...`\n\n指定用什么源对象更新哪个目标引用。`<refspec>` 参数的格式为可选的加号\
  \ `+`，后跟源对象 `<src>`，接着是冒号 `:`，然后目标引用 `<dst>`。\n\n`<src>` 通常是你想要推送的分支名称，但也可以是任意的“SHA-1\
  \ 表达式”，例如 `master~4` 或 `HEAD`（参见 (7)）。\n\n`<dst>` 告诉远程端的哪个引用通过此次推送进行更新。此处不能使用任意表达式，必须指定具体的引用名称。如果在不带任何\
  \ `<refspec>` 参数的情况下执行 `git push [<repository>]`，并设置为通过 `remote.<repository>.push`\
  \ 配置变量来更新目标地处的某个引用，则可以省略 `:<dst>` 部分——此类推送将更新在命令行无 `<refspec>` 的情况下 `<src>` 通常更新的引用。否则，缺少\
  \ `:<dst>` 表示更新与 `<src>` 相同的引用。\n\n由 `<src>` 引的对象用于更新远程端的 `<dst>` 引用。默认情况下，只有当 `<dst>`\
  \ 不是标签（注释标签或轻量级标签）且可以对 `<dst>` 进行快进（fast-forward）时才允许这样做。通过添加可选的前缀 `+`，你可以告诉 Git\
  \ 即使在默认不允许的情况下（例如它不是快进）也更新 `<dst>` 引用。这**不会**尝试将 `<src>` 合并到 `<dst>`。详情参见下文示例。\n\
  \n`tag <tag>` 等同于 `refs/tags/<tag>:refs/tags/<tag>`。\n\n推送一个空 `<src>` 允许你从远程仓库中删除\
  \ `<dst>` 引用。\n\n特殊的 refspec `:`（或允许非快进更新的 `+:`）引导 Git 推送“匹配”分支：对于本地存在的每个分支，如果远程端已存在同名分支，则更新远程端。\n\
  \n`--all`\n\n推送所有分支（即 `refs/heads/` 下的引用）；不能与其他 `<refspec>` 一起使用。\n\n`--prune`\n\
  \n删除没有本地对应项远程分支。例如，如果本地不再存在同名的分支，则远程分支 `tmp` 将被删除。这也尊重 refspecs，例如 `git push --prune\
  \ remote refs/heads/*:refs/tmp/*` 将确保如果 `refs/heads/foo` 不存在，远程的 `refs/tmp/foo`\
  \ 将被删除。\n\n`--mirror`\n\n不是为要推送的引用命名，而是指定 `refs/` 下的所有引用（包括但不限于 `refs/heads/`、`refs/remotes/`\
  \ 和 `refs/tags/`）镜像到远程仓库。新创建的本地引用将被送到远程，本地更新的引用将在远程端强制更新，删除的引用将从远程端移除。如果设置了配置选项\
  \ `remote.<remote>.mirror`，则默认如此。\n\n`-n, --dry-run`\n\n执行除实际发送更新以外的所有操作。\n\n`--porcelain`\n\
  \n产生机器可读的输出。每个引用的状态行将用制表符分隔并发送 stdout 而不是 stderr。将给出引用的完整符号名称。\n\n`--delete`\n\n\
  所有列出的引用都从远程仓库删除。这等同于在所有引用前加冒号。\n\n`--tags`\n\n除了命令行显式列出的 refspecs 之外，`refs/tags`\
  \ 下的所有引用都会被推送。\n\n`--follow-tags`\n\n推送所有在没有此选项时会被推送的引用，并且推送 `refs/tags` 中远程端缺失、但指向从被推送的引用可达的提交对象（commit-ish）的注释标签。这也可以通过配置变量\
  \ `push.followTags` 进行指定。更多信息请参见 (1) 中的 `push.followTags`。\n\n`--signed`\n\n对更新接收端引用的推送请求进行\
  \ GPG 签名，以便通过钩子检查和/或被记录。接收端的详情参见 (1)。\n\n`--[no-]atomic`\n\n如果可用，在远程端使用原子事务。要么所有引用都更新，或者在出错时不更新任何引用。如果服务器不支持原子推送，推送将失败。\n\
  \n`--receive-pack=<git-receive-pack>, --exec=<git-receive-pack>`\n\n远程端 `git-receive-pack`\
  \ 程序的路径。有时在通过 ssh 推送到远程仓库时有用，且你没有在默认 `$PATH` 目录下的该程序。\n\n`--[no-]force-with-lease,\
  \ --force-with-lease=<refname>, --force-with-lease=<refname>:<expect>`\n\n通常，“git\
  \ push”拒绝更新不是用于覆盖它的本地引用祖先的远程引用。\n\n如果远程引用的当前值是预期值，则此选项将覆盖此限制。否则，“git push”失败。\n\n\
  假设你必须 rebase 你已经发布的内容。你将需要绕过“必须快进”规则，以便用 rebase 的的历史替换你最初发布的历史。如果在你 rebase 期间，其他人在你的原始历史基础上构建了内容，远程分支的顶部可能会随着她的提交而推进，盲目使用\
  \ `--force` 推送将丢失她的工作。\n\n此选项允许你声明，你期望正在更新的历史是你 rebase 并想要替换的历史。如果远程引用仍然指向你指定的提交，你可以确定没有其他人对该引用做过任何操作。这就像在不显式锁定的情况下对引用获取了“租约”（lease），只有当“租约”仍然有效时，远程引用才会被更新。\n\
  \n`--force-with-lease` 单独使用时（不指定细节），将通过要求所有将被更新的远程引用的当前值与我们对应的远程跟踪分支相同来保护它们。\n\n\
  \n\n\n\n`--force-with-lease=<refname>` 在不指定预期值的情况下，如果命名的 ref（单独）将要更新，它将要求其当前值与我们拥有的远程跟踪分支一致，从而保护它。\n\
  \n`--force-with-lease=<refname>:<expect>` 如果命名的 ref（单独）将要更新，它将要求其当前值与指定的值 `<expect>`\
  \ 一致（该值允许与我们为该 refname 提供的远程跟踪分支不同，在使用这种形式时我们甚至不需要拥有该远程跟踪分支）。\n\n注意，除了 `--force-with-lease=<refname>:<expect>`\
  \ 之外，所有显式指定 ref 预期当前值的其他形式仍处于实验阶段，随着我们对该功能经验的增加，其语义可能会发生。\n\n`--no-force-with-lease`\
  \ 将取消命令行上之前所有的 `--force-with-lease`。\n\n`-f, --force`\n\n通常，命令会拒绝更新不是覆盖它的本地 ref\
  \ 祖先的远程 ref。此外，当使用 `--force-with-lease` 选项时，命令会拒绝更新当前值与预期不符的远程 ref。\n\n此标志禁用了这些检查，可能会导致远程仓库丢失提交；请谨慎使用。\n\
  \n注意，`--force` 应用于所有推送的 ref，因此将其与设置为 `matching` 的 `push.default` 或与配置了多个 `remote.*.push`\
  \ 推送目标使用可能会覆盖当前分支以外的 ref（包括严格落后于其远程对应的本地 ref）。要强制推送到单个分支，请在推送的 refspec 前使用 `+`（例如，使用\
  \ `git push origin +master` 强制推送 master 分支）。详情见上文的 `<refspec>`... 部分。\n\n`--repo=<repository>`\n\
  \n此选项等同于 `<repository>` 参数。如果两者都指定，则命令行参数具有优先级。\n\n`-u, --set-upstream`\n\n对于每个更新或成功推送的分支，添加上游（跟踪）引用，该引用供不带参数的\
  \ (1) 和其他命令使用。更多信息请参阅 (1) 中的 `branch.<name>.merge`。\n\n`--[no-]thin`\n\n这些选项被传递给\
  \ (1)。当发送者和接收者共享许多相同对象时，薄传输会显著减少发送的数据量。默认是 `--thin`。\n\n`-q, --quiet`\n\n抑制所有输出，包括更新\
  \ ref 的列表，除非发生错误。进度不会报告到标准错误流。\n\n`-v, --verbose`\n\n详细模式运行。\n\n`--progress`\n\n\
  默认情况下，当附加到终端时，进度状态会在标准错误流上报告，除非指定了 `-q`。此标志即使在标准错误流未重定向到终端的情况下强制报告进度状态。\n\n`--recurse-submodules=check|on-demand`\n\
  \n确保推送的版本所使用的所有子模块提交在远程跟踪分支上可用。如果使用 `check`，Git 将验证要推送版本中更改的所有子模块提交在子模块的至少一个远程上可用。如果缺少任何提交，推送将中止并以非零状态退出。如果使用\
  \ `on-demand`，所有要推送版本中更改的子模块都会被推送。如果 `on-demand` 无法推送所有必要的版本，也将中止并以非零状态退出。\n\n`--[no-]verify`\n\
  \n切换预推送钩子（见 (5)）。默认是 `--verify`，为钩子提供了阻止推送的机会。使用 `--no-verify` 则将完全跳过钩子。\n\n## GIT\
  \ URLS\n\n通常，URL 包含有关传输协议、远程服务器地址以及仓库路径的信息。根据传输协议的不同，这些部分信息可能会缺失。\n\nGit 支持 `ssh`、`git`、`http`\
  \ 和 `https` 协议（`ftp` 和 `ftps` 可用于获取，`rsync` 可用于获取和推送，但这些效率低下且已过弃；请勿使用）。\n\n原生传输（即\
  \ `git://` URL）不进行身份验证，在不安全的网络上应谨慎使用。\n\n可以使用以下语法配合它们：\n\n`http[s]://host.xz[:port]/path/to/repo.git/`\n\
  \n`ftp[s]://host.xz[:port]/path/to/repo.git/`\n\n`ssh` 协议还可使用另一种类似 scp 的语法：\n\n\
  `[user@]host.xz:path/to/repo.git/`\n\n只有在第一个冒号之前没有斜杠时，该语法才会被识别。这有助于区分包含冒号的本地路径。例如，本地路径\
  \ `foo:bar` 可以指定为绝对路径或 `./foo:bar`，以避免被误解为 ssh url。\n\n`ssh` 和 `git` 协议额外支持 `~username`\
  \ 扩展：\n\n`[user@]host.xz:/~[user]/path/to/repo.git/`\n\n对于 Git 原生支持的本地仓库，可以使用以下语法：\n\
  \n`/path/to/repo.git/`\n\n这两种语法在大多数情况下是等等的，但在克隆时，前者隐含了 `--local` 选项。详情见 (1)。\n\n\
  当 Git 不知道如何处理某种传输协议时，它会尝试使用 `remote-<transport>` 远程助手（如果存在的话）。要显式请求远程助手，可以使用以下语法：\n\
  \n`<transport>::<address>`\n\n其中 `<address>` 可以是一个路径、服务器和路径，或者是被调用的特定远程助手所识别的任意类\
  \ URL 字符串。详情见 (1)。\n\n如果存在大量命名相似的远程仓库，且你想为它们使用不同的格式（以便你你使用的 URL 将被重写为可以运行的 URL），你可以创建一个如下形式的配置段：\n\
  \n`[url \"<actual url base>\"] insteadOf = <other url base>`\n\n例如，使用以下内容：\n\n`[url\
  \ \"\"] insteadOf = host.xz:/path/to/ insteadOf = work:`\n\n像 \"work:repo.git\"\
  \ 或像 \"host.xz:/path/to/repo.git\" 的 URL 在任何接受 URL 为 \"\" 的上下文中都会被重写。\n\n如果你只想为推送重写\
  \ URL，可以创建一个如下形式的配置段：\n\n`[url \"<actual url base>\"] pushInsteadOf = <other url\
  \ base>`\n\n例如，使用以下内容：\n\n`[url \"\"] pushInsteadOf =`\n\n像 \"\" 这样的 URL 在推送时将被重写为\
  \ \"\"，但拉取将仍然使用原始 URL。\n\n## REMOTES\n\n可以使用以下之一的名称代替 `<repository>` 参数：\n\n- Git\
  \ 配置文件中的远程：`$GIT_DIR/config`,\n- `$GIT_DIR/remotes` 目录下的文件，或\n- `$GIT_DIR/branches`\
  \ 目录下的文件。\n\n这些都允许你在命令行中省略 refspec，因为它们各包含一个 git 将默认使用的 refspec。\n\n### 配置文件中的命名远程\n\
  \n你可以选择提供你之前通过 (1)、(1) 甚至通过手动编辑 `$GIT_DIR/config` 文件配置的远程名称。该远程的 URL 将用于访问仓库。当你不在命令行提供\
  \ refspec 时，该远程的 refspec 将作为默认。配置文件中的条目如下：\n\n`[remote \"<name>\"] url = <url> pushurl\
  \ = <pushurl> push = <refspec> fetch = <refspec>`\n\n`<pushurl>` 用于推送。它是可选的，默认为\
  \ `<url>`。\n\n### $GIT_DIR/remotes 中的命名文件\n\n你可以选择提供 `$GIT_DIR/remotes` 中的文件名。该文件中的\
  \ URL 将用于访问仓库。当你不在命令行提供 refspec 时，该文件中的 refspec 将作为默认。此文件应遵循以下格式：\n\n`URL: 上述 URL\
  \ 格式 Push: <refspec> Pull: <refspec>`\n\n`Push:` 行被 `git push` 使用，`Pull:` 行被 `git\
  \ pull` 和 `git fetch` 使用。可以指定多个 Push: 和 Pull: 行来实现额外的分支映射。\n\n### $GIT_DIR/branches\
  \ 中的命名文件\n\n你可以选择提供 `$GIT_DIR/branches` 中的文件名。该文件中的 URL 将用于访问仓库。此文件应遵循以下格式：\n\n\
  `<url>#<head>`\n\n`<url>` 是必须的；#<head>` 是可选的。\n\n\n\n\n\n取决于操作类型，如果你没有在命令行中提供 refspec，`git`\
  \ 将使用以下 refspecs 之一。`<branch>` 是 `$GIT_DIR/branches` 中该文件名，而 `<head>` 默认为 master。\n\
  \n`git fetch` 使用：\n```\nrefs/heads/<head>:refs/heads/<branch>\n```\n\n`git push`\
  \ 使用：\n```\nHEAD:refs/heads/<head>\n```\n\n# 输出\n\n`\"git push\"` 的输出取决于所使用的传输方法；本节描述了通过\
  \ Git 协议（本地或通过 `ssh`）推送时的输出。\n\n推送的状态以表格形式输出，每行代表单个引用（ref）的状态。每行的格式如下：\n\n```\n\
  <flag> <summary> <from> -> <to> (<reason>)\n```\n\n如果使用了 `--porcelain`，则输出的每行格式为：\n\
  \n```\n<flag> \\t <from>:<to> \\t <summary> (<reason>)\n```\n\n只有在使用 `--porcelain`\
  \ 或 `--verbose` 选项时，才会显示已更新 ref 的状态。\n\n### flag\n一个表示 ref 状态的单个字符：\n- `(space)`：表示成功推送了快进（fast-forward）；\n\
  - `+`：表示强制更新成功；\n- `-`：表示删除 ref 成功；\n- `*`：表示成功推送了新 ref；\n- `!`：表示 ref 被拒绝或推送失败；以及\n\
  - `=`：表示 ref 是最新的，不需要推送。\n\n### summary\n对于推送成功的 ref，summary 以适用于作为 `git log` 参数的形式显示\
  \ ref 的旧值和新值（大多数情况下为 `<old>..<new>`，对于强制非快进更新则为 `<old>...<new>`）。\n\n对于失败的更新，提供了更多细节：\n\
  - **rejected**（被拒绝）：Git 完全没有尝试发送该 ref，通常是因为它不是快进且你没有进行强制更新。\n- **remote rejected**（远程拒绝）：远程端拒绝更新。通常是由远程端的钩子（hook）引起的，或者是因为远程仓库启用了以下安全选项之一：`receive.denyCurrentBranch`（推送到已检出的分支）、`receive.denyNonFastForwards`（针对强制非快进更新）、`receive.denyDeletes`\
  \ 或 `receive.denyDeleteCurrent`。参见 (1)。\n- **remote failure**（远程失败）：远程端没有报告 ref\
  \ 的成功更新，可能是因为远程端的临时错误、网络连接中断或其他瞬态错误。\n\n### from\n正在推送的本地 ref 的名称，去掉了其 `refs/<type>/`\
  \ 前缀。在删除操作的情况下，会省略本地 ref 的名称。\n\n### to\n正在更新的远程 ref 的名称，去掉了其 `refs/<type>/` 前缀。\n\
  \n### reason\n人类可读的解释。对于推送成功的 ref，不需要解释。对于推送失败的 ref，将描述失败的原因。\n\n# 关于快进（FAST-FORWARDS）的说明\n\
  \n当更新更新将一个分支（更广义地说，一个引用）从指向提交 A 更改为指向另一个提交 B 时，当且仅当 B 是 A 的后代时，这种更新被称为快进更新。\n\n\
  在从 A 到 B 的快进更新中，原始提交 A 之上构建的提交集是新提交 B 之上构建的提交集的子集。因此，它不会丢失任何历史。\n\n相比之下，非快进更新将丢失历史。例如，假设你和另一个人从同一个提交\
  \ X 开始，你构建了通往提交 B 的历史，而另一个人构建了通往提交 A 的历史。历史如下：\n\n```\nB / ---X---A\n```\n\n假设另一个人已经将通往\
  \ A 的更改推回了你们获取原始提交 X 的原始仓库。\n\n另一个人执行的推送更新了原本指向提交 X 的分支，使其指向了提交 A。这是一个快进操作。\n\n\
  但如果你尝试推送，你将尝试用提交 B 更新（现在指向 A 的）分支。这*不是*快进。如果你强制执行了这一操作，由提交 A 引入的更改将会丢失，因为现在所有人都将从\
  \ B 开始构建。\n\n默认情况下，该命令不允许进行非快进更新，以防止此类历史丢失。\n\n如果你不想丢失你的工作（从 X 到 B 的历史）或另一个人的工作（从\
  \ X 到 A 的历史），你将先从仓库获取历史，创建一个包含双方修改更改的历史，然后将结果推回。\n\n你可以执行 `git pull`，解决潜在的冲突，并对结果执行\
  \ `git push`。`git pull` 会在提交 A 和 B 之间创建一个合并提交 C。\n\n```\nB---C / / ---X---A\n```\n\
  \n使用生成的合并提交更新 A 将是快进的，你的推送将被接受。\n\n或者，你可以通过 `git pull --rebase` 将你在 X 和 B 之间的更改变基到\
  \ A 之上，并将结果推回。变基将创建一个新的提交 D，它在 A 之上构建了 X 和 B 之间的更改。\n\n```\nB D / / ---X---A\n```\n\
  \n再次，使用此提交更新 A 将是快进的，你的推送将被接受。\n\n当你尝试推送时还会遇到另一种非快进拒绝的常见情况，即使当你推送到一个没有其他人推送的仓库时也是可能的。当你自己推送了提交\
  \ A（见本节第一图），用 `git commit --amend` 产生提交 B，并尝试将其推出去，因为你忘记了已经推送过 A 了。在这种情况下，只有当你确定在此期间没有人获取过你早期的提交\
  \ A（并开始在其基础上构建）时，你才能运行 `git push --force` 来覆盖它。换句话说，`git push --force` 是一个预留给确实想要丢失历史的情况的方法。\n\
  \n## 示例\n\n`git push`\n作用类似于 `git push <remote>`，其中 `<remote>` 是当前分支的远程仓库（如果当前分支没有配置远程仓库，则为\
  \ origin）。\n\n`git push origin`\n在没有额外配置的情况下，如果当前分支与名称相同，则将当前分支推送到配置的上游（`remote.origin.merge`\
  \ 配置变量），否则报错且不推送。\n\n当没有给出 `<refspec>` 时，此命令的默认行为可以通过设置远程的推送选项或 `push.default` 配置变量来配置。\n\
  \n例如，要默认仅推送当前分支到 origin，请使用 `git config remote.origin.push HEAD`。任何有效的 `<refspec>`（如下例所示）都可以配置为\
  \ `git push origin` 的默认值。\n\n`git push origin :`\n向 origin 推送匹配分支。关于匹配分支的描述参见上面的\
  \ OPTIONS `<refspec>`。\n\n`git push origin master`\n在源仓库中找到 master 的引用（最可能会找到 `refs/heads/master`），并更新\
  \ origin 中相同的引用（例如 `refs/heads/master`）。如果远程不存在 master，将创建它。\n\n`git push origin\
  \ HEAD`\n将当前分支推送到远程同名分支的便捷方法。\n\n`git push mothership master:satellite/master dev:satellite/dev`\n\
  使用匹配 master 的源引用（例如 `refs/heads/master`）更新 mothership 仓库中匹配 satellite/master 的引用（可能是\
  \ `refs/remotes/satellite/master`）；对 dev 和 satellite/dev 执行同样的操作。\n\n这是为了通过相反方向运行\
  \ `git push` 来模拟在 mothership 上运行 `git fetch`，以便整合在 satellite 上完成的工作。当你只能单向连接时通常是必要的（即\
  \ satellite 可以 ssh 到 mothership，但 mothership 无法连接 satellite，因为后者在防火墙后或未运行 sshd）。\n\
  \n在 satellite 机器运行此 `git push` 后，你将 ssh 进入 mothership 并在那里运行 `git merge`，以完成在 mothership\
  \ 上模拟拉取 satellite 更改的 `git pull`。\n\n`git push origin HEAD:master`\n将当前分支推送到 origin\
  \ 仓库中匹配 master 的引用。这种形式便于在不考虑本地名称的情况下推送当前分支。\n\n`git push origin master:refs/heads/experimental`\n\
  \n\n\n\n\n通过复制当前的 `master` 分支在源仓库中创建 `experimental` 分支。这种形式仅在本地名称和远程名称不同时，才用于在远程仓库中创建新的分支或标签；否则，直接使用\
  \ ref 名称即可。\n\n```\ngit push origin :experimental\n```\n\n在源仓库中找到与 `experimental`\
  \ 的 ref（例如 `refs/heads/experimental`）并将其删除。\n\n```bash\ngit push origin +dev:master\n\
  ```\n\n使用 `dev` 分支更新源仓库的 `master` 分支，允许非快进更新。**这可能会在源仓库中留下未引用的悬空提交。**请考虑以下情况，此时无法进行快进更新：\n\
  \n```\no---o---o---A---B origin/master \\ X---Y---Z dev\n```\n\n上述命令将源仓库更改为：\n\n\
  ```\nA---B (unnamed branch) / o---o---o---X---Y---Z master\n```\n\n提交 `A` 和 `B`\
  \ 将不再属于任何符号名称的分支，因此将无法访问。因此，这些提交将通过在源仓库上执行 `git gc` 命令被移除。\n\n***\n\n# GIT-QUILTIMPORT\n\
  \n## NAME\n`git-quiltimport` - 将 quilt 补丁集应用到当前分支\n\n## SYNOPSIS\n`git quiltimport`\
  \ `--dry-run | -n] [--author <author>] [--patches <dir>]`\n\n## DESCRIPTION\n将 quilt\
  \ 补丁集应用到当前的 Git 分支，保留该补丁集中存在的补丁边界、补丁顺序和补丁描述。\n\n对于每个补丁，代码尝试从补丁描述中提取作者。如果失败，则回退到使用\
  \ `--author`指定的作者。如果没有给出 `--author` 标志，则会显示补丁描述并要求用户交互式输入补丁的作者。\n\n如果在补丁描述中未找到主题，则补丁名称将作为\
  \ Git 描述中的第 1 行主题。\n\n## OPTIONS\n- `-n, --dry-run`\n遍历序列中的补丁，如果无法找到提交补丁所需的所有信息，则警告。在本文编写时，仅会对缺失的作者信息进行警告。\n\
  \n- `--author Author Name <Author Email>`\n当补丁描述中找不到作者信息时使用的作者姓名和电子邮件地址。\n\n- `--patches\
  \ <dir>`\n查找 quilt 补丁和 quilt 系列文件的目录。补丁目录的默认值为 `patches` 或环境变量 `$QUILT_PATCHES`\
  \ 的值。\n\n***\n\n# GIT-READ-TREE\n\n## NAME\n`git-read-tree` - 将树信息读入索引\n\n## SYNOPSIS\n\
  `git read-tree` `[[-m [--trivial] [--aggressive] | --reset | --prefix=<prefix>]\
  \ [-u [--exclude-per-directory=<gitignore>] | -i]] [--index-output=<file>] [--no-sparse-checkout]\
  \ (--empty | <tree-ish1> [<tree-ish2> [<tree-ish3>]])]]`\n\n## DESCRIPTION\n将由`<tree-ish>`提供的树信息读入索引，但实际上不会**更新**它“缓存”的任何文件。(见：(1))\n\
  \n可选地，可以使用 `-m` 标志将树合并到索引中，执行快进（即二路）合并或三路合并。当与 `-m` 使用时，`-u` 标志会导致它同时根据合并结果更新工作区中的文件。\n\
  \n简单易合并由 `git read-tree` 自身完成。当 `git read-tree` 返回时，只有冲突路径会处于未合并状态。\n\n## OPTIONS\n\
  - `-m`\n执行合并而不仅仅是读取。如果索引文件存在未合并的条目，命令将拒绝运行，表明你尚未完成之前的合并。\n\n- `--reset`\n与 `-m`\
  \ 相同，区别是丢弃未合并的条目而不是报错。\n\n- `-u`\n成功合并后，根据合并结果更新工作区中的文件。\n\n- `-i`\n通常，合并需要索引文件以及工作区中的文件与当前头提交保持同步，以防丢失本地更改。此标志禁用了对工作区的检查，用于将与当前工作区状态没有直接关联的树合并到临时索引文件中。\n\
  \n- `-n, --dry-run`\n检查命令是否会报错，而不会真实更新索引或工作区中的文件。\n\n- `-v`\n显示检出文件的进度。\n\n- `--trivial`\n\
  限制 `git read-tree` 的三路合并，使其仅在不需要文件级合并时发生，而不是为简单情况解决合并问题并在索引中留存未解决的冲突文件。\n\n- `--aggressive`\n\
  通常，`git read-tree` 的三路合并会解决非常简单情况的合并，并在索引中留存其他未解决的情况，以便 porcelain 接口可以实现不同的合并策略。此标志使命令在内部解决更多情况：\n\
  - 当一侧删除路径而另一侧保持该路径未修改时。解决方法是移除该路径。\n- 当双方都删除路径时。解决方法是移除该路径。\n- 当双方相同地添加路径时。解决方法是添加该路径。\n\
  \n- `--prefix=<prefix>/`\n保留当前索引内容，并在`<prefix>` 目录下读取命名树-ish 的内容。命令将拒绝覆盖原始索引文件中已存在的条目。注意\
  \ `<prefix>/` 值必须以斜杠结尾。\n\n- `--exclude-per-directory=<gitignore>`\n在使用 `-u` 和 `-m`\
  \ 选项运行命令时，合并结果可能需要覆盖当前分支中未跟踪的路径。命令通常拒绝继续合并以避免丢失此类路径。但这种安全机制有时会干扰。例如，经常发生另一个分支添加了一个在你分支中曾是生成的文件，当你运行\
  \ `make` 之后但在运行 `make clean` 删除生成文件之前尝试切换到该分支时，安全机制就会触发。此选项告诉命令读取按目录排除的文件（通常为 `*.gitignore`），并允许此类未跟踪但显式忽略的文件被覆盖。\n\
  \n- `--index-output=<file>`\n不将结果写入 `$GIT_INDEX_FILE`，而是将生成的索引写入命名文件。在命令运行期间，原始索引文件将使用相同的机制锁定。该文件必须允许从在常规索引文件旁边创建的临时文件进行拷贝；通常这意味着它需要与索引文件本身位于同一个文件系统中，并且你对索引文件和索引输出文件所在的目录具有写入权限。\n\
  \n- `--no-sparse-checkout`\n即使 `core.sparseCheckout` 为 true 也禁用稀疏检出支持。\n\n- `--empty`\n\
  不将树对象读入索引，直接清空。\n\n- `<tree-ish#>`\n要读取/合并的树对象的 ID。\n\n## MERGING\n如果指定了 `-m`，`git\
  \ read-tree` 可以执行 3 种合并：如果只给 1 个树，则执行单树合并；2 个树执行快进合并；提供 3 个树则执行三路合并。\n\n### 单树合并\n\
  如果只指定了 1 个树，`git read-tree` 的操作就像用户没有指定 `-m`，但如果原始索引中存在给定路径的条目，且该路径的内容与读入的树匹配，则使用索引中的\
  \ stat 信息。（换句话说，索引的 `stat()` 优先于合并的树）。\n\n这意味着如果你执行了 `git read-tree -m <newtree>`\
  \ 然后执行 `git checkout-index -f -u -a`，`git checkout-index` 只会检出真正变化的内容。\n\n这用于避免在运行\
  \ `git read-tree` 后运行 `git diff-files` 时产生不必要的误报。\n\n### 双树合并\n通常这被调用为 `git read-tree\
  \ -m $H $M`，其中 `$H` 是当前仓库的头提交，`$M` 是外部树的头，该树仅领先于 `$H`（即我们处于快进状态）。\n\n当指定两个树时，用户正在告诉\
  \ `git read-tree`set：\n1. 当前索引和工作区派生自 `$H`，但用户自 `$H` 之后在其中可能有本地更改。\n2. 用户想要快进到 `$M`。\n\
  \n\n\n\n在这种情况下，`git read-tree -m $H $M` 命令确保了不会因为这次“合并”的结果而丢失任何本地更改。以下是“进位”规则，其中“I”表示索引（index），“clean”意味着索引和工作树一致，“exists”/“nothing”指的是指定提交中是否存在该路径：\n\
  \n```\nI H M Result ------------------------------------------------------- \n0\
  \ nothing nothing nothing (does not happen) \n1 nothing nothing exists use M \n\
  2 nothing exists nothing remove path from index \n3 nothing exists exists, use M\
  \ if \"initial checkout\", H == M keep index otherwise exists, fail H != M\n\nclean\
  \ I==H I==M ------------------ \n4 yes N/A N/A nothing nothing keep index \n5 no\
  \ N/A N/A nothing nothing keep index\n\n6 yes N/A yes nothing exists keep index\
  \ \n7 no N/A yes nothing exists keep index \n8 yes N/A no nothing exists fail \n\
  9 no N/A no nothing exists fail\n\n10 yes yes N/A exists nothing remove path from\
  \ index \n11 no yes N/A exists nothing fail \n12 yes no N/A exists nothing fail\
  \ \n13 no no N/A exists nothing fail\n\nclean (H==M) ------ \n14 yes exists exists\
  \ keep index \n15 no exists exists keep index\n\nclean I==H I==M (H!=M) ------------------\
  \ \n16 yes no no exists exists fail \n17 no no no exists exists fail \n18 yes no\
  \ yes exists exists keep index \n19 no no yes exists exists keep index \n20 yes\
  \ yes no exists exists use M \n21 no yes no exists exists fail\n```\n\n在所有“保留索引”（keep\
  \ index）的情况下，索引条目保持与原始索引文件一致。如果该条目未更新，`git read-tree` 在 `-u` 标志下操作时会保持工作树中的副本完好无。。\n\
  \n这种形式的 `git read-tree` 成功返回时，你可以运行 `git diff-index --cached $M` 来查看你所做的“本地更改”中有哪些被带入了。请注意，这并不等同于在这种双树合并之前\
  \ `git diff-index --cached $H` 会产生的结果。这是由于第 18 和第 19 情况导致的——如果你已经有了 `$M` 中的更改（例如，可能你通过邮件补丁的形式获取了它），`git\
  \ diff-index --cached $H` 会在合并前告知你该更改，但在双树合并后的 `git diff-index --cached $M` 输出中不会显示它。\n\
  \n情况 3 稍微有点复杂，需要解释。该规则的逻辑结果应该是：如果用户暂存了删除路径的操作并切换到新分支，则删除该路径。然而这将阻止初始检出（initial checkout）的发生，因此规则被修改为：仅当索引内容为空时才使用\
  \ `M`（新树）。否则，只要 `$H` 和 `$M` 相同，路径的删除就会保留。\n\n### 三路合并 (3-Way Merge)\n\n每个“索引”条目都有两个位的“阶段”（stage）状态。`stage\
  \ 0` 是正常状态，也是你在任何正常使用下唯一会看到的状态。\n\n然而，当你对三个树执行 `git read-tree` 时，“阶段”从 1 开始。\n\n\
  这意味着你可以执行：\n\n```\n$ git read-tree -m <tree1> <tree2> <tree3>\n```\n\n并且你会得到一个索引，其中所有的\
  \ `<tree1>` 条目处于 \"stage1\"，所有的 `<tree2>` 条目处于 \"stage2\"，而所有的 `<tree3>` 条目处于 \"\
  stage3\"。在将另一个分支合并到当前分支时，我们使用共同祖先树作为 `<tree1>`，当前分支头作为 `<tree2>`，另一个分支头作为 `<tree3>`。\n\
  \n此外，`git read-tree` 具有特殊情况逻辑：如果你看到一个文件在以下状态下各方面都匹配，它将“折叠”回“stage0”：\n\n- `stage\
  \ 2` 和 `stage 3` 相同；取其中任一（这没有区别——在我们的分支 `stage 2` 中做的工作与他们的分支 `stage 3` 中做的是一样的）\n\
  - `stage 1` 和 `stage 2` 相同且 `stage 3` 不同；取 `stage 3`（我们的分支 `stage 2` 自从 `stage 1`\
  \ 的祖先以来没有做任何操作，而他们的分支 `stage 3` 进行了处理）\n- `stage 1` 和 `stage 3` 相同且 `stage 2` 不同；取\
  \ `stage 2`（我们做了操作，而他们什么都没做）\n\n`git write-tree` 命令拒绝写入无意义的树，如果它看到任何不是 `stage 0`\
  \ 的条目，它会对未合并的条目报错。\n\n好了，这听起来像是一组完全毫无意义的规则，但它实际上正是为了进行快速合并所需要的。不同的阶段 `1`、`2` 和 `3`\
  \ 分别代表“结果树”（`stage 0`，即“已合并”）、原始树（`stage 1`，即“orig”）以及你正尝试合并的两个树（分别为 `stage 2` 和\
  \ 3）。\n\n当你从已经填充的索引文件开始三路合并时，阶段 `1`、`2` 和 `3` 的顺序（即三个 `<tree-ish>` 命令行参数的顺序）是非常重要的。以下是算法原理的概述：\n\
  \n- 如果文件在三个树中的格式完全相同，`git read-tree` 将自动将其折叠为“已合并”状态。\n- 在三个树中存在*任何*差异的文件将作为独立的条目保留在索引中。如何移除非\
  \ 0 阶段并插入合并后的版本，取决于“瓷器策略”（porcelain policy）。\n- 索引文件保存和恢复时带有所有这些信息，因此你可以增量地合并，但只要它还存在\
  \ `1/2/3` 阶段的条目（即“未合并条目”），你就无法写入结果。因此，合并算法变得非常简单：\n- 你按顺序遍历索引，忽略所有的 `stage 0` 条目，因为它们已经处理过了。\n\
  - 如果你发现 `stage1` 但没有匹配的 `stage2` 或 `stage3`，你知道它已从两个树中都被删除了（它只存在于原始树中），并删除该条目。\n\
  - 如果你发现匹配的 `stage2` 和 `stage3` 树，移除其中一个，并将另一个转换为 `stage0` 条目。如果存在匹配的 `stage1` 条目，也将其删除……所有常见的简单规则……\n\
  \n你通常会使用 `git merge-index` 配合提供的 `git merge-one-file` 来完成最后一步。该脚本会在合并每个路径以及成功合并结束后更新工作树中的文件。\n\
  \n当你从已经填充的索引文件开始三路合并时，假设它代表了你工作树中文件的状态，你甚至可能拥有在索引文件中未记录更改更改的文件。进一步假设该状态是“衍生”自 `stage\
  \ 2` 树的。如果在原始索引文件中发现与 `stage 2` 不匹配的条目，三路合并将拒绝运行。\n\n这样做是为了防止你丢失进行中的更改，并防止将随机更改混杂在无关的合并提交中。为了说明，假设你从仓库中最后一次提交的状态开始：\n\
  \n```\n$ JC=`git rev-parse --verify \"HEAD⁰\"` $ git checkout-index -f -u -a $JC\n\
  ```\n\n你进行了随机编辑，而没有运行 `git update-index`。然后你注意到自从从那里拉取以来，你的“上游”树端已经向前了：\n\n```\n\
  $ git fetch linus $ LT=`git rev-parse FETCH_HEAD`\n```\n\n你的工作树仍然基于你的 `HEAD` (`$JC`)，但你之后又有一些编辑。三路合并确保你没有自\
  \ `$JC` 以来添加或修改索引条目，如果没有，它就会执行正确的操作。因此通过以下序列：\n\n```\n$ git read-tree -m -u `git\
  \ merge-base $JC $LT` $JC $LT $ git merge-index git-merge-one-file -a $ echo \"\
  Merge with Linus\" | \\ git commit-tree `git write-tree` -p $JC -p $LT\n```\n\n\
  你将提交的是 `$JC` 和 `$LT` 之间的纯合并，不包含你进行中的更改，并且你的工作树将更新为合并的结果。\n\n但然而，如果你在工作树中拥有会被这次合并覆盖的本地更改，`git\
  \ read-tree` 将拒绝运行以防止你的更改丢失。\n\n\n\n\n\n换句话说，无需担心仅存在于工作树中的内容。当你对项目中未参与合并的部分有本地更改时，你的更改不会与合并冲突，并会被完好地保留。当它们**确实**发生冲突时，合并甚至不会开始（`git\
  \ read-tree` 会大报错并失败，且不会修改任何内容）。在这种情况下，你只需继续你正在的操作，等你的工作树准备就绪（即你完成了正在进行的工作），再次尝试合并。\n\
  \n## 稀疏检出 (SPARE CHECKOUT)\n\n“稀疏检出”允许稀疏地填充工作目录。它使用 skip-worktree 标记（见 (1)）来告诉 Git\
  \ 工作目录中的某个文件是否值得查看。\n\n`git read-tree` 和其他基于合并的命令（`git merge`、`git checkout`...）可以帮助维护\
  \ skip-worktree 位图和工作目录的更新。`$GIT_DIR/info/sparse-checkout` 用于定义 skip-worktree 引用位图。当\
  \ `git read-tree` 需要更新工作目录时，它会根据该文件重置索引中的 skip-worktree 标记，该文件的语法与 .gitignore 文件相同。如果条目匹配此文件中的模式，则该条目不会设置\
  \ skip-worktree。否则，将设置 skip-worktree。\n\n然后它会将新的 skip-worktree 值与上一个值进行比较。如果 skip-worktree\
  \ 从设置为变为未设置，它将把对应文件加回来。如果从未设置变为设置，则该文件将被删除。\n\n虽然 `$GIT_DIR/info/sparse-checkout`\
  \ 通常用于指定哪些文件在内，但你也可以使用取反模式指定哪些文件*不在*在内。例如，要移除不需要的文件：\n\n```\n/* !unwanted\n```\n\
  \n另一个棘手的问题是在当你不再需要稀疏检出时完全重新填充工作目录。你不能简单地禁用“稀疏检出”，因为 skip-worktree 标记仍在索引中，且你的工作目录仍然是稀疏填充的。你应该如下使用\
  \ `$GIT_DIR/info/sparse-checkout` 文件的内容重新填充工作目录：\n\n```\n/*\n```\n\n然后你就可以禁用稀疏检出了。`git\
  \ read-tree` 和类似命令中的稀疏检出支持默认是禁用。你需要开启 `core.sparseCheckout` 才能获得稀疏检出支持。\n\n## 参见\
  \ (SEE ALSO)\n\n(1); (1); (5)\n\n* *\n\n# GIT-REBASE\n\n## 名称 (NAME)\n\n`git-rebase`\
  \ - 将本地提交向前移植到更新的上游头部\n\n## 概要 (SYNOPSIS)\n\n`git rebase [-i | --interactive] [options]\
  \ [--exec <cmd>] [--onto <newbase>] [<upstream> [<branch>]]`\n`git rebase [-i |\
  \ --interactive] [options] [--exec <cmd>] [--onto <newbase>] --root [<branch>]`\n\
  `git rebase --continue | --skip | --abort | --edit-todo`\n\n## 说明 (DESCRIPTION)\n\
  \n如果指定了 `<branch>`，`git rebase` 在执行其他操作之前将执行自动的 `git checkout <branch>`。如果未指定 `<upstream>`，将使用在\
  \ `branch.<name>.remote` 和 `branch.<name>.merge` 选项中配置的上游（详情见 (1)），并假设启用了 `--fork-point`\
  \ 选项。如果你当前不在任何分支上，或者当前分支没有配置上游，则 rebase 将终止。\n\n由当前分支提交产生但不在 `<upstream>` 中的所有更改将被保存到一个临时区域。这与\
  \ `git log <upstream>..HEAD` 显示的提交集相同；或者如果激活了 `--fork-point`，则与 `git log 'fork_point'..HEAD`\
  \ 显示（见下文 --fork-point 的说明）；或者如果指定了 `--root` 选项，则与 `git log HEAD` 显示。\n\n当前分支被重置为\
  \ `<upstream>`，或者如果提供了 `--onto` 选项则为 `<newbase>`。这与 `git reset --hard <upstream>`（或\
  \ `<newbase>`）的效果完全相同。`ORIG_HEAD` 被指向重置之前的分支顶端。\n\n之前保存到临时区域的提交将按顺序逐个重新应用当前分支。注意，`HEAD`\
  \ 中任何与 `HEAD..<upstream>` 中提交相同文本更改的提交将被跳过（即上游已接受具有不同提交信息或时间戳的提交将被跳过）。\n\n合并失败可能会导致此过程无法完全自动。你必须解决任何此类合并失败并运行\
  \ `git rebase --continue`。另一个选项是使用 `git rebase --skip` 跳过导致合并失败的提交。要检出原始 `<branch>`\
  \ 并移除 `.git/rebase-apply` 工作文件，请使用命令 `git rebase --abort`。\n\n假设存在以下历史且当前分支为 \"\
  topic\"：\n\n```\nA---B---C topic / D---E---F---G master\n```\n\n从此点开始，以下任一命令的结果：\n\
  \n```\ngit rebase master git rebase master topic\n```\n\n结果将是：\n\n```\nA'--B'--C'\
  \ topic / D---E---F---G master\n```\n\n**注意：** 后者形式只是 `git checkout topic` 之后接 `git\
  \ rebase master` 的简写。当 rebase 退出时，topic 将保持为检出的分支。\n\n如果上游分支已经包含了你所做的更改（例如，因为你发送的补丁已应用到上游），则该提交将被跳过。例如，在以下历史上运行\
  \ `git rebase master`（其中 A' 和 A 引入了相同的更改，但具有不同的提交者信息）：\n\n```\nA---B---C topic /\
  \ D---E---A'---F master\n```\n\n将导致：\n\n```\nB'---C' topic / D---E---A'---F master\n\
  ```\n\n这里是如何使用 `rebase --onto` 将基于一个分支的 topic 分支移植到另一个分支，假装你是从另一个分支分叉出 topic 分支。\n\
  \n首先，假设你的 `topic` 基于分支 `next`。例如，在 `topic` 中开发的功能依赖于 `next` 中的某些功能。\n\n```\no---o---o---o---o\
  \ master \\ o---o---o---o---o next \\ o---o---o---o topic\n```\n\n我们想让 `topic` 从\
  \ `master` 分支分叉；例如，因为 `topic` 依赖的功能已合并到更稳定的 `master` 分支中。我们希望我们的树看起来像这样：\n\n```\n\
  o---o---o---o---o master | \\ | o'--o'--o' topic \\ o---o---o---o---o next\n```\n\
  \n我们可以使用以下命令实现这一点：\n\n```\ngit rebase --onto master next topic\n```\n\n`--onto`\
  \ 选项的另一个例子是 rebase 分支的一部分。如果我们有以下情况：\n\n```\nH---I---J topicB / E---F---G topicA\
  \ / A---B---C---D master\n```\n\n那么命令\n\n```\ngit rebase --onto master topicA topicB\n\
  ```\n\n将导致：\n\n```\nH'--I'--J' topicB / | E---F---G topicA |/ A---B---C---D master\n\
  ```\n\n这在 `topicB` 不依赖于 `topicA` 时非常有用。\n\n也可以通过 rebase 移除一个范围的提交。如果我们有以下情况：\n\n\
  ```\nE---F---G---H---I---J topicA\n```\n\n那么命令\n\n```\ngit rebase --onto topicA~5\
  \ topicA~3 topicA\n```\n\n将导致提交 F 和 G 的移除：\n\n```\nE---H'---I'---J' topicA\n```\n\
  \n这如果 F 和 G 在某些方面存在缺陷，或者不应成为 `topicA` 的部分，则很有用。注意，`--onto` 的参数和 `<upstream>` 参数可以是任何有效的\
  \ commit-ish。\n\n发生冲突时，`git rebase` 将停在第一个问题的提交上，并在树中留下冲突标记。你可以使用 `git diff` 定位标记（<<<<<<）并进行编辑以解决冲突。对于你编辑的每个文件，你都需要告诉\
  \ Git 冲突已解决，通常通过这样做：\n\n```\ngit add <filename>\n```\n\n在手动解决冲突并使用所需的解析更新索引后，你可以继续\
  \ rebasing 过程：\n\n```\ngit rebase --continue\n```\n\n或者，你可以通过以下命令撤销 `git rebase`：\n\
  \n```\ngit rebase --abort\n```\n\n## 配置 (CONFIGURATION)\n\nrebase.stat\n\n是否显示自上次\
  \ rebase 以来上游更改的 diffstat。默认默认为 False。\n\nrebase.autoSquash\n\n如果设置为 true，则默认启用\
  \ `--autosquash` 选项。\n\nrebase.autoStash\n\n如果设置为 true，则默认启用 `--autostash` 选项。\n\
  \n## 选项 (OPTIONS)\n\n--onto <newbase>\n\n\n\n\nStarting\n创建新提交的起点点。如果没有指定 `--onto`\
  \ 选项，则起点为 `<upstream>`。它可以是任何有效的提交，而不仅仅是现有的分支名。\n\n作为一个特殊情况，如果 A 和 B 恰好有一个合并基，你可以使用\
  \ `\"A...B\"` 作为 A 和 B 合并基的快捷方式。你可以最多省略 A 和 B 中的一个，在这种情况下它默认为 `HEAD`。\n\n`<upstream>`\n\
  \n用于比较的上游分支。可以是任何有效的提交，而不仅仅是现有的分支名。默认是当前分支配置的上游。\n\n`<branch>`\n\n工作分支；默认为 `HEAD`。\n\
  \n### --continue\n在解决合并冲突后重新启动变基过程。\n\n### --abort\n中止变基操作并将 `HEAD` 重置为原始分支。如果在启动变基操作时提供了\
  \ `<branch>`，则 `HEAD` 将被重置为 `<branch>`。否则，`HEAD` 将重置为变基操作开始时的位置。\n\n### --keep-empty\n\
  在结果中保留与其父提交相比没有任何更改的提交。\n\n### --skip\n跳过当前补丁并重新启动变基过程。\n\n### --edit-todo\n在交互式变基期间编辑待办列表。\n\
  \n### -m, --merge\n使用合并策略进行变基。当使用递归（默认）合并策略时，这允许变基感知上游侧的重命名。\n\n请注意，变基合并通过将工作分支中的每个提交重新应用到\
  \ `<upstream>` 分支之上来。正因如此，当发生合并冲突时，报告为 `ours`（我们的）的一侧是到目前变基序列（从 `<upstream>` 开始），而\
  \ `theirs`（他们的）是工作分支。换句话说，双方交换了。\n\n### -s <strategy>, --strategy=<strategy>\n使用指定的合并策略。如果没有\
  \ `-s` 选项，则将使用 `git merge-recursive`。这意味着使用了 `--merge`。\n\n由于 `git rebase` 使用给定的策略将工作分支的每个提交重新应用到\
  \ `<upstream>` 分支之上，因此使用 `ours` 策略将简单丢弃 `<branch>` 中的所有补丁，这几乎没有意义。\n\n### -X <strategy-option>,\
  \ --strategy-option=<strategy-option>\n将 `<strategy-option>` 传递给合并策略。这意味着使用了 `--merge`，并且如果没有指定策略，则使用\
  \ `-s recursive`。请注意上述针对 `-m` 选项的 `ours` 和 `theirs` 的反转。\n\n### -S[<keyid>], --gpg-sign[=<keyid>]\n\
  对提交进行 GPG 签名。\n\n### -q, --quiet\n安静模式。意味着 `--no-stat`。\n\n### -v, --verbose\n详细模式。意味着\
  \ `--stat`。\n\n### --stat\n显示自上次变基以来上游更改的差异统计（diffstat）。差异统计由配置选项 `rebase.stat`\
  \ 控制。\n\n### -n, --no-stat\n在变基过程中不显示差异统计。\n\n### --no-verify\n此选项跳过变基前钩子（pre-rebase\
  \ hook）。另见 (5)__\n\n### --verify\n允许运行变基前钩子，这是默认设置。此选项可用于覆盖 `--no-verify`。另见 (5)__\n\
  \n### -C<n>\n确保每次更改前后至少有 `<n>` 行周围上下文相匹配。如果周围上下文行较少，则它们必须全部匹配。默认情况下不忽略任何上下文。\n\n\
  ### -f, --force-rebase\n即使当前分支是最新的，且不带 `--force` 的命令直接返回而不执行任何操作，也强制变基。\n\n在撤销主题分支合并后，你可能会发现此操作（或配合交互式变基使用\
  \ `--no-ff`）很有帮助，因为此选项会使用新的提交重建主题分支，以便能够重新合并，而无需“撤销撤销的操作”（详见 `revert-a-faulty-merge\
  \ How-To`m[][1]）。\n\n### --fork-point, --no-fork-point\n在计算哪些提交是由 `<branch>` 引入的时，使用\
  \ reflog 在 `<upstream>` 和 `<branch>` 之间找到更佳的共同祖先。\n\n当 `--fork-point` 激活时，将使用 `fork_point`\
  \ 而不是 `<upstream>` 来计算变基的提交集，其中 `fork_point` 是 `git merge-base --fork-point <upstream>\
  \ <branch>` 命令的结果（见 (1)__）。如果 `fork_point` 最终为空，将使用 `<upstream>` 作为备备方案。\n\n如果在命令行上给了\
  \ `<upstream>` 或 `--root`，则默认使用 `--no-fork-point`，否则默认使用 `--fork-point`。\n\n###\
  \ --ignore-whitespace, --whitespace=<option>\n这些标志被传递给应用补丁的 `git apply` 程序（见 (1)__）。与\
  \ `--interactive` 选项兼容。\n\n### --committer-date-is-author-date, --ignore-date\n\
  这些标志被传递给 `git am` 以轻松更改变基提交的日期（见 (1)__）。与 `--interactive` 选项兼容。\n\n### -i, --interactive\n\
  列出即将变基的提交列表。让用户在变基前编辑该列表。此模式也可用于拆分提交（见下文 SPLITTING COMMITS）。\n\n### -p, --preserve-merges\n\
  重新创建合并提交，而不是通过重放合并提交引入的提交来扁平化历史。合并冲突的解决或对合并提交的手动修改不会被保留。\n\n这在内部使用了 `--interactive`\
  \ 机制，但显式与 `--interactive` 选项结合使用通常不是好主意，除非你清楚自己在做什么（见下文 BUGS）。\n\n### -x <cmd>,\
  \ --exec <cmd>\n在最终历史中创建提交的每行之后添加 `\"exec <cmd>\"`。`<cmd>` 将解释为一个或多个 shell 命令。\n\
  \n此选项只能与 `--interactive` 选项配合使用（见下文 INTERACTIVE MODE）。\n\n你可以通过在单个 `--exec` 实例中使用多个命令来执行多个命令：\n\
  \n```\ngit rebase -i --exec \"cmd1 && cmd2 && ...\"\n```\n\n或者通过提供多个 --exec：\n\n\
  ```\ngit rebase -i --exec \"cmd1\" --exec \"cmd2\" --exec ...\n```\n\n如果使用了 `--autosquash`，中间提交将不会附加\
  \ \"exec\" 行，这些行只会出现在每个 squash/fixup 序列的末尾。\n\n### --root\n变基从 `<branch>` 可达的所有提交，而不是通过\
  \ `<upstream>` 限制它们。这允许你变基分支上的根提交。当与 `--onto` 使用时，它将跳过已在 `<newbase>` 中的更改（而不是 `<upstream>`），而在没有使用\
  \ `--onto` 时它将作用于每一个更改。当同时与 `--onto` 和 `--preserve-merges` 使用时，*所有*根提交将被重写为以 `<newbase>`\
  \ 为父节点。\n\n### --autosquash, --no-autosquash\n当提交日志以 \"squash! ...\"（或 \"fixup!\
  \ ...\"）开头，且有一个提交标题以相同的开头时，自动修改 `rebase -i` 的待办列表，使标记为压缩的提交紧跟在要修改提交之后，并将移动提交的操作从\
  \ pick 改为 squash（或 fixup）。忽略后续的 \"fixup! \" 或 \"squash! \" 以防你通过 git commit --fixup/--squash\
  \ 引用了之前的修复/压缩。\n\n此选项仅在使用 `--interactive` 选项时有效。\n\n如果通过配置变量 `rebase.autoSquash`\
  \ 默认启用 `--autosquash` 选项，可以使用此选项覆盖并禁用该设置。\n\n### --[no-]autostash\n操作开始前自动创建一个临时\
  \ stash，操作结束后应用它。这意味着你可以在脏工作树上运行变基。但请谨慎使用：成功变基后最后的 stash 应用可能会导致非平凡的冲突。\n\n### --no-ff\n\
  在交互式模式下，应用-pick 所有变基后的提交，而不是对未更改的部分进行快进。这确保了变基分支的整个历史都由新提交组成。\n\n在非交互式模式下，它是 `--force-rebase`\
  \ 的同义词。\n\n\n\n合并机制（`git merge` 和 `git pull` 命令）允许通过 `-s` 选项选择后端的`merge strategies`。某些策略还可以接受自己的选项，这些选项可以通过向\
  \ `git merge` 和/或 `git pull` 提供 `-X<option>` 参数来传递。\n\n## resolve\n\n该策略只能使用 3 路合并算法解析两个头节点（即当前分支和从某处拉取的另一个分支）。它会尝试仔细检测交叉交叉合并（criss-cross\
  \ merge）歧义，通常被认为是安全且快速的。\n\n## recursive\n该策略只能使用 3 路合并算法解析两个头节点。当存在多个一个可用于 3 路合并的公共祖先时，它会创建一个公共祖先的合并树，并将其作为\
  \ 3 路合并的参考树。根据对 Linux 2.6 内核开发历史中实际合并提交的测试，这种方法报告可以减少合并冲突，且不会导致错误合并（mismerges）。此外，它还可以检测并处理涉及重命名的合并。这是拉取或合并单个分支时默认的合并策略。\n\
  \n`recursive` 策略可以接受以下选项：\n\n### ours\n此选项强制冲突的代码块（hunks）通过倾向`our` 版本来自动解决。来自另一个树的与我们侧不冲突的更改将反映在合并结果中。对于二进制文件，整个内容将取自我们侧。\n\
  \n这不应与 `ours` 合并策略混淆，后者完全不看另一个树包含的内容。它会丢弃另一个树所做的所有操作，声明 `our` 历史包含了其中发生的所有内容。\n\n\
  ### theirs\n这是 `ours` 的相反选项。\n\n### patience\n使用此选项时，`merge-recursive` 会花费额外的时间来避免有时因无关紧要的匹配行（例如不同函数的括号）而导致的错误合并。当要合并的分支差异巨大时，请使用此选项。另见\
  \ `(1)--patience`。\n\n### diff-algorithm=[patience|minimal|histogram|myers]\n告诉\
  \ `merge-recursive` 使用不同的差异算法，这有助于避免因无关紧要的匹配行（如不同函数的括号）而导致的错误合并。另见 `(1)--diff-algorithm`。\n\
  \n### ignore-space-change, ignore-all-space, ignore-space-at-eol\n为了进行三路合并，将带有指定类型空格更改的行视为未更改。与行其他更改混合的空格更改不会被忽略。另见\
  \ `(1)-b`、`-w` 和 `--ignore-space-at-eol`。\n\n- 如果 `their` 版本仅对某行引入了空格更改，则使用 `our`\
  \ 版本；\n- 如果 `our` 版本引入了空格更改但 `their` 版本包含实质性更改，则使用 `their` 版本；\n- 否则，按通常方式合并。\n\n\
  ### renormalize\n在解析三路合并时，它会对文件的三个阶段都运行虚拟的检出（check-out）和检入（check-in）。此选项用于合并具有不同清理过滤器（clean\
  \ filters）或行尾归一化（eol normalization）规则的分支。详情请见 (5) 中的“合并具有不同检入/检出属性的分支”。\n\n### no-renormalize\n\
  禁用 `renormalize` 选项。这会覆盖 `merge.renormalize` 配置变量。\n\n### rename-threshold=<n>\n\
  控制用于重命名检测的相似性阈值。另见 `(1)-M`。\n\n### subtree[=<path>]\n此选项是 `subtree` 策略的一种更高级的形式，该策略在合并时对两个树必须如何移动以彼此匹配做出猜测。相反，指定的路径将被添加前缀（或从开头剥离），以使两个树的形状相匹配。\n\
  \n### octopus\n该策略解析多于两个头节点的情况，但拒绝执行需要手动解决的复杂合并。它主要用于将多个主题分支头组合在一起。这是拉取或合并多个分支时的默认合并策略。\n\
  \n### ours\n该策略解析任意数量的头节点，但合并后的树始终是当前分支头的树，实际上忽略了所有其他分支的所有更改。它用于取代侧分支的旧开发历史。注意，这与\
  \ `recursive` 合并策略的 `-Xours` 选项不同。\n\n### subtree\n这是改进的 recursive 策略。在合并树 A 和 B\
  \ 时，如果 B 对应于 A 的子树，则先调整 B 以匹配 A 的树结构，而不是在相同层级读取树。这种调整也会对公共祖先树进行。\n\n对于使用 3 路合并的策略（包括默认的\
  \ `recursive`），如果对两个分支上都做了更改，但随后在其中一个分支上撤销了该更改，那么该更改将出现在合并结果中；一些人发现这种行为令人困惑。这是因为在执行合并时只考虑头节点和合并基（merge\
  \ base），而不考虑单个提交。因此，合并算法将撤销的更改视为没有任何更改，并代之以更改的版本。\n\n### NOTES\n你应该理解在你们共享的仓库上使用\
  \ `git rebase` 的影响。另见下文 RECOVERING FROM UPSTREAM REBASE。\n\n运行 `git-rebase` 命令时，如果存在，它将首先执行“pre-rebase”钩子（hook）。你可以使用此钩子进行健全性检查，并在不合适时拒绝\
  \ rebase。请参考模板 pre-rebase 钩子脚本示例。\n\n完成后，`<branch>` 将成为当前分支。\n\n## INTERACTIVE MODE\n\
  交互式 rebase 意味着你有机会编辑被 rebase 的提交。你可以重新排序提交，也可以删除它们（剔除糟糕或其他不需要的补丁）。\n\n交互式模式适用于这种类型的工作流：\n\
  \n1. 有了一个棒的主意\n2. 对代码进行黑客操作\n3. 准备一系列用于提交的提交\n4. 提交\n\n其中点 2 包含若干个实例：\n\na) 常规使用\n\
  1. 完成某些值得提交的内容\n2. 提交\n\nb) 独立的修复（fixup）\n1. 发现某些东西不起作用\n2. 修复它\n3. 提交\n\n有时 b.2\
  \ 中修复的内容无法合并到它所修复的那个并不完美的提交中，因为该提交深埋在补丁序列中。这正是交互式 rebase 的用处：在进行了大量的“a”和“b”之后，通过重新排列和编辑提交，并将多个提交合并（squash）为一个，来使用它。\n\
  \n从你想要原样保留的最后一个提交启动它：\n\n```bash\ngit rebase -i <after-this-commit>\n```\n\n将启动一个编辑器，显示你当前分支中所有在给定提交之后的提交（忽略合并提交）。你可以根据随心所欲地重新排列此列表中的提交，也可以删除它们。该列表看起来大致如下：\n\
  \n```bash\npick deadbee The oneline of this commit pick fa1afe1 The oneline of the\
  \ next commit ...\n```\n\n单行描述纯粹供你阅读；`git rebase` 不会查看它们，而是查看提交名称（此示例中的 \"deadbee\"\
  \ 和 \"fa1afe1\"），因此不要删除或编辑名称。\n\n通过将命令 \"pick\" 替换为命令 \"edit\"，你可以告诉 `git rebase`\
  \ 在应用该提交后停止，这样你就可以编辑文件和/或提交信息、修正提交并继续 rebase。\n\n如果你只想编辑某个提交的提交消息，请将命令 \"pick\"\
  \ 替换为命令 \"reword\"。\n\n如果你想将两个或多个提交合并为一个，请将第二个及后续提交的命令 \"pick\" 替换为 \"squash\" 或\
  \ \"fixup\"。如果这些提交有不同的作者，合并后的提交将归属于第一个提交的作者。合并后提交的建议提交消息是第一个提交的提交消息与带有 \"squash\"\
  \ 命令的提交的提交消息的拼接，但会省略带有 \"fixup\" 命令的提交的提交消息。\n\n当 \"pick\" 被替换为 \"edit\" 或命令因合并错误导致执行失败时，`git\
  \ rebase` 将停止。当你完成编辑和/或解决冲突后，可以运行 `git rebase --continue` 继续。\n\n\n\n例如，如果你想重新排序最后的\
  \ 5 个提交，使得原来的 `HEAD~4` 变成新的 `HEAD`。为了实现这一点，你可以这样调用 `git rebase`：\n\n```\n$ git rebase\
  \ -i HEAD~5\n```\n\n并将第一个补丁（patch）移动到列表的末尾。\n\n如果你有如下历史，你可能想要保留合并提交：\n\n```\nX \\\
  \ A---M---B / ---o---O---P---Q\n```\n\n假设你想将从 \"A\" 开始的侧边分支 rebase 到 \"Q\"。确保当前的\
  \ `HEAD` 是 \"B\"，然后调用：\n\n```\n$ git rebase -i -p --onto Q O\n```\n\n重新排序和编辑提交通常会创建未经过测试的中间步骤。你可能希望通过运行测试来检查你的历史记录编辑是否破坏了某些内容，或者至少使用\
  \ `exec` 命令（快捷方式为 `x`）在历史的中间点进行重新编译。你可以通过创建一个像下面这样的待办列表（todo list）来执行操作：\n\n```\n\
  pick deadbee Implement feature XXX fixup f1a5c00 Fix to feature XXX exec make pick\
  \ c0ffeee The oneline of the next commit edit deadbab The oneline of the commit\
  \ after exec cd subdir; make test ...\n```\n\n交互式 rebase 会在命令失败（即以非 0 状态退出）时停止，以便你有机会修复问题。你可以使用\
  \ `git rebase --continue` 继续。\n\n`exec` 命令在 shell 中启动命令（使用 `$SHELL`指定的 shell，或者如果\
  \ `$SHELL` 未设置则使用默认 shell），因此你可以使用 shell 功能（如 `\"cd\"`、`>`, `;` ...）。该命令从工作树的根目录运行。\n\
  \n```\n$ git rebase -i --exec \"make test\"\n```\n\n此命令允许你检查中间提交是可编译的。待办列表会变成如下：\n\
  \n```\npick 5928aea one exec make test pick 04d0fda two exec make test pick ba46169\
  \ three exec make test pick f4593f9 four exec make test\n```\n\n## 分拆提交 (SPLITTING\
  \ COMMITS)\n\n在交互模式下，你可以用 \"edit\" 动作标记提交。然而，这并不意味着 `git rebase` 期望该编辑的结果恰好是一个提交。事实上，你可以撤销该提交，也可以添加其他提交。这可以用于将一个提交拆分为两个：\n\
  \n- 使用 `git rebase -i <commit>^` 启动交互式 rebase，其中 `<commit>` 是你想要拆分的提交。事实上，任何提交范围都可以，只要它包含该提交即可。\n\
  \n- 用 \"edit\" 动作标记你想要拆分的提交。\n\n当要编辑该提交时，执行 `git reset HEAD^`。效果是 `HEAD` 回退一个版本，索引（index）随之移动。然而，工作树保持不变。\n\
  \n现在，将你想放入第一个提交的更改添加到索引中。你可以使用 `git add`（可能是交互式地）或 `git gui`（或两者都用）来完成此操作。\n\n使用任何合适的提交信息提交当前的索引。\n\
  \n重复最后两个步骤，直到你的工作树变干净为止。\n\n使用 `git rebase --continue` 继续 rebase。\n\n如果你不能完全确定中间版本是一致的（它们可以编译、通过测试套件等），你\
  \ 应该在每次提交、测试后使用 `git stash` 暂存尚未提交的更改，并在必要时修复提交。\n\n## 从上游 rebase 中恢复 (RECOVERING\
  \ FROM UPSTREAM REBASE)\n\n对他人在其基础上工作的分支进行 rebase 是一个坏主意：其下游的任何人都被强制手动修复他们的历史记录。本节解释了如何从下游的角度进行修复。然而，真正的修复方法是从根本避免对上游进行\
  \ rebase。\n\n为了说明，假设你处于这样的情况：有人开发了一个 `subsystem` 分支，而你正在开发一个依赖该 `subsystem` 的 `topic`。你可能会得到如下历史：\n\
  \n```\no---o---o---o---o---o---o---o---o master \\ o---o---o---o---o subsystem \\\
  \ *---*---* topic\n```\n\n如果 `subsystem` 对 `master` 进行 rebase，会发生以下情况：\n\n```\n\
  o---o---o---o---o---o---o---o master \\ \\ o---o---o---o---o o'--o'--o'--o'o' subsystem\
  \ \\ *---*---* topic\n```\n\n如果你现在照常继续开发，并最终将 `topic` 合并到 `subsystem`，来自 `subsystem`\
  \ 的提交将永远重复：\n\n```\no---o---o---o---o---o---o---o master \\ \\ o---o---o---o---o\
  \ o'--o'--o'--o'--o'--M subsystem \\ / *---*---*-..........-*--* topic\n```\n\n\
  这种重复通常是不受欢迎的，因为它们会弄乱历史记录，使其更难追踪。为了清理，你需要将 `topic` 上的提交移植到新的 `subsystem` 顶端，即 rebase\
  \ `topic`。这会产生连锁反应：`topic` 下游的任何人都被迫也进行 rebase，以此此类推！\n\n有两种修复方法，将在接下来的小节中讨论：\n\n\
  简单情况：更改完全相同。\n\n如果 `subsystem` 的 rebase 是简单的 rebase 且没有冲突，就会发生这种情况。\n\n困难情况：更改并不相同。\n\
  \n如果 `subsystem` 的 rebase 存在冲突，或者使用了 `--interactive` 来省略、编辑、合并（squash）或修复（fixup）提交；或者上游使用了提交\
  \ `--amend`、`reset` 或 `filter-branch` 之一，就会发生这种情况。\n\n### 简单情况\n\n只有当 `subsystem`\
  \ 上的更改（基于 diff 内容的补丁 ID）在 `subsystem` rebase 之前后完全相同时才有效。\n\n在这种情况下，修复是简单的，因为 `git\
  \ rebase` 知道跳过已经存在于新上游更改。所以如果你说（假设你处于 `topic` 上）\n\n```\n$ git rebase subsystem\n\
  ```\n\n你将得到修复后的历史：\n\n```\no---o---o---o---o---o---o---o master \\ o'--o'--o'--o'--o'\
  \ subsystem \\ *---*---* topic\n```\n\n### 困难情况\n\n如果 `subsystem` 的更改与 rebase 之前的并不完全对应，情况就会变得复杂。\n\
  \n**注意**\n\n虽然“简单情况恢复”即使在困难情况下有时看起来也是成功的，但可能会产生意外的后果。例如，通过 `git rebase --interactive`\
  \ 移除的提交将被**复活**！\n\n其思路是手动告诉 `git rebase` “旧的 `subsystem` 在哪里结束，你的 `topic` 从哪里开始”，即它们之间旧的合并基（merge-base）是什么。你必须找到一种命名旧\
  \ `subsystem` 最后一个提交的方法，例如：\n\n- 使用 `subsystem` 的 reflog：执行 `git fetch` 后，旧的 `subsystem`\
  \ 顶端位于 `subsystem@{1}`。随后的 fetch 会增加数字。（见 (1)。）\n- 相对于 `topic` 的顶端：知道你的 `topic`\
  \ 有三个提交，旧的 `subsystem` 顶端必须是 `topic~3`。\n\n你可以通过以下操作将旧的 subsystem..topic 移植到新顶端（对于\
  \ reflog 情况，并假设你已经在 `topic` 上）：\n\n```\n$ git rebase --onto subsystem subsystem@{1}\n\
  ```\n\n“困难情况”恢复的连锁反应特别糟糕：`topic` 下游的*每个人*现在都必须执行一次“困难情况”恢复！\n\n## 缺陷 (BUGS)\n\n\
  由 `--preserve-merges --interactive` 提供的待办列表并不代表修订图的拓扑。编辑提交和重写提交信息应该正常工作，但尝试重新排序提交往往会产生违反直觉的结果。\n\
  \n例如，尝试重新排列\n\n```\n1 --- 2 --- 3 --- 4 --- 5\n```\n\n到\n\n```\n1 --- 2 --- 4 ---\
  \ 3 --- 5\n```\n\n通过移动 \"pick 4\" 行将导致以下历史：\n\n```\n3 / 1 --- 2 --- 4 --- 5\n```\n\
  \n## GIT\n\n(1) 套件的一部分\n\n## 注释 (NOTES)\n\n1. revert-a-faulty-merge How-To\n\n*\
  \ *\n\n# GIT-RECEIVE-PACK\n\n## 名称\n\ngit-receive-pack - 接收推送到仓库的内容\n\n## 摘要\n\n\
  `git-receive-pack` `<directory>`\n\n## 描述\n\n由 `git send-pack` 调用，并使用从远程端输入的信息更新仓库。\n\
  \n该命令通常不由最终用户直接调用。协议的 UI 在 `git send-pack` 端，该程序对旨在用于向远程仓库推送更新。对于拉取操作，请参见 (1)。\n\
  \n该命令允许在远程端创建和快进 sha1 引用（heads/tags）（严格来说，是本地端 `git-receive-pack` 在运行，但对于坐在 send-pack\
  \ 端的用户来说，它正在更新远程。感到困惑？）\n\n\n\n\n\n在 `Documentation/howto` 目录下可以找到其他使用 `update`\
  \ 和 `post-update` 钩子的真实示例。\n\n`git-receive-pack` 遵循 `receive.denyNonFastForwards`\
  \ 配置选项，该选项告诉它如果 ref 的更新不是快进（fast-forwards），则应该拒绝更新。\n\n## OPTIONS\n\n`<directory>`\n\
  \n要同步到的仓库。\n\n## PRE-RECEIVE OK 子\n\n在更新任何 ref 之前，如果 `$GIT_DIR/hooks/pre-receive`\
  \ 文件存在且具有执行权限，它将被调用一次，且不带任何参数。钩子的标准输入是每个要更新的 ref 占一行：\n\n```\nsha1-old SP sha1-new\
  \ SP refname LF\n```\n\n`refname` 值相对于 `$GIT_DIR`；例如，对于 master 头部，其值为 `\"refs/heads/master\"\
  `。每个 `refname` 之前的两个 `sha1` 值是该 `refname` 在更新前后的对象名称。要创建的 ref，其 `sha1-old` 等于 `0{40}`，而要删除的\
  \ ref，其 `sha1-new` 等于 `0{40}`，否则 `sha1-old` 和 `sha1-new` 应该是仓库中的有效对象。\n\n在接受签名推送（见\
  \ (1) 部分）时，签名推送证书被存储在 blob 中，并可以通过环境变量 `GIT_PUSH_CERT` 查询其对象名称。请参见 `post-receive`\
  \ 钩子的描述以获取示例。此外，证书使用 GPG 进行验证，结果通过以下环境变量导出：\n\n`GIT_PUSH_CERT_SIGNER`\n\n签名推送证书的密钥所有者的名称和电子邮件地址。\n\
  \n`GIT_PUSH_CERT_KEY`\n\n签名推送证书的密钥的 GPG 密钥 ID。\n\n`GIT_PUSH_CERT_STATUS`\n\n推送证书的\
  \ GPG 验证状态，使用与 `git log` 系列命令的 `%G?` 格式相同的助记符（见 (1) 部分）。\n\n`GIT_PUSH_CERT_NONCE`\n\
  \n该过程请求签名者包含推送证书的随机数字符串（nonce string）。如果该值与推送证书中 `\"nonce\"` 头部记录的值不匹配，则可能表明该证书是有效的，但正在从另一个\
  \ `\"git push\"` 会话中重放。\n\n`GIT_PUSH_CERT_NONCE_STATUS`\n\n`UNSOLICITED`\n\n`\"\
  git push --signed\"` 在我们没有要求它发送随机数时发送了一个 nonce。\n\n`MISSING`\n\n`\"git push --signed\"\
  ` 没有发送任何 nonce 头部。\n\n`BAD`\n\n`\"git push --signed\"` 发送了伪造的 nonce。\n\n`OK`\n\n\
  `\"git push --signed\"` 发送了我们要求它发送的随机数。\n\n`SLOP`\n\n`\"git push --signed\"` 发送的随机数与我们现在要求发送的不同，但在之前的会话中发送过。请参见\
  \ `GIT_PUSH_CERT_NONCE_SLOP` 环境变量。\n\n`GIT_PUSH_CERT_NONCE_SLOP`\n\n`\"git push\
  \ --signed\"` 发送的随机数与我们现在要求发送的不同，但在另一个会话中，该会话的开始时间与当前会话差这么多秒。仅当 `GIT_PUSH_CERT_NONCE_STATUS`\
  \ 为 `SLOP` 时才有意义。另请阅读 (1) 部分中的 `receive.certNonceSlop` 变量。\n\n此钩子在任何 `refname` 更新之前以及任何快进检查执行之前被调用。\n\
  \n如果 `pre-receive` 钩子以非零状态退出，将不会执行任何更新，且更新、`post-receive` 和 `post-update` 钩子也不会被调用。这对于在不支持该更新时快速退出非常有用。\n\
  \n## UPDATE 钩子\n\n在更新每个 ref 之前，如果 `$GIT_DIR/hooks/update` 文件存在且具有执行权限，它会每个 ref 被调用一次，带有三个参数：\n\
  \n```\n$GIT_DIR/hooks/update refname sha1-old sha1-new\n```\n\n`refname` 参数相对于 `$GIT_DIR`；例如，对于\
  \ master 头部，其值为 `\"refs/heads/master\"`。两个 `sha1` 参数是该 `refname` 在更新前后的对象名称。注意，钩子是在\
  \ `refname` 更新之前调用的，因此 `sha1-old` 要么是 `0{40}`（意味着尚不存在该 ref），要么它应该与 `refname` 中记录的内容匹配。\n\
  \n如果钩子想要不允许更新命名的 ref，则应以非零状态退出。否则，应以零退出。\n\n此钩子的成功执行（零退出状态）并不保证 ref 实际上会被更新，它只是一个前提条件。因此，从此钩子中发送通知（例如电子邮件）并不是好主意。考虑使用\
  \ `post-receive` 钩子。\n\n## POST-RECEIVE 钩子\n\n在所有 ref 更新（或尝试更新）之后，如果任何 ref 更新成功，且\
  \ `$GIT_DIR/hooks/post-receive` 文件存在且具有执行权限，它将被调用一次，且不带任何参数。钩子的标准输入是每个每个成功更新的 ref\
  \ 占一行：\n\n```\nsha1-old SP sha1-new SP refname LF\n```\n\n`refname` 值相对于 `$GIT_DIR`；例如，对于\
  \ master 头部，其值为 `\"refs/heads/master\"`。每个 `refname` 之前的两个 `sha1` 值是该 `refname`\
  \ 在更新前后的对象名称。创建的 ref，其 `sha1-old` 等于 `0{40}`，而被删除的 ref，其 `sha1-new` 等于 `0{40}`，否则\
  \ `sha1-old` 和 `sha1-new` 应该是仓库中的有效对象。\n\n在接受签名推送后，可以像 `pre-receive` 钩子一样检查 `GIT_PUSH_CERT*`\
  \ 环境变量。\n\n使用此钩子可以很容易地生成描述仓库更新的邮件。示例脚本为每个 ref 发送一个邮件，列出推送到仓库的提交，并将签名良好的签名推送的证书记录到日志服务中：\n\
  \n```\n#!/bin/sh # mail out commit update information. while read oval nval ref\
  \ do if expr \"$oval\" : '0*$' >/dev/null then echo \"Created a new ref, with the\
  \ following commits:\" git rev-list --pretty \"$nval\" else echo \"New commits:\"\
  \ git rev-list --pretty \"$nval\" \"^$oval\" fi | mail -s \"Changes to ref $ref\"\
  \ done # log signed push certificate, if any if test -n \"${GIT_PUSH_CERT-}\" &&\
  \ test ${GIT_PUSH_CERT_STATUS} = G then ( echo expected nonce is ${GIT_PUSH_NONCE}\
  \ git cat-file blob ${GIT_PUSH_CERT} ) | mail -s \"push certificate from $GIT_PUSH_CERT_SIGNER\"\
  \ fi exit 0\n```\n\n此钩子调用的退出码被忽略，但非零退出码将生成错误信息。\n\n注意，当此钩子运行时，`refname` 可能没有 `sha1-new`。如果另一个用户在\
  \ `git-receive-pack` 更新 ref 之后但在钩子能够评估它之前修改了该 ref，这种情况很容易发生。建议钩子依赖于 `sha1-new` 而不是\
  \ `refname` 的当前值。\n\n## POST-UPDATE 钩子\n\n在所有其他处理之后，如果至少有一个 ref 被更新了，且 `$GIT_DIR/hooks/post-update`\
  \ 文件存在且具有执行权限，则 `post-update` 将带有已更新的 ref 列表被调用。这可以用于实现任何仓库的清理任务。\n\n此钩子调用的退出码被忽略；此时\
  \ `git-receive-pack` 唯一需要做的事就是直接退出。\n\n此钩子可以用于，例如在仓库已打包并并通过哑传输（dumb transport）提供时，运行\
  \ `update-server-info`。\n\n```\n#!/bin/sh exec update-server-info\n```\n\n## 参见\n\
  \n(1), (7)\n\n* * *\n\n# GIT-REFLOG\n\n## 名称\n\ngit-reflog - 管理 reflog 信息\n\n##\
  \ 语法\n\n*`git reflog`* `<子命令> <选项>`\n\n## 描述\n\n该命令接受不同的子命令，根据子命令有不同的选项：\n\n*`git\
  \ reflog`* `[`*`show`*`] [log-options] [<ref>]` *`git reflog expire`* `[--expire=<time>]\
  \ [--expire-unreachable=<time>] [--rewrite] [--updateref] [--stale-fix] [--dry-run]\
  \ [--verbose] [--all | <refs>...]` *`git reflog delete`* `[--rewrite] [--updateref]\
  \ [--dry-run] [--verbose] ref@{specifier}...`\n\n引用日志（或“reflogs”）记录了分支和其他引用的头部在本地仓库中更新的时间。Reflog\
  \ 在各种 Git 命令中非常有用，用于指定引用的旧值。例如，`HEAD@{2}` 意味着“两个移动之前的 HEAD 位置”，`master@{one.week.ago}`\
  \ 意味着“在本地仓库中上周前的 master 指向位置”，依此类推。更多细节请见 (7)。\n\n此命令管理记录在 reflog 中的信息。\n\n\n\n\n\
  \"show\" 子命令（在没有任何子命令时，这也是默认命令）显示命令行中提供的引用（或默认为 `HEAD`）的日志。reflog（引用日志）涵盖了所有最近的操作，此外，`HEAD`\
  \ reflog 记录了分支切换。`git reflog show` 是 `git log -g --abbrev-commit --pretty=oneline`\
  \ 的别名；更多信息请参见 (1)。\n\n\"expire\" 子命令修剪较旧的 reflog 条目。早于 `expire` 时间的条目，或早于 `expire-unreachable`\
  \ 时间且无法从当前端点（tip）访问的条目将从 reflog 中删除。终端用户通常不直接使用此命令 --- 请参见 (1)。\n\n\"delete\" 子命令用于删除\
  \ reflog 中的单个条目。其参数必须是一个精确的（exact）条目（例如 `git reflog delete master@{2}`）。该子命令通常也不由终端用户直接使用。\n\
  \n## OPTIONS\n\n### show 的选项\n`git reflog show` 接受 `git log` Accept 的任何选项。\n\n###\
  \ expire 的选项\n\n`--all`\n处理所有引用的 reflogs。\n\n`--expire=<time>`\n修剪早于指定时间的条目。如果未指定此选项，过期时间将从配置设置\
  \ `gc.reflogExpire` 获取，该设置默认为 90 天。`--expire=all` 不管多久都修剪条目；`--expire=never` 关闭对可访问条目的修剪（但请\
  \ `--expire-unreachable`）。\n\n`--expire-unreachable=<time>`\n修剪早于 `<time>` 且无法从分支当前端点访问的条目。如果未指定此选项，过期时间将从配置设置\
  \ `gc.reflogExpireUnreachable` 获取，该设置默认为 30 天。`--expire-unreachable=all` 不管多久都修剪不可访问的条目；`--expire-unreachable=never`\
  \ 关闭对不可访问条目的早期修剪（但请 `--expire`）。\n\n`--updateref`\n如果上一个顶部条目被修剪，则将引用更新为新的顶部 reflog\
  \ 条目的值（即 `<ref>@{0}`）（此选项对符号引用会被忽略）。\n\n`--rewrite`\n如果 reflog 条目的前驱节点被修剪，则将其“旧”\
  \ SHA-1 调整为与其现在在其之前的条目的“新” SHA-1 字段相等。\n\n`--stale-fix`\n修剪任何指向“损坏提交”的 reflog 条目。损坏的提交是指无法从任何引用端点访问，且直接或间接引用缺失的提交、树（tree）或二进制（blob）对象的提交。\n\
  \n此计算涉及遍历所有可访问的对象，即代价与 `git prune` 相同。它主要用于修复使用旧版本 Git 进行垃圾回收引起的损坏，旧版本不会保护被 reflog\
  \ 引用的对象。\n\n`-n, --dry-run`\n不实际修剪任何条目；仅显示将要修剪的目。\n\n`--verbose`\n在屏幕上打印额外信息。\n\n\
  ### delete 的选项\n`git reflog delete` 接受选项 `--updateref`、`--rewrite`、`-n`、`--dry-run`\
  \ 和 `--verbose`，其含义与用于 `expire` 时相同。\n\n***\n\n# GIT-RELINK\n\n## NAME\n`git-relink`\
  \ - 在本地仓库中对公共对象建立硬链接\n\n## SYNOPSIS\n`git relink [--safe] <dir>... <master_dir>`\n\
  \n## DESCRIPTION\n这将扫描 1 个或多个对象仓库，并寻找与主仓库共同拥的对象。尚未与主仓库建立硬链接的对象将被替换为指向主仓库的硬链接。\n\n\
  ## OPTIONS\n`--safe`\n如果存在两个哈希相同但大小不同的对象，则停止。默认行为是警告并继续。\n\n`<dir>`\n包含 `.git/objects/`\
  \ 子目录的目录。\n"
