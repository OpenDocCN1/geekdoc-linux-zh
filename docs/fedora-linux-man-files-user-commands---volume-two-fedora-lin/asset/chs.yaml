  \ `firewalld.zone`(5), `firewalld.zones`(5) \n\n## Notes\n\nfirewalld 主页：\n\nm[blue]`http://www.firewalld.org`m[]\n\
  \n更多带有示例的文档：\n\nm[blue]`http://fedoraproject.org/wiki/FirewallD`m[]\n\n## 作者\n\n\
  **Thomas Woerner** <twoerner@redhat.com>\n\n开发者\n\n**Jiri Popelka** <jpopelka@redhat.com>\n\
  \n开发者\n\n* * *\n\n# FIREWALLD\n\n## 名称\n\nfirewalld - 动态防火墙管理器 \n\n## 概要\n\n`firewalld`\
  \ `[OPTIONS...]`\n\n## 描述\n\nfirewalld 提供了一个动态管理的防火墙，支持通过网络/防火墙区域（zones）来定义网络连接或接口的信任级别。它支持\
  \ IPv4、IPv6 防火墙设置以及以太网桥接，并将运行时配置和永久配置选项分离。它还支持服务或应用程序直接添加防火墙规则的接口。\n\n### 选项\n\n\
  这些是 firewalld 的命令行选项：\n\n`-h`, `--help`\n\n打印简短帮助文本并退出。\n\n`--debug`=`level]`\n\n\
  将 firewalld 的调试级别设置为 `level`。调试级别的范围从 1（最低级别）到 10（最高级别）。调试输出将被写入 firewalld 日志文件\
  \ `/var/log/firewalld`。\n\n`--debug-gc`\n\n打印垃圾回收器泄漏信息。收集器每 10 秒运行一次，如果有泄漏，将打印有关泄漏的信息。\n\
  \n`--nofork`\n\n关闭守护进程派叉。强制 firewalld 作为前台进程运行，而不是作为后台守护进程。\n\n`--nopid`\n\n禁用写入\
  \ pid 文件。默认情况下，程序会写入 pid 文件。如果使用此选项调用程序，它将不会检查已存在的服务器进程。\n\n## 概念\n\nfirewalld 有一个\
  \ D-Bus 接口用于服务和应用程序的防火墙配置。它还为用户提供命令行客户端。已使用 D-Bus 的服务或应用程序可以通过 D-Bus 接口直接请求防火墙。有关\
  \ firewalld D-Bus 接口的更多信息，请参阅 `firewalld.dbus`(5)。\n\nfirewalld 支持区域、预定义服务和 ICMP\
  \ 类型，并将运行时和永久配置选项分离。永久配置从 `/usr/lib/firewalld` 或 `/etc/firewalld` 中的 XML 文件加载（参见“目录”章节）。\n\
  \n如果没有使用 NetworkManager，则存在一些局限性：firewalld 将无法获取网络设备重名的通知。如果 firewalld 在网络启动后启动，连接和手动创建的接口将不会绑定到区域。你可以通过\
  \ `firewall-cmd [--permanent] --zone=zone --add-interface=interface` 将它们添加到区域，但请确保如果存在\
  \ `/etc/sysconfig/network-scripts/ifcfg-*interface`，其中指定的 `ZONE=zone` 区域是相同的（或者默认区域都为空/缺失），否则行为将未定义。\n\
  \n### 区域 (Zones)\n\n网络或防火墙区域定义了用于连接的接口的信任级别。firewalld 提供了多个预定义区域。区域配置选项和关于区域的通用信息在\
  \ `firewalld.zone`(5) 中描述。\n\n### 服务 (Services)\n\n可以是本地端口和目的地的列表，此外当启用服务时自动加载的防火墙辅助模块列表。服务配置选项和关于服务的通用信息在\
  \ `firewalld.service`(5) 中描述。使用预定义服务使用户户更容易启用和禁用对某个服务的访问。\n\n### ICMP 类型 (ICMP types)\n\
  \n互联网控制消息协议 (ICMP) 用于在互联网协议 (IP) 中交换信息和错误消息。ICMP 类型可用于 firewalld 以限制此类消息的交换。欲了解更多信息，请参阅\
  \ `firewalld.icmptype`(5)。\n\n### 运行时配置 (Runtime configuration)\n\n运行时配置是实际生效的配置，不是永久的。在服务加载/重启或系统重启后，如果运行时设置未包含永久配置中，它们将会消失。\n\
  \n### 永久配置 (Permanent configuration)\n\n永久配置存储在配置文件中，并在每次机器启动或服务加载/重启时加载并成为新的运行时配置。\n\
  \n### 直接接口 (Direct interface)\n\n直接接口主要用于服务或应用程序添加特定的防火墙规则。它需要具备 ip(6)tablesset\
  \ 的基本知识（表、链、命令、参数、目标）。\n\n## 目录 (DIRECTORIES)\n\nfirewalld 支持两个配置目录： \n\n### `/usr/lib/firewalld`\
  \ 中的默认/回备配置\n\n此目录包含 firewalld 为 icmptypes、服务和区域提供的默认和回备配置。firewalld 包提供的文件不应被更改，更改在更新\
  \ firewalld 包后将消失。可以提供额外的 `icmptypes`、`services` 和 `zones`。\n\n### `/etc/firewalld`\
  \ 中的系统配置\n\n存储在此处的系统配置由系统管理员或用户创建。这些文件将覆盖默认配置。\n\n## 信号 (SIGNALS)\n\n目前仅支持 SIGHUP。\n\
  \n### SIGHUP\n\n重新加载完整配置。你也可以使用 `firewall-cmd --reload`。所有运行时设置将根据配置文件定义的选项进行恢复。\n\
  \n## 参见 (SEE ALSO)\n\n`firewall-applet`(1), `firewalld`(1), `firewall-cmd`(1), `firewall-config`(1),\
  \ `firewalld.conf`(5), `firewalld.direct`(5), `firewalld.icmptype`(5), `firewalld.lockdown-whitelist`(5),\
  \ `firewall-offline-cmd`(1), `firewalld.richlanguage`(5), `firewalld.service`(5),\
  \ `firewalld.zone`(5), `firewalld.zones`(5) \n\n\n\n\n当使用 `-n` 选项且存在冲突锁，或使用 `-w`\
  \ 选项且达到超时时间时所使用的退出码。默认值为 `1`。\n\n`-e`, `-x`, `--exclusive`\n\n获取排他锁，有时也称为写锁。这是默认选项。\n\
  \n`-n`, `--nb`, `--nonblock`\n\n如果无法立即获取锁，则失败而不是等待。查看 `-E` 选项了解使用的退出码。\n\n`-o`,\
  \ `--close`\n\n在执行 `command` 之前关闭持有锁的文件描述符。如果 `command` 产生了一个不应持有锁的子进程，则此用非常有用。\n\
  \n`-s`, `--shared`\n\n获取共享锁，有时也称为读锁。\n\n`-u`, `--unlock`\n\n释放锁。这通常不需要，因为锁在文件关闭时会自动释放。然而，在特殊情况下可能需要这样做，例如，如果包含的命令组可能派生了一个不应持有锁的后台进程。\n\
  \n`-w`, `--wait`, `--timeout` `seconds`\n\n如果在 `seconds` 内无法获取锁，则失败。允许使用小数分值。查看\
  \ `-E` 选项了解使用的退出码。`seconds` 的数字 0 被解释为 `--nonblock`。\n\n`--verbose`\n\n报告获取锁所需的时间，或者为什么无法获取锁。\n\
  \n`-V`, `--version`\n\n显示版本信息并退出。\n\n`-h`, `--help`\n\n显示帮助文本并退出。\n\n## EXAMPLES\n\
  \n```\nshell1> flock /tmp -c cat\n```\n\n```\nshell2> flock -w .007 /tmp -c echo;\
  \ /bin/echo $? 为目录 /tmp 设置了排他锁，第二个命令将失败。\n```\n\n```\nshell1> flock -s /tmp -c cat\n\
  ```\n\n```\nshell2> flock -s -w .007 /tmp -c echo; /bin/echo $? 为目录 /tmp 设置了共享锁，第二个命令不会失败。注意，尝试用第二个命令获取排他锁将失败。\n\
  ```\n\n```\nshell> flock -x local-lock-file echo 'a b c'\n```\n\n在运行带有 'a b c' 的\
  \ echo 之前，获取排他锁 \"local-lock-file\"。\n\n```\n(\n  flock -n 9 || exit 1\n  # ...\
  \ 在锁下执行的命令 ... ) 9>/var/lock/mylockfile\n```\n\n这种形式在 shell 脚本内部非常方便。打开文件的模式对 `flock`\
  \ 来说并不重要；使用 `>` 或 `>>` 允许在锁文件不存在时创建它，然而，这需要写权限。使用 `<` 则要求文件已存在，但只需要读权限。\n\n```\n\
  [ \"${FLOCKER}\" != \"$0\" ] && exec env FLOCKER=\"$0\" flock -en \"$0\" \"$0\"\
  \ \"$@\" || :\n```\n\n这是 shell 脚本中非常有用的样板代码。将其置于想要锁定的 shell 脚本的顶部，它将在首次运行时自动锁定自己。如果环境变\
  \ `$FLOCKER` 未被设置为正在运行的 shell 脚本，则执行 `flock` 并获取一个排他非阻塞锁（使用脚本本身作为锁文件），然后使用正确的参数重新执行自身。它还会将\
  \ `FLOCKER` 环境变量设置为正确的值，以确保它不会再次运行。\n\n## EXIT STATUS\n\n（退出状态）\n\n该命令对所有情况都使用 `sysexits.h`\
  \ 返回值，但使用选项 `-n` 或 `-w` 时除外，它们会通过 `-E` 选项提供的返回值报告获取锁失败，默认值为 `1`。\n\n当使用 `command`\
  \ 变体且执行子命令成功时，退出状态即为子命令的退出状态。\n\n## AUTHOR（作者）\n\nH. Peter Anvin\n\n## COPYRIGHT（版权）\n\
