  `import` *FILE-NAME* [`replace`] [`nometa`]\n\n从扁平转储文件 *FILE-NAME* 导入数据。如果提供了 `replace`\
  \ 参数，则与现有记录具有相同键的任何记录将被替换。`nometa` 参数将关闭从转储文件中恢复元信息。\n\n`list`\n\n列出数据库的内容。\n\n\
  `next` [*KEY*]\n\n顺序访问：获取并显示下一条记录。如果提供了 *KEY*，则将获取该键记录之后的下一条记录。\n\n`open` *FILE*\n\
  \n打开数据库文件 *FILE*。如果成功，将关闭任何之前打开的数据库。否则，如果操作失败，则当前打开的数据库将保持不变。\n\n此命令从变量 `open`、`lock`、`mmap`\
  \ 和 `sync` 中获取额外信息。详细描述这些变量请参见 `VARIABLES` 。\n\n`quit`\n\n关闭数据库并退出实用程序。\n\n`reorganize`\n\
  \n重组数据库。`set` [*VAR*=*VALUE*...]。如果不带参数，则列出变量及其值。如果指定了参数，则设置变量。布尔变量可以通过指定变量名（可选前缀为\
  \ `no`）来设置为 `false`。\n\n`source` *FILE*\n\n从给定的 *FILE* 读取命令。\n\n`status`\n\n打印当前程序状态。\n\
  \n`store` *KEY* *DATA*\n\n在数据库中根据给定的 *KEY* 存储 *DATA*。如果 *KEY* 已经存在，其数据将被替换。\n\n\
  `unset` *VARIABLE*...\n\n取消列出的变量。\n\n`version`\n\n打印 `gdbm` 的版本。\n\n## 数据定义\n\n\
  `define` 语句提供了一种定义键或内容结构的机制。它类似于 `C` 语言的 `struct` 声明：\n\n```\n`define``key`|`content`{`defnlist`}\n\
  ```\n\n*defnlist* 是成员声明的逗分隔列表。在 *defnlist* 中，换行符丢失了作为命令终止符的特殊含义，因此每个声明可以单独出现，并且可以插入任意数量的注释来记录该定义。\n\
  \n每个声明具有以下格式之一：\n\n*`type``name``type``name`[`[`N`]`\n\n其中 *type* 是数据类型，*name* 是成员名。第二种格式将成员\
  \ *name* 定义为由 *N* 个 *type* 元素组成的数组。\n\n支持的类型有：\n\n`type meaning char 单字节（有符号）short\
  \ 有符号短整数 ushort 无符号短整数 int 有符号整数 unsigned 无符号整数 uint 同上 long 有符号长整数 ulong 无符号长整数\
  \ llong 有符号长长整数 ullong 无符号长整数 float 浮点数 double 双精度浮点数 string 字符数组（见下文 `NOTE`）stringz\
  \ 零终止字符字符串`\n\n在 *defnlist* 中可以使用以下对齐声明：\n\n`offset` *N*\n\n下一个成员从偏移量 *N* 开始。\n\n\
  `pad` *N*\n\n在上一个成员后添加 *N* 字节的填充。\n\n例如：\n\n```\n`define content { int status, pad\
  \ 8, char id[3], stringz name }`\n```\n\n要定义一个由单个数据成员组成的数据，可以使用以下简化的构造：\n\n```\n\
  `define``key`|`content`*type*\n```\n\n其中 *type* 是上述类型之一。\n\n**NOTE**：只有当 `string`\
  \ 类型是数据结构的最后一个或唯一成员时，才能合理地使用它。因为没有提供关于数组中元素数量的信息，因此被解释为包含到数据项结束的所有字节。\n\n## 变量\n\
  \n`confirm`，布尔值\n\n在执行某些破坏性操作（如截断现有数据库）之前是否请求确认。默认值为 `true`。\n\n`ps1`，字符串\n\n主提示符字符串。其值可以包含*转换规范符*，由\
  \ `%` 字符后跟另一个字符组成。这些规范符在生成的提示符中的展开方式如下：\n\n```\n序列扩展 %f (数据库文件名) %p (程序名) %P (包名\
  \ (gdbm)) %_ (水平空格 (ASCII 32)) %v (程序版本) %%\n```\n\n默认提示符为 `%p>%_`。\n\n`ps2`，字符串\n\
  \n次要提示符。关于其值的描述请参见 `ps1`。此提示符会在读取多行命令的第二行及后续行之前显示。\n\n默认值为 `%_>%_`。\n\n`delim1`，字符串\n\
  \n用于在输出时分隔结构化数据字段的字符串（参见 `DATA DEFINITIONS` 节）。默认是 `,`（逗号）。此变量无法取消。\n\n`delim2`，字符串\n\
  \n在打印结构化数据时用于分隔数组项的字符串。默认是 `,`（逗号）。此变量无法取消。\n\n`pager`，字符串\n\n将输出管道到分页器程序的名称和命令行。当估计的输出行数大于屏幕行数时，在交互模式使用此程序。\n\
  \n默认值继承自环境变量 `PAGER`。取消此变量将禁用分页。\n\n`quiet`，布尔值\n\n启动时是否显示欢迎横幅。此变量应设置在启动脚本文件中。\n\
  \n以下变量控制数据库的运行方式：\n\n`cachesize`，数值\n\n设置缓存大小。默认未设置。\n\n`blocksize`，数值\n\n设置块大小。\n\
  \n`open`，字符串\n\n打开模式。允许以下值：\n\n`newdb`\n\n截断数据库或创建一个新数据库。以读写模式打开它。\n\n`wrcreat`\
  \ 或 `rw`\n\n以读写模式打开数据库。如果不存在则创建它。\n\n`reader` 或 `readonly`\n\n以只读模式打开数据库。如果不存在则产生错误。\n\
  \n`lock`，布尔值\n\n锁定数据库。这是默认值。`mmap`，布尔值\n\n使用内存映射。这是默认值。\n\n## 参见\n\n(1), (3)。\n\n\
  ### 报告缺陷\n\n向 <> 报告错误。\n\n## 版权\n\nCopyright 2013 Free Software Foundation\n\n许可\
  \ GPLv3+: GNU GPL 版本 3 它是自由软件：你可以自由地更改和分发它。在法律允许范围内不提供任何保证。\n\n*\n\n# GDBUS\n\n\
  ## 名称\n\ngdbus - 用于 D-Bus 对象的工具\n\n## 语法\n\n`gdbus` introspect [--system | --session\
  \ | --address*] --dest*bus_name* --object-path*/path/to/object* [--xml] [--recurse]\
  \ [--only-properties]\n\n`gdbus` monitor [--system | --session | --address*] --dest*bus_name*\
  \ --object-path*/path/to/object*]\n\n`gdbus` call [--system | --session | --address*]\
  \ --dest*bus_name* --object-path*/path/to/object* --method*org.project.InterfaceName.MethodName*\
  \ [--timeout*seconds*] ARG1 ARG2...\n\n`gdbus` emit [--system | --session | --address*]\
  \ --object-path*/path/to/object* --signal*org.project.InterfaceName.SignalName*\
  \ [--dest*unique_bus_name*] ARG1 ARG2...\n\n`gdbus` help\n\n## 描述\n\n**gdbus**\n\
  \n是一个用于 D-Bus 对象的简单工具。\n\n## 命令\n\n**introspect**\n\n打印远程对象的接口和属性值。要使此功能工作，所有者需要实现\
  \ org.freedesktop.DBus.Introspectable 接口。如果使用了 `--xml` 选项，则打印返回的探测 XML，否则打印解析后的精美表示。`--recurse`\
  \ 选项可以用于探测子对象（及其子对象等），`--only-properties` 选项可以只打印带有属性的接口。\n\n**monitor** 监控 *bus_name*\
  \ 拥有的一个或所有对象。\n\n**call** 调用远程对象的方法。传递给方法的每个参数都必须指定为序列化的 **GVariant**，但字符串不需要显式引号。返回值将作为序列化的\
  \ **GVariant** 值打印出来。\n\n**emit** 发射信号。包含在信号中的每个参数都必须指定为序列化的 **GVariant**，但字符串不需要显式引号。\n\
  \n**help** 显示帮助。\n\n\n\n打印帮助并退出。\n\n## BASH 填充\n\n`gdbus` 自带一个 bash 填充脚本，用于完成命令、目的地、总线名称、对象路径以及接口/方法名称。\n\
  \n## 示例\n\n这展示了如何对对象进行自省 - 注意每个属性的值都会被显示：\n\n```\n$ gdbus introspect --system \\\
  \ --dest org.freedesktop.NetworkManager \\ --object-path /org/freedesktop/NetworkManager/Devices/0\
  \ node /org/freedesktop/NetworkManager/Devices/0 { interface org.freedesktop.DBus.Introspectable\
  \ { methods: Introspect(out s data); }; interface org.freedesktop.DBus.Properties\
  \ { methods: Get(in s interface, in s propname, out v value); Set(in s interface,\
  \ in s propname, in v value); GetAll(in s interface, out a{sv} props); }; interface\
  \ org.freedesktop.NetworkManager.Device.Wired { signals: PropertiesChanged(a{sv}\
  \ arg_0); properties: readonly b Carrier = false; readonly u Speed = 0; readonly\
  \ s HwAddress = '00:1D:72:88:BE:97'; }; interface org.freedesktop.NetworkManager.Device\
  \ { methods: Disconnect(); signals: StateChanged(u arg_0, u arg_1, u arg_2); properties:\
  \ readonly u DeviceType = 1; readonly b Managed = true; readwrite o Ip6Config =\
  \ '/'; readwrite o Dhcp4Config = '/'; readwrite o Ip4Config = '/'; readonly u State\
  \ = 2; readwrite u Ip4Address = 0; readonly u Capabilities = 3; readonly s Driver\
  \ = 'e1000e'; readwrite s Interface = 'eth0'; readonly s Udi = '/sys/devices/pci0000:00/0000:00-19.0/net/eth0';\
  \ }; };\n```\n\n当想要检查特定进程拥的所有对象时，`--recurse` 和 `--only-properties` 选项非常有用：\n\n```\n\
  $ gdbus introspect --system --dest org.freedesktop.UPower --object-path / --recurse\
  \ --only-properties node / { node /org { node /org/freedesktop { node /org/freedesktop/UPower\
  \ { interface org.freedesktop.UPower { properties: readonly b IsDocked = true; readonly\
  \ b LidForceSleep = false; readonly b LidIsPresent = false; readonly b LidIsClosed\
  \ = false; readonly b OnLowBattery = false; readonly b OnBattery = false; readonly\
  \ b CanHibernate = true; readonly b CanSuspend = true; readonly s DaemonVersion\
  \ = '0.9.10'; }; node /org/freedesktop/UPower/Policy { }; node /org/freedesktop/UPower/Wakeups\
  \ { interface org.freedesktop.UPower.Wakeups { properties: readonly b HasCapability\
  \ = true; }; }; }; }; }; };\n```\n\n同样，可以使用 `introspect` 命令来学习关于 `Notify` 方法的细节：\n\
  \n```\n[...] interface org.freedesktop.Notifications { methods: GetServerInformation(out\
  \ s return_name, out s return_vendor, out s return_version, out s return_spec_version);\
  \ GetCapabilities(out as return_caps); CloseNotification(in u id); Notify(in s app_name,\
  \ in u id, in s icon, in s summary, in s body, in as actions, in a{sv} hints, in\
  \ i timeout, out u return_id); }; [...]\n```\n\n有了这些信息，很容易使用 `call` 命令来显示通知：\n\n\
  ```\n$ gdbus call --session \\ --dest org.freedesktop.Notifications \\ --object-path\
  \ /org/freedesktop/Notifications \\ --method org.freedesktop.Notifications.Notify\
  \ \\ my_app_name \\ 42 \\ gtk-dialog-info \\ \"The Summary\" \\ \"Here's the body\
  \ of the notification\" \\ [] \\ {} \\ 5000 (uint32 12,)\n```\n\n监控服务上的所有对象：\n\n\
  ```\n$ gdbus monitor --system --dest org.freedesktop.ConsoleKit Monitoring signals\
  \ from all objects owned by org.freedesktop.ConsoleKit The name org.freedesktop.ConsoleKit\
  \ is owned by :1.15 /org/freedesktop/ConsoleKit/Session2: org.freedesktop.ConsoleKit.Session.ActiveChanged\
  \ (false,) /org/freedesktop/ConsoleKit/Seat1: org.freedesktop.ConsoleKit.Seat.ActiveSessionChanged\
  \ ('',) /org/freedesktop/ConsoleKit/Session2: org.freedesktop.ConsoleKit.Session.ActiveChanged\
  \ (true,) /org/freedesktop/ConsoleKit/Seat1: org.freedesktop.ConsoleKit.Seat.ActiveSessionChanged\
  \ ('/org/freedesktop/ConsoleKit/Session2',)\n```\n\n监控服务上的单个对象：\n\n```\n$ gdbus\
  \ monitor --system --dest org.freedesktop.NetworkManager --object-path /org/freedesktop/NetworkManager/AccessPoint/4141\
  \ Monitoring signals on object /org/freedesktop/NetworkManager/AccessPoint/4141\
  \ owned by org.freedesktop.NetworkManager The name org.freedesktop.NetworkManager\
  \ is owned by :1.5 /org/freedesktop/NetworkManager/AccessPoint/4141\n```\n\n\n\n\
  \n这些选项在输出私钥之前使用指定的加密算法对私钥进行加密。系统会提示输入密码。如果未指定这些选项，则不使用加密。\n\n`-rand file(s)`\n\n\
  一个包含随机数据的文件或多个文件，用于初始化随机数生成器，或者一个 EGD 套字（见 (3)）。可以使用依赖于系统的字符分隔多个文件。MS-Windows 使用\
  \ `;` 作为分隔符，OpenVMS 使用 `,`，其他所有系统使用 `:`。\n\n`-engine id`\n\n指定一个引擎（通过其唯一的 `id` 字符串）将使\
  \ `gendsa` 尝试获取指定引擎的功能引用，从而在需要时对其进行初始化。随后，该引擎将设置为所有可用算法的默认引擎。\n\n`paramfile`\n\n\
  此选项指定要使用的 DSA 参数文件。文件中的参数决定了私钥的大小。可以使用 `openssl dsaparam` 命令生成和检查 DSA 参数。\n\n##\
  \ Notes\n\nDSA 密钥的生成仅仅是些随机数生成，因此比 RSA 密钥的生成快得多。\n\n## 另参\n\n(1), (1), (1), (1)\n\
  \n***\n\n# GENHOSTID\n\n## 名称\n\n`genhostid` - 为当前主机生成并设置主机 ID (hostid)\n\n## 语法\n\
  \n`genhostid`\n\n## 描述\n\n`genhostid` 生成随机主机 ID，如果 `/etc/hostid` 不存在，则将其存储在 `/etc/hostid`。\n\
  \n## 另参\n\n(1), (2), (2)\n\n***\n\n# GENISOIMAGE\n\n## 名称\n\n`genisoimage` - 创建带有可选\
  \ Rock Ridge 属性的 ISO9660/Joliet/HFS 文件系统\n\n## 语法\n\n`genisoimage` [-options] [-o\
  \ filename] `pathspec` [`pathspec ...`]\n\n## 描述\n\n`genisoimage` 是一个用于生成 ISO9660/Joliet/HFS\
  \ 混合文件系统的预制程序。\n\n`genisoimage` 能够生成`Rock Ridge 交换协议`指定的`系统使用共享协议记录 (SUSP)`。这被用于向\
  \ Unix 主机进一步描述 ISO9660 文件系统中的文件，并提供如长文件名、UID/GID、POSIX 权限、符号链接以及块和字符设备文件等信息。\n\n\
  如果指定了 Joliet 或 HFS 混合命令行选项，`genisoimage` 将为 Joliet 或 HFS 创建额外的文件系统元数据。否则，`genisoimage`\
  \ 将生成一个纯 ISO9660 文件系统。\n\n`genisoimage` 可以生成真实的（或共享的）HFS 混合文件系统。当从 Macintosh 访问时，相同的文件视为\
  \ HFS 文件；从其他机器访问时则视为 ISO9660 文件。HFS 代表 `Hierarchical File System`（分级文件系统），是 Macintosh\
  \ 上使用的原生文件系统。\n\n作为替代，`genisoimage` 可以为每个文件生成`ISO9660 Apple 扩展`。这些扩展在 Macintosh\
  \ 上访问时为每个文件提供 CREATOR、TYPE 和某些 Finder 标志。见下文的 `HFS MACINTOSH FILE FORMATS` 节。\n\n\
  `genisoimage` 对给定的目录树进行快照，并生成二进制镜像，该镜像在写入块设备时将对应于 ISO9660 和/或 HFS 文件系统。\n\n写入 ISO9660\
  \ 文件系统的每个文件必须具有 8.3 格式的文件名（最多 8 个字符、点号、最多 3 个字符，全部大写），即使在使用 Rock Ridge 的如此。此文件名用于无法利用\
  \ Rock Ridge 扩展的系统（如 MS-DOS），且每个目录中的每个文件名必须与该目录的其他文件名不同。`genisoimage` 通常会尝试通过强制将\
  \ Unix 文件名转换为大写并根据需要截断来形成正确的名称，但当截断后的名称不完全唯一时，通常会产生不人意的结果。`genisoimage` 为每个文件名分配权重，如果发现两个其他情况下相同的名称，则将优先级较低的名称重命名为包含一个\
  \ 3 位数的名称（保证是唯一的）。例如，两个文件 `foo.bar` 和 `foo.bar.~1~` 可能会被渲染为 `FOO.BAR;1` 和 `FOO000.BAR;1`。\n\
  \n当配合各种 HFS 选项使用时，`genisoimage` 将尝试识别存储在多种 Apple/Unix 文件格式中的文件，并复制数据、资源叉以及任何相关的\
  \ Finder 信息。关于 `genisoimage` 支持的格式的更多信息，请见下文的 `HFS MACINTOSH FILE FORMATS` 节。\n\n\
  注意 `genisoimage` 设计并不是为了直接与写入器通信。大多数写入器具有随制造商而不同的专有指令集，你需要专门的工具来实际刻录光盘。`wodim` 是此类工具之一。最新版本的\
  \ `wodim` 可从 获取。\n\n`pathspec` 是要拷贝到 ISO9660 文件系统的目录树路径。可以指定多个路径，`genisoimage` 将合并所有指定路径组件中找到的文件以形成文件系统镜像。\n\
  \n如果指定了 `-graft-points` 选项，则可以在根目录以外的点上嫁接路径，并以与源文件系统不同的名称将文件或目录嫁接到 CD-ROM 镜像上。用几个例子来说明最为简单。假设本地文件\
  \ `../old.lis` 存在，你想包含它。`../old.lis`\n\n`foo/bar=../old.lis`\n\n将包含 `old.lis`。`foo/bar=../old.lis`\n\
  \n`foo/bar=../old.lis`\n\n将 `old.lis` 包含在光盘镜像中。`genisoimage` 将嫁接点在光盘镜像上创建目录。默认情况下，创建的目录权限为\
  \ 0555，所有者为运行 `genisoimage` 的用户。如果你希望其他权限或所有者，请见 `-uid`、`-gid`、`-dir-mode`、`-file-mode`\
  \ 和 `-new-dir-mode`。在 Windows 上编译的 也可以在 Windows 上运行。因此此手册中大多数对 Unix 的引用可以替换为 *.\n\
  \n### 选项\n\n多个选项可以作为默认指定 `.genisoimagerc` 配置文件，也可以位于命令行。如果在两个地方都指定了参数，则使用命令行的设置。有关此文件的格式和可能的位置，请见\
  \ (5)。\n\n`-abstract file`\n\n指定抽象文件名。空间为 37 个字符。等于 `.genisoimagerc` 中的 `ABST`。\n\
  \n`-A application_id`\n\n`-appid application_id`\n\n指定写入卷头的文本字符串。这应该描述将位于光盘上的应用程序。空间为\
  \ 128 个字符。等于 `.genisoimagerc` 中的 `APPI`。\n\n`-allow-limited-size`\n\n当处理大于 2GiB\
  \ 且无法在 ISO9660 中轻松表示的文件时，以缩小的可见文件大小添加到 ISO9660，并以正确的可见文件大小添加到 UDF 系统。结果是不一致的文件系统，用户需要确保他们确实使用\
  \ UDF 而不是 ISO9660 驱动程序来读取此类磁盘。意味着启用 `-udf.`\n\n`-allow-leading-dots`\n\n`-ldots`\n\
  \n允许 ISO9660 文件名以点开头。通常，领先点会被替换为下划线以保持与 MS-DOS 的兼容性。\n\n`-allow-lowercase`\n\n此选项允许在\
  \ ISO9660 文件名中出现小写字母。这违反了 ISO9660 标准，但在某些系统上有效。请谨慎使用。\n\n`-allow-multidot`\n\n此选项允许\
  \ ISO9660 文件名中出现多个点。领先点不受此选项影响，它可以单独通过 `-allow-leading-dots` 允许。\n\n\n\n\n\n这违反了\
  \ ISO9660 标准，但在许多系统上恰好有效。请谨慎使用。\n\n### `-biblio` `file`\n\n指定参考文献文件名。有 37 个字符的空间。等同于\
  \ `.genisoimagerc` 文件中的 `BIBL`。\n\n### `-cache-inodes`\n\n### `-no-cache-inodes`\n\
  \n启用或禁用缓存索引节点（inode）和设备号，以查找文件的硬链接。如果 `genisoimage` 发现硬链接（具有多个名称的文件），则该文件在 CD 上也会被硬链接，因此文件内容只会出现一次。这有助于节省空间。在\
  \ Unix 类操作系统上，`-cache-inodes` 是默认选项，但在某些其他系统（如 Cygwin）上，`-no-cache-inodes` 是默认选项，因为假设这些系统上的\
  \ inode 节点号是唯一的是不安全的。（某些 Cygwin 版本使用弱哈希算法创建伪造 inode 节点号，这可能会产生重复。）如果两个文件的 inode\
  \ 节点号相同但它们不是指向同一个文件的硬链接，则 `genisoimage -cache-inodes` 的行为将不正确。`-no-cache-inodes`\
  \ 在所有情况下都是安全的，但在那种情况下 `genisoimage` 无法检测硬链接，因此生成的 CD 镜像可能比需要的大。\n\n### `-alpha-boot`\
  \ `alpha_boot_image`\n\n指定在制作 Alpha/SRM 可引导 CD 时使用的引导镜像的路径和文件名。路径名必须相对于为 `genisoimage`\
  \ 指定的源路径。\n\n### `-hppa-bootloader` `hppa_bootloader_image`\n\n指定在制作 HPPA 可引导 CD\
  \ 时使用的引导镜像的路径和文件名。路径名必须相对于为 `genisoimage` 指定的源路径。还需要其他选项，至少需要一个内核文件名和一个引导命令行。更多信息请参阅下方的\
  \ `HPPA NOTES` 章节。\n\n### `-hppa-cmdline` `hppa_boot_command_line`\n\n指定在制作可引导 CD\
  \ 时传递给 HPPA 引导加载程序的命令行。使用空格或逗号分隔参数。必须向 `genisoimage` 传递更多选项，至少需要一个内核文件名和一个 引导加载程序文件名。更多信息请参阅下方的\
  \ `HPPA NOTES` 章节。\n\n### `-hppa-kernel-32` `hppa_kernel_32`\n\n### `-hppa-kernel-64`\
  \ `hppa_kernel_64`\n\n指定在制作 HPPA 可引导 CD 时使用的 32 位和/或 64 位内核镜像的路径和文件名。路径名必须相对于为 `genisoimage`\
  \ 指定的源路径。还需要其他选项，至少需要引导加载程序文件名和引导命令行。更多信息请参阅下方的 `HPPA NOTES` 章节。\n\n### `-hppa-ramdisk`\
  \ `hppa_ramdisk_image`\n\n指定在制作 HPPA 可引导 CD 时使用的内存盘（ramdisk）镜像的路径和文件名。路径名必须相对于为\
  \ `genisoimage` 指定的源路径。此参数是可选的。还需要其他选项，至少需要一个内核文件名和一个引导命令行。更多信息请参阅下方的 `HPPA NOTES`\
  \ 章节。\n\n### `-mips-boot` `mips_boot_image`\n\n指定在制作 SGI/大端序 MIPS 可引导 CD 时使用的引导镜像的路径和文件名。路径名必须相对于为\
  \ `genisoimage` 指定的源路径。此选项可以指定多次，以存储多达 15 个引导镜像。\n\n### `-mipsel-boot` `mipsel_boot_image`\n\
  \n指定在制作 DEC/小端序 MIPS 可引导 CD 时使用的引导镜像的路径和文件名。路径名必须相对于为 `genisoimage` 指定的源路径。\n\n\
  ### `-B` `img_sun4,img_sun4c,img_sun4m,img_sun4d,img_sun4e`\n\n### `-sparc-boot`\
  \ `img_sun4,img_sun4c,img_sun4m,img_sun4d,img_sun4e`\n\n指定用于制作 SPARC 系统可引导 CD 的引导镜像列表，并用逗号分隔。分区\
  \ 0 用于 ISO9660 镜像，第一个镜像文件映射到分区 1。逗号分隔的列表最多可以有 7 个字段，包括空字段。制作 Sun SPARC 的可引导 CD 需要此选项。如果指定了\
  \ `-B` 或 `-sparc-boot`，生成的镜像的第一个扇区将包含一个 Sun 磁盘标签。该磁盘标签为 ISO9660 镜像指定分区 0，并为此选项指定的引导镜像指定分区\
  \ 1 到 7。每个附加引导镜像内的 512 到 8191 字节偏移处必须包含适用于相应 SPARC 架构的主引导程序。镜像的其余部分通常包含用于主内核引导阶段的\
  \ UFS 文件系统。\n\n所实现的引导方法是 SunOS 4.x 和 SunOS 5.x 中的方法。然而，它不依赖于 SunOS 内部实现，而仅取决于 Open\
  \ Boot prom 的属性，因此它适用于任何 SPARC 系统的操作系统。更多信息请参阅下方的 `NOTES` 章节。\n\n如果使用特殊文件名 `...`，实际分区及所有后续引导分区将映射到上一个分区。如果调用\
  \ `genisoimage` 时带有 `-G` `...`\n\n### `-G` `generic_boot_image`\n\n指定在制作引导 CD 时使用的通用引导镜像的路径和文件名。路径名必须相对于为\
  \ `genisoimage` 指定的源路径。此参数是可选的。还需要其他选项，至少需要一个内核文件名和引导命令行。更多信息请参阅下方的 `HPPA NOTES`\
  \ 章节。\n\n### `-b` `eltorito_image`\n\n### `-eltorito-boot` `eltorito_image`\n\n\
  指定在为 x86 PC 制作引导 CD 时使用的引导镜像的路径和文件名。路径名必须相对于为 `genisoimage` 指定的源路径。制作可引导 CD 需要此选项。引导镜像必须恰为\
  \ 1200 KB、1440 KB 或 2880 KB，`genisoimage` 在创建 ISO9660 文件系统时使用此大小。如果不是 4 的倍数，某些 BIOS\
  \ 可能会有问题。如果引导镜像不是磁盘，你需要添加 `-hard-disk-boot` 或 `-no-emul-boot`。如果系统不应从模拟磁盘启动，请使用\
  \ `-no-boot`。\n\n如果没有指定 `-sort`，引导镜像将以低优先级 (+2) 排在开头。如果你不喜欢这样，需要指定排序权重 0。\n\n###\
  \ `-eltorito-alt-boot`\n\n使用一组新的 El Torito 引导参数。单个 CD 上可以存储多 63 个 El Torito 引导项。\n\
  \n### `-hard-disk-boot`\n\n指定制作 El Torito 可引导 CD 时使用的引导镜像为硬盘镜像。该镜像必须以包含单个分区的主引导记录（MBR）开头。\n\
  \n### `-no-emul-boot`\n\n指定制作 El Torito 可引导 CD 时使用的引导镜像为“无模拟”镜像。系统将在不进行磁盘模拟的情况下加载并执行此镜像。\n\
  \n### `-no-boot`\n\n指定创建的 El Torito CD 应标记为不可引导。系统将为镜像提供一个模拟驱动器，但从标准引导设备启动。\n\n\
  ### `-boot-load-seg` `segment_address`\n\n指定无模拟 El Torito CD 引导镜像的加载段地址。\n\n###\
  \ `-boot-load-size` `load_sectors`\n\n指定在无模拟模式下加载的“虚拟”（512 字节）扇区数量。默认是加载整个引导文件。如果不是\
  \ 4 的倍数，某些 BIOS 可能会有问题。\n\n### `-boot-info-table`\n\n指定将包含 CD-ROM 布局信息的 56 字节表补丁在引导文件的偏移\
  \ 8 处。如果给出了此选项，引导文件会在源文件系统中被*修改*，因此如果该文件无法重新生成，请备份一份！请参阅 `EL TORITO BOOT INFO TABLE`\
  \ 章节以获取该表的描述。\n\n\n\n\n\n### `-C` `last_sess_start,next_sess_start`\n\n### `-cdrecord-params`\
  \ `last_sess_start,next_sess_start`\n\n此选项用于创建 CD Extra 或多会话光盘的第二个会话或更高级别的会话镜像。`-C`\
  \ 需要两个由逗号分隔的数字。第一个数字是光盘上最后一个会话中应追加的内容的第一个扇区。第二个数字是新会话的起始扇区号。可以通过调用 `wodim -msinfo\
  \ ...` 获取正确的数字。如果 `-C` 与 `-M` 一起使用，`genisoimage` 将创建一个旨在作为上一个会话延续的文件系统镜像。如果在未使用\
  \ `-M` 的情况下使用 `-C` `genisoimage` 将创建一个用于 CD Extra 第二个会话的文件系统镜像。这是一个多会话 CD，第一个会话包含音频数据，第二个会话包含\
  \ ISO9660 文件系统。\n\n### `-c` `boot_catalog`\n\n### `-eltorito-catalog` `boot_catalog`\n\
  \n指定引导目录（boot catalog）的路径和文件名，这是 El Torito 可启动光盘所要求的。路径名必须相对于指定 `genisoimage` 的源路径。该文件将被插入到输出树中，而不会在源文件中创建，因此请确保指定的文件名不会与现有文件冲突，否则它将被排除。通常选择类似\
  \ `boot.catalog` 的名称。\n\n如果未指定 `-sort`，引导目录将以低优先级 (+1) 排序到介质开头。如果你不喜欢这样，需要为引导目录指定排序权重\
  \ 0。\n\n### `-check-oldnames`\n\n检查从旧会话（old session）导入的所有文件名名是否符合 ISO9660 文件命名规则。如果不使用此选项，则仅检查长度超过\
  \ 31 个字符的名字，因为这些文件严重违反了 ISO9660 标准。\n\n### `-check-session` `file`\n\n检查所有旧会话是否符合实际的\
  \ `genisoimage` ISO9660 文件命名规则。这是一个高级选项，结合了 `-M` `file` `-C 0,0 -check-oldnames`。对于参数\
  \ `file`，请参阅 `-M` 的描述。\n\n### `-checksum_algorithm_iso` `alg1,alg2,...`\n\n指定输出镜像所需的校验和类型。\n\
  \n### `-checksum_algorithm_template` `alg1,alg2,...`\n\n指定输出 jigdo 模板所需的校验和类型。\n\
  \n### `-copyright` `file`\n\n指定版权信息，通常是光盘上的文件名。有 37 个字符的空间。等同于 `*.genisoimagerc`\
  \ 文件中的 `COPY`。\n\n### `-d`\n\n### `-omit-period`\n\n不在没有点号的文件末尾添加点号。这违反了 ISO9660\
  \ 标准，但在许多系统中确实可以工作。请谨慎使用。\n\n### `-D`\n\n### `-disable-deep-relocation`\n\n不使用深度目录重定位（deep\
  \ directory relocation），而是按照我们看到的方式对其进行打包。如果没有选择 ISO9660:1999，这违反了 ISO9660 标准，但在许多系统中确实可以工作。请谨慎使用。\n\
  \n### `-debug`\n\n设置调试标记。\n\n### `-dir-mode` `mode`\n\n将用于创建镜像的目录模式覆盖为 `mode`，指定为如\
  \ (1) 中的 4 位权限位。此选项会自动启用 Rock Ridge 扩展。\n\n### `-dvd-video`\n\n生成符合 DVD-Video 标准的\
  \ UDF 文件系统。这是通过对适当文件的内容进行排序并在并在文件之间添加填充来实现。请注意，只有当 DVD-Video 文件名仅包含大写字母时，排序才有效。\n\
  \n注意，为了获得符合 DVD-Video 标准的文件系统镜像，你需要准备一个符合 DVD-Video 标准的目录树。这需要在生成的 DVD 根目录下有一个 `VIDEO_TS`\
  \ 目录（全大写），通常还有另一个 `AUDIO_TS` 目录。`VIDEO_TS` 需要包含符合 DVD-Video 文件系统所需文件（文件名必须全大写）。\n\
  \n### `-e` `efi_boot_file`\n\n### `-efi-boot` `efi_boot_file`\n\n设置 EFI 引导镜像名称。\n\
  \n### `-f`\n\n### `-follow-links`\n\n在生成文件系统时遵循符号链接。当未使用此选项时，如果启用了 Rock Ridge，则将进入符号链接，否则将忽略它们。\n\
  \n### `-file-mode` `mode`\n\n将用于创建镜像的普通文件模式覆盖为 `mode`，指定为如 (1) 中的 4 位权限位。此选项会自动启用\
  \ Rock Ridge 扩展。\n\n### `-gid` `gid`\n\n将从源文件读取的组 ID 覆盖为 `gid` 值。指定此选项会自动启用 Rock\
  \ Ridge 扩展。\n\n### `-gui`\n\n切换为 GUI 行为。目前这使输出更详细，但未来可能会有其他影响。\n\n### `-graft-points`\n\
  \n允许文件名使用嫁接点（graft points）。如果使用此选项，将检查所有文件名的嫁接点。文件名在第一个未转义的等号处分割。如果指定了 `-graft-points`，所有\
  \ `\\'` 和 `=` 字符都必须使用 `\\'` 进行转义。\n\n### `-hide` `glob`\n\n隐藏匹配 `glob`（shell 通配符模式）的任何文件，使其在\
  \ ISO9660 或 Rock Ridge 目录可见。`glob` 可以匹配文件名或路径的任何部分。如果 `glob` 匹配目录，则该目录的内容将被隐藏。\n\
  \n### `-hide-list` `file`\n\n一个包含要从目录隐藏的 shell 通配符的文件。\n\n### `-hidden` `glob`\n\
  \n为匹配 `glob`（shell 通配符模式）的文件和目录添加 ISO9660 隐藏（existence）属性。此属性将防止文件在 MS-DOS 中显示。参见\
  \ `NOTES` 章节。此选项可以使用多次。\n\n### `-hide-joliet` `glob`\n\n在 Joliet 目录中隐藏匹配 `glob`（shell\
  \ 通配符模式）的文件和目录。`glob` 可以匹配文件名或路径的任何部分。如果 `glob` 匹配目录，则该目录的内容将被隐藏。为了匹配目录名，请确保路径不包含结尾字符。所有隐藏的文件仍将写入输出镜像。此选项通常与\
  \ `-hide` 一起使用。参见 `README`。此选项可以使用多次。\n\n### `-hide-joliet-list` `file` \n\n一个包含要从\
  \ Joliet 树隐藏的 shell 通配符的文件。参见 `-hide-joliet`。\n\n### `-hide-joliet-trans-tbl`\n\n\
  在 Joliet 树中隐藏 `TRANS.TBL` 文件。这些文件在 Joliet 世界中没有意义，因为它们列出了真实名称和 ISO9660 名称，后者可能与\
  \ Joliet 名称不同。\n\n### `-hide-rr-moved`\n\n在 Rock Ridge 树中将 `RR_MOVED` 目录重命名为 `.rr_moved`。似乎无法在\
  \ Rock Ridge 树中完全隐藏 `RR_MOVED` 目录。此选项仅让那些不知道该目录用途的人看到的可见树不那么困惑。如果你不需要 `RR_MOVED`\
  \ 目录，应该使用 `-D`。注意，如果指定了 `-D`，生成的文件系统不符合 ISO9660 第一级，且无法在 MS-DOS 上读取。参见 `NOTES` 章节。\n\
  \n### `-input-charset` `charset`\n\n定义本地文件名使用的字符的输入字符集。要获取有效字符集名称列表，请调用 `genisoimage\
  \ -input-charset help`。获取一对映射，可以使用 `default` 作为字符集名称。默认初始值在基于 DOS 的系统上为 *cp437*，在所有其他系统上为\
  \ *iso8859-1*。更多信息请参见下文的**字符集**章节。\n\n### `-output-charset` `charset`\n\n\n\n\n\n\
  定义 Rock Ridge 文件名中使用的字符输出字符集。默认为输入字符集。更多信息请参阅下文 `CHARACTER SETS` 章节。\n\n### -iso-level\
  \ *level*\n\n设置 ISO9660 兼容性级别。有效数字为 1 到 4。\n\n使用级别 1 时，文件可能只包含一个分区，且文件名限制为 8.3 字符。\n\
  \n使用级别 2 时，文件可能只包含一个分区。\n\n使用级别 3 时，没有其他限制（`ISO-9660:1988` 除外）。\n\n在从 1 到 3 的所有\
  \ ISO9660 级别中，所有文件名都限制为大写字母、数字和下划线（`_`）。文件名限制为 31 个字符，目录嵌套限制为 8 层，路径名限制为 255 个字符。\n\
  \n级别 4 官方上不存在，但 `genisoimage` 将其映射到 `ISO-9660:1999`，即 `ISO9660` 版本 2。\n\n使用级别 4\
  \ 时，将输出一个版本号和文件结构版本号设置为 2 的增强卷描述符。目录嵌套不再限制为 8 层，文件不需要包含点，且点没有特殊含义，文件名不包含版本号，且文件名长度可达\
  \ 207 个字符，如果使用 Rock Ridge 则可达 197 个字符。\n\n在创建版本 2 镜像时，`genisoimage` 会输出一个增强卷描述符，它与主卷描述符相似但并不相同。请注意不要使用损坏的软件通过假设存在第二个\
  \ PVD 副本并对该假设的 PVD 副本进行补丁到 El Torito VD 来使 ISO9660 镜像可启动。\n\n### -J\n\n除了常规的 ISO9660\
  \ 文件名外，还生成 Joliet 目录记录。这在光盘要在 Windows 机器上使用时尤为有用用。Joliet 文件名使用 Unicode 指定，每个路径组件的长度可达\
  \ 64 个 Unicode 字符。注意 Joliet 并不是标准 --- 只有 Microsoft Windows 和 Linux 系统可以读取 Joliet\
  \ 扩展。为了更好的移植性，请考虑同时使用 Joliet 和 Rock Ridge 扩展。\n\n### -joliet-long\n\n允许 Joliet 文件名长达\
  \ 103 个 Unicode 字符，而不是 64 个。这破坏了 Joliet 规范，但似乎是有效的。请谨慎使用。\n\n### -jcharset *charset*\n\
  \n`-J -input-charset` `charset` 的组合。更多信息请参阅下文 `CHARACTER SETS` 章节。\n\n### -l\n\n\
  ### -full-iso9660-filenames\n\n允许使用完整的 31 字符文件名。通常 ISO9660 文件名将采用 8.3 格式，这与 MS-DOS\
  \ 兼容，尽管 ISO9660 标准允许最多 31 个字符的文件名。如果你使用此选项，该光盘在 MS-DOS 系统上可能难以使用，但在大多数其他系统上可以工作。请谨慎使用。\n\
  \n### -L\n\n过时的选项；请用 `-allow-leading-dots` 代替。\n\n### -jigdo-jigdo *jigdo_file*\n\
  \n生成文件系统镜像的同时生成一个 `jigdo` `*.jigdo` 元数据文件。更多信息请参阅下文 `JIGDO NOTES` 章节。\n\n### -jigdo-template\
  \ *template_file*\n\n生成文件系统镜像的同时生成一个 `jigdo` `*.template` 文件。更多信息请参阅下文 `JIGDO NOTES`\
  \ 章节。\n\n### -jigdo-min-file-size *size*\n\n指定在 `*.jigdo` 文件列表中文件的最小大小。默认（以及允许的最小值）为\
  \ 1KB。更多信息请参阅下文 `JIGDO NOTES` 章节。\n\n### -jigdo-force-md5 *path*\n\n指定一个文件模式，其中的文件*必须*包含在\
  \ `-md5-list` 提供的外部 MD5 列表中。更多信息请参阅下文 `JIGDO NOTES` 章节。\n\n### -jigdo-exclude *path*\n\
  \n指定一个文件模式，其中的文件将不会列在 `*.jigdo` 文件中。更多信息请参阅下文 `JIGDO NOTES` 章节。\n\n### -jigdo-map\
  \ *path*\n\n为 jigdo 文件指定模式映射（例如 `Debian=/mirror/debian`）。更多信息请参阅下文 `JIGDO NOTES`\
  \ 章节。\n\n### -md5-list *md5_file*\n\n指定一个包含包含在 `*.jigdo` 文件中的文件的 MD5 和、大小和路径名的文件。更多信息请参阅下文\
  \ `JIGDO NOTES` 章节。\n\n### -jigdo-template-compress *algorithm*\n\n指定用于模板数据的压缩算法。目前支持\
  \ `gzip` 和 `bzip2`，其中 `gzip` 是默认值。更多信息请参阅下文 `JIGDO NOTES` 章节。\n\n### -log-file *log_file*\n\
  \n将所有错误、警告和信息性消息重定向到 `log_file` 而不是标准错误输出。\n\n### -m *glob*\n\n排除匹配 `glob`（一种 shell\
  \ 通配符模式）的文件不写入 CD-ROM。`glob` 可以匹配文件名部分，也可以匹配完整路径。此选项可以多次使用。例如：\n\n```\ngenisoimage\
  \ -o rom -m '*.o' -m core -m foobar\n```\n\n这将从镜像中排除所有以 `.o` 结尾、或名为 `core` 或 `foobar`\
  \ 的文件。注意，如果你有一个名为 `foobar` 的目录，它（以及所有后代目录）也会被排除。\n\n### -exclude-list *file*\n\n\
  一个包含要排除的 shell 通配符列表的文件。参见 `-m`。\n\n### -max-iso9660-filenames\n\n允许 ISO9660 文件名长达\
  \ 37 个字符。此选项启用 `-N`，因为额外的空间是从版本号中留出的。\n\n这违反了 ISO9660 标准，但在许多系统中是有效的。使用此选项可能会导致读取系统的缓冲区溢出。请极其小心。\n\
  \n### -M *path*\n\n### -M *device*\n\n### -dev *device*\n\n指定要合并的现有 ISO9660 镜像。另一种形式是设备指定符，其格式与\
  \ `wodim` 的 `dev=` 参数相同。`genisoimage` 的输出将是 `-M` 指定的新会话。这通常需要刻录机支持多会话。此选项可以与 `-C`\
  \ 结合使用。\n\n### -N\n\n### -omit-version-number\n\n在 ISO9660 文件名中省略版本号。\n\n这违反了 ISO9660\
  \ 标准，但实际上没人使用版本号。请谨慎使用。\n\n### -new-dir-mode *mode*\n\n指定在文件系统镜像中创建新目录时使用的模式（四位数，如\
  \ 1）。默认为 0555。\n\n### -nobak\n\n### -no-bak\n\n排除 ISO9660 文件系统上的备份文件；即包含 `~` 或 `#`\
  \ 或以 `*.bak` 结尾的文件。这些通常是 Unix 编辑器的备份文件。\n\n### -force-rr\n\n不对之前的会话使用自动 Rock Ridge\
  \ 属性识别。这可以解决 NERO Burning ROM 等产生的问题。\n\n### -no-rr\n\n不要使用之前会话的 Rock Ridge 属性。这有助于避免\
  \ `genisoimage` 在旧会话中发现非法 Rock Ridge 签名。\n\n\n\n\n在整个镜像的末尾填充 150 个扇区（300 kB）。此选项默认启用。如果与\
  \ `-B` 结合使用，将在 ISO9660 分区和启动分区之间插入填充，使得第一个启动分区从 16 的倍数扇区编号开始起始。\n\n这种填充是必要的，因为许多操作系统（例如\
  \ Linux）在它们的文件系统 I/O 中实现了预读 Bug。这些 Bug 会导致对位于轨道末尾的文件产生读取错误，特别是当磁盘以“一次性轨道”（Track\
  \ At Once）模式写入时，或者 CD 音频轨道紧随数据轨道之后。\n\n不要在末尾填充 150 个扇区（300 kB），也不要让启动分区起始于 16 个扇区的倍数上。\n\
  \n`file`\n\n一个包含 `pathspec` 目录和文件名列表的文件，用于将这些内容添加到 ISO9660 文件系统中。该 pathspecs 列表将在命令行中出现的任何其他\
  \ pathspec 之后进行处理。如果参数为 `--`，则从标准输入读取列表。\n\n过时的选项；请改用 `-publisher`。\n\n`publisher_id`\n\
  \n指定一个将写入卷标头的文本字符串。这应该描述 CD-ROM 的发行者，通常包含邮寄地址和电话号码。空间足够容 128 个字符。等同于 `.genisoimagerc`\
  \ 文件中的 `PUBL`。\n\n`preparer_id`\n\n`preparer_id`\n\n指定一个将写入卷标头的文本字符串。这应该描述 CD-ROM\
  \ 的制备者，通常包含邮寄地址和电话号码。空间足够容 128 个字符。等同于 `.genisoimagerc` 文件中的 `PREP`。\n\n以扇区大小（2048\
  \ 字节）的倍数估计文件系统大小并退出。此选项在“一次性磁盘”（Disk At Once）模式以及配合某些 CD-R 驱动器直接管道传输到 `wodim` 时是必要的，在这种情况下\
  \ `wodim` 需要提前知道文件系统镜像的大小。旧版本的 `mkisofs` 将此信息（以及其他信息）写入 `stderr`。由于这被证明很难解析，现在不带任何其他信息的数字也会打印到\
  \ `stdout` 上。如果你想写一个简单的 shell 脚本，可以重定向 `stderr` 并从 `stdout` 获取该数字。可以通过以下方式实现：\n\n\
  ```\ncdblocks=`genisoimage -print-size -quiet ...`\ngenisoimage ... | wodim ...\
  \ tsize=${cdblocks}s -\n```\n\n这使得 `genisoimage` 更加简洁。将不会提供进度输出。\n\n`-R`\n\n`-rock`\n\
  \n使用 Rock Ridge 协议生成 SUSP 和 RR 记录，以进一步描述 ISO9660 文件系统上的文件。\n\n`-r`\n\n`-rational-rock`\n\
  \n此类似于 `-R` 选项，但文件所有和模式被设置为更有用的值。`uid` 和 `gid` 被设置为 0，因为它们通常只对作者的系统有用，对客户端没用。所有文件的读取位都设置为真，以便文件和目录在客户端上全局可读。如果某个文件设置了任何执行位，则设置所有执行位，以便可执行文件在客户端上全局可执行。如果目录设置了任何搜索位，则设置所有搜索位，以便目录在客户端上全局可搜索。所有写入位都被清除，因为文件系统在任何情况下都会以只读模式挂载。如果设置了任何特殊模式位，则将其清除，因为文件锁在只读文件系统上没有用，且\
  \ `uid 0` 或 `gid 0` 不希望 set-id 位。在 Win32 上使用时，所有文件都会设置执行位。这是由于 Win32 缺少文件权限以及 Cygwin\
  \ POSIX 仿真层导致的。参见 `-uid`, `-gid`, `-dir-mode`, `-file-mode` 和 `-new-dir-mode`。\n\
  \n允许 ISO9660 文件名包含除小写字母以外的所有 7 位 ASCII 字符。\n\n这违反了 ISO9660 标准，但在许多系统中恰好有效。请谨慎使用。\n\
  \n`dir`\n\n将镜像中的所有文件和目录移动到 `dir` 中。这本质上与使用 `-graft-points` 并在每个 pathspec 前添加 `dir`\
  \ ，但更容易使用。`dir` 实际上可以是几层深。它与其他挂载点具有相同的权限。\n\n`dir`\n\n当写入多会话镜像且之前的（甚至更早的）会话是使用 `-root\
  \ dir` 写入时，此选项是必要的。使用之前的会话中未找到的目录名会导致 `genisoimage` 报错并终止。如果没有此选项，`genisoimage`\
  \ 将无法找到未修改的文件，并将被迫再次将它们的数据写入镜像。`-root` 和 `-old-root` 旨在配合使用以进行增量备份。初始会话例如使用：`genisoimage\
  \ -root backup_1 dirs`。下次使用 `genisoimage -root backup_1 dirs -old-root backup_1`\
  \ 进行增量备份将允许增量备份。生成的输出镜像将命名为：`backup_00`, `backup_01`, `backup_02`....\n\n`sector\
  \ type`\n`sector type`\n\n`-s`\n\n`sectype`\n\n将输出类型设置为 `xa1`。\n\n`sort_file`\n\n\
  排序 ISO9660 中文件名的顺序。它排序数据写入 CD 的顺序，这对于优化 CD 上的数据布局有用。更多细节参见 `README.sort`。\n\n`img_sun4,img_sun4c,img_sun4m,img_sun4d,img_sun4e`\n\
  \n见上述 `-B`。\n\n`label`\n\n为使用 `-sparc-boot` 创建的 Sun 标签设置 Sun 标签名称。\n\n将输出镜像拆分为若干个约\
  \ 1 GB 文件。这有助于在不支持大文件的操作系统上创建 DVD 尺寸的 ISO9660 镜像。在写入 DVD 时，`wodim` 将多个文件合并到一个轨道。为了使\
  \ `-split-output` 起作用，必须指定 `-o` `filename`。生成的输出镜像将命名为：`filename_00`, `filename_01`,\
  \ `filename_02`....\n\n`#`\n\n选择流操作并将大小设置为 # 个扇区。这允许你将 (1) 程序的输出管道到 `genisoimage`，并在不需要中间存档的情况下创建\
  \ ISO9660 文件系统。如果指定了此选项，`genisoimage` 从 `stdin` 读取并创建一个名为 `STREAM.IMG` 的文件。文件的大小（包含填充）比指定的大小小\
  \ 200 个扇区。如果指定了 `-no-pad`，文件大小比指定的大小小 50 个扇区。如果文件较小，`genisoimage` 将写入填充。这可能需要一段时间。\n\
  \n选项 `-stream-media-size` 仅创建简单的 ISO9660 文件系统，且不能与多会话或混合文件系统选项一起使用。\n\n`name`\n\n\
  留供未来使用。\n\n\n\n\n\n# `-sunx86-boot` `UFS_img,,,AUX1_img`\n\n指定一个逗号分隔的文件系统镜像列表，用于为\
  \ Solaris x86 系统制作可引导的 CD。\n\n请注意，分区 1 用于 ISO9660 镜像，分区 2 是整个磁盘，因此分区 1 和 2 可能无法被外部分区数据使用。第一个镜像文件映射到分区\
  \ 0。逗号分隔列表中可能存在空字段，且分区 1 和 2 的列表项必须为空。支持的分区最大数量为 8（尽管 Solaris x86 分区表支持多达 16 个分区），因此无法指定超过\
  \ 6 个分区镜像。这是为 Solaris x86 系统制作可引导 CD 所必需的选项。\n\n如果指定了 `-sunx86-boot`，生成的镜像第一个扇区将包含一个\
  \ PC fdisk 标签，其中包含一个 Solaris 类型 0x82 fdisk 分区，它从偏移 512 开始并跨整个 CD。此外，对于 Solaris 类型\
  \ 0x82 fdisk 分区，在 CD 第一个扇区的偏移 1024 处有一个 SVr4 磁盘标签。该磁盘标签指定用于引导 PC 的第一个（通常是 UFS 类型）文件系统镜像使用\
  \ slice 0，为 ISO9660 镜像使用 slice 1。slice 2 跨越整个 CD，slice 3 ... slice 7 可用于通过此选项指定的其他文件系统镜像。\n\
  \nSolaris x86 引导 CD 使用一个 1024 字节大小的主引导，该引导使用 `El-Torito no-emulation` 引导模式，以及一个位于\
  \ CD 扇区 1..15 的次级通用引导。由于由于原因，必须指定 `-b` `bootimage` `-no-emul-boot` 和 `-G` `genboot`。\n\
  \n# `-sunx86-label` `label`\n\n为使用 `-sunx86-boot` 创建的 SVr4 磁盘标签设置 SVr4 磁盘标签名称。\n\
  \n# `-sysid` `ID`\n\n指定系统 ID。有 32 个字符的空间。等同于 `.genisoimagerc` 文件中的 `SYSI`。\n\n#\
  \ `-T`\n\n# `-translation-table`\n\n在 CD-ROM 上的每个目录中生成文件 `TRANS.TBL`，该文件用于不支持 Rock\
  \ Ridge 的系统以帮助建立正确的文件。文件中还包含指示块设备和字符设备的主号和次号的信息，并且每个符号链接都有给定的链接文件名为。\n\n# `-table-name`\
  \ `table_name`\n\n备用翻译表文件名（见上文）。隐含 `-T`。如果你正在创建多会话镜像，必须使用与上一个会话相同的名称。\n\n# `-ucs-level`\
  \ `level`\n\n在 Joliet SVD 中设置 Unicode 兼容性级别。默认级别为 3。可以使用此选项将其设置为 1..3。\n\n# `-udf`\n\
  \n在生成的文件系统镜像中包含 UDF 文件系统支持。UDF 支持目前处于 alpha（（测试）阶段，因此无法创建仅包含 UDF 的镜像。UDF 数据结构目前与\
  \ Joliet 结构耦合，因此当前的实现中存在许多陷阱。没有 UID/GID 支持，没有 POSIX 权限支持，不支持符号链接。请注意，UDF 除了实际 UDF\
  \ 数据结构所需的空间外，还浪费了磁盘开头从扇区 ~20 到扇区 256 的空间。\n\n# `-uid` `uid`\n\n将从源文件读取的 uid 覆盖为\
  \ `uid` 值。指定此选项会自动启用 Rock Ridge 扩展。\n\n# `-use-fileversion`\n\n选项 `-use-fileversion`\
  \ 允许 `genisoimage` 使用文件系统中的版本号。如果未指定该选项，`genisoimage` 为所有文件创建版本号 1。文件版本是 `;1` 到\
  \ `;32767` 范围内的字符串。该选项在 VMS 上是默认的。\n\n# `-U`\n\n# `-untranslated-filenames`\n\n\
  允许“未翻译”的文件名，完全违反上述的 ISO9660 标准。启用以下标志：`-d -l -N -allow-leading-dots -relaxed-filenames\
  \ -allow-lowercase -allow-multidot -no-iso-translate`。允许文件名中出现多个 `.` 字符，以及混合大小写的文件名。这在\
  \ HP-UX 上很有用，因为内置的 `cdfs` 文件系统不识别任何扩展。请极其谨慎使用。\n\n# `-no-iso-translate`\n\n不要翻译对于\
  \ ISO9660 文件名无效的字符 `#` 和 `~`。虽然无效，但这些字符经常被微软系统使用。\n\n这违反了 ISO9660 标准，但在许多系统上可行。请谨慎使用。\n\
  \n# `-V` `volid`\n\n指定写入主块的卷 ID（卷名或标签）。有 32 个字符的空间。等同于 `.genisoimagerc` 文件中的 `VOLI`。卷\
  \ ID 被 Solaris 卷管理器用作挂载点，并作为分配给 Windows 和 Apple Mac OS 等其他各种平台上磁盘的标签。\n\n# `-volset`\
  \ `ID`\n\n指定卷集 ID。有 128 个字符的空间。等同于 `.genisoimagerc` 文件中的 `VOLS`。\n\n# `-volset-size`\
  \ `#`\n\n将卷集大小设置为 #。卷集大小是卷中 CD 的数量。`genisoimage` 目前不支持大于 1 的 `-volset-size`。\n\n\
  选项 `-volset-size` 必须在每行命令行中位于 `-volset-seqno` 之前。\n\n# `-volset-seqno` `#`\n\n将卷集序列设置为\
  \ #。卷集序列号是当前 CD 在卷集中的索引数字。选项 `-volset-size` 必须在每行命令行中位于 `-volset-seqno` 之前。\n\n\
  # `-v`\n\n# `-verbose`\n\n详细执行。如果在命令行中给出两次，将打印额外的调试信息。\n\n# `-x` `glob`\n\n相同于 `-m`\
  \ `glob`。\n\n# `-XA`\n\n生成 XA 属性。\n\n# `-xa`\n\n生成合理化的 XA 属性。\n\n# `-z`\n\n# `-transparent-compression`\n\
  \n为透明压缩文件生成特殊的 `RRIP` 记录。这对于支持透明解压的主机，例如 Linux 2.4.14 或更高版本。你必须指定 `-R` 或 `-r` 来启用\
  \ Rock Ridge，并在运行 `genisoimage` 之前使用 `mkzftree` 工具生成压缩文件。注意透明压缩是非标准的 Rock Ridge\
  \ 扩展。生成的磁盘仅在 Linux 上上可以透明读取。在其他操作系统上，你将需要调用 `mkzftree` 来解压文件。\n\n## HFS 选项\n\n#\
  \ `-hfs`\n\n创建一个 ISO9660/HFS 混合 CD。此选项应结合 `-map`、`-magic` 和/或下文提供的各种双杠选项使用。\n\n\
  # `-apple`\n\n创建一个带有 Apple 扩展的 ISO9660 CD。与 `-hfs` 类似，只是添加了 Apple ISO9660 扩展而不是创建\
  \ HFS 混合卷。 `genisoimage` 版本在指定 `-apple` 时默认包含 Rock Ridge 属性。此版本的 `genisoimage` 不再这样做。如果你想要\
  \ Rock Ridge 属性，你需要单独指定。\n\n# `-map` `mapping_file`\n\n使用 `mapping_file` 根据文件名的扩展名为文件设置\
  \ CREATOR 和 TYPE 信息。只有当文件名不是已知的 Apple/Unix 文件格式时，才会进行映射。见下文 **HFS CREATOR/TYPE**\
  \ 章节。\n\n# `-magic` `magic_file`\n\n\n\n\n\n`CREATOR` 和 `TYPE` 信息是通过使用文件的 `magic\
  \ number`（通常是文件的前几个字节）设置的。`magic_file` 仅当文件不是已知 Apple/Unix 文件格式之一，或者文件扩展名未通过 `-map`\
  \ 映射时才使用。详情请参见下方的 `HFS CREATOR/TYPE` 章节。\n\n### `-hfs-creator` `creator`\n\n为所有文件设置默认\
  \ `CREATOR`。必须恰好为 4 个字符。详情请参见下方的 `HFS CREATOR/TYPE` 章节。\n\n### `-hfs-type` `type`\n\
  \n为所有文件设置默认 `TYPE`。必须恰好为 4 个字符。详情请参见下方的 `HFS CREATOR/TYPE` 章节。\n\n### `-probe`\n\
  \n搜索文件内容以查找所有已 Apple/Unix 文件格式。关于这些格式的更多信息，请参见下方的 `HFS MACINTOSH FILE FORMATS`。然而，检查\
  \ `MacBinary` 和 `AppleSingle` 文件的唯一方法是打开并读取它们，因此此选项可能会增加处理时间。如果已知使用的 Apple/Unix\
  \ 格式，最好使用下面给出的一个或多个 `double dash` 。\n\n### `-no-desktop`\n\n不创建（空的）Desktop 文件。在\
  \ Macintosh 上使用 CD 时，将创建新的 HFS Desktop 文件（并存储在系统文件夹中）。默认情况下，空的 Desktop 文件会被添加到 HFS\
  \ 卷中。\n\n### `-mac-name`\n\n使用 HFS 文件名作为 ISO9660、Joliet 和 Rock Ridge 文件名的起始点。更多信息请参见下方的\
  \ `HFS MACINTOSH FILENAMES` 章节。\n\n### `-boot-hfs-file` `driver_file`\n\n安装 `driver_file`，该文件`may`\
  \ 使 CD 在 Macintosh 上可启动。详情请参见下方的 `HFS BOOT DRIVER` 章节。（Alpha）。\n\n### `-part`\n\n\
  生成 HFS 分区表。默认情况下不生成分区表，但某些旧的 Macintosh CD-ROM 驱动程序需要 CD-ROM 上有 HFS 分区才能才能混合 CD-ROM。\n\
  \n### `-auto` `AutoStart_file`\n\n使 HFS CD 使用 QuickTime 2.0 Autostart 功能来启动应用程序或文档。给定的文件名必须是位于\
  \ CD 顶目录的文档或应用程序。文件名必须少于 12 个字符。（Alpha）。\n\n### `-cluster-size` `size`\n\n设置 PC\
  \ Exchange 文件簇或分配单元的字节大小。这隐含了 `--exchange`。详情请参见下方的 `HFS MACINTOSH FILE FORMATS`\
  \ 章节。\n\n### `-hide-hfs` `glob`\n\n从 HFS 卷中隐藏 `glob`（这是一个 shell 通配符模式）。该文件或目录仍存在于\
  \ ISO9660 和/或 Joliet 目录中。`glob` 可以匹配文件名的任何部分。可以排除多个 globs。示例：\n\n```\ngenisoimage\
  \ -o rom -hfs -hide-hfs '*.o' --hide-hfs foobar\n```\n\n这将从 HFS 卷中排除所有以 `.o` 结尾或名为\
  \ `foobar` 的文件。注意，如果你有一个名为 `foobar` 的目录，它（以及所有的后代目录）也会被排除。`glob` 也可以相对于命令行指定的源目录的路径名。示例：\n\
  \n```\ngenisoimage -o rom -hfs -hide-hfs src/html src\n```\n\n这将仅从 `src` 目录中排除名为\
  \ `html` 的文件或目录。树中任何其他名为 `html` 的文件或目录都不会排除。应与 `-hide` 和/或 `-hide-joliet` 使用。为了匹配目录名，请确保模式不包含末尾字符\
  \ `/`。详情请参见 `README.hide`。\n\n### `-hide-hfs-list` `file`\n\n指定一个包含通配符模式列表的文件，隐藏方式与\
  \ `-hide-hfs` 相同。\n\n### `-hfs-volid` `hfs_volid`\n\nHFS 分区的卷名。这是分配给 Macintosh 上磁盘的名称，并替换了与\
  \ `-V` 使用的 `volid`。\n\n### `-icon-position`\n\n如果 Apple/Unix 文件存在图标位置信息，则使用它。图标将出现在与在\
  \ Macintosh 桌面面上相同的位置。屏幕上的文件夹位置和大小、滚动位置、文件夹视图（以图标显示、小图标显示等）也会被保留。（Alpha）。\n\n###\
  \ `-root-info` `file`\n\n设置 HFS 卷根目录的 Location、屏幕上大小、滚动位置、文件夹视图等。更多信息请参见 `README.rootinfo`。（Alpha）。\n\
  \n### `-prep-boot` `file`\n\nPReP 启动镜像文件。允许最多 4 个。详情请参见 `README.prep_boot`。（Alpha）。\n\
  \n### `-chrp-boot`\n\n添加 CHRP 启动头。\n\n### `-input-hfs-charset` `charset`\n\n当配合\
  \ `-mac-name` 使用，定义 HFS 文件名中使用字符的输入字符集。默认字符集为 `cp10000` (Mac Roman)。详情请参见下方的 `CHARACTER\
  \ SETS` 和 `HFS MACINTOSH FILENAMES` 章节。\n\n### `-output-hfs-charset` `charset`\n\
  \n当配合 `-mac-name` 使用，定义 HFS 文件名中使用字符的输出字符集。默认字符集为 `cp10000` (Mac Roman)。详情请参见下方的\
  \ `CHARACTER SETS` 和 `HFS MACINTOSH FILENAMES` 章节。\n\n### `-hfs-unlock`\n\n默认情况下，**genisoimage**\
  \ 将创建锁定的 HFS。\n\n### `-hfs-bless` `folder_name`\n\n“Bless”（加持）给定的 `folder_name`。\n\
  \n### `-hfs-parms` `parameters`\n\n覆盖用于 HFS 的某些参数。详情请参见 `libhfs_iso`。\n\n## CHARACTER\
  \ SETS\n\n**genisoimage** 以符合 POSIX 标准的方式以 8 位字符字符串的形式处理文件名。为了表示所有语言的所有编码，8 位字符是不够的。Unicode\
  \ 或 ISO-10646 定义了至少需要 21 位位来表示所有语言的字符编码。它们可以用 `UTF-32`、`UTF-16` 或 `UTF-8` 编码来表示。\n\
  \n现代 Unix 操作系统对文件名使用 UTF-8 编码。每个 32 位字符由一个或多个 8 位字符表示。如果一个字符使用 `ISO-8859-1` 编码（用于中欧和北美），则它将\
  \ 1:1 映射到 `UTF-32` 或 `UTF-16` 编码的 Unicode 字符。如果一个字符使用 `7-Bit ASCII` 编码（用于美国和其他字符集有限的国家），则它将\
  \ 1:1 映射到 `UTF-32`、`UTF-16` 或 `UTF-8` 编码的 Unicode 字符。无法在 UTF-8 中用单字节表示的字符码（如果值 >\
  \ 0x7F）使用映射到多个 8 位字符的转义序列。\n\n如果所有操作系统都使用 UTF-8，**genisoimage** 就不需要重新编码文件名中的字符。遗憾的是，Apple\
  \ 使用完全非标准的编码，而微软使用与 POSIX 文件名接口不的 Unicode 编码。\n\n\n\n\n\n对于所有非 UTF-8 编码的操作系统，每个字节代表的实际字符取决于本地操作系统使用的\
  \ `character set`（字符集）或 `codepage`（微软使用的术语）——字符集中的字符将反映用户设置的区域或自然语言 set。\n\n通常，字符代码\
  \ `0x00-0x1f` 是控制字符，代码 `0x20-0x7f` 是 7 位 ASCII 字符（在 PC 和 Mac 上），`0x80-0xff` 用于其他字符。\n\
  \n由于使用的字符/符号远多于 256 个，字符集中仅由一小部分子集来表示。因此，相同的字符代码在不同的字符集中可能代表不同的字符。例如，在中欧生成的文件名，在（例如）东欧的机器上查看时，可能不会显示相同的字符。\n\
  \n让情况变得复杂的是，不同的操作系统对不同的区域或语言使用不同的字符集。例如，`ĂŠ`（带锐音符号的小写 e）的字符代码在 PC 上可能是代码 `0x82`，在\
  \ Macintosh 上是代码 `0x8e`，在西欧的 Unix 系统上是代码 `0xe9`，在 Unicode 中是代码 `0x000e9`。\n\n只要不是所有的操作系统和应用程序使用相同的字符集作为文件名的基础，就有可能指定你的文件名使用什么字符集，以及文件名在\
  \ CD 上应该显示什么字符集。\n\n有四个选项可以指定你想使用的字符集：\n\n### -input-charset\n\n定义你在主机机器上使用的本地字符集。任何发生的字符集转换将使用此字符集作为起点。默认输入字符集在基于\
  \ MS-DOS 的系统上为 `cp437`，在所有其他系统上为 `iso8859-1`。如果给出 `-J`，则 Joliet 目录将使用输入字符集的 Unicode\
  \ 等效字符。`-jcharset` 与 `-input-charset -J` 相同。\n\n### -output-charset\n\n定义在 CD 上用于\
  \ Rock Ridge 名称将使用的字符集。默认使用输入字符集。\n\n### -input-hfs-charset\n\n定义用于从任何各种 Apple/Unix\
  \ 文件格式解码出的 HFS 文件名中的 HFS 字符集。仅在配合 `-mac-name` 使用时有用。更多信息请参阅 `HFS MACINTOSH FILENAMES`。默认值为\
  \ `cp10000` (Mac Roman)。\n\n### -output-hfs-charset\n\n定义从当前使用的输入字符集创建 HFS 文件名时使用的\
  \ HFS 字符集。在大多数情况下，这将来自 `-input-charset` 提供的字符集。默认使用输入 HFS 字符集。\n\n`genisoimage`\
  \ 内置了许多字符集。要获取列表，请使用 `-input-charset help`。如果 `genisoimage` 编译时支持 `iconv`，则此列表将不包含从当前\
  \ locale 派生的字符集。\n\n可以通过提供文件名作为任何字符集选项的参数，从文件中读取额外的字符集。只有当给定的文件名与内置字符集不匹配时，才会读取该文件。\n\
  \n字符集文件的格式与 . 提供的映射文件相同。该格式为：\n\n第 1 列是输入字节代码（十六进制格式为 `0xXX`）\n\n第 2 列是 Unicode（十六进制格式为\
  \ `0xXXXX`）\n\n该行的其余部分将被忽略。\n\n任何空行、符合上述格式但缺少两（或更多）列的行或注释行（以 `#` 字符开头）均会被忽略且无警告。任何缺失的输入代码映射到\
  \ Unicode 字符 `0x0000`。\n\n注意，虽然支持 UTF-8，但不支持 UCS-2/UTF-16 和 UCS-4/UTF-32 等其他 Unicode\
  \ 编码，因为 POSIX 操作系统无法原生处理它们。\n\n可以使用关键字 `default` 作为任何字符集选项的参数定义 1:1 的字符集映射。这是旧版本\
  \ `mkisofs` 的行为。\n\n从输入文件名生成的 ISO9660 文件名不会从输入字符集转换。ISO9660 字符集是 ASCII 字符的一个非常有限的子集，因此任何转换都没有意义。\n\
  \n`genisoimage` 无法转换的字符将被替换为字符 `_`。\n\n## HFS CREATOR/TYPE\n\nMac 文件有两个与之相关的属性，定义了哪个应用程序创建了文件（`CREATOR`）以及文件包含什么数据（`TYPE`）。两者都是（恰好）4\
  \ 个字母字符串。通常这允许 Macintosh 用户双击文件并启动正确的应用程序等。可以在 Macintosh 上使用类似 ResEdit（或类似工具）找到特定文件的\
  \ `CREATOR` 和 `TYPE`。\n\n`CREATOR` 和 `TYPE` 信息存储在所有各种 Apple/Unix 编码文件中。对于其他文件，可以使用\
  \ `mapping` 文件（通过 `-map`）和/或使用文件的 `magic number`（通常是前几个字节中的 `signature`，通过 `-magic`）基于文件扩展名来确定\
  \ `CREATOR` 和 `TYPE`。如果同时给出这两个选项，它们在命令行上的顺序是重要的。如果先给出 `-map`，则会在尝试魔数匹配之前尝试文件名扩展名匹配。然而，如果先给出\
  \ `-magic`，则会在尝试文件名扩展名匹配之前尝试魔数匹配。\n\n如果不使用映射文件或魔数文件，文件的默认 `CREATOR` 和 `TYPE` 可以通过\
  \ `-hfs-creator` 和/或 `-hfs-type` 设置，否则可能为 `????`。\n\n`mapping` 文件的格式与 `afp` 使用的相同。该文件有五列：`extension`、`translation`、`CREATOR`、`TYPE`\
  \ 和 `Comment`。以 `#` 开头的行会被忽略。示例文件如下：\n\n| # Example file  |\n|  |\n| # EXTN | XLate\
  \ | CREATOR | TYPE | Comment  |\n| .tif | Raw | 8BIM | TIFF | Photoshop image  |\n\
  | .hqx | Ascii | BnHq | TEXT | BinHex file  |\n| .doc | Raw | MSWD | WDBN | Word\
  \ file  |\n| .mov | Raw | TVOD | MooV | QuickTime Movie  |\n| * | Ascii | ttxt |\
  \ TEXT |\n\n第一列 `EXTN` 定义了要映射的 Unix 文件名扩展名。`XLate` 列定义了 Unix 和 Macintosh 文件之间的文本转换，`genisoimage`\
  \ 会忽略它，但为了兼容 (1)。`CREATOR` 和 `TYPE` 关键字必须是 4 个字符并用单引号括起来。注释字段用双引号括——`genisoimage`\
  \ 会忽略它，但为了兼容 `aufs`。\n\n`magic` 文件的格式与 (1) 命令使用的 (5) 文件几乎相同。此文件有四个制表符分隔的列，分别是 `byte\
  \ offset`、`type`、`test` 和 `message`。以 `#` 字符开头的行是注释行并会被忽略。示例文件如下：\n\n| # Example\
  \ magic file  |\n|  |\n| # off | type | test | message  |\n| 0 | string | GIF8 |\
  \ 8BIM GIF image  |\n| 0 | beshort | 0xffd8 | 8BIM JPEG image data  |\n| 0 | string\
  \ | SIT! | SIT! StuffIt Archive  |\n| 0 | string | \\037\\235 | LZIV ZIVU standard\
  \ Unix compress  |\n| 0 | string | \\037\\213 | GNUz ZIVU gzip compressed data \
  \ |\n| 0 | string | %! | ASPS TEXT Postscript  |\n| 0 | string | \\004%! | ASPS\
  \ TEXT PC Postscript with a ^D to start  |\n| 4 | string | moov | txtt MooV QuickTime\
  \ movie file (moov)  |\n| 4 | string | mdat | txtt MooV QuickTime movie file (mdat)\
  \  |\n\n\n\n\n文件的格式在 (5) 中描述。这里唯一的区别是，对于魔法文件中的每个条目，初始偏移的 `message` 必须是 4 个字符的 `CREATOR`，后跟\
  \ 4 个字符的 `TYPE` --- 它们之间的空格可选。该行上的任何其他字符都会被忽略。续接行（以 `>` 开头）也会被忽略，即：只使用初始偏移行。\n\n\
  使用 `-magic` 可能会显著增加处理时间，因为每个文件都必须打开并读取以找到其魔数（magic number）。\n\n总结，对于所有文件，默认的 `CREATOR`\
  \ 为 `Unix`，默认的 `TYPE` 为 `TEXT`。可以通过使用 `.genisoimagerc` 文件中的条目，或使用 `-hfs-creator`\
  \ 和/或 `-hfs-type` 来更改它们。\n\n如果文件属于知的 Apple/Unix 格式之一（并且已选择该格式），则 `CREATOR` 和 `TYPE`\
  \ 取自存储在 Apple/Unix 文件中的值。\n\n其他文件可以通过文件名扩展名（使用 `-map`）设置其 `CREATOR` 和 `TYPE`，或者通过其魔数（使用\
  \ `-magic`）设置。如果在 `mapping` 文件中使用了默认匹配，这些值将覆盖默认的 `CREATOR` 和 `TYPE`。\n\n可以在 . 找到完整的\
  \ `CREATOR/TYPE` 数据库。\n\n## HFS MACINTOSH 文件格式\n\nMacintosh 文件有两个部分，称为 `Data`（数据）分叉和\
  \ `Resource`（资源）分叉。任何一个部分都可以为空。Unix（以及许多其他操作系统）只能处理只有一个部分（或分叉）的文件。此外，Macintosh 文件具有若干与之相关的属性\
  \ --- 最重要的可能是 `TYPE` 和 `CREATOR`。同样，Unix 没有这些类型属性的概念。\n\n例如，一个 Macintosh 文件可能是一个\
  \ JPEG 图像，其中图像存储在 `Data` 分叉中，而桌面缩略图存储在 `Resource` 分叉中。通常数据分叉中的信息在跨平台使用时是有用的。\n\n\
  因此，要在 Unix 文件系统上存储 Macintosh 文件，就必须找到一种方法来处理这两个分叉和额外的属性（称为 `Finder info`）。遗憾的是，似乎每个在\
  \ Unix 上存储 Macintosh 文件的软件包包都选择了完全不同的存储方法。\n\n`genisoimage`（部分）支持的 Apple/Unix 格式包括：\n\
  \n### CAP AUFS 格式\n数据分叉存储在一个文件中。资源分叉存储在子目录 `.resource` 中，与数据分叉相同。Finder info 存储在子目录\
  \ `.finderinfo` 中，文件名相同。\n\n### AppleDouble/Netatalk\n数据分叉存储在一个文件中。资源分叉存储在以 `%`\
  \ 为前缀的相同文件中。Finder info 也存储在同一个 `%'` 文件中。Netatalk 使用相同的格式，但资源分叉/Finder info 存储在子目录\
  \ `.AppleDouble` 中，与数据分叉相同。\n\n### AppleSingle\n数据结构类似于上述，但两个分叉和 Finder info 都存储在一个文件中。\n\
  \n### Helios EtherShare\n数据分叉存储在一个文件中。资源分叉和 Finder info 共同存储在子目录 `.rsrc` 中，与数据分叉相同。\n\
  \n### IPT UShare\n类似于 EtherShare 格式，但 Finder info 的存储方式略有不同。\n\n### MacBinary\n\
  两个分叉和 Finder info 都存储在一个文件中。\n\n### Apple PC Exchange\nMacintosh 用于在 DOS (FAT) 磁盘上存储\
  \ Apple 文件。数据分叉存储在一个文件中。资源分叉存储在子目录 `resource.frk` (或 `RESOURCE.FRK`) 中。Finder info\
  \ 作为文件 `finder.dat` (或 `FINDER.DAT`) 中的一条记录。每个数据分叉目录对应独立的 `finder.dat`。\n\n注意：`genisoimage`\
  \ 需要知道 PC Exchange 文件所在（或拷贝自）磁盘的本地 FAT 簇大小。此大小由 `-cluster-size` 给出。簇或分配大小可以通过使用\
  \ DOS 工具 `chkdsk` 找到。\n\n可能无法配合 PC Exchange v2.2 或更高版本的文件（MacOS 8.1 可用）。使用 Linux\
  \ 时，包含 PC Exchange 文件的 DOS 介质应挂载为类型 `msdos`（而不是 `vfat`）。\n\n### SGI/XINET\nSGI 机器在挂载\
  \ HFS 磁盘时使用。数据分叉存储在一个文件中。资源分叉存储在子目录 `.HSResource` 中，文件名相同。Finder info 作为文件 `.HSancillary`\
  \ 中的一条记录。每个数据分叉目录对应的 `.HSancillary`。\n\n### Thursby Software Systems DAVE\n允许 Macintosh\
  \ 在 SMB 服务器上存储 Apple 文件。数据分叉存储在一个文件中。资源分叉存储在子目录 `resource.frk` 中。使用 AppleDouble\
  \ 格式存储资源分叉。\n\n### Services for Macintosh\nNT 服务器在 NTFS 文件系统上存储的文件格式。数据分叉存储为 `filename`。资源分叉存储为名为\
  \ `filename:AFP_Resource` 的 NTFS 流。Finder info 存储为名为 `filename:Afp_AfpInfo` 的 NTFS\
  \ 流。NTFS 流通常对用户不可见。\n\n警告：`genisoimage` 部分支持 SFM 格式。如果存储在 NT 服务器上的 HFS 文件或文件夹名称中包含非法的\
  \ NT 字符，NT 会将这些字符转换为 `Private Use Unicode` 字符。这些字符是：`\" * / < > ? \\ |` 以及作为文件名最后一个字符的空格或点，字符代码\
  \ 0x01 到 0x1f（控制字符）以及 Apple 的苹果标志。\n\n遗憾的是，这些专用 Unicode 字符无法被 `genisoimage` NT 可执行文件读取。因此，任何包含这些字符的文件或目录都被忽略\
  \ --- 包括任何此类目录的内容。\n\n### Mac OS X AppleDouble\n当 Mac OS X 将 HFS/HFS+ 文件复制或保存到非\
  \ HFS 文件系统（如 UFS, NFS 等）时，使用 AppleDouble 格式。数据分叉存储在以 `._` 开头的相同文件中。\n\n### Mac OS\
  \ X HFS (Alpha)\n并非真正的 Apple/Unix 编码，但在 Mac OS 系统上的 HFS/HFS+ 文件。数据分叉存储在一个文件中。资源分叉存储在后缀为\
  \ `.rsrc` 的相同文件中。Finder info 仅通过 Mac OS 调用可用。\n\n另见 `README.macosx`。仅在 Mac OS X\
  \ 上有效。如果发现资源分叉长度为零且 finderinfo 为空，则假设没有 Apple/Unix 编码 --- 因此可以使用其他方法设置 `CREATOR`\
  \ 和 `TYPE`。\n\n`genisoimage` 将尝试从 finder info 设置 `CREATOR`、`TYPE` 和日期以及可能的其他标志。此外，如果存在，Macintosh\
  \ 文件名将从 finder info 设置，否则基于 Unix 文件名 --- 参见下文的 **HFS MACINTOSH FILENAMES** 部分。\n\
  \n使用 `-apple` 时，`TYPE` 和 `CREATOR` 存储在 ISO9660 目录记录的可选系统使用 `SUSP` 字段中 --- 方式与 Rock\
  \ Ridge 属性非常相似。事实上，为了方便，Apple 扩展被添加在现有的 Rock Ridge 属性之前（即：获取 Apple 扩展时也能获得 Rock\
  \ Ridge 扩展）。\n\nApple 扩展要求资源分叉存储为 ISO9660 关联（associated）文件。这与 ISO9660 文件系统中的任何普通文件类似，只是目录记录中设置了关联标记（第\
  \ 2 位）。该文件与数据分叉同名（非 Apple 看到的文件）。关联文件通常被其他操作系统忽略。\n\n使用 `-hfs` 时，`TYPE` 和 `CREATOR`\
  \ 以及其他 finder info 存储在单独 HFS 目录中，在 ISO9660 卷上不可见。HFS 目录引用上述数据和资源分叉文件。在大多数情况下，使用\
  \ `-hfs` 而不是 `-apple` 更好，因为后者限制了文件名允许的 ISO9660 字符。然而，Apple 扩展确实提供了文件在磁盘上打包更高效的优势，可能在\
  \ CD 上容纳更多文件。\n\n\n\n在可能的情况下，将与 Apple/Unix 文件一起存储的 HFS 文件名用于 CD 的 HFS 部分。然而，并非所有的\
  \ Apple/Unix 编码都会通过 `finderinfo` 存储 HFS 文件名。在这些情况下，将使用 Unix 文件名 —— 并对特殊字符进行转义。特殊字符包括\
  \ `'/'` 和代码大于 127 的字符。\n\nAUFS 使用 `:'` 后跟两个十六进制数字的字符代码来转义这些字符。Netatalk 和 EtherShare\
  \ 采用类似的方案，但使用的是 `%'` 而不是 `:`。\n\n如果 `genisoimage` 无法找到 HFS 文件名，它将使用 Unix 名称，并将任何\
  \ `%xx` 或 `*:xx` 字符（`xx` 为两个十六进制数字）转换为单个字符代码。如果 `xx` 不是十六进制数字（`[0-9a-fA-F]`），则将其保持原样——尽管任何剩余的\
  \ `:'` 会转换为 `%'`，因为 `:'` 是 HFS 的目录分隔符。必须小心，因为带有 `%xx` 或 `*:xx` 的普通 Unix 文件也会被转换。例如：\n\
  \n| This:2fFile | 转换为 This/File |\n| | |\n| This:File | 转换为 This%File |\n| | |\n\
  | This:t7File | 转换为 This%t7File |\n\n尽管 HFS 文件名似乎支持大写和小写写字母，但该文件系统是不区分大小大小的，即文件名\
  \ `aBc` 和 `AbC` 是相同的。如果在目录中找到具有相同 HFS 名称的文件，`genisoimage` 将尝试通过在其中一个文件名后添加 `_` 字符创建一个唯一名称。\n\
  \n如果文件存在 HFS 文件名，`genisoimage` 可以使用 `-mac-name` 将此名称作为 ISO9660、Joliet 和 Rock Ridge\
  \ 文件名的起始点。没有 HFS 名称的普通 Unix 文件仍将使用其 Unix 名称。例如：\n\n如果一个 MacBinary（或 PC Exchange）文件以\
  \ `someimage.gif.bin` 存储在 Unix 文件系统上，但它包含一个名为 `someimage.gif` 的 HFS 文件，则这将出现在 CD\
  \ 的 HFS 部分的名称。然而，由于 `genisoimage` 使用 Unix 名称作为其他名称的起始点，生成的 ISO9660 名称可能是 `SOMEIMAG.BIN`，而\
  \ Joliet/Rock Ridge 将是 `someimage.gif.bin`。此选项将使用 HFS 文件名作为起始点，ISO9660 名称可能是 `SOMEIMAG.GIF`，而\
  \ Joliet/Rock Ridge 将是 `someimage.gif`。\n\n`-mac-name` 目前无法与 `-T` 配合使用——`TRANS.TBL`\
  \ 文件中使用 Unix 名称，而不是 Macintosh 名称。\n\n用于将任何 HFS 文件名转换为 Joliet/Rock Ridge 文件名的字符集默认为\
  \ `cp10000` (Mac Roman)。可以使用 `-input-hfs-charset` 指定使用的字符集。其他内置的 HFS 字符集包括：`cp10006`\
  \ (MacGreek)、`cp10007` (MacCyrillic)、`cp10029` (MacLatin2)、`cp10079` (MacIcelandandic)\
  \ 和 `cp10081` (MacTurkish)。\n\n注意：来自各种 Apple/Unix 格式的 HFS 文件名使用的字符代码将不会转换，因为它们被假设处于正确的\
  \ Apple 字符集中。只有从 HFS 文件名派生的 Joliet/Rock Ridge 名称会被转换。\n\n现有的 `genisoimage` 代码将过滤掉\
  \ ISO9660 和 Joliet 文件名的任何非法字符，但由于 `genisoimage` 期望直接处理 Unix 名称，它让 Rock Ridge 名称保持不变。但由于\
  \ `'/'` 是合法的 HFS 文件名字符，`-mac-name` 在 Rock Ridge 文件名中将 `'/'` 转换为 `_`。\n\n如果使用了 Apple\
  \ 扩展，只有 ISO9660 文件名会出现在 Macintosh 上。然而，由于 Macintosh ISO9660 驱动可以使用 `Level 2` 文件名，你可以在\
  \ Macintosh 上无问题地使用 `-allow-multidot` 等选项——但仍需小心名称，例如，`this.file.name` 将转换为 `THIS.FILE`（即只有一个\
  \ `.`），同样文件名 `abcdefgh` 将被视为 `ABCDEFGH`，但 `abcdefghi` 将被视为 `ABCDEFGHI.`（即末尾有一个 `.`）——不知道这是\
  \ Macintosh 的问题还是 `genisoimage`/`mkhybrid` 的问题。在 Macintosh 上查看时，所有文件名都将是大写的。当然，DOS/Win.3.X\
  \ 机器将无法看到 Level 2 文件……\n\n## HFS 自定义卷/文件夹图标\n\n若要为 HFS CD 提供自定义图标，请确保根（顶层）文件夹包含一个标准的\
  \ Macintosh 卷图标文件。在 Macintosh 上为卷提供自定义图标，必须在卷的“Get Info”框中将图标粘贴到卷图标上。这会在根目录中创建一个名为\
  \ `Icon\\r` 的不可见文件（`\\r` 是回车字符）。\n\n自定义文件夹图标非常相似——文件夹本身存在一个名为 `Icon\\r` 的不可见文件。\n\
  \n创建一个 `genisoimage` 可以使用的自定义图标，可能简单的方法是在 Mac 上格式化一张空白的 HFS 软盘，并将图标粘贴到它的“Get Info”框中。如果使用安装了\
  \ HFS 模块的 Linux，在 Mac 上格式化一张空白的 HFS 软盘并将图标粘贴到其“Get Info”框。\n\n若要在 Macintosh 上为卷提供自定义图标，必须在卷的“Get\
  \ Info”框中将图标粘贴到卷图标上。这会在根目录中创建一个名为 `Icon\\r` 的不可见文件（`\\r` 是回车字符）。\n\n自定义文件夹图标非常相似——文件夹本身存在一个名为\
  \ `Icon\\r` 的不可见文件。\n\n创建一个 `genisoimage` 可以使用的自定义图标，可能简单的方法是在 Mac 上格式化一张空白的 HFS\
  \ 软盘，并将图标粘贴到它的“Get Info”框中。如果使用安装了 HFS 模块的 Linux，在 Mac 上格式化一张空白的 HFS 软盘并将图标粘贴到其“Get\
  \ Info”框。\n\n## HFS 自定义卷/文件夹图标\n\n内置的 HFS 字符集包括：`cp10006` (MacGreek)、`cp10007` (MacCyrillic)、`cp10029`\
  \ (MacLatin2)、`cp10079` (MacIcelandandic) 和 `cp10081` (MacTurkish)。注意：来自各种 Apple/Unix\
  \ 格式的 HFS 文件名使用的字符代码将不会转换，因为它们被假设处于正确的 Apple 字符集中。只有从 HFS 文件名派生的 Joliet/Rock Ridge\
  \ 名称会被转换。\n\n现有的 `genisoimage` 代码将过滤掉 ISO9660 和 Joliet 文件名的任何非法字符，但由于 `genisoimage`\
  \ 期望直接处理 Unix 名称，它让 Rock Ridge 名称保持不变。但由于 `'/'` 是合法的 HFS 文件名字符，`-mac-name` 在 Rock\
  \ Ridge 文件名中将 `'/'` 转换为 `_`。\n\n如果使用了 Apple 扩展，只有 ISO9660 文件名会出现在 Macintosh 上。然而，由于\
  \ Macintosh ISO9660 驱动可以使用 `Level 2` 文件名，你可以在 Macintosh 上无问题地使用 `-allow-multidot`\
  \ 等选项——但仍需小心名称，例如，`this.file.name` 将转换为 `THIS.FILE`（即只有一个 `.`），同样文件名 `abcdefgh`\
  \ 将被视为 `ABCDEFGH`，但 `abcdefghi` 将被视为 `ABCDEFGHI.`（即末尾有一个 `.`）——不知道这是 Macintosh 的问题还是\
  \ `genisoimage`/`mkhybrid` 的问题。在 Macintosh 上查看时，所有文件名都将是大写的。当然，DOS/Win.3.X 机器将无法看到\
  \ Level 2 文件……\n\n若要为 HFS CD 提供自定义图标，请确保根（顶层）文件夹包含一个标准的 Macintosh 卷图标文件。在 Macintosh\
  \ 上为卷提供自定义图标，必须在卷的“Get Info”框中将图标粘贴到卷图标上。这会在根目录中创建一个名为 `Icon\\r` 的不可见文件（`\\r` 是回车字符）。\n\
  \n自定义文件夹图标非常相似——文件夹本身存在一个名为 `Icon\\r` 的不可见文件。\n\n创建一个 `genisoimage` 可以使用的自定义图标，可能简单的方法是在\
  \ Mac 上格式化一张空白的 HFS 软盘，并将图标粘贴到它的“Get Info”框中。如果使用安装了 HFS 模块的 Linux，在 Mac 上格式化一张空白的\
  \ HFS 软盘并将图标粘贴到其“Get Info”框。\n\n```\nmount -t hfs /dev/fd0\n```\n\n## EL TORITO\
  \ 启动信息表\n当给出 `-boot-info-table` 时，`genisoimage` 将在 `-b` 指定的文件偏移 8 处插入一个 56 字节的*启动信息表*。此修改是在源文件系统中进行的，因此如果此文件无法重新创建，请确保使用副本！此文件包含在启动时可能无法或无法可靠获取的指针。\n\
  \n此表的格式如下；所有整数均采用节 7.3.1（小端）格式。\n\n| 偏移 | 名称 | 大小 | 含义 |\n| :--- | :--- | :--- |\
  \ :--- |\n| 8 | bi_pvd | 4 字节 | 主卷描述符的 LBA |\n| 12 | bi_file | 4 字节 | 启动文件的 LBA\
  \ |\n| 16 | bi_length | 4 字节 | 以字节为单位的启动长度 |\n| 20 | bi_csum | 4 字节 | 32 位校验和 |\n\
  | 24 | bi_reserved | 40 字节 | 预留 |\n\n32 位校验和是从字节偏移 64 开始的所有 32 位字之和。所有线性块地址 (LBA)\
  \ 均以 CD 扇（通常为 2048 字节）给出。\n\n\n\n\n要为 HPPA 创建一个可启动 CD，至少必须指定一个引导程序文件（`-hppa-bootloader`）、一个内核镜像文件（取决于硬件的\
  \ 32 位、64 位或两者兼有）以及启动命令行（`-hppa-cmdline`）。某些系统可以启动 32 位或 64 位的内核，如果两者都存在，固件将选择其中一个。可选地，可以使用\
  \ `-hppa-cmdline` 使用 `ramdisk` 作为根文件系统。\n\n# JIGDO 说明\n\nJigdo 是一种帮助分发 CD 和 DVD\
  \ 镜像等大文件的工具；详情请参见相关说明。Debian CD 和 DVD ISO 镜像以 jigdo 格式发布在网络上，以便终端用户更高效地下载。\n\n要在使用\
  \ `genisoimage` 创建 ISO 镜像的同时创建 jigdo 和模板文件，你必须首先生成一个将要使用的文件列表，格式如下：\n\n`MD5sum File\
  \ size Path 32 chars 12 chars to end of line`\n\n`MD5sum` 必须以标准十六进制格式写入，文件大小必须列出以字节为单位的大小，路径必须列出文件的绝对路径。例如：\n\
  \n```\n00006dcd58ff0756c36d2efae21be376 14736 /mirror/debian/file1 000635c69b254a1be8badcec3a8d05c1\
  \ 211822 /mirror/debian/file2 00083436a3899a09633fc1026ef1e66e 22762 /mirror/debian/file3\n\
  ```\n\n一旦你有了这个文件，请带上所有常规命令行参数调用 `genisoimage`。使用 `-jigdo-jigdo` 和 `-jigdo-template`\
  \ 指定 jigdo 和模板文件的输出文件名，并通过 `-md5-list` 传入你的 MD5 列表的位置。\n\n如果有你**不希望**加入 jigdo 文件中的文件（例如，它们可能经常变化），请使用\
  \ `-jigdo-exclude` 指定这些文件。如果你想在文件写入镜像时验证某些文件，请使用 `-jigdo-force-md5` 指定它们。如果任何文件不匹配，`genisoimage`\
  \ 将中止执行。这两个选项都接受正则表达式作为输入。还可以根据大小进一步限制将要使用的文件集——使用 `-jigdo-min-file-size` 选项。\n\n\
  最后，jigdo 代码需要知道如何将给定的文件映射到镜像风格配置上。使用 `-jigdo-map` 指定如何映射路径。使用 `Debian=/mirror/debian`\
  \ 将导致所有以 `/mirror/debian` 开头的路径映射到输出 jigdo 文件中的 `Debian:<file>*`。\n\n## 示例\n\n要在文件\
  \ `cd.iso` 中创建一个纯的 ISO9660 文件系统镜像，其中目录 `cd_dir` 将成为 CD 的根目录，请调用：\n\n```\ngenisoimage\
  \ -o cd.iso cd_dir\n```\n\n创建一个带有源目录 `cd_dir` Rock Ridge 扩展的 CD：\n\n```\ngenisoimage\
  \ -o cd.iso -R cd_dir\n```\n\n创建一个带有源目录 `cd_dir` Rock Ridge 扩展的 CD，其中所有文件至少具有读权限且所有文件的所有者均为\
  \ `root`，调用：\n\n```\ngenisoimage -o cd.iso -r cd_dir\n```\n\n将 tar 归档直接写入 CD，该 CD\
  \ 之后将包含带有该 tar 归档的简单 ISO9660 文件系统：\n\n```\ntar cf - . | genisoimage -stream-media-size\
  \ 333000 | \\\n    wodim dev=b,t,l -dao tsize=333000s -\n```\n\n创建一个带有源目录 `cd_dir`\
  \ Joliet 和 Rock Ridge 扩展的 HFS 混合 CD：\n\n```\ngenisoimage -o cd.iso -R -J -hfs cd_dir\n\
  ```\n\n从源目录 `cd_dir` 创建一个包含 Netatalk Apple/Unix 文件的 HFS 混合 CD：\n\n```\ngenisoimage\
  \ -o cd.iso --netatalk cd_dir\n```\n\n从源目录 `cd_dir` 创建一个 HFS 混合 CD，仅根据文件 \"mapping\"\
  \ 中列出的文件名扩展名为所有文件赋予 `CREATOR` 和 `TYPES`：\n\n```\ngenisoimage -o cd.iso -map mapping\
  \ cd_dir\n```\n\n从源目录 `cd_dir` 和 `another_dir` 创建带有 Apple 扩展的 ISO9660 CD。所有已知的 Apple/Unix\
  \ 格式的文件都会解码，任何其他文件将根据文件 `magic` 提供的魔数数（magic number）赋予 `CREATOR` 和 `TYPE`：\n\n```\n\
  genisoimage -o cd.iso -apple -magic magic -probe \\\n    cd_dir another_dir\n```\n\
  \n以下示例将不同的文件放在 CD 上，这些文件都名为 README，但在被视为 ISO9660/Rock Ridge、Joliet 或 HFS CD 时，它们的内容不同。\n\
  \n当前目录包含：\n\n```\nls -F\nREADME.hfs README.joliet README.Unix cd_dir/\n```\n\n以下命令将\
  \ `cd_dir` 目录的内容放在 CD 上，并带有：\n\n```\ngenisoimage -o cd.iso -R -J -hfs cd_dir\n```\n\
  \n\n\n\n\n在使用多会话选项 `-M` 和 `-C` 创建 HFS 卷时，只有最后一个会话中的文件会位于 HFS 卷中。也就是说，`genisoimage`\
  \ 无法*添加*来自之前会话的现有文件到 HFS 卷。\n\n然而，如果每个会话都使用 `-part` 创建，则每个会话在 Mac 上挂载时将显示为独立的卷。在这种情况下，建议使用\
  \ `-V` 或 `-hfs-volid` 为每个会话指定一个唯一的卷名称，否则每个“卷”将以相同的名称出现在桌面上。\n\n符号链接（与所有其他非普通文件一样）不会被添加到\
  \ HFS 目录中。\n\n混合卷可能比包含相同数据的纯 ISO9660 卷大。在某些情况下（例如 DVD 尺寸的卷），这种差异可能是显著的。随着 HFS 卷的变大，分配块大小（文件可以占据的最小空间单位）也会随之增大。对于\
  \ 650MB 的 CD，分配块为 10kB；对于 4.7GB 的 DVD，它约为 70kB。\n\nHFS 卷中的文件最大数量约为 65500 --- 尽管实际限制会比此小。\n\
  \n可以使用 `hfsutils` 常程在 Unix 机器上访问生成的混合卷。然而，无法对卷进行任何更改，因为它被设置为**锁定**状态。`-hfs-unlock`\
  \ 选项将创建一个未锁定的输出镜像 --- 但是，不应对卷的内容进行任何更改（除非你真的知道自己在做什么），因为它不是一个“真正的” HFS 卷。\n\n`-mac-name`\
  \ 目前无法与 `-T` 配合使用 --- `TRANS.TBL` 文件将使用 Unix 名称，而不是 Macintosh 名称。\n\n尽管 `genisoimage`\
  \ 不会修改文件内容，但如果二进制文件的 `TYPE` 设置为 `TEXT`，在 Macintosh 上*可能*被错误地读取。因此，默认 `TYPE` 的更好可能是\
  \ `????`。\n\n`-mac-boot-file` 可能完全不起作用...\n\n可能无法与 PC Exchange v2.2 或更高版本的文件配合（MacOS\
  \ 8.1 提供）。在使用 Linux 时，包含 PC Exchange 文件的 DOS 介质应挂载为 `msdos` 类型（而不是 `vfat`）。\n\n\
  SFM 格式仅得到部分支持 --- 请参见上文 **HFS MACINTOSH FILE FORMATS** 章节。\n\n无法结合 `-boot-hfs-file`\
  \ 或 `-prep-boot` 使用 `-sparc-boot` 或 `-generic-boot`。\n\n`genisoimage` 应该能够创建超过 4Gb\
  \ 的 HFS 混合镜像，尽管尚未经过充分测试。\n\n## 参见\n\n(5), (1), (8), (5)。\n\n## 作者\n\n`genisoimage`\
  \ 衍生自 2006 年 5 月 `cdrtools 2.01.01a08` 包中的 `mkisofs`（提取了来自 2007 年 3 月 `cdrtools\
  \ 2.01.01a24` 的少量更新），来自 .IR ，但现在是 `cdrkit` 工具套件的一部分，由 Joerg Jaspert, Eduard Bloch,\
  \ Steve McIntyre, Peter Samuelson, Christian Fromme, Ben Hutchings 以及其他贡献者维护。可以通过以下方式联系维护者，或访问\
  \ `cdrkit` 项目网站 。\n\nEric Youngdale 编写了 `mkisofs` 的早期版本（1993-1998）。Jörg Schilling\
  \ 编写了 SCSI 传输库及其接口，并自 1999 年以来维护了 `mkisofs`。James Pearson 编写了 HFS 混合代码，使用了 Robert\
  \ Leslie 的 `libhfs`。Pearson, Schilling, Jungshik Shin 和 Jaakko Heinonen 为字符集转换代码做出了贡献。`cdrkit`\
  \ 维护者自 2006 年以来维护了 `genisoimage`。\n\n```\nCopyright 1993-2007 The Authors.\nAll\
  \ rights reserved.\n```\n\n\n\nGOST R 34.10 算法参数文件是可选的。可以在密钥密钥期间指定参数，也可以在生成参数文件时指定。\n\
  \n`paramset:name`\n\n根据 RFC 4357 指定 GOST R 34.10-2001 参数集。可以使用缩写名称、对象短名称或数字 OID\
  \ 来指定参数集。支持以下参数集：\n\n`paramset OID Usage A 1.2.643.2.2.35.1 Signature B 1.2.643.2.2.35.2\
  \ Signature C 1.2.643.2.2.35.3 Signature XA 1.2.643.2.2.36.0 Key exchange XB 1.2.643.2.2.36.1\
  \ Key exchange test 1.2.643.2.2.35.0 Test purposes`\n\n## 注意事项\n\n建议使用 `genpkey`\
  \ 程序而非特定算法工具，因为可以使用额外的算法选项和 ENGINE 提供的算法。\n\n## 示例\n\n使用默认参数生成 RSA 私钥：\n\n```\n\
  openssl genpkey -algorithm RSA -out key.pem\n```\n\n使用 128 位 AES 和密码 'hello' 加密输出私钥：\n\
  \n```bash\nopenssl genpkey -algorithm RSA -out key.pem -aes-128-cbc -pass pass:hello\n\
  ```\n\n使用 3 作为公指数生成 2048 位 RSA 密钥：\n\n```\nopenssl genpkey -algorithm RSA -out key.pem\
  \ -pkeyopt rsa_keygen_bits:2048 \\ -pkeyopt rsa_keygen_pubexp:3\n```\n\n生成 1024\
  \ 位 DSA 参数：\n\n```\nopenssl genpkey -genparam -algorithm DSA -out dsap.pem \\ -pkeyopt\
  \ dsa_paramgen_bits:1024\n```\n\n从参数生成 DSA 密钥：\n\n```bash\nopenssl genpkey -paramfile\
  \ dsap.pem -out dsakey.pem\n```\n\n生成 1024 位 DH 参数：\n\n```bash\nopenssl genpkey\
  \ -genparam -algorithm DH -out dhp.pem \\ -pkeyopt dh_paramgen_prime_len:1024\n\
  ```\n\n输出带有 224 位子群的 RFC5114 2048 位 DH 参数：\n\n```bash\nopenssl genpkey -genparam\
  \ -algorithm DH -out dhp.pem -pkeyopt dh_rfc5114:2\n```\n\n从参数生成 DH 密钥：\n\n```bash\n\
  openssl genpkey -paramfile dhp.pem -out dhkey.pem\n```\n\n# GENRSA\n\n## 名称\n\n\
  `genrsa` - 生成 RSA 私钥\n\n## 语法\n\n`openssl genrsa [-out filename]` `[-passout arg]`\
  \ `[-aes128]` `[-aes128]` `[-aes192]` `[-aes256]` `[-camellia128]` `[-camellia192]`\
  \ `[-camellia256]` `[-aes192]` `[-aes256]` `[-camellia128]` `[-camellia192]` `[-camellia256]`\
  \ `[-des]` `[-des3]` `[-idea]` `[-f4]` `[-3]` `[-rand file(s)]` `[-engine id]` `[numbits]`\n\
