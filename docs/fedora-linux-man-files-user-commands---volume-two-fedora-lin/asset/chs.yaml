  \n默认为自动，对于滑动设备选择第一个可用手指，对于压力设备则选择所有录入的手指。\n\n## 测试应用程序\n\n### fprintd-enroll\n将用户的右手食指录入数据库。\n\
  \n### fprintd-list\n列出用户已录入的指纹。\n\n### fprintd-verify\n将用户的右手食指录入数据库。\n\n### fprintd-enroll\n\
  将用户的右手食指录入数据库。\n\n## 属性\n`fprintd` 由 Bastien Nocera 和 Daniel Drake 编写。\n\n## 目录\n\
  默认情况下，`fprintd` 将指纹存储在 `/var/lib/fprint/`。\n\n## 参见\n`dbus-daemon`, `gnome-about-me`\n\
  \n* *\n\n# FREE\n\n## 名称\n`free` - 显示系统中空闲和已使用的内存量\n\n## 语法\n`free` [-options]\n\
  \n## 描述\n`free` 显示系统中空闲和已使用的物理及交换内存总量，以及内核使用的缓冲区（buffers）和缓存（caches）。这些信息通过解析 `/proc/meminfo`\
  \ 获取。显示的列如下：\n\n**total**\n已安装的内存总量（`/proc/meminfo` 中的 `MemTotal` 和 `SwapTotal`）\n\
  \n**used**\n已使用的内存（计算方式为 `total` - `free` - `buffers` - `cache`）\n\n**free**\n未使用的内存（`/proc/meminfo`\
  \ 中的 `MemFree` 和 `SwapFree`）\n\n**shared**\n（主要）由 `tmpfs` 使用的内存（`/proc/meminfo`\
  \ 中的 `Shmem`，内核 2.6.32 及以上版本可用，不可用时显示为零）\n\n**buffers**\n内核缓冲区使用的内存（`/proc/meminfo`\
  \ 中的 `Buffers`）\n\n**cache**\n页缓存（page cache）和插槽缓存（slabs）使用的内存（`/proc/meminfo` 中的\
  \ `Cached` 和 `Slab`）\n\n**buff/cache**\n`buffers` 和 `cache` 的总和\n\n**available**\n\
  估计启动新应用程序时在无需交换的情况下可用内存量。与 `cache` 或 `free` 字段的数据不同，此字段考虑了页缓存，并且考虑到并非所有可回收的内存 slabs\
  \ 会因为项目正在使用而无法回收（`/proc/meminfo` 中的 `MemAvailable`，内核 3.14 及以上版本可用，2.6.27+ 版本进行模拟，否则等同于\
  \ `free`）\n\n### 选项\n`-b`, `--bytes`\n以字节（bytes）显示内存量。\n\n`-k`, `--kilo`\n以千字节（kilobytes）显示内存量。这是默认值。\n\
  \n`-m`, `--mega`\n以兆字节（megabytes）显示内存量。\n\n`-g`, `--giga`\n以吉字节（gigabytes）显示内存量。\n\
  \n`--tera`\n以字节显示内存量。\n\n所有输出字段自动缩放至最短的三位单位，并显示输出单位。使用以下单位：\n`B = bytes K = kilos\
  \ M = megas G = gigas T = teras`\n如果单位缺失，且你有拍字节级的 RAM 或交换内存，数字将以 TB 计算，且列可能与表头不对齐。\n\
  \n`-w`, `--wide`\n切换到宽模式。宽模式产生的行长度超过 80 个字符。在此模式下，`buffers` 和 `cache` 在两个独立的列报告。\n\
  \n`-c`, `--count` *count*\n显示结果 *count* 次。需要 `-s` 选项。\n\n`-l`, `--lohi`\n显示详细的低、高内存统计信息。\n\
  \n`-s`, `--seconds` *seconds*\n每隔 *seconds* 连续显示结果。你可以为 *delay* 指定任何浮点数，使用 `usleep(3)`\
  \ 用于微秒级延迟时间。\n\n`--si`\n使用 1000 的幂而非 1024。\n\n`-t`, `--total`\n显示显示列总计的行。\n\n`--help`\n\
  打印帮助信息。\n\n`-V`, `--version`\n显示版本信息。\n\n# 文件\n`/proc/meminfo`\n内存信息\n\n## 参见\n\
  `ps`(1), `slabtop`(1), `top`(1), `vmstat`(8)。\n\n## 作者\n由 Brian Edmonds 编写。\n\n\
  ## 报告 Bug\n请将错误报告发送至\n\n* *\n\n# fros\n\n## 名称\n`fros` - 通用屏幕共享前端，支持多种后端的插件化\n\n\
  ## 语法\n`fros [-h] [--v] [--is-available]`\n\n## 描述\n`fros` 通用屏幕共享前端，支持多种后端的插件化。目标是为尽可能多的屏幕共享后端提供统一访问，同时保持相同的用户界面，以便使用户在不同桌面和屏幕共享程序之间的体验是无缝的。\n\
  \n### 选项\n`-h`, `--help`\n显示帮助信息并退出\n\n`-v`, `--verbose`\n使输出更详细/话多\n\n`--is-available`\n\
  检查当前环境是否支持屏幕共享（0:可用，1: 不可用）\n\n## 属性\nJiri Moskovc <jmoskovc at redhat dot com>\n\
  \n## 参见\n`mydesktop`(1)\n\n* *\n\n# FUNZIP\n\n## 名称\n`funzip` - 从 ZIP 存档中提取的过滤器\n\
  \n## 语法\n`funzip [-password] [input.gz]`\n\n## 参数\n`[-password]`\n如果 ZIP 存档加密，所需的密码。参见描述。\n\
  \n`[input.gz]`\n可选输入文件。参见描述。\n\n## 描述\n`funzip` 不带文件参数作为过滤器；即它假设 ZIP 存档（或 `gzip`(1)\
  \ 文件）被管道到 stdin，并将第一个成员提取到 stdout。当 stdin 来自终端时，*funzip* 假设这不是一个二进制数据流。如果存在文件参数，*funzip*\
  \ 从指定的文件读取。\n\n加密文件的密码可以在命令行指定。注意这在许多系统上存在安全风险；当前运行的进程可以通过 `ps`(1) 查看。\n\n## 示例\n\
  使用 *funzip* 提取 test.zip 的第一个成员并管道到 `more`(1)：\n```\nfunzip test.zip | more\n```\n\
  使用 *funzip* 测试 test.zip 的第一个成员（任何错误将报告到标准错误）：\n```\nfunzip test.zip > /dev/null\n\
  ```\n使用 *zip* 和 *funzip* 代替 *compress*(1) 和 *zcat*(1)（或 *gzip*(1L) 和 *gzcat*(1L））进行磁带备份：\n\
  ```\ntar cf - . | zip -7 | dd of=/dev/nrst0 obs=8k dd if=/dev/nrst0 ibs=8k | funzip\
  \ | tar xf -\n```\n（例如，nrst0 是 SCSI 磁带驱动器）。\n\n BUG\n当管道一个加密文件并允许 *funzip* 提示密码时，终端有时会被重置为无显示模式。这显然由于两个程序之间的竞态条件引起的；*funzip*\
  \ 在 *more* 读取状态之前更改了终端模式，然后 *more* 将恢复到该模式。要恢复，对同一文件运行 *funzip* 但重定向到 /dev/null\
  \ 而不是管道到 more；在再次提示密码后，*funzip* 将正确重置终端。\n\n目前无法从 ZIP 存档中提取第一个以外的任何成员。这在 ZIP 存档包含在另一个存档的情况下有用。如果第一个成员是目录，*funzip*\
  \ 只创建该目录并退出。\n\n*funzip* 的功能应整合到 *unzip*get 中（未来版本）。\n\n## 参见\n`gzip`(1L), `unzip`(1L),\
  \ `unzipsfx`(1L), `zip`(1L), `zipcloak`(1L), `zipinfo`(1L), `zipnote`(1L), `zipsplit`(1L)\n\
  \n\n\n\n\nInfo-ZIP 的主页目前位于 `http://www.info-zip.org/pub/infozip/` 或 `ftp://ftp.info-zip.org/pub/infozip/`。\n\
  \n## 作者\n\nMark Adler (Info-ZIP)\n\n***\n\n# FUSER\n\n## 名称\n\n`fuser` - 识别使用文件或套接字的进程\n\
  \n## 语法\n\n`fuser` [`-fuv`] [`-a`|`-s`] [`-4`|`-6`] [`-c`|`-m`|`-n` *space*] [`\
  \ -k` [`-i`] [`-M`] [`-w`] [`-*SIGNAL*] ] *name* ...\n\n`fuser` -l\n\n`fuser` -V\
  \ \n\n## 描述\n\n`fuser` 显示使用指定文件或文件系统的 PID。在默认显示模式下，每个文件名后面都会跟着一个表示访问类型的字母：\n\n`c`\n\
  \n当前目录。\n\n`e`\n\n正在运行的可执行文件。\n\n`f`\n\n打开的文件。在默认显示模式下省略 `f`。\n\n`F`\n\n用于写入的打开文件。在默认显示模式下省略\
  \ `F`。\n\n`r`\n\n根目录。\n\n`m`\n\nmmap 映射的文件或共享库。\n\n如果没有访问任何指定的文件，或者发生致命错误，`fuser`\
  \ 将返回非零状态码。如果发现至少一次访问，`fuser` 返回零。\n\n为了查找使用 TCP 和 UDP 套接字的进程，必须使用 `-n` 选项选择相应的命名空间。默认情况下，`fuser`\
  \ 会同时查找 IPv6 和 IPv4 套接字。如需更改默认行为，请使用 `-4` 和 `-6` 选项。可以通过本地和远程端口以及远程地址来指定套接字。所有字段均为可选，但缺失字段前的逗号必须存在：\n\
  \n`[`lcl_port`][,`[`rmt_host`][,`[`rmt_port`]]]`\n\n**用作 IP 地址和端口号可以使用符号值或数值值。**\n\
  \n`fuser` 仅将 PID 输出到 stdout，其他所有内容发送到 stderr。\n\n### 选项\n\n`-a`, `--all`\n\n显示命令行上指定的所有文件。默认情况下，只显示至少一个进程访问的文件。\n\
  \n`-c`\n\n与 `-m` 选项相同，用于 POSIX 兼容性。\n\n`-f`\n\n静默忽略，用于 POSIX 兼容性。\n\n`-k`, `--kill`\n\
  \n杀死访问文件的进程。除非通过 `-SIGNAL*` 更改，否则发送 SIGKILL。`fuser` 进程永远不会杀死自己，但可能会杀死其他 `fuser`\
  \ 进程。在尝试杀死之前，执行 `fuser` 的进程的有效用户 ID 设置为真实用户 ID。\n\n`-i`, `--interactive`\n\n在杀死进程之前询问用户确认。如果没有\
  \ `-k`，此选项将被静默忽略。\n\n`-l`, `--list-signals`\n\n列出所有已知信号名称。\n\n`-m` *NAME*, `--mount`\
  \ *NAME*\n\n*NAME* 指定挂载文件系统上的文件或挂载的块设备。列出访问该文件系统文件的所有进程。如果指定了目录文件，它会自动变为 *NAME*/，以便使用可能挂载在该目录上的任何文件系统。\n\
  \n`-M`, `--ismountpoint`\n\n仅当 *NAME* 指定挂载点时，请求才会执行。这是一个无价的安全带，可以防止在 *NAME* 恰好不是文件系统时杀掉机器。\n\
  \n`-w`\n\n只杀死具有写权限的进程。如果没有 `-k`，此选项将被静默忽略。\n\n`-n` *SPACE*, `--namespace` *SPACE*\n\
  \n选择不同的命名空间。支持 `file`（文件名，默认）、`udp`（本地 UDP 端口）和 `tcp`（本地 TCP 端口）命名空间。对于端口，可以使用端口号或符号名称。如果没有歧义，可以使用快捷记法\
  \ *name*/***space*（例如 *80*/***tcp*）。\n\n`-s`, `--silent`\n\n静默操作。在此模式下将忽略 `-u` 和\
  \ `-v`。`-a` 不能与 `-s` 一起使用。\n\n`-SIGNAL*`\n\n在杀死进程时使用指定的信号代替 SIGKILL。可以通过名称（例如 `-HUP`）或数字（例如\
  \ `-1`）指定信号。如果没有使用 `-k` 选项，此选项将被静默忽略。\n\n`-u`, `--user`\n\n在每个 PID 后附加进程所有者的用户名。\n\
  \n`-v`, `--verbose`\n\n详细模式。以类似 `ps` 的样式显示进程。PID、USER 和 COMMAND 字段与 `ps` 类似。ACCESS\
  \ 显示进程如何访问文件。详细模式还会显示特定文件何时作为挂载点、nfs 导出或交换文件被访问。在这种情况下，显示 `kernel` 而不是 PID。\n\n\
  `-V`, `--version`\n\n显示版本信息。\n\n`-4`, `--ipv4`\n\n仅搜索 IPv4 套接字。此选项不能与 `-6` 选项一起使用，且仅对\
  \ tcp 和 udp 命名空间有效。\n\n`-6`, `--ipv6`\n\n仅搜索 IPv6 套接字。此选项不能与 `-4` 选项一起使用，且仅对 tcp\
  \ 和 udp 命名空间有效。\n\n`-`\n\n重置所有选项并将信号恢复 SIGKILL。\n\n# 文件\n\n`/proc`\n\nproc 文件系统的位置\n\
  \n## 示例\n\n`fuser -km /home`\n\n杀死所有访问 `/home` 文件系统的进程。\n\n`if fuser -s /dev/tty1;\
  \ then something; else fi`\n\n如果没有使用 `/dev/tty1` 的进程，调用 `something`。\n\n`fuser telnet/tcp`\n\
  \n显示所有使用 TELNET 端口的进程。\n\n## 限制\n\n访问相同文件或文件系统的进程只会显示一次。如果在命令行上指定了多个相同的文件，其中某些可能会被忽略。`fuser`\
  \ 可能只能在具有权限的情况下获取部分信息。结果是，其他用户打开的文件可能不会列出，可执行文件可能会被归类为此。（注：由于原文中存在大量重复的段落，此处已根据“不要重复输出原文”原则进行了处理）。\n\
  \n\n\n\n\n此程序遵循标准的 GNU 命令行语法，长选项以两个横杠（`-`）开头。以下包含了选项摘要。\n\n--help\n显示选项摘要。\n\n--verbose\n\
  显示额外的调试信息。\n\n--allow-reinstall\n允许重新安装现有的固件版本。\n\n--allow-older\n允许将固件版本降级。\n\n\
  --offline\n在可能的情况下离线执行。\n\n## Commands\n\n此程序接受带有可变参数的命令。\n\n**get-details**\n获取固件文件的详细信息。\n\
  \n**get-devices**\n获取支持固件更新的硬件列表。\n\n**get-updates**\n获取连接硬件的更新列表。\n\n**update**\n\
  将所有固件更新到最新的可用版本。\n\n**install**\n在此硬件上安装固件文件。\n\n**install-prepared**\n现在安装已准备就的更新。\n\
  \n**clear-results**\n清除上一次更新的结果。\n\n**refresh**\n从远程服务器刷新元数据。\n\n**get-results**\n\
  获取上一次更新的结果。\n\n## Author\n\n本手册页由 Richard Hughes `<richard@hughsie.com>` 编写。\n\n\
  ***\n\n# GAWK\n\n## Name\n`gawk` - 模式扫描和处理语言\n\n## Synopsis\n`gawk` [ POSIX 或 GNU\
  \ 风格选项 ] `-f` *program-file* [ `--` ] file ...\n\n`gawk` [ POSIX 或 GNU 风格选项 ] [\
  \ `--` ] *program-text* file ...\n\n## Description\n`gawk` 是 GNU 项目对 AWK 语言的实现。它符合\
  \ POSIX 1003.1 标准中对语言的定义。此版本基于 Aho、Kernighan 和 Weinberger 所著 *The AWK Programming\
  \ Language* 中的描述。`gawk` 提供了 Brian Kernighan 的 `awk` 当前版本中的额外功能以及许多 GNU 特有的扩展。\n\n\
  命令行由 `gawk` 自身的选项、AWK 程序文本（如果未通过 `-f` 或 `--file` 选项提供）以及要在预定义 AWK 变量 `ARGC` 和 `ARGV`\
  \ 中使用的值组成。\n\n使用 `--profile` 选项调用 `gawk` 时，它开始从程序执行中收集分析统计数据。`gawk` 在此模式下运行较慢，并在完成后自动在\
  \ `awkprof.out` 文件中生成执行分析报告。参见下文的 `--profile` 选项。\n\n`gawk` 还拥有一个集成调试器。通过向命令行提供\
  \ `--debug` 选项可以启动交互式调试会。在此执行模式下，`gawk` 加载 AWK 源代码并提示调试命令。`gawk` 只能对通过 `-f` 选项提供的\
  \ AWK 程序源码进行调试。调试器在 *GAWK: Effective AWK Programming* 中有介绍。\n\n## Option Format\n\
  `gawk` 选项可以是传统的 POSIX 风格单字母选项，也可以 GNU 风格的长选项。POSIX 选项以单个 `-` 开头，而长选项以 `--` 开头。长选项既用于\
  \ GNU 特有的功能，也用于 POSIX 强制的功能。\n\n`gawk` 特有的选项通常以长选项的形式使用。长选项的参数可以通过 `=` 号与选项连接（中间没有空格），或者也可以作为下一个命令行参数提供。长选项可以缩写，只要该缩写保持唯一性。\n\
  \n此外，每个长选项都有一个对应的短选项，因此可以在 `#!` 可执行脚本内部使用该选项的功能。\n\n## Options\n`gawk` 接受以下选项。标准选项列在前面，随后是\
  \ `gawk` 扩展选项，按短选项的字母顺序排序。\n\n`-f *program-file*\n--file *program-file* 从文件 *program-file*\
  \ 读取 AWK 程序源码，而不是从第一个命令行参数。可以使用多个 `-f`（或 `--file`）选项。\n\n`-F *fs*\n--field-separator\
  \ *fs* 使用 `fs` 作为输入字段分隔符（预定义变量 `FS` 的值）。\n\n`-v *var*=*val*\n--assign *var*=*val*\
  \ 在程序开始执行前将值 `val` 赋值给变量 `var`。此类变量对于 AWK 程序的 `BEGIN` 规则可用。\n\n`-b\n--characters-as-bytes\
  \ 将所有输入数据视为单字节字符。换句话说，在尝试将字符串处理多字节字符时，不要关注任何本地化信息。`--posix` 选项会覆盖此选项。\n\n`-c\n--traditional\
  \ 在兼容模式下运行。在兼容模式下，`gawk` 的行为与 Brian Kernighan 的 `awk` 完全相同；不会识别 GNU 特有的扩展。更多信息请参见下文的\
  \ **GNU EXTENSIONS**。\n\n`-C\n--copyright 在标准输出上打印简短版本的 GNU 版权信息并成功退出。\n\n`-d[*file*]\n\
  --dump-variables[=*file*] 将全局变量列表、其类型和最终值打印到 *file*。如果没有提供 `file`，`gawk` 将使用当前目录下的\
  \ `awkvars.out` 文件。\n\n列出所有全局变量是查找程序中拼写错误的好方法。\n\n`-D[*file*]\n--debug[=*file*]\
  \ 启用 AWK 程序的调试。默认情况下，调试器从键盘（标准输入）交互式读取命令。可选的 `file` 参数指定了一个包含命令列表的文件供调试器非交互式执行。\n\
  \n`-e *program-text*\n--source *program-text* 使用 *program-text* 作为 AWK 程序代码。此选项允许将库函数（通过\
  \ `-f` 和 `--file` 选项使用）与命令行输入的源码轻松混合。\n\n`-E *file*\n--exec *file* 与 `-f` 类似，但此选项是最后一个处理的。这应该用于\
  \ `#!` 脚本，特别是 CGI ，以避免从 URL 在命令行传递选项或源码。此选项禁用命令行赋值。\n\n`-g\n--gen-pot 扫描并解析 AWK\
  \ 程序，并在标准输出上生成一个 `.pot`（便对象模板）格式文件，包含程序中所有可本地化的字符串。程序本身不执行。有关 `.pot` 文件的更多信息请参见\
  \ GNU *gettext* 分发。\n\n`-h\n--help 在标准输出上打印可用选项的相对摘要。（根据 *GNU Coding Standards*，这些选项会导致立即成功退出。）\n\
  \n`-i *include-file*\n--include *include-file* 加载 awk 源码库。使用 AWKPATH 环境变量搜索库。如果初始搜索失败，在添加\
  \ `.awk` 后缀后将再次尝试。文件将被加载一次（即消除重复），且代码不构成主程序源码。\n\n`-l *lib*\n--load *lib* 加载共享库\
  \ `lib`。使用 AWKLIBPATH 环境变量搜索库。如果初始搜索失败，在添加平台默认共享库后缀后将再次尝试。预计初始化例程为 `dl_load()`。\n\
  \n`-L [*value*]\n\n\n\n\n\n-   `--lint[=value]` 对可疑或无法移植到其他 AWK 实现的结构提供警告。带有可选参数\
  \ `fatal` 时，lint 警告将变为致命错误。这可能非常剧烈，但它的使用无疑会鼓励编写更整洁的 AWK 程序。带有可选参数 `invalid` 时，仅对对实际上无效的内容发出警告。（目前尚未完全实现。）\n\
  \n-   `-M`\n\n-   `--bignum` 强制对数字使用任意精度算。如果 `gawk` 编译时没有使用 GNU MPFR 和 MP 库，则此选项无效。\n\
  \n-   `-n`\n\n-   `--non-decimal-data` 识别输入数据中的八进制和十六进制值。*谨慎使用此选项！*\n\n-   `-N`\n\
  \n-   `--use-lc-numeric` 这强制 `gawk` 在解析输入数据时使用本地化（locale）小数点字符。虽然 POSIX 标准要求这种行为，且\
  \ `gawk` 在启用 `--posix` 时会这样做，但默认行为是遵循传统习惯使用句号作为小数点，即使在这些区域中句号并不是小数点字符。\n\n此选项覆盖了默认行为，但没有像\
  \ `--posix` 选项那样完全严苛严格。\n\n-   `-o[file]`\n\n-   `--pretty-print[=file]` 将程序的格式化版本输出到\
  \ `file`。如果没有提供 `file`，`gawk` 将使用当前目录下名为 `awkprof.out` 的文件。\n\n-   `-O`\n\n-   `--optimize`\
  \ 针对程序的内部表示启用优化。目前，这包括简单的常量折叠和递归函数的尾调用消除。`gawk` 维护者希望随着时间的推移添加额外的优化。\n\n-   `-p[prof-file]`\n\
  \n-   `--profile[=prof-file]` 启动分析会话，并将分析数据发送到 `prof-file`。默认值为 `awkprof.out`。配置文件在左侧边缘包含程序中每个语句的执行次数，以及每个用户定义函数的调用次数。\n\
  \n-   `-P`\n\n-   `--posix` 开启*兼容*模式，并带有以下额外限制：\n    -   不识别 `\\x` 转义序列。\n    -\
  \   当 `FS` 设置为单个空格时，只有空格和制表符作为字段分隔符，换行符不是。\n    -   不能在 `?` 和 `:` 之后延续行。\n    -\
  \   不识别关键字 `function` 的别名 `func`。\n    -   运算符 `~` 和 `~=` 不能代替 `^` 和 `^=`。\n\n-\
  \   `-r --re-interval` 在正则表达式匹配中使用*区间表达式*（参见下下文的**正则表达式**）。区间表达式在传统的 AWK 语言中并不可用。POSIX\
  \ 标准增加了它们，以使 `awk` 和 `egrep` 彼此保持一致。它们默认启用，但此选项仍保留以供配合 `--traditional` 使用。\n\n-\
  \   `-S --sandbox` 在沙箱模式下运行 `gawk`，禁用 `system()` 函数、通过 `getline` 进行输入重定向、通过 `print`\
  \ 和 `printf` 进行输出重定向以及加载动态扩展。命令执行（通过管道）也被禁用。这有效地阻止了脚本访问本地资源（命令行中指定的文件除外）。\n\n- \
  \  `-t --lint-old` 对无法移植到原始版本 UNIX *awk* 版本的结构提供警告。\n\n-   `-V --version` 在标准输出上打印此特定\
  \ `gawk` 的版本信息。这主要用于判断你系统上的当前 `gawk` 版本是否与自由软件基金分发的版本保持同步。在报告 bug 时也很有用。（根据 *GNU\
  \ 编码规范*，这些选项会导致程序立即成功退出。）\n\n-   `--` 标记选项的结束。这允许于允许 AWK 程序本身的后续参数以 `-` 开头。这与大多数其他\
  \ POSIX 程序所使用的参数解析约定保持一致。\n\n在兼容模式下，任何其他选项都会被标记为无效，但在其他情况下会被忽略。在正常操作下，只要提供了程序文本，未知选项将传递给\
  \ AWK 程序的 `ARGV` 数组进行处理。这对于通过 `#!` 可执行文件解释器机制运行 AWK 程序特别有用。\n\n对于 POSIX 兼容性，可以使用\
  \ `-W` 选项，后跟一个长选项的名称。\n\n## AWK 程序执行\n\n一个 AWK 程序由系列模式-动作语句和可选的函数定义组成。\n\n```\n\
  @include \"filename*\"\n@load \"filename*\" pattern{ action statements }\nfunction\
  \ name(parameter list) { statements }\n```\n\n`Gawk` 首先如果指定，则从 `program-file(s)`、`--source`\
  \ 参数或命令行上的第一个非选项参数读取程序源码。`-f` 和 `--source` 选项可以在命令行上多次使用。`Gawk` 读取程序文本，就像所有的 `program-file`\
  \ 和命令行源文本已经连接在一起了一样。这对于构建 AWK 函数库非常有用，而无需在每个使用它们的新 AWK 程序中包含它们。它还提供了将库函数与命令行程序混合的能力。\n\
  \n此外，以 `@include` 开头的行可以将其他源文件包含到程序中，使库的使用更加简单。这等同于使用 `-i` 选项。\n\n以 `@load` 开头的行可以将共享库加载到程序中。这等同于使用\
  \ `-l` 选项。\n\n环境变量 `AWKPATH` 指定了查找使用 `-f` 和 `-i` 选项命名的源文件时使用的搜索路径。如果该变量不存在，默认路径为\
  \ `.:/usr/local/share/awk`。（实际路径取决于 `gawk` 的构建和安装。）如果给 `-f` 的文件名包含 `/` 字符，则不进行路径搜索。\n\
  \n环境变量 `AWKLIBPATH` 指定了查找使用 `-l` 选项命名的源文件时使用的搜索路径。如果该变量不存在，默认路径为 `/usr/local/lib/gawk`。（实际路径取决于\
  \ `gawk` 的构建和安装。）\n\n*Gawk* 执行 AWK 程序的顺序如下：\n1. 首先通过 `-v` 选项执行变量赋值。\n2. 接下来，`gawk`\
  \ 将程序编译为内部形式。\n3. 然后，`gawk` 执行 `BEGIN` 规则（如果有），然后读取 `ARGV` 数组中的每个文件（直到 `ARGC`）。如果命令行没有命名文件，`gawk`\
  \ 读取标准输入。\n\n如果命令行上的文件名形式为 `var=val`，则被视为变量赋值。变量 `var` 将被赋值 `val`。（这发生在任何 `BEGIN`\
  \ 规则运行之后。）命令行变量赋值对于动态分配 AWK 用于控制输入如何分解字段和记录的变量非常有用。对于需要对单个数据文件进行多次处理时控制状态也有用。\n\n\
  如果 `ARGV` 中特定元素的值为空 `()`，`gawk` 将跳过它。\n\n对于每个输入文件，如果存在 `BEGINFILE` 规则，`gawk` 在处理文件内容之前执行相关代码。同样，`gawk`\
  \ 在处理文件后执行与 `ENDFILE` 关联的代码。\n\n对于输入中的每个记录，`gawk` 测试其是否匹配 AWK 程序中的任何*模式*。对于记录匹配的每个模式，`gawk`\
  \ 执行相应的动作。模式按照它们在程序中顺序进行测试。\n\n最后，在所有输入耗尽后，`gawk` 执行 `END` 规则（如果有）。\n\n\n\n\n\n\
  根据 POSIX 标准，`awk` 命令行中指定的文件必须是文本文件。如果不是，其行为是“未定义”的。大多数 `awk` 版本会将命令行上的目录视为致命错误。\n\
  \n从 `gawk` 4.0 版本开始，命令行上的目录会产生警告，但在其他情况下会被跳过。如果给出 `--posix` 或 `--traditional` 选项，则\
  \ `gawk` 将恢复将命令行上的目录视为致命错误。\n\n## 变量、记录与字段\n\nAWK 变量是动态的；它们在第一次使用时产生。它们的值可以是浮点数、字符串或两者兼有，取决于如何使用它们。AWK\
  \ 仅支持一维数组；多维数组可以通过模拟。`Gawk` 提供了真正的数组数组；参见下文的**数组**。在程序运行时，会设置几个预定义变量；这些变量将在需要时进行描述并在下方进行总结。\n\
  \n### 记录\n\n通常情况下，记录由换行符分隔。你可以通过为内置变量 `RS` 赋值来控制记录的分隔符。如果 `RS` 是任何单个字符，则用该字符分隔记录。否则，`RS`\
  \ 是一个正则表达式。输入中匹配此正则表达式的文本将分隔记录。然而，在兼容模式下，仅使用其字符串值的第一个字符来分隔记录。如果将 `RS` 设置为空字符串，则通过空行分隔记录。当\
  \ `RS` 设置为空字符串时，换行符始终作为字段分隔符，无论 `FS` 的值是什么（无论如此）。\n\n### 字段\n\n在读取每个输入记录时，`gawk`\
  \ 使用 `FS` 变量的值作为字段分隔符将记录拆分为*字段*。如果 `FS` 是单个字符，则由该字符分隔字段。如果 `FS`为空字符串，则每个单独字符都成为一个单独字段。否则，期望\
  \ `FS` 为完整的正则表达式。在 `FS` 为单个空格的特殊情况下，字段由连续的空格和/或制表符和/或换行符分隔。（但请参见下方的 **POSIX 兼容性**章节）。**注意**：`IGNORECASE`\
  \ 的值（见下文）也会影响 `FS` 为正则表达式时字段的划分方式，以及 `RS` 为正则表达式时记录的分隔方式。\n\n如果 `FIELDWIDTHS` 变量设置为由空格分隔的数字列表，则每个字段预计具有固定宽度，`gawk`\
  \ 使用指定的宽度拆分记录。此时忽略 `FS` 的值。为 `FS` 或 `FPAT` 赋新值将覆盖对 `FIELDWIDTHS` 的使用。\n\n同样，如果 `FPAT`\
  \ 变量设置为代表正则表达式的字符串，则每个字段由匹配该正则表达式的文本组成。在这种情况下，正则表达式描述的是字段本身，而不是分隔字段的文本。为 `FS` 或\
  \ `FIELDWIDTHS` 赋新值将覆盖对 `FPAT` 的使用。\n\n输入记录中的每个字段可以通过其位置引用：`$1`、`$2` 等。`$0` 是整个记录。字段不需要通过常量引用：\n\
  \n```\nn = 5\nprint $n\n```\n\n打印输入记录中的第五个字段。\n\n变量 `NF` 被设置为输入记录中的字段总数。\n\n对不存在的字段进行引用（即\
  \ `$NF` 之后的字段）会产生空字符串。然而，给不存在的字段赋值（例如 `$(NF+2) = 5`）会增加 `NF` 的值，创建任何中间的字段并以空字符串作为其值，并导致\
  \ `$0` 的值被重新计算，字段通过 `OFS` 的值进行分隔。对负编号字段引用会导致致命错误。递减 `NF` 会导致新值之后的字段值丢失，并重新计算 `$0`\
  \ 的值，字段通过 `OFS` 的值进行分隔。\n\n给现有的字段赋值会在引用 `$0` 时重新构建整个记录。同样，给 `$0` 赋值会导致记录重新拆分，从而为字段创建新值。\n\
  \n### 内置变量\n\n`Gawk` 的内置变量有：\n\n`ARGC`\n命令行参数的数目（不包括传递给 `gawk` 的选项或程序源码）。\n\n`ARGIND`\n\
  当前处理的文件在 `ARGV` 中的索引。\n\n`ARGV`\n命令行参数数组。该数组从 0 到 `ARGC - 1` 索引。动态更改 `ARGV` 的内容可以控制用于数据的文件。\n\
  \n`BINMODE`\n在非 POSIX 系统上，指定所有文件 I/O 使用“二进制”模式。数值值 1、2 或 3 分别指定输入文件、输出文件或所有文件使用二进制\
  \ I/O。字符串值 `r` 或 `w` 分别指定输入文件或输出文件使用二进制 I/O。字符串值 `rw` 或 `wr` 指定所有文件使用二进制 I/O。任何其他字符串值被视为\
  \ `rw`，但会生成警告消息。\n\n`CONVFMT`\n数字的转换格式，默认为 `%.6g`。\n\n`ENVIRON`\n包含当前环境值的数组。该数组由环境变量索引，每个元素是该变量的值。\n\
  \n`ERRNO`\n如果在执行重定向、读取 `getline` 或执行 `close()` 期间发生系统错误，则 `ERRNO` 将包含描述该错误的字符串。\n\
  \n`FIELDWIDTHS`\n一个由空格分隔的宽度列表。设置后，`gawk` 使用固定宽度拆分输入，而不是使用 `FS` 的值作为字段分隔符。见**字段**章节。\n\
  \n`FILENAME`\n当前输入文件的文件名。如果在命令行上没有指定文件，`FILENAME` 在 **BEGIN** 规则内是非定义的（除非由 `getline`\
  \ 设置）。\n\n`FNR`\n当前输入文件中的输入记录号。\n\n`FPAT`\n描述记录字段内容的正则表达式。设置后，`gawk` 将输入拆分为字段，其中字段匹配正则表达式，而不是使用\
  \ `FS` 的值作为字段分隔符。见**字段**章节。\n\n`FS`\n输入字段分隔符，默认为空格。见**字段**章节。\n\n`FUNCTAB`\n一个数组，其索引和对应的值是程序中所有自定义或扩展函数的名称。**注意**：你不能对\
  \ `FUNCTAB` 数组使用 **delete** 语句。\n\n`IGNORECASE`\n控制所有正则表达式和字符串操作的大小写敏感性。如果 `IGNORECASE`\
  \ 非零，规则中的字符串比较和模式匹配、使用 `FS` 和 `FPAT` 的字段划分、使用 `RS` 的记录分隔、使用 `~` 和 `!~` 的正则表达式匹配，以及内置函数\
  \ `gensub()`、`gsub()`、`index()`、`match()`、`patsplit()`、`split()` 和 `sub()` 在执行正则表达式操作时忽略大小写。**注意**：数组下标不受影响。然而，`asort()`\
  \ 和 `asorti()` 函数受影响。因此，如果 `IGNORECASE` 不等于零，`/aB/**` 将匹配所有字符串 **ab**、**aB**、**Ab**\
  \ 和 **AB**。与所有 AWK 变量一样，`IGNORECASE` 的初始值为零，因此所有正则表达式和字符串操作通常是大小写敏感的。\n\n`LINT`\n\
  从 AWK 程序内部动态控制 `--lint` 选项。当为 true 时，`gawk` 打印 lint 警告。当为 false 时，不打印。当赋值字符串值 **fatal**\
  \ 时，lint 警告变为致命错误，与 `--lint=fatal` 完全相同。任何其他真值仅打印警告。\n\n`NF`\n\n\n\n\n\n当前输入记录中的字段数量。\n\
  \n`NR`\n\n为止为止可见的输入记录总数。\n\n`OFMT`\n\n数字的输出格式，默认为 `%.6g`。\n\n`OFS`\n\n输出字段的分隔符，默认为空格。\n\
  \n`ORS`\n\n输出记录分隔符，默认为换行符。\n\n`PREC`\n\n任意精度浮点数的的工作精度，默认为 53。\n\n`PROCINFO`\n\n\
  此数组的元素提供了对正在运行的 AWK 程序信息的访问。在某些系统上，数组中可能存在从 `group1` 到 `\"group*n*\"` 的元素（其中 *n*\
  \ 是某个整数），这表示该进程拥有的辅助组数量。使用 `in` 运算符来测试这些元素的存在。以下元素保证可用的：\n\n`PROCINFO[\"egid\"]`\n\
  `getegid(2)` 系统调用的值。\n\n`PROCINFO[\"strftime\"]`\n`strftime()` 的默认时间格式字符串。\n\n`PROCINFO[\"\
  euid\"]`\n`geteuid(2)` 系统调用的值。\n\n`PROCINFO[\"FS\"]`\n如果正在使用 `FS` 进行字段分割，则为 `FS`；如果正在使用\
  \ `FPAT` 进行字段分割，则为 `FPAT`；如果正在使用 `FIELDWIDTHS` 进行字段分割，则为 `FIELDWIDTHS`。\n\n`PROCINFO[\"\
  identifiers\"]`\n一个子数组，通过 AWK 程序文本中使用的所有标识符名称进行索引。值表示 *gawk* 在完成程序解析后关于这些标识符的信息；它们在程序运行期间*不会*被更新。对于每个标识符，该元素的值为以下值之一：\n\
  \n- `array`\n该标识符是一个数组。\n\n- `builtin`\n该标识符是一个内置函数。\n\n- `extension`\n通过 `@load`\
  \ 或 `-l` 加载的扩展函数。\n\n- `scalar`\n该标识符是一个标量。\n\n- `untyped`\n该标识符未定义类型（可以作为标量或数组使用，*gawk*\
  \ 尚尚不知道）。\n\n- `user`\n该标识符是用户定义的函数。\n\n`PROCINFO[\"gid\"]` `getgid(2)` 系统调用的值。`PROCINFO[\"\
  pgrpid\"]` 当前进程的进程组 ID。`PROCINFO[\"pid\"]` 当前进程的 ID。`PROCINFO[\"ppid\"]` 当前进程的父进程\
  \ ID。`PROCINFO[\"uid\"]` `getuid(2)` 系统调用的值。`PROCINFO[\"sorted_in\"]` 如果此元素存在于 `PROCINFO`\
  \ 中，则其值控制 `for` 循环中遍历数组元素的顺序。支持的值有 `@ind_str_asc`、`@ind_num_asc`、`@val_type_asc`、`@val_str_asc`、`@val_num_asc`、`@ind_str_desc`、`@ind_num_desc`、`@val_type_desc`、`@val_str_desc`、`@val_num_desc`\
  \ 和 `@unsorted`。该值也可以是如下定义的比较函数的名称：\n\n```\nfunction cmp_func(i1, v1, i2, v2)\n\
  ```\n其中 *i1* 和 *i2* 是索引，*v1* 和 *v2* 是两个比较元素的对应值。它应该返回小于、等于或大于 0 的数字，取决于数组元素的排序方式。\n\
  \n`PROCINFO[\"input\", \"READ_TIMEOUT\"]` 从 *input* 读取数据的毫秒超时时间，其中 *input* 是重定向字符串或文件名。值为\
  \ 0 或小于 0 表示无超时。`PROCINFO[\"mpfr_version\"]` *gawk* 用于支持任意精度数的 GNU MPFR 库版本。如果未在\
  \ *gawk* 中编译 MPFR 支持，则不存在此条目。`PROCINFO[\"gmp_version\"]` *gawk* 用于支持任意精度数的 GNU MP\
  \ 库版本。如果未在 *gawk* 中编译 MPFR 支持，则不存在此条目。`PROCINFO[\"prec_max\"]` GNU MPFR 库支持的任意精度浮点数的最大精度。如果未在\
  \ *gawk* 中编译 MPFR 支持，则不存在此条目。`PROCINFO[\"prec_min\"]` GNU MPFR 库允许的任意精度浮点数的最小精度。如果未在\
  \ *gawk* 中编译 MPFR 支持，则不存在此条目。`PROCINFO[\"api_major\"]` 扩展 API 的主版本。如果无法加载动态扩展，则不存在此条目。`PROCINFO[\"\
  api_minor\"]` 扩展 API 的次版本。如果无法加载动态扩展，则不存在此条目。`PROCINFO[\"version\"]` *gawk* 的版本。`ROUNDMODE`\
  \ 数字任意精度算术时使用的舍入模式，默认为 `N` (IEEE-754 舍入到偶模式)。接受的值为 `N` 或 `n`（舍入到偶），`U` 或 `u`（向正舍入），`D`\
  \ 或 `d`（向负舍入），`Z` 或 `z`（向零舍入），以及如果你的 GNU MPFR 库版本支持，`A` 或 `a`（舍入到远离）。`RS` 输入记录分隔符，默认为换行符。`RT`\
  \ 记录终止符。*Gawk* 将 `RT` 设置为匹配的输入文本。`RSTART` `match()` 匹配到的第一个字符的索引；无匹配则为 0。`RLENGTH`\
  \ `match()` 匹配的字符串长度；无匹配则为 -1。`SUBSEP` 用于分隔多个下标的字符。\n\n### 数组\n\n数组使用方括号 `[` 和 `]`\
  \ 之间的表达式进行索引。如果表达式是一个列表，则下标是由 `SUBSEP` 连接而成的字符串。AWK 中的数组都是关联数组，即通过字符串值索引。\n\n特殊运算符\
  \ `in` 可用于测试数组是否存在某个索引：\n\n```\nif (val in array) print array[val]\n```\n\n如果数组有多个下标，使用\
  \ `(i, j) in array`。`in` 结构也可以用于 `for` 循环遍历数组的所有元素。然而，`(i, j) in array` 仅适用于测试，不适用于\
  \ `for` 循环。\n\n可以使用 `delete` 语句从数组中删除元素。通过指定数组名而不带下标也可以删除整个数组的内容。\n\n*gawk* 支持真正的多维数组。它不需要像\
  \ C 或 C++ 那样要求此类数组是“矩形的”。例如：\n\n```\na[1] = 5 a[2][1] = 6 a[2][2] = 7\n```\n\n**注意**：你可能需要告诉\
  \ *gawk* 数组元素实际上是一个子数组，以便在需要数组的地方（如 `split()` 的第二个参数）中使用它。可以通过在子数组中创建一个元素并将其删除来实现。变量和字段可以是（浮点）数字、字符串或两者兼有。变量值的解释方式取决于其语境。如果在数字表达式中使用它，它将被视为数字；如果作为字符串使用，它将被视为字符串。\n\
  \n要强制将变量视为数字，请给它加上 0；要强制视为字符串，请将其与空字符串连接。\n\n未初始变量具有数值值 0 和字符串值 \"\"（空字符串）。\n\n\n\
  \n\n当必须将字符串转换为数字时，使用 `strtod`(3) 完成转换。将数字转换为字符串则使用 `CONVFMT` 的值作为 `sprintf`(3) 的格式化字符串，并将变量的数值值作为参数。然而，尽管\
  \ AWK 中的所有数字都是浮点数，但整数值*总是*被转换为整数。因此，给定\n\n```\nCONVFMT = \"%2.2f\" a = 12 b = a\
  \ \"\"\n```\n\n变量 `b` 的字符串值为 `12` 而不是 `12.00`。\n\n**注意**：在 POSIX 模式下运行时（例如使用 `--posix`\
  \ 选项），请注意区域设置（locale）可能会影响处理数字的方式：传递给 `gawk` 的数字的小数符必须符合你的区域设置预期，无论是逗号（,）还是点（.）。\n\
  \n`gawk` 执行比较如下：如果两个变量都是数字，则进行数值比较。如果其中一个值是数字而另一个具有“数值字符串”字符串值，则也以数值方式进行比较。否则，将数值值转换为字符串并进行字符串比较。当然，两个字符串是作为字符串进行比较的。\n\
  \n注意，字符串常量（如 `57`）*不是*数值字符串，而是字符串常量。“数值字符串”的概念仅适用于字段、`getline` 输入、`FILENAME`、`ARGV`\
  \ 元素、`ENVIRON` 元素以及由 `split()` 或 `patsplit()` 创建的数组元素的数值字符串。基本思想是，只有*用户输入*中看起来像数字的部分应该被那样处理。\n\
  \n### 八进制和十六进制常量\n\n你可以在 AWK 程序源代码中使用 C 风格的八进制和十六进制常量。例如，八进制值 `011` 等于十进制 `9`，十六进制值\
  \ `0x11` 等于十进制 17。\n\n### 字符串常量\n\nAWK 中的字符串常量双引号之间的字符序列（如 `value`）。在字符串内部，可以识别某些类似于\
  \ C 的*转义序列*。这些是：\n\n`\\\\`\n字面反斜杠。\n\n`\\a`\n“警告”字符；通常是 ASCII BEL 字符。\n\n`\\b`\n\
  退格符。\n\n`\\f`\n分页符。\n\n`\\n`\n换行符。\n\n`\\r`\n回车符。\n\n`\\t`\n水平制表符。\n\n`\\v`\n垂直制表符。\n\
  \n`\\x*hex digits*\n由 `\\x` 后后的十六进制数字字符串表示的字符。与 ISO C 一样，所有后续十六进制数字都被视为转义序列的一部分。（这一特征应该告诉我们关于委员会化语言设计的一些信息。）例如，`\\\
  x1B` 是 ASCII ESC（转义）字符。\n\n`\\*ddd*`\n由 1、2 或 3 位八进制数字序列表示的字符。例如，`\\033` 是 ASCII\
  \ ESC（转义）字符。\n\n`\\*c*`\n字面字符 *c*。\n\n转义序列也可以用在常量正则表达式内部（例如，`/[ \\t\\f\\n\\r\\v]/`\
  \ 匹配空白字符）。\n\n在兼容模式下，八进制和十六进制转义序列表示的字符在用于正则表达式常量时被视为字面量。因此，`/a\\52b/` 等同于 `/a\\\
  *b/`。\n\n## 模式与动作\n\nAWK 是一种行导向的语言。模式在先，动作在后。动作语句被包含在 `{` 和 `}` 之间。模式可以缺失，动作也可以缺失，但当然，两者不能同时缺失。如果模式缺失，则对每一条输入记录执行动作。缺失的动作等同于\n\
  \n```\n{ print }\n```\n\n这打印整个记录。\n\n注释以 `#` 字符开始，持续到行尾。可以使用空行来分隔语句。通常，语句以换行符结束，但以逗号、`{`、`?`、`:`、`&&`\
  \ 或 `||` 结尾的行除外。以 `do` 或 `else` 结尾的行其语句也会自动延续到下一行。在其他情况下，可以通过以 `\\'` 结尾来延续行，在这种情况下，换行符会被忽略。\n\
  \n可以通过 `;` 分隔符将多个语句放在同一行中。这既适用于模式-动作对中动作部分内的语句（通常情况），也适用于模式-动作语句本身。\n\n### 模式\n\n\
  AWK 模式可以是以下内容之一：\n\n`BEGIN` `END` `BEGINFILE` `ENDFILE` `/*regular expression*`\
  \ `/*relational expression*` `pattern` `&&` `pattern` `pattern` `||` `pattern` `pattern`\
  \ `?` `pattern` `:` `pattern` `(` `pattern` `)` `!` `pattern` `pattern1` `, ` `pattern2`\n\
  \n`BEGIN` 和 `END` 是两种特殊的模式，不对输入进行测试。所有 `BEGIN` 模式的动作部分都会合并，就像所有语句都写在一个 `BEGIN` 规则中一样。这些动作在读取任何输入之前执行。同样，所有的\
  \ `END` 规则都会合并，并在读取所有输入后执行。\n\n[注：剩余文本对变量/结构上的反引号遵循相同的格式逻辑]\n\n## 正则表达式\n\n正则表达式是\
  \ *egrep* 中找到的扩展类型。它们由以下字符组成：\n...（为了简洁省略了其余部分，但遵循相同的规则）\n...八进制和十六进制转义序列表示的字符在用于正则表达式常量时被视为字面量。因此，`/a\\\
  52b/` 等同于 `/a\\*b/`。\n\n\n\n\n\n# r{n,m}\n大括号内的一个或两个数字表示*区间表达式*。如果括号内有一个数字，则前面的正则表达式\
  \ `r` 将重复 `n` 次。如果有两个用逗号隔开的数字，则 `r` 将重复 `n` 到 `m` 次。如果一个数字后面跟着一个逗号，则 `r` 将至少重复 `n`\
  \ 次。\n\n`\\y`\n匹配单词开头或结尾的空字符串。\n\n`\\B`\n匹配单词内部的空字符串。\n\n`\\<`\n匹配单词开头的空字符串。\n\n\
  `\\>`\n匹配单词结尾的空字符串。\n\n`\\s`\n匹配任何空白字符。\n\n`\\S`\n匹配任何非空白字符。\n\n`\\w`\n匹配任何单词组成字符（字母、数字或下划线）。\n\
  \n`\\W`\n匹配任何非单词字符的字符。\n\n`\\\\`\n匹配缓冲区（字符串）开头的空字符串。\n\n`\\'`\n匹配缓冲区结尾的空字符串。\n\n\
  在字符串常量中有效的转义序列（参见**字符串常量**）在正则表达式中同样有效。\n\n## 字符类\n字符类是 POSIX 标准引入的一项特性。字符类是描述具有特定属性的字符列表的特殊表示法，但字符本身可以根据国家和/或字符集的不同而异。例如，什么是字母在\
  \ ways 和法国的定义是不一样的。\n\n字符类仅在正则表达式的字符列表的括号*内部*时才有效。字符类由 `[:`、表示该类的关键字以及 `:]` 组成。POSIX\
  \ 标准定义的字符类包括：\n\n`[:alnum:]`\n字母数字字符。\n\n`[:alpha:]`\n字母。\n\n`[:blank:]`\n空格或制表符字符。\n\
  \n`[:cntrl:]`\n控制字符。\n\n`[:digit:]`\n数字字符。\n\n`[:graph:]`\n既可打印又可见的字符。（空格是可打印的，但不可可见的，而\
  \ `a` 两者都是。）\n\n`[:lower:]`\n小写字母。\n\n`[:print:]`\n可打印字符（不是控制字符的字符）。\n\n`[:punct:]`\n\
  标点符号（不是字母、数字、控制字符或空格字符的字符）。\n\n`[:space:]`\n空白字符（例如空格、制表符和换页符等）。\n\n`[:upper:]`\n\
  大写字母。\n\n`[:xdigit:]`\n十六进制数字字符。\n\n例如，在 POSIX 标准之前，为了匹配字母数字字符，你必须编写 `/[A-Za-z0-9]/**`。如果你的字符集包含其他字母，它将无法匹配这些字符；如果你的字符集排序方式与\
  \ ASCII 不同，它甚至无法匹配 ASCII 字母数字字符。使用 POSIX 字符类，你可以编写 `/[[:alnum:]]/**`，这会匹配你字符集中的字母和数字字符，无论它是什么。\n\
  \n字符列表中还可以两个额外的特殊序列。这些序列适用于非 ASCII 字符集，这些字符集可能包含由多个字符表示的单个符号（称为*排序元素*），也包含多个在*排序*（即排序）目的上等价的字符。（例如，在法语中，普通的\
  \ `e` 和带有重音符号的 `e` 是等价的。）\n\n### 排序符号\n排序符号是封装在 `[` 和 `.]]` 之间的多字符排序元素。例如，如果 `ch`\
  \ 是一个排序元素，那么 `[[.ch.]]` 就是一个匹配该排序元素的正则表达式，而 `[ch]` 是一个匹配 `c` 或 `h` 的正则表达式。\n\n###\
  \ 等价类\n等价类是等价字符列表的特定区域名称。该名称封装在 `[=` 和 `=]` 之间。例如，名称 `e` 可能用于表示所有的 `e`、`e'` 和 `e``。在在这种情况下，`[[=e=]]`\
  \ 是一个匹配 `e`、`e'` 或 `e`` 中任意一个的正则表达式。\n\n这些特性在非英语区域非常有价值。*gawk* 用于正则表达式匹配的库函数目前仅识别\
  \ POSIX 字符类；它们不识别排序符号或等价类。\n\n`\\y`, `\\B`, `\\<`, `\\>`, `\\s`, `\\S`, `\\w`, `\\\
  W`, `\\\\\\` 和 `\\'` 运算符是*gawk* 特有的；它们是基于 GNU 正表达式库功能的扩展。\n\n各种命令行选项控制 *gawk* 如何解释正则表达式中的字符。\n\
  \n### 选项\n在默认情况下，*gawk* 提供 POSIX 正则表达式的所有功能以及上述的 GNU 正则表达式操作符。\n\n`--posix`\n仅支持\
  \ POSIX 正则表达式，GNU 操作符不再特殊特殊。（例如，`\\w` 匹配字面量 `w`）。\n\n`--traditional`\n匹配传统的 UNIX\
  \ *awk* 正则表达式。GNU 操作符不再特殊，且不可用区间表达式。由八进制和十六进制转义序列描述的字符被视为字面量，即使它们代表正则表达式的元字符。\n\n\
  `--re-interval`\n允许在正则表达式中使用区间表达式，即使提供了 `--traditional`。\n\n## 动作\n动作语句封装在大括号 `{}`\
  \ 中。动作语句由 C 语言中赋值、条件和循环语句组成。\n\n#### 运算符\nAWK 中的运算符按优先级从高到低排序如下：\n\n`(...)`\n分组\n\
  \n`$`\n字段引用。\n\n`++ --`\n递增和递减，前缀和后缀。\n\n`^`\n幂（也可用于赋值）。\n\n`+ - !`\n一元加、一元减和逻辑取反。\n\
  \n`* / %`\n乘法、除法和取模。\n\n`+ -`\n加法和减法。\n\n`*`\n字符串拼接。\n\n`| &`\n用于 `getline`、`print`\
  \ 和 `printf` 的管道输出。\n\n`< > ==`\n关系运算符。\n\n`~ !~`\n正则表达式匹配、否定匹配。**注意**：不要在 `~` 或\
  \ `!~` 的左侧使用正则表达式 `/foo/`。仅使用右侧。表达式 `/foo/ ~ exp` 等同于 `($0 ~ //)`。这通常不是你想要的。\n\n\
  `in`\n数组成员关系。\n\n`&&`\n逻辑与。\n\n`||`\n逻辑或。\n\n`?:`\nC 条件表达式。其形式为 *expr1* ? *expr2*\
  \ : *expr3*。如果 *expr1* 为真，表达式的值为 *expr2*，否则为 *expr3*。只有 *expr2* 或 *expr3* 会求值。\n\
  \n`= += *= /= ^=`\n赋值。支持绝对赋值 `var = value` 和运算符赋值（其他形式）。\n\n## 控制语句\n控制语句如下所示：\n\
  \n`if (condition) statement [else statement]`\n`while (condition) statement`\n`do\
  \ statement while (condition)`\n`for (expr1; expr2; expr3) statement`\n`for (var\
  \ in array) statement`\n`break continue delete array[index] exit`\n`switch (expression)\
  \ { case value|regex: statement ... [default: statement] }`\n\n## I/O 语句\n输入输出语句如下\n\
  \n`close(file [, how])`\n关闭文件、管道或协进程。可选的 *how* 只应在关闭指向协进程的双向管道的一端时使用。它必须是一个字符串，**to**\
  \ 或 **from**。\n\n`getline`\n从下一个输入记录设置 **$0**；设置 **NF**, **NR**, **FNR**, **RT**。\n\
  \n`getline < file`\n\n\n\n\n\n从 `file` 的下一条记录设置 `$0`；设置 `NF`、`RT`。\n\n`getline var`\n\
  \n从下一个输入记录设置 `var`；设置 `NR`、`FNR`、`RT`。\n\n`getline var <file`\n\n从 `file` 的下一条记录设置\
  \ `var`，`RT`。\n\n`command | getline [var]`\n\n运行 `command` 并将其输出管道到 `$0` 或 `var`（如上所示），以及设置\
  \ `RT`。\n\n`command |& getline [var]`\n\n将 `command` 作为协进程运行，并将其输出管道到 `$0` 或 `var`（如上所示），以及设置\
  \ `RT`。协进程是 `gawk` 的一个扩展。（`command` 也可以是一个 socket。参见下文的**特殊文件名** 节。）\n\n`next`\n\
  \n停止处理当前输入记录。读取下一个输入记录，并从 AWK 程序中的第一个模式重新开始处理。当到达输入数据的末尾时，`gawk` 会执行任何 `END` 规则。\n\
  \n`nextfile`\n\n停止处理当前输入文件。读取的下一个输入记录将来自下一个输入文件。`FILENAME` 和 `ARGIND` 会更新，`FNR`\
  \ 重置为 1，并从 AWK 程序中的第一个模式重新开始处理。当到达输入数据的末尾时，`gawk` 会执行任何 `END` 规则。\n\n`print`\n\n\
  打印当前记录。输出记录以 `ORS` 的值终止。\n\n`print expr-list`\n\n打印表达式。每个表达式之间用 `OFS` 的值分隔。输出记录以\
  \ `ORS` 的值终止。\n\n`print expr-list > file`\n\n在 `file` 上打印表达式。每个表达式之间用 `OFS` 的值分隔。输出记录以\
  \ `ORS` 的值终止。\n\n`printf fmt, expr-list`\n\n格式化并打印。参见下文的**printf 语句**。\n\n`printf\
  \ fmt, expr-list > file`\n\n在 `file` 上进行格式化并打印。\n\n`system(cmd-line)`\n\n执行命令 `cmd-line`，并返回退出状态。（这在非\
  \ POSIX 系统上可能无效。）\n\n`fflush([file])`\n\n刷新与打开的输出文件或管道 `file` 关联的任何缓冲区。如果 `file`\
  \ 缺失或为空字符串，则刷新所有打开的输出文件和管道。\n\n`print` 和 `printf` 允许额外的输出重定向。\n\n`print ... >> file`\n\
  \n将输出追加到 `file`。\n\n`print ... | command`\n\n写入管道。\n\n`print ... |& command`\n\n\
  将数据发送到协进程或 socket。（另见下文的**特殊文件名** 节。）\n\n`getline` 命令在成功时返回 1，在文件末尾返回 0，在错误时返回 -1。发生错误时，`ERRNO`\
  \ 被设置为描述该问题的字符串。\n\n**注意**：打开双向 socket 失败会导致向调用函数返回非致命错误。在使用管道、协进程或 socket 进行 `getline`，或在循环内\
  \ `print` 或 `printf` 时，你*必须*使用 `close()` 创建命令或 socket 的新实例。AWK 在它们返回 EOF 时不会自动关闭管道、socket\
  \ 或协进程。\n\n### printf 语句\n\nAWK 版本的 `printf` 语句和 `sprintf()` 函数（见下文）接受以下转换规范格式：\n\
  \n`%c`\n\n单个字符。如果用于 `%c` 的参数是数字，则将其视为字符并打印。否则，假设参数是字符串，并仅打印该字符串的首字符。\n\n`%d`, `%i`\n\
  \n十进制数字（整数部分）。\n\n`%e`, `%E`\n\n形式为 `[-]*d.dddddde[+-]*dd` 的浮点数。`%E` 格式使用 `E` 代替\
  \ `e`。\n\n`%f`, `%F`\n\n形式为 `[-]*d.ddddd` 的浮点数。`%F` 格式使用大写字母。\n\n`%g`, `%G`\n\n\
  短格式的浮点数。`%G` 格式使用 `G` 代替 `g`。\n\n`%o`\n\n八进制数字。\n\n`%u`\n\n无符号十进制数字。\n\n`%s`\n\n\
  字符串。\n\n`%x`, `%X`\n\n十六进制数字。`%X` 格式使用大写。\n\n`%%`\n\n单个 `%` 字符；可选的参数位于 `%` 之间：\n\
  \n*   `count$`\n\n位置参数符，主要用于格式化字符串中。\n\n*   `-`\n\n左对齐。\n\n*   `+`\n\n在数字转换时始终显示符号标志，即使数值为正。\n\
  \n*   `#`\n\n某些字母的替代形式。\n\n*   `0`\n\n该标志表示应用 0 填充而不是空格。\n\n*   `width`\n\n字段填充宽度。\n\
  \n*   `.prec`\n\n指定精度。对于 `%e`, `%E`, `%f` 和 `%F` 格式，它指定小数点右侧的位数。对于 `%g` 和 `%G` 格式，它指定有效数字数。对于\
  \ `%s`，它指定要打印字符串的最大字符数。\n\n*   `*`\n\nISO C `printf` 方案支持的动态*宽度*和*精度*。在*宽度*或*精度*规范处使用\
  \ `*` 会导致其值从 `printf` 或 `sprintf()` 的参数列表中获取。要在位置参数符中使用动态宽度或精度，在格式字符串的 `*` 之后提供\
  \ `count$`。例如，`%3$*$.1$s`。\n\n*   `'`\n\n单引号标志，表示数字转换时始终显示符号，即使数值为正。\n\n#### 特殊文件名\n\
  \n当从 `print` 或 `printf` 将输出重定向到文件，或者通过 `getline` 从文件读取时，`gawk` 内部识别某些特殊文件名。这些文件名允许访问从\
  \ gawk 的父进程（通常是 shell）继承的文件描述符。这些文件名也可以在命令行用于命名数据文件。文件名如下：\n\n`-`\n\n标准输入。\n\n`/dev/stdin`\n\
  \n标准输入。\n\n`/dev/stdout`\n\n标准输出。\n\n`/dev/stderr`\n\n标准错误输出。\n\n`/dev/fd/*n*\n\n\
  与打开的文件描述符 *n* 关联的文件。这些对于错误消息特别有用。例如：\n\n`print \"You blew it!\" > \"/dev/stderr\"\
  `\n\n否则你可能需要使用\n\n`print \"You blew it!\" | \"cat 1>&2\"`\n\n以下特殊文件名可以配合 `|&` 协进程运算符创建\
  \ TCP/IP 网络连接：\n\n`/inet/tcp/***lport***/***rhost***/***rport*``/inet4/tcp/***lport***/***rhost***/***rport*``\n\
  \n\n\n\n\n`/inet6/tcp/***lport***/***rhost***/***rport` 用于从本地端口 `lport` 到远程主机 `rhost`\
  \ 远程端口 `rport` 的 TCP/IP 连接。使用端口 `0` 由系统自动选择端口。使用 `/inet4` 强制使用 IPv4 连接，使用 `/inet6`\
  \ 强制使用 IPv6 连接。普通的 `/inet` 使用系统默认值（极率是 IPv4）。\n\n`/inet/udp/***lport***/***rhost***/***rport`\n\
  \n`/inet4/udp/***lport***/***rhost***/***rport`\n\n`/inet6/udp/***lport***/***rhost***/***rport`\
  \ 类似，但使用 UDP/IP 代替 TCP/IP。\n\n### 数值函数\n\nAWK 具有以下内置算术函数：\n\n`atan2(***y***,** *x***)`\n\
  \n以弧度返回 `y/x` 的反正切值。\n\n`cos(***expr)`\n\n返回 `expr` 的余弦值，单位为弧度。\n\n`exp(***expr***)`\n\
  \n指数函数。\n\n`int(***expr***)`\n\n截断为整数。\n\n`log(***expr***)`\n\n自然对数函数。\n\n`rand()`\n\
  \n返回一个在 0 到 1 之间的随机数 `N`，使得 `0 ≤ N < 1`。\n\n`sin(***expr***)`\n\n返回 `expr` 的正弦值，单位为弧度。\n\
  \n`sqrt(***expr***)`\n\n返回 `expr` 的平方根。\n\n`srand(**[*expr*]])`\n\n使用 `expr` 作为随机数生成器的种子。如果没有提供\
  \ `expr`，则使用当天时间。返回随机数生成器的上一个种子。\n\n### 字符串函数\n\n*Gawk* 具有以下内置字符串函数：\n\n`asort(***s*\
  \ [**,** *d* [**,** *how*]]**)`\n\n返回源数组 `s` 中的元素个数。使用 `gawk` 比较值的标准规则对 `s` 的内容进行排序，并将排序后的值\
  \ `s` 的索引替换为从 1 开始的连续整数。如果指定了可选的目标数组 `d`，则先将 `s` 复制到 `d`，然后对 `d` 进行排序，保持源数组 `s`\
  \ 的索引不变。可选字符串 `how` 控制方向和比较模式。`how` 的有效值可以是 `PROCINFO[\"sorted_in\"]` 中任何合法的字符串。它也可以是\
  \ `PROCINFO[\"sorted_in\"]` 中描述的自定义定义比较函数名。\n\n`asorti(***s* [**,** *d* [**,** *how*]]**)`\n\
  \n返回源数组 `s` 中的元素个数。行为与 `asort()` 相同，但使用数组 `indices` 进行排序，而不是数组值。完成后，数组按数字进行索引，而其值是原始索引的值。原始值将丢失；因此，如果你想保留原始值，请提供第二个数组。可选字符串\
  \ `how` 的目的与上述 `asort()` 的描述相同。\n\n`gensub(***r***,** *s***,** *h* [**,** *t]**)`\n\
  \n在目标字符串 `t` 中搜索正则表达式 `r` 的匹配项。如果 `h` 是以 `g` 或 `G` 开头的字符串，则将所有 `r` 的匹配项替换为 `s`。否则，`h`\
  \ 是一个数字，表示替换 `r` 的第几个匹配项。如果提供 `t`，则改用 `$0`。在替换文本 `s` 中，可以使用序列 `\\n`（其中 `n` 是 1 到\
  \ 9 的数字）表示匹配第 `n` 个括号子表达式的文本。序列 `\\0` 代表整个匹配文本，字符 `&` 也是如此。与 `sub()` 和 `gsub()`\
  \ 不同，修改后的字符串作为函数的返回结果，原始目标字符串**不会**改变。\n\n`gsub(***r***,** *s* [**,** *t]**)`\n\n\
  对于字符串 `t` 中每个匹配正则表达式 `r` 的子字符串，替换字符串 `s`，并返回替换次数。如果未提供 `t`，则使用 `$0`。替换文本中的 `&` 被替换为实际匹配的文本。使用\
  \ `\\&` 获取字面量上的 `&`。（这必须写为 `\\\\&`；请参 *GAWK: Effective AWK Programming* 以详细讨论关于\
  \ `sub()`、`gsub()` 和 `gensub()` 替换文本中 `&` 和反斜杠的规则。）\n\n`index(***s***,** *t***)`\n\
  \n返回字符串 `t` 在字符串 `s` 中的索引，如果 `t` 不存在则返回 0。（这意味着字符索引从 1 开始）。使用正则表达式常量作为 `t` 是致命错误。\n\
  \n`length(**[*s*]])`\n\n返回字符串 `s` 的长度，如果未提供 `s`，则返回 `$0` 的长度。作为非标准扩展，带有数组参数时，`length()`\
  \ 返回数组中的元素个数。\n\n`match(***s***,** *r* [**,** *a]**)`\n\n返回正则表达式 `r` 在 `s` 中出现的位置，如果\
  \ `r` 不存在则返回 0，并设置 `RSTART` 和 `RLENGTH` 的值。\n\n`patsplit(***s***,** *a* [**,** *r]**)`\n\
  \n将字符串 `s` 拆分为数组 `a` 和基于正则表达式 `r` 的分隔符 `seps`。如果省略 `r`，则使用 `FPAT`。`seps[i]` 是 `a[i]`\
  \ 和 `a[i+1]` 之间匹配的内容。\n\n`split(***s***,** *a* [**,** *r]**)`\n\n将字符串 `s` 拆分为数组\
  \ `a` 和基于正则表达式 `r` 的分隔符 `seps`，返回字段数。如果省略 `r`，则使用 `FS`。首先清除数组 `a` 和 `seps`。\n\n\
  `sprintf(***fmt***,**expr-list***)`\n\n根据 `fmt` 打印 `expr-list` 并返回生成的字符串。\n\n`substr(***s***,**\
  \ *i [**n]**)`\n\n返回 `s` 从 `i` 开始的最多 `n` 个字符的子字符串。如果省略 `n`，则使用 `s` 的剩余部分。\n\n`sub(***r***,**\
  \ *s* [**,** *t]**)` 与 `gsub()` 类似，但仅替换第一个匹配项。\n\n`tolower(***str***)`\n\n返回 `str`\
  \ 的副本，将其所有大写字母转换为对应的小写字母。非字母保持不变。\n\n`toupper(***str***)`返回 `str` 的副本，将其所有小写字母转换为对应的大写字母。非字母保持不变。\n\
  \n`strtonum(***str***)`\n\n检查 `str` 并返回其数值值。如果 `str` 以 `0` 开头，则将其视为八进制数。如果 `str`\
  \ 以 `0x` 或 `0X` 开头，则将其视为十六进制数。否则假设它是十进制数。\n\n### 时间函数\n\n由于 AWK 程序的一个主要用途之一是处理包含时间戳信息的日志文件，*gawk*\
  \ 提供了以下函数用于获取时间戳并格式化它们。\n\n`mktime(***datespec***)`\n\n\n\n\n将 `datespec` 转换为与 `systime()`\
  \ 返回格式相同的时间戳，并返回结果。`datespec` 是格式为 `YYYY MM DD HH MM SS[ DST]` 的字符串。该字符串包含六或七个数字，分别代表：包含世纪的完整年份、1\
  \ 到 12 的月份、1 到 31 的日期、0 到 23 的小时、0 到 59 的分钟、0 到 60 的秒，以及一个可选的夏令标志。这些数字的值不需要在指定的范围内；例如，小时为\
  \ `-1` 表示在午夜前 1 小时。假设使用零起始的格里历历，年份 0 在于年份 1 前，年份 -1 在于年份 0 前。假设时间为本地时区时间。如果夏令标志为正数，则假设时间为夏令时；如果为零，则假设为标准时间；如果为负（默认值），`mktime()`\
  \ 尝试确定指定时间是否处于夏令时。如果 `datespec` 不包含足够的元素，或者结果的时间超出范围，则 `mktime()` 返回 -1。\n\n`strftime(*format\
  \ [ , timestamp [ , utc-flag]])`\n\n根据 `format` 中的规范格式化 `timestamp`。如果 `utc-flag`\
  \ 存在且非零或非空，则结果为 UTC，否则结果为本地时间。`timestamp` 应具有与 `systime()` 返回的相同格式。如果 `timestamp`\
  \ 缺失，则使用当前时间。如果 `format` 缺失，则使用等同于 `date(1)` 输出的默认格式。默认格式在 `PROCINFO[strftime]`\
  \ 中可用。请参考 ISO C 中 `strftime()` 函数的规范以获取保证可用的格式转换。\n\n`systime()`\n\n返回当前时间，单位为自\
  \ Epoch 以来的秒数（POSIX 系统上为 1970-01-01 00:00:00 UTC）。\n\n### 位操作函数\n\n`Gawk` 提供了以下位操作函数。这些函数通过将双精度浮点值转换为\
  \ `uintmax_t` 整数，执行操作，然后将结果转换回浮点数。这些函数是：\n\n`and(v1, v2 [, ...])`\n\n返回参数列表中提供的值的按位与（AND）结果。必须至少有两个值。\n\
  \n`compl(val)`\n\n返回 `val` 的按位取反（补）。\n\n`lshift(val, count)`\n\n返回 `val` 向左移动 `count`\
  \ 位后的值。\n\n`or(v1, v2 [, ...])`\n\n返回参数列表中提供的值的按位或（OR）结果。必须至少有两个值。\n\n`rshift(val,\
  \ count)`\n\n返回 `val` 向右移动 `count` 位后的值。\n\n`xor(v1, v2 [, ...])`\n\n返回参数列表中提供的值的按位异异（XOR）结果。必须至少有两个值。\n\
  \n### 类型函数\n\n以下函数用于多维数组。\n\n`isarray(x)`\n\n如果 `x` 是数组，则返回 true，否则返回 false。\n\n\
  ### 国际化函数\n\n在 AWK 程序内部可以使用以下函数在运行时翻译字符串。有关更多详细信息，请参阅 *GAWK: Effective AWK Programming*。\n\
  \n`bindtextdomain(directory [ , domain])`\n\n指定 `gawk` 查找 `.gmo` 文件的目录，以防它们未或无法放置在“标准”位置（例如在测试期间）。它返回\
  \ `domain` 被“绑定”的目录。\n\n默认 `domain` 是 `TEXTDOMAIN` 的值。如果 `directory` 为空字符串 `()`，则\
  \ `bindtextdomain()` 返回给定 `domain` 的当前绑定关系。\n\n`dcgettext(string [ , domain [ ,\
  \ category]])`\n\n返回在文本域 `domain` 中针对区域类别 `category` 的 `string` 翻译。`domain` 的默认值为\
  \ `TEXTDOMAIN` 的当前值。`category` 的默认值为 `LC_MESSAGES`。\n\n如果你提供了 `category` 的值，它必须是一个等于\
  \ *GAWK: Effective AWK Programming* 中描述的已知区域类别之一的字符串。你必须提供一个文本域。如果你想使用当前域，请使用 `TEXTDOMAIN`。\n\
  \n`dcngettext(string1, string2, number [ , domain [ , category]])`\n\n返回在文本域 `domain`\
  \ 中针对区域类别 `category` 的 `string1` 和 `string2` 在 `number` 时的复数形式翻译。`domain` 的默认值为\
  \ `TEXTDOMAIN` 的当前值。`category` 的默认值为 `LC_MESSAGES`。\n\n如果你提供了 `category` 的值，它必须是一个等于\
  \ *GAWK: Effective AWK Programming* 中描述的已知区域类别之一的字符串。你必须提供一个文本域。如果你想使用当前域，请使用 `TEXTDOMAIN`。\n\
  \n## 用户定义函数\n\nAWK 中的函数定义如下：\n\n`function name(parameter list) {statements}`\n\n\
  函数从模式（patterns）或动作（actions）执行。实际参数通过引用传递，其他变量通过值传递。由于函数最初并不是 AWK 的一部分，因此局部变量的规定相当笨拙：它们被声明为参数列表中的额外参数。例如：\n\
  \n```awk\nfunction f(p, q, a, b) { ... }\n```\n\n函数调用中的左括号必须紧跟在函数名之后，中间不能有任何空白字符。此限制不适用于内置函数。\n\
  \n函数可以相互调用，也可以是递归的。用作局部变量的函数参数在函数调用时初始化为空字符串和数字零。使用 `return expr` 从函数返回一个值。如果没有提供值，或者函数通过运行到末尾返回，则返回值是未定义的。\n\
  \n作为 gawk 的扩展，函数可以被间接调用。要做到这一点，将要调用的函数名作为字符串赋值给变量。然后使用该变量并在前面加上 `@` 符号，就像函数名一样，如下：\n\
  \n```awk\nfunction myfunc() { print \"myfunc called\" }\n{ thefunc = \"myfunc\"\
  ; @thefunc() }\n```\n\n从 4.1.2 开始，这适用于用户定义函数、内置函数和扩展函数。\n\n如果提供了 `--lint`，`gawk`\
  \ 在解析时会对未定义的函数调用警告，而不是在运行时。在运行时调用未定义的函数是致命错误。\n\n单词 `func` 可以代替 `function`，尽管这已过时。\n\
  \n## 动态加载新函数\n\n你可以使用 `@load` 语句向运行中的 `gawk` 解释器动态添加新的内置函数。详细信息超出了本手册的范围；请参 *GAWK:\
  \ Effective AWK Programming*。\n\n## 信号\n\n`gawk` 分析器接受两个信号。`SIGUSR1` 使其将配置文件和函数堆栈转储到配置文件（即\
  \ `awkprof.out` 或通过 `--profile` 指定的任何文件名），然后继续运行。`SIGHUP` 使 `gawk` 转储配置文件和函数堆栈然后退出。\n\
  \n## 国际化\n\n字符串常量是封装在双引号中的字符序列。在非英语环境中，可以标记 AWK 程序中的字符串需要翻译成本地自然语言。此类字符串在 AWK 程序中用前导下划线（'_'）标记。例如，\n\
  \n```bash\ngawk 'BEGIN { print \"hello, world\" }'\n```\n\n始终打印 **hello, world**。但是，\n\
  \n```bash\ngawk 'BEGIN { print _\"hello, world\" }'\n```\n\n\n\n\n在法国可能会打印 `bonjour,\
  \ monde`。\n\n制作和运行一个本地化的 AWK 程序涉及以下几个步骤：\n\n1.  添加一个 `BEGIN` 动作来为 `TEXTDOMAIN` 变量赋值，以便将文本域设置为与你的程序关联的名称：\n\
  \n```awk\nBEGIN { TEXTDOMAIN = \"myprog\" }\n```\n\n这允许 `gawk` 找到与你的程序相关的 `.gmo`\
  \ 文件。如果没有这一步，`gawk` 将使用 `messages` 文本域，该域可能不包含你程序的翻译。\n\n2.  在所有需要翻译的字符串开头加上下划线标记。\n\
  \n3.  如有必要，在程序中适地使用 `dcgettext()` 和/或 `bindtextdomain()` 函数。\n\n4.  运行 `gawk --gen-pot\
  \ -f myprog.awk > myprog.pot` 为你的程序生成 `.pot` 文件。\n\n5.  提供相应的翻译，并构建和安装相应的 `.gmo`\
  \ 文件。\n\n国际化特性在 *GAWK: Effective AWK Programming* 中有详细的描述。\n\n## POSIX 兼容性\n\n`gawk`\
  \ 的主要目标是与 POSIX 标准兼容，并与 Brian Kernighan 的最新版本 `awk` 。为此，`gawk` 整合了以下用户可见特性，这些特性在\
  \ AWK 书中没有描述，但是 Brian Kernighan 版本 `awk` 的一部分，也是 POSIX 标准的一部分。\n\n书中指出，命令行变量赋值发生在\
  \ `awk` 原本应将参数作为文件打开时，这是在 `BEGIN` 规则执行之后。然而，在较早的实现中，当这种赋值出现在任何文件名之前时，该赋值会在 `BEGIN`\
  \ 规则运行*之前*发生。应用程序开始依赖这种“特性”。当 `awk` 更改以与其文档一致时，为了适应依赖旧行为的应用程序，添加了 `-v` 选项用于在程序执行前分配变量。（该特性已获得贝尔实验室和\
  \ GNU 开发者的共识。）\n\n在处理参数时，`gawk` 使用特殊选项 `''` 来指示参数的结束。在兼容模式下，它会对未定义的选项发出警告，但在其他情况下忽略它们。在正常操作中，这些参数会被传递给\
  \ AWK 程序处理。\n\nAWK 书没有定义 `srand()` 的返回值。POSIX 标准规定它返回其正在使用的种子，以便跟踪随机数序列。因此，`gawk`\
  \ 中的 `srand()` 也返回其当前种子。\n\n其他新特性包括：使用多个 `-f` 选项（来自 MKS `awk`）；`ENVIRON` 数组；`\\\
  a` 和 `\\v` 转义序列（最初在 `gawk` 中实现并反馈到贝尔实验室版本）；`tolower()` 和 `toupper()` 内置函数（来自贝尔实验室版本）；以及\
  \ `printf` 中的 ISO C 转换规范（首次在贝尔实验室版本中实现）。\n\n## 历史特性\n\n`gawk` 支持历史 AWK 实现中的一个特性：调用内置函数\
  \ `length()` 时不仅可以不带参数，甚至可以不带括号！因此，\n\n```awk\na = length# Holy Algol 60, Batman!\n\
  ```\n\n等同于以下：\n\n```awk\na = length()\na = length($0)\n```\n\n使用这种特性是一种不良做法，如果在命令行上指定了\
  \ `--lint`，`gawk` 会对其使用发出警告。\n\n## GNU 扩展\n\n*Gawk* 对 POSIX `awk` 拥有极其大量的扩展。这些特性在本节中进行了描述。通过在调用\
  \ `gawk` 时使用 `--traditional` 或 `--posix` 选项，禁用此处描述的所有扩展。\n\n以下 `gawk` 特性在 POSIX\
  \ `awk` 中不可：\n\n-   不对通过 `-f` 选项命名的文件进行路径搜索。因此 `AWKPATH` 环境变量不是特殊的。\n-   没有文件包含机制（`gawk`\
  \ 的 `@include` 机制）。\n-   没有动态添加用 C 编写的新函数的机制（`gawk` 的 `@load` 机制）。\n-   `\\x` 转义序列。（使用\
  \ `--posix` 禁用。）\n-   在 `?` 和 `:` 之后继续行的能力。（使用 `--posix` 禁用。）\n- AWK 程序中的八进制和十六进制常量。\n\
  -   `ARGIND`、`BINMODE`、`ERRNO`、`LINT`、`RT` 和 `TEXTDOMAIN` 变量不是特殊的。\n-   `IGNORECASE`\
  \ 变量及其副作用无效。\n-   `FIELDWIDTHS` 变量和固定宽度字段分割。\n-   `FPAT` 变量和基于字段值的字段分割。\n-   `PROCINFO`\
  \ 数组无效。\n-   将 `RS` 作为正则表达式使用。\n-   用于 I/O 重定向的特殊文件名不被识别。\n-   用于创建协进程的 `|&` 运算符。\n\
  -   `BEGINFILE` 和 `ENDFILE` 特殊模式无效。\n-   使用空字符串作为 `FS` 的值以及 `split()` 的第三参数来分割单个字符的能力。\n\
  -   `split()` 的可选第四个参数，用于接收分隔符文本。\n-   `close()` 函数的可选第二个参数。\n-   `match()` 函数的可选第三个参数。\n\
  -   在 `printf` 和 `sprintf()` 使用位置标识符的能力。\n-   向 `length()` 传递数组的能力。\n-   `and()`、`asort()`、`asorti()`、`bindtextdomain()`、`dcgettext()`、`dcntext()`、`gensub()`、`lshift()`、`mktime()`、`or()`、`patsplit()`、`rshift()`、`strtonum()`、`systime()`\
  \ 和 `xor()` 函数。\n\n## 环境变量\n\n`AWKPATH` 环境变量可以提供目录列表，`gawk` 将搜索通过 `-f`、`-i` 和 `--include`\
  \ 选项命名的文件。如果初始搜索失败，则在文件名后添加 `.awk` 再次搜索路径。\n\n`AWLIBPATH` 环境变量可以提供目录列表，`gawk` 将搜索通过\
  \ `-l` 和 `--load` 选项命名的文件。\n\n`GAWK_READ_TIMEOUT` 环境变量可以指定从终端、管道或包括套接字的双向通信中读取输入时的毫秒级超时。\n\
  \n对于通过 socket 连接到远程主机，`GAWK_SOCK_RETRIES` 控制重试次数，`GAWK_MSEC_SLEEP` 控制重试之间的间隔。间隔以毫秒为单位。在不支持\
  \ *usleep*(3) 的系统上，该值将向上取整为整数秒。\n\n如果环境中存在 `POSIXLY_CORRECT`，则 `gawk` 的行为将与指定了 `--posix`\
  \ 完全一样。如果指定了 `--lint`，`gawk` 会为此发出警告消息。\n\n## 退出状态\n\n如果带值使用 `exit` 语句，则 `gawk`\
  \ 将以给定的数值退出。\n\n否则，如果执行过程中没有问题，`gawk` 将以 C 常量 `EXIT_SUCCESS` 的值退出。这通常为 0。\n\n如果发生错误，`gawk`\
  \ 将以 C 常量 `EXIT_FAILURE` 的值退出。这通常为 1。\n\n\n\n\n\n如果 `gawk` 因为致命错误退出，则退出状态为 2。在非\
  \ POSIX 系统上，该值可能映射到 `EXIT_FAILURE`。\n\n## 版本信息\n\n本帮助页文档了 `gawk`，版本 4.1。\n\n## 作者\n\
  \n原始的 UNIX `awk` 版本由贝尔实验室的 Alfred Aho、Peter Weinberger 和 Brian Kernighan 设计并实现。Brian\
  \ Kernighan 继续对其进行维护和增强。\n\n来自自由软件基金会的 Paul Rubin 和 Jay Fenlason 编写了 `gawk`，以确保与第七版\
  \ UNIX 中分发的原始 `awk` 版本兼容。John Woods 贡献了许多错误修复工作。David Trueman 在 Arnold Robbins 的贡献下，使\
  \ `gawk` 与新版本的 UNIX `awk` 兼容。Arnold Robbins 是目前的维护者。\n\n请参阅 `GAWK: Effective AWK\
  \ Programming` 以获取 `gawk` 及其文档贡献者的完整列表。\n\n请查看 `gawk` 分发中的 `README` 文件，获取有关维护者以及当前支持哪些端口的最新信息。\n\
  \n## 错误报告\n\n如果您在 `gawk` 中发现了错误，请向 `bug-gawk@gnu.org` 发送电子邮件。请包含您的操作系统及其修订版本、`gawk`\
  \ 的版本（通过 `gawk --version` 获取）、您用于编译它的 C 编译器，以及一个尽可能小的重现问题的测试程序和数据。\n\n在发送错误报告之前，请执行以下操作。首先，验证您是否拥有最新版本的\
  \ `gawk`。许多错误（通常是微妙的错误）在每个发布版本中都会修复，如果您的版本过旧，问题可能已经解决。其次，请查看将环境变量 `LC_ALL` 设置为 `LC_ALL=C`\
  \ 是否会导致行为符合您的预期。如果是，则这是一个区域设置（locale）问题，可能可能不是真正的错误。最后，请仔细阅读本帮助页和参考手册，以确保您认为的错误确实是错误，而不是仅仅语言的特性。\n\
  \n无论您做什么，都**不要**在 `comp.lang.awk` 中发布错误报告。虽然 `gawk` 开发者偶尔会阅读这个新闻组，但在那里发布错误报告是报告错误的不可靠方法。相反，请使用上面提供的电子邮件地址。真的。\n\
  \n如果您正在使用 GNU/Linux 或基于 BSD 的系统，您可能希望向您发行版的供应商提交错误报告。这是可以的，但请也向官方电子邮件地址发送副本，因为无法保证错误报告会被转发给\
  \ `gawk` 维护者。\n\n## 缺陷\n\n考虑到命令行变量赋值功能，`-F` 选项并非必要；它仅保留用于向后兼容。\n\n## 另另\n\n`egrep(1)`,\
  \ `sed(1)`, `getpid(2)`, `getppid(2)`, `getpgrp(2)`, `getuid(2)`, `geteuid(2)`,\
  \ `getgid(2)`, `getegid(2)`, `getgroups(2)`, `usleep(3)`\n\n`The AWK Programming\
  \ Language`, Alfred V. Aho, Brian W. Kernighan, Peter J. Weinberger, Addison-Wesley,\
  \ 1988. ISBN 0-201-07981-X.\n\n`GAWK: Effective AWK Programming`, 第 4.1 版，随 `gawk`\
  \ 源码提供。该文档的当前版本可以在 `http://www.gnu.org/software/gawk/manual` 在线获取。\n\n## 示例\n\n\
  ```\n打印并排序所有用户的登录名：BEGIN { FS = \":\" } { print $1 | \"sort\" }\n```\n```\n统计文件行数：{\
  \ nlines++ } END { print nlines }\n```\n```\n在每行前加上其在文件中的编号：{ print FNR, $0 }\n\
  ```\n```\n连接并行号（主题的一种变体）：{ print NR, $0 }\n```\n```\n对特定数据行运行外部命令：tail -f access_log\
  \ | awk '/myhome.html/ { system(\"nmap \" $1 \">> logdir/myhome.html\") }'\n```\n\
