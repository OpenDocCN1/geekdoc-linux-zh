  ```\n\n\n\n\n```\n\\D'l 0 \\\\n(0hu+\\\\n(0du+2n'\n\\h'\\\\n(0wu+2n'\n```\n\n- `nr\
  \ 0w +2n`\n- `nr 0d +1n`\n- `nr 0h +1n`\n\n`space n` 整数 `n` 的正值（单位为 em 的百分分之一）用于设置公式前的垂直间距，负值用于设置公式后的间距，并替换默认值。该原语为\
  \ `groff` 的 `\\x` 转义字符提供了一个接口（但符号符号相反）。如果公式是 `pic` 图像的一部分，则该关键字不起作用。\n\n### 扩展原语\n\
  \n`col n {...}` `ccol n {...}` `lcol n {...}` `rcol n {...}` `pile n {...}` `cpile\
  \ n {...}` `lpile n {...}` `rpile n {...}` 整数值 `n`（单位为 em 的百分分之一）增加行之间的垂直间距，使用 `groff`\
  \ 的 `\\x` 转义字符（该值在 MathML 模式下无效）。可以是负值，但无效。如果矩阵中给出多个值，则使用最大的一个。\n\n### 定制化\n\n当\
  \ `eqn` 生成 troff 标记时，公式的外观由大量参数控制。在生成 MathML 模式时，这些参数无效，因为该模式将排版和微调交给了下游的 MathML\
  \ 渲染引擎。可以使用 `set` 命令设置这些参数。\n\n`set p n`\n\n这会将参数 `p` 设置为值 `n`；`n` 是一个整数。例如，\n\n\
  ```\nset x_height 45\n```\n\n表示 `eqn` 应该假设 x 高为 0.45 em。\n\n可能的参数如下。除非另有说明，值的单位均为\
  \ em 的百分分之一。这些描述旨在阐释，而非给出确定性定义。\n\n`minimum_size`\n`eqn` 不会对小于此值的点字号设置任何内容。值的单位是磅（points）。\n\
  \n`fat_offset`\n`fat` 原语通过覆盖水平偏移此距离的两个公式副本来使公式加粗。此参数在 MathML 模式下不使用；相反，粗体使用：\n\n\
  ```\n<mstyle mathvariant='double-struck'>\n```\n\n`over_hang` 分数线比分子和分母宽度最大值长两倍此数值；换句话说，它至少超出分子和分母此数值长度。`accent_width`\
  \ 当 `bar` 或 `under` 应用于单个字符时，线条长度为此。通常情况下，`bar` 或 `under` 产生的线条长度等于所应用对象的宽度；对于单个字符，这往往会产生一条看起来太宽的线。`delimiter_factor`\
  \ 使用 `left` 和 `right` 原语生成的扩展分隔符，其总高度和深度至少为被分隔符包围的子方程离轴最大距离的两倍的若干几千分之一。`delimiter_shortfall`\
  \ 使用 `left` 和 `right` 原语生成的扩展分隔符，其总高度和深度不小于被分隔符包围的子方程离轴最大距离的两倍与此值之差。`null_delimiter_space`\
  \ 在分数的每侧插入此宽的水平空间。`script_space` 下标和上标的宽度增加此数值。`thin_space` 在标点符号字符后自动会自动插入此数量的空间。`medium_space`\
  \ 在二元运算符的两侧自动插入此数量的空间。`thick_space` 在关系符号的两侧自动插入此数量的空间。`x_height` 不带升部字母的小写字母（如\
  \ 'x'）的高度。`axis_height` 字符 `+` 和 `-` 等字符中心相对于基线的高度。对于你正在使用的字体，该值的正确至关重要。`default_rule_thickness`\
  \ 这应设置为 `\\(ru` 字符的厚度，或使用 `\\D` 转义序列产生的水平线的厚度。`num1` `over` 命令将分子向上移动至少此距离。`num2`\
  \ `smallover` 命令将分子向上移动至少此距离。`denom1` `over` 命令将分母向下移动至少此距离。`denom2` `smallover`\
  \ 命令将分母向下移动至少此距离。`sup1` 通常情况下，上标被向上移动至少此距离。`sup2` 上标内部的上标、上限或 `smallover` 分式分子中的上标被向上移动至少此距离。这通常小于\
  \ `sup1`。`sup3` 分母、根号、下标或下限内部的上标向上移动至少此距离。这通常小于 `sup2`。`sub1` 下标通常被向下移动至少此距离。`sub2`\
  \ 当同时存在下标和上标时，下标被向下移动此距离。`sup_drop` 上标的基线不低于其所在物体下方的此距离。`sub_drop` 下标的基线至少位于其所在物体的下方此距离。`big_spacing_1`\
  \ 上限的基线至少在其所在的物体上方此距离。`big_spacing_2` 下限的基线至少在其所在的物体下方此距离。`big_spacing_3` 上限的顶部至少在其所在的物体上方此距离。`big_spacing_4`\
  \ 下限的底部至少在其所在的物体下方此距离。`big_spacing_5` 在限制的上下下方添加此垂直空间。`baseline_sep` `pile` 中行之间的基线间隔通常为此距离。`shift_down`\
  \ 矩阵中顶基线和底基线相对于轴向下偏移此距离。`column_sep` 矩阵列之间添加此宽的空间。`matrix_side_sep` 在矩阵每侧添加此宽的空间。`draw_lines`\
  \ 若此非零，则使用 `\\D` 转义序列绘制线条，而不是使用 `\\l` 转义序列和 `\\(ru` 字符。`body_height` 公式高度超过此值将作为公式前的额外间距（使用\
  \ `\\x`）。默认值为 85。`body_depth` 公式深度超过此值的深度将作为公式后的额外间距（使用 `\\x`）。默认值为 35。`nroff` 若此非零，则\
  \ `ndefine` 行为如 `define` 且忽略 `tdefine`；否则 `tdefine` 行为如 `define` 且忽略 `ndefine`。默认值为\
  \ 0（这通常由 `eqnrc` 文件为 `ascii`、`latin1`、`utf8` 和 `cp1047` 设备改为 1）。\n\n关于这些许多参数作用的更精确描述可见\
  \ *The TeXbook* 的附录 H。\n\n### 宏\n\n宏可以接受参数。在宏主体中，`n`（*n* 在 1 到 9 之间）在带参数调用宏时，会被替换为第\
  \ n 个参数；如果参数少于 n 个，则被替换为空。包含左括号的单词，如果左括号前的部分已使用 `define` 命令定义，则会被识别为带参数的宏调用；左括号到匹配右括号之间的字符被视为逗号分隔的参数；嵌套括号内的逗号不会终止参数。\n\
  \n`sdefine name anything`\n\n这类似于 `define` 命令，但 *name* 在带参数调用时不会被识别。\n\n`include\
  \ files`\n\n\n\n\n\n`copy files` 包含 `file` 的内容（`include` 和 `copy` 是同义词）。以 `.EQ`\
  \ 或 `.EN` 开头的 `file` 行将被忽略。\n\n`ifdef name X anything X`\n\n如果 `name` 已通过 `define`\
  \ 定义（或因为 `name` 是输出设备而自动定义），则处理 `anything`；否则忽略 `anything`。`X`可以是任意未出现在 `anything`\
  \ 中的字符。\n\n`undef name`\n\n移除 `name` 的定义，使其变为未定义。\n\n除了上述宏外，可以使用以下定义：`Alpha`、`Beta`、……`Omega`（这与\
  \ `ALPHA`、`BETA`……`OMEGA` 相同）、`ldots`（基线上的三个点）和 `dollar`。\n\n### 字体\n\n`eqn` 通常使用至少两种字体来设置公式：用于字母的斜体字体和用于其他内容的正字体。现有的\
  \ `gfont` 命令更改用作斜体的字体。默认情况下是`~I`。用作正体的字体可以使用新的 `grfont` 命令进行更改。\n\n`grfont f`\n\n\
  将正字体设置为`~f`。\n\n`italic` 原语使用由 `gfont` 设置的当前斜字体；`roman` 原语使用由 `grfont` 设置的当前正字体。还有一个新的\
  \ `gbfont` 命令，更改 `bold` 原语使用的字体。如果你只使用 `roman`、`italic` 和 `bold` 原语在公式内更改字体，你可以通过使用\
  \ `gfont`、`grfont` 和 `gbfont` 命令更改公式中使用的所有字体。\n\n你可以通过上述描述的 `chartype` 命令控制哪些字符被视为字母（并因此以斜体设置）。`letter`\
  \ 类型会导致字符被设置为斜体类型。`digit` 类型会导致字符被设置为正体类型。\n\n# 文件\n\nu+2n\n\n`/usr/share/groff/1.22.3/tmac/eqnrc`\
  \ 初始化文件。\n\n### MathML 模式限制\n\nMathML 的设计假设是，它无法获知渲染渲染的媒体和设备的精确物理特性。它对动作和大小的控制无法达到像\
  \ troff 那样的精细程度。因此：\n\n- `eqn` 参数对生成的 MathML 没有影响。\n- `special,`、`up`、`down`、`fwd`\
  \ 和 `back` 操作无法实现，而是产生 MathML `<merror>` 消息。\n- `vcenter` 关键字被静默忽略，因为在数学轴上居中是 MathML\
  \ 的默认设置。\n- `eqn` 比 troff 设置得更大的字符（特别是积分号）可能看起来太小，需要手动调整它们的 `<mstyle>` 包装器。\n\n\
  与其 troff 模式一样，MathML 模式下的 `eqn` 为显示公式保留 `.EQ` 和 `.EN` 分隔符，但不对内联公式发射显式分隔符。然而，它们可以识别为以\
  \ `<math>` 开头并 `</math>` 结尾且不跨越行的字符串。\n\n参见 `BUGS` 部分关于 `eqn` 的特定翻译限制。\n\n## 缺陷\n\
  \n内联公式按输入行开始时的当前字号设置。\n\n在 MathML 模式下，`mark` 和 `lineup` 功能不起作用。理论上，可以使用 `<maligngroup>`\
  \ 元素实现。\n\n在 MathML 模式下，数字字面量的每个数字都获得一个单独的 `<mn>:</mn>` 对，小数点被标记为 `<mo>:</mo>`。规范允许这样做，但效率低下。\n\
