  ## USAGE\n\n此处仅描述 GNU `eqn` 与 Unix `eqn` 之间的差异。\n\n### GNU eqn vs. Unix eqn`\n\n\
  GNU `eqn` 在使用 `-T~MathML` 选项调用时会生成演示型 MathML 输出。\n\nGNU `eqn` 将输入标记 `...` 设置为三个点或低点，而不是经典\
  \ `eqn` 的三个居中点。要获得三个居中点，请写 `cdots` 或 `cdot cdot cdot.`。\n\nGNU `eqn` 输入语言的大多数新功能基于\
  \ TeX。下文提到了一些 TeX 与 GNU `eqn` 之间的差异；如果你不知道 TeX，可以安全地忽略这些。\n\n### 控制分隔符\n\n如果不在兼容模式下，`eqn`\
  \ 识别\n\n`delim on`\n\n用于恢复之前通过 `'delim off` 禁用的分隔符。如果未指定分隔符，则该调用不起作用。\n\n### 自动间距\n\
  \n`eqn` 为公式的每个组件分配一个类型，并根据该类型调整组件之间的间距。可能的类型有：\n\n- ordinary（普通）：普通字符，如 '1' 或 'x'；\n\
  - operator（运算符）：大型运算符，如 'ÎŁ`；\n- binary（二元）：二元运算符，如 `+`；\n- relation（关系）：关系如 `=`；\n\
  - opening（左）：如 `(`；\n- closing（右）：如 `)`；\n- punctuation（标点）：标点符号如 `,cl;`；\n- inner（内部）：括号内的子公式；\n\
  - suppress spacing（抑制间距）：抑制自动间距调整。\n\n公式组件通过两种方式之一获取类型。\n\n`type te`\n\n这产生一个包含\
  \ `e` 的公式组件，但其类型为 `t`，其中 `t` 是上述类型之一。例如，`times` 定义为：\n\n`type \"binary\" \\(mu`\n\
  \n类型的名称不需要引号，但加引号可以防止宏展开。`chartype t text` 未加引号的字符组会被拆分成单个字符，并查找每个字符的类型；这会更改存储的每个字符的类型；它表示从现在起\
  \ `text` 中的字符类型为 `~t`。例如，\n\n`chartype \"punctuation\" .,;:`\n\n将使得字符 `'.,;:` 在此后出现在公式中都具有标点类型。类型\
  \ `t` 也可以是 `letter` 或 `digit`；在这些情况下，`chartype` 会改变字符的字体类型。参见 `Fonts` 节。\n\n###\
  \ 新原语\n\n`big e`\n\n放大其修改的表达式；意在具有类似于 CSS 'large' 的语义。在 troff 输出中，点号字体增加了~5；在 MathML\
  \ 输出中，表达式使用：\n\n```xml\n<mstyle mathsize='big'>\n```\n\n`e1 smallover e2` 这类似于 `over`；`smallover`\
  \ 减小 `e1` 和 `e2` 的尺寸；它还在 `e1` 或 `e2` 与分线之间留更少的垂直空间。`over` 原语对应于显示样式中的 TeX `\\over`\
  \ 原语；`smallover` 对应于非显示样式中的 `\\over`。`vcenter e` 将 `e` 绕着数学轴垂直居中。数学轴是 `+cq` 和 `-`\
  \ 等字符居中的垂直位置；它也是用于分数分线的垂直位置。例如，`sum` 定义为：\n\n```latex\n{ type \"operator\" vcenter\
  \ size +5 \\(*S }\n```\n（注意在生成 MathML 时，vcenter 被静忽略。）\n\n`special text e` 这使用一个名为\
  \ `text` 的 (1) 宏从 `e` 构建一个新对象。（实际上，查看提供的文本，我将格式化最后的特定块）。\n\n```latex\n.EQ\ndefine\
