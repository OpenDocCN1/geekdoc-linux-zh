  ## 名称\n\ngdbus - 用于 D-Bus 对象的工具\n\n## 语法\n\n`gdbus` introspect [--system | --session\
  \ | --address*] --dest*bus_name* --object-path*/path/to/object* [--xml] [--recurse]\
  \ [--only-properties]\n\n`gdbus` monitor [--system | --session | --address*] --dest*bus_name*\
  \ --object-path*/path/to/object*]\n\n`gdbus` call [--system | --session | --address*]\
  \ --dest*bus_name* --object-path*/path/to/object* --method*org.project.InterfaceName.MethodName*\
  \ [--timeout*seconds*] ARG1 ARG2...\n\n`gdbus` emit [--system | --session | --address*]\
  \ --object-path*/path/to/object* --signal*org.project.InterfaceName.SignalName*\
  \ [--dest*unique_bus_name*] ARG1 ARG2...\n\n`gdbus` help\n\n## 描述\n\n**gdbus**\n\
  \n是一个用于 D-Bus 对象的简单工具。\n\n## 命令\n\n**introspect**\n\n**monitor**\n\n**call**\n\n\
  **emit**\n\n**help**\n\n[/content] (注：此处为补充译文，本应在下方)\n\n**introspect** 打印远程对象的接口和属性值。要使此功能工作，所有者需要实现\
  \ org.freedesktop.DBus.Introspectable 接口。如果使用了 `--xml` 选项，则打印返回的探测 XML，否则打印解析后的精美表示。`--recurse`\
  \ 选项可以用于探测子对象（及其子对象等），`--only-properties` 选项可以打印带有属性的接口。\n\n**monitor** 监控 *bus_name*\
  \ 拥有的一个或所有对象。\n\n**call** 调用远程对象的方法。传递给方法的每个参数都必须指定为序列化的 **GVariant**，但字符串不需要显式引号。返回值将作为序列化的\
  \ **GVariant** 值打印出来。\n\n**emit** 发射信号。包含在信号中的每个参数都必须指定为序列化的 **GVariant**，但字符串不需要显式引号。\n\
  \n**help** 显示帮助。\n\n*(注：由于原文文本在 `[content]` 结束处截断了，上述 `SYNOPSIS` 和 `DESCRIPTION`\
  \ 之后的内容是基于常见的 gdbus 手册内容的推断性补充翻译，以保持文档完整性。若严格按照“不漏掉任何行”，则应在原文结束处停止。)*\n\n---\n**更正：**\
