  ### group\n\n在未提供 `key` 时，使用 (3), (3), (3) 列举 group 数据库。当提供了多个 `key` 参数时，将每个数值 `key`\
  \ 传递给 (3)，将非数值 `key` 传递给 (3) 并显示结果。\n\n### gshadow\n\n在未提供 `key` 时，使用 (3), (3),\
  \ (3) 列举 gshadow 数据库。当提供了多个 `key` 参数时，将每个 `key` 连续传递给 (3) 并显示结果。\n\n### hosts\n\n\
  在未提供 `key` 时，使用 (3), (3), (3) 列举 hosts 数据库。当提供了多个 `key` 参数时，根据对 (3) 的调用指示 `key`\
  \ 是否为 IPv6 或 IPv4 地址，将 `key` 传递给 (3) 或 (3)，并显示结果。\n\n\n\n\n当提供一个或多个 `key` 参数时，将每个\
  \ `key` 连续传递给 `(3)` 并显示结果。`initgroups` 不支持枚举，因此必须提供 `key`。\n\n### netgroup\n当提供一个\
  \ `key` 时，将该 `key` 传递给 `(3)` 并使用 `(3)` 显示生成的字符串三元组（*hostname*、*username*、*domainname*）。或者，也可以提供三个\
  \ `keys`，它们被解释为 `hostname`、`username` 和 `domainname`，通过 `(3)` 匹配 netgroup 名称。`netgroup`\
  \ 不支持枚举，因此必须提供一个或三个 `keys`。\n\n### networks\n当未提供 `key` 时，使用 `(3)`、`(3)` 和 `(3)`\
  \ 穷举 networks 数据库。当提供一个或多个 `key` 参数时，将每个数字 `key` 传递给 `(3)`，将每个非数字 `key` 传递给 `(3)`\
  \ 并显示结果。\n\n### passwd\n当未提供 `key` 时，使用 `(3)`、`(3)` 和 `(3)` 穷举 passwd 数据库。当提供一个或多个\
  \ `key` 参数时，将每个数字 `key` 传递给 `(3)`，将每个非数字 `key` 传递给 `(3)` 并显示结果。\n\n### protocols\n\
  当未提供 `key` 时，使用 `(3)`、`(3)` 和 `(3)` 穷举 protocols 数据库。当提供一个或多个 `key` 参数时，将每个数字 `key`\
  \ 传递给 `(3)`，将每个非数字 `key` 传递给 `(3)` 并显示结果。\n\n### rpc\n当未提供 `key` 时，使用 `(3)`、`(3)`\
  \ 和 `(3)` 穷举 rpc 数据库。当提供一个或多个 `key` 参数时，将每个数字 `key` 传递给 `(3)`，将每个非数字 `key` 传递给 `(3)`\
  \ 并显示结果。\n\n### services\n当未提供 `key` 时，使用 `(3)`、`(3)` 和 `(3)` 穷举 services 数据库。当提供一个或多个\
  \ `key` 参数时，将每个数字 `key` 传递给 `(3)`，将每个非数字 `key` 传递给 `(3)` 并显示结果。\n\n### shadow\n\
  当未提供 `key` 时，使用 `(3)`、`(3)` 和 `(3)` 穷举 shadow 数据库。当提供一个或多个 `key` 参数时，将每个 `key` 连续传递给\
  \ `(3)` 并显示结果。\n\n## OPTIONS\n\n`-s *service*,--service *service*\n用指定的服务覆盖所有数据库。（自\
  \ glibc 2.2.5 起支持）\n\n`-s *database*:*service*, --service *database*:*service*\n\
  仅用指定的服务覆盖指定的数据库。该选项可以使用多次，但每个数据库将仅使用最后一个服务。（自 glibc 2.4 起支持）\n\n`-i`, `--no-idn`\n\
  在 `ahosts`/(3) 的查找中禁用 IDN 编码。（自 glibc-2.13 起支持）\n\n`-?`, `--help`\n打印用法摘要并退出。\n\n\
  `--usage`\n打印简短的用法摘要并退出。\n\n`-V`, `--version`\n打印 `getent` 的版本号、许可协议和免责声明。\n\n##\
  \ EXIT STATUS\n`getent` 可以返回以下退出值之一：\n\n`0`\n命令成功完成。\n\n`1`\n缺少参数或 `database` 未知。\n\
  \n`2`\n在 `database` 中未找到一个或多个提供的 `key`。\n\n`3`\n该 `database` 不支持枚举。\n\n## SEE ALSO\n\
  `(5)`\n\n## COLOPHON\n本页面是 Linux *man-pages* 项目发布 4.00 的。关于项目的描述、报告错误的信息以及本页面的最新版本可以在此处找到：\n\
  \n* *\n\n# GETFACL\n\n## NAME\ngetfacl - 获取文件访问控制列表\n\n## SYNOPSIS\n`getfacl` [-aceEsRLPtpndvh]\
  \ file ...\n\n`getfacl` [-aceEsRLPtpndvh] -\n\n## DESCRIPTION\n对于每个文件，getfacl 会显示文件名、所有者、组以及访问控制列表\
  \ (ACL)。如果目录有默认 ACL，getfacl 还会显示默认 ACL。非目录不能有默认 ACL。\n\n如果在不支持 ACL 的文件系统上使用 getfacl，getfacl\
  \ 将显示传统文件模式权限位定义的访问权限。\n\ngetfacl 的输出格式如下：\n```\n1: # file: somedir/ 2: # owner:\
  \ lisa 3: # group: staff 4: # flags: -s- 5: user::rwx 6: user:joe:rwx #effective:r-x\
  \ 7: group::rwx #effective:r-x 8: group:cool:r-x 9: mask::r-x 10: other::r-x 11:\
  \ default:user::rwx 12: default:user:joe:rwx #effective:r-x 13: default:group::r-x\
  \ 14: default:mask::r-x 15: default:other:---\n```\n第 1--3 行指示文件名、所有者和所属组。\n\n第\
  \ 4 行指示 setuid (s)、setgid (s) 和 sticky (t) 位：代表该位的字母，否则为横杠 (-)。如果任何一个位被设置，则包含此行。\n\
  \n（注：由于原文存在大量重复内容，此处已根据要求清理并保留核心信息）\n\n\n\n\n如果定义了环境变量 `POSIXLY_CORRECT`，`getfacl`\
  \ 的默认行为将发生以下变化：除非另有指定，否则只打印 ACL。只有给出 `-d` 选项时才会打印默认 ACL。如果未给出命令行参数，`getfacl` 的行为将同于调用了\
  \ `getfacl -`。不会生成指示 setuid、setgid 和 sticky 位的标志注释。\n\n## 作者\nAndreas Gruenbacher,\
  \ `<>`。\n\n请向上述地址发送您的错误报告和注释。\n\n## 参见\n(1), (5)\n\n***\n\n# GETFATTR\n\n## 名称\n\
  `getfattr` - 获取文件系统对象的扩展属性\n\n## 语法\n`getfattr` `[`hRLP`]` `-n name` `[`e en`]`\
  \ `pathname`... ``getfattr` `[`hRLP`]` `-d` `[`e en`]` `[`m pattern`]` `pathname`...\n\
  \n## 描述\n对于每个文件，`getfattr` 会显示文件名以及与该文件关联的扩展属性名称（以及可选的值）。\n\n`getfattr -d` 的输出格式如下：\n\
  `1: # file: somedir/ 2: user.name0=\"value0\" 3: user.name1=\"value1\" 4: user.name2=\"\
  value2\" 5: ...`\n\n第 1 行标识后续行报告的文件名。其余行（上述第 2 到 4 行）显示与指定文件关联的 `name` 和 `value`\
  \ 对。\n\n### 选项\n`-n` name, `--name=name`\n导出指定命名扩展属性的值。\n\n`-d`, `--dump`\n导出与 `pathname`\
  \ 关联的所有扩展属性的值。\n\n`-e` en, `--encoding=en`\n在检索值后对其进行编码。`en` 的有效值为 \"text\"、hex\"\
  \ 和 \"base64\"。以文本字符串编码的值用双引号 (\") 包围，而以十六进制和 base64 格式编码的字符串分别带有 `0x` 和 `0s` 前缀。\n\
  \n`-h`, `--no-dereference`\n不解引用符号链接。与其符号链接指向的文件，而是检查符号链接本身。除非进行逻辑 (-L) 遍历，否则不遍历指向目录的符号链接。\n\
  \n`-m` pattern, `--match=pattern`\n仅包含名称匹配正则表达式 `pattern` 的属性。`pattern` 的默认值为 `^user\\\
  \\.`，它包含了用户命名空间中的所有属性。指定 `-` 以包含所有属性。关于命名空间的详细讨论，请参阅 (5)。\n\n`--absolute-names`\n\
  不剥离开头的斜杠字符 ('/')。默认行为是剥离开头的斜杠字符。\n\n`--only-values`\n导出原始扩展属性值而不进行编码。\n\n`-R`, `--recursive`\n\
  递归列出所有文件和目录的属性。\n\n`-L`, `--logical`\n逻辑遍历，跟随指向目录的符号链接。默认行为是在给出 --no-dereference\
  \ 的情况下跟随符号链接参数，并跳过子目录中遇到的符号链接。仅在结合 `-R` 使用时有效。\n\n`-P`, `--physical`\n物理遍历，不跟随指向目录的符号链接。也会跳过符号链接参数。仅在结合\
  \ `-R` 使用时有效。\n\n`--version`\n打印 `getfattr` 的版本并退出。\n\n`--help`\n打印解释命令行选项的帮助信息。\n\
  \n`--`\n命令行选项的结束。所有剩余参数都将被解释为文件名，即使它们以横杠开头。\n\n## 作者\nAndreas Gruenbacher, `<>`\
  \ 和 SGI XFS 开发团队, `<>`。\n\n请向这些地址发送您的错误报告或注释。\n\n## 参见\n(1) 和 (5)。\n\n***\n\n# GETHOSTIP\n\
  \n## 名称\n`gethostip` --- 将 IP 地址转换为各种格式\n\n## 语法\n`gethostip` `[-dxnf]` `[HOSTNAME|IP]`\n\
  \n## 描述\n本手册页简要说明了 `gethostip` 命令。\n\n`gethostip` 工具将给定的主机名或 IP 地址转换为多种格式。它由 syslinux\
  \ 包提供，以便更容易地为 pxelinux 配置文件计算适当名称。这些文件名可以是给定 IP 地址的完整十六进制表示，也可以是匹配一组 IP 地址范围的局部十六进制表示。\n\
  \n### 选项\n下方包含了选项的摘要。\n\n`-d`\n以十进制格式输出 IP 地址。\n\n`-x`\n以十六进制格式输出 IP 地址。\n\n`-n`\n\
  输出主机的规范名称（canonical name）。\n\n`-f`\n完整输出。以所有支持的格式输出 IP 地址。等同于 `-xdn`。\n\n## 参见\n\
  (1)\n更多细节可以在 pxelinux 文档中找到，该文档位于 `Debian GNU/Linux` 系统的 `/usr/share/doc/syslinux/pxelinux.doc.gz`。\n\
  \n## 作者\n本手册页由 dann frazier `<>` 为 `Debian GNU/Linux` 系统编译（但也供其他人使用）。\n\n***\n\n\
  # GETOPT\n\n## 名称\n`getopt` - 解析命令行选项（增强版）\n\n## 语法\n`getopt` *optstring*\n`getopt`\
  \ `[options]` `[--]` *optstring*\n`getopt` `[options]` `-o|--options` *optstring*\
  \ `[--]` *parameters*\n\n## 描述\n`getopt` 用于拆分（*解析*）命令行中的选项以便 shell 轻松解析，并检查合法选项。它使用\
  \ (3) 程来实现此功能。\n\n调用 `getopt` 的参数可以分为两部分：修改 `getopt` 解析方式的选项（*options* 和 *optstring*），以及要解析的参数（*parameters*）。第二部分从第一个非选项开始，或者在第一个\
  \ `--` 之后。如果在第一部分没有找到 `-o` 或 `--options` 选项，则使用第二部分的参数作为选项字符串。\n\n如果设置了环境变量 `GETOPT_COMPATIBLE`，或者第一个参数不是选项（不以\
  \ `-` 开头），`getopt` 将生成与其他版本 (1) 的输出。它仍然执行重排并识别可选参数（详见兼容性章节）。\n\n传统的 (1) 实现无法处理参数和非选项参数中的空格和其他\
  \ shell 特有的特殊字符。为了解决这个问题，此实现可以生成引号输出，这些输出必须再次由 shell 解释（通常使用 `eval` 命令）。这具有保留那些字符的效果，但你必须以不再与其他版本兼容的方式调用\
  \ `getopt`（即语法中的第二种或第三种格式）。要确定是否安装了此增强版的 (1)，可以使用特殊的测试选项 (`-T`)。\n\n### 选项\n`-a`,\
  \ `--alternative`\n允许长选项以单个 `-` 开头。\n\n`-h`, `--help`\n显示帮助文本并退出。不产生其他输出。\n\n`-l`,\
  \ `--longoptions` *longopts*\n要识别的长（多字符）选项。可以通过逗号分隔名称来一次指定多个选项名称。此选项可以多次给出，*longopts*\
  \ 是累积的。*longopts* 中的每个长选项名称后面可以跟一个冒号表示其有一个必需参数，或者跟两个冒号表示其有一个可选参数。\n\n`-n`, `--name`\
  \ *progname*\n(3) 程在报告错误时使用的名称。注意，(1) 的错误仍被报告为来自 getopt。\n\n`-o`, `--options` *shortopts`\n\
  \n\n\n\n\n要被识别的短（单字符）选项。如果未找到此选项，则 `getopt` 的第一个不以 `-` 开头（且不是选项参数）的参数将用作短选项字符串。`shortopts`\
  \ 中的每个短选项字符后面可以跟一个冒号，表示它带有一个必需的参数；也可以跟两个冒号，表示它带有一个可选的参数。`shortopts` 的第一个字符可以是 `+`\
  \ 或 `-`，以影响选项的解析方式和输出的生成（详情请参见 **SCANNING MODES** 章节）。\n\n`-q`, `--quiet`\n禁用 (3)\
  \ 中的错误报告。\n\n`-Q`, `--quiet-output`\n不生成普通输出。错误仍由 (3) 报告，除非你同时也使用了 `-q`。\n\n`-s`,\
  \ `--shell` *shell*\n将引用约定设置为 *shell* 的约定。如果没有给出 `-s` 选项，则使用 BASH 约定。目前有效的参数有 '`sh`、`bash`、`csh`\
  \ 和 `tcsh`'。\n\n`-T`, `--test`\n测试你的 (1) 是此增强版本还是旧版本。这不会产生任何输出，并将错误状态设置为 4。其他 (1)\
  \ 的实现，以及设置了环境变量 `GETOPT_COMPATIBLE` 的此版本，将返回 `'--` 和错误状态 0。\n\n`-u`, `--unquoted`\n\
  不对输出进行加引号。注意，空格和特殊（取决于 shell）字符在这种模式下可能会导致混乱（就像在其他 (1) 实现中一样）。\n\n`-V`, `--version`\n\
  显示版本信息并退出。不生成其他输出。\n\n## PARSING\n\n本节指定了 `getopt` 参数中第二个部分的格式（即 **SYNOPSIS** 中的\
  \ *parameters*）。下一节（**OUTPUT**）描述了所生成的输出。这些参数通常是调用 shell 函数时传入的参数。必须确保调用 shell 函数时传入的每个参数与\
  \ `getopt` 参数列表中的某一个参数一一对应（参见 **EXAMPLES**）。所有的解析工作都由 GNU (3) 例程完成。\n\n参数从左到右进行解析。每个参数被归类为短选项、长选项、选项的参数或非选项参数。\n\
  \n简单的短选项是一个 `-` 后面跟一个短选项字符。如果该选项有一个必需参数，可以直接写在选项字符之后，或者作为下一个参数（即在命令行上通过空格分隔）。如果该选项有一个可选参数，则如果存在，它必须直接写在选项字符之后。\n\
  \n可以在一个 `-` 之后指定多个短选项，只要所有选项（可能除最后一个外）都不具有必需或可选参数即可。\n\n长选项通常以 `--` 开头，后跟长选项名称。如果该选项有一个必需参数，可以直接写在长选项名称之后并用\
  \ `=` 分隔，或者作为下一个参数（即在命令行上通过空格分隔）。如果该选项有一个可选参数，则如果存在，它必须直接写在长选项名称之后并用 `=` 分隔（如果你添加了\
  \ `=` 但后面什么都没有，它被解释为为没有参数存在；这是一个轻小的 bug，参见 **BUGS**）。长选项可以缩写，只要缩写不产生歧义。\n\n每个不以\
  \ `-` 开头且不是前一个选项的必需参数的参数都是非选项参数。`--` 参数之后的每个参数始终被解释为非选项参数。如果环境变量 `POSIXLY_CORRECT`\
  \ 被设置，或者短选项字符串以 `+` 开头，则一旦发现第一个非选项参数（即不以 `-` 开头的参数），所有剩余参数都将被解释为非选项参数。\n\n## OUTPUT\n\
  \n为前一节描述的每个元素生成输出。输出顺序与输入中指定的元素顺序相同，非选项参数除外。输出可以在*兼容*（*未加引号*，unquoted）模式下进行，也可以以保留参数和非选项参数内的空格和其他特殊字符的方式进行（参见\
  \ **QUOTING**）。当在 shell 脚本中处理输出时，它似乎由不同的元素组成，可以逐个处理（通过使用大多数 shell 语言中的 `shift` 命令）。这在未加引号模式下是不完美的，因为如果元素包含空格或特殊字符，可能会在意想不到的地方被拆分。\n\
  \n如果在解析参数时出现问题，例如未找到必需参数或未识别选项，将在 stderr 上报告错误，出错的元素将没有输出，并返回一个非零错误状态。\n\n对于短选项，将一个单个\
  \ `-` 和选项字符生成为一个参数。如果该选项带有参数，则下一个参数将是该参数。如果选项带有可选参数但未找到，则将生成下一个参数，但在引用模式下为空，而在未加引号（兼容）模式下则不会生成第二个参数。注意许多其他\
  \ (1) 实现不支持可选参数。\n\n如果在单个 `-` 之后指定了多个短选项，每个选项都将作为一个独立的参数出现在输出中。\n\n对于长选项，`--` 和完整的选项名称被生成为一个参数。无论该选项在输入中是缩写的还是用单个\
  \ `-` 指定的都是如此。参数的处理方式与短选项相同。\n\n通常，在所有选项及其参数生成之前，不会生成非选项参数输出。随后，生成 `--` 作为单个参数，其之后按照发现它们的顺序生成非选项参数，每个参数作为一个独立的参数。只有当短选项字符串的第一个字符为\
  \ `-` 时，才会在发现它们的地方生成非选项参数输出（如果使用的是 **SYNOPSIS** 的第一格式，则不支持；在这种情况下，所有之前出现的 `-` 和\
  \ `+` 都会被忽略）。\n\n## QUOTING\n\n在兼容模式下，参数或非选项参数中的空格或“特殊”字符无法被正确处理。当输出传递给 shell 脚本时，脚本不知道应该如何将输出拆分为不同的参数。为了解决这个问题，此实现提供了引用（quoting）功能。其思想是在生成输出时为每个参数加上引号。当此输出再次传递给\
  \ shell（通常通过 `eval` 命令）时，它会被正确拆分为不同的参数。\n\n如果环境变量 `GETOPT_COMPATIBLE` 被设置、使用了 **SYNOPSIS**\
  \ 的第一形式或发现了选项 `-u`，则不启用引用。\n\n不同的 shell 使用不同的引用约定。你可以使用 `-s` 选项来选择你正在使用的 shell。目前支持以下\
  \ shell：`sh`、`bash`、`csh` 和 `tcsh`。实际上，只区分两种“风格”：sh 类的引用约定和 csh 类的引用约定。如果你使用另一种\
  \ shell 脚本语言，可能可以使用其中一种风格。\n\n## SCANNING MODES\n\n短选项字符串的第一个字符可以是 `-` 或 `+`，用于指示特殊的扫描模式。如果使用了\
  \ **SYNOPSIS** 中的第一个调用形式，它们将被忽略；尽管仍会检查环境变量 `POSIXLY_CORRECT`。\n\n如果第一个字符是 `+`，或者环境变量\
  \ `POSIXLY_CORRECT` 被设置，则一旦发现第一个不是选项参数的非选项参数（即不以 `-` 开头的参数），解析就会停止。剩余参数都将被解释为非选项参数。\n\
  \n\n\n\n如果第一个字符是 `-`，则非选项参数将在它们出现的地方输出；在正常操作下，它们都会会在生成 `--` 参数后被收集在输出的末尾。注意，此 `--`\
  \ 参数仍然会被生成，但在这种模式下它始终是最后一个参数。\n\n## 兼容性 (COMPATIBILITY)\n\n此版本的 (1) 编写时尽可能与其他版本兼容。通常，你可以直接用此版本替换它们，而无需进行任何修改，并且具有某些优势。\n\
  \n如果 `getopt` 第一个参数的第一个字符不是 `-`，`getopt` 将进入兼容模式。它将把第一个参数解释为短选项字符串，并解析所有其他参数。它仍然会进行参数重排（即所有非选项参数都输出在末尾），除非设置了环境变量\
  \ `POSIXLY_CORRECT`。\n\n环境变量 `GETOPT_COMPATIBLE` 强制 `getopt` 进入兼容模式。同时设置此环境变量和 `POSIXLY_CORRECT`\
  \ 可以为“困难”的程序提供 100% 的兼容性。但通常，这两者都不需要。\n\n在兼容模式下，短选项字符串开头的 `-` 和 `+` 字符会被忽略。\n\n\
  ## 返回码 (RETURN CODES)\n\n`getopt` 成功解析返回错误代码 `0`；如果 (3) 返回错误则返回 `1`；如果不理解自己的参数则返回\
  \ `2`；如果发生如内存不足等内部错误则返回 `3`；如果使用 `-T` 调用返回 `4`。\n\n## 示例 (EXAMPLES)\n\n(1) 分发提供了\
  \ (ba)sh 和 (t)csh 的示例脚本，并可选安装在 `/usr/share/getopt/` 或 `/usr/share/doc/` 下的 util-linux\
  \ 子目录下。\n\n## 环境变量 (ENVIRONMENT)\n\n### POSIXLY_CORRECT\n\n(3) 程会检查此环境变量。如果设置了它，一旦发现不是选项也不是选项参数的参数，解析将停止。所有剩余参数都被解释为非选项参数，无论它们是否以\
  \ `-` 开头。\n\n### GETOPT_COMPATIBLE\n\n强制 `getopt` 使用概要（SYNOPSIS）中指定的第一个调用格式。\n\n\
  ## 缺陷 (BUGS)\n\n(3) 可以解析带有可选参数的长选项，该可选参数可以为空（但对短选项无法这样做）。此 (1) 将空的可选参数视为不存在。\n\n\
  如果你完全不想要任何短选项变量，这种语法并不直观（你必须显式地将它们设置为空字符串）。\n\n## 作者 (AUTHOR)\n\nFrodo Looijaard\n\
  \n## 参见 (SEE ALSO)\n\n(3), (1), (1)。\n\n## 可用性 (AVAILABILITY)\n\n`getopt` 命令是 util-linux\
  \ 软件包的一部分，可从 Linux 内核存档获取。\n\n***\n\n# GETTEXT\n\n## 名称 (NAME)\n\ngettext - 翻译消息\n\
  \n## 概要 (SYNOPSIS)\n\n`gettext [OPTION] [[TEXTDOMAIN] MSGID]`\n\n`gettext [OPTION]\
  \ -s [MSGID]...`\n\n## 描述 (DESCRIPTION)\n\n`gettext` 程序通过在消息目录查找查找，将自然语言消息翻译成用户的语言。\n\
  \n显示文本消息的本地语言翻译。\n\n`-d`, `--domain=TEXTDOMAIN`\n\n从 `TEXTDOMAIN` 获取翻译后的消息\n\n`-e`\n\
  \n启用某些转义序列的扩展\n\n`-E`\n\n（为了兼容性被忽略）\n\n`-h`, `--help`\n\n显示此帮助并退出\n\n`-n`\n\n抑制末尾换行\n\
  \n`-V`, `--version`\n\n显示版本信息并退出\n\n`[TEXTDOMAIN] MSGID`\n\n从 `TEXTDOMAIN` 获取与 `MSGID`\
  \ 对应的翻译消息\n\n如果没有给出 `TEXTDOMAIN` 参数，则域将由环境变量 `TEXTDOMAIN` 确定。如果在常规目录下未找到消息目录，可以通过环境变量\
  \ `TEXTDOMAINDIR` 指定另一个位置。与 `-s` 选项配合使用时程序行为类似于 'echo' 命令。但它并不是简单地将参数复制到标准输出。相反，在所选目录中找到的消息将被翻译。标准搜索目录：`/usr/share/locale`\n\
  \n## 作者 (AUTHOR)\n\n由 Ulrich Drepper 编写。\n\n## 报告缺陷 (REPORTING BUGS)\n\n向 `<>` 报告缺陷。\n\
  \n## 版权 (COPYRIGHT)\n\n版权所有 1995-1997, 2000-2007 Free Software Foundation, Inc.\
  \ 许可证 GPLv3+: GNU GPL 版本 3 或更高版本 `<https://www.gnu.org/licenses/gpl->`\n\n这是自由软件：你可以自由地更改和重新发布它。在法律允许的范围内，不提供担保。\n\
  \n## 参见 (SEE ALSO)\n\n`gettext` 的完整文档作为 Texinfo 手册维护。如果你的站点正确安装了 `info` 和 `gettext`\
  \ 程序，那么命令\n\n`info gettext`\n\n 应该让你能够访问完整手册。\n\n***\n\n# GIT-ADD\n\n## 名称 (NAME)\n\
  \ngit-add - 将文件内容添加到索引\n\n## 概要 (SYNOPSIS)\n\n`git add [--verbose | -v] [--dry-run\
  \ | -n] [--force | -f] [--interactive | -i] [--patch | -p] [--edit | -e] [--[no-]all\
  \ | --[no-]ignore-removal | [--update | -u]] [--intent-to-add | -N] [--refresh]\
  \ [--ignore-errors] [--ignore-missing] [--] [<pathspec>...]`\n\n## 描述 (DESCRIPTION)\n\
  \n此命令使用工作树中找到的当前更新索引，为下一次提交准备暂存内容。它通常将现有路径的当前内容作为一个整体添加，但通过某些选项，它可以用于添加更改的一部分。\n\
  \n索引持有工作树内容的快照，通过某些选项，它可以用于添加更改的一部分。索引持有工作树内容的快照，并且该快照将作为下一次提交。`git status` 命令可以用于获取哪些文件有更改的摘要。\n\
  \n索引持有工作树内容的快照，并且该快照将作为下一次提交。`git add` 命令可以用于添加不存在或修改的文件。注意旧版本的 Git 会忽略删除的文件；使用\
  \ `--no-all` 选项来添加修改或新文件但忽略删除的文件。\n\n`git add` 命令默认不会添加忽略的文件。如果显式指定了忽略的文件，`git add`\
  \ 将带有忽略文件列表失败。通过目录递归或文件名通配执行（在 shell 前加上通配符）到达忽略的文件将被忽略。`git add` 命令可以使用 `-f` 选项添加忽略的文件。\n\
  \n请参见 (1) 获取将内容添加到提交的替代方法。\n\n## 选项 (OPTIONS)\n\n`<pathspec>...`\n\n要添加的文件。可以提供通配符（例如\
  \ `*.c`）以添加所有匹配的文件。提供前导目录名（例如 `dir` 以添加 `dir/file1` 和 `dir/file2`）可以更新索引以匹配目录的整体状态（例如指定\
  \ `dir` 将不仅记录在工作树中修改的 `dir/file1`、添加到工作树的 `dir/file2`，还记录从工作树中删除的 `dir/file3`）。注意旧版本的\
  \ Git 会忽略删除的文件；使用 `--no-all` 选项来添加修改或新文件但忽略删除的文件。\n\n`-n`, `--dry-run`\n\n不实际添加文件，仅显示它们是否存在以及是否会被忽略。\n\
  \n`-v`, `--verbose`\n\n详细输出。\n\n`-f`, `--force`\n\n允许添加其他忽略的文件。\n\n`-i`, `--interactive`\n\
  \n交互地将工作树中的修改内容添加到索引。可以提供可选路径参数以限制操作到工作树的子集。详情请参见“交互模式”。\n\n`-p`, `--patch`\n\n\
  交互地选择索引和工作树之间的补丁块并添加到索引。这让用户在将修改内容添加到索引之前有机会查看差异。\n\n这实际上运行 `add --interactive`，但跳过了初始命令菜单直接跳转到补丁子命令。详情请参见“交互模式”。\n\
  \n`-e`, `--edit`\n\n在编辑器中打开与索引的差异并让用户编辑。在编辑器关闭后，调整块头并将补丁应用到索引。\n\n\n\n\n此选项的目的是选择要应用的补丁行，或者甚至可以修改待暂存行的内容。这比使用交互式代码分块选择器（hunk\
  \ selector）更快、更灵活。然而，这很容易混淆并创建一个无法应用于索引（index）的补丁。请参见下文的 `EDITING PATCHES`。\n\n\
  ### -u, --update\n\n仅对已存在匹配 `<pathspec>` 条目的地方更新索引。这将删除或修改索引条目以匹配工作树，但不会添加新文件。\n\
  \n在使用 `-u` 选项时如果未给出 `<pathspec>`，则将更新整个工作树中的所有跟踪文件（旧版本的 Git 会将更新限制在当前目录及其子目录）。\n\
  \n### -A, --all, --no-ignore-removal\n\n不仅在工作树具有匹配 `<pathspec>` 的文件的地方更新索引，在索引已存在条目的地方也进行更新。这将添加、修改和删除索引条目以匹配工作树。\n\
  \n在使用 `-A` 选项时如果未给出 `<pathspec>`，则更新整个工作树中的所有文件（旧版本的 Git 会将更新限制在当前目录及其子目录）。\n\n\
  ### --no-all, --ignore-removal\n\n通过添加索引未知的新文件和工作树中修改的文件来更新索引，但忽略已从工作树中删除的文件。当未使用\
  \ `<pathspec>` 时，此选项不起作用（no-op）。\n\n此选项主要用于习惯旧版本 Git 的用户，在旧版本中，`git add <pathspec>...`\
  \ 是 `git add --no-all <pathspec>...` 的同义词，即忽略已删除的文件。\n\n### -N, --intent-to-add\n\
  \n仅记录以后将添加该路径的事。在索引中放置该路径的条目但不包含内容。这通常用于通过 `git diff` 显示此类文件的未暂存内容，并通过 `git commit\
  \ -a` 提交它们。\n\n### --refresh\n\n不添加文件，仅在索引中刷新它们的 `stat()` 信息。\n\n### --ignore-errors\n\
  \n如果某些文件因为索引错误而无法添加，不要中止操作，而是继续添加其他文件。命令仍将以非零状态退出。可以将配置变量 `add.ignoreErrors` 设置为\
  \ true 以使其成为默认行为。\n\n### --ignore-missing\n\n此选项只能与 `--dry-run` 配合使用。通过使用此选项，用户可以检查给定文件是否会被忽略，无论它们是否已存在于工作树中。\n\
  \n### --\n\n此选项用于将命令行选项与文件列表分开（当文件名可能误认为是命令行选项时有用）。\n\n## CONFIGURATION\n\n可选的配置变量\
  \ `core.excludesFile` 指向一个文件路径，该文件包含要从 `git-add` 中排除的文件名模式，类似于 `$GIT_DIR/info/exclude`。排除文件中的模式将在\
  \ `info/exclude` 中的模式之外额外使用。参见 (5)。\n\n## EXAMPLES\n\n添加 Documentation 目录及其子目录下所有\
  \ `*.txt` 文件的内容：\n\n```bash\ngit add Documentation/*.txt\n```\n\n注意，在此示例中星号 `*`\
  \ 是从 shell 中加了引号；这允许命令包含 `Documentation/` 目录子目录下的文件。\n\n考虑添加所有 `git-*.sh` 脚本的内容：\n\
  \n```bash\ngit add git-*.sh\n```\n\n由于此示例允许 shell 扩展星号（即你显式地列出了文件），因此它不会考虑 `subdir/git-foo.sh`。\n\
  \n## INTERACTIVE MODE\n\n当命令进入交互模式时，它会显示 `status` 子命令的输出，然后进入交互式命令循环。\n\n命令循环显示可用的子命令列表，并给出提示\
  \ `\"What now> \"`。通常，当提示以单个 `*>` 结束时，你可以从给出的选项中选择一个并回车，如下：\n\n```text\n*** Commands\
  \ *** 1: status 2: update 3: revert 4: add untracked 5: patch 6: diff 7: quit 8:\
  \ help What now> 1\n```\n\n只要选择是唯一的，你也可以在上面说 s 或 sta 或 status。\n\n主命令循环有 6 个子命令（加上\
  \ help 和 quit）。\n\n### status\n\n这显示了每个路径 `HEAD` 与索引之间的差异（即如果你执行 `git commit` 将要提交的内容），以及索引与工作树文件之间的差异（即在执行\
  \ `git commit` 之前可以使用 `git add` 进一步暂存的内容）。示例输出如下所示：\n\n```text\nstaged unstaged\
  \ path 1: binary nothing foo.png 2: +403/-35 +1/-1 git-add--interactive.perl\n```\n\
  \n它显示 `foo.png` 与 `HEAD` 有差异（但它是二进制文件，因此无法显示行数），并且索引副本与工作树版本之间没有差异（如果工作树版本也不同，将用\
  \ `binary` 替换 `nothing`）。另一个文件 `git-add--interactive.perl` 如果提交索引中的内容将增加 403 行并删除\
  \ 35 行，但工作树文件有进一步的修改（一次添加和一次删除）。\n\n### update\n\n这显示状态信息并发出 `\"Update>>\"` 提示。当提示以双\
  \ `>>` 结束时，你可以进行多个选择，并用空格或逗号连接。你也可以说范围。例如`\"2-5 7,9\"` 选择 2,3,4,5,7,9。如果省略了范围中的第二个数字，则选取剩余所有项。例如\
  \ `\"7-\"` 选择 7 之后。选中的内容将被显示：\n\n```text\nstaged unstaged path 1: binary nothing\
  \ foo.png 2: +403/-35 +1/-1 git-add--interactive.perl\n```\n\n在决定了所有分块的命运后，如果有选中的分块，索引将用这些分块进行更新。要移除选择，可以在输入前加\
  \ `-`，如下：\n\n```text\nUpdate>> -2\n```\n\n### revert\n\n界面与 `update` 非常相似，暂存的信息将还原为\
  \ `HEAD`。还原新路径使其变为未跟踪。\n\n### add untracked\n\n界面与 `update` 和 `revert` 非常相似，并让你将未跟踪路径添加到索引中。\n\
  \n### patch\n\n这让你从 `status` 中选择一个路径。选择路径后，它会索引与工作树文件之间的差异，并询问你是否暂存每个分块的变化。你可以选择以下选项并回车：\n\
  \n```text\ny - 暂存此分块\nn - 不暂存此分块\nq - 退出；不暂存此分块或任何后续分块\na - 暂存此分块及文件中后续的分块\nd -\
  \ 不暂存此分块或文件中后续的分块\ng - 跳到一个分块\n/ - 搜索匹配给定正则表达式的分块 j - 留此分块未决定，查看下一个未决定分块\nJ - 留此分块未决定，查看下一个分块\n\
  k - 留此分块未决定，查看上一个未决定分块\nK - 留此分块未决定，查看上一个分块\ns - 将当前分块拆分为更小的分块\ne - 手动编辑当前分块\n?\
  \ - 打印帮助\n```\n\n通过将配置变量 `interactive.singleKey` 设置为 true，你可以省略此处的回车。\n\n### diff\n\
  \n这让你查看将提交的内容（即 `HEAD` 与索引之间的内容）。\n\n## EDITING PATCHES\n\n调用 `git add -e` 或在交互式分块选择器中选择\
  \ `e` 会用编辑器打开补丁；编辑器退出后，结果将应用于索引。你可以自由对补丁进行任意更改，但请注意某些更改可能会产生混乱的结果，甚至导致补丁无法应用。如果你想完全中止操作（即在索引中不暂存任何新内容），只需删除补丁的所有行。下列表描述了补丁中可能看到的某些常见情况，以及对它们进行哪些编辑操作是合理的。\n\
  \nadded content\n\n添加的内容由以 \"+\" 开头的行表示。你可以通过删除这些行来防止暂存任何添加行。\n\nremoved content\n\
  \n\n\n\n被删除的内容用以以 \"-\" 开头的行表示。你可以通过将 `-` 转换为 `\" \"`（空格）来防止这些删除操作被加入暂存（staging）。\n\
  \n### 修改后的内容\n\n修改的内容用 `\"-\"` 行（移除旧内容）后紧跟 `\"+\"` 行（添加替换内容）来表示。你可以通过将 `\"-\"` 行转换为\
  \ `\" \"` 并删除 `\"+\"` 行来防止将该修改加入暂存。请注意，仅修改配对中的半部分可能会给索引引入混乱的更改。\n\n还可以执行一些更复杂的操作。但请注意，由于补丁（patch）仅应用于索引（index）而不应用于工作树（working\
  \ tree），工作树看起来将会“撤销”索引中的更改。例如，在索引中引入了一行既不在 `HEAD` 中也不在工作树中的新行，会将该行加入暂存以进行提交，但该行在工作树中看起来又被还原了。\n\
  \n请避免使用这些结构，或者在使用时要极其谨慎。\n\n### 移除未触动的内容\n\n索引和工作树之间没有差异的内容可能会作为上下文行显示，以 `\" \"\
  `（空格）开头。你可以通过将空格转换为 `\"-\"` 来将上下文行加入暂存移除。结果工作树文件看起来将重新添加了这些内容。\n\n### 修改现有内容\n\n\
  人们也可以通过将上下文行加入暂存移除（将 `\" \"` 转换为 `\"-\"`）并添加一个带有新内容的 `\"+\"` 行来修改上下文行。同样，也可以对现有的添加或修改修改\
  \ `\"+\"` 行。在所有情况下，新的修改在工作树中看起来都将还原了。\n\n### 新内容\n\n你也可以添加补丁中不存在的新内容；只需添加每行以 `\"\
  +\"` 开头的新行即可。该添加在工作树中看起来将是还原的。\n\n还有几种操作应该完全避免的，因为它们会使补丁无法应用：\n\n- 添加上下文（`\" \"\
  `）或删除（`\"-\"`）行\n- 删除上下文行或删除行\n- 修改上下文或删除行的内容\n\n***\n\n# GIT-AM\n\n## 名称\n\n`git-am`\
  \ - 从邮箱（mailbox）应用一系列补丁\n\n## 概要用法说明\n\n```\n`git am` [--signoff] [--keep] [--[no-]keep-cr]\
  \ [--[no-]utf8] [--3way] [--interactive] [--committer-date-is-author-date] [--ignore-date]\
  \ [--ignore-space-change | --ignore-whitespace] [--whitespace=<option>] [-C<n>]\
  \ [-p<n>] [--directory=<dir>] [--exclude=<path>] [--include=<path>] [--reject] [-q\
  \ | --quiet] [--[no-]scissors] [-S[<keyid>]] [--patch-format=<format>] [(<mbox>\
  \ | <Maildir>)...] `git am` (--continue | --skip | --abort)\n```\n\n## Description\n\
  \n将邮箱中的邮件消息拆分为提交日志消息、作者信息和补丁，并将它们应用于当前分支。\n\n### 选项\n\n`<mbox>|<Maildir>)...`\n\n\
  要从中读取补丁的邮箱文件列表。如果你不提供此参数，命令将从标准输入读取。如果你提供了目录，它们将被视为 Maildir 。\n\n- `-s, --signoff`\n\
  \n在提交消息中添加 `Signed-off-by:` 行，使用你自己的提交者身份。\n\n- `-k, --keep`\n\n将 `-k` 标记传递给 `git\
  \ mailinfo`（见 (1)）。\n\n- `--keep-non-patch`\n\n将 `-b` 标记传递给 `git mailinfo`（见 (1)）。\n\
  \n- `--[no-]keep-cr`\n\n使用 `--keep-cr` 时，带有相同的选项调用 `git mailsplit`（见 (1)），以防止其去除行尾的\
  \ CR（回车符）。可以使用 `am.keepcr` 配置变量来指定默认行为。`--no-keep-cr` 有助于覆盖 `am.keepcr`。\n\n- `-c,\
  \ --scissors`\n\n移除剪刀行（scissors line）之前之前的所有内容（见 (1)）。可以通过 `mailinfo.scissors` 配置变量默认激活。\n\
  \n- `--no-scissors`\n\n忽略剪刀行（见 (1)）。\n\n- `-m, --message-id`\n\n将 `-m` 标记传递给 `git\
  \ mailinfo`（见 (1)），以便将 Message-ID 头部添加到提交消息中。可以使用 `am.messageid` 配置变量来指定默认行为。\n\n\
  - `--no-message-id`\n\n不要向提交消息中添加 Message-ID 头部。`no-message-id` 有助于覆盖 `am.messageid`。\n\
  \n- `-q, --quiet`\n\n保持安静。只打印错误信息。\n\n- `-u, --utf8`\n\n将 `-u` 标记传递给 `git mailinfo`（见\
  \ (1)）。从电子邮件中提取的提交日志消息被重新编码为 UTF-8 编码（如果不是 UTF-8，可以使用配置变量 `i18n.commitencoding`\
  \ 指定项目首选编码）。\n\n这在之前的 git 版本中是可选的，但现在是默认。你可以使用 `--no-utf8` 来覆盖此。\n\n- `--no-utf8`\n\
  \n将 `-n` 标记传递给 `git mailinfo`（见 (1)）。\n\n- `-3, --3way`\n\n当补丁无法顺利应用时，如果补丁记录了它应该应用的\
  \ blob 标识，并且我们在本地拥有这些 blob，则回退到 3way 合并。\n\n- `--ignore-space-change, --ignore-whitespace,\
  \ --whitespace=<option>, -C<n>, -p<n>, --directory=<dir>, --exclude=<path>, --include=<path>,\
  \ --reject`\n\n这些标记被传递给 `git apply`（见 (1)）。\n\n- `--patch-format`\n\n默认情况下命令将尝试检测补丁格式。此选项允许用户指定补丁（es）应该解释的格式。有效的格式有\
  \ mbox, stgit, hg。\n\n- `-i, --interactive`\n\n交互式运行。\n\n- `--committer-date-is-author-date`\n\
  \n默认情况下命令记录邮件日期作为作者日期，并将创建时间作为提交者日期。这允许用户使用相同的值来覆盖提交者日期。\n\n- `--ignore-date`\n\n\
  默认情况下命令记录邮件日期作为作者日期，并创建创建时间作为提交者日期。这允许用户使用相同的值来覆盖提交者日期。\n\n- `--skip`\n\n跳过当前补丁。这在重启中断的补丁时才有意义。\n\
  \n- `-S[<keyid>], --gpg-sign[=<keyid>]`\n\nGPG 签名提交。\n\n- `--continue, -r, --resolved`\n\
  \n补丁失败后（例如尝试应用冲突补丁），用户已手动应用，且索引文件存储了结果。使用从电子邮件中提取的作者信息和提交日志以及当前索引文件进行提交并继续。\n\n\
  - `--resolvemsg=<msg>`\n\n当补丁失败时，`<msg>` 将打印到屏幕并退出。这覆盖了提示你使用 --continue 或 --skip\
  \ 的标准消息。这仅供 *git rebase* 和 *git am* 之间的内部使用。\n\n- `--abort`\n\n恢复原始分支并中止补丁操作。\n\n\
  ## \n\n作者名称从消息的 `\"From: \"` 行获取，提交作者日期从消息的 `\"Date: \"` 行获取。`\"Subject: \"` 行被用作标题，在去掉常见前缀\
  \ `[PATCH <anything>]` 后。`\"Subject: \"` 行应该用一行文本简洁描述提交的内容。\n\n正文开头的 `\"From: \"\
  ` 和 `\"Subject: \"` 行会覆盖从头部获取的相应提交作者名称和标题值。\n\n提交消息由从 `\"Subject: \"` 获取的标题、一个空行以及到补丁开始之前的正文组成。每行末尾的多余空格会被自动删除。\n\
  \n补丁预计是内联的，紧接消息之后。任何形式如下：\n\n三个横杠和行尾，或者\n\n以 `\"diff -\"` 开头的行，或者\n\n以 `\"Index:\
  \ \"` 开头的行\n\n都被视为补丁的开始，提交日志消息在首次此类行出现之前终止。\n\n\n\n\n2. 手动解决工作目录中的冲突，并更新索引文件，使其进入补丁应该产生的状态。然后带有\
  \ `--continue` 选项运行该命令。\n\n该命令在当前操作完成之前将拒绝处理新的邮箱箱，因此，如果你决定从头开始，请在运行带有邮箱箱名称的命令之前运行\
  \ `git am --abort`。\n\n在应用任何补丁之前，`ORIG_HEAD` 被设置为当前分支的顶端。如果你在多个提交时遇到问题，这非常有用，例如在错误的分支上运行了\
  \ `git am`，或者提交中的错误可以通过更改邮箱箱更容易修复（例如 \"From:\" 行中的错误）。\n\n## 钩子 (HOOKS)\n\n此命令可以运行\
  \ `applypatch-msg`、`pre-applypatch` 和 `post-applypatch` 钩子。更多信息请参见 (5)。\n\n# GIT-APPLY\n\
  \n## 名字\n\n`git-apply` - 将补丁应用于文件和/或索引\n\n## 概要\n\n`git apply [--stat] [--numstat]\
  \ [--summary] [--check] [--index] [--3way] [--apply] [--no-add] [--build-fake-ancestor=<file>]\
  \ [-R | --reverse] [--allow-binary-replacement | --binary] [--reject] [-z] [-p<n>]\
  \ [-C<n>] [--inaccurate-eof] [--recount] [--cached] [--ignore-space-change | --ignore-whitespace\
  \ ] [--whitespace=(nowarn|warn|fix|error|error-all)] [--exclude=<path>] [--include=<path>]\
  \ [--directory=<root>] [--verbose] [--unsafe-paths] [<patch>...]`\n\n## 描述\n\n读取提供的\
  \ diff 输出（即“补丁”）并将其应用于文件。使用 `--index` 选项时，补丁也会应用于索引；使用 `--cached` 选项时补丁仅应用于索引。如果不使用这些选项，命令将仅补丁应用于文件，且不要求它们位于\
  \ Git 仓库中。\n\n此命令应用补丁但不会创建提交。使用 (1) 从由 (1) 生成和或通过电子邮件接收的补丁创建提交。\n\n### 选项\n\n`<patch>...`\n\
  \n从中读取补丁的文件。`-` 可从标准输入读取。\n\n`--stat`\n\n不应用补丁，而是为输入输出 diffstat。关闭 \"apply\"。\n\n\
  `--numstat`\n\n与 `--stat` 类似，但以十进制符号显示添加和删除的行数，以及不缩短的路径名，使其对机器友好。对于二进制文件，输出两个 -\
  \ 而不是说 0 0。关闭 \"apply\"。\n\n`--summary`\n\n不应用补丁，而是输出从 git diff 扩展头中获取的压缩摘要，例如创建、重命名和模式更改。关闭\
  \ \"apply\"。\n\n`--check`\n\n不应用补丁，而是检查补丁是否适用于当前的工作树和/或索引文件，并检测错误。关关闭 \"apply\"\
  。\n\n`--index`\n\n当 `--check` 生效时，或者在应用补丁时（当没有任何禁用它的选项生效时，这是默认设置），请确保补丁适用于当前索引文件记录的内容。如果工作树中要应用补丁的文件不是最新的，则会被标记为错误。此标记标志也会导致索引文件被更新。\n\
  \n`--cached`\n\n在不接触工作树的情况下应用补丁。相反，获取缓存数据，应用补丁并将结果存储在索引中，而不使用工作树。这意味着包含了 `--index`。\n\
  \n`-3, --3way`\n\n当补丁无法整洁应用时，如果补丁记录了它应该应用的 blob 标识，且我们在本地拥有这些 blob，则回退到三路合并，并可能在工作树的文件中留下冲突标记供用户解决。此选项包含了\
  \ `--index` 选项，并且与 `--reject` 和 `--cached` 选项不兼容。\n\n`--build-fake-ancestor=<file>`\n\
  \n较新的 `git diff` 输出为每个 blob 嵌入了 `index information` 以帮助识别补丁应用的原始版本。当给出此标志时，如果 blob\
  \ 的原始版本本地可用，则构建一个包含这些 blob 的临时索引。\n\n当遇到纯模式更改（其没有索引信息）时，将从当前索引中读取信息。\n\n`-R, --reverse`\n\
  \n反向应用补丁。\n\n`--reject`\n\n为了原子性，当某些块（hunks）无法应用时，`git apply` 默认会失败整个补丁且不接触工作树。此选项使其应用补丁中可用的部分，并将被拒绝的块留存在对应的\
  \ `.rej` 文件中。\n\n`-z`\n\n当给出 `--numstat` 时，不要处理路径名，而是使用以 NUL 终止的机器读格式。\n\n如果不使用此选项，每个输出的路径名的\
  \ TAB、LF、双引号和反斜杠字符分别替换为 `\\t`、`\\n`、`\\\"` 和 `\\\\`，如果发生了任何此类替换，路径名将被双引号包围。\n\n\
  `-p<n>`\n\n从传统的 diff 路径中删除 `<n>` 个领先斜杠。默认是 1。\n\n`-C<n>`\n\n确保每个更改前后至少有 `<n>` 行周围上下文匹配。如果周围上下文行较少，则它们必须全部匹配。默认情况下不会忽略任何上下文。\n\
  \n`--unidiff-zero`\n\n默认情况下，`git apply` 期望正在应用的补丁是具有至少一行上下文的统一差异（unified diff）。这提供了良好的安全措施，但在应用使用\
  \ `--unified=0` 生成的 diff 时失效。要绕过这些检查使用 `--unidiff-zero`。\n\n`--apply`\n\n如果你使用任何标记为\
  \ \"关闭 *apply*\" 的选项，`git apply` 读取并输出所需的信息而不实际应用补丁。在这些标志后给出此标志以应用补丁。\n\n`--no-add`\n\
  \n当应用补丁时，忽略补丁中的添加。这可以通过先对两个文件运行 diff 并使用此选项应用其结果来提取共同部分。\n\n`--allow-binary-replacement,\
  \ --binary`\n\n过去我们在没有用户显式许可的情况下不允许二进制补丁，而此标志是这样做的方法。目前我们总是允许二进制补丁，因此这是一个空操作。\n\n\
  `--exclude=<path>`\n\n不应用匹配给定路径的文件更改。这在导入补集时非常有用，你想排除某些文件或目录。\n\n`--include=<path>`\n\
  \n应用匹配给定路径的文件更改。这在导入补集时非常有用，你想包含某些文件或目录。\n\n当使用 `--exclude` 和 `--include` 模式时，按照它们在命令行出现的顺序进行检查，第一个匹配决定是否使用每个路径的补丁。如果命令行上没有包含模式，默认使用未匹配任何包含/排除模式的路径补丁；如果有则忽略。\n\
  \n`--ignore-space-change, --ignore-whitespace`\n\n应用补丁时，必要时忽略上下文行的空格更改。上下文行将保留其空格，无论\
  \ `--whitespace` 选项的值如何，都不会进行空格修复。不过，新行仍然会被修复。\n\n`--whitespace=<action>`\n\n应用补丁时，检测具有空格错误的新行或修改行。什么是空格错误由\
  \ `core.whitespace` 配置控制。默认情况下，尾随空格（包括仅由空格组成的行）以及初始缩进内紧随制表符的空格字符被认为是空格错误。\n\n默认，命令输出警告消息但应用补丁。当\
  \ git-apply 用于统计且不应用补丁时，它默认为 `nowarn`。\n\n你可以使用不同的 `<action>` 值来控制这种行为：\n\n`nowarn`\
  \ 关闭尾随空格警告。\n\n`warn` 对少数此类错误输出警告，但按原样应用补丁（默认值）。\n\n\n\n\n针对少数此类错误输出警告，并在修复它们后应用补丁（strip\
  \ 是一个同义词 --- 该工具仅将末尾空白字符视为错误，修复方法涉及 `stripping`（剥离）它们，但现代 Git 会执行更多操作）。\n\n针对少数此类错误输出错误信息，并拒绝应用补丁。\n\
  \n`error-all` 类似于 `error`，但会显示所有错误。\n\n`--inaccurate-eof`\n\n在某些情况下，某些版本的 `diff`\
  \ 无法正确检测文件末尾缺少换行符。因此，由此类 `diff` 程序创建补丁无法正确记录不完整的行。此选项通过绕过此 bug 提供了应用此类补丁的支持。\n\n\
  `-v, --verbose`\n\n向 `stderr` 报告进度。默认情况下，只会打印关于正在应用的当前补丁的消息。此选项将报告额外信息。\n\n`--recount`\n\
  \n不要信任 hunk 头部（块头部）中的行数，而是通过检查补丁来推断它们（例如在编辑补丁后未相应调整 hunk 头部的情况下）。\n\n`--directory=<root>`\n\
  \n在所有文件名前加上 `<root>`。如果也传递了 `-p` 参数，则会在加上新根目录之前应用它。\n\n例如，一个关于更新 `a/git-gui.sh`\
  \ 到 `b/git-gui.sh` 的补丁，可以通过运行 `git apply --directory=modules/git-gui` 应用到工作树中的文件\
  \ `modules/git-gui/git-gui.sh`。\n\n`--unsafe-paths`\n\n默认情况下，影响工作区之外（无论是 Git 控制的工作树，还是当使用\
  \ \"git apply\" 替换 GNU patch 的当前工作目录）的补丁会被视为错误（或恶意行为）。\n\n当将 `git apply` 用作“更好的\
  \ GNU patch”时，用户可以传递 `--unsafe-paths` 选项来覆盖此安全检查。当在使用 `--index` 或 `--cached` 时，此选项无效。\n\
  \n## 配置\n\n`apply.ignoreWhitespace`\n\n如果您希望默认忽略空白字符的变化，请将其设置为 `change`。如果您希望空白字符的变化具有重要性，请设置为\
  \ `no`、`none`、`never` 或 `false` 之一。\n\n`apply.whitespace`\n\n当命令行没有给出 `--whitespace`\
  \ 标志时，将使用此配置项作为默认。\n\n## 子模块\n\n如果补丁包含对子模块的任何更改，`git apply` 将如下方式处理这些更改。\n\n如果指定了\
  \ `--index`（显式或隐式），子模块提交必须与索引完全匹配才能应用补丁。如果任何子模块已检出（checked-out），则这些检出状态将被完全忽略，即它们不需要是最新的或整洁的，也不会被更新。\n\
  \n如果没有指定 `--index`，则补丁中的子模块提交将被忽略，仅检查相应的子目录是否存在并（在可能的情况下）进行更新。\n\n* * *\n\n# GIT-ARCHIVE\n\
  \n## 名称\n\n`git-archive` - 为命名的树创建文件归档\n\n## 语法\n\n`git archive` [--format=<fmt>]\
  \ [--list] [--prefix=<prefix>/] [<extra>] [-o <file> | --output=<file>] [--worktree-attributes]\
  \ [--remote=<repo> [--exec=<git-upload-archive>]] <tree-ish> [<path>...]`\n\n##\
  \ 描述\n\n创建一个指定格式的归档，其中包含命名树的树结构，并将其写入标准输出。如果指定了 `<prefix>`，它将加在归档中文件名的前面。\n\n`git\
  \ archive` 在给定树 ID 与给定提交 ID 或标签 ID 时的行为不同。在第一情况下，使用当前时间作为归档中每个文件的修改时间。在后一种情况下，使用在引用提交对象中记录的提交时间。此外，如果使用\
  \ tar 格式，提交 ID 将存储在全局扩展 pax 头部中；可以使用 `git get-tar-commit-id` 提取它。在 ZIP 文件中，它被存储为文件注释。\n\
  \n### 选项\n\n`--format=<fmt>`\n\n结果归档的格式：`tar` 或 `zip`。如果未给出此选项且指定了输出文件，则在可能的情况下从文件名推断格式（例如，写入\
  \ \"foo.zip\" 会使输出为 zip 格式）。否则，输出格式为 `tar`。\n\n`-l, --list`\n\n显示所有可用格式。\n\n`-v,\
  \ --verbose`\n\n向 `stderr` 报告进度。\n\n`--prefix=<prefix>/`\n\n在归档中的每个文件名前加上 `<prefix>/`。\n\
  \n`-o <file>, --output=<file>`\n\n将归档写入 `<file>` 而不是 `stdout`。\n\n`--worktree-attributes`\n\
  \n同时在工作树的 `.gitattributes` 文件中查找属性（参见“ATTRIBUTES”部分）。\n\n`<extra>`\n\n这可以是归档后端理解的任何选项。详见下一节。\n\
  \n`--remote=<repo>`\n\n不是从本地仓库创建 tar 归档，而是从远程仓库检索 tar 归档。注意远程仓库可能对 `<tree-ish>`\
  \ 中允许的 `sha1` 表达式进行限制。详见 (1)。\n\n`--exec=<git-upload-archive>`\n\n配合 `--remote`\
  \ 使用，指定远程侧 `git-upload-archive` 的路径。\n\n`<tree-ish>`\n\n产生归档的树或提交。\n\n`<path>`\n\
  \n如果没有路径参数，当前工作目录的所有文件和子目录都包含在归档中。如果指定了一个或多个路径，则仅包含这些路径。\n\n## 后端选项\n\n### zip\n\
  \n`-0`\n\n存储文件而不是压缩。\n\n`-9`\n\n最高且最慢的压缩级别。你可以指定 1 到 9 任何数字。\n\n## 配置\n\n`tar.umask`\n\
  \n此变量用于限制 tar 条目的权限。默认值为 `002`，这关闭了世界写权限。`user` 特值表示使用用户的 umask。详见 (2)。\n\n`tar.<format>.command`\n\
  \n此变量指定通过 git archive 生成的 tar 输出的 shell 命令。通过标准输入执行命令并产生标准输出。`tar.gz` 和 `tgz` 格式会自动定义。可以使用自定义命令覆盖它们。\n\
  \n`tar.<format>.remote`\n\n如果为 true，通过 (1) 为远程启用 `<format>`。对于用户定义的 `<format>` 默认为\
  \ false。\n\n## 属性\n\n`export-ignore`\n\n具有 `export-ignore` 属性的文件和目录不会被添加到归档。详见 (5)。\n\
  \n`export-subst`\n\n如果文件设置了 `export-subst` 属性，则 Git 在将此文件添加到归档时展开多个占位符。详见 (5)。\n\
  \n注意属性默认从树的 `.gitattributes` 文件获取。如果你想在之后调整生成方式（例如，在提交 `.gitattributes` 时没有添加相应的\
  \ export-ignore），请调整检出的 `.gitattributes` 文件并使用 `--worktree-attributes` 选项。或者，你可以在\
  \ `$GIT_DIR/info/attributes` 文件中保留归档时所需的属性。\n\n## 示例\n\n```\ngit archive --format=tar\
  \ --prefix=junk/ HEAD | (cd /var/tmp/ && tar xf -)\n```\n创建一个包含当前分支最新提交内容的 tar 归档，并将其解压到\
  \ /var/tmp/junk 目录。\n\n```\ngit archive --format=tar --prefix=git-1.4.0/ v1.4.0\
  \ | gzip >git-1.4.0.tar.gz\n```\n为 v1.4.0 创建压缩 tar 包。\n\n```\ngit archive --format=tar.gz\
  \ --prefix=git-1.4.0/ v1.4.0 >git-1.4.0.tar.gz\n```\n与上述相同，但使用内置的 tar.gz 处理。\n\n\
  ```\ngit archive --prefix=git-1.4.0/ -o git-1.4.0.tar.gz v1.4.0\n```\n与上述相同，但格式从输出文件推断。\n\
  \n```\ngit archive --format=tar --prefix=git-1.4.0/ v1.4.0^{tree} | gzip >git-1.4.0.tar.gz\n\
  ```\n\n\n\n\n\n为 v1.4.0 发布创建一个压缩的 tar 包，但不包含全局扩展 pax 头部。\n\n```bash\ngit archive\
  \ --format=zip --prefix=git-docs/ HEAD:Documentation/ > git-1.4.0-docs.zip\n```\n\
  \n将当前 HEAD `Documentation/` 目录下的所有内容放入 `git-1.4.0-docs.zip` 中，并使用前缀 `git-docs/`。\n\
  \n```bash\ngit archive -o latest.zip HEAD\n```\n\n创建一个包含当前分支最新提交内容的 Zip 归档。注意，输出格式由输出文件的扩展名推断。\n\
  \n```bash\ngit config tar.tar.xz.command \"xz -c\"\n```\n\n配置 `tar.xz` 格式以创建经过 LZMA\
  \ 压缩的 tar 文件。你可以通过指定 `--format=tar.xz` 或通过创建输出文件如 `-o foo.tar.xz` 来使用它。\n\n***\n\
  \n# GIT-BISECT\n\n## 名称\n\n`git-bisect` - 通过二分查找引入 bug 的更改\n\n## 语法\n\n`git bisect`\
  \ `<subcommand> <options>`\n\n## 描述\n\n该命令接受不同的子命令，根据子命令有不同的选项：\n\n```bash\ngit\
  \ bisect help git bisect start [--no-checkout] [<bad> [<good>...]] [--] [<paths>...]\
  \ git bisect bad [<rev>] git bisect good [<rev>...] git bisect skip [(<rev>|<range>)...]\
  \ git bisect reset [<commit>] git bisect visualize git bisect replay <logfile> git\
  \ bisect log git bisect run <cmd>...\n```\n\n该命令使用 `git rev-list --bisect` 来帮助驱动二分查找过程，在给定旧的“good”提交对象名称和较后的“bad”提交对象名称的情况下，找到哪个更改引入了\
  \ bug。\n\n### 获取帮助\n\n使用 `git bisect` 获取简短的用法说明，使用 `git bisect help` 或 `git bisect\
  \ -h` 获取详细的用法说明。\n\n### 基础二分命令：start, bad, good\n\n以 Linux 内核树为例，bisect 命令的基本用法如下：\n\
  \n```bash\n$ git bisect start\n$ git bisect bad # 当前版本是坏的\n$ git bisect good v2.6.13-rc2\
  \ # v2.6.13-rc2 是最后一个测试过的良好版本\n```\n\n当你指定了至少一个 bad 和一个 good 版本时，命令会对修订版本树进行二分，并输出类似下面的内容：\n\
  \n```\nBisecting: 675 revisions left to test after this\n```\n\n然后会检出修订集中间的状态。你现在可以编译该内核并启动。如果启动的内核运行正常，你只需执行以下命令：\n\
  \n```bash\n$ git bisect good # 这个是好的\n```\n\n该命令的输出类似于下面的内容：\n\n```\nBisecting:\
  \ 337 revisions left to test after this\n```\n\n你不断重复这个过程：编译树、测试它，并根据是好是坏发布 `git\
  \ bisect good` 或 `git bisect bad` 命令以请求下一次二分。\n\n最终将不再有更多可二分的修订版本，你将在 `refs/bisect/bad`\
  \ 中留下第一个坏的内核修订版本。\n\n### Bisect reset (重置)\n\n在二分会结束后，为了清理二分状态并返回原始的 `HEAD`（即退出二分），请执行以下命令：\n\
  \n```bash\n$ git bisect reset\n```\n\n默认情况下，这会将你的树恢复到 `git bisect start` 之前检出的提交。（一个新的\
  \ `git bisect start` 也会这样做，因为它会清理旧的二分状态。）\n\n可以通过可选参数返回不同的提交：\n\n```bash\n$ git\
  \ bisect reset <commit>\n```\n\n例如，`git bisect reset HEAD` 将让你留在当前的二分提交上且完全不切换，而\
  \ `git bisect reset bisect/bad` 将检出第一个坏的修订版本。\n\n### Bisect visualize (可视化)\n\n\
  要在 `gitk` 中查看当前剩余的怀疑对象，请在二分过程中执行以下命令：\n\n```bash\n$ git bisect visualize\n```\n\n\
  `view` 也可以作为 `visualize` 的同义词。\n\n如果没有设置 `DISPLAY` 环境变量，则将使用 `git log`。你也可以提供 `-p`\
  \ 和 `--stat` 等命令行选项。\n\n```bash\n$ git bisect view --stat\n```\n\n### Bisect log\
  \ 和 bisect replay (日志与重放)\n\n在标记修订版本为 good 或 bad 后，执行以下命令显示到目前为止的操作：\n\n```bash\n\
  $git bisect log\n```\n\n如果你发现指定修订版本状态时犯了错误，可以将此命令的输出保存到文件中，编辑它移除错误的条目，然后执行以下命令返回更正的状态：\n\
  \n```bash\n$ git bisect reset\n$git bisect replay that-file\n```\n\n### Avoiding\
  \ testing a commit (避免测试某个提交)\n\n如果在二分会话期间，你知道下一个建议的修订版本不是一个好的测试版本（例如，已知该提交引入的更改在你的环境中不起作用，且你知道它与你正在追踪的\
  \ bug 无关），你可能想要寻找一个附近的提交并尝试测试那个。\n\n例如：\n\n```bash\n$ git bisect good/bad # 上一轮是好是坏。正在二分：337\
  \ revisions left to test after this\n$ git bisect visualize # 哎，那个没意思。\n$ git reset\
  \ --hard HEAD~3 # 3 revisions before what suggested\n```\n\n然后编译并测试选定的版本，之后将该版本标记为\
  \ good 或 bad。\n\n### Bisect skip (跳过)\n\n与其自己选择一个附近的提交，不如通过执行命令让 Git 来完成：\n\n```bash\n\
  $ git bisect skip # 当前版本无法测试\n```\n\n但如果你也想跳过一个提交范围而不仅仅是一个，使用 `<commit1>..<commit2>`\
  \ 符号。例如：\n\n```bash\n$ git bisect skip v2.5..v2.6\n```\n\n这告诉二分过程 v2.5 到 v2.6 之间的提交应该被跳过。\n\
  \n### Cutting down bisection (缩小二分范围)\n\n如果你知道树的哪个部分涉及正在追踪的问题，可以在执行 `bisect start`\
  \ 时指定路径参数来进一步减少尝试次数：\n\n```bash\n$ git bisect start arch/i86 include/asm-i8\n```\n\
  \n如果你提前知道多个 good 提交，可以在 bad 提交之后指定所有的 good 提交来缩小二分空间：\n\n```bash\n$ git bisect start\
  \ v2.6.0-rc6 v2.6.0-rc4 v2.6.0-rc1 -- v2.6.0-rc6 is bad # rc-4 and rc1 are good\n\
  ```\n\n### Bisect run (运行)\n\n如果你有一个可以判断当前源码是好是坏的脚本，可以通过执行以下命令进行二分：\n\n```bash\n\
  $ git bisect run my_script arguments\n```\n\n注意，如果当前源码是好的，脚本应以代码 0 退出；如果当前源码是坏的，应以\
  \ 1 到 127（包含）之间的代码退出，125 除外。\n\n任何其他退出码将中止二分过程。应该注意到，通过 `exit(-1)` 终止的程序会留下 `$?\
  \ = 255`（参见 (3) 手页），因为该值被与 `0377` 取。。特殊的退出码 125 用于当前源码无法测试的情况。如果脚本以此代码退出，当前修订版本将被跳过（参见上文的\
  \ bisect skip）。选择 125 作为此目的的最高合理值，是因为 126 和 127 被 POSIX Shell 用于表示特定的错误状态（127 表示未找到命令，126\
  \ 表示找到命令但不可执行---对于“bisect run”而言，这些细节是脚本中的正常错误）。\n\n你经常可能会发现在二分会话期间，希望对被测试的版本应用临时修改（例如，在头文件中将\
  \ `#define DEBUG 0` 修改为 `#define DEBUG 1`，或者“没有该提交的版本需要应用此补丁来绕过另一个二分不感兴趣的问题”）。\n\
  \n\n\n\n为了应对这种情况，在内部 `git bisect` 找到下一个要测试的版本后，脚本可以在编译前应用补丁，运行真实测试，然后判断该版本（可能包含所需的补丁）是否通过测试，最后将工作树回溯到原始状态。最后，脚本应以真实测试的状态退出，让\
  \ \"git bisect run\" 命令通过循环来确定二分会话的最终结果。\n\n### 选项\n\n--no-checkout\n\n在二分过程的每次迭代中，不要检出新的工作树。相反，仅需更新一个名为\
  \ `BISECT_HEAD` 的特殊引用，使其指向应该测试的提交。\n\n当你要在每一步中执行的测试不需要检出的工作树时，此选项可能很有用。\n\n如果仓库是裸仓库（bare），则假设使用了\
  \ `--no-checkout`。\n\n## 示例\n\n在 v1.2 和 HEAD 之间对损坏的构建进行自动二分：\n\n```\n$ git bisect\
  \ start HEAD v1.2 -- # HEAD 是错误的，v1.2 是正确的 $ git bisect run make # \"make\" 构建应用程序\
  \ $ git bisect reset # 退出二分会话\n```\n\n在 origin 和 HEAD 之间对测试失败进行自动二分：\n\n```\n$ git\
  \ bisect start HEAD origin -- # HEAD 是错误的，origin 是正确的 $ git bisect run make test\
  \ # \"make test\" 构建并测试 $ git bisect reset # 退出二分会话\n```\n\n对损坏的测试用例进行自动二分：\n\n\
  ```\n$ cat ~/test.sh #!/bin/sh make || exit 125 # 这跳过损坏的构建 ~/check_test_case.sh\
  \ # 测试用例通过了吗？ $ git bisect start HEAD HEAD~10 -- # 罪祸首在最后 10 个提交中 $ git bisect run\
  \ ~/test.sh $ git bisect reset # 退出二分会话\n```\n\n在这里我们使用了自定义脚本 \"test.sh\"。在脚本中，如果\
  \ \"make\" 失败，我们将跳过当前提交。如果测试用例通过，“check_test_case.sh\" 应该 `exit 0`，否则 `exit 1`。\n\
  \n如果 \"test.sh\" 和 \"check_test_case.sh\" 都在仓库之外，会更安全，以防止二分、`make`、测试进程与脚本之间的相互作用。\n\
  \n使用临时修改（热修复）进行自动二分：\n\n```\n$ cat ~/test.sh #!/bin/sh # 通过合并热修复分支来调整工作树 # 然后尝试进行构建，如果\
  \ git merge --no-commit hot-fix && make then # 运行项目特定的测试并报告其状态 ~/check_test_case.sh\
  \ status=$? else # 告诉调用者此状态不可测试 status=125 fi # 撤销修改以允许干净地切换到下一个提交 git reset --hard\
  \ # 返回控制权 exit $status\n```\n\n这在每次测试运行之前应用来自热修复分支的修改，例如，如果你的构建或测试环境发生了变化，旧版本可能需要修复，而新版本已经修复了。（确保热修复分支基于你正在二分的所有版本中所包含的提交，这样合并时就不会引入过多的内容，或者使用\
  \ `git cherry-pick` 代替 `git merge`。）\n\n对损坏的测试用例进行自动二分：\n\n```\n$ git bisect start\
  \ HEAD HEAD~10 -- # 罪祸首在最后 10 个提交中 $ git bisect run sh -c \"make || exit 125; ~/check_test_case.sh\"\
  \ $ git bisect reset # 退出二分会话\n```\n\n这表明如果你在单行中编写测试，可以不需要运行脚本。\n\n在损坏的仓库中定位对象图中良好的区域：\n\
  \n```\n$ git bisect start HEAD <known-good-commit> [ <boundary-commit> ... ] --no-checkout\
  \ $ git bisect run sh -c ' GOOD=$(git for-each-ref \"--format=%(objectname)\" refs/bisect/good-*)\
  \ && git rev-list --objects BISECT_HEAD --not $GOOD >tmp.$$ && git pack-objects\
  \ --stdout >/dev/null <tmp.$$ rc=$? rm -f tmp.$$ test $rc = 0' $ git bisect reset\
  \ # 退出二分会话\n```\n\n在这种情况下，当 `git bisect run` 完成时，bisect/bad 将指向一个至少有一个父提交的提交，该提交的可达图在\
  \ `git pack objects` 所要求的范围内是完全可遍历的。\n\n## 参见\n\n使用 git bisect 对抗回归 m[][1], (1)。\n\
  \n## 注意事项\n\n1.\n\n使用 git bisect 对抗回归\n\n***\n\n# GIT-BRANCH\n\n## 名称\n\ngit-branch\
  \ - 列出、创建或删除分支\n\n## 语法\n\n`git branch` [--color[=<when>] | --no-color] [-r | -a]\
  \ [--list] [-v [--abbrev=<length> | --no-abbrev]] [--column[=<options>] | --no-column]\
  \ [(--merged | --no-merged | --contains) [<commit>]] [<pattern>...] `git branch`\
  \ [--set-upstream | --track | --no-track] [-l] [-f] <branchname> [<start-point>]`\
  \ `git branch` (--set-upstream-to=<upstream> | -u <upstream>) [<branchname>]` `git\
  \ branch` `--unset-upstream [<branchname>]` `git branch` (-m | -M) [<oldbranch>]\
  \ <newbranch>` `git branch` (-d | -D) [-r] <branchname>...` `git branch` `--edit-description\
  \ [<branchname>]`\n\n## 描述\n\n如果给了 `--list`，或者如果没有参数，则列出现有分支；当前分支将用星号标记。使用 `-r`\
  \ 显示远程跟踪分支。如果给了 `<pattern>`，它将作为通配符限制输出的分支。\n\n命令的第二种形式创建一个名为 `<branchname>` 的新分支，它指向\
  \ `HEAD`，或者指向 `<start-point>`。注意这将创建新分支，但不会切换工作树；使用 `git checkout <newbranch>` 来切换到新分支。\n\
  \n当从跟踪分支启动本地分支时，Git 会设置分支（特别是 `branch.<name>.remote` 和 `branch.<name>.merge` 配置），以便\
  \ `git pull` 能够相应合并跟踪分支。此行为可以通过全局配置 `branch.autoSetupMerge` 修改。使用 `--track` 和 `--no-track`\
  \ 选项可以覆盖该设置，并在之后通过 `git branch --set-upstream` 修改。\n\n带有 `-m` 或 `-M` 选项，将重命名 `<oldbranch>`>`。如果\
  \ `<oldbranch>` 有对应的 reflog，将被重命名以匹配 `<newbranch>`，并创建一个 reflog 条目记录分支重命名。如果 `<newbranch>`\
  \ 已存在，必须使用 `-M` 来强制重命名。\n\n带有 `-d` 或 `-D` 选项，将删除 `<branchname>`。你可以指定多个分支进行删除。如果该分支当前有\
  \ reflog，则 reflog 也将被删除。\n\n将 `-r` 与 `-d` 配合使用以删除远程跟踪分支。注意，只有当它们在远程仓库不存在或 `git fetch`\
  \ 配置为不再获取它们时，删除远程跟踪分支才有意义。参见 (1) 中的 `prune` 子命令以清理所有过时的远程跟踪分支。\n\n### 选项\n\n-d,\
  \ --delete\n\n删除分支。分支必须在其上游分支中完全合并，或者如果没有通过 `--track` 设置上游，则必须在 `HEAD` 中合并。\n\n\
  -D\n\n`--delete --force` 的快捷方式。\n\n-l, --create-reflog\n\n创建分支的 reflog。这将激活对分支 ref\
  \ 的所有更改记录，允许使用基于日期的 sha1 表达式如 `<branchname>@{yesterday}`。注意在非裸仓库中，reflog 通常通过 coreconfig\
  \ 配置选项默认启用。\n\n\n\n\n# 概述\n如果 `<branchname>` 存在，则将其重置为 `<startpoint>`。如果不使用 `-f`，`git\
  \ branch` 将拒绝更改现有分支。与 `-d`（或 `--delete`）结合使用，无论分支是否合并都允许删除。与 `-m`（或 `--move`）结合使用，即使新分支名称已存在也可以重命名分支。\n\
  \n- `-m, --move`\n移动/重命名分支以及对应的 reflog。\n\n- `-M`\n`--move --force` 的快捷方式。\n\n-\
  \ `--color[=<when>]`\n为分支着色以突出当前分支、本地和远程跟踪分支。值必须为 always（默认）、never 或 auto。\n\n-\
  \ `--no-color`\n关闭分支颜色，即使配置文件默认开启了颜色输出。等同于 `--color=never`。\n\n- `--column[=<options>],\
  \ --no-column`\n以列的形式显示分支列表。选项语法参见配置变量 `column.branch`。不带选项的 `--column` 和 `--no-column`\
  \ 分别等于 `always` 和 `never`。\n此选项仅适用于非详细模式。\n\n- `-r, --remotes`\n列出或删除（如果与 `-d` 使用）远程跟踪分支。\n\
  \n- `-a, --all`\n列出远程跟踪分支和本地分支。\n\n- `--list`\n激活列表模式。`git branch <pattern>` 会尝试创建一个分支，使用\
  \ `git branch --list <pattern>` 来列出匹配的分支。\n\n- `-v, -vv, --verbose`\n在列表模式下，显示每个头节点的\
  \ sha1 和提交主题行，以及与上游分支的关系（如果有）。如果给出两次，则也打印上游分支名称（参见 `git remote show <remote>`）。\n\
  \n- `-q, --quiet`\n在创建或删除分支时保持更静默，抑制非错误消息。\n\n- `--abbrev=<length>`\n更改输出列表中 sha1\
  \ 的最小显示长度。默认值为 7，可以通过 `core.abbrev` 配置选项覆盖。\n\n- `--no-abbrev`（注：原文为 --no-abbrev）\n\
  在输出列表中显示完整的 sha1，而不是进行缩写。\n\n- `-t, --track`\n在创建新分支时，设置 `branch.<name>.remote`\
  \ 和 `branch.<name>.merge` 配置项，将起始分支标记为新分支的“上游”。此配置将告诉 git 在 `git status` 和 `git\
  \ branch -v` 中显示这两个分支之间的关系。此外，它还指导在检出新分支时，带参数的 `git pull` 从上游拉取。\n\n当起始点是远程跟踪分支时，这是默认行为。如果你希望\
  \ `git checkout` 和 `git branch` 的行为始终像给了 `--no-track` 一样，请将 `branch.autoSetupMerge`\
  \ 配置变量设置为 false。如果你希望当起始点是本地或远程跟踪分支时具有此行为，请将其设置为 always。\n\n- `--no-track`\n不设置“上游”配置，即使\
  \ `branch.autoSetupMerge` 配置变量为 true。\n\n- `--set-upstream`\n如果指定的分支不存在或已给出 `--force`，则行为与\
  \ `--track` 完全相同。否则，在创建分支时会设置类似于 `--track` 样的配置，但不会更改分支所指向的地方。\n\n- `-u <upstream>,\
  \ --set-upstream-to=<upstream>`\n设置 `<branchname>` 的跟踪信息，使 `<upstream>` 视为 `<branchname>`\
  \ 的上游分支。如果没有指定 `<branchname>`，则默认为当前分支。\n\n- `--unset-upstream`\n移除 `<branchname>`\
  \ 的上游信息。如果没有指定分支，则默认为当前分支。\n\n- `--edit-description`\n打开编辑器并编辑说明分支用途的文本，供其他其他命令（例如\
  \ `request-pull`）。\n\n- `--contains [<commit>]`\n仅列出包含指定提交的分支（未指定则为 HEAD）。隐含 `--list`。\n\
  \n- `--merged [<commit>]`\n仅列出 tip 从指定提交可达的分支（未指定则为 HEAD）。隐含 `--list`。\n\n- `--no-merged\
  \ [<commit>]`\n仅列出 tip 从指定提交不可达的分支（未指定则为 HEAD）。隐含 `--list`。\n\n- `<branchname>`\n\
  要创建或删除的分支名称。新分支名称必须通过由 (1) 定义的所有检查。其中某些检查可能会限制分支名称中允许的字符。\n\n- `<start-point>`\n\
  新分支的头将指向此提交。它可以作为分支名称、提交 ID 或标签给出。如果省略此选项，将使用当前的 HEAD。\n\n- `<oldbranch>`\n要重命的现有分支名称。\n\
  \n- `<newbranch>`\n现有分支的新名称。适用与 `<branchname>` 相同的限制。\n\n## 示例\n\n### 从已知标签开始开发\n\
  ```\n$ git clone my2.6 $ cd my2.6 $ git branch my2.6.14 v2.6.14\n$ git checkout\
  \ my2.6.14\n```\n1. 这一步和下一步可以通过 \"checkout -b my2.6.14 v2.6.14\" 合并为单个步骤。\n\n###\
  \ 删除不需要的分支\n```\n$ git clone my.git $ cd my.git $ git branch -d -r origin/todo origin/html\
  \ origin/man\n$ git branch -D test\n```\n1. 删除远程跟踪分支 \"todo\"、html\" 和 \"man\"。下次\
  \ fetch 或 pull 将再次创建它们，除非你配置了不创建。\n2. 删除 \"test\" 分支，即使 \"master\" 分支（或当前检出的分支）。\n\
  \n## 注意事项\n如果你正在创建一个想要立即检出的分支，使用 checkout 命令并配合其 -b 选项创建分支会更简单。\n\n`--contains`、`--merged`\
  \ 和 `--no-merged` 选项具有相关但不同的用途：\n- `--contains <commit>` 用于找到所有如果 `<commit>` 被变基或修改时将需要特别处理的分支。\n\
  - `--merged` 用于找到所有可以安全删除的分支，因为这些分支被 HEAD 完全包含。\n- `--no-merged` 用于找到可以合并到 HEAD\
  \ 的候选分支，因为这些分支没有被 HEAD 完全包含。\n\n\n\n\n将包中的对象传递给 `git index-pack` 以存储在仓库中，然后打印所有定义引用的名称。如果给出了引用列表，则只打印与列表中匹配的引用。此命令是一个底层的管道命令（plumbing），旨在仅供\
  \ `git fetch` 调用。\n\n<git-rev-list-args>\n\n一组 `git rev-parse` 和 `git rev-list`\
  \ 可接受的参数列表（包含一个具名的引用，参见下文“指定引用”部分），用于指定要传输的特定对象和引用。例如，`master~10..master` 会导致当前的\
  \ master 引用连同其第 10 代祖先提交以来添加的所有对象一起打包。可以打包的引用和对象数量没有显式限制。\n\n[<refname>...]\n\n\
  一个引用列表，用于限制报告为可用的引用。这主要对 `git fetch` 有用，它期望只接收请求的引用，而不一定非是 pack 包中的所有内容（在这种情况下，`git\
  \ bundle` 的作用类似于 `git fetch-pack`）。\n\n## 指定引用\n\n`git bundle` 只打包由 `git show-ref`\
  \ 显示的引用：这包括头部（heads）、标签（tags）和远程头部（remote heads）。如 `master~1` 等引用无法被打包，但非常适合定义基准（basis）。可以打包多个引用，也可以指定多个基准。打包的对象是不包含在给定基准集中的对象。每个基准可以显式指定（例如\
  \ `^master~10`），也可以隐式指定（例如 `master~10..master`、`--since=10.days.ago master`）。\n\n\
  所使用的基准由目标端持有，这一点非常重要。采取保守态度，导致 bundle 文件包含目标端已有的对象是可以的，因为这些对象在目标端解包时会被忽略。\n\n##\
  \ 示例\n\n假设你想将历史从机器 A 上的仓库 R1 传输到机器 B 上的另一个仓库 R2。由于某种原因，A 和 B 之间不允许直接连接，但我们可以通过某种机制（光盘、电子邮件等）将数据从\
  \ A 移动到 B。我们希望根据 R1 中 master 分支的开发内容来更新 R2。\n\n为了启动该过程，你可以先创建一个没有任何基准的包。你可以使用标签来记录上次处理到哪个提交，以便以后用增量包更新另一个仓库：\n\
  \n```bash\nmachineA$ cd R1 machineA$ git bundle create file.bundle master machineA$\
  \ git tag -f lastR2bundle master\n```\n\n然后你将 `file.bundle` 传输到目标机器 B。因为这个包不需要提取任何现有的对象，你可以通过克隆它在机器\
  \ B 上创建一个新仓库：\n\n```bash\nmachineB$ git clone -b master /home/me/tmp/file.bundle\
  \ R2\n```\n\n这将在生成的仓库中定义一个名为 \"origin\" 的远程，允许你从包中 fetch 和 pull。R2 中的 `$GIT_DIR/config`\
  \ 文件将会有如下条目：\n\n```bash\n[remote \"origin\"] url = /home/me/tmp/file.bundle fetch\
  \ = refs/heads/*:refs/remotes/origin/*\n```\n\n要更新生成的 mine.git 仓库，可以在将存储 `/home/me/tmp/file.bundle`\
  \ 的包替换为增量更新后，执行 fetch 或 pull。\n\n在原始仓库中继续工作一段时间后，你可以创建一个增量包来更新另一个仓库：\n\n```bash\n\
  machineA$ cd R1 machineA$ git bundle create file.bundle lastR2bundle..master machineA$\
  \ git tag -f lastR2bundle master\n```\n\n然后你将包传输到另一台机器并替换 `/home/me/tmp/file.bundle`，然后进行\
  \ pull。\n\n```bash\nmachineB$ cd R2 machineB$ git pull\n```\n\n如果你知道预期接收仓库应该拥有哪些提交所需的对象，你可以利用这一知识来指定基准，提供一个截止点来限制进入生成包的修订和对象。上一个示例使用了\
  \ `lastR2bundle` 标签来实现此目的，但可以使用任何其他提供给 (1) 命令的选项。这里是更多示例：\n\n你可以使用在两者中都存在的标签：\n\n\
  ```bash\n$ git bundle create mybundle v1.0.0..master\n```\n\n你可以使用基于时间的基准：\n\n```bash\n\
  $ git bundle create mybundle --since=10.days master\n```\n\n你可以使用提交数：\n\n```bash\n\
  $ git bundle create mybundle -10 master\n```\n\n你可以运行 `git-bundle verify` 来检查是否可以从带有基准创建的包中提取内容：\n\
  \n```bash\n$ git bundle verify mybundle\n```\n\n这将列出你为了从包中提取而必须拥有的提交，如果没有这些提交则会报错。\n\
  \n从接收仓库的角度来看，一个包就像一个它对其进行 fetch 或 pull 的普通仓库。例如，你可以在 fetch 时映射引用：\n\n```bash\n$git\
  \ fetch mybundle master:localRef\n```\n\n你还可以查看它提供了哪些引用：\n\n```bash\n$ git ls-remote\
  \ mybundle\n```\n\n***\n\n# GIT-CAT-FILE\n\n## 名称\n\n`git-cat-file` - 为仓库对象提供内容或类型及大小信息\n\
  \n## 概要\n\n`git cat-file` (-t [--allow-unknown-type]| -s [--allow-unknown-type]|\
  \ -e | -p | <type> | --textconv ) <object>`\n`git cat-file` (--batch | --batch-check)\
  \ [--follow-symlinks] <list-of-objects>`\n\n## 描述\n\n在第一种形式下，命令提供仓库对象的内容或类型（除非使用了\
  \ `-t` 或 `-p` 或 `--textconv`）。在第二种形式下，从标准输入提供由换行符分隔的对象列表，并打印每个对象的 SHA-1、类型和大小。\n\
  \n## 参数\n\n<object>` 要显示的对象名称。有关更完整的对象命名列表，请参见“指定引用”章节。\n\n-t 不显示内容，显示由 `<object>`\
  \ 指定的对象类型。\n\n-s 不显示内容，显示由 `<object>` 指定的大小。\n\n-e 抑制所有输出；如果 `<object>` 存在且有效对象则以零状态退出。\n\
  \n-p 格式打印 `<object>` 内容。\n\n`<type>` 通常匹配 `<object>` 的真实类型，但也可以请求可以从给定 `<object>`\
  \ 解析的类型。例如，请求一个包含它的提交对象的“tree”，或者请求一个指向它的标签对象的“blob”。\n\n`--textconv` 通过 textconv\
  \ 过滤器转换显示内容。在这种情况下，`<object>` 格式为 `<tree-ish>:<path>` 或 `:<path>`，以便对索引中的 `<path>`\
  \ 内容应用过滤器。\n\n`--batch`, `--batch=<format>` 为标准输入提供的每个对象打印信息和内容。不能与其他任何选项或参数结合。详见下文“批量输出”。\n\
  \n`--batch-check`, `--batch-check=<format>` 为标准输入提供的每个对象打印信息。不能与其他任何选项或参数结合。详见下文“批量输出”。\n\
  \n`--allow-unknown-type` 允许 `-s` 或 `-t` 查询类型未知/损坏的对象。\n\n`--follow-symlinks` 在使用\
  \ `--batch` 或 `--batch-check` 时，当请求格式为 `tree-ish:path-in-tree` 的扩展 SHA-1 表达式时遵循仓库内部链接。与其提供链接本身的输出，不如提供链接对象的输出。如果链接指向树外部（例如指向\
  \ `/foo` 或根目录下的 `../foo`），链接中树外部的部分将被打印。\n\n该选项目前在指定索引中的对象（例如 `:link` 而不是 `HEAD:link`）而非树中的对象时无法正常工作。\n\
  \n该选项目前无法在未使用 `--batch` 或 `--batch-check` 时使用。\n\n例如，考虑一个包含内容的 git 仓库：\n\n`f: 一个包含\
  \ \"hello\\n\" 的文件 link: 指向 f 的符号链接 dir/link: 指向 ../f 的符号链接 plink: 指向 ../f 的符号链接\
  \ alink: 指向 /etc/passwd 的符号链接`\n\n对于普通文件 f，`echo HEAD:f | git cat-file --batch`\
  \ 将打印\n\n\n\n\n\n`ce013625030ba8dba906f756967f9e9ca394464a blob 6`\n\n执行 `echo HEAD:link\
  \ | git cat-file --batch --follow-symlinks` 会打印出相同的内容，`HEAD:dir/link` 也是如此，因为它们都指向\
  \ `HEAD:f`。\n\n如果不使用 `--follow-symlinks`，这些命令将打印关于符号链接本身的数据。在 `HEAD:link` 的情况下，你会看到：\n\
  \n`4d1ae35ba2c8ec712fa2a379db44ad639ca277bd blob 1`\n\n`plink` 和 `alink` 都指向树之外，因此它们会分别打印：\n\
  \n`symlink 4 ../f`\n\n`symlink 11 /etc/passwd`\n\n## 输出\n\n如果指定了 `-t`，则输出 `<type>`\
  \ 之一。\n\n如果指定了 `-s`，则输出 `<object>` 的大小（字节）。\n\n如果指定了 `-e`，则无输出。\n\n如果指定了 `-p`，则对\
  \ `<object>` 的内容进行格式化打印。\n\n如果指定了 `<type>`，则返回 `<object>` 的原始（尽管未压缩）内容。\n\n## 批量输出\n\
  \n如果给出了 `--batch` 或 `--batch-check`，`cat-file` 将从 `stdin` 读取对象（每行一个），并打印它们的相关信息。默认情况下，整行被视为一个对象，就像输入到\
  \ `(1)` 一样。\n\n你可以通过自定义的 `<format>` 来指定每个对象显示的信息。`<format>` 会原样复制到 `stdout`，其中形式如\
  \ `%(atom)` 的占位符会被展开，随后是一个换行符。可用的原子项有：\n\n`objectname`\n对象的 40 位十六进制名称。\n\n`objecttype`\n\
  对象的类型（与 `cat-file -t` 报告相同）。\n\n`objectsize`\n对象的大小（字节）（与 `cat-file -s` 报告相同）。\n\
  \n`objectsize:disk`\n对象在磁盘上占用的空间（字节）。请参见下文 CAVEATS 部分中关于磁盘大小的说明。\n\n`deltabase`\n\
  如果对象在磁盘上以增量（delta）形式存储，则此展开为增量基础对象的 40 位十六进制 sha1。否则，展开为空 sha1（40 个零）。请参见下文 CAVEATS。\n\
  \n`rest`\n如果在输出字符串中使用此原子项，输入行将在第一个空白边界处拆分。该空白之前的所有字符被视为对象名称；该连续空白之后的所有字符（即行的行的“剩余”部分）将替换\
  \ `%(rest)` 原子项输出。\n\n如果未指定格式，默认格式为 `%(objectname) %(objecttype) %(objectsize)`。\n\
  \n如果指定了 `--batch`，对象信息后将跟随对象内容（由 `%(objectsize)` 字节组成），随后是一个换行符。\n\n例如，不带自定义格式的\
  \ `--batch` 会产生：\n`<sha1> SP <type> SP <size> LF <contents> LF`\n\n而 `--batch-check='%(objectname)\
  \ %(objecttype)'` 会产生：\n`<sha1> SP <type> LF`\n\n如果在 `stdin` 上指定的名称无法解析为仓库中的对象，则\
  \ `cat-file` 将忽略任何自定义格式并打印：\n`<object> SP missing LF`\n\n如果使用了 `--follow-symlinks`，且仓库中的符号链接指向仓库外部，则\
  \ `cat-file` 将忽略任何自定义格式并打印：\n`symlink SP <size> LF <symlink> LF`\n\n符号链接将是绝对路径（以\
  \ `/` 开头），或者是相对于树根的。例如，如果 `dir/link` 指向 `../../foo`，那么 `<symlink>` 将是 `../foo`。`<size>`\
  \ 是符号链接的大小（字节）。\n\n如果使用了 `--follow-symlinks`，将显示以下错误信息：\n`<object> SP missing LF`\n\
  当请求的符号链接不存在时打印。\n\n`dangling SP <size> LF <object> LF`\n当初始符号链接存在，但其（或其链）指向的对象不存在时打印。\n\
  \n`loop SP <size> LF <object> LF`\n用于符号链接循环（或任何需要超过 40 次解析的符号链接）。\n\n`notdir SP\
  \ <size> LF <object> LF`\n在解析符号链接过程中，将文件用作目录名时打印。\n\n## 注意事项\n\n注意，磁盘上对象的大小报告是准确的，但在得出关于哪些引用（refs）或对象导致了磁盘占用的结论时应小心。打包后的非增量对象的大小可能比对其进行增量的对象大得多，但选择哪个对象作为基础、哪一个作为增量是任意的，并且在重打包（repack）期间可能会发生。\n\
  \n同样注意，对象数据库中可能存在对象的多个副本；在这种情况下，报告哪个副本的大小或增量基础是未定义的。\n\n***\n\n# GIT-CHECK-ATTR\n\
  \n## 名称\n\n`git-check-attr` - 显示 gitattributes 信息\n\n## 语法概要\n\n`git check-attr`\
  \ `[-a | --all | attr...] [--] pathname...`\n`git check-attr` `--stdin [-z] [-a\
  \ | --all | attr...] < <list-of-paths>`\n\n## 描述\n\n对于每个路径，此命令将列出该路径上的每个属性是 unspecified（未指定）、set（已设置）还是\
  \ unset（未设置）。\n\n### 选项\n\n- `-a, --all`: 列出所有属性。如果使用此选项，将不包含 *unspecified* 属性。\n\
  - `--cached`: 考虑索引，忽略工作树。\n- `--stdin`: 从标准输入读取文件名而非从命令行。\n- `-z`: 输出格式修改为机器可解析。如果给了\
  \ `--stdin`，输入路径用 NUL 字符分隔。\n- `--`: 将之前的所有参数视为属性，将之后的所有参数视为路径。\n\n## 输出\n\n输出格式为\
  \ `<path> SP <attribute> SP <info>`，除非生效 `-z`，此时使用 NUL 作为分隔符：`<path>` 是文件路径，`<attribute>`\
  \ 是查询的属性，`<info>` 可以：\n\n- `unspecified`: 属性对该路径未定义。\n- `unset`: 属性定义为 false。\n\
  - `set`: 属性定义为 true。\n- `<value>`：为该属性分配了值。\n\n## 示例\n\n在示例中，使用了以下 *.gitattributes*\
  \ 文件：\n`*.java diff=java`\n`!myAttr README caveat=unspecified`\n\n列出单个属性：\n`$ git\
  \ check-attr diff org/example/MyClass.java`\n`org/example/MyClass.java: diff: java`\n\
  \n为文件列出多个属性：\n`$ git check-attr crlf myAttr org/example/MyClass.java`\n`org/example/MyClass.java:\
  \ crlf: unset`\n`org/example/MyClass.java: diff: java`\n\n为文件列出所有属性：\n`$ git check-attr\
  \ --all -- org/example/MyClass.java`\n`org/example/MyClass.java: crlf: unset`\n\
  `org/example/MyClass.java: diff: java`\n`org/example/MyClass.java: myAttr: set`\n\
  \n为多个文件列出属性：\n`$ git check-attr myAttr -- org/example/MyClass.java org/example/NoMyAttr.java`\n\
  `org/example/MyClass.java: myAttr: set`\n`org/example/NoMyAttr.java: myAttr: unspecified`\n\
  \n并不是所有的值都同样明确：\n`$ git check-attr caveat README`\n`README: caveat: unspecified`\n\
  \n\n\n输出格式已修改为机器可解析（见下文）。如果同时提供了 `--stdin`，输入路径之间将用 NUL 字符而非换行符分隔。\n\n### `-n, --non-matching`\n\
  \n显示不匹配任何模式的给定路径。这仅在启用 `--verbose` 时才有意义，否则将无法区分匹配模式的路径和不匹配模式的路径。\n\n### `--no-index`\n\
  \n在执行检查时不查找索引。这可以用于调试为什么某个路径被例如通过 `git add .` 跟踪，并且没有按照用户预期的被规则忽略，或者在开发包含否定匹配的模式时，用于匹配之前已通过\
  \ `git add -f` 添加的路径。\n\n## 输出\n\n默认情况下，任何匹配忽略模式的给定路径都将被输出，每行一个。如果没有模式匹配给定的路径，则该路径将不会输出任何内容；这意味着该路径将不会被忽略。\n\
  \n如果指定了 `--verbose`，输出将是一系列格式如下的内容：\n\n`<source> <COLON> <linenum> <COLON> <pattern>\
  \ <HT> <pathname>`\n\n`<pathname>` 是被查询的文件路径，`<pattern>` 是匹配模式，`<source>` 是模式的源文件，`<linenum>`\
  \ 是模式在该源文件中的行号。如果模式包含 `!` 前缀或 `/` 后缀，它们将在输出中保留。当引用由 `core.excludesFile` 配置的文件时，`<source>`\
  \ 为绝对路径；当引用 `.git/info/exclude` 或按目录排除的文件时，为相对于仓库根目录的路径。\n\n如果指定了 `-z`，输出中的路径由空字符分隔；如果同时指定了\
  \ `--verbose`，则也使用空字符代替冒号和制表符（tab）：\n\n`<source> <NULL> <linenum> <NULL> <pattern>\
  \ <NULL> <pathname> <NULL>`\n\n如果指定了 `-n` 或 `--non-matching`，也将输出不匹配的路径，在这种情况下，每个输出记录中除\
  \ `<pathname>` 之外的所有字段都将为空。这在运行非交互式运行时非常有用，以便文件可以增量地流到长时间运行的 check-ignore 进程的 `STDDIN`\
  \ 中，并且对于这些每个文件，`STDOUT` 将指示该文件是否匹配了模式。（如果没有此选项，将无法判断给定文件的输出缺失意味着它没有匹配任何模式，还是输出尚未生成。）\n\
  \n缓冲处理如 (1) 中 `GIT_FLUSH` 选项下的文档说明所示。调用者负责避免因输入缓冲区溢出或从空输出缓冲区读取导致的死锁。\n\n## 退出状态\n\
  \n### 0\n提供的一个或多个路径被忽略。\n\n### 1\n所有提供的路径均未被忽略。\n\n### 128\n遇到了致命错误。\n\n# GIT-CHECK-MAILMAP\n\
  \n## 别名\n`git-check-mailmap` - 显示联系人的标准名称和邮箱地址\n\n## 概要\n\n`git check-mailmap` `[options]\
  \ <contact>...`\n\n## 描述\n\n对于命令行或标准输入（使用 `--stdin` 时）中的每个 \"Name <>\" 或 \"<>\"\
  ，查找该人的标准名称和邮箱地址（见下文“映射作者”）。如果找到，则打印它们；否则原样打印输入。\n\n### 选项\n\n`--stdin`\n在耗尽命令行提供的联系人后，从标准输入每行读取一个联系人。\n\
  \n## 输出\n\n对每个联系人输出单行并以换行符结束。如果提供了名称或该名称在 `mailmap` 中已知，则打印 \"Name <>\"；否则只打印 \"\
  <>\"。\n\n## 映射作者\n\n如果 `.mailmap` 文件存在于仓库顶层，或者存在 `mailmap.file` 或 `mailmap.blob`\
  \ 配置选项所指的位置，则使用它来将作者和提交者的名称及邮箱地址映射到标准的真实姓名和邮箱地址。\n\n在简单形式下，文件中的每行由作者的标准真实姓名、空白以及提交中使用的邮箱地址（用\
  \ `<` 和 `>` 包围）组成，用于映射。例如：\n\n`Proper Name <>`\n\n更复杂的形式有：\n\n`<> <>`\n这允许 mailmap\
  \ 仅替换提交的邮箱部分，以及：\n\n`Proper Name <> <>`\n这允许 mailmap 替换匹配指定提交邮箱地址的提交的名称和邮箱，以及：\n\
  \n`Proper Name <> Commit Name <>`\n这允许 mailmap 替换同时匹配指定提交名称和邮箱地址的提交的名称和邮箱。\n\n示例\
  \ 1：你的历史包含两个作者 Jane 和 Joe 的提交，他们的名字在仓库中以多种形式出现：\n\n`Joe Developer <> Joe R. Developer\
  \ <> Jane Doe <> Jane Doe <.(none)> Jane D. <.(none)>`\n\n现在假设 Joe 想使用他的中间名首字母，而\
  \ Jane 喜欢完整拼写她的姓。一个正确的 `.mailmap` 文件看起来如下：\n\n`Jane Doe <.(none)> Joe R. Developer\
  \ <>`\n\n注意，不需要为 `<.(none)>` 创建条目，因为该作者的真实姓名已经是正确的。\n\n示例 2：你的仓库包含来自以下作者的提交：\n\n\
  `nick1 <> nick2 <> nick2 <> santa <> claus <> CTO <>`\n\n你可能想要一个这样的 `.mailmap` 文件：\n\
  \n`<> <> Some Dude <> nick1 <> Other Author <> Santa Claus <> Other Author <> <>`\n\
  使用 `#` 作为其行尾或邮箱地址后的注释。\n\n# GIT-CHECK-REF-FORMAT\n\n## 别名\n`git-check-ref-format`\
  \ - 确保引用格式正确\n\n## 概要\n\n`git check-ref-format` `[--normalize] [--no-]allow-level]\
  \ [--refspec-pattern] <refname>`\n\n## 描述\n\n检查 `refname` 是否接受，如果不接受以非零状态退出。\n\n\
  引用在 Git 中用于分支和标签。分支存储在 `refs/heads`，而标签存储在 `refs/tags`。\n\nGit 对引用命名有以下规则：\n\n1.\
  \ 允许包含 `/` 用于分层分组，但任何斜杠分隔的部分不能以 `.` 开头或以 `.lock` 结尾。\n2. 必须包含至少一个 `/`。这强制要求类似 `heads/`\
  \ 的类别，但实际名称不受限制。如果使用了 `--allow-level` 选项，则忽略此规则。\n3. 不能有两个连续的点 `..`。\n4. 任何地方不能有\
  \ ASCII 控制字符（即值小于 040 或 177 DEL）、空格、波浪号 `~`、脱号 `^` 或冒号 `:`。\n5. 不能有 `?`、星号 `*` 或左括号\
  \ `[`。见下文 `--refspec-pattern` 选项。\n6. 不能以斜杠 `/` 开头或结尾，或包含多个斜杠（见下文 `--normalize`\
  \ 选项）。\n7. 不能以点 `..` 结尾。\n8. 不能包含序列 `@{`。\n9. 不能是单个字符 `@`。\n10. 不能包含 `\\`。\n\n这些规则使得基于\
  \ shell 的工具易于解析引用名称，避免了 shell 在错误未引用引用名称时进行路径扩展，同时也避免了引用表达式中的歧义：\n\n1. 双点 `..` 经常用于\
  \ `ref1..ref2`，在某些上下文中这种符号表示 `^ref1 ref2`。\n2. 波浪号 `~` 和脱号 `^` 用于引入后缀 *n 个父节点* 和\
  \ *剥壳*操作。\n3. 冒号 `:` 用于 `srcref:dstref`，表示在 fetch 和 push 操作中“使用 `srcref` 的值并将其存储在\
  \ `dstref`”。也可以用于选择特定对象，例如使用 `git cat-file` 时：`git cat-file blob v1.3.3:refs.c`。\n\
  4. 大大括号 `@{` 用作访问 reflog 条目的符号。\n\n\n\n\n使用 `--branch` 选项，它可以扩展“上一个分支语法”`@{-n}`。例如，`@{-1}`\
  \ 是引用之前所在分支的方法。瓷化程序（porcelains）应该在任何预期分支名称的地方使用此选项，以便它们可以像你输入了分支名称一样操作。\n\n### 选项\n\
  \n`--[no-]allow-onelevel`\n\n控制是否接受单级引用名（refnames）（即不包含多个由 `/-` 分隔组件的引用名）。默认为 `--no-allow-onelevel`。\n\
  \n`--refspec-pattern`\n\n将 `<refname>` 解释为引用规格（refspec）的引用名模式（常用于远程仓库）。如果启用此选项，`<refname>`\
  \ 允许包含单个 `*` 来替换一个完整的路径组件（例如 `foo/*/bar`，但不是 `foo/bar*`）。\n\n`--normalize`\n\n通过移除任何前头的斜杠（`/`）并将名称组件之间连续的斜杠合并为单个斜杠来归一化\
  \ `refname`。如果归一化后的 `refname` 有效，则将其打印到标准输出并以状态码 `0` 退出（`--print` 是 `--normalize`\
  \ 的过时写法）。\n\n## 示例\n\n打印上一个分支的名称：\n\n```\n$ git check-ref-format --branch @{-1}\n\
  ```\n\n确定用于新分支的引用名：\n\n```bash\n$ ref=$(git check-ref-format --normalize \"refs/heads/$newbranch\"\
  ) || die \"we do not like '$newbranch' as a branch name.\"\n```\n\n***\n\n# GIT-CHECKOUT-INDEX\n\
  \n## 名称\n\n`git-checkout-index` - 从索引（index）复制文件到工作树\n\n## 概要\n\n`git checkout-index\
  \ [-u] [-q] [-a] [-f] [-n] [--prefix=<string>] [--stage=<number>|all] [--temp] [-z]\
  \ [--stdin] [--] [<file>... ]`\n\n## 描述\n\n将索引列出的所有文件复制到工作目录（不覆盖现有文件）。\n\n### 选项\n\
  \n`-u, --index`\n\n更新索引文件中已检出条目的的统计信息。\n\n`-q, --quiet`\n\n如果文件存在或不在索引中，则保持安静。\n\
  \n`-f, --force`\n\n强制覆盖现有文件。\n\n`-a, --all`\n\n检出索引中的所有文件。不能与显式文件名一起使用。\n\n`-n,\
  \ --no-create`\n\n不检出新文件，只刷新已检出的文件。\n\n`--prefix=<string>`\n\n在创建文件时，在前面加上 `<string>`（通常是一个包含末尾\
  \ `/` 的目录）。\n\n`--stage=<number>|all`\n\n不再检出未合并的条目，而是从命名的阶段复制文件。`<number>` 必须在\
  \ 1 到 3 之间。注意：`--stage=all` 自动意味着 `--temp`。\n\n`--temp`\n\n不将文件复制到工作目录，而是将内容写入临时文件。临时文件名称关联将写入标准输出。\n\
  \n`--stdin`\n\n不再从命令行获取路径列表，而是从标准输入读取路径列表。默认情况下，路径由 LF 分隔（即每行一个路径）。\n\n`-z`\n\n\
  仅对 `--stdin` 有意义；路径用 NUL 字符而非 LF 分隔。\n\n`--`\n\n不再将任何后续参数解释为选项。\n\n所使用的标志顺序曾经很重要，但现在不再了。\n\
  \n仅仅执行 `git checkout-index` 什么都不会做。你可能想执行 `git checkout-index -a`。如果你想强制执行，你应该执行\
  \ `git checkout-index -f -a`。\n\n直观性不是这里的目标。可重复性才是。“无参数意味着无操作”行为的原因是，在脚本中，你应该能够执行以下操作：\n\
  \n```bash\n$ find . -name '*.h' -print0 | xargs -0 git checkout-index -f --\n```\n\
  \n这将强制将所有存在的 *.h` 文件替换为它们的缓存副本。如果空命令行意味着“全部”，那么这将强制刷新索引中的所有内容，而这并不是目的。但由于 `git checkout-index`\
  \ 接受 `--stdin`，使用以下命令会更快：\n\n```bash\n$ find . -name '*.h' -print0 | git checkout-index\
  \ -f -z --stdin\n```\n\n`--` 在你知道后面是文件名时是一个很好的主意；它可以防止因诸如 `-a` 这样的文件名引起的问题。在脚本中使用\
  \ `--` 可能是一个通用的策略。\n\n## 使用 --TEMP 或 --STAGE=ALL\n\n当使用 `--temp`（或由 `--stage=all`\
  \ 隐含）时，`git checkout-index` 将为每个检出的索引条目创建一个临时文件。索引不会更新统计信息。如果调用者需要所有未合并条目的的所有阶段，以便由外部合并工具处理未合并的文件，这些选项将有用。\n\
  \n标准输出将写入一个列表，提供临时文件名与跟踪路径名的关联。列表格式有两种变体：\n\n1. `tempname TAB path RS`\n\n当省略 `--stage`\
  \ 或其不是 `--stage=all` 时使用这种格式。`tempname` 字段是持有文件内容的临时文件名，`path` 是索引中的跟踪路径名。仅输出请求的条目。\n\
  \n2. `stage1temp SP stage2temp SP stage3tmp TAB path RS`\n\n当使用 `--stage=all` 时使用这种格式。三个阶段临时字段（`stage1temp`、`stage2temp`、`stage3temp`）在索引中存在阶段条目时列出临时文件名，如果没有则显示\
  \ `.`。只有阶段 0 的路径将始终从输出中排除。\n\n在两种格式中，`RS`（记录分隔符）默认为换行符，但如果使用了 `-z`，则为空字节。\n\n***\n\
  \n# GIT-CHECKOUT\n\n## 名称\n\n`git-checkout` - 切换分支或恢复工作树\n\n## 概要\n\n`git checkout\
  \ [-q] [-f] [-m] [<branch>]`\n`git checkout [-q] [-f] [-m] --detach [<branch>]`\n\
  `git checkout [-q] [-f] [-m] --detach <commit>`\n`git checkout [-q] [-f] [-m] [[-b|-B|--orphan]\
  \ <new_branch>] [<start_point>]`\n`git checkout [-f|--ours|--theirs|-m|--conflict=<style>]\
  \ [<tree-ish>] [--] <paths>...`\n`git checkout [-p|--patch] [<tree-ish>] [--] [<paths>]`\n\
  \n## 描述\n\n更新工作树中的文件以匹配索引或指定树的版本。如果没有路径，*git checkout* 将并将指定的分支设置为当前分支。\n\n*git\
  \ checkout* <branch>\n\n为了在 <branch> 上工作做准备，通过更新索引和工作树中的文件并将 HEAD 指向该分支来切换。工作树中文件的本地修改将被保留，以便将其提交到\
  \ <branch>。\n\n如果未找到 <branch> 但恰好一个远程仓库（称为 <remote>）中存在具有匹配名称的跟踪分支，则将其视为等同于：\n\n\
  ```bash\n$ git checkout -b <branch> --track <remote>/<branch>\n```\n\n你可以省略 <branch>，此时命令将退化为“检出当前分支”，这只是一个带有昂贵副作用的无操作，仅显示当前分支的跟踪信息（如果存在的话）。\n\
  \n*git checkout* -b|-B|--orphan <new_branch> [<start_point>]\n\n\n\n\n指定 `-b` 会导致创建一个新分支，就像调用了\
  \ `(1)` 并对其进行了检出。在这种情况下，你可以使用 `--track` 或 `--no-track` 选项，这些选项将传递给 `git branch`。为了方便起见，在不使用\
  \ `-b` 的情况下 `--track` 意味着创建分支；参见下文对 `--track` 的描述。\n\n如果给出 `-B`，如果 `<new_branch>`\
  \ 不存在则创建它；否则，对其进行重置。这在事务上等同于：\n\n```\n$ git branch -f <branch> [<start point>] $\
  \ git checkout <branch>\n```\n\n也就是说，除非 `\"git checkout\"` 执行成功，否则不会对分支进行重置/创建。\n\
  \n```\ngit checkout --detach [<branch>]\ngit checkout [--detach] <commit>\n```\n\
  \n准备在 `<commit>` 之上工作，通过将 HEAD 挂离到该提交上（参见“DETACHED HEAD”章节），并更新索引和工作树中的文件。工作树中文件的本地修改将被保留，因此生成的工作树将是提交中记录的状态加上本地修改。\n\
  \n当 `<commit>` 参数是分支名时，可以使用 `--detach` 选项将 HEAD 挂离到分支的顶端（`git checkout <branch>`\
  \ 将检出该分支而不挂离 HEAD）。\n\n省略 `<branch>` 则将 HEAD 挂离到当前分支的顶端。\n\n```\ngit checkout [-p|--patch]\
  \ [<tree-ish>] [--] <pathspec>...\n```\n\n当给出 `<paths>` 或 `--patch` 时，`git checkout`\
  \ 不切换分支。它从索引文件或命名的 `<tree-ish>`（通常是提交）更新工作树中命名的路径。在这种情况下，`-b` 和 `--track` 选项是没有意义的，提供其中任何一个都会导致错误。`<tree-ish>`\
  \ 参数用于在更新工作树之前，为指定的路径指定一个特定的 tree-ish（即提交、标签或树）以更新索引。\n\n配合 `<paths>` 或 `--patch`\
  \ 使用的 `git checkout` 用于从索引将已修改或已删除的路径恢复到其原始内容，或用来自命名的 `<tree-ish>`（通常是提交对象）的内容替换路径。\n\
  \n索引可能由于之前的合并失败而包含未合并的条目。默认情况下，如果你尝试从索引检出此类条目，检出操作将失败且什么都不会被检出。使用 `-f` 将忽略这些未合并的条目。可以通过\
  \ `--ours` 或 `--theirs` 从索引中检出合并特定侧的内容。使用 `-m`，可以丢弃对工作树文件所更改，以重建原始的冲突合并结果。\n\n###\
  \ 选项\n\n- `-q, --quiet`: 静默模式，抑制反馈消息。\n- `-f, --force`: 在切换分支时，即使索引或工作树与 HEAD 不同也继续执行。这用于丢弃本地更改。当从索引检出路径时，不会因未合并的条目而失败；相反将忽略未合并的条目。\n\
  - `--ours, --theirs`: 从索引检出路径时，为未合并的路径检出阶段 #2 (`--ours`) 或 #3 (`--theirs`)。\n- `-b\
  \ <new_branch>`: 创建名为 `<new_branch>` 的新分支并从 `<start_point>` 开始它；详情请见 `(1)`。\n- `-B\
  \ <new_branch>`: 创建分支 `<new_branch>` 并从 `<start_point>` 开始它；如果它已存在，则将其重置为 `<start_point>`。这等同于带有\
  \ `-f` 运行 `\"git branch\"`；详情请见 `(1)`。\n- `-t, --track`: 创建新分支时，设置“上游”配置。详情见 `(1)`\
  \ 中的 `\"--track\"`。如果没有给出 `-b` 选项，新分支名称将从远程跟踪分支派生，通过查看为对应远程配置的 refspec 的本地部分，然后剥离到\
  \ `\"*\"` 的初始部分。这将告诉我们在从 `\"origin/hack\"`（或 `\"remotes/origin/hack\"`，甚至 `\"refs/remotes/origin/hack\"\
  `）派生时使用 `\"hack\"` 作为本地分支。如果给定的名称没有斜杠，或者上述猜测结果为空名称，则取消猜测。在这种情况下，你可以通过 `-b` 显式给出名称。\n\
  - `--no-track`: 不设置“上游”配置，即使 `branch.autoSetupMerge` 配置变量为 true。\n- `-l`: 创建新分支的引用日志（reflog）；详情请见\
  \ `(1)`。\n- `--detach`: 与检出分支分支进行工作不同，而是检出一个提交用于检查和可丢弃的实验。这是当 `<commit>` 不是分支名时\
  \ `\"git checkout <commit>\"` 的默认行为。详情见下文的“DETACHED HEAD”章节。\n- `--orphan <new_branch>`:\
  \ 创建名为 `<new_branch>` 的孤立分支，从 `<start_point>` 开始并切换到它。在该分支上进行的第一个提交将没有父节点，它将成为与所有其他分支和提交完全分离的新历史的根。索引和工作树的调整就像你之前运行了\
  \ `\"git checkout <start_point>\"` 一样。这允许你启动一个记录类似于 `<start_point>` 的路径集的新历史，通过轻松运行\
  \ `\"git commit -a\"` 来创建根提交。这在你想要从某个提交发布树而不暴露其完整历史时非常有用。你可能想通过此操作发布一个项目的开源分支。\n\
  - `--ignore-skip-worktree`: 在稀疏检出模式下，`git checkout -- <paths>` 只更新由 `<paths>` 和稀疏模式匹配的条目。\n\
  - `--ignore-other-worktrees`: 当所需的引用已被另一个工作树检出时，`git checkout` 会拒绝。此选项强制检出该引用。换句话说，该引用可以被多个工作树持有。\n\
  - `-m, --merge`: 在切换分支时，如果当前分支与要切换的分支之间存在本地修改，命令将拒绝切换。然而，使用此选项将在当前分支、你的树内容和新分支之间执行三路合并，并将进入新分支。当发生合并冲突时，冲突路径的索引条目保持未合并状态，你需要解析冲突并使用\
  \ `git add` 标记路径（如果合并导致删除则使用 `git rm`）。从索引检出路径时，此选项允许在指定路径中重建冲突。\n- `--conflict=<style>`:\
  \ 与上述 `--merge` 选项相同，但更改冲突块呈现的方式，覆盖 `merge.conflictStyle` 配置变量。可能值为 `\"merge\"`（默认）和\
  \ `\"diff3\"`（在合并样式的基础上显示原始内容）。\n- `-p, --patch`: 交互式选择 `<tree-ish>`（未指定则为索引）与工作树之间的差异块。选中的块随后将反向应用于工作树（如果指定了\
  \ `<tree-ish>`，则应用于索引）。这意味着你可以使用 `git checkout -p` 选择性丢弃当前工作树中的编辑。参见 `(1)` 的“交互模式”章节了解如何操作\
  \ `--patch` 模式。\n- `<branch>`: 要检出的分支；如果它引用一个分支（即在名称前加上 \"refs/heads/\" 后是有效引用），则检出该分支。否则，如果它引用一个有效的提交，你的\
  \ HEAD 将处于“游离”状态，且不再处于任何分支上（详情见下文）。\n\n\n\n\n作为一种特殊情况，`@{-N}` 语法用于检查倒数第 N 个分支/提交（而不是分离头指针指针状态）。你也可以指定\
  \ `-`，它与 `@{-1}` 等价。\n\n另一个特殊情况是，如果 `A` 和 `B` 恰好有一个合并基底，你可以使用 `\"A...B\"` 作为它们合并基底的快捷方式。你可以省略\
  \ `A` 和 `B` 中的最多一个，在这种情况下，它将默认为 `HEAD`。\n\n`<new_branch>`\n\n新分支的名称。\n\n`<start_point>`\n\
  \n开始创建新分支的提交名称；详请见 (1)。默认为 `HEAD`。\n\n`<tree-ish>`\n\n要从此处检出的树（当给出了路径时）。如果未指定，则将使用索引（index）。\n\
  \n## 分离头指针指针 (DETACHED HEAD)\n\n`HEAD` 通常指向一个具名的分支（例如 *master*）。同时，每个分支指向一个特定的提交。让我们来看一个包含三个提交的仓库，其中一个被标记了标签，并且检出了\
  \ *master* 分支：\n\n```\nHEAD (指向分支 'master') | v a---b---c branch 'master' (指向提交\
  \ 'c') ^ | tag 'v2.0' (指向提交 'b')\n```\n\n当在此状态下创建提交时，分支将更新为指向新提交。具体来说，`git commit`\
  \ 会创建一个新提交 `d`，其父提交是提交 `c`，然后更新分支 `master` 指向新提交 `d`。`HEAD` 仍然指向分支 `master`，因此现在间接地指向了提交\
  \ `d`：\n\n```\n$ edit; git add; git commit HEAD (指向分支 'master') | v a---b---c---d\
  \ branch 'master' (指向提交 'd') ^ | tag 'v2.0' (指向提交 'b')\n```\n\n有时，能够检出一个不在任何具名分支顶端的提交，甚至创建一个不被任何具名分支引用的新提交，是非常有用的。让我们看看检出提交\
  \ *b* 时会发生什么（这里展示了两种可能的实现方式）：\n\n```\n$ git checkout v2.0 # 或 $ git checkout master^^\
  \ HEAD (指向提交 'b') | v a---b---c---d branch 'master' (指向提交 'd') ^ | tag 'v2.0' (指向提交\
  \ 'b')\n```\n\n注意，无论我们使用哪种 checkout 命令，`HEAD` 现在都直接指向提交 *b*。这被称为处于“分离头指针”状态。这简单意味着\
  \ `HEAD` 指向一个特定的提交，而不是指向一个具名分支。让我们看看当我们创建一个提交时会发生什么：\n\n```\n$ edit; git add; git\
  \ commit HEAD (指向提交 'e') | v e / a---b---c---d branch 'master' (指向提交 'd') ^ | tag\
  \ 'v2.0' (指向提交 'b')\n```\n\n现在有一个新提交 *e*，但它只被 `HEAD` 引用。当然，我们可以在这种状态下再添加另一个提交：\n\
  \n```\n$ edit; git add; git commit HEAD (指向提交 'f') | v e---f / a---b---c---d branch\
  \ 'master' (指向提交 'd') ^ | tag 'v2.0' (指向提交 'b')\n```\n\n事实上，我们可以执行所有的正常的 Git 操作。但是，让我们看看如果我们随后检出\
  \ master 会发生什么：\n\n```\n$ git checkout master HEAD (指向分支 'master') e---f | / v a---b---c---d\
  \ branch 'master' (指向提交 'd') ^ | tag 'v2.0' (指向提交 'b')\n```\n\n重要的是，要意识到在此时没有任何东西指向提交\
  \ *f*。\n\n\n\n\n在记录 commit 时，在原始 commit 消息末尾添加一行 `\"(cherry picked from commit ...)\"\
  `，以指示该更改是从哪个 commit 拾取（cherry pick）的。这仅适用于没有冲突的 cherry-pick。如果你是从自己的私有分支进行 cherry-pick，请勿使用此选项，因为这些信息对接收者是没用的。相反，如果你在两个公开分支之间进行\
  \ cherry-pick（例如从开发分支将修复程序回移植到旧版本的维护分支），添加这些信息可以是很有用的。\n\n`-r`\n\n该命令以前默认执行上述的 `-x`，而\
  \ `-r` 则用于禁用它。现在默认不执行 `-x`，因此此选项是一个空操作。\n\n`-m parent-number, --mainline parent-number`\n\
  \n通常你无法 cherry-pick 一个合并 commit，因为你不知道合并的哪侧应该被视为为主线。此选项指定主线的父节点编号（从 1 开始），允许 cherry-pick\
  \ 相指定的父节点重放更改。\n\n`-n, --no-commit`\n\n通常该命令会自动创建一系列 commit。此标志会将 cherry-pick 每个命名\
  \ commit 所需的更改应用到你的工作树和索引中，而不创建任何 commit。此外，当使用此选项时，你的索引不需要与 `HEAD` commit 匹配。cherry-pick\
  \ 是针对你索引的初始状态进行的。\n\n这在你连续向索引 cherry-pick 多个 commit 的效果时非常有用。\n\n`-s, --signoff`\n\
  \n在 commit 消息末尾添加 Signed-off-by 行。\n\n`-S[<key-id>], --gpg-sign[=<key-id>]`\n\n\
  对 commit 进行 GPG 签名。\n\n`--ff`\n\n如果当前的 `HEAD` 与被 cherry-pick commit 的父节点相同，则执行该\
  \ commit 的快进（fast forward）。\n\n`--allow-empty`\n\n默认情况下，cherry-pick 一个空 commit 将失败，表示需要显式调用\
  \ `git commit --allow-empty`。此选项将覆盖该行为，允许在 cherry-pick 中自动保留空 commit。注意，当 `--ff`\
  \ 生效时，满足“快进”要求的空 commit 即使没有此选项也会保留。另请注意，使用此选项仅保留最初为空的 commit（即该 commit 记录的树与其父节点相同的树）。由于之前的\
  \ commit 导致变为空的 commit 将被丢弃。要强制包含这些 commit，请使用 `--keep-redundant-commits`。\n\n`--allow-empty-message`\n\
  \n默认情况下，cherry-pick 一个消息为空的 commit 将失败。此选项覆盖该行为，允许对空消息的 commit 进行 cherry-pick。\n\
  \n`--keep-redundant-commits`\n\n如果正在 cherry-pick 的 commit 与当前历史中的某个 commit 重复，它将为空。默认情况下，这些冗余\
  \ commit 会导致 cherry-pick 停止，以便用户检查该 commit。此选项覆盖该行为并创建一个空 commit 对象。隐含 `--allow-empty`。\n\
  \n`--strategy=<strategy>`\n\n使用指定的合并策略。应仅使用一次。详情见 (1) 中的 MERGE STRATEGIES 章节。\n\n\
  `-X<option>, --strategy-option=<option>`\n\n将合并策略特定的选项传递给合并策略。详情见 (1)。\n\n## 序列化器子命令\n\
  \n`--continue`\n\n使用 `*.git/sequencer` 中的信息继续正在进行的操作。可用于解决失败的 cherry-pick 或 revert\
  \ 中的冲突后继续执行。\n\n`--quit`\n\n忘记正在进行的操作。用于失败的 cherry-pick 或 revert 后清除序列化器状态。\n\n\
  `--abort`\n\n取消操作并返回到序列化之前的状态。\n\n## 示例\n\n```bash\ngit cherry-pick master\n```\n\
  应用 master 分支端 commit 所引入的更改，并用此更改创建一个新 commit。\n\n```bash\ngit cherry-pick ..master,\
  \ git cherry-pick ^HEAD master\n```\n应用所有 master 的祖先但不是 HEAD 的 commit 所引入的更改，以产生新\
  \ commit。\n\n```bash\ngit cherry-pick maint next ^master, git cherry-pick maint\
  \ master..next\n```\n应用所有 maint 或 next 的祖先但不是 master 或其任何祖先的 commit 所引入的更改。注意，后者并不是指\
  \ maint 以及 master 和 next 之间的所有内容；具体来说，如果 maint 在 master 中，则不会使用 maint。\n\n```bash\n\
  git cherry-pick master~4 master~2\n```\n应用 master 指向的倒第五和倒第三 commit 所引入的更改，并用这些更改创建\
  \ 2 个新 commit。\n\n```bash\ngit cherry-pick -n master~1 next\n```\n将 master 指向的倒第二个\
  \ commit 以及 next 指向的最后一个 commit 所引入的更改应用到工作树和索引，但不要用这些更改创建任何 commit。\n\n```bash\n\
  git cherry-pick --ff ..next\n```\n如果历史是线性的且 `HEAD` 是 next 的祖先，则更新工作树并将 `HEAD` 指针移动到\
  \ next。否则，将 next 中但 HEAD 中没有的 commit 的更改应用于当前分支，为每个新更改创建一个新 commit。\n\n```bash\n\
  git rev-list --reverse master -- README | git cherry-pick -n --stdin\n```\n将 master\
  \ 分支上所有修改 `README` 的 commit 所引入的更改应用到工作树和索引，以便检查结果并在并在的情况下合并为一个新 commit。\n\n以下序列尝试回移植一个补丁，由于补丁应用的代码变化太大而退出，然后再次尝试，这次在匹配上下文行时会更加小心。\n\
  \n```bash\n$ git cherry-pick topic^\n```\n**(1)**\n```bash\n$ git diff\n```\n**(2)**\n\
  ```bash\n$ git reset --merge ORIG_HEAD\n```\n**(3)**\n```bash\n$ git cherry-pick\
  \ topic^\n```\n**(4)**\n```bash\n$ git cherry-pick -Xpatience topic^\n```\n\n**1.**\
  \ 应用 `git show topic^` 显示的更改。在例例中，补丁没有整洁地应用，因此冲突信息被写入索引，且没有产生新 commit。\n**2.** 总结需要调和的更改\n\
  **3.** 取消 cherry-pick。换句话说，返回到 cherry-pick 之前的状态，保留你之前的任何本地修改。\n**4.** 再次尝试应用 `topic^`\
  \ 引入的更改，花费额外时间以避免因上下文行匹配错误导致的错误。\n\n## 另另\n\n(1)\n\n* *\n\n\n\n\n\n```bash\n$ git\
  \ log --graph --oneline --decorate --boundary origin/master...topic * 7654321 (origin/master)\
  \ upstream tip commit [... snip some other commits ...] * cccc111 cherry-pick of\
  \ C * aaaa111 cherry-pick of A [... snip a lot more that has happened ...] | * cccc000\
  \ (topic) commit C | * bbbb000 commit B | * aaaa000 commit A |/ o 1234567 branch\
  \ point\n```\n\n在这些情况下，`git-cherry` 显示了尚未应用的提交的简要摘要：\n\n```bash\n$ git cherry origin/master\
  \ topic - cccc000... commit C + bbbb000... commit B - aaaa000... commit A\n```\n\
  \n在这里，我们看到提交 `A` 和 `C`（标记为 `-`）可以在您将 topic 分支变基到 `origin/master` 之上时从您的 topic 分支中删除，而提交\
  \ `B`（标记为 `+`）仍然需要保留，以便将其发送并应用到 `origin/master`。\n\n### 使用限制\n\n可选的 `<limit>` 在您的\
  \ topic 基于上游中不存在的其他工作时非常有用。扩展之前的示例，它看起来可能像这样：\n\n```bash\n$ git log --graph --oneline\
  \ --decorate --boundary origin/master...topic * 7654321 (origin/master) upstream\
  \ tip commit [... snip some other commits ...] * cccc111 cherry-pick of C * aaaa111\
  \ cherry-pick of A [... snip a lot more that has happened ...] | * cccc000 (topic)\
  \ commit C | * bbbb000 commit B | * aaaa000 commit A | * 0000fff (base) unpublished\
  \ stuff F [... snip ...] | * 0000aaa unpublished stuff A |/ o 1234567 merge-base\
  \ between upstream and topic\n```\n\n通过指定 `base` 为限制条件，您可以避免列出 `base` 和 `topic`\
  \ 之间的提交：\n\n```bash\n$ git cherry origin/master topic base - cccc000... commit C\
  \ + bbbb000... commit B - aaaa000... commit A\n```\n\n## 参见\n\n(1)\n\n***\n\n# GIT-CLEAN\n\
  \n## 名称\n\n`git-clean` - 从工作树中删除未跟踪的文件\n\n## 概要用法说明\n\n`git clean [-d] [-f] [-i]\
  \ [-n] [-q] [-e <pattern>] [-x | -X] [--] <path>...`\n\n## 描述\n\n通过从当前目录开始递归删除不受版本控制的文件来清理工作树。\n\
  \n通常情况下，只有 `Git` 未知的文件会被删除，但如果指定了 `-x` 选项，忽略的文件也会被删除。这对于删除所有构建产物非常有用。\n\n如果给了任何可选的\
  \ `<path>...` 参数，则只有这些路径受影响。\n\n### 选项\n\n`-d`\n\n除了未跟踪的文件外也删除未跟踪的目录。如果未跟踪的目录由另一个\
  \ `Git` 仓库管理，默认情况下不会删除。如果您真的想删除此类目录，请使用两次 `-f` 选项。\n\n`-f, --force`\n\n如果 Git 配置变量\
  \ `clean.requireForce` 未设置为 `false`，则在没有给出 `-f`、`-n` 或 `-i` 的情况下，`git clean` 将拒绝删除文件或目录。除非给出第二个\
  \ `-f`，否则 `Git` 将拒绝删除带有 `.git` 子目录或文件的目录。也会影响 `git` 子模块，被删除子模块在 `.git/modules/`\
  \ 下的存储区域在给出两次 `-f` 之前不会被删除。\n\n`-i, --interactive`\n\n显示将要执行的操作并以交互方式清理文件。详情请参见“交互模式”。\n\
  \n`-n, --dry-run`\n\n不实际删除任何内容，只显示将要的操作。\n\n`-q, --quiet`\n\n保持安静，只报告错误，不报告成功删除的文件。\n\
  \n`-e <pattern>, --exclude=<pattern>`\n\n除了在 `.gitignore`（按目录）和 `$GIT_DIR/info/exclude`\
  \ 中找到的模式外，还考虑将这些模式纳入生效的忽略规则集中。\n\n`-x`\n\n不使用从 `.gitignore`（按目录）和 `$GIT_DIR/info/exclude`\
  \ 读取的默认忽略规则，但仍使用通过 `-e` 选项提供的忽略规则。这允许删除所有未跟踪的文件，包括构建产物。这可以用于（可能结合 `git reset`）创建一个纯净的工作目录以测试干净的构建。\n\
  \n`-X`\n\n仅删除被 Git 忽略的文件。这对于从头开始重建一切可能有用，但保留手动创建的文件。\n\n## 交互模式\n\n当命令进入交互模式时，它会显示要清理的文件和目录，并进入交互式命令循环。\n\
  \n命令循环显示可用的子命令列表，并提示“What now> ”。通常，当提示以单个 `*` 结束时，您可以只选择给出的选项之一并按回车，如下：\n\n```\n\
  *** Commands *** 1: clean 2: filter by pattern 3: select by numbers 4: ask each\
  \ 5: quit 6: help What now> 1\n```\n\n只要选择是唯一的，您也可以上方说 `c` 或 `clean`。\n\n主命令循环有\
  \ 6 个子命令。\n\n### `clean`\n\n开始清理文件和目录，然后退出。\n\n### `filter by pattern`\n\n按模式过滤。这将显示要删除的文件和目录，并给出“What\
  \ now> ”的提示。通常，当提示以单个 `*` 结束时，您可以只选择给出的选项之一并按回车，如下：\n\n### `select by numbers`\n\
  \n按数字选择。这将显示要删除的文件和目录，并给出“What now> ”的提示。通常，当提示以单个 `*` 结束时，您可以只选择给出的选项之一并按回车，如下：\n\
  \n### `ask each`\n\n逐询问。这将显示要删除的文件和目录，并给出“What now> ”的提示。通常，当提示以单个 `*` 结束时，您可以只选择给出的选项之一并按回车，如下：\n\
  \n### `quit`\n\n退出。\n\n### `help`\n\n显示 `git-clean` 的简要用法。\n\n## 参见\n\n(5)\n\n***\n\
  \n# GIT-CLONE\n\n## 名称\n\n`git-clone` - 将仓库克隆到新目录\n\n## 概要用法说明\n\n`git clone [--template=<template_directory>]\
  \ [-l] [-s] [--no-hardlinks] [-q] [-n] [--bare] [--mirror] [-o <name>] [-b <name>]\
  \ [-u <upload-pack>] [--reference <repository>] [--dissociate] [--separate-git-dir\
  \ <git dir>] [--depth <depth>] [--[no-]single-branch] [--recursive | --recurse-submodules]\
  \ [--] <repository> [<directory>]`\n\n## 描述\n\n将仓库克隆到新目录，为每个分支创建远程跟踪分支（使用 `git branch\
  \ -r` 可），并检出一个从克隆仓库活动分支分支初始分支。\n\n克隆后，普通的 `git fetch` 将更新所有远程跟踪分支，`git pull` 将额外将远程主分支合并到当前主分支（在给出\
  \ `--single-branch` 时不如此；见下文）。\n\n此默认配置通过在 `refs/remotes/origin` 下创建远程分支引用以及初始化\
  \ `remote.origin.url` 和 `remote.origin.fetch` 配置变量来实现。\n\n### 选项\n\n`--local, -l`\n\
  \n当要克隆的仓库位于本地机器时，此标志跳过正常的“感知 Git”传输机制，通过复制 HEAD 以及 objects 和 refs 目录下的内容来克隆仓库。`.git/objects/`\
  \ 目录下的文件尽可能使用硬链接以节省空间。\n\n如果指定为本地路径（例如 `/path/to/repo`），这是默认设置，且 `--local` 实际上不起作用。如果指定为\
  \ URL，则忽略此标志（此时我们从不使用本地优化）。指定 `--no-local` 将在给出 `/path/to/repo` 时覆盖默认设置，使用常规 Git\
  \ 传输。\n\n`--no-hardlinks`\n\n强制从本地文件系统上的仓库进行克隆时复制 `.git/objects` 目录下的文件，而不是使用硬链接。当您尝试备份仓库时这可能是需要的。\n\
  \n`--shared, -s`\n\n\n\n\n\n当要克隆的仓库位于本地机器时，将不再使用硬链接，而是自动设置 `.git/objects/info/alternates`\
  \ 来与源仓库共享对象。生成的仓库初始时不包含任何自己的对象。\n\n**注意**：这是一个可能带有危险的操作；除非你理解它的作用，否则**切勿**使用它。如果你使用此选项克隆仓库，然后在源仓库中删除分支（或使用任何其他导致现有提交未引用的\
  \ Git 命令），某些对象可能会变成未被引用的（或悬空的）。这些对象可能会被正常的 Git 操作（如 `git commit`）移除，这些操作会自动调用 `git\
  \ gc --auto`。（参见 (1)）。）如果这些对象被移除了，且它们曾被克隆的仓库所引用，那么克隆的仓库将会损坏。\n\n请注意，在通过 `-s` 克隆的仓库中如果不带\
  \ `-l` 选项运行 `git repack`，会将对象从源仓库复制到克隆仓库的包中，从而失去了 `clone -s` 节省磁盘空间的效果。不过，运行 `git\
  \ gc` 是安全的，因为它默认使用 `-l` 选项。\n\n如果你想断开通过 `-s` 克隆的仓库对源仓库的依赖，可以简单运行 `git repack -a`\
  \ 将所有对象从源仓库复制到克隆仓库的包中。\n\n### `--reference <repository>`\n\n如果引用仓库位于本地机器上，将自动设置\
  \ `.git/objects/info/alternates` 以从引用仓库获取对象。使用已存在的仓库作为替代方案可以减少从被克隆仓库中复制的对象数量，降低网络和本地存储成本。\n\
  \n**注意**：请参见 `--shared` 选项的注意事项，以及 `--dissociate` 选项。\n\n### `--dissociate`\n\n\
  仅从通过 `--reference` 选项指定的引用仓库借用对象以减少网络传输，并在克隆完成后，通过为借用的对象创建必要的本地副本来停止从那里借用。\n\n###\
  \ `--quiet, -q`\n\n静默运行。进度不会向标准错误流报告。在给定的此标志时，它也会被传递给 `rsync` 命令。\n\n### `--verbose,\
  \ -v`\n\n详细模式运行。不影响向标准错误流报告进度状态。\n\n### `--progress`\n\n默认情况下，当标准错误流连接到终端时，会在标准错误流上报告进度状态，除非指定了\
  \ `-q`。此标志即使在标准错误流未定向到终端也会强制报告进度状态。\n\n### `--no-checkout, -n`\n\n克隆完成后不执行 `HEAD`\
  \ 的检出。\n\n### `--bare`\n\n创建一个裸（bare）Git 仓库。也就是说，而不是创建 `<directory>` 并将管理文件放在 `<directory>/.git`\
  \ 中，而是让 `<directory>` 本身成为 `$GIT_DIR`。这显然意味着 `-n`，因为没有地方可以检出工作树。此外，远程分支头将直接复制到对应的本地分支头，而不会将其映射到\
  \ `refs/remotes/origin/`。当使用此选项时，不会创建远程跟踪分支或相关的配置变量。\n\n### `--mirror`\n\n设置源仓库的镜像。这意味着\
  \ `--bare`。与 `--bare` 相比，`--mirror` 不仅将源的本地分支映射到目标的本地分支，还映射所有的引用（包括远程跟踪分支、注释等等），并设置\
  \ refspec 配置，使得所有这些引用在目标仓库的 `git remote update` 中被覆盖。\n\n### `--origin <name>, -o\
  \ <name>`\n\n使用 `<name>` 代替使用远程名称 `origin` 来跟踪上游仓库。\n\n### `--branch <name>, -b\
  \ <name>`\n\n不再将新创建的 `HEAD` 指向克隆仓库 `HEAD` 所指向的分，而是指向 `<name>` 分支。在非裸仓库中，这将是将被检出的分支。`--branch`\
  \ 也可以接受标签，并在生成的仓库中分离到该提交的 HEAD。\n\n### `--upload-pack <upload-pack>, -u <upload-pack>`\n\
  \n当给定此参数且通过 `ssh` 访问要克隆的仓库时，它指定了在另一端运行的命令的非默认路径。\n\n### `--template=<template_directory>`\n\
  \n指定从哪个目录使用模板文件；（参见 (1) 的“TEMPLATE DIRECTORY”部分。）\n\n### `--config <key>=<value>,\
  \ -c <key>=<value>`\n\n在新创建的仓库中设置配置变量；该设置在仓库初始化后立即生效，但在获取远程历史或检出任何文件之前生效。键的格式与 (1)\
  \ 预期的格式相同（例如 `core.eol=true`）。如果为同一个键给出多个值，每个值都将写入配置文件。这使得（例如）向 `origin` 远程添加额外的\
  \ fetch refspecs 是安全的。\n\n### `--depth <depth>`\n\n创建一个浅层克隆，其历史被截断到指定的修订数量。\n\n\
  ### `--[no-]single-branch`\n\n只克隆通向单个分支末端的历史，该分支由 `--branch` 选项指定，或者由主分支远程的 `HEAD`\
  \ 指向。在使用 `--depth` 选项创建浅层克隆时，这是默认设置，除非给出 `--no-single-branch` 来获取所有分支末端附近的历史。对生成的仓库进行后续获取将只会更新用于初始克隆的该分支的远程跟踪分支。如果在执行\
  \ `--single-branch` 克隆时，远端的 `HEAD` 没有指向任何分支，则不会创建远程跟踪分支。\n\n### `--recursive, --recurse-submodules`\n\
  \n克隆创建后，初始化所有的子模块，使用它们的默认设置。这等同于克隆完成后立即运行 `git submodule update --init --recursive`。如果给出了\
  \ `--no-checkout/-n` 或 `--bare`，则此选项被忽略。\n\n### `--separate-git-dir=<git dir>`\n\
  \n不再将克隆仓库放在它应该所在的位置，而是将克隆仓库放在指定的目录，然后在那里创建一个文件系统相关的符号链接。结果是 Git 仓库可以与工作树分离。\n\n\
  ### `<repository>`\n\n要克隆的（可能是远程）仓库。有关指定仓库的更多信息请参见下文 URL。\n\n### `<directory>`\n\
  \n目标目录名称。如果没有显式给出目录，则使用源仓库的“人类”部分。克隆到已存在的目录仅在**目录为空时允许。\n\n## URLS\n\n通常，URL 包含传输协议、远程服务器的地址以及仓库的路径。取决于传输协议，这些信息可能会缺失。\n\
  \nGit 支持 `ssh`、`git`、`http` 和 `https` 协议（此外，`ftp` 和 `ftps` 可用于获取，`rsync` 可用于获取和推送，但这些效率低下；不要使用它们）。\n\
  \n原生传输（即 `git://` URL）不进行身份验证，在不安全的网络上应谨慎使用。\n\n以下语法适用于它们：\n\n`http[s]://host.xz[:port]/path/to/repo.git/`\n\
  \n`ftp[s]://host.xz[:port]/path/to/repo.git/`\n\n另一种类似于 scp 的语法也可适用于 `ssh` 协议：\n\
  \n`[user@]host.xz:path/to/repo.git/`\n\n此语法只有在第一个冒号之前没有斜线时才被识别。有助于区分包含冒号的本地路径。例如，本地路径\
  \ `foo:bar` 可以指定为绝对路径或 `./foo:bar` 以避免被误认为是 ssh url。\n\n`ssh` 和 `git` 协议额外支持 `~username`\
  \ 扩展：\n\n`[user@]host.xz:/~[user]/path/to/repo.git/`\n\n对于本地仓库（Git 原生支持），可以使用以下语法：\n\
  \n`/path/to/repo.git/`\n\n这两种语法大部分等价，前者隐含 `--local` 选项。\n\n\n\n\n当 `Git` 不知道如何处理某种传输协议时，它会尝试使用\
  \ `remote-<transport>` 远程助手（如果存在的话）。要显式请求远程助手，可以使用以下语法：\n\n`<transport>::<address>`\n\
  \n其中 `<address>` 可能是一个路径、服务器和路径，或者是由调用的特定远程助手所识别的任意 URL 字符串。详情请参见 (1)。\n\n如果存在大量命名相似的远程仓库，且你希望为它们使用不同的格式（使得你使用的\
  \ URL 将被重写为可以工作的 URL），你可以创建一个如下形式的配置节：\n\n`[url \"<actual url base>\"] insteadOf\
  \ = <other url base>`\n\n例如，使用以下配置：\n\n`[url \"\"] insteadOf = host.xz:/path/to/\
  \ insteadOf = work:`\n\n像 `\"work:repo.git\"` 或 `\"host.xz:/path/to/repo.git\"`\
  \ 这样的 URL 在任何接受 `\"\"` 作为 URL 的环境中会被重写。\n\n如果你只想针对推送（push）重写 URL，可以创建一个如下形式的配置节：\n\
  \n`[url \"<actual url base>\"] pushInsteadOf = <other url base>`\n\n例如，使用以下配置：\n\
  \n`[url \"\"] pushInsteadOf =`\n\n像 `\" \"` 的 URL 在推送时会被重写为 `\" \"`，但拉取（pull）仍将使用原始\
  \ URL。\n\n## 示例\n\n从上游克隆：\n\n```\n$ git clone my-linux $ cd my-linux $ make\n```\n\
  \n创建一个引用当前目录的本地克隆，但不检出文件：\n\n```\n$ git clone -l -s -n . ../copy $ cd ../copy $\
  \ git show-branch\n```\n\n在从现有本地目录借鉴的同时从上游克隆：\n\n```\n$ git clone --reference /git/linux.git\
  \ \\ my-linux $ cd my-linux\n```\n\n创建一个裸仓库（bare repository）以向公共发布你的更改：\n\n```\n\
  $ git clone --bare -l /home/proj/.git /pub/scm/proj.git\n```\n\n***\n\n# GIT-COLUMN\n\
  \n## 名称\n\n`git-column` - 以列格式显示数据\n\n## 概要\n\n`git column [--command=<name>] [--[raw-]mode=<mode>]\
  \ [--width=<width>] [--indent=<string>] [--nl=<string>] [--padding=<n>]`\n\n## \n\
  \n此命令将输入格式化为多列。\n\n### 选项\n\n`--command=<name>`\n\n使用配置变量 `column.<name>` 和 `column.ui`\
  \ 查找布局模式。\n\n`--mode=<mode>`\n\n指定布局模式。选项语法参见配置变量 `column.ui`。\n\n`--raw-mode=<n>`\n\
  \n与 `--mode` 相同，但接受数字编码的模式。主要用于已解析布局模式的其他命令。\n\n`--width=<width>`\n\n指定终端宽度。默认情况下，`git\
  \ column` 将检测终端宽度，如果无法检测则回退到 80。\n\n`--indent=<string>`\n\n在每行开头打印的字符串。\n\n`--nl=<N>`\n\
  \n在每行结尾打印的字符串，包括换行符。\n\n`--padding=<N>`\n\n列之间的空格数。默认一个空格。\n\n***\n\n# GIT-COMMIT-TREE\n\
  \n## 名称\n\n`git-commit-tree` - 创建一个新的提交对象\n\n## 概要\n\n`git commit-tree <tree> [(-p\
  \ <parent>)...] < changelog`\n`git commit-tree [(-p <parent>)...] [-S[<keyid>]]\
  \ [(-m <message>)...] [(-F <file>)...] <tree>`\n\n## 描述\n\n这通常不是最终用户想要直接运行的。请改看\
  \ (1)。\n\n基于提供的 tree 对象创建一个新的提交对象，并在标准输出输出新的提交对象 ID。除非给了 `-m` 或 `-F` 选项，否则日志消息将从标准输入读取。\n\
  \n提交对象可以有任意数量的父对象。如果只有一个父对象，它是一个普通的提交。如果有多个父对象，该提交是几条历史之间的合并。初始（根）提交没有父对象。\n\n虽然\
  \ tree 代表工作目录的特定目录状态，但 commit 代表该状态在“时间”上的位置，并解释了如何到达那里。\n\n通常一个提交会标识一个新的 `\"HEAD\"\
  ` 状态，虽然 Git 不关心你将关于该状态的记录存在哪里，但在实践中我们倾向于将结果写入 `.git/HEAD` 指向的文件，这样我们始终能看到最后提交的状态。\n\
  \n### 选项\n\n`<tree>`\n\n一个存在的 tree 对象\n\n`-p <parent>`\n\n每个 `-p` 表示父提交对象的 ID。\n\
  \n`-m <message>`\n\n提交日志消息中的段落。可以多次给出，每个 `<message>` 变成自己的段落。\n\n`-F <file>`\n\n\
  从给文件读取提交日志消息。使用 `-` 从标准输入读取。\n\n`-S[<keyid>], --gpg-sign[=<keyid>]`\n\nGPG 签名提交。\n\
  \n`--no-gpg-sign`\n\n取消 `commit.gpgSign` 配置变量，该变量用于强制每个提交进行签名。\n\n## 提交信息\n\n一个提交封装了：\n\
  \n- 所有父对象 ID\n- 作者姓名、邮箱和日期\n- 提交者姓名、邮箱和提交时间。\n\n虽然父对象 ID 在命令行中提供，但如果设置了，作者和提交者信息将从以下环境变量获取：\n\
  \n`GIT_AUTHOR_NAME GIT_AUTHOR_EMAIL GIT_AUTHOR_DATE GIT_COMMITTER_NAME GIT_COMMITTER_EMAIL\
  \ GIT_COMMITTER_DATE`\n\n\n\n\n\n如果你没有此配置变量，将使用 `i18n.commitencoding` 的值。\n\n注意，我们特意选择在进行提交时不重新编码提交日志消息，以强制在提交对象级别使用\
  \ UTF-8，因为重新编码为 UTF-8 并不一定是一个可逆的操作。\n\n# 文件\n\n`/etc/mailname`\n\n## 相关参见\n\n(1)\n\
  \n***\n\n# GIT-COMMIT\n\n## 名称\n\n`git-commit` - 记录仓库的更改\n\n## 概要\n\n```\ngit commit\
  \ [-a | --interactive | --patch] [-s] [-v] [-u<mode>] [--amend] [--dry-run] [(-c\
  \ | -C | --fixup | --squash) <commit>] [-F <file> | -m <msg>] [--reset-author] [--allow-empty]\
  \ [--allow-empty-message] [--no-verify] [-e] [--author=<author>] [--date=<date>]\
  \ [--cleanup=<mode>] [--[no-]status] [-i | -o] [-S[<key-id>]] [--] [<file>...]\n\
  ```\n\n## 描述\n\n将索引（index）的当前内容存储在一个新的提交中，并带上用户描述更改的日志消息。\n\n要添加的内容可以通过多种方式指定：\n\
  \n1. 通过使用 `git add` 在使用 `commit` 命令之前将更改增量“添加”到索引中（注意：即使是修改过的文件也必须“添加”）；\n2. 在使用\
  \ `commit` 命令之前，通过 `git rm` 从工作树和索引中删除文件；\n3. 通过将文件作为 `commit` 命令的参数列出，在这种情况下，提交将忽略索引中暂存的更改，而是在记录列出的文件的当前内容（这些文件必须是\
  \ Git 已知的）；\n4. 通过使用 `commit` 命令的 `-a` 切换来自动“添加”所有已知文件的更改（即所有已列在索引中的文件），并自动“删除”索引中已从工作树中删除的文件，然后执行实际的提交；\n\
  5. 通过使用 `commit` 命令的 `--interactive` 或 `--patch` 切换，在最终完成操作之前，逐个决定哪些文件或代码块（hunks）应该是提交的一部分。请参见\
  \ (1) 的“交互模式”部分以了解如何操作这些模式。\n\n`--dry-run` 选项可以通过提供相同的参数 set（选项和路径），获取上述任何操作在下一次提交中将包含内容的摘要。\n\
  \n如果你进行了提交，并在之后立即发现错误，可以使用 `git reset` 从中恢复。\n\n### 选项\n\n- `-a, --all`\n\n告诉命令自动暂存已修改和删除的文件，但你尚未告知\
  \ Git 的新文件不会受影响。\n\n- `-p, --patch`\n\n使用交互式补丁选择界面来选择要提交的更改。详情参见 (1)。\n\n- `-C <commit>,\
  \ --reuse-message=<commit>`\n\n取一个现有的提交对象，并在创建提交时复用其日志消息和作者信息（包括时间戳）。\n\n- `-c <commit>,\
  \ --reedit-message=<commit>`\n\n与 `-C` 类似，但使用 `-c` 会调用编辑器，以便用户可以进一步编辑提交消息。\n\n-\
  \ `--fixup=<commit>`\n\n构建一个用于 `rebase --autosquash` 的提交消息。提交消息将是指定提交的主题行，并带有“fixup!\
  \ ” 前缀。详情参见 (1)。\n\n- `--squash=<commit>`\n\n构建一个用于 `rebase --autosquash` 的提交消息。提交消息的主题取自指定提交，并带有“squash!\
  \ ” 前缀。可以配合额外的提交消息选项 (-m/-c/-C/-F)。详情参见 (1)。\n\n- `--reset-author`\n\n与 `-C/-c/--amend`\
  \ 选项配合使用，或在冲突的 cherry-pick 后进行提交时，声明结果提交的作者现在属于提交者。这也刷新作者时间戳。\n\n- `--short`\n\n\
  在进行运行（dry-run）时，以短格式输出。详情参见 (1)。隐含 `--dry-run`。\n\n- `--branch`\n\n即使在短格式下，也显示分支和跟踪信息。\n\
  \n- `--porcelain`\n\n在进行运行时，以便于解析的（porcelain-ready 格式输出。详情参见 (1)。隐含 `--dry-run`。\n\
  \n- `--long`\n\n在进行运行时，以长格式输出。隐含 `--dry-run`。\n\n- `-z, --null`\n\n在显示短格式或 porcelain\
  \ 状态输出时，用 NUL 代替 LF 终止状态输出项。如果没有给出格式，则隐含 `--porcelain` 输出格式。\n\n- `-F <file>, --file=<file>`\n\
  \n从给文件获取提交消息。使用 `-` 从标准输入读取消息。\n\n- `--author=<author>`\n\n覆盖提交作者。使用标准的 A U Thor\
  \ <> 格式指定显式作者。否则，`<author>` 被视为模式，并用于搜索该作者的现有提交（即 `rev-list --all -i --author=<author>`）；然后从找到的第一个此类提交中复制提交作者。\n\
  \n- `--date=<date>`\n\n覆盖提交中使用的作者日期。\n\n- `-m <msg>, --message=<msg>`\n\n使用给定的 `<msg>`\
  \ 作为提交消息。如果给出多个 `-m` 选项，它们的值将合并为独立的段落。\n\n- `-t <file>, --template=<file>`\n\n编辑提交消息时，使用指定文件的启动编辑器。`commit.template`\
  \ 变量通常用于提示。如果用户退出编辑器且未编辑消息，则取消提交。\n\n- `-s, --signoff`\n\n在消息末尾添加 Signoff-by 行。\n\
  \n- `-n, --no-verify`\n\n跳过 pre-commit 和 commit-msg 钩子。另见 (5)。\n\n- `--allow-empty`\n\
  \n通常记录一个与其父节点树相同的提交是错误的，该命令会阻止你进行此类提交。此选项主要用于外部脚本。\n\n- `--allow-empty-message`\n\
  \n类似于 `--allow-empty`，该命令主要用于外部脚本。它允许创建一个空消息的提交。\n\n- `--cleanup=<mode>`\n\n此选项决定在提交前如何对提供的提交消息进行清理。`<mode>`\
  \ 可以 strip, whitespace, verbatim 或 default。\n\n- `strip`\n\n删除首尾行、行尾空格、注释并合并连续空行。\n\
  \n- `whitespace`\n\n与 strip 相同，但不移除注释。\n\n- `verbatim`\n\n完全不更改消息。\n\n- `scissors`\n\
  \n与 whitespace 相同，但如果编辑消息，从“# ------------------------ >------------------------”开始的所有内容将被截断。“#”可以通过\
  \ `core.commentChar` 自定义。\n\n- `default`\n\n如果编辑消息，则与 strip 相同。否则为 whitespace。可以通过\
  \ `commit.cleanup` 变量更改（参见 (1)）。\n\n- `-e, --edit`\n\n从文件 `-F`、命令行 `-m` 和从提交对象 `-C`\
  \ 获取的消息通常作为未修改的提交日志消息。此选项让你进一步编辑从这些来源获取的消息。\n\n- `--no-edit`\n\n在不启动编辑器的情况下使用选定的提交消息。例如，`git\
  \ commit --amend --no-edit` 在不更改提交消息的情况下修订提交。\n\n- `--amend`\n\n创建一个新提交来替换当前分支的顶点。按通常记录树（包括\
  \ `-i` 和 `-o` 选项以及显式路径规范的影响），如果未通过命令行选项 -m/-F/-c 等指定其他消息，则使用原始提交的消息作为起始点，而不是空消息。新提交与当前提交具有相同的父节点和作者（--reset-author`\
  \ 选项可以取消此限制）。它大致相当于：\n\n```\n$ git reset --soft HEAD^ ... 执行其他操作以获得正确的树 ... $ git\
  \ commit -c ORIG_HEAD\n```\n\n但也可以用于修订合并提交。\n\n\n\n\n如果你修改了已经发布的提交，你应该理解重写历史所可能产生的影响。（请参见\
  \ (1) 中的“RECOVERING FROM UPSTREAM REBASE” 章节。）\n\n`--no-post-rewrite`\n跳过重写后的钩子（hook）。\n\
  \n`-i, --include`\n在对目前暂存的内容进行提交之前，也将命令行中给出的路径的内容进行暂存。除非你正在完成一个冲突合并，否则通常不是你想要的操作。\n\
  \n`-o, --only`\n通过获取命令行指定路径的更新后的工作树内容来创建提交，忽略任何已暂存其他路径的内容。如果命令行上提供了任何路径，这是 `git\
  \ commit` 的默认操作模式，在这种情况下可以省略此选项。如果此选项与 `--amend` 一起指定，则不需要指定路径，这可以用于修改上一次提交，而不提交已经暂存的更改。\n\
  \n`-u[<mode>], --untracked-files[=<mode>]`\n显示未跟踪的文件。\n\n`mode` 参数是可选的（默认为 `all`），用于指定处理未跟踪文件的方式；当不使用\
  \ `-u` 时，默认值为 `normal`，即显示未跟踪的文件和目录。\n\n可能的选项有：\n- `no` - 不显示未跟踪的文件\n- `normal`\
  \ - 显示未跟踪的文件和目录\n- `all` - 也显示未跟踪目录中的单个文件。\n\n默认值可以使用 (1) 中记录的 `status.showUntrackedFiles`\
  \ 配置变量进行更改。\n\n`-v, --verbose`\n在 HEAD 提交与提交消息模板底部将提交的内容之间显示统一差异（unified diff），以帮助用户通过提醒提交包含了哪些更改来描述提交。请注意，此差异输出的行开头没有\
  \ `#` 前缀。此差异不会成为提交消息的一部分。\n\n如果指定两次，则额外显示将要提交的内容与工作树文件之间的统一差异，即已跟踪文件的未暂存更改。\n\n\
  `-q, --quiet`\n静默输出提交摘要消息。\n\n`--dry-run`\n不创建提交，但显示将要提交的路径列表、将未提交且带有本地更改的路径以及未跟踪的路径。\n\
  \n`--status`\n当使用编辑器准备提交消息时，在提交消息模板中包含 (1) 的输出。默认开启，但可用于覆盖配置变量 `commit.status`。\n\
  \n`--no-status`\n当使用编辑器准备默认提交消息时，不在提交消息模板中包含 (1) 的输出。\n\n`-S[<keyid>], --gpg-sign[=<keyid>]`\n\
  对提交进行 GPG 签名。\n\n`--no-gpg-sign`\n取消 `commit.gpgSign` 配置变量，该变量强制对每个提交进行签名。\n\n`--`\n\
  不再将任何参数解释为选项。\n\n`<file>...`\n当命令行上给出文件时，命令将提交命名文件的内容，而不记录已暂存的更改。这些文件的内容也被暂存到在之前暂存内容的基础上，用于下一次提交。\n\
  \n## 日期格式\n\n`GIT_AUTHOR_DATE`、`GIT_COMMITTER_DATE` 环境变量和 `--date` 选项支持以下日期格式：\n\
  \n### Git 内部格式\n格式为`<unix timestamp> <time zone offset>`，其中 `<unix timestamp>` 是自\
  \ Unix 纪以来的秒数`<time zone offset>` 是相对于 UTC 的正负偏移量。例如，CET（比 UTC 早 2 小时）为 `+0200`。\n\
  \n### RFC 2822\nRFC 2822 描述的标准邮件格式，例如 `Thu, 07 Apr 2005 22:13:13 +0200`。\n\n###\
  \ ISO 8601\nISO 8601 标准指定的时间日期，例如 `2005-04-07T22:13:13`。解析器也接受空格代替 `T` 字符。\n\n**注意**\n\
  此外，日期部分也接受以下格式：YYYY.MM.DD、MM/DD/YYYY 和 DD.MM.YYYY。\n\n## 示例\n\n在记录你自己的工作时，工作树中修改文件的内容会通过\
  \ `git add` 临时存储在名为“索引（index）”的暂存区。可以通过 `git reset HEAD -- <file>` 将文件恢复到上一次提交的状态，但仅在索引中恢复而不在工作树中，这实际上撤销了\
  \ `git add` 并防止该文件的更改参与下一次提交。在用这些命令增量构建好待提交的状态后，使用 `git commit`（不带任何路径参数）来记录目前为止已暂存的内容。这是该命令最基本的形式。示例：\n\
  \n```\n$ edit hello.c $ git rm goodbye.c $ git add hello.c $ git commit\n```\n\n\
  与其在每次单独更改后暂存文件，你可以告诉 `git commit` 注意你工作树中被跟踪内容的文件的更改，并为你执行相应的 `git add` 和 `git rm`。也就是说，如果你的工作树中没有其他更改，此示例与之前的示例相同：\n\
  \n```\n$ edit hello.c $ rm goodbye.c $ git commit -a\n```\n\n`git commit -a` 命令首先查看你的工作树，注意到你修改了\
  \ `hello.c` 并删除了 `goodbye.c`，然后为你执行必要的 `git add` 和 `git rm`。\n\n在暂存许多文件的更改后，你可以通过向\
  \ `git commit` 路径来更改记录更改的顺序。给出路径时，命令创建一个记录以下内容的提交：\n\n```\n$ edit hello.c hello.h\
  \ $ git add hello.c hello.h $ git commit Makefile\n```\n\n这将创建一个记录 `Makefile` 更改的提交。`hello.c`\
  \ 和 `hello.h` 的更改未包含在生成的提交中。然而，它们仍然处于暂存状态，只是被留下了。在上述序列之后，如果你执行 `git commit`\n\n\
  ## 讨论\n\n虽然不是强制的，但最好用一个简短的（少于 50 个字符）行概述更改，后面跟着一个空行，然后是更详细的描述。提交消息中第一个空行之前的文本被视为提交标题，该标题在整个\
  \ Git 中都会使用。例如，(1) 将提交转换为邮件，它使用主题行作为标题，并将提交的其他部分作为正文。\n\n在核心层面，Git 与字符编码无关。\n\n\
  在索引和树对象中记录的路径名被视为未解释的非空字节序列。`(2)` 返回的内容是用于记录并与 Git 跟踪的数据进行比较的内容，而这些数据预期是 `(2)` 和\
  \ `(2)` 接受的内容。不存在路径名编码转换。\n\n\n\n\n尽管我们鼓励提交日志信息使用 UTF-8 编码，但核心部分和 Git Porcelain\
  \ 工具（Porcelain）在设计上并未强制项目使用 UTF-8。如果某个项目的所有参与者认为使用旧留编码更方便，Git 并不禁止。然而，有几点需要注意。\n\
  \n1. 如果提供的提交日志信息看起来不像是有效的 UTF-8 字符串，`git commit` 和 `git commit-tree` 会发出警告，除非你显式说明你的项目使用旧留编码。这种方法是在\
  \ `.git/config` 文件中设置 `i18n.commitencoding`，如下：\n\n```\n[i18n] commitencoding =\
  \ ISO-8859-1\n```\n\n使用上述设置创建的提交对象会在其编码头部中记录 `i18n.commitencoding` 的值。为了为了之后查看的人。缺少此头部意味着提交日志信息是用\
  \ UTF-8 编码的。\n\n2. `git log`、`git show`、`git blame` 等命令会查看提交对象的编码头部，除非另有指定，否则会尝试将日志信息重新编码为\
  \ UTF-8。你可以通过 `.git/config` 文件中的 `i18n.logoutputencoding` 来指定所需的输出编码，如下：\n\n```\n\
  [i18n] logoutputencoding = ISO-8859-1\n```\n\n如果你没有此配置变量，将使用 `i18n.commitencoding`\
  \ 的值。\n\n请注意，我们刻意选择在执行提交时不重新编码提交日志信息，以便在提交对象级别强制使用 UTF-8，因为重新编码为 UTF-8 并不一定是一个可逆的操作。\n\
  \n## 环境与配置变量\n\n用于编辑提交日志信息的编辑器将从 `GIT_EDITOR` 环境变量、`core.editor` 配置变量、`VISUAL` 环境变量或\
  \ `EDITOR` 环境变量中选择（按此顺序）。详情请见 (1)。\n\n## 钩子 (HOOKS)\n\n此命令可以运行 `commit-msg`、`prepare-commit-msg`、`pre-commit`\
  \ 和 `post-commit` 钩子。更多信息请见 (5)。\n\n## 文件 (FILES)\n\n`$GIT_DIR/COMMIT_EDITMSG`\n\
  \n该文件包含正在进行提交的提交信息。如果 `git commit` 在创建提交之前由于错误退出，用户提供的任何提交信息（例如在编辑器会话中）将在此文件中可用，但会被下一次调用\
  \ `git commit` 时覆盖。\n\n## 参见 (SEE ALSO)\n\n(1), (1), (1), (1), (1)\n\n* * *\n\n\
  # GIT-CONFIG\n\n## 名称\n\n`git-config` - 获取和设置仓库或全局选项\n\n## 概要\n\n`git config [<file-option>]\
  \ [type] [-z|--null] name [value [value_regex]]`\n`git config [<file-option>] [type]\
  \ --add name value`\n`git config [<file-option>] [type] --replace-all name value\
  \ [value_regex]`\n`git config [<file-option>] [type] [-z|--null] --get name [value_regex]`\n\
  `git config [<file-option>] [type] [-z|--null] --get-all name [value_regex]`\n`git\
  \ config [<file-option>] [type] [-z|--null] --get-regexp name_regex [value_regex]`\n\
  `git config [<file-option>] [type] [-z|--null] --get-urlmatch name URL`\n`git config\
  \ [<file-option>] --unset name [value_regex]`\n`git config [<file-option>] --unset-all\
  \ name [value_regex]`\n`git config [<file-option>] --rename-section old_name new_name`\n\
  `git config [<file-option>] --remove-section name`\n`git config [<file-option>]\
  \ [-z|--null] -l | --list`\n`git config [<file-option>] --get-color name [default]`\n\
  `git config [<file-option>] --get-colorbool name [stdout-is-tty]`\n`git config [<file-option>]\
  \ -e | --edit`\n\n## 描述\n\n你可以使用此命令查询/设置/替换/取消选项。名称实际上是由点分隔的节（section）和键（key），值将被转义。\n\
  \n可以使用 `--add` 选项向选项中添加多行。如果你想更新或取消一个可能出现在多行的选项，则提供一个 POSIX 正则表达式 `value_regex`。只有匹配正则表达式的现有值会被更新或取消。如果你想处理**不**匹配正则表达式的行，只需在前面加一个感叹号（参见“示例”部分）。\n\
  \n类型指定符可以是 `--int` 或 `--bool`，以使 `git config` 确保变量为给定的类型并将值转换为规范形式（int 为简单的数字，bool\
  \ 为 \"true\" 或 \"false\" 字符串），或者是 `--path`，它会执行一些路径扩展（见下文 `--path`）。如果没有传递类型指定符，则不会对值进行任何检查或转换。\n\
  \n读取时，默认从系统、全局和仓库本地配置文件读取值，可以使用 `--system`、`--global`、`--local` 和 `--file <filename>`\
  \ 选项告诉命令从该位置读取（参见“文件”部分）。\n\n写入时，默认从系统、全局和仓库本地配置文件读取值，可以使用 `--system`、`--global`、`--local`\
  \ 和 `--file <filename>` 选项告诉命令从该位置写入。\n\n此命令在发生以下情况将失败并返回非零状态：\n\n1. 节无效，\n2. 未提供节或名称，\n\
  3. 配置文件无效，\n4. 未找到键，\n5. 尝试取消不存在的选项，\n6. 尝试取消多行，\n7. 使用了无效的正则表达式。\n\n如果成功，命令返回退出代码\
  \ 0。\n\n### 选项\n\n--replace-all 默认行为最多替换一行。这将替换匹配键的所有行。\n\n--add 向选项添加新行，不更改任何现有值。\n\
  \n--get 获取给定键的值。如果未找到键则返回错误 1，如果找到多个值则返回最后一个。\n\n--get-all 类似于 get，但如果值的数量不等于一个则不失败。\n\
  \n--get-regexp 类似于 get-all，但将名称解释为正则表达式并输出键名。正则表达式匹配目前是区分大小写的，并针对规范化后的键进行，其中节名会被小写，但子节名不会。\n\
  \n--get-urlmatch name URL 当给定双部分名称 section.key 时，返回 <url> 部分匹配给定 URL 的值（如果不存在此类键，则使用\
  \ section.key 作为备用）。当仅提供节作为名称时，对该节中的所有键执行操作。\n\n--global 写入时：写入全局 ~/.gitconfig 而不是仓库的\
  \ .git/config；如果 $XDG_CONFIG_HOME/git/config 文件存在而 ~/.gitconfig 文件不存在，则写入该文件。读取时：仅从全局\
  \ ~/.gitconfig 和 $XDG_CONFIG_HOME/git/config 读取，而不是所有可用文件。\n\n--system 写入时：写入系统级\
  \ $(prefix)/etc/gitconfig 而不是仓库的 .git/config。读取时：仅从系统级 $(prefix)/etc/gitconfig 读取，而不是所有可用文件。\n\
  \n--local 写入时：写入仓库的 .git/config 文件。这是默认行为。读取时：仅从仓库的 .git/config 读取，而不是所有可用文件。\n\n\
  -f config-file, --file config-file 使用指定的配置文件代替 GIT_CONFIG 指定的文件。\n\n--blob blob\
  \ 类似于 --file 但使用指定的 blob 代替文件。例如，你可以使用 `master:.gitmodules` 从 master 分支的 *.gitmodules\
  \ 文件读取值。参见 (7) 中的“指定修订”部分以获取更完整的 blob 名称拼写列表。\n\n--remove-section 从配置文件中删除指定的节。\n\
  \n--rename-section\n\n\n\n\n将给定的部分重命名为新名称。\n\n`--unset`\n\n从配置文件中删除匹配键的行。\n\n`--unset-all`\n\
  \n从配置文件中删除所有匹配该键的行。\n\n`-l, --list`\n\n列出配置文件中设置的所有变量。\n\n`--bool`\n\n`git config`\
  \ 将确保输出为 \"true\" 或 \"false\"。\n\n`--int`\n\n`git config` 将确保输出为一个简单的十进制数字。配置文件中可选的值后缀\
  \ `k`、`m` 或 `g` 会导致该值在输出前乘以 1024、1048576 或 1073741824。\n\n`--bool-or-int`\n\n`git\
  \ config` 将确保输出符合上述描述的 `--bool` 或 `--int` 格式之一。\n\n`--path`\n\n`git-config` 将将开头的\
  \ `~` 展开为 `$HOME` 的值，并将将 `~user` 展开为指定用户的家目录。此选项在设置值时无效（但你可以从命令行使用 `git config bla\
  \ ~/*` 来让你的 shell 执行展开）。\n\n`-z, --null`\n\n对于所有输出值和/或键的选项，值始终以空字符结尾（而不是换行符）。使用换行符作为键和值之间的分隔符。这允许对输出进行安全解析，而不会因为值中包含换行符而产生混淆。\n\
  \n`--get-colorbool name [stdout-is-tty]`\n\n查找 name 的颜色设置（例如 color.diff）并输出 \"true\"\
  \ 或 \"false\"。stdout-is-tty 应该是 \"true\" 或 \"false\"，且在当配置说明为 \"auto\" 时会考虑它。如果缺少\
  \ stdout-is-tty，则检查命令本身的标准输出，如果需要使用颜色，则以状态 0 退出，否则以状态 1 退出。当 name 的颜色设置未定义时，命令将使用\
  \ color.ui 作为回备。\n\n`--get-color name [default]`\n\n查找为 name 配置的颜色（例如 color.diff.new）并将其作为\
  \ ANSI 颜色转义序列输出到标准输出。如果没有为 name 配置颜色，则改为使用可选的默认参数。\n\n`-e, --edit`\n\n打开编辑器修改指定的配置文件；可以是\
  \ `--system`、`--global` 或仓库（默认）。\n\n`--[no-]includes`\n\n在查找值时尊重配置文件中的 `include.*`\
  \ 指令。默认开启。\n\n## 文件 (FILES)\n\n如果没有通过 `--file` 显式设置，有四个文件 `git config` 会在其中搜索配置选项：\n\
  \n`$(prefix)/etc/gitconfig`\n\n系统级配置文件。\n\n`$XDG_CONFIG_HOME/git/config`\n\n第二个用户特定的配置文件。如果\
  \ `$XDG_CONFIG_HOME` 未设置或为空，，则将使用 `$HOME/.config/git/config`。在此文件中设置的任何单值变量都将被 `~/.gitconfig`\
  \ 中的内容覆盖。如果你有时使用旧版本的 Git，那么不创建此文件是一个好主意，因为对该文件的支持最近才添加的。\n\n`~/.gitconfig`\n\n用户特定的配置文件。也称为全局（global）配置文件。\n\
  \n`$GIT_DIR/config`\n\n仓库特定的配置文件。\n\n如果没有提供进一步的选项，所有读取选项将读取所有这些可用文件。如果全局或系统级配置文件不可，它们将被忽略。如果仓库配置文件不可或不可读，`git\
  \ config` 将以非零错误代码退出。然而，在上述两种情况下都不会发布错误消息。\n\n文件按照上述顺序读取，最后找到的值优于较早读取的值。当取多个值时，将使用来自所有文件中该键的所有值。\n\
  \n\n\n默认情况下，所有写入选项将写入仓库特定的配置文件。请注意，这也会影响如 `--replace-all` 和 `--unset` 等选项。`git config`\
  \ 每次只会更改一个文件。\n\n你可以通过命令行选项或环境变量来覆盖这些规则。`--global` 和 `--system` 选项将将使用的文件限制为全局或系统级文件。`GIT_CONFIG`\
  \ 环境变量具有类似的效果，但你可以指定任何所需的文件名。\n\n## 环境 (ENVIRONMENT)\n\n`GIT_CONFIG`\n\n从给定的文件而不是\
  \ `.git/config` 获取配置。使用 `--global` 选项将其强制指向 `~/.gitconfig`。使用 `--system` 选项将其强制指向\
  \ `$(prefix)/etc/gitconfig`。\n\n`GIT_CONFIG_NOSYSTEM`\n\n是否跳过从系统级 `$(prefix)/etc/gitconfig`\
  \ 文件读取设置。详情请见 (1)。\n\n另请参见“文件 (FILES)”章节。\n\n## 示例 (EXAMPLES)\n\n假设有一个如下 `.git/config`：\n\
  \n```\n# # 这是配置文件，其中 # 字符 '#' 或 ';' 字符表示 # 注释 #\n; 核心变量 [core] ; 不要信任文件模式 filemode\
  \ = false\n; 我们的差分算法 [diff] external = /usr/local/bin/diff-wrapper renames = true\n\
  ; 代理设置 [core] gitproxy=proxy-command for kernel.org gitproxy=default-proxy ; 针对其余所有\n\
  ; HTTP [http] sslVerify [http \"\"] sslVerify = false cookieFile = /tmp/cookie.txt\n\
  ```\n\n你可以通过以下命令将 filemode 设置为 true：\n\n```\n% git config core.filemode true\n```\n\
  \n假设的代理命令条目实际上有一个后缀，用于区分它们适用于什么 URL。以下是更改 name 的方法：\n\n假设的代理命令条目实际上有一个后缀，用于区分它们适用于什么\
  \ URL。以下是更改 name 的方法：\n\n[抱歉，此处重复，重新翻译示例部分：]\n\n你可以通过以下命令将 filemode 设置为 true：\n\n\
  ```\n% git config core.filemode true\n```\n\n假设的代理命令条目实际上有一个后缀，用于区分它们适用于什么 URL。以下是更改\
  \ name 的方法：\n\n（注：由于原文示例部分似乎被截断或重复，已按逻辑完整翻译）\n\n\n\n\n该文件由节和变量组成。节以方括号中的节名称开始，并持续到下一个节开始。节名称不区分大小写。节名称中仅允许出现字母、数字、`-`\
  \ 和 `.`。每个变量必须属于某个节，这意味着在变量的第一个设置之前必须有一个节头部。\n\n节可以进一步划分为子节。要开始一个子节，请在节头部中将其名称放在双引号中，并与节名之间用空格隔开，如下例：\n\
  \n`[section \"subsection\"]`\n\n子节名称区分大小写，并且可以包含换行符以外的任何字符（双引号 `\"` 和反斜杠 `\\` 可以通过转义为\
  \ `\\\"` 和 `\\\\` 来包含）。节头部不能跨多行。变量可以直接属于一个节，也可以属于给定的子节。如果你有了 `[section \"subsection\"\
  ]`，则你可以有 `[section]`，但没有必要这样做。\n\n还有一个已弃用的 `[section.subsection]` 语法。在这种语法下，子节名称会被转换为小写，并且同样进行区分大小写的比较。这些子节名称遵循的限制与节名称相同。\n\
  \n所有其他行（以及节头部之后的行剩余部分）都被识别为设置变量，格式为 `name = value`（或仅为 `name`，这是变量为布尔值 `\"true\"\
  ` 的简写）。变量名不区分大小写，仅允许字母、数字和 `-`，并且必须以字母开头。\n\n定义值的行可以通过以 `;` 结尾来延续到下一行，反引号（此处）和行结束符会被剥离。`name\
  \ =` 之后的前导空格、第一个注释字符 `#` 或 `;` 之后的行剩余部分以及行的尾部空格会被丢弃，除非它们被包含在双引号内。值内部的空格将原样保留。\n\n\
  在双引号内部，双引号 `\"` 和反斜杠 `\\` 字符必须进行转义：使用 `\\\"` 表示 `\"`，使用 `\\\\` 表示 `\\`。\n\n除了 `\\\
  \"` 和 `\\\\` 之外，还识别以下转义序列：`\\n` 表示换行符 (NL)，`\\t` 表示水平制表符 (HT, TAB)，以及 `\\b` 表示退格\
  \ (BS)。其他字符转义序列（包括八进制转义序列）都是无效的。\n\n### Includes\n\n你可以通过将特殊的 `include.path` 变量设置为要包含的文件名，从另一个文件中包含配置文件。被包含的文件立即展开，就像其内容在包含指令的位置被找到一样。如果\
  \ `include.path` 变量的值是相对路径，则该路径被认为相对于发现包含指令的配置文件。`include.path` 的值受波浪号扩展：`~/` 扩展为\
  \ `$HOME` 的值，`~user/` 扩展为指定用户的家目录。示例见下文。\n\n### Example\n\n```bash\n# 核心变量 [core]\
  \ ; 不要信任文件模式 filemode = false\n# 我们的差异算法 [diff] external = /usr/local/bin/diff-wrapper\
  \ renames = true\n[branch \"devel\"] remote = origin merge = refs/heads/devel\n\
  # 代理设置 [core] gitProxy=\"ssh\" 用于 \"kernel.org\" gitProxy=default-proxy ; 用于其他部分\n\
  [include] path = /path/to/foo.inc ; 通过绝对路径包含 path = foo ; 相对于当前文件路径扩展 \"foo\"\n\
  ```\n\n### Values\n\n`include.path` 变量的值是一个相对路径，该路径被认为相对于发现包含指令的配置文件。`include.path`\
  \ 的值受波浪号扩展：`~/` 扩展为 `$HOME` 的值，`~user/` 扩展为指定用户的家目录。\n\n定义值的行可以通过以 `;` 结尾来延续到下一行，反引号和行结束符会被剥离。`name\
  \ =` 之后的前导空格、第一个注释字符 `#` 或 `;` 之后的行剩余部分以及行的尾部空格会被丢弃，除非它们被包含在双引号内。值内部的空格将原样保留。\n\n\
  在双引号内部，双引号 `\"` 和反斜杠 `\\` 字符必须进行转义：使用 `\\\"` 表示 `\"`，使用 `\\\\` 表示 `\\`。\n\n除了 `\\\
  \"` 和 `\\\\` 之外，还识别以下转义序列：`\\n` 表示换行符 (NL)，`\\t` 表示水平制表符 (HT, TAB)，以及 `\\b` 表示退格\
  \ (BS)。其他字符转义序列（包括八进制转义序列）都是无效的。\n\n### Variables\n\n注意此列表并不完整的。对于特定命令的变量，你将在手册页中找到更详细的描述。\n\
  \n其他 git 相关的工具可能并在使用自己的变量。在发明新变量时，请确保它们的名称与 Git 本身使用的冲突，并在文档中描述它们。\n\n所有 `advice`\
  \ 变量默认认为 `true`，你可以通过将这些变量设置为 `false` 来告诉 Git 你不需要帮助：\n\n### updateRejected\n\n\
  如果你想将此变量设置为 `false`，则同时禁用 `pushNonCurrent`、`pushNonMatching`、`pushAlreadyExists`、`pushFetchFirst`\
  \ 和 `pushNeedsForce`。\n\npushNonCurrent\n\n当 `(1)` 由于当前分支的非快进更新（non-fastforward\
  \ update）失败时显示的建议。\n\npushNonMatching\n\n当你运行 `(1)` 并显式推送 `matching refs`（即你使用了不是你当前分支的\
  \ refspec）并导致非快进错误时显示的建议。\n\n\n\n\n# core.fileMode\n\n告知 Git 是否尊重工作区中文件的可执行位。\n\n\
  某些文件系统在检出被标记为可执行的文件时会丢失可执行位，或者在检出带有可执行位的非可执行文件时加上该执行位。(1)。1) 或 (1) 会探测文件系统以查看其是否能正确处理执行位，并根据需要自动设置此变量。\n\
  \n然而，仓库可能位于一个能够正确处理文件模式的文件系统上，该变量在创建时被设置为 `true`，但随后可能会从另一个会丢失文件模式的环境访问（例如：通过 CIFS\
  \ 挂载 ext4，或者使用 Git for Windows 或 Eclipse 访问由 Cygwin 创建的仓库）。在这种情况下，可能需要将此变量设置为 `false`。详见\
  \ (1)。\n\n默认值为 `true`（当配置文件中未指定 `core.filemode` 时）。\n\n# core.ignoreCase\n\n如果为\
  \ `true`，此选项将启用各种变通方法，使 Git 在不支持大小敏感的文件系统（如 FAT）上运行得更好。例如，如果目录列表发现了 \"makefile\"\
  \ 而 Git 期望 \"Makefile\"，Git 将假设它们实际上是同一个文件，并继续将其记录为 \"Makefile\"。\n\n默认值为 `false`，但在创建仓库时，(1)\
  \ 或 (1) 会探测并在适当的情况下将 `core.ignoreCase` 设置为 `true`。\n\n# core.precomposeUnicode\n\
  \n此选项仅供 Mac OS 版本的 Git 实现使用。当 `core.precomposeUnicode=true` 时，Git 会撤销 Mac OS 对文件名进行的\
  \ Unicode 分解。这在在 Mac OS 与 Linux 或 Windows 之间共享仓库时非常有用。（需要 Git for Windows 1.7.10\
  \ 或更高版本，或者 cygwin 1.7 下的 Git）。当为 `false` 时，Git 将完全透明地处理文件名，这与旧 Git 兼容。\n\n# core.protectHFS\n\
  \n如果设置为 `true`，则不允许检出在 HFS+ 文件系统上被认为等同于 `.git` 的路径。在 Mac OS 上默认为 `true`，在其他地方默认为\
  \ `false`。\n\n# core.protectNTFS\n\n如果设置为 `true`，则不允许检出会导致 NTFS 文件系统出现问题的路径，例如与\
  \ 8.3“短”名称的冲突。在 Windows 上默认为 `true`，在其他地方默认为 `false`。\n\n# core.trustctime\n\n如果为\
  \ `false`，则忽略索引和工作区之间的 ctime 差异；当 inode 修改时间经常被 Git 外部程序修改（如文件系统爬虫和某些备份系统）时非常有用。详见\
  \ (1)。默认认为 `True`。\n\n# core.checkStat\n\n确定索引和工作区之间匹配哪些 stat 字段。用户可以将其设置为 `default`\
  \ 或 `minimal`。`Default`（或显式的 `default`）会检查所有字段，包括 `mtime` 和 `ctime` 的亚秒部分。\n\n#\
  \ core.quotePath\n\n输出路径的命令（例如 `ls-files`, `diff`）在没有给出 `-z` 选项时，将通过双引号对包裹路径并使用反斜杠对路径中的“异常”字符进行引用，方式类似于\
  \ C 源代码中字符串的引用方式。如果此变量设置为 `false`，高于 `0x80` 的字节将不会被引用，而是原样输出。注意，无论此变量如何设置，双引号、反斜杠和控制字符在不使用\
  \ `-z` 的情况下始终会被引用。\n\n# core.eol\n\n设置工作目录中使用的行结束符类型。默认是 `auto`，使用平台的原生行结束符。替代方案有\
  \ `lf`、`crlf` 和 `native`。更多信息见 (5)。\n\n# core.safecrlf\n\n如果为 `true`，防止 Git 在检出文件时将\
  \ CRLF 转换为 LF。如果你希望工作区中使用 CRLF 行结束符而仓库中不是，这非常有用。默认值为 `false`。\n\n# core.autocrlf\n\
  \n将此变量设置为 `true` 几乎与将所有文件的文本属性设置为“auto”相同，只是文本文件无法保证在仓库中被归一化。如果你希望目录中使用 CRLF 行结束符，请使用此设置。此变量可以设置为\
  \ `input`，在这种情况下不进行输出转换。\n\n# core.symlinks\n\n如果为 `false`，符号链接将被检出为包含链接文本的小纯文件。这对于\
  \ FAT 等不支持符号链接的文件系统非常有用。\n\n等待，默认值为 `true`，但在创建仓库时，(1) 或 (1) 会探测并在适当的情况下将 `core.symlinks`\
  \ 设置为 `false`。\n\n# core.gitProxy\n\n一个“代理命令”，用于在使用 Git 协议获取数据时执行（如 `command host\
  \ port`），而不是直接与远程服务器建立连接。如果变量值为“COMMAND for DOMAIN”格式，则该命令仅适用于以指定域名字符串结尾的主机。此变量可以设置多次，并按给定顺序进行匹配；第一个匹配获胜。\n\
  \n可以通过环境变量 `GIT_PROXY_COMMAND` 覆盖（其始终全局适用，没有特殊的“for”处理）。\n\n可以使用特殊字符串 `none` 作为代理命令，以指定对特定的域名模式不使用代理。这对于排除防火墙内部服务器使用代理非常有用，同时对外部域名使用通用代理。\n\
  \n# core.ignoreStat\n\n如果为 `true`，Git 将避免使用 `lstat()` 调用来检测文件是否更改，而是通过对那些在索引和工作区中更新完全相同的跟踪文件设置“assume-unchanged”位。当文件在\
  \ Git 外部被修改时，用户需要显式地暂存修改的文件（例如，参见 (1) 中的 *Examples* 部分）。Git 通常不会检测到这些文件的更改。这对于 `lstat()`\
  \ 调用非常慢的系统（如 CIFS/Microsoft Windows）非常有用。\n\n默认认为 `false`。\n\ncore.preferSymlinkRefs\n\
  \n\n\n\n\n对于 `HEAD` 和其他符号引用文件，使用符号链接而不是默认的 \"symref\" 格式。这有时是为了与那些期望 `HEAD` 为符号链接的旧脚本工作。\n\
  \n### `core.bare`\n\n如果为 `true`，则假设此仓库是 `bare`（裸仓库），并且没有与之关联的工作目录。如果是此类情况，许多需要工作目录的命令将被禁用，例如\
  \ `(1)` 或 `(1)`。\n\n此设置在创建仓库时由 `(1)` 或 `(1)` 自动推断。默认情况下，以 `/.git` 结尾的仓库被认为不是裸仓库（`bare\
  \ = false`），而所有其他仓库都被认为是裸仓库（`bare = true`）。\n\n### `core.worktree`\n\n设置工作树根目录的路径。如果设置了\
  \ `GIT_COMMON_DIR` 环境变量，则忽略 `core.worktree` 且不用于确定工作树的根目录。这可以通过 `GIT_WORK_TREE`\
  \ 环境变量和 `--work-tree` 命令行选项覆盖。该值可以是绝对路径，也可以相对于 `.git` 目录的相对路径（该目录由 `--git-dir` 或\
  \ `GIT_DIR` 指定）。如果指定了 `--git-dir` 或 `GIT_DIR` 但未指定 `--work-tree`、`GIT_WORK_TREE`\
  \ 和 `core.worktree`，则当前工作目录被视为工作树的顶层。\n\n请注意，即使在该变量设置在目录的 `.git` 子目录的配置文件中时也会生效，且其值与后一个目录不同（例如，`/path/to/.git/config`\
  \ 中的 `core.worktree` 被设置为 `/different/path`），这很可能是一个配置错误。在 `/path/to` 目录中运行 Git\
  \ 命令仍将使用 `/different/path` 作为工作树的根目录，除非你清楚自己在做什么，否则可能会导致混惑（例如，你正在向不同于仓库通常工作树的位置创建相同索引的只读快照）。\n\
  \n### `core.logAllRefUpdates`\n\n启用引用日志（reflog）。对引用 `<ref>` 的更新将记录到文件 `$GIT_DIR/logs/<ref>`\
  \ 中，通过追加新的和旧 SHA-1、日期/时间以及更新原因，但仅在文件存在时进行。如果将此配置变量设置为 `true`，则会自动为分支头（即 `refs/heads/`\
  \ 下）、远程引用（即 `refs/remotes/` 下）、备注引用（即 `refs/notes/` 下）以及符号引用 `HEAD` 创建缺失的 `$GIT_DIR/logs/<ref>`\
  \ 文件。\n\n此信息可以用于确定“2 天前”分支末端是哪个提交。\n\n在关联了工作目录的仓库中，此值默认认为 `true`；在裸仓库中默认认为 `false`。\n\
  \n### `core.repositoryFormatVersion`\n\n标识仓库格式和布局版本的内部变量。\n\n### `core.sharedRepository`\n\
  \n当为 `group`（或 `true`）时，仓库可以在一个组内的多个用户之间共享（确保所有文件和对象对用户组可写）。当为 `all`（或 `world` 或\
  \ `everybody`）时，仓库除了对组共享外，对所有用户可读。当为 `umask`（或 `false`）时，Git 将使用由 `(2)` 报告的权限。当为\
  \ `0xxx`（其中 `0xxx` 为八进制数），仓库中的文件将具有此模式值。`0xxx` 将覆盖用户的 umask 值（而其他选项只会覆盖用户 umask\
  \ 值的请求部分）。示例：`0660` 将使仓库对所有者和组可读写，但其他人不可（除非 umask 等于 `0022`，则相当于 `group`）。`0640`\
  \ 是一个组可读但组不可写的仓库。参见 `(1)`。默认认为 `false`。\n\n### `core.warnAmbiguousRefs`\n\n如果为 `true`，如果你传递的引用名称具有歧义并可能匹配仓库中的多个引用，Git\
  \ 将向你发出。默认认为 `true`。\n\n### `core.compression`\n\n一个 `-1..9` 的整数，表示默认压缩级别。`-1` 是\
  \ zlib 默认值。0 表示不压缩，`1..9` 是各种速度/大小的权衡，9 最慢。如果设置，它将为其他压缩变量提供默认值，例如 `core.looseCompression`\
  \ 和 `pack.compression`。\n\n### `core.looseCompression`\n\n一个 `-1..9` 的整数，表示未在包文件中对象的压缩级别。`-1`\
  \ 是 zlib 默认值。0 表示不压缩，`1..9` 是各种速度/大小的权衡。如果未设置，默认为 `core.compression`。如果仍未设置，则默认为\
  \ 1（最佳速度）。\n\n### `core.packedGitWindowSize`\n\n单次映射操作中映射到内存的包文件字节数。较大的窗口大小可能允许你的系统更快速地处理较少的大型包文件。较小的窗口大小由于增加了对操作系统内存管理器的调用而对性能产生不利影响，但在访问大量大型包文件时可能会提高性能。\n\
  \n如果在编译时设置了 `NO_MMAP`，默认值为 1 MiB；否则，在 32 位平台上为 32 MiB，在 64 位平台上为 1 GiB。这对于所有用户/操作系统都是合理的。你可能不需要调整此值。\n\
  \n支持单位后缀 `k`、`m` 或 `g`。\n\n### `core.packedGitLimit`\n\n从包文件同时映射到内存的最大字节数。如果 Git\
  \ 需要访问超过此数量的字节来完成操作，它将取消映射现有区域以释放虚拟空间。\n\n在 32 位平台上默认值为 256 MiB，在 64 位平台上默认值为 8\
  \ GiB。这对于所有用户/操作系统都是合理的，最大的项目除外。你可能不需要调整此值。\n\n支持单位后缀 `k`、`m` 或 `g`。\n\n### `core.deltaBaseLimit`\n\
  \n为可能被多个差异对象引用的基对象保留的最大字节数。通过缓存解压后的基对象，Git 能够避免多次解压基对象。\n\n在所有平台上默认值为 96 MiB。这对于所有用户/操作系统都是合理的，最大的项目除外。你可能不需要调整此值。\n\
  \n支持单位后缀 `k`、`m` 或 `g`。\n\n### `core.bigFileThreshold`\n\n大于此大小的文件将进行压缩，但不尝试增量压缩。存储大文件可以避免过度内存使用，但代价是增加磁盘占用。此外，大于此大小的文件始终被视为二进制。\n\
  \n在所有平台上默认值为 512 MiB。对于大多数项目是合理的，因为源代码和其他文本文件仍然可以增量压缩，但较大的二进制文件不会。\n\n支持单位后缀 `k`、`m`\
  \ 或 `g`。\n\n### `core.excludesFile`\n\n除了 `.gitignore`（每目录）和 `.git/info/exclude`\
  \ 外，Git 还会在此文件中查找不跟踪的文件模式。`~/` 扩展为 `$HOME` 的值，`~user/` 扩展为指定用户的家目录。其默认值为 `$XDG_CONFIG_HOME/git/ignore`。如果\
  \ `$XDG_CONFIG_HOME` 未设置或为空，则使用 `$HOME/.config/git/ignore`。参见 `(5)`。\n\n### `core.askPass`\n\
  \n某些交互式询问密码的命令（例如 svn 和 http 接口）可以被告知使用此变量指定的外部程序。可以通过 `GIT_ASKPASS` 环境变量覆盖。如果未设置，则回退到\
  \ `SSH_ASKPASS` 环境变量的值，或者使用简单的密码提示。外部程序将获得一个合适的提示作为命令行参数，并在 STDOUT 上写入密码。\n\n###\
  \ `core.attributesFile`\n\n除了 `.gitattributes`（每目录）和 `.git/info/attributes` 外，Git\
  \ 还会在此文件中查找属性（参见 `(5)`）。路径扩展方式与 `core.excludesFile` 相同。其默认值为 `$XDG_CONFIG_HOME/git/attributes`。如果\
  \ `$XDG_CONFIG_HOME` 未设置或为空，则使用 `$HOME/.config/git/attributes`。\n\ncore.editor\n\
  \n\n\n\n\n如 `commit` 和 `tag` 等允许通过启动编辑器来编辑消息的命令，当此变量被设置且环境变量 `GIT_EDITOR` 未设置时，将使用该变量的值。详见\
  \ (1)。\n\n`core.commentChar`\n\n如 `commit` 和 `tag` 等允许编辑消息的命令，在处理时会将以此字符开头的行视为注释，并在编辑器返回后将其删除（默认值为\
  \ `*#`）。\n\n如果设置为 `\"auto\"`，`git-commit` 将选择一个不起始于现有提交消息中任何一行的首字符的字符。\n\n`core.packedRefsTimeout`\n\
  \n在尝试锁定 `packed-refs` 文件时重试的时间，以毫秒为单位。值 `0` 表示不重试；`-1` 表示无限次尝试。默认值为 `1000`（即重试 1\
  \ 秒）。\n\n`sequence.editor`\n\n`git rebase -i` 用于编辑 rebase 指令文件时所使用的文本编辑器。该值意图在使用时由\
  \ shell 解释。可以通过环境变量 `GIT_SEQUENCE_EDITOR` 进行覆盖。如果未配置，则使用默认的提交消息编辑器。\n\n`core.pager`\n\
  \nGit 命令使用的文本查看器（例如 `less`）。该值意图由 shell 解释。优先级顺序为 `$GIT_PAGER` 环境变量、然后是 `core.pager`\
  \ 配置、然后 `$PAGER`、最后是编译时选择的默认值（通常为 `less`）。\n\n当 `LESS` 环境变量未设置时，Git 会将其设置为 `FRX`（如果已设置\
  \ `LESS` 环境变量，Git 将完全不更改）。如果你想选择性地覆盖 Git 对 `LESS` 的默认设置，可以将 `core.pager` 设置为例如 `less\
  \ -S`。Git 将其传递给 shell，shell 将最终命令翻译为 `LESS=FRX less -S`。环境没有设置 `S` 选项，但命令行设置了，指示\
  \ `less` 裁剪长行。同样，将 `core.pager` 设置为 `less -+F` 将从命令行禁用环境变量指定的 `F` 选项，从而禁用 `less`\
  \ 的“一屏即退出”行为。可以为特定命令专门激活某些标志：例如，将 `pager.blame` 设置为 `less -S` 可仅为 `git blame` 启用行裁剪。\n\
  \n同样，当 `LV` 环境变量未设置时，Git 将其设置为 `-c`。你可以通过导出带有另一个值的 `LV` 或将 `core.pager` 设置为 `lv\
  \ +c` 来覆盖此设置。\n\n`core.whitespace`\n\n一个用逗号分隔的需要注意的常见空格问题列表。git diff` 将使用 `color.diff.whitespace`\
  \ 高亮这些问题，而 `git apply --whitespace=error` 将它们视为错误。你可以以前缀 `-` 来禁用其中任何一个（例如 `-trailing-space`）：\n\
  \n`blank-at-eol` 将行尾的末随空格视为错误（默认启用）。\n\n`space-before-tab` 将行初始缩进部分紧邻制表符之前的空格字符视为错误（默认启用）。\n\
  \n`indent-with-non-tab` 将使用空格字符而非等效 tab 缩进的视为错误（默认禁用）。\n\n`tab-in-indent` 将行初始缩进部分中的\
  \ tab 字符视为错误（默认禁用）。\n\n`blank-at-eof` 将文件末尾添加的空行视为错误（默认启用）。\n\n`trailing-space`\
  \ 是涵盖 `blank-at-eol` 和 `blank-at-eof` 的简写。\n\n`cr-at-eol` 将行尾的回车符视为行终止符的一部分，即：如果该回车符之前的字符不是空格，则\
  \ `trailing-space` 不会触发（默认禁用）。\n\n`tabwidth=<n>` 告诉 tab 占用多少个字符位置；这对于 `indent-with-non-tab`\
  \ 以及 Git 修复 `tab-in-indent` 错误时是相关的。默认 tab 宽度为 `8`。允许的值为 1 到 63。\n\n`core.fsyncObjectFiles`\n\
  \n此布尔值将在写入对象文件时启用 `fsync()`。\n\n对于能够正确排序数据写入的文件系统，这完全是浪费精力和时间，但对于不使用日志的文件系统（传统的\
  \ UNIX 文件系统）或仅记录元数据而非文件内容的系统（OS X 的 HFS+, 或开启了 \"data=writeback\" 的 Linux ext3）可能有用。\n\
  \n`core.preloadIndex`\n\n为 `git diff` 等操作启用并行索引预加载。\n\n这可以加速 `git diff` 和 `git status`\
  \ 等操作，特别是在像 NFS 这样具有弱缓存语义且 IO 延迟相对较高的文件系统上。启用后，Git 将并行执行索引与文件系统数据的比较，允许 IO 堆叠。默认值为\
  \ true。\n\n`core.createObject`\n\n你可以将其设置为 `link`，在这种情况下，将使用硬链接随后删除源文件，以确保对象的创建不会覆盖已存在的对象。\n\
  \n在某些文件系统/操作系统的组合上，这是不可靠的。在此处将此配置设置设置为 `rename`；然而，这将移除确保现有对象不会被覆盖的检查。\n\n`core.notesRef`\n\
  \n在显示提交消息时，同时也显示存储在给定 ref 中的 notes。该 ref 必须是完全限定的。如果给定的 ref 不存在，这不是错误，意味着不应打印 notes。\n\
  \n此设置默认值为 `\"refs/notes/commits\"`，可以通过环境变量 `GIT_NOTES_REF` 进行覆盖。详见 (1)。\n\n`core.sparseCheckout`\n\
  \n启用“稀疏检出”功能。更多信息请参阅 (1)。\n\n`core.abbrev`\n\n设置对象缩写的长度。如果未指定，许多命令将缩写为 7 位十六，这可能不足以保持名称的唯一性。\n\
  \n`add.ignoreErrors`, `add.ignore-errors`（已弃）\n\n告知 `git add` 在某些文件因错误无法添加时继续添加。等于\
  \ (1) 中的 `--ignore-errors` 选项。`add.ignore-errors` 已弃，因为它不符合变量的命名规范。\n\n`alias.*`\n\
  \n(1) 命令的别名。例如定义 `alias.last = cat-file HEAD` 后，调用 `git last` 等于 `cat-file HEAD`。如果别名扩展以叹号开头，则被视为\
  \ shell 命令。例如定义 `alias.new = !gitk --all --not-HEAD`，调用 `git new` 等于执行 shell 命令\
  \ `gitk --all --not-HEAD`。注意 shell 命令将在仓库顶层目录执行，不一定是当前目录。`GIT_PREFIX` 设置为原始目录下运行\
  \ `git-parse --show-prefix` 的返回值。详见 (1)。参数通过空格分割，支持标准的 shell 转义。可以使用引号或反斜杠进行引用。\n\
  \n`am.keepcr`\n\n如果为 true，`git-am` 在处理 mbox 格式的补丁时将带参数 `--keep-cr` 调用 `git-mailsplit`。在这种情况下，git-mailsplit\
  \ 不会从 `\\r\\n` 中移除 `\\r`。可以通过命令行提供 `--no-keep-cr` 来覆盖。详见 (1),(1)。\n\n`apply.ignoreWhitespace`\n\
  \n设置为 `change` 时，告知 `git apply` 忽略空格变化，类似于 `--ignore-space-change` 选项。设置为 no, none,\
  \ never, false 时，`git apply` 将尊重所有空格差异。详见 (1)。\n\n`apply.whitespace`\n\n告知 `git\
  \ apply` 如何处理空格，类似于 `--whitespace` 选项。详见 (1)。\n\n`branch.autoSetupMerge`\n\n告知 `git\
  \ branch` 和 `git checkout` 设置新分支，以便 (1) 能够从起点分支正确合并。注意，即使未设置此选项，也可以通过 --track 和\
  \ --no-track 选项按分支选择此行为。有效设置为：false --- 不进行自动设置；true --- 当起点是远程跟踪分支时进行自动设置；always\
  \ --- 当起点是本地分支或远程跟踪分支时均进行自动设置。此选项默认值为 true。\n\n\n\n\n\n### branch.autoSetupRebase\n\
  \n当使用 `git branch` 或 `git checkout` 创建一个追踪另一个分支的新分支时，此变量告诉 Git 设置 pull 为 rebase\
  \ 模式而非 merge 模式（参见 \"branch.<name>.rebase\"）。设置为 `never` 时，rebase 永远不会自动设置为 true。设置为\
  \ `local` 时，对于其他本地分支的跟踪分支，rebase 为 true。设置为 `remote` 时，对于远程追踪分支的跟踪分支，rebase 为 true。设置为\
  \ `always` 时，所有跟踪分支的 rebase 都设置为 true。关于如何设置分支以跟踪另一个分支的详情，请参见 \"branch.autoSetupMerge\"\
  。此选项默认值为 `never`。\n\n### branch.<name>.remote\n\n在分支 `<name>` 上时，它告诉 `git fetch`\
  \ 和 `git push` 从哪个远程获取内容/推送到哪个远程。推送的远程可以通过 `remote.pushDefault`（针对所有分支）覆盖。当前分支的推送远程可以被\
  \ `branch.<name>.pushRemote` 进一步覆盖。如果没有配置远程仓库，或者你不在任何分支上，则获取默认为 `origin`，推送默认为 `remote.pushDefault`。此外，`.`（点）表示当前本地仓库（点仓库），请参见下文\
  \ `branch.<name>.merge` 的最后说明。\n\n### branch.<name>.pushRemote\n\n在分支 `<name>` 上时，它会覆盖推送时的\
  \ `branch.<name>.remote`。它还会覆盖从分支 `<name>` 推送 `remote.pushDefault`。当你从一个地方（例如你的上游）\
  \ pull 并送到另一个地方（例如你自己的发布仓库）时，你可能希望设置 `remote.pushDefault` 指定所有分支的推送远程，并使用此选项覆盖特定分支。\n\
  \n### branch.<name>.merge\n\n与 `branch.<name>.remote` 共同定义给定分支的上游分支。它告诉 `git fetch`/`git\
  \ pull`/*`git rebase` 要合并哪个分支，并可能影响 `git push`（参见 push.default）。在分支 `<name>` 中时，它告诉\
  \ `git fetch` 默认的 refspec 将在 `FETCH_HEAD` 中标记为合并。该值的处理方式类似于 refspec 的远程部分，并且必须与从\
  \ \"branch.<name>.remote\" 指定的远程获取的 ref 匹配。合并信息供 `git pull`（它首先调用 `git fetch`）查找用于合并的默认分支。如果没有此选项，`git\
  \ pull` 默认合并第一个获取的 refspec。指定多个值可以实现章鱼合并（octopus merge）。如果你希望设置 `git pull` 使从本地仓库中的另一个分支合并到\
  \ `<name>`，你可以将 `branch.<name>.merge` 指向目标分支，并使用相对路径设置 `branch.<name>.remote` 为点。\n\
  \n### branch.<name>.mergeOptions\n\n设置合并到分支 `<name>` 的默认选项。语法和支持的选项与 (1) 相同，但目前不支持包含空白字符的选项值。\n\
  \n### branch.<name>.rebase\n\n设置为 `true` 时，在运行 \"git pull\" 时，将分支 `<name>` rebase\
  \ 在已获取的分支之上，而不是合并默认远程的默认分支。参见 \"pull.rebase\" 以以非特定特定分支的方式进行此操作。\n\n设置为 `preserve`\
  \ 时，会将 `--preserve-merges` 传递给 'git rebase'，使得本地提交的合并提交不会在运行 'git pull' 时被扁平化。\n\
  \n**注意**：这是一个可能危险的操作；除非你理解其影响，否则**不要**使用它（详情参见 (1)）。\n\n### branch.<name>.description\n\
  \n分支描述，可以使用 `git branch --edit-description` 进行编辑。分支描述会自动添加到 format-patch 封页或 request-pull\
  \ 摘要中。\n\n### browser.<tool>.cmd\n\n指定调用指定浏览器的命令。指定的将在 shell 中评估，并将 URL 作为参数传递。（参见\
  \ (1)。）\n\n### browser.<tool>.path\n\n覆盖给定工具的路径，该路径可能用于浏览 HTML 帮助（参见 (1) 中的 *-w*\
  \ 选项）或 gitweb 中的工作仓库（参见 (1)）。\n\n### clean.requireForce\n\n布尔值，除非给出 `-f`、`-i` 或\
  \ `-n`，否则 `git-clean` 什么都不做。默认值为 `true`。\n\n### color.branch\n\n布尔值，用于启用/禁用 (1)\
  \ 输出中的颜色。可以设置为 `always`、`false`（或 `never`）或 `auto`（或 `true`），在这种情况下，只有输出到终端时才会使用颜色。默认值为\
  \ `false`。\n\n### color.branch.<slot>\n\n使用自定义颜色进行分支着色。`<slot>` 是当前（`current` 当前分支）、`local`（本地分支）、`remote`（refs/remotes/\
  \ 中的远程追踪分支）、`upstream`（上游跟踪分支）、`plain`（其他 ref）之一。\n\n### color.diff\n\n是否使用 ANSI\
  \ 转义序列为补丁添加颜色。如果设置为 `always`，(1)、(1) 和 (1) 将为所有补丁使用颜色。如果设置为 `true` 或 `auto`，这些命令仅在输出到终端时才使用颜色。默认值为\
  \ `false`。\n\n这不影响 (1) 或 `git-diff-` 管道命令。可以通过命令行上的 `--color[=<when]` 选项进行覆盖。\n\n\
  ### color.diff.<slot>\n\n使用自定义颜色进行差异着色。`<slot>` 指定补丁的哪个部分使用指定的颜色，它是以下之一：`context`（上下文文本\
  \ - `plain` 是其历史同义词）、`meta`（元数据）、`frag`（块头）、`func`（块头中的函数）、`old`（删除的行）、`new`（添加的行）、`commit`（提交头）或\
  \ `whitespace`（空白字符高亮）。\n\n### color.decorate.<slot>\n\n为 `git log --decorate` 输出使用自定义颜色。`<slot>`\
  \ 分别为 `branch`、`remoteBranch`、`tag`、`stash` 对应本地分支、标签和 HEAD。\n\n### color.grep\n\
  \n设置为 `always` 时，始终高亮匹配项。设置为 `false`（或 `never`）时，永不。设置为 `true` 或 `auto` 时，仅在输出到终端时使用颜色。默认值为\
  \ `false`。\n\n### color.grep.<slot>\n\n使用自定义颜色进行 grep 着色。`<slot>` 指定行的哪个部分使用指定的颜色，它是以下之一：`context`（使用\
  \ -A、-B 或 -C 时的上下文文本）、`filename`（使用 -h 时的文件名头部）、`function`（使用 -p 时的函数名）、`number`（使用\
  \ -n 时的行号头部）、`match`（同于 matchContext 和 matchSelected）、`matchContext`（上下文中的匹配文本）、`matchSelected`（选中行中的匹配文本）、`selected`（选中行中的非匹配文本）、`separator`（行字段间的分隔符（:）以及块间的分隔符（--））。\n\
  \n### color.interactive\n\n设置为 `always` 时，对交互式提示和显示（如 \"git-add-interactive\" 和\
  \ \"git-clean-interactive\" 使用的）使用颜色。设置为 `false`（或 `never`）时，永不。设置为 `true` 或 `auto`\
  \ 时，仅在输出到终端时使用颜色。默认值为 `false`。\n\n### color.interactive.<slot>\n\n为 `git add --interactive`\
  \ 和 `git clean --interactive` 输出使用自定义颜色。`<slot>` 对于交互式命令中四种不同类型的正常输出，其为 prompt、header、help\
  \ 或 error。\n\n### color.pager\n\n布尔值，在使用分页器时启用/禁用彩色输出（默认 true `true`）。\n\n### color.showBranch\n\
  \n布尔值，用于启用/禁用 (1) 输出中的颜色。可以设置为 `always`、`false`（或 `never`）或 `auto`（或 `true`），在这种情况下，只有输出到终端时才会使用颜色。默认值为\
  \ `false`。\n\n### color.status\n\n布尔值，用于启用/禁用 (1) 输出中的颜色。可以设置为 `always`、`false`（或\
  \ `never`）或 `auto`（或 `true`），在这种情况下，只有输出到终端时才会使用颜色。默认值为 `false`。\n\n### color.status.<slot>\n\
  \n使用自定义颜色进行状态着色。`<slot>` 是以下之一：`header`（状态消息的头部）、`added or updated`（已添加但未提交的文件）、`changed`（已更改但未添加到索引的文件）、`untracked`（未被\
  \ Git 跟踪的文件）、`branch`（当前分支）、`nobranch`（显示无分支警告的颜色，默认红色）或 `unmerged`（具有未合并的文件）。\n\
  \n### color.ui\n\n\n\n\n\n此变量决定了 `color.diff` 和 `color.grep` 等变量的默认值，这些变量控制每个命令族颜色的使用。随着更多命令学习设置\
  \ `--color` 选项的默认值，其作用范围将会扩大。如果你希望 Git 命令除非显式通过其他配置或 `--color` 选项启用，否则不使用颜色，请将其设置为\
  \ `false` 或 `never`。如果你希望所有非机器读取的输出都使用颜色，请将其设置为 `always`；如果你希望此类输出在写入终端时使用颜色，请设置为\
  \ `true` 或 `auto`（这是 Git 1.8.4 之后的默认值）。\n\n### column.ui\n\n指定支持的命令是否以列的形式输出。该变量由由空格或逗号分隔的标记列表组成：\n\
  \n这些选项控制何时启用该功能（默认为 `never`）：\n\n- `always`: 始终列出显示\n- `never`: 始终不列出显示\n- `auto`:\
  \ 如果输出到终端，则列出显示\n\n这些选项控制布局（默认为 `column`）。如果未指定 `always`、`never` 或 `auto` 中的任何一个，设置其中任何一个都意味着\
  \ `always`：\n\n- `column`: 先填充列再填充行\n- `row`: 先填充行再填充列\n- `plain`: 以单列形式显示\n\n最后，这些选项可以与布局选项（默认为\
  \ `nodense`）结合：\n\n- `dense`: 创建不等宽的列以利用更多空间\n- `nodense`: 创建等宽的列\n\n### column.branch\n\
  \n指定 `git branch` 中是否以列的形式输出分支列表。详情请见 `column.ui`。\n\n### column.clean\n\n指定 `git\
  \ clean -i` 中列表项的布局，该命令始终以列的形式显示文件和目录。详情请见 `column.ui`。\n\n### column.status\n\n\
  指定 `git status` 中是否以列的形式输出未跟踪的文件。详情请见 `column.ui`。\n\n### column.tag\n\n指定 `git\
  \ tag` 中是否以列的形式输出标签列表。详情请见 `column.ui`。\n\n### commit.cleanup\n\n此设置覆盖了 `git commit`\
  \ 中 `--cleanup` 选项的默认值。详情请见 (1)。当你始终希望在日志消息中保留以注释字符 `#` 开头的行时，更改默认值非常有用，在这种情况下你会执行\
  \ `git config commit.cleanup whitespace`（注意，如果你这样做，将必须手动删除提交日志模板中以 `#` 开头的帮助行）。\n\
  \n### commit.gpgSign\n\n布尔值，指定是否对所有提交进行 GPG 签名。在执行 rebase 等操作时使用此选项可能会导致大量提交被签名。使用代理可以避免多次输入\
  \ GPG 口令。\n\n### commit.status\n\n布尔值，用于在使用编辑器准备提交消息时，是否在提交消息模板中启用/禁用包含状态信息。默认为\
  \ `true`。\n\n### commit.template\n\n指定一个文件作为新提交消息的模板。`~/` 会被扩展为 `$HOME` 的值，`~user/`\
  \ 会扩展为指定用户的家目录。\n\n### credential.helper\n\n指定在需要用户名或密码凭据时调用的外部助手程序；助手程序可以查询外部存储以避免提示用户输入凭据。详情请见\
  \ (7)。\n\n### credential.useHttpPath\n\n在获取凭据时，认为 `http` 或 `https` URL 的“路径”部分是重要的。默认为\
  \ `false`。更多信息请见 (7)。\n\n### credential.username\n\n如果为网络认证没有设置用户名，则默认使用此用户名。见下文\
  \ `credential.<context>.*` 和 (7)。\n\n### credential.<url>.*\n\n上述任何 `credential.*`\
  \ 选项都可以选择性地应用到某些凭据。例如，`\"credential.\"` 将仅为到 example.com 的 https 连接设置默认用户名。关于 URL\
  \ 如何匹配的详情请见 (7)。\n\n### diff.autoRefreshIndex\n\n在使用 `git diff` 与工作树文件进行比较时，不要将仅有状态（stat-only）的更改视为已更改。相反，静默运行\
  \ `git update-index --refresh` 以更新工作树中内容与索引内容匹配的路径的缓存信息。此选项默认为 `true`。注意，这只影响 `git\
  \ diff` 的 Porcelain 命令，而不影响更底层的 `diff` 命令（如 `git diff-files`）。\n\n### diff.dirstat\n\
  \n一个逗号分隔的 `--dirstat` 参数列表，用于指定 `--dirstat` 选项的默认行为为 (1) 等。默认值可以在命令行上覆盖（使用 `--dirstat=<param1,param2,...>`）。回退默认值（当未被\
  \ `diff.dirstat` 更改时）为 `changes,noncumulative,3\\.`。可用参数如下：\n\n- `changes`: 通过计算从源删除或向向目标添加的行数来计算\
  \ dirstat 数字。这忽略了文件内部纯代码的移动量。换句话说，在文件中重新排列行不会像其他更改那样被计算。这是未提供参数时的默认行为。\n- `lines`:\
  \ 通过进行常规基于行的 diff 分析并累加删除/添加的行数来计算 dirstat 数字。（对于二进制文件，改为计算 64 字节块，因为二进制文件没有自然的行概念）。这是比\
  \ `changes` 行为更消耗性能的 `--dirstat` 行为，但它会将文件内重新排列的行视为与其他更改相同。生成的输出与你从其他 `--*stat`\
  \ 选项获得的结果一致。\n- `files`: 通过计算更改的文件数来计算 dirstat 数字。每个更改的文件在 dirstat 分析中权重相等。这是计算开销最低的\
  \ `--dirstat` 行为，因为它不需要查看文件内容。\n- `cumulative`: 也会计算父目录中子目录的更改。注意，使用 `cumulative`\
  \ 时，报告的百分比总和可能会超过 100%。可以通过 `noncumulative` 参数指定默认行为。\n- `<limit>`: 整数参数指定阈值百分比（默认为\
  \ 3%）。贡献小于此百分比的目录不会显示。示例：以下将统计文件，同时忽略占比小于 10% 的目录：`files,10,cumulative`。\n\n###\
  \ diff.statGraphWidth\n\n限制 --stat 输出中图形部分的宽度。如果设置，适用于除 format-patch 外的所有命令。\n\n\
  ### diff.context\n\n生成具有 `<n>` 行上下文的 diff，而不是默认的 3。此值由 `-U` 选项覆盖。\n\n### diff.external\n\
  \n设置了此配置，则不使用内部机制生成 diff，而是使用给定的命令。可以通过环境变量 `GIT_EXTERNAL_DIFF` 覆盖。该命令按照 (1) 中“git\
  \ Diffs”部分描述的参数调用。注意：如果你只想对部分文件使用外部 diff 程序，你可能需要使用 (5)。\n\n### diff.ignoreSubmodules\n\
  \n设置 `--ignore-submodules` 的默认值。注意，这只影响 `git diff 的 Porcelain 命令，而不影响更底层的 `diff`\
  \ 命令（如 `git diff-files`）。`git checkout` 在报告未提交更改时也遵循此设置。将其设置为 `all` 会禁用 `status.submoduleSummary`\
  \ 设置时 `git commit` 和 `git status` 通常显示的子模块摘要，除非使用 `--ignore-submodules` 命令行覆盖。`git\
  \ submodule` 命令不受此设置影响。\n\n### diff.mnemonicPrefix\n\n如果设置，`git diff` 将根据比较的内容使用与标准\
  \ \"a/\" 和 \"b/\"不同的前缀对。当此配置生效时，反向 diff 输出也会交换前缀顺序：\n\n```\ngit diff\n比较索引和工作树；\n\
  git diff HEAD\n比较提交和工作树；\ngit diff --cached\n比较提交和索引；\ngit diff HEAD:file1 file2\n\
  比较对象和工作树实体；\ngit diff --no-index a b\n比较两个非 git 对象 (1) 和 (2)。\n```\n\ndiff.noprefix\n\
  \n\n\n\n\n如果设置，`git diff` 将不显示任何源或目标前缀。\n\n`diff.orderFile`\n指示在 diff 中对文件进行排序的文件，每行使用一个\
  \ shell glob 通配符。可以通过 `-O` 选项被 (1) 覆盖。\n\n`diff.renameLimit`\n在执行复制/重命名检测时考虑的文件数量；等同于\
  \ `git diff` 选项 `-l`。\n\n`diff.renames`\n告诉 Git 检测重命名。如果设置为任何布尔值，它将启用基础重命名检测。如果设置为\
  \ \"copies\" 或 \"copy\"，则也会检测复制。\n\n`diff.suppressBlankEmpty`\n一个布尔值，用于抑制在每个空输出行之前打印空格的标准行为。默认值为\
  \ false。\n\n`diff.submodule`\n指定子模块差异的显示格式。\"log\" 格式列出范围内的提交，就像 (1) 中的 `summary`\
  \ 一样。\"short\" 格式仅显示范围开头和结尾的提交名称。默认值为 short。\n\n`diff.wordRegex`\n一个 POSIX 扩展正则表达式，用于在执行逐词差异计算时确定什么是“单词”。匹配正则表达式的字符序列为“单词”，所有其他字符均为可忽略的空白。\n\
  \n`diff.<driver>.command`\n自定义 diff 驱动器命令。详见 (5)。\n\n`diff.<driver>.xfuncname`\n\
  diff 驱动器用于识别块头（hunk header）的正则表达式。也可以使用内置模式。详见 (5)。\n\n`diff.<driver>.binary`\n\
  将此选项设置为 true，可使 diff 驱动器将文件视为二进制文件。详见 (5)。\n\n`diff.<driver>.textconv`\ndiff 驱动器调用的命令，用于生成文件的文本转换版本。转换结果用于生成人类可读的\
  \ diff。详见 (5)。\n\n`diff.<driver>.wordRegex`\ndiff 驱动器用于拆分行内单词的正则表达式。详见 (5)。\n\n\
  `diff.<driver>.cachetextconv`\n将此选项设置为 true，可让 diff 驱动器缓存文本转换输出。详见 (5)。\n\n`diff.tool`\n\
  控制 (1) 使用哪种 diff 工具。此变量会覆盖 `merge.tool` 中配置的值。下方列表显示了有效的内置值。\n\n- `araxis`\n- `bc`\n\
  - `bc3`\n- `codecompare`\n- `deltawalker`\n- `diffmerge`\n- `diffuse`\n- `ecmerge`\n\
  - `emerge`\n- `gvimdiff`\n- `gvimdiff2`\n- `gvimdiff3`\n- `kdiff3`\n- `kompare`\n\
  - `meld`\n- `opendiff`\n- `p4merge`\n- `tkdiff`\n- `vimdiff`\n- `vimdiff2`\n- `vimdiff3`\n\
  - `winmerge`\n- `xxdiff`\n\n`diff.algorithm`\n选择 diff 算法。变体如下：\n\n- `default, myers`:\
  \ 基础贪心 diff 算法。目前是默认值。\n- `minimal`: 花费额外时间确保产生尽可能小的 diff。\n- `patience`: 在生成补丁时使用\
  \ \"patience diff\"算法。\n- `histogram`: 该算法扩展了 patience 算法以“支持低频共同元素”。\n\n`difftool.<tool>.path`\n\
  覆盖给定工具的路径。当你的工具不在 `PATH` 中时非常有用。\n\n`difftool.<tool>.cmd`\n指定调用指定 diff 工具的命令。指定的命令在\
  \ shell 中求值，以下变量可用：`LOCAL` 设置为包含 diff 预镜像（pre-image）内容的临时文件名，`REMOTE` 设置为包含 diff\
  \ 后镜像（post-image）内容的临时文件名。\n\n`difftool.prompt`\n在每次调用 diff 工具之前进行提示。\n\n`fetch.recurseSubmodules`\n\
  此选项可以设置为布尔值或 `on-demand`（按需）。设置为布尔值会改变 `fetch` 和 `pull` 的行为：设置为 true 时无条件递归进入子模块，设置为\
  \ false 时完全不递归。当设置为 `on-demand`（默认值）时，`fetch` 和 `pull` 仅当父项目获取了更新子模块引用的提交时，才会递归进入已填充的子模块。\n\
  \n`fetch.fsckObjects`\n如果设置为 true，`git-fetch-pack` 将检查所有获取的对象。如果遇到格式错误的对象或损坏的链接，将中止。中止的结果仅产生悬空对象。默认值为\
  \ false。如果未设置，则使用 `transfer.fsckObjects` 的值。\n\n`fetch.unpackLimit`\n如果通过 Git 原生传输获取的对象数量低于此限制，则对象将解压为松散对象文件。然而，如果接收的对象数量等于或超过此限制，则收到的\
  \ pack 将以 pack 形式存储，并添加任何缺失的 delta 基础。存储 push 的 pack 可以让操作更快完成，特别是在慢文件系统上。如果未设置，则使用\
  \ `transfer.unpackLimit` 的值。\n\n`fetch.prune`\n如果为 true，`fetch` 的行为将等同于命令行上提供了 `--prune`\
  \ 选项。另参见 `remote.<name>.prune`。\n\n`format.attach`\n在 `format-patch` 中默认启用多部分附件。该值也可以是一个双引号字符串，将作为边界。详见\
  \ (1) 中的 选项。\n\n`format.numbered`\n一个布尔值，用于启用或禁用补丁主题中的编号。默认值为 \"auto\"，即在存在多个补丁时启用。通过设置为\
  \ \"true\" 或 \"false\" 可全局控制。详见 (1)。\n\n`format.headers`\n包含在补丁中的额外邮件头。\n\n`format.to,\
  \ format.cc`\n包含在补丁中的额外收件人。详见 (1)。\n\n`format.subjectPrefix`\n`format-patch` 默认输出带有\
  \ `[PATCH]` 前缀的文件。使用此变量更改前缀。\n\n`format.signature`\n`format-patch` 默认输出包含 Git 签名。使用此变量更改。将此变量设置为空字符串\
  \ (`\"\"`) 以抑制签名生成。\n\n`format.signatureFile`\n功能类似于 `format.signature`，但使用该变量指定的文件内容的签名。\n\
  \n`format.suffix`\n`format-patch` 默认输出后缀为 `.patch` 的文件。使用此变量更改后缀（确保包含点）。\n\n`format.pretty`\n\
  `log/show/changed` 命令的默认格式化格式，见 (1)。\n\n`format.thread`\n`format-patch` 的默认线程样式。可以是布尔值、shallow\
  \ 或 deep。shallow 线程让每封邮件回复序列头部，头部从封面信、`--reply-to` 和第一个补丁邮件中选择。deep 线程让每封邮件回复前一个。布尔值\
  \ true 等同于 shallow，false 则禁用线程。\n\n`format.signOff`\n一个布尔值，允许默认启用 `format-patch`\
  \ 的 `-s/--signoff` 选项。**注意：** 在补丁中添加 Signed-off-by: 行是有意识的行为，意味着你证明权利以相同的开源许可提交此工作。详情请参见\
  \ *SubmittingPatches* 文档。\n\n`format.coverLetter`\n控制在调用 `format-patch` 时是否生成封面信的布尔值，此外还可以设置为\
  \ \"auto\"，即仅在存在多个补丁时生成。\n\n`filter.<driver>.clean`\n在提交（checkin）时将工作区文件内容转换为 blob\
  \ 的命令。详见 (5)。\n\n`filter.<driver>.smudge`\n在检出（checkout）时将 blob 对象内容转换为工作区文件的命令。详见\
  \ (5)。\n\n\n\n\n\n当仓库中的松散对象大约超过此数量时，`git gc --auto` 将将它们打包。某些 Porcelain 命令（用户界面命令）会定期调用此命令执行轻量级垃圾回收。默认值为\
  \ `6700`。将其设置为 `0` 可禁用此项功能。\n\n`gc.autoPackLimit`\n\n当仓库中未被 `.keep` 文件标记的包数量超过此值时，`git\
  \ gc --auto` 将将它们合并为一个更大的包。默认值为 `50`。将其设置为 `0` 可禁用此项功能。\n\n`gc.autoDetach`\n\n如果系统支持，则让\
  \ `git gc --auto` 立即返回并在后台运行。默认值为 `true`。\n\n`gc.packRefs`\n\n在仓库中运行 `git pack-refs`\
  \ 会导致其无法被 `1.5.1.2` 之前的 Git 版本通过 `HTTP` 等哑（传输协议进行克隆。此变量决定了 `git gc` 是否运行 `git pack-refs`。可以将其设置为\
  \ `notbare` 以在所有非裸仓库中启用它，也可以设置为一个布尔值。默认值为 `true`。\n\n`gc.pruneExpire`\n\n当运行 `git\
  \ gc` 时，它将调用 `prune --expire 2.weeks.ago`。通过此配置变量覆盖宽限期。可以使用值 `\"now\"` 来禁用此宽限期并始终立即清理不可达的对象。\n\
  \n`gc.pruneWorktreesExpire`\n\n当运行 `git gc` 时，它将调用 `prune --worktrees --expire 3.months.ago`。通过此配置变量覆盖宽限期。可以使用值\
  \ `\"now\"` 来禁用此宽限期并立即清理 `$GIT_DIR/worktrees`。\n\n`gc.reflogExpire`, `gc.<pattern>.reflogExpire`\n\
  \n`git reflog expire` 会移除早于此时间的 reflog 条目；默认值为 `90` 天。如果中间带有 `<pattern>`（例如 `\"\
  refs/stash\"`），则该设置仅适用于匹配 `<pattern>` 的引用引用。\n\n`gc.reflogExpireUnreachable`, `gc.<ref>.reflogExpireUnreachable`\n\
  \n`git reflog expire` 会移除早于此时间且从当前提交末端不可达的 reflog 条目；默认值为 `30` 天。如果中间带有 `<pattern>`（例如\
  \ `\"refs/stash\"`），则该设置仅适用于匹配 `<pattern>` 的引用引用。\n\n`gc.rerereResolved`\n\n当运行\
  \ `git rerere gc` 时，你之前解决的冲突合并记录将保留此时长。默认值为 `60` 天。\n\n`gc.rerereUnresolved`\n\n\
  当运行 `git rerere gc` 时，你尚未解决的冲突合并记录将保留此时长。默认值为 `15` 天。\n\n`gitcvs.commitMsgAnnotation`\n\
  \n将此字符串附加到每个提交消息。设置为空字符串以禁用此功能。默认值为 `\"via git-CVS emulator\"`。\n\n`gitcvs.enabled`\n\
  \n是否为该仓库启用了 CVS 服务器接口。\n\n`gitcvs.logFile`\n\nCVS 服务器接口日志文件路径，该文件会……记录各种内容。\n\n\
  `gitcvs.usecrlfattr`\n\n如果为 `true`，服务器将查找文件的换行符转换属性以确定要使用的 `*k` 模式。如果属性强制 Git 将文件视为文本，则\
  \ `*k` 模式将留空，以便 CVS 客户端将其视为文本。如果它们禁用了文本转换，则文件将设置为 `*kb` 模式，这将抑制客户端可能执行的任何换行符处理。如果属性无法确定文件类型，则使用\
  \ `gitcvs.allBinary`。\n\n`gitcvs.allBinary`\n\n当 `gitcvs.usecrlfattr` 无法解析出正确的 `*kb`\
  \ 模式时将使用此项。如果为 `true`，所有未解析的文件将以 `*kb` 模式发送给客户端。这会导致客户端将其视为二进制文件，从而抑制其可能执行的任何换行符处理。或者，如果设置为\
  \ `\"guess\"`，则将检查文件内容以判断其是否为二进制文件，类似于 `core.autocrlf`。\n\n`gitcvs.dbName`\n\n`git-cvsserver`\
  \ 用于缓存从 Git 仓库派生的修订信息的数据库。具体含义取决于所使用的数据库驱动程序，对于 `SQLite`（默认驱动程序），这是一个文件名。支持变量替换。可能不包含分号（`;`）。默认值：`\"\
  %Ggitcvs.%m.sqlite\"`。\n\n`gitcvs.dbDriver`\n\n使用的 Perl DBI 驱动。你可以在此处指定任何可用的驱动，但它可能不起。`git-cvsserver`\
  \ 已通过 `DBD::SQLite` 进行测试，据报告支持 `DBD::Pg`，且据报告**不支持** `DBD::mysql`。实验性功能。可能不包含双冒号（`:`）。默认值：`SQLite`。\n\
  \n`gitcvs.dbUser`, `gitcvs.dbPass`\n\n数据库用户和密码。仅在设置了 `gitcvs.dbDriver` 时有用，因为 `SQLite`\
  \ 没有数据库用户和/或密码的概念。`gitcvs.dbUser` 支持变量替换。\n\n`gitcvs.dbTableNamePrefix`\n\n数据库表名前缀。附加在任何使用的数据库表名之前，允许单个数据库用于多个仓库。支持变量替换。任何非字母字符将被替换为下划线。\n\
  \n所有 `gitcvs` 变量除 `gitcvs.usecrlfattr` 和 `gitcvs.allBinary` 外，也可以指定为 `gitcvs.<access_method>.<varname>`（其中\
  \ `access_method` 为 `\"ext\"` 之一）。\n\n\n\n\n\n指定 `git gui blame` 原始位置检测中使用的阈值，以字母和数字字符计数。有关复制检测的更多信息，请参阅\
  \ (1) 手册。\n\n`gui.blamehistoryctx`\n当从 `git gui blame` 中调用“显示历史上下文”菜单项时，指定在 (1)\
  \ 中显示的对应提交的历史上下文半径（以天为单位）。如果此变量设置为零，则显示整个历史。\n\n`guitool.<name>.cmd`\n指定当调用 (1)\
  \ 工具菜单中的对应项时要执行的 shell 命令行。此选项对于每个工具都是必选的。该命令从工作目录的根目录执行，并在环境中，它将接收工具名称作为 `GIT_GUITOOL`，当前选定文件的名称作为\
  \ `FILENAME`，以及当前分支名称作为 `CUR_BRANCH`（如果处于分离头指针状态，则 `CUR_BRANCH` 为空）。\n\n`guitool.<name>.needsFile`\n\
  仅当在 GUI 中选择了差异（diff）时才运行该工具。这保证了 `FILENAME` 不为空。\n\n`guitool.<name>.noConsole`\n\
  静默运行命令，不创建显示其输出的窗口。\n\n`guitool.<name>.noRescan`\n在工具执行完成后，不要重新扫描工作目录的变化。\n\n`guitool.<name>.confirm`\n\
  在实际运行工具之前显示确认对话框。\n\n`guitool.<name>.argPrompt`\n向用户请求一个字符串参数，并通过 `ARGS` 环境变量将其传递给工具。由于请求参数意味着确认，因此如果启用了此项，`confirm`\
  \ 选项将无效。如果该选项设置为 `true`、`yes` 或 `1`，则对话框将使用内置的通用提示；否则使用变量的精确值。\n\n`guitool.<name>.revPrompt`\n\
  向用户请求一个有效的修订版本（revision），并设置 `REVISION` 环境变量。在其他方面，此选项与 `argPrompt` 类似，并可以与其一起使用。\n\
  \n`guitool.<name>.revUnmerged`\n在 `revPrompt` 子对话框中仅显示未合并的分支。这对于类似于合并（merge）或变基（rebase）的工具有用，但不适用于切换（checkout）或重置（reset）等操作。\n\
  \n`guitool.<name>.title`\n指定用于提示对话框的标题。默认值是工具名称。\n\n`guitool.<name>.prompt`\n指定显示在对话框顶部的通用提示字符串，位于\
  \ `argPrompt` 和 `revPrompt` 子部分之前。默认值包含实际命令。\n\n`help.browser`\n指定用于以 `web` 格式显示帮助的浏览器。请参阅\
  \ (1)。\n\n`help.format`\n覆盖 (1) 使用的默认帮助格式。支持 `man`、`info`、`web` 和 `html` 值。默认为 `man`。`web`\
  \ 和 `html` 相同。\n\n`help.autoCorrect`\n在等待指定的十分分之一秒（0.1 秒）后，自动纠正并执行输入错误的命令。如果从输入的文本中可以推断出多条命令，则不执行任何操作。如果此选项的值为负数，将立即执行纠正后的命令。如果值为\
  \ 0，则将显示命令但不执行。这是默认值。\n\n`help.htmlPath`\n指定 HTML 文档所在的路径。支持文件系统路径和 URL。当在以 `web`\
  \ 格式显示帮助时，HTML 页面将以前该路径开头。默认认为你的 Git 安装的文档路径。\n\n`http.proxy`\n覆盖 HTTP 代理，通常使用 `http_proxy`、`https_proxy`\
  \ 和 `all_proxy` 环境变量配置（参见 (1)）。可以按远程进行覆盖；参见 `remote.<name>.proxy`。\n\n`http.cookieFile`\n\
  包含之前存储的 cookie 行的文件，如果它们与服务器匹配，则应在 Git http 会话中使用。读取 cookie 的文件格式应该是纯 HTTP 头部或 Netscape/Mozilla\
  \ cookie 文件格式（参见 (1)）。**注意**，除非设置了 `http.saveCookies`，否则通过 `http.cookieFile` 指定的文件仅作为输入使用。\n\
  \n`http.saveCookies`\n如果设置，将请求期间收到的 cookie 存储在 `http.cookieFile` 指定的文件中。如果未设置 `http.cookieFile`，则无效。\n\
  \n`http.sslCipherList`\n在协商 SSL 连接时使用的 SSL 加密套列表。可用的加密套取决于 libcurl 是基于 NSS 还是 OpenSSL\
  \ 编译的，以及所使用的加密库的特定配置。在内部，这设置了 `CURLOPT_SSL_CIPHER_LIST` 选项；有关此列表格式的更多信息请参见 libcurl\
  \ 文档。\n可以通过 `GIT_SSL_CIPHER_LIST` 环境变量覆盖。要强制 git 使用 libcurl 的默认加密套列表并忽略任何显式的 `http.sslCipherList`\
  \ 选项，将 `GIT_SSL_CIPHER_LIST` 设置为空字符串。\n\n`http.sslVerify`\n在通过 HTTPS 获取或推送时，是否验证\
  \ SSL 证书。可以通过 `GIT_SSL_NO_VERIFY` 环境变量覆盖。\n\n`http.sslCert`\n在通过 HTTPS 获取或推送时，包含\
  \ SSL 证书的文件。可以通过 `GIT_SSL_CERT` 环境变量覆盖。\n\n`http.sslKey`\n在通过 HTTPS 获取或推送时，包含 SSL\
  \ 私钥的文件。可以通过 `GIT_SSL_KEY` 环境变量覆盖。\n\n`http.sslCertPasswordProtected`\n启用 Git 对\
  \ SSL 证书的密码提示。否则，如果证书或私钥已加密，OpenSSL 将多次提示用户。可以通过 `GIT_SSL_CERT_PASSWORD_PROTECTED`\
  \ 环境变量覆盖。\n\n`http.sslCAInfo`\n在通过 HTTPS 或推送时，用于验证对方证书的文件。可以通过 `GIT_SSL_CAINFO`\
  \ 环境变量覆盖。\n\n`http.sslCAPath`\n在通过 HTTPS 获取或推送时，包含 CA 证书文件的路径。可以通过 `GIT_SSL_CAPATH`\
  \ 环境变量覆盖。\n\n`http.sslTry`\n通过常规 FTP 协议连接时尝试使用 SSL/TLS 和加密。如果 FTP 服务器出于安全原因需要，或者你希望安全连接，则可能需要。默认认为\
  \ false，因为可能会在配置错误的服务器上触发证书错误。\n\n`http.maxRequests`\n并行启动的 HTTP 请求数。可以通过 `GIT_HTTP_MAX_REQUESTS`\
  \ 环境变量覆盖。默认 5。\n\n`http.minSessions`\n跨请求保留的 curl 会话数（跨槽）。在调用 `http_cleanup()` 之前不会通过\
  \ `curl_easy_cleanup()` 结束。如果没有 `USE_CURL_MULTI`，此值将被限制为 1。默认值为 1。\n\n`http.postBuffer`\n\
  智能传输在推送数据到远程系统时使用的缓冲区最大字节。对于大于此缓冲器的请求，将使用 HTTP/1.1 和分块传输（Transfer-Encoding: chunked），以避免在本地创建巨大的包文件。默认为\
  \ 1 MiB，对于大多数请求足够。\n\n`http.lowSpeedLimit, http.lowSpeedTime`\n如果 HTTP 传输速度低于 `http.lowSpeedLimit`\
  \ 超过 `http.lowSpeedTime` 秒，则中止传输。可以通过 `GIT_HTTP_LOW_SPEED_LIMIT` 和 `GIT_HTTP_LOW_SPEED_TIME`\
  \ 环境变量覆盖。\n\n`http.noEPSV`\n禁用 curl 使用 EPSV ftp 命令的布尔值。这对于不支持 EPSV 模式的某些糟糕 ftp 服务器有用。可以通过\
  \ `GIT_CURL_FTP_NO_EPSV` 环境变量覆盖。默认值为 false（curl 将使用 EPSV）。\n\n`http.userAgent`\n\
  向 HTTP 服务器呈现的 HTTP USER_AGENT 字符串。默认代表代表 Git 版本，例如 git/1.7.1。此选项允许你将此值覆盖为常用值，例如\
  \ Mozilla/4.0。这可能是必要的，例如通过限制 HTTP 连接到一组常用 USER_AGENT 字符串（但不包含 git/1.7.1 等）的防火墙连接时。可以通过\
  \ `GIT_HTTP_USER_AGENT` 环境变量覆盖。\n\n\n\n\n\n上述任何 `http.*` 选项都可以选择性地应用于某些 URL。为了使配置键（config\
  \ key）匹配 URL，配置键的每个元素将按照以下顺序与 URL 的对应元素进行比较：\n\n1. 协议（Scheme）（例如此的 `https`）：此字段在配置键和\
  \ URL 之间必须完全匹配。\n2. 主机名/域名（例如此的 `example.com`）：此字段在配置键和 URL 之间必须完全匹配。\n3. 端口号（例如此的\
  \ `8080`）：此字段在配置键和 URL 之间必须完全匹配。省略的端口号在匹配前会自动转换为该协议的正确默认值。\n4. 路径（Path）（例如此的 `repo.git`）：配置键的路径字段必须与\
  \ URL 的路径字段完全匹配，或者作为斜杠分隔路径元素的前缀匹配。这意味着路径为 `foo/` 的配置键会匹配 URL 路径 `foo/bar`。前缀只能在斜杠（`/`）边界上进行匹配。较长的匹配具有更高的优先级（因此，路径为\
  \ `foo/bar` 的配置键比仅路径为 `foo/` 的配置键更匹配 URL 路径 `foo/bar`）。\n5. 用户名（User name）（例如此的\
  \ `user`）：如果配置键包含用户名，则它必须与 URL 中的用户名完全匹配。如果配置键没有用户名，则该配置键将匹配任何用户名（包括无）的 URL，但其优先级低于带有用户名的配置键。\n\
  \n上述列表按优先级递减排序；匹配配置键路径的 URL 优于匹配其用户名的 URL。例如，如果 URL 匹配配置键的 `will`，则其优先级将高于配置键的 `of`。\n\
  \n在尝试任何匹配之前，所有 URL 都会经过归一化处理（如果嵌入 URL 中的密码部分，在匹配时将始终被忽略），以便让拼写不同但等效的 URL 能够正确匹配。环境变量设置始终覆盖任何匹配结果。用于匹配的\
  \ URL 是直接传递给 Git 命令的 URL。这意味着任何由于重定向而访问的 URL 都不参与匹配。\n\n### `i18n.commitEncoding`\n\
  存储提交信息时使用的字符编码。Git 本身并不关心，但这些信息是必要的，例如当从邮件导入提交时，或在 `gitk` 图形历史浏览器中（以及可能在未来的其他地方或其他界面中）。参见例如\
  \ (1)。默认为 `utf-8`。\n\n### `i18n.logOutputEncoding`\n在运行 `git log` 及其命令时，提交信息转换到的字符编码。\n\
  \n### `imap`\n`imap` 部分中的配置变量见 (1)。\n\n### `index.version`\n指定初始化新索引文件时应使用的版本。这不会影响现有仓库。\n\
  \n### `init.templateDir`\n指定从哪个目录拷贝模板。（参见 (1) 中的 \"TEMPLATE DIRECTORY\" 节。）\n\n\
  ### `instaweb.browser`\n指定用于在 gitweb 中浏览你的工作仓库的程序。参见 (1)。\n\n### `instaweb.httpd`\n\
  用于在你的工作仓库上启动 gitweb 的 HTTP 守护进程命令行。参见 (1)。\n\n### `instaweb.local`\n如果为 `true`，由\
  \ (1) 启动的 Web 服务器将绑定到本地 IP (`127.0.0.1`)。\n\n### `instaweb.modulePath`\n(1) 使用的默认模块路径，用于替代\
  \ `/usr/lib/apache2/modules`。仅当 httpd 是 Apache 时才使用。\n\n### `instaweb.port`\n绑定到\
  \ gitweb httpd 的端口号。参见 (1)。\n\n### `interactive.singleKey`\n在交互式命令中，允许用户通过单键提供单字母输入（即无需按回车键）。目前用于\
  \ (1) 的 `--patch` 模式、(1)、(1)、(1) 和 (1)。注意，如果不支持便携按键输入，此设置将被默默忽略；需要 Perl 模块 `Term::ReadKey`。\n\
  \n### `log.abbrevCommit`\n如果为 `true`，则让 (1)、(1) 和 (1) 假设使用 `--abbrev-commit`。你可以通过\
  \ `--no-abbrev-commit` 覆盖此选项。\n\n### `log.date`\n设置 `log` 命令的默认日期时间模式。为 `log.date`\
  \ 设置值类似于使用 `git log` 的 `--date` 选项。可能的值有 `relative`、`local`、`default`、`iso`、`rfc`\
  \ 和 `short`；详见 (1)。\n\n### `log.decorate`\n打印 log 命令显示出的任何提交的引用名（ref names）。如果指定\
  \ `short`，则不打印 `refs/heads/*`、`refs/tags/*` 和 `refs/remotes/*` 前缀。如果指定 `full`，则打印完整的引用名（包括前缀）。这与\
  \ log 命令的 `--decorate` 选项相同。\n\n### `log.showRoot`\n如果为 `true`，初始提交将显示为一个大的创建事件。这等同于相对于空树的\
  \ diff。通常隐藏根提交的工具如 (1) 或 (1) 现在将显示它。默认 true `true`。\n\n### `log.mailmap`\n如果为 `true`，则让\
  \ (1)、(1) 和 (1) 假设使用 `--use-mailmap`。\n\n### `mailinfo.scissors`\n如果为 `true`，则让\
  \ (1)（因此是 (1)）默认行为类似于在命令行上提供了 `--scissors` 选项。激活时，此功能在 `=======` 之前移除 `8`。\n\n###\
  \ `mailmap.file`\nmailmap 文件的位置。仓库根目录的 mailmap 首先加载，然后是此变量指向的 mailmap。\n\n### `mailmap.blob`\n\
  类似于 mailmap.file，但考虑仓库中的 blob 值。如果给了 mailmap.file 和 mailmap.blob，则以 mailmap.file\
  \ 为优先。在裸仓库中默认为 `HEAD:.mailmap`。在非裸仓库中，默认为空。\n\n### `man.viewer`\n指定可能用于帮助的程序。参见\
  \ (1)。\n\n### `man.<tool>.cmd`\n指定调用指定 man 查看器的命令。指定的命令将在 shell 中作为参数执行。（参见 (1)。）\n\
  \n### `man.<tool>.path`\n覆盖指定工具的路径。参见 (1)。\n\n### `merge.conflictStyle`\n指定合并时将冲突块写入工作树文件的样式。默认值为\
  \ `merge`，它显示 `<<<<` 冲突标记、一侧的更改、`=======` 标记、另一侧的更改，以及 `>>>>` 标记。另一种样式 `diff3` 在\
  \ `=======` 之前添加 `||||||` 标记和原始文本。\n\n### `merge.ff`\n默认情况下，Git 在合并当前提交的后代提交时不会创建额外的合并提交。相反，当前分支的末端将进行快进。当设置为\
  \ `false` 时，此变量告诉 Git 在这种情况下创建一个额外的合并提交（相当于从命令行提供 `--no-ff` 选项）。当设置为 `only` 时，仅允许此类快进合并（相当于从命令行提供\
  \ `--ff-only` 选项）。\n\n### `merge.branchdesc`\n除了分支名外，在日志中填充与之关联的分支描述文本。默认 `false`。\n\
  \n### `merge.log`\n除了分支名外，在日志中填充最多指定数量的来自合并提交的单行描述。默认 `false`，`true` 是 20 的同义词。\n\
  \n### `merge.renameLimit`\n合并时进行重命名检测时考虑的文件数；如果没有指定，默认为 `diff.renameLimit` 的值。\n\
  \n### `merge.renormalize`\n\n\n\n\n告诉 Git 仓库中文件的标准表示形式随时间发生了变化（例如，早期的提交记录了 CRLF\
  \ 换行的文本文件，而最近的提交使用 LF 换行）。在这样的仓库中，Git 可以在执行合并之前将提交记录的数据转换为标准形式，以减少不必要的冲突。更多信息请参阅\
  \ (5) 中的“合并具有不同检入/检出属性的分支”章节。\n\n### merge.stat\n在合并结束时，是否打印 `ORIG_HEAD` 与合并结果之间的\
  \ diffstat。默认 true True。\n\n### merge.tool\n控制由 (1) 使用哪种合并工具。其下方的列表显示了所有有效的内置值。任何其他值都被视为自定义合并工具，并且需要定义相应的\
  \ `mergetool.<tool>.cmd` 变量。\n\n- `araxis`\n- `bc`\n- `bc3`\n- `codecompare`\n-\
  \ `deltawalker`\n- `diffmerge`\n- `diffuse`\n- `ecmerge`\n- `emerge`\n- `gvimdiff`\n\
  - `gvimdiff2`\n- `gvimdiff3`\n- `kdiff3`\n- `meld`\n- `opendiff`\n- `p4merge`\n\
  - `tkdiff`\n- `tortoisemerge`\n- `vimdiff`\n- `vimdiff2`\n- `vimdiff3`\n- `winmerge`\n\
  - `xxdiff`\n\n### merge.verbosity\n控制递归合并策略显示的输出量。Level 0 除了检测到冲突时的最终错误消息外不输出任何内容。Level\
  \ 1 只输出冲突，Level2 输出冲突和文件更改。Level 5 及以上输出调试信息。默认是 level 2。可以通过环境变量 `GIT_MERGE_VERBOSITY`\
  \ 进行覆盖。\n\n### merge.<driver>.name\n为自定义低级合并驱动程序定义一个可读的名称。详情参阅 (5)。\n\n### merge.<driver>.driver\n\
  定义实现自定义低级合并驱动程序的命令。详情参阅 (5)。\n\n### merge.<driver>.recursive\n指定在公共祖先之间执行内部合并时使用的低级合并驱动程序名称。详情参阅\
  \ (5)。\n\n### mergetool.<tool>.path\n覆盖指定工具的路径。当你的工具不在 `PATH` 中时，这非常有用。\n\n### mergetool.<tool>.cmd\n\
  指定调用指定合并工具的命令。指定的命令在 shell 中求值，并提供以下变量：`BASE` 是包含待合并文件公共基的临时文件名称（如果可用）；`LOCAL` 是包含当前分支文件内容的临时文件名称；`REMOTE`\
  \ 是包含被合并分支文件内容的临时文件名称；`MERGED` 包含合并工具应向其写入合并结果的文件名。\n\n### mergetool.<tool>.trustExitCode\n\
  对于自定义合并命令，指定合并命令的退出码是否可以用于判断合并是否成功。如果未设置为 true，则会检查合并目标文件的时间戳，如果文件已更新，则假设合并成功，否则将提示用户指示合并是否成功。\n\
  \n### mergetool.meld.hasOutput\n旧版本的 meld 不支持 `--output` 选项。Git 将尝试通过检查 `meld --help`\
  \ 的输出来检测 meld 是否支持 `--output`。通过配置 `mergetool.meld.hasOutput` 将使 Git 跳过这些检查并改用配置的值。将\
  \ `mergetool.meld.hasOutput` 设置为 true 告诉 Git 无条件使用 `--output` 选项，设置为 false 则避免使用\
  \ `--output`。\n\n### mergetool.keepBackup\n执行合并后，带有冲突标记的原始文件可以保存为带有 `.orig` 扩展的文件。如果此变量设置为\
  \ false，则不保留此文件。默认是 true（即保留备份文件）。\n\n### mergetool.keepTemporaries\n在调用自定义合并工具时，Git\
  \ 使用一组临时文件来传递给该工具。如果工具返回错误且此变量设置为 true，则这些临时文件将被保留，否则它们将在工具退出后被删除。默认是 false。\n\n\
  ### mergetool.writeToTemp\nGit 默认在工作树中写入冲突文件的临时 `BASE`、`LOCAL` 和 `REMOTE` 版本。当设置为\
  \ true 时，Git 将尝试使用临时目录来存放这些文件。默认是 false。\n\n### mergetool.prompt\n在每次调用合并解决程序之前提示。\n\
  \n### notes.displayRef\n在显示提交消息时，从中显示注释的（完全限定的）引用名（refname）。该变量的值可以设置为通配符（glob），在这种情况下，将显示所有匹配\
  \ ref 的注释。你也可以多次指定此配置变量。对于不存在的 ref 将发出警告，但不匹配任何 ref 的通配符将被静默忽略。\n\n此设置可以通过环境变量 `GIT_NOTES_DISPLAY_REF`\
  \ 进行覆盖，该变量必须是由冒号分隔的 ref 或通配符列表。\n\n`core.notesRef` 的有效值（可能被 `GIT_NOTES_REF` 覆盖）也会隐式添加到要显示的\
  \ ref 列表中。\n\n### notes.rewrite.<command>\n当使用 `<command>` 重写提交（目前为 amend 或 rebase）且此变量设置为\
  \ true 时，Git 会自动将你的注释从原始提交复制到重写提交。默认是 true，但请参见下文 \"notes.rewriteRef\"。\n\n### notes.rewriteMode\n\
  在重写期间复制注释时（见 \"notes.rewrite.<command>\" ），决定当目标提交已有注释时执行。必须是 overwrite、concatenate\
  \ 或 ignore 之一。默认是 concatenate。\n\n此设置可以通过环境变量 `GIT_NOTES_REWRITE_MODE` 进行覆盖。\n\n\
  ### notes.rewriteRef\n在重写期间复制注释时，指定应复制注释的（完全限定的）引用。引用可以是通配符，在这种情况下将复制所有匹配 ref 的注释。你也可以多次指定此配置变量。\n\
  \n没有默认值；你必须配置此变量以启用注释重写。设置为 `refs/notes/commits` 以对默认提交启用重写。\n\n此设置可以通过环境变量 `GIT_NOTES_REWRITE_REF`\
  \ 进行覆盖，该变量必须是冒号分隔的 ref 或通配符列表。\n\n### pack.window\n当未指定 own 时，(1) 使用的窗口。默认是 10。\n\
  \n### pack.depth\n当未指定最大深度时，(1) 使用的最大差异深度。默认是 50。\n\n### pack.windowMemory\n当未指定限制时，(1)\
  \ 中每个线程用于包窗口内存的最大内存。该值可以带有后缀 \"k\"、m\" 或 \"g\"。当未配置（或显式设置为 0）时，将没有限制。\n\n### pack.compression\n\
  整数 -1..9，表示包文件中对象的压缩级别。-1 是 zlib 默认值。0 表示不压缩，1..9 是不同的速度/大小权衡，9 最慢。如果未设置，默认为 `core.compression`。如果也未设置，默认为\
  \ -1，即 zlib 默认值，它是“速度和压缩之间的默认折中（目前相当于级别 6）”。\n\n注意，更改压缩级别不会自动重新压缩所有对象。你可以通过向 (1)\
  \ 传递 `-F` 参数来强制重新压缩。\n\n### pack.deltaCacheSize\n(1) 在写入包之前用于缓存差异的最大内存（字节）。该缓存用于加速写入对象的阶段，以便在找到所有对象的最佳匹配后无需重新计算差异结果。在内存紧张的机器上重新打包大型仓库可能会受到此影响，特别是当此缓存导致系统进入交换分区时。值\
  \ 0 表示没有限制。最小大小 1 字节可虚拟禁用此缓存。默认是 256 MiB。\n\n### pack.deltaCacheLimit\n(1) 缓存的差异的最大大小。该缓存用于加速写入对象的阶段，以便在找到所有对象的最佳匹配后无需重新计算差异结果。默认是\
  \ 1000。\n\n\n\n\n指定搜索最佳增量匹配（delta matches）时启动的线程数。这要求 (1) 编译时使用了 `pthreads`，否则该选项将被忽略并显示警告。这旨在减少多处理器机器上的打包时间。然而，增量搜索窗口所需的内存将是线程数的倍数。指定\
  \ 0 将导致 Git 自动检测 CPU 数量并据此设置线程数。\n\n### `pack.indexVersion`\n\n指定默认的包索引版本。有效值为：1，表示\
  \ Git 1.5.2 之前的版本使用的旧版包索引；2，表示新的包索引，它具有支持大于 4 GB 的包的能力，并对损坏包的重新打包提供适当的保护。版本 2 是默认值。请注意，当相应的包大于\
  \ 2 GB 时，将强制使用版本 2 并忽略此配置选项。\n\n如果你使用的旧版 Git 无法识别版本 2 的 `*.idx` 文件，那么通过非原生协议（例如\
  \ `\"http\"` 和 `\"rsync\"`）进行克隆或获取（这会从对端拷贝 `*.pack` 文件和对应的 `*.idx` 文件），可能会导致得到的仓库无法用旧版本的\
  \ Git 访问。然而，如果 `*.pack` 文件小于 2 GB，你可以对 `*.pack` 文件使用 (1) 来重新生成 `*.idx` 文件。\n\n###\
  \ `pack.packSizeLimit`\n\n包（pack）的最大大小。此设置仅影响重新打包到文件时，即 `git://` 协议不受影响。它可以通过 (1)\
  \ 的 `--max-pack-size` 选项覆盖。允许的最小大小限制为 1 MiB。默认不受限制。支持常用的单位后缀 `k`、`m` 或 `g`。\n\n\
  ### `pack.useBitmaps`\n\n当为 true 时，git 在打包到标准输出时（例如在 `fetch` 的服务端执行期间）将使用包位图（pack\
  \ bitmaps，如果可用）。默认 true true。除非你正在调试包位图，否则通常不需要关闭它。\n\n### `pack.writeBitmaps` (已弃)\n\
  \n这是 `repack.writeBitmaps` 的已弃同义词。\n\n### `pack.writeBitmapHashCache`\n\n当为 true\
  \ 时，git 将在位图索引中包含一个“哈希缓存”部分（如果已了）。该缓存可用于为 Git 的增量启发式提供数据，可能在位图对象和非位图对象之间产生更好的增量（例如，当在旧的位图包和自上次\
  \ `gc` 之后推送的对象之间提供 `fetch` 时）。缺点是每个对象会消耗 4 字节磁盘空间，且 `JGit` 的位图实现不理解它，导致在同一仓库上使用\
  \ Git 和 JGit 时它会报错。默认 false。\n\n### `pager.<cmd>`\n\n如果值为布尔值，则在写入 tty 时开启或关闭特定 Git\
  \ 子命令输出的分页。否则，将使用 `pager.<cmd>` 值指定的分页器对该子命令开启分页。如果在命令行上指定了 `--paginate` 或 `--no-pager`，则其优先级高于此选项。要禁用所有命令的分页，可以将\
  \ `core.pager` 或 `GIT_PAGER` 设置为 `cat`。\n\n### `pretty.<name>`\n\n(1) 指定 `--pretty=`\
  \ 格式字符串的别名。在这里定义的任何别名都可以像内置格式化格式一样使用。例如，运行 `git config pretty.changelog \"format:*\
  \ %H %s\"` 会导致调用 `git log --pretty=changelog` 等同于运行 `git log \"--pretty=format:*\
  \ %H %s\"`。注意，与内置格式同名的别名将被默默忽略。\n\n### `pull.ff`\n\n默认情况下，Git 在合并一个作为当前提交后代的提交时，不会创建额外的合并提交（merge\
  \ commit）。相反，当前分支的末端将进行快进（fast-forward）。当设置为 false 时，此变量告诉 Git 在这种情况创建一个额外的合并提交（等同于在命令行中提供\
  \ `--no-ff` 选项）。当设置为 only 时，仅允许此类的快进合并（等同于在命令行中提供 `--ff-only` 选项）。此设置在 pull 时会覆盖\
  \ `merge.ff`。\n\n### `pull.rebase`\n\n当为 true 时，运行 `\"git pull\"` 时，会将分支 rebase\
  \ 到获取到的分支之上，而不是从默认远程仓库合并默认分支。按分支设置此项，请参见 `\"branch.<name>.rebase\"`。\n\n``当设置为 preserve\
  \ 时，还会将 `--preserve-merges` 传递给 'git rebase'，这样本地提交的合并提交就不会在运行 'git pull' 时被扁平化。``\n\
  \n**注意**：这是一个可能危险的操作；除非你理解其影响，否则**不要**使用它（详情请参见 (1)）。\n\n### `pull.octopus`\n\n\
  一次性提取多个分支时使用的默认合并策略。\n\n### `pull.twohead`\n\n拉取单个分支时使用的默认合并策略。\n\n### `push.default`\n\
  \n定义了如果没有显式给出引用规格（refspec），`git push` 应该采取的动作。不同的值适用于特定的工作流；例如，在纯中心化工作流中（即 fetch\
  \ 源等于 push 目的），`upstream` 可能是你想要的。\n\n- `nothing`：除非显式给出引用规格，否则不推送任何内容（报错）。这主要用于那些希望通过始终显式操作避免错误的人。\n\
  - `current`：将当前分支推送到接收端同名的分支。这在中心化和非中心化工作流中均有效。\n- `upstream`：将当前分支推回通常集成到当前分支的分支（称为\
  \ `@{upstream}`）。这种模式只有在你推送通常从其 pull 的仓库时才有意义（即中心化工作流）。\n- `simple`：在中心化工作流中，其工作类似于\
  \ `upstream`，但增加了一个安全性：如果上游分支名称与本地分支不同，则拒绝推送。这曾是默认值，但从 Git 2.0 开始不再是（simple 是新的默认值）。\n\
  - `matching`：推送两端具有同名的所有分支。这使得你推送到的仓库记住将被推送出的分支集。\n\n### `push.followTags`\n\n如果设置为\
  \ true，则默认启用 `--follow-tags` 选项。你可以在推送时通过指定 `--no-follow-tags` 来覆盖此配置。\n\n\n\n\n\
  \n将此变量设置为字符串时，`git receive-pack` 将接受 `git push --signed`，并使用该字符串作为密钥通过 HMAC 保护的“随机数”（nonce）进行验证。\n\
  \n### receive.certNonceSlop\n\n当 `git push --signed` 发送的推送证书包含的“随机数”是在在指定的秒数内由服务同一仓库的\
  \ `receive-pack` 发的时，将证书中找到的“随机数”导出到 `GIT_PUSH_CERT_NONCE` 传递给钩（而不是 `receive-pack`\
  \ 要求发送端包含的内容）。这可能使得在 `pre-receive` 和 `post-receive` 中编写检查逻辑变得更容易。钩无需通过检查记录随机数过期秒数的\
  \ `GIT_PUSH_CERT_NONCE_SLOP` 环境变量来决定是否接受证书，只需检查 `GIT_PUSH_CERT_NONCE_STATUS` 是否为\
  \ `OK`。\n\n### receive.fsckObjects\n\n如果设置为 `true`，`git-receive-pack` 将检查所有收到的对象。如果遇到格式错误的对象或损坏的链接，将中止。中止的结果只会产生悬空对象。默认值为\
  \ `false`。如果未设置，则使用 `transfer.fsckObjects` 的值。\n\n### receive.unpackLimit\n\n如果推送中收到的对象数量低于此限制，对象将被解压为松散对象文件。然而，如果收到的对象数量等于或超过此限制，收到的包将在添加任何缺失的增量基后，以包的形式存储。存储推送的包可以使推送操作完成更快，特别是在慢文件系统上。如果未设置，则使用\
  \ `transfer.unpackLimit` 的值。\n\n### receive.denyDeletes\n\n如果设置为 `true`，`git-receive-pack`\
  \ 将拒绝删除引用（ref）的更新。使用此防止通过推送删除此类引用。\n\n### receive.denyDeleteCurrent\n\n如果设置为 `true`，`git-receive-pack`\
  \ 将拒绝删除非裸仓库中当前检出分支的引用更新。\n\n### receive.denyCurrentBranch\n\n如果设置为 `true` 或 `\"\
  refuse\"`，`git-receive-pack` 将拒绝对非裸仓库中当前检出分支的引用更新。这种推送具有潜在危险，因为它会导致 `HEAD` 与索引和工作树不同步。如果设置为\
  \ `\"warn\"`，则向 `stderr` 打印此类推送的警告，但允许推送继续。如果设置为 `false` 或 `\"ignore\"`，则允许此类推送且不发送消息。默认值为\
  \ `\"refuse\"`。\n\n另一个选项是 `\"updateInstead\"`，当向当前分支推送内容时，它将更新工作树。此选项用于在一方无法通过交互式\
  \ ssh 轻松访问时同步工作目录（例如实时网站，因此要求工作目录必须是干净的）。这种模式在虚拟机内部开发以测试和修复不同操作系统上的代码时也非常好用。\n\n\
  默认情况下，如果工作树或索引与 `HEAD` 有任何任何差异，`\"updateInstead\"` 将拒绝推送，但可以使用 `push-to-checkout`\
  \ 钩来自定义此行为。见 (5)。\n\n### receive.denyNonFastForwards\n\n如果设置为 `true`，`git-receive-pack`\
  \ 将拒绝非快进（not fast-forward）的引用更新。使用此防止通过推送此类更新，即使该推送是强制的。此配置变量在初始化共享仓库时设置。\n\n###\
  \ receive.hideRefs\n\n`receive-pack` 使用的字符串用于决定从其初始广告中省略哪些引用。使用多个定义可以指定多个前缀字符串。位于此变量值列出的层级下的引用将被排除，并在响应\
  \ `git push` 时被隐藏，且通过 `git push`尝试更新或删除隐藏引用的尝试将被拒绝。\n\n### receive.updateServerInfo\n\
  \n如果设置为 `true`，`git-receive-pack` 在接收来自 `git-push` 的数据并更新引用后，将运行 `git-update-server-info`。\n\
  \n### receive.shallowUpdate\n\n如果设置为 `true`，当新引用需要新的浅层根时，`.git/shallow` 可以被更新。否则，这些引用将被拒绝。\n\
  \n### remote.pushDefault\n\n默认推送到的远程仓库。它覆盖所有分支的 `branch.<name>.remote`，并被特定分支的 `branch.<name>.pushRemote`\
  \ 覆盖。\n\n### remote.<name>.url\n\n远程仓库的 URL。见 (1) 或 (1)。\n\n### remote.<name>.pushurl\n\
  \n远程仓库的推送 URL。见 (1)。\n\n### remote.<name>.proxy\n\n对于需要 `curl` (http, https 和 ftp)\
  \ 的远程仓库，用于该远程仓库的代理 URL。设置为空字符串以禁用该远程仓库的代理。\n\n### remote.<name>.fetch\n\n用于 (1)\
  \ 的默认 \"refspec\" 集合。见 (1)。\n\n### remote.<name>.push\n\n用于 (1) 的默认 \"refspec\"\
  \ 集合。见 (1)。\n\n### remote.<name>.mirror\n\n如果为 `true`，推送到此远程将自动表现为在命令行上提供了 `--mirror`\
  \ 选项。\n\n### remote.<name>.skipDefaultUpdate\n\n如果为 `true`，在使用 (1) 或 (1) 的更新子命令更新时，默认跳过此远程仓库。\n\
  \n### remote.<name>.skipFetchAll\n\n如果为 `true`，在使用 (1) 或 (1) 的更新子命令更新时，默认跳过此远程仓库。\n\
  \n### remote.<name>.receivepack\n\n推送时在远程侧执行的默认程序。见 (1) 的选项 `--receive-pack`。\n\n\
  ### remote.<name>.uploadpack\n\n获取时在远程侧执行的默认程序。见 (1) 的选项 `--upload-pack`。\n\n###\
  \ remote.<name>.tagOpt\n\n将此值设置为 `--no-tags` 可以在从远程 `<name>` 获取时禁用自动跟踪标签。将其设置为 `--tags`\
  \ 将获取从远程 `<name>` 的每一个标签，即使它们从远程分支头无法到达。将这些标志直接传递给 (1)。\n\n### remote.<name>.vcs\n\
  \n将此项设置为值 `<vcs>` 将导致 Git 与远程交互。\n\n### remote.<name>.prune\n\n当设置为 `true` 时，从此远程获取内容将还将删除远程上已不存在的任何远程跟踪引用（如同提供了\
  \ `--prune` 选项）。\n\n### remotes.<group>\n\n通过 \"git update <group>\" 获取的远程仓库列表。见\
  \ (1)。\n\n### repack.useDeltaOffset\n\n默认情况下，(1) 创建的包使用增量基偏移量。如果你需要与比 1.4.4 更老的\
  \ Git 共享仓库（直接或通过 http 等易易协议），则你需要将此选项设置为 `\"false\"` 并重新打包。旧版本的访问不受此选项影响。\n\n###\
  \ repack.packObjects\n\n如果设置为 `true`，使 `git repack` 行为类似于传递了 `--kept-objects`。见\
  \ (1) 详情。通常默认值为 `false`，但在写入位图索引时（通过 `--bitmap-index` 或 `repack.writemaps`）为 `true`。\n\
  \n### repack.writemaps\n\n为 `true` 时，git 在打包所有对象到磁盘时写入位图索引（例如运行 `git repack -a`\
  \ 时）。该索引可以加快后续克隆和获取的计数计数阶段，代价是额外的磁盘空间和初始打包花费的时间。默认值为 `false`。\n\n### rerere.autoUpdate\n\
  \n当设置为 `true` 时，`git-rerere` 在使用之前记录的解析清理冲突后更新索引。默认值为 `false`。\n\n### rerere.enabled\n\
  \n激活对已解决冲突记录，以便再次遇到相同的冲突块时可以自动解决。默认情况下，如果 `$GIT_DIR` 下存在 `rr-cache` 目录，则启用（例如之前在仓库中使用过\
  \ \"rerere\"）。\n\n### sendemail.identity\n\n配置身份。给出后会导致 `sendemail.<identity>` 部分的值值优于\
  \ `sendemail` 部分的值。默认身份是 `sendemail.identity` 的值。\n\n### sendemail.smtpEncryption\n\
  \n描述请见 (1)。注意，此设置不受 *identity* 机制的影响。\n\n### sendemail.smtpssl (已弃用)\n\n`sendemail.smtpEncryption\
  \ = ssl` 的已弃用别名。\n\n### sendemail.smtpsslcertpath\n\nca 证书路径（目录或单个文件）。将其为空字符串以禁用证书验证。\n\
  \n\n\n\n\n# sendemail.<identity>.*\n\n下方是 `sendemail.*` 参数的特定身份版本，当通过命令行或 `sendemail.identity`\
  \ 选择该身份时，这些参数优先级高于其他设置。\n\n`sendemail.aliasesFile`, `sendemail.aliasFileType`, `sendemail.annotate`,\
  \ `sendemail.bcc`, `sendemail.cc`, `sendemail.ccCmd`, `sendemail.chainReplyTo`,\
  \ `sendemail.confirm`, `sendemail.envelopeSender`, `sendemail.from`, `sendemail.multiEdit`,\
  \ `sendemail.signedoffbycc`, `sendemail.smtpPass`, `sendemail.suppresscc`, `sendemail.suppressFrom`,\
  \ `sendemail.to`, `sendemail.smtpDomain`, `sendemail.smtpServer`, `sendemail.smtpServerPort`,\
  \ `sendemail.smtpServerOption`, `sendemail.smtpUser`, `sendemail.thread`, `sendemail.transferEncoding`,\
  \ `sendemail.validate`, `sendemail.xmailer`\n\n描述请参见 (1)。\n\n### sendemail.signedoffcc\
  \ (已弃用)\n`sendemail.signedoffbycc` 的弃用别名。\n\n# showbranch.default\n(1) 的默认分支集。请参见\
  \ (1)。\n\n# status.relativePaths\n默认情况下，(1) 显示相对于当前目录的路径。将此变量设置为 `false` 则显示相对于仓库根目录的路径（这是\
  \ Git v1.5.4 之前的默认设置）。\n\n# status.short\n设置为 `true` 可在 (1) 中默认启用 `--short`。`--no-short`\
  \ 选项优先级高于此变量。\n\n# status.branch\n设置为 `true` 可在 (1) 中默认启用 `--branch`。`--no-branch`\
  \ 选项优先级高于此变量。\n\n# status.displayCommentPrefix\n如果设置为 `true`，(1)将在每行输出前插入一个注释前缀（以\
  \ `core.commentChar` 开头，默认为 `#`）。这是 Git 1.8.4 及之前的版本的行为。默认值为 `false`。\n\n# status.showUntrackedFiles\n\
  默认情况下，(1) 和 (1) 显示当前未被 Git 跟踪的文件。对于仅包含未跟踪文件的目录，将仅显示目录名。显示未跟踪文件意味着 Git 需要对整个仓库中的文件执行\
  \ `lstat()`，这在某些系统上可能会很慢。因此，此变量控制命令如何显示未跟踪文件。可能的值有：\n\n- `no` - 不显示未跟踪的文件。\n- `normal`\
  \ - 显示未跟踪的文件目录。\n- `all` - 同时显示未跟踪目录中的单个文件。\n\n如果未指定此变量，默认为 `normal`。可以通过 (1) 和\
  \ (1) 的 `-u|--untracked-files` 选项覆盖此变量。\n\n# status.submoduleSummary\n默认为 `false`。如果设置为非零数字或\
  \ `true`（等同于 `-1` 或无限数量），将启用子模块摘要并显示已修改子模块的提交摘要（参见 (1) 的 `--summary-limit` 选项）。请注意，当\
  \ `diff.ignoreSubmodules` 设置为 `all` 时，所有子模块的摘要输出命令将被抑制；或者仅针对设置了 `submodule.<name>.ignore=all`\
  \ 的子模块。该规则的例外是 `status` 和 `commit` 将显示已暂存的子模块更改。若要查看被忽略子模块的摘要，可以使用 `--ignore-submodules=dirty`\
  \ 命令行选项或 `git submodule summary` 命令，后者会显示类似的输出，但不遵循这些设置。\n\n# submodule.<name>.path,\
  \ submodule.<name>.url\n子模块在项目中的路径和 URL。这些变量最初由 `git submodule init` 填充。详情参见 (1)\
  \ 和 (5)。\n\n# submodule.<name>.update\n子模块的默认更新程序。此变量由 `git submodule init` 从 (5)\
  \ 文件中填充。参见 (1) 中 `update` 命令的描述。\n\n# submodule.<name>.branch\n子模块的远程分支名，供 `git\
  \ submodule update --remote` 使用。设置此选项以覆盖 `.gitmodules` 文件中的值。详情参见 (1) 和 (5)。\n\n\
  # submodule.<name>.fetchRecurseSubmodules\n此选项可用于控制此子模块的递归获取。可以通过对 `git fetch` 和\
  \ `git pull` 使用 `--[no-]recurse-submodules` 命令行选项进行覆盖。\n\n此设置将覆盖 (5) 文件中的设置。\n\n\
  # submodule.<name>.ignore\n定义了在什么情况下 `git status` 和 diff 系列命令会将子模块显示为已修改。当设置为 `\"\
  all\"` 时，它永远不会被视为已修改（但如果已暂存，仍会在 `status` 和 `commit` 的输出中出现）；`\"dirty\"` 会忽略子模块工作树的所有更改，仅考虑子模块的\
  \ `HEAD` 与主项目中记录的提交之间的差异；`\"untracked\"` 会额外让工作树中有已修改的跟踪文件的子模块显示出来。使用 `\"none\"\
  `（未设置此选项时的默认值）也会将工作树中存在未跟踪文件的子模块显示为已更改。此设置将覆盖 .gitmodules 中对该子模块的任何设置，两种设置都可以在命令行上通过\
  \ `--ignore-submodules` 选项进行覆盖。`git submodule` 命令不受此设置影响。\n\n# tag.sort\n此变量控制标签在\
  \ (1) 中显示时的排序顺序。在没有提供 `--sort=<value>` 选项的情况下，将使用此变量的值。\n\n# tar.umask\n此变量用于限制\
  \ tar 归档项目的权限位。默认值为 `0002`，关闭 world 写位。特殊值 `\"user\"` 表示使用归档用户的 umask。参见 (2) 和 (1)。\n\
  \n# transfer.fsckObjects\n当 `fetch.fsckObjects` 或 `receive.fsckObjects` 未设置时，将使用此变量的值。默认为\
  \ `false`。\n\n# transfer.hideRefs\n此变量可同时将 `receive.hideRefs` 和 `uploadpack.hideRefs`\
  \ 设置为相同的值。参见这些其他变量的条目。\n\n# transfer.unpackLimit\n当 `fetch.unpackLimit` 或 `receive.unpackLimit`\
  \ 未设置时，将使用此变量的值。默认值为 `100`。\n\n# uploadarchive.allowUnreachable\n如果为 true，允许客户端使用\
  \ `git archive --remote` 请求任何树，无论是否可。详情参见 (1) 安全部分。默认为 `false`。\n\n# uploadpack.hideRefs\n\
  upload-pack 用于决定从初始广告中省略哪些引用的字符串列表。使用多个定义来指定多个前缀字符串。位于变量值列表层级的引用将被排除，并对 `git ls-remote`、`git\
  \ fetch` 等隐藏。尝试通过 git fetch 获取隐藏引用将失败。参见 `uploadpack.allowTipSHA1InWant`。\n\n# uploadpack.allowTipSHA1InWant\n\
  当 `uploadpack.hideRefs` 生效时，允许 upload-pack 接受请求隐藏引用端对象的获取请求（默认情况下，此类请求拒绝）。参见 `uploadpack.hideRefs`。\n\
  \n# uploadpack.allowReachableSHA1InWant\n允许 upload-pack 接受请求任何引用端可达对象的获取请求。但请注意，计算对象可达性开销很大。默认为\
  \ `false`。\n\n# uploadpack.keepAlive\n当 upload-pack 开始 pack-objects 时，在 pack-objects\
  \ 准备包期间可能会有一个静默期。通常会输出进度信息，但如果 fetch 使用了 `--quiet`，pack-objects 在包数据开始之前将没有任何输出。某些客户端和网络可能会认为服务器挂起并放弃。设置此选项指示\
  \ upload-pack 每隔 `uploadpack.keepAlive` 秒发送一个空心跳包。将此选项设置为 `0` 则完全禁用心跳包。默认值为 `5`\
  \ 秒。\n\n# url.<base>.insteadOf\n\n\n\n\n\n任何以此值开头的 URL 都将被重写为以 `<base>` 开头。在某些站点提供大量仓库并提供多种访问方式的情况下，如果某些用户需要使用不同的访问方式，此功能允许用户指定任何一个等效的\
  \ URL，并让 Git 自动将 URL 重写为适用于特定用户的最佳替代，即使是该站点上从未见过的仓库也是。当多个 `insteadOf` 字符串匹配给定 URL\
  \ 时，将使用最长的匹配项。\n\n`url.<base>.pushInsteadOf`\n\n任何以此值开头的 URL 都不会被推送；相反，它将被重写为以 `<base>`\
  \ 开头，并推送生成的 URL。在某些站点提供大量仓库并提供多种访问方式（其中某些方式不允许推送）的情况下，此功能允许用户指定一个仅限拉取的 URL，并让 Git\
  \ 自动使用适当 URL 进行推送，即使是该站点上从未见过的仓库。当多个 `pushInsteadOf` 字符串匹配给定 URL 时，将使用最长的匹配项。如果远程仓库有显式的\
  \ `pushurl`，Git 将忽略该远程仓库的此设置。\n\n`user.email`\n\n记录在任何新创建提交中的电子邮件地址。可以通过 `GIT_AUTHOR_EMAIL`、`GIT_COMMITTER_EMAIL`\
  \ 和 `EMAIL` 环境变量覆盖。参见 (1)。\n\n`user.name`\n\n记录在任何新创建提交中的你的全名。可以通过 `GIT_AUTHOR_NAME`\
  \ 和 `GIT_COMMITTER_NAME` 环境变量覆盖。参见 (1)。\n\n`user.signingKey`\n\n如果在创建签名标签或提交时，(1)\
  \ 或 (1) 没有选择你想要自动使用的密钥，你可以通过此变量覆盖默认选择。此选项将原封不动传递给 `gpg` 的 `--local-user` 参数，因此你可以使用\
  \ `gpg` 支持的任何方法指定密钥。\n\n`versionsort.prereleaseSuffix`\n\n当在 (1) 中使用版本排序时，预发布标签（例如\
  \ \"1.0-rc1\"）可能会出现在主发布版本 \"1.0\" 之后。通过在该变量中指定后缀 \"-rc\"1.0-rc1\" 将出现在 \"1.0\" 之前。\n\
  \n此变量可以指定多次，每个后缀对应一次。配置文件中后缀的顺序决定了排序顺序（例如，如果 \"-pre\" 在配置文件中于 \"-rc\" 之前，则 1.0-preXX\
  \ 将排在 1.0-rcXX 之前）。如果它们位于多个配置文件中，不同后缀之间的排序顺序是未定义的。\n\n`web.browser`\n\n指定某些命令可能使用的网页浏览器。目前只有\
  \ (1) 和 (1)可以使用它。\n\n***\n\n# GIT-COUNT-OBJECTS\n\n## 名称\n`git-count-objects` -\
  \ 统计未解包对象的数量及其磁盘空间占用\n\n## 概要\n\n```\ngit count-objects [-v] [-H | --human-readable]\n\
  ```\n\n## 描述\n\n计算未解包对象文件的数量以及它们占用的磁盘空间，帮助你判断何时重新重新打包（repack）。\n\n### 选项\n\n- `-v`,\
  \ `--verbose`\n详细详细报告：\n- `count`: 松散对象的数量\n- `size`: 松散对象占用磁盘空间，单位为 KiB（除非指定了 `-H`）\n\
  - `in-pack`: 包内对象的数量\n- `size-pack`: 包占用的磁盘空间，单位为 KiB（除非指定了 `-H`）\n- `prune-packable`:\
  \ 同时存在于包中的松散对象数量。这些对象可以使用 `git prune-packed` 进行修剪。\n- `garbage`: 对象数据库中既不是有效松散对象也不是有效包的文件数量\n\
  - `size-garbage`: 垃圾文件占用磁盘空间，单位为 KiB（除非指定了 `-H`）\n\n- `-H`, `--human-readable`\n\
  以人类可读的格式打印大小\n\n***\n\n# Git-credential-cache--daemon\n\n## 名称\n`git-credential-cache--daemon`\
  \ - 在内存中临时存储用户凭证\n\n## 概要\n\n```\ngit credential-cache---daemon [--debug] <socket>\n\
  ```\n\n## 描述\n\n**注意**\n\n你可能不想自己调用此命令；它在你在使用 (1) 时会自动启动。\n\n该命令在 `<socket>` 指定的\
  \ Unix 域接字上监听 `git-credential-cache` 客户端。客户端可以存储和检索凭证。每个凭证的有效期由客户端指定；一旦没有凭证，守护进程就会退出。\n\
  \n如果指定了 `--debug` 选项，守护进程不会关闭其 stderr 流，并且在开始监听客户端后也可能向其输出额外的诊断信息。\n\n***\n\n# GIT-CREDENTIAL-CACHE\n\
  \n## 名称\n`git-credential-cache` - 在内存中临时存储密码的辅助程序\n\n## 概要\n\n```\ngit config credential.helper\
  \ 'cache [options]'\n```\n\n## 描述\n\n此命令在内存中缓存凭证以供未来的 Git 程序使用。存储的凭证永远不会接触磁盘，并在配置的超时后被忘记。缓存可以通过\
  \ Unix 域接字访问，并通过文件系统权限限制为当前用户。\n\n你可能不想直接调用此命令；它旨在作为 Git 其他部分的凭据助手使用。参见下文的 (7) 或\
  \ 示例。\n\n### 选项\n\n- `--timeout <seconds>`\n缓存凭证的秒数（默认: 900）。\n\n- `--socket <path>`\n\
  使用 `<path>` 连接到运行的缓存守护进程（如果没有启动，则启动一个新的缓存守护进程）。默认为 `~/.git-credential-cache`。如果你的主目录在网络挂载的文件系统上，可能需要将其改为本地文件系统。\n\
  \n## 控制守护进程\n\n如果你希望守护进程在超时之前退出并忘记所有凭证，可以执行此操作：\n\n```\ngit credential-cache exit\n\
  ```\n\n## 示例\n\n此辅助程序的目的是减少你输入用户名或密码的次数。例如：\n\n```\ngit config credential.helper\
  \ cache\ngit push Username: <你的用户名> Password: <你的密码>\n```\n\n你可以通过 `credential.helper`\
  \ 配置变量提供选项（此示例将缓存时间降为 5 分钟）：\n\n```\ngit config credential.helper 'cache --timeout=300'\n\
  ```\n\n***\n\n# GIT-CREDENTIAL-STORE\n\n## 名称\n`git-credential-store` - 将凭据存储在磁盘上的辅助程序\n\
  \n## 概要\n\n```\ngit config credential.helper 'store'\n```\n\n## 描述\n\n**注意**\n\n\
  使用此助手会将你的密码明文存储在磁盘上，仅受文件系统权限保护。如果这不是可以接受的安全权，请尝试 (1)，或者寻找与系统提供的安全存储的助手。\n\n此命令将凭证永久存储在磁盘上，供未来的\
  \ Git 程序使用。\n\n你可能不想直接调用此命令；它旨在作为 Git 其他部分的凭据助手使用。参见下文的 (7) 或 示例。\n\n### 选项\n\n\
  - `--file=<path>`\n使用 `<path>` 查找和存储凭证。该文件的文件系统权限将设置为防止系统上的其他用户读取，但不会进行加密或其他保护。如果没有指定，系统将从\
  \ `~/.git-credentials` 和 `$XDG_CONFIG_HOME/git/credentials` 搜索凭证，如果前者不存在，则凭证将写入后者（如果后者存在）。请另参见“文件”部分。\n\
  \n# 文件\n\n如果没有通过 `--file` 显式设置，`git-credential-store` 将按优先级在两个文件中搜索凭证：\n\n`~/.git-credentials`\n\
  用户特定凭据文件。\n\n`$XDG_CONFIG_HOME/git/credentials`\n第二个用户特定凭据文件。如果 `$XDG_CONFIG_HOME`\
  \ 未设置为空，将使用 `$HOME/.config/git/credentials`。如果 `~/.git-credentials` 有匹配的凭证，则该文件中任何凭证都不会被使用。如果你有时使用不支持它的旧版本\
  \ Git，不创建此文件是一个好主意。\n\n对于凭据查找，将按照上述顺序读取文件，找到的第一个匹配凭证优先于列表中后续文件的凭证。\n\n\n\n\n凭据存储默认将写入到列表中第一个存在的文件。如果这些文件都不存在，则将创建并写入\
  \ `~/.git-credentials`。\n\n在删除凭据时，所有文件中匹配的凭据都将被删除。\n\n## 示例\n\n此辅助工具的作用点是减少你必须输入用户名或密码的次数。例如：\n\
  \n```bash\n$ git config credential.helper store\n$ git push Username: <输入你的用户名>\
  \ Password: <输入你的密码>\n[几天后]\n$ git push [你的凭据将被自动使用]\n```\n\n## 存储格式\n\n`.git-credentials`\
  \ 文件以明文形式存储。每个凭据单独存储在一行，格式如下 URL：\n\n当 Git 需要对特定的 URL 上下文进行身份验证时，`credential-store`\
  \ 将该上下文视为一个模式，与凭据文件中的每个项目进行匹配。如果协议、主机名和用户名（如果已经有了的话）匹配，则会将密码返回给 Git。更多信息请参见 (7)\
  \ 中关于配置的讨论。\n\n***\n\n# GIT-CREDENTIAL\n\n## 名称\n\n`git-credential` - 获取和存储用户凭据\n\
  \n## 概要\n\n`git credential <fill|approve|reject>`\n\n## 描述\n\nGit 有一个内部接口用于从特定系统的辅助工具中存储和检索凭据，并提示用户用户名和密码。`git-credential`\
  \ 命令将此接口暴露给脚本，这些脚本可能希望以 Git 以相同的方式获取、存储或提示凭据。该可脚本接口的设计模拟了内部的 C API；有关概念的更多背景信息，请参见\
  \ `the Git credential API`m[][1]。\n\n`git-credential` 在命令行上接受一个“操作”选项（`fill`、`approve`\
  \ 或 `reject` 之一），并从 `stdin` 读取凭据描述（参见 INPUT/OUTPUT FORMAT）。\n\n如果操作是 `fill`，`git-credential`\
  \ 将尝试通过读取配置文件、联系任何已配置的凭据辅助工具或提示用户，向描述中添加 `username` 和 `password` 属性。随后，将凭据描述的用户名和密码属性连同已提供的属性一起打印到\
  \ `stdout`（标准输出）。\n\n如果操作是 `approve`，`git-credential` 将描述发送给任何已配置的凭据辅助工具，这些工具可能会存储凭据以供以后使用。\n\
  \n如果操作是 `reject`，`git-credential` 将描述发送给任何已配置的凭据辅助工具，这些工具可能会删除任何与描述匹配的存储凭据。\n\n\
  如果操作是 `approve` 或 `reject`，则不应产生输出。\n\n## GIT CREDENTIAL 的典型用法\n\n使用 `git-credential`\
  \ 的应用程序通常按以下步骤使用 `git credential`：\n\n1. 根据上下文生成凭据描述。\n\n例如，如果我们想为某个请求获取密码，可能会生成如下凭据描述（不要忘记末最后的空行；它告诉\
  \ `git credential` 应用程序完成了所有其拥有的信息的输入）：\n\n`protocol=https host=example.com path=foo.git`\n\
  \n2. 要求 `git-credential` 为此描述提供一个用户名和密码。这是通过运行 `git credential fill` 并将步骤 (1) 中的描述馈送给它的标准输入完成的。完整的凭据描述（包括凭据本身，即登录名和密码）将在标准输出上产生，如下：\n\
  \n`protocol=https host=example.com username=bob password=secr3t`\n\n在大多数情况下，这意味着输入中给出的属性将在输出中重复，但\
  \ Git 可能会修改凭据描述，例如，当协议为 HTTP(s) 且 `credential.useHttpPath` 为 false 时，移除 path 属性。\n\
  \n如果 git credential 知道密码，那么此步骤在返回 `password=secr3t` 之前，可能并不涉及用户实际输入此密码（用户可能输入了密码来解锁钥匙串，或者如果钥匙串已经解锁则没有用户交互）。\n\
  \n3. 使用该凭据（例如，使用步骤 (2) 中的用户名和密码访问 URL），并查看是否被接受。\n\n4. 报告密码的成功或失败。如果凭据允许操作成功完成，则可以将其标记为“approve”操作，告诉\
  \ `git credential` 在下一次调用中重用它。如果凭据在操作期间被拒绝，则使用“reject”操作，以便 `git credential` 在下一次调用时请求新密码。在任何情况下，都应向\
  \ `git credential` 供给从步骤 (2) 获取的凭据描述（该描述也包含了步骤 (1) 中提供的项）。\n\n## 输入/输出格式\n\n`git\
  \ credential` 在其标准输入/输出中读取和或写入（取决于使用的操作）凭据信息。这些信息可以对应于 `git credential` 获取登录/密码信息的键（例如\
  \ `host`、`protocol`、`path`），也可以对应于获取的实际凭据数据（登录/密码）。\n\n凭据被分为一组命名属性，每行一个属性。每个属性由一个键值对指定，用\
  \ `=`（等号）分隔，后跟一个换行符。凭据被拆分为一组命名属性，每行一个属性。每个属性由一个键值对指定，用 `=`（等号）分隔，后跟一个换行符。每个属性由一个键值对指定，用\
  \ `=`（等号）分隔，后跟一个换行符。凭据被拆分为一组命名属性，每行一个属性。每个属性由一个键值对指定，用 `=`（等号）分隔，后跟一个换行符。凭据被拆分为一组命名属性，每行一个属性。git\
  \ credential 属性列表的结束。git credential 的属性列表以换行符结束。Git 理解以下属性：\n\n`protocol`\n用于该凭据的协议（e.g.\
  \ https）。\n\n`host`\n远程凭据的主机名。\n\n`path`\n用于该凭据的路径。\n\n`username`\n凭据的用户名。\n\n`password`\n\
  凭据的密码。\n\n`url`\n当此特殊属性被 git credential 读取时，将被视为 URL。\n\n## 注意\n\n1.\n\nthe credential\
  \ API\n\n***\n\n# GIT-DESCRIBE\n\n## 名称\n\n`git-describe` - 使用从提交到达的最早标签描述提交\n\n\
  ## 概要\n\n`git describe [--all] [--tags] [--contains] [--abbrev=<n>] <commit-ish>...`\n\
  \n`git describe [--all] [--tags] [--contains] [--abbrev=<n>] --dirty[=<mark>]`\n\
  \n## 描述\n\n该命令找到从提交到达的最早标签。如果标签指向该提交，则仅显示标签。否则，将在标签名称后面加上标记对象的额外提交数以及最近提交的简短对象名。\n\
  \n默认情况下（不使用 `--all` 或 `--tags`），git describe 只显示注解标签。关于创建注解标签的更多信息请参见 (1) 中的 `-a`\
  \ 和 `-s` 选项。\n\n### 选项\n\n`<commit-ish>...`\n要描述的提交对象。\n\n`--dirty[=<mark>]`\n描述工作树。这意味着描述\
  \ `HEAD` 并在工作树不干净时追加 `<mark>`（默认为 `-dirty`）。\n\n`--all`\n不再只使用注解标签，而是使用 `refs/`\
  \ 命名空间中的任何引用。此选项允许匹配任何已知分支、远程跟踪分支或轻量级标签。\n\n`--tags`\n不再只使用注解标签，而是使用 `refs/tags`\
  \ 命名空间中的任何标签。此选项允许匹配轻量级（非注解）标签。\n\n`--contains`\n不是找到在提交之前的标签，而是找到提交之后的标签，并因此包含它。自动隐含\
  \ `--tags`。\n\n`--abbrev=<n>`\n简短对象名的最大长度。\n\n\n\n\n\n## --abbrev=<n>\n\n不再使用默认的\
  \ 7 位十六进制数字作为缩写对象名，而是使用 `<n>` 位数字，或形成唯一对象名所需的任意位数。`<n>` 设置为 `0` 将抑制长格式输出，仅显示最近的标签。\n\
  \n## --candidates=<n>\n\n不再仅考虑最近的 10 个标签作为描述输入提交（commit-ish）的候选，而是考虑最多 `<n>` 个候选。将\
  \ `<n>` 增加到 10 以上会花费稍微长时间，但可能会产生更准确的结果。`<n>` 设置为 `0` 将仅输出精确匹配项。\n\n## --exact-match\n\
  \n仅输出精确匹配项（标签直接引用所提供的提交）。这是 `--candidates=0` 的同义词。\n\n## --debug\n\n向标准错误流详细显示关于正在采用的搜索策略的策略。标签名称仍会打印到标准输出。\n\
  \n## --long\n\n即使在匹配到标签时也始终输出长格式（标签、提交数量和缩写后的提交名）。当你想在 \"describe\" 输出中查看提交对象名的部分内容时非常有用，即使该提交恰好是一个标记过的版本。它不会仅仅输出标签名，而是会将此类提交描述为\
  \ `v1.2-0-gdeadbee`（自标签 `v1.2` 以来指向对象 `deadbee` 的第 0 个提交....\n\n## --match <pattern>\n\
  \n仅考虑匹配给定（7 位）模式的标签，排除 \"refs/tags/\" 前缀。这可以避免泄露仓库中的私有标签。\n\n## --always\n\n显示唯一的缩写提交对象作为备选。\n\
  \n## --first-parent\n\n在遇到合并提交时，仅遵循第一个父提交。当你不想匹配目标提交历史中合并的分支上的标签时，这非常有用。\n\n## 示例\n\
  \n在类似 `git.git` 的当前树中，我得到：\n\n```\n[torvalds@g5 git]$ git describe parent v1.0.4-14-g2414721\n\
  ```\n\n即我的 \"parent\" 分支的当前 HEAD 是基于 `v1.0.4` 的，但由于其上有几次提交，describe 在末尾添加了额外提交的数量（\"\
  14\"）以及提交本身的缩写对象名（\"2414721\"）。\n\n额外提交的数量是 `git log v1.0.4..parent` 显示的提交数量。哈希后缀是\
  \ `\"-g\"` + parent 顶部提交的 7 位缩写（该提交为 `2414721b194453f058079d897d13c4e377f92dc6`）。`\"\
  g\"` 前缀代表 `\"git\"`，用于根据软件所管理的 SCM 系统来描述软件版本。这在人们可能使用不同 SCM 的环境中非常有用。\n\n对标签名执行\
  \ `git describe` 将仅显示标签名：\n\n```\n[torvalds@g5 git]$ git describe v1.0.4 v1.0.4\n\
  ```\n\n使用 `--all` 时，命令可以使用分支头部作为引用，因此输出会显示引用路径：\n\n```\n[torvalds@g5 git]$ git describe\
  \ --all --abbrev=4 v1.0.5² tags/v1.0.0-21-g975b\n[torvalds@g5 git]$ git describe\
  \ --all --abbrev=4 HEAD^ heads/lt/describe-7-g975b\n```\n\n将 `--abbrev` 设置为 `0`\
  \ 时，命令可以找到没有任何后缀的最近标签名：\n\n```\n[torvalds@g5 git]$ git describe --abbrev=0 v1.0.5²\
  \ tags/v1.0.0\n```\n\n请注意，你今天输入这些命令得到的后缀可能比 Linus 之前运行这些命令时看到的要长，因为你的 Git 仓库可能有新的以\
  \ `975b` 开头的对象名的提交，而这些提交在当时并不存在，仅凭 `\"-g975b\"` 后缀可能不足以区分这些提交。\n\n## 搜索策略\n\n对于每个提供的提交（commit-ish），`git\
  \ describe` 将首先查找精确标记该提交的标签。注记标签总是优于轻量标签，日期较新的标签总是优于日期较旧的标签。如果找到精确匹配，将输出其名称并停止搜索。\n\
  \n如果未找到精确匹配，`git describe` 将回溯提交历史以定位一个被标记过的祖先提交。将输出祖先的标签以及输入提交的 SHA-1 缩写。如果指定了\
  \ `--first-parent`，则回溯将仅考虑每个提交的第一个父提交。\n\n如果在回溯期间找到多个标签，将选择并输出与输入提交差异提交最少的标签。这里“差异提交最少”定义为\
  \ `git log tag..input` 显示的提交数量是尽可能小的数字。\n\n# GIT-DIFF-FILES\n\n## 名称\n\n`git-diff-files`\
  \ - 比较工作树和索引中的文件\n\n## 概要\n\n`git diff-files [-q] [-0|-1|-2|-3|-c|--cc] [<common\
  \ diff 选项>] [<path>...]`\n\n## 描述\n\n比较工作树和索引中的文件。当指定了路径时，仅比较这些命名的路径。否则，比较索引中的所有条目。\n\
  \n### 选项\n\n-p, -u, --patch\n\n生成补丁（见下）。\n\n-s, --no-patch\n\n抑制差异输出。适用于 show 等命令。\n\
  \n-U<n>, --unified=<n>\n\n使用 `<n>` 行上下文而不是通常的三行生成差异。\n\n--raw\n\n以原始格式生成差异。这是默认值。\n\
  \n--patch-with-raw\n\n`-p` 的同义词。\n\n--minimal\n\n花费更多时间以确保产生可能的差异。\n\n--patience\n\
  \n使用 \"patience diff\" 算法生成差异。\n\n--histogram\n\n使用 \"histogram diff\" 算法生成差异。\n\
  \n--diff-algorithm={patience|minimal|histogram|myers}\n\n选择差异算法。变如下：\n\ndefault,\
  \ myers\n贪心差异算法。目前是默认值。\n\nminimal\n花费更多时间以确保产生可能的差异。\n\npatience\n在生成补丁时使用 patience\
  \ diff 算法。\n\nhistogram\n该算法扩展了 patience 算法以“支持低频元素”。例如，如果你将 diff.algorithm 变量配置为非默认值并想使用默认值，必须使用\
  \ `--diff-algorithm=default`。\n\n--stat[=<width>,<name-width>[,<count]]]\n\n生成统计。默认情况下，文件名部分将尽可能使用空间，图形部分。最大宽度默认为终端宽度，如果没有连接终端则为\
  \ 80 列，可以通过 `<width>` 覆盖。通过逗号给出另一个宽度 `<name-width>` 可以限制文件名部分的宽度。图形部分的宽度可以通过 `--stat-graph-width=<width>`（影响所有生成统计的命令）或设置\
  \ `diff.statGraphWidth=<width>`（不影响 format-patch）来限制。通过给出第三个参数 `<count>`，可以限制输出前\
  \ `<count>` 行，如果有更多则显示 ...\n\n这些参数也可以单独设置：`--stat-width=<width>`、`--stat-name-width=<name-width>`\
  \ 和 `--stat-count=<count>`。\n\n--numstat\n\n与 `--stat` 类似，但使用十进制显示添加和删除行的数量以及不缩写的路径，以便机器友好。对于二进制文件，输出两个\
  \ -。\n\n--shortstat\n\n仅输出 stat 格式的最后一行，包含修改文件的总数以及添加和删除行的数量。\n\n--dirstat[=<param1,param2,...>]\n\
  \n输出每个子目录相对变化的分布。`--dirstat` 的行为可以通过逗号分隔的参数列表进行自定义。默认由 `diff.dirstat` 配置变量控制（见 (1)）。可用参数如下：\n\
  \nchanges\n\n通过计算从源删除或向目标添加的行来计算 dirstat 数字。这忽略了文件内部纯代码移动。也就是说，重新排列文件中的行不会被像其他变化那样计数。这是未提供参数时的默认行为。\n\
  \n\n\n\n通过执行常规基于行的 diff 分析，并累加删除/添加的行数来计算 dirstat 数字。（对于二进制文件，改用计数 64 字节块，因为二进制文件没有天然的行概念）。这种\
  \ `--dirstat` 行为比更改行为开销更大，但它对文件内重排行的计数方式与其他更改相同。输出结果与其他 `--*stat` 选项获得的结果一致。\n\n\
  ### files\n\n通过统计已更改的文件数量来计算 dirstat 数字。在 dirstat 分析中，每个更改的文件计数权重相等。这是计算上开销最低的 `--dirstat`\
  \ 行为，因为它完全不需要查看文件内容。\n\n### cumulative\n\n同时也为父目录统计子目录的变化。请注意，使用 `cumulative` 时，报告的百分比总和可能会超过\
  \ 100%。可以使用 `noncumulative` 参数指定默认（非累计）行为。\n\n### <limit>\n\n一个整数参数，用于指定截断百分比（默认为\
  \ 3%）。变化量低于此百分比的目录不会显示在输出中。\n\n示例：以下命令将统计更改的文件，同时忽略更改文件总数少于 10% 的目录，并在父目录中累积子目录计数：`--dirstat=files,10,cumulative`。\n\
  \n### --summary\n\n输出扩展头部信息的压缩摘要，例如创建、重命名和模式更改。\n\n### --patch-with-stat\n\n`-p`\
  \ `--stat` 的同义词。\n\n### -z\n\n当给出 `--raw`、`--numstat`、`--name-only` 或 `--name-status`\
  \ 时，不对路径进行处理，并使用 `NUL` 作为输出字段分隔符。\n\n如果没有此选项，每个输出的路径会将 `TAB`、`LF`、双引号和反斜杠字符替换为 `\\\
  t`、`\\n`、`\\\"` 和 `\\\\`，如果发生了任何替换，路径将被双引号包围。\n\n### --name-only\n\n仅显示更改的文件名。\n\
  \n### --name-status\n\n仅显示更改的文件名和状态。关于状态字母的含义，请参见 `--diff-filter` 选项的描述。\n\n###\
  \ --submodule[=<format>]\n\n指定子模块差异的显示方式。当给出 `--submodule` 或 `--submodule=log` 时，使用\
  \ `log` 格式。该格式像 (1)`summary` 一样列出范围内的提交。省略 `--submodule` 选项或指定 `--submodule=short`\
  \ 则使用 `short` 格式。该格式仅显示范围开头和结尾的提交名称。可以通过 `diff.submodule` 配置变量进行调整。\n\n### --color[=<when>]\n\
  \n显示彩色的 diff。`--color`（即没有 `=<when>`）与 `--color=always` 相同。`<when>` 可以是 always、never\
  \ 或 auto 之一。\n\n### --no-color\n\n关闭彩色 diff。它与 `--color=never` 相同。\n\n### --word-diff[=<mode>]\n\
  \n显示单词 diff，使用 `<mode>` 来分隔更改的单词。默认情况下，单词由空白符分隔；见下文的 `--word-diff-regex`。`<mode>`\
  \ 默认为 `plain`，必须是以下之一：\n\n#### color\n\n仅使用颜色高亮更改的单词。隐含 `--color`。\n\n#### plain\n\
  \n将单词显示为 `[-removed-]` 和 `{+added+}`。如果出现分隔符，则不尝试进行转义。\n\n#### porcelain\n\n输出扩展头部信息的压缩摘要，例如创建、重命名和模式更改。\n\
  \n#### none\n\n禁用单词 diff。\n\n### --word-diff-regex\n\n显示单词 diff，使用 `<mode>` 来分隔更改的单词。默认情况下，单词由空白符分隔；见下文的\
  \ `--word-diff-regex`。`<mode>` 默认为 `plain`，必须是以下之一：\n\n### --word-diff-stat\n\n\
  显示单词 diff，使用 `<mode>` 来分隔更改的单词。默认情况下，单词由空白符分隔；见下文的 `--word-diff-regex`。`<mode>`\
  \ 默认为 `plain`，必须是以下之一：\n\n### --word-diff-fragment\n\n显示单词 diff，使用 `<mode>` 来分隔更改的单词。默认情况下，单词由空白符分隔；见下文的\
  \ `--word-diff-regex`。`<mode>` 默认为 `plain`，必须是以下之一：\n\n### --word-diff-regex=<mode>\n\
  \n显示单词 diff，使用 `<mode>` 来分隔更改的单词。默认情况下，单词由空白符分隔；见下文的 `--word-diff-regex`。`<mode>`\
  \ 默认为 `plain`，必须是以下之一：\n\n### --word-diff-stat=<mode>\n\n显示单词 diff，使用 `<mode>` 来分隔更改的单词。默认情况下，单词由空白符分隔；见下文的\
  \ `--word-diff-regex`。`<mode>` 默认为 `plain`，必须是以下之一：\n\n### --word-diff-fragment=<mode>\n\
  \n显示单词 diff，使用 `<mode>` 来分隔更改的单词。默认情况下，单词由空白符分隔；见下文的 `--word-diff-regex`。`<mode>`\
  \ 默认为 `plain`，必须是以下之一：\n\n### --diff-filter\n\n仅显示更改的文件名和状态。关于状态字母的含义，请参见 `--diff-filter`\
  \ 选项的描述。\n\n### --word-diff-regex\n\n`<mode>` 默认为 `plain`，必须是以下之一：\n\n### --word-diff-regex\n\
  \n显示单词 diff，使用 `<mode>` 来分隔更改的单词。默认情况下，单词由空白符分隔；见下文的 `--word-diff-regex`。`<mode>`\
  \ 默认为 `plain`，必须是以下之一：\n\n### --word-diff-stat\n\n显示单词 diff，使用 `<mode>` 来分隔更改的单词。默认情况下，单词由空白符分隔；见下文的\
  \ `--word-diff-regex`。`<mode>` 默认为 `plain`，必须是以下之一：\n\n### --word-diff-fragment\n\
  \n显示单词 diff，使用 `<mode>` 来分隔更改的单词。默认情况下，单词由空白符分隔；见下文的 `--word-diff-regex`。`<mode>`\
  \ 默认为 `plain`，必须是以下之一：\n\n### --word-diff-regex=<mode>\n\n显示单词 diff，使用 `<mode>`\
  \ 来分隔更改的单词。默认情况下，单词由空白符分隔；见下文的 `--word-diff-regex`。`<mode>` 默认为 `plain`，必须是以下之一：\n\
  \n### --word-diff-stat=<mode>\n\n显示单词 diff，使用 `<mode>` 来分隔更改的单词。默认情况下，单词由空白符分隔；见下文的\
  \ `--word-diff-regex`。`<mode>` 默认为 `plain`，必须是以下之一：\n\n### --word-diff-fragment=<mode>\n\
  \n显示单词 diff，使用 `<mode>` 来分隔更改的单词。默认情况下，单词由空白符分隔；见下文的 `--word-diff-regex`。`<mode>`\
  \ 默认为 `plain`，必须是以下之一：\n\n*(注：提供的文本后续包含大量重复和乱码句子，已根据指令对内容进行了格式化处理。)*\n\n\n\n\n##\
  \ --find-copies-harder\n\n出于性能考虑，默认情况下 `-C` 选项仅在副本的原始文件在同一变更（changeset）中被修改时才会查找副本。此标志位使命令检查未修改的文件作为复制源的候选文件。对于大型项目来说，这是一个非常昂贵的操作，请谨慎使用。提供多个\
  \ `-C` 选项的效果相同。\n\n## -D, --irreversible-delete\n\n省略删除操作的原始镜像（preimage），即只打印头信息，而不打印镜像与\
  \ `/dev/null` 之间的差异。生成的补丁并非用于通过 `patch` 或 `git apply` 应用；这仅适用于只想专注于在更改后查看文本的人。此外，输出显然缺乏反向应用此类补丁的信息（即使手动操作也无法），这也是该选项命名的由来。\n\
  \n与 `-B` 配合使用时，还会省略删除/创建对中删除部分的镜像。\n\n## -l<num>\n\n`-M` 和 `-C` 选项需要 `O(n²)` 处理时间，其中\
  \ `n` 是潜在重命名/复制目标的数量。当重命名/复制目标的数量超过指定数量时，此选项将防止重命名/复制检测运行。\n\n## --diff-filter=[(A|C|D|M|R|T|U|X|B)...[*]]\n\
  \n仅选择已添加 (A)、复制 (C)、删除 (D)、修改 (M)、重命名 (R)、类型发生变化 (T，即普通文件、符号链接、子模块等...)、未合并 (U)、未知\
  \ (X) 或配对损坏 (B)的文件。可以使用过滤器字符的任何组合（包括不包含）。当组合中添加 `*`（全有或全无）时，如果比较中有任何文件匹配其他标准，则选择所有路径；如果没有文件匹配其他标准，则不选择任何内容。\n\
  \n## -S<string>\n\n查找文件中指定字符串出现次数发生变化（即添加/删除）的差异。该选项旨在供脚本编写人员使用。\n\n当你正在寻找一个精确的代码块（如结构体），并想知道该块自诞生以来的历史时，它非常有用：迭代使用此功能，将镜像中感兴趣块馈回\
  \ `-S`，直到获取该块的最早版本。\n\n## -G<regex>\n\n查找补丁文本中包含匹配 `<regex>` 的添加/删除行的差异。\n\n为了说明\
  \ `-S<regex> --pickaxe-regex` 与 `-G<regex>` 之间的区别，考虑同一文件中具有以下差异的提交：\n\n```\n+ return\
  \ !regexec(regexp, two->ptr, 1, &regmatch, 0); ... - hit = !regexec(regexp, mf2.ptr,\
  \ 1, &regmatch, 0);\n```\n\n虽然 `git log -G\"regexec\\(regexp\" 会显示此提交，但 `git log\
  \ -S\"regexec\\(regexp\" --pickaxe-regex` 则不会（因为该字符串的出现次数没有变化）。\n\n更多信息见 (7) 中的\
  \ *pickaxe* 条目。\n\n## --pickaxe-all\n\n当 `-S` 或 `-G` 找到更改时，显示该变更中的所有更改，而不仅仅是包含 `<string>`\
  \ 的文件。\n\n## --pickaxe-regex\n\n将传递给 `-S` 的 `<string>`视为扩展 POSIX 正则表达式进行匹配。\n\n\
  ## -O<orderfile>\n\n按照 `<orderfile>` 中指定的顺序输出补丁，该文件每行有一个 shell 通配符模式（glob pattern）。这会覆盖\
  \ `diff.orderFile` 配置变量（见 (1)）。要取消 `diff.orderFile`，请使用 `-O/dev/null`。\n\n## -R\n\
  \n交换两个输入；即从索引或磁盘文件到树内容的差异。\n\n## --relative[=<path>]\n\n当从项目的子目录下运行时，可以通过此选项指示排除目录之外的更改，并显示相对于该目录的路径名。当你不在子目录中（例如在裸仓库中）时，可以通过提供\
  \ `<path>` 参数来指定相对于哪个子目录输出输出。\n\n## -a, --text\n\n将所有文件视为文本。\n\n## --ignore-space-at-eol\n\
  \n忽略行尾（EOL）空白的变化。\n\n## -b, --ignore-space-change\n\n忽略空白数量的变化。这会忽略行尾的空白，并将所有其他一个或多个空白字符序列视为等效。\n\
  \n## -w, --ignore-all-space\n\n在比较行时忽略空白。即使一行有空白而另一行没有，也会忽略这些差异。\n\n## --ignore-blank-lines\n\
  \n忽略所有行均为空白更改。\n\n## --inter-hunk-context=<lines>\n\n显示差异块（hunks）之间的上下文，最多到指定的行数，从而合并相邻的块。\n\
  \n## -W, --function-context\n\n显示更改周围的完整函数。\n\n## --exit-code\n\n使程序以类似于 (1) 的状态码退出。即，如果有差异则退出码为\
  \ 1，0 表示没有差异。\n\n## --quiet\n\n禁用程序的所有输出。隐含 `--exit-code`。\n\n## --ext-diff\n\n\
  允许执行外部 diff 助手。如果你通过 (5) 设置了外部 diff 驱动程序，则需要配合 (1) 等选项使用此选项。\n\n## --no-ext-diff\n\
  \n不允许外部 diff 驱动程序。\n\n## --textconv, --no-textconv\n\n在比较二进制文件时允许（不允许）运行外部文本转换过滤器。详情见\
  \ (5)。由于 textconv 过滤器通常是单向转换，生成的差异适用于人类阅读，但无法被应用。由于由于原因，textconv 过滤器默认仅对 (1) 和 (1)\
  \ 启用，而不用于 (1) 或 diff plumbing 命令。\n\n## --ignore-submodules[=<when>]\n\n在生成差异时忽略对子模块的更改。`<when>`\
  \ 可以是 \"none\"、untracked\"、dirty\" 或 \"all\"默认为 all）。使用 \"none\" 时，当子模块包含未跟踪或修改的文件，或者其\
  \ HEAD 与父项目中记录的提交不同时，会将子模块视为已修改，并可覆盖 (1) 或 (5) 中 *ignore* 选项的任何设置。使用 \"untracked\"\
  \ 时，如果子模块仅包含未跟踪的内容，则不将其视为脏（但仍对其修改内容进行扫描）。使用 \"dirty\" 会忽略对子模块工作树的所有更改，仅显示存储在父项目中的提交更改（这是\
  \ 1.7.0 之前的行为）。使用 \"all\" 会隐藏对子模块的所有更改。\n\n## --src-prefix=<prefix>\n\n显示指定的源前缀代替\
  \ \"a/\"。\n\n## --dst-prefix=<prefix>\n\n显示指定的目标前缀代替 \"b/\"。\n\n## --no-prefix\n\
  \n不显示任何源或目标前缀。\n\n关于这些常用选项的更详细解释，请见 (7)。\n\n## -1 --base, -2 --ours, -3 --theirs,\
  \ -0\n\n分别与“基础”版本、“我们的分支”或“他们的分支”进行对比。使用这些选项时，不会显示合并条目的差异。\n\n默认是与我们的分支 (-2) 以及清理解析的路径进行对比。可以提供\
  \ -0 选项来省略未合并条目的差异输出，仅显示“Unmerged”。\n\n## -c, --cc\n\n此比较阶段 2（我们的分支）、阶段 3（他们的分支）和工作树文件，并输出一个合并差异，类似于\
  \ *diff-tree* 使用这些标志显示合并提交的方式。\n\n## -q\n\n即使文件不存在也保持静默\n\n## 原始输出格式\n\n来自 \"git-diff-index\"\
  、git-diff-tree\"、git-diff-files\" 和 `git diff --raw` 的原始输出格式非常相似。\n\n这些命令都比较两组事物；但比较的对象有所不同：\n\
  \n```\ngit-diff-index <tree-ish>\n```\n比较 `<tree-ish>` 和文件系统上的文件。\n\n```\ngit-diff-index\
  \ --cached <tree-ish>\n```\n比较 `<tree-ish>` 和索引。\n\n```\ngit-diff-tree [-r] <tree-ish-1>\
  \ <tree-ish-2> [<pattern>...]\n```\n比较由两个参数指定的树。\n\n```\ngit-diff-files [<pattern>...]\n\
  ```\n比较索引和文件系统上的文件。\n\n\"git-diff-tree\" 命令在输出开始时打印比较对象的哈希值。之后，所有命令都会为每个更改的文件打印一行输出。\n\
  \n输出行的格式化如下：\n\n```\nin-place edit :100644 100644 bcd1234... 0123456... M file0\
  \ copy-edit :100644 100644 abcd123... 1234567... C68 file1 file2 rename-edit :100644\
  \ 100644 abcd123... 1234567... R86 file1 file3 create :000000 100644 0000000...\
  \ 1234567... A file4 delete :100644 000000 1234567... 0000000... D file5 unmerged\
  \ :000000 000000 0000000... 0000000... U file6\n```\n\n\n\n\n也就是说，从左到右：\n\n1. 一个冒号。\n\
  2. `\"src\"` 的模式；如果是创建或未合并，则为 `000000`。\n3. 一个空格。\n4. `\"dst\"` 的模式；如果是删除或未合并，则为\
  \ `000000`。\n5. 一个空格。\n6. `\"src\"` 的 `sha1`；如果是创建或未合并，则为 `0{40}`。\n7. 一个空格。\n8.\
  \ `\"dst\"` 的 `sha1`；如果是创建、未合并或“查看工作树”，则为 `0{40}`。\n9. 一个空格。\n10. 状态，后面跟一个可选的 `\"\
  score\"` 数字。\n11. 使用 `-z` 选项时为制表符（TAB）或 NUL 字符。\n12. `\"src\"` 的路径。\n13. 使用 `-z`\
  \ 选项时为制表符或 NUL；仅存在于 C 或 R 类型。\n14. `\"dst\"` 的路径；仅存在 C 或 R 类型。\n15. 使用 `-z` 选项时为\
  \ LF 或 NUL，用于结束记录。\n\n可能的状态字母有：\n- A：添加文件\n- C：将文件复制到新文件中\n- D：删除文件\n- M：修改文件的内容或模式\n\
  - R：重命名文件\n- T：更改文件类型\n- U：文件未合并（在提交之前，你必须完成合并）\n- X：“未知”更改类型（极可能是一个 bug，请报告它）\n\
  \n状态字母 `C` 和 `R` 后面总是会跟上分数（表示移动或复制的源和目标之间的相似性百分比）。状态字母 `M` 后面在文件重写时可能会跟上一个分数（表示差异性百分比）。\n\
  \n如果文件在文件系统中是新的且与索引不同步，则 `<sha1>` 显示为全 0。\n\n示例：\n```\n:100644 100644 5be4a4......\
  \ 000000...... M file.c\n```\n\n当不使用 `-z` 选项时，路径中的 TAB、LF 和反斜杠字符分别表示为 `\\t`、`\\\
  n` 和 `\\\\`。\n\n## 合并的差异格式\n\n`git-diff-tree`、`git-diff-files` 和 `git-diff --raw`\
  \ 可以接受 `-c` 或 `--cc` 选项来为合并提交生成差异输出。输出与上述描述的格式不同之处：\n\n1. 每个父节点都有一个冒号。\n2. 有多个 `\"\
  src\"` 模式和 `\"src\"` sha1。\n3. 状态是每个父节点状态字符的拼接。\n4. 没有可选的 `\"score\"` 数字。\n5. 单路径，仅针对\
  \ `\"dst\"`。\n\n示例：\n```\n::100644 100644 100644 fabadb8... cc95eb0... 4866510...\
  \ MM describe.c\n```\n\n注意，“合并差异”（combined diff）仅列出从所有父节点修改的文件。\n\n## 使用 -P 生成补丁\n\
  \n当运行 `git-diff-index`、`git-diff-tree` 或 `git-diff-files` 并带有 `-p` 选项，不带 `--raw`\
  \ 选项的 `git diff`，或带有 `-p` 选项的 `git log` 时，它们不会产生上述输出；而是产生一个补丁文件。你可以通过 `GIT_EXTERNAL_DIFF`\
  \ 和 `GIT_DIFF_OPTS` 环境变量来自定义此类补丁的创建。\n\n`-p` 选项产生的内容与传统的 diff 格式略有不同：\n\n1. 前面有一个这样的\
  \ \"git diff\" 头部：\n```\ndiff --git a/file1 b/file2\n```\n除非涉及重命名/复制，否则 `a/` 和 `b/`\
  \ 文件名是相同的。具体来说，即使是创建或删除，也不会用 `/dev/null` 替代 `a/` 或 `b/` 文件名。当涉及重命名/复制时，`file1` 和\
  \ `file2` 分别显示重命名/复制的源以及重命名/复制产生的文件名。\n\n2. 后面跟着一个或多个扩展头部行：\n```\nold mode <mode>\
  \ new mode <mode> deleted file mode <mode> new file mode <mode> copy from <path>\
  \ copy to <path> rename from <path> rename to <path> similarity index <number> dissimilarity\
  \ index <number> index <hash>..<hash> <mode>\n```\n文件模式以 6 位八进制数字打印，包括文件类型和文件权限位。扩展头部中的路径不包含\
  \ `a/` 和 `b/` 前缀。相似性索引是未更改行的百分比，差异性索引是更改行的百分比。这是一个向下取整的整数，后面跟着一个百分号。因此，100% 的相似性索引值留给两个相同的文件，而\
  \ 100% 的差异意味着旧文件中没有某一行进入了新文件。索引行包含了更改前后的 SHA-1 校验和。如果文件模式没有变化，则包含 `<mode>`；否则，用单独的行指示旧模式。\n\
  \n3. 路径中的 TAB、LF、双引号和反斜杠字符分别表示为 `\\t`、`\\n`、`\\\"` 和 `\\\\`。如果需要此类替换，则整个路径将放在双引号中。\n\
  \n4. 所有 `file1` 文件引用提交前的文件，而 `file2` 文件引用提交后的文件。\n\n## 合并差异格式\n\n任何生成差异的命令都可以接受\
  \ `-c` 或 `--cc` 选项来产生合并的*差异*（combined diff）。这是为了审查合并更改。\n\n1. 前面有一个这样的 \"git diff\"\
  \ 头部（使用 `-c` 选项）：\n```\ndiff --combined file\n```\n或者如下（使用 `--cc` 选项）：\n```\ndiff\
  \ --cc file\n```\n\n2. 后面跟着一个或多个扩展头部行（此示例显示两个父节点的合并）：\n```\nindex <hash>..<hash>\
  \ mode <mode>,<mode>\n```\n只有当至少一个 `<mode>` 不同时，才会出现 `mode <mode>,<mode>` 行。关于检测内容的扩展头部旨在用于两个\
  \ `<tree-ish>` 的差异，不用于合并差异格式。\n\n3. 后面跟着两行的源文件/目标文件头部：\n```\n--- a/file\n+++ b/file\n\
  ```\n类似于传统*统一*格式的双行头部，使用 `/dev/null` 来指示创建或删除的文件。\n\n4. 块头部格式经过修改，以防止人们误将其传递给 `-p`：\n\
  ```\n@@@ <from-file-range> <from-file-range> <to-file-range> @@@\n```\n合并差异格式的块头部中有（父节点数量\
  \ + 1）个 `@` 字符。与传统的*统一*格式显示两个文件 A 和 B 并带有单列 `-`（表示 A 有但 B 无）、`+`（表示 A 无但 B 有）或 `\"\
  \ \"`（表示未更改）不同，这种格式比较两个或多个文件 `file1, file2,...` 与一个文件 X，并显示 X 与每个文件的差异。每个 `fileN`\
  \ 的一个列都置于输出行前面，以说明 X 的行与其不同之处。\n\n第 `N` 列中的 `-` 意味着该行出现在 `fileN` 中但没有出现在结果中。第 `N`\
  \ 列中的 `+` 意味着该行出现在结果中，而 `fileN` 没有该行（也就是说，从该父节点的角度来看，该行被添加了）。\n\n\n\n\n在上面的示例输出中，函数签名在两个文件中都发生了变化（因此在\
  \ `file1` 和 `file2` 中都删除了两个部分，并加上 `++` 表示添加的一行代码既没有出现在 `file1` 中也没有出现在 `file2` 中）。此外，还有\
  \ 8 行与 `file1` 相同但未出现在 `file2` 中（因此以 `+` 为前缀标记）。\n\n当使用 `git diff-tree -c` 显示时，它会将合并提交的父节点与合并结果进行比较（即\
  \ `file1..fileN` 是父节点）。当使用 `git diff-files -c` 显示时，它会将两个未解析的合并父节点与工作树文件进行比较（即 `file1`\
  \ 是阶段 2，亦“我们的版本”，“file2` 是阶段 3，亦“他们的版本”）。\n\n其他 Diff 格式\n\n`--summary` 选项描述新添加、删除、重命名和复制的文件。`--stat`\
  \ 选项在输出中添加 `(1)` 图表。这些选项可以与其他选项（如 `-p`）结合使用，旨在供人类阅读。\n\n当显示涉及重命名或复制的更改时，`--stat`\
  \ 输出通过合并路径的公共前缀和后缀来紧凑地格式化路径。例如，将 `arch/i386/Makefile` 移动到 `arch/x86/Makefile` 同时修改\
  \ 4 行的更改将显示如下：\n\n`arch/{i386 => x86}/Makefile | 4 +--`\n\n`--numstat` 选项提供 `(1)`\
  \ 信息，但设计用于便于机器读取。`--numstat` 输出中的条目如下：\n\n`1 2 README 3 1 arch/{i386 => x86}/Makefile`\n\
  \n即，从左到右：\n\n1. 添加的行数；\n2. 一个制表符；\n3. 删除的行数；\n4. 一个制表符；\n5. 路径（可能包含重命名/复制信息）；\n\
  6. 换行符。\n\n当 `-z` 输出选项生效时，输出格式如下：\n\n`1 2 README NUL 3 1 NUL arch/i386/Makefile\
  \ NUL arch/x86/Makefile NUL`\n\n即：\n1. 添加的行数；\n2. 一个制表符；\n3. 删除的行数；\n4. 一个制表符；\n\
  5. 一个 `NUL`（仅在重命名/复制时存在）；\n6. 镜像前的路径；\n7. 一个 `NUL`（仅在重命名/复制时存在）；\n8. 镜像后的路径（仅在重命名/复制时存在）；\n\
  9. 一个 `NUL`。\n\n在重命名情况下，镜像路径之前的额外 `NUL` 是为了让读取输出的脚本判断当前读取的记录是单路径记录还是重命名/复制记录，而无需预读。在读取添加和删除行后，读取到\
  \ `NUL` 即可获得路径，但如果它是 `NUL`，则该记录将显示两个路径。\n\n# Git-Diff-Index\n\n## 名称\n\n`git-diff-index`\
  \ - 比较树与工作树或索引\n\n## 概要\n\n`git diff-index [-m] [--cached] [<common diff options>]\
  \ <tree-ish> [<path>...]`\n\n## 描述\n\n将树对象中找到 blob 内容和模式与工作树中对应的跟踪文件比较，或与索引中对应的路径比较。当存在\
  \ `<path>` 参数时，仅比较匹配这些模式的路径。否则，将比较所有跟踪文件。\n\n### 选项\n\n- `-p, -u, --patch`\n生成补丁（参见生成补丁的章节）。\n\
  \n- `-s, --no-patch`\n抑制 diff 输出。适用于像 `git show` 这样默认显示补丁的命令，或取消 `--patch` 的效果。\n\
  \n- `-U<n>, --unified=<n>`\n生成具有 `<n>` 行上下文的 diff，而不是通常的三个行。隐含 `-p`。\n\n- `--raw`\n\
  以原始格式生成 diff。这是默认设置。\n\n- `--patch-with-raw`\n`-p --raw` 的别名。\n\n- `--minimal`\n\
  花费额外时间以确保产生尽可能小的 diff。\n\n- `--patience`\n使用“patience diff”算法生成 diff。\n\n- `--histogram`\n\
  使用“histogram diff”算法生成 diff。\n\n- `--diff-algorithm={patience|minimal|histogram|myers}`\n\
  选择一种 diff 算法。其变体如下：\n\n- `default, myers`: 基础贪婪 diff 算法。目前是默认值。\n- `minimal`: 花费额外时间确保产生尽可能小的\
  \ diff。\n- `patience`: 在生成补丁时使用“patience diff”算法。\n- `histogram`: 该算法扩展了 patience\
  \ 算法以“支持低频公共元素”。\n\n例如，如果你将 `diff.algorithm` 变量配置为默认值并并使用默认值，则必须使用 `--diff-algorithm=default`\
  \ 选项。\n\n- `--stat[=<width>[,<name-width>[,<count>]]]`\n生成 diffstat。默认情况下，将使用尽可能的空间用于文件名部分，其余用于图表部分。最大宽度默认为终端宽度，如果没有连接到终端则为\
  \ 80 列，并可以通过 `<width>` 覆盖。通过在逗号后提供另一个宽度 `<name-width>` 可以限制文件名部分的宽度。图部分的宽度可以通过使用\
  \ `--stat-graph-width=<width>`（影响所有生成统计图表的命令）或设置 `diff.statGraphWidth=<width>` 来限制。\n\
  \n- `--numstat`\n类似于 `--stat`，但以十进制显示添加和删除的行数，且不缩写。\n\n- `--shortstat`\n仅输出 `--stat`\
  \ 的最后一行，包含文件总数以及添加和删除的行数。\n\n- `--dirstat[=<param1,param2,...>]`\n输出每个子目录更改的分布。dirstat\
  \ 的行为可以通过传递逗号分隔的参数列表进行自定义。默认由 `diff.dirstat` 配置控制（见 1）。可用参数如下：\n\n- `changes`: 通过计算从源删除或添加到目的地的行来计算\
  \ dirst 数字。这忽略文件内部的移动。也就是说，文件内的排序不被视为更改。这是未提供参数时的默认行为。\n- `lines`: 通过基于行的 diff 分析来计算\
  \ dirst 数字，并汇总删除/添加计数。（对于二进制文件，计算 64 字节块，因为二进制文件没有自然的行概念）。这比 `changes` 行为开销更大，但它会计算文件内的排序。输出结果与其他\
  \ `--stat` 选项一致。\n- `files`: 通过计算更改的文件数量来计算 dirst 数字。每个更改的文件在 dirstat 中计数相等。这是计算成本最低的\
  \ dirstat 行为，因为它无需查看文件内容。\n- `cumulative`: 同时为父目录计算子目录的更改。注意，使用累计时，报告的百分比总和可能会超过\
  \ 100%。默认（非累计）行为可以通过 `noncumulative` 参数指定。\n- `<limit>`: 整数参数指定截止百分比（默认为 3%）。贡献小于此百分比的目录不会显示在输出中。\n\
  \n示例：以下命令将计算更改的文件，忽略占比小于 10% 的目录，并将子目录计数累计到父目录：`--dirstat=files,10,cumulative`。\n\
  \n- `--summary`\n输出扩展头（如创建、重命名和模式更改）的压缩摘要。\n\n- `--patch-with-stat`\n`-p --stat`\
  \ 的别名。\n\n- `-z`\n当给出 `--raw`、`--numstat`、`--name-only` 或 `--name-status` 时，不要处理路径并使用\
  \ NUL 作为输出字段终止符。如果没有此选项，每个输出的路径将 TAB、LF、双引号和反斜杠字符替换为 `\\t`、`\\n`、`\\\"` 和 `\\\\\
  `，如果发生了其中任何替换，则路径将用双引号包围。\n\n- `--name-only`\n仅显示更改的文件名。\n\n- `--name-status`\n\
  显示更改的文件名及其状态。\n\n\n\n仅显示更改文件的名称和状态。查看 `--diff-filter` 选项的描述以了解状态字母的含义。\n\n### `--submodule[=<format>]`\n\
  指定显示子模块差异的方式。当给出 `--submodule` 或 `--submodule=log` 时，使用 `log` 格式。该格式列出范围内的提交，类似于\
  \ `(1)summary` 的格式。省略 `--submodule` 选项或指定 `--submodule=short`，则使用 `short` 格式。该格式仅显示范围开头和结尾的提交名称。可以通过\
  \ `diff.submodule` 配置变量进行调整。\n\n### `--color[=<when>]`\n显示彩色差异。`--color`（即不带 `<when>`）与等同于\
  \ `--color=always`。`<when>` 可以是 `always`、`never` 或 `auto` 之一。\n\n### `--no-color`\n\
  关闭彩色差异。它等同于 `--color=never`。\n\n### `--word-diff[=<mode>]`\n显示单词差异，使用 `<mode>` 来分隔更改的单词。默认情况下，单词由空白字符分隔；见下文的\
  \ `--word-diff-regex`。`<mode>` 默认为 `plain`，且必须是以下之一：\n\n*   **color**:\n    仅使用颜色突出显示更改的单词。隐含\
  \ `--color`。\n*   **plain**:\n    将单词显示为 `[-removed-]` 和 `{+added+}`。如果分隔符出现在输入中，则不尝试对其进行转义，因此输出可能存在歧义。\n\
  *   **porcelain**:\n    使用一种专用于脚本读取的特殊行 格式。添加/删除/未更改的运行将以标准的统一差异格式打印，行首以 `+/-`/`\
  \ ` 字符开头并延伸到行尾。输入中的换行由单独占一行的波浪 `~` 表示。\n*   **none**:\n    再次禁用单词差异。\n\n注意，尽管第一个模式名为\
  \ `color`，但如果启用，`color` 将在所有模式下突出显示更改的部分。\n\n### `--word-diff-regex=<regex>`\n使用\
  \ `<regex>` 来决定什么是一个单词，而不是将连续的非空白字符视为单词。如果尚未启用，则也会隐含 `--word-diff`。\n\n`<regex>`\
  \ 的每个非重叠匹配项都被视为一个单词。这些匹配项之间的任何内容都被视为空白字符并在查找差异时被忽略！你可能想向你的正则表达式中添加 `|[^[:space:]]`\
  \ 以确保它匹配所有非空白字符。包含换行符的匹配项会在换行处被静默截断！\n\n正则也可以通过 diff 驱动程序或配置选项设置，见 `(1)` 或 `(1)`。显式提供它将覆盖任何\
  \ diff 驱动程序或配置设置。diff 驱动程序覆盖配置设置。\n\n### `--color-words[=<regex>]`\n等同于 `--word-diff=color`\
  \ 加上（如果指定了正则）`--word-diff-regex=<regex>`。\n\n### `--no-renames`\n关闭重命名检测，即使配置文件默认执行该操作。\n\
  \n### `--check`\n如果更改引入了空格错误则发出警告。什么被视为空格错误由 `core.whitespace` 配置控制。默认情况下，尾随空格（包括由空白组成的行）以及行初始缩进内紧跟在制表符后的空格字符被视为空格错误。如果发现问题，则以非零状态退出。与\
  \ `--exit-code` 不兼容。\n\n### `--ws-error-highlight=<kind>`\n以 `color.diff.whitespace`\
  \ 指定颜色突出显示由 `<kind>` 指定行上的空格错误。`<kind>` 是旧的、新的、上下文的逗号分隔列表。当未给出此选项时，仅突出显示新行的空格错误。例如，`--ws-error-highlight=new,old`\
  \ 会突出显示被删除和添加行的空格错误。`all` 可以作为 `old,new,context` 的简写。\n\n### `--full-index`\n在生成补丁格式输出时，在\
  \ `\"index\"` 行上显示完整的原始和后续 blob 对象名称，而不是前几个字符。\n\n### `--binary`\n除了 `--full-index`\
  \ 之外，输出一个可以使用 `git-apply` 应用的二进制差异。\n\n### `--abbrev[=<n>]`\n在 `diff-raw` 格式输出和\
  \ `diff-tree` 行中，不显示完整的 40 字节十六进制对象名称，而是显示部分前缀。这与上述 `--full-index` 选项独立，后者控制 diff-patch\
  \ 输出格式。可以通过 `--abbrev=<n>` 指定非默认数字位数。\n\n### `-B[<n>][/<m>], --break-rewrites[=[<n>][/<m>]]`\n\
  将完全重写的更改拆分为删除和创建的对。此有两个作用：\n\n1.  它影响等同于文件完全重写的更改的处理方式，使其不是一系列删除和插入与极少数在文本上匹配的上下文行混合在一起，而是作为所有旧内容的单个删除，随后是由于所有新内容的单个插入。数字\
  \ `m` 控制 `-B` 选项的这方面（默认为 60%）。`-B/70%` 指定如果结果中剩余少于 30% 的原始内容，则 Git 将其视为完全重写（否则生成的补丁将是一系列混合了上下文行的删除和插入）。\n\
  2.  当与 `-M` 一起使用时，完全重写的文件也被视为重名的源（通常 `-M` 只考虑消失的文件作为重名的源），且数字 `n` 控制 `-B` 选项的这方面（默认为\
  \ 50%）。`-B20%` 指定与文件大小相比增加和删除达到 20% 或以上的更改有资格被 pick 选择为重命名到另一个文件的可能源。\n\n### `-M[<n>],\
  \ --find-renames[=<n>]`\n检测重命名。如果指定了 `n`，它是相似性索引的阈值。例如，`-M90%` 意味着如果文件超过 90% 没有更改，Git\
  \ 应该将一个删除/添加对视为重命名。如果没有 % 号，该数字被读作分值，前面有一个小数点。即 `-M5` 变为 `0.5`，因此等同于 `-M50%`。要将检测限制为精确重命名，请使用\
  \ `-M100%`。默认相似性索引为 50%。\n\n### `-C[<n>], --find-copies[=<n>]`\n检测复制以及复制。见 `--find-copies-harder`。如果指定了\
  \ `n`，它的含义与 `-M<n>` 相同。\n\n### `--find-copies-harder`\n出于性能考虑，默认情况下 `-C` 选项仅在复制的原始文件在同一更改集中被修改时才查找复制。此标志使命令检查未修改的文件作为候选源。对于大型项目，这是一个非常昂贵的操作，请谨慎使用。提供多个\
  \ `-C` 选项的效果相同。\n\n### `-D, --irreversible-delete`\n省略删除操作的镜像（preimage），即仅打印头信息，但不打印镜像与\
  \ `/dev/null` 之间的差异。生成的补丁不是用于 `patch` 或 `git apply`；这仅适用于只想关注更改后文本的人。此外，输出显然缺少反向应用此类补丁的信息，因此有了该选项的名称。与\
  \ `-B` 配合使用时，还会省略删除/创建对中删除部分的镜像。\n\n### `-l<num>`\n`-M` 和 `-C` 选项需要 `O(n²)` 处理时间，其中\
  \ `n` 是潜在重命名/复制目标的数量。此选项在重命名/复制目标超过指定数字时防止重命名/复制检测运行。\n\n### `--diff-filter=[(A|C|D|M|R|T|U|X|B)...[*]]`\n\
  仅选择新增 (A)、复制 (C)、删除 (D)、修改 (M)、重命名 (R)、类型（例如普通文件、符号链接、子模块...）更改 (T)、未合并 (U)、未知 (X)\
  \ 或配对损坏 (B) 的文件。可以使用过滤字符的任何组合（包括空组合）。当将 `*`（全有或无）添加到组合中时，如果比较中有任何一个符合其他标准的文件，则选择所有路径；如果没有符合其他标准的文件，则不选择任何内容。\n\
  \n### `-S<string>`\n查找文件中更改了指定字符串出现次数（即添加/删除）的差异。旨在供脚本人员使用。\n\n\n\n当你正在寻找某个特定的代码块（如结构体），并想知道该代码块自诞生以来的历史时，此功能非常有用：反复使用该功能，将感兴趣的代码块的镜像部分回馈给\
  \ `-S`，直到获取该代码块的最早版本。\n\n`-G<regex>`\n\n查找补丁文本中包含匹配 `<regex>` 的新增/删除行的差异。\n\n为了说明\
  \ `-S<regex> --pickaxe-regex` 和 `-G<regex>` 之间的区别，请考虑在同一文件中具有以下差异的提交：\n\n```\n+\
  \ return !regexec(regexp, two->ptr, 1, &regmatch, 0); ... - hit = !regexec(regexp,\
  \ mf2.ptr, 1, &regmatch, 0);\n```\n\n虽然 `git log -G\"regexec\\(regexp\"` 会显示此提交，但\
  \ `git log -S\"regexec\\(regexp\" --pickaxe-regex` 则不会显示（因为该字符串出现的次数没有变化）。\n\n更多信息请参阅\
  \ (7) 中的 `pickaxe` 条目。\n\n`--pickaxe-all`\n\n当 `-S` 或 `-G` 发现变化时，显示该变更集中的所有更改，而不仅仅是包含\
  \ `<string>` 变化的文件。\n\n`--pickaxe-regex`\n\n将传递给 `-S` 的 `<string>` 视为扩展 POSIX 正则表达式进行匹配。\n\
  \n`-O<orderfile>`\n\n按照 `<orderfile>`指定的顺序输出补丁，该文件每行有一个 shell glob 通配模式。这会覆盖 `diff.orderFile`\
  \ 配置变量（见 (1)）。要取消 `diff.orderFile`，请使用 `-O/dev/null`。\n\n`-R`\n\n交换两个输入；即显示索引或磁盘文件到树内容的差异。\n\
  \n`--relative[=<path>]`\n\n当从项目的子目录下运行时，可以通过此选项忽略该目录之外的更改，并显示相对于该目录的路径。当你不在子目录中（例如在裸仓库中）时，可以通过提供参数\
  \ `<path>` 来指定哪个子目录的相对输出。\n\n`-a, --text`\n\n将所有文件视为文本。\n\n`--ignore-space-at-eol`\n\
  \n忽略行尾（EOL）空白字符的变化。\n\n`-b, --ignore-space-change`\n\n忽略空白字符数量的变化。这会忽略行尾的空白，并将所有其他一个或多个空白字符序列视为等效。\n\
  \n`-w, --ignore-all-space`\n\n在比较行时忽略空白字符。即使其中一行有空白而另一行没有，也会忽略这些差异。\n\n`--ignore-blank-lines`\n\
  \n忽略所有行都为空的更改。\n\n`--inter-hunk-context=<lines>`\n\n显示差异块（diff hunks）之间的上下文，最多到指定的行数，从而合并相邻的差异块。\n\
  \n`-W, --function-context`\n\n显示更改周围的完整函数。\n\n`--exit-code`\n\n使程序以类似于 (1) 的代码退出。即，如果存在差异则以\
  \ 1 出，无差异则以 0 出。\n\n`--quiet`\n\n禁用程序的所有输出。隐含 `--exit-code`。\n\n`--ext-diff`\n\n\
  允许执行外部 diff 助手。如果你通过 (5) 设置了外部 diff 驱动程序，则需要配合 (1) 等选项一起使用此选项。\n\n`--no-ext-diff`\n\
  \n不允许外部 diff 驱动程序。\n\n`--textconv, --no-textconv`\n\n在比较二进制文件时允许（或不允许）运行外部文本转换过滤器。详情见\
  \ (5)。由于 `textconv` 过滤器通常是单向转换，生成的 diff 适用于人类阅读，但无法应用。因此，`textconv` 过滤器默认仅对 (1)\
  \ 和 (1) 启用，而不适用于 (1) 或 diff 底层管道命令。\n\n`--ignore-submodules[=<when>]`\n\n在生成差异时忽略子模块的更改。<when>`\
  \ 可以是 \"none\",\"untracked\",\"dirty\" 或 \"all\"，后者是默认值。使用 \"none\" 时，如果子模块包含未跟踪或修改的文件，或者其\
  \ HEAD 与主项目记录的提交不同，则认为子模块已修改，这可用于覆盖 (1) 或 (5) 中 `ignore` 选项的任何设置。使用 \"untracked\"\
  \ 时，如果子模块仅包含未跟踪的内容，则不认为它是脏（但仍会对修改内容进行扫描）。使用 \"dirty\" 会忽略对子模块工作树的所有更改，仅显示存储在主项目中的提交的更改（这是\
  \ 1.7.0 之前的行为）。使用 \"all\" 则隐藏对子模块的所有更改。\n\n`--src-prefix=<prefix>`\n\n显示指定的源前缀代替\
  \ \"a/\"。\n\n`--dst-prefix=<prefix>`\n\n显示指定的目标前缀代替 \"b/\"。\n\n`--no-prefix`\n\n\
  不显示任何源或目标前缀。\n\n关于这些常用选项的更详细解释，请参阅 (7)。\n\n`<tree-ish>`\n\n用于对比的树对象的 ID。\n\n`--cached`\n\
  \n完全不考虑磁盘文件。\n\n`-m`\n\n默认情况下，索引中记录但未检出的文件被报告为删除。此标记使 `git diff-index` 所有未检出的文件都是最新的。\n\
  \n## 原始输出格式\n\n\"git-diff-index\",\"git-diff-tree\",\"\"git-diff-files\" 和 `git\
  \ diff --raw` 的原始输出格式非常相似。\n\n这些命令都比较两组东西；但比较的对象不同：\n\n`git-diff-index <tree-ish>`\n\
  \n比较 `<tree-ish>` 和文件系统上的文件。\n\n`git-diff-index --cached <tree-ish>`\n\n比较 `<tree-ish>`\
  \ 和索引。\n\n`git-diff-tree [-r] <pattern>...]`\n\n比较树。\n\n`git-diff-files [<pattern>...]`\n\
  \n比较索引和文件系统。\n\n\n\n\n当运行 `git-diff-index`、`git-diff-tree` 或 `git-diff-files` 并带有\
  \ `-p` 参数，或者不带 `--raw` 参数的 `git diff`，带有 `-p` 参数的 `git log` 时，它们不会产生上述输出；而是产生一个补丁文件。你可以通过\
  \ `GIT_EXTERNAL_DIFF` 和 `GIT_DIFF_OPTS` 环境变量自定义此类补丁的创建。\n\n`-p` 参数产生的输出与传统的 diff\
  \ 格式略有不同：\n\n1. 它前面有一个如下所示的 `git diff` 头部：\n\n```diff\ndiff --git a/file1 b/file2\n\
  ```\n\n除非涉及重命名/复制，否则 `a/` 和 `b/` 文件名是相同的。特别是，即使是创建或删除，也**没有**使用 `/dev/null` 来代替\
  \ `a/` 或 `b/` 文件名。\n\n当涉及重命名/复制时，`file1` 和 `file2` 分别显示重命名/复制源文件名以及重命名/复制产生的文件名。\n\
  \n2. 它后面跟着一个或多个扩展头部行：\n\n```text\nold mode <mode> new mode <mode> deleted file mode\
  \ <mode> new file mode <mode> copy from <path> copy to <path> rename from <path>\
  \ rename to <path> similarity index <number> dissimilarity index <number> index\
  \ <hash>..<hash> <mode>\n```\n\n文件模式以 6 位八进制数字打印，包括文件类型和权限位。扩展头中的路径名不包含 `a/` 和 `b/`\
  \ 前缀。\n\n相似索引（similarity index）是未更改行的百分比，差异索引（dissimilarity index）是更改行的百分比。它是一个向下取整的整数，后跟一个百分号。因此，100%\
  \ 的相似索引值留给两个相同的文件，而 100%差异意味着旧文件中没有一行进入新文件。\n\n索引行包含了更改前后的 SHA-1 校验和。如果文件模式没有变化，则包含\
  \ `<mode>`；否则，用单独的行指示旧模式。\n\n3. 路径中的 `TAB`、`LF`、双引号和反斜杠字符分别表示为 `\\t`、`\\n`、`\\\"\
  ` 和 `\\\\`。如果需要此类替换，则整个路径名会被放在双引号中。\n\n4. 输出中所有的 `file1` 文件均指提交之前的文件，所有的 `file2`\
  \ 文件均指提交之后的文件。将每个更改顺序应用到每个文件是错误的。例如，此补丁将交换 `a` 和 `b`：\n\n```diff\ndiff --git a/a\
  \ b/b rename from a rename to b diff --git a/b b/a rename from b rename to a\n```\n\
  \n## 合并 diff 格式 (COMBINED DIFF FORMAT)\n\n任何生成 diff 的命令都可以显示合并时都可以 `-c` 或 `--cc`\
  \ 参数来产生“合并 diff”（combined diff）。这是显示带有 (1) 或 (11) 次合并时的默认格式。请注意，你也可以给这些命令中的任何一个提供\
  \ `-m` 参数，以强制生成合并单个父节点的 diff。\n\n`合并 diff` 格式如下：\n\n```diff\ndiff --combined describe.c\
  \ index fabadb8,cc95eb0..4866510 --- a/describe.c +++ b/describe.c @@@ -98,20 -98,12\
  \ +98,20 @@@ return (a_date > b_date) ? -1 : (a_date == b_date) ? 0 : 1; } - static\
  \ void describe(char *arg) -static void describe(struct commit *cmit, int last_one)\
  \ ++static void describe(char *arg, int last_one) { + unsigned char sha1[20]; +\
  \ struct commit *cmit; struct commit_list *list; static int initialized = 0; struct\
  \ commit_name *n; + if (get_sha1(arg, sha1) < 0) + usage(describe_usage); + cmit\
  \ = lookup_commit_reference(sha1); + if (!cmit) + usage(describe_usage); + if (!initialized)\
  \ { initialized = 1; for_each_ref(get_name);\n```\n\n1. 它前面有一个 `git diff` 头部，如下所示（当使用\
  \ `-c` 参数时）：\n\n```diff\ndiff --combined file\n```\n\n或者如下所示（当使用 `--cc` 参数时）：\n\n\
  ```diff\ndiff --cc file\n```\n\n2. 它后面跟着一个或多个扩展头部行（此示例显示了一个带有两个父节点的合并）：\n\n```text\n\
  index <hash>,<hash>..<hash> mode <mode>,<mode>..<mode> new file mode <mode> deleted\
  \ file mode <mode>,<mode>\n```\n\n`<mode>,<mode>..<mode>` 行仅在至少有一个 `<mode>` 与其他模式不同时出现。带有有关检测到的内容移动（重命名和复制检测）信息的扩展头设计用于用于两个\
  \ `<tree-ish>` 之间的 diff，不用于合并 diff 格式。\n\n3. 它后面跟着两行的源文件/目标文件头部\n\n```diff\n---\
  \ a/file ++++ b/file\n```\n\n与传统的 `unified` diff 格式的双行头部类似，使用 `/dev/null` 来指示已创建或删除的文件。\n\
  \n4. 块头部格式经过修改，以防止人们无意将其交给 `patch -p1`。合并 diff 格式是为了审查合并提交的更改而设计的，并非用于应用。更改与扩展 `index`\
  \ 头部类似：\n\n```diff\n@@@ <from-file-range> <from-file-range> <to-file-range> @@@\n\
  ```\n\n合并 diff 格式是为了审查合并提交的更改而设计的，并非用于应用。更改与扩展 `index` 头部类似。\n\n## 其他格式\n\n`--summary`\
  \ 参数描述新添加、删除、重命名和复制的文件。`--stat` 参数在输出中添加 (1) 图表。这些选项可以与其他参数（如 `-p`）组合，供人类阅读。\n\n\
  当显示涉及重命名或复制的更改时，`--stat` 输出通过组合路径名的公共前缀和后缀来格式化路径名。例如，将 `arch/i386/Makefile` 移动到\
  \ `arch/x86/Makefile` 同时修改 4 行的更改将显示为：\n\n```text\narch/{i386 => x86}/Makefile |\
  \ 4\n```\n\n`--numstat` 参数提供 (1) 信息，但旨在便于机器读取。`--numstat` 输出条目如下：\n\n```text\n1\
  \ 2 README 3 1 arch/{i386 => x86}/Makefile\n```\n\n即，从左到右：\n\n1. 添加的行数；\n2. 一个制表符；\n\
  3. 删除的行数；\n4. 一个制表符；\n5. 路径名（可能带有重命名/复制信息）；\n6. 换行符。\n\n当 `-z` 输出选项生效时，输出格式如下：\n\
  \n```text\n1 2 README NUL 3 1 NUL arch/i386/Makefile NUL arch/x86/Makefile NUL\n\
  ```\n\n即：\n\n1. 添加的行数；\n2. 一个制表符；\n3. 删除的行数；\n4. 一个制表符；\n5. 一个 `NUL`（仅在重命名/复制时存在）；\n\
  6. 镜像前的路径名；\n7. 一个 `NUL`（仅在重命名/复制时存在）；\n8. 后的路径名（仅在重命名/复制时存在）；\n9. 一个 `NUL`。\n\n\
  重命名情况下镜像路径前的额外 `NUL` 是为了让读取输出的脚本判断当前读取的记录是单路径记录还是重命名/复制记录，而无需预读。在读取添加和删除行后，读取到 `NUL`\
  \ 将得到路径名，但如果它是 `NUL`，则记录将显示两个路径。\n\n\n\n\n你可以选择是完全信任索引文件（使用 `--cached` 标记），还是让 diff\
  \ 逻辑将任何与状态（stat）状态不匹配的文件显示为“暂存更改”。这两种操作实际上非常有用。\n\n## 缓存模式 (CACHED MODE)\n\n如果指定了\
  \ `--cached`，它允许你询问：\n\n`显示我 HEAD 和当前索引内容之间的差异（即我通过 'git write-tree' 写入的内容）`\n\n\
  例如，假设你在工作目录中进行了工作，更新了索引中的某些文件，并准备好提交。你想确切地看到你将提交**什么**，而无需编写一个新的树对象并并通过那种方式进行比较。为了做到，你只需要执行：\n\
  \n```\ngit diff-index --cached HEAD\n```\n\n示例：假设我将 `commit.c` 重命名为 `git-commit.c`，并执行了\
  \ `update-index` 使该更改在索引文件中生效。`git diff-files` 将不会显示任何内容，因为索引文件与我的工作目录匹配。但执行 `git\
  \ diff-index` 就会显示：\n\n```\n:~/git> git diff-index --cached HEAD -100644 blob 4161aecc6700a2eb579e842af0b7f22b98443f74\
  \ commit.c +100644 blob 4161aecc6700a2eb579e842af0b7f22b98443f74 git-commit.c\n\
  ```\n\n你可以很容易地看到上面是一个重命名。\n\n事实上，`git diff-index --cached` 应该完全等同于实际执行 `git write-tree`\
  \ 并对其进行比较。只是在你只想检查自己所处位置时，这种方法要优雅得多。\n\n所以，当你通过 `git diff-index --cached` 来询问“我已经标记了哪些内容要提交，它们与之前的树有什么区别”时，基本上是非常用的。\n\
  \n## 非缓存模式 (NON-CACHED MODE)\n\n“非缓存”模式采取了不同的方法，在两种模式中可能更有用，因为它的功能无法通过 `git write-tree`\
  \ + `git diff-tree` 来模拟。因此，这是默认模式。非缓存版本提出的问题是：\n\n`显示 HEAD 与当前检出的树之间的差异 - 索引内容 _\
  \ 以及 _ 未更新的文件文件`\n\n这显然也是一个非常有用的问题，因为它告诉了你**可以**提交什么。再次，其输出与 `git diff-tree -r`\
  \ 的输出完全一致，但有一个转折。\n\n这个转折在于，如果某些文件与索引不匹配，我们没有为它们提供底层存储，因此我们使用魔术“全零”sha1 来显示这一点。假设你编辑了\
  \ `kernel/sched.c`，但尚未对它实际执行 `git update-index` —— 新状态下没有与之关联的“对象”，你会得到：\n\n```\n\
  :~/v2.6/linux> git diff-index --abbrev HEAD :100644 100664 7476bb... 000000... kernel/sched.c\n\
  ```\n\n即：它显示树已经发生了变化，且 `kernel/sched.c` 不是最新的，并可能包含新内容。全零的 sha1 意味着要获取真实的差异，你需要直接查看工作目录中的对象，而不是进行对象之间的差异比较。\n\
  \n## 注意事项\n\n与其他此类类型的命令一样，`git diff-index` 实际上根本不查看文件内容。所以可能 `kernel/sched.c` 并没有实际变化，只是你触碰了它。无论何种情况，这提示你需要执行\
  \ `git update-index` 来使索引同步。\n\n## 注意事项\n\n你可以同时看到显示“已更新”和“在工作目录中仍为脏”的文件。你始终可以判断哪个文件处于哪种状态，因为“已更新”的文件显示的是有效的\
  \ sha1，而“与索引不同步”的文件将始终具有特殊的全零 sha1。\n\n***\n\n# GIT-DIFF-TREE\n\n## 名称\n\n`git-diff-tree`\
  \ - 比较通过两个树对象找到 blob 的内容和模式\n\n## 语法\n\n`git diff-tree` [--stdin] [-m] [-s] [-v]\
  \ [--no-commit-id] [--pretty] [-t] [-r] [-c | --cc] [--root] [<common diff options>]\
  \ <tree-ish> [<tree-ish>] [<path>...]`\n\n## \n\n比较通过两个树对象找到 blob 的内容和模式。\n\n如果只给出一个\
  \ `<tree-ish>`，则将提交与其父提交进行比较（见下文 --stdin）。\n\n注意 `git diff-tree` 可以使用提交对象封装的树。\n\
  \n### 选项\n\n- `-p, -u, --patch`\n  生成补丁（参见生成补丁的章节）。\n- `-s, --no-patch`\n  抑制 diff\
  \ 输出。适用于像 `git show` 这样默认显示补丁的命令，或取消 `--patch` 的效果。\n- `-U<n>, --unified=<n>`\n\
  \  生成具有 `<n>` 行上下文的差异，而不是通常的三行。隐含了 `-p`。\n- `--raw`\n  以原始格式生成差异。这是默认设置。\n- `--patch-with-raw`\n\
  \  `-p` 的同义词。\n- `--minimal`\n  花费额外时间确保产生最小的差异。\n- `--patience`\n  使用“patience”算法生成差异。\n\
  - `--histogram`\n  使用“histogram”算法生成差异。\n- `--diff-algorithm={patience|minimal|histogram|myers}`\n\
  \  选择一种差异 算法。变体有：\n  - `myers`: 基础贪心算法。目前是默认值。\n  - `minimal`: 花费额外时间确保产生最小的差异。\n\
  \  - `patience`: 使用“patience”算法。\n  - `histogram`: 该算法扩展了 patience 算法以支持公共元素。\n\
  - `--stat[=<width>,<name-width>,<count>]`\n  生成统计。默认情况下，将使用尽可能的空间用于文件名，其余空间用于图表部分。最大宽度默认为终端，如果没有连接到终端则为\
  \ 80 列，并可以通过 `<width>` 覆盖。通过提供第三参数 `<count>`，你可以将输出限制为前 `<count>` 行，如果更多，则显示 ...。这些参数也可以通过\
  \ `--stat-width=<width>`、`--stat-name-width=<name-width>` 和 `--stat-count=<count>`\
  \ 单独设置。\n- `--numstat`\n  与 `--stat` 类似，但以十进制符号显示添加和删除的行数以及不带缩写的路径名，以便于机器处理。对于二进制文件，输出两个\
  \ `--` 而不是说 0。\n- `--shortstat`\n  仅输出 `--stat` 格式的最后一行，其中包含修改文件的总数，以及添加和删除的行数。\n\
  - `--dirstat[=<param1,param2,...>]`\n  输出每个子目录相对变化量的分布。`--dirstat` 的行为可以通过传递逗号分隔的参数列表进行自定义。默认值由\
  \ `diff.dirstat` 配置变量控制（见 (1)）。可用参数如下：\n  - `changes`: 通过计算从源删除的行或向目标添加的行数来计算 dirstat\
  \ 数字。这忽略了文件内部纯代码移动量。换句话说，在文件内重新排列行的计算不像与其他变化那样多。这是未提供参数时的默认行为。\n  - `lines`: 通过执行常规行的差异分析来计算\
  \ dirstat 数字，并累加删除/添加的行数。（对于二进制文件，计算 64 字节块，因为二进制文件没有自然的行概念）。这是比 `changes` 行为更耗资源的\
  \ dirstat 行为，但它将文件内重新排列行的计算与与其他变化一样多。\n  - `files`: 通过计算更改的文件数量来计算 dirstat 数字。每个更改的文件在\
  \ dirstat 分析中权重相等。这是计算上最廉价的 dirstat 行为，因为它完全查看文件内容。\n\n\n\n\n### 选项\n\n将子目录的更改也计入父目录。注意，当使用\
  \ `cumulative` 时，报告的百分比总和可能会超过 100%。默认（非累积）行为可以通过 `noncumulative` 参数指定。\n\n### `<limit>`\n\
  \n一个整数参数，用于指定截止百分比（默认为 3%）。变化小于此百分比的目录将不会显示在输出中。\n\n示例：以下命令将统计更改的文件，同时忽略变化少于总文件数\
  \ 10% 的目录，并在父目录中累积子目录计数：`--dirstat=files,10,cumulative`。\n\n### `--summary`\n\n\
  输出扩展头部信息的简要摘要，例如创建、重命名和模式更改。\n\n### `--patch-with-stat`\n\n`-p` `--stat` 的别名。\n\n\
  ### `-z`\n\n当给出 `--raw`、`--numstat`、`--name-only` 或 `--name-status` 时，不要处理路径名，并使用\
  \ `NUL` 作为输出字段分隔符。\n\n如果没有此选项，每个输出的路径名将把 `TAB`、`LF`、双引号和反斜杠分别替换为 `\\t`、`\\n`、`\\\
  \"` 和 `\\\\`，如果发生了其中任何替换，路径名将被包含在双引号中。\n\n### `--name-only`\n\n仅显示更改文件的名称。\n\n###\
  \ `--name-status`\n\n仅显示更改文件的名称和状态。查看 `--diff-filter` 选项的描述以了解状态字母的含义。\n\n### `--submodule[=<format>]`\n\
  \n指定子模块差异的显示方式。当给出 `--submodule` 或 `--submodule=log` 时，使用 `log` 格式。该格式列出范围内的提交，类似于\
  \ (1)summary 的。省略 `--submodule` 选项或指定 `--submodule=short` 则使用 `short` 格式。该格式仅显示范围开始和结束的提交名称。可以通过\
  \ `diff.submodule` 配置变量进行调整。\n\n### `--color[=<when>]`\n\n显示带颜色的差异。`--color`（即不带\
  \ `=<when>`）等同于 `--color=always`。`<when>` 可以 `always`、`never` 或 `auto` 之一。\n\n###\
  \ `--no-color`\n\n关闭彩色差异。它等同于 `--color=never`。\n\n### `--word-diff[=<mode>]`\n\n\
  显示单词差异，使用 `<mode>` 来分隔更改的单词。默认情况下，单词由空格分隔；见下文 `--word-diff-regex`。`<mode>` 默认为 `plain`，必须是以下之一：\n\
  \n*   **color**: 仅使用颜色突出更改的单词。隐含 `--color`。\n*   **plain**: 将单词显示为 `[-removed-]`\
  \ 和 `{+added+}`。如果输入中出现分隔符，则不尝试转义，因此输出可能存在歧义。\n*   **porcelain**: 使用一种专为脚本读取的特殊行格式。添加/删除/未更改的运行按通常的统一差异格式打印，每行以\
  \ `+/-` 或 ` ` 字符开头，并延伸到行尾。输入中的换行符由单独占一行的波浪号 `~` 表示。\n*   **none**: 再次禁用单词差异。\n\n\
  请注意，尽管第一种模式名为 color，但如果启用了颜色，`color` 将用于突出所有模式下的更改部分。\n\n### `--word-diff-regex=<regex>`\n\
  \n使用 `<regex>` 来决定什么是单词，而不是将连续的非空白字符视为单词。除非已启用，否则也隐含 `--word-diff`。\n\n`<regex>`\
  \ 的每个非重叠匹配都被视为一个单词。这些匹配之间的任何内容都被视为空格，并在查找差异时被忽略(!)。你可能想向你的正则表达式添加 `|[^[:space:]]`\
  \ 以确保它匹配所有非空白字符。包含换行符的匹配会在换行处被静默截断(!)。\n\n正则也可以通过 diff 驱动或配置选项设置，见 (1) 或 (1)。显式给出将覆盖任何\
  \ diff 驱动或配置设置。diff 驱动覆盖配置设置。\n\n### `--color-words[=<regex>]`\n\n等同于 `--word-diff=color`\
  \ 以及（如果指定了正则）`--word-diff-regex=<regex>`。\n\n### `--no-renames`\n\n关闭重命名检测，即使配置文件默认开启了。\n\
  \n### `--check`\n\n如果更改引入了空格错误则警告。什么被视为空格错误由 `core.whitespace` 配置控制。默认情况下，行尾空格（包括仅由空格组成的行）以及行初始缩进内紧随制表符的空格被视为空格错误。如果发现问题，则以非零状态退出。与\
  \ `--exit-code` 不兼容。\n\n### `--ws-error-highlight=<kind>`\n\n用 `color.diff.whitespace`\
  \ 指定的颜色突出 `<kind>` 指定行上的空格错误。`<kind>` 是用逗号分隔的列表 `old, new, context`。当未给出此选项时，仅突出新行中的空格错误。例如，`--ws-error-highlight=new,old`\
  \ 突出被删除和添加行的空格错误。所有都可以作为 `old,new,context` 的简写。\n\n### `--full-index`\n\n在生成补丁格式输出时，在“index”行上显示完整的前后镜像\
  \ blob 对象名称，而不是前几个字符。\n\n### `--binary`\n\n除了 `--full-index` 之外，输出可以使用 `git-apply`\
  \ 应用的二进制差异。\n\n### `--abbrev[=<n>]`\n\n在 diff-raw 格式输出和 diff-tree 头部行中不再显示完整的 40\
  \ 字节十六进制对象名称，而是显示部分前缀。这与上述控制 diff-patch 输出格式的 `--full-index` 选项独立。可以通过 `--abbrev=<n>`\
  \ 指定非默认的位数。\n\n### `-B[=<n>][/<m>], --break-rewrites[=<n>]]]]`\n\n将完全重写的更改分解为删除和创建对。这有两个用途：\n\
  \n它影响将一个相当于文件完全重写的更改处理方式，视为一次删除所有旧内容，随后是一次插入所有新内容，只有极少数行在文本上匹配作为上下文；数字 `m` 控制 `-B`\
  \ 选项的这方面（默认为 60%）。`-B70%` 指定当原始内容保留部分少于 30% 时，Git 才会将其考虑为完全重写（即否则生成的补丁将是一系列删除和插入的混合）。\n\
  \n当与 `-M` 使用时，完全重写的文件也被视为重命名源（通常 `-M` 只考虑消失的文件作为重命名源），数字 `n` 控制 `-B` 选项的这方面（默认为\
  \ 50%）。`-B20%` 指定与文件大小相比，添加和删除达到 20% 或更多的更改有资格被选为重命名到另一个文件的可能源。\n\n### `-M[=<n>],\
  \ --find-renames[=<n>]`\n\n检测重命名。如果指定了 `n`，它是相似性索引阈值（即与文件大小相比的添加/删除量）。例如，`-M90%`\
  \ 意味着如果文件有超过 90% 未更改，Git 应该将一个删除/添加对视为重命名。如果没有 % 符号，该数字被读取为分数，前面带有小数点。即，`-M5` 变为\
  \ `0.5`，因此等于 `-M50%`。同样，`-M05` 等于 `-M5%`。要将检测限制为精确重命名，请使用 `-M100%`。默认相似性索引为 50%。\n\
  \n### `-C[=<n>], --find-copies[=<n>]`\n\n检测拷贝以及重命名。见 `--find-copies-harder`。如果指定了\
  \ `n`，其含义与 `-M<n>`相同。\n\n### `--find-copies-harder`\n\n出于性能考虑，默认 `-C` 选项仅在拷贝的原文件在同一更改集中被修改时才查找拷贝。此标志使命令检查未修改的文件作为拷贝源的候选。对于大型项目来说这是一个非常昂贵的操作，请谨慎使用。提供多个\
  \ `-C` 选项效果相同。\n\n### `-D, --irreversible-delete`\n\n\n\n\n在删除操作时省略原始文件（preimage），即只打印头部，而不打印原始文件与\
  \ `/dev/null` 之间的差异。生成的补丁并非用于通过 `patch` 或 `git apply` 应用；它仅适用于那些只想专注于查看更改后文本的人员。此外，输出内容显然缺乏足够反向应用此类补丁的信息（即使是手动操作），这也是该选项命名的由来。\n\
  \n与 `-B` 配合使用时，在删除/创建对的删除部分也省略原始文件。\n\n### `-l<num>`\n\n`-M` 和 `-C` 选项需要 `O(n²)`\
  \ 处理时间，其中 `n` 是潜在重命名/复制目标的数量。如果重命名/复制目标的数量超过指定数量，此选项将防止重命名/复制检测运行。\n\n### `--diff-filter=[(A|C|D|M|R|T|U|X|B)...[*]]`\n\
  \n仅选择已添加 (A)、复制 (C)、删除 (D)、修改 (M)、重命名 (R)、类型发生变化（即普通文件、符号链接、子模块等类型） (T)、未合并 (U)、未知\
  \ (X) 或配对损坏 (B) 的文件。可以使用过滤器字符的任意组合（包括空组合）。当在组合中添加 `*`（全有全无）时，如果比较中存在任何符合其他标准的文件，则选择所有路径；如果没有没有符合其他标准的文件，则不选择任何内容。\n\
  \n### `-S<string>`\n\n查找更改文件中指定字符串出现次数（即添加/删除）的差异。供脚本编写人员使用。\n\n当你正在寻找一个精确的代码块（如\
  \ `struct`），并想知道该块自首次出现以来的历史时，此功能非常有用：迭代地使用该功能，将原始文件中的感兴趣的代码块馈回 `-S`，持续进行直到获得该代码块的最早版本。\n\
  \n### `-G<regex>`\n\n查找补丁文本中包含匹配 `<regex>` 的添加/删除行的差异。\n\n为了说明 `-S<regex> --pickaxe-regex`\
  \ 与 `-G<regex>` 之间的区别，考虑一个在同一文件中具有以下差异的提交：\n\n```\n+ return !regexec(regexp, two->ptr,\
  \ 1, &regmatch, 0); ... - hit = !regexec(regexp, mf2.ptr, 1, &regmatch, 0);\n```\n\
  \n虽然 `git log -G\"regexec\\(regexp\"` 会显示此提交，但 `git log -S\"regexec\\(regexp\" --pickaxe-regex`\
  \ 则不会（因为该字符串的出现次数没有变化）。\n\n更多信息请参见 (7) 中的 `pickaxe` 条。\n\n### `--pickaxe-all`\n\n\
  当 `-S` 或 `-G` 找到更改时，显示该变更集中的所有更改，而不仅仅是包含 `<string>` 更改的文件。\n\n### `--pickaxe-regex`\n\
  \n将传递给 `-S` 的 `<string>` 视为扩展 POSIX 正则表达式进行匹配。\n\n### `-O<orderfile>`\n\n按照 `<orderfile>`\
  \ 中指定的顺序输出补丁，该文件每行有一个 shell glob 模式。这会覆盖 `diff.orderFile` 配置变量（见 (1)）。要取消 `diff.orderFile`，请使用\
  \ `-O/dev/null`。\n\n### `-R`\n\n交换两个输入；即显示索引或磁盘文件到树内容的差异。\n\n### `--relative[=<path>]`\n\
  \n当从项目的子目录运行时，可以通过此选项告诉程序排除目录之外的更改，并显示相对于该目录的路径。当你不在子目录中（例如在裸仓库中）时，可以通过提供参数 `<path>`\
  \ 来指定输出相对于哪个子目录。\n\n### `-a, --text`\n\n将所有文件视为文本。\n\n### `--ignore-space-at-eol`\n\
  \n忽略行尾（EOL）空白的更改。\n\n### `-b, --ignore-space-change`\n\n忽略空白数量的变化。这会忽略行尾的空白，并将所有其他一个或多个空白字符序列视为等效。\n\
  \n### `-w, --ignore-all-space`\n\n在比较行时忽略空白。即使某一行有空白而另一行没有，也会忽略差异。\n\n### `--ignore-blank-lines`\n\
  \n忽略所有行均为空的更改。\n\n### `--inter-hunk-context=<lines>`\n\n显示差异块（hunks）之间的上下文，最多到指定的行数，从而合并距离彼此较的块。\n\
  \n### `-W, --function-context`\n\n显示更改周围的完整函数。\n\n### `--exit-code`\n\n使程序以类似于 (1)\
  \ 的状态码退出。即，如果有差异则以 1 退出，无差异则以 0 退出。\n\n### `--quiet`\n\n禁用程序的所有输出。隐含 `--exit-code`。\n\
  \n### `--ext-diff`\n\n允许执行外部 diff 助手。如果你通过 (5) 设置了外部 diff 驱动程序，则需要配合 (1) 等选项使用此选项。\n\
  \n### `--no-ext-diff`\n\n不允许使用外部 diff 驱动程序。\n\n### `--textconv, --no-textconv`\n\
  \n在比较二进制文件时允许（或禁止）运行外部文本转换过滤器。详情见 (5)。由于 textconv 过滤器通常是单向转换，生成的 diff 适用于人类阅读，但无法应用。出于此原因，textconv\
  \ 过滤器默认对 (1) 和 (1) 启用，而不对 (1) 或 diff 工具命令启用。\n\n### `--ignore-submodules[=<when>]`\n\
  \n在生成 diff 时忽略子模块。`<when>` 可以是 \"none\"、\"dirty\" 或 \"all\"，后者是默认值。使用 \"none\" 将考虑修改的子模块。使用\
  \ \"all\" 将隐藏所有子模块更改。\n\n### `--src-prefix=<prefix>`\n\n使用指定的源前缀代替 `a/`。\n\n###\
  \ `--dst-prefix=<prefix>`\n\n使用指定的目标前缀代替 `b/`。\n\n### `--no-prefix`\n\n不显示任何源或目标前缀。\n\
  \n关于这些常用选项的详细解释，请参见 (7)。\n\n`<tree-ish>`树的 ID。\n\n`<path>...` 如果提供，结果将限于匹配这些字符串之一的文件子集。即文件匹配\
  \ `/pattern1|pattern2|.../`。\n\n`-r` 递归进入树\n\n`-t` 显示树项本身以及子树。隐含 `-r`。\n\n### `--root`\n\
  \n指定 `--root` 时，初始提交将作为一个事件显示。这等同于对比空树的 diff。\n\n### `--stdin`\n\n指定 `--stdin` 时，命令不从命令行获取\
  \ `<tree-ish>` 参数。相反，它从标准输入读取包含两个 `<tree>`、一个 `<commit>` 或一组 `<commit>` 的行。（使用单个空格作为分隔符。）\n\
  \n给出两个树时，比较第一个树和第二个树。给出一个提交时，比较该提交及其父提交。给出的剩余提交将被视为第一个提交的父提交。\n\n当比较两个树时，在差异之前打印两个树的\
  \ ID（用空格分隔并换行终止）。当比较提交时，打印第一个（或唯一的）提交的 ID，后跟一个换行。\n\n以下标志进一步影响比较提交（但不影响树）的行为`-m`\
  \ 默认情况下，`git diff-tree --stdin` 不显示合并提交的差异。使用此标志，将显示该提交相对于所有父提交的差异。参见 `-c`。`-s`\
  \ 默认情况下，`git diff-tree --stdin` 显示差异，无论是机器可读格式（不带 `-p`）还是补丁格式（带 `-p*`）。这种输出可以被抑制。它仅配合\
  \ `-v` 标志时有用。\n\n`-v` 此标志导致 *git diff-tree --stdin* 在差异之前还显示提交信息。\n\n`--pretty[=<format>],\
  \ --format=<format>`\n\n\n\n\n以指定的格式美化打印提交日志的内容，其中 `<format>` 可以 `oneline`、`short`、`medium`、`full`、`fuller`、`email`、`raw`、`format:<string>`\
  \ 和 `tformat:<string>` 之一。当 `<format>` 不是上述格式且包含 `%placeholder` 时，它的作用类似于指定了 `--pretty=tformat:<format>`。\n\
  \n请参见“PRETTY FORMATS”部分获取每个格式的更多详细信息。当省略 `=<format>` 部分时，默认为 `medium`。\n\n注意：你可以在仓库配置中指定默认的美化格式（参见\
  \ (1)）。\n\n### `--abbrev-commit`\n\n此不再显示完整的 40 字节十六进制提交对象名称，而是仅显示部分前缀。可以使用 `--abbrev=<n>`\
  \ 指定非默认的位数（如果显示了 diff 输出，也会修改该输出）。\n\n这对于使用 80 列终端的用户来说，会让 `--pretty=oneline` 更具可读性。\n\
  \n### `--no-abbrev-commit`\n\n显示完整的 40 字节十六进制提交对象名称。这会抵消 `--abbrev-commit` 以及隐含它的选项（如\
  \ `--oneline`）。它还会覆盖 `log.abbrevCommit` 变量。\n\n### `--oneline`\n\n这是 `--pretty=oneline\
  \ --abbrev-commit` 结合使用的简写。\n\n### `--encoding=<encoding>`\n\n提交对象在它们的编码头中记录了用于日志消息的编码；此选项可用于命令按用户偏好的编码重新编码提交日志消息。对于非内部命令（plumbing\
  \ commands），默认为 UTF-8。请注意，如果一个对象声称编码为 X 且我们正在输出 X，则我们将原样输出对象；这意味着原始提交中的无效序列可能会被复制到输出中。\n\
  \n### `--notes[=<ref>]`\n\n在显示提交日志消息时，显示注释提交的注释（参见 (1)）。这是 `git log`、`git show`\
  \ 和 `git whatchanged` 命令在命令行没有给出 `--pretty`、`--format` 或 `--oneline` 时的默认设置。\n\n\
  默认情况下，显示的注释来自 `core.notesRef` 和 `notes.displayRef` 变量列出的注释引用（或相应的环境变量覆盖）。参见 (1)\
  \ 获取更多详细信息。\n\n通过可选的 `<ref>` 参数，显示此注释引用而不是默认的注释引用。如果该引用未限定，则被认为位于 `refs/notes/`\
  \ 下。\n\n可以组合多个 `--notes` 选项来控制显示哪些注释。例如：`--notes=foo` 将仅显示来自 `refs/notes/foo` 的注释；`--notes=foo\
  \ --notes` 将同时显示来自 `refs/notes/foo` 和默认注释引用的注释。\n\n### `--no-notes`\n\n不显示注释。这会抵消上述\
  \ `--notes` 选项，通过重置显示注释的注释引用列表来实现。选项按照命令行给出的顺序解析，例如，`--notes --notes=foo --no-notes\
  \ --notes=bar` 只显示来自 `refs/notes/bar` 的注释。\n\n### `--show-notes[=<ref>], --[no-]standard-notes`\n\
  \n这些选项已弃用。请使用上述 `--notes/--no-notes` 选项。\n\n### `--show-signature`\n\n通过将签名传递给 `gpg\
  \ --verify` 来检查签名提交对象的有效性并显示输出。\n\n### `--no-commit-id`\n\n`git diff-tree` 在适用时会输出一条带有提交\
  \ ID 的行。此标志抑制了提交 ID 的输出。\n\n### `-c`\n\n此标志更改合并提交的显示方式（这意味着它仅在给定一个 `<tree-ish>`\
  \ 或 `--stdin` 时有用）。它同时显示每个父节点到合并结果的差异，而不是逐个显示父节点与结果之间的成对差异（这是 `-m` 选项的作用）。此外，它仅列出从所有父节点都被修改的文件。\n\
  \n### `--cc`\n\n此标志更改合并提交补丁（patch）的显示方式，与 `-c` 选项类似。它隐含了 `-c` 和 `-p` 选项，并通过省略无趣的块（hunks）进一步压缩补丁输出，即这些块在父节点中的内容只有两种变体，且合并结果在未经修改的情况下选择了其中之一。当所有块都是无趣的时，不会显示提交本身和提交日志消息，就像任何其他“空差异”情况一样。\n\
  \n### `--always`\n\n即使差异本身为空，也显示提交本身和提交日志消息。\n\n## PRETTY FORMATS\n\n如果提交是合并，且美化格式不是\
  \ `oneline`、`email` 或 `raw`，则在 `Author:` 行之前插入额外行。该行以 \"Merge: \" 开头，并打印祖先提交的 sha1，用空格分隔。请注意，如果你限制了历史视图，列出的提交不一定是直接父节点提交的列表：例如，如果你只对与特定目录或文件的更改感兴趣。\n\
  \n有几种内置格式，你可以通过将 `pretty.<name>` 配置选项设置为另一个格式名称或下文描述的 `format:` 字符串来定义附加格式（参见 (1)）。以下是内置格式的详细信息：\n\
  \n### `oneline`\n\n```\n<sha1> <title line>\n```\n此设计初衷是尽可能紧凑。\n\n### `short`\n\n\
  ```\ncommit <sha1> Author: <author>\n<title line>\n```\n\n### `medium`\n\n```\n\
  commit <sha1> Author: <author> Date: <author date>\n<title line>\n```\n\n### `full`\n\
  \n```\ncommit <sha1> Author: <author> Date: <committer>\n<title line>\n```\n\n###\
  \ `fuller`\n\n```\ncommit <sha1> Author: <author> Date: <committer date>\n<title\
  \ line>\n<commit message>\n```\n\n### `email`\n\n```\nFrom <sha1> Author: <author>\
  \ Date: <author date>\n\n<title line>\n\n<commit message>\n```\n\n### `raw`\n\n\
  `raw` 格式显示整个提交。特别是 SHA1 是完整的，无论 --abbrev 如何，影响父节点。\n\n### `format:<string>`\n\n\
  `format:<string>` 格式允许你指定想要显示的信息。它的用法类似于 printf，不同之处在于你会得到一个换行符 `%n`。例如，`format:\"\
  The author of %h was %s\"` 会显示：\n\n```\nThe author of fe6eee was Junio Hamano, 23\
  \ hours ago\n```\n\n占位符为：\n\n- `%H`: 提交哈\n- `%h`: 短提交哈\n- `%T`: 树哈\n- `%t`: 短树哈\n\
  - `%P`: 父节点哈\n- `%p`: 父节点哈\n- `%an`: 作者名\n- `%aN`: 作者名（遵循 .mailmap，参见 (1) 或 (1)）\n\
  - `%ae`: 作者邮箱\n- `%aE`: 作者邮箱（遵循 .mailmap，参见 (1) 或 (1)）\n- `%ad`: 作者日期（遵循 --date=\
  \ ）\n- `%aD`: 作者日期，RFC222 样式\n- `%ar`: 作者日期，相对日期\n- `%at`: 作者日期，Unix 时间戳\n- `%ai`:\
  \ 作者日期，ISO 8601 格式\n- `%aI`: 作者日期，严格 ISO 8601 格式\n- `%cn`: 提交者名\n- `%cN`: 提交者名（遵循\
  \ .mailmap，参见 (1) 或 (1)）\n- `%ce`: 提交者邮箱\n- `%cE`: 提交者邮箱（遵循 .mailmap，参见 (1) 或 (1)）\n\
  - `%cd`: 提交者日期（遵循 --date= ）\n- `%cD`: 提交者日期，RFC222 样式\n `%cr`: 提交者日期，相对日期\n- `%ct`:\
  \ 提交者日期，Unix 时间戳\n- `%ci`: 提交者日期，ISO 8601 格式\n- `%cI`: 提交者日期，严格 ISO 8601 格式\n- `%d`:\
  \ 引用名，类似于 (1) 的 --decorate 选项\n- `%D`: 引用名，无 \" (\" \")\" 包裹\n- `%e`: 编码\n- `%s`:\
  \ 主题\n- `%f`: 安全的主题行，适用于文件名\n- `%b`: 正文\n- `%B`: 正文（未解析的主题和正文）\n- `%N`: 提交注释\n-\
  \ `%GG`: 签名提交的 GPG 原始验证消息\n- `%G?`: 签名良好显示“G”，签名错误显示“B”，良好但不可信的签名显示“U”，无签名显示“N”\n\
  - `%GS`: 显示签名提交的签名者名称\n\n\n\n\n\n- `%GK`: 显示用于签名已提交的密钥\n\n- `%gD`: reflog 选择器，例如\
  \ `refs/stash@{1}`\n\n- `%gd`: 简短的 reflog 选择器，例如 `stash@{1}`\n\n- `%gn`: reflog\
  \ 身份名称\n\n- `%gN`: reflog 身份名称（遵循 `.mailmap`，参见 (1) 或 (1)）\n\n- `%ge`: reflog 身份邮箱\n\
  \n- `%gE`: reflog 身份邮箱（遵循 `.mailmap`，参见 (1) 或 (1)）\n\n- `%gs`: reflog 主题\n\n- `%Cred`:\
  \ 将颜色切换为红色\n\n- `%Cgreen`: 将颜色切换为绿色\n\n- `%Cblue`: 将颜色切换为蓝色\n\n- `%Creset`: 重置颜色\n\
  \n- `%C(...)`: 规范，如 `color.branch.*` 配置选项所述；在开头添加 `auto` 将仅在日志输出启用了颜色时输出颜色（通过 `color.diff`、`color.ui`\
  \ 或 `--color` 启用，并且如果目标是终端，则遵循前者的 `auto` 设置）。单独的 `auto`（即 `%C(auto)`）将在后续占位符处开启自动染色，直到颜色再次切换。\n\
  \n- `%m`: 左、右或边界标记\n\n- `%n`: 换行符\n\n- `%%`: 原始 `%*`\n\n- `%x00`: 从十六进制代码打印一个字节\n\
  \n- `%w([<w>[,<i1>[,<i2>]]])`: 切换换行，类似于 (1) 的 `-w` 选项。\n\n- `%<(<N>[,trunc|ltrunc|mtrunc])`:\
  \ 使下一个占位符至少占据 `N` 列，必要时在右侧填充空格。如果输出超过 `N` 列，可以选择在开头（`ltrunc`）、中间（`mtrunc`）或结尾（`trunc`）处截断。注意，截断仅在\
  \ `N >= 2` 时才能正常工作。\n\n- `%<|(<N>)*`: 使下一个占位符至少占据到第 `N` 列，必要时在右侧填充空格\n\n- `%>(<N>)*`,\
  \ `%>|(<N>)*`: 分别类似于 `%<(<N>)*` 和 `%<|(<N>)*`，但在左侧填充空格\n\n- `%>>(<N>)*`, `%>>|(<N>)*`:\
  \ 分别类似于 `%>(<N>)*` 和 `%>|(<N>)*`，区别在于如果下一个占位符占据的空间比给定的多且其左侧有空格，则使用那些空格\n\n- `%><(<N>)*`,\
  \ `%><|(<N>)*`: 分别类似于 `% <(<N>)*` 和 `%<|(<N>)*`，但在两边都填充（即文本居中）\n\n**注意**\n\n某些占位符可能取决于传递给修订遍历引擎的其他选项。例如，`%g*`\
  \ reflog 选项除非我们正在遍历 reflog 条目（例如通过 `git log -g`），否则将插入空字符串。如果命令行上未提供 `--decorate`，`%d`\
  \ 和 `%D` 占位符将使用“短”装饰格式。\n\n如果你在占位符的 `%*` 之后添加 `+`（加号），则当且仅当占位符展开为非空字符串时，在展开之前插入一个换行符。\n\
  \n如果你在占位符的 `%*` 之后添加 `-`（减号），则当且仅当占位符展开为空字符串时，删除紧邻展开之前的换行符。\n\n如果你在占位符的 `%*` 之后添加\
  \ ` `（空格），则当且仅当占位符展开为非空字符串时，在展开之前插入一个空格。\n\n### tformat:\n\n`tformat:` 格式的工作方式与\
  \ `format:` 完全相同，不同在于它提供“终止符”语义而不是“分隔符”语义。换句话说，每个提交都 le 追加了消息终止符（通常是换行符），而不是在条目之间放置一个分隔符。这意味着单行格式的最后一个条目将用新行符正确终止，就像\
  \ \"oneline\" 格式一样。例如：\n\n```\n$ git log -2 --pretty=format:%h 4da45bef \\ | perl\
  \ -pe '$_ .= \" -- NO NEWLINE\\n\" unless /\\n/' 4da45be 7134973 -- NO NEWLINE $\
  \ git log -2 --pretty=tformat:%h 4da45bef \\ | perl -pe '$_ .= \" -- NO NEWLINE\\\
  n\" unless /\\n/' 4da45be 7134973\n```\n\n此外，任何包含 `%` 的未识别字符串都被解释为其前面有 `tformat:`。例如，以下两者是等价的：\n\
  \n```\n$ git log -2 --pretty=tformat:%h 4da45bef $ git log -2 --pretty=%h 4da45bef\n\
  ```\n\n## 限制输出\n\n如果你只对子集文件的差异感兴趣（例如某些特定架构的文件），你可以这样做：\n\n```\ngit diff-tree -r\
  \ <tree-ish> <tree-ish> arch/ia64 include/asm-ia64\n```\n\n它将向你显示那两个目录中变化的内容。\n\n\
  如果你只想搜索 `kernel/sched.c` 中发生了什么，只需执行：\n\n```\ngit diff-tree -r <tree-ish> <tree-ish>\
  \ kernel/sched.c\n```\n\n它将忽略所有其他文件的差异。\n\n模式始终是前缀，并且是精确匹配。没有通配符。更严格的是，它必须匹配完整的路径组件。例如，“foo”\
  \ 不会匹配 `foobar.h`。“foo”会匹配 `foo/bar.h`，因此它可以用于命名子目录。\n\n正常用法的示例是：\n\n```\ngit diff-tree\
  \ --abbrev 5319e4 :100664 ac348b... a01513... fs-objects.c\n```\n这告诉你最后一次提交只更改了一个文件。\n\
  \n## 原始输出\n\n`git-diff-index`、`git-diff-tree`、`git-diff-files` 和 `git diff --raw`\
  \ 的原始输出非常相似。这些命令都比较两个东西；不同在于：\n\n`git diff-index <tree-ish>`\n比较 `<tree-ish>` 和文件系统上的文件。\n\
  \n`git diff-index --cached <tree-ish>`\n比较 `<tree-ish>` 和索引。\n\n`git diff-tree [-r]\
  \ <tree-ish-1> <tree-ish-2> [<pattern>...]`\n比较由两个参数指定的树。\n\n`git diff-files [<pattern>...]`\n\
  比较索引和文件系统上的文件。\n\n`git-diff-tree` 命令通过打印正在比较内容的哈希值开始其输出。之后，所有命令为每个更改的文件打印一行输出。输出行的格式化方式如下：\n\
  \n```\n:100644 100664 bcd1234... 0123456... M copy :100644 100664 abcd123... 1234567...\
  \ C rename :100644 100664 abcd123... 1234567... R create :000000 100664 000000...\
  \ 1234567... A delete :100644 000000... 1234567... D unmerged :000000 000000...\
  \ 000000... U file\n```\n也就是说，从左到右：\n\n1. 一个冒号。\n2. “源”的模式；如果是创建或未合并则为 `000000`。\n\
  3. 一个空格。\n4. “目的”的模式；如果是删除或未合并则为 `000000`。\n5. 一个空格。\n6. “源”的 sha1；如果是创建或未合并则为 `0{40}`。\n\
  7. 一个空格。\n8. “目的”的 sha1；如果是创建、未合并或“查看工作树”则为 `0{40}`。\n9. 一个空格。\n10. 状态，随后是可选的“分数”数字。\n\
  11. 使用 `-z` 选项时使用制表符或空。\n12. “源”的路径\n13. 使用 `-z` 选项时使用制表符或空；仅存在 `C` 或 `R`。\n14.\
  \ “目的”的路径；仅存在于 `C` 或 `R`。\n15. 使用 `-z` 选项时使用 LF 或空来结束记录。\n\n可能的状态字母有：\n\n- `A`:\
  \ 添加文件\n- `C`: 将文件复制到新文件\n- `D`: 删除文件\n- `M`: 修改文件内容或模式\n- `R`: 重命名文件\n- `T`: 文件类型更改\n\
  - `U`: 文件未合并（必须在提交之前完成合并）\n- `X`: “未知”更改类型（很可能是错误，请报告）\n\n状态字母 `C` 和 `R` 总是跟随一个分数（表示移动或复制源与目标之间的相似性）。状态字母\
  \ `M` 对于文件重写可能会跟随一个分数（表示差异性）。\n\n如果文件在文件系统中是新的且与索引不同，则 `<sha1>` 显示为全 0。\n\n例如：\n\
  \n```\n:100644 100664 5be4a4...... 000000...... M file.c\n```\n\n当未使用 `-z` 选项时，路径中的\
  \ TAB、LF 和反斜杠字符分别表示为 `\\t`、`\\n` 和 `\\\\`。\n\n## 合并差异格式\n\n`git-diff-tree`、`git-diff-files`\
  \ 和 `git diff --raw` 可以带有 `-c` 或 `--cc` 选项为合并提交生成差异输出。输出与上述描述的格式不同之处在于：\n\n1. 每个父节点有一个冒号\n\
  \n\n\n\n\n2. 有更多的 \"src\" 模式和 \"src\" sha1\n3. status 是每个父节点状态字符的拼接\n4. 无可选的 \"\
  score\" 数字\n5. 单一路径，仅用于 \"dst\"\n\n示例：\n`::100644 100644 100644 fabadb8... cc95eb0...\
  \ 4866510... MM describe.c`\n\n注意 `combined diff`（合并差异）仅列出从所有父节点都被修改的文件。\n\n## 使用\
  \ -P 生成补丁\n\n当运行 `git-diff-index`、`git-diff-tree` 或 `git-diff-files` 并带有 `-p` 选项，或者运行不带\
  \ `--raw` 选项的 `git diff` 或带有 `-p` 选项的 `git log` 时，它们不会产生上述输出；而是产生补丁文件（patch）。你可以通过\
  \ `GIT_EXTERNAL_DIFF` 和 `GIT_DIFF_OPTS` 环境变量自定义此类补丁的创建。\n\n`-p` 选项产生的内容与传统的 diff\
  \ 格式略有不同：\n\n1. 它以前一个类似于这样的 \"git diff\" 头部开头：\n`diff --git a/file1 b/file2`\n\n\
  除非涉及重命名/复制，否则 `a/` 和 `b/` 文件名是相同的。特别是，即使是创建或删除，也不会用 `/dev/null` 代替 `a/` 或 `b/` 文件名。\n\
  \n当涉及重命名/复制时，`file1` 和 `file2` 分别显示重命名/复制源文件名以及重命名/复制产生的文件。\n\n2. 后面跟着一个或多个扩展头部行：\n\
  `old mode <mode> new mode <mode> deleted file mode <mode> new file mode <mode> copy\
  \ from <path> copy to <path> rename from <path> rename to <path> similarity index\
  \ <number> dissimilarity index <number> index <hash>..<hash> <mode>`\n\n文件模式以 6\
  \ 位八进制数字打印，包括文件类型和文件权限位。\n\n扩展头部中的路径名不包含 `a/` 和 `b/` 前缀。\n\n相似性索引（similarity index）是未更改行的百分比，差异性索引（dissimilarity\
  \ index）是更改行的百分比。它是一个向下取整的整数，后跟一个百分号。因此，100% 的相似性索引值留给两个相同的文件，而 100% 的差异性意味着旧文件中没有行进入新文件。\n\
  \n索引行包含了更改前后的 SHA-1 校验和。如果文件模式没有变化，则包含 `<mode>`；否则，用单独的行表示旧新模式。\n\n3. 路径名中的 TAB、LF、双引号和反斜杠字符分别表示为\
  \ `\\t`、`\\n`、`\\\"` 和 `\\\\`。如果需要此类替换，整个路径名将放在双引号中。\n\n4. 输出中所有的 `file1` 文件都指提交之前的文件，所有的\
  \ `file2` 文件都指提交之后的文件。将每个更改按顺序应用到每个文件是错误的。例如，此补丁将交换 a 和 b：\n```\ndiff --git a/a\
  \ b/b rename from a rename to b diff --git a/b b/a rename from b rename to a\n```\n\
  \n## 合并差异格式 (COMBINED DIFF FORMAT)\n\n任何生成差异的命令都可以采取 `-c` 或 `--cc` 选项，在显示合并时产生 `combined\
  \ diff`（合并差异）。这是在显示具有 (1) 或 (1) 个父节点的合并时的默认格式。注意，你也可以给这些命令中的任何一个提供 `-m` 选项，强制生成合并中各个父节点的差异。\n\
  \n`combined diff` 格式如下：\n`diff --combined describe.c index fabadb8,cc95eb0..4866510\
  \ --- a/describe.c +++ b/describe.c @@@ -98,20 -98,12 +98,20 @@@`\n\n1. 它以前一个类似于\
  \ \"git diff\" 头部开头（当使用 `-c` 选项时）：\n`diff --combined file`\n\n或如下（当使用 `--cc` 选项时）：\n\
  `diff --cc file`\n\n2. 后面跟着一个或多个扩展头部行（此示例显示了两个父节点的合并）：\n`index <hash>,<hash>..<hash>\
  \ mode <mode>,<mode>..<mode> new file mode <mode> deleted file mode <mode>,<mode>`\n\
  \n只有当至少一个 `<mode>` 与其他模式不同时，才会出现 `<mode>,<mode>..<mode>` 行。带有检测到的内容移动信息（重命名和复制检测）的扩展头部是为与两个\
  \ `<tree-ish>` 的差异而设计的，不被合并差异格式使用。\n\n3. 后面紧跟两行的源文件/目标文件头部\n`--- a/file +++ b/file`\n\
  \n与传统的 `unified`（统一）diff 格式的双行头部类似，使用 `/dev/null` 来指示创建或删除的文件。\n\n4. 块头部格式经过了修改，以防止人们意外将其输入到\
  \ `patch -p1`。合并差异格式是为了审查合并提交的更改而创建，并非用于应用。该更改与扩展 `index` 头部的更改相似：\n`@@@ <from-file-range>\
  \ <from-file-range> <to-file-range> @@@`\n\n合并差异格式的块头部中共有 (父节点数量 + 1) 个 `@` 字符。\n\
  \n与传统的 `unified` diff 格式不同（后者通过单列显示两个文件 A 和 B，该列带有 `-`（---在 A 中出现但在 B 中删除）、`+`（---在\
  \ A 中缺失但在 B 中添加）或 `\" \"`（空格---未更改）前缀），此格式将两个或多个文件 `file1`, `file2`,... 与一个文件 X\
  \ 进行比较，并显示 X 如何不同于每个 `fileN`。每个 `fileN` 的一列附加在输出行之前，以说明 X 的变化。\n\n```\nreturn (a_date\
  \ > b_date) ? -1 : (a_date == b_date) ? 0 : 1; } - static void describe(char *arg)\
  \ -static void describe(struct commit *cmit, int last_one) ++static void describe(char\
  \ *arg, int last_one) { + unsigned char sha1[20]; + struct commit *cmit; struct\
  \ commit_list *list; static int initialized = 0; struct commit_name *n; + if (get_sha1(arg,\
  \ sha1) < 0) + usage(describe_usage); + cmit = lookup_commit_reference(sha1); +\
  \ if (!cmit) + usage(describe_usage); + if (!initialized) { initialized = 1; for_each_ref(get_name);\n\
  ```\n\n## 其他 diff 格式\n\n`--summary` 选项描述新添加、删除、重命名和复制的文件。`--stat` 选项在输出中添加 (1) 统计信息。这些选项可以与\
  \ `-p` 等其他选项组合，供人类阅读。\n\n当显示涉及重命名或复制的更改时，`--stat` 输出通过合并路径名的公共前缀和后缀来紧凑地格式化路径名。例如，将\
  \ `arch/i386/Makefile` 移动到 `arch/x86/Makefile` 同时修改 4 行的将显示为：\n`arch/{i386 => x86}/Makefile\
  \ | 4 +--`\n\n`--numstat` 选项提供了 (1) 信息，但旨在便于机器读取。`--numstat` 输出中的条目如下：\n`1 2 README\
  \ 3 1 arch/{i386 => x86}/Makefile`\n\n即从左到右：\n1. 添加的行数；\n2. 制表符；\n3. 删除的行数；\n4.\
  \ 制表符；\n5. 路径名（可能包含重命名/复制信息）；\n6. 换行符。\n\n当 `-z` 输出选项生效时，输出格式如下：\n`1 2 README NUL\
  \ 3 1 NUL arch/i386/Makefile NUL arch/x86/Makefile NUL`\n\n即：\n1. 添加的行数；\n2. 制表符；\n\
  3. 删除的行数；\n4. 制表符；\n5. `NUL`（仅在重命名/复制时存在）；\n6. 原始路径名；\n7. `NUL`（仅在重命名/复制时存在）；\n\
  8. 镜像路径名（仅在重命名/复制时存在）；\n9. `NUL`。\n\n\n\n\n\n在重命名情况下，重置镜像路径前的额外 NUL 是为了让读取输出的脚本能够在无需预读的情况下，判断当前读取的记录是单路径记录还是重命名/复制记录。在读取了添加和删除的行后，读取到\
  \ NUL 即可获得路径名，但如果为 NUL，则该记录将显示两个路径。\n\n# GIT-DIFF\n\n## 名称\n`git-diff` - 显示提交之间、提交与工作树之间的更改等\n\
  \n## 语法\n`git diff [options] [<commit>] [--] [<path>...]`\n`git diff [options] --cached\
  \ [<commit>] [--] [<path>...]`\n`git diff [options] <commit> <commit> [--] [<path>...]`\n\
  `git diff [options] <blob> <blob>`\n`git diff [options] [--no-index] [--] <path>\
  \ <path>`\n\n## 描述\n显示工作树与索引（index）或树之间的更改、索引与树之间的更改、两个树之间的更改、两个 blob 对象之间的更改，或磁盘上两个文件之间的更改。\n\
  \n`git diff [--options] [--] [<path>...]`\n此格式用于查看你相对于索引（下一次提交的暂存区）所做的更改。换句话说，差异是你*可以*告诉\
  \ Git 进一步添加到索引中但你尚未添加的内容。你可以通过 (1) 将这些更改进行暂存。\n\n`git diff --no-index [--options]\
  \ [--] [<path>...]`\n此格式用于比较文件系统中给定的两个路径。当在 Git 控制的工作树中运行命令，且至少有一个路径指向工作树之外时，或者在由\
  \ Git 控制的工作树之外运行该命令时，可以省略 `--no-index` 选项。\n\n`git diff [--options] --cached [<commit>]\
  \ [--] [<path>...]`\n此格式用于查看你相对于指定的 `<commit>` 为下一次提交已暂存的更改。通常你可能希望与最新提交进行比较，因此如果你没有给出\
  \ `<commit>`，它默认为 `HEAD`。如果 `HEAD` 不存在（例如未创建分支）且未给出 `<commit>`，则将显示所有暂存的更改。`--staged`\
  \ 是 `--cached` 的别名。\n\n`git diff [--options] <commit> [--] [<path>...]`\n此格式用于查看你的工作树相对于指定的\
  \ `<commit>` 的更改。你可以使用 `HEAD` 与最新提交进行比较，或使用分支名称与不同分支的末端进行比较。\n\n`git diff [--options]\
  \ <commit> <commit> [--] [<path>...]`\n此格式用于查看两个任意 `<commit>` 之间的更改。\n\n`git diff\
  \ [--options] <commit>..<commit> [--] [<path>...]`\n这与前述格式同义。如果一侧的 `<commit>` 被省略，效果等同于使用\
  \ `HEAD`。\n\n`git diff [--options] <commit>...<commit> [--] [<path>...]`\n此格式用于查看包含\
  \ `<commit>` 直到第二个 `<commit>` 的分支上的更改，从两者的共同祖先开始。`\"git diff A...B\"` 等同于 `\"git\
  \ diff $(git-merge-base A B) B\"`。你可以省略 `<commit>` 中的任何一个，效果等同于使用 `HEAD`。\n\n以防万一，需要注意的是，在上述描述中，除了使用\
  \ `\"..\"` 符号的最后两种格式外，所有的 `<commit>` 都可以是 `<tree>`。\n\n要查看指定 `<commit>` 的更完整写法列表，请参见\
  \ (7) 中的“SPECIFYING REVISIONS”部分。然而，`\"diff\"` 是关于比较两个*端点*而不是范围，范围表示法（`<commit>..<commit>\"\
  ` 和 `\"<commit>...<commit>\"`）并不代表 (7) 中“SPECIFYING RANGES”部分中定义的范围。\n\n`git diff\
  \ [options] <blob> <blob>`\n此格式用于查看两个 blob 对象原始内容之间的差异。\n\n### 选项\n- `-p, -u, --patch`\n\
  生成补丁（参见生成补丁章节）。这是默认设置。\n- `-s, --no-patch`\n抑制 diff 输出。对于默认显示补丁的 `git show` 等命令有用，或者用于取消\
  \ `--patch` 的效果。\n- `-U<n>, --unified=<n>`\n生成具有 `<n>` 行上下文的 diff，而不是通常的三行。隐含了 `-p`。\n\
  - `--raw`\n以原始格式生成 diff。\n- `--patch-with-raw`\n`-p` `--raw` 的别名。\n- `--minimal`\n\
  花费额外时间以确保产生尽可能小的差异。\n- `--patience`\n使用 `\"patience diff\"` 算法生成 diff。\n- `--histogram`\n\
  使用 `\"histogram diff\"` 算法生成 diff。\n- `--diff-algorithm={patience|minimal|histogram|myers}`\n\
  选择一种 diff 算法。变体如下：\n  - `default, myers`\n  基础贪心 diff 算法。目前是默认值。\n  - `minimal`\n\
  \  花费额外时间以确保尽可能小的差异。\n  - `patience`\n  在生成补丁时使用 `\"patience diff\"` 算法。\n  - `histogram`\n\
  \  该算法扩展了 patience 算法以“支持低频率公共元素”。例如，如果你将 `diff.algorithm` 变量非默认值并想使用默认值，则你必须使用\
  \ `--diff-algorithm=default` 选项。\n- `--stat[=<width>[,<name-width>[,<count>]]]`\n\
  生成 `diffstat`。默认情况下，将尽可能多的空间用于文件名。\n- `--numstat`\n与 `--stat` 类似，但十进制显示添加和删除的行数以及不缩写的路径名，以便机器处理。对于二进制文件，输出两个\
  \ `-` 而不是 0。\n- `--shortstat`\n仅输出 `--stat` 的最后一行，其中包含修改文件的总数，以及添加和删除的行数。\n- `--dirstat=<param1,param2,...>`\n\
  输出每个子目录相对更改量的分布。`--dirstat` 的行为可以通过传递逗号分隔的参数列表来自定义。默认值由 `diff.dirstat` 配置控制（见 (1)）。可用参数如下：\n\
  \  - `changes`\n  通过计算从源删除的行或添加到目的的行数来计算 dirstat 数字。这忽略了文件内部的纯移动。换句话说，在文件中重新排列行不会被视为与其他更改同等数量。这是未给出参数时的默认行为。\n\
  \  - `lines`\n  通过进行常规基于行的 diff 分析并累加删除/添加的行数来计算 dirstat 数字。（对于二进制文件，计算 64 字节块，因为二进制文件没有自然的行概念）。这是比\
  \ changes 行为更耗资源的 `--dirstat` 行为，但它将文件内部重新排列的行视为与其他更改同等。产生的输出与从其他 `--*stat` 选项获得的结果一致。\n\
  \  - `files`\n  通过计算更改的文件数量来计算 dirstat 数字。每个更改的文件在 dirstat 分析中权重相等。这是计算上最便宜的 `--dirstat`\
  \ 行为，因为它完全查看文件内容。\n  - `cumulative`\n  同样将子目录的更改计入父目录。注意，当使用 cumulative 时，报告的百分比总和可能会超过\
  \ 100%。默认（非累积）行为可以通过 `noncumulative` 参数指定。\n- `<limit>`\n整数参数指定一个截止百分比（默认为 3%）。贡献低于此百分比更改的目录将不会显示在输出中。\n\
  \n\n\n示例：以下命令将统计更改的文件，同时忽略更改数量少于总更改数 10% 的目录，并在父目录中累积子目录计数：`--dirstat=files,10,cumulative`。\n\
  \n### `--summary`\n输出扩展头部信息的简要摘要，例如创建、重命名和模式更改。\n\n### `--patch-with-stat`\n`-p`\
  \ `--stat` 的同义词。\n\n### `-z`\n当给出 `--raw`、`--numstat`、`--name-only` 或 `--name-status`\
  \ 时，不对路径进行处理，并使用 NUL 作为输出字段终止符。\n如果没有此选项，输出的每个路径将 TAB、LF、双引号和反斜杠字符分别替换为 `\\t`、`\\\
  n`、`\\\"` 和 `\\\\`，如果发生了其中任何替换，则路径将被包含在双引号中。\n\n### `--name-only`\n仅显示更改文件的文件名。\n\
  \n### `--name-status`\n仅显示更改文件的文件名和状态。请参考 `--diff-filter` 选项的描述以了解状态字母的含义。\n\n###\
  \ `--submodule[=<format>]`\n指定子模块差异的方式。当给出 `--submodule` 或 `--submodule=log` 时，使用\
  \ `log` 格式。该格式像 (1)summary 一样列出范围内的提交。省略 `--submodule` 选项或指定 `--submodule=short`\
  \ 则使用 `short` 格式。该格式仅显示范围开头和结尾的提交名称。可以通过 `diff.submodule` 配置变量进行调整。\n\n### `--color[=<when>]`\n\
  显示彩色 diff。`--color`（即不带 `=<<when>`）等同于 `--color=always`。`<when>` 可以是 always、never\
  \ 或 auto 之一。它可以通过 `color.ui` 和 `color.diff` 配置设置进行更改。\n\n### `--no-color`\n关闭彩色\
  \ diff。这可以用于覆盖配置设置。它等同于 `--color=never`。\n\n### `--word-diff[=<mode>]`\n显示单词差异，并使用\
  \ `<mode>` 来分隔更改的单词。默认情况下，单词由空白符分隔；见下文的 `--word-diff-regex`。`<mode>` 默认认为 `plain`，且必须是以下之一：\n\
  \n*   **color**：仅使用颜色高亮更改的单词。隐含 `--color`。\n*   **plain**：将单词显示为 `[-removed-]` 和\
  \ `{+added+}`。如果输入中出现分隔符，则不尝试转义，因此输出可能是歧义的。\n*   **porcelain**：使用用于脚本消耗的特殊行格式。新增/删除/未更改的运行按标准的统一\
  \ diff 格式打印，行开头为 `+/-`/` ` 字符并延伸到行尾。输入中的换行符由单独一行的波浪 `~` 表示。\n*   **none**：再次禁用单词差异。\n\
  \n注意，尽管第一个模式名为 color，但如果启用，所有模式都会使用颜色高亮更改部分。\n\n### `--word-diff-regex=<regex>`\n\
  使用 `<regex>` 来判断什么是单词，而不是将非空白字符视为单词。除非已启用，否则隐含 `--word-diff`。\n`<regex>` 的每个非重叠匹配都被视为单词。这些匹配之间的任何内容都被视为空白符并在查找差异时被忽略！你可能想向你的正则表达式中附加\
  \ `|[^[:space:]]` 以确保它匹配所有非空白字符。包含换行符的匹配会在换行符处静默截断！\n正则也可以通过 diff 驱动程序或配置选项设置，见\
  \ (1) 或 (1)。显式给出将覆盖任何 diff 驱动程序或配置设置。diff 驱动覆盖配置设置。\n\n### `--color-words[=<regex>]`\n\
  等同于 `--word-diff=color` 加上（如果指定了正则）`--word-diff-regex=<regex>`。\n\n### `--no-renames`\n\
  关闭重命名检测，即使配置文件默认开启开启。\n\n### `--check`\n如果更改引入了空白错误则发出警告。什么被视为空白错误由 `core.whitespace`\
  \ 配置控制。默认情况下，尾部空白（包括仅由空白组成的行）以及行初始缩进内紧跟制表符的空格字符被视为空白错误。如果发现问题，则以非零状态退出。不与 `--exit-code`\
  \ 兼容。\n\n### `--ws-error-highlight=<kind>`\n在 `color.diff.whitespace` 指定的颜色中，高亮\
  \ `<kind>` 指定行的空白错误。`<kind>` 是旧、新、上下文的逗号分隔列表。当未给出此选项时，仅高亮新行中的空白错误。例如，`--ws-error-highlight=new,old`\
  \ 会高亮删除和添加行的空白错误。所有都可以作为 old,new,context 的简写。\n\n### `--full-index`\n在生成 patch 格式输出时，在“index”行上显示完整的原始和后镜像\
  \ blob 对象名称，而不是前几个字符。\n\n### `--binary`\n除了 `--full-index` 外，输出一个可以使用 `git-apply`\
  \ 应用的二进制 diff。\n\n### `--abbrev[=<n>]`\n在 diff-raw 格式输出和 diff-tree 头部行不再显示完整的 40\
  \ 字节十六进制对象名称，而是仅显示部分前缀。这与上述控制 diff-patch 输出格式的 `--full-index` 选项无关。可以通过 `--abbrev=<n>`\
  \ 指定非默认数字位数。\n\n### `-B[<n>][/<m>], --break-rewrites[...]`\n将完全重写的更改拆分为删除和创建对。这有两个目的：\n\
  1. 它影响文件的完全重写。\n2. 它作为重命名检测的过滤器。\n\n默认相似性索引为 60%。`-B/70%` 指定原始文件保留少于 30% 时，Git 将其视为重命名。\n\
  \n### `-M[<n>], --find-renames=<n>]`\n检测重命名。如果指定了 `n`，它是相似性索引的阈值（即相对于文件大小的添加/删除数量）。例如，`-M90%`\
  \ 意味着如果文件有 90% 没有变化，Git 将将删除/添加对视为重命名。如果没有 % 号，该数字将被读取为带有小数点的分数。例如，`-M5` 变为 `0.5`，等同于\
  \ `-M50%`。同样，`-M05` 等同于 `-M5%`。要限制为精确重命名，请使用 `-M100%`。默认相似性索引为 50%。\n\n### `-C[<n>],\
  \ --find-copies[=<n>]`\n同时也检测拷贝。见 `--find-copies-harder`。如果指定了 `n`，其含义与 `-M<n>`\
  \ 相同。\n\n### `--find-copies-harder`\n出于性能考虑，默认情况下，`-C` 选项仅当拷贝的原文件在同一变更集中被修改时才寻找拷贝。此标志使命令检查未修改的文件作为拷贝源。对于大型项目，这是一个非常昂贵的操作，请谨慎使用。给出多个\
  \ `-C` 选项效果相同。\n\n### `-D, --irreversible-delete`\n省略删除的镜像，即仅打印头部，但不打印镜像与 `/dev/null`\
  \ 之间的 diff。生成的补丁无法供 `patch` 或 `git apply` 应用；这仅适用于只想专注于查看更改后文本的人。此外，输出显然缺少反向应用此类补丁的信息（即使是手动操作），因此该选项才如此。\n\
  与 `-B` 同时使用时，在删除/创建对的删除部分也省略镜像。\n\n### `-l<num>`\n\n\n\n`-M` 和 `-C` 选项需要 `O(n²)`\
  \ 处理时间，其中 `n` 是潜在重命名/拷贝目标的数量。如果重命名/拷贝目标的数量超过指定，此选项将防止重命名/拷贝检测运行。\n\n`--diff-filter=[(A|C|D|M|R|T|U|X|B)...[*]]`\n\
  \n仅选择已添加 (A)、复制 (C)、删除 (D)、修改 (M)、重命名 (R)、类型更改（即普通文件、符号链接、子模块等...） (T)、未合并 (U)、未知\
  \ (X) 或配对断裂 (B) 的文件。可以使用过滤器字符的任意组合（包括不包含任何字符）。当在组合中添加 `*`（全有或全无）时，如果比较中有任何文件符合其他标准，则将选择所有路径；如果没有文件符合其他标准的文件，则不选择任何内容。\n\
  \n`-S<string>`\n\n查找文件中指定字符串出现次数变化（即添加/删除）的差异。旨在供脚本编写人员使用。\n\n当你正在寻找一个精确的代码块（如 `struct`），并想知道该块自首次出现以来的历史时它非常有用：迭代使用该功能，将感兴趣的块的输入输入\
  \ `-S`，持续进行直到获得该块的最早版本。\n\n`-G<regex>`\n\n查找其补丁文本包含匹配 `<regex>` 的添加/删除行的差异。\n\n\
  为了说明 `-S<regex> --pickaxe-regex` 和 `-G<regex>` 之间的区别，考虑在同一文件中具有以下差异的提交：\n\n```bash\n\
  + return !regexec(regexp, two->ptr, 1, &regmatch, 0); ... - hit = !regexec(regexp,\
  \ mf2.ptr, 1, &regmatch, 0);\n```\n\n虽然 `git log -G\"regexec\\(regexp\"` 将显示此提交，但\
  \ `git log -S\"regexec\\(regexp\" --pickaxe-regex` 则不会（因为该字符串的出现次数没有变化）。\n\n更多信息请参阅\
  \ (7) 中的 *pickaxe* 条目。\n\n`--pickaxe-all`\n\n当 `-S` 或 `-G` 找到更改时，显示该变更集中的所有更改，而不仅仅是包含`<string>`\
  \ 更改的文件。\n\n`--pickaxe-regex`\n\n将传递给 `-S` 的 `<string>` 视为扩展 POSIX 正则表达式进行匹配。\n\n\
  `-O<orderfile>`\n\n按照 `<orderfile>`指定的顺序输出补丁，该文件每行有一个 shell 通配符模式。这将覆盖 `diff.orderFile`\
  \ 配置变量。要取消 `diff.orderFile`，使用 `-O/dev/null`。\n\n`-R`\n\n交换两个输入；即从索引或磁盘文件显示到树内容的差异。\n\
  \n`--relative[=<path>]`\n\n当从项目的子目录运行时，可以通过此选项告诉它排除目录外的更改，并显示相对于该目录的路径。当你不在子目录中（例如在裸仓库中）时，可以通过提供参数\
  \ `<path>` 来指定哪个子目录的相对输出。\n\n`-a, --text`\n\n将所有文件视为文本。\n\n`--ignore-space-at-eol`\n\
  \n忽略行尾空白的更改。\n\n`-b, --ignore-space-change`\n\n忽略空白字符数量的变化。这会忽略行尾的空白，并将所有其他一个或多个空白字符序列视为等效。\n\
  \n`-w, --ignore-all-space`\n\n在比较行时忽略空白。即使其中一行有空白而另一行没有，也会忽略差异。\n\n`--ignore-blank-lines`\n\
  \n忽略所有行都为空的更改。\n\n`--inter-hunk-context=<lines>`\n\n显示差异 hunk 之间的上下文，最多到指定的行数，从而合并彼此较近的\
  \ hunk。\n\n`-W, --function-context`\n\n显示更改周围的完整函数。\n\n`--exit-code`\n\n使程序以类似于\
  \ (1) 的代码退出。即，如果有差异，则以代码 1 退出，0 表示没有差异。\n\n`--quiet`\n\n禁用程序的所有输出。隐含 `--exit-code`。\n\
  \n`--ext-diff`\n\n允许执行外部 diff 助手。如果你用 (5) 设置了外部 diff 驱动程序，则需要配合 (1) 等选项使用此选项。\n\n\
  `--no-ext-diff`\n\n不允许外部 diff 驱动程序。\n\n`--textconv, --no-textconv`\n\n在比较二进制文件时允许（或不允许）运行外部文本转换过滤器。详情见\
  \ (5)。由于 textconv 过滤器通常是单向转换，生成的 diff 适用于人类阅读，但无法应用。出于此原因，textconv 过滤器默认对 (1) 和\
  \ (1) 启用，而不对 (1) 或 diff plumbing 命令启用。\n\n`--ignore-submodules[=<when>]`\n\n在生成\
  \ diff 时忽略对子模块的更改`<when>` 可以是 \"none\"\"untracked\"\"dirty\" 或默认的 \"all\"。使用 \"\
  none\"，当子模块包含未跟踪或修改的文件，或者其 `HEAD` 与父项目记录的提交不同时，会被子模块已修改，它可以覆盖 (1) 或 (5) 中 *ignore*\
  \ 选项的任何设置。使用 \"untracked\" 时，子模块仅包含未跟踪内容时不被视为脏（但仍会扫描修改内容）。使用 \"dirty\" 会忽略对子模块工作树的所有更改，仅显示存储在父项目中的提交的更改（这是\
  \ 1.7.0 之前的行为）。使用 \"all\" 会隐藏对子模块的所有更改。\n\n`--src-prefix=<prefix>`\n\n显示给定的源前缀代替\
  \ \"a/\"。\n\n`--dst-prefix=<prefix>`\n\n显示给定的目标前缀代替 \"b/\"。\n\n`--no-prefix`\n\n\
  不显示任何源或目标前缀。\n\n关于这些常用选项的更详细解释，请参阅 (7)。\n\n`<path>...`\n\n当给出 `<paths>` 参数时，用于将差异限制在指定的路径（你可以提供目录名称并获取其下所有文件的差异）。\n\
  \n## 原始输出格式\n\n`git-diff-index`、`git-diff-tree`、`git-diff-files` 和 `git diff --raw`\
  \ 的原始输出格式非常相似。\n\n这些命令都比较两组东西；比较的内容不同：\n\n`git-diff-index <tree-ish>`\n\n比较 `<tree-ish>`\
  \ 和文件系统上的文件。\n\n`git-diff-index --cached <tree-ish>`\n\n比较 `<tree-ish>` 和索引。\n\n\
  `git-diff-tree [-r] <tree-ish-1> <tree-ish-2>`\n\n`git-diff-tree <pattern>...`\n\
  \n比较由参数命名的树。\n\n`git-diff-files [<pattern>...]`\n\n比较索引和文件系统上的文件。`git-diff-tree`\
  \ 命令通过打印比较对象的哈希值开始输出。之后，所有命令每个更改的文件打印一行。输出行的格式如下：\n\n```\nmode 10644 src_hash dst_hash\
  \ path\n```\n\n也就是说，从左到右：\n\n1.  一个冒号。\n2.  \"src\" 的 mode；如果是创建或未合并则为 00000。\n\
  3.  一个空格。\n4.  \"dst\" 的 mode；如果是删除或未合并则为 00000。\n5.  一个空格。\n6.  \"src\" 的 sha1；如果是创建或未合并则为\
  \ 0{40}。\n7.  一个空格。\n8.  \"dst\" 的 sha1；如果是创建、未合并或查看工作树则为 0{40}。\n9.  一个空格。\n10.\
  \ 状态，后面跟着可选的评分数字。\n11. 使用 *-z* 选项时为制表符。\n12. \"src\" 的路径\n13. 使用 *-z* 选项时为制表符；仅存在\
  \ C 或 R。\n14. \"dst\" 的路径；仅存在 C 或 R。\n15. 换行符或使用 *-z* 选项时为制表符，用于终止记录。\n\n可能的状态字母为：\n\
  \nA：添加文件\nC：将文件复制到新文件\nD：删除文件\nM：修改文件内容或模式\nR：重命名文件\nT：文件类型更改\nU：文件未合并（你必须在提交前完成合并）\n\
  X：“未知”更改类型（很可能是错误，请报告）\n\n状态字母 C 和 R 总是跟随一个评分（表示移动或复制源和目标之间的相似百分比）。状态字母 M 在文件重写时可能会跟随一个评分（表示差异百分比）。\n\
  \n如果文件在文件系统中是新的且与索引不同，则 `<sha1>` 显示为全 0。\n\n\n\n\n\n# 示例：\n\n```\n:100644 100644\
  \ 5be4a4...... 000000...... M file.c\n```\n\n当不使用 `-z` 选项时，路径中的 `TAB`、`LF` 和反斜杠字符分别表示为\
  \ `\\t`、`\\n` 和 `\\\\`。\n\n## 合的 DIFF 格式\n\n`git-diff-tree`、`git-diff-files` 和 `git-diff\
  \ --raw` 可以接受 `-c` 或 `--cc` 选项为合并提交生成 diff 输出。该输出与上述描述的格式有以下不同：\n\n1. 每个父节点前有一个冒号。\n\
  2. 有更多的 `\"src\"` 模式和 `\"src\"` sha1。\n3. 状态是每个父节点状态字符的拼接。\n4. 没有可选的 `\"score\"\
  ` 数字。\n5. 单路径，仅针对 `\"dst\"`。\n\n示例：\n\n```\n::100644 100644 100644 fabadb8... cc95eb0...\
  \ 4866510... MM describe.c\n```\n\n注意，`combined diff` 仅列出从所有父节点起修改的文件。\n\n## 使用\
  \ -P 生成补丁\n\n当运行 `git-diff-index`、`git-diff-tree` 或 `git-diff-files` 并带有 `-p` 选项，或者运行带\
  \ `--raw` 选项的 `git diff` 或带 `-p` 选项的 `git log`，它们不会产生上述输出；而是产生补丁文件。你可以通过 `GIT_EXTERNAL_DIFF`\
  \ 和 `GIT_DIFF_OPTS` 环境变量自定义此类补丁的创建。\n\n`-p` 选项产生的内容与传统的 diff 格式略有不同：\n\n1. 它前面有一个像这样的\
  \ `\"git diff\"` 头部：\n\n```\ndiff --git a/file1 b/file2\n```\n\n除非涉及重命名/复制，否则 `a/`\
  \ 和 `b/` 文件名是相同的。具体来说，即使对于创建或删除，也不会用 `/dev/null` 代替 `a/` 或 `b/` 文件名。\n\n当涉及重命名/复制时，`file1`\
  \ 和 `file2` 分别显示重命名/复制的源文件名以及重命名/复制产生的文件名。\n\n2. 后面跟着一个或多个扩展头部行：\n\n```\nold mode\
  \ <mode> new mode <mode> deleted file mode <mode> new file mode <mode> copy from\
  \ <path> copy to <path> rename from <path> rename to <path> similarity index <number>\
  \ dissimilarity index <number> index <hash>..<hash> <mode>\n```\n\n文件模式以 6 位八进制数字打印，包括文件类型和文件权限位。\n\
  \n扩展头部中的路径不包含 `a/` 和 `b/` 前缀。\n\n相似性索引是未更改行的百分比，差异性索引是更改行的百分比。它是一个向下取整的整数，后面跟着一个百分号。因此，100%\
  \ 的相似性索引值留给两个相同的文件，而 100% 的差异性意味着旧文件中没有一行进入了新文件。\n\n索引行包含了更改前后的 SHA-1 校验和。如果文件模式没有变化，则包含\
  \ `<mode>`；否则，用单独的行指示旧和新模式。\n\n3. 路径中的 `TAB`、`LF`、双引号和反斜杠字符分别表示为 `\\t`、`\\n`、`\\\
  \"` 和 `\\\\`。如果需要此类替换，则整个路径会被放在双引号中。\n\n4. 输出中所有的 `file1` 文件均指提交之前的文件，所有的 `file2`\
  \ 文件指提交之后的文件。将每个更改顺序应用到每个文件是错误的。例如，此补丁将交换 a 和 b：\n\n```\ndiff --git a/a b/b rename\
  \ from a rename to b\ndiff --git a/b b/a rename from b rename to a\n```\n\n## 合并\
  \ diff 格式\n\n任何生成 diff 的命令都可以接受 `-c` 或 `--cc` 选项，在显示合并时产生 `combined diff`。这是显示具有\
  \ (1) 个或多个父节点的合并时的默认格式。还要注意，你也可以给这些命令中的任何一个提供 `-m` 选项，强制为合并的各个父节点生成 diff。\n\n`combined\
  \ diff` 格式如下：\n\n```\ndiff --combined describe.c index fabadb8,cc95eb0..4866510\
  \ --- a/describe.c +++ b/describe.c @@@ -98,20 -98,12 +98,20 @@@ return (a_date\
  \ > b_date) ? -1 : (a_date == b_date) ? 0 : 1; } - static void describe(char *arg)\
  \ -static void describe(struct commit *cmit, int last_one) ++static void describe(char\
  \ *arg, int last_one) { + unsigned char sha1[20]; + struct commit *cmit; struct\
  \ commit_list *list; static int initialized = 0; struct commit_name *n; + if (get_sha1(arg,\
  \ sha1) < 0) + usage(describe_usage); + cmit = lookup_commit_reference(sha1); +\
  \ if (!cmit) + usage(describe_usage); + if (!initialized) { initialized = 1; for_each_ref(get_name);\n\
  ```\n\n1. 它前面有一个 `\"git diff\"` 头部，当使用 `-c` 选项时如下：\n\n```\ndiff --combined file\n\
  ```\n\n或者像这样（当使用 `--cc` 选项时）：\n\n```\ndiff --combined file\n```\n\n2. 后面跟着一个或多个扩展头部行：\n\
  \n```\nindex <hash>..<hash> mode <mode>\n```\n\n使用了 `index <hash>..<hash>`。\n\n\
  3. 路径中的 `TAB`、`LF`、双引号和反斜杠字符分别表示为 `\\t`、`\\n`、`\\\"` 和 `\\\\`。如果需要此类替换，则整个路径会被放在双引号中。\n\
  \n\n\n\n\n`1 2 README NUL 3 1 NUL arch/i386/Makefile NUL arch/x86/Makefile NUL`\n\
  \n即：\n\n1. 新增的行数；\n2. 一个制表符；\n3. 删除的行数；\n4. 一个制表符；\n5. 一个 `NUL`（仅在重命名/复制时存在）；\n\
  6. 镜像（preimage）中的路径；\n7. 一个 `NUL`（仅在重命名/复制时存在）；\n8. 后镜像（postimage）中的路径（仅在重命名/复制时存在）；\n\
  9. 一个 `NUL`。\n\n在重命名情况下，镜像路径前的额外的 `NUL` 是为了让读取输出的脚本无需提前读取即可判断当前读取的记录是单路径记录还是重命名/复制记录。在读取新增和删除的行后，读取到\
  \ `NUL` 即可获得路径，但如果它是 `NUL`，则该记录将显示两个路径。\n\n## 示例\n\n### 检查工作树各种方法\n\n`$ git diff`\
  \ `(1)` `$ git diff --cached` `(2)` `$ git diff HEAD` `(3)`\n\n**1.** 工作区中尚未暂存到下次提交的更改。\n\
  **2.** 索引与上次提交之间的更改；如果你运行 `git commit` 且不带 `-a` 选项，你将提交这些更改。\n**3.** 自上次提交以来工作区中的更改；如果你运行\
  \ `git commit -a`，你将提交这些更改。\n\n### 与任意提交比较\n\n`$ git diff test` `(1)` `$ git diff\
  \ HEAD -- ./test` `(2)` `$ git diff HEAD^ HEAD` `(3)`\n\n**1.** 不使用当前分支的顶，而是与 \"\
  test\" 分支的顶比较。\n**2.** 不与 \"test\" 分支的顶比较，而是与当前分支的顶比较，但将比较限制在 \"test\" 文件。\n**3.**\
  \ 比较上一次提交和最后一次提交的版本。\n\n### 比较分支\n\n`$ git diff topic master` `(1)` `$ git diff\
  \ topic..master` `(2)` `$ git diff topic...master` `(3)`\n\n**1.** `topic` 分支和 `master`\
  \ 分支顶之间的更改。\n**2.** 同上。\n**3.** 自 `topic` 分支从 `master` 分出以来，`master` 分支上发生的更改。\n\
  \n### 限制 diff 输出\n\n`$ git diff --diff-filter=MRC` `(1)` `$ git diff --name-status`\
  \ `(2)` `$ git diff arch/i386 include/asm-i386` `(3)`\n\n**1.** 只显示修改、重命名和复制，不显示添加或删除。\n\
  **2.** 只显示名称和更改性质，而不显示实际 diff 输出。\n**3.** 将 diff 输出限制在指定的子树中。\n\n### 处理 diff 输出\n\
  \n`$ git diff --find-copies-harder -B -C` `(1)` `$ git diff -R` `(2)`\n\n**1.**\
  \ 花额外的周期来寻找重命名、复制和完全重写（非常昂贵）。\n**2.** 反向输出 diff。\n\n## 参见\n\n(1), (1), (1), (7),\
  \ (1), (1)\n\n***\n\n# GIT-DIFFTOOL\n\n## 名称\n\n`git-difftool` - 使用常用的 diff 工具显示更改\n\
  \n## 概要\n\n`git difftool` `[<options>] [<commit> [<commit>]] [--] [<path>...]`\n\
  \n## \n\n`git difftool` 是一个 Git 命令，允许你使用常用的 diff 工具比较和编辑版本之间的文件。`git difftool` 是\
  \ `git diff` 的前端，接受相同的选项和参数。见 (1)。\n\n### 选项\n\n-d, --dir-diff\n\n将修改后的文件复制到临时位置并对其执行目录\
  \ diff。此模式在启动 diff 工具之前永远不会提示。\n\n-y, --no-prompt\n\n在启动 diff 工具之前不提示。\n\n--prompt\n\
  \n在每次调用 diff 工具之前提示。这是默认行为；提供该选项是为了覆盖任何配置设置。\n\n-t <tool>, --tool=<tool>\n\n使用由\
  \ `<tool>` 指定 diff 工具。有效值包括 `emerge`、`kompare`、`meld` 和 `vimdiff`。运行 `git difftool\
  \ --tool-help` 获取有效 `<tool>` 设置列表。\n\n如果未指定 diff 工具，`git difftool` 将使用配置变量 `diff.tool`。如果未设置配置变量\
  \ `diff.tool`，`git difftool` 将选择一个默认值。\n\n你可以通过设置配置变量 `difftool.<tool>.path` 来显式提供工具的完整路径。例如，可以通过设置\
  \ `difftool.kdiff3.path` 配置 `kdiff3` 的绝对路径。否则，`git difftool` 假设工具在 `PATH` 中可用。\n\
  \n与其运行已知 diff 工具之一，`git difftool` 可以通过在配置变量 `difftool.<tool>.cmd` 中指定命令行来运行替代程序。\n\
  \n当使用此工具调用 `git difftool` 时（通过 `-t` 或 `--tool` 选项或 `diff.tool` 配置变量），将调用配置的命令行并提供以下变量：`$LOCAL`\
  \ 设置为包含 diff 镜像内容的临时文件名，`$REMOTE` 设置为包含 diff 后镜像内容的临时文件名。`$MERGED` 是正在比较的文件名。`$BASE`\
  \ 用于兼容自定义合并工具命令，其值与 `$BASE` 相同。\n\n--tool-help\n\n打印可与 `--tool` 配合使用的 diff 工具列表。\n\
  \n--[no-]symlinks\n\n`git difftool` 的默认是创建符号链接。指定 `--no-symlinks` 指令 *git difftool*\
  \ 创建副本。\n\n-x <command>, --extcmd=<command>\n\n指定用于查看 diff 的自定义命令。`git difftool`\
  \ 继承文件的右侧。\n\n-g, --gui\n\n当使用 `-g` 或 `--gui` 调用 `git difftool` 时，默认工具将从 `diff.guitool`\
  \ 而不是 `diff.tool`。\n\n--[no-]trust-exit-code\n\n如果调用的工具返回非零状态则退出。使用 `--trust-exit-code`\
  \ 让 *git difftool* 在工具退出时退出。\n\n支持选项的完整列表请见 (1)。\n\n## 配置变量\n\n当未定义等效变量时，`git difftool`\
  \ 回退到 `mergetool` 配置变量。\n\n`diff.tool`\n\n默认使用的 diff 工具。\n\n`diff.guitool`\n\n指定\
  \ `--gui` 时使用的默认 diff 工具。\n\n`difftool.<tool>.path`\n\n覆盖给定工具的路径。\n\n`difftool.<tool>.cmd`\n\
  \n指定调用指定工具的命令行。\n\n`difftool.prompt`\n\n在每次调用 diff 工具之前提示。\n\n`difftool.trustExitCode`\n\
  \n如果调用的工具返回非零状态则退出。\n\n## 参见\n\n(1)\n\n显示提交之间、提交与工作树之间的更改等。\n\n(1)\n\n运行合并工具以解决冲突\n\
  \n# GIT-FAST-EXPORT\n\n## 名称\n\n`git-fast-export` - Git 数据导出\n\n## 概要\n\n`git fast-export\
  \ [options]` `|` `git fast-import`\n\n## \n\n此程序以适用于管道 `git fast-import` 的格式导出给版本。\n\
  \n你可以将其人类可读的 bundle 替代方案（见 (1)），或作为交互式的 `git filter-branch`。\n\n### 选项\n\n--progress=<n>\n\
  \n每 `<n>` 个对象插入进度语句，由 git fast-import 在导入期间显示。\n\n--signed-tags=(verbatim|warn|warn-strip|strip|abort)\n\
  \n指定如何处理签名标签。由于导出后的任何转换可能会更改标签名称（在排除版本时也可能发生），签名将无法匹配。\n\n当请求 *abort*（默认值）时，此程序在遇到签名标签时将终止。使用\
  \ *strip* 时，标签将静默变为无签名；使用 *warn-strip* 时，将变为无签名但会显示警告；使用 *verbatim* 时，将静默导出；使用 *warn*\
  \ 时，将导出但你会看到警告。\n\n\n\n\n\n## --tag-of-filtered-object=(abort|drop|rewrite)\n\n\
  指定如何处理标记对象被过滤掉的标签。由于修订和导出的文件受路径限制，标记的对象可能会被完全过滤掉。\n\n当请求 `abort`（默认值）时，程序遇到此类标签时将退出。使用\
  \ `drop` 时，它将从输出中忽略此类标签。使用 `rewrite` 时，如果被标记的对象是一个提交，它将重写该标签以指向一个祖先提交（通过父提交重写；见\
  \ (1)）。\n\n## `-M`, `-C`\n\n执行移动和/或复制检测，如 (1) 手册页所述，并使用其在输出转储中生成重命名和复制命令。\n\n请注意，该命令的早期版本在提供这些选项时不会报错但会产生错误的结果。\n\
  \n## --export-marks=<file>\n\n完成后将内部标记表转储到 `<file>`。标记每行写入一个，格式为 `:markid SHA-1\\\
  .`。仅导出修订的标记；忽略二进制对象（blob）标记。后端可以使用此文件在导入完成后验证导入，或者在多次增量运行之间保存标记表。由于 `<file>` 仅在完成时打开并截断，也可以安全地将其传递给\
  \ `--import-marks`。如果没有新对象被标记/导出，则不会写入文件。\n\n## --import-marks=<file>\n\n在处理任何输入之前，加载\
  \ `<file>` 中指定的标记。输入文件必须存在、可读，且格式与 `--export-marks` 生成的相同。\n\n已标记的提交将不再再次导出。如果后端使用类似的\
  \ `--import-marks` 文件，则通过保持跨运行的标记相同，允许仓库的增量双向导出。\n\n## --fake-missing-tagger\n\n\
  某些旧仓库拥有没有标记者的标签。fast-import 协议对此非常严格，不允许这种情况。因此，伪造一个标记者以便能够进行 fast-import 输出内容。\n\
  \n## --use-done-feature\n\n以 `feature done` 段落启动流，并用 `done` 命令终止。\n\n## --no-data\n\
  \n跳过 blob 对象的输出，而是通过它们的原始 SHA-1 哈希值引用 blob。这在重写仓库的目录结构或历史而不接触单个文件内容时非常有用。请注意，生成的流只能由已经包含必要对象的仓库使用。\n\
  \n## --full-tree\n\n此选项会导致 fast-export 为每个提交发布一个 \"deleteall\" 指令，随后列出提交中所有文件的完整列表（而不是仅列出与提交的第一个父提交不同的文件）。\n\
  \n## --anonymize\n\n匿名化仓库内容，同时保留历史形状和存储树的结构。参见下文的 ANONYMIZING（匿名化）章节。\n\n## --refspec\n\
  \n对每个导出的引用应用指定的 refspec。可以指定多个。\n\n## [<git-rev-list-args>...]\n\n一组 `git rev-parse`\
  \ 和 `git rev-list` 可接受的参数列表，用于指定要导出的特定对象和引用。例如`master~10..master` 会导出当前的 master\
  \ 引用以及自其第 10 个祖先提交以来添加的所有对象。\n\n## 示例\n\n```bash\n$ git fast-export --all | (cd\
  \ /empty/repository && git fast-import)\n```\n\n这将导出整个仓库并将其导入现有的空仓库中。除了对非 UTF-8\
  \ 的提交进行重新编码外，它将是一一对应的镜像。\n\n```bash\n$ git fast-export master~5..master | sed \"\
  s/refs/heads/master|refs/heads/other|\" | git fast-import\n```\n\n这将从 `master~5..master`\
  \ 创建名为 `other` 的新分支（即如果 `master` 是线性历史，它将获取最后 5 个提交）。\n\n注意，这假设该修订范围引用的任何 blob 和提交消息都不包含\
  \ `refs/heads/master` 字符串。\n\n## 匿名化\n\n如果给出 `--anonymize` 选项，git 将尝试移除仓库中的所有标识信息，同时保留足够的原始树和历史模式以重现某些\
  \ bug。目标是让私有仓库中发现的 git bug 在匿名化仓库中仍然存在，后者可以与 git 开发人员共享以帮助解决问题。\n\n使用此选项，git 将把输出中的所有引用名、路径、blob\
  \ 内容、提交和标签消息、名称和电子邮件地址替换为匿名数据。相同字符串的两个实例将被等替换（例如，两个具有相同作者的提交在输出中将具有相同的匿名作者，但与原始作者字符串毫无相似）。提交、分支和标签之间的关系被保留，提交时间戳也被保留（但提交消息和引用名与原始版本并不相似）。树的相对组成被保留（例如，如果你有一个包含\
  \ 10 个文件和 3 个树的根树，输出也是如此），但它们的名称和文件内容将被替换。\n\n如果你认为发现了一个 git bug，可以从导出整个仓库的匿名化流开始：\n\
  \n```bash\n$ git fast-export --anonymize --all > anon-stream\n```\n\n然后确认该 bug 是否存在于从该流创建的仓库中（许多\
  \ bug 将不存在，因为它们确实取决于具体的仓库内容）：\n\n```bash\n$ git init anon-repo $ cd anon-repo $\
  \ git fast-import <../anon-stream $ ... 测试你的 bug ...\n```\n\n如果匿名化仓库显示了该 bug，那么与其配合错误报告一起共享\
  \ anon-stream。注意匿名化流压缩率很高，建议对其进行 gzip。如果你想检查流以确保它不包含任何隐私数据，可以在发送之前直接查看。你可能还会尝试：\n\
  \n```bash\n$ perl -pe 's/\\d+/X/g' <anon-stream | sort -u | less\n```\n\n这显示所有唯一的行（将数字转换为\
  \ \"X\"，将 \"User 0\"、\"User 1\" 等合并为 \"User X\"）。这将产生一个小得多的输出，通常很容易快速确认流中没有隐私数据。\n\
  \n## 局限性\n\n由于 `git fast-import` 无法标记树，你无法完全导出 linux.git 仓库，因为它包含指向树而非提交的标签。\n\n\
  ## 另请\n\n(1)\n\n* *\n\n# GIT-FAST-IMPORT\n\n## 名称\n\ngit-fast-import - 快速 Git 数据导入器的后端\n\
  \n## 语法\n\n```bash\nfrontend | git fast-import [options]\n```\n\n## 描述\n\n此程序通常不是终端用户想要直接运行的。大多数用户希望使用现有的前端程序，这些程序解析特定类型的外部源并将存储在那里的内容给\
  \ fast-import。\n\nfast-import 从标准输入读取混合命令/数据流，并直接向当前仓库写入一个或多个包文件。当在标准输入接收到 EOF 时，fast\
  \ import 写入更新后的分支和标签引用，用新导入的数据完全更新当前仓库。\n\nfast-import 后端本身可以导入到空仓库（已通过 `git init`\
  \ 化的仓库）或增量更新现有的填充仓库。是否支持从特定的外部源进行增量导入取决于所使用的的前端程序。\n\n### 选项\n\n--force\n\n强制更新已修改的现有分支，即使这样做会导致提交丢失（因为新提交包含旧提交）。\n\
  \n--quiet\n\n禁用所有非致命输出，使 fast-import 在成功时保持静默。此选项禁用了由 --stats 显示的输出。\n\n--stats\n\
  \n显示关于 fast-import 创建的对象、存储这些存储的包文件以及 fast-import 在本次运行期间使用的内存的某些基本统计信息。显示此输出目前是默认的，但可以通过\
  \ --quiet 禁用。\n\n### 前端程序的选项\n\n--cat-blob-fd=<fd>\n\n将对 cat-blob 和 ls 查询的响应写入文件描述符\
  \ `<fd>` 而不是标准输出。允许将面向终端用户的进度输出与其他输出分离。\n\n\n\n\n\n## --date-format=<fmt>\n\n指定前端在\
  \ `author`、`committer` 和 `tagger` 命令中提供给 `fast-import` 的日期类型。请参考下文“日期格式”部分关于支持的格式及其语法的细节。\n\
  \n## --done\n\n如果流的末尾没有 `done` 命令，则带错误退出。此选项可能用于检测导致前端在开始写入流之前就终止的错误。\n\n### 标记文件的位置\n\
  \n## --export-marks=<file>\n\n在完成后，将内部标记表（marks table）转储到 `<file>`。标记以每行一个的形式写入，格式为\
  \ `:markid SHA-1\\.`。前端可以使用此文件在导入完成后验证导入情况，或者在多次增量运行之间保存标记表。由于 `<file>` 仅在检查点（或完成时）被打开并截断，因此也可以将相同的路径安全地传递给\
  \ `--import-marks`。\n\n## --import-marks=<file>\n\n在处理任何输入之前，加载`<file>` 中指定的标记。输入文件必须存在、可读，且使用的格式与\
  \ `--export-marks` 生成的格式相同。可以提供多个选项来导入多组标记。如果标记被定义为不同的值，则最后一个文件胜出。\n\n## --import-marks-if-exists=<file>\n\
  \n类似于 `--import-marks`，但如果文件不存在，则静默跳过该文件而不是报错。\n\n## --[no-]relative-marks\n\n指定\
  \ `--relative-marks` 后，通过 `--import-marks=` 和 `--export-marks=` 指定的路径将相对于当前仓库中的内部目录。在\
  \ `git-fast-import` 中，这意味着路径相对于 `.git/info/fast-import` 目录的。然而，其他的导入器可能会使用不同的位置。\n\
  \n可以通过交替使用 `--(no-)-relative-marks` 与 `--(import|export)-marks=` 选项将相对和非相对标记相结合。\n\
  \n### 性能与压缩调整\n\n## --active-branches=<n>\n\n同时保持活跃的最大分支数量。详情请见下文“内存利用”部分。默认值为 5。\n\
  \n## --big-file-threshold=<n>\n\n`fast-import` 尝试为 blob 创建增量（delta）的最大大小，以字节为单位。默认值为\
  \ `512m` (512 MiB)。在内存受限的系统中，某些导入器可能希望降低此值。\n\n## --depth=<n>\n\nblob 和 tree 增量计算的最大深度。默认值为\
  \ 10。\n\n## --export-pack-edges=<file>\n\n在创建 packfile 后，向 `<file>` 打印一行数据，列出 packfile\
  \ 的文件名以及写入该 packfile 的每个分支最后的提交。对于总对象集超过 4 GiB packfile 限制的项目，这些信息可能有用，因为在调用 `git\
  \ pack-objects` 时，这些提交可以作为边缘点。\n\n## --max-pack-size=<n>\n\n每个输出 packfile 的最大大小。默认无限制。\n\
  \n## 性能\n\n`fast-import` 的设计允许以最小的内存占用和处理时间导入大型项目。假设前端能够跟上 `fast-import` 的速度并为其提供持续的数据流，对于拥有\
  \ 10 年以上历史并包含 100,000 多个独立提交的项目，导入时间通常在相当廉的（约 2,000 美元）硬件上仅需 1-2 小时即可完成。\n\n大多数瓶颈出现在对外部源数据的访问上（源数据提取修订的速度不够快）或磁盘\
  \ IO（`fast-import` 的写入速度取决于磁盘接收数据的速度）。如果源数据存储在与目标 Git 仓库不同的驱动器上（由于 IO 竞争较少），导入将运行得更快。\n\
  \n## 开发成本\n\n一个典型的 `fast-import` 前端大约只需要 200 行 Perl/Python/Ruby 代码。尽管开发者是第一次接触 `fast-import`，有时甚至是第一次接触\
  \ Git，但大多数开发者也能在几小时内创建出可工作的导入器。这是一个理想的情况，因为大多数转换工具都是一次性的（使用一次后就永不再复用）。\n\n## 并行操作\n\
  \n与 `git push` 或 `git fetch` 一样，由 `fast-import` 处理的导入可以与并行的 `git repack -a -d` 或\
  \ `git gc` 调用或其他任何 Git 操作安全运行（包括 `git prune`，因为 `fast-import` 永远不会使用松散对象）。\n\n`fast-import`\
  \ 不锁定其正在导入的分支或标签引用（refs）。在导入后的引用更新阶段，`fast-import` 会测试每个现有的分支引用以验证更新将是快进式更新（fast-forward，即引用中存储的提交包含要写入的提交的新历史中）。如果更新不是快进式的，`fast-import`\
  \ 将跳过更新该引用并打印警告信息。`fast-import` 将始终尝试更新所有分支引用，不会在首次失败时停止。\n\n可以使用 `--force` 强制更新分支，但建议仅在原本空闲的仓库中使用。在向空仓库进行初始导入时，不需要使用\
  \ `--force`。\n\n## 技术讨论\n\n`fast-import` 在内存中跟踪一组分支。在导入过程的任何点，都可以通过在输入流上发送 `commit`\
  \ 命令来创建或修改分支。这种设计允许前端程序同时处理无限数量的分支，并按照它们在源数据中的顺序生成提交。它还极地简化了前端程序。\n\n`fast-import`\
  \ 不使用或修改当前工作目录或其中的任何文件。（但它会更新由 `GIT_DIR` 引用的当前 Git 仓库。）因此，导入前端可以使用工作目录用于用途，例如从外部源提取修订。对工作目录的忽略使得\
  \ `fast-import` 运行非常快，因为它在切换分支时不需要执行任何昂贵的文件操作。\n\n## 输入格式\n\n除了原始文件数据（Git 不解释）外，`fast-import`\
  \ 输入格式是基于文本（ASCII）的。这种文本格式简化了前端程序的开发和调试，特别是使用 Perl 等高级语言时。\n\n`fast-import` 对输入非常严格。我们在下文中说的\
  \ SP 指的是一个空格。同样，LF 意味着一个（且仅一个）换行符，HT 意味着一个（且仅一个）制表符。提供空白字符会导致意外结果，例如带有前后空格的分支名称或文件名，或者在遇到意外输入时提前终止\
  \ `fast-import`。\n\n### 流注释\n\n为了帮助调试前端，`fast-import` 会忽略任何 #（ASCII 井）开头的行，直到遇到\
  \ LF。注释行可以包含任何不包含 LF 的字节序列，因此可以包含特定于前端的调试信息，用于检查 `fast-import` 数据流。\n\n### 日期格式\n\
  \n支持以下日期格式。前端应通过 `--date-format=<fmt>` 命令行选项传递格式名称来选择其导入使用的格式。\n\nraw\n\n这是 Git\
  \ 的原生格式，格式为 `<time> SP <offutc>`。如果未指定 `--date-format`，它也是 `fast-import` 的默认格式。\n\
  \n事件时间由 `<time>` 指定，为自 Unix 纪（UTC 1 月 1 日午夜）以来的秒数，并被写为 ASCII 十进制整数。\n\n本地偏移由 `<offutc>`\
  \ 指定，为相对于 UTC 的正或负偏移。例如，EST（比 UTC 晚 5 小时）在 `<tz>` 中表示为 \"-0500\"，而 UTC 为 \"+0000\"\
  。本地偏移不影响 `<time>`；它仅作为帮助格式化程序显示时间戳的建议。\n\n\n\n\n\n如果源材料中无法用本地偏移量，请使用 `\"+0000\"\
  ` 或最常见的本地偏移量。例如，许多组织拥有 CVS 仓库，该仓库仅由位于同一位置和时区的用户访问。在这种情况下，可以假设一个相对于 UTC 的合理偏移量。\n\
  \n与 `rfc2822` 格式不同，这种格式非常严格。任何格式上的变体都会导致 `fast-import` 拒绝该值。\n\n# rfc2822\n\n这是\
  \ RFC 2822 描述的标准邮件格式。\n\n一个示例值为 `\"Tue Feb 6 11:22:18 2007 -0500\"`。Git 解析器是准确的，但稍微有些宽松。它与\
  \ `git am` 在应用从邮件接收的补丁时使用的解析器是同一个。\n\n某些格式错误的字符串可能会被接受为有效日期。在某些情况下，Git 仍然能够从格式错误的字符串中获取正确的日期。此外，某些类型的格式错误字符串会被\
  \ Git 解析错误，但仍认为其有效。严重格式错误的字符串将被拒绝。\n\n与上述原始格式不同，RFC 2822 日期字符串中包含的时区/UTC 偏移量信息将在存储之前用于将日期值调整为\
  \ UTC。因此，这些信息尽可能准确非常重要。\n\n如果源材料使用 RFC 2822 风格的日期，前端应该让 `fast-import` 处理解析和转换（而不是尝试自己处理），因为\
  \ Git 解析器已经在环境中经过了良好的测试。\n\n如果源材料已经使用 UNIX-epoch 格式、可以诱导提供该格式的日期或其格式很容易转换为该格式，则前端应优先使用原始格式，因为解析时没有歧义。\n\
  \n# now\n\n始终使用当前时间和时区。`<when>` 必须始终提供字面量 `now`。\n\n这是一个演示格式。该系统的当前时间和时区会在 `fast-import`\
  \ 创建标识字符串时始终复制到该字符串中。没有办法指定不同的时间或时区。\n\n提供这种特殊格式是因为它实现简单，并且对于想要现在创建新提交的进程可能有用，而无需使用工作目录或\
  \ `git update-index`。\n\n# Commands\n\n`fast-import` 接受多个命令来更新当前仓库并控制当前的导入过程。后文将对每个命令进行更详细的讨论（带有示例）。\n\
  \n### commit\n通过创建一个新提交并更新分支指向新创建的提交，来创建一个新分支或更新现有分支。\n\n### tag\n从现有提交或分支创建一个注释标签对象。此命令不支持轻量级标签，因为不推荐用它们记录有意义的时间点。\n\
  \n### reset\n将现有分支（或新分支）重置到特定的修订。此命令必须用于在不进行提交的情况下，将分支更改到特定修订。\n\n### blob\n将原始文件数据转换为\
  \ blob，供未来在 commit 命令中使用。此命令是可选的，执行导入不需要它。\n\n### checkpoint\n强制 `fast-import` 关闭当前的\
  \ packfile，生成其唯一的 SHA-1 校验和和索引，并启动一个新的 packfile。此命令是可选的，执行导入不需要它。\n\n### progress\n\
  导致 `fast-import` 将整行回显到其自己的标准输出。此命令是可选的，执行导入不需要它。\n\n### done\n标记流的结束。除非使用 `--done`\
  \ 命令行选项或 `done` 命令请求了 done 功能，否则此命令是可选的。\n\n### cat-blob\n导致 `fast-import` 以 `cat-file\
  \ --batch` 格式将 blob 打印到通过 `--cat-blob-fd` 设置的文件描述符或标准输出（如果未指定）。\n\n### ls\n导致 `fast-import`\
  \ 以 `ls-tree` 格式将描述目录条目的行打印到通过 `--cat-blob-fd` 设置的文件描述符或标准输出（如果未指定）。\n\n### feature\n\
  启用指定的特定功能。这要求 `fast-import` 支持指定的功能，如果不支持则中止。\n\n### option\n指定 OPTIONS 下列出的任何选项，且在不改变流语义的前提下以适应前端需求。此命令是可选的，执行导入不需要它。\n\
  \n# commit\n\n使用新提交创建或更新分支，记录项目中的一个逻辑更改。\n\n```\n'commit' SP <ref> LF mark? ('author'\
  \ (SP <name>)? SP LT <email> GT SP <when> LF)? 'committer' (SP <name>)? SP LT <email>\
  \ GT SP <when> LF data ('from' SP <commit-ish> LF)? ('merge' SP <commit-ish> LF)?\
  \ (filemodify | filedelete | filecopy | filerename | filedeleteall | notemodify)*\
  \ LF?\n```\n\n其中 `<ref>` 是要提交的分支名称。在 Git 中，分支名称通常带有 `refs/heads/` 前缀，因此导入 CVS 分支符号\
  \ `RELENG-1_0` 将使用 `refs/heads/RELENG-1_0` 作为 `<ref>` 的值。<ref>` 的值必须是 Git 中有效的 refname。由于\
  \ `LF` 在 Git refname 中无效，因此此处不支持引号或转义语法。\n\n`mark` 命令可能会可选地出现，请求 `fast-import` 保存新创建提交的引用，供前端将来使用（格式见下文）。前端标记每个提交是非常常见的，允许从任何导入的提交创建分支。\n\
  \n`committer` 之后的 `data` 命令必须提供提交消息（语法见下文）。导入空提交消息请使用长度为 0 的。提交消息是自由格式的，Git 不对其进行解释。目前它们必须以\
  \ UTF-8 编码，因为 `fast-import` 不允许指定编码。\n\n可以包含零或多个 `filemodify`、`filedelete`、`filecopy`、`filename`、`filedeleteall`\
  \ 和 `notemodify` 命令，在创建提交之前更新分支的内容。这些命令可以以任何顺序提供。然而，建议在同一提交中 `filedeleteall` 命令在所有\
  \ `filemodify`、`filecopy`、`filename` 和 `notemodify` 命令之前，因为 `filedeleteall` 会清空分支（见下文）。\n\
  \n命令后的 `LF` 是可选的（以前是强制要求的）。\n\n### author\n如果作者信息可能与提交者信息不同，可能会可选出现 `author` 命令。如果省略\
  \ `author`，`fast-import` 将自动使用提交者的信息作为提交的作者部分。关于作者字段的描述见下文，它们与提交者字段相同。\n\n### committer\n\
  `committer` 命令指示谁提交了此提交以及他们何时提交的。\n\n此处 `<name>` 是人的显示名称（例如 \"Com M Itter\"），`<email>`\
  \ 是人的电子邮件地址（\"\"）。`LT` 和 `GT` 是字面的小于号 (\\x3c) 和大于号 (\\x3e) 符号。这些符号用于将电子邮件地址与行中的其他字段隔开。注意\
  \ `<name>` 和 `<email>` 是自由格式的，可以包含任何字节序列，但 `LT`、`GT` 和 `LF` 除外。`<name>` 通常是 UTF-8\
  \ 编码。\n\n更改的时间通过 `<when>` 指定，使用 `--date-format=<fmt>` 命令行选项选择的日期格式。请参上文“日期格式”以获取支持的格式集及其语法。\n\
  \n### from\n`from` 命令用于指定初始化此分支的提交。该修订版本将是新提交的第一个祖先。在此提交处构建的树的状态将从 `from` 提交的状态开始，并被此提交中的内容修改所更改。\n\
  \n\n\n\n\n在新分支的首次提交中省略 `from` 命令将导致 `fast-import` 创建一个没有先祖的提交。这通常只适用于项目的初始提交。如果前端在创建新分支时从头创建所有文件，则可以使用\
  \ `merge` 命令代替 `from` 命令，以从空树开始提交。在现有分支上，省略 `from` 命令通常是符合预期的，因为该分支上的当前提交会被自动认为是新提交的第一个先祖。\n\
  \n由于 `LF` 不在 Git 引用全名（refname）或 `SHA-1` 表达式中有效，因此 `<commit-ish>` 内部不支持任何引号或转义语法。\n\
  \n这里的 `<commit-ish>` 是以下任意内容：\n\n- 存在于 `fast-import` 内部分支表中的现有分支名称。如果 `fast-import`\
  \ 不认识该名称，则将其处理为 `SHA-1` 表达式。\n- 标记引用，`:<idnum>`，其中 `<idnum>` 是标记数字。`fast-import`\
  \ 使用 `:` 来表示标记引用的原因是该字符在 Git 分支名中是不合法的。开头的 `:` 可以轻松地区分标记 `42`（`:42`）与分支 `42`（`42`\
  \ 或 `refs/heads/42`），或恰好由十进制数字组成的缩写 `SHA-1`。\n- 标记在使用之前必须先声明（通过 `mark`）。\n- 完整的\
  \ 40 字节或十六写的提交 `SHA-1`。\n- 任何可以解析为提交的有效 Git `SHA-1` 表达式。详情见 (7) 中的“SPECIFYING REVISIONS”。\n\
  - 特殊的空 `SHA-1`（40 个零）表示要删除该分支。\n\n从当前分支值重启增量导入的特殊情况应写为：\n\n```\nfrom refs/heads/branch⁰\n\
  ```\n\n`⁰` 后缀是必要的，因为 `fast-import` 不允许分支从自身开始，而且在从输入中读取 `from` 命令之前，分支就已经在内存中创建。添加\
  \ `⁰` 将强制 `fast-import` 通过 Git 的修订解析库解析提交，而不是通过其内部分支表，从而加载分支的现有值。\n\n### `merge`\n\
  \n包含一个额外的先祖提交。此额外的祖先链接不会改变在该提交处构建树状态的方式。如果在创建新分支时省略了 `from` 命令，则第一个合并提交将是当前提交的第一个先祖，且分支将从没有任何文件开始。`fast-import`\
  \ 允许每个提交包含无限数量的 `merge` 命令，从而建立 n 路合并。\n\n这里的 `<commit-ish>` 是 `from` 命令同样接受的任何提交规格说明表达式（见上文）。\n\
  \n### `filemodify`\n\n包含在 `commit` 命令中，用于添加新文件或更改现有文件的内容。该命令通过两种不同的方法来指定文件的内容。\n\
  \n#### 外部数据格式\n\n文件的数据内容已由之前的 `blob` 命令提供。前端只需要将其连接起来。\n\n```\n'M' SP <mode> SP\
  \ <dataref> SP <path> LF\n```\n\n这里，`<dataref>` 通常必须是由之前的 `blob` 命令设置的标记引用（`:<idnum>`），或现有\
  \ Git `blob` 对象的完整 40 字节 `SHA-1`。如果 `<mode>` 为 `040000`，则 `<dataref>` 必须是现有 Git\
  \ `tree` 对象的完整 40 字节 `SHA-1` 或通过 `--import-marks` 设置的标记引用。\n\n#### 内联数据格式\n\n文件的数据内容尚未提供。前端希望作为此修改命令的一部分提供它。\n\
  \n```\n'M' SP <mode> SP 'inline' SP <path> LF data\n```\n\n关于 `data` 命令的详细描述请见下文。\n\
  \n在两种格式中，`<mode>` 都是文件条目的类型，以八进制指定。Git 仅支持以下模式：\n\n- `100644` 或 `644`：普通（不可执行）文件。大多数项目中的大多数文件使用此模式。如果不确定，这通常是你需要的。\n\
  - `100755` 或 `755`：普通但可执行的文件。\n- `120000`：符号链接（symlink），文件的内容将是链接目标。\n- `160000`：git\
  \ 链接（gitlink），对象的 SHA-1 指向另一个仓库中的提交。Git 链接只能通过 `SHA` 或提交标记来指定。\n- `040000`：子目录。子目录只能通过\
  \ `SHA` 或通过 `--import-marks` 设置的 `tree` 标记来指定。\n\n在两种格式中，`<path>` 是要添加（如果不存在）或修改（如果已存在）文件的完整路径。\n\
  \n`<path>` 字符串必须使用 UNIX 风格的目录分隔符（正斜杠 `/`），可以包含除 `LF` 外的任何字节，且不能以双引号（\"`）开头。\n\n\
  路径可以使用 C 风格字符串引号；这在所有情况下都是接受的，并且文件名以双引号开头或包含 `LF` 则强制要求。在 C 风格引号中，完整名称应用双引号括起来，任何\
  \ `LF`、反斜杠或双引号字符必须在它们前面加上反斜杠进行转义（例如 `\"path/with\\n, \\\\ and \\\" in it\"`）。\n\n\
  `<path>` 的值必须是规范形式。也就是说它不能：\n\n- 包含空目录组件（例如 `foo//bar` 是无效的），\n- 以目录分隔符结尾（例如 `foo/`\
  \ 是无效的），\n- 以目录分隔符开头（例如 `/foo` 是无效的），\n- 包含特殊组件 `.` 或 `..`（例如 `foo/./bar` 是无效的）。\n\
  \n### `filedelete`\n\n包含在 `commit` 命令中，用于从分支中删除文件或递归删除整个目录。如果文件或目录的删除导致其父目录为空，则父目录也将被删除。此操作会向上级联，直到到达第一个非空目录。\n\
  \n```\n'D' SP <path> LF\n```\n\n这里 `<path>` 是要删除的文件或子目录的完整路径。关于 `path` 的详细描述请见上文\
  \ `filemodify`。\n\n### `filecopy`\n\n将现有文件或目录递归复制到分支内的另一个位置。现有文件或目录必须存在。如果目标存在，它将由从源复制的内容完全替换。\n\
  \n```\n'C' SP <path> SP <path> LF\n```\n\n这里第一个 `<path>` 是源位置，第二个 `<path>` 是目标位置。关于\
  \ `<path>` 可能的样式请见上文 `filemodify`。要使用包含 SP 的源路径，则必须对路径加引号。\n\n`filecopy` 命令立即生效。一旦源位置被复制到目标位置，后续应用于源位置的任何命令都将不会影响复制的目标位置。\n\
  \n### `rename`\n\n将现有文件或目录重命名为分支内的另一个位置。现有文件或目录必须存在。如果目标存在，它将被源目录替换。\n\n```\n'R'\
  \ SP <path> SP <path> LF\n```\n\n这里第一个 `<path>` 是源位置，第二个 `<path>` 是目标位置。关于 `<path>`\
  \ 可能的样式请见上文 `filemodify`。要使用包含 SP 的源路径，则必须对路径加引号。\n\n`rename` 命令立即生效。一旦源位置被重命名为目标位置，后续应用于源位置的任何命令将在那里创建新文件，而不会影响重命名的目标。\n\
  \n注意 `rename` 等于 `filecopy` 后对源位置执行 `filedelete`。使用 `rename` 有微小的性能优势，但这种优势非常细微，完全不值得尝试将源材料中的删除/添加对转换为\
  \ `rename`。\n\n### `filedeleteall`\n\n包含在 `commit` 命令中，用于从分支中删除所有文件（以及所有目录）。该命令将内部分支结构重置为为空，允许前端随后从头添加所有感兴趣的文件。\n\
  \n```\n'deleteall' LF\n```\n\n\n\n\n\n如果前端不知道（或不在乎）当前分支上有哪些文件，因此无法生成正确的 `filedelete`\
  \ 命令来更新内容，那么此命令将非常有用。\n\n执行 `filedeleteall` 紧接着执行所需的 `filemodify` 命令以设置正确的内容，其结果与仅发送所需的\
  \ `filemodify` 和 `filedelete` 命令相同。然而，`filedeleteall` 方法可能需要 `fast-import` 为每个活动分支使用略多的内存（即使对于大多数大型项目，内存量也小于\
  \ 1 MiB）；因此，建议能够轻松获取 commit 中受影响路径的前端这样做。\n\n`notemodify`\n\n包含在 `commit <notes_ref>`\
  \ 命令中，用于为 `<commit-ish>` 添加新的注释（annotating note）或修改此注释内容。在内部，它类似于在 `<commit-ish>`\
  \ 路径上执行 `filemodify 100644`（可能被拆分为子目录）。除了使用 `filedeleteall` 删除此树中的所有现有注释外，不建议使用任何其他命令写入\
  \ `<notes_ref>` 树。该命令有两种不同的方式来指定注释的内容。\n\n#### 外部数据格式\n\n用于注释的数据内容已由之前的 blob 命令提供。前端只需要将其连接到要注释的\
  \ commit 上。\n\n```\n'N' SP <dataref> SP <commit-ish> LF\n```\n\n在这里，`<dataref>`\
  \ 可以是之前的 blob 命令设置的标记引用（`:<idnum>`），也可以是现有 Git blob 对象的完整 40 字节 SHA-1。\n\n#### 内联数据格式\n\
  \n注释的数据内容尚未提供。前端希望作为此修改命令的一部分提供它。\n\n```\n'N' SP 'inline' SP <commit-ish> LF data\n\
  ```\n\n详见下文对数据命令的详细描述。\n\n在两种格式中，`<commit-ish>` 都是 `from` 命令同样接受的 commit 指定表达式之一（见上文）。\n\
  \n### mark\n\n安排 `fast-import` 保存对当前对象的引用，允许前端在未来无需知道 SHA-1 的情况下回溯该对象。这里的当前对象是 `mark`\
  \ 命令所在的对象创建命令。它可以是 `commit`、`tag` 和 `blob`，但 `commit` 是最常用的用法。\n\n```\n'mark' SP\
  \ ':' <idnum> LF\n```\n\n其中 `<idnum>` 是前端分配给此标记的数字。`<idnum>` 的值用 ASCII 十进制整数表示。值\
  \ 0 被保留，不能作为标记。只有大于或等于 1 的值可以作为标记。\n\n新标记会自动创建。只需通过在另一个 `mark` 命令中重用相同的 `<idnum>`，即可现有标记移动到另一个对象。\n\
  \n### tag\n\n创建一个指向特定 commit 的注释标签。要创建轻量级（非注释）标签，请参阅下方的 `reset` 命令。\n\n```\n'tag'\
  \ SP <name> LF 'from' SP <commit-ish> LF 'tagger' (SP <name>)? SP LT <email> GT\
  \ SP <when> LF data\n```\n\n其中 `<name>` 是要创建的标签名称。\n\n标签名在存储到 Git 时会自动带有 `refs/tags/`\
  \ 前缀，因此导入 CVS 分支符号 `RELENG-1_0-FINAL` 时，`<name>` 仅使用 `RELENG-1_0-FINAL`，`fast-import`\
  \ 将将对应的引用写入 `refs/tags/RELENG-1_0-FINAL`。\n\n`<name>` 的值必须是 Git 中有效的引用名，因此可以包含正斜杠。由于\
  \ `LF` 在 Git 引用名中无效，此处不支持任何引号或转义语法。\n\n`from` 命令与 `commit` 命令中的相同；详情请见上文。\n\n`tagger`\
  \ 命令使用的格式与 `commit` 内部的 `committer` 相同；详情请见上文。\n\n跟随 `tagger` 之后的 `data` 命令必须提供注释标签消息（详见下文数据命令语法）。要导入空标签消息，请使用长度为\
  \ 0 的 `data`。标签消息是自由格式的，不会被 Git 解释。目前它们必须编码为 UTF-8，因为 `fast-import` 不允许指定其他编码。\n\
  \n不支持在 `fast-import` 内部从导入时对注释标签进行签名。不建议尝试包含您自己的 PGP/GPG 签名，因为前端无法（轻松）访问通常进入此类签名的完整字节集。如果需要签名，请在\
  \ `fast-import` 内部通过 `reset` 创建轻量级标签，然后使用标准的 `git tag` 离线创建这些标签的注释版本。\n\n### reset\n\
  \n创建（或重新创建）命名的分支，可选地从特定版本开始。`reset` 命令允许前端对现有分支发布新的 `from` 命令，或者从现有 commit 创建新分支而不创建新\
  \ commit。\n\n```\n'reset' SP <ref> LF ('from' SP <commit-ish> LF)? LF?\n```\n\n\
  关于 `<ref>` 和 `<commit-ish>` 的详细描述，请参阅上文的 `commit` 和 `from` 部分。\n\n命令后的 `LF` 是可选的（以前是强制的）。\n\
  \n`reset` 命令也可以用于创建轻量级（非注释）标签。例如：\n\n```\nreset refs/tags/938 from :938\n```\n\n\
  这将创建一个轻量级标签 `refs/tags/938`，指向标记 `:938` 所引用的任何 commit。\n\n### blob\n\n请求向 packfile\
  \ 写入一个文件版本。该版本未与任何 commit 连接；这种连接必须在后续的 commit 命令中通过分配标记引用 blob 来建立。\n\n```\n'blob'\
  \ LF mark? data\n```\n\n在这里 `mark` 命令是可选的，因为某些前端选择自行生成 blob 的 Git SHA-1 并直接传递给 `commit`。然而，这通常工作不划算，因为标记存储成本低廉且易于使用。\n\
  \n### data\n\n向 `fast-import` 提供原始数据（用于 blob/文件内容、commit 消息或注释标签消息）。数据可以使用精确字节数提供或使用终止行分隔符提供。旨在用于生产级转换的真实前端应始终使用精确字节数格式，因为它更健壮且性能更好。分隔符格式主要用于测试\
  \ `fast-import`。\n\n出现在数据命令 `<raw>` 部分的注释行始终被视为数据正体的一部分，因此 `fast-import` 永远不会忽略。这使得导入任何行可能以\
  \ `#` 开头的文件/消息内容时都是安全的。\n\n#### 精确字节数格式\n\n前端必须指定数据的字节数。\n\n```\n'data' SP <count>\
  \ LF <raw> LF?\n```\n\n其中 `<count>` 是出现在 `<raw>` 内的精确字节数。`<count>` 的值用 ASCII 十进制整数表示。`<raw>`\
  \ 两侧的 `LF` 不包含在 `<count>` 中，也不会包含在导入的数据中。\n\n`<raw>` 后的 `LF` 是可选的（以前是强制的），但建议包含。始终包含它会让调试\
  \ `fast-import` 流变得更容易，因为下一个命令始终从下一行的第 0 列开始，即使 `<raw>` 没有以 `LF` 结尾。\n\n#### 分隔符格式\n\
  \n使用分隔符字符串标记数据的结束。`fast-import` 将通过搜索分隔符来计算长度。这种格式主要用于测试，建议用于真实数据。\n\n```\n'data'\
  \ SP '<<' <delim> LF <raw> LF <delim> LF LF?\n```\n\n其中 `<delim>` 是所选的分隔符。字符串 `<delim>`\
  \ 不得在 `<raw>` 中单独占据一行，否则 `fast-import` 会认为数据比实际结束得早。紧随 `<raw>` 之后的 `LF` 是 `<raw>`\
  \ 的一部分。这是分隔符格式的限制之一，无法提供一个不以 `LF` 作为最后一个字节的数据块。\n\n`<delim> LF` 之后的 `LF` 是可选的（以前是强制的）。\n\
  \n### checkpoint\n\n强制 `fast-import` 关闭当前 packfile，启动一个新的，并保存所有当前的分支引用、标签和标记。\n\n\
  ```\n'checkpoint' LF LF?\n```\n\n注意，当当前 packfile 达到 `--max-pack-size` 或 4 GiB（以较小者准）时，`fast-import`\
  \ 会自动切换 packfile。在自动切换 packfile 期间，`fast-import` 不更新分支引用、标签或标记。\n\n\n\n由于检查点（checkpoint）需要大量的\
  \ CPU 时间和磁盘 I/O（用于计算整个包的 SHA-1 校验和、生成相应的索引文件以及更新 refs），单个检查点命令可能需要几分钟才能完成。\n\n前端可能会在极大且长时间运行的导入过程中发布检查点，或者在需要允许另一个\
  \ Git 进程访问分支时发布检查点。然而，考虑到一个 30 GiB 的 Subversion 仓库可以通过 `fast-import` 在约 3 小时内加载到\
  \ Git 中，显式的检查点可能并非必要的。\n\n命令后的 LF 是可选的（以前是强制要求的）。\n\n### progress\n\n当从输入流处理该命令时，使\
  \ `fast-import` 封封不动地将整行进度信息打印到其标准输出通道（文件描述符 1）。否则，该命令对当前的导入或 `fast-import` 的任何内部状态均无产生影响。\n\
  \n`'progress' SP <any> LF LF?`\n\n命令的 `<any>` 部分可以包含任何不包含 LF 的字节序列。命令后的 LF 是可选的。调用者可能希望通过\
  \ `sed` 等工具处理输出以删除行的开头部分，例如：\n\n`frontend | git fast-import | sed 's/^progress //'`\n\
  \n在检查点之后立即放置进度命令将告知读者检查点何时完成，此时它就可以安全地访问 `fast-import` 更新的 refs。\n\n### cat-blob\n\
  \n使 `fast-import` 将 blob 打印到之前通过 `--cat-blob-fd` 参数指定的句描述符中。否则，该命令对当前的导入无任何影响；其主要目的是获取可能在\
  \ `fast-import` 内存中但无法从目标仓库访问的 blob。\n\n`'cat-blob' SP <dataref> LF`\n\n`<dataref>`\
  \ 可以是之前设置的标记引用（`:<idnum>`），也可以是 Git blob 的完整 40 字节 SHA-1（无论它是已存在还是准备好写入）。\n\n输出使用的格式与\
  \ `git cat-file --batch` 相同：\n\n`<sha1> SP 'blob' SP <size> LF <contents> LF`\n\n\
  该命令可以用于接受注释的流中的任何位置。特别是 `cat-blob` 命令可以在 commit 的中间使用，但不能在数据命令的中间使用。\n\n见下文“命令的响应”获取有关如何安全读取此输出的详细信息。\n\
  \n### ls\n\n将路径处的对象信息打印到之前通过 `--cat-blob-fd` 参数指定的句符中。这允许从活跃 commit 中打印 blob（使用\
  \ `cat-blob`），或从之前的 commit 中复制 blob 或 tree 以供当前 commit 使用（使用 `filemodify`）。\n\n\
  `ls` 命令可以用于接受注释的流中的任何位置，包括 commit 的中间。\n\n#### 从活跃 commit 中读取\n\n此形式只能在 commit 的中间使用。路径名指向\
  \ `fast-import` 活跃 commit 中的目录项。在这种情况下，路径必须加引号。\n\n`'ls' SP <path> LF`\n\n#### 从命名树读取\n\
  \n`<dataref>` 可以是标记引用（`:<idnum>`），也可以是 Git tag、commit 或 tree 对象的完整 40 字节 SHA-1（无论它是已存在还是等待写入）。路径相对于\
  \ `<dataref>` 命名树的顶层。\n\n`'ls' SP <dataref> SP <path> LF`\n\n见上文 `filemodify` 获取关于\
  \ `<path>` 的详细描述。\n\n输出使用的格式与 `git ls-tree <tree> -- <path>` 相同：\n\n`<mode> SP ('blob'\
  \ | 'tree' | 'commit') SP <dataref> HT <path> LF`\n\n`<dataref>` 代表 `<path>` 处的\
  \ blob、tree 或 commit 对象，可以在后续的 `cat-blob`、`filemodify` 或 `ls` 命令中使用。\n\n如果该路径没有文件或子树，`git\
  \ fast-import` 将报告：\n\n`missing SP <path> LF`\n\n见下文“命令的响应”获取有关如何安全读取此输出的详细信息。\n\
  \n### feature\n\n要求 fast-import 支持指定的特性，不支持则中止。\n\n`'feature' SP <feature> ('='\
  \ <argument>)? LF`\n\n命令的 `<feature>` 部分可以是以下任一内容：\n\n- `date-format, export-marks,\
  \ relative-marks, no-relative-marks, force`: 表现就像在命令行上传递了带有 `--` 的相应的命令行选项（见上文 OPTIONS）。\n\
  - `import-marks, import-marks-if-exists`: 类似于 `--import-marks`，但有两点不同：第一，每个流只允许一个\
  \ \"feature import-marks\" 或 \"feature import-marks-if-exists\" 命令；第二，`--import-marks=`\
  \ 或 `--import-marks-if-exists` 命令行选项会覆盖流中的任何此类 \"feature\" 命令；第三，“feature import-marks-if-exists\"\
  \ 与相应的命令行选项一样静默跳过不存在的文件。\n- `cat-blob, ls`: 要求后端支持 `cat-blob` 或 `ls` 命令。不支持指定命令的\
  \ `fast-import` 版本将带有相应的消息退出。这使得导入能够带有清晰的消息尽早报错，而不是在检测到不支持的命令之前在导入的早期浪费时间。\n- `notes`:\
  \ 要求后端支持 `commit` 命令的 `notemodify` (N) 子命令。不支持 notes 的 `fast-import` 版本将带有相应的消息退出。\n\
  \n- `done`: 如果流结束时没有 `done` 命令，则报错。如果没有此特性，导致前端意外结束的错误可能无法被检测。\n\n### option\n\n\
  处理指定的选项，使 `fast-import` 的行为符合前端的需求。请注意，前端指定的选项会被用户可能为 `git fast-import` 本身指定的任何选项所覆盖。\n\
  \n`'option' SP <option> LF`\n\n命令的 `<option>` 部分可以包含 OPTIONS 节中列出的任何不导入语义的选项，但不带前缀\
  \ `--` 并以相同的方式处理。\n\n选项命令必须是输入中的第一个命令（不计算 feature 命令），否则在任何非选项命令之后给出选项命令将报错。\n\n\
  以下命令行选项会改变导入语义，因此不能作为选项传递：\n\n- `date-format`\n- `import-marks`\n- `export-marks`\n\
  - `cat-blob-fd`\n- `force`\n\n### done\n\n如果没有使用 `done` 特性，则被视为读取了 EOF。这可以用于告诉 fast-import\
  \ 提前结束。\n\n如果使用了 `--done` 命令行选项或 `done` 特性，则 `done` 命令是强制性的，并标记流的结束。\n\n## 命令的响应\n\
  \nfast-import 写入的新对象并非立即可用。大多数 fast-import 命令在下一个检查点（或完成）之前没有可见效果。前端可以发送命令来填充 fast-import\
  \ 的输入管道，而无需担心它们何时生效，这通过简化调度提升了性能。\n\n然而，对于某些前端来说，能够从正在更新的仓库中读回数据是有用的（例如当源材料描述应用到已导入对象的补丁时）。这可以通过双向管道连接前端和\
  \ fast-import 实现：\n\n`mkfifo fast-import-output frontend <fast-import-output | git\
  \ fast-import >fast-import-output`\n\n以此设置的前端可以使用 `progress`、`ls` 和 `cat-blob` 命令从进行中的导入读取信息。\n\
  \n为了避免死锁，此类前端在执行可能阻塞的 fast-import 写入之前，必须完全消耗 `progress`、`ls` 和 `cat-blob` 的待处理输出。\n\
  \n## 崩溃报告\n\n如果 `fast-import` 提供无效输入，它将以非零退出状态终止，并在其导入的 Git 仓库顶层创建一个崩溃报告。崩溃报告包含了\
  \ fast-import 内部状态的快照以及导致崩溃的最近命令。\n\n\n\n\n所有最近的命令（包括流注释、文件更改和进度命令）都显示在崩溃报告的命令历史，但原始文件数据和提交消息会被排除在崩溃报告之外。这种排除节省了报告文件空间，并减少了\
  \ `fast-import` 在执行期间必须执行的缓冲量。\n\n写入崩溃报告后，`fast-import` 将关闭当前的 packfile 并导出标记表（marks\
  \ table）。这允许前端开发者检查仓库状态并从崩溃点继续导入。修改过的分支和标签在崩溃期间不会更新，因为导入并未成功完成。可以在崩溃报告中找到分支和标签信息，如果需要更新，必须手动应用。\n\
  \n一个崩溃示例：\n\n```\n$ cat >in <<END_OF_INPUT # my very first test commit commit refs/heads/master\
  \ committer Shawn O. Pearce <spearce> 19283 -0400 # who is that guy anyway? data\
  \ <<EOF this is my commit EOF M 644 inline .gitignore data <<EOF .gitignore EOF\
  \ M 777 inline bob END_OF_INPUT\n\n$ git fast-import <in fatal: Corrupt mode: M\
  \ 777 inline bob fast-import: dumping crash report to .git/fast_import_crash_8434\n\
  \n$ cat .git/fast_import_crash_8434 fast-import crash report: fast-import process:\
  \ 8434 parent process : 1391 at Sat Sep 1 00:58:12 2007\n\nfatal: Corrupt mode:\
  \ M 777 inline bob\n\nMost Recent Commands Before Crash ---------------------------------\
  \ # my very first test commit commit refs/heads/master committer Shawn O. Pearce\
  \ <spearce> 19283 -0400 # who is that guy anyway? data <<EOF M 644 inline .gitignore\
  \ data <<EOF * M 777 inline bob\n\nActive Branch LRU ----------------- active_branches\
  \ = 1 cur, 5 max\n\npos clock name ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\
  \ 1) 0 refs/heads/master\n\nInactive Branches ----------------- refs/heads/master:\
  \ status : active loaded dirty tip commit : 00000000000000000000000000000000000000000\
  \ old tree : 000000000000000000000000000000000000000000 cur tree : 000000000000000000000000000000000000000000\
  \ commit clock: 0 last pack : :\n\n------------------- END OF CRASH REPORT\n```\n\
  \n## 提示与技巧\n\n以下提示和技巧是从各种 `fast-import` 用户那里收集的，在此提供作为建议。\n\n### 每个提交使用一个标记（Mark）\n\
  \n在进行仓库转换时，为每个提交使用一个唯一的标记（`mark:<n>`）并在命令行上提供 `--export-marks` 选项。`fast-import`\
  \ 将导出一个文件，列出每个标记及其对应的 Git 对象 SHA-1。如果前端可以将这些标记关联回源仓库，则可以通过比较每个 Git 提交与相应的源版本，轻松验证导入的准确性和完整性。\n\
  \n如果来自 Perforce 或 Subversion 等系统，这应该非常简单，因为 `fast-import` 标记也可以是 Perforce 更改集号或\
  \ Subversion 版本号。\n\n### 自由在分支间跳转\n\n不要试图优化前端以便在导入期间一次只固定在一个分支。虽然这样做对 `fast-import`\
  \ 可能会稍微快一点，但往往会显著增加前端代码的复杂度。\n\n`fast-import` 内置的分支 LRU（最近最少使用）机制表现非常好，激活非活动分支的成本极低，以至于在分支之间切换对导入性能几乎没有影响。\n\
  \n### 处理重命名\n\n在导入重命文件或目录时，只需在相应的提交期间删除旧名称并修改新名称即可。Git 在提交后才进行重命名检测，而不是在提交期间显式地进行。\n\
  \n### 使用标签修复分支（Tag Fixup Branches）\n\n某些其他 SCM 系统允许用户从多个并非同一提交/更改集的文件创建标签，或者创建仓库中可用文件子集的标签。\n\
  \n在 Git 中按原导入这些标签是不可能的，除非至少提交一个提交来“修复”文件以匹配标签的内容。使用 `fast-import` 的 `reset` 命令将一个位于你正常分支空间外的虚拟分支重置为标签的基础提交，然后提交一个或多个文件修复提交，最后标记该虚拟分支。\n\
  \n例如，由于所有正常分支都存储在 `refs/heads/` 下，将标签修复分支命名为 `TAG_FIXUP`。这样，导入器使用的修复分支就不会与源导入的真实分支产生命名空间冲突（`TAG_FIXUP`\
  \ 不是 `refs/heads/TAG_FIXUP`）。\n\n在提交修复内容时，考虑使用 `mergemerge` 来连接为修复分支提供文件版本的提交。这样做允许\
  \ `git blame` 等工具跟踪真实的提交历史并正确地标注源文件。\n\n在 `fast-import` 终止后，前端需要执行 `rm .git/TAG_FIXUP`\
  \ 来移除虚拟分支。\n\n### 立即导入，稍后重新打包\n\n一旦 `fast-import` 完成，Git 仓库就是完全有效并准备好使用的。这通常只需要很短的时间，即使对于大型项目（100,000+\
  \ 个提交）。\n\n然而，重新打包（repacking）仓库对于提高数据局部性和访问性能是必要的。在极大型项目上，这可能需要几个小时（特别是当使用 `-f`\
  \ 和较大的 `--window` 参数时）。由于重新打包可以在读取器和写入器旁边安全运行，请在后台运行重新打包并让它自行完成。没有理由等待才开始探索你的新 Git\
  \ 项目！\n\n如果你选择等待重新打包，在重新打包完成之前，不要尝试运行基准测试或性能测试。`fast-import` 输出的次优 packfile 在实际使用场景中永远不会出现。\n\
  \n### 重新打包历史数据\n\n如果你正在重新打包非常旧的导入数据（例如早于一年前的数据），考虑花费一些额外的 CPU 时间并在运行 `git repack`\
  \ 时提供 `--window=50`（或更高）。这将花费更长时间，但也会产生更小的 packfile。你只需要花费一次精力，所有使用你项目的人都将从更小的仓库中受益。\n\
  \n### 包含进度消息\n\n偶尔让你的前端向 `fast-import` 发送进度消息。消息的内容完全是自由格式的，因此建议每当当前提交日期进入下个月时输出当前的月份和年份。你的用户知道已经处理了多少数据流，会感觉更好。\n\
  \n\n\n\n基于此，强烈建议用户在 `fast-import` 完成后使用 `git repack -a -d` 重新打包仓库，允许 Git 重新组织包文件以加快数据访问。如果\
  \ blob 增量（deltas）并非理想（见上文），添加 `-f` 选项强制重新计算所有增量可以显著减少最终包文件的大小（通常减小 30-50% 是很常见的）。\n\
  \n# 内存占用\n\n许多因素会影响 `fast-import` 执行导入时所需的内存量。与 Git 核心的关键区域一样，`fast-import` 使用自己的内存分配器来分摊与\
  \ `malloc` 相关的开销。在实践中，由于使用了大块内存分配，`fast-import` 倾向于将任何 `malloc` 开销降低至 0。\n\n###\
  \ 每个对象 (per object)\n\n`fast-import` 为本次执行中写入的每个对象维护一个内存中的结构。在 32 位系统上，该结构占用 32\
  \ 字节；在 64 位系统上占用 40 字节（由于指针尺寸较大）。表中的对象在 `fast-import` 终止之前不会被释放。在 32 位系统上导入 200\
  \ 万个对象大约需要 64 MiB 内存。对象表实际上是以对象名称（唯一的 SHA-1）为键的哈希表。这种存储允许 `fast-import` 重用已存在或已写入的对象，避免重复写入包文件。在导入过程中，由于分支合并，重复\
  \ blob 的出现出意外地常见。\n\n### 每个标记 (per mark)\n\n标记存储在一个稀疏数组中，每个标记使用一个指针（4 字节或 8 字节，取决于指针大小）。尽管数组是稀疏的，但仍强烈建议前端使用在\
  \ 1 到 `n` 标记的标记，其中 `n` 是本次导入所需的标记总数。\n\n### 每个分支 (per branch)\n\n分支被分为活跃（active）和非活跃（inactive）。这两类的内存使用差异显著。\n\
  \n非活跃分支存储在一个结构中，每个分支使用 96 或 120 字节（分别对应 32 位或 64 位系统），加上分支名称长度（通常小于 200 字节）。`fast-import`\
  \ 可以轻松地在 2 MiB 内存内处理 10,000 个非活跃分支。\n\n活跃分支具有非活跃分支相同的开销，但还包含该分支最近修改过的每个树的副本。如果分支自变为活跃以来未被修改，则其内容不会加载到内存中；但如果分支在活跃后已被\
  \ `commit` 修改，则其内容将被加载。由于活跃分支存储该分支包含的文件元数据，其内存存储大小可能会增长（见下文）。`fast-import` 根据简单的最未使用算法自动将活跃分支移动到非活跃状态。LRU\
  \ 链在每次 `commit` 命令时更新。可以通过命令行 `--active-branches=` 增加或减少活跃分支的数量。\n\n### 每个活跃树 (per\
  \ active tree)\n\n树（即目录）除了条目所需的内存外仅使用 12 字节内存。树的成本几乎为 0，因为其开销分摊到了单个文件条目。\n\n###\
  \ 每个活跃文件 (per active file)\n\n活跃树中的文件（以及指向树的指针）每个条目需要 52 或 64 字节（32/64 位平台）。为了节省空间，文件名和树名被池化在一个字符串表中，无论在项目中出现多少次。活跃分支\
  \ LRU 结合文件名字符串池和树的懒加载，允许 `fast-import` 在极有限的内存占用下导入 2000+ 分支和 45114+ 文件（每个活跃分支小于\
  \ 2.7 MiB）。\n\n# 信号 (SIGNALS)\n\n向 `git fast-import` 进程发送 `SIGUSR1` 会提前结束当前的包文件，模拟检查命令。急躁的操作可以使用此机制查看正在导入的对象和引用，代价是增加了一些运行时间和更差的压缩。\n\
  \n# 参见 (SEE ALSO)\n\n(1)\n\n* *\n\n# GIT-FETCH-PACK\n\n## 名称\n\ngit-fetch-pack -\
  \ 从另一个仓库接收缺失的对象\n\n## 概要 (SYNOPSIS)\n\n`git fetch-pack` \"[--all] [--quiet|-q] [--keep|-k]\
  \ [--thin] [--include-tag] [--upload-pack=<git-upload-pack>] [--depth=<n>] [--no-progress]\
  \ [-v] <repository> [<refs>...]`\n\n## 描述 (DESCRIPTION)\n\n通常你会希望使用 `git fetch`，它是该命令的高级封装。\n\
  \n它在可能的远程仓库上调用 `git-upload-pack`，并请求其发送该仓库缺失的对象以更新命名头部。本地的提交列表通过扫描本地 `refs/` 层级找到，并发送到运行在另一端的\
  \ `git-upload-pack`。当本地没有共同祖先提交时，该命令退化为下载所有内容以完成远程所需的引用。\n\n## 选项 (OPTIONS)\n\n\
  --all\n\n获取所有远程引用。\n\n--stdin\n\n从 `stdin` 读取引用列表，每行一个。除了此选项外命令行还指定了引用，则 `stdin`\
  \ 中的引用将在命令行引用之后处理。\n\n如果与此选项一起指定 `--stateless-rpc`，引用列表必须是包格式（`pkt-line`）。每个引用必须在一个包中，列表必须以刷新包（flush\
  \ packet）结束。\n\n-q, --quiet\n\n将 `-q` 标志传递给 `git unpack-objects`；这会让拷贝过程不那么详细。\n\
  \n-k, --keep\n\n不要对接收的数据调用 `git unpack-objects`，而是将其创建一个单个包文件，并存储在对象数据库中。如果提供两次，则该包被锁定无法重新打包。\n\
  \n--thin\n\n获取一个“薄”包，它根据包中未包含的对象以增量形式记录对象，以减少网络流量。\n\n--include-tag\n\n如果远程端支持，如果标记引用的对象被下载，则注释标记对象将与其他对象在同一连接中下载。否则，调用者必须确定此选项提供了哪些标记。\n\
  \n--upload-pack=<git-upload-pack>\n\n如果在你的 `$PATH` 中未找到，使用此项指定远程侧 `git-upload-pack`\
  \ 的路径。sshd 的安装会忽略登录 shell 的用户环境设置脚本（例如 `.bash_profile`），你私安装的 git 可能在系统默认 `$PATH`\
  \ 中找不到。另一个建议的变通方法是在 `.bashrc` 中设置 `$PATH`，但此标志适用于那些不想通过精简 `.bashrc` 文件为非交互式 shell\
  \ 支付开销的人（他们将大部分设置放在 `.bash_profile` 中）。\n\n--exec=<git-upload-pack>\n\n与 `--upload-pack=<git-upload-pack>`\
  \ 相同。\n\n--depth=<n>\n\n限制获取长度不超过 `n` 的祖先链。`git-upload-pack` 将特殊深度 2147483647 视为无限，即使存在那么长的链。\n\
  \n--no-progress\n\n不显示进度。\n\n--check-self-contained-and-connected\n\n如果收到的包是自包含且连接的，则输出\
  \ \"connectivity-ok\"。\n\n-v\n\n详细运行。\n\n<repository>\n\n远程仓库的 URL。\n\n<refs>...\n\
  \n要从其更新的远程头部。相对于 `$GIT_DIR`（例如 \"HEAD\", \"refs/heads/master\"）。未指定时，从远程端所有的头部进行更新。\n\
  \n\n\n从一个或多个其他仓库获取分支和/或标签（统称为“refs”）以及完成其历史记录所需的对象。远程跟踪分支将被更新（有关控制此行为的方法，请参见下文对\
  \ `<refspec>` 的描述）。\n\n默认情况下，任何指向被获取历史记录的标签也会被获取；其效果是获取指向你感兴趣的分支的标签。这种默认行为可以通过 `--tags`\
  \ 或 `--no-tags` 选项，或者通过配置 `remote.<name>.tagOpt` 来更改。通过使用显式获取标签的 refspec，你还可以获取那些没有指向你所感兴趣的分支的标签。\n\
  \n`git fetch` 可以从单个命名的仓库或 URL 获取，也可以在给定了 `<group>` 且配置文件中存在 `remotes.<group>` 条目的情况下，一次性从多个仓库获取。（参见\
  \ (1)）。\n\n[content] \n在未指定远程仓库的情况下，默认将使用 `origin` 远程仓库，除非当前分支配置了上游分支。\n\n被获取的 refs\
  \ 名称以及它们指向的对象名称将写入 `.git/FETCH_HEAD`。这些信息可能被脚本或其他 git 命令使用，例如 (1)。\n\n### 选项\n\n\
  ### --all\n获取所有远程仓库。\n\n### -a, --append\n将获取的 refs 的名称和对象名称追加到 `.git/FETCH_HEAD`\
  \ 的现有内容中。如果没有此选项，`.git/FETCH_HEAD` 中的旧数据将被覆盖。\n\n### --depth=<depth>\n深化或缩短由 `git\
  \ clone` 使用 `--depth=<depth>` 选项创建的*浅层*（shallow）仓库的历史（参见 (1)），使其延伸到每个远程分支历史顶端起的指定提交数。对于深化的提交，标签不会被获取。\n\
  \n### --unshallow\n如果源仓库是完整的，则将浅层仓库转换为完整仓库，移除浅层仓库产生的所有限制。\n如果源仓库是浅层的，则尽可能获取，使当前仓库与源仓库具有相同的历史。\n\
  \n### --update-shallow\n默认情况下，当从浅层仓库获取内容时，`git fetch` 会拒绝需要更新 `.git/shallow` 的 refs。此选项会更新\
  \ `.git/shallow` 并接受此类 refs。\n\n### --dry-run\n显示将要执行的操作，但不进行任何更改。\n\n### -f, --force\n\
  当使用 `<rbranch>:<lbranch>` refspec 执行 `git fetch` 时，除非获取的远程分支 `<rbranch>` 是 `<lbranch>`\
  \ 的后代，否则它将拒绝更新本地分支 `<lbranch>`。此选项将覆盖该检查。\n\n### -k, --keep\n保留下载的 pack 文件。\n\n\
  ### --multiple\n允许指定多个 `<repository>` 和 `<group>` 参数。不能指定任何 `<refspec>`。\n\n###\
  \ -p, --prune\n获取后，删除任何在远程端已不存在的远程跟踪引用。如果标签仅是因为默认的标签自动跟随或由于 `--tags` 选项而被获取，则它们不受剪裁的影响。然而，如果标签是因为显式\
  \ refspec 获取的（例如在命令行中或远程配置中，或者如果远程仓库是使用 `--mirror` 选项克隆的），则它们也将受到剪裁的影响。\n\n### -n,\
  \ --no-tags\n默认情况下，指向从远程仓库下载对象的标签会被获取并存储在本地。此选项禁用了这种自动跟踪标签。远程仓库的默认行为可以通过 `remote.<name>.tagOpt`\
  \ 设置来指定。参见 (1)。\n\n### --refmap=<refspec>\n在获取命令行列出的 refs 时，使用指定的 refspec（可以给出多次）将\
  \ refs 映射到远程跟踪分支，而不是使用该远程仓库的 `remote.*.fetch` 配置变量的值。详细信息请参见“配置的远程跟踪分支”章节。\n\n###\
  \ -t, --tags\n除了其他可能获取的所有内容外，从远程获取所有标签（即将远程标签 `refs/tags/*` 获取到本地同名的标签中）。单独使用此选项不会使标签受到剪裁，即使使用了\
  \ `--prune`（但如果标签也是显式 refspec 的目标，它们可能仍会被剪裁；参见 `--prune`）。\n\n### --recurse-submodules[=yes|on-demand|no]\n\
  此选项控制是否以及在什么种条件下也获取已填充子模块的新提交。它可以作为布尔选项使用：当设置为 `no` 时完全禁用递归；当设置为 `yes` 时无条件地进入所有已填充的子模块（这是在使用选项时不带任何值时的默认值）。使用\
  \ `on-demand` 仅当超父项目获取了更新子模块引用的提交，且该提交不在本地子模块克隆中时，才递归进入已填充的子模块。\n\n### --no-recurse-submodules\n\
  禁用子模块的递归获取（这等同于使用 `--recurse-submodules=no` 选项）。\n\n### --submodule-prefix=<path>\n\
  在信息消息（如“Fetching submodule foo”）中打印的路径前加上 `<path>`。此选项在递归处理子模块时内部使用。\n\n### --recurse-submodules-default=[yes|on-demand]\n\
  此选项内部用于为 `--recurse-submodules` 选项临时提供一个非负默认值。所有其他配置 fetch 子模块递归的方法（例如 (5) 和 (1)\
  \ 中的设置）都会覆盖此选项，直接指定 `--[no-]recurse-submodules` 也是如此。\n\n### -u, --update-head-ok\n\
  默认情况下 `git fetch` 拒绝更新对应当前分支的头。此标志禁用该检查。这纯用于 `git pull` 内部与 `git fetch` 通信，除非你正在实现自己的\
  \ Porcelain（用户界面），否则不应该使用它。\n\n### --upload-pack <upload-pack>\n如果提供了该参数，且要获取的仓库由\
  \ `git fetch-pack` 处理，则会将 `--exec=<upload-pack>` 传递给命令，以指定在对方运行命令的非默认路径。\n\n###\
  \ -q, --quiet\n将 `--quiet` 传递给 `git-fetch-pack` 并静默其他内部使用的 git 命令。进度不会报告到标准错误流。\n\
  \n### -v, --verbose\n详细输出。\n\n### --progress\n当连接到终端时，默认将进度状态报告到标准错误流，除非指定了 `-q`。此标志即使在标准错误未定向到终端也会强制报告进度状态。\n\
  \n### <repository>\n作为 fetch 或 pull 操作的“远程”仓库。此参数可以是 URL（参见下文 GIT URLS 章节）或远程名称（参见下文\
  \ REMOTES 章节）。\n\n### <group>\n指向配置文件中 `remotes.<group>` 值的仓库列表名称。（参见 (1)）。\n\n\
  ### <refspec>\n指定获取哪些 refs 以及更新哪些本地 refs。当命令行上没有出现 `<refspec>` 时，将从 `remote.<repository>.fetch`\
  \ 变量读取要获取的 refs（参见下文 CONFIGURED REMOTE-TRACKING BRANCHES）。\n\n`<refspec>` 参数的格式是一个可选的加号\
  \ `+`，随后是源 ref `<src>`，然后是冒号 `:`，最后是目标 ref `<dst>`。当 `<dst>` 为空时可以省略冒号。\n\n`tag\
  \ <tag>` 等同于 `refs/tags/<tag>:refs/tags/<tag>`；它请求获取指定标签之前的所有。\n\n匹配 `<src>` 的远程\
  \ ref 被获取，如果 `<dst>` 不是空字符串，则使用 `<src>` 对匹配的本地 ref 进行快进（fast-forward）。如果使用了可选加号\
  \ `+`，即使没有导致快进更新，本地 ref 也会更新。\n\n**注意**\n当已知要获取的远程分支会经常回滚和重基时，预计其新顶端不会是之前的顶端（即你上次获取时存储在远程跟踪分支中的）的后代。你可能希望使用\
  \ `+` Sign 来表示需要非快进更新。没有方法可以确定或声明仓库将提供具有这种行为的分支；拉取用户只需知道这是该分支预期的使用模式。\n\n\n\n\n\
  通常情况下，URL 包含有关传输协议、远程服务器地址以及仓库路径的信。根据传输协议的不同，这些信息中的部分可能会缺失。\n\nGit 支持 `ssh`、`git`、`http`\
  \ 和 `https` 协议（此外，可以使用 `ftp` 和 `ftps` 用于抓取，可以使用 `rsync` 用于抓取和推送，但这些效率低下且已弃用；请勿使用）。\n\
  \n原生传输（即 `git://` URL）不进行身份验证，在不安全的网络上使用时应谨慎。\n\n这些协议可以使用以下语法：\n\n`http[s]://host.xz[:port]/path/to/repo.git/`\n\
  \n`ftp[s]://host.xz[:port]/path/to/repo.git/`\n\n在 `ssh` 协议下也可以使用另一种类似 scp 的语法：\n\
  \n`[user@]host.xz:path/to/repo.git/`\n\n这种语法仅在第一个冒号之前没有斜杠时才会被识别。这有助于区分包含冒号的本地路径。例如，本地路径\
  \ `foo:bar` 可以指定为绝对路径或 `./foo:bar`，以避免被误读为 ssh url。\n\n`ssh` 和 `git` 协议还支持 `~username`\
  \ 扩展：\n\n`[user@]host.xz:/~[user]/path/to/repo.git/`\n\n对于 Git 原生支持的本地仓库，可以使用以下语法：\n\
  \n`/path/to/repo.git/`\n\n这两种语法大多数情况下是等价，但在克隆（clone）时，前者意味着 `--local` 选项。详情请见 (1)。\n\
  \n当 Git 不知道如何处理特定的传输协议时，它会尝试使用 `remote-<transport>` 远程助手（如果存在的话）。要显式请求远程助手，可以使用以下语法：\n\
  \n`<transport>::<address>`\n\n其中 `<address>` 可以是一个路径、服务器和路径，或者是由调用的特定远程助手所识别的任意\
  \ URL 类字符串。详情请见 (1)。\n\n如果存在大量命名相似的远程仓库，且你想为它们使用不同的格式（以便你使用的 URL 将被重写为可以运行的 URL），你可以创建一个如下形式的配置节：\n\
  \n`[url \"<actual url base>\"] insteadOf = <other url base>`\n\n例如，使用以下内容：\n\n`[url\
  \ \"\"] insteadOf = host.xz:/path/to/ insteadOf = work:`\n\n那么像 `\"work:repo.git\"\
  ` 或 `\"host.xz:/path/to/repo.git\"` 这样的 URL 在任何接受 URL 为 `\"\"` 的上下文中被重写。\n\n如果你只想针对推送（push）重写\
  \ URL，可以创建一个如下形式的配置节：\n\n`[url \"<actual url base>\"] pushInsteadOf = <other url\
  \ base>`\n\n例如，使用以下内容：\n\n`[url \"\"] pushInsteadOf =`\n\n那么像 ` ` 的 URL 在推送时将被重写为\
  \ ` `，但拉取（pull）仍将使用原始 URL。\n\n# REMOTES\n\n可以使用以下名称之一代替 URL 作为 `<repository>` 参数：\n\
  \n- Git 配置文件中的远程：$GIT_DIR/config，\n- `$GIT_DIR/remotes` 目录下的文件，或\n- `$GIT_DIR/branches`\
  \ 目录下的文件。\n\n所有这些都允许你从命令行中省略引用规范（refspec），因为它们各包含一个 git 将默认使用的引用规范。\n\n## 配置文件中的命名远程\n\
  \n你可以选择提供之前通过 (1)、(1) 甚至手动编辑 `$GIT_DIR/config` 文件配置的远程名称。该远程的 URL 将用于访问仓库。当你不在命令行上提供引用规范时，该远程的引用规范将被默认使用。配置文件中的条显示所示：\n\
  \n`[remote \"<name>\"] url = <url> pushurl = <pushurl> push = <refspec> fetch =\
  \ <refspec>`\n\n`<pushurl>` 仅用于推送。它是可选的，默认为 `<url>`。\n\n## $GIT_DIR/remotes 中的命名文件\n\
  \n你可以选择提供 `$GIT_DIR/remotes` 中的一个文件名。该文件中的 URL 将用于访问仓库。当你不在命令行上提供引用规范时，该文件中的引用规范将作为默认使用。该文件应具有以下格式：\n\
  \n`URL: one of the above URL format Push: <refspec> Pull: <refspec>`\n\n## $GIT_DIR/branches\
  \ 中的命名文件\n\n你可以选择提供 `$GIT_DIR/branches` 中的一个文件名。该文件中的 URL 将用于访问仓库。当你不在命令行上提供引用规范时，该文件中的引用规范将作为默认使用。该文件应具有以下格式：\n\
  \n`<url>#head>`\n\n`<url>` 是必须的；`<head>` 是可选的。\n\n## CONFIGURED REMOTE-TRACKING\
  \ BRANCHES\n\n你经常通过定期从同一个远程抓取来交互。为了跟踪此类远程的进度，`git fetch` 变量可能如下所示：\n\n`[remote \"\
  origin\"] fetch = +refs/heads/*:remotes/origin/*`\n\n上述命令将远程 `refs/heads/` 空间下的所有分支并存储到本地\
  \ `refs/remotes/origin/` 空间，除非使用 `branch.<name>.fetch` 选项来指定非默认的引用规范。\n\n当运行 `git\
  \ fetch` 而没有在命令行上指定要抓取的分支和/或标签，`branch.<name>.fetch` 值将作为引用规范——它们指定了要更新哪些引用。上面的示例将抓取\
  \ origin 中存在的所有分支。\n\n当运行 `git fetch` 并在命令行明确指定要抓取的分支和/或标签（例如 `git fetch origin\
  \ master`），命令行给出的 `<refspec>` 决定了抓取的内容（即当命令行列出引用规范时，这些值不被视为引用规范）；它们仅用于通过当映射来决定抓取的引用存储在何处。后者的\
  \ `remote.<repository>.fetch` 值可以通过在命令行上提供 `--refmap=<refspec>` 参数来覆盖。\n\n## EXAMPLES\n\
  \n更新远程跟踪分支：\n\n`$ git fetch origin`\n\n显式使用引用规范：\n\n`$ git fetch origin +pu:pu maint:tmp`\n\
  \n这通过从远程仓库分别从 `pu` 和 `maint` 分支抓取，更新（根据需要创建）本地仓库中的 `pu` 和 `tmp` 分支。\n\n即使 `pu` 分不是快进（fast-forward），也会被更新，因为它带有加号前缀；`tmp`\
  \ 则不会。\n\n在不在本地仓库中配置远程的情况下查看远程分支：\n\n`$ git fetch maint`\n`$ git log FETCH_HEAD`\n\
  \n\n\n\n目前使用 `--recurse-submodules` 只能在已检出的子模块中获取新提交。例如，当上游在刚刚获取的父项目提交中添加了新的子模块时，子模块本身无法被获取，导致以后在不重新执行\
  \ fetch 的情况下无法检出该子模块。预计将在未来的 Git 版本中修复。\n\n## 另请\n(1)\n\n# GIT-FILTER-BRANCH\n\n\
  ## 名称\n`git-filter-branch` - 重写分支\n\n## 概要概要\n`git filter-branch [--env-filter <command>]\
  \ [--tree-filter <command>] [--index-filter <command>] [--parent-filter <command>]\
  \ [--msg-filter <command>] [--commit-filter <command>] [--tag-name-filter <command>]\
  \ [--subdirectory-filter <directory>] [--prune-empty] [--original <namespace>] [-d\
  \ <directory>] [-f | --force] [--] [<rev-list options>...]`\n\n## 描述\n允许你通过重写 `<rev-list\
  \ options>` 中提到的分支来重写 Git 修订历史，并对每个修订应用自定义过滤器。这些过滤器可以修改每个树（例如删除文件或对所有文件运行 perl 重写）或每个提交的信息。否则，所有信息（包括原始提交时间或合并信息）将得到保留。\n\
  \n该命令只会重写命令行中提到的“正”引用（例如，如果你传递 `a..b`，则只有 `b` 会被重写）。如果你未指定过滤器，提交将在无任何更改的情况下重新提交，这通常不会产生影响。尽管如此，这在未来对于补偿某些\
  \ Git 错误等情况可能有用，因此允许这种用法。\n\n**注意**：此命令尊重 `.git/info/grafts` 文件和 `refs/replace/`\
  \ 命名空间中的引用。如果你定义了任何移植（grafts）或替换引用，运行此命令将使它们永久化。\n\n**警告**：重写后的历史所有对象具有不同的不同的名称，且不会与原始分支汇合。你无法轻松地将重写后的分支推送并发布到原始分支之上。如果你不清楚其影响，请勿使用此命令；如果一个简单的单提交就能解决你的问题，请尽量避免使用它。（有关重写已发布历史的更多信息，请参见\
  \ (1) 中的“从上游变基中恢复”章节。）\n\n务必验证重写后的版本是正确的：原始引用如果与重写后的不同，将存储在 `refs/original/` 命名空间中。\n\
  \n注意，由于此操作非常消耗 I/O，使用 `-d` 选项将临时目录重定向到磁盘外（例如在 `tmpfs` 上）可能是一个好主意。据报道，速度提升非常明显。\n\
  \n### 过滤器\n过滤器按下面的顺序应用。`<command>` 参数始终在 shell 环境中使用 `eval` 命令评估（由于技术原因，提交过滤器除外）。在此之前，将设置环境变量\
  \ `$GIT_COMMIT`，其内容包含正在重写的提交的 ID。此外，`GIT_AUTHOR_NAME`、`GIT_AUTHOR_EMAIL`、`GIT_AUTHOR_DATE`、`GIT_COMMITTER_NAME`、`GIT_COMMITTER_EMAIL`\
  \ 和 `GIT_COMMITTER_DATE` 将从当前提交中提取并导出到环境中，以便影响过滤器运行后由 (1) 创建的替换提交的作者和提交者身份。\n\n\
  如果 `<command>` 的任何评估返回非零退出状态，整个操作将终止。\n\n提供了一个 `map` 函数，它接收一个“原始 sha1 id”参数，如果提交已重写，则输出“重写后的\
  \ sha1 id”，否则输出“原始 sha1 id”；如果你的提交过滤器输出了多个提交，`map` 函数可以在单独行返回多个 ID。\n\n### 选项\n\n\
  ### `--env-filter <command>`\n如果你只需要修改执行提交的环境，则可以使用此过滤器。具体而言，你可能想要重写作者/提交者姓名/邮箱/时间环境变量（详情见\
  \ (1)）。不要忘记重新导出这些变量。\n\n### `--tree-filter <command>`\n这是用于重写树及其内容的过滤器。该参数在 shell\
  \ 中评估，其工作目录被设置为检出树的根目录。然后将原样使用新树（新文件将自动添加，消失的文件将自动删除——`.gitignore` 文件或任何其他忽略规则**不起作用**！）。\n\
  \n### `--index-filter <command>`\n这是用于重写索引的过滤器。它与树过滤器类似，但不会检出树，这使得速度快得多。经常与 `git\
  \ rm --cached --ignore-unmatch ...` 配合使用，见下示例。对于复杂情况，请参见 (1)。\n\n### `--parent-filter\
  \ <command>`\n这是用于重写提交父节点列表的过滤器。它从标准输入接收父字符串，并在标准输出输出新的父字符串。父字符串的格式如 (1) 所示：初始提交为空，普通提交为\
  \ `-p parent`，合并提交为 `-p parent1 -p parent2 -p parent3 ...`。\n\n### `--msg-filter\
  \ <command>`\n这是用于重写提交消息的过滤器。该参数在 shell 中评估，标准输入为原始提交消息；其标准输出被用作新的提交消息。\n\n### `--commit-filter\
  \ <command>`\n这是执行提交的过滤器。如果指定了此过滤器，它将代替 `git commit-tree` 命令被调用，参数格式为 `<TREE_ID>\
  \ [(-p <PARENT_COMMIT_ID>)...]`，标准输入为日志消息。期望在标准输出上获得提交 ID。\n\n作为一种特殊扩展，提交过滤器可能会产生多个提交\
  \ ID；在这种情况下，原始提交的重写子节点将所有这些 ID 作为父节点。\n\n你可以在此过滤器中使用 `map` 方便函数以及方便函数。例如，调用 `skip_commit\
  \ \"$@\"` 将跳过当前提交（但不包括它的更改！如果你需要这样做，请使用 `git rebase`）。\n\n如果你不想保留只有一个父节点且对树没有任何更改的提交，可以使用\
  \ `git_commit_non_empty_tree \"$@\"` 代替 `git commit-tree \"$@\"`。\n\n### `--tag-name-filter\
  \ <command>`\n这是用于重写标签名的过滤器。当传递时，它会对每个指向重写对象（或指向重写对象的标签对象）的标签引用调用。原始标签名通过标准输入传递，期望在标准输出获得新的标签名。原始标签不会删除，但可以覆盖；使用\
  \ `--tag-name-filter cat` 可以简单更新标签。在这种情况下，请务必小心，确保你已备份旧标签，以防转换出错。\n\n支持对标签对象的近完美重写。如果标签带有消息，将创建一个具有相同消息、作者和时间戳的新标签对象。如果标签带有签名，签名将被移除。根据定义，保留签名是不可能的。之所以说是“近乎”完美，是因为理想情况下，如果标签没有变化，它应该保留任何签名。\n\
  \n只查看涉及给定子目录的历史。结果将包含该目录（仅包含该目录）作为其项目根目录。这意味着“映射到祖先”部分。\n\n### `--prune-empty`\n\
  \n\n\n\n\n某些过滤器会生成空提交（commits），这些提交会让树结构保持不变。此开关允许 `git-filter-branch` 忽略此类提交。尽管如此，该开关仅适用于有一个且只有一个父提交的提交，因此它会保留合并点。此外，此选项与\
  \ `--commit-filter` 使用不兼容。不过你只需要在提交过滤器中使用函数 `git_commit_non_empty_tree \"$@\"` 代替\
  \ `git commit-tree \"$@\"` 模式即可实现这一效果。\n\n### `--original <namespace>`\n使用此选项设置存储原始提交的命名空间。默认值是\
  \ `refs/original`。\n\n### `-d <directory>`\n使用此选项设置用于重写的临时目录路径。在应用树过滤器（tree filter）时，命令需要将树临时检出（checkout）到某个目录，对于大型项目，这可能会消耗大量空间。默认情况下，它在\
  \ `.git-rewrite/` 目录下执行，但你可以通过此参数覆盖该选择。\n\n### `-f, --force`\n\n除非强制执行，否则 `git filter-branch`\
  \ 会在已存在临时目录或已存在以 `refs/original/*` 开头的引用（refs）时拒绝启动。\n\n### `<rev-list options>...`\n\
  `git rev-list` 的参数。这些选项包含的所有正向引用（positive refs）都会被重写。你也可以指定如 `--all` 等选项，但你必须使用\
  \ `--*` 将它们与 `git filter-branch` 的选项分开。这隐含了“重映射到祖先（Remap to ancestor）”部分。\n\n####\
  \ 重映射到祖先\n通过使用 (1) 参数（例如路径限制器），你可以限制被重写的修订集。然而，命令行上的正向引用是有区别的：我们不让它们被此类限制器排除。出于此目的，它们会被重写为指向未被排除的最近祖先。\n\
  \n## 示例 (EXAMPLES)\n\n假设你想从所有提交中删除一个文件（包含机信息或侵犯版权）：\n\n```bash\ngit filter-branch\
  \ --tree-filter 'rm filename' HEAD\n```\n\n然而，如果文件不存在于某个提交的树中，简单的 `rm filename`\
  \ 将会导致树和提交失败。因此，你可能想使用 `rm -f filename` 作为脚本。\n\n配合 `git rm` 使用 `--index-filter`\
  \ 可以得到一个显著更快的版本。就像使用 `rm filename` 一样，如果文件不存在于提交的树中，`git rm --cached filename` 将失败。如果你想“完全忘记”一个文件，它何时进入历史并不重要，所以我们还添加了\
  \ `--ignore-unmatch`：\n\n```bash\ngit filter-branch --index-filter 'git rm --cached\
  \ --ignore-unmatch filename' HEAD\n```\n\n现在，你将获得保存在 `HEAD` 中的重写后的历史。\n\n要重写仓库使得\
  \ `foodir/` 看起来是项目根目录，并丢弃所有其他历史：\n\n```bash\ngit filter-branch --subdirectory-filter\
  \ foodir -- --all\n```\n\n因此，你可以将一个库子目录转换为它自己的仓库。注意使用 `--` 将 `filter-branch` 选项与修订选项分开，并使用\
  \ `--all` 重写所有分支和标签。\n\n为了将一个提交（通常位于另一个历史的末端）设置为当前初始提交的父提交，以便将另一个历史粘贴在当前历史之后：\n\n\
  ```bash\ngit filter-branch --parent-filter 'sed \"s/^\\$/-p <graft-id>/\"' HEAD\n\
  ```\n\n（如果父字符串为空——这在我们处理初始提交时发生——添加 `graftcommit` 作为父提交）。注意，这假设历史只有一个根（即没有发生没有共同祖先的合并）。如果不是如此，使用：\n\
  \n```bash\ngit filter-branch --parent-filter 'test $GIT_COMMIT = <commit-id> &&\
  \ echo \"-p <graft-id>\" || cat' HEAD\n```\n\n或者更简单：\n\n```bash\necho \"$commit-id\
  \ $graft-id\" >> .git/info/grafts git filter-branch $graft-id..HEAD\n```\n\n从历史中删除由“Darl\
  \ McBribe”编写的提交：\n\n```bash\ngit filter-branch --commit-filter ' if [ \"$GIT_AUTHOR_NAME\"\
  \ = \"Darl McBribe\" ]; then skip_commit \"$@\"; else git commit-tree \"$@\"; fi'\
  \ HEAD\n```\n\n函数 `skip_commit` 定义如下：\n\n```bash\nskip_commit() { shift; while [\
  \ -n \"$1\" ]; do shift; map \"$1\"; shift; done; }\n```\n\n`shift` 魔法操作首先丢弃树 ID，然后丢弃\
  \ `-p` 参数。注意这会正确处理合并！如果 Darl 提交了 `P1` 和 `P2` 之间的合并，它将被正确传播，该合并的所有子节点将成为以 `P1,P2`\
  \ 为父的合并提交，而不是合并提交本身。\n\n**注意**，提交引入的且未被后续提交撤销的更改仍然存在于重写后的分支中。你可以使用 `--msg-filter`\
  \ 重写提交日志消息。例如，由 `git svn` 创建的仓库中的 `git svn-id` 字符串可以通过这种方式移除：\n\n```bash\ngit filter-branch\
  \ --msg-filter ' sed -e \"/^git-svn-id:/d\" '\n```\n\n如果你需要向例如最后 10 个提交（都不是合并）添加\
  \ `Acked-by` 行，请使用此命令：\n\n```bash\ngit filter-branch --msg-filter ' cat && echo\
  \ \"Acked-by: Bugs Bunny <>\" ' HEAD~10..HEAD\n```\n\n`--env-filter` 选项可以修改提交者和/或作者身份。例如，如果你发现由于\
  \ `user.email` 配置错误导致你的提交身份错误，你可以在发布项目之前进行如下修正：\n\n```bash\ngit filter-branch --env-filter\
  \ ' if test \"$GIT_AUTHOR_EMAIL\" = \"\" then GIT_AUTHOR_EMAIL= export GIT_AUTHOR_EMAIL\
  \ fi if test \"$GIT_COMMITTER_EMAIL\" = \"\" then GIT_COMMITTER_EMAIL= export GIT_COMMITTER_EMAIL\
  \ fi ' -- --all\n```\n\n要将重写限制在历史的一部分，除了新分支名称外，还要指定修订范围。新分支名称将指向 `git rev-list`\
  \ 该范围打印的最顶端修订。\n\n考虑这段历史：\n\n`D--E--F--G--H / / A--B-----C`\n\n仅重写提交 D,E,F,G,H，但保留\
  \ A、B 和 C，使用：\n\n```bash\ngit filter-branch ... C..H\n```\n\n要重写 E,F,G,H，使用以下任一：\n\
  \n```bash\ngit filter-branch ... D..H\n```\n\n```\ngit filter-branch --not C\n```\n\
  \n要将整个树移动到子目录，或者从中移除：\n\n```bash\ngit filter-branch --tree-filter 'git ls-files\
  \ -s | sed \"s-\\t\\\"&subdir/-\" | GIT_INDEX_FILE=$GIT_INDEX_FILE.new \\ git update-index\
  \ --info && mv \"$GIT_INDEX_FILE\"' HEAD\n```\n\n## 缩小仓库的清单 (CHECKLIST FOR SHRINKING\
  \ A REPOSITORY)\n\n`filter-branch` 可用于删除部分文件，通常结合 `--index-filter` 和 `--subdirectory-filter`。人们期望生成的仓库比原始仓库小，但你还需要更多步骤才能使其变小，因为\
  \ Git 会尽量不丢失你的对象，除非你告诉它。首先确保：\n\n1. 你确实删除了文件名的所有变体（如果该 blob 在生命周期内移动过）。`git log\
  \ --name-only --follow --all -- filename` 可以帮助查找重命名。\n2. 你确实过滤了所有引用：调用 `filter-branch`\
  \ 时使用 `--tag-name-filter cat -- --all`。\n\n然后有两种获取更小仓库的方法。更安全的方法是克隆，保持原始仓库完整。\n\n\
  使用 `git clone` 克隆。克隆将不包含被删除的对象。（注意使用普通路径克隆只是硬链接所有内容！）。\n\n出于任何原因，如果你真的不想克隆，请检查以下点（按此顺序）。这是一个极具破坏性的方法，因此请**备份**或返回克隆。你已经收到警告了。\n\
  \n- 删除由 `filter-branch` 备份的原始引用：例如执行 `git for-each-ref --format=\"%(refname)\" refs/original/\
  \ | xargs -n 1 git update-ref -d`。\n- 过期所有引用日志（reflogs）：`git reflog expire --expire=now\
  \ --all`。\n- 回收所有未引用的对象：`git gc --prune=now`（如果你的 `git-gc` 尚不支持向 `--prune` 传递参数，请使用\
  \ `git repack -ad; git prune` 代替）。\n\n\n\n\n\n`git-filter-branch` 允许你对 Git 历史进行复杂的脚本化重写，但如果你只是简单地移除大文件或密码等不需要的数据，你可能不需要这种灵活性。对于这些操作，你可能希望考虑\
  \ `The BFG Repo-Cleaner`，它是基于 JVM 的 `git-filter-branch` 替代方案，在这些用例下，速度通常快 10-50\
  \ 倍，并且具有完全不同的特性：\n\n任何特定版本的都会会被精确清理一次。与 `git-filter-branch` 不同，`BFG` 不允许你根据文件在历史中提交的位置或时间来以不同的方式处理文件。这种限制提供了\
  \ `The BFG` 的核心性能优势，并且非常适合清理坏数据任务——你不在乎坏数据在哪里，你只想让它消失。\n\n默认情况下，`The BFG` 会充分利用多核机器，并行清理提交的文件树。而\
  \ `git-filter-branch` 按顺序清理提交（即以单线程方式），尽管可以在针对每个提交执行的脚本中编写包含自身并行性的过滤器。\n\n`command\
  \ options` 比 `git-filter-branch` 严格得多，并且专门用于移除不需要的数据任务——例如：`--strip-blobs-bigger-than\
  \ 1M`。\n\n## GIT\n(1) 套件的一部分\n\n### NOTES\n1. `The BFG Repo-Cleaner`\n2. `command\
  \ options`\n\n# GIT-FMT-MERGE-MSG\n\n## 名称\n`git-fmt-merge-msg` - 生成合并提交消息\n\n##\
  \ 概要\n```bash\ngit fmt-merge-msg [-m <message>] [--log[=<n>] | --no-log] <$GIT_DIR/FETCH_HEAD>\n\
  git fmt-merge-msg [-m <message>] [--log[=<n>] | --no-log] -F <file>\n```\n\n## 描述\n\
  从标准输入读取合并对象的列表，并生成一个用于合并提交的合适提交消息，通常作为 `<merge-message>` 参数传递给 `git merge`。\n\n\
  此命令主要供自动调用 `git merge` 的脚本内部使用。\n\n## OPTIONS\n---log[=<n>]: 除了分支名外，使用来自实际合并提交的单行描述填充日志消息。每个合并父节点最多使用\
  \ `<n>` 个提交（如果省略 `<n>` 则为 20 个）。这会覆盖 `merge.log` 配置变量。\n---no-log: 不列出来自实际合并提交的单行描述。\n\
  ---[no-]summary: `--log` 和 `--no-log` 的同义词；这些已弃用，并在未来被移除。\n`-m <message>, --message\
  \ <message>`: 使用 `<message>` 代替分支名作为日志消息的第一行。配合 `--log` 使用。\n`-F <file>, --file\
  \ <file>`: 从 `<file>` 而不是标准输入获取合并对象列表。\n\n## 配置\n`merge.branchdesc`: 除了分支名外，用与它们相关的分支描述文本填充日志消息。默认值为\
  \ false。\n`merge.log`: 除了分支名外，用来自实际合并提交的最多指定数量的单行描述填充日志消息。默认值为 false，且 true 是 20\
  \ 的同义词。\n`merge.summary`: `merge.log` 的同义词；这已弃用，并在未来被移除。\n\n## 参见\n(1)\n\n# GIT-FOR-EACH-REF\n\
  \n## 名称\n`git-for-each-ref` - 输出每个 ref 的信息\n\n## 概要\n```bash\ngit for-each-ref [--count=<count>]\
  \ [--shell|--perl|--python|--tcl] [(--sort=<key>)...] [--format=<format>] [<pattern>...]\n\
  ```\n\n## 描述\n遍历所有匹配 `<pattern>` 的 ref，并在根据给定的 `<key>` 排序后按照给定的 `<format>` 显示它们。如果给了\
  \ `<count>`，则在显示相应数量后停止。`<format>` 中的插值可以可选地引用为指定主机语言的字符串字面量，允许在相应语言中直接求值。\n\n##\
  \ OPTIONS\n-<count>`: 默认情况下，命令显示所有匹配 `<pattern>` 的 ref。此选项使其在显示相应数量后 后停止。\n`<key>`:\
  \ 用于排序的字段名。前缀 `-` 表示按值的降序排序。如果未指定，则使用 `refname`。你可以多次使用 `--sort=<key>` 选项，在这种情况下，最后一个键将成为主键。\n\
  `<format>`: 一个字符串，用于插值来自正在显示的 ref 指向对象的 `%(fieldname)`。如果 `fieldname` 以星号 (`*`)\
  \ 为前缀且 ref 指向标签对象，则使用所引标签对象中的字段值。如果未指定，默认为 `%(objectname) SPC %(objecttype) TAB\
  \ %(refname)`。它还会插值 `%%` 为 `%`，并将 `%xx`（其中 `xx` 是十六进制数字）插值为十六进制代码为 `xx` 的字符；例如 `%00`\
  \ 插值为 `\\0` (NUL)，`%09` 插值为 `\\t` (TAB)，`%0a` 插值为 `\\n` (LF)。\n`<pattern>...`: 如果给出一个或多个模式，则仅显示至少一个模式的\
  \ ref，使用 (3) 或字面匹配（后者情况下是完全匹配或从开始到斜杠的匹配）。\n---shell, --perl, --python, --tcl`: 如果给出，替换\
  \ `%(fieldname)` 占符的字符串将引用为适用于指定主机语言的字符串字面量。旨在产生一个可以直接被 `eval` 的脚本。\n\n## 字段名称\n\
  引用对象中结构化字段的各种值可以插值到结果输出中，或作为排序键。\n\n对于所有对象，可以使用以下名称：\n-`refname`: ref 的名称（$GIT_DIR/`\
  \ 之后的部分）。对于无歧的 ref 短名附加 `:short`。使用选项 `core.warnAmbiguousRefs` 来选择严格缩写模式。\n-`objecttype`:\
  \ 对象的类型（blob, tree, commit, tag）。\n-`objectsize`: 对象的大小（与 `git cat-file -s` 报告的）。\n\
  -`objectname`: 对象名称（即 SHA-1）。对于无歧的对象名称缩写，附加 `:short`。\n-`upstream`: 一个本地 ref 的名称，可以被视为显示\
  \ ref 的“上游”。以与上述 `refname` 相同尊重 `:short`。此外，尊重 `:track` 以显示 `[ahead N, behind M]`\
  \ `:trackshort` 显示简洁版本：`>`（领先）、`<`（落后）或 `=`（同步）。如果没有关联跟踪信息则无影响。\n`push`: 代表 `@{push}`\
  \ 位置的本地 ref 名称。与 upstream 相同尊重 `:short`、`:track` 和 `:trackshort`。如果没有配置 `@{push}`\
  \ 则产生空字符串。\n-`HEAD`: 如果 `HEAD` 匹配当前 ref（检出的分支），则为 ' '；否则为空。\n-`color`: 更改颜色。后接 `:<colorname>`，其中名称在\
  \ `color.*` 中描述。\n\n除了上述，对于 commit 和 tag 对象，头部字段名（tree, parent, object, type, tag）可用于指定头部字段的值。\n\
  \n具有名称-邮箱-日期 元组值的字段（author, committer, tagger）可以附加 `name`、`email` 和 `date` 以提取命名组件。\n\
  \ncommit 和 tag 对象中的完整消息是 `contents`。其第一行是 `contents:subject`，其中 `subject` 是消息中第一个空行之前的所有行。下一行是\
  \ `contents:body`，其中 `body` 是第一个空行之后的所有行。最后，可选的 GPG 签名是 `contents:signature`。\n\n\
  为了排序，具有数值的字段按数值排序（objectsize, authordate, committerdate, taggerdate）。所有其他字段均按其字节值排序。\n\
  \n在任何情况下，引用 ref 指向对象的不可适用字段名都不会导致错误。相反，返回空字符串。\n\n作为日期类型字段的特例，你可以通过在字段名末尾添加 `:default`,\
  \ `:relative`, `:short`, `:local`, `:iso8661`, `:rfc2822` 或 `:raw` 之一为日期指定格式；例如\
  \ `%(taggerdate:relative)`。\n\n## 示例\n直接生成格式化文本的示例。显示最近的 3 个标签提交：\n\n\n\n\n\n```bash\n\
  #!/bin/sh git for-each-ref --count=3 --sort='-authordate' \\ --format='From: %(*authorname)\
  \ %(*authormail) Subject: %(*subject) Date: %(*ordate) Ref: %(*refname) %(body)`\n\
  ```\n一个在输出上使用 `--shell` 的简单示例，列出所有头部的前缀：\n\n```bash\n#!/bin/sh git for-each-ref\
  \ --shell --format=\"ref=%(refname)\" refs/heads | \\ while read entry do eval \"\
  $entry\" echo `dirname $ref` done\n```\n\n关于标签的更详细报告，是一个完整的脚本：\n\n```bash\n#!/bin/sh\
  \ fmt=' r=%(refname) t=%(*objecttype) T=${r#refs/tags/} o=%(*objectname) n=%(*authorname)\
  \ e=%(*authormail) s=%(*subject) d=%(*ordate) b=%(*body) kind=Tag test \"z$t\" =\
  \ z then t=%(objecttype) kind=\"Lightweight tag\" o=%(*objectname) n=%(*authorname)\
  \ e=%(*authormail) s=%(*subject) d=%(*ordate) b=%(*body) fi echo \"$kind $T points\
  \ at $t object $o\" if \"z$t\" =commit then echo \"The commit was authored by $n\
  \ at $d, and titled $s Its message reads as: \" echo \"$b\" | sed -e \"s/^/ /\"\
  \ echo fi ' eval=`git for-each-ref --shell --format=\"$fmt\" \\ --sort='*objecttype'\
  \ \\ --sort=-tagdate \\ refs/tags` eval \"$eval\"`\n\n# GIT-FORMAT-PATCH\n\n## 名称\n\
  \n`git format-patch` - 为邮件提交准备补丁\n\n## 语法\n\n`git format-patch` `[-k] (-o|--output-directory)\
  \ <dir> | --stdout] [--no-thread | --thread[=<style>]] [(--attach|--inline)[=<boundary>]\
  \ | --no-attach] [-s | --signoff] [--signature=<signature> | --no-signature] [--signature-file=<file>]\
  \ [-n | --numbered | -N | --no-numbered] [--start-number <n>] [--numbered-files]\
  \ [--in-reply-to=Message-Id] [--suffix=.<sfx>] [--ignore-if-upstream] [--subject-prefix=Subject-Prefix]\
  \ [(--max-count|-v) <n>] [--to=<email>] [--cc=<email>] [--[no-]cover-letter] [--quiet]\
  \ [--notes[=<ref>]] [<common diff options>] [ <since> | <revision range> ]\n\n##\
  \ 描述\n\n为每个提交准备一个补丁文件，格式类似于 UNIX 邮箱。该命令的输出便于邮件提交或配合 `git am` 使用。\n\n有两种方法指定要操作的提交：\n\
  \n1. 单个提交 `<since>`，指定指向当前分支顶部但在 `<since>` 之前的提交。\n2. 通用的 `<revision range>` 表达式（见\
  \ (7) 中的“指定修订版本”部分），表示指定范围内的提交。\n\n对于单个 `<commit>`，第一条规则优先。要应用第二条规则，即格式化从历史开始到 `<commit>`\
  \ 的所有内容，请使用 `--root` 选项：`git format-patch --root <commit>`。如果你只想格式化 `<commit>` 本身，可以使用\
  \ `git format-patch -1 <commit>`。\n\n默认情况下，每个输出文件从 1 开始顺序编号，并使用提交消息的第一行（经过路径安全处理）作为文件名。使用\
  \ `--numbered-files` 选项，输出文件名将仅为数字，不附加第一行。输出文件的名称打印到标准输出，除非指定了 `--stdout` 选项。\n\n\
  如果指定了 `-o`，输出文件将在 `<dir>` 中创建。否则，它们将在当前工作目录中创建。\n\n默认情况下，单个补丁的主题为 \"[PATCH] \"，后接从提交消息到第一个空行的内容（见\
  \ (1) 的讨论部分）。\n\n当输出多个补丁时，主题前缀将变为 `[PATCH n/m] `。要强制为单个补丁添加 1/1，使用 `-n`。要从主题中省略补丁编号，使用\
  \ `-N`。\n\n如果给出 `--thread`，`git format-patch` 将生成 `In-Reply-To` 和 `References` 头，使第二个及后续补丁邮件显示为第一封邮件的回复；这还会生成用于引用的\
  \ `Message-Id` 头。\n\n### 选项\n\n- `-p, --no-stat`\n\n  生成不带任何差异统计的纯补丁。\n- `-s, --no-patch`\n\
  \n  抑制差异输出。适用于默认显示补丁的 `git show` 等命令，或取消 `--patch` 的效果。\n- `-U<n>, --unified=<n>`\n\
  \n  生成具有 `<n>` 行上下文的差异，而不是默认的三个行。\n- `--minimal`\n\n  花费额外时间以确保产生最小的差异。\n- `--patience`\n\
  \n  使用“patience diff”算法生成差异。\n- `--histogram`\n\n  使用“histogram diff”算法生成差异。\n-\
  \ `--diff-algorithm={patience|minimal|histogram|myers}`\n\n  选择一种差异算法。变体如下：\n\n\
  \  - `default, myers`: 默认，使用 myers 算法。\n  - `minimal`: 花费额外时间确保产生最小的差异。\n  - `patience`:\
  \ 使用 patience 算法。\n  - `histogram`: 使用 histogram 算法。\n\n  例如，当需要使用 `diff.algorithm`\
  \ 默认值时，使用 `--diff-algorithm=default`。\n- `--stat[=<width>[,<name-width>[,<count>]]]`\n\
  \n  生成差异统计（diffstats）。对于二进制文件，输出 `-` 而不是 `0`。这些参数也可以单独设置：`--stat-width`、`--name-width`\
  \ 和 `--stat-count`。\n- `--numstat`\n\n  与 `--stat` 类似，但以十进制符号显示添加和删除的行数，且不缩写路径，对机器友好。对于二进制文件，输出两个\
  \ `-` 而不是 0。\n- `--shortstat`\n\n  仅输出 `--stat` 格式的最后一行，包含修改的文件总数，以及添加和删除的行数。\n\
  - `--dirstat[=<param1,param2,...>]`\n\n  输出每个子目录相对变化的分布。`dirstat` 的行为可以通过传递逗号分隔的参数进行自定义。默认值由\
  \ `diff.dirstat` 配置变量控制（见 (1)）。可用参数如下：\n\n  - `changes`: 通过计算从源删除或向目标添加的行来计算 dirstat\
  \ 数字。这忽略了文件内部纯代码移动。也就是说，重新排列文件的行不会被视为与其他变化相同。这是未给出参数时的默认行为。\n  - `lines`: 通过对常规基于行的差异分析来计算\
  \ dirstat 数字，并累加删除/添加的行数。（对于二进制文件，计算 64 字节块，因为二进制文件没有自然的行概念）。这比 `changes` 行为更耗资源，但它将文件内部重新排列行视为与其他变化相同。结果输出与其他\
  \ `--*stat` 选项一致。\n  - `files`: 通过计算更改文件的数量来计算 dirstat 数字。每个更改的文件在 dirstat 分析中权重相等。这是计算代价的\
  \ dirstat 行为，因为它不需要查看文件内容。\n  - `cumulative`: 将子目录的变化也计入父目录。注意，当使用累计时，报告的百分比总和可能会超过\
  \ 100%。默认（非累计）行为可以通过非累计 参数指定。\n- `<limit>`\n\n\n\n\n一个整数参数指定截断百分比（默认为 3%）。更改少于此百分比的目录不会在输出中。\n\
  \n示例：以下命令将统计更改的文件，同时忽略更改文件总数少于 10% 的目录，并将子目录计数累计到父目录中：`--dirstat=files,10,cumulative`。\n\
  \n### `--summary`\n输出扩展头部信息的简要摘要，例如创建、重命名和模式更改。\n\n### `--no-renames`\n关闭重命名检测，即使配置文件默认开启了它。\n\
  \n### `--full-index`\n在生成补丁格式输出时，在“index”行显示完整的修改前和修改后的 blob 对象名称，而不是只显示前几个字符。\n\
  \n### `--binary`\n除了 `--full-index` 之外，还输出可以使用 `git-apply` 应用的二进制差异。\n\n### `--abbrev[=<n>]`\n\
  在 `diff-raw` 格式输出和 `diff-tree` 头部行中，不显示完整的 40 字节十六进制对象名称，而是仅显示部分前缀。这与上述控制 `--full-index`\
  \ 选项无关，后者控制差异-补丁输出格式。可以使用 `--abbrev=<n>` 指定非默认的位数。\n\n### `-B[<n>][/<m>], --break-rewrites[=[<n>][/<m>]]`\n\
  将完全重写的更改分解为删除和创建对。这有两个作用：\n\n1. 它影响对整个文件完全重写更改的处理方式，使其不再被视为一系列删除和插入（夹杂着少量在文本上匹配作为上下文的行），而是被视为一次性删除所有旧内容，然后一次性插入所有新内容。数字\
  \ `m` 控制 `-B` 选项的这一方面（默认为 60%）。`-B/70%` 指定如果原始文件中只有少于 30% 的内容剩余，Git 才会将其视为完全重写（否则，生成的补丁将是一系列夹杂了上下文行的删除和插入混合）。\n\
  2. 当与 `-M` 配合使用时，完全重写的文件也会被视为重命名的源（通常 `-M` 只考虑消失的文件作为重命名的源），数字 `n` 控制 `-B` 选项的这一方面（默认为\
  \ 50%）。`-B20%` 指定与文件大小相比，添加和删除达到 20% 或以上的更改有资格被选为到另一个文件的可能重命名源。\n\n### `-M[<n>],\
  \ --find-renames[=<n>]`\n检测重命名。如果指定了 `n`，它是相似性索引阈值（即与文件大小相比的添加/删除量）。例如，`-M90%` 意味着如果文件超过\
  \ 90% 的内容没有变化，Git 应将一个删除/添加对视为重命名。如果没有 `%` 符号，该数字被视为分数，前面带有小数点。即，`-M5` 变为 `0.5`，因此等同于\
  \ `-M50%`。同样，`-M05` 等同于 `-M5%`。要将检测限制为精确重命名，请使用 `-M100%`。默认相似性索引为 50%。\n\n### `-C[<n>],\
  \ --find-copies[=<n>]`\n检测复制以及重命名。参见 `--find-copies-harder`。如果指定了 `n`，其含义与 `-M<n>`\
  \ 相同。\n\n### `--find-copies-harder`\n出于性能考虑，默认情况下 `-C` 选项仅在复制的原文件在同一更改集中被修改时才查找复制。此标志使命令检查未修改的文件作为复制源的候选。对于大型项目，这是一个非常贵的操作，请谨慎使用。提供多个\
  \ `-C` 选项的效果相同。\n\n### `-D, --irreversible-delete`\n省略删除操作的镜像（preimage），即只打印头部，而不打印镜像与\
  \ `/dev/null` 之间的差异。生成的补丁并非用于通过 `patch` 或 `git apply` 应用；这仅适用于只想关注更改后文本的人。此外，输出显然缺乏足够反向应用此类补丁的信息（即使是手动），因此该选项得名。\n\
  \n当与 `-B` 同时使用时，也省略删除/创建对中删除部分的镜像。\n\n### `-l<num>`\n`-M` 和 `-C` 选项需要 `O(n²)` 处理时间，其中\
  \ `n` 是潜在重命名/复制目标的数量。如果重命名/复制目标超过指定的数量，此选项将防止重命名/复制检测运行。\n\n### `-O<orderfile>`\n\
  按照 `<orderfile>` 中指定的顺序输出补丁，该文件每行一个 shell glob 模式。这会覆盖 `diff.orderFile` 配置变量（参见\
  \ 1)。要取消 `diff.orderFile`，请使用 `-O/dev/null`。\n\n### `-a, --text`\n将所有文件视为文本。\n\n\
  ### `--ignore-space-at-eol`\n忽略行尾空格的更改。\n\n### `-b, --ignore-space-change`\n忽略空格数量的更改。这会忽略行尾空格，并将所有其他一个或多个空格序列视为等效。\n\
  \n### `-w, --ignore-all-space`\n在比较行时忽略空格。即使一行有空格而另一行没有，也会忽略差异。\n\n### `--ignore-blank-lines`\n\
  忽略行全为空白的更改。\n\n### `--inter-hunk-context=<lines>`\n在差异块（hunks）之间显示上下文，最多到指定的行数，从而合并彼此的的块。\n\
  \n### `-W, --function-context`\n显示更改的整个函数。\n\n### `--ext-diff`\n允许执行外部差异。如果你通过 (5)\
  \ 设置了外部差异，则需要使用此。\n\n### `--no-ext-diff`\n禁止外部差异。\n\n### `--textconv, --no-textconv`\n\
  在比较二进制文件时允许（或禁止）运行外部文本过滤器。详情见 (5)。因为 textconv 过滤器通常是单向转换，生成的差异适用于人类阅读，但无法应用。\n\n\
  ### `--ignore-submodules[=<when>]`\n忽略对子模块的更改。`<when>` 可以是 \"none\",\"untracked\"\
  ,\"dirty\" 或 \"all\"，后者是默认值。使用 \"none\" 会在子模块包含未跟踪内容时将其视为已修改（但仍对其修改内容进行扫描）。使用 \"\
  dirty\" 会忽略所有对子模块的更改。使用 \"untracked\" 在子模块仅包含未跟踪内容时将其视为未修改（这是 1.7.0 之前的行为）。使用 \"\
  all\" 会隐藏所有对子模块的更改。\n\n### `--src-prefix=<prefix>`\n显示指定的源前缀代替 `a/`。\n\n### `--dst-prefix=<prefix>`\n\
  显示指定的目的前缀代替 `b/`。\n\n### `--no-prefix`\n不显示任何源或目标前缀。\n\n关于这些常用选项的更多详细解释，请参见 (7)。\n\
  \n### `-<n>`\n从顶部的 `<n>` 个提交准备补丁。\n\n### `-o <dir>, --output-directory <dir>`\n\
  使用 `<dir>` 存储结果文件，而不是当前工作目录。\n\n### `-n, --numbered`\n以 `[PATCH n/m]` 格式命名输出，即使只有一个补丁也是。\n\
  \n### `-N, --no-numbered`\n以 `[PATCH]` 格式命名输出。\n\n### `--start-number <n>`\n从 `<n>`\
  \ 开始为补丁编号而不是从 1 开始。\n\n### `--numbered-files`\n输出的文件名将是数字序列，不附加默认的提交第一行。\n\n###\
  \ `-k, --keep-subject`\n不在提交日志消息的第一行中剥离/添加 `[PATCH]`。\n\n### `-s, --signoff`\n在提交消息中添加\
  \ Signed-off-by: 行，使用你自己的提交者身份。\n\n### `--stdout`\n以 mbox 格式将所有提交打印到标准输出，而不是为每个创建一个文件。\n\
  \n### `--attach[=<boundary>]`\n创建 multipart/mixed 附件，第一部分是提交消息，第二部分是补丁本身，并带有 Content-Disposition:\
  \ attachment。\n\n### `--no-attach`\n禁用创建创建，覆盖配置设置。\n\n### `--inline[=<boundary>]`\n\
  \n\n\n创建一个 multipart/mixed 附件，其第一部分是提交信息，第二部分是补丁本身，且第二部分带有 `Content-Disposition:\
  \ inline`。\n\n### --thread[=<style>], --no-thread\n\n控制是否在邮件中添加 `In-Reply-To` 和\
  \ `References` 请求头，使第二封及后续邮件显示为对第一封邮件的回复。同时也控制用于引用的 `Message-Id` 请求头的生成。\n\n可选的\
  \ `<style>` 参数可以是 `shallow` 或 `deep`。`shallow`（浅线程）使每封邮件都成为系列头部的回复，头部根据顺序从封信（cover\
  \ letter）、`--in-reply-to` 和第一封补丁邮件中选择。`deep`（深度线程）使每封邮件都成为前一封邮件的回复。\n\n默认值为 `--no-thread`，除非设置了\
  \ `format.thread` 配置。如果指定了 `--thread` 但未指定样式，则默认使用 `format.thread`指定的样式（如果有），否则默认为\
  \ `shallow`。\n\n注意，`git send-email` 的默认设置是对邮件本身进行线程处理。如果你想让 `git format-patch` 来处理线程化，则需要确保\
  \ `git send-email` 禁用了线程处理。\n\n### --in-reply-to=Message-Id\n\n使第一封邮件（或所有带有 `--no-thread`\
  \ 的邮件）显示为对给定 `Message-Id` 的回复，从而避免为了提供新的补丁系列而破坏线程。\n\n### --ignore-if-in-upstream\n\
  \n不包含匹配 `<until>..<since>` 中提交的补丁。这将检查所有从 `<since>` 可达但从 `<until>` 不可见的补丁，并将其与生成的补丁进行比较，任何匹配的补丁将被忽略。\n\
  \n### --subject-prefix=<Subject-Prefix>\n\n主题行不再使用标准的 `[PATCH]` 前缀，而是使用 `[<Subject-Prefix>]`。这允许对补丁系列进行命名，并可以与\
  \ `--numbered` 选项结合使用。\n\n### -v <n>, --reroll-count=<n>\n\n将系列标记为主题的第 `<n>` 次迭代。输出文件名将加上\
  \ `v<n>`，主题前缀（默认是 \"PATCH\"，但可以通过 `--subject-prefix` 配置）末尾将加上 ` v<n>`。例如，`--reroll-count=4`\
  \ 可能会产生 `v4-0001-add-makefile.patch` 文件，其内容为 \"Subject: [PATCH v4 1/20] Add makefile\"\
  。\n\n### --to=<email>\n\n在邮件头中添加 `To:` 请求头。这是在任何已配置头之外额外添加的，可以使用多次。否定形式 `--no-to`\
  \ 会丢弃所有已添加的（来自配置或命令行）`To:` 请求头。\n\n### --cc=<email>\n\n在邮件头中添加 `Cc:` 请求头。这是在任何已配置头之外添加的，可以使用多次。否定形式\
  \ `--no-cc` 会丢弃所有已添加的（来自配置或命令行）`Cc:` 请求头。\n\n### --from, --from=<ident>\n\n在每封提交邮件的\
  \ `From:` 请求头中使用 `ident`。如果提交的作者标识与提供的 `ident` 在文本上不完全一致，则在消息正文中放置一个带有原始作者的 `From:`\
  \ 请求头。如果没有给出 `ident`，则使用提交者的 `ident`。\n\n请注意，此选项仅当你实际上在发送邮件并希望将自己标识为发送者，但保留原始作者时有效（`git\
  \ am` 会正确获取正文中的头）。同样注意，`git send-email` 已经为你处理了这种转换，如果你将结果传递给 `git send-email`，则不应使用此选项。\n\
  \n### --add-header=<header>\n\n在邮件头中添加任意请求头。这是在任何已配置头之外添加的，可以使用多次。例如，`--add-header=\"\
  Organization: git-foo\"`。否定形式 `--no-add-header` 会丢弃所有从配置或命令行添加的（`To:`、`Cc:` 和自定义）请求头。\n\
  \n### --[no-]cover-letter\n\n除了补丁外，还会生成一个包含 shortlog 和整体 diffstat 的封信（cover letter）文件。你可以在发送之前在文件中填写描述。\n\
  \n### --notes[=<ref>]\n\n在三个连字符线之后为提交添加注释（参见第 (1)）。\n\n此选项预期的用例是为提交编写不属于提交日志正文的辅助说明，并将其随补丁一起提交。虽然人们可以在运行\
  \ `format-patch` 之后但在发送之前简单编写这些说明，但将其保留为 Git notes 允许在补丁序列的版本之间进行维护（请参见 (1) 中关于\
  \ `notes.rewrite` 配置选项的讨论以使用此工作流）。\n\n### --[no]-signature=<signature>\n\n为生成的每条消息添加签名。根据\
  \ RFC 3676，签名与正文通过一行 '-- ' 行分隔。如果省略签名选项，签名默认为 Git 版本号。\n\n### --signature-file=<file>\n\
  \n工作方式与 `--signature` 相同，但签名是从文件中读取的。\n\n### --suffix=.<sfx>\n\n不再使用 `.patch` 作为生成文件的后缀，而是使用指定的后缀。常见的替代方案是\
  \ `--suffix=.txt`。留空将移除 `.patch` 后缀。\n\n注意，起始字符不必是点；例如，你可以使用 `--suffix=-patch` 来获得\
  \ `0001-description-of-my-change-patch`。\n\n### -q, --quiet\n\n不向标准输出打印生成文件的文件名。\n\
  \n### --no-binary\n\n不输出二进制文件的更改内容，而是显示一条这些文件已更改的通知。使用此选项生成的补丁无法正确应用，但它们对于代码审查仍然很有用。\n\
  \n### --root\n\n将修订参数视为 `<revision range>`，即使它只是单个提交（这通常会被视为 `<since>`）。注意，包含在指定范围内的根提交始终被格式化为创建补丁，与此标志无关。\n\
  \n## 配置（CONFIGURATION）\n\n你可以通过配置变量指定要添加到每条消息的额外邮件头行、主题前缀和文件后缀的默认值、输出多个补丁时的补丁数量、添加\
  \ \"To\" 或 \"Cc:\" 请求头、配置附件以及对补丁进行签名（sign off）。\n\n```ini\n[format] headers = \"\
  Organization: git-foo\\n\" subjectPrefix = CHANGE suffix = .txt numbered = auto\
  \ to = <email> cc = <email> attach [ = mime-boundary-string ] signOff = true coverletter\
  \ = auto\n```\n\n##or（DISCUSSION）\n\n`git format-patch` 产生的补丁采用 UNIX 邮箱格式，并带有固定的“魔法”时间戳，指示该文件是由\
  \ `format-patch` 输出而非真实的邮箱，如下所示：\n\n```\nFrom 8f72bad1baf19a53459661343e21d6491c3908d3\
  \ Mon Sep 17 00:00:00 2001 From: Tony Luck <> Date: Tue, 13 Jul 2010 11:42:54 -0700\
  \ Subject: [PATCH] =?UTF-8?q?[IA64]=20Put=20ia64=20config= 20files=20on=20the=20?=\
  \ =?UTF-8?q?Uwe=20Kleine-K=C3=B6nig=20diet?= MIME-Version: 1.0 Content-Type: text/plain;\
  \ charset=UTF-8 Content-Transfer-Encoding: 8bit arch/arm config files were slimmed\
  \ down using a python script (See commit c2330e286f68f1c408b4aa6515ba49d57f05beae\
  \ comment) Do the same for ia64 so we can have sleek & looking ...\n```\n\n通常它会被放置在\
  \ MUA 的草稿文件夹中，经过编辑以添加不应进入三个连字符之后日志的及时注释，然后作为消息发送，在示例中其正文从“arch/arm config files\
  \ were...”开始。在接收端，读者可以将有趣的补丁保存到 UNIX 邮箱并用 (1) 进行应用。\n\n当补丁是正在讨论的一部分时，`git format-patch`\
  \ 产生的补丁可以进行调整以利用 `git am --scissors` 功能。在对讨论的回复之后有一行由 `-- >8 --`（剪刀和穿孔）组成，随后是删除了不需要头部字段的补丁：\n\
  \n```\n... So we should do such-and-such. Makes sense to me. How about this patch?\
  \ -- >8 -- Subject: [IA64] Put ia64 config files on the Uwe Kleine-K&ouml;nig diet\
  \ arch/arm config files were slimmed down using a python script ...\n```\n\n\n\n\
  \n以这种方式发送补丁时，通常情况下你正在发送你自己的补丁，因此除了 \"From $SHA1 $magic_timestamp\" 标记外，你应该从补丁文件中省略\
  \ `From:` 和 `Date:` 行。补丁标题可能与该补丁所响应的讨论主题不同，因此你很可能想要保留 `Subject:` 行，如上面的示例所示。\n\n\
  ## 检查补丁损坏\n\n许多邮件处理程序如果配置不当，会损坏空白字符。这里是两种常见的损坏类型：\n\n1. 不包含任何空白的空上下文行。\n2. 开头多了一个空白字符的非空上下文行。\n\
  \n测试你的 MUA（邮件用户代理）是否配置正确的一种方法是：\n\n- 将补丁发送给自己，发送方式与平时完全一样，但 `To:` 和 `Cc:` 行不包含列表和维护者地址。\n\
  - 将该补丁保存为 UNIX 邮箱箱（mailbox）格式的文件。假设将其命名为 `a.patch`。\n- 应用它：\n\n```bash\n$ git fetch\
  \ <project> master:test-apply $ git checkout test-apply $ git reset --hard $ git\
  \ am a.patch\n```\n\n如果无法正确应用，可能有多种原因。\n\n- 补丁本身无法顺利应用。也就是说补丁是 `bad` 的，但这与你的 MUA\
  \ 无关。在这种情况下，你可能需要在重新生成补丁之前使用 (1) 进行进行 rebase。\n- MUA 损坏了你的补丁；`am` 会报错补丁无法应用。查看 `.git/rebase-apply/`\
  \ 子目录，检查 `patch` 文件包含的内容，并检查上述提到的常见损坏模式。\n- 顺便也检查 `info` 和 `final-commit` 文件。如果\
  \ `final-commit` 中的内容不是你想要在提交日志消息中看到的的内容，那么接收者在应用你的补丁时很可能会手动编辑日志消息。补丁邮件中类似 \"Hi,\
  \ this is my first patch.\\n\" 的内容应该出现在信号提交消息结束的三连横线之后。\n\n## 针对 MUA 的提示\n\n以下是一些关于如何使用各种邮件处理程序成功内联提交补丁的提示。\n\
  \n### GMail\n\nGMail 网页界面中没有关闭换行的方法，因此它会破坏你发送的任何邮件。不过，你可以使用 `git send-email` 通过\
  \ GMail SMTP 服务器发送你的补丁，或者使用任何 IMAP 邮件客户端连接到 Google IMAP 服务器并通过它转发邮件。\n\n有关如何使用 `git\
  \ send-email` 通过 GMail SMTP 服务器发送补丁的提示，请参阅 (1) 的 EXAMPLE 部分。\n\n有关使用 IMAP 接口提交的提示，请参阅\
  \ (1) 的 EXAMPLE 部分。\n\n### Thunderbird\n\n默认情况下，Thunderbird 会对邮件进行换行并将其标记为 `format=flowed`，这两者会导致生成的邮件无法被\
  \ Git 使用。\n\n有三种方法：使用插件关闭换行、配置 Thunderbird 不损坏补丁，或使用外部编辑器防止 Thunderbird 损坏补丁。\n\n\
  #### 方法 #1（插件）\n\n从 m[] 安装 `Toggle Word Wrap` 插件。它会在撰写器的“选项（Options）”菜单中添加一个“Enable\
  \ Word Wrap”菜单项，你可以取消勾选它。现在你可以像往常一样撰写消息（剪 + 粘贴、`git format-patch` | `git imap-send`\
  \ 等），但你必须在输入的任何文本中手动插入换行符。\n\n#### 方法 #2（配置）\n\n三个步骤：\n\n1. 将你的邮件服务器撰写配置为纯文本：编辑...账户设置...撰写与地址，取消勾选“使用\
  \ HTML 格式撰写消息”。\n2. 配置通用撰写窗口不换行。\n   - 在 Thunderbird 2 中：`Edit..Preferences..Composition`，将纯文本消息换行设为\
  \ 0。\n   - 在 Thunderbird 3 中：`Edit..Preferences..Advanced..Config Editor`。搜索 `mail.wrap_long_lines`。切换确保其设置为\
  \ `false`。同样搜索 `mailnews.wraplength` 并将值设置为 0。\n3. 禁用 `format=flowed` 的使用：`Edit..Preferences..Advanced..Config\
  \ Editor`。搜索 `mailnews.send_plaintext_flowed`。切换确保其设置为 `false`。\n\n完成这些后，你应该能够像往常一样撰写邮件（剪\
  \ + 粘贴、`git format-patch` | `git imap-send` 等），且补丁不会被损坏。\n\n#### 方法 #3（外部编辑器）\n\n\
  需要以下 Thunderbird 扩展：来自 m[] 的 `AboutConfig` 和来自 **&pg=8**m[] 的 `External Editor`。\n\
  \n1. 使用你选择的方法将补丁准备为文本文件。\n2. 在打开撰写窗口之前，使用 `Edit→Account Settings` 取消用于发送补丁的账户“撰写与地址”面板中的“使用\
  \ HTML 格式撰写消息”设置。\n3. 在 Thunderbird 主窗口中，*在*打开补丁的撰写窗口之前，使用 `Tools→about:config`\
  \ 将以下项设置为指定值：\n```\nmailnews.send_plaintext_flowed => false mailnews.wraplength\
  \ => 0\n```\n4. 打开撰写窗口并点击外部编辑器图标。\n5. 在外部编辑器窗口中读取补丁文件并正常退出编辑器。\n\n旁注：可能可以通过 `about:config`\
  \ 和以下设置完成步骤 2，但还没有人尝试过。\n```\nmail.html_compose => false mail.identity.default.compose_html\
  \ => false mail.identity.id?.compose_html => false\n```\n`contrib/thunderbird-patch-inline`\
  \ 中有一个脚本，可以帮助你轻松地在 Thunderbird 中包含补丁。要使用它，请按照上述步骤操作，然后将该脚本作为外部编辑器使用。\n\n### KMail\n\
  \n这可以帮助你使用 KMail 内联提交补丁。\n\n1. 将补丁准备为文本文件。\n2. 点击“新邮件（New Mail）”。\n3. 进入撰写窗口的“选项（Options）”，并确保没有设置“换行（Word\
  \ wrap）”。\n4. 使用 `Message → Insert file...` 并插入补丁。\n5. 回到撰写窗口：在消息中添加你需要的任何其他文本，完成地址和主题字段，并发送。\n\
  \n## 示例\n\n提取版本 R1 和 R2 之间的提交，并使用 `git am` 将它们应用到当前分支上以进行 cherry-pick：\n\n```bash\n\
  $ git format-patch -k --stdout R1..R2 | git am -3 -k\n```\n\n提取在当前分支中但不在 origin\
  \ 分支中的所有提交：\n```bash\n$ git format-patch origin\n```\n为每个提交在当前目录下创建一个单独的文件。\n\n\
  提取自项目启动以来通向 `origin` 的所有提交：\n```bash\n$ git format-patch --root origin\n```\n\n\
  与上一个相同：\n```bash\n$ git format-patch -M -B origin\n```\n此外，它会智能地检测并处理重命名和完全重写以生成重命名补丁。重命名补丁减少了文本输出量，并通常更容易审查。注意，非\
  \ Git 的“补丁”程序无法理解重命名补丁，因此仅在你确定对方使用 Git 应用补丁时才使用它。\n\n从当前分支提取三个顶端提交并将其格式化为可发送邮件的补丁：\n\
  ```bash\n$ git format-patch -3\n```\n\n## 参见\n\n(1), (1)\n\n* * *\n\n# GIT-FSCK-OBJECTS\n\
  \n## 名称\n\n`git-fsck-objects` - 验证数据库对象的连接性和有效性\n\n## 摘要\n\n`git fsck-objects` `...`\n\
  \n## \n\n这是 (1) 的同义词。请参考该命令的文档。\n\n* * *\n\n# GIT-FSCK\n\n## 名称\n\n`git-fsck` -\
  \ 验证数据库对象的连接性和有效性\n\n## 摘要\n\n`git fsck` `[--tags] [--root] [--unreachable] [--cache]\
  \ [--no-reflogs] [--[no-]full] [--strict] [--verbose] [--lost-found] [--[no-]dangling]\
  \ [--[no-]progress] [<object]*]`\n\n## 描述\n\n验证数据库对象的连接性和有效性。\n\n### 选项\n\n`<object>`\n\
  \n一个被视为不可达性追踪头部的对象。如果没有给出任何对象，`git fsck` 默认使用索引文件、refs 空间中的所有 SHA-1 引用以及所有 reflog（除非给了\
  \ `--no-reflogs`）作为头部。\n\n`--[no-]dangling`\n\n\n\n\n\n打印存在但从未被直接使用的对象（默认）。可以使用\
  \ `--no-dangling` 从输出中省略此类信息。\n\n`--root`\n报告根节点。\n\n`--tags`\n报告标签。\n\n`--cache`\n\
  将索引中记录的任何对象也视为不可达性追踪的头节点（head node）。\n\n`--no-reflogs`\n不要将仅由 reflog 条目引用的提交视为可达。此选项仅用于搜索曾经存在于\
  \ ref 中但现在不存在、仍存在于对应 reflog 中的提交。\n\n`--full`\n不仅检查 `GIT_OBJECT_DIRECTORY`（`$GIT_DIR/objects`）中的对象，还检查在\
  \ `GIT_ALTERNATE_OBJECT_DIRECTORIES` 列出的备用对象池或 `$GIT_DIR/objects/info/alternates`\
  \ 中的对象，以及在 `$GIT_DIR/objects/pack` Find 的压缩包 Git 存档以及备用对象池相应的包子目录中的对象。这现在是默认设置；可以通过\
  \ `--no-full` 关闭。\n\n`--strict`\n启用更严格的检查，即捕获由旧版本 Git 创建的带有 g+w 位的文件模式。现有的仓库（包括\
  \ Linux 内内核、Git 自身和稀疏仓库）包含触发此检查的旧对象，但建议使用此标记对新项目进行检查。\n\n`--verbose`\n详细模式。\n\n\
  `--lost-found`\n将悬空对象（dangling objects）写入 `.git/lost-found/commit/` 或 `.git/lost-found/other/`，取决于类型。如果对象是\
  \ blob，则内容被写入文件，而不是其对象名称。\n\n`--[no-]progress`\n当标准错误流附加到终端时，默认在标准错误流上报告进度状态，除非指定了\
  \ `--no-progress` 或 `--verbose`。`--progress` 即使标准错误流未重定向到终端也会强制报告进度状态。\n\n## 讨论\n\
  \n`git-fsck` 测试 SHA-1 和通用对象的完整性，并对生成的可达性及其他一切进行完整跟踪。它会打印出发现的任何损坏（丢失或错误的对象），如果你使用\
  \ `--unreachable` 标记，它还会打印出存在但无法从任何指定的头节点（或上述的默认 set）到达的对象。\n\n任何损坏的对象都必须在备份或其他存档中找到（即：你可以直接删除它们并与其他站点进行\
  \ `rsync`，希望别人拥有你所损坏的对象）。\n\n## 提取的诊断信息\n\n`expect dangling commits - potential\
  \ heads - due to lack of head information`\n你没有指定任何节点作为头节点，因此无法区分无父节点的提交和根节点。\n\n\
  `missing sha1 directory <dir>` \n存放 sha1 对象的目录丢失。\n\n`unreachable <type> <object>`\n\
  `<type>` 对象 `<object>` 实际上未在看到的任何树或提交中被直接或间接地引用引用。这可能意味着存在另一个你未指定的根节点，或者树损坏了。如果你没有漏掉根节点，那么大可以删除这些不可达节点，因为它们是无法使用的。\n\
  \n`missing <type> <object>`\n`<type>` 对象 `<object>` 被引用，但在数据库中不存在。\n\n`dangling\
  \ <type> <object>`\n`<type>` 对象 `<object>` 存在于数据库中，但从未被直接使用。悬空提交可能是一个根节点。\n\n`sha1\
  \ mismatch <object>`\n数据库中的对象 sha1 与数据库值不匹配。这表明存在严重的数据完整性问题。\n\n## 环境变量\n\n`GIT_OBJECT_DIRECTORY`\n\
  用于指定对象数据库根目录（通常为 `$GIT_DIR/objects`）\n\n`GIT_INDEX_FILE`\n用于指定索引的索引文件\n\n`GIT_ALTERNATE_OBJECT_DIRECTORIES`\n\
  用于指定额外的对象数据库根目录（通常未设置）\n\n***\n\n# GIT-GC\n\n## 名称\n`git-gc` - 清理不需要的文件并优化本地仓库\n\
  \n## 概要\n`git gc` `--aggressive] [--auto] [--quiet] [--prune=<date> | --no-prune]\
  \ [--force]`\n\n## 描述\n在当前仓库中运行若干项清理任务，例如压缩文件版本（以减少磁盘空间并提高性能）以及删除从之前的调用 `git add`\
  \ 可能创建的不可达对象。\n\n鼓励用户在每个仓库中定期运行此任务，以保持良好的磁盘空间利用率和运行性能。\n\n某些 git 命令可能会自动运行 `git\
  \ gc`；详情请参阅下方的 `--auto` 标记。如果你清楚自己在做什么，并且只是想永久禁用此行为而不考虑其他因素，只需执行：\n\n```\n$ git\
  \ config --global gc.auto 0\n```\n\n### 选项\n\n`--aggressive`\n通常 `git gc` 运行非常快，同时提供良好的磁盘空间利用率和性能。此选项将导致\
  \ `git gc` 更积极地优化仓库，代价是花费更多时间。这种优化的效果是持久的，因此此选项只需要偶尔使用；大约每几百个提交使用一次。\n\n`--auto`\n\
  使用此选项，`git gc` 会检查是否需要进行清理；如果没有，将在不执行任何工作的情况下退出。某些 git 命令在执行可能创建许多松对象的操作后会运行 `git\
  \ gc --auto`。\n\n如果仓库中有过多的松对象或过多的包（packs），则需要清理。如果松对象的数量超过 `gc.auto` 配置变量的值，则将使用\
  \ `git repack -d -l` 将所有松对象合并为一个包。将 `gc.auto` 的值设为 0 将禁用松对象的自动打包。\n\n如果包的数量超过 `gc.autoPackLimit`\
  \ 的值，则现有包（被 `.keep` 文件标记的除外）将使用 `git repack` 的 `-A` 选项合并为一个包。将 `gc.autoPackLimit`\
  \ 设置为 0 将禁用包的自动合并。\n\n`--prune=<date>`\n修剪早于日期的松对象（默认两周前，可以通过配置变量 `gc.pruneExpire`\
  \ 覆盖）。`--prune=all` 无论年龄均修剪松对象。`--prune` 默认开启。\n\n`--no-prune`\n不修剪任何松对象。\n\n`--quiet`\n\
  抑制所有进度报告。\n\n`--force`\n强制运行 `git gc`，即使该仓库上可能正在运行另一个 `git gc` 实例。\n\n## 配置\n可选的配置变量\
  \ `gc.reflogExpire` 可以设置，以指示每个分支 reflog 中的历史条目在仓库中保留多久。该设置表示为时间长度，例如 `90 days` 或\
  \ `3 months`。默认值为 `90 days`。\n\n可选的配置变量 `gc.reflogExpireUnreachable` 可以设置，以指示不属于当前分支的历史\
  \ reflog 条目在仓库中保留多久。这些类型的条目通常由于使用 `git commit --amend` 或 `git rebase` 而产生，是发生 amend\
  \ 或 rebase 之前的提交。由于这些更改不是当前项目的一部分，大多数用户会希望更早让它们过期。此选项默认值为 `30 days`。\n\n上述两个配置变量可以赋予一个模式。例如，这仅为远程跟踪分支设置非默认的过期值：\n\
  \n```\n[gc \"refs/remotes/*\"] reflogExpire = never reflogExpireUnreachable = 3\
  \ days\n```\n\n可选的配置变量 `gc.rerereResolved` 指明你之前解决的冲突合并记录保留多久。默认为 60 天。\n\n可选的配置变量\
  \ `gc.rerereUnresolved` 指明未解决的冲突合并记录保留多久。默认为 15 天。\n\n可选的配置变量 `gc.packRefs` 决定 `git\
  \ gc` 是否运行 `git pack-refs`。可以被设置为 \"notbare\" 以在所有非裸仓库中启用，或者可以设置为布尔值。默认值为 true。\n\
  \n\n\n\n\n可选的配置变量 `gc.aggressiveWindow` 控制在指定 `--aggressive` 选项时，用于优化仓库中对象增量压缩（delta\
  \ compression）的时间。该值越大，用于优化增量压缩的时间就越长。更多细节请参阅 (1) 中 `--window` 选项的文档。默认值为 250。\n\
  \n同样，可选的配置变量 `gc.aggressiveDepth` 控制 (1) 中的 `--depth` 选项。默认值为 250。\n\n可选的配置变量 `gc.pruneExpire`\
  \ 控制未引用的松散对象（loose objects）在被清理之前需要有多旧。默认是“2 周前”。\n\n## 注意事项\n\n`git gc` 会非常努力确保其收集的垃圾操作是安全的。特别是，它不仅会保留当前分支和标签引用的对象，还会保留索引（index）、远程跟踪分支、由\
  \ `git filter-branch` 保存在 `refs/original/` 中的引用，或引用日志（reflogs）（这些引用日志可能引用了之后被修改或回滚的分支中的提交）。\n\
  \n如果你期望某些对象被回收但它们没有被回收，请检查所有这些位置，并决定在你的情况下删除这些引用是否合理。\n\n## 钩子\n\n`git gc --auto`\
  \ 命令将运行 `pre-auto-gc` 钩子。更多信息请见 (5)。\n\n## 另\n\n(1) (1) (1) (1)\n\n* *\n\n# Git-get-tar-commit-id\n\
  \n## 名称\n\ngit-get-tar-commit-id - 从使用 git-archive 创建的归档中提取 commit ID\n\n## 概要\n\
  \n```\ngit get-tar-commit-id < <tarfile>\n```\n\n## 描述\n\n作为一个过滤器使用，提取由 `git archive`\
  \ 创建的归档中存储的 commit ID。它只读取输入的前 1024 字节，因此运行时间不受 `<tarfile>` 大小的影响。\n\n如果没有找到 commit\
  \ ID，`git get-tar-commit-id` 将静默退出并返回状态码 1。这可能发生在 `<tarfile>` 不是使用 `git archive`\
  \ 创建的，或者 `git archive` 的第一个参数是树 ID 而不是 commit ID 或标签的情况下。\n\n* * *\n\n# GIT-GREP\n\
  \n## 名称\n\ngit-grep - 打印匹配模式的行\n\n## 概要\n\n```\ngit grep [-a | --text] [-I] [--textconv]\
  \ [-i | --ignore-case] [-w | --word-regexp] [-v | --invert-match] [-h|-H] [--full-name]\
  \ [-E | --extended-regexp] [-G | --basic-regexp] [-P | --perl-regexp] [-F | --fixed-strings]\
  \ [-n | --line-number] [-l | --files-with-matches] [-L | --files-without-match]\
  \ [(-O | --open-files-in-pager) [<pager>]] [-z | --null] [-c | --count] [--all-match]\
  \ [-q | --quiet] [--max-depth <depth>] [--color[=<when>] | --no-color] [--break]\
  \ [--heading] [-p | --show-function] [-A <post-context>] [-B <pre-context>] [-C\
  \ <context>] [-W | --function-context] [-f <file>] [-e] <pattern> [--and|--or|--not|(|)|-e\
  \ <pattern>...] [ [--[no-]exclude-standard] [--cached | --no-index | --untracked]\
  \ | <tree>...] [--] [<pathspec>...]\n```\n\n## 描述\n\n在工作树中的跟踪文件、索引文件中注册的 blob 或给定树对象中的\
  \ blob 中查找指定的模式。模式是按换行符分隔的一个或多个搜索表达式的列表。空字符串作为搜索表达式将匹配所有行。\n\n## 配置\n\n`grep.lineNumber`\n\
  \n如果设置为 true，则默认启用 `-n` 选项。\n\n`grep.patternType`\n\n设置默认匹配行为。使用 `basic`、`extended`、`fixed`\
  \ 或 `perl` 值将分别启用 `--basic-regexp`、`--extended-regexp`、`--fixed-strings` 或 `--perl-regexp`\
  \ 选项，而值 `default` 将返回默认匹配行为。\n\n`grep.extendedRegexp`\n\n如果设置为 true，则默认启用 `--extended-regexp`\
  \ 选项。当 `grep.patternType` 选项设置为非 `default` 时，此选项会被忽略。\n\n`grep.fullName`\n\n如果设置为\
  \ true，则默认启用 `--full-name` 选项。\n\n### 选项\n\n`--cached`\n\n不再搜索工作树中的跟踪文件，而是搜索索引文件中注册的\
  \ blob。\n\n`--no-index`\n\n搜索当前目录中未由 Git 管理的文件。\n\n`--untracked`\n\n在搜索工作树中的跟踪文件之外，也搜索未跟踪的文件。\n\
  \n`--no-exclude-standard`\n\n通过不遵守 `.gitignore` 机制来搜索被忽略的文件。仅在配合 `--untracked` 时有用。\n\
  \n`--exclude-standard`\n\n不忽略通过 `.gitignore` 机制指定的忽略文件。仅在配合 `--no-index` 搜索当前目录下的文件时有用。\n\
  \n`-a, --text`\n\n将二进制文件当做文本处理。\n\n`--textconv`\n\n尊重 textconv 过滤器设置。\n\n`--no-textconv`\n\
  \n不尊重 textconv 过滤器设置。这是默认设置。\n\n`-i, --ignore-case`\n\n忽略模式与文件之间的大小写差异。\n\n`-I`\n\
  \n不在二进制文件中匹配模式。\n\n`--max-depth <depth>`\n\n对于命令行上给出的每个 `<pathspec>`，最多进入 `<depth>`\
  \ 级目录。负值表示无限制。如果 `<pathspec>` 包含活动通配符，则此选项会被忽略。换句话说，如果 `\"a*\"` 匹配名为 `\"a*\"` 的目录，则\
  \ `\"*\"` 被字面匹配，因此 `--max-depth` 仍然有效。\n\n`-w, --word-regexp`\n\n仅在单词边界匹配模式（要么在行首，或前面是非单词字符；要么在行尾，或后面是非单词字符）。\n\
  \n`-v, --invert-match`\n\n选择不匹配的行。\n\n`-h, -H`\n\n默认情况下，命令显示每个匹配项的文件。`-h` 选项用于抑制此输出。`-H`\
  \ 是为了完整性存在的，除了覆盖命令行早给出的 `-h` 之外不起任何作用。\n\n`--full-name`\n\n从子目录运行时，命令通常输出相对于当前目录的路径。此选项强制相对于项目根目录输出路径。\n\
  \n`-E, --extended-regexp, -G, --basic-regexp`\n\n对模式使用 POSIX 扩展/基础正则表达式。默认使用基础正则表达式。\n\
  \n`-P, --perl-regexp`\n\n对模式使用 Perl 兼容的正则表达式。需要编译了 libpcre。\n\n`-F, --fixed-strings`\n\
  \n对模式使用固定字符串（不将模式解释为正则表达式）。\n\n`-n, --line-number`\n\n在匹配的行前加上行号。\n\n`-l, --files-with-matches,\
  \ --name-only, -L, --files-without-match`\n\n不再显示每个匹配行，而是只显示包含（或不包含）匹配项的文件名。为了与\
  \ `git diff` 兼容，`--name-only` 是 `--files-with-matches` 的同义词。\n\n`-O [<pager>], --open-files-in-pager`\n\
  \n在分页器中打开匹配的文件（而不是 `grep` 的输出）。如果分页器恰好是 \"less\" 或 \"vi\"，且用户指定了一个模式，则第一个文件会自动定位到第一个匹配处。\n\
  \n`-z, --null`\n\n输出 `\\0` 代替通常跟随文件名后的字符。\n\n`-c, --count`\n\n不再显示每个匹配行，而是显示匹配的行数。\n\
  \n`--color[=<when>]`\n\n显示彩色匹配项。值必须是 always（默认）、never 或 auto。\n\n`--no-color`\n\n\
  关闭匹配高亮，即使配置文件为颜色输出提供了默认值。同于 `--color=never`。\n\n`--break`\n\n在不同文件的匹配项之间打印一个空行。\n\
  \n`--heading`\n\n在该文件的匹配项上方显示文件名，而不是在每个显示行的开头显示。\n\n`-p, --show-function`\n\n显示包含匹配项函数名的上一行，除非匹配行本身就是函数名。该名称的确定方式与\
  \ *git diff* 计算补丁块头部的方式相同（见 (5) 中的 *定义自定义块头部*）。\n\n`<num>, -C <num>, --context <num>`\n\
  \n显示 `<num>` 行前行和行尾行，并在连续的匹配组之间放置一行包含 -- 的行。\n\n`-A <num>, --after-context <num>`\n\
  \n显示 `<num>` 行尾行，并在连续的匹配组之间放置一行包含 -- 的行。\n\n`-B <num>, --before-context <num>`\n\
  \n显示 `<num>` 行前行，并在连续的匹配组之间放置一行包含 -- 的行。\n\n`-W, --function-context`\n\n\n\n\n显示上一行中包含函数名的周围文本，直到下一个函数名之前的内容，实际上显示了找到匹配项的整个函数。\n\
  \n`-f <file>`\n\n从 `<file>` 读取模式，每行一个。\n\n`-e`\n\n下一个参数是模式。此选项必须用于以 `-` 开头的模式，并应在将用户输入传递给\
  \ `grep` 的脚本中使用。多个模式通过 `*or`（或关系）组合。\n\n`--and, --or, --not, ( ... )`\n\n使用布尔表达式指定多个模式的组合方式。`--or`\
  \ 是默认操作符。`--and` 的优先级高于 `--or`。所有模式都必须使用 `-e`。\n\n`--all-match`\n\n在提供使用 `--or`\
  \ 组合的多个模式表达式时，指定此标志以限制匹配范围为那些包含匹配所有模式行的文件。\n\n`-q, --quiet`\n\n不输出匹配的行；相反，在存在匹配时以状态\
  \ 0 退出，在不存在时以非零状态退出。\n\n`<tree>...`\n\n不再搜索工作树中被跟踪的文件，而是搜索给定树对象（trees）中的 blob 对象。\n\
  \n`--`\n\n标志选项的结束；其余参数是 `<pathspec>` 限制符。\n\n`<pathspec>...`\n\n如果给出，则将搜索限制为匹配至少一个模式的路径。支持领先路径匹配和\
  \ `(7)` 模式。\n\n## 示例\n\n```bash\ngit grep 'time_t' -- '*.[ch]'\n```\n\n在工作目录及其子目录下所有被跟踪的\
  \ `.c` 和 `.h` 文件中查找 `time_t`。\n\n```bash\ngit grep -e '#define' --and \\( -e MAX_PATH\
  \ -e PATH_MAX \\)\n```\n\n查找包含 `#define` 以及包含 `MAX_PATH` 或 `PATH_MAX` 的行。\n\n```bash\n\
  git grep --all-match -e NODE -e Unexpected\n```\n\n在同时包含这两个模式行的文件中，查找包含 `NODE` 或\
  \ `Unexpected` 的行。\n\n* * *\n\n# GIT-HASH-OBJECT\n\n## 名字\n\n`git-hash-object` -\
  \ 计算对象 ID，并可选地从文件创建 blob\n\n## 摘要\n\n`git hash-object` `[-t <type>] [-w] [--path=<file>|--no-filters]\
  \ [--stdin [--literally]] [--] <file>...` `git hash-object` `[-t <type>] [-w] --stdin-paths\
  \ [--no-filters] < <list-of-paths>`\n\n## 描述\n\n根据指定类型通过命名文件的内容（可以在工作树外）计算对象的 ID\
  \ 值，并可选地将结果对象写入对象数据库。将其对象 ID 报告到标准输出。这被 `git cvsimport` 用于在不修改工作树中文件的情况下更新索引。当未指定\
  \ `<type>` 时，默认为 \"blob\"。\n\n## \n\n`-t <type>`\n\n指定类型（默认: \"blob\"）。\n\n`-w`\n\
  \n实际上将对象写入对象数据库。\n\n`--stdin`\n\n从标准输入而不是从文件读取对象。\n\n`--stdin-paths`\n\n从标准输入而不是从命令行读取文件名。\n\
  \n`--path`\n\n假定对象位于给定路径处并对其进行哈希。文件位置不直接影响哈希值，但路径用于确定在对象放入对象数据库之前应该应用哪些 Git 过滤器，作为应用过滤的结果，放入对象数据库的实际\
  \ blob 可能与给定文件不同。此选项主要用于哈希位于工作区外的临时文件或从标准输入读取的文件。\n\n`--no-filters`\n\n按原样哈希内容，忽略属性机制可能选择的任何输入过滤器，包括换行符转换。如果文件是从标准输入读取的，则始终隐含这一点，除非给了\
  \ `--path` 选项。\n\n`--literally`\n\n允许 `--stdin` 将任何垃圾数据哈希到松散对象中，否则可能无法通过标准对象解析或\
  \ `git-fsck` 检查。适用于 Git 本身的压力测试或复现在环境中遇到的损坏或伪造对象的特性。\n\n* * *\n\n# GIT-HELP\n\n\
  ## 名字\n\n`git-help` - 显示关于 Git 的帮助信息\n\n## 摘要\n\n`git help` `[-a|--all] [-g|--guide]\
  \ [-i|--info|-m|--man|-w|--web] [COMMAND|GUIDE]`\n\n## 描述\n\n在没有提供选项且没有 `COMMAND`\
  \ 或 `GUIDE` 的情况下，标准输出将打印 `git` 命令的摘要和最常用的 Git 命令列表。\n\n如果给出了选项 `--all` 或 `-a`，则在标准输出打印所有可用命令。\n\
  \n如果给出了选项 `--guide` 或 `-g`，则在标准输出打印实用的 Git 指南列表。\n\n如果给出了命令或指南，将打开该命令或指南的帮助页。默认使用\
  \ `man` 程序实现此目的，但可以通过其他选项或配置变量覆盖它。\n\n注意 `git --help ...` 与 `git help ...` 相同，因为前者在内部被转换为后者。\n\
  \n要显示 (1) 帮助页，请使用 `git help git`。\n\n可以使用 `git help help` 或 `git help --help` 显示此页面。\n\
  \n### 选项\n\n`-a, --all`\n\n在标准输出打印所有可用命令。此选项会覆盖任何给定的命令或指南名称。\n\n`-g, --guides`\n\
  \n在标准输出打印有用指南列表。此选项会覆盖任何给定的命令或指南名称。\n\n`-i, --info`\n\n以 `info` 格式显示命令的帮助页。该目的将使用\
  \ `info` 程序。\n\n`-m, --man`\n\n以 `man` 格式显示命令的帮助页。此选项可用于覆盖 `help.format` 中设置的值。默认将使用\
  \ `man` 程序显示帮助页，但 `man.viewer` 配置变量可能会选择其他程序。\n\n`-w, --web`\n\n以网络 HTML 格式显示命令的帮助页。将使用网络浏览器。可以使用配置变量\
  \ `help.browser` 指定网络浏览器。如果未设置，将选择默认值。关于更多信息请见 (1)。\n\n## 配置变量\n\n### help.format\n\
  \n如果没有传递命令行选项，将检查 `help.format` 配置变量。支持以下值；使 `git help` 对应相应的选项：\n\n\"man\" 对应 `-m|--man`，\n\
  \n\"info\" 对应 `-i|--info`，\n\n\"web\" 或 \"html\" 对应 `-w|--web`。\n\n### help.browser,\
  \ web.browser and browser.<tool>.path\n\n当选择 `web` 格式时（通过命令行选项或配置变量），还将检查 `help.browser`、`web.browser`\
  \ 和 `browser.<tool>.path`。见选项中的 `-w`。\n\n### man.viewer\n\n当选择 `man` 格式时，将检查 `man.viewer`\
  \ 配置变量。目前支持以下值：\n\n\"man\": 像往常一样 `man` 程序，\n\n\"woman\": 使用 `emacsclient` 启动 \"\
  woman\" 模式（这从 emacsclient 22 版本开始可用），\n\n\"konqueror\": 使用 *kfmclient* 在新的 konqueror\
  \ 标签中打开帮助页（见下文 *关于 konqueror 的注意*）。\n\n如果有相应的 `man.<tool>.cmd` 配置项，可以使用其他工具的值（见下文）。\n\
  \n`man.viewer` 可以给出多个值。将按照配置文件中列出的顺序尝试相应的程序。\n\n例如，此配置：\n\n`[man] viewer = konqueror\
  \ viewer = woman`\n\n将先尝试 konqueror。但可能会失败（例如，未设置 DISPLAY），在这种情况下将尝试 emacs 的 woman\
  \ 模式。\n\n如果所有尝试失败或未配置查看器，将尝试环境变量 `GIT_MAN_VIEWER` 中指定的查看器。如果也失败，将仍然尝试 `man` 程序。\n\
  \n### man.<tool>.path\n\n可以通过设置配置变量 `man.<tool>.path` 显式提供首选查看器的完整路径。例如，可以通过设置 `man.konqueror.path`\
  \ 来配置 konqueror 的绝对路径。否则，`git help` 假设该工具在 PATH 中。\n\n### man.<tool>.cmd\n\n\n\n\
  \n当 `man.viewer` 配置变量指定的 man 视器不在支持的列表内时，将查找对应的 `man.<tool>.cmd` 配置变量。如果该变量存在，则指定的工具将被视为自定义命令，并将使用\
  \ shell eval 来运行该命令，同时将 man 页面作为参数传递。\n\n### 关于 konqueror 的说明\n\n当在 `man.viewer`\
  \ 配置变量中指定 `konqueror` 时，我们会启动 `kfmclient`，尝试尽可能在已打开的 konqueror 的新标签页中打开 man 页面。\n\
  \n为了保持一致性，如果 `man.konqueror.path` 设置为类似于 `A_PATH_TO/konqueror` 的路径，我们也会尝试这种技巧。这意味着我们将尝试启动\
  \ `A_PATH_TO/kfmclient`。\n\n如果你确实想使用 `konqueror`，可以使用如下所示的配置：\n\n```\n[man] viewer\
  \ = konq [man \"konq\"] cmd = A_PATH_TO/konqueror\n```\n\n### 关于 git config --global\
  \ 的说明\n\n注意，所有这些配置变量可能应该使用 `--global` 标志进行设置，例如：\n\n```\n$ git config --global help.format\
  \ web $ git config --global web.browser firefox\n```\n\n因为它们可能更多地针对特定用户而非特定仓库。更多信息请参阅\
  \ (1)。\n\n# GIT-HTTP-BACKEND\n\n## 名称\n\ngit-http-backend - 基于 HTTP 的 Git 服务端实现\n\
  \n## 概要\n\n一个简单的 CGI 程序，用于向通过 `http://` 和 `https://` 协议访问仓库的 Git 客户端提供仓库内容。该程序支持客户端使用智能\
  \ HTTP 协议（smart HTTP）和向后兼容的原始 HTTP 协议（dumb HTTP）进行拉取，同时也支持客户端使用智能 HTTP 协议进行推送（push）。\n\
  \n它会验证目录是否存在魔法文件 \"git-daemon-export-ok\"，并且拒绝导出任何未通过此方式显式标记为导出的 Git 目录（除非设置了 `GIT_HTTP_EXPORT_ALL`\
  \ 环境变量）。\n\n默认情况下，仅启用 upload-pack 服务，它为 `git fetch-pack` 和 `git ls-remote` 客户端提供服务，这些客户端由\
  \ `git fetch`、`git pull` 和 `git clone` 调用。如果客户端通过了身份验证，将启用 receive-pack 服务，它为 `git\
  \ send-pack` 客户端提供服务，该客户端由 `git push` 调用。\n\n## 服务\n\n这些服务可以使用每个仓库的配置文件启用/禁用：\n\n\
  `http.getanyfile`\n\n此服务用于版本低于 1.6.6 无法使用 upload pack 服务的 Git 客户端。启用后，客户端可以读取仓库中的任何文件，包括无法从分支触达但仍然存在的对象。默认启用的，但仓库可以通过将此配置项设置为\
  \ `false` 来禁用它。\n\n`http.uploadpack`\n\n此服务为 `git fetch-pack` 和 `git ls-remote`\
  \ 客户端提供服务。默认启用的，但仓库可以通过将此配置项设置为 `false` 来禁用它。\n\n`http.receivepack`\n\n此服务为 `git\
  \ send-pack` 客户端提供服务，允许推送。对于匿名用户默认禁用，对于通过 Web 服务器身份验证的用户默认启用。可以通过将此项设置为 `false`\
  \ 来禁用，或通过设置为 `true` 为包括匿名用户在内的所有用户启用。\n\n## URL 解析\n\n为了确定仓库在磁盘上的位置，`git http-backend`\
  \ 会拼接环境变量 `PATH_INFO`（由 Web 服务器自动设置）和 `GIT_PROJECT_ROOT`（必须在 Web 服务器配置中手动设置）。如果未设置\
  \ `GIT_PROJECT_ROOT`，`git http-backend` 将读取同样由 Web 服务器自动设置的 `PATH_TRANSLATED`。\n\
  \n## 示例\n\n以下示例均映射 `/var/www/git/foo/bar.git`。\n\n### Apache 2.x\n\n确保 `mod_cgi`、`mod_alias`\
  \ 和 `mod_env` 已启用，正确设置 `GIT_PROJECT_ROOT`（或 `DocumentRoot`），并为 CGI 创建一个 `ScriptAlias`：\n\
  \n```\nSetEnv GIT_PROJECT_ROOT /var/www/git SetEnv GIT_HTTP_EXPORT_ALL ScriptAlias\
  \ /git/ /usr/libexec/git-core/git-http-backend/\n```\n\n若要启用匿名读取访问但需要身份验证的写入访问，则对初始引用广告（我们通过查询字符串中的\
  \ service 参数检测其为推送）以及 receive-pack 调用本身都要求授权：\n\n```\nRewriteCond %{QUERY_STRING}\
  \ service=git-receive-pack [OR] RewriteCond %{REQUEST_URI} /git-receive-pack$ RewriteRule\
  \ ^/git/ - [E=AUTHREQUIRED:yes] <LocationMatch \"^/git/\"> Order Deny,Allow Deny\
  \ from env=AUTHREQUIRED AuthType Basic AuthName \"Git Access\" Require group committers\
  \ Satisfy Any ... </LocationMatch>\n```\n\n如果没有可用的 `mod_rewrite` 来匹配查询字符串，则只需保护\
  \ `git-receive-pack` 自身，例如：\n\n```\n<LocationMatch \"^/git/.*/git-receive-pack$\"\
  > AuthType Basic AuthName \"Git Access\" Require group committers ... </LocationMatch>\n\
  ```\n\n在此模式下，服务器直到客户端实际开始推送的对象协商阶段才会请求身份验证，而不是在初始连接期间。由于由于原因，你必须在任何应该接受推送的仓库中启用\
  \ `http.receivepack` 配置选项。如果未设置 `http.receivepack`，默认行为是拒绝任何未验证用户的推送；因此，初始请求将向客户端报告\
  \ 403 Forbidden，甚至不会提供身份验证的机会。\n\n若要对读取和写入都要求身份验证，请在仓库或其父目录周围使用 `Location` 指令：\n\
  \n```\n<Location /git/private> AuthType Basic AuthName \"Private Git Access\" Require\
  \ group committers ... </LocationMatch>\n```\n\n若要在同一 URL 下提供 `gitweb`，使用 `ScriptAliasMatch`\
  \ 仅针对 `git http-backend` 能够处理的 URL，并将其余部分转发到 `gitweb`：\n\n```\nScriptAliasMatch\
  \ \\ \"(?x)^/git/(.*/(HEAD | \\ info/refs | \\ objects/(info/[^/]+ | \\ [0-9a-f]{2}/[0-9a-f]{38}\
  \ | \\ pack/pack-[0-9a-f]{40}\\.(pack|idx)) | \\ git-(upload|receive)-pack))$\"\
  \ \\ /usr/libexec/git-core/git-http-backend/$1 ScriptAlias /git/ /var/www/cgi-bin/gitweb.cgi/\n\
  ```\n\n要在在一个仓库中从不同的 (7) 位置提供多个仓库：\n\n```\nSetEnvIf Request_URI \"^/git/([^/]*)\"\
  \ GIT_NAMESPACE=$1 ScriptAliasMatch ^/git/[^/]*(.*) /usr/libexec/git-core/git-http-backend/storage.git$1\n\
  ```\n\n### 加速静态 Apache 2.x\n\n与上述类似，但 Apache 可用于返回存储在磁盘上的静态文件。在许多系统中，这可能更高效，因为 Apache\
  \ 可以请求内核将文件内容从文件系统直接拷贝到网络：\n\n```\nSetEnv GIT_PROJECT_ROOT /var/www/git AliasMatch\
  \ ^/git/(.*/objects/[0-9a-f]{2}/[0-9a-f]{38})$ /var/www/git/$1 AliasMatch ^/git/(.*/objects/pack/pack-[0-9a-f]{40}.(pack|idx))$\
  \ /var/www/git/$1 ScriptAlias /git/ /usr/libexec/git-core/git-http-backend/\n```\n\
  \n这可以与 `gitweb` 配置结合：\n\n```\nSetEnv GIT_PROJECT_ROOT /var/www/git AliasMatch ^/git/(.*/objects/[0-9a-f]{2}/[0-9a-f]{38})$\
  \ /var/www/git/$1 AliasMatch ^/git/(.*/objects/pack/pack-[0-9a-f]{40}.(pack|idx))$\
  \ /var/www/git/$1 ScriptAlias /git/ /usr/libexec/git-core/git-http-backend/\n```\n\
  \n### Lighttpd\n\n确保 `mod_cgi`、`mod_alias`、`mod_auth`、`mod_setenv` 已加载，然后正确设置 `GIT_PROJECT_ROOT`\
  \ 并将请求重定向到 CGI：\n\n```\nalias.url += ( \"/git\" => \"/usr/lib/git-core/git-http-backend\"\
  \ ) $HTTP[\"url\"] =~ \"^/git\" { cgi.assign = (\"\" => \"\") setenv.add-environment\
  \ = ( \"GIT_PROJECT_ROOT\" => \"/var/www/git\", \"GIT_HTTP_EXPORT_ALL\" => \"\"\
  ) }\n```\n\n要启用匿名读取访问但需要身份验证的写入访问：\n\n```\n$HTTP[\"querystring\"] =~ \"service=git-receive-pack\"\
  \ { include \"git-auth.conf\" } $HTTP[\"url\"] =~ \"^/git/.*/git-receive-pack$\"\
  \ { include \"git-auth.conf\" }\n```\n\n其中 `git-auth.conf` 如下所示：\n\n```\nauth.require\
  \ = ( \"/\" => ( \"method\" => \"basic\", \"realm\" => \"Git Access\", \"require\"\
  \ => \"valid-user\" ) ) # ...并在此处设置 auth.backend\n```\n\n\n\n\n\n对于读取和写入都需要身份验证：\n\
  \n`$HTTP[\"url\"] =~ \"^/git/private\" { include \"git-auth.conf\" }`\n\n## 环境\n\
  \n`git-http-backend` 依赖于调用 Web 服务器设置的 CGI 环境变量，包括：\n\n`PATH_INFO`（如果设置了 `GIT_PROJECT_ROOT`，否则使用\
  \ `PATH_TRANSLATED`）\n`REMOTE_USER`\n`REMOTE_ADDR`\n`CONTENT_TYPE`\n`QUERY_STRING`\n\
  `REQUEST_METHOD`\n\n环境变量 `GIT_HTTP_EXPORT_ALL` 可以传递给 `git-http-backend`，以便在允许导出该仓库之前跳过对每个仓库中\
  \ \"git-daemon-export-ok\"文件的检查。\n\n环境变量 `GIT_HTTP_MAX_REQUEST_BUFFER`（或配置变量 `http.maxRequestBuffer`）可以设置以更改\
  \ git 在 fetch 过程中处理的最大 ref 协商请求；任何需要更大缓冲的 fetch 将失败。通常不需要更改此值，但如果你是从一个拥有极大量 ref（引用）的仓库拉取数据，则它可能会有所帮助。该值可以指定单位（例如，100M\
  \ 表示 100 兆）。默认值为 10 兆。\n\n后端进程会将 `GIT_COMMITTER_NAME` 设置为 `$REMOTE_USER`，并将 `GIT_COMMITTER_EMAIL`\
  \ 设置为 `${REMOTE_USER}@http.${REMOTE_ADDR}`，确保 `git-receive-pack` 创建的任何 reflog 都包含执行\
  \ push 的远程用户的标识信息。\n\n所有 CGI 环境变量对 `git-receive-pack` 调用的每个 hook 都可用。\n\n# GIT-HTTP-FETCH\n\
  \n## 名称\n\n`git-http-fetch` - 通过 HTTP 从远程 Git 仓库下载\n\n## 概要\n\n`git http-fetch [-c]\
  \ [-t] [-a] [-d] [-v] [-w filename] [--recover] [--stdin] <commit> <url>`\n\n##\
  \ 描述\n\n通过 HTTP 下载远程 Git 仓库。\n\n**注意**：不带 `-a` 使用此命令的方法已弃用。`-a` 的行为将在未来的版本中成为默认值。\n\
  \n### 选项\n\n`commit-id`\n要拉取的哈希值或 `[URL]/refs/` 下的文件名。\n\n`-c`\n获取提交对象。\n\n`-t`\n\
  获取与提交对象相关的树（trees）。\n\n`-a`\n获取所有对象。\n\n`-v`\n报告已下载的内容。\n\n`-w <filename>`\n传输完成后，将\
  \ `commit-id` 写入本地 `$GIT_DIR/refs/<filename>` 下的文件中。\n\n`--stdin`\n不再在命令行上指定 commit\
  \ id（在这种情况下是不符合预期的），`git http-fetch` 期望标准输入中是以下格式的行：\n`<commit-id>['\\t'<filename-as-in--w>]`\n\
  \n`--recover`\n验证从目标可及的所有内容是否已获取。用于之前的 fetch 被中断后。\n\n# GIT-HTTP-PUSH\n\n## 名称\n\
  \n`git-http-push` - 通过 HTTP/DAV 将对象推送到另一个仓库\n\n## 概要\n\n`git http-push [--all] [--dry-run]\
  \ [--force] [--verbose] <url> <ref> [<ref>...]`\n\n## 描述\n\n将缺失的对象发送到远程仓库，并更新远程分支。\n\
  \n**注意**：如果你的 `libcurl` 低于 7.16，此命令将临时禁用，因为报告说这种组合无法工作且有时会损坏仓库。\n\n### 选项\n\n`--all`\n\
  不要假设远程仓库当前状态是完整的，并验证整个本地 ref 历史中的所有对象都存在于远程仓库中。\n\n`--force`\n通常，命令拒绝更新不是用于覆盖它的本地\
  \ ref 祖先的远程 ref。此标志将禁用检查。这意味着远程仓库可能会丢失提交；请谨慎使用。\n\n`--dry-run`\n执行所有操作，但实际不发送更新。\n\
  \n`--verbose`\n报告在本地遍历的对象列表，以及成功发送到远程仓库的对象列表。\n\n`-d, -D`\n从远程仓库中删除 `<ref>`。指定的分支不能是远程\
  \ `HEAD`。如果指定了 `-d`，则必须满足以下其他条件：\n- 远程 `HEAD` 必须解析为本地存在的对象\n- 指定的分支解析为本地存在的对象\n\
  - 指定的分支必须是远程 `HEAD` 的祖先\n\n`<ref>...`\n要更新的远程 refs。\n\n## 指定 refs\n\n一个 `<ref>`\
  \ 规范可以是单个模式，也可以是由冒号 `:` 分隔的两个模式对（这意味着 ref 名称中不能包含冒号）。单个模式 `<name>` 只是 `<name>:<name>`\
  \ 的简写。\n\n每个模式对由源端（冒号之前）和目标端（冒号之后）组成。要推送的 ref 通过找到匹配源端的匹配项来确定，而推送的位置通过使用目标端来确定。\n\
  \n如果 `<src>` 未精确匹配本地 refs 中的任意一个，则为错误。\n\n如果 `<dst>` 不匹配任何远程 ref，则：\n- 它必须以 \"refs/\"\
  \ 开头；在这种情况下，`<dst>` 被字面用作目标。\n- `<src> == <dst>` 且匹配 `<src>` 的 ref 不存在于远程 refs 集中；本地匹配\
  \ `<src>` 的 ref 被用作目标的名称。\n\n在没有 `--force` 的情况下，只有当 `<dst>` 不存在时，`<src>` ref 才会存储在远程；如果\
  \ `<dst>` 是 `<src>` 的子集，则进行“forward 检查”。\n\n使用 `--force` 将禁用所有此类检查。可选地，`<ref>` 参数加上\
  \ `+` 前缀可以禁用 forward 检查。\n\n# GIT-IMAP-SEND\n\n## 名称\n\n`git-imap-send` - 将标准输入的补丁发送到\
  \ IMAP 文件夹\n\n## 概要\n\n`git imap-send [-v] [-q] [--no-]curl]`\n\n## 描述\n\n此命令将 `git\
  \ format-patch` 生成的邮件箱上传到 IMAP 草稿。允许无法直接读取邮件箱的邮件客户端使用 \"From\"、\"Date\" 和 \"Subject\"\
  \ 字段。\n\n典型用法如下：\n```\ngit format-patch --signoff --stdout | git imap-send\n```\n\
  \n### 选项\n\n`-v, --verbose`\n详细。\n\n`-q, --quiet`\n安静。\n\n`--curl`\n使用 `libcurl`\
  \ 与 IMAP 服务器通信，除非通过隧道。如果编译时设置了 `USE_CURL_FOR_IMAP_SEND` 选项，则忽略此项。\n\n`--no-curl`\n\
  使用 git 自己的 IMAP 程序与 IMAP 服务器通信，而不是使用 `libcurl`。如果编译时带有 `NOSSL` 选项，则忽略此项。\n\n## 配置\n\
  \n使用该工具时，必须设置 `imap.folder` 以及 `imap.tunnel` 或 `imap.host`。\n\n### 变量\n\n`imap.folder`\n\
  存入邮件的文件夹，通常是草稿文件夹。例如：\"INBOX.Drafts\"、INBOX/Drafts\" 或 \"[Gmail]/Drafts\"。必需。\n\n\
  `imap.tunnel`\n用于设置到 IMAP 服务器隧道的命令，通过隧道传输命令而不是使用直接网络连接。在未设置 `imap.host` 时必需。\n\n\
  `imap.host`\n标识服务器的 URL。使用 `imap://` 前缀表示非安全连接，使用 `imaps://` 前缀表示安全连接。设置了 `imap.tunnel`\
  \ 时忽略，否则是的。\n\n`imap.user`\n登录服务器时使用的用户名。\n\n`imap.pass`\n登录服务器时使用的密码。\n\n`imap.port`\n\
  连接到服务器的整数端口。`imap://` 主机默认为 143，`imaps://` 默认为 993。设置了 `imap.tunnel` 时忽略。\n\n`imap.sslverify`\n\
  启用或禁用对 SSL/TLS 连接使用的服务器证书的验证。默认 true true。设置了 `imap.tunnel` 时忽略。\n\n`imap.preformattedHTML`\n\
  启用或禁用发送补丁时使用 html 编码。html 编码的补丁将被 `<pre>` 包裹且内容类型为 text/html。讽刺的是，启用此选项会导致 Thunderbird\
  \ 将补丁以 plain/text, format=fixed email 格式发送。默认 false。\n\n`imap.authMethod`\n\n\n\n\
  \n指定与 IMAP 服务器进行身份验证的方法。如果编译 Git 时开启了 `NO_CURL` 选项，或者你的 `curl` 版本低于 `7.34.0`，或者你运行带\
  \ `--no-curl` 选项运行 `git-imap-send`，则唯一支持的方法是 `CRAM-MD5`。如果没有设置此项，`git imap-send`\
  \ 将使用基础 IMAP 明文 LOGIN 命令。\n\n## 示例\n\n使用隧道模式：\n\n```\n[imap] folder = \"INBOX.Drafts\"\
  \ tunnel = \"ssh -q -C /usr/bin/imapd ./Maildir 2> /dev/null\"\n```\n\n使用直接模式：\n\
  \n```\n[imap] folder = \"INBOX.Drafts\" host = user = bob pass = p4ssw0rd\n```\n\
  \n使用带 SSL 的直接模式：\n\n```\n[imap] folder = \"INBOX.Drafts\" host = user = bob pass\
  \ = p4ssw0rd port = 123 sslverify = false\n```\n\n## 示例\n\n要使用 GMail 的 IMAP 接口提交补丁，首先，编辑你的\
  \ `~/.gitconfig` 来指定账户设置：\n\n```\n[imap] folder = \"[Gmail]/Drafts\" host = user\
  \ = port = 993 sslverify = false\n```\n\n如果你收到“Folder doesn't exist”的错误，可能需要改用：folder\
  \ = \"[Google Mail]/Drafts\"。\n\n一旦提交准备就绪，运行以下命令：\n\n```bash\n$ git format-patch\
  \ --cover-letter -M --stdout origin/master | git imap-send\n```\n\n只需确保在邮件客户端中禁用了换行（GMail\
  \ 的网页界面无论如何都会换行，因此你需要使用真正的 IMAP 客户端）。\n\n## 注意事项\n\n确保你的邮件程序发送的邮件符合你所属项目的标准仍然是你的责任。许多项目不希望附加补丁。某些邮件代理会转换补丁（例如，换行、以\
  \ format=flowed 格式发送），导致补丁失效。如果你不检查这一点，将会收到嘲讽你的“怒火”。\n\nThunderbird 特别被认为存在问题。Thunderbird\
  \ 用户可能希望访问此网页获取更多信息：m[]\n\n## 参见\n\n(1), (1), (5)\n\n***\n\n# GIT-INDEX-PACK\n\n\
  ## 名称\n\n`git-index-pack` - 为现有的压缩存档构建包索引文件\n\n## 摘要\n\n`git index-pack` [-v] [-o\
  \ <index-file>] <pack-file>` `git index-pack` `--stdin [--fix-thin] [--keep] [-v]\
  \ [-o <index-file>] [<pack-file>]`\n\n## \n\n从指定文件读取压缩存档（`.pack`），并为其构建包索引文件（`.idx`）。压缩存档与包索引可以放在\
  \ Git 仓库的 `objects/pack/` 目录下。\n\n### 选项\n\n`-v`\n\n详细输出运行过程，包括进度状态。\n\n`-o <index-file>`\n\
  \n将生成的包索引写入指定的文件。如果没有此选项，将通过将压缩存档文件的 `.pack` 替换为 `.idx` 来构造包索引文件名（如果压缩存档文件名不以 `.pack`\
  \ 结尾，程序将失败）。\n\n`--stdin`\n\n当提供此标志时，将从 stdin 读取包，然后将其复制到 `<pack-file>`。如果未指定 `<pack-file>`，包将写入当前\
  \ Git 仓库的 `objects/pack/` 目录，默认名称由包内容决定。如果未指定 `<pack-file>`，考虑使用 `--keep` 以防止此进程与\
  \ `git repack` 之间发生竞态条件。\n\n`--fix-thin`\n\n通过向包中添加增量对象所基于的排除对象，修复由 `git pack-objects\
  \ --thin` 产生的“稀”包（详见 (1)）。此选项仅在与 `--stdin` 配合时才有意义。\n\n`--keep`\n\n在将索引移动到最终位置之前，为关联包文件创建一个空的\
  \ `.keep` 文件。此选项通常与 `--stdin` 一使用，以防止同时进行的 `git repack` 进程在引用更新以使用包包含的对象之前删除新构建的包和索引。\n\
  \n`--keep=<msg>`\n\n类似于 `--keep`，在将索引移动到最终位置之前创建一个 `.keep` 文件，但不是创建一个空文件，而是在 `.keep`\
  \ 文件中写入 `<msg>` 后跟一个 LF。以后可以在所有 `.keep` 文件中搜索 `<msg>` 消息，以定位任何已失效的文件。\n\n`--index-version=<version>[,<offset>]`\n\
  \n此项仅供测试套件使用。它允许强制生成的包索引版本，并强制对位于给定偏移量之上的对象使用 64 位索引项。\n\n`--strict`\n\n如果包包含损坏的对象或链接，则退出。\n\
  \n`--check-self-contained-and-connected`\n\n如果包包含损坏的链接，则退出。仅供内部使用。\n\n`--threads=<n>`\n\
  \n指定解析增量时启动的线程数。这要求 `index-pack` 编译时启用了 `pthreads`，否则该选项将被忽略并警告。这旨在减少多处理器机器上的打包时间。然而，增量搜索窗口所需的内存是线程数的倍数。指定\
  \ 0 将导致 Git 自动检测 CPU 数量并使用最多 3 个线程。\n\n## 注意\n\n一旦创建了索引，对象列表将进行排序，并将列表的 SHA-1 哈希值打印到标准输出。如果使用了\
  \ `--stdin`，则前缀为 \"pack\\t\"，或者如果成功创建了新的 `.keep` 文件，则是 \"keep\\t\"。这对于移除作为锁 `.keep`\
  \ 文件以防止上述与 `git repack` 的竞态有用。\n\n***\n\n# GIT-INIT-DB\n\n## 名称\n\n`git-init-db`\
  \ - 创建一个新的 Git 仓库\n\n## 摘要\n\n`git init-db` [-q | --quiet] [--bare] [--template=<template_directory>]\
  \ [--separate-git-dir <git dir>] [--shared[=<permissions>]]`\n\n## 描述\n\n这是 (1)\
  \ 的同义词。请参考该命令的文档。\n\n***\n\n# GIT-INIT\n\n## 名称\n\n`git-init` - 创建一个空的 Git 仓库或重新初始化现有仓库\n\
  \n## 摘要\n\n`git init` [-q | --quiet] [--bare] [--template=<template_directory>]\
  \ [--separate-git-dir <git dir>] [--shared[=<permissions>]] [directory]`\n\n## 描述\n\
  \n此命令创建一个空的 Git 仓库——基本上是一个 `.git` 目录，其中包含 objects、refs/heads、refs/tags 和模板文件。还会创建一个引用\
  \ master 分支的 HEAD 文件。\n\n如果设置了 `$GIT_DIR` 环境变量，则它指定了替代 `/.git` 的仓库路径。\n\n如果通过 `$OBJECT_DIRECTORY`\
  \ 环境变量指定了对象存储目录，则会在其下创建 sha1 目录，否则使用默认 `$GIT_DIR/objects` 目录。\n\n在现有仓库运行 `git init`\
  \ 是安全的。它不会覆盖已存在的内容。重新运行 `git init` 的主要原因是获取新添加的模板（如果给了 `--separate-git-dir`，则是移动仓库到其他地方）。\n\
  \n### 选项\n\n`-q, --quiet`\n\n仅打印错误和警告消息；将抑制其他输出。\n\n`--bare`\n\n创建一个裸仓库。如果未设置 `GIT_DIR`\
  \ 环境变量，则将其设置为当前工作目录。\n\n`--template=<template_directory>`\n\n指定从哪个目录使用模板。（参见下文的“模板目录”部分。）\n\
  \n`--separate-git-dir=<git dir>`\n\n不再将仓库初始化为 `$GIT_DIR` 或 `/.git/` ，而是在此创建一个包含实际仓库路径的文本文件。该文件作为仓库的文件系统无关\
  \ Git 符号链接。\n\n如果是重新初始化，仓库将移动到指定的路径。\n\n`--shared[=(false|true|umask|group|all|world|everybody|0xxx)]`\n\
  \n指定 Git 仓库供多个用户共享。这允许属于同一组的用户向该仓库推送内容。当指定此项时，将设置配置变量 `core.sharedRepository`，以便\
  \ `$GIT_DIR` 下的文件和目录按照请求的权限创建。当未指定时，Git 将使用 (2) 提供的权限。\n\n该选项可以具有以下值，如果没有给出值则默认为\
  \ `group`：\n\n`umask` (或 `false`)\n\n使用 (2) 提供的权限。未指定 `--shared` 时的默认值。\n\n`group`\
  \ (或 `true`)\n\n\n\n\n将仓库设为组可写（并设置 g+sx，因为 git 组可能不是所有用户的主组）。这被用于放宽原本安全的 (2) 值的权限。注意，umask\
  \ 仍然适用于其他权限位（例如，如果 umask 为 `0022`，使用 `group` 将不会移除其他（非组）用户的读取权限）。请参阅 `0xxx` 了解如何精确指定仓库权限。\n\
  \n`all`（或 `world` 或 `everybody`）\n\n与 `group` 相同，但允许所有用户读取仓库。\n\n`0xxx`\n\n`0xxx`\
  \ 是一个八进制数字，每个文件都将具有模式 `0xxx`。`0xxx` 将覆盖用户的 (2) 值（而不仅仅像 `group` 和 `all` 那样仅放宽权限）。`0640`\
  \ 将创建一个组可读、但组不可写且其他人不可访问的仓库。`0660` 将创建一个当前用户和组可读可写，但其他人不可访问的仓库。\n\n默认情况下，共享仓库中启用了配置标志\
  \ `receive.denyNonFastForwards`，因此你无法强制将非快进推送推入。\n\n如果你提供了一个 `directory`，命令将在其内部运行。如果该目录不存在，将创建它。\n\
  \n## 模板目录 (TEMPLATE DIRECTORY)\n\n模板目录包含在创建后将复制到 `$GIT_DIR` 的文件和目录。\n\n模板目录将是以下之一（按顺序排列）：\n\
  \n1. 使用 `--template` 选项提供的参数；\n2. 环境变量 `$GIT_TEMPLATE_DIR` 的内容；\n3. 配置变量 `init.templateDir`；或\n\
  4. 默认模板目录：`/usr/share/git-core/templates`。\n\n默认模板目录某些目录结构、建议的“排除模式”（参见 (5)）以及示例的钩子文件（参见\
  \ (5)）。\n\n## 示例 (EXAMPLES)\n\n为现有代码库启动一个新的 Git 仓库\n\n```\n$ cd /path/to/my/codebase\
  \ $ git init (1) $ git add . (2) $ git commit (3)\n```\n\n**1.** 创建一个 `/path/to/my/codebase/.git`\
  \ 目录。\n**2.** 将所有现有文件添加到索引。\n**3.** 将原始状态记录为历史中的第一次提交。\n\n***\n\n# GIT-INSTAWEB\n\
  \n## 名称 (NAME)\n\n`git-instaweb` - 在 gitweb 中立即浏览你的工作仓库\n\n## 摘要 (SYNOPSIS)\n\n\
  `git instaweb [--local] [--httpd=<httpd>] [--port=<port>] [--browser=<browser>]`\n\
  `git instaweb [--start] [--stop] [--restart]`\n\n## 描述 (DESCRIPTION)\n\n用于设置 gitweb\
  \ 和用于浏览本地仓库的网络服务器简单脚本。\n\n## 选项 (OPTIONS)\n\n- `-l, --local`\n  仅将服务器绑定到本地 IP (127.0.0.1)。\n\
  - `-d, --httpd`\n  将执行的 HTTP 守护进程命令行。可以在此处指定命令行选项，配置文件将被添加到命令行末尾。目前支持 apache2, lighttpd,\
  \ mongoose, plackup 和 webrick。（默认：lighttpd）\n- `-m, --module-path`\n  模块路径（仅当 httpd\
  \ 为 Apache 时需要）。默认：`/usr/lib/apache2/modules`）\n- `-p, --port`\n  绑定到 httpd 的端口号。（默认：1234）\n\
  - `-b, --browser`\n  用于查看 gitweb 页面的网页浏览器。这将与 gitweb 实例的 URL 一起传递给 `git web--browse`\
  \ 辅助脚本。更多信息请参见 (1)。如果脚本失败，URL 将打印到 stdout。\n- `start, --start`\n  启动 httpd 实例并退出。根据需要重新生成启动新实例配置文件。\n\
  - `stop, --stop`\n  停止 httpd 实例并退出。这不会生成启动新实例的任何配置文件，也不会关闭浏览器。\n- `restart, --restart`\n\
  \  重启 httpd 实例并退出。根据需要重新生成启动新实例配置文件。\n\n## 配置 (CONFIGURATION)\n\n你可以在 `.git/config`\
  \ 中指定配置：\n\n```\n[instaweb] local = true httpd = apache2 -f port = 4321 browser\
  \ = konqueror modulePath = /usr/lib/apache2/modules\n```\n\n如果未设置配置变量 `instaweb.browser`，如果定义了\
  \ `web.browser` 则将使用它。更多信息请参见 (1)。\n\n## 参见 (SEE ALSO)\n\n(1)\n\n***\n\n# GIT-INTERPRET-TRAILERS\n\
  \n## 名称 (NAME)\n\n`git-interpret-trailers` -帮助向提交消息中添加结构化信息\n\n## 摘要 (SYNOPSIS)\n\
  \n`git interpret-trailers [--trim-empty] [(--trailer <token>[(=|:)<value>])...]\
  \ [<file>...]`\n\n## 描述 (DESCRIPTION)\n\n帮助在提交消息的自由格式部分末尾添加类似于 RFC 822 电子邮件头的 `trailers`\
  \ 行。\n\n此命令从 `<file>` 参数或在未指定 `<file>` 的情况下从标准输入读取某些补丁或提交消息。然后，此命令将使用 `--trailer`\
  \ 选项传递的参数（如果有）应用到每个输入文件的消息部分。结果输出到标准输出。\n\n某些配置变量控制 `--trailer` 参数应用到每个提交消息的方式，以及提交消息中现有\
  \ trailer 的更改方式。它们还使得自动添加某些 trailer 可能。\n\n默认情况下，使用 `--trailer` 提供的 `<token>=<value>`\
  \ 或 `<token>:<value>` 参数只有在最后一个 trailer 具有不同的 (`<token>`, `<value>`) 对（或者不存在现有 trailer）时，才会添加到现有\
  \ trailer 之后。`<token>` 和 `<value>` 部分将被修剪以移除开头和结尾的空格，修剪后的 `<token>` 和 `<value>`\
  \ 将如下所示消息中：\n\n```\ntoken: value\n```\n\n这意味着修剪后的 `<token>` 和 `<value>` 将由 `: `（一个冒号和一个空格）分隔。\n\
  \n默认情况下，新 trailer 将出现在所有现有 trailer 的末尾。如果没有现有 trailer，新 trailer 将出现在输出的提交消息部分之后；如果消息部分末尾没有只有空格的行，则会在新\
  \ trailer 之前添加一个空行。\n\n现有的 trailer 通过在输入消息中查找一组一个或多个包含冒号（默认值）的行来提取，该组之前应有一个或多个空行（或仅包含空格的行）。三个减号开始消息的后续部分。读取\
  \ trailer 时，token、分隔符和 value 之间存在空格。token 和 value 内部也可以有空格。\n\n注意，`trailers` 不遵循也不打算遵循\
  \ RFC822 头的许多规则。例如，它们不遵循折叠规则、编码规则以及许多其他规则。\n\n## 选项 (OPTIONS)\n\n- `--trim-empty`\n\
  \  如果任何 trailer 的 `<value>` 部分仅包含空格，则从结果消息中删除整个 trailer。这适用于现有的 trailer 和新的 trailer。\n\
  - `--trailer <token>[(=|:)<value>`\n  指定作为 trailer 应用到输入消息的 (`<token>`, `<value>`)\
  \ 对。参见命令描述。\n\n## 配置变量 (CONFIGURATION VARIABLES)\n\n### trailer.separators\n\n此选项告知哪些字符被识别为\
  \ trailer 分隔符。默认情况下，只有 `:` 被识别为 trailer 分隔符，为了兼容其他 git 命令，命令行上始终接受 `=`。\n\n此选项提供的第一个字符将作为在\
  \ trailer 配置未指定其他分隔符时的默认分隔符。\n\n例如，如果此选项的值为 `%=$`，则只有包含 `%`、`=` 或 `$` 的行会被视为 trailer。并且\
  \ `%` 将是默认分隔符，因此默认情况下 trailer 显示为：`<token>% <value>`（token 和 value 之间将有一个百分号和一个空格）。\n\
  \n### trailer.where\n\n此选项告知在何添加新 trailer。可以是 `end`（默认值）、`start`、`after` 或 `before`。\n\
  \n如果是 `end`，则每个新 trailer 将出现在现有 trailer 的末尾。\n\n\n\n如果设置为 `start`，则每个新的 trailer（脚注）将出现在现有\
  \ trailer 的开头，而不是末尾。\n\n如果设置为 `after`，则每个新的 trailer 将紧跟最后一个具有相同 `<token>` 的 trailer\
  \ 之后。\n\n如果设置为 `before`，则每个新的 trailer 将紧跟第一个具有相同 `<token>` 的 trailer 之前。\n\n###\
  \ `trailer.ifexists`\n\n此选项允许选择当消息中已经存在至少一个具有相同 `<token>` 的 trailer 时执行什么操作。\n\n\
  该选项的有效值为：`addIfDifferentNeighbor`（默认值）、`addIfDifferent`、`add`、`overwrite` 或 `doNothing`。\n\
  \n使用 `addIfDifferentNeighbor` 时，只有在添加新 trailer 的行上方或下方没有相同 (`<token>`, `<value>`)\
  \ 值对的 trailer 时，才会添加新 trailer。\n\n使用 `addIfDifferent` 时，只有在消息中没有具有相同 (`<token>`,\
  \ `<value>`) 值对的 trailer 时，才会添加新 trailer。\n\n使用 `add` 时，即使消息中已经存在相同 (`<token>`,\
  \ `<value>`) 值对的 trailer，也会添加新 trailer。\n\n使用 `replace` 时，将删除现有的相同 `<token>` 的 trailer\
  \ 并添加新 trailer。被删除的 trailer 是距离新 trailer 添加位置最近的那个。\n\n使用 `doNothing` 时，如果消息中已经存在相同\
  \ `<token>` 的 trailer，则不进行任何操作。\n\n### `trailer.ifmissing`\n\n此选项允许选择当消息中尚无相同 `<token>`\
  \ 的 trailer 时执行什么操作。\n\n该选项的有效值为：`add`（默认值）和 `doNothing`。\n\n使用 `add` 时，将添加新 trailer。\n\
  \n使用 `doNothing` 时，不进行任何操作。\n\n### `trailer.<token>.key`\n\n在 trailer 中，此键将代替 `<token>`。在此键的末尾可以出现一个分隔符，然后是一些字符。默认情况下，有效分隔符是\
  \ `:`，但可以通过 `trailer.separators` 配置变量进行更改。\n\n如果存在分隔符，在添加 trailer 时，此键将同时代替 `<token>`\
  \ 和默认分隔符。\n\n### `trailer.<token>.where`\n\n此选项的值与 `trailer.where` 配置变量相同，并且对于具有指定\
  \ `<token>` 的 trailer，它将覆盖该选项指定的值。\n\n### `trailer.<token>.ifexist`\n\n此选项的值与 `trailer.ifexist`\
  \ 配置变量相同，并且对于具有指定 `<token>` 的 trailer，它将覆盖该选项指定的值。\n\n### `trailer.<token>.ifmissing`\n\
  \n此选项的值与 `trailer.ifmissing` 配置变量相同，并且对于具有指定 `<token>` 的 trailer，它将覆盖该选项指定的值。\n\n\
  ### `trailer.<token>.command`\n\n此选项用于指定一个 shell 命令，自动添加或修改指定 `<token>` 的 trailer。指定此选项时，行为类似于在命令行开头添加了一个特殊的\
  \ `<token>=<value>` 参数，其中 `<value>` 取自指定命令的标准输出，并去除了前后的空格。\n\n如果命令包含 `$ARG` 字符串，在启动命令之前，如果存在相同\
  \ `<token>` 的 trailer，该字符串将被该 trailer 的 `<value>` 部分替换。\n\n如果在命令行上传递了多个 `<token>=<value>`\
  \ 参数且配置了 `trailer.<token>.command`，则会为这些参数每一个执行一次命令。参数的 `<value>` 部分（如果有）将用于替换命令中的\
  \ `$ARG` 字符串。\n\n## 示例\n\n配置带有 `Signed-off-by` 键的 `sign` trailer，然后在消息中添加两个此类 trailer：\n\
  \n```\n$ git config trailer.sign.key \"Signed-off-by\" $ cat msg.txt subject message\
  \ $ cat msg.txt | git interpret-trailers --trailer 'sign: Alice <>' --trailer 'sign:\
  \ Bob <>' subject message Signed-off-by: Alice <> Signed-off-by: Bob <>\n```\n\n\
  将最后一个提交提取为补丁，并为其添加 `Cc` 和 `Reviewed-by` trailer：\n\n```\n$ git format-patch -1 0001-foo.patch\
  \ $ git interpret-trailers --trailer 'Cc: Alice <>' --trailer 'Reviewed-by: Bob\
  \ <>' 0001-foo.patch >0001-bar.patch\n```\n\n配置带有命令的 `sign` trailer，仅在没有 `Signed-off-by:`\
  \ 时自动添加带有作者信息的 `Signed-off-by:`，并展示其工作原理：\n\n```\n$ git config trailer.sign.key\
  \ \"Signed-off-by: \" $ git config trailer.sign.ifmissing add $ git config trailer.sign.ifexists\
  \ doNothing $ git config trailer.sign.command 'echo \"$(git config user.name) <$(git\
  \ config user.email)>\"' $ git interpret-trailers <<EOF > EOF Signed-off-by: Bob\
  \ <> $ git interpret-trailers <<EOF > Signed-off-by: Alice <> > EOF Signed-off-by:\
  \ Alice <>\n```\n\n配置键包含 `#` 且字符后没有空格的 `fix` trailer，并展示其工作原理：\n\n```\n$ git config\
  \ trailer.separators \":#\" $ git config trailer.fix.key \"Fix #\" $ echo \"subject\"\
  \ | git interpret-trailers --trailer fix=42 subject Fix #42\n```\n\n配置带有命令的 `see`\
  \ trailer 以显示相关提交的主题，并展示其工作原理：\n\n```\n$ git config trailer.see.key \"See-also:\
  \ \" $ git config trailer.see.ifExists \"replace\" $ git config trailer.see.ifMissing\
  \ \"doNothing\" $ git config trailer.see.command \"git log -1 --oneline --format=\\\
  \"%h (%s)\\\" --abbrev-commit --abbrev=14 \\$ARG\" $ git interpret-trailers <<EOF\
  \ > subject > > message > > see: HEAD~2 > EOF subject message See-also: fe3187489d69c4\
  \ (subject of related commit)\n```\n\n\n\n\n`-L <start>,<end>:<file>, -L :<funcname>:<file>`\n\
  \n在 `<file>` 中追踪由 `\"<start>,<end>\"`（或函数名正则 `<funcname>`）给定的行范围演变。你不能提供任何路径规格限制器（pathspec\
  \ limiters）。目前这仅限于从单个修订开始的遍历，即你只能提供零或一个正向修订参数。你可以多次指定此选项。\n\n`<start>` 和 `<end>`\
  \ 可以采用以下形式之一：\n\nnumber\n如果 `<start>` 或 `<end>` 是数字，它将指定一个绝对行号（行从 1 开始计数）。\n\n`/regex/`\n\
  这种形式将使用匹配给定 POSIX 正则的第一行。如果 `<start>` 是正则表达式，它将从上一个 `-L` 范围（如果有）的结尾开始搜索，否则从文件开始开始。如果\
  \ `<start>` 为 `^/regex/`，它将从文件开始搜索。如果 `<end>` 是正则表达式，它将从 `<start>` 指定的行开始搜索。\n\n\
  `+offset` 或 `-offset`\n这仅对 `<end>` 有效，并将指定 `<start>` 指定行之前或之后的行数。\n\n如果在 `<start>`\
  \ 和 `<end>` 处给出 `\":<funcname>\"`，它是一个正则表达式，表示从第一个匹配 `<funcname>` 的 `funcname` 行到下一个\
  \ `funcname` 行的范围。`\":<funcname>\"` 从上一个 `-L` 范围（如果有）的结尾搜索，否则从文件开始。`\"^:<funcname>\"\
  ` 从文件开始搜索。\n\n`<revision range>`\n仅显示指定修订范围内的提交。未指定 `<revision range>` 时默认为 `HEAD`（即通往当前提交的完整历史）。`origin..HEAD`\
  \ 指定从当前提交（即 `HEAD`）可达的所有提交，但从 `origin` 不可达。关于指定 `<revision range>` 方式的完整列表，请参阅 (7)\
  \ 中的 *Specifying Ranges* 部分。\n\n`[--] <path>...`\n仅显示足以解释匹配指定路径的文件如何产生的提交。详情请参见下文的\
  \ *History Simplification* 以及其他简化模式。\n当出现歧义时，路径可能需要加上 `'-- '` 前缀，以将其与选项或修订范围隔开。\n\
  \n### Commit Limiting\n\n除了使用描述中解释的特殊符号指定应列出的提交范围外，还可能应用额外的提交限制。\n\n除非另有说明，否则使用更多选项通常会进一步限制输出（例如，`--since=<date1>`\
  \ 限制为`<date1>` 之后的提交，配合 `--grep=<pattern>` 使用时进一步限制为日志消息中匹配 `<pattern>` 行的提交）。\n\
  \n注意，这些限制是在提交排序和格式选项（如 `--reverse`）之前应用的。\n\n`-number>, -n <number>, --max-count=<number>`\n\
  限制输出的提交数量。\n\n`--skip=<number>`\n在开始显示提交输出之前跳过 `<number>` 个提交。\n\n`--since=<date>,\
  \ --after=<date>`\n显示比特定日期更新的提交。\n\n`--until=<date>, --before=<date>`\n显示比特定日期更老的提交。\n\
  \n`--author=<pattern>, --committer=<pattern>`\n将提交输出限制为作者/提交者头部行匹配指定模式（正则表达式）的提交。如果有多个\
  \ `--author=<pattern>`，则选择作者匹配任何给定模式的提交（多个 `--committer=<pattern>` 亦然）。\n\n`--grep-reflog=<pattern>`\n\
  将提交输出限制为 reflog 条目匹配指定模式（正则表达式）的提交。如果有多个 `--grep-reflog`，则选择 reflog 消息匹配任何给定模式的提交。除非使用了\
  \ `--walk-reflogs`，否则使用此选项被视为错误。\n\n`--grep=<pattern>`\n将提交输出限制为日志消息匹配指定模式（正则表达式）的提交。如果有多个\
  \ `--grep=<pattern>`，则选择消息匹配任何给定模式的提交（但请参见 `--all-match`）。\n当 `--show-notes` 生效时，注释中的消息将作为视为日志消息的一部分进行匹配。\n\
  \n`--all-match`\n将提交输出限制为匹配所有给定 `--grep` 的提交，而不是匹配至少一个的。\n\n`--invert-grep`\n将提交输出限制为日志消息不匹配\
  \ `--grep=<pattern>` 指定模式的提交。\n\n`-i, --regexp-ignore-case`\n在不区分字母大小的情况下匹配正则表达式限制模式。\n\
  \n`--basic-regexp`\n将限制模式视为基本正则表达式；这是默认值。\n\n`-E, --extended-regexp`\n将限制模式视为扩展正则表达式而非默认的基本正则表达式。\n\
  \n`-F, --fixed-strings`\n将限制模式视为固定字符串（不将模式解释为正则表达式）。\n\n`--perl-regexp`\n将限制模式视为\
  \ Perl 兼容正则表达式。需要编译时包含 libpcre。\n\n`--remove-empty`\n当给定路径从树中消失时停止。\n\n`--merges`\n\
  仅打印合并提交。这等同于 `--min-parents=2`。\n\n`--no-merges`\n不打印有多个父提交的提交。这等同于 `--max-parents=1`。\n\
  \n`--min-parents=<number>, --max-parents=<number>, --no-min-parents, --no-max-parents`\n\
  仅显示至少（或最多）数量父提交的提交。特别是，`--max-parents=1` 等同于 `--no-merges`，`--min-parents=2` 等同于\
  \ `--merges`。`--max-parents=0` 提供所有根提交，`--min-parents=3` 所有章鱼合并（octopus merges）。\n\
  `--no-min-parents` 和 `--no-max-parents` 重置这些限制（无限制）。等效形式为 `--min-parents=0`（任何提交都有\
  \ 0 或多个父提交）和 `--max-parents=-1`（负数表示无上限限制）。\n\n`--first-parent`\n在遇到合并提交时仅追踪第一个父提交。在查看特定主题分支的演变时，此选项可以提供更好的概述，因为合并到主题分支的合并通常是为了偶尔适应更新的上游，而此选项允许你忽略由此类合并引入历史历史的单个提交。不能与\
  \ `--bisect` 结合使用。\n\n`--not`\n反转后续所有修订规格符 `^*` 前缀（或其缺失）的含义，直到下一个 `--not`。\n\n`--all`\n\
  假装 `refs/` 下所有的引用都作为 `<commit>` 列在命令行上。\n\n`--branches[=<pattern>]`\n假装 `refs/heads`\
  \ 下所有的引用都作为 `<commit>` 列在命令行上。如果给了 `<pattern>`，则将分支限制为匹配给定 shell 通配符（shell glob）的分支。如果模式结尾缺少\
  \ `?`、`***` 或 `[*]`，则隐含 `*/**`。\n\n`--tags[=<pattern>]`\n假装 `refs/tags` 下所有的引用都作为\
  \ `<commit>` 列在命令行上。如果给了 `<pattern>`，则将标签限制为匹配给定 shell 通配符的标签。如果模式结尾缺少 `?`、`***`\
  \ 或 `[*]`，则隐含 `*/**`。\n\n`--remotes[=<pattern>]`\n假装 `refs/remotes` 下所有的引用都作为 `<commit>`\
  \ 列在命令行上。如果给了 `<pattern>`，则将远程跟踪分支限制为匹配给定 shell 通配符的引用。如果模式结尾缺少 `?`、`***` 或 `[*]`，则隐含\
  \ `*/**`。\n\n`--glob=<glob-pattern>`\n假装所有匹配 shell 通配符 `<glob-pattern>` 的引用都作为 `<commit>`\
  \ 列在命令行上。如果缺少 `refs/*`，则自动添加。如果模式结尾缺少 `?`、`***` 或 `[*]`，则隐含 `*/**`。\n\n`--exclude=<glob-pattern>`\n\
  对于下一个 `--all`、`--branches`、`--tags`、`--remotes` 或 `--glob` 将会考虑的匹配 `<glob-pattern>`\
  \ 的引用。重复此选项会累积排除模式，直到下一个 `--all`、`--branches`、`--tags`、`--remotes` 或 `--glob` 选项（其他选项或参数不会清除累积模式）。\n\
  应用于 `--branches`、`--tags` 或 `--remotes` 时，给出的模式不应以 `refs/heads`、`refs/tags` 或 `refs/remotes`\
  \ 开头；应用于 `--glob` 或 `--all` 时，必须以 `refs/` 开头。如果想要 `*/**`，必须显式给出。\n\n`--reflog`\n\
  假装所有由 reflog 提到的对象都作为 `<commit>` 列在命令行上。\n\n`--ignore-missing`\n\n\n\n\n在输入中看到无效的句名时，假装该错误输入不存在。\n\
  \n### --bisect\n\n假装错误的二分引用 `refs/bisect/bad` 已列出，并且假装在命令行上它紧随其后的 `--not` 以及良好的二分引用\
  \ `refs/bisect/good-*`。不能与 `--first-parent` 结合使用。\n\n### --stdin\n\n除了命令行上列出的 `<commit>`\
  \ 之外，还从标准输入读取它们。如果看到 `--*` 分隔符，则停止读取提交并开始读取路径以限制结果。\n\n### --cherry-mark\n\n类似于\
  \ `--cherry-pick`（见下文），但等价提交会被用 `=` 标记而不是省略，不等价的提交则会被用 `+` 标记不等价的提交。\n\n### --cherry-pick\n\
  \n当提交集通过对称差异限制时，省略任何与“另一侧”提交引入了相同更改的提交。\n\n例如，如果你有两个分支 `A` 和 `B`，列出它们单侧所有提交的常用方法是使用\
  \ `--left-right`（见下文 `--left-right` 选项说明中的示例）。然而，它会显示从另一个分支 cherry-pick 的提交（例如，“3rd\
  \ on b”可能从分支 `A` cherry-pick 来自）。使用此选项，此类提交对将排除在输出之外。\n\n### --left-only, --right-only\n\
  \n仅列出对称范围内相应侧的提交，即仅那些被 `--left-right` 标记为 `< resp. >` 的提交。\n\n例如，`--cherry-pick\
  \ --right-only A...B` 会省略 `B` 中位于 `A` 中或与 `A` 中的提交等效的提交。换句话说，这列出了 `git cherry A\
  \ B` 中的 `+` 提交。更准确地说，`--cherry-pick --right-only --no-merges` 给出了精确列表。\n\n### --cherry\n\
  \n`--right-only --cherry-mark --no-merges` 的同义词；用于限制输出在我们侧的提交，并标记那些已应用到分支历史另一侧的提交，类似于\
  \ `git log --cherry upstream...mybranch`，类似于 `git cherry upstream mybranch`。\n\n\
  ### -g, --walk-reflogs\n\n不再遍历提交祖先链，而是从最近的一个到较旧的遍历 reflog way。使用此选项时，你无法指定要排除的提交（即不能使用\
  \ `^commit`、`commit1..commit2` 和 `commit1...commit2` 表示法）。\n\n使用 `oneline` 以外的 `--pretty`\
  \ 格式（出于明显原因），会导致输出包含两行额外的 reflog 信息。默认情况下，输出中使用 `commit@{Nth}` 标记。当起始提交指定为 `commit@{now}`\
  \ 时，输出也会使用 `commit@{timestamp}` 标记。在 `--pretty=oneline` 下，提交消息在同一行中带有这些信息的标记。此选项不能与\
  \ `--reverse` 结合使用。另见 (1)。\n\n### --merge\n\n合并失败后，显示触及冲突文件且在所有合并头中都不存在的引用。\n\n\
  ### --boundary\n\n输出被排除的边界提交。边界提交以 `-` 为前缀。\n\n## 历史简化\n\n有时你只对历史的部分感兴趣，例如修改特定 `<path>`\
  \ 的提交。但历史简化分为两部分：一部分是选择提交，另一部分是如何执行，因为有多种简化历史的策略。\n\n以下选项选择要显示的提交：\n\n### <paths>\n\
  \n选择修改给定 `<paths>` 的提交。\n\n### --simplify-by-decoration\n\n选择被某些分支或标签引用的提交。\n\n\
  注意，可以显示额外的提交以提供有意义的历史。\n\n以下选项影响简化的执行方式：\n\n### 默认模式\n\n将历史简化为解释树最终状态的最简单历史。之所以简单，是因为如果结果相同（例如合并内容相同的分支），它会修剪某些侧分支。\n\
  \n### --full-history\n\n与默认模式相同，但不会修剪某些历史。\n\n### --dense\n\n仅显示所选的提交，加上一些为了保持历史意义的提交。\n\
  \n### --sparse\n\n显示简化历史中的所有提交。\n\n### --simplify-merges\n\n`--full-history` 的附加选项，用于从结果历史中移除某些不必要的合并，因为没有选定的提交贡献于此合并。\n\
  \n### --ancestry-path\n\n当给定的显示的提交范围（例如 `commit1..commit2` 或 `commit2 ^commit1`）时，仅显示直接存在\
  \ `commit1` 和 `commit2` 之间祖先链上的提交，即既是 `commit1` 的后代又是 `commit2` 的祖先的提交。\n\n后续有更详细的解释。\n\
  \n假设你指定了 `foo` 为 `<paths>`。我们将修改 `foo` 的提交称为 `!TREESAME`，其余称为 `TREESAME`。（在针对 `foo`\
  \ 过滤的 diff 中，它们看起来是不同且相等的。）\n\n在下文中，我们将始终引用同一个示例历史来说明简化设置之间的差异。我们假设你正在此提交图中过滤文件\
  \ `foo`：\n\n```\n.-A---M---N---O---P---Q / / / / / / I B C D E Y \\ / / / / / `-------------'\
  \ X`\n```\n\n历史的水平线 `A---Q` 被视为每次合并的第一个父。提交如下：\n\n`I` 是初始提交，其中 `foo` 存在。默认，输出中使用\
  \ `commit@{Nth}` 标记。当起始提交指定为 `commit@{now}` 时，输出也会使用 `commit@{timestamp}` 标记。在 `--pretty=oneline`\
  \ 下，提交消息在同一行中带有这些信息的标记。此选项不能与 `--reverse` 结合使用。\n\n（注：此处原文文本似乎出现了重复或逻辑中断，根据高级文档工程师的规范，仅翻译提供的文本内容。）\n\
  \n\n\n\n与不重写父提交的 `--full-history` 相比，请注意 E 被剪除了，因为它是 `TREESAME`，但 P 的父提交列表被重写了，包含了\
  \ E 的父提交 I。C 和 N，以及 X、Y 和 Q 也发生了相同的情况。\n\n除了上述设置外，你还可以更改 `TREESAME` 是否影响包含范围：\n\n\
  `--dense`\n\n如果被遍历的提交与任何父提交相比不是 `TREESAME`，则它们会被包含。\n\n`--sparse`\n\n所有被遍历的提交都会被包含。\n\
  \n注意，即使没有 `--full-history`，这仍然简化了合并：如果其中一个父提交是 `TREESAME`，则我们只追踪那一个，因此合并的其他分支永远不会被遍历。\n\
  \n`--simplify-merges`\n\n首先，以与重写父提交的 `--full-history` 相同的方式构建历史图谱（见上文）。\n\n然后，根据以下规则将每个提交\
  \ `C` 简化为在最终历史中的替换项 `C'`：\n\n1. 将 `C'` 设置为 `C`。\n2. 将 `C'` 的每个父提交 `P` 替换为其简化后的 `P'`。在此过程中，丢弃其他父提交的祖先或者是与空树\
  \ `TREESAME` 的根提交，并移除重复项，但注意不要丢弃所有我们 `TREESAME` 的父提交。\n3. 如果在这次父提交重写后，`C'` 是根提交或合并提交（具有\
  \ 0 个或>1 个父提交）、边界提交或 `!TREESAME`，则保留它。否则，它被替换为它的唯一父提交。\n\n这种效果通过与重写父提交的 `--full-history`\
  \ 比较表现得最好。示例变为：\n\n```\n.-A---M---N---O / / / I B D \\ / / `---------'\n```\n\n\
  注意与 `--full-history` 相比，N、P 和 Q 的主要区别：\n\n- `N` 的父提交列表删除了 `I`，因为它是另一个父提交 `M` 的祖先。尽管如此，`N`\
  \ 留了下来，因为它是 `!TREESAME`。\n- `P'` 的父提交列表同样删除了 `I`。随后 `P` 被完全删除，因为它有一个父提交且是 `TREESAME`。\n\
  - `Q` 的父提交列表将 `Y` 简化为 `X`。随后 `X` 被删除，因为它是一个 `TREESAME` 根提交。随后 `Q` 也被完全删除，因为它有一个父提交且是\
  \ `TREESAME`。\n\n最后，还有第五种简化模式可用：\n\n`--ancestry-path`\n\n将显示的提交限制在给定提交范围内，“从”提交和“到”提交之间祖先链上的提交。即：只显示是“到”提交的祖先且“从”提交的后代的提交。\n\
  \n作为一个示例用例，请考虑以下提交历史：\n\n```\nD---E-------F / \\ \\ B---C---G---H---I---J / \\ A-------K---------------L--M\n\
  ```\n\n普通的 `D..M` 计算 `M` 的祖先提交集合，但排除了 `D` 的祖先提交。这对于查看自 `D` 以来通往 `M` 的历史发生了什么很有用，即“`M`\
  \ 拥有哪些 `D` 中不存在的内容”。在本示例中的结果将是所有提交，除了 `A` 和 `B`（当然还有 `D` 本身）。\n\n然而，当我们想要找出 `M`\
  \ 中哪些提交被 `D` 引入的漏洞污染并需要修复时，可能只想查看 `D..M` 中实际上是 `D` 的后代的子集，即排除 `C` 和 `K`。这正是 `--ancestry-path`\
  \ 选项的作用。应用于 `D..M` 范围时，结果为：\n\n```\nE-------F \\ \\ G---H---I---J \\ L--M\n```\n\
  \n`--simplify-by-decoration` 选项允许通过省略未被标签引用的提交来只查看历史拓扑的大体。如果满足 (1) 它们被标签引用，或 (2)\
  \ 它们更改了命令行给出路径的内容，则提交被标记为 `!TREESAME`（换说，在上述历史简化规则后保留）。所有其他提交都被标记为 `TREESAME`（将被简化移除）。\n\
  \n### 提交排序\n\n默认情况下，提交按时间倒序顺序显示。\n\n`--date-order`\n\n在显示所有子提交之前不显示其父提交，否则按提交时间戳顺序显示提交。\n\
  \n`--author-date-order`\n\n在显示所有子提交之前不显示其父提交，否则按作者时间戳顺序显示提交。\n\n`--topo-order`\n\
  \n在显示所有子提交之前不显示其父提交，并避免显示多行历史交错在一起的提交。\n\n例如，在这样的提交历史中：\n\n```\n---1----2----4----7\
  \ \\ \\ 3----5----6----8---\n```\n\n其中数字表示提交时间戳的顺序，`git rev-list` 等配合 `--date-order`\
  \ 会按时间戳顺序显示提交：8 7 6 5 4 3 2 1。\n\n使用 `--topo-order`，它们将显示 8 6 5 3 7 4 2 1（或 8 7\
  \ 4 2 6 5 3 1）；某些较旧的提交会在较新的之前显示，以避免将两条并行开发分支的提交混合在一起。\n\n`--reverse`\n\n反序输出提交。不能与\
  \ `--walk-reflogs` 结合。\n\n### 对象遍历\n\n这些选项主要针对 Git 仓库的打包。\n\n`--no-walk[=(sorted|unsorted)]`\n\
  \n仅显示指定的提交，但不遍历它们的祖先。如果指定了范围，则没有影响。如果给出参数 `unsorted`，则按给命令行顺序显示提交。否则（如果给出参数 `sorted`），则按提交时间倒序显示提交。不能与\
  \ `--reflogs` 结合。\n\n`--do-walk`\n\n覆盖之前的 `--no-walk`。\n\n### 提交格式化\n\n`--pretty=[format]`,\
  \ `--format=<format>`\n\n以给格式打印提交内容，其中 `<format>` 可以是 `oneline`、`short`、`medium`、`full`、`email`、`raw`、`format:<string>`。当\
  \ `<format>` 不是上述之一时，行为相当于给了 `format:<string>`。详情见某些章节。当省略 `<format>` 时，默认为 `medium`。\n\
  \n`--notes=[ref>]`\n\n在显示提交日志消息时，显示注释该提交的注释（见 1）。这是 `git log`、`git show` 和 `git\
  \ whatchanged` 命令在没有 `--pretty`、`--format` 或 `--oneline` 选项时的默认行为。\n\n默认情况下，显示的注释来自\
  \ `core.notesRef` 和 `notes.displayRef` 变量列出的注释引用（或相应的环境变量）。更多细节见 (1)。\n\n带有可选的 `<ref>`\
  \ 参数时，显示此注释引用而非默认的注释引用。如果引用未限定，则认为在 `refs/notes/` 中。\n\n多个 --notes 选项可以组合使用以控制显示哪些注释。示例：`--notes=foo`\
  \ 将仅显示来自 `refs/notes/foo` 的注释；`--notes=foo --notes` 将显示来自 `refs/notes/foo` 和默认注释引用的注释。\n\
  \n`--no-notes`\n\n不显示注释。这通过重置显示注释的注释引用列表来抵消上述 --notes 选项。选项按照命令行给出的顺序解析，因此例如 `--notes\
  \ --notes=foo --no-notes --notes=bar` 将只会显示来自 `refs/notes/bar` 的注释。\n\n\n\n\n\n\
  ## --show-notes[=<ref>], --[no-]standard-notes\n\n这些选项已弃用。请使用上述 `--notes`/--no-notes`\
  \ 选项。\n\n## --show-signature\n\n通过将签名传递给 `gpg --verify` 来检查签名提交对象的有效性并显示输出。\n\n\
  ## --relative-date\n\n`--date=relative` 的同义词。\n\n## --date=(relative|local|default|iso|iso-strict|rfc|short|raw)\n\
  \n仅对以人类可读格式显示的日期生效，例如当使用 `--pretty` 时。`log.date` 配置变量为 `log` 命令的 `--date` 选项设置默认值。\n\
  \n- `--date=relative` 显示相对于当前时间的日期，例如“2 hours ago”。\n- `--date=local` 显示用户本地时区的时间戳。\n\
  - `--date=iso`（或 `--date=iso8601`）以类似 ISO 8601 的格式显示时间戳。与严格 ISO 8601 格式的区别在于：\n\
  \    - 使用空格代替 `T` 日期/时间分隔符\n    - 时间和时区之间有空格\n    - 时区的小时和分钟之间没有冒号\n- `--date=iso-strict`（或\
  \ `--date=iso8601-strict`）以严格的 ISO 8601 格式显示时间戳。\n- `--date=rfc`（或 `--date=rfc2822`）以\
  \ RFC 2822 格式显示时间戳，常见于邮件。\n- `--date=short` 仅显示日期不显示时间，格式为 YYYY-MM-DD。\n- `--date=raw`\
  \ 以 Git 内部的原始格式 `%s %z` 显示日期。\n- `--date=default` 显示原始时区（提交者或作者）的时间戳。\n\n## --parents\n\
  \n同时打印提交的父提交（格式为“commit parent...”）。还会启用父提交重写，详见下方的 *History Simplification*。\n\n\
  ## --children\n\n同时打印提交的子提交（格式为“commit child...”）。还会启用父提交重写，详见下方的 *History Simplification*。\n\
  \n## --left-right\n\n标记提交是从对称差异的哪侧可。来自左侧的提交以 `<` 前缀，来自右侧的提交以 `>` 前缀。如果与 `--boundary`\
  \ ，这些提交将以前 `-` 前缀。\n\n例如，你有如下拓扑结构：\n\n```\ny---b---b branch B / \\ / / . / / \\\
  \ o---x---a---a branch A\n```\n\n你将得到如下输出：\n\n```\n$ git rev-list --left-right --boundary\
  \ --pretty=oneline A...B >bbbbbbb... 3rd on b >bbbbbbb... 2nd on b <aaaaaaa... 3rd\
  \ on a <aaaaaaa... 2nd on a -yyyyyyy... 1st on b -xxxxxxx... 1st on a\n```\n\n##\
  \ --graph\n\n在输出的左侧绘制提交历史的文本图形化表示。这可能会导致提交之间打印额外的行，以便正确绘制图形历史。不能与 `--no-walk` 结合。\n\
  \n这启用父提交重写，详见下方的 *History Simplification*。\n\n这隐含了 `--topo-order` 选项，但也可以指定 `--date-order`\
  \ 选项。\n\n## --show-linear-break[=<barrier>]\n\n当不使用 `--graph` 时，所有历史分支都会被展平，这可能很难看出两个连续的提交不属于线性分支。在这种情况下，此选项会在它们之间放置屏障。如果指定了\
  \ `<barrier>`，则将显示该字符串代替默认字符串。\n\n## Diff Formatting\n\n列出的是控制 diff 输出格式的选项。其中某些特定于\
  \ (1)，但也可以给出其他 diff 选项。更多选项见 (1)。\n\n- `-c`: 使用此选项，合并提交的 diff 输出将同时显示每个父提交与合并结果之间的差异，而不是逐一显示父与结果之间的差异。此外，它只列出从所有父提交修改的文件。\n\
  - `--cc`: 此标志意味着 `-c` 选项，通过省略有趣的 hunk 来进一步压缩补丁输出，这些 hunk 在父提交中只有两种变体，而合并结果在未修改的情况下选择了其中一个。\n\
  - `-m`: 此标志使合并提交像普通提交一样显示完整的 diff；对于每个合并父，生成单独的日志条和 diff。异常是当给出 `--first-parent`\
  \ 选项时，只显示相对于第一个父提交的 diff；在这种情况下，输出代表合并带入当前分支的更改。\n- `-r`: 显示递归 diff。\n- `-t`: 在\
  \ diff 输出中显示树对象。这隐含 `-r`。\n\n## PRETTY FORMATS\n\n如果提交是合并，且格式化格式不是 `oneline`、`email`\
  \ 或 `raw`，则在 `Author:` 行之前插入额外行。该行以 \"Merge: \" 开头，并打印祖先提交的 sha1，用空格分隔。请注意，如果你限制了历史视图，列出的提交不一定是直接父提交的列表：例如，如果你只对与特定目录或文件的更改感兴趣。\n\
  \n有几种内置格式，你可以通过将 `pretty.<name>` 配置选项设置为另一个格式名称或 `format:` 字符串来定义额外的格式，如下文所示（见 (1)）。以下是内置格式的详情：\n\
  \n### oneline\n```\n<sha1> <title line>\n```\n此设计旨在尽可能紧凑。\n\n### short\n```\ncommit\
  \ <sha1> Author: <author>\n<title line>\n```\n\n### medium\n```\ncommit <sha1> Author:\
  \ <author> Date: <author date>\n<title line>\n<full commit message>\n```\n\n###\
  \ full\n```\ncommit <sha1> Author: <author> Commit: <committer>\n<title line>\n\
  <full commit message>\n```\n\n### fuller\n```\ncommit <sha1> Author: <author> AuthorDate:\
  \ <author date> Commit: <committer> CommitDate: <committer date>\n<title line>\n\
  <full commit message>\n```\n\n### email\n```\nFrom <sha1> <date> From: <author>\
  \ Date: <author date> Subject: [PATCH] <title line>\n<full commit message>\n```\n\
  \n### raw\n`raw` 格式完全按照提交对象中存储的方式显示整个提交。值得注意的是，无论使用 `--abbrev` 还是 `--no-abbrev`，SHA-1\
  \ 都会完整显示，且 `parents` 信息显示真实的父提交，而不考虑嫁接或历史简化。请注意，这种格式影响提交的显示方式，但不影响 diff 的显示方式（例如通过\
  \ `git log --raw`）。要获取完整的对象名称，请使用 `--no-abbrev`。\n\n### format:<string>\n`format:<string>`\
  \ 格式允许你指定想要显示的信息。它的工作方式有点像 `printf`，但一个异常是你获得的是换行符而不是 `\\n`。\n\n例如，`format:\"The\
  \ author of %h was %an, %ar%nThe title was %s\"` 将显示类似：\n```\nThe author of fe6e0ee\
  \ was Junio Hamano, 23 hours ago\nt419: test\n```\n占位符是：\n- `%H`: 提交 hash\n- `%h`:\
  \ 缩写的提交 hash\n- `%T`: 树 hash\n- `%t`: 缩写的树 hash\n- `%P`: 父提交 hash\n- `%p`: 缩写的父\
  \ hash\n- `%an`: 作者名\n- `%aN`: 作者名（遵循 .mailmap，见 (1) 或 (1)）\n- `%ae`: 作者邮箱\n- `%aE`:\
  \ 作者邮箱（遵循 .mailmap，见 (1) 或 (1)）\n- `%ad`: 作者日期（--date= 选项）\n- `%aD`: 作者日期，RFC 2822\
  \ 格式\n- `%ar`: 作者日期，相对时间\n- `%at`: 作者日期，Unix 时间戳\n- `%ai`: 作者日期，ISO 8601 格式\n- `%aI`:\
  \ 作者日期，严格 ISO 8601 格式\n- `%cn`: 提交者名\n- `%cN`: 提交者名（遵循 .mailmap，见 (1) 或 (1)）\n-\
  \ `%ce`: 提交者邮箱\n- `%cE`: 提交者邮箱（遵循 .mailmap，见 (1) 或 (1)）\n- `%cd`: 提交者日期（--date=\
  \ 选项）\n- `%cD`: 提交者日期，RFC 2822 格式\n- `%cr`: 提交者日期，相对时间\n- `%ct`: 提交者日期，Unix 时间戳\n\
  - `%ci`: 提交者日期，ISO 8601 格式\n- `%cI`: 提交者日期，严格 ISO 8601 格式\n- `%d`: 引用，类似于 --decorate\
  \ 选项\n- `%D`: 不带括号包裹的引用。\n- `%e`: 编码\n- `%s`: 主题\n- `%f`: 安全的主题，适合文件名\n- `%b`: 正文\n\
  - `%B`: 原始正文（未折行的主题和正文）\n- `%N`: 提交注释\n- `%GG`: 签名提交的 GPG 原始验证消息\n- `%G?`: 显示 \"\
  G\" 表示良好签名，“B\" 表示错误签名，“U\" 表示良好但不可信的签名，“N\" 表示无签名\n- `%GS`: 显示签名提交的签名者名称\n\n\n\n\
  \n\n`%GK`: 显示用于签名签名提交的密钥\n\n`%gD`: reflog 选择器，例如 `refs/stash@{1}`\n\n`%gd`: 简短的\
  \ reflog 选择器，例如 `stash@{1}`\n\n`%gn`: reflog 身份名称\n\n`%gN`: reflog 身份名称（遵循 `.mailmap`，参见\
  \ (1) 或 (1)）\n\n`%ge`: reflog 身份邮箱\n\n`%gE`: reflog 身份邮箱（遵循 `.mailmap`，参见 (1) 或\
  \ (1)）\n\n`%gs`: reflog 主题\n\n`%Cred`: 将颜色切换为红色\n\n`%Cgreen`: 将颜色切换为绿色\n\n`%Cblue`:\
  \ 将颜色切换为蓝色\n\n`%Creset`: 重置颜色\n\n`%C(...)`: 颜色规格，如 `color.branch.*` 配置选项中描述的；在开头添加\
  \ `auto` 将仅在日志输出启用颜色时输出颜色（通过 `color.diff`、`color.ui` 或 `--color` 启用，并且如果目标是终端，则尊重前面的\
  \ auto 设置）。单独的 `auto`（即 `%C(auto)`）将在后续占位符处开启自动着色，直到颜色再次切换为止。\n\n`%m`: 左、右或边界标记\n\
  \n`%n`: 换行\n\n`%%`: 原始的 `*%`\n\n`%x00`: 从十六进制代码打印字节\n\n`%w([<w>[,<i1>[,<i2>]])`:\
  \ 切换行换行，类似于 (1) 的 `-w` 选项。\n\n`%<(<N>[,trunc|ltrunc|mtrunc])`: 使下一个占位符至少占据 `N` 列，必要时在右侧填充空格。如果输出超过\
  \ `N` 列，可以选择在开头（`ltrunc`）、中间（`mtrunc`）或结尾（`trunc`）截断。注意，截断仅在 `N >= 2` 时才能正常工作。\n\
  \n`%<|(<N>)*`: 使下一个占位符至少占据到第 `N` 列为止，必要时在右侧填充空格\n\n`%>(<N>)*, %%>|(<N>)*`: 分别类似于\
  \ `%<(<N>)*` 和 `%<|(<N>)*`，但在左侧填充空格\n\n`%>>(<N>)*, `%>>|(<N>)*`: 分别类似于 `%>(<N>)*`\
  \ 和 `%%>|(<N>)*`，区别在于如果下一个占位符占据的空间比给定的多，且其左侧有空格\n\n`%><(<N>)*, %><|(<N>)*`: 分别类似于\
  \ `% <(<N>)*` 和 `%<|(<N>)*`，但在两边都填充（即文本居中）\n\n### 注意\n\n某些占位符可能取决于传递给修订遍历引擎的其他选项。例如，`%g*`\
  \ reflog 选项除非我们在遍历 reflog 条目时（例如通过 `git log -g`），否则插入空字符串。如果命令行上没有提供 `--decorate`，则\
  \ `%d` 和 `%D` 占位符将使用“短”装饰格式。\n\n如果在占位符的 `*%` 之后添加 `+`（加号），则当且仅当占位符展开为非空字符串时，在展开之前立即插入一个换行符。\n\
  \n如果在占位符的 `*%` 之后添加 `-`（减号），则当且仅当占位符展开为空字符串时，删除紧邻展开之前的换行符。\n\n如果在占位符的 `*%` 之后添加\
  \ ` `（空格），则当且仅当占位符展开为非空字符串时，在展开之前立即插入一个空格。\n\n### tformat:\n\n`tformat:` 格式的工作原理与\
  \ `format:` 完全相同，不同在于它提供的是“终止符”语义而不是“分隔符”语义。换句话说，每个提交都附带了一个消息终止符字符（通常是换行符），而不是在条目之间放置分隔符。这意味着单行格式的最后一个条目将用新行正确结束，就像\
  \ \"oneline\" 格式一样。\n\n```\n$ git log -2 --pretty=format:%h 4da45bef \\ | perl -pe\
  \ '$_ .= \" -- NO NEWLINE\\n\" unless /\\n/' 4da45be 7134973 -- NO NEWLINE $ git\
  \ log -2 --pretty=tformat:%h 4da45bef \\ | perl -pe '$_ .= \" -- NO NEWLINE\\n\"\
  \ unless /\\n/' 4da45be 7134973\n```\n\n此外，任何包含 `%` 的未识别字符串都将被解释为前面带有 `tformat:`。例如，以下二者是等价的：\n\
  \n```\n$ git log -2 --pretty=tformat:%h 4da45bef $ git log -2 --pretty=%h 4da45bef\n\
  ```\n\n## 通用 diff \n\n- `-p, -u, --patch`\n生成补丁（参见生成补丁的章节）。\n\n- `-s, --no-patch`\n\
  抑制 diff 输出。适用于像 `git show` 这样默认显示补丁的命令，或者为了取消 `--patch` 的效果。\n\n- `-U<n>, --unified=<n>`\n\
  生成具有 `<n>` 行上下文的 diff，而不是通常的三行。这隐含了 `-p`。\n\n- `--raw`\n对于每个提交，使用原始 (raw) 格式显示更改摘要。参见\
  \ (1) 的“原始输出格式”部分。这与以原始格式显示日志本身不同，后者可以通过 `--format=raw` 实现。\n\n- `--patch-with-raw`\n\
  `-p --raw` 的同义词。\n\n- `--minimal`\n花费额外时间以确保产生最小的 diff。\n\n- `--patience`\n使用“patience\
  \ diff”算法生成 diff。\n\n- `--histogram`\n使用“histogram diff”算法生成 diff。\n\n- `--diff-algorithm={patience|minimal|histogram|myers}`\n\
  选择一种 diff 算法。变体如下：\n\n- `default, myers`\n基础的贪心 diff 算法。目前这是默认值。\n- `minimal`\n\
  花费额外时间以确保产生最小的 diff。\n- `patience`\n在生成补丁时使用 \"patience diff\" 算法。\n- `histogram`\n\
  该算法扩展了 patience 算法以“支持低出现的公共元素”。例如，如果你将 `diff.algorithm` 变量配置为非默认值并想使用默认值，则必须使用\
  \ `--diff-algorithm=default` 选项。\n\n- `--stat[=<width>[,<name-width>[,<count>]]`\n\
  生成 diffstat。默认情况下，文件名部分将使用尽可能的空间，其余部分用于图表部分。最大宽度默认为终端宽度。可以通过第三个参数 `<count>` 限制输出前\
  \ `<count>` 行，如果更多，则显示 ...。\n\n这些参数也可以单独设置：`--stat-width=<width>`、`--stat-name-width=<name-width>`\
  \ 和 `--stat-count=<count>`。\n\n- `--numstat`\n类似于 `--stat`，但使用十进制显示添加和删除的行数且省略路径。对于二进制文件，输出两个\
  \ 而不是 0。\n\n- `--shortstat`\n仅输出 `--stat` 格式的最后一行，包含修改文件的总数以及添加和删除的行数。\n\n- `--dirstat[=<param1,param2,...>]`\n\
  输出每个子目录更改的相对分布。`--dirstat` 的行为可以通过传递逗号分隔的参数列表进行自定义。默认由配置变量 `diff.dirstat` 控制（参见\
  \ (1)）。可用参数如下：\n\n- `changes`\n通过计算 dirstat 数字。这忽略文件内部的纯代码移动。换句话说，文件中重新排列行的计数与其他更改相同。这是未提供参数时的默认行为。\n\
  - `lines`\n通过执行常规的 diff 分析并累加删除/添加的数来计算 dirstat 数字。（对于二进制文件，计算 64 字节块，因为二进制文件没有自然的行概念）。这是比更改行为更消耗资源的\
  \ --dirstat 行为，但它将文件中重新排列行的计数与其他更改相同。其输出结果与其他 --*stat 选项的结果一致。\n- `files`\n通过计算更改文件的数量来计算\
  \ dirstat 数字。每个更改的文件在 dirstat 分析中权重相等。这是计算成本最低的 --dirstat 行为，因为它完全不需要查看文件内容。\n-\
  \ `cumulative`\n将子目录的更改也计入父目录。注意，当使用累计时，报告的百分比之可能可能 100%。默认（非累计）行为可以通过 `noncumulative`\
  \ 参数指定。\n\n\n\n\n一个整数参数用于指定截断百分比（默认为 3%）。更改少于此百分比的目录将不会在输出中。\n\n示例：以下命令将统计更改的文件，同时忽略更改文件数少于总量\
  \ 10% 的目录，并将子目录计数累计到父目录中：`--dirstat=files,10,cumulative`。\n\n### `--summary`\n输出扩展头部信息的简要摘要，例如创建、重命名和模式更改。\n\
  \n### `--patch-with-stat`\n`-p` `--stat` 的别名。\n\n### `-z`\n使用 NUL（空字符）分隔提交，而不是新的换行符。\n\
  \n此外，当给出 `--raw` 或 `--numstat` 时，不要混淆路径，并使用 NUL 作为输出字段的终止符。\n\n如果没有此选项，输出的每个路径名中的\
  \ TAB、LF、双引号和反斜杠将被分别替换为 `\\t`、`\\n`、`\\\"` 和 `\\\\`，如果发生了任何一种替换，路径名将被双引号括起来。\n\n\
  ### `--name-only`\n仅显示更改的文件名。\n\n### `--name-status`\n仅显示更改的文件名和状态。有关状态字母的含义，请参见\
  \ `--diff-filter` 选项的描述。\n\n### `--submodule[=<format>]`\n指定子模块差异的显示方式。当给出 `--submodule`\
  \ 或 `--submodule=log` 时，使用 `log` 格式。该格式像 `summary` 一样列出范围内的提交。省略 `--submodule` 选项或指定\
  \ `--submodule=short` 则使用 `short` 格式。该格式仅显示范围开始和结束的提交名称。可以通过 `diff.submodule` 配置变量进行调整。\n\
  \n### `--color[=<when>]`\n显示彩色差异。`--color`（即不带 `=<when>`）等同于 `--color=always`。`<when>`\
  \ 可以是 always、never 或 auto 其中的之一。\n\n### `--no-color`\n关闭彩色差异。它等同于 `--color=never`。\n\
  \n### `--word-diff[=<mode>]`\n显示单词差异，使用 `<mode>` 来分隔更改的单词。默认情况下，单词由空白符分隔；见下文的 `--word-diff-regex`。`<mode>`\
  \ 默认为 `plain`，且必须是以下之一：\n\n- **color**:\n  仅使用颜色高亮更改的单词。隐含 `--color`。\n- **plain**:\n\
  \  以 `[-removed-]` 和 `{+added+}` 显示单词。如果输入中出现分隔符，则不尝试对其进行转义，因此输出可能具有歧义性。\n- **porcelain**:\n\
  \  使用一种用于脚本解析的特殊行级格式。添加/删除/未更改的运行将按标准的统一差异格式打印，行首以 `+/-/ ` 字符开头并延伸到行尾。输入中的换行符由单独占一行的波浪号\
  \ `~` 表示。\n- **none**:\n  再次禁用单词差异。\n\n注意，尽管第一个模式的名称带有 color，但在启用了颜色的情况下，所有模式下都会使用颜色来高亮更改部分。\n\
  \n### `--word-diff-regex=<regex>`\n使用 `<regex>` 来判断什么是单词，而不是将连续的非空白字符视为单词。除非已启用，否则它也会隐含\
  \ `--word-diff`。\n\n`<regex>` 的每个不重叠匹配项都被视为一个单词。这些匹配项之间的任何内容都被视为空白符，并在查找差异时被忽略（!）。你可能想在正则表达式后面附加\
  \ `|[^[:space:]]` 以确保它匹配所有非空白字符。包含换行符的匹配会在换行符处静默截断（!）。\n\n正则也可以通过 diff 驱动程序或配置选项设置，见\
  \ (1) 或 (1)。显式提供将覆盖任何 diff 驱动程序或配置设置。diff 驱动程序覆盖配置设置。\n\n### `--color-words[=<regex>]`\n\
  等同于 `--word-diff=color` 加上（如果指定了正则）`--word-diff-regex=<regex>`。\n\n### `--no-renames`\n\
  关闭重命名检测，即使配置文件默认开启。\n\n### `--check`\n如果更改引入了空白错误，则警告。什么 true 空白错误由 `core.whitespace`\
  \ 配置控制。默认情况下，尾部空格（包括仅由空白组成的行）以及行初始缩进内紧随制表符的空格字符被视为空白错误。如果发现问题，则以非零状态退出。与 `--exit-code`\
  \ 不兼容。\n\n### `--ws-error-highlight=<kind>`\n以 `color.diff.whitespace` 指定颜色高亮 `<kind>`\
  \ 指定行的空白错误。`<kind>` 是 old、new、context 的用逗号分隔的列表。当未给出此选项时，仅高亮新行中的空白错误。例如，`--ws-error-highlight=new,old`\
  \ 会高亮被删除和添加行的空白错误。all 均可作为 old、new、context 的简写。\n\n### `--full-index`\n在生成补丁格式输出时，在“index”行上显示完整的镜像和后镜像\
  \ blob 对象名称，而不是前几个字符。\n\n### `--binary`\n除了 `--full-index` 之外，输出可以使用 `git-apply`\
  \ 应用的二进制差异。\n\n### `--abbrev[=<n>]`\n在 diff-raw 格式输出和 diff-tree 头文件中，不再显示完整的 40\
  \ 字节十六进制对象名称，而是显示部分前缀。这与上述 `--full-index` 选项独立，后者控制 diff-patch 输出格式。可以通过 `--abbrev=<n>`\
  \ 指定非默认的数字位数。\n\n### `-B[<n>][/<m>], --break-rewrites[=[<n>][/<m>]]`\n将完全重写的更改拆分为删除和创建的对。这有两个用途：\n\
  \n1. 它影响了相当于文件完全重写的更改的处理方式，使其不是一系列删除和插入与少数在文本上恰好匹配上下文的行混合在一起，而是一次性删除所有旧内容，随后一次性插入所有新内容。数字\
  \ `m` 控制 `-B` 选项的这方面（默认为 60%）。`-B/70%` 指定如果结果中保留少于原始内容的 30%，则 Git 认为其为完全重写（即：否则结果生成的补丁将是一系列带有上下文行的删除和插入的混合）。\n\
  2. 当与 `-M` 一起使用时，完全重写的文件也被视为重命名的源（通常 `-M` 只考虑消失的文件作为重命名的源），数字 `n` 控制 `-B` 选项的这方面（默认为\
  \ 50%）。`-B20%` 指定与文件大小相比，添加和删除达到文件大小的 20% 或比例的更改，有资格被选为重命名到另一个文件的可能源。\n\n### `-M[<n>],\
  \ --find-renames[=<n>]`\n在生成差异时，为每个提交检测并报告重命名。在遍历历史时跨越重命名跟踪后续文件，请参见 `--follow`。如果指定了\
  \ `n`，它是相似性索引的阈值（即与文件大小相比的添加/删除量）。例如，`-M90%` 意味着如果文件超过 90% 没有发生变化，Git 应该将一个删除/添加对视为重命名。如果没有\
  \ % 号，该数字被读为分数，前面带有一个小数点。即，`-M5` 变为 0.5，因此与 `-M50%` 相同。同样，`-M05` 等同于 `-M5%`。要将检测限制为精确重命名，请使用\
  \ `-M100%`。默认相似性索引为 50%。\n\n### `-C[<n>], --find-copies[=<n>]`\n检测复制以及重命名。见 `--find-copies-harder`。如果指定了\
  \ `n`，其含义与 `-M<n>` 相同。\n\n### `--find-copies-harder`\n出于性能考虑，默认情况下，`-C` 选项仅当复制的原文件在同一更改集中被修改时才查找复制。此标志使命令检查未修改的文件作为复制源的候选对象。对于大型项目，这是一个非常昂贵的操作，请谨慎使用。提供多个\
  \ `-C` 选项效果相同。\n\n### `-D, --irreversible-delete`\n\n\n\n\n\n省略删除操作的原始映像（preimage），即只打印头部，但不打印原始映像与\
  \ `/dev/null` 之间的差异。生成的补丁并非用于 `patch` 或 `git apply`；它仅适用于那些只想在更改后专注于审查文本的人。此外，输出内容显然缺乏反向应用此类补丁所需的信息（即使手动操作也不行），这也是该选项命名的由来。\n\
  \n与 `-B` 配合使用时，省略删除/创建对中删除部分的原始映像。\n\n### `-l<num>`\n\n`-M` 和 `-C` 选项需要 `O(n²)`\
  \ 的处理时间，其中 `n` 是潜在重命名/复制目标的数量。当重命名/拷贝目标超过指定数量时，此选项将防止重命名/拷贝检测运行。\n\n### `--diff-filter=[(A|C|D|M|R|T|U|X|B)...[*]]`\n\
  \n仅选择已添加 (A)、复制 (C)、删除 (D)、修改 (M)、重命名 (R)、类型（即普通文件、符号链接、子模块等）改变 (T)、未合并 (U)、未知 (X)\
  \ 或配对已破坏 (B) 的文件。可以使用过滤器字符的任意组合（包括无）。当在组合中添加 `*`（全有全无）时，如果比较中存在任何文件符合其他标准，则选择所有路径；如果没有文件符合其他标准，则不选择任何内容。\n\
  \n### `-S<string>`\n\n查找文件中指定字符串出现次数发生变化（即添加/删除）的差异。供脚本编写人员使用。\n\n当你正在寻找一段精确的代码块（如结构体），并想知道该块自首次出现以来的历史时，这非常有用：反复使用该功能将原始映像中感兴趣块馈回\
  \ `-S`，并持续直到获取该块的最早版本。\n\n### `-G<regex>`\n\n查找补丁文本中包含匹配 `<regex>` 的添加/删除行的差异。\n\
  \n为了说明 `-S<regex> --pickaxe-regex` 与 `-G<regex>` 之间的区别，请考虑一个在同一文件中具有以下差异的提交：\n\n\
  ```\n+ return !regexec(regexp, two->ptr, 1, &regmatch, 0); ... - hit = !regexec(regexp,\
  \ mf2.ptr, 1, &regmatch, 0);\n```\n\n虽然 `git log -G\"regexec\\(regexp\"` 会显示此提交，但\
  \ `git log -S\"regexec\\(regexp\" --pickaxe-regex` 则不会（因为该字符串的出现次数没有变化）。\n\n更多信息请见\
  \ (7) 中的 `pickaxe` 条目。\n\n### `--pickaxe-all`\n\n当 `-S` 或 `-G` 找到更改时，显示该变更集中所有的更改，而不仅仅是包含\
  \ `<string>` 更改的文件。\n\n### `--pickaxe-regex`\n\n将传递给 `-S` 的 `<string>` 视为扩展 POSIX\
  \ 正正则表达式进行匹配。\n\n### `-O<orderfile>`\n\n按照 `<orderfile>` 中顺序输出补丁，该文件每行包含一个 shell\
  \ glob 模式。这会覆盖 `diff.orderFile` 配置变量（见 (1)）。要取消 `diff.orderFile`，请使用 `-O/dev/null`。\n\
  \n### `-R`\n\n交换两个输入；即显示从索引或磁盘文件到树内容的差异。\n\n### `--relative[=<path>]`\n\n当在项目的子目录下运行时，可以通过此选项告诉它排除目录外的更改，并显示相对于该目录的路径。当你不在子目录中（例如在裸仓库中）时，可以通过提供参数\
  \ `<path>` 来指定相对于哪个子目录输出输出。\n\n### `-a, --text`\n\n将所有文件视为文本。\n\n### `--ignore-space-at-eol`\n\
  \n忽略行尾（EOL）空格的更改。\n\n### `-b, --ignore-space-change`\n\n忽略空格数量的变化。这会忽略行尾的空格，并将所有其他一个或多个空白字符序列视为等效。\n\
  \n### `-w, --ignore-all-space`\n\n在比较行时忽略空格。即使其中一行有空格而另一行没有，也会忽略差异。\n\n### `--ignore-blank-lines`\n\
  \n忽略所有行均为空行的更改。\n\n### `--inter-hunk-context=<lines>`\n\n显示差异块（hunks）之间的上下文，最多到指定的行数，从而融合彼此彼此的差异块。\n\
  \n### `-W, --function-context`\n\n显示更改周围的完整函数。\n\n### `--ext-diff`\n\n允许执行外部 diff\
  \ 助手。如果你通过 (5) 设置了外部 diff 驱动程序，则需要配合 (1) 等选项使用此选项。\n\n### `--no-ext-diff`\n\n禁止外部\
  \ diff 驱动程序。\n\n### `--textconv, --no-textconv`\n\n在比较二进制文件时允许（或禁止）运行外部文本转换过滤器。详情见\
  \ (5)。由于 `textconv` 过滤器通常是单向转换，生成的差异适用于人类阅读，但无法被应用。由于此原因，`textconv` 过滤器默认仅对 (1)\
  \ 和 (1) 启用，而未对 (1) 或 diff 管道命令启用。\n\n### `--ignore-submodules[=<when>]`\n\n在生成 diff\
  \ 时忽略对子模块的更改`<when>` 可以是 \"none\"、\"untracked\"\"dirty\" 或 \"all\"，默认为 \"all\"。使用\
  \ \"none\" 时，当子模块包含未跟踪或已修改的文件，或者其 HEAD 与主项目记录的提交不同时，会将子模块视为为已修改，这可用于覆盖 (1) 或 (5)\
  \ 中 `ignore` 选项的任何设置。当使用 \"untracked\" 时，如果子模块仅包含未跟踪的内容，则不会被视为脏（但仍会扫描已修改的内容）。使用\
  \ \"dirty\" 会忽略对子模块工作树的所有更改，仅显示存储在主项目中的提交的更改（这是 1.7.0 之前的行为）。使用 \"all\" 则隐藏对子模块的所有更改。\n\
  \n### `--src-prefix=<prefix>`\n\n显示指定的源前缀代替 \"a/\"。\n\n### `--dst-prefix=<prefix>`\n\
  \n显示指定的的目标前缀代替 \"b/\"。\n\n### `--no-prefix`\n\n不显示任何源或目标前缀。\n\n关于这些常用选项的更详细解释，请参阅\
  \ (7)。\n\n## 使用 -P 生成补丁\n\n当运行 `git-diff-index`、`git-diff-tree` 或 `git-diff-files`\
  \ 并带有 `-p` 选项，或者不带 `--raw` 选项的 `git diff` 或带有 `-p` 选项的 `git log`，它们不会产生上述输出；而是产生一个补丁文件。你可以通过\
  \ `GIT_EXTERNAL_DIFF` 和 `GIT_DIFF_OPTS` 环境变量自定义此类补丁的创建。\n\n`-p` 选项产生的内容与传统的 diff\
  \ 格式略不同：\n\n1. 它前面有一个像这样的 \"git diff\" 头部：\n\n```\ndiff --git a/file1 b/file2\n\
  ```\n\n除非涉及重命名/复制，否则 `a/` 和 `b/` 文件名是相同的。特别是即使对于创建或删除，也不会用 `/dev/null` 代替 `a/` 或\
  \ `b/` 文件名。\n\n当涉及重命名/复制时，`file1` 和 `file2` 分别显示重命名/复制的源文件名和重命名/复制产生的文件名。\n\n2.\
  \ 后面跟着一个或多个扩展头部行：\n\n```\nold mode <mode> new mode <mode> deleted file mode <mode>\
  \ new file mode <mode> copy from <path> copy to <path> rename from <path> rename\
  \ to <path> similarity index <number> dissimilarity index <number> index <hash>..<hash>\
  \ <mode>\n```\n\n文件模式以 6 位进制数打印，包括文件类型和权限位。\n\n扩展头部中的路径不包含 `a/` 和 `b/` 前缀。\n\n相似性索引是未更改行的百分比，不差异性索引（dissimilarity\
  \ index）是更改行的百分比。它是一个向下取整的整数，后跟一个百分号。因此，相似性索引值 100% 留给两个相同的文件，而 100% 的不差异性意味着旧文件中的没有没有任何行被带到新文件中。\n\
  \n索引行包含了更改前后的 SHA-1 校验和。如果文件模式没有更改，则包含 `<mode>`；否则，用单独的行表示旧新模式。\n\n3. 路径中的 TAB、LF、双引号和反斜杠字符分别表示为\
  \ `\\t`、`\\n`、`\\\"` 和 `\\\\`。如果需要此类替换，整个路径将放在双引号中。\n\n\n\n\n4. 输出中所有的 `file1` 文件均指\
  \ commit 之前的文件，而所有的 `file2` 文件均指 commit 之后的文件。将每个更改顺序应用到每个文件是不准确的。例如，此补丁将交换 `a`\
  \ 和 `b`：\n\n```diff\ndiff --git a/a b/b rename from a rename to b diff --git a/b\
  \ b/a rename from b rename to a\n```\n\n## 合并 diff 格式 (COMBINED DIFF FORMAT)\n\n\
  任何生成 diff 的命令都可以接受 `-c` 或 `--cc` 选项，在显示合并时产生 `合并 diff`（combined diff）。这是显示带有 `(1)`\
  \ 或 `(1)` 的合并时的默认格式。请注意，你也可以给这些命令中的任何一个提供 `-m` 选项，以强制生成相对于合并单个父节点的 diff。\n\n`合并\
  \ diff` 格式如下：\n\n```\ndiff --combined describe.c index fabadb8,cc95eb0..4866510\
  \ --- a/describe.c +++ b/describe.c @@@ -98,20 -98,12 +98,20 @@@ return (a_date\
  \ > b_date) ? -1 : (a_date == b_date) ? 0 : 1; } - static void describe(char *arg)\
  \ -static void describe(struct commit *cmit, int last_one) ++static void describe(char\
  \ *arg, int last_one) { + unsigned char sha1[20]; + struct commit *cmit; struct\
  \ commit_list *list; static int initialized = 0; struct commit_name *n; + if (get_sha1(arg,\
  \ sha1) < 0) + usage(describe_usage); + cmit = lookup_commit_reference(sha1); +\
  \ if (!cmit) + usage(describe_usage); + if (!initialized) { initialized = 1; for_each_ref(get_name);\n\
  ```\n\n1. 它前面带有一个 \"git diff\" 头部，如下所示（当使用 `-c` 选项时）：\n\n```\ndiff --combined file\n\
  ```\n\n或者如下（当使用 `--cc` 选项时）：\n\n```\ndiff --cc file\n```\n\n2. 后面跟着一个或多个扩展头部的行（此示例显示了一个具有两个父节点的合并）：\n\
  \n```\nindex <hash>,<hash>..<hash> mode <mode>,<mode>..<mode> new file mode <mode>\
  \ deleted file mode <mode>,<mode>\n```\n\n只有当至少有一个 `<mode>` 与其他不同时，才会出现 `<mode>,<mode>..<mode>`\
  \ 这一行。带有检测到的内容移动（重命名和复制检测）信息的扩展头部旨在用于两个 `<tree-ish>` 之间的 diff，不被合并 diff 格式使用。\n\n\
  3. 后面跟着两行的源文件/目标文件头部\n\n```\n--- a/file +++ b/file\n```\n\n与传统的 `unified` diff 格式的双行头部类似，`/dev/null`\
  \ 用于指示创建或删除的文件。\n\n4. 块头部（Chunk header）格式经过修改，以防止人们意外传递给 `patch -p1`。合并 diff 格式是为了审查合并提交的更改而设计的，并非用于应用。该更改与扩展\
  \ `index` 头部的更改相似：\n\n```\n@@@@ <from-file-range> <from-file-range> <to-file-range>\
  \ @@@\n```\n\n合并 diff 格式的块头部中有 `(父节点数量 + 1)` 个 `@` 字符。\n\n传统的 `unified` diff 格式不同，它显示两个文件\
  \ `A` 和 `B`，并带有一列 `-`（减号 --- 出现在 `A` 中但在 `B` 中移除）、`+`（加号 --- 在 `A` 中缺失但在 `B` 中添加）或\
  \ `\" \"`（空格 --- 未更改）前缀；而这种格式将两个或多个文件 `file1`, `file2,...` 与一个文件 `X` 进行比较，并显示 `X`\
  \ 与每个 `fileN` 的差异。输出行前面为每个 `fileN` 留有一列，以说明 `X` 的行与其何不同。\n\n列 `N` 中的 `-` 字符意味着该行出现在\
  \ `fileN` 中但未出现在结果中。列 `N` 中的 `+` 字符意味着该行出现在结果中，而 `fileN` 没有该行（换句话说，从该父节点的角度来看，该行被添加了）。\n\
  \n在上面的示例输出中，函数签名在两个文件中发生了变化（因此在 `file1` 和 `file2` 中都有两个 `-` 移除，加上 `++` 表示添加的行既未出现在\
  \ `file1` 也未出现在 `file2`）。此外，其他八行与 `file1` 相同但未出现在 `file2` 中（因此带有 `+` 前缀）。\n\n当通过\
  \ `git diff-tree -c` 显示时，它比较合并提交的父节点与合并结果（即 `file1..fileN` 是父节点）。当通过 `git diff-files\
  \ -c` 显示时，它比较两个未解析的合并父节点与工作树文件（即 `file1` 是阶段 2，即“我们的版本”，`file2` 是阶段 3，即“他们的版本”）。\n\
  \n## 示例\n\n```\ngit log --no-merges\n```\n显示整个提交历史，但跳过任何合并\n\n```\ngit log v2.6.12..\
  \ include/scsi drivers/scsi\n```\n显示自版本 `v2.6.12` 以来更改了 `include/scsi` 或 `drivers/scsi`\
  \ 中任何文件的所有提交。\n\n\n\n\n显示日志时使用的编码。（参见上文的 *Discussion*）。如果设置了 `i18n.commitEncoding`，则默认使用该值，否则使用\
  \ UTF-8。\n\n`log.date`\n\n人类可读日期的默认格式。（对比 `--date` 选项）。默认值为 \"default\"，意味着输出类似\
  \ Sat May 8 19:35:34 2010 -0500 的日期格式。\n\n`log.showRoot`\n\n如果为 `false`，`git log`\
  \ 和相关命令将不会将初始提交视为大的创建事件。在 `git log -p` 输出中，任何根提交将显示但不附带差异（diff）。默认为 `true`。\n\n\
  `mailmap.*`\n\n参见 (1)。\n\n`notes.displayRef`\n\n在用 log 族命令显示提交消息时，除了 `core.notesRef`\
  \ 或 `GIT_NOTES_REF` 设置的默认集外，还从哪些 ref 读取注释。参见 (1)。\n\n可以是未缩写的 ref 名称或通配符（glob），并且可以多次指定。对于不存在的\
  \ ref 将发出警告，但不匹配任何 ref 的通配符将被静默忽略。\n\n此设置可以通过 `--no-notes` 选项禁用，被 `GIT_NOTES_DISPLAY_REF`\
  \ 环境变量覆盖，并被 `--notes=<ref>` 选项覆盖。\n\n***\n\n# GIT-LS-FILES\n\n## 名称\n`git-ls-files`\
  \ - 显示索引和工作树中的文件信息\n\n## 语法概要\n```\ngit ls-files [-z] [-t] [-v] (--[cached|deleted|others|ignored|stage|unmerged|\
  \ killed|modified])* (-[c|d|o|i|s|u|k|m])* [-x <pattern>|--exclude=<pattern>] [-X\
  \ <file>|--exclude-from=<file>] [--exclude-per-directory=<file>] [--exclude-standard]\
  \ [--error-unmatch] [--with-tree=<tree-ish>] [--full-name] [--abbrev] [--] [<file>...]\n\
  ```\n\n## 描述\n此命令将目录缓存索引的文件列表与实际的工作目录列表合并，并显示两者的不同组合。\n\n可以使用以下一个或多个选项来确定显示的文件：\n\
  \n### 选项\n- `-c, --cached`\n在输出中显示缓存文件（默认）\n- `-d, --deleted`\n在输出中显示已删除的文件\n- `-m,\
  \ --modified`\n在输出中显示已修改的文件\n- `-o, --others`\n在输出中显示其他文件（即未跟踪的文件）\n- `-i, --ignored`\n\
  在输出中仅显示被忽略的文件。在显示索引中的文件时，仅打印匹配排除模式的文件。在显示“其他”文件时，仅显示匹配排除模式的文件。\n- `-s, --stage`\n\
  在输出中显示暂存内容的对象名称、模式位和阶段号。\n- `--directory`\n如果整个目录被归类为“其他”，则只显示其名称（带有末尾正斜杠），而不是其全部内容。\n\
  - `--no-empty-directory`\n不列出空目录。在没有使用 `--directory` 时没有效果。\n- `-u, --unmerged`\n\
  在输出中显示未合并的文件（强制使用 `--stage`）\n- `-k, --killed`\n显示文件由于文件/目录冲突导致 `checkout-index`\
  \ 无法成功而需要删除的文件。\n- `-z`\n输出中使用 `\\0` 换终止。\n- `-x <pattern>, --exclude=<pattern>`\n\
  跳过匹配模式的未跟踪文件。注意模式是 shell 通配符模式。更多信息见下文的 EXCLUDE PATTERNS。\n- `-X <file>, --exclude-from=<file>`\n\
  从 `<file>` 读取排除模式；每行一个。\n- `--exclude-per-directory=<file>`\n从 `<file>` 读取仅适用于该目录及其子目录的额外排除模式。\n\
  - `--exclude-standard`\n添加标准的 Git 排除项：`.git/info/exclude`、每个目录下的 `.gitignore` 以及用户的全局排除文件。\n\
  - `--error-unmatch`\n如果任何 `<file>` 不在索引中，则将其视为错误（返回 1）。\n- `--with-tree=<tree-ish>`\n\
  当使用 `--error-unmatch` 将用户提供的 `<file>`（即路径模式）参数扩展为路径时，假定自命名的 `<tree-ish>` 之后在索引中删除的路径仍然存在。与\
  \ `-s` 或 `-u` 选项配合使用此选项没有意义。\n- `-t`\n此功能已半弃用。为了脚本目的，(1)--porcelain 和 (1)--name-status\
  \ 几乎总是更好的替代方案，用户应该查看 (1)--short 或 (1)--name-status 获取更用户友好的替代方案。\n此选项在每行开头通过以下标记（后跟空格）标识文件状态：\n\
  H: cached\nS: skip-worktree\nM: unmerged\nR: removed/deleted\nC: modified/changed\n\
  K: to be killed\n?: other\n- `-v`\n与 `-t` 类似，但对标记为 *assume unchanged*（假设未更改，参见 (1)）的文件使用小写字母\n\
  - `--full-name`\n当从子目录运行时，命令通常输出相对于当前目录的路径。此选项强制输出相对于项目根目录的路径。\n- `--abbrev[=<n>]`\n\
  不显示完整的 40 字节十六进制对象行，而是只显示部分前缀。可以使用 `--abbrev=<n>` 指定非默认的数字位数。\n- `--debug`\n在每个描述文件的行之后，添加关于其缓存条目的更多数据。这旨在尽可能显示信息以便进行手动检查；具体格式可能会随时更改。\n\
  - `--`\n不再将任何后续参数解释为选项。\n- `<file>`\n要显示的文件。如果没有给出文件，则显示所有符合其他指定标准的文件。\n\n## 输出\n\
  `git ls-files` 仅输出文件名，除非指定了 `--stage`，此时会输出：\n```\n[<tag> ]<mode> <object> <stage>\
  \ <file>\n```\n`git ls-files --unmerged` 和 `git ls-files --stage` 可用于检查未合并路径的详细信息。\n\
  \n对于未合并的路径，索引不是记录单个模式/SHA-1 对，而是记录多达三个这样的对；分别来自阶段 1 的树 `O`、阶段 2 的 `A` 和阶段 3 的 `B`。这些信息可以供用户（或\
  \ porcelain 命令）使用，以查看最终应该在该路径记录的内容。（有关状态的更多信息参见 (1)）。\n\n当不使用 `-z` 选项时，路径中的 TAB、LF\
  \ 和反斜杠字符分别表示为 `\\t`、`\\n` 和 `\\\\`。\n\n## 排除模式\n`git ls-files` 在遍历目录树并在指定标记 `--others`\
  \ 或 `--ignored` 时查找要显示的文件时，可以使用“排除模式”列表。(5) 规定了排除模式的格式。\n\n这些排除模式按以下顺序来自这些地方：\n\
  1. 命令行标记 `--exclude=<pattern>` 指定单个模式。模式的顺序与它们在命令行中出现的顺序相同。\n2. 命令行标记 `--exclude-from=<file>`\
  \ 指定一个包含模式列表的文件。模式的顺序与它们在文件中出现的顺序相同。\n3. 命令行标记 `--exclude-per-directory=<name>`\
  \ 指定 `git ls-files` 检查的每个目录中的文件名，通常为 `.gitignore`。深层目录的文件具有优先级。模式的顺序与它们在文件中出现的顺序相同。\n\
  \n在命令行上通过 `--exclude` 指定的模式或从 `--exclude-from` 指定的文件读取的模式相对于目录树顶部。从 `--exclude-per-directory`\
  \ 指定的文件读取的模式相对于模式文件所在的目录。\n\n## 参见\n(1), (5)\n\n***\n\n# GIT-LS-REMOTE\n\n## 名称\n\
  `git-ls-remote` - 列出远程仓库中的引用\n\n## 语法概要\n```\ngit ls-remote [--heads] [--tags] [-u\
  \ <exec> | --upload-pack <exec>] [--exit-code] <repository> [<refs>...]\n```\n\n\
  ## 描述\n显示远程仓库中提供的引用以及相关的提交 ID。\n\n### 选项\n- `-h, --heads, -t, --tags`\n分别限制为 refs/heads\
  \ 和 refs/tags。这些并不互斥；当同时给出时，显示存储在 refs/heads 和 refs/tags 中的引用。\n- `-u <exec>, --upload-pack=<exec>`\n\
  指定远程主机 `git-upload-pack` 的完整路径。这允许列出通过 SSH 访问且 SSH 守护进程未使用用户配置的 PATH 的仓库引用。\n- `--exit-code`\n\
  在远程仓库未找到匹配引用时以状态 2 退出。通常命令以状态 0 退出，表示已与远程仓库通信，无论是否找到匹配的引用。\n- `--get-url`\n\n\n\n\
  \n考虑到任何 \"url.<base>.insteadOf\" 配置设置（参见 (1)），扩展给定的远程仓库的 URL 并在不与远程通信的情况下退出。\n\n\
  `<repository>`\n\n要查询的“远程”仓库。此参数可以是 URL 也可以是远程的名称（参见 (1) 中的 `GIT URLS` 和 `REMOTES`\
  \ 章节）。\n\n`<refs>...`\n\n如果未指定，将显示经过 `--heads` 和 `--tags` 过滤后的所有引用。当指定了 `<refs>...`\
  \ 时，则仅显示匹配给定模式的引用。\n\n## 示例\n\n```\n$ git ls-remote --tags ./. d6602ec5194c87b0fc87103ca4d67251c76f233a\
  \ refs/tags/v0.99 f25a265a342aed6041ab0cc484224d9ca54b6f41 refs/tags/v0.99.1 7ceca275d047c90c0c7d5afb13ab97efdf51bd6e\
  \ refs/tags/v0.99.3 c5db5456ae3b0873fc659c19fafdde22313cc441 refs/tags/v0.99.2 0918385dbd9656cab0d1d81ba7453d49bbc16250\
  \ refs/tags/junio-gpg-pub \n$ git ls-remote master pu rc 5fe978a5381f1fbad26a80e682ddd2a401966740\
  \ refs/heads/master c781a84b5204fb294c9ccc79f8b3baceeb32c061 refs/heads/pu \n$ git\
  \ remote add korg \n$ git ls-remote --tags korg v\\* d6602ec5194c87b0fc87103ca4d67251c76f233a\
  \ refs/tags/v0.99 f25a265a342aed6041ab0cc484224d9ca54b6f41 refs/tags/v0.99.1 c5db5456ae3b0873fc659c19fafdde22313cc441\
  \ refs/tags/v0.99.2 7ceca275d047c90c0c7d5afb13ab97efdf51bd6e refs/tags/v0.99.3\n\
  ```\n\n# GIT-LS-TREE\n\n## 名称\n`git-ls-tree` - 列出树对象的内容\n\n## 语法\n`git ls-tree [-d]\
  \ [-r] [-t] [-l] [-z] [--name-only] [--name-status] [--full-name] [--full-tree]\
  \ [--abbrev[=<n>]] <tree-ish> [<path>...]`\n\n## 描述\n列出给定树对象的内容，类似于在当前工作目录下执行 \"\
  /bin/ls -a\"。注意：\n\n其行为与 \"/bin/ls\" 略有不同，因为 `<path>` 仅表示匹配的模式列表，例如，指定目录名称（不带 *-r*）的行为会有所不同，且参数的顺序并不重要。\n\
  \n其行为与 \"/bin/ls\" 相似，因为 `<path>` 被视为相对于当前工作目录的路径。例如，当你处于一个包含目录 `dir` 的目录 `sub`\
  \ 中时，你可以运行 `git ls-tree -r HEAD dir` 来列出树的内容（即 `HEAD` 中的 `sub/dir`）。在这种情况下，你不应该提供一个不在根层级的树（例如\
  \ `git ls-tree -r HEAD:sub dir`），因为这会导致在 `HEAD` 提交中请求 `sub/sub/dir`。然而，可以通过传递 `--full-tree`\
  \ 选项来忽略当前工作目录。\n\n## 参数\n`<tree-ish>`\n树对象的 ID。\n\n`-d`\n仅显示命名的树项本身，不显示其子项。\n\n\
  `-r`\n递归进入子树。\n\n`-t`\n即使在进行递归时也显示树项。如果没有传递 `-r`，则没有效果。`-d` 隐含 `-t`。\n\n`-l, --long`\n\
  显示 blob（文件）项的对象大小。\n\n`-z`\n输出时使用 \\0 行终止符。\n\n`--name-only, --name-status`\n仅列出文件名（而不是“详细”输出），每行一个。\n\
  \n`--abbrev[=<n>]`\n不显示完整的 40 字节十六进制对象行，而是只显示部分前缀。可以使用 `--abbrev=<n>` 指定非默认的位数。\n\
  \n`--full-name`\n不显示相对于当前工作目录的路径，而是显示完整路径名称。\n\n`--full-tree`\n不将列表限制在当前工作目录。隐含\
  \ `--full-name`。\n\n`[<path>...]`\n当给定路径时，显示它们（注意这并不是原始路径名，而是匹配的模式列表）。否则，隐式使用树的根层级作为唯一的路径参数。\n\
  \n## 输出格式\n`<mode> SP <type> SP <object> TAB <file>`\n\n除非使用 `-z` 选项，否则路径中的 TAB、LF\
  \ 和反斜杠字符分别表示为 \\t、\\n 和 \\\\。此输出格式与 `git update-index --index-info --stdin` 的期望兼容。\n\
  \n当使用 `-l` 选项时，格式变为：\n`<mode> SP <type> SP <object> SP <object size> TAB <file>`\n\
  \n由 `<object>` 标识的对象大小以字节给出，并右对齐，最小宽度为 7 个字符。对象大小适用于 blob（文件）项；对于其他项，使用字符代替大小。\n\
  \n# GIT-MAILSPLIT\n\n## 名称\n`git-mailsplit` - 简单的 UNIX mbox 分割程序\n\n## 语法\n`git\
  \ mailsplit [-b] [-f<nn>] [-d<prec>] [--keep-cr] -o<directory> [--] [(<mbox>|<Maildir>)...]`\n\
  \n## 描述\n将 mbox 文件或 Maildir 分割为指定目录的文件列表：\"0001\" \"0002\" ..以便你可以从那里进行进一步处理。\n\n\
  **重要**\nMaildir 分割依赖于文件名排序，以便按正确的顺序输出补丁。\n\n## 参数\n`<mbox>`\n要分割的 mbox 文件。如果未给出，则从标准输入读取\
  \ mbox。\n\n`<Maildir>`\n要分割的 Maildir 根目录。该目录应包含 cur、tmp 和 new 子目录。\n\n`-o<directory>`\n\
  放置单个消息的目录。\n\n`-b`\n如果任何文件不以 From 行开头，则假设它是单条邮件消息而不是信号错误。\n\n`-d<prec>`\n与默认的 4\
  \ 位前导零不同，可以为生成的文件名指定不同的精度。\n\n`-f<nn>`\n跳过前 `<nn>` 个数字，例如，如果指定了 `-f3`，则从 0004 开始编号。\n\
  \n`--keep-cr`\n不删除以 \\r\\n 结尾的行中的 \\r。\n\n# GIT-MERGE-BASE\n\n## 名称\n`git-merge-base`\
  \ - 为合并寻找尽可能佳的共同祖先\n\n## 语法\n`git merge-base [-a|--all] <commit> <commit>...`\n\
  `git merge-base [-a|--all] --octopus <commit>...`\n`git merge-base --is-ancestor\
  \ <commit> <commit>`\n`git merge-base --independent <commit>...`\n`git merge-base\
  \ --fork-point <ref> [<commit>]`\n\n## 描述\n`git merge-base` 在两个提交之间寻找最佳共同祖先，以用于三路合并。如果一个共同祖先是另一个共同祖先的祖先，则后一个比前者更好。一个没有任何更佳共同祖先的共同祖先就是*最佳共同祖先*，即合并基准（merge\
  \ base）。注意，一对提交可能存在多个合并基准。\n\n## 模式\n作为最常见的特殊情况，在命令行上仅指定两个提交意味着计算给定两个提交之间的合并基准。\n\
  \n更通地说，在要计算合并基准的两个提交之间，一个由第一个提交参数指定；另一个提交是命令行上剩余提交的（假设的）提交。\n\n结果是，当指定多个提交时，合并基准并不在每个提交参数中。这与使用\
  \ merge-base 选项时与 (1) 不同。\n\n`--octopus`\n为所有提交计算最佳共同祖先，为 n 路合并做准备。这模拟了 `git show-branch\
  \ --merge-base` 的行为。\n\n`--independent`\n不是打印合并基准，而是打印相同提交的最小子集。也就是说，在给定的提交中，列出无法从其他提交到达的提交。这模拟了\
  \ `git show-branch --independent` 的行为。\n\n`--is-ancestor`\n检查第一个 `<commit>` 是否是第二个\
  \ `<commit>` 的祖先，如果是则以状态 0 退出，否则以状态 1 退出。错误通过非 1 的零状态信号。\n\n`--fork-point`\n寻找分支（或任何指向\
  \ <commit> 的历史）从另一个分支（或任何引用）<ref> 分叉的点。这不仅寻找两个提交的共同祖先，还考虑 <ref> 的 reflog，以查看指向 <commit>\
  \ 的历史是否是从分支 <ref> 的早期版本分支的（参见下面的讨论）。\n\n## 参数\n`-a, --all`\n输出提交的所有合并基准，而只有一个。\n\
  \n## 讨论\n给定两个提交 *A* 和 *B*，git merge-base A B 将输出父关系从 *A* 和 *B* 到达的提交。\n\n例如，具有如下拓扑结构：\n\
  \n`o---o---o---B / ---o---1---o---o---o---A`\n\n\n\n\n`A` 和 `B` 之间的合并基是 `1`。\n\n\
  给定三个提交 `A`、`B` 和 `C`，`git merge-base A B C` 将计算 `A` 与假设提交 `M` 之间的合并基，其中 `M` 是 `B`\
  \ 和 `C` 的合并。例如，具有如下拓扑结构：\n\n```\no---o---o---o---C / / o---o---o---B / / ---2---1---o---o---o---A\n\
  ```\n\n`git merge-base A B C` 的结果是 `1`。这是因为在 `B` 和 `C` 之间存在合并提交 `M` 的等效拓扑结构为：\n\n\
  ```\no---o---o---o---o / \\ / o---o---o---o---M / / ---2---1---o---o---o---A\n```\n\
  \n`git merge-base A M` 的结果是 `1`。提交 `2` 也是 `A` 和 `M` 的共同祖先，但 `1` 是更好的共同祖先，因为 `2`\
  \ 是 `1` 的祖先。因此，`2` 不是合并基。\n\n`git merge-base --octopus A B C` 的结果是 `2`，因为 `2` 是所有提交的最优共同祖先。\n\
  \n当历史涉及交叉合并（criss-cross merges）时，两个提交可能存在多个*最佳*共同祖先。例如，具有如下拓扑结构：\n\n```\n---1---o---A\
  \ \\ / X / \\ ---2---o---o---B\n```\n\n`1` 和 `2` 都是 `A` 和 `B` 的合并基。它们互不优（都是最佳合并基）。在没有给出\
  \ `--all` 选项的情况下，未指定输出哪一个最佳。\n\n检查两个提交 `A` 和 `B` 之间是否为“快进”（fast-forward）的常用写法（或过去常用）是计算\
  \ `A` 和 `B` 之间的合并基，并检查它是否等于 `A`，如果是则 `A` 是 `B` 的祖先。你会在旧脚本中经常看到这种用法。\n\n```\nA=$(git\
  \ rev-parse --verify A) if test \"$A\" = \"$(git merge-base A B)\" then ... A is\
  \ an ancestor of B ... fi\n```\n\n在现代 git 中，你可以用更直接的方式表达：\n\n```\nif git merge-base\
  \ --is-ancestor A B then ... A is an ancestor of B ... fi\n```\n\n而不是上述写法。\n\n##\
  \ 关于分支点模式（FORK-POINT MODE）的讨论\n\n在通过 `git checkout -b topic origin/master` 创建的主分支上工作后，远程追踪分支\
  \ `origin/master` 的历史可能被回滚并重建，导致如下形状的历史：\n\n```\no---B1 / ---o---o---B2--o---o---o---B\
  \ (origin/master) \\ B3 \\ Derived (topic)\n```\n\n其中 `origin/master` 曾经指向提交 `B3`、`B2`、`B1`，现在指向\
  \ `B`，而你的主题分支是在 `origin/master` 处于 `B3` 时在其上方开始创建的。该模式使用 `origin/master` 的 reflog\
  \ 来找到 `B3` 作为分支点，从而可以将主题分支在在更新后的 `origin/master` 之上进行 rebase：\n\n```\n$ fork_point=$(git\
  \ merge-base --fork-point origin/master topic) $ git rebase --onto origin/master\
  \ $fork_point topic\n```\n\n## 另参\n\n(1), (1), (1)\n\n* *\n\n# GIT-MERGE-FILE\n\n\
  ## 名称\n\n`git-merge-file` - 执行三路文件合并\n\n## 语法\n\n`git merge-file` `[-L <current-name>\
  \ [-L <base-name> [-L <other-name>]]] [--ours|--theirs|--union] [-p|--stdout] [-q|--quiet]\
  \ [--marker-size=<n>] [--[no-]diff3] <current-file> <base-file> <other-file>`\n\
  *(注：原文在命令周围使用了反引号，根据指令予以保留)*\n\n## 描述\n\n`git merge-file` 将从 `<base-file>` 到 `<other-file>`\
  \ 的所有更改合并到 `<current-file>` 中。结果通常进入 `<current-file>`。`git merge-file` 有助于合并对原始文件的多个独立修改。假设\
  \ `<base-file>` 是原始文件，且 `<current-file>` 和 `<other-file>` 都是 `<base-file>` 的修改，那么\
  \ `git merge-file` 将合并这两处更改。\n\n如果 `<current-file>` 和 `<other-file>` 在公共行范围内都有更改，则发生冲突。如果发现冲突，`git\
  \ merge-file` 通常会输出警告并用包含 `<<<<<<<` 和 `>>>>>>` 标记的行将冲突括起来。典型的冲突如下：\n\n```\n<<<<<<<\
  \ A lines in file A ======= lines in file B >>>>>>> B\n```\n\n如果存在冲突，用户应该编辑结果并删除其中一种方案。然而，当\
  \ `--ours`、`--theirs` 或 `--union` 选项生效时，这些冲突将分别倾向于 `<current-file>` 的行、`<other-file>`\
  \ 的行或两者的行。冲突标记的长度可以通过 `--marker-size` 选项指定。\n\n该程序的退出值在出错时为负数，否则为冲突的数量。如果合并顺利，退出值为\
  \ 0。\n\n`git merge-file` 设计为 RCS `merge` 的最小化克隆；换之，它实现了 (1) 所需的所有 RCS `merge` 功能。\n\
  \n### 选项\n\n-L `<label>`\n\n此选项最多可给出三次，用于指定在冲突报告中代替相应文件名的标签。即，`git merge-file -L\
  \ x -L y -L z a b c` 生成的输出看起来来自文件 `x`、`y` 和 `z`，而不是文件 `a`、`b` 和 `c`。\n\n-p\n\n将结果发送到标准输出而不是覆盖\
  \ `<current-file>`。\n\n-q\n\n静默模式；不对冲突发出警告。\n\n--diff3\n\n以 \"diff3\" 样式显示冲突。\n\n\
  --ours, --theirs, --union\n\n不再在文件中保留冲突，而是通过倾向于我们（或他们或双方）的行来解决冲突。\n\n## 示例\n\n```\n\
  git merge-file README.my README README.upstream\n```\n\n合并 `README.my` 和 `README.upstream`\
  \ 自 `README` 以来产生的更改，尝试合并它们并将结果写入 `README.my`。\n\n```\ngit merge-file -L a -L b\
  \ -L c tmp/a123 tmp/b234 tmp/c345\n```\n\n以 `tmp/b234` 为基合并 `tmp/a123` 和 `tmp/c345`，但使用\
  \ `a` 和 `c` 代替 `tmp/a123` 和 `tmp/c345`。\n\n* *\n\n# GIT-MERGE-INDEX\n\n## 名称\n\n\
  `git-merge-index` - 为需要合并的文件执行合并\n\n## 语法\n\n`git merge-index` `[-o] [-q] <merge-program>\
  \ (-a | [--] <file>*)`\n\n## 描述\n\n这会在索引中查找 `<file>(s)`，如果有任何合并条目，会将这些文件的 SHA-1\
  \ 哈希值作为参数 1、2、3 传递（如果没有文件则为空），并将 `<file>` 作为参数 4。三个文件的文件模式将作为参数 5、6 和 7 传递。\n\n\
  ### 选项\n\n--\n\n不再将任何后续参数视为选项。\n\n-a\n\n对索引中所有需要合并的文件运行合并。\n\n-o\n\n不要在第一次合并失败时停止，一次性处理所有合并。\n\
  \n-q\n\n不对合并失败报错（合并程序失败通常表示合并期间存在冲突）。这对于可能输出自定义消息的瓷器（porcelains）很有用。\n\n如果 `git\
  \ merge-index` 调用多个 `<file>`（或 -a），它将按顺序处理，仅在合并返回非零退出码时停止。\n\n通常这是通过脚本运行 Git 对 RCS\
  \ `merge` 命令的模拟。\n\n发行中包含一个名为 `git-merge-file` 的示例脚本。\n\n警告 警告 警告！Git 的“合并对象顺序”与\
  \ RCS `merge` 程序不同。在上述排序中，原始文件在前。但三路合并程序 `merge` 的参数顺序是将原始文件放在中间。别问为什么。\n\n示例：\n\
  \n```\n:~/merge-test> git merge-index cat MM 原始树中的 MM。# 分支 A 中的修改 MM。# merge1 分支\
  \ B 中的修改 MM。# merge2 分支 B 中的修改 MM。# 当前内容\n```\n\n或者\n\n```\n:~/merge-test> git merge-index\
  \ cat AA MM cat: : No file or directory 分支 A 中的新增 AA。分支 B 中的新增 AA。分支 B 中的新增 AA。致命错误：合并程序失败\n\
  ```\n\n其中后一个示例显示了 `git merge-index` 在任何内容返回错误后将停止尝试合并（即 `cat` 对于 `AA` 文件返回了错误，因为在原始文件中不存在，因此\
  \ `git merge-index` 甚至没有尝试合并 `MM` 东西）。\n\n* *\n\n# GIT-MERGE-ONE-FILE\n\n## 名称\n\
  \n`git-merge-one-file` -  git-merge-index 使用的标准辅助程序\n\n## 语法\n\n`git merge-one-file`\n\
  \n## 描述\n\n这是供 `git merge-index` 用于解析通过 `git read-tree -m` 完成的简易合并的标准辅助程序。\n\n*\
  \ *\n\n# GIT-MERGE-TREE\n\n## 名称\n\n`git merge-tree` - 在不接触索引的情况下显示三路合并\n\n## 语法\n\
  \n`git merge-tree` `<base-tree> <branch1> <branch2>`\n\n## 描述\n\n\n\n\n\n读取三个树状对象，并将简易的合并结果和冲突阶段输出到标准输出。这与三路\
  \ `git read-tree -m` 的作用类似，但它不是将结果存储在索引中，而是将项输出到标准输出。\n\n此命令旨在用于高级脚本，在索引之外计算合并结果，并将结果写回索引。因此，该命令的输出会省略与\
  \ `<branch1>` 树匹配的项。\n\n# GIT-MERGE\n\n## 名称\n\n`git-merge` - 将两个或多个开发历史合并\n\n##\
  \ 概要\n\n`git merge [-n] [--stat] [--no-commit] [--squash] [--[no-]edit] [-s <strategy>]\
  \ [-X <strategy-option>] [-S[<key-id>]] [--[no-]rerere-autoupdate] [-m <msg>] [<commit>...]`\n\
  `git merge <msg> HEAD <commit>...`\n`git merge --abort`\n\n## 描述\n\n将指定提交（自其历史与当前分支分叉以来）的更改合并到当前分支。该命令被\
  \ `git pull` 用于合并来自另一个仓库的更改，也可以手动用于将一个分支的更改合并到另一个分支。\n\n假设存在以下历史且当前分支为 \"master\"\
  ：\n\n`A---B---C topic / D---E---F---G master`\n\n那么 `git merge topic` 将 topic 分支自从\
  \ master 分叉以来的更改（即 E）直到其当前提交（C）重放到 master 之上，并将结果记录在一个新的提交中，同时包含两个父提交名称以及用户描述更改的日志消息。\n\
  \n`A---B---C topic / \\ D---E---F---G---H master`\n\n第二种语法 (`<msg> HEAD <commit>...`)\
  \ 出历史原因被支持。请勿在命令行或新脚本中使用它。它等同于 `git merge -m <msg> <commit>....`。\n\n第三种语法 (`\"\
  git merge --abort\"`) 只能在合并产生冲突后运行。`git merge --abort` 将中止合并过程并尝试重构合并前的状态。然而，如果在合并开始时存在未提交的更改（特别是如果这些更改在合并开始后被进一步修改），某些情况下\
  \ `git merge --abort` 将无法还原原始（合并前）更改。因此：\n\n**警告**：不建议在存在非复杂的未提交更改时运行 `git merge`：虽然可行，但在发生冲突时，它可能会让你处于一种难以撤销的状态。\n\
  \n### 选项\n\n`--commit, --no-commit`\n\n执行合并并提交结果。此选项可覆盖 `--no-commit`。\n\n使用 `--no-commit`\
  \ 执行合并，但假装合并失败且不自动提交，以便用户在提交前有机会检查并进一步微调合并结果。**\n\n`--edit, -e, --no-edit`\n\n在对成功的机械合并提交之前调用编辑器，进一步编辑自动生成的合并消息，以便用户解释并证明合并的合理性。`--no-edit`\
  \ 选项用于接受自动生成的消息（这通常是不建议的）。如果你通过命令行使用 `-m` 选项提供了草稿消息并想在编辑器中编辑，则 `--edit`（或 `-e`）选项仍然有用。\n\
  \n旧的脚本可能依赖于过去不允许用户编辑合并日志消息的历史行为。它们在运行 `git merge` 时会看到编辑器打开。为了方便将此类脚本调整为更新后的行为，可以在开头将环境变量\
  \ `GIT_MERGE_AUTOEDIT` 设置为 `no`。\n\n`--ff`\n\n当合并解析为快进（fast-forward）时，仅更新分支指针，而不创建合并提交。这是默认行为。\n\
  \n`--no-ff`\n\n即使合并解析为快进，也创建一个合并提交。这是合并带注释（且可能已签名的）标签时的默认行为。\n\n`--ff-only`\n\n\
  除非当前 `HEAD` 已经是最新的，或者合并可以解析为快进，否则将拒绝合并并以非零状态退出。\n\n`--log[=<n>], --no-log`\n\n除了分支名称外，在日志消息中填充最多\
  \ `<n>` 个正在合并的实际提交的单行描述。另参见 (1)。\n\n使用 `--no-log` 不列出正在合并的实际提交的单行描述。\n\n`--stat,\
  \ -n, --no-stat`\n\n在合并结束时显示差异统计（diffstat）。diffstat 也由配置选项 `merge.stat` 控制。\n\n\
  使用 `-n` 或 `--no-stat` 不在合并结束时显示差异统计。\n\n`--squash, --no-squash`\n\n产生工作树和索引状态，就像发生了真实的合并一样（但合并信息除外），但实际上不会创建提交、移动\
  \ `HEAD` 或记录 `$GIT_DIR/MERGE_HEAD`（这会导致下次 `git commit` 命令创建一个合并提交）。这允许你在当前分支上创建一个提交，其效果等同于合并另一个分支（如果是章鱼合并则为多个）。\n\
  \n使用 `--no-squash` 执行合并并提交结果。此选项可覆盖 `--squash`。\n\n`-s <strategy>, --strategy=<strategy>`\n\
  \n使用指定的合并策略；可以多次提供以指定尝试的顺序。如果没有 `-s` 选项，则使用内置策略列表（合并单个头节点时使用 `git merge-recursive`，否则使用\
  \ `git merge-octopus`）。\n\n`-X <option>, --strategy-option=<option>`\n\n将合并策略特定的选项传递给合并策略。\n\
  \n`--verify-signatures, --no-verify-signatures`\n\n验证正在合并的提交具有良好且受信任的 GPG 签名，如果没有则中止合并。\n\
  \n`--summary, --no-summary`\n\n`--stat` 和 `--no-stat` 的同义词；这些已弃用，并将在未来移除。\n\n`-q,\
  \ --quiet`\n\n静默操作。隐含 `--no-progress`。\n\n`-v, --verbose`\n\n详细输出。\n\n`--progress,\
  \ --no-progress`\n\n显式开启/关闭进度显示。如果未指定，当标准错误连接到终端时将显示进度。注意，并非所有的合并策略都支持进度报告。\n\n\
  `-S[<keyid>], --gpg-sign[=<keyid>]`\n\n对生成的合并提交进行 GPG 签名。\n\n`-m <msg>`\n\n设置用于合并提交的消息（如果创建了提交）。\n\
  \n如果指定了 `--log`，会将合并提交的短日志追加到指定的消息中。\n\n可以使用 `git fmt-merge-msg` 命令为自动化的 `git merge`\
  \ 调用提供良好的默认值。\n\n`--[no-]rerere-autoupdate`\n\n允许 rerere 机制在可能的情况下使用自动冲突解决的结果更新索引。\n\
  \n`--abort`\n\n中止当前的冲突解决过程，并尝试重构合并前的状态。如果在合并开始时存在未提交的工作树更改，某些情况下 `git merge --abort`\
  \ 将无法还原这些更改。因此，建议在运行 `git merge` 之前始终提交或储存（stash）你的更改。\n\n当存在 `MERGE_HEAD` 时，`git\
  \ merge --abort` 等同于 `git reset --merge`。\n\n`<commit>...`\n\n要合并到我们分支的提交，通常是其他分支头。指定多个提交将创建一个具有多个父提交的合并（亲切地称为章鱼合并）。\n\
  \n如果未从命令行提供提交，则合并当前分支配置为使用的上游的远程跟踪分支。参见此手册页的配置部分。\n\n当指定 `FETCH_HEAD`（且未指定其他提交）时，上一次调用\
  \ git fetch 记录在 `.git/FETCH_HEAD` 文件中的分支将合并到当前分支。\n\n## 合并前检查\n\n在应用外部更改之前，你应该将自己的工作处理好良好状态并在本地提交，这样在发生冲突时就不会被覆盖。另参见\
  \ (1)。当本地未提交的更改与 `git pull`/*git merge` 可能需要更新的文件重叠时，`git pull` 和 `git merge` 将停止而不执行任何操作。\n\
  \n\n\n\n为了避免在合并提交中记录无关的更改，如果索引中相对于 `HEAD` 提交有任何已的更改，`git pull` 和 `git merge` 也会中止。（异常情况是：更改的索引条目所处已经是合并后的结果了。）\n\
  \n如果所有命名的提交已经是 `HEAD` 的祖先，`git merge` 将提前退出并显示消息“Already up-to-date.”。\n\n## 快进合并\
  \ (FAST-FORWARD MERGE)\n\n通常情况下，当前分支的头节点是命名提交的祖先。这是最常见的情况，特别是在通过 `git pull` 调用时：你正在跟踪一个远程仓库，你没有提交任何本地更改，现在你想更新到更新的远程版本。在这种情况下，不需要新的提交来存储合并后的历史；相反，`HEAD`（以及索引）将更新为指向命名的提交，而不会创建一个额外的合并提交。\n\
  \n可以通过 `--no-ff` 选项来抑制这种行为。\n\n## 真正的合并 (TRUE MERGE)\n\n除了快进合并（见上文）外，要合并的分支必须通过一个合并提交在一起，该提交将这两个分支都作为其父节点。\n\
  \n会将所有待合并分支的更改协调后的合并版本提交，并且你的 `HEAD`、索引和工作树将更新为该版本。只要工作树中的修改不重叠，就可以存在这些修改；更新将保留它们。\n\
  \n当不清楚如何协调更改时，会发生以下：\n\n1. `HEAD` 指针保持不变。\n2. `MERGE_HEAD` 引用被设置为指向另一个分支的头。\n3.\
  \ 清洁合并的路径在索引文件和你的工作树中都会更新。\n4. 对于冲突路径，索引文件记录最多三个版本：stage 1 存储公共祖先的版本，stage 2 存储\
  \ `HEAD` 的版本，stage 3 存储 `MERGE_HEAD` 的版本（可以使用 `git ls-files -u` 查看这些阶段）。工作树文件包含“合并”程序的结果；即带有熟悉的冲突标记\
  \ `<<<===>>>` 的三路合并结果。\n5. 不进行任何其他更改。特别是你在开始合并之前的本地修改将保持不变，它们的索引条目也保持原样，即与 `HEAD`\
  \ 匹配。\n\n如果你尝试了导致复杂冲突的合并并想重新开始，可以使用 `git merge --abort` 进行恢复。\n\n## 合并标签 (MERGING\
  \ TAG)\n\n在合并注释（并可能签过）标签时，Git 总是会创建一个合并提交，即使可以进行快进合并，并且使用标签消息准备消息模板。此外，如果标签经过了签名，签名检查将作为注释报告在消息模板中。参见\
  \ (1)。\n\n当你只想与通向标签提交的工作进行集成（例如，与远程发布点同步）时，你可能不想创建一个不必要的合并提交。\n\n在这种情况下，你可以在将其传递给\
  \ `git merge` 之前自己“解包”标签，或者在你没有任何自己的工作时传递 `--ff-only`。例如：\n\n```\ngit fetch origin\
  \ git merge v1.2.3⁰ git merge --ff-only v1.2.3\n```\n\n## 冲突是如何呈现的\n\n在合并期间，工作树文件将被更新以反映合并的结果。在对公共祖先版本所所的更改中，不重叠的更改（即你更改了文件的一个区域，而另一侧保持该区域完好，反之亦然）将原封不动地包含在最终结果。然而，当双方都对同一区域进行了更改时，Git\
  \ 无法随机选择其中一方而非另一方，并要求你通过保留双方对该区域所的操作来解决它。\n\n默认情况下，Git 使用与 RCS 套件中的“merge”程序相同的样式来呈现此类冲突块，如下：\n\
  \n```\nHere are lines that are either unchanged from the common ancestor, or cleanly\
  \ resolved because only one side changed. <<<<<<< yours:sample.txt Conflict resolution\
  \ is hard; let's go shopping. ======= Git makes conflict resolution easy. >>>>>>>\
  \ theirs:sample.txt And here is another line that is cleanly resolved or unmodified.\n\
  ```\n\n发生一对冲突更改的区域用 `<<<<<<<`、`=======` 和 `>>>>>>>` 标记标记。`=======` 之前的部分通常是你的侧，`=======`\
  \ 之后的部分通常是他们侧。\n\n默认格式不显示冲突区域的原始内容。你无法判断你侧有多少行被删除并替换为关于芭比的评论。你唯一能确定的是你的一侧想说这很难，而且你更倾向于去购物，而另一侧则声称这很容易。\n\
  \n通过将配置变量 `merge.conflictStyle` 设置为 \"diff3\"，可以使用另一种样式。在 \"diff3\" 样式中，上述冲突可能像这样：\n\
  \n```\nHere are lines that are either unchanged from the common ancestor, or cleanly\
  \ resolved because only one side changed. <<<<<<< yours:sample.txt Conflict resolution\
  \ is hard; let's go shopping. ||||||| Conflict resolution is hard. ======= Git makes\
  \ conflict resolution easy. >>>>>>> theirs:sample.txt And here is another line that\
  \ is cleanly resolved or unmodified.\n```\n\n除了 `<<<<<<<`、`=======` 和 `>>>>>>>`\
  \ 标记外，它使用了另一个 `|||||||` 标记，后面跟着原始文本。你可以看出原始文本只是陈述了一个事实，你的一侧只是顺从了该声明并放弃了，而另一侧试图采取更积极的态度。你有时可以通过查看原始文本找到更好的解决方案。\n\
  \n## 如何解决冲突 (HOW TO RESOLVE CONFLICTS)\n\n看到冲突后，你可以做两件事：\n\n1. 决定不合并。你需要的清理是将索引文件重置为\
  \ `HEAD` 提交以撤销操作 2，并清理操作 2 和 3 产生的工作树更改；可以使用 `git merge --abort` 完成此。\n2. 解决冲突。Git\
  \ 会在工作树中标记冲突。编辑文件使其正确并使用 `git add` 将它们添加到索引。使用 `git commit` 最终定稿。\n\n你可以使用多种工具处理冲突：\n\
  \n- 使用 mergetool。运行 `git mergetool` 启动图形化合并工具，它将引导你完成合并。\n- 查看差异。`git diff` 将显示三路差异，突出来自\
  \ `HEAD` 和 `MERGE_HEAD` 版本的更改。\n- 查看每个分支的差异。`git log --merge -p <path>` 将先显示 `HEAD`\
  \ 版本的差异，然后显示 `MERGE_HEAD` 版本的差异。\n- 查看原始文件。`git show :1:filename` 显示公共祖先，`git show\
  \ :2:filename` 显示 `HEAD` 版本，`git show :3:filename` 显示 `MERGE_HEAD` 版本。\n\n## 示例\
  \ (EXAMPLES)\n\n在分支之上合并修复和增强，进行章鱼合并：\n\n```\n$ git merge fixes enhancements\n```\n\
  \n使用 `ours` 合并策略将 `obsolete` 分支合并到当前分支：\n\n```\n$ git merge -s ours obsolete\n```\n\
  \n将 `maint` 分支合并到当前分支，但不自动创建新提交：\n\n```\n$ git merge --no-commit maint\n```\n\n\
  当你想要在合并中包含更多更改，或想编写自己的合并提交消息时可以使用此选项。你应该避免滥用此选项将重大更改悄溜入合并提交中。像更新发布/版本名称这样的小幅修复是可以接受的。\n\
  \n## 合并策略 (MERGE STRATEGIES)\n\n合并机制（`git merge` 和 `git pull` 命令）允许通过 `-s` 选项选择后端合并策略。某些策略还可以接受自己的选项，可以通过向\
  \ `git merge` 和/或 `git pull` 提供 `-X<option>` 参数来传递。\n\nresolve\n\n这只能使用三路合并算法解决两个头（即当前分支和你从其拉取的的另一个分支）。它尝试仔细检测交叉合并的歧义，并通常被认为是安全且快速的。\n\
  \nrecursive\n\n\n\n\n这种方法仅使用 3 路合并算法解决两个头提交。当存在多个一个可用于 3 路合并的共同祖先时，它会创建一个共同祖先的合并树，并将其用作\
  \ 3 路合并的引用树。根据对 Linux 2.6 内核开发历史中实际合并提交的测试，这种方法可以减少合并冲突，且不会导致错误合并（mismerges）。此外，它还能检测并处理涉及重命名的合并。这是拉取或合并单个分支时的默认合并策略。\n\
  \n`recursive` 策略可以接受以下选项：\n\n### ours\n此选项强制通过优先考虑 `our`（我们的）版本来对冲突的代码块进行自动清洁解决。另一个树中与我们的一侧不冲突的更改将反映在合并结果中。对于二进制文件，整个内容将从我们这边获取。\n\
  \n这不应与 `ours` 合并策略混淆，后者完全不查看另一个树包含什么。它会丢弃另一个树的所有操作，并声明我们的 `our` 历史包含了其中发生的所有事件。\n\
  \n### theirs\n这是 `ours` 的相反选项。\n\n### patience\n使用此选项时，`merge-recursive` 会花费一点额外时间来避免有时因不重要的匹配行（例如不同函数的括号括号）而导致的错误合并。当要合并的分支发生巨大差异时请使用此选项。另见\
  \ (1)--patience。\n\n### diff-algorithm=[patience|minimal|histogram|myers]\n告诉 `merge-recursive`\
  \ 使用不同的 diff 算法，这有助于避免因不重要的匹配行（如不同函数的大括号）而导致的错误合并。另见 (1)--diff-algorithm。\n\n###\
  \ ignore-space-change, ignore-all-space, ignore-space-at-eol\n为了进行三路合并，将具有指定类型空格更改的行视为未更改。与行其他更改混合的空格更改不会被忽略。另见\
  \ (1)-b, -w 和 `--ignore-space-at-eol`。\n\n- 如果 `their`（他们的）版本仅对某行引入了空格更改，则使用 `our`\
  \ 版本；\n- 如果 `our` 版本引入了空格更改，但 `their` 版本包含实质性更改，则使用 `their` 版本；\n- 否则，合并按通常方式进行。\n\
  \n### renormalize\n在解决三路合并时，对文件的所有三个阶段运行虚拟检出和检入。此选项用于合并具有不同清理过滤器（clean filters）或行尾规范化规则的分支。详见\
  \ (5) 中的“合并具有不同检入/检出属性的分支”。\n\n### no-renormalize\n禁用 `renormalize` 选项。这会覆盖 `merge.renormalize`\
  \ 配置变量。\n\n### rename-threshold=<n>\n控制用于重命名检测的相似性阈值。另见 (1)-M。\n\n### subtree[=<path>]\n\
  此选项是 `subtree` 策略的更高级的形式，该策略在合并时会猜测两个树必须如何移动以相互匹配。相反，会在指定的路径前加上前缀（或从开头删除），以使两个树的形状相匹配。\n\
  \n### octopus\n这种方法解决多于两个头提交的情况，但拒绝执行需要手动解决的复杂合并。它主要用于将多个主题分支头打包在一起。这是拉取或合并两个以上分支时的默认合并策略。\n\
  \n### ours\n这种方法解决任意数量的头，但合并生成的树始终是当前分支头，有效地忽略了来自所有其他分支的所有更改。它用于取代侧分支的开发历史。注意，这与\
  \ `recursive` 合并策略的 `-Xours` 选项不同。\n\n### subtree\n这是一个改进的递归策略。在合并树 A 和 B 时，如果 B\
  \ 对应于 A 的子树，则先调整 B 以匹配 A 的树结构，而不是在相同级别读取树。这种调整也会对共同祖先树进行。\n\n对于使用 3 路合并的策略（包括默认的\
  \ `recursive`），如果两个分支上都进行了更改，但随后在一个分支上撤销了该更改，则该更改将出现在合并结果中；有些人发现这种行为很令人困惑。这是因为在执行合并时只考虑头和合并基底（merge\
  \ base），而不考虑单个提交。因此，合并算法将撤销的更改视为没有任何更改，并代之以更改后的版本。\n\n## 配置 (CONFIGURATION)\n\n\
  ### merge.conflictStyle\n指定合并时将冲突代码块写入工作树文件中的样式。默认值是 \"merge\"，它会显示 `<<<<<<<` 冲突标记、一侧的更改、`=======`\
  \ 标记、另一侧的更改，然后是 `>>>>>>>` 标记。另一种样式 \"diff3\" 会在 `=======` 标记之前添加 `|||||||` 标记和原始文本。\n\
  \n### merge.defaultToUpstream\n如果在调用 merge 时没有带任何提交参数，则通过使用当前分支配置的上游分支在远程跟踪分支中存储的最后观测值来合并这些分支。会查询\
  \ `branch.<current branch>.merge` 来命名了由 `branch.<current branch>.remote` 指定的远程分支，然后通过\
  \ `remote.<remote>.fetch` 将其映射到相应的远程跟踪分支，并合并这些跟踪分支的末端。\n\n### merge.ff\n默认情况下，Git\
  \ 在合并作为当前提交之后代的提交时不会创建额外的合并提交。相反，当前分支的末端将进行快进（fast-forward）。当设置为 false 时，此变量告诉 Git\
  \ 在此类创建一个额外的合并提交（等同于在命令行提供 `--no-ff` 选项）。当设为 only 时，仅允许此类快进合并（等同于在命令行提供 `--ff` 选项）。\n\
  \n### merge.branchdesc\n除了分支名称外，日志中还将填充相关的分支描述文本。默认值为 false。\n\n### merge.log\n\
  除了分支名称外，日志中还将从正在合并的实际提交中填充最多指定数量的单行描述。默认值为 false，true 是 20 的同义词。\n\n### merge.renameLimit\n\
  执行合并期间重命名检测时考虑的文件数；如果未指定，默认值为 `diff.renameLimit` 的值。\n\n### merge.renormalize\n\
  告诉 Git 仓库中文件的标准表示随时间发生了变化（例如，早期的提交记录了带有 CRLF 行结束的文本文件，但最近的使用 LF 结束）。在这样的仓库中，Git\
  \ 可以在执行合并之前将提交中记录的数据转换为标准形式以减少不必要的冲突。更多信息请参见 (5) 中的“合并具有不同检入/检出属性的分支”。\n\n### merge.stat\n\
  在合并结束时是否打印 `ORIG_HEAD` 和合并结果之间的 diffstat。默认 true true。\n\n### merge.tool\n控制 (1)\
  \ 使用哪种合并工具。下面的列表显示了有效的内置值。任何其他值都被视为自定义合并工具，并要求定义相应的 `mergetool.<tool>.cmd` 变量。\n\
  \n- araxis\n- bc\n- bc3\n- codecompare\n- deltawalker\n- diffmerge\n- diffuse\n\
  - emerge\n- emerge\n- gvimdiff\n- gvimdiff2\n- gvimdiff3\n- kdiff3\n- meld\n- opendiff\n\
  - p4merge\n- tkdiff\n- tortoisesemerge\n- vimdiff\n- vimdiff2\n- vimdiff3\n- winmerge\n\
  - xxdiff\n\n### merge.verbosity\n控制递归合并策略显示的输出量。级别 0 除了检测到冲突时的最终错误消息外不输出任何内容。级别\
  \ 1 输出冲突，2 输出冲突和文件更改。级别 5 及以上输出调试信息。默认级别为 2。可以通过环境变量 `GIT_MERGE_VERBOSITY` 覆盖。\n\
  \n### merge.<driver>.name\n为自定义低级合并驱动程序定义一个可读的名称。详见 (5)。\n\n### merge.<driver>.driver\n\
  定义实现自定义低级合并驱动程序的命令。详见 (5)。\n\n\n\n\n\n`merge.<driver>.recursive`\n\n命名一个低级合并驱动程序，用于在共同祖先之间执行内部合并时。详情参见\
  \ (5)。\n\n`branch.<name>.mergeOptions`\n\n设置合并到分支 `<name>` 的默认选项。语法和支持的选项与 `git\
  \ merge` 相同，但目前不支持包含空白字符的选项值。\n\n## 另请\n\n(1), (1), (5), (1), (1), (1), (1), (1),\
  \ (1)\n\n***\n\n# GIT-MERGETOOL--LIB\n\n## 名称\n\n`git-mergetool--lib` - 通用的 Git\
  \ 合并工具 shell 脚本\n\n## 概述\n\n```\nTOOL_MODE=(diff|merge) . \"$(git --exec-path)/git-mergetool--lib\"\
  `\n```\n\n## 描述\n\n这不是终端用户想要运行的命令。永远不会。此文档适用于正在研究瓷级（Porcelain-ish）脚本和/或正在编写新脚本的人。\n\
  \n`git-mergetool--lib` 脚本供其他 shell 脚本加载（使用 `.`），以设置处理 Git 合并工具的函数。\n\n在加载 `git-mergetool--lib`\
  \ 之前，你的脚本必须设置 `TOOL_MODE` 来定义下列函数的操作模式。`diff` 和 `merge` 是有效值。\n\n## 函数\n\n`get_merge_tool`\n\
  \n返回一个合并工具。\n\n`get_merge_tool_cmd`\n\n返回合并工具的自定义命令。\n\n`get_merge_tool_path`\n\n\
  返回合并工具的自定义路径。\n\n`run_merge_tool`\n\n根据工具名称和指示是否存在合并基的真/假标志启动合并工具。`$MERGED`、$LOCAL`、`$REMOTE`\
  \ 和 `$BASE` 必须定义供合并工具使用。\n\n***\n\n# GIT-MERGETOOL\n\n## 名称\n\n`git-mergetool` -\
  \ 运行冲突解决工具来解决合并冲突\n\n## 概述\n\n```\ngit mergetool [--tool=<tool>] [-y | --[no-]prompt]\
  \ [<file>...]\n```\n\n## 描述\n\n使用 `git mergetool` 运行多个合并工具之一来解决合并冲突。它通常在 `git merge`\
  \ 之后运行。\n\n如果给了一个或多个 `<file>` 参数，将运行合并工具程序来解决每个文件的差异（跳过没有冲突的文件）。指定目录将包含该路径下所有未解决的文件。如果没有指定任何\
  \ `<file>` 名称，`git mergetool` 将对每个具有合并冲突的文件运行合并工具程序。\n\n### 选项\n\n`-t <tool>, --tool=<tool>`\n\
  \n使用由 `<tool>` 指定合并解决程序。有效值包括 emerge, gvimdiff, kdiff3, meld, vimdiff 和 tortoisemerge。运行\
  \ `git mergetool --tool-help` 查看有效的 `<tool>` 设置列表。\n\n如果未指定合并解决程序，`git mergetool`\
  \ 将使用配置变量 `merge.tool`。如果未设置配置变量 `merge.tool`，`git mergetool` 将选择一个合适的默认值。\n\n你可以通过设置配置变量\
  \ `mergetool.<tool>.path` 来显式地提供工具的完整路径。例如，你可以通过设置 `mergetool.kdiff3.path` 配置 kdiff3\
  \ 的绝对路径。否则，`git mergetool` 假设工具在 `PATH` 中可用。\n\n与其运行已知的合并工具程序之一，`git mergetool`\
  \ 可以通过在配置变量 `mergetool.<tool>.cmd` 中指定调用命令行来定制运行替代程序。\n\n当使用此工具调用 `git mergetool`\
  \ 时（通过 `-t` 或 `--tool` 选项或 `merge.tool` 配置变量），将调用已配置的命令行，其中 `$BASE` 设置为包含合并共同基的临时文件名（如果可用）；`$LOCAL`\
  \ 设置为包含当前分支文件内容的临时文件名；`$REMOTE` 设置为包含待合并文件内容的临时文件名；而 `$MERGED` 设置为合并工具应写入合并解决结果的文件名。\n\
  \n如果自定义合并工具通过其退出码正确指示了合并解决的成功，则可以将配置变量 `mergetool.<tool>.trustExitCode` 设置为 true。否则，`git\
  \ mergetool` 将在自定义工具退出后提示用户指示解决是否成功。\n\n`--tool-help`\n\n打印可能与 `--tool` 使用的合并工具列表。\n\
  \n`-y, --no-prompt`\n\n在每次调用合并解决程序之前不进行提示。如果通过 `--tool` 选项或 `merge.tool` 配置变量显式指定了合并解决程序，则这是默认值。\n\
  \n`--prompt`\n\n在每次调用合并解决程序之前进行提示，给用户跳过路径的机会。\n\n## 临时文件\n\n`git mergetool` 在解决合并时会创建\
  \ `*.orig` 备份文件。一旦文件合并完成且 git-mergetool 会话结束，就可以安全地删除它们。\n\n将配置变量 `mergetool.keepBackup`\
  \ 设置为 false 会导致 `git mergetool` 在文件成功合并后自动删除备份。\n\n***\n\n# GIT-MKTAG\n\n## 名称\n\
  \n`git-mktag` - 创建标签对象\n\n## 概述\n\n```\ngit mktag < signature_file\n```\n\n## 描述\n\
  \n从标准输入读取标签内容，并创建一个也可以用于签名其他对象的标签对象。\n\n输出是新标签的 `<object>` 符。\n\n## 标签格式\n\n标签签名文件具有非常简单的固定格式：四行：\n\
  \n```\nobject <sha1> type <typename> tag <tagname> tagger <tagger>\n```\n\n随后是某些可选的自由格式消息（某些由旧\
  \ Git 创建的标签可能没有 tagger 行）。消息如果存在，则通过空行与头部分离。消息部分可能包含 Git 本身不关心的签名，但可以使用 gpg 进行验证。\n\
  \n***\n\n# GIT-MKTREE\n\n## 名称\n\n`git-mktree` - 从 ls-tree 格式的文本构建树对象\n\n## 概述\n\
  \n```\ngit mktree [-z] [--missing] [--batch]\n```\n\n## 描述\n\n以非递归的 ls-tree 输出格式读取标准输入，并创建一个树对象。树条目的顺序由\
  \ `mktree` 归一化，因此不需要对输入进行预排序。构建的树对象的对象名称将写入标准输出。\n\n### 选项\n\n`-z`\n\n读取以 NUL 终止的\
  \ ls-tree 输出代替。\n\n`--missing`\n\n允许缺失的对象。默认行为（不使用此选项）是验证每个条目的 sha1 标识现有对象。此选项对\
  \ gitlink 条目（即模块）没有影响，它们始终允许缺失。\n\n`--batch`\n\n允许在退出前构建多个树对象。每个树由空行分隔。最后的换行符是可选的。注意\
  \ -如果使用了 `-z` 选项，行以 NUL 终止。\n\n***\n\n# GIT-MV\n\n## 名称\n\n`git-mv` - 移动或重命名文件、目录或符号链接\n\
  \n## 概述\n\n```\ngit mv <options>... <args>...\n```\n\n## 描述\n\n移动或重命名文件、目录或符号链接。\n\
  \n```\ngit mv [-v] [-f] [-n] [-k] <source> <destination>\ngit mv [-v] [-f] [-n]\
  \ [-k] <source> ... <destination directory>\n```\n\n在第一形式中，它重命名 `<source>`（必须存在且是文件、符号链接或目录）为\
  \ `<destination>`。在第二形式中，最后一个参数必须是现有目录；指定的源将移动到该目录。\n\n成功完成后会更新索引，但必须提交更改。\n\n###\
  \ 选项\n\n`-f, --force`\n\n即使目标存在也强制重命名或移动文件\n\n`-k`\n\n跳过会导致错误条件的移动或重命名操作。当源既不存在也不受\
  \ Git 控制，或者当它将覆盖现有文件（除非给了 -f）时，会发生错误。\n\n`-n, --dry-run`\n\n什么都不做；仅显示将发生什么\n\n`-v,\
  \ --verbose`\n\n报告被移动的文件名。\n\n## 子模块\n\n使用 gitfile 移动子模块（这意味着是用 Git 1.7.8 或更高版本克的）将更新\
  \ gitfile 和 `core.worktree` 设置，以便子模块在新位置工作。它还会尝试更新 (5) 文件中的 `submodule.<name>.path`\
  \ 设置并暂存该文件（除非使用了 -n）。\n\n## 缺陷\n\n\n\n\n\n每当超级项目（superproject）更新移动了一个已填充的子模块（例如在移动前后的提交之间切换），旧位置将保留一个过时的子模块检出（checkout），而新位置会出现一个空目录。要在新位置重新填充子模块，用户必须在之后运行\
  \ `git submodule update`。只有当旧目录使用 `gitfile` 时，删除旧目录才是安全的，否则子模块的历史也将被删除。当实现递归子模块更新后，这两个步骤将变得过时。\n\
  \n# GIT-NAME-REV\n\n## NAME\n`git-name-rev` - 为给定的修订版本查找符号名称\n\n## SYNOPSIS\n`git\
  \ name-rev` [--tags] [--refs=<pattern>] ( --all | --stdin | <commit-ish>... )`\n\
  \n## DESCRIPTION\n对于任何可由 `git rev-parse` 解析的格式的修订，查找适合人类阅读的符号名称。\n\n## OPTIONS\n\
  --tags\n不使用分支名，仅使用标签（tags）命名提交。\n\n--refs=<pattern>\n仅使用名称匹配给定 shell 模式的引用（refs）。模式可以是分支名、标签名或完全限定的引用名。\n\
  \n--all\n列出从所有引用可及的所有提交。\n\n--stdin\n通过将标准输入中的所有 40 字符 SHA-1 十进制字符串（假设为 `$hex`）替换为\
  \ `\"$hex ($rev_name)\"`。与 --name-only 使用时，替换为 `$rev_name`，完全省略 `$hex`。供脚本编写使用。\n\
  \n--name-only\n不再同时打印 SHA-1 和名称，仅打印名称。如果与 --tags 一起使用，名称中还将省略常用的标签前缀 `\"tags/\"\
  `，这更接近 `git-describe` 的输出。\n\n--no-undefined\n当引用未定义时，以错误码 != 0 退出，而不是打印 undefined。\n\
  \n--always\n显示唯一缩短的提交对象作为回退。\n\n## EXAMPLE\n给定一个提交，找出它相对于本地引用（refs）的位置。假设有人向你提到了那个神奇的提交\
  \ `33db5f4d9027a10e477ccf054b2c1ab94f74c85a`。当然，你查看了提交，但这只能告诉你发生了什么，而不能告诉你上下文。\n\
  \n输入 `git name-rev`：\n```\n% git name-rev 33db5f4d9027a10e477ccf054b2c1ab94f74c85a\
  \ 33db5f4d9027a10e477ccf054b2c1ab94f74c85a tags/v0.99~940\n```\n现在你更理智了，因为你知道它发生在\
  \ `v0.99` 之前的 940 次修订中。\n\n你可以做的另一件好事是：\n```\n% git log | git name-rev --stdin\n\
  ```\n\n# GIT-NOTES\n\n## NAME\n`git-notes` - 添加或检查对象注释\n\n## SYNOPSIS\n`git notes`\
  \ [list [<object>]]\n`git notes` add [-f] [--allow-empty] [-F <file> | -m <msg>\
  \ | (-c | -C) <object>] [<object>]`\n`git notes` copy [-f] ( --stdin | <from-object>\
  \ <to-object> )`\n`git notes` append [--allow-empty] [-F <file> | -m <msg> | (-c\
  \ | -C) <object>] [<object>]`\n`git notes` edit [--allow-empty] [<object>]`\n`git\
  \ notes` show [<object>]`\n`git notes` merge [-v | -q] [-s <strategy> ] <notes-ref>`\n\
  `git notes` merge --commit [-v | -q]`\n`git notes` merge --abort [-v | -q]`\n`git\
  \ notes` remove [--ignore-missing] [--stdin] [<object>...]`\n`git notes` prune [-n\
  \ | -v]`\n`git notes` get-ref`\n\n## DESCRIPTION\n添加、删除或读取附加到对象上的注释而不触碰对象本身。\n\n\
  默认情况下，注释保存并读取自 `refs/notes/commits`，但可以覆盖此默认。请参下文的 OPTIONS、CONFIGURATION 和 ENVIRONMENT\
  \ 部分。\n\n## SUBCOMMANDS\nlist\n列出给定对象的注释。如果没有给出对象，则显示所有注释。\n\nadd\n向对象添加注释（默认为 HEAD）。如果该对象已有注释，除非使用\
  \ `-f`，否则将失败。\n\nappend\n向对象追加注释（默认为 HEAD）。如果对象不存在，则创建它。\n\nedit\n编辑给定对象的注释（默认为\
  \ HEAD）。这会打开编辑器。\n\nshow\n显示给定对象的注释（默认为 HEAD）。\n\nmerge\n将给定的注释引用（ref）合并到当前注释中。如果发生冲突且未给出策略，则使用手动解析器。这会在特殊的工作树\
  \ `.git/MERGE_WORKTREE` 中检出冲突的注释。\n\n--commit\n通过提交注释完成合并。\n\n--abort\n中止合并。\n\n\
  remove\n删除给定对象的注释。\n\nprune\n删除所有不存在/不可及对象的注释。\n\nget-ref\n打印当前的注释引用。\n\n\n\n\n\n\
  请求从一个没有关联注释的对象中移除注释不被视为错误。\n\n`--stdin`\n\n也可以从标准输入读取要移除注释的对象名称（没有理由不将其与命令行中的对象名称结合使用）。\n\
  \n`-n, --dry-run`\n\n不删除任何内容；仅报告将要移除注释的对象名称。\n\n`-s <strategy>, --strategy=<strategy>`\n\
  \n在合并注释时，使用给定的策略解决注释冲突。识别以下策略：\"manual\"（默认）、\"ours\"、\"theirs\"、\"union\" 和 \"\
  cat_sort_uniq\"。请参下文“注释合并策略”部分获取有关每种注释合并策略的更多信息。\n\n`--commit`\n\n完成正在进行中的 `git\
  \ notes merge`。当您解决了 `git notes merge` 存储在 `.git/NOTES_MERGE_WORKTREE` 中的冲突时，使用此选项。这会通过添加\
  \ `.git/NOTES_MERGE_WORKTREE` 中的注释，来对 `git notes merge` 创建的部分合并提交（存储在 `.git/NOTES_MERGE_PARTIAL`）进行修订。存储在\
  \ `.git/NOTES_MERGE_REF` 符号引用中的 notes ref 将更新为生成的提交。\n\n`--abort`\n\n中止/重置正在进行中的\
  \ `git notes merge`，即带有冲突的注释合并。这将简单地删除所有与注释合并相关的文件。\n\n`-q, --quiet`\n\n在合并注释时，静默操作。\n\
  \n`-v, --verbose`\n\n在合并注释时，输出更详细的信息。在修剪注释时，报告所有移除注释的对象名称。\n\n## 讨论\n\n提交注释（Commit\
  \ notes）是包含对象额外信息的 blob（通常是补充提交消息的信息）。这些 blob 提取自注释引用（notes refs）。注释引用通常是一个分支，其中包含一些“文件”，这些“文件”的路径是它们所描述的对象的名称，出于性能考虑，路径中包含了一些目录分隔符\
  \ [1]。\n\n每次注释更改都会在指定的注释引用创建一个新提交。因此，您可以通过调用例如 `git log -p notes/commits` 来检查注释历史。目前，提交消息仅记录了什么操作触发了更新，且提交作者根据常规规则确定（见\
  \ (1)）。这些细节在未来可能会发生变化。\n\n注释引用允许直接指向树对象（tree object），在这种情况下，可以使用 `git log -p -g\
  \ <refname>` 读取注释历史。\n\n## 注释合并策略\n\n默认的注释合并策略是 \"manual\"，它会在特殊的工作树（`.git/NOTES_MERGE_WORKTREE`）中检出冲突的注释以解决注释冲突，并指示用户在该工作树中解决冲突。完成后，用户可以使用\
  \ `git notes merge --commit` 完成合并，或使用 `git notes merge --abort` 中止合并。\n\n\"ours\"\
  \ 自动解决注释冲突并倾向于本地版本（即当前的注释引用）。\n\n\"theirs\" 自动解决注释冲突并倾向于远程版本（即合并到当前注释引用的给定的注释引用）。\n\
  \n\"union\" 通过拼接本地和远程版本自动解决注释冲突。\n\n\"cat_sort_uniq\" 与 \"union\" ，但除了拼接本地和远程版本外，该策略还会对生成的行进行排序，并移除结果中的重复行。这等同于对本地和远程版本应用\
  \ `cat | sort | uniq` 壳管道。如果注释遵循基于行的格式，且希望避免合并结果中出现重复行，则此策略非常有用。注意，如果本地或远程版本在合并之前包含重复行，这些行也会被此注释合并策略移除。\n\
  \n## 示例\n\n您可以使用注释添加写入提交时不可用信息的注释。\n\n```\n$ git notes add -m 'Tested-by: Johannes\
  \ Sixt <>' 72a144e2 $ git show -s 72a144e [...] Signed-off-by: Junio C Hamano <>\
  \ Notes: Tested-by: Johannes Sixt <>\n```\n\n从原则上说，注释是一个普通的 Git blob，接受任何格式的（或非格式）。您可以使用\
  \ `git hash-object` 从任意文件二进制安全地创建注释：\n\n```bash\n$ cc *.c $ blob=$(git hash-object\
  \ -w a.out) $ git notes --ref=built add --allow-empty -C \"$blob\" HEAD\n```\n\n\
  （您不能简单地使用 `git notes --ref=built add -F a.out HEAD`，因为这不是二进制安全的。）当然，用 `git log`\
  \ 显示非文本格式注释没有意义，所以如果您使用此类注释，可能需要编写一些特殊工具来对它们进行一些有用的操作。\n\n## 配置\n\n`core.notesRef`\n\
  \n用于读取和操作的注释引用，而不是 `refs/notes/commits`。必须是未缩写的引用名。此设置可以通过环境变量和命令行覆盖。\n\n`notes.displayRef`\n\
  \n在使用 `git log` 系列命令显示提交消息时，除了 `core.notesRef` 或 `GIT_NOTES_REF` 设置的默认集外，还要从哪些引用（或多个引用，如果使用了通配符或指定多次）读取注释。此设置可以通过命令行或\
  \ `GIT_NOTES_DISPLAY_REF` 环境变量覆盖。见 (1)。\n\n`notes.rewrite.<command>`\n\n当使用 `<command>`\
  \ 重写提交（当前为 amend 或 rebase）时，如果此变量为 false，git 将不会从原始提交复制注释到修订后的提交。默认 true true。见下文的\
  \ \"notes.rewriteRef\"。\n\n此设置可以通过环境变量 `GIT_NOTES_REWRITE_REF` 覆盖。\n\n`notes.rewriteMode`\n\
  \n在重写期间复制注释时，如果目标提交已经有了注释，该做什么。必须是 overwrite（覆盖）、concatenate（拼接）或 ignore（忽略）之一。默认是\
  \ concatenate。\n\n此设置可以通过环境变量 `GIT_NOTES_REWRITE_MODE` 覆盖。\n\n`notes.rewriteRef`\n\
  \n在重写期间复制注释时，指定应复制注释的（完全限定的）引用。可以是通配符，在这种情况下，将复制所有匹配引用的注释。您也可以多次指定此配置。\n\n没有默认值；您必须配置此变量以启用注释重写。\n\
  \n可以通过环境变量 `GIT_NOTES_REWRITE_REF` 覆盖。\n\n## 环境\n\n`GIT_NOTES_REF`\n\n要从哪个引用操作注释，而不是\
  \ `refs/notes/commits`。这会覆盖 `core.notesRef` 设置。\n\n`GIT_NOTES_DISPLAY_REF`\n\n用冒号分隔的引用或通配符列表，表示在显示提交消息时，除了来自\
  \ `core.notesRef` 或 `GIT_NOTES_REF` 的默认值外，还要从哪些引用读取注释。这会覆盖 `notes.displayRef` 设置。\n\
  \n对于不存在的引用将发出警告，但不匹配任何引用的通配符将被静默忽略。\n\n`GIT_NOTES_REWRITE_MODE`\n\n在重写期间复制注释时，如果目标提交已经有了注释，该做什么。必须是\
  \ overwrite、concatenate 或 ignore 之一。这会覆盖 `core.rewriteMode` 设置。\n\n`GIT_NOTES_REWRITE_REF`\n\
  \n在重写提交时，从原始提交复制哪些注释到修订后的提交中。必须是用冒号分隔的引用或通配符列表。\n\n如果未在环境变量中设置，复制的注释列表取决于 `notes.rewrite.<command>`\
  \ 和 `notes.rewriteRef` 设置。\n\n## GIT\n\n(7) 套件的一部分\n\n## 注释\n\n1.\n\n允许的路径名形式为 `ab*/*cd*/*ef*/*...*/*abcdef...`：一系列由两个十六进制数字组成的目录名称，后跟一个带有对象\
  \ ID 剩余部分的文件。\n\n* *\n\n# GIT-PACK-OBJECTS\n\n## 名称\n\n`git-pack-objects` - 创建对象的压缩归档\n\
  \n## 摘要\n\n`git pack-objects [-q | --progress | --all-progress] [--all-progress-implied]\
  \ [--no-reuse-delta] [--delta-base-offset] [--non-empty] [--local] [--incremental]\
  \ [--window=<n>] [--depth=<n>] [--revs [--unpacked | --all]] [--stdout | base-name]\
  \ [--shallow] [--keep-true-parents] < object-list`\n\n## 描述\n\n从标准输入读取对象列表，并带有指定的\
  \ base-name 写入压缩归档，或写入标准输出。\n\n\n\n\n压缩包（packed archive）是在两个仓库之间传输一组对象的高效方式，也是一种访问高效的归档格式。在压缩包中，对象要么被存储为压缩后的整体，要么存储为相对于其他对象的差异。后者通常被称为\
  \ `delta`（增量）。\n\n压缩包格式（`.pack`）被设计为自包含，因此可以在不需要任何额外信息的情况下进行解包。因此，delta 所依赖的每个对象都必须存在包内。\n\
  \n会生成一个包索引文件（`.idx`），以便对包中的对象进行快速的随机访问。将索引文件（`.idx`）和压缩包（`.pack`）都放在 `$GIT_OBJECT_DIRECTORY`\
  \ 的 `pack/` 子目录中（或 `$GIT_ALTERNATE_OBJECT_DIRECTORIES` 中的任何目录），即可允许 Git 从压缩包中读取数据。\n\
  \n`git unpack-objects` 命令可以读取压缩包，并将包中包含的对象展开为“一文件一对象”格式；这通常由智能拉取（smart-pull）命令完成，这些命令会在为对端进行高效网络传输时动态创建压缩包。\n\
  \n## OPTIONS\n\n### base-name\n\n写入一对文件（`.pack` 和 `.idx`），使用 `<base-name>` 来确定创建的文件名。当使用此选项时，两个文件将写入\
  \ `<base-name>-<SHA-1>.{pack,idx}` 文件中。`<SHA-1>` 是基于包内容的哈希值，并输出到命令的标准输出。\n\n###\
  \ --stdout\n\n将包的内容（本应写入 `.pack` 文件的内容）输出到标准输出。\n\n### --revs\n\n从标准输入读取修订参数，而不是单个对象名称。修订参数的处理方式与\
  \ `git rev-list` 使用 `--objects` 标志的方式相同，后者使用其提交参数来构建其输出的对象列表。结果列表中的对象将被压缩。除了修订外，还接受\
  \ `--not` 或 `--shallow <SHA-1>` 行。\n\n### --unpacked\n\n这隐含了 `--revs`。在处理从标准输入读取的修订参数列表时，将要压缩的对象限制为那些尚未压缩的对象。\n\
  \n### --all\n\n这隐含了 `--revs`。除了从标准输入读取的修订参数列表外，假装 `refs/` 下的所有引用（refs）都已指定包含在内。\n\
  \n### --include-tag\n\n如果其引用的对象已包含在生成的包文件中，则包含未被请求的注释标签（tags）。这对于将新标签发送给原生 Git 很有用。\n\
  \n### --window=<n>, --depth=<n>\n\n这两个选项影响使用 delta 压缩存储包中对象的方式。对象首先内部按类型、大小以及可选的名称进行排序，并与\
  \ `--window` 内内的其他对象进行比较，以查看使用 delta 压缩是否节省空间。`--depth` 限制最大 delta 深度；过深会影响解包端的性能，因为需要多次应用\
  \ delta 数据才能获得所需的对象。`--window` 的默认值为 10，`--depth` 为 50。\n\n### --window-memory=<n>\n\
  \n此选项在 `--window` 的基础上提供了额外的内存限制；窗口大小将动态缩小，以确保占用的内存不超过 `<n>` 字节。这对于混合了大、小对象的仓库非常有用，可以避免在使用大窗口时耗尽内存，同时仍然让较小对象利用大窗口。大小可以带有后缀\
  \ \"k\"、\"m\" 或 \"g\"。`--window-memory=0` 使内存使用无限制，这是默认值。\n\n### --max-pack-size=<n>\n\
  \n每个输出包文件的最大大小。大小可以带有后缀 \"k\"、\"m\" 或 \"g\"。允许的最小大小限制为 1 MiB。如果指定，可能会创建多个包文件。除非配置变量\
  \ `pack.packSizeLimit` 被设置，否则默认无限。\n\n### --honor-pack-keep\n\n此标志会导致本地包中已存在 `.keep`\
  \ 文件的对象被忽略，即使它原本会被压缩。\n\n### --incremental\n\n此标志会导致已存在于包中的对象被忽略，即使它原本会被压缩。\n\n\
  ### --local\n\n此标志会导致从替代对象存储（alternate object store）借用的对象被忽略，即使它原本会被压缩。\n\n### --non-empty\n\
  \n只有当压缩包至少包含一个对象时，才创建压缩包。\n\n### --progress\n\n默认情况下，当标准错误连接到终端时，会在标准错误流上报告进度状态，除非指定了\
  \ `-q`。此标志即使在标准错误流未重定向到终端也会强制报告进度状态。\n\n### --all-progress\n\n当指定 `--stdout` 时，在对象计数和压缩阶段会显示进度报告，但在输出阶段会被抑制。这是因为在某些情况下，输出流直接链接到另一个命令，该命令在处理传入的包数据时可能希望显示自己的进度状态。此标志类似于\
  \ `--progress`，区别在于它即使在使用 `--stdout` 时也会强制在输出阶段也进行进度报告。\n\n### --all-progress-implied\n\
  \n此标志用于在激活进度显示时隐含 `--all-progress`。与 `--all-progress` 不同，此标志本身并不会强制执行任何进度显示。\n\n\
  ### -q\n\n此标志使命令不在标准错误流上报告其进度。\n\n### --no-reuse-delta\n\n在具有现有压缩包的仓库中创建压缩包时，命令会重用现有的\
  \ delta。这有时会导致包略微欠优。此标志告诉命令不要重用现有的 delta，而是从头开始计算。\n\n### --no-reuse-object\n\n\
  此标志告诉命令完全不要重用现有对象数据（包括 delta 化的对象），强制重新压缩。这隐含了 `--no-reuse-delta`。仅在需要对所有数据强制统一压缩级别的极少数情况下有用。\n\
  \n### --compression=<n>\n\n指定生成包中新压缩数据的压缩级别。如果没有指定，包压缩级别首先由 `pack.compression` 决定，然后是\
  \ `core.compression`，如果两者未设置则默认为 -1（zlib 默认值）。如果你希望对所有数据强制统一压缩级别，请添加 `--no-reuse-object`。\n\
  \n### --thin\n\n通过省略发送者和接收者之间的共同对象创建一个“薄包”，以减少网络传输。此选项在结合 `--stdout` 时才有意义。\n\n\
  注意：薄包由于缺少了对象而违反了压缩包格式，因此在不使其自包含的情况下无法被 Git 使用。使用 `git index-pack --fix-thin`（见 (1））来恢复自包含属性。\n\
  \n### --shallow\n\n为浅仓库客户端优化包。此选项结合 `--thin` 可以以速度为代价获得更小的包。\n\n### --delta-base-offset\n\
  \n压缩包可以将 delta 的基对象表示为 20 字节的对象名称或流中的偏移量，但旧版本的 Git 不理解后者。默认，`git pack-objects` 为了兼容性仅使用前者格式。此选项允许命令使用后者以提高紧凑性。取决于平均\
  \ delta 链的长度，此选项通常能使生成的包文件缩小 3%-5%。\n\n注意：在现代 Git 中，如 `git gc`（见 (1))、`git repack`（见\
  \ (1)) 等 Porcelain 命令在将仓库中的对象放入包文件时默认会传递此选项。`git bundle`（见 (1)) 在创建 bundle 时也是如此。\n\
  \n### --threads=<n>\n\n指定在搜索最佳 delta 匹配时启动的线程数。这要求 `pack-objects` 使用 pthreads 编译，否则该选项将被忽略并发出警告。这旨在减少多处理器机器上的打包时间。然而，delta\
  \ 搜索窗口所需的内存量将乘以线程数倍。指定 0 将使 Git 自动检测 CPU 数量并相应设置线程数。\n\n### --index-version=<version>[,<offset>]\n\
  \n\n\n\n此命令仅供测试套件使用。它允许强制生成的包索引（pack index）版本，并强制位于给定偏移量以上的对象使用 64 位索引项。\n\n`--keep-true-parents`\n\
  \n使用此选项时，被嫁接（grafts）隐藏的父节点会被打包。\n\n## 另请\n\n(1) (1) (1)\n\n# GIT-PACK-REDUNDANT\n\
  \n## 名称\ngit-pack-redundant - 查找冗余的包文件（pack files）\n\n## 语法\n`git pack-redundant`\
  \ [ --verbose ] [ --alt-odb ] < --all | .pack filename ... >`\n\n## 描述\n此程序计算仓库中哪些包是冗余的。如果你在仓库根目录下，输出结果可以传递给\
  \ `xargs rm`。\n\n`git pack-redundant` 接受标准输入中的对象列表。在检查需要哪些包时，将忽略任何给定的对象。在想要删除包含不可达对象的包时，以下命令非常有用。\n\
  \n```\ngit fsck --full --unreachable | cut -d ' ' -f3 | \\ git pack-redundant --all\
  \ | xargs rm\n```\n\n## \n`--all`\n处理所有包。命令行上的任何文件名都会被忽略。\n\n`--alt-odb`\n不要求来自替代对象目录（alternate\
  \ object directories）包中的对象存在于本地包中。\n\n`--verbose`\n将某些统计信息输出 stderr。会有轻微的性能影响。\n\
  \n## 另请\n(1) (1) (1)\n\n# GIT-PACK-REFS\n\n## 名称\ngit-pack-refs - 打包分支头部和标签以实现高效仓库访问\n\
  \n## 语法\n`git pack-refs` [--all] [--no-prune]`\n\n## 描述\n传统上，分支和标签的末端（统称为 `refs`）存储在\
