  \n许可制作并分发本帮助页的逐字副本，前提是所有副本上均保留版权声明和本许可声明。\n\n在满足逐字拷贝条件的情况下，许可复制并分发本帮助页的修改版本，前提是整个派生作品必须按照与本声明相同的许可声明条款进行分发。\n\
  \n在满足上述修改版本条件下，许可将本帮助页翻译成另一种语言并复制分发，但许可声明可以在基金会批准的翻译文中说明。\n\n* * *\n\n# GCCCMD\n\
  \n## 名称\n\n`gawkmd` - 一个控制台计算器\n\n## 概要\n\n`gawk`\n\n## 描述\n\n`gcawkmd` 是 `gawk`\
  \ 的控制台版本。\n\n## 另另\n\n`gawk`\n\n# GCORE\n\n## 名称\n\n`gcore` - 生成核心文件\n\n## 概要\n\n\
  `gcore [-o filename] pid`\n\n## 描述\n\n`gcore` 产生运行中进程的核心转储。\n\n### 选项\n\n`-o filename`\
  \ 指定存放核心文件的文件名。\n\n# GDB-ADD-INDEX\n\n## 名称\n\n`gdb-add-index` - 添加索引文件以加速 GDB\n\
  \n## 概要\n\n`gdb-add-index filename`\n\n## 描述\n\n当 GDB 找到符号文件时，它会扫描文件符号以构建内部符号表。\n\
  \nGDB 提供了一种构建索引的方法，可以加快启动速度。\n\n要确定文件是否包含此类索引，使用命令 `readelf -S filename`：索引存储在名为\
  \ `.gdb_index` 的节。注意，对于不包含 DWARF 调试信息（名为 `.debug_*` 的节）的文件，不会生成索引。\n\n更多信息请参阅 GDB\
  \ 手册中的 `Index Files` 节点 --- shell 命令 `info -f gdb -n 'Index Files'`。\n\n\n\n\n根据\
  \ GNU 自由文档许可证 1.3 版本或由自由软件基金发布的任何更高版本的条款，允许复制、分发和/或修改此本文档；其中不变部分为“自由软件”和“自由软件需要自由文档”，前封面文本为“GNU\
  \ 手册”，封底文本如下文 (a) 所示。\n\n(a) FSF 的封底文本为：“你可以自由复制和修改本 GNU 手册。从 GNU Press 购买副本支持 FSF\
  \ 开发 GNU 并促进软件自由。”\n\n* * *\n\n# GDB\n\n## 名称\ngdb - The GNU 调试器\n\n## 语法概览\n```\n\
  gdb [-help] [-nh] [-nx] [-q] [-batch] [-cd=dir] [-f] [-b bps]\n     [-tty=dev] [-s\
  \ symfile] [-e prog] [-se prog] [-c core] [-p procID]\n     [-x cmds] [-d dir] [prog|prog\
  \ procID|prog core]\n```\n\n## 描述\n像 GDB 这样的调试器的目的是让你看到另一个程序在执行时“内部”发生了什么——或者另一个程序在崩溃瞬间瞬间正在做什么。\n\
  \nGDB 可以执行四种主要功能（以及支持这些功能的其他功能），帮助你现场捕获 bug：\n\n* 启动你的程序，并指定任何可能影响其行为的参数。\n* 让你的程序在特定条件下停止。\n\
  * 在程序停止时，检查发生了什么。\n* 修改你程序中的内容，以便你可以尝试修复某个 bug 的影响并继续学习另一个 bug。\n\n你可以使用 GDB 调试用\
  \ C、C++、Fortran 和 Modula-2 编写的程序。\n\n通过 shell 命令 `gdb` 启动 GDB。一旦启动，它将从终端读取命令，直到你通过\
  \ GDB 命令 `quit` own 其退出。你可以使用 `help` 命令从 GDB 自身获取在线帮助。\n\n你可以在不带任何参数或选项的情况下运行 `gdb`；但启动\
  \ GDB 最常用的方法是带一个或两个参数，指定一个可执行程序作为参数：\n\n```\ngdb program\n```\n\n你也可以同时指定可执行程序和一个\
  \ core 文件启动：\n\n```\ngdb program core\n```\n\n如果你想调试一个正在运行的进程，可以将进程 ID 作为第二个参数：\n\
  \n```\ngdb program 1234\ngdb -p 1234\n```\n会将 GDB 挂载到进程 `1234`（除非你也有一个名为 `1234`\
  \ 的文件；GDB 会先检查 core 文件）。使用选项 `-p` 时，你可以省略 `program` 文件名。\n\n这里是一些最频繁使用的 GDB 命令：\n\
  \n* `break [file:]function`: 在 `function`（在 `file` 中）设置断点。\n* `run [arglist]`: 启动你的程序（如果指定了则带有\
  \ `arglist`）。\n* `bt`: 回溯（Backtrace）：显示程序堆栈。\n* `print expr`: 显示表达式的值。\n* `c`: 继续运行你的程序（在停止后，例如在断点处）。\n\
  * `next`: 执行下一行程序（在停止后）；*跳过*行中的任何函数调用。\n* `edit [file:]function`: 查看程序当前停止的所在行。\n\
  * `list [file:]function`: 打印程序当前停止位置附近的程序文本。\n* `step`: 执行下一行程序（在停止后）；*进入*行中的任何函数调用。\n\
  * `help [name]`: 显示关于 GDB 命令 `name` 的信息，或关于使用 GDB 的通用信息。\n* `quit`: 退出 GDB。\n\n\
  关于 GDB 的完整细节，请参阅 Richard M. Stallman 和 Roland H. Pesch 写的《Using GDB: A Guide to\
  \ the GNU Source-Level Debugger》。该文本可以通过 `info` 程序中的 `gdb` 条目在线获取。\n\n### 选项\n选项之外的任何参数都指定可执行文件和\
  \ core 文件（或进程 ID）；也就是说，遇到的第一个没有关联选项标志的参数等同于 `-se` 选项，第二个（如果有）如果是文件名，则等同于 `-c` 选项。许多选项都有长短形式；这里显示了这两种形式。如果你截断长形式，只要保留的选项足够足以消除歧义，它也能被识别。（如果需要的话，可以使用\
  \ `+` 而不是 `-` 来标记选项参数，尽管我们演示的是更常用的习惯。）\n\n你提供的所有选项和命令行参数都是按顺序处理的。当使用 `-x` 选项时，顺序会产生影响。\n\
  \n* `-help`, `-h`: 列出所有选项并带简要说明。\n* `-symbols=file`, `-s file`: 从文件 `file` 读取符号表。\n\
  * `-write`: 启用写入可执行文件和 core 文件。\n* `-exec=file`, `-e file`: 使用 `file` 作为可执行文件。\n\
  * `-se=file`: 从 `file` 读取符号表。\n* `-core=file`, `-c file`: 使用 `file` 作为 core。\n*\
  \ `-command=file`, `-x file`: 从 `file` 执行命令。\n* `-directory=dir`, `-d dir`: 将 `dir`\
  \ 添加到搜索文件的路径。\n* `-nh`, `-n`: 不执行来自 `~/.gdb` 的命令。\n* `-quiet`, `-q`: 不打印介绍和版权信息。\n\
  * `-batch`: 以批处理模式运行。\n* `-cd=dir`: 使用 `dir` 作为工作目录运行 GDB。\n\n# GDBM_DUMP\n\n##\
  \ 名称\ngdbm_dump - 将 GDBM 数据库导出到文件\n\n## 语法概览\n```\ngdbm_dump [-H FMT] [--format=FMT]\
  \ DB_FILE [FILE]\n```\n\n\n\n\n`gdbm_dump` [`-Vh`] [`--help`] [`--usage`] [`--version`]\n\
  \n## 描述\n\n`gdbm_dump` 工具为指定的 (3) 数据库文件创建转储。输出转储文件名由第二个参数 `FILE` 提供。如果未指定，输出将重定向到标准错误。\n\
  \n创建的转储文件可以作为参数传递给 (1) 工具，以便重新创建 `DB_FILE` 的精确副本。\n\n### 选项\n\n`-H`, `--format`=`FMT`\n\
  \n选择转储格式。值 `binary`（或 `0`）指示 `gdbm_dump` 生成二进制转储，与早期版本的 `gdbm`（最高到 1.9 版本）兼容。值 `ascii`（或\
  \ `1`）指示其创建 ASCII 转储（这是默认值）。后者更优，因为除了实际数据外，它还包含元信息，允许 (1) 重新创建文件的精确副本。\n\n`-h`,\
  \ `--help`\n\n打印简短的用法摘要。\n\n`--usage`\n\n打印可用选项列表。\n\n`-V`, `--version`\n\n打印程序版本\n\
  \n## 参见\n\n(1), (1), (3)。\n\n欲需有关 `gdbm_dump` 和其他 `gdbm` 工具的详细说明，请参考 Texinfo 格式提供的\
  \ `GDBM Manual`。运行如下：\n\n```\ninfo gdbm\n```\n\n## 错误报告\n\n请将错误报告至 <>。\n\n## 版权\n\
  \nCopyright Š 2013 Free Software Foundation, Inc\n\n许可证 GPLv3+: GNU GPL 版本 3 或更高版本\
  \ <>\n\n这是自由软件：你可以自由地更改和分发它。在法律允许的范围内，不提供任何保证。\n\n***\n\n# GDBM_LOAD\n\n## 名称\n\n\
  `gdbm_load` - 从转储文件重建 GDBM 数据库。\n\n## 语法\n\n`gdbm_load` [`-Mnr`] [`-b` `NUM`] [`-c`\
  \ `NUM`]\n[`-m` `MODE`] [`-u` `NAME`|`UID`[:`NAME`|`GID`]]\n[`--block-size`=`NUM`]\
  \ [`--cache-size`=`NUM`] [`--mmap`=`NUM`]\n[`--mode`=`MODE`] [`--no-meta`] [`--replace`]\n\
  [`--user`=`NAME`|`UID`[:`NAME`|`GID`]] `FILE` [`DB_FILE`]\n\n`gdbm_load` [`-Vh`]\
  \ [`--help`] [`--usage`] [`--version`]\n\n## 描述\n\n从转储文件 `FILE` 创建 `gdbm` 数据库文件\
  \ `DB_FILE`。如果没有提供 `FILE` 参数，则将创建的数据库输出到标准错误。\n\n如果输入文件为 ASCII 转储格式，创建的数据库的模式和所有权将从转储信息中恢复。可以使用命令行选项覆盖（见下文）。\n\
  \n### 选项\n\n`-b`, `--block-size`=`NUM`\n\n设置块大小。\n\n`-c`, `--cache-size`=`NUM`\n\
  \n设置缓存大小。\n\n`-M`, `--mmap`\n\n使用内存映射`-m`, `--mode`=`MODE`\n\n设置数据库文件模式（八进制）。\n\n\
  `-n`, `--no-meta`\n\n不尝试恢复数据库元数据（模式和所有权）。\n\n`-r`, `--replace`\n\n如果数据库存在，则替换其中的记录。\n\
  \n`-u`, `--user`=`NAME`|`UID`[:`NAME`|`GID`]\n\n设置文件所有权。\n\n`-h`, `--help`\n\n打印简短的用法摘要。\n\
  \n`--usage`\n\n打印可用选项列表。\n\n`-V`, `--version`\n\n打印程序版本\n\n## 参见\n\n(1), (1), (3)。\n\
  \n欲需有关 `gdbm_load` 和其他 `gdbm` 工具的详细说明，请参考 Texinfo 格式提供的 `GDBM Manual`。运行如下：\n\n\
  ```\ninfo gdbm\n```\n\n## 错误报告\n\n请将错误报告至 <>。\n\n## 版权\n\nCopyright Š 2013 Free\
  \ Software Foundation, Inc\n\n许可证 GPLv3+: GNU GPL 版本 3 或更高版本 <>\n\n这是自由软件：你可以自由地更改和分发它。在法律允许的范围内，不提供任何保证。\n\
  \n***\n\n# Gdbmtool\n\n## 名称\n\n`gdbmtool` - 检查和修改 GDBM 数据库\n\n## 语法\n\n`gdbmtool`\
  \ [`-lmNnqrs`] [`-b` `SIZE`] [`-c` `SIZE`]\n[`-f` `FILE`] [`--block-size`=`SIZE`]\n\
  [`--cache-size`=`SIZE`] [`--file`=`FILE`]\n[`--block-size`=`SIZE`] [`--cache-size`=`SIZE`]\
  \ [`--file`=`FILE`]\n[`no-c`] [`--mmap`] [`--newdb`] [`no-lock`] [`--quiet`] [`--read-only`]\
  \ [`--synchronize`]\n\n`gdbmtool` [`-Vh`] [`--help`] [`--usage`] [`--version`]\n\
  \n## 描述\n\n`gdbmtool` 工具允许你查看现有的 GDBM 数据库或创建一个。`FILE` 参数指定要打开的数据库名称。如果未指定，将创建一个新数据库。\n\
  \n程序提供了一种交互模式，可以在其中向数据库输入命令。可用命令见下表。\n\n如果数据库为 ASCII 转储格式，程序将对其解压并显示。如果数据库为二进制格式，程序将直接显示。\n\
  \n`gdbmtool` 还可以用于修改数据库。例如，你可以删除记录、添加新记录或更改数据库元数据。\n\n`avail` - 打印可用列表\n\n`bucket`\
  \ `NUM` - 打印桶号 `NUM` 并将其设为当前\n\n`cache` - 打印桶缓存\n\n`close` - 关闭当前打开的数据库\n\n`count`\
  \ - 打印数据库中的条数\n\n`current` - 打印当前桶\n\n`delete` `KEY` - 删除具有指定 `KEY` 的记录\n\n`dir`\
  \ - 打印哈希目录\n\n`fetch` `KEY` - 获取并显示具有指定 `KEY` 的记录\n\n`first` - 获取并显示数据库中的第一条记录。后续记录可以使用\
  \ next 命令获取。\n\n`hash` `KEY` - 计算并显示指定 `KEY` 的哈希值\n\n`header` - 打印文件头。\n\n`help`\
  \ 或 `?` - 打印简洁的命令摘要，显示每个命令字母、动词及其参数以及功能的简短描述。可选参数括在方括号中。\n\n### 选项\n\n`-b`, `--block-size`=`SIZE`\n\
  \n设置块大小。\n\n`-c`, `--cache-size`=`SIZE`\n\n设置缓存大小。\n\n`-f`, `--file`=`FILE`\n\n\
  从 `FILE` 读取命令，而不是标准输入。\n\n`-l`, `--no-lock`\n\n禁用文件锁定。\n\n`-m`, `--mmap`\n\n不使用\
  \ (2)。\n\n`-n`, `--newdb`\n\n创建数据库，如果已存在则将其截断。\n\n`-q`, `--quiet`\n\n不打印初始横幅。\n\n\
  `-r`, `--read-only`\n\n以只读模式打开数据库。\n\n`-s`, `--synchronize`\n\n每次写入后同步到磁盘。\n\n`-h`,\
  \ `--help`\n\n打印简短的用法摘要。\n\n`--usage`\n\n打印可用选项列表。\n\n`-V`, `--version`\n\n打印程序版本\n\
  \n## Shell 命令\n\n`avail` - 打印可用列表\n\n`bucket` `NUM` - 打印桶号 `NUM` 并将其设为当前\n\n`cache`\
  \ - 打印桶缓存\n\n`close` - 关闭当前打开的数据库\n\n`count` - 打印数据库中的条数\n\n`current` - 打印当前桶\n\n\
  `delete` `KEY` - 删除具有指定 `KEY` 的记录\n\n`dir` - 打印哈希目录\n\n`fetch` `KEY` - 获取并显示具有指定\
  \ `KEY` 的记录\n\n`first` - 获取并显示数据库中的第一条记录。后续记录可以使用 next 命令获取。\n\n`hash` `KEY` - 计算并显示指定\
  \ `KEY` 的哈希值\n\n`header` - 打印文件头。\n\n`help` 或 `?` - 打印简洁的命令摘要，显示每个命令字母、动词及其参数以及功能的简短描述。可选参数括在方括号中。\n\
  \n\n\n\n\n`import` *FILE-NAME* [`replace`] [`nometa`]\n\n从扁平转储文件 *FILE-NAME* 导入数据。如果提供了\
  \ `replace` 参数，则与现有记录具有相同键的任何记录将被替换。`nometa` 参数将关闭从转储文件中恢复元信息。\n\n`list`\n\n列出数据库的内容。\n\
  \n`next` [*KEY*]\n\n顺序访问：获取并显示下一条记录。如果提供了 *KEY*，则将获取该键记录之后的下一条记录。\n\n`open` *FILE*\n\
  \n打开数据库文件 *FILE*。如果成功，将关闭任何之前打开的数据库。否则，如果操作失败，则当前打开的数据库将保持不变。\n\n此命令从变量 `open`、`lock`、`mmap`\
  \ 和 `sync` 中获取额外信息。详细描述这些变量请参见 `VARIABLES` 。\n\n`quit`\n\n关闭数据库并退出实用程序。\n\n`reorganize`\n\
  \n重组数据库。`set` [*VAR*=*VALUE*...]。如果不带参数，则列出变量及其值。如果指定了参数，则设置变量。布尔变量可以通过指定变量名（可选前缀为\
  \ `no`）来设置为 `false`。\n\n`source` *FILE*\n\n从给定的 *FILE* 读取命令。\n\n`status`\n\n打印当前程序状态。\n\
  \n`store` *KEY* *DATA*\n\n在数据库中根据给定的 *KEY* 存储 *DATA*。如果 *KEY* 已经存在，其数据将被替换。\n\n\
  `unset` *VARIABLE*...\n\n取消列出的变量。\n\n`version`\n\n打印 `gdbm` 的版本。\n\n## 数据定义\n\n\
  `define` 语句提供了一种定义键或内容结构的机制。它类似于 `C` 语言的 `struct` 声明：\n\n```\n`define``key`|`content`{`defnlist`}\n\
  ```\n\n*defnlist* 是成员声明的逗分隔列表。在 *defnlist* 中，换行符丢失了作为命令终止符的特殊含义，因此每个声明可以单独出现，并且可以插入任意数量的注释来记录该定义。\n\
  \n每个声明具有以下格式之一：\n\n*`type``name``type``name`[`[`N`]`\n\n其中 *type* 是数据类型，*name* 是成员名。第二种格式将成员\
  \ *name* 定义为由 *N* 个 *type* 元素组成的数组。\n\n支持的类型有：\n\n`type meaning char 单字节（有符号）short\
  \ 有符号短整数 ushort 无符号短整数 int 有符号整数 unsigned 无符号整数 uint 同上 long 有符号长整数 ulong 无符号长整数\
  \ llong 有符号长长整数 ullong 无符号长整数 float 浮点数 double 双精度浮点数 string 字符数组（见下文 `NOTE`）stringz\
  \ 零终止字符字符串`\n\n在 *defnlist* 中可以使用以下对齐声明：\n\n`offset` *N*\n\n下一个成员从偏移量 *N* 开始。\n\n\
  `pad` *N*\n\n在上一个成员后添加 *N* 字节的填充。\n\n例如：\n\n```\n`define content { int status, pad\
  \ 8, char id[3], stringz name }`\n```\n\n要定义一个由单个数据成员组成的数据，可以使用以下简化的构造：\n\n```\n\
  `define``key`|`content`*type*\n```\n\n其中 *type* 是上述类型之一。\n\n**NOTE**：只有当 `string`\
  \ 类型是数据结构的最后一个或唯一成员时，才能合理地使用。因为没有提供关于数组中元素数量的信息，因此被解释为包含到数据项结束的所有字节。\n\n## 变量\n\n\
  `confirm`，布尔值\n\n在执行某些破坏性操作（如截断现有数据库）之前是否请求确认。默认值为 `true`。\n\n`ps1`，字符串\n\n主提示符字符串。其值可以包含*转换规范符*，由\
  \ `%` 字符后跟另一个字符组成。这些规范符在生成的提示符中的展开方式如下：\n\n```\n序列扩展 %f (数据库文件名) %p (程序名) %P (包名\
  \ (gdbm)) %_ (水平空格 (ASCII 32)) %v (程序版本) %%\n```\n\n默认提示符为 `%p>%_`。\n\n`ps2`，字符串\n\
  \n次要提示符。关于其值的描述请参见 `ps1`。此提示符会在读取多行命令的第二行及后续行之前显示。\n\n默认值为 `%_>%_`。\n\n`delim1`，字符串\n\
  \n用于在输出时分隔结构化数据字段的字符串（参见 `DATA DEFINITIONS` 节）。默认是 `,`（逗号）。此变量无法取消。\n\n`delim2`，字符串\n\
  \n在打印结构化数据时用于分隔数组项的字符串。默认是 `,`（逗号）。此变量无法取消。\n\n`pager`，字符串\n\n将输出管道到分页器程序的名称和命令行。当估计的输出行数大于屏幕行数时，在交互模式使用此程序。\n\
  \n默认值继承自环境变量 `PAGER`。取消此变量将禁用分页。\n\n`quiet`，布尔值\n\n启动时是否显示欢迎横幅。此变量应设置在启动脚本文件中。\n\
  \n以下变量控制数据库的运行方式：\n\n`cachesize`，数值\n\n设置缓存大小。默认未设置。\n\n`blocksize`，数值\n\n设置块大小。\n\
  \n`open`，字符串\n\n打开模式。允许以下值：\n\n`newdb`\n\n截断数据库或创建一个新数据库。以读写模式打开它。\n\n`wrcreat`\
  \ 或 `rw`\n\n以读写模式打开数据库。如果不存在则创建它。\n\n`reader` 或 `readonly`\n\n以只读模式打开数据库。如果不存在则产生错误。\n\
  \n`lock`，布尔值\n\n锁定数据库。这是默认值。`mmap`，布尔值\n\n使用内存映射。这是默认值。\n\n## 参见\n\n(1), (3)。\n\n\
  ### 报告缺陷\n\n向 <> 报告错误。\n\n## 版权\n\nCopyright 2013 Free Software Foundation\n\n许可\
