- "# Fedora Linux 手册文件：用户命令 - 第二卷 (Fedora Linux 手册文件 - 用户命令指南 2)\n\n\n\n![](img/00002.jpeg)\n\
  \n### 献辞：\n\n本书献给 Michael Kerrisk 以及 Linux 文档项目团队。\n\n\n\n# ESPEAK\n\n## 名称\n\n\
  `espeak` - 一个多语言软件语音合成器。\n\n## 语法\n\n`espeak` `[options]` `[words]`\n\n## 描述\n\n\
  `espeak` 是一个用于英语及其他某些语言的软件语音合成器。\n\n### 选项\n\n`-ffile`\n要说的文本文件。\n\n`--stdin`\n\
  从 stdin 读取文本输入而非文件\n如果既没有使用 `-f` 也没有使用 `--stdin`，则朗读 `words`；如果没有，则从 stdin 逐行读取文本。\n\
  \n`-ainteger`\n幅度，0 到 20，默认值为 10。\n\n`-ginteger`\n词间距。在默认速度下，单词之间的暂停单位为 10 ms。\n\
  \n`-kinteger`\n用以下方式指示大写字母：1=发音，2=读取单词 \"capitals\"，值越大音调 越高（尝试 `-k20`）。\n\n`-linteger`\n\
  行长度。如果不是零（默认值），则将小于此长度的行视为从句结束。\n\n`-pinteger`\n音调调整，0 到 99，默认值为 50。\n\n`-sinteger`\n\
  速度为每分钟单词数，默认值为 160。\n\n`-vvoicename`\n使用 `espeak-data/voices` 中此名的语音文件。\n\n`-wfile`\n\
  将输出写入此 WAV 文件，而不是直接朗读。\n\n`-b`\n输入文本为 8 位编码。\n\n`-m`\n指示文本包含 SSML（语音合成标记语言）标签或其他\
  \ XML 标签。支持的 SSML 标签将会被解释。其他标签（包括 HTML）将被忽略，但某些 HTML 标签（如 `<hr>` `<h2>` 和 `<li>`）会确保语音中断。\n\
  \n`-q`\n静音模式，不产生任何语音（可能配合 `-x` 使用）。\n\n`-x`\n将音标助记符写入标准输出。\n\n`-X`\n将音标助记符和翻译轨迹写入标准输出。\n\
  \n`-z`\n文本结束处不进行句末暂停。\n\n`--compile=[voicename]`\n编译当前目录下的发音规则和字典。`voicename` 是可选的，用于指定要使用的语言。\n\
  \n`--ipa=[ipa]`\n使用国际音标将音标写入标准输出。如果 `ipa` 为 1 则使用连音，如果为 2 则使用 ZWJ，如果为 3 则用 `_` 分隔。\n\
  \n`--path=path`\n指定包含 `espeak-data` 目录的路径。\n\n`--pho`\n将 mbrola 音标数据（`.pho`）写入标准输出或\
  \ `--phonout` 指定的文件。\n\n`--phonout=filename`\n将 `-x`、`-X` 命令的输出以及 mbrola 音标数据写入此文件。\n\
  \n`--punct=[characters]`\n朗读时读取标点符号的名称。如果省略 `characters`，则朗读所有标点符号。\n\n`--split=minutes`\n\
  每隔 `minutes` 分钟开始一个新的 WAV 文件。配合 `-w` 使用。\n\n`--stdout`\n将语音输出写入标准输出。\n\n`--voices=[language]`\n\
  列出可用语音。如果存在 `language`，则仅列出适用于该语言的语音。\n\n`-h`, `--help`\n显示选项摘要。\n\n`--version`\n\
  显示版本信息。\n\n## 作者\n\neSpeak 由 Jonathan Duddington `<jonsd@jsd.clara.co.uk>` 编写。该软件包的网页可以在\
  \ http://espeak.sourceforge.net/ 找到。\n本手册由 Luke Yelavich `<themuso@ubuntu.com>`\
  \ 编写，用于 Ubuntu 项目（但其他人可以使用）。由 Jaroslav karvada `<jskarvad@redhat.com>` 进行了多次更新。\n\
  \n* *\n\n# EUTP\n\n## 名称\n\n`eutp` - EuroBraille 文件传输 \n\n## 语法\n\n`eutp` \n\n##\
  \ 描述\n\n`eutp` 允许你与 EuroBraile 的 Clio 终端交换文件。\n\n## 命令行选项\n\n目前无\n\n## 返回值\n\n|\
  \ 1 | 错误 |\n\n## Shell 扩展\n\n就我们所知，本手册发布的所有文本除非另有说明，均属于公有领域。\n我们非常重视对公有领域的承诺。\n\
  如果您有理由认为 LinuxManFiles.com 发布的文本尚未进入公有领域，请发送邮件至：`editor at linuxmanfiles.com`。\n\
  \n## 作者\n\nOlivier Bert `<olivier.bert@laposte.net>`\n\n* *\n\n# evince\n\n## 名称\n\
  \n`evince` - GNOME 文档查看器\n\n## 语法\n\n`evince [--help] [--page-label=PAGE| --page-index=NUMBER|\
  \ --named-dest=DEST] [--fullscreen] [--presentation] [--preview] [--find=STRING]\
  \ [filename(s)...]`\n\n## 描述\n\nEvince\n\n 是一个能够显示多种格式（如 PDF 和 Postscript）的文档查看器。关于\
  \ Evince 的更多通用信息请访问我们的网站 http://www.gnome.org/projects/evince/\n\n### 选项\n\n`-?`,\
  \ `-h`, `--help`\n打印选项。\n\n`-p`, `--page-label=PAGE`\n根据标签打开文档。\n\n`-i`, `--page-index=NUMBER`\n\
  根据索引打开文档（不是页标签）。\n\n`-n`, `--named-dest=DEST`\n根据指定的目标打开文档。\n\n`-f`, `--fullscreen`\n\
  以全屏模式运行 evince。\n\n`-s`, `--presentation`\n以演示模式运行 evince。\n\n`-l`, `--find=string`\n\
  你在此传递一个单词或短语。如果存在，Evince 将显示文档及第一个匹配项。\n\n`filename(s)...`\n指定启动 Evince 时打开的文件。如果没有指定，Evince\
  \ 将打开一个空白窗口。可以通过空格分隔加载多个文件。Evince 还支持远程文件。例如，你可以传递网络位置或从 FTP 服务器加载文件，如 `ftp://adobe.com/sample.pdf`。\n\
  \n## 打印预览选项\n\n这些选项主要用于 GTK+ 的打印预览功能。有关这些选项的更多信息请参阅 http://developer.gnome.org/gtk3/stable/GtkSettings.html#GtkSettings--gtk-print-preview-command\n\
  \n`-w`, `--preview`\n作为预览器运行 evince。\n\n`--unlink-temp-file`\n如果在预览模式运行 evince，这将解链\
  \ GTK+ 创建的临时文件。\n\n`--print-settings %s %f`\n这会将 PDF 文件的完整路径 f 和打印对话框的设置 s 发送到 evince。\n\
  \n## 缺陷\n\n如果您发现 Bug，请在 http://bugzilla.gnome.org/enter_bug.cgi?product=evince 报告。\n\
  \n\n\n\n\n`vim` [options] -q [errorfile]\n\n`ex` `gex`\n\n`view`\n\n`gvim` `gview`\
  \ `vimx` `evim` `eview`\n\n`rvim` `rview` `rgvim` `rgview`\n\n## DESCRIPTION\n\n\
  `Vim` 是一个向后兼容 Vi 的文本编辑器。它可以编辑各种纯文本。它对于编辑程序特别有用。\n\n相比于 Vi，它有很多增强功能：多级撤销、多窗口和缓冲区、语法高亮、命令行编辑、文件名补全、在线帮助、视化选择等。请参见\
  \ `:help vi_diff.txt` 获取 `Vim` 与 Vi 之间的差异总结。\n\n在运行 `Vim` 时，可以通过 `:help` 命令从在线帮助系统中获取大量帮助。请参见下文的在线帮助部分。\n\
  \n通常通过以下命令启动 `Vim` 来编辑单个文件：\n\n```\nvim file\n```\n\n更通用地说，`Vim` 的启动方式为：\n\n```\n\
  vim [options] [filelist]\n```\n\n如果缺少 `filelist`，编辑器将带有空缓冲区启动。否则，以下四个选项中恰好可以使用一个来选择一个或多个要编辑的文件。\n\
  \n- `file ..`\n\n文件名列表。第一个文件将作为当前文件并读入缓冲区。光标将位于缓冲区的第一行。你可以使用 `:next` 命令跳转到其他文件。要编辑以连字符开头的文件，请在\
  \ `filelist` 前加 `--`。\n\n- `-`\n\n要编辑的文件从 `stdin` 读取。命令从 `stderr` 读取，后者应该是一个 TTY。\n\
  \n- `-t {tag}`\n\n要编辑的文件和初始光标位置取决于一个“标记”（tag），类似于跳转标签。在 tags 文件中查找 `{tag}`，关联的文件将成为当前文件并执行关联的命令。这通常用于\
  \ C  程序，在这种情况下 `{tag}` 可以是一个函数名。其效果是包含该函数的文件成为当前文件，光标置于函数起始。请参见 `:help tag-commands`。\n\
  \n- `-q [errorfile]`\n\n以快速修复（quickFix）模式启动。读取文件 `[errorfile]` 并显示第一个错误。如果省略 `[errorfile]`，则从\
  \ `errorfile` 选项获取文件名（Amiga 上默认为 `\"AztecC.Err\"`，其他系统上为 `\"errors.err\"`）。可以使用\
  \ `:cn` 命令跳转到后续错误。请参见 `:help quickfix`。\n\n`Vim` 的行为取决于命令名称（可执行文件可能仍是同一个）。\n\n`vim`\n\
  \n“普通”方式，一切均为默认。\n\n`ex`\n\n以 Ex 模式启动。使用 `:vi` 命令进入普通模式。也可以通过 `-e` 参数实现。\n\n`view`\n\
  \n以只读模式启动。你将受到免写入保护。也可以通过 `-R` 参数实现。\n\n`gvim` `gview`\n\nGUI 版本。启动一个新窗口。\n\n`gex`\n\
  \n在 Ex 模式下启动一个新的 `gvim` 窗口。也可以对 `gvim` 使用 `-e` 参数实现。\n\n`vimx`\n\n以类似于 `vim` 的 \"\
  Vi\" 模式启动 `gvim`，但具有额外功能，如 xterm 剪贴板支持。\n\n`evim` `eview`\n\n简单模式下的 GUI 版本。启动一个新窗口。也可以通过\
  \ `-y` 参数实现。\n\n`rvim` `rview` `rgvim` `rgview`\n\n与上述相同，但带有限制。将无法启动 shell 命令或暂停\
  \ `Vim`。也可以通过 `-Z` 参数实现。\n\n## OPTIONS\n\n选项可以任意顺序给出，位于文件名之前或之后。不带参数的选项可以组合在单个连字符之后。\n\
  \n- `+[num]`\n\n对于第一个文件，光标将置于第 `\"num\"` 行。如果缺少 `\"num\"`，光标将置于最后一行。\n\n- `+{pat}`\n\
  \n对于第一个文件，光标将置于 `{pat}` 第一次出现的地方。请参见 `:help search-pattern` 查看可用的搜索模式。\n\n- `+{command}`\n\
  \n- `-c {command}`\n\n在读取第一个文件后将执行 `{command}`。`{command}` 被解释为一条 Ex 命令。如果 `{command}`\
  \ 包含空格，则必须用双引号括起来（这取决于所使用的 shell）。例如：`Vim \"+set si\" main.c`。\n\n注意：你最多可以使用 10\
  \ get `+` 或 `-c` 命令。\n\n- `-S {file}`\n\n在读取第一个文件后将源化 `{file}`。这等同于 `-c \"source\
  \ {file}\"`。`{file}` 不能以 `-` 开头。如果省略 `{file}`，则使用 `\"Session.vim\"`（仅当 `-S` 是最后一个参数时有效）。\n\
  \n- `--cmd {command}`\n\n类似于使用 `-c`，但命令在处理任何 vimrc 文件之前执行。你可以使用最多 10 个 get 这样的命令，且与\
  \ `-c` 命令相互独立。\n\n- `-A`\n\n如果 `Vim` 编译时带有阿拉伯语支持（用于编辑从右向左的文件和阿拉伯键盘映射），此选项将以阿拉伯模式启动\
  \ `Vim`，即设置 `'arabic'`。否则将给出错误信息且 `Vim` 退出。\n\n- `-b`\n\n二进制模式。将设置一些选项，能够编辑二进制或可执行文件。\n\
  \n- `-C`\n\n兼容模式。设置 `'compatible'` 选项。这会让 `Vim` 的行为主要类似于 Vi，尽管存在 `.vimrc` 文件。\n\n\
  - `-d`\n\n以 diff 模式启动。应该有两个、三个或四个文件名参数。\n\n- `-d {device}`\n\n打开 `{device}` 作为终端。\n\
  \n- `-D`\n\n调试。进入调试模式。\n\n- `-e`\n\n以 Ex 模式启动。\n\n- `-E`\n\n以改进模式启动 `Vim`。\n\n-\
  \ `-f`\n\n前台。对于 GUI 版本，`Vim` 将等待。\n\n- `-nofork`\n\nGUI 版本。\n\n- `-m`\n\n禁用修改文件。\n\
  \n- `-M`\n\n不允许修改。\n\n- `-N`\n\n非兼容模式。重置 `'compatible'` 选项。这会让 `Vim` 的行为更好，但与 Vi\
  \ 的兼容性较低，尽管不存在 `.vimrc` 文件。\n\n- `-n`\n\n不使用交换文件。崩溃后恢复是不可能的。\n\n- `-nb`\n\n作为 NetBeans\
  \ 的编辑器服务器。详情请阅文档。\n\n- `-o[N]`\n\n叠加打开 N 个窗口。\n\n- `-O[N]`\n\n并排打开 N 个窗口。\n\n- `-p[N]`\n\
  \n打开 N 个标签页。\n\n- `-R`\n\n\n\n\n只读模式。将设置 `readonly` 选项。你仍然可以编辑缓冲区，但将防止意外覆盖文件。如果你确实想覆盖文件，请在\
  \ Ex 命令后添加感叹号，例如 `:w!`。`-R` 选项也隐含 `-n` 选项（见下文）。`readonly` 选项可以通过 `:set noro` 重置。查看\
  \ `:help 'readonly'`。\n\n`-r`\n\n列出交换文件，并带有关于使用它们进行恢复的信息。\n\n`-r {file}`\n\n恢复模式。交换文件用于恢复崩溃的编辑会话。交换文件是一个与文本文件名相同但带有\
  \ `.swp` 后缀。查看 `:help recovery`。\n\n`-s`\n\n静默模式。只有当作为 \"Ex\" 启动或在 `-s` 选项之前给出 `-e`\
  \ 选项时有效。\n\n`-s {scriptin}`\n\n读取脚本文件 `{scriptin}`。文件中的字符被解释为就像你输入它们一样。可以使用命令 `:source!\
  \ {scriptin}` 实现。如果在编辑器退出之前到达文件末尾，将从键盘继续读取字符。\n\n`-T {terminal}`\n\n告诉 `Vim` 你正在使用的终端名称。仅在自动方式不起作用时需要。应该是\
  \ `Vim`（内置）已知的或在 `termcap` 或 `termin` 文件定义的终端。\n\n`-u {vimrc}`\n\n使用文件 `{vimrc}`\
  \ 中的命令进行初始化。跳过所有其他初始化。用此编辑特殊文件。也可以通过提供名称 `\"NONE\"` 跳过所有初始化。在 vim 中查看 `:help initialization`\
  \ 以获取更多详情。\n\n`-U {gvimrc}`\n\n使用文件 `{gvimrc}` 中的命令进行 GUI 初始化。跳过所有 GUI 初始化。也可以通过提供名称\
  \ `\"NONE\"` 跳过所有 GUI 初始化。在 vim 中查看 `:help gui-init` 以获取更多详情。\n\n`-V[N]`\n\n详细模式。提供关于加载了哪些文件以及读写\
  \ viminfo 文件的消息。可选数字 `N` 是 `verbose` 的值。默认为 10。\n\n`-v`\n\n以 Vi 模式启动 `Vim`，就像调用执行名为\
  \ \"vi\" 一样。这仅在调用执行名为 \"ex\" 时有效。\n\n`-w {scriptout}`\n\n你输入的所有字符都会记录在文件 `{scriptout}`\
  \ 中，直到你退出 `Vim`。如果你想创建一个用于 `vim -s` 或 `:source!` 的脚本文件，这非常有用用。如果 `{scriptout}` 文件存在，则将追加字符。\n\
  \n`-W {scriptout}`\n\n类似于 `-w`，但会覆盖现有文件。\n\n`-x`\n\n写文件时使用加密。将提示加密密钥。\n\n`-X`\n\n\
  不连接到 X 服务器。缩短终端中的启动时间，但不会使用窗口标题和剪贴板。\n\n`-y`\n\n以简单模式启动 `Vim`，就像调用执行名为 \"evim\"\
  \ 或 \"eview\" 一样。让 `Vim` 行为像一个点击并输入类型的编辑器。\n\n`-Z`\n\n限制模式。工作类似于执行程序带有 `\"r\"` 启动。\n\
  \n`--`\n\n表示选项的结束。此后的参数将被视为文件名。这可以用于编辑以 `-` 开头的文件名。\n\n`--echo-wid`\n\n仅限 GTK GUI：在标准输出上回窗口\
  \ ID。\n\n`--help`\n\n提供帮助消息并退出，就像 `-h` 一样。\n\n`--literal`\n\n按字面取文件名参数，不扩展通配符。这在\
  \ shell 扩展通配符的 Unix 上没有影响。\n\n`--noplugin`\n\n跳过加载插件。由 `-u NONE` 隐含。\n\n`--remote`\n\
  \n连接到 Vim 服务器并让它编辑其余参数给出的文件。如果未找到服务器，将给出警告并在当前 Vim 中编辑文件。\n\n`--remote-expr {expr}`\n\
  \n连接到 Vim 服务器，在其中求值 `{expr}`并将结果打印到标准输出。\n\n`--remote-send {keys}`\n\n连接到 Vim 服务器并向其发送\
  \ `{keys}`。\n\n`--remote-silent`\n\n类似于 `--remote`，但在未找到服务器时不给出警告。\n\n`--remote-wait`\n\
  \n类似于 `--remote`，但在文件被编辑之前 `Vim` 不会退出。\n\n`--remote-wait-silent`\n\n类似于 `--remote-wait`，但在未找到服务器时不给出警告。\n\
  \n`--remote-tab[-wait][-silent]`\n\n类似于 `--remote` 但为每个文件使用一个标签页。\n\n`--role`\n\n\
  设置一个唯一的角色来识别主窗口。\n\n`--serverlist`\n\n列出可以找到的所有 Vim 服务器的名称。\n\n`--servername {name}`\n\
  \n使用 `{name}` 作为服务器名称。用于当前 Vim，除非配合 `--remote` 参数使用，此时它是要连接的服务器名称。\n\n`--socketid\
  \ {id}`\n\n仅限 GTK GUI：使用 `GtkPlug` 机制在另一个窗口中运行 `gvim`。\n\n`--version`\n\n打印版本信息并退出。\n\
  \n## 在线帮助\n\n在 `Vim` 中输入 `:help` 开始。输入 `:help subject` 获取有关特定主题的帮助。例如，`:help ZZ`\
  \ 获取 `\"ZZ\"` 命令的帮助。使用 `<Tab>` 和 `CTRL-D` 完成主题（`:help cmdline-completion`）。存在标签可以从一个地方跳转到另一个地方（类似于超链接，查看\
  \ `:help`）。所有文档文件都可以以此方式查看，例如，`:help syntax.txt`。\n\n# 文件\n\n`/usr/share/vim/vim74/doc/*.txt`\n\
  \n`Vim` 文档。\n\n`/usr/share/vim/vim74/doc/tags`\n\n`Vim` 文档。用于查找文档的标签文件。\n\n`/usr/share/vim/vim74/doc/syntax/*.vim`\n\
