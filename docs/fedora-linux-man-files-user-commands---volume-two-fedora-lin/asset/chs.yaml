  \n此命令通过将引用存储在单个文件 `$GIT_DIR/packed-refs` 中来解决存储和性能问题。当传统的 `$GIT_DIR/refs` 层级结构中缺少引用时，将在该文件中查找，如果找到则使用。\n\
  \n对分支的后续更新始终会在 `$GIT_DIR/refs` 目录层级下创建新文件。\n\n处理引用过多仓库的推荐做法是：使用 `--all` 一次打包其引用，并偶尔运行\
