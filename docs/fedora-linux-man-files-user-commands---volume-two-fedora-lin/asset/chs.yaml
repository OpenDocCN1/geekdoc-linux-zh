  \n## 参见\n\n`vimutor(1)`\n\n## 作者\n\n大部分 `Vim` 由 Bram Moolenaar 制作，有许多人的帮助。查看 `:help\
  \ credits` 在 `Vim.`。\n\n## 错误\n\n可能。查看 `:help todo` 列表以获取问题。注意，某些被认为是错误的事情实际上是对\
  \ Vi 行为的过度忠实复制。如果你认为其他事情是“因为 Vi 的不同”。\n\n## 作者\n\nexempi 由 Hubert Figuiere 编写\n\n\
  包含了 Adobe Systems Inc. 编写的 SDK。\n\n## 许可证\n\nexempi 根据 BSD 许可证许可。\n\n* * *\n\n#\
  \ exempi\n\n## 名称\n\nexempi - 操作元数据的命令行工具\n\n## 语法\n\nexempi { -h | [ -R ] | -x\
  \ ] [ -w | -o <file> } ] [ -g <prop_name> | -s <prop_name> -v <value> ] <files>\n\
  \n### 选项\n\n-h: 显示此帮助\n\n-R: 不协调\n\n-x: 转储 XML\n\n-X: 文件(s) 是 XMP\n\n-w: 原地写入。仅针对\
  \ -s。不兼容 -o。\n\n-o <file>: 将输出到。\n\n-n <ns> <prefix>: 设置命名空间的前缀。\n\n-g <prop_name>:\
  \ 获取 prop_name 的值。\n\n-s <prop_name> -v <value>: 获取或获取值。\n\n<files>: 从文件读取。\n\n\
  ## 安全\n\n源代码没有经过安全审核。命令行工具没有强力的输入检查。\n\n小心不要以超级用户身份运行该工具。如果你决定在在线 (web) 中使用它。\n\n\
  欢迎补丁和建议。\n\n## 作者\n\nexempi 由 Hubert Figuiere 编写\n\n它包含了 Adobe Systems Inc. 编写的\
  \ SDK。\n\n## 许可证\n\nexempi 根据 BSD 许可证许可。\n\n* * *\n\n# 扩展\n\n## 名称\n\nexpand - 将制表符转换为空格\n\
  \n## 语法\n\n**expand** [*OPTION]... [*FILE]...\n\n## 描述\n\n将每个 FILE 中的制表符转换为空格，写入到标准输出。\n\
  \n没有 FILE，或者当 FILE 为 - 时，从标准输入读取。\n\n\n\n\n长选项的强制参数对于短选项也是强制的。\n\n`-i`, `--initial`\n\
  \n在非空白字符后不转换制表符\n\n`-t`, `--tabs=*NUMBER*`\n\n制表符之间间隔 `NUMBER` 个字符，而不是 8 个\n\n`-t`,\
  \ `--tabs=*LIST*`\n\n使用逗号分隔的显式制表位置列表\n\n`--help`\n\n显示此帮助并退出\n\n`--version`\n\n\
  输出版本信息并退出\n\n## 作者\n\n由 David MacKenzie 编写。\n\n## 错误报告\n\nGNU coreutils 在线帮助文档：<http://www.gnu.org/software/coreutils/>\
  \ \n\n将 expand 翻译翻译错误报告至 <http://translationproject.org/team/> \n\n## 版权\n\nCopyright\
