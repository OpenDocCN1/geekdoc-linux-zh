  \n锁定访问检查限制了更改防火墙规则的 D-Bus 方法。\n\n### 锁定（Lockdown）\n\n开启锁定。请小心——锁定后 `firewall-cmd`\
  \ 将无法更改防火墙配置。通过此功能，管理员可以锁定防火墙配置，使得只有白名单上的应用程序能够请求防火墙更改。\n\n查询是否锁定。如果为真返回 0，否则返回\
  \ 1。\n\n### 锁定白名单选项（Lockdown Whitelist Options）\n\n锁定白名单可以包含命令（commands）、上下文（contexts）和用户（users）。\n\
  \n锁定项按以下顺序检查：\n\n1. `context`\n2. `uid`\n3. `user`\n4. `command`\n\n### `--list-lockdown-commands`\n\
  \n列出白名单中的所有命令。\n\n### `--add-lockdown-whitelist-command`=*command*`\n\n向白名单添加命令\
  \ `command`。\n\n### `--remove-lockdown-whitelist-command`=*command*`\n\n从白名单中删除命令\
  \ `command`。\n\n### `--query-lockdown-whitelist-command`=*command*`\n\n查询命令 `command`\
  \ 是否在白名单中。如果为真返回 0，否则返回 1。\n\n### `--list-lockdown-contexts`\n\n列出白名单中的所有上下文。\n\n\
  ### `--add-lockdown-whitelist-context`=*context*`\n\n向白名单添加上下文 `context`。\n\n###\
  \ `--remove-lockdown-whitelist-context`=*context*`\n\n从白名单中删除上下文 `context`。\n\n\
  ### `--query-lockdown-whitelist-context`=*context*`\n\n查询上下文 `context` 是否在白名单中。如果为真返回\
  \ 0，否则返回 1。\n\n### `--list-lockdown-uids`\n\n列出白名单中的所有用户 ID。\n\n### `--add-lockdown-whitelist-uid`=*uid*`\n\
  \n向白名单添加用户 ID `uid`。\n\n### `--remove-lockdown-whitelist-uid`=*uid*`\n\n从白名单中删除用户\
  \ ID `uid`。\n\n### `--query-lockdown-whitelist-uid`=*uid*`\n\n查询用户 ID `uid` 是否在白名单中。如果为真返回\
  \ 0，否则返回 1。\n\n### `--list-lockdown-users`\n\n列出白名单中的所有用户名。\n\n**警告：** 如果上下文是未限制的（unconfined），这将开放比目标应用程序更多的访问权限。\n\
  \n### `--add-lockdown-whitelist-user`=*user*`\n\n向白名单添加用户名 `user`。\n\n### `--remove-lockdown-whitelist-user`=*user*`\n\
  \n从白名单中删除用户名 `user`。\n\n### `--query-lockdown-whitelist-user`=*user*`\n\n查询用户名 `user`\
  \ 是否在白名单中。如果为真返回 0，否则返回 1。\n\n### 策略选项（Policy Options）\n\n`--policy-server`\n\n\
  将 Policykit 策略更改为“server”（更严格）。\n\n`--policy-desktop`\n\n将 Policykit 策略更改为“desktop”（较宽松）。\n\
