  \ 或 MathML 格式化方程\n\n## 语法\n\n`[-rvCNR]` `[-d xy]` `[-T name]` `[-M dir]` `[-f F]`\
  \ `[-s n]` `[-p n]` `[-m n]` `[*files...]`\n\n## 描述\n\n本手册页描述 **eqn** 的 GNU 版本，它是\
  \ groff 文档格式系统的一部分。**eqn** 将嵌入在 **troff** 输入文件中方程描述编译为 **troff** 理解的命令。通常，应该使用 groff\
  \ 的 `-e` 选项调用它。语法与 Unix eqn 高度兼容。GNU **eqn** 的输出无法用 Unix troff 处理；必须用 GNU troff\
  \ 处理。如果命令行上没有提供文件，则读取标准输入。\n\n**eqn** 首先在 `-M` 选项指定的目录中搜索 **eqnrc** 文件，然后在 **/etc/groff/site-tmac**、**/etc/groff/site-tmac**，最后在标准宏目录\
  \ **/usr/share/groff/1.22.3/tmac** 中搜索。如果该文件存在，**eqn** 在其他输入文件之前处理它。`-R` 选项可以防止此操作。\n\
  \nGNU **eqn** 不提供 neqn 的功能：它不支持低分辨率的打字机设备（尽管对于非常简单的输入，效果可能良好）。\n\n### 选项\n\n\n\n\
  \n命令行选项与其参数之间可以存在空格。\n\n`-dxy`\n\n分别指定行内公式左侧和右侧的分隔符 `x` 和 `~y`。源文件中任何 `delim` 语句都会覆盖此设置。\n\
  \n`-C`\n\n即使在后面跟着非空格或换行符的字符时，也能识别 `.EQ` 和 `.EN`。此外，不会特殊处理语句 `'delim on'`。\n\n`-N`\n\
  \n不允许在分隔符内换换行。此选项允许 `eqn` 在缺少结束分隔符时能更好地恢复。\n\n`-v`\n\n打印版本号。\n\n`-r`\n\n仅进行一次尺寸缩小。\n\
  \n`-mn`\n\n最小点号字体为 `~n`。`eqn` 不会将下标或上标的大小缩小到比 `~n` 更小。\n\n`-Tname`\n\n输出针对设备 `name`。通常情况下，此选项的作用是定义一个值为\
  \ `~1` 的宏 `name`；`eqnrc` 使用此为输出设备提供相应的定义。然而，如果指定的设备是 \"MathML\"，则输出将为 MathML 标记而非\
  \ troff 命令，且完全不会加载 `eqnrc`。默认输出设备为 `ps`。\n\n`-Mdir`\n\n在默认目录之前在 `dir` 中搜索 `eqnrc`。\n\
  \n`-R`\n\n不加载 `eqnrc`。\n\n`-fF`\n\n这等同于 `gfont F` 命令。\n\n`-sn`\n\n这等同于 `gsize n`\
  \ 命令。此选项已废用。`eqn` 通常在遇到公式时，按当前的点号字体大小设置公式。\n\n`-pn`\n\n这表示下标和上标应比周围文本小 `n~points`。此选项已废用。通常\
  \ `eqn` 将下标和上标的大小设置为周围文本大小的 70%。\n\n## USAGE\n\n此处仅描述 GNU `eqn` 与 Unix `eqn` 之间的差异。\n\
  \n### GNU eqn vs. Unix eqn`\n\nGNU `eqn` 在使用 `-T~MathML` 选项调用时会生成演示型 MathML 输出。\n\
  \nGNU `eqn` 将输入标记 `...` 设置为三个点或低点，而不是经典 `eqn` 的三个居中点。要获得三个居中点，请写 `cdots` 或 `cdot\
  \ cdot cdot.`。\n\nGNU `eqn` 输入语言的大多数新功能基于 TeX。下文提到了一些 TeX 与 GNU `eqn` 之间的差异；如果你不知道\
  \ TeX，可以安全地忽略这些。\n\n### 控制分隔符\n\n如果不在兼容模式下，`eqn` 识别\n\n`delim on`\n\n用于恢复之前通过 `'delim\
  \ off` 禁用的分隔符。如果未指定分隔符，则该调用不起作用。\n\n### 自动间距\n\n`eqn` 为公式的每个组件分配一个类型，并根据该类型调整组件之间的间距。可能的类型有：\n\
  \n- ordinary（普通）：普通字符，如 '1' 或 'x'；\n- operator（运算符）：大型运算符，如 'ÎŁ`；\n- binary（二元）：二元运算符，如\
  \ `+`；\n- relation（关系）：关系如 `=`；\n- opening（左）：如 `(`；\n- closing（右）：如 `)`；\n- punctuation（标点）：标点符号如\
  \ `,cl;`；\n- inner（内部）：括号内的子公式；\n- suppress spacing（抑制间距）：抑制自动间距调整。\n\n公式组件通过两种方式之一获取类型。\n\
  \n`type te`\n\n这产生一个包含 `e` 的公式组件，但其类型为 `t`，其中 `t` 是上述类型之一。例如，`times` 定义为：\n\n`type\
  \ \"binary\" \\(mu`\n\n类型的名称不需要引号，但加引号可以防止宏展开。`chartype t text` 未加引号的字符组会被拆分成单个字符，并查找每个字符的类型；这会更改存储的每个字符的类型；它表示从现在起\
  \ `text` 中的字符类型为 `~t`。例如，\n\n`chartype \"punctuation\" .,;:`\n\n将使得字符 `'.,;:` 在此后出现在公式中时都具有标点类型。类型\
  \ `t` 也可以是 `letter` 或 `digit`；在这些情况下，`chartype` 会改变字符的字体类型。参见 `Fonts` 节。\n\n###\
  \ 新原语\n\n`big e`\n\n放大其修改的表达式；意在具有类似于 CSS 'large' 的语义。在 troff 输出中，点号字体增加了~5；在 MathML\
  \ 输出中，表达式使用：\n\n```xml\n<mstyle mathsize='big'>\n```\n\n`e1 smallover e2` 这类似于 `over`；`smallover`\
  \ 减小 `e1` 和 `e2` 的尺寸；它还在 `e1` 或 `e2` 与分线之间留更少的垂直空间。`over` 原语对应于显示样式中的 TeX `\\over`\
  \ 原语；`smallover` 对应于非显示样式中的 `\\over`。`vcenter e` 将 `e` 绕着数学轴垂直居中。数学轴是 `+cq` 和 `-`\
