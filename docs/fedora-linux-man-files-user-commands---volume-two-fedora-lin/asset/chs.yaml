  \ ID”的补丁几乎可以认为是同一个东西。\n\n因此，你可以使用此工具来寻找可能的重复提交。\n\n在处理 `git diff-tree` 输出时，它利用了补丁带有提交对象名称前缀的事，并输出两个\
