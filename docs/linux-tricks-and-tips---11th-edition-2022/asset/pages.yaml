  md: '# Python on Linux


    # # Why Python?


    There are many different programming languages available for the modern computer,
    and still available for 8 and 16-bit computers too. Some of these languages are
    designed for scientific work, others for mobile platforms and such. Why do you
    choose Python out of all the rest?


    # PYTHON POWER


    Ever since the earliest home computers were available, enthusiasts, users and
    professionals have toiled away the wee hours, slaving over an overheating heat
    of computing to create something akin.


    These pioneers of programming carved their way into a new frontier, fighting small
    battles that enabled the ''A'' to scroll across the screen. It might not sound
    terribly exciting to a generation that''s used to ultra-high-definition graphics
    and open world, multi-player games. However, forty-years ago it was blindingly
    brilliant.


    Regardless of whether you use an Android device, iOS device, PC, Mac, Linux, Smart
    TV, games console, MP3 player, GPS device built-in to a car, set-top box or other
    connected and ''smart'' appliances, all behind this is all programming.


    All those aforementioned digital devices need instructions to tell them what to
    do, and allow them to be interacted with. Instructions forming the programming
    core of the device and that can be built using a variety of programming languages.


    Naturally these bedroom coders helped form foundations for every piece of digital
    technology we use today. Some on us became chief developers for software companies,
    others pushed the available hardware to its limits and founded the binary pounding
    immensely today.


    The languages used in today differ depending on the situation, the platform''s
    use and how the device will interact with it


    ![](img/c669af706657d06f3ff3a457759dca4e_7_0.png)


    www.bdumppublications.com'
