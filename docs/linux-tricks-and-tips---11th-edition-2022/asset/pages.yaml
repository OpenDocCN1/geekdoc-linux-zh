  md: "# Working with Variables\n\n# STEP 5\n\nHowever, you can't combine strings\
    \ and integer variables in the same command, as you need to simil convert one\
    \ into the other or vice versa. When you try to combine both, you get an error\
    \ message:\n\n```\nprint (name + age)\n```python\nPython 3.2 (default. Oct 19\
    \ 2014, 13:31:01)\n>>> name = 'Vikings'\n>>> age = 44\n>>> type(name)\n<class\
    \ 'str'>\n>>> type(age)\n<class 'int'>\n>>> print(name)\nVikings\n>>> print(age)\n\
    44\n>>> print(name + age)\nTraceback (most recent call last):\n  File \"stdin\"\
    , line 1, in <module>\nTypeError: can't concatenate str to int\n\n```\n\n# STEP\
    \ 8\n\nThis presents a bit of a problem when you want to work with a number that's\
    \ been inputted by the user, as age + 10 won't work due being a string and an\
    \ integer. Instead, you need to:\n\n```\nint(age) + 10\n```\n\nThis will Type-cast\
    \ the string into an integer that can be worked\n\n```\nPython 3.2\n# Edit View\
    \ Debug Options Windows help\nPython 3.2 (default. Oct 19 2014, 13:31:01)\n>>>\
    \ age = input(\"How old are you?\")\n'44'\n>>> age = int(age)\n>>> type(age)\n\
    <class 'int'>\n>>> print(age + 10)\n54\n\n```\n\n# STEP 6\n\nthis is a process\
    \ known as Typecasting. The Python code is: `print (character + \" is \" + str(age)\
    \ + \" years \" + str(old.)) `\n\nNotice that in the last example, you don't need\
    \ the spaces between the words in commas as that means comma to print separately.\n\
    \n```\n>>> print (name, \"is, \" + age, \" years old.\")\nVikings is 44 years\
    \ old.\n>>> print (name + \"is, \" + age + \" years old.\")\nVikingsis 44 years\
    \ old.\n\n```\n\n# STEP 9\n\nThis use of Typecasting is also important when working\
    \ with floating point arithmetic; remember numbers with a decimal point. For example,\
    \ enter:\n\n```\n19.99\n```\n\nNow enter `float()` and you'll see that Python\
    \ has allocated the number as a 'Float', which contains a decimal value.\n\n```\n\
    Python 3.2\n# Edit View Debug Options Windows help\nPython 3.2 (default. Oct 19\
    \ 2014, 13:31:01)\n>>> age = input(\"How old are you?\")\n'19.99'\n>>> age = float(age)\n\
    >>> type(age)\n<class 'float'>\n>>> print(age + 10)\n29.99\n\n```\n\n# STEP 7\n\
    \nanother example of Typecasting is when you receive input from the user, as for\
    \ example:\n\n```\nage = input(\"How old are you?\")\n```\n\nAll data input is\
    \ stored as a string as variable.\n\n# STEP 10\n\nWhen combining integers and\
    \ floats Python automatically converts the integer to a float, but the reverse\
    \ is it's worth noting that Python doesn't return the exact value. When converting\
    \ float to integer, Python will always round down to the nearest integer, calling\
