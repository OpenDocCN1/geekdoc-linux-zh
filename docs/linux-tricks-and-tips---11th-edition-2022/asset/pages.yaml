  md: "# STEP 5\n\nPress F5 and save the code to execute it. Enter a four-letter word\
    \ in the Shell to begin with, you should have the returned message that it's word\
    \ four letters. Now press F5 and rerun the program this time a five-letter word.\
    \ The Shell will display that it is\n\n# STEP 6\n\nNow expand the code to include\
    \ another conditions. Eventually, it could become quite complex, We've added a\
    \ condition for three-letter words:\n\n```\nword=input(\"Please enter a four-letter\
    \ word: \")\nword_length=len(word)\nif word_length==4:\n    print(word, \"is a\
    \ four-letter word. Well done.\")\nelif word_length==3:\n    print(word, \"is\
    \ a three-letter word. Try again.\")\nelse:\n    print(word, \"is not a four-letter.\"\
    )\n```\n\n![](img/c669af706657d06f3ff3a457759dca4e_32_0.png)\n\n# LOOPS\n\nA loop\
    \ looks quite similar to a condition but they are somewhat different in their\
    \ operation. A loop will run through the same block of code number of times, usually\
    \ with the support of a condition.\n\n# STEP 1\n\nLet's start with a simple while\
    \ statement. If, this will check to see if something is TRUE, then the indented\
    \ code:\n\n# STEP 3\n\nThe For loop is another example. For is used to loop over\
    \ a range of data, usually a listed inside square brackets. For example:\n\n```\n\
    x = 0\nwhile x < 10:\n    print(x)\n    x = x + 1\n```\n\n```\nwords=[\"Cat\"\
    , \"Dog\", \"Unicorn\"]\nnfor word in words:\n    print(word)\n```\n\n![](img/c669af706657d06f3ff3a457759dca4e_32_1.png)\n\
    \n![](img/c669af706657d06f3ff3a457759dca4e_32_2.png)\n\n# STEP 2\n\nThe difference\
    \ between if and the indented code, it goes back to the end and checks the statement\
    \ is still true. In an example is x then it prints the current value of x, then\
    \ adds one to that value. When x does not equal 10 it stops.\n\n# STEP 4\n\nThe\
    \ For loop can also be used in the count example using the range function.\n\n\
    ```\nfor x in range(1, 10):\n    print(x)\n```\n\nThe x=1 part isn't needed here\
    \ because the range function creates a list between the first and last numbers\
    \ used.\n\n![](img/c669af706657d06f3ff3a457759dca4e_32_3.png)\n\n![](img/c669af706657d06f3ff3a457759dca4e_32_4.png)"
