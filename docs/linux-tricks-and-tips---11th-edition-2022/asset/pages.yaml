  md: '# User Interaction


    There''s nothing quite as satisfying as creating a program that responds to you.
    This basic user interaction is one of the most taught aspects of any language
    and with it you''re able to do much more than greet the user by name.


    # HELLO, DAVE


    You have already used cout, the standard output stream, throughout our code. Now
    you''re going to be using cin, the standard input stream, to program a response.


    +   - STEP 1 Anything that you want the user to input into the system memory,
    needs to be stored somewhere so it can be retrieved and used. Therefore, input
    must first be declared as a variable, so it''s ready to be used by the user. Start
    by creating a blank C++ file with headers.


    +   - STEP 3 The cin command works in the opposite way from the cout command.
    With the first cout you''re output ''What is your age?'' to the screen, as indicated
    with the chevrons. Cin uses facing chevrons, called up indicating an input. The
    input is put into the integer age and called up in the second cout count. And
    run the code.


    ```

    #include <iostream>

    using namespace std;


    int main() {

    cout << "What is your age: ";

    cin >> age;

    cout << "You are " << age << " years old.\n";

    }

    ```


    ![](img/c669af706657d06f3ff3a457759dca4e_59_0.png)


    +   - STEP 2 The data type of input must also match the type of input you want
    from the user. For example, to ask your user, you would use an input like this:


    ```

