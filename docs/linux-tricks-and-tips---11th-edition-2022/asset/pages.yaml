  md: '# Structure of a C++ Program


    C++ has a very defined structure and way of doing things. Miss something out,
    even as small as a semicolon, and your entire program will fail to be compiled
    and executed. Many a programmer has fallen foul of sloppy structure.


    # #INCLUDE <C++>


    Learning the basics of programming, you begin to understand the structure of a
    program. The commands may be different from one language to the next but you can
    start to see how the code works.


    ![](img/c669af706657d06f3ff3a457759dca4e_43_0.png)


    C++ was invented by Danish student Bjarne Stroustrup in 1979, as part of his PhD
    thesis initially called C++ with Classes, which added features to the already
    popular C programming language, while making it a more user-friendly environment
    through a new structure.


    Bjarne Stroustrup, inventor of C++.


    INT MAIN() initiates the declaration of a function, which is a group of code statements
    under the name ''main''. All C++ code begins at the main function, regardless
    of where it lies within the code.


    ```

    helloworld.cpp

    #include <iostream>

    int main()

    ```


    The structure of a C++ program is precise. Every C++ code begins with a directive:
    #include <. The directive instructs the pre-processor to include a section of
    the standard C++ code. For example: #include <iostream> includes the iostream
    header to handle input/output operations.


    The open brace (curly brackets) is something that you may not have come across
    before, especially if you''re used to Python. The open brace indicates the beginning
    of the main function and contains all the code that belongs to that function.


    ```

    helloworld.cpp

    #include <iostream>

    int main()

    {

    }

    ```'
