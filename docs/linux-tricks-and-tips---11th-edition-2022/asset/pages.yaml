  md: "# # How to Set Up Python in Linux\n\nWhile the Raspberry Pi's operating system\
    \ contains the latest, stable version of Python, other Linux distros don't come\
    \ with Python 3 preinstalled. If you're not going down the Pi route, then here's\
    \ how to check and install Python for Linux.\n\n# ## PYTHON PENGUIN\n\nLinux is\
    \ a versatile operating system that it's often difficult to nail down one way\
    \ of doing something. Different distributions go about installing software in\
    \ different ways, so we're sticking with Linux Mint for this particular tutorial.\n\
    \n+   **STEP 1** First need to ascertain which version of Python is currently\
    \ installed in your Linux system. To begin, drop into a Terminal from your system\
    \ or press Ctrl+Alt+T keys.\n\n+   **STEP 3** In our case we have both Python\
    \ 2 and 3 installed; as Python 3.x is installed, then the code is also worth checking\
    \ to see if the driver has been updated with the latest versions, so enter: `sudo\
    \ apt-get update && sudo apt-get upgrade` to the system.\n\n+   **STEP 2** Next\
    \ enter `python --version` in the Terminal. You should have the output showing\
    \ version 2.x of Python in your system. By default, most Linux distros come with\
    \ Python 2 and 3, so there's plenty of code out there available for Python 2.\
    \ Now enter: `python3 --version`.\n\n+   **STEP 4** Once the update and install\
    \ completes, `python3 --version` to see if Python 3.x is installed or updated;\
    \ as long as you have Python 3.x, you're running the most recent version. The\
    \ numbers after the 3 indicate patches and further updates. If you're uncertain\
    \ you can build new elements.\n\n```\nFile Edit View Search Terminal Help\ndavid@david-mint:\
