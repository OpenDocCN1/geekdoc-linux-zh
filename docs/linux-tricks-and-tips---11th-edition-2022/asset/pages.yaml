  md: "# C++ on Linux\n\n# Data Types\n\nVariables, as you've seen, store information\
    \ that the programmer can later call up, and manipulate if required. Variables\
    \ are simply reserved memory locations that they store the values the programmer\
    \ assigns, depending on the data type used.\n\n# THE VALUE OF DATA\n\nThere are\
    \ many different data types available for the programmer in C++, such as an integer,\
    \ floating point, Boolean, character and so on. It's widely accepted that there\
    \ are seven basic data types, often Primitive Built-in Types; however, you can\
    \ create your own data types that need ever arise within your code.\n\nthat by\
    \ adding cout.precision() function and adding a value inside the brackets then\
    \ you're still limited by the accuracy of the double data type. For example, this\
    \ code:\n\n```\n#include <iostream>\nusing namespace std;\ndouble PI = 3.14159265358979238463;\n\
    ```\n\n| Type | Command |\n|---|---|n| Integer | int |\n| Floating Point | float\
    \ |\n| Character | char |\n| Boolean | bool |\n| Double Floating | double |\n\
    | Wide Character | wchar_t |\n| No Value | void |\n\nThese basic can also be extended\
    \ using the modifiers: Long, Short, Signed and Unsigned. Basically means the modifiers\
    \ can expand the minimum and maximum range values for each data type. For example,\
    \ the int data type has default value of -2147483648 to 2147483647, a fair value,\
    \ you would agree.\n\nNow, if you were to use one of the modifiers, the following\
    \ results\n\nUnsigned int = 0 to 4294967295\nSigned int = -2147483648 to 2147483647\n\
    Short int = -32768 to 32767\nUnsigned short = 0 to 65535\nSigned short = -32768\
    \ to 32767\nLong int = -2147483648 to 2147483647\nUnsigned long = 0 to 4294967295\n\
    \nNaturally you can use using the basic type with the modifier, as there is plenty\
    \ of range provided with each data type. However, it's considered C++ programming\
    \ practice to use the modifiers when possible.\n\nThere are issues when using\
    \ the modifiers though. Double represents a double-floating point value, which\
    \ you can use for incredibly accurate numbers but these numbers are only accurate\
    \ up to the fifteenth decimal place. This is also the problem with displaying\
    \ numbers in C++, in function, that you can combat by only outputs the first five\
    \ decimal places. You can combat\n\n```\nDataTypes.cpp\n#include <iostream>\n\
    using namespace std;\ndouble PI = 3.14159265358979238463;\n\nint main() {\n  cout\
    \ << PI;\n}\n```\n\nBuild and run the code as you can see the output is\n3.14159,\
    \ representing cout's limits in this example.\n\nYou can also consider the aforementioned\
    \ cout function, for greater accuracy. Take precision all way up to 22 decimal\
    \ places, with the following code:\n\n```\n#include <iostream>\nusing namespace\
    \ std;\ndouble PI = 3.14159265358979238463;\n\nint main() {\n  cout.precision(22);\n\
    \  cout << PI;\n}\n```\n\n54  www.bdpublications.com\n\n![](img/c669af706657d06f3ff3a457759dca4e_53_0.png)"
