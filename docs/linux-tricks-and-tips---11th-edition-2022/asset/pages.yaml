    \ with the original C language. This meant that it could be used by the mainstream\n\
    \nC++'s impact in the digital world is immense. Many of the programs, applications,\
    \ games and even operating systems are coded using C++. For example, all of Adobe's\
    \ major applications, such as the browser you surf the internet with is written\
    \ in C++, as well as Windows 10, Microsoft Office and so on, are coded in C++,\
