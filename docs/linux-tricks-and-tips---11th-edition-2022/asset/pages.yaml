  md: "# # Conditions and Loops\n\nConditions and loops are what make a program interesting;\
    \ they can be simple or rather complex. How you use them depends greatly on what\
    \ the program is trying to achieve; they could be the number of lives left in\
    \ a game or just displaying a countdown.\n\n# ## TRUE CONDITIONS\n\nKeeping conditions\
    \ simple to begin with makes learning to program a more enjoyable experience.\
    \ Let's start then by checking if something is true, then doing something else\
    \ if it isn't.\n\n+   **STEP 1** Let's create a new Python that will ask the user\
    \ to input a word, then check to see if it's a four-letter word or not. Start\
    \ with File > New, and begin with the input:\n\n```\nword=input(\"Please enter\
    \ a four-letter word: \")\n```\n\n![](img/c669af706657d06f3ff3a457759dca4e_31_0.png)\n\
    \n+   **STEP 3** Now you can use an if statement to check if the word, length\
    \ variable is equal to four and print a friendly confirmation if it applies to\
    \ the rule:\n\n```\nword=input(\"Please enter a four-letter word: \")\nword_length=len(word)\n\
    if word_length == 4:\n    print(word, \"is a four-letter word. Well done.\")\n\
    ```\n\nThe double equal (==) means check if something is equal.\n\n![](img/c669af706657d06f3ff3a457759dca4e_31_1.png)\n\
    \n+   **STEP 2** We can create a new variable, then use the function and pass\
    \ the word through it to get the total number of letters the user has entered:\n\
    \n```\nword=input(\"Please enter a four-letter word: \")\nword_length=len(word)\n\
    ```\n\n+   **STEP 4** The colon at the end of if tells Python that something is\
    \ true to execute after the colon indent. Next, move the cursor back to the beginning\
    \ of the Editor:\n\n```\nword=input(\"Please enter a four-letter word: \")\nword_length=len(word)\n\
    if word_length == 4:\n    print(word, \"is a four-letter word. Well done.\")\n\
    else:\n    print(word, \"is not a four-letter word.\")\n```\n\n![](img/c669af706657d06f3ff3a457759dca4e_31_2.png)"
