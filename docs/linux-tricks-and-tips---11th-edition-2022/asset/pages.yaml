  md: '# # Creating Functions


    Now that you have used the most of useful things in Python, and user input, the
    next step is to tackle functions. You''ve already used a few functions, such as
    the print command but now Python enables you to define your own functions.


    # ## FUNKY FUNCTIONS


    A function is a command that you enter into Python to do something. It''s a little
    piece of self-contained code that takes data, works on it and returns the result.


    +   **STEP 1** It''s not just-data that a function works on. They can do all manner
    of things from one format to another and check the length or type of items. Basically,
    a function is a short word that follows by brackets. For example, `len()`, `list()`
    or `type()`.


    +   **STEP 3** You can pass variables through functions in the same manner. Let''s
    assume you want the number of letters in a person''s surname, you could use the
    following code (enter the text editor for this example):


