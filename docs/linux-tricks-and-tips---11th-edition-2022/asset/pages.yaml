    7   cout << PI;\n8 }\n9\n```\n\nThis is mainly due to the conversion from binary\
    \ in the compiler and that the IEEE 754 double precision accounts for 64-bits\
    \ of data, where 52-bits are to be significant (the significant digits in a floating-point\
    \ number) and roughly 3.5-bits are taken holding the values 0 to 9. If you divide\
    \ by 3.5 then you get 15.42857 recurring, which is 15 digits of precision.\n\n\
