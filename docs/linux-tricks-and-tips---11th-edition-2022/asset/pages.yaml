  md: "# C++ COMMENTS\n\nCommenting in C++ involves using a double forward slash '//'\
    \ or a forward slash and an asterisk '*'. You've already seen brief examples but\
    \ this is how it works.\n\nUsing the Hello World as an example, you can easily\
    \ comment on different sections of the code using the double forward slash:\n\n\
    Be careful when commenting, especially with block comments. It's very easy to\
    \ forget to add the closing asterisk and forward slash to negate any code that\
    \ falls inside the comment block.\n\n```\nhelloworld.cpp x\n#include <iostream>\n\
    using namespace std;\n\nint main() {\n    // My first C++ program\n    cout <<\
    \ \"Hello, world!\"\\n;\n    cout << \"Greetings from C++\"\\n;\n}\n```\n\nHowever,\
    \ you can also comment to the end of a line of code, to describe in a better way\
    \ what goes:\n\ncout << \"Hello, world!\"\\n // This outputs the words 'Hello,\
    \ world.' The \\n denotes a new line.\n\nObviously if you build and execute the\
    \ block commented code it errors out, because of a missing curly bracket '}' to\
    \ finish off the block of code. If you move it then is time to go back and rectify.\
    \ The colouring used by Geanty identifies comments from code.\n\nNote, don't put\
    \ a semicolon at the end of a comment. This is because it's a line that's ignored\
    \ by the compiler.\n\n```\nhelloworld.cpp\n#include <iostream>\nusing namespace\
    \ std;\n\nint main() {\n    // My first C++ program\n    cout << \"Hello, world!\"\
    \\n // This outputs the words 'Hello, world.' The \\n denotes a new line.\n}\n\
    ```\n\nYou can comment separate lines by using the forward slash and asterisk:*\n\
    \n```\n// This comment can\n* cover separate lines\nwithout the need to add more\
    \ slashes /*\n```\n\nRemember to finish the block comment with the opposite asterisk\
    \ and forward slash.\n\nWith block comments, it's good practice in C++ to add\
