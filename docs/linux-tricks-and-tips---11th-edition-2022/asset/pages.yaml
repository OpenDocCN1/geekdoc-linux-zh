  md: '# C++ on Linux


    # Common Coding Mistakes


    When you start something you''re inevitably going to make mistakes, this is purely
    down to inexperience and those mistakes are great teachers in themselves. However,
    even experts make the occasional mishap. This is, to learn from them as best as
    you can.


    # X=MISTAKE, PRINT Y


    There are many pitfalls for the programmer to be aware of, far too many to be
    listed here. Being able to recognise a mistake and fix it when you start to move
    into more advanced territory, and become a better coder. Everyone makes mistakes,
    even coders with thirty years'' experience. Learning from these common mistakes
    helps build a better coding foundation.


    ![](img/c669af706657d06f3ff3a457759dca4e_63_0.png)


    # SMALL CHUNKS


    It would be wonderful to work like Neo from The Matrix movies. Simply ask, your
    operator loads it into your memory and you instantly know everything about the
    subject. Sadly we can''t do that. The major pitfalls is trying to learn too much,
    too quickly. So coding in pieces and take your time.


    # EASY VARIABLES


    Meaningful naming for variables is a must to eliminate common coding mistakes.
    Having letters of the alphabet is fine but what when the code states the problem
    with x variable. It''s not too difficult to name lives, player 1 and so.


    ```

    var points = 1023;

    var lives = 3;

    var totalTime = 45;

    write("Points: " + points);

    write("Lives: " + lives);

    write("Total Time: " + totalTime + "");

    var highScore = 0;

    write("Your Total Score is " + highScore);

    ```


    # //COMMENTS


    Using comments is a simple concept but commenting when your code saves so many
    problems when you come to look over it. Inserting comments helps you quickly get
    through lines of code that are causing problems; also useful if you need to review
    an old piece of code.


    ```

    // orig = 2;

    target = 2;


    //endif

    if (n != 0) {

    return;

    }


    // Loop unrolling. We were because


    // (n - (-3)) is the greatest multiple of 4

    increment = (n + 3) & ~3;

    char const _end = n + (n & ~3);

    // ends our barrier for not falling out


    // See if we''re aligned for writing in 64 bit

    // If sizeof(long) == 8

    !((defined(__amd64__) || defined(__x86_)))

    ```


    # PLAN AHEAD


    While it''s great to write one morning and decide to code a classic text, it''s
    not always practical without a good plan. Small snippets of code can be written
    without too much thinking but planning more in depth code requires a good plan
    to stick to and iron out the bugs.


    ![](img/c669af706657d06f3ff3a457759dca4e_63_1.png)


