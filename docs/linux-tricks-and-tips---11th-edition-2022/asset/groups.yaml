    | Python-3.7/objects/libfloat.c.h |\n| Python-3.7/objects/liblong.c.h |\n| Python-3.7/objects/libenum.c.h\
    \ |\n| Python-3.7/objects/libarray.c.h |\n| Python-3.7/objects/libset.c.h |\n\
    | Python-3.7/objects/liblist.c.h |\n| Python-3.7/objects/libmap.c.h |\n| Python-3.7/objects/libstring.c.h\
    \ |\n| Python-3.7/objects/libbool.c.h |\n| Python-3.7/objects/libmath.c.h |\n\
    | Python-3.7/objects/libsignal.c.h |\n| Python-3.7/objects/libframe.c.h |\n| Python-3.7/objects/libmethod.c.h\
    \ |\n| Python-3.7/objects/libclass.c.h |\n| Python-3.7/objects/libtypes.c.h |\n\
    | Python-3.7/objects/libbuffer.c.h |\n| Python-3.7/objects/libmemory.c.h |\n|\
    \ Python-3.7/objects/libhash.c.h |\n| Python-3.7/objects/libbytes.c.h |\n\n##\
    \ Starting Python for the First Time\n\nIf you're using the Raspberry Pi together\
    \ with its latest release of the Pi OS, you will need to manually install Python\
    \ IDLE. This is due to the Pi team removing core IDLE in favour of your own text\
    \ editor.\n\n## STARTING PYTHON\n\nFor those using the Pi4 and new Raspian, drop\
    \ into a Terminal and use: sudo apt-get install idle3. Older versions of Raspian\
    \ already have the official IDLE pre-installed.\n\nWith the Raspian desktop, click\
    \ on the Menu by Programming > Python 3 (IDLE). Windows and Mac users can find\
    \ Python 3 IDLE from the Windows Start menu and via Finder.\n\nFor example, in\
    \ the shell: 2+2\nAfter pressing Enter, the next line displays the answer: 4.\
    \ Basically, Python has taken the 'code' and produced the relevant output.\n\n\
    ![](img/c669af706657d06f3ff3a457759dca4e_11_0.png)\n\nThe Shell is where you can\
    \ enter code and see the responses and output of code you've programmed into.\
    \ This is a kind of sandbox, where you're able to try some simple code and processes.\n\
    \nThe Python Shell acts very much like a calculator, since code is basically of\
    \ a series of mathematical interactions with the system. Integers, which are the\
    \ infinite sequence of numbers can be easily added, subtracted, multiplied and\
    \ so on.\n\n```\nFile Edit View Search Terminal Help\ndavid@david-mint: $ python\
    \ --version\nPython 3.4.2 (Default, Oct 19 2014, 13:31:11)\non Linux\n>>> 'copyright',\
    \ 'credits' or 'license' for more information.\n>>> 4\n4 >>>\n```\n\n```\nFile\
    \ Edit View Search Terminal Help\ndavid@david-mint: $ python --version\nPython\
    \ 3.4.2 (Default, Oct 19 2014, 13:31:11)\non Linux\n>>> 'copyright', 'credits'\
    \ or 'license' for more information.\n>>> 4\n4 >>>\n>>> 8+6\n14 >>>\n>>> 2345*6445252\n\
    15089114440 >>>\n>>> 977862442343-12343\n>>> 9778624423*43034\n50647282358\n>>>\n\
    ```\n"
  mdcn: "\n\n# 如何在 Linux 中安装 Python\n\n虽然树莓派的操作系统包含了最新、稳定版本的 Python，但其他 Linux 发行版并没有预装\
