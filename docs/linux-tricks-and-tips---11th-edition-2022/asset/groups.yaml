    \ this code:\n\n```cpp\n#include <iostream>\nusing namespace std;\ndouble PI =\
    \ 3.1415926535897238463;\n```\n\n| Type | Command |\n| :--- | :--- |\n| Integer\
    \ | int |\n| Floating Point | float |\n| Character | char |\n| Boolean | bool\
    \ |\n| Double | double |\n| Wide Character | wchar_t |\n| No Value | void |\n\n\
    These basic can also be extended using the modifiers: Long, Short and Unsigned.\
    \ Basically means the modifiers can expand the minimum and maximum range values\
    \ for each data type. For example, the int data type has default value of -2147483648\
    \ to 2147483647, a fair value, you would agree. Now, if you were to use one of\
    \ the modifiers, the following results:\n\nUnsigned int = 0 to 4294967295\nSigned\
    \ int = -2147483648 to 2147483647\nShort int = -32768 to 32767\nUnsigned short\
    \ = 0 to 65535\nSigned short = -32768 to 32767\nLong int = -2147483648 to 2147483647\n\
    Unsigned long = 0 to 4294967295\n\nNaturally you can use the basic type with the\
    \ modifier, as there is plenty range provided with each data type. However, it's\
