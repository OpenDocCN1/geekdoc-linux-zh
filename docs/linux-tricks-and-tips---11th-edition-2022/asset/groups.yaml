    # Using Comments


    While comments may seem like a minor element to the many lines of code to make
    a game, application or even an entire operating system, in fact they''re probably
    one of the most important factors.


    # THE IMPORTANCE OF COMMENTING


    Comments inside code are basically human readable descriptions of what the code
    is doing at that particular point. They don''t sound especially important but
    code without comments is one of the frustrating realities you''re a professional
    or just starting out.


    In short, all code should be commented in a manner to effectively describe the
    purpose of a line, section or individual elements. You should get in the habit
    of commenting as much as possible so someone who doesn''t know anything about
    programming can pick up your code and understand what it''s going to do by reading
    it.


    In a professional environment, comments are vital to the success of the code and
    ultimately, the company or project. In many organizations programmers work alongside
    engineers, other developers, hardware analysts and more. If a part of the team
    you''re writing a basic piece of software for the company, then your comments
    help save a lot of time when something goes wrong and another team has to pick
    up and follow the intent.


    Place yourself in the shoes of someone who''s job is to find out what''s wrong
    with a program. The program has hundreds of lines of code, spread across different
    modules. You might also need a little help from the original programmers in the
    form of a good comment.


    The best comments are always concise and link the code logically, detailing what
    the program hits a line or a section. You don''t need to comment on every line.
    Something along the lines of: if x==0 does not require you to comment that it
    equals zero then that''s going to be obvious to the reader. If x is something
    that drastically changes the program for the user, like when you''ve run out of
    lines, it certainly needs to be commented on.


    If the code is yours, you should write comments as if you are sharing it with
    others. This can return you to code and understand what it was or where you were,
    or what worked brilliantly.


    Comments are good practice and once you understand how to add a comment when needed,
    it''ll become your second nature.


