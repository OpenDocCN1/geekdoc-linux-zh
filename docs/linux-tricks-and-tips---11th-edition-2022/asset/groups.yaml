    \ multi-player games. However, forty years ago it was blinding brilliant. Regardless\
    \ of whether you use Android, iOS, PC, Linux, Smart TV, games console, GPS device\
    \ built-in to a car, set-top box or other connected appliances, all those digital\
    \ devices need instructions to tell them what to do, and allow them to be interacted\
