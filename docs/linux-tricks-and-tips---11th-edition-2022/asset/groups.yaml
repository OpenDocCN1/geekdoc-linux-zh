  mdcn: "\n\n# C++ 程序的结构\n\nC++ 有着非常明确的结构和处理方式。漏掉任何部分，即使是一个微小的分号，你的整个程序将无法编译和执行。许多程序员都曾毁在粗糙的结构上。\n\
    \n## #include <iostream>\n\n在学习编程基础知识时，你开始理解程序的结构。虽然命令在不同语言之间可能不同，但你可以开始看到代码是如何运作的。\n\
    \n![](img/c669af706657d06f3ff3a457759dca4e_43_0.png)\n\nC++ 是丹麦学生 Bjarne Stroustrup\
