  mdcn: "\n\n## 为什么选择 C++？\n\nC++ 是当今最流行的编程语言之一。它最初被称为带有类的 C++（C++ with Classes），在1983年更名为\
    \ C++。它是原始 C 语言的扩展，是一个通用的面向对象（OOP）环境。\n\n## 概述\n\n由于该语言的复杂性以及其强大的功能和性能，C++ 通常用于开发游戏、程序、设备驱动程序甚至操作系统。\n\
    \nC++ 可以追溯到1979年，即个人计算时代的开始。C++ 或者确切说是 C 是丹麦计算机科学家比雅恩·斯特斯特鲁普（Bjarne Stroustrup）在读博士期间使用原始\
    \ C 语言时的结晶。C 语言在早期计算机实验室以及无法访问大型机和大型计算数据中心的普通人中广泛使用。\n\nC++ 证明了自己在80年代的开发者中非常受欢迎，因为它是一个更容易上手的环境，更重要的是，它与原始\
    \ C 语言有 99% 的兼容性。这意味着它可以被主流开发者使用。\n\nC++ 对数字世界的影响是巨大的。许多程序、应用程序、游戏甚至操作系统都是使用 C++\
    \ 编写的。例如，Adobe 的所有主要应用程序（如你上网时浏览器）是用 C++ 编写的，Windows 10、Microsoft Office 等也是用\
    \ C++ 编写的，它是 Google 搜索引擎的骨干。Apple 的 macOS 是用 C++ 编写的（某些 C++ 代码比 Python 快得多）。\n\
    \n```cpp\n#include <iostream>\nvoid main() {\n    char ch;\n    cout << \"Enter\
    \ a character to check if it is vowel or not\";\n    cin >> ch;\n    switch (ch)\
    \ {\n        case 'a': case 'A':\n            cout << ch << \" is a Vowel\";\n\
    \            break;\n        case 'e': case 'E':\n            cout << ch << \"\
    \ is a Vowel\";\n            break;\n        case 'i': case 'I':\n           \
    \ cout << ch << \" is a Vowel\";\n            break;\n        case 'o': case 'O':\n\
    \            cout << ch << \" is a Vowel\";\n            break;\n        case\
    \ 'u': case 'U':\n            cout << ch << \" is a Vowel\";\n            break;\n\
    \    }\n    default: \n}\n```\n\n## 为什么选择 C++？\n\n安装 - Visual Studio Community\
    \ 2017 (15.0.26223.1),异步\n\n| 工作负载 | Individual组件 | 语言包 |\n|---|---|---|\n| Windows\
    \ (3) | 通用 平台开发（使用 C#VB、JavaScript 或 C++ 为通用 平台创建应用程序） | .NET 开发（使用 .NET Framework\
    \ 构建 WPF、Windows Forms 和控制台应用程序。） | |\n| 使用 C++ 开发（使用 C++ 工具集、ATL 以及 MFC 等其他功能构建基于经典的应用程序）\
    \ | | |\n| Web 与云 (4) | ASP.NET Web 开发（使用 ASP.NET、ASP.NET Core、HTML、JavaScript\
    \ 和 CSS 构建可扩展的 Web 应用程序） | Azure 开发（部署云应用和创建资源的项目。） | | |\n\n## 使用 C++ 开发\n\n\
    - C++ 核心开发功能\n- VC++ 2017 工具集 (v141) x86,x64\n- Windows SDK (10.0.14363.0)\n-\
    \ C++ 性能分析工具\n- C++ 工具\n- Windows XP 对 UCRT SDK 的支持\n- Windows XP 对 C++ 的支持\n\
    - C++ Visual Studio\n- 通用 MFC\n- 标准库\n\n可选\n\n![](img/c669af706657d06f3ff3a457759dca4e_40_0.png)\n\
    \n> Microsoft 的 Visual Studio 是一个学习 C++ 的极佳免费环境。\n\n根据功能等需求，NASA、SpaceX 和 CERN\
    \ 等机构将 C++ 用于各种应用程序、程序、控制和其他计算任务。\n\nC++ 极其高效，在各方面表现都非常出色，而且作为核心语言的扩展也更容易添加。与\
    \ Python、BASIC 和 Swift 等语言相比，这种更高水平的性能使其在使用上述广泛组件时，成为现代计算的理想开发环境。\n\n虽然 Python\
    \ 是一门非常棒的入门语言，但 C++ 将开发者带入了一个更广阔的代码世界。通过掌握 C++，你可以在 Microsoft、Apple 和 Google 找到工作。通常，C++\
    \ 开发者的薪水比其他一些语言高，由于这种特性，C++ 程序员可以在工作和公司之间转换，而无需学习任何特定内容。然而，C++ 是一门入门更容易的语言。如果你是编程完全新手，我们建议你从\
    \ Python 开始，花些时间了解通过编程找到解决方案的许多方法。你可以用一只手为电脑助力，另一只手揉背。当然，没有什么可以阻止你直接跳到 C++；如果你觉得能胜任，尽管去尝试。\n\
    \n使用 C++ 像 Python 一样简单，因为你只需要在旅程中一套与计算机通信的工具。C++ IDE 是免费的，即使是微软功能强大的 Visual Studio\
    \ 也可以免费下载和使用。你可以从任何操作系统进入 C++，无论是 macOS、Linux、Windows 甚至移动平台。\n\n就像 Python 一样，要回答“为什么\
    \ C++ 是答案”的问题：它是快速、高效的，并且用于你大多数常用的应用程序。它是前沿的，是一门值得掌握的优秀语言。事实上，C++ 代码比 Python 快得多。\n\
    \n![](img/c669af706657d06f3ff3a457759dca4e_40_1.png)\n![](img/c669af706657d06f3ff3a457759dca4e_40_2.png)\n\
    \n## 你的 C++ 程序\n\nHello, World!\n\n第 1 步：如果你还没有这样做，建议创建一个空白文件来保存你的代码。你可以为 Python\
    \ 和 C++ 分别准备一个文件，或者简单地创建一个名为 Code 的文件夹，随你的喜好。这不是必须的，只是一个良好的习惯。\n\n第 2 步：注意 Geany\
    \ 自动创建了微小的缩进。这是由于 C++ 的结构导致的，这也是输入代码主体的地方。\n\n第 3 步：注意颜色变化。在上一步的行尾按回车键，然后输入：\n\
    \n第 4 步：注意 Geany 自动创建了微小的缩进。这是由于 C++ 的结构导致的，这也是输入代码主体的地方。\n\n第 5 步：在 int() 下的下一行创建一个大括号：\n\
    \n第 6 步：注意 Geany 自动创建了微小的缩进。这是由于 C++ 的结构导致的，这也是输入代码主体的地方。\n\n第 7 步：再次注意颜色变化。在上一步的行尾按回车键，然后输入：\n\
    \n第 8 步：现在你需要关闭代码，插入相反的大括号。\n\n第 9 步：本质上，这些是你进入 C++ 世界的第一步。我们将在接下来的几页中详细查看代码结构：但现在请点击由带有绿色箭头的文件柜表示的保存按钮。\n\
