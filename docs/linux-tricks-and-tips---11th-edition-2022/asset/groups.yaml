    \ `char` 函数。打开一个新的 C++ 文件并以标准的头文件开始：\n\n- 步骤 3\n编译并运行代码，“Welcome” 会出现在屏幕上。虽然这样做完全可行，但它并不是字符串。String\
    \ 是一个类，定义了可以表示为字符流的对象，并且不需要像数组那样终止。因此，代码可以表示为：\n\n```cpp\n#include <iostream>\n\
    using namespace std;\nint main() {\n}\n```\n\nstrings.cpp\n```cpp\n#include <iostream>\n\
    using namespace std;\nint main() {\n    char greet[] = \"Welcome\";\n    cout\
    \ << greet << \"\\n\";\n}\n```\n\n- 步骤 2\n很容易将字符串与数组混淆。这是一个数组，空字符终止：\n\n```cpp\n\
    #include <iostream>\nusing namespace std;\nint main() {\n    char greet[8] = {'W',\
    \ 'e', 'l', 'l', 'o', 'm', 'e', '\\0'};\n    cout << greet << \"\\n\";\n}\n```\n\
    \n- 步骤 4\n在 C++ 中也有一种字符串，其工作方式相同。使用欢迎语代码，\n\n```cpp\n#include <iostream>\nusing\
    \ namespace std;\nint main() {\n    string greet = \"Welcome\";\n    cout << greet\
    \ << \"\\n\";\n}\n```\n\nstrings.cpp\n```cpp\n#include <iostream>\nusing namespace\
    \ std;\nint main() {\n    char greet[] = \"Welcome\";\n    cout << greet << \"\
    \\n\";\n}\n```\n\n```cpp\n#include <iostream>\nusing namespace std;\nint main()\
    \ {\n    string greet = \"Welcome\";\n    cout << greet << \"\\n\";\n}\n```\n\n\
    # 字符串\n\n# 步骤 5\n\n还有许多可以使用字符串函数执行的不同操作。例如，要获取字符串的长度，可以使用：\n\n```cpp\n#include\
    \ <iostream>\nusing namespace std;\nint main() {\n    string greet = \"Welcome\"\
    ;\n    cout << \"The length of the string is: \";\n    cout << greet.size() <<\
    \ \"\\n\";\n}\n```\n\n# 步骤 8\n\n正如你预期的那样，你可以将整数和某些要存储的内容与字符串混合。如果你创建了一个 `int length`，它存储\
    \ `string size()` 的结果并输出到屏幕上：\n\n```cpp\n#include <iostream>\nusing namespace\
    \ std;\nint main() {\n    int length;\n    string greet1 = \"Hello\";\n    string\
    \ greet2 = \"world!\";\n    string greet3 = greet1 + greet2;\n\n    length = greet3.size();\n\
    \    cout << \"The length of the combined strings is: \";\n    cout << length\
    \ << \"\\n\";\n}\n```\n\n# strings.cpp\n```cpp\n#include <iostream>\nusing namespace\
    \ std;\nint main() {\n    string greet = \"Welcome\";\n    cout << \"The length\
    \ of the string is: \";\n    cout << greet.size() << \"\\n\";\n}\n```\n\n# 步骤\
    \ 6\n\n你可以看到我们使用 `size()` 输出输出长度，即字符串内容的字符数量。当然，如果你调用的字符串不是 `greet`，那么你就需要更改命令以反映它的字符串名。运行并编译代码查看结果。\n\
    \n# 步骤 9\n\n使用可以使用字符串的可用操作，你可以操作并删除字符串中的字符，可以使用：\n\n```cpp\n#include <iostream>\n\
    using namespace std;\nint main() {\n    string str = \"Hello is a long sentence\
    \ in a string\";\n    cout << str << \"\\n\";\n    str.erase(10,5);\n    cout\
    \ << str << \"\\n\";\n    str.erase(str.begin() + 8);\n    cout << str << \"\\\
    n\";\n    str.erase(str.begin() + 9, str.end());\n    cout << str << \"\\n\";\n\
    }\n```\n\n# 字符串的长度为：\n\n```\n(程序以代码 0 退出)\n按回车继续\n```\n\n# 步骤 7\n\n你可以将字符串相加，或者组合它们形成更长的字符串：\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\nint main() {\n    string\
    \ greet1 = \"Hello\";\n    string greet2 = \"world!\";\n    string greet3 = greet1\
    \ + greet2;\n\n    cout << greet3 << \"\\n\";\n}\n```\n\n# 步骤 10\n\n值得花时间玩玩这些数字，它们是字符串中的字符位置。你是否写对可能碰运气，所以练习会使其完美。看一眼屏幕查看代码的结果：\n\
    \n# strings.cpp\n```cpp\n#include <iostream>\nusing namespace std;\nint main()\
    \ {\n    string greet1 = \"Hello\";\n    string greet2 = \"world!\";\n    string\
    \ greet3 = greet1 + greet2;\n\n    cout << greet3 << \"\\n\";\n}\n```\n\n# 文件编辑标签帮助\n\
    \n这是一个字符串中的长句子。\n这是一个字符串中的句子。\n这是一个字符串。\n\n```\n(程序以代码 0 退出)\n按回车继续\n```\n\n#\
    \ C++ 数学\n\n编程在本质上是数学性的，正如你预期的那样，有许多内置范围可以处理深层数学计算。C++ 为将数学模型实现到代码中的人提供了很多可能。它可以非常复杂，也可以很简单。\n\
    \n# C++ = MC2\n\nC++ 中的基本数学符号与其他大多数编程语言相同。但是，通过使用 C++ 数学库，你还可以计算平方根、幂、三角函数等。\n\
    \n步骤 1\nC++ 的数学操作遵循学校里教的模式，乘法和除法的优先级高于加法和减法。你可以创建一个新文件并输入：\n\n```cpp\n#include\
    \ <iostream>\nusing namespace std;\nint main() {\n    float numbers = 100;\n \
    \   numbers = numbers + 10; // 在初始值上加上 10\n    cout << numbers << \"\\n\";\n \
    \   numbers = numbers - 10; // 从新值上减去 10\n    cout << numbers << \"\\n\";\n}\n\
    ```\n\n步骤 3\n乘法和除法可以这样应用：\n\n```cpp\n#include <iostream>\nusing namespace std;\n\
    int main() {\n    float numbers = 100;\n    numbers = numbers * 10; // 这将 100\
    \ 乘以 10\n    cout << numbers << \"\\n\";\n    numbers = numbers / 10; // 这将 100\
    \ 除以 10\n    cout << numbers << \"\\n\";\n}\n```\n\n```cpp\n#include <iostream>\n\
    using namespace std;\nint main() {\n    float numbers = 100;\n    numbers = numbers\
    \ + 10; // 在初始 100 上加上 10\n    cout << numbers << \"\\n\";\n    numbers = numbers\
    \ - 10; // 从新的 110 上减去 10\n    cout << numbers << \"\\n\";\n}\n```\n"
