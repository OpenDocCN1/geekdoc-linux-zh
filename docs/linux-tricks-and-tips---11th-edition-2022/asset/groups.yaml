    \ | Python-3.7/objects/libmemory.c.h | Python-3.7/objects/libhash.c.h |\n| Python-3.7/objects/libbytes.c.h\
    \ |\n\n## 首次启动 Python\n\n如果你正在使用树莓派配合其最新版本的 Pi OS，你需要手动安装 Python IDLE。这是因为树莓派团队移除了核心\
    \ IDLE，转而使用自己的文本编辑器。\n\n## 启动 Python\n\n对于使用 Pi4 和新 Raspian 的用户，进入终端并使用：sudo apt-get\
    \ install idle3。旧版本的 Raspian 预装了官方 IDLE。\n\n在 Raspian 桌面上，点击菜单 Programming > Python\
    \ 3 (IDLE)。Windows 和 Mac 用户可以通过 Windows 开始菜单和 Finder 找到 Python 3 IDLE。\n\n例如，在\
    \ shell 中：2+2\n按下回车键后，下一行显示答案：4。基本上，Python 接收了“代码”并产生了相应的输出。\n\n![](img/c669af706657d06f3ff3a457759dca4e_11_0.png)\n\
    \nShell 是你可以输入代码并看到你编写的代码的响应和输出的地方。这是一个沙箱，你可以在这里尝试一些代码和处理。\n\nPython Shell 的作用非常像计算器，因为代码基本上是与系统的一系列数学交互。整数（无限数字序列）可以很容易地进行加、减、乘等。\n\
