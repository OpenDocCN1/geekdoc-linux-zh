    ![](img/c669af706657d06f3ff3a457759dca4e_34_0.png)\n\n## STEP 6\n\nThe modules\
    \ contain the extra code needed to achieve a certain result within your code,\
    \ as we've previously experimented with. For example:\n\n```python\nimport random\n\
    ```\n\nBrings in code the Random Number Generator module. You can use this to\
    \ create something like:\n\n```python\nfor i in range(10):\n    print(random.randint(1,\
    \ 25))\n```\n\n![](img/c669af706657d06f3ff3a457759dca4e_34_1.png)\n\n## STEP 9\n\
    \nThe result is a string of numbers followed by the value of Pi as pulled from\
    \ the Math module using print(math.pi). You can also pull in certain functions\
    \ from a module using the import and from commands, as such:\n\n```python\nfrom\
    \ random import randint\nfor i in range(5):\n    print(random.randint(1, 25))\n\
    ```\n\n## STEP 7\n\nThis code, when saved and executed, will display random numbers\
    \ from 1 to 25. You can play around with: For example:\n\n```python\nimport random\n\
    \nfor i in range(25):\n    print(random.randint(1, 100))\n```\n\n![](img/c669af706657d06f3ff3a457759dca4e_34_2.png)\n\
