    \ \")\n        if guess.lower() not in 'abcdefghijklmnopqrst':\n            print(\"\
    invalid letter. Try again.\")\n            continue\n        if len(set(guessed_letters))\
    \ == 1:\n            print(\"the letter is the only one left\")\n            print(\"\
    that's not mine. Please try again.\")\n            continue\n        if guess\
    \ in guessed_letters:\n            print(\"you've already guessed that letter.\
    \ Please try again.\")\n            continue\n        else:\n            pass\n\
    \        guessed_letters.append(guess)\n        for i in range(len(choice)):\n\
    \            if guess == choice[i]:\n                print(\"guess is the correct\
    \ letter!\")\n                choice.pop(i)\n            else:\n             \
    \   print(\"guess is not in chosen; replace all letters in the chosen\")\n   \
    \ return\n```\n\nBASIC was the start language that early 8-bit home computer users.\n\
    \nPython is a modern language that is easier to learn than BASIC and makes for\
    \ an ideal beginner's learning journey."
- md: "\n# How to Set Up Python in Linux\n\nWhile the Raspberry Pi's operating system\
    \ contains the latest, stable version of Python, other Linux distros don't come\
    \ with Python 3 preinstalled. If you're not going down the Pi route, then here's\
    \ how to check and install Python for Linux.\n\n## PYTHON PENGUIN\n\nLinux is\
    \ a versatile operating system that it's often difficult to nail down one way\
    \ of doing something. Different distributions go about installing software in\
    \ different ways, so we're sticking with Linux Mint for this particular tutorial.\n\
    \n- **STEP 1** First need to ascertain which version of Python is currently installed\
    \ in your Linux system. To begin, drop into a Terminal from your system or press\
    \ Ctrl+Alt+T keys.\n- **STEP 2** Next enter `python --version` in the Terminal.\
    \ You should have the output showing version 2.x of Python in your system. By\
    \ default, most Linux distros come with Python 2 and 3, so there's plenty of code\
    \ out there available for Python 2. Now enter: `python3 --version`.\n- **STEP\
    \ 3** In our case we have both Python 2 and 3 installed; as Python 3.x is installed,\
    \ then the code is also worth checking to see if the driver has been updated with\
    \ the latest versions, so enter: `sudo apt-get update && sudo apt-get upgrade`\
    \ to the system.\n- **STEP 4** Once the update and install completes, `python3\
    \ --version` to see if Python 3.x is installed or updated; as long as you have\
    \ Python 3.x, you're running the most recent version. The numbers after the 3\
    \ indicate patches and further updates. If you're uncertain you can build new\
    \ elements.\n\n```\nFile Edit View Search Terminal Help\ndavid@david-mint: $ python\
    \ --version\nPython 2.7.15\ndavid@david-mint: $ python3 --version\nPython 3.6.7\n\
    ```\n\n```\nFile Edit View Search Terminal Help\ndavid@david-mint: $ python --version\n\
    Python 2.7.15\ndavid@david-mint: $ python3 --version\nPython 3.6.7\n```\n\n```\n\
    File Edit View Search Terminal Help\ndavid@david-mint: $ python --version\nPython\
    \ 2.7.15\ndavid@david-mint: $ python3 --version\nPython 3.6.7\n```\n\n```\nsudo\
    \ apt-get update\nReading package lists... Done\nGet:1 http://archive.ubuntu.com/ubuntu\
    \ focal Insecure amd64 In (Checking lists)\nGet:2 http://archive.ubuntu.com/ubuntu\
    \ focal-updates Insecure amd64 In (Checking updates)\nFetching 1.1 MB [110 kB]\n\
