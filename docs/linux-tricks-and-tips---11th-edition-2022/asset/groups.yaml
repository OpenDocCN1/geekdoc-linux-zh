- md: "\n# Structure of a C++ Program\n\nC++ has a very defined structure and way\
    \ of doing things. Miss something out, even as small as a semicolon, and your\
    \ entire program will fail to be compiled and executed. Many a programmer has\
    \ fallen foul of sloppy structure.\n\n## #include <iostream>\n\nLearning the basics\
    \ of programming, you begin to understand the structure of a program. The commands\
    \ may be different from one language to the next but you can start to see how\
    \ the code works.\n\n![](img/c669af706657d06f3ff3a457759dca4e_43_0.png)\n\nC++\
    \ was invented by Danish student Bjarne Stroustrup in 1979, as part of his PhD\
    \ thesis initially called C++ with Classes, which added features to the already\
    \ popular C programming language, while making it a more user-friendly environment\
    \ through a new structure.\n\nBjarne Stroustrup, inventor of C++.\n\n`int main()`\
    \ initiates the declaration of a function, which is a group of code statements\
    \ under the name 'main'. All C++ code begins at the main function, regardless\
    \ of where it lies within the code.\n\n```cpphelloworld.cpp\n#include <iostream>\n\
    int main()\n```\n\nThe structure of a C++ program is precise. Every C++ code begins\
    \ with a directive: `#include <`. The directive instructs the pre-processor to\
    \ include a section of the standard C++ code. For example: `#include <iostream>`\
    \ includes the iostream header to handle input/output operations.\n\nThe open\
    \ brace (curly brackets) is something that you may not have come across before,\
    \ especially if you're used to Python. The open brace indicates the beginning\
    \ of the main function and contains all the code that belongs to that function.\n\
    \n```cpp\nhelloworld.cpp\n#include <iostream>\nint main()\n{\n}\n```\n\n# Structure\
    \ of a C++ Program\n\n**COMMENTS** Lines that begin with a double slash are comments.\
    \ This means they won't be executed and are ignored by the compiler. Comments\
    \ are designed to help you, or another programmer looking at your code, and explain\
    \ what's going on. There are two types of comments: `//` multiple line comments\
    \ and `/*` a single line.\n\n`<<` The two chevrons used here are insertion operators.\
    \ This means whatever follows the chevrons will be inserted into the `std::cout`\
    \ statement. In this case they're 'Hello, world!' which is to be displayed on\
    \ the screen when you execute the code.\n\n```cpp\nhelloworld.cpp\n#include <iostream>\n\
    int main() {\n\n    //My first C++ program\n}\n```\n\n```cpp\nhelloworld.cpp\n\
    #include <iostream>\nusing namespace std;\nint main() {\n\n    //My first C++\
    \ program\n    cout <<;\n}\n```\n\n**STD** stands for something quite different,\
    \ in C++, it means Standard. It's part of the Standard Namespace in C++, which\
    \ contains a number of different statements and commands. You can leave the `std::`\
    \ part out of the code but it must be declared at the start using `namespace std`,\
    \ not both. For example:\n\n**OUTPUTS** Leading on, the \"Hello, world!\" is what\
    \ you want to appear on the screen when the code is executed. You can enter whatever\
    \ you like, as long as it's inside the quotation marks. Sometimes brackets are\
    \ needed, depending on the compiler. The `\\n` part adds a new line to be inserted.\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\n```\n\n```cpp\nhelloworld.cpp\n\
    #include <iostream>\nint main() {\n\n    //My first C++ program\n    std::cout\
    \ << \"Hello, world!\\n\";\n}\n```\n\n```cpp\n//My first C++ program\ncout <<\
    \ \"Hello, world!\\n\";\n```\n\n**COUT** In this example we use `cout`, which\
    \ is a part of the Standard Namespace, hence why it's there, as you're asking\
    \ to use it from that particular namespace. Use `std::cout`, which displays, or\
    \ prints something to the screen. If you leave it out you have to declare it at\
    \ the start of the code, mentioned previously.\n\n**;** and **}** Finally that\
    \ you can find a line within a function block (except ends) with a semicolon.\
    \ This marks the end of the statement; all statements in C++ must have one at\
    \ the end or the compiler fails to build the code. The very last line has the\
    \ closing brace to indicate the end of the function.\n\n```cpp\nhelloworld.cpp\n\
    #include <iostream>\nusing namespace std;\nint main() {\n\n    //My first C++\
    \ program\n    cout << \"Hello, world!\\n\";\n}\n```\n\n# Compile and Execute\n\
    \nYou've created your first C++ program and you now understand the basics behind\
    \ the structure of one. Let's get things moving and compile and execute, or run\
    \ if you prefer, the program and see how it looks.\n\n# GREETINGS FROM C++\n\n\
    Compiling and executing code from within Geany is remarkably simple and just matters\
    \ of clicking a couple of icons and seeing the result. Here's how it's done.\n\
    \n- **STEP 1** Open Geany, if you haven't already, and load up the previously\
    \ saved Hello World code you created. Ensure that there are no visible errors,\
    \ such as a missing semicolon at the end of the code:\n- **STEP 2** If your code\
    \ is ready, look to the menu bar at the top of Geany window. Notice along the\
    \ line of icons there's a red icon. This is Build, which clicked runs the code,\
    \ checking if there are any errors that stop it.\n- **STEP 3** When you click\
    \ the Build icon, the pane at the bottom of the Geany interface displays results.\
    \ If all is well, you will see a successful compilation, if not Geany issues an\
    \ error along the line the error was found.\n- **STEP 4** With the code successfully\
    \ built, it's time to execute. Next to the Build icon there's a paper airplane,\
    \ this is Run icon. You can't run code that hasn't been built or has an error.\
    \ Click the Run icon.\n- **STEP 5** When you click Run, a simple Terminal window\
    \ appears displaying results of the code. In the case of this simple code, you\
    \ can see \"Hello, world!\" in the world as you've already learned, the code is\
    \ outputting the contents between the quotes.\n- **STEP 6** Press Enter in command\
    \ line closes it, returning you to Geany. Then, delete the `std::` part of the\
    \ code.\n- **STEP 7** Just mentioned previously, you don't need to have `std::`\
    \ if you've already declared the namespace at the start of the code. Now, create\
    \ a deliberate message to see what happens. Remove the semicolon from the line\
    \ so it reads:\n- **STEP 8** Now try and build once more. This time, notice the\
    \ bottom is displaying an error. Note that error occurs on line 8, the first character.\
    \ This is because there's an expected semicolon before the closed bracket.\n-\
    \ **STEP 9** This time, notice that the bottom is displaying an error.\n- **STEP\
    \ 10** Replace the semicolon under the line, enter a new line to the code. Build\
    \ and Run the code, to display.\n\n```cpp\nhelloworld.cpp\n#include <iostream>\n\
    \nint main() {\n\n    // My first C++ program\n    std::cout << \"Hello, world!\\\
    n\";\n}\n```\n![](img/c669af706657d06f3ff3a457759dca4e_45_0.png)\n\n```cpp\nint\
    \ main() {\n    // My first C++ program\n    std::cout << \"Hello, world!\\n\"\
    ;\n}\n```\n![](img/c669af706657d06f3ff3a457759dca4e_45_1.png)\n\n```cpp\ncout\
    \ << \"Hello, world!\";\n```\n![](\nimg/c669af706657d06f3ff3a457759dca4e_46_0.png)\n\
    ![](\nimg/c669af706657d06f3ff3a457759dca4e_46_1.png)\n\n```cpp\ncout << \"Hello,\
    \ world!\";\n```\n![](\nimg/c669af706657d06f3ff3a457759dca4e_46_2.png)\n![](\n\
    img/c669af706657d06f3ff3a457759dca4e_46_3.png)\n\n# C++ on Linux\n\n# Virus!\n\
    \nDID YOU KNOW...\n\nthat one of the first computer viruses that spread out of\
