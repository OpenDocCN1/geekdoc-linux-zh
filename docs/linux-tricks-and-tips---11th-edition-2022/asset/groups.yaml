    \n## 使用注释\n\n虽然对于编写游戏（甚至是一个操作系统）的数千行代码来说，注释似乎是一个微不足道的元素，但事实上，它们很可能是最重要的因素之一。\n\
    \n## 注释的重要性\n\n代码内部的注释基本上是人类对代码在特定点所执行的描述。简而言之，所有代码都应该尽可能地注释，这样即使是一个完全不懂编程的人也能拿起你的代码，通过阅读来理解它的功能。\n\
    \n在专业环境中，注释对于代码的成功以及最终项目的成功至关重要。设想你处于某人的立场，他的工作是找出程序中的错误。该程序有数百行代码，分布在不同的模块中。你可能还需要原始程序员提供的良好帮助，其形式就是良好的注释。最好的注释总是简洁的，并在逻辑上连接代码，详细说明程序在某行或某部分触发了什么。你不需要注释每一行。诸如\
    \ `if x==0` 这样的内容就不需要注释，因为这对读者来说是显而易见的。如果 `x` 是对对用户产生剧烈变化的东西（例如当行数用尽时），它确实需要注释。如果代码是你的，当你与他人分享时，应该编写注释。这可以让你在之后回到代码时，理解它是做什么的或者哪些部分运行得非常出色。\n\
    \n注释是一种良好的习惯，一旦你学会了何时需要添加注释，它将变成你的本能。\n\n![](img/c669af706657d06fff3a457759dca4e_49_0.png)\n\
    \n## TSS:\n\n| 命令 | 参数 |\n| :--- | :--- |\n| DEF | 80h |\n| HERD | A, B |\n| 8S3A\
    \ | A, B |\n| HOMER | A, B |\n| SET | save register |\n| STAT | DEF 0,U1 |\n|\
    \ CLR | CREEN BC17FF |\n\n> : 初始化代码\n> : 清除屏幕位图\n> : 标题界面位图\n\n```\nLOAD GA000\
    \ BC4000 BC4096\n```\n\n> : 上一个房间的属性（上三分之一）\n\n```\nDEF DA700 LC,ATSR BC512\n\
    ```\n\n> : 标题界面的属性（下三分之二）\n\n```\nLOAD ML080D LOAD U1 BC31\n```\n\n```\nR HOR,\
    \ (C)\nR BA1, -03\nSOB AND DISRF, -07 A\n```\n\n## C++ 注释\n\n在 C++ 中注释涉及使用双斜杠\
    \ `//` 或斜杠加星号 `/*`。你已经见过一些简短的示例，但这是它的工作原理：\n\n以 Hello World 为例，你可以轻松使用双斜杠对代码的不同部分进行注释：\n\
    \n编写注释时要小心，特别是使用块注释时。很容易忘记添加结束的星号和斜杠，导致注释块内的任何代码被意外注释掉（失效）。\n\n```cpp\nhelloworld.cpp\n\
    #include <iostream>\nusing namespace std;\n\nint main() {\n    // 我的第一个 C++ 程序\n\
    \    cout << \"Hello, world!\"\\n;\n    cout << \"Greetings from C++\"\\n;\n}\n\
    ```\n\n然而，你也可以在代码行的末尾进行注释，以更好地描述其执行的内容：\n\n`cout << \"Hello, world!\"\\n // 这输了\
    \ 'Hello, world.' 单词。\\n 表示换行。`\n\n显然，如果你构建并执行被块注释的代码，它会报错，因为缺少一个结束代码块的右括号 `}`。如果你移动了它，那么是时候回过头来纠正了。Geanty\
    \ 使用的颜色可以区分注释和代码。\n\n注意，不要在注释末尾加分号 `;`。这是因为该行会被编译器忽略。\n\n```cpp\nhelloworld.cpp\n\
    #include <iostream>\nusing namespace std;\n\nint main() {\n    // 我的第一个 C++ 程序\n\
    \    cout << \"Hello, world!\"\\n // 这输出了 'Hello, world.' 单词。\\n 表示换行。\n}\n```\n\
    \n你可以使用斜杠和星号 `/* ... */` 来注释多行：\n\n对于块注释，在 C++ 中一种良好的做法是在注释块的每一行都添加一个星号。只要你记得在继续编写代码之前关闭注释块：\n\
    \n```cpp\nhelloworld.cpp\n#include <iostream>\nusing namespace std;\n\nint main()\
    \ {\n    // 我的第一个 C++ 程序\n    cout << \"Hello, world!\"\\n // 这输出了 'Hello, world.'\
    \ 单词。\\n 表示换行。\n    /* 这条注释可以 * 覆盖单独的行 * 而无需添加更多斜杠 */\n}\n```\n\n"
