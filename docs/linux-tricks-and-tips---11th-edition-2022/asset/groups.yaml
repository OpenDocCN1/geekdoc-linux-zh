    # # How to Set Up Python in Linux


    # ### STEP 5


    However, if you want the latest, cutting edge

    version you need to build Python from source. Start

    by entering these commands into the Terminal:


    ```

    sudo apt-get install build-essential checkinstall

    sudo apt-get install libreadline-dev gplv2-dev

    ncurses5-dev libsqlite3-dev libz1-dev

    libdbm-dev libdb66-dev

    ```


    ![](img/c669af706657d06f3ff3a457759dca4e_10_0.png)


    David-Mint: $ sudo apt-get install build-essential checkinstall

    Building dependency tree ...nDone. latest version 12.4ubuntu

    Building is already up to date. 0 to installed, 0 to upgrade, 0 new, 0 to remove
    and not to upgrade.

    After this operation, 468 KB of additional disk space will be used.

    Do you want to continue? [Y]


    # ### STEP 6


    Open your Linux web browser and go to

    The Python page: www.python.org/

    downloads. Follow the Downloads by clicking the button from

    The Python Source. This opens a dialogue box;

    choose a location and download the source.


    ![](img/c669af706657d06f3ff3a457759dca4e_10_1.png)


    # ### STEP 8


    Within the Python folder,

    ./configure

    sudo make altinstall


    This could take a while depending on the speed of your computer.

    Once finished, run python.7 -- to check the

    latest version. You have installed Python 3.7, alongside

    older Python 3 and 2.


    ![](img/c669af706657d06f3ff3a457759dca4e_10_2.png)


    If you want a build with all static optimizations (MPD, LTO, etc.),

    run configure --enable-optimizations


    # ### STEP 9


    For the GUI IDE, you will need to enter the

    command to the Terminal:


    ```

    sudo apt-get install idle3

    ```


    The IDE is started with the command idle3. Note

    idle runs a different version from the one you installed from.


    ![](img/c669af706657d06f3ff3a457759dca4e_10_3.png)


    # ### STEP 10


    In the Terminal, we will download the

    tering cd. Then unpack the

    Python source code with: -xzvf python-

    3.Y.Y.tar.gz replace the Y with the version you

    ''ve downloaded. Now enter the newly unpacked folder with cd

    Python-3.Y.Y/


    You also need PIP (Install Packages) which is a

    to help you install more modules and extras.


    ```

    pip install --upgrade-pip

    ```


    for the latest update:

    When complete, the Terminal and Python 3.x will be available

    through the Programming section in your''s distro menu.


