    int main()\n```\n\nC++ 程序的结构是精确的。每个 C++ 代码都以指令开头：`#include <`。该指令指示预处理器包含一段标准的\
    \ C++ 代码。例如：`#include <iostream>` 包含了 iostream 头文件用于处理输入/输出操作。\n\n大括号（花括号）是你之前可能遇到过的东西，特别是如果你习惯了\
