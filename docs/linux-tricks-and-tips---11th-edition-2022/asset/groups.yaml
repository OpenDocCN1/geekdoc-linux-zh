    >>> print(name)\nDavid\n>>> a=2\n>>> b=4\n>>> print(a+b)\n6\n>>> print(a-b)\n\
    -2\n>>> print(a*b)\n8\n```\n\n# STEP 8\n\nNow let's add a surname:\n```python\n\
