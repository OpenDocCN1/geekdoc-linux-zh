    \ For example, you could have a universal greeting in your code 'Welcome' and\
    \ assign that as a string to be called wherever you like in the program.\n\n#\
    \ STRING THEORY\n\nThere are different ways in which you can create a string of\
    \ characters, historically are all carried over from the original C language and\
    \ supported by C++.\n\n- STEP 1\nTo create a string, use the char function. Open\
    \ a new C++ file and begin with the usual header:\n\n- STEP 3\nBuild and run the\
    \ code and 'Welcome' appears on the screen. While this is perfectly fine, it's\
    \ not a string. String is a class, which defines objects that can be represented\
    \ as a stream of characters and doesn't need to be terminated like an array. The\
    \ code can therefore be represented as:\n\n```cpp\n#include <iostream>\nusing\
    \ namespace std;\nint main() {\n}\n```\n\nstrings.cpp\n```cpp\n#include <iostream>\n\
    using namespace std;\nint main() {\n    char greet[] = \"Welcome\";\n    cout\
    \ << greet << \"\\n\";\n}\n```\n\n- STEP 2\nIt's easy to confuse a string with\
    \ an array. Here's an array, which can be terminated with a null character:\n\n\
    ```cpp\n#include <iostream>\nusing namespace std;\nint main() {\n    char greet[8]\
    \ = {'W', 'e', 'l', 'l', 'o', 'm', 'e', '\\0'};\n    cout << greet << \"\\n\"\
    ;\n}\n```\n\n- STEP 4\nIn C++ there's also a string, which works in the same way.\
    \ Using the greeting code,\n\n```cpp\n#include <iostream>\nusing namespace std;\n\
    int main() {\n    string greet = \"Welcome\";\n    cout << greet << \"\\n\";\n\
    }\n```\n\nstrings.cpp\n```cpp\n#include <iostream>\nusing namespace std;\nint\
    \ main() {\n    char greet[] = \"Welcome\";\n    cout << greet << \"\\n\";\n}\n\
    ```\n\n```cpp\n#include <iostream>\nusing namespace std;\nint main() {\n    string\
    \ greet = \"Welcome\";\n    cout << greet << \"\\n\";\n}\n```\n\n# Strings\n\n\
    # STEP 5\n\nThere are also many different operations that you can apply with the\
