- md: "\n## Did You Know..\n\n![](img/c669af706657d06fff3a457759dca4e_48_0.png)\n\
    ![](img/c669af706657d06fff3a457759dca4e_48_1.png)\n![](img/c669af706657d06fff3a457759dca4e_48_2.png)\n\
    ![](img/c669af706657d06fff3a457759dca4e_48_3.png)\n\n## Using Comments\n\nWhile\
    \ comments may seem like a minor element to many lines of code to make a game,\
    \ even an operating system, in fact they are probably one of the most important\
    \ factors.\n\n## THE IMPORTANCE OF COMMENTING\n\nComments inside code are basically\
    \ human descriptions of what the code is doing at that particular point. In short,\
    \ all code should be commented as much as possible so someone who doesn't know\
    \ anything about programming can pick up your code and understand what it's going\
    \ to do by reading it.\n\nIn a professional environment, comments are vital to\
    \ the success of the code and ultimately, the project. Place yourself in the shoes\
    \ of someone's job is to find out what's wrong with a program. The program has\
    \ hundreds of lines of code, spread across different modules. You might also need\
    \ a little help from the original programmers in the form of a good comment. The\
    \ best comments are always concise and link the code logically, detailing what\
    \ the program hits a line or section. You don't need to comment every line. Something\
    \ along the lines of: if x==0 does not require you to comment then that's going\
    \ to be obvious to the reader. If x is something that drastically changes the\
    \ program for the user, like when you've run out of lines, it certainly needs\
    \ to be commented. If the code is yours, you should write comments if you are\
    \ sharing it with others. This can return you to code and understand what it was\
    \ or what worked brilliantly.\n\nComments are good practice and once you understand\
    \ how to add a comment when needed, it'll become your second nature.\n\n![](img/c669af706657d06fff3a457759dca4e_49_0.png)\n\
    \n## TSS:\n\n| Command | Parameters |\n| :--- | :--- |\n| DEF | 80h |\n| HERD\
    \ | A, B |\n| 8S3A | A, B |\n| HOMER | A, B |\n| SET | save register |\n| STAT\
