  - '[PAGE 38]


    # C++ on Linux


    C++ is an excellent, high-level programming language that''s used in a multitude
    of technologies. Everything from your favourite mobile app, console and PC game
    to entire operating systems are developed with C++ at the core, together with
    a collection of software development kits and custom libraries.


    C++ is the driving force behind most of what you use on a daily basis, which makes
    it a complex and extraordinarily powerful language to get grips with. It''s the
    code behind Linux itself, as well as most of the behind the scenes drivers, library
    files and control elements of most, if not all, operating systems.


    This section shows you how to start coding in C++ on Linux using a Raspberry Pi.
    From there, you can begin to create great things.'
