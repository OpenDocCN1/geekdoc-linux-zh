    \ Variables are simply memory locations that they store the values depending on\
    \ the data type.\n\n## THE VALUE OF DATA\n\nThere are many different types available\
    \ for the programmer in C++, such as integer, floating point, Boolean and so on.\
    \ It's widely accepted that there are seven basic data types; however, you can\
    \ create your own data types that need arise within your code by adding cout.precision()\
