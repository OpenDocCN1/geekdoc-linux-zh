    \ Linux 发行版都带有 Python 2 和 3，因此有大量的适用于 Python 2 的代码可用。现在输入：`python3 --version`。\n\
    - **步骤 3** 在我们的案例中，我们同时安装了 Python 2 和 3；由于安装了 Python 3.x，代码也值得检查驱动程序是否已更新到最新版本，因此在系统输入：`sudo\
