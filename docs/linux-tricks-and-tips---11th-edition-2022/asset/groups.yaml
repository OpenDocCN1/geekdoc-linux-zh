    \ <iostream>\nint main()\n{\n}\n```\n\n# C++ 程序的结构\n\n**注释 (COMMENTS)** 以双斜杠开头的行是注释。这意味着它们不会被执行，并且会被编译器忽略。注释的设计是为了帮助你或查看你代码的另一个程序员，解释正在发生什么。注释有两种类型：`//`\
