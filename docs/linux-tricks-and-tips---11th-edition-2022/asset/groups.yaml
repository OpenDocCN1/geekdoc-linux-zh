    # Your First C++ Program


    The Raspberry PI makes for a great coding base on which to learn C++. You won''t
    need any complicated, third-party IDEs or install any extra components. Everything
    you need to get started is already built into the Pi.


    # HELLO, WORLD!


    it''s traditional in programming for the first code to be entered to output the
    words ''Hello, World!'' to the screen. Interestingly, this dates back to 1968
    using a language called BCPL.


    +   STEP 1 You can use the Geany Programmer''s Editor to write, compile and execute
    your C++ code on the Raspberry Pi. You can find Geany as the first entry in the
    Programming section of the Raspberry Pi menu. Click the Geany icon to open and
    start.


    +   STEP 3 It doesn''t look like much at the moment but you can get into what
    the C++ header commands mean in due course. Geany uses syntax highlighting, meaning
    it colour-codes the code depending on the language. To activate this, save the
    code by clicking on File > Save As. Now name the code helloworld.cpp and click
    the Save button.


    ![](img/c669af706657d06f3ff3a457759dca4e_41_0.png)


    +   STEP 2 The Geany editor is quite powerful while still being easy to use. All
    the code you enter shows in the main window and is numbered to help you keep track
    of your code. For now, in line 1:


    ```

    #include <iostream>

    ```


    +   STEP 4 The colour coding helps a lot when your coding. Now press Enter and
    start a new command on line 3. Enter the following:


    ```

    int main()

    ```


    Note: there''s no space between the brackets.


    ![](img/c669af706657d06f3ff3a457759dca4e_41_1.png)'
