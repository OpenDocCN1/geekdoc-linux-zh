    # # Starting Python for the First Time


    If you''re using the RaspberryPi together with its latest release of the Pi OS,
    you will need to manually install the Python IDLE. This is due to the Pi team
    removing the core Python IDLE in favour of your own text editor.


    # ## STARTING PYTHON


    For those using the Pi4 and new Raspian, drop into a Terminal and use: sudo apt-get
    install idle3. Older versions of Raspian already have the official Python IDLE
    pre-installed.


    With the Raspian desktop, click on the Menu button by Programming > Python 3 (IDLE).
    Windows and Mac users can find the Python 3 IDLE Shell from the Windows Start
    menu and via Finder.


    For example, in the shell: 2+2

    After pressing Enter, the next line displays the answer: 4. Basically, Python
    has taken the ''code'' and produced the relevant output.


    ![](img/c669af706657d06f3ff3a457759dca4e_11_0.png)


    The Shell is where you can enter code and see the responses and output of code
    you''ve programmed into Python. This is a kind of sandbox, where you''re able
    to try some simple code and processes.


    The Python Shell acts very much like a calculator, since code is basically of
    a series of mathematical interactions with the system. Integers, which are the
    infinite sequence of numbers can be easily added, subtracted, multiplied and so
    on.


    ```

    File Edit Shell Debug options windows help

    >>> Python 3.4.2 (Default, Oct 19 2014, 13:31:11)

    on Linux

    >>> ''copyright'', ''credits'' or ''license'' for more information.

    >>> 4

    4 >>>

    ```


    ```

    File Edit Shell Debug options windows help

    >>> Python 3.4.2 (Default, Oct 19 2014, 13:31:11)

    on Linux

    >>> ''copyright'', ''credits'' or ''license'' for more information.

    >>> 4

    4 >>>

    >>> 8+6

    14 >>>

    >>> 2345*6445252

    15089114440 >>>

    >>> 977862442343-12343

    >>> 9778624423*43034

    50647282358

    >>>

    ```'
