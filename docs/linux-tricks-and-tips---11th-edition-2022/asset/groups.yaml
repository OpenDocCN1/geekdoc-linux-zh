- md: "\n## User Interaction\n\nThere's nothing quite as satisfying as creating a\
    \ program that responds to you. This basic user interaction is one of the most\
    \ taught aspects of any language and with it you're able to do much more than\
    \ greet the user by name.\n\n## HELLO, DAVE\n\nYou have already used cout, the\
    \ standard output stream, throughout our code. Now you're going to be using cin,\
    \ the standard input stream, to program a response.\n\n- STEP 1: Anything that\
    \ you want the user to input into the system memory, needs to be stored somewhere\
    \ so it can be retrieved and used. Therefore, input must first be declared as\
    \ a variable, so it's ready to be used by the user. Start by creating a blank\
    \ C++ file with headers.\n\n- STEP 2: The data type of input must also match the\
    \ type of input you want from the user. For example, to ask your user, you would\
    \ use an input like this:\n\n```cpp\n#include <iostream>\nusing namespace std;\n\
    \nint main() {\nint age;\ncout << \"What is your age: \";\ncin >> age;\ncout <<\
    \ \"You are \" << age << \" years old.\\n\";\n}\n```\n\n- STEP 3: The cin command\
    \ works in the opposite way from the cout command. With the first cout you're\
    \ output 'What is your age?' to the screen, as indicated with the chevrons. Cin\
    \ uses facing chevrons, called << indicating an input. The input is put into the\
    \ integer age and called up in the second cout count. And run the code.\n\n```cpp\n\
    #include <iostream>\nusing namespace std;\n\nint main() {\nint age;\ncout << \"\
    What is your age: \";\ncin >> age;\ncout << \"You are \" << age << \" years old.\\\
    n\";\n}\n```\n\n![](img/c669af706657d06f3ff3a457759dca4e_59_0.png)\n\n- STEP 4:\
    \ If you're asking a user, you need to store the input as a string; to ask the\
    \ user name, you would use:\n\n```cpp\n#include <iostream>\nusing namespace std;\n\
    \nint main() {\nstring name;\ncout << \"What is your name: \";\ncin >> name;\n\
    cout << \"\\nHello, \" << name << \"! I hope you're well today\\n\";\n}\n```\n\
    \n## User Interaction\n\nThe principle works the same as the previous code. The\
    \ user's input, is stored in a string; it contains multiple characters, and retrieved\
    \ in the second cout line. As long as the variable 'name' doesn't change, you\
    \ can call it whenever in your code.\n\n```\nwhat is your name: David\nHello,\
    \ David. I hope you're well today-\n\n executed with code: 0 {\n return to continue\n\
    }\n```\n\nYou can input requests to the user but make sure you have a valid variable\
    \ to store the input to begin. Let's assume you want the user to enter two numbers:\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\nint main() {\n int num1,\
    \ num2;\ncout << \"Enter two numbers: \";\ncin >> num1 >> num2;\ncout << \"You\
    \ entered \" << num1 << \" and \" << num2 << \"\\n\";\n}\n```\n\n```cpp\n#include\
    \ <iostream>\nusing namespace std;\nint main() {\n string mystr;\ncout << \"Enter\
    \ a sentence: \\n\";\ngetline(cin, mystr);\ncout << \"Your sentence is: \" <<\
    \ mystr.size() << \" characters long.\\n\";\n}\n```\n\n```cpp\n#include <iostream>\n\
    using namespace std;\nint main() {\n int num1, num2;\ncout << \"Enter two numbers:\
    \ \";\ncin >> num1 >> num2;\ncout << \"You entered \" << num1 << \" and \" <<\
    \ num2 << \"\\n\";\n}\n```\n\n```cpp\n#include <iostream>\nusing namespace std;\n\
    int main() {\n int num1, num2;\ncout << \"Enter two numbers: \\n\";\ncin >> num1\
    \ >> num2;\ncout << \"You entered \" << num1 << \" and \" << num2 << \"\\n\";\n\
    }\n```\n\nBuild and execute, then enter a sentence with spaces. When you remove\
    \ the line and replace it with cin >> and try again, the result displays the number\
    \ of characters to the first sentence.\n\nLikewise, data can be manipulated once\
    \ you have stored in a variable. For instance, ask the user for two numbers and\
    \ do maths on:\n\n```cpp\n#include <iostream>\nusing namespace std;\nint main()\
    \ {\n float num1, num2;\ncout << \"Enter two numbers: \\n\";\ncin >> num1 >> num2;\n\
    cout << num1 << \" + \" << num2 << \" is: \" << num1 + num2 << \"\\n\";\n}\n```\n\
    \nGetline is a command that new C++ programmers forget to use. The terminating\
    \ whitespace is so annoying when you try figure out why your code isn't working.\
    \ It's best to use getline(cin, variable) in future:\n\n```cpp\n#include <iostream>\n\
    using namespace std;\nint main() {\n string name;\ncout << \"Enter your full name:\
    \ \\n\";\ngetline(cin, name);\ncout << \"Hello, \" << name << \"\\n\";\n}\n```\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\nint main() {\n float num1,\
    \ num2;\ncout << \"Enter two numbers: \\n\";\ncin >> num1 >> num2;\ncout << num1\
    \ << \" + \" << num2 << \" is: \" << num1 + num2 << \"\\n\";\n}\n```\n\n```cpp\n\
