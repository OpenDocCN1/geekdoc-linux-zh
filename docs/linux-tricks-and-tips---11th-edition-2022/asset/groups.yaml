  - '[PAGE 64]


    # USER ERROR


    User input is often a paralysing mistake in code. For example, when the user is
    supposed to enter a number for their age and enter it in letters. Often a user
    can enter into such an input that overflows internal buffer, thus causing the
    code crashing. Watch those user inputs and clearly state what is needed from them.


    ```

    Enter an integer number

    You have entered wrong input

    You have entered wrong input

    You have entered wrong input

    sdfad212313123

    You have entered wrong input

    1232429323292329

    The number is: 12

    Process returned (0x0) execution time: 21.49 s

    Press any key to continue.

    ```


    # BACKUPS


    Always make a backup of your work, with a secondary backup for any changes you''ve
    made. Mistakes can be rectified if there''s a good backup in place to revert to
    if something goes wrong. The easier it is to start where you left, rather than
    starting from scratch.


    ![](img/c669af706657d06f3ff3a457759dca4e_64_0.png)


    # RE-INVENTING THE WHEEL


    You can spend days trying to fathom some out of code to achieve a result and it''s
    frustrating and time-consuming. While it''s equally rewarding to solve the problem
    yourself, the same code is out there on the internet. Don''t reinvent the wheel,
    look to see if else has done it


    # SECURE DATA


    If you''re writing code to deal with usernames and passwords, or other sensitive
    data, ensure that the data isn''t in cleartext. Learn to create a function to
    encrypt data before feeding it into a database that can transmit or store where
    it may be able to get to


    ![](img/c669af706657d06f3ff3a457759dca4e_64_1.png)


    # HELP!


    Asking for help is something most of us has struggled with in the past. Will people
    be laughing at us? Is it everyone''s time? It''s a common mistake for someone
    to suffer in silence. As long as you have the correct method, any forum or rules
    will be polite, then your question isn''t silly.


    # MATHS


    If your code makes multiple calculations you need to ensure that the maths behind
    it is sound. There are thousands of instances where poor Mathematical coding,
    which can have disastrous effects on what the code is set to do. In short, double
    check your code equations.


    ![](img/c669af706657d06f3ff3a457759dca4e_64_2.png)


