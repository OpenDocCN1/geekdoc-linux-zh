    \ $\n```\n\n![](img/c669af706657d06f3ff3a457759dca4e_9_0.png)\n\n### STEP 5\n\n\
    However, if you want the latest, cutting edge version you need to build Python\
    \ from source. Start by entering these commands into the Terminal:\n\n```\nsudo\
    \ apt-get install build-essential checkinstall\nsudo apt-get install libreadline-dev\
    \ gplv2-dev\nncurses5-dev libsqlite3-dev libz1-dev\nlibdbm-dev libdb66-dev\n```\n\
    \n![](img/c669af706657d06f3ff3a457759dca4e_10_0.png)\n\nDavid-Mint: $ sudo apt-get\
    \ install build-essential checkinstall\nBuilding dependency tree ...Done. latest\
    \ version 12.4ubuntu\nBuilding is already up to date. 0 to installed, 0 to upgrade,\
    \ 0 new, 0 to remove and not to upgrade.\nAfter this operation, 468 KB of additional\
    \ disk space will be used.\nDo you want to continue? [Y]\n\n### STEP 6\n\nOpen\
    \ your Linux web browser and go to the Python page: www.python.org/downloads.\
    \ Follow the Downloads by clicking the button from The Python Source. This opens\
    \ a dialogue box; choose a location and download the source.\n\n![](img/c669af706657d06f3ff3a457759dca4e_10_1.png)\n\
    \n### STEP 8\n\nWithin the Python folder,\n./configure\nsudo make altinstall\n\
    \nThis could take a while depending on the speed of your computer. Once finished,\
    \ run python.7 --version to check the latest version. You have installed Python\
    \ 3.7, alongside older Python 3 and 2.\n\n![](img/c669af706657d06f3ff3a457759dca4e_10_2.png)\n\
    \nIf you want a build with all static optimizations (MPD, LTO, etc.), run configure\
    \ --enable-optimizations\n\n### STEP 9\n\nFor the GUI IDE, you will need to enter\
    \ the command to the Terminal:\n\n```\nsudo apt-get install idle3\n```\n\nThe\
    \ IDE is started with the command idle3. Note idle runs a different version from\
    \ the one you installed from.\n\n![](img/c669af706657d06f3ff3a457759dca4e_10_3.png)\n\
    \n### STEP 10\n\nIn the Terminal, we will download the tar cd. Then unpack the\
    \ Python source code with: -xzvf python-3.Y.Y.tar.gz replace the Y with the version\
    \ you've downloaded. Now enter the newly unpacked folder with cd Python-3.Y.Y/\n\
    \nYou also need PIP (Install Packages) which is a to help you install more modules\
    \ and extras for the latest update:\n\n```\npip install --upgrade-pip\n```\n\n\
    When complete, the Terminal and Python 3.x will be available through the Programming\
    \ section in your's distro menu.\n\n| Python-3.7/objects/libobject.c.h |\n| Python-3.7/objects/libast.c.h\
    \ |\n| Python-3.7/objects/libint.c.h |\n| Python-3.7/objects/libunicode.c.h |\n\
    | Python-3.7/objects/libdbm.c.h |\n| Python-3.7/objects/libdb66.c.h |\n| Python-3.7/objects/libdict.c.h\
