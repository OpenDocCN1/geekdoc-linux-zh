    sudo apt update && sudo apt install git rsync make gcc libc6-dev libssl-dev zlib1g-dev
    libpcre2-dev libevent-dev build-essential zlib1g-dev libpcre2-dev libsqlite3-dev
    libssl-dev libevent-dev libysystemd-dev

    ```

