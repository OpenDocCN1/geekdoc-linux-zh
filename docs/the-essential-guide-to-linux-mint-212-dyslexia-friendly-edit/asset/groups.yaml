    ## Enable Steam Play


    Start by running the following command(s) in the application menu:


    - Steam

    - Click "Steam"

    - Click "Settings"

    - Click "Steam Play"

    - Tick the Boxes next to the following:

    - Enable Steam for supported titles

    - Enable Steam Play for all other titles

    - Click Drop Down box next to "Run other titles with:"

    - Select "Proton Experimental",

    - Click OK

    - Click RESTART STEAM


    ## Manual Proton-GE Install


    Start by going to the following web address:


    https://github.com/GloriousEggroll/proton-ge-custom/releases


    - Download the latest GE-Proton.tar.gz

    - Double Click GE-Proton8-4.tar.gz

    - Select All

    - Click Extract

    - Press CTRL + H to reveal hidden folders

    - Go to ~/.steam/root

    - Click New Folder in top right

    - Type in: compatibilitytools.d

    - Click Create


    You should be automatically in the compatibilitytools.d folder, if not navigate
    to the following directory:


    ~/.steam/root/compatibilitytools.d


    - Click Extract


    Proceed to run the following command(s) in the application menu:


    - Steam

    - Click "Steam"

    - Click "Settings"

    - Click "Steam Play"

    - Tick box next to Enable Steam play for all other titles

    - Click drop down box next to Run other titles

    - Select: GE-Proton-4 and Click "OK"

    - Click "RESTART STEAM" and Click "Library"

    - Right Click a Game and Select Properties

    - Tick box next to "Force the use of a specific Steam Play compatibility tool"

    - Click the drop down box that should have appeared below

    - Select: GE-Proton-4

    - Click the X in the top right corner.


    ## Heroic Games Launcher


    Start by running the following command(s) in Software:


    - Heroic Games Launcher

    - Click Heroic Games Launcher and Install.


    Alternatively, start by running one of the following command(s) in the terminal:


    ```

    flatpak install flathub com.heroicgameslauncher.hgl

    ```


    ```

    sudo snap install heroic

    ```


    Otherwise, start by going to the following web address:


    https://github.com/Heroic-Games-Launcher/HeroicGamesLauncher/releases


    ```

    download the latest heroic_amd64.deb

    ```


    Double Click heroic_2.8.0_amd64.deb and install.


    ## Minigalaxy


    Start by running the following command(s) in Software Manager:


    - Minigalaxy

    - Click Minigalaxy and Install.


    Otherwise, start by running one of the following command(s) in the terminal:


    ```

    flatpak install flathub io.github.sharkwouter.Minigalaxy

    ```


    Otherwise, start by going to the following web address:


    https://github.com/sharkwouter/minigalaxy/releases


    - Download the latest minigalaxy_all.deb.

    - Double Click minigalaxy_1.2.2_all.deb and Install.


    ## PlayOnLinux


    Start by running the following command(s) in Software:


    - PlayOnLinux

    - Click PlayOnLinux (or Phoenicis PlayOnLinux) and Install.


    On the other hand, start by running one of the following command(s) in the terminal:


    ```

    sudo apt install playonlinux

    ```


    ```

    flatpak install flathub org.phoenicis.playonlinux

    ```


    ## Gamehub


    Start by running the following command(s) in Software:


    - Gamehub

    - Click Gamehub and Install.


    Alternatively, start by running one of the following command(s) in the terminal:


    ```

    sudo apt install gamehub

    ```


    Otherwise, start by going to the following web address:


    https://tkashkin.github.io/projects/gamehub/


    - Click .deb, under stable.

    - Double Click GameHub-0.16.3-2-master-bionic-amd64.deb and Install.


    ## Xbox Cloud Gaming


    Start by going to the following web address:


    https://www.microsoft.com/en-us/edge/download?form=MA13FJ


    - Scroll down to “Microsoft Edge is now available on Linux. Download for

    - Click Linux (.deb)

    - Click Accept and download to Download Microsoft Edge.

    - Double Click microsoft-edge-stable-amd-64.deb and Install.


    Open Microsoft Edge.


    Go to the following website:


    https://www.xbox.com/en-GB/play


    Sign In to Access Xbox Cloud Gaming.


    ## Itch.io


    Start by going to the following web address:


    https://itch.io/app


    - Click Linux to Download Itch.io

    - Open Files and go to the ~/Downloads directory.

    - Right Click itch-setup and Click Properties.

    - Move the switch next to Executable as Program to the right and Click the Cross
    button in the top right.

    - Double Click itch-setup


    ## DXVK


    This requires WINE-Staging to be installed and the winecfg command to be run in
    the terminal.


    Start by going to the following web address:

    https://github.com/doltsujin/dxvk/releases


    - Download the latest version of dxvk-..tar.gz

    - Select dxvk-2.2

    - Click Extract

    - Click Downloads

    - Click Extract

    - Click Show the Files

    - Double Click dxvk-2.2

    - Right Click empty space and Click Open in Terminal.


    Run the following command(s) in the terminal:

    ```bash

    cp x64/dxvk.so ~/.wine/drive/system64/

    cp x86/dxvk.so ~/.wine/drive/system32/

    cp x64/vkd39.so ~/.wine/drive/system64/

    cp x86/vkd39.so ~/.wine/drive/system32/

    ```

