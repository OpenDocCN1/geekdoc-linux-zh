    # Password Managers


    Password Managers are software that allow for the creation, addition, editing
    and storage of secure passwords (usually) in an encrypted vault that can only
    be accessed by one with the correct password and/or two factor authentication.


    LastPass is arguably the most well known password manager with a focus on security
    and ease of use, strong password generation in addition to monitoring the ‘Dark
    Web’ for potential breaches of security.


    Bitwarden is seen as more of a competitor in the password storage space, thanks
    to it is ability for local storage in addition to cloud, unlimited passwords and
    limitless devices, in addition to the ability to ship in a graphical or command
    line format.


    KeePassXC is one of the better known, Linux Mint focused, cross-machine password
    managers, while highlighting local storage with an advert, tracker and cloud free
    experience.'
