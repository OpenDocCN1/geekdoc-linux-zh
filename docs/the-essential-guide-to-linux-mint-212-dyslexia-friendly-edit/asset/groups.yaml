- md: '

    GNOME Shell Extension Manager sets how to install a piece of software that will
    make it far more accessible to install, remove and update the various GNOME extensions.


    GNOME Fuzzy App Search is an extension that permits the finding of applications,
    when said search term is close, but not quite accurate to that the user desires.


    Add to Desktop helps by adding a right-click option in the default GNOME application
    menu which makes it far more accessible for the user, to add that application
    to the desktop as a shortcut.


    Desktop Icons-NG (DING) assists by putting desktop icons back on the GNOME DE
    due to them being disabled by default.


    Gnome Shell Extension Manager is the most accessible way to search for, install
    and update the multitude of Gnome Extensions available on the gnome extension
    store.


    # GNOME Shell Integration Chrome Extension


    Start by going to the following web address:


    https://chrome.google.com/webstore/detail/gnome-shell-integration/gphhapmejobijbbhgpjhccjognlahbleple


    Click, Add to Chrome


    # GNOME Shell Integration Firefox Addon


    Start by going to the following web address:


    https://addons.mozilla.org/en-GB/firefox/addon/gnome-shell-integration/


    Click, Add to Firefox


    # ArcMenu


    Start by going to the following web address:


    https://extensions.gnome.org/extension/3628/arcmenu/


    Click Install.


    # ArcMenu Hotkey and Button Icon


    Right-click the ArcMenu button and select ArcMenu Settings.


    Expand the ArcMenu Hotkey drop down menu and click the Hotkey drop down list and
    select Left Super Key.


    Click Menu Button on the top tab and change the Icon Size under Menu Button Icon
    to 38.


    Before clicking Browse next to Choose a new icon and select an icon from the included
    ArcMenu and Distro Icons, or Click Browse under Custom Icon and select the image
    you wish to use then click Open.


    # ArcMenu System Application Shortcuts


    Right-click the ArcMenu button and select ArcMenu Settings.


    Click Menu on the top tab.


    - Click Pinned Apps or Application Shortcuts.

    - Click + next to Add More Apps.

    - Click + next to the system installed application, to be pinned to ArcMenu, for
    example:

    - Click + next to System Monitor and the shortcut for System Monitor will now
    be displayed in ArcMenu.


    # ArcMenu Custom Shortcuts


    Right-click the ArcMenu button and select ArcMenu Settings.


    Click Menu on the top tab.


    Click Pinned Apps or Application Shortcuts.


    Click + next to Add Custom Shortcut.


    Type the name of the shortcut into the Title box, for example:


    Curseforge


    Select the icon you wish by pressing the add picture button and clicking Open.


    Type the command to be run in the Command box, for example:


    ```

    ./Applications/CurseForge-0.222.2-9650.AppImage

    ```


    This command would run the CurseForge-0.222.2-9650.AppImage as a binary AppImage
    file from the Applications directory, in the ~ or home/username directory.


    # Dash To Panel


    Start by going to the Download page at:


    https://extensions.gnome.org/extension/1160/dash-to-panel/


    Click Install.


    # Dash To Panel Tray Font Size


    Start by right-clicking Dash To Panel and select Dash To Panel Settings.


    Before clicking Fine-Tune and move the switch next to Tray Font Size to 22px (which
    is roughly equal to 16pt), making the text far more readable.


    # Tray Icons: Reloaded


    Start by going to the following web address:


    https://extensions.gnome.org/extension/2890/tray-icons-reloaded/


    Click Install.


    # Tray Icons: Reloaded Icon Limit


    Start by running the following command in the application menu:


    Extensions


    Click Settings under Tray Icons: Reloaded.


    Type in the required number of Tray icons in the box next to Tray icons limit
    or move the number to 6 using - and +.


    # No overview at start-up


    Start by going to the following web address:


    https://extensions.gnome.org/extension/4099/no-overview/


    Click Install.


    # Gnome Shell Extension Manager


    Start by running the following command(s) in Software:


    gnome extensions


    Click Extensions and Install.


    Click Extensions Manager and Install.


    Start by running the following command(s) in the terminal:


    sudo apt install gnome-shell-extension-prefs gnome-shell-extension-manager chrome-gnome-shell


    # GNOME Fuzzy App Search


    Start by going to the following web address:


    https://extensions.gnome.org/extension/3956/gnome-fuzzy-app-search/


    Click Install.


    # Add to Desktop


    Start by going to the following web address:


    https://extensions.gnome.org/extension/3240/add-to-desktop/


    Click Install


    # Desktop Icons NG (DING)


    Start by going to the following web address:


    https://extensions.gnome.org/extension/2087/desktop-icons-ng-ding/


    Click Install.


    # Gnome Shell Extension Manager


    Start by running the following command(s) in the terminal:


    ```

    sudo apt install gnome-shell-extension-manager

    ```


    # Desktop Environments


    Desktop Environments are a graphical interface that assists the user in logging
    into the system in a more accessible and appealing manner.


    GNOME is one of the most used, being accessible to many of the users.


    KDE Plasma is a display manager that is mainly used with (and supported for) the
    KDE Plasma Desktop Environment, and which can be used with any DE though most
    likely without many themes supported, due to most of them requiring KDE Plasma
    dependencies.


    LXDM is the DM (Display Manager) of choice for the LXDE operating system and by
    association is very lightweight, being capable of utilization by any of the DE’s
    previously discussed.


    XFCE is a desktop environment that is known for being lightweight while maintaining
    the usability one might expect from a machine that will undergo day to day.


    Slim is a desktop independent display manager, that by the very nature of the
    software can work with any DE, carrying a great combination of features, visual
    appeal and light on resource usage.

    '
  mdcn: '


    GNOME Shell Extension Manager（扩展管理器）设定了软件安装方式，使用户可以更方便地安装、删除和更新各种 GNOME 扩展。


    GNOME Fuzzy App Search（模糊应用搜索）是一个扩展，允许在搜索词与用户想要的内容接近但并非完全准确的情况下找到应用程序。


    Add to Desktop（添加到桌面）通过在默认 GNOME 应用程序菜单中添加右键选项，使用户更方便地将该应用程序作为快捷方式添加到桌面。


    Desktop Icons-NG (DING) 通过将桌面图标恢复到 GNOME 桌面环境提供帮助，因为这些图标默认情况下是被禁用的。


    Gnome Shell Extension Manager 是搜索、安装和更新 GNOME 扩展商店中可用大量 Gnome扩展的最方便的方法。


    # GNOME Shell Integration Chrome 扩展


    首先访问以下网页地址：


    https://chrome.google.com/webstore/detail/gnome-shell-integration/gphhapmejobijbbhgpjhccjognlahbleple


    点击“添加至 Chrome”


    # GNOME Shell Integration Firefox 插件


    首先访问以下网页地址：


    https://addons.mozilla.org/en-GB/firefox/addon/gnome-shell-integration/


    点击“添加至 Firefox”


    # ArcMenu


    首先访问以下网页地址：


    https://extensions.gnome.org/extension/3628/arcmenu/


    点击“安装”。


    # ArcMenu 快捷键与按钮图标


    右键点击 ArcMenu 按钮并选择“ArcMenu Settings”。


    展开 ArcMenu Hotkey 下拉菜单，点击快捷键列表并选择“Left Super Key”（左 Super 键）。


    点击顶部标签页上的“Menu Button”，并将 Menu Button Icon 下的图标大小更改为 38。


    在点击“Choose a new icon”旁的浏览之前，从包含的 ArcMenu 和发行版图标中选择一个图标，或者点击“Custom Icon”下的“浏览”并选择想要使用的图像，然后点击“打开”。


    # ArcMenu 系统应用程序快捷方式


    右键点击 ArcMenu 按钮并选择“ArcMenu Settings”。


    点击顶部标签上的“Menu”。


    - 点击“Pinned Apps”（固定应用）或“Application Shortcuts”（应用程序快捷方式）。

    - 点击“Add More Apps”旁边的“+”。

    - 点击已安装应用程序旁边的“+”以将其固定到 ArcMenu，例如：

    - 点击“System Monitor”（系统监器）旁边的“+”，系统监器的快捷方式现在将显示在 ArcMenu 中。


    # ArcMenu 自定义快捷方式


    右键点击 ArcMenu 按钮并选择“ArcMenu Settings”。


    点击顶部标签上的“Menu”。


    点击“Pinned Apps”或“Application Shortcuts”。


    点击“Add Custom Shortcut”旁边的“+”。


    在 Title 框中输入快捷方式名称，例如：


    Curseforge


    按下添加图片按钮并点击“打开”来选择你想要的的图标。


    在 Command 框中输入要运行的命令，例如：


    ```

    ./Applications/CurseForge-0.222.2-9650.AppImage

    ```


    此命令将从 ~ 或 home/username 目录下的 Applications 目录运行 CurseForge-0.222.2-9650.AppImage
    二进制 AppImage 文件。


    # Dash To Panel


    首先访问下载页面：


    https://extensions.gnome.org/extension/1160/dash-to-panel/


    点击“安装”。


    # Dash To Panel 栏字体大小


    首先右键点击 Dash To Panel 并选择“Dash To Panel Settings”。


    在点击“Fine-Tune”（微调）之前，将 Tray Font Size 旁的开关移动到 22px（约等于 16pt），使文本更具读性。


    # Tray Icons: Reloaded


    首先访问以下网页地址：


    https://extensions.gnome.org/extension/2890/tray-icons-reloaded/


    点击“安装”。


    # Tray Icons: Reloaded 图标限制


    首先在应用程序菜单中运行以下命令：


    Extensions


    点击 Tray Icons: Reloaded 下方的“Settings”。


    在 Tray icons limit 旁边的框中输入所需的托盘图标数量，或使用 - 和 + 将数字改为 6。


    # 启动时不显示概览


    首先访问以下网页地址：


    https://extensions.gnome.org/extension/4099/no-overview/


    点击“安装”。


    # Gnome Shell Extension Manager


    首先在软件（Software）中运行以下命令：


    gnome extensions


    点击“Extensions”并安装。


    点击“Extensions Manager”并安装。


    首先在终端中运行以下命令：


    sudo apt install gnome-shell-extension-prefs gnome-shell-extension-manager chrome-gnome-shell


    # GNOME Fuzzy App Search


    首先访问以下网页地址：


    https://extensions.gnome.org/extension/3956/gnome-fuzzy-app-search/


    点击“安装”。


    # Add to Desktop


    首先访问以下网页地址：


    https://extensions.gnome.org/extension/3240/add-to-desktop/


    点击“安装”


    # Desktop Icons NG (DING)


    首先访问以下网页地址：


    https://extensions.gnome.org/extension/2087/desktop-icons-ng-ding/


    点击“安装”。


    # Gnome Shell Extension Manager


    在终端中运行以下命令：


    ```

    sudo apt install gnome-shell-extension-manager

    ```


    # 桌面环境 (Desktop Environments)


    桌面环境是一种图形界面，帮助用户以更方便、更具吸引力的方式登录系统。


    GNOME 是最常用的环境之一，对许多用户都非常友好。


    KDE Plasma 是一种显示管理器，主要用于 KDE Plasma 桌面环境（并提供支持），它可以与任何桌面环境配合，但由于大多数主题需要 KDE Plasma
    依赖项，可能支持的主题较少。


    LXDM 是 LXDE 系统的首选显示管理器（DM），与其关联，它非常轻量级，可以用于之前讨论的任何桌面环境。


    XFCE 桌面环境以轻量化著称，同时保持了日常使用设备预期的易用性。


    Slim 是一种桌面独立的显示管理器，根据其软件本质，它可以与任何桌面环境工作，结合了功能性、视觉吸引力和低资源消耗的优点。


    '
