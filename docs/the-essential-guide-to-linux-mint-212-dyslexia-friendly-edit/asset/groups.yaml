    # Screenshot Focused Window


    Start by running the following command(s) in the application menu:


    - Settings

    - Click Keyboard

    - Click Add custom shortcut

    - Click the box next to Name

    - Type In: Screenshot focused window

    - Click the box next to Command

    - Type In:

    ```bash

