    # Video Editors


    Video Editors are made for the creation, editing and otherwise manipulation of
    Video files with the ability to import and export a varied grouping of video formats,
    through a wide variety of codecs and with several effects.


    Openshot is a Free and Open Source Video Editor that is designed to be simple
    in how the user interfaces with the software, and with the power to carry out
    the tasks required with features such as, unlimited video/audio tracks, 3D animations
    and quick trim.


    Kdenlive (KDE Non-Linear Video Editor) is designed for the KDE Plasma desktop
    but compatible with the major Linux Mint 21 Desktop Environments, with provisions
    like, multi-track video editing, configurable shortcuts and 2D title maker.


    Shotcut is a FOSS and cross platform editor for uses FFMPEG to support various
    audio and video formats, that ships with features like 8k resolution support,
    framerate-accurate seeking and native timeline editing.'
