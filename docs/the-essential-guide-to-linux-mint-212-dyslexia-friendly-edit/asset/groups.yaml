    ```


    从存储库安装软件包，包括任何依赖项。


    # 软件包


    ```bash

    sudo apt remove package

    ```


    从系统中删除软件包，但保留配置文件。


    # 清除软件包


    ```bash

    sudo apt purge package

    ```


    从系统中删除软件包，包括配置文件。


    # 自动移除软件包


