    The rate at which AI and the content they generate is expanding with an ever increasing
    rate, with the hardware cheaper than ever and tools readily accessible, the pattern
    has emerged for the moment to have some fun with AI is now, and with a locally
    ran selection below.


    Easy Diffusion which is the most accessible and quick way to install Stable Diffusion
    on Linux 21 ''Vera'', and loads up with a web-based UI that is easy to understand,
    quick to operate and shows the picture generated clearly, with an option to show
    the pictures while being generated available, in addition to the multitude of
    other choices available in the user interface to customize the image being generated.


    oaboabooga (Text Generation) aims to be the Easy Diffusion of AI Text Generation
    with focuses on 1 click operation, easy importation of third party text-to-text
    models and a multitude of options to fine-tune the AI Model being used, so the
    best experience can be reliably sought.


    A Fine Selection Of Negative Prompts which are all the negative prompts I use
    when generating some lovely interpretations of famous classical artists such as
    John Constable painting a corn field, William Turner illustrating portraits or
    Pablo Picasso gracefully decorating the inside of the Sistine Chapel.


    Upscay is an AI powered Free and Open Source image upscaler with the ability to
    enhance low-res images, increase picture size with minimal quality loss and cross
    platform compatibility.


    Stable Diffusion Web UI is a more user intensive way of Ai Generating Images with
    certain items needing to be manually installed rather than automatically fetched,
    with the flip-side of this being far greater customization options, more detailed
    user interface and the ability to upscale images on their own.


    ChatGPT Desktop Application is a third party unofficial client which interfaces
    with the official OpenAI ChatGPT website, while adding features like Exporting
    ChatGPT history to png/pdf/markdown, common shortcut keys and text to speech support.


