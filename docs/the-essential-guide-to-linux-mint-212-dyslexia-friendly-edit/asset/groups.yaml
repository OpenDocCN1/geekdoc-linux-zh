    ```\n\n重启电脑以使更改生效。\n\n继续在终端中运行以下命令：\n\n```bash\nnvm install 16\nnvm use 16\n```\n\
    \n上述命令将安装特定版本的 nodejs 和 npm，下面的命令将告诉系统（在用户级）使用特定版本的 nodejs 和 npm。\n\n## pnpm (包管理器)\n\
