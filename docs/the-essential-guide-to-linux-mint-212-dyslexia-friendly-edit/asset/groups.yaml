  - '[PAGE 269]


    # Audio Players


    Audio Players are pieces of software created with the explicit purpose of playing
    digital audio files, with limited (usually audio only) or no support for video
    formats, with the prime examples of Audio Players in the Linux Mint 21.2 ''Vera''
    community mentioned below.


    Clementine is a fork of the venerable (and now defunct) Amarok 1.4 with more of
    a focus on a fast accessible user interface, quick searching for music and more
    of a comfy audio playing experience with a fade-out that occurs when the track
    switches, shuffles or alternatively finished.


    Audacious is a Free and Open Source Audio Player built from a descended fork of
    XMMS (or the MultiMedia System), and features playing the users music how they
    wish, via a lightweight resource footprint and extended functionality through
    community developed plugins.'
- md: '

    Deadbeef-vs is a FOSS audio player built on a modular platform with cross device
    capability, with abilities (among others) to play a wide variety of audio formats,
    convert between the different files and with a highly customizable graphical user
    interface.


    Rythmboxox is the audio player that comes as standard with the Linux Mint Cinnamon
    Edition Desktop Environment and focuses on gapless playback, album cover display
    and podcasting.


    Lollypop is a newly created music player aiming to deliver a feather light, intuitive
    and minimalism inspired user experience with a tool-set including synchronization,
    extensive metadata and support for multiple audio formats.


    ## Clementine


    Start by running the following command(s) in Software Manager:


    Clementine


    Click Clementine and Install.


    Otherwise, start by running one of the following command(s) in the terminal:


    ```

    sudo apt install clementine

    ```


    ```

    flatpak install flathub

    org.clementine_player.Clementine

    ```


    ```

    sudo snap install clementine

    ```


