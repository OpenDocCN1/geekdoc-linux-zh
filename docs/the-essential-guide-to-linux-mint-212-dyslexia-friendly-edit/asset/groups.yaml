- md: '

    # Adding user to vboxusers group


    Requires Virtualbox to be installed.


    Proceed to run the following command(s) in the terminal:


    ```

    sudo usermod -aG vboxusers username

    ```


    Replace username, with the desired username.


    Afterwards, run the following command(s) in the terminal:


    ```

    exit

    ```


    Click the power button in the top right.


    Click the power button.


    Click Restart.


    On the other hand, proceed to run the following command(s) in the terminal:


    ```

    sudo reboot

    ```


    sudo reboot now may cause the system to restart as quickly as possible in a not
    respectful manner, that may cause errors in the the kernel, which will necessitate
    loading the current kernel in recovery mode through the GRUB menu, if at all recoverable.


    # Suspending Root Account


    After setting the first user created during the installation of Linux Mint 21.2
    ‘Vera’ to the sudo group, there is little requirement to keep the or root account
    active.


    Firstly the root account will be redirected to /usr/sbin/nologin from /bin/bash,
    that will cause the root account login access to be suspended, while keeping the
    root account around for purposes such as file ownership and running background
    processes like the scheduled ClamAV scan, will be covered further on.


    In addition the “PermitRootLogin” variable will be added (or amended) to the /etc/ssh/ssh_config
    under /etc, with the value of “NO”, will help to stop malicious actors from breaking
    into the system by direct usage of the system root account.


    Furthermore the /etc/shadow will be amended so a “!” is present at the beginning
    of the first line, that may effectively stop stop access to the root account by
    locking it up.


    # /usr/sbin/nologin


    Start by running the following command(s) in the terminal:


    ```

    sudo xed /etc/passwd

    ```


    Change the following line (usually line 1) from:


    root:x:0:0:root:root:/bin/bash


    To:


    root:x:0:0:root:root:/usr/sbin/nologin


    After editing is complete, save progress and exit by clicking Save and then click
    ×, or press CTRL + S and then click ×.


    # /etc/ssh/ssh_config


    Proceed to run the following command(s)(s) in the terminal:


    ```

    sudo xed /etc/ssh/ssh_config

    ```


    Go to the end of ssh_config (usually line 54) and put in the following line:


    ```

    PermitRootLogin no

    ```


    Unless the PermitRootLogin is already present, in which case the following line
    should be changed from:


    ```

    PermitRootLogin yes

    ```


    To:


    ```

    PermitRootLogin no

    ```


    After editing is complete, save progress and exit by clicking Save and then click
    X, or press CTRL + S and then click X.


    # /etc/shadow


    Start by running the following command(s) in the terminal:


    ```

    sudo xed /etc/shadow

    ```


    Go to the line (usually line 1) beginning with root and proceed to add a ! in
    front, for example


    Change "root:",


    To:


    !root:


    After editing is complete, save progress and exit by clicking Save and then click
    X, or press CTRL + S and then click X.


    # Linux Mint Repositories


    The entire process can be done by running a command in the terminal.


    Failure to set up the repository sources in the correct manner and order can lead
    to unsightly issues such as initram-fs tools errors and, malfunctions in the apt
    and dpkg package managers.


    # Adding Repository Variables


    Start by running the following command(s) in the terminal:


    ```

    sudo add-apt-repository main && sudo add-apt-repository multiverse && sudo add-apt-repository
    universe && sudo add-apt-repository restricted

    ```


    ```

    sudo apt update

    ```


    # Updating Linux Mint 21.2


    Linux Mint 21.2 ''Vera'' is easily updated, graphically, by the click of a few
    buttons through Update Manager, or by running a couple of commands in run through
    the terminal in quick succession.


    Additionally Linux Mint can also be set up for automatic updates on shut-down
    by the installation (and configuration), of the unattended-upgrades package, that
    will force the system to be updated to the most up to date version if so wished.


    It is possible to partially disable the update notifications in Linux Mint 21.2
    ''Vera'' by modifying and propagating the status of the Update Manager in Startup
    Applications.


    Change Linux Mint Kernel gives an overview of changing and updating the kernel
    used by Linux Mint from the official repositories provided by the Linux Mint Institute.


    # Update Manager


    Start by running the following command(s) in the

    application menu:


    Update Manager


    Click Continue.


    Click Yes next to Do you want to switch to a local

    mirror.


    Click X.


    Click Refresh.


    Select an update (i.e. vim).


    Click the Description tab.


    Read through the description of the software

    package.


    Click the Packages tab.


    Review which installed packages will be affected

    by the update, and the total size of the update in

    KB.


    Click the Changelog tab.


    Review the changes the will be made to the software package by the update.


    Tick the box under upgrade next to the update to be carried out.


    Click Install Updates.


    Wait for changes to the applied.


    Click Refresh.


    Click X.


    # Command Line Update


    Start by running the following command(s) in the terminal:


    ```

    sudo apt update

    ```


    This should update package and repository lists with the latest available packages
    from the Linux Mint and Ubuntu repositories.


    Any errors with the sources.list or .list in the /etc/apt/sources.list.d folder
    should be apparent at this stage.


    Proceed to run the following command(s) in the terminal:


    ```

    sudo apt upgrade

    ```


    This should present a confirmation screen with the package updates available,
    which packages will be updated/removed, with a Y/N (or Ctrl + C) preferred to
    proceed.


    Remember to read which packages are going to be modified, added or removed, so
    a fair track is kept of how the Linux Mint 21 system and third party packages
    are being upgraded.


    # Automatic Updates


    Start by running the following command(s) in the terminal:


    ```

    sudo apt install unattended-upgrades

    sudo apt install update-notifier-common

    sudo xed /etc/apt/apt.conf.d/20auto-upgrades

    ```


    Change the line, APT::Periodic::Update-Lists to:


    APT::Periodic::Update-Lists "1";


    Change the line, APT::Periodic::Unattended-Upgrade to:


    APT::Periodic::Unattended-Upgrade "1";


    After editing is complete, save progress and exit by clicking Save and then click
    X, or press CTRL + S and then click X.


    Proceed to run the following command(s) in the terminal:


    ```

    sudo xed /etc/apt/apt.conf.d/50unattended-upgrades

    ```


    UN-comment the following lines


    ```

    //${distro_id}:${distro_codename}";

    ```


    ```

    //${distro_id}:${distro_codename}-security}";

    ```


    ```

    //${distro_id}:${distro_codename}-updates}";

    ```


    To:


    ```

    "${distro_id}:${distro_codename}",

    ```


    ```

    "${distro_id}:${distro_codename}-security}",

    ```


    ```

    "${distro_id}:${distro_codename}-updates}",

    ```


    UN-comment


    ```

    //Unattended-Upgrade::InstallShutdown "true";

    ```


    to


    ```

    Unattended-Upgrade::InstallShutdown "true";

    ```


    After editing is complete, save progress and exit by clicking Save and then click
    X, or press CTRL + S and then click X.


    # Disable Update Notifications


    Start by running the following command(s) in the application menu:


    Startup Applications


    Move the switch next to Update Manager to the left and click X.


    # Change Linux Mint Kernel


    Start by running the command(s) in the application menu:


    +   - Update Manager

    - Click View.

    - Click Kernels.

    - Click Continue.

    - Select the highest kernel number in the left column.

    - Select the highest kernel at the top the top of the right column.

    - Click Install.

    - After install is complete click Close.

