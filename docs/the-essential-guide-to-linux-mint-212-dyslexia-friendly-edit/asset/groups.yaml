  - '[PAGE 78]


    # Software Sources


    As it stands Linux Mint 21.2 ''Vera'' ships only with the ability to install software
    from the Linux Mint, Ubuntu and flathub repositories, with .deb file installs
    requiring a change in the "Open With" options to set "Software Install" as the
    default.


    Luckily it is relatively accessible to configure Linux Mint 21 to support the
    latest and greatest software distribution sources, to staggeringly increase the
    amount that can be installed, with other sources of software available such as:


    Flatpak and flathub repository support may only be installed through the command
    line, with the flatpaks accessible through the flathub repository that is integrated
    with the software manager.


    Snap and the Graphical Snap Store can be installed just inside the terminal with
    a short but extensive command, with the Snap Store the only way to install snaps
    through a graphical interface on Linux Mint 21, due to none of the gnome-plugin
    packages integrating with the Software Manager.'
- md: '

    AppImages can be rendered executable with the "chmod +x" command, or accessibly
    integrated with the system via the installation and usage of AppImageLauncher.


    AppOutlet being a fun new app store which aims to be universal in appeal and compatibility
    to all Linux Based Operating Systems, at the moment supporting AppImages, Flatpaks
    and Snaps, with .deb and .AppImage versions, of the store, currently available.


    Python and PIP make up the python programming language and the pip package manager,
    which has the ability to seek, download and build a variety of packages based
    on the user(s) input(s).


    Node.js & NPM which combined make a software manager that permits the sharing,
    building and installing of almost a million source code packages.


    NVM, or Node Version Manager, is a FOSS (Free and Open Source Software) version
    manager for Node.js and NPM, which permits the adding, using and removing of various
    installed and available Node.js and NPM versions.


    pnpm is a package manager with a focus on speed (being up to 2 times quicker than
    other sources), efficiency (with node_module files cloned or hard-linked from
    addressable storage) and strictness (due to no node_modules having access to arbitrary
    packages).


    Homebrew is a package manager which aims to help the user install all the stuff
    that was not installed with Linux Mint 21, helped by features such as, installing
    packages to their own directory and auto-adding symlinks and creating ones own
    homebrew packages.


    ## Set Software Install as Default


    - Right click a .deb file.

    - Click Properties.

    - Click Open with.

    - Select Software Install.

    - Click Set as Default.

    - Click X.


    ## Software Manager


    Install applications through Software Manager by clicking an application and clicking
    “Install”, or type in the name of a program to install into the search bar, for
    example vlc, before clicking the application and Install.


    Different software sources for an application can be selecting by finding one
    through the front page, category pages, looking with the search bar, before clicking
    on an application, for example SMPPlayer, and press the drop down box below the
    install button, with the available options including up to, Linux Mint, Ubuntu
    and Flatpak (Flathub).


    After selecting the desired source from the selection presented, click “Install”.


    Software Manager can be used to remove installed applications, through clicking
    on the Installed tab in Software Manager, and pressing Uninstall next to the application
    the being wishes to uninstall or remove.


    ## APT


    The APT package lists and repositories can be updates by running the following
    command(s) in the terminal: sudo apt update


    APT packages can be upgraded by running the following command(s) in the terminal:


    sudo apt update && sudo apt upgrade -y


    APT packages can be removed or uninstalled by running the following command(s)
    in the terminal: sudo apt remove


    Package of the APT variety can be purged by running the following command(s) in
    the terminal: sudo apt purge


    Individual .list files from 3rd party repositories can be removed by running the
    following command(s):


    cd /etc/apt/sources.list.d


    sudo rm -r xanmod.list && sudo apt update


    Leftover packages can be removed by running the following command(s) in the terminal:


    sudo apt autoremove


    ## Flatpak


    Start by running the following command(s) in the terminal:


    ```

    sudo apt update && sudo apt install flatpak

    ```


    The computer should be restarted so that software installed will show up in the
    application menu, unless to be run through "flatpak run com.github.Eloston.UngoogledChromium".


    Flatpaks can be uninstalled through software by pressing "Uninstall" or clicking
    the trash can, or command line, by running the following command(s) in the terminal:


    ```

    flatpak uninstall

    com.github.Eloston.UngoogledChromium

    ```


    The above being the name of the app being uninstalled from https://flathub.org/.


    ## Flatpak Extended


    Flatpaks can be installed through the command line by running the following command(s)
    in the terminal:


    ```

    flatpak install flathub org.gnome.Snapshot

    ```


    Replacing flathub org.gnome.Snapshot , with the name of the flatpak wished to
    be removed.


    Flatpaks can be removed by running the following command(s) in the terminal:


    ```

    flatpak remove org.gnome.Snapshot

    ```


    Flatpak repos can be uninstalled by running the following command(s) in the terminal:


    ```

    flatpak remotes

    ```


    To list the flatpak repositories on the system


    ```

    flatpak remote-delete flathub https://flathub.org/repo/flathub.flatpakrepo

    ```


    Flatpak can be removed from the system totally by running the following command(s)
    in the terminal:


    ```

    sudo apt purge flatpak

    ```


    ## Flathub


    Add flathub by running the following command(s)

    in the terminal:


    ```

    flatpak remote-add --if-not-exists flathub

    https://flathub.org/repo/flathub.flatpakrepo

    ```


    Remove flathub by running the following

    command(s) in the terminal:


    ```

    flatpak remote-delete flathub

    ```


    ## Snap


    Start by running the following command(s) in the terminal:


    ```

    sudo mv /etc/apt/preferences.d/nosnap.pref ~/Documents/nosnap.backup

    ```


    ```

    sudo apt update

    ```


    ```

    sudo apt install snapd

    ```


    The snap store can be removed by running the following command(s) in the terminal:


    ```

    sudo snap remove

    ```


    ## Snap Store


    Start by running the following command(s) in the terminal:


    ```

    sudo apt update

    ```


    ## Snap Extended


    Snap packages can be installed by running the following command(s) in the terminal:


    ```

    sudo apt update

    ```

    '
  mdcn: '


    AppImages 可以通过 `chmod +x` 命令赋予可执行权限，也可以通过安装和使用 AppImageLauncher 与系统进行无缝集成。


    AppOutlet 是一个趣味的新应用商店，旨在对所有 Linux 操作系统具有通用的吸引力和兼容性。目前支持 AppImages、Flatpaks 和 Snaps，且商店已提供
    .deb 和 .AppImage 的版本。


    Python 和 PIP 构成了 Python 编程语言和 pip 包管理器，后者能够根据用户的输入搜索、下载并构建各种软件包。


    Node.js & NPM 结合在一起形成了一个软件管理器，允许共享、构建和安装近百万个源码包。


    NVM（或 Node Version Manager）是一个用于 Node.js 和 NPM 的 FOSS（自由开源软件）版本管理器，允许添加、使用和删除各种已安装和可选
    Node.js 及 NPM 版本。


    pnpm 是一个包管理器，侧重于速度（比其他源快达 2 倍）、效率（通过从可寻存储器克隆或硬链接 node_module 文件）以及严格性（因为 node_modules
    无法访问任意包）。


    Homebrew 是一个包管理器，旨在帮助用户安装 Linux Mint 21 未包含的所有内容，其功能包括将包安装到它们自己的目录、自动添加符号链接以及创建自己的
    homebrew 包。


    ## 将软件安装设为默认打开方式


    - 右键点击 .deb 文件。

    - 点击“属性”。

    - 点击“打开方式”。

    - 选择“软件安装”。

    - 点击“设置为默认值”。

    - 点击“X”。


    ## 软件管理器


    通过点击应用程序并点击“安装”来通过软件管理器安装应用程序，或者在搜索栏中输入要安装的程序名称（例如 vlc），然后点击该程序并点击“安装”。


    可以通过在首页、分类页面查找或使用搜索栏查找来选择应用程序的不同软件源，例如在点击应用程序（如 SMPPlayer）之前，点击安装按钮下方的下拉框，可用选项包括
    Linux Mint、Ubuntu 和 Flatpak (Flathub)。


    从弹出的选项中选择所需的源后，点击“安装”。


    可以使用软件管理器来删除已安装的应用程序，方法是：点击软件管理器中的“已安装”选项卡，并在想要卸载或删除的应用程序旁边按“卸载”。


    ## APT


    APT 软件包列表和仓库可以通过在终端中运行以下命令进行更新：`sudo apt update`


    可以通过在终端中运行以下命令来升级 APT 软件包：


    `sudo apt update && sudo apt upgrade -y`


    可以通过在终端中运行以下命令来删除或卸载 APT 软件包：`sudo apt remove`


    可以通过在终端中运行以下命令来清除 APT 类型的包：`sudo apt purge`


    可以通过运行以下命令删除来自第三方仓库的单个 .list 文件：


    `cd /etc/apt/sources.list.d`


    `sudo rm -r xanmod.list && sudo apt update`


    可以通过在终端中运行以下命令删除残留的包：


    `sudo apt autoremove`


    ## Flatpak


    首先在终端中运行以下命令：


    ```

    sudo apt update && sudo apt install flatpak

    ```


    应该重启电脑，这样已安装的软件就会显示在应用程序菜单中，除非通过 `flatpak run com.github.Eloston.UngoogledChromium`
    运行。


    可以通过软件界面按“卸载”或点击垃圾桶来卸载 Flatpak，也可以通过命令行在终端中运行以下命令：


    ```

    flatpak uninstall

    com.github.Eloston.UngoogledChromium

    ```


    上述为从 https://flathub.org/ 卸载的应用程序名称。


    ## Flatpak 扩展


    可以通过在终端运行以下命令通过命令行安装 Flatpak：


    ```

    flatpak install flathub org.gnome.Snapshot

    ```


    将 `flathub org.gnome.Snapshot` 替换为想要删除的 flatpak 名称。


    可以通过在终端中运行以下命令删除 Flatpak：


    ```

    flatpak remove org.gnome.Snapshot

    ```


    可以通过在终端中运行以下命令卸载 Flatpak 仓库：


    ```

    flatpak remotes

    ```


    要列出系统上的 flatpak 仓库：


    ```

    flatpak remote-delete flathub https://flathub.org/repo/flathub.flatpakrepo

    ```


    可以通过在终端中运行以下命令从系统中彻底删除 Flatpak：


    ```

    sudo apt purge flatpak

    ```


    ## Flathub


    在终端中运行以下命令添加 flathub：


    ```

    flatpak remote-add --if-not-exists flathub

    https://flathub.org/repo/flathub.flatpakrepo

    ```


    在终端中运行以下命令移除 flathub：


    ```

    flatpak remote-delete flathub

    ```


    ## Snap


    首先在终端中运行以下命令：


    ```

    sudo mv /etc/apt/preferences.d/nosnap.pref ~/Documents/nosnap.backup

    ```


    ```

    sudo apt update

    ```


    ```

    sudo apt install snapd

    ```


    可以通过在终端中运行以下命令移除 snap 商店：


    ```

    sudo snap remove

    ```


    ## Snap 商店


    首先在终端中运行以下命令：


    ```

    sudo apt update

    ```


    ## Snap 扩展


    可以通过在终端运行以下命令安装 Snap 软件包：


    ```

    sudo apt update

    ```


    '
