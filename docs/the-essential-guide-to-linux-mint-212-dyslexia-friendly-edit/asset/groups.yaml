    # Web Browsers


    Web browsers are applications built with the main (or total) purpose of accessing
    websites over a connection, using a variety of network protocols and DNS roots,
    with the two trees of web browsers discussed below.


    Chromium based Web Browsers are made using the source code from the FOSS, or Free
    and Open Source Software, chromium project with the code taken by developers,
    adjusted, modified, rewritten, patched and compiled into the variety of Chromium
    Based Web Browsers.


    Chromium lacks certain features present in the Google Chrome Web Browser, for
    example automatic browser updates, google browser sync and tracking usage/crash
    reports.


    Firefox and Firefox ESR based web browsers are created using the FOSS codebase
    of the Firefox, Mozilla Firefox, project, with browsers made using these building
    blocks generally thought of being more secure, user privacy conscious and in-built
    picture in picture/'
- md: '

    ## Chromium Based


    Google Chrome is the world''s most popular web browser reaching over 60% of desktop
    computers, being the fruition of the google-instigated chromium project, and shipping
    with features as multi-use address bar, strong password protection and chrome
    sync across multiple devices.


    Microsoft Edge is a chromium-based Web Browser developed by Microsoft with a focus
    on integration with the Windows 11 operating system and bringing some of that
    integration to the Linux Mint 21.2 ‘Ver’ operating system, with features like
    Bing Chat AI assisted search, higher browsing performance and Clarity Boost for
    Xbox Cloud Gaming.


    Thorium Browser is a relatively new entry into the chromium-based browser scene,
    created by one being (and the collaboration of others), it ships with inclusions
    such as DNS over HTTPS capability, jpeg-xl support by default and audio sandboxing.


    Opera is a recent addition to the Chromium Based Web Browser family switching
    from over their own browser framework a number of years ago, with the new Opera
    One browser shipping with features such as integrated free VPN, built-in ad-blocking
    and generative AI.


    Chromium is the full FOSS version of said Project, that has paved the way for
    half the browsers on this list, and currently ships with a feature-set including
    pop-out menu sidebar to increase viewing area, chromium browser safety check and
    integrated privacy guide.


    Vivaldi is powerful, personal and private Internet Browser with a focus on unrivaled
    customizing, performance and productivity, with a robust tool-set featuring integrated
    tracker blocking, option to hide cookie warnings and tab hibernation.


    Brave is a chromium-based Web Browser with a twist in that it aims to protect
    the user from powerful technology companies, through assistance of its integrated
    feature-set with examples being, inbuilt search engine, privacy-aided advertising
    platform and tracking shields.


    ## Google Chrome


    Start by going to the following web address:


    https://www.google.com/chrome/


    Click Download Chrome.


    Click 64 bit .deb (For Debian/Ubuntu)


    Click Accept and Install


    Double Click google-chrome-stable_current_amd64.deb and Install


    Otherwise, start by going to the following web address:


    https://www.google.com/chrome/


    Click Download Chrome. Click 64 bit .deb (For Debian/Ubuntu)


    Click Accept and Install


    Go to: ~/Downloads


    Right Click empty space and Open in terminal.


    Run the following command(s) in the terminal:


    ```

    sudo dpkg -i google-chrome-stable_current_amd64.deb

    ```


    ## Microsoft Edge


    Start by going to the following web address:


    https://www.microsoft.com/en-us/edge/download?form=MA13FW


    Click Linux (.deb)


    Click Accept and Download


    Double Click microsoft-edge-stable_amd64.deb and Install


    ## Thorium Browser


    Start by going to the following web address:


    https://github.com/Alex313031/Thorium/releases


    Download the latest thorium-browser_amd64.deb


    Double Click thorium-browser-_-amd64.deb and Install


    ## Opera


    Start by running the following command(s) in

    Software Manager:


    Opera


    Click Opera and Install.


    Otherwise, start by going to the following web

    address:


    https://www.opera.com/browsers/opera


    Download Opera


    Double Click opera-stable and Install


    On the other hand, start by running the following

    command(s) in the terminal:


    ```

    sudo snap install opera

    ```


    I would advise against installing the apt version of

    opera through the opera APT repositories, because

    (at the time of writing), it can render APT unable

    to read the list of sources, and this may change

    with time, in addition to the full release of the

    Opera One browser expected later in 2023/2024.


    ## Opera One


    Start by going to the following web address:


    https://www.opera.com/one


    Click DOWNLOAD NOW


    Double Click opera-stable_.deb and Install.


    ## Chromium


    Start by running the following command(s) in Software Manager:


    Click Chromium and Install.


    Alternatively, start by running one of the following command(s) in the terminal:


    ```

    sudo apt install chromium-browser

    ```


    ```

    sudo snap install chromium

    ```


    ## Vivaldi


    Start by going to the following web address:


    https://vivaldi.com/download/


    Download Vivaldi for Linux DEB


    Double Click vivaldi-stable.deb and Install


    ## Brave


    Start by running the following command(s) in

    Software Manager:


    ```

    brave

    ```


    Click brave and Install.


    Or, start by running the following command(s) in

    the terminal:


    ```

    sudo snap install brave

    ```


    Or, run the following command(s) in the terminal:


    ```

    sudo apt install curl

    ```


    ```

    sudo curl -fsSLO /usr/share/keyrings/brave-browser-apt-keyring.gpg https://brave-browser-release.s3.brave.com/archive-keyring.gpg

    ```


    ```

    echo ''deb [signed-by=/usr/share/keyrings/brave-browser-archive-keyring.gpg] https://brave-browser-apt-release.s3.brave.com/
    stable main| sudo tee /etc/apt/sources.list.d/brave-browser-release.list

    ```


    ```

    sudo apt update

    ```


    ```

    sudo install brave-browser

    ```


    ## Firefox Based Browsers


    Firefox is aimed towards home, educational and business markets, in addition to
    those who prefer (or require) a far more reliable experience, with Firefox ESR
    being more frequent updates and less risky changes.


    Waterfox is a FOSS fork of Mozilla Firefox with a focus on speed, privacy, and
    choice, with certain features like client-side translation and limited data collection.


    Mercury is a heavily modified version of Firefox that boasts up to 20% faster
    speed over Firefox, with certain features like installing Firefox addon files
    directly.


    LibreWolf is a changed twist on Firefox with a renewed focus on privacy, security,
    and freedom, with features such as revoked telemetry and baked in private search
    providers.


    Pale Moon is a rebuilt of Firefox with the aim to always be free to use and download,
    that comes with its own layout engine called Goanna, and modern processor optimization.


    Basilisk is a fork of the pre-servo version of Mozilla Firefox, based on XUL and
    creation above the Unified XUL Platform (or UXP), and ships with modern cryptographic
    usability.


    Mullvad Browser is a changing version of Firefox that can be boiled down to the
    TOR browser but without built-in access to The Onion Router, made primarily for
    use with the Mullvad VPN service.


    ## Firefox


    Start by running the following command(s) in

    Software Manager:


    Firefox


    Click Firefox and Install.


    Alternatively, start by running one of the

    following command(s) in the terminal:


    ```

    sudo apt install firefox

    ```


    ```

    flatpak install flathub org.mozilla.firefox

    ```


    ```

    sudo snap install firefox

    ```


    ## Waterfox


    Start by running the following command(s) in Software Manager:


    Waterfox


    Click Waterfox and Install.


    Alternatively, start by running the following command(s) in the terminal:


    ```

    flatpak install flathub net.waterfox.waterfox

    ```

    '
  mdcn: '


    ## 基于 Chromium 的浏览器


    Google Chrome 是全球最流行的网络浏览器，覆盖了超过 60% 的桌面端电脑。它是 Google 发起的 Chromium 项目的结晶，并配备了多用途地址栏、强密码保护以及跨设备
    Chrome 同步等功能。


    Microsoft Edge 是由微软开发的基于 Chromium 的网络浏览器，侧重于与 Windows 11 操作系统的集成，并将这种集成体验带入 Linux
    Mint 21.2 ‘Ver’操作系统，其功能包括 Bing Chat AI 辅助搜索、更高的浏览性能以及针对 Xbox 云游戏的 Clarity Boost（清晰度增强）。


    Thorium Browser 是 Chromium 浏览器领域中一个较新的竞争者，由单个人（以及他人的协作）创建，它包含了 DNS over HTTPS
    能力、默认支持 JPEG-XL 以及音频沙箱等功能。


    Opera 是 Chromium 网络浏览器家族的近期新增成员，它在几年前放弃了自研的浏览器框架。全新的 Opera One 浏览器提供了集成式免费 VPN、内置广告拦截和生成式
    AI 等功能。


    Chromium 是上述项目的完全自由开源软件（FOSS）版本，它为列表中后一半的浏览器铺平了道路，目前提供的功能集包括用于增加视野的弹出菜单侧边栏、Chromium
    浏览器安全检查以及集成隐私指南。


    Vivaldi 是一款强大、个性且私密的互联网浏览器，专注于无与伦比的自定义、性能和生产力，拥有强大的工具集，包括集成跟踪器拦截、隐藏 Cookie 警告选项以及标签页休眠功能。


    Brave 是一款基于 Chromium 的浏览器，其独特之处在于旨在通过其集成功能集保护用户免受强大科技公司的侵害，例如内置搜索引擎、隐私辅助广告平台和跟踪保护盾。


    ## Google Chrome


    首先访问以下网页地址：


    https://www.google.com/chrome/


    点击“下载 Chrome”。


    点击“64 位 .deb (适用于 Debian/Ubuntu)”


    点击“接受并安装”。


    双击 `google-chrome-stable_current_amd64.deb` 并安装。


    或者，首先访问以下网页地址：


    https://www.google.com/chrome/


    点击“下载 Chrome”。点击“64 位 .deb (适用于 Debian/Ubuntu)”


    点击“接受并安装”。


    前往：`~/Downloads`


    在空白处右键点击并选择“在终端中打开”。


    在终端中运行以下命令：


    ```

    sudo dpkg -i google-chrome-stable_current_amd64.deb

    ```


    ## Microsoft Edge


    首先访问以下网页地址：


    https://www.microsoft.com/en-us/edge/download?form=MA13FW


    点击“Linux (.deb)”


    点击“接受并下载”。


    双击 `microsoft-edge-stable_amd64.deb` 并安装。


    ## Thorium Browser


    首先访问以下网页地址：


    https://github.com/Alex313031/Thorium/releases


    下载最新的 `thorium-browser_amd64.deb`


    双击 `thorium-browser-_-amd64.deb` 并安装。


    ## Opera


    首先在“软件管理器（Software Manager）”中运行以下命令：


    Opera


    点击 Opera 并安装。


    或者，首先访问以下网页地址：


    https://www.opera.com/browsers/opera


    下载 Opera


    双击 `opera-stable` 并安装。


    另一方面，首先在终端中运行以下命令：


    ```

    sudo snap install opera

    ```


    我不建议通过 Opera APT 仓库安装 apt 版本的 Opera，因为（在编写此时），它可能会导致 APT 无法读取源列表，这可能会随着时间而变化，此外预计在
    2023/2024 年后还将正式发布 Opera One 浏览器。


    ## Opera One


    首先访问以下网页地址：


    https://www.opera.com/one


    点击“立即下载”。


    双击 `opera-stable_.deb` 并安装。


    ## Chromium


    首先在“软件管理器”中运行以下命令：


    点击 Chromium 并安装。


    或者，首先在终端中运行以下命令之一：


    ```

    sudo apt install chromium-browser

    ```


    ```

    sudo snap install chromium

    ```


    ## Vivaldi


    首先访问以下网页地址：


    https://vivaldi.com/download/


    下载 Linux DEB 版 Vivaldi


    双击 `vivaldi-stable.deb` 并安装。


    ## Brave


    首先在“软件管理器”中运行以下命令：


    ```

    brave

    ```


    点击 brave 并安装。


    或者，首先在终端中运行以下命令：


    ```

    sudo snap install brave

    ```


    或者，在终端中运行以下命令：


    ```

    sudo apt install curl

    ```


    ```

    sudo curl -fsSLO /usr/share/keyrings/brave-browser-apt-keyring.gpg https://brave-browser-release.s3.brave.com/archive-keyring.gpg

    ```


    ```

    echo ''deb [signed-by=/usr/share/keyrings/brave-browser-archive-keyring.gpg] https://brave-browser-apt-release.s3.brave.com/
    stable main| sudo tee /etc/apt/sources.list.d/brave-browser-release.list

    ```


    ```

    sudo apt update

    ```


    ```

    sudo install brave-browser

    ```


    ## 基于 Firefox 的浏览器


    Firefox 面向家庭、教育和商业市场，以及那些倾向于（或需要）更可靠体验的用户，其中 Firefox ESR 的更新更频繁且风险更小。


    Waterfox 是 Mozilla Firefox 的一个自由开源软件（FOSS）分支，专注于速度、隐私和选择，具有如客户端翻译和限制数据收集等功能。


    Mercury 是 Firefox 的深度修改版本，速度比 Firefox 快达 20%，并具有直接安装 Firefox 插件文件等功能。


    LibreWolf 是 Firefox 的一个变体，重新关注隐私、安全和自由，具有如移除遥测数据和内置隐私搜索提供者等功能。


    Pale Moon 是 Firefox 的重建版本，旨在始终免费使用和下载，它带有名为 Goanna 的自主布局引擎，并针对现代处理器进行了优化。


    Basilisk 是 Mozilla Firefox 之前的 Servo 版本的分支，基于 XUL 并在统一 XUL 平台（或 UXP）之上构建，并配备了现代密码学可用性。


    Mullvad Browser 是 Firefox 的一个变体，可以简化为 TOR 浏览器但没有内置对洋葱网络的访问，主要为配合 Mullvad VPN 服务而设计。


    ## Firefox


    首先在“软件管理器”中运行以下命令：


    Firefox


    点击 Firefox 并安装。


    或者，首先在终端中运行以下命令之一：


    ```

    sudo apt install firefox

    ```


    ```

    flatpak install flathub org.mozilla.firefox

    ```


    ```

    sudo snap install firefox

    ```


