- md: '

    # Adding Single Port Rules (UFW)


    Permit a single port rule by running the following command(s) in the terminal:


    ```

    sudo ufw allow 80/tcp

    ```


    ```

    sudo ufw allow 80/udp

    ```


    You are currently unable to add tcp and udp together in one firewall rule, due
    to the differing natures of the protocols.


    # Adding Multi Port Rules (UFW)


    Set a multi port rule by running the following command(s) in the terminal:


    ```

    sudo ufw allow 80,443/tcp

    ```


    ```

    sudo ufw allow 80,443/udp

    ```


    # Adding Range Port Rules (UFW)


    Allow a range port rule by running the following command(s) in the terminal:


    ```

    sudo ufw allow 1119:1120/tcp

    ```


    ```

    sudo ufw allow 1119:1120/udp

    ```


    # Multi and Range Port Rules


    Empower a multi and range port rule by running the following command(s) in the
    terminal:


    ```

    sudo ufw allow 80,443,1119:1120/tcp

    ```


    ```

    sudo ufw allow 80,443,1119:1120/udp

    ```


    Check the status of added port rules by running the following command(s) in the
    terminal:


    ```

    sudo ufw status

    ```


    # Removing Port Rules (UFW)


    Start by running the following command(s) in the terminal:


    ```

    sudo ufw status numbered

    ```


    Delete the ufw port rule by running the following command(s) in the terminal:


    ```

    sudo ufw delete 214

    ```


    Substitute "214" for the number of the rule that is to be deleted, with the same
    going for the ports in the previous section, except with ports.


    Check the status of the removed port rule by running the following command(s)
    in the terminal:


    ```

    sudo ufw status

    ```


    # GUFW (Firewall Configuration)


    Start by opening Software and running the following command:


    ```

    gufw

    ```


    Click Firewall Configuration and then Install.


    Now launchable by opening the Firewall Configuration program in the application
    menu.


