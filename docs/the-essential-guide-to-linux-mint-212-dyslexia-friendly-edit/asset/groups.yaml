    ## 远程办公


    近年来，远程办公工具已变得不可或缺，因为越来越多的中小型企业意识到，大多数员工的效率与在办公室工作相当，甚至更高。


    Zoom 是一个全球通信平台，允许用户通过视频、音频、电话和聊天进行交流，被全球组织用于管理远程工作团队。


    Slack 旨在让人们聚集在一起处理正确的活动，同时尽可能地自动化某些任务，留出更多时间按时且预算完成项目。


