    \n在终端中运行以下命令启动 ufw：\n\n```bash\nsudo ufw enable\n```\n\n在终端中运行以下命令检查新安装防火墙和配置的状态：\n\
    \n```bash\nsudo ufw status\n```\n\n所有新添加的防火墙规则现在都已就绪、启用并正常工作。\n\n"
