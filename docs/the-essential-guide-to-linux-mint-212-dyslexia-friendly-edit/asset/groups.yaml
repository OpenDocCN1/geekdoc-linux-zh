    # Brasero


    Brasero can be installed by running one of the following command(s) in the terminal:


    ```

    sudo apt install brasero

    ```

    (Debian and Ubuntu based operating systems)


    ```

    sudo dnf install brasero

    ```

    (Red hat and fedora based operating systems)


    ```

    sudo emerge brasero

    ```

    (Gentoo based operating systems)


    ```

    sudo yum install brasero

    ```

    (CentOS 8 and elder based operating systems)


    ```

    sudo zypper install brasero

    ```

    (openSUSE and openSUSE based operating systems)


    # CDBurnerXP


    CDBurnerXP can be installed by going to the following website:


    https://www.cdburnerxp.se/


    Click CDBurnerXP.


    Click CDBurnerXP 64-bit Setup.


    Double Click cdbxp_setup_4.5.8.7128_x64_minimal.exe and Install.


    # Ventoy


    Start by going to the following web address:


    https://github.com/ventoy/Ventoy/releases


    Download the latest release of ventoy-linux.tar.gz.


    Double Click Ventoy-1.0.93-linux.tar.gz.


    The latest available version of Ventoy, at the time of writing is ventoy-1.0.93-linux.tar.gz,
    and will thus be mentioned as ventoy-1.0.93-linux.tar.gz and ventoy-1.0.93.


    Select


    Go to:

    ~Downloads (~ meaning /home/username/ in Linux Mint 21 speak)


    Click Extract.


    Click Show the Files.


    Proceed to run the following command(s) in the terminal:


    ```bash

    cd ~/Downloads/ventoy-1.0.93

    dir

    sudo ./VentoyGUI.x86_64

    ```


    Click drop down box underneath Device.


    Select USB drive from drop down box.


    Ensure all wanted/needed files are backed up locally and (if possible) in the
    cloud also.


    Click Install and Confirm.


    Click Update to update the version of Ventoy on the USB drive.


    Copy over the Linux Mint 21.2 ''Vera'' ISO to the newly created Ventoy partition,
    while taking care not to copy over to the Ventoy EFI partition.


    # Setting BIOS to Boot From USB


    These are based upon experience with my current motherboard, MSI MAG B550 Tomahawk.


    Start by plugging the USB drive into the appropriate port.


    Restart or Power on the computer.


    Press the appropriate key or key combination to enter the motherboard BIOS screen
    (usually DEL/F2/F10).


    Once In the motherboard BIOS screen move the USB drive or USB disk to the left
    most option so it will boot first.


    On the other hand, go to the boot selection menu and move the USB drive to the
    top to ensure it will boot first.


    To disable secure boot, proceed to run the following command(s) in the motherboard
    BIOS.


    Proceed to go to Advanced mode.


    Click Settings.


    Click Windows OS Configuration.


    Click Secure Boot.


    Click Disabled.


    Once the motherboard BIOS settings have been changed to the being(s) satisfaction,
    proceed to:


    Save the BIOS Configuration.


    Reboot the system.


    Alternatively, Press F10 to Save the BIOS Configuration and Restart.


    # Booting into the Linux Mint 21.2 ISO


    - Boot into the Ventoy USB drive.

    - Select the Linux Mint 21.2 ISO.

    - Press ENTER.

    - Select grub mode.

    - Press ENTER.

    - Select Start Linux Mint 21 Install.

    - Press ENTER.


    # Installing Linux Mint 21.2


    Installing Linux Mint 21.2 is about the process of installation through the ubiquity-based
    installer, by choosing the keyboard layout/sub-layout, deciding whether to load
    the multimedia codecs, choosing the installation type, assigning the desired timezone,
    creating the user and rebooting the computer once installation is completed.


    # Keyboard layout


    Double Click Install Linux Mint


    Select Keyboard Layout on the left side, for example, English (UK)


    Select Keyboard sub-layout on the right side, i.e. English (UK).


    Click Continue


    # Multimedia codecs


    Tick the box next to Install multimedia codecs.


    Click Continue.


    # Installation type


    There three types of installation available in the ubiquity-based Linux Mint 21
    Installer.


    - Install alongside existing operating system, which may be chosen for a quick,
    accessible and convenient way to install Linux Mint 21 next to an existing operating
    system on the same disk.


    - Erase disk and install Linux Mint, that wipes the entire disk and installs Linux
    Mint 21.2 ‘Vera’ using pre-designed partition sizes.


    - Something else which permits the creation, resizing and otherwise modification
    of partitions on the chosen disk.


    If one desires a more accessible route to having Linux Mint 21.2 ‘Vera’ installed,
    then Installing alongside an existing operating system or Erase disk and install
    could be chosen.


    However the focus for this will be on Something else to provide more of a getting
    to grips with disks, partitions, volumes and the different sizes they need to
    be in in order for a functioning system to be created.


    # Install alongside/Erase disk


    Click Install Now.


    Review changes to disks.


    Click Continue.


    # Something else


    The following is based on a 1TB NVME SSD and be scaled down (with the exception
    of the EFI partition that should be at least 512 MB).


    # New Partition Table


    Click +


    Select Disk.


    If no partition table on selected disk:


    Click New Partition Table

    Click Continue


    Select free space.


    # EFI Partition


    Click +.


    Click the box next to Size.


    Replace with: 1024


    Click the switch next to Primary.


    Click the switch next to Beginning of this space.


    Click the box next to Use as.


    Click EFI.


    Click OK.


    # SWAP


    Click +.


    Click the box next to Size.


    Replace with: * 71680


    Click the switch next to Primary.


    Click the switch next to Beginning of this space.


    Click the box next to Use as.


    Click swap area.


    Click OK.


    # / or Root filesystem


    Click +.


    Click the box next to Size.


    Replace with the remainder of Free Space.


    Click the switch next to Primary.


    Click the switch next to Beginning of this space.


    Click the box next to Use as.


    Click Ext4 journaling file system.


    Click the box next to Mount point.


    Click /.


    Click OK.


    # Install Now


    Click Install Now.


    Review changes to disks.


    Click Continue.


    # Choosing timezone


    Click the area on the map where the desired location is present.


    Alternatively, type in the name of the city next to the desired location, in the
    box below the world map.


    Click continue


    # Creating the user


    Click the box next to Your name., Type In a name.


    The box next to Your computer''s name will automatically fill up, as you type
    in the box next to Your name.


    Click the box next to Pick a username., Type In a username


    Click the box next to Choose a password.


    Choose a highly secure and easily remembered password.


    Click the switch next to Require my password to log in., Click Continue/Install.


    # Installation complete


    Wait until installation has completed.


    Click Restart Now.


    After restart, and before the motherboard BIOS logo is visible, remove the USB
    drive.


    # Selecting boot entry


    I am basing this information on my MSI MAG B550 Tomahawk.


    After removing the USB drive, press F10, or whichever key is set for the motherboard,
    repeatedly or steadily, before the motherboard BIOS logo is visible, to load into
    Motherboard BIOS.


    Move the USB drive near the end of the boot queue.


    Click Advanced Mode.


    Click Settings.


    Click Boot.


    Click UEFI Hard Drive Priorities.


    Select 1st Entry.


    Select Ubuntu with the arrow keys and press ENTER.


    Save and Exit to restart.


    # First Linux Mint 21.2 Login


    Click the username created during the Installation process.


    Type in the password created for the username and login.


    Click Let''s go!


    Move the switch in the middle of the sun up and sun symbols, to the right to activate
    dark mode.


    Untick the box next to Show this dialogue at startup.


    Click the X.


    Go to the taskbar and right click the Update Manager icon.


    Click Quit.


    # Adding user to sudo group


    Proceed to run the following command(s) in the terminal:


    ```bash

    sudo usermod -a sudo username

    ```


    Replace username, with the desired username.


    Afterwards, run the following command(s) in the terminal:


    ```bash

    exit

    ```


    Click the power button in the top right.


    Click the power button.


    Click Restart.


    On the other hand, proceed to run the following command(s) in the terminal:


    ```bash

    sudo reboot

    ```


    sudo reboot now may cause the system to restart as quickly as possible in a not
    respectful manner, that may cause errors in the kernel, which will necessitate
    loading the current kernel in recovery mode through the GRUB menu, if at all recoverable.

