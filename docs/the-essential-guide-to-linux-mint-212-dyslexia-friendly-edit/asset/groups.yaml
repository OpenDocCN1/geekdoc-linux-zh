    # I2PD Conf Setup


    Run the following command(s) in the terminal:


    sudo xed /etc/i2pd/i2pd.conf


    Change:


    # outproxy.enabled = false


    ## Address and port of outproxy


    # outproxy = 127.0.0.1


    # outproxyport = 9050


    to, outproxy.enabled = true


    ## Address and port of outproxy


    outproxy = 127.0.0.1


    outproxyport = 9050


    After editing is complete, save progress and exit by clicking Save and then click
    X, or press CTRL + S and then click X.


    Run the following command(s) in the terminal:


    sudo systemctl restart i2pd


    systemctl start i2pd


    # Setup Firefox for i2pd


    Start by running the following command(s) in the application menu:


    Firefox


    Open Firefox settings, click General and scroll down until Network Settings is
    visible.


    Click, "Settings" under "Network Settings".


    Press the switch next to "HTTP Proxy Settings".


    Click the long box next to HTTP Proxy and type in:


    127.0.0.1


    Click the short box next to Port and type in:


    4444


    Modify according to preferences and click OK.


    # Freenet


    Start by going to the Download page at:


    https://freenetproject.org/pages/download.html


    Download FREENET FOR GNU/LINUX & POSIX (latest version is currently, new_installer_offline_1496.jar)


    Proceed to run the following command(s) in the terminal: sudo apt install default-jre
    default-jdk


    Navigate to the Download directory:


    cd ~/Downloads


    Run the FREENET setup by running the following command(s) in the terminal:


    java -jar new_installer_offline_1496.jar


    Freenet can be accessed by going to http://localhost:8888/ (or http://127.0.0.1:8888)
    over the web browser.


    The Freenet service can be halted by visiting the following address in a web browser:


    http://localhost:8888/system/shutdown.


    # FREENET .desktop Shortcut


    Start by running the following command:


    ```

    sudo xed /usr/share/applications/freenet1.desktop


    [Desktop Entry]

    Version=1.0

    Name=Freenet

    Comment=Open Freenet in the default browser

    Exec=xdg-open http://localhost:8888/

    Icon=freenet

    Terminal=false

    Type=Application

    Categories=Network;WebBrowser;

    ```


    After editing is complete, save progress and exit by clicking Save and then click
    X, or press CTRL + S and then click X.


    "Freenet" is now launch-able through the application menu.


    # ZeroNet


    Start by going to the Download page at:


    https://zeronet.io/


    Download Download for Linux 64bit


    Extract the contents and run the following command(s) in the terminal:


    ```

    cd Downloads/ZeroNet-linux-dist-linux64

    ```


    ```bash

    ./ZeroNet.sh

    ```


    Will start ZeroNet in the system default web browser.


    # ZeroNet .desktop Shortcut


    Start by running the following command(s) in the terminal:


    ```

    sudo xed /usr/share/applications/zeronet1.desktop

    ```


    ```ini

    [Desktop Entry]

    Type=Application

    Encoding=UTF-8

    Name=ZeroNet

    Comment=ZeroNet: Decentralized websites using BitTorrent network

    Exec=/home/username/Downloads/ZeroNet-linux-dist-linux64/ZeroNet.sh

    Icon=/path/to/your/icon

    Terminal=false

    StartupNotify=false

    Categories=Network;WebBrowser;

    ```


    After editing is complete, save progress and exit by clicking Save and then click
    X, or press CTRL + S and then click X.


    # Lokinet


    Start by running the following command(s) in the terminal:


    ```bash

    sudo curl -so /etc/apt/trusted.gpg.d/ossen.gpg https://deb.ossen.io/pub.gpg

    echo "deb https://deb.ossen.io $(lsb_release -sc) main" | sudo tee /etc/apt/sources.list.d/ossen.list

    sudo apt update

    sudo apt install lokinet

    ```


    Once installed lokinet can be started and stopped (respectively) by running one
    of the following command(s) in the terminal:


    ```bash

    systemctl start lokinet

    systemctl stop lokinet

    ```


    # Lokinet Start .desktop Shortcut


    Start by running the following command(s) in the terminal:


    ```bash

    sudo xed /usr/share/applications/lokinetstart1.desktop

    ```


    ```ini

    [Desktop Entry]

    Version=1.0

    Name=Lokinet Start

    GenericName=Lokinet

    Exec=systemctl start lokinet

    #Path=

    Icon=terminal

    Terminal=false

    Type=Application

    Categories=Network;Utility;

    StartupNotify=true

    ```


    After editing is complete, save progress and exit by clicking Save and then click
    X, or press CTRL + S and then click X.


    # Lokinet Stop .desktop Shortcut


    Start by running the following command(s) in the terminal:


    ```bash

    sudo xed /usr/share/applications/lokinetstop1.desktop

    ```


    ```ini

    [Desktop Entry]

    Version=1.0

    Name=Lokinet Stop

    GenericName=Lokinet

    Exec=systemctl stop lokinet

    #Path=

    Icon=terminal

    Terminal=false

    Type=Application

    Categories=Network;Utility;

    StartupNotify=true

    ```


    After editing is complete, save progress and exit by clicking Save and then click
    X, or press CTRL + S and then click X.

