    software around the limitations of a particular language, with type being purely
    text based and others having a graphical element.


    Zig is a good all rounder of a choice for a programming language with simplicity,
    meta-programming and incremental improvements at the core.


    Go is the google anointed and chosen open source programming language that focuses
    on, fantastic accessibility to learn and use in teams, baked-in agreements and
    healthy standards database.


