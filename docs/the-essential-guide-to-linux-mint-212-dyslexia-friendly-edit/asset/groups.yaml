    ## System Utilities


    System Utilities are application packages which are written, tested and distributed
    for the purpose of helping users clean their system.


    Qdirstat is the linux answer to the popular visual space program Windirstat which
    is built for the KDE Desktop and thus requires all the dependencies that go with
    it, and has a feature set including expandable file/folder lists.


    Psensor is a tool which assists the user in monitoring the temperature with built-in
    features like temperature color assignment and graphics card core/vram usage.


    Stacer is FOSS tool designed to help the user optimize and monitor their system
    to ensure top performance and stability, with additional features including process
    usage monitor, uninstaller and system cleaner.


    Bleachbit is a multi purpose disk cleaner, privacy manager and Linux Mint optimizer
    licensed under the GPL3 (Gnu General Public License 3).


    Soundconverter is audio file converter for the Cinnamon Desktop Environment, and
    which can run on any other DE, and ships with a tool-set such as fast multi-threaded
    conversion, automated renaming and clean crisp ui.


    Converse is batch image conversion tool for Linux Mint 21 that allows the user
    to convert, resize, flip and rotate up to a large number of pictures, with added
    tools like resolution scaling, multiple format possibilities and pdf file importing.


    GParted is a FOSS partition manager with the objective of making it easier to
    control partitions through a clean, straight forward and responsible interface.


    Hardinfo (or System Profiler and Benchmark) is a system information, profiler
    and benchmarking application that can list detailed information concerning almost
    every component in the host system.


    Gpustat is a command line based utility for Nvidia Graphics Cards which states
    the overall name of the gpu, core temperature, vram usage in total and amount
    of vram being across the system processes.


    Czkawka is a simple, fast, FOSS application which aims to assist the user in removing
    files they deem unnecessary from their computer, with a tool-set featuring no
    telemetry, gtk4 graphical front-end and vast array of tools available.


    ## Qdirstat


    Start by running the following command(s) in Software Manager:


    Qdirstat


    Click Qdirstat and Install.


    Otherwise, start by running one of the following command(s) in the terminal:


    ```

    sudo apt install qdirstat

    ```

