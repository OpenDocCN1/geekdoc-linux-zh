    \nOtherwise, start by running the following command(s) in the terminal:\n\n```bash\n\
    wget https://github.com/AppOutlet/AppOutlet/releases/download/v2.1.0/app-outlet_2.1.0_amd64.deb\n\
    sudo dpkg -i app-outlet_2.1.0_amd64.deb\n```\n\n## Python PIP\n\nStart by running\
    \ the following command(s) in the terminal:\n\n```bash\nsudo apt install pip\n\
    ```\n\n## Node.js NPM\n\n```bash\ncurl -fSL https://deb.nodesource.com/setup_16.x\
    \ | \\\nsudo -E bash -\nsudo apt update\nsudo apt install nodejs npm\n```\n\n\
    npm applications can be installed by running a command in the terminal, for example:\n\
    \n```bash\nsudo npm i -g typescript\n```\n\nThe above command would install the\
    \ tsc package.\n\n## NVM - Install & Change Node.js NPM Versions\n\nStart by running\
    \ the following command(s) in the terminal:\n\n```bash\ncd\ncurl -o - https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.3/install.sh\
    \ | bash\n```\n\nRestart computer to propagate changes.\n\nProceed to run the\
    \ following command(s) in the terminal:\n\n```bash\nnvm install 16\nnvm use 16\n\
    ```\n\nThe above commands would install a specific version of nodejs and npm,\
    \ with the below command telling the system (on a user level) to use a specific\
