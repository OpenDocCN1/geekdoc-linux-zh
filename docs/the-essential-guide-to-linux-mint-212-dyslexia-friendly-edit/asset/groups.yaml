    Image boards are online internet forums which through a spotlight on various topics
    through the mediums of text, sometimes with images and video relevant to the conversation
    happening within each thread. In some image boards, there are limits on how many
    images (or on total space taken) can be posted in each thread, leading to derision
    from other users or action from moderators.


    Pinry is a self-hosted image board that permits users to share, preserve and tag
    media astride descriptive notation of text.


    Tinypin is a minimalist take on hosting an image board, with far more of a focus
    on pictures compared to other media and text.


