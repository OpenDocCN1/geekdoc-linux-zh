    Comment=A description of Tinypin

    Exec=node ~/tinypin/main.js

    Path=~/tinypin

    Icon=terminal

    Terminal=false

    Type=Application

    Categories=Utility;

    StartupNotify=true

    ```


    After editing is complete, save progress and exit by clicking Save and then click
    X, or press CTRL + S and then click X.


    # YChanEx


    Start by navigating to the following web address:


    https://github.com/murrty/YChanEx/releases/tag/2.0


    Download YChanEx.exe


    Start by running the following command(s) in the terminal:


    ```bash

    sudo dpkg --add-architecture i386 && sudo apt update

    sudo mkdir -pm755 /etc/apt/keyrings

    sudo wget -O /etc/apt/keyrings/winehq-archive.key https://dl.winehq.org/wine-builds/winehq.key

    sudo wget -NP /etc/apt/sources.list.d/ https://dl.winehq.org/wine-builds/ubuntu/dists/jammy/winehq-jammy.sources

    sudo apt update && sudo apt install winehq-staging

    ```


    The latest wine-staging is 8.12 at time of writing, with the latest wine-mono
    version at 8.0, and the general observation appears to be a later version of wine-staging
    requires a later version of wine-mono, but that wine-mono''s version is usually
    a lower number than wine-staging.


    Proceed to navigate to the following web address:


    **https://dl.winehq.org/wine/wine-mono**


    Click 8.0.0 (or a later version if applicable for the installed wine-staging).


    Download wine-mono-8.0.0-x86.msi


    Proceed to run the following command(s) in the terminal:


    ```bash

    cd Downloads

    wine wine-mono-8.0.0-x86.msi

    wine YChanEx.exe

    ```


    # YChanEx .desktop Shortcut


    Start by running the following command(s) in the terminal:


    ```bash

    cd /usr/share/applications

    sudo xed ychanex1.desktop

    ```


    ```

    [Desktop Entry]

    Version=1.0

    Type=Application

    Name=YChanEx

    Comment=A cross-platform 4chan client

    Exec=wine

    "/home/username/YChanEx/YChanEx.exe"

    Icon=terminal

    Terminal=false

    StartupNotify=true

    Categories=Internet;

    ```


    After editing is complete, save progress and exit by clicking Save and then click
    X, or press CTRL + S and then click X.


    # Themes


    Themes for cinnamon consist of Window borders, Icons, Controls, Mouse Pointer,
    Desktop, plymouth, grub, sound and fonts, added to the system which give it more
    of a personalized feel, in addition to giving users the tools to create their
    own cinnamon themes.


    Windows borders details the process of downloading and installing a cinnamon compliant
    theme for Windows borders.


    Icons shows the process of manually downloading, installing and activating an
    icon theme.


    Controls shows how to install and apply a custom theme for the cinnamon controls
    that will change the color, rendering and presentation of said elements.


    Mouse Pointer shows how to install and apply a custom theme for the mouse pointer
    that will change the shape, color and effects.


    Desktop details how to download and change the desktop element of the cinnamon
    theme to another catch.


    Plymouth reveals the minutia of downloading, installing, a Plymouth theme, in
    addition to reloading the alternatives, setting the default theme, before reloading
    the initram-fs and updating grub.


    GRUB shows how to install a theme for the boot screen which shows up before Linux
    Mint 21 loads, listing Linux Mint 21, then other operating systems if enabled
    and present in addition to recovery options.


    ocs-url shows how to install the ocs-url deb package which makes installing themes
    far less laborious, and an example first run using the software at opendesktop.org.


    Sound relays the installation and activation process of sound themes, that while
    few in number are nonetheless great fun to adjust to ones own taste.


    Font shows the process of installing a new font on the user level through a graphical
    user interface, in addition to install a font at the system level through the
    command line.


