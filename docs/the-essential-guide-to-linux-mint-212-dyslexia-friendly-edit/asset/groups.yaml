    # 云办公软件


    随着远程办公成为办公人员、自由职业者和个人的选择，云办公解决方案已迅速发展，用于安全加密上传云端的文件和文件夹，同时在本地驱动器上进行备份。以下是提供的部分选项。


    Google Docs 编辑套件（Google Docs Editor Suite）是一套免费（提供付费升级）的云办公套件，包含 Google 表格（Google
    Sheets）、Google 幻灯片（Google Slides）、 Google 图画（Google Drawings）、Google 表单（Google
    Forms）、Google 站点（Google Sites - 结构化 Wiki 和网站创建工具）以及 Google Keep（备忘）。它与 Google
    Drive 服务紧密关联，后者提供 15 GB 的免费存储，Google Docs 文件可以通过 Google Drive 网页用户界面自动搜索。


    Microsoft 365 是一系列云办公套件和生产力软件，包含 Outlook（邮件）、Word（文字处理）、Excel（表格）、PowerPoint（幻灯片）、OneNote（笔记）、SharePoint（协作平台）、Microsoft
    Teams（商务通信）和 Yammer（企业社交网络）。此外，上述服务与 Microsoft OneDrive 紧密集成，后者提供 5GB 的免费云存储空间，并可在邮件和其他许多其他
    Microsoft 365 服务之间共享。


    Zoho Docs 是由 Zoho Corporation 提供的基于云的文档控制系统，提供了 Writer（文字处理）、Sheet（表格）、Show（幻灯片）、Mail（商务邮件）、Projects（项目管理），以及作为全合一办公套件的
    Zoho One 订阅服务。


    # Google Docs 编辑套件


    访问以下网页地址开始：


    https://drive.google.com/


    登录以访问 Google Drive。


    # Microsoft 365


    访问以下网页地址开始：


    https://www.office.com/


    登录以访问 Microsoft 365。


    # Zoho Docs


    访问以下网页地址开始：


    https://www.zoho.com/docs


    登录以访问 Zoho Docs。


    # AI 生成


    AI 及其生成内容的速度正以越来越快的速度扩张，硬件比以往任何时候都便宜，且工具随手可得。目前的趋势是现在就用 AI 玩玩看，以下是一些本地运行的选项。


    Easy Diffusion 是在 Linux 21 ''Vera'' 上安装 Stable Diffusion 最简单、最快的方法。它加载了一个基于 Web
    的界面，易于理解、操作快捷，并能清晰地显示生成的图片，还提供了在生成时显示图片的选项，此外用户界面中还有许多其他选项可用于自定义生成的图像。


    oaboabooga (文本生成) 旨在成为 AI 文本生成的 Easy Diffusion，重点在于一键操作、易于导入第三方文本到文本模型以及用于微调所用
    AI 众多选项，以便可靠地获得最佳体验。


    一组精选的负向提示词 (Negative Prompts)，这些都是我在生成一些著名古典艺术家的精彩诠释时使用的负向提示词，例如约翰·康斯特布画的玉米田、威廉·透纳描绘的肖像或帕罗·毕加索优雅地装饰西斯廷教堂的内部。


    Upscay 是一个 AI 驱动的免费开源图像放大器，能够增强低分辨率图像、以最小质量损失增加图片尺寸并具有跨平台兼容性。


    Stable Diffusion Web UI 是一种更注重用户的 AI 图像生成方式，某些项目需要手动安装而非自动获取，但硬币是具有更大的自定义选项、更详细的用户界面以及自行放大图像的能力。


    ChatGPT 桌面应用程序是一个第三方非官方客户端，它与官方 OpenAI ChatGPT 网站对接，同时增加了将 ChatGPT 历史导出为 png/pdf/markdown、常用快捷键以及文本转语音等功能。


