  - '[PAGE 243]


    # Firefox Based Web Browsers


    Firefox is aimed towards the home, educational and business markets, in addition
    to those whom prefer (or require) a far more reliable experience, with the trade-off
    compared to Firefox ESR being more frequent updates, lower feature lead time and
    greater compatibility with certain Firefox AddOns, and some of the features shipping
    with Firefox ESR being user choice when to update, greater stability and easier
    for network administrators to control.


    Waterfox is a FOSS fork of the Mozilla Firefox browser with the twist of a longer
    release cycle, greater stability in terms of less risky changes and more of a
    focus on speed and arrives with a tool-set featuring, client-side translation,
    limited data collection and privacy safeguards.'
  - '[PAGE 244]


    Mercury is a heavily modified version of the Firefox Web Browser that boasts up
    to a 20% quicker speed over Firefox, with even more of a user focus on privacy,
    choice and ease of use, with certain features being installing Firefox addon files
    directly, removal of telemetry and strengthened privacy patches.


    LibreWolf is a rather changed twist on Firefox with a renewed focus on the tenets
    of privacy, security and freedom, with an example of the features shipped such
    as, revoked telemetry, baked in private search providers and updates built from
    the latest available Firefox source code.


    Pale Moon is a rebuilt of Firefox with the aim to always be free to use and download,
    that comes with its own layout rendering engine called Goanna, with Pale Moon
    shipping with features including modern processor optimization, no telemetry and
    supported by a dedicated user community.'
  - '[PAGE 245]


    Basilisk is a fork of the pre-servo version of Mozilla Firefox, based in XUL and
    creation above the Unified XUL Platform (or UXP), and ships with features like
    full support for ECMAScript 6, compatibility with all NPAPI plugins and modern
    cryptographic usability.


    Mullvad Browser is a changing up of Firefox that can essential be boiled down
    to the TOR browser but without built in access to The Onion Router, made primarily
    for use with the Mullvad VPN service.'
