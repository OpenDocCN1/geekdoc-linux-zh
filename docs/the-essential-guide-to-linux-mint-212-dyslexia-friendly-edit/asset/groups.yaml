  - '[PAGE 196]


    # Code Editors


    Coding applications or IDE''s (Integrated Development Environments) are software
    used to create, manipulate, edit and debug code and source for programs.


    atom-ng which is a fork of the atom editor still actively developed by the developer
    of the thorium browser, and ships with provisions like electron based, super customization
    with the hack-able interface and designed with other Code Editors used as a benchmark.


    Visual Studio Code is the Code Editor designed in Electron and created by Microsoft,
    that is taking the IT world by storm and ships with features like Built-in Git,
    IntelliSense and Editor code Debugging.


    VSCodium is the Free and Libre fork of Visual Studio Code being a community led
    and freely licensed alternative to Visual Studio Code, with a feature-kit including
    no need to build from source, special build scripts and MIT licensed binaries.'
  - '[PAGE 197]


    Atom is an archived FOSS source code text editor customization by HTML, CSS and
    Javascript, with a tool-set including syntax highlighting, built on the electron
    framework and extending functionality through third-party packages.


    Geany is a powerful, lightweight and stable alternatives to other IDEs and Code
    Editors, through the many file-type supported, great community of hobbyist professionals
    and the small system footprint.


    Bluefish is the leading free and open source web editor that can create amazing
    HTML5, Javascript and CSS3 based applications, from a feature-set including full
    screen editing, In-line spell checker and unlimited undo/redo ability.'
