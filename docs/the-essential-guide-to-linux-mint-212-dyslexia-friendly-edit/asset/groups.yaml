    - Click Open.


    # Removing .desktop files


    Start by running the following command(s) in the terminal:


    ```bash

    cd /usr/share/applications

    sudo rm -r example.desktop

    sudo update-desktop-database

    ```


    # Modify Power Settings


    Start by running the following command(s) in the application menu:


    - Settings

    - Click Power.

    - Click Blank.

    - Select Minutes.

    - Click Automatic Suspend.

    - Click Off.


    # Cinnamon Applets/Spices


    Hundreds of pages of compatible Cinnamon Applets/Spices exist to boost the functionality,
    productivity and run user can have with their Cinnamon desktop and all the programs
    that interface with it.


    - Grouped Window List can be modified to display the window title of the application
    which is useful for identifying what is currently active.

    - Windows can be changed to ensure the Alt-tab switcher style is changed to display
    thumbnails only, making an easy way to identify what is happening in application.

    - Menu can be adapted to ensure the menu icon has a short description beside it
    so the button can be easily found.

    - Calendar can be reconfigured with a Custom Date Format so an AM or PM symbol
    is displayed to denote if the time shown is at the morning or night.


    # Grouped Window List


    Start by running the following command(s) in the application menu:


    - Text Editor

    - Right click Text Editor

    - Click Configure

    - Click Panel

    - Click the box next to Button label

    - Select Window Title

    - Click X.


    # Windows


    Start by running the following command(s) in the application menu:


    - Windows

    - Click Alt-Tab

    - Click the box next to Alt-Tab switcher style.

    - Select Thumbnails only.


    # Menu


    Right click the Menu applet button.


    - Click Configure

    - Click Panel

    - Click the box next to Text

    - Replace contents with: Start


    Ensure a space is present before the text, so the Text is bit more separated from
    the menu icon and apparent to the user.


    # Calendar Custom Date Format


    Right click the Calendar applet on the bottom right of the panel.


    Click Configure


    Click the box next to Date format


    Replace the contents with:


    ```

    :%M %p

    ```


    The custom date format will now display the hour and minute before AM or PM is
    shown denoting whether it is day or night.


    # Gnome Extensions


    Hundreds of pages of compatible GNOME 43 (This choice of Linux Mint 21.2 ''Vera''
    desktop environment), extensions exist to boost the functionality, productivity
    and run user can have in relation to the GNOME 43 desktop and all the programs
    that interface with it.


    GNOME Shell Integration Chrome Extension sets how to install the chrome extension
    which integrates with the gnome extension website, to install applications in
    a more graphical manner, rather than command line.


    GNOME Shell Integration Firefox Addon puts out how to install the firefox addon
    which is required by the gnome extension website, extensions through a graphical
    user interface.


    ArcMenu is about the extensions which changes the application menu from a mobile
    like interface, towards more of what one might think of a desktop application
    menu.


    ArcMenu Hotkey and Button Icon shows how to change the key used to operating ArcMenu
    and the button shown as the ArcMenu button.


    ArcMenu System Application Shortcuts details the adding of system application
    to ArcMenu.


    ArcMenu Custom Shortcuts gives an example of how to add custom application shortcuts
    to ArcMenu.


    Dash To Panel is about how to install an extension which gives a bottom panel
    (compatible with the other extensions in this chapter), that applications can
    be launched from and adds a sense of familiarity from other operating systems,
    such as Linux Mint 21, Linux Mint 20 and Windows 11.


    Dash To Panel Tray Font Size shows how to change the tray font size in the Dash
    To Panel settings.


    Tray Icons: Reloaded is about an extension which promotes a system tray experience
    more akin to familiar operating systems.


    Tray Icons: Reloaded Icon Limit shows how to change the tray icon limit to increase
    the number of tray icons shown.


    No overview at start-up details how to install the extension which removes the
    GNOME 43 overview function that appears at start up.

