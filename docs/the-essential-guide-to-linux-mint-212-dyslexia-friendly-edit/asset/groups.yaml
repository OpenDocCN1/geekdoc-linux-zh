    # Auto Mount Disk On Startup


    Start by running the following command(s) in the terminal:


    Disks


    - Select the disk with the volumes/partitions to be mounted.

    - Select the partition to be mounted.

    - Click the cog button (next to the Start or play button), which displays “Additional
    partition options”.

