    ```


    # Removing Port Rules (UFW)


    Start by running the following command(s) in the terminal:


    ```

    sudo ufw status numbered

    ```


    Delete the ufw port rule by running the following command(s) in the terminal:


    ```

    sudo ufw delete 214

    ```


    Substitute "214" for the number of the rule that is to be deleted, with the same
    going for the ports in the previous section, except with ports.


    Check the status of the removed port rule by running the following command(s)
    in the terminal:


    ```

    sudo ufw status

    ```


