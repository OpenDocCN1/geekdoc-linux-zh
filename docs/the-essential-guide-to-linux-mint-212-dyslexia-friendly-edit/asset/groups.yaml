    # Modern Gaming


    Modern Gaming is defined as video games/expansions/dlc released for the Win32,
    UWP or Linux Mint 21.2 ''Vera'' platforms in the last 20 Years, being able to
    either double click to play nativly or through WINE-Staging with dvvk, vkd3d proton,
    gamemoderun and separate command line arguments.


    WINE Staging is the compatibility layer between Win32 applications and Linux Mint
    21, which enables the running of said software not on a Win32 platform, with advantages
    of winehq-stable being, esync compatibility, more up to date without being unduly
    unstable and provides an avenue for developers to discuss their patches before
    integration into Wine Stable.


    WINE-Mono is a Free and Open Source Software implementation of the .net framework,
    being necessary for the running of many (if not all) Win32 applications operating
    using WINE Staging.'
