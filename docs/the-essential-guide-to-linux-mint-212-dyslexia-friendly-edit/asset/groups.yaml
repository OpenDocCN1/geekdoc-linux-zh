  - '[PAGE 440]


    # Cryptocurrency Wallets


    Cryptocurrency Wallets are software designed around functioning as a secure wallet
    for various types of Cryptocurrency, serving like an electronic version of a physical
    wallet that can be used to buy and sell goods and services from and to merchants
    which support payment in said cryptocurrency(s) and wallet(s).


    Bitcoin Core is the main wallet of choice for the storing and transfer of the
    Bitcoin cryptocurrency which features such as, decentralized nodes, no corrupt
    voting and extensive privacy options.


    Wasabi Wallet is FOSS non-custodial wallet compatible with the Bitcoin Cryptocurrency
    with added features like, avoid change privacy selections, anonymous credential
    scheme and affordable coin joining fees.


    Electrum is a Bitcoin wallet that aims for a mixture between zero trust transactions,
    being suitable for a wide variety of bitcoin users and quick to turn on.


    Exodus is a bitcoin and crypto wallet application capable of managing and swapping
    over 260 cryptoscoins and NFT’s letter the user purchasing cryptocurrency directly
    through the app with USD, EUR and GBP.'
