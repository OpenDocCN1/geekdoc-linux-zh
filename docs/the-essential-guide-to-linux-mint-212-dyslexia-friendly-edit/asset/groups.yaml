    # Cloud Office Suites


    Cloud Office solutions have really taken off with Remote working as the way for
    office employees, freelancers and personal beings to Secure their files and folders
    uploaded to the cloud, in addition to locally backing up on their drive, with
    a selection of the total offerings below.


    Google Docs Editor Suite is a free (with paid upgrades) Cloud Office Suite that
    includes Google Sheets (Spreadsheet), Google Slides (Presentations), Google Drawings
    (Diagram Building), Google Forms (Survey Administration) Google Sites (Structured
    Wiki and Web Creation Tool) and Google Keep (Note-taking), that is closely interlinked
    with the Google Drive service which offers 15 GB of free storage, with Google
    Docs files automatically searchable through the Google Drive web user interface.


    Microsoft 365 is a family of Cloud Office Suites and Productivity software, that
    ships with Outlook (Email), Word (Word Processing), Excel (Spreadsheets), PowerPoint
    (Presentations), OneNote (Note-taking), SharePoint (Collaborate Platform), Microsoft
    Teams (Business Communication) and Yammer (Enterprise Social Network). In addition,
    the above services are closely integrated with Microsoft OneDrive that offers
    5GB of Free cloud storage, that is shared between the email and a number of other
    Microsoft 365 services.


    Zoho Docs is a cloud based document control system from Zoho Corporation, that
    presents Writer (Word Processing), Sheet (Spreadsheets), Show (Presentations),
    Mail (Business Email), Projects (Project Management) in addition to the Zoho One
    subscription that is an All-In-One Office Suite.


