    # Hold Apt Packages


    ```

    sudo apt mark-hold package

    ```


    Holds a package to stop it from being updated

    when the sudo apt upgrade command is run.


    # Unhold Apt Packages


    ```

    sudo apt mark-unhold package

    ```


    Unmarshal a package thereby permitting it to be

    updated by sudo apt upgrade.


    # Show Held Packages


    ```

    sudo apt-mark showhold

    ```


    Shows all held or pinned packages in the system.


    # Package Verification


    ```

    sudo apt-key verify

    ```


    Verifies the integrity of and authenticates package repository keys.


    # Flatpak


    # Install Flatpak


    ```

    flatpak install flatpak

    ```


    Installs a flatpak from a remote repository


    # List Installed Flatpaks


    ```

    flatpak list

    ```


    Lists the installed flatpaks on the system.


    # Update Flatpaks


    ```

    flatpak update

    ```


    Upgrades all installed flatpaks to the latest available versions.


    # Run a Flatpak


    ```

    flatpak run flatpak

    ```


    Runs an installed flatpak application.


    # Uninstall Flatpak


    ```

    flatpak uninstall flatpak

    ```


    Removes an installed flatpak from the system.


    # Flatpak Remote Repository List


    ```

    flatpak remote-list

    ```


    Lists the flatpak remote repositories which have been added to the system.


    # Add Flatpak Remote Repository


    ```

    flatpak remote-add --if-not-exists name url

    ```


    Add a flatpak remote repository to the system.


    # Remove Flatpak Remote Repository


    ```

    flatpak remote-delete name

    ```


    Removes a flatpak remote repository.


    # Snap


    # Install Snap


    ```bash

    sudo snap install

    ```


    Install a snap application from the snap craft database.


    # List Installed Snaps


    ```bash

    sudo snap list

    ```


    Lists installed Snaps on the system.


    # Update Snaps


    ```bash

    sudo snap refresh

    ```


    Upgrade all snaps to the latest available versions.


    # Run a Snap


    ```bash

    snap run snap

    ```


    Runs an installed snap.


    # Remove a Snap


    ```bash

    sudo snap remove snap

    ```


    Remove an installed snap from the system.


    # Search for Snaps


    ```bash

    sudo snap find snap

    ```


    Searches the snapcraft database for any snaps matching the search term.


    # List Snap Information


    ```bash

    sudo snap info snap

    ```


    Gives detailed information about an installed snap on the system, such as installed
    version, publisher, license and description.


    # View Snap Connections


    ```bash

    sudo snap connections snap

    ```


    View the connections made by an install snap.


    # chown


    # Change File Ownership


    ```bash

    sudo chown user filename

    ```


    Changed the ownership of a file or folder to the given user in the command.


    # Change Ownership Recursively


    ```bash

    sudo chown -R user filename

    ```


    Changes the owner of a file or folder recursively to the given user in the command.


    # Change Ownership Specifying Group


    ```bash

    sudo chown user:group filename

    ```


    Changes the owner and group associated with a file or folder.


    # Change Ownership while Suppressing Any Error Messages


    ```bash

    sudo chown -f user filename

    ```


    Changes the ownership of a file or folder, with the

    suppression of error messages if the operation does not succeed.


    # Change Ownership with Details


    ```bash

    sudo chown -v user filename

    ```


    Changes the ownership of a file or folder, while

    giving various details on the process.


    # Change Ownership with Confirmation


    ```bash

    sudo chown -i user filename

    ```


    Asks for confirmation when changing ownership of

    a file or folder.


    # Change Ownership Preserving Timestamps


    ```bash

    sudo chown --preserve-timestamps user filename

    ```


    Changes file ownership while preserving timestamps


    # chmod


    # Change File Permissions


    ```bash

    sudo chmod permissions filename

    ```


    Changes the permissions on a file for folder.


    # Change Permissions Recursively


    ```bash

    sudo chmod -R permissions filename

    ```


    Change the permissions for a file or folder recursively.


    # Change File Permissions Numerically


    ```bash

    sudo chmod numbers filename

    ```


    Changes the permission for a file or folder on the basis of number, i.e. 755 so
    that only the owner can execute the file.


    # Change Numerical Permissions Recursively


    ```bash

    sudo chmod -R numbers filename

    ```


    Changes the permissions of a file or folder recursively using numbers.


    # Change Permissions with Details


    ```bash

    sudo chmod -v permissions filename

    ```


    Changes ownership of a file or folder while showing information concerning how
    the permissions have been changed.


    # Change Permissions with Confirmation


    ```bash

    sudo chmod -i permissions filename

    ```


    Changes ownership of a file or folder while asking confirmation for each change.


    # Change Permissions with Reference


    ```bash

    sudo chmod --reference=reference-file filename

    ```


    Changes ownership of a file or folder to match the permissions of a reference
    file.


    # dpkg


    # Install .deb package


    ```bash

    sudo dpkg -i file.deb

    ```


    Installs a .deb file.


    # Remove .deb Installed Package


    ```bash

    sudo dpkg -r filename

    ```


    Removes an installed package from the system.


    # Remove .deb Package with Config Files


    ```bash

    sudo dpkg -P filename

    ```


    Removes an installed package from the system, including configuration files.


    # List Installed Packages


    ```bash

    sudo dpkg -l

    ```


    Lists all packages installed on the host system, with version and description
    information.


    # List Files Installed By Package


    ```bash

    sudo dpkg -L package

    ```


    Lists all files installed by a certain package on the system.


    # Check Package Dependencies


    ```bash

    sudo dpkg -l packagename.deb

    ```


    Checks and lists the dependencies for a .deb package.


    # Reconfigure Installed Package


    ```bash

    sudo dpkg-reconfigure packagename

    ```


    Reconfig a package that has already been installed.


    # Fix Installs Broken by Installed Packages


    ```bash

    sudo dpkg --configure -a

    ```


    Fixes broken package installations on the system, by reconfiguring packages that
    were not properly installed or setup.


    # wget


    # wget url


    Downloads a file from the given url.


    # Change Output Filename


    ```bash

    wget -O filename url

    ```


    Changes the filename for the file that will be downloaded.


    # Background File Download


    ```bash

    wget -b url

    ```


    Downloads a file while permitting the user to continue operating the command line.

