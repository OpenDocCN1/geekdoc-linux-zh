    \n(echo; echo 'eval \"$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)\"') >> /home/username/.profile\n\
    eval \"$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)\"\n```\n\nMake sure to\
    \ change username to the name of the first user created during the installation\
    \ process.\n\n## Security\n\nSecurity is a prime concern among Linux Mint 21 users\
    \ with Linux Mint (and Linux Based Operating Systems in general) becoming more\
