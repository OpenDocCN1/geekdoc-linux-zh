    ```\n\n```bash\nsudo dpkg -i appimagelauncher_2.2.0-travis995.0f91801.bionic_amd64.deb\n\
    ```\n\n## AppOutlet\n\nStart by going to the following web address:\n\nhttps://github.com/AppOutlet/AppOutlet/releases\n\
