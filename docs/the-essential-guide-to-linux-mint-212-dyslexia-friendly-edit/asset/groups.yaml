    为了帮助追求理想的虚拟化环境，我编译了一套精良的工具，力求在这个辉煌的旅程中提供帮助。


    Virtualbox 是最知名且支持最好的虚拟化应用程序，由 Sun Microsystems 于 2007 年 1 月 17 日首次发布，现由 Oracle
    公司拥有（在写作时其最新版本为 Linux Mint 21 上的 7.0.8）。


    Virt-manager 是管理虚拟机的图形界面。


    ## Virtualbox


