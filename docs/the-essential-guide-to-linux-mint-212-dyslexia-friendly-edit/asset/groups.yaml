    ## 存档工具


    存档工具是专门用于保存用户喜爱网站存档的软件，以便在互联网连接断开时进行访问。


    ArchiveBox 是领先的明网（clearnet）自托管存档解决方案，专注于存档内容的收集、保存和查看体验。


    ## ArchiveBox


    首先在终端中运行以下命令：


