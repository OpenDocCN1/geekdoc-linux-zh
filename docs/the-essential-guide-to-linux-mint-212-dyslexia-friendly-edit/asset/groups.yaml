    # Linux Mint 21 Command Reference


    # Basic Commands


    # List Directory Contents


    ```bash

    sudo ls directory

    ```


    Lists the contents of the chosen directory.


    # Change Directory


    ```bash

    cd directory

    ```


    Changes directory to the following directory.


    # Go Up One Directory Tier


    ```bash

    cd ..

    ```


    Changes directory the next one higher up in the tier, for example instead of Downloads/text
    it would be Downloads.


    # List All Non-hidden File and Folders


    ```bash

    dir

    ```


    Lists all the current non-hidden files and folders in the directory which the
    command line is residing in.


    # List All Files and Folders Including Hidden


    ```bash

    ls -a

    ```


    Lists all the files and folders in a directory, including the ones which are hidden.


    # Make a Directory


    ```bash

    sudo mkdir directory

    ```


    Makes a directory inside of the current directory.


    # Remove Files


    ```bash

    sudo rm filename

    ```


    Removes the following file.


    # Removes Files and Folders Recursively


    ```bash

    sudo rm -r

    ```


    Removes the files and folders, in addition to all the files and folders within.


    # Copy a File to a Destination


    ```bash

    sudo cp filename destination

    ```


    Copies a file to the following destination.


    # Copy a Folder to a Destination


    ```bash

    sudo cp -R folder destination

    ```


    Copies a folder or file to the following destination.


    # Move a File or Folder to a Destination


    ```bash

    sudo mv filename destination

    ```


    Moves a file to the following destination.


    # Rename a File or Folder


    ```bash

    sudo mv filename newfilename

    ```


    Renames a file to the new following filename.


    # Display File Contents


    ```bash

    sudo cat filename

    ```


    Displays the contents of the following file.


    # List Current Directory Contents


    ```bash

    ls ..

    ```


    Lists the contents of the currently directory.


    # Apt


    # Update Package Lists


    ```bash

    sudo apt update

    ```


    Updates the local database of packages, by retrieving the latest information from
    the repositories in sources .list or .list files in /etc/apt.


    # Upgrade Installed Packages


    ```bash

    sudo apt upgrade

    ```


    Upgrade all applications to the latest versions, with care of any dependencies.


    # Full Upgrade Installed Packages


    ```bash

    sudo apt full-upgrade

    ```


    Upgrade all packages to the latest versions, including the removal of obsolete
    packages.


    # Package Search


    ```bash

    sudo apt search package

    ```


    Search for packages which match a keyword, that is put in the place of package.


    # Show Package Information


    ```bash

    sudo apt show package

    ```


    Shows details information concerning a package.


    # Install Packages


    ```bash

    sudo apt install package

    ```


    Install package from the software repositories, including any dependencies.


    # Remove Packages


    ```bash

    sudo apt remove package

    ```


    Removes a package from the system while preserving configuration files.


    # Purge Packages


    ```bash

    sudo apt purge package

    ```


    Remove a package from the system including the configuration files.


    # Auto Remove Packages


    ```bash

    sudo apt autoremove

    ```


    Removes any unused packages and their dependencies from the system.


    # List Installed Packages


    ```bash

    sudo apt list

    ```


    List all the packages installed on the system.


    # Add Repository


    ```bash

    sudo add-apt-repository repository

    ```


    Adds a repository to the sources.list.d folder.


    # Remove Repository


    ```bash

    sudo add-apt-repository -r repository

    ```


    Removes a repository from the sources.list folder.


    # Edit Sources File


    ```bash

    sudo apt edit-sources

    ```


    Opens the sources.list file in the default text editor.


    # Fix Broken Dependencies


    ```bash

    sudo apt install -f

    ```


    Tries to fix any broken apt dependencies through the installation of any missing
    or conflicting packages.


    # Retrieve Source Code for a Package


    ```bash

    sudo apt source package

    ```


    Downloads the source code to a package from the repository.


    # Upgrading the System


    ```bash

    sudo do-release-upgrade

    ```


    Start a distribution upgrade and moves the operating system to a newer released
    version.


    # Clean Packages


    ```bash

    sudo apt clean

    ```


    Clears the local package cache, with a focus on the removal of .deb file which
    are no longer required.


    # Auto Clean Packages


    ```bash

    sudo apt autoclean

    ```


    Performs automatic cleaning on the local package cache thereby removing any .deb
    files that are no longer required, all done without needing confirmation.

