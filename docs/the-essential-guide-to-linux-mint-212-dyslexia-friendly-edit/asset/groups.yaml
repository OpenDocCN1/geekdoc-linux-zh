    sudo gpg --dearmor -o

    /usr/share/keyrings/xanmod-archive-keyring.gpg

    echo ''deb [signed-by=/usr/share/keyrings/xanmod-archive-keyring.gpg] http://deb.xanmod.org

    lele main'' | sudo tee

