    and https://opendyslexic.org/


    # Ebook Readers


    E-Readers consists of applications which permit the reading and re-reading of
    books owned by the user or in the public domain within the users country.


    Calibre is FOSS powerful to and accessible Ebook manager that does nearly everything
    reading might want it to do including adjustable font size/type, full text search
