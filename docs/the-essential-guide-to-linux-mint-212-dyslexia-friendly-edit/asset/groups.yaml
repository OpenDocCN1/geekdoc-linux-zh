    Right click and empty space and click open in terminal.


    Proceed to run the following command(s) in the terminal:


    ```bash

    sudo cp -R WindozeXP /usr/share/plymouth/themes

    cd /usr/share/plymouth/themes

    sudo chown -R root WindozeXP

    sudo chmod -R 755 WindozeXP

    sudo update-alternatives --install /usr/share/plymouth/themes/default.plymouth
    default.plymouth /usr/share/plymouth/themes/"WindozeXP/Windoze XP.plymouth" 201

    ```


    sudo update-alternatives --config default.plymouth


    Press 1


    Press ENTER


    ```bash

    sudo update-initramfs -u

    ```


    ```bash

    sudo update-grub

    ```


    # GRUB


    Start by going to the following web address:


    https://www.gnome-look.org/p/2025649


    Click Download and GradientGuy.zip.


    Click Download and go to the Download directory.


    Extract the contents using archive manager (right click and extract) to the same
    directory, or run the following command(s) in the terminal:


    ```bash

    cd Downloads

    ```


    ```bash

    unzip GradientGuy.zip

    ```


    Copy GradientGuy to /boot/grub/themes/ by running the following command(s) in
    the terminal:


    ```bash

    cd /boot/grub/

    ```


    ```bash

    sudo mkdir themes

    ```


    ```bash

    sudo cp -R GradientGuy /boot/grub/themes

    ```


    Set the owner and permissions for the GRUB theme by running the following commands
    in the terminal:


    ```bash

    sudo chown -R root GradientGuy

    ```


    sudo chmod -R 755 GradientGuy


    Add the GRUB theme to /etc/default/grub by running the following commands in the
    terminal:


    sudo nano /etc/default/grub


    Go to the end of the file and type in:


    GRUB_THEME=/boot/grub/themes/GradientGuy


    Press CTRL + S and CTRL + X, to save and exit, respectively.


    Before running the following command(s) in the terminal to finish the Plymouth
    setup process.


    sudo update-grub


    Alternatively you could install grub customizer from Software or through the sudo
    apt install grub-customizer command in the terminal, however I have found Grub
    Customizer, can cause errors and corruption when installing Grub Themes that would
    otherwise work if installed manually.


