  mdcn: '

    Lutris 是一款开源自由（FOSS）游戏管理器和启动器，提供了一种更易用的方法来定位、安装和运行来自 Win32 平台（提供额外的运行器）的视频游戏（或其他软件）。在《魔兽世界：巨龙时代》纳格兰德（Nagrand）的测试中，通过
    Lutris 开启所有功能运行时，相比于仅在 Wine-Staging 上配合 DXVK、vkd3d-proton、gamemoderun 以及 Win32
    命令行参数运行 WoW，其帧数提升了 5 fps。


    手动安装 Lutris Proton-GE：手动下载、创建文件夹并将最新发布版本（撰本文时为当前版本）提取到 `lutris wine runners` 文件夹的过程。


    ProtonUp-QT 是一种通过图形用户界面为 Steam 和 Lutris 安装 Proton-GE（以及仅限 lutris 的 Wine-GE）的易用、快速且流线化的方法。


    ProtonUp-QT Lutris GE-Proton 安装详情说明了通过在 ProtonUp-QT 中点击几个按钮和框，在 lutris 中安装最新版本
    Proton-GE 的过程。


    ProtonUp-QT Steam GE-Proton 安装展示了如何通过几次按钮点击和框选，在 Steam 中安装各种版本的 Proton-GE。


    Steam 是全球最著名的数字分发平台，也是视频游戏和软件游戏、讨论和创作的终极目标。本节详细介绍了在 Linux Mint 21.2 ''Vera'' 上安装并访问这一奇妙的软件和视频游戏库是多么简单。


    启用 Steam Play（Enable Steam Play）详情说明了在 Steam 设置中启用 Steam Play 选项的过程，并将其设置为即使适用于未设置设置或未原生支持
    Steam Play 的游戏。


    手动安装 Proton-GE 展示了如何通过下载、创建新文件夹并提取内容，在 Steam 中手动安装最新版本的 Proton-GE，并在登录 Steam 后详细介绍了如何通用的将其应用到所有游戏中，以及如何针对单个游戏进行应用。


    Heroic Games Launcher 是一款免费开源软件（FOSS）游戏启动器和管理器，专注于 GOG（Good Old Games）和 Epic 游戏商店平台，其工具集包括单个游戏页面、平台版本选择，以及在不离开
    Heroic Games Launcher 的情况下访问 GOG/Epic 商店。


    Minigalaxy 是一个基于 Linux Mint 21 的 GOG 客户端，具有简单直观的界面，提供隐藏或显示已安装游戏的选项，此外还有更新游戏、安装
    DLC 以及使用系统 ScummVM/DOSBox 安装的功能。


    Gamehub 是 Linux Mint 21 上游戏的统一库，涵盖了 Steam、GOG（Good Old Games）、Humble Bundle 和
    itch.io 游戏库，包含下载/更新视频游戏、调整命令行参数以及通过 IGDB、Steam 和 SteamGridDB 获取元数据等功能。


    Xbox 云游戏（Xbox Cloud Gaming）是微软的以控制器为中心的在线视频游戏平台，本节展示了如何安装 Microsoft Edge 并通过它访问
    Xbox 云游戏，因为由于清晰度提升，Edge 在 Linux Mint 21 上提供了卓越的体验。


    Itch.io 是一个关于制作游戏的视频游戏和软件的在线数字分发平台，侧于独立开发，并给予每个开发者对其产品如何营销、销售和交付更大的选择权，开发者将获得每笔交易更大的份额（开发者占
    90%，itch.io 占 10%，但在撰本文时是可以调节的）。


    DXVK 是一个基于 Vulkan 的翻译层，适用于兼容的 GPU，允许通过 WINE-Staging 运行 Direct3D 9/10/11 应用，相比仅通过
    WINE-Staging 运行（即使启用了 gamemode），性能高得多。


    vkd3d-proton 是 VKD3D 的分支，除了是 DirectX 3D 12 应用的基于 Vulkan 的翻译层外，允许通过 WINE-Staging
    运行 DirectX 12 视频游戏和其他应用程序，比仅通过 WINE 本身运行性能更高；vk3d-proton 2.6 是我通常安装的版本，因为稍后的版本会导致《魔兽世界》、《暗黑破坏神
    4》和《西伯利亚：世界之前的序曲》无法启动。


    # WINE-Staging


    首先在终端中运行以下命令：


    ```bash

    sudo dpkg --add-architecture i386 && sudo apt update

    ```


    ```bash

    sudo mkdir -pm755 /etc/apt/keyrings

    ```


    ```bash

    sudo wget -O /etc/apt/keyrings/winehq-archive.key https://dl.winehq.org/wine-builds/winehq.key

    ```


    ```bash

    sudo wget -NP /etc/apt/sources.list.d/ https://dl.winehq.org/wine-builds/ubuntu/dists/jammy/wine-jammy.sources

    ```


    ```bash

    sudo apt update && sudo apt install winehq-staging gamemode winbind protobuf-compiler
    libprotobuf-dev libopusfile0 winetricks

    ```


    # WINE-Mono


    撰本文时最新的 wine-staging 为 8.9，最新的 wine-mono 版本为 8.0，通常观察结果是 wine-mono 的版本较后，但 wine-mono
    的版本通常低于 wine-staging。


    前往以下网页地址：


    https://dl.winehq.org/wine/wine-mono

    '
