    \ Anti-Virus, Anti-Rootkits, Sandbox and Host Intrusion Detectors.\n\nUFW (or\
    \ User Friendly Firewall) provides a more accessible and user friendly interface\
    \ to add various types of rules to the iptables firewall in the Linux Kernel,\
    \ with the addition of GUFW (Firewall Configuration) giving UFW a far more accessible\
    \ graphical layer to add, remove and otherwise control firewall rules, status\
    \ and profiles.\n\nClamAV and ClamTk are industry and server standard command\
    \ line and graphical tools used worldwide, with automatic updates and daily scans\
    \ available through the \"sudo crontab -e\" command.\n\nHost Intrusion Detectors\
    \ (HIDS) like OSSEC or Rootkit Detectors/rkhunter may scan the whole system, searching\
    \ out potential risks, monitoring file integrity. OSSEC is an ideal solution to\
    \ prevent unauthorized access by checking various logs, alerting the user to threats\
    \ detected.\n\nAnti-Rootkits like rkhunter can scan specific areas of the computer\
    \ for rootkits, which can attain high level and conceal their presence. Firejail\
    \ is a command line based software with the purpose of sandboxing applications,\
