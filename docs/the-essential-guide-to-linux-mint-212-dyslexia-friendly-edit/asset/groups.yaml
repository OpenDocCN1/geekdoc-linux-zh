    # Gnu 图像处理程序


    首先在软件管理器中运行以下命令：


    Gnu Image Manipulation Program


    点击 Gnu Image Manipulation Program 并安装。


    否则，请在终端中运行以下命令之一：


    ```

    sudo apt install gimp

    ```


    ```

    flatpak install flathub org.gimp.gimp.GIMP

    ```


    ```

    sudo snap install gimp

    ```


    # Pinta


    首先在软件管理器中运行以下命令：


    Pinta


    点击 Pinta 并安装


    否则，请在终端中运行以下命令之一：


    ```

    flatpak install flathub com.github.PintaProject.Pinta

    ```


    ```

    sudo snap install pinta

    ```


    # Krita


    首先在软件管理器中运行以下命令：


    Krita


    点击 Krita 并安装


    或者，请在终端中运行以下命令之一：


    ```

    sudo apt install krita

    ```


    ```

    flatpak install flathub org.kde.krita

    ```


    ```

    sudo snap install krita

    ```


    # Inkscape


    首先在软件管理器中运行以下命令之一：


    Inkscape


    点击 Inkscape 并安装


    否则，请在终端中运行以下命令之一：


    ```

    sudo apt install inkscape

    ```


    ```

    flatpak install flathub org.inkscape.Inkscape

    ```


    ```

    sudo snap install inkscape

    ```


    # Blender


    首先在软件管理器中运行以下命令之一：


    Blender


    点击 Blender 并安装


    另一方面，请在终端中运行以下命令之一：


    ```

    sudo apt install blender

    ```


    ```

    flatpak install flathub org.blender.Blender

    ```


    ```

    sudo snap install blender --classic

    ```


    # Darktable


    首先在软件管理器中运行以下命令之一：


    Darktable


    点击 Darktable 并安装


    或者，请在终端中运行以下命令之一：


    ```

    sudo apt install darktable

    ```


    ```

    flatpak install flathub org.darktable.Darktable

    ```


    ```

    sudo snap install darktable

    ```


    # Tuxpaint


    首先在软件管理器中运行以下命令：


    Tuxpaint


    点击 Tuxpaint 并安装


    否则，请在终端中运行以下命令：


    ```

    flatpak install flathub org.tuxpaint.Tuxpaint

    ```


    # 音频编辑器


    音频编辑器旨在创建、录制、编辑、混合以及其他处理音频文件，某些适用于通用音频编辑，另一些则用于创作音乐并为 DJ 进行了设置。


    Audacity 是 Linux Mint 21 社区中最广为人知的音频编辑器，能够处理、编辑和创建大多数音频格式，其功能集包括录制实时音频、将模拟声音格式转换为数字格式以及通过社区制作的扩展用户体验。


    Ardour 是播客主、音乐家和作曲家中广为人知且受尊敬的软件，它提供了行业领先的工具集，并对 PCI/USB/Firewire 声卡设备提供广泛支持。


    MIXX 介绍了 Linux Mint 21 上著名的免费 DJ 软件，允许操作员使用数字音频文件创建实时混音，并提供节拍循环、主同步和多格式支持等功能。


    # Audacity


    首先在软件管理器中运行以下命令：


    Audacity


    点击 Audacity 并安装。


    另一方面，请在终端中运行以下命令之一：


    ```

    sudo apt install audacity

    ```


    ```

    flatpak install flathub org.audacityteam.Audacity

    ```


    ```

    sudo snap install audacity

    ```


    # Ardour


    首先在软件管理器中运行以下命令：


    Ardour


    点击 Ardour 并安装。


    或者，请在终端中运行以下命令之一：


    ```

    sudo apt install ardour

    ```


    ```

    flatpak install flathub org.ardour.Ardour

    ```


    # MIXXX


    首先在软件管理器中运行以下命令：


    ```

    MIXXX

    ```


    点击 MIXXX 并安装


    否则，请在终端中运行以下命令之一：


    ```

    sudo apt install mixxx

    ```


    ```

    flatpak install flathub org.mixxx.Mixxx

    ```


    # 视频编辑器


    视频编辑器用于视频文件的创建、编辑以及其他处理，并具有导入和导出各种视频文件的能力。


    （注：原文中存在大量重复段落，已清理并仅保留核心描述）。

    '
