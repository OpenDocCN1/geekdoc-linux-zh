    \n首先在终端中运行以下命令：\n\n```bash\n/bin/bash -c \"$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/all/HEAD/install.sh)\"\
    \n(echo; echo 'eval \"$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)\"') >> /home/username/.profile\n\
    eval \"$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)\"\n```\n\n请确保将 `username`\
    \ 更改为安装过程中创建的第一个用户的名称。\n\n## 安全\n\n安全是 Linux Mint 21 用户首要考虑的问题，随着 Linux Mint（以及一般的基于\
    \ Linux 的操作系统）变得越来越流行，用户越来越需要通过安全软件保护计算机免受恶意活动，例如防火墙、防病毒软件、反 Rootkit 工具、沙箱和主机入侵检测。\n\
    \nUFW（或用户友好防火墙）提供了一个更易用、友好的界面，用于向 Linux 内核中的 iptables 防火墙添加各种类型的规则，而 GUFW（防火墙配置）则为\
