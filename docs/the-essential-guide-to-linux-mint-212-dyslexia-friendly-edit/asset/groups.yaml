  - '[PAGE 457]


    # Classical Gaming


    Classical Gaming is defined by video games that are of a certain age and/or platform,
    that to play them on a modern operating system, such as Linux Mint 21, required
    additional software packages to be installed so that a cool, crisp and featherlight
    experience can be had.


    ScummVM is a piece of software that permits users to run classical graphic adventure
    games, provided they own and/or can rightfully use the game files found, with
    ScummVM adding features such as save game states, enhanced modes using the ui
    from later games in a series and multi-platform compatibility.


    DOSBox is a command line program that by the use of paths, command-line arguments
    and text file editing, can play games and run non-game software built specifically
    for DOS machines, with the DOSBox tool-set including adjusting cpu speed through
    cycles, works with most test/visual modes for DOS and simulation of null modems
    through usage of the TCP/IP protocol and IPX network tunneling.'
