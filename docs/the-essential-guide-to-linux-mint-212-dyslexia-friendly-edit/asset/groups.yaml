    If you must send electronic messages, consider sending them in less spoken languages
    like, Sumerian, Old Chinese or Luwian, with links to the respective resources
    listed below:


    https://www.amazon.co.uk/s?k=sumerian+language


    https://www.amazon.co.uk/s?k=old+chinese+language


    https://www.amazon.co.uk/s?k=luwian+language


    And ensure to encrypt the messages using GPG and send through an instant messaging
    service with end-to-end encryption.


    It could be argued that speaking a language different from the native tongues,
    such as Sumerian, would not look looked upon as dis-favorable or raise as much
    suspicions as it used to, due to the greater cultural diversity, and tolerance,
    of society at large.'
  - '[PAGE 152]


    # Thick Duct Tape


    Ideally this should be done with profession help, and not be done, unless you
    do not want to look at yourself when accidentally switching to a front facing
    camera.


    Start by going to the following web address:

    https://www.amazon.co.uk/s?k=thick+duct+tape


    The prices range from around $4 to $49 depending on the size, thickness and amount
    of rolls in each orders.


    Once a roll (or more) has arrived, proceed to measure out the height and width
    of the camera, sensors and microphone (including unused or bezel space).


    Make notes of the measurements required.


    Carefully cut out the tape(s) and gently apply them to the Camera, Sensors and
    Microphone, while being aware that, at one point, either on purpose or by accident,
    by the owner, user or someone else, the tape will come off, and may damage the
    Camera, Sensor or Microphone.'
  - '[PAGE 153]


    # Drivers


    Drivers are the applications responsible for correct, relevant and secure communication
    between the physical (and virtual) hardware components of the computer and operating
    system, and the different parts of the computer and operating system itself.


    AMD which covers the drivers needed for the proper operation of the AMD graphics
    cards, with both 64 bit and 32 bit support needed for various gaming programs,
    such as Steam, WINE-Staging and Proton.


    radeontop which is about the command line based program (of the same name) that
    shows the usage rates for various parts of the AMD Graphics Card, including total
    vram usage, overall graphics usage and shader clock.


    amdgpu-fan shows a utility that will control the speed and rate of which the speed
    increases of the fans on AMD graphics cards.


    amdgpu-fan.yml shows an example way of how to set up and configure a .yml that
    can help manage the fans speeds and rates they speed up.'
  - '[PAGE 154]


    Nvidia that shows how to install the most up-to-date available Nvidia drivers
    for Linux Mint 21.2 ‘Vera’, with the added bonus of the latest vulkan libraries.


    Intel Arc which shows the most accessible way to being driver support of the latest
    Intel graphics to the most used Linux Based Operating System.


    Realtek puts across an easier way of installing the drivers necessary to ensure
    the proper running, of the most popular wired and wireless network adapters in
    the world.


    All Linux Mint Printer Drivers is as it says, with the most forward way shown
    in how to install every printer driver available to Linux Mint 21.2 ‘Vera’'
  - '[PAGE 155]


    # AMD


    AMD drivers are already included in the linux kernel with more update drivers
    already included with Linux Mint 21, however even more up to date AMD graphics
    card drivers can be installed through the experiment oibaf ppa.


    Start by running the following command(s) in the terminal:


    ```

    sudo dpkg --add-architecture i386 && sudo apt update

    sudo add-apt-repository ppa:oibaf/graphics-drivers

    sudo apt update

    sudo apt upgrade

    ```'
  - '[PAGE 156]


    # radeontop


    Start by running the following command(s) in the terminal:


    ```

    sudo apt install radeontop

    ```


    radeontop is a tool mainly used for measuring the graphics pipe and vram usage
    on AMD graphics cards, with other features for example, utilization graphs, shader/memory
    clock speed and texture addresses.'
  - '[PAGE 157]


    # amdgpu-fan


    Start by running the following command(s) in the terminal:


    ```

    sudo apt install pip

    ```


    ```

    sudo pip install amdgpu-fan

    ```


    the argument will install pip packages under sudo, that will become system packages,
    and may clash or break the system if or when the Linux Mint 21.2 ''Vera'' versions
    of said packages are required.'
  - '[PAGE 158]


    # Amending amdgpu-fan.yml


    sudo xed /etc/amdgpu-fan.yml


    Amend the amdgpu-fan.yml file with the following:


    speed_matrix: # -[temp(*C), speed(0-100%)]


    +   - [0, 0]


    +   - [30, 15]


    +   - [50, 30]


    +   - [70, 70]


    +   - [90, 100]


    After editing is complete, save progress and exit by clicking Save and then click
    X, or press CTRL + S and then click X.'
  - '[PAGE 159]


    # amdgpu-fan Systemd Service


    Start by running the following command(s) in the terminal:


    sudo xed /etc/systemd/system/amdgpu-fan.service


    Amend the amdgpu-fan.service file with the following:


    [Unit]


    Description=Service for controlling amdgpu fan.


    After=syslog.service


    [Service]


    Type=simple


    User=root


    ExecStart=/usr/local/bin/amdgpu-fan


    Restart=always


    [Install]


    WantedBy=multi-user.target'
- md: '

    After editing is complete, save progress and exit by clicking Save and then click
    X, or press CTRL + S and then click X


    Proceed to run the following command(s) in the terminal:


    - sudo systemctl daemon-reload

    - sudo systemctl enable amdgpu-fan.service

    - sudo systemctl start amdgpu-fan.service

    - sudo systemctl status amdgpu-fan.service


    # Nvidia


    Start by running the following command(s) in the application menu:


    Driver Manager


    Click the switch next to nvidia-driver-535 (recommended)


    Click Apply Changes.


    Click Restart.


    Otherwise, start by running the following command(s) in the terminal:


    ```bash

    sudo dpkg --add-architecture i386 && sudo apt update && sudo apt install nvidia-driver-535
    libvulkan1 libvulkan1:i386

    ```


    Proceed to restart the computer.


    # Intel Arc


    Intel Arc Graphics Drivers come standard with the Linux Kernel 6.2, with the Linux
    Mint 21.2 ‘Vera’ default kernel being 6.1, a custom kernel such as Liquorix or
    Xanmod will be required for an Intel Arc Graphics card to run with any speed or
    efficiency.


    Liquorix and Xanmod are covered under the System Settings Chapter.


    # All Linux Mint Printer Drivers


    Start by running the following command(s) in the terminal:


    ```bash

    sudo apt update && sudo apt install printer-driver-all

    ```


    # Office Suites


    Office Suite are a collection of applications that assist in Office and Productivity
    tasks, with the basic office suite consisting of at least a Word Processor (LibreOffice
    Writer), Spreadsheet (PlanMaker) and presentation (Stage).


    The leading light in the Linux Office software space is of course, LibreOffice,
    the open source office suite, made by The Document Foundation and the community,
    which includes Writer (Word Processor), Calc (Spreadsheet), Impress (Presentation),
    Draw (Graphics Editor), Math (Mathematics) and Base (Database Management).


    Another notable entry is SoftMaker FreeOffice, created by SoftMaker Software GmbH,
    ships with TextMaker (Word Processor), PlanMaker (Spreadsheet) and Presentations
    (Presentation).


    A further contender for the Linux Office crown is Calligra, an open source office
    suite made by KDE e.V., and arrives as standard with Words (Word Processor), Sheets
    (Spreadsheet), KEXI (Visual database creator), Karbon (Vector Drawing), Plan (Project
    Management) and Stage (Presentations).


    Finally is OpenOffice, the most well known open office suite and put out by The
    Apache Foundation, and possible to run on the same system as LibreOffice, fitted
    out with Writer (Word Processor), Calc (Spreadsheet), Impress (Presentation),
    Draw (Vector Graphics), Math (Mathematical Formulae) and Base (Database Management).


    All of these office suites have similar or greater features compared to the other,
    and it will come down to what the user feels is best for them.


    # LibreOffice


    Start by running the following command(s) in Software Manager:


    LibreOffice


    Click LibreOffice and Install


    Otherwise, start by running one of the following command(s) in the terminal:


    ```bash

    sudo apt install libreoffice

    ```


    ```bash

    flatpak install flathub org.libreoffice.LibreOffice

    ```


    ```bash

    sudo snap install libreoffice

    ```


    # SoftMaker FreeOffice


    Start by going to the following web address:

    https://www.freeoffice.com/en/download/applications


    Click Download (Under Linux).


    Click .deb (To download latest version).


    Double Click softmaker-freeoffice-2021_1062-01_amd64.deb and Install


    # Calligra


    Start by running the following command(s) in Software Manager:


    Calligra


    Click Calligra and Install


    Otherwise, start by running the following command(s) in the terminal:


    ```bash

    sudo apt install calligra

    ```


    # OpenOffice (AppImage)


    Start by going to the following web address:


    https://github.com/area-of-dev/OpenOffice.AppImage/releases/tag/latest


    Download OpenOffice.AppImage


    Double Click if using AppImageLauncher or right click and set to executable.


    On the other hand, start by running the following command(s) in the terminal:


    ```bash

    wget https://github.com/area-of-dev/OpenOffice.AppImage/releases/download/latest/OpenOffice.AppImage

    sudo chmod -R +x OpenOffice.AppImage

    ./OpenOffice.AppImage

    ```


    # OpenOffice (AppImage) Desktop Shortcut


    Start by running the following command(s) in the terminal:


    ```bash

    sudo xed /usr/share/applications/openoffice1.desktop

    ```


    Amend openoffice1.desktop with the following:


    ```ini

    [Desktop Entry]

    Version=1.0

    Type=Application

    Name=OpenOffice

    GenericName=Office Suite

    Exec=./Downloads/OpenOffice.AppImage

    Icon=openoffice

    Terminal=false

    Categories=Office;WordProcessor/

    MimeType=application/vnd.oasis.opendocument.text;application/

    ```


    After editing is complete, save progress and exit by clicking Save and then click
    X, or press CTRL + S and then click X.


    # Email Clients


    Email clients are used to send and receive messages.


    Thunderbird is a widely used email client that supports multiple accounts and
    extensions.


    Evolution is a powerful email client with calendar, tasks, and contacts management.


    Mail is a simple and fast email client for the GNOME desktop.


    Geary is a modern email client with a focus on simplicity.

    '
  mdcn: '


    编辑完成后，点击保存并点击 X 以保存进度并退出，或者按 CTRL + S 然后点击 X。


    请在终端中运行以下命令：


    - sudo systemctl daemon-reload

    - sudo systemctl enable amdgpu-fan.service

    - sudo systemctl start amdgpu-fan.service

    - sudo systemctl status amdgpu-fan.service


    # Nvidia


    首先在应用程序菜单中运行以下命令：


    驱动程序管理器 (Driver Manager)


    点击 nvidia-driver-535 (推荐) 旁边的开关


    点击应用更改 (Apply Changes)。


    点击重启 (Restart)。


    否则，在终端中运行以下命令：


    ```bash

    sudo dpkg --add-architecture i386 && sudo apt update && sudo apt install nvidia-driver-535
    libvulkan1 libvulkan1:i386

    ```


    重启电脑。


    # Intel Arc


    Intel Arc 图卡驱动随 Linux 内核 6.2 标准配置，而 Linux Mint 21.2 ‘Vera’ 的默认内核为 6.1，因此需要如 Liquorix
    或 Xanmod 等自定义内核才能让 Intel Arc 显卡以任何速度或效率运行。


    Liquorix 和 Xanmod 包含在系统设置章节。


    # 所有 Linux Mint 打印机驱动


    首先在终端中运行以下命令：


    ```bash

    sudo apt update && sudo apt install printer-driver-all

    ```


    # 办公套件


    办公套件是一组辅助办公和生产力任务的应用程序，基础办公套件至少包含一个文字处理器 (LibreOffice Writer)、电子表格 (PlanMaker)
    和演示文稿软件 (Stage)。


    Linux 办公软件领域的领军者无疑是 LibreOffice，这是一个由 The Document Foundation 和社区开发的开源办公套件，它包含了
    Writer（文字处理器）、Calc（电子表格）、Impress（演示文稿）、Draw（图形编辑器）、Math（数学）和 Base（数据库管理）。


    另一个值得关注的选择是 SoftMaker FreeOffice，它由 SoftMaker Software GmbH 创建，附带 TextMaker（文字处理器）、PlanMaker（电子表格）和
    Presentations（演示文稿）。


    Linux 办公之冠的另一位竞争者是 Calligra，这是一个由 KDE e.V. 开发的开源办公套件，作为标准配置附带 Words（文字处理器）、Sheets（电子表格）、KEXI（可视化数据库创建器）、Karbon（矢量绘图）、Plan（项目管理）和
    Stage（演示文稿）。


    最后是 OpenOffice，它是最著名的开源办公套件，由 Apache Foundation 发布，可以在与 LibreOffice 相同的系统中运行，配备
    Writer（文字处理器）、Calc（电子表格）、Impress（演示文稿）、Draw（矢量图形）、Math（数学公式）和 Base（数据库管理）。


    所有这些办公套件都具有相似或更功能，取决于用户认为哪种最适合自己。


    # LibreOffice


    首先在软件管理器中运行以下命令：


    LibreOffice


    点击 LibreOffice 并安装 (Install)


    否则，在终端中运行以下命令之一：


    ```bash

    sudo apt install libreoffice

    ```


    ```bash

    flatpak install flathub org.libreoffice.LibreOffice

    ```


    ```bash

    sudo snap install libreoffice

    ```


    # SoftMaker FreeOffice


    首先访问以下网址：

    https://www.freeoffice.com/en/download/applications


    点击 Download (位于 Linux 下)。


    点击 .deb (下载最新版本)。


    双击 softmaker-freeoffice-2021_1062-01_amd64.deb 并安装 (Install)


    # Calligra


    首先在软件管理器中运行以下命令：


    Calligra


    点击 Calligra 并安装 (Install)


    否则，在终端中运行以下命令：


    ```bash

    sudo apt install calligra

    ```


    # OpenOffice (AppImage)


    首先访问以下网址：


    https://github.com/area-of-dev/OpenOffice.AppImage/releases/tag/latest


    下载 OpenOffice.AppImage


    如果使用了 AppImageLauncher 则双击，或者右键点击并设置为可执行。


    另一方面，在终端中运行以下命令：


    ```bash

    wget https://github.com/area-of-dev/OpenOffice.AppImage/releases/download/latest/OpenOffice.AppImage

    sudo chmod -R +x OpenOffice.AppImage

    ./OpenOffice.AppImage

    ```


    # OpenOffice (AppImage) 桌面快捷方式


    首先在终端中运行以下命令：


    ```bash

    sudo xed /usr/share/applications/openoffice1.desktop

    ```


    使用以下内容修改 openoffice1.desktop：


    ```ini

    [Desktop Entry]

    Version=1.0

    Type=Application

    Name=OpenOffice

    GenericName=Office Suite

    Exec=./Downloads/OpenOffice.AppImage

    Icon=openoffice

    Terminal=false

    Categories=Office;WordProcessor/

    MimeType=application/vnd.oasis.opendocument.text;application/

    ```


    编辑完成后，点击保存并点击 X 以保存进度并退出，或者按 CTRL + S 然后点击 X。


    # 电子邮件客户端


    电子邮件客户端用于发送和接收消息。


    Thunderbird 是广泛使用的电子邮件客户端，支持多帐户和扩展。


    Evolution 是一个强大的电子邮件客户端，具有日历、任务和联系人管理功能。


    Mail 是为 GNOME 桌面设计的简单快速的电子邮件客户端。


    Geary 是一个以简单为重点的现代电子邮件客户端。


    '
