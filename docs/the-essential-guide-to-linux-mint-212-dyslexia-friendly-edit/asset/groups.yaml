    Sparrow 是一款针对那些重视个人财务主权人士的比特币钱包，它关注安全性、隐私性和易用性，展示了一个基于标签页的浏览器钱包，从零开始构建以支持 PSBT（部分签名比特币交易）和强加密。


    # Bitcoin Core


