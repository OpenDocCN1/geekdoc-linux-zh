- md: '

    # Introduction


    Backup as often as one wishes, taking into account the accessibility, usability
    and storage needs required.


    "The Essential Guide to Linux Mint 21.2: Dyslexia-friendly Edition is an all-encompassing
    masterpiece that guarantees a seamless experience in installing, configuring,
    and safeguarding your Linux Mint system. Crafted for both novices and seasoned
    users, this exceptional book leaves no stone unturned, providing you with comprehensive
    knowledge to kickstart your Linux Mint journey and optimize its performance to
    perfection."


    Begin your expedition by familiarizing yourself with the fundamental aspects,
    including the essential preparation for a flawless installation process. Navigate
    through the chapters as they expertly guide you through the intricacies of acquiring
    the Linux Mint 21 ISO and creating a bootable USB drive using acclaimed tools
    such as Brasero, CDBurnerXP, and Ventoy.


    Immerse yourself in the captivating installation process of Linux Mint 21.2, where
    every step is meticulously explained. Learn about vital elements like keyboard
    layout, multimedia codecs, partitioning, and the art of user creation. Push the
    boundaries further by exploring advanced installation options, encompassing the
    setup of an EFI partition and fine-tuning the SWAP space configuration.


    Elevate the fortification of your Linux Mint system as you delve into the realm
    of security. Unleash the potential of firewalls by expertly configuring them with
    UFW and GUFW. Harness the power of ClamAV and ClamTk antivirus software to safeguard
    your system against threats. Master the art of sandboxing applications with Firejail
    and Firetools, and bolster your security measures by implementing DNS over TLS.


    But wait, there''s more! Embrace the diverse horizons of software management techniques.
    Embark on a journey of perpetual updates using both graphical and command-line
    methods, customize your software sources, and effortlessly install applications
    with an array of package managers like APT, Flatpak, Snap, and AppImage.


    Discover a treasure trove of indispensable software applications and utilities
    catering to your every need. Seamlessly handle office tasks with remarkable office
    suites, conquer your email communications with exceptional email clients, and
    unveil your creative prowess with powerful image and video editors. Embrace the
    world of coding with top-notch code editors, conquer the internet with unrivaled
    web browsers, and fortify your digital fortress with cutting-edge password managers.
    Elevate your multimedia experience with exceptional audio and video players, optimize
    your system with an array of indispensable utilities, communicate instantly with
    seamless instant communication tools, and redefine remote working with unparalleled
    applications.


    Irrespective of whether you are a casual user or a tech virtuoso, "The Essential
    Guide to Linux Mint 21.2: Dyslexia-friendly Edition" arms you with the wisdom
    and expertise required to harness the true potential of your Linux Mint system.
    Dive into a realm of enlightenment with detailed explanations, practical examples,
    and invaluable tips, making this book an indispensable resource for mastering
    Linux Mint and seizing full control of your computing experience.


    The time for hesitation is over. Unleash the boundless potential of Linux Mint
    today. Acquire your copy of "The Essential Guide to Linux Mint 21.2: Dyslexia-friendly
    Edition" and embark on an extraordinary journey, unearthing the power and versatility
    concealed within this renowned Linux distribution.


    # Linux Mint Install Preparation


    Linux Mint Install Preparation is all about covering the bases, in terms of prep
    work, before an installation of Linux Mint 21.2 ‘Vera’ can take place.


    Linux Mint System Requirements will show an example host system that will meet,
    or preferably, exceed the minimum system requirements for Linux Mint 21.2 ‘Vera’
    and World of Warcraft, under my own “Realistic Gaming Productivity” system requirements.


    Downloading Linux Mint 21.2 ISO will cover the choices of ISO’s available for
    the Linux Mint 21.2 ISO, and where to Download the Linux Mint 21.2 Cinnamon edition.


    Making a Linux Mint 21.2 USB gives an overview of the whole process from finding
    a program to use with the ISO, depending on that operating system, with a focus
    on Ventoy for Linux Based Operating Systems and Windows 11, including how to install
    Ventoy on the USB Drive and how to put the ISO on the Ventoy partition on the
    USB Drive.


    Setting BIOS to Boot From USB concerns the process of restarting the computer
    and pressing the correct button combination so the motherboard BIOS can be reached
    and the boot order can be changed and the Ventoy USB drive put at the forefront,
    with added features like SecureBoot being disabled to avoid signing MOK keys,
    which has never caused my computers harm.


    Booting into the Linux Mint 21.2 ISO sets out the plan for loading up the Linux
    Mint 21.2 ISO through the Ventoy GRUB and (afterwards) Linux Mint 21.2 ISO graphical
    interface.


    # Linux Mint System Requirements


    Start by taking note of your computers personal specifications, to see if it matches
    up with my “Realistic Gaming Productivity” system requirements for Linux Mint
    21.2 which are:


    - Processor: 9th Gen Intel / 1st Gen Ryzen Quad or 4 Core CPU and Above (64 bit)

    - Video: Nvidia GTX 1060 6GB / AMD, Intel Equivalent

    - Memory: 16GB (32GB Preferred)

    - Storage: 256GB SSD with DRAM Cache

    - Display: 1080p Resolution


    System requirements were inspired by the Linux Mint 21 System Requirements at
    https://linuxmint.com/faq.php (accessible by expanding “What are the system requirements
    to run Linux Mint?”, in addition to the World of Warcraft system requirements
    at https://us.battle.net/support/en/article/76459.


    # Downloading Linux Mint 21.2 ISO


    For the purposes of this book, the Linux Mint 21.2 Cinnamon Edition ISO will be
    used, with GNOME 43, because it is the desktop environment that I use everyday
    and I am most familiar with.


    Start by going to the following web address:


    https://linuxmint.com/edition.php?id=302


    Click a hyperlink under MIRROR next to the LOCATION that is closest, more convenience
    or otherwise preferable, to download linuxmint-21.2-cinnamon-64bit.iso.


    It should be noted the filename of the ISO will change as new point releases,
    in the product lifecycle of Linux Mint 21, arrive, for example, linuxmint-21.3-cinnamon-64bit.iso
    would be the iso file name of the 21.3 point release of Linux Mint 21.2 Cinnamon
    Edition.


    # Making a Linux Mint 21.2 USB


    A Type A USB drive should be used due to the greater likelihood of available in
    terms of port availability on the host computer, in addition to the higher price
    of Type C USB drivers and lesser chance of USB-C ports being available on the
    users computer.


    However if a Type C USB drive and associated ports are available, they may be
    utilized instead due to a perceived greater read and write speed that is technically
    spoken of by the USB-C standard.


    While it is possible to burn the ISO to a DVD as has been the case for a number
    of years, it is not something I would recommend on account of the lower read and
    write speeds associated with DVD’s (Digital Versatile Disc).


    Brasero is a FOSS (Free and Open Source Software) disk burning application for
    Linux Mint 21 and other Linux Based Operating Systems, that provides once proprietary
    standard features such as, burning an ISO image, extending functionality through
    plugins with a built-in cover editor as standard.


    CDBurnerXP is a free Win32 based alternative to proprietary disc burning applications
    like Ashampoo Burning Studio 24, Nero Burning Rom and Cyberlink Power2Go, that
    includes features such as, creating boot-able disks, ISO converter and data verification
    after burning process.


    Ventoy is a FOSS (Free and Open Source Software) application designed to create
    a boot-able drive out of a USB or external SSD for the purposes of copy over images
    files, ISO for this book, and booting into them via a GRUB menu, with all the
    compatible images being ISO/WIM/IMG/VHD(x) and EFI.


    Copyright 2023 by Morgan Partridge

    '
