    Make Files and Folders Immutable explains the process of making files and folders
    immutable so they cannot be changed (unless the drive or volume is deleted), until
    they are made immutable again.


    .avif Compatibility details the process of installing a program that will enable
    the viewing of .avif image files, and set that program to be default for that
    format.


    Removing .desktop files proposes the idea of removing certain .desktop files to
