  md: '# Cinnamon Applets/Spices


    Hundreds of pages of compatible Cinnamon Applets/Spices exist to boost the functionality,
    productive and fun a user can have with their Cinnamon desktop and all the programs
    that interface with it.


    Grouped Window List can be modified to display the window title of the application
    which is useful for quickly identifying what is currently active in that window.


    Windows can be changed to ensure the Alt-tab switcher style is changed to display
    thumbnails only, making for an easily way to visible identify what is happening
    in that application window.


    Menu can be adapted to ensure the menu icon has a short description beside it
    so the button can be more easily found.


    Calendar can be re-coded with a Custom Date Format so an AM or PM symbol is displayed
    to accessibly denote if the time shown was at the morning, or at night.'
