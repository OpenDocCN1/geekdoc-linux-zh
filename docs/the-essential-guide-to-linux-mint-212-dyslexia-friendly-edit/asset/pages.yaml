  md: '# /etc/ssh/ssh_config


    Proceed to run the following command(s)(s) in the terminal:


    ```

    sudo x /etc/ssh/ssh_config

    ```


    Go to the end of ssh_config (usually line 54) and put in the following line:


    ```

    PermitRootLogin no

    ```


    Unless the PermitRootLogin is already present, in which case the following line
    should be changed from:


    ```

    PermitRootLogin yes

    ```


    To:


    ```

    PermitRootLogin no

    ```


    After editing is complete, save progress and exit by clicking Save and then click
    X, or press CTRL + S and then click X.'
