  md: '# Video Players


    Video (or Multimedia) players are software packages with the ability to play back
    Video files with or without audio track, and generally ship with the ability to
    Play, Pause, Skip/Next with any of the video/audio files loaded.


    VLC is a Free and Open Source Software (FOSS) multimedia, or Video, player that
    has become the gold standard of video and general media playing throughout the
    Linux Mint 21 landscape, with a feature-set including compatibility with the widest
    variety of media file formats, subtitle synchronization and hardware decoding.


    Parole is the media player which is included with the XFCE Desktop Environment,
    and can be installed on any other DE with focuses on an initiative and minimalism
    inspired interface, low system resource footprint and avoid-ability of skips,
    with a great breadth of features as in-window playlist popover, centered shortcut
    keybindings window and greater stability when playing video files.'
  merge: -1
  pgno: 275
- img_proc: true
  md: 'SMPlayer is a graphical front end for the command line mpv protocol (which
    in itself can play a wide variety of media files quite well) with the tool-set
    including wide ranging support for video and audio formats, highly customizable
    look and greatly advanced filters.


    Haruna is a FOSS Video Player built on the Qt/QML platforms and runs using the
    libmpv library for the KDE Desktop Environment, and can be used with any other
    DE, and showcasing abilities like toggle playlist with mouse over, configurable
    shortcuts and integration with KDE Plasma.


    Dragonplayer is a simplified Video Player built for the KDE Plasma DE, but which
    is compatible with the other major Desktop Environments, and comes with standard
    features such as layer and framework independent, simplified interface and subtitle
    support.'
