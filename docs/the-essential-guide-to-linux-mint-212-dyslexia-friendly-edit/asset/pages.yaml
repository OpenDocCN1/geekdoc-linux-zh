  md: '# Air Gapping


    Air Gapping is the process by which a computer is removed from all connections
    to the external internet, and is either totally disconnected from all other electronic
    devices, or is connecting to a set amount (that are also disconnected from the
    internet), with famed examples of Air Gapping including:


    Unplugging Network Cables is the idea that removing the internet (or Ethernet
    cable as it can be more commonly known) from the relevant port(s), usually on
    the back of computer, and covering that port (or ports) over with a piece of insulated
    tape.


    Removing USB and PS2 Devices is all about removing any unnecessary or extraneous
    devices which use a USB or PS2 port from the computer, to minimize the likely-hood
    of infected hardware.


    Taking Away Internal Networking concerns the removal (where possible) of internet
    network cards and the attached antennas.'
