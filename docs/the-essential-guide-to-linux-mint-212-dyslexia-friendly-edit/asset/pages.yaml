- img_proc: true
  md: 'ZeroNet is a decentralized block chain internet network that uses the same
    cryptography as Bitcoin, and the BitTorrent network in an effort to exchange information
    among each peer in the P2P network.


    Lokinet is an implementation of the Low Latency Anonymous Routing Protocol (LLARP
    for short), which is a 3 layers onion protocol.


    Nostr is a decentralized network protocol protocol with a focus on open, globally
    distributed and simplified media.


    Lume nu is an ambitious instant chat client powered by the Nostr protocol, that
    has the ability for users to send text, pictures and link YouTube videos to each
    other.


    More-speech is a self contained messaging client that runs over the Nostr protocol
    with the ability to send electronic text-based message from one user to another.


    Gossip is a messaging application that runs over the Nostr protocol with some
    differences to the alternatives being following beings at the relays, automatic
    relay connection and avoiding hazardous web technologies.'
  merge: -1
