  md: '# Creating OSSEC Systemd Service


    Start by running the following command(s) in the terminal:


    ```

    sudo xed /etc/systemd/system/ossec.service

    ```


    Amend the file with the following contents:


    ```

    [Unit]

    Description=OSSEC service

    After=network.target

    [Service]

    Type=simple

    ExecStart=/var/ossec/bin/ossec-control start

    ExecStop=/var/ossec/bin/ossec-control stop

    TimeoutStartSec=0

    Restart=on-failure

    StartLimitInterval=0

    [Install]

    WantedBy=multi-user.target

    ```'
