    amounts of businesses large and small realizing the majority of workers can be
    just as productive (if not more so) at, compared to working in the office.


    Zoom is a global communications platform that lets users talk to each other by
    way of video, audio, phone and chat, being used by organizations around the world
    to help manage remote worker teams.


    Slack is about getting beings together working on all the right activities, while
    automating certain tasks to the most possible leaving more time over to get that
    project finished on time and under budget.


    Citrix Workspace is a digital workspace platform from Citrix Systems, which can
    be used to access a wide variety of files and programs from different sources
    through a centrally installed application or via a Web Browser.'
