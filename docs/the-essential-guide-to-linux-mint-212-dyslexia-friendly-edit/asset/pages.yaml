  md: '# APT


    The APT package lists and repositories can be updates by running the following
    command(s) in the terminal: sudo apt update


    APT packages can be upgraded by running the following command(s) in the terminal:


    sudo apt update && sudo apt upgrade -y


    APT packages can be removed or uninstalled by running the following command(s)
    in the terminal: sudo apt remove


    Package of the APT variety can be purged by running the following command(s) in
    the terminal: sudo apt purge


    Individual .list files from 3rd party repositories can be removed by running the
    following command(s):


    cd /etc/apt/sources.list.d


    sudo rm -r xanmod.list && sudo apt update


