  md: '# System Utilities


    System Utilities are application packages which are written, tested, built and
    distributed for the purpose of helping users clean, fix and perform other miscellaneous
    tasks relating to the operation, health and welfare of Linux Mint 21.2 ‘Vera’
    and the host computer they are using.


    Qdirstat is the linux answer to the popular visual hardware space display program
    Windirstat, but without all of the dependencies of the k4diristat which is built
    for the KDE Desktop and thus requires all the packages that go with it, and has
    a feature set including expandable file/folder lists, visual display of hard drive
    space and location path of the selected file or folder.


    Psensor is a tool which assists the user in monitoring the temperature (and speeds)
    of various components of hardware in the computer, with built-in features like
    automatic temperature graph color assignment, components temperature and graphics
    card core/vram usage.'
  merge: -1
  pgno: 282
- img_proc: true
  md: 'Stacer is FOSS tool designed to help the user optimize and monitor their system
    to help ensure top performance and stability, with additional features including
    process usage monitor, uninstaller and system cleaner.


    Bleachbit is a multi purpose disk space cleaner, privacy manager and Linux Mint
    21 optimizer licensed under the GPL3 (or Gnu General Public License 3 to give
    it the non-abbreviated name).


    Soundconverter is main audio file converter for the Cinnamon Desktop Environment,
    and which can run on any other DE, and ships with a tool-set such as fast multi-threaded
    conversion, automated renaming and clean crisp ui.


    Converse is batch image conversion tool for Linux Mint 21 that allows the user
    to convert, resize, flip and rotate up to a large number of pictures, with added
    tools like resolution scaling, multiple format possibilities and pdf file importing.


    GParted is a FOSS partition manager with the objective of making it easier to
    control partitions through a clean, straight forward and responsible interface.'
  merge: -1
  pgno: 283
- img_proc: true
  md: 'Hardinfo (or System Profiler and Benchmark) is a system information, profiler
    and bench-marking application for Linux Mint 21.2 ‘Vera’ that can list detailed
    information concerning almost every components in the host system, before bench-marking
    the computer and various ways and bench-marking it against other stored profiles.


    Gpustat is a command line based utility for Nvidia Graphics Cards which states
    the overall name of the gpu, core temperature, vram usage in total and amount
    of vram being across the system processes.


    Czkawka is a simple, fast, FOSS application which aims to assist the user in removing
    files they deem unnecessary from their computer, with a tool-set featuring no
    telemetry, gtk4 graphical front-end and vast array of tools available.'
  merge: -1
