    ```

    sudo get -O /etc/apt/keyrings/winehq-archive.key

    https://dl.winehq.org/wine-builds/winehq.key

    ```


    ```

    sudo get -NP /etc/apt/sources.list.d/

    https://dl.winehq.org/wine-builds/ubuntu/dists/jam

    my/wine-jammy.sources

    ```


    ```

    sudo apt update && sudo apt install winehq-staging gamemode winbind protobuf-compiler

    libprotobuf-dev libopusfile@ winetricks

    ```'
