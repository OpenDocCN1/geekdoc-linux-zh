  md: '# System Settings


    With Linux Mint 21.2 ''Vera'' being open source, imagination, coding ability and
    ambition really are the limits to what a being can do with this marvelous operating
    system, with a few suggestions of how to augment the Linux Mint 21.2 ''Vera''
    experience.


    Night Light Time and Temperature sets how to activate the Night Light feature
    of the Cinnamon through redshift and set it to an automatic schedule based on
    the users location.


    Intel Motherboard Sound Possible Fix gives a couple of example on how one might
    fix a sound popping issues with Intel Motherboards.


    AMD Motherboard Sound Possible Fix gives a couple of example on how one might
    fix a sound popping issues with AMD Motherboards.


    Xanmod Kernel details how to install the latest Xanmod Kernel that tracks with
    main branch of the linux kernel, before adding on a a large amount of fixes and
    patches.'
  merge: -1
  pgno: 326
- img_proc: true
  md: 'Liquorix Kernel kernel tracks slightly behind the latest main branch of the
    Linux Kernel to ensure greater compatibility with certain hardware drivers.


    Environment Variables Example gives some assistance on how to set up variables
    system-wide to make command line operations more streamlined.


    Set as Background shows how to add a background on Linux Mint 21.


    NTFS mount_options.conf gives an example of a conf file that helps to give more
    reliability, when mounting volumes that are partitioned on a drive, using the
    NTFS file system.


    Auto Start Applications shows how to make software auto load at startup using
    Startup Applications and through the command line.


    Auto Mount Disk On Startup tells how to auto mount disks and volumes on startup
    using the Disks application.


    Keybindings sets out how to modify a default theme to turn the flashspot transparent
    and set the commands for direct screenshots of application windows and the full-screen.'
