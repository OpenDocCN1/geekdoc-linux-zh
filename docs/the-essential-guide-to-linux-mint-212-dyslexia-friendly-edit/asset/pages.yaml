- img_proc: true
  md: '# Security


    Security is a prime concern among Linux Mint 21 users with Linux Mint (and Linux
    Based Operating Systems in general) becoming more popular, increasing the need
    for said users to safeguard their computers against malicious activity, shielded
    with a bulwark of security software, such as Firewalls, Anti-Virus, Anti-Rootkits,
    Sandbox and Host Intrusion Detectors.


    UFW (or User Friendly Firewall) provides a more accessible and user friendly interface
    to add various types of rules to the iptables firewall in the Linux Kernel, with
    the addition of GUFW (Firewall Configuration) giving UFW a far more accessible
    graphical layer to add, remove and otherwise control firewall rules, status and
    profiles.


    ClamAV and ClamTk are industry and server standard command line and graphical
    antivirus tools used on servers worldwide, with automatic updates and daily scans
    available with cron-jobs through the "sudo crontab -e" command.'
  merge: -1
  pgno: 99
- img_proc: true
  md: 'Anti-Rootkits or Rootkit Detectors/Hunters may scan the whole, or specific
    areas of the computer for rootkits, which can attain high level status in a system
    and conceal their presence, with the prime counters to this being chrootkit that
    searches out and logs potential risks, and rkhunter that can quietly seek and
    destroy rootkits.


    Host Intrusion Detectors (or HIDS) help prevent and mitigate unauthorized access
    by checking through logs, analyzing file integrity, monitoring various OS policies,
    seeking out rootkits, alerting the user(s) to a malicious presence and capable
    responding to threats detected, with OSSEC being an ideal tool in this field due
    to their open source solution, which is used in a variety of industries from Insurance,
    Medical and National/State/Local Government.


    Firejail is a command line based software with the express purpose of sandboxing
    or separating application(s), from the rest of the system so that malicious intent,
    is kept to the files within the container.'
  merge: -1
  pgno: 100
- img_proc: true
  md: 'Firetools is a graphical user interface (or GUI) for firejail that offers more
    accessibility to the end-user in terms of selecting, running and adjusting the
    permission for each sandbox.


    DNS Security is especially needed to help mitigate the possibility of being the
    subject of the middle attacks, which hijack your dns connection mid stream or
    compromise the ISP DNS server, with TLS being the acceptable starting point.


    hosts files in this context are utilized to block or redirect access to a list
    of specified domains to 0.0.0.0, which is a blank page.


    hosts.deny files are utilized to block access to the host system, or computer,
    from a list of addresses.


    superhosts.deny files get pushed to become a hyper charged version of a hosts.deny
    file, that stops a list of addresses from accessing the hosts computer.'
  merge: -1
  pgno: 101
- img_proc: true
  md: '# UFW (User Friendly Firewall)


    Start by running the following command(s) in the terminal:


    ```

    cd /etc

    ```


    This will send the command line to the /etc directory in the root filesystem.


    Process to delete the existing uwf directory by running the following command(s)
    in the terminal.


    ```

    sudo rm -r ufw gufw && sudo apt purge ufw gufw

    ```


    UFW has been removed from the /etc folder, and ufw gufw being purged from the
    system before being installed again.


    Run the following command(s) in the terminal


    ```

    sudo apt install ufw

    ```


    Enable the User Friendly Firewall by running the following command(s) in the terminal:


    ```

    sudo ufw enable

    ```


    Check the status of UFW by running the following command(s) in the terminal: sudo
    ufw status'
