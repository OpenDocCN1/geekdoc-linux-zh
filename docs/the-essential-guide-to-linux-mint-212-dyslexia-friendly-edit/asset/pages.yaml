  md: '# Individual Privacy


    Privacy is becoming an increasingly relevant topic with each passing day, as the
    trackers, malicious actors and business entities, whom collect, buy and sell gathered
    data, grows immensely, with steps being required to preserve even a meager amount.


    One way to self host a search-engine that is thanks to Searx, which respects users
    privacy, supports customization and relies on other search engines to provide
    results.


    Hiding data and information in Images, with OpenStego can be a fun medium of storage,
    for example a picture of an orange could hide the shopping list.


    Anonymizing ones Internet Connection through mediums such as, TOR, I2P and Freenet
    can be a fun (albeit slow) way to explore the net with more of a safe, secure
    and free vibe.


    Another way is through usage of a VPN service like Proton VPN that will encrypt
    your connection with the OpenVPN protocol.'
  merge: -1
