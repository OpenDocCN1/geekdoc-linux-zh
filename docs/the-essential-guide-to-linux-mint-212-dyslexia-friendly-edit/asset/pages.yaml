  md: '# Command Line Update


    Start by running the following command(s) in the terminal:


    ```

    sudo apt update

    ```


    This should update package and repository lists with the latest available packages
    from the Linux Mint and Ubuntu repositories.


    Any errors with the sources.list or .list in the /etc/apt/sources.list.d folder
    should be apparent at this stage.


    Proceed to run the following command(s) in the terminal:


    ```

    sudo apt upgrade

    ```


    This should present a confirmation screen with the package updates available,
    which packages will be updated/removed, with a Y/N (or Ctrl + C) preferred to
    proceed.


    Remember to read which packages are going to be modified, added or removed, so
    a fair track is kept of how the Linux Mint 21 system and third party packages
