  md: '# Display Managers


    Display (or login) managers is a graphical user interface that assists the user
    in logging into the system in a more accessible and appealing manner.


    LightDM is a lightweight Free and Open Source Software display manager, capable
    of running across multiple desktops, able to use greeters to make the user interface
    and supports wayland.


    SDDM is a display manager that is mainly used with (and supported for) the KDE
    Plasma Desktop Environment, and which can be used with any DE though most likely
    without many themes supported, due to most of them requiring KDE Plasma dependencies.


    LXDM is the DM (Display Manager) of choice for the LXDE operating system and by
    association is very lightweight, being capable of utilization by any of the DE’s
    previously discussed.


    Slim is a desktop independent display manager, that by the very nature of the
    software can work with any DE, carrying a great combination of features, visual
    appeal and light on resource usage.'
  merge: -1
