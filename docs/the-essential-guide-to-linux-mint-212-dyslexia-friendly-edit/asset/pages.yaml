  md: '# Suspending Root Account


    After setting the first user created during the installation of Linux Mint 21.2
    ‘Vera’ to the sudo group, there is little requirement to keep the or root account
    active.


    Fristly the root account will be redirected to /usr/sbin/nologin from /bin/bash,
    that will cause the root account login access to be suspended, while keeping the
    root account around for purposes such as file ownership and running background
    processes like the scheduled ClamAV scan, will be covered further on.


    In addition the “PermitRootLogin” variable will be added (or amended) to the /ssh/ssh_config
    under /etc, with the value of “NO”, will help to stop malicious actors from breaking
    into the system by direct usage of the system root account.


    Furthermore the /etc/shadow will be amended so a “!” is present at the beginning
    of the first line, that may effectively stop stop access to the root account by
    locking it up.'
  merge: -1
  pgno: 64
- img_proc: true
  md: '# /usr/sbin/nologin


    Start by running the following command(s) in the terminal:


    sudo xed /etc/passwd


    Change the following line (usually line 1) from:


    root:x:0:0:root:root:/bin/bash


    To:


    root:x:0:0:root:root:/usr/sbin/nologin


    After editing is complete, save progress and exit by clicking Save and then click
    ×, or press CTRL + S and then click ×.'
  merge: -1
