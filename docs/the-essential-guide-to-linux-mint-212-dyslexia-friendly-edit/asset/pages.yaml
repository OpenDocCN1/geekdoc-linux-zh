  md: '# Installing Custom UFW Rules


    Start by running the following command(s) in the terminal:


    ```

    cd /etc

    ```


    Proceed to remove the ufw folder by running the following command(s) in the terminal:


    ```

    sudo rm -r ufw gufw

    ```


    Make sure to remove ufw from the system by running the following command(s) in
    the terminal:


    ```

    sudo apt purge ufw

    ```


    Install User Friendly Firewall by running the following command(s) in the terminal:


    ```

    sudo apt install ufw

    ```


    Remove the UFW folder by running the following command(s) in the terminal:


    ```

    sudo rm -r ufw

    ```


    Open the terminal where the custom ufw folder is located and run the following
    command(s) in the terminal:'
  merge: -1
  pgno: 104
- img_proc: true
  md: '```

    sudo cp ufw /etc

    ```


    Navigate to the /etc folder by running the following command(s) in the terminal:


    ```

    cd /etc

    ```


    Set the owner of the ufw folder to root by running the following command(s) in
    the terminal:


    ```

    sudo chown -R root ufw

    ```


    Set the permissions of the ufw folder by running the following command(s) in the
    terminal:


    ```

    sudo chmod -R 755 ufw

    ```


    This means only the root or sudo user can run it.


    Start ufw by running the following command(s) in the terminal:


    ```

    sudo ufw enable

    ```


    Check the status of the newly installed firewall and profiles by running the following
    command(s) in the terminal:


    ```

    sudo ufw enable

    ```


    All of the newly added firewall rules should now be ready, enabled and working.'
  merge: -1
