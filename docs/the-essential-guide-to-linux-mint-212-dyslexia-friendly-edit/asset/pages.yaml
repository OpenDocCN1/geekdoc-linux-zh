  md: '# Instant Communication


    Instant Communication tools are software the permits the free flowing conversation
    between 2 or more parties with the ability (depending on the client) of sending
    other media such as pictures, videos or sound files, to one another or in a group
    chat.


    Discord is the premier and world renowned Instant Communication software that
    permits users of said platform to communicate with each other using, text, voice
    calls, video calls in addition to the sharing of media files among each other,
    in group chats or larger communities known as servers.


    ICQ is the new version of the once venerable Israeli Instant Messaging Client,
    now owned and developed by Yandex, with the added capabilities of turning audio
    messages into text, quick smart replies and local connection in-case of internet
    failure.


    Skype is the Microsoft attempt to dominate the Instant Communication space by
    giving users the ability to communicate with each other using visual and text
    based methods, on top of limited file sharing capabilities.'
  merge: -1
  pgno: 295
- img_proc: true
  md: 'Session is a low metadata, privacy focused, instant message client that aims
    to provide end-to-end encryption for the text and picture messages sent between
    the various users of said platform.


    Pidgin is one of the primary methods of instant text based communication on Linux
    Mint 21, with a wide variety of plugins available that permit communication through
    steam, discord and Skype.


    Signal is encrypted instant communication software that has provisions for text,
    voice, image based communication, in addition to the ability for sending files
    between different users and through group messaging.


    Telegram is an instant messaging client that offers cloud-based, encrypted and
    centralized instant messaging of text, audio video clips and group chats where
    up to the minute information about the world events are professed.'
  merge: -1
