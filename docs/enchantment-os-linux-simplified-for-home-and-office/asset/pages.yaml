  md: '# # Software Boutique


    There is an abundance of software available for Ubuntu MATE and some people find
    that choice overwhelming. The Boutique is a carefully curated selection of the
    best-class applications chosen because they integrate well, complement Ubuntu
    MATE and enable you to find what you''re looking for, install one of the software
    centers to explore your computing experience.


    If you can''t find what you''re looking for, install one of the software centers
    to explore the complete Ubuntu software catalog.


    ![](img/746a5cdaf3de849af71e213250fb281f_18_0.png)


