    # ## 3D chess for X11


    Get Screenshot


    3 dimensional Chess game for X11R6. There are three boards, stacked vertically:
    96 pieces of which most are the traditional chess pieces with just a couple of
    additions; 26 directions in which to move. AI isn''t wonderful, but provides a
    challenging enough game to play.


