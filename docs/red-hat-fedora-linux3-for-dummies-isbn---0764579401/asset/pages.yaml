    # ## History of the World, er, Linux: Part 1


    In the beginning of computerdom (said in a booming thunder voice), the world was
    filled with hulking mainframes. These sleful beasts endured large corporations;
    required a special species of ultra-nerds to keep them happy; and ate up chunks
    of space, power, and money. Then came the IBM PC and Microsoft, and the world
    changed. Power to the people, sort of.'
