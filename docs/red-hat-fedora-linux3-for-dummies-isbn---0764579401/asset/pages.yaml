- pgno: 78
  md: '# Chapter 4: Getting to Know Fedora Core


    You can also use the Fedora Core User Manager to delete an existing user account.
    Click the user name and then the Delete button, and the account is immediately
    removed. Be careful and sure of what you want to do — Fedora Core doesn''t ask
    you to confirm the account deletion. Fortunately (in this case), the account''s
    home directory is left intact (not deleted); you can go back and re-create the
    account if necessary.


    # Using the text-based useradd command


    Many system administrators prefer using text-based (CLI) tools and utilities.
    Text-based tools are relatively easy to use after you become familiar with them.
    They also tend to save time if you''re doing administration jobs simultaneously
    — you don''t have to work between multiple windows — instead, you just use a series
    of commands.


    These steps describe how to use the useradd program to create a user account:


    +   1. Open a GNOME Terminal window by clicking the GNOME Menu button and choosing
    System Tools: Terminal.

    2. Log in as root by entering this command:

    su

    3. Enter the root password when prompted.

    4. Type useradd name at the command prompt, where name is the login name for the
    new login account.


    ```

    su

    ```


    To change the system assigned password for the account you''ve created, enter
    the following command:


    ```

    passwd name

    ```


    +   5. Type a password when you''re prompted and press Enter.


    This step changes the password of the new account, which had a default password
    assigned to it by the useradd command in Step 4. (What good is a password if you
    use the default?)


    +   6. Type your password again.


    Fedora Core asks you to retype your new password to ensure that the password you
    typed is the one you thought you typed. If you don''t retype the password exactly
    as you did the first time (which is easy to do because it doesn''t appear on-screen),
    you have to repeat the process.

    Fedora Core updates the password for the new login.'
  merge: -1
  img_proc: true
