- pgno: 344
  md: '# Appendix C


    # Filing Your Life Away


    In This Appendix


    +   - Finding out all about Linux files and directories

    - Navigating the Linux file system

    - Creating, moving, copying, and destroying directories and files

    - Changing file ownership and permissions


    In this appendix, you step boldly through the Linux file and directory structure.
    Don''t worry: Linux may live a structured life, but it''s still flexible. With
    a little bit of introduction, you can quickly get the hang of the Linux way of
    life.


    We also introduce you to files, subdirectories, paths, and the root directory.
    You also show the way home — your home directory. After you''re oriented to the
    Linux files-and-directories structure, we show you how to make some changes, such
    as how to copy and move files and directories and how to — eek! — destroy them.


    # Getting Linux File Facts Straight


    Linux files are similar to Unix, DOS, Windows, and Macintosh files. All operating
    systems use files to store information. Files allow you to organize your stuff
    and prepare your information. For example, the text that makes up this appendix
    is stored in a file — as is every other chapter, each in its own file. Follow
    the bouncing prompt as we make short work of long files.


    # Storing files


    We assume that you know that a file is a discrete collection of information identified
    by a filename — that Linux can store multiple files in directories, as long as
    the files have different names. (Linux stores any files with the same name in
    different directories.)'
  merge: -1
  img_proc: true
- pgno: 345
  md: '# 326 Part VI: Appendices


    Wonderful or not, Linux filenames can be as long as 256 characters. filenames
    can contain uppercase and lowercase letters (also known as mixed case), numbers,
    and special characters, such as underscores (_), dots (.), and hyphens (-). Because
    filenames can be composed of mixed-case names, and because each name is distinct,
    these names are case sensitive. For example, the names FILENAME, filename, and
    FileName are unique filenames of different files, although they''re made up of
    the same letters.


    ![](img/019b0d727ede29f1ccb08789667e950f_345_0.png)


    Although filenames can technically contain wildcards, such as asterisks (*) and
    question marks (?), using them isn''t a good idea. Various interpreters, or shells,
    use wildcards to match several filenames at once. If your filenames contain wildcards,
    you have trouble specifying only those files. We recommend that you create filenames
    that don''t contain spaces or other characters that have specific meanings to
    shells. One way Linux filenames are different from DOS and Windows filenames.


    # Sorting sorts of file types


    Linux files can contain all sorts of information. In fact, Linux sees every device
    — disk drives, monitor, mouse, or keyboard, for example — as a file; the only
    exception is a network interface. These five file types eventually become the
    most familiar to you:


    +   - Data files: These contain information you create. User data files, sometimes
    known as flat files, usually contain the simplest data files, consisting of text
    and numbers. More complex user data files, such as graphics or spreadsheet files,
    must be interpreted and used by special programs. These files are most legible
    if you look at them with a text editor because their content isn''t ASCII text.
    Changing these files generally affects only the user who owns the files.


    +   - System files: These are used by the system to keep track of users on the
    system, logins, and passwords, for example. As administrator, you may be required
    to view or edit these files. As a regular, you need not be concerned with system
    data files (except, perhaps, the ones you use as examples for your own, startup
    files).


    +   - Directory files: These hold the names of files — and other directories that
    belong to them. These and directories are called children. Directories in Linux
    (Unix) are just another type of file. If you''re in a directory, the directory
    above it is the parent. Isn''t that home?


    When you list files with the ls - command, it displays a list of files and directories.
    Directory files (for example) begin with the letter d, so they''re easy to spot
    in this example:


    ```

    [lidia@cancun lidia$ ls -

    drwxr-xr-x 5 lidia lidia 1024 Aug 03 2004 Desktop

    drw------ 2 lidia lidia 1024 Aug 10 2004 nsmail

    ```'
  merge: -1
  img_proc: true
- pgno: 346
  md: '# Appendix C: Filing Your Life Away 327


    +   * Special files: These represent either hardware devices (such as disk drives,
    tape drives, or keyboards) or some type of placeholder that the operating system
    uses. The /dev directory holds many of these special files. You can see this directory
    by running this command at a command prompt:


    ```

    ls -l /dev

    ```


    +   * Executable files: These contain instructions (usually called programs or
    shell scripts) for your computer. When you type the name of one of these files,
    you are telling the operating system to execute the instructions. Some executable
    files look like gibberish, and others look like long lists of computer commands.
    Many of these executable files are located in /bin, /usr/bin, /sbin, and /usr/sbin.


    # Understanding files and directories


    If you live in the Windows world, you can think of a Linux file system as one
    huge folder that contains files and other folders, which turn contain files and
    other folders, which in turn contain files and — well, you get the point. In fact,
    the Linux file system is generally organized in this way. One binary contains
    files and other directories, and all the other directories in turn contain files
    and directories.


    # Directories and subdirectories


    A directory, or nested, in another directory is a subdirectory. For example, the
    directory named /mother may contain a subdirectory named /child. The relationship
    between the two (even if they don''t have such family-derived filenames) is referred
    to as parent-and-child. The full name of the subdirectory is /mother/child, which
    would make a good place to keep a file named /mother/child/reunion that contains
    information about a family reunion.


    # The root directory


    In the tree directory structure of Linux, DOS, and Unix, the big directory at
    the bottom of the tree is the root directory. The root directory is the parent
    of all other directories (the poor may be exhausted) and is represented by a single
    symbol (pronounced "slash\ From the root directory, the whole tree structure grows
    like a tree, with subdirectories branching off limbs.


    If you turn the tree over so that the trunk is in the air and the branches are
    toward the ground, you have an inverted tree — which is how the Linux file system
    is normally drawn and represented (with the tree''s root at the top). If we were
    talking about Mother Nature, you would soon have a dead tree. Because the subject
    is computer technology, you have something that looks like an ever-growing, upside-down
    tree.


    ![](img/019b0d727ede29f1ccb08789667e950f_346_0.png)'
  merge: -1
  img_proc: true
- pgno: 347
  md: '# 328 Part VI: Appendixices


    # What''s in a name?


    You name directories in the same way as you name files, following the same rules.
    Almost the only way you can tell whether a name is a filename or a directory name
    is the way slash character (/) is used to show directories nested in other directories.
    For example, `usr/local` means that local is in the usr directory. You know that
    usr is a directory because the trailing slash character tells you so; however,
    you do not know whether local is a file or a directory.


    ![](img/019b0d727ede29f1ccb08789667e950f_347_0.png)


    If you issue the `ls` command with the `-f` option, Linux lists directories with
    a slash character at the end, as so you know `local/` is a directory.


    The simplest way to tell whether the slash character indicates the root directory,
    other separate directories, and files, is to see whether anything appears before
    the slash character in the directory-path specification (a string that shows exactly
    which directories and subdirectories you have to go through to get to the file).
    If nothing appears before the slash, you have the root directory. For example,
    you know that `/usr` is a subdirectory or a file in the root directory because
    it has only a single character in front of it.


    # Home again


    Linux systems have a directory named `/home`, which contains the user''s home
    directory, where she can


    +   * Store files

    * Create subdirectories

    * Move, delete, and modify subdirectories and files


    Linux system files and files belonging to others are never in a user''s `/home`
    directory. Linux decides where the `/home` directory is placed, and that location
    can be changed only by a superuser (`root`), and not by general users. Linux is
    dictatorial because it has to maintain order and keep a handle on security.


    # Moving Around the File System


    You can navigate the Linux file system without a map or GPS (Global Positioning
    System). All you need to know are two commands: `pwd` and `cd`. (You run these
    commands from the command line.) However, you also need to know where to start
    — hence the usefulness of the next section.'
  merge: -1
  img_proc: true
