  md: '# Chapter 19: Building a Streaming Audio Server 287


    Ices2 starts streaming to the Icecast2 server the Ogg/Vorbis file you created.
    You can start listening to your private streaming server. We describe how to do
    just that in the following section.


    # Putting It All Together: Streaming Music to Your Private Network


    You can use a multimedia player such as Rhythmbox to connect and listen to an
    audio stream. The following steps describe how to do it (assume you''re still
    logged in as Root):


    ```

    mplayer http://127.0.0.1/example1.ogg.

    ```


    That''s It! whatever you ripped from your music get CD.


    It''s common to restart Ices multiple times while trying to get it working. In
    that case, you may tie up the loopback port that Ices2 and Ices2 use to communicate.
    In that case, you''ll see a warning in the /var/log/ices/ices.log file, saying
    that it cannot connect to port 127.0.0.1:8000. You can solve that problem by running
    the following command as root: service network


    You have little to gain by using Ices2 to serve up music streams locally on your
    PC. Using the CD player described in Chapter 12 is easier. However, listening
    to your multimedia-streaming server is useful and interest- when it''s done across
    a network.


    # Streaming on Your Private Network


    The preceding section describes how to broadcast music on and to the computer
    you''re sitting at. If you''ve created Jukebox, now''s the time to expand Jukebox
    into a private-network radio station.'
