    # # Building an Apache Web Server


    The Web is the Internet, and the Internet is the Web — well, that''s not completely
    true. Although the Internet became immensely popular because of the World Wide
    Web (WWW), there''s more to the Internet — it provides the foundation for widely
    used functions. E-mail is one; the Web is another.


    The Web isn''t as mysterious as it may seem at first. It is composed of all Web
    servers that are interconnected via the Internet. The Internet itself serves the
    same function as the telephone system: it allows everyone to communicate with
    each other. You can think of Web servers as the telephones that allow people to
    contact each other, businesses, and other organizations. Just as you can start
    a business or organization and let people contact you via your phone, you can
    allow people to contact you via your Web server. This section describes how to
    construct a simple Web server.'
