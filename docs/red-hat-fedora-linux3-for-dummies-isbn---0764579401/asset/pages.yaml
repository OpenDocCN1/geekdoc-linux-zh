  md: '# Chapter 18: Bringing In the Fedora Core Repairman


    upside-down tree, where the trunk of the tree represents the fault, or problem.
    The ends, or leaves, of the branches represent all the possible causes. After
    that''s done, solving the problem is virtually guaranteed.


    For example, Figure 18-1 shows part of a fault tree that points out which major
    subsystems you examine. To find the solution to a problem, you have to systematically
    identify what you''re working. Work your way to what''s not working and then when
    you find it, you solve your problem. The fault tree simply helps to formalize
    the process of problem solving.


    Here are some possible faults:


    +   The first branch on the left involves problems with the physical connection.
    Do you have a malfunctioning network adapter or switch/hub? Is the cable not connected
    properly to the adapter? In that case, jiggle the cable or fuss with the connector.
    Do you have a break in the cable or a loose connector?


    +   The second branch deals with the network interface configuration. Have you
    correctly configured the IP address for your Ethernet adapter (NIC)?


    +   The third branch helps you decide whether the problem exists with the network
    routing. Can your network packets be directed towards the correct network?


    The fault tree helps you to break down any big problem into simpler ones. By eliminating
    each simple problem one by one, you should eventually locate the root cause.


