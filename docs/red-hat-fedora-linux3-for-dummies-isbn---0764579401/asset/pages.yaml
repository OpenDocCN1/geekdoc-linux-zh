- pgno: 20
  md: '# Introduction


    Red Hat Linux 3 For Dummies describes how to install and use this popular and
    powerful Linux distribution for fun and profit. Fedora Core is the successor to
    Red Hat Linux. Fedora Core 1 was essentially Red Hat Linux 10; if you really like
    numbers, think of Fedora Core 3 as Red Hat Linux 12.


    Let''s back up a little and mention that a Linux distribution is the combination
    of the Linux kernel (the core software, also known as an operating system, that
    controls your computer) and all its supporting applications, utilities, and installation-and-configuration
    software that helps you get work done and have fun with your computer. The word
    Linux has traditionally been used, depending on the context, as shorthand to mean
    a specific Linux distribution.


    Why is this Linux distribution named Fedora Core? What do a fedora core have to
    do with Linux? Well, the company Red Hat, Inc., recently decided it was time to
    concentrate on its core business, which is centered on its commercial product
    Red Hat Enterprise Linux. Red Hat merged its "free" Red Hat distribution with
    the Fedora Linux Project to create the Fedora Core Project (The Fedora Linux Project
    previously concentrated on developing third-party Linux-based applications and
    utilities.)


    The Fedora Core Project is an open-source project. Open source describes all software
    published under the GNU Public License (GPL) and all other licenses. Open-source
    software gives you (and everyone) access to the underlying source code and permits
    you to modify, use, and redistribute (for free or a fee). The only restriction
    is that you cannot prevent others from doing the same. Under the new arrangement,
    therefore, Red Hat maintains — and provides resources for — Fedora Core Project;
    the community of Fedora users and developers gets a larger role in technical development.


    Less talk, more rock! Red Hat Linux 3 For Dummies will help you install and use
    the immensely popular Fedora Core 3 on your personal computer. We show you how
    to get work done and also do fun stuff. This book is also designed to be an effective
    doorstep or coffee-cup coaster. Whatever you use for it, we hope you have fun.'
  merge: -1
  img_proc: true
- pgno: 21
  md: '# Red Fedora Linux 3 For Dummies


    # About This Book


    Red Fedora Linux 3 For Dummies is designed to be a helping-hands resource. It
    provides a place to turn for help and solace in those moments, after two hours
    of trying to get your network connection to work, your dog bumps into your desk
    and knocks the book onto your computer, jiggling the network cable — and it magically
    starts working.


    We tried our hardest to fill up this book with the things you need to know, as
    to how to do the following:


    +   * Install Fedora Core 3.

    * Get connected to the Internet, using broadband DSL, cable modems, or old-fashioned
    dial-up modems.

    * Get connected to your local-area network (LAN).

    * Build a simple-but-effective firewall.

    * Build Internet and LAN services, such as Web pages and print servers.

    * Use Red Linux to play CDs and listen to Internet radio stations.

    * Use the GNOME desktop environment. GNOME is the graphical system that makes
    your computer easier and fun to use. GNOME provides the ''feel'' of your computer
    plus many applications.

    * Take advantage of useful and usable applications, such as the Open Office productivity
    suite, Evolution desktop organizer and e-mail, and streaming multimedia MPlayer.

    * Work with the OpenOffice desktop productivity to satisfy your word-processing,
    spreadsheet, and presentation needs — or, install Wine (and possibly the commercial
    Wine enhancer CrossOver Office) so you can use Microsoft Office directly from
    your Fedora Core!

    * Upgrade your computer and network security.

    * Know where to go for help.

    * Manage your Fedora workstation.


    You encounter troubleshooting tips throughout this book. Chapter 18 is, in fact,
    devoted to the subject. It''s not that Fedora Core is all much trouble, but we
    want to be prepared in case you run into bad luck or unusual situations.


    The instructions in Red Fedora Linux 3 For Dummies are designed to work with the
