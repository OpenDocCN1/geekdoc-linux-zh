  md: '# 152 Part III: Linux, Huh! What Is It Good For? Absolutely Everything!


    # Groovin'' to Tunes with CD Player


    Imagine that you''re sitting alone, working at your computer — if you are now,

    that''s not much of a leap — or you could be reading a book that''s boring you
    —nsay this, it''s Saturday night, of course. What do you want to go to a party?\Have
    some fun, play some music, watch a video? We can''t provide the party,

    music, video, or instant fun, but we can help you get there — by showing how

    to use your computer as a multimedia center.


    In this chapter, we show you the tools that Fedora Core provides to turn your

    workstation into a sound-and-video system, including all the necessary applications
    to play CDs, DVDs, and streaming Internet media. We also show how

    to connect your PC to a sound card and speakers.


    # Set up your sound system


    Fedora Core should have automatically configured your computer''s sound

    system during the post-installation process described in Chapter 3. However,

    y may run into problems — especially on older computers — so Fedora

    Core provides a sound-card-detection utility.


    You can configure and test your sound card at the same time by following

    these steps:


    +   1. Log in as any user.

    2. Click the GNOME Menu button, and choose System

    Settings>Soundcard Detection.


    Enter the root password if prompted.

    The Audio Devices dialog box opens, as in Figure 12-1.


    Figure 12-1: A sample Audio Devices dialog box.


    ![](img/019b0d727ede29f1ccb08789667e950f_171_0.png)'
  merge: -1
  img_proc: true
- pgno: 172
  md: '# Chapter 12: Using Audio and Video Applications 153


    +   3. Click the Play test sound button.


    A dialog box opens asking whether you heard the sounds.


    +   4. Click Yes if you hear the sample guitar — and your computer is ready to
    rock.


    If you don''t hear the music, click No. Check the following possible cases:


    +   * Your computer has an old, unrecognizable sound card. In that case, you should
    purchase and install a new one.


    +   * You don''t have a sound card. You definitely have to purchase a new card
    and get it in there.


    +   * Your speakers are faulty. Check your cables and try again.


    +   * Someone else''s stereo is too low. Call the cops.


    +   5. Click OK in the Audio Devices dialog box and you''re ready to go.


    # Playing CDs


    Everyone wants a music in their lives — but you went ahead and bought a computer
    instead of stereo system. (D''oh!) It''s not a problem: As it happened, you did
    spend your money wisely — because your Fedora Core computer functions well as
    a stereo system. This section describes how to set up your computer to play music
    CDs.


    Fedora Core bundles several open-source CD players for Linux users: CD Player,
    XMMS (included in the distribution but not installed by default), Rhythmbox (we
    cover Rhythmbox later in this chapter). We describe CD Player in this chapter
