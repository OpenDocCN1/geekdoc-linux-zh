- pgno: 146
  md: '# Chapter 10


    # Gnowing More Applications


    In This Chapter


    +   - Introducing Nautilus, the GNOME file manager

    - Introducing Fedora Core/GNOME Applications


    Many applications help make your Fedora Core quite useful. In this chapter, you
    find out how to use Nautilus, one of the central GNOME applications. Nautilus
    manages files and other objects. We also introduce all of the Linux and GNOME
    applications that are installed by default.


    # Navigating with Nautilus File and Internet Integration Manager


    Being the boss doesn''t necessarily make you a bad person. Does it? It''s just
    a job. Right? Well, little GNOME guy is a good worker. doesn''t get paid, and
    likes to get bossed around. Just press a key here and click a button, and you
    can boss him around like any worthy-pointy Dilbert manager. GNOME comes with its
    own file and integration manager that saves you work and time for those long lunches.


    Nautilus is the graphical navigation system that GNOME uses to get you around
    your files and your network. Nautilus follows in the tradition of all good managers,
    showing you a display of the files and directories on your computer. You can copy,
    move, delete, and execute files by pointing and clicking—and it''s a snap (okay,
    a click) to create directories and view file details. Nautilus goes a step further:
    You can use it to configure your GNOME desktop, navigate the Internet, access
    multimedia applications, and slice and dice! Not a bad deal, considering that
    it works for free.'
  merge: -1
  img_proc: true
- pgno: 147
  md: '# Waking up Nautilus


    Fedora installs a GNOME Desktop Nautilus icon that points to your home directory.
    The icon is in the upper, left corner of your Desktop. Double-click the icon and
    a Nautilus window opens, as shown in Figure 10-1. The window shows the contents
    of your home directory.


    You see the Nautilus menu displayed at the top of the window. It follows a familiar
    menu format (File and Edit, for example) and does all the things you would expect
    a file manager to do.


    Click View:Reload to update Nautilus’s view of the current directory. The Reload
    function is useful if you create a new file. The file doesn''t show up in the
    file manager until you move to another directory and return, or else reload.


    ![](img/019b0d727ede29f1ccb08789667e950f_147_0.png)


    Figure 10-1: The Nautilus file manager.


    # Moving files and directories


    Open a Nautilus window of the directory where your target object (file or directory)
    lives. Open another window for the destination directory. Moving a file or directory
    is as simple as clicking and dragging the target object from its current location
    to its destination directory. Release the button and you have moved your file
    or directory.


    You can also move multiple files by following these steps:


    +   1. Click and drag the mouse cursor over the files you want to move.

    The mouse cursor creates a rectangular outline and highlights all files within
    that box.

    2. Next, click anywhere within the highlighted box and drag the mouse cursor to
    the directory you want.

    3. Release the mouse button and the files move to the specified directory.'
  merge: -1
  img_proc: true
- pgno: 148
  md: '# Copying files and directories


    Copying a file or directory is a bit more complicated than moving one. You can''t
    just click and drag an icon someplace. Follow these steps:


    +   1. Right-click the file or directory icon you want to copy and choose Copy
    from the menu that opens.

    2. Enter the directory you want to copy to by double-clicking its icon.

    3. When the directory opens, right-click anywhere on the background and choose
    the Paste option.


    The file or directory is copied to the new location.


    You can copy multiple files and directories in the same manner as you copied individual
    ones.


    +   1. Click and drag the mouse cursor to trace a box around the files or directories
    you want to copy.

    2. Right-click any of the blue highlighted icon names (but not the white space
    around the icons and names) and choose the Copy option.

    3. Double-click the directory you want to copy to, right-click the background,
    and choose Paste Files.

    4. Release the mouse button and the files are copied to the specified directory.


    # Deleting files and directories


    Deleting files and directories is much the same process as copying them. You rightclick
    the file or directory icon you want and then choose Move to Trash from the menu
    that opens. The file or directory is moved to the Trash directory.


    ![](img/019b0d727ede29f1ccb08789667e950f_148_0.png)


    "Trashed" files and directories aren''t immediately deleted. When you use the
    Move to Trash option to delete a file, for example, the file is moved to the Trash
    folder. Open the Trash directory by clicking its icon and right-clicking the file
    or directory to delete. Choose the Delete from Trash option. The Delete From Trash?
    warning window opens and prompts you to confirm the deletion. Click the Delete
    key and the file is erased. Alternatively, erase all files in the Trash by opening
    the Trash icon, clicking file and selecting Empty Trash.


    If you have many files and directories, you can delete a bunch of them. Again,
    you trace a box by clicking and dragging the mouse cursor. Right-click the blue
    highlighted icons or icon names (but not the white space around the icon and name).
    The files or directories are moved to the Trash directory.'
  merge: -1
  img_proc: true
- pgno: 149
  md: '# Part III: Linux, Huh? What Is It Good For? Absolutely Everything!


    # Creating files and directories


    Right-click anywhere in a Nautilus window and select Create Folder. A new folder
    (directory in Linux terms) is created and named untitled folder. Right-click the
    new folder, select Rename, and enter any name you want for the directory.


    To create a file, right-click in the Nautilus window and select Create Document:>
    Empty File. The new file icon appears and you can type in its name.


    # Viewing files and directories


    Files and directories are displayed on-screen as icons by default. The only information
    an icon shows the name and whether an item is a file or directory. You can display
    files and directories as list by choosing View:> List.


    This list describes the differences between views:


    +   **View as Catalog:** Selecting this option displays thumbnail images of graphical
    images stored in the current folder. This option isn''t active when no images
    are stored in the current folder.


    +   **View as Icons:** The default display option; shows the icon and indicates
    whether an item is a file or directory. Regular file icons take several forms,
    but text and configuration files look like pieces of paper with a corner folded.
    Files containing specific types of data have small subicons overlaid on the icon.
    For example, PDF files have a PDF subicon. Devices, and other objects take other
    forms. Directories take the form of a partially open mania folder. Icons are evenly
    placed across the entire File manager screen. Icons tend to make distinguishing
    files and directories easier, but take up more space on-screen.


    +   **View as List:** Displays the size and time stamp of each file and directory
    in addition to their names.


    > TIP You can use shortcuts anywhere on your desktop to point to files or applications.
    In Nautilus, just click and drag any file or application to any blank part of
    the desktop and release the mouse button. An icon is placed on the desktop. You
    can start the application by double-clicking its icon. If the icon points to a
    data file (a text file, for example) and Nautilus knows how to handle its MIME
    type, Nautilus launches the appropriate application to open the file. Otherwise
    Nautilus prompts you to specify which application to open it.


    ![](img/019b0d727ede29f1ccb08789667e950f_149_0.png)'
  merge: -1
  img_proc: true
- pgno: 150
  md: '# Chapter 10: Gnowing More Applications


    # 131


    Nautilus is programmed to recognize numerous Multipurpose Internet Mail Extensions
    (MIME) types, and they define which type of information a file stores — in other
    words, MIME keeps its other Rodex of sorts. Each MIME type is associated with
    certain file extensions. For example, when you doubleclick .doc file, Nautilus
    recognizes that the .doc suffix corresponds to a Word document MIME type and opens
    the OpenOffice word processor (as described in Chapter 13), which loads the .doc
    file.


    # Running programs


    Nautilus is such a hard worker that happily launches commands for you. You simply
    right-click the icon you want to run, which opens a submenu, and then you choose
    Open. For example, if you click the xclock icon in /usr/X11 directory, xclock
    appears on your desktop. (Double-clicking the icon performs the same function.)


    Managers are not very smart. But Nautilus is smarter than the average bear, and
    it knows what to do when it encounters various file types. If you open a non-executable
    file, such as a PDF file, File Manager knows which program to use in order to
    view it.


    # Introducing Fedora Core/GNOME Applications


    Numerous applications are installed during the installation process described
    in Chapter 3. The following sections list each installed application and a short
    description of their function. Each section corresponds to the submenu you see
    when you click the GNOME Menu.


    # Accessories


    You''ll find miscellaneous applications in this submenu. The following list provides
    a short description of each application.


    +   - Calculator. This is the Gcalc application. Gcaltool provides three calculator
    modes: basic, financial, and scientific. It also includes ten storage registers.


    +   - Dictionary. This is a network-based client application that looks up word
    spelling and definition via the MIT dictionary server — dict.org.


    +   - Text editor. Gedit provides a simple, effective text editor.'
  merge: -1
  img_proc: true
- pgno: 151
  md: '# Part III: Linux, Huh! What Is It Good For? Absolutely Everything!


    # Games


    Linux was initially oriented toward running services, so it may not seem ideal
    for game players. But indeed, it has lots of games. Open the Games icon and you
    see many of them. You''ll find that you can waste your life just as easily as
    with Windows! Ha!


    The following list gives a short description of each game:


    +   - Aisle Riot Solitaire. This game allows you to play several versions of Solitaire.

    - Ataxx. This is a board game for two players; you play against your computer.
    The object is to flip discs until your opponent doesn''t have any more discs.
    This game is similar to Reversi.

    - Blackjack. This game, you guessed it, allows you to play Blackjack.

    - BZFlag. You get to shots! Ah, to be 13.

    - Five or more. Theoretically fun by removing colored balls.

    - Four-in-a-row. You have to create a line of four marbles. Your opponent, or
    computer, has to do the same. First line wins.

    - Freecell Solitaire. This is another Solitaire game.

    - FreeCiv client and server. Figure a strategy to destroy other civilizations.
    You must start the FreeCiv server before starting the game by running a FreeCiv
    client.

    - Igno. This is another disc-flipping game similar to Ataxx.

    - Klotski. Move a patterned block to accomplish some objective. If you have a
    lot of time on your hands, you may find this game interesting.

    - Mahjong. This is a single-player version of the classic Mahjong Eastern tile
    game.

    - Mines. In this game, you need to clear space through a minefield.

    - Nibbles. You control a snake and try to get it to eat diamonds.

    - Robots. There are robots out there whose goal is to kill you. Same GNOME. You
    get a window full of balls. You must remove as many balls as efficiently as possible.

    - Stones. In this arcade game, you pick up as many stones (they''re gems) as possible
    while avoiding falling stones.

    - Tali. In this game, you roll dice and “create” a poker-like hand.'
  merge: -1
  img_proc: true
