    Your DSL modem acts as the intermediary between your computer and your DSL service\
    \ provider. You must connect one side to the phone jack and the other to your\
    \ computer's Ethernet NIC.\n\n+   3. Configure your Fedora Core computer to communicate\
    \ with the DSL modem.\nYour Fedora Core computer connects to the DSL modem via\
    \ an Ethernet NIC. You must configure your Ethernet NIC to work with the modem.\n\
    \n+   4. Configure the DSL modem with your PPP account name and password from\
    \ your ISP.\nYou must authenticate your DSL modem to your ISP. DSL connections\
    \ logged on your ISP, just as those from traditional analog modems do. You configure\
    \ your DSL modem with your ISP user name and password.\n\n+   5. Configure the\
    \ DSL modem's internal (private) network interface.\n DSL modem must be able to\
    \ communicate with a Fedora Core computer over an Ethernet connection. You must\
    \ configure the DSL modem so that it uses the same network parameters as your\
    \ computer.\n\n+   6. Configure the DSL modem user and administrative passwords.\n\
    DSL modems provide a reasonable level of security. You should take advantage of\
