    # Building a Samba Server


    Early in the game, Linux gained much popularity by acting as a file server for
    both Windows and Linux computers. It did that by dancing the Samba. Samba is more
    than just a dance you do in Brazil: It’s a suite of programs that speaks the same
    file-sharing language (the *protocol*) as Microsoft Windows. Using Samba produces
    a way to share the Linux file system on a network.


    This section describes how to install and configure Samba on your Fedora Core
    computer. Samba comes bundled with Fedora Core, so installation is a breeze. Samba
    is also configured to automatically start the ubiqu-/home directory, so configuration
    is also easy.


    Samba is based on the client-server model in which a computer (server) provides
    services to one or more computers (clients). Samba uses the term *share* (which
    comes from the Microsoft Windows world) to refer to any object it exports to a
    network. An object can be a directory or a printer.


    ![](img/019b0d727ede29f1ccb08789667e950f_242_0.png)'
