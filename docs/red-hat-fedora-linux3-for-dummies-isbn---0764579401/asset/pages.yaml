  md: '![](img/019b0d727ede29f1ccb08789667e950f_174_0.png)


    Sound Juicer creates the music it extracts in Ogg, the up-and-coming open-source
    audio protocol (it''s similar, but technically superior, to MP3). Sound Juicer
    creates directories with the name of the CD in your home directory. Each extracted
    track is stored as an Ogg-formatted file with the name of the song.


    After you create the music file, you can listen to it with Rhythmbox (click the
    GNOME Menu and Sound & Audio->Music Player).


    # # Burning CDs


    Back in the 1980s, when vinyl started to melt away under the invasion of CDs,
    building the factories to create the CDs cost megabytes; back then, it took a
    huge effort to make a CD. Now, for the handful of bucks it costs to purchase a
    CD burner, you can build your own personal CD. Amazing!


    A one-time writable CD is referred to as a CD-R; a rewritable CD is a CD-RW. CD
    burners look like read-only drives and are connected with an IDE or SCSI interface.


    But what can you burn? The answer is pretty much whatever you want: data, software,
    digital photos, or music. We''ll start by burning music.'
