    (Gnu C Compiler), to the Personal Desktop installation process described next
    in this list. You need at least 3GB of disk space to use this option. We use the
    Workstation installation option in this book because we''re programmers but, rather,
    the tools often come in handy when you''re installing applications. We encourage
    you to use the Workstation installation type for your Fedora Core installations.

    - Personal Desktop: This option installs the software necessary to use your computer
    as a personal workstation. Applications like Mozilla, OpenOffice, and Evolution
    plus the GNOME graphical environment give you all the tools you need to use the
