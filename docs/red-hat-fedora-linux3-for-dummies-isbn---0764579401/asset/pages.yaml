    > Linux was built from scratch with networking in mind. Networking is not merely
    an afterthought, as with other operating systems. Fedora Core comes bundled with
    software that provides file sharing, printer sharing, and other functions. This
    is why Linux gained its initial popularity.


    In earlier chapters, we will show you how to use a Fedora Core computer with an
    existing network. We also show you how to build a private network using Fedora
    Core computers as both clients and the Internet gateway, or firewall. In this
    chapter, we describe how to configure a Linux box to provide popular services
    to the private network.


    # Preparing a Network Server


    All examples shown in this chapter can be run from any Linux computer, such as
    the one set up around the Fedora Core distribution in Chapter 3. Linux doesn''t
    care what your intentions were when you built your computer. Linux eagerly told
    what it does and works gracefully as either a workstation or server.


    Linux works equally well whether it''s running a Web browser or a Web server;
    the difference between them is just the software used and how it''s configured.'
