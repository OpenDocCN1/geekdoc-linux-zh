    +   10. Click the OK button to return to the Add and Remove Software

    window.


    Until the advent of RPM (and the Debian Package Manager on Debian

    Linux systems), Linux software was distributed only by tar archives, which

    are sometimes referred to as tarballs (or more descriptively) hairballs. The

    tar storage mechanism means one or more files in a single file in a tar

    format. A tar file has the .tar suffix; a like .tgz or .gz, using the tar-based
    distribution system is suff-

    cient if your software doesn''t change often and you''re young. But when you

    need to upgrade or change software or work with complex software systems,

    t becomes quite difficult to work with. Rather than spend your life fitting\up
    hairballs, use systems such as RPM to greatly simplify your life.


    # Removing an RPM package


    You can remove Red Hat packages as easily as you install them. Use the RPM

    erase (-e) function, which is the opposite of the install (-i) function.'
  merge: -1
  img_proc: true
- pgno: 367
  md: '# Part VI: Appendixes


    Package Manager removes a package when you unselect an installed package.

    These steps describe how to remove a package:


    +   1. Click the GNOME Menu button and choose System Settings: Add/

    Remove Applications.


    +   2. Enter the root password in the Information window, if you''re

    prompted.


    The Package Management window opens.


    +   3. Click the Details button next to the package group that contains the

    package you want to remove.


    For instance, if you click the details button for the Development Tools

    group, the Development Tools Details window opens.


    +   4. Click the check-box to the left of the package you want to remove.


    The check mark disappears.


    +   5. Click the Close button.


    Control returns to the Package Management window.


    +   6. Click the Update button.


    The Preparing System Update dialog box opens briefly, and you return

    to the Completed System Preparation window.


    +   7. Click the Continue button.


    The package (or packages) is removed.


    +   8. Click the OK in the Package Management window, click the OK button.


    +   9. Back in the Package Management window.


    > Be sure that you really want to get rid of the package because you

    remove it, it''s gone — as in. Okay, okay, we''re being a

    little dramatic. You can always go online to a site such as www.freshheat-

    net or redhat.com and download more packages to install. We recommend recommend
    that you do so. Some new tool is coming out that can help opt-

    imize Fedora Core computing experience.


    ![](img/019b0d727ede29f1ccb08789667e950f_367_0.png)


    # Manual Shifting with RPM


    The first part of this chapter concentrates on showing how to use Red

    Hat Package Manager to install and remove packages. You also have the

    ofion using the rpm command. It provides additional features for install-

    tion and remove functions. You can use rpm to install, update, remove, and

    query commands. This section provides examples of how to use the manual

    rpm command.'
  merge: -1
