    # Protecting your LAN with a firewall


    After you have configured your gateway for IP forwarding, you need to protect
    your network from the bad guys on the Internet. This section describes how to
    turn your gateway into a firewall. You use the same process and many of the rules
    we describe in Chapter 8; however, this firewall is designed to protect your entire
    network, whereas the one in Chapter 8 is oriented toward protecting individual
    workstations.


    The firewall you''re building helps protect both your computer and your network.
    The firewall provides the network address translation (NAT) function, which allows
    the computers on your private network to access the Internet. NAT, you may recall,
    converts the nonroutable source IP addresses (192.168.1.1, for example) to the
    routable source IP address of your connection.


    Network address translation is also referred to as IP masquerading, or simply
    masquerading.


    The basic configuration of the firewall we describe in Chapter 8 works in the
    new configuration. The firewall performs these functions:


    +   * Block incoming, outgoing, and forwarded packets: Block all network traffic
    by default. This firewall completely protects your private network and makes it
    useless! Start with this policy to ensure that the firewall blocks all connections
    except the ones you explicitly allow.


    ![](img/019b0d727ede29f1ccb08789667e950f_225_0.png)'
  merge: -1
  img_proc: true
- pgno: 226
  md: '# Chapter 15: Building Your Own Private Network


    # 207


    +   - Allow all internal traffic: You must allow all network traffic on the Internet
    gateway (io) internal loopback (lo) interface. The loopback interface is used
    by the Linux system for its own, internal communication. Many internal processes
    communicate over this virtual network.


    +   - Allow internal NIC traffic: You reap greater convenience if you allow the
    computers on the private network to communicate with the gateway. For example,
    you may want to administer the gateway via Secure Shell (SSH). Take a lenient
    approach and allow any internal machine to communicate with the gateway; this
    strategy makes constructing the firewall easier. You may decide to limit internal
    access if your security needs demand.


    +   - Allow outgoing traffic from the firewall: Allow all outgoing connections
    from the firewall. The firewall needs to perform its own internal processes, making
    DNS queries.


    +   - Forward all traffic to the private network: A gateway has to pass traffic
    from one interface to another. You change the forwarding policy to permit communication
    from the private network to pass through the firewall to the Internet. The downside
    is that traffic from the Internet can pass right through the firewall to the private
    network — not a good idea. You fix problems by doing NAT, which effectively prevents
    external access through the firewall.


    You can set specific forwarding rules to provide more protection to your private
    network. We believe that using NAT to effectively block connections that originate
    is adequate for your needs.


    +   - Use NAT for outgoing connections: Create a NAT rule to make all connections
    originating on the private network appear to be coming from the Internet gateway.
    All private-network machines have their source addresses and ports changed to
    that of the gateway.


    Network-address translation isn''t necessary if your Internet connection (telephone,
    DSL, or cable modem) performs NAT. By providing a NAT filtering rule, however,
    you ensure that your Internet gateway with any connection device — whether or
    not it performs NAT. NAT also prevents external access to your private network.


    +   - Allow incoming SSH connections: The Secure Shell (SSH) protocol encrypts
    network connections. SSH provides a reasonably secure system for connecting to
    your private network from the Internet. We configure the firewall to allow SSH
    connections into our firewall.


    The firewall on the Internet gateway is the firewall we describe in Chapter 8,
    except if you add IP forwarding and NAT. IP forwarding allows packets from the
    private network to pass outward through the firewall and on to the Internet. In
    this case, NAT makes all Internet-bound traffic appear to be coming from the firewall
    or gateway — and prevents incoming packets from being forwarded inward to your
    private network.


    ![](img/019b0d727ede29f1ccb08789667e950f_226_0.png)'
  merge: -1
  img_proc: true
