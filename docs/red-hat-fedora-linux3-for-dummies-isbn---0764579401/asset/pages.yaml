    # YUM functions


    YUM provides capabilities to perform the following tasks:


    +   - **Clean.** Use this option to remove accumulated files from the YUM cache
    directory.

    - **Install.** You can use this option to install one or more packages; you can
    use this function to install entire groups. Let''s say that you use the XMMS multimedia
    player that''s included in the Fedora Core 3 distribution but not installed by
    default. Your DVD is in another room and you don''t want to get up and get it.
    (We''re revealing too much of our lazy habits.) No you''re connected to the Internet,
    run the **yum install xmms** command and not have.

    - **Info.** This option provides a summary of the package(s). Run the **yum info
    mozilla** command and YUM goes out and provides the Mozilla package information
    summary.

    - **List.** This option provides information about packages installed on your
    computer. Use the **yum list mozilla** command to find out the information about
    the Mozilla package installed on your computer.

    - **Provides.** Use this option to use a character string, and wildcard, to find
    what feature or files provides.

    - **Remove.** Use this option to remove one or more packages and your dependencies.

    - **Search.** Use this option to find packages that match the text string you
    provide. For instance, if you enter **yum search**, you''ll get a list of packages.

    - **Update and check-update.** Use the update option to, yes, update packages
    or your entire computer; the updating process removes the older version and installs
    the newer one. If you run the yum update, your entire computer will be updated.
    Specifying a single package (for instance, **yum update mozilla**), updates that
    package.

    You can display which, any, packages can be updated. Enter the **yum check-update**
    command and all the available package updates for your computer will be displayed.

    - **Upgrade.** This option is no longer used and will be removed in the future.
    Use the Update option.'
  merge: -1
