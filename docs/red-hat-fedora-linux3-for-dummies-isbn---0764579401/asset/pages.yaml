    \ browsers that are quick and easy to use. We still prefer Mozilla for its power\
    \ and maturity and use it for our examples.\n\n+   2. Change the default browser\
    \ from Firefox to Mozilla by clicking the pull-select a Web Browser: pull down\
    \ menu and select Mozilla.\n\n+   3. Click the Close button.\n\nNow we'll configure\
