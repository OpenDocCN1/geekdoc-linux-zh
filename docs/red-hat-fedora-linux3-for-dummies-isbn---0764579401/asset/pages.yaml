    \ Panel.\n Welcome to the Fedora Core screen appears in Mozilla. You can use this\
    \ page to find out more about Fedora Core and its products.\n\nConcentrate on\
    \ configuring Mozilla; skip over the Fedora Core information (Lots of good information\
    \ is there, however, to explore your world at your leisure.)\n\n+   2. Choose\
    \ Edit: Preferences.\n\nOn the left side of the Preferences window is a list of\
