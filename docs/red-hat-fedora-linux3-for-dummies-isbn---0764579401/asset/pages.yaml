- pgno: 99
  md: '# 80 Part II: Got Net?


    7. If necessary, configure the modem''s network address translation (NAT) settings.


    Many, if not most, DSL modems become configured to use NAT by default. This is
    a good thing because NAT effectively works as a firewall. There''s no such thing
    as too much protection.


    ![](img/019b0d727ede29f1ccb08789667e950f_99_0.png)


    The Internet was designed to send — or route — information as quickly as possible
    to its destination. Internet Protocol (IP) addresses are used to designate where
    the information is coming from and where it''s going. IP addresses can be routable
    or nonroutable. Nonroutable addresses can be reused; you can use the same nonroutable
    addresses that your neighbor uses without interfering with one another.


    NAT converts nonroutable IP addresses into routable ones, which is useful when
    you''re connecting your private network to the Internet by translating your internal
    IP addresses into one of your ISP''s routable IP addresses. You need to configure
    your DSL modem to convert your computer''s private and nonroutable address (for
    example, 192.168.1.1) into an address assigned to your DSL connection by your
    ISP.


    +   8. Save the settings to nonvolatile memory and restart the modem.


    You need to save your DSL settings after you have them working. You don''t need
    to enter the configuration every time you turn on your modem.


    # Finding a DSL provider


    You must obtain both DSL and ISP services to make your broadband connection. Some
    companies — notably, the regional Bell telephone companies — can provide both
    services. However, in our case, we preferred our ISP to the one that aligned with
    the DSL provider (We were fortunate enough to retain our ISP when we purchased
    our DSL service.)


    ![](img/019b0d727ede29f1ccb08789667e950f_99_1.png)


    The provider market is still quite fluid. Research the DSL service providers in
    your area carefully before choosing one — and remember that longevity is as important
    as a low price. Regional Bells are more likely to provide long-term service than
    many of their competitors.


    Usually, you have to select an ISP after you choose a DSL provider. DSL providers
    either provide their own ISP or allow you to choose from several independent ones
    (the DSL provider makes the arrangements and works directly with the third-party
    ISP).'
