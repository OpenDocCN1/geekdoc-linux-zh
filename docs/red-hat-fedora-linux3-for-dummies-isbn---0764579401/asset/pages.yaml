    # My Buffer Overflow\n\nBene the surface, computer programs — applications — are\
    \ made of many subprograms known as subroutines. Subroutines allow programmers\
    \ to divide into many smaller tasks the task is to perform. Designing big or small\
    \ programs without subroutines would be impossible.\n\nWhenever a program calls\
    \ a subroutine, or a subroutine calls a subroutine, information can be passed\
    \ between the two via the stack. A stack is like a can of tennis balls: the first\
    \ pushed into the stack is the last one out. This type of stack is called first-in-last-out.\
    \ (Other variations are possible, such as first-in-first-out.) Stacks turn out\
    \ to be quite efficient for transferring information: Memory is consumed when\
    \ transferring information to a subroutine and then automatically released when\
    \ the subroutine finishes. Stacks are referred to as buffers and queues."
