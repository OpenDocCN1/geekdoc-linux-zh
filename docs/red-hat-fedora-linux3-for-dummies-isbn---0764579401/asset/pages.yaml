  img_proc: true
- pgno: 279
  md: '# 260 Part IV: Revenge of the Nerds


    Therefore, SELinux uses role-based access control (RBAC) to simplify process definitions.
    RBAC defines what SC users and processes can enter.


    The security context for an object — a file, directory, socket, and so on — consists
    of a security identity (SID), role and type. A process SC is made up of a SID,
    a role and a domain. An object gets tagged with a type and a process belongs to
    a domain.


    The following list describes the components of an SC:


    +   **Domain.** Processes belong to domains. Domains define the object type that
    a process can access. Domains are the flip side of Types.

    **SELinux Identity.** Every process has a SELinux Identity (SID), SELinux uses
    the SID to track users and processes — that is not possible with plain Linux.
    The SID is different from the Linux user identity (UID).

    **Role.** Roles determine the domains that users and processes can access.

    **Type.** Objects are assigned types. An object Type defines the domains that
    can access it.


    # Introducing SELinux policy options


    Fedora Core 3 installs and configures SELinux by default. The installation includes
    two security policies: Targeted and *Strict*.


    The Strict policy creates a separate Domain for every daemon, the *root* user,
    and nonprivileged users. Using the Strict policy creates a very safe system, but
    one that is difficult to modify (inflexible). You generally have to manually configure
    the SC for third-party software and can be a difficult process. Only experienced
    SELinux administrators should use the Strict policy.


    Fortunately, the Fedora Core development team created the Targeted as a compromise
    between the traditional Linux DAC and SELinux with a Strict policy.


    The Targeted policy creates separate domains for a handful of service daemons
    such as Apache: Apache daemons belong to the HTTP domain (httpd_t), for instance.
    These domains are restricted from accessing all other domains. They''re isolated
    islands that can access the bare minimum of resources.


    On the other hand, every user, process, and object belongs to the Unconditional
    (unconditional_t) domain. No limitations are placed on members of the unconditional
    domain. Unconditional domain members effectively operate as if they were under
    control of the standard Linux DAC system.'
  merge: -1
  img_proc: true
