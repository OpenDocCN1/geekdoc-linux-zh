    +   **Multimedia stuff:** Fedora Core packs numerous multimedia tools for you
    to use. You can play, record and rip audio tracks from CDs and DVDs. You can listen
    to media sources (such as radio stations) over the Internet with Rhythbox. Linux
    also lets you transfer photos and other items from your own MP3 players.


    +   **Network services:** Fedora Core traces its roots to providing networking-based
    services. Linux found its initial popularity in performing jobs like Web serving,
    file serving, and printer sharing—and hasn''t missed a beat. We show you how to
    create several network services with Fedora Core in Part IV of this book.


    # # Boosting Your Personal Workstation


    We can''t emphasize how well Fedora Core functions as a personal computer. With
