- pgno: 48
  md: '# # Chapter 3

    # Ready, Set, Install!


    **In This Chapter**


    +   * Deciding which Fedora Core installation type to use

    * Starting the Fedora Core installation process

    * Automatically selecting Linux partitions

    * Configuring your network

    * Configuring your system options

    * Finishing the installation and rebooting

    * Configuring your display

    * Using the Setup Agent to complete post installation


    Installing Linux is not rocket science — it''s more like astrophysics. (Well,
    maybe it''s not *quite* that.) Although installing Fedora Core may seem at first
    like a difficult job, it''s actually pretty simple. The installation process requires
    that you answer a few questions, and then the process takes care of itself.


    When you''re done, you have a powerful computer that is capable of performing,
    if not, all of your daily chores—all for the cost of this book! It''s pretty amazing
    when you think about it: For a few bucks, you get the same amount of operating
    power that would have just a few years ago.


    This chapter walks you through the process of installing Fedora Core 3. The process
    involves inserting the companion Fedora Core 3 DVD disc, powering up your computer,
    and answering some questions.


    This book comes with a Fedora DVD that contains the entire Fedora Core 3 distribution.
    The single DVD replaces several CD-ROMs so you not have to continuously swap CD-ROMs
    during the installation process. It also makes installing the software easier;
    you don''t have to find the particular CD-ROM that contains a specific package.
    However, you can obtain the Fedora Core 3 distribution on CD-ROMs by mailing the
    coupon in the back of this book. You can also download directly, and for free,
    from fedora.redhat.com/download if you have a broadband connection or a dial-up
    and a lot of patience.


    ![](img/019b0d727ede29f1ccb08789667e950f_48_0.png)'
  merge: -1
  img_proc: true
- pgno: 49
  md: '# 30 Part I: Installing Fedora Core


    ![](img/019b0d727ede29f1ccb08789667e950f_49_0.png)


    # For installation purists only


    You can run the Fedora Core installation system from either a graphical or text-based
    interface. If the installation process successfully detects your graphics hardware,
    the graphical method is selected automatically, and that''s the system we discuss
    in this chapter. In addition to the use of using a mouse to point and click, the
    graphical method groups similar configuration choices. For example, the keyboard
    and mouse selections are presented within one window, not two, as in the text-based
    installation.


    +   - Your mother told you never to point and click.

    - In an unlikely (but possible) turn of events, the Fedora Core installation system
    found it couldn''t use your graphics adapters. Occasionally the installation system
    cannot start the graphics interface; in that case, it defaults to text mode. Using
    the text-interface, you use the keyboard to enter information and the cursor (arrow)
    keys to move step to step.

    - You can select the text-based installation method by typing linux text at the
    boot.


    You may have to use the text-based installation, for these reasons:


    ![](img/019b0d727ede29f1ccb08789667e950f_49_1.png)


    > The Fedora Core installation process has a point of no return. That time comes
