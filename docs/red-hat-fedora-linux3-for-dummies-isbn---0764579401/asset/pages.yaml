  md: '# Chapter 3: Ready, Set, Install!


    # Checking your discs


    Fedora Core provides a validation mechanism for checking your DVD (or CD-ROMs).
    If your distribution is a DVD, Fedora Core uses numeric keys to verify that it''s
    corrupted. You can enter linux mediacheck at the _boot: prompt, at the beginning
    of the installation process, to verify the disc''s integrity. Follow these steps
    to verify that your disc is in working order:


    The media-check system displays a progress meter and then shows the result in
    the Media Check Result window when it finishes. The possible results are PASS
    and FAIL.


    +   1. Select the OK option by pressing the Enter key if you want to verify your
    DVD (or CD-ROM)


    +   3. Select the OK button (the only option) in the Media Check Result window.


    If you don''t want to verify your disc you have already checked it during an earlier
    installation, or you trust (d''oh!) — you can select the Skip option to return
    to the Fedora Core installation process without checking the medium.


    The Media Check dialog box opens and the disc ejects.


    +   4. Assuming your DVD passed, re-insert the DVD and select Continue.


    If you choose to verify, the Media Check window opens.


    The installation process continues.


    +   5. If you are testing CD-ROM, insert the second or third CD-ROM and repeat
    Steps 2-4 for each CD-ROM. You are finished after the third CD-ROM.


    Obviously, if the DVD (or any of the CD-ROMs) fails the test, you shouldn''t use
    it. You should buy another copy of this book. (No, no — kidding.) Contact the
    Wiley Technical Support department, at www.wiley.com/techsupport, to find how
    to get a replacement DVD (or CD-ROM).


    +   2. Press the Tab key to select the Test option and press the Enter key to
    start the integrity check.


    # Installation Stage 2: Slicing and Dicing the Pie


    You must decide where on your hard drive to install Fedora Core. This process,
    called disk partitioning, divides the disc into multiple sections. Fedora Core
    is installed on its own partitions.


    Fedora Core provides both automatic and manual methods for creating disk partitions.
    We use the Fedora Core automatic method because it''s easy. The automatic method
    erases any existing Fedora partitions, but doesn''t touch any Windows partitions.
    If you don''t have any Fedora Core partitions or unused space on your disk, you
    have to make some free space. Refer to Chapter 2 for instructions on how to shrink
    Windows partitions to make space for Linux.'
