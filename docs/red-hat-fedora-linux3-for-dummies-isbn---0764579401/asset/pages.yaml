- pgno: 37
  md: '# Part I: Installing Fedora Core


    # Preparing Your Windows Computer for Fedora Core


    Before you install Fedora Core alongside an existing Windows installation, you
    need to get your hard drive ready. This list of steps provides an overview of
    the disk preparation process:


    +   1. Put on a redora.

    2. Back up everything that''s on your Windows computer.


    The processes we describe in this chapter should not affect your existing Windows
    installation. However, you can never be too safe in dealing with your precious
    files, you should back them up. A description of how to back up the contents of
    a Windows computer is beyond the scope of this book. Numerous commercial and freeware
    (not to be confused with open-source) backup systems are available.


    +   3. Determine how your Windows hard drive is formatted.

    Microsoft uses two types of disk: FAT (File Access Table) and NTFS (NT File System).
    FAT is older and less advanced than NTFS. Open-source utilities are available
    for resizing FAT-based disks to make room for Linux, but you have to purchase
    commercial software to repartition NTFS systems. (The next section tells you how
    to know which format you have).


    +   4. Defragment your disk.

    All resizing programs require you to defragment your disk before proceeding. Over
    time, the bits and bytes that make your files tend to get scattered around your
    hard drive. If too many of these fragments are left floating around, resizing
    may not work — or cause problems. Tidy them up: the next section covers defragmenting.


    +   5. Repartition your computer''s hard drive to make room to install Fedora
    Core if you want to install it alongside Windows (another operating system).

    You can use destructive or nondestructive resizing to make room for Linux. Destructive
    resizing wipes everything, including Windows and your data files, but nondestructive
    resizing uses Windows Utilities to dynamically shrink the partition and uses the
    free space to make a new Linux partition. (Resizing is covered in this chapter).


    The open-source FIPS (First nondestructive Interactive Partition Splitting) program
    comes with the full Fedora Core distribution to repartition FAT disks. To repartition
    NTFS disks, you have to use a commercial utility such as NortonMagic 8.0 or Norton
    Ghost 2003; both these programs also work on FAT systems.'
  merge: -1
  img_proc: true
