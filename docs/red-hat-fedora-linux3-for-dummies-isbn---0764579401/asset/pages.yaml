    # Using Wine


    Wine is straightforward. After you''ve installed Wine, you simply open your installed
    Windows application and run it with Wine — Wine configures itself automatically
    and starts the application. The following sections provide you with three examples
    of the type of stuff you can do with Wine. The first example gets you started
    showing how to use a built-in Wine text editor that emulates the Wine text editor.
    The second example shows how to obtain and run a Shareware game that''s quite
    fun. The final example shows how to run an actual Windows application.


    # Starting Simple: Running Notepad


    The Wine package you just installed contains several simple Windows applications
    — emulated versions of Windows applications, that is. The Wine contributors have
    done the work to duplicate the familiar functionality in addition to the look
    and feel. Hey, we can get behind some immediate gratification.


    We can take advantage of the situation by demonstrating a couple of programs.
