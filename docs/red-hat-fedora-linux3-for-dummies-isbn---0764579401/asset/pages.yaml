    # Installation Stage 5: The Point of No Return


    The process described so far in this chapter hasn''t yet resulted in making any
    permanent changes to your computer. Your selections have been written in stone,
    so to speak. Nothing has been erased. No Fedora Core packages have been written
    to your hard drive, either. You can stop the installation process and go back
    to your old computer by clicking the Back button.


    Make your decision whether to proceed. Then, if the answer is yes, take a deep
    breath and follow these instructions to install Fedora Core on your computer:


    +   1. Click the Next button in the About to install window.

    nThe Required Install Media dialog box opens. (If you''re using CD-ROM discs,
    you''re told which discs you need.)


    You can click the Reboot button if you want to abort the installation process.
    In that case, no changes will be made to your computer.

    2. After you hold your breath for a second (don''t turn blue!) and decide to take
    the plug, click the Continue button.

    Your partitions are created and formatted, and then the Core distribution is written
    to them. The Installing Packages window (see Figure 3-3) tells you which package
    is being installed in addition to how many have been installed, how many remain
    to be installed, and the estimated time remaining.

    3. (Optional) If you''re using CD-ROMs, insert the second or third disc when prompted
    and click the Yes button.

    A congratulations window opens.


    ![](img/019b0d727ede29f1ccb08789667e950f_61_1.png)


    The installation process takes only a few minutes if you have the latest, greatest
    high-speed computer with a fast DVD or CD-ROM drive. Other-wise plan to spend
