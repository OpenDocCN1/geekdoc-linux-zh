- pgno: 26
  md: '# Part IV: Revenge of the Nerds


    In Part IV, we guide you through the use of your Fedora Core computer''s network
    capabilities. It''s Nerd City, but it''s also fun and useful. We start by showing
    how to build a simple network. After your network is up and running, we describe
    how to build network services, such as the Apache Web server, Samba, and printer
    servers. The last two chapters in this part are devoted to exploring the art of
    network computer security and troubleshooting network problems. Insert your pocket
    protector, strap the old Hewlett-Packard calculator to your hip, retape your glasses,
    and get ready for Saturday night!


    # Part V: The Part of Tens


    A Dummies book just isn''t complete without The Part of Tens, where you can find
    all-important resources and answers to the most bothersome questions people have
    after installing Fedora Core. (The folks at Red Hat Software provided these questions;
    they''d know.) We introduce the most important security concerns too.


    # Part VI: Appendices


    Ah, the appendices. Appendix A outlines the Fedora Core administration utilities.
    Appendix B describes how to find out the details of your computer''s individual
    pieces of hardware; this information is sometimes helpful when you''re installing
    Fedora Core. Appendix C and D introduce you to using and managing the Linux file
    system. Appendix E shows how to use the Red Hat Package manager (RPM). Appendix
    F completes this book by describing what you can find on the companion DVD.


    # You''re Not to Read


    Heck, you don''t have to read any of Red Hat Fedora Linux 3 Dummies if you don''t
    want to, but then, why did you buy it? (The we''re complaining.) Part I has background
    information. If you don''t want it, don''t read it. Also, the text in sidebars
    is optional, although often helpful. If you''re on the fast track to using Fedora
    Core, you can skip the sidebars and the text next to the Technical Stuff icon,
    as described in the following section. But we suggest that you slow down a bit
    and enjoy the experience.'
