    Running Wine for the first time creates a .wine directory in your home directory.
    The .wine directory contains all the configuration information that the Wine system
    needs in order to run. The configuration information is in the /config file. Several
    additional files, mimic the Wines Registry. The Windows operating system uses
    the Registry to organize its configuration parameters; Linux on the other hand,
    uses separate files, as those in the /etc, /etc/sysconfig, and /usr/local/etc
    directories, to hold its configuration information.


