- pgno: 339
  md: '# 320 Part VI: Appendices


    use them, the truth is that they''re not terribly complex. When you look at the
    parts that make up a PC, you see that each one performs a specific task. The sum
    of the parts equals a computer. This list outlines the subsystems that computer
    comprise:


    +   - Central processing unit (CPU): The CPU, microprocessor, is often referred
    to as the brains of a computer because the CPU controls, in minute detail, everything
    the computer does. CPUs are controlled by software that is essentially a recipe
    for doing tasks as simple or as complex as keyboard input or as complex as communicating
    across networks to display pictures in a Web browser.


    +   - The most common PCs running current are not Intel Pentium; chances you have
    one in your PC. Generally, the faster the computer, CPU speed is measured in megahertz
    (MHz), which means millions of cycles per second. To perform complex tasks, such
    as sending an e-mail, a CPU has to perform many simple tasks, or instructions,
    to create the larger one. Although the simplest instructions require a single
    CPU cycle, most require several cycles. By and large, the MHz is a reasonable
    measure of how fast a microprocessor.


    +   - Hard drives: Hard drives, also referred to as hard disks, store all the
    permanent information on a computer. The actual disks are metal plates that store
    bits and bytes in tiny magnetic domains (spots). The disk spins, and a magnetic
    head that floats on a cushion of air and writes from the disk. The spinning disk
    allows the quick access to any location on the disk and also creates the air cushion.


    +   - Disk controllers: The disk controller connects the drive to the computer''s
    microprocessor. Several types of controllers are commonly used: IDE, USB, FireWire,
    and SCSI. Most PCs with IDE internal hard drives. High-performance computers use
    SCSI-based drives because they are faster (and more expensive). IDE controllers
    can connect as many as four drives.


    +   - CD-ROM: CD-ROMs store information in the same way as hard drives do, but
    use light rather than magnetic fields. SCSI CD-ROMs are faster (as SCSI hard disks).
    The price us of USB and FireWire CD-ROMs are dropping fast, they''re becoming
    more common.


    +   - RAM, or Random-Access Memory: Working in RAM is much faster than hard disks
    and CD-ROMs. Because RAM is used to store temporary information, programs, data,
    and other types of information are stored in RAM — it "forgets" everything when
    power to the computer is turned off. RAM is measured in megabytes (MB). A megabyte
    is roughly one million bytes.


    +   - Mouse: Not all mice are created equal. Which type of mouse you have — bus,
    PS/2, or serial? How many buttons does it have? If you have a serial mouse, which
    COM port is it attached to and which protocol (Microsoft or Logitech) does it
    use?'
  merge: -1
  img_proc: true
- pgno: 340
  md: '# Appendix B: Discovering Your Hardware’s True Identity 321


    +   - Monitor/flat-panel display: What are the make and model of the monitor or
    flat-panel display? What are its vertical and horizontal refresh rates? You need
    this information only if you plan to use the Windows System, the graphical portion
    of Linux. Monitors and flat-panel displays perform exactly the same function,
    but with different technologies. Monitors are the ubiquitous, heavy, television-like,
    glass vacuum-tube devices that are quickly being replaced by flat-panel displays.
    These screens use liquid crystal (LCD) technology, which uses less power and space.

    - Video card: What are the make and model number of the video card or video chip,
    and what is the amount of video RAM?

    - Network interface card (NIC): If you have a network connection, what are the
    make and model number of the network interface card?


    That’s the rundown of computer subsystems. Each performs a specific function;
    buttoned up inside a computer chassis (whether a desktop box or laptop); they
    work together to create the computer you’re familiar with. The next two sections
    describe hard drives and memory in more detail.


    # Understanding Hard-Drive Controllers


    The two main types of hard drives are IDE and SCSI, and each type has its own
    controller. IDE is more common in PCs; newer PCs usually have two IDE controllers
    rather than one. For each IDE controller, your system can have only two hard drives:
    a master and a slave. Therefore a PC with two IDE controllers can have as many
    as four hard drives. Also, if you have a Windows system that you want to pre,,
    you should know on which hard drive it resides. The following list shows a normal
    configuration in a Windows system:


    +   - The first controller’s master drive is named C.

    - The next hard drive, named D, is the slave drive on the first controller.

    - The next hard drive, E, is the master drive on the second controller.

    - The last hard drive, F, is the slave on the second controller.


    Windows is normally located on drive C, and your data is on your other drives.
    This lettering scheme is one possibility; your hard drives may be set up differently
    by using CD-ROMs on your IDE controllers.


    Some high-end PCs have SCSI controllers on their motherboards or separate SCSI
    controllers, either in addition to or replace the IDE controllers. Older SCSI
    controllers can have as many as devices on them, numbered from 0 to 7, including
    the controller. Newer SCSI controllers (known as wide controllers) can have as
    many as 16 devices, including the controller itself.'
  merge: -1
  img_proc: true
- pgno: 341
  md: '# 322 Part VI: Appendixices


    If you have a SCSI hard drive, Drive 0 or Drive 1 is usually your drive C, and
    others follow in order.


    If you have a mixture of IDE and SCSI controllers, your drive C could be on any
    of them. The sections "Discovering Your Windows 9x or Windows Hardware" and "Discovering
    Your Windows NT, Windows 2000, or Windows XP Hardware," later in this appendix,
    show how to identify how many hard drives you have, which type(s) they are, and
    which controllers they are attached to.


    Considering Fedora Core on a separate hard drive, away from any Windows operating
    system, for a couple of reasons. First, you can now find 80GB hard drives for
    well under $100 (U.S.). Second, it''s a pretty daunting task (at worst, nearly
    impossible) to shrink MS-DOS and Windows till they''re small enough to allow Fedora
    Core to reside in its full glory on any hard drive. Also, although technically
    you can split the Fedora distribution and put it on several hard drives, doing
    so makes updating the distribution difficult later.


    # A Bit About Memory Bytes


    Memory is the most important factor in determining how fast your computer runs.
    Computers use Random-Access Memory (RAM) to store and access the operating system,
    programs, and data. The Intel processor usually has the following amounts of RAM
    (main memory):


    +   * Linux can run on a surprisingly small amount of memory. With some work and
    no graphics, you can squeeze Linux onto an old PC with 16MB of memory; 32MB makes
    life much easier and your computer significantly faster.

    * Many people use old PCs with small amounts of memory as simple network servers.

    * If you want to run Linux with graphics, however, you need 64MB.

    * With 128MB, Fedora Core runs multiple graphical programs (such as OpenOffice)
    with ease.

    * You need 256MB or more (many PCs now come standard with 512MB) for hard-core
    computing. Using big applications, such as VMware, having enough memory essential.


    VMware virtual computers need their own RAM to operate at a reasonable speed;
    for example, you should allocate a minimum of 128MB of memory to run a Windows
    2000 virtual computer. Plan to use 512MB if you want to run multiple instances
    of VMware virtual computers.'
  merge: -1
  img_proc: true
