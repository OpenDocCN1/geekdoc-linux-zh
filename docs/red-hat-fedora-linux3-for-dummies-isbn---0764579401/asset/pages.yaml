- pgno: 269
  md: '# Part IV: Revenge of the Nerds


    # Encryption


    The mathematical process encryption essentially garbles information so only those
    with authorization can ungarble (and read) it; encryption prevents those you don''t
    want to read your communication from reading it. The process of encryption and
    decryption requires the combination of the mathematical process encryption algorithm
    and the mathematical entity cryptographic keys (keys, for short). A key is basically
    a very long number that the encryption algorithm uses to hide your message, information,
    or files from unauthorized users.


    A description of the mathematical process of encryption is beyond the scope of
    this book, but it suffices to say that you need a key to encrypt information and
    a key to decrypt it. SSL uses a type of encryption public-key encryption. Public-key
    encryption works by having the server a secret key and the client use a public
    key. The public key can be known and used by anyone and everyone; the public key
    must be kept secret and known only to the server.


    Public-key encryption has an advantage over other encryption types because distributing
    public keys across a medium such as the Internet is easy. It sounds counterintuitive,
    but public-key encryption does work.


    # Identification


    All the encryption in the world is useless if you''re trying to connect into the
    wrong Web server. Suppose that you want to purchase a book from Amazon.com. You
    fire up Mozilla, connect to www.amazon.com, and happily enter your credit card
    number, expecting to receive your book by the next day. It never comes.


    In this scenario, some clever hacker has injected DNS information into the Internet,
    and your browser has connected to www.hackazon.com. (Your browser looked up the
    numeric IP address of Amazon.com, but was deceived and received the address of
    the hacker''s fraudulent Web server.) In this case, encryption worked just as
    it was supposed to, and prevented other hackers from intercepting your credit
    card. However, it didn''t ensure that the Web server was what you thought it was,
    and now the hacker is enjoying a wonderful vacation in Cancun—the real one—(Doh)


    SSL identification is based on the concept of a certificate. Certificates contain
    the public key you need in order to set up an encrypted connection and additional
    information to verify the identity of the Web server. The certificate also comes
    with information who created it, when it was created, and how it was created.
    After you obtain a certificate from the Web server you''re connecting to, you''re
    ready to safely conduct business. (Huh? What good does that do if you''re connecting
    to the hacker''s server? The certificate ensures you connect securely to the bad-boy
    site.)'
  merge: -1
  img_proc: true
- pgno: 270
  md: "# Chapter 17: Securing Your Future 251\n\nThe problem is solved using a go-between\
    \ called a certificate authority (CA). When you connect to a secure Web server,\
    \ it sends you your certificate. The Web server also subscribes to a CA. The CA\
    \ has investigated the subscribing Web server and — if satisfied with its authenticity\
    \ — vouches for its identity. If the CA is on your list of known CAs, you accept\
    \ the certificate and use the public key to verify the server's identity and set\
    \ up the encrypted connection.\n\n# Protecting your Web server with SSL\n\nA Web\
    \ server requires a certificate — a special code used to verify the Web server\
    \ to its clients. The steps in this section describe how to create the certificate\
    \ and work with a certificate authority (CA).\n\nYou can view a list of all the\
    \ CAs your browser knows about. Follow these steps to view the CA:\n\n+   1. Choose\
    \ Mozilla Edit: Preferences.\n   The Preferences dialog opens.\n2. Expand the\
    \ Privacy & Security menu by clicking the plus (+) sign immediately to the left\
    \ of the menu option.\n3. Click the Certificates menu.\n   The Certificates subwindow\
    \ opens.\n4. Click the Manage Certificates button.\n   The Certificate Manager\
    \ window opens behind the Preferences window.\n5. Click the upper margin of the\
    \ Preferences window and move it so you can see the Certificate Manager window.\n\
    6. Click to select the Authorities tab and you see a list of all CAs that your\
    \ browser knows.\n\nYour browser automatically accepts the certificate from any\
    \ secure Web page you visit that subscribes to one of these CAs.\n\nIt costs time\
    \ and money to subscribe to a CA, of course. However, you don’t necessarily need\
    \ to spend the money if you intend to use your secure Web server for personal\
    \ use (or just to experiment). We show you how to construct a certificate and\
    \ then use it without registering it with a CA.\n\nThese steps outline the general\
    \ process of creating a certificate:\n\n+   1. Install the SSL software.\n2. Create\
    \ your Web server's private key."
