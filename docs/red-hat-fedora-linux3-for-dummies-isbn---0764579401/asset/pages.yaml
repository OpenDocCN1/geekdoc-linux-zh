    # Resizing NTFS partitions with a little PartitionMagic


    Resizing NTFS requires the use of commercial tools, such as Norton Ghost

    (www.norton.com) or PartitionMagic(www.symantec.com/partitionmagic).

    PartitionMagic works by shrinking the Microsoft Windows partition, leaving

    free space for a new partition. Norton Ghost 2003, however, doesn''t dynamically
    modify your existing NTFS file system. Instead, it backs up your existing

    Windows partition (takes a "snapshot") and then creates one or more new par-

    t over the original. Finally, it writes the original Windows image to the

    new partition. Ghost requires a storage device to save the snapshot

    image. If your Windows installation is relatively small (less than 4GB),

    might be able to use a writable DVD or (for a snapshot of less than 1GB) even
    a

    writable CD-ROM as a storage device. However, you will have to use a special hard

    drive, tape backup, or other backup mechanism for installations.


    We describe in this section how to use PartitionMagic. We don''t use Norton

    Ghost, even though it''s an excellent tool, because we can''t assume that you

    have enough backup resources to use it. (If you want to use Ghost, you

    need a backup method that''s large enough to store your entire Windows

    installation.) PartitionMagic doesn''t give you all the warm fuzzies of getting
    a

    backup along with your resizing, but it still works very well. We have used it
    a

    number of times with good results.


    These steps describe how to install PartitionMagic:


    +   1. Get out your credit card, go to your friendly computer store

    (or online to your Internet store), and buy PartitionMagic 8

    from Symantec.'
