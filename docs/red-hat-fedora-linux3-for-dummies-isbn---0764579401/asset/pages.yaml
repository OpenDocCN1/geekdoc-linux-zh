    +   4. Enter the following command to remove the Mozilla e-mail:

    - rpm -e mozilla-mail


    # # Introducing YUM


    The Yellowdog Updater, Manager (YUM) is simply put, a wonderful system. YUM takes
    software installation and management to the next level by providing functions
    that RPM doesn''t:


    +   Takes over the task of finding and obtaining software packages: YUM can download
    packages from the Internet (or a private network), a DVD or CD-ROM, or over your
    hard disk.


    +   Computes dependencies: If you want to install an RPM package that happens
    to require the installation of other packages, you usually have to determine what
    packages are found, and install them manually.


    +   Updates your computer: YUM can update your entire Fedora computer as well
    as install and remove individual packages or groups. RPM can update individual
    packages, but not your entire system. The YUM update option performs the same
    function as the Red Hat update system.


    YUM is easy to configure, and can access multiple software repositories (mirrors).
    Here''s the default YUM configuration, /etc/yum.conf:


    ```

    cachedir=/var/cache/yum

    debuglevel=2

    logfile=/var/log/yum.log

    pkgpolicy=newest

    ```'
  merge: -1
  img_proc: true
- pgno: 370
  md: '# Appendix E: Revving Up with RPM and YUM


    ```

    distroverpkg=fedora-release

    tolerant=1

    exactarch=1

    clude=


    [base]

    name=Fedora Core $releasever - $basearch - Base

    baseurl=http://fedora.redhat.com/releases/fedora-core-

    $releasever


    [updates-released]

    name=Fedora Core $releasever - $basearch - Released Updates

    baseurl=http://fedora.redhat.com/updates/released/fedora-

    core-$releasever


    #[updates-testing]

    name=Fedora Core $releasever - $basearch - Unreleased

    Updates

    baseurl=http://mirrors.kernel.org/core/test/1.90/$bas

    earch/os

    ```


    The YUM configuration options are shown in this list:


    +   -cachedir**: This option sets the location where YUM stores RPM packages and
    their headers (storing the files and other information about the package). YUM
    downloads the RPM packages (and headers) before installing or updating them. The
    default is /var/cache/yum/directory.

    - **debuglevel**: This option sets the detail level of information that is transmitted
    to the log. The range is 0 to 10, where 0 is no information and 10 is too much
    information. The default is 2.

    - **logfile**: The location of the log file. If not found, the default location
    is /var/log/yum.log; /var/log is the default location for most, if not all, Linux
    files.

    - **pkgpolicy**: There are two options: newest and last. The newest option tells
    YUM to install the most recent version of a package. The last option selects the
    package found on the last server in an alphabetical list of servers. We can think
    no reason to use the last option.

    - **distroverpkg**: Your Fedora Core computer contains an RPM package named Fedora-release.
    This package contains information about your version of installation. (Red Hat
    Linux computers contain a package named redhat-release that contains the same
    type of information.) Because YUM is platform independent (it works on multiple
    Linux distributions), this option tells YUM where to look for the distribution
    name and version number. The default is **tolerant**: YUM can be strict or not
    so strict. When tolerant is set to 1 (the default), YUM ignores minor errors that
    occur during its operation.'
  merge: -1
  img_proc: true
- pgno: 371
  md: '# 352 Part VI: Appendixes


    +   - exactarch: YUM can also be strict about the architecture of the packages.
    When YUM is set to its default of 1, it doesn''t install an i386 if the installed
    package is i686.


    +   - exclude: You can tell YUM not to install certain packages. For example,
    if you don''t want YUM to automatically update your Linux kernel, set exclude=kernel*


    The remaining contents of /etc/yum.conf contain the Server sections. These sections
    tell YUM where to look for RPM packages. The Server sections also tell YUM the
    general purpose of the packages. The following list describes each Server option
    in more detail:


    +   - server: The server identification (server) field tells YUM which type of
    software repository it contains (known as a channel by the Red Hat up2date system).
    Fedora Core is configured to work with the following types: base


    ![](img/019b0d727ede29f1ccb08789667e950f_371_0.png)


    By the time you read this book, the Development Repository will include the software
    destined to become Fedora Core 4 (or beyond, depending on when you read this book).
    You can participate in the Fedora Core by downloading and installing the Fedora
    Core 3 Test distribution. Alternatively, you can use YUM to update your computer
    from the Development repository. That''s what we did while writing this book.


    +   - name: This option sets a description for the serverid that is displayed
    when you run YUM.


    +   - baseurl: This option points to the server repository URL. You can use the
    base, updates-released, updates-testing, and development repository types. The
    default URL is fedora.redhat.com, but you can add one or more.


    For example, you can change the server ID to


    ```

    baseurl=

    http://fedora.redhat.com/releases/

    fedora-core-$releasever/

    http://mirrors.kernel.org/fedora/

    $releasever/i386

    ```


    This example provides YUM with two repositories to use (in sequence); if one is
    unavailable, the other is. Note that each mirror uses slightly different directory
    structures to store repository. The Fedora Core''s default repository download.fedora.redhat.com
    uses /fedora/linux/core/3/i386/os as its base directory, but'
  merge: -1
  img_proc: true
- pgno: 372
  md: '# Appendix E: Reving Up with RPM and YUM 353


    ```

    mirrors.kernel.org uses /fedora/core/i386/os. YUM works as

    long as baseurl points to the location in the repository where the head-

    ers directory is found. For example, if you browse the mirror site lime

    stone.uoregon.edu, you find the headers directory at /fedora/

    i386/os, although /fedora/core/i386/os contains the headers at

    mirrors.kernel.org.

