    +   * The new password should be different from the one you use for root.


    As you type the password, a line of asterisks (rather than the actual password)
    appears on-screen over your shoulder as you type. (Fedora Core is showing its
    para-side not here.) In text mode, you don''t get feedback, such as asterisks
    or other characters.


    +   * Among your many choices for a default shell, /bin/bash is a popular shell
    that is the default for Fedora Core.


    # 4. Click OK.


    Your account is created.


    Fedora Core uses the Pluggable Authentication Module (PAM), which prevents you
    from entering trivial or otherwise dangerous passwords; don''t assume that assurance,
    however, that your new password is a good one. A bad password cannot be found
    in any dictionary because password crackers have programs that automatically try
    all dictionary words to crack your password. Avoid birthdays and anniversaries
    or anything could associate with you. For ideas about good passwords, check Chapter
    3. Just don''t forget it, and *don''t* write it on a sticky note and put it on
    your monitor!


    ![](img/019b0d727ede29f1ccb08789667e950f_77_1.png)'
