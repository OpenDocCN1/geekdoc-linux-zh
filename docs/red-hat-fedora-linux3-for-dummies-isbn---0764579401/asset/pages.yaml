- pgno: 354
  md: '# Changing File Ownership and Granting Permissions


    All Linux files and directories have owners and are assigned a list of permissions.
    This system of ownership and permissions forms the basis for restricting and allowing
    users'' access to files. File permissions can also be used to specify whether
    a file is executable as a command and to determine who can use the file or command.


    Files and directories are owned by user accounts. User accounts are defined in
    the /etc/passwd file. For example, you created the root (superuser) account when
    you installed Fedora Core in Chapter 3, and the installation system created the
    superuser home directory, root. The root user owns all those files and directories.
    For example, bashrc. The root user owns a regular account—for example, lidia—user''s
    home directory and configuration files are all owned by user lidia. Users can
    access and modify any files or directories they own.


    Files and directories have group ownership in addition to user ownership. Groups
    are defined by the /etc/group file and provide a secondary level of access. For
    example, you can assign group ownership to files you own and allow other users
    who belong to the group to access those files.


    Files and directories are assigned permissions that permit or deny read, write,
    and execute access. Permissions are assigned to the owner, group, or non-owner
    of the file or directory. Any non-owner is referred to as other. Permissions for
    the owner, group, and for any others are independent of each other.


    Using the ls command with the -l option allows you to see the file permissions
    along with other relevant information, such as who owns the file, group of people
    have permission to access or modify the file, the size of the file or directory,
    the last time the file was modified, and its name.


    Create a file and then list it:


    ```

    touch gotwork

    ls -l gotwork

    ```


    You get this:


    ```

    -rw-rw-r-- owner 0 Jul 26 16:00 gotwork

    ```


    -rw-rw-r-- characters are the permissions for the gotwork file: The owner is you,
    and the group (though it''s probably you) may be someone or something else, depending
    on how your system is set up and administered.'
  merge: -1
  img_proc: true
- pgno: 355
  md: '# 336 Part VI: Appendixices


    You may be wondering how you can become an owner of a file. You''re auto-matically
    the owner of any file you create, which makes sense. As the owner, you can change
    the default file permissions — and even the ownership. If you change the file
    ownership, however, you lose ownership privileges.


    To change the ownership of a file or a directory, use the chown (change-ownership)
    command. You generally have to use the root to do this.


    Suppose that you have decided to settle down and lead a more contemplative life,
    one in line with a new profession of haiku writing. Someone else will have to
    plan the weekend spends and all-night battles. You give up ownership-of the gototwork:


    ```

    chown root gototwork

    ```


    This command changes the ownership of gototwork to the root. To change back, you
    can use the chown command, but you have to do it as root.


    Files and users belong to groups. In the gototwork example, the group consists
    of users. Having groups enables you to give large numbers of users — not all users
    — access to files. Group permissions and ownership are handy for making sure the
    members of a special project or workgroup access to files needed by the entire
    group.


    To see which groups are available to your system, look at the file /etc/group.
    Use the more command and you see a file something like this:


    ```

    root:x:0:root

    bin:x:1:bin,daemon


    nody:x:99

    users:x:100

    floppy:x:19

    ...

    your_user_name:500:your_user_name

    ```


    where_user_name is the name you use for your account. Remember that the file doesn''t
    look exactly like this — just similar. The names at the beginning of the line
    are the group names. The names at the end of the line (such as root, bin, and
    daemon) are user-group names that can belong to the user-group list.


    To change the group file belongs to, log in as root and use the chgrp command.
    Its syntax is the same as that of the chown command. For example, to change the
    group that gototwork belongs to, you issue this command:


    ```

    chgrp newgroup gototwork

    ```'
  merge: -1
  img_proc: true
- pgno: 356
  md: '# Appendix C: Filing Your Life Away


    Fedora Core assigns a unique group to each user. For example, when you add the
    first user to your system, user gets the user ID and group ID of 500. The next
    user receives the user ID and group ID of 501, and so on. This system gives you
    levels of control over what accesses to your files.


    # Making Your Own Rules


    You, as the owner of a file, can specify permissions for reading, writing to,
    or executing a file. You can also determine who (yourself, a group of people,
    or everyone in general) can do these actions on a file. What do these permissions
    mean? Read on (you have have permission):


    +   **Read permission:** You can read the file. For a directory, read permission
    allows the ls command to list the names of the files in the directory. You must
    also execute permission for the directory name to use the -l ls command or change
    to that directory.

    **Write permission:** You can modify the file. For a directory, you can create
    or delete files inside that directory.

    **Execute permission:** You can type the name of the file and execute it. You
    cannot view or copy the file unless you have read permission. Files containing
    executable Linux commands, called shell scripts, must therefore be both executable
    and readable by the person executing them. Programs written in a compiled language,
    such as C, however, must have only executable permissions, to protect them from
    being copied where they shouldn''t be copied.


    For a directory, execute permission means that you can change to that directory
    (with cd). Unless you also have read permission for the directory, ls doesn''t
    work. You can list directories and files in that directory or directories using
    just an ls -l command. This arrangement may seem strange, but it works for security.


    The first character of a file permission is a hyphen (-) if it is a file; the
    first character of a directory permission is d. The nine other characters are
    read, write, and execute positions for each of the three categories of file permissions:


    +   - Owner (also known as the user)

    - Group

    - Others'
  merge: -1
  img_proc: true
- pgno: 357
  md: '# 338 Part VI: Appendices


    Your gotowork file, for example, may show the following permissions when it''s
    listed with the `ls -l gotowork` command:


    ```

    -rw-rw-r--

    ```


    The hyphen (-) in the first position indicates that it''s a regular file (not
    a directory or other file). The next characters (`rw-`) are the owner''s permissions.
    The owner can read and write to the file, but cannot execute it. The next three
    characters (`rw-`) are the group''s permissions. The group also has read-write
    access to the file. The last three characters (`r--)`) are the others'' permissions,
    which are read-only.


    `[-rw][rw-][r--]` illustrates the four parts of the file type followed by three
    sets of triplets, indicating the read, write, execute permissions for the owner,
    group, and *other users* (meaning *everyone else*).


    You can specify file permissions using only six letters:


    +   - `ugo` stands for no, not a funky 1980s car — *user* (that is, owner), group,
    and other.

    - `rwx` stands for read, write, and execute.


    These six letters, and some symbols — such as the equal sign (=) and commas —
    are put together into a specification of how you want to set the file''s permissions.


    The command for changing permissions is `chmod`. Here''s its syntax:


    ```

    chmod specification filename

    ```


    Change the mode of `gotowork` to give users the ability to read, write, and execute
    a file:


    ```

    chmod u=rwx gotowork

    ```


    That was easy enough. What if you want to give the group permission to only read
    and execute the file? You execute the following command:


    ```

    chmod g=rx gotowork

    ```


    This command doesn''t affect the permissions for owner or other — just the group''s
    permissions. You can set the permission bits in other ways. But because this way
    is so simple, why use any other?'
  merge: -1
  img_proc: true
- pgno: 358
  md: '# Appendix D


    # Becoming a Suit: Managing the Linux File System


    In This Appendix


    +   - Mounting and unmounting a file system

    - Increasing disk space with a new drive or memory stick


    Managing the Linux file system isn''t a complex job, but it''s an important one.
    You have the responsibility of managing the Linux file system and ensuring that
    users (even if you''re the only user) have access to secure, uncorrupted data.
    You''re the manager (yes, — gag — a suit) of your file system.


    This appendix introduces you to managing your Linux file system. Consider yourself
    a management trainee. When you''re done reading this appendix, feel free to take
    a nice, long, expensive lunch.


    # Mounting and Unmounting a File System


    Fedora Core and other Unix-like operating systems use files in different ways
    from MS-DOS, Windows, and Macintosh operating systems. In Linux, every-thing is
    stored as files in predictable locations in the directory structure; Linux even
    stores commands as files. Like other modern operating systems, it has a tree-structured,
    hierarchical directory organization: the file system.


    All user-available disk space is contained in a single directory tree. The base
    of this system is the root directory (not to be confused with the root user),
    designated with a slash (/). A file system''s contents are made available to Linux
    by using the mounting process. Mounting a file system is set up to make Linux
    aware of the files and directories it contains. This process is just like mounting
    a horse — except no horse is involved, and anyway you''d dismount from a horse.
    Maybe we''d better forget the horse.


    Unlike in the Windows world, all Linux file systems except for /root must be mounted
    or unmounted, which means that file systems can be (respectively) connected to
    or disconnected from the directory tree.'
  merge: -1
  img_proc: true
- pgno: 359
  md: '# Part VI: Appendixes


    # # Mounting Windows files from a floppy disk


    The process of mounting and unmounting a floppy file system provides a good example
    of the difference between Linux and Windows. If you use a floppy disk or CD with
    Windows, you just insert it into the drive and have immediate access to what''s
    on it. With Linux, you must insert the floppy disk into the drive and explicitly
    mount it. Sound complicated? Not really.


    You can mount a Windows hard-drive partition or floppy-disk drive on your Linux
    computer. You can read and write to FAT or FAT32, but can only read from NTFS
    file systems. Here is how to mount a Windows disk:


    +   1. Insert a Windows MS-DOS-formatted floppy disk into the drive, click the
    GNOME Menu button, and choose System Tools: Management. Enter the root password
    if it''s requested.


    +   2. Select the floppy disk and click the Mount button.


    You know that the floppy disk has been mounted successfully when a floppy-disk
    icon shows up on the left side of the screen.


    You can now read and write to the floppy disk (unless the read-only tab on your
    disk is set).


    ![](img/019b0d727ede29f1ccb08789667e950f_359_0.png)


    +   3. Click the Close button to close the utility.


    Fedora Core and GNOME are automatically configured to start the process that mounts
    your floppy disk or CD when you insert it into the drive. We use the manual method
    to show how the process works. To mount the floppy disk manually from the command-line
    interface, log in as root, open the terminal window, and run the following command:


    ```

    mount -t msdos /dev/fd0 /mnt/floppy

    ```


    # # Unmounting file systems


    Unmounting a Linux file system is a little simpler than mounting one. Because
    the file system is already mounted, you don''t have to specify any options or
    information. You just have to tell the Red Hat disk management droid to unmount
    the file system. Follow these steps:


    +   1. Click the Main Menu button and choose System Tools: Disk Management. Enter
    the root password, if you''re prompted.


    +   2. When the User Tool window appears, click the button of the file system
    in which you''re interested.'
  merge: -1
  img_proc: true
- pgno: 360
  md: '# Appendix D: Becoming a Suit: Managing the Linux System


    The button indicates whether the file system is mounted or unmounted.

    After a few seconds, the button label changes from Unmount to Mount

    show that the file system has been unmounted.


    3. Click the Close button to exit the utility.


    The file system is unmounted. If the file system is a removable type,

    such as a floppy disk or CD, you can remove it. Otherwise, the file

    system is not available for use until you remount it.


    ![](img/019b0d727ede29f1ccb08789667e950f_360_0.png)


    You can run the eject command from a bash to eject a CD. You have to

    unmount the CD first and enter the eject command. Otherwise, to eject

    a CD, you must unmount it then press the eject button on the CD-ROM

    drive. In other drives, you cannot eject the CD until you have unmounted it.


    # Adding a Disk Drive


    Sooner or later, life catches up with you, and you''re likely to need or want
    a

    bigger house or car or a diamond in your tooth, or whatever. The same goes

    to disk space, in which case you want to add another disk drive.


    The first step to increasing your drive space is to add a new storage device.
    It

    be a hard drive (IDE or SCSI) or a USB or FireWire memory stick. These

    steps describe the general process of adding a storage device and then for-

    matting and mounting it:


    +   1. Install the hard drive or insert the USB or FireWire device.


    If the device is an IDE or SCSI drive, turn off the power to your com-

    puter and monitor. Unplug the power cable and open the case.

    (Don''t cut yourself on the sometimes-sharp metal edges when you''re

    reaching into the computer). Use the electrostatic strap that comes with

    hard drive; follow the instructions included with the strap.


    Most PCs use IDE controllers. SCSI-based PCs are more expensive and

    aren''t commonly owned by consumers; these SCSI types are more

    common in the commercial realm. IDE-based PCs have two IDE-

    trollers. Each device can control as many as two IDE devices. Ribbon

    cables connect the controller to the devices.


    ![](img/019b0d727ede29f1ccb08789667e950f_360_1.png)


    You have to configure your new disk to function as a slice device if it''s

    connected to a ribbon cable or IDE controller that already has another

    device (hard drive or CD-ROM) attached.


    If the device is a USB or FireWire memory stick, skip to Step 3.


    +   2. Reboot your computer and run the dmesg command from a GNOME

    Terminal window.'
  merge: -1
