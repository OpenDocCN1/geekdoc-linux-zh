  md: "# 208 Part IV: Revenge of the Nerds\n\nFollow these steps to create your Internet\
    \ gateway firewall:\n\n+   1. Log in to your computer as root and open a GNOME\
    \ Terminal window, by right-clicking any empty portion of the desktop and choosing\
    \ Open Terminal from the menu.\n\nAlternatively, you can click the GNOME Menu\
    \ and choose System Tools\\▸Terminal.\n\n+   2. Enter this command to turn off\
    \ any running firewall:\n\n```\nservice iptables stop\n```\n\n+   3. To save the\
    \ default Fedora firewall configuration, type mv /etc/sysconfig/iptables /etc/sysconfig/iptables.bak\n\
    \n+   4. Start by denying all network traffic on all devices, by entering these\
    \ commands:\n\n```\niptables --policy INPUT DROP\niptables --policy OUTPUT DROP\n\
    iptables --policy FORWARD DROP\n```\n\n+   5. To allow outgoing and incoming traffic\
    \ on the loopback device, type\n\n```\niptables -A OUTPUT -j ACCEPT -o lo\niptables\
    \ -A INPUT -j ACCEPT -i lo\n```\n\n+   6. To type the following lines to allow\
    \ all outgoing and incoming traffic on the internal NIC:\n\n```\niptables -A OUTPUT\
    \ -j ACCEPT -o eth0\niptables -A INPUT -j ACCEPT -i eth0\n```\n\n+   7. To allow\
    \ outgoing connections from the firewall, enter these commands:\n\n```\niptables\
    \ -A OUTPUT -m state\n  state NEW,RELATED,ESTABLISHED -j ACCEPT\niptables -A INPUT\
    \ -m state\n  state ESTABLISHED,RELATED -j ACCEPT\n```\n\nThese rules allow processes\
    \ running on the firewall computer to connect to the Internet.\n\n+   8. To forward\
    \ all traffic from the internal NIC to the external NIC, type these lines:\n\n\
    ```\niptables -A FORWARD -i eth0 -m state\n  --state NEW,ESTABLISHED,RELATED -j\
    \ ACCEPT\niptables -A FORWARD -i eth1 -m state\n  --state ESTABLISHED,RELATED\
    \ -j ACCEPT\n```\n\nThe first rule allows outgoing traffic via the internal NIC\
    \ (eth0). The second rule forwards the return traffic back into the private network\
    \ via the external NIC (eth1)."
