- pgno: 31
  md: '# 12 Part I: Installing Fedora Core


    In 1991, a student at the University of Helsinki named Linus Torvalds became dissatisfied
    with the standard PC operating system. He thought that the Unix operating system
    might be better suited than MS-DOS or Windows to help accomplish his work. Unix
    was invented in the 1970s, and although it was expensive, so he began writing
    his own version of Unix. Now, writing your own operating system is a simple task—
    not! After formulating the basic parts, Torvalds recruited a team of talented
    programmers through the Internet, and together they created a new operating system,
    or kernel, now Linux


    One of the most important decisions that Torvalds made in the early days of Linux
    was to freely distribute the Linux kernel code for anyone and everyone to do as
    they wanted. These free Linux distributions were (and are still) available in
    several forms, mainly on-line.


    The only restriction Linux imposed on the free distribution of creation was that
    no version of the software can be proprietary. (Proprietary software is owned
    and developed by private companies in places often rival Area 5 in security. However,
    open-source code is for “the people”— anyone can use and develop it without violating
    copyrights or patents.) You can modify it to your heart''s content and also distribute
    it for fun or profit. You can''t stop anyone else from using, modifying, and distributing
    the software you modified.


    Think of open-source software as a path. Linux and others started building the
    path, and many people came along and found it useful. You can use the path, make
    it wider, and add another branch, if you want—but you can''t stop anyone from
    using the original path or the section you added; neither can you prevent people
    from adding their own branches.


    The lack of traditional proprietary software restrictions on Linux has led to
    continued improvements and innovations in its technology—and its immense popularity.
    Open-source software, and Linux in particular, is transparent to all users and
    developers. This transparency allows people throughout to rapidly improve Linux
    and its associated subsystems. In contrast, proprietary operating systems are
    like a sealed, black box where no one except a small group of privileged insiders
    knows what goes inside. Only that select group can make modifications, and that
    limits innovation and improvements.


    Return to our brief history: In early spring 1994, the first version of Linux
    (Version 1.0) was available for public use. It was very exciting. Even then, it
    was an impressive operating system that ran smartly on computers with less than
    2MB of RAM and a simple 386 microprocessor. Linux 1.0 included free features for
    which other operating systems charged hundreds of dollars. Nowadays, tens of millions
    of users enjoy Linux at home and work.'
  merge: -1
  img_proc: true
- pgno: 32
  md: '# Chapter 1: And in the Opposite Corner... a Penguin?


    # Free Software?


    The Free Software Foundation (FSF), the child of the great Richard Stallman, contributes
    much of the utilitarian software that makes Linux much easier. Most of its bread-and-butter
    utilities and commands, such as ls and cat, come from the FSF. Stallman is considered
    by many to be the originator of the open-source movement.


    By the way, if you''re wondering about the whole penguin thing, the answer is
    simple: Linus loves penguins. The Linux world naturally started using the bird
    as its symbol. The friendly and familiar penguin (whose name is Tux, by the way)
    now symbolizes All Things Linux.


    ![](img/019b0d727ede29f1ccb08789667e950f_32_0.png)


    # Knowing What You Can Do with Fedora Core


    Fedora Core combines all those pieces, plus some additional applications, and
    then goes another step to add a few of its own to create an integrated product.
    The Fedora Core Project brings the basic Linux operating system with software
    (some made by other companies and some made by Red Hat) to produce a package with
    a value that is greater than the sum of its parts. That combination is known as
    a distribution, or flavor, of Linux.


    To get up and running as quickly as possible, we have bundled the Fedora Core
    3 distribution on the DVD in the back of this book.


    If you cannot use DVDs, you can get the Fedora Core 3 distribution on CD-ROMs
    by sending the coupon in the back of this book.


    ![](img/019b0d727ede29f1ccb08789667e950f_32_1.png)


    Fedora Core (and in its previous life, Red Hat) was initially used almost solely
    to provide network-based services such as Web pages. However, the company Red
    Hat,—with many open-source developers (such as the GNOME Project)—started working
    to make Linux suitable for the desktop. The result is that Fedora Core is now
    used in both server and desktop environments. It''s used by individuals, businesses,
    and governments to cut costs, improve performance, and just plain get work done.


    You can use Fedora Core as a desktop workstation, an Internet gateway, a firewall,
    the brains of an embedded system (for, say, a smart VCR or refrigerator), or even
    as the brains of a multiprocessor'
  merge: -1
  img_proc: true
