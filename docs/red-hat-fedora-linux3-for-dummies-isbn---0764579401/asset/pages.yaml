    # # Hide Your Communications with OpenSSH


    You may find it to trust communication media that you don''t completely control
    — such as university LANs, wireless home networks, and the Internet. Our (and
    Agent Muler''s) point: Trust no one!


    The Secure Shell (SSH) protocol is used to conduct encrypted CLI (command-interface)
    terminal sessions and file transfers. Fedora Core bundles OpenSSH with its distributions.
    When you install Fedora Core, you automatically get the OpenSSH client. You can
    use OpenSSH from a terminal by entering the command ssh destination. The destination
    is the computer you want to communicate with. You can get information about OpenSSH
    from www.openssh.org.


    Using encryption is essential when you use wireless networking. Wi-Fi (also 802.11b
    or 802.11g) wireless networks have built-in encryption based on the WEP (Wired
    Equivalent Protocol). WEP does have some security vulnerabilities, though. The
    long-term answer is to wait until the next standard comes to fix the problem,
    or use OpenSSH to provide your own encryption. You''re much safer if you use OpenSSH
    and SSL for as much of your communication as possible.


