- pgno: 105
  md: '# 86 Part II: Got Net?


    If you configured your Ethernet card to connect to your LAN during the installation
    process we describe in Chapter 3, that''s great! You can skip this chapter or
    just browse through it for fun. Otherwise, you can use this chapter to connect
    your computer to a LAN.


    # Introducing Local-Area Networks


    The invention of Linux revolutionized computer networking. Creating a LAN before
    Linux existed was expensive and complicated. LANs were the nearly exclusive domain
    of big corporations, universities, and such.


    But networking was built into Linux, in the form of the TCP/IP networking protocols,
    from the beginning. In the mid-1990s, if you could afford a couple of PCs, a cheap
    piece of coaxial cable, and a couple of Ethernet adapters, a LAN was born. Ethernet
    adapters, also known as network interface cards (NICs), cost about $150 or more
    at the time. Prices, furiously, have crashed since then, falling ever faster than
    a middle-aged rock star. A 100Mbps NIC now costs as as $10, and you can buy an
    11Mbps wireless NIC for less than $50 (54Mbps 802.11g cards fetch for not much
    than $50).


    To get your Fedora Core connected to your network, however, you will have to configure
    a handful of networking subsystems. Here are the tasks that have to be done for
    your network to work:


    +   - Install your wireless or Ethernet NIC. Most computers, laptops and desktops
    come preinstalled Ethernet NICs. Many laptops also come equipped with Ethernet
    NICs. If you need to retrofit an NIC, follow the instructions that come with the
    device.

    - Load your wireless or Ethernet NIC kernel module. Fedora Core detects your hardware
    and automatically loads the correct kernel modules.

    - Configure your NIC''s IP address, network, and gateway.

    - Configure your Domain Name Service (DNS), which converts Internet names into
    Internet Protocol (IP) addresses.


    Wireless networking (or Wi-Fi, as explained in an upcoming sidebar) suffers from
    some security vulnerabilities. Consult the "Wireless networking warning" sidebar,
    later in this chapter.


    Performing these steps requires "heavy lifting." Your load is eased considerably
    by using the graphical Network Configuration Utility, a system-administration
    tool that comes with Fedora Core. Have fun!'
  merge: -1
  img_proc: true
- pgno: 106
  md: '# Configuring Your NIC with the Fedora Core Network Utility


    To use your Fedora Core computer with an existing local-area network (LAN), you
    need at least two pieces of hardware:


    +   - A wireless or Ethernet NIC (network interface card) installed on your computer

    - A network hub, switch, or wireless access point to connect to the NIC


    After you set up the hardware, the next step is to configure your Fedora Core
    network settings.


    # Preparing to configure your wireless NIC


    Before you can configure your wireless NIC, you need to figure out two things:


    +   - The type of wireless NIC you have (or need)

    - How your wireless NIC should connect to your network


    The two most widely used types of 802.11b (11Mbps) wireless electronics (or chip
    sets) are by Wavelan (built by Levant Technologies) and Prism2 (designed by Intersil).
    Fedora Core supports both. There are some details (manufacturers and on) to help
    figure out what kind of chip your device uses:


    +   - Wavelan: Orinoco is the leader here; other (less popular) models include
    Apple Entersys RoamAbout82, Esa AirLancer 11, and Melco/Buffalo 802.11b.

    - Prism2: D-Link DWL-650, LinkSys, Netgear, WPC11, and Compaq WL180; other, less
    popular models include Additon AWP-100, Bromax Freetop, GemTek WL-211, Intel/Nokia,
    SMC 2632W, YDI, Z-COM X1300, and Telephonics ZoomAir 4100


    At the time this was written, the newest available wireless protocol was 802.11g.
    Technology to build this can run up to 54 Mbps, roughly five times the speed of
    an 802.11b system. However, there are not many drivers available for this technology
    yet. The Prism54 project is busy developing open-source Linux drivers for the
    802.11g protocol, so please check www.prism54.org to see whether your wireless
    card has a driver (by the time you read this chapter). One company, Linux, sells
    software that allows your Linux computer to use Microsoft drivers. Consult their
    Web site www.linux ant.com for more information about their product.'
  merge: -1
  img_proc: true
- pgno: 107
  md: '# 88 Part II: Got Net?


    # IEEE, Wi-Fi, and wireless networks


    | IEEE (pronounced "eye-triangle-e"), Institute of Electrical and Electronic Engineers,
    is a world-wide professional society of nerds (specifically, those who care enough
    about technical matters to set consistent standards) The IEEE, the "triclops"
    of wireless networking one three Es, et get?), concerns itself with issues such
    as frequency wireless networking devices should use. Fortunately, this group has
    devised this wonderful standard that that now | enables everyone who''s interested
    to communicate without stringent wires between machines. The dominant wireless
    standard is a combination of ingredients. It''s based partly on the IEEE 802.11b
    band (also called Wi-Fi, for wireless fidelity) — and two older standards (802.11a
    and the more recent 802.11g). Hey, call it shorthand: if you hear people talking
    about a Wi-Fi NIC, they''re just talking about wireless NICs.


    The first order of business is to figure out how your wireless NIC (or network
    adapter) should connect to your network. Wireless NICs connect to a LAN in two
    ways:


    +   * Adapter to adapter: This type, referred to as an ad-hoc connection, is useful
    if you have two or more computers that you want to talk and form their own, exclusive
    private network.


    +   * Adapter to wireless access point: This type, provides a single entrance
    (an access point) into a LAN. An access point allows one or more computers to
    be connected to a network. However, unlike an ad-hoc network, the individual computers
    can connect to any access point that allows them to.


    The wireless-configuration instructions we provide work with either the infrastructure
    or ad hoc connection methods. Your wireless NIC can connect to either the access
    point or other computers (Linux and Windows) as long as you correctly configure
    your network ID (ESSID) and your encryption key.


    # Why ad-hoc is better than infrastructure


    Using ad-hoc mode provides several advantages:


    +   * Lower costs: You don''t have to purchase an access point; access points
    starts around $50. Computers using wireless NICs running in ad-hoc mode communicate
    directly with each other, eliminating the need for'
  merge: -1
  img_proc: true
- pgno: 108
  md: '# Chapter 7: Connect Locally, Communicate Globally: Connecting to a LAN


    +   - Simpler configuration for Linux users: Older access-point devices could
    be configured using only Windows-based software — using the simple network-management
    protocol (SNMP), to be exact. You had to physically connect a Windows computer
    to the access point via a wired Ethernet, and then use the software supplied with
    the device. That was difficult if you didn''t have any Windows-based computers.
    Newer access points tend to use Web-based configuration tools, so you can use
    Mozilla to configure these newer devices.


    +   - Ad-hoc networks eliminate the need to configure any access points: You configure
    only the wireless NIC in each computer on your network. You can use the Fedora
    Core Network Configuration utility to configure a wireless NIC, which simplifies
    the process. Each NIC must have the same network ID and encryption key.


    Ad-hoc networks can also provide a bit more security because they connect to other
    networks — and the Internet — through a network router. Routers enable IP addresses
    and decide where to direct traffic from one network to another. Bridges automatically
    pass on all traffic. Ad-hoc networks can be configured to more tightly — but not
    completely — control network traffic than access-pointbased networks. Ad-hoc networks
    with firewalls are easier to configure than networks that use access points. (Many
    current access points now provide NAT and firewall support; using NAT effectively
    creates a firewall.)


    # Configuring your Ethernet or wireless NIC


    To get your Fedora Core computer working on a LAN, you must first configure its
    interface card, or NIC. The NIC is the device that electronically connects your
    computer to your LAN. To work with the other computers on your network, your Ethernet
    or wireless adapter must be given a network address and a few pieces of information.


    We have divided the configuration instructions between Ethernet and wireless NICs.
    The instructions start by showing how to use the Fedora Core Network Configuration
    Utility. We then devote a subsection apiece to describing the particulars of configuring
    Ethernet and wireless devices. After we cover the device specifics, we discuss
    general configuration issues. The overall configuration process is outlined in
    these steps:


    +   1. Start the Network Configuration Utility.

    2. Configure your Ethernet or wireless NIC.

    3. Configure your computer''s host name.

    4. Configure your computer''s domain name service.

