    \ who hasn't, these days?), the first thing you want is to tailor Mozilla to your\
    \ preferences. You can complete this task without connecting to the Internet.\
    \ Follow the steps in this section to customize Mozilla to your liking.\n\n+ \
    \  1. Click the GNOME Menu and select Preferences: More Preferences: Preferred\
    \ Applications.\n\nThe Preferred Dialog window opens. Fedora Core includes three\
