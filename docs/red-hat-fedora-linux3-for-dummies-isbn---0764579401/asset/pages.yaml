    # Scan Me


    Information is king when it comes to people hacking into systems and keeping them
    out. Hackers use knowledge about your computer and network to break into your
    systems. One common and powerful tool for gaining information about type of operating
    system you have and the services it runs is nmap. Port-scanning tool can discover
    a wealth of information about individual computers and networks.


    nmap is included in the Fedora Core distribution. To install it, log in as root,
    mount the DVF (insert into the drive), and run the following command:


    ```

    rpm -ivh /media/cdrom/Fedora/RPMS/nmap*

    ```


    You can scan yourself, or anyone on your private network (if you have one). If
