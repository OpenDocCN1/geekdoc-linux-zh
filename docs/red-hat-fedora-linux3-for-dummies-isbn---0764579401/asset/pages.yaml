    A major personal computer (PC) manufacturers install Microsoft Windows on their
    machines by default. However, you can now purchase computers sans operating system
    via mail-order or from local, non-brand stores.


    What does that mean? Basically, you can skip this chapter if you have a "bare"
    PC with a preinstalled operating system. You can also skip this chapter if you
    want to remove Windows from your PC or if your Windows computer has a second partition
    on which you can install Linux.


    ![](img/019b0d727ede29f1ccb08789667e950f_36_0.png)


    A partition is a portion of a disk drive used to organize files and directories.
    For example, the Windows C drive is installed on its own partition. A partition
    can use all or part of a disk. Most computers now partition the entire hard disk
    for drive C, although some include a second partition for drive D. However, if
    you have Windows installed on your PC and want to keep it, you have to make accommodations
    for Fedora Core. Fortunately, Linux is an easy fellow who gets along with all
    others. You can install Fedora Core next to Windows on the same drive in a configuration
    called a "dual-boot" system: You choose which operating system to use when you
    power up, or boot, your computer.


    This chapter shows how to prepare your hard drive so that Linux and Windows can
    live in harmony worthy of a schmaltzya soda commercial. What the world needs now
    is dual-boot, sweet dual-boot — oh, never mind.'
