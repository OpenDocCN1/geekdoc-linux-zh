- pgno: 321
  md: '# 302 Part V: The Part of Tens


    **Solution:** When you type a shell or binary command name, Linux looks for the
    name in specific places and in a specific order. To find out which directories
    looks in — and in which order — type the command `echo $PATH`.


    You see a stream similar to this one:


    ```

    /bin:/usr/bin:/usr/local/bin

    ```


    Linux looks at these directories to find the command, program, or shell you want
    to execute. You may see more directories, depending on your distribution or how
    your system administrator (if you have) set up your system.


    Suppose you create a shell or program named *bark* and want to execute it (assuming
    you have set the permission bits to make *bark* executable by you). You have a
    couple of choices (you actually have more than two choices, but we list the safest
    ones). One choice is to type this command on the command line:


    ```

    .bark

    ```


    This line tells Linux to look in the directory you''re in (.) and execute *bark*.
    Your second choice is to move *bark* to one of the directories in the PATH variable,
    such as `/usr/local/bin`, and enter *bark* at the prompt again.


    # “I don’t know how to make the X Window System start at boot time”


    **Problem:** You don’t want to log in to command-line mode (such as in DOS) and
    type *startx*. Instead, you want to log through the X Window System.


    **Solution:** If you like to see a graphical interface from the beginning, change
    the line in the `/etc/initab` file:


    ```

    id:3:initdefault:

    ```


    to


    ```

    id:5:initdefault:

    ```


    Save your changes and reboot. The X Window System starts at the end of the boot
    process, and you can then log through the graphical interface. To go back to the
    old way of booting, change the line in the `/etc/initab` file back and reboot
    your machine:


    ```

    id:3:initdefault:

    ```'
  merge: -1
  img_proc: true
