    # ## Is your network cable loose or broken?


    Make sure that your network cables aren''t broken or cut. Check the connec-tors
    to make sure they''re okay. You should also make sure that you''re using the correct
    network cable, which should be Category 5 (8-wire) straight-through cable.


    # ## Is your Ethernet hub or switch working?


    Your Ethernet hub or switch should also be turned on. Ensure that the net-work
    cables are also connected securely.'
