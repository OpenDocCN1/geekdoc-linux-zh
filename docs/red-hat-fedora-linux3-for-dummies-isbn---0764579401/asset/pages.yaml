- pgno: 275
  md: '# 256 Part IV: Revenge of the Nerds


    # Danger, Will Robinson! Detecting intruders


    Everybody needs a loyal, vigilant robot to sound the alert when aliens, monsters,
    Dr. Smith, and hackers come after you. You cannot have literal robots (or can
    you?), but you can have an intrusion-detection system (IDS).


    Intrusion detection is the flip side of intrusion prevention. You cannot depend
    on not getting hacked unless you turn off your computer and lock it in your panic
    room. Remember that no silver bullets exist in the world of computer security.
    You have to take measures to detect whether—and when—you compromised.


    Intrusion detection requires more work than any of the security systems we discuss
    in this book. The other systems, such as firewalls and password protection, require
    some upfront work and run without much additional work. An IDS, however, requires
    some initial installation and configuration and then you to maintain it daily
    if you want it to be any of use.


    Many IDS (far too many to describe here) can give you extra security. We suggest
    two mature


    and relatively easy-to-use systems that provide good bang for your buck: Snort
    and Tripwire.


    Snort is a network-based IDS. It looks for patterns in your network traffic that
    indicate hacker probes and break in attempts. Snort isn''t perfect and does report
    false alerts. You have time spent identifying and eliminating false positives
    if you use Snort—but that time is well spent, system administrators and security
    professionals consider Snort an excellent IDS. Go to www.snort.org to find more
    information. Wiley publishes Snort for Dummies by Charlie Scott, Paul Wolff, and
    Bert Hayes.


    Tripwire works by securely recording the fingerprints of files and directories
    and comparing them to subsequent ones. Any differences between the current and
    original fingerprint indicate the file has changed and maybe compromised. The
    fingerprints, or checksums, are mathematical values calculated from the contents
    of a file or directory. You can find Tripwire at www.tripwire.com.


    # Modifying your firewall to allow SSL


    You have to modify your Internet gateway or firewall to allow secure connections.
    You have to allow external web browsers to connect to Port 443 on your Apache
    server. The following rule allows connections:


    ```

    iptables -A INPUT -p tcp -m state

    --state ESTABLISHED -j --dport 443

    ```


    If you''re using a DSL modem like the one we describe in Chapter 6, you must modify
    the modem''s network address translation (NAT) configuration. Many DSL modems
    are now on the market; describing how to configure them individually is beyond
    the scope of this book. Consult your modem''s manual for configuration instructions:
    You have to allow external connections to Port 443.'
  merge: -1
  img_proc: true
- pgno: 276
  md: '# Chapter 17: Securing Your Future


    # Reading your logs


    You are ultimately your own best intrusion-detection system (IDS). Log files store
    information about nearly every one of your Fedora Core systems. Reading your logs
    you discover what has been happening on your computer — and it''s one way to detect
    intrusions.


    Unfortunately, exploring log files is somewhat akin to reading tea leaves. No
    mechanical method exists for sifting through log-files. You have to look for unusual
    and suspicious occurrences. As you read more, you realize what is usual and, of
    unusual. Experience counts for a great deal when you''re an IDS.


    Red Hat provides two systems for viewing log files. The e-mail Logwatch-alert
    system sifts through the log files in /var/log and e-mails the root user any alerts
    or errors. You can configure the Logwatcher parameters to better fit your operation.
    However, the default works well at alerting you to the happenings on your computer.
    The Red Logviewer graphical utility provides one-stop shopping for all standard
    log files. This manual tool helps you to remember which log files to look at.


    # Using Logwatch


    Logwatch, installed by default by the Red Hat installation, is a Perl script that
    runs nightly by cron. It reads through every log file in the /var/log directory
    and picks out items that thinks are interesting.


    The default Perl script is in /etc/log.d/scripts/logwatch.pl. The soft link, 00-logwatch,
    in the /etc/cron.daily directory, directs the cron system to run the script nightly.


    Logwatch is controlled by the /etc/log.d/conf/logwatch.conf file. This file controls
    such options as what is e-mailed the results. The logwatch configuration is well-documented
    and simple to configure.


    # Using Logviewer


    Logviewer is a simple utility designed to display any of the standard Fedora Core
    files in the /var/log directory. Logviewer displays by the default raw log information
    and leaves suspicious entries to your eyes.


    Nothing is special about Logviewer, except it helps you access common log files
    and look at their data. Do not underestimate the value of simple assistance. Although
    our busy lives making log files a difficult task, it''s one of those mind-numbing
    but necessary jobs — boring but essential!'
  merge: -1
  img_proc: true
- pgno: 277
  md: "# 258 Part IV: Revenge of the Nerds\n\n# Fending off modular rootkits\n\nA\
    \ rootkit is a software program that a hacker installs on your machine and then\
    \ uses against you; the software also includes tools to hide itself from you.\
    \ Garden-variety rootkits run as regular applications and can be detected with\
    \ standard tools. Many rootkits (nearly 60 at the time we wrote this book) can\
    \ be detected with the easy-to-use chkrootkit system. Go to www.chkrootkit.org\
    \ and download the software by clicking the Latest Tarball link (about a page\
    \ down under “Download”).\n\nOne of the more insidious threats is the modular\
    \ rootkit. Modular rootkits insert themselves into your Linux kernel and then\
    \ control everything on your computer. Because they live in your kernel, you cannot\
    \ depend on any standard detection tools to ferret them out.\n\nAfter you know\
    \ the good security techniques discussed in this chapter and book, the best way\
    \ to avoid modular rootkits is to prevent kernel from being loaded. You can download\
    \ the Linux kernel source code from kernel.org and compile it as a monolithic\
    \ kernel—that is, compile modules directly into the kernel. Describing how to\
    \ compile monolithic kernels is beyond the scope of this book, but an alternative\
    \ method is quite to use.\n\nHere's the alternative: You can take advantage of\
    \ a feature in the 2.6 Linux kernel that Fedora Core 3 uses. The 2.6 kernel and\
    \ its modules include cryptographic signatures that can be used to prevent non-signed\
    \ modules from loading. Using this feature greatly reduces the danger of getting\
    \ infected with modular rootkits.\n\nTo prevent unsigned loading add theforcemodig\
    \ option to the kernel configuration in /boot/grub/grub.conf. For instance, your\
    \ grub.conf file should look like the following:\n\n```\ntitle Fedora Core (2.6.8-1.541)\n\
    root (hd0,0)\nkernel /vmlinuz-2.6.8-1.541 ro\n  root=LABEL=/ rhub quietforcemodules\n\
    \  initrd=/initrd-2.6.8-1.541.img\n```\n\nThis option will take effect the next\
    \ time you reboot your computer.\n\n# Introducing SELinux\n\nThe new and powerful\
    \ Security-Enhanced Linux (SELinux) was designed by the National Security Agency\
    \ (NSA) to increase computer security (see www.nsa.gov/selinux/). SELinux has\
    \ recently been added to the Linux kernel. (Adding new functions to the kernel\
    \ is a difficult process. Only the very best software gets added.)"
  merge: -1
  img_proc: true
- pgno: 278
  md: '# Chapter 17: Securing Your Future


    SELinux is based on the Linux Security Module (LSM), which is a general-purpose
    and powerful mechanism for adding security software to Linux. SELinux provides
    the framework to make Linux more secure. Please go to http://nlsm.immunix.org/
    for more information.


    # Introducing access-control types


    Linux uses a Discretionary Access Control (DAC) model to control file access;
    see Appendix C for more information about file permissions. If used correctly,
    the DAC model provides some security. When used incorrectly, or misused, it can
    cause problems. For instance, if you own a file or directory, you can make it
    world-readable and world-writable. Owning a file gives you nearly unlimited power
    over its use. This can create security holes, especially if you''re the root user.
    (For instance, making /etc/shadow file world-writable makes it possible for a
    hacker to change your user passwords.)


    SELinux adds Mandatory Access Control (MAC) capability to the Linux kernel. You
    configure the SELinux policy before starting the computer so users, root included,
    and processes cannot arbitrarily access to other objects (files, directories,
    and sockets) they want. This model also minimizes the access that buggy software
    provides hackers. SELinux processes, files, and users from each other to create
    a more secure environment.


    ![](img/019b0d727ede29f1ccb08789667e950f_278_0.png)


    SELinux can''t allow access to an object if the Linux operating system doesn''t.
    Even if Linux''s MAC allows access to a file or directory, the you prevents access
    if denied by Linux''s DAC. Linux takes precedence over SELinux.


    # Introducing security contexts


    SELinux uses the concept of security contexts (SC) and policy to control access
    to resources such as files, directories and objects; such resources are referred
    to as objects. When viewed from 40,000 (virtual) feet, this system is very simple:
    Every resource has a security context. A predefined policy determines whether
    one SC (the source) can access another SC (the target).


    The details of how SC and policy work together, however, are complicated. The
    rules define policy and the security context for every object take many thousands
    of lines. Fortunately, Fedora Core 3 handles this for you.


    Defining individual rules to account for every possible combination would be impossibly
    complex and rigid because a Fedora Core computer has thousands of files, directories,
    and so on.'
