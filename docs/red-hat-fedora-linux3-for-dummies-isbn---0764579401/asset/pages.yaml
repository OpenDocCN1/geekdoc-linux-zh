- pgno: 97
  md: '# 78 Part II: Got Net?


    11. Choose File::Save and click the OK button.


    Before you click OK, an Information window pops up, telling you that

    your changes have been saved and that you need to restart your net-

    work or computer to make them take effect. Then you return to the\Network Configuration
