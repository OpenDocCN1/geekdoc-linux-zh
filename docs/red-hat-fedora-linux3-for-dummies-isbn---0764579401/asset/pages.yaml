    # # Using Rhythmbox


    The open-source Rhythmbox program is a great tool for listening to audio streams
    and files. Rhythmbox plays Ogg-formatted audio. The Ogg codec does not use any
    proprietary or patented algorithms. Ogg is free for anyone to use, and organizations
    who don''t want to depend on proprietary systems they are discovering; Ogg also
    produces higher-fidelity audio streams than other popular systems (such as MP3).
    Why depend on another corporation''s whom when you don''t have to? (Rhythmbox
    doesn''t play MP3 formatted files. MediaPlayer, described later in this chapter,
    does play MP3.)


    > The system used to format audio streams: Vorbis is to compress formatted audio
    streams. Unlike most other technological systems, Ogg/Vorbis isn''t an acronym,
    but rather named after science fiction characters. For more information about
    Ogg/Vorbis and similar open-source multimedia systems, go to www.vorbis.com.


    ![](img/019b0d727ede29f1ccb08789667e950f_176_0.png)


    Now that you have a bit of technological background, you can start Rhythmbox to
