    You have created and saved the configuration necessary to use your

    cable modem. You have also activated that connection. You can start

    using broadband internet connection. Open Mozilla, for example,

    and browsing at lightning speed.


    We strongly advise protecting your internet connection with either the

    default firewall — installed automatically during the general installation

    process — or the one we describe in Chapter 8. The default firewall is auto-

    configured and run unless you choose not to install it (as described

    in Chapter 3) or explicitly turn it off. We prefer to install and use the more

    secure firewall from Chapter 8; nothing is wrong with the default firewall, but

    it''s less protective than yours. You can verify that your firewall is active
    by

    running the command service iptables status as root.


    ![](img/019b0d727ede29f1ccb08789667e950f_97_0.png)


    # The DSL Option


    We are all wired — for telephones, that is. DSL models take advantage

    of this old, appropriately named Plain Old Telephone Service

    POTS) to provide a high-speed Internet connection to consumers. The DSL

    option uses special equipment to pump much more data through the POTS

    lines than a traditional analog modem could.


    DSL provides high-speed Internet connections by electronically converting

    y computer''s digital network communications into a form that can be

    tmitted over the telephone company''s POTS. When your data finds its

    way to the telephone company, it''s converted into another form and for-\ward
    to your ISP.


    DSL uses frequencies in the millions of cycles per second — the megahertz

    (MHz) range — compared to analog modems, which work with sig-

    als in the thousands of cycles per second — kilohertz (Kh). You get much

    h communication speeds when you use higher frequencies. Unfortunately,

    the telephone system wasn''t designed to work with higher frequencies.


    ![](img/019b0d727ede29f1ccb08789667e950f_97_1.png)


    Fortunately, the brains of the world have figured out how to get high-speed

    DSL connections from the old, slow POTS. They have designed digital

    signal-processing to overcome some of the POTS architecture limitations.

    The result is that if you live close enough — roughly three to four miles — to

    your DSL provider''s equipment, you can use DSL to get to the Net.'
  merge: -1
  img_proc: true
- pgno: 98
  md: "# Chapter 6: Broadband Rocks!\n\n# Facing DSL configuration woes head-on\n\n\
