- pgno: 261
  md: '# 242 Part IV: Revenge of the Nerds


    # Using a Secure Shell client


    You may be a familiar with graphical network communication applications, such
    as the Mozilla Web browser and Evolution e-mail clients. However, a world of text-based
    tools is available, as Secure Shell, Telnet, and FTP. Those applications provide
    an interactive method for connecting to other computers across networks and the
    Internet by a command-line interface (CLI); refer to Chapter 4 for more information
    about CLIs.


    Interactive communication is effective for performing tasks on remote machines.
    For example, the primary way to work on Linux machines was via the CLI. The CLI
    is often the best way to perform remote tasks.


    CLI-based communication used to be carried out by the insecure Telnet, FTP, and
    r connections. All services used unencrypted connections, and passwords were readily
    detected. The r service also used a system of inactive trust. A trust network
    allowed hackers (as the infamous Kevin Mitnik) to "own" a network by breaking
    into one machine and logging in to additional ones without authentication.


    Open Shell (OpenSSH) provides an encrypted channel to perform all tasks. Fedora
    Core bundles OpenSSH by default. We describe (first) how to use the OpenSSH client
    to communicate with other machines and (second) create an OpenSSH server.


    > You (dare we say?) use encrypted channels when you are communicating over the
    Internet and wireless networks. Both the Internet and Wi-Fi connections are inherently
    insecure, and you have to protect your communications.


    ![](img/019b0d727ede29f1ccb08789667e950f_261_0.png)


    # Connecting to a Secure Shell server


    Start using OpenSSH as a client. Suppose you want to log in to your ISP server,
    ssh.mysisp.com, with OpenSSH. Here''s the drill:


    +   1. Open a GNOME Terminal session.


    +   2. Enter your command:


    ```

    ssh ssh.mysisp.com

    ```


    Your mileage may vary, of course. You may have to use the -l option, for example,
    your ISP user account name is different from your local computer. Your user name
    on your local machine is rod, but it''s wayofthewheel at your ISP, enter this
    line:


    ```

    ssh -l wayofthewheel ssh.mysisp.com

    ```


    The first time you connect to a remote server, you''re prompted to accept the
    remote server''s fingerprint.'
  merge: -1
  img_proc: true
- pgno: 262
  md: '# Chapter 17: Securing Your Future 243


    +   3. Enter yes when you''re prompted.


    +   4. Enter your password when you''re prompted, and you''re logged in.


    For example, you can now use a text-based e-mail client, such as pine, to read
    your messages. This program is useful if you want to read your e-mail securely
    but cannot connect to your ISP with an SSL-enabled Mozilla or Evolution e-mail
    client.


    # Tunneling X across a network


    That was a simple and useful way to use OpenSSH, but you can do more. The Red
    Hat SSH client is automatically configured to forward X-based graphics across
    its secure connection. While logged on your ISP, you can run X Window client software
    and view it on your local machine:


    +   1. Log in to your ISP (or any machine running a Secure Shell server), as described.


    +   2. Run an X Window application, as xclock.


    The simple xclock window is displayed on your desktop.

    OpenSSH also bundles the file-transfer Secure Copy (scp) and Secure FTP (sftp).
    Secure Copy is non-interactive and copies files from and to a remote machine.
    Secure FTP is a secure version of FTP and is also interactive. This list describes
    how to copy files between two machines:


    +   • Copy from a local machine to a remote one: To transfer files from your local
    computer to a remote one, use Secure Copy (scp):


    ```

    scp abc myaccount@remote.mysisp.com

    ```


    This command copies the filename abc from the directory you are working to the
    myaccount.mysisp.com home directory on the remote machine. You can specify either
    or both of the local and remote directories. For example, the following command
    copies the file from the /tmp directory on the local machine to the /var/tmp directory
    on the remote machine and renames it to xyz:


    ```

    scp myaccount@remote.mysisp.com:/tmp /var/tmp/xyz

    ```


    The scp syntax is important. If you leave out the colon (:), your file isn''t
    copied to the remote machine but is simply copied to a file named myaccount@remote.mysisp.com
    in your local directory.


    +   • Copy from a remote to local: Reverse the order of the parameters to copy
    from a remote machine. The following example copies the file abc from your home
    directory on the remote machine to your current working directory on the local
    machine:


    ```

    scp myaccount@remote:abc

    ```'
  merge: -1
  img_proc: true
- pgno: 263
  md: '# 244 Part IV: Revenge of the Nerds


    The sftp program works like the old standby FTP, but uses encryption, of course.
    Follow these steps to perform simple file transfers with sftp:


    +   1. Open a GNOME Terminal session.


    +   2. Enter this command:


    ```

    sftp ssh.mysisp.com

    ```


    +   3. Enter your username and password.


    +   4. Enter the help command at the sftp prompt.


    You see a list of sftp commands. The ones you use most are cd, lcd, dir, ls, get,
    and put. These commands work in a similar fashion to their Linux equivalents.


    Using sftp is self-explanatory. Use get to transfer a file, or a directory from
    the remote machine to a local machine; put transfers them from local to remote.


    ![](img/019b0d727ede29f1ccb08789667e950f_263_0.png)


    Another cool feature of OpenSSH is its ability to tunnel any protocol. You can
    potentially display an entire X Window from a remote machine via X, for example.
    Consult the OpenSSH documentation for more information.


    # Configuring an OpenSSH server


    An OpenSSH server is straightforward. You only have to modify the /etc/ssh/sshd_config
    file and run the service sshd restart to restart the OpenSSH server daemon. Take
    a look at the configuration file, the important parts of which are listed:


    +   Remove the older and faulty protocol version 1: Version 1 is broken and should
    not be used (change the Protocol 2,1 to Protocol 2, as shown in this example):


    ```

    Port 22

    Protocol 2

    # Keys for protocol version 2

    HostKey /etc/ssh/sshd_rsa_key

    HostKey /etc/ssh/sshd_d_key

    ```


    +   Remove the comment in front of the login grace-time parameter: This action
    sets a limit on the length of time when you start a login and the time you complete
    it:


    ```

    LoginGraceTime 600

    ```'
  merge: -1
  img_proc: true
- pgno: 264
  md: '# Chapter 17: Securing Your Future


    +   Disallow root logins: You should prevent users, including yourself, from logging
    directly as root. Forcing users to first log in as a regular user and then "su-ing"
    to root provides an audit trail that can be used to see who did what at the root
    user; it also forces everyone to jump through two hops before anyone can execute
    the all-powerful root user:

    PermitRootLogin yes

    StrictModes yes


    +   Uncomment the following parameters to allow the various authentication modes:

    # hosts authentication should not be used

    RhostsAuthentication no

    # Don''t read the user''s ~/.hosts and ~.hosts files

    IgnoreRhosts yes

    # For this to work you also need host

    keys in /etc/ssh/known_hosts

    RhostsRSAAuthentication no

    # similar for protocol version 2

    HostBasedAuthentication no

    # Change to yes if you don''t trust ~/.ssh/known_hosts for

    RhostsRSAAuthentication and HostBasedAuthentication

    IgnoreUserHosts no


    +   Allow people to use password authentication, but don''t allow unattended access:

    # To disable tunneled clear text passwords,

    change to no here!

    PasswordAuthentication yes

    PermitEmptyPasswords no


    After starting the OpenSSH daemon, follow these steps:


    +   1. Make the changes and restart the Secure Shell daemon:

    service sshd restart


    +   2. If you''re running a firewall, add this rule to your iptables-based firewall:

    iptables -A INPUT -p tcp --dport 22

    -m state --state NEW,ESTABLISHED -j ACCEPT


    +   3. Save your new firewall:

    iptables-save > /etc/sysconfig/iptables


    +   4. Restart the firewall:

    iptables restart


    Now you can use the OpenSSH client and server to communicate to and from your
    Linux computer. Using the OpenSSH client, you can interactively log in other computers,
    copy data between computers, and piggyback an'
  merge: -1
