    work as long as possible. In this part, you find out how to make a server out
    of your Fedora Core computer. These chapters don''t instantly turn you into a
    Linux guru capable of commanding six-figure fees, but they do introduce you to
    the technical side of Linux.


    We start by describing Chapter 15 how to build a simple local-area network (LAN).
    Building a LAN isn''t as difficult as it first sounds. You connect your computers,
    configure them to recognize each other, create an Internet gateway or firewall,
    and (with any luck) you''re off and running.


    Chapter 16 shows how to use your Fedora Core computer as a network server on your
    newly created network; you can also provide services to the Internet.


    We get serious in Chapter 17 and describe how to start securing your Fedora Core
    servers and private network. You should consider this chapter an introduction
    to security and plan on more.


    If (okay, when) you need to troubleshoot Fedora Core, check out Chapter 18. It
    provides some detailed help in fixing computer problems, with a special focus
