    # # Getting to Know OpenOffice


    If you''re familiar with Microsoft Office, you can find your way around OpenOffice.
    The look and feel are a little different, but the idea is the same. If you''re
    a wild-eyed power-to-the-people person (who''s also thrifty), you may find OpenOffice
    morally superior to Office because it''s free and a part of open source. Or maybe
    you just want to get down to work. Either way, we briefly describe some of the
    most common OpenOffice functions here.'
