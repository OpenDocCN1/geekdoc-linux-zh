- pgno: 265
  md: "# 246 Part IV: Revenge of the Nerds\n\narbitrary communication stream (such\
    \ as X Window) with this puppy. You can reverse that process and communicate with\
    \ your host Fedora Core computer. OpenSSH encrypts all your communication and\
    \ prevents the exposure of your passwords and data to trying eyes.\n\n# Exchanging\
    \ keys makes your life easier\n\nYou use OpenSSH by default to log to a remote\
    \ user account using traditional passwords. However, OpenSSH can use a second\
    \ authentication method that takes a little to get started but saves work in the\
    \ long run.\n\nOpenSSH provides an authentication method named public-key cryptography.\
    \ This system uses one public and one private key. You install the public key\
    \ on the remote system and keep the private key on your computer. The public key\
    \ can be shared with anyone—hey, the private key must be kept secret at all costs.\
    \ In fact, Essentially encrypt the private key by default. You must pass a passphrase\
    \ (with spaces) to decrypt the private key before using it.\n\nWhenever you want\
    \ to log in or communicate with the remote computer, the keys are used to negotiate\
    \ the process. The public-private key system guarantees that your user account\
    \ is authenticated and is the initiating host; passwords authenticate only your\
