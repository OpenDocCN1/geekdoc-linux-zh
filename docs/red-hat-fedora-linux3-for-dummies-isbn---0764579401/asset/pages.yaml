- pgno: 124
  md: "# Displaying Your Firewall Rules\n\nAfter you configure your firewall, you\
    \ naturally want to verify that the filter-ing rules are set up correctly. To\
    \ display the firewall rules, follow these steps:\n\n+   1. Open a GNOME Terminal\
    \ emulator window (right-click any empty part of the GNOME Desktop and select\
    \ the New Terminal).\n   You can also open the GNOME Terminal by clicking the\
    \ GNOME Menu and choosing Tools->Terminal.\n2. If you're not already the root\
    \ user, enter the su - command in the GNOME Terminal window.\n3. Enter the root\
    \ password and use the following command to display the firewall rules:\n`iptables\
    \ -L -v`\n\nAfter you complete these steps, see the firewall-filtering rules displayed\
    \ in the terminal window (use the verbose -v option in the preceding command to\
    \ display extra information, including the network interfaces — for the sake of\
