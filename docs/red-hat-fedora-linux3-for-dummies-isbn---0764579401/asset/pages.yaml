    # Working with proxies


    If your Linux is connected to the Internet through a proxy firewall, you need
    to configure Mozilla to work with the proxy.


    +   1. Click Edit: Preferences in the Mozilla window.

    2. Click the Plus (+) sign next to the Advanced category.

    3. Click the Proxies option.

    4. Click the Manual Proxy configuration radio button and enter the URL of your
    proxy.

    * For example, enter proxy.mynetwork.com in the HTTP Proxy box (if that''s the
    name of your firewall) and enter 80 in the Port box.

    * Optionally, if your LAN uses an automated proxy script, click the option labeled
    Automatic proxy configuration URL: and type in the name of your script.


    +   5. Click the OK button and you should be able to use Mozilla through your
    proxy firewall.


    You don''t have to perform this configuration process if you''re using the Fedora
    Core default firewall or the packet-filtering firewalls we describe in this book.


    ![](img/019b0d727ede29f1ccb08789667e950f_158_1.png)


