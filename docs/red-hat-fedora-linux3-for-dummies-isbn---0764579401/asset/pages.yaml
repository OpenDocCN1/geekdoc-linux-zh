    Using a single Linux computer as an Internet gateway and provide network services
    is cost-effective using your limited resources — but this type of configuration
    is more difficult to secure. Each function you place on a single machine increases
    the machine''s potential of vulnerability. Thinking of adding functions such as
    adding doors and windows to a house: A house with a single door and no windows
