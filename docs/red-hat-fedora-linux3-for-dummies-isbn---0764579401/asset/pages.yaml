  md: '# Part III: Linux, Huh! What Is It Good For? Absolutely Everything!


    # Introducing the GNOME Panel


    The GNOME Panel is the menu bar at the bottom of the desktop. The GNOME Panel,
    similar to the taskbar in Windows, provides a location to place common menus and
    applets for easy opening or viewing. The GNOME Panel also gives you a view of
    the virtual desktop and enables you to keep track of minimized windows.


    By default, Fedora Core places icons on the GNOME Panel for accessing the GNOME
    menu, Mozilla, Evolution, OpenOffice (Writer, Impress, and Calc), a printer, the
    theme applet, and the GNOME Workspace Switcher. You can start any of these programs
    and utilities or use the Switch by clicking its icon.


    The most important element on the GNOME Panel is the GNOME button on the far left
    side, which you use to access all standard GNOME applications and configuration
    tools. The GNOME button, which looks amazing similar to a red fed, is in the lower-left
    corner of the screen. You can choose from any of the menus that are displayed
    when you click the GNOME Menu. For example, the System Settings and System Tools
    contain many of the Core Utilities you can use to administer your Fedora Core
    computer. The Sound & Video menu provides access to multimedia programs, and the
