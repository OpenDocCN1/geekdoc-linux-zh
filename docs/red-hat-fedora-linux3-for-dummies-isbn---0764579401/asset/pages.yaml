- pgno: 194
  md: '# Chapter 14


    # The Days of Wine and Windows Applications


    # In This Chapter


    +   - Introducing Wine

    - Using Wine


    Linux provides for many, if not most, of your desktop needs. The applications
    described in the preceding chapters satisfy most of your daily work requirements.
    All the essential applications, such as OpenOffice, Mozilla, and Evolution, are
    at your disposal.


    Sometimes, however, you need to perform some function that Linux doesn''t provide.
    For example, most games are written for the Microsoft world and aren''t available
    for Linux. At times — such as when you''re editing documents with complex macros
    — you must use Microsoft Word. That''s when Wine, Crossover Office, and VMware
    come to the rescue.


    # Introducing Wine


    Wine doesn''t come from the Sonoma Valley, Chile, Australia, or even from the
    south of France. You can''t get tipsy or spend much money on it, either. Wine
    isn''t a beverage, but rather a software system that allows you to run Windows
    applications on a Linux computer. Wine helps to fill-in the small Linux applications
    gap.


    Modern Windows applications are, at their core, written to run on Intel, or Intel-compatible
    (AMD, for example), Pentium processors. (Some Windows applications run on Apple
    Macs; for purposes of this discussion, however, we''re talking about only Intel-based
    PCs.) Linux runs on Pentium-based PCs. However, you can''t just load a program
    like Microsoft Word right onto your Linux computer and expect it to work.'
  merge: -1
  img_proc: true
- pgno: 195
  md: '# 176 Part III: Linux, Huh! What Is It Good For? Absolutely Everything!


    The Microsoft Windows operating system provides a platform for running Microsoft
    applications, such as Word and Explorer. That is a little like an electrical plug
    that provides the power to run, and a standard way of accessing power—the electrical
    outlet, and appliances—that are analogous to applications. What the Windows "plug"
    is a library of commonly used, low-level functions—referred to as an Application
    Program Interface (API). So,, using a common library prevents every application
    from reinventing the wheel. Instead, the applications just plug into the "outlet"
    and concentrate on their particular functions.


    The problem is that the Windows (the "plug" in the electrical analogy) has what
    amounts to square holes while Linux has what amounts to round ones. For example.
    That where Wine comes in: It provides the adapter so you can plug Windows into
    the Linux outlet.


    Wine stands for Not an Emulator. This typically obscure acronym is the type that
    Linux and Windows programmers love. It means not only that some people just need
    to get out, but also that Wine doesn''t do its work by simulating (that is, emulating)
    the Windows environment. Rather, it duplicates one vital part of the environment:
    the interface between the application and the system. In the electrical analogy,
    Wine isn''t trying to be the electrical grid (as in Windows) but, rather, the
    adapter.


    ![](img/019b0d727ede29f1ccb08789667e950f_195_0.png)


    # Downloading Wine


    Come on, Fedora Core has to leave a few things to the user. Therefore Wine isn''t
    included in the distribution; have how to download it from the Internet. These
    steps describe how:


    +   1. Log in to your Fedora Core computer as any user.

    nYou can log in as the superuser (root) if you want, but that''s not necessary.
    By not logging in as the superuser, you don''t run the risk of unintentionally
    damaging your computer (for example, deleting all your files).

    2. Open your Mozilla browser by clicking the blue globe on the GNOME Menu.


    Using Mozilla is described in Chapter 11.


    +   3. Enter the address winehq.com/site/download in the text box at the top of
    the browser and press Enter.


    Your browser displays the Wine Binary Downloads page. This page contains links
    to various noncommercial and commercial repositories. (We describe the commercial
    Wine version in the section "Introducing'
