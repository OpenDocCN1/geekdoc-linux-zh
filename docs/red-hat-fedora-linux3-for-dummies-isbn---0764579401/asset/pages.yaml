    # Keystrokes and clicks


    Some instructions require that you press a specific key or keys to execute the
    desired result. If you need to press a single key, we say, for example, “press
    the Æ key. We use a plus sign to indicate multiple keys. For example, Ctrl+Alt-Delete
    means that you should press the Ctrl key. Alt key, and Delete all at the same
    time.


    Most applications and utilities we describe in this book use a graphical interface
    (GUI), such as the Fedora Core display or network configuration utility, which
    allows you to control your computer by pointing and clicking with your mouse.
    When we tell you to “click” something, we want you to press the left button on
    your mouse. Some actions require that you use the right button; in those cases,
    we explicitly say “right-click.”


    # How This Book Is Organized


    Like all *For Dummies* books, *Red Hat Linux 3 Dummies* is organized into independent
    parts. You can read the parts in any order. (Heck, if you have ever seen the *Memento*,
    you may want to read the parts in reverse.)) Basically, this book isn''t meant
    to be read from front to back; rather, it''s meant to be a reference book that
    helps you find what you''re looking for it. Between the Contents at a Glance page,
    the table of contents, and the index, you should have no problem finding what
    you need.


    If you do the chapters in this book in order, you encounter the useful and interesting
    things first and the more technical items last. For example, after installing
    Fedora Core in Part I, you may want to proceed immediately to Part II to see how
    to connect Linux to the Internet or your local network. From there, you can use
    your new workstation to surf the Internet and use e-mail.


    The following sections describe each part.'
