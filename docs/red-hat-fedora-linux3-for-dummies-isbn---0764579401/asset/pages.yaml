- pgno: 362
  md: '# # Appendix E


    # # Revvng Up with RPM and YUM


    **In This Appendix**


    +   - Introducing RPM

    - Using RPM

    - Introducing and using YUM


    This appendix introduces you to the Red Hat Package Manager (RPM) and the Yellowdog
    Updater, Modifier (YUM). Red Hat, Inc., developed RPM in conjunction with another
    Linux distributor, Caldera Systems. Duke University gave us the wonderful YUM.


    RPM is the meat-and-potatoes of much of the Linux world. Its purpose is to reduce
    the amount of work you have to do when you install, remove, and manage software.
    RPM partially automates the installation, updating, and removal of software. Without
    RPM, Linux would never have become as popular as it is installing and managing
    a computer would have been too difficult.


    Although other Package Managers are available, RPM has the most popular system
    for installing, modifying, and transporting Linux software. This handy-dandy tool
    is a big reason that Red Hat is the de facto Linux leader. Motor through this
    chapter to find everything you need to know about RPM.


    YUM is a new entry into the world of software installation and maintenance. Working
    at a higher level than RPM, YUM manages RPM packages, taking care of installing,
    updating, querying, and removing them. YUM simply makes life with a computer easier.'
  merge: -1
  img_proc: true
- pgno: 363
  md: '# Part VI: Appendixes


    # Introducing the Red Hat

    Package Manager


    One of the primary reasons that the Red Hat Linux (and, subsequently,

    Fedora Core) distributions became popular was that Red Hat, Inc.,added value for
    its customers with technologies such as RPM.


    All the software that was installed during the Fedora Core installation

    process is stored in RPM''s format, called packages. A package is a collection

    of software (applications, libraries, and documentation, for example-

    pained in one file.


    The package-management concept has been around for a while. The

    major Unix vendors supply their systems. The idea is to distribute, in a

    single file, some software performs a particular function — and have a

    Package Manager do the work of installing, removing, and managing the indi-

    files. The Linux world has benefited greatly from this system, which

    simplifies the distribution and use of software.


    > You can install without RPM, but we''re not sure why you would\want to — the
    RPM package contains everything you need to install and run

    an application. For example, if you didn''t have the RPM package, installing

    Mozilla would work a little something like this: You would have to install the

    individual pieces that make up the Mozilla system, which can require dozens

    of steps. You can also install, uninstall RPM software (see the fol-\lowing section
    for details).


    ![](img/019b0d727ede29f1ccb08789667e950f_363_0.png)


    We remember in the day, when we used the Linux operating system

    for the first time. We had to install all the software using the dreaded tape

    archive system (TAR) ... from dozens of floppies! Trust: Installing, main-

    taining, and upgrading Linux with tar was a difficult task. RPM has made life

    eier for those of us who used to walk both days in the snow to

    school and back.


    The /Fedora/RPM directory on the companion DVD contains all the Fedora

    RPM packages.


    RPM performs three basic functions: It installs, upgrades, and removes pack-

    ings. In addition to these, it can find all sorts of information

    about installed and yet-to-be-installed packages. (All this, and it washes-

    doo.) Here''s a brief rundown of each function:


    +   - Installing packages: RPM installs software. Software systems, such as

    Mozilla, have files of all types that must be put into certain locations

    to work properly. For example, under Red Hat, (but not all)

    Moz files need to go into the /usr/bin directory. RPM performs this

    organizational stuff automatically, without any fuss or mess.'
  merge: -1
  img_proc: true
- pgno: 364
  md: '# Appendix E: Revving Up with RPM and YUM 345


    ![](img/019b0d727ede29f1ccb08789667e950f_364_0.png)


    RPM not only installs files in their proper directories, but also performs tasks
    such as creating the directories and running scripts to do the things that need
    to be done. (It''s a tidy and organized little scamp.)


    +   - **Upgrading packages:** Gone are the days when updating a system was worse
    than going to the dentist. RPM acts like the personal Linux assistant that we
    all wished we''d, by updating software packages for you. RPM also keeps track
    (in its own database) of all the packages you have installed. When you upgrade
    a package, RPM does all the bookkeeping chores and replaces only the files that
    need to be replaced. It also saves the configuration files it replaces.


    +   - **Removing packages:** The package database the RPM keeps is also useful
    in removing packages. To put it simply, RPM takes out the trash. (Housekeeping
    was never so easy.) RPM goes to each file and uninstalls it. Directories belonging
    to the package are also removed when no files from other packages are used.


    +   - **Querying packages and files:** RPM can also give you a great deal of information
    about a package and files. You can use the query function to find out the function
    of a package and which files belong to it. RPM can work on the RPM packages themselves,
    regardless of how they have been installed.


    +   - **Verifying packages:** RPM can validate an installed package against a
    checksum (a computer fingerprint) to see whether and how it has changed. This
    feature is useful for security reasons. If you suspect that a file or system has
    been hacked, you can use RPM to find out how it changed.


    ![](img/019b0d727ede29f1ccb08789667e950f_364_1.png)


    RPM packages often include configuration files as part of their installation.
    If you erase an RPM package, those configuration files are not *deleted* but are
    renamed by adding the suffix `.rpmsave`. For example, removing the Kerberos package,
    `krb5`, that saves the configuration file by renaming `/etc/krb.conf` to `/etc/krb.conf.rpmsave`.


    ![](img/019b0d727ede29f1ccb08789667e950f_364_2.png)


    When you remove a package, RPM removes the associated files and directories. RPM
    cleans up after itself — what Martha Stewart (when she''s not on laundry duty)
    would definitely call "a good thing."


    # Using the Red Hat Package Manager


    Fedora Core provides a tool named Red Hat Package Manager for working with RPM
    packages. The Package Manager graphical tool provides all the functions for managing
    RPMs. It''s like putting an automatic transmission on a car; The Package Manager
    does the shifting for you — okay, but you still have to drive it.'
  merge: -1
  img_proc: true
- pgno: 365
  md: '# 346 Part VI: Appendices


    The Package Manager provides easy access to RPM functions; you can install, upgrade,
    remove, query, and verify. This section describes how to use the Package Manager
    to rep your RPM.


    To start the Package Manager, click the GNOME Menu button and choose System Settings>Add/Remove
    Applications. If you''re not logged in as the root user, type the password in
    the input window when you''re prompted. A progress window appears briefly when
    the Package Manager determines which packages you have installed. After “thinking,”
    the Package Management window appears.


    The Package Manager displays all the Hat packages that are installed by your system.
    Individual packages are organized into groups, such as the X Window System and
    GNOME. When the box to the left of a group is active — as designated by a check
    mark — one or more packages from that group is installed. The number to the right
    of the Package group shows how many packages of the total number in the group
    are installed.


    Clicking the Details option opens the GNOME Desktop Package Details window, which
    shows both the base and optional packages in the group; short, one-line descriptions
    of each package are also displayed next to each package. Extra-Standard Packages
    are always installed with a package group. Extra packages are, well, optionally
    installed.


    # Installing an RPM package from the DVD


    When you install your Fedora Core system, all the software that is copied to your
    hard drive from the DVD comes from RPM packages. When you want to add software
    from the companion DVD or from an RPM repository, such as www.freshmeat.net, or
    from Red Hat, at www.redhat.com, you can do so by using the Install button. To
    install an RPM package from a CD-ROM, follow these steps:


    +   1. Start the Package Manager: Choose System Tools> Add/Remove Packages.


    +   Enter the root password in the Information window, if you''re prompted.


    +   2. When the Add and Remove Software window opens, select the package-group
    you want to install.


    For example, if you want to install the Mozilla e-mail, you have to do some exploring
    first. Scroll down to the Graphical Internet package group. The short description
    next to the package group says “This group includes graphical e-mail, Web, and
    chat clients,” which indicates that you’re on the right path.'
  merge: -1
  img_proc: true
- pgno: 366
  md: '# Appendix E: Revving Up with RPM and YUM


    +   3. Click the Details button to find out the details of the package you''re

    installing.


    For example, select the Graphical Internet group and the Graphical

    Internet Package Details window opens. You see that the Mozilla mail

