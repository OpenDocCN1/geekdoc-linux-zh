- pgno: 256
  md: '# # Chapter 17


    # # Securing Your Future


    **In This Chapter


    +   - Thinking security

    - Preventing intruders

    - Updating Fedora Core packages

    - Deactivating services

    - Using the Secure Shell client

    - Configuring a Secure Shell server

    - Securing your Web server with SSL

    - Reading logs

    - Introducing Security-enhanced Linux

    - Understanding the security process


    > Protecting your computers and private network is an essential task in today''s
    insecure world. Unfortunately, computer and network security is a big, complex
    job. It''s still more of an art than a science.


    This chapter describes several security methods and utilities that will help make
    the job more manageable. We have chosen the tools and systems that should give
    you the most for your buck. This chapter provides a start-ing point for making
    your computers and network safer. We encourage you to continue learning and evolving
    your security system.


    # # Thinking Security


    Computer security is best thought of as an imperfect and ongoing process. No single
    method, tool, or system can magically protect you from the Wild-West Internet.
    There is no silver bullet! Security, like exercise and diet, is just plain hard
    work.'
  merge: -1
  img_proc: true
- pgno: 257
  md: '# 238 Part IV: Revenge of the Nerds


    Because no silver bullet exists, you have to use the method of defense in depth,
    which uses layers of security measures. Each layer helps to protect each other.
    When one layer fails, you fall back on the other. You can also add and remove
    layers as necessary.


    Layered security systems and measures fall into four categories:


    +   * Prevention: You can use security-oriented tools, utilities, and methods
    effectively to prevent any attacks from succeeding. Setting up firewalls and updating
    software under this heading.


    +   * Detection: Not all attacks can be prevented, so detecting them, if possible.
    However, using an intrusion-detection system (IDS) is still more of an art than
    a science.


    +   * Eradication: If you ever get hacked, you must be able to eradicate all traces
    of the compromise. Be ready to reinstall your Fedora Core operating system if
    you cannot identify and remove the hacker puts on your computer.


    +   * Process: Most computer users would prefer to construct a security system
    and sit back and forget about it. However, the hacker changes as fast as the rest
    of the world, and the systems that work now not necessarily work tomorrow. Therefore
    you must keep learning and use that knowledge to improve your security.


    # An Ounce of Protection: Preventing Intruders


    We start by describing how to minimize your chances of being hacked. The following
    sections describe systems that increase your security:


    +   * Updating software: The Fedora Core update and YUM utilities help keep your
    computer''s software up-to-date, which eliminates vulnerabilities as they are
    discovered.


    +   * Removing services: Hackers cannot take advantage of vulnerable software
    if you don''t use it. Turning unnecessary services reduces your exposure. You
    may also remove software, such as compilers, or your servers. Removing the software
    prevents a hacker from using it.


    +   * OpenSSH and SSL: Except when you''re gardening-variety, non-Web pages, you
    should never communicate over the Internet (or wireless LANs) without encryption.
    The open-source SecureShell (SSH) and Secure Sockets Layer (SSL) provide effective
    encryption for your communications.


    We describe each system in this section.'
  merge: -1
  img_proc: true
- pgno: 258
  md: '# Chapter 17: Securing Your Future


    # # Updating software to remove vulnerabilities


    Standard hacker operating procedure is simple: Find and exploit vulnerabilities,
    the method is simple but effective, works like this: Joe Hacker walks around the
    Internet, rattling doorkobs and occasionally finding one that opens. When no door
    is unlocked, the hacker looks for easier locks to pick. Your job is to make sure
    that your doors and windows are locked and reasonably safely.


    Running down unnecessary services, and using good passwords ensures that you don''t
    leave anything unlocked. Making sure that your locks are easily defeated requires
    supervision and maintenance. Software is getting ever more powerful, but also
    complex. Complexity breeds bugs, and with bugs comes vulnerabilities. Because
    the only certainties in life are death, taxes, and buggy software, the bugs have
    to be fixed whenever possible. Everyone needs to continuously update software
    whenever errors are found and corrected.


    The Linux 2.6 kernel (used by Fedora Core 3) uses the Exec-shield system to minimize
    the danger from buffer overflows. Hackers have long used vulnerabilities found
    in stack queues (buffers) to execute their own malicious programs; operating systems
    like Linux use queues for their internal bookkeeping. EchoShield removes many,
    if not, of those vulnerabilities.


    Fedora Core uses an excellent method for updating its software: The Yellowdog
    Updater Modified (YUM) can be configured to automatically detect new software
    and install it for you. Fedora Core installs YUM by default. Next to use good
    passwords and firewalls, it''s probably the most effective security system you
    can run. Fedora Core uses the YUM system too.


    Follow these steps to run YUM:


    +   1. **In root and connect your Fedora Core computer to the Internet.**


    See Chapters 5, 6, and 7 for information about connecting to the Internet.


    +   2. **Configure YUM to run automatically at boot.**


    ```

    chkconfig --level 35 yum on

    ```


    +   3. **If your computer is connected to the Internet through a proxyfirewall,
    add the following line to /etc/cron.daily/yum.cron:**


    ```

    export http_proxy=http://abc.xyz:port

    ```


    ![](img/019b0d727ede29f1ccb08789667e950f_258_0.png)'
  merge: -1
  img_proc: true
- pgno: 259
  md: '# 240 Part IV: Revenge of the Nerds


    You''ll have to change the fictitious proxy address and port (abc.xyz:port) to
    match your network''s proxy.


    4. Start YUM update via cron, using this command:


    ```

    service yum start

    ```


    ![](img/019b0d727ede29f1ccb08789667e950f_259_0.png)


    You can manually update your computer, by logging in root and running the command:
    yum -y update. Removing the -y option forces you to verify that you want to run
    the updates once they''ve been detected.


    Regularly updating your computer is an essential security measure that''s easy
    to do. Many break-ins occur because of out-of-date software. With the help of
    update2, you eliminate most vulnerabilities as they occur.


    # Reducing your exposure: Removing and reducing services


    Hackers look for computer vulnerabilities by probing for vulnerable network services.
    Network services — such as Apache, Samba, and DHCP — are, of course, designed
    to respond to network queries. Here hackers can read- find which services you
    run — and then figure out which, if any, attacks to use.


    We describe elsewhere how keeping software updated minimizes your vulnerability.
    However, you can go one step further and make a service invulnerable by turning
    it off. One simple security rule is "Keep it simple." The simple fact is that
    you do not need to run a service, you shouldn''t.


    We describe in this section how to eliminate or reduce both network and non-network
    services. These steps describe how to use the chkconfig utility to change the
    startup scripts that control when, how, and when a network services starts at
    boot time


    +   1. Click the GNOME Menu and choose System Settings:Server Settings:Services.
    Enter the root password if you box opens.

    2. Select an unnecessary service and shut it off by clicking the Stop button.

    3. Click the OK button when the confirmation dialog box appears.

    4. Click the check mark to the left of the service to remove the check mark.


    Removing the check mark prevents the service from starting automatically at boot
    time.'
  merge: -1
  img_proc: true
- pgno: 260
  md: '# Chapter 17: Securing Your Future


    +   5. Repeat Steps 2 through 4 for each unnecessary service.


    +   6. When you have turned off each unnecessary service, click the Save button.


    +   7. Choose Quit from the File menu.


    Which services you turn off depends on your needs, of course. For example if you''re
    unintentionally running a Web server, turn off the httpd service. You generally
    should be able to turn off these services:


    +   The Advanced Power Management Daemon (APMD): APMD is useful if you, like most
    people, regularly power-off your workstation or laptop. However, APMD is generally
    unnecessary on servers that run continuously. You want to keep APMD in the former
    case (workstation or laptop) and remove it in the latter (server).


    +   GPM: This service allows you to use a mouse when you''re running in non graphical
    mode. You''re running in graphical mode, so turn it off.


    +   The job-queue daemon: The at daemon is used to schedule one-time cron-jobs.
    If you need at, you know it. Otherwise, turn it off.


    +   Network File Sharing (NFS): You need only services such as nfs, nfslock, portmap,
    and autofs when you''re running an NFS server or client. The last thing you want
    to share is files to the Internet,


    +   Print services: Many people don''t run the printer daemon. Turn off CUPS (Common
    UNIX Printing System) and lpd whenever you don''t need to print.


    +   Samba: As with NFS, you should turn off Samba if you don''t need it. Terminate
    handlers with vengeance.


    The rest is up to you.


    # Using chkconfig


    | You can use the CLI-based chkconfig utility to set services to start automatically
    or not. Open a GNOME Terminal session and log in as root (type su -). This list
    shows your options: | Stop a service with the chkconfig -- add option: |

    | Delete a service with the chkconfig -- del option: |

    | List the services by running the chkconfig -- list command. | |

    | List an individual service by specifying the service after the -list option:
    chkconfig -- list apmd. |'
