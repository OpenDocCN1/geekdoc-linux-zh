  md: '# 218 Part IV: Revenge of the Nerds


    +   - Authoritative name servers: Every zone must have an authoritative name server.
    It holds the information for every host within the zone. You can create primary
    and secondary authoritative name servers. The secondary name servers back up the
    primary name servers.


    +   - Non-authoritative name servers: Present data that doesn''t change much over
    time, you can create name servers that load fast but don''t have to provide the
    most up-to-date information.


    +   - Caching server: Name servers can be configured to look up addresses from
    other name servers and temporarily save, or cache, the information. Caching name
    servers helps spread out the load of service


    +   - Root name servers: The authorities that control domain-name registration
    provide root name servers that hold the addresses of name servers for each domain.
    DNS queries to root name servers to find out where to find authoritative name
    servers.


    The parameters found in DNS configuration and zone files are called records (RR).
    This list describes:


    +   - A records: Address (A) records map IP to numeric addresses.


    +   - C records: Canonical (C) records define aliases for A records.


    +   - MX records: Mail-exchange (MX) records specify the mail servers that service
    a domain.


    +   - NS records: Name-server (NS) records specify the name server for a zone.


    +   - SOA records: The start-of-authority (SOA) parameter creates a section that
    describes the generic properties of a zone file. The SOA configures parameters
    that set the serial number and various timeouts, plus the domain name of a zone.


