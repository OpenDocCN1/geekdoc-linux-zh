    The backslash (\) is an escape character in the Linux world; in the Windows world,
    a backslash separates directory names. That is, backslashes prevent Linux (the
    bash shell) from interpreting the following literally. Without the backslash,
    Linux (bash) interprets the directory name as two separate entities, Program and
    Files. The combination of a backslash and a space, Program\ Files, ensures that
    the space is a separator and not part of a directory name or filename, allows
    Linux to process the directory name correctly: Program Files. By using backslashes,
    you don''t have to quote the preceding command (refer to Step 8). You could then
    rewrite command as `wine C:Program\ Files\Microsoft\Office/wine.exe`.


    Introducing Codeavers CrossOverOfficeWine helps you to tap into the resources
