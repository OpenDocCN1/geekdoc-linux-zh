    \ your DSL modem working is easier after you do so.\n\nMost consumer DSL providers\
    \ now use the asymmetrical DSL (ADSL) type of connection. The following list describes\
    \ the process for getting an ADSL connection. (Please note that we use the generic\
    \ acronym DSL interchangeably with ADSL. Most consumer DSL connections are really\
    \ ADSL, and that's the type of connection we describe in this chapter.) Follow\
    \ these steps to set up your DSL service:\n\n+   1. Find a DSL provider.\nYou\
