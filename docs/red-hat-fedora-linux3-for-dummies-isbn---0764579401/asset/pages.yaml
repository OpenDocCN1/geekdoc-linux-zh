    +   5. Click File:Exit in Notepad to exit.


    # Having Fun: Playing games


    Now, editing is great — but when you''ve been there and done that, you can move
    on to a more complex application and investigate Wine''s true power. Wine is good
    at running programs that are not yet available in Linux (a seriously handy capability).
    In this section, we develop and install a Windows-based shareware game.


    > Shareware is software that the developer lets you test for free; sometimes the
    software is usable for a limited trial period. If you like the program, you can
    — and send the programmer a small fee.


    Wine utilities

    Wine provides several useful utilities that help you configure and test it, and
    we describe some of them here:\wineboot: Simulates the rebooting of a Windows
    computer. Rebooting is necessary whenever you''re installing Windows applications
    (for example, Microsoft Word), and this utility provides that function.

    winedhg: Debugs Wine applications. This utility shows what''s going on under the
    surface, so to speak. You need to use this utility only if you''re developing
    a Wine application.\winecfg: Helps set many Wine configuration options.

    clock: Duplicates the simple Windows clock.

    redigit: Duplicates the Registry editor.

    program: Functions as a program manager.

    You can try running one of the Wine utilities. For example, test the winefile
    utility, which acts as a file manager.'
