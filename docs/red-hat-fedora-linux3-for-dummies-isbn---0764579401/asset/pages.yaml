- pgno: 39
  md: '# 20 Part I: Installing Fedora Core


    Defragmenting consolidates all files on your hard drive into contiguous partitions.
    This task is necessary because Windows is a slob as operating systems go, scattering
    data all over the hard drive faster than a nerd chasing autographs at a Trek convention.


    These steps show how to defragment your Windows partition:


    +   1. Close all programs and windows on your computer, leaving just the desktop
    and icon bar.

    2. Double-click My Computer icon on the desktop.

    3. Select drive C by clicking it, and then Choose File::Properties::Tools.

    4. Click the Defragmentation Now button.


    The defragmentation program looks at the drive to determine whether it needs defragmentation.


    You may get a message telling you that you do not need to defragment because your
    hard drive is not very fragmented; don''t believe it. Under ordinary circumstances,
    this statement may be true. Resizing a disk is a tricky affair; you must fully
    defrag your hard drive because you''re going to move the end of the partition
    file system and make the partition smaller, erasing everything outside that barrier.


    +   5. Click Start.


    The defragmentation window appears and the process begins.


    Defragmenting can take a long time, depending on the size of your hard drive and
    how spread out (fragmented) the data is across the disk.


    Click the Show Details window and you can scroll up and down the window to watch
    the defragmentation process in action. The colored blocks represent data, and
    the white space represents free space on your hard drive that FIFS can allocate
    to the Linux file system. The movement of the blocks around the screen shows that
    the data is being moved forward on the drive. Expect to see white space appear
    toward the top of the window, which represents the end of your drive. At the end
    of the defragmentation process, no colored blocks appear at the bottom of the
    window, and all the blocks are compressed towards the top of the window. What
    may seem quite a long time, defragmentation ends. All useful blocks of information
    are now at the beginning of the drive, making it ready for resizing your program.


    These instructions describe how to defragment your computer if you''re running
    Windows NT, Windows 2000/2003, or Windows XP (NTFS):


    +   1. Close all programs and windows on your computer.


    +   2. Click Start::Programs::Accessories::System Tools::Disk Defragmenter.


    ![](img/019b0d727ede29f1ccb08789667e950f_39_0.png)


    ![](img/019b0d727ede29f1ccb08789667e950f_39_1.png)'
  merge: -1
  img_proc: true
