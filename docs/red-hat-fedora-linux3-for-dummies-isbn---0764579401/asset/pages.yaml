- pgno: 74
  md: '# Introducing the Linux File System Tree


    Linux, like Windows, uses files and directories to store and organize information
    and applications. This section introduces the Linux file system.


    Linux sees all its parts, except its network, as files. No surprise that Linux
    accesses files, directories, and devices as file addresses. To figure out everything,
    Linux uses a system of letters and numbers to refer to drives and drive partitions
    — for example, /dev/hda be the name of the first IDE hard drive in the system,
    and /dev/sdb be the name of the second SCSI hard drive.


    You can compare the Linux file system to an upside down tree. The trunk of the
    tree is the root directory — represented by a / (slash). A series of limbs, branches,
    and leaves extends below the root: Limbs are mount points, the branches that extend
    from the limbs are directories, and the leaves on those are your files. Figure
    4-4 shows the root, several directories, including etc, and a couple of files
    in etc.


    ![](img/019b0d727ede29f1ccb08789667e950f_74_0.png)


    Figure 4-4: The Linux file system resembles an upside-down tree.


    Each mount point is a drive partition or a remote file system (such as your DVD
    or CD-ROM drive) that is mounted to—identified and made visible as a directory
    of the limb "above" on the imaginary tree. Whenever a disk partition or remote
    file system is mounted on the directory branch, it turns that branch into another
    limb — allowing even more branches to be positioned and attached below the mount
    point.'
  merge: -1
  img_proc: true
- pgno: 75
  md: '# Part I: Installing Fedora Core


    Fedora Core needs a root partition in your directory structure and a swap partition.
    The root partition stores all personal and system files and directories; Linux
    uses swap space to extend memory capabilities beyond the limit of your random-access
    memory (RAM). If you have 512MB and 512MB of swap space, for example, you can
    run a program that uses almost 1GB of memory. Part of it is stored in memory and
    the rest in swap space.


    This configuration is not much different from the Windows and MS-DOS file systems
    — Windows, after all, the concept of a hierarchical directory tree — is somewhat
    different. The top-level directory in Fedora Core, root, is designated with a
    forward slash (/). Subsequent subdirectory name follows that slash. For /home/,
    the home directory is a subdirectory of root and is shown as /home/. In Windows,
    the world of the root is designated with a backslash (\). The prompt is synonymous
    with C:\ The theme for both operating systems is clarity when dividing subdirectories:
    Linux uses forward slashes and Windows uses backslashes; directory can be shown
    as /xyz in Linux or as C:\xyz in Windows. Both operating systems have subdirectories,
    such as /xyz/abc in Linux or C:\xyz\abc in Windows.


    The location of a file or directory is given as a path. For instance, /xyz/abc
    describes the path to abc; if the file 123 lives in subdirectory abc, then its
    path is /xyz/abc/123. Absolute paths also refer to the root directory (as in the
    examples just given). Relative paths refer to wherever you happen to be in the
    system; they''re relative to your current location.


    Another fundamental difference between Linux and Windows file systems is that
    Linux requires you to explicitly mount file systems. Windows does so automatically.
    Explicitly mounting the file system is not onerous as it sounds. Fedora Core installs
    utilities that automatically sense and mount file systems when necessary. For
    example, the default Fedora Core configuration mounts a DVD or CD-ROM automatically
    whenever you insert it in.


    ![](img/019b0d727ede29f1ccb08789667e950f_75_0.png)


    The Workstation installation type you describe in Chapter 3 automatically sets
    up your root and swap partitions in addition to an extra boot partition for storing
    the Fedora kernel and other files for booting your computer. (The Personal Desktop
    installation type uses the same partitioning scheme as the Workstation installation
    type.)


    # Creating User Accounts


    Because Fedora Core is a multiuser system, more than one person at a time can
    use it. For example, you can be logged at the computer console (the attached keyboard
    and monitor) while someone else is logged in via a network connection. Therefore
    you — and every other user — must have an'
  merge: -1
  img_proc: true
