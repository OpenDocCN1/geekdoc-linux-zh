  md: '# Chapter 19: Building a Streaming Audio Server


    # # Understanding URLs


    Have you ever wondered what the various parts of a URL mean? Using a URL such
    as http://localhost:8000/track1.ogg to access a streaming-audio server, we thought
    that we딨 what the various parts mean and do. This list describes the function
    of each URL element:


    form. For example, you could replace localhost with its numeric address, 127.0.0.1.


    +   * Protocol: Icecast uses Hyper Transport Protocol, or HTTP, packets to encapsulate
    audio streams. HTTP is a good choice because it''s easy to configure your firewalls
    to allow HTTP connections.


    +   * Port: Icecast ports connection requests on a TCP port uses port 8000 by
    default. You can easily change the port by modifying the Icecast configuration
    file.


    +   * MountPoint: This component specifies the Icecast stream to connect to. Icecast
    is capable of playing two streams. In this example, you use the content file track1.ogg,
    which you can create by following the steps in the preceding section.


    +   * Address: The Icecast server''s IP address can be either domain or numeric


