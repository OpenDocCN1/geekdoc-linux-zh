    # Accessing your Web server through your firewall


    This section describes how to open your firewall to allow access to your Web server.
    Exactly how you allow access depends on whether you''re connecting to the Internet
    directly from your Linux computer or through a LAN. The steps in this section
    describe how to modify your firewall to allow the Internet to view your Web page.


    You have to modify your Internet gateway or firewall too. You have to allow external
    browsers to connect to Port 80 on your Apache server. Create the firewall by ruling
    by this command:


    ```

    iptables -A INPUT -p tcp -m state -state NEW,ESTABLISHED -j --dport 80

    ```


