  md: '# Chapter 2


    # # Paving the Way for Fedora Core


    ### In This Chapter


    +   - Preparing to install Fedora Core

    - Determining whether your Windows partition is FAT or NTFS

    - Defragmenting your hard drive

    - Resizing FAT partitions

