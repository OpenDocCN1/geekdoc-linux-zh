- pgno: 66
  md: '# # Chapter 4


    # # Getting to Know Fedora Core


    **In This Chapter**


    +   - Booting your Fedora Core computer

    - Logging in to your Fedora Core computer

    - Using graphical and text-based applications and utilities

    - Setting up your monitor and video card

    - Getting to know the Fedora Core file system

    - Making user accounts for the first time

    - Logging out of your Fedora Core computer


    If you have installed Fedora Core, you should spend a few minutes studying some
    basics before you start it. This chapter covers just enough, but no more, of the
    Linux fundamentals needed to get you started. We cover topics such as starting
    and stopping your Fedora Core computer, understanding the difference between graphical
    and nongraphical applications, and how Linux users use files.


    We start by describing how to start your new Fedora Core computer. This process
    is simple, but it is helpful to know more about it.


    # # Booting Your Fedora Core Computer


    To *boot* a computer means simply to start it or turn on the power; to *reboot*
    a computer means to restart it. The following steps describe how to boot your
    Fedora Core:


    +   - Make sure that your computer is turned off.

    - Turn on the power to your computer.'
  merge: -1
  img_proc: true
- pgno: 67
  md: '# 48 Part I: Installing Fedora Core


    After a short time, the Fedora Core boot menu appears on your screen. If you have
    only Fedora Core installed on your computer, you''re given only one choice of
    operating systems to boot: Linux (see Installation Stage 2: Slicing and Dicing
    the Pie in chapter 3 for more information about dual-booting).


    Fedora Core runs in three different states (referred to as run levels) 1, 3, and
    5. Each run level is used to perform different functions. At Level 1 (called single-user
    mode), Linux operates with a minimum of processes so that you can make configuration
    changes and troubleshoot problems. In Level 3, you interact with the computer
    by typing commands; you typically use Level 3 to run servers that provide only
    network services that don''t need graphical interfaces. When Fedora Core is running
    in Level 5, it runs with the graphical X interface; it''s the default run level.
    You can use GRUB (Grand Unified Bootloader) to select a different Linux run level.
    When GRUB appears, press the e key to select the line that begins with Kernel.
    Press the down-arrow, add a space, and then press 1, 3, or 5. Press the Enter
    key and press the b key. Your computer boots into the selected mode.


    ![](img/019b0d727ede29f1ccb08789667e950f_67_0.png)


    +   3. Press the up- and down-arrow keys to highlight the word Linux (if it''s
    not highlighted already) and then press Enter.


    +   * If you don''t press any of the keys, the default operating system (that
    is, Fedora Core, which sets itself as the default when you install it) starts
    automatically after a 10-second delay


    +   * If you''re running more than one operating system (for example, Fedora Core
    and Windows), you can select any of the listed operating systems to boot: we assume
    that you choose Linux.


    After you press Enter, Fedora Core boots. During this process, a graphical progress
    window shows how far the boot process is (optionally) display lots of technical
    information by clicking the Show details button. The optional information is Linux
    is learning about your computer and its hardware (disk drives, networks, and memory,
    for example).


    # Logging In To Your Core Computer


    When you use Fedora Core (or any Linux distribution), you must log in a particular
    user with a distinct login name. Why? Because Linux is a multiuser system — it
    uses different accounts to keep people from looking into other people''s secret
    files, erasing necessary files from the system, and otherwise (intentionally or
    unintentionally) doing bad things.'
  merge: -1
  img_proc: true
- pgno: 68
  md: '# Chapter 4: Getting to Know Fedora Core


    The use of unique identities helps to keep the actions of one person from affecting
    the actions of another because many people may be using the same computer system
    at the same time (for example, over a network). A benefit of this strategy is
    that Linux computers are essentially invulnerable to viruses because no user''s
    files and directories can be used to corrupt the system as a whole.


    As Fedora Core boots, you see all sorts of messages scrolling on the screen. After
    the scrolling stops, the login screen appears.


    If you choose (during installation) not to have the X Window System start automatically
    when you boot your system, you see the `login:` prompt.


    If you make a mistake typing the password or your login, the system asks you to
    retry it.


    We strongly recommend that you do most of your experimentation with Fedora Core
    as a unprivileged user — and that log in as the root user only when necessary.
    If you operate as root, you can delete or change anything and everything — and
    you run the risk of corrupting your system, having to reinstall the operating
    system, or losing data. When you''re logged in a regular user, you can accidentally
    erase your own files and data, but you cannot erase someone else''s files or system
    files.


    Fortunately, Fedora Core provides many administrative utilities you can start
    as a privileged user. Each Fedora Core administrative utility prompts you to enter
    the root password as it starts and then performs its specific function, but that
    function, with root privileges. You''re prevented, therefore from causing unintended
    damage to other systems (See Appendix C for information about how file permissions
    work and how you can modify them.)


