  md: '# 106 Part II: Got Net?


    The first chain, INPUT, filters all incoming packets. You can see that the default
    policy denies all packets. This policy makes for a perfect firewall — nothing
    can get in. However, the perfect firewall is also useless because your computer
    cannot see or interact with the network.


    You can begin to make the firewall useful by creating a rule to allow all incoming
    packets on the logical loopback (lo) interface; the loopback interface is used
    for internal communication on your computer. The next rule allows the return packets,
    RELATED AND ESTABLISHED, from outgoing connections to come back in. The last rule
    (which is optional) allows the incoming Secure Shell connections to your computer.


    The next chain, FORWARD, prevents all packets from being forwarded through your
    Linux computer. Forwarding is necessary only if you use your computer for routing
    or other advanced networking functions.


    The last chain, OUTPUT, defines which IP packets are allowed out of your computer.
    Again, the first rule allows unlimited traffic through the loopback (lo) interface.
    The second and last rule allow all packets to leave your firewall.


    The following section describes how to save the rules you just created and displayed
