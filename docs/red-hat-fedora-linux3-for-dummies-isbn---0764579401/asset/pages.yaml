  md: '# Part I: Installing Fedora Core


    # Resizing FAT partitions with FIPS


    FIPS resizes FAT-based Windows partitions. Newer versions of Windows (some versions
    of Windows 95, Windows 98, and Windows Me) use a 32-bit file-allocation table
    (called FAT32) and drive-management tools that provide for single-drive configurations
    larger than 2GB. Older versions of Windows 95 use a 16-bit FAT (called FAT16,
    oddly enough); to use space over and above 2GB, the hard drive has to be partitioned
    into logical disks of 2GB or less. Newer computers have hard drives much larger
    than the 2GB limit. If the drive is restarted, the large drive-management system
    is disabled, and DOS and Windows partitions are again limited to 2GB.


    To get this done, you have to use the ancient MS-DOS (Microsoft Disk Operating
    system) — one way or another, or all of Windows-dome owes its existence to MS-DOS.
    The following instructions describe how to create an MS-DOS floppy disk, which
    you can use to run FIPS:


    +   1. Insert a floppy disk and click the My Computer icon.

    Be aware that these steps permanently erase all information from the disk.

    2. Right-click the 3½ Floppy (A) icon and choose the Format option.

    The Format A\ window appears.

    3. Click the Make a bootable disk option and then the Start button.

    A confirmation window, labeled Format A\, opens again.

    4. Click the OK button and your floppy is formatted.


    The Fedora Core distribution, bundled on a single DVD included with this book,
    unfortunately doesn''t include the FIPS utility. However, you can download- FIPS
    to the floppy disk you created:


    +   1. Open your browser and go to the following Web site:

    2. Download fips.exe, restorb.exe, errors.txt, and (optionally) readme.lst and
    fips.fqq to your floppy disk.

    3. Boot your computer from the floppy disk.

    The computer restarts in MS-DOS mode.

    4. Type fips at the prompt and press Enter.

    Some messages appear and flash by, but you can ignore them all except the last
    one, which asks you to Press any key.

    5. When you see the Press any key message, do so.

    You see all existing partitions on the hard drive.


