    # Configuring Icecast2


    Ice2 gets its multimedia content from static files, such as music formatted in
    Ogg/Vorbis. Ice2 then feeds the audio streams to the Icecast2 server. You can
    then connect to the Icecast2 servers with your client application to listen to
    music. All these connections are made over IP networks.


    Ice2 and icecast2 use the loopback (127.0.0.1) interface to communicate. (The
    loopback interface is an internal network interface that doesn''t use any physical
    device.) Using the loopback interface provides a simple method for testing your
    configuration.


    ![](img/019b0d727ede29f1ccb08789667e950f_302_0.png)


    Icecast2 uses Port 8000 to communicate with its stream source and Port 8001 for
    administration.'
