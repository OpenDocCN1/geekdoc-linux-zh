  md: '# Chapter 17: Securing Your Future


    The Targeted policy compromise makes sense. If you use your Fedora Core computer
    as a workstation protected by a firewall and the methods and systems described
    in this chapter, then you have relatively little security exposure. However, if
    you start running network services such as Apache, then your risk increases. Protecting
    network-based services with SELinux provides a big step up in security.


    Describing about the inner workings of SELinux goes beyond the scope of this book.
    Using the Targeted policy should be adequate for most people''s needs. However,
    you can read more about SELinux from the following mailing list


