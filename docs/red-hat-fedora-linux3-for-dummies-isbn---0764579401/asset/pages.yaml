  md: '# Chapter 4: Getting to Know Fedora Core


    individual user account in order to use the computer. Each account requires an
    individual account name and password to protect your information and keep your
    tasks separate from other people''s tasks.


    If you have to add new users (if you have a home network, for example) or you
