    # Connecting your Internet gateway


    After you configure your Internet gateway to forward network traffic from your
    private network to your Internet connection (refer to the preceding section),
    you need to make that connection. In this section, we describe how to use the
    connections we introduce in Chapters 5 and 6. You will build on those instructions
    to connect your entire network to the Internet through these connections.


    From a functional viewpoint, the type of Internet connection you use (phone, DSL,
    or cable) doesn''t matter because all Internet connections send and receive the
    same network traffic. (Practically speaking, of course, the higher throughput
    and lower latency of bandwidth make it more desirable than old telephone modems.)
    For this reason, you can treat as interchangeable the Internet connections you
