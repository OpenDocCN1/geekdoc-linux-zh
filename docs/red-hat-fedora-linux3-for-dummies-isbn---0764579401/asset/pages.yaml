- pgno: 100
  md: '# Chapter 6: Broadband Rocks!


    # # The many faces of DSL


    DSL comes in a variety of flavors. Most consumers end up using ADSL because it
    offers inexpensive Internet connections with reasonably high speeds. ADSL serves
    an individual user''s Internet needs very well; even it provides a small business
    with adequate service. ADSL is, not surprisingly, the available of all DSL flavors.


    a substitut for T1 connections because it provides the data rates of 1.544 Mbps.


    The other types are more suited for business use. Most locals probably have access
    to two or three of these services. DSL comes in a range of variations:


    +   - ADSL (asymmetric DSL): The ADSL download (downstream) isn''t the fast as
    its upload (upstream).That''s why it''s asymmetrical. The maximum ADSL speed is
    8 Mbps, but it''s usually limited to less because of the POTS infrastructure limitations.


    +   - HDSL2 (high-bit-rate DSL 2): HDSL2 provides the same specifications as HDSL,
    but works over a twisted-pair connection.


    +   - ISDN (single-line digital subscriber): ISDN, the successor to the ISDN technology,
    uses the same line encoding (2B1Q) as ISDN and DSL, is used to provide DSL service
    in areas where the more popular forms, such as ADSL and SDL, aren''t available.
    ISDN is capable of providing upstream and downstream rates of 144 Mbps.


    +   - DSL (symmetric DSL): DSL is commonly called Symmetric VDSL because upstream
    and downstream speeds are symmetric.


    +   - G.Lite: Also known as Universal DSL or splitters ADSL. G.Lite is a low-speed
    version of ADSL that doesn''t require filtering out the POTS signal. It provides
    much as 1.5 Mbps downstream and 52 Kbps upstream.


    +   - VDSL (very-high-rate DSL): VDSL provides as much as 50 Mbps over distances
    up to 1,500 meters on short loops. VDSL is particularly useful for campus environments
    — universities and business parks. VDSL is now being introduced in market trials
    to deliver video services over phone lines. You can also configure VDSL in symmetric
    mode.


    +   - HDSL (high-bit-rate DSL): HDSL is a symmetrical protocol with equal upstream
    and downstream speeds. You can use HDSL as


    +   - xDSL: xDSL is a generic term for all DSL flavors (the x means "whatever”).


    # A real-world example: Configuring an ActionTec DSL modem


    Writing explicit configuration examples is always difficult and liable leave some
    readers disappointed. But the DSL appears to be consolidating around modern with
    Web-based configuration interfaces. Therefore we can provide an example that should
    be useful to you, regardless of whether you have the same type of modem. Good
    luck!'
  merge: -1
  img_proc: true
