- pgno: 368
  md: "Appendix E: Revving Up with RPM and YUM\n\n# Manually installing and upgrading\
    \ packages\n\nThe RPM -i parameter indicates that an installation will take place.\
    \ You can add Verbose mode (which provides additional information) by using the\
    \ -v option. (You can combine options into a single group; for example, -i v can\
    \ become -iv\\.) Follow these instructions to install and upgrade packages:\n\n\
    +   1. Log in as root.\n2. Open a terminal emulator window by clicking the terminal\
    \ icon in the GNOME Panel (refer to Chapter 4 for instructions).\n   The GNOME\
    \ terminal emulator opens.\n3. To add the package, type the following command\
    \ from a terminal window:\n\n```\nrpm -iv /media/cdrom/Fedora/RPMS/mozilla-mail-*\n\
    ```\n\nAlternatively, you can upgrade a package that has already been installed\
    \ on your system. Substitute the RPM upgrade option, -U, in place of the option,\
    \ -i. For example, the following command updates the Mozilla e-mail package:\n\
    \n```\nrpm -U /media/cdrom/Fedora/RPMS/mozilla-mail-*\n```\n\nThe files that constitute\
    \ the newer Mozilla-mail package overwrite the older version. Existing configurations,\
    \ however, are saved by adding .rpmsave suffix to the configuration file.\n\n\
    # Manually removing packages\n\nRPM packages are good residents on your computer\
    \ because they lend them-easy to removal. The rpm command permits you to remove\
    \ packages via the erase (-e) function.\n\nSuppose you're not fond of the Mozilla\
    \ e-mail client because you like the Evolution client better. No problem: You\
    \ can remove the Mozilla mail-package. To remove an RPM package, follow these\
    \ steps:\n\n+   1. Log in as root and open a terminal emulator window.\n   The\
    \ GNOME terminal emulator opens.\n2. Enter the following command to find the name\
    \ of the package to remove:\n\n```\nrpm -qa | grep mozilla\n```"
  merge: -1
