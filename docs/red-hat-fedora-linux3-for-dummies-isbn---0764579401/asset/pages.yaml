- pgno: 156
  md: '# Chapter 11


    # Surfin’ the Net and Using E-Mail


    # **In This Chapter**


    +   * Brushing up on Web history

    * Mozilla to surf the Web

    * Getting extra help from plug-ins

    * Keeping your passwords safe

    * Getting your e-mail with Evolution


    In this chapter, we introduce the open-source Mozilla Web browser and Evolution
    e-client. Mozilla provides all the capabilities of other popular browsers. We
    show how to set Mozilla for your Fedora Core computer so you can use the Net.
    You can use your computer as a multimedia device. After start working with Mozilla,
    we describe how to use Evolution as your e-mail system.


    Our goal in this chapter is to introduce the basic Mozilla and Evolution features.
    However, we want you to know that both systems can do far more than we describe
    in this chapter. For more information about Mozilla and Evolution, check out features
    available on the Help menu, such as the Reference Library or Help contents.


    ![](img/019b0d727ede29f1ccb08789667e950f_156_0.png)


    # Making the World Wide Web Possible


    Once upon a time, a company named Netscape created a browser to surf the Internet.
    The browser was originally named Navigator, and later, Communicator. Millions
    of people downloaded it from the Internet for free. Netscape in the hands of millions
    of people (including us, your authors) the power to access the exploding number
    of Web servers. Netscape made history and changed the world because it changed
    the Internet from a medium that served mainly scientists into a tool that anyone
    can use.


    Even though Netscape Communicator is freely distributed to anyone who wants it,
    it isn''t open-source software in the same way Linux is. Quite simply, Netscape,
    the company, is a moneymaking venture, and Netscape considers the way software
    works to be proprietary.'
  merge: -1
  img_proc: true
- pgno: 157
  md: "# 138 Part III: Linux, Huh! What Is It Good For? Absolutely Everything!\n\n\
    On the other hand, Netscape recognizes the importance of the open-source dynamic,\
    \ which is why it released an open-source version of Netscape named Mozilla. Now,\
    \ countless numbers of people are developing and enhancing Mozilla, the default\
    \ browser for Fedora Core computers.\n\nThe DVD that comes with this book includes\
    \ Mozilla, the open-source brother to Netscape Communicator. Netscape and Mozilla\
    \ are quite similar, although they have a slightly different look and feel.\n\n\
