  md: '# 34 Part I: Installing Fedora Core


    # Confidential for Windows users


    If you''re installing Fedora Core in a dual-boot configuration with Windows NT,
    Windows 2000, or Windows XP, your NT boot record is temporarily overwritten, which
    means you cannot boot Windows NT. Don''t panic: Your NT partition—C drive—is not
    erased, it has been rendered temporarily unusable. (An boot record is what enables
    a Windows system to start automatically whenever you start your computer.)


    You can install Fedora Core without overwriting the NT boot partition if you click
    the Change Boot button and select the Do Not Install a Boot Loader radio. When
    you click the Next button, the Advanced Boot Loader Configuration window opens.
    Select the First Sector of Boot partition and then click the Next. Your Windows
    boot configuration continues to operate as before.


    ![](img/019b0d727ede29f1ccb08789667e950f_53_0.png)


    Linux disk partitions are analogous to Windows disk partitions. The Windows C
    drive uses a single disk partition. The Linux equivalent is the root (/) partition.
    The two operating systems use different terminology, and the analogy isn''t perfect,
    although the concept is the.


    The Fedora Core installation system must partition your hard drive in order to
    install its software. Partitions divide a hard drive into one or more parts. The
    divisions are used to organize the software and data (the operating system, user
    files, and so on) that make up the operating system.


    Fedora Core provides two partitioning methods: automatic and manual. Using the
    manual method requires you to make numerous decisions about how to divide your
    hard disk into individual partitions. The automatic method makes the whole process
    much simpler, and we recommend it if you''re feeling lucky (or want to experiment
    or have the experience of manually partitioning your hard drive). We use the automatic
    method in this book.


    +   1. We suggest using the Automatically partition option (the default selection),
    so click the Next button.


    If you''re using a new disk that has never been partitioned (or your existing
    disk''s partition table has become corrupted in some way), a Warning dialog box
    appears.


    +   2. If prompted, click the Yes in the Warning dialog box. The Automatic Partitioning
    window appears. You have three options:'
