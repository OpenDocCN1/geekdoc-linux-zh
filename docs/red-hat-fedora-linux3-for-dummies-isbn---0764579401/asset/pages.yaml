  md: '# Chapter 16: Creating Basic Linux Network Services 217


    carbon-based humans to remember and use. The Domain Name System (DNS) solves that
    problem by converting numbers to names, making it possible to use names instead.
    fedora.redhat.com rather than 209.132.177.50. In many ways, DNS makes the Internet
    usable and therefore popular.


    DNS is an interdependent information-sharing database. No centralized servers
    contain actual addresses, such as fedora.redhat.com. Instead, DNS is stored so
    local servers store local addresses, and a few centralized servers store information
    about where to go to find local addresses.


    DNS makes the Internet possible. The Internet wouldn''t be practical if we had
    to look up IP addresses from some gigantic book. DNS also makes working on smaller
    private networks more convenient. By building your own DNS server, you avoid having
    to remember all the addresses of all your machines. This section describes how
    to build a simple DNS system to serve your network.


    ![](img/019b0d727ede29f1ccb08789667e950f_236_0.png)


    Add the name/address pairs each computer''s /etc/hosts file if you don''t construct
    a DNS server. Edit /etc/hosts and add the IP address, host name, and optionally,
    an alias for every computer on your private network. For example, 192.168.1.254
    paunchy.net veracity Cancun/ Add 192.168.1.1 canunun paunchy.net Cancun to veracity/etc/host
    file. These entries allow each of the two machines in the network to address each
    other by name.


    Introducing DNS components Overall, the Domain Name System is complex; it contains
    many components. But we show you how to build a DNS server for your private network,
    you can use a simple system using a relative handle of DNS components. Building
    your DNS server requires a good understanding of the basic DNS components, so
    here goes:


    +   Domains can optionally be divided into subdomains. For example, Red Hat has
    a subdomain, fedora.redhat.com, used for the Fedora Core Project.


    +   Domains themselves are divided into domains. The ubiquitous .com, .edu, and
    .org are top-level domains. They organize the Internet into business, educational,
    and not-for-profit areas, respectively.


    +   Zones are divided into zones. DNS servers serve zones. A zone can map directly
    to a domain; multiple zones can serve a domain. The DNS server you are building
    in this section consists of a single domain that services the fictitious paunchy.net
    domain.'
