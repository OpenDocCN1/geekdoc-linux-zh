- pgno: 189
  md: '# 170 Part III: Linux, Huh! What Is It Good For? Absolutely Everything!


    This section provides only a basic introduction to the things you can do with
    OpenOffice. No, we are not hopelessly lazy; it’s just it would take too much space
    to describe it in all detail. Please experiment with your own test documents and
    consult the online help system for more information.


    ![](img/019b0d727ede29f1ccb08789667e950f_189_0.png)


    # Firing Core and using OpenOffice


    Fedora Core provides OpenOffice, and installs it by default. OpenOffice is easy
    to access. Click the GNOME Menu button and then choose Office:OpenOffice.org Writer.
    You can choose some (but not all) OpenOffice functions from this menu — but you
    can start the Calc spreadsheet program from an OpenOffice window. From any window
    (in Writer or Imp, for example), choose File:New:Spreadsheet to open Calc. After
    thinking about life for a few seconds, OpenOffice appears.


    The first time you start OpenOffice, it asks whether you want to use the workstation
    or personal model. The former installs the OpenOffice programs in a central location
    accessible to all users; the latter option installs a copy of OpenOffice in your
    home directory. We use the workstation configuration in this section, but you
    can select the personal model.


    When you use OpenOffice for the first time, you''re also asked a few questions
    about importing an address book. (We cancel this operation because we prefer to
    use the Romanian extension address book.)


    You can access all OpenOffice functions by clicking the File button, in the upper-left
    corner of the window, and then clicking the one you want.


