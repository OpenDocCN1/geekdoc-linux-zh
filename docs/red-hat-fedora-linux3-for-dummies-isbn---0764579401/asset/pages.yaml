    - www.samag.com/documents?s=7835/sam0303a/0303a.htm

    - www.crypt.gen.nz/selinux/faq


    # Understanding the Security Process


    The best way to look at security is as a process. The more you think about and
    the more you study it, the safer you are. You should use the security systems
    described in this chapter as the foundation for your security process. However,
    you should continue to build your security process to meet the needs of your own
    computer system and network.


    This section outlines additional building blocks you may consider adding to your
    process:


    +   - Making backup: Backups are part of the security process? Yes! Backups are
    an essential security tool in the sense that you can eliminate the possibility
    of getting hacked. When your security is breached, you may lose all sorts of information
    and configurations. For example, all the information on your computer may be completely
    erased or worse, you may not know which files are good or bad. You must ensure
    your ability to recover from these types of catastrophes.


    One good backup method is to use the GnomeToaster, as we describe in Chapter 11.
    You can store your user account and configuration on a CD-R/RW or DVD+/RW. This
    method is reliable, and the discs should last forever. The only limitation is
    the CD''s ability to store only 700MB to 800MB of data (although you can store
    more data with compression).'
