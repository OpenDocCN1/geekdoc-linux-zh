    even with the help of Wine. For example, one of us has to use a trouble-ticket
    system to fix problems. The problem is that the trouble-ticket application doesn''t
    run under Linux, or without Wine. Author then must install Windows and Linux on
    his computer (a dual-boot system) or else maintain another for the sole purpose
    of running the application.


    Nothing is wrong with using a dual-boot computer, of course. But it seems a waste
    of time if all you need to do is one or two applications. Dual computers also
    have to be rebooted whenever you need to switch operating system to the other.
    An alternative to dual booting is VMWare, a commercial product from VMWare, Inc.
    This creates a virtual computer within a physical computer. The virtual computer
    runs as an application, just likeOffice or Mozilla.


    VMWare looks and works just a real PC. The virtual VMware PC can run an operating
    system like Linux or Windows in the same way as any real computer. The operating
    system runs on the machine whereas the real operating system. Applications that
    it fosters, however, look and work just like the real ones! VMWare creates not
    only virtual computers, but also virtual networks (trying out a network design
    before you have to hook it up...). Each virtual computer that you configure use
    bridged networking connects to a virtual switch. If you create two virtual machines
    on a single host, therefore, each can communicate with the other


    and as though they were connected to an Ethernet hub. This capability allows you
    to create experimental and production virtual networks. For example, you can create
    several virtual servers rather than purchase and maintain individuals.


    VMWare is (we''ve found) also good for writing Linux books. Writing tech books
    like one you require to use beta versions of new software while you''re writing
    the initial draft. The old method required installing the beta on your computer
    and using it for both testing and writing; alternatively, you can use the beta
    by side. Both are clunky and cause numerous headaches when the beta does some
    finicky. VMWare solves the problem by allowing you to run the current production
    version of Fedora Core on your computer and install the beta on your heart''s
    content while writing at the same time in Operating—all on the same virtual computer.


    You can download the VMware Workstation for free. It requires a license that costs
    $300 for commercial use and $100 for educational use. It''s money well spent.


    VMWare also offers a 30-day evaluation license for no charge. The temporary license,
    isn''t limited in any other way than the time limit, is ideal for testing this
    powerful tool. The steps in the following section describe how to download the
    product and its temporary license to find out its power.'
