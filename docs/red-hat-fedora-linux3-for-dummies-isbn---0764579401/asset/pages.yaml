- pgno: 327
  md: '# 308 Part V: The Part of Tens


    Although stacks make programming with subroutines efficient, they''re vulnerable
    to a hacking technique called buffer overflows (or stack-smashing). Overflowing
    a buffer is one of the most popular methods hackers use to break into computers.
    The idea is to feed seemingly crazy streams of code, in binary form, to a program
    in order to make them behave in ways their designers never intended.


    Here''s how buffer overflows work:


    +   1. The character stream overflows the intended boundaries of the subroutine-buffer.


    +   2. When the subroutine finishes, it reads the return address of the calling
    program or subroutine off the stack.


    +   3. But the false return address executes the malicious hacker code — and you
    have been hacked!


    A little more has to happen for the hacker to be successful, but you get the idea.
    When a hacker finds and exploits a vulnerable program, he gains access to your
    computer. Sometimes that comes in the form of superuser (root) access! Yikes!


    Here are some simple techniques you can use to minimize buffer overflows:


    +   Your first line of defense is simply to minimize the number of services you
    run. Run zero risk of compromise from a buffer-overflow vulnerability in any particular
    service if you don''t run that service.


    +   For example, the weak lion wrought havoc in Spring 2001. Lion took advantage
    of a vulnerability in the Linux sendmail!! and Lpd printer services. Computers
    that didn''t run services were vulnerable to the lion.


    +   Your second defense is to update your Fedora Core computer as often possible.
    Fedora Core posts package updates (as they become available) that fix vulnerabilities.
    Buffer overflow fixes comprise many of the package updates. Updating your system
    fixes many buffer overflow vulnerabilities.


    Click the red button on the GNOME Panel to start the updatedate service. You can
    also run the command update to encompass the same function.


    +   Your last defense is the new stack-protection system named ExecShield. ExecShield
    places a canary in the stack. A canary is a number that, if written by a buffer
    overflow, creates an invalid state for the calling software. The software that
    called the compromised subroutine sees the invalid state, and can decide to exit
    before any damage is done.'
  merge: -1
  img_proc: true
- pgno: 328
  md: '# Chapter 21: Ten Security Vulnerabilities and Their Fixes


    ExecShield is included in the Fedora kernel. When ExecShield is enabled, it prevents
    sections of a program, including its stack, from executing code or other programs.
    Some sections of a program (such as data) shouldn''t be executable — and that
    includes the stack, of course.


    ExecShield provides three modes of operation:


    +   **Disabled:** ExecShield is disabled and doesn''t affect your computer''s
    operation.

    You manually configure Linux to disable ExecShield by logging in as root, starting
    the GNOME Terminal, and running this command:

    ```

    echo 0 > /proc/sys/kernel/exec-shield

    ```nAlternatively, you can add the option to the /etc/sysctl.conf file to turn
    ExecShield off at boot time:

    ```

    kernel.exec-shield = 0

    ```


    +   **Enabled for binaries only:** This mode, the default, enables only programs
    — to work with ExecShield. You may want to use this mode, for example, a Web server.
    You would protect your most vulnerable services with ExecShield and not worry
    about, for example, your Mozilla browser.

    This mode of operation is the default for ExecShield. However, if you have changed
    it to another mode, you can reset this by logging in as root, starting the GNOME
    Terminal, and running this command:

    ```

    echo 1 > /proc/sys/kernel/exec-shield

    ```


    +   **Enabled for all binaries:** In this mode, all programs on your computer
    use ExecShield. Because ExecShield is relatively new, we recommend this mode only
    for experimenting.

    You manually configure Linux to use this higher level of security by logging in
    as root, starting the GNOME Terminal, and running the command `echo 2 > /proc/sys/kernel/exec-shield`.
    Alternatively, you can add the option `exec-shield = 2` to the /etc/sysctl.conf
    file to set ExecShield to its maximum level at boot.


    You can find out whether a program is compatible with ExecShield. Use the program
    execstack to query and set programs. For example, use the command `execstack -q
    /sbin/` and if you see a file, such as GRUB, the capital X in the first column
    indicates that the file has been compiled with the ExecShield hooks. You can get
    GRUB to use ExecShield by typing `execstack -s /sbin/bin`. You should eventually
    see more programs become ExecShield-compatible.


    ExecShield can also randomize the location where programs are loaded into your
    computer''s virtual memory. A hacker could exploit the knowledge of where a program
    is loaded into your computer''s memory. Linux loads programs at fairly predictable
    locations, but ExecShield mostly fixes the problem.'
  merge: -1
  img_proc: true
