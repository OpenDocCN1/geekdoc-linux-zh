    This list shows some of the features that Fedora Core provides:


    +   **Desktop productivity tools:** Red Hat and now Fedora Core have successfully
    worked overtime during the past few years to make Linux work on your desktop (that
    is, the single-computer system that most people use for everyday tasks such as
    word processing or Web browsing). Fedora Core software tools—such as the OpenOffice
