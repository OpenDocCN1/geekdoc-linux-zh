- pgno: 184
  md: '# Chapter 13


    # # Going to the OpenOffice


    In This Chapter


    +   - Introducing OpenOffice

    - Using OpenOffice Writer

    - Printing from OpenOffice


    Fedora Core is a great product that comes with a large base of services and applications.
    It has always been an outstanding platform for providing services and technical
    applications. But until recently, you didn''t find Fedora Core on many of the
    world''s workday computers; in other words, it lacked a presence on the "desktop."


    The Fedora Core problem used to be a lack of a full-blown office suite to work
    with word-processing documents, spreadsheets, and other documents. Fortunately,
    desktop productivity suites — such as OpenOffice and its sister application, StarOffice
    — have moved Linux from the back office to the front.


    # # Opening Your Office


    The OpenOffice desktop-productivity suite does nearly everything Microsoft Office
    does, but for less money. How much less? Well, 100 percent less because it''s-100
    percent free. Sun Microsystems, Inc. has the version named StarOffice and also
    provides an open-source version named — you guessed — OpenOffice. OpenOffice is
    licensed under the GPL/LGPL and SISL licenses. What do all those letters mean?
    They mean free-e, and they also mean that Linux can integrate the productivity
    features from OpenOffice (because Linux and OpenOffice share the GPL license).
    You can find more information about the licenses at


    ```

    www.openoffice.org/project/www/license.html

    ```'
  merge: -1
  img_proc: true
- pgno: 185
  md: '# 166 Part III: Linux, Huh! What Is It Good For? Absolutely Everything!


