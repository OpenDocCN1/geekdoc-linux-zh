  md: '# Part III: Linux, Huh? What Is It Good For? Absolutely Everything!


    # Introducing the X Window System


    Fedora Core gives you the option of using the GNOME and KDE desktop environments.
    GNOME and KDE, however, run on top of X, and X runs on Linux. X is the software
    that provides the low-level graphical bits and pieces that systems like GNOME
    use: X is the foundation that makes complex systems like GNOME possible.


    X is composed of three parts:


    +   * The X server

    * Numerous graphics libraries

    * A set of X client graphics applications


    The X server is a program that communicates with the human-interactive hardware
    on your computer—such as the video card, keyboard, and mouse—acting as the liaison
    between the hardware and other software. It uses the graphics libraries—software
    shared by many programs—to work properly with the graphics hardware.


    X clients are the graphical programs (such as Mozilla and xclock) that interact
    with X. X clients display their graphical output through the X server; X clients
    also get their keyboard and mouse input through the same computer that the X server
    runs on or cross a network to any computer running an X server. For example, by
    using X, you can run an X client on a computer on the other side of the world
    and view it on the X server running on your home computer.


    Suppose you''re logged remotely to a computer in Australia and you want to see
    what time it is. You could run the text-based command (from a CLI) to see the
    date and time, but that would be boring. Alternatively, you could run the xclock
    program on the remote machine and see a graphical clock displayed on your local
    computer. You can then verify that the Aussies use clocks that run clockwise and
    have 24-hour days.


    The X server program, often called simple, X isn''t part of the operating system,
    as it is in some other operating systems. Instead, the X server is a user-level
    program—although it''s special and complex.


    The X Window System provides the foundation for these graphics-based systems:


    +   * Desktop environment: A desktop environment is equivalent to a house where
    X is the foundation. GNOME and KDE are desktop environments that make using your
    computer easy, providing high-level functions such as menu systems, icons, and
    backgrounds.


    ![](img/019b0d727ede29f1ccb08789667e950f_131_0.png)


    112'
  merge: -1
  img_proc: true
