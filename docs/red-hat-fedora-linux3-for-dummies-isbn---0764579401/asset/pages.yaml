    +   6. Click the Next button.


    The About Install Window appears. A loud voice reverberates, announcing that this
    is the Point of No Return! Exactly. No voice says anything, except in our heads
    (it is so annoying), but this is the point of no return. If you click the Next
    button, your disk is reformatted in whatever way you selected in the preceding
    section — and Fedora Core then. The installation section describes how to process
    goes.


    ![](img/019b0d727ede29f1ccb08789667e950f_60_0.png)


    # Introducing password etiquette


    To be effective and keep the operating system characters long — you password must
    be at least six characters — but you should use at least eight characters: The
    more characters you use, the harder the password is to break. If you''re concerned
    about security, we recommend that you use a combination of uppercase and lowercase
    letters, symbols, and numbers to make your password as difficult as possible.
    In addition, don''t choose anything from a dictionary, or names or items that
    are easy to associate. With other words, your name, your name spelled backward,
    your birthday, or any word guiding the “unforgettable” ones are all poor choices.
    Beer, for a poor selection for Jon''s password, even though both uppercase and
    lowercase letters, Jon and beer are usually seen in close proximity to each other.


    A good way to come up with a good password is to select a phrase and maybe it.
    For example, make “I am not a number” something like inNotUf!. Even the result
    doesn''t spell the phrase in any way, it gives you the cues to remember the essential
    characters (“a” am = “im”, not = NOT, and number = #). Other common combinations
    are @ for a, 3 for e, 9 for g, 1 for b, and 5 for s. But these are common.


    If you record your password, store it where it won''t get lost or easily found
    or stolen. For example, save your passwords at home or in a locked safe. You can
    store passwords in a PDA (personal digital assistant) as you use the little gadget''s
    password-protection capability; you can use encryption software to store passwords
    on drives. Do not, write your password on a sticky note and attach it to your
    computer monitor. (D''oh)'
  merge: -1
