- pgno: 212
  md: '# Chapter 15


    # Building Your Own Private Network


    # In This Chapter


    +   - Designing and creating your private network

    - Building an Internet gateway

    - Building a private network firewall


    private network is made up of two or more computers, interconnected so they can
    communicate with each other; you can also refer to a private network as a local-area
    network (LAN). The computers are generally in close proximity within a room or
    building. Unlike the Internet, which is designed to allow the world''s computers
    to communicate with each other, LANs are designed to keep communication local
    and private. (You can always connect your LAN to the Internet, of course, but
    we talk about that topic else here.)


    Building a private network isn''t as difficult as you might. First, you have to
    decide on a general network layout. Second, you have to physically connect the
    computers with cables and wireless devices. Third, and last, you have to configure
    each computer''s network settings. Design, connect, configure — one, two — it''s
    as simple as that.


    This chapter shows how to build a simple LAN. If you want to know how to add a
    Linux computer to an existing network, check out Chapter 7. To find out adding
    a firewall to your LAN, check out Chapter 8.


    In this chapter, we show you how to wire computers together. You should refer
    to the Linux network-configuration instructions in Chapter 7 to connect individual
    computers on your network. The steps in Chapter 7 are also designed to work with
    any LAN, including the one you''re building here.


    ![](img/019b0d727ede29f1ccb08789667e950f_212_0.png)'
  merge: -1
  img_proc: true
- pgno: 213
  md: '# 194 Part IV: Revenge of the Nerds


    In this chapter, we describe how to connect computers to form a LAN. However,
    you can connect many other devices to a network. You can connect a wide range
    of devices to a network (whether it is wireless or wired); these include broadband
    (cable and DSL) Internet likely, routers, switches, hubs, network-capable printers,
    and even some personal digital assistants (PDAs). In the future, we fully expect
    to be able to connect nearly every device to a LAN. We discuss only computers
    here because we''re focusing on your Fedora Core computer connected. However,
    remember that you''re not limited to networking only computers.


    ![](img/019b0d727ede29f1ccb08789667e950f_213_0.png)


    # Designing and Building Your Private Network


    Private networks take on many shapes and sizes. As you may expect, the design
    of a LAN for a large- or medium-size organization is different from what you''d
    use for a small office or home. Individuals and small organizations generally
    do not require complex networks unless the work is complex enough to need such
    a tool. For the purposes of this book, we assume that you need a simple network—and
    Linux excels at networking. We describe how to design a basic LAN that is both
    powerful and reliable. This network can be used for many small- or medium-size
    businesses and most households.


    This chapter shows how to design a simple, flat network. Flat refers to the fact
    that all the computers connected to the network communicate over a single subnet
    (or subnet). Subnets can be combined within a single LAN, but that makes the network
    more complex to design, build, and maintain.


    The network we describe in this section is also designed to use a Fedora Internet
    gateway—a computer that acts as a portal, connecting the private network to the
    Internet. The networked computers in the private network are referred to as hosts
    or clients—are connected via one of the two methods:


    +   Wired connections: Hosts are connected to the LAN through a device called
    an Ethernet hub or Ethernet switch (or just hub or switch). Switches are superior
    in performance and security, and have the standard. For your LAN, we suggest that
    you use an Ethernet switch to connect all the computers (hosts)—including the
    Internet gateway. Figure 15-1 shows an example of our private network, where the
    interconnecting fabric is the Ethernet switch. (In recent years, Ethernet switches
    have become so inexpensive that Ethernet hubs have all but disappeared.) Our example
    network consists of two computers: Veracruz and Cancun.'
  merge: -1
  img_proc: true
- pgno: 214
  md: '# Chapter 15: Building Your Private Network


    +   - **Wireless connections**: Wireless devices make it possible to build a network
    without interconnecting cables. Wireless networks can take two forms:


    +   - **An access point**: Using a device called an *access point*, you can connect
    wireless hosts to a LAN. This design has the hosts connect to the access point
    via radio frequency (RF) signals. The access point also connects to a wired network,
    and the wireless hosts communicate with the wired network through that connection.


    Access points have become the most popular system for creating wireless LANs.
    You can find access points in consumer electronics for much less than $100.


    +   - **Ad-hoc mode**: This is an alternative wireless-connection method that
    doesn''t require a separate access point, other than a wireless device for each
    host (*ad hoc* is the Latin equivalent of “whatever works”). Wireless hosts communicate
    directly with each other using ad-hoc mode. (You can read more about ad-hoc mode
    in the “Wiring without wires” section later in this chapter.)


    ![](img/019b0d727ede29f1ccb08789667e950f_214_0.png)


    Figure 15-1: A simple private network.


    ![](img/019b0d727ede29f1ccb08789667e950f_214_1.png)


    # Where did all the wires go?


    The RF (radio-frequency) signals used by wireless networks are the same you tune
    in to your radio — or communicate with your cell phone — or open your garage door.
    The only differences between the RF signals coming from an AM radio station and
    a wireless network device are their frequency and strength.


    The Federal Communications Commission (FCC) permits anyone to use the 5-gigahertz
    (GHz) portion of the frequency spectrum — billions of cycles per second — for
    any purpose as the signal strength is low. In effect, radio signals replace the
    wires in a wireless LAN.'
  merge: -1
  img_proc: true
- pgno: 215
  md: '# Part IV: Revenge of the Nerds


    # The ABCs of switches and hubs


    Switches are better than hubs because switches are more secure and faster. Here''s
    a quick comparison to illustrate the differences.


    Suppose your network consists of three machines — A, B, and C — all connected
    to a switch. When Machine A wants to communicate with Machine B, the switch transmits
    the network traffic from A to B. Machine C is out of the loop. By making sure
    that C doesn''t know what A and B are saying, the switch keeps network communication
    private. On hubs, the other, broadcast the network traffic from one machine to
    all machines connected to the hub. When A sends information to B, the hub broadcasts
    that to both B and C.


    Switches are faster than hubs because network traffic flows only between the machines
    that are talking to each other. The computers that aren''t talking to each other
    don''t use the switch''s bandwidth (the maximum rate at which information can
    be transmitted). For example, when Machine A is sending information to Machine
    B, Machine C doesn''t slow up the communication speed by sucking up the bandwidth.


    # Wiring your network with, yes, wires


    This section describes how to build a wired network. You can mix wired and wireless
    networks, but, for simplicity, we describe how to build a pure wired or wireless
    network.


    Way back in prehistoric times (circa 1996), you had to be technically savvy to
    wire your network. Wiring consisted of coaxial cables like those used for cable-TV
    connections. Coaxial cables are bulky and require you to use special tools to
    attach the connectors to the cable ends.


    Life is easy now. Wiring network requires that you use Cat-5 cables, similar in
    appearance to telephone cables. Cat-5 cables are manufactured with telephone-like
    connectors that are a snap (pardon the pun) to use. No muss, no fuss.


    You can buy Cat-5 cables at any electronics store. They come in many colors and
    sizes. Cat-5 cables aren''t cheap, they''re not terribly expensive either. They''re
    reliable and much easier to work with coaxial cables.


    You have to use a network switch or hub in conjunction with Cat-5 cables. Switches
    and hubs are the glue that holds your network together. Both switches and hubs
    connect individual computers so they can communicate with each other.


    ![](img/019b0d727ede29f1ccb08789667e950f_215_0.png)'
  merge: -1
  img_proc: true
- pgno: 216
  md: '# Chapter 15: Building Your Own Private Network


    Most, if not all, networking equipment is now based on the Ethernet protocol.
    Ethernet is inexpensive and readily available. You can purchase it from any consumer-electronics
    store, mail-order catalog, or online seller. You don''t need to know any of the
    technical aspects of Ethernet because it requires no configuration. You need to
    know only that an Ethernet connector looks similar to a telephone jack. Remember,
    however, that Ethernet and telephone jacks are not compatible.


    For your network, start by connecting your machines to a central switch. (You
    can use at least one, if you want.)


    Although you can connect as many computers as your switch or hub handle, keep
    the job as simple as possible, these steps describe how to wire two computers,
    Cancun and Veracruz. The steps assume that you have a switch or at least two Cat-5
    cables; here''s what to do with them:


    +   1. On the first computer, plug one end of a Cat-5 cable into the Ethernet
    network interface connector (NIC) on the back of the machine.


    +   2. Plug the other end of the cable into the switch.


    A green light should appear near the connector you used on the switch. The green
    light indicates that you have link status, indicating that an Ethernet connection
    has been established: You have an active connection between the computer and the
    switch.


    If you don''t get light status, make sure that both connectors on the cable have
    been properly inserted. Pull each connector and firmly press it back in (a procedure
    resetting).


    ![](img/019b0d727ede29f1ccb08789667e950f_216_0.png)


    If this suggestion doesn''t fix the problem, make sure that the cable is working
    correctly. Check the cable for cracks and cuts, for example. Check the cable for
    loose wires. Substitute another cable, if possible; use a cable that you knows.
    That can help you determine whether the switch is at fault.


    +   3. Repeat Steps 1 and 2 for each additional computer.


    After you have successfully connected all your computers to the switch, you can
    proceed to the section "Building an Internet Gateway," later in this chapter.
    That section describes how to build an Internet gateway on a Linux computer. The
    Internet gateway connects your entire private network to the Internet.'
  merge: -1
  img_proc: true
- pgno: 217
  md: '# 198 Part IV: Revenge of the Nerds


    # # Wiring without wires


    Life has gotten easier in the past few years. Wireless networking is the best
    technological advance for home or small-business network users in the past years,
    and it is now affordable for consumers.


    Going wireless provides the following advantages:


    +   - Not having to say you''re sorry while stringing cables around your house
    or office. You don''t have to spend money and time wiring wires through walls,
    ducts, attics, and cellars, for example. (The authors have enjoyed all these activities.)
    You also save the cost of the cables


    +   - Geographical freedom: You have the freedom to use your computers anywhere,
    regardless of whether your server or internet gateway or printers are located.
    Ah, life is easier when you can sit out on a nice day and clock away at the keyboard.


    +   - Looking good: You look high-tech even if you''re not. You can impress your
    friends and family.


    However, wireless networking has some drawbacks:


    +   - Reduced security: Wireless communications are more vulnerable to hackers.
    You can partially protect your network by using wireless encryption. You can further
    increase security by using application-based encryption such as Secure Shell (SSH)
    and Secure Socket Layers (SSL).


    +   - Reduced speed: Wireless networks are generally slower than wired ones. The
    most commonly available and cheap wireless devices work at a few megabits-per-second
    (Mbs). Newer devices work at about 10 Mbs. This is slower than the typical wired
    network operates at 100 Mbs.


    +   - More complexity: Configuring a wireless network is a little more complex
    than yours. You have to configure an encryption key and other options to make
    yours a wireless network work.


    The process of constructing a wireless network is straightforward. You have to
    decide how to connect your wireless devices to your private network. You can do
    that in two ways:


    +   - Use a wireless access point: A wireless access point (WAP) is a device through
    which wireless devices communicate. An access point of contact through which all
    other devices communicate. If you install and use access points as part of the
    network structure, you''re using infrastructure mode.'
  merge: -1
  img_proc: true
- pgno: 218
  md: '# Chapter 15: Building Your Own Private Network


    An access point uses two network connections. One is an Ethernet port that connects
    to your private LAN through a Cat-5 Ethernet cable, and the other point connects
    to your wireless devices. The access point serves as a common connection point
    to your LAN.


    The other connection point is the access point''s wireless receiver. The wireless
    "port" communicates with all other wireless devices on your network.


    +   * Use point-to-point (ad-hoc) communication: Contrary to popular opinion,
    you can create a wireless network without an access point. Wireless NICs are designed
    to communicate directly with each other, as well as through an access point. You
    configure each NIC to know a common name and a common encryption key, and voilà
    — the NICs find their own ad-hoc network by communicating directly with each other.
    We show you how, in this section.


    Point-to-point communication is referred to as ad-hoc mode. The term ad hoc is
    a polite way to say kludge — it means putting together with what you have, in
    whatever way you can. Using ad-hoc mode means that each wireless device can communicate
    with the other devices. (Setting up a network with wireless NICs is less expensive
    than using WAPs.)


    You can purchase an access point to construct your wireless LAN (though you may
    have the trendy term Wi-Fi network, which means the salesperson knows you''re
    talking about). That''s simple and quick, a little expensive. If you choose that,
    we leave it to you to follow the access point''s instructions for connecting other
    computers to it. You can follow the steps in Chapter 7 for configuring your Fedora
    Core wireless-interface card (exc us, Wi-Fi NIC) to an access point.


    We describe how to save a few bucks and use a Linux computer to build an ad-hoc
    network. Building an ad-hoc network requires you to put a Wi-Fi NIC on a Linux
    gateway. You then configure every computer on your private network to use the
    same network name and encryption key. The computers can communicate directly with
    each other through the Linux gateway to the Internet.


    Follow these general steps to create a wireless LAN:


    +   1. Install both a Wi-Fi and an Ethernet NIC on the Internet gateway computer.


    Each of your private network''s computers can talk to the Internet gateway through
    the wireless NIC. The Ethernet connects the gateway to the Internet through either
    DSL or cable modem; you can substitute a telephone modem for the Ethernet NIC,
    if necessary.'
  merge: -1
  img_proc: true
- pgno: 219
  md: '# 200 Part IV: Revenge of the Nerds


    The next section in this chapter describes how to build an Internet gateway.


    +   2. Install a Wi-Fi NIC on each of your Linux and Windows computers.


    +   3. Configure each Wi-Fi NIC to use the same network name and encryption key.


    Refer to Chapter 7 to find out how to configure a Wi-Fi NIC; use the network IP
    addresses, netmasks, and other items described there.


    +   4. Configure your Internet gateway to forward your private network traffic
    to the Internet.


    +   5. Configure a firewall on your Internet gateway.


    Refer to the section “Protecting your LAN with a firewall,” later in this chapter.


    ![](img/019b0d727ede29f1ccb08789667e950f_219_0.png)


    One advantage of using infrastructure mode (which is what you have when your network
    specifically incorporates access points) is that a wireless device can move from
    access point to access point without reconfiguration. Access points provide mobility
    and flexibility within the LAN, which can be good if you happen to work on a large,
    dispersed environment. For example, if your company is spread across several locations,
    you want to be able to use your computer anywhere. However, if you don''t configure
    your access point correctly — for example, by not using an encryption key — flexibility
    becomes a security liability. Make sure that you correctly configure all your
    wireless devices.


    # Building an Internet Gateway


    Okay, you have built your LAN. Woo-hoo! That wasn''t too hard. The next question
    is “What can you do with it?” One answer is that every computer on your private
    network can communicate with all the others and share information and services.
    (We describe in Chapter 16 how to share some useful work-based services. You find
    out how to share files and printers, configure a Domain Name Service — DNS — server,
    and build a simple web server.)


    One essential function is to be connected to the Internet. Chapters 5 and 6 show
    you how to connect a single, stand-alone Linux computer to the Internet. We expand
    that process a step further and show you how to turn the Internet connection into
    one that can be used by the entire private network. Any computer connected to
    your LAN subsequently has Internet access. Sharing is good, and your mom should
    be pleased.'
  merge: -1
  img_proc: true
- pgno: 220
  md: '# Chapter 15: Building Your Private Network 201


    The remainder of this chapter deals with building an Internet gateway. We assume
    that you have a working Internet connection, as we describe in Chapters 5 and
    6. This connection is the conduit from your LAN to the Internet. You only have
    to configure a Linux computer to redirect (*route*) Internet-bound traffic from
    your LAN to the Internet and modify the firewall we describe in Chapter 8 to work
    with the gateway.


    # Understanding IP forwarding and network-address translation (NAT)


    An Internet gateway requires a Linux computer that has two connections. You need
    one Ethernet or wireless NIC to connect to your LAN. The other network connection
    is used to make the Internet connection; this connection may be a traditional
    telephone-based modem, a DSL modem, or a cable modem. You use an Ethernet NIC
    to make the second connection.


    Suppose you use Mozilla on the sample Fedora Core computer Cancun (with the IP
    address 192.168.1.1) and enter the URL fedora.redhat.com. Network packets bound
    about your LAN and then fly out to the Internet (and back again), and Mozilla
    ends up displaying the Fedora Core Web page.


    Lots of things have to happen to make all these things happen. Here''s a simplified
    version of how it works:


    +   1. Mozilla asks Linux to look up the address, via DNS, which translates fedora.redhat.com
    into the numeric IP address 209.132.177.50.

    2. Linux compares the IP address to its internal routing table. The operating
    system directs network traffic to the default route if the address doesn''t match
    its local networks. (In other words, if the IP address belongs to a machine on
    the private network, Linux directs its communication to the Ethernet device connected
    to the LAN. If the IP is external to the LAN, however, Linux forwards the packets
    to the appropriate proxy.)

    3. In this case, 209.132.177.50 does not exist on the LAN, so all traffic for
    the browsing session is directed to the default route.

    4. In the private network example we describe, the default route of each host
    points to the Internet gateway Veracruz. For example, all Internet-bound packets
    that Cancun produces are sent to Veracruz.

    5. The Internet gateway Veracruz receives the outbound packets from Cancun on
    its internal NIC and forwards them to its external NIC. Packets going through
    its external NIC are directed to the Internet.'
