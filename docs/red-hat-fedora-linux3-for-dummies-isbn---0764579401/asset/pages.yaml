  md: '# Red Fedora Linux 3 For Dummies


    # # Typing code


    Fedora Core provides various graphical user interfaces (GUIs) to help you do most
    of the tasks you want to do. However, many people still find that performing many
    tasks "manually." by typing a command, is easier; in some circumstances, it''s
    the only way to get a job done.


    Therefore, we show you in Chapter 4 how to use a text-based terminal-emulator
    to run a command. In anticipation of manually running commands, we describe several
    conventions in this section.


    When you use URLs (Uniform Resource Locators), directories, commands, and parameters
    in a paragraph, they''re formatted in `monospace type`. That helps differentiate
    those items from the text.


    When you see words in boldface, they indicate something you should type; for example:


    **Type man chown** at the command prompt and press Enter.


    That tells you to enter the command `man chown` and press the Enter (or Return)
    key. Throughout this book, we say "press the Enter key" or "press Enter" whenever
    we want to execute a command; the Enter key is synonymous with the Return key.


    Commands set off by themselves, rather than shown in the text, look like this:


    ```

    chown

    ```


    Here''s a rundown of the command syntax (how you string ''em together) in Linux:


    +   * Text not surrounded by `[]` or `{ }` brackets must be typed exactly as shown.


    +   * Inside brackets `[ ]` is optional.


    +   * Text in *italics* indicates the part of a command that must be replaced
    with appropriate text. You should not type verbatim the italicized part of a command.
    If we say "Enter the command *more file,* we mean for you to replace *somefile*
    with the name of the file you''re interested in. For example, you may end typing
    the command `/etc/passwd` for *somefile*.


    +   * Text inside braces `{ }` indicates that you must choose one of the values
    inside the braces and separated by the `|` sign. For example, you should'
