- pgno: 118
  md: '# Chapter 8


    # # Only You Can Prevent Bad Firewalls


    **In This Chapter**


    +   - Introducing computer security

    - Using the Netfilter/iptables firewall system

    -Designing and viewing your filtering rules

    - Automatically starting your firewall

    - Automatically updating your computer software


    After connecting to the Internet, you have to protect yourself from the bad guys.
    The bad guys wear black hats, just like in the movies (as opposed to red fedoras,
    which are a bit odd but good). You may also have heard them called hackers, crackers,
    black hats, and so on. Whatever their names and whatever intentions, the Internet
    is getting more dangerous every day, so you have to take precautions.


    No silver bullet exists when it comes to protecting yourself from computer mischief.
    You should not rely on any single method, order, or system, against hackers. The
    best defense is to create multiple lines of defense that overlap and provide extra
    protection. That''s called defense-in-depth.


    The first layer in your defensive shield is a firewall. A firewall is a device
    that enables you to use the Internet (or other network that is connected to it)
    while blocking the Internet from using you. Firewalls are one-way gates that allow
    your outgoing network connections while blocking incoming connections.


    This chapter describes (not surprisingly) how to build a firewall. First, in case
    you doubt that you truly need a firewall, we explain why having'
  merge: -1
  img_proc: true
- pgno: 119
  md: '# 100 Part II: Got Net?


    a firewall is important. Then we introduce you to Netfilter/iptables, a Linux
    firewall system, and describe how to set up your firewall-filtering rules. After
    you set up your filters, we describe how to run the firewall automatically.


    The firewall described in this chapter is designed to protect a single Fedora
    Core that is connected to the Internet or LAN. The firewall isn''t designed to
    protect an entire LAN. Chapter 15 describes how to modify this firewall to protect
    your private network.


    ![](img/019b0d727ede29f1ccb08789667e950f_119_0.png)


    # Understanding Why You Need a Firewall in the First Place


    You might think there''s safety in numbers — after all, millions of people, businesses,
    and organizations are connected at any given time to the Internet. What do you,
    an individual with a simple computer or small private network connected to the
    Internet, have to be concerned about? The bad guys are usually interested in big
    money or big publicity. I''m just the little guy and no one is interested in hacking
    ''little me, right?


    That assumption sounds reasonable but can lead to disaster. Many hackers use tools
    that automatically scan and attack thousands of computers in almost no time. Even
    a lazy hacker doesn''t have to work hard to search large numbers of networks to
    find and exploit unprotected computers. (Don''t forget that Internet propagates
    quickly.)


    Don''t risk getting owned — the term used when a hacker breaks into and controls
    your computer. Fortunately, you can take some reasonable precautions and greatly
    increase your security. Linux provides effective tools for protecting yourself.


    Using a firewall is simple (but quite effective) to protect yourself when you
    connect to the Internet. A firewall allows you to connect to the Internet without
    blocking and unwanted connections coming in.


    ![](img/019b0d727ede29f1ccb08789667e950f_119_1.png)


    Firewalls provide good bang-for-the-buck protection — they''re not the only security
    measure you should take. For example, locking your doors certainly helps to protect
    against burglars, but isn''t 100-percent effective — they can still break through
    a window. Your best bet comes from layers of security, such as locking your windows,
    and keeping tabs on neighborhood activities. The idea is to have each layer reinforce
    the others. Chapter 17 describes how to add security layers to your computer.
    Layered security is your best protection.'
  merge: -1
  img_proc: true
- pgno: 120
  md: '# Chapter 8: Only You Can Prevent Bad Firewalls


    # # Building an Effective Firewall


    Fedora Core comes bundled with a simple but extremely effective firewall named
    Netfilter/iptables. The Netfilter part refers to the firewall system built into
    the Linux operating system — the kernel, to be exact and iptables is the interface
    that it controls. We refer to the overall system as iptables because that''s the
    utility you use.


    The iptables system filters the IP packets that are the backbone of the Internet
    (IP stands for Internet Protocol). When you''re connected to the Internet, all
    information (graphics and text) that you send and receive is sent in the form
    of IP packets. All information that enters and leaves your computer via the Internet
    is packaged in the form of IP packets. You can use iptables to accept or deny
    IP packets according to their destinations, source addresses, and ports.


    # Designing filtering rules: Permissive and restrictive methods


    Filtering rules are like the bricks (asbestos, if you prefer) to build your firewall.
    Basically, filtering rules determine network communication can go out of and into
    your computer.


    because you know exactly what you''re allowing. However, the restrictive method
    can also create problems; for example, you may unintentionally prevent needed
    or wanted network traffic from reaching your computer.


    When you''re designing firewall-rules, you can choose between two philosophies:


    We explain how to use the restrictive method, for several reasons:


    +   - Allow all connections by default and then deny specific access.


    +   - Deny all connections by default and then allow specific access.


    +   - It''s the safest method. The restrictive method is safer because it minimizes
    all external contact with your Internet-connected computer. For example, it minimizes
    the information about your firewall that would otherwise be exposed to hackers
    through port scanning and other tricks.


    If you allow all, you start by allowing communication with your computer and then
    deny connections by one. (This method is used by Fedora Core, which you create
    during the installation process.) The danger with this method is that you unintentionally
    allow dangerous traffic to reach your machine. The alternative method is to start
    by denying all communication and then selectively allowing certain traffic. This
    more restrictive method is, from a security standpoint, the best way to create
    a firewall


    +   - It''s easier to configure. Because iptables provides stateful filtering,
    you have only two rules to configure as you create a firewall. By contrast, the
    permissive method requires you to configure numerous rules. Extra, unnecessary
    complexity reduces security.'
  merge: -1
  img_proc: true
- pgno: 121
  md: '# 102 Part II: Got Net?


    The iptables system is effective because it uses stateful filtering. The firewall
    can keep track of the state of each network connection. It''s a technical way
    of saying that iptables knows which IP packages are valid and which are not. For
    example, if you''re browsing www.dummies.com, iptables keeps track of all packets
    that belong to that connection. The ipt utility can deny packets that are trying
    to reach your computer but don''t belong to your connection, preventing any hackers
    from sneaking through your firewall.


    ![](img/019b0d727ede29f1ccb08789667e950f_121_0.png)


    Fedora Core installs an iptables-based firewall by default. The installation system
    gives a good level of protection during the installation process. You may recall
    from Chapter 3 that we advise you to use the default firewall configuration. However,
    the default firewall isn''t as secure as we would prefer for connecting to the
    Internet. This chapter describes how to construct a more professional and secure
    firewall.


    ![](img/019b0d727ede29f1ccb08789667e950f_121_1.png)


    Ports — the places where information comes into a computer or goes out — are essential
    to the Internet Protocol. Ports are used to organize the communication between
    clients and servers. For example, when you click a link on a Web page, your browser
    communicates with the Web server using a port. That''s a gross simplification,
    of course, but it describes the basic idea. Suffice to say that ports help control
    the internal workings of the Internet for such tasks as Web browsing.


    # # Setting Up a Firewall


    So you know that you need a firewall and want to create one. What''s next? This
    section explains how to set up an iptables-based firewall, using the restrictive
    method. When you''re done setting up rules, see the section “Saving your filtering
    rules to a script,” later in this chapter, so you don''t have to enter these rules
    every time you turn on your computer.


    In this section, you design an iptables-based firewall that turns off all incoming
    connections on an Internet connection (modem, LAN, or broadband) and enables you
    to establish an outgoing connection to the Internet. You then back off the total
    restriction of incoming communication to allow incoming Secure connection. (Secure
    Shell provides encrypted connections.)


    ![](img/019b0d727ede29f1ccb08789667e950f_121_2.png)


    Don''t execute these instructions from a remote connection! You must run these
    commands from your computer''s console. That is, you must be sitting at your computer
    and not working on it from some other location over a network connection. The
    reason is simple: These firewall rules shut off external network connections before
    restoring them.'
  merge: -1
  img_proc: true
- pgno: 122
  md: '# Chapter 8: Only You Can Prevent Bad Firewalls


    The steps that build your firewall, brick by brick, look like this:


    +   1. Log in to your computer as root and then open a GNOME Terminal window (right-click
    any empty part of the desktop and choose Open Terminal (from the menu).


    +   2. Type the following line to turn off the default Fedora Core: service iptables
    stop


    This firewall is the one created during the installation process describe in Chapter
    3. The iptables entries remove any existing filtering or Network Address Translation
    (NAT) rules. NAT rules are frequently used to make your computer appear to be
    coming from your ISP so that you don''t have to register your computer for an
    official Internet Protocol (IP) address.


    +   3. Start building your firewall by entering the following rules that filter
    out all network communication to, from, and through your computer:


    ```

    iptables --policy INPUT DROP

    iptables --policy OUTPUT DROP

    iptables --policy FORWARD DROP

    ```


    These commands set the default policy of your firewall to not allow any network
    traffic into the (INPUT rule) or out of the (OUTPUT rule) any network interface;
    no traffic is allowed to pass between network interfaces (the FORWARD rule) if
    you have them. At this point, you have an extremely safe firewall. So far, however,
    your computer is useless for network-related tasks. The next step opens the firewall
    a little, giving you access to the Internet (or any network you''re attached to)
    in a safe way.


    +   4. Enter the rules to allow network traffic to pass through the loopback device:


    ```

    iptables -A OUTPUT -j ACCEPT -o lo

    iptables -A INPUT -j ACCEPT -i lo

    ```


    Linux computers use a virtual network that you connect via the loopback interface
    (lo). The loopback isn''t a physical device, but is a virtual one. Linux uses
    lo for internal communications.


    +   5. To allow outgoing communication from your computer, type the following
    two commands:


    ```

    iptables -A OUTPUT -m state

    --state NEW,RELATED,ESTABLISHED -j ACCEPT

    iptables -A INPUT -m state

    --state RELATED,ESTABLISHED -j ACCEPT

    ```'
  merge: -1
  img_proc: true
- pgno: 123
  md: '# 104 Part II: Got Net?


    These rules do not specify any particular network interface. However, because
    the filter is stateful, these rules effectively work on your Ethernet, wireless,
    or dialup Point-to-Point (PPP) interface.


    The first filter permits all outgoing communication. The --state NEW, RELATED,
    ESTABLISHED option tells the firewall to allow packets of both new and already
    established connections to pass. (Packets are the basic building block of all
    network communication.) Also allowed are packets related to existing connections
    using different ports, such as FTP data transfers.


    The second filter rule controls the packets coming back from outgoing connections.
    When you connect to a Web site, your browser sends out packets and the Web server
    responds to them. You can click a button on the Web site, and a new window pops
    up. Clicking a button sends out blocking packets from the Internet; this creates
    an exception, allowing packets that belong to an existing connection—such as the
    one that represents your clicking—return to your computer through the firewall.
    Note that we don''t allow new incoming connections (--state NEW) to be established;
    doing so would defeat the purpose of this firewall.


    6. (Optional) Using the following rule to allow SSH connections to your Linux
    computer:


    ```

    iptables -A INPUT -p tcp -m state -state --NEW,ESTABLISHED -j ACCEPT --dport 22

    ```


    This rule permits SSH connections on Port 22 to enter your computer.


    The OpenSSH is installed by default during the installation process we describe
    in Chapter 3. The service is also automatically started.


    You can modify this rule to allow other types of incoming connections to your
    computer. For example, if you want to create a Web server and allow incoming connections
    to it, run this:


    ```

    iptables -A INPUT -p tcp -m state -state --NEW,ESTABLISHED -j ACCEPT --dport 80

    ```


    Port 80 is used for Web server connections. (Chapter 16 shows you how to create
    a Web server).


    You have created a simple, effective firewall that protects your computer from
    werewolf and hackers. Your firewall remains active until you turn the rules off
    or reboot your computer. The following section shows how to display your new firewall
    rules.


    ![](img/019b0d727ede29f1ccb08789667e950f_123_0.png)'
  merge: -1
