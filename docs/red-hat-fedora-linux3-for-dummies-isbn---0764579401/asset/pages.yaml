  md: '# 304 Part V: The Part of Tens


    unfortunately, a complex subject. Because of the complexity of the topic of security,
    we cannot hope to do any more than thou touch on some important aspects. We just
    try to give you the most bang for your buck by adding a few simple but effective
    security measures to your new Fedora Core computer.


    This chapter introduces ten important security topics. You can use them as a good
    starting point to increase your computer security.


    # How Many Daemons Can Dance on the Head of the Linux Process Table?


    Every software company wants to make its operating systems easy to install and
    use. Operating systems are inherently complex animals, and Linux is no exception.
    (Of course, we''re not biased when we say that Linux is, overall, a simpler system
    by the number of lines of code or the transparency — the open-source concept —
    of design.) Companies walk the tightrope of making systems easy to use and also
    making them reasonably secure — they sell more copies when they make it — but
    worry when they get hacked.


    Ease of use and security often don''t get along. Your operating system is much
    easier to use, if you install and activate every software package and option.
    On the other hand, running every software package means you have more potential
    vulnerabilities. Entering your own house is a breeze if you install 10 doors and
    20 windows, but the convenience also provides burglars with juicy opportunities.
    The same logic applies to your computer''s operating system. The more you install,
    the more chance someone has of breaking into your computer.


    We don''t know of a cure-all for this dilemma. The best answer from a security
    viewpoint is to not provide intruders with openings: Place your computer in a
    locked room with no network or external connections, and turn it off. If you have
    a truly safe system whose only job is to hold the floor down.


    As with most things in life, the best answer is to learn the security basics and
    then use your best judgment to balance security with convenience. Run only the
    services you need. For example, don''t run the Samba file system service if you
    want your Fedora Core server as a (Windows) file system server. Don''t run the
    text-based gpm mouse program if you use the graphical X Window mode on your computer.
    The list is endless — and beyond the scope of this book to discuss in detail.
    You can find more from these sources:


    +   * Sites: Both www.sans.org and www.usenix.org deal with security sites.'
