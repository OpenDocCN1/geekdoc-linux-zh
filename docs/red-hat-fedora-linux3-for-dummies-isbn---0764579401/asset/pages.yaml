    # Ripping CD Music Files


    Are you tired? Not, Sound Juicer can help you get there. It rips extracts — audio
    information (the music files) from CDs to to your hard drive.


    These steps show you how to use Sound Juicer to copy music to your hard drive:


    +   1. Insert your favorite CD in the CD-ROM drive.


    +   2. Click the GNOME Menu button and choose Sound & Video:: Sound Juicer CD
    Ripper.


    Sound Juicer window opens, as shown in Figure 12-2.


    +   3. By default, all the CD tracks are selected (note the check mark in the
    Extract column). Click the check mark of any tracks you don''t want to extract.


    Sound Juicer can take some time before it reads and displays the CD tracks.


    +   4. Click the Extract button in the lower-right corner of the window.


    The Progress dialog box opens, showing the progress of the track and the overall
    extraction process. When you''re finished, the Information dialog box opens.


    +   5. Click the Close button.'
