- pgno: 349
  md: '# 330 Part VI: Appendices


    ![](img/019b0d727ede29f1ccb08789667e950f_349_0.png)


    In addition to what we discuss earlier in this appendix about specifying directory
    paths, you need to know these three rules:


    +   - One dot (.) stands for your current directory.

    - Two dots (..) specify the parent directory of the directory you''re in.

    - All directory paths that include (.) or (..) are relative directory paths.


    You can see these files using the -a option of the ls(1) command. Without the
    -a option, the ls command doesn''t list the .. or files, or any filename beginning
    with a period. This statement may seem strange, but the creators of Unix thought
    that some files normally hide the directory structure cleaner. Therefore, filenames
    that are always present (...) and special-purpose files are hidden. The types
    of files that should be hidden are those user normally doesn''t need to see in
    every listing of the directory structure (for example, files used to tailor applications
    to the user''s preferences).


    Specify a path relative to you. Here''s an example:


    ```

    cd /etc

    ls -la ../etc/passwd

    ```


    The first command moves you to the /etc directory, where the password resides;
    the command uses an absolute path (/etc in this case). The second command redundantly
    starts one directory up (..) and then looks in /etc directory for the password
    file. You move up one directory level and then back down to /etc/passwd; this
    demonstrates the use of relative paths (../etc/passwd).


    If you want to see the login accounts on your system, you can issue this command
    from your home directory:


    ```

    ls -la ..

    ```


    This command lists the parent directory. Because the parent directory (/home)
    has all the login directories of the people on your system, this shows the names
    of their login directories.


    You have been looking at relative pathnames, which are relative to where you are
    in the file system. Filenames that are valid from anywhere in the file system
    are absolute paths. These filenames always begin with the slash character (/),
    which signifies the root directory. Here''s an example with two:


    ```

    ls -la /etc/passwd

    ```'
  merge: -1
  img_proc: true
- pgno: 350
  md: '# Appendix C: Filing Your Life Away 331


    # Changing your working directory


    You occasionally (often?) want to change your working directory. Why? We''re glad
    you asked — because changing it enables you to work with shorter relative pathnames.
    To do so, you simply use the cd (for change directory) command.


    To change from your working directory to the /usr directory, for example, type
    this command:


    ```

    cd /usr

    ```


    # Going home


    If you type cd by itself, without any directory name, you return to your home
    directory. Just knowing that you can easily get back to familiar territory is
    comforting. There''s no place like home.


    You can also use cd with a relative specification, like this:


    ```

    cd .."

    ```


    If you''re in the directory /usr/bin and type the preceding command, Linux takes
    you to the parent directory named /usr:


    ```

    cd /usr/bin

    cd ..

    ```


    ![](img/019b0d727ede29f1ccb08789667e950f_350_0.png)


    Here are a couple of tricks: If you type cd ~, you go to your home directory (the
    tilde symbol ~ is synonymous with /home/username). If you type cd~username, you
    can go to that user''s home directory. On very large systems, this command is
    useful because it eliminates the need for you to remember — and type — directory
    specifications.


    This list describes the shell redirection:


    +   > is known as redirect standard output. When you tell the computer "Capture
    the information that normally goes to the screen, create a file, and put the information
    in it"


    +   > is known as append output. When you use this symbol, you tell the computer
    "Capture the information that would normally go to the screen and append the information
    to an existing file. If the file doesn''t exist, create it."'
  merge: -1
  img_proc: true
- pgno: 351
  md: '# 332 Part VI: Appendixes


    ells the computer, “Feed the information from the specified file to standard (also
    known as standard input), acting as though the information is coming from the
    keyboard.


    # Manipulating Files and Directories


    Linux has many ways to create, move, copy, and delete files and directories. Some
    features are so easy to use that you need to be careful: Unlike other systems,
    Linux doesn''t tell you that you''re about to overwrite a file — it just follows
    your orders and overwrites!


    We have said elsewhere in this book, and we''ll say it again: Make sure that you''re
    not logged in as root user when you read through these sections. You can unintentionally
    harm your computer when you''re logged in root. As root, the superuser, you can
    erase any file or directory — regardless of which permissions are set. Be careful!


    ![](img/019b0d727ede29f1ccb08789667e950f_351_0.png)


    # Creating directories


    To create a new directory in Linux, you use the mkdir command (there''s an identical
    command in MS-DOS). It looks like this:


    ```

    mkdir newdirectory

    ```


    This command creates a subdirectory under your current or working directory. If
    you want the subdirectory under another directory, change to that directory first
    and then create the new subdirectory.


    Create a new directory named cancun. Go ahead — do it:


    ```

    mkdir cancun

    ```


    (Can you tell where we would rather be right now?


    Create another directory named veracruz:


    ```

    mkdir veracruz

    ```


    Then change the directory to put yourself in the cancun directory:


    ```

    cd cancun

    ```


    Now, verify that you''re in the directory cancun:


    ```

    pwd

    ```'
  merge: -1
  img_proc: true
- pgno: 352
  md: 'Appendix C: Filing Your Life Away 333


    # Moving and copying files and directories


    The commands for moving and copying directories and files are mv for move and
    cp for copy. If you want to rename a file, you can use the mv command. You''re
    not really moving the file, but the Linux (and Unix) developers realized renaming
    something was much like moving it. The format of the command


    ```

    mv source destination

    ```


    Create a file that you can practice moving. The touch command updates the time
    stamp on an existing file or creates an empty file if it doesn''t exist. In this
    case, the test doesn''t exist and is created by touch:


    ```

    touch go

    ```


    Move the new file:


    ```

    mv go to

    ```


    This command leaves the file in the same directory and changes its name to to.
    The file wasn''t really moved — just renamed.


    Try moving the to to the veracruz directory. To do that, you have to first move
    the file up and move it into the veracruz directory. You can do it with one command:


    ```

    mv go ..veracruz

    ```


    The destination file uses the double-dot (..) designation: every directory contains
    a double-dot directory that points to the parent directory. This command tells
    Linux to go up one directory level and look for a directory named veracruz and
    then put the file into that directory with newgoto because you didn''t specify
    any other name. If you do this:


    ```

    mv go ..veracruz/now

    ```


    the go file moves the veracruz directory named now. Note that in cases (with the
    file maintaining its name, go, or taking the new name now), your current directory
    is still cancun and all your files are relative to directory.


    ![](img/019b0d727ede29f1ccb08789667e950f_352_0.png)


    Strictly speaking, the file hasn''t really moved. The data bits are still on the
    same part of the directory as they were originally. The file specification (the
    directory path includes the filename) you use to talk about the file is different,
    or it appears to have moved.


    ![](img/019b0d727ede29f1ccb08789667e950f_352_1.png)'
  merge: -1
  img_proc: true
- pgno: 353
  md: '334 Part VI: Appendixes


    # Removing files and directories


    The command for removing, or deleting, a file is rm. Using rm is straight-forward.
    For example, create a dummy file to erase:


    ```

    touch junk

    ```


    You can delete the file with this command:


    ```

    rm junk

    ```


    You have removed the dummy file from the current directory. To remove a file from
    another directory, you need to provide a relative filename or an absolute filename.
    For example, if you want to expunge now from the veracruz directory, you type
    this line:


    ```

    rm ../veracruz/now

    ```


    You can use metacharacters (similar in many ways to Windows wildcards) with rm,
    but be very careful if you do so! When files are removed in Linux, they''re gone
    forever — kaput, vanished — and cannot be recovered.


    The following command removes everything in the current directory and all the
    directories under that you have permission to remove:


    ```

    rm -rf *

    ```


    Do not give this command as root (the superuser)! You should always be careful
    when you''re running any command as root, but be especially careful with commands
    that can erase entire directories and file systems.


    To decrease the danger of removing lots of files inadvertently when you be sure
    to use the -i option with rm, cp, and various other commands. The -i option means
    interactive, lists each file to be removed (with the rm command) or overwritten
    (with the mv or cp command). If you answer either Y or N to the question, the
    file is removed or overwritten. If you answer anything else, Linux leaves the
    file alone.


    You can remove not files but also directories. Suppose that you have an old directory,
    /tmp/junk, that you don''t need any more. You can remove it and all its contents
    by typing this:


    ```

    rm -rf /tmp/junk

    ```


    Giving rm these options (r and f) removes the /tmp/junk directory and all files
    and directories under it. The r option means to remove recursively; in recursion,
    the command works through every subdirectory in the parent directory. The f option
    issues the command forcefully. No prompts are


    ![](img/019b0d727ede29f1ccb08789667e950f_353_0.png)


    ![](img/019b0d727ede29f1ccb08789667e950f_353_1.png)


    ![](img/019b0d727ede29f1ccb08789667e950f_353_2.png)'
  merge: -1
