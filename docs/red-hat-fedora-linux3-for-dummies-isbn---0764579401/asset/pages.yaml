  md: '# 6 Red Fedora Linux 3 For Dummies


    # Part 1: Installing Fedora Core


    Part I, we introduce the Linux operating system, a dash of its history, and some
    things you can do with the Fedora Core distribution. We also describe how to prepare
    your computer to install Fedora Core: because many, if not, computers use with
    another (ahem) operating system installed, we describe how to reorganize your
    computer''s hard drive so you can install Linux. You find out what Linux is and
    how to prepare your computer to install Fedora Core. We then walk you through
    the installation and show the basics of working with Fedora Core.


    # Part II: Got Net?


    In II, you find out about connecting to the Internet and local networks. You see
    how to jump on the Internet with your everyday modem, high-speed (broadband) DSL
    connection, or cable modem. We also show how to connect to an existing network.
    If that local network has a high-speed Internet connection, you can use it as
    your portal to the wonderful world of surfing. The Internet can be dangerous,
    so we include instructions for creating your own firewall.


    # Part III: Linux, Huh! What Is It Good For? Absolutely Everything!


    Part III guides you through the particulars of doing something with Fedora Core.
    This part introduces you to the GNOME desktop environment and takes you through
    its paces by finding out how to move, resize, hide, and close windows and how
    to use the file manager and much more. Two chapters are devoted to using the Fedora
    Core multimedia capabilities, such as listening to CDs and MP3s, in addition to
    how to rip and record them. The world''s online radio stations are now available
    to you with streaming-media technology. We introduce you to the Mozilla browser
    so you can surf the Net and use the Evolution organizer to read your email, use
    your calendar, and perform other tasks. We also describe in detail the full-featured
    OpenOffice desktop-productivity suite. You can use OpenOffice with your Fedora
    Core machine to do all your writing and other work-related functions. You can
    even write a book with it!'
  merge: -1
