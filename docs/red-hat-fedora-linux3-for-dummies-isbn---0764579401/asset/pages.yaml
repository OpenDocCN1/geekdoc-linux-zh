- pgno: 316
  md: '# Chapter 20: Ten Problem Areas and Solutions


    # # "I forgot my password"


    **Problem:** You have to remember a zillion passwords at work and home. Unfortunately,
    you cannot remember your Linux password.


    **Solution:** The solution is simple if you have forgotten a user account password-
    but still remember the root password. In that case, simply log in as root and
    reset the user password. For example, if your user name is root, run the command
    password rod and enter the new password — for example, likes coffee.


    The solution is more difficult when you forget the root password. You have to
    become a hacker and break in to your computer to fix the problem. Fortunately,
    Red Hat provides two possible solutions: Either boot into singleuser mode via
    GRUB or boot from the first Red Hat installation disc.


    # # "I forgot my root password!"


    **Problem:** You cannot reset a user''s password if you cannot log in as root
    (superuser). However, you can easily circumvent having to log in as root by booting
    your Fedora Core computer into single-user mode.


    **Solution:** Turn on or restart your computer and press the keys to select the
    Linux operation system when the GRUB boot screen appears; Linux is selected automatically
    if you''re not using a multiboot (installed only Linux). Next, press the e to
    edit the GRUB configuration. You see three lines, the middle of which starts with
    the word *kernel*. Use the cursor keys to select the **kernel** line when the
    three-line menu appears. Press the e again, press the space, and then enter the
    number 1 at the end of the line. Press the Enter key and you return to the original
    GRUB window. Finally, press the **b** key to boot your system into single-user
    mode.


    ![](img/019b0d727ede29f1ccb08789667e950f_316_0.png)


    You can tell Linux to boot into nongraphical, rather than single-user, mode by
    substituting 3 for 1 when you''re editing the GRUB boot mechanism.


    # # "I need to break into my own computer!"


    Power-on or reset your computer. Change your BIOS to boot from CD-ROM, if necessary.
    Before your computer starts the GRUB boot system, insert the companion DVD into
    the DVD or CD-ROM drive. When the Red Hat installation process begins, type **linux
    rescue** at the boot: prompt.'
  merge: -1
  img_proc: true
- pgno: 317
  md: '298 Part V: The Part of Tens


    Red Hat boots into single-user mode and mounts your Linux partitions. You can
    access and use your computer''s root file system by entering the following-command:


    ```

    chroot /mnt/sysymage

    ```


    You now have leave control over your computer. For example, you can set the root
    password:


    ```

    passwd

    ```


    Enter the new password when you are prompted — and note that anyone who has physical
    access to your computer can use this method to break into it! If you use your
    computer in public or semicublic places, you should set your BIOS password. Setting
    a BIOS password doesn''t make this method of breaking impossible, but it does
    make it harder.


    # I want to change the GRUB boot order


    Problem: You created a dual-boot computer with Fedora Core and Windows, and you
    want to change which one boots by default.


    Solution: Modify the /etc/grub/grub.conf file on your Linux computer. The grub.conf
    should look similar to this example:


    ```

    default=0

    timeout=10

    splashimage=(hd0,0)/grub/splash.xpm.gz

    title Fedora Core (2.6.3-1.253.2.1)

    root (hd0,2)

    kernel /vmlinuz-2.6.3-1.253.2.1

    ro root=LABEL=/ rhgb

    initrd /initrd-2.6.3-1.253.2.1.img

    title Other

    rootnoverify (hd0,1)

    chainloader+1

    ```


    In this case, Linux is the operating system that boots by default, unless you
    select other; default = 0 corresponds to the first operating system on the list
    — the first Title. To change the order, simply change the default from 0 to 1.
    Here''s what that looks like:


    ```

    default=1

    timeout=10

    splashimage=(hd0,0)/grub/splash.xpm.gz

    title Fedora Core (2.6.3-1.253.2.1)

    root (hd0,2)

    kernel /vmlinuz-2.6.3-1.253.2.1 ro root=LABEL=/

    ```'
  merge: -1
  img_proc: true
- pgno: 318
  md: '# Chapter 20: Ten Problem Areas and Solutions 299


    ```

    inititrd /inititrd-2.6.3-2.1.253.2.1.img

    title Other

    rootnofify (hd0,1)

    chainloader +1

    ```


    The next time you boot your computer, your Windows operating system (the DOS line)
    automatically boots.


    # "When I1 boot into Windows, I get the recovery process"


    **Problem:** You have a dual-boot computer with Microsoft Windows as the alternative
    operating system. When you boot into Windows, you see the Windows recovery screen.
    "What happened? Help, I''m scared!"


    **Solution:** Relax — you almost certainly haven''t lost your mind or your Windows
    partition. What happened is the Fedora Core installation process mistakenly selected
    the recovery partition from which to boot Windows. Most computers now come with
    a preinstalled Windows recovery partition (rather than a recovery CD-ROM), so
    Fedora Core sees at least two partitions when it''s configuring GRUB, and it made
    the wrong choice. For example, you have hda1 and hda2, and GRUB thinks hda1 is
    the Windows partition — but hda1 is actually the recovery partition, and hda2
    is C in Windows.


    You have to recover GRUB to point to the correct Windows partition to make it
    work correctly. For example, you may have this /etc/grub/grub.conf file:


    ```

    default=0

    timeout=10

    image=(hd0,2)/grub/splash.xpm.gz

    title Fedora Core (2.6.3-2.1.253.2.1)

    root (hd0,2)

    kernel=/vmlinuz-2.6.3-2.1.253.2.1 root=LABEL=/ rhgb

    inititrd/inititrd-2.6.3-2.1.253.2.1.img

    title Other

    rootnofify (hd0,0)

    chainloader +1

    ```


    Change the rootnofify (hd0,0) parameter to rootnofify (hd0,1) and reboot your
    computer. Alternatively, if recovery partition is set to rootnofify (hd0,1), change
    it to rootnofify (hd0,0). This technique should fix your problem.'
  merge: -1
  img_proc: true
- pgno: 319
  md: '300 Part V: The Part of Tens


    # # My network is working, yet not working


    **Problem:** You have configured and checked your network connection and it appears
    to be okay. But you cannot connect to some or all of the machines or network services
    you want. You''re perplexed.


    **Solution:** Check your Iptables-based firewall. Red Hat counts two different
    levels of firewalls during the installation. This book describes several different
    iptables firewall configurations. If your firewall is not configured correctly,
    it prevents some or all network communications. Even if your firewall is configured
    correctly, it may be designed, in many cases, to block the type of communications
    you want.


    Turn off your firewall with this command:


    ```

    /etc/init.d/iptables stop

    ```


    If your network connection instantly works, your firewall was most likely the
    culprit. In that case, you have to modify your firewall to make it work for your
    needs. Turn the firewall back on as soon as you fix the problem:


    ```

    /etc/init.d/iptables start

    ```


    A description of how to customize an Iptables firewall is beyond the scope of
    this book. However, the firewalls we show you how to construct in this book may
    work for you and be easier to understand and modify. Refer to Chapter 8 for more
    information about Iptables-based firewalls.


    # # I want to make an emergency boot floppy disk


    **Problem:** You skipped making an emergency boot disk when you installed Fedora
    Core and want one now.


    **Solution:** All is lost if you read Chapter 3 and skipped making a boot disk;
    it''s easy, to make one. Log in to your computer and insert a blank floppy disk
    — or one that has information you don''t mind deleting (losing everything on that
    disk). Then run this command:


    ```

    uname -r

    ```


    This command returns information about the version of Linux you''re running. The
    output looks similar to this:


    ```

    2.6.3-2.1.253.2.1

    ```'
  merge: -1
  img_proc: true
