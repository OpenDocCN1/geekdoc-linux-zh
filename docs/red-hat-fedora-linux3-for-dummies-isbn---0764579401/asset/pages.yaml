    # Discovering Your Windows 9x or Windows Me Hardware


    You don''t have to go to Hollywood to be discovered — provided you''re a piece
    of computer hardware. Windows provides the tools to discover your bits and pieces
    right at home. This section describes how to use Windows 9x or Windows Me (which
    Microsoft will support for a while) for the discovery process.


    If you have a Windows 9x or Windows Me computer, use this section to dis-cover
    and display information about your computer. Use the ubiquitous Control Panel.
    Start your Windows computer and follow these instructions:


    +   1. Click the Start button and choose Settings-Control Panel. Double-click
    the System icon and select the Device Manager.


    +   2. At the top of the screen, select View Devices by Connection. This step
    shows you all components and how they relate to each other.


    +   3. On the Device Manager tab (from the Control Panel) in the System Properties
    dialog box, select the View Devices by type.


    On the list, notice a plus (+) or minus (-) sign precedes some icons. A plus sign
    indicates that the entry is collapsed. A minus sign indicates that the entry is
    expanded to show all subentries.


    +   4. Click the plus (+) sign to expand the list.


    Expanding the list shows every computer subsystem. Every device that makes up
    your computer is shown. Right-click a device and choose the Properties option
    to display information about a particular device.


    TIP You can use the Web to find out about your computer. Computer companies provide
    detailed information about their products on their Web sites. Go to the manufacturer''s
    Web page and look up your computer''s model number. When you get to your page,
    look for the Specification (or Specs) link.


