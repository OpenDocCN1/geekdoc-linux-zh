- pgno: 296
  md: '# Chapter 19


    # Building a Streaming Audio Server


    In This Chapter


    +   - Introducing Ices2 and Icecast2 streaming audio servers

    - Creating a music source

    - Installing and configuring Ices2 and Icecast2

    - Streaming audio to your private network


    All work and no play makes Linux a dull boy. So forget the workday world of word
    processors and network services for a while and have some fun. This chapter describes
    how to configure your Fedora Core computer as an audio-streaming server for your
    private network.


    We show you in Chapter 12 how to use Linux applications, such as MPlayer, and
    to listen to Internet audio streams. In this chapter, we switch sides and show
    you how to serve up these types of streams. It’s pretty cool when you think about
    it: you can carry your laptop computer around your home and listen to your music.


    # Introducing Ices2 and Icecast2


    Once again, the open-source movement fills the bill with Ices2 and Icecast2. Ices2
    and Icecast2 are designed to serve up audio streams.


    You’re most likely to know how audio streaming works from the user’s perspective.
    Chapter 12, for instance, shows how to use Rhythmbox and MPlayer to listen to
    Internet audio streams. However, most of us aren’t familiar with multimedia audio
    streams (audio, video, and slide shows) when created. To create networked audio
    stream, you feed content such as a music track from a CD to the multimedia server
    Ices2. Ices2 converts the audio stream to Ogg format and feeds it to Icecast2.
    (Shoutcast and RealServer, which are commercial servers, operate in a manner similar
    to Icecast2.) Ices2 in turn streams the content to a private network or the Internet.
    You then use a multimedia client such as Rhythmbox to listen to the audio stream.'
  merge: -1
  img_proc: true
- pgno: 297
  md: '# 278 Part IV: Revenge of the Nerds


    Be careful where you get the audio content. You must abide by copyright law.

    Of course you''re free to broadcast content that you create or for which you obtain
    permission to use on the Internet. You can also use music that you purchase for
    your own. That''s why we describe how to create a private networking system. The
    system that we create is just a glorified cd player.


    The original Icecast worked with MP3 streams. Icecast is still available, but
    it is no longer being developed or supported. Because of possible copyright problems,
    Icecast has essentially been abandoned in favor of Icecast2, which works with
    Ogg/Vorbis format.


    This list provides more detail on each component in the system:


    +   **Multimedia client:** The client connects to the multimedia server and plays
    the field. For example, you use Rhythm to connect to Icecast2.

    **Multimedia server:** The server is responsible for accepting requests from a
    client and streaming multimedia information to the client. The server also converts
    the multimedia content into Internet Protocol (IP) packets in order to route it
    across a private network or the Internet.

    **Multimedia content:** Your multimedia server is not very useful without a content
    source. Your source may be a music CD or a DJ — you, for example. Sources are
    either fixed or dynamic. For example, a music CD is a fixed source. The Ices2
    application reads from a fixed source and feeds it to Icecast2.


    # Creating a Music Source


    Before you create your server, you have to create something to play. This section
    describes how to create an Ogg/Vorbis file to play. We assume that you want to
    create a file from a commercial music CD. This practice is legal, and does not
    violate copyright law because you don''t create a server that is broadcast on
    a private network (years). As far as we know, you are still allowed to listen
    to your own CDs.


    The Ogg/Vorbis audio formatting system is similar in function to MP3. However,
    Ogg/Vorbis (or just Ogg) is an open-source format (also known as a codec) — and
    unlike MP3, doesn''t use any proprietary algorithms or protocols. Ogg also provides
    higher fidelity than other formats. Ogg/Vorbis is two separate entities: Ogg is
    an audio compression format, and Vorbis is an encoding system.'
  merge: -1
  img_proc: true
- pgno: 298
  md: '# Chapter 19: Building a Streaming Audio Server 279


    Use the following steps to create an Ogg-Vorbis-formatted music file:


    +   1. Log in as the Root user and insert an audio CD.


    +   2. Click the GNOME Menu button and choose Sound & Video::Sound Juicer CD Ripper.


    The Sound Juicer window opens, displaying the CD''s tracks. All tracks are automatically
    selected for extraction (you see check marks in the Extract column check boxes).
    Unselect unwanted tracks by clicking the check boxes.


    +   3. Click the Extract button in the subwindow.


    A progress dialog box opens. Sound Juicer extracts the music from the CD to your
    computer. The files are stored in a subdirectory named after the album title,
    itself is stored in a subdirectory with the name of the artist. For example, if
    the artist is Norah Jones and the album is Come with Me, the music tracks live
    in the directory Norah Jones/Come with Me/ (in your home directory).


    +   4. When the music is extracted an Information dialog box opens and you can
    click the Close button.


    Ices2 and icecast use what''s called a Playlist to determine what media to stream.
    The following steps show how to create a simple playlist from the music you just
    extracted.


    +   5. Copy the first Ogg file you created to the /tmp directory and rename as
    example.ogg.


    We''re copying to the /tmp directory and renaming, just to keep the configuration
    files as simple as possible. Here''s what that looks like:


    ```

    cp example1.ogg /tmp/example.ogg

    ```


    +   6. Create the playlist.txt file that points to the Ogg music file, like this:


    ```

    echo * /tmp/example.ogg* > /usr/local/etc/playlist.txt

    ```


    Your simple Playlist is now created and ready to be played.


    You can convert from Wave to Ogg format by running this command in a terminal
    emulator: oggenc *wav. You can play Ogg-encoded files: ogg123 xyz.wav.


    You now have one or more Ogg-Vorbis-formatted audio files. You have to install
    and configure icecast2 and Ices2 to broadcast music to yourself.


    ![](img/019b0d727ede29f1ccb08789667e950f_298_0.png)'
  merge: -1
  img_proc: true
- pgno: 299
  md: '# Part IV: Revenge of the Nerds


    # # Installing Ices2 and Icecast2


    In this section, we break from our self-imposed rule of using only pre-compiled
    software in package form. First, even though Icecast2 comes packaged in RPM format,
    it requires a library package not included with Fedora Core 3. Second, Ices2 does
    not come in package form yet. Third, we need to install a library that''s also
    not yet packaged. We will show how to download and build Libshout, Ices2 and Icecast2
    from source code.


    ![](img/019b0d727ede29f1ccb08789667e950f_299_0.png)


    Compiling code like Ices2 and Icecast2 is the reason we recommended installing
    the Workstation class of Fedora Core in Chapter 3. Using the Workstation class
    installs the compilers and associated utilities needed to compile from source
    code.


    In the Linux world, building from source code requires that you follow these general
    steps:


    +   1. **Configure.** The first step requires configuring the software. The configuration
    process builds dependency files. Several Linux systems that do this are available.
    Icecast and Ices2 use a configure script.


    +   2. **Compile.** After the software is configured, you have to compile it.
    *Compiling* is a universal process that changes source code into executable code.
    Source code is readable by human beings—well, at least the class of humans known
    as nerds. Compiling source code changes it into a format that computers can understand.
    All applications are compiled from source code.


    +   3. **Install.** After the result is compiled, it must be installed. Linux
    uses default directories like `/usr/bin`, `/usr/sbin`, `/usr/local/bin`, and `/usr/local/sbin`
    to store executable files (applications and services). Most software systems need
    to be placed in these types of locations to work correctly.


    # # Downloading Libshout, Icecast2 and Ices2


    Before you can build your streaming-audio-server, you have to get the Icecast2
    and Ices2 software using the Libshout library. This section describes how to download
    the software.


    ![](img/019b0d727ede29f1ccb08789667e950f_299_1.png)


    By now, you know that Linux uses many names and acronyms, many of which are cryptic
    at best. So you probably didn''t dare to raise an eyebrow when you encountered
    the name *Oogg/Vorbis*, Icecast2, or xiph. Oogg/Vorbis is a science-fiction character
    that its developers like. Icecast2 is a variation on the name *Shoutcast*, and
    Xiph is short for *Xiphophorus helli*, a small sword-tail fish that''s popular
    in small aquariums.'
  merge: -1
  img_proc: true
