    # Social Engineering 101010101010


    Hackers don''t have to discover supertechnical tricks to break into your computer.
    Many smart hackers aren''t deterred when they encounter a well-protected computer
    or network. What does a poor hacker in these security-aware times have to do to
    break into your system? Not all of them.


    Some hackers rely only on technological means. One such technique is social engineering,
    which is a fancy way of saying "I plan to trick you or your associates into giving
    me information that I will use against you."


    Social engineering can be as simple as a hacker calling you to see whether you''re
    at home or in the office. If you are not physically present, the hacker can drop
    by, or break in, and steal your computer or its disks. A hacker who is not told
    may be able to gain access to a computer by tricking a help desk technician into
    resetting a password. The idea is to gain access or control of your computer or
    network in unexpected ways.


    Another social-engineering technique hackers employ is to call a corporation''s
    help desk and pretend to be a VIP. The poor minimum-wage employee can be bullied
    orajoled into giving out a password or other information.


    > REMEMBER


    The moral of the story is to exercise good security hygiene and be careful of
    strangers. Don''t give out information unless it''s essential and you can verify
    the authenticity of the request.


