  md: '# 312 Part V: The Part of Tens


    If you''re a hacker, this is good stuff. By knowing that the machine is running
    certain services, you can try to find vulnerabilities to exploit. Lots of hackers
    do.


    Another good test is to log in to your ISP account and scan the Internet connection
    to which your computer or private network is attached. If your firewall is running
    correctly, the scan shows little or nothing. That''s good. If the scan displays
    information about your computer and network, your firewall either isn''t running
    correctly or isn''t running at all.


    You can use that information to your advantage. Seeing that the hackers gives
    you the ability to plug your security holes.


    # I Know Where You Logged In Last Summer


    Linux is good at keeping a diary. Fedora Core is configured during installation
    to keep logs of every user login and other technical information. Examining logs
    is more of an art than a science, however. (We don''t have explicit techniques
    for determining whether your system is presently being attacked or has been broken
    into. There are, however, some good intrusion-detection products out there — Snort,
    for example — and we do know of a book that can help you: Wiley — Snort for Dummies
    by Charlie Scott, Paul Wolfe, and Bert Hayes. Check it out.)


    Experience counts for a great deal when you''re examining logs for discrepancies.
    The more you keep track of your system, the more you recognize idiosyncrasies
    and general behavior. Fedora Core stores its general-purpose logs in the /var/log
    directory.


    Naturally, Fedora Core provides a useful graphical log-checking utility. To run
    it, follow these steps:


    +   1. Click the GNOME Menu and choose System Tools:System Logs.


    +   2. Enter the root password, if you''re prompted.


    The System Log window opens.


    +   3. Choose any of the log groups on the left submenu to see the selected Information.


    The moral of the story is "Check your logs frequently!"'
