  md: '# Part III: Linux, Huh? What Is It Good For? Absolutely Everything!


    # Using GNOME Windows


    You can do anything to a window, you have to get its attention. When you have
    a window''s attention, it has focus. Depending on how you have set up GNOME, you
    can give a window focus with GNOME in several ways:


    +   * Click the window''s minimized icon on the GNOME Panel.

    * Click the window''s title bar, at the top of the window.

    * Click a part of the window itself, which typically also makes the window the
    topmost one. This method is the default.


    ![](img/019b0d727ede29f1ccb08789667e950f_137_0.png)


    In this book, we stick with the Fedora Core and GNOME default setting gives focus
    to a window when you click it.


    # Moving windows


    To move a window, click anywhere on the window''s title bar with the left mouse
    button (and hold it down). As long as you continue to hold down that button, the
    window moves anywhere that you move your mouse. Release the button and the window
    stays there.


    # Resizing windows


    Sometimes a window is a little too big or a little too small, and life would be
    much easier if you could nudge window into shape. To do that, position the mouse
    cursor on any border of the window. Click and drag the window''s outline to the
    size you want. Release the mouse button and the window takes the new size.


    # Minimizing windows


    Now that you have lots of windows on the screen, how can you get rid of a few
    or all of them? You can minimize (or iconify — a concept) a window by clicking
    the bold, underscored button toward the upper-right corner, which removes the
    window from the desktop and places it in a storage area of the GNOME Panel. If
    you''re in a particularly devilish mood, you can be more drastic and close a window.
    You can see the icon on the GNOME Panel along the lower, central edge of the screen.'
