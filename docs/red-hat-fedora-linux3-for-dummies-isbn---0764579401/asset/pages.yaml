    # Protecting your passwords


    You can use Mozilla to save passwords that you use when you''re browsing the Internet.
    When you start saving passwords, you should also start encrypting them. Encrypting
    passwords is optional, but we are highly (highly!) recommend it. Encrypting makes
    finding your passwords much more difficult for someone else. With all the business
    you do on the Internet, you must protect your information as much as possible.
    Follow these steps:


    +   1. From your Mozilla browser, choose Preferences from the Edit menu.


    +   2. Click the plus sign (+) next to the Privacy & Security menu.


    +   3. Click the Passwords option.


    A submenu opens.


    The Passwords dialog box opens.


    +   4. Click the button labeled Use encryption when storing sensitive data.


    +   5. Click OK.


    +   6. Click the Edit-Preferences menu again.'
