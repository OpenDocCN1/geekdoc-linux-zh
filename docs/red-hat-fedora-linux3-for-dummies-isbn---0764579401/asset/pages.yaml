  md: '# Part III: Linux, Huh? What Is It Good For? Absolutely Everything!


    # Changing GNOME''s look and feel


    GNOME gives you a way to change the look and feel of its elements — that is, their
    theme: the size, shape, texture, and color of the buttons, slides, menus, borders,
    and other pieces of an open window.


    # Changing themes


    You can change your theme more easily and quickly than a politician after an election
    by choosing Preferences; Theme from the GNOME menu; alternatively, you can open
    the Start Here icon and select Preferences in the window that opens. Double-click
    the Theme icon when the Preferences window opens.


    When the Preferences window opens, the Application tab is activated by default.
    You can select any theme and all your open windows immediately adopt it. The application
    theme changes the tint and texture applied to each window. For example, selecting
    the Metal theme gives you a brushed appearance.


    Click the Window Border tab. Click any of the themes and your window borders change.
    Window borders consist of the tint and texture of the strip that surrounds each
    window and the buttons on the strip.


    Keep different themes until you find one you like. Click the Close button when
    you''re finished.


    # Changing desktop backgrounds


    You can also alter the image that''s displayed on your desktop. The image can
    be a picture, a pattern, or solid colors. Change the desktop to find one by right-clicking
    any blank (uncluttered) section of the desktop. Choose Desktop Background from
    the menu and the Background Preferences windows opens. Select an image by clicking
    the Picture section or one of its variations. The Please Select an image opens
    or search for another image on your disk. Alternatively, you can select a solid
    color by clicking the No Picture button.


    Open the Background Style menu and select either a solid color or a set of colors
    that change on the vertical or horizontal axis. You can then change the color
    (solid or gradient) by clicking the Color button. Select your color from the Pick
    Color window. Repeat the process for the other color and get a full screen of
    colors.


    ![](img/019b0d727ede29f1ccb08789667e950f_135_0.png)


    Right-clicking anywhere on a blank section of the desktop and then choosing Use
    Default Background resets the background. The default background is reactivated.'
