    in this book use the X-based applications and utilities. We do not because they''re
    generally easier to use — and because this book wasn''t written for techie systems
    administrators.


    Occasionally a utility or program doesn''t run graphically. Believe it or not,
    some geekier users prefer a text-based system. If you''re not familiar with doing
    some basic administrative tasks with a text-based system, we'
