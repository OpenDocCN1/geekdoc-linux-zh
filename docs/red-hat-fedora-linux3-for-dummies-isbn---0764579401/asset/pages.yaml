- pgno: 361
  md: '# Part VI: Appendixes


    If you added an IDE drive, look for the mention of an hdx device, where x is replaced
    with the letter b, c, d, or e. This information tells you that your kernel "saw"
    the new hard drive it booted:


    ```

    hdb: HITACHI_0227A-50, 4789MB w/512KB

    Cache,CHS=610/255/63

    ```


    If you added a SCSI drive, the general device type is sdx.


    # 3. Partition the new drive.


    Run the fdisk /dev/hdb command for an IDE drive.

    Use the command fdisk /dev/sda for a USB or FireWire memory stick. The memory
    stick appears as a SCSI device, such as /dev/sda,/dev/sdb, or /dev/sdc, depending
    on your computer''s configuration.


    # 4. Create a file system on the new partition (change the devices as appropriate).


    When you''re using an IDE or SCSI drive, for example, enter the following command:


    ```

    mkfs /dev/hdb

    ```


    For a USB memory stick (long, linear chip), enter this command:


    ```

    mkfs /dev/sdc

    ```


    # 5. Create a new directory in which to mount the new device:


    ```

    mkdir /space

    ```


    # 6. Mount the newly formatted drive by using the appropriate command:


    ```

    mount /dev/hdb /space

    ```


    or


    ```

    mount /dev/sdc /space

    ```


    Your drive has been physically added to your system and partitioned, and you have
    added file systems. The drive is ready to join the rest of the file system.'
  merge: -1
