    One of the great innovations of recent times is the use of the Internet to transmit,
    or stream, audio and video programming. Streaming technology gives anyone the
    capability to create an online radio or TV station — unlimited by geography or
    governmental approval — inexpensive. Using streaming technology, computer users
    can listen to or view those broadcasts all around the world.


