- pgno: 88
  md: '# Chapter 5: Dull Dial-Up Modems Still Get the Job Done


    Linux use device files to communicate with peripherals. Device files are found
    in the /dev directory and are roughly equivalent to Windows drivers: the Linux
    kernel uses them to communicate with your hardware.


    You can connect your modem to one of four serial ports or of many USB ports available
    on your PC. An external serial modem is generally connected to port /dev/ttyS0,
    and sometimes to /dev/ttyS1, or even /dev/ttyS2 or /dev/ttyS3; USB modems are
    connected to /dev/ttyUSB0, /dev/ttyUSB1, and so on. If you have an internal modem,
    it can be any of the tty devices.


    # Firing Your Internet Connection


    Fedora Core provides a PPP dialer utility to help you establish a PPP connection.
    Establish this connection by using PPP configuration you set up with the Dialup
    Configuration tool (which we describe earlier in this chapter, in the section
    "Configuring Your Internet Connection".


    To connect to the Internet with the PPP dialer, follow these steps:


    +   1. Click the GNOME Menu button and choose System Tools::Network Device Control.


    The Network Device Control window appears, displaying all the network interfaces
    you have.


    +   2. Click the name of your modem (for example, Myconnection) and then click
    Activate.


    The Network Device Control utility dials and connects to your ISP.


    +   3. When you finish using the Internet, click the Deactivate button in the
    Network Device Control window.


    Your connection terminates.'
