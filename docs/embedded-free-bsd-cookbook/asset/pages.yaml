  md: 'To a system designer, library functions and system calls appear to be the same.
    Both have defined function prototypes and return values. To an application programmer,
    the functional implementation is not important. The interface, function name,
    parameters, and return value are important. The difference resides in the implementation.


    When a program calls a library function program, execution is passed to the library
    function, the requested operation is performed, and control returned to the calling
    function. This all occurs in the context and address space of the running process.


    ![](img/8be5cdcebf09c36e2285b8e096cda24a_30_0.png)


    Figure 3-1. Library Function Call


    ![](img/8be5cdcebf09c36e2285b8e096cda24a_30_1.png)


    A system call is a request to the kernel to execute a privileged operation on
    behalf of a user process. When a program makes a system call, program execution
    transitions from User Mode to Kernel Mode, the kernel performs the requested operation,
    then program execution transitions back from Kernel Mode to User Mode. In order
    for the operation to be performed, the process must make a request to the kernel.


    Figure 3-2. System Call


    # System Call Implementation


    System calls are implemented in two steps. The first step is to transition from
    User Mode into Kernel Mode, which is accomplished by using a software interrupt.
    In addition, data must be passed from User Mode to Kernel. In this section we
    will look at these details.'
