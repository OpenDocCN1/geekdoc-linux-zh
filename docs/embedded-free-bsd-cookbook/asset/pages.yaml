  md: '# Software Interrupt


    On an Intel x86 processor, a program executing in User Mode performs a switch
    into Kernel Mode by executing a software interrupt. A software interrupt is an
    event that is processed asynchronously by the processor, using an interrupt handler.
    An interrupt handler deis called in response to the invocation of a hardware or
    software interrupt. A software interrupt is different from a hardware interrupt,
    because it occurs synchronously within the running process.


    Software interrupts are invoked on an Intel x86 processor by executing the INT
    instruction. The INT instruction takes a number between 0 and 255 that designates
    the interrupt vector. System calls are assigned to interrupt vector 128 (0x80).
    A process will invoke a system call by executing the INT $080 instruction.


    Every interrupt vector contains an entry in the Interrupt Descriptor Table (IDT).
    The IDT is a table of 256 longs. Each word represents the interrupt handler for
    the specific interrupt vector. For a system call, the system interrupt handler
    is located at 0x200. 0x200 is derived by interrupt vector 0x80 * 4 = 0x200.


    Once the process encounters either a software or hardware interrupt, it fetches
    the address from the Interrupt Descriptor Table (IDT) for the specific interrupt
    vector and executes that interrupt handler. After the interrupt handler is completed,
    execution returns to the process.


    ![](img/8be5cdcebf09c36e2285b8e096cda24a_31_0.png)


    Figure 3-3. Interrupt Handling


    # Passing Data


    The kernel implements many different system calls. To distinguish between different
    system calls, a number is passed that designates which system call is being made;
    this number is called the system call number. A list of defined system calls can
    be found in `/sys/kern/syscalls.master`. Before a system call is made, the system
    call number is pushed onto the program stack.'
