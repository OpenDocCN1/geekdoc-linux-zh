  md: '# LoginGraceTime 600


    The LoginGraceTime options specify how long, in seconds, after a connection request
    the server will wait before disconnecting if the user has not successfully logged
    in.


    # KeyRegenerationInterval 3600


    The KeyRegenerationInterval options specify how long, in seconds, the server should
    wait before automatically regenerated its key.


    # PermitRootLogin no


    The PermitRootLogin options specify which root can log in using ssh.


    # IgnoreRosts yes


    The IgnoreRosts options specify whether rhosts or shosts files should not be used
    in authentication. For security reasons it is recommended to use no rhosts or
    shosts files for authentication.


    # IgnoreUserKnownHosts yes


    The IgnoreUserKnownHosts options specify whether the ssh daemon should ignore
    the user''s $HOME/.ssh/known_hosts during RhostsRSAAuthentication.


    # StrictModes yes


    The StrictModes option specify whether ssh should verify user''s permissions in
    their home directory and rhosts files before accepting login.


    # X11 Forwarding no


    The X11Forwarding options specify whether X11 forwarding should be enabled or
    not on this server. Since the DIO appliance runs without GUI installed, we can
    safely turn this off.


    # PrintMotd yes


    The PrintMotd option specify whether the ssh daemon should print the contents
    of /etc/motd file when a user logs in interactively.


    # SyslogFacility AUTH


    The SyslogFacility option specifies the facility code used when logging messages
    from ssh. The facility specifies the subsystem that produced the message—in our
    case, AUTH.'
