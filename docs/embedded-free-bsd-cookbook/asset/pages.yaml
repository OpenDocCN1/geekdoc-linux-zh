  md: '# Programming the Configuration Register


    The configuration register programs the direction of the data IO ports. The DIO
    interface library contains functions to read and write the configuration register,
    as well as a utility function that provides the direction of individual digital
    IO line.


    # The dioconfig_t enum


    Each of the bits that controls a port has a bit defined in the dioconfig_t enum.
    These defines are used to program the data port directions. Listing 5-15 shows
    the dioconfig_t data type. These defines directly coincide with the bits in the
    config register to program the port directions.


    ```

    typedef enum dioconfig_t

    {

    porta_in = 0x10, /* port a configured as input lines */

    portb_in = 0x02, /* port b configured as input lines */

    portcol_in = 0x01, /* port c low configured as input lines */

    portch_in = 0x08, /* port c high configured as input lines */

    } dioconfig_t;

    ```


    +   Listing 5-15


    # The dio_set_config and dio_get_config Functions


    The dio_set_config and dio_get_config functions are used to read and write the
    config register. The config parameter represents a bitwise OR value of the dioconfig_t
    data type.


    ```

    #include <dio.h>


    int32_t dio_set_config(dioconfig_t config)

    int32_t dio_get_config(dioconfig_t* config);

    ```


    Here, dio_set_config sets the direction of the digital ports, and returns 0 on
    success or -1 on failure.


    Listing 5-16 represents the code to write the config bits, the parameter passed
    directly through to the DIO device driver.


    ```

    newcfg = (uint32_t) cfg;

    newcfg |= 0x80; /* PCI-DIO24 needs high bit set */

    ```'
