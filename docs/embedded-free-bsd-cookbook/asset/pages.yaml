  md: '# Building the Kernel


    # Overview


    The kernel is the core of the FreeBSD operating system. It is responsible for
    managing resources, enforcing security, networking, disk access, and more. The
    default kernel is located in the file /kernel.

    In the design and development of an embedded system, disk space and memory are
    critical resources. Unlike a typical desktop computer packed with RAM, an embedded
    computer only needs minimal support to perform its task, with respect to software
    as well as hardware.

    During FreeBSD installation, a kernel is installed on your computer called the
    GENERIC kernel. The GENERIC kernel is created to support as many computers and
    configurations as possible to simplify the installation process. This chapter
    discusses how to configure and build a custom FreeBSD kernel to suit our hardware
    and DIO application.


    # The Kernel Configuration File


    The first step toward building a kernel is to create a custom configuration file,
    which allows us to tailor the kernel for our specific hardware. One recommended
    method for creating a custom kernel config file is to start with the generic config
    file, located in /usr/i386/conf/GENERIC and remove the extra peripherals. We will
    create our config file using this method, but first we''ll look at the GENERIC
    file.

    The GENERIC kernel provides support for many popular peripherals contained in
    PCs. Most of these devices can be removed to give us a much smaller kernel. Kernel
    configuration files are located in the /sys/i386/conf directory.'
  merge: -1
  pgno: 167
- img_proc: true
  md: '# GENERIC Configuration File


    In the following sections you''ll find definitions of the main parts of a kernel
    configuration file.


    # The machine Keyword


    The machine keyword defines the CPU architecture the kernel will execute on. The
    GENERIC Configuration file for the x86 FreeBSD distribution is i386. Only one
    machine keyword can be specified in the config file.


    ```

    machine i386

    ```


    # The cpu Keyword


    The cpu keyword defines the CPU types the kernel will execute. GENERIC is configured
    to run on Intel 386 and greater CPUs. A kernel can be configured to run on more
    than one CPU. However, the CPUs defined in the configuration file must be binary-compatible.
    If the DIO runs on a Celeron processor, our configuration will consist of 1686_CPU
    architecture.


    ```

    cpu I386_CPU

    cpu I486_CPU

    cpu I586_CPU

    cpu I686_CPU

    ```


    # The ident Keyword


    Here, ident is used to specify the name of the kernel. Each configuration file
    should have a unique name. The value specified by the ident keyword is the value
    displayed on the system console during boot.


    ```

    ident GENERIC

    ```


    # The maxusers Keyword


    The maxusers keyword tunes the sizes of kernel internal data structures. The larger
    this value, the more system memory is used. Because the DIO appliance is a dedicated
    system, we will lower this value to consume less system memory.


    ```

    maxusers 32

    ```'
  merge: -1
  pgno: 168
- img_proc: true
  md: '# Building the Kernel


    # Kernel Options


    The following sections provide a description of each of the global kernel options
    for the GENERIC configuration file.


    # ### The makeoptions Keyword


    The makeoptions keyword specifies compiler options that are processed by the config
    command and passed to the C compiler. For example, if we wanted the debugging
    option to analyze system crash dump, the line would be.


    ```

    makeoptions DEBUG=-g #Build kernel with gdb(l) debug symbols

    ```


    # ### The options Keyword


    The options keyword is used to customize the kernel by setting various options.


    MATH_EMULATE If your computer contains an i386 or i486 processor without a math
    coprocessor, the kernel may provide math coprocessor support. Since our data logger
    uses Celeron processor, which contains floating-point support, this will be removed.


    ```

    options MATH_EMULATE #Support for x87 emulation

    ```


    INET These options are used for networking access, INET and INET. The DIO appliance
    will not be connected to the IPv6 network, so these will be removed.


    ```

    options INET #InterNetworking

    options INET6 #IPv6 communications protocols

    ```


    File Systems FreeBSD provides support for numerous file systems. FFS, originally
    known as UFS, the default file system that the data logger uses. Additionally,
    we will be booting from a flash device and running using a memory file system
    and would like to keep support for MSDOS floppy disks and CDROMs for a future
    upgrade path.


    ```

    options FFS #Berkeley Fast Filesystem

    options FFS_ROOT #FFS usable as root device [keep this!]

    ```'
