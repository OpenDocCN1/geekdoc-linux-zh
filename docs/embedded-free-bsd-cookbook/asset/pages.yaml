  md: "As with the line setting functions, enums are used to define the values for\
    \ specific states.\n\n# ### The diointostate_t enum\n\nAt any time an interrupt\
    \ is enabled or disabled, to help in defining the details of the interface library\
    \ API the diointstate_t is defined, which represents the state of the interrupt\
    \ and the PCI interrupt. Both sets of functions that enable the interrupt and\
    \ PCI interrupt take the diointstate_t parameter. Listing 5-7 shows the diointstate_t\
    \ data type.\n\n```\ntypedef enum diointostate_t\n{\n  disable = 0,\n  enable\
    \ = 1\n} diointostate_t;\n```\n\nListing 5-7\n\nHere, diointstate_t has two values,\
    \ defined as disable and enable. These values correspond to the bit settings for\
    \ these bits in the interrupt controller register.\n\n# ### The dio_set_int and\
    \ dio_get_int Functions\n\nThe PCI-DIO24 contains a bit to program the local interrupt.\
    \ The interrupt is either enabled or disabled.\n\n```\n#include <dioif.h>\nint32_t\
    \ dio_set_int(diointostate_t state)\nint32_t dio_get_int(diointostate_t* state)\n\
    ```\n\nThe local interrupt is controlled by programming bit 0 in the interrupt\
    \ status control register. The local interrupt is defined by the INT_BIT literal.\n\
    \n```\n#define INT_BIT 0x01\n```\n\nSetting the local interrupt involves reading\
    \ the interrupt control status register, modifying the local interrupt bit, then\
    \ writing the new value back to the interrupt control register. Listing 5-8 demonstrates\
    \ the code to set the interrupt bit."
