    \n        *offset = i;\n    } else if (*offset < 0 || *offset >= SYS_MAXSYSCALL)\n\
    \        return EINVAL;\n    else if (systent[*offset].sys_call != (sys_call_t*)lkmnosys)\n\
    \        return EEXIST;\n\n    *old_systent = systent[*offset];\n    systent[*offset]\
    \ = *new_systent;\n    return 0;\n}\n```\n\nListing 3-9\n\nWhen a new system call\
    \ is added, the kernel function syscall_register\nis called. The offset and systent\
