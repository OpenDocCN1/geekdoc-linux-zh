    int getpriority(int which, int who, int prio);

    int setpriority(int which, int who, int prio);

    ```


    The getpriority and setpriority system calls work differently based on the which
    parameter.


    | which | Definition |

    | --- | --- |

    | PRIO_PROCESS | process identifier |

    | PRIO_PGRP | process group identifier |

    | PRIO_USER | user ID |


    The setpriority and getpriority system calls return 0 on success and -1 on error.'
