    When a process is created, the following list of attributes is inherited from
    the parent file descriptors: process group ID, access groups, working directory,
    root directory, control terminal, resources, interval timers, resource limits,
    file mode mask, and signal mask.


    # The execve System Call


    Many times a process is created to run another program. The execve system call
    is used this way and is invoked immediately following a fork system. An execve
    system call will replace the currently executing program with a new program.


    ```

    #include <unistd.h>

    int execve(const char *path, char *const argv[], char *const envp[]);

    ```


    The execve system call takes three parameters; path is the path and filename of
    the new program to execute; argv contains a pointer to the argument string to
    pass to the program; envp contains a list of environment variables.


    The execve system call returns -1 on error. The execve system call has numerous
    wrappers in the Standard C Library, known as the exec family of functions.


    # Process Termination


    A process can terminate intentionally by calling exit or unintentionally by receiving
    a signal from another process. Regardless of the reason, when a process terminates,
    a notification is returned to the parent. If the parent process does not receive
    the notification, the child process becomes a zombie. The child will remain a
    zombie until the parent retrieves the child''s exit status.'
