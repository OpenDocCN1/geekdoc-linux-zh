  md: "# The DIO24 Application Interface Library\n\nThe implementation of the DIO24\
    \ Interface library consists of four functional categories. Each functional category\
    \ is related to programming the different features of the controller. The categories\
    \ are register utilities, reading and writing the digital I/O lines, programming\
    \ the configuration register, and pro-programming the interrupt controller. Each\
    \ of the following sections addresses the functions for the functional category.\n\
    \n# The dio_get and dio_set Functions\n\nAll accesses to the PCI-DIO24 hardware\
    \ registers are provided by two internal library functions, dio_get and dio_set.\
    \ These two functions are responsible for obtaining a file descriptor to the device,\
    \ if necessary; packing the data into the ioctl structure; and making the appropriate\
    \ ioctl call to the driver.\n\n```\nstatic int32_t dio_get(int32_t reg, int32_t\
    \ *pval)\nstatic int32_t dio_set(int32_t reg, int32_t val)\n```\n\nThe implementation\
    \ of each of these functions is similar. Listing 5-1 demonstrates how the file\
    \ descriptor to the device is driven. If the internal file descriptor diofd is\
    \ not set, the function attempts to open the device and obtain a file descriptor\
    \ using the following code.\n\n```\n/* if the device is not open, open it * */\n\
    if (diofd == -1)\n{\n    diofd = open(\"/dev/dio0\", O_RDWR);\n    if (diofd ==\
    \ -1)\n    {\n        return(-1);\n    }\n}\n```\n\nOnce a valid file descriptor\
    \ is obtained, the code packages the request to the appropriate ioctl structure.\
    \ Recall from the previous chapter that ioctl to the DIO device driver accept\
    \ a dioreg_t structure, containing the dioreg_t size, register, and value for\
    \ the ioctl. The register structure used by the DIO device driver is shown in\
    \ Listing 5-2."
  merge: -1
  pgno: 89
- img_proc: true
  md: "# 88 EmbeddedFreeBSD Cookbook\n\n```\nstruct dioreg_t\n{\n    int32_t size;\n\
    \    int32_t reg;\n    int32_t val;\n}\n```\n\nListing 5-2\n\nThe dio_set and\
    \ dio_get functions set a local dioreg_t structure and make the ioctl code to\
    \ fill in the ioctl and call the driver contained in Listing 5-3.\n\n```\n/* fill\
    \ in the device structures */\nregt.size = sizeof(struct dioreg_t);\nregt.reg\
    \ = reg;\nregt.val = val;\n/* send the request to the driver */\nif (reg == INTRS)\n\
    {\n    ioctl(diofd, DIOCTLWRITE, &reg);\n}\nelse\n{\n    ioctl(diofd, DIOOPORTWRITE,\
    \ &reg);\n}\n```\n\nListing 5-3\n\ndio_set and dio_get must distinguish which\
    \ ioctl to send the register access request. Recall there are two register spaces,\
    \ base address 1 and base address 2. Since the interrupt status register, INTRS,\
    \ is the only register that accesses PCI base address 1, if the specified register\
    \ is INTRS, the ioctl is sent to the control register in PCI base address 1; otherwise,\
    \ the ioctl is sent to the port write ioctl, which accesses PCI base address 2.\n\
    \n# Accessing the Digital IO Lines\n\nAccess to the digital IO lines is provided\
    \ by two functions, dio_set_line and dio_get_line. The PCI-DIO24 contains 24 digital\
    \ IO lines. To identify each line, a C enum is provided to represent each."
