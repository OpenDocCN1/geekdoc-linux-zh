    # State


    A process is in one of five states at any time. The process state is\used internally
    by the FreeBSD kernel to organize processes.

    Process states and their definitions are described below.


    | | Description |

    |---|---|

    | SIDL | Initial state of a process on creation while waiting for resources to
    be allocated |

    | SRUN | The process is ready to run |

    | SSLEEP | The process is suspended waiting for an event |

    | SSTOP | The process is being debugged or suspended |

    | SZOMB | The process has exited and is waiting to notify its parent. |


    # Signals


    Signals are mechanisms to notify a process that a system event has occurred. Every
    process contains a table that defines an associated action to handle a signal
    that is delivered to a process; at process creation, all signals contain a default
    action. A signal is handled in one of three ways: it is ignored, caught, or handled
    by the default action set by the kernel.


    A user can define a function that is invoked when a process receives a signal;
    this is called a signal handler. The signal handler is said to catch the signal.
    Signals are defined in /usr/include/sys/signal.h. It is important to note that
    two signals, SIGSTOP and SIGKILL, cannot be caught and will terminate a process.


    # The signal Function


    The signal function is used to specify a user-defined signal handler for a specific
    signal. The signal function is a wrapper for the sigaction system call.


    ```

    #include <signal.h>


    void (*sig_t) (int)

    sig_t signal(int sig, sig_t func);

    ```'
