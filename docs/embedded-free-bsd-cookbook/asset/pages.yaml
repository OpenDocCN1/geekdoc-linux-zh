- img_proc: true
  md: '# The CompactFlash Boot Device


    # Overview


    This chapter focuses on creating a boot device from a solid-state device, specifically,
    the SanDisk 32MB CompactFlash device. Solid-state devices provide increased stability
    due to the lack of moving parts. However, due to the limited disk space and write
    capacity, some basic system-level issues need to be addressed, such as limiting
    writes to the CompactFlash boot device, not using swap space, and running with
    memory file systems.


    Specific topics that will be covered in this chapter include


    +   - Solid-state devices

    - Installing and verifying the TARC CompactFlash Adapter

    - Configuring the CompactFlash device

    - CompactFlash system startup issues


    # Solid-state Devices


    A CompactFlash device is a nonvolatile solid-state device used for storage. To
    the FreeBSD kernel, a CompactFlash device appears as an IDE disk drive. An important
    consideration for using solid-state devices is that each sector has a limited
    write capacity. For this reason an embedded system typically uses the CompactFlash
    device to boot the system, and then the system executes out of a memory file system.
    Also, there is no swap partition configured on a CompactFlash device.'
  merge: -1
  pgno: 197
- img_proc: true
  md: '# Installing the TARC CompactFlash Adapter


    In order to use a CompactFlash device as a FreeBSD boot device, the DIO appliance
    must have a CompactFlash adapter. The Tucson Amateur Radio Club (TARC) distributes
    such an adapter. More information on this adapter can be found at http://www.tapr.org.
    TARC CompactFlash adapter allows any Type I or Type II CompactFlash device to
    be used as a standard IDE device.


    The TARC CompactFlash adapter uses an IDE connection, a standard 3.5" floppy driver
    connector and a CompactFlash device. During development, I chose to connect the
    CompactFlash adapter as the primary slave device, as this configuration allows
    a simple configuration and test setup. Once the development life cycle is complete,
    the CompactFlash boot adapter will be configured as the primary boot device.


    Before making any connections, be sure to shut down and power off your system.
    After the IDE connection is complete, connect the 3.5-inch power connector to
    the TARC CompactFlash adapter. Once the power and IDE connections are complete,
    install the CompactFlash memory into the TARC adapter.


    Once the physical installation is complete, we''ll verify that the CompactFlash
    has been installed and is working properly. Since the CompactFlash device appears
    as a standard IDE device, FreeBSD should recognize the device using a standard
    kernel. We can verify this by using the dmesg command and looking at the output
    of the probed devices during system startup.


    ```

    $ dmesg

    [selected output]

    ata0-master: DMA limited to UDMA33, non-ATA66 compliant cable

    ad0: 12419MB <<ST313021> [ 2532/16/63 ] at ata0-master UDMA33

    ad2: 30MB <SunDisk SDCFB-32> [ 490/4/32 ] at atal-master PIO1

    ac0: CDROM <CD-912E/ATK> at ata0-slave using PIO3

    ```


    Looking at the selected output, we can see the CompactFlash is detected and present
    at ad2. Now that we have successfully installed the CompactFlash adapter, we''ll
    look at configuring the device and loading our DIO appliance software.'
  merge: -1
