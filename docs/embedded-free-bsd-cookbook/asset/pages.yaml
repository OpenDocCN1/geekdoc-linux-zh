    # Skeleton Driver Source


    In developing a device driver, it''s common to start from a skeleton driver code
    base, a driver that is similar to the driver being written or a driver shell that
    implements the empty prototypes of common driver functions, and add features as
    needed. FreeBSD provides a shell script that generates a device driver, make_device_driver.sh
    in /usr/share/example/drivers. the shell script contains all the necessary driver
    data structures, stub driver callback functions and a KLD development environment.


    # NOTE


    > The make_device_driver.sh script contained in FreeBSD 4.4 only generates an
    ISA device driver. I obtained the current version of make_device_driver.sh using
    CVSUP, which generates both ISA and PCI drivers.


    CVSUP is a software package for distributing and updating collections of files
    across a network. All the necessary files and options are provided in the /usr/share/examples/drivers
    directory to update the make_device_driver.sh script.


    To generate the shell device driver, call make_device_driver.sh with the device
    name to be created. For this device, I''ve called it dio, for digital IO.


    ```

    # make_device_driver.sh dio

    ```


    The output of the make_device_driver.sh script is contained in three directories.
    The directories and their contents are summarized in Table 4-2.


    | Directory | Contents |

    | /sys/dev/dio | Contains the source code used for the driver, dio.c |

    | /usr/src/sys/sys | Contains the file dioio.h used to define driver ioctl codes
    |

    | /sys/modules/dio | Contains a complete KLD build environment |'
