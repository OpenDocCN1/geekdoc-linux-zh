  md: '# Chapter Two

    Systems Programming


    # File Descriptors


    File descriptor is a low-level interface used to access an IO interface. File
    descriptors are implemented as an int. Every process contains a list of open file
    descriptors. A child process inherits any file descriptors from the parent.


    # Permissions


    Every process contains a default set of file permissions called creation mode
    mask. The file creation mode mask is 9 bits that represent read, write and execute
    permissions for the file owner, file group, and everybody else. A processes creation
    mode mask is modified by the umask system call.


    # The umask System Call


    The file permission mask is typically set by the umask command in the user''s
    login shell. The file permission amsk can be modified by the umask system call.
    The umask system call sets the process creation mask to the value contained in
    umask.


    ```

    #include <sys/stat.h>

    mode_t umask(mode_t numask);

    ```


    The previous value of the file creation mask is returned to the caller.


    # Current Working Directory


    Every process contains a current working directory, which is the directory where
    the process was started.


    # The chdir System Call


    A process may change its current working directory by invoking the chdir system
    call. The argument contains the path to be used as the current working directory.


    ```

    #include <unistd.h>

    int chdir(const char *path);

    ```


    The chdir system call returns 0 on success and -1 on error.


    # Resources


    A process inherits the resource limits from its parent process. Resources may
    be read or modified by the setrlimit and getrlimit system calls.'
