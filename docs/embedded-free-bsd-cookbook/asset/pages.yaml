- img_proc: true
  md: 'The Java class files are used as input to another tool in the JDK, javah. Javah
    produces a header file for functions that were declared native in the Java class.
    The generated header file is used for inclusion in the C file that implements
    the native functions.


    Finally, once the Java object is completed, the native implementation is completed,
    and the code is compiled into class files and shared libraries located in the
    appropriate directories pointed to by the LD_LIBRARY_PATH and CLASSPATH environment,
    so it can be executed.


    ![](img/8be5cdcebf09c36e2285b8e096cda24a_147_0.png)


    # # Implementing C enums in Java


    Even though Java has borrowed heavily from C++ syntax, some features direction
    of the C++ language are not implemented in Java. One such feature is enums. Since
    the `dio_set_line`, `dio_get_line` and `dio_read_direction` functions all use,
    we are going to define corresponding types in Java.


    There have been a slightly different definitions of enums in the C language. Initially
    they were just integers with no type checking. In later definitions, they became
    proper types but with minimal type algebra. For clarity, I''ll define my intended
    use of enums, and we will proceed with the Java implementation. A language enum
    is a list of objects grouped together into a fixed set. Each of the objects within
    the list have a defined value.


    In Java, we can create the grouping using a class with a private constructor.
    By making the constructor private, the creation of class is restricted. Because
    we made a class with a private constructor, creation of new objects is limited
    to that class. We can now create the members of the enum within that class. Let''s
    take a look at the DIOLineState class.'
