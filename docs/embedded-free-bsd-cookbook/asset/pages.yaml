    \ the load handler function is defined in /usr/include/sys/module.h\n\n```\ntypedef\
    \ int (*modeventhand_t)(module_t mod, int\n/*modeventype_t/* what, void* arg);\n\
    ```\n\nThe load handler function takes three arguments: a module, the event and\
