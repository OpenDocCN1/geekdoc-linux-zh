    \ the system makefile in the /usr/share/mk directory; the rest of the details\
    \ are handled for you. Listed below is a sample make for a skeleton KLD.\n\n```\n\
    SRCS=kld_generic.c\nMOD=kld_generic\n```\n\n```\n.include <bsd.kmod.mk>\n```\n\
