  md: '# System Startup


    # Overview


    One of the most important aspects of an embedded system development is the system
    startup and boot process. There are numerous reasons for understanding-the booting
    and system startup process, such as adding the initialization of a custom component
    to the boot sequence, understanding what types of devices are bootable for system
    specification, or starting components or ensuring that components of the embedded
    system are started, as in the case of the DIO appliance. This chapter focuses
    on the FreeBSD booting process.


    First, a quick look at the PC booting process will provide the background for
    the three FreeBSD boot stages. After the discussion of the FreeBSD boot process,
    the chapter continues with a discussion of the FreeBSD booting stage components
    and system startup. Once the discussion of the boot process is complete, we''ll
    add code to start the DIO daemon and load the `copymem` system call and DIO device
    driver developed in previous chapters.


    # Disk Geometry


    The boot process for each different device is slightly different. The DIO appliance
    boot device consists of a CompactFlash card, which appears as a hard disk. Since
    our discussion assumes booting from a hard disk, it is tailored to that technique.
    Before we jump into a discussion of the boot process, it will help to understand
    the layout of the disk and where the pieces of loader reside on the disk.'
  merge: -1
  pgno: 183
- img_proc: true
  md: '# Platters


    A hard disk consists of flat round disks called platters. Each platter is coated
    with a special material designed to store information in the form of magnetic
    patterns. They are composed of two main substances: a substrate material that
    forms the bulk of the platter and gives it structure and rigidity, and a magnetic
    media coating that actually holds the magnetic impulses that represent the data.


    # Heads


    The read/write heads of the hard disk are the interface between the magnetic physical
    media on which the data is stored and the electronic components that make up the
    rest of the hard disk. The heads handle converting bits to magnetic pulses and
    storing them on the platters and reversing the process to read the data back.


    # Cylinders


    Platters are organized into specific structures to enable the organized storage
    and retrieval of data. Each platter contains information recorded in concentric
    circles called cylinders. A cylinder is similar in structure to the annual rings
    of a tree.


    # Sectors


    Each cylinder is further broken down into smaller pieces called sectors. Each
    sector holds 512 bytes of information.


    # Addressing


    Each sector on a disk is addressed using a format of head, cylinder and sector.
    For example, the first sector on a disk resides at head 0, cylinder 0, sector
    1.


    ![](img/8be5cdcebf09c36e2285b8e096cda24a_184_0.png)'
  merge: -1
  pgno: 184
- img_proc: true
  md: '# Master Boot Record


    In the first sector of a hardware disk is the Master Boot Record (MBR). The MBR
    is a special record that contains the information for loading the operating system.
    The MBR resides on the first sector of the hard disk, head 0, cylinder 0, sector
    1 and is one sector, 512 bytes. The MBR contains three components: the boot loader,
    partition table and a magic number. The boot loader contained in the MBR is the
    first piece of code executed by the BIOS.


    # Boot Loader


    The boot loader begins at offset 0 and 446 bytes long. The boot code reads the
    partition table, also contained in the MBR, and attempts to load the first sector
    of the active partition in the partition table. Only one partition can be active.


    # Partition Table


    | Offset | Content |

    |---|---|

    | 00H | Partition state: 00H if not active, 80H if active |

    | 01H | Head where partition begins |

    | 02H | Cylinder where partition begins |

    | 03H | Partition type |

    | 04H | Head where partition ends |

    | 05H | Sector where partition ends |

    | 06H | Cylinder where partition ends |

    | 07H | Distance from the MBR to the first sector of the partition, in sectors
    |

    | 0CH | Length of the partition, in sectors |


    Beginning at offset 1BEH is the partition table. The partition table contains
    four entries of 16 bytes each that describe how the disk is partitioned. The partition
    table entries begin at 1BEH, 1CEH, 1DEH and 1EEH in the MBR.


    Each entry contains information about the partition such as beginning and ending
    position on the disk, what type of partition, and length in sectors. A description
    of each partition entry is contained in Table 11-1.


    Table 11-1


    The partition table contains up to four distinct sections of the disk; partitions
    may not overlap. A common use of partitions is to configure a computer to boot
    multiple operating systems. Each partition may have a different operating system
    loaded.'
