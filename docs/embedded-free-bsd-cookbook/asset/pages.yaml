    # Priority


    Execution time is made available to a process according to its process priority.
    Priorities range from 0 through 127. Process priorities are defined in /usr/include/sys/param.h.
    The lower the process priority, the more favorable scheduling priority it receives.


    # The getpriority and setpriority System Calls


    A process priority may be read and modified using the setpriority and getpriority
    system calls.


