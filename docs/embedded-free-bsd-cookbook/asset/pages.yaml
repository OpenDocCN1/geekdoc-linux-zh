  md: '# Systems Programming


    # Overview


    Fundamental to any programming task in FreeBSD is the process, which is an executing
    program. It could be a network file system (NFS) daemon serving files, a gcc compile
    or a shell displaying the date—all these tasks are performed in the context context
    of a process. An understanding of processes is critical for grasping concepts
    presented in later chapters. This chapter introduces systems programming using
    processes.


    Many system services are provided by a special type of process known as a daemon
    process. As part of our discussion of processes, we will look at the characteristics
    of a daemon process and develop skeleton source code for a daemon. In this chapter
    we will cover topics including


    +   - A FreeBSD process

    - Process creation and termination

    - Process attributes

    - Daemon processes


    # Process


    A running program is an instance of a process. One of the numerous features provided
    by a FreeBSD kernel is a protected environment called User Mode. In User Mode,
    a process cannot access hardware or protected system variables. If a process attempts
    to access protected memory, the process is terminated. A process running in memory
    consists of five segments: text, initialized data, uninitialized data, stack and
    heap.'
  merge: -1
  pgno: 12
- img_proc: true
  md: 'Text is typically read only and contains the machine instructions for the program.
    Initialized data contains variables that are preinitialized by the program text.
    Uninitialized data (traditionally called bss) data that is not initialized. The
    stack is used to pass parameters between functions and to contain local variables
    and function return addresses. The heap is an operating-system-provided area used
    for dynamic memory allocation.


    ![](img/8be5cdcebf09c36e2285b8e096cda24a_13_0.png)


    We can look at the size of a program''s sections, invoking the size command. Output
    of the size command for the `hostname` is in Listing 2-1.


    Figure 2-1. Process Running in Memory


    | size hostname | data | bss | dec | hex |

    |---|---|---|---|---||

    | 39452 | 4020 | 1968 | 45440 | b1b80 |


    Listing 2-1


    The output shows the text size as 39452 bytes, the data section as 4020 bytes
    and bss size of 1968 bytes. Stack and heap are assigned by the operating system
    for each process. The text and data sections contain data. Since the bss section
    is uninitialized, the image only contains its size; b memory is set to zeros by
    the operating system when the program is loaded.


    # Process Creation


    When a process is created a complete copy of the original process, known as the
    parent, is created. The newly created process is called the child. Once process
    creation is completed, the child process is scheduled to execute. This yields
    two running instances of the same program. The processes can only be differentiated
    by the process identifier.


    # The fork System Call


    A new process is created when a running process invokes the `fork` system call.
    The `fork` system call is the only way to create a new process.'
