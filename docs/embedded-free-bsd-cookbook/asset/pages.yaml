  md: '# Installing Tomcat


    The version of Tomcat installed on my system is Tomcat 3.2.3.


    ```

    # cd /usr/ports/www/jakarta-tomcat

    # make

    # make install

    # make clean

    ```


    These instructions may be used to update, build, and install any of the FreeBSD
    port packages. The make command retrieves and builds the latest version of the
    specific port. The next step, make install, installs the binaries on your system.
    After the port is updated, and installed, it''s a good idea to clean the binaries
    and temporary build files so disk space isn''t exhausted; make clean handles the
    details of cleaning up the build files.


    # The TOMCAT_HOME Environment Variable


    Once the Tomcat port has been compiled and installed, the environment should be
    set up. This consists of setting the TOMCAT_HOME environment. The correct value
    of TOMCAT_HOME is the directory in which Tomcat is installed. On my system this
    is /usr/local/tomcat.


    # Starting and Stopping Tomcat


    bin


    As part of the Tomcat port installation, a script, tomcat.sh, is installed in
    the /usr/local/etc/rc.d directory. This script is responsible for starting Tomcat
    at system boot time. Once Tomcat is installed, you can restart your system and
    verify that it is working properly by starting your browser and pointing to it
    the url,


    ```

    http://localhost:8080

    ```


    You should see the Tomcat main page in your browser.'
