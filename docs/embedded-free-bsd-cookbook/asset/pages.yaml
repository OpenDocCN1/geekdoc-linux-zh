  md: '/dev/ad2sla / 30MB UFS


    Once this is complete, write it out to the CompactFlash device. You may exit the
    sysinstall utility. Typically a FreeBSD installation uses multiple partitions,
    such as root and swap and var. However, since the DIO appliance does not use swap
    or the var filesystem, those partitions are not necessary.


    # Formatting the File System


    The CompactFlash is now ready for prime time. The next step is to format the file
    system, accomplished using the newfs command.


    ```

    # newfs /dev/ad2sla

    Warning: 2848 sectors in in last cylinder unallocated

    /dev/ad2sla: 62688 sectors in 16 cylinders of 1 tracks, 4096 sectors

    30.6MB in 1 cyl groups (16 c/g, 32.0MB/g, 7616 i/g)

    super-block backups (for fsck -b #) at:

    32

    ```


    Upon completion of the newfs command, the CompactFlash device can be mounted.
    Once the mount is completed, files can be copied and the system boot testing begin.


    # Mounting the File System


    With the CompactFlash partitioned and file system formatted, the CompactFlash
    can now be mounted. Mounting the device is accomplished using the mount command.


    ```

    # mount /dev/ad2sla /flash

    ```


    After mounting the device, we can verify that it is properly mounted displaying
    the file system using the df command.


    ```

    # df /flash

    Filesystem 1K-blocks Used Avail Capacity Mounted on

    /dev/ad2sla 30359 1 27930 0% /flash

    ```


    Using the output of df we can see that the CompactFlash device, /dev/ad2sla, is
    mounted on /flash and contains just under 30 MB of disk capacity.'
