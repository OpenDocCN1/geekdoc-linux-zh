    \ ${sshd_program:-/usr/sbin/sshd} ${sshd_flags}\nfi\nesac\n```\n\nOnce the system\
    \ boots, it is ready to accept SSH connections.\n\n# Configuring SSH\n\nThe standard\
    \ file used to configure SSH is /etc/ssh/sshd_config. The sshd_config file is\
    \ a simple configuration file, containing the file format with \"ValueName Value\"\
    \ pairs using a simple space as a separator. A copy of a default sshd_config is\
    \ contained in Listing 7-1."
