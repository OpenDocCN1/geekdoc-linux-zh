    \ This file is not executing as a script; it is included by other files to conditionalize\
    \ system startup.\n\nThe rc script is a command script used to control reboots;\
    \ rc reads the contents of the rc.conf script to determine the custom components\
    \ for starting the system. A closer look at the rc script shows how the re.conf\
