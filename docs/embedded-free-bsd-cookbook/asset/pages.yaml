  md: '# System Calls


    # Overview


    As mentioned in the previous chapter, the FreeBSD kernel provides an execution
    environment for a process called User Mode. A process executing in User Mode cannot
    directly access kernel memory, kernel data structures or hardware. Access to kernel
    memory and hardware resources is restricted to the FreeBSD kernel, which executes
    in a privileged mode of the underlying processor FreeBSD provides a detailed interface
    for a user process to obtain basic services from the kernel known as system calls.


    The benefit of restricting certain tasks to the kernel is twofold. First, it relieves
    a system engineer from the details of programming device hardware. Second, by
    providing and enforcing a detailed interface to the system call interface, the
    kernel can ensure that the parameters passed by a user program are correct and
    will not cause a system crash. The added protection in the kernel provides a stable
    run-time environment for applications.


    In this chapter we will discuss the details of FreeBSD system calls. After our
    discussion of system calls is complete, we will implement a system call that reads
    and writes kernel memory along with an application that provides simple debugging
    capabilities.


    # Library Functions and System Calls


    The Standard C Library provides an API consisting of header files and libraries
    that contain implementations of many commonly needed functions and IO routines.
    The Standard C library is implemented as both library functions and system calls.'
  merge: -1
