- img_proc: true
  md: '# Autoconfiguration


    The autoconfiguration code detects the hardware at load time and is responsible
    for allocating hardware resources during load, deallocating hardware resources
    on unload, and putting hardware in a consistent state in response to power management
    events. The auto configuration code typically is used at load and unload time.


    ![](img/8be5cdcebf09c36e2285b8e096cda24a_52_0.png)


    Autoconfiguration is the procedure carried out by the FreeBSD kernel that dynamically
    finds and enables hardware. The kernel probes for system buses and, for each bus
    that is found, devices are attached, initialized, and configured. During autoconfiguration,
    a device probe routine is called. Probe is responsible for detecting the hardware
    to determine if any other devices are attached. Once a device is successfully
    probed the FreeBSD kernel must attach to it. The attached function initializes
    the device hardware and any software state.


    # The Device Switch Table


    The device switch table consists of a set of routines that comprise the upper
    and lower halves of the device driver. The upper half provides the system implementation
    for the device driver such as read, write, open, ioctl and close. Upper half functions
    execute synchronously with a user process and are preemptible, permitted to block.
    The lower half routines interface with the device registers and implement the
    hardware interrupt service routine. Lower half routines are not preemptible and
    cannot block.'
  merge: -1
  pgno: 52
- img_proc: true
  md: 'A typical device driver accepts requests from the upper half, and then enqueues
    the request to be handled by the lower half. Each request is enqueued in a common
    data structure shared by the upper and lower halves. Because the upper and lower
    halves of a device driver run independently; it is critical that access to any
    data shared by the upper and lower halves of a device driver is properly synchronized.


    # KLDs Revisited


    As with the system called in Chapter 3, FreeBSD provides support for dynamically
    loadable device drivers. In addition to the typical device driver data structures
    required by a FreeBSD device driver, KLD framework data structures for dynamic
    load and unload features for the DIO device driver are described and implemented.


    # Driver Structure


    A FreeBSD driver consists of various entry points into driver functions or methods
    that the FreeBSD I/O subsystem calls when it wants the driver to perform a specific
    function. Two structures are provided for FreeBSD device driver writers to implement
    the driver functions. `device_method_t` is the structure used for auto configuration
    functions and `cdevsw` is used for system calls and interrupts. The following
    sections discuss the more function callbacks and the conditions that cause the
    functions to be called.


    | device_method_t | cdevsw |

    |--- |--- |

    | probe | open |

    | attach | close |

    | detach | read |

    | shutdown | write |

    | suspend | ioctl |

    | : | : |


