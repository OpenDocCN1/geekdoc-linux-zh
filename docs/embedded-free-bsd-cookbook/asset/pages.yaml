  md: '# Embedded FreeBSD Cookbook


    Every process has a parent process. When a process is created, the parent process
    ID is assigned so it can return the termination status.


    # Security


    A process is assigned two users on creation, the real user and the effective user.


    # User ID and Group ID


    Every process has a user identifier, UID, and a group identifier, GID. The UID
    and GID of a process are the username and group of the user that invoked the program.
    UIDs are mapped to user names in `/etc/passwd`. GIDs are mapped to group names
    in `/etc/group`. A process can retrieve its user ID and group ID by calling the
    `getuid` and `getgid` system calls.


    # The getuid and getgid System Calls


    The `getuid` and `getgid` system calls return the UID and GID for the running
    process. Both system calls always succeed.


    ```

    #include <unistd.h>

    #include <sys/types.h>


    uid_t getuid(void);

    uid_t getgid(void);

    ```


    # Effective User ID and Effective Group ID


    When a process is created, it is assigned an effective user ID and an effective
    group ID. Under most circumstances, the effective ID and the real ID are the same.
    It is possible for a program to be configured so that it executes as a different
    user or group. For example, the `passwd` utility needs root access so it can edit
    the `/etc/passwd` file. The `passwd` utility is configured so it executes with
