  md: "# 37 Chapter Three\nSystem Calls\n\n```\nstatic int32_t syscall_num = NO_SYSCALL;\n\
    ```\n\nWhen the KLD system call is loaded into the kernel, systent entry\ncopymem_sysent\
    \ is assigned to the first open index in the kernel global\nsysent structure.\
    \ The index into the syst array is the system call number.\n\nThe specifics of\
    \ installing a new system call are found in the\nsyscall_register function listed\
    \ in /sys/kern/kern_syscalls.c.\nListing 3-9 contains the syscall_register function.\n\
    \n```\nint\nsyscall_register(int *offset, struct systent *new_systent,\n     \
    \          struct systent *old_systent)\n{\n    if (*offset == NO_SYSCALL) {\n\
    \        int i;\n\n        for (i = 1; i < SYS_MAXSYSCALL; ++i)\n            if\
    \ (systent[i].sys_call == (sys_call_t\n                *)lkmnosys)\n         \
