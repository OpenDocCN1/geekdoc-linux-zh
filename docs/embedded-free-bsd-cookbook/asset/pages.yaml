    ssh_config file options are described in the following sections.


    # Port 22


    The Port option specifies the port number ssh daemon listens to incoming connections.


    # ListenAddress 192.168.1.1


    The ListenAddress option specifies the IP address of the interface on which ssh
    daemon server socket binds. The default is 0.0.0.0.


    # HostKey /etc/ssh/ssh_host_key


    The HostKey option specifies the location containing the private host key.


    # ServerKeyBits 1024


    The ServerKeyBits options specifies how many bits to use in the server key. These
    bits are used to generate its RSA key when the daemon starts.'
