    Distance from MBR

    The next four bytes represent the LBA of the partition. The LBA is the sector
    offset from the beginning of the disk to the beginning of the partition.


    Length

    The last four bytes contain the size of partition in sectors.


    Magic Number

    The magic number is AA55H and is located at offset 1FEH. Whenever the MBR is read,
    the magic number is read to make sure the sector contains values AA55H.


