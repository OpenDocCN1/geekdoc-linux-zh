  md: "89 Chapter Five\nMidlevel Interface Library\n\n# ### The dioline_t enum\n\n\
    The `enum` data type is used repeatedly throughout the digital IO library. By\
    \ defining enums, we force the compiler to enforce type safety to our functions,\
    \ which comes in handy during debugging. Listing 5-4 shows the dioline_t enum.\n\
    \n```\ntypedef enum dioline_t {\n    line0 = 0,\n    line1 = 1,\n    line2 = 2,\n\
    \    line3 = 3,\n    line4 = 4,\n    line5 = 5,\n    line6 = 6,\n    line7 = 7,\n\
    \    line8 = 8,\n    line9 = 9,\n    line10 = 10,\n    line11 = 11,\n    line12\
    \ = 12,\n    line13 = 13,\n    line14 = 14,\n    line15 = 15,\n    line16 = 16,\n\
    \    line17 = 17,\n    line18 = 18,\n    line19 = 19,\n    line20 = 20,\n    line21\
    \ = 21,\n    line22 = 22,\n    line23 = 23,\n    totelines\n} dioline_t;\n```\n\
    \nListing 5-4\n\nThe dioline_t enum provides us with a convenient type, and since\
    \ the first argument to `dio_set_line` and `dio_get_line` is `dioline_t`, this\
    \ will force the compiler to do parameter type checking. Additionally, if the\
    \ underlying hardware is changed and the line values needs to be modified, the\
    \ source code changes are limited to the header file and a recompile of the remaining\
    \ code base."
