  md: "# System Startup\n\nAfter the kernel is loaded and the system starts up, the\
    \ kernel creates a user daemon to complete initialization call init, which is\
    \ PID 1.\n\n# init\n\nOnce the kernel is loaded, control is passed to the init\
    \ daemon. The init daemon is responsible for transitioning through the different\
    \ user-mode levels and starting resources, file systems, networking daemons and\
    \ configuration. Init is responsible for making sure the file systems are consistent\
    \ and starting system daemons and initializing terminals for user login based\
    \ on the resource configuration files.\n\nThe resource configuration files are\
    \ executed by a main Bourne Shell script, /etc/rc. The rc reads a series of files\
    \ that contain system configuration code. The rc file doesn't need modifications;\
    \ its behavior can be changed by setting and clearing variables in the /etc/rc.conf\
    \ and /etc/defaults/rc.conf files. Let's take a closer look at the compo of the\
    \ rc file that are relevant to the DIO appliance.\n\n# Configuration\n\nOne of\
    \ the first tasks of the init daemon is to read two files that contain global\
    \ configuration files for the system that enable and disable systems started by\
    \ init. The first file /etc/defaults/rc.conf is a global configuration file and\
    \ should not be changed. The second file /etc/rc.conf is a system-tuneable file.\
    \ Variables may be set in /etc/rc.conf to override the values in /etc/defaults/rc.conf.\n\
    \n```\n# If there is a global system configuration file, suck it in.\nif [ -r\
    \ /etc/defaults/rc.conf ]; then\n  /etc/defaults/rc.conf\n  source _rc_conf\n\
    elif [ -r /etc/rc.conf ]; then\n  /etc/rc.conf\nfi\n```\n\nWe see the rc file\
    \ checks for the existence of the rc.conf files. If they exist, they are read."
