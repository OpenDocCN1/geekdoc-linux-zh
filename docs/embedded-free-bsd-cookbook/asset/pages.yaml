  md: '# PCI Configuration


    This chapter provides a description of the PCI bus and the PCI configuration registers.
    The PCI-DIO24 Digital I/O card is a PCI bus data acquisition controller. In order
    for the FreeBSD DIO device driver to correctly detect the presence of the PCI-DIO24
    controller, the device driver must read the PCI configuration registers. Access
    to the PCI configuration registers are conveniently hidden from the FreeBSD device
    driver writer though the use of the PCI kernel subsystem.


    # The PCI Bus


    PCI is an acronym for Peripheral Component Interconnect. The PCI bus specification
    defines a system interconnect for computer components that require fast access
    to each other and/or system memory. A typical PCI device consists of a PCI interface
    controller on a PCI expansion card. Examples of PCI expansion cards are network
    controllers, display adapters, SCSI controllers and Fibre Channel host bus adapters.
    One benefit of the PCI specification is its vendor and platform independence.
    PCI buses are found in Intel, Apple and Sun computers.


    The PCI Bus specification is managed by the PCI Special Interest Group (PCI-SIG).
    For information regarding the PCI Specification contact:


    PCI Special Interest Group (PCI-SIG)

    5440 SW Westgate Dr., #217

    Portland, OR 97221

    Phone: 503-291-2569

    FAX: 503-297-1090

    administration@pcisig.com'
  merge: -1
  pgno: 208
- img_proc: true
  md: '# PCI Configuration Registers


    This section provides a description of the PCI device configuration header and
    PCI configuration registers. Any functional PCI device device contains a block
    of 64 double words called the PCI configuration header. The first 16 double words
    are defined by the PCI specification and are known as the configuration header
    region.


    The PCI configuration header region can be in two formats known as type 0 or type
    1. Header type 1 is used for PCI-to-PCI bridges. Header type 0 is for all other
    devices. Figure B-1 illustrates the format of type 0 PCI device registers.


    | Offset | Byte3 | Byte2 | Byte1 | Byte0 |

    |---|---|---|---||}{

    | 0 | | Device ID | | Vendor ID |

    | 4 | | Status Register | Command Register |

    | 8 | | Class Code | | Revision ID |

    | 12 | BIST | Header Type | Latency Timer | Cache Line Size |

    | 16 | | Base Address 0 | | |

    | 20 | | Base Address 1 | | |

    | 24 | | Base Address 2 | | |

    | 28 | | Base Address 3 | | |

    | 32 | | Base Address 4 | | |

    | 36 | | Base Address 5 | | |

    | 40 | | Card CIS Pointer | | |

    | 44 | Subsystem ID | | Subsystem Vendor ID |

    | 48 | | Expansion ROM Base Address | | |

    | 54 | | Reserved | | |

    | 56 | | Reserved | | |

    | 60 | Max Latency | Min Grant | Interrupt Pin | Interrupt Line |


    Figure B-1. PCI Configuration Header'
  merge: -1
  pgno: 209
- img_proc: true
  md: 'The subsequent sections describe each mandatory PCI configuration register
    that is implemented by all PCI devices. The most notable for device driver writers
    are the vendor ID and device ID registers. These registers are used to determine
    if the physical device is installed in the system.


    # Vendor ID Register


    The Vendor ID Register is a 16-bit register that contains a unique value identifying
    the device manufacturer. Every PCI manufacturer registers with the PCI SIG to
    obtain a unique Vendor ID. The Measurement Computing Vendor ID is hexadecimal
    1307.


    # Device ID Register


    The Device ID register is a 16-bit register that contains a unique value, defined
    by the manufacturer, for this PCI device. The PCI-DIO24 Device ID is hexadecimal
    28.


    # Command Register


    The command register is a 16-bit register that provides control over the device''s
    ability to respond to PCI accesses. Currently only bits 0:9 are defined. Each
    of the defined bits represents a capability. The PCI designer sets the bits that
    are implemented by the device. The bits are defined as follows:


    | Bit | Function |

    | 0 | IO Access Enable |

    | 1 | Memory Access Enable |

    | 2 | Master Enable |

    | 3 | Special Cycle Recognition |

    | 4 | Memory Write and Invalidate Enable |

    | 5 | VGA Palette Snoop Enable |

    | 6 | Parity Error Response |

    | 7 | Wait Cycle Enable |

    | 8 | System Error Enable |

    | 9 | Fast Back-to-Back Enable |

    | 10:15 | Reserved |'
  merge: -1
  pgno: 210
- img_proc: true
  md: '# Status Register


    The Status Register is a 16-bit register that provides the device status.

    The bits are defined in the status register as follows:


    | Bit | Function |

    | 0:4 | Reserved |

    | 5 | 66 MHz Capable |

    | 6 | UDF Supported |

    | 7 | Fast Back-to-Back Capable |

    | 8 | Data Parity Reported |

    | 9:10 | Device Select |

    | 11 | Signaled Target Abort |

    | 12 | Received Target Abort |

    | 13 | Received Master Abort |

    | 14 | Signaled System Error |

    | 15 | Detected Parity Error |


    # Revision ID


    The revision ID register contains an 8-bit value assigned by the manufacturer
    that contains the device revision number.


    # Class Code


    The class code register is a 24-bit register that defines the base class, sub-class
    and programming interface.


    | 0:7 | 8:15 | 16:23 |

    | Programming interface | Sub-Class Code | Class Code |


    The class code, sub-class code and programming interface are defined by the PCI
    Interface specification.


    # Cache Line Size


    The cache line size register is an 8-bit register that defines the system cache
    line size in double word increments.'
  merge: -1
  pgno: 211
- img_proc: true
  md: '# Latency Timer


    The latency time is an 8-bit register that defines the minimum amount of time,
    in PCI clock cycles, that the bus master can retain ownership of the bus.


    # Header Type


    The header type register is an 8-bit register that defines the type of device.
    Bit 7 is set to 0 or 1, defining single function or multi function.


    # BIST


    The BIST register is an 8-bit register that can be used for PCI devices that implement
    Built In Self Test (BIST).


    # Base Address Registers


    The base address registers are 32-bit registers used to determine the PCI memory
    mapped and IO spaces used by the device. A PCI device may have up to 6 base address
    registers that are used to utilize memory mapped or IO address space.


    # CardBus CIS Pointer


    The CardBus CIS Pointer Register is a 32-bit register implemented by devices that
    share silicon between the cardbus and PCI bus.


    # Subsystem Vendor ID


    The subsystem vendor ID is a 16-bit register used to uniquely identify an add-in
    card. The subsystem vendor ID is obtained from the PCI-SIG.


    # Subsystem ID


    The subsystem ID is a 16-bit register used to define additional features for a
    PCI device. The subsystem ID is defined by the vendor.


    # Expansion ROM Address


    For devices that contain power-on self test (POST) code, BIOS and interrupt service
    routines, the Expansion ROM address register is a 32-bit register that contains
    the starting address and size of the ROM code.'
  merge: -1
  pgno: 212
- img_proc: true
  md: '# Maximum Latency


    The maximum latency register is an 8-bit register that specifies how often the
    device needs to access the PCI bus.


    # Minimum Grant


    The minimum grant register is an 8-bit register that defines how long the master
    would like to retain PCI bus ownership whenever it initiates an action.


    # Interrupt PIN


    The interrupt pin register is an 8-bit register that defines which of the 4 PCI
    interrupt request pins the PCI device is connected to.


    # Interrupt Line


    The interrupt line register is an 8-bit register used to identify which of the
    system interrupt lines on the system interrupt controller the PCI device interrupt
    is routed on.'
  merge: -1
  pgno: 213
- img_proc: true
  md: '# Kernel Loadable Modules


    # Overview


    One of the features of FreeBSD is a dynamic kernel linker that provides system
    engineers and system administrators with the capability to load and unload system
    calls in a running system. This appendix provides the necessary background information
    for writing kernel loadable modules (KLDs). In addition to covering the details
    of the different types of FreeBSD KLDs, at the completion of this appendix you
    will have skeleton code that can be used for your own KLDs.


    In this chapter we will cover


    +   - The core components of a KLD

    - System calls as KLD

    - Device drivers as KLD

    - KLD commands


    # Kernel Loadable Modules


    Every KLD contains three core components: the Makefile, which provides a simple
    environment to build a KLD and provides the developer with a rapid prototype and
    build environment; the load handler function, which provides the entry points
    for the load, unload and system shutdown behavior for the KLD and the module data
    structure; and the module data structure, which contains the name and entry point
    of the load function.


    When a new KLD is loaded into a running system, dynamic load execution of the
    KLD starts based on the entry point in the module data structure.'
  merge: -1
  pgno: 214
