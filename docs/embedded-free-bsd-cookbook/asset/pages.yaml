  md: "# The diolinestate_t enum\n\nAs with the line number type, there is a line\
    \ state enum, diolinestate_t, which defines all the possible states for the digital\
    \ IO line. Since the PCI-DIO24 provides only digital IO lines, the states are\
    \ either set or clear, notifying the active high state and clear signifying an\
    \ active low state.\n\n```\ntypedef enum diolinestate_t\n{\n  clear = 0,\n  set\
    \ = 1\n} diolinestate_t;\n```\n\nListing 5-5\n\n# The dio_set_line and dio_get_line\
    \ Functions\n\nReading and writing the digital IO lines are performed by the dio_set_line\
