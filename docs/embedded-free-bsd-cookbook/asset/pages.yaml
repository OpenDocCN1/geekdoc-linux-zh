  md: '# 162 Embedded FreeBSD Cookbook


    The language attribute is used to specify the scripting language. Although JSP
    is able to use multiple scripting languages, Tomcat only supports Java. Subsequently,
    Java is the default language, but it is set in the page directive for the sake
    of clarity.


    Finally, the contentType attribute is used to specify the type of content produced
    by the JSP page. Once again looking at Listing 9-1, the output is html, the most
    common type of page. Other types of pages are text/plain, text/xml for applications,
    and so forth forth.


    # Declarations


    The next type of JSP statement is a declaration statement. The declaration statement
    is denoted by the <%! %> tags. A declaration allows the programmer to define page
    level variables for storing information that a page may need.


    ```

    <% int jspvar = 27; %>

    ```


    # Expressions


    JSP expressions are used to evaluate expressions and convert the result into text
    for display in the output page. JSP expressions use the <%= %> tags.


    # Code Scriptlets


    Scriptlets, denoted by the <% %> tags, are used to run Java code when the page
    is serviced by the Web server. In Listing 9-1, we used a JSP scriptlet to write
    Hello DIO! to the output page.


    ```

    <% out.println("Hello DIO\n"); %>

    ```


