  md: '# Generate the Class Files


    With the initial Java class defined, the class needs to be compiled using the
    Java compiler, jacavac. The output of the Java compiler, the Java class file,
    is necessary for the next step, we''ll be unable to proceed without compiling.
    The Java class is compiled using the following command:


    ```

    # javac DIOfJNI.java

    ```


    The output of this command will be the DIOfJNI.class. The byte codes output from
    the Java compiler represent the implementation of the DIOfJNI class. When working
    with native methods, the bytecodes are also used to generate a header file for
    the native class to be developed. We''ll learn more about this in the next step
    of developing the JNI layer.


    # Generate the Header Files


    The Java class file is used as input for the javah tool. The javah tool uses the
    java.class file and generates ANSI function prototypes for the defined native
    member functions. It is important that the class files reside in a directory contained
    in the CLSPATH environment variable.


    ```

    # javah -jni DIOfJNI

    ```


    -jni option in the example tells javah to generate a JNI function prototype header.
    The output of the javah tool is the file DIOfJNI.H; Listing 8-6 contains the complete
