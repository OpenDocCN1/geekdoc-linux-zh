    # Summary


    In this chapter, we''ve taken a close look at installing the JDK for Java and
    JNI development, along with setting up an environment for development and debugging.
    After setting up the JDK development environment, we''ve developed a JNI interface
    that supports an interface to a few of the basic functions implemented in the
    DIO interface library, through the implementation of the DIOJNI object. With the
    implementation of the set line, get line, and get direction functions as a foundation,
    you could implement the remainder to DIO interface class in the JNI layer.


