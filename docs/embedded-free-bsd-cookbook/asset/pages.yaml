    # Starting Clean


    It''s always a good idea to start with a clean build and remove stale object files.
    We''ll clean any object files created in a prior build. Cleaning the build directory
    will cause the kernel build time to increase, but it''s better to start with a
    fresh set of object files, in case there is a problem with the new kernel. You
    can eliminate the possibility of building with stale files.


    Cleaning object files consists of running the make clean command in the kernel
    build directory.


    +   - make clean


    Running make clean will display lots of output. It''s ok, as it''s cleaning up
    object files and dependency files for the kernel.


    # Generating Dependencies


    The kernel is a complex program make needs to generate dependencies. Config has
    done most of the work for you already away and stored the method for generating
    dependencies in the make file. Running make depend in the kernel build directory
    generates the dependencies.


    +   - make depend


    Running make depend will also generate lots of output.'
