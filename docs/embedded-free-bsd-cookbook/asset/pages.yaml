- img_proc: true
  md: '# Daemons


    # Overview


    A feature of Internet appliances is that they can be monitored and configured
    via the Internet. This chapter begins a series of chapters that focuses on implementing
    Internet access to the DIO appliance through Internet interfaces and protocols,
    such as sockets, SSL, and Java Server Pages. This chapter shows how to implement
    a socket-based daemon and a custom protocol used by remote clients to communicate
    with the DIO appliance. Topics covered include:


    +   - introduction to TCP/IP

    - sockets

    - digital IO protocol

    - DIOD server daemon


    # Introduction to TCP/IP


    TCP/IP is a protocol used by computers to exchange information over a network.
    TCP/IP development was funded by the Department of Defense (DoD) in the 1970s,
    in order to provide a method to share research information for the DoD. Since
    that time, TCP/IP has grown to become the major protocol of the Internet. One
    of the major benefits of TCP/IP is that it provides a defined method for a heterogeneous
    system to exchange information.


    Before jumping into the details of TCP/IP, let''s look at a few definitions and
    background information. Each computer, or endpoint, connected to a network is
    referred to as a host. The TCP/IP protocol defines the set of rules for'
  merge: -1
  pgno: 104
- img_proc: true
  md: 'the process of transferring data between hosts. Because of the complexity of
    the protocol, it is defined in layers. TCP/IP consists of four layers, each responsible
    for a different aspect of the communication and its own protocol. These combined
    layers are commonly referred to as the TCP/IP stack.


    | Application Layer |

    | Transport Layer |

    | Network Layer |

    | Link Layer |


    Figure 6-1. TCP/IP Stack


    # # TCP/IP Stack


    Each layer on the transmitting host has a peer-to-peer relationship with the receiving
    host. Every layer is responsible for a specific aspect of communication, as physical
    transfer of data, addressing, routing, flow control, and data organization/reorganization.


    | Application |

    | Transport |

    | Network |

    | Link |


    ![](img/8be5cdcebf09c36e2285b8e096cda24a_105_0.png)


    Figure 6-2. Peer-to-Peer Relationship


    The following sections describe each of the four TCP/IP layers in more detail.


    # # Link Layer


    At the bottom of the TCP/IP stack is the Link Layer. It handles the physical aspects
    of data transfer and provides a reliable, error-free transmissions medium. The
    link layer is comprised of hardware and software represented by the network interface
    controller (NIC) and the device driver in the operating system. Each NIC is independently
    addressable, using a unique hardware-address.


    There are numerous hardware implementations of the Link Layer, which include,
    but are not limited to, Ethernet, token ring, FDDI, and serial lines. Each different
    hardware implementation uses an independent addressing scheme. The Link Layer
    provides an independent mechanism to send higher layer protocol data and to resolve
    higher layer protocol addresses.'
  merge: -1
  pgno: 105
- img_proc: true
  md: '# Network Layer


    The network layer of the TCP/IP stack is implemented using the Internet Protocol
    (IP). IP is a connectionless, unreliable protocol. It is connectionless because
    there is no state information maintained for successive packets and unreliable,
    because there is no guarantee that a packet arrives at its destination. The purpose
    of the IP layer is to provide a constant addressing scheme for sending and receiving
    data packets and a mechanism to map between IP addressing and the underlying Link
    Layer addressing.


    In the previous section, we mentioned that the Link Layer consists of a variety
    of different hardware addressing schemes. The IP protocol defines a consistent
    addressing method, the IP address, and protocols to map IP addresses to the underlying
    hardware addresses. These protocols are known as Address Resolution Protocol (ARP),
    Reverse Address Resolution Protocol (RARP), and Internet Control Message Protocol
    (ICMP).


    # IP Addressing


    An IP address is a unique 32-bit number used for addressing IP packets. An IP
    address is written as four octets—i.e., 192.10.0.1.


    There are five different classes of IP addresses: Class A, Class B, Class C, Class
    D, and Class E. Each class is distinguished by the upper bits of the IP address.


    The different classes are used to distribute different numbers of bits between
    the network ID and the host ID.


    Three classes of addresses are used by the IP layer: unicast, multicast, and broadcast.
    Unicast addresses are destined for a single host. Multicast addresses are destined
    for a specific group of hosts. Broadcast addresses are destined for all hosts
    on a given network.


    # ARP


    ARP is the mechanism that maps the Link Layer hardware address to the host IP
    address. When a packet is being sent to another IP address, the'
  merge: -1
  pgno: 106
- img_proc: true
  md: 'mapping between the IP address and the hardware address must be resolved.

    The ARP protocol sends a broadcast request to the network with the destination
    IP address. Each host receives the packet and checks to see if the request IP
    address matches its own IP address. If the IP address does not match, the packet
    is ignored. If the IP address does match, the host responds to its IP address
    and hardware address.


    # RARP


    RARP is the protocol used by a diskless host to determine its IP address.

    When a host boots, it typically reads its IP address from a configuration file
    contained on the host''s local disk. If the host booting is diskless, it will
    send a RARP request to the network, asking for someone to reply with its IP address.


    # ICMP


    ICMP is used to communicate error messages and special conditions. ICMP messages
    may be acted upon by either the IP layer or upper layers of the TCP/IP protocol.


    # Transport Layer


    The transport layer provides the method for addressing network data to a specific
    application. The TCP/IP stack contains two protocols for sending packets, Transmission
    Control Protocol (TCP) and User Datagram Protocol (UDP). Regardless of which protocol
    being used, TCP or UDP, both the client and server machines must agree on the
    address, or port, to transfer data.


    # Ports


    The main mechanism to address network data to a specific application is a port.
    A port is a 16-bit integer. Reserved ports are listed in the /etc/services file.


    # UDP


    UDP provides a connectionless, unreliable protocol. A UDP transfer consists of
    the sending of one packet without the overhead of establishing a connection or
    verification that the data has successfully reached its destination.'
  merge: -1
  pgno: 107
- img_proc: true
  md: '# TCP


    TCP provides a reliable, connection-oriented protocol. Connection-oriented means
    that two applications must establish a TCP connection before they begin exchanging
    data. TCP provides reliability by breaking each transfer into manageable segments
    and verifying that each segment arrives correctly at its destination. In addition
    to the verification of data, TCP consists of flow control, so a destination host
    does not lose data due to lack of buffer space.


    # Application Layer


    The application layer consists of network-aware applications that send and receive
    packets, using UDP and TCP ports. The application layer is not specifically a
    layer of the TCP/IP stack but a customer of the TCP/IP stack. As part of the application
    layer, a user will find services that provide network file and print sharing services,
    name resolution services, and user interfaces.


    # Socket System Calls


    The programming interface for developing socket-based solutions using FreeBSD
    is sockets. Socket-based applications are typically written to two networked applications.
    Networked applications are typically written as interacting components, client
    and server. A server handles requests from a number of clients. A client, or application,
    makes requests to a server. An example of the client-server model is the World
    Wide Web. Your browser is a client application; web sites, or the computers that
    host the web sites, are the servers.


    Implementation of a server consists of establishing a listening socket, waiting
    for a client connection, accepting the client request, performing the client request,
    and closing the connection. The DIO daemon developed later in this chapter is
    an example of a socket-based server.


    A client creates a connection socket, sends its request to the server, processes
    any received data, and closes the connection. Each server may process requests
    from many clients.'
  merge: -1
  pgno: 108
- img_proc: true
  md: '# Network Byte Order


    Any application that transfers data from one computer to another computer must
    be concerned with how the data is read. Different processors represent data in
    different formats. The two most widely accepted ways of representing data are
    known as big endian and little endian. Big endian systems store the most significant
    byte first, and little endian systems store the least significant byte first.
    For socket applications, the standard method of data transfer is big endian, also
    known as the network byte order.


    | Byte 0 | Byte 1 | Byte 2 | Byte 3 |

    | --- | --- | --- | --- |


    # Big Endian


    | Byte 3 | Byte 2 | Byte 1 | Byte 0 |

    | --- | --- | --- | --- |


    # Little Endian


    The socket system call interface provides functions to convert shorts and longs
    between host and network byte order. Each of these calls is described below.


    **The htonl System Call**


    The htonl system call converts a host long (32 bits) to network byte order.


    ```

    #include <sys/param.h>

    u_long value htonl(u_long hostlong);

    ```


    The return value is the converted long word.


    **The htons System Call**


    The htons system call converts a host short word (16 bits) to network byte order.


    ```

    #include <sys/param.h>

    u_short htons(u_short hostshort);

    ```'
  merge: -1
  pgno: 109
