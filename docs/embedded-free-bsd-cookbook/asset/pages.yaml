  md: '# Remote Management


    # Overview


    Many Internet appliances are installed in a remote location that is not easily
    accessible. One feature often required by an Internet appliance is remote management.
    Remote management is often implemented using telnet, login and rsh. Although these
    tools are reliable, they are insecure. The Secure Shell (SSH) was developed to
    provide remote access to systems that use encryption to pass data between systems
    for security. The standard FreeBSD installation contains an open source implementation
    of SSH, called OpenSSH.


    While SSH can protect an Internet appliance such as IP spoofing and packet snooping,
    it cannot protect the system once someone has login access. In order to provide
    additional security, we will develop a custom shell that only allows a user to
    access features related to the DIO appliance. This limits the damage a cracker
    can do, if access is gained.


    In this chapter, we will cover topics including:


    +   - SSH

    - Configuring SSH

    - Creating a management logon account

    - Developing a custom DIO management shell


    # Using Secure Shell (SSH)


    Remote configuration is not a new concept to Internet appliances. For years, systems
    engineers have provided remote access using rsh, login and telnet. These tools
    provide methods for remote configuration but are prone to being'
  merge: -1
  pgno: 124
- img_proc: true
  md: 'cracked because the data transmitted, including usernames and passwords, is
    not encrypted. Rsh and rlogin can provide minimal security by being configured
    to provide access only to trusted hosts; however, IP addresses can be spoofed,
    making one host appear as another.


    SSH provides a method for allowing remote access to another machine using encryption.
    It also provides login capabilities, encrypting the data exchanged between multiple
    systems. Transmitting encrypted data minimizes exposure to crackers sniffing Internet
    connections.


    SSH is implemented using the client-server module—i.e., the SSH server listens
    for SSH connections from an SSH client. The SSH client and server exchange two
    keys to establish a connection. One key is the public key to which everyone has
    access, and the other is the private key. Both keys are required for successful
    data exchange. Data that is encrypted using the public key can only be decrypted
    using the private key.


    # Getting SSH


    OpenSSH is part of the standard distribution of FreeBSD. However, if you need
    a patch or want to run the latest version of OpenSSH, it is contained in the ports
    package distributed with FreeBSD. To update the installed version of OpenSSH,
    you must cd to the OpenSSH port directory, and execute the standard commands for
    updating a port. The latest copy of OpenSSH can be retrieved by executing the
    following commands.


    ```

    # cd /usr/ports/security/openssh

    # make

    # make install

    # make clean

    ```


    These commands make, install, and clean up the latest version of the OpenSSH FreeBSD
    software.


    # Running SSH


    The SSH daemon, sshd, comes as part of the standard FreeBSD distribution. To run
    sshd at system start, the following lines must be added to the /etc/rc.conf file.
    The rc.conf file is used to provide custom startup configuration.'
