- img_proc: true
  md: '# Copying the Files to the Boot Device


    We''ve now come to the final step of creating the boot device. The CompactFlash
    is partitioned, formatted and mounted, and it''s time to copy the files from our
    development disk to the CompactFlash device. Creating a system image for an embedded
    device is somewhat of a "black art." There are a variety of ways to determine
    the components of your embedded system. I''ll briefly describe two methods to
    be used as a guideline for creating your final image. Whether you use these methods
    or create your own method, no amount of experience can circumvent the often unheralded
    and underappreciated—but extremely critical, particularly for an embedded system—step
    of creating the final image. No amount of preparation can replace the time-consuming
    process of iteration and testing.


    # The Iterative Approach


    Our system is configured so that we can iterate and test the CompactFlash device.
    Copy the required files to the flash disk. Once you''re ready to test the CompactFlash
    device, type the space bar at the boot prompt and enter ad(2,a). This causes a
    boot from the CompactFlash device. If there are files missing, reboot the system
    normally, make the necessary changes and try again.


    # The Installation Approach


    Another way to develop your release image is to install FreeBSD in a conventional
    manner to a hard drive, add your application software and then verify your system
    is working as expected. Then pare your system to the size required by your boot
    device. After paring down and testing your system as required, dd the entire filesystem
    to be transferred to your boot device.


    # Startup Configuration


    Much of the diskless boot is handled by the rc.diskless2 script. Control of a
    diskless FreeBSD system is handled by /etc/rc.diskless2. In order for rc.diskless2
    to be invoked, the following line must be added to /etc/rc.conf:


    ```

    diskless_mount=/etc/rc.diskless2

    ```


    Let''s take a look at the rc.diskless2 script in Listing 12-1.'
  merge: -1
