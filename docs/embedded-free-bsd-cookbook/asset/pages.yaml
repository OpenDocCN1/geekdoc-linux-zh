- img_proc: true
  md: '# Chapter Five


    The details for programming the registers are found in the PCI-DIO24 User''s Manual
    provided by Measurement Computing along with the controller. The PCI-DIO24 controller
    uses a PLX 9052 PCI Slave interface controller. Additional details are found in
    the PCI 9052 Data Book provided by PLX Technology.


    A PCI controller uses hardware resources such as IO port registers, memory-mapped
    registers, and interrupts. The specifics of the resources being used are contained
    in the device PCI Configuration registers. PCI Configuration contains 6 base address
    registers, 0–5. Additional details concerning PCI configuration registers are
    contained in Appendix C.


    The name, location, register space, and description of each of the PCI-DIO24 registers
    are contained in Table 5-1.


    | Register | Register Space | Byte Offset | Function |

    |---|---|---|--|

    | Configuration Register | Base Address 2 | 3 | Controls IO data line direction
    |

    | Port A Data | Base Address 2 | 0 | Port A data lines 0 – 7 |

    | Port B Data | Base Address 2 | 1 | Port B data lines 8 – 15 |

    | Port C Data | Base Address 2 | 2 | Port C data lines 16 – 23 |

    | Interrupt Status/Control | Base Address 1 | 4C | Interrupt Control |


    Table 5-1. PCI-DIO24 Registers


    The details of each register are provided in the following sections.


    # Configuration Register


    The Configuration Register is responsible for programming the direction of the
    digital data ports. A data port is a subset of digital lines. The Configuration
    Register is an 8-bit register located at offset 3 from the PCI Base Address Register
    2.


    The PCI-DIO24 has four data ports, each containing a subset of the PCI-DIO24 digital
    lines. All of the digital lines in a specific port must be programmed in the same
    direction, input or output. However, each port may be programmed independently
    of other ports. Each of the Configuration Register is defined in Table 5-2.'
  merge: -1
  pgno: 85
- img_proc: true
  md: '84 Embedded FreeBSD Cookbook


    | Bit | Description | Value |

    |---|---|--|

    | 0 | Port C Low Direction | 0 output, 1 input |

    | 1 | Port B Direction | 0 output, 1 input |

    | 2 | Reserved | NA |

    | 3 | Port C High Direction | 0 output, 1 input |

    | 4 | Port A Direction | 0 output, 1 input |

    | 5 | Reserved | NA |

    | 6 | Reserved | NA |

    | 7 | Reserved | Always set to 1 |


    Table 5-2. Configuration Register


    Bits 0, 1, 3, and 4 are used to program the data port directions. Setting these
    bits to a value of 1 will program the corresponding data port digital lines as
    inputs; alternately, setting the bits to a value of 0 will program the corresponding
    data port digital lines as outputs.


    It is important to note that bit 7 must always be set to 1; this is a function
    of the configuration hardware register. Writing to this register with bit 7 set
    to 0 will produce undefined results.


    # Port A Data Register


    The Port A Data Register is an 8-bit register located at offset 0 from PCI Base
    Address Register 2. The Port A Data register corresponds to digital 10 lines 0
    through 7. Each bit of the Port A Data register is defined in Table 5-3.


    | Bit | Description |

    |---|--|

    | 0 | Digital line 0 |

    | 1 | Digital line 1 |

    | 2 | Digital line 2 |

    | 3 | Digital line 3 |

    | 4 | Digital line 4 |

    | 5 | Digital line 5 |

    | 6 | Digital line 6 |

    | 7 | Digital line 7 |


    The Port A Data register bits correspond to digital lines 0 through 7. The direction
    of Port A digital IO lines is programmed by Configuration Register bit 4.


    Table 5-3. Port A Data Register'
