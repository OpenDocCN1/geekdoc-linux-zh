    \ the following parameters:\n\n| Argument | Description |\n|---|---|\n name |\
    \ Name is a generic name used for the system call. |\n offset | Offset is the\
    \ system call number. This is the index into the kernel global systent structure.\
    \ |\n systent | The systent structure defined for this system call. |\n evh |\
    \ The load handler function name. |\n arg | This is reserved and usually set to\
    \ NULL. |\n\nThe copymem SYSCALL_MODULE declaration is contained in Listing 3-10.\n\
    \n```\n/* declare the system call */\nSYSCALL_MODULE(copymem, &syscall_num, &copymem_systent,\
