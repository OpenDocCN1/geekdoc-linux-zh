    Figure 11-2. Partition Table and Slice


    # Unix Partitions


    A Unix disk is divided into as many as 8 partitions. A partition represents

    separate entity on the disk. FreeBSD disks typically use 4 of the 8 available

    partitions: the partition is used for the root file system, the b partition is

    used for the swap partition. The f partition contains the user partition, and

    t e partition is used for the file system. An important note is the c

    partition, which is historically used to represent the whole disk.


    We can look at the /etc/fstab file to see how the disk is partitioned.


    ```

    /dev/ad0slb  none  swap  sw   0 0

    /dev/ad0sla  /      ufs   rw   1 1

    /dev/ad00f  /usr  ufs   rw   2 2

    /dev/ad0sle  /var  ufs   rw   2 2

    ```


    This disk contains four partitions. The partition is denoted by the last

    of the device name in column 1. Partition contains the root file system, b

    swap partition, f is the user partition and e the var partition.


    # PC BIOS


    After turning on or resetting your computer program, execution begins with

    generic code in the PC called the BIOS. The BIOS is the lowest level

    software in a computer and provides an interface between the software and

    hardware. The BIOS (basic input/output system) has the task of initialization-

    ing the hardware, loading and running the boot loader contained in the MBR.'
  merge: -1
  pgno: 189
- img_proc: true
  md: 'The boot loader is a program that resides in the MBR and is loaded and run
    by the BIOS. The BIOS loads it into memory and begins program execution. The information
    contained in the MBR includes information to find the boot loader on disk, a program
    to read the boot loader into memory and begin execution.


    Once a PC is powered on, the BIOS has a list of tasks to perform:


    +   1. A series of tests are performed on existing hardware to ensure the hardware
    is working properly.

    2. Hardware resources are initialized and assigned.

    3. Configured boot devices are searched for a valid boot sector.

    4. The boot sector is loaded and transferred to the boot loader.


    After the system boots, the BIOS reads the MBR into location 7C00H, the last two
    bytes of that sector should contain the MBR magic number AA55H. If the last two
    bytes are AA55H, control is passed to the boot loader routine; otherwise the system
    stops.


    # FreeBSD Boot Loader


    Once the BIOS loads the MBR into memory, the FreeBSD booting process begins. It
    consists of three stages, each stage providing more features and increasing in
    size. The first two stages are actually part of the same program but are split
    into due to space constraints. The third stage is an options boot loader. Individual
    components of the boot process are located in the /boot directory.


    ```

    # ls -l /boot

    total 533

    -r-r-r- 1 root wheel 512 Sep 18 13:28 boot0

    -r-r-r- 1 root wheel 512 Sep 18 13:28 boot1

    -r-r-r- 1 root wheel 7680 Sep 18 13:28 boot2

    -r-xr-xr-x 1 root wheel 149504 Sep 18 13:28 cdboot

    drwx-xr-xr-x 2 root wheel 512 Oct 24 16:52 defaults

    -r-xr-xr-x 1 root wheel 147456 Sep 18 13:28 loader

    -r-r-r- 1 root wheel 9237 Sep 18 13:28 loader.4

    -rw-r-r- 1 root wheel 67 Dec 16 16:51 loader.conf

    -r-r-r- 1 root wheel 12064 Sep 18 13:28 loader.help

    -r-r-r- 1 root wheel 338 Sep 18 13:28 loader.rc

    ```'
