    \n| Id | Refs | Size | Name |\n|---|---|---|---|\n| 1 | 2 | 0xc0100000 | 19fe48\
    \ kernel |\n| 2 | 1 | 0xc146c000 | 19000 usb.ko |\n\n# The kldload Command\n\n\
    The kldload command is used to load a KLD into the kernel. Kldload takes one command,\
    \ the name of the KLD file, typically with the extension .ko.\n"
