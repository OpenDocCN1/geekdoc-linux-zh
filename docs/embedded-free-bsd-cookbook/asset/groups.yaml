    \ evh, arg)             \\\nstatic moduledata_t name##_mod = { \\\n    name, \\\
    \n    evh, \\\n    arg \\\n};\nDECLARE_MODULE(name, name##_mod, SI_SUB_DRIVERS,\
    \ SI_ORDER_MIDDLE);\n```\n\nAs with the system call KLD the DEV_MODULE macro declares\
    \ the module_data_t structure used by the KLD.\n\nOur example declaration for\
    \ the KLD sample device driver is as follows:\n\n```c\nDEV_MODULE(kld_driver_sample,\
    \ load_handler, NULL);\n```\n\n# The Driver Functions\n\nNow that the KLD components\
    \ are defined, the remainder of development consists of implementing the driver\
