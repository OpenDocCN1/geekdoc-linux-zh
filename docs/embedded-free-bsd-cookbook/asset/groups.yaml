- md: '

    # Preface


    Discussing embedded systems in general is difficult, because each embedded system
    is unique. Rather than presenting a list of general principles for handling embedded
    development issues, this book presents examples of problems encountered and solutions
    to those problems using real hardware and software. In that sense, it is a "cookbook"
    for developers who offer design "recipes" that can be elaborated on or modified
    as needed to solve other design problems.


    In addition to the source code provided to develop the DIO appliance, this book
    contains real "how-to" information for obtaining releases of Open Source software
    and describes the steps to install, configure and program. Whether you are developing
    an actual appliance or experimenting with the operating system, this book will
    help you familiarize yourself with all the development issues, not just development
    concepts.


    This book presents a set of common issues that are encountered during the development
    of an embedded web appliance. Each chapter covers a specific topic, discusses
    background information on the topic, and presents a design solution for that topic.
    The chapters are not meant to present all possible solutions, but rather provide
    information that can be used to develop your own solutions.


    Developing an embedded system involves many skills beyond writing source code.
    Identifying technologies that can be used to solve a problem, installing, configuring,
    and packing are all skills that are equally important but are often overlooked.
    All of these issues are covered, to give you a complete picture of the embedded
    development process.


    # Prerequisites and Other Resources


    This is a book about developing an internet appliance using FreeBSD and the software
    tools contained in the FreeBSD distribution. As such, it assumes the reader has
    some background in programming in C and C++ in an environment. In addition to
    basic programming skills it would be helpful if you had a basic understanding
    of data structures and system programming. This book is for readers who already
    know how to write and compile Unix and to learn more about the FreeBSD environment
    and explore topics that are different from a typical programming book. A few of
    the topics do not require that you have a detailed background in computer hardware
    but assume you have some knowledge and are willing to learn the skills necessary.


    I wrote this book for people who wanted to delve a little deeper into the FreeBSD
    operating system. Many of the issues presented in this book go beyond programming
    in C or C++ and present issues that embedded systems would be faced with during
    product development. This is not a book about FreeBSD internals and how to hack
    the kernel. FreeBSD has deep roots and there are already excellent resources available
    to learn about FreeBSD operating systems and system administration. I recommend
    The Design and Implementation of the 4.4 BSD Operating System, The Complete FreeBSD,
    and The FreeBSD Handbook, located at http://www.bsd.org/doc/en_US.ISO8859-1/books/handbook/index.html.
    In addition to these resources, the FreeBSD site contains numerous lists, user
    groups, news and web resources. There are also excellent references for programming
    Unix, such as Advanced Programming in the Environment and The C Programming Language,
    both available on amazon.com.


    # Organization


    This book contains 12 chapters and 3 appendices.


    Chapter 1, Getting Started, introduces you to embedded systems and describes Internet
    appliances and FreeBSD. Additionally, the major pieces of hardware and software
    used to build the Internet appliance described in this book are covered.


    Chapter 2, Systems Programming, introduces you to the Unix process and daemons.
    A process is fundamental to Unix programming. A daemon is a special type of process.
    The details of creating a daemon from a Unix process are discussed.


    Chapter 3, System Calls, describes exactly what a system call is and how it is
    implemented in FreeBSD.


    Chapter 4, Device Drivers, provides a description of FreeBSD device drivers and
    their data structures. Tools available to driver writers are discussed and used
    to develop an actual device driver for a PCI data acquisition controller.


    Chapter 5, Middleware Interface Library, presents a discussion of shared libraries
    and how user code accesses a device driver.


    Chapter 6, Daemons, builds on the topics presented in Chapter 2 by implementing
    a Unix daemon that uses sockets to provide a simple protocol to read and write
    to the data acquisition board.


    Chapter 7, Remote Management, discusses how to provide a secure method for remote
    management. A configuration shell is developed and may be accessed remotely via
    SSH.


    Chapter 8, JNI Layer, introduces the user to JNI, an interface to allow Java programmers
    to call C code.


    Chapter 9, Web Access using Tomcat, provides the steps necessary to display dynamic
    web content. The procedure for configuring Tomcat, a JSP server, and writing JSP
    pages is discussed. You will develop a JSP page that displays the status of the
    data acquisition controller.


    Chapter 10, Building the Kernel, discusses the steps for building a custom kernel
    based on the hardware and specific features of the DIO Internet appliance.


    Chapter 11, System Startup, provides a discussion of the FreeBSD booting process
    and modifications necessary to the startup scripts required by the DIO appliance
    such as Tomcat, ssh and loading custom KLDs.


    Chapter 12, The CompactFlash Boot Device, provides a description of partitioning
    a flash device and loading the code developed in the previous chapters of this
    book onto the flash to make a living, breathing appliance server.


    Appendix A, The FreeBSD License, is a copy of the FreeBSD license.


    Appendix B, PCI Configuration, discusses the PCI configuration space. Knowledge
    of PCI configuration registers is needed for developing device drivers for PCI
    controllers. The appendix describes the registers in PCI configure space and their
    uses.


    Appendix C, Kernel Loadable Modules, covers KLDs, which are used for system calls
    and device drivers in Chapters 2 and 4. The appendix provides a discussion of
    the individual components that make KLDs and their uses.


    In order to get the most out of this book, I recommend not getting bogged down
    in the details but trying to gain a general understanding of the topic through
    studying one way to implement a solution to that topic. By becoming familiar with
    each step involved in developing an embedded system, you should be able to apply
    the concepts to any development task you may encounter.


    # What’s on the CD-ROM?


    The accompanying CD-ROM contains the source code for the programs used in the
    book and a fully searchable pdf version of the entire text.


    # Conventions


    Macro Text


    Macro text is used for source code.


    Bold Macro Text


    Bold Macro Text is used for program output and shell input.


    # Getting Started


    ## Overview


    Embedded computer systems permeate all aspects of our daily lives. Alarm clocks,
    coffee makers, digital watches, cell phones, and automobiles are just a few of
    the devices that make use of embedded systems. The design and development of such
    systems is unique, because the design constraints are different for each system.


    ## Embedded Systems


    An embedded system consists of hardware and software designed to solve a specific
    application. Many applications consist of more than simple computer hardware and
    software. For example, an industrial vision system designed to control a robotic
    arm consists of an embedded computer, camera, display, and the robotic arm. Each
    of these components are embedded systems on their own.


    Classic embedded systems have been considered dedicated solutions to a single
