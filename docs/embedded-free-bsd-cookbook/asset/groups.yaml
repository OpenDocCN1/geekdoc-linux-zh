    \n你可能注意到我们开发的系统调用示例并不包含 `moduli_t` 结构。对 `SYSCALL_MODULE` 宏的进一步分析表明，`module_t`\
    \ 结构是由 `SYSCALL_MODULE` 声明生成的。\n\n对于我们的示例 KLD 系统调用，该声明采用以下形式：\n\n```c\nSYSCALL_MODULE(kld_syscall,\
    \ &offset, &kld_syscall_sysent, load_handler, NULL);\n```\n\n# 设备驱动程序\n\n动态内核链接器支持动态加载和卸载设备驱动。本节介绍了\
