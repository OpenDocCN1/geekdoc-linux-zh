- md: "\n# Summary\n\nIn this chapter we've covered process attributes in FreeBSD,\
    \ as well as the common system calls used to create, terminate, and manage a process.\
    \ Our discussion of processes was completed by introducing a special type of process\
    \ which have been presented and encapsulated into a general purpose function,\
    \ `init_daemon`.\n\nWe'll revisit the discussion of daemon processes again in\
    \ Chapter 6, when we implement a daemon to handle DIO queries using sockets. Next,\
    \ let's jump into the implementation of FreeBSD system calls.\n\n# System Calls\n\
    \n## Overview\n\nAs mentioned in the previous chapter, the FreeBSD kernel provides\
    \ an execution environment for a process called User Mode. A process executing\
    \ in User Mode cannot directly access kernel memory, kernel data structures or\
    \ hardware. Access to kernel memory and hardware resources is restricted to the\
    \ FreeBSD kernel, which executes in a privileged mode of the underlying processor.\
    \ FreeBSD provides a detailed interface for a user process to obtain basic services\
    \ from the kernel known as system calls.\n\nThe benefit of restricting certain\
    \ tasks to the kernel is twofold. First, it relieves a system engineer from the\
    \ details of programming device hardware. Second, by providing and enforcing a\
    \ detailed interface to the system call interface, the kernel can ensure that\
    \ the parameters passed by a user program are correct and will not cause a system\
    \ crash. The added protection in the kernel provides a stable run-time environment\
    \ for applications.\n\nIn this chapter we will discuss the details of FreeBSD\
    \ system calls. After our discussion of system calls is complete, we will implement\
    \ a system call that reads and writes kernel memory along with an application\
    \ that provides simple debugging capabilities.\n\n## Library Functions and System\
    \ Calls\n\nThe Standard C Library provides an API consisting of header files and\
    \ libraries that contain implementations of many commonly needed functions and\
    \ IO routines. The Standard C library is implemented as both library functions\
    \ and system calls.\n\nTo a system designer, library functions and system calls\
    \ appear to be the same. Both have defined function prototypes and return values.\
    \ To an application programmer, the functional implementation is not important.\
    \ The interface, function name, parameters, and return value are important. The\
    \ difference resides in the implementation.\n\nWhen a program calls a library\
    \ function program, execution is passed to the library function, the requested\
    \ operation is performed, and control returned to the calling function. This all\
    \ occurs in the context and address space of the running process.\n\nFigure 3-1.\
    \ Library Function Call\n\nA system call is a request to the kernel to execute\
    \ a privileged operation on behalf of a user process. When a program makes a system\
    \ call, program execution transitions from User Mode to Kernel Mode, the kernel\
    \ performs the requested operation, then program execution transitions back from\
    \ Kernel Mode to User Mode. In order for the operation to be performed, the process\
    \ must make a request to the kernel.\n\nFigure 3-2. System Call\n\n## System Call\
    \ Implementation\n\nSystem calls are implemented in two steps. The first step\
    \ is to transition from User Mode into Kernel Mode, which is accomplished by using\
    \ a software interrupt. In addition, data must be passed from User Mode to Kernel.\
    \ In this section we will look at these details.\n\n## Software Interrupt\n\n\
    On an Intel x86 processor, a program executing in User Mode performs a switch\
    \ into Kernel Mode by executing a software interrupt. A software interrupt is\
    \ an event that is processed asynchronously by the processor, using an interrupt\
    \ handler. An interrupt handler is called in response to the invocation of a hardware\
    \ or software interrupt. A software interrupt is different from a hardware interrupt,\
    \ because it occurs synchronously within the running process.\n\nSoftware interrupts\
    \ are invoked on an Intel x86 processor by executing the INT instruction. The\
    \ INT instruction takes a number between 0 and 255 that designates the interrupt\
    \ vector. System calls are assigned to interrupt vector 128 (0x80). A process\
    \ will invoke a system call by executing the INT $080 instruction.\n\nEvery interrupt\
    \ vector contains an entry in the Interrupt Descriptor Table (IDT). The IDT is\
    \ a table of 256 longs. Each word represents the interrupt handler for the specific\
    \ interrupt vector. For a system call, the system interrupt handler is located\
    \ at 0x200. 0x200 is derived by interrupt vector 0x80 * 4 = 0x200.\n\nOnce the\
    \ process encounters either a software or hardware interrupt, it fetches the address\
    \ from the Interrupt Descriptor Table (IDT) for the specific interrupt vector\
    \ and executes that interrupt handler. After the interrupt handler is completed,\
    \ execution returns to the process.\n\nFigure 3-3. Interrupt Handling\n\n## Passing\
    \ Data\n\nThe kernel implements many different system calls. To distinguish between\
    \ different system calls, a number is passed that designates which system call\
    \ is being made; this number is called the system call number. A list of defined\
    \ system calls can be found in `/sys/kern/syscalls.master`. Before a system call\
    \ is made, the system call number is pushed onto the program stack.\n\nIn addition\
    \ to the system call number, many system calls take parameters. Parameters are\
    \ passed to the kernel using the C calling convention. The caller pushes the system\
    \ parameters on the stack, one after another, in reverse order, right to left,\
    \ so that the first argument specified to the function is last. On return from\
    \ the system call, the caller restores the stack to its original value before\
    \ the call; this is called popping the stack.\n\n| arg # | n |\n| :--- | :---\
    \ |\n| system call number | pushed first |\n| parameters | pushed after |\n\n\
    Figure 3-4. System Call Number\n\n## Example\n\nTo demonstrate how the compiler\
    \ generates system calls, let's look at the output of a program that makes system\
    \ calls. Listing 3-1 contains a program that makes open and close.\n\n```c\n#include\
    \ <stdio.h>\n#include <fcntl.h>\n\nint main(int argc, char **argv) {\n    int\
    \ fd;\n\n    fd = open(\"file.dat\", O_RDWR);\n    close(fd);\n}\n```\n\nTo simplify\
    \ the output, optimizations are turned off so we can use objdump to disassemble\
    \ the compiled code. The command was:\n```bash\ngcc -O0 -static -o open open.c\n\
    ```\n\nThe disassembly of the program is shown in Listing 3-2:\n\n```\n08041c4\
    \ <main>:\n    6a 02              push 0x2\n08041cf:    68 01 84 04 00  push 0x8401\n\
    08041d4:    e8 7f 00 00 00  call 804258\n08041d9:    83 c4 10         add 0x10,%esp\n\
    \n0804258 <open>:\n0804258:    8d 05 05 05 00  lea 0x5,%eax\n080425e:    cd 80\
    \              int 0x80\n\n0804262:    c3              ret\n```\n\nListing 3-2\
    \ shows the steps performed by the compiler to generate the assembly code to make\
    \ an open system call. The instructions located at 08041cd and 0801cf push the\
    \ open mode and filename to the stack. The main program calls the open system\
    \ call. Open then pushes its system call number, 5, onto the stack in 804258,\
    \ then invokes the software interrupt. After the return from open, the stack is\
    \ restored to its original value in 8041d9.\n\n## truss\n\nIn the previous sections,\
    \ we've taken a detailed look at how system calls are implemented. In this section,\
    \ we'll show how a standard utility uses system calls to accomplish this task.\
    \ truss is a FreeBSD command containing a utility used to trace calls and see\
    \ signals received by a process. Using the truss command we will look at how the\
    \ pwd command makes system calls. The pwd command displays the current working\
    \ directory of a process. Listing 3-3 shows the output of the truss command when\
    \ used to analyze the pwd command.\n\n```\nreadlink \"/etc/malloc.conf\", 0xbbffff57,63)\
    \      ERR#2 'No such file or directory'\nmmap(0x0,0x4096,0x3,0x1002,-1,0x0) \
    \   = 671432704\nbreak(0x8058000)                    = 0 (0x0)\nbreak(0x8059000)\
    \                    = 0 (0x0)\nsigaction(SIGSYS,0xbbffff660,0xbbffff648) = 0\
    \ (0x0)\n    _getcwd(0x8058000,0x3fc)         = 0 (0x0)\nsigaction(SIGSYS,0xbbffff648,0x0)\
    \     = 0 (0x0)\nfstat(1,0xbbffff388)                = 0 (0x0)\n```\n"
  mdcn: "\n\n# 总结\n\n在本章中，我们涵盖了 FreeBSD 中的进程属性，以及用于创建、终止和管理进程的常用系统调用。我们对进程的讨论通过引入一种特殊类型的进程而结束，这种进程已经过介绍并封装到了一个通用函数\
    \ `init_daemon` 中。\n\n我们将在第 6 章再次讨论守护进程（daemon processes），届时我们将实现一个使用 Socket（sockets）处理\
    \ DIO 查询的守护进程。现在，让我们进入 FreeBSD 系统调用的实现。\n\n# 系统调用\n\n## 概述\n\n如上一节所述，FreeBSD 内核为进程提供了一个称为用户模式（User\
    \ Mode）的执行环境。在用户模式下执行的进程无法直接访问内核内存、内核数据结构或硬件。对内核内存和硬件资源的访问仅限于 FreeBSD 内核，内核运行在底层处理器的特权模式下。FreeBSD\
    \ 为用户进程提供了一个详细的接口，用于从内核获取基本服务，这被称为系统调用。\n\n将某些任务限制在内核中的好处有两个：首先，它让系统工程师从硬件编程的细节中解放出来；其次，通过提供并强制执行的系统调用接口，内核可以确保用户程序传递的参数是正确的，且不会导致系统崩溃。内核中增加的保护为应用程序提供了稳定的运行环境。\n\
    \n在本章中，我们将讨论 FreeBSD 系统调用的细节。在完成系统调用的讨论后，我们将实现一个读写内核内存的系统调用，以及一个提供简单调试能力的应用程序。\n\
    \n## 库函数与系统调用\n\n标准 C 库提供了由头文件和库组成的 API，包含了许多常用函数和 IO 例程的实现。标准 C 库以库函数和系统调用的形式实现。\n\
    \n对于系统设计人员来说，库函数和系统调用看起来是相同的。它们都有定义的函数原型和返回值。对于应用程序程序员来说，函数的具体实现并不重要，接口、函数名、参数和返回值才是重要的。区别在于实现方式。\n\
    \n当程序调用库函数时，执行权将传递给库函数，执行请求的操作，并将控制权返回给调用函数。这一切都在运行进程的上下文和地址空间内发生。\n\n图 3-1 库函数调用\n\
    \n系统调用是对内核的请求，用于代表用户进程执行特权操作。当程序发出系统调用时，程序执行从用户模式切换到内核模式，内核执行请求的操作，然后程序执行从内核模式切换回用户模式。为了执行该操作，进程必须向内核发出请求。\n\
    \n图 3-2 系统调用\n\n## 系统调用实现\n\n系统调用通过两个步骤实现。第一步是从用户模式转换到内核模式，这是通过使用软件中断完成的。此外，数据必须从用户模式传递到内核。在本节中我们将查看这些细节。\n\
    \n## 软件中断\n\n在 Intel x86 处理器上，在用户模式下执行的程序通过执行软件中断来切换到内核模式。软件中断是由处理器使用中断处理程序（interrupt\
    \ handler）异步处理的事件。中断处理程序是在响应硬件或软件中断调用时调用的。软件中断与硬件中断不同，因为它在运行的进程内部同步发生。\n\n在 Intel\
    \ x86 处理器上，通过执行 `INT` 指令来调用软件中断。`INT` 指令接受一个 0 到 255 之间的数字，指定中断向量（interrupt vector）。系统调用被分配到中断向量\
    \ 128 (0x80)。进程通过执行 `INT $080` 指令调用系统调用。\n\n每个中断向量包含中断描述符表（IDT）中的一个条目。IDT 是一个包含\
    \ 256 个长型（longs）的表。每个字代表特定中断向量的中断处理程序。对于系统调用，系统中断处理程序位于 0x200。0x200 是通过中断向量 0x80\
    \ * 4 = 0x200 得出的。\n\n一旦进程遇到软件或硬件中断，它将从中断描述符表（IDT）获取特定中断向量的地址并执行该中断处理程序。在中断处理程序完成后，执行返回到进程。\n\
    \n图 3-3 中断处理\n\n## 数据传递\n\n内核实现了许多不同的系统调用。为了区分不同的系统调用，会传递一个数字来指定正在进行哪一个系统调用；这个数字被称为系统调用号。定义的系统调用列表可以在\
    \ `/sys/kern/syscalls.master` 中找到。在进行系统调用之前，系统调用号会被推入程序栈中。\n\n除了系统调用号，许多系统调用还带有参数。参数使用\
    \ C 调用约定传递给内核。调用者按逆序、从右到左一个一个将系统参数推入栈中，因此函数指定的第一个参数是最后入。从系统调用返回时，调用者将栈恢复到调用前的原始值；这被称为出栈（popping\
    \ the stack）。\n\n| arg # | n |\n| :--- | :--- |\n| 系统调用号 | 首先推入 |\n| 参数 | 后推入\
    \ |\n\n图 3-4 系统调用号\n\n## 示例\n\n为了演示编译器如何生成系统调用，让我们来看看执行系统调用程序的输出。列表 3-1 包含一个调用\
    \ `open` 和 `close` 的程序。\n\n```c\n#include <stdio.h>\n#include <fcntl.h>\n\nint\
    \ main(int argc, char **argv) {\n    int fd;\n\n    fd = open(\"file.dat\", O_RDWR);\n\
    \    close(fd);\n}\n```\n\n为了简化输出，关闭了优化，以便我们使用 `objdump` 反汇编代码。命令是：\n```bash\n\
    gcc -O0 -static -o open.c\n```\n\n程序的反汇编如列表 3-2：\n\n```\n0804c4 <main>:\n    6a\
    \ 02              push 0x2\n0801cf:    68 01 84 00  push 0x8401\n0801d4:    e8\
    \ 7f 00 00  call 804258\n0801d9:    83 c4 10         add 0x10,%esp\n\n0804258\
    \ <open>:\n0804258:    8d 05 05 05 00  lea 0x5,%eax\n080425e:    cd 80       \
    \       int 0x80\n\n080462:    c3              ret\n```\n\n列表 3-2 显示了编译器生成执行系统调用汇编代码的步骤。位于\
    \ 0801cd 的指令将模式和文件名推入栈。主程序调用系统调用。`open` 在 804258 处将其系统调用号 5 推入栈，然后调用软件中断。从 `open`\
    \ 返回后，栈在 801d9 处恢复到原始值。\n\n## truss\n\n在前面的节中，我们详细查看了系统调用是如何实现的。在本节中，我们将展示标准工具如何使用系统调用完成此任务。`truss`\
    \ 是一个 FreeBSD 命令，包含一个跟踪调用和查看进程接收信号的工具。使用 `truss` 命令，查看 `pwd` 命令如何调用系统调用。`pwd`\
    \ 命令显示进程当前的工作目录。列表 3-3 显示了使用 `truss` 分析 `pwd` 命令时的输出。\n\n```\nreadlink \"/etc/malloc.conf\"\
    , 0xbbffff57,63)      ERR#2 'No such file or directory'\nmmap(0x0,0x4096,0x3,0x1002,-1,0x0)\
    \    = 671432704\nbreak(0x8058000)                    = 0 (0x0)\nbreak(0x8059000)\
    \                    = 0 (0x0)\nsigaction(SIGSYS,0xbbffff660,0xbbffff648) = 0\
    \ (0x0)\n    _getcwd(0x8058000,0x3fc)         = 0 (0x0)\nsigaction(SIGSYS,0xbbffff648,0x0)\
    \     = 0 (0x0)\nfstat(1,0xbbffff388)                = 0 (0x0)\n```\n\n"
