  - '[PAGE 210]


    The subsequent sections describe each mandatory PCI configuration register that
    is implemented by all PCI devices. The most notable for device driver writers
    are the vendor ID and device ID registers. These registers are used to determine
    if the physical device is installed in the system.


    # Vendor ID Register


    The Vendor ID Register is a 16-bit register that contains a unique value identifying
    the device manufacturer. Every PCI manufacturer registers with the PCI SIG to
    obtain a unique Vendor ID. The Measurement Computing Vendor ID is hexadecimal
    1307.


    # Device ID Register


    The Device ID register is a 16-bit register that contains a unique value, defined
    by the manufacturer, for this PCI device. The PCI-DIO24 Device ID is hexadecimal
    28.


    # Command Register


    The command register is a 16-bit register that provides control over the device''s
    ability to respond to PCI accesses. Currently only bits 0:9 are defined. Each
    of the defined bits represents a capability. The PCI designer sets the bits that
    are implemented by the device. The bits are defined as follows:


    | Bit | Function |

    | 0 | IO Access Enable |

    | 1 | Memory Access Enable |

    | 2 | Master Enable |

    | 3 | Special Cycle Recognition |

    | 4 | Memory Write and Invalidate Enable |

    | 5 | VGA Palette Snoop Enable |

    | 6 | Parity Error Response |

    | 7 | Wait Cycle Enable |

    | 8 | System Error Enable |

    | 9 | Fast Back-to-Back Enable |

    | 10:15 | Reserved |'
  - '[PAGE 211]


    # Status Register


    The Status Register is a 16-bit register that provides the device status.

    The bits are defined in the status register as follows:


    | Bit | Function |

    | 0:4 | Reserved |

    | 5 | 66 MHz Capable |

    | 6 | UDF Supported |

    | 7 | Fast Back-to-Back Capable |

    | 8 | Data Parity Reported |

    | 9:10 | Device Select |

    | 11 | Signaled Target Abort |

    | 12 | Received Target Abort |

    | 13 | Received Master Abort |

    | 14 | Signaled System Error |

    | 15 | Detected Parity Error |


    # Revision ID


    The revision ID register contains an 8-bit value assigned by the manufacturer
    that contains the device revision number.


    # Class Code


    The class code register is a 24-bit register that defines the base class, sub-class
    and programming interface.


    | 0:7 | 8:15 | 16:23 |

    | Programming interface | Sub-Class Code | Class Code |


    The class code, sub-class code and programming interface are defined by the PCI
    Interface specification.


    # Cache Line Size


    The cache line size register is an 8-bit register that defines the system cache
    line size in double word increments.'
- md: "\n## Latency Timer\nThe latency time is an 8-bit register that defines the\
    \ minimum amount of time, in PCI clock cycles, that the bus master can retain\
    \ ownership of the bus.\n\n## Header Type\nThe header type register is an 8-bit\
    \ register that defines the type of device. Bit 7 is set to 0 or 1, defining single\
    \ function or multi function.\n\n## BIST\nThe BIST register is an 8-bit register\
    \ that can be used for PCI devices that implement Built In Self Test (BIST).\n\
    \n## Base Address Registers\nThe base address registers are 32-bit registers used\
    \ to determine the PCI memory mapped and IO spaces used by the device. A PCI device\
    \ may have up to 6 base address registers that are used to utilize memory mapped\
    \ or IO address space.\n\n## CardBus CIS Pointer\nThe CardBus CIS Pointer Register\
    \ is a 32-bit register implemented by devices that share silicon between the cardbus\
    \ and PCI bus.\n\n## Subsystem Vendor ID\nThe subsystem vendor ID is a 16-bit\
    \ register used to uniquely identify an add-in card. The subsystem vendor ID is\
    \ obtained from the PCI-SIG.\n\n## Subsystem ID\nThe subsystem ID is a 16-bit\
    \ register used to define additional features for a PCI device. The subsystem\
    \ ID is defined by the vendor.\n\n## Expansion ROM Address\nFor devices that contain\
    \ power-on self test (POST) code, BIOS and interrupt service routines, the Expansion\
    \ ROM address register is a 32-bit register that contains the starting address\
    \ and size of the ROM code.\n\n## Maximum Latency\nThe maximum latency register\
    \ is an 8-bit register that specifies how often the device needs to access the\
    \ PCI bus.\n\n## Minimum Grant\nThe minimum grant register is an 8-bit register\
    \ that defines how long the master would like to retain PCI bus ownership whenever\
    \ it initiates an action.\n\n## Interrupt PIN\nThe interrupt pin register is an\
    \ 8-bit register that defines which of the 4 PCI interrupt request pins the PCI\
    \ device is connected to.\n\n## Interrupt Line\nThe interrupt line register is\
    \ an 8-bit register used to identify which of the system interrupt lines on the\
    \ system interrupt controller the PCI device interrupt is routed on.\n\n## Kernel\
    \ Loadable Modules\n### Overview\nOne of the features of FreeBSD is a dynamic\
    \ kernel linker that provides system engineers and system administrators with\
    \ the capability to load and unload system calls in a running system. This appendix\
    \ provides the necessary background information for writing kernel loadable modules\
    \ (KLDs). In addition to covering the details of the different types of FreeBSD\
    \ KLDs, at the completion of this appendix you will have skeleton code that can\
    \ be used for your own KLDs.\n\nIn this chapter we will cover:\n- The core components\
    \ of a KLD\n- System calls as KLD\n- Device drivers as KLD\n- KLD commands\n\n\
    ## Kernel Loadable Modules\nEvery KLD contains three core components: the Makefile,\
    \ which provides a simple environment to build a KLD and provides the developer\
    \ with a rapid prototype and build environment; the load handler function, which\
    \ provides the entry points for the load, unload and system shutdown behavior\
    \ for the KLD and the module data structure; and the module data structure, which\
    \ contains the name and entry point of the load function.\n\nWhen a new KLD is\
    \ loaded into a running system, dynamic load execution of the KLD starts based\
    \ on the entry point in the module data structure.\n\n## Makefile\nBuilding KLD\
    \ is a straightforward process and the details of KLD building are provided in\
    \ a system-includable makefile located in /usr/share/mk/bsd.kmod. Your makefile\
    \ declares the source files that consist of the KLD in the makefile variable SRCS\
    \ and declares the name of the KLD in the variable KMOD by including the system\
    \ makefile in the /usr/share/mk directory; the rest of the details are handled\
    \ for you. Listed below is a sample make for a skeleton KLD.\n\n```\nSRCS=kld_generic.c\n\
    MOD=kld_generic\n```\n\n```\n.include <bsd.kmod.mk>\n```\n\nAfter the declaration\
    \ of the SRCS and KMOD variables, a standard KLD makefile includes the KMOD makefile\
    \ template, bsd.kmod.mk.\n\n## The Load Handler Function\nThe load handler function\
    \ is called by the kernel dynamic linker when a module is loaded or unloaded or\
    \ the system is shut down. The function prototype for the load handler function\
    \ is defined in /usr/include/sys/module.h\n\n```c\ntypedef int (*modeventhand_t)(module_t\
    \ mod, int\n/*modeventype_t/* what, void* arg);\n```\n\nThe load handler function\
    \ takes three arguments: a module, the event and a user-defined argument.\n\n\
    ```c\nstatic int load_handler(struct module *m, int cmd, void* arg)\n{\n    int\
    \ stat = 0;\n\n    switch(cmd)\n    {\n        case MOD_LOAD:\n            break;\n\
    \n        case MOD_UNLOAD:\n            break;\n```\n\n## Appendix C\nKernel Loadable\
    \ Modules\n\n```c\ncase MOD_SHUTDOWN:\n  break;\n\ndef:\n  stat = EINVAL;\n}\n\
    \nreturn(stat);\n```\n\nThe module pointer is a linked list of currently loaded\
    \ modules and contains information relevant to loaded modules. Commands are defined\
    \ by the modeventype defined in /usr/include/sys/module.h. The cmd argument represents\
    \ the reason why the load handler is being called. There are three conditions\
    \ under which a KLD load handler is called.\n\n```c\ntypedef enum modeventype\
    \ {\n  MOD_LOAD,\n  MOD_UNLOAD,\n  MOD_SHUTDOWN\n} modeventype;\n```\n\n| Command\
    \ | Description |\n| :--- | :--- |\n| MOD_LOAD | The KLD is loaded |\n| MOD_UNLOAD\
    \ | The KLD is unloaded |\n| MOD_SHUTDOWN | The system is shutting down |\n\n\
    The last argument is a user-defined argument.\n\n## The moduata Structure\nThe\
    \ subsystem vendor ID is a 16-bit register used to uniquely identify an add-in\
    \ card. (Wait, context correction: The moduata_ structure contains three elements.)\n\
    \n```c\ntypedef struct moduata {\n  char *name;\n  modeventype_t handler;\n  void\
    \ *priv;\n} moduata_t;\n```\n\nThe name is a string used by the kernel. The second\
    \ element is the function handler. The last element is private data.\n\n```c\n\
    static moduata_t kld_generic = {\n  \"kld_generic\",\n  load_handler,\n  NULL\n\
    };\n```\n\n## The DECLARE_MODULE Macro\nThe core pieces of a KLD are all united\
    \ by the DECLARE_MODULE macro. It takes four parameters. The first parameter represents\
    \ a unique name for the module. The second parameter is data for the type of module;\
    \ the third argument is a subsystem type and the final parameter signifies load\
    \ order.\n\n```c\n#define DECLARE_MODULE(name, data, sub, order) \\\nSYSINIT(name##module,\
    \ sub, order, \\\n  &data)\n```\n\nThe listing below contains a sample:\n\n```c\n\
    DECLARE_MODULE(kld_generic, kld_generic, SI_SUB, SI_ORDER_ANY);\n```\n\n## System\
    \ Calls\nSystem calls are a specific type of KLD module. This section describes\
    \ additional components necessary for a KLD system call.\n\n## The System Call\
    \ Function\nA system KLD contains the system call function, which contains two\
    \ parameters, the proc structure and the system call arguments. A sample prototype\
    \ is listed below.\n\n```c\ntypedef int (*sy_call_t)(struct proc *, void *);\n\
    ```\n\nAn example system call, kld_syscall, is listed below.\n\n```c\nstatic int\n\
    kld_syscall (struct proc *p, void *arg)\n{\n\tuprintf(\"KLD System Call\\n\");\n\
    \treturn(0);\n}\n```\n\nThe first argument to a system call is always the proc\
    \ structure, which represents the current state of the calling process and is\
    \ defined in /usr/include/sys/proc.h. The second argument contains the parameters\
    \ to the system call. For the kld_syscall example there are none.\n\n## The sysent\
    \ Structure\nEach system call contains a sysent entry in the kernel global sysent\
    \ table. The sysent struct takes two elements. The first element is the number\
    \ of parameters passed to the system call, and the second element is a function\
    \ pointer to the system call.\n"
  mdcn: "\n\n## 延迟计时 (Latency Timer)\n延迟时间是一个 8 位寄存器，定义了总线主可以在 PCI 时钟周期内保留所有权的最小时间。\n\
    \n## 头部类型 (Header Type)\n头部类型寄存器是一个 8 位寄存器，用于定义设备类型。位 7 设置为 0 或 1，定义单功能或多功能。\n\
    \n## BIST\nBIST 寄存器是一个 8 位寄存器，可用于实现内置自检（BIST）的 PCI 设备。\n\n## 基地址寄存器 (Base Address\
    \ Registers)\n基地址寄存器是 32 位寄存器，用于确定设备使用的 PCI 内存映射和 IO 空间。PCI 设备可能有 6 个基地址寄存器，用于利用内存映射或\
    \ IO 地址空间。\n\n## CardBus CIS 指针 (CardBus CIS Pointer)\nCardBus CIS 指针寄存器是一个 32\
    \ 位寄存器，由在 CardBus 和 PCI 总线之间共享硅设备的实现。\n\n## 子系统厂商 ID (Subsystem Vendor ID)\n子系统厂商\
    \ ID 是一个 16 位寄存器，用于唯一标识扩展卡。子系统厂商 ID 从 PCI-SIG 获取。\n\n## 子系统 ID (Subsystem ID)\n\
    子系统 ID 是一个 16 位寄存器，用于为 PCI 设备定义额外功能。子系统 ID 由厂商定义。\n\n## 扩展 ROM 地址 (Expansion ROM\
    \ Address)\n对于包含上电自检（POST）代码、BIOS 和中断服务例程的设备，扩展 ROM 地址寄存器是一个 32 位寄存器，包含 ROM 代码的起始地址和大小。\n\
    \n## 最大延迟 (Maximum Latency)\n最大延迟寄存器是一个 8 位寄存器，指定设备访问 PCI 总线的频率。\n\n## 最小授予 (Minimum\
    \ Grant)\n最小授予寄存器是一个 8 位寄存器，定义了主设备在每次发起操作时希望保留 PCI 总线所有权的时间。\n\n## 中断引脚 (Interrupt\
    \ PIN)\n中断引脚寄存器是一个 8 位寄存器，定义 PCI 设备连接 4 个 PCI 中断请求引脚中的一个。\n\n## 中断线 (Interrupt\
    \ Line)\n中断线寄存器是一个 8 位寄存器，用于识别 PCI 设备中断路由到系统中断控制器上的哪条系统中断线。\n\n## 内核可加载模块 (Kernel\
    \ Loadable Modules)\n### 概述 (Overview)\nFreeBSD 的特性之一是动态内核链接器，它为系统工程师和系统管理员提供了在运行系统中加载和卸载系统调的能力。本附录为编写内核可加载模块（KLD）提供了必要的背景信息。除了涵盖不同类型\
    \ FreeBSD KLD 的细节外，在本附录结束时，你将获得可以用于自己 KLD 的骨架代码。\n\n在本章中，我们将涵盖：\n- KLD 的核心组件\n\
    - 作为 KLD 的系统调用\n- 作为 KLD 的设备驱动\n- KLD 命令\n\n## 内核可加载模块 (Kernel Loadable Modules)\n\
    每个 KLD 包含三个核心组件：Makefile，为构建 KLD 提供了一个简单的环境，并为开发者提供快速原型和构建环境；加载处理函数（load handler\
    \ function），为 KLD 的加载、卸载和系统关闭行为以及模块数据结构提供了入口；以及模块数据结构，包含加载函数的名称和入口点。\n\n当新的 KLD\
    \ 加载到运行的系统时，将根据模块数据结构中的入口点开始 KLD 的动态加载执行。\n\n## Makefile\n构建 KLD 是一个简单的过程，KLD\
    \ 构建的细节位于 /usr/share/mk/bsd.kmod 中的系统包含 makefile 中。你的 Makefile 通过变量 `SRCS` 声明组成\
    \ KLD 的源文件，并通过包含 /usr/share/mk 目录下的系统 makefile，在变量 `KMOD` 中声明 KLD 的名称；其余细节将由你处理。下面列出了一个骨架\
    \ KLD 的示例 make。\n\n```\nSRCS=kld_generic.c\nMOD=kld_generic\n```\n\n```\n.include\
    \ <bsd.kmod.mk>\n```\n\n在声明 SRCS 和 KMOD 变量后，标准的 KLD makefile 会包含 KLD makefile\
    \ 模板 `bsd.kmod.mk`。\n\n## 加载处理函数 (The Load Handler Function)\n加载处理函数在模块加载、卸载或系统关闭时由内核动态链接器调用。加载处理函数的原型定义在\
    \ /usr/include/sys/module.h 中。\n\n```c\ntypedef int (*modeventhand_t)(module_t\
    \ mod, int\n/*modeventype_t/* what, void* arg);\n```\n\n加载处理函数接受三个参数：模块、事件和用户定义的参数。\n\
    \n```c\nstatic int load_handler(struct module *m, int cmd, void* arg)\n{\n   \
    \ int stat = 0;\n\n    switch(cmd)\n    {\n        case MOD_LOAD:\n          \
    \  break;\n\n        case MOD_UNLOAD:\n            break;\n```\n\n## 附录 C (Appendix\
    \ C)\n内核可加载模块\n\n```c\ncase MOD_SHUTDOWN:\n  break;\n\ndef:\n  stat = EINVAL;\n\
    }\n\nreturn(stat);\n```\n\n模块指针是当前加载模块的链表，包含与加载模块相关的信息。命令由 /usr/include/sys/module.h\
    \ 中定义的 `modeventype` 定义。`cmd` 参数代表调用加载处理函数的原因。KLD 加载处理函数在三种条件下被调用。\n\n```c\ntypedef\
    \ enum modeventype {\n  MOD_LOAD,\n  MOD_UNLOAD,\n  MOD_SHUTDOWN\n} modeventype;\n\
    ```\n\n| 命令 (Command) |  (Description) |\n| :--- | :--- |\n| MOD_LOAD | KLD 被加载\
    \ |\n| MOD_UNLOAD | KLD 被卸载 |\n| MOD_SHUTDOWN | 系统正在关闭 |\n\n最后一个参数是用户定义的参数。\n\n\
    ## moduata 结构 (The moduata Structure)\n子系统厂商 ID 是一个 16 位寄存器，用于唯一标识扩展卡。（等，上下文修正：moduata\
    \ 结构包含三个元素。）\n\n```c\ntypedef struct moduata {\n  char *name;\n  modeventype_t\
    \ handler;\n  void *priv;\n} moduata_t;\n```\n\n名称是内核使用的字符串。第二个元素是处理函数。最后一个元素是私有数据。\n\
    \n```c\nstatic moduata_t kld_generic = {\n  \"kld_generic\",\n  load_handler,\n\
    \  NULL\n};\n```\n\n## DECLARE_MODULE 宏 (The DECLARE_MODULE Macro)\nKLD 的核心部分通过\
    \ `DECLARE_MODULE` 宏统一。它接受四个参数。第一个参数代表模块的唯一名称。第二个参数是类型的数据；第三个参数是子系统类型，最后一个参数表示加载顺序。\n\
    \n```c\n#define DECLARE_MODULE(name, data, sub, order) \\\nSYSINIT(name##module,\
    \ sub, order) \\\n  &data)\n```\n\n下面的列表包含一个示例：\n\n```c\nDECLARE_MODULE(kld_generic,\
    \ kld_generic, SI_SUB, SI_ANY);\n```\n\n## 系统调用 (System Calls)\n系统调用是一种特殊的 KLD\
    \ 模块。本节描述了 KLD 系统调用所需的额外组件。\n\n## 系统调用函数 (The System Call Function)\n系统 KLD 包含系统调用函数，它包含两个参数：`proc`\
    \ 结构和系统调用参数。原型如下所示。\n\n```c\ntypedef int (*sy_call_t)(struct proc *, void *);\n\
    ```\n\n示例系统调用 `kld_syscall` 所示：\n\n```c\nstatic int\nkld_syscall (struct proc\
    \ *p, void *arg)\n{\n\tuprintf(\"KLD System Call\\n\");\n\treturn(0);\n}\n```\n\
    \n系统调用的第一个参数总是 `proc` 结构，它代表调用进程当前的状态并定义在 /usr/include/sys/proc.h 中。第二个参数包含系统调用的参数。对于\
    \ `kld_syscall` 示例，没有参数。\n\n## sysent 结构 (The sysent Structure)\n每个系统调用在内核全局 `sysent`\
    \ 表中包含一个 `sysent` 条目。`sysent` 结构包含两个元素。第一个元素是传递给系统调用的参数数量，第二个元素是指向系统调用函数的指针。\n\
    \n"
