    # JNI Layer


    # Overview


    The next phase of development in the DIO appliance project is to make the DIO
    interface Web-aware. The first step toward this is to develop a Java Native Interface
    (JNI) for the DIO interface library. The JNI is a programming interface, included
    in the Java Development Kit (JDK) for FreeBSD, for writing Java native methods
    for calling C/C++ routines.


    +   * Installing the JDK for FreeBSD

    * Defining JNI DIO features

    * Implementing native C data types in Java

    * Implementing the JNI native interface layer for the DIO interface library


    # The JDK


    Before we begin the JNI layer for the DIO interface library, our development environment
    must be configured for Java development. Configuring the development environment
    consists of downloading a copy of the Java Development Kit and setting a few environment
    variables.


    # Getting the JDK


    The first step in developing the JNI layer is obtaining a copy of the JDK. The
    JDK is not a standard item in the FreeBSD distribution but is available in the
    FreeBSD ports. To obtain the latest copy of the JDK, change the working directory
    to the JDK ports directory, `/usr/ports/java/jdk` and execute the following commands:'
  - '[PAGE 145]


    144 Embedded FreeBSD

    Cookbook


    ```

    # cd /usr/ports/java/jdk

    # make

    # make install

    # make clean

    ```


    These instructions can be used to update, build and install any of the

    FreeBSD port packages. The make command retrieves and builds the latest

    version of the specific port. The next step, make install, installs the

    baries on your system. After the port is updated, built, and installed, it''s
    a

    good idea to clean the binaries and temporary build files disk space isn''t

    exhausted. The make clean instruction handles the details of cleaning up

    the build files.


    # The JDK_HOME Environment Variable


    Many of the JDK tools, build environment, and run-time environment

    depend on the JDK_HOME environment variable to run correctly. After

    building and installing the JDK, you''ll want to set your JDK_HOME environ-

    ment variable to the directory where the JDK was installed using the make

    install command. On my development system, the JDK is installed in

    /usr/local/jdk1.1.8. A quick look at my environment using the

    setenv command shows my JDK_HOME environment variable.


    ```

    JDK_HOME=/usr/local/jdk1.1.8

    ```


    A place to set the JDK_HOME environment variable is in your startup

    shell scripts. My account uses the csh; the following line is added to my

    cshrc script so it is set at login.


    ```

    setenv JDK_HOME /usr/local/jdk1.1.8

    ```


    # The Classpath Environment Variable


    The CLPATH environment variable tells the Java Virtual Machine and other

    Java applications (for example, the Java tools located in the jdk1.1.8/bin

    directory) in which directory to find the class libraries, using user-defined

    class libraries. The DIO class libraries are kept in a separate directory in

    /usr/local/dio, the directory used to keep the DIO software.


    ```

    # setenv CLPATH=/usr/local/dio/class

    ```


    The CLPATH variable is set in the login script.'
  - '[PAGE 146]


    # The LD_LIBRARY_PATH Environment Variable


    LD_LIBRARY_PATH is an environment variable where the system''s shared-library
    loader looks for shared libraries before looking in the system''s default shared-library
    directories. The default shared-library search path is /lib, /usr/lib, /usr/local/lib.


    ```

    setenv LD_LIBRARY_PATH=/usr/local/dio/lib

    ```


    As with the JDK_HOME and CLASSPATH environment variables, the LD_LIBRARY_PATH
    variable is set in login startup scripts.


    # Creating the JNI Layer


    In this section we are developing a JNI layer to read and write IO lines and read
    the configured direction of a line. Since we''ve already developed a C interface
    to perform these tasks, an intermediate layer is developed, the JNI, which provides
    the mechanism to call C code from Java code.


    Before we turn the crank and begin emitting mass quantities of Java source code,
    let''s take a look at the procedure for developing our JNI interface. First, we
    need to identify the features that are being called from Java. As previously mentioned,
    they are read line, write line, and read direction. These three capabilities have
    been implemented by the DIO interface as dio_set_line, dio_get_line, and dio_read_direction.
    In addition to the functions, we are going to implement the enums used by these
    C functions. Java doesn''t support enums as a native type, so we''ll need to create
    one.


    ![](img/8be5cdcebf09c36e2285b8e096cda24a_146_0.png)


    With the features defined, we''ll take the first step in developing the JNI layer—defining
    a Java interface for the DIO interface library. The Java interface is a Java class
    that uses native functions as the bridge to call our DIO interface library. The
    Java functions call the native functions, which, in turn, call the C functions.


    After the Java class is defined, the Java compiler, javac, is run, which produces
    the Java class files. Java class files are byte codes typically executed by the
    Java environment.'
