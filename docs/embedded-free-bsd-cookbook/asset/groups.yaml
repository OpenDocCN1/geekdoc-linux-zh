    # PermitEmptyPasswords no


    The PermitEmptyPasswords option specifies whether the server allows

    logging in to accounts with a null password.


    # AllowUsers admin


    The AllowUsers option specifies and controls which users can access

    ssh services.


    # Remote Administration Account


    In to restrict the operation allowed by a remote configuration, the

    only connection allowed remotely is to login via the dioadmin account. The

    diadmin is a special account that runs a custom shell developed in this

    chapter. When the shell is exiting, the user is logged out.


    ```

    dioadmin:*:1002:1002:DIO Administrator:/home/dioadmin:/bin/sh

    ```


    The dioadmin account has its own UID and GID 1002. It is configured

    to run the Bourne Shell. When the Bourne Shell executes, it reads a customized

    file in the user''s home directory called .profile. The dioadmin .profile

    file contains two lines:'
  - "[PAGE 131]\n\n/usr/local/bin/dioshell\nexit\n\nThis effectively allows the user\
    \ to run the dioshhell. When dioadmin exits,\ndioshellcontrol returns to the .profile\
    \ file, and the dioadmin account is logged off.\n\n# The DIOShell\n\nIn the previous\
    \ section we discussed SSH and created a new account to be\nused for the DIO administrator.\
    \ The DIO administrator account is created\nwith a custom shell, the DIOShell,\
    \ which is limited to commands to DIO\noperations. The remainder of this chapter\
    \ deals with the implementation of\nt DIOShell.\n\n# The command_t Structure\n\
    \nThe DIOShell is implemented using a simple command parser. Every com-mand is\
    \ implemented as a command string, a command handler function,\nand a help string.\
    \ The command handler function contains two arguments,\nt complete string entered\
    \ by the user and the command specific string.\n\n```\ntypedef void (* fptr)(char\
    \ *, uint8_t);\n\ntypedef struct {\n    char *command;/* string representing command\
    \ */\n    fptr functionptr; /* pointer to command implementation */\n    char\
    \ *helpstring; /* text help string */\n} command_t;\n```\n\nEvery command is implemented\
    \ by a command_t structure.\n\n# The command table Table\n\nThe command table\
    \ represents all the available commands in the DIOShell.\nEach function is forward\
    \ declared, so the command table may be created.\nThe DIOShell is a table-driven\
    \ utility. User input is parsed, and the first\nargument is matched to the commands\
    \ contained in the command table."
- md: "\n# 131 Chapter Seven\nRemote Management\n\nIf a command is matched, the command\
    \ handler function is called to complete command processing.\n\n```c\nvoid   \
    \ readline_handler(char* args, uint8_t* p);\nvoid    writeline_handler(char* args,\
