    \ GENERIC kernel provides support for PCCARD peripherals. These can be removed.\n\
    \n```bash\n# PCCARD (PCMIA) support\ndevice card\ndevice pcic0 at isa? irq 0 port\
    \ 0x3e0 iomem 0xd0000\ndevice pcic1 at isa? irq 0 port 0x3e2 iomem 0xd4000 disable\n\
    ```\n\n### Serial Port Four serial ports are supported by default. The Roadster\
    \ hardware has two; the first two serial ports are kept for support, administration,\
    \ and debugging.\n\n```bash\n# Serial (COM) ports\ndevice sio0 at isa? port IO_COM1\
    \ flags 0x10 irq 4\ndevice sio1 at isa? port IO_COM2 irq 3\ndevice sio2 at isa?\
    \ disable port IO_COM3 irq 5\ndevice sio3 at isa? disable port IO_COM4 irq 9\n\
    ```\n\n### Parallel Port The parallel port contains printer support, TCP/IP support,\
    \ SCSI support. We keep printer support for debugging and administration.\n\n\
    ```bash\n# Parallel port\ndevice ppc0 at isa? irq 7\ndevice ppbus # Parallel port\
    \ bus (required)\ndevice lpt # Printer\ndevice plip # TCP/IP over parallel\ndevice\
    \ ppi # Parallel port interface device\ndevice vpo # Requires scbus and data\n\
    ```\n\n### Ethernet Controllers are numerous network interface cards built into\
    \ the FreeBSD kernel. The data logger uses one Intel EtherPro 100; other controllers\
    \ may be removed. One important note about the Intel EtherPro 100; other controllers\
    \ may be removed.\n\n(Note: The OCR for the final section was highly repetitive/corrupted;\
    \ I have cleaned the structural elements provided.)\n\n### Pseudo Devices\nPseudo\
    \ devices are devices that are built into the kernel but do not contain any hardware.\
    \ Common uses for pseudo devices are logging, pseudo terminals, nodes and snoop\
    \ devices. The DIO appliance uses the network loopback and ethernet pseudo devices.\n\
    \n```bash\n# Pseudo devices - the number indicates how many units to allocate.\n\
    pseudo-device loop # Network loopback\npseudo-device ether # Ethernet support\n\
    pseudo-device sl 1 # Kernel SLIP\npseudo-device ppp 1 # Kernel PPP\npseudo-device\
    \ tun # Packet tunnel\npseudo-device pty # Pseudo-ttys (telnet etc)\npseudo-device\
    \ md # Memory \"disks\"\npseudo-device gif # IPv6 and IPv4 tunneling\npseudo-device\
    \ faith 1 # IPv6-to-IPv4 relaying (translation)\n```\n\n```bash\n# 'bpf' pseudo-device\
    \ enables the Berkeley Packet Filter.\n# Be aware of the administrative consequences\
    \ of enabling this!\npseudo-device bpf # Berkeley packet filter\n```\n\n## USB\
    \ Support\nUSB support is provided to connect USB devices to FreeBSD. Although\
    \ the Roadster hardware does supply USB ports, the DIO appliance does not use\
    \ the USB bus. Support for USB will be removed.\n\n```bash\n# USB support\ndevice\
    \ uhci # PCI->USB interface\ndevice ohci # OHCI PCI->USB interface\ndevice usb\
    \ # USB Bus (required)\ndevice ugen # Generic\ndevice uhid # \"Human Interface\
    \ Devices\"\ndevice ukbd # Keyboard\ndevice ult # Printer\ndevice umass # Disks/Mass\
    \ storage - Requires scbus and\ndevice ums # Mouse\ndevice usanner # Scanners\n\
    ```\n\n```bash\n# USB Ethernet, requires mii\ndevice aue # ADMtek USB ethernet\n\
    device cue # CATC USB ethernet\ndevice kue # Kawasaki LSI USB ethernet\n```\n"
