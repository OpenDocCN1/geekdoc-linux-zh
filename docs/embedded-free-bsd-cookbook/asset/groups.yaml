    \ length;\n\n    /* verify the command arguments */\n    i = sscanf(iobuf, \"\
    %s %x %x\", &kerneladdr, &length);\n    if (i != 2)\n        return;\n\n    /*\
    \ limit the command to our buffer size * /\\n    if (length > BUFFER_MAX)\n  \
