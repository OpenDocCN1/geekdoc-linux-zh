    \ got his/her setup right. Providing the latter is the case, please refer to the\
    \ Tomcat Documentation for more detailed setup and administration information\
    \ is found in the INSTALL file.\n```\n\nIncluded with this release are a host\
    \ of sample Servlets and JSPs (with My Computer)\n\n## The Tomcat Directory Structure\n\
    \nOnce Tomcat has been installed, it creates a series of directories in the TOMCAT_HOME.\
    \ Let's take a quick look and familiarize ourselves with each of the directories\
    \ and their contents.\n\n### bin\n\nDuring installation, Tomcat installs a series\
    \ of scripts in the TOMCAT_HOME/bin directory for Tomcat administration. Two of\
    \ the used scripts are startup.sh and shutdown.sh. These scripts are used to start\
    \ and stop Tomcat.\n\nStarting Tomcat is performed by the following command:\n\
    \n```\n# cd $CATALINA_HOME/bin\n# startup.sh\n```\n\nStopping Tomcat is performed\
    \ by the following command:\n\n```\n# cd $TOMCAT_HOME/bin\n# shutdown.sh\n```\n\
    \n### doc\n\nThe doc directory contains Tomcat documentation in html format, so\
    \ you can point your browser there and peruse the documentation.\n\n### lib\n\n\
    The lib directory contains jar files used by Tomcat. This lib directory is automatically\
    \ appended to the CLSPATH environment variable.\n\n### logs\n\nThe logs directory\
    \ is used to store Tomcat's logs.\n\n### webapps\n\nBefore venturing into JSP\
    \ syntax, there is one more important detail. Now that Tomcat is running successfully,\
    \ now that Tomcat is running successfully, the location is TOMCAT_HOME/webapps.\n\
    \n### conf\n\nThe conf directory contains configuration files. Two of the most\
    \ used files are server.xml and web.xml.\n\n## JSP Overview\n\nJSP is a technology\
    \ that allows us to develop web pages that display dynamic content. Using the\
    \ JNI object developed in Chapter 8, along with the JSP page developed in this\
    \ chapter, we will be able to develop a web page that displays the DIO lines dynamically.\
    \ In order to display JSP pages we will install and configure a JSP ports collection\
    \ contains Tomcat, a Java-based web server that provides support for JSP.\n\n\
    In this chapter, we will discuss issues related to JSP developing, including:\n\
    \n- Installing the Tomcat server on FreeBSD.\n- Setting up the Tomcat environment.\n\
    - The elements of a JSP page.\n- Developing the DIO JSP interface.\n\n## JSP Syntax\n\
    \nAs mentioned in the previous section, the JSP page looks like:\n\n```html\n\
    <%@ page language=\"java\" contentType=\"text/html\" %>\n<html>\n<head>\n  <title>DIO\
    \ Page</title>\n</head>\n<body>\n  <% out.println(\"Hello DIO!\"); %>\n</body>\n\
    </html>\n```\n\n## Comments\n\nLike all programming languages, JSP provides an\
    \ element for adding comments. A comment is denoted by:\n\n`-- JSP is really cool\
    \ --`\n\n## Directives\n\nJSP directives are used to specify how the JSP page\
    \ is handled. A directive does not produce any visible output. A directive is\
    \ specified by the `<%@ %>` tag. For example, in Listing 9-1, the language was\
    \ selected:\n\n```html\n<%@ page language=\"java\" contentType=\"text/html\" %>\n\
    ```\n\n## Declarations\n\nA declaration allows the programmer to define page level\
    \ variables for storing information that a page may need.\n\n```jsp\n<%! jspvar\
    \ = 27; %>\n```\n\n## Expressions\n\nJSP expressions are used to evaluate expressions\
    \ and convert the result into text for display in the output page. JSP expressions\
    \ use the `<%= %>` tags.\n\n## Code Scriptlets\n\nScriptlets, denoted by the `<%\
    \ %>` tags, are used to run Java code when the page is serviced by the Web server.\
    \ In Listing 9-1, we used a JSP scriptlet to write Hello DIO! to the output page.\n\
    \n```jsp\n<% out.println(\"Hello DIO\\n\"); %>\n```\n\n## The DIO JSP Page\n\n\
    Now that we've taken a look at the JSP syntax, it's time to develop our DIO JSP\
    \ page for displaying the states of DIO lines for your favorite web browser. Let's\
    \ take a look at Listing 9-2. The JSP begins by declaring the language and contentType.\
    \ Once again, the settings are the default values but the JSP code is better understood\
    \ by declaring these here. After the page directive, the JSP page contains a few\
    \ lines of html to set the title page for your browser.\n"
  mdcn: "\n\n## 使用 Tomcat  Web \n\n## 概述\n\n在上一章中，我们为 DIO 应用程序库开发了 JNI 层。这是实现用于监控\
