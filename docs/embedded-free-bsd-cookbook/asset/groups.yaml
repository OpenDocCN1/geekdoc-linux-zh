    ## Midlevel Interface Library


    ### Overview


    In the previous chapter, we developed a FreeBSD device driver to read and write
    the PCI-DIO24 hardware registers and service the controller interrupt. In this
    chapter, we will develop a shared library that uses the DIO device driver and
    serves as the software interface for programming the PCI-DIO24 data acquisition
    board.


    Providing an application interface library isolates the device programming details
    and operating system specifics to the library and device driver. This design enables
    system engineer tasks to interface with the PCI-DIO24 controller using a simple
    C interface and minimizes the impact of changing the underlying hardware or operating
    system.


    Topics discussed in this chapter:


    - Shared libraries

    - Creating and using shared libraries

    - Accessing FreeBSD device drivers

    - Low-level system calls

    - PCI-DIO24 register definitions

    - Design and implementation of the digital IO interface shared library


    ### Shared Libraries


    A shared library is code that is grouped together to provide specific functionality
    that can be reused across multiple programs. For example, without the Standard
    C library, libc, every software engineer would need to write low-level IO routines,
    string routines, math routines, and so forth.


    There are typically two types of libraries developed by system engineers, static
    and shared. If a program is linked to a static library, the components of the
    library become part of the final executable, making the output monolithic. All
    linker symbols are resolved at link time, and the program is self-contained. If
    the library is modified for bug fixes or new features, the application must be
    rebuilt to incorporate the changes to the static library.


    When linking with a shared library, the final executable contains references to
    the shared library. Shared libraries are loaded when a program is run, and the
    symbols are resolved at run-time. If a shared library is modified, only the library
    is replaced. A program can use the updated library next time it runs.


    ### Creating and Using Shared Libraries


    Shared libraries are loaded at run-time and are not linked to a specific address.
    Shared libraries use the same naming conventions as static libraries; the name
    of the shared library is prefixed with `lib`, but the extension is `.so`, instead
    of `.a`, which is used for static libraries.


    When compiling the source code for a shared library, the code must be linked as
    position independent code. This is accomplished by specifying the `-fpic` switch
    to gcc.


    ```bash

    # gcc -c -fpic -o dioif.o dioif.c

    ```


    When building a shared library, gcc needs to know that the output is a shared
    library. This is done by specifying the `-shared` switch. For example, the code
    presented in this chapter is contained in the file `dioif.c`. In order to build
    a shared library, the following line is used:


    ```bash

    # gcc -shared -o libdioif.so dioif.o

    ```


    ### Loading Shared Libraries


    There are two methods for loading shared libraries:


    The first solution is to set the `LD_LIBRARY_PATH` environment variable. This
    adds directories to the search path for the dynamic linker.


    ```bash

    export LD_LIBRARY_PATH=/usr/lib:$LD_LIBRARY_PATH

    ```


    The other solution is to use the `-rpath` flag during linking. This tells the
    executable where to look for libraries at runtime.


    ```bash

    # gcc -Wl,-rpath,/usr/lib -o program main

    ```


    ### Accessing the Device Driver


    A device driver is a kernel extension that is inaccessible to a user. Access to
    drivers is provided through special files. In the previous chapter, we developed
    a driver for the PCI-DIO24. In this section, we will look at the necessary details
    to access the device driver.


    ### Device Files


    In FreeBSD, all input and output is performed by file operations. Devices are
    represented by special files called device files. A device file appears as a regular
    filename to an application, but it is bound to a specific device through a device
    number. A device number is derived from the major and minor numbers.


    Let''s take a look at the device files for the standard ATAPI disk, ad0. If you
    issue the `ls -1 ad0*` command in the /dev directory, you''ll see the following
    with two numbers. These are the major and minor numbers.


    ```

    crw-r-- 2 root operator 116 0 Oct 24 17:07 ad0a

    crw-r-- 2 root operator 116 1 Oct 24 17:07 ad0b

    crw-r-- 2 root operator 116 2 Oct 24 17:07 ad0c

    crw-r-- 2 root operator 116 3 Oct 24 17:07 ad0d

    crw-r-- 2 root operator 116 4 Oct 24 17:07 ad0e

    crw-r-- 2 root operator 116 5 Oct 24 17:07 ad0f

    crw-r-- 2 root operator 116 6 Oct 24 17:07 ad0g

    crw-r-- 2 root operator 116 7 Oct 24 17:07 ad0h

    ```


    The device ad0 is an ATAPI hard disk with major number 116. Minor 0 through 7
    represent different partitions on the hard disk.


    ### Device System Calls


    A FreeBSD device driver is accessed through a standard set of low-level IO system
    calls. Once a program opened the device file for a specific device, the program
    is able to access the device driver and a standard set of low-level IO system
    calls in FreeBSD. These calls are listed in the following sections.


    ### The System Call


    Before a program can access a device descriptor and physical hardware, it must
    obtain a file descriptor. A file descriptor is obtained by opening the device
    file with the open system call.

