    \ 为 0 的进程 ID 将信号发送给发送进程进程组的所有成员。PID 为 -1 的进程 ID 将向所有进程发送信号（除非是超级用户）。执行成功时，`kill`\
    \ 返回 0，错误时返回 -1。\n\n# 守护进程 (Daemons)\n\n守护进程是一个在后台运行的特殊进程。守护进程通常在启动时创建并持续运行。\n\
