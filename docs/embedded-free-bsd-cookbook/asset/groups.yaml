    administration@pcisig.com


    ## PCI 配置寄存器


    本节提供了 PCI 设备配置头和 PCI 配置寄存器的描述。任何功能性 PCI 设备都包含一个 64 个双字的块，称为 PCI 配置头。前 16 个双字由
    PCI 规范定义，称为配置头区域。


    PCI 配置头区域可以有两种格式，称为类型 0 或类型 1。头类型 1 用于 PCI-to-PCI 桥接器。头类型 0 用于所有所有其他设备。图 B-1 展示了类型
    0 PCI 设备寄存器的格式。


    | 偏移量 | Byte3 | Byte2 | Byte1 | Byte0 |

