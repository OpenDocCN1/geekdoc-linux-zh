    # Daemons\n\n## Overview\n\nA feature of Internet appliances is that they can\
    \ be monitored and configured via the Internet. This chapter begins a series of\
    \ chapters that focuses on implementing Internet access to the DIO appliance through\
    \ Internet interfaces and protocols, such as sockets, SSL, and Java Server Pages.\
    \ This chapter shows how to implement a socket-based daemon and a custom protocol\
    \ used by remote clients to communicate with the DIO appliance. Topics covered\
    \ include:\n\n- introduction to TCP/IP\n- sockets\n- digital IO protocol\n- DIOD\
    \ server daemon\n\n## Introduction to TCP/IP\n\nTCP/IP is a protocol used by computers\
    \ to exchange information over a network. TCP/IP development was funded by the\
    \ Department of Defense (DoD) in the 1970s, in order to provide a method to share\
    \ research information for the DoD. Since that time, TCP/IP has grown to become\
    \ the major protocol of the Internet. One of the major benefits of TCP/IP is that\
    \ it provides a defined method for a heterogeneous system to exchange information.\n\
    \nBefore jumping into the details of TCP/IP, let's look at a few definitions and\
    \ background information. Each computer, or endpoint, connected to a network is\
    \ referred to as a host. The TCP/IP protocol defines the set of rules for the\
    \ process of transferring data between hosts. Because of the complexity of the\
    \ protocol, it is defined in layers. TCP/IP consists of four layers, each responsible\
    \ for a different aspect of the communication and its own protocol. These combined\
    \ layers are commonly referred to as the TCP/IP stack.\n\n| Application Layer\
    \ |\n| :--- |\n| Transport Layer |\n| Network Layer |\n| Link Layer |\n\nFigure\
    \ 6-1. TCP/IP Stack\n\n## TCP/IP Stack\n\nEach layer on the transmitting host\
    \ has a peer-to-peer relationship with the receiving host. Every layer is responsible\
    \ for a specific aspect of communication, as physical transfer of data, addressing,\
    \ routing, flow control, and data organization/reorganization.\n\n| Application\
    \ |\n| :--- |\n| Transport |\n| Network |\n| Link |\n\n![](img/8be5cdcebf09c36e2285b8e096cda24a_105_0.png)\n\
    \nFigure 6-2. Peer-to-Peer Relationship\n\nThe following sections describe each\
    \ of the four TCP/IP layers in more detail.\n\n## Link Layer\n\nAt the bottom\
    \ of the TCP/IP stack is the Link Layer. It handles the physical aspects of data\
    \ transfer and provides a reliable, error-free transmissions medium. The link\
    \ layer is comprised of hardware and software represented by the network interface\
    \ controller (NIC) and the device driver in the operating system. Each NIC is\
    \ independently addressable, using a unique hardware-address.\n\nThere are numerous\
    \ hardware implementations of the Link Layer, which include, but are not limited\
    \ to, Ethernet, token ring, FDDI, and serial lines. Each different hardware implementation\
    \ uses an independent addressing scheme. The Link Layer provides an independent\
    \ mechanism to send higher layer protocol data and to resolve higher layer protocol\
    \ addresses.\n\n## Network Layer\n\nThe network layer of the TCP/IP stack is implemented\
    \ using the Internet Protocol (IP). IP is a connectionless, unreliable protocol.\
    \ It is connectionless because there is no state information maintained for successive\
    \ packets and unreliable, because there is no guarantee that a packet arrives\
    \ at its destination. The purpose of the IP layer is to provide a constant addressing\
    \ scheme for sending and receiving data packets and a mechanism to map between\
    \ IP addressing and the underlying Link Layer addressing.\n\nIn the previous section,\
    \ we mentioned that the Link Layer consists of a variety of different hardware\
    \ addressing schemes. The IP protocol defines a consistent addressing method,\
    \ the IP address, and protocols to map IP addresses to the underlying hardware\
    \ addresses. These protocols are known as Address Resolution Protocol (ARP), Reverse\
    \ Address Resolution Protocol (RARP), and Internet Control Message Protocol (ICMP).\n\
    \n## IP Addressing\n\nAn IP address is a unique 32-bit number used for addressing.\
    \ An IP address is written as four octets—i.e., 192.0.0.1.\n\nThere are five different\
    \ classes of IP addresses: Class A, Class B, Class C, Class D, and Class E. Each\
    \ class is distinguished by the upper bits of the address. The different classes\
    \ are used to distribute different numbers of bits between the network ID and\
    \ the host ID.\n\nThree classes of addresses are used by the IP layer: unicast,\
    \ multicast, and broadcast. Unicast addresses are destined for a single host.\
