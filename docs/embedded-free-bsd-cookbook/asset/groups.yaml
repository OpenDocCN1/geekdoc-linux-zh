    # Device Files


    In FreeBSD, all input and output is performed by file operations. Devices are
    represented by special files called device files. A device file appears as a regular
    filename to an application, but it is bound to a specific device driver through
    a device number. A device number is derived from the device major and minor numbers.
    The major number identifies the device driver bound to a specific device. A minor
    number identifies a sub device for the major devices. The minor number is used
    by the device driver to determine which device to send the IO request.


    Let''s take a look at the device files for the standard ATAPI disk driver, ad0.
    If you issue the `ls -1 ad0*` commands in the /dev directory, you''ll see the
    following with two numbers separated by commas. These are the major and minor
    numbers.


    ```

    crw-r-- 2 root operator 116 0 Oct 24 17:07 ad0a

    crw-r-- 2 root operator 116 1 Oct 24 17:07 ad0b

    crw-r-- 2 root operator 116 2 Oct 24 17:07 ad0c

    crw-r-- 2 root operator 116 3 Oct 24 17:07 ad0d

    crw-r-- 2 root operator 116 4 Oct 24 17:07 ad0e

    crw-r-- 2 root operator 116 5 Oct 24 17:07 ad0f

    crw-r-- 2 root operator 116 6 Oct 24 17:07 ad0g

    crw-r-- 2 root operator 116 7 Oct 24 17:07 ad0h

    ```


    The device ad0 is an ATAPI hard disk with major number 116. Minor 0 through 7
