    # Chapter Five

    Midlevel Interface Library


    ```

    #include <fcntl.h>

    open(const char *path, int flags, ...);

    ```


    The path argument is the name of the device file for a specific device driver.

    The flags parameter is a mask that specifies how the file is to be opened.

    The flags are defined in the header file fcntl.h.


    The open system call returns a file descriptor if the call is successful or -1

    A file may not be opened if the file does not exist or a user does

    ot have permission to access the file. If an error occurs, the system variable

    errno is set to the appropriate value.


    # The close System Call


    After a program has finished accessing a device, the file descriptor should be

    closed. This allows the file descriptor to be reused. If the device driver\provides
    exclusive access, closing the device will allow another program to

    access the device.


    ```

    #include <unistd.h>

    int close(int d);

    ```


    The system call takes a single parameter, a file descriptor obtained by

    t open system call. Close returns 0 on success and -1 otherwise. If an

    error occurs, the system variable errno is set to the appropriate value.


    # The io System Call


    ioctl is an all-purpose interface for controller hardware. A device driver

    can provide a specific function through the use of the ioctl function.

    Using an ioctl function generally requires detailed knowledge of the

    device being used.


    ```

    #include <sys/ioctl.h>

    int ioctl(int d, unsigned long request, char* argp);

    ```


    Here, ioctl takes a file descriptor returned by the open system call. The sec

    argument is a request code defined by the device being used. The third

    argument is a pointer to a buffer provided for arguments requested for the request.


    ioctl returns -1 if an error occurs. If an error occurs, the system variable

    errno is set to the appropriate value.'
  - '[PAGE 84]


    # The read System Call


    Input is performed by calling the read system call. The read system call takes
    a buffer and receives data from the device driver.


    ```

    #include <sys/types.h>

    #include <sys/uio.h>

    #include <unistd.h>

    ssize_t read(int d, void *buf, size_t nbytes);

    ```


    The first parameter to read is a file descriptor provided by the open system call.
    The second argument is a buffer to return the data being read. The last argument
    is the number of bytes being read.


    Read returns the number of bytes read or -1 if an error occurs. If an error occurs,
    the system variable errno is set to the appropriate value. Read will return 0
    if an end of file is encountered.


    # The write System Call


    Output is performed by the write system call. The write system call takes a buffer
    pointer and length and passes it to the driver.


    ```

    #include <sys/types.h>

    #include <sys/uio.h>

    #include <unistd.h>

    ssize_t write(int d, const void *buf, size_t nbytes);

    ```


    The first parameter to read is a file descriptor provided by the open system call.
    The second argument is a buffer to return the data being written. The last argument
    is the number of bytes being written. Write returns the number of bytes written
    or -1 if an error occurs. If an error occurs, the system variable errno is set
    to the appropriate value.


    # PCI-DIO24 Hardware Registers


    Developing the interface library for the PCI-DIO24 board, we must have a thorough
    understanding of the hardware registers. Hardware registers are special memory
    locations provided by a controller or used to control the hardware. The PCI-DIO24
    contains five hardware registers. Each register is located in PCI configuration
    space.'
