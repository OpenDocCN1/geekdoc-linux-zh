    在本章中，我们讨论了使用第三方硬件和开源软件来开发网络设备。书的其余部分重点关注使用 FreeBSD 开发 DIO 网络设备。每一章都讨论一个与嵌入式系统开发相关的话题并提供解决方案。到书结束时，我们将开发出一个可以工作的设备。\n\
    \n## 系统编程\n\n### 概述\n\nFreeBSD 中任何编程任务的基础都是进程，它是一个正在执行的程序。它可以是一个提供文件的网络文件系统 (NFS)\
    \ 守护进程、一个 gcc 编译或显示日期的 shell——所有这些任务都在进程上下文中执行。理解进程对于掌握后续章节中介绍的概念至关重要。本章介绍了使用进程的系统编程。\n\
    \n许多系统服务由一种被称为守护进程（daemon process）的特殊类型进程提供。作为进程讨论的一部分，我们将查看守护进程的特征并为守护进程编写骨架源码。在本章中我们将涵盖以下主题：\n\
    \n- FreeBSD 进程\n- 进程的与终止\n- 进程属性\n- 守护进程\n\n## 进程\n\n运行中的程序是进程的一个实例。FreeBSD 内核提供的众多特性之一是称为用户模式（User\
    \ Mode）的保护环境。在用户模式下，进程无法访问硬件或受保护的系统变量。如果进程尝试访问受保护的内存，该进程将被终止。运行在内存中的进程由五个段组成：文本段、初始化数据段、未初始化数据段、栈和堆。\n\
    \n文本段通常是只读，包含程序的机器指令。初始化数据段包含由程序文本预初始化的变量。未初始化数据（传统称为 bss）是未初始化的数据。栈用于在函数之间传递参数，并包含局部变量和函数返回地址。堆是操作系统提供的区域，用于动态内存分配。\n\
    \n我们可以通过调用 `size` 命令查看程序各个段的大小。`hostname` 的 `size` 命令输出如列表 2-1 所示。\n\n图 2-1. 内存中运行的进程\n\
    \n| size hostname | data | bss | dec | hex |\n|---|---|---|---|---|\n| 39452 |\
    \ 4020 | 1968 | 45440 | b1b80 |\n\n列表 2-1\n\n输出显示文本大小为39452 字节，数据段为 4020 字节，bss\
    \ 大小为 1968 字节。栈和堆由操作系统为每个进程分配。文本段和数据段包含数据。由于 bss 段是未初始化的，镜像仅包含其大小；当程序加载时，操作系统会将内存设置为零。\n\
    \n## 进程创建\n\n当创建一个进程时，会创建一个原始进程（称为父进程）的完整拷贝。新创建的进程被称为子进程。一旦进程创建完成，子进程就会被调度执行。这产生了同一程序的两个运行实例。进程之间只能通过进程标识符进行区分。\n\
    \n## fork 系统调用\n\n当运行中的进程调用 `fork` 系统调用时，会创建一个新进程。`fork` 系统调用是创建新进程的唯一方法。\n\n\
    ```c\n#include <sys/types.h>\n#include <unistd.h>\n```\n\n```c\npid_t fork(void);\n\
    ```\n\n`fork` 返回子进程的标识符 (PID) 给父进程，向新创建的子进程返回 0。进程继承以下属性：进程组 ID、访问组、工作目录、控制终端、资源、定时器、资源限制、文件模式掩码和信号掩码。\n\
    \n## execve 系统调用\n\n`execve` 系统调用用于运行新程序。\n\n```c\n#include <unistd.h>\nint execve(const\
    \ char *path, char *const argv[], char *const envp[]);\n```\n\n`execve` 系统调用三个参数；path\
    \ 是新程序的路径和文件名；argv 传递给程序的参数字符串；envp 环境变量列表。`execve` 系统调用在出错时返回 -1。`execve` 系统调用在标准\
    \ C 库中有许多封装，被称为 exec 系列。\n\n## 进程终止\n\n进程可以通过调用 `exit` 故意终止，也可以通过接收信号意外终止。无论原因如何，当进程终止时，都会向父进程返回通知。如果父进程没有接收通知，子进程将变成僵尸。直到父进程检索孩子的退出状态。\n\
    \n## _exit 系统调用\n\n当程序调用 `_exit` 系统调用时，进程将终止。`_exit` 系统调用会导致父进程抛出 SIGCHLD 信号。\n\
    \n```c\n#include <unistd.h>\n\nvoid _exit(int status);\n```\n\n`_exit` 系统调用永远不会返回。`_exit`\
    \ 系统调用通常由库函数 exit 调用。\n\n## wait 系统调用\n\n`wait` 系统调用允许父进程检查子进程的终止信息是否可用。`wait`\
    \ 将挂起执行直到子进程返回。\n\n```c\n#include <sys/types.h>\n#include <sys/wait.h>\n```\n\n\
    ```c\npid_t wait(int status);\n```\n\n成功时，子进程标识符 (PID) 返回给父进程，如果出错则返回 -1。孩子的退出状态通过\
    \ `status` 参数返回。\n\n## 示例\n\n列表 2-1 阐了 fork、wait、execve 和 exit 调用的用法。父进程通过 fork\
    \ 系统调用创建子进程。主程序中有两个路径，一个用于父进程，另一个用于子进程。\n\n```c\nint main(int argc, char **argv)\
    \ {\n    pid_t pid;\n    int status;\n\n    if ((pid = fork()) > 0) {\n      \
    \  printf(\"%d: waiting for the child\\n\", pid);\n        wait(&status);\n  \
    \  }\n}\n```\n\n"
