    # Getting Started


    # Overview


    Embedded computer systems permeate all aspects of our daily lives. Alarm clocks,
    coffee makers, digital watches, cell phones, and automobiles are just a few of
    the devices that make use of embedded systems. The design and development of such
    systems is unique, because the design constraints are different for each system.
    Essential to the development of an embedded system is an understanding of the
    hardware and software used for development.


    # Embedded Systems


    An embedded system consists of hardware and software designed to solve a specific
    application. Many applications consist of more than simple computer hardware and
    software. For example, an industrial vision system designed to control a robotic
    arm consists of an embedded computer, camera, display, and the robotic arm. Each
    of these components are embedded systems on their own.


    Embedded systems have evolved over the years from simple self-contained, single-purpose
    systems to fully integrated, web-aware systems. The rapid changes in technology
    and added requirements have caused developers to take a new approach to the design
    and development of these systems. Let''s take a quick look at how the product
    markets and requirements have evolved.


    Classic embedded systems have been considered dedicated solutions to a single
    application. In these classic systems, the hardware was custom designed to solve
    a specific application and the operating system was'
- md: '

    # 2 Embedded FreeBSD Cookbook


    developed internally. All the software was self-contained in nonvolatile RAM and
    there was a limited user interface. Examples of these types of embedded systems
    are microwave ovens, MP3 players and cell phones.


    ![](img/8be5cdcebf09c36e2285b8e096cda24a_5_0.png)


    Microwave Oven


    Figure 1-1. Classic embedded system


    As the Internet grew, the requirements of embedded systems also began to grow
    in complexity. In addition to solving classic embedded problems, system designers
    were required to add connectivity for sending and receiving data or providing
    an automated method for software upgrades. Rather than increase the development
    effort, system designers have moved toward third-party hardware and evaluating
    open source software. Examples of these next-generation embedded systems are load
    balancers, Virtual Private Networks (VPN) and Ethernet switches.


    ![](img/8be5cdcebf09c36e2285b8e096cda24a_5_1.png)


    Figure 1-2. Load Balancer


    # Internet Appliances


    Many of the embedded systems developed today are what would be called servers
    just a few years ago. These systems are developed using PC hardware, run an embedded
    application, have Internet connectivity, and run network services for remote configuration.
    These latest incarnations of embedded systems are called Internet appliances.


    # 3 Chapter One Getting Started


    Network connectivity requires the addition of network protocols, services, and
    networking hardware. Web services require the addition of more complex application
    software. These additional requirements significantly increase the hardware cost,
    development, and complexity of embedded systems development.


    The added performance requirements add scalability to the list of system requirements,
    further limiting the choice of solutions of computer design. Additionally the
    investment of developing an embedded system must be protected; as the hardware
    evolves, the final choice of hardware and software must be compatible from release
    to release. With the rapid development schedules of the high-tech sector, hardware
    and software solutions must be flexible enough to meet the needs of evolving markets
    and customers.


    To address the increased complexity of embedded systems, a new category has become
    popular—the appliance server. An appliance server is a network-embedded computer
    designed to perform a single task and provide superior performance and higher
    reliability than a general-purpose server. Applications ideal for appliance servers
    include VPN, network attached storage (NAS), and load balancing.


    # Development Issues


    While the cost of computer components and time to market continue to decrease,
    functionality and features for a typical embedded system continue to increase.
    In order to respond to this, many project developers choose to use third-party
    hardware and open-source software and develop only those components that provide
    value-added features. The classic model of embedded systems development using
    custom hardware and homegrown operating systems has been replaced in many of the
    systems being developed today. Let''s take a look at a few of the development
    issues related to embedded systems relying on third parties for some of the core
    components.


    # Compatibility of upgrades


    By choosing third-party hardware and open-source software, a system designer ensures
    access to compatible technology from multiple vendors and allows the completed
    system to be developed quicker and for a lower cost. Systems designers can focus
    resources toward developing their application, rather than keeping resources focused
    on maintaining the operating system or developing the next hardware platform.


    4 Embedded FreeBSD Cookbook


    # Time to market


    An open-source operating system reduces the time to qualify and develop the software
    solution. The server appliances address increased time pressure to market and
    hardware flexibility by using an increasingly rich set of third-party hardware
    and software. By relying on readily available hardware and software, the server
    appliance developer can focus on solving the application.


    # Labor pool


    The increased complexity of Internet appliances requires the transition from simple
    embedded tools to an off-the-shelf integrated development environment with tools
    that facilitate the development of secure, reliable, and long-running systems.
    Additionally, an off-the-shelf integrated development environment reduces the
    time to market, as well as training time.


    # Licensing


    Traditional real-time operating system software licenses restrict the source to
    the licensee and may require a royalty fee for distribution. In contrast, open-source
    software licenses allow the licensee to make the software freely available to
    anyone who wishes to use it.


    # The DIO Server Appliance


    The remainder of this chapter discusses an Internet appliance that will be developed
    in this book, the digital input-output (DIO) server appliance. The DIO server
    appliance is an embedded system that provides the capability to read and write
    digital IO lines. The digital lines are monitored via the Internet using sockets,
    a secure command shell, or a browser.


    The software uses an open-source operating system and tools, FreeBSD 4.4 and the
    GNU development suite. The system software and application


    ![](img/8be5cdcebf09c36e2285b8e096cda24a_7_0.png)


    # Chapter One

    Getting Started


    are developed in the remaining chapters of this book, presenting the design,

    development, and implementation of an actual server appliance.


    The hardware to develop the DIO server appliance is a standard PC and a

    third-party digital IO acquisition card. The boot device is a Compact-Flash

    adapter and CompactFlash card, which can be purchased over the Internet.


    # Software


    # FreeBSD


    FreeBSD is an optimal solution for Internet appliances and other embedded

    systems that require Internet connectivity, networking performance, and

    reliability. Additionally, FreeBSD comes with an industry standard set of soft-

    and configuration management tools and application

    software. It is a Unix-compatible, open-source operating system that offers

    unprecedented reliability and security. It runs some of Internet''s best

    web sites, such as Yahoo! and Hotmail, and supplies the basis of embedded

    products like the AMI Storends NAS and the IBM Whistle/Interjet II.


    The core of FreeBSD is largely based on BSD/OS, which was developed in

    the mid-1970s and is known for excellent support, stability, small footprint,

    and simple installation. Much of the early BSD Unix development was

    funded by DARPA to support the development of Internet protocol, TCP/IP.


    FreeBSD, as implied by the name, is free of charge. It can be down-loaded directly
    from the FreeBSD website at ftp://ftp.FreeBSD.org/pub/FreeBSD.

    Or, if you''re like me and want to have an actual CD, as well as support the

    FreeBSD effort, there are a number of retail outlets where FreeBSD can be

    purchased, such as the BSD Mall, http://www.bsdmall.com/freebsd.html,

    or a number of local retail outlets as Staples, CompUSA and Fries.


    Besides providing financial support by purchasing an official release,

    there is yet another way to support FreeBSD. The FreeBSD distribution

    is an open source project. If you are interested, you can contribute time

    to source code development. FreeBSD can be found on the FreeBSD website,

    http://www.freebsd.org/doc/en_US/articles/contributing/index.html.


    In addition to its mature networking technology, the FreeBSD kernel

    contains support for many disk and management facilities and secure

    networking protocols.


    # 6 Embedded FreeBSD Cookbook


    The features and benefits of FreeBSD are summed up in the following paragraphs.


    - Security FreeBSD offers security features that make it suitable for e-commerce
    applications, secure Internet transmission, and virtual private networks. Many
    fixes to security-related bugs have been incorporated into FreeBSD over the years,
    to ensure it is suitable for security-critical environments.

    - Robustness FreeBSD is based on software that has been in development for more
    than 20 years. Its continued development is focused on quality rather than quantity,
    and changes to the core software are carefully controlled. The FreeBSD kernel
    and its features represent the highest quality embedded operating system on the
    market.

    - Small Footprint FreeBSD is fully customizable and may be configured to run with
    an absolute minimum of software, lending it to some of the most limited embedded
    applications. PicoBSD, a targeted version of FreeBSD, contains fully bootable
    systems that fit on a floppy disk. In addition to the flexibility, many embedded
    systems boot from a DiskOnChip CompactFlash device. Many of these devices are
    readily supported by FreeBSD.

    - License FreeBSD is distributed using the BSD License, which permits, but does
    not require, the sharing of the source code. Because of the BSD license, and the
    fact many embedded systems require the inclusion of proprietary technology included
    with these systems, or intrinsic to the design itself, such as on-board custom
    components, BSD systems tend to be a superior choice relative to other Open Source
    systems, where such intellectual property cannot be kept private due to licensing
    issues.


    # GNU Development Tools


    The standard FreeBSD distribution contains the GNU suite of development tools,
    consisting of compilers, linkers, libraries, debuggers, performance management,
    and configuration management tools. In addition to their depth, the GNU tools
    provide updates and numerous support options, in the form of mailing lists and
    news groups.

