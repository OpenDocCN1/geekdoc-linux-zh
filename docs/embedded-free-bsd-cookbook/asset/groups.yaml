    \ 设置 Tomcat 环境。\n- JSP 页面的元素。\n- 开发 DIO JSP 接口。\n\n## Tomcat\n\n与上一章中的 JDK 类似，我们的第一步是下载并安装提供\
    \ JSP 支持的 Tomcat 服务器。Tomcat 位于端口程序集中，并可以使用标准的端口安装程序进行下载、安装和配置。让我们现在回顾一下这些步骤。\n\
    \n## 安装 Tomcat\n\n在我系统中安装的 Tomcat 版本是 Tomcat 3.2.3。\n\n```\n# cd /usr/ports/www/jakarta-tomcat\n\
    # make\n# make install\n# make clean\n```\n\n这些指令可用于更新、构建和安装任何 FreeBSD 端口包。`make`\
    \ 命令检索并构建特定端口的最新版本。下一步 `make install` 将二进制文件安装到你的系统中。在端口更新并安装后，清理二进制文件和临时构建文件是一个好习惯，防止磁盘空间耗；`make\
    \ clean` 会处理清理构建文件的细节。\n\n## TOMCAT_HOME 环境变量\n\n一旦编译并安装了 Tomcat 端口，就需要设置环境。这包括设置\
