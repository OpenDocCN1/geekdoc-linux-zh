    \ 2-1.\n\nFigure 2-1. Process Running in Memory\n\n| size hostname | data | bss\
    \ | dec | hex |\n|---|---|---|---|---|\n| 39452 | 4020 | 1968 | 45440 | b1b80\
    \ |\n\nListing 2-1\n\nThe output shows the text size as 39452 bytes, the data\
    \ section as 4020 bytes and bss size of 1968 bytes. Stack and heap are assigned\
    \ by the operating system for each process. The text and data sections contain\
    \ data. Since the bss section is uninitialized, the image only contains its size;\
    \ memory is set to zeros by the operating system when the program is loaded.\n\
    \n## Process Creation\n\nWhen a process is created a complete copy of the original\
    \ process, known as the parent, is created. The newly created process is called\
    \ the child. Once process creation is completed, the child process is scheduled\
    \ to execute. This yields two running instances of the same program. The processes\
    \ can only be differentiated by the process identifier.\n\n## The fork System\
    \ Call\n\nA new process is created when a running process invokes the `fork` system\
    \ call. The `fork` system call is the only way to create a new process.\n\n```c\n\
    #include <sys/types.h>\n#include <unistd.h>\n```\n\n```c\npid_t fork(void);\n\
    ```\n\nFork is unique in the single call to fork returns the process identifier\
    \ (PID) of the child to the parent process, and returns 0 to the newly created\
    \ child. When a process is created, the following list of attributes is inherited\
    \ from the parent: process group ID, access groups, working directory, root directory,\
    \ control terminal, resources, interval timers, resource limits, file mode mask,\
    \ and signal mask.\n\n## The execve System Call\n\nThe execve system call is used\
    \ to run the new program.\n\n```c\n#include <unistd.h>\nint execve(const char\
    \ *path, char *const argv[], char *const envp[]);\n```\n\nThe execve system call\
    \ takes three parameters; path is the path and filename of the new program; argv\
    \ contains the argument string to pass to the program; envp contains a list of\
