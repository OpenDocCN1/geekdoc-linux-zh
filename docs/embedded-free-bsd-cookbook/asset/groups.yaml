- md: "\n## SYSCALL_MODULE Macro\n\nThe final task for creating a system call module\
    \ is to declare the module. The macro used to define a system call is the SYSCALL_MODULE\
    \ defined in `/usr/include/sys/systent.h`. The SYSCALL_MODULE macro gets passed\
    \ the following parameters:\n\n| Argument | Description |\n|---|---|\n| name |\
    \ Name is a generic name used for the system call. |\n| offset | Offset is the\
    \ system call number. This is the index into the kernel global systent structure.\
    \ |\n| systent | The systent structure defined for this system call. |\n| evh\
    \ | The load handler function name. |\n| arg | This is reserved and usually set\
    \ to NULL. |\n\nThe copymem SYSCALL_MODULE declaration is contained in Listing\
    \ 3-10.\n\n```\n/* declare the system call */\nSYSCALL_MODULE(copymem, &syscall_num,\
    \ &copymem_systent, load, NULL);\n```\n\nListing 3-10\n\nThe SYSCALL_MODULE macro\
    \ takes five arguments:\n\nCopymem is a unique name for the KLD. The second parameter\
    \ syscall call number, which also represents the offset in the kernel global systent\
    \ structure containing system calls. The third parameter contains the systent\
    \ structure for the new system call. The fourth argument is a pointer to the load\
    \ handler for this KLD. The fifth and final argument represents a pointer for\
    \ the user-defined KLD data to the load handler.\n\n## A Simple Debugger\n\nIn\
    \ the previous section we created a new system call that provides a mechanism\
    \ for a user program to read and write kernel memory. The remainder of this chapter\
    \ defines a program that implements a simple command parser, giving us a utility\
    \ for reading and modifying kernel memory.\n\n## Command Definitions\n\nThe copymem\
    \ utility is command driven. To simplify command parsing, a structure data type\
    \ is defined, command_t, which contains an ASCII command string, a function pointer,\
    \ and a help string.\n\n```\n/*\n ** command definition\n */\ntypedef struct {\n\
    \    char *command;        /* string representing command */\n    fptr functionptr;\
    \     /* pointer to command implementation*/\n    char *helpstring;     /* text\
    \ help string */\n} command_t;\n```\n\nListing 3-11\n\nThe command element contains\
    \ an ASCII string that is used to compare the command with user input. The function\
    \ pointer contains a pointer to a routine that implements the command.\n\n```\n\
    /*\n ** command function pointer definition\n */\ntypedef void (*fptr)(int, char\
    \ *);\n```\n\nListing 3-12\n\nThe command type, fptr, is defined as the prototype\
    \ for all command handlers. Every command is passed by two parameters. The first\
    \ parameter is the system call number. Because copymem is a KLD system, there\
    \ is no system call wrapper, the system is made by using the syscall system call.\
    \ It takes the system call number and system call parameters and performs the\
    \ system call as defined in the previous section.\n\n```c\n#include <sys/syscall.h>\n\
    #include <unistd.h>\nint syscall(int number, ...);\n```\n\nThe second is the command\
    \ string entered by the user. Every command handler is self-contained so each\
    \ command handler parses its own arguments from the command string.\n\n## Command\
    \ Table\n\nThe command table represents all the commands implemented by the copymem\
    \ utility. Our implementation of the copymem utility has four commands: read kernel\
    \ memory, write kernel memory, quit, and help.\n\nA command table is defined so\
    \ the parser can iterate through all the commands after receiving user input.\
    \ All the command handlers are forward declared so we can declare our command\
    \ table.\n\n```c\n/*\n **\n */\nvoid table definition\nvoid read_handler(int num,\
    \ char* args);\nvoid write_handler(int num, char* args);\nvoid quit_handler(int\
    \ num, char* args);\nvoid help_handler(int num, char* args);\n\ncommand_t commands[]\
    \ = {\n  \"read\", read_handler, \"read address length - reads memory\",\n  \"\
    write\", write_handler, \"write address length - writes memory\",\n  \"quit\"\
    , quit_handler, \"quit - exits program\",\n  \"help\", help_handler, \"help -\
    \ displays command help\", /* terminating record */\n  NULL, 0, NULL\n};\n```\n\
    \nListing 3-13\n\nThe command table contains all the implemented commands. Each\
    \ entry in the command table links the ASCII command with its command handler\
    \ and help string.\n\nAdding a new command is straightforward. Declare the command\
    \ handler and add the ASCII string, command handler, and help string to the command\
    \ table. After adding the entry to the command table, implement the command handler.\n\
    \n## The dumpmem Function\n\nThe dumpmem function, contained in Listing 3-14,\
    \ is a utility function that dumps memory in hexadecimal and ASCII character format.\
    \ Dumpmem is called by the read_handler function to display the request kernel\
    \ memory.\n\n```c\n/*\n** name: dumpmem\n** effect: dumps memory in hexadecimal\
    \ and ASCII formats\n */\nstatic int32_t\ndumpmem(uint32_t kernp, uint8_t* user,\
    \ uint32_t len)\n{\n    int32_t i, j;\n    int32_t rows = len / CHARS_PER_ROW;\n\
    \    uint8_t *ptr = (uint8_t *)user;\n\n    printf(\"\\n\\n\");\n\n    for (i\
    \ = 0; i < rows; i++) {\n        uint32_t kernaddr;\n\n        kernaddr = kernp\
    \ + (i * CHARS_PER_ROW);\n\n        printf(\"%08x: %s\", kernaddr);\n\n      \
    \  for (j = 0; j < CHARS_PER_ROW; j++) {\n            printf(\"%02x %s\", ptr[i\
    \ * CHARS_PER_ROW + j]);\n        }\n\n        for (j = 0; j < CHARS_PER_ROW;\
    \ j++) {\n            if (isprint((int)ptr[i * CHARS_PER_ROW + j]))\n        \
    \        printf(\"%c\", ptr[i * CHARS_PER_ROW + j]);\n            else\n     \
    \           printf(\".\");\n        }\n        printf(\"\\n\");\n    }\n\n   \
    \ printf(\"\\n\\n\");\n    return(0);\n}\n```\n\nListing 3-14\n\nDumpmem is used\
    \ to display the memory in three columns. The first column contains the kernel\
    \ address, the second column is 8 bytes of data displayed in hexadecimal notation.\
    \ The last column is the same 8 bytes of data contained in the second column in\
    \ ASCII format. If character is nonprintable, the dot (.) character is printed.\n\
    \n## Command Function Handlers\n\nEach command implements its own command handler.\
    \ The command handler is responsible for parsing its parameters and performing\
    \ the command action.\n\n## Read Command\n\nThe read command is used to read and\
    \ display kernel memory. The read command takes two parameters, the kernel address\
    \ and a length. The maximum size of a read is 4096 bytes defined by the BUFFER_MAX\
    \ macro. This maximum is an arbitrary value.\n\n```c\nvoid read_handler(int num,\
    \ char* iobuf) {\n    int32_t stat = 0;\n    int32_t kerneladdr;\n    uint32_t\
    \ length;\n\n    /* verify the command arguments */\n    i = sscanf(iobuf, \"\
    %s %x %x\", &kerneladdr, &length);\n    if (i != 2)\n        return;\n\n    /*\
    \ limit the command to our buffer size */\n    if (length > BUFFER_MAX)\n    \
    \    length = BUFFER_MAX;\n\n    /* perform the command */\n    stat = syscall(num,\
    \ kerneladdr, iobuf, length, KERNEL_READ);\n    if (stat != 0) {\n        printf(\"\
    syscall failed\\n\");\n        return;\n    }\n\n    dumpmem(kerneladdr, iobuf,\
    \ length);\n}\n```\n\nListing 3-14 (Note: original text repeated Listing 3-14)\n\
    \nAfter parsing the parameters, the call to copymem is made. Because copymem is\
    \ a user-defined system call, the call is made using the syscall function.\n\n\
    ## Write Handler\n\nThe write command is used to write kernel memory. The write\
    \ command takes two parameters, the kernel address and a length. The maximum size\
    \ of a write is 4096 bytes defined by the BUFFER_MAX macro. This maximum is an\
    \ arbitrary value.\n\n```c\nvoid write_handler(int num, char* iobuf)\n{\n    int32_t\
    \      stat = 0;\n    int32_t      i;\n    uint32_t     kerneladdr;\n    uint32_t\
    \     length;\n\n    /* verify command arguments */\n    i = sscanf(iobuf, \"\
    %s %x %x\", &kerneladdr, &length);\n    if (i != 2)\n        return;\n\n    /*\
    \ limit the command to our buffer size */\n    if (length > BUFFER_MAX)\n    \
    \    length = BUFFER_MAX;\n\n    /* read the input buffer */\n    printf(\"\\\
    n\");\n    for (i = 0; i < length; i++)\n        iobuf[i] = getchar();\n\n   \
    \ printf(\"\\n\");\n\n    /* perform the command */\n    stat = syscall(num, kerneladdr,\
    \ iobuf, length, KERNEL_WRITE);\n    if (stat != 0)\n    {\n        printf(\"\
    syscall failed\\n\");\n    }\n}\n```\n\nListing 3-15\n"
  mdcn: "\n\n## SYSCALL_MODULE 宏\n\n创建系统调用模块的最后一个任务是声明该模块。用于定义系统调用的宏是定义在 `/usr/include/sys/systent.h`\
    \ 中的 `SYSCALL_MODULE`。`SYSCALL_MODULE` 宏传递以下参数：\n\n| 参数 | 说明 |\n|---|---|\n| name\
    \ | name 是系统调用的通用名称。 |\n| offset | offset 是系统调用号。它是内核全局 `systent` 结构体的索引。 |\n\
    | systent | 为此系统调用定义的 `systent` 结构体。 |\n| evh | 加载处理程序的函数名称。 |\n| arg | 此参数为保留用，通常设置为\
    \ NULL。 |\n\n`copymem` 的 `SYSCALL_MODULE` 声明位于列表 3-10 中。\n\n```\n/* 声明系统调用 */\n\
    SYSCALL_MODULE(copymem, &syscall_num, &copymem_systent, load, NULL);\n```\n\n\
    列表 3-10\n\n`SYSCALL_MODULE` 宏接受五个参数：\n\nCopymem 是该 KLD（内核加载模块）的唯一名称。第二个参数是 syscall\
    \ 调用号，它表示包含系统调用的内核全局 `systent` 结构中的偏移量。第三个参数包含新系统调用的 `systent` 结构。第四个参数是指向该 KLD\
    \ 加载处理器的指针。第五个也是最后一个参数表示传递给加载处理器的用户自定义 KLD 数据的指针。\n\n## 一个简单的调试器\n\n在上一节中，我们创建了一个新的系统调用，为用户程序提供了读取和写入内核内存的机制。本章的剩余部分定义了一个实现简单命令解析器的程序，为我们提供读取和修改内核内存的工具。\n\
    \n## 命令定义\n\n`copymem` 工具是由命令驱动的。为了简化命令解析，定义了一个结构体类型 `command_t`，它包含一个 ASCII 命令字符串、一个函数指针和一个帮助字符串。\n\
    \n```\n/*\n ** 命令定义\n */\ntypedef struct {\n    char *command;        /* 表示命令的字符串\
    \ */\n    fptr functionptr;     /* 指向命令实现的指针*/\n    char *helpstring;     /* 帮助文本字符串\
    \ */\n} command_t;\n```\n\n列表 3-11\n\n命令元素包含一个 ASCII 字符串，用于与用户输入进行命令比较。函数指针包含指向实现该命令的例程指针。\n\
    \n```\n/*\n ** 命令函数指针定义\n */\ntypedef void (*fptr)(int, char *);\n```\n\n列表 3-12\n\
    \n命令类型 `fptr` 被定义为所有命令处理器的原型。每个命令都通过两个参数传递。第一个参数是系统调用号。由于 `copymem` 是一个 KLD 系统，因此没有系统调用封装器，系统是通过使用\
    \ `syscall` 系统调用来实现的。它接收系统调用号和系统调用参数，并执行上一节中定义的系统调用。\n\n```c\n#include <sys/syscall.h>\n\
    #include <unistd.h>\nint syscall(int number, ...);\n```\n\n第二个参数是用户输入的命令字符串。每个命令处理器都是自包含的，因此每个命令处理器都负责从命令字符串中解析属于自己的参数。\n\
    \n## 命令表\n\n命令表表示由 `copymem` 工具实现的所有命令。我们对 `copymem` 工具实现了四个命令：读取内核内存、写入内核内存、退出和帮助。\n\
    \n定义了一个命令表，以便解析器在接收到用户输入后可以遍历所有命令。所有命令处理器都进行了前向声明，以便我们可以声明命令表。\n\n```c\n/*\n **\n\
    \ */\nvoid table definition\nvoid read_handler(int num, char* args);\nvoid write_handler(int\
    \ num, char* args);\nvoid quit_handler(int num, char* args);\nvoid help_handler(int\
    \ num, char* args);\n\ncommand_t commands[] = {\n  \"read\", read_handler, \"\
    read address length - reads memory\",\n  \"write\", write_handler, \"write address\
    \ length - writes memory\",\n  \"quit\", quit_handler, \"quit - exits program\"\
    ,\n  \"help\", help_handler, \"help - displays command help\", /* 终止记录 */\n  NULL,\
    \ 0, NULL\n};\n```\n\n列表 3-13\n\n命令表包含了所有实现的命令。表中的每个项将 ASCII 命令与其命令处理器和帮助字符串链接起来。\n\
    \n添加新命令非常。声明命令处理器，并将 ASCII 字符串、命令处理器和帮助字符串添加到命令表中。在命令表中添加条目后，实现该命令处理器。\n\n## dumpmem\
    \ 函数\n\n位于列表 3-14 中的 `dumpmem` 函数是一个实用函数，以十六进制和 ASCII 字符格式导出内存。`dumpmem` 由 `read_handler`\
    \ 函数调用以显示请求的内核内存。\n\n```c\n/*\n** 名称: dumpmem\n** 效果：以十六进制和 ASCII 格式导出内存\n */\n\
    static int32_t\ndumpmem(uint32_t kernp, uint8_t* user, uint32_t len)\n{\n    int32_t\
    \ i, j;\n    int32_t rows = len / CHARS_PER_ROW;\n    uint8_t *ptr = (uint8_t\
    \ *)user;\n\n    printf(\"\\n\\n\");\n\n    for (i = 0; i < rows; i++) {\n   \
    \     uint32_t kernaddr;\n\n        kernaddr = kernp + (i * CHARS_PER_ROW);\n\n\
    \        printf(\"%08x: %s\", kernaddr);\n\n        for (j = 0; j < CHARS_PER_ROW;\
    \ j++) {\n            printf(\"%08x: %s\", kernaddr);\n        }\n\n        for\
    \ (j = 0; j < CHARS_PER_ROW; j++) {\n            if (isprint(ptr[j])) {\n    \
    \            printf(\"%c\", ptr[j]);\n            } else {\n                printf(\"\
    .\");\n            }\n        }\n        printf(\"\\n\");\n    }\n\n    return(0);\n\
    }\n```\n\n列表 3-14\n\n`dumpmem` 用于显示内存。第一列是内核地址，第二列是十六进制格式，第三列是 ASCII 格式。\n\n##\
    \ 命令处理器\n\n每个命令处理器都是自包含的，负责解析其参数并执行命令。\n\n## 读取命令\n\n读取命令用于读取内核内存。读取命令接收两个参数：内核地址和长度。读取的最大限制由\
    \ `BUFFER_MAX` 定义为 406 字节。这个值是任意的。\n\n```c\nvoid read_handler(int num, char* iobuf)\
    \ {\n    int32_t stat = 0;\n    uint32_t kerneladdr;\n    uint32_t length;\n\n\
    \    /* 验证命令参数 */\n    i = sscanf(iobuf, \"%s %x\", &kerneladdr, &length);\n \
    \   if (i != 2)\n        return;\n\n    /* 限制命令到缓冲区大小 */\n    if (length > BUFFER_MAX)\n\
    \        length = BUFFER_MAX;\n\n    /* 执行命令 */\n    stat = syscall(num, kerneladdr,\
    \ iobuf, length, KERNEL_READ);\n    if (stat != 0) {\n        printf(\"syscall\
    \ failed\\n\");\n        return;\n    }\n\n    dumpmem(kerneladdr, iobuf, length);\n\
    }\n```\n\n## 写入处理器\n\n写入命令用于写入内核内存。写入命令接收两个参数：内核地址和长度。\n\n```c\nvoid write_handler(int\
    \ num, char* iobuf)\n{\n    int32_t      stat = 0;\n    int32_t      i;\n    uint32_t\
    \ kerneladdr;\n    uint32_t length;\n\n    /* 验证命令参数 */\n    i = sscanf(iobuf,\
    \ \"%s %x\", &kerneladdr, &length);\n    if (i != 2)\n        return;\n\n    /*\
    \ 限制命令到缓冲区大小 */\n    if (length > BUFFER_MAX)\n        length = BUFFER_MAX;\n\n\
    \    /* 读取输入缓冲区 */\n    printf(\"\\n\");\n    for (i = 0; i < length; i++)\n \
    \       iobuf[i] = getchar();\n\n    printf(\"\\n\");\n\n    /* 执行命令 */\n    stat\
    \ = syscall(num, kerneladdr, iobuf, length, KERNEL_WRITE);\n    if (stat != 0)\n\
    \    {\n        printf(\"syscall failed\\n\");\n    }\n}\n```\n\n列表 3-15\n\n"
