    ,\n    \"help\",       help_handler,      \"displays command help\",\n    NULL,\
    \           0,                /* terminating record */\n};\n```\n\nListing 7-3\
    \ The command table, command, in Listing 7-3 contains all the commands implemented\
    \ by the DIOShell. Commands included are read line, write line, configure the\
    \ ports, configure the interrupt, configure the PCI interrupt, set and get the\
    \ interrupt polarity. Each command is described in more detail in subsequent sections.\n\
    \nSince the DIOShell command is table driven, the last entry contains a terminating\
    \ record. This is to denote the end of the last. Without the terminating record,\
    \ we would need some other mechanism to determine when we've reached the end of\
    \ the table and keep the command parsing loop from running rampant over process\
    \ memory.\n\n# The readline_handler Function\n\nThe read handler function is used\
    \ to read a digital IO line. Read line commands are entered using syntax\n\n-\
    \ > read line\n\nwhere line is a value between 0 and 23. Read will print the value\
    \ of the requested line 0 or 1.\n\n```c\nvoid\nreadline_handler(char* args, uint8_t*\
    \ p)\n{\n    DIOline_t      line;\n    DIOLinestate_t state;\n\n    sscanf(args,\
    \ \"%*s %d %d\", &line, &state);\n\n    /* check the parameters */\n    if ((line\
    \ < line0) || (line > line23))\n    {\n        printf(\"illegal line number\\\
    n\");\n        return;\n    }\n\n    if (dio_get_line(line, &state) == 0)\n  \
    \  {\n        printf(\"line %d = %d\\n\", line, state);\n    }\n    else\n   \
    \ {\n        printf(\"read line failed\\n\");\n    }\n}\n```\n\nListing 7-4\n\n\
    # Chapter Seven Remote Management\n\nHere, readline_handler parses the input provided\
    \ by the user. If the input is valid, the dio_get_line function is called to read\
    \ the state of the digital IO line.\n\n# writeline_handler Function\n\nThe writeline_handler\
    \ function is used to write a digital IO line. The write line command is entered\
    \ using the following syntax,\n\n- write line value\n\nwhere line is a value between\
    \ 0 and 23, and value is either 0 or 1. Write will set the requested line output\
    \ to the input value by the user.\n\n```c\nvoid\nwriteline_handler(char* args,\
    \ uint8_t* p)\n{\n  DIOline_t line;\n  DIOlinestate_t state;\n\n  sscanf(args,\
    \ \"%*s %d %d\", &line, &state);\n\n  /* check the parameters */\n  if ((line\
    \ < line0) || (line > line23))\n  {\n    printf(\"illegal line number\\n\");\n\
    \    return;\n  }\n\n  /* check the parameters */\n  if ((state != set) && (state\
    \ != clear))\n  {\n    printf(\"illegal state\\n\");\n    return;\n  }\n\n  if\
    \ (dio_set_line(line, state) != 0)\n  {\n    printf(\"write line failed\\n\");\n\
    \  }\n}\n```\n\nListing 7-5\n\nThe write handler function uses sscanf to parse\
    \ the user's input. If the command arguments are correct, dio_set_line is called\
    \ to set the requested lines output.\n\n# config_handler Function\n\nThe config_handler\
    \ function is used to change the port configurations. The config command is entered\
    \ using the following syntax:\n\n- > config port\n\nwhere ports is any combination\
    \ of A, B, CL and CH. The specified ports are configured as digital inputs.\n\n\
    ```c\nvoid\nconfig_handler(char* args, uint8_t* p)\n{\n  char port[32];\n  DIOconfig_t\
    \ cfg = 0;\n\n  sscanf(args, \"%s %s\", port);\n\n  /* scan the string looking\
    \ for ports */\n  if ((strstr(port, \"A\") != NULL) || (strstr(port, \"a\") !=\
    \ NULL))\n  {\n    cfg |= porta_in;\n  }\n\n  if ((strstr(port, \"B\") != NULL)\
    \ || (strstr(port, \"b\") != NULL))\n  {\n    cfg |= portb_in;\n  }\n\n  if ((strstr(port,\
    \ \"CL\") != NULL) || (strstr(port, \"cl\") != NULL))\n  {\n    cfg |= portcl_in;\n\
    \  }\n\n  if ((strstr(port, \"CH\") != NULL) || (strstr(port, \"ch\") != NULL))\n\
    \  {\n    cfg |= portch_in;\n  }\n\n  /* we've built the cfg mask write it to\
