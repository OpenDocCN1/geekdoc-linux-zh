    # Web Access Using Tomcat


    # Overview


    In the previous chapter, we developed a JNI layer for the DIO appliance library.
    This represents the first of two steps in implementing a web interface to monitor
    the DIOs digital 10 lines. The second step is to develop a Java Server Page (JSP)
    that uses the JNI object developed in Chapter 8 to read and write the DIO 10 lines
    via a web page.


    JSP is a technology that allows us to develop web pages that display dynamic content.
    Using the JNI object developed in Chapter 8, along with the JSP page developed
    in this chapter, we will be able to develop a web page that displays the DIO lines
    dynamically. In order to display JSP pages we will install and configure a JSP
    ports collection contains Tomcat, a Java-based web server that provides support
    for JSP


    In this chapter, we will discuss issues related to JSP developing, including:


    +   - Installing the Tomcat server on FreeBSD.

    - Setting up the Tomcat environment.

    - The elements of a JSP page.

    - Developing the DIO JSP interface.


    # Tomcat


    As with the JDK in the previous chapter, our first step is to download and install
    the Tomcat server that provides JSP support. Tomcat is provided in the ports collection
    and is downloaded, installed, and configured using the standard ports installation
    procedure. Let''s review those steps now.'
