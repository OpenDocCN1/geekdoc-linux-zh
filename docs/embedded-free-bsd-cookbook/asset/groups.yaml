    # 189 Chapter Eleven

    System Startup


    Let''s define a few terms to

    avoid confusion.


    A slice is a section of a disk;

    each disk contains most

    four slices. The slices are

    defined by a table contained

    in the MBR.


    A partition is a section of

    slice. Each partition may

    contain a file system or

    swap space in FreeBSD.


    | Master Boot Partition Table | a |

    |---|---|

    | | b |

    | | c |

    | Partition 1 (FreeBSD Slice) | d |

    | Partition 2 | e |

    | Partition 3 | f |

    | Partition 4 | g |

    | Partition 1 (FreeBSD Slice) | h |


    A FreeBSD slice is

    defined by the

    MBR partition table.


    The UNIX filesystem\partitions are then

    implemented with

    FreeBSD slice.


    Figure 11-2. Partition Table and Slice


    # Unix Partitions


    A Unix disk is divided into as many as 8 partitions. A partition represents

    separate entity on the disk. FreeBSD disks typically use 4 of the 8 available

    partitions: the partition is used for the root file system, the b partition is

    used for the swap partition. The f partition contains the user partition, and

    t e partition is used for the file system. An important note is the c

    partition, which is historically used to represent the whole disk.


    We can look at the /etc/fstab file to see how the disk is partitioned.


    ```

    /dev/ad0slb  none  swap  sw   0 0

    /dev/ad0sla  /      ufs   rw   1 1

    /dev/ad00f  /usr  ufs   rw   2 2

    /dev/ad0sle  /var  ufs   rw   2 2

    ```


    This disk contains four partitions. The partition is denoted by the last

    of the device name in column 1. Partition contains the root file system, b

    swap partition, f is the user partition and e the var partition.


    # PC BIOS


    After turning on or resetting your computer program, execution begins with

    generic code in the PC called the BIOS. The BIOS is the lowest level

    software in a computer and provides an interface between the software and

    hardware. The BIOS (basic input/output system) has the task of initialization-

    ing the hardware, loading and running the boot loader contained in the MBR.'
  - '[PAGE 190]


    The boot loader is a program that resides in the MBR and is loaded and run by
    the BIOS. The BIOS loads it into memory and begins program execution. The information
    contained in the MBR includes information to find the boot loader on disk, a program
    to read the boot loader into memory and begin execution.


    Once a PC is powered on, the BIOS has a list of tasks to perform:


    +   1. A series of tests are performed on existing hardware to ensure the hardware
    is working properly.

    2. Hardware resources are initialized and assigned.

    3. Configured boot devices are searched for a valid boot sector.

    4. The boot sector is loaded and transferred to the boot loader.


    After the system boots, the BIOS reads the MBR into location 7C00H, the last two
    bytes of that sector should contain the MBR magic number AA55H. If the last two
    bytes are AA55H, control is passed to the boot loader routine; otherwise the system
    stops.


    # FreeBSD Boot Loader


    Once the BIOS loads the MBR into memory, the FreeBSD booting process begins. It
    consists of three stages, each stage providing more features and increasing in
    size. The first two stages are actually part of the same program but are split
    into due to space constraints. The third stage is an options boot loader. Individual
    components of the boot process are located in the /boot directory.


    ```

    # ls -l /boot

    total 533

    -r-r-r- 1 root wheel 512 Sep 18 13:28 boot0

    -r-r-r- 1 root wheel 512 Sep 18 13:28 boot1

    -r-r-r- 1 root wheel 7680 Sep 18 13:28 boot2

    -r-xr-xr-x 1 root wheel 149504 Sep 18 13:28 cdboot

    drwx-xr-xr-x 2 root wheel 512 Oct 24 16:52 defaults

    -r-xr-xr-x 1 root wheel 147456 Sep 18 13:28 loader

    -r-r-r- 1 root wheel 9237 Sep 18 13:28 loader.4

    -rw-r-r- 1 root wheel 67 Dec 16 16:51 loader.conf

    -r-r-r- 1 root wheel 12064 Sep 18 13:28 loader.help

    -r-r-r- 1 root wheel 338 Sep 18 13:28 loader.rc

    ```'
  - '[PAGE 191]


    # Chapter Eleven

    System Startup


    ```

    -r-r-r- 1 root wheel 512 Sep 18 13:28 mbr

    -r-xr-xr-x 1 root wheel 149504 Sep 18 13:28 pxeboot

    -r-r-r- 1 root wheel 25121 Sep 18 13:28 support.4th

    ```


    The source code that represents the FreeBSD boot stages resides in /sys/i386/biosboot
    directory. For a dedicated FreeBSD system, the boot code contained in the MBR
    resides in /boot0. The source code resides in /sys/boot/i386. Let''s take a closer
    look at the boot stages.


    # boot1 and boot2


    The first stage is loaded by the MBR to location 7C00H and is limited to 512 bytes.
    This first boot copies itself to 10000H and loads the second-stage boot resides
    in the first 15 stages of the boot slice, bringing the total of the first and
    second boot to 16 stages or 8 KB. The first and second stages of the boot process
    are actually built together so boot1 knows exactly where boot2 starts execution
    and calls that entrypoint.


    ![](img/8be5cdcebf09c36e2285b8e096cda24a_191_0.png)


    Stage two consists of the boot2 program, which understands how to read the FreeBSD
    file system so it can find the files necessary to boot and provides a simple interface
    to the user to choose the kernel or loader to run. The second stage loads the
    third stage loader into memory passing control to the third stage, /boot/loader.
    The source code for boot1 and boot2 is found in /sys/boot/i386.


    Figure 11-3. Boot Stages


    # Stage 3


    Loader, /boot/loader, is started by the second-stage bootstrap loader. The third-stage
    loader copies the kernel into memory and starts executing it. The kernel is loaded
    from the FreeBSD file system so the third-stage loader has the information to
    read the filesystem. Loader configuration files contained in the /boot directory
    for load options and parameters. The files, /boot/loader.conf, /boot/loader.rc
    are parsed for load options. The loader copies the kernel image into memory and
    passes parameters to the stack.'
- md: "\n# System Startup\n\nAfter the kernel is loaded and the system starts up,\
    \ the kernel creates a user daemon to complete initialization call init, which\
    \ is PID 1.\n\n## init\n\nOnce the kernel is loaded, control is passed to the\
    \ init daemon. The init daemon is responsible for transitioning through the different\
    \ user-mode levels and starting resources, file systems, networking daemons and\
    \ configuration. Init is responsible for making sure the file systems are consistent\
    \ and starting system daemons and initializing terminals for user login based\
    \ on the resource configuration files.\n\nThe resource configuration files are\
    \ executed by a main Bourne Shell script, /etc/rc. The rc reads a series of files\
    \ that contain system configuration code. The rc file doesn't need modifications;\
    \ its behavior can be changed by setting and clearing variables in the /etc/rc.conf\
    \ and /etc/defaults/rc.conf files. Let's take a closer look at the compo of the\
    \ rc file that are relevant to the DIO appliance.\n\n## Configuration\n\nOne of\
    \ the first tasks of the init daemon is to read two files that contain global\
    \ configuration files for the system that enable and disable systems started by\
    \ init. The first file /etc/defaults/rc.conf is a global configuration file and\
    \ should not be changed. The second file /etc/rc.conf is a system-tuneable file.\
    \ Variables may be set in /etc/rc.conf to override the values in /etc/defaults/rc.conf.\n\
    \n```bash\n# If there is a global system configuration file, suck it in.\nif [\
    \ -r /etc/defaults/rc.conf ]; then\n  /etc/defaults/rc.conf\n  source _rc_conf\n\
    elif [ -r /etc/rc.conf ]; then\n  /etc/rc.conf\nfi\n```\n\nWe see the rc file\
    \ checks for the existence of the rc.conf files. If they exist, they are read.\n\
    \n## Chapter Eleven\nSystem Startup\n\nIn Chapter 7 we modified the rc.conf to\
    \ ensure the SSH daemon sshd was started by rc.\n\n## System Settings\n\nOne of\
    \ the configuration files is for system tuning. The sysctl utility is used to\
    \ tune FreeBSD kernel parameters in a running system. The rc script reads the\
    \ settings in /etc/rc.sysctl and executes these statements using sysctl.\n\n```bash\n\
    # Set sysctl variables as early as we can\nif [ -r /etc/rc.sysctl ]; then\n  /etc/rc.sysctl\n\
    fi\n```\n\nThe sysctl utility is used for parameter tuning. In our case, since\
    \ we booting from a flash device, the number of writes must be limited. One of\
    \ the ways to do this is to disable swapping. Swapping is the method of moving\
    \ unused pages of memory to disk, to free memory for executing programs. Because\
    \ the DIO appliance is a dedicated system, swapping is not necessary.\n\nOur rc.sysctl\
    \ file contains the following line:\n\n```bash\nswap_enabled=0\n```\n\n## Customization\n\
    \nOne of the tasks rc performs is to look for user-defined startup scripts. The\
