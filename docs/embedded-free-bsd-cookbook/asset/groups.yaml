    # The Java Code


    Now that some of our basic data types have been defined, it''s time to define
    the Java-to-C interface class. Perhaps the most important task in defining the
    JNI class is to first define which features are included. For simplicity''s sake,
    we will define a Java class that provides the same capabilities provided by the
    dio daemon, a JNI layer that provides member functions to read, write, and determine
    the direction of the PCI-DIO24 digital IO lines. The interfaces for each of these
    functions are contained in the DIO interface library; the JNI provides a way to
    call these functions from Java.


    Developing the JNI layer requires nothing more than the native attribute keyword.
    The native keyword allows the implementation of the member function to be deferred.
    The actual implementation of the native member functions will occur in a C++ class,
    defined in a later step.


