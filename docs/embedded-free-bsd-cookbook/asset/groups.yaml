    \ into the web page.\n\n# Comments\n\nLike all programming languages, JSP provides\
    \ an element for adding comments to your JSP code. A comment is denoted by the\
    \ <%--%> tags.\n\n<%- JSP is really cool %%>\n\n# Directives\n\nJSP directives\
    \ are used to specify how the JSP page is handled. A JSP directive does not produce\
    \ any visible output. A directive is specified by the <% %> tag. For example,\
    \ in Listing 9-1, the Java language was selected using the page directive.\n\n\
    ```\n<@ page language=\"java\" contentType=\"text/html\" %>\n```\n\nThere are\
    \ three types of directives: page, language, and content. The page directive in\
    \ Listing 9-1 is used for specifying the language and content type. In this case,\
    \ Java is the language and html is the content. In addition, the page directive\
    \ has many methods for controlling page attributes."
  - '[PAGE 163]


    # 162 Embedded FreeBSD Cookbook


    The language attribute is used to specify the scripting language. Although JSP
    is able to use multiple scripting languages, Tomcat only supports Java. Subsequently,
    Java is the default language, but it is set in the page directive for the sake
    of clarity.


    Finally, the contentType attribute is used to specify the type of content produced
    by the JSP page. Once again looking at Listing 9-1, the output is html, the most
    common type of page. Other types of pages are text/plain, text/xml for applications,
    and so forth forth.


    # Declarations


    The next type of JSP statement is a declaration statement. The declaration statement
    is denoted by the <%! %> tags. A declaration allows the programmer to define page
    level variables for storing information that a page may need.


    ```

    <% int jspvar = 27; %>

    ```


    # Expressions


    JSP expressions are used to evaluate expressions and convert the result into text
    for display in the output page. JSP expressions use the <%= %> tags.


    # Code Scriptlets


    Scriptlets, denoted by the <% %> tags, are used to run Java code when the page
    is serviced by the Web server. In Listing 9-1, we used a JSP scriptlet to write
    Hello DIO! to the output page.


    ```

    <% out.println("Hello DIO\n"); %>

    ```


    # The DIO JSP Page


    Now that we''ve taken a look at the JSP syntax, it''s time to develop our DIO
    JSP page for displaying the states of DIO lines for your favorite web browser.
    Let''s take a look at Listing 9-2. The JSP begins by declaring the language and
    contentType. Once again, the settings are the default values but the JSP code
    is better understood by declaring these here. After the page directive, the JSP
    page contains a few lines of html to set the title page for your browser.'
