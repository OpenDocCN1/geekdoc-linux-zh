  mdcn: "\n\n## 125 第七章\n远程管理\n\nsshd_enable=\"YES\"\n\nrc.conf 文件是一个脚本文件，其中包含了用于自定义系统启动的变量。该文件并不是作为脚本执行的，而是被其他文件包含以便对系统启动进行条件判断。\n\
    \nrc 脚本是一个用于控制重启的命令脚本；rc 会读取 `rc.conf` 脚本的内容来决定启动系统所需的自定义组件。仔细观察 rc 脚本可以看到 `rc.conf`\
    \ 文件是如何被读取的。\n\n```bash\nif [ -r /etc/defaults/rc.conf ]; then\n    /etc/defaults/rc.conf\n\
    elif [ -r /etc/rc.conf ]; then\n    /etc/rc.conf\nfi\n```\n\n进一步查看 rc 脚本，你会发现显示启动\
    \ ssh 守护进程的代码，其启动取决于 `sshd_enable` 变量。如果 `sshd_enable` 变量设置为 `yes`，rc 脚本就会启动 ssh。我的\
    \ rc 脚本中的代码就是执行此操作；如下所示。\n\n```bash\ncase ${sshd_enable} in\n    [Yy][Ee][Ss])\n\
    \        if [ -x ${sshd_program:-/usr/sbin/sshd} ]; then\n            echo -n\
    \ `sshd`\n            ${sshd_program:-/usr/sbin/sshd} ${sshd_flags}\n        fi\n\
    \        ;;\nesac\n```\n\n一旦系统启动，它就准备好接受 SSH 连接。\n\n## 配置 SSH\n\n用于配置 SSH 标准文件是\
    \ `/etc/ssh/sshd_config`。`sshd_config` 文件是一个简单的配置文件，包含“值名 值”对的文件格式，并使用简单的空格作为分隔符。列表\
    \ 7-1 包含一个默认 `sshd_config` 的副本。\n\n## 126 嵌入式 FreeBSD 菜谱\n\n```ssh\n# 这是 ssh 服务器系统级配置文件。\n\
    #\n# $FreeBSD: src/crypto/openssh/sshd_config,v 1.4.2.5 2001/01/18\n22:36:53 green\
    \ Exp $\n```\n\n```ssh\nPort 22\n#Protocol 2,1\n#ListenAddress 0.0.0.0\n#ListenAddress\
    \ :\nHostKey /etc/ssh/ssh_host_key\nHostDsaKey /etc/ssh/ssh_host_dsa_key\nServerKeyBits\
    \ 768\nLoginGraceTime 120\nKeyRegenerationInterval 3600\nPermitRootLogin no\n\
    # ConnectionsPerPeriod 已完全废弃\n```\n\n```ssh\n# 在 10 个未身份验证的连接后，拒绝 30% 的新\n# 连接，并且总数拒绝超过\
    \ 60 个。\nMaxStartups 10:30:60\n# 不读取 ~/.hosts 和 ~/.shosts 文件\nIgnoreRhosts yes\n\
    # 如果你不信任 ~/.ssh/known_hosts，请取消注释\nRhostsRSAAuthentication yes\n#IgnoreUserKnownHosts\
    \ yes\nStrictModes yes\nX11Forwarding yes\nX11DisplayOffset 10\nPrintMotd yes\n\
    KeepAlive yes\n```\n\n```ssh\n# 日志\nSyslogFacility AUTH\nLogLevel INFO\n#废时的 QuietMode\
    \ 和 FascistLogging\n```\n\n```ssh\nRhostsAuthentication no\n#\n# 要使此项工作，你还需要在\n\
    /etc/ssh_known_hosts 中提供主机密钥\nRhostsRSAAuthentication no\n#\nRSAAuthentication\
    \ yes\n```\n\n```ssh\n# 要禁用隧道明文密码，请在此处改为 no！\nPasswordAuthentication yes\nPermitEmptyPasswords\
    \ no\n```\n\n```ssh\n# 取消注释以禁用 s/key 密码\n#SkeyAuthentication no\n#KbdInteractiveAuthentication\
    \ yes\n```\n\n```ssh\n# 更改 Kerberos 选项\n#KerberosAuthentication no\n#KerberosOrLocalPasswd\
    \ yes\n#AFSTokenPassing no\n#KerberosTGTCleanup no\n```\n\n```ssh\n# Kerberos\
    \ TGT 传递仅对 AFS kaserver 起效\n#KerberosTgtPassing yes\n```\n\nCheckMail yes\n#UserLogin\
    \ no\n\n# 如果你想启用 sftp，请取消注释\n#Subsystem sftp /usr/libexec/sftp-server\n```\n\n\
    # 列表 7-1\n\nssh_config 文件选项在后续章节中描述。\n\n### Port 22\n\n`Port` 选项指定 ssh 守护进程监听入站连接的端口号。\n\
    \n### ListenAddress 192.168.1.1\n\n`ListenAddress` 选项指定 ssh 守护进程服务器套接字绑定接口 IP\
    \ 地址。默认值为 0.0.0.0。\n\n### HostKey /etc/ssh/ssh_host_key\n\n`HostKey` 选项指定包含私有主机密钥的位置。\n\
    \n### ServerKeyBits 1024\n\n`ServerKeyBits` 选项指定服务器密钥使用的位数。这些位数在守护进程启动时用于生成其 RSA\
    \ 密钥。\n\n### LoginGraceTime 600\n\n`LoginGraceTime` 选项指定在连接请求后，如果用户未成功登录，服务器断开连接之前等待的时间（秒）。\n\
    \n### KeyRegenerationInterval 3600\n\n`KeyRegenerationInterval` 选项指定服务器在自动重新生成密钥之前应等待的时间（秒）。\n\
    \n### PermitRootLogin no\n\n`PermitRootLogin` 选项指定哪个 root 用户可以使用 ssh 登录。\n\n###\
    \ IgnoreRosts yes\n\n`IgnoreRosts` 选项指定是否应在身份验证中使用 rhosts 或 shosts 文件。出于安全考虑，建议不使用\
    \ rhosts 或 shosts 文件进行身份验证。\n\n### IgnoreUserKnownHosts yes\n\n`IgnoreUserKnownHosts`\
    \ 选项指定是否不使用 IgnoreUserKnownHosts。\n\n### X11Forwarding yes\n\n`X11Forwarding`\
    \ 选项指定是否启用 X11 转发。\n\n### PrintMotd yes\n\n`PrintMotd` 选项指定是否打印每日公告（motd）。\n\n\
    ### KeepAlive yes\n\n`KeepAlive` 选项指定是否保持连接活跃。\n\n### SyslogFacility AUTH\n\n\
    `SyslogFacility` 选项指定用于日志的设施。\n\n### LogLevel INFO\n\n`LogLevel` 选项指定日志的详细程度。\n\
    \n### RhostsAuthentication no\n\n`RhostsAuthentication` 选项指定是否使用 rhosts 身份验证。\n\
    \n### RSAAuthentication yes\n\n`RSAAuthentication` 选项指定是否使用 RSA 身份验证。\n\n### PasswordAuthentication\
    \ yes\n\n`PasswordAuthentication` 选项指定是否使用密码的身份验证。\n\n### PermitEmptyPasswords\
    \ no\n\n`PermitEmptyPasswords` 选项指定是否允许空密码账户。\n\n"
