    \    d_bmaj;\n    /* 以下添加的内容与 2 及以下版本不兼容 */\n    d_kqfilter_t  *d_kqfilter;\n\
    };\n```\n\n在为 KLD 设备驱动程序声明 `cdevsw` 条目之前，需要进行一些背景工作。让我们看看声明 `cdevsw` 条目之前的这些步骤。\n\
    \nKLD 设备驱动的第一部分组件是设备切换表。KLD 驱动包含 `open`、`close`、`read` 和 `write` 的处理函数。每个函数都是前向声明的，以便在设备切换列表中。\n\
