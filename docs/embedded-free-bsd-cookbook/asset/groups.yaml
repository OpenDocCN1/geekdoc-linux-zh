    ## PCI 配置


    本章描述了 PCI 总线和 PCI 配置寄存器。PCI-DIO24 数字输入输出卡是一个 PCI 总线数据采集控制器。为了让 FreeBSD DIO 设备驱动程序正确检测到
    PCI-DIO24 控制器的存在，设备驱动程序必须读取 PCI 配置寄存器。通过使用 PCI 内内核子系统，FreeBSD 设备驱动程序编写者方便地隐藏了
    PCI 配置寄存器的访问。


    ## PCI 总线


    PCI 是外围组件互连（Peripheral Component Interconnect）的缩写。PCI 总线规范定义了需要快速访问彼此和/或系统内存的计算机组件系统互连。典型的
    PCI 设备由 PCI 扩展卡上的 PCI 接口控制器组成。PCI 扩展卡的示例包括网络控制器、显示适配器、SCSI 控制器和光纤通道主机适配器。PCI 规范的一个优点是其厂商和平台独立性。PCI
    总线于 Intel、Apple 和 Sun 计算机。


    PCI 总线规范由 PCI 特别小组（PCI-SIG）管理。有关 PCI 规范的信息，请联系：


