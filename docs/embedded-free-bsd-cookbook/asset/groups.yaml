    A typical device driver accepts requests from the upper half, and then enqueues
    the request to be handled by the lower half. Each request is enqueued in a common
    data structure shared by the upper and lower halves. Because the upper and lower
    halves of a device driver run independently; it is critical that access to any
    data shared by the upper and lower halves of a device driver is properly synchronized.


    # KLDs Revisited


    As with the system called in Chapter 3, FreeBSD provides support for dynamically
    loadable device drivers. In addition to the typical device driver data structures
    required by a FreeBSD device driver, KLD framework data structures for dynamic
    load and unload features for the DIO device driver are described and implemented.


    # Driver Structure


    A FreeBSD driver consists of various entry points into driver functions or methods
    that the FreeBSD I/O subsystem calls when it wants the driver to perform a specific
    function. Two structures are provided for FreeBSD device driver writers to implement
    the driver functions. `device_method_t` is the structure used for auto configuration
    functions and `cdevsw` is used for system calls and interrupts. The following
    sections discuss the more function callbacks and the conditions that cause the
    functions to be called.


    | device_method_t | cdevsw |

    |--- |--- |

    | probe | open |

    | attach | close |

    | detach | read |

    | shutdown | write |

    | suspend | ioctl |

    | : | : |


