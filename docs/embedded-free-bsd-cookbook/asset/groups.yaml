    ## PCI Configuration


    This chapter provides a description of the PCI bus and the PCI configuration registers.
    The PCI-DIO24 Digital I/O card is a PCI bus data acquisition controller. In order
    for the FreeBSD DIO device driver to correctly detect the presence of the PCI-DIO24
    controller, the device driver must read the PCI configuration registers. Access
    to the PCI configuration registers are conveniently hidden from the FreeBSD device
    driver writer through the use of the PCI kernel subsystem.


    ## The PCI Bus


    PCI is an acronym for Peripheral Component Interconnect. The PCI bus specification
    defines a system interconnect for computer components that require fast access
    to each other and/or system memory. A typical PCI device consists of a PCI interface
    controller on a PCI expansion card. Examples of PCI expansion cards are network
    controllers, display adapters, SCSI controllers and Fibre Channel host bus adapters.
    One benefit of the PCI specification is its vendor and platform independence.
    PCI buses are found in Intel, Apple and Sun computers.


    The PCI Bus specification is managed by the PCI Special Interest Group (PCI-SIG).
    For information regarding the PCI Specification contact:


    PCI Special Interest Group (PCI-SIG)

    5440 SW Westgate Dr., #217

    Portland, OR 97221

    Phone: 503-291-2569

    FAX: 503-297-1090

    administration@pcisig.com


    ## PCI Configuration Registers


    This section provides a description of the PCI device configuration header and
    PCI configuration registers. Any functional PCI device contains a block of 64
    double words called the PCI configuration header. The first 16 double words are
    defined by the PCI specification and are known as the configuration header region.


    The PCI configuration header region can be in two formats known as type 0 or type
    1. Header type 1 is used for PCI-to-PCI bridges. Header type 0 is for all other
    devices. Figure B-1 illustrates the format of type 0 PCI device registers.


    | Offset | Byte3 | Byte2 | Byte1 | Byte0 |

    |---|---|---|---|

    | 0 | Device ID | Vendor ID | |

    | 4 | Status Register | Command Register | |

    | 8 | Class Code | Revision ID | |

    | 12 | Latency Timer | Cache Line Size | |

    | 16 | | | |

    | 20 | | | | |

    | 24 | | | | |

    | 28 | | | | |

    | 32 | | | | |

    | 36 | | | | |

    | 40 | | | | |

    | 44 | Subsystem ID | Subsystem Vendor ID | |

    | 48 | Expansion ROM Base | | |

    | 52 | | | | |

    | 56 | | | | |

    | 60 | Interrupt Pin | Interrupt Line |


    Figure B-1. PCI Configuration Header'
