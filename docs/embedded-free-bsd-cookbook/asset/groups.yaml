    Listing 12-1


    Listing 12-1 shows the code for the rc.diskless2 scripts provided with the FreeBSD
    4.4 release. This script handles booting a diskless system and handles the special
    requirements for that type of system.


    First, rc.diskless2 reads in the global configuration rc.conf files. Next the
    /var directory is mounted with a default size of 65536 sectors. Following the
    creating of var in memory, the directory structure for var is created by the mtree
    command and necessary log files are created on the contents of /etc/newsyslog.conf.
    With the var file system and the necessary log files created, the file systems
    can be mounted via the mount command. Next, the /tmp directory is created in memory
    with a default size of 20480 sectors. Finally the /dev is created in memory and
    then populated.


    As you can see, many of the details of booting a diskless system are handled by
    the rc.diskless2 script. With a few custom modifications, our system will be ready
    for prime time. Let''s take a closer look at some of the settings.


    # Configuring Read-only File Systems


    /var directory is used for temporary files and log files. Once you have configured
    your system to run rc.diskless2 system, the /var directory will be mounted as
    a memory file system. One of the parameters contained in the rc.diskless2 script
    is varsize. The varsize variable represents the size, in sectors, for the /var
    directory. The default is 65536, larger than available memory. We''ll set varsize
    to a value that better represents the requirements of the DIO appliance.


    ```

    varsize=8192

    ```


    With the /var directory, the /tmp directory is created by the rc.diskless2 script.
    The default size is 10480 sectors. We''ll set this to 8192 sectors, as this value
    better represents the DIO appliance''s requirement. The size of the tmp directory
    is controlled by the tmsize variable.'
