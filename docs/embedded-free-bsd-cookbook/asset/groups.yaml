    # Loading Shared Libraries


    A program linked with shared libraries contains a list of required shared libraries
    but not the location where the libraries exist. When a program is executed, the
    dynamic linker, ld-elf.so.1, searches the default library path, consisting of
    /lib and /usr/lib. If a shared library is installed in another directory, the
    dynamic linker needs to be told where to search for those libraries.


    There are two methods for adding additional shared library search paths to the
    dynamic linker.


    The first solution is to link the program and specify the location of the shared
    libraries, using the -Wl,-rpath option to gcc. This is a linker switch that adds
    the named directory to the run-time search path for shared libraries.


