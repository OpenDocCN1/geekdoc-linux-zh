    \            0600,                /* 设备权限 */\n            \"klddriver\");    \
    \     /* 设备名称 */\n            break;\n\n        case MOD_UNLOAD:\n           \
    \ /*\n             * 卸载时销毁设备\n             */\n            destroy_dev(kld_dev);\n\
    \            break;\n\n        case MOD_SHUTDOWN:\n            break;\n\n    \
    \    default:\n            stat = EINVAL;\n    }\n\n    return(stat);\n}\n```\n\
