    \ 定义读写数据的 `ioctl` |\n\n这些宏中的每一个都作为定义 `ioctl` 的基础。例如，`dioio.h` 中提供的 `DHIOCRESET`\
    \ 使用 `_IO`，它不从驱动读取或写入数据，而是发出重置命令。`ioctl` 宏参数如下：\n\n| 参数 | 描述 |\n| :--- | :---\
