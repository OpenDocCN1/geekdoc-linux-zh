    \ script is responsible for starting Tomcat at system boot time. Once Tomcat is\
    \ installed, you can restart your system and verify that it is working properly\
    \ by starting your browser and pointing to it the url,\n\n```\nhttp://localhost:8080\n\
    ```\n\nYou should see the Tomcat main page in your browser.\n\n| Jakarta Project\
