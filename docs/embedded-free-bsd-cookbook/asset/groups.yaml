  - "[PAGE 126]\n\n# 125 Chapter Seven\nRemote Management\n\nsshd_enable=\"YES\"\n\
    \nThe rc.conf file is a script file that contains variables used to customize\
    \ system startup. This file is not executing as a script; it is included by other\
    \ files to conditionalize system startup.\n\nThe rc script is a command script\
    \ used to control reboots; rc reads the contents of the rc.conf script to determine\
    \ the custom components for starting the system. A closer look at the rc script\
    \ shows how the re.conf file is read.\n\n```\nif [ -r /etc/defaults/rc.conf ];\
    \ then\n    /etc/defaults/rc.conf\nelif [ -r /etc/rc.conf ]; then\n    /etc/rc.conf\n\
    fi\n```\n\nLooking through the rc script further, you will find code that shows\
    \ the ssh daemon being started, conditional on the sshd_enable variable. If the\
    \ sshd_enable variable is set to yes, the rc script starts the ssh. The code in\
    \ my rc script does that this is shown below.\n\n```\ncase ${sshd_enable} in\n\
    [ Yy][Ee] [[ Ss ]]\n    if [ -x ${sshd_program:-/usr/sbin/sshd} ]; then\n    \
    \    echo -n `sshd`\n        ${sshd_program:-/usr/sbin/sshd} ${sshd_flags}\nfi\n\
    esac\n```\n\nOnce the system boots, it is ready to accept SSH connections.\n\n\
    # Configuring SSH\n\nThe standard file used to configure SSH is /etc/ssh/sshd_config.\
    \ The sshd_config file is a simple configuration file, containing the file format\
    \ with \"ValueName Value\" pairs using a simple space as a separator. A copy of\
    \ a default sshd_config is contained in Listing 7-1."
