    \ ${script_name_sep} ${script}\"\n    done\n  fi\ndone\nscript_save_sep=\"${IFS}\"\
    \nIFS=\"${script_name_sep}\"\nfor script in ${slist}; do\n  if [ -x \"${script}\"\
    \ ]; then\n    set -T\n    trap 'exit 1' 2\n    ${script}\n  fi\ndone\nIFS=\"\
    ${script_save_sep}\"\necho '.'\nesac\n```\n\n## Starting DIO Components\n\nUp\
    \ to this point, we've discussed the FreeBSD boot process. In order for the DIO\
