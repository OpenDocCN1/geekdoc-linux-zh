    There are typically two types of libraries developed by system engineers, static
    and shared. If a program is linked to a static library, the components of the
    library become part of the final executable, making the output monolithic. All
    linker symbols are resolved at link time, and the program is self-contained. If
    the library is modified for bug fixes or new features, the application must be
    rebuilt to incorporate the changes to the static library.


    When linking with a shared library, the final executable contains references to
    the shared library. Shared libraries are loaded when a program is run, and the
    symbols are resolved at run-time. If a shared library is modified, only the library
    is replaced. A program can use the updated library next time it runs.


    # Creating and Using Shared Libraries


    Shared libraries are loaded at run-time and are not linked to a specific address.
    Shared libraries use the same naming conventions as static libraries; the name
    of the shared library is prefixed with lib, but the extension is .so, instead
    of .a, which is used for static libraries.


    When compiling the source code for a shared library, the code must be linked as
    position independent code. This is accomplished by specifying the -fpic switch
    to gcc.


    ```

    # gcc -c -fpic -o dioif.o dioif.c

    ```


    When building a shared library, gcc needs to know that the output is a shared
    library. This is done by specifying the -shared switch. For example, the code
    presented in this chapter is contained in the file dioif.c. In order to build
    a shared library, the following line would be used with gcc.


    ```

    # gcc -shared -o dioif.so dioif.o

    ```


    Linking with a shared library is the same as linking with a static library; i.e.,
    the -l switch specifies the library, and the -L switch specifies a path to find
    the library.


    ```

    # gcc -o dietest.c dietest.c -L. -dioif

    ```'
