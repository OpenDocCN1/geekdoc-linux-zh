    \n```\n# Floating point support - do not disable.\ndevice npx0 at nexus? port\
    \ IO_NPX irq 13\n```\n\n```\n# Serial (COM) ports\ndevice sio at isa? port IO_COM1\
    \ flags 0x10 irq 4\ndevice siol at isa? port IO_COM2 irq 3\n```\n\n```\n# Parallel\
    \ port\ndevice  ppc0      at isa? irq 7\ndevice  ppbus      # Parallel port bus\
    \ (required)\ndevice  lpt       # Printer\ndevice  ppi       # Parallel port interface\
    \ device\n```\n\n# PCI Ethernet NICs.\n\n```\n# PCI Ethernet NICs that use the\
    \ common MIB bus controller code.\n# NOTE: Be sure to keep the 'device miibus'\
    \ line in order to use\n#theseNICs!\ndevice  miibus    # MIB ii bus support\n\
    device  fxp       # Intel EtherExpress PRO/100B (82557, 82558)\n```\n\n```\n#\
    \ Pseudo devices - the number indicates how many units to\n#allocate.\npseudo-device\
    \  loop      # Network loopback\npseudo-device  ether     # Ethernet support\n\
    pseudo-device  sl 1      # Kernel SLIP\npseudo-device  ppp 1      # Kernel PPP\n\
    pseudo-device  tun       # Packet tunnel.\npseudo-device  pty       # Pseudo-ttys\
    \ (telnet etc)\npseudo-device  md        # Memory \"disks\"\npseudo-device  gif\
    \       # IPv6 and IPv4 tunneling\npseudo-device  faith     1  # IPv6-to-IPv4\
    \ relaying (translation)\n```\n\n# Building the FreeBSD Kernel\n\nNow you've tuned\
    \ your kernel config file to fit your hardware, it's time to build the FreeBSD\
    \ kernel. This is a multiple-step, but straightforward, process. It consists of\
    \ the following steps.\n\n# Config\n\nFirst, you must change your directory to\
    \ the kernel config directory. Run the config on your configuration file.\n\n\
    ```\n# cd /sys/i386/conf\n# config DIO\n```\n\nIf you see error messages, you\
    \ must fix your kernel config file.\n\n# Starting Clean\n\nIt's always a good\
    \ idea to start with a clean build and remove stale files. Cleaning the directory\
    \ will cause the build time to increase, but it's better to start with a fresh\
    \ set of object files. Cleaning object files consists of running the make clean\
    \ command in the kernel build directory.\n\n- make clean\n\n# Generating Dependencies\n\
    \nThe kernel is a complex program make needs to generate dependencies. Config\
    \ has done most of the work for you already and stored the method for generating\
    \ dependencies in the make file. Running make depend in the kernel directory generates\
    \ the dependencies.\n\n# Building the Kernel\n\nYou're almost there! Now, it's\
    \ time to build the kernel. make is ready to build all the sources and link the\
    \ necessary files and libraries to make your custom kernel. To do this, run the\
    \ make command in the kernel build directory.\n\n```\n# make\n```\n\nAs with previous\
    \ kernel building commands, make will generate lots of output. It is important\
    \ to notice error messages during this process; although if there are any serious\
