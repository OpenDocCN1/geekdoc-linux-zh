    | Flag | Description |

    | --- | --- |

    | MSG_OOB | Process out of band data |

    | MSG_PEEK | The data is copied into the buffer but is not removed from the input
    queue. |

    | MSG_WAITALL | Wait for a complete request or error |


    Recv returns the number of bytes received or -1 on error.


    # Connectionless Data Transfer


    An alternative to a connection-oriented server is a connectionless server. A connectionless
    server is different, because a connection is not established prior to transferring
    data. In a connectionless protocol, the server blocks until a port data is received
    from a client.


    # The recvfrom System Call


    The recvfrom() system call receives a message from a socket and captures the address
    from which the data was sent. Unlike the recv() call, which can only be used on
    a connected stream socket or bound datagram socket, recvfrom() can be used to
    receive data on a socket, whether or not it is connected. If no messages are available
    at the socket, the recvfrom() call blocks until a message arrives, unless the
    socket is not nonblocking.


    ```

    #include <sys/types.h>

    #include <sys/socket.h>

    ```


    ```

    ssize_t recvfrom(int s, void *buf, size_t len, int flags, struct sockaddr *from,
    socklen_t *from);

    ```


    If a socket is nonblocking, -1 is returned and the external variable errno is
    set to EWOULDBLOCK.'
