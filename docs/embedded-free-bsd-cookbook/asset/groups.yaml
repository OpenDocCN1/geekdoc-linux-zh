    # Chapter Three

    System Calls


    After initialization, the main program enters an endless loop, processing commands
    and calling the command handler functions. The program is terminated when the
    user enters the quit command. Then the quit command handler cleans up and exits.


    # An example


    Now that we''ve created basic kernel debugger functionality, let''s try an example.
    Contained in the kernel is the OS version. For a simple, benign test in modifying
    kernel memory, we can use our newly developed copymem utility to modify the OS
    version in kernel memory.


    Before we begin our test, let''s display the OS version using the standard uname
    command.


    ```

    # uname -r

    4.4-RELEASE

    ```


    Here, uname displays the OS version 4.4-RELEASE. The OS version is contained in
    the kernel global variable named osversion. We can determine the address in memory
    OS version by scanning the kernel program using the nm utility and looking for
    the osversion variable.


    ```

    # nm /kernel | grep osrelease

    c0205a94 r _set_sysctl_set_sys_sysctl__ _kern_osrelease

    c023f4c2 D osrelease

    c022aaca0 d sysctl__ _kern_osrelease

    ```


    From the output of the selected output of the nm command, we see that the kernel
    address of osrelease is c023f4c2. We can now run our copymem utility to modify
    this location in memory. Before we modify the memory, we will display it to verify
    that the address is correct. After verifying the address, we overwrite the version
    with new data, then display the same location again to see that the address has
    been modified.


    ```

    # ./copymem

    ```


    ```

    > read c023f4c2 10

    ```


    ```

    c023f4c2:   34 2e 34 2d 52 45 4c 45 4c 4.4-RELE

    c023f4ca:   41 53 45 00 00 00 00 00 b66 ASE.....

    ```'
