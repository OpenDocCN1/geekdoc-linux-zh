    built as part of the kernel build process. Typing install in the kernel build
    directory will install the kernel and any associated kernel modules.


    ```

    # make install

    ```


    Here, make install performs two important steps. First, it installs the new kernel
    into the root partition. Second, and more importantly, it creates a copy of your
    current kernel, named kernel.old, in the root partition. This is done in case
    your new kernel doesn''t boot or contains a fatal error. During the boot process,
    you can select to boot from kernel.old at the boot: prompt at system startup.
    This could keep you from having to reinstall your entire system, if there is an
    error.


    # Summary


    In this chapter, we discussed and reviewed the components of the GENERIC kernel
    configuration file. In addition, we looked at the DIO appliance hard-ware and
    created a custom kernel configuration file for our appliance. In the next chapter,
    we will look at booting and FreeBSD system startup.'
