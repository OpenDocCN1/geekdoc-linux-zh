    \ input looking for either the high or low string to determine the interrupt polarity\
    \ setting. If the input is correct, dio_set_polarity is called to set the interrupt\
    \ polarity.\n\n# The getpolarity_handler Function\n\nThe getpolarity_handler function\
    \ is used to read the interrupt polarity. The get command is entered using the\
    \ following syntax:\n\n> getpol\n\nGetpol takes “not” arguments.\n\n```\nvoid\n\
    getpolarity_handler(char* args, uint8_t* p)\n{\n    DIOpolarity_t polarity;\n\
    \    if (dio_get_polarity(&polarity) == 0)\n    {\n        printf(\"pol =%%d\\\
    n\", polarity);\n    }\n    else\n    {\n        printf(\"error reading polarity\\\
    n\");\n    }\n}\n```\n\nList 7-10\n\nThe getpolarity_handler calls the dio_get_polarity\
    \ function; if the call is successful, the interrupt polarity is displayed by\
    \ the DIO shell."
- md: "\n# The getdirection_handler Function\n\nThe getdirection_handler function\
    \ is used to read the direction of a digital IO line. The get direction command\
    \ is entered using the following syntax:\n\n> getdir line\n\nWhere line is a value\
    \ between 0 and 23.\n\n```c\nvoid\ngetdirection_handler(char* args) {\n    DIOLine_t\
    \ line;\n    DIOdirection_t direction;\n    sscanf(args, \"%*s %d\", &line);\n\
    \    /* check the parameters */\n    if ((line < 0) || (line > 23))\n    {\n \
    \       printf(\"illegal line number\\n\");\n        return;\n    }\n    if (dio_get_direction(line,\
    \ &direction) == 0)\n    {\n        printf(\"line %d %s\\n\", direction, (direction\
    \ == 1 ? \"in\" : \"out\"));\n    }\n    else\n    {\n        printf(\"error reading\
    \ direction\\n\");\n    }\n}\n```\n\nListing 7-11\n\nThe getdirection_handler\
    \ function parses the user input looking for the line number, dio_get_direction\
    \ is called, and the digital IO direction is displayed, either in or out, depending\
    \ on the port's configured direction.\n\n# The quit_handler Function\n\nThe quit_handler\
    \ function is used to exit the shell. The quit command is entered using the following\
    \ syntax.\n\n> quit\n\nQuit takes no arguments.\n\n```c\nvoid\nquit_handler(char*\
    \ args, uint8_t* p)\n{\n    /*\n     ** since this is the program exit we must\
    \ free the user\n     ** buffer malloced in the main program\n    */\n    free(args);\n\
    \    exit(0);\n}\n```\n\nListing 7-12\n\nThe quit command handler releases resources\
    \ and exits the shell.\n\n# The help_handler Function\n\nThe help_handler function\
    \ is used to display command help. The help-command is entered using the following\
    \ syntax.\n\n> help\n\nHelp takes no arguments.\n\n```c\nvoid\nhelp_handler(char*\
    \ args, uint8_t* p)\n{\n    command_t* cmdptr;\n\n    cmdptr = &commands[0];\n\
    \    while (cmdptr->command != NULL)\n    {\n        printf(\"%s %s\\n\", cmdptr->command,\
    \ cmdptr->helpstring);\n        cmdptr++;\n    }\n}\n```\n\nListing 7-13\n\nThe\
    \ help handler iterates through the command table, displaying the help-string\
    \ for each command.\n\n# The DIOShell Utility\n\nThe DIOShell main handles all\
    \ initialization and allocation of resources,\nthen enters the command parsing\
    \ loop until the quit command is called.\nThe utility initialization amounts to\
    \ the allocation of a command buffer of\nBUFFER_MAX bytes. Once the buffer is\
    \ successfully allocated, the parser\nloop is entered.\n\n```c\nint main(int argc,\
    \ char *argv)\n{\n    uint8_t *userp = NULL;\n\n    userp = (uint8_t *)malloc(BUFFER_MAX);\n\
    \    if (userp == NULL)\n    {\n        printf(\"%s: unable to allocate user buffer\\\
    n\");\n        exit(-1);\n    }\n\n    while (1)\n    {\n        command_t *cmdptr;\n\
    \n        printf(\"\\n \");\n        gets(userp);\n\n        /* parse the users\
    \ command * */\n        cmdptr = &commands[0];\n        while (cmdptr->command\
    \ != NULL)\n        {\n            if (strncmp(userp, cmdptr->command, strlen(cmdptr->command))\
    \ == 0)\n            {\n                cmdptr->functionptr(userp, (char *)NULL);\n\
    \            }\n            cmdptr++;\n        }\n\n        if (cmdptr->command\
    \ == NULL)\n        {\n            printf(\" invalid command\\n\");\n        }\n\
    \    }\n    /* since quit handles cleanup and exit we'll never get here */\n \
    \   exit(0);\n}\n```\n\nThe command parsing loop consists of displaying the >\
    \ prompt, reading the user input, then parsing the command. The command parsing\
    \ is performed by matching the first string entered by the user to the command\
    \ element of each entry in the command table. If there is a match, the command\
    \ handler function is called. All additional parsing and actions are handled by\
    \ each individual command handler.\n\n# The Makefile\n\n```makefile\nBASE=DIOShell\n\
    DEST=/usr/local/bin\nINCLUDES=-I../inc\nLIBRARIES=-L /usr/local/lib -ldioif\n\n\
    DIOShell: DIOShell.c\n\tgcc $(INCLUDES) -o $(BASE) $(LIBRARIES) $(BASE).c\n\t\
    cp $(BASE) $(DEST)\n\nclean:\n\trm -f $(BASE)\n\trm -f $(DEST)/$(BASE)\n\trm -f\
    \ *.o\n```\n\n# Summary\n\nThis chapter covered the basics of installing, building,\
    \ and configuring OpenBSD, using FreeBSD. After the discussion of OpenBSD, we\
    \ developed a framework used to implement a basic command line parser that uses\
    \ callbacks to implement actions based on user input. This framework is used to\
    \ implement DIOShell, a digital IO specific shell.\n\n# JNI Layer\n\n## Overview\n\
    \nThe next phase of development in the DIO project is to make Java-aware. The\
    \ first step toward this is to develop a Java Native Interface (JNI) for the DIO\
    \ library. The JNI is a programming interface, included in the Java Development\
    \ Kit (JDK) for FreeBSD, for writing Java methods for calling C/C++ routines.\n\
    \n- Installing the JDK for FreeBSD\n- Defining JNI features\n- Implementing native\
    \ types in Java\n- Implementing JNI interface layer for the DIO library\n\n##\
    \ The JDK\n\nBefore we begin JNI layer for the DIO library, our development environment\
    \ must be configured for Java development. Configuring the development environment\
    \ consists of downloading a copy of the Java Development Kit and setting a few\
    \ environment variables.\n\n## Getting the JDK\n\nThe first step in developing\
    \ JNI layer is obtaining a copy of the JDK. The JDK is not a standard item in\
    \ the FreeBSD distribution but is available in FreeBSD ports. To obtain the latest\
    \ copy of the JDK, change the working directory to the ports directory, `/usr/ports/java/jdk`\
    \ and execute the following commands:\n\n```bash\ncd /usr/ports/java/jdk\nmake\n\
    make install\nmake clean\n```\n\nThese instructions can be used to update, build\
    \ and install any of the FreeBSD packages. The make command retrieves and builds\
    \ the latest version of the specific port. The next step, make install, installs\
    \ the binaries on your system. After the port is updated, built, and installed,\
    \ it's a good idea to clean temporary build files. The make clean handles the\
    \ details of cleaning up the build files.\n\n## The JDK_HOME Environment Variable\n\
    \nMany of the JDK tools, build environment, and run-time environment depend on\
    \ the JDK_HOME variable to run correctly. After building and installing the JDK,\
    \ you'll want to set your JDK_HOME environment variable to the directory where\
    \ the JDK was installed. On my development system, the JDK is installed in /usr/local/jdk18.\
    \ A quick look at my environment using the setenv command shows the JDK_HOME environment\
    \ variable.\n\n```bash\nsetenv JDK_HOME /usr/local/jdk18\n```\n\nA place to set\
    \ the JDK_HOME environment variable is in your startup scripts. My account uses\
    \ csh; the following line is added to my .cshrc script so it is set at login.\n\
    \n```bash\nsetenv JDK_HOME /usr/local/jdk18\n```\n\n## The Classpath Environment\
    \ Variable\n\nThe CLPATH variable tells the Java Virtual Machine and other Java\
    \ applications (for example, the Java tools located in the jdk18/bin directory)\
    \ in which directory to find the class libraries, using user-defined class libraries.\
    \ The DIO class libraries are kept in a separate directory in /usr/local/dio,\
    \ the directory used to keep the DIO software.\n\n```bash\nsetenv CLPATH=/usr/local/dio/class\n\
    ```\n\nThe CLPATH variable is set in the login script.\n\n## The LD_LIBRARY_PATH\
    \ Environment Variable\n\nLD_LIBRARY_PATH is an environment variable where the\
    \ system's shared-library loader looks for shared libraries before looking in\
    \ the system's default shared-library directories. The default shared-library\
    \ search path is /lib, /usr/lib, /usr/local/lib.\n\n```bash\nsetenv LD_LIBRARY_PATH=/usr/local/dio/lib\
    \ own```\n\nAs with the JDK_HOME and CLPATH environment variables, the LD_LIBRARY_PATH\
    \ variable is set in login startup scripts.\n\n## Creating the JNI Layer\n\nIn\
    \ this section we are developing a JNI layer to read and write IO lines and read\
    \ the configured direction of a line. Since we've already developed a C interface\
    \ to perform these tasks, an intermediate layer is developed, the JNI, which provides\
    \ the mechanism to call C code from Java code.\n\nBefore we turn the crank and\
    \ begin emitting mass quantities of Java source code, let's take a look at the\
    \ procedure for developing our JNI interface. First, we need to identify the features\
    \ that are being called from Java. As previously mentioned, they are read line,\
    \ write line, and read direction. These three capabilities have been implemented\
    \ by the DIO interface as dio_set_line, dio_get_line, and dio_read_direction.\
    \ In addition to the functions, we are going to implement the enums used by these\
    \ C functions. Java doesn't support enums as a native type, so we'll need to create\
    \ one.\n\n![](img/8be5cdcebf09c36e2285b8e096cda24a_146_0.png)\n\nWith the features\
    \ defined, we'll take the first step in developing the JNI layer—defining a Java\
    \ interface for the DIO interface library. The Java interface is a Java class\
    \ that uses native functions as the bridge to call our DIO interface library.\
    \ The Java functions call the native functions, which, in turn, call the C functions.\n\
    \nAfter the Java class is defined, the Java compiler, javac, is run, which produces\
    \ the Java class files. Java class files are byte codes typically executed by\
    \ the Java environment.\n"
