  - '[PAGE 199]


    # Configuring the CompactFlash Device


    Configuring the CompactFlash device is similar to configuring any other boot device
    for FreeBSD. The development hardware we''re using has the development disk installed
    as the primary master device (ad0) and the CompactFlash installed as the secondary
    master device (ad2).


    To create the initial configuration for the CompactFlash device, we''ll use the
    standard tools for creating a FreeBSD installation. Because the CompactFlash device
    appears as an IDE disk, all the tools run normally. For our first task, we will
    partition and format the CompactFlash so we can load the DIO appliance software.
    To get started, change directory to the /stand directory and run sysinstall.


    ```

    # cd /stand

    # ./sysinstall

    ```


    # Partitioning the CompactFlash Device


    After starting sysinstall, choose custom from the installation menu, then choose
    partition. Sysinstall will ask you to select the drive to partition. Select ad2,
    the CompactFlash device.


    In the partition menu


    After choosing to write the partition information to the CompactFlash, you will
    then be prompted to install the boot manager. You should choose the FreeBSD Boot
    Manager. The CompactFlash device is now partitioned. You can exit from the partition
    menu by choosing the q option.


    # Creating the Disklabel


    The next step is to create a disklabel in the existing partition. Select the label
    options from the sysinstall menu. In the label menu, create a partition that will
    be mounted as the root partition, /, that consists of the entire space available.'
