    \ to create a child process. There are two control paths in the main program,\
    \ one for the parent and another for the child.\n\n```c\nint main(int argc, char\
    \ **argv) {\n    pid_t pid;\n    int status;\n\n    if ((pid = fork()) > 0) {\n\
