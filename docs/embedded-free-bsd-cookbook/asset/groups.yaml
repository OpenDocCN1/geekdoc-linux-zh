    ## 第十章章

    构建内核


    ## 要构建 SMP 内核，需要以下两项


    #options # 对称多处理器内核 (SMP Kernel)


    #options APIC_IO # 对称 (APIC) I/O


    ## 控制器与设备驱动程序


    ### 总线 下节提供了系统总线的支持。数据日志器使用 ISA 和 PCI 总线；EISA 将被移除。


    device isa

    device eisa

    device pci


    ### 软驱驱动器 数据日志器最多支持单个软驱驱动器；第二个设备可以被移除。


    - 软驱驱动器

    device fdc0 at is isa? port IO_FD1 irq 6 drq 2

    device fd0 at fdc0 0

    device fd1 at fdc0 1


    ### ATAPI 控制器 下节提供了对 ATA 和 ATAPI 设备的支持。DIO 设备使用 ATA 磁盘和 ATAPI CDROM 支持来启动并访问外设，用于调试和升级。


    device ata0 at isa? port IO_WD1 irq 14

    device atal at isa? port IO_WD2 irq 15

    device ata

    device atadisk # ATA 磁盘驱动

    device atpicid # ATAPI CDROM 驱动

    device atapifd # ATAPI 软驱驱动

    device atapist # ATAPI 磁带驱动

    options ATA_STATIC_ID #静态设备编号


    ### SCSI 控制器 GENERIC 内核提供了许多 SCSI 控制器和设备的支持。DIO 设备未使用任何 SCSI 外设，所有这些都可以被移除。


    device ahb # EISA AHA1742 系列

    device ahc # AHA2940 和板载 AIC7xxx 设备

    device amd # AMD 53C974 (Tekram DC-390(T))

    device isp # Qlogic 系列

    device ncr # NCR/Symbios Logic

    device sym # NCR/Symbios Logic (较新的芯片组)

    options SYM_SETUP_LP_PROBE_MAP=0x40

    when # 允许 ncr 挂载旧版 NCR 设备

    # sym 和 ncr 都已配置


    device adv0 at isa?

    device adw

    device bt0 at isa?

    device aha0 at isa?

    device aic0 at isa?

    device ncv # NCR 53C5000

    device nsp # Workbit Ninja SCSI-3

    device stg # TMC 1803/1850


    # SCSI 外设

    device scbus # SCSI 总线 (必需)

    device da # 直接访问 (磁盘)

    device sa # 顺序访问 (磁带)

    device cd # CD

    device pass # 透传设备 (直接 SCSI 访问)


    ### RAID 控制器 像 SCSI 一样，GENERIC 内核提供了许多 RAID 外设的支持。数据日志器未使用任何 RAID 设备，因此所有这些都可以被移除。


    # 接口到 SCSI 子系统的 RAID 控制器

    device asr # DPT SmartRAID, VI, 和 Adaptec SCSI RAID

    device dpt # DPT Smartcache - 查看链接获取选项！

    device mly # Mylex AccelerRAID/extREMERAID


    # RAID 控制器

    device aac # Adaptec FSA RAID, Dell PERC2/PERC3

    device ida # Compaq Smart RAID

    device amr # AMI MegaRAid

    device mlx # Mylex DAC960 系列

    device twe # 3ware Escalade


    ### 键盘和鼠标 下节构建了键盘、控制台、鼠标以及 FreeBSD 启动屏的支持。我们将保留所有这些支持以用于 DIO 的调试和管理，但启动屏将被移除。


    ```bash

    # atkbd0 同时控制键盘和 PS/2 鼠标

    device atkbd0 at isa? port IO_KBD

    device atkbd0 at atkbd0? irq 1 flags 0x1

    device psm0 at atkbd0? irq 12

    ```


    ```bash

    device vga0 at isa?

    ```


    ```bash

    # 启动屏/屏幕保护程序

    pseudo-device splash

    ```


    ```bash

    # syscons 是默认控制台驱动，类似于 SCO 控制台

    device sc0 at isa? flags 0x100

    ```


    ```bash

    # 启用此项和 PCVT_FREEBSD 以获得兼容 vt220 的控制台

    #device vt0 at isa?

    #options XSERVER # 在 vt 控制台上支持 X 服务器

