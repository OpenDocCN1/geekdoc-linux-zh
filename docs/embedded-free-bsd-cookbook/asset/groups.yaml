    \ been built as part of the kernel build process. Typing install in the kernel\
    \ build directory will install the kernel and any associated kernel modules.\n\
    \n```\n# make install\n```\n\nHere, make install performs two important steps.\
    \ First, it installs the new kernel into the root partition. Second, and more\
    \ importantly, it creates a copy of your current kernel, named kernel.old, in\
    \ the root partition. This is done in case your new kernel doesn't boot or contains\
    \ a fatal error. During the boot process, you can select to boot from kernel.old\
    \ at the boot: prompt at system startup.\n\n# Summary\n\nIn this chapter, we discussed\
