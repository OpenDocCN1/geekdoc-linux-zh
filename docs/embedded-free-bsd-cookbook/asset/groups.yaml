- md: "\nAfter parsing the write parameters, the write command accepts additional\
    \ input from the user, the data to write to the location. Once the data is input,\
    \ the write handler calls the copymem system call to write to the kernel memory.\n\
    \n## Quit Handler\n\nThe quit handler is used to clean up and exit the program.\
    \ The quit command handler does not use the input parameters; they are ignored.\n\
    \n```c\nvoid quit_handler(int num, char* args)\n{\n/*\n ** since this is the program\
    \ exit we must free the user\n ** buffer malloced in the main program\n */\nfree(args);\n\
    exit(0);\n}\n```\n\nListing 3-16\n\nThe quit handler frees the user buffer used\
    \ for commands, then exits the program normally.\n\n## Help Handler\n\nThe command\
    \ handler is used to display help text strings. The help command handler does\
    \ not use the input parameters; they are ignored.\n\n```c\n/*\n ** display help\
    \ commands\n */\nvoid help_handler(int num, char* args)\n{\ncommand_t* cmdptr;\n\
    /* parse the users command */\ncmdptr = &commands[0];\nwhile (cmdptr->command\
    \ != NULL)\n{\nprintf(\"\\t%s\\n\", cmdptr->helpstring);\ncmdptr++;\n}\n}\n```\n\
    \nListing 3-17\n\n## Chapter Three\n### System Calls\n\nEvery command entry contains\
    \ a help text string. The help command handler iterates through all the commands\
    \ and displays each command help string.\n\n## The main Program\n\nThe copymem\
    \ program handles initialization and command parsing. Since the copymem system\
    \ call is a KLD and the system call number is dynamically assigned, the system\
    \ call number must be determined by querying the kernel module subsystem. This\
    \ can be accomplished by calling modfind and modstat. The modfind call takes the\
    \ name of a kernel module; the copymem system call is named copymem; modfind returns\
    \ the module ID.\n\n```c\n#include <sys/param.h>\n#include <sys/module.h>\nint\
    \ modfind(const char *modname);\n```\n\nOnce we have the module ID, modstat is\
    \ called to obtain the module_stat structure. The module_stat structure contains\
    \ the system call number in the module_stat.data.interval element.\n\n```c\n#include\
    \ <sys/param.h>\n#include <sys/module.h>\nint modstat(int in, struct module_stat\
    \ *stat);\n```\n\nNow that we have the dynamically assigned system call number\
    \ for copymem, the system call number is passed to the handler functions, so they\
    \ can make the appropriate system call.\n\nOnce we have determined the system\
    \ call number, a user buffer is allocated to pass the command arguments to the\
    \ command handler functions. The size of the user buffer BUFFER_MAX is arbitrary.\
    \ The main function listing is below.\n\n```c\nint main(int argc, char** argv)\n\
    {\n    int err;\n    int syscall_num;\n    char* userp = NULL;\n    struct module_stat\
    \ stat;\n\n    /* verify the module is loaded */\n    memset(&stat, 0, sizeof(struct\
    \ module_stat));\n    stat.version = sizeof(struct module_stat);\n```\n\nerr =\
    \ modstat(modfind(\"copymem\"), &stat);\nif (err != 0)\n{\n    printf(\"%s unable\
    \ to obtain dumpmem system call\\ninformation\\n\", argv[0]);\n    exit(0);\n\
    }\n\n/* retrieve the system call number */\nsyscall_num = stat.data.intval;\n\n\
    userp = (uint_t *)malloc(BUFFER_MAX);\nif (userp == NULL)\n{\n    printf(\"%s:\
    \ unable to allocate user buffer\\n\");\n    exit(-1);\n}\n\nwhile (1)\n{\n  \
    \  command_t* cmdptr;\n\n    printf(\"\\n> \");\n    gets(userp);\n\n    /* parse\
    \ the users command */\n    cmdptr = &commands[0];\n    while (strncmp(userp,\
    \ cmdptr->command, strlen(cmdptr->command)) == 0)\n    {\n        cmdptr->functionptr(syscall_num,\
    \ userp);\n    }\n\n    cmdptr++;\n\n}\n\n/* since quit handles cleanup and exit\
    \ we'll never get here */\nreturn(err);\n```\n\nListing 3-18\n\nAfter initialization,\
    \ the main program enters an endless loop, processing commands and calling the\
    \ command handler functions. The program is terminated when the user enters the\
    \ quit command. Then the quit command handler cleans up and exits.\n\n## An example\n\
    \nNow that we've created basic kernel debugger functionality, let's try an example.\
    \ Contained in the kernel is the OS version. For a simple, benign test in modifying\
    \ kernel memory, we can use our newly developed copymem utility to modify the\
    \ OS version in kernel memory.\n\nBefore we begin our test, let's display the\
    \ OS version using the standard uname command.\n\n```bash\n# uname -r\n4.4-RELEASE\n\
    ```\n\nHere, uname displays the OS version 4.4-RELEASE. The OS version is contained\
    \ in the kernel global variable named osversion. We can determine the address\
    \ in memory OS version by scanning the kernel program using the nm utility and\
    \ looking for the osversion variable.\n\n```bash\n# nm /kernel | grep osrelease\n\
    c0205a94 r _set_sysctl_set_sys_sysctl__ _kern_osrelease\nc023f4c2 D osrelease\n\
    c022aaca0 d sysctl__ _kern_osrelease\n```\n\nFrom the output of the selected output\
    \ of the nm command, we see that the kernel address of osrelease is c023f4c2.\
    \ We can now run our copymem utility to modify this location in memory. Before\
    \ we modify the memory, we will display it to verify that the address is correct.\
    \ After verifying the address, we overwrite the version with new data, then display\
    \ the same location again to see that the address has been modified.\n\n```bash\n\
    # ./copymem\n```\n\n```\n> read c023f4c2 10\n```\n\n```\nc023f4c2:   34 2e 34\
    \ 2d 52 45 4c 45 4c 4.4-RELE\nc023f4ca:   41 53 45 00 00 00 00 00 b66 ASE.....\n\
    ```\n\n```\n> write c023f4c2 8\n>> cookbook\n```\n\n```\n> > read c023f4c2 10\n\
    ```\n\n```\nc023f4c2:   34 2e 34 2d 52 45 4c 45 4c 4.4-RELE\nc023f4ca:   41 53\
    \ 45 00 00 00 00 00 b66 ASE.....\n```\n\n```\n> quit\n```\n\nUsing copymem, we\
    \ have successfully modified the osversion string. One final check, we will rerun\
    \ the uname command and see that, in fact, we have modified the.\n\n## Summary\n\
    \nIn this chapter we have discussed the details of system calls. Understanding\
    \ how this work is an excellent introduction to kernel hacking. As part of our\
    \ discussion, we've implemented a system call and utility that will allow us.\n\
    \n## Device Driver\n### Overview\n\nA device driver is an extension of the kernel\
    \ that implements a standard software interface to hardware. Device drivers consist\
    \ of data structures and functions provided by the driver writer. The kernel calls\
    \ functions in response to conditions, such as driver load, power event, or application\
    \ requesting a service.\n\nIn order to develop a device driver, an understanding\
    \ of the related data structures is needed. This chapter covers topics including:\n\
    \n- Driver environment\n- Device data structures\n- Driver method functions\n\
    - Steps for developing a FreeBSD device driver\n- The PCI device driver\n\n##\
    \ Driver Environment\n\nA FreeBSD device driver contains two major components,\
    \ autoconfiguration, device_method_t, and the device switch table. Before discussing\
    \ the implementation of the data structures, let's take a look at the environment\
    \ of a device driver and the role each of the data structures plays in a running\
    \ system.\n\n## Autoconfiguration\n\nThe autoconfiguration code detects the hardware\
    \ at load time and is responsible for allocating hardware resources during load,\
    \ deallocating hardware resources on unload, and putting hardware in a consistent\
    \ state in response to power management events. The auto configuration code typically\
    \ is used at load and unload time.\n\n![](img/8be5cdcebf09c36e2285b8e096cda24a_52_0.png)\n\
    \nAutoconfiguration is the procedure carried out by the FreeBSD kernel that dynamically\
    \ finds and enables hardware. The kernel probes for system buses and, for each\
    \ bus that is found, devices are attached, initialized, and configured. During\
    \ autoconfiguration, a device probe routine is called. Probe is responsible for\
    \ detecting the hardware to determine if any other devices are attached. Once\
    \ a device is successfully probed the FreeBSD kernel must attach to it. The attached\
    \ function initializes the device hardware and any software state.\n\n## The Device\
    \ Switch Table\n\nThe device switch table consists of a set of routines that comprise\
    \ the upper and lower halves of the device driver. The upper half provides the\
    \ system implementation for the device driver such as read, write, open, ioctl\
    \ and close. Upper half functions execute synchronously with a user process and\
    \ are preemptible, permitted to block. The lower half routines interface with\
    \ the device registers and implement the hardware interrupt service routine. Lower\
    \ half routines are not preemptible and cannot block.\n"
