    # The DIO Daemon


    Now that we''ve introduced the socket system calls, we will use them to create
    the DIO daemon. The DIO daemon is a connection-oriented, socket-based daemon used
    to handle requests related to the PCI-DIO24 acquisition board. The DIO daemon,
    in connection with a simple protocol developed in this section, is used to provide
    a client with a simple mechanism to query digital IO lines on our server.


    # Protocol


    Before delving into the details of the digital IO daemon, we will define the protocol
    used between the client and server. The protocol consists of the operations that
    are performed by the DIO daemon and the format of the requests. The complete protocol
    consists of an enum that defines the set of operations that are provided by the
    DIO daemon and a structure used to transfer data between the DIO server and client.


    # The operation_t enum


    The DIO daemon performs three operations: read the direction of a line, read a
    line, and write a line. These operations are defined by the enum operation_t.'
