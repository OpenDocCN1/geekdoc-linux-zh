    \ Overview\n\nMany Internet appliances are installed in a remote location that\
    \ is not easily accessible. One feature often required by an Internet appliance\
    \ is remote management. Remote management is often implemented using telnet, login\
    \ and rsh. Although these tools are reliable, they are insecure. The Secure Shell\
