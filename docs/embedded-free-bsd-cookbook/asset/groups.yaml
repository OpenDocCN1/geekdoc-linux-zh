    # 如果你使用的是 ThinkPAD，请取消注释此行以及其余

    # PCVT 行

    #options PCVT_SCANSET=2 # IBM 键盘是非标准的

    ```


    > 内核需要浮点设备；请勿移除此行。


    ```bash

    # 浮点支持 - 请勿禁用。

    device npx0 at nexus? port IO_NPX irq 13

    ```


    ### 电源管理 FreeBSD 有提供电源管理的选项。数据日志器未使用电源管理，可以移除。


    ```bash

    # 电源管理支持（参见 LINT 更多选项）

    device apm0 at nexus? disable flags 0x20 # 高级电源管理

    ```


    ### PCCARD 支持 GENERIC 内核提供了对 PCCARD 外设的支持。这些可以被移除。


    ```bash

    # PCCARD (PCMIA) 支持

    device card

    device pcic0 at isa? irq 0 port 0x3e0 iomem 0xd0000

