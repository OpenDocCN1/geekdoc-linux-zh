    PCI 配置空间中。


    ## 第五章


    寄存器的编程细节见于 Measurement Computing 随控制器一同提供的 PCI-DIO24 用户手册。PCI-DIO24 控制器使用 PLX
    9052 PCI 从机接口控制器。更多细节请参阅 PLX Technology 提供的 PCI 9052 数据手册。


    PCI 控制器使用硬件资源，如 IO 端口寄存器、内存映射寄存器和中断。所用资源的细节包含在设备的 PCI 配置寄存器中。PCI 配置包含 6 个基地址寄存器（0–5）。关于
