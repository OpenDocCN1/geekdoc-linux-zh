  mdcn: "\n\n典型的设备驱动程序接受来自上半部分（upper half）的请求，然后将请求放入队列由下半部分（lower half）处理。每个请求都存放入一个由上下两半部分共享的公共数据结构中。由于设备驱动程序的上半部分和下半部分独立运行；因此，对设备驱动程序上下部分共享的任何数据进行适当的同步至关重要。\n\
