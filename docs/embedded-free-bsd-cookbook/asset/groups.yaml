    # TCP


    TCP provides a reliable, connection-oriented protocol. Connection-oriented means
    that two applications must establish a TCP connection before they begin exchanging
    data. TCP provides reliability by breaking each transfer into manageable segments
    and verifying that each segment arrives correctly at its destination. In addition
    to the verification of data, TCP consists of flow control, so a destination host
    does not lose data due to lack of buffer space.


    # Application Layer


    The application layer consists of network-aware applications that send and receive
    packets, using UDP and TCP ports. The application layer is not specifically a
    layer of the TCP/IP stack but a customer of the TCP/IP stack. As part of the application
    layer, a user will find services that provide network file and print sharing services,
    name resolution services, and user interfaces.


    # Socket System Calls


    The programming interface for developing socket-based solutions using FreeBSD
    is sockets. Socket-based applications are typically written to two networked applications.
    Networked applications are typically written as interacting components, client
    and server. A server handles requests from a number of clients. A client, or application,
    makes requests to a server. An example of the client-server model is the World
    Wide Web. Your browser is a client application; web sites, or the computers that
    host the web sites, are the servers.


    Implementation of a server consists of establishing a listening socket, waiting
    for a client connection, accepting the client request, performing the client request,
    and closing the connection. The DIO daemon developed later in this chapter is
    an example of a socket-based server.


    A client creates a connection socket, sends its request to the server, processes
    any received data, and closes the connection. Each server may process requests
    from many clients.


    # Network Byte Order


    Any application that transfers data from one computer to another computer must
    be concerned with how the data is read. Different processors represent data in
    different formats. The two most widely accepted ways of representing data are
    known as big endian and little endian. Big endian systems store the most significant
    byte first, and little endian systems store the least significant byte first.
    For socket applications, the standard method of data transfer is big endian, also
    known as the network byte order.


    | Byte 0 | Byte 1 | Byte 2 | Byte 3 |

    | --- | --- | --- | --- |


    # Big Endian


    | Byte 3 | Byte 2 | Byte 1 | Byte 0 |

    | --- | --- | --- | --- |


    # Little Endian


    The socket system call interface provides functions to convert shorts and longs
    between host and network byte order. Each of these calls is described below.


    **The htonl System Call**


    The htonl system call converts a host long (32 bits) to network byte order.


    ```

    #include <sys/param.h>

    u_long htonl(u_long hostlong);

    ```


    The return value is the converted long word.


    **The htons System Call**


    The htons system call converts a host short word (16 bits) to network byte order.


    ```

    #include <sys/param.h>

    u_short htons(u_short hostshort);

    ```


    The return value is the converted short word.


    # The ntohl System Call


    The ntohl system call converts a network longword (32 bits) to host byte order.


    ```

    #include <sys/param.h>

    u_long ntohl(u_long netlong);

    ```


    The return value is the converted long word.


    # The ntohs System Call


    The ntohs system call converts a host short word (16 bits) to host byte order.


    ```

    #include <sys/param.h>

    u_short ntohs(u_short netshort);

    ```


    The return value is the converted short word.


    # Sockets


    FreeBSD provides a set of system calls used for socket communications. In this
    section, the socket system calls are described and categorized based on their
    use. Subsequent sections demonstrate usage of the socket system calls.


    # Connection Initiation


    Before data is transferred between a client and server, a connection must be established.
    Socket connections are created by calling socket system calls. Socket system calls
    that create a connection are the same for both clients and servers. In the following
    sections, the sockets system calls used for creating sockets and establishing
    a socket connection are presented.


    # The socket System Call


    The basic means of communication over a network is a socket, which is an end point
    of communication. Sockets are created by calling the socket system call.


    ```

    #include <sys/types.h>

    #include <socket.h>

    ```


    ```

    int socket(int domain, int type, int protocol);

    ```


    Here, socket, returns a descriptor to be used with subsequent socket calls.

    Socket takes three parameters. The first is the domain, which selects the domain
    in which communication will take place; there are many domains defined for sockets.
    Our implementation of the diod daemon is Internet-based, so PF_INET is the domain
    that represents the Internet protocol family.


    The second parameter, type, defines the semantics of the connection. The defined
    types are listed in the following table.


    | Type | Notes |

    | --- | --- |

    | SOCK_STREAM | Sequenced reliable full duplex byte stream |

    | SOCK_DGRAM | Connectionless unreliable communication |

    | SOCK_RAW | Interface to internal Internet protocols |

    | SOCK_RDDGM | Reliable delivery packet sequenced packet stream |


    The third parameter, protocol, is used to select the protocol for the connection.
    Most sockets only support one protocol for each specified connection; the protocol
    parameter is typically 0.


    Socket returns a valid socket if successful, or -1 if an error occurs.


    # The bind System Call


    Before data can be transmitted with a socket, the socket must be associated with
    a service port. The bind system call is used to bind a socket.


    ```

    #include <sys/types.h>

    #include <socket.h>

    ```


    ```

    int bind(int s, struct sockaddr* addr, socklen_t len);

    ```


    The bind system call takes three parameters. The first is the socket descriptor
    returned by the socket call. The second parameter is the address. The third parameter
    is the length of the structure.

