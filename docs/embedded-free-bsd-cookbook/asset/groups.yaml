    # Summary


    This chapter covered the basics of installing, building, and configuring OpenSSH,
    the secure shell, using FreeBSD. The secure shell provides the basic logic allowing
    secure access to the DIO appliance.


    After the discussion of OpenSSH we developed a framework used to implement a basic
    command line parser and engine that uses callbacks to implement actions based
    on user input. This framework is used to implement the DIOShell, a digital IO
    specific shell for the DIO Appliance.'
