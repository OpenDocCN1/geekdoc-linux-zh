    \ \\\nstatic struct syscall_module_data name##syscall_mod = { \\\n    evh, arg,\
    \ offset, new_sysent \\\n};\n```\n\n# 内核可加载模块\n\n第一个参数是该系统调用的通用名称。第二个参数是表示系统号的\
