    TCP 提供了一种可靠的、面向连接的协议。面向连接意味着两个应用程序在开始交换数据之前必须建立 TCP 连接。TCP 通过将每次传输拆分为可管理的分段，并验证每个分段是否正确到达目的地来提供可靠性。除了数据验证外，TCP
    还包含流量控制，因此目的主机不会因为缺乏缓冲区空间而丢失数据。


    # 应用层


    应用层由由感知网络的应用程序组成，这些应用程序使用 UDP 和 TCP 端口发送和接收数据包。应用层并不是 TCP/IP 栈中的特定某一层，而是 TCP/IP
    栈的客户。作为应用层的一部分，用户会发现提供网络文件和打印共享服务、域名解析服务以及用户界面的服务。


    # Socket 系统调用


    使用 FreeBSD 开发基于 socket 的解决方案的编程接口是 socket。基于 socket 的应用程序通常编写在两个网络应用程序之间。网络应用程序通常被编写成交互组件：客户端和服务器。服务器处理来自多个客户端的请求。客户端（或应用程序）向服务器发出请求。客户端-服务器模型的一个例子是万维网（World
    Wide Web）。你的浏览器是一个客户端应用程序；网站或托管网站的计算机就是服务器。


    服务器的实现包括建立监听 socket、等待客户端连接、接受客户端请求、执行客户端请求以及关闭连接。本章后面开发的 DIO 守护进程就是一个基于 socket
    的服务器示例。


    客户端创建一个连接 socket，向服务器发送请求，处理收到的任何数据并关闭连接。每个服务器可能会处理来自许多客户端的请求。


    # 网络字节序


    任何从一台计算机传输数据到另一台计算机的应用程序必须关心数据如何被读取。不同的处理器以不同的格式表示数据。两种最广泛接受的数据表示方式被称为大端（big endian）和小端端（little
    endian）。大端系统首先存储最高字节，而小端系统首先存储最低字节。对于 socket 应用程序，数据的标准传输方法是大端，也称为网络字节序。


    | 字节 0 | 字节 1 | 字节 2 | 字节 3 |

    | --- | --- | --- | --- |


    # 大端


    | 字节 3 | 字节 2 | 字节 1 | 字节 0 |

    | --- | --- | --- | --- |


    # 小端


    socket 系统调用接口提供了在主机字节序和网络字节序之间转换短整数（shorts）和长整数（longs）的函数。下面描述了这些每一个调用。


    **htonl 系统调用**


    htonl 系统调用将主机长整数（32 位）转换为网络字节序。


    ```

    #include <sys/param.h>

    u_long htonl(u_long hostlong);

    ```


    返回值为转换后的长字值。


    **htons 系统调用**


    htons 系统调用将主机短整数（16 位）转换为网络字节序。


    ```

    #include <sys/param.h>

    u_short htons(u_short hostshort);

    ```


    返回值为转换后的短字值。


    # ntohl 系统调用


    ntohl 系统调用将网络长整数（32 位）转换为主机字节序。


    ```

    #include <sys/param.h>

    u_long ntohl(u_long netlong);

    ```


    返回值为转换后的长字值。


    # ntohs 系统调用


    ntohs 系统调用将主机短整数（16 位）转换为主机字节序。


    ```

    #include <sys/param.h>

    u_short ntohs(u_short netshort);

    ```


    返回值为转换后的短字值。


    # Sockets


    FreeBSD 提供了一组用于 socket 通信的系统调用。在本节，将根据用途对 socket 系统调用进行描述和分类。后续章节将演示 socket 系统调用的用法。


    # 连接建立


    在客户端和服务器之间传输数据之前，必须建立连接。Socket 连接通过调用 socket 系统调用创建。创建连接的 socket 系统调用对于客户端和服务器都是相同的。在接下来的章节中将介绍用于创建
    socket 和建立 socket 连接的 socket 系统调用。


    # socket 系统调用


    在网络进行通信的基本手段是 socket，它是通信的端点。socket 通过调用 socket 系统调用来创建。


    ```

    #include <sys/types.h>

    #include <socket.h>

    ```


    ```

    int socket(int domain, int type, int protocol);

    ```


    在这里，socket 返回一个用于后续 socket 调用的描述符。

    socket 接受三个参数。第一个是域（domain），用于选择进行通信的域；为 socket 定义了许多域。我们对 diod 守护进程的实现是基于互联网的，因此
    PF_INET 是代表互联网协议族的域。


    第二个参数类型（type）定义了连接的语义。定义的类型列如下表所示。


    | 类型 | 备注 |

    | --- | --- |

    | SOCK_STREAM | 有序可靠的全双工字节流 |

    | SOCK_DGRAM | 无连接的不可靠通信 |

    | SOCK_RAW | 内部互联网协议的接口 |

    | SOCK_RDDGM | 可靠交付有序数据包流 |


    第三个参数协议（protocol）用于选择连接的协议。大多数 socket 对每个指定的连接仅支持一种协议；协议参数通常为 0。


    socket 如果成功则返回有效的 socket，如果发生错误则返回 -1。


    # bind 系统调用


    在使用 socket 传输数据之前，必须将 socket 与服务端口关联。bind 系统调用用于绑定 socket。


    ```

    #include <sys/types.h>

    #include <socket.h>

    ```


    ```

    int bind(int s, struct sockaddr* addr, socklen_t len);

    ```


    bind 系统调用接受三个参数。第一个是 socket 调用返回的 socket 描述符。第二个参数是地址。第三个参数是结构的长度。


