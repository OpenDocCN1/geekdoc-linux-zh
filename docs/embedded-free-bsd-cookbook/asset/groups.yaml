    # Device Driver


    # Overview


    A device driver is an extension of the FreeBSD kernel that implements a standard
    software interface to hardware. Device drivers consist of data structures and
    a fixed set of functions provided by the device driver writer. The kernel calls
    driver functions in response to conditions, such as a driver load, power management
    event, device interrupt, or an application requesting a service.


    In order to develop a device driver, an understanding of the related kernel data
    structures and driver method functions is needed. This chapter covers topics including:


    +   - Driver environment

    - Device driver kernel data structures

    - Driver method functions

    - Steps for developing a FreeBSD device driver

    - The PCIO-DIO24 device driver


    # Driver Environment


    A FreeBSD device driver contains two major components, autoconfiguration, device_method_t,
    and the device switch table, cdevsw. Before discussing the implementation of the
    data structures, let''s take a look at the environment of a device driver and
    the role each of the data structures plays in a running FreeBSD system.'
  - '[PAGE 52]


    # Autoconfiguration


    The autoconfiguration code detects the hardware at load time and is responsible
    for allocating hardware resources during load, deallocating hardware resources
    on unload, and putting hardware in a consistent state in response to power management
    events. The auto configuration code typically is used at load and unload time.


    ![](img/8be5cdcebf09c36e2285b8e096cda24a_52_0.png)


    Autoconfiguration is the procedure carried out by the FreeBSD kernel that dynamically
    finds and enables hardware. The kernel probes for system buses and, for each bus
    that is found, devices are attached, initialized, and configured. During autoconfiguration,
    a device probe routine is called. Probe is responsible for detecting the hardware
    to determine if any other devices are attached. Once a device is successfully
    probed the FreeBSD kernel must attach to it. The attached function initializes
    the device hardware and any software state.


    # The Device Switch Table


    The device switch table consists of a set of routines that comprise the upper
    and lower halves of the device driver. The upper half provides the system implementation
    for the device driver such as read, write, open, ioctl and close. Upper half functions
    execute synchronously with a user process and are preemptible, permitted to block.
    The lower half routines interface with the device registers and implement the
    hardware interrupt service routine. Lower half routines are not preemptible and
    cannot block.'
