    \ DIO 设备是专用系统，因此交换是不必要的。\n\n我们的 `rc.sysctl` 文件包含以下行：\n\n```bash\nswap_enabled=0\n\
    ```\n\n## 自定义\n\n`rc` 执行的任务之一是寻找用户定义的启动脚本。`rc` 脚本会在定义的目录中搜索以 `.sh` 为后缀名结尾的文件。`local_startup`\
    \ 变量由 `/etc/rc.conf` 设置，它定义了搜索的本地路径。默认值为 `/usr/local/etc/rc.d`。\n\n```bash\n#\
