    对 PCI-DIO24 硬件寄存器的所有均通过两个内部库函数 `dio_get` 和 `dio_set` 提供。这两个函数负责在必要时获取设备的文件描述符；将数据封装到\
    \ `ioctl` 结构中；并向驱动程序发出相应的 `ioctl` 调用。\n\n```c\nstatic int32_t dio_get(int32_t\
    \ reg, int32_t *pval)\nstatic int32_t dio_set(int32_t reg, int32_t val)\n```\n\
    \n这两个函数的实现相似。列表 5-1 展示了如何驱动指向设备的文件描述符。如果内部文件描述符 `diofd` 未设置，函数将尝试使用以下代码打开设备并获取文件描述符。\n\
    \n```c\n/* 如果设备未打开，则打开它 * */\nif (diofd == -1)\n{\n    diofd = open(\"/dev/dio0\"\
    , O_RDWR);\n    if (diofd == -1)\n    {\n        return(-1);\n    }\n}\n```\n\n\
    一旦获取了有效的文件描述符，代码会将请求封装到相应的 `ioctl` 结构中。回想上一章，向 DIO 设备驱动程序的 `ioctl` 接受一个 `dioreg_t`\
    \ 结构，其中包含 `ioctl` 的 `dioreg_t` 大小、寄存器和值。DIO 设备驱动程序使用的寄存器结构见列表 5-2。\n\n```c\nstruct\
    \ dioreg_t\n{\n    int32_t size;\n    int32_t reg;\n    int32_t val;\n}\n```\n\
    列表 5-2\n\n`dio_set` 和 `dio_get` 函数设置本地 `dioreg_t` 结构，并执行列表 5-3 的 `ioctl` 代码来填充内容并调用驱动程序。\n\
    \n```c\n/* 填充设备结构 */\nregt.size = sizeof(struct dioreg_t);\nregt.reg = reg;\n\
    regt.val = val;\n/* 将请求发送给驱动程序 */\nif (reg == INTRS)\n{\n    ioctl(diofd, DIOCTLWRITE,\
    \ &reg);\n}\nelse\n{\n    ioctl(diofd, DIOOPORTWRITE, &reg);\n}\n```\n列表 5-3\n\
    \n`dio_set` 和 `dio_get` 必须区分发送哪种寄存器访问请求 `ioctl`。回想有两个寄存器空间：基地址 1 和基地址 2。由于中断状态寄存器\
    \ `INTRS` 是唯一访问 PCI 基地址 1 的寄存器，如果指定的寄存器是 `INTRS`，则 `ioctl` 将发送到 PCI 基地址 1 中的控制寄存器；否则，将发送到端口写入\
    \ `ioctl`，后者访问 PCI 基地址 2。\n\n## 访问数字 IO 线\n\n访问数字 IO 线通过两个函数提供：`dio_set_line`\
    \ 和 `dio_get_line`。PCI-DIO24 包含 24 条数字 线。为了识别每条线，提供了一个 C 枚举来表示每一条。\n\n### dioline_t\
    \ 枚举\n\n`enum` 数据类型在整个数字 IO 库中反复使用。通过定义枚举，我们强制编译器对我们的函数执行类型检查，这在调试期间非常有用。列表 5-4\
    \ 显示了 `dioline_t` 枚举。\n\n```c\ntypedef enum dioline_t {\n    line0 = 0,\n    line1\
    \ = 1,\n    line2 = 2,\n    line3 = 3,\n    line4 = 4,\n    line5 = 5,\n    line6\
    \ = 6,\n    line7 = 7,\n    line8 = 8,\n    line9 = 9,\n    line10 = 10,\n   \
    \ line11 = 11,\n    line12 = 12,\n    line13 = 13,\n    line14 = 14,\n    line15\
    \ = 15,\n    line16 = 16,\n    line17 = 17,\n    line18 = 18,\n    line19 = 19,\n\
    \    line20 = 20,\n    line21 = 21,\n    line22 = 22,\n    line23 = 23\n} dioline_t;\n\
    ```\n列表 5-4\n\n`dioline_t` 枚举为我们提供了一个方便的类型，由于 `dio_set_line` 和 `dio_get_line`\
    \ 的第一个参数是 `dioline_t`，这将强制编译器进行参数检查。此外，如果底层硬件发生变化并需要修改线路，则源代码的变化仅限于头文件和重新编译。\n\
    \n### diestate_t 枚举\n\n配合线路类型，有一个状态枚举 `diestate_t` 定义了数字 IO 线的所有可能状态。由于 PCI-DIO24\
    \ 只提供数字 IO 线，状态为 `set`（设置）或 `clear`（清除），分别表示高电平有效和低电平有效状态。\n\n```c\ntypedef enum\
    \ diestate_t {\n  clear = 0,\n  set = 1\n} diestate_t;\n```\n列表 5-5\n\n### dio_set_line\
    \ 和 dio_get_line 函数\n\n读写数字 IO 线通过 `dio_set_line` 和 `dio_get_line` 完成。\n\n```c\n\
    #include <dioif.h>\nint32_t dio_set_line(dioline_t line, diestate_t val)\nint32_t\
    \ dio_get_line(dioline_t line, diestate_t val)\n```\n\n在这里，`dio_set_line` 和 `dio_get_line`\
    \ 负责将用户传递的线路映射到相应的端口。映射通过列表 5-6 中的 `switch` 语句实现。\n\n```c\n/* 将线路转换为寄存器 */\nswitch\
    \ (line)\n{\n  case line0:\n  case line1:\n  case line2:\n  case line3:\n  case\
    \ line4:\n  case line5:\n  case line6:\n  case line7:\n    reg = PORTADATA;\n\
    \    break;\n  case line8:\n  case line9:\n  case line10:\n  case line11:\n  case\
    \ line12:\n  case line13:\n  case line14:\n  case line15:\n    reg = PORTDATA;\n\
    \    break;\n  case line16:\n  case line17:\n  case line18:\n  case line19:\n\
    \  case line20:\n  case line21:\n  case line22:\n  case line23:\n    reg = PORTCDATA;\n\
    \    break;\n  default:\n    return(-1);\n    break;\n}\n```\n列表 5-6\n\n`switch`\
    \ 语句接收线路输入。一旦确定了正确的寄存器，寄存器和值将传递给 `dio_set` 或 `dio_get` 例程。在以下 `dio_get` 用例中：\n\
    \n```c\n/* 读取寄存器 */\ndio_get(reg, &val);\n```\n\n此函数调用寄存器读取程序处理读取数字 IO 线值的细节。\n\
    \n## 编程中断控制器\n\n中断控制器函数用于启用和禁用本地中断、启用和禁用 PCI 中断以及编程中断极性。DIO 接口库包含读写中断状态寄存器中这些位的函数。\n\
    \n与线路设置一样，使用枚举来定义特定状态的值。\n\n### diointate_t 枚举\n\n为了帮助定义接口库 API 的细节，定义了枚举 `diointate_t`，它表示中断和\
    \ PCI 中断的状态。启用中断和 PCI 中断的两组函数都接受 `diointate_t` 参数。列表 5-7 显示了 `diointate_t` 数据类型。\n\
    \n```c\ntypedef enum diointate_t {\n  disable = 0,\n  enable = 1\n} diointate_t;\n\
    ```\n列表 5-7\n\n在这里，`diointate_t` 有两个值，定义为 `disable` 和 `enable`。这些值对应于中断控制器寄存器中这些位的设置。\n\
    \n### dio_set_int 和 dio_get_int 函数\n\nPCI-DIO24 包含一个编程本地中断的位。中断可以启用或禁用。\n\n```c\n\
    #include <dioif.h>\nint32_t dio_set_int(diointate_t state)\nint32_t dio_get_int(diointate_t*\
    \ state)\n```\n\n本地中断通过编程状态控制寄存器中的第 0 位来控制。本地中断由字面量 `INT_BIT` 定义。\n\n```c\n#define\
    \ INT_BIT 0x01\n```\n\n设置本地中断涉及读取控制状态寄存器，修改本地中断位，然后将新值写回控制寄存器。列表 5-8 展示了设置中断位的代码。\n\
    \n"
