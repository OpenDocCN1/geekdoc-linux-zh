    \n    evh, \\\n    arg \\\n};\nDECLARE_MODULE(name, name##_mod, SI_SUB_DRIVERS,\
    \ SI_ORDER_MIDDLE);\n```\n\n与系统调用 KLD 一样，`DEV_MODULE` 宏声明了 KLD 使用的 `module_data_t`\
    \ 结构。\n\n我们的 KLD 示例设备驱动声明如下：\n\n```c\nDEV_MODULE(kld_driver_sample, load_handler,\
    \ NULL);\n```\n\n# Driver Functions\n\n现在定义了 KLD 组件，剩余的工作包括实现驱动处理函数。这个通用的 KLD\
    \ 设备驱动每个函数中只包含打印语句。函数列如下。\n\n# open 函数\n\n当应用程序调用设备节点的 `open` 系统调用时，调用 `open`\
    \ 函数。\n\n```c\nint kld_open(dev_t dev, int offlags, int devtype, struct proc *p)\
