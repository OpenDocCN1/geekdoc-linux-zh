    # 2 EmbeddedFreeBSD Cookbook


    developed internally. All the software was self-contained in nonvolatile RAM and
    there was a limited user interface. Examples of these types of embedded systems
    are microwave ovens, MP3 players and cell phones.


    ![](img/8be5cdcebf09c36e2285b8e096cda24a_5_0.png)


    Microwave Oven


    Figure 1-1. Classic embedded system


    As the Internet grew, the requirements of embedded systems also began to grow
    in complexity. In addition to solving classic embedded problems, system designers
    were required to add connectivity for sending and receiving data or providing
    an automated method for software upgrades. Rather than increase the development
    effort, system designers have moved toward third-party hardware and evaluating
    open source software. Examples of these next-generation embedded systems are load
    balancers, Virtual Private Networks (VPN) and Ethernet switches.


    ![](img/8be5cdcebf09c36e2285b8e096cda24a_5_1.png)


    Figure 1-2. Load Balancer


    # Internet Appliances


    Many of the embedded systems developed today are what would be called servers
    just a few years ago. These systems are developed using PC hardware, run an embedded
    application, have Internet connectivity, and run network services for remote configuration.
    These latest incarnations of embedded systems are called Internet appliances.'
  - '[PAGE 6]


    # 3 Chapter One Getting Started


    Network connectivity requires the addition of network protocols, services, and
    networking hardware. Web services require the addition of more complex application
    software. These additional requirements significantly increase the hardware cost,
    development, and complexity of embedded systems development.


    The added performance requirements add scalability to the list of system requirements,
    further limiting the choice of solutions of computer design. Additionally the
    investment of developing an embedded system must be protected; as the hardware
    evolves, the final choice of hardware and software must be compatible from release
    to release. With the rapid development schedules of the high-tech sector, hardware
    and software solutions must be flexible enough to meet the needs of evolving markets
    and customers.


    To address the increased complexity of embedded systems, a new category has become
    popular—the appliance server. An appliance server is a network-embedded computer
    designed to perform a single task and provide superior performance and higher
    reliability than a general-purpose server. Applications ideal for appliance servers
    include VPN, network attached storage (NAS), and load balancing.


    # Development Issues


    While the cost of computer components and time to market continue to decrease,
    functionality and features for a typical embedded system continue to increase.
    In order to respond to this, many project developers choose to use third-party
    hardware and open-source software and develop only those components that provide
    value-added features. The classic model of embedded systems development using
    custom hardware and homegrown operating systems has been replaced in many of the
    systems being developed today. Let''s take a look at a few of the development
    issues related to embedded systems relying on third parties for some of the core
    components.


    # Compatibility of upgrades


    By choosing third-party hardware and open-source software, a system designer ensures
    access to compatible technology from multiple vendors and allows the completed
    system to be developed quicker and for a lower cost. Systems designers can focus
    resources toward developing their application, rather than keeping resources focused
    on maintaining the operating system or developing the next hardware platform.'
  - '[PAGE 7]


    4 Embedded FreeBSD Cookbook


    # Time to market


    An open-source operating system reduces the time to qualify and develop the software
    solution. The server appliances address increased time pressure to market and
    hardware flexibility by using an increasingly rich set of third-party hardware
    and software. By relying on readily available hardware and software, the server
    appliance developer can focus on solving the application.


    # Labor pool


    The increased complexity of Internet appliances requires the transition from simple
    embedded tools to an off-the-shelf integrated development environment with tools
    that facilitate the development of secure, reliable, and long-running systems.
    Additionally, an off-the-shelf integrated development environment reduces the
    time to market, as well as training time.


    # Licensing


    Traditional real-time operating system software licenses restrict the source to
    the licensee and may require a royalty fee for distribution. In contrast, open-source
    software licenses allow the licensee to make the software freely available to
    anyone who wishes to use it.


    # The DIO Server Appliance


    The remainder of this chapter discusses an Internet appliance that will be developed
    in this book, the digital input-output (DIO) server appliance. The DIO server
    appliance is an embedded system that provides the capability to read and write
    digital IO lines. The digital lines are monitored via the Internet using sockets,
    a secure command shell, or a browser.


    The software uses an open-source operating system and tools, FreeBSD 4.4 and the
    GNU development suite. The system software and application


    ![](img/8be5cdcebf09c36e2285b8e096cda24a_7_0.png)'
