    # 系统启动


    ## 概述


    嵌入式系统开发中最重要的方面之一是系统启动和引导过程。理解引导和系统启动过程有许多原因，例如：在引导序列中添加自定义组件的初始化、了解对于系统规范来说哪些类型的设备是可引导的，或者启动组件或确保嵌入式系统的组件已启动（例如
    DIO 设备的情况）。本章将侧重于 FreeBSD 的引导过程。


    首先，快速查看 PC 引导过程将为 FreeBSD 的三个引导阶段提供背景。在讨论 FreeBSD 引导过程之后，本章将继续讨论 FreeBSD 引导阶段组件和系统启动。完成引导过程的讨论后，我们将添加代码来启动
    DIO 进程，并加载之前的章节中开发的 `copymem` 系统调用和 DIO 设备驱动程序。


    ## 磁盘几何结构


    每个不同设备的引导过程略有不同。DIO 设备的启动设备由一个 CompactFlash 卡组成，它显示为硬盘。由于我们的讨论假设从硬盘启动，因此这些内容是针对该技术定制的。在开始讨论引导过程之前，了解磁盘的布局以及加载程序（loader）的碎片在磁盘上的位置将会有帮助。


    ### 盘片 (Platters)


    硬盘由称为盘片的扁平圆盘组成。每个盘片都涂有一层特殊材料，设计用于以磁模式的形式存储信息。它们由两种主要物质组成：形成盘片主体并提供结构和刚性的基底材料，以及实际上承载代表数据的磁脉冲的磁介涂层。


    ### 磁头 (Heads)


    硬盘的读写头是存储数据的磁物理介质与组成硬盘其余部分的电子元件之间的接口。磁头处理将位转换为磁脉冲并存储在盘片上，并反转该过程以读取数据。


    ### 柱 (Cylinders)


    盘片被组织成特定的结构，以实现数据的组织存储和检索。每个盘片包含在称为柱的同心圆中记录信息。柱的结构类似于树的年轮。


    ### 扇区 (Sectors)


    每个柱被进一步分为称为扇区的小块。每个扇区持有 512 字节的信息。


    ### 寻址 (Addressing)


    磁盘上的每个扇区使用头、柱和扇区的格式进行寻址。例如，磁盘上的第一个扇区位于头 0、柱 0、扇区 1。


    ### 主引导记录 (Master Boot Record)


    硬件磁盘的第一个扇区是主引导记录 (MBR)。MBR 是一个包含加载操作系统信息的特殊记录。MBR 位于硬盘的第一个扇区（头 0、柱 0、扇区 1），为一个扇区（512
    字节）。MBR 包含三个组件：引导加载程序、分区表和魔数。MBR 中包含的引导加载程序是 BIOS 执行的第一段代码。


    ### 引导加载程序 (Boot Loader)


    引导加载程序从偏移量 0 开始，长度为 446 字节。引导代码读取 MBR 中的分区表，并尝试加载分区表中活动分区的第一个扇区。只能分区可以是活动的。


    ### 分区表 (Partition Table)


    | 偏移量 | 内容 |

    |---|---|

    | 00H | 分区状态：未激活为 00H，激活为 80H |

    | 01H | 分区开始的头 |

    | 02H | 分区开始的柱 |

    | 03H | 分区类型 |

    | 04H | 分区结束的头 |

    | 05H | 分区结束的扇区 |

    | 06H | 分区结束的柱 |

    | 07H | 从 MBR 到分区第一个扇区的距离（单位为扇区） |

    | 0CH | 分区长度（单位为扇区） |


    从偏移量 1BEH 开始是分区表。分区表包含四个每个16 字节的条目，描述磁盘的分区情况。分区表条目位于 MBR 中的 1BEH、1CEH、1DEH 和 1EEH。


    每个条目包含有关分区的信息，例如在磁盘上的起始和结束位置、分区类型以及以扇区为单位的长度。每个分区条目的描述包含在表 11-1 中。


    分区表包含磁盘至多四个不同的区域；分区不能重叠。分区的常见用途是配置计算机启动多个操作系统。每个分区可以加载不同的操作系统。


    #### 状态 (State)


    分区的第一个条目是状态，其值为 0 或 80H。值 80H 表示该分区是激活的并可以启动。


    #### 分区起始位置 (Start of partition)


    接下来的三个字节包含头、扇区、柱格式的分区起始位置。磁盘传统通过头、柱和扇区偏移量访问存储。随着硬盘容量的不断增加，MBR 中预留的空间变得太小，无法标识整个硬盘。为了解决这个问题，开发了一种新的寻址方案，它使用头、柱和扇区字段中的位。这种新方案被称为逻辑块寻址
    (LBA)。


    让我们看一个例子，分区起始偏移为 2，扇区为 3，起始扇区的地址是使用分区表中的偏移量 2 和 3 以及一些位运算计算的。


    ```

    Cylinder = (Offset(3) | (Offset(2) & C0H) << 2);

    Sector = Offset(2) & 3FH;

    Start = Cylinder | Sector;

    ```


    扇区的地址通过组合偏移量 3 中包含的 8 位柱数据与扇区值的高 2 位来计算。这 10 位位包含了扇区地址的前 10 位。偏移量 2 中扇区的低 6 位包含柱内的扇区。地址是计算出的柱和计算出的扇区的组合。


    #### 类型 | 描述 |

    |---|---|

    | 00H | 空 |

    | 01H | DOS 12 bit FAT |

    | 04H | DOS 16 bits |

    | 05H | 扩展分区 |

    | 82H | Linux Swap |

    | 83H | Linux Native |

    | A5H | BSD |

    | B7H | BSDI |

    | B8H | BSDI swap |


    #### 类型 (Type)


    分区类型代表文件系统类型。常见的分区类型包含在表 11-2 中。


    #### 分区结束 (End of partition)


    接下来的三个字节包含头、扇区、柱格式的分区结束。分区结束的逻辑块地址 (LBA) 使用与分区起始相同的方法计算。


    #### 与 MBR 的距离 (Distance from MBR)


    接下来的四个字节表示分区结束的 LBA。LBA 是从磁盘开始到分区的扇区偏移。


    #### 长度 (Length)


    最后四个字节是以扇区为单位的分区长度。


    #### 魔数 (Magic Number)


    魔数为 AA55H，位于偏移量 FE。每当读取 MBR 时，都会魔数是否为 AA5H。


    #### 示例 (Example)


    让我们查看开发机器上的第一个扇区。我们将使用 dd 和 hexdump 显示扇区 0（MBR）。


    ```

    dd if=/dev/sda1 of=boot.bin count=1

    512 bytes transferred in 0.026 secs (1870)

    hexdump -c boot.bin

    ```


    '
