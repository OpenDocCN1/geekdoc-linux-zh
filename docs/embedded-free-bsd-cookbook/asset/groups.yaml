    We see from the MBR of my machine, the last entry in the partition table contains
    a FreeBSD partition which is active and the length of the complete disk. Let''s
    take a more detailed look at our partition located at offset 1EE.


    Offset 0 shows this is the active partition, 80H, and offset 4 shows this is a
    FreeBSD partition, A5H. Offsets 1, 2 and 3 give the starting of the partition
    in head, cylinder format. This tells us that the partition starts with the MBR.
    Offsets 5, 6 and 7 give the ending sector of the partition in head, cylinder format.
    The values of FFF in all these fields denote that the partition uses the whole
    disk. Offsets 8-B give us the distance from the MBR to the beginning of the partition;
    this value is 0. Once again, denoting-the partition begins with the MBR. The final
    four bytes of the partition table contain the number of sectors in the partition.


    # Boot Slice


    Now that we''ve identified the partition table, we''ll take a look at how FreeBSD
    BSD uses it. Within a disk partition, FreeBSD creates a slice, which is used by
    FreeBSD to implement the traditional Unix filesystem of 8 partitions, through
    f. As you may have noticed, the term "partition" is used to represent numerous
    things, which is why the term "slice" was brought into play.'
