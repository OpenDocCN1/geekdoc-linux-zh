    \n| Web Applications |\n| JSP Examples |\n| Servlet Examples |\n| WebDAV capabilities\
    \ |\n| Documentation |\n| Tomcat Documentation |\n| Miscellaneous |\n| Sun's Java\
    \ Pages Site |\n| Sun's Servlet Site |\n\nIf you're seeing this page via a web\
    \ browser, it means you're set up Tomcat successfully. Congratulations!\n\nAs\
    \ you have guessed by now, this is the default Tomcat home page. It can be found\
    \ on the local filesystem at\n\n```\nCATALINA_HOME=/webapps/ROOT/index.html\n\
    where=\"CATALINA_HOME\" is the root of the Tomcat installation directory. If you're\
    \ seeing this page, and you don't think you should be, either you're a user who\
