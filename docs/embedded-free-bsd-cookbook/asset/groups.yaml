    # Port B Data Register


    The Port B Data Register is an 8-bit register located at byte offset 1 from PCI
    Base Address Register 2. The Port B Data register is responsible for digital I/O
    lines 8 through 15. Each bit of the Port B Data register is defined in Table 5-4.


    The Port B register corresponds to digital lines 8 through 15. The direction of
    Port B digital IO lines is programmed by Configuration Register 1.


    | Bit | Description |

    |---|---|

    | 0 | Digital line 8 |

    | 1 | Digital line 9 |

    | 2 | Digital line 10 |

    | 3 | Digital line 11 |

    | 4 | Digital line 12 |

    | 5 | Digital line 13 |

    | 6 | Digital line 14 |

    | 7 | Digital line 15 |


    # Port C Data Register


    The Port C Data Register is an 8-bit register located at byte offset 2 from PCI
    Base Address Register 2. The Port C Data register is responsible for digital I/O
    lines 16 through 23. Each bit of the Port C Data register is defined in Table
    5-5.


    | Bit | Description |

    |---|---|

    | 0 | Digital line 16 |

    | 1 | Digital line 17 |

    | 2 | Digital line 18 |

    | 3 | Digital line 19 |

    | 4 | Digital line 20 |

    | 5 | Digital line 21 |

    | 6 | Digital line 22 |

    | 7 | Digital line 23 |


    The Port C Data register bits correspond to digital lines 16 through 23. The Port
    C Data register is different from Port A and Port B data registers in its lines
    are split into two groups, Port C Low and Port C High. Each of these groups, Port
    C Low and Port C High, corresponds to bits 0 through 3 in the Port C data register.
    The direction of these lines is programmed by Configuration Register 0. Port C
    High corresponds to bits 4 through 7 in the Port C data register. The direction
    of these lines is programmed by Configuration Register 3.


    Table 5-5. Port C Data Register


    # Interrupt Status Register


    The Interrupt Status Register is a 32-bit register located at PCI Base Register
    1 at byte offset hexadecimal 4C. This register is responsible for programming
    interrupt enable/disable, interrupt polarity, interrupt status,'
