    \ `>` 提示符、读取用户输入，然后解析命令。命令解析通过将用户输入的第一个字符串与命令表中每个条目的命令元素进行匹配来实现。如果匹配，则调用命令处理器函数。所有额外的解析和操作都由每个单独的命令处理器处理。\n\
    \n# Makefile\n\n```makefile\nBASE=DIOShell\nDEST=/usr/local/bin\nINCLUDES=-I../inc\n\
    LIBRARIES=-L /usr/local/lib -ldioif\n\nDIOShell: DIOShell.c\n\tgcc $(INCLUDES)\
    \ -o $(BASE) $(LIBRARIES) $(BASE).c\n\tcp $(BASE) $(DEST)\n\nclean:\n\trm -f $(BASE)\n\
    \trm -f $(DEST)/$(BASE)\n\trm -f *.o\n```\n\n# 总结\n\n本章涵盖了使用 FreeBSD 安装、构建和配置\
    \ OpenBSD 的基础。在讨论过 OpenBSD 后，我们开发了一个框架用于实现一个基础命令行解析器，解析器使用回调根据用户输入实现操作。该框架用于实现\
    \ DIOShell，一个针对数字 IO 的特定 shell。\n\n# JNI 层\n\n## 概述\n\nDIO 项目开发的下一阶段是使其感知 Java。实现此点的第一步是为\
    \ DIO 库开发 Java 原生接口（JNI）。JNI 是一种编程接口，包含在 FreeBSD 的 Java 开发工具包（JDK）中，用于编写调用 C/C++\
    \ 根程序的 Java 方法。\n\n- 安装 FreeBSD 的 JDK\n- 定义 JNI 特性\n- 在 Java 中实现原生类型\n- 为 DIO\
    \ 库实现 JNI 接口层\n\n## JDK\n\n在我们开始为 DIO 库开发 JNI 层之前，首先要安装 FreeBSD 的 JDK。\n\n## 获取\
    \ FreeBSD 的 JDK\n\n在 във开始为 DIO 库开发 JNI 层之前，必须配置开发环境。开发 JNI 的第一步是获取 JDK 副本。为了获取\
    \ JDK，切换到 ports 目录并执行以下命令：\n\n```bash\ncd ...\nports/java\n```\n\n## 定义 JNI 特性\n\
    \n在我们开始为 DIO 库开发 JNI 层之前，必须配置开发环境。开发 JNI 的第一步是获取 JDK 副本。为了获取 JDK，切换到 ports 目录并执行以下命令：\n\
    \n```bash\ncd /ports/java\n```\n\n## 在 Java 中实现原生类型\n\n在我们开始为 DIO 库开发 JNI 层之前，必须配置开发环境。开发\
    \ JNI 的第一步是获取 JDK 副本。为了获取 JDK，切换到 ports 目录并执行以下命令：\n\n```bash\ncd /ports/java\n\
    make\nmake install\nmake clean\n```\n\n## 为 DIO 库实现 JNI 接口层\n\n在我们开始为 DIO 库开发\
    \ JNI 层之前，必须配置开发环境。开发 JNI 的第一步是获取 JDK 副本。为了获取 JDK，切换到 ports 目录并执行以下命令：\n\n```bash\n\
    cd /ports/java\nmake\nmake install\nmake clean\n```\n\n## 设置 JDK_HOME 变量\n\n在我们开始为\
    \ DIO 库开发 JNI 层之前，必须配置开发环境。开发 JNI 的第一步是获取 JDK 副本。为了获取 JDK，切换到 ports 目录并执行以下命令：\n\
    \n```bash\nexport JDK_HOME=/usr/local/jdk\nexport PATH=$JDK_HOME/bin:$PATH\n```\n\
    \n将以下行添加到 `.cshrc` 文件中：\n\n```bash\nsetenv JDK_HOME /usr/local/jdk\nset path=$JDK_HOME/bin\
    \ $path\n```\n\n## 设置 CLPATH 变量\n\n在我们开始为 DIO 库开发 JNI 层之前，必须配置开发环境。开发 JNI 的第一步是获取\
    \ JDK 副本。为了获取 JDK，切换到 ports 目录并执行以下命令：\n\n```bash\nexport CLPATH=/usr/local/jdk/class:$CLPATH\n\
    ```\n\n## 设置 LD_LIBRARY_PATH 变量\n\n在我们开始为 DIO 库开发 JNI 层之前，必须配置开发环境。开发 JNI 的第一步是获取\
    \ JDK 副本。为了获取 JDK，切换到 ports 目录并执行以下命令：\n\n```bash\nexport LD_LIBRARY_PATH=/usr/local/jdk/lib:$LD_LIBRARY_PATH\n\
    ```\n\n# 创建 JNI 层\n\n在本节中，我们正在开发一个 JNI 层用于读写 IO 线并读取方向。由于我们已经开发了执行这些任务的 C 接口，因此开发了一个中间层即\
    \ JNI，它提供了从 Java 代码调用 C 代码的机制。\n\n在我们转动引擎并产生大量的 Java 源码之前，让我们查看开发 JNI 的过程。首先，我们需要识别从\
    \ Java 调功能。如之前提到的，它们是读取行、写入行和读取方向。这三个功能已由 DIO 接口实现 `set_line`、`get_line` 和 `read_direction`。除了函数外，我们将在\
    \ Java 中实现这些函数使用的枚举。\n\n```java\npackage dio;\n\npublic class DIO {\n    static\
    \ {\n        System.loadLibrary(\"diojni\");\n    }\n\n    public native void\
    \ setLine(int line, int direction);\n    public native int getLine(int line);\n\
    \    public native int readDirection(int line);\n}\n```\n\n接下来，我们将使用 `javac -h`\
    \ 生成头文件。然后创建一个 `Direction.java` 类：\n\n```java\npackage dio;\n\npublic class Direction\
    \ {\n    public static final int in = 1;\n    public static final int out = 2;\n\
    \n    private final int value;\n\n    private Direction(int value) {\n       \
    \ this.value = value;\n    }\n\n    public static Direction from(int value) {\n\
    \        return new Direction(value);\n    }\n\n    public int getValue() {\n\
    \        return value;\n    }\n\n    @Override\n    public String toString() {\n\
    \        return value == in ? \"in\" : \"out\";\n    }\n}\n```\n\n现在，我们将使用 `javac\
    \ -h` 生成头文件。\n\n```bash\njavac -h . DIO.java Direction.java\n```\n\n这将生成 `DIO.h`\
    \ 文件如下：\n\n```c\n/* DO NOT MODIFY BY FILE */\n#include <jni.h>\n/*\n * Header\
    \ for class dio.DIO\n */\n\n#ifndef _DIO_H\n#define _DIO_H\n\n#ifdef __cplusplus\n\
    extern \"C\" {\n#endif\n\n# JNIEXPORT void JNICALL Java_dio_DIO_setLine(JNIEnv\
    \ *, jobject, jint, jint);\n# JNIEXPORT jint JNICALL Java_dio_DIO_getLine(JNIEnv\
    \ *, jobject, jint);\n# JNIEXPORT jint JNICALL Java_dio_DIO_readDirection(JNIEnv\
    \ *, jobject, jint);\n\n#ifdef __cplusplus\n}\n#endif\n\n#endif /* _DIO_H */\n\
    ```\n\n现在我们将编写 `diojni.c` 文件：\n\n```c\n#include <jni.h>\n#include \"DIO.h\"\n\
    #include \"dio.h\"\n\n# JNIEXPORT void JNICALL Java_dio_DIO_setLine(JNIEnv *env,\
    \ jobject obj, jint line, jint direction) {\n    dio_set_line((int)line, (int)direction);\n\
    }\n\n# JNIEXPORT jint JNICALL Java_dio_DIO_getLine(JNIEnv *env, jobject obj, jint\
    \ line) {\n    return (jint)dio_get_line((int)line);\n}\n\n# JNIEXPORT jint JNICALL\
    \ Java_dio_DIO_readDirection(JNIEnv *env, jobject obj, jint line) {\n    return\
    \ (jint)dio_read_direction((int)line);\n}\n```\n\n现在，我们将编译共享库：\n\n```bash\ngcc\
    \ -shared -fPIC -I$JAVA_HOME/include -I$JAVA_HOME/include/freeBSD diojni.c -o\
    \ diojni.so\n```\n\n最后，我们将编写 `Main.java` 来测试 JNI：\n\n```java\nimport dio.*;\n\n\
    public class Main {\n    public static void main(String[] args) {\n        DIO\
    \ dio = new DIO();\n        int line = 5;\n        dio.setLine(line, Direction.in);\n\
    \        System.out.println(\"Line \" + line + \" direction: \" + Direction.from(dio.readDirection(line)));\n\
    \    }\n}\n```\n\n编译并运行程序：\n\n```bash\njavac Main.java\njava -Djava.library.path=.\
    \ Main\n```\n"
