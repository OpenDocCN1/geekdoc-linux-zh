- md: "\n# Chapter One Getting Started\n\n## Java\n\nUsing Java, system designers\
    \ can develop applications that can be run on a browser anywhere. In addition\
    \ to the ease of developing the network portion of the appliance, using the Java\
    \ Native Interface (JNI), system developers can bridge legacy systems to the added\
    \ requirements of network-centric embedded systems.\n\n## Hardware\n\nThe server\
    \ appliance developed in this book uses only third-party hardware. The hardware\
    \ requirements are a network-capable PC-based hardware platform, a PCI-based digital\
    \ IO controller, and a solid-state boot device and ATAPI interface card.\n\n##\
    \ Server\n\nThe Network Engines Roadster is a high-performance 1U Internet appliance\
    \ that provides an easily customized solution for any application. The Network\
    \ Engines Roadster includes an Intel Celeron processor, 32 MB of RAM, dual Ethernet\
    \ ports, one PCI slot and two serial ports.\n\n## Data Acquisition\n\nThe DIO\
    \ Internet appliance hardware we will be using, the Measurement Computing PCI-DIO24\
    \ Digital IO Controller, can read and write digital IO signals. It is a PCI controller\
    \ that provides 24 bits of digital IO. In addition to the PCI-DIO24 controller,\
    \ the DIO server appliance uses the C37FF-2 Cable and CIO-MINI 37 Terminal for\
    \ connecting the digital signals from the controller.\n\n## Boot Device\n\nEmbedded\
    \ systems tend to be deployed in more rigorous environments than a typical desktop\
    \ computer. A hard drive may become damaged or wear out in this type of environment.\
    \ A trend in embedded systems development is to use CompactFlash. A CompactFlash\
    \ device appears similar to a standard IDE drive. In order to use a CompactFlash\
    \ device as a boot device, a CompactFlash adapter is required. There are numerous\
    \ CompactFlash-to-IDE adapters available.\n\n## TAPR CompactFlash Adapter II\n\
    \nThe Tucson Amateur Packet Radio (TAPR) Club sells an IDE CompactFlash Adapter\
    \ that can be used with generally available CompactFlash cards. The CompactFlash\
    \ Adapter plugs into an IDE slot and a power connector. Once the CompactFlash\
    \ adapter is connected and a CompactFlash device inserted, the device can be used\
    \ just like an IDE hard drive.\n\n## Sandisk 32 MB CompactFlash Disk\n\nThe Sandisk\
    \ CompactFlash is a small flash memory device that serves as our embedded boot\
    \ device. In conjunction with the TAPR CompactFlash Adapter, we are able to use\
    \ the Sandisk device as an IDE boot device. Sandisk Compact-Flash devices are\
    \ available in any office supply store; these are the same devices used in digital\
    \ cameras and portable MP3 players.\n\n## Summary\n\nIn this chapter we've discussed\
    \ the use of third-party hardware and open-source software for developing an Internet\
    \ appliance. The remainder of the book is focused on the development of the DIO\
    \ Internet appliance using FreeBSD. Each chapter discusses a topic related to\
    \ embedded system development and provides a solution. By the end of the book,\
    \ we will have developed a working appliance.\n\n## Systems Programming\n\n###\
    \ Overview\n\nFundamental to any programming task in FreeBSD is the process, which\
    \ is an executing program. It could be a network file system (NFS) daemon serving\
    \ files, a gcc compile or a shell displaying the date—all these tasks are performed\
    \ in the context of a process. An understanding of processes is critical for grasping\
    \ concepts presented in later chapters. This chapter introduces systems programming\
    \ using processes.\n\nMany system services are provided by a special type of process\
    \ known as a daemon process. As part of our discussion of processes, we will look\
    \ at the characteristics of a daemon process and develop skeleton source code\
    \ for a daemon. In this chapter we will cover topics including:\n\n- A FreeBSD\
    \ process\n- Process creation and termination\n- Process attributes\n- Daemon\
    \ processes\n\n## Process\n\nA running program is an instance of a process. One\
    \ of the numerous features provided by a FreeBSD kernel is a protected environment\
    \ called User Mode. In User Mode, a process cannot access hardware or protected\
    \ system variables. If a process attempts to access protected memory, the process\
    \ is terminated. A process running in memory consists of five segments: text,\
    \ initialized data, uninitialized data, stack and heap.\n\nText is typically read\
    \ only and contains the machine instructions for the program. Initialized data\
