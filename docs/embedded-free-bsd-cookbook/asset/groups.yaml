    ```


    ### 串口 默认支持四个串口。Roadster 硬件有两个串口；保留前两个串口以用于支持、管理和调试。


    ```bash

    # 串口 (COM) 端口

    device sio0 at isa? port IO_COM1 flags 0x10 irq 4

    device sio1 at isa? port IO_COM2 irq 3

    device sio2 at isa? disable port IO_COM3 irq 5

    device sio3 at isa? disable port IO_COM4 irq 9

    ```


    ### 并口 并口包含打印机支持、TCP/IP 支持和 SCSI 支持。我们保留打印机支持用于调试和管理。


    ```bash

    # 并口

    device ppc0 at isa? irq 7

    device ppbus # 并口总线 (必需)

    device lpt # 打印机

    device plip # 并口上的 TCP/IP

    device ppi # 并口接口设备

    device vpo # 需要 scbus 和数据

    ```


    ### 以太网控制器是 FreeBSD 内核内置的许多网络网卡。数据日志器使用一个 Intel EtherPro 100；其他控制器可以被移除。


    ```bash

    # PCI 以太网

    device de

    device fcn

    device fxp

    device rtl

    device rtl

    device rtl

    # Intel 100

    device em

    device em

    device em

    device em

    device em

    device wi

    ```

