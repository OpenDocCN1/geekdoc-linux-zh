  - '[PAGE 197]


    # The CompactFlash Boot Device


    # Overview


    This chapter focuses on creating a boot device from a solid-state device, specifically,
    the SanDisk 32MB CompactFlash device. Solid-state devices provide increased stability
    due to the lack of moving parts. However, due to the limited disk space and write
    capacity, some basic system-level issues need to be addressed, such as limiting
    writes to the CompactFlash boot device, not using swap space, and running with
    memory file systems.


    Specific topics that will be covered in this chapter include


    +   - Solid-state devices

    - Installing and verifying the TARC CompactFlash Adapter

    - Configuring the CompactFlash device

    - CompactFlash system startup issues


    # Solid-state Devices


    A CompactFlash device is a nonvolatile solid-state device used for storage. To
    the FreeBSD kernel, a CompactFlash device appears as an IDE disk drive. An important
    consideration for using solid-state devices is that each sector has a limited
    write capacity. For this reason an embedded system typically uses the CompactFlash
    device to boot the system, and then the system executes out of a memory file system.
    Also, there is no swap partition configured on a CompactFlash device.'
  - '[PAGE 198]


    # Installing the TARC CompactFlash Adapter


    In order to use a CompactFlash device as a FreeBSD boot device, the DIO appliance
    must have a CompactFlash adapter. The Tucson Amateur Radio Club (TARC) distributes
    such an adapter. More information on this adapter can be found at http://www.tapr.org.
    TARC CompactFlash adapter allows any Type I or Type II CompactFlash device to
    be used as a standard IDE device.


    The TARC CompactFlash adapter uses an IDE connection, a standard 3.5" floppy driver
    connector and a CompactFlash device. During development, I chose to connect the
    CompactFlash adapter as the primary slave device, as this configuration allows
    a simple configuration and test setup. Once the development life cycle is complete,
    the CompactFlash boot adapter will be configured as the primary boot device.


    Before making any connections, be sure to shut down and power off your system.
    After the IDE connection is complete, connect the 3.5-inch power connector to
    the TARC CompactFlash adapter. Once the power and IDE connections are complete,
    install the CompactFlash memory into the TARC adapter.


    Once the physical installation is complete, we''ll verify that the CompactFlash
    has been installed and is working properly. Since the CompactFlash device appears
    as a standard IDE device, FreeBSD should recognize the device using a standard
    kernel. We can verify this by using the dmesg command and looking at the output
    of the probed devices during system startup.


    ```

    $ dmesg

    [selected output]

    ata0-master: DMA limited to UDMA33, non-ATA66 compliant cable

    ad0: 12419MB <<ST313021> [ 2532/16/63 ] at ata0-master UDMA33

    ad2: 30MB <SunDisk SDCFB-32> [ 490/4/32 ] at atal-master PIO1

    ac0: CDROM <CD-912E/ATK> at ata0-slave using PIO3

    ```


    Looking at the selected output, we can see the CompactFlash is detected and present
    at ad2. Now that we have successfully installed the CompactFlash adapter, we''ll
    look at configuring the device and loading our DIO appliance software.'
- md: "\n## Configuring the CompactFlash Device\n\nConfiguring the CompactFlash device\
    \ is similar to configuring any other boot device for FreeBSD. The development\
    \ hardware we're using has the development disk installed as the primary master\
    \ device (ad0) and the CompactFlash installed as the secondary master device (ad2).\n\
    \nTo create the initial configuration for the CompactFlash device, we'll use the\
    \ standard tools for creating a FreeBSD installation. Because the CompactFlash\
    \ device appears as an IDE disk, all the tools run normally. For our first task,\
    \ we will partition and format the CompactFlash so we can load the DIO appliance\
    \ software. To get started, change directory to the /stand directory and run sysinstall.\n\
    \n```\n# cd /stand\n# ./sysinstall\n```\n\n## Partitioning the CompactFlash Device\n\
    \nAfter starting sysinstall, choose custom from the installation menu, then choose\
    \ partition. Sysinstall will ask you to select the drive to partition. Select\
    \ ad2, the CompactFlash device.\n\nIn the partition menu\n\nAfter choosing to\
    \ write the partition information to the CompactFlash, you will then be prompted\
    \ to install the boot manager. You should choose the FreeBSD Boot Manager. The\
    \ CompactFlash device is now partitioned. You can exit from the partition menu\
    \ by choosing the q option.\n\n## Creating the Disklabel\n\nThe next step is to\
    \ create a disklabel in the existing partition. Select the label options from\
    \ the sysinstall menu. In the label menu, create a partition that will be mounted\
    \ as the root partition, /, that consists of the entire space available.\n\n/dev/ad2sla\
    \ / 30MB UFS\n\nOnce this is complete, write it out to the CompactFlash device.\
    \ You may exit the sysinstall utility. Typically a FreeBSD installation uses multiple\
    \ partitions, such as root and swap and var. However, since the DIO appliance\
    \ does not use swap or the var filesystem, those partitions are not necessary.\n\
    \n## Formatting the File System\n\nThe CompactFlash is now ready for prime time.\
    \ The next step is to format the file system, accomplished using the newfs command.\n\
    \n```\n# newfs /dev/ad2sla\nWarning: 2848 sectors in in last cylinder unallocated\n\
    /dev/ad2sla: 62688 sectors in 16 cylinders of 1 tracks, 4096 sectors\n30.6MB in\
    \ 1 cyl groups (16 c/g, 32.0MB/g, 7616 i/g)\nsuper-block backups (for fsck -b\
    \ #) at:\n32\n```\n\nUpon completion of the newfs command, the CompactFlash device\
    \ can be mounted. Once the mount is completed, files can be copied and the system\
    \ boot testing begin.\n\n## Mounting the File System\n\nWith the CompactFlash\
    \ partitioned and file system formatted, the CompactFlash can now be mounted.\
    \ Mounting the device is accomplished using the mount command.\n\n```\n# mount\
    \ /dev/ad2sla /flash\n```\n\nAfter mounting the device, we can verify that it\
    \ is properly mounted displaying the file system using the df command.\n\n```\n\
    # df /flash\nFilesystem 1K-blocks Used Avail Capacity Mounted on\n/dev/ad2sla\
    \ 30359 1 27930 0% /flash\n```\n\nUsing the output of df we can see that the CompactFlash\
    \ device, /dev/ad2sla, is mounted on /flash and contains just under 30 MB of disk\
    \ capacity.\n\n## Copying the Files to the Boot Device\n\nWe've now come to the\
    \ final step of creating the boot device. The CompactFlash is partitioned, formatted\
    \ and mounted, and it's time to copy the files from our development disk to the\
    \ CompactFlash device. Creating a system image for an embedded device is somewhat\
    \ of a \"black art.\" There are a variety of ways to determine the components\
    \ of your embedded system. I'll briefly describe two methods to be used as a guideline\
    \ for creating your final image. Whether you use these methods or create your\
    \ own method, no amount of experience can circumvent the often unheralded and\
    \ underappreciated—but extremely critical, particularly for an embedded system—step\
    \ of creating the final image. No amount of preparation can replace the time-consuming\
    \ process of iteration and testing.\n\n## The Iterative Approach\n\nOur system\
    \ is configured so that we can iterate and test the CompactFlash device. Copy\
    \ the required files to the flash disk. Once you're ready to test the CompactFlash\
    \ device, type the space bar at the boot prompt and enter ad(2,a). This causes\
    \ a boot from the CompactFlash device. If there are files missing, reboot the\
    \ system normally, make the necessary changes and try again.\n\n## The Installation\
    \ Approach\n\nAnother way to develop your release image is to install FreeBSD\
    \ in a conventional manner to a hard drive, add your application software and\
    \ then verify your system is working as expected. Then pare your system to the\
    \ size required by your boot device. After paring down and testing your system\
    \ as required, dd the entire filesystem to be transferred to your boot device.\n\
    \n## Startup Configuration\n\nMuch of the diskless boot is handled by the rc.diskless2\
    \ script. Control of a diskless FreeBSD system is handled by /etc/rc.diskless2.\
    \ In order for rc.diskless2 to be invoked, the following line must be added to\
    \ /etc/rc.conf:\n\n```\ndiskless_mount=/etc/rc.diskless2\n```\n\nLet's take a\
    \ look at the rc.diskless2 script in Listing 12-1.\n\n# 202 EmbeddedFreeBSD Cookbook\n\
    \n# Copyright (c) 1999 Matt Dillon\n# All rights reserved.\n\n# Redistribution\
    \ and use in source and binary forms, with or\n# without modification, are permitted\
    \ provided that the following\n# conditions are met:\n# 1. Redistributions of\
    \ source code must retain the above\n#    copyright notice, this list of conditions\
    \ and the\n#    following disclaimer.\n# 2. Redistributions in binary form must\
    \ reproduce the above\n#    copyright notice, this list of conditions and the\n\
    #    disclaimer in the documentation and other materials\n#    provided with the\
    \ distribution.\n\n# THIS SOFTWARE IS PROVIDED BY THE AUTHOR AND CONTRIBUTORS\n\
    # AND ANY EXPRESS OR IMPLIED WARRANTIES, INCLUDING, BUT\n# LIMITED TO, THE IMPLIED\
    \ WARRANTIES OF MERCHANTABILITY AND\n# FITNESS FOR A PARTICULAR PURPOSE ARE IN\
    \ NO EVENT\n# SHALL THE AUTHOR OR CONTRIBUTORS BE LIABLE FOR ANY DIRECT,\n# INCIDENTAL,\
    \ SPECIAL, OR CONSEQUENTIAL DAMAGES\n# (INCLUDING, BUT NOT LIMITED TO, PROCUREMENT\
    \ OF\n# GOODS; LOSS OF USE, DATA, OR PROFITS;\n# INTERRUPTION) HOWEVER CAUSED\
    \ ON ANY THEORY OF\n# LIABILITY, WHETHER IN CONTRACT, STRICT LIABILITY, OR\n#\
    \ (INCLUDING NEGLIGENCE OR OTHERWISE) ARISING IN ANY WAY\n# OF THE USE OF THIS\
    \ SOFTWARE, EVEN IF ADVISED OF THE POSSIBILITY\n# OF SUCH DAMAGE.\n\n# FreeBSD:\
    \ src/etc/rc.diskless2, v1.5.2 07/24:49 $\n# rc.diskless2\n\n# Provide a function\
    \ for the mounting of memory\n# filesystems. This should allow the rest of the\
    \ code here\n# remain as close as possible between current and stable.\n\n# $1\
    \ = size\n# $2 = mount point\n# $3 = unit number (ignored in prealloc)\n# $4 =\
    \ (optional) bytes-per-inode\n\nmount_md() {\n  if [ -n \"$4\" ]; then\n    bpi=\"\
    -i $4\"\n    /sbin/mount_mfs -s $1 -T $bpi dummy $2\n  fi\n}\n\n# If there is\
    \ a global configuration file, suck it in.\nif [ -r /etc/defaults/rc.conf ]; then\n\
    \  /etc/defaults/rc.conf\n  source_rc_configs\nelif [ -r /etc/rc.conf ]; then\n\
    \  /etc/rc.conf\nfi\nmount_md ${varsize:=65536} /var\n\n# populate var using /etc/mtree/BSD.dist\n\
    usr/sbin/mtree -deU -f /etc/mtree/BSD.dist -p /var\n\n# create log files based\
    \ on the contents of /etc/newsyslog.conf\nLOGFILES=$(usr/bin/awk '$1 != \"\" {\
    \ printf \"%s\", $1 }' /etc/newsyslog.conf)\nif [ -n \"$LOGFILES\" ]; then\n \
    \ usr/bin/touch $LOGFILES\nfi\nmount -a # chown and chgrp are in /usr\n\n# XXX\
    \ make sure to create one dir for each printer requested by# lpd\n\n# If /tmp\
    \ is a symlink, assume it points to somewhere writable,\n# like /var/tmp, otherwise,\
    \ use a small memory filesystem\n# /tmp.\nif [ ! -h /tmp ]; then\n  mount_md ${tmpsize:=20480}\
    \ /tmp\nfi\n\n# extract a list of device entries, then copy them to a writable\
    \ fs\n(cd / ; find -x dev | cpio -o H newc) > /tmp/dev.tmp\nmount_md 4096 /dev\n\
    (cd ; cpio -i H newc -d < /tmp/dev.tmp)\n\nListing 12-1\n\nListing 12-1 shows\
    \ the code for the rc.diskless2 scripts provided with the FreeBSD 4 release. This\
    \ script handles booting a diskless system and handles the special requirements\
    \ for that type of system.\n\nFirst, rc.diskless2 reads in the global configuration\
    \ rc.conf files. Next the /var directory is mounted with a default size of 65536\
    \ sectors. Following the creating of var in memory, the directory structure for\
    \ var is created by the mtree command and necessary log files are created on the\
    \ contents of /etc/newsyslog.conf. With the var file system and the necessary\
    \ log files created, the file systems can be mounted via the mount command. Next,\
    \ the /tmp directory is created in memory with a default size of 20480 sectors.\
    \ Finally the /dev is created in memory and then populated.\n\nAs you can see,\
    \ many of the details of booting a diskless system are handled by the rc.diskless2\
    \ script. With a few custom modifications, our system will be ready for prime\
    \ time. Let's take a closer look at some of the settings.\n\n## Configuring Read-only\
    \ File Systems\n\n/var directory is used for temporary files and log files. Once\
    \ you have configured your system to run rc.diskless2 system, the /var directory\
    \ will be mounted as a memory file system. One of the parameters contained in\
    \ the rc.diskless2 script is varsize. The varsize variable represents the size,\
    \ in sectors, for the /var directory. The default is 65536, larger than available\
    \ memory. We'll set varsize to a value that better represents the requirements\
    \ of the DIO appliance.\n\n```\nvarsize=8192\n```\n\nWith the /var directory,\
    \ the /tmp directory is created by the rc.diskless2 script. The default size is\
    \ 10480 sectors. We'll set this to 8192 sectors, as this value better represents\
    \ the DIO appliance's requirement. The size of the tmp directory is controlled\
    \ by the tmsize variable.\n"
  mdcn: "\n\n## 配置 CompactFlash 设备\n\n配置 CompactFlash 设备与为 FreeBSD 配置任何其他启动设备类似。我们正在使用的开发硬件将开发磁盘安装为主主设备\
    \ (ad0)，并将 CompactFlash 安装为次级主设备 (ad2)。\n\n为了为 CompactFlash 设备创建初始配置，我们将使用创建 FreeBSD\
    \ 安装的标准工具。由于 CompactFlash 设备被显示为 IDE 磁盘，因此所有工具都能正常运行。对于我们的第一项任务，我们将对 CompactFlash\
    \ 进行分区和格式化，以便加载 DIO 固件软件。要开始操作，请切换目录到 `/stand` 目录并运行 `sysinstall`。\n\n```\n# cd\
    \ /stand\n# ./sysinstall\n```\n\n## 对 CompactFlash 设备进行分区\n\n启动 `sysinstall` 后，在安装菜单中选择\
    \ `custom`（自定义），然后选择 `partition`（分区）。Sysinstall 将要求你选择要进行分区的驱动器。选择 `ad2`，即 CompactFlash\
    \ 设备。\n\n在分区菜单中\n\n在选择将分区信息写入 CompactFlash 后，系统将提示你安装启动管理器。你应该选择 FreeBSD Boot\
    \ Manager。此时，CompactFlash 设备已完成分区。你可以通过选择 `q` 选项退出分区菜单。\n\n## 创建磁盘标签 (Disklabel)\n\
    \n下一步是在现有分区中创建磁盘标签。从 sysinstall 菜单中选择 `label` 选项。在 label 菜单中，创建一个将挂载为根分区 `/` 的分区，该分区应包含所有可用空间。\n\
    \n`/dev/ad2sla / 30MB UFS`\n\n完成后，将其写入 CompactFlash 设备。你可以退出 `sysinstall` 工具。通常，FreeBSD\
    \ 安装使用多个分区，如根分区、swap（交换分区）和 var。但由于 DIO 设备不使用 swap 或 `var` 文件系统，因此这些分区并不是必要的。\n\
    \n## 格式化文件系统\n\nCompactFlash 现在已准备就绪。下一步是格式化文件系统，这将使用 `newfs` 命令完成。\n\n```\n#\
    \ newfs /dev/ad2sla\nWarning: 2848 sectors in in last cylinder unallocated\n/dev/ad2sla:\
    \ 62688 sectors in 16 cylinders of 1 tracks, 4096 sectors\n30.6MB in 1 cyl groups\
    \ (16 c/g, 32.0MB/g, 7616 i/g)\nsuper-block backups (for fsck -b #) at:\n32\n\
    ```\n\n执行 `newfs` 命令完成后，CompactFlash 设备即可被挂载。一旦挂载完成，就可以复制文件并开始系统启动测试。\n\n## 挂载文件系统\n\
    \n在 CompactFlash 完成分区和文件系统格式化后，现在可以挂载它。使用 `mount` 命令完成设备挂载。\n\n```\n# mount /dev/ad2sla\
    \ /flash\n```\n\n挂载设备后，我们可以使用 `df` 命令显示文件系统以验证其是否已正确挂载。\n\n```\n# df /flash\n\
    Filesystem 1K-blocks Used Avail Capacity Mounted on\n/dev/ad2sla 30359 1 27930\
    \ 0% /flash\n```\n\n通过 `df` 的输出，可以看到 CompactFlash 设备 `/dev/ad2sla` 已挂载在 `/flash`\
    \ 上，并且包含略低于 30 MB 的磁盘容量。\n\n## 将文件复制到启动设备\n\n我们现在到了创建启动设备的最后一步。CompactFlash 已完成分区、格式化和挂载，现在是时候将文件从开发磁盘复制到\
    \ CompactFlash 设备了。为嵌入式设备创建系统镜像某种程度上是一种“黑术”。有多种方法可以确定嵌入式系统的组件。我将简要描述两种方法，作为创建你最终镜像的指南。无论你使用这些方法还是创建自己的方法，任何经验都无法跳过创建最终镜像这一步往往被忽视且被低估——但至关重要（特别是对于嵌入式系统而言）的步骤。无论准备得多么充分，都无法取代耗时的迭代和测试过程。\n\
    \n## 迭代方法\n\n我们的系统经过了配置，我们可以对 CompactFlash 设备进行迭代和测试。将所需文件复制到闪存磁盘中。当你准备好测试 CompactFlash\
    \ 设备时，在启动提示符处按空格键并输入 `ad(2,a)`。这将导致从 CompactFlash 设备启动。如果缺少文件，请正常重启系统，进行必要的更改并重试。\n\
    \n## 安装方法\n\n开发发布镜像的另一种方法是以传统方式将 FreeBSD 安装到硬盘上，添加你的应用程序软件，然后验证系统运行符合预期。然后，根据启动设备所需的大小精简你的系统。在按要求精简并测试系统后，使用\
    \ `dd` 将整个文件系统传输到你的启动设备。\n\n## 启动配置\n\n大部分无盘启动由 `rc.diskless2` 脚本处理。无盘 FreeBSD\
    \ 系统的控制由 `/etc/rc.diskless2` 处理。为了调用 `rc.diskless2`，必须在 `/etc/rc.conf` 中添加以下行：\n\
    \n```\ndiskless_mount=/etc/rc.diskless2\n```\n\n让我们查看代码列表 12-1 中的 `rc.diskless2`\
    \ 脚本。\n\n# 202 EmbeddedFreeBSD Cookbook\n\n# Copyright (c) 1999 Matt Dillon\n\
    # All rights reserved.\n\n# 允许源代码和二进制形式的重新分发和使用，无论\n# 是否修改，只要满足以下\n# 条件均被许可：\n\
    # 1. 重新分发源代码必须保留上述\n#    版权声明、此条件列表以及后续\n#    免责声明。\n# 2. 以二进制形式重新分发必须在分发随附的\n\
    #    文档和其他材料中复制上述\n#    版权声明、此条件列表以及\n#    免责声明。\n\n# 本软件由作者和贡献者提供，\n# 不作任何明确或暗示的保证，包括但\n\
    # 限于对商品销性和针对\n# 特定用途的适用性的暗示保证，在任何情况下，\n# 作者或贡献者均不对任何直接、\n# 间接、特殊或后果性损害承担责任，\n\
    #（包括但不限于购买\n# 货物；使用、数据或利润的损失；\n# 中断）无论由于何种理论\n# 引起，无论是在合同、严格责任还是\n# （包括由于疏忽或其他）由于使用本\n\
    # 软件的任何方式引起，即使已告知可能\n# 发生此类损害。\n\n# FreeBSD: src/etc/rc.diskless2, v1.5.2 07/24:49\
    \ $\n# rc.diskless2\n\n# 为挂载内存\n# 文件系统提供一个函数。这应该允许此处的其他代码\n# 在当前和稳定版本之间尽可能保持。\n\
    \n# $1 = 大小\n# $2 = 挂载点\n# $3 = 单元（在 prealloc 中忽略）\n# $4 = （可选）每个节点的字节数\n\nmount_md()\
    \ {\n  if [ -n \"$4\" ]; then\n    bpi=\"-i $4\"\n    /sbin/mount_mfs -s $1 -T\
    \ $bpi dummy $2\n  fi\n}\n\n# 如果存在全局配置文件，则将其加载。\nif [ -r /etc/defaults/rc.conf\
    \ ]; then\n  /etc/defaults/rc.conf\n  source_rc_configs\nelif [ -r /etc/rc.conf\
    \ ]; then\n  /etc/rc.conf\nfi\nmount_md ${varsize:=65536} /var\n\n# 使用 /etc/mtree/BSD.dist\
    \ 填充 var\nusr/sbin/mtree -deU -f /etc/mtree/BSD.dist -p /var\n\n# 根据 /etc/newsyslog.conf\
    \ 的内容创建日志文件\nLOGFILES=$(usr/bin/awk '$1 != \"\" { printf \"%s\", $1 }' /etc/newsyslog.conf)\n\
    if [ -n \"$LOGFILES\" ]; then\n  usr/bin/touch $LOGFILES\nfi\n\nListing 12-1\n\
    \n"
