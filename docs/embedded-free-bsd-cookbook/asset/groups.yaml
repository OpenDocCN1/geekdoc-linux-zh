    Before declaring a cdevsw entry for the KLD device driver, a little back-ground
    work is required. Let''s take at look at these steps before the cdevsw entry is
    declared.


    The first component of a KLD device driver is the device switch table. A KLD driver
    contains handler functions for open, close, read and write. Each function is forward
    declared so it can be listed in the device switch table.


    ```

    d_open_t    kld_open;

    d_close_t  kld_close;

    d_read_t   kld_read;

    d_write_t  kld_write;

    ```


    Before creating the switch table, a device major number is required. The file
    /sys/conf/majors contains the defined major device numbers. Numbers 32 through
    38 are predefined for KLD device drivers; 35 is a reasonable value for development.


    ```

    #define KLD_DRIVER_MAJOR  35

    ```


