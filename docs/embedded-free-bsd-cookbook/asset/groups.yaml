    \n## 总结\n\n在本章中，我们回顾了 JSP 页面的语法，并开发了一个用于显示 DIO 设备数字 I/O 线的 JSP 页面。DIO 设备的编程任务已经完成。在剩余的章节中，我们将重点关注构建内核并确保我们的组件能够正常启动。\n\
    \n## 构建内核\n\n### 概述\n\n内核是 FreeBSD 操作系统的核心。它负责管理资源、执行安全策略、网络、磁盘访问等。默认内核位于 `/kernel`\
    \ 文件中。\n\n在嵌入式系统的设计和开发中，磁盘空间和内存是关键资源。与装满 RAM 的典型桌面电脑不同，嵌入式计算机在软件和硬件方面只需要最小的支持即可执行其任务。\n\
    \n在安装 FreeBSD 期间，你的计算机上安装了一个名为 `GENERIC` 的内核。创建 `GENERIC` 内核是为了支持尽可能多的计算机和配置以简化安装过程。本章将讨论如何配置和构建自定义\
    \ FreeBSD 内核以适应我们的硬件和 DIO 应用。\n\n## 内核配置文件\n\n构建内核的第一步是创建一个自定义配置文件，这允许我们为特定硬件定制内核。创建自定义内核配置文件的一种推荐方法是是从位于\
