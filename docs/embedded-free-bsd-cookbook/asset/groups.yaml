- md: "\n# 188 Embedded FreeBSD Cookbook\n\n| 000019 ff 81 55 aa 0f 85 64 | ff f6\
    \ c1 01 84 5d ff | |...U..d......| |\n| 000001a0 89 ee 42 cd 13 c3 52 | 65 61\
    \ 64 00 42 6f 67 74 | |...B..Read.Boot!| |\n| 000001b0 20 00 65 72 72 6f 72 0d\
    \ | 00 0a 80 90 90 90 00 00 | | error. | |\n| 000001c0 00 00 00 00 00 00 00 00\
    \ | 00 00 00 00 00 00 00 00 | | |\n| 000001d0 00 00 00 00 00 00 00 00 | 00 00\
    \ 00 00 00 00 00 00 | | |\n| 000001e0 00 00 00 00 00 00 00 00 | 00 00 00 00 00\
    \ 00 80 00 | | |\n| 000001f0 01 a5 ff ff ff 00 00 | 00 | 00 50 c3 00 55 aa | |...P..U.|\
    \ |\n\nWe can see the last two bytes contain a valid magic number, AA55H. They\
    \ are reversed in the display the x86 is little endian architecture and hexdump\
    \ is displaying the output in bytes, which reverses the order.\n\nLet's use a\
    \ more focused version of the hexdump command to dump bytes of the partition.\n\
    \n```\n# hexdump -c -s 0x1be -v boot.bin\n000001be 00 00 00 00 00 00 00 00 | 00\
    \ 00 00 00 00 00 00 00 | |................|\n000001ce 00 00 00 00 00 00 00 00\
    \ | 00 00 00 00 00 00 00 00 | |................|\n000001de 00 00 00 00 00 00 00\
    \ 00 | 00 00 00 00 00 00 50 c3 | |.......P|\n000001ee 80 01 00 a5 ff ff ff | |\
    \ |...................P..U.| |\n```\n\nWe see from the MBR of my machine, the\
    \ last entry in the partition table contains a FreeBSD partition which is active\
    \ and the length of the complete disk. Let's take a more detailed look at our\
    \ partition located at offset 1EE.\n\nOffset 0 shows this is the active partition,\
    \ 80H, and offset 4 shows this is a FreeBSD partition, A5H. Offsets 1, 2 and 3\
    \ give the starting of the partition in head, cylinder format. This tells us that\
    \ the partition starts with the MBR. Offsets 5, 6 and 7 give the ending sector\
    \ of the partition in head, cylinder format. The values of FFF in all these fields\
    \ denote that the partition uses the whole disk. Offsets 8-B give us the distance\
    \ from the MBR to the beginning of the partition; this value is 0. Once again,\
    \ denoting-the partition begins with the MBR. The final four bytes of the partition\
    \ table contain the number of sectors in the partition.\n\n# Boot Slice\n\nNow\
    \ that we've identified the partition table, we'll take a look at how FreeBSD\
    \ BSD uses it. Within a disk partition, FreeBSD creates a slice, which is used\
    \ by FreeBSD to implement the traditional Unix filesystem of 8 partitions, through\
    \ f. As you may have noticed, the term \"partition\" is used to represent numerous\
    \ things, which is why the term \"slice\" was brought into play.\n\n# 189 Chapter\
    \ Eleven\n## System Startup\n\nLet's define a few terms to avoid confusion.\n\n\
    A slice is a section of a disk; each disk contains most four slices. The slices\
    \ are defined by a table contained in the MBR.\n\nA partition is a section of\
    \ slice. Each partition may contain a file system or swap space in FreeBSD. \n\
    \n| Master Boot Partition Table | a |\n|---|---|\n| | b |\n| | c |\n| Partition\
    \ 1 (FreeBSD Slice) | d |\n| Partition 2 | e |\n| Partition 3 | f |\n| Partition\
    \ 4 | g |\n| Partition 1 (FreeBSD Slice) | h |\n\nA FreeBSD slice is defined by\
    \ the MBR partition table.\n\nThe UNIX filesystem partitions are then implemented\
    \ with FreeBSD slice.\n\nFigure 11-2. Partition Table and Slice\n\n# Unix Partitions\n\
    \nA Unix disk is divided into as many as 8 partitions. A partition represents\
    \ separate entity on the disk. FreeBSD disks typically use 4 of the 8 available\
    \ partitions: the partition is used for the root file system, the partition is\
    \ used for swap. The partition contains the user partition, and the partition\
    \ is used for the file system. An important note is the partition, which is historically\
    \ used to represent the whole disk. We can look at the /etc/fstab to see how the\
    \ disk is partitioned.\n\n```\n/dev/ad0sb  none  swap   0 0\n/dev/ad0sa  /   \
    \   rw   1 1\n/dev/ad0sf  /usr   rw   2 2\n/dev/ad0se  /var   rw   2\n```\n\n\
    The disk is denoted by the device name in column 1. Root file system, swap partition,\
    \ and the var partition.\n\n# PC BIOS\n\nAfter turning on or resetting your computer,\
    \ execution begins with generic code called the BIOS. The BIOS is the lowest level\
    \ software and provides an interface between the software and hardware. The BIOS\
    \ (basic input/output system) has the task of initializing the hardware, loading\
    \ and running the boot loader contained in the MBR.\n\nThe boot loader is a program\
    \ that resides in the MBR and is loaded by the BIOS. The BIOS loads it into memory\
    \ and begins execution. The information contained in the MBR includes information\
    \ to find the boot loader on disk, a program to read the boot loader into memory.\
    \ Once a PC is powered on, the BIOS has a list of tasks to perform:\n\n1. A series\
    \ of tests are performed on existing hardware to ensure the hardware is working\
    \ properly.\n2. Hardware resources are initialized and assigned.\n3. Configured\
    \ devices are searched for a valid boot sector.\n4. The boot sector is loaded\
    \ and transferred to the boot loader.\n\nAfter the system boots, the BIOS reads\
    \ the MBR into location 7C0H, the last two bytes of that sector should contain\
    \ the MBR magic number AA55H. If the last two bytes are AA55H, control is passed\
    \ to the boot loader routine; otherwise the system stops.\n\n# FreeBSD Boot\n\n\
    Once the BIOS loads the MBR into memory, the FreeBSD booting process begins. It\
    \ consists of three stages, each stage providing more features and increasing\
    \ in size. The first two stages are actually part of the same program but are\
    \ split into to space constraints. The third stage is the boot loader. Individual\
    \ components of the boot process are located in the /boot directory.\n\n```\n\
    # ls -l /boot\ntotal 533\n--r-r- 1 root wheel 512 Sep 18 13:28 boot0\n-r-r-r-\
    \ 1 root wheel 512 Sep 18 13:28 boot1\n-r-r-r- 1 root wheel 7680 Sep 18 13:28\
    \ boot2\n-r-xr-xr-x 1 root wheel 149504 Sep 18 13:28 cboot\ndrwx-xr-xr-x 2 root\
    \ wheel 512 Oct 24 16:52 defaults\n-r-xr-xr-x 1 root wheel 147456 Sep 18 13:28\
    \ loader\n-r-r-r- 1 root wheel 9237 Sep 18 13:28 loader.4\n-rw-r-r- 1 root wheel\
    \ 67 Dec 16 16:51 loader.conf\n-r-r-r- 1 root wheel 12064 Sep 18 13:28 loader.help\n\
    -r-r-r- 1 root wheel 338 Sep 18 13:28 loader.rc\n```\n\n```\n-r-r-r- 1 root wheel\
    \ 512 Sep 18 13:28 mbr\n-r-xr-xr-x 1 root wheel 149504 Sep 18 13:28 pxeboot\n\
    -r-r-r- 1 root wheel 25121 Sep 18 13:28 support.4th\n```\n\nThe source code that\
    \ represents the FreeBSD boot stages resides in /sys/i386/biosboot directory.\
    \ For a dedicated FreeBSD system, the boot code contained in the MBR resides in\
    \ /boot0. The source code resides in /sys/boot/i386. Let's take a closer look\
    \ at the boot stages.\n\n# boot1 and boot2\n\nThe first stage is loaded by the\
    \ MBR to location 7C00H and is limited to 512 bytes. This first boot copies itself\
    \ to 10000H and loads the second-stage boot resides in the first 15 stages of\
    \ the boot slice, bringing the total of the first and second boot to 16 stages\
    \ or 8 KB. The first and second stages of the boot process are actually built\
    \ together so boot1 knows exactly where boot2 starts execution and calls that\
    \ entrypoint.\n\n![](img/8be5cdcebf09c36e2285b8e096cda24a_191_0.png)\n"
