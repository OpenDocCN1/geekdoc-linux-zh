    \ |\n| MSG_WAITALL | 等待完整请求或错误 |\n\n`Recv` 返回接收到的字节数，失败时返回 -1。\n\n## 无连接数据传输\n\
    \n面向连接的服务器的替代方案是无连接服务器。无连接服务器与众不同，因为它在传输数据之前不会建立连接。在无连接协议中，服务器会阻塞直到从客户端接收到端口数据。\n\
    \n## recvfrom 系统调用\n\n`recvfrom()` 系统调用从套接字接收消息并捕获发送数据的地址。与只能用于已连接流式套接字或绑定的数据报套接字的\
    \ `recv()` 调用不同，`recvfrom()` 可用于套接字上接收数据，无论其是否已连接。如果套接字上没有消息，`recvfrom()` 调用将阻塞直到消息到达，除非套接字是非阻塞的。\n\
    \n```c\n#include <sys/types.h>\n#include <sys/socket.h>\n\nssize_t recvfrom(int\
    \ s, void *buf, size_t len, int flags, struct sockaddr *from, socklen_t *from);\n\
    ```\n\n如果套接字是非阻塞的，则返回 -1 并设置外部变量 `errno` 为 `EWOULDBLOCK`。\n\n## sendto 系统调用\n\n\
    调用 `sendto` 向套接字传输数据。`sendto()` 调用通过面向连接或无连接的套接字传输消息。如果是无连接套接字，消息将发送到 `to` 指定的地址。如果\
    \ `s` 是面向连接的套接字，则 `to` 和 `len` 参数被忽略。\n\n```c\n#include <sys/types.h>\n#include\
    \ <sys/socket.h>\n\nssize_t sendto(int s, const void *msg, size_t len, int flags,\n\
    const struct sockaddr *to, socklen_t tolen);\n```\n\n`sendto` 系统调用返回传输的字符数，如果发生错误则返回\
    \ -1。\n\n## DIO 进程\n\n现在我们已经介绍了套接字系统调用，并将使用它们来创建 DIO 进程。DIO 进程是一个基于套接字的面向连接守护进程，用于处理与\
    \ PCI-DIO24 采集板相关的请求。DIO 进程结合本节开发的简单协议，用于为客户端提供一种简单的机制来查询服务器上的数字 IO 线。\n\n## 协议\n\
    \n在深入研究数字 IO 进程的细节之前，我们将定义客户端和服务器之间使用的协议。该协议由 DIO 进程执行的操作和请求格式组成。完整的协议包含一个定义了\
    \ 进程提供的提供的操作集的枚举，以及一个用于在 DIO 服务器和客户端之间传输数据的结构。\n\n## operation_t 枚举\n\nDIO 进程执行三个操作：读取线路方向、读取线路和写入线路。这些操作由枚举\
    \ `operation_t` 定义。\n\n```c\n/*\n** 定义数字 IO 协议的操作\n */\ntypedef enum operation_t\n\
    {\n  read_line = 0,      /* 读取数字 IO 线的值（注释可能有误） */\n  write_line,         /* 向数字\
    \ IO 线写入一个值*/\n  read_direction,     /* 请求 IO 线的方向 */\n} operation_t;\n```\n\n\
    DIO 接口库具有比这三个操作更多的功能。为了简单起见，我们仅提供查询线路状态以及读取或写入这些线路的能力。\n\n## diod_request 结构\n\
    \n在上一节中，我们定义了 DIO 进程执行的操作；现在我们定义请求的格式。`diod_request` 包含了数据。\n\n```c\ntypedef struct\
    \ diod_request\n{\n  int32_t size;        /* 结构的大小 */\n  uint32_t magic;     \
    \ /* 预定义的魔数 */\n  int32_t sequence;    /* 服务器发送的序列号 */\n  operation_t operation/*\
