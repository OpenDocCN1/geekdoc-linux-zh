    ### Building, Loading and Unloading


    The `make_device_driver.sh` script provides a complete kernel-loadable driver
    build environment. The Makefile contains commands to build, clean, install, and
    uninstall the device driver. Let''s take a look at the build environment and each
    command in a little more detail.


    ```

    make_device_driver.sh created a KLD build directory for the DIO driver in the
    /sys/modules/dio directory. Before attempting any of the commands described below,
    cd to the /sys/modules/dio directory.

    ```


    ```bash

    # cd /sys/modules/dio

    ```


    A common source of bugs and inconsistencies during driver development stems from
    building a driver with stale object files. The `make clean` command deletes all
    the object and driver files, forcing all the components to be built and linked.


    ```bash

    # make clean

    ```


    A device driver consists of include files and other disjoint pieces of source
    code that must be compiled in a specific order. The KLD build environment contains
    a command that computes and resolves build dependencies. The `make depend` command
    handles the details of computing the dependencies for the device driver build.


    ```bash

    # make depend

    ```


    Once the build dependencies have been resolved and are up to date, the next revision
    of the device driver can be built. The `make` command is used to build all the
    components of the device driver and link them together to create the device driver
    module.


    ```bash

    # make

    ```


    The output of the build process is the file `dio.ko`, the driver KLD.


    During the development process, a driver is built, tested, modified and features
    added. KLDs are installed and uninstalled dynamically. In order to iterate revisions
    of the device driver, it is necessary to uninstall the current revision. The `make
    uninstall` command unloads the current running version. `make uninstall` calls
    `kldunload` to remove the driver from the kernel.


    ```bash

    # make uninstall

    ```


    To install a version of your driver, `make install` dynamically loads the driver
    into the running system. `make install` calls `kldload` to load the driver into
    the running kernel.


    ```bash

    # make install

    ```


    Additional commands may be added by each individual driver developer. However,
    the tools provided by FreeBSD give the driver developer a robust set of utilities
    to hit the ground running for developing a device driver.


