    \n## Summary\n\nIn this chapter we reviewed the syntax of JSP pages and developed\
    \ a JSP page to display digital IO lines for the DIO appliance. The programming\
    \ tasks are now completed for the DIO appliance. In the remaining chapters, we\
    \ will focus on building the kernel and making sure our components start properly.\n\
    \n## Building the Kernel\n\n### Overview\n\nThe kernel is the core of the FreeBSD\
    \ operating system. It is responsible for managing resources, enforcing security,\
    \ networking, disk access, and more. The default kernel is located in the file\
    \ /kernel.\n\nIn the design and development of an embedded system, disk space\
    \ and memory are critical resources. Unlike a typical desktop computer packed\
    \ with RAM, an embedded computer only needs minimal support to perform its task,\
    \ with respect to software as well as hardware.\n\nDuring FreeBSD installation,\
    \ a kernel is installed on your computer called the GENERIC kernel. The GENERIC\
    \ kernel is created to support as many computers and configurations as possible\
    \ to simplify the installation process. This chapter discusses how to configure\
    \ and build a custom FreeBSD kernel to suit our hardware and DIO application.\n\
    \n## The Kernel Configuration File\n\nThe first step toward building a kernel\
    \ is to create a custom configuration file, which allows us to tailor the kernel\
    \ for our specific hardware. One recommended method for creating a custom kernel\
    \ config file is to start with the generic config file, located in /usr/i386/conf/GENERIC\
    \ and remove the extra peripherals. We will create our config file using this\
    \ method, but first we'll look at the GENERIC file.\n\nThe GENERIC kernel provides\
    \ support for many popular peripherals contained in PCs. Most of these devices\
    \ can be removed to give us a much smaller kernel. Kernel configuration files\
    \ are located in the /sys/i386/conf directory.\n\n## GENERIC Configuration File\n\
    \nIn the following sections you'll find definitions of the main parts of a kernel\
    \ configuration file.\n\n### The machine Keyword\n\nThe machine keyword defines\
    \ the CPU architecture the kernel will execute on. The GENERIC Configuration file\
    \ for the x86 FreeBSD distribution is i386. Only one machine keyword can be specified\
    \ in the config file.\n\n```\nmachine i386\n```\n\n### The cpu Keyword\n\nThe\
    \ cpu keyword defines the CPU types the kernel will execute. GENERIC is configured\
    \ to run on Intel 386 and greater CPUs. A kernel can be configured to run on more\
    \ than one CPU. However, the CPUs defined in the configuration file must be binary-compatible.\
    \ If the DIO runs on a Celeron processor, our configuration will consist of 1686_CPU\
    \ architecture.\n\n```\ncpu I386_CPU\ncpu I486_CPU\ncpu I586_CPU\ncpu I686_CPU\n\
    ```\n\n### The ident Keyword\n\nHere, ident is used to specify the name of the\
    \ kernel. Each configuration file should have a unique name. The value specified\
    \ by the ident keyword is the value displayed on the system console during boot.\n\
    \n```\nident GENERIC\n```\n\n### The maxusers Keyword\n\nThe maxusers keyword\
    \ tunes the sizes of kernel internal data structures. The larger this value, the\
    \ more system memory is used. Because the DIO appliance is a dedicated system,\
    \ we will lower this value to consume less system memory.\n\n```\nmaxusers 32\n\
    ```\n\n## Building the Kernel\n\n### Kernel Options\n\nThe following sections\
    \ provide a description of each of the global kernel options for the GENERIC configuration\
    \ file.\n\n### The makeoptions Keyword\n\nThe makeoptions keyword specifies compiler\
    \ options that are processed by the config command and passed to the C compiler.\
    \ For example, if we wanted the debugging option to analyze system crash dump,\
    \ the line would be.\n\n```\nmakeoptions DEBUG=-g #Build kernel with debug symbols\n\
    ```\n\n### The options Keyword\n\nThe options keyword is used to customize the\
    \ kernel by setting various options.\n\nMATH_EMULATE If your computer contains\
    \ i386 or i486 without a math coprocessor, the kernel may provide support.\n\n\
    ```\noptions MATH_EMULATE #Support for x87 emulation\n```\n\nINET These options\
    \ are used for networking, INET and INET. The DIO appliance will not be connected\
    \ to IPv6, so these will be removed.\n\n```\noptions INET #Networking\noptions\
    \ INET6 #IPv6 protocols\n```\n\nFile Systems FreeBSD provides support for numerous\
    \ file systems. FFS, originally known as UFS, the default system that the data\
    \ logger uses. Additionally, we will be booting from a flash device and running\
    \ a memory file system.\n\n```\noptions FFS #Berkeley Fastystem\noptions FFS_ROOT\
    \ #FFS usable as root\n```\n\n## Embedded FreeBSD Cookbook\n\noptions SOFTUPDATES\
    \ #Enable FFS soft updates support\noptions MFS #Memory Filesystem\noptions MD_ROOT\
    \ #MD is a potential root device\noptions NFS #Network Filesystem\noptions NFS_ROOT\
    \ #NFS usable as root device, NFS\nrequired MSDFS #MDSOS Filesystem\noptions CD9660\
    \ #ISO 9660 Filesystem\noptions CD9660_ROOT #CD-ROM usable as root, CD9660 required\n\
    \noptions PROCFCS #Process filesystem\noptions COMPAT_43 #Compatible with BSD\
    \ 4.3 [keep THIS!]\n\nSCSI Delay Kernel has a tunable value for probing the SCSI\
    \ bus. The data logger does not have any SCSI peripherals, so this will be removed.\n\
    \n```\noptions SCSI_DELAY=15000 #Delay (in ms) before probing SCSI\n```\n\nConsole\
    \ This allows users to grab the console; this is particularly useful for X Windows.\
    \ Since the DIO appliance does not run X Windows, this will be removed.\n\n```\n\
    options UCONSOLE #Allow users to grab the console\n```\n\nKtrace Support for the\
    \ ktrace system call. This feature is useful for debugging and reverse engineering\
    \ system utilities. This will be removed.\n\n```\noptions KTRACE #ktrace(1) support\n\
    ```\n\nSystem Interprocess Communication These options provide support for System\
    \ interprocess communication, shared memory, messages, and semaphores. These are\
    \ most useful for X Windows, but other system utilities may use these as well.\n\
    \n```\noptions SYSVM-style #SYSV-style shared memory\noptions SYSVMG #SYSV-style\
    \ message queues\noptions SYSSEM #SYSV-style semaphores\n```\n\nMultiprocessor\
    \ Support These options provide support for multiprocessor support; since the\
    \ data logger runs on a single CPU Celeron, these will be removed.\n"
