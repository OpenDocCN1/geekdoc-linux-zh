  md: 'This command will make copies of your files in the “tmp/mydir” directory. We
    do not have to specify the name of the archive since none is going to be created.


    Instead of physically copying all files to a new directory, you can make links
    for those files, thus saving on disk space. To create links to files, you can
    include the “-l” option in the above command. However, one important limitation.
    You will recollect that, though it is easy to make physical copies of files across
