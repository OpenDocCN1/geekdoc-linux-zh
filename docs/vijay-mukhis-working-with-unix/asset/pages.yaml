  md: '# Using The vi Editor


    Dawn was about to break on the distant horizon. The somber colors of the sky were
    changing palette to more lively shades of orange. A gentle morning breeze was
    blowing that carried with it the sweet chirping of birds. And as the world was
    awakening from sweet slumber, the editor’s office in the morning newspaper was
    as busy as a mall at Christmas.


    The editor was giving the finishing touches to all the latest news that had poured
    in, in the wee hours of the morning. News items were prepared in a flash and dispatched
    amidst cries of “Stop Press!”. The atmosphere was electric and the hustle-bustle
    had to be seen to be believed.'
  merge: -1
  pgno: 130
- img_proc: true
  md: 'Among this multitude, the Editor was the man who came to the forefront. The
    man who made all the decisions that kept the newspaper ticking. An individual
    who scrutinized and checked every item of news that would soon reach the masses.


    In an operating system, the editor assumes the same amount of importance. The
    ultimate authority that helps create and modify users'' files and data. Under
    eagle eye, the user can create his files and rest assured. Hence it is always
    a good rule, when beginning with a new operating system, to befriend the editor.
    To satisfy his whims and fancies, so that creating and modifying files becomes
    a smooth and effortless process.


    Any ASCII text file, such as a program or document maybe created or modified using
    a text editor. There are two text editors available under Unix, vi and ed. Since
    ed is merely a line editor like EDLIN in DOS, we take a plunge into vi straightaway.


    As a matter of saying, vi stands for “visual”. We worked with vi for several months
    and found nothing ‘visual’ about it. The only significance of the name “visual”
    is that what you see on the screen is vi''s notion of what the file contains.
    No fancy effects. No scope for misunderstanding. What you see is what you get.


    Incidentally, vi created a sensation when it first appeared on the Unix scene.
    It was the first full screen editor that allowed the user to view the entire document
    at the same time instead of slithering line by line. Creating a file became a
    whole lot easier and with it, the lives of so many programmers.'
  merge: -1
  pgno: 131
- img_proc: true
  md: '# Using The vi Editor


    Truly, vi is as much a part of Unix as the nucleus is of an atom. Due to its deep
    rooted past, vi has become synonymous with Unix and even today, it continues to
    be among the best editors available with Unix.


    vi was created and written at the University of California at Berkeley by a man
    known as the “Joy” of Unix, Bill Joy. One of the co-founders of Sun Microsystems,
    Bill Joy is regarded as one of the stalwarts of Unix and vi is only one of his
    major contributions.


    Like all Unix programs, vi is a power-packed editor but lacks the finery and decor
    that so many modern-day editors possess. It cannot be equated with the modern-day
    wordprocessors since it does not perform any text formatting. It follows its own
    set of rules and makes no effort whatsoever to be ‘user-friendly’.


    Even the most experienced computer user may take a while to get accustomed to
    vi. The commands are queer and there are no on-screen menus to help you prod along
    and add to your troubles, there''s absolutely no help. It''s a pure case of mind
    over matter. And believe us, learning vi will be a giant step towards mastering
    the intricacies of Unix.


    As an editor, vi has two specific tasks. The first and the most important task
    of vi, as we see it, is to change the attitude of the user and make him aware
    that Unix demands a certain level of maturity and knowledge when it comes to using
    even its elementary editors. In many ways, vi sets standards in Unix and presents
    the true no-nonsense picture that Unix is built over. Its cryptic combinations
    and the complete lack of on-screen help induce a sense of seriousness and virtually
    establishes a tussle between itself and the user. And only the best man wins.
    Hence an early tryst with vi can prove very beneficial to new Unix users.'
  merge: -1
  pgno: 132
- img_proc: true
  md: '# Working with Unix


    The other task of vi has a lot to do with its function and purpose. As an editor,
    vi helps the user create new files and edit existing ones by offering all the
    conventional editing functions and a lot more. In this chapter, we have captured
    the essence of the ''visual'' vi and present a step-by-step approach to hands-on
    vi sessions.


    # Why vi is difficult to learn?


    vi was written for programmers who had no full screen editors with which to type
    programs. Entretanto Unix editors were mere single line editors where only the
    current line was visible on the screen. Imagine writing lines and lines of code,
    with only the current line visible. Shun the very thought.


    At its inception, vi was regarded as God''s gift to programmers and Bill Joy received
    wide acclaim and eulies. But as the Unix family increased multifold, amateur users
    were bewildered and knocked out flat, to put it mildly! What makes vi so difficult?
    Several aspects.


    +   1. The user is always kept in the dark. The screen is most uninformative.
    Errors ring bells. And there''s no help in sight.


    +   2. In vi, the same keys have multiple uses depending upon the current mode
    that the user is in. The key combinations are no way mnemonic. You could make
    charts and tables. But it won''t sink in. You''ve got to practice it and only
    experience will help.


    +   3. vi is fanatically case-sensitive. In the sense that there''s a vast difference
    in the function of “j” and the function of “J”. And needless to say, you''d better
    remember both.'
  merge: -1
  pgno: 133
- img_proc: true
  md: 'That''s the true picture. Not meant to depress you, but all the same, to eliminate
    any rosy ideas that you have conjured about vi. You''re going to have to work
    on it. No other way out.


    # Salient Features of vi:


    We had to really work hard for this one. There are some really outstanding features
    of vi, if you cleanse all the bias and broaden your horizons. After all, beauty
    lies in the eyes of the beholder.


    +   1. vi is omnipresent. You could move to a Unix installation on the North Pole,
    invoke vi and begin work. Which is why it pays to learn vi. It''s an integral
    part of Unix and a large step towards comprehending and developing a healthy understanding
    of the Unix environment in general.


    +   2. Speed. It''ll become apparent as soon as you learn the ropes in vi. As
    a beginner, you may crawl along. But that happens to the best of us. vi derives
    its roots from single line editors that were nothing but fast. Fortunately, when
    the scope widened, the inherent speed that it possessed could not be damped.


    +   3. Powerful “undo” features. vi has more undo features than most jazzy wordprocessors
    today. Obviously, the creator was aware that users were going to commit mistakes.
    We have exclusively covered the “undo” features in great detail since these serve
    as the only true friends in vi.'
  merge: -1
  pgno: 134
- img_proc: true
  md: '4. And last but not the least, vi has been around for so long and so many people
    have sweated out learning vi, that they''ll now go to any lengths to support it.
    Even today, popular magazines on Unix carry articles and features that will make
    the use of vi more exciting and purposeful. The vi supporters have become such
    an overwhelming majority that it makes better sense to join ''em rather than to
    try and beat ''em.


    # vi: The Basics


    Often the most complex problems are created due to a glaring lack of understanding
    of the basics. When you''re to start working with something as complex as vi,
    it''s a real good idea to get the basics clear. It''s going to count all along.


    +   1. vi and ex are basically one and the same editor. The difference however
    becomes more than apparent in the user interface that each has ex is basically
    a single line editor whereas vi is a full screen editor. The commands of both
    these editors are mutually compatible with each other.


    +   2. vi performs no editing operation on the file that is specified during invocation.
    Instead it makes a copy of that file into an "editing buffer". All changes or
    additions to the file are incorporated into the editing buffer itself. The contents
    of this buffer are finally saved to a file on disk when the user quits out of
    vi, using the write and quit command. If the file contained several errors, the
    user may choose to abandon the buffer completely, in which case the disk file
    will remain unaltered.


    +   3. Modes of Operation: vi works in three basic modes of operation:'
  merge: -1
  pgno: 135
- img_proc: true
  md: 'i) **Command Mode:** In the command mode, all the keys pressed by the user
    are interpreted to be editor commands. No text is displayed on the screen in this
    mode, even if the corresponding key is pressed on the keyboard.


    ii) **Insert Mode:** The insert mode can be entered by typing any of the vi insert,
    append, open, substitute, change or replace commands. Once vi is in the insert
    mode, letters typed in at the keyboard are echoed in the editing buffer.


    iii) The **ex Escape Mode** or The **Escape colon (:) mode**: : ex has single
    line commands that are terminated with the “Return” or the “Enter” key. vi, however,
    has commands that are invoked with the press of a single key (however difficult
