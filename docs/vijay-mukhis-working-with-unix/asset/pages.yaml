- img_proc: true
  md: '# Working With Unix


    Having learnt how to re-direct the output of a Unix command into a file, let''s
    try and re-direct the standard error of a Unix command into a file.


    Let''s cat a file, that may or may not exist in the current directory. Use the
    command:


    ```

    $ cat doubtful 2> check

    ```


    "doubtful" does exist, then the contents of that file will be copied into the
    new file "check". However, if it does not exist, then "check" will contain the
    standard error generated by the failed cat command. That''s what 2> implies. Remember
    that 2 denotes the standard error and 1 the standard output.


    Let''s check out the contents of "check".


    ```

    $ cat check

    cat: cannot open doubtful

    $

    ```


    It''s the standard error of the cat command. Note that if the file "doubtful"
    had existed, the contents of that file, would be copied into the file "check".


    That''s all we have to say about the three standards of Unix. You''re going to
    see a lot of I/O re-direction around this book. So give yourself some time to
    explore the I/O re-direction operators. Create files, append to existing files
    and have a ball.'
