  md: "# Working With Unix\n\nThe “case” construct tries to match the word following\
    \ it, with a series of patterns in each section. If a match is found, then the\
    \ commands in that section are promptly executed upto the \";;\" mark.\n\nThe\
    \ last pattern (“*)” will match any word that follows the “case” statement. In\
    \ this manner, you can specify commands to be executed in this section, in case\
    \ no matches are found. This pattern must always be placed as the last possible\
    \ pattern in the “case” construct, so that the other patterns are checked first.\
    \ Normally, commands that echo error messages are included in this section.\n\n\
    ```\n$ cat > menu\nclear\ntput smso\necho \"      The Unix Commands Menu\necho\n\
    tput rmso\n    echo \"      1: ls -l  \"\n    echo \"      2: pwd      \"\n  \
    \  echo \"      3: ps       \"\n    echo \"      4: who -H\"\necho\necho Enter\
    \ your choice\nread choice\ncase $choice in\n    1) ls -1\n      ;;\n    2) pwd\n\
    \      ;;\n    3) ps\n      ;;\n    4) who -H\n      ;;\n    *) echo Incorrect\
    \ choice;\n      ;;\n```"
  merge: -1
  pgno: 499
- img_proc: true
  md: '# Shell Programming


    $ esac

    The first command "tput smso" in this program, ensures that the header "Unix Commands
    Menu" appears in reverse video at the center of the screen. The echo command,
    by itself, causes a blank line in the output.


    The command options are displayed in normal video using the "tput rmso" command.
    For each command to be executed, the program requests the user to enter his choice.
    Based on the choice that the user enters, the "case" constructs ensure that the
    appropriate command is executed. In case the user inputs a wrong choice, the error
    message is included in the "(*)" option at the end of the "case" construct.


    The output of this program is as follows.


    ```

    $ menu

    The Unix Commands Menu

    1 : ls -l

    2 : pwd

    3 : ps

    4 : who -H

    ```


    ```

    Enter your choice

    3

    PID TTY TIME COMMAND

    140 2c 0:04 sh

    186 2c 0:00 sh

    189 2c 0:00 ps

    ```


    $'
  merge: -1
