  md: '# Creating a Simple Shell Program:


    The action begins. At first it''s low-key and elementary. But it strengthens the
    fundamentals and prepares you for the hectic maneuvers that will follow.


    ```

    $ cat > first-script

    pwd

    echo

    ls -C

    echo end of shell program

    ($

    ```


    The “echo” command, without any message, will generate a blank line between the
    outputs of the two commands. Our first Shell script, which we fondly called “first-script”
    is now complete.


    A momentous occasion. The initiation of our quest into the essence of the Unix
    operating system. Its Shell. We have created a simple Shell program. Only a collection
    of valid Unix commands. No fancy stuff. Yet.


    # Naming Shell Programs:


    What''s in a name? We beg to differ. The point we''re trying to make is this:
    Never call a Shell program by the same name as a system command. This means that,
    while creating new Shell programs, never give them names like “ls” or “mv” and
    so on. The caution in naming Shell programs is well worth it.


    If the Shell program is given the same name as a valid Unix command, chaos will
    reign. Let''s take the above example. A simple program that includes the “pwd”,
    “echo” and the “ls” commands. If this Shell program was to be called “ls” and
    the PATH was set as:


    ```

    :/bin:/usr/bin

    ```'
