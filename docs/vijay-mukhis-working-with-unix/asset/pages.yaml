    PATH: restricted.

    ```


    It''s quite unbearable.


    We know how to kill a process that is active on our terminal. We know the PID
    of rsh from the ps command. So let''s break the shackles.


    ```

    $ kill -9 721

    Killed.

    $

    ```


    Remember that to kill a process like a Shell, one has to send it the forcible
    terminate signal, number 9.'
