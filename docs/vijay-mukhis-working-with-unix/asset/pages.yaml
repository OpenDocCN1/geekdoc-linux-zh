  md: '# Working With Unix


    The “Custom” program is one of the most useful utilities when it comes to installing
    new software or removing existing ones. To install new software on your Unix machine,
    select the “Install” option. Screen 5 shows the “Install” screen.


    ![](img/2b13e596b1053c0c9f492dfe40dfa70a_509_0.png)


    The “Install” option displays a friendly screen that helps you install new products,
    particular packages or specific files from within packages. Select any option
    from the window on the bottom right of the screen and commence installation. The
    entire process is made easy and flexible through the “Custom” program.


    The “Remove” option, when selected, produces a similar screen to the one shown
    above and assists the System Administrator in removing installed software.


    Quit from the “Custom” program by selecting the “Quit” option and return to the
    main screen shown in Screen 1. There’s a lot more to explore in the “syadmsh”
