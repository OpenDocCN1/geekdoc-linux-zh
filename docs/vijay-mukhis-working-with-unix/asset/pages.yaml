  md: '# Introduction


    If a command in DOS doesn''t work, who do you blame? Bill

    Gates. If the stock market crashes, who do you blame? Bill

    . If the sun doesn''t rise one morning, who do you

    blame? Bill Gates. If Unix is a problem, who do you blame?

    Bill Gates, of course.


    Bill Gates. With his hawk eyes and stringent standards. If

    only he had stood like a sentinel at the gates of the Unix

    power station, perhaps so many commands would not have

    passed on indiscriminately into the Unix realm. As the

    count stands today, Unix has one million, nine hundred and

    tenty and a half commands, each graced by two

    million, four hundred and a quarter options. All of them

    incompatible with each other. It''s Bill Gates'' fault, of

    course, that he manned the check-post at the DOS

    quarters.


    And so we all suffer. Quietly. Understanding and

    memorizing as much as we can. For, everything that you

    can, in Unix, you can do it in five different ways. You can

    ether copy a file with the pithy command ''cp'', simply

    because it is short and sweet. Or you can use the more

    elaborate and efficient ''copy''. The choice is yours.


    The golden rule is, never, never, look at a Unix command

    and jump to conclusions. Evocativeness is a term that Unix

    hasn''t learnt at all. So, ''dd'', copies a file in capital letters,

    simply because the more ideal ''cc'' is a C compiler in Unix.

    ''dd'' is, logically, the next best thing to ''cc''.'
  merge: -1
  pgno: 14
- img_proc: true
  md: 'And then there''s ''biff''. The mail heraldo. The command that tells you you''ve
    got mail, even while you''re busy working on other things. It had to be ''biff''.
    Heidi Stetner, the Administrative Officer at the University of California, always
    heard her mail ten yards before she got it. Her cute dog never failed to yap at
    the mailman''s ankles. He barked until the whole world knew that Heidi had mail.
    He was Biff, of course.


    Finally, if you really want yacc, boast and find a line in your file, that ends
    with an "a", begins with a capital letter from "A" to "G", and has three occurences
    of the duo "de", the second occurence of which has two "z"s on either side, we
    suggest you grep. This book is definitely for you.'
