- img_proc: true
  md: '# Processes And How Unix Handles Them


    All the system processes are created when the system boots up, and remain alive
    until the system is shutdown. The rest of the processes in the output of the ps
    -ef-command, either belong to the users or the applications that they are executing.


    # Running A Process in the Background:


    There are some tasks that are time-consuming, and require no input from the user.
    If these tasks are executed normally, the user may have to wait for a long period
    of time before the task is completed, to resume the next task. A typical example
    of such a task is sorting a huge file and redirecting its output to another file
    on disk. The sorting operation requires a considerable amount of time and the
    user cannot resume any other task till this task is completed.


    But when you''re working with Unix, you can break these limitations the user can
    run such processes in the “background” and resume other tasks in the “foreground”.
    To assign a process to the background and at the end of it, place the ampersand
    (&) symbol. Simply type the command and place the & symbol. The process will start
    executing in the background and you will instantly see a number followed by the
    Shell prompt. This number is the process-id of the process that you just assigned
    to the background.


    If you have a task that exclusively requires user-interaction, in the foreground,
    and you want a task to be urgently executed, you can now do it straightaway from
    the Shell prompt. Without waiting for the first task to terminate. Incredible.
    And most convenient too. Let''s get started right away.


    ```

    $ sort -df massivefile > sorted.files

    13579$

    ```'
  merge: -1
  pgno: 290
- img_proc: true
  md: '# Working With Unix


    The task is now assigned to the background leaving the foreground all clear for
    the user. It can’t be that easy, can it? You must be on the lookout for some ‘catch’
    somewhere. Well, you may just be right. There are a few minor hitches.


    +   1. A process assigned to the background does not return any success or failure
    message when it terminates. One has to keep using the ps command to keep track
    of it.


    +   2. It is good practice to re-direct the output of a background process to
    a file. Otherwise, it will be flashed on the screen, no matter what you may be
    doing at the time.


    +   3. Too many background processes will increase the system load and degrade
    system performance. So don’t go overboard with this facility, or you’ll soon find
    your foreground tasks running slowly.


    +   4. If you run a background process and log out of the system, without checking
    its status, the process will be unceremoniously terminated, since all processes
    are linked to the Shell which dies when you log out. The remedy for this is the
    nohup command which will be dealt with in the next section.


    # No Hangups: The “nohup” command


    This command assumes a great amount of importance when it comes to background
    processes. Unix provides the nohup command to ensure that your background process
    is not killed or terminated when you log out of the system.


    This command comes in handy when Unix users leave jobs to be executed at night
    so that the output is available the next morning. Leaving the system without logging
    out, would not only be most unprofessional but also very dangerous.'
  merge: -1
  pgno: 291
- img_proc: true
  md: 'This makes the **nohup** command very useful and safe to use. Start up a background
    process using the **nohup** command, log out of the system, and leave without
    a worry.


    To use the **nohup** command, involves no hangups at all. Just place the word
    **nohup** before the command, and the & at the end of a command, to signify that
    the process should be a background process.


    ```

    $ nohup sort -d bigfile > file.srt &

    13772

    $

    ```


    There’s one crucial point we have to discuss about the **nohup** command. Its
    output has to be redirected to a file, for when you log out, there’ll be no terminal
    left to display the output to. In case you forget to specify the output filename,
    the **nohup** command wisely creates a file itself and displays the message:


    ```

    $ nohup sort -d bigfile

    15972

    $ Sending output to nohup.out

    ```


    The **nohup.out** file will be created in the current directory and will contain
    the result of the sort operation.


    When you use the **nohup** command in a pipeline, take care that every command
    in the pipeline is preceded by **nohup**. This ensures that all the processes
    in the pipeline remain alive, after the user logs out, because, even if one process
    dies, the entire pipeline will collapse.


    ```

    $ nohup cat bigfile | nohup wc | nohup sort -n

    numbers&

    33452

    $

    ```'
  merge: -1
  pgno: 292
- img_proc: true
  md: 'In this manner, the nohup command taps the power of Unix, in the absence of
    both a user and his terminal. and its implementation is refreshingly simple. That''s
    power and humility for you.


    # Parents And Children: One Happy Unix Family


    A process is said to be ''born'' when it starts executing and ''dead'' after it
    terminates. At this rate, the mortality rate for processes in Unix is quite low.
    Though we must admit that the “daemons”, due to their obvious supernatural powers,
    manage to live long as the system is alive. Others live and die. And nobody gives
    it a damn.


    Very much like life starts it. The new process is called the ‘child’ process,
    whereas the process that starts it, is called the ‘parent’. A ‘parent’ may have
    multiple children but a child can have only one parent. That''s the tragedy of
    the Unix family. It''s always a one-parent family. But all said and done, it''s
    a happy family.


    A child process, once started, may in turn ‘spawn’ new children. And though one
    never generally speaks of a ‘grandparent’ of a process, it is possible to trace
    the ancestry of any process, right to the point where the system was started.'
