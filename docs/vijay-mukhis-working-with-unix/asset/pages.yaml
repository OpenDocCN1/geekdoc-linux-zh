  md: 'These files will be printed with the date and time, and line numbers, along
    with the user-defined header, which contains the user’s LOGNAME.


    With the "lp" command, we strongly recommend that you use the "-c" option along
    the "-w" option to ensure that your files are copied as soon as you request printing
    and that on completion of your print job, a message will be written onto your
    terminal or mailed to you, if you are not logged in.


    # Determining the Status Of Your Print Job: The "lpstat" command


    The "lpstat" command (for lp status) displays the status of all your print jobs.
    If you execute this command without any arguments, the "lpstat" returns information
    about your own print jobs.


    ```

    $ lpstat

    lp-38 user1 248 Apr 21 10:26

    lp-39 user1 905 Apr 21 10:33

    $

    ```


    The first field is the request-id, followed by the lname of the user who assigned
    the request. Next, is the size of the print job in bytes (the sum of the size
    in bytes of all files dispatched for printing), and finally the date and time
    when this request was made.


    The "lpstat" gives a variety of information about the "lp" print services. This
    information can be derived, using the various options of the "lpstat" command.


    Let’s take a shot at these various options. To obtain information about print
    jobs submitted by all other users, use the "-u" option.'
  merge: -1
  pgno: 440
- img_proc: true
  md: '# Working With Unix


    ```

    $ lpstat -u

    p-38 user1 248 Apr 21 10:26

    lp-39 user1 905 Apr 21 10:33

    lp-41 root 2790 Apr 21 10:44

    $

    ```


    You can see your own print jobs as well as those submitted by other users like
    root. This information can help you determine when your job will be finally completed.
    To obtain information about print jobs submitted by particular users, they can
    specify their names after the “-u” option.


    The “-o” option, coupled with the “-l” option, gives a more detailed output with
    regard to the print jobs submitted by other users.


    ```

    $ lpstat -o -l

    lp-42 root 187 Apr 21 12:13 queued for 1lp

    lp-38 user1 248 Apr 21 10:26 queued for 1lp

    lp-39 user1 905 Apr 21 10:33 queued for 1lp

    lp-41 root 2790 Apr 21 10:44 queued for 1lp

    $

    ```


    This command shows that the jobs submitted by the users have all been queued up
    for completion by “lp”.


    The “-r” option displays the status of the print scheduler “lpsched”.


    ```

    $ lpstat -r

    sched is running.

    ```


    The “lpsched” is at the heart of the “lp” print services. We will discuss the
    various noteworthy aspects of this scheduler in the following section.'
