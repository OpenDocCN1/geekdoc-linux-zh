    # Multiple Floppy/Tape Backups:


    Backups of Unix files are seldom restricted to a single floppy or tape. The number
    of system files is so large, that backing up all the files would consume several
    boxes of floppies or tapes.


    The “tar” command incorporates utilities to meet this demand. The “-k” and “-e”
    function modifiers were designed with this need in mind. The “-k” option ensures
    that the “tar” command prompts for additional floppies or tapes, when the existing
    archive is full. Included with the option is the volume size of the archive, in
    kilobytes. Since we are dealing with 1.2MB high density floppy disk, we have specified
    the block size as 1200.


    The “-e” option ensures that no single file is “split” across any two successive
    disks or tapes. It is always a good idea to use both the “-k” and “-e” options
    together. Since the volume of backups to be taken is very large, we also include
    the “-b” option to specify the block size. The default value is 1 and the maximum
    possible is 64.


    ```

    # tar -ckveb 1200 20 /etc/*

