- img_proc: true
  md: 'We''re done with backups. We have outlined above some of the most powerful
    utilities that Unix incorporates for backing up data. There are two utilities
    called “backup” and “restore” which can be used through the “sysadmsh” menu-driven
    program, which is described in a later chapter.


    # Printer Management:


    Unix provides excellent tools for controlling printers and for spooling out data.
    The system can be configured to allow attachment of a single printer for all users,
    or configured so that the Unix machine acts as a central print server driving
    several hard-copy devices of different types.


    In a multiuser operating system, no user can expect that a job he dispatches to
    the printer, is printed immediately. Since there are several users, the system
    enforces discipline by using a print queue. When each user dispatches a print
    job, it is placed in a queue and printed according to precedence. Where there
    is a queue, there must be a scheduler that extracts jobs from the queue and schedules
    them for completion.


    In this section, we will deal with the mechanisms, utilities and commands linked
    to printing. You can discover one more dimension of the superlative device management
    in Unix.


    The “pr” Filter: Ideal For Printing  The “pr” filter prints files on the standard
    output. Well, so does the “cat” command. So what''s the difference?


    While the “cat” command is used to concatenate and display files, the “pr” command
    is useful in paginating and columnizing the output of files. Any file sent to
    the printer is generally routed through the “pr” command to enhance the printout
    in several ways.'
  merge: -1
  pgno: 435
- img_proc: true
  md: '# File Systems And Device Management


    The “pr” command produces an output that is separated into pages, and on each
    page, it prints the page number, date and time, and the name of the file. In addition,
    the “pr” command offers a whole range of options that allow the user to select
    the format in which the file must be printed. Line numbers, page length, number
    of columns, user-defined headers and the works.


    Which is why, before dealing with printers, it’s a real good idea to get acquainted
    with “pr”.


    The “pr” command offers several options to the user, options that enable him to
    select the output format of the file to be printed.


    Modern, state-of-the-art tools are generally provided in all contemporary word-processors.
    Come to think of it, Unix provides a powerful editor in the form of vi, a speller
    in the form of “spell” and when it finally comes to printing, the “pr” command
    has all it. It lacks all the menus, finery and gloss. The utilities are as powerful,
    or sometimes more powerful, than most modern day word-processing packages.


    The best way to get the hang of the “pr” command, is to use it to see the output
    on the terminal. Then, after you’re finally ready, you can redirect the output
    to the printer.


    Let’s take the “pr” command by itself first. We had a small text file called “Appointments”
    in our HOME directory.


    ```

    $ pr Appointments

    Apr 17 20:17 1992 Appointments Page 1

    MEETINGS : BOSS 9:00 AM

    : DIRECTORS 11:15 AM

    : MANAGER LUNCH

    PRESENTATIONS : MONTHLY SALES

    REPORT 4:30 PM.

    ```


    409'
