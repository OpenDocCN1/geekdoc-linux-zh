    0 or ^ : Moves to the beginning of a line


    #$ : Takes you to the end of a line


    #G : The Goto Command. To go to the second line of the file, for example, type
    2G.


    L : Takes you to the last line in the file.


    All the commands marked with the "#" can be invoked with the number preceding
