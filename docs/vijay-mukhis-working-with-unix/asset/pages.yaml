- img_proc: true
  md: '# Size Of Files:


    # The “ulimit” command


    Most files in Unix are rather small and occupy disk space of a few tens of blocks.
    But sometimes processes go awry, or failing applications incorrectly write to
    disk and occupy several megabytes of space. To ensure that such processes do not
    harm existing file systems, the Unix system provides the “ulimit” (for user limit)
    variable, which contains the value of the largest file that can be created within
    the file system.


    ```

    $ ulimit

    2048

    ```


    This implies that no file larger than 2048 blocks can be created within any file
    system on disk. If by chance, a file exceeds this limit, its size will be curtailed
    to the value specified by “ulimit”, and the program creating the file will abort.


    The default “ulimit” is set within the kernel, though it can be changed by individual
    users. In the best interests of the system, users are not permitted to increase
    this limit, but they may decrease it, if they wish. The superuser, of course,
    is an exception to this rule.


    One realize that 2048 blocks of disk space is quite substantial. Let''s say you''d
    like to limit your file size to a maximum of 1024 disk blocks. To lower the existing
    limit, you can specify the maximum size permitted, as:


    ```

    $ ulimit 1024

    $

    ```'
  merge: -1
  pgno: 392
- img_proc: true
  md: 'Now no file will exceed 1024 blocks of disk space. However, this change will
    be active only for the current session and the system will return to its default
    value when you log out.


    For the “ulimit” to be applicable to all users, the System Administrator will
    generally specify the limit in the /etc/default/login file so that it becomes
    active for all users when they login.


    # Guidelines for Hard Disk Management:


    There are a few general guidelines that System Administrators should follow to
    ensure that there is safe and optimum utilization of the hard disk from the system
    point of view.


    +   1. There should be at least 10 percent of disk space empty on any file system
    on the disk. System Administrators should use the "dfspace" Shell Script as often
    as possible, to ensure that all file systems have at least 10% free space. Unwanted
    files and directories should be regularly deleted.


    +   2. Users should use the “tmp” directory to store all temporary files, since
    all files in this directory are deleted when the machine boots. Thus all temporary
    files, outputs of background processes and so on, which hold little long-term
    importance, should always be kept in this directory.


    +   3. Files called “core”, which contain memory dumps or snapshots of the memory
    contents often accumulate in several directories, when users commit erroneous
    system calls or other system errors occur.


    The System Administrator should regularly search for such files using the “find”
    command and remove them. An example of this effect has been provided when we covered
    the “find” command.'
  merge: -1
  pgno: 393
- img_proc: true
  md: 'If the space on disk becomes full, it can lead to a system crash or simply
    bring the system to a standstill. Urgent steps to recover the system such as booting
    the system from a floppy disk and removing unwanted files, should be initiated
    to restore the system to normality.


    # Floppy Disk Management:


    Floppy disks are not of great use to Unix users except perhaps to take backups
    of valuable files from the system. Unix generally dealls with mass storage devices
    such as magnetic tapes and fixed disks.


    However, contrary to expectations, Unix knows and understands a wide variety of
    floppy disks in various densities and storage capacities. Most Unix installations
    today, are equipped with a 5 1/4 inch disk drive that supports a 1.2MB high density
    diskette. This coupled with a tape drive, would be the ideal external drive configuration
    for a Unix machine. While the tape drive can be used during installation and to
    take large volume of backups, the floppy disk drive can be used by individual
    users to take backups.


    Like in all other operating systems, in Unix too, a floppy disk must be formatted
    before it can be utilized. Floppy disk formats in Unix are not the same as in
    other operating systems such as MS-DOS. All disks used on a Unix machine, must
    be formatted under Unix only.'
  merge: -1
  pgno: 394
- img_proc: true
  md: '# Working With Unix


    Once a diskette is formatted, Unix provides two ways to use it. First, you can
    create a file system on the floppy disk and use it just like a hard disk. This
    means you can create directories on it and "cd" across directories just like in
    the normal disk file system. To do this, you must first create a file system on
    the floppy and "mount" this file system at a specific place or "mount point" on
    the system. The mount point generally lies within the root directory. Unix provides
    a default mount point in the form of "/mnt". When you have done this, you can
    use the floppy just like any directory in the system.


    The second option specifies that you may choose to access the floppy disk using
    the "raw access" method. Disks used with the raw access methods do not have file
    systems associated with them and you cannot use them like a hard disk. However,
    this form of access permits you to create more than one diskful of data; when
    one disk fills up, you can continue on another disk. The raw access method is
    generally used during backing-up or archiving of data.


    Another complication may arise if you wish to make the disk bootable. Unix machines
    are, normally, never booted from a floppy other than when there has been a system
    crash. A bootable disk in Unix must contain the Boot block and an executable copy
    of the Kernel. Just like in DOS, the option to make a disk bootable must be taken
    while formatting the disk itself.'
  merge: -1
