    his group and others, are assigned only a read and execute permission (4+1). This
    implies that others can access your directory, and execute files from it. But
    they can''t create new files in your directory. Also, when it comes to accessing
    files from your directory, the individual file permissions assigned by you come
    into force, thus making the entire security formidable.


    If the system **umask** is set to 000, all files will be created with the default
    permission **rw-rw-rw**, and all directories as **drwxrwxr-wx**.


    To set your own **umask**, you can use the **umask** command followed by the mask
    that you would like to set. To set a generous **umask** of 000, type:


    ```

