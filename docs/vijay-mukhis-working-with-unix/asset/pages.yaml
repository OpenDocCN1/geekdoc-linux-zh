  md: '# Creating Links To Files:


    From the basic theory of file systems, we know that when a file is created, Unix
    must find a free inode and allocate it to the new file. Unix, then, saves the
    inode number, alongwith the filename, as an entry in the appropriate directory.


    The correspondence between a file and the inode is called a link. It is this link
    that allows you to call the file with a name of your choice instead of specifying
    inode numbers. Actually, it is the inode number and not the name of the file that
    identifies it. The only use that Unix has for a filename is to find a directory
    entry it needs, in order to obtain the inode number.


    Let''s say you create a file called "project.c" in a directory called "c-programs".
    From the above discussion, it is apparent that the directory should contain the
    inode number of the file. We can verify this fact by using the od command that
    displays any given file in the octal format. We can use this command to display
    the contents of the "c-programs" directory (since a directory is also a file)
    and check whether the inode number of "project.c" is indeed present in this listing.


    The ls -l command, when used with the -i option, displays the inode number of
    the files in the current directory. We can use this command to obtain the inode
    number of the file "project.c".


