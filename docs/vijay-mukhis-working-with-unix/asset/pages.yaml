  md: '# ForeWord


    "Your great great grandfather was a dim-witted, foul-mouthed, crooked-legged fool,
    with matted hair and a squint. And if anybody had any sense, he would have been
    thrown into a dungeon with compulsive violinist who never learned to play the
    violin. So there!!" A foot stamped, four frustrated tears, a tantrum.


    That''s a Unix discussion for you. Milder than the mayhem and murder that some
    other debates on Unix attract.


    Anne Boleyn, the controversial queen consort of Henry VIII, Pamela Bordes and
    Saddam Hussein plummet way down the ladder of controversy compared to the stormy
    Unix. Arguments, debates and blood are more common in Unix than the millions of
    commands that dot its seas.


    Unix is portable. No, it''s not. Yes, it is. Unix is elegant. No, it''s not. Yes
    it is. Unix is the best operating system around. No, it''s not. Yes, it is. Unix
    is sweet. No, it''s not. Yes, it is. The issues range from highly sensible to
    highly irrational. And the notorious sculpture carved by Kerningham and Ritchie
    keeps collecting gore and blood with every breath it draws.


    Unix was doomed to be special right from the beginning. Bell Laboratories and
    other like-minded corporations sat together to build the greatest operating system
    of all times. But the ambitious project was almost aborted mid-way. Lack of funds,
    said the powers-that-be with an indifferent shrug of their broad shoulders. That
    wasn''t reason enough for the two bearded and unkempt men who had a dream, a vision
    of the best operating system that the Universe had witnessed.'
  merge: -1
  pgno: 10
- img_proc: true
  md: 'Kerningham and Ritchie stole an equally decrepit AT&T cubicle, inconspicuous
    like themselves. Pen and paper in hand had etching the world''s greatest operating
    system. There was no computer, just an idea and a vision. The beginning of controversy.


    Unix was heralded. The air was rent with stupefied cries. And as brave souls wandered
    in unchecked, the urge to tamper with it grew. Unix was unorthodox. There were
    no boundaries, no claustrophobic laws. Unix belonged to anybody who adopted it.
    And so there were many versions of the operating system as there were adventurers
    in the world.


    The smoldering flames could not ask for better fuel. The fires raged.


    Nevertheless, the world filled up with groks. Courageous, different, intelligent
    and awe-inspiring groks. With their strange lingos and stranger powers of groking.'
  merge: -1
  pgno: 11
- img_proc: true
  md: 'Groking was that they stole the Martians taught the two year old earthling.
    For 20 long years they nurtured him with love and care and the warm art of groking.
    The mentally advanced Martians knew more about warmth, sensitivity and psychology
    than the stubborn earthlings. And the Martian citizen of Earth was brought back
    by the macho Earth-men as a guinea pig. War began between the Martian-minded earthlings
    and the Earth-minded ones. It continued raging until the teenager flailed his
    arms in the Martian art of groking. Ships and planes exploded like atom bombs.
    The native alien won the war against his strange brethren.


    Robert Hinier''s classic sci-fi,"Stranger in a Strange Land" was the inspiration
    behind that most-famous of all Unix words - groking. The Unix expert with his
    bag of mumbo-jumbo and his strange lingo soon became a fascinating grok. He flailed
    his arms, he squinted at the machine, he spoke a strange dialect. He was a stranger
    in strange land.


    Unix, the story of the kidnapped Martian-Earth kid with his supernatural powers,
    bravery and unfathomable depths... and one person comes to mind. Pravin Gandhi
    is the''s world today. Like the 20-year old grok who came from Mars, Pravin Gandhi
    waves his arms and explodes staid and old myths, rules and laws and patterns that
    rob the human mind of its freedom. The freedom to explore and the freedom to create.


    Pravin Gandhi, they say, can churn out ideas faster than a laser printer can print
    them. We know a lot about Pravin Gandhi, yet we don''t know too much. There''s
    always one more side of him, one talent that you haven''t seen yet. Perhaps, Unix
    could add another word to its dictionary, "prarok" for Pravin Gandhi-like magnificence.
    For greater expertise than a grok.'
