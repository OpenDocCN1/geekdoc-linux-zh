    There’s a small anomaly with the simple use of this cat command. If “file1 does
    not exist”, cat displays a misleading error message of the type:


    cat cannot open file1


    This message means that a file by name does not exist at all, or if it does, it
    does not have the requisite read permission.


    The basic purpose of the cat command is to “concatenate” multiple files into a
    single file. To merge the contents of “file1” and “file2” into a single file called
