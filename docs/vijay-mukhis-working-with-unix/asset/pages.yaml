- img_proc: true
  md: 'In the good old days, the mailman was greeted with cheers and quickly surrounded
    by a crowd of anxious people waiting for messages from their loved ones. But the
    Unix mail facility changed all that. A few wires, a port and a power-packed operating
    system did so much damage that it made the whole P&T Dept. redundant. Governments
    recorded a sudden loss in revenue and the spiraling figures were appalling. Alarm
    bells were ringing in the echelons of power and the "electronic" age had dawned
    on civilization.


    Mail, in the computer world, refers to textual information that can be electronically
    conveyed from one user of the system to another. Therefore mail is often referred
    to as electronic mail or simply "e-mail" for short. A portion of mail that was
    sent or received at one stretch is referred to as a Message.


    The Message maybe a single line of text or a program containing several hundred
    lines of code. The only limitation in this context is that the conventional mail
    system of Unix can accept only textual ASCII files that are acceptable to the
    standard editors. Binary files executable and other special files cannot be sent.
    Mail can edit, delete and review messages before sending them. The recipient of
    mail can save, delete and respond to messages. Just like the mailman drops your
    mail into your own mailbox, all incoming mail in Unix is stored in a standard
    file for each user called the mailbox for that user. Generally incoming mail is
    stored in a file in the /usr/mail directory, with one file for each user. This
    mail file is called your mailbox but you can create additional mailboxes as you
    read and save mail into them.


    The mail tools will concatenate multiple messages sent to the user into this single
    file, but will display them one at a time as though they were derived from separate
    files.'
