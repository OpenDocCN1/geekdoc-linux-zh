    # Spotting the Ten Differences:


    Comparing files to find out what’s the same and what differs is often done to
    find out the validity of backup files in a system. Unix provides simple commands
    that highlight the similarities and differences in files in a jiffy. The diff
    and the cmp commands can be put to good use for this purpose.'
