- img_proc: true
  md: 'When used without any arguments, "du" descends the directory tree in the current
    directory and reports the number of blocks used by each directory including the
    current directory and the subdirectories within it. When invoked without any arguments,
    this command deals with directories only.


    ```

    $ du

    13      ./temp

    2       ./Firstdir

    20      ./crucial

    170     .

    ```


    We used the "du" command in our current directory and it instantly reported the
    number of blocks used by that directory (denoted by ".") and the subdirectories
    that lie within. Just like in the "df" command, these blocks too, are of size
    512 bytes.


    From the above output, we conclude that the current directory may have the largest
    number of files among all its subdirectories.


    There are a few important options that permit you to obtain the number of blocks
    used by individual files and a lot more.


    To generate blocks used by individual files in any specified directory, we can
    use the "du" command with the "-as" options and specify the full path.


    ```

    $ du -as ./crucial

    19      ./crucial/lan-proj.c

    20      ./crucial

    ```'
