  md: '# 1


    # Unix: The Fundamental Principles


    # How It All Began :


    It was the late 1960s. The place was AT & T Bell Laboratories. An academy that
    fostered creativity and patronized fantasies.


    An organization which nurtured dreams, however bizarre and uncanny. Where there
    were no rules, no bottom lines, no deadlines. Only a relentless search that had
    a concise beginning but no tangible end. Where eccentric geniuses spent decades
    in the quest of a phantom, an apparition that their prolific minds had conjured.'
  merge: -1
  pgno: 28
- img_proc: true
  md: '# Working with Unix


    Sure enough, within a few years of its founding, Bell Laboratories churned out
    the maximum number of Nobel laureates for any research organization anywhere on
    the globe. The seeds of research sowed in fecund minds were bearing fruit. Funds
    poured in from the Congress, sponsoring research on projects of national interest.
    Bell Laboratories blossomed and the dreams and the dreamers multiplied.


    Somewhere in the dark, sombre portals of Bell Laboratories an obsolete PDP-7 computer
    atrophied from disuse. Ken Thompson had an unfulfilled dream. A whirlpool of ideas
    and visions was brewing in his mind. Like the lone crusader, he took up his arms
    and set forth to divert the course of history.


    And one crusader met another who was overwhelmed by his cause. Dennis Ritchie
    joined hands with Ken Thompson and the first few lines of Unix were scribbled
    into a dull monitor of an archaic computer.


    Even Dennis Ritchie was no ordinary man. He had pioneered research on another
    operating system christened MULTICS (Multiplexed Information and Computing Service)
    for its unique multiuser capabilities. This operating system was one of the earliest
    interactive multiuser operating systems. However the top brass at Bell Laboratories
    considered it inadequate, and very late in the day, further research was scrapped.
    But Ritchie couldn''t let go. His ''baby'' was all that mattered and someday he
    would prove its efficacy and prowess.


    The name ''Unix'' was a dig at MULTICS and the latter exerted a strong influence
    on its conception and design. Unix code was written in the assembly language of
    the PDP-7 and was, consequently, machine dependent. Ritchie and Thompson worked
    quietly on Unix for several years. After Rome was not built in a day.'
  merge: -1
  pgno: 29
- img_proc: true
  md: '# Unix: The Fundamental Principles


    Their work on the first version allowed them to move it to a more advanced PDP-11
    computer for a second version. But there was one hurdle they had to overcome.
    It had to be portable. It had to work efficiently on diverse hardware platforms
    and that was not to be, unless the mold of assembly language was broken.


    For Ken Thompson it was mind over matter. With a will that was as firm as the
    proverbial Rock Of Gibraltar, he went on to create a whole new programming language
    which he dubbed “B” and re-wrote the Unix code using the new-found freedom that
    it offered. A super-human task that has no precedent in the annals of computer
    history.


    The “B” language was subsequently modified by Dennis Ritchie and renamed the “C”
    language with all due respect to the English alphabet.


    Almost the whole Unix kernel was recoded in C language by 1973 and elementary
    text-processing utilities with cryptic aliases like “troff” were already rolling
    out. Unix had, by now, captured the imagination of the other scientists at Bell
    Laboratories and major enhancements were introduced with amazing regularity.


    Proud of its rapid progress, AT&T released several copies of the Unix system to
    universities who quickly lapped them up and began their own research. Among the
    most prominent universities to have conducted an in-depth research on Unix, was
    the University of California at Berkeley. Ken Thompson was a visiting faculty
    member in the university and very soon he earned the respect and reverence of
    his fortunate students and colleagues, and aroused an immense interest in hisoperating
    system of the future’.'
  merge: -1
  pgno: 30
- img_proc: true
  md: '# Working with Unix


    An innovation of the Unix system was designed at the University of California
    at Berkeley and released as the BSD (Berkeley Software Distribution) version of
    Unix. The BSD version stood on an equal footing with AT&T versions and users,
    to this day, either belong to one camp or another.


    By the year 1980, Unix had been completely re-written in C and could be ported
    onto virtually any computer with the power to support it. In the mid-eighties,
    the era of workstations arrived. Unix came to the fore with these powerful machines
