  md: '# USEFUL GENERAL PURPOSE COMMANDS


    The Unix operating system is vast and colossal. And after a certain stage, it
    becomes impossible to classify and categorize its commands. There are hundreds
    of commands that are useful in a million, real-life situations. So where does
    that leave a Unix book?


    People writing books on subjects as profound and extensive as Unix, came up with
    a novel idea. They called it the "GPC Solution". From then on, Unix books have
    something called a General Purpose Commands (GPC) chapter. Such a chapter would
    serve to accommodate those all-important and simple commands that defied explicit
    and precise classification. The reader got the requisite knowledge, and the writer,
    fewer white hairs. Everybody was happy.'
