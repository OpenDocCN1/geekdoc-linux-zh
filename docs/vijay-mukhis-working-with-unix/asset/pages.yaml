  md: '# SYSTEM SECURITY


    A multi-user operating system is like a jungle where there is only one basic rule:
    survival of the fittest. Where intruders, like wild beasts, are always prowling
    around, hacking away at all that is within reach, your data being the prime target.


    It''s a real life situation. In today''s world, where the rat race is more compelling
    than ever before, security has become a key issue in all multi-user operating
    systems. Unix, once again, was at all the forerunner in system security. Its security
    schemes provided guidelines and set standards for other multi-user operating systems.
    And don''t forget, its security was designed as far back as the 70''s. But it
    continues to be effective and powerful to this day.'
  merge: -1
  pgno: 350
- img_proc: true
  md: '# Working With Unix


    The key to providing security in any operating system is an awareness among the
    users. Of their rights, privileges and prerogatives and how to use them. This
    awareness, in itself, is most important. Each user''s security is as powerful
    as he makes it out to be. If files are accidentally deleted or important files
    overwritten, he alone is to blame. The security that he built around his data
    was too weak.


    In this chapter, we learn the tactics of war. But with a difference. Instead of
    learning how to attack others, we''ll learn how to defend our own domain. We will
    shed some light on the logistics that will help you array your forces in order,
    and strategies that will help you emerge victorious on the day and hour of reckoning.
    Amen.


    # Password: The Shield


    The first and most formidable fortress that the enemy has to scale and conquer,
    is the password. The ultimate shield that holds back the most daring and dangerous
    foes.


    We have seen before how one has to specify both, a valid login and the correct
    password for that login, before one is given access to the system itself. Most
    of the intruders fail at this stage itself and beat a hasty retreat. Unless you
    have been naive enough to share your login and password with someone else.


    All the critical information about logins and passwords is stored in a simple
    database file /etc/passwd. This file is readable by all users. Don''t panic. This
    does not mean that all of them can read your password. A short listing of the
    /etc/passwd file is provided below.


    ```

    $ cat /etc/passwd

    root*:0:1:Superuser::/

    daemon*:0:1:1:System daemons:/etc:

    bin*:2:2:Owner of system files:/usr/sys:

    sys*:3:3:3:

    ```


    324'
  merge: -1
