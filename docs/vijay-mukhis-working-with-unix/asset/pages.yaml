    The next most important level of security in Unix, is at the file level. We have
    already had a preliminary discussion on file permissions, but let''s take the
    plunge this time and check out what lies deep down.


    # How File Permissions are Assigned:


    One of the most important security considerations in Unix is a clear understanding
    of how file permissions are assigned and how they can be altered. We have seen
    before, how each file is assigned a nine bit field for permissions given to the
    “owner”, the “group”, and “others”. Each of these entities may be assigned a “read(r),
    “write(w)” or “execute(x)” permission.'
  merge: -1
  pgno: 357
- img_proc: true
  md: 'For example, a -rw-rw-rw permission implies that the owner (the creator of
    the file), the group to which the owner belongs, and others, are all assigned
    the read-write permission to the file. These permissions are visible in the output
    of the long listing of files using the ls -l command.


    File permissions, in Unix, are assigned numerical values from 0 to 7. Individually,
    however, they have the following values:


    ```

    Read Permission : 4

    Write Permission : 2

    Execute Permission : 1

    ```


    Thus, for a file that has a permission field like -rw-rw-rw-, the permissions
    are said to be 777 (4+2+1) for the owner, group, and others. Correspondingly,
    a file with permissions -rw-rw-rw is said to have a 666 permission.


    A zero value in the permission field is regarded as a complete denial of the read,
    write and execute permissions. Thus, if a file has the permission -rwx------,
    it grants all permissions to the owner, and none at all to the group and others.
    Such a file would have permissions of 700.


    The following table summarizes the above discussion.


    | Owner/Group/Others | Read(4) | Write(2) | Execute(1) |

    |---|---|---|--|

    | 0 | No | No | No |

    | 1 | No | No | Yes |

    | 2 | No | Yes | No |

    | 3 | No | Yes | Yes |

    | 4 | Yes | No | No |

    | 5 | Yes | No | Yes |

    | 6 | Yes | Yes | No |

    | 7 | Yes | Yes | Yes |'
  merge: -1
  pgno: 358
- img_proc: true
  md: '# Default Permissions For File Creation :


    Ideally speaking, when you create a file, Unix should question you about what
    permissions you''d like to set for the file. That would be both time-consuming
    and arduous. But file permissions are at the heart of system security. So Unix
    can''t afford to ignore them at any cost.


    To overcome this hurdle, Unix has incorporated into its Shell, what is called
    a "file" creation mask. This is a system variable called umask (for user file-creation
    mask). It contains the permissions that the user would like to set, and everytime
    the user creates a file or a directory, permissions are assigned to it, depending
    upon the value of this variable.


    The term ''mask'' implies that this variable tells Unix which ''mask'' or hide.
    Thus the ''umask'' contains a value that tells Unix of the three permissions are
    to be ''denied'', rather than granted.


    A user is permitted to set his own file creation mask using the umask command.
    You can determine the value of your current umask, by using the umask command
    without any arguments.


    ```

    $ umask

    022

    ```


    The result of this command is three octal digits that refer to the permissions
    denied to the owner, group and others in the system. Note that, for the owner,
    zero or no permission is denied, whereas for both, the group and others, a write
    permission (2) is denied. The system-wide default permissions for a file are 666,
    so that the file will have the permissions -rw-rw-rw.'
  merge: -1
  pgno: 359
- img_proc: true
  md: 'Now the number that umask contains is subtracted from the default system-wide
    permissions and the resultant number is assigned to the created file as its permission.


    ```

    6 6 6

    - 0 2 2

    ---

    6 4 4

    ```


    Therefore, the permission assigned to the newly created file will be -rw-r--r-.


    The system-wide default permissions for a directory are 777. This implies that
