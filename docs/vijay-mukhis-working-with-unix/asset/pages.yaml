    ```


    We created our own files and directories within this newly mounted file system.
    The floppy disk file system acted like a hard disk file system in all ways. You
    could never tell the difference.


    One of the most important points to be noted about a file system, mounted from
    a floppy disk is, as follows: Never remove the floppy disk from the drive, unless
    the file system has been unmounted. So before you take your disk home at the end
    of the day, make sure you inform the System Administrator to “unmount” your file
    system.


    To mount a file system at a mount point, other than the default, you can specify
    the path of the mount point as follows:


    ```

    # mount /dev/fd096ds15 /usr/floppy

    ```'
