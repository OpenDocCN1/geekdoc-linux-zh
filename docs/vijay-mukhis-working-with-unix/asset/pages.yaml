    # The “grep” command with pipes:


    We know that the ls command has 23 options in all, but there''s no option that
    lists the names of only directories in the user''s current directory. This is
    among the major flaws of the ls command.


    Let''s figure out the manner in which we can display a listing of only the directories
    in the current directory. The logical approach to this problem is that we know
    that a directory in a long listing begins with the letter “d” followed by the
    permissions for the directory. We have already learnt how we can search for patterns
    at the beginning of each line using the grep command. So let''s get down to it.


    ```

    $ ls -l | grep ''^d''

    drwx-- 2 userl group 32 Mar 17 15:34 Firstdir

    drwx-- 2 userl group 176 Mar 10 14:14 temp

    $

    ```'
