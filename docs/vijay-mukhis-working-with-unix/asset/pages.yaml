  md: '# Working with Unix


    As messages are read, they are marked to be moved into a secondary file for storage,
    unless specific action is taken, so that these messages need not be seen again.
    This secondary file is called the mbox and is created in the user''s own home
    directory. These messages remain in the secondary file unless forcibly removed.


    This just goes to show how efficient Unix mail systems are. Even messages that
    have already been read are not eliminated but stored in a file for further reference.
    The ease and convenience offered by Unix mail became an exemplary standard for
    communication utilities in other multi-user operating systems.


    On the command line, the mail command takes options preceded by a minus sign and
    all other arguments are assumed to be the recipients of the mail.


    Now without further ado, let''s get down to the command itself. Let''s first learn
    how to send mail to other users of the system. After all, morality dictates that
