- img_proc: true
  md: '# PROCESSES AND HOW UNIX HANDLES THEM


    The most important concept in modern operating systems is time sharing. Profound
    as the term may sound, it''s rather simple to understand. Time sharing involves
    having multiple programs in memory at the same time that share the CPU among them.
    This scheme improves the overall efficiency of the computer by increasing the
    utilization of the CPU and consequently the throughput.


    The concepts of time sharing and multitasking in Unix can be generically understood
    whilst dealing with processes. By itself, the hundreds of programs that come with
    Unix are not processes. A program is elevated to the status of a process only
    when it starts executing. Therefore a process is defined as the instance of an
    executing program.'
  merge: -1
  pgno: 280
- img_proc: true
  md: '# States of a Process:


    Since Unix systems usually have a single CPU, obviously only one process can be
    executing at one time. Thus a major function of the Kernel is to provide control
    and support for the many programs that wish to obtain the CPU at the same time.


    ![](img/2b13e596b1053c0c9f492dfe40dfa70a_281_0.png)


    The most logical approach to this problem is to have a process “scheduler” that
    decides which process should grab the attention of the CPU. It''s like a real-world
    rat race where only the best man wins. There are six states that a process goes
    through in a multitasking time-sharing operating system. The following diagram
    elucidates:


    The first process is “submit”, wherein the process is submitted by the scheduler
    into the process queue according to a fixed priority. After the process is submitted,
    there is a certain time interval where it remains in the queue. This is called
    the “hold” state of the process.'
  merge: -1
  pgno: 281
- img_proc: true
  md: 'When the process was finally the next in the queue to receive the attention
    of the CPU, it was elevated to the “ready” state.


    And finally the big moment arrived. The process gained the attention of the CPU
    and attained the “running” state.


    Each process is allotted a “time slice” of the CPU time for execution. If it manages
    to complete by then, well and good. Or as soon as the time slice of a particular
    process ends, the CPU starts running another process, returns this process to
    the “ready” state and places it back in the process queue. The CPU is said to
    have performed a “context switch” to a new process and all the necessary parameters
    and values of the old process are saved for retrieval when its next time slice
    arrives. This process has to now wait in the ready state till its next time slice.


    Some processes need to break to perform disk I/O. The processor can’t sit around
    waiting for the relatively slow disk I/O procedure. Such processes are placed
    in the “wait” state until I/O is completed and then placed in the “ready” state
    in the process queue when the requisite I/O has been completed. A lesson for them
    to use their CPU time slice better next time.


    A process that has completed executing fully is placed in the “completed” state
    and removed from the process queue.


    Thus we can conclude from the above discussion that Unix is a “pre-emptive” operating
    system where a particular process is only allowed to execute upto the allotted
    time slice of the CPU after which it is placed back in the queue until its time
    slice arrives again. The arrival of the next time slice depends upon the scheduling
    algorithm.'
  merge: -1
  pgno: 282
- img_proc: true
  md: 'This is in contrast to other contemporary operating systems like MS-Windows
    where each process gains full CPU time, until unless it passes control to another
    process. This allows a particular process to monopolize the CPU. Therefore the
    operating system is referred to as “non-preemptive”.


    # Process Status: The “ps” command


    This command displays the processes that are currently active in the system. These
    are the processes that have attained the “running” state with the CPU. The ps
    command also displays additional information about the processes like the process
    name, process id, the terminal number on which the process is active and the time
    that has been utilized by the process since it was initiated. In a nutshell, the
    ps command gives a snapshot of the activity that is going on the system.


    In its simplest form, the ps command by itself displays the information about
    processes active at the user’s terminal only.


    ```

    $ ps

    PID TTY TIME COMMAND

    22267 2c 0:00 sh

    22388 2c 0:00 ps

    $

    ```


    We have two processes running now. The one called sh is the Unix Shell. This shell
    is the Bourne Shell. The C Shell is represented as csh and the Korn Shell as ksh.
    This process is born the minute you login and dies when you log out of the system.
    Throughout your Unix session, the Shell will always remain active.'
  merge: -1
  pgno: 283
- img_proc: true
  md: '# Processes And How Unix Handles Them


    The next process was the ps command itself. The process-ids (PIDs) associated
    with each process are unique and assigned by the system. No two processes will
    have the same process-ids. These PIDs start with 0 when the system is turned on
    and go up to a maximum number of 32767. When the maximum number is reached, the
    counting starts from 0 again. Therefore process ids assigned by the system will
    change when you execute the ps command again. Process-ids are just as important
    as user ids. Just like the system recognizes each user by their user-id, it recognizes
    each process by its process-id. Child processes generally have higher PIDs than
    their parents, but if the parent PID is near the maximum, the number may be recycled
    back to zero and the child may be assigned a lower PID.


    If you want additional information about the processes that are active at your
    terminal, you could opt for a full listing using the -f option.


    The ps -f command will display a full listing of processes and commands active
    at a particular terminal along with a header for each field. Check this out by
    typing:


    ```

    $ ps -f

    UID PID PPID C STIME TTY TIME COMMAND

    user1 22267 1 2 12:48:54 2c 0:04 -sh

    user1 22577 22267 12 15:11:48 2c 0:00 ps -f

    $

    ```


    The UID field displays the user-id as the logname of the user of the terminal.
    The following field shows the process-ids assigned by the system to the processes
    that are currently active at that terminal. The process-ids, as you will see later,
    are most useful when it comes to ''killing'' a process.'
