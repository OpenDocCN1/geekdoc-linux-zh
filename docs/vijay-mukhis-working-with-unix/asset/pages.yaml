  md: '# The Ideal Directory Permission:


    After such a detailed discussion, the question does come to mind: What is the
    ideal directory permission? Well, opinions may differ on this point, but we strongly
    recommend that a user set his directory permission as:


    ```

    drwx-xr- ( Value 754)

