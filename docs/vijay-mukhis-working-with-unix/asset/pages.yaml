    A crucial concept becomes apparent now. Our team was logged in as “user1” on two
    different terminals. That’s possible since we used the same login and shared the
    same password amongst same entity, Unix recognized us as one and both the users
    were working in the same **HOME** directory and sharing the same rights and privileges.


    However, since we were working on different terminals, our “tty” files were different.
