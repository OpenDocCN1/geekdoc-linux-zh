    ```

    $ cpio -icBr < /dev/rdsk/f0q15dt

    ```


    If you wish, you can specify a new name for the file, or simply press the “Enter”
    key to skip this file. You will be prompted in this manner for each file in the
    archive, so for a large backup, the process may become tedious.


    Finally, the “m-” option ensures that the “cpio” command retains the modification
    time of the original file. By default, the file is created with the current time.


    # Plain copies, No archives: The “cpio -p” command


    The “p-” (for pass) option is the third main option after “-o” and “-i-” options.
    This option permits the “cpio” command to make copies of files without making
    archives out of it. Simple, ordinary file copies. This option is especially useful
    in moving an hierarchy of directories across the hard disk. It can be used with
    only certain options like “-v-” (for verbose copy) or “-d-” (for creating a new
    directory, if need) or -u (for unconditional copy) and so on. Options like “-c”,
    etc. will have no meaning since the archive is not being created at all.


    ```

    $ ls | cpio /tmp/mydir

    ```


    The directory “/tmp/mydir” should exist in the first place. Any new directories
    to be created within that, will be created by “cpio”, if you include the “-d-”
    option.'
