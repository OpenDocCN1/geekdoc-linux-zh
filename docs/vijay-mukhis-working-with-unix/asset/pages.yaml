  md: '# Working With Unix


    +   2. It should be changed frequently (at least once, every six months to a year,
    and more often, if necessary).


    +   3. It should be easy to remember, so you don''t have to write it down.


    +   4. No one else should have knowledge of it.


    Now that you know what passwords ideally be, any user''s once, let''s learn what
    passwords should NEVER be:


    +   1. The name of a person, place, or thing; nor should a password be the same
    as any login name, the name of a machine, or the name of any group.


    +   2. A correctly spelt word, street or telephone number, ZIP or postal code;
    nor should a password be a birthday or anniversary of you or anyone you know.


    +   3. Told to any other person, not even for use in an ''emergency''; nor should
    a password be kept unchanged if you suspect someone else knows it.


    # How To Change Your Password:


    Depending upon how the System Administrator has configured the system, the user
    may be allowed to change his own password, or may have one chosen for him. Before
    allowing the password to be changed, the system always requests the user to enter
    the old password. This ensures that no one but the actual user himself can change
    an existing password.'
