    # More Options For “cpio -i”:


    The “cpio” command provides several options to control the reading of files from
    the archive. By default, it will not create the directories needed to rebuild
    the pathnames of the files in the archive. The “-d” option forces “cpio” to create
    the necessary directories needed to rebuild the files in the archives.


    ```

    $ cpio -icdB < /dev/rdsk/fq0l5dt

    ```


    Existing directories will be used, but if required, “cpio” will rebuild the necessary
    directories to complete the specified path.


    Another characteristic of the “cpio” command is that it will not overwrite an
    existing file, unless you supply the option “-u” for the pathname. “-u” ensures
    that the file is overwritten “unconditionally”. Exercise great caution whilst
    using this option since your archive may contain a corrupt or out-of-date file,
    which will then overwrite the existing file.'
