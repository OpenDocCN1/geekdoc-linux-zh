- img_proc: true
  md: 'We have seen how the on-line Unix manual (invoked by the **man command**) provides
    useful help on Unix commands. We know that among the first few lines of every
    **man** page, the command syntax of the Unix command is clearly displayed. Let''s
    use the **head** command to display only this valuable information.


    ```

    $ man head | head -15

    ```


    HEAD(C) UNIX System V

    Name

    head - prints the first few lines of a file

    Syntax

    head [ -count ] [ file ... ]

    Description

    This filter prints the first count lines of each of the specified files. If no
    files are specified, head reads from the standard input. If no count is specified,
    then 10 lines are printed.


    ```

    $

    ```


    Note how only the first fifteen lines of the **man** page of the **head** command
    are promptly displayed. That''s how filters and pipes combined together make Unix
    a great world to live in.


    # Tails:


    The **tail** command is the opposite of the **head** command. It is also a filter
    that displays 10 lines of a file, but from the end of the file. To view the last
    ten lines of “longfile”, utilize the command:


    ```

    $ tail longfile

    ```


    To further our understanding of pipes, let''s create a large pipeline in which
    we will put the **tail** command to good use.'
