  md: '# File Systems And Device Management


    Impressed? So were we. This utility deserves all the praise possible. It is so
    important, before all file systems can be mounted during startup, the “fsck” command
    is used to verify their integrity, by default.


    In case of improper shutdown, this command initiates an interactive recovery process
    for all the file systems that do not return an “ok” status. These are repaired
    and then mounted on the system automatically.


    By default, “fsck” is an interactive command that asks for confirmation from the
    user about any changes that must be written onto the file system. If you include
    the “y” option on the command line, it assumes a “yes” response for all queries
    and chooses the best options as answers. We recommend this option, as the rules
    for selecting the best answers in the “fsck” command are excellent.


    ```

    # fsck -y /dev/data

