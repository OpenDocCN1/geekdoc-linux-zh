- img_proc: true
  md: '# Working with Unix


    It''s as though two files exist in the directory. In fact except for the names,
    both the listings are identical in every respect.


    # Properties Of Linked Files:


    +   1. A file with links can be invoked by any of its names. For example, to display
    the file, you could cat the file by specifying any of its names. Also if you edited
    or changed the contents of any of these files, the changes would be reflected
    in all the other links of that file. Remember that a link is simply a new name
    for the same file.


    +   2. Another inherent advantage that you could derive from creating the link
    is that, if any of the files is removed or erased, you can access the link. Unix
    has no delete or erase command but only a rm (remove) command name. This, for
    once, is a very appropriate name. When we request that a particular file be removed,
    Unix recovers its inode and checks for the number of links that the file has.
    One link It then decrements this number by one and ''removes'' one link. Only
    if the number of links is reduced to zero, will the file be erased from the disk.
    This is the reason why, if a file having any of its links is accidentally deleted,
    it can be accessed using any of its links, since there are other filenames that
    still refer to this file. It will continue to be accessible till the last of its
    links is removed.


    +   3. Unix treats all links to a file equally. It''s not as if the original file
    is, in any way, more important than its links.  Once you''ve made a link to the
    file, Unix treats both in an identical manner.'
