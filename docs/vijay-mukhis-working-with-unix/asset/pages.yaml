    $

    ```


    The current working directory is listed as /usr/user1. Note how a detailed path
    has been displayed so as to leave no doubt in the mind of the user.


    The / denotes the **root** directory of the Unix file system. Within this root
    directory is a sub-directory called **usr**, within which there is another directory
    called **user1**. That is where we are now. Therefore the path from the root directory
    is displayed as **/usr/user1**.'
