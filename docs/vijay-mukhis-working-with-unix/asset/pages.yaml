- img_proc: true
  md: '# The Killing Fields: How to Kill Processes


    For various reasons, a user may want to terminate a process. There may be too
    many processes running on his terminal which may affect the speed and performance
    of his current active process. Certain background processes may have gone awry.
    If you had used the nohup command, these processes will not terminate even if
    you go log out. To forcibly terminate such processes, you may have to shut down
    the system. As if that''s not bad enough, a failed mail or an unauthorized "write"
    to a "tty" file may cause the terminal to hang. The remedy to all above, is the
    kill command.


    It''s time to take up arms and go on the rampage. One of the first diagnostic
    procedures that one must resort to, is the ps command. Now''s the process-ids
    of the processes actually count. Take note of the PIDs of the processes that are
    currently active.


    Let''s understand first that the kill command sends a termination signal to the
    process. A signal is a mechanism that the system uses, to communicate with a process.
    Most signals refer to error conditions that exist in the system. For example,
    if a program tries to access memory outside its authorized area, Unix sends it
    a signal, to prevent it from accessing unauthorized memory.


    There are two relevant signals as far as the kill command goes. When you use the
    kill command without any signal number, by default, a signal is sent to the process
    requesting it to terminate. This signal is also generated, when you press the
    "Delete" key on the keyboard, to terminate the ls or the man command.


    ```

    $ ls -LR | egrep ''projfile*'' > proj-file-lists

    5847

    ```'
