  md: 'Each file and directory in the file system has may attributes in addition to
    its name and filesize. Unix, being a multiuser operating system, includes these
    attributes intentionally, for purposes of security and data protection.


    Mark how each file has an entire line of its own in the listing above. In Unix
    there are five types of files in all. Of these, only two are visible in the above
    listing. The five types of files are:


    +   1. ASCII/ordinary files ("-")

    2. Directories ("d")

    3. Character Special Files ("c")

    4. Block Special Files ("b")

    5. FIFO files or Pipes ("p")


    The special block and character files are located in the /dev directory and are
    used to handle block and character devices. If the file is a special file (of
    the type ''b'' or ''c''), Is will display the major and minor device numbers instead
    of the filesize. In normal practice, these files are never found in the user''s
    directory.


    The next nine characters on the same line are the file "permissions". We had mentioned
    earlier that three kinds of permissions namely the Read(r), Write(w) and Execute(x)
    can be assigned to each file by the "owner" of the file. These permissions are
    displayed immediately after the "type of file" character.


    The permission field for each file consists of nine bits. These bits are displayed
    as either r, w or x within the permission field of each file.'
