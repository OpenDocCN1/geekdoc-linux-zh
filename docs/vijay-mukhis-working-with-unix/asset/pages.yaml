- img_proc: true
  md: '# File Permissions:


    The permissions for each file can be divided into three parts of three bits each.
    The first three bits denote the permissions for owner of the file himself. The
    next three bits assign the permission for the "group" to which the owner belongs.
    A group is basically a set of users who may share files among themselves. In a
    big corporation one may classify all the users in the finance department in a
    single group so that the relevant data is easily accessible to all the users in
    that group.


    The last three permissions in the permission field are for the "others" or the
    "rest of the world".


    ```

    (-,d,b,c,p)

    r w x   r w x   r w x

    | | |_ | | |_ | | |

    TYPE OF FILE OWNER GROUP OTHERS

    ```


    A read-write permission for all three categories would resemble -rw-rw-rw-. The
    - in the permission field means "denied". In the example shown before, the execute
    permission has been denied to all classes of users. The owner of the file is free
    to alter permissions as and and when he chooses. Unix provides the chmod command
    for this purpose. But more on this later in the book.


    Permissions: Categories and Possible values


    | | Read | Write | Execute |

    |---|---|---|---|n| Owner | ? (r/-) | ? (w/-) | ? (x/-) |

    | Group | ? (r/-) | ? (w/-) | ? (x/-) |

    | Others | ? (r/-) | ? (w/-) | ? (x/-) |


    -: permission denied.

    r/w/x: read/write/execute permission granted.'
  merge: -1
  pgno: 97
- img_proc: true
  md: 'Hence for an ASCII file with only read permissions for all classes of users,
    the permissions field of the file would look like:


    -r--r--r--


    where the first - in the field signifies that the file is an ASCII/ordinary file.


    Permissions for a directory also follow the same rules. Only this time, the “type
    of file” field contains a d.


    These permissions are once again user-configurable. After all, very little in
    Unix the owner of the file has full prerogative to assign permissions to all three
    classes of users. But it''s still early days to into the changing of file permissions.
    Hold your horses till we reach our chapter on data security and you''ll know exactly
    how to set permissions for all the files you''ve created.


    After the permission field, a single column of numbers appears. These numbers
    represent the number of links that each file has. A link is a new name for the
    same file. The link also occupies the same disk blocks as the file itself. In
    a nutshell, we are calling the same file with two names.


    A link is a safety device. If a file is accidentally deleted, and since Unix offers
    no “Udelete” utility, the user will despair. However if a link to that file is
    still existing, the file is as good as recovered. The detailed concept and technicalities
    of links has already been explained before. The implementation of this concept
    in Unix is equally important to understand. More discussion on links has been
    provided in our chapter on “General Purpose Commands”.'
