    # Art & Craft With Files:


    The “cut” & “paste”commands:


    The **cut** command:** This command is used to cut out selected fields from a
    file and display them. This command uses an input file and displays the selected
    fields on the standard output. The **cut** command is useful with documents like
    financial reports and statements that contain data in a tabular format.


    There are two basic formats you can use with the **cut** command. You may choose
    to cut fields by specifying the number of columns or by specifying the number
    of fields using a delimiter.


    The **cut** command with the **-c** option specifies the number of columns that
    you would like displayed from the file. To display the first 24 columns of the
    file tally, use the command:


    ```

    $ cut -cl-24 tally

    New-Zealand 5 5 0 0

    England 4 3 0 1

    South-Africa 5 3 2 1

    India 5 2 2 1

    ```'
