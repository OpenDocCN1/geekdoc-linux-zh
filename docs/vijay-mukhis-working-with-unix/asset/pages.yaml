- img_proc: true
  md: 'This is a major advantage. The intruder can now change directory into “backup”
    and do everything except list all the files in the directory. If the intruder
    is certain that a particular file exists, then he can directly remove the file.
    No questions asked. After all, he has both write and execute permissions for a
    directory, so he can delete even those files that have no read permission for
    others. That’s how important directory-level permissions are. Your file permissions
    may be impregnable, but if your directory permissions permit write and execute
    operations, then the intruder could say


    ```

    $ rm brilliant.c brilliant.c : mode 700 ?

    ```


    The above mode clearly shows that all group and others have no permissions for
    the file, but since the intruder has write permission for the directory, Unix
    gives him the benefit of the doubt and weakly seeks his confirmation. The write
    and execute permissions together are like a booty to an intruder.


    # Read And Execute Permission:


    If the user has a read permission coupled with an execute permission, he can enter
    the directory as well as list all the files, but he certainly cannot write to
    any of them, create his own files, or delete existing ones.


    ```

    $ 1 ls -ld backup

    drwxr-xr-x 2 bb8 group 144 Apr 02 15:38 backup

    $

    ```


    Now if the intruder tries to create new files, he will see:


    ```

    $ cat > unauthorized

    unauthorized : Cannot create

    ```


    If the intruder tries to remove a file, Unix plays a cruel joke on him. At first
    he may jump with joy when he sees:'
