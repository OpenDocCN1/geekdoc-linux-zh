    terminal handling. The options are more cryptic than usual, and one wrongly set
    option can terminate your Unix session altogether. But, if used with caution,
    these options can make life more simple for the user of the terminal.


    We know, by now, that Unix treats terminals as serial devices, and controls them
    via device files in the /dev directory. Due to their serial nature, a lot of technicalities
    such as the baud rate, the parity, start-stop bits and other technicalities creep
    in.


    To view the current settings for your terminal, use the -a option with the tty
    command.


    ```

