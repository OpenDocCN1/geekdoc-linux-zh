  md: '# Pipes,Filters And Pattern Searching


    The seventh field from the start of the file, which was the run-rate of the teams,
    was sorted in ascending order. To sort on a particular field, you may also specify
    the relative position of the field from the end of the file. This is to instruct
    the sort command to stop its comparison just before -pos2.


    The next command will specify the exact position of the sort key as the “+6” (i.e.
    the seventh field from the start) and stop further consideration upto to the end
    of the field (-7). In effect, it will begin consideration at the seventh field
    and stop at the end of the seventh field itself. Specifying +pos1 and -pos2 is
    a more precise manner to sort a file on a single key.


    ```

    $ sort +6 -7 tally

    South-Africa 5 3 2 1 6 0.12 Po

    West-Indies 5 2 3 0 4 0.12 Ne

    Pakistan 5 1 3 1 3 0.14 Ne

    Sri-Lanka 5 2 2 1 5 0.17 Ne

    Australia 5 2 3 0 4 0.25 Ne

    India 5 2 2 1 5 0.53 Po

    England 4 3 0 1 7 0.65 Po

    New-Zealand 5 5 0 0 10 0.86 Po

    Zimbabwe 5 0 5 0 0 1.26 Ne

    $

    ```


    The basic problem is that the sorted data is simply displayed on the screen. To
    redirect the output of the sorted file into a new file, you can use the -o option
    and specify the output filename. At the same time, you can see that the second
    field in the file contains a lot of redundancies. To eliminate the redundancies
    and display the recurring value only once, use the -n and the -u options.


    ```

    $ sort -u -tally.sort -n +1 -2 tally

    $cat tally.sort

    England 4 3 0 1 7 0.65 Po

    ```'
