    # Disk Usage: The "du" Command


    No it''s not the same thing. Its purpose is different from the "df" and the "dfspace"
    dealt with. While the "df" command displays the disk space available in the file
    system as a whole, the "du" command displays space used up by files and directories
    whose names are specified.'
