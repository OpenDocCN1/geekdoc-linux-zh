- img_proc: true
  md: '# Dirs/Files:


    Selecting the “Dirs/Files” option allows you to perform several basic and advanced
    file operations like listing, copying, printing, archiving, removing, etc. The
    main options under the “Dirs/Files” option are shown in Screen 62.


    ![](img/2b13e596b1053c0c9f492dfe40dfa70a_545_0.png)


    We are already well acquainted with most of the basic file functions and achieving
    the same through this menu-driven program seems most mundane. So we''ll concentrate
    on the important options available here.


    The “Modify” option has several file-related options built into it. Peek at the
    “Modify” options shown in Screen 63.


    These options help you modify file permissions, ownership, group, and even the
    Format (ASCII to EBCDIC.). All the relevant commands are already known to us.
    You will find it simpler to execute these options from the command line itself.'
  merge: -1
  pgno: 545
- img_proc: true
  md: '# Sysadm


    ![](img/2b13e596b1053c0c9f492dfe40dfa70a_546_0.png)


    # Screen 63


    Coming back to the other main "Dirs/Files" options, we now explore the "Print"
    option. This option permits you to print files at the default printer. Select
    the "Print" option and refer to Screen 64.


    ![](img/2b13e596b1053c0c9f492dfe40dfa70a_546_1.png)


    # Screen 64


    An interesting option among the "Dirs/Files" options is the "UseDOS" option. The
    main options for "UseDOS" are displayed in Screen 65.


    519'
  merge: -1
  pgno: 546
- img_proc: true
  md: '# Working With Unix


    ![](img/2b13e596b1053c0c9f492dfe40dfa70a_547_0.png)


    This option includes all the DOS-related commands provided in the Unix system.
    Listing, copying, removing files, making DOS directories, formatting in DOS 2.0
    format and so on.


    We have included all these commands in the General Purpose chapter in the section
    called “Talking To DOS”. The “sysadmsh” shell gives you the option of invoking
    these commands from the “Usedos” option.


    Lets explore the “Makedir” option in the “Usedos ” option to see how we can create
    a DOS directory on the Unix hard disk. Select the “Makedir” option and refer to
    Screen 66 for the process.


    520'
  merge: -1
  pgno: 547
- img_proc: true
