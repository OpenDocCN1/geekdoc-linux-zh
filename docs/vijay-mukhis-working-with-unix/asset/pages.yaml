  md: '# Unique Modular Structure Of Unix


    ![](img/2b13e596b1053c0c9f492dfe40dfa70a_37_0.png)


    Figure 1


    The main purpose of operating systems is to control and coordinate the activities
    of the computer. The implementation of this objective however may be drastically
    different.


    One of the most outstanding aspects of the Unix system is its modular design.
    Unix consists of programs that are like pieces of a jigsaw puzzle: each one fits
    into a slot provided for it. In case a particular program or module is not included,
    the rest of the operating system is not impaired. The jigsaw puzzle, complete
    or otherwise, continues to function as a whole. If the need arises, modules can
    always fit in.


    Thus in a way, every person’s Unix is unique. The user can add only those modules
    that he requires, saving on cost and valuable computer resources. Unix versions
    thus are almost ‘tailor-made’ to suit the user’s needs.'
