    # Disk Duplicator: The “dd” command


    This command is a versatile command that makes an exact copy of a floppy disk,
    whether it is mountable or not. As usual, the new disk must be formatted and must
    be of the same size and type as the source diskette that you wish to make a copy
    of. In case of a mountable disk, you need not create a new file system on the
    target diskette since the “dd” command will do that for you.


    In the copy process, you can do a lot of conversions to the data. The “dd” command
    takes input from the source diskette and stores the copied files in a temporary
    file, specified by you, on disk. When you insert the target diskette, it takes
    input from the temporary file and makes a copy of it. After the whole operation
    is complete, you have to make sure that you remember to remove (rm) that temporary
    file.


    The temporary file should preferably be created in the /tmp/ directory. Then,
    even if you forget to remove it, it will be erased when the system is started
    up after shutdown.'
