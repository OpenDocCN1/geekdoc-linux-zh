- img_proc: true
  md: 'To play a trick on our own colleague, we redirected the output of an **ls -l**
    command typed in at `tty2c` to `tty1`. To do this, we typed


    ```

    $ ls -l > /dev/tty1

    ```


    We can''t show you the output of this command because nothing appeared on our
    screen. Instead, our colleague working on “tty1a” was completely baffled. How
    could such a directory listing have appeared on his screen when he hadn''t even
    used the **ls -l** command?! All the data on his screen was scrolled as the directory
    listing appeared and he was seen frantically hitting away at the “Del” key in
    an effort to restore normalcy.


    He would have never known what happened, but our dubious smiles gave us away.
    The moral of this story is an important one. Never disclose your login or password
    to anyone who has a lousy sense of humor or he''ll keep playing tricks you won''t
    like.


    This escapade was only possible in such a case. Otherwise Unix system security
    will prevent you from writing directly to someone''s “tty” file. Since we were
    logged in as “user1” on both the terminals, we could override the security considerations
    and forcibly write to another terminal file.


    We are done with the standard input and output. The standard error, however, is
    still to be tackled. As we explained above, by default, the standard errors are
    echoed on the terminal screen. In other words, the error messages generated from
    Unix commands are written onto the terminal file. So the output of a command is
    always displayed on the screen by default, even if the command fails.'
