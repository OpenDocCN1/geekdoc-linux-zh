- img_proc: true
  md: '# Input Output Redirection:


    In all operating systems, there is a standard input device and a standard output
    device. In Unix, as also in most other operating systems, the standard input device
    is the keyboard and the standard output is the display. Special files that instruct
    all the programs to accept standard input from the keyboard and direct the standard
    output to the display, are provided by Unix. This implies that the operating system,
    unless otherwise instructed, accepts all input from the keyboard and directs all
    the output to the display. The errors from commands, if any, are directed to a
    third entity called the “standard error”.


    These three streams, i e the “standard input”, and the “standard error” are denoted
    by the numbers 0, 1 and 2 respectively. This is the fundamental concept of input/output
    redirection.


    | Streams | Device | Value |

    | Standard Input | Keyboard | 0 |

    | Standard Output | Terminal Screen | 1 |

    | Standard Error | Terminal Screen | 2 |


    In many cases, the user may want to direct the output of a particular operation
    to a file. The file could contain something as trivial as a directory listing
    or as complex as a cryptic decoding scheme for data files. Hence, in every operating
    system, the input-output redirection concept assumes great importance.


    Unix provides re-director symbols for the purpose. The symbol > implies re-direction
    of output and the symbol < implies re-direction of input. For example, to re-direct
    the output of a directory listing to a file called “dir-list”, you could use the
    following command:


    ```

    $ ls -l > dir-list

    ```'
