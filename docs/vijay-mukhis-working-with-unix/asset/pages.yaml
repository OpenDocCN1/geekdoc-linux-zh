- img_proc: true
  md: '# 14


    # SYSADM


    For the System Administrator''s Eyes Only:


    Unixland is a monarchy in the true sense of the word. Just one monarch and all
    the others, his subjects. Insensitive to the world where the Berlin Walls are
    collapsing and dictators are fleeing for their lives, the Unix monarchy has survived
    favorably for decades.


    This chapter is addressed to the kings of the Unix World. Those who hold the sceptre
    of a “root password”. In whose hands lies the power of life and death of their
    Unix-dependent subjects.


    But with all the power comes responsibility. The onus to care and govern. The
    responsibility to protect and maintain standards. The obligation to set examples
    and to aid and assist in times of crisis.'
  merge: -1
  pgno: 504
- img_proc: true
  md: '# Working With Unix


    It''s not an easy job. We know. One has to live up to the expectations of not
    only the users but also the Unix system itself. Three decades after its creation,
    Unix still relies on a considerable amount of human support. No manual on the
    latest and most advanced version of Unix can afford to proclaim that its system
    requires no human support at all. It would amount to fraud and fallacy.


    The best that any Unix system can do, is that it can make life easy for the System
    Administrator. And towards this goal, most Unix versions provide a menu-driven
    program from which the superuser can conveniently accomplish his never-ending
    list of chores.


    We have covered one such menu-driven Shell that is provided to System Administrators
    by the SCO Unix System. This Shell can be invoked through an executable file called
    “sysadmssh” which is short for “System Administration Shell".


    Obviously, this shell can be invoked by the System Administrator only. Though
    a sound understanding of the underlying principles and concepts of System Administration
    is beneficial to all Unix users.


    This chapter represents a visual trust with the System Administration Shell. In
    takes guides the superuser by the hand through the series of menus and options
    that are part of this unique Shell.


    System Administration was never as easy as this.


    # First Step:


    To invoke the menu-driven System Administration Shell from the command line, use
    the command:


    ```

    #sysadmssh

    ```'
  merge: -1
  pgno: 505
