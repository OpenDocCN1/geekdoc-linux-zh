- img_proc: true
  md: 'This one''s worth remembering. It''s a way to long-list directories in the
    current directory. When you''re working with large amounts of files and directories,
    you''re going to need this command all the time. To list only files you could
    add the -v option to the above command.


    The ls -al command lists all the files in the current directory including the
    ones that begin with a "dot" (period) or contain a dot in their name, like the
    .excr file that contains settings for vi and is executed before vi loads on or
    the .profile file which is executed when the user logs in.


    To list all "dot" files in your current directory, we have to first search for
    the dot (.). The problem is that the grep command treats the dot as a special
    character that matches any character being searched for, except newline. To make
    the grep command understand the dot literally, we place a backslash (\ before
    the dot to inform the grep command to take the following character literally.
    The command then becomes:


    ```

    $ ls -al | grep ''\''

    drwxr-xr-x 4 user other      132 Mar 19 13:01 .

    drwxr-xr-x 30 userl auth       672 Mar 09 12:03 ..

    -rw-r--r-- 1 user group             7 Mar 09 13:07 .excr

    -rwx------ 1 user group             83 Mar 02 09:46 .profile

    -rw------- 1 userl group            974 Mar 09 12:43 log.bak

    -rw-r--r-- 1 userl group            259 Mar 17 11:29 temp.who

    $

    ```


    Note how all filenames that contain a dot are promptly displayed. The scope is
    limitless. By piping the output of the ls -l command to grep, you could display
    all files created on a certain date or simulate the who am i command output from
    the who command. (Simply search for your own logname).'
