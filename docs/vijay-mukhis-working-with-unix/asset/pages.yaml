- img_proc: true
  md: 'This command will mount the file system on the floppy at the "/usr/floppy"
    mount point in the "/usr/floppy" directory. Let''s confirm this, using the "/df"
    command.


    ```

    * df

    / (/dev/root) : 12016 blocks 27586 i-nodes

    /data (/dev/data) : 85330 blocks 32149 i-nodes

    /usr/floppy(/dev/fd096ds15) : 2316 blocks 590 i-nodes

    ```


    As long as the file system is mounted, Unix will follow all normal procedures
    to keep the floppy up-to-date with the changes that you make.


    # Unmounting a Filesystem: The "umount" command


    The "umount" command can be used to "unmount" any existing file system, on floppy
    disk or the hard disk. The "umount" command dissociates the new file system from
    the root directory of the existing file system. Unmounting a file system does
    not affect the files on that file system in any manner whatsoever. The files on
    that file system will become accessible, once again, when it is remounted.


    ```

    # /etc/umount /mnt

    ```


    The name of the mount point is specified as an argument. The file system has,
    once again, become a stranger to Unix. The "mnt" directory becomes empty as before.
    If the file system was existing on a floppy, you can safely remove the floppy
    and take it home. Now there won''t be a problem.


    The "umount" command fails when any user has a file open in the file system or
    has used the "cd" command and is currently working in the file system.


    ```

    # /etc/umount /mnt

    ```'
