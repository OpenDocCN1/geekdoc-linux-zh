    # Yankee Doodle Doo:


    The Yankees are coming. Not the Civil War. The Yankees have made a home for themselves
    in vi. We''re neutral. We''ll simply tell the story as it is.


    vi, incidentally, is equipped with ''yank buffers''. This too is a misnomer. "Yank"
    means to extract or remove. But these buffers copy the specified lines from the
    editing buffer and store it so that the user can paste them to another location
    in the file or across files. The lines that are yanked are certainly not removed
    from the editing buffer. But sensible names is not exactly Unix''s forte. So we''ll
    stop complaining.


    Let''s tackle the basics first. Yanking is a process of storing specified lines
    into the yank buffers. Once these lines are stored into the yank buffers, they
    maybe "pasted" elsewhere in the file.


    There are some basic commands we would like to introduce at this stage.


    +   #yy : Yanks the specified number of lines into the yank buffers.


    +   p : Pastes lines from the yank buffers below the current line.


    +   P : Pastes lines of text from the yank buffers above the line.'
