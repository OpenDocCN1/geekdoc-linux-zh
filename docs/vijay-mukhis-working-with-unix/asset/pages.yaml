- img_proc: true
  md: '# Working With Unix


    The “cpio” command is short for “copy in/out” and has two main options. The “cpio
    -o” (copy out) is used to read the files from the standard input and copy those
    files to the standard output, retaining their status and path names.


    The “cpio -i” (copy in) extracts files from the standard input, which is assumed
    to be the product of a previous “cpio -o” command. Only files with names that
    match patterns are selected. Patterns are regular expressions and metacharacters
    understood by the Shell. As usual, the metacharacters must be enclosed in quotes
    to hide their literal meaning from the Shell.


    Extracted files are conditionally created and copied into the current directory,
    based upon the options described below. The permissions of the files will be those
    of the previous “cpio -o” command. The owner and group of the files, will be that
    of the user of “cpio”, unless the user himself is the superuser. In the latter
    case, “cpio” retains the owner and group of the files of the previous “cpio -o”.


    If “cpio -i” comes across a file that already exists, it will issue a warning
    message before proceeding with the copy.


    We''re out of breath. But as you will discover, this command is really something.
    In fact, we will contrast the “cpio” command with the “tar” command, once we’re
    through it. The usage and the mechanism of both the commands are drastically different,
    as we are about to discover.


    Start with the basics for purposes of survival.


    ```

    $ echo /etc/ttytype | cpio -c /dev/rdsk/f0ql15dt

    2 blocks

    $

    ```'
