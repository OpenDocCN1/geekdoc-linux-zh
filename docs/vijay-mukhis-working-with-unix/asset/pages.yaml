    # The Great Divide: "split" and "csplit":


    A file can be split into several fragments depending upon the user''s requirements.
    A particular file that contains hundreds of lines of program code can be split
    into fragments using the split and csplit commands.


    Splitting files is useful in several situations. Presume that you would like to
    load a large file with vi and edit it. Now vi has a limitation that it can load
    only files that are up 1 Megabyte in size. If your application exceeds this limit,
    you wouldn''t want to be deprived of vi and its editing and modification facilities.
    So split the file into smaller fragments and tackle each one individually.


    The split command breaks the file into several parts, each of which contains a
    specified number of lines. This command creates multiple files in the current
    directory and places the contents of the original file in these files by placing
    the specified number of lines in each. The original file remains unchanged in
    this process.'
