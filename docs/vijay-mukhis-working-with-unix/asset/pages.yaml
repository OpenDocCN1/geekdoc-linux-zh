    which users are allowed access to the print services of the system. If there is
    only one default printer on the system, one of the tasks of the System Administrator
    becomes limiting the number of printer users. In this screen you can specify the
    lognames of users who should be allowed or denied access to the "lp" print services.
    Enter the names of people who should be allowed or denied access to the printer
    in Screen 41.


    ![](img/2b13e596b1053c0c9f492dfe40dfa70a_532_0.png)


    The next option under "Printers" is the "Schedule" option. This option is very
    important when it comes to starting and stopping the print scheduler, "lpsched",
    accepting and canceling print requests and enabling and disabling printers. Check
    out the main options under "Schedule" from Screen 42.


    To start the printer scheduler "lpsched", select the "Begin" option. The resultant
    screen is shown in Screen 43.'
  merge: -1
  pgno: 532
- img_proc: true
  md: '# Working With Unix


    ![](img/2b13e596b1053c0c9f492dfe40dfa70a_533_0.png)


    # Screen 42


    ![](img/2b13e596b1053c0c9f492dfe40dfa70a_533_1.png)


    # Screen 43


    On the same lines, the “Stop” option will stop the print scheduler. If the number
    of processes in the system becomes too large, and the system response becomes
    slow, the System Administrator has to often take such measures. If no one is using
    the print services, then the “lpsched” daemon becomes an unnecessary overhead
    and can be stopped, using the “Stop” option. Invoking this option will call the
    “lpshut” command, provoking the scheduler to stop in an orderly fashion.


    506'
  merge: -1
  pgno: 533
- img_proc: true
  md: 'That brings us to the “Accept” option in the “Schedule” menu. When a new printer
    is added to the system, it is installed but not activated. To allow a printer
    destination to accept requests, select the “Accept” option. Screen 44 for reference.


    ![](img/2b13e596b1053c0c9f492dfe40dfa70a_534_0.png)


    # Screen 44


    Since our system had only one default destination, the F3 key faithfully depicted
    the name of that destination in the list.


    Similarly, you can instruct a particular destination printer to reject all requests.
    To do this, choose the “Reject” option and proceed to specify the destination
    from the list that F3 provides.


    Another important step that deals with printer settings is the “Enable” option.
    Note that a printer accepting requests may not be completely functional. The print
    requests are simply spooled for that printer. To make the printer fully functional,
    you have to manually enable the printer.


    Select the “Enable” option and refer to Screen 45.'
  merge: -1
  pgno: 534
- img_proc: true
  md: '# Working With Unix


    ![](img/2b13e596b1053c0c9f492dfe40dfa70a_535_0.png)


    # Screen 45


    You can manually disable a printer by selecting the “Disable” option and specifying
    the destination as usual.


    We’re done with the “Schedule” option in “Printers”. The “Request” option is no
    big shakes. It is useful to move requests between destination printers or to cancel
    requests altogether.


    That''s as far as we go with “Printers”. Let’s move onto the next main option
    in “sysadmsh” which is “Media”. As this option suggests, it deals with the various
    media that the Unix system supports.


    Media:


    The “Media” option deals with the various media that Unix supports. It enables
    the user to read, copy, compare and format disks, tapes and other media supported.


    The main options under “Media” are shown in Screen 46.


    Select the first option, “List”, to obtain a full listing of the contents of a
    floppy disk or tape.


    508'
  merge: -1
  pgno: 535
- img_proc: true
  md: '# Screen 46


    ![](img/2b13e596b1053c0c9f492dfe40dfa70a_536_0.png)


    # Screen 47


    ![](img/2b13e596b1053c0c9f492dfe40dfa70a_536_1.png)


    The F3 option displays an informative list of devices in English. It makes the
    selection of devices far more simpler. When you have selected a device, it promptly
    converts the English name into a device file name and pastes it in the appropriate
    box. That way, you don''t have to remember the name of the device file for a 1.2
    MB floppy as “dev/rfd096ds15”. Therefore we strongly recommend that you use the
    F3 list throughout the “Media” menus.'
  merge: -1
  pgno: 536
- img_proc: true
  md: 'After listing the contents of a device, we tackle the next option, “Extract”.
    The option invokes a backup command which was so difficult to use from the command
    line.


    This menu enables you to extract particular files or directories from the media
    that you specify. We have chosen to extract files from a 1.2 MB floppy through
    the F3 list. Screen 48 shows the present status.


    ![](img/2b13e596b1053c0c9f492dfe40dfa70a_537_0.png)


    # Screen 48


    The “Archive” option invokes the “tar” command and helps you store files, directories
    or filesystems on the media you select. Screen 49 appears when you select the
    “Archive” option.


    The “Format” option permits you to format the device that you select from the
    device list. You may choose between a DOS format or a UNIX format to suit your
    needs. Screen 50 describes the process.'
  merge: -1
  pgno: 537
- img_proc: true
  md: '# Sysadm


    ![](img/2b13e596b1053c0c9f492dfe40dfa70a_538_0.png)


    ![](img/2b13e596b1053c0c9f492dfe40dfa70a_538_1.png)


    The "Duplicate" option invokes the "dd" command that we have discussed in our
    chapter on File Systems And Device Management. It is useful in duplicating disks
    and tapes. The source media is duplicated onto a temporary file in the system
    and from that file once again onto the target media. The blocking factor is the
    system default value of 10. Screen 51 for reference.


    511'
  merge: -1
  pgno: 538
- img_proc: true
  md: '# Working With Unix.


    ![](img/2b13e596b1053c0c9f492dfe40dfa70a_539_0.png)


    Screen 51


    The “Tapedump” option enables you to display the physical contents of a tape.
    The F3 option, as usual, proves useful in displaying a list of the types of tapes
    supported by the system. You can select any one of the available types, and enter
    an output filename where the tape will be dumped.


    ![](img/2b13e596b1053c0c9f492dfe40dfa70a_539_1.png)


    Screen 52


    512'
  merge: -1
  pgno: 539
- img_proc: true
  md: 'The “Jobs” option can be used to authorize, report or terminate jobs in the
    system. By authorize, we mean, allow deny certain users the facility of using
    the “at”, “batch” and “cron” commands to schedule their jobs. The main options
    under “Jobs” are shown in Screen 53.


    ![](img/2b13e596b1053c0c9f492dfe40dfa70a_540_0.png)


    # Screen 53


    Let’s select the “Report” option to obtain the status of various processes in
    the system. It simply executes the “ps-ef” command and displays a list of all
    processes currently active in the system. Screen 54 shows the present status of
    jobs on our system.


