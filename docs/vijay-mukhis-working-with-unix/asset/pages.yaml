    “z”. They may contain strings, lines and even entire paragraphs of text that are
    often repeated in the file. Once the information is stored in a user-defined buffer,
    it can be recovered throughout the vi session and when required. These buffers
    incorporate a type of macro facility in vi that is active for the entire duration
    of the vi session.


    This concept is linked with yanking of lines. We have understood when we first
