  md: '# Getting Started With Unix


    File handling in Unix is rather elementary. In the well-documented archives of
    Unix, there are several volumes dedicated to its exceptional file system. Though
    the concept of file creation is brilliant, the implementation is rather simple.
    In the following section, we make a brief stopover to take a fleeting glance at
    this wondrous land.


    # Copying Files: The “cp” Command:


    As one of our first, let''s make a copy of the existing file “speech” into a new
    file, “speech.copy”. To achieve this we use the cp command in Unix. At the “$”
    prompt, type in the command:


    ```

    $ cp speech speech.copy

    $

    ```


    This command simply makes a copy of the existing file “speech” into a new file,
    in our case “speech.copy”.


    DOS users must be appalled! A four letter extension for a filename! It speaks
    volumes for the flexibility and versatility of Unix file handling. Caution! If
    there already exists a file called “speech.copy” in the same directory, it will
    be mercilessly overwritten without any warning issued to the user. To avoid such
    untoward incidents, make sure you''re well aware of the contents of your current
    directory. Always use the friendly ls command before you carry out any file operations.


    The command to copy files across directories is also refreshingly simple. To copy
    our file back into the home directory, we could use the cp command in a new format.


    ```

    $ pwd

    /usr/user/temp

    $ cp speech ..

    $

    ```


    OR


    45'
