    # System Processes:


    We have, so far, examined processes associated with each individual user, but
    this is only the tip of the iceberg. There are several long-lived processes and
    transient processes that support the activities of the system that live and die
    when the system goes about its business independently of individual users.


    The -e option along with the ps command will list every process that is currently
