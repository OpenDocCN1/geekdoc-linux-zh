- img_proc: true
  md: "# Working With Unix\n\nWe chose to execute the \"ps\" command for a special\
    \ reason. Note that this \"ps\" command was run from within the Shell program.\
    \ It displays very clearly that two Shells are active. The first Shell with a\
    \ lower PID is our login Shell and the second Shell is the Shell that is executing\
    \ our Shell program. It just proves the point that we had harped so much about,\
    \ earlier in the chapter. The login Shell calls a new Shell to execute the Shell\
    \ program and relaxes comfortably in the background.\n\nAfter the program has\
    \ terminated, and you execute the \"ps\" command from the command line, you will\
    \ see only one Shell active at the terminal.\n\nThe \"case\", \"esac\" construct\
    \ allows the use of regular expressions that the Shell understands. For example,\
    \ you can conveniently specify the pattern to be matched as: \"st*\" to match\
    \ \"steve\" or \"stanley\".\n\nThe pipe symbol | also has a special significance\
    \ in the \"case\" construct. It can be used as a logical OR between two patterns\
    \ in the construct. We will illustrate both these concepts in the following example.\n\
    \n```\n$ cat > messages\ncase $LOGNAME in\n  user1) echo \"How the the book go\
    \ in?\"\n    echo \"Hope someone reads it\"\n    echo \"Pray someone understands\
    \ it !@#!\"\n    ;;\n  bb*) echo \"Group project meeting at 2 PM today\"\n   \
    \ ;;\n  sue | john) echo \"How was the honeymoon ? Fun..?\"\n    ;;\n  *) echo\
    \ \"Why on earth have you logged in at this machine?\"\n```\n\n474"
  merge: -1
