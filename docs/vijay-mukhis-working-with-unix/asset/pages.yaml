  md: '# The "exit" command:


    You can use the "exit" command inside Shell scripts to immediately terminate the
    execution of the script. The exit command takes a number as its sole argument.
    This number becomes the return code to the subshell that executes the Shell program.
    By convention, a command that executes correctly, returns a zero value, whereas
    a command that fails returns a non-zero value.


    For example, if you''re looking for a file that does not exist, you can terminate
    the Shell program, using the command:

    exit 2


    This command returns a value of 2 to the Shell and terminates the execution of
    the Shell program. C programmers may be familiar with the "exit" command since
    it serves the same purpose in C programs.


    # Another Syntax for the "test" Operator:


    Instead of using the word "test" in the Shell program, you can use square brackets
    ([]) in its place. This implies that:


    test -f is equivalent to [ -f ]


    The same applies for all the other file options of "test". The variable options
    can be written as:


    test var1 -eq var2 is equivalent to [ var1 -eq var2 ]


    Most professional programmers prefer this method of using the "test" operator.
    You may select any one of these two methods, depending upon what you''re comfortable
    with.


    We now take a few more examples with the "test" operator and include some of the
    logical operators available. Let''s try and compare two files in the current directory.'
