- img_proc: true
  md: '# Making a File System: “mkfs”


    Having learnt how to format a floppy, the next logical step is to learn how to
    create a file system on it. The “mkfs” command takes a device name as its argument
    and creates a file system on that device. This command can only be used by the
    superuser of the system. So youll have to approach him, floppy disk in hand, and
    use your good offices with him.


    There are different types of file systems in Unix.


    +   1. AFS: Acer Fast Filesystem


    +   2. 1K Filesystem: If the block size on disk is chosen as 1024 bytes, the file
    system becomes a 1K file system. For most systems, a 1K file system is a good
    compromise between system performance and use of disk. The “root” and “usr” file
    systems are delivered as 1K file systems by default.


    +   3. 2K Filesystem: The block size is 2048 bytes. It is generally used when
    the system uses large executable files and data files.


    When you create a new filesystem, you have to specify the type of file system
    you wish to create on that device. The default type of file system is the AFS.
    The 2K file system can be created only if the relevant utilities to create it
    are installed on your Unix system.


    Alongwith the device name and the type of file system you wish to create, you
    have also got to specify the numbers of blocks, the inter-block gap and the cylinders
    and inodes that should be utilized or allotted for the file system. No mean task
    this. The maximum size of a file system that can be created on a 360KB disk is
    702 blocks (with 512 bytes per block) and 2370 blocks on a 1.2MB floppy.'
  merge: -1
  pgno: 398
- img_proc: true
  md: 'To create a file system on a floppy presents several distinct advantages. The
    floppy file system saves valuable amount of hard disk space and secondly your
    file system becomes portable, so you can carry it home or to any other machine
    and mount it there and begin work.


    The device name specified with the “mkfs” command should always be a raw device
    name. If any data exists on the floppy disk, it will be promptly erased when the
    new file system is created. We have specified the raw device name as “dev/rdsk/f0ql5dt”,
    which refers to the 1.2MB floppy disk and ensures that the file system will be
    created on the entire disk.


    ```

    # /etc/mkfs /dev/rdsk/f0ql5dt 2400

    mkfs: default type (AFS) used

    bytes per logical block = 1024

    total logical blocks = 1200

    total inodes = 288

    gap (physical blocks) = 7

    cylinder size (physical blocks) = 400

    cluster size = 16

    mkfs: Available blocks = 1177

    #

    ```


    The second argument that “mkfs” requires after the device name is the block size,
    which is expressed in units of 512 bytes each. Normally a user may wish to use
    the entire disk for creating the file system. Thus we have calculated the number
    of blocks by approximating the quotient of 1.2M divided by 512 bytes/block, and
    arrived at the figure of 2400. You can specify fewer blocks if you like leading
    to unused disk space, but a figure greater than 2400 will cause a fatal error
    since “mkfs” cannot find the specified amount of space on the floppy disk.'
  merge: -1
  pgno: 399
- img_proc: true
  md: 'The argument following the number of blocks, is the number of inodes to be
    allocated for the file system. The optimum ratio is generally one-fourth of the
    number of blocks. We had not specified the number of inodes and that is why, the
    system calculated 288 inodes for our file system

    ofof 2400 blocks. If you wish to create a large number of small files on the new
    file system, always remember to specify a larger inode count since each small
    file will occupy less disk space, but consume one inode for sure. If you stick
    to the default value, a situation may arise where there is free space left to
    allocate, but no free inodes. This would make the file system ineffective and
    redundant. Specifying a very large inode count, on the other hand, would consume
    a few valuable kilobytes of disk space on the floppy, the inode list for that
    file system would become very large. So if you would like to create a small number
    of large files, you can keep the number of inodes less than the default value,
    to save disk space. However, it is suggested that the inode count should never
    be less than 100 and the value chosen by the system should always be optimum.


    Having fixed the number of blocks and inodes, it is not possible to revert to
    another value, unless a new file system is created. To specify the number of inodes,
    you have to state the value for it immediately following the number of blocks,
    with a colon (:) placed in between. There should be no space whatsoever before
    or after the colon. The following example will create a new file system with a
