- img_proc: true
  md: '```

    fsstat /dev/fd096ds15 okay

    ```


    A mounted file system may become corrupt due to several reasons. The first and
    foremost reason is improper shutdown of the system and another is hardware or
    media failure. In such case, the file system concerned should be unmounted and
    its status checked. If the status is not “okay”, then repair of the file system
    should be initiated using the “fsck” command discussed later.


    # The Antidote For Filesystems: The “fsck” command


    It’s a God-sent remedy for all ills of file systems. A tool so advanced, that
    it can repair and reconstruct, what we believe, are absolute panacea for ailing
    file systems. A cure that makes them fighting fit with a single dose. A Dr. Filesystem,
    M.D. of sorts.


    For convenience of treatment and diagnosis, a file system must be unmounted before
    the ‘doctor’ can be summoned. The “root/ file system is once again the exception
    to this rule. One can’t go around unmounting root file systems.


    The “fsck” command is short for “file system check”. Its diagnosing procedure
    is long and complex. But the results are most pleasant. To check the file system
    we just mounted from the floppy disk, unmount it first, and use:


    ```

    # fsck /dev/fd096ds15

    /dev/fd096ds15

    Fast File System: Volume:

    ** Phase 1 - Check Blocks and Sizes

    ** Phase 2 - Check Pathnames

    ** Phase 3 - Check Connectivity

    ** Phase 4 - Check Reference Counts

    ** Phase 5 - Check Free List Bitmap

    2 files 6 blocks 2316 free #

    ```'
