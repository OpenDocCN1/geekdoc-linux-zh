- img_proc: true
  md: 'Finally, the bdfflush (short for buffer to disk flush), has the job of managing
    the disk I/O for the system. Because the system has many temporary storage areas
    called the buffers, which behave like real memory, and store data required by
    the system, there is a possibility that if the system crashes, the data in the
    buffers may not match on the disk. To prevent such error, the bdfflush process
    swings into action and writes the data in the buffers to the disk every 20 seconds,
    using a process called sync. Thus the disk is updated with the latest information
    in the buffers, because only data which is changed is written to the disk everytime.
    The bdfflush process is assigned a PID of 3.


    The processes such as vhand, bdfflush, and sched are stored in the file /unix
    which is the Unix kernel. These system processes are called DAEMONS.


    Daemons (thank Heavens for that “a” in between) are the most exotic inhabitants
    of the Unix universe. Unix systems have all kinds of daemons, like sched, lpsched
    and vhand, that are constantly running in the background, and sleeping daemons
    like cron that wake up at regular intervals to check whether any work has piled
    up for them.


    A daemon is defined as a process that runs without the user requesting it to do.
    The daemon process is user-independent and terminal-independent. A daemon is,
    alternately, defined as a process that runs in the background in order to be available
    at all times.


    The getty is a process that displays the login: prompt for the user on the terminal.
    This process terminates when the user types in the login and the password, making
    way for the shell sh.'
