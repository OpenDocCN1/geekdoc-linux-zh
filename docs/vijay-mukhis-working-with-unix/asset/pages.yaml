  md: '# Unix: The Fundamental Principles


    The Unix system is divided into three main entities:


    i) The Unix Kernel: It''s the core of the system. It controls all the tasks, schedules
    all the processes and carries out all the crucial functions of the operating system.
    All operating systems have a Kernel that contains thousands of routines to carry
    out the numerous tasks that the operating system has to handle. Among the major
    duties of the Kernel is to keep track of the programs that are executing, allot
    processor time to each and also decide when one program stops and another starts.
    The Kernel also handles information exchange between the computer and its terminals,
    tape drives and printers.


    ii) The Shell: It is the ''Command Interpreter'' of the operating system. It accepts
    commands from the user and analyzes and interprets these commands. We know that
    most Unix commands are executable C programs. The Shell interprets the users command
    and starts executing the appropriate executable file. It then requests the Kernel
    to carry out the actual transfer of data which finally leads to the output that
    is displayed on the terminal.


    Hence the Shell acts as a middleman between the Kernel and the User of the operating
    system.


    The Kernel is basically the monarch, but you generally deal with its emissary,
    the Shell. In Unix, every user who logs into the system gets his own copy of the
    Shell. This means that, at a particular instant, there may be several copies of
    the Shell running on the system with a minimum of one Shell per user.


    There are three shells mainly used with Unix.'
  merge: -1
  pgno: 42
- img_proc: true
  md: '# The Bourne Shell :


    This is one of the most widely used shells in the Unix world. It was developed
    by Steve Bourne of AT&T Bell Laboratories (where else) in the late 1970''s. It
    is the primary Unix command interpreter and comes along with every Unix system.
    The ubiquitous “dollar prompt” on Unix installations is the trademark of the Bourne
    Shell.


    # The C Shell:


    Bill Joy, who is by now, known to you as the “Joy of Unix” was the creator. He
    designed and developed this shell at the University of California at Berkeley
    when he was a graduate student there !


    The C Shell is the default Shell in the Berkeley version of Unix and is immensely
    popular with Unix programmers and university researchers.


    The C Shell has a few principal advantages over the Bourne Shell.


    +   1. A history mechanism. The C shell remembers the commands that the user types
    and allows him to recall them without having to retype them. This is a great benefit,
    for as you will discover, Unix commands are often very long and have a multitude
    of options. Even the slightest typing mistake or a control key pressed during
    typing the command, and Unix rejects it in an instant. So this mechanism is not
    as trivial as it seems.


    +   2. Aliasing. The C shell permits you to call frequently used commands by your
    own formulated abbreviations. This too proves very useful at the command line.
    This is a type of “macro” facility that is available at the command line.'
