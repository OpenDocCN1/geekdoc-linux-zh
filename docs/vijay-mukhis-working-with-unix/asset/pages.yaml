- img_proc: true
  md: '# The Restricted Shell "rsh": Life Imprisonment


    The standard Shell provides capabilities that allow users to move around in the
    file system, execute many commands, change environment variables and so on. However,
    for some reason, these privileges should be denied to a user, another Shell called
    the Restricted Shell is available under Unix. A kind of prison term, as you will
    see.


    The rsh is an executable program just like sh, present in the /bin directory,
    which accords the bare minimum privileges to a user of the system. The Restricted
    user is chained by certain do''s and don''t:


    +   1. The user is clamped down to working in his HOME directory only. He cannot
    change directory to any other directory in the system.


    +   2. The user cannot change the PATH variable, so only files that lie in the
    path set by the System Administrator are reachable. For example, if his PATH is
    set to /bin, he cannot execute commands whose executable files lie in /usr/bin
    or /etc, etc.


    +   3. The user cannot create new files or append to existing ones using the >
    or >> operators respectively.


    The Restricted Shell is used to keep naive or amateur users forming beyond their
    HOME directories into the system directories, lest they cause some damage or accidental
    erasure. Normally, rsh is given to users who have limited reasons to log onto
    the machine. Users who are generally new in the organization or come from outside
    to perform on-site projects are generally deprived of key system utilities, using
    the Restricted Shell.'
  merge: -1
  pgno: 378
