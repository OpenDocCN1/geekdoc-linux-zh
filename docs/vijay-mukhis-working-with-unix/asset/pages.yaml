    There are several items of interest in this output. This is the first, look inside
    at processes that we have taken. The first process to execute when the machine
    boots is the scheduler (called **sched** in the above output). The scheduler is
    the heart of the time-sharing design of Unix. The scheduler is responsible for
    determining which of the processes is ready to execute and allocates each process
    the required system resources, like CPU time-slice, memory and other important
    considerations.


    The scheduler has the value PID 0, and in turn starts off the initialization (or
    the **/etc/init** process). Since the path is so explicitly specified, you must
    have guessed that it is a file on disk, existing in the **/etc directory. The
    **init** process gets the value PID 1.


    The **vhand** process is the “virtual handler”, which handles the virtual memory
    of the system and manages to swap the active process between the disk and the
    real memory, as they run or as they wait in queue to be processed by the system.
    The **vhand** process is mainly responsible for managing the system memory in
    a multitasking environment. The **sched** and **vhand** processes are the ones
    which make up the core of the kernel. Thus the PID of the **vhand** process is
    2 since the third process to start after booting.'
