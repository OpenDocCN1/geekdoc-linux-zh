    # The “test” Operator:


    The “test” operator is very useful in checking the values of expressions and variables
    that can be used in several of the conditional looping constructs. The “test”
    operator checks to ascertain whether certain conditions are true, based on which
    a loop can be made to execute.


    Some of the useful options of the “test” operator are:


    # File Options:


    +   test -r : True if the file exists and has read permission

    test -w : True if the file exists and has write permission

    test -x : True if the file exists and has execute permission

    test -f : True if the file exists and is a normal file

    test -d : True if the file exists and is a directory

    test -s : True if the file exists and has a size larger than zero bytes


    # Variable Comparisons:


    +   test var1 -eq var2 : True if var1 equals var2

    test var1 -ne var2 : True if var1 is not equal to var2

    test var1 -gt var2 : True if var1 is greater than var2

    test var1 -lt var2 : True if var1 is less than var2

    test var1 -le var2 : True if var1 is less than or equal to var2'
