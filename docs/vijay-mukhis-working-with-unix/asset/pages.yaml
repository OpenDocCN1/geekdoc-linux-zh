    # Types of Terminals:


    +   1. Dumb Terminals: These terminals consist of the bare minimum components
    that every terminal must possess: a display and a keyboard.


    +   2. Intelligent Terminals: Besides the basic components, these terminals have
    a ‘mind’ of their own. They often have their own memory and offer several enhanced
    features. But the fundamental principle remains the same; however intelligent
    your terminal maybe, it cannot run any programs or carry out any processing. All
