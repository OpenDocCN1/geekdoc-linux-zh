    # The "write" command:


    The **write** command is an easy and convenient way in which you can communicate
    with other users that are logged in at the same time as you. The **write** command
    will connect your terminal to the other terminal and you can proceed to pass on
    messages back and forth. A dialog can be established between two users and no
    one "tap" the lines. So you could send sweet-nings to the gorgeous colleague and
    even fix up date if you get lucky. The **write** command should be executed in
    a particular sequence to ensure success.


