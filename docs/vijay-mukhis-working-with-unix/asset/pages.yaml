    # Looking for something?


    The **“find” command**:


    Unix, as we know very well by now, has one of the most extensive and exhaustive
    file systems. Spanning scores of directories and hundreds of executable files,
    system files, special files and device files. It''s like a maze where one could
    get lost and never find a way out.


    Therefore the wise old men of Unix hath made the **find** command and bestowed
    it with the multitude of options that be. A super tool that will find the files
    you''re looking for in a flash, it recursively descends into directory trees to
    search for files that you specify. But like all things good in Unix, one has to
    take great pains to cultivate the command and its coterie of options. And that''s
    easily said than done. Several generations of Unix users have successfully done,
    or otherwise, wrestled with the options of the **find** command. So pull up your
    sleeves, awaken the dormant fighter in you and let''s kick ... (you know what).


    The **find** command has the syntax:


    ```

    find path-name-list expressions

    ```


    The first argument “path-name-list” specifies the list of directories to search.
    The “expression” argument specifies the list of files you wish to search as well
    as criteria on which the search should be based.


    Let''s tackle straightaway. Fortune favors the brave. If you''d like to search
    for a file called “Myfile” in your current directory the command is:'
  merge: -1
  pgno: 328
- img_proc: true
  md: '```

    $ find . -name Myfile -print

    /usr/user/Myfile

    ```


    This **find** command was in one of its simplest forms. It''s time we get bolder.
    We have understood that the first thing following the **find** command is the
    path where the file should be searched for, and following it maybe be the filename
    and the **-print** option. It is especially important to note that the **-print**
    option should always be specified last. The **find** command options are executed
    left to right, so if you put **-print** as the first option, the command will
    print the name of every file that it encounters along the way. So always put the
    **-print** option last.


    To find all files from the current directory that begin with either "m" or "M"
    in the current directory tree, we could specify:


    ```

    $ find . -name "[mM]*"

    ./Myfile

    ./temp/mbox

    ./temp/backup/mbox

    ./mbox

    ./more.c

    ./Memo

    ./Meeting $

    ```


    See how **find** descends into the directory tree starting from the current directory
    and prints files whose names begin with "m" or "M". There''s a lot more to come.
    Since we used the metacharacters * and [ ], we enclosed them in quotes so the
    Shell would recognize them as special characters and not literally as part of
    a filename.'
