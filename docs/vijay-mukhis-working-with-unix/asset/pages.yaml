- img_proc: true
  md: '# The read(r) Permission:


    If a directory has read permission only, one can only list the contents of that
    directory, using the ls command. That''s all. Since the directory is a file, and
    stores the inode number and the name of each file in the directory, this information
    can be disclosed to one who has been assigned a read permission for the directory.
    Nothing else. Try reading a file in the directory, try changing directory to that
    directory; not possible. Let''s take a simple example.


    ```

    $ ls -ld backup

    drwx-r-- 2 bb8 group 144 Apr 01 17:52 backup

    $

    ```


    Fair enough. Now the owner of the directory has assigned all permissions for himself,
    but only read permissions for the others. The directory belongs to "bb8" who is
    part of the same group as us. But note that we have only a read permission for
    this directory. The only thing that we can do with this directory, is display
    the contents using the ls command. With only read permission, you can display
    the filenames and their inode numbers because that''s what stored in the directory
    file. You can''t even obtain a long listing of such a directory using the ls -l
    command, since all details about owner, links, size, etc are stored within an
    inode of the file. All we have is the inode number.


    # The write(w) Permission:


    Let''s assume that the user "bb8" has assigned a write-only permission for the
    same directory backup.


    ```

    $ ls -ld backup

    drwx-w-w- 2 bb8 group 144 Apr 02 13:57 backup

    $

    ```'
  merge: -1
  pgno: 367
- img_proc: true
  md: 'The write permission to a directory, is like showing the bait and keeping the
    catch. If you have only a write permission, you obviously cannot list the files
    in the directory. You cannot change directory into that directory, since you have
    no execute permission. So what can the intruder do with only a write permission?
    Nothing. You''ve just made him a vegetable that can rot and perish on the outside.


    # The execute(x) Permission:


    This one''s a catch. Assume that the directory permissions resemble


    ```

    $ ls -ld backup

    drwx-x-x 2 bb8 group 144 Apr 02 13:57 backup $

    ```


    Now, since we have the execute permission, can we change directory into backup.
    But how is that going to help? We can''t list the files in that directory, nor
    remove or create any file within that directory. It''s like entering a dark tunnel
    with no idea of where you''re headed. You might as well go back out. Blind and
    helpless here too. The execute permission, by itself, presents little danger to
    the files within.


    # Write And Execute Permission:


    Now let''s see what happens if a “write” permission is assigned in addition to
    the execute permission.


    ```

    $ ls -ld backup

    drwx-wx-wx 2 bb8 group 144 Apr 02 13:57 backup $

    ```'
