  md: '# Command Substitution:


    The grave accents (``) have a very special significance to the Shell. They allow
    the output of a command to be used directly as an argument of the command line.
    In Shell programming, the grave accents are used to assign the value of Shell
    variables as the output of a certain command. For example, you can say:


    ```

    $ echo "TODAYS DATE IS ''date''

