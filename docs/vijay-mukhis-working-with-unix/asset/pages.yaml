  md: '# File System Type: "fstyp"


    The "fstyp" command can be used to determine the type of file system that was
    mounted at a particular mount point. This command may be used to ascertain the
    file system type of any mounted or unmounted file system.


    ```

    $ fstyp /dev/data

    ```


    AFS Acer Fast Filesystem (the default type of file system) is mounted as "/dev/data".
    For other types of file systems, like 1K file system, you will see "S51K" and
    so on, when you check for their file system type.


    # Filesystem Status: "fsstat"


    The "fsstat" command is used on unmounted file systems to check their status before
    they can be mounted on the system. Only those file systems that return an "ok"
    status are mounted on the system. The "mount" command performs this check internally,
    before mounting any file system.


    To check the status of any file system, it has to be unmounted first. The only
    exception to this rule is the "/root" file system, whose status can be checked
    while it is active.


    ```

    # fsstat /dev/root

    stat: root file system okay

    ```


    To check the status of any other file system, it has to be unmounted first. Let''s
    say you wish to check the status of the file system mounted from the floppy disk
    at "/mnt", you would proceed as follows:


    ```

    # umount /mnt

    # fsstat /dev/fd096ds15

    ```'
