  md: '# Pipes,Filters And Pattern Searching


    The need for a “pipe” in Unix stems from the fact that Unix was created with a
    “tinker” toy philosophy. In simpler words, Unix commands were designed to perform
    one task only, and perform it well. Hence we often find that for trivial tasks,
    Unix commands offer a multitude of options. Since the command was designed to
    perform only a single task, it might well do it thoroughly. Which is why, programmers
    developing programs for Unix, thought of options that would never occur to a user.
    They did extensive research on even the the most basic utilities. The financial
    grants were magnanimous and the research time unlimited. Therefore the Unix operating
    system is as extensive and abundant with commands as it is today.


    Having to work with commands that perform one task exclusively is not simple.
    Many a times, users want to perform multiple tasks and suddenly life becomes difficult
    and cumbersome. Let''s say the user wants to display a long listing of his home
    directory. One task. No problem. Unix provides an ls command with 23 options in
    all, to perform this simple task. So far so good. Now the user also wants to know
    the number of files present in his home directory. Major problem. There''s no
    option in ls that will display the number of files in the directory. There is
    another command, though, called wc which only counts the number of lines, words,
    or characters in a given input or file.


    Now, if we could somehow pass the output of the ls command as the input to the
    wc -l, the resultant output would display the number of lines (consequently the
    number of files) in the directory listing. That''s where pipes come in.


    179'
