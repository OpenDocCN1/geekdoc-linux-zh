  md: 'We got too carried away in this deluge. To keep track of the teams in the World
    Cup this far, we entered the current statistics in a file called “tally”. When
    we diverted our attentions back to Unix, we realized that this file would be an
    ideal example for the sort command. The contents of this file are displayed below.


    ```

    $ cat tally

    New-Zealand 5 5 0 10 0.86 Po

    England 4 3 0 1 7 0.65 Po

    South-Africa 5 3 2 1 6 0.12 Po

