    # Other Command Grouping Operators:


    The semicolon(); is used to separate multiple commands at the command line. The
    semicolon behaves exactly like a carriage return after each command and Unix expects
    a new command after encountering a semicolon.


    There are some other operators which can be used for command grouping purposes.
    These operators will seem very familiar to C programmers. The && operator signifies
    the logical AND operation and appears between two valid Unix commands. This implies
    that only if the former command is successfully executed, the latter command will
    be taken into consideration. Take, for example, the following command:


