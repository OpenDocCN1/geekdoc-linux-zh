  md: '# Working With Unix


    $


    The precedence of mathematical operations follows the same pattern as always.


    ```

    $ expr 3 \* 4 + 2 \2

    13

    $

    ```


    Here the expressions, (3*4) and (2/2) are given precedence to the "+" operation.


    In Shell programming, the "expr" can be used to assign values to a named variable,
    as follows:


    ```

    $ VAL=''expr'' 5 \* 4 + 2''

    $ expr $VAL\ /2

    11

    $

    ```


    Another useful "expr" operation is the modulus operation. The "%%" sign returns
    the modulus of division of two integers.


    ```

    $ expr 5 % 2

    1

    $

    ```


    The syntax of the "expr" command is very rigid. There must be a single space (or
    tab) between the "expr" command and the first digit. Also there must be a single
    space between the digits and the mathematical operator(s) between them.


    However finicky it may sound, these are the rules laid down and you''d better
    stick to them.'
