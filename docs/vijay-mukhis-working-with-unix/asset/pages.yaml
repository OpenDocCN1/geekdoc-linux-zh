- img_proc: true
  md: '# Working With Unix


    The basic format of use for the “dd” command:

    $ dd input file out file


    Let''s take a simple example. We have a file system on a floppy disk that we wish
    to duplicate on another floppy disk. The corresponding command becomes:


    ```

    $ dd < /dev/rdsk/f0ql5dt > /tmp/temp.out

    2400+0 records in

    2400+0 records out

    ```


    This command reports the whole (2400) and partial blocks (0) that it reads and
    writes. A temporary file called “temp.out” was created for the purpose.


    Now insert a new formatted floppy and use the “dd” command as follows, to create
    a duplicate disk bydump the contents of “/tmp/temp.out” on the new disk:


    ```

    $ dd < /tmp/temp.out > /dev/rdsk/f0ql5dt

    2400+0 records in

    2400+0 records out

    $

    ```


    Duplicate ready! This command is most often used to duplicate new software after
    it has been installed on the machine from its source floppies.


    # Command Line Options For “dd”:


    The “dd” command is capable of performing several conversions on data before it
    is copied to its destination. These conversions may be as mundane as converting
    uppercase letters to lowercase, or as useful as converting ASCII codes to EBCDIC
    codes. The data conversion may be performed while creating the temporary file
    or while taking input from the temporary file to create a new copy.'
  merge: -1
  pgno: 433
- img_proc: true
  md: 'To start with the very basic options, we can use the “if” option to indicate
    the input file and “of” to indicate the output file. These options eliminate the
    need for redirection symbols at the command line.


    ```

    $ dd if=/dev/rdsk/f0q15dt of=/tmp/temp.out

    2400+0 records in

    2400+0 records out

    $

    ```


    By default, “dd” will make its copy in blocks of 512 bytes. You can increase the
    block size (in multiples of 512 bytes only). To can specify the new block size,
    use the “bs” option.


    ```

    $ dd bs=5120 if=/dev/rdsk/f0q15dt of=/tmp/temp.out

    240+0 records in

    240+0 records out

    $

    ```


    The number of records read in and out have reduced to one-tenth their original
    value, and the copy operation has become several notches faster.


    In addition, “dd” provides tools to convert data during I/O. The “conv” (for covert)
    option specifies which conversion algorithm to use.


    These are some of the important options. As usual, we have taken the liberty of
    ‘filtering’ the pearls out of the pebbles. More than one value can be specified
    for the “conv” option by separating them with commas,


    ```

    $ dd bs=5120 conv=ascii,icase if=/dev/rdsk/f0q15dt of=/tmp/temp.out

    240+0 records in

    240+0 records out

    ```


    These conversion options are useful for file-to-file copies but they’re less useful
    for file-to-disk copies.'
