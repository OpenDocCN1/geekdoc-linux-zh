- img_proc: true
  md: '```

    $ ls -lR | tail | wc

    10 66 434

    $

    ```


    The ls -lR command, as one would expect, gives a recursive long listing of the
    directory. The tail at the other end of the pipe, filters the output retaining
    only the last ten lines. These last lines are then passed onto the wc command
    which counts the number of lines, words and characters and displays it on the
    screen. Observe, that for the number of lines, it displays “10”, as tail passed
    on only ten lines to it. On more pipes still to come, stay tuned.


    With the tail command, we still have one important option to discuss. The -f (follow)
    option permits tail to spy on the contents of another file and display all the
    data that is appended to it. Weird? Not exactly.


    In Unix there are several processes running concurrently. These processes may
    be writing data to a file and the user may not be aware of it. To keep track of
    what is being appended to a file, use the command:


    ```

    $ tail -f longfile

    ```


    This command keeps displaying what is being appended to the file and waits till
    you press the “delete” key to interrupt the process and return to the Shell Prompt.
    That’s as far as playing detective goes.'
