- img_proc: true
  md: 'To avoid all such occasions when the “mkfs” command seeks confirmation, you
    can use the “-y” option with the command. This option allows “mkfs” to assume
    that all your responses are “yes (y)”. However, we strongly recommend that this
    option be avoided at all times.


    The rule with the “mkfs” command is: Always let the process remain interactive,
    and pay attention to the warnings that “mkfs” issues.


    If you wrongly specify the device name as the name of the hard disk, your existing
    data could be entirely deleted when a new file system is created on it. Your only
    chance to escape being fired, could be the warning that “mkfs” issues about existing
    data on the disk. If, at that point, you had used the “-y” option, your response
    would be assumed as “yes” and “mkfs” would proceed with its annihilation.


    So, always keep “mkfs” interactive.


    # Mounting a Filesystem: Making the Connection


    A file system is a non-entity until it is formally introduced to Unix. Even if
    the file is created under the very nose of Unix, its existence continues to be
    ignored unless it is acquainted with it in the traditional, pompous manner. Snobbish,
    almost to the point of arrogance.


    The formal introduction of any new file system is done with the “mount” command.
    The “mount” command links the new file system to the existing file system on the
    hard disk, and breathes life into the hitherto ‘dead’ file system. Once the new
    file system is mounted, you can “cd” into it, copy files, make your own directories
    in it, and treat it as a normal directory existing in a file system.'
  merge: -1
  pgno: 402
- img_proc: true
  md: 'Like all file systems, each mounted file system too, has a root directory and
    all its directories fan out from the root. Technically speaking, when you mount
    a file system, you are attaching its root directory to a particular point in the
    existing file system. The point of attachment is called the “mount point” for
    that file system. The mount point of any new file system, must always be specified
    as a path from the root directory of the existing file system.


    Unix provides a default mount point called “/mnt”. This is a directory called
    “mnt” (for mount), in the root (/) directory.


    ```

    # ls -ld /mnt

    drwxr-xr-x 2 root root 32 Jun 13 1990 /mnt

    ```


    Normally this is an empty directory whose owner is “root”, but all others have
    the permission to access it. After all, a file system mounted here may belong
    to an ordinary user, and permissions must be granted for him to access the file
    system that is mounted for him by the superuser.


    The “mount” command, without any arguments, gives details about file systems that
    have already been mounted on the system.


    ```

    # mount

    / on /dev/root read/write on Thu Apr 09 14:50:42 1992

    /data on /dev/data read/write on Thu Apr 09 14:55:40 1992

    ```


    New facts come to light. The file system has, associated with it, a read-write
    permission. Interesting. This means that when the user mounts a particular file
    system, he can specify a global read-write permission at the very onset. If he
    specifies read-only permission, no one, including the superuser, can create a
    file in that file system! Finally a devious method to actually defeat the superuser?
    Unfortunately not.'
  merge: -1
  pgno: 403
- img_proc: true
  md: '# File Systems And Device Management


    For the simple reason that, only the superuser is allowed "mount" a new file system.
    So if he turns off the write permission, well and good. There''s no way an ordinary
    user can mount a file system and deny write permission to the superuser. Just
    proves our point. Without the superuser''s knowledge and assent, there''s little
    you can get away with. So give up the battle and be happy being who you are.


    More on these permissions later. Let''s learn first how the superuser can "mount"
    a file system, at the default mount point, "/mnt".


    ```

    # /etc/mount /dev/fd096ds15 /mnt

    #

    ```


    All quiet. No welcome messages in Unix. The return of the hash prompt (#), is
    proof enough that the operation has succeeded. Now let''s use the "mount" command
    all by itself, once again, to see what sort of welcome Unix gave the new file
    system.


    +   * mount\ /dev/root read/write on Thu Apr 09 14:50:42 1992

    /data on /dev/data read/write on Thu Apr 09 14:55:40 1992

    /mnt on /dev/fd096ds15 read/write on Sun Apr 12 20:30:30 1992


    It''s been accommodated at the specified mount point "mnt", and the default permission
    of read-write has been assigned to it. The system has also noted the date and
    time when the file system has been mounted. When a file system is newly mounted,
    an entry is made in the "mount table" of the system, maintained in a file. This
    mount table is read by various system commands such as "df" or "dfspace".


    To confirm the status of the new file system, you can use the "dfspace" command.


    +   * /etc/dfspace'
