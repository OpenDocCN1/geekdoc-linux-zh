  md: '# File Systems And Device Management


    See how multiple volume backups work with “cpio”? The message prompts the user
    to insert a new disk after each volume is full. To resume the backup process,
    insert a new formatted disk and press the “Enter” key.


    The “M” option allows you to specify your own message, whereas the “O” option
    allows you to give the device name as part of the command instead of redirecting
    the output to it. In all multiple volume backups, make sure that you include this
    option. It instructs Unix to prompt the user for a new volume when the existing
    volume is full.


    The “cpio” command is flexible enough to permit the user to take backups from
    one directory to another, even across file systems on the hard disk. Often Unix
    machines have large capacity hard disks that can accommodate the huge number of
    system files as well as data files created by the users. To exploit the full capacity
    of the hard disk, you can conveniently use the “cpio” command to take backups
    on the hard disk itself. To do this, you can redirect the output of the “cpio”
    command to the target directory and also specify a new name for the “cpio” archive
    file to be created there.


    ```

    $ ls | cpio -ocv > /data/bb8/private/backup.cpio

    calendar

    cron-commands

    dialup.c

    lan-proj.c

    mbox

    network.c

    project.c

