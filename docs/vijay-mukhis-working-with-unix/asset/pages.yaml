  md: 'The summary of the status of the print services, as well as the print jobs,
    can be obtained by using the “-t” option all by itself. This option prints the
    destination of the print jobs (the output of the “-d” option) as well as information
    about the printers and the device files that control them.


    ```

    $ lpstat -t

    scheduler is running

    system default destination: lp

    device for lp: /dev/lp0

    lp accepting requests since Mon Dec 30 23:22:08 1991

    printer lp waiting for auto-retry. available.

    stopped with printer fault


    lp-42             root               187      Apr 21 12:13

    lp-38             user1               248      Apr 21 10:26

    lp-39             userl               905      Apr 21 10:33

    lp-41             root               2790     Apr 21 10:44

    $

    ```


    This option displays the summary of outputs that could have been generated by
    several individual options. The first line in the output shows the status of “lpsched”
    and is the output of the “-r” option. Similarly, the second line is the output
    of the “-d” option and shows the default destination of all the print jobs that
    have been queued as the default system printer called “lp”. The next line is the
    output of the “-v” option as it displays the name and path of the device file
    that drives the printer.


    Following this, is a short description of the printer itself. This is the output
    of the “-p” option coupled with “D”. And finally, the status of all the jobs submitted
    by the users themselves, which is the output of the “-o” option. Thus, in a way,
    the “-t” option says it all. Instead of taking the pains to remember each individual
    option for “lpstat”, just remember the “-t” option, so that all the relevant information
    is displayed in a flash.'
