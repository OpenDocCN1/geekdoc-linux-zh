  pgno: 444
- img_proc: true
  md: '# Working With Unix


    The "lpsched" daemon handles queue management to the same time from prevent multiple
    jobs created at competing for the printer resources. It also drives the printer
    devices, sensing when the printer is non-functional or idle.


    Like the "cron", this daemon too, is activated during system startup. The "ps
    -ef" command shows this daemon as active.


    ```

    $ ps -ef

    UID PID C STIME TTY TIME COMMAND

    root 0 0 Apr 20 ? 0:01 sched

    root 1 0 Apr 20 ? 4:46 /etc/init -a

    root 2 0 Apr 20 ? 0:05 vhand

    root 3 0 Apr 20 ? 0:16 bdflush

    root 3259 1 0 12:55:50 01 0:01 /etc/gettty01 m

    root 3809 1 0 14:24:20 2c 0:04 -sh

    root 229 1 0 Apr 20 ? 0:04 /etc/cron

    root 237 1 0 Apr 20 ? 0:37 /usr/lib/lib/lpsched

    $

    ```


    The "lpsched" daemon has the process "init" as its parent as does "cron". This
    shows that both these processes became active as soon as the system was started.


    We have already seen that another way to determine whether the print scheduler
    is running or not, is to use the "lpstat -r" command.


    To activate this scheduler, after the system is up, the System Administrator can
    use the command:


    ```

    # /usr/lib/lpsched

    ```


    To shut down the print services in case of default printer malfunction, the System
    Administrator can use the "lpshut" command.'
