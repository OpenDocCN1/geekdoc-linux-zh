  md: '# Working With Unix


    This creates a “pio” archive file called “backup.pio” in the /data/bb8/private/
    directory. This archive file can be used to restore all the files that we copied
    into their respective directories, all in case of accidental erasure or corruption.


    As a success message, “pio” reports the number of blocks used to create the archive.
    In any errors occurred, this message will be ominously absent.


    A word of warning. Never create an archive by redirecting the output into a file
    in the same directory that you are archiving. This will create an infinite loop
    and a very large archive. The worst thing that can happen is that your entire
    disk space which is free, will be consumed, leading to a system crash.


    To recover a “pio” archive is no big deal. The “pio” command takes input from
    the medium that stores an archive, decodes the archive according to its internal
    scheme, and restores the files with identical characteristics.


    # Restoring “pio” archives:


    To restore files from an archive, we use the “pio” with the “-i” option (for copy
    in). A “pio -i” takes input only from the archive created by “pio -o”. No other
    format is compatible for the purpose. The “-c” and “-B” options have the same
    meaning for input as well as output. This means that if the archive was created
    with these options, the same options must be included while restoring the archive.
    If you fail to do so, “pio” will fail. So if you wish to install software that
    is in a “pio” format, you will have to experiment with these options. After all,
    you don’t know, what options were used to create the archive in the first place.


    ```

    $ cpio -icvB < /dev/rdsk/f0ql5dt

    ```


    ```

    dialup.c

    lan-proj.c

    ```'
