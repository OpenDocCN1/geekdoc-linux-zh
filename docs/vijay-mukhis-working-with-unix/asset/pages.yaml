    +   3. Terminal Emulation: With the phenomenal sales figures of personal computers,
    the need for these type of ‘emulated’ terminals arose. Terminal emulation permits
    the user''s PCs to act as emulated terminals. In such case, apesar of the PC having
    a microprocessor and memory of its own, it carries out no processing at all. Like
    a faithful terminal, it transmits it''s processing jobs to the host computer.


