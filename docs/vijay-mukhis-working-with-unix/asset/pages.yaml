    # Using Regular Expressions with “grep”


    Regular expressions facilitate pattern searching and increase the scope of the
    grep command. The grep uses all metacharacters that the Shell understands. We
    have covered these before, so let''s move ahead quickly.


    Let''s take a few examples with these special characters. To display patterns
    in the beginning of a line that starts with letters from “a” to “c”, use the command:


    ```

    $ grep -i ''^[a-c]'' data

    Canada 1852 24 North America

    China 3892 866 Asia

    Brazil 1286 116 South America

    Australia 1968 14 Australia

    Argentina 1002 26 South America

    ```


    The single quotes ensure that the Shell passes the pattern to grep exactly as
    we have specified it, without trying to interpret them itself. You could also
    enclose the same pattern in double quotes instead of single quotes, if that makes
    you feel better.


    In the above, if we had specified “[a,c]” as the range, then only all names beginning
    with “a” or “c” would have appeared in the listing.


    To search the file “data” for a pattern that begins with “I” followed by any character,
    followed by zero or more characters followed by “a”, use the command:


    ```

    $ grep ''I.*a'' data

    ```'
