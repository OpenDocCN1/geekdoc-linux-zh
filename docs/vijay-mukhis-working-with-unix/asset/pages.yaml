    To specify a field, you have to specify a field delimiter. The delimiter is a
    character that specifies the end of a field. By default, the delimiter is a tab.
    In our file, the delimiter for each field is a space. Hence to display the first
    field of the file, we use the **cut** command with the **-f** option as follows:


    ```

    $ cut -fl -d" " tally

    New-Zealand

    England

    South-Africa

    India

    Sri-Lanka

    West-Indies

    Australia

    Pakistan

    Zimbabwe

    $

    ```


    The option “-fl” specifies that we want to view only the first field in the file.
    The **-d** option should be followed by the delimiter of the first field. Since
    our delimiter was a special character, viz, space, we enclosed it in quotes. If
    the delimiter was a normal character, there would be no need to enclose it in
    quotes.'
