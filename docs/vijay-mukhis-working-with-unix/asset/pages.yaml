  md: '# $ export TERM


    The export command ensures that the Shell binds the new value of this variable.
    This variable now formally acquires its new value and after having issued the
    export command, the Shell will remember the value of this variable until the user
    logs out.


    To confirm that your new value for TERM has indeed been set, you could once again
    issue the env command.


    ```

    $ env

    HOME=/usr/user1

    HZ=60

    LOGNAME=user1

    MAIL=/usr/spool/mail/user1

    MAILCHECK=5

    PATH=/usr/bin:/bin.

    SHELL=/bin/sh

    TERM=vt100

    TZ=IST05:30:00

    ```


    The updated values for your environmental variables will be promptly displayed
    on the screen. In our example, we have shown you how to alter your terminal type.
    If you would like to alter the PATH variable, you could do so in the same manner.
    The syntax for path is a bit different. Each directory is separated from the other
    using a colon (:).


    ```

    $ PATH={your new path}

    $ export PATH

    ```


    We will explain later how to avoid the cumbersome task of setting variables at
    the start of every Unix session. With lots of ifs and buts, but we now close the
    third chapter of this book. It''s our sincere effort to reveal the intricacies
    of Unix using a step-by-step approach and in order of complexity. So keep an open
    mind and read on....'
