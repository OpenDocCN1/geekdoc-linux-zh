    # Moving the Cursor:


    If you press the arrow keys to move the cursor, you''ll curse yourself for having
    done so. In vi, the arrow keys can cause havoc. So don''t let your fingers ever
    wander to that part of the keyboard. There are exceptions to this rule. Certain
    types of terminals do support the use of the arrow keys. However to play safe,
    avoid using these keys as far as possible and stick to the general rules.


    All vi commands involve the use of alphabetical keys by themselves or combined
    with the Shift and Control keys.


    To move the cursor you could use the following keys:


    ```

    h or Bkspc           : Left

    l or Space Bar      : Right

    k or -               : Up

    j or + or Enter      : Down

    ```


    We''ve said it before and we repeat it, vi is case sensitive. If your “Caps Lock”
    is on, the above keys will result in completely different actions. Hence before
    you try to move the cursor, make sure that your “Caps Lock” is off.'
