  md: '# What’s In A File? The “file” Command:


    The **file** command not only lists the name of the file but also specifies the
    type of data that the file contains. Unix reads the contents of each file and
    actually understands what kind of file it is. For example, you could write a C
    language program and Unix will display that file as containing “c program text”.
    (DOS users would call it a miracle!), which is implemented by a file called “magic”
    which is present in /etc. When “file” is run, it examines the contents of the
    specified file and magically determines its true contents. How it manages to achieve
    this is really not our concern. After all magicians never tell. Just for a small
    demo of this magic, type in at the Shell prompt:


    $ file *


    The metacharacter * asks the **file** command to ascertain the file contents of
    “all” the files in the current directory.


    +   - Firstdir:directory

    - Myfile:ascii text

    - Tom.doc:ascii text

    - commands:commands text

    - env:ascii text

    - filelist:ascii text

    - myenv:ascii text

    - myls:ascii text

    - rem:ascii text

    - sample:empty

    - sets: Microsoft a.out separate pure segmented

    - standalone word-swapped 86 executable

    - speech:English text

    - temp:directory

    - test.c:c program text

    - touch_me_not:English text'
