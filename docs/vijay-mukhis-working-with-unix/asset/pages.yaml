- img_proc: true
  md: '# System Security


    Let''s say your umask is set to “000”. This implies that all your files will be
    created with system-wide default permissions of “666”, i.e., -rw-rw-rw and all
    your directories with permissions of “777” - drwxrwxrwx. This can be a major security
    risk.


    The sticky bit in a directory’s permission can ensure that with the most generous
    permissions, nobody can delete your files or overwrite existing ones. They may
    read your existing files and create new ones of their own, since your generous
    permissions permit it, but they cannot harm your existing files in any manner
    whatsoever. Let’s take an example.


    ```

    $ ls -ld crucial

    drwxrwxrwx 2 user group 64 Apr 03 12:53 crucial

    $

    ```


    Now since we (user1), own the directory “crucial”, we set the sticky bit for it,
    as follows:


    ```

    $ chmod u+t crucial

    ```


    Now a conspicuous “t” gets added at the end of the permissions of the directory,
    overwriting the last “x”. They now resemble:


    ```

    $ ls -ld crucial

    drwxrxr-t 2 user group 64 Apr 03 12:53 crucial

    $

    ```


    Notice the “t” at the end of the permissions field? Now the sticky bit will stick
    around and guard the files in that directory.


    An intruder can easily access that directory and read the files within, if the
    file permissions allow it. But when he tries to remove any file or overwrite an
    existing one, the sticky bit will give him a run for his money.


    345'
