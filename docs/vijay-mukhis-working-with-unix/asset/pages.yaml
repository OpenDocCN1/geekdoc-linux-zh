    One basic flaw. The reason for the failure of this process is reason Number 7
    above. The file is too small anyway, and compressing this file would lead to no
    saving of any blocks of disk whatsoever. Block sizes in Unix are set in multiples
    of 512 bytes. On our disk a block was defined as 1024 bytes. Hence packing will
