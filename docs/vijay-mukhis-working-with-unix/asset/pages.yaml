- img_proc: true
  md: '3. File Access Permissions: We have seen above, the security measures that
    Unix provides. Individual file permissions only serve to enhance them. These permissions
    are also part of the inode of a file.


    4. File Access Times: Unix gives tremendous amount of importance to time and records
    for each file, its last access and modification times in the inode.


    5. Number of Links to the File : Links are different names given to one and the
    same file. Note that, though a file may be given more than one name, it always
    has one distinct and unique inode. Therefore we have to understand that a link
    to a file is not a new copy of the file with a different name, but simply the
    same file with a new name. A file may be accessed by specifying its name or by
    specifying the names of one of its links.


    6.File Size: The size of the file in bytes is also stored in its inode.


    7.Disk Addresses: These are addresses of disk blocks that contain the data in
    the file. A file is rarely stored on a disk in contiguous blocks. Therefore to
    retrieve a file, the addresses of the blocks that contain the data are stored
    in a tabular format in the inode.


    In the above section you have learnt all you need to know about the Unix filesystem.


