    # More Cursor Movement Commands:


    If you''ve got the hang of the cursor movement commands, the following commands
    will help you move around faster.


    +   #w : Moves forward a word. It assumes that punctuation like commas and apostrophes
    are the next word and halts there.


    +   #W : It moves a word forward till the next space. It recognizes punctuation
    to be part of the word.


    +   #e : Takes you to the last character in the word.


    +   #E : Takes you to the end of the word, and ignores any punctuation.


    +   f[character] : Moves the cursor to the right upto the specified character
    in the current line.


    +   F[character] : Moves the cursor to the left upto the specified character in
    the current line.'
