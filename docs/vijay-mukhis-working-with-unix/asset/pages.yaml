    # The “su-id” bit: A Temporary Privilege


    This concept is best understood with an example straightforward. Let''s take the
    example of the /passwd file that is present in both, the /etc and /bin directories.
    The /bin/passwd is an executable file that permits users to change or delete their
    existing passwords. The /etc/passwd file is a highly protected data file where
    Unix stores information about users and their passwords.


    ```

    $ ls -l /etc/passwd /bin/passwd

    --r-s-x- 1 bin auth 91860 Jun 11 1990 /bin/passwd

    -rw-rw-r- 1 bin auth 2035 Mar 04 18:01 /etc/passwd

    $

    ```


    The permissions of these two files are of interest to us. The passwd file in /bin
    has an s in its permissions field. Now let''s understand why.


    The passwd file in the /etc directory does not allow users to write into it directly.
    However, this same file can be modified by any user who invokes the passwd executable
    file from the /bin directory.'
