  md: '4.The data block: They contain file data and administrative data. An allocated
    data block can belong to one and only file in the filesystem. This is why it is
    a good idea not to have the block size greater than 2048 bytes, since even small
    files of say 1000 bytes will occupy a whole data block, thus wasting a whole 1048
    or more bytes in the process.


    The structure of an inode is as follows :

    The following fields are included in a typical inode for a disk file in Unix.


    ![](img/2b13e596b1053c0c9f492dfe40dfa70a_50_0.png)


    Figure 7


    +   1. The File Owner : The file owner is the person who created the file. Ownership
    is divided between the owner and the group to which owner belongs.


    +   2. File Type: The file may be a regular file, a directory, or a special file.
    This is explicitly specified in the inode of the file.'
  merge: -1
