  md: '# Pattern Searching:


    This feature helps you search and replace strings (which vi calls patterns) in
    the file. The two commands that are relevant for pattern searching are:


    +   /g : Search forward. Go to the next line with g


    +   ?g : Search backwards. Go to the next line with g


    +   n : Same direction. Repeat the last "/" or "?" command.


    There are numerous options as usual. The choices are wide and infinite. The use
    of metacharacters explained in Chapter 2 makes the task of searching for strings
    far more easier. Some of the useful formats for pattern searching, along with
    the relevant metacharacters, are shown below.


    +   * : Implies zero or more occurrences of the character preceding it.


    +   . : A wildcard that stands for any character except new line. It is analogous
    to the joker in a pack of cards.


    +   [ ] : Specifies the range or a set of characters.


    We recommend that you create a sample file and try out all these search formats.
    But there''s no point in simply searching for patterns without being able to replace
