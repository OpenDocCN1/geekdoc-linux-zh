  md: '# Working With Unix


    To perform jobs on a regular basis, you would use the crontab command. The syntax
    of the crontab command is:


    ```

    $ crontab [file]

    ```


    Each user has a crontab file which stores the commands that the user wants to
    execute on a regular basis. This file is stored as /usr/spool/cron/crontabs/name.
    The cron daemon regularly executes jobs that are listed in this file. We don''t
    need to tell you now, that your logon should be part of the cron.allow file. If
    you happen to be among the lucky ones, you can put this optimum scheduling utility
    to real good use.


    First, create a file in your home directory as per the crontab file format. Then
    using the crontab command, you can have this file automatically transferred to
    the /usr/spool/cron/crontabs directory, where it will be given your logon. Now
    the cron daemon will read this file and execute the commands listed in it, on
    a regular basis.


    The most important part of this relatively simple process is understanding the
    crontab file format. Remember that you must create your command file exactly as
    per the format of the crontab file listed below. If you go wrong here, you could
    incur the wrath of the cron daemon who could wreak havoc.


    The fields of the crontab file are as follows:

    (Min) (Hour) (DOM) (MOY) (DOW) (Command)


    This implies that first you have to state the minute, the hour, the day-of-the-month
    (DOM), the month-of-the-year(MOY) followed by the day-of-the-week. All this, before
    you actually specify the command itself.'
  merge: -1
  pgno: 309
- img_proc: true
  md: 'There are several ways in which you can specify legal values for each of the
    fields. Let''s take the minutes field. Legal values obviously range from 0 to
    59.


    Let''s create our own file of commands to be executed by **cron**. The fields
    of the **crontab** file format have been listed again, above the file for your
    convenience.


    | (Min) (Hour) (DOM) (MOY) (DOW) (Command) |

    | $ cat cron-commands * * 1-6 >> /tmp/whofile 2>/dev/null |

    | 0 9 1,15 * 1-6 echo Today is payday > /dev/tty2c |

    | 0 10 14 10 * mail -s ''Happy Birthday'' mary < greet $ |


    Let''s evaluate these three commands that we have included in our "cron-commands"
    file, one field at a time. The fields are listed above with their values appearing
    below each. Note that each field in the file is separated by a space or a tab.
    Do not use any other field separator.


    | Min Hour DOM MOY DOW Command |

    | 0 18-23 * * 1-6 who >> /tmp/whofile/dev/null |


    This command is a very important security measure that is incorporated in most
    Unix installations. It keeps track of who was using the system every hour, starting
    from 6 PM onwards upto midnight, and appends the information about the users in
    a file called "whofile" in the `/tmp` directory. For the day-of-the-month and
    month-of-the-year fields, we have put a * to indicate all possible values. For
    the day-of-the-week field, we have put specified 1-6 so as to exclude Sundays.
    Sundays are represented as 0 in the day-of-the-week field.'
