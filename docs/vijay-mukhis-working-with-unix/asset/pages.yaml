- img_proc: true
  md: '# Pipes,Filters And Pattern Searching


    # Heads:


    The cat command displays the full contents of a file. For a long file, the screen
    may scroll very fast and viewing a particular portion of the file, may become
    rather difficult. What we basically need is a strong and robust tool that displays
    the contents of a file, in exactly the same format that we desire.


    A simplistic filter in Unix is the head command. This utility was developed at
    the University of California at Berkeley. It occurred to us at this stage, that
    commands created at UC-Berkeley are inevitably named after parts of the human
    anatomy. You will recall the last time we had used a UC-Berkeley utility, called
    finger !! Strange the ways of Unix as well as those who made it possible.


    The head command displays the first ten lines of a file when no options are specified.
    Locate a long text file in your directory and then type the command:


    ```

    $ head longfile

    ```


    This will display the top ten lines of "longfile". With a filter, variations are
    always possible. By default, a terminal displays 24 lines in one screen. To display
    precisely 13 lines of "longfile", you may use the head command, as:


    ```

    $ head -13 longfile

    ```


    Now thirteen lines from the start of "longfile" will be faithfully displayed on
    screen. Note that the "filter" action of head ensures that the output appears
    in the format of our choice, i.e. thirteen lines from the start of the file.


    183'
