  md: 'This was the main reason why we kept emphasizing the importance of the System
    Administrator. He can eliminate you, wipe out any trace of the system, with a
    single command!! A bit too much authority given to one single individual. So if
    you can''t flatter, eulogize and what-have-you, at least make sure that you don''t
