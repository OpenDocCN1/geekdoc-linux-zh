- img_proc: true
  md: '# Unix: The Fundamental Principles


    For Thompson and Ritchie a dream had come true. Unix had indeed become force to
    reckon with. An operating system that caught on and spread with the fury and vengeance
    of a forest fire in autumn. It had come to exemplify that a multitasking, multiuser
    operating system could ever be. Decades of painstaking research and persistence
    had eventually paid off. In 1983, Thompson and Ritchie were conferred with the
    ACM Turing award in recognition of their pioneering work on Unix. The accolades
    and laurels seemed to be of little importance to the duo. The fact that their
    research had actually produced a powerful and widely accepted operating system
    was by far more satiating. Unix became the de-facto standard on all multiuser
    installations and still reigns supreme.


    By present estimates, over a million people use the Unix operating system and
    it is available on more than 100 diverse hardware platforms from the draconian
    supercomputers to the ubiquitous micros. Impressed? We were.


    # Unix: The Operating System


    An operating system is a program that acts as an interface between the user of
    a computer and the computer hardware. Its primary goal is to use the computer
    resources and hardware in an efficient manner and its secondary goal is to make
    the computer convenient to use.


    An operating system is alternatively defined as a “Control Program” that coordinates
    and controls all the activities of a computer. If it hadn’t been for operating
    systems, the computer would have been a futile box of gizmos and gadgets, boards
    and chips.'
  merge: -1
  pgno: 32
- img_proc: true
  md: '# Working with Unix


    In this chapter, we will introduce you to a host of technical concepts that are
    associated with Unix and must be understood to acquire a sound working knowledge
    of the Unix operating system. This chapter is food for thought. It will raise
    a plethora of questions and queries in your mind, which we will slowly unravel
    in the course of the book.


    # Unix: Hardware Requirements


    To run Unix on your computer, there are a few basic requirements your computer
    must fulfill in terms of processing power, memory size and disk space. Ideally,
    to run Unix, you need a 16-bit microprocessor (80386/80486) or preferably about
    3 Megabytes of Random Access Memory(RAM) for optimum performance. The hard-disk
    space should be about 80 Megabytes or more.


    Besides this hardware, Unix requires a considerable amount of human support. Every
    Unix installation generally has a Human Manager called the System Administrator.
    The System Administrator''s tasks include supervision and control of Unix on the
    installation.


    # Salient Features of The Unix Operating System


    The Unix system offers many salient features, the most important of which are
    :


    # Multitasking Capability:


    This implies the capability of the operating system to perform several tasks simultaneously.
    It''s what modern day executives do in work environments with great stress. Talk
    on the phone, read a memo at the same time and even sip a cup of coffee. In the
    same manner, Unix can print one document, edit another and sort a list,of files
    at the same time. A multitasking operating system was a great leap from erstwhile
    systems which carried out sequential batch processing.'
  merge: -1
  pgno: 33
- img_proc: true
  md: '# Unix: The Fundamental Principles


    Multiple tasks can be carried out by placing other tasks in the ''background''
    while you work on one task at a time. The current task is then said to be in the
    ''foreground''. Background tasks are generally those which do not involve active
    interaction from the user. A typical example of a background task is that of sorting
    a large mailing list whereas a foreground task may involve creating a document
    with a wordprocessor.


    The rule with multitasking is rather simple. The more tasks you have running in
    the background, the slower will be be the system response. Hence it''s a good
    idea not to go overboard with this utility.


    # Multiuser Capability:


    A multiuser operating system permits several users to use the same computer to
    carry out their computing jobs. Several terminals (a keyboard and a display) are
    connected to a single powerful computer and each user of the terminal can run
    programs, access files and print documents at the same time.


    The need for a multiuser environment arose when several groups of programmers
    worked on developing the same software. Each group was assigned a separate task
    and all groups had to ensure complete coordination and compatibility. Multiuser
    capability saves a considerable amount of time by allowing more than one person
    to work on a set of information at a time.


    It was found on great deliberation, that buying a single multiuser computer was
    far more economical and efficient than buying several single user computers. Since
    this transition made a lot of sense, Unix gained immense popularity in multiuser
    programming environments.'
  merge: -1
  pgno: 34
- img_proc: true
  md: '# System Portability:


    One of the outstanding features that Unix possess is the ability to port it itself
    to another installation without the need to incorporate any major changes. This
    ability to adapt to different computers has, in fact, made a major contribution
    to the stupendous success of Unix.


    Small changes, however, are inevitable when Unix is ported from one computer to
    another. We have mentioned before that Unix runs on more brands of computers than
    any other operating system. So a user can safely upgrade to a better computer
    and have no fears about altering his operating system as well. That''s versatility
    at its very best for you.


    # Communications:


    Unix supports two major types of communications:


    +   i) Communication between different terminals connected to the same computer.


    +   ii) Communication between users of one computer at a specific location to
    the users of another type and size of a computer located elsewhere. The two computers
    maybe located in different offices, and different countries or continents and
    maybe manufactured in opposite ends of the world. Unix operation has scaled the
    barriers and in a way united more different types of computers than any other
    operating system around. In fact the so called ''Hardware Wars'' came to an unexpected
    halt with the appearance of Unix.'
  merge: -1
  pgno: 35
- img_proc: true
  md: 'todays world of optical fibers and fax machines, the utility of Unix has carved
    out a niche for itself as far as intercontinental communication goes. One of the
    favorite Unix services worldwide is the mail system based on Wide Area Networks
    (WANs), which are networks that span continents and may be connected through telephone
    lines or satellites. This does not undermine the inter-user communication on the
    same system, which continues to remain substantial as ever.


    You could safely use this communication to ask a colleague out for a date or even
    send those sweet little notings to a gorgeous co-worker. Rest assured that only
    the person you intend to send the message will be able to read it. There''s no
    ‘tapping lines’ with Unix.


    # System Security:


    Unix offers as much security as Fort Knox. The ‘gold’ in this case, however, is
    the user’s data. Several levels of security exist in Unix. The first level is
    system security. This ensures that not just anybody can start running Unix on
    your system. A standard ‘login’ procedure has been incorporated before Unix even
    starts running the system. This procedure may include a cryptic password that
    each user is allowed to maintain.


    Another level of security is incorporated into Unix, when it comes to accessing
    files. Three permissions namely ‘Read, Write and Execute” (r,w,x) can be assigned
    by the ‘owner’ of a file to each of his files. All these permissions can be individually
    conceded or denied to all other users of the system.


    A third level of security allows users to encrypt data files on the disk, so that
    even if someone manage to access them, he can’t make much sense of it.'
