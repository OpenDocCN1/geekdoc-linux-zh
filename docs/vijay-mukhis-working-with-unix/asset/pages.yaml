    # The "expr" command:


    Although the Shell programming language is not optimized

    for numerical calculations, commands are provided to

    perform mathematical computation. Among these

    commands, the "expr" command is the most useful.

    "expr" (for expression), accepts a mathematical expression

    as its argument and computes the result. The result is

    displayed on the standard output.


    ```

    $ expr 4 + 7

    11

    $

    ```


    Note how a space separates each component of the

    mathematical expression from the other. Longer commands

    are also permitted but only integer numbers are acceptable.

    The "expr" command performs the four basic mathematical

    operations. The symbols "*" and "/", for multiplication and

    dision, respectively, must be "escaped" from the Shell

    using a "\" or backslash.


    ```

    $ expr 2 \* 4

    8

    ```


    461'
