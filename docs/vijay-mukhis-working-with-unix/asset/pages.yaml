    \  command2\n  .\n  last command\ndone\n```\n\nThe “while” for combines some of\
    \ the characteristics of both the “for” and the “if” constructs. It takes a first\
    \ section of commands which may be “test” conditions, amongst another group of\
    \ commands enclosed in a “do-done” section. If the “test” part resolves true,\
    \ then the commands in the “do-done” section are executed. After the “do-done”\
    \ section is executed, the “test” section is executed once again to check for\
