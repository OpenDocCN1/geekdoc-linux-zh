- img_proc: true
  md: 'As shown above, `/etc/default/tar` contains default values for the device,
    blocking factor, volume size and the device type. This variety of information
    is very useful when it comes to actually using the “tar” command. Instead of specifying
    the scores of details about the archive, you can simply use the number of the
