- img_proc: true
  md: '# Processes And How Unix Handles Them


    # Scheduling Tasks For Future Execution:


    Scheduling of tasks is an important area in any multitasking operating system.
    For any task to get fair access to the CPU, the timing mechanisms within the operating
    system must allow switching to a new process, when one process has finished using
    its share of the CPU resources.


    The Unix operating system has excellent tools that permit the timing and scheduling
    of processes, with time scales that range from milliseconds through years. The
    superlative understanding that Unix has dates and time, is one of the main reasons
    for these extraordinary task scheduling features. Timing is so important in Unix,
    that nearly all Unix machines have built-in, battery-operated clock/calendar hardware
    that keeps a twenty four hour clock ticking even when the machine is turned off.
    For correct operation of administrative functions, the system must be "up" nearly
    100 percent of the time.


    To make the best of this machine time, users are allowed to schedule their tasks
    and processes to be executed at a specified time, minutes, hours, days, weeks
    or even years later. The system remembers these tasks, and executes them without
    any prompting from the user at the appropriate time specified by him. We will
    now cover some very useful commands that provide for automatic scheduling of the
    users'' tasks and the mechanisms that make it possible.


    # The "cron" Daemon:


    All job timing and scheduling commands in Unix use the services of a powerful
    scheduling mechanism that is always running in the system. This mechanism is the
    cron (for chronograph) daemon. We encountered the cron daemon earlier in the output
    of the ps -e command.'
  merge: -1
  pgno: 300
- img_proc: true
  md: '# Working With Unix


    The **cron** is a system sequence of all Unix systems. It is often called a "sleeping
    daemon" (we''ve heard of sleeping beauty, but this goes too far!). The **cron**
    daemon ''wakes up'' every minute to check whether there are any jobs queued for
    it to execute. If there are jobs, it executes them and goes back to sleep for
    another whole minute. And, we thought we were being overworked.


    Though always present, the **cron** takes up very little CPU. The executable file
    for this daemon is kept in the /etc/cron directory. However, as explained before,
    the **cron** is not an executable command and must not be executed directly, even
    by the superuser. It''s Unix''s business to see that the **cron** is up and running
    before the system becomes available to all users.


    In this section, we will outline the various activities of this all-important
    daemon, as we proceed from one scheduling command to another. You''ll be hearing
    a lot about **cron** in this section.


    # The "at" and "batch" Commands:


    The **at** command gives the user the facility to schedule jobs for later execution.
    It places the job in a queue and returns "job-id" to the user. The **at** command
    is not accessible to all users of the system, since this command includes appropriate
    security measures to allow or deny access to it. The person who is allowed to
    give you this access, is none other than the omnipotent System Administrator.
    Who else?'
  merge: -1
  pgno: 301
- img_proc: true
  md: 'The at command accepts valid Unix commands to execute at later dates and times.
    These commands can be entered at the command line itself or from a file that contains
    these commands. Let''s try using the at command to execute a command at a specified
    time from the command line itself. The syntax to enter commands from the command
    line is:


    ```

    $ at time [date] [increment]

    Commands\.

    (Ctrl-d)

    ```


    The minute you press "Ctrl-d", the at command will display the job-id of this
    job, along with the date and time that you requested its execution to occur. The
    job-id will terminate in “a", to signify that this job was submitted using the
    at command.


    Lets take a real-life example. We were working so hard for this book that we became
    workaholics who didn''t realize when it was lunchtime. So we used the at command
    to remind us to take that all-important break. After all, all work and no play
    would result in one major boring book.


    ```

    $ date

    Tue Mar 24 10:50:42 IST 1992

    $ at 13:00

    banner lunchtime > /dev/tty2c

    (Ctrl-d)

