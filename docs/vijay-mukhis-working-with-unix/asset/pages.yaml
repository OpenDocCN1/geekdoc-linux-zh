    The signal 9, cannot be ignored and overridden by any process other than the system
    daemons. For example, you cannot kill the **sched** process using this signal,
    for the obvious reason that it will affect the working of the entire system.


    The second remedy for a hung terminal is the System Administrator. The man himself
    is a walking-talking, Unix trouble-shooting guide. The superuser can kill a process
    that is running on any terminal of the system. His powers are unlimited.


    # Have A ‘nice’ Day: The “nice” Command


    In a multitasking system, processes are fighting and grappling to gain what is
    called “priority”. It’s a small word with large implications. When a process gains
    priority, it obtains the attention of the CPU much faster than the other eligible
    suitors. And the timing is what makes all the difference. The CPU, like a fair
    maiden, is most sought-after, and the earlier you make the queue, the better.'
