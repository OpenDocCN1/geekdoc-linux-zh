    # Searching For A Command?


    The "type" Command:


    Very often, users have all sorts of problems with Unix because the environment
    variable PATH is set all wrong. As we have already explained, the PATH variable
    tells Unix in which directories it has to search for the executable file of the
    command typed at the command line.


    Most Unix commands are located in the /bin directory, so it must be the first
    directory to be listed in the PATH. Other Unix commands are located in /usr/bin
    and /etc. Let''s say that, /usr/bin was not included in your path. Now if you
    typed vi at the command line, the shell will display:


    ```

    $ vi myfile

    vi: not found

    $

    ```'
