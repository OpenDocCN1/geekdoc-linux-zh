- img_proc: true
  md: '# Getting Started With Unix


    To end our preliminary session with Unix, we have to ''logout'' so that the system
    is aware of the fact that we have completed our session. If you simply switch
    off your terminal or PC (if your are using a terminal emulator program), any user
    who starts the computer will be automatically logged in. The dumb terminal will
    not be able to ascertain the identity of any dubious user who starts the system
    again. That’s dangerous! To avoid any untoward incidents, logout by pressing the
    “Ctrl-d” keys and safely switch off your terminal.


    Alternately you could type in the exit command at the Shell prompt to logout.
    Once you have done so, your Unix session is officially over and the system now
    excludes you from the current users.'
