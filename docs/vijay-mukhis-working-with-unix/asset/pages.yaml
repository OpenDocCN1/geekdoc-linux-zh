- img_proc: true
  md: 'Most experts agree that Unix security is old fashioned. Ideal for the good
    old days when people used to mind their own business. But in the modern world,
    where the rat race is overwhelming, ethics has become just another archaic word
    in some corner of the dictionary.


    There are basically three distinct levels of security in Unix.


    +   1. The first and most important is the password, which is the most formidable
    shield that every Unix user has. Lose this protection, and the battle is as good
    as lost.


    +   2. Directory Permissions. These are one level higher than file permissions
    and are crucial in deciding the fate of files that exist within them.


    +   3. File Permissions. The lowest level, but certainly not the least effective.
    File Permissions, when used appropriately, only help strengthen and fortify the
    security setup.


    Having tackled file permissions in great detail, let''s come to “Directory Permissions”.
    But a directory is merely a file in Unix.


    So what''s new? You''ll see.


    # Directory Permissions Dissected:


    In this section, we will examine the implications of directory permissions, first
    taken individually, and then in the various combinations possible. It may seem
    like a long and arduous trip, but at the end of it, you''ll thank your stars persisted
    on this pivotal security issue.


    The significance of each permission in a directory is multifold. Like all files,
    a directory too has a read(r), write(w) and an execute(x) permission for its owner,
    group and others.'
