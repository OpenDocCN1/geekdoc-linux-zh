    Visualize a pipe as a cylindrical rod open at both ends that has somehow found
    its way into the memory of the computer. Now consider that the ls program executes
    and forces its output into one end of the pipe and the wc program reads the data
    from the other end. At the end of this process, the wc program prints the number
    of lines in the directory listing and the pipe is destroyed. The user finds out
    just how many files exist in his current directory. Multiple task executed.


    A piping operation can be specified from the command line itself. To pipe the
    output of one command to another, insert the pipe symbol, |, between the two commands.
    The Shell then creates a pipe for this operation and the first command writes
    into one end of it. At the other end, the second program acquires the output of
    the first and starts processing it. Finally, the processed output is written onto
    the standard output when the second command terminates. Let’s try out the example
    that we’ve been studying so far.


    ```

    $ ls | wc -l

    49

    ```


    Note how the output of the second command only was displayed on the screen. That''s
    precisely what we were looking for. The number of files in the current directory.'
  merge: -1
  pgno: 207
- img_proc: true
  md: "# Pipes, Filters And Pattern Searching\n\nNow that you've actually used a pipe,\
    \ we'll explain some additional properties of a pipe. A pipe can be thought of\
    \ as an-named temporary file in memory. The command to the left of the pipe symbol\
    \ is granted write-only permission to this file, so it writes its output to this\
    \ file and terminates. That is why the output of the first command does not appear\
    \ on the standard output. The command to the right of the pipe symbol is granted\
    \ a read-only permission for this file. So it quickly proceeds to read the data,\
    \ and process it. When it's through, its output is displayed on the standard output\
    \ and the temporary file is discarded from memory.\n\nTherefore one of the most\
    \ important advantages of pipes is that they prevent the need to create unnecessary\
    \ files by input/output redirection. Since they are temporary files in memory,\
    \ they serve as valuable substitutes to disk files.\n\nLet's take some further\
    \ examples to make the whole concept clearer.\n\nTo count the number of lines,\
    \ words and characters in a text file, you could pipe the output of the `cat`\
    \ command to the `wc` command, as follows:\n\n```\n$ cat count | wc\n      4 \
    \       23        114\n```\n\nWe will take you back a little. Compare this output\
    \ to the one shown above and you will notice that the filename \"count\" is missing.\
    \ This is because, this time, the command took its input from the pipe and not\
    \ the file directly. Hence it did not print the name of the file. More proof that\
    \ a pipe is a temporary, un-named file in memory."
  merge: -1
  pgno: 208
- img_proc: true
  md: 'There''s one more point we''d like to make. To work with pipes, you don''t
    have to take two commands at a time. You could use several commands and make the
    pipeline as long as you like.


    In this chapter and the ones to follow, you will see pipes scattered all over
    the place. Therefore make sure that you''ve grasped the concept properly. Experienced
    Unix users make the fullest use of pipes since they are both convenient and speedy.
    The true efficacy and powers of pipes will manifest themselves when they are used
    with filters.


    # Filters: The Pipe''s Best Friend


    A "filter" is a device that reads from the standard input and writes to the standard
    output in a particular format. The format of the output depends upon the properties
    of the filter. Most Unix programs are filters since, wherever possible, they read
    from the standard input and write to the standard output.


    We will now introduce the various filters and insert examples wherever necessary,
    that combine filters with pipes. Filters combined with pipes make a splendid recipe.


    So keep an open mind and fathom as much as possible.


    # Heads Or Tails?


    Toss a coin. Well, you can get either heads or tails. But when you''re working
    with Unix, you can get both! Here''s how.'
