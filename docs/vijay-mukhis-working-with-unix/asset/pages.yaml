- img_proc: true
  md: '# SHELL PROGRAMMING


    The prelims are over. Finals are around the corner. The acid test of all our Unix
    knowledge and fundamentals. The Shell programming final.


    This examination (as we would like to think of it) will not be easy. The syllabus
    includes the entire gamut of Unix commands combined with the syntax of a programming
    language called the Shell programming language. Formidable indeed. So pull out
    the old notes, make a pot of piping coffee, and comfortably settle into the study.


    As far as Unix commands go, we presume you''re an expert. But this new programming
    language is going to take some slogging. On your part and ours.'
  merge: -1
  pgno: 448
- img_proc: true
  md: 'As always, we start with the fundamentals. The rationale behind the language
    and its programs. What are the benefits, how will this language change your perspective
    of Unix and finally a series of real-life examples of its power and efficacy.


    The Shell programming language is different from other programming languages,
    in the sense that you don''t require a separate compiler. The Shell does it all.
    Command interpretation and program execution. Shell programmer can use one of
    the numerous Unix editors to type out the program, and leave the rest to the Shell.


    # The Basics of Shell Programming:


    A file that contains a collection of valid Unix commands is called a Shell Script
    or a Shell Program. The Shell programming language incorporates almost all features
    that most modern day programming languages offer. Programmers will find many familiar
    concepts in Shell programming, though most users can attempt this with only a
    basic knowledge of programming concepts.'
  merge: -1
  pgno: 449
- img_proc: true
  md: 'Shell programs constitute the use of a variety of valid Unix commands under
    certain conditions. We are already familiar with a whole gamut of diverse Unix
    commands, so in many ways, this chapter will revise and put to test our knowledge
    of these commands. However, in this chapter, you will see these commands in a
    slightly different light. Instead of being used to perform a single task, they
    will be effectively combined with other commands to perform complex tasks. And
    the true power of Unix and its Shell will come to the fore.


    The power of Shell programming can be fathomed from the fact that several crucial
    tasks, as system shutdown are entirely implemented by Shell scripts that are supplied
    with the Unix version.


    Learning Shell programming is a great way to test your fundamental knowledge in
    Unix. Which is why we have covered it so late in the day. You''ve got to get the
    hang of the system before you graduate to Shell programming. To learn Shell programming,
    you have to know the Unix system as well as the Shell language in a thorough manner.
    You can''t learn one and ignore the other. It''s both or none.


    Now, we will explore in great detail, the powerful aspects of the Shell programming
    language as well as the role of the Shell in executing the Shell Scripts.


    # Unix Shells Revisited:


    # Shell Programming Perspective:


    We have already been introduced to Unix Shells in Chapter 1. We have analyzed
    the merits and demerits of the three most widely used Unix shells: the Bourne
    Shell, the C Shell and the Korn Shell.'
  merge: -1
  pgno: 450
- img_proc: true
  md: '# Working With Unix


    Unix Shell programs are usually not compatible with each other. By this, we mean
    that a Shell Script that works just fine with the Bourne Shell will not work under
    the C Shell and vice-versa. This is because different Unix shells use their own
    mechanisms to execute commands that the user types in. Therefore before jumping
    into Shell programming, let''s take a closer look at Unix Shells and their characteristics.


    **The Bourne Shell:** The original Shell. The real thing. Created by Steve Bourne
    of AT&T, this shell is a ''standard'' in most Unix installations around the globe.
    It is arguably one of the most widely used Unix Shells in existence today.


    Because it is universally available, most Shell programs are written using the
    Bourne Shell language. In this book, we have particularly emphasized and covered
    the language of the Bourne Shell.


    **The C Shell:** A high-profile product of the University of California at Berkeley.
    Created by Bill Joy, the man dubbed as the ''Joy of Unix''.


    The C Shell was so called because its programming language resembles the C language
    in many ways. That makes it entirely different from the language of the Bourne
    Shell. Only the very basic Shell scripts will run unde: both the C and the Bourne
    Shell; a vast majority will not.


    One of the most obvious ways to spot and identify the C Shell is its ''%'' (percent
    sign) prompt. This is the trademark of the C Shell.'
  merge: -1
  pgno: 451
- img_proc: true
  md: 'In addition to a vastly different programming language, the C Shell incorporates
    some features over and above those offered by the Bourne Shell. A convenient “history”
    mechanism ensures that the Shell remembers commands typed by the user and allows
    him to reinvoice commands in a flash.


    Another ‘first’ with the C Shell was a unique “command aliasing” feature that
    permits the user to assign a short and convenient name to a frequently used command.
    We have already seen so far, how long and tedious Unix commands can be with their
    plethora of options. And a single mistake at the command line, one wrong key pressed,
    and there’s a barrage of error messages. This will help you appreciate the purpose
    of the command aliasing feature of the C shell.


    All these features seem to be pointing in one direction: ease of use. Therefore
    many Unix users and experienced C programmers consider the C Shell and its programming
    language superior to that of the Bourne Shell.


    **The Korn Shell:** This shell is ‘backwards compatible’ with its predecessor,
    the Bourne Shell. Also a Bell Laboratories product created by David Korn, as late
    as the 1980s, it showed all due respect and consideration for its senior counterpart,
    the Bourne Shell. Consequently, all Bourne Shell programs are compatible with
    the Korn Shell. It even uses the same dollar “$ prompt as a mark of respect.


    In a very shrewd move, the Korn Shell was created to incorporate all the enhancements
    that the C Shell had to offer, like command aliasing and a similar, but more powerful
    history mechanism. The way things stand today, the superlative Korn Shell is regarded
    by most as the eventual successor to the throne since the Bourne Shell is past
    its heyday.'
  merge: -1
  pgno: 452
- img_proc: true
  md: 'From the above discussion we conclude, that learning Bourne Shell programming
    is indeed a good idea since programs written using its programming language will
    also be compatible with the Korn Shell as and where it exists. A bonus of sorts.


    # Why Learn Shell Programming?


    Learning the Unix operating system involves two major phases. One is a thorough
    study of the operating system fundamentals and Unix commands, whereas the other
    involves a study of Shell Programming. If you''re familiar with both, you''re
    a Unix professional in the true sense of the word.


    Shell programs can be used for a variety of tasks from customizing your environment
    file to automating your daily tasks. Your "profile" file that executes while you
    login, represents your daily trust with Shell programming as does the more complex
    Shell Script, the "/etc/profile" or "/etc/shutdown".


    In a nutshell, Shell programming will prove to be immensely beneficial when it
    comes to:


    +   1.Automating repetitive tasks. Shell programming is a speedy and convenient
    tool to execute a batch of complex or repetitive tasks on a regular basis. A Shell
    script, once designed, can be permanently used to execute the task, till someone
    goes and installs a new Shell for the system.


    +   2.Executing important system procedures. Shell programming is used extensively
    by the Unix operating system itself to carry out crucial system tasks. There is
    a certain logical order in which procedures such as system shutdown should be
    executed. The best way to implement the procedure would be to use a Shell script.'
  merge: -1
  pgno: 453
- img_proc: true
  md: 'In many ways, Shell programming represents the culmination of the mastery and
    skills that any user can acquire in Unix. Since a user cannot talk to the Kernel
    directly, effective handling and manipulation of the Shell represents a zenith
    of a user''s mastery of Unix.


    # How Shell Programs Work:


    Throughout the book so far, you have learnt how to execute commands at the command
    line. We have also learnt of the mechanism that the Shell uses to understand and
    interpret the commands that are entered at the command line.


    The very basis of Shell programming stems from the fact that the Unix Shell can
    accept commands not only from the keyboard but also from a file.


    We already know that when a user logs in to the system, Unix starts up a Shell
    called the login Shell for that user. The login Shell prompts the user for commands
    and executes them if they are valid.


    The login Shell that you acquire, depends upon who you login as. For example,
    the login Shell for the root, grants the user (who is called the superuser) powerful
    and unlimited privileges as as to the Shell of an ordinary user, though both have
    invoked the same executable file, "bin/sh".


    Now when you execute a Shell program, the login Shell creates a new interpreter
    and waits idly in the background while the new Shell executes your Shell program.
    When all the commands in the Shell program have been completed, the new Shell
    terminates and your login Shell takes control again.'
  merge: -1
  pgno: 454
- img_proc: true
  md: '# Working With Unix


    It is most important to realize that any task that can be accomplished from the
    command line, can also be accomplished by a Shell program and vice-versa. In both
    cases, the same agent, the Shell, is doing the job of command interpretation.
    So there are no limitations whatsoever. Only more convenience.


    To summarize the above discussion, there are a few noteworthy points we''d like
    to make.


    +   1. A login Shell gets its commands from the keyboard whereas a Shell executing
    a Shell script, takes its input from a file.


    +   2. When the Shell executing commands from a file completes its job, the Shell
    takes control once again. The Shell only terminates when the user finally logs
    out of the system by pressing "Ctrl-d". This key signals "end-of-day" to the Shell,
    causing it to terminate. Remember that the Shell is also an executable file which
    is created to accept input from the user. Thus when it gets a "Ctrl-rl-d" as its
    input, it understands that the user has nothing more to say, and terminates unceremoniously.


    # Characters With Special Meaning To The Shell:


    Before embarking on a journey into the depths of the Unix Shell, it is very crucial
    to strengthen our knowledge of the metacters or regular expressions and other
    special characters that the Shell understands. In fact, incorrect use of special
    characters is one of the primary reasons for the failure of Shell programs.


    We have seen before, how the Shell accords a special meaning and significance
    to these characters, so a brief summary would not be unwarranted at this stage.'
  merge: -1
  pgno: 455
- img_proc: true
  md: '# Shell Programming


    | Character | Function |

    | --- | --- |

    | *?[] | Metacharacters that provide a speedy shortcut to specify filenames by
    pattern matching |

    | ; | Separates multiple commands entered at the command line |

    | \ | Hides the meaning of any special character that follows it, from interpretation
