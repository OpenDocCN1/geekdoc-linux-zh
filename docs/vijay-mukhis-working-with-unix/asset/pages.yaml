    # The "lp" Daemon: "lpsched"


    The "lpsched" is to print-jobs, what "sched" is to Unix. Just like the "sched"
    schedules jobs for execution and makes sure that each job gets the attention of
    the processor according to its priority, the "lpsched" makes sure that each print
    job in the queue gets the attention of the printer according to its priority.


    This daemon is at the very heart of the "lp" services. When you execute the "lp"
    command to spool a file to the printer, "lp" communicates with this daemon informing
    it that a new job has been submitted for printing. From then on, the daemon takes
    control and tracks the execution of this job until it is removed from the print
    queue.'
