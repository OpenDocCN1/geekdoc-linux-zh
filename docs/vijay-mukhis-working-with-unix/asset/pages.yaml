    # Screen 67


    521'
  merge: -1
  pgno: 548
- img_proc: true
  md: 'The "Check" option will execute the "fsck" command on a filesystem of your
    choice. Similarly the "mount" and "unmount" will execute the "mount" and "umount"
    commands which we are already familiar with. To add a new filesystem select the
    "Add" option. This option invokes the command "mkdev fs" and a program appears
    with a list of choices.


    ![](img/2b13e596b1053c0c9f492dfe40dfa70a_549_0.png)


    The "Floppy" option permits you to create a filesystem on a floppy. Select this
    option and refer to Screen 69.


    ![](img/2b13e596b1053c0c9f492dfe40dfa70a_549_1.png)


    522'
  merge: -1
  pgno: 549
- img_proc: true
  md: 'To create a DOS filesystem, select the DOS option. Screen 70 displays the process.


    ![](img/2b13e596b1053c0c9f492dfe40dfa70a_550_0.png)


    # Screen 70


    That completes our journey through the user-friendly, menu-driven shell “sysadmsh”.
    A journey of discovery and convenience. Select the “Quit” option and return to
    the dull, lack-luster shell prompt.'
