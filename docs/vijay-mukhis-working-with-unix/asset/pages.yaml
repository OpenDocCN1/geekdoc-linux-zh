    # The Ultimate Protection for a Directory:


    # The Sticky Bit:


    Don''t go by the name. The Sticky Bit is a very powerful security measure that
    is incorporated in Unix. And we mean, very powerful.


    When the Sticky Bit ''sticks'' onto a directory, it ensures that no one can delete
    any files from that directory, other than the owner and the superuser. No matter
    what the permissions of the directory may be. We have assumed, throughout the
    book, that the superuser is a decent chap. So let''s keep it that way.'
