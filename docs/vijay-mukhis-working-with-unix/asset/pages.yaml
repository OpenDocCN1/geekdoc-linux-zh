  md: '# The Current Working Directory :


    One of the most vital tasks of a new user is to ascertain his current working
    directory. Each user who has logged in is always provided with a working directory
    of his own. It''s a good idea to get acquainted with your own working directory
    and stick to it when you''re a novice.


    The English-like commands are now over and done with. An abundance of cryptic
    commands whose origin is difficult to figure out are about to follow. The Unix
    world is filled with a multitude of such enigmatic commands.


    A convenient `pwd command` has been provided for the purpose of ascertaining the
    current working directory. Incidentally, **pwd** is an abbreviation for “print
    working directory”. No, don''t start loading the printer with paper. Take note
    that for all practical purposes, in Unix, “Print” means “Display”! DOS users,
    please accustom yourselves to this new terminology. At the "$" prompt, type in
    **pwd** as shown.


    ```

    $pwd

