  md: '# Changing File Permissions:


    Unix allows the user to change the default permissions that are assigned by umask.
    The pre-condition, however, is that you must be the owner of the file. Unless
    and until you own the file, you cannot change the permissions assigned to the
    file.


    Unix provides a chmod (for change mode) command that helps you change permissions
    of files that you own. Let''s see how this works.


    ```

    $ ls -l textfile

    -rw-r-r- 1 user group          31 Mar 27 13:28 textfile

    $

    ```


    Since our system umask was set to 022, this file had the corresponding permissions
    assigned to it. If we wanted to alter these default permissions, Unix will allow
    us to do so, since we own the file.


    To change the permissions of “textfile”, so that all permissions are assigned
    to the user, and only read and write permissions to the group and others, you
    could use:


    ```

    $ chmod 0766 textfile

    -rw-rw-rw- 1 user group          31 Mar 27 13:28 textfile

    $

    ```


    That''s all it takes. The permissions of the file are instantly changed as per
    our specifications. The point to be noted here, is that an execute permission
    is never assigned to a file by default. The user always has to assign the execute
    permission using the chmod command. This is particularly useful when the user
    creates a file containing valid Unix commands and wishes to assign an execute
    permission to it. That is when the chmod command comes handy.'
