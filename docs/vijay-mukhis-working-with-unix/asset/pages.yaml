  md: "# Canceling a Job:\n\nYou can cancel a print job before it is printed using\
    \ the “cancel” command. Each request-id returned usually contains the name of\
    \ the default printer (lp) followed by a number. The request-id can be used to\
    \ cancel the print job.\n\n```\n$ lp /usr/user/Longfile\nrequest id is lp-45 (1\
    \ file)\n$ cancel lp-45\nrequest \"lp-45,11770 canceled\n```\n\nYou can verify\
    \ this fact using the “lpstat” command. This request will not be displayed as\
    \ a current print job. Jobs can only be removed from the print queue if they have\
    \ been completed or if they are canceled.\n\nAs usual, you can only cancel jobs\
    \ that you have submitted for printing. But the System Administrator can cancel\
    \ another user's jobs. However, the print services are efficient enough to mail\
    \ a user the message that his print job has been canceled by the System Administrator.\
    \ That way, a user knows that someone has aborted his print job. Some decency.\n\
    \nOur print job, \"lp-38\", was canceled by the System Administrator for purposes\
    \ that he knows best. However, out of decency, the print services sent us this\
    \ mail.\n\nyou have mail\n\n# $ mail\n\n```\nSCO System V Mail (version 3.2) Type\
