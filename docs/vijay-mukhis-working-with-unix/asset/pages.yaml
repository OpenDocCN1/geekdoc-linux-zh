  md: '# Terminal write permissions:


    The “mesg” command:


    We have seen earlier that the information that is displayed on a terminal comes
    from a “tty” file in the /dev directory. If we want to send messages to another
    user’s terminal, it implies that the message is to be written onto his terminal
    file. This calls for a write permission being assigned to this file.


    Does this mean that to be able to send a message to another user’s terminal, you
    have to change the permissions to his “tty” file? Notwithstanding, you have to
    be a superuser first to do so. Too much of a problem? No way.


    To set your terminal to receive messages from other users, all you have to do
    is to use the mesg command with the right options. The mesg or message command
    permits you to assign permissions to other users to send messages to your terminal.
    So if you’re expecting to hear from someone, use:


    ```

    $ mesg y

    ```


    This command will permit other users to write messages onto your terminal. It
    will alter the mode of your terminal file so that messages from other users can
    be written onto it.'
