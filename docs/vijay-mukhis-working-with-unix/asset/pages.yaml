  md: '# Working With Unix


    To sort the names of the teams, in reverse alphabetical order, you could use the
    -r switch.


    ```

    $ sort -dr tally

    Zimbabwe 5 0 5 0 0 1.26 Ne

    West-Indies 5 2 3 0 4 0.12 Ne

    Sri-Lanka 5 2 2 1 5 0.17 Ne

    South-Africa 5 3 2 1 6 0.12 Po

    Pakistan 5 1 3 1 3 0.14 Ne

    New-Zealand 5 5 0 0 10 0.86 Po

    India 5 2 2 1 5 0.53 Po

    England 4 3 0 1 7 0.65 Po

    Australia 5 2 3 0 4 0.25 Ne

    $

    ```


    These are trivial options compared to what''s going to come next. Let''s get going
    with the more advanced options that sort has to offer.


    So far the sort key has always been selected from the beginning of a line. To
    sort on particular fields in this file, you may specify the field preceded by
    a plus (+) sign. The first field in a file is counted as "field0". Hence a +1
    would ask sort to ignore the first field and take the second field as the sort
    key upto the end of the line.


    As a safety measure, it is always advisable to set the -n switch when sorting
    numeric fields.


    ```

    $ sort +6 tally

    West-Indies 5 2 3 0 4 0.12 Ne

    South-Africa 5 3 2 1 6 0.12 Po

    Pakistan 5 1 3 1 3 0.14 Ne

    Sri-Lanka 5 2 2 1 5 0.17 Ne

    Australia 5 2 3 0 4 0.25 Ne

    India 5 2 2 1 5 0.53 Po

    England 4 3 0 1 7 0.65 Po

    New-Zealand 5 5 0 0 10 0.86 Po

    Zimbabwe 5 0 5 0 0 1.26 Ne

    $

    ```


    202'
