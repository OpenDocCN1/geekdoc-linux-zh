- img_proc: true
  md: '# Working With Unix


    The **cmp** command is used to compare two files that may be text, ASCII or even
    binary files. It takes two filenames as arguments. We had two files in our home
    directory that contained the list of users working on the system on two different
    days. We called these files "log" and "log-user"


    ```

    $ cat log

    TODAY IS THE 14th DAY OF Feb

    NAME      LINE        TIME

    user1     ttyla       Feb 11 22:23

    user1     tty2c       Feb 12 00:00

    accell    tty2d       Feb 11 22:46

    $

    $ cat log-user

    TODAY IS THE 15th DAY OF Feb

    NAME      LINE        TIME

    user1     ttyla       Feb 11 22:23

    user1     tty2c       Feb 12 00:00

    ingres    tty2d       Feb 11 22:46

    $

    $ cmp log log-user differ

    differ: char 15, linel

    $

    ```


    The moment the **cmp** command finds a difference, it displays the character and
    line number of the character that differs and terminates. There maybe several
    other differences in the file, as is apparent above, but **cmp** finds the first
    discrepancy and exits.


