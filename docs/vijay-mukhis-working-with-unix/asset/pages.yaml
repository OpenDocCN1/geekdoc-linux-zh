- img_proc: true
  md: '# Working With Unix


    So far we have learnt how to set the mode of a file using the absolute method.
    Any value specified with the chmod command, alters the entire file permission.
    There is a simpler way. Let''s say you just wanted to add an execute permission
    for the user, and change nothing else. Then you could change the file permissions
    symbolically as follows:


    ```

    chmod [who] [+-] [permission] file

    ```


    The who is either g (for group), o (for others), or u (for user, i.e. owner of
    the file or directory).

    The + sign adds the specified permission whereas the - removes it. The = sign
    assigns the specified permission and removes all other permissions (if any) for
    that wo.


    The permission field, as usual, could contain an r, w or x. This syntax allows
    you to directly add or remove existing permissions of a file without having to
    add or subtract numbers to arrive at the new permissions.


    Let''s say we wanted to remove the "read" and "write" permission assigned to "others"
    for "textfile". We simply specify o for "who". Since we want to remove existing
    permissions, we use the - sign and finally specify the name of the file.


    The command now becomes:


    ```

    $ chmod o-rw textfile

    $ ls -l textfile

    -rw-r---- 1 user group 31 Mar 27 13:28 textfile

    $

    ```


    Presto!! Symbolically setting the file permissions, is far more simple to understand
    and speedier to implement.


    To add an execute permission for all users to the existing permissions, now becomes
    extremely simple.'
