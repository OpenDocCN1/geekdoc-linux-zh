  md: '# Unix: The Fundamental Principles


    This is a brief description of the Unix file system hierarchy and its main directories.
    All the above mentioned directories are found in almost all Unix installations,
    whatever be the Unix version or implementation; this structure remains unchanged.
    Now let''s understand how Unix treats files and the technical concepts behind
    file handling in Unix.


    # Files: The Finer Details:


    In Unix, the file reigns supreme. It is the monarch of Unixland and always has
    been. From the very first version to what it is today, Unix has been critically
    file-dependent. The file is to Unix what oxygen is to humans. The very basis of
    survival.


    The internal representation of a file is given by an "inode" (pronounced as "eye-node\).
    The inode contains a description of the disk layout of the file data, and other
    information such as the file owner, access permissions and access times. Every
    file has a unique node, but it may have several names, each of which maps onto
    a single inode. Each of these multiple-name inodes, that refer to the same file
    are called a link. When a process refers to a file, the kernel first retrieves
    the inode for that file and obtains all relevant information about the file before
    allowing access to it. On the same lines, when a process creates a new file, the
    kernel allocates an unused or free node to it.


    A file system in Unix consists of a sequence of 512, 1024, 2048 or any other convenient
    multiple of 512 bytes, depending on the system. Using large logical blocks increases
    the effective data transfer rate between the disk and memory, but it may also
    lead to reduction in its effective storage capacity. Thus the block size is usually
    maintained at 1024 bytes in most Unix installations.'
  merge: -1
  pgno: 48
- img_proc: true
  md: 'The filesystem, as a whole, has the following structure.


    +   **Boot Block:** This represents the beginning of the filesystem and contains
    the “bootstrap” program code that is executed for the machine to “boot” or initialize
    the operating system. Although only one boot block is needed to start up the system,
    all file systems contain one (possibly empty) boot block.


    | BOOT BLOCK |

    | SUPER BLOCK |

    | INODE LIST |

    | : |

    | DATA BLOCKS |

    | : |


    Figure 6


    +   **2.The Super Block:** It describes the state of the filesystem - how large
    it is, how many files it can store, and where to find empty files along with other
    relevant information.


    +   **3. The Inode List :** This is a list of nodes that follows the super block
    in a file system. The kernel references inodes by an index of the inode list.'
  merge: -1
