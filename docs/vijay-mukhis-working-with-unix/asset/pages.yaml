  md: '# Linking Files Across Directories:


    Users working on the same files in their respective HOME directories, often need
    to create links across directories. This is done by specifying the path of the
    new file. For example, to create a link to “project.c” in another directory, you
    could specify:


    ```

    $ ln project.c /usr/user1/temp/newproj.c

    ```


    This will create a link to “project.c” in the directory “usr/user1/temp” and give
    it the name “newproj.c”. Another user whose HOME directory is “usr/user1/temp”
    can now access this link, provided he is granted the permission to do. Since the
    owner and permissions of the link remain the same, to make a file accessible to
    another user, the owner has to actually set the requisite permissions before he
    makes the link.


    If you create a link to a file, and give the link a name of an existing file,
    that file will be removed and the new link established. There is however, one
    small chance. If the existing file does not have a write permission assigned to
    it, ln will ask you for confirmation before eliminating that file altogether.


    ```

    $ ln old-file new-file

    ```


    If “new-file” already exists in the current directory, and has no write permission,
    ln will display the file mode and request permission to proceed.


    ln: newfile: Mode 444?


    To steer clear of disaster, your response could be anything except “y”, and the
    operation will be abandoned.'
