- img_proc: true
  md: 'A directory always has two links. That''s where the “...” and the “..” come
    in. The former is a link to the current directory. This is why you can say:


    ```

    $ cp /data/bb8/new.c .

    ```


    This command will copy the file “new.c” from a directory /data/bb8 into the current
    directory, represented by the “.”. On the other hand, the “..” is a link to the
    parent directory. Which is why, if you are in the /usr/user1/temp directory, for
    instance, and you give the command:


    ```

    $ cd ..

    ```


    you will be taken back to /usr/user1 which is the parent directory.


    As shown in the long listing, the two directories, “temp” and “Firstdir” both
    have two links whereas all the other files have a single link.


    After the links, the owner of the files is listed. In our directory all files
    are owned by user1. The owner’s name is not his Christian name but instead the
    valid login that he uses initially logged in as user1, so the system has identified
    us by this name. Hence for all the files and directories we created, “user1” was
    stated to be the owner.


    After the owner of the file, the group to which the owner belongs, is listed in
    the next column. We belonged to a group called “group”, which we admit is not
    a very imaginative name.'
