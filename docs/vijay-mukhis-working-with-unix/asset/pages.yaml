    bb7*:219:50:/usr/bb7/bin/sh

    b8*:220:50:data/bb8/bin/sh

    user*:225:50:Unix book user:/usr/user/bin/sh

    unify*:229:50:unify installation:/data/unify:/bin/sh $


    The first field is the logname of the user, followed by a special character (*)
    to represent his password. (See, Unix can''t be dumb). The next two fields are
    the user-id and the group-id of the user. The fifth field is a comment that explains
    briefly what the user is doing on the system. Our logname “user1” has the comment
    “Unix book user".


    The second last field specifies the path of the user''s HOME directory, and the
    last field specifies which Shell is in. If the last field is blank, the default
    is /bin/sh.


    Every user is also permitted to change his existing password. The Unix system
    documentation goes to great lengths to instruct users how to choose a suitable
    password. Some important tips for selecting a good password are:


    +   1. It should consist of a mixture of upper and lower-case letters, digits
    (0-9), and other non-letters (such as *, /, space, tab, and control characters).'
