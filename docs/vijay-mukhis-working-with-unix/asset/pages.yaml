- img_proc: true
  md: 'But the **grep** family is vast and there''s a lot more to learn.

    So pull up your socks, shake off any lethargy and let''s get moving.


    # Extended "grep": The "egrep" command


    It''s an old trick. Pick up something that already exists. Add only a couple of
    new features and market it as the "plus" or "extended" or "enhanced" version of
    the original. And people buy it. The idea and the product.


    The **egrep** is a classic example of a program. The **egrep** command is a bit
    more sleek and offers a few additional features. Its syntax is the same as the
    **grep** command.


    The notable among the all-new, exciting, sleek features are as follows.


    The **egrep** offers two more regular expressions in the form of a plus sign +
    and a question mark ? for use in pattern searching.


    The + character will match one or more occurrences of the character preceding
    it. For example, you could search for a pattern like:


    ```

    go+d

    ```


    to match patterns like "god", "good" and "goood".


    The question mark ? matches zero or one occurrence of the character that precedes
    it. For example, if you used the pattern:


    ```

    so?n

    ```


    you would find "sn" or "son".'
  merge: -1
  pgno: 248
- img_proc: true
  md: '# Working With Unix


    The second radical and innovative feature of the egrep command is that it allows
    you to search for multiple patterns at the command line or from a file. These
    multiple patterns must be separated by a vertical bar (the same used to represent
    a pipe). For example, to search for the patterns “India”, “China” and “Sudan”,
    at the command line itself, try this command:


    ```

    $ egrep ''India|China|Sudan'' data

    China      3892 866 Africa

    India      3369 637 Asia

    Sudan      968 19 Africa

    ```


    The final advantage of egrep over grep is that you can ask egrep to lookup patterns
    from a file and search for those patterns in another file. For this purpose a
    -f option is additionally provided. Let’s create a pattern file called “countries”
    for this purpose.


    ```

    $ cat countries

    India

    USA

    Canada

    $

    ```


    To instruct the egrep command to read the patterns from the file “countries” and
    find the same in the file “data”, the command syntax is:


    ```

    $ egrep [-cinv] -f [pattern file] file(s)

    $ egrep -f countries data

    Canada    1852 24 Nrth America

    USA       3215 219 North America

    India     3369 637 Asia

    $

    ```'
  merge: -1
  pgno: 249
- img_proc: true
  md: 'There''s one last feature to be discussed. The **egrep** command permits you
    to enclose the regular expression in parenthesis so that it can be treated as
    a whole unit. Let''s say you want to search for zero or more occurrences of, “(ica)",
    you could use the command:


    ```

    $ egrep ''r(ica)*$'' data

    Canada 3852 24 North America

    USA 3615 219 North America

    Brazil 3286 116 South America

    Argentina 1072 26 South America

    Sudan 968 19 Africa

    $

    ```


    In the **grep** command, a regular expression like * would only search for zero
    or more occurrences of the character preceding it, but the **egrep** command,
    by permitting you to use parenthesis, the treats the multiple characters as a
    single unit, making regular expressions more powerful.


    We''re not through yet. Another member of the **grep** family has still to be
    discussed.


    # Searching for Fixed Patterns: The "fgrep" command


    The **fgrep** command stands for “fixed grep", implying that you can search for
    only fixed strings without the use of any regular expressions. Like in **egrep**,
    here too you can specify the name of a pattern file from which the patterns can
    be read and searched for in the data file.


    Among the options that go with **fgrep**, the -x option stands for “exact” and
    causes **fgrep** to select only those lines that exactly match the search pattern.


    A simple example of exact pattern searching is:


    ```

    $ fgrep -x ''The meeting ends at'' meeting

    ```'
