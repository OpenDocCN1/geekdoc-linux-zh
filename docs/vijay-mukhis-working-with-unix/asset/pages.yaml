  md: '# Useful Genral Purpose Commands


    The link does not create a new copy of the file. It simply allows the user to
    call it with different names, names that map on to the same inode number. Thus,
    instead of making a copy of a very large file and consuming disk space, you could
    simply create a link to the file and give it a different name.


    Now you can invoke the file with any of its names. Also if a file is accidentally
    deleted, and its link exists, the file can be conveniently accessed from its link.
    Thus in many ways, it makes sense to create links to a file.


    To create a link to the file "project.c" and give it a new name "link-proj.c"
    in the same directory, use the command:


    ```

    $ ln project.c link-proj.c

    ```


    Now the same file can be invoked by two names: "project.c" and "link-proj.c".
    The link should have the same inode number as the original file. Let''s verify
    this.


    ```

    $ ls -il link-proj.c

    6389 -rw-r-r- 2 userl group 77 Apr 01 10:49 link- proj.c$

    ```


    Now we''ve got the link! A new name that maps onto the same inode. The same file
    can be called by either of its two names. The long listing of the file also shows
    the number of links that it possesses. This number directly follows the permissions
    of the file. It has now been updated to 2, as is evident above.


    ```

    $ ls -l

    total 4

    -rw-r-r- 2 userl group 77 Apr 01 10:49 link-proj.c

    -rw-r-r- 2 userl group 77 Apr 01 10:49 project.c$

    ```'
