  md: '# Directory Listing: The “ls” command


    To confirm our file “test” is indeed present in the home directory, we need a
    directory listing. A friendly ls command has been provided by Unix for the purpose
    of directory listings. ls, as you may have guessed, is an abbreviation for “listing”.
    Now, at this point, we introduce a pivotal technical concept in Unix commands.


    There are over 500 Unix commands in existence today and each of them supports
    tens of thousands of options within them. Unix comes with more built-in commands
    and supporting options than any other operating system known to mankind. Let’s
    understand some general rules regarding Unix commands that must be adhered to,
    in all cases.


    +   1. A Unix command must always be entered in lower case only. The case sensitive
    Unix will promptly reject any upper case commands, like an offended child.


    +   2. The command must be keyed in first, after the Shell prompt. Unix expects
    the first word after the prompt to mandily be a valid command.


    +   3. To introduce the various options (also called ‘switches’) to a command,
    always make sure you press the Space Bar or the Tab key on the keyboard. In other
    words make sure that a single space separates a command and its options. These
    options are generally preceded by a minus sign (-).


    For example, a valid Unix command may resemble ls -l where ls is the primary command
    and -l is a switch. The switches are used to control the operation of the command
    and display output in a desired format.'
  merge: -1
  pgno: 64
- img_proc: true
  md: 'Note that, though all commands are compulsorily in lower case, the same is
    not true for the switches. A valid Unix command may also look like ls -R (pronounced
    as ls minus R).


    +   4. Beware DOS users! Whilst typing a Unix command, please DO NOT use the arrow
    keys, or the function keys or any other special keys on the keyboard. Unix will
    generate preposterous error messages for the command and leave you bewildered
    at the outcome. If you make a typing mistake when you are entering a command you
    could safely use the "Ctrl-H" keys for backspacing or simply press the Enter key
    and re-type the entire command at the "$" prompt. This is where Unix believes
    you are mature enough to avoid committing mistakes with commands. Elementary users
    take note of the "Ctrl-H" key combination that will spare you from contemptuous
    Unix error messages.


    These are some rules that elementary users must adhere to, so as to make the Unix
    transition smooth as possible.


    Knowing the rules, let''s begin with the elementary ls command to obtain a directory
    listing of our home directory. We will confirm that our file "test" has indeed
