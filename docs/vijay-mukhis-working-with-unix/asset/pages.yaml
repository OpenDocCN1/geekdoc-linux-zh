- img_proc: true
  md: '# Working With Unix


    The PPID stands for “parent-process-id” and displays the process id of the parent
    process that spawned the child process. Because the system created a Shell process
    (sh) for you, the instant you logged in, its parent-id is 1. However, for each
    user, the PID of the Shell will differ since it is just a number that is assigned
    to the process as and when you log in.


    The Shell has a parent process, whereas it is your shell that gave birth to the
    ps process. Hence you will observe above that the PPID of the ps -f command is
    the same as the PID of the Shell.


    The STIME is the “starting” time of the process, whereas TIME denotes the cumulative
    execution time for that process.


    Finally, the “C” field denotes the amount of CPU resources that the process has
    used recently. The Kernel uses this information to decide which of the processes
    will get the attention of the CPU next. This is known as process scheduling and
    is one of the principal duties performed by the Kernel. The Kernel will let the
    process with a lower C value have control of the CPU, before the process with
    a higher C value is given a hearing.


    # Spying on Other Users:


    To find out what other users of the system are doing with their time, you can
    use the -a option. This option provides a listing of processes being executed
    by other users of the system. The option, when combined with the -f option allows
    you to spy on the activity of other users of the system. This command is most
    often used by the boss of the organization to check whether his Unix users and
    programmers are actually doing what they are being paid for. So if you want to
    play games, make sure the boss has left. Else, using this command, he’s sure to
    catch you playing truant.'
