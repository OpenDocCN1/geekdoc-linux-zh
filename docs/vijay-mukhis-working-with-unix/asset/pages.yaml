- img_proc: true
  md: '# Working With Unix


    The **passwd** executable file has what is called its **su-id** bit set so that
    any user who invokes it, acquires the group-id of **auth** and becomes the temporary
    owner of `/etc/passwd`. Note that, if this were not to happen, then it would be
    impossible for a user to write to the `/etc/passwd` file to, modify or delete
    his password. Thus when you and I execute `/bin/passwd` file, our group-ids become
    the same as that of “auth” and hence we can have access to the `/etc/passwd` file.


    The minute we stop executing the **passwd** command and return to the Shell, our
    ids are restored to their initial values, as though nothing had happened. This
    mechanism is foolproof. Using this **su-id** (substitute user-id) bit, Unix provides
    protection to important system files.


    For a normal user, the **su-id** bit can be used for similar purposes. Say, there
    is a highly protected database file that offers only read permissions to “group”,
    and “others”, so that users should not be allowed to write to the file directly.
    But on invoking an executable file, the same permission may be granted. The executable
    file will guarantee that users do not enter unformatted or inappropriate values
    for the data. Valid data, if entered, can be safely written onto the database.


    To create such a setup, set the **suid** bit of the executable file as:


    ```

    $ chmod u+s data-entry

    ls -l data-entry

    -rwsrxr-x 1 user group 14 Apr 05 13:12 data-entry

    $

    ```


    Now users who invoke this executable file will automatically acquire your user-id
    and will be permitted to write onto the database file “data-entry”.'
