    # Screen 54


    513'
  merge: -1
  pgno: 540
- img_proc: true
  md: '# Working With Unix


    As you may have guessed, the “Terminate” option will execute the “kill” command
    on a selected process. You can also select the name of the user whose process
    you''d like to terminate. Screen 55 explains the procedure.


    ![](img/2b13e596b1053c0c9f492dfe40dfa70a_541_0.png)


    Select the “Authorize” option in the “Jobs” menu, and a new range of options will
    appear, as shown in Screen 56.


    ![](img/2b13e596b1053c0c9f492dfe40dfa70a_541_1.png)


    514'
  merge: -1
  pgno: 541
- img_proc: true
  md: 'The “Scheduled” jobs are jobs assigned for regular execution. The “Delayed”
    jobs, on the other hand, are jobs delayed. The “Environment” option will invoke
    the “vi” editor and help you modify the “proto” file which controls the environment
    in which “at” and “batch” execute. Select the “Scheduled” option and refer to
    screen 57.


    ![](img/2b13e596b1053c0c9f492dfe40dfa70a_542_0.png)


    The “Default” option permits you to set the system-wide default for access to
    the “cron” services. By default, no user should be allowed to have access to the
    “cron” services unless the user''s name appears in the “cron.allow” file. See
    Screen 58.


    ![](img/2b13e596b1053c0c9f492dfe40dfa70a_542_1.png)


    515'
  merge: -1
  pgno: 542
- img_proc: true
  md: '# Working With Unix


    If you choose to let all users have access to “cron” services by selecting the
    “Allow” option, the system will request confirmation to erase the “cron.allow”
    file. Obviously, if the “cron.allow” file does not exist, then all users can make
    use of the “cron” services.


    If you select the default “Deny”, you will be returned to the previous menu once
    again.


    Now select the “User” option in the “Scheduled” jobs menu. This option will help
    you specifically assign permission to a particular user, to use the “cron” services.
    Glance at Screen59.


    ![](img/2b13e596b1053c0c9f492dfe40dfa70a_543_0.png)


    To view the names in the “cron.allow” file, you can select the “View” option.
    Screen 59 shows our “cron.allow” file. Fortunately, we were included in the privileged
    few.


    Now select the “Delayed” option in the “Scheduled” menu and the same three options
    that were available in the “Scheduled” jobs menu appear again. Using these options,
    you can set system-wide defaults for the “at” and “batch” commands, allow or deny
    permissions to individual users, and finally view the “at.allow” file.'
