  md: '# Working With Unix


    First the shell will search the current directory for any executable file that
    we specify. The Shell would execute our "ls" script first, which in turn calls
    "ls" again, so an infinite loop will be generated. Finally Unix will display the
    message:


    ```

    ls: fork failed - too many processes

    ```


    Though the main culprit in this case is the PATH which is incorrectly set to search
    the current directory first, we strongly recommend that you never call a Shell
    script by the same name as a valid Unix command.


    # Executing the Shell Program:


    We know that even if a user’s umask is set to "000", his file will be assigned
    the system-wide default permissions of "666" i.e.


    ```

    -rw-rw-rw

    ```


    This is the most generous permission possible. However, it is important to note
    that this file is not assigned the execute permission, even for its owner. Files
    created are never assigned execute permission by Unix, unless they are derived
    as executable code generated by a compiler. The default system-wide permission
    is always 666 (read and write permissions for all).


    To actually execute this Shell program, you will have to assign an execute permission
    for this file. To do that, use the "chmod" command.


    ```

    $ chmod u+x first-script

    $

    ```


    Now the permissions of "first-script" should look like:


    ```

    -rwx-rw-rw

    ```'
