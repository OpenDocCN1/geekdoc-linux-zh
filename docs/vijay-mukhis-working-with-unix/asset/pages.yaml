- img_proc: true
  md: '# Diskette Device Files:


    As mentioned before, the “/dev” directory contains “device files” that help Unix
    understand and interface with disks and other media. These files are categorized
    according to the capacities and types of disks, on the one hand and also for the
    disk type (file systems or raw disks), on the other. This classification is somehow
    incorporated into the names of these files, in a desperate effort to make the
    names of these device files mnemonic and suggestive of the device that they represent.


    # Naming Convention for Diskette Device Files:


    Unix device files use a rather odd naming convention, that is more informative
    to the system than the user of the system.


    From the user’s perspective, it’s rather unfriendly. We would prefer the same
    device be called “/dev/1.2Mff”, but Unix doesn’t agree.


    # Formatting Floppy Disks: The “format” command


    To format a floppy disk, the user has to use the “format” command followed by
    the raw device name. The device name can be chosen according to the type of format
    desired and the capacity of the floppy disk in question.


    If no arguments are specified for the “format” command, it reads the values specified
    in the “/etc/default/format” file. The “/etc/default” directory stores the default
    values that users wish to use for various Unix commands. Our “/etc/default” file
    contained the following values:


    ```

    $ cat /etc/default/format

    # @(@) format96 22.1 89/11/14

    #

    ```'
