- img_proc: true
  md: '# Unix: The Fundamental Principles


    Often, mundane day-to-day sights have given geniuses great ideas. Newton saw the
    falling apple, and Archimedes, an overflowing bathtub.


    Speaking of Unix, we figure that Thompson and Ritchie derived great inspiration
    from a tree! Preposterous? Read on.


    The Unix file system begins with a directory called the “root”. The root directory
    is denoted by a slash(/). Branching from the root, there are several other directories
    called “bin”, “etc”, “usr”, “lib” and “tmp” and an ordinary file named “unix”
    which is the kernel program itself. This is the very first file which is loaded
    into memory during system startup.


    The directories are called subdirectories (child directories) of the root directory
    and conversely the root directory is called the “parent” directory of these directories.
    Each subdirectory can turn contain other directories and files which give rise
    to the branching, upside-down tree structure shown in Figure 5.


    The main reason for having different directories is to keep some files together
    and separate from other files. For example, it is a good idea to keep files used
    by the system in directories like “bin”, “etc” and “lib”, while files created
    by the user in different directories like “usr”.


    The “bin” directory contains the executable files for most Unix commands. Unix
    commands are executable C programs or Shell Scripts devoted to carrying out single
    tasks at the user’s beckoning. Shell scripts are merely a collection of valid
    Unix commands. Therefore the “bin” directory assumes a great amount of importance
    in a Unix installation.'
  merge: -1
  pgno: 46
- img_proc: true
  md: '# Working with Unix


    The “etc” directory contains other additional commands which are related to system
    maintenance and administration. It also contains several system files which store
    the relevant information about the users of the system, and the terminals and
    devices connected to the system.


    The “lib” directory contains all the libraries provided by Unix for programmers.
    When programs written under Unix need to make system calls, they can use libraries
    provided in this directory.


    In the “dev” directory, Unix stores files that control character and block devices.
    Unix has a file for each device that it has to deal with. In fact all the information
    that is displayed on the terminal of each user comes from a “terminal” file in
    this directory.


    In the “usr” directory, the user work area is provided. It is general practice
    to create each user’s “home” directory within this directory so that users can
    store data and other files within them. The user is free to organize his home
    directory by creating other subdirectories in it, to contain functionally related
    files.


    Within the “usr” directory, there is another directory, “bin”, in which additional
    Unix commands are stored.


    The “tmp” directory is the temporary directory into which most of the temporary
    files are kept. As compared to the others, this directory assumes the least amount
    of importance, both from the system and the user’s point of view. Files stored
    in this directory are automatically deleted when the system is shut down and restarted.'
