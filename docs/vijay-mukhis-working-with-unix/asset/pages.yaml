    # The Alternative Backup Utility: “cpio”


    The “cpio” command is an advanced tool that permits the user to archive files
    in and out with relative ease. The “cpio” command gives you access to the disk
    without mounting it. The “cpio” is actually an archiving program that copies a
    list of files into a large output file, creating headers between the files so
    that you can recover them individually. In this manner, its mechanism differs
    drastically from that of the “tar” command.


    You can use “cpio” to create archives directly on the hard disk itself, though
    it is more commonly used to backup data on floppy disk or tape. The “cpio” archives
    can also span across several disks or tapes, allowing efficient backups of large
    directories and databases.


    The use of “cpio” is most efficient on floppy disks since the size of a “cpio”
    archive is usually smaller than the sums of the sizes of individual files that
    make up the archive. The system software and most installable disks are of the
    “cpio” format.'
