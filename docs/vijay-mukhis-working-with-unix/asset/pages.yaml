- img_proc: true
  md: 'There are two sides to a coin. And we might as well tell you the whole truth.
    While setting the “write permission” to your terminal can be a great advantage,
    it can often tend to be very annoying. For example, when you are editing an important
    file in vi, and someone else writes onto your screen, you will have to issue the
    screen re-draw command (Ctrl-L) before you can proceed working with vi.


    So if you''re not that gregarious, and you don''t like to be disturbed whilst
    working, you could set this permission off using the command:


    ```

    $ mesg n

    ```


    Now, no other user can write messages to your terminal other than the superuser.
    All other users will be denied permission if they try to write to your terminal.


    To communicate with a user who is logged onto a terminal, he should have assigned
    a write permission for his terminal. To establish a dialog with another user,
    both yours and the other user''s terminal should have a write permission.


    The who command has a very useful option in this context. The -T option in the
    who command displays the write permissions for each terminal. A minus sign "-"
    preceding a terminal number signifies that the terminal has no write permission
    and a plus sign “+” signifies write permission granted. Try this command:


    ```

    $ who -TH

    ```


