    # File Compression/Decompression:


    Files often contain several redundancies. Redundant characters, text, words and
    often entire paragraphs of repetitive text, It makes little sense to store such
    files in their entirety, thus wasting valuable disk space. One is always on the
    lookout for some convenient utility that will “compress” the file and store the
    compressed version of the same on disk. The condition is, of course, that the
    file should be recoverable to its original format as and when the user desires.


    Unix provides a convenient pack command for compressing files. This program uses
    the well-known Huffman Redundancy Code to eliminate redundancies in the file and
    therby compress it. Let’s understand the Huffman Scheme in brief. The algorithm
    for this scheme is that it scans the file for its contents and ascertains what
    occurs most frequently and vice-versa. It then assigns small codes for characters
    that occur most frequently and Hence for a file containing English text, the smallest
    codes would be assigned to the vowels a, e, i, o and u. In comparison, alphabets
    like “z” would have much larger codes. Hence the Huffman codes are said to be
    “frequency-dependent” codes.


    Packing of the file only occurs if a certain set of conditions are satisfied.
    No packing of files will occur if:


    +   1. The file appears to be already packed.

    2. The file is a directory.

    3. The file has links.

    4. The file has no read permission.'
