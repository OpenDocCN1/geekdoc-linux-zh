- img_proc: true
  md: '# The “pg” Filter:


    This filter is by far more powerful than the head and tail discussed above. The
    pg command is a paginator that allows you to peruse a file one screenful at a
    time. A screenful of information is displayed, after which the pg command displays
    a prompt and pauses for the user to strike the “Enter” key to continue scrolling.
    At the end of the file it displays “EOF;” and waits for the user to terminate
    the process by striking the “Enter” key.


    The pg command is very powerful. It allows the user to customize almost anything
    from the prompt to be displayed at the end of each page of the listing, the number
    of lines to be displayed in each page, and the ability to go backwards or forwards
    with the press of a key. The user can also search for a specific pattern in the
    file whilst scrolling it.


    The options are numerous as always. But our policy was chalked out when we started.
    Of the several options available, we will pick only the main options that are
    used frequently or have any significance at all.


    Lets start with a simple example.


    ```

    $ pg -10 -p "page : " -s file1

    ```


    This command will cause the first ten lines of “file1” to be displayed in a single
    page of listing. Since we have changed the default prompt using the -p option,
    the colon (:) will now be substituted by our new prompt. The “%d” is a field specifier
    for integers borrowed from “C” and implies that the page number is to be inserted
    in its place.'
  merge: -1
  pgno: 213
- img_proc: true
  md: 'The -s displays this prompt in inverse video and the next argument is the filename
    "file1". Try this command with a long file in your home directory and check out
    the effect. Additionally, you may include the options that we have specified below
    for enhanced effect. Besides, the pg command can be used with multiple files at
    a time.


    # Need Some Help?


    The pg options are rather cumbersome and difficult to remember. Unix creates a
    record of sorts by offering an actual help screen for this command. (Pinch yourself
    to confirm you''re not dreaming!). To invoke the pg help screen, press "h" at
    the colon prompt when pg has paused and is waiting for the user to strike the
    "Enter" key. The -n option is set, you won''t even need to strike the "Enter"
    key after pressing "h".


    ```

    $ pg -n file1

    <file contents>

    : h

    ```


    # The Help Screen


    The help screen for the pg command is shown below.


    +   h help

    q or Q quit

    <blank> or \n next page

    1 next line

    d or ^D display half a page more

    . or ^L redisplay current page

    f skip the next page forward

    n next file

    np previous file

    $ last page

    w or z set window size and display next page

    s savefile save current file in savefile

    /pattern/ search forward for pattern'
