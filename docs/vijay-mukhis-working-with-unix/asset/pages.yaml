  md: '# The Final Phase:


    If the switch happens to be correct, the next word is passed on as an argument
    to the command. The argument may be either a filename or a ''metacharacter''.
    Metacharacters are special characters understood by the Shell and they hold a
    special meaning and significance of their own. The argument, as a whole, is passed
    on to the executable program and the desired output is obtained. In a nutshell,
    whenever you have problems with Unix commands, check for the correctness of the
    path, the switches and the validity of the argument, if any.


    # Metacharacters: VIPs of Unix


    This is among the most stimulating topics in Unix. And having come to it, it''s
    hard to pass it by.


    Metacharacters, as the name suggests, are special characters that are at a higher
    and abstract level compared to most other characters in Unix. This is due to the
    importance that these characters are accorded by the Unix Shell. The Unix Shell
    understands and interprets these metacharacters and treats them in a special manner.
    Puts them on a pedestal, to say.


    The first noteworthy aspect about metacharacters is that they are never taken
    literally, but are always meant to represent a single entity or a group of entities.
    Thus when a metacharacter is included along with a command, the Shell always seeks
    to ''match'' it with some real, existing entity in the system. This entity maybe
    a filename in the current directory, or a string in a file. The possibilities
    are endless. And the flexibility and convenience unparalleled.'
  merge: -1
  pgno: 90
- img_proc: true
  md: '# Working with Unix


    A metacharacter may represent a single file, group of files or even a directory,
    depending upon the properties and implication of the metacharacter used. In Unix,
    metacharacters are also called Regular Expressions. We find this name too mundane.
    So we''ll stick to metacharacters.


    The Unix Shell interprets metacharacters from the command line itself and then
    passes on the ''matches'' that it finds to the command for execution. In other
    words, had it not been for the Shell, there would be no metacharacter in existence
    today. The Unix programs by themselves, can make no sense of metacharacters.


    The basic purpose of metacharacters is to make life easy at the command line.
    The command line in Unix is like a firing line, where one has to be alert and
    watchful not to commit mistakes. At this point, any help that one can get is more
    than welcome.


    But let''s not get too abstract about metacharacters and get down to understanding
    which metacharacters are available and what they can do for us.


    Metacharacters in Unix include the following:


    > *: Not merely a "twinkle twinkle little star" but instead a powerful metacharacter
    in Unix. It is used to signify zero or more occurrences of a string. Not the same
    concept as DOS, where * means one or more. For example,


    ```

    $ ls *


    will display all the files and directories in the current directory. You could
    also use:

    ```


    ```

    $ ls t*

    ```'
