    $ tty

    /dev/tty2c


    This implies that our terminal file is stored in **/dev** with the name “tty2c”.
    Whenever we execute any Unix command, the output of that command is re-directed
    into this file and consequently displayed on our terminal. For example


    $ ls -1


    # IS EQUIVALENT TO


    $ ls -1 > /dev/tty2c


    Let’s use this new found knowledge to write into the terminal files of other users
