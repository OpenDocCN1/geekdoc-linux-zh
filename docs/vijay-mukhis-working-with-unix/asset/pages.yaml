- img_proc: true
  md: '# Pipes,Filters And Pattern Searching


    The **sort** command normally sorts the input file according to the "ASCII Collating
    Sequence. Accordingly, it sorts the white space (space or tabs) first, then most
    punctuation marks, numbers, uppercase letters and finally lowercase letters, in
    that order.


    Also, by default, there is only one sort key. But to alter the ordering rules,
    a whole new set of switches are also available.


    The options **+pos1** and **-pos2** specify the sort key as beginning at **pos1**
    and ending at **pos2**. A missing **-pos2** means the key stretches from **+pos1**
    to the end of the line.


    To specify fields, let''s first learn exactly what fields are. A field is basically
    a sequence of characters terminated by a field separator or a new line. By default,
    the space or the tab serves as a field separator. Thus "+3" will instruct the
    **sort** command to use the fourth field (where all fields are separated by spaces
    or tabs) as the sorting key.


    Let''s try the simple **sort** command on this file. The **sort** command with
    the **-d** option sorts the file alphabetically. So, let''s get on it.


    ```

    $ sort -d tally

    Australia      5 2 3 0 4 025 Ne

    England        4 3 0 1 7 0.65 Po

    India          5 2 2 1 5 0.53 Po

    New-Zealand     5 5 0 10 0.86 Po

    Pakistan       5 1 3 1 3 0.14 Ne

    South-Africa   5 3 2 1 6 0.12 Po

    Sri-Lanka      5 2 2 1 5 0.17 Ne

    West-Indies    5 2 3 0 4 0.12 Ne

    Zimbabwe       5 0 5 0 0 1.26 Ne

    $

    ```'
