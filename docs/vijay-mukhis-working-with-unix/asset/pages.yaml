    Pakistan 5 1 3 1 3 0.14 Ne

    Zimbabwe 5 0 5 0 0 1.26 Ne

    $

    ```


    We have, intentionally, refrained from giving headers to the fields in the above
    file as it poses serious problems when it comes to sorting a particular field.


    The sort command sorts and merges files. It sorts lines of the named files together
    and writes the result on the standard output. If “-” is used as a filename or
    if no filenames are mentioned, the sort command reads the standard input.


    The sort cnmand bases its comparisons on one or more sort keys extracted from
