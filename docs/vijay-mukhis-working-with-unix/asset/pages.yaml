- img_proc: true
  md: '# $ split -25 original


    Note that several new files will be created when this command is executed. If
    the file “original” contains, say, 120 lines in all, 4 new files containing 25
    lines each will be created and the last file will contain only 20 lines. In this
    manner, the split command actually breaks the file into small, accessible and
    finite segments. These five files will be created in the current directory and
    have strange names starting with “xaa”, “xab...”, upto to “xaz”. If there are
    more than 26 files created, they will be named from “xba” onwards to prevent overwriting
    the existing files.


    Note that the file “original” remains exactly as it was. The split command only
    reads the specified number of lines from this file and creates new files to put
    them in. In this way, the operation is quite safe and does not harm the source
    file that is being split. After the split command, the first thing you should
    check is:


    ```

    $ ls -l x*

    xaa

    xab

    ...

    ```


    This command will show you all the new files that are created in you current directory.
    So if you have a large file and you’re interested in obtaining small, manageable
    fragments of the same, the split command is for you.


    The csplit command splits the file according to its “context”. The condition this
    time is not the number of lines but a particular pattern in the file. Splitting
    a file, after having found a pattern is more useful, as one is more likely to
    remember the contents of one’s file rather than actual line numbers.'
