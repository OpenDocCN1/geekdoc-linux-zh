- img_proc: true
  md: '# Deleting Files: The “rm” Command


    The next file operation is most logically the delete file operation. Like DOS
    provides a “del” command for the purpose, the equivalent in Unix is the rm command
    which is an abbreviation for “remove”. To remove the file “speech” from the current
    directory, simply type :


    ```

    $ pwd

    /usr/user1

    $ ls speech

    speech

    $ rm speech

    $

    ```


    Always follow this order of commands when deleting any file. Print your working
    directory, view a listing of the files, and then proceed with the remove (rm)
    command. Since you are working with a multi-user operating system, a reasonable
    amount of caution is well worth it. Please note that NO delete utility is available
    with Unix, and once the file is removed, it’s gone forever. Therefore, when using
    the rm command, always use the -i option along with it.


    ```

    $ rm -i speech

    speech ?y

    $

    ```


    This option permits you to have second thoughts, by asking for confirmation for
    every file before actually removing that file. The -i invokes the interactive
    mode. If your response is anything but “y”, the file will not be removed.


    Now that you’re acquainted with the basic operations, we will set our sights on
    the more advanced features and several new commands in Unix.'
  merge: -1
