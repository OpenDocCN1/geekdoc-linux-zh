  md: "Having learnt the important options of the “pr” command,\nlet’s get down to\
    \ the actual printing of files.\n\n# The “lp” Command:\n\nThe “lp” command (for\
    \ line printer), is used to dispatch the\nprint job into the print queue of the\
    \ default printer. On\nsuccessful completion, it returns a “request-id” to the\
    \ user.\nThis “request-id” is the number of the print job in the print\nqueue.\
    \ This id can be used to cancel the print request, from\nthe print queue, much\
    \ like a process-id can be used to kill a\nprocess.\n\nThe “lp” command takes\
    \ great care to print a “banner page”\nwith each printout, so that a user can\
    \ identify his printout,\nt the piles of printouts that collect at the default\
    \ printer.\n\nThe “lp” takes a filename(s) as its argument, though it can\nalso\
    \ accept input from the standard input if no files are\nspecified.\n\nTo print\
    \ a file, you can use the “lp” command straightaway,\nor route the output through\
    \ the “pr” filter and then pass it\non to “lp”.\n\n```\n$ lp /usr/user/memol memo2\
    \ report1\nrequest id is lp-32 (3 files)\n$ \n```\n\nThe return of a request-id\
    \ signifies that your print request\nhas been passed on to the print queue. Alternately,\
    \ to print\nthese file with line numbers, using your own page length\n header,\
    \ you would use the command:\n\n```\n$ cat memol memo2 report1 | pr -n -h \" Owner:\n\
    $SLOGAME\" | lp -w request id is lp-32 (standard input)\n$ \n```"
