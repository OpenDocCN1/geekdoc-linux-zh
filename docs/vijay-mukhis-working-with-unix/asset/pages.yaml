  md: 'Thus we conclude that the rsh is not completely secure. Any skilled Unix user
    can break through the Restricted Shell and once again acquire the main Shell,
    provided the main Shell exists in the background.


    One of the best ways to forcibly impose the Restricted Shell on any user, is to
    add it to the /etc/passwd file. The last field in this file specifies the Shell
    for each user''s login. If no Shell is specified, the default is /bin/sh. If this
    value should be changed by the superuser to /bin/rsh (remember only the superuser
    can directly write to the "passwdd" file), then rsh would become the primary Shell
    for that user.


    Such a user, when he attempts to kill the Restricted Shell, will be logged out
    of the system. At our installation there was an "b77". The entry for this user,
    in the /etc/passwd file, was the following.


    ```

    # cat /etc/passwd | grep ''b77''

    b77:*:224:50::/data/bb7:/bin/rsh

