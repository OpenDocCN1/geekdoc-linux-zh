    This construct is meant to be a replacement for a series of

    "if", "then" and "elif" constructs in a program. At times, the

    conditions to check for, are so numerous, that using the "if",

    "then" construct becomes very tedious. The "case", "esac"

    construct provides the ideal solution.


    The syntax of the "case", "esac" construct is:


    ```

    case $word in

    pattern1)

    command1

    command2

    last command

    ;

    npattern2)

    command1

    command2

    last command

    ;

    npattern3)

    command1

    command2

    last command

    ;

    *)

    command1

    command2

    last command

    ##

    esac

    ```'
