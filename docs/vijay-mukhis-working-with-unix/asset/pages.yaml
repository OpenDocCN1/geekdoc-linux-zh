- img_proc: true
  md: '# Working With Unix


    A process executing on Unix can be assigned a “priority” that ranges from 0 to
    39. Normally when a process executes, it is assigned a “priority” of 20. This
    is a default value that the system assigns as the “priority” for the process.
    The point to be noted is that, if the “priority” of the process is made lower
    than 20, it will execute faster and vice-versa. Yes, it is rather paradoxical
    that the higher the “priority” of a process, the slower it will execute.


    A normal user of the Unix system is not permitted to decrease this “priority”
    and consequently grab the CPU. That way, an inconsiderate and avaricious user
    could grab the CPU for himself and programs run by other users would take very
    long to execute. The ethics of a multi-user operating system would never permit
    it.


    Consequently, normal users are only allowed to increase the “priority” of their
    processes beyond 20, making them slower by giving an increment to the default
    “priority”. The superuser is permitted the facility to decrease the “priority”
    of processes by giving a negative increment to the default priority, thus making
    the process gain the attention of the CPU earlier.


    For example, if a normal user types:


    ```

    $ nice ls -alR

    ```


    his “priority” will increase. Even though no actual increment is specified, the
    default increment of 10 is taken, hence the process “priority” increases to (20+10)
    30. This process will execute much slower than the normal ls -alR command, whose
    “priority” will still be 20. To specify an even higher increment and make your
    process slower, you could specify any increment from 0 to 19.


    ```

    $ nice -15 ls -alR

    ```'
  merge: -1
  pgno: 297
- img_proc: true
  md: 'The “priority” assigned to this process is now (20 +15) 35. If your Unix system
    has several users and a heavy work load, go a cup of coffee and come back to see
    the output.


    As usual, the superuser can do what the lesser mortals can''t. He is the only
    one in the entire Unix world who can decrease the “priority” of his process, to
    make it execute faster. The superuser can assign a negative increment to the **nice
    command**, thus making the effective “priority” of his process less than the default
    20. Let''s take an example.


    ```

    # nice -15 cat /etc/passwd

    ```


    The priority of this process now becomes (20-15) 5 and the process executes very
    fast.


    Therefore, to keep a time-consuming program from tying up the whole system, run
    the program in the background with a high “priority”, giving it low preference.


    # The Unix stopwatch: The “time” command


    Let''s say you wanted to find out how long Unix takes to execute a command that
    you submit to it. Get a stopwatch and reset it. Then hit the "Enter" key and start
    the stopwatch, and...


    Messed it up, didn''t you? The **time command** is the answer for you. The time
    command** precedes a normal Unix command and displays the ‘real’, ‘user’ and ‘system’
    times, that the command following it utilized. This time is displayed in seconds.


    We have seen how the “priority” of processes can be increased making them slower,
    using the **nice** command. Now let''s seek first time a normal process that has
    a “priority” of 20, by default, and time the same process again after increasing
    its priority.'
  merge: -1
  pgno: 298
- img_proc: true
  md: '# Working With Unix


    ```

    $ time ls -LR > list

    real 2.1

    user 0.6

    sys 0.5

    $

    ```


    Note that the output of the ls -LR command is re-directed into a file, but the
    output of the time command always appears on the standard output and cannot be
    re-directed into a file.


    The “real” time is the actual time elapsed since the beginning of command execution
    upto its termination. From the above output, we can conclude that a total of 2.1
    seconds elapsed since the command began executing and its termination.


    The “user” time is the amount of time that the program spends executing its own
    code. For small Unix programs, which take milliseconds to execute, this time is
    often shown as 0.0.


    The “sys” time is the time used by the Unix system in order to execute the command.
    Thus we can conclude that the actual amount of CPU time spent on executing a command
    is the sum of its “sys” and “user” times.


    Now let''s try using the nice command and increase the “priority” of the process
    by the maximum permissible increment of 19.


    ```

    $ time nice -19 ls -LR > list1

    real 3.1

    user 0.6

    sys 0.8

    ```


    Note how the times differ significantly. The “user” time, which is the time that
    the program takes to execute its own code, however, remains the same.'
