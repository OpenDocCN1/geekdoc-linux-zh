  md: '# Working with Unix


    Let''s take a simple command rm which is used to remove files or directories.
    You could use the -i switch to make the deleting process “interactive”. You could
    specify the argument “test” which could be a file existing in the current directory.
    The entire command would look like:


    ```

    $ rm -i test

    ```


    The minute you hit the “Enter” key, the Unix Shell swings into action to interpret
    the command. You should be aware by now that the Shell acts as a command interpreter
    which analyzes the command that user keys in at the Shell prompt and invokes the
    appropriate executable file.


    The command is basically broken up into three words. The first word is necessarily
    a Unix command, i.e. an executable program. The search for a command begins according
    to the PATH set in the environment of the Shell.


    One of the most important concepts linked to Unix commands is the PATH. Just as
    the user has to be constantly aware of his current working directory, he has to
    be equally aware of his current PATH. The rule with PATHs is rather elementary.
    Set your PATH to such directories which offer the maximum possible Unix executable
    programs. For a normal user, the day-to-day Unix commands are located in the /bin
    and /usr/bin directories. All the commands which could not be categorized amongst
    these directories are placed in the /etc directory, which, as the name suggests
    contains all the “etcetera” commands. These commands are generally used for system
    administration. To check out your present path, type in:


    ```

    $ echo $PATH

    /bin:/usr/bin::

    ```'
