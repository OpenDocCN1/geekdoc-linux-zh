  md: '# VIJAY MUKHI''S


    # Working with


    # UNIX


    ![](img/2b13e596b1053c0c9f492dfe40dfa70a_563_0.png)


    Unix. Born in the dark and somber portals of Bell Laboratories, it was a dream
    that one man nurtured and cherished. Like a parent, reared the infant with compassion
    and zeal. And as the fledgling grew and spread its wings, it caught the attention
    of the world.


    What had begun as a sequel to the failure of MULTICS, became a force to reckon
    with in the modern world. The scholars raved, the Universities were bowled over,
    and a golden chapter began in the annals of multiuser computing. Unix had arrived.


    This book is a journey through 071-AAF-631 of Unix. A tryst with its powerful
    commands, at both levels. It also takes a detour through the depths of it and
    System Administration. It breaks through tradition and complexity that Unix is
    bestowed with. With the commands based on them travel the human face of


    With enough landmarks along the way, it''s a smooth journey through the Portals
    of Power.


    Cover design by Abhilasha Modi


    # BPB PUBLICATIONS

    B-14, Connaught Place, New Delhi-110 001.


    Price Rs. 150/-'
  merge: -1
