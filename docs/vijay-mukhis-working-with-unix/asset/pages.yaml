    ```


    Command substitution, is thus, a very important part of Shell programming. It
    is a very convenient way to assign the output of any valid Unix command to a user-defined
    variable.


    Let''s take some more examples. Command substitution only demands that a valid
    Unix command be included in grave accents. The commands may even contain a pipe,
    filter or any other Unix command line utilities.


    ```

