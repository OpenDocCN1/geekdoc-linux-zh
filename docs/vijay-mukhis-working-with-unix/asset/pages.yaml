  md: '# FILE SYSTEMS AND DEVICE MANAGEMENT


    All operating systems require interaction with various media such as disks and
    magnetic tape from the time you install your system to the daily routine backup
    tasks. Unix has an incredible understanding of a vast multitude of media, some
    of which have become obsolete today.


    Unix’s understanding of media and devices comes from special files located in
    the “dev” directory. This is the fountainhead of wisdom as far as all devices
    are concerned. Therefore the “/dev” directory is a sort of ‘window’ that Unix
    has to the external world.


    ![](img/2b13e596b1053c0c9f492dfe40dfa70a_382_0.png)'
  merge: -1
  pgno: 382
- img_proc: true
  md: '# Working With Unix


    Typically the /dev/ directory contains hundreds of files that permit Unix to understand
    a range of external devices like disks, floppy disks, tapes, terminals, printers,
    mice and the works. For each device, there are numerous classes and types. And
    for each, a unique file. That''s the global picture of Unix device management.
    Critically file-dependent. The loss or accidental damage of even one among this
    whopping multitude of files, could lead to chaos.


    One of the best ways to get a clear picture of Unix device management is to think
    of it as a database of device drivers with nondcript names that make little sense
    and are most arcane. We will tackle them one at a time, starting with the disk,
    the very media on which the Unix system resides.


    A bit of theory, first, that will help clear the fundamentals before we take the
    plunge


    # Disk Blocks and Inodes:


    For optimization of storage and tracking efficiency, files are stored on disk
    in some multiple of 512 byte sectors. These sectors are referred to as logical
    blocks or simply blocks. Generally Unix systems use two 512-byte sectors to form
    one logical block of 1024 bytes.


    When you copy, create or modify files, Unix handles the chore of saving the contents
    of the file on disk. Unix takes care to reserve enough blocks to hold the files.
    Now, with a minimum space allocation of one block per file, even a trivial 5-byte
    file could use a full block on disk. Thus a the number of available disk space
    by 1024 bytes! On the same lines, a file of size 1025 bytes would use up two full
    disk blocks. Worse still, a directory too would use up one full block of disk
    space even if it were empty!'
  merge: -1
  pgno: 383
- img_proc: true
  md: 'All this may seem like a sad case of poor design. But Unix has its own reasons
    to allocate space in terms of blocks. Remember that Unix has to translate each
    file name into an actual physical location of data on disk. And the physical locations
    of data on disk are based on block numbers of the file system(s) on disk.


    As users delete existing files, blocks are made available to new files or existing
    files that need to expand. Deleting files leaves blocks isolated within areas
    of allocated blocks. Thus, when new files are created, blocks allocated to it
    may be scattered across a large portion of the disk. Such a file is referred to
    as a fragmented file. That''s where inodes come


    # Inodes, Inode Tables And Super Blocks:


    In addition to disk blocks, the file system contains a list of all the names of
    files on disk, matched with a pointer to the disk blocks associated with each
    name. Each name and the associated blocks are stored in the inode (or index node).
    We have already referred to inodes in our preliminary discussion on file systems
    in the first chapter. An inode stores a list of data blocks associated with each
    file, along with other relevant details like file permissions, the owner, access
    times and so on. This inode is a number, that is unique to each file and is stored
    in the directory that contains the file. Now the pieces seem to be falling into
    place gradually.'
  merge: -1
  pgno: 384
- img_proc: true
  md: '# Working With Unix


    The number of files that a file system can accommodate depends, not only on the
    number of disk blocks available, but also the number of available inodes. We know
    that when a new file is created, Unix allocates it free inode from a structure
    called the inode table. The number of inodes that can be allocated in each file
    system are limited, so if you have too many small files on disk that take up very
    little physical disk space, remember that they consume one precious free inode.
    There may come a stage, when there is disk space, but no free inodes left to allocate.
    Therefore, it is always a good idea to balance the number of inodes against the
    average filesize to optimize the utilization of disk space.


    The inode table, referred to above, is always read into memory when the system
    boots, so that Unix does not have to access it from disk and slow down file I/O
    operations. The Unix file mechanism refers to the inode table in memory to ensure
    speedy access and avoid delays. On disk, the inode table is stored in a special
    block, after the superblock on disk. You will recollect, that we have also referred
    to the superblock, in our preliminary discussion on file systems. We were just
    dropping names then, now we get down to the nitty-gritty.


    The memory copy of the inode table is stored on disk at regular intervals of a
    few seconds, by the system itself. (This can be done manually using the "sync"
    command which we have covered before). This process ensures that the superblock
    always reflects the true status of the memory inode table. Thus, in case of a
    system crash, or a power failure, the memory will be completely erased, but a
    recent copy of the inode table is stored on disk, thus enabling the user to initiate
    a recovery process. The recovery process would compare the inode table on disk,
    which may be only a few seconds out of date with the directory entries. Repair
    and recovery becomes a feasible and relatively easy task.'
  merge: -1
  pgno: 385
- img_proc: true
  md: 'A single monolithic discussion of the Unix file system could throw any reader
    out of sanity and mental balance. Exploring the Unix file system must be done
    in slow, feasible steps of gradual discovery.


    # File Systems: The User''s Perspective


    The whole gamut of disk blocks, inodes, and other relevant information associated
    with disk usage, is maintained separately for each file system on the machine.
    Each physical disk attached to the machine must have at least one file system.
    A physical disk, however, may also contain more than one file system. Though the
    reverse is not true. No file system can span more than one physical disk.


    Our Unix has two physical disks containing one file system each. One file system
    called "root" which is mandatory, resides on one disk, and the other file system
    called "data" was created on the other disk.


    Individual file systems are handled differently by Unix. In fact, files residing
    in two different file systems can have the same inode number. This is impossible
    for files within the same file system, since inode numbers are unique to files.
    This is why Unix does not permit the linking of files (using the "ln" command)
    across file systems.


    This individual handling of file systems is not without benefits. If one file
    system fails, the other is unaffected. However, if by some mischance, the "/root"
    file system fails, the entire system will collapse.


    # Hard Disk Management:


    One of the primary concerns of the System Administrator of a Unix installation
    is efficient hard disk management. Since the hard disk is the media that stores
    the Unix system itself, its maintenance and upkeep is of primary importance.'
  merge: -1
  pgno: 386
- img_proc: true
  md: '# Working With Unix


    The System Administrator, has to, regularly check for the integrity of various
    file systems and the amount of disk space available. This task is not as mundane
    as it sounds. Neglect of this everyday task can sometimes lead to a system crash.


    # Check For Free Disk Space:


    The "df" command:

    You can determine the amount of free disk space on the disk for each file system
    using the "df" (for disk free) command. In an effort to be more informative, this
    command provides information on both, the used as well as free disk space, for
    each file system.


    ```

    $ df

    /       (/dev/root) :) 12976 blocks 27649 i-nodes

    /data (/dev/data) :) 87122 blocks 32244 i-nodes

    $

    ```


    We have two file systems on our machine called "/dev/root" and "/dev/data". These
    two file systems reside on two separate physical hard disks. The "df" command
    promptly displays the number of free disk blocks and inodes for both file systems.
    The "df" command extracts information on existing file systems from a file.


    Thus to obtain a detailed listing of the block and inode usage of the existing
    file systems, you can use the command:


    ```

    $ df -ivt Filesystem blocks used free %used iused ifree %used

    /       (/dev/root) 277086 264118 12968 95% 6976 27648 20%

    /data  (/dev/data) 299006 211884 87122 70% 5116 32244 13%

    $

    ```


    360'
  merge: -1
  pgno: 387
- img_proc: true
  md: 'This shows, in detail, the total number of used and free disk blocks and inodes
    for each file system and displays the same figures as percentages to enhance their
    understanding. To top it all, explanatory headings are displayed above each field
    to explain the significance of the figures. The file system commands in Unix are
    amongst the most helpful and informative commands you can come across. After all,
    Unix doesn''t want you going about business ignoring the very basis of its existence:
    files.


    One important point to be noted about this utility is that it counts blocks in
    sizes of 512 bytes irrespective of the block size on your disk. Thus to determine
    the actual amount of disk space free in bytes, you will have to multiply the free
    space reported by "df", by 512. For example, in our root file system, the actual
    free disk space is:


    12968 * 512 = 6639616 bytes (or approx 6.33Mb)


    That''s a close call. This small amount of space can be filled up in no time at
    all. We''ve informed the System Administrator about this, and he''s presently
    chalking out strategies to create more space in the "/dev/root" file system.


    # The “dfspace” Shell Script: Sleeker and Smarter


    This is not a valid Unix command, but instead a very useful Shell Script that
    is provided by the suppliers of Unix. The file is present in the "/etc" directory
    and its owner is the "root".


    ```

    $ ls -l /etc/dfspace

    -rwxr-xr-x 1 root sys 1944 Jun 11 1990 /etc/dfspace

    $

    ```'
