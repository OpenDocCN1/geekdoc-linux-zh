  md: '# Working with Unix


    The first thing you''d like to know, in such a case is, where in the vast Unix
    system is the executable file of vi located. No problem. You''d want to use the
    find command straightaway. It''s very powerful, and also one of the most widely
    used commands in Unix. But there''re a few problems. To find a directory called
    vi, or /. It''d have to start looking from the “root” directory. It would also
    be time-consuming. Don''t despair. The type command comes to the rescue.


    ```

    $ type vi

    vi is /usr/bin/vi

    ```


    Found it! The executable file for the vi editor is located in the /usr/bin directory.
    Now make sure that this path appears in your PATH variable, in your .profile file,
    and you''ll never have to face such problems with vi again. Let''s take a few
    more examples.


    ```

    $ type grep

    grep is /bin/grep

    $ type grep

    egrep is /usr/bin/egrep

    ```


    See how useful this command is? One would have thought that the executable files
    for grep and egrep would both be located in the same directory, /bin. Not so.
    Try this command.


    ```

    $ type cd

    cd is a shell built in

    ```


    This means that there is no executable file for the cd command. Instead, this
    command is built into the Unix Shell itself. It obviously implies that a user
    can use the cd command no matter what his PATH is set to.


    Finally, let''s find out where the type command itself comes from.'
