    # The Unix Environment:


    In Unix there are a wide range of customizable environmental variables which control
    the environment in which the user is working. The Shell interacts with the environment
    in several ways that exert a critical influence on command execution.


    One of the most important variables as far as environment goes PATH. The PATH
    variable tells the operating system where to search for the executable command
    file that has been invoked from the command line. As explained before, the Shell
    starts searching for an executable file when a command is entered at the Shell
    prompt. The search begins and follows the path set in PATH. Since most Unix commands
    are included in /bin or /usr/bin, these two directories are very wisely included
    in the PATH. The dot (.), stands for the current directory that the user is working
    with. This implies that Unix will first look for the executable file in the current
    directory, and then look elsewhere as informed by the PATH variable.


    The SHELL variable denotes the path of the current Shell program that is executing
    on the system. In our system we were using the Bourne Shell whose executable program
    is in the /bin directory and is called sh. If you are using the C Shell, your
    SHELL variable will show /bin/csh. If the Korn Shell is your cup of tea, you could
    see the same variable display /bin/ksh.'
