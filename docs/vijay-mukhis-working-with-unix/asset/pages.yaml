- img_proc: true
  md: "# Pipes,Filters And Pattern Searching\n\nNow's the time to introduce one of\
    \ the salient features of the nl command utility. The nl understands the text\
    \ in terms of logical pages. Line numbering is reset at the start of each new\
    \ logical page. A logical page consists of a header, a footer and body text.\n\
    \nnl understands three logical parts of a page. The header, body text and the\
    \ footer. The file has to be modified in order to help nl make the demarcation.\
    \ Open the file and insert the codes mentioned below to demarcate the file into\
    \ three sections.\n\n+   1) The page header is marked by a (\\:\\:) in the file.\n\
    \n+   2) To signify the end of the header and start of the body insert (\\:\\\
    :) in the text.\n\n+   3) The page footer is marked by inserting a (\\:) in the\
    \ text.\n\nLet's insert these codes into the file that we considered in the first\
    \ example, \"file1\". After having inserted the codes for header, body text and\
    \ footer, the file looked like:\n\n```\n$ cat file1\n\\:\\:\\\nThis is the header\
    \ of the file\n\\:\\:\nThe nl command in its entirety is vast\nThe number of options\
    \ can make you dizzy\nSo easy does it\n\\:\nThis is the footer\n$ \n```\n\nHaving\
    \ inserted these codes into \"file1\", try giving:\n\n```\n$ nl file1\nThis is\
    \ the header of the file\n1 The nl command in its entirety is vast\n```"
