- img_proc: true
  md: 'The above command would find a line in the file that contains only “The meeting
    ends at” and not “The meeting ends at 3 PM”. This property of exact matching is
    available only with fgrep. The pattern file option is the same here, as we have
    shown in egrep.


    That''s the grep family is all about. Simplistic but powerful. Without doubt,
    the best pattern searching tools available under Unix.


    # Debugging Pipes: the "tee" command:


    In long pipelines, users often fail to keep track of which output is piped to
    which command. The error becomes apparent only when the last command writes its
    output to the standard output. Now the main problem is to ascertain the command
    which produced an undesired output in the pipe, causing the erroneous result at
    the end.


    Since the output of every command cannot be viewed on the standard output, the
    logical solution to debugging the pipeline is to use the tee command in between.


    The tee command is a simplistic filter that reads data from the standard input,
    stores it in a file and writes the data unchanged to the standard output. This
    makes it an ideal filter to use in a pipeline since instead of accepting data
    and simply passing it on to the next command, it stores it in a file and then
    passes the same to the next command. The tee command does not disrupt the pipeline
    but only makes it fraction slower.


    The tee command creates a file on disk and places the output of the command that
    precedes it into this file. Hence, if the final result of the pipe is incorrect
    or undesired, the files created by tee may be opened and scrutinized to determine
    which of the commands produced an incorrect output.'
  merge: -1
  pgno: 251
- img_proc: true
  md: '# Pipes Filters And Pattern Searching


    The **tee** command should always be followed by a valid filename. This becomes
    the file in which **tee** stores the output that the preceding command provides.
    Let''s use the **tee** command in a long pipeline and check for errors.


    ```

    cat nameal2|egrep -i ''Al+''|sort -d|tee verify uniq -u

    ```


    The name **tee** is derived from the alphabet “T” since this command creates a
    “T” shaped pipeline. Let''s trace the flow of data in this pipeline.


    ```

    cat — egrep — sort — uniq

    ||

    text file

    (verify)

    ```


    See the “T”? In the above case, the output file “verify” will contain names like
    “Allan”, “Alfred”, and “Al”. These names will be sorted alphabetically. In case
    you see an output that''s not correctly sorted, you could open the file “verify”
    and check where the sort command went wrong.


    ```

    $ cat verify

    Al

    Ali

    Allan

    alfred

    $

    ```


    The name “alfred” appears last since, due to some error, it was spelt with a lowercase
    “a”. The solution now becomes obvious. Include the “fold” option in the **sort**
    command so as to “fold” uppercase letters to lowercase, ensuring that “alfred”
    can regain his rightful place. The perfect pipeline for the above task now becomes:


    ```

    cat nameal2 | egrep -i ''Al+'' | sort -df| uniq -u

    ```'
