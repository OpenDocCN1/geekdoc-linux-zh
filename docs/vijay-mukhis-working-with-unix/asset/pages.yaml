    The rmso is for “reverse mode serial output”. The terminal is restored to normal.
    So what''s the secret? Magicians never tell, but we will.


    There is a database that contains useful information for all terminal types that
    Unix understands, in the /etc directory, called /etc/termcap. This database defines
    sequences for several terminal types. The tput command reads the value of the
    TERM variable and looks up the escape sequences that would make the characters
    blink on the terminal, or appear in reverse vt100, and so on.


    Our terminal type was DEC vt100, so tput looked up the sequences for blinking,
    reverse video, etc., and transmitted the codes to the terminal. Hence all data
    that appeared on the terminal from then on, acquired the new look.


    # Setting Terminal Options:


    The “tty” command:


