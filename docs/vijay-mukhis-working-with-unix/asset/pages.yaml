  md: '# Working with Unix


    The TERM variable denotes the type of terminal supplied by the vendor. Since we
    were using a PC-Emulator program that converts a smart PC into a dumb Unix terminal,
    our terminal was listed as vt100. Our terminal emulator program was called “vterm”
    and the value for term, viz vt100 is the type of terminal that “vterm” supports.
    If you have a different value for TERM, there''s no cause for worry.


    The last variable TZ is an abbreviation for “Time Zone”. Our time zone was appropriately
    listed as IST (Indian Standard Time) and following that, is the time difference
    between the Indian Standard Time and Greenwich Mean Time (GMT) which is displayed
    as “5:30” for five and a half hours.


    These are not all the variables that are part of the Unix environment. They are
    only the very important few. The Unix environment can be tailor-made so as to
    fit each user''s precise needs. Some variables like PATH and TERM are so important
    that the user Unix session can never take-off without it. So let''s learn how
    to alter the values of these variables. At the Shell prompt, type in the command:


    ```

    $ echo $TERM

    vt100

    ```


    If you encountered the message “unknown”, it means that your terminal is not set
    and you will have to face up to unexpected results and sometimes utter chaos on
    the screen. Some commands like tput clear the screen, require that the TERM be
    set to its appropriate value. To set TERM to its suitable value, refer to your
    system manual or simply ask your system administrator about your terminal type.
    Having noted this, type in at the term command line:


    ```

    $ TERM=Your terminal type

    ```'
