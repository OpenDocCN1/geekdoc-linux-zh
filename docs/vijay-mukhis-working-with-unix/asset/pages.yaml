    OR

    $ cp speech /usr/user1/myspeech

    $

    ```


    # Moving Files: The “mv” Command :


    To move a file implies to remove the file from its current location and copy it
    at a new location. Hence the “move” operation differs from the “copy” operation
    in that the source file is erased from its original location and copied at the
    specified destination.


    The mv command serves two essential purposes. The first purpose is to physically
    remove the file from its current location and copy it at its destination. The
    next goal is to rename files and directories that are specified. We will take
    examples from both these categories.


    To rename a file called “speech” in the current directory, to a file called “speech1”,
    you could use the following order of commands for convenience.

    $ pwd'
