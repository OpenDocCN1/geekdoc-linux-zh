    cylinder size size (physical blocks) = 400

    mkfs: Available blocks = 1160

    #

    ```


    Using the “f-” option, here, we have specified that we wish to create the 1K file
    system (known to Unix as S51K) and, as usual, specified the device name followed
    by the number of disk blocks and inodes.


    This time, since we already had the AFS file system created formerly on the disk,
    the “mkfs” command issued a warning and asked for permission before proceeding.
    As we have mentioned before, creating a new file system on disk erases the formerly
    existing file system, so the warning was entirely justified.'
