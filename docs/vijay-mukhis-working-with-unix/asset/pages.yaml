  md: 'Now that is a lot of filesize errors generated in Phase 1 of the checking procedure.
    But no cause for alarm. The file system should be remounted, and files having
    these inode numbers should be searched, using the “find” command (by including
    the -inum option) and erased if not needed, so that the inodes become free.


    Like all good remedies, if the “fsck” command is used incorrectly, it may harm
    an existing file system. So, exercise a certain amount of caution whilst using
    this command. For detailed reference of all error conditions, and interactive
    system messages that “fsck” displays, refer to the Unix system manual.


    These are some of the most important file system-related commands. The very basis
    of creating and exploring file systems. One of the basic building blocks of the
    Unix operating system. Though, commands listed above, are reserved for the System
    Administrator, all users of Unix must have a sound knowledge of these commands
    and the concepts of the file system as a whole. So don’t let hash prompt (#),
    hamper your interest on file systems in general.


    # Taking Backups of Files:


    The “tar” Command: The “tar” command is short for “tape archive”. The “tar” command
    saves and restores files to and from an archive medium which is typically a tape
    or a floppy disk. This command is very useful in taking backups of files but offers
    a multitude of options to make life difficult for the user. Note that all users
    can use the tar command; it is not restricted only to the superuser. However,
    a normal user will not be allowed to take backups of system files.


    The actions of the “tar” command are controlled by the key argument. The key is
    a string of characters containing, at most, one function letter and possibly,
    one or more function modifiers.'
  merge: -1
  pgno: 411
- img_proc: true
  md: 'The function letters decide precisely what function the “tar” command must
    perform (backup or restore) and the function modifiers control the manner in which
    the function must be executed. There is great emphasis on order. The function
    letters must always precede the function modifiers.


    A good way to learn the “tar” command is to understand about the function letters
    first, followed by the function modifiers, and put the two together to make up
    the final command.


    # The Default Values for “tar”:


    Just like the “format” command, “tar” also reads default values from a file /etc/default/tar.
    This command conveniently stores the default values for any “tar” operation, invoked
    without arguments. This file stores default values for device, blocking factor,
    volume size, and type of device for “tar” operations. Let’s take a peek at this
    apparently-important file.


    ```

    # cat /etc/default/tar

    # (()) defn96.src 22.1 89/11/14

    # device block size tape

    archive0=/dev/rfd04ds9 18 360 n

    archive1=/dev/rfd14ds9 18 360 n

    archive2=/dev/rfd06ds6 10 1200 n

    archive3=/dev/rfd196ds9 10 1200 n

    archive4=/dev/rfd096ds9 18 720 n

    archive5=/dev/rfd196ds9 18 720 n

    archive6=/dev/rfd013ds15 18 1440 n

    archive7=/dev/rfd133ds18 18 1440 n

    archive8=/dev/rct0 20 0 y

    archive9=/dev/rctmini 20 0 y

    # The default device in the absence of a numeric "-f device"

    argument archive=/dev/rfd096ds1501200 n

    #

    ```'
  merge: -1
