  md: '# Working with Unix


    To undo the last nine deletions, vi uses buffers. In fact, buffers are to vi what
    files are to Unix. The source of power and the basis of existence. Since vi uses
    buffers extensively, let''s learn how to use these buffers so as to derive maximum
    benefits.


    vi maintains registers in memory (that''s what vi chooses to call it) in which
    it remembers the user’s changes and deletions. When you press certain keys, it
    simply displays the values of these registers, thus retrieving the user’s deletions.


    To understand this vital concept, let’s create a whole new file. Quit out of vi
    with the write and quit command as shown.


    ```

    wq!

    ```


    The "! overrides any check that occurs before writing the file. If you own a file
    and have not given any write permission, the "!" mark will help overrule any objections
    that Unix has.


