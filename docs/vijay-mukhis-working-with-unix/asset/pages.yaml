    # 4. Dial-In Terminals :


    ![](img/2b13e596b1053c0c9f492dfe40dfa70a_40_0.png)


    Figure 3

    These terminals use telephone lines to communicate with the host. Hence the name
    “dial-in”. The middleman that actually helps transmit data across telephone lines
    is the “modem”.


    In order to transmit data across a telephone line, a process called modulation
    must be carried out first. Technically speaking, telephone lines are designed
    to carry analog signals and the computer generates and understands only digital
    signals. The modem then converts digital signals into analog signals, and transmits
    them over telephone lines. The modem at the other end carries out the reverse
    conversion and feeds the computer at the receiving end with digital signals.'
