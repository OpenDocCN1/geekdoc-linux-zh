  md: 'Gofed you!! The date command in Unix can be used by all users of the system,
    but the permission to set the date is given only to the Boss, the superuser. Each
    user can only use the date command to display the current date. But don''t despair.
    We had to reveal this harsh reality to you at some time or another, and the earlier
    the better.


    We have explained how each file users create is stamped with the date and time
