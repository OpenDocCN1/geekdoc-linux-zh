  md: '# Statement Testing and Coverage


    +   * Testing aimed at exercising programming statements

    * Every executable statement is tested by 100% statement coverage

    * Do not count executable statements

    * Converting code to flow charts is a good way of knowing where the executable
    statements

    * Executable statements are represented by diamonds or rectangles on a flow chart

    * We can also use Conventional Flow Diagrams to determine Statement Coverage –
    this called a Hybrid Flow Diagram

    * Exclude non executable statements that precede BEGIN

    * Ignore blank lines

    * Weak/inadequate measure of test


    # Decision Testing and Coverage


    +   * Decisions in a program are tested

    * A decision is tested when a condition associated with it is true and false

    * 100% decision coverage is measured by counting the number of decisions exercised
    divided by the total number decisions in a program expressed as a percentage


    # Guaranteeing 100% Test Coverage


    Statement Coverage = $\frac{Number of statements exercised}{Total number of Statements}
    \times 100\%$


    Statement Coverage does not guarantee 100% test coverage in a code that has Decisions
    / Branches. Statement coverage is sometimes called C1 coverage


    # Branch & Decision Testing / Coverage


    Branch coverage is the number of branches (decisions) exercised by a test or suite
    sometimes called ''C2 coverage''.


    Branch/Decision Coverage = $\frac{Number of Branches/Decisions Exercised}{Total
    Number of Branches/Decisions}$


    Branch coverage is stronger than statement coverage since it may require test
    cases to achieve the same measure.'
  merge: -1
  pgno: 105
- img_proc: true
  md: 'Example: Consider the following code segment for 100% statement coverage and
    100%

    branch/decision coverage:


    ![](img/52762cc20a1c71379bad2e432b5742a4_106_0.png)


    +   * To achieve 100% statement coverage of this code segment just one test case
    is required which ensures variable ‘a’ contains a value that is greater than the
    value of variable ‘b''

    * This will ensure that only the True path (T) is executed

    * However, branch coverage requires each decision to have had both a true and
    false outcome

    * Therefore, to achieve 100% branch coverage, a second test case is necessary

    * This will ensure that the decision statement ‘if a > b’ has a false outcome

    * This will ensure that the False path (F) is executed as well

    * Note that 100% branch coverage guarantees 100% statement coverage

    * Branch and decision coverage are actually slightly different for less than 100%

    coverage, but at 100% coverage they give exactly the same results


