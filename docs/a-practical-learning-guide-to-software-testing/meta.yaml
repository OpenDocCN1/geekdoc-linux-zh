    A 1.6: The answer is C. Testing cannot prove that software is correct

    Explanation: This question tests your understanding of one of the 7 principles
    of testing - Testing shows presence of bugs does not show that software is bug
    free.

    The purpose of testing is to reduce bugs in software to the minimum by exposing
    as many bugs as possible in the software and confirming (retesting the fixes)
    that these bugs have been removed by software developers when possible. However,
    even when all the bugs exposed in the software have been confirmed as fixed by
    retesting, testing CANNOT guarantee that the software is bug free!


    A 1.7: The answer is A, b, d, e, a

    Explanation: This question tests your understanding of the sequence of activities
    in the Fundamental Test Process.

    The correct order is:


    +   c) Planning and control

    b) Analysis and design

    d) Implementation and execution

    e) Evaluating exit criteria and reporting

    a) Test closure activities (done after Evaluating exit criteria and reporting
    e.g. signing off the Test Summary Report


    A 1.8: The answer is A, c and d

    Explanation: This question tests your understanding of two of the seven Principles
    of Testing


    +   1. Testing shows presence of bugs but does not show that software is bug free.
    This principle is apparent in the option a) The system may be defect but the testing
    cannot guarantee that this is true.

    2. Option c It depends on what the system is designed to do, is also a valid option
    and tests your understanding of another Principle Of Testing. Absence of errors
    fallacy.

    The fact that no errors were outstanding does not imply fitness for life. Users’
    expectations should be met.

    3. Option d Further testing should be considered but this should be focused on
    areas of highest risk tests your understanding of Risk Based Prioritization of
    testing.


    A1.9: The answer is B. It helps prevent defects from being introduced into the
    code

    Explanation: This tests your understanding of economics of testing (part one),
    static verification of work products in V-Model (see part two), characteristics
    of good testing (see part two).Designing tests early in the Software Development
    Life Cycle performing the Analysis and design activities in the Fundamental Text
    Process at the early stages as soon as the requirements become available. This
    means the testers will able to test the requirements by identifying ambiguities
    in the requirements, thus preventing these ambiguities from being passed to the
    coding stages and as a result this will prevent defects from being introduced
