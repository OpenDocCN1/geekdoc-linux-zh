    D. b, c 和 f


    ## 答案 - 第一部分


    A1.1: 答案是 A。测试实施与执行

    **解析：** 此题旨在测试你对基础测试流程中关键活动之一——测试实施与执行的理解。建立测试环境涉及安装相同类型的硬件、操作系统和其他工具（软件应用程序），以仿真生产环境。


    A1.2: 答案是 B。在实践中不可能测试所有组合

    **解析：** 此题旨在测试你对测试七原则之一的理解——穷举测试是不可能的。穷举测试是一种测试方法，其中使用所有可能的数据组合进行测试。然而这在项目中是不可行的。


    A1.3: 答案是 A。为利益相关者编写测试总结报告

    **解析：** 此题旨在测试你对基础测试流程中关键活动之一——评估退出标准与报告的理解。为利益相关者编写测试总结报告是该活动中的任务之一。


    A1.4: 答案是 C。测试分析与设计

    **解析：** 此题旨在测试你对基础测试流程中关键活动之一——测试分析与设计的理解。评审测试基准属于该活动。


    A1.5: 答案是 b) a, d, b, c

    **解析：** 此题旨在测试你对基础测试流程期间执行活动顺序的理解。正确顺序是：

    1. 分析测试基准文档 (a)

    2. 建立测试条件的追溯性 (d)

    3. 定义预期结果 (b)

    4. 创建测试执行计划 (c)


    A1.6: 答案是 iii. 测试不能证明软件是正确的。

    **解析：** 此题旨在测试你对测试七原则之一的理解——测试显示缺陷的存在，而不是无缺陷。


    A1.7: 答案是 A. c, b, d, e, a

    **解析：** 此题旨在测试你对基础测试流程阶段顺序的理解。正确顺序是：

    - 计划与控制 (c)

    - 分析与设计 (b)

    - 实施与执行 (d)

    - 评估退出标准与报告 (e)

    - 测试结束活动 (a)


    A1.8: 答案是 A. a, c 和 d

    **解析：** 此题旨在测试你对测试原则的理解。

    1. 测试显示缺陷的存在但不能保证系统没有缺陷 (a)。

    2. 取决于系统的设计用途 (c)。

    3. 进一步测试应关注风险最高的区域 (d)。


    A1.9: 答案是 B. 它有助于防止缺陷引入代码中

    **解析：** 此题旨在测试你对生命周期早期设计测试的益处的理解，这有助于在编写代码前防止缺陷。


    A1.10: 答案是 B. a, d 和 f

    **解析：** 此题旨在测试你对测试计划期间通常进行的活动的理解：

    - 安排测试分析与设计 (a)

    - 识别测试目标 (d)

    - 选择用于监控和控制的测试指标 (f)


