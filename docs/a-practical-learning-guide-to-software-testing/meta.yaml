    # 5. Number of function calls


    +   - A Function Call occurs when an expression passes control and arguments (if
    it exists) to a function


    +   - When a function within a code is called too many times it may cause a number
    of issues:


    +     - Deep or infinite recursion: when a function calls itself so many times
    that the space needed to store the variables and information associated with each
    call is more than can fit on the stack


    +     - This can cause Stack Overflows (where computer program tries to use more
    space than the stack has available). The call stack is a buffer that stores requests
    that to be handled


    +     - Stack overflow can cause Program Crash


    +     - This can Degrade Performance of the code


    The diagram below illustrates excessive function calls made to some functions
    in a program


    ![](img/52762cc20a1c71379bad2e432b5742a4_82_0.png)


    Figure 17: Number of Function Calls


    # 6. Control flow analysis


    +   - Control flow analysis can find


    +     - Infinite loops


    +     - Inaccessible code (unreachable code)


    +   - However, not all of the things found are necessarily faults


    +   - E.g. Defensive programming may result in code that is technically unreachable


