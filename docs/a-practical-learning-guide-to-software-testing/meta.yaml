    # A 6.2: Answer is D. a, b and d.


    **Explanation:** This question tests your understanding of selection and implementation

    of a testing tool.


    Note: The text text starts with "Determine whether the organisation existing test
    process needs to change.


    +   a) **Determine whether the organisation existing test process needs change.**
    Some tests are better suited to manual testing (e.g. those tests requiring

    human observation or those that require the tester''s knowledge, experience,

    analytical/logical skills, creativity, and intuition). Some tests are best

    performed through automation (e.g. performance testing)

    b) **Conduct a proof of concept.** This is required to evaluate and define if
    the

    tools can be used in an organisation''s test process. Also to evaluate how they

    meet the requirements defined by the stakeholders and to see if the

    organisation''s Test environment fits the tool or if this needs to change

    accommodate the tool and to evaluate the technical skills needed to use the tool

    c) Implement the selected tool on a project before schedule to save time.

    d) **Identify coaching and mentoring requirements for the use of the selected

    tool.** Some of the organisation''s testing resources may be new to the tool;
    it is

    necessary to identify the coaching and mentoring requirements of such

    resources


