    \n**解释：** 此题测试了你对测试控制（Test Control）的理解。测试负责人可能会决定扩大测试范围，以便在某些功能上容纳更多的测试用例。\n当初始测试结果表明应用的某些功能在与另一个应用程序集成后可能出现潜在问题时，可能需要这样做。\n\
    这种操作是为了对被识别为易故障的功能进行更彻底的测试（基于风险的测试）。这些额外的用例也需要编写脚本并添加到测试套用件中。这属于测试控制行为。\n\n##\
    \ A 5.13：答案是 B。显示问题应该多快修复\n\n**解释：** 此题测试了你对事件报告（incident reporting）的理解。为缺陷分配优先级（例如：阻塞、高、中、低）的主要目的是让开发人员能够按照优先级强调哪些需要修复的缺陷。阻塞优先级的缺陷需要开发人员立即采取行动，而低优先级的缺陷通常会被置后处理！\n\
    \n## A 5.14：答案是 C。基于指标的\n\n**解释：** 此题测试了你对测试估算（Test Estimation）的理解。测试负责人在使用基于指标的方法进行测试估算时，通常会分析从之前的类似项目中获取的信息，以为当前项目提供测试估算。\n\
    此类信息（指标）可能包括：\n\n- 测试条件数量。\n- 编写的测试用例数量。\n- 执行的测试用例数量。\n- 开发测试用例花费的时间。\n- 运行测试用例花费的时间。\n\
    - 发现的缺陷数量。\n- 环境中断次数以及每次平均持续时间。\n\n## A 5.15：答案是 B。a 和 c\n\n**解释：** 此题测试了你对主测试计划（Master\
    \ Test Plan）的理解。问题是“以下哪些与生命周期相关的最佳实践是你可能希望在主测试计划中看到的？”由于以下原因，以下选项不太可能包含在主测试计划中：\n\
    \n- b) 如果使用 V 模型，每个项目都应该有四个测试阶段。\n\n**原因：** V 模型并不总是有四个测试阶段。测试阶段会根据项目的不同而异。\n\n\
    - d) 系统测试不应由开发团队执行。\n\n**原因：** 主测试计划中有一个“职责”章节，其中将定义项目内各角色与测试相关的职责，因此没有必要在主测试计划中包含此项。\n\
    \n## A 5.16：答案是 B。可能性和影响\n\n**解释：** 此题测试了你对如何计算风险的理解。风险 = 发生的概率（Likelihood）× 发生时的影响（Cost）。\n\
    \n- 1. 影响和成本：*影响等同成本，所以是错的！*\n- 2. **可能性和影响：*正确答案！***\n- 3. 产品和项目：*这些不用于量化风险，所以是错的！*\n\
    - 4. 概率和可能性：*概率等同于可能性，所以是错的！*\n\n## 第六部分 - 测试的工具支持\n\n## 第六部分涵盖的主\n\n- CAST 工具的类型\n\
    - 向组织引入工具\n\n## 第六部分的学习成果\n\n学习者将能够：\n\n- 理解使用测试工具的优点和局限\n- 根据支持的测试活动对测试工具进行分类\n\
    - 根据使用人员对测试工具进行分类\n- 在选择工具时做出明智的决策\n\n## 什么是测试工具？\n\n- 支持一个或多个测试活动的软件产品，包括：\n\
    \    * 计划和控制\n    * 规范\n    * 测试执行\n    * 测试分析等\n- 任何让测试变得：\n    * 更容易\n    *\
    \ 更快速\n    * 更准确\n\n## 使用测试工具的优点\n\n- 缩短测试时间\n    * 特别是重复性测试\n- 降低测试成本\n- 测试人员能够专注于计划、分析和设计等更多智力任务\n\
    - 鼓励可预测和一致的结果\n\n## 使用测试工具的风险\n\n- 过于乐观的预期\n    1. 供应商设计的环境适合他们展示工具的优点\n    2.\
    \ 然而，该工具可能不适合组织的生产或测试环境\n- 对实施工具所需的努力缺乏认识\n    1. 供应商可能会在组织的测试或生产环境中遇到缺陷\n   \
    \ 2. 在购买之前对工具进行详细的分析和评估至关重要\n\n## 测试工具的类型\n\n- 测试工具根据以下分类：\n    1. 它支持的测试活动/过程\n\
    \        * 有些支持一个或多个测试活动\n    2. 谁使用该工具\n\n## 测试和测试的管理支持\n\n### 测试管理工具\n\n测试管理工具的特点包括：\n\
    \n- 支持测试及执行活动的管理。\n- 与测试执行工具、缺陷跟踪/事件管理工具以及需求管理工具的接口。\n- 独立的版本控制或与外部配置管理工具接口。\n\
    - 支持测试、结果和事件到源文档（如需求规范）的可溯性。\n- 记录测试结果并生成进度报告。\n- 对测试（如运行测试）和测试对象（如事件）进行定量分析（指标），以提供测试对象的信息并改进测试过程。\n\
    \n### 测试管理工具架构\n\n### 事件管理工具\n\n事件管理工具的特点包括：\n\n- 创建事件报告\n- 在整个生命周期内跟踪和维护缺陷\n\
    - 使用数据库存储和管理事件\n- 使用过滤器或 SQL 提取信息\n\n- IEEE 1044 定义了事件工具强制要求的行业或通用标准\n- 数据库字段可能包括：\n\
    1. 优先级：高、中、低\n2. 严重：高、中、低\n3. 执行者：分配给\n4. 状态：新建、开启、已修复、重新打开\n\n### 需求管理工具\n\n\
    - 用于业务分析师记录、管理和排序需求\n- 也用于管理需求的变更\n- 将需求映射到测试（测试条件、测试用例、测试脚本等）\n\n### 配置管理工具\n\
    \n- 用于管理系统完整构建的不同软件硬件版本\n- 用于管理一段时间内各种软件平台的各种完整构建\n- 什么是软件构建（BUILD）？\n    - 软件构建是在进行较小更新时应用于软件版本的数字\n\
    \    - 软件构建就像子版本号\n    - 修复漏洞、问题（大多是小问题，有时也有大问题）有时甚至是微小功能的添加补丁会导致软件构建发生更改\n\n\
    ## 静态测试的工具支持\n\n### 评审过程支持工具\n\n- 评审过程支持工具可能：\n- 存储评审过程信息\n- 存储和沟通评审意见\n- 报告缺陷和工作量\n\
    - 管理评审规则和/或清单\n- 跟踪文档与源代码之间的追溯性\n- 它们可能为在线评审提供帮助，这对于地理分散的团队非常有用\n\n### 静态分析工具\n\
    \n- 静态分析工具支持开发人员、测试人员和质量保证人员在动态测试期间发现缺陷。\n- 它们的主要目的包括：\n- 强制执行编码标准。\n\n"
