    +   4. Nesting levels


    +   * Relate to how deeply nested IF statements are within other IF statements


    +   * This is a good metric to have in addition to Cyclomatic Complexity, since
    highly nested code is harder to understand than linear code, Cyclomatic Complexity
    does not distinguish them


