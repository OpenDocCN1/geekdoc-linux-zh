    # Answers - Part One


    A1.1: The answer is A. Test Implementation and Execution

    **Explanation:** This question is to test your understanding of one of the key
    activities in the Fundamental Test Process - Test Implementation and Execution.
    Setting up the test environment involves installing the same type of hardware,
    operating system and other tools (software applications) to emulate the production
    environment.


    A1.2: The answer is B. It is not practically possible to test them all

    **Explanation:** This question is to test your understanding of one of the 7 principles
    of testing - Exhaustive testing is impossible. Exhaustive testing is a Test Approach
    in which all possible data combinations are used for testing. This is however
    not practicable on a project. On large software development projects, the complexity
    of software makes validating every system permutation, input combination, and
    software feature impossible


    A1.3: The answer is A. Writing a Summary Report for stakeholders

    **Explanation:** This question is to test your understanding of one of the 5 activities
    of the Fundamental Test Process - Evaluating exit criteria and reporting. Writing
    a Test Summary Report for stakeholders is one of the tasks performed during the
    activity of Evaluating exit criteria and reporting. A Test Summary Report is a
    working product that formally summarises the results of all testing activities
    on any project. A Test Summary Report may include total of Test Cases designed,
    total number of Test Cases executed, total number of cases yet to be executed,
    total number of pass cases, total number of failed cases, total number of bugs
    and so on.


    A1.4: The answer is C. Test Analysis and Design

    **Explanation:** This question is to test your understanding of one of the 5 activities
    of the Fundamental Test Process - Test Analysis and Design. Reviewing the test
    basis is a Test Analysis task. The test basis is the documentation needed in order
    to start the test analysis and create Test Cases. Test analysis is the process
    of examining (Review) an object or work product (test basis) that can be used
    to derive test information (Test Cases).'
