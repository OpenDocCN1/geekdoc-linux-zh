  md: "# Expected Results\n\n+   * External specifications and baselines define what\
    \ the software is required to do\n* Requirements Specification, Functional Specification,\
    \ Design Specification etc. are baselines\n* Without requirements, developers\
    \ cannot build and testers cannot test\n* Programmers need them to write the code\n\
    * Testers need them to:\n\n+     * identify the things that need testing\n  *\
    \ compare test results with requirements\n\n+   * When we test we get an actual\
    \ result\n* We compare the actual results with the requirements to determine whether\
    \ a test has passed\n* A baseline describes what we require the system to do\n\
    * User requirement, design specification and sometimes the 'old system' tells\
    \ us what to expect\n\n# Why Expected Results\n\n+   * If we don't define expected\
    \ result before we execute the test, erroneous result may be interpreted as the\
    \ correct result\n* There may be a subconscious desire to see the software pass\
    \ the test\n* Expected results must be defined before test execution, derived\
    \ from a baseline\n\n# Prioritisation\n\n# Why prioritise?\n\n+   * Testers never\
    \ have enough time\n* **First principle**: to make sure the most important tests\
    \ are included in plans\n* **Second principle**: to make sure the most important\
    \ tests are executed\n* If tests reveal major problems, its better to find them\
    \ early, to maximise time available to correct problems\n\n+   Most important\
    \ tests are that:\n  * address most serious risks\n  * cover critical features\n\
    \  * have the best chance of detecting faults\n\n+   Some methods for Prioritization\
    \ in Testing:\n* Test inventory\n* Feature inventory\n* Test condition inventory\n\
    * Behaviour inventory"
