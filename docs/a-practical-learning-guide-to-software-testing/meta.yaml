    \nThis question tests your understanding of the following:\n\n* Characteristics\
    \ of good testing\n* V - Model\n* Iterative Model\n* Front-loaded testing\n\n\
    It is good testing practice to start testing activities like Review of draft requirements,\
    \ at the earliest opportunity when they are available to Testers, for the following\
    \ reasons:\n\n* Prevention of defects that could be due to ambiguities in documents\
    \ used to develop the code\n* When Testers review documents, they also use this\
    \ opportunity to get familiar with the desired functionalities of the solution\n\
