    \ of the test environment\n* Scheduling of all test activities\n* End of project\
    \ Test Summary Report based on information gathered during testing\n\n# Tasks\
    \ of a Tester\n\n+   * Reviewing and contributing to the development of a test\
    \ plan\n* Analysing , reviewing and assessing user requirements, specifications\
    \ and other models for testability\n* Creating test specifications from test basis\
    \ (baselines)\n* Setting up test environment\n  * May need to liaise with system\
    \ administration and test management or environment management\n* Creating or\
    \ acquiring test data\n* Implementing tests on all Test Levels\n* Using test administration\
    \ or test monitoring tools\n* Automating tests (may be supported by a developer\
    \ or automation expert)\n* Reviewing tests developed by other testers\n* Running\
    \ tests and measuring performance of components when applicable\n\n# Test Strategy\n\
    \n+   * Document that describes the Testing Approach of the software development\
    \ cycle\n* Developed to inform project participants (e.g. Project Managers, Testers\
    \ and Developers) about some key activities and issues of significance in the\
    \ testing process as:\n  * Test Level to be performed\n  * Roles and Responsibilities\n\
    \  * Environment requirements\n  * Testing Tools\n  * Risks and Mitigation\n \
    \ * and many more\n* Writing the Test Strategy is the Test Leader’s responsibility\
    \ (depending on the size of the project). However if only one tester is to be\
    \ used then this person needs to write out a strategy\n* Test Strategy document\
    \ is a static document which is not updated too often"
  - "[PAGE 131]\n\n# Test Approach\n\n+   * It is the implementation of the Test Strategy\
    \ of a project\n* It defines how testing would be carried out\n* It could be:\n\
    \  * 1. Preventative – when developed early in the life cycle to prevent defects\
    \ being built into the final solution\n  * 2. Reactive – when left to just before\
    \ the start of test execution\n\nOR\n\n# Types of Test Approach\n\n+   * Analytical\
    \ approach – used in risk based testing\n* Model based approach – used in stochastic\
    \ testing (statistical information failure rates)\n* Methodical approach – failure\
    \ based, error guessing, check-list, quality-characteristic based\n* Standard\
    \ Compliant approach– based on industry specific standard\n* Process-compliant\
    \ approach – adhere to processes within development like Agile and Waterfall\n\
    * Dynamic and Heuristic approach – exploratory testing\n(remember!), execution\
    \ and evaluation are done concurrently\n* Consultative approach – Test Coverage\
    \ is driven by advice from experts outside the test team e.g. business domain\
    \ experts or technology experts\n* Regression-averse approach – reuse of extensive\
    \ test materials and standard test suites\n\n# Factors for choosing Test Approaches\n\
    \n+   * Risk of failure\n* Skills and experience of people to be involved in using\
    \ proposed techniques, tools and methods\n* Objective of testing endeavour and\
    \ mission of the testing team:\n  * E.g. may be to only find the most serious\
    \ bugs\n* Regulatory aspects\n* Nature of product and business\n  * Approach for\
    \ testing mobile phone solution will be different to testing online banking solution\n\
    \n# Test Plan\n\n+   * It describes among other things the scope (what), approach\
    \ (how), resources (who) and schedule (when) of intended Test Activities.\n* It\
    \ sets out the how testing will be done in your project"
