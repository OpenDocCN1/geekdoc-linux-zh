    \ development process\n- As a result, the development process may accelerate and\
    \ improve by having less rework\n\n# Tool Support for Test Specification\n\n#\
    \ Test Design Tools\n\n- Generate test inputs or the actual tests from:\n  - Requirements\n\
    \  - Graphical user interface\n  - Design models (state, data or object)\n  -\
    \ Code\n- May generate increased outcomes as well\n- They can save valuable time\
    \ and provide increased thoroughness of testing because of the completeness of\
    \ the tests that the tool can generate\n- Can aid in supporting the generation\
    \ of tests by providing structured templates, sometimes called a test frame, that\
    \ generate tests or test stubs, and thus speed up the test design process\n\n\
    # Test Data Preparation Tools\n\n- Test data preparation tools manipulate databases,\
    \ files or data transmissions to set up data to be used during the execution of\
    \ tests\n- A benefit of these tools is to ensure that live data transferred to\
    \ a test environment is made anonymous, for data protection\n\n# Tool Support\
    \ for Test Execution and Logging\n\n# Test Execution Tools\n\n- enable tests to\
    \ be executed automatically, or semi-automatically, using stored inputs and expected\
    \ outcomes, through the use of a scripting language\n- The scripting language\
    \ makes it:\n  - possible to manipulate the tests with limited effort, for example,\
    \ to repeat test with different data\n  - possible to test a different part of\
    \ the system with similar steps\n- Generally these tools include dynamic comparison\
    \ features and provide a test log each test run.\n- Test execution tools can also\
    \ be used to record tests, when they may be referred to as capture playback tools\n\
    - Capturing test inputs during exploratory testing or unscripted testing can be\
    \ useful in order to reproduce/ or document a test, for example, if a failure\
    \ occurs.\n\n# Test Harnesses\n\n- A Test Harness is a script software (sometimes\
    \ provided by the test execution tool vendor) used when a test execution tool\
    \ is used to build automated scripts\n- Is a collection of software and test data\
    \ configured to test a program unit by running it under varying conditions and\
    \ monitor its behaviour and outputs\n- Harnesses often have built-in error handling\
    \ facilities to manage the anomalies that often occur during automated testing.\n\
    - Although most vendors offer built-in harnesses, most users build their own harnesses\
    \ using the script language specific to their own unique needs\n- Test should\
    \ include the following capabilities:\n  - A standard way to specify setup (i.e.,\
    \ creating an artificial runtime environment) and cleanup.\n  - a method for selecting\
    \ individual tests to run, or all tests.\n  - A means of analysing output for\
    \ expected (or unexpected)\n  - A standardised form of failure reporting.\n- The\
    \ things we need to look for in a test harness:\n  - Supports iterative development\n\
    \  - Easy to maintain\n  - Easy repeat runs\n  - Easy to interpret results\n \
    \ - Easy to extend\n  - Easy to debug\n  - Easy to automate\n\n# Test Comparators\n\
    \n- Test comparators determine differences between files, databases or test results.\n\
    - Test execution tools typically include dynamic comparators, but post-execution\
    \ comparison may be done by a separate comparison tool.\n- Useful to compare the\
    \ outputs of batch programs or alternatively, the contents of databases to ensure\
    \ that expected results have been met.\n- The output from batch programs is vast\
    \ and it is impractical to compare files by eye.\n- Often used to help with automated\
    \ regression testing.\n- Comparison tools automate results checking.\n\n# Coverage\
    \ Measurement Tools\n\n- Coverage measurement tools can be either intrusive or\
    \ non-intrusive depending on\n  - the measurement techniques used\n  - what is\
    \ measured\n  - the coding language\n- Code coverage tools measure the:\n  - Percentage\
    \ of specific types of code structure that have been exercised (e.g. statements,\
    \ branches or decisions, and module or function calls).\n- These tools show how\
    \ thoroughly the measured type of structure has been exercised by a set of tests\n\
    \n# Security Tools\n\n- Security tools check for:\n  - computer viruses\n  - denial\
    \ of service attack\n- A firewall, for example, is not strictly a testing tool,\
    \ but may be used in security testing\n- Other security tools stress the system\
    \ by searching specific vulnerabilities of the system\n\n# Tool Support for Performance\
    \ and Monitoring\n\n# Dynamic Analysis Tools\n\n- Dynamic analysis tools are most\
    \ useful to programmers.\n- These tools allow the programmer to look inside code\
    \ while it is executing.\n- The tool monitors the internals of the program under\
    \ test and can be configured to detect problems.\n  - Like debuggers, usually\
    \ take control of the software and drive it\n- Dynamically detectable faults\n\
    - Helps to detect faults such as memory leaks, memory violations non-fatal system\
    \ faults and other statically undetectable faults.\n\n# Performance Testing Toolkit\n\
    \n- Test data utilities to build the test database\n- Test running tools drive\
    \ application and measure response times as seen by users\n- Load generation tool\
    \ simulates clients(may be same as test running tool)\n- Client, server, network\
    \ resource monitors\n- Tool(s) to merge, analyse, report results\n\n# Monitoring\
    \ Tools\n\n- Monitoring tools are not strictly testing tools but provide information\
    \ that can be used for testing purposes and is not available by other means.\n\
    - Monitoring tools continuously analyse, verify and report on usage of specific\
    \ system resources, and give warnings of possible service problems.\n- They store\
    \ information about the version and build of the software and Testware, and enable\
    \ traceability\n\n# Tool Support for Specific Areas\n\n- Individual examples of\
    \ the types of tool classified in previous slides can be specialised for use in\
    \ a particular type of application\n- There are performance testing tools specifically\
    \ for web-based applications\n- There are static analysis tools for specific development\
    \ platforms\n- There are also dynamic analysis tools specifically for security\
    \ aspects.\n- Commercial tool suites may target specific application areas (e.g.\
    \ embedded systems).\n\n# Tool Support using Other Tools\n\n- Testers may also\
    \ use\n  1. Spreadsheets\n  2. SQL\n  3. Resource or debugging tools\n\n# Debugging\
    \ Tool\n\n- A debugger operates in a similar way to a dynamic analysis tool\n\
    - Used mainly by programmers to reproduce bugs and investigate the state of programs\n\
    - Enable programmers to halt the program at any program statement execute lines\
    \ by line\n- To set and examine program variables\n\n# Test Drivers\n\n- Most\
    \ software that is written does not actually have a user interface.\n- component-level\
    \ testing requires stubs and drivers to be built\n- A driver may be a small program\
    \ designed to execute tests of a component having a user interface or where the\
    \ calling programs do not exist.\n- They are often used only temporarily, and\
    \ then discarded.\n- The most sophisticated drivers are called simulators\n  -\
    \ E.g. air traffic control, nuclear power plant controllers.\n\n# Test Tool Limitations\n\
    \n- There are some significant limitations to some tools that you should seek\
    \ to address in your investigations:\n  - Inadequate support for custom controls\n\
    \  - Tool can get at 98% of object attributes\n  - Resource hungry tools (usually\
    \ memory)\n"
  mdcn: "\n\n- 对结构和依赖关系的分析（例如链接的网页）。\n- 静态分析工具可以从代码中计算指标（例如复杂度），这些指标可以提供有价值的信息，例如用于规划或风险分析\n\
    \n# 建模工具\n\n- 建模工具能够对软件模型进行验证。例如，数据库模型检查器可以发现数据模型中的缺陷和不一致之处。\n- 其他建模工具可以在以下方面发现缺陷：\n\
    \  - 状态模型\n  - 对象模型\n- 这些工具通常可以帮助根据模型生成一些测试用例（Test Cases）。\n- 静态分析工具和建模工具的主要优势是在开发过程的早期发现更多缺陷，具有成本效益。\n\
    - 结果是由于减少返工，开发过程可能会加速并改进。\n\n# 测试规范工具支持\n\n# 测试设计工具\n\n- 从以下内容生成测试输入或实际测试用：\n\
    \  - 需求\n  - 图形用户界面\n  - 设计模型（状态、数据或对象）\n  - 代码\n- 可能还会产生更多的输出结果\n- 由于工具生成的测试具有完备性，它们可以节省宝贵的时间并提高测试的彻底性。\n\
    - 通过提供结构化的模板（有时称为测试框架 test frame）来生成测试或测试存根（test stubs），辅助测试生成，从而加速测试设计过程。\n\n\
    # 测试数据准备工具\n\n- 测试数据准备工具通过操作数据库、文件或数据传输来设置测试执行期间使用的数据。\n- 这些工具的用处是确保传输到测试环境的实时数据经过匿名化，以保护数据。\n\
    \n# 测试执行和日志工具支持\n\n# 测试执行工具\n\n- 使用脚本语言，通过存储的输入和预期结果自动或半自动地执行测试。\n- 脚本语言使得：\n\
    \  - 能够以较少的精力操作测试，例如使用不同的数据重复测试。\n  - 能够使用类似的步骤测试系统的不同部分。\n- 通常，这些工具包含动态比较功能，并为每次测试运行提供测试日志。\n\
    - 测试执行工具也可用于记录测试，此时它们被称为捕获回放工具（capture playback tools）。\n- 在探索性测试或无脚本测试期间捕获测试输入对于重现/记录测试非常有用，例如当发生故障时。\n\
    \n# 测试框架（Test Harnesses）\n\n- 测试用架（Test Harness）是一种脚本软件（有时由测试执行工具供应商提供），当使用测试执行工具构建自动化脚本时使用。\n\
    - 它是软件和测试数据的集合，通过在各种条件下运行程序单元并监控其行为和输出来进行测试。\n- 框架通常具有内置的错误处理设施，用于管理自动化测试期间经常发生的异常。\n\
    - 尽管大多数供应商提供内置用架，但大多数用户会使用针对其独特需求的脚本语言构建自己的用架。\n- 测试应包含以下功能：\n  - 指定设置（即创建人工运行环境）和清理的标准方法。\n\
    \  - 选择运行单个测试或所有测试的方法。\n  - 分析输出以检查是否符合预期（或非预期）结果的手段。\n  - 标准化的失败报告形式。\n- 我们在测试框架中需要寻找的：\n\
    \  - 支持迭代开发\n  - 易于维护\n  - 易于重复运行\n  - 易于解释结果\n  - 易于扩展\n  - 易于调试\n  - 易于自动化\n\
    \n# 测试比较工具\n\n- 测试比较工具确定文件、数据库或测试结果之间的差异。\n- 测试执行工具通常包含动态比较器，但执行后的比较可以通过单独的比较工具完成。\n\
    - 比较批处理程序的输出或数据库内容以确保达到预期结果非常有用。\n- 批处理程序的输出量非常庞大，通过肉眼比较文件是不现实的。\n- 通常用于帮助自动化回归测试。\n\
    - 比较工具自动检查结果。\n\n# 覆盖率测量工具\n\n- 覆盖率测量工具可以是侵入式的，也可以是非侵入式的，取决于：\n  - 使用的测量技术\n \
    \ - 测量的内容\n  - 编码语言\n- 代码覆盖率工具测量：\n  - 已执行的特定类型代码结构的百分比（例如语句、分支或决策，以及模块或函数调用）。\n\
    - 这些工具显示了通过一组测试对被测类型结构执行得有多么彻底。\n\n# 安全工具\n\n- 安全工具检查：\n  - 计算机病毒\n  - 拒绝服务攻击\n\
    - 例如，防火墙严格来说不是测试工具，但可能用于安全测试。\n- 其他安全工具通过搜索系统的特定漏洞来给系统施压。\n\n# 性能和监控工具支持\n\n#\
    \ 动态分析工具\n\n- 动态分析工具对程序员最有用。\n- 这些工具允许程序员在代码执行时查看其内部。\n- 工具监控被测试程序的内部，并可以配置为检测问题。\n\
    \  - 像调试器一样，通常会接管并驱动软件。\n- 动态可检测的故障\n- 有助于检测内存泄漏、内存违规、非致命系统故障和其他静态无法检测的故障。\n\n\
    # 性能测试工具包\n\n- 用于构建测试数据库的数据实用程序\n- 测试运行工具驱动应用程序并测量用户感知的响应时间\n- 负载生成工具模拟客户端（可能与测试运行工具相同）\n\
    - 客户端、服务器、网络资源监控\n- 用于合并、分析、报告结果的工具\n\n# 监控工具\n\n- 监控工具不是严格的测试工具，但它们提供了用于测试目的且无法通过无法获得的信息。\n\
    - 监控工具持续分析、验证并报告特定系统资源的使用，并对可能的服务问题发出警告。\n- 存储有关软件和测试制品（Testware）版本和构建的信息，并实现可追溯性。\n\
    \n# 特定领域的工具支持\n\n- 前面幻灯片分类的工具类型可以针对特定类型的应用程序进行专门化。\n- 有专门针对 Web 应用程序的性能测试工具。\n\
    - 有针对特定开发平台的静态分析工具。\n- 还有专门针对安全方面的动态分析工具。\n- 商业工具套件可能针对特定的应用领域（例如嵌入式系统）。\n\n#\
    \ 使用其他工具的支持\n\n- 测试人员可能还会使用：\n  1. 表格\n  2. SQL\n  3. 资源或调试工具\n\n# 调试工具\n\n- 调试工具的工作原理类似于动态分析工具。\n\
    - 主要供程序员重现 Bug 并调查程序状态。\n- 允许程序员在任何程序语句停止程序并逐行执行。\n- 设置并检查程序变量。\n\n# 测试驱动（Test\
    \ Drivers）\n\n- 大多数编写的软件并没有用户界面。\n- 组件级测试需要构建根（stubs）和驱动（drivers）。\n- 可能是用于测试具有用户界面或调用程序不存在组件的小程序。\n\
    - 通常只临时使用，然后丢弃。\n- 最复杂的驱动被称为模拟器\n  - 例如空交通管制、核电站控制器。\n\n# 测试工具局限性\n\n- 某些工具存在一些重大局限性，你应该在调查中寻求解决这些：\n\
    \  - 对自定义控件的支持不足\n  - 工具只能获取 98% 的对象属性\n  - 资源消耗型工具（通常是内存）\n\n"
