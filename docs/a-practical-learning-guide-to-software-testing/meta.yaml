    ## 测试优先排序标准：


    - 关键 (Critical)

    - 复杂 (Complex)

    - 易错 (Error-prone)


    ## 关键


    - 系统运行至关重要的功能

    - 用户完成工作真正需要的系统哪些部分？

    - 哪些组件必须正常工作，否则系统将受到严重破坏？


    ## 复杂


    - 被认为复杂的系统方面

    - 缺乏文档

    - 文档不全

    - 从业务或系统角度难以理解

    - 业务或系统知识不足


    ## 易错


    - 过去有遇到困难的经验

    - 现有系统在该领域有问题历史

    - 难以界定

    - 难以实现


    ## 测试经济学


    随着越接近上线环境（LIVE），修复缺陷的成本随之增加


    ## 练习题、答案及解析 - 第一部分


    题目 - 第一部分（实际测试 ISEB-SWT2, 2011）


    Q1.1 在基础测试流程的哪项活动中会建立测试环境？

    A. 测试实施与执行

    B. 测试计划与控制

    C. 测试分析与设计

    D. 评估退出标准与报告


    Q1.2 对于大型系统，关于输入和前置条件的组合，哪种说法是正确的？

    A. 很容易在短时间内测试所有组合

    B. 在实践中不可能测试所有组合

    C. 不可能测试其中任何一种

    D. 为了进行良好的测试，测试所有组合是至关重要的


    Q1.3 下列哪项是“评估退出标准与报告”的一项任务？

    A. 为利益相关者编写测试总结报告

    B. 记录测试执行的结果

    C  根据每个差异所采取的措施重复测试活动

    D. 评估需求和系统的可测试性


    Q1.4 在基础测试流程的哪项活动中，你会评审测试基准？

    A. 评估退出标准与报告。

