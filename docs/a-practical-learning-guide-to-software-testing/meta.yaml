- md: "\n## Brainteaser 6\n\nA test design technique is:\n\n- A. a process for selecting\
    \ test cases\n- B. a process for determining expected outputs\n- C. a way to measure\
    \ the quality of software\n- D. a way to describe in a test plan what has to be\
    \ done\n- E. all of the above\n\n## Answer to Brainteaser 5\n\nB. is a partial\
    \ measure of test thoroughness\n\n## Answer to Brainteaser 6\n\nA. a process for\
    \ selecting Test Cases\n\n## Experience Based Techniques\n\n- Useful when there\
    \ is no adequate specification\n- Users’ and Tester’s experience used\n- Can supplement\
    \ other test design techniques\n- Examples are:\n  1. Error guessing:\n    - Combines\
    \ Tester’s skills and intuition with his/her experience of similar applications\n\
    \    - Drawback is its varying effectiveness\n    - This can be overcome by using:\n\
    \      - List of possible errors\n      - Defects and Failure lists\n  2. Exploratory\
    \ Testing\n    - Combines the experience of testers with a structured where there\
    \ is inadequate or missing specification and there is severe time pressure\n \
    \   - Uses Time boxes\n    - Uses Test Objectives\n\n## Choosing Test Techniques\n\
    \nDepends on Key selection factors:\n\n- Type of system\n- Regulatory standards\n\
    - Customer or contractual requirements\n- Level of risk\n- Type of risk\n- Test\
    \ objectives\n- Documentation available\n- Knowledge of testers\n- Time and budget\n\
    - Development Life cycle\n- Use Case Models\n- Experience of types of defects\
    \ found\n\n## Practice Questions and Answers with Explanations - Part Four\n\n\
    Questions - Part Four (ActualTests ISEB-SWT2, 2011)\n\nQ4.1 Given the following\
    \ state table:\n\n| | Off | Channel 1 | Channel 2 | Channel >2 | Stby |\n|---|---|---|---|---|---|\n\
    | Standby | Live | N | N | N | N | N |\n| Live | N | Standby | Display Channel\
    \ 1 | Display Channel 2 | N | Standby |\n| Display Channel 1 | N | N | N | Display\
    \ Channel 2 | Live | Standby |\n| Display Channel 2 | N | N | Display Channel\
    \ 1 | N | Live | Standby |\n\nTable 5: Q4.1 State Table\n\nWhich of the following\
    \ represents an INVALID transition (N)?\n1. Off from Display Channel 1\n2. Channel\
    \ 2 from Display Channel 1\n3. Stby from Live\n4. Channel 2 from Live\n\nQ4.2\
    \ Given the following decision table:\n\n| | Rule 1 | Rule 2 | Rule 3 | Rule 4\
