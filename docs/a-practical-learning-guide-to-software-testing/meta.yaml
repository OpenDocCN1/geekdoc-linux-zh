    - 基于工具的：用于检查源代码，被称为“静态分析”（static analysis）\n\n## 评审流程\n\n- 涉及一个或多个人员对某项内容进行检查\n\
    - 在不同的组织中以不同的方式进行\n- 有些非常正式\n- 有些非常非正式\n- 许多介于正式和非正式之间\n- 你很可能参与过各种形式的评审\n- 可以由单人或小组执行\n\
    - 适当的正式程度可能取决于：\n    - 开发过程的成熟度\n    - 法律或法规要求\n    - 对审计跟踪的需求\n- 评审的目标可能包括：\n\
    \    - 发现缺陷\n    - 获得理解\n    - 引发讨论\n    - 通过共识做出决策\n- 评审的实施方式取决于其目标\n\n## 个人评审技术\n\
    \n个人评审文档、规格书或部分源代码的三种技术是：\n\n- 桌面检查（Desk checking）：个人手动进行检查，使用纸笔记录结果。例如，程序员通过手工推演一段源代码，跟踪每个变量的值和执行的语句。\n\
