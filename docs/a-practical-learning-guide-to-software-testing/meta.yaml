- md: "\n# LSIT Bank Case Study\n\nLSIT bank has several automated teller machines\
    \ (ATMs), which are geographically distributed and connected via a wide area network\
    \ to a central server. Each ATM machine has a card reader, a cash dispenser, a\
    \ keyboard/display, and a receipt printer. By using the ATM machine, a customer\
    \ can withdraw cash from current or savings account, query the balance of an account,\
    \ or transfer funds from one account to another. A transaction is initiated when\
    \ a customer enters an ATM card into the card reader. Encoded on the magnetic\
    \ strip on the back of the ATM card is the card number, the start date, and the\
    \ expiration date. Assuming the card is recognized, the system validates the ATM\
    \ card to determine that the expiration date has not passed, that the user-entered\
    \ PIN (personal identification number) matches the PIN maintained by the system,\
    \ and that the card is not lost or stolen. The customer is allowed three attempts\
    \ to enter the correct PIN; the card is confiscated if the third attempt fails.\
    \ Cards that have been reported lost or stolen are also confiscated. If the PIN\
    \ is validated satisfactorily, the customer is prompted for a withdrawal, query,\
    \ or transfer transaction. Before a withdrawal transaction across account can\
    \ be approved, the system determines that sufficient funds exist in the requested\
    \ account, that the maximum daily limit will not be exceeded, and that there are\
    \ sufficient funds available at the local cash dispenser. If the transaction is\
    \ approved, the requested amount of cash is dispensed, a receipt printed containing\
    \ information about the transaction, and the card is ejected. Before a transfer\
    \ transaction can be approved, the system determines that the customer has at\
    \ least two accounts and that there are sufficient funds in the account to be\
    \ debited. For approved query and transfer requests, a receipt is printed and\
    \ card ejected.\n\nUsing the above Case Study we can draw a Use Case diagram for\
    \ the ATM system as shown in Figure 23.\n\n# UML Notation: The Use Case Diagram\
    \ for ATM System\n\n![](img/52762cc20a1c71379bad2e432b5742a4_99_0.png)\n\nFrom\
    \ the Use Case diagram the Tester can build a Test Case by converting each Use\
    \ Case to a Use Case Test Scenario as shown in Figure 24.\n\n### Use Case Test\
    \ Scenario Description Guidelines\n\n- Keep them clear and concise\n- Express\
    \ them in users’ language\n- Describe the interaction between the user and system\n\
    - Differentiate between actors and computer system responsibilities\n\n# Use Case\
    \ to Test Scenario\n\n![](img/52762cc20a1c71379bad2e432b5742a4_100_0.png)\n\n\
    Figure 24: Use Case to Test Scenario\n\n# ## Hands-on Practice Exercise 7\n\n\
    1. Design Use Case Test Scenarios for the Transfer Fund and Query Balance Cases\
    \ of the ATM system. Use the LSIT Bank Case Study, Use Case diagram in Figure\
    \ 23, Use Case Test Description Guidelines and Use Case to Scenario in Figure\
    \ 24 as guidelines.\n\n# White Box, Glass box or Structure-based Techniques\n\n\
    - It is structure-based because the internal structure of software (i.e. code)\
    \ is used to design Test Cases\n- The code must be visible to testers\n- So understanding\
    \ of internals (code) is required\n- Specification is still used to determine\
    \ expected results, as for black-box\n\n# Code\n\n- Pseudo code at foundation\
    \ level\n    - Limited language\n    - Simple structure\n    - Helps to create\
    \ all the main control structures\n- Non executable\n    - At the start of the\
    \ code\n    - No action\n    - Declarative and preparative\n- Executable\n   \
    \ - Instructs the computer to take action\n- starts with BEGIN......ends with\
    \ END when combined with Non Executable\n\n# Code Structure\n\n1. Sequence\n \
    \   - Statement executed one after the other as they appear on page\n2. Selection\n\
    \    - Computer decides if a condition is true or false (Boolean) then takes a\
    \ route based on the outcome\n    - Involves decisions\n3. Iterative\n    - Repeat\
    \ exercising of a chunk of code\n    - Number of iteration depends on the value\
    \ of a condition\n\n# Sequence\n\nExample:\n\n1. Read X\n2. Read Y\n3. Z=X*Y\n\
    \nNote: We have 3 executable statements here; 1 is done before 2, then 3. No Non\
    \ executable statement. Absence of BEGIN and END is common practice in ISEB -\
    \ be aware!\n\n# Selection\n\nExample:\n\n1. IF K < 5 /*condition*/\n2. THEN\n\
    3. X=X+1 /*condition in 1 is TRUE*/\n4. ELSE\n5. X=X-1 /*condition in 1 is FALSE*/\n\
    6. ENDIF /*Terminates the IF ELSE*/\n\n# Iteration\n\n- Also known as Loops\n\
    - Two types:\n    1. DO WHILE\n    2. REPEAT UNTIL\n- Involve at least a condition\n\
    - Also involve at least a decision\n- DO WHILE: Condition at the beginning\n-\
    \ REPEAT UNTIL: Condition at the end\n\n# DO WHILE LOOP\n\nExample:\n\n| Statement\
    \ | Description |\n| :--- | :--- |\n| 1. Y = 2 | /*initialize Y with value 2*/\
    \ |\n| 2. Count = 0 | /*initialize Count with value 0*/ |\n| 3. WHILE Y < 10 DO\
    \ | /*Starts the loop*/ |\n| 4. Y = Y+1 | /*Condition that will be checked before\
    \ decision to go into the loop or End the loop*/ |\n| 5. Count = Count +1 | |\n\
    | 6. END DO | /*4 and 5 are executable statements within the loop*/\n\nFigure\
    \ 25: DO WHILE Example\n\n# Hands-on Practice Exercise 8\n\n1. How many iterations\
    \ will be achieved in this loop (Figure 25)?\n2. How can you alter the code to\
    \ achieve no iteration?\n\n# REPEAT UNTIL LOOP\n\nExample:\n\n```\n1. X = 4 /*initialize\
    \ X with value 4*/\n2. Count = 0 /*initialize Count with value 0*/\n3. REPEAT\
    \ /*Starts the loop*/\n4. X = X+1 /*4 and 5 are executable statements within the\
    \ loop*/\n5. Count = Count +1\n6. UNTIL X=10 /*Condition that will be checked\
    \ before decision to End the loop*/\n```\n\nFigure 26: REPEAT UNTIL Example\n\n\
    # Hands-on Practice Exercise 9\n\n1. How many iterations will be achieved in this\
    \ loop?\n2. How can you alter the code to achieve no iteration?\n\n# Flow Chart\
    \ Structures\n\n![](img/52762cc20a1c71379bad2e432b5742a4_103_0.png)\n\nFigure\
    \ 27: Flow Chart Structures\n\n# Control Flow Graph\n\n- Method of representing\
    \ decision points and the flow of control within code\n- Only shows decisions\n\
    - Concentrate on parts of the code (statements) affecting the flow of control\n\
    - Contains:\n    - Nodes: decision points, END WHILE or ENDIF\n    - Edges: line\
    \ connecting the nodes\n\n![](img/52762cc20a1c71379bad2e432b5742a4_104_0.png)\n\
    \n# Control Flow Subgraphs\n\n![](img/52762cc20a1c71379bad2e432b5742a4_104_1.png)\n\
    \n# Statement Testing and Coverage\n\n- Testing aimed at exercising programming\
    \ statements\n- Every executable statement is tested by 100% statement coverage\n\
    - Do not count executable statements\n- Converting code to flow charts is a good\
    \ way of knowing where the executable statements are\n- Executable statements\
    \ are represented by diamonds or rectangles on a flow chart\n- We can also use\
    \ Flow Diagrams to determine Statement Coverage – this called Hybrid Flow Diagram\n\
    - Exclude non executable statements that precede BEGIN\n- Ignore blank lines\n\
    - Weak/inadequate measure of test\n\n# Decision Testing and Coverage\n\n- Decisions\
    \ in a program are tested\n- A decision is tested when a condition associated\
    \ with it is true and false\n- 100% decision coverage is measured by counting\
    \ the number of decisions divided by the total number decisions in a program expressed\
    \ as a percentage\n\n# Guaranteeing 100% Test Coverage\n\nStatement Coverage =\
    \ $\\frac{Number of statements exercised}{Total number of Statements} \\times\
    \ 100\\%$\n\nStatement Coverage does not guarantee 100% test coverage in a code\
    \ that has Decisions / Branches. Statement coverage is sometimes called C1 coverage.\n\
    \n# Branch & Decision Testing / Coverage\n\nBranch coverage is the number of branches\
    \ (decisions) exercised by a test or suite sometimes called 'C2 coverage'.\n\n\
    Branch/Decision Coverage = $\\frac{Number of Branches/Decisions Exercised}{Total\
    \ Number of Branches/Decisions}$\n\nBranch coverage is stronger than statement\
    \ coverage since it may require test cases to achieve the same measure.\n\nExample:\
    \ Consider the following code segment for 100% statement coverage and 100% branch/decision\
    \ coverage:\n\n![](img/52762cc20a1c71379bad2e432b5742a4_106_0.png)\n\n- To achieve\
    \ 100% statement coverage of this code segment just one test case is required\
    \ which ensures variable ‘a’ contains a value that is greater than the value of\
    \ variable ‘b'\n- This will ensure that only the True path (T) is executed\n-\
    \ However, branch coverage requires each decision to have had both a true and\
    \ false outcome\n- Therefore, to achieve 100% branch coverage, a second test case\
    \ is necessary\n- This will ensure that the decision statement ‘if a > b’ has\
    \ a false outcome\n- This will ensure that the False path (F) is executed as well\n\
    - Note that 100% branch coverage guarantees 100% statement coverage\n- Branch\
    \ and decision coverage are actually slightly different for less than 100% coverage,\
    \ but at 100% coverage they give exactly the same results\n\n# Brainteaser 5\n\
    \nCoverage measurement:\n\n- A. is nothing to do with testing\nB. is a partial\
    \ measure of test thoroughness\nC. branch coverage should be mandatory for all\
    \ software\nD. can only be done during component tests\n"
  mdcn: "\n\n# LSIT 银行案例研究\n\nLSIT 银行有几台自动取款机（ATM），这些机器在地理上分布，并通过广域网连接到中央服务器。每台 ATM\
    \ 机都配有读卡器、出钞口、键盘/显示器和一个收据打印机。通过使用 ATM 机，客户可以从活期或储蓄账户提取现金、查询账户余额，或将资金从一个账户转移到另一个账户。当客户将\
    \ ATM 卡插入读卡器时，交易即开始。ATM 卡背面的磁条上编码有卡号、起始日期和截止日期。假设卡片被识别，系统将验证 ATM 卡以确定截止日期未过期、用户输入的\
    \ PIN 码（个人识别码）与系统维护的 PIN 匹配，且卡片未丢失或被盗窃。客户有三次机会输入正确的 PIN；如果第三次尝试失败，卡片将被收没。已报告丢失或被盗窃的卡片也会被收没。如果\
    \ PIN 验证通过，系统将提示客户进行取款、查询或转账交易。在批准跨账户取款交易之前，系统会确定请求的账户有足够的资金、不会超过每日最高限额，且本地出钞口有足够的资金。如果交易获得批准，将发放请求的现金，打印包含交易信息的收据，并弹出卡片。在批准转账交易之前，系统会确定客户至少有两个账户，且要扣款的账户有足够的资金。对于批准的查询和转账请求，将打印收据并弹出卡片。\n\
    \n利用上述案例，我们可以为 ATM 系统绘制一个用例图，如图 23 所示。\n\n# UML 符号：ATM 系统的用例图\n\n![](img/52762cc20a1c71379bad2e432b5742a4_99_0.png)\n\
    \n根据用例图，测试人员可以通过将每个用例转换为用例测试场景来构建测试用例，如图 24 所示。\n\n### 用例测试场景描述指南\n\n- 保持清晰简洁\n\
    - 使用用户的语言进行表达\n- 描述用户与系统之间的交互\n- 区分参与者（Actors）和计算机系统的职责\n\n# 用例到测试场景\n\n![](img/52762cc20a1c71379bad2e432b5742a4_100_0.png)\n\
    \n图 24：用例到测试场景\n\n# ## 动手实践练习 7\n\n1. 为 ATM 系统的“转账资金”和“查询余额”用例设计用例测试场景。请参考 LSIT\
    \ 银行案例研究、图 23 中的用例图、用例测试描述指南以及图 24 中的用例到场景作为指南。\n\n# 白盒、玻璃盒或基于结构的技术\n\n- 它是基于结构性的，因为它利用了软件的内部结构（即代码）来设计测试用例\n\
    - 代码对测试人员可见的\n- 因此，需要对内部结构（代码）有理解\n- 仍然像黑盒测试一样使用规格说明来确定预期结果\n\n# 代码\n\n- 基础层面的伪代码\n\
    \    - 语言有限\n    - 结构简单\n    - 有助于创建所有主要的控制结构\n- 不可执行\n    - 位于代码开头\n    - 无操作\n\
    \    - 声明性和准备性的\n- 可执行的\n    - 指令计算机采取行动\n- 与不可执行代码结合时，以 BEGIN 开始……以 END 结束\n\n\
    # 代码结构\n\n1. 顺序\n    - 语句按照页面上出现的顺序逐一执行\n2. 选择\n    - 计算机判断条件为真为假（布尔值），然后根据结果采取路径\n\
    \    - 涉及决策\n3. 迭代\n    - 重复执行一段代码\n    - 迭代次数取决于条件的值\n\n# 顺序\n\n示例：\n\n1. 读取\
    \ X\n2. 读取 Y\n3. Z=X*Y\n\n注意：这里有 3 条可执行语句；1 条在 2 之前完成，然后是 3 条。没有不可执行的语句。在 ISEB\
    \ 中，缺少 BEGIN 和 END 是常见做法——请注意！\n\n# 选择\n\n示例：\n\n1. IF K < 5 /*条件*/\n2. THEN\n\
    3. X=X+1 /*1 中的条件为真*/\n4. ELSE\n5. X=X-1 /*1 中的条件为假*/\n6. ENDIF /*结束 IF ELSE*/\n\
    \n# 迭代\n\n- 也称为循环\n- 共有两种类型：\n    1. DO WHILE\n    2. REPEAT UNTIL\n- 至少涉及一个条件\n\
    - 至少涉及一个决策\n- DO WHILE：条件在开头\n- REPEAT UNTIL：条件在末尾\n\n# DO WHILE 循环\n\n示例：\n\n\
    | 语句 | 描述 |\n| :--- | :--- |\n| 1. Y = 2 | /*将 Y 初始化为值 2*/ |\n| 2. Count = 0 |\
    \ /*初始化 Count 为 0*/ |\n| 3. WHILE Y < 10 | /*循环条件*/ |\n| 4. Y = Y+1 | |\n| 5.\
    \ Count = Count +1 | |\n| 6. END | |\n\n图 25：DO WHILE 示例\n\n# 动手实践练习 8\n\n1. DO\
    \ WHILE 循环将执行多少次？\n2. 如何修改代码以达到迭代？\n\n# REPEAT UNTIL\n\n示例：\n\n```\n1. X = 0 /*初始化\
    \ X 为 0*/\n2. REPEAT\n3. X = X+1 /*每次增加 1*/\n4. UNTIL X = 10 /*直到 X 等于 10*/\n\
    ```\n\n图 26：REPEAT UNTIL 示例\n\n# 动手实践练习 9\n\n1. 在 X 初始值为 0 的情况下，该 REPEAT UNTIL\
    \ 循环将执行多少次？\n2. 如何修改代码以达到迭代？\n\n"
