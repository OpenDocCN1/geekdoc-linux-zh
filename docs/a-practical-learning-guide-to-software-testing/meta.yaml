- md: "\ndocumentation and information\n\n- Includes version numbers, configuration\
    \ requirements where needed\n- Delivery schedule issues for critical elements\n\
    \n## Software risk issues\n\n- Critical areas are, such as:\n  - delivery of a\
    \ third party product\n  - new version of interfacing software\n  - ability to\
    \ use and understand a new package/tool\n  - extremely complex functions\n  -\
    \ error-prone components\n  - Safety, multiple interfaces, impacts on client,\
    \ government regulations and rules\n\n## Features to be tested\n\n- What is to\
    \ be tested (from the USERS viewpoint)\n- Level of risk for each feature\n\n##\
    \ Features not to be tested\n\n- What is NOT to be tested (from the Users viewpoint)\n\
    - WHY the feature is not to be tested\n\n## Approach\n\n- Overall strategy for\
    \ this test plan e.g.\n  - special tools to be used\n  - metrics to be collected\n\
    \  - configuration management policy\n  - combinations of HW, SW to be tested\n\
    \  - regression test policy\n  - coverage policy etc.\n\n## Item pass/fail criteria\n\
    \n- Completion criteria for this plan\n- At the Lower Level (e.g. Unit Test) this\
    \ could be:\n  - all Test Cases completed\n  - a specified percentage of cases\
    \ completed with a percentage containing some number of minor faults\n  - code\
    \ coverage target met\n- At the Master Test Level this could be:\n  - all lower\
    \ level plans completed\n  - test completed without incident and/or minor faults\n\
    \n## Suspension criteria and resumption requirements\n\n- When to pause in a series\
    \ of tests\n  - e.g. a number or type of faults where testing has little value\n\
    \  - What constitutes stoppage for a test or series of tests\n  - what is the\
    \ acceptable level of faults that will allow the testing to proceed faults\n\n\
    ## 1. Test deliverables\n\n- e.g. test plan document, Test Cases, test design\
    \ specifications, tools and their outputs, incident logs and execution logs, problem\
    \ reports and corrective actions\n\n![](img/52762cc20a1c71379bad2e432b5742a4_134_0.png)\n\
    \nFigure 45: IEEE 829 Standard for Software Test Documentation\n\n- Diagram lifted\
    \ from the IEEE 829 Standard for Software Test Documentation IEEE 829\n- Might\
    \ be given as a potential answer in an examination question\n- NB: it is a standard\
    \ for documentation, but makes no recommendation on how you do doing testing itself\n\
    \n## 2. Remaining test tasks\n\n- Where the plan does not cover all software\n\
    - e.g. where there are outstanding tests because of phased delivery\n\n## 3. Environmental\
    \ needs\n\n- special requirements such as:\n  - special hardware such as simulators,\
    \ test drivers etc\n  - how test data will be provided\n\n## 4. Staffing and training\n\
    \n- E.g. training on the application/system\n- training for any test tools to\
    \ be used\n\n## 5. Responsibilities\n\n- Who is in charge?\n- Who defines the\
    \ risks?\n- Who selects features to be tested and not tested\n- Who sets overall\
    \ strategy for this level of plan\n\n## 6. Schedule\n\n- Based on realistic and\
    \ validated estimates\n\n## 7. Planning risks and contingencies\n\n- Overall risks\
    \ to the project with an emphasis on testing\n- Lack of resources for testing\
    \ lack of environment\n- Late delivery of the software, hardware or tools\n\n\
    ## 8. Approvals\n\n- Who can approve the process as complete?\n\n## 9. Glossary\n\
    \n- used to define terms and acronyms used in the document, and testing in general,\
    \ to eliminate confusion and promote consistent communications\n\n## Test Planning\
    \ Activities\n\n- It is worth noting that the following activities will be undertaken\
    \ by those working on developing the Test Plan:\n  - Putting together the Test\
    \ Strategy\n  - Liaising with project manager to ensure testing is incorporated\
    \ within the design, development and implementation stages of a software development\
    \ lifecycle\n- Deciding:\n  - what needs to be tested\n  - Who performs what testing\n\
    \  - When testing activities will be done\n  - How test results will be evaluated\n\
    \  - Test Exit criteria\n- What documentation will be required for the test project\
    \ and how Test Cases will be documented\n- Defining management information\n\n\
    ## Test Estimation\n\n- ISEB details two approaches:\n  - Expert-based\n  - Metrics-based\n\
    - These two approaches are different from each other\n\n## Metrics based Test\
    \ Estimation\n\n- Relies on data collected from previous or similar projects which\
    \ might include:\n  - Number of test conditions\n  - Number of Test Cases written\n\
    \  - Number of Test Cases executed\n  - The time taken to develop Test Cases\n\
    \  - The time taken to run Test Cases\n  - The number of defects found\n  - The\
    \ number of environment outages\n\n## Expert-based Test Estimation\n\n- Also called\
    \ Wide Band Delphi approach\n- Uses the experience of owners of relevant tasks\
    \ or expert to derive test estimate. Experts could:\n  - Business experts\n  -\
    \ Test process consultants\n  - Developers\n  - Technical architects\n  - Analysts\
    \ and designers\n  - Anyone with knowledge of application to be tested\n- Expert\
    \ estimation can be done by:\n  - Distributing requirement specification to the\
    \ task owners then getting them estimates for their tasks in isolation then collating\
    \ together and applying required contingency\n  - Distributing requirement specification\
    \ to known experts and get them to give individual view of the estimate; then\
    \ meet together to agree on the estimate that will go forward\n\n## Test Progress\
    \ Monitoring and Control\n\n- Monitoring and controlling the activities and timescales\
    \ defined within the test plan\n- Metrics for Monitoring:\n  - Percentage of work\
    \ done in test preparation\n  - Percentage of work done in environment\n  - Percentage\
    \ of work done in test Case\n  - Percentage of Cases run versus not run\n  - Defect\
    \ density\n  - Number of defects found/fixed\n  - Failure rate\n  - Percentage\
    \ of Coverage\n- Percentage of requirements\n- Dates of test milestones\n- Testing\
    \ costs\n\n## Test Progress Monitoring in forms\n\n## Test Progress Monitoring\
    \ in forms\n\n![](img/52762cc20a1c71379bad2e432b5742a4_138_0.png)\n\nFigure 46:\
    \ Sample Test Monitoring in graphical form\n\n![](img/52762cc20a1c71379bad2e432b5742a4_138_1.png)\n\
    \nFigure 48: Sample Test Monitoring in graphical form\n\n## Test Reporting\n\n\
    - Process of summarising the test metrics to update the reader: weekly RAG report\n\
    - When exit criteria have been met\n- Provides assessment of defects remaining\n\
    - Level of confidence in tested\n- IEEE829 standard for Test Summary Report\n\n\
    ## Test Control\n\n- This is using progress data collected (in monitoring) and\
    \ reported (in reporting) to decide on a course of action to ensure the control\
    \ of test activities is maintained and the exit criteria are met\n- Examples of\
    \ test control are:\n  - Reprioritising tests\n  - Changing test schedule\n  -\
    \ Adjusting scope of testing\n\n## Incident Management\n\n- An incident is any\
    \ unplanned event that requires further investigation\n- Anything where actual\
    \ result deviates from expected\n- Incident management is the process of “recognizing,\
    \ investigating, taking action and disposing of incidents” – IEEE 1044\n- Incidents\
    \ can be raised on incident reports via an incident management system e.g. Test\
    \ Director, Excel etc. or on paper\n- IEEE 829 contains the outline of test report\n\
    \n## Incident Logging\n\n- Key requirement is incident logging with appropriate\
    \ details:\n- ID\n- Summary\n- Description\n- Severity\n- Priority\n- Test script/step\n\
    - Date/time of test\n- Impact\n- Assigned to\n- Raised by\n\n## Configuration\
    \ Management (CM)\n\nThis is the process used in Software Development Projects\
    \ to manage project deliverables including development work products (e.g. source\
    \ code, data and documentation), testware (e.g. test plans, Test Cases, test scripts,\
    \ and any other methods needed to design and perform a test), third-party software\
    \ and hardware. The management of these project deliverables requires ensuring\
    \ that information stored about them and any changes to them are consistent at\
    \ all times.\n\n- CM should ensure Traceability throughout the test process:\n\
    \  - Use of Traceability Matrix or a CM software can enable this\n  - CM involves\
    \ controlling the versions of code to be tested and the documents used in the\
    \ development process (baselines)\n\n## Symptoms of poor Configuration Management\n\
    \nSymptoms of poor configuration management are extremely serious because they\
    \ have significant impacts on testers; most obviously on productivity, but it\
    \ can be a morale issue as well as it causes a lot of wasted work.\n\n- Imagine\
    \ a situation when the developer cannot find the latest version of the source\
    \ code module in development\n- Or no one can find the source code that matches\
    \ the version in production\n- Or if you are a software house and you can’t find\
    \ the customised version of\n"
  mdcn: "\n文档与信息\n\n- 包括版本号、需要时的配置要求\n- 关键要素的交付计划问题\n\n## 软件风险问题\n\n- 关键区域，例如：\n \
    \ - 第三方交付的交付\n  - 接口软件的新版本\n  - 使用和理解新软件包/工具的能力\n  - 极其复杂的函数\n  - 易错组件\n  - 安全、多接口、对客户的影响、政府法规和规定\n\
    \n## 需要测试的功能\n\n- 需要测试什么（从用户角度考虑）\n- 每个功能的风险水平\n\n## 不需要测试的功能\n\n- 什么是**不需要**测试（从用户角度考虑）\n\
    - **为什么**不需要测试该功能\n\n## 方法\n\n- 本测试计划的整体策略，例如：\n  - 将使用的特殊工具\n  - 需要收集的指标\n  -\
    \ 配置管理策略\n  - 需要测试的硬件、软件组合\n  - 回归测试策略\n  - 覆盖率策略等\n\n## 项目通过/失败标准\n\n- 本计划的完成标准\n\
    - 在较低层级（例如单元测试），这可能是：\n  - 所有测试用例已完成\n  - 完成了规定百分比的用例，其中包含一定数量的小微故障\n  - 达到代码覆盖率目标\n\
    - 在主测试层级，这可能是：\n  - 所有较低层级的计划已完成\n  - 测试完成且无事故和/或轻微故障\n\n## 暂停标准与恢复要求\n\n- 何时在系列测试中暂停\n\
    \  - 例如，故障的数量或类型导致测试价值很小\n  - 什么情况构成了测试或系列测试的停止\n  - 允许测试继续运行的可接受故障水平\n\n## 1.\
    \ 测试交付物\n\n- 例如：测试计划文档、测试用例、测试设计规范、工具及其输出、故障日志和执行日志、问题报告和纠正措施\n\n![](img/52762cc20a1c71379bad2e432b5742a4_134_0.png)\n\
    \n图 45：IEEE 829 软件测试文档标准\n\n- 取自 IEEE 829 软件测试文档标准 IEEE 829\n- 可能作为考试题的潜在答案\n\
    - 注意：它是一项文档标准，但对你如何进行测试本身没有提供建议\n\n## 2. 剩余测试任务\n\n- 计划未覆盖的所有软件\n- 例如：由于分阶段交付导致待处理的测试\n\
    \n## 3. 环境需求\n\n- 特殊要求，例如：\n  - 特殊硬件，如模拟器、测试驱动程序等\n  - 测试数据如何提供\n\n## 4. 人员与培训\n\
    \n- 例如：针对应用程序/系统的培训\n- 对任何将使用的测试工具进行培训\n\n## 5. 职责\n\n- 谁负责？\n- 谁定义风险？\n- 谁选择需要测试和不需要测试的功能\n\
    - 谁为此级别的计划制定整体策略\n\n## 6. 进度\n\n- 基于现实且验证的估计\n\n## 7. 计划风险与应急方案\n\n- 项目的整体风险，重点关注测试\n\
    - 测试资源不足、环境缺失\n- 软件、硬件或工具的延迟交付\n\n## 8. 批准\n\n- 谁可以批准流程完成？\n\n## 9. 术语表\n\n- 用于定义文档及通用测试中的术语和缩写，以消除混乱并促进一致沟通\n\
    \n## 测试计划活动\n\n- 需要注意的是，开发测试计划的人员将开展以下活动：\n  - 制定测试策略\n  - 与项目经理联系，确保测试被纳入软件开发生命周期中的设计、开发和实施阶段\n\
    \  - 决定：\n    - 需要测试什么\n    - 谁执行什么测试\n    - 何时进行测试活动\n    - 如何评估测试结果\n    - 测试退出标准\n\
    \  - 测试项目需要哪些文档以及如何记录测试用例\n- 定义管理信息\n\n## 测试估算\n\n- ISEB 详细介绍了两种方法：\n  - 基于专家的\n\
    \  - 基于指标的\n- 这两种方法是互不相同的\n\n## 基于指标的测试估算\n\n- 依赖于从之前或类似项目收集的数据，可能包括：\n  - 测试条件的数量\n\
    \  - 编写的测试用例数量\n  - 执行的测试用例数量\n  - 开发测试用例所需\n  - 运行测试用例的时间\n  - 发现的缺陷数量\n  - 环境中断次数\n\
    \n## 基于专家测试估算\n\n- 也称为宽带德菲法（Wide Band Delphi）\n- 利用相关任务所有者或专家的经验来得出测试估算。专家可以是：\n\
    \  - 业务专家\n  - 测试过程顾问\n  - 开发人员\n  - 技术架构师\n  - 分析师和设计师\n  - 任何了解被测应用的人员\n- 专家估算可以通过：\n\
    \  - 将需求说明书分发给任务所有者，然后让他们对自己的任务进行独立估计，然后汇总并应用所需的应急措施\n  - 将需求说明书分发给已知专家并让他们给出估算的个人观点；然后会合以达成后续执行的估算\n\
    \n## 测试进度监控与控制\n\n- 监控和控制测试计划中定义的活动和时间\n- 监控指标：\n  - 测试准备完成的工作百分比\n  - 环境完成的工作百分比\n\
    \  - 测试用例完成的工作百分比\n  - 已运行与未运行用例的百分比\n  - 缺陷密度\n  - 发现/修复的缺陷数量\n  - 失败率\n  - 覆盖率百分比\n\
    - 需求完成百分比\n- 测试里程碑日期\n- 测试成本\n\n## 测试监控表单\n\n## 测试进度监控表单\n\n![](img/52762cc20a1c71379bad2e432b5742a4_138_0.png)\n\
    \n图 46：测试进度监控表单\n\n![](img/52762cc20a1c71379bad2e432b5742a_138_1.png)\n\n图 48：测试进度监控表单\n\
    \n## 测试报告\n\n- 总结测试指标以更新读者的过程：RAG 报告\n- 当退出标准满足时\n- 提供剩余缺陷的评估\n- 测试的信心水平\n- IEEE829\
    \ 测试摘要标准\n\n## 测试控制\n\n- 通过使用监控（监控）和报告（报告）收集的数据来决定行动，以确保对测试活动的控制并满足退出标准\n- 测试控制的示例：\n\
    \  - 重新排列优先级\n  - 调整进度\n  - 调整范围\n\n## 故障管理\n\n- 故障是指任何需要调查的计划外事件\n- 任何实际结果与预期偏差\n\
    - 故障管理是“识别、调查、采取行动和处理故障”的过程 —— IEEE 1044\n- 故障可以通过故障管理系统（如 Test Director、Excel\
    \ 等）或纸质故障报告提出\n- IEEE 829 包含报告大纲\n\n## 故障记录\n\n- 关键要求是记录详细的故障：\n- ID\n- 摘要\n-\
    \ 描述\n- 严重程度\n- 优先级\n- 测试脚本/步骤\n- 测试日期时间\n- 影响\n- 分配人员\n\n## 配置管理 (CM)\n\n这是软件开发项目用于管理项目交付物的过程，包括开发工作产品（如源代码、数据和文档）、制品（如测试计划、测试用例、测试脚本以及任何设计和执行测试所需的其他方法）、第三方软件和硬件。项目交付物管理需要确保有关它们以及任何更改的信息始终一致。\n\
    \n- 配置管理应确保整个测试过程的可追溯性：\n  - 使用追溯矩阵或配置管理软件可以实现\n  - 配置管理涉及控制测试代码的版本以及开发过程中使用的文档（基线）\n\
    \n## 配置管理不良症状\n\n配置管理的症状非常严重，因为它们对测试人员有巨大影响；最明显的是影响生产力，也会影响情绪。\n\n- 想象开发人员找不到开发中最新版本的源代码模块\n\
    - 或者没有人找不到与生产环境版本匹配的源代码\n- 或者你是一家软件公司，你找不到定制版本\n"
