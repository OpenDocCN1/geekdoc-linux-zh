    # Verification and Validation


    +   - These are processes used to assure quality throughout the development life
    cycle.

    - Used to check that the work product of each stage meets its objectives

    - Work products are evaluated (tested) after its completion so that problems can
    be found and fixed at the point of creation

    - When applied to the Waterfall Model, it changes the shape of the Waterfall Model
    to a V-Model


    # Verification


    +   - Defined as the process of evaluating a work product (e.g. a specification
    or component or a complete system) of a development stage to determine whether
    it satisfies the requirements specified for it at the beginning of that stage

    - A work product verifier must strive to find out if a work product was built
    right


    # Verification activities


    +   1. all static tests: all work product evaluation that requires code execution
    such as inspections or reviews of requirements, specifications, designs, or code

    2. all dynamic tests: execution of code to show that software was built to specification


    # Validation


    +   - Defined as determination of the correctness of the work product of software
    development with respect to the user needs and requirements

    - A person who is validating a work product must strive to find out if it was
    the right one for the users

    - Validation activities are usually the concern of the users of the system


    # Validation activity


    +   1. All dynamic tests to show the system meets the users’ needs


    Brainteaser 3

