    \ that are measured using Static Analysis Tools\n- Appreciate the benefits of\
    \ Static Analysis\n- Identify the Limitations of Static Analysis\n\n## Static\
    \ Testing in Lifecycle\n\n- Tests that do not involve executing software\n- Used\
    \ early in the lifecycle\n- All deliverables, including code, can also be statically\
    \ tested\n- Because they usually find faults early, static test activities provide\
    \ extremely good value for money\n\n## Static Testing\n\nThere are two basic types:\n\
    \n- People-based: generally known as “reviews\"\n- Tool-based: for examining source\
    \ code and are known as \"static analysis\"\n\n## Review process\n\n- Involves\
    \ out one or more people examining something\n- Carried out across different organisations\
    \ in different ways\n- Some are very formal\n- Some are very informal\n- Many\
    \ lie somewhere between formal and informal\n- The chances are that you have been\
    \ involved in reviews of one form another\n- Could be performed by a single individual\
    \ or group\n- Appropriate level of formality may be determined by:\n    - Maturity\
    \ of the development process\n    - Legal or regulatory requirements\n    - The\
    \ need for audit trail\n- Objectives of reviews may include:\n    - Finding defects\n\
    \    - Gaining understanding\n    - Generating discussion\n    - Decision making\
    \ by consensus\n- The way a Review is conducted will be determined by its objective\n\
    \n## Review techniques for individuals\n\nThree techniques for an individual to\
    \ review a document, specification or a piece of source code are:\n\n- Desk checking:\
    \ The individuals performs the check manually, using pen and paper to record results.\
    \ An example is when a programmer works through a piece of source code by hand,\
    \ keeping track of the values of each variable and the statements that are executed.\n\
    - Proof reading: The individual checks for:\n    - grammar mistakes\n    - typographical\
    \ errors\n    - misuse of punctuations\n    - irregular spacing\n    - poor sentence\
    \ structure\n    - inconsistencies of fonts\n    - incorrect use of terms for\
    \ the subject matter being proof-read\n- **Data stepping:** The individual follows\
    \ a set of data values through the source code to ensure that the values are correct\
    \ at each step of the processing.\n\n## Review techniques for groups\n\n- The\
    \ static techniques that involve groups of people are generically referred to\
    \ as reviews.\n- Reviews can vary a lot from very informal to highly formal\n\n\
    ## Types of Review\n\n1. Informal\n2. Walkthrough\n3. Technical Review\n4. Inspection\n\
    \nFigure 14: Level of formality in Review\n\n## Informal Review\n\n- No formal\
    \ process\n- May or may not be documented\n- Many are not documented\n- Reviewer\
    \ may not have the technical skills but just to ensure that the document makes\
    \ sense\n- Main purpose is to find faults\n- Inexpensive way to achieve some limited\
    \ objectives\n- Could be useful in Pair programming where one programmer reviews\
    \ the code of the other pair programmer\n\n## A Walkthrough\n\n- Less Formal Review\
    \ technique\n- Typically used to educate a group of people about a technical document\n\
    - Typically led by the author who \"walks\" the peer group through the ideas to\
    \ explain to them so that the attendees understand the content\n- Open ended sessions\n\
    - Scribe appointed aside from author\n- Useful for exploring scenarios\n- Also\
    \ useful for dry runs of codes (mental run of a code by a programmer)\n\n## Technical\
    \ Review\n\n- Documented\n- Includes peers and technical experts\n- Well defined\
    \ defect detection process\n- Performed as a Peer Review\n- No management participation\n\
    - Ideally led by a trained moderator who is not the author\n- Checklists are used\n\
    - A Review Report is prepared with a list of findings\n- Purpose may include:\n\
    \    - Discussions, Decision making, Finding defects\n    - Solving a technical\
    \ problem etc.\n\n## Inspection\n\n- Is the most formal review technique\n- Its\
    \ main focus during the process is to find faults\n- it is the most effective\
    \ review technique in finding faults\n- Led by a trained moderator who is not\
    \ the author\n- Involves peer examination of a document\n- Individual inspectors\
    \ work within defined roles\n- Based on rules and checklist\n- Uses entry and\
    \ exit criteria\n- Pre-meeting preparation is essential\n- Inspection report is\
    \ produced\n- Formal follow-up process after\n- Main objective is to find defects\n\
    - Another objective is to improve process\n\n## Phases of a Formal Review\n\n\
    ### Planning\n\n- Select the appropriate personnel roles\n- Allocate roles\n \
    \   - Tester role – checking for testability and clarity\n    - User role – to\
    \ look at relationship to business value\n- Define the entry and exit criteria\
    \ (typical with Inspections)\n- Select part of the document to be reviewed\n\n\
    ### Kick off\n\n- Distribute documents relevant to the subject matter to be reviewed\n\
    - Explain objectives of the Review\n\n### Individual preparation\n\n- Work done\
    \ by each participant in their own\n\n### Review meeting\n\n- Discussion on defects\
    \ found\n- Logging defects\n- Taking minutes (by scribe)\n\n### Rework\n\n- The\
    \ author corrects/fixes defects raised\n\n### Follow up\n\n- Review leader ensures\
    \ agreed defects have been fixed\n- Metrics gathering\n- Criteria have been met\
    \ (inspection)\n\n## Specific roles for a Review Process\n\n### Manager\n\n- Decides\
    \ on what to be reviewed\n- Allocates time for the Review meeting\n- Decides if\
    \ the Review objectives have been met\n- Does not normally participate in the\
    \ meeting unless they have technical knowledge or can add value\n\n### Moderator\n\
    \n- Review leader\n- Plans the Review\n- Follows up\n- Makes final decision on\
    \ updated document\n\n### Author\n\n- Wrote the document being reviewed\n- Fixes\
    \ any agreed defects\n\n### Reviewers\n\n- Also known as Checkers or Inspectors\n\
    - May have Technical or business background\n- They find defects\n\n### Scribe\n\
    \n- Documents all issues, defects raised\n\n## When is a Review process deemed\
    \ successful?\n\n- Clearly defined objective(s) are met\n- Right people have been\
