  md: '# Retesting


    +   - If we run a test that detects a fault we can get the fault corrected

    - We repeat the test to ensure the fault has been properly fixed

    - This is called re-testing

    - If we expect to find faults, we must expect to find some faults so we always
    expect to do some re-testing


    # Regression Testing


    +   - When software is fixed, it often happens that ''knock-on'' effects occur

    - We need to check that only the faulty code has changed

    - There is 50% chance of regression faults

    - Regression tests tell us whether new faults have been introduced into the software
    i.e. whether the system still works (the way it was before the change) after a
    change to the code or environment has been made


    ![](img/52762cc20a1c71379bad2e432b5742a4_52_0.png)'
