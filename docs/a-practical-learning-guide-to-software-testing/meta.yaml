    documentation will guide the user through the best ways to use different

    features of the tool and it often includes by step instructions on the best

    ways to use different features of the tool.

    b) Roll out the control as quickly as possible to all users.

    c) **Provide technical support to the test team for each type of tool.** *Test
    team

    will require technical support from tool vendors for a reasonable period of time

    (according to contract with vendor). This will enable the Test team members to

