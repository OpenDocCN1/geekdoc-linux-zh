  - '[PAGE 68]


    # Answer to Brainteaser 4


    D as soon as possible in the development lifecycle


    # Test Levels


    +   - Component Testing: Also known as Unit testing. It''s programmer-level testing

    - Integration Testing in the small: testing of the assembly of these components
    into subsystems using Big Bang or Top Down or Bottom strategy

    - Functional System Testing: Testing against a functional specification and is
    what we would frequently call a system test, and so on

    - Non-Functional System Testing: Tests that address things like performance, usability,
    and so on

    - Integration Testing in the large: Testing all systems talking to other systems

    - Acceptance Testing: examples are User Acceptance and Contract Acceptance Testing


    # Test Types


    +   - Functional Testing: Specification based testing

    - Non-Functional Testing: Tests the behavioural aspects of the system tested

    - Structural Testing: Used to measure how much testing has been carried out

    - Confirmation Testing and Regression Testing: Testing related to changes

    - Maintenance Testing: Testing that is provided while a system is in service (live).
    Once a system is live, the system and its operational environment is often corrected,
    changed or enhanced. The testing that is provided during this phase is called
    maintenance testing. The bulk of Maintenance Testing is Regression Testing.'
