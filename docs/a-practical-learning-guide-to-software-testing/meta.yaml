    # Fundamental Test Process


    The test process is a risk management exercise and is used to mitigate risk.

    Five common activities in the Fundamental Test Process are:


    +   - Test planning and control

    - Test Analysis and Design

    - Test Implementation and Execution

    - Evaluating exit criteria and reporting

    - Test Closure


    # Test Planning and Control


    Test Planning tasks:


    +   - Determine the scope of testing and risks that may impact on testing

    - Identify the objectives of testing

    - Determine the Test Approach (the test strategy)

    - Implement the policy of the organisation and/ or the test strategy

    - Determine the required test resources like people, test environments, PCs, etc.

    - Schedule test analysis and design tasks, test implementation, execution and
    evaluation

    - Determine the Exit Criteria such as Coverage Criteria


    # Test Control tasks:


    +   - Measure the results of reviews and testing

    - Monitor and document Test Progress, Test Coverage and Exit Criteria

    - Provide information on progress of testing

    - Initiate corrective actions to put testing back on track

    - Make decisions on how to progress with testing


    # Test Analysis and Design


    +   - Analyser the application

    - Identify test conditions

    - Design Test Cases

    - Establish the traceability of the test conditions to Test Cases and test basis

    - Develop test scripts

    - Define expected results

    - Look backward to the planning

    - Look forward to the execution

    - Document thoroughly

    - BS7925-2 is one of the many sources of definitions for test case design techniques

    - Test case design can be generated from both an analysis of the business scenarios
    and/or use cases


    # Test Implementation and Execution'
