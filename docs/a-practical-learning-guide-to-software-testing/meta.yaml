  md: '# LSIT Bank Case Study


    LSIT bank has several automated teller machines (ATMs), which are geographically
    distributed and connected via a wide area network to a central server. Each ATM
    machine has a card reader, a cash dispenser, a keyboard/display, and a receipt
    printer. By using the ATM machine, a customer can withdraw cash from current or
    savings account, query the balance of an account, or transfer funds from one account
    to another. A transaction is initiated when a customer enters an ATM card into
    the card reader. Encoded on the magnetic strip on the back of the ATM card is
    the card number, the start date, and the expiration date. Assuming the card is
    recognized, the system validates the ATM card to determine that the expiration
    date has not passed, that the user-entered PIN (personal identification number)
    matches the PIN maintained by the system, and that the card is not lost or stolen.
    The customer is allowed three attempts to enter the correct PIN; the card is confiscated
    if the third attempt fails. Cards that have been reported lost or stolen are also
    confiscated. If the PIN is validated satisfactorily, the customer is prompted
    for a withdrawal, query, or transfer transaction. Before a withdrawal transaction
    across account can be approved, the system determines that sufficient funds exist
    in the requested account, that the maximum daily limit will not be exceeded, and
    that there are sufficient funds available at the local cash dispenser. If the
    transaction is approved, the requested amount of cash is dispensed, a receipt
    printed containing information about the transaction, and the card is ejected.
    Before a transfer transaction can be approved, the system determines that the
    customer has at least two accounts and that there are sufficient funds in the
    account that there are sufficient funds in the account to be debited. For approved
    query and transfer requests, a receipt is printed and card ejected.


