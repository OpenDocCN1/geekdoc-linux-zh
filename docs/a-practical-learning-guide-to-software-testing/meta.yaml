    \ calls)\n\n- 当表达式将控制权和参数（如果存在）传递给函数时，就会发生函数调用。\n- 当代码中的某个函数被调用次数过多时，可能会导致许多问题：\n\
    \  - 深度或无限递归：当函数调用自身次数过多，以至于存储与每次调用相关的变量和信息所需的超过了栈能容纳范围。\n  - 这会导致栈溢出（计算机程序尝试使用比栈可用空间更多的空间）。调用栈是一个存储待处理请求的缓冲区。\n\
    \  - 栈溢出会导致程序崩溃。\n  - 这会降低代码的性能。\n\n下图说明了程序中对某些函数进行的过度函数调用\n\n![](img/52762cc20a1c71379bad2e432b5742a4_80_0.png)\n\
    \n图 17：函数调用\n\n### 6. 控制流 (Control flow)\n\n- 控制流分析可以发现\n  - 无限循环\n  - 不可访问的代码\n\
