- md: "\n## A.10: B. a, d and f\n\n**Explanation:** This tests your understanding\
    \ of the tasks of the Test Planning and Control activity of the Fundamental Test\
    \ Process.\n\n- a) Scheduling test analysis and design: a test planning task\n\
    - d) Identifying the objectives of testing: a test planning task\n- f) Selecting\
    \ test metrics for monitoring and control: a test planning task\n\n## Part Two:\
    \ Testing Throughout the Life Cycle\n\n![](img/52762cc20a1c71379bad2e432b5742a4_61_0.png)\n\
    \n## Topics Covered in Part Two\n\n- 1. Models for Testing\n- 2. Verification\
    \ and Validation\n- 3. Characteristics of good testing\n- 4. Front Loaded Testing\n\
    - 5. Test Levels\n- 6. Types of Testing\n\n## Learning Outcomes for Part Two\n\
    \nLearner will be able to:\n\n- 1. Understand features of the traditional Waterfall\
    \ Model\n- 2. Understand the application of Verification and Validation to assure\
    \ quality throughout the development life cycle\n- 3. Understand features of the\
    \ V-Model\n- 4. Understand features of the Iterative Model\n- 5. Appreciate why\
    \ it is important to start testing early in the development life cycle\n- 6. Differentiate\
    \ between the different Test Levels\n- 7. Differentiate between the different\
    \ types of testing\n\n## Models for Testing\n\nThe following three models of testing\
    \ will be covered:\n\n- Traditional Waterfall Model\n  - Example is Structured\
    \ System Analysis and Design Method (SSADM)\n- V-Model — an extension of the Waterfall\
    \ Model\n- Iterative Model\n  - Example is Agile using techniques such as:\n \
    \   - RAD\n    - SCRUM\n    - XP\n    - DSDM\n\n## Traditional Waterfall Model\n\
    \nThe figure below shows a diagrammatic representation of the Waterfall Model\n\
    \n![](img/52762cc20a1c71379bad2e432b5742a4_62_0.png)\n\n### Features of the Waterfall\
    \ Model\n\n- It is Sequential/Linear\n- Each work product/activity is completed\
    \ and signed off before the next Testing is done when coding is complete before\
    \ making decision to release the product to the Live environment or Not!\n- Rigid\
    \ Model which does not encourage change\n- Changes are only made to work product\
    \ through Change Requests\n- Thus the changes are expensive to make\n- Relegates\
    \ testing to the end of the life-cycle\n\n## Verification and Validation\n\n-\
    \ These are processes used to assure quality throughout the development life cycle.\n\
    - Used to check that the work product of each stage meets its objectives\n- Work\
    \ products are evaluated (tested) after its completion so that problems can be\
    \ found and fixed at the point of creation\n- When applied to the Waterfall Model,\
    \ it changes the shape of the Waterfall Model to a V-Model\n\n## Verification\n\
    \n- Defined as the process of evaluating a work product (e.g. a specification\
    \ or component or a complete system) of a development stage to determine whether\
    \ it satisfies the requirements specified for it at the beginning of that stage\n\
    - A work product verifier must strive to find out if a work product was built\
    \ right\n\n## Verification activities\n\n- 1. all static tests: all work product\
    \ evaluation that requires code execution such as inspections or reviews of requirements,\
    \ specifications, designs, or code\n- 2. all dynamic tests: execution of code\
    \ to show that software was built to specification\n\n## Validation\n\n- Defined\
    \ as determination of the correctness of the work product of software development\
    \ with respect to the user needs and requirements\n- A person who is validating\
    \ a work product must strive to find out if it was the right one for the users\n\
    - Validation activities are usually the concern of the users of the system\n\n\
    ## Validation activity\n\n- 1. All dynamic tests to show the system meets the\
    \ users’ needs\n\n### Brainteaser 3\nThree of the four statements below are true\
    \ for verification activities, but which one is true for validation?\n\n- 1. Can\
    \ use static testing techniques (reviews, inspections, walkthroughs)\n- 2. Usually\
    \ involves the use of baseline documents\n- 3. Always needs user involvement\n\
    - 4. Checks whether we built the system right\n\n## V Model\n\n### Features of\
    \ the V-Model\n\n- Extension of the Waterfall Model\n- Facilitates early work\
    \ product evaluation\n- Verification and Validation Tests are applied at different\
    \ stages of this model\n- Different variants of this model exists\n\n![](img/52762cc20a1c71379bad2e432b5742a4_64_0.png)\n\
    \nFigure 11: V-Model\n\n## Hands-on Practice Exercise 1\n\n- Using the V-Model\
    \ to show early work product evaluation\n- Verification and Validation Tests are\
    \ applied at different stages of this model\n- All dynamic tests to show the system\
    \ meets the users’ needs\n- Identify where static testing occurs\n\n![](img/52762cc20a1c71379bad2e432b5742a4_65_0.png)\n\
    \nFigure 12: Hands-on Practice Exercise - V-Model\n\n### Answer to Brainteaser\
    \ 3\n3. Always needs user involvement (True for validation, not necessarily for\
    \ verification)\n\n## Iterative Model\n\n### Features of Iterative Model\n\n-\
    \ Requirements do not need to be fully developed before coding can start\n- Often\
    \ called “cyclical”\n- Each cycle is a Timebox (in RAD) or a Sprint (in SCRUM)\n\
    - Users’ representatives are involved throughout the development and testing,\
    \ empowered to make changes\n- Working version of product is built in series\n\
    \n![](img/52762cc20a1c71379bad2e432b5742a4_66_0.png)\n\nFigure 13: Iterative Model\n\
    \n## Characteristics of good testing\n\n- Early Test Design: Apparent in the V\
    \ Model\n- Each work product is tested: Apparent in the V Model\n- Each release\
    \ is tested in Iterative model\n- Testers are involved in reviewing requirements\
    \ before they are signed off\n\n## Front Loaded testing\n\n![](img/52762cc20a1c71379bad2e432b5742a4_67_0.png)\n\
    \n- It is a discipline that promotes the idea that all test activities should\
    \ commence early as possible in the Development Cycle\n- This could mean doing\
    \ early static tests (of requirements, designs), or dynamic test preparation as\
    \ early as possible in the development cycle\n- The principle is to start early\
    \ using static techniques which include Reviews, Walkthroughs and Inspections\
    \ of documents during the definition stages\n- Start preparing Test Cases: Early\
    \ case preparation \"tests\" the document on which the cases are based\n\n###\
    \ Brainteaser 4\nWhen should software testing activities start?\n\n- 1. as soon\
    \ as the code is written\n- 2. during the design stage\n- 3. when the requirements\
    \ have been formally documented\n- 4. as soon as possible in the development cycle\n\
    \n### Answer to Brainteaser 4\n4. as soon as possible in the development cycle\n\
    \n## Test Levels\n\n- Component Testing: Also known as Unit testing. It's programmer-level\
    \ testing\n- Integration Testing in the small: testing of the assembly of these\
    \ components into subsystems using Big Bang or Top Down or Bottom strategy\n-\
    \ Functional System Testing: Testing against a functional specification and is\
    \ what we would frequently call a system test, and so on\n- Non-Functional System\
    \ Testing: Tests that address things like performance, usability, and so on\n\
    - Integration Testing in the large: Testing all systems talking to other systems\n\
    - Acceptance Testing: examples are User Acceptance and Contract Acceptance Testing\n\
    \n## Test Types\n\n- Functional Testing: Specification based testing\n- Non-Functional\
    \ Testing: Tests the behavioural aspects of the system\n- Structural Testing:\
    \ Used to measure how much testing has been carried out\n- Confirmation Testing\
    \ and Regression Testing: Testing related to changes\n- Maintenance Testing: Testing\
    \ that is provided while a system is in service (live). Once a system is live,\
    \ the system and its operational environment is often corrected, changed or enhanced.\
    \ The testing that is provided during this phase is called maintenance testing.\
    \ The bulk of Maintenance Testing is Regression Testing.\n"
  mdcn: "\n\n## A.10: B. a, d 和 f\n\n**解释：** 这测试了你对基本测试流程中“测试计划与控制”活动任务的理解。\n\n- a)\
    \ 安排测试分析和设计：一项测试计划任务\n- d) 识别测试目标：一项测试计划任务\n- f) 选择用于监控和控制的测试指标：一项测试计划任务\n\n##\
    \ 第二部分：贯穿生命周期的测试\n\n![](img/52762cc20a1c71379bad2e432b5742a4_61_0.png)\n\n## 第二部分涵盖的主题\n\
    \n- 1. 测试模型\n- 2. 验证与确认\n- 3. 良好测试的特征\n- 4. 前置测试（Front Loaded Testing）\n- 5. 测试级别\n\
    - 6. 测试类型\n\n## 第二学习成果\n\n学习者将能够：\n\n- 1. 理解传统瀑布模型的特征\n- 2. 理解通过验证与确认来确保整个开发生命周期的质量\n\
    - 3. 理解 V 模型的特征\n- 4. 理解迭代模型的特征\n- 5. 领会为什么在开发生命周期早期开始测试非常重要\n- 6. 区分不同的测试级别\n\
    - 7. 区分不同的测试类型\n\n## 测试模型\n\n将涵盖以下三个测试模型：\n\n- 传统瀑布模型\n  - 示例：结构化系统分析与设计方法 (SSADM)\n\
    - V 模型 — 瀑布模型的扩展\n- 迭代模型\n  - 示例：使用以下技术的敏捷开发：\n    - RAD（快速应用开发）\n    - SCRUM\n\
    \    - XP（极端编程）\n    - DSDM\n\n## 传统瀑布模型\n\n下图展示了瀑布模型的图表示\n\n![](img/52762cc20a1c71379bad2e432b5742a4_62_0.png)\n\
    \n### 瀑布模型的特征\n\n- 它是顺序的/线性的\n- 在编码完成后，每个工作产品/活动在下一次测试之前完成并签字，然后决定是否将产品发布到现场环境！\n\
    - 硬化的模型，不鼓励变更\n- 更改只能通过变更请求（Change Requests）对工作产品进行\n- 因此，更改的成本很高\n- 将测试推到生命周期的末端\n\
    \n## 验证与确认（Verification and Validation）\n\n- 这些是用于确保整个开发生命周期质量的流程。\n- 用于检查每个阶段的工作产品是否符合其目标\n\
    - 在工作产品完成后对其进行评估（测试），以便在创建点发现并修复问题\n- 当应用于瀑布模型时，它将瀑布模型的形状转变为 V 模型\n\n## 验证（Verification）\n\
    \n- 定义为对开发阶段的工作产品（例如规格书、组件或完整系统）进行评估，以确定其是否满足该阶段开始时指定的规格。\n- 工作产品验证者必须努力找出工作产品是否“构建正确”（built\
    \ right）。\n\n## 验证活动\n\n- 1. 所有静态测试：所有不需要执行代码的工作产品评估，例如对需求、规格书、设计或代码的检查或评审。\n\
    - 2. 所有动态测试：执行代码以证明软件是根据规格构建的\n\n## 确认（Validation）\n\n- 定义为根据用户需求和要求，确定软件开发工作产品的正确性。\n\
    - 验证工作产品的人必须努力找出它是否是用户的“正确选择”（the right one）。\n- 确认活动通常是系统用户的关注点\n\n## 确认活动\n\n\
    - 1. 所有用于证明系统满足用户需求的动态测试\n\n### 脑筋转弯 3\n以下四个陈述中有三个对于验证活动是正确的，但哪一个对于确认活动是正确的？\n\
    \n- 1. 可以使用静态测试技术（评审、检查、演练）\n- 2. 通常涉及\n- 3. 始终需要用户参与\n- 4. 检查我们是否构建了正确的系统\n\n\
    ## V 模型\n\n### V 模型的特征\n\n- 瀑布模型的扩展\n- 促进工作产品的早期评估\n- 验证与确认在模型的不同阶段应用\n![](img/52762cc20a1c71379bad2e432b5742a4_64_0.png)\n\
    \n图 11：V 模型\n\n## 实践练习 1\n\n- 使用 V 模型进行工作产品的早期评估\n- 验证与确认在模型的不同阶段应用\n- 所有证明系统满足用户需求的动态测试\n\
    ![](img/52762cc20a1c71379bad2e432b5742a4_65_0.png)\n\n图 12：实践练习\n\n### 脑筋转弯 3\
    \ 答案\n3. 始终需要用户参与（对于确认，而验证不一定）\n\n## 迭代模型\n\n### 迭代模型的特征\n\n- 在编码开始之前不需要完全开发需求\n\
    - 通常是“循环的”\n- 每个周期是一个时间箱（RAD）或冲刺（SCRUM）\n- 用户代表在整个开发和测试过程中都有权进行变更\n- 产品版本是系列构建的\n\
    ![](img/52762cc20a1c71379bad2e432b5742a4_66_0.png)\n\n图 13：迭代模型\n\n## 良好测试的特征\n\
    \n- 早期测试设计：出现在 V 模型中\n- 每个发布都经过测试：出现在 V 模型中\n- 在迭代模型中进行测试\n- 测试人员在需求签字之前参与评审\n\
    \n### 脑筋转弯 4\n软件测试活动何时应该开始？\n\n- 1. 代码编写后立即开始\n- 2. 在设计阶段\n- 3. 当需求已正式文档化后\n-\
    \ 4. 在开发生命周期中尽早开始\n\n### 脑筋转弯 4 答案\n4. 在开发周期中尽早开始\n\n## 测试级别\n\n- 组件测试：也称为单元测试。它是程序员级别的测试。\n\
    - 小规模集成测试：使用大爆炸、自顶向下或自底向上策略将这些组件组合成子系统\n- 功能系统测试：根据功能规格书进行测试，我们通常称之为系统测试等\n- 非功能系统测试：针对性能、易用性等方面的测试\n\
    - 大规模集成测试：测试所有系统与其他系统的交互\n- 验收测试：例如用户验收测试和合同验收测试\n\n## 测试类型\n\n- 功能测试：基于规格的测试\n\
    - 非功能测试：测试系统的行为特方面\n- 结构化测试：用于衡量执行了多少测试\n- 确认测试和回归测试：与变更相关的测试\n- 维护测试：在系统运行（上线）期间提供的测试。一旦系统上线，系统及其运行环境经常会进行修正、更改或增强。在此阶段提供的测试被称为维护测试。维护测试的大部分是回归测试。\n\
    \n"
