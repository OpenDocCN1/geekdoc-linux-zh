    help to track changes made to them

    d) Tracking changes to test items. *See b) above*


    A 6.6: Answer is D, a and b are true; c and e are false

    Explanation: This question tests your understanding of static analysis tools

    Static Analysis Tools are used by developers to examine the source code for possible
    anomalies without executing the code. Certain metrics can be measured by Static
    Analysis tools to give indication of possible anomalies that may exist in the
    code.

    a Variables that are never used: this is true because Static Analysis Tools can
    identify the code, variables that were defined by the developer but never used
    anywhere in the code

    b) Security vulnerabilities: this is true because Static Analysis Tools can examine
    source code to detect and report vulnerabilities that can lead to security vulnerabilities.

    c) Poor performance. False

    d) Unreachable code: this is true because Static Analysis Tools can examine source
    code to detect module(s) of a source code that are detached such that there is
    no logical flow path to the module(s) of the rest of the program, thus they can
    never be executed'
