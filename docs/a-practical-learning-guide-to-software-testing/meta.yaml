  mdcn: "\n\n## 等价划分\n\n- 需求文档通常规定了软件必须遵守的规则\n- 规则 A 可能是“如果 m 小于1，则执行此操作”\n- 规则 B\
    \ 可能是“如果 m 大于等于1且小于等于12，则执行此操作……”以此此类推\n\n思考月份字段可以持有哪些值的规则。如果月份小于1，那么它是无效的。\n\
    - 如果在 1 到 12 之间，它是可以的且可以接受该值。\n- 如果大于 12，它是无效的，你可以打印错误\n\n所有输入系统的无限整数范围必须符合以下三个标准或类别之一：\n\
    - 小于 1\n- 在 1 到 12 之间\n- 大于 12\n\n- 如果我们从每个数字范围选择一个值，并将其作为测试用例，可以说我们覆盖了这三条规则。\n\
    我们取什么值重要吗？并不重要！\n事实上，我们可以认为分区中的每一个值都是等价的。这正是该技术的名称来源。\n通过这种方法，我们无限可能的取值将被这三个类别（即这三条规则）覆盖！\n\
    \n## 等价划分 - 输入和输出划分\n\n使用上述月份字段场景，我们得到了下面的输入和输出划分表：\n\n| 业务规则 | 输入划分 | 输出划分 |\n\
    | :--- | :--- | :--- |\n| 月份小于1 打印“无效太低” | Month<1 | invalid too low |\n| 月份在\
    \ 1 到 12 之间打印“有效” | (Month>=1, (Month<=12) | valid |\n| 月份大于12 打印“无效太高” | (Month>12)\
    \ | invalid too high |\n\n表 2：等价划分 - 输入和输出划分表\n\n## 动手实践练习 3\n\n- 1. 编写有效输入示例，以测试上述的每个划分。\n\
    - 2. 设计一个输入和输出划分表，针对学习者年龄，包含小学、中学和大学场景的业务规则、有效输入划分和输出划分。\n\n## 边界值分析\n\n- 错误倾向于聚集在边界附近\n\
    - 使用我们之前的日期划分示例可以看出，为了使日期有效，它必须落在 1 和 12 的“有效边界值”之内。\n- 同样，如果日期无效，它将落在这些有效边界之外。\n\
    - 使用 BVA 测试的原理是，你可以获取边界的任何一侧，精度是该值尽可能贴近划分。\n- 0, 1, 2 是测试下边界的有效值。\n- 11, 12, 13\
    \ 是测试上边界的有效值。\n\n## 动手实践练习 4\n\n- 根据动手实践练习 3 第2题描述的场景，寻找小学、中学和大学划分的有效学习者年龄边界和有效年龄值。\n\
    \n## 决策表测试\n\n- 规格通常包含简单和复杂的业务规则\n- 对于每个规则必须做出决策\n- 决策表帮助我们通过使用导致动作的条件组合捕捉决策，从而设计测试用例来测试这些规则\n\
    - 决策表中生成的每一列都将是一个测试用例\n\n我们重新回顾动手实践练习 3 第2题中描述的小学、中学和大学场景：\n\n- 规则 1 将年龄在 4 到\
    \ 11 岁之间的学习者放在小学\n- 规则 2 将年龄在 12 到 18 岁之间的学习者放在中学\n- 规则 3 将 18 岁以上的学习者放在大学\n-\
    \ 规则 4 将年龄 14 岁以上的天才学生放在大学\n\n## 小学、中学和大学场景的决策表\n\n| 测试用例 1 | 测试用例 2 | 测试用例 3\
    \ | 测试用例 4 |\n| :--- | :--- | :--- | :--- |\n| 业务规则 1 | 业务规则 2 | 业务规则 3 | 业务规则\
    \ 4 |\n| 条件 | | | | |\n| 4 到 11 岁 | T | F | F | F |\n| 12 到 18 岁 | F | T | F |\
    \ ? |\n| 18 岁以上 | F | F | T | ? |\n| 天才但年龄大于 14 岁 | ? | F | ? | T |\n| 动作 | |\
    \ | | |\n| 安排小学 | T | F | F | F |\n| 安排中学 | F | T | F | F |\n| 安排大学 | F | F |\
    \ T | F |\n\n表 3：决策表测试\n\n**T 代表业务规则为真，F 代表业务规则为假，? – 由学习者完成**\n\n动手实践练习 5\n根据上述小学、中学和大学场景的决策表，填充问号\
    \ (?) 字段。确定适用业务规则的结果是真还是假。\n\n状态转换测试\n\n- 输出由输入条件或状态的变化触发\n- 行为取决于当前和过去的状态\n-\
    \ 转换触发系统行为\n- 使用状态转换图 (STD)\n- 使用两种符号\n\n![](img/52762cc20a1c71379bad2e432b5742a4_93_0.png)\n\
    \n图 18：状态转换测试符号\n\n- 有了状态转换图，我们可以分析系统的行为\n  - 当转换发生时\n\n- 转换由事件引起\n  - 并可能产生输出和或\n\
    \  - 状态改变\n\n- 事件是导致变化的简单触发器\n\n- 事件是变化的简单触发器\n- 我们创建一个状态表来记录所有可能的事件和状态，这是我们推导出测试用例的地方\n\
    \n![](img/52762cc20a1c71379bad2e432b5742a4_94_0.png)\n\n图 19：状态转换测试符号\n\n## 用于显示状态程序的简单\
    \ STD\n\n![](img/52762cc20a1c71379bad2e432b5742a4_95_0.png)\n\n图 20：用于显示状态程序的简单\
    \ STD\n\n## 飞机门的状态表\n\n| | 测试用例 1 | 测试用例 2 | 测试用例 3 | 测试用例 4 | 测试用例 5 |\n| :---\
    \ | :--- | :--- | :--- | :--- | :--- |\n| 状态 | 打开 | 关 | 锁定 | 解锁 | 推开 |\n| 关闭 |\
    \ 关闭/可用 | 锁定/接合 | | | |\n| 锁定 | 锁定/接合 | 打开/可用 | | | |\n| 解锁 | | 解锁/可用 | | | |\n\
    \n示例：从上表从状态推断出，当应用“关闭”事件时，会进入“关闭/可用”状态。\n\n表 4：飞机门的状态表\n\n## 动手实践练习 6\n\n- 考虑下面的\
    \ STD：\n\n![](img/52762cc20a1c71379bad2e432b5742a4_96_0.png)\n\n图 21：动手实践练习 6\
    \ 的洗手间备用 STD\n\n- 1. 从图 21 识别状态、事件、无效转换和输出。\n2. 思考你可以写多少个测试用例。\n3. 设计一个状态表以覆盖所有情况。\n\
    \n"
