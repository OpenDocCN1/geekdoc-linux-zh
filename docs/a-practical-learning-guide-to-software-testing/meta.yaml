    ## A 5: Answer is D. a, c and d by the test leader; b by the tester.


    Explanation: This question tests your understanding of tasks that are performed
    by a Test Leader and that of a Tester.


    - a) Adapt planning based on test results: Test Leader. The Leader is responsible
    for making changes to a test plan based on test results. Such change may include
    reducing or increasing the scope of testing thereby changing the Test Schedule.


    - b) Create test specifications: Tester. The tester creates deliverables like
    Test Cases, Scripts, Expected Results and Test Data as Test specifications. Test
    Plans and these deliverables explain "how" to implement the Test Cases described
    in the test plan.


    - c) Plan tests: Test Leader. Planning requires the skills and experience of a
    senior testing resource like the Test Leader


    - d) Write or review a test strategy: Test Leader. This requires the skills and
    experience of a senior testing resource like the Test Leader


    ## A 5.3: Answer is D. Tester 4


    Explanation: This question tests your understanding of incident reporting. We
    are informed from the question that User log-on is a critical component of the
    system. That means the incident on User log-on has a high priority for the business
    because of the criticality. Tester 1 and Tester 4 are the only ones that reported
    the incident with Priority 1 (high priority for business) so this knocks answer
    A and C (Tester 3 and Tester 2) out the possible answers!


    However we are also told to take into consideration the complete information that
    the Testers have provided. Tester 1 fails to provide detailed information that
    will enable the developer to reproduce the defect. Tester 1 misses significant
    information of providing the expected result and the actual result plus any additional
    information that will provide more insight into the issue!


    Tester 4 provided all these missing information in the defect report and makes
    Tester 4’s report the most effective one.


    ## A 5.4: Answer is A. Suggestions for correcting the problem


    Explanation: A Tester must never include in the incident report any suggestion
    on how to fix a bug. Here are some of the reasons why a tester should not suggest
    how to fix a bug:


    - Tester’s suggestion may mislead the Developer and cause more problems. Developer
    may feel that the Tester is encroaching on their responsibility causing unnecessary
    rift between the Tester and the Developer.


    - Tester’s suggestion may actually be wrong thereby causing professional mistrust
    and embarrassment to the Tester.


    ## A 5.5: Answer is C. a, b and d


    Explanation: This question tests your understanding of Configuration Management
    in Testing. A great challenge on test projects is to make sure that the testware
    (test deliverables) aligns with the software under test SUT. This means being
    able to track a test deliverable to the correct version of the software that it
    is relevant to. Whenever a change is made to the SUT, the version must change
    and as a result the test deliverable to test that software needs to also change
    (in version and contents) to match the changes made to the SUT.


    The following are all relevant purposes for Configuration Management in Testing:

    a) Identifying the version of software under test

    b) Controlling the version of testware items

    c) Tracking changes to test items


    ## A 5.6: Answer is A, c, a, b, d


    Explanation: This question tests your understanding of Test Independence. Test
    Independence is when the software is tested by someone/people/organisation other
    than those designed or developed it. The further the test is performed away from
    those that designed or developed the software to be tested, the greater the Test
    Independence. Using the table below we can see that Answer A (c, a, b, d) gives
    the most accurate increasing levels of Test Independence?


    | | Test Independence |

    |---|---|

    | d) Tests designed by different organisation. | High |

    | b) Tests designed by a different group within the organisation. | Medium |

    | c) Tests designed by a fellow-member of the design team. | Low |

    | c) Tests designed by the code author. | Zero |


    Table 19: Explanation of A 5.6


    ## A 5.7: Answer is C. Making decisions based on information from test monitoring


    Explanation: This question tests your understanding of Test Control. Test Control
    activities are usually performed by the Test Leader to ensure that the test progresses
    according to schedule or avoid potential risk of software failure. A Leader will
    monitor test activities on daily basis using appropriate monitoring metrics eg
    the number of Test Cases passed versus the Test Cases designed. A Test Leader
    will use such metrics to make realistic decisions to ensure that the best testing
    is performed within the time constraints. Such decisions may include reducing
    the scope of test execution by deferring low priority Cases to a later phase of
    the project, so that focus of testing is on those medium and high priority Test
    Cases (according to the Test Completion criteria). It could also be that the Test
    Leader may increase the scope of testing to accommodate more Test Cases on certain
    functions, for example when initial test results indicate potential issues in
    those functions of the application resulting from integration with another application.


    ## A 5.8: Answer is B, a and f


    Explanation: This question tests your understanding of Test Planning activities.

    a) Scheduling test analysis and design: Test Schedule is one of the items included
    in a Test Plan. This activity involves scheduling all of the activities involved
    in the Fundamental Test Process (FTP) which includes test analysis and design.


    b) Designing Test Conditions: This is done during Test Analysis and Design.


    c) Monitoring test progress: This cuts across multiple activities in the FTP monitoring
    during test analysis and design such as checking the Percentage of work in test
    case preparation or monitoring during work in Test Execution and Implementation
    as Percentage of work done in test environment preparation


    d) Identifying the objectives of testing: This is done at the early stages of
    Test Planning and often included in the introduction section of a Test Plan.


    e) Evaluating test tools: This is a separate activity that is done when a new
    test tool introduced into an organization


    f) Selecting test metrics for monitoring and control: This is done during Test
    Planning and often included in the Test Approach section of a Test Plan.


    ## A 5.9: Answer is B. We may not be able to get a contractor to join the team
    as planned


    Explanation: This question tests your understanding of Project and Product risks.
    A tester should be able to distinguish between project and product risks. Identifying
    possible risks will enable the tester to manage them. The Test Leader will manage
    risks within the testing work area. The Project manager manages the off project
    risks. Product Risks can cause failure (defects) of Software under Test (SUT)
    and is usually due to changes or other factors whereas Project Risk usually causes
    delays in the project''s timelines, and the source of these may be internal or
    external.


    With this understanding we explain the following answer options:


    - 1. There are non-standard implementations of some features : this is product
    risk as this can cause failure of the features and then the Software under Test
    (SUT)

    - 2. We may not be able to get a contractor to join the team as planned: this
    is project risk as this can cause delays in the project''s timeline. This risk
    must be managed by the Test Leader.

    - 3. The response times of the software may not be fast enough: this is product
    risk as this directly affects the software product and will cause user dissatisfaction

    - 4. The contract has a legal loophole which has affected the company profit:
    this is neither a project or product risk as we cannot link this to either a software
    product or a software development project


    ## A 5.10: Answer is B. Targeting at the more critical areas of the system


    Explanation: This question tests your understanding of Risk Based Testing (RBT)
    which is an essential approach to testing for testers. RBT is used to prioritise
    tests designed for features and functions of software, based on:


    - the risk of failure (likelihood or impact of failure) of the features and functions

    - the importance of the features and functions


    Targeting test at the more critical areas of the system is therefore Risk Based
    Testing.

