- md: "\n## Brainteaser 1\n\nWhich of the following is a software fault?\n\n- 1. A\
    \ programmer forgot to write the validation code for a numeric value\n- 2. Some\
    \ code that validates a month number reads:\n\n```\nIF MONTH < 1 OR MONTH >=12\
    \ THEN\nDisplay \"Invalid month\"\nENDIF\n```\n\n- 3. A screen rejects \"12/01/99\"\
    \ as an \"invalid date\"\n\n## Brainteaser 2\n\nWhich of the following is a software\
    \ failure?\n\n- 1. The variable 'TODAY' is not initialised in a program, when\
    \ started\n- 2. The business analyst failed to document all the requirements in\
    \ a software requirements specification\n- 3. The software which performs the\
    \ premium calculation for an insurance policy produces the wrong result\n\n##\
    \ Answer to Brainteaser 1\n\nThe correct answer:\n\n- 2. Some code that validates\
    \ a month number reads:\n\n```\nIF MONTH < 1 OR MONTH >=12 THEN\nDisplay \"Invalid\
    \ month\"\nENDIF\n```\n\nYes. This would treat 12 as an INVALID month number\n\
    \n## Answer to Brainteaser 2\n\nThe correct answer:\n\n- 3. The software which\
    \ performs the premium calculation for an insurance policy produces the wrong\
    \ result\n\nYes. The software fails to produce the correct result\n\n## Fundamental\
    \ Test Process\n\nThe test process is a risk management exercise and is used to\
    \ mitigate risk.\nFive common activities in the Fundamental Test Process are:\n\
    \n- Test planning and control\n- Test Analysis and Design\n- Test Implementation\
    \ and Execution\n- Evaluating exit criteria and reporting\n- Test Closure\n\n\
    ## Test Planning and Control\n\nTest Planning tasks:\n\n- Determine the scope\
    \ of testing and risks that may impact on testing\n- Identify the objectives of\
    \ testing\n- Determine the Test Approach (the test strategy)\n- Implement the\
    \ policy of the organisation and/ or the test strategy\n- Determine the required\
    \ test resources like people, test environments, PCs, etc.\n- Schedule test analysis\
    \ and design tasks, test implementation, execution and evaluation\n- Determine\
    \ the Exit Criteria such as Coverage Criteria\n\n## Test Control tasks:\n\n- Measure\
    \ the results of reviews and testing\n- Monitor and document Test Progress, Test\
    \ Coverage and Exit Criteria\n- Provide information on progress of testing\n-\
    \ Initiate corrective actions to put testing back on track\n- Make decisions on\
    \ how to progress with testing\n\n## Test Analysis and Design\n\n- Analyser the\
    \ application\n- Identify test conditions\n- Design Test Cases\n- Establish the\
    \ traceability of the test conditions to Test Cases and test basis\n- Develop\
    \ test scripts\n- Define expected results\n- Look backward to the planning\n-\
    \ Look forward to the execution\n- Document thoroughly\n- BS7925-2 is one of the\
    \ many sources of definitions for test case design techniques\n- Test case design\
    \ can be generated from both an analysis of the business scenarios and/or use\
    \ cases\n\n## Test Implementation and Execution\n\n- It is during this stage that\
    \ a Tester will do the following:\n  Prioritise Test Cases\n  Create test data\n\
    \  Set up the test environment\n  Check that the test environment is complete\
    \ by:\n    Verifying that the test environment is working\n    Ensuring the test\
    \ environment mirrors the intended live environment\n  Perform execution of the\
    \ test scripts\n    * Perform test recording of every test result comprising actual\
    \ versus expected outcome against the software version under test\n    * Any deviation\
    \ of actual versus expected result must be recorded as well\n  * BS7925-2: describes\
    \ the content of the test record\n    * The test log should record:\n    * Software\
    \ and test versions\n    * Specifications used as baseline\n    * Test timings\n\
    \    * Test Results: Actual and Expected\n    * Defect detail for erroneous tests\n\
    \n- Evaluating exit criteria and reporting\n  Means checking for Test Completion\
    \ to ensure that Test Coverage has been achieved against the Exit Criteria (Test\
    \ Completion Criteria) defined in the Plan\n  This activity also include writing\
    \ a Test Summary Report for stakeholders\n\n- Test Closure\n  Once test completion\
    \ criteria are met and Test Summary Report for stakeholders are completed, test\
    \ closure activities can be done such as:\n    Signing off the Test Summary Report\n\
    \    Collecting data from completed test activities to create a repository of\
    \ experience, facts and figures for future reference\n    Handing over the test\
    \ ware to maintenance team\n  Then the application / software can be released\
    \ to the next stage of the development life-cycle\n\n## Psychology of Testing\n\
    \n![](img/52762cc20a1c71379bad2e432b5742a4_51_0.png)\n\nFigure 7: Psychology of\
    \ testing\n\n- Testers must understand:\n  * the skills and techniques of testing\n\
    \  * where someone other than author of a work product perform testing\n- Developers:\n\
    \  * Are perceived as creative\n  * Usually need technical skills\n- Testers:\n\
    \  * Are perceived as destructive\n  * Need to be multi-talented\n\n## Retesting\n\
    \n- If we run a test that detects a fault we get the fault corrected\n- We repeat\
    \ the test to ensure the fault has properly fixed\n- This is called re-testing\n\
    - If we expect to find faults we must expect to do re-testing\n\n## Regression\
    \ Testing\n\n- When software is fixed, it often happens that 'knock-on' effects\
    \ occur\n- We need to check that only the faulty code has changed\n- There is\
    \ 50% chance of regression faults\n- Regression tests tell us whether new faults\
    \ have been introduced into the software i.e. whether the system still works the\
    \ way it was before the change to the code or environment has been made\n\n![](img/52762cc20a1c71379bad2e432b5742a4_52_0.png)\n\
    \n## Expected Results\n\n- External specifications and baselines define what the\
    \ software is required to do\n- Requirements Specification, Functional Specification,\
    \ Design Specification etc. are baselines\n- Without requirements, developers\
    \ cannot build and testers cannot test\n- Programmers need them to write the code\n\
    - Testers need them to:\n  * identify the things that need testing\n  * compare\
    \ test results with requirements\n\n- When we test we get an actual result\n-\
    \ We compare the actual results with the requirements to determine whether a test\
    \ has passed\n- A baseline describes what we require the system to do\n- User\
    \ requirement, design specification and sometimes the 'old system' tells us what\
    \ to expect\n\n## Why Expected Results\n\n- If we don't define expected result\
    \ before we execute the test, erroneous result may be interpreted as the correct\
    \ result\n- There may be a subconscious desire to see the software pass the test\n\
    - Expected results must be defined before test execution, derived from a baseline\n\
    \n## Prioritization\n\n## Why prioritise?\n\n- Testers never have enough time\n\
    - **First principle**: to make sure the most important tests are included in plans\n\
    - **Second principle**: to make sure the most important tests are executed\n-\
    \ If tests reveal major problems, its better to find them early, to maximise time\
    \ available to correct problems\n\n- Most important tests are that:\n  * address\
    \ most serious risks\n  * cover critical features\n  * have the best chance of\
    \ detecting faults\n\n- Some methods for Prioritization in Testing:\n* Test inventory\n\
    * Feature inventory\n* Test condition inventory\n* Behaviour inventory\n"
