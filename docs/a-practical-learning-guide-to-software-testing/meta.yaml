  - "[PAGE 171]\n\nYou may have to re-run more than the test that failed. As it was\
    \ the output from a previous test that caused the failure\n\n# 9. Remember nothing\
    \ can be fault free, but ...\n\n+   - .... It can be reliable\n- Reliability =\
    \ ‘the probability that there will not be a failure of the system for a specified\
    \ time under specified conditions’\n\n# 10. You can’t possibly test everything\n\
    \n+   - It would take an impractical amount of time\n- Just make sure that when\
    \ you stop testing you have “done the best testing in the time available”\n- Execute\
    \ the most important tests first.\n- Those would cause the most:\n  - severe failures\n\
    \  - visible failures\n  - likely failures\n  - complex failures"
  - "[PAGE 172]\n\n# Section 2 - A Hands on Practical Guide to Software Testing\n\n\
    # About Section 2\n\n+   - In this section you will learn the essential skills\
    \ required to develop your testing craft\n- The practical is based on a real world\
    \ case study of an old Mortgage Firm in London\n- You will produce Test Deliverables\
    \ that cover the five activities of the Fundamental Test Process discussed in\
    \ part one of section one this guide.\n- These activities are:\n  * Test planning\
    \ and control\n  * Test Analysis and Design\n  * Test Implementation and Execution\n\
    \  * Evaluating exit criteria and reporting\n  * Test Closure\n- Your deliverables\
    \ will cut across the following Test Levels of the V-Model:\n  1. Integration\n\
    \  2. System\n  3. Acceptance\n- The Integration and System Test Levels are combined\
    \ into System Integration Level for convenience (this is common practice in real\
    \ world)\n- The following are provided online to help you achieve the Test Deliverables:\n\
    \  1. Practical Assignment Specification which contains\n    a) Functional Specification\
    \ for the deliverables required for System Integration Test Level\n    b) Requirement\
    \ Specification for part of the deliverables required for User Acceptance Test\
    \ Level\n    c) Use Case Model for part of the deliverables required for User\
    \ Acceptance Test Level\n    d) Business Process Model for part of the deliverables\
    \ required for User Acceptance Test Level\n    e) Sample Test Plans and Templates\n\
    \    f) Sample Test Estimate for System Integration Test Level\n    g) Sample\
    \ Traceability Matrix for System Integration Test and User Acceptance Test Levels\n\
    \    h) Test scripts Matrix for System Integration Test and Acceptance Test Levels\n\
    \    i) Sample Test Data for System Integration Test Level and User Acceptance\
    \ Test Levels\n    j) Sample Test Execution Plan for System Integration Test Level"
