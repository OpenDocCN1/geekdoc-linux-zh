    During the pilot phase of introducing a tool to an organisation, the most significant
    consideration for any organization is to do a cost analysis of the tool. During
    this phase all benefits that the tool will bring will be weighed against the cost
    of implementing the tool. If the benefit outweighs the cost of the tool then it
    will be considered good Return on Investment (good ROI).


