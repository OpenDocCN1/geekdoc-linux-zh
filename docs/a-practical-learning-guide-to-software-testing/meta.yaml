    # Use Case Testing


    +   * Used by testers to specify functionality as a business scenario

    * Useful in UAT because it relates to real user processes

    * Actors serve as roles

    * Use cases are interactions between actor and the system

    * Test Cases based on use cases are called scenarios

    * Useful for exercising business rules

    * A test case represents each use case

    * Use Cases Specify Users’ Business Needs


    # Actor


    An actor is anything outside the System under Test (SUT) which interacts with
    the system such as a person, a group of persons, an organisation, another system
    or a piece of equipment. The interaction (use case) between the actor and the
    system must provide some measurable value to the actor.'
