    # ## Categories of Test Case Design Techniques


    +   * Specification-based or Black Box Testing Techniques

    * Structure-based or White Box Testing Techniques

    * Experience Based Techniques


    # ## Specification-based or Black Box Testing Techniques


    +   * Black box testing is also called functional testing

    * Treat software under test as a black box

    * No knowledge of internals required or assumed

    * Tests based on specification of required behaviour of the system

    * Specifications should not define how a system should achieve the specified behaviour
    but what a system should do

    * Specification is used to design tests

    * Specification is used as the baseline for results

    * The following are the Black Box techniques that are used for designing Test
    Cases:


    +   1. Equivalence partitioning

    2. Boundary value analysis

    3. Decision table testing

    4. State transition testing

    5. Use case testing'
