    # Content of Test Plan


    +   1. Test Plan Identifier

    2. References

    3. Introduction

    4. Test Items

    5. Software Risk Issues

    6. Features to be Tested

    7. Features not to be Tested

    8. Approach

    9. Item Pass/Fail Criteria

    10. Suspension Criteria and Resumption Requirements

    11. Test Deliverables

    12. Remaining Test Tasks

    13. Environmental Need

    14. Staffing and Training Needs

    15. Responsibilities

    16. Schedule

    17. Planning Risks and Contingencies

    18. Approvals

    19. Glossary


    # Test plan identifier


    +   • Unique, generated number to identify this test plan, its level and the level
    of software that it is related to

    • Preferably the test plan level will be the same as the related software level

    • May also identify whether the test plan is a Master plan, a Level plan, an integration
    plan or whichever plan level it represents


    # References


    +   • list all documents that support the test plan

    • e.g. Project Plan, Requirements specifications, design document(s), development
    and test standards


    # Introduction


    +   • The purpose of the Plan, possibly identifying the level of the plan (master
    etc)

    • The executive summary part of the plan


    # Test Items (Functions)


    +   • What you intend to test

    • Developed from the software application inventories as well as other sources
