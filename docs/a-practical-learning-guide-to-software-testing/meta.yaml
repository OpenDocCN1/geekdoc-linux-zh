    A 6.5: Answer is C, a and b.

    Explanation: This question tests your understanding of Configuration Management.
    Configuration Management helps to keep track and keep control of the items that
    contribute to development of the software. Such items include source code, test
    scripts, third-party software, hardware, data and both development and test documentation.
    Configuration Management makes that these items are managed carefully, thoroughly
    and attentively during the entire project and product life cycle. For testing,
    Configuration Management allows the testers to manage their test and results,
    so it is important that Configuration Management enable the following options
    in the answer:


    - a) Identifying the version of software under test: this will make it possible
    to link the right version of testware to the right version of software under test

    - b) Controlling the version of test items: ensuring test items are controlled
    will help to track changes made to them

    - d) Tracking changes to test items. *See b) above*


    A 6.6: Answer is D, a and b are true; c and e are false

    Explanation: This question tests your understanding of static analysis tools

    Static Analysis Tools are used by developers to examine the source code for possible
    anomalies without executing the code. Certain metrics can be measured by Static
    Analysis tools to give indication of possible anomalies that may exist in the
    code.

    - a Variables that are never used: this is true because Static Analysis Tools
    can identify the code variables that were defined by the developer but never used
    anywhere in the code

    - b) Security vulnerabilities: this is true because Static Analysis Tools can
    examine source code to detect and report vulnerabilities that can lead to security
    vulnerabilities.

    - c) Poor performance. False

    - d) Unreachable code: this is true because Static Analysis Tools can examine
    source code to detect module(s) of a source code that are detached such that there
    is no logical flow path to the module(s) of the rest of the program, thus they
    can never be executed

    - e) Business processes not followed. False


    A 6.7: Answer is B. i-r, ii-q, iii-s, iv-p

