    ## 正式评审的阶段\n\n### 计划（Planning）\n\n- 选择合适的人员角色\n- 分配角色\n    - 测试角色——检查可测试性和清晰度\n\
    \    - 用户角色——查看与业务价值的关系\n- 定义入口和出口标准（通常用于检查）\n- 选择需要评审的文档部分\n\n### 启动启动（Kick off）\n\
    \n- 分发与待评审主题相关的文档\n- 解释评审目标\n\n### 个人准备（Individual preparation）\n\n- 每个参与者独立完成工作\n\
    \n### 评审会议（Review meeting）\n\n- 讨论发现的缺陷\n- 记录缺陷\n- 记录纪要（由记录员）\n\n### 重做（Rework）\n\
    \n- 作者修正/修复提出的缺陷\n\n### 跟进（Follow up）\n\n- 评审负责人确保同意的缺陷已修复\n- 指标收集\n- 满足标准（检查）\n\
    \n## 评审流程的特定角色\n\n### 管理者（Manager）\n\n- 决定评审的内容\n- 为评审会议分配时间\n- 决定评审目标是否达成\n-\
    \ 除非具有技术知识或能增加价值，否则通常不参与会议\n\n### 协调员（Moderator）\n\n- 评审负责人\n- 计划评审\n- 跟进\n- 对更新后的文档做出最终决定\n\
    \n### 作者（Author）\n\n- 编写被评审的文档\n- 修复任何同意的缺陷\n\n### 评审员（Reviewers）\n\n- 也称为检查员或视察员\n\
    - 可能具有技术背景\n- 他们发现缺陷\n\n### 记录员（Scribe）\n\n- 记录所有提出的问题和缺陷\n\n## 何认为评审流程是成功的？\n\
    \n- 实现了明确的目标\n- 相关人员参与其中\n- 客观发现并处理缺陷\n- 对参与者来说是积极的\n- 使用了检查表或规则\n- 管理层的支持\n-\
    \ 强调学习和过程改进\n- 结果发现并解决了缺陷\n- 投入的时间合理\n- 使用的预算合理\n\n## 评审在测试过程中的收益\n\n- 提高软件开发生产力并缩短开发周期\n\
