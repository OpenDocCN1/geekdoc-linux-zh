    - 例如，在语句“x = y + z”中，变量 y 和 z 被使用了，因为它们包含的值正在被访问并相加，然后放入名为“x”的内存位置中，因此 x 被定义了。\n\
    - 静态分析工具可以执行许多简单的检查。\n- 例如：确保每个变量在使用之前都已定义。\n- 它可能包含的值在每次程序执行时都可能不同\n- 并且在任何情况下，它都不可能包含正确的值（数据流故障）\n\
    - 静态分析工具可以确保变量每次被定义时，都会在程序的后续某处被使用。如果没有使用，那么最初定义它是干什么？\n- 这被称为数据流异常，尽管它可能是一个完全无害的错误，但也可能表明存在更严重的问题。\n\
    \n### 代码行数 (LOC 或每 1000 行代码为 KLOC)\n\n- 是代码模块大小的衡量标准。\n- 扇入（Fan-in）与调用（进入）给定模块的模块数量有关。\n\
    - 高扇入模块通常位于层级底部，或位于被频繁调用的库中。\n- 高扇出（High Fan-out）的模块通常位于层级顶部，因为它们调用了许多模块（例如主菜单）。\n\
    - 任何同时具有高扇入和高扇出的模块可能都需要重新设计。\n\n### 扇出/扇入 (Fan-Out/Fan-In)\n\n![](img/52762cc20a1c71379bad2e432b5742a4_80_0.png)\n\
    \n图 15：扇出/扇入\n\n### 4. 嵌套层级 (Nesting levels)\n\n- 与 IF 语句嵌套在其他 IF 语句中的深度有关。\n\
