  - '[PAGE 71]


    This question tests your understanding of the following:


    +   - Top-down approach in component testing using stub

    - Memory leak: A defect that causes a program to fail to reclaim memory after
    it has finished using it, eventually causing the program to fail due to lack of
    memory. A memory leak is the result of a programming bug, so it is very important
    to test it during development phase (programmer''s level testing or component
    testing level)

    - Development testing (component testing) does not require formal defect management
    as defects are fixed by developers without input from Testers at this stage.


    A2.3 The answer is C. In Agile development models, the number of Test Levels for
    an iteration can vary depending on the project.

    **Explanation:** This question tests your understanding of the Test Levels within
    V-Model and Iterative Model. There are variances in the number of Test Levels
    that may be run within a software development model on any Software Development
    Project. This is especially true for projects running Agile or V-Model Methodologies.


    For Agile methodologies it is important to note that no two projects will be the
    same, for example the project requirements, objectives of each iteration and the
    requirements for test environment may vary from one project to the other or even
    from one iteration to the other. These variances will impact on the Test Levels
    to be included per iteration project.


    For V-Model Methodology you may also need to include other Test Levels apart from
    the four described in this part. For example you may have a System Integration
    Test Level between the System and Acceptance Levels.


    A2.4 The answer is C: a, b and d

    **Explanation:** This question tests your understanding of Maintenance and Regression
    Testing as Types of Testing.

    Consider the options provided and copied below:


    +   - a) As part of a migration of an application from one platform to another.

    - b) As part of a planned enhancement release.

    - c) When the test scripts need to be updated.

    - d) For data migration associated with the retirement of a system.


    Options a, b and d all have to do with systems that are already in place (legacy
    systems) or migration from an existing environment to system to another. Maintenance
    Testing is always performed when you make changes to system that is already live.
    This is why the bulk of Maintenance Testing is Regression Testing.


    A2.5 The answer is D. c and d'
  - '[PAGE 72]


    Explanation: This question tests your understanding of Test Levels within V-Model

    Consider the answer options provided and copied:


    +   a) Component Integration testing is present in all good development models.

    b) Acceptance testing can take place before system testing starts.

    c) Acceptance testing should only start when system testing is complete.

    d) There may be fewer than four Test Levels in a V-model.


    Options c and d are the correct ones.


    Option c: It is true that Acceptance testing should only start when system testing
    is complete because the focus of System Testing is to verify that the functionalities
    built into the system are as per expectation in the Functional Specification Document.


    Acceptance Testing is the last stage where the focus is no longer on functionality
    testing but testing to end user''s expectation. It is important to verify the
    correctness of functionality (System Testing) before the users have the opportunity
    to validate the correctness of the system with their expectations (Acceptance
    Testing)


    Option d: It is true that the number of Test Levels to include in a project based
    on V-Model may vary across projects.


    A.6 The answer is A. To measure characteristics of a system which give an indication
    of how the system performs its functions.


    Explanation: This question tests your understanding of performance testing as
    a type of Non-Functional Testing. Non-Functional Testing is not focused on directly
    testing the functionalities of a system. During Performance Testing the focus
    is to check how the system makes best use of its functions to support varying
    demands of its resources and/or integrated resources and/or users. Example is
    when you vary the loads of users accessing a website at the same time to check
    the response time of the website to the various loads of users.


    A.7 The answer is A. Functional Test Cases are derived from specifications


    Explanation: This question tests your understanding of functional testing. Functional
    Testing is focused on directly testing the functionalities of a system. This is
    done during system testing by verifying that the functionalities of the system
    works as specified. In order to achieve this, Testers have to cover all functionalities
    described in a specification as Test Cases. Because Functional Test Cases are
    derived from specifications, Functional Testing is often referred to as Specification
    Based Testing.'
- md: "\n## Part Three: Static Techniques\n\nTopics Covered in Part Three\n\n+ 1.\
