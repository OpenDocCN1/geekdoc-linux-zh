    a) Stubs may be used.\nb) May cover resource behaviour (e.g. memory leaks)\nd)\
    \ Defects are typically fixed without formally managing these defects.\n\nExplanation:\n\
    \nThis question tests your understanding of the following:\n\n- Top-down approach\
    \ in component testing using stub\n- Memory leak: A defect that causes a program\
