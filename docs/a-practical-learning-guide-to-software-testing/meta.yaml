    - 发起纠正措施以使测试回到正轨\n- 就如何推进推进测试做出决策\n\n## 测试分析与设计\n\n- 分析应用程序\n- 识别测试条件\n- 设计测试用例\n\
    - 建立测试条件到测试用例及测试基础的可追溯性\n- 开发测试脚本\n- 定义预期结果\n- 回顾规划\n- 前瞻执行\n- 详尽记录\n- BS7925-2\
    \ 是测试用例设计技术定义的众多来源之一\n- 测试用例设计可以根据业务场景和/或用例的分析生成\n\n## 测试实施与执行\n\n- 在此阶段，测试人员将执行以下操作：\n\
    \  优先级测试用例\n  创建测试数据\n  设置测试环境\n  通过以下方式检查测试环境是否完整：\n    验证测试环境运行正常\n    确保测试环境与预期的生产环境镜像\n\
    \  执行测试脚本\n    * 对每个测试结果进行记录，包括针对被测试软件版本的实际结果与预期结果对比\n    * 实际结果与预期结果之间的任何偏差也必须记录\n\
    \  * BS7925-2：描述测试记录的内容\n    * 测试日志应记录：\n    * 软件和测试版本\n    * 作为基准的规范\n    * 测试计时\n\
    \    * 测试结果：实际与预期的\n    * 错误测试的缺陷详情\n\n- 评估退出标准并报告\n  意味着检查测试完成情况，以确保已达到计划中定义的退出标准（测试完成标准）的覆盖率\n\
    \  此活动还包括为利益相关者编写测试总结报告\n\n- 测试结束\n  一旦满足完成标准并完成利益相关者的测试总结报告，即可进行测试结束活动，例如：\n\
    \    签署测试总结报告\n    从完成的测试活动中收集数据，创建一个供未来参考的经验、事实和数字库\n    将测试交付给维护团队\n  然后应用程序/软件即可发布到开发周期的下一个阶段\n\
    \n## 测试心理学\n\n![](img/52762cc20a1c71379bad2e432b5742a4_51_0.png)\n\n图 7：测试心理学\n\
    \n- 测试人员必须理解：\n  * 测试的技能和技术\n  * 由作者以外的人执行测试\n- 开发人员：\n  * 被认为具有创造力\n  * 通常需要技术技能\n\
    - 测试人员：\n  * 被认为具有破坏性\n  * 需要多才\n\n## 重测\n\n- 如果我们运行一个检测到故障的测试，我们会让故障得到修正\n- 我们重复测试以确保故障已被正确修复\n\
    - 这被称为重测（re-testing）\n- 如果我们预计会发现故障，就必须预期要进行重测\n\n## 回归测试\n\n- 当软件修复时，往往会产生连带效应\n\
    - 我们需要检查是否只有故障代码发生了变化\n- 回归故障发生的概率为 50%\n- 回归测试告诉我们软件是否引入了新故障，即在代码或环境发生更改后，系统是否仍按以前的方式运行\n\
    \n![](img/52762cc20a1c71379bad2e432b5742a4_52_0.png)\n\n## 预期结果\n\n- 外部规范和基准定义了软件需要做什么\n\
    - 需求规格书、功能规范、设计规范等都是基准\n- 没有需求，开发人员无法构建，测试人员无法测试\n- 程序员需要它们来编写代码\n- 测试人员需要它们：\n\
    \  * 识别需要测试的内容\n  * 将测试结果与需求进行比较\n\n- 当我们测试时，会得到实际结果\n- 我们将实际结果与需求进行比较，以确定测试是否通过\n\
    - 基准描述了我们要求系统做什么\n- 用户需求、设计规范以及有时的“旧系统”告诉我们预期什么\n\n## 为什么需要预期结果\n\n- 如果我们在执行测试之前没有定义预期结果，错误的结果可能被认为是正确结果\n\
    - 人可能潜意识地希望看到软件通过测试\n- 预期结果必须在测试执行之前定义，并源自基准\n\n## 优先级排序\n\n## 为什么要划分优先级？\n\n\
    - 测试人员的时间永远不够\n- **第一原则**：确保最重要的测试包含在计划中\n- **第二原则**：确保最重要的测试被执行\n- 如果测试揭示了严重问题，尽早发现它们更好，以最大化纠正问题的可用时间\n\
    \n- 最重要的测试是那些：\n  * 处理最严重的风险\n  * 覆盖关键功能\n  * 具有最佳故障检测概率\n\n- 测试中优先级排序的一些方法：\n\
    * 测试清单\n* 功能清单\n* 测试条件清单\n* 行为清单\n\n"
