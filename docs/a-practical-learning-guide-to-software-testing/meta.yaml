  md: '# About this Guide


    The Practical Guide to Learning Software Testing is divided into two sections:


    +   1. **Section 1** is the Practical Guide Notes to help learners prepare for
    the BCS/ISTQB Software Testing Foundation Exam in 12 Hours. This section is reinforced
    with practice questions and answers with explanations to prepare the learner for
    BCS/ISTQB Software Testing Foundation Exam. It is further supported by learning
    materials to be downloaded from an online virtual data-centre in the cloud, using
    the access code provided with this guide. The downloadable learning materials
    include audio explanations of each part of section 1, more practice questions
    for the BCS/ISTQB Software Testing Foundation Exam and other relevant materials
    to support the learning experience of the learner.


    +   2. **Section 2** is the Hands on Practical Guide to Software Testing, which
    is built on a real world case study to aid the development of testing skills required
    for the Five common activities in the Fundamental Test Process which are:

    1. Test Planning and Control

    2. Test Analysis and Design

    3. Test Implementation and Execution

    4. Evaluating exit criteria and reporting

    5. Test Closure


    This section is provided as learning materials to be downloaded from an online
    virtual data-centre in the cloud using the access code provided with this guide.
    The learning materials include defect management software, the application under
    test, templates and many samples of testing deliverables.'
