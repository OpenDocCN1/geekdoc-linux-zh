  mdcn: "\n\n## 脑筋急转弯 6\n\n测试设计技术是指：\n\n- A. 一种选择测试用例的过程\n- B. 一种确定预期输出的过程\n- C. 衡量软件质量的方法\n\
    - D. 一种在测试计划中描述必须执行的方法\n- E. 以上所有\n\n## 脑筋急转弯 5 的答案\n\nB. 是测试充分性的部分衡量\n\n## 脑筋急转弯\
    \ 6 的答案\n\nA. 一种选择测试用例的过程\n\n## 基于经验的技术\n\n- 在没有充分规格时有用\n- 使用用户和测试者的经验\n- 可以补充其他测试设计技术\n\
    - 示例包括：\n  1. 错误猜测（Error guessing）：\n    - 将测试者的技能、直觉与其对类似应用程序的经验相结合\n    - 缺点是其有效性不一\n\
    \    - 可以通过以下方式克服：\n      - 可能的错误列表\n      - 缺陷和失败列表\n  2. 探索性测试（Exploratory Testing）\n\
    \    - 在规格不充分或缺失且时间压力巨大的情况下，将测试者的经验与结构化方法相结合\n    - 使用时间盒（Time boxes）\n    - 使用测试目标（Test\
    \ Objectives）\n\n## 选择测试技术\n\n取决于关键选择因素：\n\n- 系统类型\n- 监管标准\n- 客户或合同需求\n- 风险水平\n\
