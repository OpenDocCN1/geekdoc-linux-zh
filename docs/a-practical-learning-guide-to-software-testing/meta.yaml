    # Characteristics of good Testing


    +   - Early Test Design: Apparent in the V Model

    - Each work product is tested: Apparent in the V Model

    - Each release is tested in the Iterative model

    - Testers are involved in reviewing requirements before they are released (signed
    off)


    # Front-loaded testing


    ![](img/52762cc20a1c71379bad2e432b5742a4_67_0.png)


    Questions often come out of this topic in the idea that all test activities should
    commence early as possible in the Development Life Cycle


    +   - It is a discipline that promotes the idea that all test activities should
    commence early as possible in the Development Life Cycle

    - This could mean doing early static tests (ofrequirements, designs or code),
    or dynamic test preparation as early as possible in the development cycle

    - The principle is to start early using static techniques which include Reviews,
    Walkthroughs and Inspections of documents during the definition stages

    - Start preparing Test Cases early: Early Test case preparation "tests" the document
    on which the cases are based

    - Preparing the user manual tests the requirements and design


    # Brainteaser 4


