- md: "\n- Many compilers may have static analysis facilities available for developers\
    \ if they use them\n- There are also a number of stand-alone static analysis tools\
    \ for different computer programming languages\n- Like a compiler, the static\
    \ analysis tool analyses the code without executing it, and can alert the developer\
    \ to various things such as unreachable code, undeclared variables, and\n- Static\
    \ Analysis Tools are used for measuring complexity of a code (static metrics)\n\
    - Static Analysis Tools can be used to measure the following complexities within\
    \ a code:\n\n### Cyclomatic Complexity\n\n- Related to the code, this refers to\
    \ the total number of decisions in a program or control flow graph.\n- Working\
    \ from code, refers to the total number of IF's and any loop constructs (DO, FOR,\
    \ WHILE, REPEAT).\n- Cyclomatic Complexity reflects to some extent how complex\
    \ code fragment is but does not show the total complexity (see Nesting Levels).\n\
    \n### Data flow analysis\n\n- Study of program variables\n- A variable is basically\
    \ a location in the computer's memory that has a name so that the programmer can\
    \ refer to it more conveniently in the source code. When a value is put into this\
    \ location, we say that the variable is \"defined\". When that value is accessed,\
    \ we say that it is \"used\"\n- For example, in the statement \"x = y + z\", the\
    \ variables y and z are used because the values that they contain are being accessed\
    \ and added then put into the memory location called \"x\", so x is defined\n\
    - Static analysis tools can perform a number of simple checks.\n- E.g. ensure\
    \ that every variable is defined before it is used.\n- The value that it may contain\
    \ be different every time the program is executed\n- and in any case it is unlikely\
    \ to contain the correct value (a data flow fault)\n- Static analysis tool can\
    \ ensure that every time a variable is defined it is used somewhere later in the\
    \ program. If it isn't, then why was it defined in the first place?\n- This is\
    \ known as a data flow anomaly although can be a perfectly harmless fault, it\
    \ can also indicate something more serious is at fault.\n\n### Lines of code (LOC\
    \ or KLOC for 1000's of LOC)\n\n- Is a measure of the size of a code module\n\
    - Fan-in is related to the number of modules that call (in to) a given module.\n\
    - Modules with high fan-in are found at the bottom of hierarchies, or in libraries\
    \ where they are frequently called.\n- Modules with high Fan-out are typically\
    \ at the top of hierarchies, because they call out to many modules (e.g. the main\
    \ menu).\n- Any module with both high fan-in and high fan-out probably needs re-designing.\n\
    \n### Fan-Out/Fan-In\n\n![](img/52762cc20a1c71379bad2e432b5742a4_80_0.png)\n\n\
    Figure 15: Fan-out/ Fan-in\n\n### 4. Nesting levels\n\n- Relate to how deeply\
    \ nested IF statements are within other IF statements\n- This is a good metric\
    \ to have in addition to Cyclomatic Complexity, since highly nested code is harder\
    \ to understand than linear code, Cyclomatic Complexity does not distinguish them\n\
    - The figure below illustrates deeply nested IF statements. Each IF statement\
    \ is colour coded\n\n### Nesting levels: Nested If statement example\n\n```\n\
    BEGIN\nDim Grade Integer /*declaring variable GRADE as number type*/\nGrade =\
    \ 84 /*assigning an initial value to variable GRADE*/\nif Grade < 101 then /*1st\
    \ if statement*/\nif Grade = 100 then /*2nd if statement*/\nresponse: Write \"\
    Super! You have 1000!!\"\nend if /*ends the 2nd if statement*/\nif Grade < 100\
    \ then /*3rd if statement*/\nif Grade > 90 then /*4th if statement*/\nresponse:\
    \ Write \"Excellent work! Your score is between 95-99!!!\"\nelse\nresponse: Write\
    \ \"Your score is below 90!\"\nend if /*ends the 4th if statement*/\nelse\nend\
    \ if /*ends the 3rd if statement*/\nresponse: Write \"Terrific! You have over\
    \ 100%!!\"\nend if /*ends the 1st if statement*/\nEND\n```\n\nFigure 16: Nesting\
    \ Levels\n\n### 5. Number of function calls\n\n- A Function Call occurs when an\
    \ expression passes control and arguments (if it exists) to a function\n- When\
    \ a function within a code is called too many times it may cause a number of issues:\n\
    \  - Deep or infinite recursion: when a function calls itself so many times that\
    \ the space needed to store the variables and information associated with each\
    \ call is more than can fit on the stack\n  - This can cause Stack Overflows (where\
    \ computer program tries to use more space than the stack has available). The\
    \ call stack is a buffer that stores requests that to be handled\n  - Stack overflow\
    \ can cause Program Crash\n  - This can Degrade Performance of the code\n\nThe\
    \ diagram below illustrates excessive function calls made to some functions in\
    \ a program\n\n![](img/52762cc20a1c71379bad2e432b5742a4_82_0.png)\n\nFigure 17:\
    \ Number of Function Calls\n\n### 6. Control flow analysis\n\n- Control flow analysis\
    \ can find\n  - Infinite loops\n  - Inaccessible code (unreachable code)\n- However,\
    \ not all of the things found are necessarily faults\n  - E.g. Defensive programming\
    \ may result in code that is technically unreachable\n- The following piece of\
    \ code shows an example of unreachable code\n\n```\nFunction add (a, b) – function\
    \ is to add a to b\n{\n  return a + b;\n  - it will return a value which is the\
    \ sum of a and b\n  int c = a * b;\n  - there's no logic to execute this part\
    \ of the code so it will be\n  unreachable\n}\n```\n\n### Benefits of Static Analysis\n\
    \n- Early detection of defects before test execution\n- Early warning about suspicious\
    \ aspects of code or design\n  - High complexity measure\n  - Code too complex\
    \ are prone to errors\n- Identify defects not easily found by dynamic testing\n\
