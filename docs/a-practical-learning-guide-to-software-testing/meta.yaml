    # # Section1: Practical Guide Notes for the BCS/ISTQB Software Testing Foundation
    Exam


    ## About Section 1


    +   * Divided into six parts

    * Part One covers Chapter One of the ISTQB Syllabus

    * Part Two covers Chapter Two of the ISTQB Syllabus

    * Part Three covers Chapter Three of the ISTQB Syllabus

    * Part Four covers Chapter Four of the ISTQB Syllabus

    * Part Five covers Chapter Five of the ISTQB Syllabus

    * Part Six covers Chapter Six of the ISTQB Syllabus

    * This Section may be used alongside the BCS recommended textbook for self studying
    learners or used with the downloadable learning materials provided in section
    2

    * Each Part of this Section is enriched with practice questions to prepare you
    for the ISTQB foundation exam

    * In certain Parts of this Section the reader may find hotspots which are meant
    to emphasize the significance of that Part to their learning experience

    * Each Part is also supported with audio explanation [1]

    * You need an average of 2 hours to complete each Part, totalling 12 hours for
    the Six Parts

    * Please note that depending on the rate of comprehension of the individual, you
    may spend less or more than 2 hours per Part!'
- md: "\n# Part One: The Principles of Testing\n\n![](img/52762cc20a1c71379bad2e432b5742a4_40_0.png)\n\
    \n# Topics Covered in Part One:\n\n- What is testing?\n- Why is Testing Necessary?\n\
    - Testing Terminology\n- The General Testing Principles\n- The Fundamental Test\
    \ Process\n- Psychology of Testing\n- Economics of Testing\n\n# Learning Outcomes\
    \ for Part One\n\nLearner will be able to:\n\n- understand why testing is necessary\n\
    - understand basic testing terminology\n- define error, fault and failure\n- appreciate\
    \ why errors occur and how costly they can be\n- understand that you cannot test\
    \ everything and testing is therefore a management process\n- understand the fundamental\
    \ test process\n- understand that developers and testers have different mindsets\n\
    - learn how to communicate effectively with both developers and testers\n- find\
    \ out why you cannot test your own work\n- understand the need for retesting\n\
    - understand the need for regression testing\n- understand the importance of specifying\
    \ your expected results in advance\n- understand how and why tests should be prioritised\n\
    \n# What is Software Testing?\n\n“A process implemented in a controlled environment\
    \ and which includes a set of activities which often require the use of tools\
    \ and techniques to achieve multiple objectives such as risk measurement and risk\
    \ reduction which are achievable by detecting faults and ensuring that faults\
    \ are removed when possible.” - Sam Fatiregun\n\n![](img/52762cc20a1c71379bad2e432b5742a4_42_0.png)\n\
    \nFigure 1: What is Software Testing?\n\n# Termologies in Software Testing\n\n\
    The use of terminologies in Software Testing across organisations is a recurrent\
    \ problem because:\n\n- Most organisations have their internal terminology for\
    \ testing\n- This makes discussions between practitioners from different organisations\
    \ problematic\n- The formal definitions from standards sometimes overlap or conflict\
    \ and are patchily adopted\n\nTo ensure clarity and consistency across all training\
    \ organisations, the ISEB (Information Systems Examinations Board, part of the\
    \ British Computer Society) scheme uses the BS7925-1 Standard Glossary of Testing\
    \ Terms.\n\n# BS7925-1\n\n- BS7925-1 is the Standard Glossary of Testing Terms\n\
    - This standard was a by-product from the British Computer Society Specialist\
    \ Interest Group in Software Testing (BCS SIGIST)\n- Resulted in the Software\
    \ Component Test Standard - BS7925-2\n- BS7925-1 glossary of terms covers component\
    \ testing more thoroughly than the test activities, but is consistent with the\
    \ terms defined in the other standards\n- Sample of the glossary is provided in\
    \ the downloadable learning materials provided in section 2\n\n# Objectives of\
    \ a Test\n\n- a successful test is the one that detects a fault!\n- Fault Detection\
    \ is the major objective for testing but also very important is fault removal\n\
    - Testers to ensure faults are removed from the software when possible, by a competent\
    \ person (often the developer/programmer of the code)\n- Other objectives of testing\
    \ are:\n  - Risk Measurement\n  - Risk Reduction\n  - Confidence Building\n\n\
    ![](img/52762cc20a1c71379bad2e432b5742a4_43_0.png)\n\nFigure 2: Testing – a means\
    \ of Risk Measurement and Reduction\n\n# Why do we Test?\n\n- Existence of faults\
    \ in software is unavoidable\n- Software can never be made perfect\n- Have you\
    \ noticed any unexpected behaviour in any operating system you have used before?\n\
    - We must test software to find as many faults as we can to ensure that a high\
    \ quality product with a minimum of faults is delivered\n- Testers need to know\
    \ how faults occur because it is our business to detect these faults\n- Only by\
    \ understanding how faults occur, can we prepare effective strategies to detect\
    \ them\n\n# Contributors to Software Failure\n\n- Pressures such as deadlines\
    \ may lead to mistakes to be made in:\n  - Planning – project manager\n  - Specifications\
    \ – Business Analyst\n  - Coding - Programmer\n  - Testing – Test analyst\n- Environmental\
    \ conditions – e.g. radiation\n- Also complexity of the application\n- Failure\
    \ caused by any of the above can be reduced, rectified or avoided by testing\n\
    - So Poor Testing is the major cause of software failure\n\n# General Testing\
    \ Principles\n\n> Hot Spot - Questions often come out of this in the foundation\
    \ does not show software is bug free\n\n1. Testing shows presence of bugs but\
    \ does not show software is bug free\n2. Exhaustive testing is impossible. On\
    \ a large project it is not practically to test all combinations of inputs (data)\
    \ and preconditions.\n3. Early Testing is important. Testers do not need to wait\
    \ until software is available before commencing activities.\n4. Defect clustering.\
    \ Spread of defect in software is not uniform.\n5. Running the same test continually\
    \ will not find new defects. Regression tests should change to reflect change\
    \ in business needs.\n6. Testing is context dependent. The Test Approach, tools\
    \ and techniques that are used on a particular test project will not be the same\
    \ as those used on a different test project. For example how you test a website\
    \ application will be different from that of a database application.\n7. Absence\
    \ of errors fallacy. The fact that no errors were outstanding does not imply fitness\
    \ for go live. Users' expectations should be met.\n\n# Business tests for 100%\
    \ coverage\n\n![](img/52762cc20a1c71379bad2e432b5742a4_45_0.png)\n\n- Black dots\
    \ - Business Functionalities of an Application Under Test (AUT)\n- Red wire mesh\
    \ - Business Tests\n- Can 100% Coverage of the business functionalities be achieved\n\
    - Yes ! Testers must always design tests to ensure 100% coverage of business functionalities\
    \ that are in scope of testing for an AUT.\n\nFigure 3: Business tests for 100%\
    \ coverage\n\n# Business Critical Tests for 100% coverage\n\n![](img/52762cc20a1c71379bad2e432b5742a4_45_1.png)\n\
    \n- Black dots - Business Functionalities of a Large Complex System (LCS)\n- Red\
    \ wire mesh - Business Tests\n- Repeated Red wire mesh - Multiple passes of Business\
    \ Critical Tests\n- Is exhaustive testing possible in a large and complex system?\n\
    - No! Testers can run multiple passes of Business Critical Tests on high risk\
    \ areas of a Large Complex System.\n\nFigure 4: Business Critical Tests for 100%\
    \ coverage\n\n# Bugs not found or not fixed\n\n![](img/52762cc20a1c71379bad2e432b5742a4_46_0.png)\n\
    \n- Black dots - not found or fixed\n- Can the software be deemed reliable?\n\
    - Yes ! it is possible if the software fits the purpose for which it was built.\
    \ This means the not found or fixed do not impede the functions that the users\
    \ require.\n\nFigure 5: Bugs not found or fixed\n\n# Error, Fault and Failure\n\
    \n# Error\n\n- Error is a human action producing an incorrect result.\n- When\
    \ programmers make errors they introduce faults to program code.\n- Errors are\
    \ not just accidents or mistakes that can be solved by \"just being careful\"\n\
    - Errors are not an act of incompetence\n- Errors are inevitable in a complex\
    \ activity\n\n# Fault\n\n- A manifestation of human error in software\n- Also\
    \ known as a defect or bug\n- In the United States of America, faults are more\
    \ commonly known as defects\n- Bugs are a universally accepted name for faults\n\
    - Bugs and faults are used interchangeably in this training course\n- We normally\
    \ think of programmers when we talk about faults and human error\n- However, faults\
    \ can also be created in documents by:\n    * managers working on project plans\n\
    \    * analysts working on requirements\n    * designers working on designs or\n\
    \    * testers working on test plans too\n- Human error causes faults in any project\
    \ deliverable (requirements, design or code)\n- However only faults in software\
    \ cause software to fail. This is the most familiar situation\n- Faults are static\n\
    - Software faults are static (immobile)\n- When we test software, it is easy to\
    \ believe that the faults in the software move\n- Once injected into the software,\
    \ they will remain until exposed by a test and fixed\n- They are discovered either\
    \ by inspecting code (reading the code) or by inferring their existence from software\
    \ failures (executing the software)\n- When the software fails we can infer the\
    \ existence of a fault\n\n# Failure\n\n- A deviation of the software from its\
    \ expected delivery or service\n- A failure occurs when software does the 'wrong'\
    \ thing\n- Most of the time software does the right thing\n- Software faults cause\
    \ software failures when the program is executed with a set of inputs that expose\
    \ the fault\n"
  mdcn: "\n\n# 第一部分：测试原理\n\n![](img/52762cc20a1c71379bad2e432b5742a4_40_0.png)\n\n\
    # 第一部分涵盖主题：\n\n- 什么是测试？\n- 为什么测试是必要的？\n- 测试术语\n- 通用测试原则\n- 基础测试流程\n- 测试心理学\n-\
    \ 测试经济学\n\n# 第一部分学习成果\n\n学习者将能够：\n\n- 理解为什么测试是必要的\n- 理解基础测试术语\n- 定义错误 (error)、故障\
    \ (fault) 和失效 (failure)\n- 理解错误为何会产生以及它们的成本可能有多高\n- 理解你无法测试一切，因此测试是一个管理过程\n- 理解基础测试流程\n\
    - 理解开发人员和测试人员具有不同的思维\n- 学习如何与开发人员和测试人员进行有效沟通\n- 发现为什么你不能测试自己的工作\n- 理解重测的必要性\n\
    - 理解回归测试的必要性\n- 理解提前指定预期结果的重要性\n- 理解以及为什么要对测试进行优先级排序\n\n# 什么是软件测试？\n\n“一种在受控环境中实施的过程，它包含了一系列活动，这些活动通常需要使用工具和技术来达成多个目标，例如风险衡量和风险降低，这些目标可以通过检测故障并确保在尽可能移除故障来实现。”\
    \ - Sam Fatiregun\n\n![](img/52762cc20a1c71379bad2e432b5742a4_42_0.png)\n\n图 1：什么是软件测试？\n\
    \n# 软件测试中的术语\n\n在不同组织中使用软件测试术语是一个反复出现的问题，因为：\n\n- 大多数组织都有自己内部的测试术语\n- 这使得不同组织从业人员之间的讨论变得困难\n\
    - 标准中的正式定义有时会重叠或冲突，且采用得并不统一\n\n为了确保所有培训机构之间的清晰性和一致性，ISEB（信息系统考试委员会，英国计算机学会的组成）方案使用了\
    \ BS7925-1 标准测试术语表。\n\n# BS7925-1\n\n- BS7925-1 是测试术语的标准词表\n- 该标准是英国计算机学会软件测试专家兴趣小组\
    \ (BCS SIGIST) 的产物\n- 产生了软件组件测试标准 - BS7925-2\n- BS7925-1 术语表对组件测试的覆盖比测试活动更彻底，但与其他标准中定义的术语一致\n\
    - 术语示例可在第 2 节提供的下载学习材料中\n\n# 测试的目标\n\n- 成功的测试是检测出故障的测试！\n- 故障检测是测试的主要目标，但故障消除也非常重要\n\
    - 测试人员要确保尽可能通过专业人员（通常是代码的开发人员/程序员）从软件中移除故障\n- 测试的其他目标是：\n  - 风险衡量\n  - 风险降低\n\
    \  - 建立信心\n\n![](img/52762cc20a1c71379bad2e432b5742a4_43_0.png)\n\n图 2：测试——风险衡量和降低的手段\n\
    \n# 我们为什么要测试？\n\n- 软件中故障的存在是不可避免的\n- 软件永远无法变得完美\n- 你在之前使用的任何操作系统中发现过异常行为吗？\n-\
    \ 我们必须测试软件以发现尽可能故障，以确保交付故障最少的高质量产品\n- 测试人员需要知道故障是如何发生的，因为检测这些故障是我们的工作\n- 只有通过理解故障是如何发生的，我们才能准备有效的策略来检测它们\n\
    \n# 软件失败的贡献因素\n\n- 截止日期等压力可能导致以下方面出现错误：\n  - 计划 – 项目经理\n  - 规范 – 业务分析师\n  - 编码\
    \ - 程序员\n  - 测试 – 测试分析师\n- 环境条件 – 例如辐射\n- 还有应用的复杂性\n- 由上述任何因素故障可以通过测试来减少、纠正或避免\n\
    - 因此，糟糕的测试是软件失败的主要原因\n\n# 通用测试原则\n\n> 热点 - 基础考试中经常出现这个问题：测试并不表明软件没有 bug\n\n1.\
    \ 测试显示了 bug的存在，但不能证明软件没有 bug。\n2. 穷尽测试是不可能的。在大型项目中，实践上无法测试所有输入（数据）和先决条件的组合。\n\
    3. 早期测试非常重要。测试人员不需要等到软件可用后才开始活动。\n4. 缺陷聚集。缺陷在软件中的分布不是均匀的。\n5. 持续运行相同的测试无法发现新缺陷。回归测试应该随业务需求的变化而改变。\n\
    6. 测试取决于上下文。在特定测试项目使用的测试方法、工具和技术将与另一个测试项目上使用的不同。例如，你测试网站应用程序的方法与测试数据库应用程序的方法不同。\n\
    7. 错误缺失谬误。没有遗留错误的事实并不意味着可以上线。应该满足用户的预期。\n\n# 100% 覆盖的业务测试\n\n![](img/52762cc20a1c71379bad2e432b5742a4_45_0.png)\n\
    \n- 黑点 - 被测试应用程序 (AUT) 的业务功能\n- 红线网格 - 业务测试\n- 能否实现业务功能的 100% 覆盖\n- 可以！测试人员必须始终设计测试，以确保对测试范围内的业务功能实现\
    \ 100% 覆盖。\n\n图 3：100% 覆盖的业务测试\n\n# 100% 覆盖的业务关键测试\n\n![](img/52762cc20a1c71379bad2e432b5742a4_45_1.png)\n\
    \n- 黑点 - 大型大型复杂系统 (LCS) 的业务功能\n- 红线网格 - 业务测试\n- 重复的红线网格 - 业务关键测试的多次通过\n- 在大型复杂系统中可能的穷尽测试吗？\n\
    - 不可能！测试人员可以对高风险区域运行多次业务关键测试。\n\n图 4：100% 覆盖的业务关键测试\n\n# 未发现或未修复的 bug\n\n![](img/52762cc20a1c71379bad2e432b5742a4_46_0.png)\n\
    \n- 黑点 - 未发现或未修复\n- 软件被认为是可靠的吗？\n- 可以！如果软件符合用途。这意味着未发现或未修复的故障没有阻碍功能。\n\n图 5：未发现或未修复的\
    \ bug\n\n# 错误、故障和失效\n\n# 错误\n\n- 错误是产生错误结果的行为。\n- 当程序员犯错误时，他们在代码中引入了故障。\n- 错误不是通过“小心”就能解决的事故或失误。\n\
    - 错误不是无能力的表现。\n- 错误在复杂活动中是不可避免的\n\n# 故障\n\n- 软件中人为错误的体现\n- 也称为缺陷 (defect) 或 bug\n\
    - 在美国，故障更常被称为缺陷 (defect)\n- Bug 是故障公认的名称\n- 在本课程中，Bug 和故障是互换使用的\n- 当我们谈论故障和人为错误时，通常指的是程序员\n\
    - 然而，故障也可以由以下人员在文档中：\n    * 处理项目计划的经理\n    * 处理需求的分析师\n    * 处理设计的规划师\n    * 处理测试计划的测试人员\n\
    - 人为错误会导致任何项目交付物（需求、设计或代码）产生故障\n- 但只有软件中的故障会导致软件失效。这是最常见的情况\n- 故障是静态的\n- 软件故障是静态的（不移动）\n\
    - 当我们测试软件时，很容易认为软件中的故障是移动的\n- 一旦注入软件，它们将一直存在直到被测试暴露并修复\n- 它们可以通过检查代码（读取代码）或从软件失效中推断存在（执行软件）来发现\n\
    - 当软件失效时，我们可以推断出故障的存在\n\n# 失效\n\n- 软件与其预期交付或服务的偏离\n- 失效发生在软件执行了“错误”的事情时\n- 大多数时候软件执行的是正确的事情\n\
    - 当程序执行一组暴露故障的输入时，软件故障会导致软件失效\n\n"
