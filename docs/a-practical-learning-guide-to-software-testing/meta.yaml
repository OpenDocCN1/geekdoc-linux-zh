  md: "# White Box, Glass box or Structure-based Techniques\n\n+   - It is structure-based\
    \ because the internal structure of software (i.e. code) is used to design Test\
    \ Cases\n- The code must be visible to testers\n- So understanding of internals\
    \ (code) is required\n- Specification is still used to determine expected results,\
    \ as for black-box\n\n# Code\n\n+   - Pseudo code at foundation level\n    - Limited\
    \ language\n    - Simple structure\n    - Helps to create all the main control\
    \ structures\n- Non executable\n    - At the start of the code\n    - No action\n\
    \    - Declarative and preparative\n- Executable\n    - Instructs the computer\
    \ to take action\n- starts with BEGIN......ends with END when combined with Non\
    \ Executable\n\n# Code Structure\n\n+   1. Sequence\n    - Statement executed\
    \ one after the other as they appear on page\n2. Selection\n    - Computer decides\
    \ if a condition is true or false (Boolean) then takes a route based on the outcome\n\
    \    - Involves decisions\n3. Iterative\n    - Repeat exercising of a chunk of\
    \ code\n    - Number of iteration depends on the value of a condition\n\n# Sequence\n\
    \nExample:\n\n+   1. Read X\n2. Read Y\n3. Z=X*Y\n\nNote: We have 3 executable\
    \ statements here; 1 is done before 2, then 3. No Non executable statement. Absence\
    \ of BEGIN and END is common practice in ISEB be aware!"
