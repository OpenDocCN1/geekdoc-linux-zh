    # Steps of Test Design: Test Condition, Test Cases and Test Procedures


    The three main steps of test design


    -   1. **Test Condition** - is an item or event of a component or system that
    could be verified by one or more Test Cases e.g. a function, feature, attribute
    etc

    2. **Test Case** - is a set of input values, execution preconditions, expected
    results and execution post conditions, developed for a particular objective or
    verify test condition, such as to exercise a particular program or to verify compliance
    with a specific document

    3. **Test Procedure Specification** - also known as Manual Test Script is a sequence
    of actions for the execution of a test


    # Test Coverage


    -   * Answers how much testing is done

    * Quantitative measure of the quality of testing

    * Estimates how much testing needs to be done

    * Can be applied to Specification-based Techniques known as Black Box Testing
    to measure how much of the functionality has been tested

    * Can be applied to Structure-based Techniques known as White Box Testing to measure
    how much of the code has been tested

    * May be part of completion criteria of a test plan


