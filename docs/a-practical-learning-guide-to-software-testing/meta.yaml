  - "[PAGE 128]\n\n+   - Guides test planning, specification and execution\n- Determines\
    \ the test techniques to be used\n- Prioritise testing\n- Training needed to reduce\
    \ risk\n\n# Test Organisation and Independence\n\n+   - Testing independence is\
    \ essential but challenging:\n    - Software tested by someone other than the\
    \ creator\n    - The greater level of independence the greater of errors in testing\
    \ resulting from unfamiliarity with the application\n\n| Developer | Low |\n|---|---|\n\
    | Independent testers ceded with the developers | |\n| Independent Permanent Test\
    \ team within organisation | |\n| Independent test team provided by the operational\
    \ business units | |\n| Specialist testers such as usability testers, security\
    \ testers, performance testers etc. | |\n| Outsourced Testers or test team such\
    \ as contractors or Independent testing organisations | High |\n\nTable 16: Level\
    \ of Testing Independence across Organisation Roles\n\n# Independent Testing Benefits\
    \ Vs Drawbacks\n\n| Benefits | Drawbacks |\n|---|---|\n| Tester may find defects\
    \ that the author would not find | Testers may rely solely on specifications that\
    \ are rarely up to date base of testing |\n| Tester is unbiased | Tester may be\
    \ as bottleneck; independent test execution is normally the last stage and usually\
    \ flagged by delays |\n| Tester can see what has been built rather than what the\
    \ developer thought had been built | Developers may rely on the independent test\
    \ team to find bugs and as a result may lose sense of responsibility for quality\
    \ (e. g. poor unit testing) |\n| Tester makes no assumption regarding quality\
    \ | Isolation from development team (in case of total independence) may create\
    \ a 'them and us' attitude. This can hinder communication\n\nTable 17: Independent\
    \ Testing Benefits Vs Drawbacks"
  - '[PAGE 129]


    # Roles within the Test Team


    +   ISEB/ISTQB syllabus defines two roles

    1. The Test Leader also known as Test Manager or Test Coordinator

    2. Tester also known as Test Analyst or Test Executor

    nPlease note other roles may exist within different organisations

    Also note that ISEB requires you to distinguish between a role and task; a job
    and a role


    # Job Vs Role Vs Task


    +   1 Job to Many Roles: You can have a job as Test Coordinator but you fulfil
    multiple roles e.g. as a Test Leader and as a Tester

    1 Role to Many Tasks: In your role as Test Leader for example you will perform
    multiple tasks such as coordinating the development of Test Strategy and Setting
    up Test Environment


    ![](img/52762cc20a1c71379bad2e432b5742a4_129_0.png)


    # Tasks of a Test Leader


    +   Coordinating development of Test Strategy and plan with project managers and
    others

    Writing or reviewing test strategies (for the project) and test policies (for
    the organisation)

    Develop delivery schedules

    Planning the development of required tests

    - Test Approach

    - Test cycles

    - Estimation

    - Cost of testing

    - Resources

    Managing specification, preparation, implementation and execution of testing'
