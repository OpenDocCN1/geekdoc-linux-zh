    test cases. They can create inputs and expected result (which are parts of a case)
    |

    | iii) Simulation of the environment in which a component is run. | t) Test harness.
    Can be used to simulate services or functionality that are not available. Test
    environments are external to the component of the software that needs to be tested
    in a specific test environment that is unavailable (e.g. may be tested using a
    test harness which is built as a substitute to the environment |

    | iv) Analysis of test metrics. | p) Test management: to prepare progress reports
    based on metrics such as tests executed and passed; incidents raised, defects
    fixed and outstanding. This information can be used to monitor the testing process
    and decide what actions to take (test control). |


