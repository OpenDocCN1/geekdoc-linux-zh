    +   * Many compilers may have static analysis facilities available for developers
    if they use them

    * There are also a number of stand-alone static analysis tools for different computer
    programming languages

    * Like a compiler, the static analysis tool analyses the code without executing
    it, and can alert the developer to various things such as unreachable code, undeclared
    variables, and

    * Static Analysis Tools are used for measuring complexity of a code (static metrics)

    * Static Analysis Tools can be used to measure the following complexities within
    a code:


    # Cyclomatic Complexity


    +   * Related to the code, this refers to the total number of decisions in a program
    or control flow graph.

    * Working from code, refers to the total number of IF''s and any loop constructs
    (DO, FOR, WHILE, REPEAT).

    * Cyclomatic Complexity reflects to some extent how complex code fragment is but
    does not show the total complexity (see Nesting Levels).


    # Data flow analysis


    +   * Study of program variables

    * A variable is basically a location in the computer''s memory that has a name
    so that the programmer can refer to it more conveniently in the source code. When
    a value is put into this location, we say that the variable is "defined". When
    that value is accessed, we say that it is "used"

    * For example, in the statement "x = y + z", the variables y and z are used because
    the values that they contain are being accessed and added then put into the memory
    location called "x", so x is defined

    * Static analysis tools can perform a number of simple checks.

    * E.g. ensure that every variable is defined before it is used.

    * The value that it may contain be different every time the program is executed

    * and in any case it is unlikely to contain the correct value (a data flow fault)

    * Static analysis tool can ensure that every time a variable is defined it is
    used somewhere later in the program. If it isn''t, then why was it defined in
    the first place?

    * This is known as a data flow anomaly although can be a perfectly harmless fault,
    it can also indicate something more serious is at fault.


    # Lines of code (LOC or KLOC for 1000''s of LOC)


    +   * Is a measure of the size of a code module'
