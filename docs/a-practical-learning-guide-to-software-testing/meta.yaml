- md: "\n- Poor integration\n- Test drivers - mainstream protocols only little support\
    \ for proprietary message formats.\n\n## Tool Selection Advice\n\n- Try out the\
    \ tool on a small pilot project first\n  - Risks of problems encountered much\
    \ lower\n  - helps to iron out process problems\n  - Start by defining a business\
    \ case for the pilot project such as:\n    - objectives for the tool, e.g. lessons\
    \ to be learned\n    - implementation concerns\n\n## Key Factors in the Selection\
    \ and Implementation of a Tool\n\n- Selling the concept\n- People will not change\
