  mdcn: "\n\n## A 5.11：答案是 C。配置管理器\n\n**解释：** 此题测试了你对测试人员角色的理解。考虑到答案选项，我们可以识别出哪些角色不太可能被考虑用于测试角色，每个角色可以在\
    \ V 模型测试方法论的不同的测试阶段上运行。\n\n- 系统操作员：可以是执行用户验收测试的终端用户。\n- 开发人员：将执行单元测试。\n- 配置管理器：在项目中实施配置管理策略和标准（在\
