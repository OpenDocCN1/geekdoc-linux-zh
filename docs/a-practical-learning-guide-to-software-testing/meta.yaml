    ## About ISTQB Certified Tester Foundation Level


    The Foundation Level is generalised by:

    - multiple-choice questions

    - a pass mark of 65%

    - a duration of 60 minutes


    Exam questions are distributed across K-levels:


    | K-level | Number of questions |

    |---|---|

    | K1 | 20 |

    | K2 | 12 |

    | K3 | 8 |

    | Total | 40 |


    Exam questions are distributed across Syllabus chapters:


    | Chapter | Number of questions |

    |---|---|

    | Ch. 1 | 7 |

    | Ch. 2 | 6 |

    | Ch. 3 | 3 |

    | Ch. 4 | 12 |

    | Ch. 5 | 8 |

    | Ch. 6 | 4 |

    | Total | 40 |


    ## About this Guide


    The Practical Guide to Learning Testing is divided into two sections:


    1. **Section 1** is the Practical Guide Notes to help learners prepare for ISTQB
    Testing Foundation Exam in 12 Hours. This section is reinforced with practice
    questions and answers to prepare the learner. It is further supported by learning
    materials to be downloaded from an virtual data-centre in the cloud using the
    access code provided with this guide.


    2. **Section 2** is the Hands on Practical Guide to Testing, which is built on
    a real world case study to aid the development of testing skills required for
    the Five common activities:

    - Test Planning and Control

    - Test Analysis and Design

    - Test Implementation and Execution

    - Evaluating exit criteria and reporting

    - Test Closure


    ## Section 1: Practical Guide Notes for the BCS/ISTQB Testing Foundation Exam


    ### About Section 1


    - Divided into six parts

    - Part One covers Chapter One of the ISTQB Syllabus

    - Part Two covers Chapter Two of the ISTQB Syllabus

    - Part Three covers Chapter Three of the ISTQB Syllabus

    - Part Four covers Chapter Four of the ISTQB Syllabus

    - Part Five covers Chapter Five of the ISTQB Syllabus

    - Part Six covers Chapter Six of the ISTQB Syllabus

    - This Section may be used alongside the BCS recommended textbook for self studying
    learners or used with the downloadable learning materials provided in section
    2

    - Each Part of this Section is enriched with practice questions to prepare you
    for the ISTQB foundation exam

    - In certain Parts of this Section the reader may find hotspots which are meant
    to emphasize the significance of that Part to their learning experience

    - Each Part is also supported with audio explanation [1]

    - You need an average of 2 hours to complete each Part, totalling 12 hours for
    the Six Parts

    - Please note that depending on the rate of comprehension of the individual, you
    may spend less or more than 2 hours per Part

    '
