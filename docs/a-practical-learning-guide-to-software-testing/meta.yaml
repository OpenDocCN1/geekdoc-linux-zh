  md: '# Preface


    Many books focus on the theoretical concepts of Software Testing with little or
    no inclusion of the practical context which is equally needed to prepare the learner
    for the demands of this field in the workplace. This guide is an attempt to fill
    this gap by complementing the theoretical concepts of Software Testing with challenging
    practical context based on a real world case study.


    In this section the learner is presented with easy to read bulleted notes focused
    on key points of the theoretical concepts. The notes are supplemented with relevant
    tables, figures, brainteasers, questions & answers and online audio explanations
    to enrich the knowledge of the learner.


    In section two the learner is exposed to a practical real world case study supported
    with samples & templates of test deliverables and software applications that will
    enable the learner to have detailed hands-on practical experience similar to that
    of the workplace.


    To make this guide as accessible and continuously relevant as possible, it is
    available in both print and electronic formats. To download the online supporting
    materials, each guide owner will be provided with a unique access code that they
    must send to the email access link will be sent to the guide owner''s email address
    (within 24 hours) for access to download the online supporting materials. From
    time to time any updates to the guide will be made available on the online portal
    and the guide owner will be informed of such via their email address.


    It is anticipated that this guide will be a useful resource for learners with
    little or no background in Software Testing, to develop the skills necessary for
    them to operate as competent Software Testing Professionals in any workplace.


    # Olusola Samuel Fatiregun MBBS CITP


    ![](img/52762cc20a1c71379bad2e432b5742a4_6_0.png)'
