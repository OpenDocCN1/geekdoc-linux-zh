  - '[PAGE 42]


    # What is Software Testing?


    “A process implemented in a controlled environment and which includes a set of
    activities which often require the use of tools and techniques to achieve multiple
    objectives such as risk measurement and risk reduction which are achievable by
    detecting faults and ensuring that faults are removed when possible.” - Sam Fatiregun


    ![](img/52762cc20a1c71379bad2e432b5742a4_42_0.png)


    Figure 1: What is Software Testing?


    # Termologies in Software Testing


    The use of terminologies in Software Testing across organisations is a recurrent
    problem because:


    +   * Most organisations have their internal terminology for testing

    * This makes discussions between practitioners from different organisations problematic

    * The formal definitions from standards sometimes overlap or conflict and are
    patchily adopted


    To ensure clarity and consistency across all training organisations, the ISEB
    (Information Systems Examinations Board, part of the British Computer Society)
    scheme uses the BS7925-1 Standard Glossary of Testing Terms.'
  - "[PAGE 43]\n\n# BS7925-1\n\n+   * BS7925-1 is the Standard Glossary of Testing\
    \ Terms*\n* This standard was a by-product from the British Computer Society Specialist\
    \ Interest Group in Software Testing (BCS SIGIST)\n* Resulted in the Software\
    \ Component Test Standard - BS7925-2\n* BS7925-1 glossary of terms covers component\
    \ testing more thoroughly than the test activities, but is consistent with the\
    \ terms defined in the other standards\n* Sample of the glossary is provided in\
    \ the downloadable learning materials provided in section 2\n\n# Objectives of\
    \ a Test\n\n+   * a successful test is the one that detects a fault!\n* Fault\
    \ Detection is the major objective for testing but also very important is fault\
    \ removal\n* Testers to ensure faults are removed from the software when possible,\
    \ by a competent person (often the developer/programmer of the code)\n* Other\
    \ objectives of testing are:\n  * Risk Measurement\n  * Risk Reduction\n  * Confidence\
    \ Building\n\n![](img/52762cc20a1c71379bad2e432b5742a4_43_0.png)\n\nFigure 2:\
    \ Testing – a means of Risk Measurement and Reduction"
  - "[PAGE 44]\n\n# Why do we Test?\n\n+   - Existence of faults in software is unavoidable\n\
    - Software can never be made perfect\n- Have you noticed any unexpected behaviour\
    \ in any operating system you have used before?\n- We must test software to find\
    \ as many faults as we can to ensure that a high quality product with a minimum\
    \ of faults is delivered\n- Testers need to know how faults occur because it is\
    \ our business to detect these faults\n- Only by understanding how faults occur,\
    \ can we prepare effective strategies to detect them\n\n# Contributors to Software\
    \ Failure\n\n+   - Pressures such as deadlines may lead to mistakes to be made\
    \ in:\n  - Planning – project manager\n  - Specifications – Business Analyst\n\
    \  - Coding - Programmer\n  - Testing – Test analyst\n- Environmental conditions\
    \ – e.g. radiation\n- Also complexity of the application\n- Failure caused by\
    \ any of the above can be reduced, rectified or avoided by testing\n- So Poor\
    \ Testing is the major cause of software failure\n\n# General Testing Principles\n\
    \n> >Hot Spot - Questions often come out of this in the foundation does not show\
    \ software is bug free\n\n+   1. Testing shows presence of bugs but does not show\
    \ software is bug free\n2. Exhaustive testing is impossible. On a large project\
    \ it is not practically to test all combinations of inputs (data) and preconditions.\n\
    3. Early Testing is important. Testers do not need to wait until software is available\
    \ before commencing activities.\n4. Defect clustering. Spread of defect in software\
    \ is not uniform.\n5. Running the same test continually will not find new defects.\
    \ Regression tests should change to reflect change in business needs.\n6. Testing\
    \ is context dependent. The Test Approach, tools and techniques that are used\
    \ on a particular test project will not be the same as those used on a different\
    \ test project. For example how you test a website application will be different\
    \ from that of a database application.\n7. Absence of errors fallacy. The fact\
    \ that no errors were outstanding does not imply fitness for go live. Users' expectations\
    \ should be met."
