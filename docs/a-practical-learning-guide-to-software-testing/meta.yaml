    A 6.5: 答案是 C，a 和 b。

    解释：此题测试了你对配置管理（Configuration Management）的理解。配置管理有助于跟踪和控制有助于软件开发的项。这些项包括源代码、测试脚本、第三方软件、硬件、数据以及开发和测试文档。配置管理确保这些项在整个项目和产品生命周期内得到仔细、详尽和细致的管理。对于测试而言，配置管理允许测试人员管理他们的测试和结果，因此配置管理能够启用答案中的以下选项非常重要：


    - a) 识别被测软件的版本：这将使得将正确的测试件版本与正确的被测软件版本关联起来

    - b) 控制测试项的版本：确保测试项受控有助于跟踪对它们进行的更改

    - d) 跟踪测试项的更改。*见上述 b)***


    A 6.6: 答案是 D，a 和 b 正确；c 和 e 错误

    解释：此题测试了你对静态分析工具的理解。

    开发者使用静态分析工具来检查源代码以发现可能的异常，而无需执行代码。静态分析工具可以衡量某些指标，以指示代码中可能存在的异常。

    - a) 从未被使用的变量：这是正确的，因为静态分析工具可以识别出开发者定义但在代码中任何地方从未使用过的代码变量

    - b) 安全漏洞：这是正确的，因为静态分析工具可以检查源代码以检测并报告可能导致安全漏洞的问题。

    - c) 性能不佳。错误。

    - d) 不可的代码：这是正确的，因为静态分析工具可以检查源代码，检测出脱离的源代码模块，使其没有逻辑流路径到达程序其他部分的模块，因此它们永远无法执行

    - e) 未遵循业务流程。错误。


    A 6.7: 答案是 B。i-r, ii-q, iii-s, iv-p

    **解释：**此题测试了你对不同类型测试工具用途的理解：


    | 工具分析内容 | 工具类型 |

    |---|---|

    | i) 代码结构分析 | r) 静态分析工具。顺序、选择和迭代代码结构可以使用静态分析工具进行分析。 |

    | ii) 生成测试用例。 | q) 测试设计工具。该工具用于生成测试用例。它们可以创建输入和预期结果（这些用例的一部分）。 |

    | iii) 模拟组件运行的环境。 | t) 测试治架（Test harness）。可用于模拟不可用的服务或功能。测试环境对于需要在特定测试环境中测试的软件组件而言，如果该特定环境是不可用的（例如，可以使用构建作为环境替代方案的测试治架进行测试）。
    |

    | iv) 测试指标分析。 | p) 测试管理：根据已执行和通过的测试次数、提起的事件、修复的缺陷和待处理缺陷等指标来准备进度报告。这些信息可用于监控测试过程并决定采取什么行动（测试控制）。
    |


    表 20：A.67 解释说明


    A 6.8: 答案是 A。为了评估工具是否在合理成本下带来收益

    **解释：**此题测试了你对工具选择和实施的理解。


    在向组织引入工具的试点阶段，任何组织最考虑的因素都是对工具进行成本分析。在此阶段，工具将带来的所有收益都将与实施工具的成本进行权衡。如果收益超过了工具的成本，则会被认为具有良好的投资回报（良好的
    ROI）。


    A 6.9: 答案是 C。组件代码中使用了但未声明的变量

    **解释：**此题测试了你对静态分析指标——未声明变量的理解。


    | 选项 | 结果 |

    |---|---|

    | A. 搜索功能的响应时间超过了约定限制 | 错误，这是一个性能缺陷 |

    | B. 设计规范中有许多语法错误 | 错误，这是文档的静态评审缺陷 |

    | C. 组件代码中使用了但未声明的变量 | 正确！通过对代码进行静态分析将揭示此类缺陷 |

    | D. 发现该组件是内存泄漏的源头 | 错误，这是一个动态分析缺陷 |


    表 21：A.69 解释说明


    A 6.10: 答案是 D。b, c 和 e

    解释：此题测试了你对工具实施的理解。


    | 选项 | 结果 |

    |---|---|

    | a) 尽快在整个组织范围内向所有用户推广该工具。 | 错误，这可能会困扰用户！ |

    | b) 与工具用户进行定期的教训总结。 | 正确！这有助于跟踪用户的学习进度，并有助于纠正任何之前的错误 |

    | c) 为每种工具的测试团队提供技术支持。 | 正确！这将防止测试人员错误使用工具 |

    | d) 如果工具未被使用，撤回它。 | 错误，这可能会浪费资金和资源 |

    | e) 改进流程以适应工具。 | 正确！改进流程会有更好的机会 |


    表 22：A.10 解释说明


    # 测试人员顶级技巧


    1. 不要害怕发现缺陷

    - 这是你的工作！——你的目标是发现故障

    - 系统失败是成功的！

    - 建立系统信心的最佳方法是尝试破坏它

    - 但同时要与开发者保持良好关系——不要指责

    - 软件或硬件错误会导致缺陷，其表现为实际结果不匹配


    2. 始终遵循脚本

    - 否则你将无法重现导致失败的情况

    - 可能是没有遵循脚本导致了失败

    - 如果无法遵循脚本，请提交缺陷，然后修改它。


    3. 不要遗漏任何内容

    - 要有条理——检查每个预期结果——即使有一个很长的列表

    - 不要做假设。


    4. 始终复现缺陷

    - 在发现缺陷后尽快进行

    - 不要留给别人去做

    - 不要假设它是微不足道的

    - 尽可能提供详细信息

    - 然后在缺陷被修复或解决后，不要忘记更新事件日志。


    5. 始终对你执行过的测试记录

    - 这样你就知道进行到了哪里

    - 以便报告进度。

    - 包含你正在测试的版本号。


    6. 不要尝试自己修复缺陷

    - 那不是你的工作

    - 缺陷可能不会被记录

    - 你可能会修复错误导致情况变得更糟！


    7. 失败可能是由脚本引起的

    - 首先检查你自己是否犯了错误

    - 你是否遵循了脚本？

    - 输入是否正确？

    - 预期结果是否正确？

    - 你是否使用了正确的版本？

    - 然后你可以向另一个团队提交缺陷


    8. 始终进行充分的重新测试

    - 失败的测试应该按照之前的方式重新运行

    - 使用相同的环境、版本、输入、预条件等（已修复的元素除外）

