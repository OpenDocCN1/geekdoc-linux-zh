  md: '# # About ISTQB® Certified Tester Foundation Level Certificate Exam


    Source: http://www.istqb.org/


    The Foundation Level exam is characterised by:


    +   * 40 multiple-choice questions

    * a scoring of 1 point for each correct answer

    * a pass mark of 65% (26 or more points)

    * a duration of 60 minutes (or 75 minutes for candidates taking exams that are
    not in their native or local language)


    Exam questions are distributed across K-levels, which represent deepening levels
    of knowledge, as shown in the following table:


    | | Number of questions per K levels | | |

    |---|---|---|---|---||

    | | K1 | K2 | K3 | K4 | Total |

    | Foundation | 20 | 12 | 8 | | 40 |


    Exam questions are distributed across Syllabus chapters as shown in the following
    table:


    | | Number of questions per Chapter | | | | | | |

    |---|---|---|---|---|---|---||

    | | Ch. 1 | Ch. 2 | Ch. 3 | Ch. 4 | Ch. 5 | Ch. 6 | Total |

    | Foundation | 7 | 6 | 3 | 12 | 8 | 4 | 40 |'
