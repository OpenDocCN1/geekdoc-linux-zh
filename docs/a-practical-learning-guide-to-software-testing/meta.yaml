    ## A 5: 答案是 D。a, c 和 d 由测试负责人执行；b 由测试人员执行。


    解释：此题测试了你对测试负责人（Test Leader）和测试人员（Tester）所执行执行任务的理解。


    - a) 根据测试结果调整计划：测试负责人。测试负责人负责根据测试结果对测试计划进行更改。此类更改可能包括减少或增加测试范围，从而改变测试进度。


    - b) 创建测试规范：测试人员。测试人员创建如测试用例、脚本、预期结果和测试数据等交付物作为测试规范。测试计划和这些交付物解释了“如何”实施测试计划中描述的测试用例。


    - c) 计划测试：测试负责人。计划需要像测试负责人这样的资深测试人员的技能和经验。


    - d) 编写或评审测试策略：测试负责人。这需要像测试负责人这样的资深测试人员的技能和经验


    ## A 5.3: 答案是 D. 测试人员 4


    解释：此题测试了你对问题报告的理解。我们从题目中得知，用户登录是系统的关键组件。这意味着由于其关键性，用户登录出现的问题对业务具有高优先级。测试人员 1 和测试人员
    4 是唯一两个以优先级 1（业务高优先级）报告问题的人，因此排除了可能答案 A 和 C（测试人员 3 和测试人员 2）！


    然而，我们还需要考虑测试人员提供的完整信息。测试人员 1 未能让开发人员重现缺陷的详细信息。测试人员 1 遗漏了预期结果和实际结果，以及任何可以提供问题更深入见解的额外信息！


    测试人员 4 在缺陷报告中提供了所有这些缺失信息，使得测试人员 4 的报告是最有效的报告。


    ## A 5.4: 答案是 A. 修正问题的建议


    解释：测试人员绝不能在问题报告中包含任何如何修复 Bug 的建议。以下是测试人员不应建议修复 Bug 的原因：


    - 测试人员的建议可能会误导开发人员并导致更多问题。开发人员可能会认为测试人员侵入他们的职责，导致测试人员与开发人员之间产生不隔阂。


    - 测试人员的建议实际上可能是错误的，导致对测试人员的专业不信任和尴尬。


    ## A 5.5: 答案是 C. a, b 和 d


    解释：此题测试了你对测试中配置管理（Configuration Management）的理解。测试项目中的一个巨大挑战是确保测试件（测试交付物）与被测软件（SUT）一致。这意味着能够将测试交付物跟踪到其相关的正确软件版本。每
    SUT 发生更改时，版本必须更改，结果是测试该软件的测试交付物也需要更改（版本和内容），以匹配对 SUT 进行所做的更改。


    以下是测试中配置管理的相关目的：

    a) 识别被测软件的版本

    b) 控制测试件项的版本

    c) 跟踪测试项的更改


    ## A 5.6: 答案是 A, c, a, b, d


    解释：此题测试了你对测试独立性（Test Independence）的理解。测试独立性是指由设计或开发软件的人/员/组织以外的人进行软件测试。测试执行距离设计或开发被测软件的人越远，测试独立性越高。使用下表可以看到，答案
    A (c, a, b, d) 提供了最准确的递增测试独立性级别？


    | | 测试独立性 |

    |---|---|

    | d) 由不同组织设计的测试。 | 高 |

    | b) 由组织内不同小组设计的测试。 | 中 |

    | c) 由设计团队的成员设计的测试。 | 低 |

    | c) 由代码作者设计的测试。 | 零 |


    表 19：A 5.6 解释


    ## A 5.7: 答案是 C. 根据测试监控信息做出决策


    解释：此题测试了你对测试控制（Test Control）的理解。测试控制活动通常由测试负责人执行，以确保测试按照进度进行或避免软件失败的潜在风险。负责人会使用适当的监控指标（例如通过的测试用例数量与设计的测试用例数量）每天监控测试活动。测试负责人将使用此类指标做出现实决策，以确保在时间限制内进行最佳测试。此类决策可能包括通过将低优先级的用例推到项目的后期来减少测试执行范围，从而将测试重点放在中高优先级的测试用例上（根据测试完成标准）。测试负责人也可能会增加测试范围，以涵盖某些功能的更多测试用例，例如当初始测试结果表明应用程序某些功能在与其他应用程序集成时存在潜在问题时。


    ## A 5.8: 答案是 B, a 和 f


    解释：此题测试了你对测试计划活动的理解。

    a) 安排测试分析和设计：测试进度是测试计划中包含的项目之一。此活动涉及安排基础测试过程（FTP）中涉及的所有活动，包括测试分析和设计。


    b) 设计测试条件：这在测试分析和设计期间完成。


    c) 监控测试进度：这跨越了 FTP 中的多个活动，在测试分析和设计期间监控（例如检查测试用例准备工作的百分比，或在测试执行和实施期间监控测试环境准备工作的百分比）。


    d) 确定测试目标：这在测试计划的早期完成，通常包含在测试计划的引言部分。


    e) 评估测试工具：这是在组织引入新测试工具时完成的独立活动。


    f) 选择监控和控制的测试指标：这在测试计划期间完成，通常包含在测试计划的测试方法部分。


    ## A 5.9: 答案是 B. 我们可能无法按计划让承包加入团队


    解释：此题测试了你对项目风险和产品风险的理解。测试人员应该能够区分项目风险和产品风险。识别可能的风险将使测试人员能够管理它们。测试负责人管理测试工作范围内的风险。项目经理管理项目外的风险。产品风险会导致被测软件（SUT）的失败（缺陷），通常由于更改或其他因素引起；而项目风险通常会导致项目时间线的延迟，其来源可能是内部或外部的。


    基于这些理解，我们解释以下选项：


    - 1. 某些功能存在非标准实现：这是产品风险，因为这可能导致功能故障以及被测软件（SUT）故障

    - 2. 我们可能无法按计划让承包加入团队：这是项目风险，因为这可能导致项目时间线的延迟。此风险必须由测试负责人管理。

    - 3. 软件响应速度可能不够快：这是产品风险，因为它直接影响软件产品并会导致用户不满

    - 4. 合同存在漏洞影响了公司利润：这既不是项目风险也不是产品风险，因为我们无法将其与任何软件产品或软件开发项目关联


    ## A 5.10: 答案是 B. 针对系统更关键的区域


    解释：此题测试了你对基于风险的测试（RBT）的理解，这是测试人员的一种重要方法。RBT 用于根据以下因素对软件功能和特性设计的测试进行优先级排序：


    - 功能和特性失效风险（发生的概率或影响）

    - 功能和特性的重要性


    因此，针对系统更关键的区域进行测试就是基于风险的测试。


    '
