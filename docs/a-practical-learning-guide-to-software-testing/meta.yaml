- md: '

    software that was released to a single customer and there’s a fault reported on
    it


    - Bugs that were fixed suddenly reappear

    - Code was overwritten by another programmer who was working on the same piece
    of code in parallel.

    - Wrong code tested

    - Tested features suddenly disappear


    ## Benefits of Configuration Management

    implementation of CM helps testers manage their own testware, in parallel with
    the software that is being tested


    - Manage their own testware and their revision levels efficiently

    - In order to ensure that the test materials are aligned with the versions of
    software components, a good CM system allows test specifications and test scripts
    to be held or referenced within the CM system itself (whether the CM system holds
    the testware items or the references to them doesn’t really matter).

    - Associate a given version of a test with the appropriate version of the software
    to be tested

    - With the test references recorded the components, it is possible to relate the
    tests used to each specific version of the software.

    - Ensure traceability to requirements and problem reports.

    The CM system can provide the link between requirements documents, specifications,
    test plans, test specifications, and eventually to an incident report.

    - Some CM tools provide support to testers throughout the process and some CM
    systems just have the incident reporting facilities that relate directly to the
    components within a CM system


    ## Practice Questions and Answers with Explanations - Part Five


    ## Questions - Part Five (ActualTests ISEB-SWT2, 2011)


    Q5.1 Which of the following is not an example of a product risk?


    + 1. Software that does not perform its intended functions

    2. Failure of a third party

    3. Problems in defining the right requirements

    4. Skill and staff shortages


    Q5.2 Which tasks would USUALLY be performed by a test leader and by which the
    tester?


    + a) Adapt planning based on test results

    b) Create test specifications

    c) Plan tests

    d) Write or review a test strategy


    + 1. c and d by the test leader; a and b by the tester.

    2. a and b by the test leader; c and d by the tester.

    3. a and d by the test leader; b and c by the tester.

    4. a, c and d by the test leader; b by the tester.


    Q5.3 Four testers have submitted an incident report in which each reported a problem
    with the User log-on process. User log-on is a critical component of the system.
    The table below describes the four reports submitted.


    | Tester ID | Incident description | Inputs/Expected and Actual results | Business
    Priority (1 high 2 medium 3 low) |

    |---|---|---|---|

    | Tester 1 | User log-on validation error | Entered User id = ID of SMITH and
    password of ABC01 but got an error message Inputs: Entered valid id and password
