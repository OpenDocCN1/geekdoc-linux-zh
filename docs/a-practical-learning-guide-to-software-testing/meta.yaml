    # Business tests for 100% coverage


    ![](img/52762cc20a1c71379bad2e432b5742a4_45_0.png)


    +   * Black dots - Business Functionalities of an Application Under Test (AUT)

    * Red wire mesh - Business Tests

    * Can 100% Coverage of the business functionalities be achieved

    * Yes ! Testers must always design tests to ensure 100% coverage of business functionalities
    that are in scope of testing for an AUT.


    Figure 3: Business tests for 100% coverage


    # Business Critical Tests for 100% coverage


    ![](img/52762cc20a1c71379bad2e432b5742a4_45_1.png)


    +   * Black dots - Business Functionalities of a Large Complex System (LCS)

    * Red wire mesh - Business Tests

    * Repeated Red wire mesh - Multiple passes of Business Critical Tests

    * Is exhaustive testing possible in a large and complex system?

    * No! Testers can run multiple passes of Business Critical Tests on high risk
    areas of a Large Complex System.


    Figure 4: Business Critical Tests for 100% coverage'
  - "[PAGE 46]\n\n# Bugs not found or not fixed\n\n![](img/52762cc20a1c71379bad2e432b5742a4_46_0.png)\n\
    \n+   * Black dots - bugs not found or fixed\n* Can the software be deemed reliable?\n\
    * Yes ! it is possible if the software fits the purpose for which it was built\
    \ for the users. This means the bugs not found or fixed do not impede the functions\
    \ that the users require in the application.\n\nFigure 5: Bugs not found or not\
    \ fixed\n\n# Error, Fault and Failure\n\n# Error\n\n+   * Error is a human action\
    \ producing an incorrect result.\n* When programmers make errors they introduce\
    \ faults to program code.\n* Errors are not just accidents or mistakes that can\
    \ be solved by \"just being more careful\"\n* Errors are not an act of incompetence\n\
    * Errors are inevitable in a complex activity\n\n# Fault\n\n+   * A manifestation\
    \ of human error in software\n* Also known as a defect or bug\n* In the United\
    \ States of America, faults are more commonly known as defects\n* Bugs are a universally\
    \ accepted name for faults\n* Bugs and faults are used interchangeably in this\
    \ training course\n* We normally think of programmers when we talk about faults\
    \ and human error\n* However, faults can also be created in documents by:\n  \
    \  * managers working on project plans\n    * analysts working on requirements\n\
    \    * designers working on designs or"
  - '[PAGE 47]


    +   * testers working on test plans too

    * Human error causes faults in any project deliverable (requirements, design or
    code)

    * However only faults in software cause software to fail. This is the most familiar
    situation

    * Faults are static

    * Software faults are static (immobile)

    * When we test software, it is easy to believe that the faults in the software
    move

    * Once injected into the software, they will remain until exposed by a test and
    fixed

    * They are discovered either by inspecting code (reading the code) or by inferring
    their existence from software failures (executing the software)

    * When the software fails we can infer the existence of a fault


    # Failure


    +   * A deviation of the software from its expected delivery or service

    * A failure occurs when software does the ''wrong'' thing

    * Most of the time software does the right thing

    * Software faults cause software failures when the program is executed with a
    set of inputs that expose the fault


