    \ experience for participants\n- Checklist or rules are used\n- Management supports\
    \ to the Review\n- Emphasis is placed on learning and process improvement\n- Results\
    \ in finding and resolving defects\n- Time spent is justifiable\n- Budget used\
    \ is justifiable\n\n## Benefits of Reviews in the Test Process\n\n- Improve software\
    \ development productivity and reduce development timescales\n- Reduce testing\
    \ time and cost\n- Lead to lifetime cost reductions through the maintenance of\
    \ a system over its useful life\n- Finding and fixing faults in the products of\
    \ development phases before they are used in subsequent phases is the key\n- Reviews\
    \ generally reduce fault levels and quality\n- This can also result in improved\
    \ customer relations\n\n## Cost-effectiveness of reviews\n\n- Freeman and Weinberg\
    \ (1990) quote a ten times reduction in faults that come into testing with a 50%\
    \ to 80% reduction in testing cost.\n- Yourdon (1989) in his book on Structured\
    \ Walkthroughs found that faults were reduced by a factor of ten\n- Gilb and Graham\
    \ (1994) give a number of documented benefits for software Inspection, including\
    \ 25% reduction in schedules, a 28 reduction in maintenance cost, and finding\
    \ 80% of defects in a single pass (with a mature Inspection process) and 95% in\
    \ multiple passes.\n\n## Static Analysis by Tools\n\n- Find defects without executing\
    \ the code but by using a tool (a form of automated testing)\n- Only done when\
    \ code is written\n- Objective is to find defects in source code and software\
