    - 预防相同错误的再次出现\n\n### 静态分析的局限性 (Limitations of Static Analysis)\n\n- 它无法区分“安全”代码与真实的故障\n\
    - 可能产生大量的虚假信息\n- 不执行代码\n\n### 静态分析发现的缺陷示例 (Examples of Defects found by Static\
