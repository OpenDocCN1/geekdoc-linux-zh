  md: '# # A PRACTICAL LEARNING GUIDE TO SOFTWARE TESTING


    Olusola Samuel Fatiregun MBCS CITP


    ![](img/52762cc20a1c71379bad2e432b5742a4_0_0.png)


    This guide includes notes that cover the syllabus for the ISTQB Software Testing
    Foundation Exam. The notes are reinforced with online audio explanations, practical
    hands on learning materials and software that will greatly enrich the learning
    experience of the reader.


    ![](img/52762cc20a1c71379bad2e432b5742a4_0_1.png)


    ![](img/52762cc20a1c71379bad2e432b5742a4_0_2.png)


    20% of proceeds from this guide will be contributed towards eliminating hunger
    in Africa'
