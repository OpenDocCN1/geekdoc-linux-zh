    3. 创建测试执行计划

    4. 建立测试条件的追溯性


    a) d, a, c, b

    b) a, d, b, c

    c) a, b, c, d

    d) a, b, d, c


    Q1.6 下列哪种陈述是正确的？

    i. 测试不能证明软件是错误的。

