    \n- 测试独立性至关重要，但具有挑战性：\n    - 由非创建者人员对软件进行测试\n    - 独立性越高，由于对应用程序不熟悉而导致的测试错误就越多\n\
    \n| 开发人员 | 低 |\n|---|---|\n| 被委派给开发人员的独立测试人员 | |\n| 组织内部的独立永久测试团队 | |\n| 由运营业务部门提供的独立测试团队\
    \ | |\n| 专家测试人员，如可用性测试人员、安全性测试人员、性能测试人员等 | |\n| 外包测试人员或测试团队，如承包商或独立测试机构 | 高 |\n\
    \n**表 16：跨组织角色的测试独立性水平**\n\n# 独立测试的优点与缺点\n\n| 优点 | 缺点 |\n|---|---|\n| 测试人员可能会发现作者无法发现的缺陷\
    \ | 测试人员可能仅依赖于很少更新的规范作为测试依据 |\n| 测试人员是中立的 | 测试人员可能成为瓶颈；独立测试执行通常是最后阶段，且通常因延迟被标记\
    \ |\n| 测试人员可以查看实际构建的内容，而不是开发者认为已构建的内容 | 开发人员可能依赖独立测试团队发现 Bug，结果可能失去对质量的责任感（例如：糟糕的单元测试）\
    \ |\n| 测试人员对质量不做任何假设 | 与开发团队隔离开（在完全独立的情况下）可能会产生“他们和我们”的态度。这会阻碍沟通 |\n\n**表 17：独立测试的优点与缺点**\n\
    \n# 测试团队中的角色\n\n- ISEB/ISTQB 教学大纲定义了两角色\n1. 测试负责人，也称为测试经理或测试协调员\n2. 测试人员，也称为测试分析师或测试执行员\n\
    请注意不同组织中可能存在其他角色。另注意 ISEB 要求你区分角色与任务；职位与角色\n\n# 职位 vs 角色 vs 任务\n\n- 一个职位对应多个角色：你可以拥有测试协调员的职位，但履行着多个角色，例如担任测试负责人和测试人员\n\
    - 一个角色对应多个任务：例如，在你测试负责人的角色中，你将执行多个任务，如协调测试策略的制定和设置测试环境\n\n# 测试负责人的任务\n\n- 与项目经理及其他人协调测试策略和计划的\n\
    - 编写或评审测试策略（针对项目）和测试策略（针对组织）\n- 开发交付进度\n- 规划所需测试的开发\n    - 测试方法\n    - 测试周期\n\
    \    - 估算\n    - 测试成本\n    - 资源\n- 管理测试的规范、准备、实施和执行\n- 测试状态报告和测试进度管理\n- 确保测试件的适当配置管理；包括确保测试件可追溯需求\n\
    - 评估测试质量\n- 同意自动化范围、程度和方法\n- 在需要时选择支持测试的工具\n- 同意测试环境的结构和实现\n- 调度所有测试活动\n- 根据测试期间收集的信息编写项目测试总结报告\n\
    \n# 测试人员的任务\n\n- 评审并参与测试计划的制定\n- 分析、评审和评估用户需求、规范和其他模型的可测试性\n- 根据测试依据（基线）创建测试规范\n\
    - 设置测试环境\n    - 可能需要与系统管理、测试管理或环境管理部门联系\n- 创建或获取测试数据\n- 在所有测试级别实施测试\n- 使用测试管理或测试监控工具\n\
    - 自动化测试（可能由开发者或自动化专家支持）\n- 评审其他测试人员开发的测试\n- 在适用时运行测试并衡量组件性能\n\n# 测试策略\n\n- 一份描述软件开发周期中测试方法的文档\n\
    - 告知项目参与者（如项目经理、测试人员和开发人员）测试过程中的某些关键活动和重要问题，如：\n    - 要执行的测试级别\n    - 角色与职责\n\
    \    - 环境需求\n    - 测试工具\n    - 风险与缓解\n    - 以及更多\n- 编写测试策略是测试负责人的责任（取决于项目规模）。然而，如果只使用一名测试人员，则此人需要编写一份策略\n\
    - 测试策略文档是静态文档，更新不频繁\n\n# 测试方法\n\n- 是项目测试策略的实施\n- 它定义了如何进行测试\n- 它可以是：\n    - 1.\
    \ 预防性——在生命周期早期开发，以防止缺陷被构建到最终解决方案中\n    - 2. 响应性——留到测试执行开始前才制定\n\n# 测试方法的类型\n\n\
    - 分析法——用于基于风险的测试\n- 基于模型的方法——用于随机测试（统计性故障率信息）\n- 方法论方法——基于故障、错误猜测、检查列表、基于质量特征\n\
    - 标准合规法——基于特定行业标准\n- 流程合规法——遵循开发过程中的流程，如敏捷和瀑布模型\n- 动态和启发式方法——探索性测试（记住！），执行和评估是同时进行的\n\
    - 咨询法——测试覆盖由测试团队外部专家的建议驱动，例如业务领域专家或技术专家\n- 回归规避法——重用大量的测试材料和标准测试套件\n\n# 选择测试方法的因素\n\
    \n- 失败风险\n- 参与拟议技术、工具和方法的人员技能和经验\n- 测试目标和测试团队的任务：\n    - 例如，可能是发现最严重的 Bug\n  \
    \  - 监管因素\n    - 产品和业务的性质\n    - 移动解决方案测试方法将与在线银行解决方案不同\n\n# 测试计划\n\n- 它描述了计划测试活动的范围（什么）、方法（如何）、资源（谁）和时间表（何时）\n\
    - 它规定了如何开展测试\n- 下述测试计划内容基于 ANSI 829 标准，既适用于主计划也适用于详细计划\n- IEEE 829 标准测试计划（在线学习材料提供）提供了测试计划的内容\n\
    \n# 测试计划内容\n\n1. 测试计划标识符\n2. 参考文献\n3. 引言\n4. 测试项\n5. 软件风险问题\n6. 要测试的功能\n7. 不要测试的功能\n\
    8. 方法\n9. 通过/失败标准\n10. 挂起标准和恢复要求\n11. 测试交付物\n12. 剩余测试任务\n13. 环境需求\n14. 人员和培训需求\n\
    15. 职责\n16. Schedule\n17. 计划风险与应对措施\n18. 批准\n19. 术语表\n\n# 测试计划标识符\n\n- 唯一的编号，用于识别此测试计划、级别及其相关的软件级别\n\
    - 最好测试计划级别与相关的软件级别相同\n- 可能还标识该测试计划是主计划、层级计划、集成计划或其代表的任何计划\n\n# 参考文献\n\n- 列出所有支持测试计划的文档\n\
    - 例如项目计划、需求规范、设计文档、开发和测试标准\n\n# 引言\n\n- 计划的目的，可能标识计划的级别\n- 计划的执行摘要部分\n\n# 测试项（功能）\n\
    \n- 你打算测试的内容\n- 源自软件应用程序清单或其他来源\n\n"
