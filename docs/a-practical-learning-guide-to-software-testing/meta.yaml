  mdcn: "\n你可能需要重新运行不仅仅是失败的测试。因为失败是由之前测试的输出导致的。\n\n# 9. 记住没有任何东西是完美无缺的，但是……\n\n- 它可以可靠可靠\n\
    - 可靠性 = “在特定时间内、特定条件下，系统不发生故障的概率”\n\n# 10. 你不可能测试所有内容\n\n- 这将花费不切实际的时间\n- 只需确保在停止测试时，你已经“在可用时间内尽了测试之能”即可\n\
    - 优先执行最重要的测试。\n- 这些测试会导致最严重的后果：\n  - 严重的故障\n  - 可见的故障\n  - 可能发生的故障\n  - 复杂的故障\n\
    \n## 第 2 节 - 软件测试实战指南\n\n### 关于第 2 节\n\n- 在本节中，你将学习开发测试技艺所需的必备技能\n- 实操部分基于伦敦一家老抵押贷款公司的真实案例研究\n\
    - 你将产出测试交付物，涵盖本指南第一部分第一节讨论的基础测试过程的五项活动。\n- 这些活动是：\n  * 测试计划与控制\n  * 测试分析与设计\n\
    \  * 测试实施与执行\n  * 退出标准评估与报告\n  * 测试结束\n- 你的交付物将跨越 V 模型中的以下测试级别：\n  1. 集成\n  2.\
    \ 系统\n  3. 验收\n- 为了方便，集成级和系统测试级合并为系统集成级（这是现实世界的常见做法）\n- 以下提供的在线资源将帮助你完成测试交付物：\n\
    \  1. 实操作业说明，包含：\n    a) 系统集成测试级所需交付物的功能规格书\n    b) 用户验收测试级部分交付物的需求规格书\n    c)\
    \ 用户验收测试级部分交付物的用例模型\n    d) 用户验收测试级部分交付物的业务流程模型\n    e) 示例测试计划和模板\n    f) 系统集成级示例测试估算\n\
    \    g) 系统集成与用户验收测试级示例追溯矩阵\n    h) 系统集成与验收测试级测试脚本矩阵\n    i) 系统集成级与用户验收测试级示例测试数据\n\
    \    j) 系统集成级示例测试执行计划\n    k) 系统集成级已执行的示例测试脚本，每一步都更新了实际结果、通过/失败状态\n    l) 系统集成级附带缺陷截图的示例问题日志\n\
    \    m) 显示根据测试计划修复并测试了缺陷的缺陷报告示例\n    n) 示例每日测试进度报告\n    o) 示例测试总结报告\n  2. 待测试的软件应用程序\n\
    \  3. 用于在整个缺陷生命周期管理缺陷的缺陷管理软件\n\n要获取在线材料的权限，请向 sam.fatiregun@theits.com 发送电子邮件，并提供随附指南的唯一代码。你将在\
    \ 24 小时内收到在线材料的访问链接。如果你在 24 小时内未收到邮箱收到访问链接，请在向上述邮箱地址发送投诉邮件之前，先检查你的垃圾邮件文件夹。请注意，书中颁发的唯一代码每个邮箱地址仅对一个个人有效。代码一旦从……发送\n\
