    \ 间距不规范\n    - 句子结构不佳\n    - 字体不一致\n    - 对校对内容的主题术语使用不当\n- **数据步进（Data stepping）：**个人跟随一组数据值穿过源代码，以确保处理的每一步值都是正确的。\n\
    \n## 小组评审技术\n\n- 涉及小组的静态技术通被称为评审（reviews）。\n- 评审的形式差异很大，从非常非正式到高度正式\n\n## 评审类型\n\
    \n1. 非正式评审（Informal）\n2. 演练（Walkthrough）\n3. 技术评审（Technical Review）\n4. 检查（Inspection）\n\
    \n图 14：评审的正式程度\n\n## 非正式评审\n\n- 没有正式流程\n- 可能记录也可能不记录\n- 许多并未记录\n- 评审员可能不具备技术技能，仅为了确保文档逻辑通顺\n\
