  md: '# Top Ten Tips for Testers

    1. Don’t be scared of finding defects


    +   - That’s your job! – your goal is to find faults

    - It’s a success if the system fails!

    - The best way is to build confidence in a system is to try to destroy it.

    - But at the same time maintain a good relationship with the developers – no blaming

    - An error in the software or hardware causes a defect, instance of which is a
    failure – where the actual results do not match expected.


    +   2. Always follow the script

    - Otherwise you will not be able to reproduce the circumstances that gave rise
    to a failure.

    - It may be not following the script that caused the failure.

    - If you can’t follow the script, raise a defect and then change it


    +   3. Don’t miss anything

    - Be methodical – check every expected result – even if there is a long list of
    them

    - Don’t make assumptions


    +   4. Always repeat a defect

    - As soon as possible after you find it

    - Don’t leave it for someone else to do

    - Don’t assume it’s trivial

    - Put in as much detail as you can

    - Then don’t forget to update the incident log once it has been fixed or resolved


    +   5. Always keep a record of the tests that you have executed

    - So you know where you have got out to

    - So that progress can be reported upon.

    - Include the version number of what you are testing.

    - Do not document what actually happened


    +   6. Don’t try and fix the defect yourself

    - That’s not your job

    - The defect may not get logged

    - You might fix it wrong and make things even worse!


    +   7. Failures can be caused by the script

    - First check that you haven’t made a mistake

    - Have you followed the script?

    - Are the inputs correct?

    - Are the expected results correct?

    - Are you using the correct versions?

    - Then you can raise the defect on another team


    +   8. Always re-test sufficiently

    - The test that failed should be re-run exactly as before

    - Using the same environment, versions, inputs, pre-conditions etc. (apart from
    the element that has been fixed)'
