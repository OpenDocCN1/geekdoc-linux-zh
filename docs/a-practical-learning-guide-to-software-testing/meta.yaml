    4. 测试人员应在草案可用时尽早开始审阅文档。


    Q2.2 关于组件测试，以下哪些陈述是正确的？

    a) 可以使用存根（Stubs）。

    b) 可能覆盖资源行为（例如：内存泄漏）。

    c) 测试软件组件之间的交互。

    d) 缺陷通常被修复，而不对这些缺陷进行形式化管理。


    + 1. a, c 和 d

    2. a, b 和 d

    3. b, c 和 d

    4. a, b 和 c


    Q2.3 关于软件开发模型，以下哪项描述是正确的？

    1. V 模型中始终有四个测试层级

    2. 在快速应用开发 (RAD) 项目中，每次迭代都有四个测试层级

    3. 在敏捷开发模型中，每次迭代的测试层级数量因项目而异

    4. 任何软件开发模型都必须至少四个测试层级


    Q2.4 在什么情况下，你会计划执行维护测试？

    a) 作为应用程序从一个平台到另一个平台的迁移的一部分。

    b) 作为计划中的增强发布的一部分。

    c) 当需要更新测试脚本时。

    d) 用于系统退役相关的数据迁移。


    + 1. a, b 和 c

    2. b, c 和 d

    3. a, b 和 d

    4. a, c 和 d


    Q2.5 关于软件开发模型，以下哪些陈述是正确的？

    a) 组件集成测试存在于所有良好的开发模型中。

    b) 验收测试可以在系统测试开始之前进行。

    c) 验收测试应在系统测试完成后才开始。

    d) V 模型中的测试层级可能少于四个。


    + 1. b 和 d

    + 2. a 和 b

    + 3. b 和 c

    + 4. c 和 d


    Q2.6 下列哪项最能描述非功能测试的目的？


    + 1. 衡量系统的特征，这些特征指示系统如何执行其功能

    + 2. 确保系统符合 ISO 9126 规定的质量标准

    + 3. 确保系统能够妥善处理软件故障

    + 4. 衡量系统通过功能测试测试的程度


    Q2.7 关于功能测试，以下陈述中哪项是正确的？


    + 1. 功能性测试用例源于规范

    2. 功能性测试用例源于对代码的检查

    3. 功能测试确保软件无错误

    4. 功能测试应在检查点（Inspection）过程之前完成


    # 答案 - 第二部分


    A2.1 答案是 D。测试人员应在草案可用时尽早开始审阅文档。


    解析：


    此题测试了你对以下内容的理解：


    * 良好测试的特征

    * V 模型

    * 迭代模型

    * 前置测试（Front-loaded testing）


    在测试人员能够获取时，尽早开始审阅需求草案等测试活动是良好的测试实践，原因如下：


    * 防止由于用于开发代码的文档存在歧义而导致缺陷

    * 当测试人员审阅文档时，他们也借此机会熟悉解决方案所需的功能

    * 测试人员还能根据文档开发测试用例草案，这将节省测试的时间和成本


    A2.2 答案是 B。a, b 和 d


    a) 可以使用存根（Stubs）。

    b) 可能覆盖资源行为（例如：内存泄漏）

    d) 缺陷通常被修复，而不对这些缺陷进行形式化管理。


    解析：


    此题测试了你对以下内容的理解：


    - 使用存根进行组件测试的自顶向法方法

    - 内存泄漏：一种导致程序在完成内存使用后无法回收内存的缺陷，最终导致程序因内存不足而失败。内存泄漏是编程 bug 导致的，因此在开发阶段（程序员级测试或组件测试层级测试）对其进行测试非常重要。

    - 开发测试（组件测试）不需要形式的缺陷管理，因为缺陷是由开发修复的，在此阶段不需要测试人员的介入。


    A2.3 答案是 C。在敏捷开发模型中，每次迭代的测试层级数量因项目而异。

    **解析：** 此题测试了你对 V 模型和迭代模型中测试层级的理解。在任何软件开发项目中的，运行的测试层级数量可能存在差异。这对于运行敏捷或 V 模型方法论的项目尤为如此。


    对于敏捷方法论，重要的是，没有两个项目是完全相同的，例如，项目需求、每次迭代的目标以及测试环境的要求可能从一个项目到另一个项目不同，甚至从一次迭代到另一个迭代不同。这些差异将影响每次迭代包含的测试层级。


    对于 V 模型方法论，你可能还需要包含本部分描述的四个层级之外的其他测试层级。例如，你可以在系统层和验收层之间设置一个系统集成测试层级。


    A2.4 答案是 C：a, b 和 d

    **解析：** 此题测试了你对维护测试和回归测试作为测试类型的理解。

    考虑以下选项：


    - a) 作为应用程序从一个平台到另一个平台的迁移的一部分。

    - b) 作为计划中的增强发布的一部分。

    - c) 当需要更新测试脚本时。

    - d) 用于系统退役相关的数据迁移。


    选项 a、b 和 d 都与已上系统有关。当你对系统进行更改时，始终执行维护测试。这就是为什么维护测试的大部分是回归测试的原因。


    A2.5 答案是 D。c 和 d


    解析：此题测试了你对 V 模型中测试层级的理解。

    考虑提供的答案选项：


    * a) 组件集成测试存在于所有良好的开发模型中。

    * b) 验收测试可以在系统测试开始之前进行。

    * c) 验收测试应在系统测试完成后才开始。

    * d) V 模型中的测试层级可能少于四个。


    选项 c 和 d 是正确的。


    选项 c：验收测试应在系统测试完成后才开始是正确的，因为系统测试的重点是验证构建到系统中的功能符合功能规范中的预期。


    验收测试是最后一个阶段，其重点不再是功能测试，而是针对最终用户预期的测试。在用户有机会根据其预期验证系统（验收测试）之前，验证功能的正确性（系统测试）是重要的。


    选项 d：基于 V 模型的项目包含的测试层级数量可能在不同项目之间不同。


    A.6 答案是 A。衡量系统的特征，这些特征指示系统如何执行其功能。


    解析：此题测试了你对性能测试作为非功能测试的一种类型的理解。非功能测试的重点不是直接测试系统的功能。在性能测试期间，重点是检查系统如何充分利用其功能来支持其资源或集成资源和或用户不断变化的需求。例如，改变同时访问网站的用户负载，以检查网站对不同用户负载的响应时间。


    A.7 答案是 A。功能性测试用例源于规范


    解析：此题测试了你对功能测试的理解。功能测试的重点是直接测试系统的功能。这是在系统测试期间进行的，通过验证系统功能是否按规范运行来实现。为了实现这一点，测试人员必须覆盖规范中描述的所有功能作为测试用例。由于功能性测试用例源于规范，因此功能测试通常被称为基于规范的测试（Specification
    Based Testing）。


    '
