    - If it is between one and twelve, that's okay and the value can be accepted.\n\
    - If it is greater than twelve, that's invalid and you can print an error\n\n\
    All infinite range of integers that could be entered into a system must fall into\
    \ one of those three criteria, one of categories:\n- less than one\n- between\
    \ one and twelve\n- greater than twelve\n\n- If we select one value from each\
    \ range of numbers, and use this as a test case, could say that we have covered\
    \ the three rules\nDoes it matter what values we take? Not really!\nWe could count\
    \ in fact that every value in a partition is equivalent. This is where the name\
    \ of the technique comes from\nBy doing this, our infinite number of possible\
    \ values will all be covered by the three categories, these three rules!\n\n##\
    \ Equivalence Partitioning - Input and Output Partitioning\n\nUsing the month\
    \ field scenario above, we come up with the input and output partition table below:\n\
    \n| Business Rules | Input Partition | Output Partition |\n| :--- | :--- | :---\
    \ |\n| Month less than one print “invalid too low” | Month<1 | invalid too low\
    \ |\n| Month between one and twelve print “valid” | (Month>=1, (Month<=12) | valid\
    \ |\n| Month greater than twelve print “invalid too high” | (Month>12) | invalid\
