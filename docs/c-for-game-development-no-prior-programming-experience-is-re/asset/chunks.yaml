    In the main function, we can create instances of the derived classes and demonstrate
    their functionality.


    ```cpp


    int main() {


    Player player("Hero", 100);


    Enemy enemy("Dragon", 150);


    player.displayInfo(); // Display player info


    enemy.displayInfo(); // Display enemy info


    enemy.attack(player); // Enemy attacks player


    player.takeDamage(enemy.getStrength()); // Player takes damage


    player.displayInfo(); // Display updated player info


    return 0;


    }


    ```


    In this code, we create instances of the `Player` and `Enemy` classes, showcase
    their specific behaviors and interactions, and utilize inheritance to access shared
    functionalities from the base class `GameObject`.


    Benefits of Inheritance in Game Development


    1\. Code Reuse: Inheritance allows for reusing code from base classes, reducing
    redundancy and promoting efficiency.


    2\. Hierarchical Structure: Inheritance creates a hierarchical structure that
    reflects relationships between game objects, enhancing organization and clarity
    in code.


    3\. Specialization: Derived classes can specialize behaviors and attributes inherited
    from base classes, providing tailored functionalities for different game objects.


    4\. Polymorphism: Inheritance enables polymorphism, where derived classes can
    be treated as their base class type, promoting flexibility and extensibility in
    game systems.


    5\. Maintenance and Scalability: Inheritance simplifies maintenance and scalability
    by modularizing code into manageable units, making it easier to add new features
    or modify existing ones.


    By leveraging inheritance effectively, game developers can create efficient and
    structured game hierarchies, model diverse game objects with specialized behaviors,
    and maintain a clean and extensible codebase in C++ game development.


    Overriding and Polymorphism in Action: Dynamic Game Interactions


    Overriding and polymorphism play a crucial role in C++ game development by enabling
    dynamic and flexible interactions between game objects. These concepts allow derived
    classes to provide their implementations for base class methods, promoting code
    extensibility, and facilitating polymorphic behavior where objects can be treated
    uniformly despite their varying types. Let''s explore how overriding and polymorphism
    are utilized in game development with code examples and explanations.


    Understanding Method Overriding


    Method overriding occurs when a derived class provides a specific implementation
    for a method that is already defined in its base class. This allows the derived
    class to customize behavior while still adhering to the interface defined by the
    base class. In game development, method overriding is often used to implement
    unique actions or behaviors for different game objects while maintaining a common
    interface.


    Example: Player and Enemy Classes


    Let''s consider a scenario with a `GameObject` base class and derived classes
    `Player` and `Enemy`, each implementing their update methods.


    ```cpp


    #include <iostream>


    class GameObject {


    public:


    virtual void update() {


    std::cout << "Generic object update." << std::endl;


    }


    };


    class Player : public GameObject {


    public:


    void update() override {


    std::cout << "Player-specific update." << std::endl;


    }


    };


    class Enemy : public GameObject {


    public:


    void update() override {


    std::cout << "Enemy-specific update." << std::endl;


    }


    };


    ```


    In this example, both `Player` and `Enemy` classes override the `update` method
    inherited from `GameObject` to provide their specific update behaviors.


    Polymorphic Behavior in Action


    Polymorphism allows objects to be treated as instances of their base class or
    derived classes interchangeably. This concept is crucial in game development for
    managing diverse game objects uniformly, especially in scenarios like iterating
    through a collection of game entities and calling their update methods.


    Example: Using Polymorphism


    ```cpp


    #include <vector>


    int main() {


    std::vector<GameObject*> gameObjects;


    gameObjects.push_back(new Player());


    gameObjects.push_back(new Enemy());


    for (GameObject* obj : gameObjects) {


    obj->update(); // Polymorphic behavior


    }


    // Clean up allocated memory


    for (GameObject* obj : gameObjects) {


    delete obj;


    }


    return 0;


    }


    ```


    In this main function, we create a vector of pointers to `GameObject` instances,
    including both `Player` and `Enemy` objects. By calling the `update` method on
    each object, polymorphic behavior occurs, and the appropriate overridden `update`
    method from each derived class is executed based on the object''s actual type.


    Benefits of Overriding and Polymorphism in Game Development


    1\. Code Flexibility: Overriding allows for customizing behavior in derived classes
    while adhering to a common interface defined in the base class.


    2\. Dynamic Interactions: Polymorphism enables dynamic interactions between different
    game objects, promoting flexible and extensible game systems.


    3\. Uniformity in Code: Objects of different types can be treated uniformly through
    polymorphism, simplifying code and promoting consistency.


    4\. Scalability: New derived classes can be added easily without modifying existing
    code, enhancing scalability and modifiability.


    5\. Code Reusability: Common functionality defined in the base class can be reused
    across multiple derived classes, reducing redundancy and promoting efficient code
    reuse.


    By leveraging method overriding and polymorphism effectively, game developers
    can create dynamic and interactive game systems where objects exhibit diverse
    behaviors based on their specific types while maintaining a cohesive and manageable
    codebase in C++ game development.


    Chapter 5


    Introduction to Computer Graphics Fundamentals


    Rasterization and rendering pipelines are fundamental concepts in computer graphics
    and game development. They involve converting 3D scene information into 2D images
    that can be displayed on a screen, including handling geometry, textures, lighting,
    and other visual effects. Let''s explore the concepts of rasterization and rendering
    pipelines in the context of C++ game development, including code snippets and
    explanations.


    Rasterization Process


    Rasterization is the process of converting geometric primitives (such as triangles)
    from a 3D space into pixels on a 2D screen. This process involves several stages
    in the rendering pipeline, including vertex processing, primitive assembly, rasterization,
    fragment shading, and frame buffer operations.


    Vertex Processing and Primitive Assembly


    In C++ game development using graphics APIs like OpenGL or DirectX, vertex processing
    involves transforming vertices from object space to world space, then to view
    space (camera space), and finally to clip space. Here''s a simplified example
    using OpenGL''s shader language (GLSL):


    ```glsl


    #version 330 core


    layout(location = 0) in vec3 inPosition; // Vertex position attribute


    uniform mat4 modelMatrix;


    uniform mat4 viewMatrix;


    uniform mat4 projectionMatrix;


    void main() {


    gl_Position = projectionMatrix * viewMatrix * modelMatrix * vec4(inPosition, 1.0);


    }


    ```'
