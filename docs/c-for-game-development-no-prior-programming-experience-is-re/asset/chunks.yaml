    int main() {


    std::vector<int> numbers = {5, 3, 8, 2, 1, 9};


    bool found = LinearSearch(numbers, 8);


    return 0;


    }


    ```


    Optimization: Use binary search for sorted data to achieve O(log n) complexity
    instead of O(n) linear search.


