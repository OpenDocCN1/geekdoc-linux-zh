    \ \" << characterName << \", Health: \" << characterHealth\n        << \", Experience:\
    \ \" << playerExperience << std::endl;\n    }\n\nprivate:\n    int playerExperience;\n\
    };\n\nint main() {\n    PlayerCharacter player(\"Hero\", 100, 500);\n    player.displayInfo();\
    \ // 访问基类方法\n    player.displayPlayerInfo(); // 访问派生类方法\n    return 0;\n}\n```\n\
    \n在这个示例中，`GameCharacter` 是基类，`PlayerCharacter` 是继承自 `GameCharacter` 的派生类。`PlayerCharacter`\
    \ 类继承了 `GameCharacter` 的 `characterName` 和 `characterHealth` 属性，并增加了玩家角色特有的 `playerExperience`\
    \ 属性。\n\n## 继承的类型\n\n1. **单继承**：派生类只继承一个基类。\n2. **多重继承**：派生类继承多个基类。\n3. **多级继承**：派生类继承自另一个派生类，形成层次结构。\n\
    \n```cpp\n// 多重继承示例\nclass Weapon {\npublic:\n    Weapon(const std::string& name,\
