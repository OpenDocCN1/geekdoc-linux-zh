    \n## 光栅化\n\n光栅化处理 3D 图元（三角形）并确定它们覆盖了屏幕上的哪些像素。每个像素的属性（如颜色和深度）根据形成三角形的顶点属性进行插值。以下是光栅化过程的高级表示：\n\
    \n1. 使用`重心坐标`等技术确定三角形覆盖了哪些像素。\n2. 在整个三角形上插值顶点属性（例如颜色、`纹理坐标`），以为像素分配属性。\n3. 执行背面剔除和深度测试，以确定可见性和遮挡关系。\n\
    \n## 渲染流水线\n\n渲染流水线包含一系列处理几何结构并生成最终图像的阶段。现代图形 API 如 `Vulkan`、`DirectX 12` 和 `Metal`\
    \ 提供了可编程的阶段，用于自定义和优化。以下是通用渲染流水线的简化概述：\n\n1. `Vertex Shader`：变换顶点并将数据传递给后续阶段。\n\
