    \ {10, 20, 30, 40, 50};\n  int* ptr = array; // Pointer to the first element of\
    \ the array\n  for (int i = 0; i < 5; ++i) {\n    std::cout << \"Element \" <<\
    \ i+1 << \": \" << *ptr << std::endl;\n    ptr++; // Move the pointer to the next\
    \ element\n  }\n  return 0;\n}\n```\n\nIn this code, `ptr` initially points to\
    \ the first element of `array`, and pointer arithmetic (`ptr++`) is used to traverse\
