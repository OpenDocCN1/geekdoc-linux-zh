    \n## Basic Function Syntax\n\nIn C++, a function is defined using the following\
    \ syntax:\n\n```cpp\nreturn_type function_name(parameters) {\n    // Function\
    \ body\n    // Code to be executed\n    return value; // Optional return statement\n\
    }\n```\n\n- `return_type`: Specifies the type of data that the function will return\
    \ after execution.\n- `function_name`: Name of the function, which should be descriptive\
    \ and follow naming conventions.\n- `parameters`: Optional input parameters that\
    \ the function may take to perform its task.\n- `return value`: Optional return\
    \ statement to send data back to the calling code.\n\nLet's create a simple function\
