    #include <algorithm>


    #include <vector>


    void SortData(std::vector<int>& data) {


    std::sort(data.begin(), data.end()); // Standard sorting algorithm (e.g., Quick
    Sort)


    }


    int main() {


    std::vector<int> numbers = {5, 3, 8, 2, 1, 9};


    SortData(numbers);


    return 0;


    }


    ```


    Optimization: Use a more efficient sorting algorithm like Radix Sort or counting
    sort for specific data distributions or constraints.


    Example: Efficient Searching


    ```cpp


