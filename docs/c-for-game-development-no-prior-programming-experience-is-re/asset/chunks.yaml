    Chapter 7


    Physics in Games: Making Objects Move Realistically


    Understanding forces, motion, and collision detection is crucial in game development
    as they form the basis for creating realistic and interactive game worlds. In
    this discussion, we''ll delve into these concepts, explore how they are implemented
    in C++ using OpenGL, and provide code examples to illustrate their usage.


    Forces and Motion


    Newton''s Laws of Motion


    Newton''s laws of motion are fundamental to understanding how objects move and
    interact with each other in the physical world. They provide a framework for simulating
    realistic motion in games.


    1\. First Law (Law of Inertia): An object at rest stays at rest, and an object
    in motion stays in motion unless acted upon by an external force.


    2\. Second Law (Law of Acceleration): The acceleration of an object is directly
    proportional to the net force acting on it and inversely proportional to its mass
    (F = ma).


    3\. Third Law (Action-Reaction): For every action, there is an equal and opposite
    reaction.


    Implementing Forces in C++


    To simulate forces like gravity, friction, or user-controlled forces, we can use
    vectors to represent forces and apply them to objects in the game world.


    ```cpp


    #include <glm/glm.hpp>


    struct Rigidbody {


    glm::vec3 position;


    glm::vec3 velocity;


    float mass;


    };


    void applyForce(Rigidbody& body, const glm::vec3& force) {


    // Acceleration = Force / Mass (Newton''s second law)


    glm::vec3 acceleration = force / body.mass;


    // Update velocity based on acceleration


    body.velocity += acceleration;


    // Update position based on velocity (assuming constant time step)


    body.position += body.velocity;


    }


    int main() {


    Rigidbody object;


    object.position = glm::vec3(0.0f, 0.0f, 0.0f);


    object.velocity = glm::vec3(0.0f, 0.0f, 0.0f);


    object.mass = 1.0f;


    glm::vec3 gravity(0.0f, -9.81f, 0.0f); // Gravity force


    // Apply gravity force to the object


    applyForce(object, gravity);


    return 0;


    }


    ```


    In this code, we define a `Rigidbody` struct to represent an object''s position,
    velocity, and mass. The `applyForce` function calculates acceleration based on
    Newton''s second law and updates the object''s velocity and position accordingly.


    Collision Detection


    Types of Collisions


    There are several types of collisions commonly encountered in games:


    1\. Bounding Box Collision: Simplistic collision detection using axis-aligned
    bounding boxes (AABBs).


    2\. Collision with Shapes: Collisions with more complex shapes like spheres, cylinders,
    or custom meshes.


    3\. Pixel-Perfect Collision: Precise collision detection based on pixel data,
    often used in 2D games.


    Implementing Collision Detection in C++


