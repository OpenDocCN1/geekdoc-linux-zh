    SDL_GetMouseState(&mouseX, &mouseY);


    // Process mouse click at coordinates (mouseX, mouseY)


    }


    }


    // Update game logic and rendering here


    }


    ```


    In this snippet, we detect `SDL_MOUSEBUTTONDOWN` events and get the mouse coordinates
    using `SDL_GetMouseState` to determine where the user clicked on the screen.


    Gamepad Input


    Modern gamepads can enhance gameplay experiences. SDL also provides support for
    gamepad input. Here''s a basic example:


    ```cpp


    // Initialize SDL with game controller support


    if (SDL_Init(SDL_INIT_VIDEO | SDL_INIT_GAMECONTROLLER) != 0) {


    std::cerr << "SDL initialization failed: " << SDL_GetError() << std::endl;


    return -1;


    }


    // Open a game controller


    SDL_GameController* controller = SDL_GameControllerOpen(0);


    if (!controller) {


    std::cerr << "Failed to open game controller: " << SDL_GetError() << std::endl;


    SDL_Quit();


    return -1;


    }


    // Game loop


    while (!quit) {


    while (SDL_PollEvent(&event)) {


    if (event.type == SDL_QUIT) {


    quit = true;


    } else if (event.type == SDL_CONTROLLERBUTTONDOWN) {


    // Handle game controller button press


    SDL_GameControllerButton button = (SDL_GameControllerButton)event.cbutton.button;


    // Process button press


    }


    }


    // Update game logic and rendering here


    }


    // Close the game controller


    SDL_GameControllerClose(controller);


    ```


    In this code, we initialize SDL with game controller support and open the first
    available game controller. We then handle `SDL_CONTROLLERBUTTONDOWN` events to
    detect when a button is pressed on the gamepad.


