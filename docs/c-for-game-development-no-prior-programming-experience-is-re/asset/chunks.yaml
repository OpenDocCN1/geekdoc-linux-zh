    void displayPlayerInfo() {


    std::cout << "Player Name: " << playerName << ", Level: " << playerLevel << std::endl;


    }


    private:


    std::string playerName;


    int playerLevel;


    };


    int main() {


    // Creating objects of the Player class


    Player player1("John", 5);


    Player player2("Sarah", 8);


    // Using object methods to display player information


    player1.displayPlayerInfo();


    player2.displayPlayerInfo();


    return 0;


    }


    ```


    In this example, `Player` is a class representing a game player. It has attributes
    like `playerName` and `playerLevel`, and a method `displayPlayerInfo()` to show
    player details. Objects `player1` and `player2` are created using the `Player`
    class constructor, and their information is displayed using object methods.


    Encapsulation and Data Abstraction


    Encapsulation is the bundling of data (attributes) and methods (behaviors) within
    a class, restricting direct access to data and providing controlled access through
    methods. This concept enhances data security, code modularity, and reduces dependencies
    between different parts of the codebase.


    ```cpp


