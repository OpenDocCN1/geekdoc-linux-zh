    ### OpenGL 简介


    OpenGL 是开源图形 API，提供了一组用于渲染 2D 和 3D 图形的函数。它允许开发者直接与 GPU（图形处理器）交互以创建视觉效果出色的图形，使其成为游戏开发的热门选择。


