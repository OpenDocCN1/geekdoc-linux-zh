  \ 800, 600, SDL_WINDOW_SHOWN);\n    if (!window) {\n        std::cerr << \"Failed\
  \ to create SDL window: \" << SDL_GetError() << std::endl;\n        SDL_Quit();\n\
  \        return -1;\n    }\n\n    // 创建渲染器\n    SDL_Renderer* renderer = SDL_CreateRenderer(window,\
  \ -1, SDL_RENDERER_ACCELERATED);\n    // 游戏循环\n    bool quit = false;\n    SDL_Event\
  \ event;\n    while (!quit) {\n        while (SDL_PollEvent(&event)) {\n       \
