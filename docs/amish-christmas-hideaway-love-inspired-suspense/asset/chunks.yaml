    “现在你背后有了援军，就想办法要把我打掉？”


    “不，只是给你个台阶下。”


    “我已无法回头了，”他回答道。他看向艾丽莎（Alisha），脸上带着怀疑。“我不喜欢把事情交给当局。”


    艾丽莎以一种全新的眼光审量着他。“连神也吗？”她问道。


    “即使是那样，”他回答道，他的表情告诉她，他为了保护爱的人可以翻天覆地，“但因为你，因为神，因为我的父母、你的祖母和 C 太太，我正在学习重新信任祂。”


    艾丽莎听后笑了，未流出的泪水在眼眶里打转。“我觉得很有意义。非常重要的意义。你意识到了家庭和信仰的价值。”


    他的目光掠过她，眼神中透出的宁静告诉她，这几天来他发生了变化。他为了她付出了代价，而在在这个过程中，他的信仰也完成了一个轮回。


    ### 调查


    汽车停在镇上一个普通区域的一条安静排屋街上。“我会送你到门口，”巡逻警说，“然后你就会由我们最专业的人来照顾了。”


    在联排别墅门口，迎接他们的是一名女警，看起来她单手就能摔跤。“我是`Milly`，”红发女性露出勉微的微笑，“全程我都会陪着你们。”


    “全程？”内坦（Nathan）问道，显然并不高兴`Milly`用缓慢的语气解释道，就像在对小孩说话一样，“有两个带防弹窗的卧室。但不要靠近它们。两个浴室和一个客厅。我会坐在门厅里，那里可以清楚地看到街道。”


    “谢谢你，警官，”艾丽莎说，看着那个高个子抬起下巴走向岗位。“别试图离开，”`Milly`对着她的背说道，“后门也有守卫，我们每小时都有一次巡逻。”


    在`Milly`关上门厅的门并在折叠椅上就位置后，内坦转向艾丽莎。“他们就像在把我们当人质。“他们是在试图救我们的命，”她提醒他道，“别这么郁闷。”


    “他们让你处了险境，”他一边走动一边回答道，“但你做得很好。”最后，他打开冰箱，找到了冷鸡肉和水果沙拉。“你需要吃点东西。你也得放松一下，”她告诉他。“我现在感觉好多了。我们刚才只是在那里随波逐流。“我想是吧，”他说，把食物拿到柜台上。然后他找到了面包和奶酪。


    ### 夜幕


    “这是一份不计回报的工作，”她回答道，一边撕下鸡肉一边咬着葡萄。疲惫感袭来，让她想蜷起来睡好久。但她认为好觉可能永远不会到来。内坦递给她饼干，转身去冲咖啡。“我不信任这里的任何一个人，”他承认道。“休息吧。我们不知道明天会发生什么。”


    艾丽莎完全理解这一点。“我不认识`Scott Kincaid`（斯科特·金凯德），”她说，拿起公文包。“很高兴你能把这些带回来给我。现在我们在躲藏期间，至少可以有事可做了。”


    她抬头时，恰好看到内坦眼中的觉察。`Milly`会对此皱眉的，不会。那一刻过去了，他说：“看看我们能找到些什么——吃完饭换好衣服之后。”艾丽莎看了看自己的打扮。“真的不想看了。”在那的一瞬间，她希望自己能回到内坦的童年时代，享受冬日夜晚的宁静，手牵着他的手。但那只是梦。一个她在这里永远无法拥有的愚蠢梦。


    沉默像一根无法折断的丝线在他们之间延伸。艾丽莎想把他拥在怀里告诉他休息，但她知道那样会越过那条拉扯着他们的橡皮绳线。


    “好了，晚安，内坦。”


    他站起来送她到她的房间门口。“你真的怎么样？”


    “那什么意思？”


    “我担心你。”


    “我很好。我活着，没有放弃。”


    他一只手撑在门框上，眼睛直盯着她。“好。”


    他想多说些什么？


    “内坦？”


    他伸手摸摸她的头发，说道：“休息吧。我们不知道明天会发生什么。”


    ### 事件


    内坦听到“砰”的一声，接着是一声尖锐的撞击声。从床上跳起来，抓起枪走进书房，月光让他能进行快速搜索。艾丽莎走出卧室，还穿着她留在公文包里的`牛仔裤`和`卫衣`。


    站在我身后，”他低声说。“我觉得有来客了。”


    吃完饭洗完澡后，艾丽莎换上了她留在公文包里的`牛仔裤`和`卫衣`。“我们的衣橱真的很匮乏，”他走过空旷的书房说，一盏灯发出的微弱光线让他们看清彼此。“但我可以习惯在这里，”她回答道。“洗完澡感觉好点了吗？”


    他闻起来很好闻——干净清新，留着湿润且无法理顺的头发。她也被他吸引了。为了转移对此事的注意力，她盯着笔记本电脑屏幕。“我找不到关于`Scott Kincaid`的任何信息。名字出现了，但通常是国家其他地区的人。就我所能找到的范围内，费城没有这类人。”


    “可能是另一个化名……或者他被清理干净了。”


    “你是说从互联网上抹除了？”


    “是的。这种事发生过。隐匿了。”“为什么？”她问。“我知道他是个罪犯，但他到底有什么特别的？”你觉得他可能是那天晚的司机吗？你听到他们中的任何一个人说话，或者叫某个名字吗？”


    “没有。他们没说话。只是停下，开枪，然后立刻离开了。“但他们一直盯着你，所以这意味着他们一定在附近。是的，但警察现在应该已经在监控录像中发现他们了。我确定他们躲在大眼皮底下。”


    放下笔记本电脑，艾丽莎打了个哈。“我觉得我真的困了。”


    “那你应该休息了，”他说，他的眼睛是深邃的海蓝色。“我会熬一会儿。让`Milly`歇会儿。”


    “只要记住，”她喊道，“沙发我约了。”


    他听后笑了。“好啦，糖熊，去睡觉吧。”


    艾丽莎做了个鬼脸。“你不会让我忘记那个的，对吧？”


    “我永远不会忘记，不。”


