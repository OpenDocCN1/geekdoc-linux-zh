    Nathan didn’t respond with words, but his expression softened and shifted and
    for a brief moment, he looked like the boy she remembered.


    Confused and too aware of him, she read over the names of the men, thinking about
    their clothes and faces. “I hope we get a hit on one of these men. They’re relentless.”


    “The one they’re guarding in the hospital should be easy to identify, even the
    name `Scott Kemp` has to be an alias. They’ve got his prints so that might get
    a definite hit. Since we can’t get online here, I hope we hear soon.”


    Nathan leaned close. “After Christmas, I think we should go back to our plan and
    head into Philly. We can meet with the real `FBI` there. We’ll have to be careful
    and we’ll have to stay in disguise.”


    She glanced at his mother, wondering if she could hear them. “This is a federal
    case and we need all three of these men in custody. If I can identify one or more
    of them, I’ll become a federal witness. I can’t withhold what’s been happening
    here any longer.”


    “Okay, so we plan to do this as our next step. But after Christmas. My folks will
    go visiting the day after tomorrow and they could have lots of visitors, including
    my brothers, the next day. We’ll stay here after they leave and then we’ll find
    a way to get to Philly.”


    “Okay, but I’d like someone from my firm there to represent me and guide me through
    the interrogations.”


    “Good idea.”


    It sounded like the best solution. Her firm could put law clerks on this and hire
    people to help protect her. She couldn’t stay here indefinitely and keep putting
    both of their families in danger.


    “I’ll call my boss first thing day after tomorrow,” she said. “Let him know I
    do need his help.” `Mitchell Henderson` would meet them in Philadelphia if necessary.
    Having someone she trusted to represent her would be wise.


    “Are you two finished plotting over there?” Martha asked, her expression neutral.
    “I need help with a few things.”


    “Yes, Mamm,” Nathan said. “I hope we didn’t disturb you.”


    “You did not,” his mother replied. “But this subject matter is terribly disturbing.
    I want you both safe.”


    Nathan got up to help his mother put away some food and baking dishes. “We’ll
    let this go until after Christmas,” he said, giving his mother a reassuring smile.


    Martha touched a hand to his jaw. “I think that is a `gut` plan, Nathan. Tomorrow
    we celebrate not only the birth of our Lord `Jesus`, but we also celebrate the
    return of our oldest son.” Then she added, “If you can’t stay for Second Christmas,
    I understand.”


    Alisha couldn’t help but hear. Second Christmas was always the day after Christmas
    where more casual visits took place, but still with lots of food and festivities.
    A visiting day, but the best time for them to leave since the roads would be bustling
    with Amish buggies.


    After they’d helped Martha move the table to add more chairs in case they had
    visitors tomorrow, Nathan turned to Alisha. “I’m going to try and reach `Carson`
    and bring him up to speed. I’ll be right outside.”


    “Okay. Be careful.”


    “I’ll hide in the corner of the porch where the house takes an L-shape.”


    She smiled. “Watch out for Santa.”


    Watching him go, she let her heart do that little jumpy thing it seemed to want
    to do whenever he was near. She’d tempered her feelings for Nathan a long time
    ago, but even in the midst of fear and danger, he still made her heart beat too
    fast. He was her protector, her friend, someone she’d fallen in love with years
    ago and someone she’d tried to put out of her mind since. She’d never dreamed
    he’d come back into her life in such a big way.


    She’d never dreamed anything like this could happen to her. Up until now, she’d
    been self-involved and focused on her work, lonely at times, but content and fulfilled.


    She now appreciated all of that and more.


    “`Kumm` and sit with us for a while,” Martha said. “I have a few books and devotionals
    by my chair if you’d like to read a bit.”


    “Thank you.” Alisha sat down across from them. “And thank you for everything.”


    `Amos` looked up at her but didn’’t speak. Martha nodded and glanced toward the
    door. “I am thankful you are both alive and well and here with us.”


    Alisha lifted one of the books off the table. A midwife story. That made her think
    about Nathan and marriage and children and...things she shouldn’t be considering.
    Pretending to read the book, she instead held a vision of Nathan holding a child
    in his arms. He’d make a good father.


    When Nathan came through the door, she exhaled the breath she’d been holding.
    Would she ever feel truly comfortable around his family? His folks, obviously
    feeling the same way, said good-night and went upstairs to bed, leaving them alone.


    “Want to sit by the stove?” he asked, motioning her over to where the wood stove
    still held some heat.


    Alisha didn’t know why all of a sudden she felt shy around him. They’d been together
    for days. But it was too quiet here, too silent to hide the awareness that seemed
    to be simmering right below the surface of their fatigue and apprehension.


    She sat in the cushioned rocking chair his mother had vacated, the scent of the
    locally made cinnamon candle sitting on a shelf still lingering in the air. “Did
    you talk to `Carson`?”


    He hesitated and then nodded. “Yes. First he told me that my truck is being watched
    `24/7`.”

