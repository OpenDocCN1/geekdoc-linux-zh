    “你已经做了唯一能做的事——你逃脱了。对于现场去世的那个人来说，可能已经太晚了，希望另一个人也不会没事。”


    他不想让她也遭遇同样的命运。


    “这也会上新闻的。他那可怜的家人。在圣诞节失去了他。也许我应该回到雷丁（Reading）的。”


    “不。”纳坦（Nathan）无法告诉她，他很高兴见到她，很高兴能帮她。“不。你现在需要和家人在一起。”


    她点了点头，低着头。


    “告诉我你今晚看到了什么，”他用温柔的语气说道，希望自己能触碰她，抱住她，让她感觉好受些。


    但这将是他想过的最糟糕的主意，而他有时确实想过一些不妙的主意。


    她点了点头开始说话，声音紧绷而疲惫。等她说完后，纳坦无法自持了。他伸出手握住了她的手。这闻起来像是一场职业暗杀。但在他进行一些调查之前，他不会告诉她。


    “目前来说，你在`Campton` 是安全的。”


    她盯着他的手，然后缩回了自己的手。“当然。那里很稳妥。”


    “那具体是什么意思？”


    “这意味着我们会在一起，”他轻笑着回答道，“因为我会呆在那里，直到我们找到那些杀手。”


    # 三


    “噢，不，”艾丽莎（Alisha）回答道，他这句话带来的震惊席卷了她的身体。“那是不会发生的。”


    “会发生的，”他反驳道，绕开了她原本打算走的所有小路。“我不会丢你一个人。”


    “我会是一个人的。我有我奶奶和`Campton`。”


    “没错。两个需要坐电梯才能下楼的老妇人。”


    他说得对，但艾丽莎还没准备好妥协。“还有良好的安保系统。”


    “这有帮助，但我们都知道罪犯可以避开这些。”


    没错。但艾丽莎不想让他流连于此。是的，她在恐慌的时刻叫了他，但理性正在占据主导地位。“我不愿意坐等看会发生什么。你愿意吗？”


    她摇了摇头。“不。在圣诞节后回到`Reading` 之前，我还有一周时间。”


    “给你你的老板打电话，把时间改成两周。只要到元旦为止。”


    “我做不到。”


    “你可以的。解释一下情况。休个假。”


    “我会利用分配的时间，并会用这段时间去追踪那些杀手。你应该意识到圣诞节不是工作的时候，对吧？”


    “是的。但在假期前五天目睹持枪歹扫射市场，确实有点让人扫兴。”


    “你会把真相告诉那些女士吗？”


    “我必须这样做，”她说，对这个想法感到厌恶。“她们需要被警示，这样才能保持警觉。”


    “她们需要保护。也许我应该住在别的地方。不，这是目前最好的计划。但是艾丽莎，无论你喜不喜欢，我都会和你们住在一起。我知道主房子里有几间额外的卧室。我会睡其中一间。”
    这是一个坏主意。可为什么仅仅知道他在附近，她就感到更安全了？


    因为她感到恐惧、震动以及……她需要他的帮助。纳坦·克雷格（Nathan `Craig`）工作很出色，他可以去别人不敢去的地方。他能找到人。好人。害怕的人。迷失的人。有时还有那些最坏的人。


    “我能看到你脑子里在转主意，”当她没有立刻反驳时他说，“你在想什么？”


    当他们转入 `Creek Road` 时，她转头盯着他。“我没有多少选择。我需要你——我是说我需要你的经验和专业知识。”她的大脑告诉她要理性，而她的心在尖叫她确实需要他。她一直需要他。但从大四毕业后的那个夏天第一次见到他起，她一直在压抑这种需求。很有意思，在他生命的大部分时间里他都在她生活的边缘。在身边，却总是遥不可及。曾经，他们很亲密。青梅竹马。但他们现在都是成年人了。专业身份，正在处理案件。仅此于此。因为他们中没有人都可以付出。今晚，他救了她。艾丽莎无法忘记这一点。


    “别担心，”他语气紧绷，仿佛他完全清楚她在想什么。“我会避开你的。我有足够的事情让自己忙。”


    正义。这个男人总是想要正义。


    嗯，她也一样，但她可没计划通过纳坦的帮助获得正义。她不想在假期里追捕杀手，但她的直觉告诉她，那些凶手会继续追捕她。


    “我也会很忙的，”她说。“我只想结束。”


    “你指的是这起谋杀案，还是指被迫留在我身边？”


    “两者都是，”她承认道。


    纳坦把卡车停在那座寂静、阴森的房子前，熄灭了引擎。“我们得叫醒她们，我需要把我的车停在车库里。”艾丽莎盯着那座装饰有白色圆柱的宏伟红砖豪宅，一排排高窗户现在看起来很脆弱，而不是慰藉，门上巨大的常青花环环让她想起她在这里度过的所有节日。


    今晚有太多的回忆了，再加上纳坦就在她身边。巨大的疲惫和冲击感撞击着她的灵魂。“好。让我们进屋吧，做我们该做的事。”

