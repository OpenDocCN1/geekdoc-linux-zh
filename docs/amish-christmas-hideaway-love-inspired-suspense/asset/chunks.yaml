    They’d been given a reprieve. One Alisha did not want or deserve. But Nathan needed
    this time with his parents, so she remained quiet.


    Nathan watched as his father walked out of the room and then shifted his gaze
    toward Alisha. “How are you?”


    “A little wobbly,” she said, holding onto the wall.


    “Come and sit at the table,” he said, taking her arm.


    She didn’t argue. The smell of strong coffee captured her attention. Spotting
    the coffeepot, she refused to be rude and beg for a cup.


    Nathan read her mind. “Mamm, may I pour Alisha some coffee?”


    “*Ja*,” his mother said. “Where are my manners?”


    Her tone was kind but hesitant. It had to be difficult, seeing her son again under
    such extreme circumstances.


    “I’d so appreciate that,” Alisha said. “I can’t believe how long I slept.”


    “You were in a bad way,” Martha said after she handed Nathan two cups of coffee.
    “You slept through Nathan’s complaining about me cleaning his wound.”


    “It burned,” he admitted with a smile. “But Mamm knows her way around an injured
    son since she has three.”


    “*Ja*, ain’t so?” His mother chuckled and then offered Alisha a warm biscuit with
    a smear of apple preserves. “To tide you over until supper.”


    Waiting until she’d sat down at the long wooden table, Nathan took the coffee
    his mother offered and sat across from Alisha. “I got word to Carson about our
    intruders. He found out the officer in the deer stand in the woods was injured
    but managed to call it in. Two officers arrived at the cabin not long after I
    left but the snow became so heavy, they called it a night on doing a search.”


    Alisha remembered that thick, cold snow. Thankful for the warmth flowing around
    her now, she asked, “Are you okay?”


    Nathan nodded. “I’ve been through worse.” Then he went on with his report. “I
    gave Carson the names they used so based on their descriptions and the names,
    they’ll run a check. Searched the woods as they backtracked toward the road and
    found one man. He’s in a hospital nearby, under custody, but refusing to offer
    up any information.”


    Lowering her voice while his mother went about her chores, she whispered, “Obviously,
    they didn’t find the other two.”


    “No. But they found a blood trail from the one in custody. That might give them
    DNA for evidence against him at least. And they think they spotted the dark pickup
    the men were driving.”


    Alisha let go of a shiver. “I don’t feel comfortable here.”


    “And you’d be better off out there?”


    Martha called to them. “Let her eat in peace, Nathan.”


    Alisha dropped things for now and nibbled on the biscuit. It was good but she
    couldn’t seem to get much of it down.


    Martha looked at her son. “Nathan, would you go and find your father? Supper will
    be ready soon.”


    Nathan hesitated and then did as his mother asked.


    After he’d gone out the back door, a blast of cold air sneaking through before
    he shut it, Martha turned to Alisha and pointed to a stool. Then she brought her
    own cup of tea over.


    “I think this is a good time for you and me to have a nice talk, Alisha Braxton.”


    Alisha didn’t know whether to run back to the bedroom or just head out the front
    door and meet her fate.


    Martha waited, a slight dare in her blue eyes.


    “Of course, Mrs. Schrock,” she said, taking the stool.


    # FOURTEEN


    While he wondered how his *mamm* and Alisha were faring alone at the house, Nathan
    silently helped his father check on the animals and freshen their hay. The horses,
    milk cows and goats had mostly been fed their big meal early this morning, depending
    on their feeding schedules. His father had an internal alarm clock that had him
    up before the sun, checking on animals and going about the work of the farm. Unable
    to sleep earlier, Nathan had watched his *daed* out the window from his old room
    upstairs. He hadn’t gone down then, afraid his father wouldn’t want him to help.


    But now, he’d gotten beyond his earlier hesitance. His *daed* might resent him
    being here and disapprove of all that Nathan had become, but he was home and Christmas
    was coming in a couple of days. Time to find the courage to face his father.


    So here he was doing the chores that came back to him as easily as eating his
    mother’s pancakes. And all the while, scanning the horizons and the edge of the
    woods for any lurkers or intruders. He’d not seen any trucks roaming the road
    but he had to wonder who could be lurking just beyond the hills and valleys.


    But the land sat settled and quiet, as old and comfortable as the clothes he’d
    borrowed and wore now. No signs of anyone waiting to attack. He hoped things would
    stay quiet for a while.


    Once Amos seemed satisfied with the animals, he moved on to the chicken coops
    to make sure the hens were warm and safe. The ornery rooster chased after Amos,
    but his father ignored the arrogant bird. Nathan followed, waiting for his silent
    *daed* to speak.


    Amos moved on to the woodpile and grabbed an ax.


    He offered it to Nathan, who, surprised but pleased, took it and watched as his
    father found another. Together, they began to chop wood to use to back up the
    propane tanks they kept to run appliances. His mother still loved her wood stove
    and used it during the worst of winter.


    “Christmas Eve is tomorrow and then we have Christmas and visiting day after that,”
    Amos said, pointing out the obvious. “You can stay through Christmas but I expect
    you to honor your faith by not bringing the *Englisch* violence into our home.”


    “I will do my best to keep this situation nonviolent.”


    “What if these men show up here, Nathan?”


    “I’ll lure them away from the house and keep everyone safe.”


    He hoped. He’d have to find his weapon and create a distraction. But Nathan decided
    he’d fight that battle when it came.


    “How does the violent work you do honor the Lord?”


    “My work isn’t always like this,” Nathan tried to explain. “I’ve helped a lot
    of people, mostly Amish, locate their kinfolk. I also help solve crimes by finding
    the truth.”


    Amos looked out over the fields. “Such as this one?”


    “Yes, such as this one.”


    Following his father’s example, he placed a round log on the chopping block and
    then looked at his father. “I never stopped honoring God. I just do it in a different
    way now.”


    The *Englisch* way,” Amos said, hitting wood so hard it easily split into kindling.


    “Yes, different traditions but the same God.”


    “So you attend church regularly?”


    He had Nathan on that. “When I can.”


    “When you are not out there searching for evil people?”


    “Or missing people.” Nathan couldn’t admit he hadn’t darkened a church door in
    a long time. “Yes, when I can,” he repeated.


    “Your mother has missed you.”


    Chop, split. Chop, split.


    “I’ve missed all of you, too.”

