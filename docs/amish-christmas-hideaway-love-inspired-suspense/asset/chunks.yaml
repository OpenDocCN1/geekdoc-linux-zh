- fmt: '

    Nathan could never forget the shattered look in her misty eyes nor the pain and
    shame he’d seen on her face as they stood in the park one last time.


    “You still have me, Nathan.”


    “No, I can’t be with you now. Not like this.”


    She’d started crying but she didn’t beg him to stay. No, Alisha took matters into
    her own hands. “Then you won’t have me in your life anymore. I won’t be a reminder
    of what has happened. I can’t live with your resentment.”


    With that, she’d turned and ran back toward Campton House. He had not seen her
    again until a couple years ago when the Admiral had died.


    ## The Decision


    The dedication of Campton House as a community center. If he could take it back...
    He’d said some awful things that night after they’d heard Hannah was found. Today,
    he’d said another thing to her. He didn’t want to share this torment. He’d held
    it around his heart like armor. She had become a martyr of sorts, pushing away
    the world he’d longed to be part of and shutting out those who loved him most.


    When would he stop himself? And her? Nathan texted Carson and told him he’d be
    in the office. A knock at the front door brought Nathan out of his dark thoughts.
    Carson came in, the cold behind him. More tonight so the bullets and casings they
    found will provide something to work with.


    But no sign of the shooter? He must have taken a rowboat up the creek to get here.
    Then once he was fired, he had to jumped in the boat and paddled away to hide
    out across the shore. They went around to search and ask if anyone had seen him.
    Got nothing But several people did hear the shooting. Pretty hard to hear in such
    a quiet place. Look, Nathan, I have a suggestion.


    ## The Plan


    Word will spread and more people will come. The press is hot for a grisly story
    and this one fills the bill. “So? I think you and Alisha should go deeper into
    hiding. Where do you think we should go?” Carson scratched his head and stared
    into Nathan’s eyes. The last place killer would look for you is Amish country.


    Nathan pointed out, “We are in Amish country. I mean all the way in. Dress the
    part, play the part, find someone you can trust to hide. The Amish don’t condone
    violence and dishonesty. It’s already here.”


    “And about Betty and Mrs. Campton? Those won’t leave but the town police can patrol
    the grounds and night.” Then he shrugged. “And what I’ve heard today, I’d say
    the women can hold their own if push comes to shove.”


    Nathan turned toward the fire and stared at the flames. “Alisha won’t like this.”


    ## NINE


    They both looked up to find Alisha standing in the hallway, her eyes full of questions
    and her expression full of stubbornness. “Nathan, what’s going on now?” Alisha
    saw the look that passed between the two men. “One of you better start talking.”


    Nathan scratched his head and turned to her. “We need to go into hiding away from
    Campton House. I couldn’t agree more but you both told me this is the safest place
    for us right now.” Nathan replied, his eyes stormy blue. “But they breached the
    estate from the water today and they’ll find another way.”


    “Then what’s the plan?” she asked as she stepped close to the fire, her shivers
    coming from a clawing hand. “Where are we going?” Nathan looked uncertain and
    Carson stared at the floor. “Carson thinks we should hide in plain sight—within
    the Amish community.”


    Alisha’s shock returned with a jolt. “What? And put more innocent people in harm’s
    way? I wont to do it. I’ll go back to Reading and rent a hotel room. Or I’ll head
    straight back to Philadelphia.”


    “You can’t do that, Alisha. They’ll track your every move. And they wont to that
    here? Out there, they have a better chance of finding you,” Nathan said, his gaze
    beseeching. “The Amish wont to condone violence or danger but they will protect
    someone in need.”


    “There has to be a better way,” she said. “A safe house somewhere. The Amish community
    is safe,” Carson finally said. “If we find the right family and you two can blend
    in and follow the rules, you should be fine.”


    “But how will we find the right family?” Alisha paced by the fire, her boots hitting
    the hardwood floor. “I’m not doing this. It’s not right to put a family in jeopardy.”


    “There is one other option,” Nathan said, his eyes on her. She stared him down
    while Carson looked confused. “I’m listening.”


    “I can take you to my cabin.”


    That halted Alisha in her tracks. “What?” Carson ran a hand down his five-o’clock
    shadow. “I don’t know—”


    Nathan held up his hand to stop both of them. “It’s on the fringes of the Amish
    community, deep in the woods. Few people even know it’s there. We can dress to
    look Amish and sneak out after dark.” He nodded to Alisha. “I know you keep Amish
    clothes here, as needed.”


    “You know too much,” she retorted, the thought of going deep into the woods with
    this lone wolf scaring her in a different way. “But yes, we have the proper clothing.”


    Carson put his hands on his hips. “You can’t take your vehicle. They might have
    seen it here before you hid it in the garage. We’ll walk,” Nathan said. “We’ll
    bundle up and keep to the paths, not the main roads. My cabin sits about three
    miles from the main road. They can watch of anything happening.”

