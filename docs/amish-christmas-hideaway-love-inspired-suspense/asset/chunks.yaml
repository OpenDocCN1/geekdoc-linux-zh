    and feel of her alive made him want to never let go. “We’re fine. What happened?”


    She quickly caught him up. “We had to find a way to escape. We were hiding but
    he kept trying to get in.”


    “Stay here.” Nathan went over to where the man lay unconscious, bending to check
    his pulse.


    Alisha joined him while Martha stayed close to Amos. “Is he alive?”


    “Yes. But he’s probably going to be in a lot of pain when he wakes up.” The two
    drafts circled back around and together his parents guided them back to the barn.
    “I need to call this in and get an ambulance out here.”


    “So now we’ll have two suspects in the hospital.”


    “Yes, and behind bars after that. If we can hold them long enough to make them
    talk.”


    When he stood, Alisha touched his arm. “Nathan, this ends now. Hiding out isn’t
    going to stop this. Tonight was another close call.”


    Nathan nodded and pointed to the ground. “Yes, too close.”


    Alisha gasped as she spotted the silencer on the gun the man had been carrying.
    “I knew he had a silencer. He tried to shoot out the barn door.”


    “A professional,” Nathan said. “He’s been watching for days and today, I gave
    him the perfect opportunity.”


    “Enough,” Alisha said. “I’m leaving here with or without you and I’m going straight
    to the Philadelphia police and I’m calling the FBI field office to tell them I’m
    alive and well and ready to tell them what I know. We need to stop running and
    since that was our next plan and our best plan, I have to cooperate.”


    Pulling out his phone, Nathan realized he’d failed her yet again. He’d tried to
    protect her but she’d been close to death several times now. When would he learn
    he couldn’t save anyone on his own? Not his sister and not even Alisha.


    He hit numbers, but his heart cried out to God.


    *As the deer pants for water, so my soul longs for you, O God*.


    Nathan couldn’t do this alone. He needed God with him.


    And he needed Alisha with him, too. He’d been denying that for years now.


    After calling the authorities, he turned to where Alisha stood shivering in the
    cold. “The police are on their way with an ambulance. Let’s get you inside.”


    “What about him?” she said, staring over at the man on the ground.


    “I’ll stay here until they arrive. We shouldn’t move him.” Then he checked the
    road. “We need to keep this low-key.”


    “You might need this,” she said, her voice stronger now.


    Nathan looked down to where she held his gun against her cloak.


    “I didn’t fire it,” she said. “But I would have.”


    “I know,” he replied. “It’s time to get you somewhere safe.”


    “Yes, a place that won’t bring anyone else we love to harm.”


    # EIGHTEEN


    Why was going away so hard?


    Alisha looked into Martha Schrock’s sweet eyes and saw the pain of a mother watching
    her son leave yet again.


    “I don’t know how to thank you,” she whispered to Martha as they huddled near
    the door watching for the unmarked car to arrive.


