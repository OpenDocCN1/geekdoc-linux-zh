  trans: '


    在两人都是青少年末期时，曾在溪边的一处公园相过面。


    那时候的内坦还是个安米士人。


    现在的内坦，在为这个世界伸张正义时已毫无顾忌了。


    他不再住在安米士人社区，但在近十五年的时间里，他将帮助和保护安米士人视为他毕生的事业。因为他必须帮助他人寻找亲人，这样他们就不必再承受他内心深处的痛苦。


    在内坦和父亲因为他与艾丽莎的关系发生争吵后，他的妹妹失踪了。几周后发现了汉娜的死体。


    内坦归咎于自己。艾丽莎也带着同样的负疚感生活。


    她不该在今晚给他打电话的。她的生活井井有条，有自己的规律，工作努力，很少社交。她学会了做自己的英雄。因为她再也不想经历那种痛苦了。


    内坦可能会让这一切变得复杂。


    他也可以救她的命。


    艾丽莎再次检查了后视镜，试图保持冷静。她知道如何照顾自己。她已经向警察做了陈述，详细描述了她看到的车辆和男人，给警员和探员留下了联系方式，并获得了离开许可。


    “布克斯顿小姐，你还好吗？”那个惨剧现场的一名探员曾问过她。


    “回到我奶奶那里就没事了，”她回答道，环顾空旷的停车场。在犯罪技术人员搜查现场之前，市场一直处于关闭状态。那时当局已经问了所有证人，但大多数人只是听到了枪声，看到一辆
    SUV 驶出停车场。


    艾丽莎是那场谋杀案唯一的目击者。


    “我们可以提供护送，”一名探员建议道。


    “这可能会让我感觉好些，”她承认道，“离这里大约有两个小时车程。”


    他们安排了一辆有两名警的巡逻车跟随她，保持距离。她通过后视镜看着他们的车，感到很安全，直到她听到轮胎的摩擦声和枪声。


    然后她看着巡逻车冲出道路，撞入一片岩石斜坡。车辆燃起了大火。


    现在她为那两名警官祈祷，但她心里清楚他们可能死了。如果车祸没有杀死他们，枪手也会确保他们死去。


    下一个就是她。


    *快点，内坦。*


    当她看到一辆车靠近时，艾丽莎倒吸一口气，看着它快速逼近。深色、巨大、正在追上她。


    艾丽莎不知道后面是谁，但司机脚法很大。在进入另一个弯道时，她扫了一眼后视镜。那辆大车仍然在追赶她。


    然后她看到远处另一辆车的车灯，正从相反方向过来。她的出口在前方，但迎面而来的车可能是沿着原路折回的 SUV。她能在两辆车追上她之前逃脱吗？她必须加速并猛向右转。再次检查，她估量了距离并监控着迎来的车辆，希望在向右转弯之前超过它。与此同时，她祈祷身后的车辆会继续往前开，而不是跟踪她。


    夜色漆黑多云，可能有一场暴雪正席卷整个州。在这里，几乎没有路灯，山丘和山谷看起来不祥且形状扭曲。丝带般的道路蜿蜒、回旋，像一条巨大的灰色巨蛇。


    身后的车辆加速了。当它近到可以碰触她的保险杠时，艾丽莎倒吸一口气，紧握方向盘，准备迎接碰撞。但车辆并没有撞上她。司机保持着距离，但从未发生接触。


    现在，或那时。


    艾丽莎深吸一口气，握住方向盘寻找出口。随后，随着一次祈祷和又一次深呼吸，她减速到足以将车轮右转，进入那条窄路。她的车摇晃着并甩尾，她在努力保持控制时，心脏剧烈跳动。如果她失控了方向盘，她就会冲进深沟。或者更糟，撞向岩坡。


    神经紧绷的艾丽莎设法找回了对汽车的控制并留在道路上。她舒了一口气，集中精神，看向后视镜。令她失望的是，那辆从相反方向驶而来的车现在正在跟踪她。


    他们找到她了。


    # 第二章


    内坦再次击打方向盘，希望艾丽莎的手机还能用。她的电池可能终于耗尽了。他联系不上她。但在跟踪她两英里后，他抬头看到另一辆车正从山坡朝他们开来。


    接着，他惊恐地看着艾丽莎一个急右转，在看着她的车剧烈失控时，他的心几乎停跳了。


    她离开了主路，正当他准备跟随她时，一辆从相反方向来的黑色大 SUV 转进入了她刚刚经过的路线，冲到他的卡车前面挡住了内坦。


    “不。”内坦猛刹车避免碰撞，然后再次踩下油门。“你在哪，卡森？”副警长现在应该到这里了。卡森也应该通知小镇警察，因为他没有逮捕权。


    但如果那些人看到副警长跟踪他们，他们也可以向卡森开枪。


    *主，请保护我的朋友。*


    这无声的祈祷在内坦脑中显得既陌生又生涩。他最近很少祈祷，但他内心深处依然相信。现在，他需要主听听他的声音。


    艾丽莎需要他。他必须去接她。


    他滑入出口，留意艾丽莎的车去了哪里，每当回到这个曾经称之为家的地方，他的心不由得那样跳动。


    '
- fmt: '

    Carson ended the call and sped around Nathan to alert the town police up on the
    main road out of town. Nathan watched the road ahead. His friend had the authority
    to stop them for speeding if nothing else. But these people were dangerous. Carson
    shouldn’t take that risk. Smarter to get the police out here.


    Nathan focused on the vehicle behind Alisha. The big vehicle bumped against Alisha’s
    car. The driver tried to force her off the road. Nathan gunned his truck, thinking
    he’d smash into the other vehicle.


    Too late.


    He watched in horror as the SUV bumped hard against Alisha’s sedan again. Unable
    to help, Nathan shouted as her tiny car went spiraling across the road and headed
    into a deep ditch.


    “No,” Nathan said, slamming on the brakes as he came up on the scene.


    The SUV took off, speeding away. The town police should be waiting up ahead. Nathan
    had to check on Alisha.


    Nathan put the still moving truck into `Park`, left it running, and hopped out
    and hurried toward Alisha, pulling open the driver’s-side door.


    Nearly out of breath, he called, “Alisha?”


    “I’m okay,” she said, her hands tight on the steering wheel, her head slumped
    over. “I’m all right, Nathan.”


    She didn’t sound all right. More like out of breath and going into shock. “I’m
    calling for help.”


    “No.” Grabbing his arm, she said, “Just get me out of here, please.”


    He looked at her and then looked down into a dark abyss. She’d somehow managed
    to stop the car against a jutting rock, but most of the car sat nestled against
    an old jagged tree trunk. A rotting and weathered trunk that could give at any
    minute.


    Mere inches away from what looked like a sizable drop-off into a ravine.


    “I’ve got you,” he said. “C’mon, take my hand.”


    She nodded. “My bag.”


    “Okay, grab it. But careful.”


    She lifted the big businesslike leather bag and handed it to him. Nathan set the
    bag on the ground and gently tugged at her. “Turn slowly toward me, okay.”


    She nodded, the car rocking with each movement. Once she twisted and managed to
    put her legs on the ground, the car moaned and slipped another inch into the old
    tree trunk.


    Nathan’s heart slipped right along with the vehicle, his breath caught. That old
    stump wouldn’t last much longer. “On three,” he said. “One, two, three.”


    His hands on her waist now, he tugged her up and out and then pulled her away
    from the now shaking car. With a groan and the hissing of tires and metal, the
    car plummeted against the weak tree trunk, causing the weathered wood to crumble
    into a hundred powder-dry pieces. Nathan held Alisha down, the sound of the car’s
    front right fender scraping against the rock as it slid over the edge of the ravine
    and crashed down below with a last moan. A hard crash and then the sound of metal
    breaking apart echoed out over the hills.


    They fell together onto the grass near the curve in the road. Nathan held her
    close, shut his eyes and took in the sweet scent of her hair.


    “Alisha.”


    She suddenly sat straight up and scooted away from him. “What?”


    He lay there, checking her over, the urge to hold her close still strong. “Are
    you all right?”


    “Yes. But my car... It’s gone.”


    Nathan took in her dark golden hair all scattered and wispy around her heart-shaped
    face. “I’m sorry about that, but I had to get you out. Too late for your car but
    I need to get you away from here.”


    Brushing at her hair and clothes, she let out a long, shuddering sigh. “I still
    owe on that car.”


    Still practical, he thought, his pulse pounding like a jackhammer in his ear.
    “You have insurance?”


    She gave him a nod, her expression blank now. “Did you call reinforcements?”


    “Yes—a friend nearby and the locals waiting down the road. Tell me if you hurt
    anywhere. Did you hit your head?”


    “No. I mean I bumped against something but I’m okay. When they rammed me, I tried
    to steer the car toward a tree. I found a rock and a tree. Bounced a bit. I could
    have died if you hadn’t come along.”


    She was shaken but Nathan knew this woman. Tough and stubborn.


    “Okay, but you did not die.” He stood and offered her his hand. She hesitated
    and then grabbed on while he tugged her up, the touch of her skin against his
    fingers jarring him with a current of awareness. “I called my friend Carson Benton.
    He’s a deputy sheriff who helps me out a lot.”


    “Unofficially, I’m sure. I hope he chased them away.”


    “Unofficially, yes. I hope they don’t shoot him.”


    Looking her over, he took in the boots and straight black skirt, the tan leather
    jacket and black turtleneck sweater. Classy. “Alisha, listen, they don’t know
    you’re still alive. That gives us time. We need to get you somewhere safe, okay?”


    “I’m going to Campton House.”


    Just as he’d thought, and the closest place to hide for now. “Good. Mrs. Campton
    has a state-of-the-art security system.”


    “I know. I told her to get a system installed because of the sensitive nature
    of some of our cases. It serves as a safe house at times, too.”


    “Well, that will come in handy since we have to hide you until I can figure this
    thing out. The longer they think you died in, the better.”

