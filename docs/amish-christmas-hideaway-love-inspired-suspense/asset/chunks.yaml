  raw: '“Trying to get rid of me now that you have the cavalry behind you?”


    “No, just giving you an out.”


    “I can’t turn back now,” he replied. Glancing over at Alisha, he looked doubtful.
    “I don’t like relinquishing things to the authorities.”


    Alisha saw him in a yet another glaringly new light. “Even God?” she asked.


    “Even so,” he replied, his expression telling her he’d move heaven and earth to
    protect anyone he loved. “But because of you and God, my parents, your grandmother
    and Mrs C, I’m learning to trust in Him again, too.”


    Alisha smiled at that, unshed tears pricking at her eyes. “That’s something, I
    think. Something very important. You’ve realized the value of family and faith.”


    His gaze moved over her, a calm in his eyes that told her he’d changed over the
    last few days. He’d put himself on the line for her and in doing so, he’d come
    full circle in his faith.


    The car pulled up to a quiet street of row houses in a modest part of town. “I’ll
    escort you two to the front door,” the patrol officer said. “Then you’ll be in
    the capable hands of one of our best. I’ll let her introduce herself.”


    They were met at the door of the townhouse by a female patrol officer who looked
    like she’d be able to wrestle a criminal with one arm.


    “I’m Officer Milly Sanders,” the redhead said with a tight smile. “I’ll be with
    you for the duration.”


    “The duration?” Nathan asked, clearly not happy.


    “Until further notice,” Milly explained in slow terms, as if she were talking
    to a toddler. “Two bedrooms with bullet-proof windows. Don’t go near them, however.
    Two baths and this small living area. I’ll take the couch to grab some shut-eye
    but mostly, I’ll be sitting out in the vestibule where I have a clear view of
    the street.”


    “Thank you, Officer Sanders,” Alisha said, watching as the tall woman lifted her
    chin and headed to her post.


    “Don’t try to leave,” Milly said over her shoulder. “There’s also a guard at the
    back door into the alley and we’ve got patrols circling every half hour.”


    After Milly closed the glass door to the vestibule and took up her position in
    a folding chair sitting in the small hallway, Nathan turned to Alisha. “It’s like
    they’re holding us hostage.”


    “They’re trying to save our lives,” she reminded him, her fatigue mirroring what
    she saw in his expression. “Don’t be so grumpy about it.”


    “They had you in the hot seat back there,” he replied while he paced. “But you
    did a great job.” Finally, he opened the refrigerator and found cold chicken and
    a fruit salad. “You need to eat.”


    “And you need to relax,” she told him. “I feel better about things now. We were
    just drifting in the wind out there on our own.”


    “I guess so,” he said, dragging the food out to put on the small counter. Then
    he located bread and cheese. “I haven’t been a very good protector.”


    “It’s a thankless job,” Alisha replied as she tore off some chicken and nibbled
    at the grapes and blueberries. A slow fatigue took over, making her want to curl
    up and sleep for a long time. But she didn’t think a good sleep would ever come
    to her again.


    Nathan handed her some crackers and water then turned to make coffee. “I don’t
    trust anyone here either,” he admitted. “The agent perked up when she thought
    you might know Scott Kincaid.”


    “I don’t know him. I just know the name,” Alisha said, grabbing her briefcase.
    “I’m so glad Carson was able to bring this back to me. Now we can at least have
    something to do while we stay hidden.”


    She looked up in time to see the awareness in Nathan’s eyes. Did he have other
    things in mind—holding her close again and maybe kissing her? Officer Milly would
    frown on that, no doubt.


    The moment passed and he said, “Let’s see what we can find—after we eat and change
    clothes.”


    Alisha looked down at her outfit. “I guess we don’t really look Amish anymore.”


    For a brief moment, she wished she was back at Nathan’s childhood home, enjoying
    the quiet of a cold winter evening, his hand in hers.


    But that was just a dream. A silly dream that she could never have even here in
    the *Englisch* world.


    Nathan was tired and so was she. They had to end this horrible nightmare. But
    ending this could also mean the end of them, too.


    * * *


    After food and a shower, Alisha changed into the jeans and sweatshirt she’d left
    in her briefcase and Nathan put on some clothes Carson had brought along with
    the briefcase.


    “Our wardrobes are seriously lacking,” he said as he padded in socks across the
    small sparse den, the muted light from one lamp allowing them to see each other.


    “But I could get used to living in jeans,” she replied. “Feel better after your
    shower?”


    He sure smelled good—clean and fresh with damp hair that couldn’t be tamed. She
    could get used to him, too.


    To take her mind away from that, she stared at her laptop screen. “I can’t find
    anything on Scott Kincaid. The name comes up but it’s usually someone in another
    area of the country. No one in Philly as far as I can find.”


    “It could be another alias...or he’s been wiped clean.”


    “You mean scrubbed from the internet?”


    “Yep. It happened. Gone to ground.”


    “Why?” she asked. “I know he’s a criminal but what is it about him?”


    “Do you think he could have been the driver that night? Did you hear either of
    them speak, call out a name?”


    “No. They didn’t speak. Just pulled up and shot and then left immediately.”


    “But they watched you so that means they had to be nearby.”


    “Yes, but the police would have found them on the security tapes by now. I’m sure
    they hid in plain sight.”


    Putting down her laptop, Alisha yawned. “I think I’m actually sleepy.”


    “Then you should rest,” he said, his eyes deep-ocean blue. “I’ll stay up a while.
    Give Milly a break.”


    “Just remember, she called dibs on the couch.”


    He grinned at that. “Okay, Sugar-bear, go to bed.”


    Alisha made a face. “You won’t let me forget that, will you?”


    “I’ll never forget it, no.”


    The silence stretched like an unbreakable wire between them. Alisha wanted to
    take him in her arms and tell him to rest but she knew that would be crossing
    the line that pulled at them like a tug-of-war rope.


    “Well, good night, Nathan.”


    He stood and walked her to the door of her room. “How are you, really?”


    “What does that mean?”


    “I worry about you.”


    “I’m okay. I’m alive and I’m not giving up.”


    He held one hand on the door jamb while he kept his eyes fixed on her. “Okay.”


    Did he want to say more?


    “Nathan?”


    Touching a hand to her hair, he said, “Get some rest. We don’t know what tomorrow
    will bring.”


    Alisha certainly understood that concept. So why couldn’t he open up to her today?


    * * *


    Nathan heard a thump and then a sharp bang.


    Jumping out of bed, he grabbed his gun and went into the den, the moonlight allowing
    him to do a quick search. Alisha stepped out of the bedroom, still wearing her
    jeans and sweatshirt.


    “Stay behind me,” he whispered. “I think we have company.”


    Alisha nodded and grabbed at his T-shirt, holding tight to the worn fabric.


    Nathan moved around corners until he could see into the vestibule. “I don’t see
    Milly.”


    Alisha shook her head. “I don’t either. This isn’t good.”


    Then they heard footsteps and the back door banged open and a dark figure stood
    looming.


    “Run,” Nathan said to Alisha. “Toward the front.”


    He pushed her ahead and fired a shot to give them time to get away, not sure if
    he’d hit the target or not. Alisha crashed the front door open and let out a gasp.
    Office Milly lay on unconscious on the floor.


    “Nathan?”


    “No time. We’ll call it in. Right now, we need to get out of here.”


    They made it out into the yard, the cold snow wetting Nathan’s socks as soon as
    he hit the ground near some shrubs. “Let’s follow close to the houses and we’ll
    hide until help arrives.”


    Alisha did as he said, staying with him as they moved through shrubbery and small
    entryway gardens until they were at the end of the street. Nathan called 911 and
    gave the dispatcher their location. Soon, they could hear the sirens off in the
    distance.'
