- fmt: '

    # Granny. What if someone hurt her grandmother?


    Deciding a weapon would be good, just in case, she hurried back into the big,
    dark house and went to the master bedroom. Moving past the eerie glow of all the
    sconces, she stood at the bedroom door and spotted the big fireplace inside. Then
    she hurried to find the fire poker.


    The wieldy iron poker in her hands, she slipped to the windows lining the room
    and checked the sloping backyard. Shadows cascaded out over the grass and shrubs
    to reveal a quiet stillness. The yellow glow of the security lamps gave her courage.
    But she needed to get back to the front of the house and check on her grandmother
    and Nathan. Had it been five minutes?


    Alisha moved quickly back up the wide hallway, going past the stairs. When she
    heard a noise coming from the front yard, she stopped. Should she go down or call
    `911`?


    Before she could decide, a strong arm pulled her close. She tried to scream but
    the sound caught in her throat. Then a hand clamped down over her mouth and a
    man breathed close.


    Frantic, she tried to raise the poker.


    “Be still and don’t make a sound.”


    Nathan.


    He released her and touched his finger to her lips. Then he whispered close. “I’ve
    got this.”


    Relieved but wanting to kick him for scaring her, Alisha whispered, “Who was out
    there?”


    “Carson,” he said. “He was done with the search and decided to drive by to see
    if we’d made it here safely. But he did spot a prowler. We met up in the front
    yard. He’s still out there rattling around.”


    “Why didn’t you just say that instead of scaring me?”


    “I didn’t want to startle you and cause you to scream.”


    “What makes you think I’d scream?”


    “Why didn’t you stay put?”


    Tired and still shaking, she glowered at him. “I went to get this,” she said,
    holding up the poker. Her hand shook so she held it down again.


    Nathan’s frown darkened. “I told you to stay where you were.”


    “I was worried about you and my grandmother. I had to do something.” Then she
    checked him over. “What happened?”


    “I’m fine. The prowler ran away and got in a vehicle about a block from here.
    Carson’s off-duty, working on his own time to see if he can find any prints.”


    He took the poker from her. “Are you all right?”


