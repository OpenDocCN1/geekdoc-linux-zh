    Bettye Willis met them at the landing where the stairs from the portico doors
    met the second floor in a wide entryway. A small table held a sparkling ceramic
    Christmas tree, the smell of cinnamon-and-spice potpourri lingering in the air.


    Bettye took Alisha into her arms in a tight hug. “Alisha, we were beginning to
    get worried.” Stepping back to get a good look, she said, “I sent Judy on to bed.”


    Then her grandmother saw Nathan there in the shadows. Her surprised gaze moving
    from Alisha to him, Bettye asked, “Mr. Craig, what are you doing here?”


    Nathan smiled at Bettye. “That’s a long story, Mrs. Willis.”


    “He’s here to help me, Granny,” Alisha said, hoping her grandmother wouldn’t press.
    “We can explain in the morning.”


    Bettye scoffed that away. “I was up reading,” she said. “Come into the kitchen
    and I’ll make you something to eat. And then you can tell me what’s really going
    on.”


    When they hesitated, her grandmother put her hands on her hips. “You do realize
    that while I’m old, I’m not completely hapless and senile. Alisha, you would not
    bring Nathan Craig here in the middle of the night without an extremely good reason.”


    Alisha shot Nathan a warning glance. “I’ll explain then, Granny. No need to keep
    you up all night wondering.”


    ***


    “That’s unbelievable,” Bettye said after Alisha retold what had happened to her.
    Turning to where Nathan sat in front of a half-eaten roast beef sandwich, she
    patted his hand. “I’m so thankful Alisha thought to call you, Nathan.”


    Nathan stared at the cookie waiting by his plate and then glanced at Alisha, concern
    hitting him in the gut. What if he hadn’t answered his phone? What if he hadn’t
    been at the cabin?


    He wouldn’t think about that. He was here now with her and she was safe. “Me,
    too, Mrs. Willis.”


    “Call me Bettye,” the older woman said. She wore a blue flannel robe to keep warm
    in the wee-hour chill of the spacious art deco–style kitchen. “More coffee?”


    Nathan held up his cup, thinking he wouldn’t get much sleep tonight anyway. “Thank
    you.”


    Alisha sat holding her mug, absorbing the warmth. Her grandmother had found her
    a cozy sweater and a pair of jeans. Alisha kept some clothes here since she often
    worked pro bono into the late hours and spent the night now and then.


    “So, you’re going to be our protector,” Bettye said, nodding her head. “We’ll
    explain all of this to Mrs. C in the morning. She’ll certainly agree that this
    is the safest place for both of you right now.”


    “I don’t want to put you or her in any danger, Granny,” Alisha said. “This is
    just for a couple of days.”


    “Until after Christmas,” Bettye said. “Remember, you have the whole week off.”


    “Maybe until the New Year,” Nathan repeated again.


    “I hope it won’t take that long,” Alisha replied, a stubborn glint in her green
    eyes.


    “No matter,” her feisty grandmother replied. “As you know, Alisha, the center
    will be closed for the next few days and we have lots of baking to do and packages
    to wrap. We go visiting the Amish during Christmas. You can help with all of that.”


    “Okay, Granny,” Alisha said. But her voice held little enthusiasm. She would work
    day and night to solve this thing.


    “I’ll take a room in the main house,” Nathan said to Bettye. “But at least I’ll
    be on the premises.”


    “I feel better already,” Bettye replied. “Now, let’s get you both settled in.
    I’m sure you are exhausted. We’ll continue this discussion in the morning.” Getting
    up, she added, “You two must not have been hungry.”


    “I’ll save my cookie for later,” Nathan said.


    “I’m sorry, Granny. Hard to eat.” Alisha took her own sandwich to the sink. “I’ll
    do the dishes and then I’m going to my room.”


    Nathan lifted his eyebrows, questioning.


    “Relax,” Alisha said. “My room is right across from Granny’s. This place has three
    bedrooms. The big suite where Mrs. Campton stays and two smaller bedrooms across
    the hallway, with a bath and small sitting room between them.”


    “It’s quite cozy,” Bettye said with a shrug.


    “Yeah, cozy. I vaguely remember the layout.” Nathan thought of all the things
    that could go wrong. “Do I need a key or a code to get to the main house?”


    “I’ll show you,” Alisha said, her tone anxious.


    “I’ll wait here then,” Bettye said, her grandmotherly gaze taking in all the undercurrents
    flowing around them. “Then we’ll lock up tight.”


    Nathan nodded and thanked Bettye for the food. “I’ll be close if you need anything.”


    Remembering the house from his time here before, Nathan guided Alisha to the glass
    door that led to the enclosed breezeway, where two rows of windows provided views
    of the big front yard and the sprawling tree-lined backyard and lighted pool area.


    “Too many windows,” he said, holding her elbow while he scanned their surroundings.


    “I’ve never worried about that before,” Alisha admitted. “Granny will feel better,
    having you close by.”


    They made it to the matching set of doors on the other side of the breezeway,
    bypassing wicker chairs and tall parlor ferns.


    Alisha keyed in the code.

