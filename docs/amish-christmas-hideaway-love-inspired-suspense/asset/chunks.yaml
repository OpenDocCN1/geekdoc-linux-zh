    her but also a dangerous place where someone could hide and wait for her.


    “Did you call anyone else?”


    “I called you,” she said through a shuddering sob. “Because this won’t end with
    the local police, Nathan. I witnessed a double homicide that looked like a hit
    job. Those two officers are probably dead. The FBI will probably be called in
    and I’ll need to testify.”


    *FBI?* Now he was tripping over his own feet. “Alisha, I know the road you’re
    on. Find an Amish farm and wake someone up. Stay with them until I get there.
    Do you hear me?”


    She didn’t speak.


    He held the cell between his ear and shoulder while he grabbed at more clothes
    and found his weapon and wallet.


    “Alisha?”


    “I know a shortcut,” she said, sounding stronger. “I’ll take that route once I
    hit the turn. I’ll try to find a house, I promise. My cell battery is low. I have
    to go.”


    “Alisha, tell me what to look for.”


    “Black Denali SUV. Two men in the vehicle. I have to go.”


    “Alisha, don’t—”


    She ended the call.


    Nathan stood there in the dark, the images playing in his mind a terrible torment.
    If anything happened to her...


    He’d been through this kind of terror before. He would not go there again.


    With that vow in mind, he finished putting on his clothes and hurried out of the
    cabin toward his big Chevy truck. His heart pumping adrenaline, he headed toward
    Green Mountain. Once underway, he called his friend Carson Benton at the sheriff’s
    department. While per Pennsylvania law, the deputy couldn’t apprehend the suspects,
    he could serve in tracking them down and alerting the state police and the FBI
    if needed. He could also help in transporting them if they were apprehended.


    Nathan and Carson went way back, had been friends for years. Carson sometimes
    helped Nathan in an unofficial capacity with missing person cases.


    “This had better be good,” Carson said, echoing the same words Nathan had uttered
    about ten minutes ago.


    “I need you to check on a woman driving alone and headed toward the turnoff just
    past Green Mountain, toward Campton Creek. She thinks someone is following her.
    Someone dangerous. She witnessed a shooting near Philadelphia and she had a police
    cruiser following her but the perpetrators ran the patrol car off the road.”


    “Hello to you, too,” his longtime friend said with a grunt. “Got it. Who’s the
    woman?”


    “Alisha Braxton,” Nathan said, one hand on the wheel as he broke the speed limit.
    Then he described her vehicle. “I’m on my way.”


    “I know how you drive, Nathan. You’ll beat me there,” Carson replied in a tart
    tone. “I’m on it.” Then he asked, “Hey, isn’t she the one who—”


    “Yeah,” Nathan said. Then he ended the call.


    Alisha Braxton.


    The one who got away.


    This had to be bad if she’d called him.


    Because Nathan knew he was the one man on earth she’d never want to call for help.


    * * *


    Why had she called him?


    Logic told Alisha her first call should have been to 911\. But she’d panicked
    after she’d seen the patrol car behind her bursting into flames and when she’d
    grabbed for her phone, Nathan had come to mind. He lived close by when he wasn’t
    traveling. Thankful that she’d caught Nathan at home, Alisha knew he could get
    to her fast. And he’d act first and ask questions later.


    He was the kind of man who took matters into his own hands.


    He was also the kind of man who broke all the rules, one of the reasons she’d
    given up on him long ago.


    Now it was the only reason she wanted him by her side.


    The one man she didn’t want to call was also the one man who could help her escape
    from a couple of killers.


    The irony of her situation made her laugh a tiny hysterical laugh while she slipped
    her car back onto the main road and kept watch behind her. She’d seen the SUV
    and now it had disappeared. But she wasn’t imagining this. If she turned down
    Applewood Lane and hooked a left back to the old covered-bridge road, she could
    throw them off. Then she could take the back roads to Creek Road and then Campton
    Creek proper. She’d be safe soon. She knew these roads, had traveled them as a
    child.'
