    been self-involved and focused on her work, lonely at times, but content and fulfilled.


    She now appreciated all of that and more.


    “*Kumm* and sit with us for a while,” Martha said. “I have a few books and devotionals
    by my chair if you’d like to read a bit.”


    “Thank you.” Alisha sat down across from them. “And thank you for everything.”


    Amos looked up at her but didn’t speak. Martha nodded and glanced toward the door.
    “I am thankful you are both alive and well and here with us.”


    Alisha lifted one of the books off the table. A midwife story. That made her think
    about Nathan and marriage and children and...things she shouldn’t be considering.
    Pretending to read the book, she instead held a vision of Nathan holding a child
    in his arms. He’d make a good father.


    When Nathan came through the door, she exhaled the breath she’d been holding.
    Would she ever feel truly comfortable around his family? His folks, obviously
    feeling the same way, said good-night and went upstairs to bed, leaving them alone.


    “Want to sit by the stove?” he asked, motioning her over to where the wood stove
    still held some heat.


    Alisha didn’t know why all of a sudden she felt shy around him. They’d been together
    for days. But it was too quiet here, too silent to hide the awareness that seemed
    to be simmering right below the surface of their fatigue and apprehension.


    She sat in the cushioned rocking chair his mother had vacated, the scent of the
    locally made cinnamon candle sitting on a shelf still lingering in the air. “Did
    you talk to Carson?”


    He hesitated and then nodded. “Yes. First he told me that my truck is being watched
    24/7, according to his sources in Reading. Same dark SUV-type vehicle’s circling
    the hotel parking lot.”


    “They’ve probably harassed everyone at the hotel to find out if you’re there or
    not.”


    “Right. But that means they don’t know where we are for sure. But they’ve managed
    to slip away before anyone can track them, so that’s a problem.”


    “So we keep moving.”


    “Yes. Carson offered to escort us to the city but in an unmarked car. So we’ll
    continue to dress Amish and take him up on that offer. That won’t be so unusual
    this time of year with people visiting each other.”


    “If I show up dressed as an Amish woman, my boss will faint dead away,” she said
    with a giggle as she stared down at the burgundy dress and white apron she was
    wearing. In spite of the seriousness of this situation, she had to laugh at that
    scene.


    “I would think so, although you look pretty pretending to be an Amish woman.”
    His eyes held hers for a brief moment and then he quickly gazed at the old pot-bellied
    stove. “We can’t go back to your place in Reading. They’re probably watching it.”


    “And they’ve probably already been inside,” she replied, her heart skipping at
    that thought. She’d have to move. She didn’t want to go back there at all now.


    “So I’ll rent us two rooms in a place I use in the city.”


    “That’s fine.”


    Lifting an eyebrow, he said, “You don’t sound so sure.”


    “It’s just I never thought I’d be having this kind of conversation with you.”


    Nathan’s gaze washed over her again and she saw it there in his eyes—the same
    longing that poured through her heart each time she looked at him. “No,” he said,
    leaning close, “I always thought one day we’d go on our honeymoon and share a
    room, as man and wife.”


    Shocked at those words, Alisha looked down at her lap. “This sure isn’t a honeymoon,
    is it?”


    “No,” he said. Then he reached across the side table and took her hand in his.
    “But a double murder and scary hit men aside, I wouldn’t want to be anywhere else
    tonight.”


    Alisha took his hand and savored the warmth of his fingers curling over hers.
    “Merry Christmas, Nathan.”


    “Merry Christmas, Alisha.”


    He walked her to the door of her room but when he heard a rustling outside, he
    tugged her close. “Go upstairs.”


    Alisha watched from the landing as he went to a side window and stared out into
    the dark night. Hearing another noise, he motioned to her. “Go and get my gun
    from my room.”


    She hurried barefoot into his room, hoping she wouldn’t disturb his parents. Since
    their door was shut and the small room he’d taken was down the hallway from theirs,
    she made it to his room and grabbed the weapon he’d put in the bottom of a small
    armoire when they’d first arrived.'
