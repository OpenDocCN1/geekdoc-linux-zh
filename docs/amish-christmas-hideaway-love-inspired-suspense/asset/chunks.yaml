    Before he could answer, a booming voice shouted. “Nathan Craig? `FBI`. We know
    you’re in there. Open the door or we’ll break it down.”


    Nathan turned to Alisha. “They might not be `FBI`,” he pointed out. “My gut is
    telling me to be careful.”


    “Then let’s go with your gut.”


    He eyed the back door. “We could make a run for it, but...if it is the `FBI`,
    they need answers and we’ve done a lot of research. They won’t take kindly to
    us ignoring them while we try to break this case. If we run, they’ll track us,
    too.”


    “I agree,” she said. “But if it’s those goons, they might have us surrounded and
    we’ll both get killed.”


    Another knock. “Craig, let us in. We need to talk to Alisha Braxton.”


    “Give me a minute,” Nathan shouted through the door. He turned to Alisha. “Get
    your cell and put your cape and bonnet on and be ready to run. Look for the birdhouses.”


    “I’m not going without you.”


    “Alisha, don’t argue with me. I’ll have to hold them off.”


    She shook her head but went to the bench by the back door to grab the dark cloak
    her grandmother had loaned her. It wasn’t regulation Amish since it had pockets
    but Granny had shoved it at her because it was warm.


    Just to be sure, she gathered whatever she could into her briefcase and placed
    it behind the couch but kept their latest handwritten notes tucked along with
    her cell phone in the bib of her apron. When she reached down inside the case,
    her hand hit her pepper spray. She took it out and dropped it into the deep pocket
    of her cloak, thanking the Lord for that one secret compartment.


    Another knock. And then the door rattled. Alisha’s pulsed pounded against her
    temple while she tried to take her next breath.


    Nathan put a finger to his lips and motioned for her to get behind him. “Remember,
    if you have to run, look for the birdhouses. They line the trail from the cabin
    to my folk’s place.”


    Bobbing her head, she prayed she wouldn’t have to go anywhere without him.


    “I need to see some ID,” Nathan called. “I’ll open the door and you slip your
    badge through.”


    Alisha heard mumbling and shuffling. “I have my badge out.”


    Nathan kept the chain lock on the door and opened it just enough to see the badge.
    Alisha peeked at it from behind him.


    It looked official enough but how could they be sure?


    Before Nathan could confirm, the door flew open with a bang, ripping the chain
    lock away and knocking both of them to the floor. The breath went out of Alisha
    but she scooted up, ready to make a move if Nathan would go with her.


    Then a shot and the back door swung open, a man with a rifle trained on them filling
    the cold space. She couldn’t see his face in the muted lamplight, but she could
    tell he stood tall and bulky. The air hit Alisha’s warm skin like a cold breath.
    No way out.


    Nathan managed to hold onto his gun, his body a solid wall in front of where Alisha
    huddled on the floor. “Stay behind me, Alisha,” he whispered. “But get ready to
    run.”


    “What about you?”


    “Don’t worry about me. I’ll distract them.”


    Two men entered the house from the front and stood over them. Nathan held his
    gun toward the men at the door and then spoke to the one who’d just shot out the
    back lock. “That was rude.”


    “It’s a little late for you to be whining,” the first agent said as he flashed
    his badge again. “We’ve been looking for Miss Braxton for two days.”


    Nathan shook his head then sat up. “Breaking and entering is not a good idea.
    And holding that rifle on us only makes things worse.”


    One of the men closed the door behind him. The first one who’d flashed his badge
    said, “I’m Special Agent Mack Smith.” Motioning behind him, he added, “This is
    Agent Scott Kemp and that fellow over there is Adam Baker. Why don’t you relax
    and put down that gun, son.”


    Nathan checked the IDs they briefly held up but he didn’t drop his weapon. “I
    guess you want to question my client. So I’ll put down my weapon when you do the
    same.”


    The one named Mack nodded to the man holding the rifle. He lowered his gun. Nathan
    carefully placed his weapon on the floor.


    “You could say that,” Mack Smith replied, his gaze sliding over Alisha. “If it’s
    not too much trouble we do need to question your client. I mean, this is a federal
    case and you’re the only eyewitness, Miss Braxton. You don’t need to run from
    the `FBI`.”


    “Who told you I was here?” Alisha asked, her tone firm and calm, while her eyes
    moved over the men. She had to find a way to get them out of this, but they were
    blocked in.


    “We asked around,” Mack Smith said with a slight smile.


    Alisha had already figured out these people were not `FBI`, but her radar went
    up. Something was definitely off. They were all three dressed for the weather
    in heavy canvas jackets and jeans. But they didn’t have the clean-cut look most
    `FBI` agents adhered to. The two backups were scruffy. One had a beard and from
    what she could see, the one standing at the back had long hair.


    Alisha studied the two standing nearest and when her gaze moved to the other man—Adam
    Baker—she glanced at his haggard features and confirmed he had stringy long dark
    hair. Then she looked at the two standing nearest and when her gaze moved to the
    other man—Adam Baker—she glanced at his haggard features and confirmed he had
    stringy long dark hair. Then she looked at the two standing nearest and when her
    gaze moved to the other man—Adam Baker—she glanced at his haggard features and
    confirmed he had stringy long dark hair.

