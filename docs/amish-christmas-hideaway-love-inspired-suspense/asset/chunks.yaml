    He was within yards of the houses when the front door swung open. Martha Schrock
    came running down the steps, her dark dress and black apron billowing out around
    her. “Nathan?”


    Nathan nodded and stumbled closer. “Hi, Mamm. It’s me.”


    Martha’s face filled with concern. “What has happened?”


    “I’ll explain, but I need to get her inside and warm first.”


    Martha stopped as she got closer to them and saw the woman wearing a dark bonnet
    in his arms. “And who is this?”


    Nathan glanced back at the road. “Mamm, I’ll explain everything. May we come inside?
    She’s been exposed to the cold all night.”


    His father stepped out onto the porch, a frown marring his face. His mother whirled
    to her husband. “Nathan has returned, Amos. He and this woman are in need.”


    For two heartbeats the morning went silent. Alisha moaned again and snuggled closer
    to Nathan. He kept glancing back as he inched her and his mother forward, afraid
    those men would be lurking about.


    Finally, he said, “Daed, I need your help. May we please come inside?”


    The plea in that question must have torn through his mother. Her eyes grew misty.
    She turned to her husband. “Amos?”


    “Alleweil, Daed?” Right now.


    Amos Schrock stared at them but didn’t move.


    “Amos?” His wife’s plea sounded as heartbreaking as Nathan’s had. “Our son needs
    our help.”


    Amos nodded. “Ja.”


    Then he turned and went back inside the house.


    Feeling dejected, Nathan moved forward. But to his surprise, his father came back
    out with two blankets and handed them to Martha. She nodded, unable to speak,
    and then hurried to cover both of them.


    “Kumm, and let’s get you both warmed up.”


    Martha shot her husband a sweet smile. “Denki, Amos.”


    Amos nodded and guided them up the steps. When they were inside, Nathan’s parents
    turned to see the woman in his arms.


    Martha gasped and Amos frowned.


    Martha glanced over at Alisha, unable to speak as recognition spilled over her
    features. “Alisha?”


    Alisha opened her eyes and focused. “Yes, Mrs. Schrock. It’s me. And I’m so sorry
    to bother you.”


    Then she passed out again.


    Nathan interjected, weariness and dizziness overtaking him. “We’re in trouble,
    Mamm.”


    Martha gave Alisha another concerned stare, as if to say she’d already figured
    that out. Then she motioned to the downstairs bedroom on the back of the house.
    “Druwwel? What kind of trouble?”


    Nathan felt as if he was shifting, his legs going weak. Following his folks, he
    said, “I... I need to lay her down.”


    His mother pulled back the quilt and fluffed the pillows. “Put her here.”


    He gently placed Alisha on the bed and tugged her out of her cloak while his mother
    held the blanket they placed over her. Alisha came awake, her eyes going wide.


    “Where am I?”


    “You’re safe now,” Nathan said, his voice hoarse as he covered her from her neck
    down, making sure she’d be warm. “Just as I promised.”


    He blinked, stumbled against the high-backed chair by the bed, his arms throbbing
    from carrying her for so long, his shoulder on fire. Pushing off the blanket,
    he tried to stay on his feet. And failed.


    “Nathan, you’re hurt!”


    His mother’s frantic shouts echoed all around him before he slumped over in the
    chair, unable to keep his eyes open any longer.


    ***


    She woke to voices.


    A soft voice. “The poor girl is exhausted. No wonder. She almost froze to death.
    And you with a hole in your shoulder.”


    A harsh voice. “You bring her here, to our home? You and your Englisch world?
    I had no choice but to help you this morning, but I won’t have it. You can’t stay
    here, Nathan.”


    A tired voice. “I told you, I have nowhere else to go right now. She needs to
    stay out of sight for a while.”


    Sitting up, Alisha glanced around the clean, plain bedroom, the sun shimmering
    through the windows. A beautiful bed with a colorful diamond-patterned quilt that
    would be worth hundreds of dollars hanging in a city store, along with a side
    table and a chair and a small wardrobe. Simple, stark and beautiful. A house full
    of love.


    The sun shined high up in the sky, telling her it had to be mid-afternoon. She’d
    slept all day?


    Her mind foggy, she remembered bits and pieces of conversations. Nathan talking
    softly in her ear out in the forest. His parents wrapping both of them with blankets,
    their voices filled with worry and surprise.


    They’d taken her in. The parents that had not approved of her long ago had taken
    her into their home. Because they still loved their wayward son.


    But she’d brought conflict and confusion back into this house when Nathan clearly
    needed to find redemption and peace. She saw clearly now. As clear as the glass
    vase holding a few pine boughs. A simple gesture to celebrate Christmas in a plain
    and quiet way.


    “What do you plan? To shoot people dead in our yard?”


    “Enough,” Alisha said to herself in a mumbling whisper. “Enough.” She had to get
    out of here, for Nathan’s sake, if nothing else.


    Pushing back the warm quilt, she got up to get dressed, a slight dizziness causing
    her to sit back on the bed. She ran her hands through her hair and padded her
    way across the old floor.

