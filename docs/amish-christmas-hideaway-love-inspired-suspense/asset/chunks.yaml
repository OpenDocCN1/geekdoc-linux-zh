    “Just rest.”


    Alisha knew she should protest but being in his arms again took away all of her
    horrible memories of the last few days. She felt secure here in this little cabin
    with Nathan, the fire’s warmth lulling her to relax. But this couldn’t happen.


    She lifted up. “I should go and get some sleep.”


    “Not yet,” he said, his warm breath on her ear, his arms still holding her. “Just
    let me hold you, okay?” He took an old afghan off the back of the couch and dropped
    it over her clothes.


    Alisha closed her eyes. She needed to get up and move away from him. Too tempting.
    But sleep took hold of her. Nathan tugged her close so she could lie her head
    on his shoulder.


    She shouldn’t feel this safe with him but her limbs felt so heavy and a wave of
    fatigue moved over her, dragging her down.


    “Just for a minute,” she said as she drifted off.


    Only for a little while.


    * * *


    Nathan woke with a start and glanced around. The fire was out and the room was
    cold. Alisha lay on the couch, covered in the afghan and another blanket he’d
    found. She’d fallen asleep almost immediately so he’d lifted her up out of his
    arms and let her sleep there. He had taken the chair and made do with a pillow
    and a blanket while he studied the facts they’d gathered.


    He’d fallen asleep, his head twisted against the pillow.


    Now he was fully awake and hearing things.


    A rustling outside brought him out of his chair. Listening, he hurried to the
    door. It was locked and bolted but that wouldn’t stop a killer.


    Standing there, he checked his watch. Four o’clock. Nathan found his gun and went
    to a window to peek out. Maybe the big deer had followed their scent here. Listening,
    he heard only the wind and the occasional sound of snow falling off of tree limbs.


    “What is it?”


    He turned to find Alisha sitting up on the couch, her blanket pulled tightly against
    her.


    “False alarm,” he said. “Something woke me. Probably an animal passing by.”


    She didn’t look convinced.


    “Let me go and check,” he said, grabbing his boots and his coat. “You don’t go
    anywhere.”


    “I won’t.”


    He gave her a questioning stare.


    “I do not want to go out there,” she said. “I’ll make coffee. And you—be careful.”


    He went out the back and quietly worked his way around the perimeter of the square
    little cabin. No human prints but lots of animal paw prints. Maybe the raccoon
    he fed sometimes had returned for a winter treat.


    Satisfied, he glanced around the quiet forest and wondered if someone was watching
    him. The chill took over and he hurried back inside, dusting snow off of his clothes
    after he closed and locked the door. “All clear. I’ll start a fire.”


    She handed him fresh coffee and headed to the bedroom and stayed there a few minutes.
    He heard water running so he worked on a quick breakfast. When she returned, she’d
    changed into sweats and a huge sweater, thick socks covering her feet. Moving
    toward the fire he’d started, she held her hands out.


    “Cold?”


    “I might not ever be truly warm again.”'
