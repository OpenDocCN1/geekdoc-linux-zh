    “Has anyone tried to follow us?” Alisha asked, wishing she didn’t have to come
    back to reality. Delving into Nathan’s psyche would be so much more fun.


    “So far, so good,” Carson said. “I didn’t inform anyone outside of the investigating
    officers about where I’m taking you.”


    Nathan checked the traffic. “No cars staying on us,” he said. “I’ll be glad when
    we’re sitting in the police station in the middle of the city.”


    “So will I,” Alisha said. “I’d like to mark running for my life off my bucket
    list.”


    Nathan took her hand in his, his eyes moving over her. He didn’t speak but she
    knew he had to feel the same way.


    Where would things end when they did stop running? What then? They hadn’t had
    time to examine or explore this new kind of normal. Would the adrenaline go away
    and leave them wishing they hadn’t grown so close? Would he regret getting involved
    with her again?


    Nathan’s eyes met hers, as if he was having second thoughts, too. “Are you ready
    for what’s next?”


    She wanted to tell him she was ready to come out of hiding, not only from these
    killers, but she wanted to stop hiding her heart and spend the rest of her life
    with a man she couldn’t stop loving.


    Instead, she said, “I need to do this so I can get on with my life and feel safe
    again. So yes, I’m ready.”


    His expression changed, just a slight shift that went dark for a moment as if
    a cloud had covered the sun. And then it was gone to be replaced with a blank
    concern. “Same here. Getting on with my life sounds good.”


    So he wasn’t ready to go all in on their renewed attraction?


    Alisha should feel relieved, but all she felt was a deep ache in her heart. He
    was just biding his time until he could do his duty, find justice and be away
    from her again.


    * * *


    So she wanted to get on with her life? Nathan wondered if that life would now
    include him. They’d come a long way in a short time and he wasn’t imagining the
    closeness they’d developed. But he knew being on the run and constantly on guard
    could mess with a person’s head. Going back to normal might cause her to revert
    back to her old way of wanting to avoid him at all costs.


    While he wanted to be with her even more.


    “Take us to the station first. We can check into the place I rented later,” he
    told Carson, giving him the directions. “They know me there, but the owner is
    always discreet and won’t give out any information. We can change clothes and
    freshen up once we’ve talked to the police.”


    His phone buzzed as Carson maneuvered through traffic. “The state police.” He
    answered, hoping for good news. “Nathan Craig.”


    Nathan watched as Carson took another side street toward Belmont Avenue and turned
    off toward the Philadelphia police department.


    “I hate to be the bearer of bad news, Craig,” the officer on the other end of
    the line said. “But the man who was trespassing on your family’s property died
    during surgery this morning. Joe Watson—career criminal with ties to several alleged
    drug traffickers in the state of Pennsylvania. Mostly opioids, but he’s pretty
    low on the ladder of drug runners.”


    Nathan inhaled a breath. “So we didn’t get anything out of him?”


    “He never woke up.”


    Nathan thanked the officer for the report then told Alisha and Carson. “One tight-lipped
    and one dead.”


    Alisha shuddered. “Those draft horses saved our lives but I wish we could have
    questioned him.”


    “Yeah, well, onward,” he replied after Carson parked the car. “We’re about to
    go into a whole new realm. I know you can hold your own with any LEO. But I’ll
    be there with you.”


    She nodded. “And Mitchell Henderson should meet us here if all goes as planned.”


    “So let’s do what needs to be done,” he said, wishing he knew how she really felt.
    But like him, Alisha was used to holding her deepest thoughts close.


    They walked into the station, Carson acting as bodyguard, still dressed in their
    Amish clothes.


    Nathan just hoped the ruse had worked. He now had something more important to
    take care of other than searching for missing people. Protecting the women he’d
    loved for most of his life. He only hoped she’d agree to that plan.


    Once they’d been put in a conference room, they were given coffee and told to
    wait. Carson offered to stay, but Nathan shook his head. “You’ve done enough.”
    Shaking his friend’s hand, he said, “Go home and watch over our folks. And watch
    your back.”


    “Always,” Carson said with a grin. “I’ll check in with you later.”


    “Thank you, Deputy Benton,” Alisha said, ever the professional.


    She’d removed her *kapp* and shook out her upswept hair. Now her tresses flowed
    around her shoulders in golden-brown ripples. She looked so young and pretty but
    her green eyes still held that edge of steel.


    Carson bobbed his head. “Anything else you need—just let me know.”


    After Carson left, they both sat down and went silent.


    When had he become so tongue-tied? Nathan wondered.


    Looking over at her, he felt the fatigue of the last few days weighing on him
    like a heavy mantle. “I think I could sleep for a week.”


    “I had a nap,” she replied, her tone tense. “Now I’m wired and ready to get on
    with this.”


    “So you’ll be done with me?”


    Her eyes met his, a silent message that he couldn’t read held there in a green
    forest of doubt.


    Before he could answer, a man and woman came in and stood over them.


    The man held out his hand. “I’m Detective Jack Mathers and this is Agent Sandy
    Fenwick from our field office here in Philadelphia.”


    After handshakes and the usual law enforcement scans and scowls to intimidate
    them, they all sat down and did another quick back and forth stare session.


    Finally, Detective Mathers spoke. “Miss Braxton, you’ve come face-to-face with
    some very dangerous people. I’m sorry you had to see that and sorry you felt the
    need to go into hiding.”


    “I was running for my life,” Alisha said, her voice clear and sharp-edged. “I
    didn’t think things through but I’m here now.”


    Then the agent leaned forward, her black bob sliding across her cheekbone with
    a precise swish. “You also got yourself involved in a sting we’ve been planning
    for over a year now.”


    “I didn’t get myself involved,” Alisha retorted in a touchy tone Nathan knew only
    too well. “I was in the wrong place at the wrong time and I’ve been chased, shot
    at and assaulted since that night.”


    The detective tapped his pen on the table. “We understand. You should have come
    in sooner though. This thing goes beyond what you witnessed. Way beyond.”


    “So you both do understand that she was in a lot of danger?” Nathan replied.


    The door opened and a tall man with thick grayish-white hair entered the room,
    an air of authority about him.


    “Alisha,” he said, his eyes on her. “I’m sorry I’m late.”


    “Who are you?” the detective asked, glancing over at the FBI agent and then back
    to the man.


    “I’m Mitchell Henderson, Alisha’s boss. Just here to help guide her through the
    process.”


    “From Henderson and Perry?” Detective Mathers asked, his expression almost bored.


    “The very same,” the older man said with a smile that showed practiced grace.
    “We have firms all over the state and Alisha is a part of our family, so I wanted
    to check on her. We’re all very concerned for her safety.”


    “Why do you need a lawyer?” Agent Fenwick asked, clearly suspicious.'
