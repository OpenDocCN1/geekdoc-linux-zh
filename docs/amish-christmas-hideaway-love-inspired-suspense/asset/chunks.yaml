    Alisha stood. “I’ll go and talk to Granny then I’ll find some clothes for us.”


    Nathan lifted his chin in acknowledgement.


    Once she was out of the office, Alisha stopped and stared out into the well-lit
    backyard. The trees and old shrubs she’d always loved now held a sinister, hulking
    presence. Leaving had to be the only way.


    But the people who were after her wouldn’t know she’d left. What if they came
    after her grandmother again?


    Whirling back around, she crashed into Nathan and grabbed his arms. “We need to
    put out the word that I’ve been placed in a safe house. In the city.”


    At first, Nathan balked and then realization hit him. “So they’ll know you’re
    no longer here?”


    “Yes. Exactly. So they’ll search for me somewhere else. Do you think Carson can
    make that happen?”


    “He probably can. The locals in Philly might not like it. In all this confusion,
    I didn’t get an opportunity to speak to you alone about something else that came
    up.”


    “What?”


    “The `FBI` is on the case in Philly but they’re being tight-lipped about the whole
    thing. They’ll want to question you just as we thought. But they might also want
    to put you into protective custody.”


    “Did the town police tell them where I am?”


    “Right now, you’re classified as unavailable for questioning but you’re willing
    to cooperate. Carson and Officer Cantor both gave the same statement.”


    “Right, but Carson’s helping unofficially,” she said, doubt in her eyes. “I don’t
    want to get your friend in trouble. I need to meet with the `FBI`, but I also
    need to stay alive to do that.”


    Nathan nodded and scanned the windows. “They know that, so we’ll wait to hear
    from them.”


    “But they might show up at the cabin.”


    “We don’t have to tell them where you are. They’ll get mad and then they’ll get
    on with the job. We can stall.”


    “I see you’re still good at going to ground.”


    “Been doing it most of my life.”


    “I’m too tired to argue,” she admitted. “Let me go and explain to Granny, please.”


    “Do you need backup?”


    “No.”


    She whirled to leave but turned. “Thank you, Nathan.”


    He nodded, watched her cross the breezeway and then turned as she entered the
    apartment door.


    They were in this thing together now, no matter what. Alisha prayed they’d both
    come out alive.


    ***


    Hours later, covered from head to toe, Alisha wearing a dark bonnet and black
    cloak, Nathan wearing a hat and heavy overcoat, they slipped away into the night.


    Nathan kept her between him and the open fields as they followed the forest paths
    the Amish used to come and go around the country side. He had a small flashlight
    but only turned it on when the path grew heavy with overgrowth.


    Alisha was quiet, allowing him to hold her arm as they hurried through the bitter
    cold. “Are you all right?” he whispered.


    She nodded. “Granny is worried for me but she’s brave. She’ll pray for us. They
    are aware of the officers patrolling back and front now and the alarm is set.”


    “Carson and I checked everything one last time before we left,” he said to reassure
    her.


    Alisha stumbled and Nathan caught her against his chest. She felt so small and
    fragile but he knew the strength encased inside this woman’s heart.


    Staring up at him, she said, “They kept telling me they’d be fine. Their faith
    is solid—like a wall. But we both know faith can only carry you so far.”


    He held her there for a moment, accepting that she hadn’t pushed him away, taking
    in her eyes and how innocent she looked. “Faith carries us all the way through,”
    he replied. “Those two know that no matter what, God’s will and their faith will
    see them to the end.”


    She did pull back then. “I don’t want to prove that faith. I don’t want one of
    them to die even if they are ready for Heaven.”


    “Don’t think that way,” Nathan told her as he guided her along. “We have to believe
    we’ll all make it through this.”


    “I wish you and I could have that assurance. I’m trying.”


    He held her there. “I’m trying, too. And I’m sorry I got so angry today. Your
    words made me think about how prideful I am, refusing to turn back to God—I mean
    all the way back, not just when it’s convenient.”


    Her eyes brightened, the sparse light sparkling through like joy. “Nathan, I’m
    glad to hear that.”


    “I guess being back here with your grandmother and you has brought out a lot of
    pent-up memories. I never gave up on God but I did give up on attending church.
    I hope He listens to a burned-out man with a chip on his shoulder, sitting on
    a park bench.”


    “I’m pretty sure He does,” she replied, sending him a hopeful glance. “I hope
    He listens to a tired law associate who has to burn the midnight oil, even on
    Sunday mornings.”


    Nathan smiled at that. “I’m guessing He’s listening right now as we head out into
    the woods on faith alone.”


    They started walking again, wary but less weary. “Up this way,” Nathan said. “We
    have about a mile to go.”


    “Does that make my faith weak?” she asked, her voice timid now. “I made that comment
    about not testing faith.”


    “What? Because you want your grandmother to be safe?”


    “Yes.”


    “No, Alisha, it makes you love.”


    “Or maybe it makes you human.”


