- fmt: "\nAlisha glanced around, checking to make sure her grandmother wasn’t peeking\
    \ out the back window. Then she spotted the sunroom door. “I left the door cracked.”\n\
    \n looked into her eyes. “I’m going to move over and I want you to crawl into\
    \ the arbor and get behind one of the chairs.”\n\n“What about you?”\n\n“Don’t\
    \ worry about me.”\n\nLike asking her not to breathe. She’d been worrying about\
    \ him since the night he’d told her he was leaving Campton Creek. Without her.\n\
    \n“I told you I’m not going back inside without you,” she reminded him.\n\n“Stop\
    \ being so stubborn and do as I’m asking,” he replied, a soft plea in his words.\n\
    \nAlisha didn’t want to add to their troubles by being stubborn, so she caved.\
    \ If she did get in the house, she could call for help, at least. “Okay, but...don’t\
    \ get shot.”\n\nShe knew he wouldn’t care if he took a bullet, but she sure would.\
    \ Admitting that gave her courage. “Okay, let me up and I’ll hide over by the\
    \ table and chairs.”\n\nNathan nodded and lifted up to squint into the sunny woods.\
    \ “I see a glint. Could be our man. To the east near that big oak tree.”\n\n“I’ll\
    \ take your word for it,” Alisha said, afraid to move.\n\n“Are you ready?”\n\n\
    “Yes.”\n\nNathan gave her one last look, his hand briefly touching her cheek as\
    \ he did a drop-and-roll. Alisha did the same, flipping over to crawl toward the\
    \ shelter of the old arbor, her wrap caught against her skin and the rocky dirt,\
    \ tearing, holding her back. Thankfully the chairs underneath were tightly woven\
    \ black metal, a slight source of protection.\n\nAnother shot rang out and Nathan\
    \ crouched down and ran toward her. “We’re pinned in and I don’t have my phone.”\n\
    \n“I didn’t bring mine,” Alisha said. “Only open air between us and that door.”\
    \ She shivered, grabbed at her tattered wrap. It was ruined but still warm.\n\n\
    Nathan scooted closer and tugged her into his arms. “I’ve got you, Alisha. No\
    \ matter what, you need to remember that.”\n\nHuddled in the safety of his arms,\
    \ Alisha prayed for this brave, tortured man. He’d been in her peripheral vision\
    \ since she’d been eighteen. But now she was beginning to see him straight on\
    \ and clearly.\n\nTouching her fingers to his jaw, she said, “I’ve got you, too.\
    \ You need to remember that.”\n\nThe darkness in his eyes shifted and lightened,\
    \ a brief shard of clarity shining through as he gazed into her eyes.\n\nAnd her\
    \ heart was remembering why she’d fallen for him in the first place.\n\n“Nathan,\
    \ I—”\n\nAnother shot hit the still, cold air. The bullet ricocheted off one of\
    \ the old chairs and pinged into the shrubbery behind them.\n\n“Not a trained\
    \ sniper or we’d both be dead. But close enough to hit one of us if he doesn’t\
    \ let up,” Nathan said.\n\nThen something happened that had both of them sitting\
    \ up to take notice. \n\nThe sunroom door flew back, and her grandmother stood\
    \ with a high-powered rifle, her eyes, bifocals in place, set against the scope.\
    \ Bettye stood perfectly still, aimed and fired at least three rounds into the\
    \ woods.\n\nAlisha heard her grandmother calling, “Run. Hurry. I’ll cover you.”\n\
    \nThey ran quickly, staying against the shrubbery until they were close to the\
    \ open door. Bettye backed away but kept the rifle in sight of the woods. She\
    \ kept firing until they were through the door. While they collapsed against the\
    \ floral porch couch, Granny sent out one more volley and then closed the door\
    \ with such a proper ladylike slam, they both started laughing.\n\n“Granny, where\
    \ did you learn to shoot like that?”\n\n“From me,” came the voice from behind\
    \ them. They looked back into the parlor and saw Judy Campton in her wheelchair,\
    \ a slick pistol centered on her lap.\n\n***\n\n“I will never forget what I witnessed\
    \ here today,” Nathan said to Alisha.\n\nThey sat at the kitchen table, safe and\
    \ warm, while two officers combed the woods for shell casings and worked on a\
    \ grid of the yard, hoping they could find bullets to turn over to ballistics.\
    \ The shooter was long gone, leaving only some muddy footprints by the creek.\n\
    \nAfter talking to the officers on the scene, Carson told them to stay in for\
    \ the rest of the day. Alisha had chosen to remain close to her grandmother, so\
    \ Nathan followed her and here they sat, eating supper and waiting.\n\nAt least\
    \ they had something interesting to talk about.\n\n“So Mrs. Campton and you learned\
    \ how to shoot to protect yourselves?” Alisha asked, her tone telling Nathan that\
    \ she was still shocked. Shocked about the whole episode and about his remarks\
    \ to her, too, probably.\n\n“I actually learned how growing up Amish,” Bettye\
    \ explained. “But Judy and I have perfected the art.”\n\n“So you practiced through\
    \ the years?” Alisha asked.\n\n“Obviously,” Judy said with a serene smile. “I\
    \ taught her a few tricks I learned from the Admiral.”\n\nBettye laughed and shook\
    \ her head. “Girls aren’t supposed to be interested in guns but I watched and\
    \ listened whenever my `daed` and brothers would sit cleaning their hunting weapons.\
    \ They used them to hunt or to scare off.”\n\n“But you never used a gun?” Alisha\
    \ asked.\n\n“I actually learned how growing up Amish.”\n\n“I had to learn the\
    \ hard way one day all the men were in town loading up supplies. I think it was\
    \ a timber rattlesnake. Scared my `mamm` almost to death.”\n\n“You shot the snake?”\
    \ Alisha asked, her buttered roll in her hand.\n\n“I tried. Missed the first couple\
    \ of times but then I remembered how `daed` would be. So I calmed down, aimed\
    \ and boom, that snake lived no more.”\n\n“Your grandmother is a remarkable woman,”\
    \ Mrs. Campton added with a smile. “After they heard that story we were all so\
    \ young, my sailor and your grandaddy got it in their heads they’d take us to\
