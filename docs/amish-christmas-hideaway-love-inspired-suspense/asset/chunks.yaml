  raw: 'Alisha glanced around, checking to make sure her grandmother wasn’t peeking
    out the back window. Then she spotted the sunroom door. “I left the door cracked.”


    Nathan looked into her eyes. “I’m going to move over and I want you to crawl into
    the arbor and get behind one of the chairs.”


    “What about you?”


    “Don’t worry about me.”


    Like asking her not to breathe. She’d been worrying about him since the night
    he’d told her he was leaving Campton Creek. Without her.


    “I told you I’m not going back inside without you,” she reminded him.


    “Stop being so stubborn and do as I’m asking,” he replied, a soft plea in his
    words.


    Alisha didn’t want to add to their troubles by being stubborn, so she caved. If
    she did get in the house, she could call for help, at least. “Okay, but...don’t
    get shot.”


    She knew he wouldn’t care if he took a bullet, but she sure would. Admitting that
    gave her courage. “Okay, let me up and I’ll hide over by the table and chairs.”


    Nathan nodded and lifted up to squint into the sunny woods. “I see a glint. Could
    be our man. To the east near that big oak tree.”


    “I’ll take your word for it,” Alisha said, afraid to move.


    “Are you ready?”


    “Yes.”


    Nathan gave her one last look, his hand briefly touching her cheek as he did a
    drop-and-roll. Alisha did the same, flipping over to crawl toward the shelter
    of the old arbor, her wrap caught against her skin and the rocky dirt, tearing,
    holding her back. Thankfully the chairs underneath were tightly woven black metal,
    a slight source of protection.


    Another shot rang out and Nathan crouched down and ran toward her. “We’re pinned
    in and I don’t have my phone.”


    “I didn’t bring mine,” Alisha said. “Only open air between us and that door.”
    She shivered, grabbed at her tattered wrap. It was ruined but still warm.


    Nathan scooted closer and tugged her into his arms. “I’ve got you, Alisha. No
    matter what, you need to remember that.”


    Huddled in the safety of his arms, Alisha prayed for this brave, tortured man.
    He’d been in her peripheral vision since she’d been eighteen. But now she was
    beginning to see him straight on and clearly.


    Touching her fingers to his jaw, she said, “I’ve got you, too. You need to remember
    that.”


    The darkness in his eyes shifted and lightened, a brief shard of clarity shining
    through as he gazed into her eyes.


    And her heart was remembering why she’d fallen for him in the first place.


    “Nathan, I—”


    Another shot hit the still, cold air. The bullet ricocheted off one of the old
    chairs and pinged into the shrubbery behind them.


    “Not a trained sniper or we’d both be dead. But close enough to hit one of us
    if he doesn’t let up,” Nathan said.


    Then something happened that had both of them sitting up to take notice.


    The sunroom door flew back, and her grandmother stood with a high-powered rifle,
    her eyes, bifocals in place, set against the scope. Bettye stood perfectly still,
    aimed and fired at least three rounds into the woods.


    Alisha heard her grandmother calling, “Run. Hurry. I’ll cover you.”


    They ran quickly, staying against the shrubbery until they were close to the open
    door. Bettye backed away but kept the rifle in sight of the woods. She kept firing
    until they were through the door. While they collapsed against the floral porch
    couch, Granny sent out one more volley and then closed the door with such a proper
    ladylike slam, they both started laughing.


    “Granny, where did you learn to shoot like that?”


    “From me,” came the voice from behind them. They looked back into the parlor and
    saw Judy Campton in her wheelchair, a slick pistol centered on her lap.


    * * *


    “I will never forget what I witnessed here today,” Nathan said to Alisha.


    They sat at the kitchen table, safe and warm, while two officers combed the woods
    for shell casings and worked on a grid of the yard, hoping they could find bullets
    to turn over to ballistics. The shooter was long gone, leaving only some muddy
    footprints by the creek.


    After talking to the officers on the scene, Carson told them to stay in for the
    rest of the day. Alisha had chosen to remain close to her grandmother, so Nathan
    followed her and here they sat, eating supper and waiting.


    At least they had something interesting to talk about.


    “So Mrs. Campton and you learned how to shoot to protect yourselves?” Alisha asked,
    her tone telling Nathan that she was still shocked. Shocked about the whole episode
    and about his remarks to her, too, probably.


    “I actually learned how growing up Amish,” Bettye explained. “But Judy and I have
    perfected the art.”


    “So you practiced through the years?” Alisha asked.


    “Obviously,” Judy said with a serene smile. “I taught her a few tricks I learned
    from the Admiral.”


    Bettye laughed and shook her head. “Girls aren’t supposed to be interested in
    guns but I watched and listened whenever my *daed* and brothers would sit cleaning
    their hunting weapons. They used them to hunt or to scare off predators.”


    Nathan shot Alisha a quick smile. He was still angry at her but he’d cooled his
    jets so he could keep his head in the game. He hadn’t meant to hurt her earlier
    but some things needed to be left unsaid. Her accusations against him still stung.
    How was he supposed to get over his sister’s death when he was reminded about
    Hannah each time his phone rang, each time he had to tell another family that
    their loved one wasn’t returning?


    He’d found a lot of people safe and sound but he’d also discovered a few who were
    dead and gone. It never got easier and he never found any relief. Was he being
    too self-righteous by refusing to let go of his grief? Should he depend more on
    God and less on his own tormented assumptions?


    He couldn’t think about that right now.


    “But you never used a gun?” he asked Bettye while they tried to enjoy the meal
    she and Mrs. Campton had insisting on preparing.


    “I had to learn the hard way one day when all the menfolk were in town loading
    up supplies for the spring plantings. A big snake showed up out near the barn.
    I think it was a timber rattlesnake. Scared my poor *mamm* almost to death.”


    “You shot the snake?” Alisha asked, a buttered roll in her hand.


    “I tried. Missed the first couple of times but then I remembered how calm my *daed*
    would be when he held a gun to shoot an animal or a varmint.” She gave a dainty
    shrug. “So I calmed down, aimed and boom, that snake lived no more.”


    “Your grandmother is a remarkable woman,” Mrs. Campton added with a smile. “After
    they heard that story when we were all still so young, my sailor and your granddaddy
    got it in their heads they’d take us to target practice in case we ever needed
    to use a weapon.”


    “I haven’t fired a rifle in years,” Granny said, shaking her head.


    “Well, today, you did just that,” Mrs. Campton said. “Good thing we kept up the
    practice as long as we did.”


    “Yes, good thing.” Nathan finished the baked chicken and mashed potatoes and stood.
    “Ladies, thank you for the food. But I need to go and see what the law found out
    there today.”


    Alisha glanced up at him. “I’m going to stay here and help clean the table. I’ll
    talk to you later.”


    He nodded, the moment of silence between them shouting too loudly while the two
    Annie Oakleys gave each other speaking looks.


    Excusing himself, he turned and left before they forced him to eat a piece of
    coconut cake. The food was great and being pampered reminded him of home, but
    Nathan knew in his heart he had to control all of these sentimental feelings coursing
    through his system. He’d find these killers and then he’d be on his way, on to
    the next case. Finding people was his thing.


    What if he couldn’t find the murderers, though? Would Alisha have to spend the
    rest of her life with this threat hanging over her head? She already blamed herself
    for what had happened to Hannah.


    *That’s partly your fault*.


    His memories of the past suddenly shouted loud and clear.


    “I shouldn’t be here with you, Alisha. I should have stayed with my family. Hannah
    is gone and now I’ve lost everything.”'
