    “Why do the heathen rage, and the people imagine a vain thing?”

    —Psalm 2:1


    To all of the friends I’ve made while writing Amish fiction. Thank you to our
    loyal readers!


    # ONE


    She’d stopped here on a whim. Tired from a lengthy deposition in Philadelphia,
    Alisha Braxton planned to find a strong cup of coffee. She needed to stay awake
    to drive the two hours from the city to the small community of Campton Creek in
    Lancaster County to celebrate Christmas with her grandmother Bettye Willis.


    This quaint Christmas market on the outskirts of Philadelphia beckoned her with
    the promise of something warm to drink and maybe something wonderful to nibble
    on while she traveled. Too busy to shop for gifts before now, she decided she’d
    do a quick browse and buy her grandmother something special. And maybe Mrs. Campton,
    too.


    The two elderly women lived together in the carriage house at the Campton estate,
    now called the Campton Center. Alisha did several hours a week of pro bono work
    at the center. It was a good chance to visit with her grandmother and help out
    the community.


    But this week she wouldn’t be working as much. A whole week with Granny—a gift
    from her firm. Five days before Christmas. Her boss had insisted and, as much
    as she loved her career as an associate with the law firm of `Henderson and Perry`,
    Alisha needed a break.


    She looked forward to spending the upcoming holidays there with her grandmother,
    who’d been Judy Campton’s assistant for years and now her companion since they
    were both widowed. A week off and then she’d get back to her paying hours at the
    small law firm near Reading where she’d worked since law school. The firm was
    a satellite branch connected to the main firm in Philadelphia. Alisha hoped to
    work at the big firm one day, but for now she was paying her dues and working
    her way up the firm’s ladder.


    Taking in the bright lights lining the marketplace that had once been a town square
    on the outskirts of Philadelphia, Alisha pulled her small blue sedan into what
    looked like the last available parking place. A couple strolled by together, holding
    hands and laughing, packages hanging from their arms. The man smiled down at the
    woman then tugged at her long dark hair.


    A surge of longing hit Alisha, causing her to sit there in the dark while the
    couple kissed by a stark white sports car parked directly across from Alisha.
    After putting their packages in the tiny trunk, the man helped the woman into
    her seat and hurried around to get inside.


    They looked so happy, so in love.


    Would she ever have that? Probably not. She’d sealed away her heart and focused
    on work. No time for romance or anything that followed. Once, she’d fallen in
    love. Once. Putting her memories away, Alisha took in her surroundings.


    Dusk moved over the sparkling Christmas trees decorating the tiny square, causing
    the whole scene to shimmer and glisten. People bundled in scarves and jackets
    strolled along the busy open market, sipping hot drinks as they laughed and took
    in the lovely holiday displays. Beautiful but so deceptive. She’d seen the underbelly
    of life too often lately to appreciate the forced facade of a commercial Christmas.
    And she sure didn’t need to sit here longing for something she’d never have.


    “When did I become so jaded?” she said out loud before opening her car door. She
    needed caffeine and maybe something with pumpkin spice.


    She lifted one booted foot out onto the asphalt parking lot, the chilly air hitting
    her in a burst of December wind. Hoping the snowstorm headed this way would hold
    off, Alisha watched a vehicle approaching at high speed. The black SUV came to
    a skidding halt behind the white sports car now trying to back out of the parking
    space across from where Alisha had just pulled in.


    Before she could exit her car, a window came down on the SUV. Then the air shattered
    with the sound of several rapid-fire gunshots, aimed at the sportscar.


    Alisha screamed and sank down in her seat. When the shots kept coming, she crouched
    low and watched in horror as the couple in the sports car scrambled to find protection.


    The gunman kept shooting. And they had no way out.


    Alisha looked up and saw the gunman’s face in the bright lights from the twinkling
    decorations and the glow of streetlights. His cold, dead gaze stopped and froze
    on her.


    She got a good look at him.


    And...he got a good look at her.


    Ducking back down, she held her breath. He’d try to kill her, too. She’d seen
    him. Bracing for a bullet, she heard people screaming, heard footsteps rapidly
    hitting the pavement as pedestrians tried to scramble away.


    *Dear Lord, please help these people and protect me. Help me*. Alisha’s prayers
    seemed to freeze in her throat as she waited for more gunshots.


    Instead, the vehicle’s motor revved and then the dark SUV spun away, tires squealing,
    the smell of rubber burning through the air. Only a few seconds had passed but
    the scene played over in Alisha’s mind in slow motion as she relived the sight
    of that face and then the screams from inside the tiny car. And then...a stunning
    split second of silence.


    She heard people running and screaming. Quickly pulling out her phone, her hands
    shaking, she called `911` as she wobbled onto her feet and hurried to the car
    that now looked like it had been in a war zone, bullet holes scattered across
    it, the heavy vinyl convertible top split and torn.


    “A shooting,” she said to the dispatcher. “At the Christmas market near West Fairmount
    Park.” She named the street and told the dispatcher what had happened. “I... I
    witnessed the shooting.”

