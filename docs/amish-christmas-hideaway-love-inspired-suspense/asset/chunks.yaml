  trans: '

    当他们在一家紧闭的店门口等候时，他将艾莉莎拉近了些，能感觉到她在发抖。“他们这次是怎么找到我们的？”


    “总有人在监视着，”她说，声音颤抖着，“我们快没选择可用了。”


    # 二十章


    “我会处理好一切。”


    艾莉莎对她的老板露出感激的微笑。“谢谢你，亨德森先生，”她说，太累了，没精力留意周围警局的喧嚣。


    当他们回到市警察总部时，黎明已经迎接了他们。由于有人为提供了毯子和靴子，她现在应该很暖和了。但她无法停止颤抖。现在，去米切尔·亨德森的家似乎是正确的做法。温暖、保护，还有另一个可以信任的人。


    但内坦对这个主意并不感兴趣。


    “听着，我们已经尝试了一切，”他说，“有些地方不对劲。我觉得你需要全天候由安全小组包围，并躲在局里这里。”


    “我就得睡在监房里了。”


    “你会安全的。”


    米切尔·亨德森坐在他们身边。“我保证艾莉莎的安全，克雷格先生。我的家是有围栏的。没有密码，谁也进不去。”


    “我要和她一起去。”


    米切尔甚至没有眨眼。“我早料如此。”


    马瑟斯侦探走进来，瘫坐在椅子上。“米莉脑震了，但她会没事的。后门的守卫还在手术。”他耸耸肩，补充道，“入侵者逃脱了。没有指纹。什么都没有。我觉得你们正被某种知道
    24 小时如何跟踪人的鬼魂追杀。”


    “你觉得呢？”内坦问道，充满火气，“你想告诉我们你的嫌疑人是谁，好让我们能提高警惕吗？”


    “我不能那样，”侦探回答道，他的脸就像房间两侧旧白色百叶窗一样苍白，隔绝警局的嘈杂和外的世界。”


    米切尔站了起来。“听着，我的员工会照顾艾莉莎，并提供她和克雷格先生需要的一切。我也有经验丰富的调查员在跟进。你们中没有人能阻止这次袭击。现在轮到我介入保护我的员工了。艾莉莎是我法律团队中宝贵的成员。”


    芬威克探员进入房间。“关于入侵者没有进展。我很抱歉，布莱克斯顿小姐。”


    内坦从她看向侦探。“完全没招了？”


    “我们正在整合信息，”芬威克探员回答道，“我觉得我同意亨德森先生的观点。但有一个条件。”


    “什么条件？”艾莉莎问。


    “我要和你们一起，”女探员说，她深色的眼睛挑衅着任何反对，“我不能让关键证人离开我的视线。昨晚证明了这一点。”


    “我同意她，”马瑟侦探用拖长的、充满怨气的语气说道，“也会尽力帮助。宾夕法尼亚州的阿片类疫情很严重，但我们离抓住这些毒贩只有一步之遥了。我们都希望这些药丸工厂消失。”


    “所以，我们达成共了吗？”芬威克探员向大家问道。


    “我加入，”内坦说，“艾莉莎去哪，我就去哪。”


    “我一样，克雷格私，”芬威克探员回答道，表情不容商量。


    米切尔·亨德森环顾四周。“看来新年期间我的家里要住满了。”


    在大家离开去安排之后，内坦看了看艾莉莎。“我不喜欢这样。他们同意得太快了。我觉得他们知道一些没告诉我们的事情。”


    “比如什么？”


    “比如——他们知道是谁在追我们，但他们不能说出来。他们正把我们当作钓鱼行动的一部分。如果他们搞砸了，就得对付我。”


    “如果他们要设局我们，为什么让我们去米切尔家里？”艾莉莎问。


    “也许他也参与其中，”内坦回答道，“他似乎藏得很深。”


    “内坦，我们必须信任某人。”


    “就像我们昨晚那样？”


    “这些人疯狂，”她回答道，语气极其疲惫，“如果在米切尔家里发现了我们，那么，我就准备好讨论永久搬到一个不公开的地方了。”


    “除非他们杀了你，艾莉莎。”


    ***


    晚些时候，艾莉莎站在米切尔的女佣为她准备的大卧室中央。“亨德森夫人为你准备了一些衣服，”黑发女佣带着老练的微笑解释道，“六点吃晚餐。”


    “你要替我感谢亨德森夫人，”艾莉莎说，心想这意味着要穿正式衣服吃晚餐。但为什么？她不是来这里社交的。想起内坦早些对她的冷酷的话，艾莉莎疑惑她以后该去何处。


    无声的祈祷让她留在原地。**主啊，让这一切有一个好的结局，让那些死者得到公道，让恶人得到惩罚。**


    “亨德森夫人不在城，”女佣回答道，让她从祈祷中神回来，“她表达了歉意，但嘱咐我借一些衣服给你


    搞笑的是，米切尔没提到这一点，但艾莉莎很庆幸不需要和米里姆·亨德森闲聊。米里姆是一个善良、体贴的人，生活在自己的奢华泡泡里。

