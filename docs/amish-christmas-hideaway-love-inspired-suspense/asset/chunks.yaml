    “大体如此，”马瑟斯侦探回答道。“我们说论的是一个由几位社会知名成员组成的犯罪集团，并由为了金钱不择手段的下流罪犯资助。”


    “你们为什么不保护斯特夫妇？”内坦问，脑海中的警报在作响。


    芬威克探员倾身向前。“我们让他们低调行事，也派了人盯着他们，但他们选择了溜出去逛街。所以我们很高兴你决定和我们分享这些信息。因为相信我，你是杀手名单上的下一个。他们不希望你认出他们的任何杀手或他们中的任何一个人，在不能永久让你闭嘴之前他们不会停止。”


