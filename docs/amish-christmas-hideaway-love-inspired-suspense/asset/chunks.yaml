    She gave him a little smile and held out her hand. Nathan accepted it like a lifeline,
    a thankfulness settling in his heart. Without a word they moved over the quiet
    snow and came up on the cabin.


    “Home,” Nathan whispered. Because for the first time in a long time, this place
    felt like home.


    # TEN


    Alisha stood near the door while Nathan found the light switch. “I do have electricity,”
    he said. “I didn’t go totally off the grid.”


    “That’s good to know.”


    He turned on a small lamp away from the two front windows, probably so no one
    would notice they were here. “It’s not much and I’m not here very often but it’ll
    keep us warm and, hopefully, safe.”


    “Do you have a security system?” she asked.


    “Yes.” He held up his `Beretta`. “This.”


    “Well, that’s reassuring.”


    “Don’t worry. I have good locks on the doors and the windows haven’t been opened
    in years. We’d hear them groaning.”


    She took in the impressive fireplace and the worn black leather couch and tan-and-black
    plaid side chair. The room opened into the tiny efficiency kitchen where two more
    windows held heavy blinds over the sink.


    “Has this cabin always been here?”


    “Nope. I built it about five years ago.”


    The man never ceased to amaze her or surprise her. “By hand, I’m guessing.”


    “Yes. By hand with salvaged logs and lumber. It’s solid.”


    As solid as the man who lived here alone. If he ever actually stayed here. “Do
    you come here a lot?”


    “Only when I’m not on a case, which is pretty much never.”


    “You should take time, Nathan. Time for yourself.”


    Giving her a tightly controlled stare, he said, “I’ll consider that once I know
    you’re safe.”


    Alisha didn’t push him. The man didn’t ever want to talk about his own life. “I
    feel safe here,” she admitted. The little cabin was cozy and homey but a bit spartan.


    “The bedroom and bath are over there,” he said, pointing to an open door. “I’ll
    take the couch.”


    “You don’t have to do that.”


    “Yes, I do. I can guard both the front and back doors.”


    “In that case, yes, I’ll be glad to take the bedroom.”


    He moved around, checking the shadows, adjusting the curtains and blinds. “If
    you want to change, go ahead. I’ll make us some coffee and we can map out a plan.”


    “A plan?”


    “Just in case we have to run again,” he said before turning to the stove.


    Alisha took off her bonnet and heavy wool cap but left on her apron and dress.
    “I’m fine in these clothes for now.”


    Nathan quickly shed his overcoat and turned to stare at her. “Wow. With your hair
    pulled back and that dark blue dress on, you do look Amish.”


    “A lot more comfortable than the suits I usually wear,” she said, holding out
    the full skirt. “I have too many clothes so I can appreciate the simplicity of
    this outfit.”


    “The Amish are innovative and practical. Nothing is ever wasted.”


    Alisha stared him down. “You look rather Amish yourself.”


    “It never actually left my system. Old habits die hard.”


    He wore a deep blue long-sleeved shirt over brown broad-fall pants and dark laced-up
    boots. Seeing him dressed this way again brought back a lot of memories for Alisha.


    “Those clothes are a little small for you,” she noted while he washed the percolator
    and found a tin of coffee.


    How could she ignore the way the shirt fit him too tightly? Nathan had always
    been handsome but now he held a world-weary attractiveness. She needed to remember
    they were no longer kids with a crush on each other.


    But she also remembered what she’d felt for Nathan so long ago had been more than
    a crush. After they’d broken up, she’d decided to never let her guard down again.
    She shouldn’t do that now.


    He turned, checking on her quietness. “Yep. Not quite my size but at least all
    Amish clothes are made loose. That helps.”


    “Yes, my skirt is plenty big.” She came out of her stupor and twirled around.
    “And warm.”


    Nathan was the quiet one now. His gaze moved over her with a deep warmth. Moving
    closer, he said, “You look beautiful.”


    “Thank you.” They stalled out on the fashion talk. “Nathan, do you think they’ll
    find us here?”


    “I hope not. Carson and one of his men who looks similar to me took my truck to
    a motel out on the main highway and the police put two plainclothes officers nearby
    to see who shows. So we’ll see if they go looking there first.”


    Alisha wondered if someone had seen them leaving the estate, but they’d circled
    back by the creek and crossed over the main covered bridge so it would look like
    they were walking from a nearby farm. The late hour would be questioned, but if
    stopped they’d had the excuse of visiting into the night with a sick relative.


    “Why did you tell me to run to your father’s house if something happened?” she
    asked, remembering his words from before.


    “It’s the closest one to this cabin,” he explained when he brought over two cups
    of dark, rich coffee. “Just through the woods, about a half mile beyond the cabin.
    A narrow path but there. Look for the birdhouses.”


    He’d always loved building birdhouses. She still had one he’d made for her, a
    small white house with blue shutters and flowers painted on the sides. He told
