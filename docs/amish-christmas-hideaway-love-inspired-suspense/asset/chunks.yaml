    Nathan turned the old buggy into the lane, relieved that they’d gotten Bettye
    and Judy settled. The two women had insisted they bring home cake and cookies
    even though they’d barely dented the feast his *mamm* had prepared. He’d gain
    ten pounds if he stayed here much longer.


    “Go and get warm, Daed,” he told his father. “I’ll put away the buggy and rub
    down Petunia.” The ornery mare lifted her nose and snorted her approval on that.


    “*Denki*,” Amos replied, nodding as Nathan stopped at the side of the house to
    let him off.


    Nathan clicked the reins and started Petunia toward the barn, but his dad came
    running to stop him. “Nathan, the front door is open.”


    Nathan stopped the mare and hopped from the buggy, his heart surging as he sprinted
    past his father. “Stay by the buggy,” he called, using his good arm to wave his
    father away from the house.


    Nathan crashed through the front door, his heart fighting to burst from his chest.
    What had he been thinking, leaving the women here alone? He’d enjoyed the drive
    with his father but he’d been concerned about leaving Alisha and his mother here.
    And for good reason.


    Now he hoped he wasn’t too late.


    After moving through the house to check the dark rooms and finding no one, he
    sprinted to the back door and out into the yard, careful to stay behind the trees
    until he could get his bearings. The crescent moon hung low in the sky, causing
    shadows to cast wide from the woods and the barn. When Nathan felt a hand on his
    arm, he whirled, ready to fight, and found his father standing there holding a
    shovel. “Use this if need be.”


    Nathan let out a breath. “I’m afraid to call out. They’ll take them if they know
    we’re here.”


    His father shot him a grim look, but thankfully, didn’t remind him that this was
    his fault. This couldn’t be happening all over again. He wouldn’t lose another
    family member to evil and he would not lose Alisha again—to that same kind of
    evil.


    Then Amos lifted his head. “Listen. Do you hear that?”


    Nathan squinted and listened. “The barn? Someone’s trying to get in the barn.”


    Amos rushed past him, but Nathan held him back. “They must have hidden there and
    now someone is out to find them.”


    “We must go,” Amos said, lifting away.


    “You stay. I’ll go,” Nathan said, a gentle plea in his words.


    “Bring your mother back to me,” Amos replied, that same plea caught in his words.


    Nathan hurried toward the barn but when he was about to make the last sprint toward
    where a man stood trying to pry the door open, he heard a great swish and watched
    as someone from inside shoved one of the big doors open. Then the two big drafts
    came charging out. The surprised man trying to break in screamed and went down,
    one of the horses hitting him and knocking him over.


    Amos rushed forward. “*Was der schinner is letz*?”


    His *daed* wanted to know what was wrong. So did Nathan.'
