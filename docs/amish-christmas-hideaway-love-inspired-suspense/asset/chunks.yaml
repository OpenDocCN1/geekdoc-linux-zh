    He was off-limits and yet, right now, she wanted to reach up and brush those thick
    curls off his forehead.


    “Thank you, Nathan,” she said instead.


    “You can thank me when this is all over,” he replied, removing his hands as if
    he’d been burned.


    Alisha accepted that, the loss of his touch already moving through her with aching
    clarity. Grabbing her briefcase, she hurried to the double doors of the carriage
    house entryway, where an open portico separated the garage and the upstairs apartment
    from the main house. Glancing up at the enclosed upper breezeway, which allowed
    people to move from the garage and second-floor apartment to the main house during
    bad weather, Alisha breathed deeply and shivered in the late-night cold. She had
    a key but she rang the bell instead so she wouldn’t scare her grandmother by slipping
    into the house.


    “Alisha?”


    Hearing her grandmother’s sweet voice over the intercom brought tears to Alisha’s
    eyes. “Yes, Granny. It’s me. Sorry I’m so late.”


    “Come on up,” Bettye said, buzzing the door open.


    Relief filled Alisha’s soul but with it came the letdown of adrenaline and the
    horrible realization of what she’d witnessed. Her hands started shaking but she
    held her briefcase with a death grip to keep from falling apart.


    Nathan stepped up and placed his arm across her shoulder, tugging her close. He
    then took the heavy bag. “I’ve got you,” he whispered as he pushed open the door
    for her. “Don’t fall apart on me now, okay?”


    Alisha swallowed her fears and the delayed reaction to everything she’d been through
    in the last few hours. “I’ll be all right.” She didn’t want to fall apart and
    she didn’t want him to be kind to her.


    But she didn’t push him away. She *did* need Nathan. And not just to help her
    stay alive. The strength of his grip reminded her that he’d once made her feel
    so secure. That feeling had returned tonight, but she’d have to get it out of
