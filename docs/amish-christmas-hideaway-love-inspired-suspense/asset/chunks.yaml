  raw: 'Had met Nathan in a park out by the creek when they were both in their late
    teens.


    Nathan, who’d been Amish then.


    Nathan, who now had few scruples when it came to bringing justice to this world.


    He no longer lived among the Amish but for close to fifteen years, he had made
    it his life’s work to always help and protect the Amish. Because he had to help
    others seek their loved ones so they wouldn’t have to live with the pain he carried
    in his heart.


    His younger sister had gone missing after Nathan and his father had fought about
    his relationship with Alisha. Hannah had been found dead a few weeks later.


    Nathan blamed himself. Alisha lived with that same guilt.


    She shouldn’t have called him tonight. She had her life in order, had her routines
    down, worked hard, rarely dated. She’d learned to be her own hero. Because she
    never wanted to go through that kind of pain again, either.


    Nathan could complicate all of that.


    He could also save her life.


    Alisha checked her mirror again and tried to stay calm. She knew how to take care
    of herself. She’d given the police her statement, described in detail the vehicle
    and the man she’d seen, left the officers and detectives her contact information
    and finally had been given permission to leave.


    “Will you be all right, Miss Braxton?” one of the detectives at the gruesome scene
    had asked her.


    “I will be when I get to my grandmother’s place,” she’d replied, glancing around
    the empty parking lot. The marketplace had been shut down until the crime techs
    could scour the scene. By then the authorities had questioned all of the witnesses,
    but most of them had just heard gunshots and seen the SUV speeding out of the
    parking lot.


    Alisha had been the only eyewitness to the murders.


    “We can give you an escort,” one of the detectives had suggested.


    “That might make me feel better,” she’d admitted. “It’s about two hours from here.”


    They arranged for a patrol car with two officers to follow her, staying close.
    She’d watched their car through her rearview mirror, feeling safe, until she’d
    heard screeching tires and gunshots.


    And watched the patrol car careening off the road and into a rocky incline. It
    had burst into flames.


    Now she prayed for those two officers, but she knew in her heart they were probably
    dead. If the crash hadn’t killed them, the shooter would make sure they were dead.


    She would be next.


    *Hurry, Nathan.*


    When she saw a car approaching, Alisha gasped and watched as it zoomed close.
    Dark, big, gaining on her.


    Alisha couldn’t tell who was behind her, but the driver had a lead foot. Coming
    up on another curve, she took a quick glance in the rearview mirror. The big vehicle
    was still gaining on her.


    Then she saw the headlights of another vehicle off in the distance, coming from
    the other direction. Her turnoff was up ahead but the on-coming car could be the
    SUV retracing the same route. Could she make it before either vehicle caught her?
    She’d have to speed up and make a hard right turn. Checking again, she gauged
    the distance and monitored the oncoming car, hoping she’d be past it before she
    spun to the right. Meantime, she prayed the vehicle behind her would keep moving
    ahead instead of following her.


    The night was dark and cloudy, with a possible snowstorm headed across the state.
    Out here, where few streetlights existed, the hills and valleys looked ominous
    and misshapen. The ribbon of road twisted and turned and meandered like a giant
    gray snake.


    The vehicle behind her gained speed. When it came close enough to tap her bumper,
    Alisha let out a gasp and held tight, bracing for a collision. But the vehicle
    didn’t hit her. The driver stayed close but never made contact.


    It was now or never.


    Taking a breath, Alisha held onto the wheel and watched for the turnoff. Then
    with a prayer and another gulp of air, she slowed enough to turn the wheels of
    her car to the right onto the narrow road. Her car wobbled and fishtailed her
    heart bumping and jumping while she tried to keep control. If she lost the wheel,
    she’d go careening down into a deep ditch. Or worse, a rocky embankment.


    Her nerves tightly knotted, Alisha managed to regain control of the car and stay
    on the road. Letting out a breath, she gathered her wits and glanced into the
    rearview mirror. To her dismay, the car that had been approaching from the other
    direction was now following her.


    They’d found her.


    # TWO


    Nathan hit the steering wheel again, wishing Alisha’s phone worked. Her battery
    must have finally fizzled out. He couldn’t reach her. But he’d been tailing her
    for two miles when he looked up and saw another car coming down a hill toward
    them.


    Then he’d watched in horror when Alisha had made a sharp right turn, his heart
    stopping while he watched her car careening wildly.


    She’d made it off the main road and he was headed to follow her when a big dark
    SUV coming from the other direction turned onto the same route she’d just taken,
    cutting Nathan off as it whipped in front of his truck.


    “No.” Nathan slammed on his brakes to avoid a collision and then hit the gas pedal
    again. “Where are you, Carson?” The deputy sheriff should have been here by now.
    Carson would have alerted the town police, too, since he didn’t have the authority
    to make any arrests.


    But if those men saw the deputy tailing them, they could have shot at Carson,
    too.


    *Lord, please protect my friend*.


    The silent prayer felt foreign and raw inside Nathan’s head. He rarely prayed
    these days, but he still believed deep down inside. Right now, he needed the Lord
    to hear him on a lot of accounts.


    Alisha needed him. He had to get to her.


    He slipped and slid onto the turnoff, noting where Alisha’s car had gone, his
    heart doing that jumpy thing it always did each time he came back to the place
    he’d once called home.


    The place where he’d fallen in love with a beautiful *Englisch* girl who had her
    own dreams and ambitions. The girl who’d walked away from him because she felt
    as if she’d only remind him of the worst night of his life.


    If he didn’t find her, *this* would be the worst night of his life. He might have
    lost his sweet little sister Hannah, but he would not lose Alisha.


    Not this time.


    Nathan hurried along the dark, deserted road and noted the two vehicles up ahead.
    The big SUV hovered near Alisha’s sedan. He had his weapon concealed in a shoulder
    holster and he’d shoot first and ask questions later.


    When Alisha’s vehicle swerved around a curve, Nathan took off and caught up with
    the SUV following her. While the sleek vehicle inched closer to her, Nathan did
    the same with the aggressive SUV.


    He knew a certain spot up ahead where if he hit at its back bumper just right,
    he could force the SUV off the road long enough to allow Alisha to get to safety.


    Preparing, Nathan kept his eyes on the two cars up ahead. Then he looked in his
    rearview mirror and saw another vehicle approaching. A traffic jam on this road
    late at night? Unbelievable. He hoped Carson had found them.


    His cell buzzed. Careful to keep his gaze on the road, he let the call come through
    his truck’s Bluetooth.


    “I’m behind you,” Carson said. “The locals are out in force since they’ve heard
    what happened. There’s a BOLO out based on the eyewitness description.”


    “They’re following that witness,” Nathan replied, relieved for the backup. “I
    can’t let them get to her.”


    “I’m trying to catch up with them.”


    “They have to be the same people who killed someone in front of Alisha earlier.”


    “Why did she come here?” Carson asked.


    “She’s afraid and...she must have been coming to see her grandmother. I don’t
    know. She panicked, I think.”


    She had to have panicked to call him, Nathan reasoned.


    “Dangerous situation,” Carson replied.


    “Be careful,” Nathan warned. “They’re armed.”


    “I won’t do anything stupid,” Carson said. “I’m here to observe and help with
    transport, if needed.”


    “Okay. I’ll tail them until we meet up.”'
