    # EIGHTEEN


    Why was going away so hard?


    Alisha looked into Martha Schrock’s sweet eyes and saw the pain of a mother watching
    her son leave yet again.


    “I don’t know how to thank you,” she whispered to Martha as they huddled near
    the door watching for the unmarked car to arrive.


    It was early and dawn would be here soon. The whole world glowed white, the snow
    covering everything like a chenille blanket. The white houses and barns in the
    distance hulked like weary giants against the sky. The wind held a piercing chill
    that caused Alisha’s tears to slip silently down her cold cheeks.


    “No thanks needed or expected,” Martha replied, taking Alisha’s hands in hers.
    “No matter what, we have our Nathan back and that is a gift that can’t be taken
    from us.” Then she leaned close. “I know you will protect him with all of your
    heart.”


    Alisha nodded, unable to speak. Her grandmother and Mrs. Campton had explained
    this kind of love to her. Men were born protectors but women protected their men
    with a love that came from the heart—the fiercest kind of love.


    Alisha had never truly known that concept until now. Even when they were young
    and so in love, she’d been selfish. She’d given up on Nathan too quickly and gone
    off to do what she thought she needed to do. But she’d become jaded and critical
    of love, had fought against it and closed off her heart.


    She wouldn’t do that this time, even if she and Nathan couldn’t make it work.
    But she wanted it to work. “I’ll try my best,” she managed to say.


    Martha hugged her close. “Send word.”


    Amos didn’t hug Alisha but he patted her arm. “*Gott* will watch over you both.”


    Nathan stood nearby, awkward and clearly shaken. “We’ll let you know how things
    progress.”


    His mother rushed to hug him. “Take care and Nathan, *kumm* home to see us soon.”


    “I’ll do that, Mamm,” he said, his eyes searching Alisha’s face while he hugged
    his mother.


    Amos cleared his throat and nodded. Nathan shook his father’s hand. “*Denki,*
    Daed.”


    Amos didn’t speak for a moment but his eyes were gentle on his oldest son. He
    had not condoned them arriving here but he’d held his thoughts and allowed them
    to stay. Alisha appreciated that for Nathan’s sake. “Better get on.”


    Carson pulled up close to the house in a plain older-model car.


    “Time to go,” Nathan said, taking Alisha by the hand. Giving his parents a brief
    smile, he guided her to the waiting car.


    Soon they were huddled in the back seat, warm air taking away the morning chill.
    Alisha took one last look at the two people standing on the porch.


    “Carson?” Nathan asked.


    “They put undercover state police all around the property,” Carson replied. “You
    two have kept the town and state police departments busy this Christmas season.”


    “Thank you,” Nathan said.


    Carson lifted something from the front seat. “I thought you might want this, Alisha.”


    “My briefcase,” she said with glee. “You got it back.”


    “After they cleared the cabin, I asked permission to bring it to you. Nathan,
    your stuff is in there, too.”


    “Now we have the files we’ve saved,” Alisha said. “Those men were in such a hurry
    to capture me, they didn’t find this.”


    “We can all rest when this is over,” Nathan said, his arm across Alisha’s back.


    She turned to face him and he gave her a wry little smile. “We’ll get through
    this. I promise.”


    But that would be a hard promise to keep. If Nathan failed this time, it would
    be so much worse for him to get over. In saving Alisha, he’d find that redemption
    he so needed.


    She had to work hard to make sure they both stayed alive. After that, she’d figure
    out the rest. Would he want to stay this close? Or would he go back to being a
    lonely nomad?


    Since they’d left in the middle of the night, Alisha didn’t object when Nathan
    tugged her close. “Sleep,” he whispered in her ear. “Rest.”


    She didn’t argue. She might not sleep but she could rest in the safety of his
    arms. And she said a prayer of thanks for that at least.


    When she later woke with a start, Alisha lifted up and stared out at the landscape.
    “Are we almost there?”


    “Hey, sleepy-head,” Nathan said, lifting her hair away from her eyes. “Do you
    feel better?”


    “I don’t know,” she answered, slipping away from his warm embrace so she could
    get her bearings. “I’ve forgotten what better feels like.” Then she noticed they
    were off the main interstate highway into the city. “Where are we?”


    “Carson’s taking the side roads in a zigzag fashion,” Nathan explained. “Better
    to be safe.”


    “Not much longer,” Carson said over his shoulder. “We’re almost to the city.”


    Sitting back, she watched the buildings and began to recognize the area and then
    she glanced at Nathan. Since they’d kept on their Amish clothes, he’d put on a
    dark hat. He was handsome either way, she decided.


    To take the edge off the pain that shot through her each time she thought of losing
    him again, she looked into the rearview mirror. “Deputy Benton, you’ve gone beyond
    the duties of a sheriff’s deputy. Does Nathan have something on you?”'
