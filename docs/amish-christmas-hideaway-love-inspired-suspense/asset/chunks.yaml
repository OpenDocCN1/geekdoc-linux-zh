    Then she moved silently back down the stairs to find him roaming from window to
    window.


    “Is someone out there?”


    He nodded, waiting, a finger to her lips. “Go to your room but stay by the door.”


    Alisha didn’t argue. She had to stay quiet. If his folks woke up, they could get
    caught in the crossfire.


    Nathan came away from the window and called to her through the partially cracked
    door. “Listen to me. I’m going to go and check the barn. If I’m not back in five
    minutes, wake my `daed`, all right?”


    She nodded, anxiety making her breath come too shallow. “Where does your father
    keep his hunting rifles?”


    “You don’t need to worry about that.”


    “Nathan, I know how to shoot a gun.”


    He shook his head. “He keeps them in the barn, locked in a cabinet. We can’t get
    to them, so just stay in your room.”


    Alisha watched as he carefully opened the back door down the hall past the mudroom.
    She couldn’t stay still so she went to her room and peeked between the modesty
    curtains, the moonlight shining brilliantly against the whiteout.


    Nathan hurried in a hunched run toward the barn.


    Then she saw a lone shadow moving around the west corner of the looming structure.


    Grabbing a shawl she’d left on the bed, she hurried around to the back door. She
    had to warn Nathan.


    # SIXTEEN


    She’d made it to a mushrooming old oak tree when she heard what sounded like a
    grunt, followed by an animal’s whinny. After that, she heard muttered voices.
    Then she saw that same shadowy figure running toward the woods. Nathan came around
    the barn, watching as the man took off in a fast getaway and dived over the corral
    fence.


    Nathan stood watching and then turned back toward the house. When he got close,
    she called softly. “Nathan?”


    Surprised, he whirled and stomped toward where she stood hidden behind the massive
    tree trunk. “Why do you always insist on leaving your post?”


    “Why do you always try to be a hero?” she retorted. “You could have been killed.”


    He took her in his arms and held her close, the tree blocking them from the house
    and the woods. “The same with you.”


    Alisha held him tight, feeling his heartbeat moving with hers. “Did you get a
    look at him?”


    “Not a good one. But I warned him I had a pistol trained on him and I would shoot
    to kill. Then while he was pondering that, one of the old male goats gave him
    a run for his money. I’m surprised the noise didn’t wake my parents.”


    “I heard a few grunts,” she said, relief washing over her. “Do you think he’s
    gone?”


    “For now. He’d be an idiot to come back tonight.”


    Alisha looked up and saw Nathan gazing down at her, his eyes a deep blue in the
    shimmer from the moonlight. “We can’t keep doing this,” she said. “Because they
    won’t give up.”


    “I know.” He studied her as if he were trying to memorize her face and then reached
    a hand up, digging his fingers in her hair. “I know.” Then he leaned down and
    touched his lips to hers. “I won’t give up, either, Alisha.”


    His touch caused Alisha to pull him close and kiss him back. This wasn’t like
    the adolescent kisses she remembered from the past. This was a grown man holding
    her in his arms, his lips conveying what he couldn’t say and telling her they’d
    lived a million lifetimes since he’d last held her this way.


    But the moment ended too soon. He pulled back to stare down at her again, a deep
    burning agony covering his face. “It’s cold. We should get inside.”


    Alisha couldn’t speak. He put his hand against her backbone and guided her toward
    the back door. They moved inside without making any noise, the house warm and
    quiet and still, as if holding its breath in the same way she was holding hers.


    Nathan once again tugged her toward the door to her room. Then he shoved his pistol
    into her hand. “Keep that close. I’m sleeping in the living room tonight.”


    With that, he was gone, pulling her door shut before she could respond.


    Alisha doubted either of them would get any sleep. They still had a lot between
    them—bad people wanting her dead, his family having to deal with all of this and
    the feelings they were both trying so hard to fight.


    How would she ever make it through any of this? But how would she have made it
    this far without his help?


    After she’d put on the billowy nightgown Martha had given her, Alisha lay in bed
    and said her prayers, the memory of that midnight kiss staying with her.


    *We need mercy, Lord. We need guidance. We need You. I’ve drifted away from my
    faith. I got caught up in work and loneliness and life. But I know You are there,
    always. I need You as my shield now. Nathan needs you. He’s been carrying this
    horrible burden for a long time and he’s forgotten how to love. Maybe we can show
    him that’s still possible*.


    After she’d prayed, she closed her eyes and thought of how she’d felt when he’d
    held her and kissed her. She’d felt at home and at peace. If only she could feel
    that way forever.


    * * *


    The next morning, Alisha got up early to help Martha in the kitchen. After she’d
    dressed and made sure she looked as Amish as she could by wearing her hair pinned
    up underneath a white `kapp`, she checked her apron and dress and decided her
    own black boots.

