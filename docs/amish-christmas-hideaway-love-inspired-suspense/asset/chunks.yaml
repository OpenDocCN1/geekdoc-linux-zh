  raw: '“They should be here by now,” Amos said. “Are you sure your friend will be
    able to get them here?”


    “Yes. I told him to come early,” he replied, rubbing his hands together. “But
    those two have a mind of their own and they only move at one speed.”


    “Slow?” Amos laughed. “They are your elders so be mindful.”


    “Oh, I’m mindful,” Nathan said. “They can hold their own.”


    Amos stood silent for a moment, one old boot caught against the fence railing.
    “Did you and Alisha take a moonlight stroll last night?”


    Nathan tried to form an answer and decided to go with the truth. “We did. I heard
    a noise so I wanted to check the animals. She asked to come with me.”


    His father gave him a slanted glance. “I thought I heard voices. Your *mudder*
    said I was dreaming.”


    “We didn’t stay out here long,” Nathan replied, memories of their shared kiss
    warming his skin. “It was chilly.”


    Amos looked into his eyes. “Are you sure everything is all right?”


    “Today, everything is perfect,” Nathan replied, praying it so. “Or at least it
    will be when they get here.”


    He wondered if his father knew more but decided he’d explain later. After kissing
    Alisha, Nathan felt in over his head with trying to protect everyone and deal
    with his growing feelings again. He’d locked away those feelings forever, or so
    he’d thought. Getting all tangled up in these aching emotions did no good right
    now. He hoped Alisha would understand that.


    Amos watched the road. “There, son. They are here.”


    Nathan’s heart filled with joy. He couldn’t wait to see Alisha’s face. Would she
    like his Christmas surprise?


    “Let us get to it then,” his *daed* said with a soft smile. “Merry Christmas,
    Nathan.”


    “Merry Christmas, Daed.”


    They hurried to the house and had just entered the back door when they heard the
    buggy coming up the drive.


    Martha turned and winked at him. “We have some very early guests arriving.”


    Nathan looked at Alisha and saw the apprehension in her eyes.


    “Should we hide, Nathan?” she asked.


    The fear in her voice flooded him. Who was he kidding? He’d walk through fire
    to protect her and hold her in his arms again. “I think we’re safe.”


    Amos waved his hand in the air. “No hiding. These are *wilkum* guests.”


    Alisha’s frown went from fearful to curious. Moving to the front of the living
    room, she peered out the window. “That’s Josiah Fisher. Is he bringing his family
    to visit?”


    “*Neh*,” Martha said, holding a hand to her lips. “He is doing a favor for a friend.”


    Nathan couldn’t hide his grin. “You’ll see.”


    He moved to stand by her, so he could watch her face while she watched the buggy.
    Alisha shot him one of the questioning glances he remembered before...before they’d
    become close again.


    “Just relax,” he whispered. “It’s Christmas. Nothing bad can happen to us today.”
    He’d make sure of that.


    Then he motioned to the buggy.


    * * *


    Alisha followed Nathan’s gaze and waited. What was he up to now? Did he plan to
    whisk her away and put Josiah in danger, too? She knew they were close since Nathan
    had helped Josiah find his missing sister Josie. Now the young woman lived with
    Josiah and Raesha and Raesha’s former mother-in-law Naomi. She’d helped them with
    the same case, which had involved an abandoned baby that they were now raising.
    A happy ending.


    But why involve Josiah in *this*?


    Josiah waved to them and then went to the back of the buggy and untied what looked
    like a folded wheelchair. Then Nathan went out to carefully help the two Amish
    women out of the enclosed buggy, a slow process since they both appeared to be
    elderly. Unable to see who they might be since they were covered from head to
    toe in bonnets, shawls and cloaks, Alisha waited patiently.


    After all, this wasn’t her house. She couldn’t make demands or run and hide. The
    others seemed so excited, she figured these two must be matriarchs of some sort.


    After Josiah had one of the women in her wheelchair, he turned and nodded, a smile
    crossing his handsome face. Then the two women smiled.


    “Let’s go and greet them,” Martha said, moving toward the door.


    Nathan came hurrying back and took Alisha by the hand.


    She watched as the two women looked toward the house and then she saw their familiar
    faces. Gasping, she glanced at Nathan as he hauled her to the open front door.
    “Is that...my grandmother and Mrs. Campton?”


    He bobbed his head. “It is. My Christmas gift to you.”


    “Nathan.” She couldn’t speak. Her eyes pricked with moisture. “Nathan.”


    His eyes grew misty. “Just for today, we’ll pretend that everything is okay.”


    Amazed and touched, Alisha reached up and kissed him on his jaw. “Thank you.”


    Then she took off down the steps to hug her grandmother tight.


    The next few minutes were a blur of hugs and happiness and both her grandmother
    and Mrs. C talking at once.


    “We planned the whole thing—with Nathan’s help, of course. And that sweet Carson.
    He is a true lawman—a hero. He’s kept us up-to-date and coordinated things with
    our police department and so our place has been surrounded with guards.”


    “We decided we’d have fun with it and dress up in disguises in case anyone was
    watching. But we’ve been fine at our house. Those mean men know you’re no longer
    there and that we have those dedicated guards always checking on us.”


    “And Josiah was so kind to leave his family to bring us here. He’ll get extra
    cookies for his efforts, of course.”


    “They are staying for dinner,” Martha explained after Josiah had said his goodbyes,
    a container of snickerdoodles on the buggy seat next to him. “And we will exchange
    gifts later.”


    “I don’t have any gifts to give,” Alisha said, her heart filling with love for
    their bravery in sneaking out to come here.


    “Being here with you today is the best gift,” Granny said, her eyes welling up
    with tears. “We have prayed for both of you and when Carson let us know you were
    here, we were so relieved. We understand Nathan was injured and you ran away into
    the woods.”


    Alisha nodded as they all gathered in chairs by the warm stove. Martha and Nathan
    stayed in the kitchen preparing coffee and bacon along with homemade cinnamon
    rolls to tide them over until the big meal. She glanced up at Nathan and thought
    seeing his smile was the best gift she could ask for. He’d risked a lot, bringing
    these two women here to share Christmas with her. She’d never forget that.


    “I did get away from the cabin,” she said, taking a deep breath, the horror of
    that night still with her. She didn’t go into too much detail. “After they shot
    Nathan, I was afraid they’d kill me, too. I had some pepper spray in my pocket
    and I used it. Then a big stag we’d seen earlier came charging through the woods
    and scared them away.”


    Nathan put down the dessert plates he’d taken down out of the cabinet and held
    his free hand against the sling his mother had changed out earlier. “Alisha, you
    saw the deer again?”


    “Yes. I didn’t think to tell you. He came along the path and almost rammed one
    of those men holding me.”


    “I saw the stag later too,” he said. “In fact, spotting him helped me to find
    you.” He shrugged. “Almost as if he led me to you.”


    Mrs. Campton, her bonnet still on, clapped her hands and smiled. “God’s creatures
    can sense fear and danger, even evil, I believe. You are both blessed to have
    had some of nature’s help that night.”


    “Amazing,” Alisha said, remembering how they’d quoted part of Psalm 42 to each
    other. “He was beautiful,” she said, her eyes holding Nathan’s. “I hope that big
    deer stays safe out there. He obviously likes the birdhouse path.”


    Martha spoke up. “I’ve seen those beautiful birdhouses. We’ve often wondered who
    owns that land. Did you say you were hiding in a cabin?”


    Alisha’s gaze crashed with Nathan’s. “Yes.”


    Nathan looked back and forth between his parents. “I own the cabin. I bought the
    land and built the cabin even though I don’t get to stay there as often as I’d
    like.” He shrugged and lowered his gaze. “And, Mamm, I made the birdhouses.”'
