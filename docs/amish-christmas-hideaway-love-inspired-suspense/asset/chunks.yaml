    a hand up, digging his fingers in her hair. “I know.” Then he leaned down and
    touched his lips to hers. “I won’t give up, either, Alisha.”


    His touch caused Alisha to pull him close and kiss him back. This wasn’t like
    the adolescent kisses she remembered from the past. This was a grown man holding
    her in his arms, his lips conveying what he couldn’t say and telling her they’d
    lived a million lifetimes since he’d last held her this way.


    But the moment ended too soon. He pulled back to stare down at her again, a deep
    burning agony covering his face. “It’s cold. We should get inside.”


    Alisha couldn’t speak. He put his hand against her backbone and guided her toward
    the back door. They moved inside without making any noise, the house warm and
    quiet and still, as if holding its breath in the same way she was holding hers.


    Nathan once again tugged her toward the door to her room. Then he shoved his pistol
    into her hand. “Keep that close. I’m sleeping in the living room tonight.”


    With that, he was gone, pulling her door shut before she could respond.


    Alisha doubted either of them would get any sleep. They still had a lot between
    them—bad people wanting her dead, his family having to deal with all of this and
    the feelings they were both trying so hard to fight.


    How would she ever make it through any of this? But how would she have made it
    this far without his help?


    After she’d put on the billowy nightgown Martha had given her, Alisha lay in bed
    and said her prayers, the memory of that midnight kiss staying with her.


    *We need mercy, Lord. We need guidance. We need You. I’ve drifted away from my
    faith. I got caught up in work and loneliness and life. But I know You are there,
    always. I need You as my shield now. Nathan needs you. He’s been carrying this
    horrible burden for a long time and he’s forgotten how to love. Maybe we can show
    him that’s still possible*.


    After she’d prayed, she closed her eyes and thought of how she’d felt when he’d
    held her and kissed her. She’d felt at home and at peace. If only she could feel
    that way forever.


    * * *


    The next morning, Alisha got up early to help Martha in the kitchen. After she’d
    dressed and made sure she looked as Amish as she could by wearing her hair pinned
    up underneath a white *kapp*, she checked her apron and dress and decided her
    own black boots didn’t look too out of place since the heels weren’t very high.
    Nathan had suggested they dress to blend in. Although his parents didn’t expect
    any visitors until tomorrow, they had to take every measure to look the part.
    Especially after what had happened last night.


    She wondered how exactly Nathan had slept, but figured he’d found a quilt and
    pillow and curled up by the stove. She also wondered if his parents had found
    him that way and asked for an explanation. She only knew something had changed
    between them there underneath that sheltering oak tree.


    They’d both let down their guard. That could be so good or it could turn out to
    be the worst thing for both of them. She had to talk to him and make sure he understood
    this could never work.


    But when she walked into the living room, she didn’t see Nathan or his father.
    Or Martha either.


    A sense of panic overcame her. Where was everyone? She checked the side room and
    didn’t find any of them. Then she went to the back door and searched the yard
    before looking out toward the fields and barn.


    When she spotted Nathan coming out of the barn with his father, her relief was
    so great she closed her eyes and fell against the wall to gulp in deep breaths.


    “Alisha, are you not well?”


    Alisha looked up to find Martha standing in the kitchen, holding a basket of wrapped
    gifts.


    “Oh, I’m sorry,” Alisha said. “I couldn’t find any of you and I got worried.”


    Understanding flowed through Martha’s eyes. “I went into my chest upstairs to
    bring out our gifts,” Martha explained. “I had to wait until the men were out
    of the house. Nathan was already up and out tending the livestock when we came
    down.”


    So that explained that. He’d probably gone out to the barn to search for any signs
    of that intruder.


    “I can help you put the gifts out,” Alisha said, her heart still racing. “Silly
    me. I’m not usually so jumpy.”


    “Understandable.” Martha gave her a head-to-toe check, however. “You look very
    pretty this morning.”


    “Thank you,” Alisha said. “Do you want me to take that?”


    “We’ll leave these things in the basket,” Martha said, taking the beautiful woven
    basket over to the chairs. Placing it by the woodstove, she said, “When they return,
    we’ll get started. But you can help me with breakfast.”


    “I’ll be happy to.”


    When Martha started fluffing pillows, Alisha relaxed a little. But something about
    Martha’s busy work shouted that the other woman, usually so serene, had something
    on her mind today.


    Holiday stress? Or had Nathan told his parents about the intruder who’d been snooping
    around?


    Alisha took another deep breath even as she sensed something was off. What were
    they all hiding from her?


    * * *


    Nathan and his dad waited outside the barn, Nathan to watch for any more interlopers,
    and his father to make sure their big surprise actually took place.'
