    She was about to go back upstairs when she heard Mitchell’s voice coming from
    the kitchen.


    “I don’t care what it takes. Keep Kincaid quiet,” Mitchell said into the phone,
    his back turned away from the arched doorway leading from the hallway to the kitchen
    and breakfast room. “We have to contain this mess.”


    Kincaid? Alisha gasped and turned to run away but in her haste, she knocked her
    leg against a hallway table, causing the spindly leg to scrape across the floor.


    Sprinting toward the stairs, Alisha dredged up a distant memory. A man had been
    here at the estate once a few years ago, doing odd jobs. The entire office had
    been invited here for a picnic. Alisha had walked inside to use the powder room
    and she’d heard Mitchell talking to the man—right there in the kitchen. And he’d
    said almost the same thing that day.


    “Get it done, Kincaid. We can’t let anyone see this mess.”


    Who had Mitchell been talking about? At the time, she’d figured someone had spilled
    some food or drink in the immaculate house and Mitchell needed the handyman to
    clean it up.


    But what if it had been something more sinister?


    She was halfway up the stairs when she heard him behind her. “Alisha, we need
    to talk.”


    ***


    Nathan woke with a start. Sleeping wherever he landed tended to make him do that.
    But this time, he was up and searching for his gun. He’d heard a noise. A door
    slamming, footsteps moving through the house.


    Grabbing his clothes, he hit his knee on the nightstand and moaned. You’d think
    he’d become less clumsy since this tended to be a normal thing. Hopping on one
    foot, he managed to get his shoes on. A door downstairs slammed. Then he heard
    an engine revving.


    Rushing out of his room, he saw the cracked door to Agent Fenwick’s room. Nathan
    moved fast and pressed open the door. No one there.


    Hurrying toward the stairs, he saw a woman lying at the bottom. Not moving.


    Nathan skidded to a stop and went on his knees.


    The agent lay on the floor, blood seeping from her head. “Agent Fenwick, can you
    hear me? What happened?”


    The woman on the floor moaned. “He took her. He took Alisha. I tried to stop him
    but...”


    Nathan didn’t have to ask who. He knew. “I’m going after them,” he said. “I’ll
    call for backup.”


    “Careful. He’s going to kill her. Should have warned you.”


    Nathan stood up and shouted into his cell, his heart hitting against his chest
    with such a crushing beat, he almost passed out.


    Why had he let her stay in this house? The FBI had used Alisha as bait to capture
    the real killer.


    Why hadn’t he put a chair in front of her bedroom door and sat there all night?


    How had this happened?


    *You failed again. It’s your fault*.


    The voice in his head screamed at him. But the voice in his heart told Nathan
    to be calm, to trust in the Lord, to pray with all his might. He couldn’t lose
    Alisha now.


    He wouldn’t let that happen.


    So he asked God to please be with him and to guard Alisha until he could find
    her.


    ***

    “Scott has aged since I first hired him,” Mitchell said in a controlled voice.
    Shoving Alisha through the snowy woods ahead of him, he kept talking. “You always
    did have a knack for details. I knew you’d remember sooner or later.”


    “I didn’t recognize him that night at the cabin,” Alisha said, hoping to get to
    the truth at last while she tried to figure out how to escape. Mitchell had hit
    Fenwick over the head after she’d spotted him dragging Alisha down the stairs.
    She wasn’t sure if Nathan had heard anything.


    “You and your PI are tenacious,” Mitchell said, jamming the gun against her ribs.
    “Pity that you decided to stop at the Christmas market that night. What are the
    odds? My men didn’t know who you were.”


    “Mitchell, help me to understand,” she said, her breath coming in gasps as he
    shoved her down the hillside toward a stream below his property. “Why are you
    involved in this?”


    “Miriam,” he said, his tone shaky now. “She has a problem with prescription pain
    pills. An old injury from her show horse days. She found Dr. Joshua West and...that
    was that. Addicted to opioids.”


    Alisha’s shock caused her to stop and turn to face him. “Miriam? That’s hard to
    believe.”


    “Hard to cover up, too,” he added, his expression bordering on frantic. “She learned
    to hide it from everyone, including me.”


    “But why are you involved in this shooting?” Alisha had to know the truth even
    if she never lived to tell anyone.


    “That’s simple, Alisha. I hired this hit. I wanted my wife safe and well but Dr.
    West kept plying her with the drugs and charging her exorbitant amounts of money.
    When I heard he and his uppity wife had decided to turn, I was furious.”


    Alisha’s sympathy didn’t stop her anger. “So you knew from the beginning? You’re
    the one who’s been trying to kill me?”


    “No,” he said, shoving her forward. “I didn’t want to kill you, tried to help
    protect you but if Kincaid talks, he’ll name me as the one who hired him. And...you
    saw the men. They took it upon themselves to try and find you. Too late, I realized
    they were trying to silence you to save their own.”

