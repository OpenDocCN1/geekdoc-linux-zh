- fmt: '

    He thought about holding her last night and how right it had felt. So right that
    he’d forced himself away. Then, watching and waiting, he’d fallen asleep in the
    chair by the fire. And he had the sore neck to prove it.


    “We survived the night.”


    He looked around from where he’d thrown together toast with the freshly baked
    bread Bettye had packed for them. He had a jar of fresh jam in the pantry. “Yes,
    we did. So we’ll stay hunkered down here and hit hard on piecing this thing together.”


    “And hope no one interrupts us,” she replied, worry sounding in her words, her
    eyes darting toward the windows.


    “Yes.”


    Nathan kept one ear to the ground while they ate. Because even though he hadn’t
    found any footprints around the cabin, that didn’t mean they were safe.


    He was pretty sure he’d felt eyes on him when he went out earlier to check. While
    he watched and waited in here, someone could be doing the very same thing in the
    woods.


    # ELEVEN


    They spent most of the day going back over what they knew, which wasn’t much but
    every little tidbit painted a picture of what looked like a doctor filtering opioids
    through his clinic with the help of his so-called pharmaceutical rep wife—the
    perfect cover. Except one of his dealers must have wanted more money or had found
    out the good doctor was skimming off the top.


    “Everything points to Deke Garrison,” he told Alisha after they put together pages
    of handwritten notes. “He’s a patient of Dr. West’s, they hung in the same circles
    and their wives are all over social media together. Parties, vacations, holidays.
    Tight group. A lot of trips to South America and the Caymans.”


    Lots of possible scenarios but nothing concrete to go on yet. They didn’t have
    the names of the shooter and driver so Alisha couldn’t identify them unless she
    went back to Philadelphia. The law would expect her to come in and look at mugshots
    but as far as Nathan was concerned she wouldn’t be able to do that with killers
    after her.


    “How do we get to him?” she’d asked when they finally took a break earlier.


    “We let the `authorities` take what we have and follow every lead.”


    “Well, that sure is a change of tune for you, PI Craig.”


    “I have to work this one by the book,” he replied, thinking he had to walk the
    line to protect her from both the bad guys and a system that would demand everything
    of her in order to catch these criminals.


    Now as night settled over the snow-covered woods and hills, Nathan figured they
    couldn’t stay here indefinitely. Maybe he should get her back to Philadelphia
    fast and let the authorities there take over. He’d be in a world of trouble for
    taking her on the run, but what else could he have done?


    “You look deep in thought,” Alisha said from the kitchen. “Are you okay?”


    Nathan got up from his chair and walked over to the small dining table he’d made
    from scrap wood. “Just pondering our next move.”


    Alisha motioned to the sandwiches she’d made and the can of soup she’d found in
    the cabinet. “Peanut butter and jelly with chicken soup. Eat and then we’ll talk
    about what’s next.”


    Nathan rubbed the back of his neck and sat down in one of the old rickety high-backed
    chairs. Watching her move around this usually solitary kitchen made his heart
    ache with a pain that seared his soul. He’d long ago given up on love and marriage,
    or a home other than this one.


    He was a self-imposed nomad. He couldn’t go through the devastation of losing
    someone he loved again. The night they’d found Hannah’s tiny body by a stream
    still haunted his dreams. He’d lost her and Alisha both that night. And he’d lost
    them both because of his own selfish actions. Falling for a girl way out of his
    league had changed his life and made him realize some men weren’t meant to have
    a family. So he helped other families find their missing loved ones.


    That system had worked until now. Now, he’d held Alisha in his arms and realized
    his heart would never heal. In some ways, the pain was even worse the second time
    around.


    “Nathan?”


    He looked up to find her staring at him, concern clear in her gaze.


    “What?”


    “Is there something you’re not telling me?”


    “No.” He couldn’t blurt out what he was thinking. “We need to keep moving. I think
    tonight.” Looking at her clothes, he added, “You need to put your dress back on
    in case we need to move quickly. Keep your bonnet and cape nearby.”


    “You think someone is out there, don’t you?”


    “I haven’t seen anyone but my gut says yes.”


    Surprised, she held her spoon in the air. “And where will we go next?”


    He studied her and wished he could keep her here, warm and safe with him for a
    long time. “Back to Philly.”


    Dropping the spoon into her soup, she said, “What?”


    “We need to get you into the police station so we can look at mugshots. They’ll
    want to talk to you again since we’ve had several obvious incidents that back
    up your fears and can prove our case. The best way to get to these people is to
    start at the beginning. Again.”


    She sat still and silent, her eyes downcast. “I understand. I can’t run forever.
    I should have gone straight to them in the beginning.”


    He could tell she was growing weary. “You needed a couple of days to debrief and
    retreat, to get your head together for what might come.”


    “Except we’ve been de-briefed and retreat, to get your head together for what
    might come.”


