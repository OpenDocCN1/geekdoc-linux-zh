    “You’ve got that right,” he said, whirling so fast he had to catch her with his
    hands on her arms to keep from knocking her down. Holding her there, he stared
    into her eyes while memories filled his head. Sweet memories of summer nights
    and the wind lifting her hair. Nathan didn’t want to let go—of her or the memories.
    But he shifted back, accepting that they’d been young and full of idealistic dreams
    back then. Things had changed so much since that sweet summer.


    “I’m okay,” she said, lifting away to move past him in a quick rush. “I’ll be
    all right, Nathan. Please don’t make a fuss. Let’s just do our jobs.”


    “Is that a hint to back off?”


    “Not a hint. A request. We have to remain professional and focus on this case.
    You have to trust me.”


    “I do trust you, but I also need to make sure nothing happens to you.”


    She went behind the big desk and sank down into the chair. “Nothing is going to
    happen,” she said. “I hope that with all my heart and I’m thankful that you’re
    willing to drop everything to help me. But you can’t panic every time I leave
    a room.”


    “Okay, all right,” he said through a breath. “I was tired and I woke up in a different
    place. Don’t make any rash decisions about going back to the city. That’s the
    last place you need to be and I don’t care what your boss thinks.”


    “Well, that’s understandable because you’re tired, same as me. I don’t want to
    seem ungrateful for what you’ve done for me but I have another option at least.
    I was in a panic last night.”


    “You had to be to call me,” he said, wishing he could be the first person she
    called instead of the last.


    “I’m better now and regretting that I dragged you into this. But you’re allowed
    to get some rest even if it’s on the office couch.”


    “Sorry,” he said. “Waking up like that is part of my job since I move around so
    much.”


    He wouldn’t tell her that he woke in hotel rooms a lot but this was different.
    Hotel rooms were impersonal and sterile to the point of being boring. This house,
    which was now a community center, still held the charm and homey feeling that
    he remembered so well. Being here again brought it all back, the many hours he’d
    spent with Alisha, walking the grounds, falling in love and trying to figure out
    his future. A future he’d hoped to have with her. He’d never imagined that summer
    so long ago, that being with her would change his life forever in both good and
    bad ways.


    “I understand.” Her green eyes softened. Was she remembering, too? “Do you ever
    stop thinking about her?”


    “Who?”


    Alisha’s eyes held his for a few ticking seconds. “Hannah.”


    Nathan’s heart lurched each time he heard his sister’s name. But hearing Alisha
    say it with a quiet reverence almost did him in. So he turned sarcastic. “No.
    Never.”


    “That’s what I thought,” Alisha said. “I think about her a lot, too, especially
    around the holidays.”


    “Can we change the subject?” he snapped, wishing he could wipe some of his memories
    away. Then because she looked so crushed and her cheeks blushed a bright pink,
    he added, “It’s still hard, Alisha. I’m sorry.”


    Alisha nodded and studied the notes in front of her. “All the more reason to remember
    why we need to keep at this and get it over with.”


    “Agreed,” he said, wanting to fight with her some more. But he couldn’t bring
    himself to do that. She blamed herself for Hannah’s disappearance and death, same
    as he did. But it wasn’t her fault.


    He was solely to blame for his little sister leaving the house that stormy summer
    day. Hannah had gone looking for him. She’d gotten lost and...


    Closing his eyes, he tried to get the image of his sister calling after him out
    of his head and instead focused on Alisha and her open laptop. “What have you
    got?”


    “I found the names of the victims,” she said. “Joshua and Tiffany West.”


    “Hmm. Common names. Could be aliases.”


    “You don’t trust anyone, do you?”


    “I’ve had too many Tiffanys in my life.”


    “Oh, really?”


    “Here and there.”


    “I’d say more here than there. Do you date a lot, Nathan?”


    “Here and there. Jealous?”


    “Nope. Just curious.”


    “What about you? Got anyone special in your life?”


    “`That` is `neither` here `nor` there,” she retorted, her tone telling him she
    could be a tad bitter about any love connections.


    He thought of her briefcase and how she carried it like a shield. Same as him,
    she was married to her work. They both wore the armor of indifference to hide
    the brutality of being hurt.


    Back to business. “What else did you find?”


    “Well, they live in an upscale part of the city in a new development. A modern
    condo in a building that went up about eight months ago. Comps sell for a million
    and over.”


    “How did you find out all of this while I slept?”


    “I have my sources, PI `Craig`, same as you. My firm has been more than willing
    to help. As I said, Mr. Henderson had offered me protection, too.”


    Her firm would have investigators. “Probably not as good as me, though.”


    “They found the information I needed and during a holiday week at that.”


    “Touché,” he said.


    “If you think the FBI will get involved, this could go way beyond just protecting
    you. You’ll be questioned by everyone from Campton Creek police to the state police
    and the Philly police. And probably the DEA.”


    “Yes,” she said. “I’ll tell them everything I witnessed. I just need to get there
    from here.”


    “Yes, because we can only hide you for so long.”

