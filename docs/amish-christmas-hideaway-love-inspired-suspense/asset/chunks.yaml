    当他离房子只有几码远时，大门向开了。玛莎·施洛克从楼梯上跑下来，她那深色的连衣裙和黑色的围裙在她周围飘动着。“内森？”


    内森点点头，踉跄着走近。“嗨，妈妈。是我。”


    玛莎脸上充满了忧虑。“发生什么事了？”


    “我会解释的，但我得先让她进屋暖暖和。”


    玛莎在靠近他们时停下了脚步，看到他怀里抱着一个戴着深色兜帽的女人。“这位是谁？”


    内森回头看了一眼路。“妈妈，我会解释一切的。我们可以进屋吗？她在寒风中受了一整晚的冻。”


    他的父亲走到门廊，眉头紧锁。他的母亲转头看向丈夫。“内森回了，阿莫斯。他和这个女人需要帮助。”


    清晨的空气中陷入了持续了两个心跳的时间。艾莉莎再次呻吟着，向内森怀里缩得更紧了。他一边带着她和母亲向前挪，一边不断回头张望，担心那些人会潜伏在附近。


    最后，他说：“父亲，我需要你的帮助。我们可以请进屋吗？”


    这句话中的恳求一定刺穿了他的母亲的心。她的眼里湿润了。她转向丈夫。“阿莫斯？”


    “总是（Alleweil），父亲？”现在。


    阿莫斯·施洛克盯着他们，没有移动。


    “阿莫斯？”妻子的哀求听起来和内森一样心碎。“我们的儿子我们需要帮助。”


    阿莫斯点了点头。“是的（Ja）。”


    然后他转身回到屋内。


    内森感到沮丧，向前走了。但让他惊讶的是，父亲拿着两条毯子出来，递给了玛莎。玛莎点了点头，无言，赶紧盖住他们。


    “来（Kumm），让我们你们都暖起来。”


    玛莎对丈夫露出甜甜的微笑。“谢谢（Denki），阿莫斯。”


    阿莫斯点头引导他们上楼梯。进屋后，内森的父母转头看向怀里的女人。


    玛莎倒吸了一口气，阿莫斯皱起眉头。


    玛莎看向艾莉莎，认出对方的情绪涌上脸上，让她无言。“艾莉莎？”


    艾莉莎睁开眼睛，集中注意力。“是的，施洛克夫人。是我。我很抱歉打扰你们。”


    接着她再次昏了过去。


    内森插话道，疲惫和眩晕侵袭了他。“我们遇到麻烦了，妈妈。”


    玛莎再次忧虑地盯着艾莉莎，仿佛在说她已经知道了。然后她指了指房子后一楼的卧室。“哪里（Druwwel）？什么样的麻烦？”


    内森感觉身体在摇晃，双腿发软。他跟着父母说道：“我……我需要让她躺下。”


    他的母亲拉开被子，拍了拍枕头。“放在这儿。”


    他轻轻地将艾莉莎放在床上，帮她脱掉斗篷，他的母亲则拉好盖在她们身上的毯子。艾莉莎醒了过来，睁大了眼睛。


    “我在哪里？”


    “你现在安全了，”内森说，声音沙哑，他从脖子往下盖好她，确保她很暖。“就像我承诺的那样。”


    他眨了眨眼睛，撞在床边的高背椅上，因为抱了太久，手臂剧痛，肩膀像火烧一样。他推开毯子，试图站起来。但失败了。


    “内森，你受伤了！”


    他母亲疯狂的尖叫在他周围回荡，随后他倒在椅子上，再也无法睁开眼睛。


    ***


    她在人声中醒来。


    一个轻柔的声音。“那个可怜的女孩累坏了。难怪。她快被冻死了。还有你，肩膀还有个洞。”


    一个刺耳的声音。“你把她带到我们家里来？你和你的英语世界？我今天早上别无选择才帮你，但我不想这样。你不能留在这儿，内森。”


    一个疲惫的声音。“我告诉过你，我现在没有别处可去。她需要躲避一段时间。”


    艾莉莎坐起来，环顾着整洁简素的卧室，阳光透过窗户闪烁。一张漂亮的床，铺着彩色的菱形图案被子，这在城市的商店里值数百美元，旁边还有一个床头柜、一把椅子和一个小衣柜。简单、质朴而美丽。一个充满爱的房子。


    太阳高高挂在天空，告诉她已经是午后了。她睡了一整天吗？


    她的大脑一片空白，记得了一些对话片段。内森在森林里在她耳边轻声细语。他的父母用毯子盖住他们，声音里充满了担忧和惊讶。


    他们收留了她。这对很久以前就不认可她的父母，现在把她进了家。因为他们仍然爱着叛逆的儿子。


    但她把冲突和困惑带回了这个家，而内森显然需要救赎和和平。她现在看得很清楚。就像插着几枝松枝的玻璃瓶一样清晰。一个用简单安静的方式庆祝圣诞节的动作。


    “你打算什么？在我们院子里打死人吗？”


    “足够了，”艾莉莎低声呢喃自语道。“足够了。”她必须离开这里，哪怕不是为了别的，为了内森。


    她推开温暖的毯子，起床穿衣服，轻微的眩晕让她重新坐回床上。她用手理了理头发，在旧地板上走动。

