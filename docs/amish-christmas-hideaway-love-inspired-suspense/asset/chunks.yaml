    all the way back, not just when it’s convenient.”


    Her eyes brightened, the sparse light sparkling through like joy. “Nathan, I’m
    glad to hear that.”


    “I guess being back here with your grandmother and you has brought out a lot of
    pent-up memories. I never gave up on God but I did give up on attending church.
    I hope He listens to a burned-out man with a chip on his shoulder, sitting on
    a park bench.”


    “I’m pretty sure He does,” she replied, sending him a hopeful glance. “I hope
    He listens to a tired law associate who has to burn the midnight oil, even on
    Sunday mornings.”


    Nathan smiled at that. “I’m guessing He’s listening right now as we head out into
    the woods on faith alone.”


    They started walking again, wary but less weary. “Up this way,” Nathan said. “We
    have about a mile to go.”


    “Does that make my faith weak?” she asked, her voice timid now. “I made that comment
    about not testing faith.”


    “What? Because you want your grandmother to live?”


    “Yes. Does that make me selfish?”


    “No, Alisha. That makes you human.”


    “I keep thinking if I hadn’t stopped there, we’d all be oblivious and safe and
    enjoying the holidays. I would have heard about the shooting on the news but I
    could have gone on with my life.”


    “Stop second-guessing this thing,” he gently chastised. “You can’t go back and
    change what happened—you shouldn’t have stopped there, you shouldn’t have come
    here, you shouldn’t have called me. None of that matters now. We’re here and we
    have to stay one step ahead of these people. Of everything that you think you
    should or shouldn’t have done, coming here was probably the best decision considering
    the circumstances.”


    Easy for him to tell her that when he’d been thinking along the same lines for
    years now.


    They heard a noise off to the side.


    Nathan guided her to a stand of saplings and held her there against a tree, his
    heartbeat bumping against hers. Putting a finger to his lips, he gave her a quick
    glance. Alisha nodded and held to him.


    When he saw a huge shadow on the path, Nathan tugged her tightly into his arms.
    “If something goes wrong, run as fast as you can to the east and look for the
    Schrock farm.”


    She bobbed her head, her eyes wide with questions he wasn’t ready to answer.


    Nathan held her with one hand and placed his other hand on his Beretta. Then he
    carefully looked around the tree and let out a grunt of relief.


    “The big stag. Look. He hangs out in these woods. I’ve often left him food out
    my back door.”


    Alisha peeked over his shoulder and squinted in the scant light from the crescent
    moon caught between clouds. “Oh, my. He’s a beauty.”


    The stag moved over the forest floor, lifting his head when he caught their scent.
    He stood majestic and still, the snow falling softly around him.


    “A twelve-pointer if I’m seeing right,” Nathan replied. “Hard to tell in the dark,
    but I think he’s the one I feed every now and then when I’m home. We’ve become
    buddies.”


    “He’s big enough to see us and I’m sure he knows we’re intruders.”


    “Maybe he’ll recognize my scent and let us be. He’ll run when we make a move.”


    He took her hand and led her back onto the path, his small flashlight guiding
    them. “*As the deer pants for water*...”


    “*So my soul longs for you, O God*,” she finished. “Psalm 42.”


    “Maybe God is giving us a sign.”


    “Or maybe a deer just crossed our path.”


    The big animal leaped into the air and crashed off through the forest.


    “A sign,” Nathan said, thinking he had not looked for signs from the Lord in a
    long time. But here he was with the one woman he could never get out of his system,
    trying to protect her, trying to find some sort of redemption. A bad idea or a
    second chance?


    His heart filled with a strange sensation. A sense of peace and home and security.
    Or maybe he was just cold and tired and seeing things that weren’t really there.


    But the night sky gave him comfort so he hurried Alisha along toward his tiny
    cabin. “We’ll be there soon.”'
