    “你觉得怎么呢？”艾莉莎反驳道。“有些危险人物在追我，而我是他律的律师。他在这里是为了保护我，确保我不会处于易受状态。我逃跑可能不是一个正确的决定，但我现在在这里了，我了解法律。”


    “但你并没有被捕，我们也没有怀疑你有任何问题，”马瑟斯侦探指出，“你唯一的罪行就是事情发生那天晚上没有回到费城。”


    “如果她真的那样做了，她现在已经死了，”内坦插话道。


    “我听听也没有什么坏，”米切尔·亨德森回答道，语气坚定而礼貌。“艾莉莎见证了一起双重杀人，她是唯一的目击者。她在这里是为了配合工作并让这些人受到法治。我在这里是为了引导并向她建议。”


    “行吧，”芬威克探员说，“我们开始这一切吧。既然我们两个最好的证人现在都死了，而你目睹了他们被暗杀，我想我们大家的想法都是一样的，布克斯顿小姐。那就是让你活下去。”


    “不胜感激，”艾莉莎回答道。“克雷格私探和我根据我们自己的调查整理了一些笔记。德基·加里森（Deke Garrison）这个名字经常和斯特博士一起出现。他是我们嫌疑人名单上的高位。我们还注意到一个叫安德丽·萨姆特的女性，她是斯特博士的患者。”然后她告诉了他们那个闯入坎普顿中心的摄影师的情况。“我们要对比一下笔记吗？”


    “我们不需要对比笔记，”芬威克探员回答道。“我们有一个可靠的案件，但还不能指认嫌疑人。我们正在等待更多证据。”


    内坦看了艾莉莎一眼，又看向那些官员。“你说你们两个最好的证人现在都死了。你们是告诉我们，这次刺杀是针对两个为了出污作证的人吗？斯特夫妇正要交出一切吗？”


    “是的，”芬威克探员说，她深色的眼睛里充满了恼躁。“他们想离开，我们向他们提供了辩交易。他们同意了，但在我们获得更多证据之前，他们必须继续演下去。他们计划在告诉我们一切后就去度假。他们本正准备在一个新地方，用一个新名字开始新生活。”


    艾莉莎摇摇头。“所以他们*确实*参与了犯罪活动，但他们因为配合联邦调查局被杀了？”


    “大体如此，”马瑟斯侦探回答道。“我们说论的是一个由几位社会知名成员组成的犯罪集团，并由为了金钱不择手段的下流罪犯资助。”


    “你们为什么不保护斯特夫妇？”内坦问，脑海中的警报在作响。


    芬威克探员倾身向前。“我们让他们低调行事，也派了人盯着他们，但他们选择了溜出去逛街。所以我们很高兴你决定和我们分享这些信息。因为相信我，你是杀手名单上的下一个。他们不希望你认出他们的任何杀手或他们中的任何一个人，在不能永久让你闭嘴之前他们不会停止。”


    # 十九


    在完成陈述后，艾莉莎向一个速描画家描述了她看到的那些男人。当画家画完，艾莉莎点了点头。“那绝对是那个枪手。他们叫他阿斯（Ace），但他也使用亚当·贝克（Adam
    Baker）这个名字。”


    马瑟斯侦探点头。“这和坎普顿溪溪镇警方官方报告上的记录吻合。”他把素描交给一名实验室技术人员，显然倾向于相信艾莉莎的故事。“看看我们能不能匹配。”


    芬威克探员拿起她的笔记离开去处理案件的另一部分——主要是弄清楚他们是否有足够的证据将这些罪犯送上法庭。但她在打开的门前停住了。“这些细节都会帮助，我们会盯着那个被转到附近医院的男人。他除了一张未付的停车罚单外没有其他记录。他在这里那里到处打零工，所以我们没有他准确的工作经历。史特·坎普（Scott
    Kemp）是一个化名。他也叫史特·金凯德（Scott Kincaid）。”


    艾莉莎抬起头。“你说金凯德？”


    探员关上门回到桌旁。“是的。听起来眼熟？”


    “听起来很熟悉，”艾莉莎说，目光落在内坦身上。“不知道。可能是客户？”


    米切尔·亨德森已经去参加另一个预约了，他们无法问他。她的老板很长记名字。“史特·金凯德，”她说，摇头。“我知道我以前听过这个名字。”


    芬威克探员等待着。“你认识这个人吗，布克斯顿小姐？”


    艾莉莎给了她困惑的眼神。“如果我认识他，我会说的。为什么我感觉我在这里被当成了罪犯对待？”


    内坦举起一只手。“因为你跑了，艾莉莎。你知道这是怎么运作的。你偶然撞上了他们的案件，事情就失控了。探员想要一个结果，所以她在施压你，因为你没有直接来这里，反而让自己陷入了更危险的。但她不愿让我们确切知道是谁在针对我们。可能也不对费城警方主导这件事感到太高兴。”


    “我们可以像你一样保护证人，克雷格私探。从我们听到的消息来看可能做得更好。毕竟，这是我们工作的一部分。”


    内坦眼中闪过愤怒。“噢，我正指望此此。”


    艾莉莎站起来，手挡在他们之间。“行吧，”芬威克探员说，“我们开始这一切吧。既然我们两个最好的证人现在都死了，而你目睹了他们被暗杀，我想我们大家的想法都是一样的，布克斯顿小姐。那就是让你活下去。”


