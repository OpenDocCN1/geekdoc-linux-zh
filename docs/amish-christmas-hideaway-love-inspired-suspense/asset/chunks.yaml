    “Why do you think?” Alisha retorted. “I’ve got some dangerous people after me
    and I’m a lawyer for his firm. He’s here to protect me and make sure I’m not vulnerable.
    I might not have made the right decision by running but I’m here now and I know
    the law.”


    “But you’re not under arrest and we don’t suspect you of anything,” Detective
    Mathers pointed out. “Your only crime was not coming back to Philadelphia the
    night this happened.”


    “She’d be dead now if she’d done that,” Nathan interjected.


    “There is no harm in me listening in,” Mitchell Henderson replied, his tone firm
    and polite. “Alisha witnessed a double homicide and she’s the only eyewitness.
    She’s here to cooperate and bring these people to justice. I’m here to guide her
    and advise her.”


    “Okay then,” Agent Fenwick said. “Let’s get on with this. Since our two best witnesses
    are dead now and you witnessed them being assassinated, I’d say we all want the
    same thing, Miss Braxton. To keep you alive.”


    “I’d appreciate that,” Alisha replied. “PI Craig and I have come up with some
    notes based on our own investigation. The name Deke Garrison keeps popping up
    in conjunction with Dr. West. He’s high on our list as a possible suspect. We
    also noted a woman named Andrea Sumter, a patient of Dr. West.” Then she told
    them about the photographer who’d trespassed at the Campton Center. Would you
    like to compare notes?”


    “We don’t need to compare notes,” Agent Fenwick replied. “We have a solid case
    but we can’t name the suspect yet. We’re waiting on more evidence.”


    Nathan glanced at Alisha and then back to the officials. “You said your two best
    witnesses are dead now. Are you telling us that this hit was on two people who’d
    turned state’s evidence? The West couple was about to tell all?”


    “Yes,” Agent Fenwick said, her dark eyes full of aggravation. “They wanted out
    and we offered them a plea bargain. They agreed but they had to keep playing the
    part until we could get more evidence. They were scheduled to leave for a holiday
    trip once they told us everything. They were about to make a fresh start in a
    new place, under a new name.”


    Alisha shook her head. “So they *were* involved in criminal activity but they
    were killed for cooperating with the FBI?”


    “That about sums it up,” Detective Mathers replied. “We’re talking a whole cartel
    made of several prominent members of society and fueled by low-life criminals
    who’ll do anything for money.”


    “Why didn’t you protect the Wests?” Nathan asked, radars going off in his head.


    Agent Fenwick leaned in. “We told them to lie low and we had men on them but they
    elected to sneak out and do some shopping. So we’re glad you decided to share
    things with us. Because believe me, you’re next on the kill list. They don’t want
    you to identify any of their hit men or any of them, and they won’t stop until
    they can silence you permanently.”


    # NINETEEN


    Once they’d given their statements, Alisha described the men she’d seen to a sketch
    artist. When the artist was finished, Alisha nodded her head. “That’s definitely
    the shooter. They called him Ace but he also used the name Adam Baker.”


    Detective Mathers nodded. “That matches what we have on the official report from
    the Campton Creek town police.” He handed the sketch to one of the lab techs,
    obviously leaning toward believing Alisha’s story. “See if we get a match.”


    Agent Fenwick grabbed her notes to go off and work her side of the case—mainly
    trying to figure out if they had enough evidence to bring these criminals to trial.
    But she stopped at the open door. “All of these details will help and we’ll keep
    after the man we’ve moved to a nearby hospital. He doesn’t have a record other
    than an outstanding parking ticket. Does a lot of odd jobs here and there so we
    don’t have an accurate work history. Scott Kemp is an alias. He also goes by Scott
    Kincaid.”


    Alisha’s head came up. “Did you say Kincaid?”


    The agent shut the door and came back to the table. “Yes. Ring a bell?”


    “It sounds familiar,” Alisha said, her gaze hitting on Nathan. “I don’t know.
    Maybe a client?”


    Mitchell Henderson had already left for another appointment so they couldn’t ask
    him. Her boss was good at remembering names. “Scott Kincaid,” she said, shaking
    her head. “I know I’ve heard that name before.”


    Agent Fenwick waited. “Do you know this man, Miss Braxton?”


    Alisha gave her a perplexed stare. “If I knew him, I’d say so. Why do I get the
    impression that I’m being treated like the criminal here?”


    Nathan held up a hand. “Because you ran away, Alisha. You know how this works.
    You stumbled onto their case and things got blown apart. The agent wants to find
    closure, so she’s leaning on you since you didn’t come straight here and put yourself
    in even more danger. But she’s not willing to let us in on exactly who might be
    targeting us. Probably isn’t too happy about the Philly police taking the lead
    on this, either.”


    “We can protect witnesses the same as you, PI Craig. Probably better from what
    we’ve heard. It is, after all, part of what we do.”


    Nathan’s eyes flared with anger. “Oh, I’m counting on it.”


    Alisha stood up, putting a hand between them. “Okay then,” Agent Fenwick said.
    “Let’s get on with this. Since our two best witnesses are dead now and you witnessed
    them being assassinated, I’d say we all want the same thing, Miss Braxton. To
    keep you alive.”


