    # SEVENTEEN


    Martha walked up to where Alisha stood by the front window.


    Close to an hour had gone by and the snow was falling again in soft, silent flakes.
    It would be fully dark soon.


    “Here,” Martha said, holding up a cup of tea. “Meadow tea, mostly mint and sugar
    but good for calming us down.”


    “It’s getting late,” Alisha said, taking the tea, her eyes still on the road.
    “Thank you, Mrs. Schrock.”


    “Call me Martha,” the other woman said. “We don’t stand on formality around here.”


    Alisha turned away from the window, the last of the sun’s feeble rays casting
    out in a golden sheen over the snowy yard and woods while the snow clouds hovered,
    waiting for nightfall. “I wanted to thank you for today,” she told Martha. “I
    was so touched by what Nathan did and how you welcomed my grandmother and Mrs.
    Campton into your home.”


    “Nathan thought that up and made it happen,” Martha explained. “He knew you wanted
    to be with your *grossmammi* today.” She glanced around. “Judy Campton has always
    been a friend to the Amish and we all adore your *grossmammi*. It was a pleasure
    to host them today.”


    “I so wanted to spend Christmas with her,” Alisha replied, sipping the herbal
    tea, the cup warming her hands, the scent of mint lifting to her nose. “I’ll never
    forget what Nathan’s done for me. And not just his kindness today. He has always
    been a protector.”


    Martha patted the chair next to her rocking chair. “*Kumm*, Alisha. The food is
    put away and tomorrow, we’ll celebrate again with other family members. Sit and
    finish your tea. If the men are hungry when they return, we’ll allow them a snack.”


    Alisha’s skin felt hot, her nerves on fire with worry for Nathan and his father.
    This nightmare seemed to go on forever. Tomorrow, they would go back to Philadelphia
    and get moving on finding a way to end this. She should have done that in the
    first place but fear and a need to be with her grandmother had held her back.
    But in her heart, she knew she’d called Nathan that night because she needed him—his
    strength and his ability to make others feel safe. Admitting that she couldn’t
    do it all alone would have made her feel weak before. But now, she could understand
    that the hole in her heart could only be filled with the kind of courage love
    brought. She couldn’t live in a spirit of fear and she’d always considered herself
    fearless. But having Nathan back in her life had shown her how she needed her
    faith to give her strength. She also needed Nathan—to pour her love out on.


    Had could she have let this happen? Falling for him yet again? There could be
    no good end to that so why did it feel so right?


    She sank down next to Martha and put her cup of tea on the table, her hands shaking.
    “I...want this over.”


    Martha took up her knitting. “I know you do.”


    “He’s been right there, protecting me all this time.”


    “You mean, from those horrible men?”


    “Yes, and even before then when we had to work some cases together. He always
    overstepped and somehow tried to help. It was annoying at the time but now I can
    see so clearly that he wanted to do whatever he could to find that justice we
    both keep seeking.” With a resigned sigh, she added, “And he was watching over
    me like a guardian.”


    “Because he still loves you.”


    “What?” Alisha’s head came up, her breath catching in her throat. Did his mother
    see that she still loved Nathan, too?


    “My son loves you,” Martha said, her serenity intact, her eyes void of any judgment.


    Alisha wanted to tell Martha she might be wrong, but she couldn’t breathe. She
    could very well be having a panic attack.


    But before she could break down and confess to Martha that she loved Nathan, too,
    they heard a noise outside.


    “They’re home,” Alisha said, getting up to race to the window, relief allowing
    her to take in air again.


    Then she saw the vehicle parked near the edge of the woods.'
