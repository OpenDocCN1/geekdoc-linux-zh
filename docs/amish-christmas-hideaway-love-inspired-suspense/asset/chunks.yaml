    She was shaken but Nathan knew this woman. Tough and stubborn.


    “Okay, but you did not die.” He stood and offered her his hand. She hesitated
    and then grabbed on while he tugged her up, the touch of her skin against his
    fingers jarring him with a current of awareness. “I called my friend Carson Benton.
    He’s a deputy sheriff who helps me out a lot.”


    “Unofficially, I’m sure. I hope he chased them away.”


    “Unofficially, yes. I hope they don’t shoot him.”


    Looking her over, he took in the boots and straight black skirt, the tan leather
    jacket and black turtleneck sweater. Classy. “Alisha, listen, they don’t know
    you’re still alive. That gives us time. We need to get you somewhere safe, okay?”


    “I’m going to Campton House.”


    Just as he’d thought, and the closest place to hide for now. “Good. Mrs. Campton
    has a state-of-the-art security system.”


    “I know. I told her to get a system installed because of the sensitive nature
    of some of our cases. It serves as a safe house at times, too.”


    “Well, that will come in handy since we have to hide you until I can figure this
    thing out. The longer they think you died in that car, the better our odds of
    keeping you alive.”


    “You mean, until *we* can figure this thing out. I’m the one who witnessed a double
    murder.”


    He liked her spirit but heard that stubborn tone in her voice. “And I’m the one
    who’ll protect you and help you find justice. You have to stay hidden.”


    He took her by the arm. “I’ll report the crash from the truck. And before you
    start up, it’s too cold out here to argue about this right now.”


    “I’m not going to argue,” she said. “I’m exhausted.”


    Nathan’s heart went out to her. “Alisha...”


    “Don’t,” she said, holding up a hand. “Don’t baby me, Nathan. Just get me to my
    grandmother’s house.”


    Nathan grunted and let her open her own door. Then he grabbed her big leather
    bag and hopped in on the driver’s side. “Here’s your purse.”


    “This is *not* a purse. It’s full of work, my laptop and a flash drive, clothes.
    And my phone. My life is in this bag.”


    And hidden chocolate, if memory served him.


    “That’s a lot of life crammed into one fancy lady purse.”


    “I don’t have a life,” she said. Then her gaze met his in sheepish surprise. “It’s
    a briefcase.”


    “You didn’t mean to admit that, did you? The part about not having a life.”


    “I’m tired. Not making much sense.”


    “Well, if I have it my way, you’ll have a lot of life left in you.”


    His cell buzzed. “It’s Carson.” Hitting Accept, he said, “Did you find them?”


    Carson’s voice came over the Bluetooth connection. “Saw them, followed while the
    locals gave chase and we had them surrounded.”


    “But?” Nathan glanced over at Alisha since she could hear the call. Her expression
    held dread.


    “They crashed the SUV near the main highway down the mountain. Got out and ran
    away on foot. We’ve got men searching the area and we’ve called in the K9 unit,
    but I have a feeling they had another ride coming. It’s still not safe.” Then
    he added, “One of the escort officers is alive but critical. The other one died
    at the scene. I’m sorry, Nathan. The police are up to speed and they’ve alerted
    the proper authorities in Philadelphia, including the FBI.”


    Alisha let out a sob, her hand going to her face.


    “Thanks.” Nathan said, glancing at Alisha. “I have Miss Braxton with me. I got
    her out of the car, but it went into the ravine. They’ll send someone to circle
    back around to make sure she’s dead. I’d like them to think that for a while.
    Just until I get her somewhere safe.”


    “Understood,” his friend said. “But you know how this will end, right?”


    “Yeah. With me bringing these people to justice.” Nathan ended the call and turned
    to Alisha. “So you heard. Your pursuers managed to escape. You’re not safe.”


    He saw the shudder she tried to hide. “What they did was horrible. I can’t get
    it out of my head.” Looking out into the darkness, she whispered, “I should have
    done something for those officers.”'
