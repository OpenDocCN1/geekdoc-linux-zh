    ![Cover image](cover.jpeg)


    She’s hiding from killers...


    Can she find a haven in Amish country?


    A festive evening quickly becomes a holiday nightmare when Alisha Braxton witnesses
    a double murder. And the killer’s cold eyes promise that she’s next. There’s only
    one person Alisha trusts with her life—private investigator Nathan Craig, the
    man she once loved. But hiding in Amish country, can they outwit a murderer who’s
    determined she won’t survive Christmas?


    “Just get me out of here...please.”


    Alisha’s car was mere inches away from what looked like a sizable drop-off into
    a ravine.


    “I’ve got you,” Nathan said. “C’mon, take my hand.”


    She nodded. “My bag.”


    “Okay, grab it. But careful.”


    She lifted the big businesslike leather bag and handed it to him.


    “Turn slowly toward me, okay?”


    She nodded, the car rocking with each movement and slipping another inch against
    the old tree trunk.


    Nathan’s breath caught. That old stump wouldn’t last much longer.


    “On three,” he said. “One, two...three.”


    He tugged her up and out and then pulled her away from the now-shaking car. With
    a groan, the car’s front right fender scraped against the rock before sliding
    over the edge of the ravine and crashing down below.


    The sound of metal breaking apart echoed out over the hills.


    “Are you all right?”


    Alisha let out a long, shuddering sigh. “I could have died if you hadn’t come
    along...”


    With over seventy books published and millions in print, `Lenora Worth` writes
    award-winning romance and romantic suspense. Three of her books finaled in the
    ACFW Carol Awards, and her Love Inspired Suspense novel `Body of Evidence` became
    a `New York Times` bestseller. Her novella in `Mistletoe Kisses` made her a `USA
    TODAY` bestselling author. Lenora goes on adventures with her retired husband,
    Don, and enjoys reading, baking and shopping...especially shoe shopping.


