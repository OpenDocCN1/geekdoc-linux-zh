    “Miriam,” he said, his tone shaky now. “She has a problem with prescription pain
    pills. An old injury from her show horse days. She found Dr. Joshua West and...that
    was that. Addicted to opioids.”


    Alisha’s shock caused her to stop and turn to face him. “Miriam? That’s hard to
    believe.”


    “Hard to cover up, too,” he added, his expression bordering on frantic. “She learned
    to hide it from everyone, including me.”


    “But why are you involved in this shooting?” Alisha had to know the truth even
    if she never lived to tell anyone.


    “That’s simple, Alisha. I hired this hit. I wanted my wife safe and well but Dr.
    West kept plying her with the drugs and charging her exorbitant amounts of money.
    When I heard he and his uppity wife had decided to turn, I was furious.”


    Alisha’s sympathy didn’t stop her anger. “So you knew from the beginning? You’re
    the one who’s been trying to kill me?”


    “No,” he said, shoving her forward. “I didn’t want to kill you, tried to help
    protect you but if Kincaid talks, he’ll name me as the one who hired him. And...you
    saw the men. They took it upon themselves to try and find you. Too late, I realized
    they were trying to silence you to save their own necks. They failed and now they’re
    going to turn on me, too.”


    Shivering, her socks wet and cold, her feet bruised as they moved over brush and
    rocks, Alisha shook her head. “Mitchell, why are you doing this now?”


    “I don’t have any choice,” he said, his words chopped and rushed. “Kincaid has
    been blackmailing me for years and now you know who he is. He’ll turn, too, and
    then with your testimony, everyone will know. The others didn’t have anything
    to do with this hit. They’ll kill me if they find out what I did.”


    The others meaning Deke Garrison and Andrea Sumter and a long line of criminals.
    “Because they’ll see that you know too much.”


    “Yes. I had to send Miriam away for treatment. I’m so sorry, Alisha, but if I
    don’t do this, they will. I’ll make it quick.”


    “And what about Nathan and Agent Fenwick?”


    “They’ll be taken care of, sooner or later.” Glancing behind him, he said, “They
    can’t know, either. Everyone will believe the hit men found all of you.”


    Sick to her stomach, Alisha moved forward, too numb to wonder what would happen
    next. He’d shoot her and dump her in the water while someone else killed Nathan
    and Agent Fenwick. Probably blame it on an attack from outside, spin it to make
    people feel for him and his family. If he survived, Nathan would have to watch
    over his shoulder for the rest of his life.


    She wouldn’t let that happen. She had to find a way to end this.


    * * *


    Nathan found Mitchell’s car near the gates leading to the road, the passenger
    side door open. Using his cell light, he found footprints in the melting snow
    headed into the woods.


    Soon he was on a path that meandered down, the soft gurgle of flowing water telling
    him that Henderson was taking Alisha down to a mountain stream. To kill her and
    leave her.


    The whine of sirens up on the road gave him hope. But he couldn’t wait for backup.
    He had to hurry before it was too late. Stumbling in the slush and mud, Nathan
    kept moving down the hillside, the heavy brush and cold snow blocking him.


    When he heard voices a few yards down, he stopped and readied his weapon. Before
    he could take a step, shots rang out.


    Nathan’s nerves hummed with a lightning fear. He took off running, sliding in
    the wet until he righted himself. Then he ran at breakneck speed toward the water.


    * * *


    Alisha had managed to distract Mitchell. “My foot. I think something’s cutting
    my foot.” She’d leaned down, moaning and waiting for the man holding her to let
    go for just a moment.


    He did. “Sit if you must,” Mitchell said, shoving her onto a jutting rock.


    Biding her time, Alisha moved her hand over the icy snow until she felt a firm
    piece of a broken limb. Then with all the force she could muster, she lifted up
    and brought the heavy piece of frozen wood down on Mitchell Henderson’s head.'
