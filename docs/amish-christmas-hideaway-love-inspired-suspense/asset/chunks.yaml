    She did as he told her while he slipped to the front window and peeked out. No
    one. Nathan circled to the portico door and keyed the code to open it. After slipping
    out, he reset the code to lock the door behind him.


    Broad daylight and someone was already messing with them. This situation would
    not go away until they did something about it.


    Easing through the shaded portico, he felt the chill of the day in spite of the
    sun. When he heard a noise near the west side of the garage, Nathan skirted some
    old-root camellias and slid up against the house. Then he did a quick glance around
    the corner and spotted a man with a huge camera.


    A reporter or someone who needed to prove she was alive and hiding here?


    The news of the murders had been all over the papers, television news and online
    sources. Someone must have gotten Alisha’s name. He’d take care of this intruder.


    “Hey,” he called as he climbed out of the camellias with his gun in plain sight.
    “What are you doing?”


    The man jeered at him. “I’m just doing my job. Heard a woman staying here might
    have some information on those murders in Philadelphia the other night.”


    “You heard wrong. No one here to talk to you.”


    The scruffy man came close, his beard and hat covering most of his face. Nathan
    studied him. He looked disheveled and his posture held an edge that reeked of
    someone posing as a photographer.


    Nathan didn’t waste any time. The man gave him a quick glance and made his move,
    lifting the camera in the air to strike at the same time Nathan grabbed him with
    one hand and pushed him up against the side of the brick home, causing the camera
    to fall into the bushes. Placing his handgun against the man’s ribs, he said,
    “I suggest you tell me who you really are and who sent you here.”


    ***


    Alisha came out of the powder room and ran to the office to find her phone. She
    pulled on her heavy sweater and dropped the phone in the pocket. After searching
    the room, she grabbed a small porcelain statuette that was probably worth more
    than a week’s salary. But it would make a good weapon.


    After searching all the rooms downstairs, she came back to the stairs and crossed
    over to the carriage house, keying in the code for the door to open.


    “Granny?”


    “We’re right here, Alisha.”


    She sighed and rushed inside the sitting room to find her grandmother and Mrs.
    Campton working on a Christmas-inspired jigsaw puzzle. “Are you two all right?”


    “Why wouldn’t we be?” Miss Judy asked, her elegant eyebrows lifting. “We’ve both
    had some soup and it’s about time for our afternoon naps. You should rest, too.
    You look exhausted.”


    “Did you hear any noises? See a camera flashing?”


    “We don’t hear very well,” her grandmother pointed out. “And we have the drapes
    shut to stay warm.”


    “Good,” Alisha said, hurrying to the window. Then she saw an official-looking
    SUV, lights flashing, as it turned into the drive up to the house.


    “Now I see something flashing,” Miss Judy said, pointing to where Alisha stood.
    “Do we have company?”


    “The state police,” Alisha replied. “And Nathan’s dragging a man toward the vehicle.
    I’d better go down.”


    “No, young lady, you stay right here with us,” her grandmother admonished. “Whoever’s
    intruding on our property shouldn’t see you here. He might think you’re here,
    but he doesn’t need to verify that fact.”


    Impressed with her spry grandmother’s way of thinking, she said, “I think he already
    knows I’m here.” She watched as Nathan shoved the man toward Deputy Benton. “His
    camera flash alerted us. I guess Nathan found him and obviously called the police.”


    “You should let Nathan know you’re with us,” Granny said, nodding. “He’ll worry
    if he can’t find you.”


    Remembering how concerned he’d been this morning, Alisha nodded. “Good idea.”


    Alisha texted Nathan: `I’m with Granny and Mrs. C. We are all safe in the carriage
    house.`


    She watched and waited. He tugged at his phone, read her text then turned to the
    window. Without showing her face, she quickly put her hand out, waved then stepped
    back. He’d be mad at her. Again.


    That seemed to be the only relationship they had right now. One annoyed with the
    other, it usually involved him breaking the rules while she tried to abide by
    the law.


    But she also knew that Nathan was an honest, good man who’d do anything to help
    someone in need. Even her.


    “Everything okay?” Mrs. Campton asked in her serene way.


    “Apparently, the intruder has been neutralized and is now taking a ride in an
    official SUV,” Alisha replied. “Mind if I wait here for Nathan? I was supposed
    to stay locked in the powder room.”


    Her grandmother stood and tugged her close. “I’d feel better if you stayed right
    here, but the powder room was a good plan.”


    “He won’t like me leaving the powder room. He tells me to stay put but I can’t
    do that when people are prowling around.”


    “Men consider it their duty to protect the women they care about,” Miss Judy said
    with that same serenity she’d always held.


    Alisha stood back and stared at both of them, her heart bursting with love and
    a bit of bittersweet regret. “How did you both do it?”


    “Do what?” Granny asked, her expression puzzled but pleased.


    “Love the same man all of your life.”


    Her grandmother glanced at Miss Judy, their eyes holding some sort of secret message.


    “Oh, that’s easy,” Miss Judy said with a smile. “It was our duty to protect them,
    too, in our own way, which is with prayer and understanding and by trying to meet
    them halfway in compromise. But mostly, we stayed with our husbands out of love.
    That’s what commitment is all about—we love through the hard times and love through
    the pain and anger. Love conquers all.”


    Alisha didn’t know how to respond to that. She wanted to believe those words,
    however. “Wow. That’s amazing.”


    “That’s life, darling,” Miss Judy said. Then she slipped in a piece of the puzzle.
    “Aha! That piece has been nagging me all day!”


    Alisha smiled and shrugged. “I think that’s my problem. I feel like pieces of
    my puzzle are missing.”


    “You just have to find the right fit.” Judy shrugged back with a giggle.


    “I’ll make you some tea,” Granny said. “And I’m guessing you haven’t had lunch.”


    Alisha relaxed in spite of her worries. “That sounds nice, Granny.”


    She couldn’t confess, but each time Nathan ran out that door to protect her she
    worried fiercely for his safety and she remembered how much she’d loved him once.


    Did that mean she was doing her duty to him?


    # Seven


    “So our roaming photographer isn’t talking much,” Carson told Alisha and Nathan
    later that day while they sat huddled in the office. “Word is getting out, no
    matter that the authorities are keeping this on the down-low. People will figure
    out that Alisha is alive and well and hiding out in Campton Creek.”


    “Here’s what we know about the man the police took away this morning,” Nathan
    said, thinking theyd have to do this one step at a time. The newshounds smelled
    a good story and they’d want to interview the only eyewitness to these murders,
    even if it put that witness in danger.


    Alisha lifted her chin, ready to do battle. “Tell me everything.”


    “Corey Cooper. He actually is a reporter-photographer, but his shady tactics have
    given him a pretty impressive rap sheet—petty stuff such as trespassing on private
    property, breaking and entering and one assault charge since he’s become aggressive
    in doing his job.”


    “Well, now he’s got an even more impressive rap sheet,” Carson noted. “Trespassing
    and another near assault—on you.”


    Alisha shook her head. “I guess he’d make money getting a scoop on the unidentified
    witness everyone wants to talk to—and that would be me.”


    “He’s been fired several times over,” Nathan continued. “Now he’s freelance and
    struggling, desperate. Says the person who hired him left a big wad of money in
    a safety deposit box at a bank in Philadelphia. The Philadelphia police are checking
    into the bank since a manager had to give him access per the client.”


    “So he won’t talk because he doesn’t know who hired him?” Alisha asked.

