    People had gathered around and a security guard stood staring into the car, his
    expression full of shock. “What in the world?”


    The dispatcher confirmed the location and told Alisha to stay on the phone.


    “Officers on the way,” Alisha said to the scared guard after the dispatcher had
    told her as much. “Secure the scene and get these people back.”


    She stepped away, her stomach roiling at the carnage in the two-seater car. Blood
    everywhere and both passengers slumped over, holding each other, their bodies
    riddled with bullet holes. They’d been smiling and happy seconds before and now
    they were obviously dead.


    The other vehicle was long gone but while she waited she managed to give a description
    to the dispatcher.


    “Large black SUV.” She named the model. “A driver and one shooter but I couldn’t
    make out the license plate. I didn’t see anyone else inside.”


    But she remembered the shooter’s face. A light scruffy beard and stringy long
    dark hair covered by a thick wool cap. His eyes—black as night and dead. So dead
    inside.


    Alisha stayed on the phone but heard the sound of sirens echoing through the chilly
    night. Her boots crunched against something as she tried to scan the surrounding
    area. She looked down and saw the delicate, gold-embossed Christmas ornament that
    had decorated the now-shattered streetlight hovering over the sports car. A star
    shape, shimmering white.


    The ornament laid broken and crushed underneath her feet.


    ***


    Hours later, Nathan Craig heard a ringing in his ears that would not go away.
    “Stop it,” he groaned, coming awake to find a weak slant of moonlight filtering
    through the darkness of his bedroom. He wiped at his sleepy eyes and glared at
    the dial of his watch.


    Eleven o’clock.


    Exhausted after an all-night surveillance and a day full of reports to his client,
    he’d gone to bed early and at his own place for once. Now he’d never get back
    to sleep.


    Then he realized his phone was ringing. Not so unusual. Being a private investigator
    meant he had a lot of late-night calls from either clients or informants. And
    sometimes, from the angry subjects of his investigations.


    Sitting up, he grabbed the annoying device and growled, “This had better be good.”


    “Nathan?”


    The voice was winded and scared, his name a whisper from a raw throat. But that
    voice held a familiar tone that hit deep in his gut.


    “Alisha?”


    “Yes.”


    Now he was wide awake.


    Knowing she’d never call him unless she was in trouble or really mad at him again,
    he said, “Alisha, what’s wrong?”


    “I... I think someone’s trying to kill me,” she said, the tremor in her words
    destroying him.


    He stood and grabbed his jeans, hit his toe on a chair and gritted his teeth.
    “Where are you? Are they after you right now?”


    “I’m almost to Campton Creek. Just a few miles from the turnoff. I know they’re
    following me but I don’t see the SUV behind me. He’ll be back. I saw his face,
    Nathan. I witnessed a man shoot and kill two people. And you know what that means.”


    “Hold on,” he said, his mind racing ahead while fear held his heart in a vise.
    “I can be there in fifteen minutes. You stay on the line with me, okay?”


    “Okay.”


    Then he thought better. “Have you called the police?”


    She heaved a deep breath. “I had a police escort following me, watching my back.
    Two officers.”


    “Where are they now?”


    “Dead, I think. Someone shot out their tires and they crashed on the side of the
    road. The patrol car exploded. I should have stopped to help.”


    Nathan closed his eyes and tried to focus. “You didn’t stop. Smart move.”


    “I wanted to stop but... I saw the SUV. I sped up and rounded the big curve near
    Green Mountain.” Heaving a sigh that sounded more like a sob, she said, “I pulled
    off on a dirt lane but it’s a dead-end. I think the SUV went on by but I’m afraid
    to get back on the road.”


    Nathan knew that curve. Just enough time to get her out of view of any car following
    her but also a dangerous place where someone could hide and wait for her.


    “Did you call anyone else?”


    “I called you,” she said through a shuddering sob. “Because this won’t end with
    the local police, Nathan. I witnessed a double homicide that looked like a hit
    job. Those two officers are probably dead. The FBI will probably be called in
    and I’ll need to testify.”


    `FBI`? Now he was tripping over his own feet. “Alisha, I know the road you’re
    on. Find an Amish farm and wake someone up. Stay with them until I get there.
    Do you hear me?”


    She didn’t speak.


    He held the cell between his ear and shoulder while he grabbed at more clothes
    and found his weapon and wallet.


    “Alisha?”


    “I know a shortcut,” she said, sounding stronger. “I’ll take that route once I
    hit the turn. I’ll try to find a house, I promise. My cell battery is low. I have
    to go.”


    “Alisha, tell me what to look for.”


    “Black Denali SUV. Two men in the vehicle. I have to go.”


    “Alisha, don’t—”


    She ended the call.


    Nathan stood there in the dark, the images playing in his mind a terrible torment.
    If anything happened to her...


    He’d been through this kind of terror before. He would not go there again.


    With that vow in mind, he finished putting on his clothes and hurried out.

