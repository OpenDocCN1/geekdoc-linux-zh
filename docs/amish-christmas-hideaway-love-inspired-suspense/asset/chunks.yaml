    He moaned and lifted his gun, shooting into the air. That gave her time to kick
    him and shove him, forcing him to drop the gun. Scrambling, she dived for it and
    found it then turned as he lunged toward her.


    “Stop, Mitchell! Please stop.”


    With a roar, he kept coming. So she shot at him.


    He fell over at her feet, his hands flailing in the cold creek bed’s glistening
    water. Then he didn’t move again.


    * * *


    Nathan came on the scene, the dim light from his phone shining over the woods
    and stream. “Alisha?”


    He prayed, the silent screams inside his head holding him frozen.


    “Down here.”


    Alisha!


    “I’m coming.” He slipped against the rocks, his knee jamming against a jagged
    branch. But he made it to the stream and called out her name. “Alisha.”


    “Here.”


    Nathan saw her then, sitting on a rock, her head down, her arms close to her chest.
    She was holding a pistol and staring at the man lying on the water’s edge.


    “Alisha,” he said, falling down on his knees in front of her. “Are you all right?”


    She nodded, sniffed. “I shot Mitchell.”


    Nathan pulled her into his arms. “It’s okay. It will be okay.”


    “See if he’s alive.”


    Nathan let her go and pulled the older man away from the water. “He has a weak
    pulse but he’s alive.”


    Alisha gulped in a sob. “He’s the one, Nathan. He hired the hit men.”


    “We’ll talk about that later,” Nathan said, sirens wailing back at the house.
    “I have to call for help now.”


    She nodded again, her hand reaching for him. “Where do we go from here?”


    Nathan turned and lifted her into his arms and held her tight. “We go home, Alisha.
    We go home.”


    ## New Year’s Eve


    “How are you feeling, Sugar-bear?”


    Alisha tugged at the warm quilt her grandmother had covered her with earlier.
    “I’m okay, Granny. Really.”


    “You had a nice nap,” Bettye said, concern in her eyes. “No more nightmares.”


    Alisha thought about the last couple of days. “No. I’m sleeping better.”


    True to his word, once they’d given their statements and all of the law enforcement
    people were satisfied that they now had enough evidence to bring down the pill
    mill for good, Nathan had taken her out of the hospital and brought her here to
    Campton Creek.


    Home. He’d brought her home.


    And then he’d left while she was sleeping. That had been two days ago. She didn’t
    know if he was ever coming back.


    “We have more food than we’ll ever eat,” Miss Judy said from her chair in the
    corner. “Are you hungry, Alisha?”


    “No,” Alisha replied. “Not right now.”


    “We can watch the festivities on television tonight if you want,” Granny suggested,
    her gaze meeting Mrs. Campton’s.


    “Whatever you two want to do.”


    “You’ve been through quite an ordeal,” Mrs C said. “I’m sure Nathan is out there
    helping the authorities to wrap up this case.”


    “Maybe.”


    There would be a lot more to deal with but for now, Alisha was safe and warm and
    clean after enjoying a long, hot shower earlier. But still, she shivered.


    Granny checked her watch. “Supper time.”


    “You two eat,” Alisha said. “I’ll just lie here and snooze.”


    “Okay then.” Granny moved with swift agility toward the kitchen. Mrs C heaved
    herself into her wheelchair and did the same.


    Those two, always conspiring.


    The bell dinged, meaning someone was downstairs.


    “Alisha, do you mind getting that?”


    “Uh, okay.” Alisha forced herself up and tugged at the black wool tunic that covered
    thick plaid leggings.


    She went down the stairs and opened the door and stared at the man standing there.
    The man holding a bouquet of roses and a box of candy.


    “It’s not Valentine’s Day,” she said, her heart bursting with joy and fear.


    Nathan filled the doorway with fresh air and spice. “No, but it is a good day
    to celebrate.”


    She glanced behind her. “If you say so.”


    “I do,” he said. “Can you come with me?”


    “I’m not sure. I mean, you left without saying goodbye.”


    “I had some things to take care of.”


    She had a feeling the two extremely quiet women in the kitchen were in on this
    surprise, so she didn’t bother telling them where she was going. But she had to
    ask. “Where are you taking me, Nathan?”


    “You’ll see.”


    He guided her across the breezeway and into the main house. When they reached
    the big sunroom, he stopped. “Happy New Year, Alisha.”


    Alisha stared in fascination at the twinkling lights someone had strung across
    the room. A bistro table complete with candles and china sat ready, covered dishes
    of food centered on a nearby cabinet. Outside, the backyard looked like a fairytale,
    all white and pristine and glistening.


    “Who did all of this?”


    “I know people,” he said, sitting her down in one of the chairs. After he handed
    her the flowers, he placed the candy nearby and sat down across from her. “We’ve
    never actually had a real date, you know.”


    Alisha put the flowers on the sideboard and gave him her full attention. “This
    after you just walked away two days ago.”


    Taking her hand, he said, “Yes, this, after you just walked away two days ago.”
