    “Whatever you two want to do.”


    “You’ve been through quite an ordeal,” Mrs C said. “I’m sure Nathan is out there
    helping the authorities to wrap up this case.”


    “Maybe.”


    There would be a lot more to deal with but for now, Alisha was safe and warm and
    clean after enjoying a long, hot shower earlier. But still, she shivered.


    Granny checked her watch. “Supper time.”


    “You two eat,” Alisha said. “I’ll just lie here and snooze.”


    “Okay then.” Granny moved with swift agility toward the kitchen. Mrs C heaved
    herself into her wheelchair and did the same.


    Those two, always conspiring.


    The bell dinged, meaning someone was downstairs.


    “Alisha, do you mind getting that?”


    “Uh, okay.” Alisha forced herself up and tugged at the black wool tunic that covered
    thick plaid leggings.


    She went down the stairs and opened the door and stared at the man standing there.
    The man holding a bouquet of roses and a box of candy.


    “It’s not Valentine’s Day,” she said, her heart bursting with joy and fear.


    Nathan filled the doorway with fresh air and spice. “No, but it is a good day
    to celebrate.”


    She glanced behind her. “If you say so.”


    “I do,” he said. “Can you come with me?”


    “I’m not sure. I mean, you left without saying goodbye.”


    “I had some things to take care of.”


    She had a feeling the two extremely quiet women in the kitchen were in on this
    surprise, so she didn’t bother telling them where she was going. But she had to
    ask. “Where are you taking me, Nathan?”


    “You’ll see.”


    He guided her across the breezeway and into the main house. When they reached
    the big sunroom, he stopped. “Happy New Year, Alisha.”


    Alisha stared in fascination at the twinkling lights someone had strung across
    the room. A bistro table complete with candles and china sat ready, covered dishes
    of food centered on a nearby cabinet. Outside, the backyard looked like a fairytale,
    all white and pristine and glistening.


    “Who did all of this?”


    “I know people,” he said, sitting her down in one of the chairs. After he handed
    her the flowers, he placed the candy nearby and sat down across from her. “We’ve
    never actually had a real date, you know.”


    Alisha put the flowers on the sideboard and gave him her full attention. “This
    after you just walked away two days ago.”


    Taking her hand, he said, “Yes, this, after I walked away all those years ago.
    Because now I’m free and clear and so are you. We can finally have a fresh start.”


    “No, Nathan, we can’t.”


    He looked so crestfallen, her heart regretted her words.


    “Why not?”


    “You know why. You’re out there, putting your life on the line every day and this
    time, it was because of me.”


    “We survived and we’ve help put some nasty people away for a long time.” Then
    he said, “But you’re the one with courage here. You saved yourself, over and over.”


    “You saved me,” she said. “Over and over. But how do we get past that and go back
    to normal? I can’t work at Henderson and Perry anymore, even if Mr. Perry is begging
    me to stay.”


    “You don’t have to,” he said, lifting her out of the chair, his hands on her arms.
    “We can work here, together, Alisha. Put out our own shingle and...live the kind
    of simple life we both love.”


    Alisha’s pulse quickened. “What are you saying?”


    Nathan touched his hand to her chin, his fingers warm. “I’m trying in my clumsy
    way to ask you to stay here with me and...to marry me. Alisha, please. It took
    near-death to show me how much I still love you.”


    “You love me?”


    “I do. And... I believe you love me. Don’t you?”


    She couldn’t speak so she just bobbed her head, tears piercing her eyes. “So much.”


    He pulled her close and kissed her. “So want to partner up? Like forever?”


    Alisha thought of so many reasons to say no. But then she thought of the one reason
    to say yes. She loved this man. Always. And it was her job to protect his heart.
    Always.


    “I can live with forever,” she said, tugging his head down so she could kiss him
    again. “And working here with you would be amazing and challenging and so perfect.”


    Clapping sounded through the old house.


    Alisha looked inside and saw her grandmother guiding Mrs. Campton’s wheelchair
    toward them. They must have taken the elevator.


    “I see you do know people,” she said, laughing and crying at the same time. “Special
    people.”


    Her grandmother and Mrs. C both laughed and started immediately planning a spring
    wedding. “We’ll invite everyone!”


    “We will invite everyone,” Nathan said. “My family and yours.”


    “Together,” Alisha replied, her heart healed at last. “Thank you, Nathan, for
    bringing me home.”


    “Don’t ever leave me,” he said, holding her close.


    “I’m here to stay.”


    Alisha knew that in her heart. They were both here to stay.


    * * *


