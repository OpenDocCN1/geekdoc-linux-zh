    他们匆忙走向谷仓，但当内坦看到两个披斗篷的人影出现时，他松了憋了一口的气。


    “爸爸，是妈妈和阿丽莎！”


    “内坦！”阿丽莎拉着玛莎快步向那两个男人走去，“内坦，你还好吗？”


    他将她拥在怀里，他的父亲也那样抱着他的母亲。看到她活生生的视觉和感受让他不想再也不放手。“我们很好。发生什么事了？”


    她迅速向他说了情况。“我们必须找到逃跑的方法。我们本在躲起来，但他一直试图闯进来。”


    “留在这里。”内坦走到那名昏迷的男子身边，弯腰检查他的脉搏。


    阿丽莎加入了他的，，而玛莎守在阿莫斯身边。“他还活着吗？”


    “还活着。但他醒来后可能会非常痛苦。”那两个小稿人绕了回来，他的父母一起引导他们回了谷仓。“我需要报案，并叫一辆救护车过来。”


    “这样现在医院里会有两个嫌疑人。”


    “是的，之后他们就会进监狱。如果我们能留住他们足够久让他们开口的话。”


    当他站起来时，阿丽莎碰了碰他的手臂。“内坦，这一切结束了。躲藏无法停止这一切。今晚又是死里逃。”


    内坦点头，指了指地面。“是的，太险了。”


    阿丽莎发现那个男子携带的枪上有消音器，倒吸了一口气。“我知道他有消音器。他曾试图射开谷仓门。”


    “个高手，”内坦说，“他观察了好几天，今天，我给了他完美的机会。”


    “够了，”阿丽莎说，“无论带不带你我都要离开这里，我会直接去费城警察局，并给联邦调查局办公室打电话，告诉他们我安好无恙，并准备好告诉他们我所知道的一切我们需要停止逃亡，既然那是我们的下一个计划，也是最好的计划，我必须配合。”


    内坦拿出手机，意识到自己再次辜负了她。他一直试图保护她，但她已经好几次徘于死亡边缘了。他什么时候才能学会他一个人救不了任何人？不是他的妹妹，甚至不是阿丽莎。


    他拨下号码，但内心却在向上帝祈祷。


    *如鹿渴慕水，我的灵魂切慕于你，我的我的神*。


    内坦无法独自面对。他需要上帝与他同在。


    他也需要阿丽莎在他。他已经否认这一点多年了。


    联系完当局后，他转向站在寒冷中颤抖的阿丽莎。“警察带着救护车正在路上了。我们进屋吧。”


    “那他呢？”她说，盯着地上的男子。


    “我会留在这里直到他们赶到。我们不应该移动他。”然后他检查了路况。“我们需要低调处理。”


    “你可能需要这个，”她说，声音比现在坚强了。


    内坦低下头看向她正把他的枪抵在自己的斗篷上。


    “我没有开枪，”她说，“但我本会开。”


    “我知道，”他回答道，“是时候带你去一个安全的地方了。”


    “是的，一个不会让我们所爱的人再次受到伤害的地方。”


    # 十八


    为什么离开变得如此困难？


    阿丽莎看着玛莎·施罗克甜美的眼睛，看到了一个母亲再次看着儿子离开时的痛苦。


    “我不知道该如何感谢你，”她对玛莎低声说，她们聚在门口，守着那辆无牌车的到来。


    现在还早，黎明很快就会到来。整个世界闪烁着白光，雪覆盖了一切，像一条雪丝毯子。远处的白色房屋和谷仓在天空映衬下像疲惫的巨人。风中带着刺骨的寒意，让阿丽莎的泪水顺着冰冷的脸无声滑落。


    “不需要感谢，也不必期待，”玛莎回答道，握住阿丽莎的手。“无论发生什么，我们找回了内坦，那是我们无法夺走的礼物。”然后她凑近了一些。“我知道你会尽心去保护他。”


    阿丽莎点头，无法言言。她的祖母和坎普顿夫人曾向她解释过这种爱。男人天生是保护者，但女性用发自内心的爱保护他们的男人——那是最烈的爱。


    直到现在，阿丽莎才真正理解过那个概念。即使他们年轻且热恋时，她也是自私的。她太快地放弃了内坦，去做了她认为需要做的事。但她变得对爱变得世俗且批判，曾对抗过爱并关上心门。


    这一次她不会那样做了，即使她和内坦无法维系下去。但她想要成功。“我会尽全力的，”她勉力说道。


    玛莎紧紧抱住她。“传个信。”


    阿莫斯没有抱阿丽莎，但他拍了拍她的手臂。“*Gott*会保佑你们的。”


    内坦站在旁边，显得局促且显然很动摇。“我们会告诉你们进展情况的。”


    他的母亲冲过去抱住他。“保重，内坦，尽快*kumm*回来看来看我们。”


    “我会的，妈妈，”他在拥抱母亲时，目光搜寻着阿丽莎的脸。


    阿莫斯清了清嗓子点了点头。内坦伸握了父亲的手。“*Denki,*，爸爸。”


    阿莫斯没有说话……

