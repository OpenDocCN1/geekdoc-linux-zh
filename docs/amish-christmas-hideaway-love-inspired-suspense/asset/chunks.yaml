- fmt: '

    Nathan couldn’t stop his grin. “You hear that, Sugar-bear? Supper cooked by the
    best of the best. We’re in for a treat.”


    “If you call me that again, you won’t be invited to supper,” she retorted, but
    her eyes held a twinkle.


    Bettye smiled her sweet smile and sipped her coffee.


    Nathan remembered calling Alisha that long ago after he’d heard her grandfather
    calling her Sugar-bear.


    And Bettye Willis must have remembered, too, since she looked pretty smug and
    proud of herself. Matchmaking during a murder investigation. That was a new one.


    ***


    Alisha silently cringed while she washed up the breakfast dishes. `Sugar-bear`?
    Why had Granny brought up that old nickname?


    Maybe because the handsome man sitting at the breakfast table had made her grandmother’s
    pragmatic mind go completely giddy?


    Nathan had that effect on people. Which made him a great investigator since he
    could get people to talk, but it also made him too dangerous for most women.


    She should know. She’d been smitten with him ten years ago and even now, when
    they were forced to come face to face on cases, she had to fight not to revert
    back to being a wide-eyed schoolgirl.


    Deciding that couldn’t happen, she hurriedly got dressed and gathered her files,
    shoving them into her briefcase. Her grandmother wanted her to find love and be
    happy but pushing Nathan back at her wouldn’t take Alisha back down that road.
    The man had a quest that took all of his time. And she had her own sense of justice
    which meant long hours and sleepless nights. She was still an associate at the
    law firm since she’d only been practicing a couple of years. But one day she hoped
    to make partner. Which reminded her, she needed to call her boss and explain what
    was going on here before anyone saw it on the news.


    “I’m so glad we got to visit,” her grandmother said from the kitchen when Alisha
    came out of her bedroom. Granny was making cinnamon bread, one of Alisha’s favorites.
    The place smelled divine.


    “So am I,” Miss Judy said from her dainty chair by the small fireplace. “What
    a good day to stay in and bake.”


    Judy sent Alisha a soft smile. Even in old age, Judy Campton as still a regal,
    beautiful woman. Her hair was white now but clipped in a precise short bob. She
    wore a blue cashmere sweater and her famous pearls, classic and commanding. “Can
    you come and sit by me before you head to work, darling?”


    “Of course.” Alisha crossed the room to settle on the ottoman by the chair. “I
    hope we didn’t upset you with our news, Miss Judy. I won’t let anything happen
    to either of you.”


    Judy scoffed at that. “Alisha, your grandmother and I are tough old birds. We’ve
    seen a lot in our lives. We have faith that God is always in control.”


    “His will, not ours,” Bettye echoed, her hands moving with grace over the bread
    dough. Granny still had the Amish doctrine ingrained in her.


    Judy patted Alisha’s hand. “You are safe here. Your grandmother and I will pray
    all day while you and your handsome protector do what needs to be done. God gave
    us brains to help in His work, you know. You might be terrified, but He put you
    in that spot at that time for a reason, Alisha. You fight for the underdogs and
    you fight for those who can’t help themselves. You will bring these evil people
    to justice.”


    “I hope so,” Alisha said. “It’s something I can’t get out of my mind. I’ve worked
    a lot of cases since law school but seeing a murder will stay with me a long time.”


    “Seeing justice done will help you come to terms with that image,” Judy said.
    “Now we have security and Mr. Craig has assured me the authorities are aware of
    the situation. I can rest easy and enjoy all those cute Christmas movies on television.
    You know, they are so romantic.”


    Alisha laughed at that. “I rarely have time to watch but my friends sometimes
    force me to sit for popcorn and love stories.”


    “We all have love stories,” Judy said, nodding. “You have one yourself.”


    “I think I’m a little late for the love department,” Alisha said, thinking of
    the man waiting for her on the other side of the house. “I love my work so I’d
    better get going.”


    “All work and no romance can make a girl tuckered out,” Granny said. “Be kind
    to Nathan, Sugar-bear. He still cares about you.”


    Alisha wasn’t sure how to answer that, so she said, “I’m thankful that he’s here,
    that’s for sure.”


    “Yes, we are too,” Miss Judy said with a serene smile. “Bettye, finish up and
    we’ll watch this movie while the bread rises.”


    Alisha left them talking back and forth about which holiday movies they loved
    the most.


    She really did need to get a life outside of her briefcase. And she really needed
    to get a handle on the way Nathan made her heart bump and skip all at the same
    time.


    *I’m fighting a battle, Lord. Please give me the strength to stay away from temptation*.


    But when she got to the office across the way, that temptation was sitting on
    the old leather loveseat with his eyes closed and his booted feet across an ottoman
    straight in front of him.


    Alisha had to swallow. He looked so at peace, asleep there in the sunlight that
    had slipped through the blinds. So beautiful, so young, so amazing.


    Was he as soul-weary as she felt?


    Had God brought them together for a reason besides finding a killer?


    *Get to work*, she told herself. *Focus on what needs to be done*.


    # SIX


    Nathan woke with a start and tried to remember where he was. Campton House. He
    sat up, removed the blue chenille throw someone had placed over him then rubbed
    his hand down his face.


    The office, with midmorning sunshine through the blinds, its brilliance casting
    off the last of the snow. Everything came back to him and he became fully awake,
    a panic setting in.


    Where was Alisha?


    The office door stood open and the house breathed quietly, the few creaks and
    sighs from old age as comfortable as the air around him. But that sinister shadow
    of death and fear surrounded him too and he jumped up, hit his boot against the
    coffee table and mumbled to himself as pain shot through his sore toe.


    Hurrying to the hallway, he called out. “Alisha?”


    No answer.


    Nathan sprinted up the long hallway toward the kitchen, his breath catching against
    his chest. Why had he fallen asleep?


    “Alisha,” he called again.


    “In here,” she said, emerging from the powder room midway between the kitchen
    and the office. “I’m sorry. I was taking a break.”


    Seeing the concern and surprise in her wide eyes, Nathan nodded, took in a breath,
    and then raked a hand over his mussed hair. “Sorry. I woke up and you weren’t
    in the office.”


    “I *was* in the office for two hours,” she said. “I didn’t want to wake you so
    I came out here to talk to Mr. Henderson and assure him that I’m safe and then
    I took a break.”


    “Don’t do that again.”


    “What, go to the bathroom? That might be hard considering all the coffee I’ve
    been consuming.”


    “You know what I mean. Don’t let me sleep.”


    Putting a hand on his arm, she said, “Nathan, you needed to sleep. It’s daylight
    with bright sunshine everywhere. I think we’re safe for now.”


    “These people don’t care about daylight,” he said, pulling away.


    “I should take my boss up on his offer to come to his estate near Philadelphia.
    Talk about security.” Alisha’s boots clicked against the wooden floor, right on
    his heel. “Because I shouldn’t have called you. You’ll take this on and work yourself
    into a frenzy while you shadow me like a guard dog.”

