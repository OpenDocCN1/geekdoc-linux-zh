    Turning to face Martha, she turned a cold, still calm. “It’s someone else. We
    need to prepare.”


    Martha went into action. “The barn. Amos told me to run to the barn if anyone
    came.”


    “I don’t know if we can make it,” Alisha replied, searching the front yard. “I
    don’t know how many might be out there.”


    When they heard a footstep on the broad front porch, Alisha nodded. “The barn
    has weapons.”


    Marth bobbed her head. “Ja, and it also has animals that will put up a ruckus
    and give us time to hide.”


    Rushing to the mudroom, she grabbed two dark cloaks. Shoving one at Alisha, she
    whispered, “Put this on. It will shield you from the cold and hide you in the
    dusk.”


    Alisha put the cloak on and hurried to her room to get Nathan’s `Beretta`. The
    weapon would also shield her. Because she’d use it to protect Nathan’s mother
    and herself.


    Taking Martha’s hand, she followed the older woman out the back door then pulled
    her into the corner Nathan used to hide when he was making calls. After checking
    the yard and woods, they hurried past the few trees that offered protection and
    then sprinted toward the front of the big, hulking building. While Alisha watched,
    Martha unfastened the heavy hinges and motioned Alisha into the big, dark barn.
    Then she carefully closed the doors and looked into the darkness that engulfed
    them.


    After her eyes adjusted, Alisha spotted a big rake standing against the wall.
    Grabbing it, she worked to slip it through the inside handles of the doors. “To
    give us some time,” she whispered, taking Martha’s hand in hers. “Where should
    we hide?”


    Martha guided her to an empty stall in the far corner where stacked hay stood
    behind a cluster of feed sacks, milking buckets and hanging harnesses. Crouching,
    they huddled against the hay behind the feed sacks. The milk cows danced in a
    restless anxiety, thinking they might be fed or taken care of.


    The big draft horses shook out their manes and neighed softly.


    Martha had been correct, just as Mrs. Campton had said about the stag in the forest.
    The animals sensed something was not right.


    “They could hear the animals and come to look,” she whispered as she and Martha
    crouched in a corner near the gun cabinet.


    Martha adjusted her cape and did a quick peek around a feed sack. “Maybe the nervous
    animals will scare them away. I heard that happened last night.”


    So Nathan had told them about that. Remembering their kiss underneath the oak,
    Alisha wondered if Martha knew more than she’d voiced. That didn’t matter right
    now.


    Outside, the goats voiced their own alerts, their displeasure rising in a confused
    harmony as they bawled and bayed.


    “That old male goat doesn’t like anyone messing with his female companions,” Martha
    whispered. “He has a pair of painfully sharp horns.”


    Then the women heard someone trying to get inside the barn upfront. Through the
    doors.


    They’d secured the main doors but not the doors opening to the goat room and pen.
    “They’ll come around and try.” Alisha started searching for things to put in front
    of the back door. She could move a couple feeds bags to trip them, or tie a rope
    across the doors to slam them back toward the goats.


    “They’ll get rammed if they enter that goat pen,” Martha said with assurance.
    “The goats will gather around and stall them until we can run.”


    Alisha thought about that and tried to form a plan that would protect Martha.
    “We’d have to head to the edge of the woods, near the road. Then I can run to
    the phone booth.”


    Wishing she’d grabbed her cell, she listened for footsteps.


    They heard the doors jarring again, the pounding and knocking coming quickly this
    time. With a grunt, someone crashed against the massive, heavy doors. Then Alisha
    heard the sickening sound of a silenced gun.


    “They’re trying to shoot the locks off. That won’t matter, but the rake won’t
    hold forever,” Alisha whispered.


    Martha gave her a questioning glance. “We can send out the drafts.”


    “The horses.” Alisha had always admired the sturdy draft horses they used to farm
    the land. “What if one of your horses gets shot or hurt?”


    “Better than one of us getting the same,” Martha replied.


    They formed a plan. Alisha would pull the rake out of the door handles and allow
    the man to crash through. Martha would rouse the big drafts and have them waiting
    and then at the exact same time, she’d send them running.


    Hopefully, the animals would knock their intruder right off his feet so they’d
    be able to get away and also help Alisha and Martha escape. The plan didn’t go
    much further than running to the woods, however.


    “On three,” Alisha said as they moved slowly toward the doors. The barn had saved
    them from being assaulted in the house but now, they had one chance to make a
    run for it.


    “If this doesn’t work,” Alisha said when they approached the heavy doors, “then
    you run, Martha. Run as fast as you can and I’ll deal with whoever this is.”


    “How can I leave you?” Martha asked, her eyes shining with dread and fear.


    Alisha lowered her voice but made sure Martha heard her. “Just do it. I won’t
    have your death on my head, too.”


    ***


    Nathan turned the old buggy into the lane, relieved that they’d gotten Bettye
    and Judy settled. The two women had insisted they bring home cake and cookies
    even though they’d barely dented the feast his `mamm` had prepared. He’d gain
    ten pounds if he stayed here much longer.


    [/content]


