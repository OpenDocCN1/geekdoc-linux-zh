    flowing around them. “Then we’ll lock up tight.”


    Nathan nodded and thanked Bettye for the food. “I’ll be close if you need anything.”


    Remembering the house from his time here before, Nathan guided Alisha to the glass
    door that led to the enclosed breezeway, where two rows of windows provided views
    of the big front yard and the sprawling tree-lined backyard and lighted pool area.


    “Too many windows,” he said, holding her elbow while he scanned their surroundings.


    “I’ve never worried about that before,” Alisha admitted. “Granny will feel better,
    having you close by.”


    They made it to the matching set of doors on the other side of the breezeway,
    bypassing wicker chairs and tall parlor ferns.


    Alisha keyed in the code and the doors clicked open. Then they moved into the
    upper hallway of the estate house, now a center to help the Amish and anyone else
    who didn’t have the money to pay for doctors, lawyers and counselors.


    “The elevator is to the left if you ever need it,” Alisha reminded him, her words
    echoing over the big upstairs floor. Then she pointed to the right. “There are
    two bedrooms on the front of the house. And two more on the back. The master is
    up here on the other side down another hallway. It faces the backyard. We put
    mothers with children in there.”


    “I’ll take one to the front,” he said, “since the back should be fairly secure,
    but the front yard could be compromised.”


    Alisha nodded and took him to a bedroom that had a direct view to the street and
    to the carriage house. The yard was well lit, at least.


    “Sheets and towels are in the linen closet in the bathroom,” she said, pointing
    to the adjoining door. Then she turned at the main door. “I guess I’ll see you
    in the morning.”


    Nathan reached for her arm. “Are you sure you’re all right?”


    Alisha nodded but he could see the fatigue and worry shadowing her eyes. “I’m
    good now that I’m here. I doubt I’ll sleep but I’ll be okay.”


    “I can walk you back across,” he offered.


    “You don’t need to do that.”


    “I’ll go as far as the doors to the breezeway, to be sure.”


    She nodded and they walked back up the hallway together.


    “This is an amazing house,” he said once they’d reached the breezeway.


    Alisha nodded. “The Camptons founded this town over a century ago. It’s sad to
    think the Admiral and Mrs. Campton lost their only son Edward. He was killed in
    Afghanistan. He was a navy SEAL.”


    “I’ve heard about him,” Nathan replied. “I still have friends around here who
    tell me the latest news.”


    “And family?”


    Her question threw Nathan. They never discussed the past.


    “A few,” he said. “My parents will always be here.”


    He was about to tell her good-night when he heard a noise outside and then saw
    a flash of light.


    Without thinking, he pushed Alisha down beneath the windows and went with her,
    shielding her.


    “Someone is in the front yard,” he whispered, his heart hammering. “Don’t move.”


    Alisha nodded. “Granny—”


    Nathan put a finger to her lips, his grip on her so tight he felt her heart beating
    against his. “I’m going to check it out. You stay right here.”


    Alisha gave him a wide-eyed frown. “Nathan, don’t do that.”


    When they heard another noise, he gave her a quick nod.


    “If I’m not back in five minutes, call 911, okay?”


    Then he turned and headed back across the breezeway so he could sneak out the
    garage door downstairs, the beat of Alisha’s heart still racing through his pulse.


    If these goons had found her here this quickly, how did he have any chance of
    protecting her and keeping her alive?


    # FOUR


    Alisha huddled underneath the windows, the cold floor making her shiver while
    fear for Nathan made her shudder. Should she go after him? Alert her grandmother?
    Find a weapon?'
