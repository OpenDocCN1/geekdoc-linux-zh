    贝蒂·威利斯在门廊门阶梯通往二楼交汇处那个宽敞的门厅遇见了他们。一张小桌子上放着一棵闪闪发光的陶瓷圣诞树，空气中弥漫着肉桂和香料混合花的气味。


    贝蒂紧紧地抱住艾丽莎，给了她一个拥抱。“艾丽莎，我们开始担心了。”她后退了一步仔细打量着，道，“我已经让朱迪去睡觉了。”


    接着，她的奶奶在阴影中看到了内坦。当惊讶的目光从艾丽莎移到他身上时，贝蒂问：“克雷格先生，你在这儿干什么？”


    内坦对贝蒂露出了笑。“这是一个很长的故事，威利斯夫人。”


    “他是来帮我的，奶奶，”艾丽莎说，希望奶奶不要再追问了，“我们早晨再解释。”


    贝蒂轻笑着拒绝了。“我一整晚都在看书，”她说，“进厨房来，我给你们做点吃的。然后你们就可以告诉我到底发生了什么了。”


    看到他们犹豫，她的奶奶双手叉着腰。“你们应该意识到，我虽然老了，但并不是完全没用和糊涂。艾丽莎，如果没有极其充分的理由，你不会在深夜把内坦·克雷格带到这里的。”


    艾丽莎给了内坦一个警告的眼神。“那我会解释的，奶奶。没必要让你整晚都在那担心。”


    ***


    “这太不可思议了，”在艾丽莎重述了发生的事情后，贝蒂说道。她转看向坐在一个吃了一半的烤牛肉三明治面前的内坦，拍了拍他的手。“内坦，我非常感谢艾丽莎想到了给你。”


    内坦盯着盘子旁等着的饼干，又看了看艾丽莎，忧虑之感涌上心头。如果他当时没接电话呢？如果他当时不在木屋呢？


    他不会去想这些的。他现在和她在一起，而她是安全的。“我也是，威利斯夫人。”


    “叫我贝蒂就好，”那位年长的女性说道。她穿着一件蓝色的法绒睡袍，以抵御宽敞的艺术装饰风格厨房凌晨的寒意。“要再点咖啡吗？”


    内坦举起杯子，心想今晚反正也睡不着了。“谢谢。”


    艾丽莎抱着杯子坐着，感受着温暖。奶奶为她找了一件舒适的毛衣和一条牛仔裤。艾丽莎在这里留了一些衣服，因为她经常无偿工作到深夜，而且偶尔会过夜。


    “所以，你要成为我们的保护者了，”贝蒂点头道，“我们早晨会向坎普顿夫人解释这一切。她一定会同意，这里现在对你们俩来说是最安全的地方。”


    “我不想让你或她陷入危险，奶奶，”艾丽莎说。“这只是持续几天。”


    “直到圣诞节后，”贝蒂说，“记得，你有一整周的假。”


    “也许要到新年，”内坦重复道。


    “我希望不要那么久，”艾丽莎回答道，绿色的眼中闪烁着固执的光。


    “没关系，”她泼的奶奶回答道，“如你所知，艾丽莎，中心接下来几天都会关闭，我们有很多烘焙要做，还有包裹要包。圣诞节我们要拜访阿米人。你可以帮忙做这一切。”


    “好的，奶奶，”艾丽莎说。但她的声音里没多少热情。她会没日没夜地解决这件事。


    “我会住在主屋的一个房间，”内坦对贝蒂说，“但至少会在宅上。”


    “我已经感觉好多了，”贝蒂回答道，“现在，让我们都安顿下来。你们一定累坏了。我们早晨继续讨论。”她起身补充道，“你们一定饿了。”


    “我会把饼干留到以后吃，”内坦说。


    “对不起，奶奶。很难吃。”艾丽莎把自己的三明治拿到水槽旁。“我去洗碗，然后回房间。”


    内坦挑了挑眉，带着疑问。


    “放松，”艾丽莎说。“我的房间就在奶奶房间对面。这地方有三个卧室。坎普顿夫人住的大套房和走廊对面的两间较小的卧室，它们之间有一个浴室和一个小休息室。”


    “挺舒服的，”贝蒂耸了肩说。


    “是啊，舒服。我隐约记得布局。”内坦想到了所有可能发生的意外。“进主屋需要钥匙或密码吗？”


    “我给你看，”艾丽莎说，语气带着焦虑。


    “那我就在这儿等，”贝蒂说，她祖母般的目光捕捉到了他们周围流动的各种暗流。“然后我们会锁好门。”


    内坦点头感谢贝蒂的食物。“如果需要任何东西，我就在这里。”


    记得以前在这里，内坦引导艾丽莎走向通往封闭走廊的玻璃门，走廊的两排窗户可以看到宽敞的前院，以及树木林立的后院和灯光池区。


    “窗太多了，”他一边搂着她的肘，一边环顾四周。


    “我以前没担心过这个，”艾丽莎承认道。“有你在身边，奶奶会感觉好些。”


    他们来到了走廊另一侧配套的门，错过了藤编椅和高大的客厅蕨类植物。


    艾丽莎输入了密码。

