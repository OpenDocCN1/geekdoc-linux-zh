    and the bleeding man. He held the rifle over Alisha. “Drop the gun.” Nodding to
    his buddy Adam, he said, “They can kill each other, for all I care. We came for
    the woman.”


    Nathan moaned again and tried to roll over toward Alisha so he could get the gun.
    The one she’d recognized came at her, dragging her away from Nathan. Alisha held
    up the gun, determined to shoot it but the man knocked it out of her hand, an
    ugly grin on his craggy face. Alisha screamed and kicked the gun away with her
    foot, praying Nathan would see it.


    Her heart hammering, Alisha screamed again, kicking and fighting. The man with
    the long hair—the man she’d seen the night of the killings—had her by her cape
    collar, his stubby fingers digging into her skin. Leaning close, he whispered
    in her ear, his hot breath hitting her skin. “It’s over now, lawyer-lady. No one
    will ever find you in these woods.”


    Alisha tried to scramble away, tried to grab her briefcase so she could use it
    as a weapon. But they lifted her like a rag doll and tossed her out the back door.
    The frigid air poured over her, freezing her to the spot for a split second. She
    turned, screaming for Nathan. A grungy hand slapped at her face and then covered
    her mouth.


    “Scream again and we’ll kill him in front of your eyes and then we’ll kill you
    and your sweet gun-toting grandma, too.”


    Alisha turned back, panic in her throat, her lip bleeding, the cold wind chilling
    her to the bone. She had to do something. Nathan was injured and there was no
    way out. She’d wounded the other man but he could still get in a shot and kill
    Nathan.


    Then she heard someone calling her name.


    “Alisha!”


    Nathan. He’d crawled to the door, his gun in his hand. He shot into the air but
    missed her captors.


    One of them turned and shot back and she watched as Nathan slipped down the outside
    wall. And didn’t move.


    * * *


    Nathan grimaced, the pain shooting through his shoulder excruciating. The bullet
    had gone through but he’d passed out for a few seconds and bled into the snow.
    He had to get to Alisha but he couldn’t help her if he fell unconscious in the
    woods.'
