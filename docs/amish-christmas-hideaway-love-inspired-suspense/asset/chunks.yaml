  trans: '

    她正准备回楼上，这时听到米切尔的声音从厨房里传出来。


    “我不在乎付出什么代价。让金凯德闭嘴，”米切尔对着电话说道，他的背背对着从走廊通往厨房和早餐室的拱形门口。“我们必须平息这场乱子。”


    金凯德？艾莉莎倒吸了一口气，转身想要逃跑，但由于太匆忙，她的腿撞到了走廊的桌子，细长的桌腿在地板上划出刺耳的声音。


    向楼梯冲去时，艾莉莎回起了一段遥远的记忆。几年前，曾有一个男人来这栋庄园打杂工。整个办公室的人都受邀来到这里野餐。艾莉莎走进屋内去洗手间，听到米切尔在和那个男人说话——就在那个厨房里。那天他说的话几乎如模一样。


    “把事情搞定，金凯德。我们不能让任何人看到这个乱子。”


    米切尔在谈论谁是谁？当时，她以为是有人在这间整洁的房子里洒了什么食物或饮料，米切尔需要修理工来清理。


    但如果那是更阴险的事情呢？


    她爬到楼梯半程时，听到他在她身后说话。“艾莉莎，我们需要谈谈。”


    ***


    内坦惊醒了。无论他掉落在哪里睡觉，他往往会产生这种反应。但这一次，他爬起来寻找他的枪。他听到了动静。门关上的声音，脚步声在屋里的移动声。


    抓起衣服，他的膝盖撞到了床头柜，发出一声呻吟。你可能会以为他变得没那么笨拙了，因为这本是常有的。他单脚跳着，总算穿上了鞋。楼下的一扇门关上了。接着他听到引擎的轰鸣声。


    冲出房间，他看到芬威克探员房间的门开着缝。内坦动作很快，推开了门。里面没人。


    他急着朝楼梯去，看到一个女人躺在底部。没有动静。


    内坦滑步停下，跪在地上。


    探员躺在地上，血液从她的头上渗出来。“芬威克探员，能听见我说话吗？发生什么事了？”地板上的女人呻吟道。“他带走了她。他带走了艾莉莎。我试图阻止他，但……”


    内坦不需要问是谁。他心里清楚。“我去追他们，”他说道，“我会叫援军的。”


    “小心。他要杀了她。我本该警告你的。”


    内坦站起来对着手机大喊，他的心脏在胸腔里剧烈撞击，让他几乎要晕过去。


    他为什么让他让她留在这栋房子里？FBI 把艾莉莎当作诱饵来抓捕真正的杀手。


    他为什么没有在她卧室门前放一把椅子并在那里坐一整晚？


    这到底是怎么发生的？


    *你又失败了。是你的错。*


    脑海里的声音对他尖叫。但内心的声音告诉内坦要冷静，要信主，要尽全力祈祷。他现在不能失去艾莉莎。


    他不会让那种事情发生。


    于是他请求上帝保佑他，并守护艾莉莎，直到他找到她。


    ***

    “自从我第一次雇佣他以来，斯科特老了，”米切尔语气克制地说。他推着艾莉莎穿过前方的雪林，一边走一边继续说。“你总是对细节很敏锐。我知道你早晚会记得的。”


    “那天晚上在木屋时我没认出他，”艾莉莎说，在努力寻找逃生办法的同时希望能最终获得真相。在芬威克发现他拖着艾莉莎下楼梯后，米切尔击了芬威克的头部。她不确定内坦是否听到了什么。


    “你和你的私家探确实很执着，”米切尔将枪抵在她的肋骨上。“可惜你们那天晚上决定在圣诞市集停手。这概率有多大？我的人不知道你是是谁。”


    “米切尔，帮我理解一下，”她说，由于他推着她下山坡走向财产下方的溪流，她的呼吸变得急促。“为什么要参与这件事？”


    “米里亚，”他说，语气现在变得颤抖起来。“她对处方止痛药有问题。那是她表演马时期留下的旧伤。她找到了约书亚·西斯特博士……然后就那样。上了阿片类药物瘾。”


    艾莉莎的震惊让她停下脚步，转身面对他。“米里亚？真难以置信。”


    “也很难掩盖，”他补充道，表情近乎疯狂。“她学会了向所有人隐瞒，包括我。”


    “但你为什么要参与这场枪击案？”艾莉莎即便活不到能告诉任何人也必须知道真相。


    “这很简单，艾莉莎。我雇了这次暗杀。我希望我的妻子安全健康，但西斯特博士不断给她提供药物，并向她收取高额费用。当我听到他和那个傲慢的妻子决定要反叛时，我愤怒了。”


    艾莉莎的同情并没有阻止她的愤怒。“所以你从一开始就知道？你是那个一直想杀我的个人？”


    “不，”他说推着她往前。“我不想杀你，曾试图保护你，但如果金凯德开口，他会供我是雇他的人。而且……你看到了那些男人。他们自作决定去找你。太晚了，我意识到他们是为了自保才试图灭你的口口。”

