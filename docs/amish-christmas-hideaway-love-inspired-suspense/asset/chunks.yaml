    That led to the couple moving into another home the Camptons owned—their original
    farmhouse. The couple worked the land and helped them around the estate to pay
    them back. Mr. Campton gifted them with the land and the rental house so the Amish
    family could stay. Then word got out.


    Soon, he was selling off land to the Amish until all he had left was the estate
    grounds. The story went that Grandfather Campton could never turn down anyone
    in need and that the Amish around here had stayed by his side until the day he
    died. Then they’d helped his widow and now Miss Judy after the Admiral died. When
    the Campton’s only son Edward Junior, a navy SEAL, had died in combat, the Amish
    had been the first to show up and organize everything while they grieved.


    Alisha had looked forward to this week, but now she was back under the worst of
    circumstances.


    The teakettle whistled rudely, bringing her out of her memories. Alisha made two
    cups of tea and found her grandmother in the little sitting room with two iced
    tree-shaped cookies.


    “There you are,” Granny said. “Let’s enjoy the fruits of our labor. And while
    we’re at it, let’s talk about what’s going on.”


    Alisha sat down in the cushioned chair beside the sofa. “A murder case. Not what
    I wanted to bring for Christmas.”


    “I know all about that horrible incident,” Granny replied, her eyes warm and knowing.
    “I’m sure the authorities will find these evil people. I’m more concerned about
    you.”


    “I’ll be okay,” Alisha said, wanting to reassure her grandmother. “I’m being careful
    and alert and we have people watching out for all of us.”


    “I mean you and Nathan.”


    “Oh.” Alisha glanced over at her grandmother. “Do you think I was wrong to turn
    to him?”


    “No, I’m thankful that you called on Nathan for help.”


    “Then what are you fretting about?”


    “I know how intense things got with you two long ago. Your mother might not ever
    forgive either of us for that.”


    “Mom knows how to hold a grudge but I can’t change that,” Alisha said. “It ended
    and... I have a good life now.”


    “But you’re alone and so is he.”


    “And that’s the way it has to be for now, Granny. You aren’t suggesting that Nathan
    and I—”


    “Get back together?” Her prim grandmother looked a tad too guilty. “The thought
    did cross my mind. He’s no longer Amish and you’re still single.”


    Alisha shook her head. “I’m sorry but that can’t happen. We’re two very different
    people now. I have my work and...he lives for his work.”


    “Work isn’t life, darling.”


    “But it’s all I have.”


    Alisha put a hand to her mouth. “You managed to force that confession right out
    of me and with a cookie to bribe me.”


    Bettye laughed. “I suppose I did at that.” Putting down her china teacup, she
    took Alisha’s hand in hers. “I’m so proud of you but I want you to be happy. Not
    just content. But truly happy the way your grandfather and I were.”


    Alisha had long ago given up on that kind of happiness. “So you never regretted
    leaving your family?”


    Granny stared across the room to the one card she’d received early on from her
    mother, telling her that she would always love her. She’d framed that card, a
    beautiful sketching of Amish country in Ohio. “I regret nothing. I’ve missed them,
    no doubt, and we did finally reach out to each other and I’ve kept in touch enough
    to attend funerals and send Christmas cards, but I knew I belonged with your grandfather
    and so, no, I’ve never regretted that. I loved him enough to leave everything
    else behind.”


    Alisha could see that love in her grandmother’s eyes. “I think that might be the
    problem with Nathan and me, Granny. He loved his sister and now she’s dead. He
    thinks he’d not worth anyone’s love. And he sure doesn’t want to be with me, especially
    when I’m partially to blame.”


    Granny shook her head. “No, ma’am, you are not to blame and neither is Nathan.
    `Gott`’s will.”


    Alisha couldn’t accept that. “So God wanted Nathan’s family to suffer and automatically
    accept Hannah’s death and then just move on?”


    “No, God knows their anguish and he knows their strength. But we can’t question
    the ways of the Lord. There is a reason for everything. I know your analytical
    brain can’t quite accept faith the way I do, but I also know that you depend on
    the Lord same as me.”


    “I do depend on God because you taught me that and I pray every day that Nathan
    can get over Hannah’s death and finally find some peace in his life. He’s always
    out there searching, trying to help others. But why can’t he heal and move on
    with his own life?”


    The door to the apartment slammed, causing Alisha to come out of her chair and
    whirl around.


    Nathan stood there staring at her with such anger she actually took a step back.
    “What business is it of yours whether I find any peace of not?” he asked. “You
    don’t know me anymore and you certainly don’t need to waste your prayers on me.
    What `you` should do is let go of that heavy blame `you` want to keep. You have
    no part in this.”


    # EIGHT


    “Nathan.”


    He turned and whirled back to the door. Alisha glanced at her grandmother. “What
    should I do?”


    “Get back together?” Her prim grandmother looked a tad too guilty. “The thought
    did cross my mind. He’s no longer Amish and you’re still single.”


    Alisha shook her head. “I’m sorry but that can’t happen. We’re two very different
    people now. I have my work and...he lives for his work.”


    “Work isn’t life, darling.”


    “But it’s all I have.”


    Alisha put a hand to her mouth. “You managed to force that confession right out
    of me and with a cookie to bribe me.”


    Bettye laughed. “I suppose I did at that.” Putting down her china teacup, she
    took Alisha’s hand in hers. “I’m so proud of you but I want you to be happy. Not
    just content. But truly happy the way your grandfather and I were.”

