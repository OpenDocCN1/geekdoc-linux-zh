    “Who told you I was here?” Alisha asked, her tone firm and calm, while her eyes
    moved over the men. She had to find a way to get them out of this, but they were
    blocked in.


    “We asked around,” Mack Smith said with a slight smile.


    Alisha had already figured out these people were not FBI, but her radar went up.
    Something was definitely off. They were all three dressed for the weather in heavy
    canvas jackets and jeans. But they didn’t have the clean-cut look most FBI agents
