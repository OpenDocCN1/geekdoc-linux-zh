    “Your mother has missed you.”


    Chop, split. Chop, split.


    “I’ve missed all of you, too.” Nathan chopped a few more logs and laid them in
    the wheel barrel. “How are my brothers?”


    “Gideon works at the Bawell Hat Shop which has expanded into a big retail business.
    Raesha Bawell married a man named Josiah Fisher a year ago. Josiah has taken on
    some of the work at the shop so Raesha can raise their children. They are raising
    his niece and Raesha is expecting her first baby this spring. Gideon loves his
    work there. His wife Emma is also with child so she and Raesha have bonded over
    motherhood.”


    “That’s good news. He always did have a crush on his Emma.”


    “*Ja*, and finally admitted it and asked for her hand in marriage.”


    Nathan grinned. His father had spoken more than a few words. He was sharing real
    news. “Maybe I can see him during Christmas.”


    “They are coming the day after. Don’t bring any harm on him.”


