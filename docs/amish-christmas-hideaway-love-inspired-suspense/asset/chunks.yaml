    chair, unable to keep his eyes open any longer.


    * * *


    She woke to voices.


    A soft voice. “The poor girl is exhausted. No wonder. She almost froze to death.
    And you with a hole in your shoulder.”


    A harsh voice. “You bring her here, to our home? You and your *Englisch* world?
    I had no choice but to help you this morning, but I won’t have it. You can’t stay
    here, Nathan.”


    A tired voice. “I told you, I have nowhere else to go right now. She needs to
    stay out of sight for a while.”


    Sitting up, Alisha glanced around the clean, plain bedroom, the sun shimmering
    through the windows. A beautiful bed with a colorful diamond-patterned quilt that
    would be worth hundreds of dollars hanging in a city store, along with a side
    table and a chair and a small wardrobe. Simple, stark and beautiful. A house full
    of love.


    The sun shined high up in the sky, telling her it had to be mid-afternoon. She’d
    slept all day?


    Her mind foggy, she remembered bits and pieces of conversations. Nathan talking
    softly in her ear out in the forest. His parents wrapping both of them with blankets,
    their voices filled with worry and surprise.


    They’d taken her in. The parents that had not approved of her long ago had taken
    her into their home. Because they still loved their wayward son.


    But she’d brought conflict and confusion back into this house when Nathan clearly
    needed to find redemption and peace. She saw clearly now. As clear as the glass
    vase holding a few pine boughs. A simple gesture to celebrate Christmas in a plain
    and quiet way.


    “What do you plan? To shoot people dead in our yard?”


    “Enough,” Alisha said to herself in a mumbling whisper. “Enough.” She had to get
    out of here, for Nathan’s sake, if nothing else.


    Pushing back the warm quilt, she got up to get dressed, a slight dizziness causing
    her to sit back on the bed. She ran her hands through her hair and padded her
    way across the old linoleum floor to use the indoor facilities she spotted in
    a small room across the hallway by the kitchen. After finding her now-clean clothes
    drying in what looked like a combination mud and laundry room, Alisha dressed
    and went into the living room to catch Nathan and his father in a stare-off, the
    large dining table between them. Nathan’s arm was now tied with a white linen
    sling and a cloth bandage covered the wound on his shoulder. He also wore clean
    clothes. But he looked tired, dark circles underneath his eyes. Had he slept at
    all?


    Taking a deep breath, Alisha said, “I’ll leave.”


    They whirled to see her there. Amos turned an embarrassed red while Nathan fumed
    in frustration.


    Martha rushed toward her. “Did you sleep well?”


    “Yes, thank you.” Alisha wasn’t sure what to do or say. “I didn’t realize how
    exhausted I was.”


    Nathan came around the table. “You need to eat.”


    “No,” she said. “I need to leave. It’s obvious I shouldn’t be here.”


    Nathan shook his head. “No. It’s not safe. I saw a truck roaming the roads this
    morning already. We need to stay hidden for a day or so.” When she frowned, he
    added, “You’re tired and recovering and my arm is still not in full working mode.
    We need to rest.”


    “She has a *gut* point,” his father said, holding his own stare. “You shouldn’t
    be here.”


    Martha touched Alisha’s arm but gave her silent husband a firm stare. “Amos, I
    think they can stay a while. It is snowing and so cold and those people could
    still be around here somewhere. I made chicken and dumplings for supper. I’d like
    to share that with my son and Alisha. They are both wounded and need nourishment.”


    Amos grunted, the jagged wrinkle between his eyes deepening. “This is not our
    way, Martha.”


    “It is not my nature to turn away someone in need,” his wife replied. “Especially
    when it is our son who has come to us injured and asking for our help.”


    Alisha watched the silent war between Nathan’s parents. Amos Schrock caved to
    no one, except Martha Schrock. Nathan used to laugh about that, proud that his
    demure mother knew how to get her way when she wanted. Seemed this was one of
    those times.


    “It’s all right,” Alisha said. “I can call a cab.”


    Nathan didn’t argue with her but his eyes went dark. He looked weary but she was
    relieved that his shoulder was bandaged. She prayed his wound wouldn’t get infected
    but his mother seemed adept at such things.


    “You’re not leaving,” he finally said. “At least not without me.”


    Alisha realized his sacrifice. He’d come for her in the woods, wounded and hurting,
    and carried her all the way to this house. Instead of threatening to leave, she
    should be thanking him. She’d do that later when things weren’t so tense.


    Martha shook her head. “I am going to feed you both and let you rest. We will
    decide about what happens after that.”


    Amos nodded, silently and without any more arguments.'
