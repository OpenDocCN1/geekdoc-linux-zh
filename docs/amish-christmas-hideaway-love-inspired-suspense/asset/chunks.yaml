    “I mean all the way in. Dress the part, play the part, find someone you can trust
    to hide you.”


    “The Amish don’t condone violence and dishonesty. I won’t bring that on this community.”


    “It’s already here.”


    “And what about Bettye and Mrs. Campton?”


    “Those two won’t leave but the town police can assign two officers to patrol the
    grounds day and night.” Then he shrugged. “And from what I’ve heard about today,
    I’d say the women can hold their own if push comes to shove.”


    Nathan turned toward the fire and stared at the flames. “Alisha won’t like this.”


    “What won’t I like?”


    They both looked up to find Alisha standing in the hallway, her eyes full of questions
    and her expression full of stubbornness.


    # NINE


    “Nathan, what’s going on now?”


    Alisha saw the look that passed between the two men. “One of you had better start
    talking.”


    Nathan scratched his head and turned to her. “We need to go into hiding away from
    Campton House.”


    “I couldn’t agree more but you both told me this is the safest place for us right
    now.”


    “We thought that,” Nathan replied, his eyes stormy blue. “But they breached the
    estate from the water today and they’ll find another way in.”


    “Then what’s the plan?” she asked as she stepped close to the fire, her shivers
    coming from the fear holding her like a clawing hand. “Where are we going?”


    Nathan looked uncertain and Carson stared at the floor.


    “Carson thinks we should hide in plain sight—within the Amish community.”


    Alisha’s shock returned with a jolt. “What? And put more innocent people in harm’s
    way. I won’t do it. I’ll go back to Reading and rent a hotel room. Or I’ll head
    straight back to Philadelphia.”


    “You can’t do that, Alisha. They’ll track your every move.”


    “And they won’t do that here?”


    “Out there, they have a better chance of finding you,” Nathan said, his gaze beseeching.
    “The Amish won’t condone violence or danger but they will protect someone in need.”


    “There has to be a better way,” she said. “A safe house somewhere.”


    “The Amish community is safe,” Carson finally said. “If we find the right family
    and you two can blend in and follow the rules, you should be fine.”


    “But how will we find the right family?” Alisha paced by the fire, her boots hitting
    the hardwood floor. “I’m not doing this. It’s not right to put a family in jeopardy.”


    “There is one other option,” Nathan said, his eyes on her.


    She stared him down while Carson looked confused. “I’m listening.”


    “I can take you to my cabin.”


    That halted Alisha in her tracks. “What?”


    Carson ran a hand down his five-o’clock shadow. “I don’t know—”


    Nathan held up his hand to stop both of them. “It’s on the fringes of the Amish
    community, deep in the woods. Few people even know it’s there. We can dress to
    look Amish and sneak out after dark.” He nodded to Alisha. “I know you keep Amish
    clothes here, as needed.”


    “You know too much,” she retorted, the thought of going deep into the woods with
    this lone wolf scaring her in a different way. “But yes, we have the proper clothing.”


    Carson put his hands on his hips. “You can’t take your vehicle. They might have
    seen it here before you hid it in the garage.”


    “We’ll walk,” Nathan said. “We’ll bundle up and keep to the paths, not the main
    roads. My cabin sits about three miles from the main road.”


    “I can find someone to watch near the woods,” Carson said. “I know where a deer
    stand is hidden near your cabin. We can put an off-duty officer there. So no official
    vehicles will give you away and he can keep watch and alert you by phone if he
    notices anyone headed that way.”


    “This is ridiculous,” Alisha said. “They can follow us on foot and then we’ll
    have nowhere to hide.”


    “Do you want to risk another attack here?” Nathan asked.


    “No.” She didn’t want that but she didn’t like *this*. They stood staring at each
    other until she finally let out a sigh. “I’ll have to explain to my grandmother.”


    “You can tell her you’re leaving, but don’t tell her where you’re going,” Nathan
    suggested. “The less she knows, the better.”


    “I agree.” Alisha gave Nathan one last look, her heart in a panic. Would she be
    able to do this? To run away with the man she’d tried to forget? Once, leaving
    with Nathan had been her dream. Now she was living a nightmare.


    Nathan reached out a hand to her. “You know I wouldn’t do this if we had any other
    choice. I promise I’ll protect you and I’ll make sure your grandmother and Mrs.
    Campton are safe.”


    Carson nodded. “The Amish are getting word that something is brewing but they
    tend to stay out of matters of the law. They’ll keep an eye on Campton House,
    too. They will warn of anything strange happening.”


    Alisha pulled away from Nathan and sat down on a chair. “I don’t know. I should
    have never come here in the first place.” She let out a breath but held in her
    tears. “I just needed to see my grandmother.”


    Nathan bent down on one knee and took her hand again. “I understand. You wanted
    to feel safe, right?”


    “Yes.” She stared into his eyes. They were calm now, a deep blue calm that scared
    her all over again. “I was so frightened and in shock and I wasn’t thinking straight.”


    He kissed her forehead, a brief touch of his lips to her skin. “It’s going to
    be all right.”


    She savored that sweet gesture. “But you can’t be sure, can you?”


    His eyes flashed a pain so deep it cut straight to her heart. He was thinking
    of little Hannah. “No, I can’t be sure. But I’m going to do my best to take care
    of you.”


    Carson cleared his throat. “What time do you want to leave?”


    Nathan stood, his gaze still on Alisha. “Later tonight. At least, the moon isn’t
    full.”'
