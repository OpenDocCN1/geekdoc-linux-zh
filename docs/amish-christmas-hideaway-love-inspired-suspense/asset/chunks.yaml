    Nathan did his own sweep of the room and then pulled out Alisha’s chair. “How
    long do you think we’ll need to stay here?” he asked Agent Fenwick, who took care
    of her own chair across the way.


    “As long as you’re safe and Mr. Henderson doesn’t mind us hiding out here, I’d
    say a while.” She glanced from them to Mitchell. “But we’re close thanks to your
    cooperation. We have a man in custody and we’ve taken `Corey Cooper`’s statement.
    He’s beginning to see the wisdom of telling us what he knows.”


    “Who is `Corey Cooper`?” Mitchell asked as he placed prime rib on each plate and
    passed them around.


    Agent Fenwick’s gaze hit on Nathan and Alisha. The photographer who’d showed at
    the Campton Center early on might help them break this case, after all. “Sir,
    I can’t really discuss all of the details of this case with you, you understand.
    I shouldn’t have mentioned that.”


    “I see,” Mitchell replied with a knowing smile. “But `you` should understand that
    Alisha has given me most of the details already. I just don’t recall that particular
    name.”


    Nathan took over. “This is an amazing house. What year was it built?”


    “Nineteen-forty-five,” Mitchell answered as he served the rest of the meal. “It’s
    been in my family for well over seventy years.”


    The dinner went quickly after that, with stilted small talk. No one lingered over
    dessert and coffee.


    “We should find a place to talk,” Agent Fenwick said as they headed upstairs.
    “I saw a small den just past your suite, Miss Braxton. Meet there?”


    “We’ll be waiting,” Nathan said.


    After she went into her room, he added to Alisha, “I’ll check the place for bugs.”


    “Nathan, stop being so paranoid,” Alisha said, her own doubts nagging at her.
    “We have one of the men who attacked us at the cabin in custody at a hospital
    nearby and we have `Corey Cooper`’s cooperation now. If he can verify my identification
    of any of these men, then that’s something, right?”


    “Right.” Nathan guided her into the small den where circular windows highlighted
    the hills and valleys down past the pool and backyard. But the heavy blinds were
    shut tonight, the yellow glow of security lights shining against them.


    After checking underneath lamps and feeling under the furniture and across the
    mantle of the small fireplace, he turned back to Alisha. “I’ve got a bad feeling,
    Alisha. I don’t like this.”


    “Nathan, stop scaring me,” she said, aggravation and exhaustion making her snap.
    “We’re safe here.”


    “Don’t you find it strange that your boss insisted on bringing us here? That he
    knows a lot about this case?”


    “He knows me,” she replied. “He’s doing the same as you, trying to keep me alive.
    Do I need to remind you he’s had a team on this since the night this all happened?”


    “No, I’m well aware of that.” Nathan plopped down in a cushioned chair. “I think
    we need to get out of here.”


    Agent Fenwick walked in and shut the door. “You aren’t going anywhere. It’s too
    dangerous.”


    “Thank you for being the voice of reason,” Alisha said. “Nathan doesn’t trust
    anyone.”


    “Well, PI `Craig`, you need to listen to what I’m about to share with you,” Sandy
    Fenwick said, “and you need to understand that no one else can know this.”


    “We’re listening,” Nathan said.


    “Alisha, you stumbled onto two of the major players in one of the biggest pill
    mills in the state of Pennsylvania. All of the people you’ve found in your searches—the
    `Wests`, `Deke Garrison` and `Andrea Sumter`—are a part of this highly efficient
    network. They have mules and runners and spies everywhere. They hire drifters,
    people who do odd jobs, criminals, you name it. They push Medicare fraud by soliciting
    legitimate doctors to write fake prescriptions and they give them a cut. That’s
    how the `Wests` got involved—their greed finally did them in. This pill mill pushes
    fentanyl like candy and they specialize in everything from oxycodone to heroin.”


    She took a breath. “We were about to reel them in when this happened. Someone
    got word and hired this hit. Now they’re all scattered to the wind.”


    “And one of them wants Alisha dead because of what she saw,” Nathan said, his
    expression grim.


    “I think they all want her dead,” the agent replied. “And I think someone close
    to Alisha has been tipping them off.”


    ***


    “Do you believe her?” Nathan asked Alisha later after Agent Fenwick had gone to
    her room. She hadn’t told them who she suspected but Nathan had a pretty good
    idea.


    “I can’t imagine who would do such a thing. I called you and then `Carson` got
    involved. I don’t believe the Campton Creek town police would tip anyone off.”


    “Your grandmother and `Mrs. Campton` wouldn’t knowingly tell anyone your whereabouts.”


    “No, and neither would your family.”


    “That leaves one person,” Nathan said, hating to voice what his gut had been shouting.


    “You can’t be serious,” Alisha replied. “Mitchell? He’s been my mentor for years,
    Nathan. He promised me a job right out of law school and he’s been working night
    and day to help us.”


    “I asked you before if you trust him and I can see that you do, but maybe we need
    to rethink this.”


    “What does that mean?” she asked, her expression stubborn, her eyes moving toward
    the big hallway outside the sitting room.


    # TWENTY-ONE


    Once she was in her room, Alisha pulled out her laptop and did another search
    of `Scott Kemp` and `Scott Kaid`. She’d always been good with retaining information
    but the constant running for her life had her brain muddled.


    So if `Scott Kaid` was in the system, why hadn’t his name popped up when she’d
    done her first search? Deciding she’d go and talk to him and try to see if any
    warning bells went off, Alisha slipped out of her room and headed downstairs,
    her socks padding against the upstairs hardwood floors.


    When she hit the marble floor near the stairs she saw a light on down the hallway
    to the right where Mitchell’s study was located. The door was partially open but
    Mitchell wasn’t in the study. Glancing around, Alisha decided she’d take a peek
    at his desk. What could it hurt?


    Slipping past the partially open door, she checked the powder room attached to
    the study. No one there. Mitchell had to be across the house in the master suite.
    She’d just look around and see what she could find.


    After searching the files on the massive desk, she only discovered legitimate
    cases. Nothing in the drawers or in the credenza. Nathan had to be grasping at
    straws.

