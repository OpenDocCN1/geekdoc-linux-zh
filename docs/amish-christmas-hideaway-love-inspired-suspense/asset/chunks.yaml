    卡森结束了电话，绕过内坦飞驰而去，向镇外主路上的小镇警察报警。内坦盯着前方的道路。如果说没别的，他的朋友也有权因为他们超速而拦下他们。但那些人很危险，卡森不应该冒那个险。让警察来这里才是明智之。


    内坦专注于艾莉莎身后的那辆车。那辆大车撞击着艾莉莎的车。司机试图强迫她挤出路面。内坦猛踩油门，心想自己会撞上另一辆车。


    太晚了。


    他恐惧地看着那辆 SUV 再次猛烈地撞击艾莉莎的轿车。由于无能为力，内坦大喊着，看着她那辆小车在公路上旋转，最后冲进了一个深深沟。


    “不，”内坦在赶到现场时猛按刹车道。


    SUV 绝尘飞驰而去。小镇警察应该已经在前面等着了。内坦必须检查艾莉莎的情况。


    内坦将仍在运转的卡车挂入 `Park`，让它保持熄火状态，然后跳下车冲向艾莉莎，拉开了驾驶座的车门。


    他几乎喘不过气来，他喊道：“艾莉莎？”


    “我没事，”她说，双手紧紧抓着方向盘，头垂在面前。“我没事的，内坦。”


    她的声音听起来并不好。更像是呼吸困难且正处于休克中。“我去叫救护。”


    “不。”她抓住他的胳膊说，“请快带我离开这里。”


    他看着她，然后看向下方那片深色的深渊。她设法法让车停在一块凸出的岩石上，但车的大部分紧靠在一棵老而参差的树干上。那是一个腐烂且风化的树干，随时可能断裂。


    距离那个看起来像巨大的深谷坠落点只有几英寸之遥。


    “我会扶着你的，”他说，“快，握我的手。”


    她点了点头。“我的包。”


    “好的，拿过来。但要小心。”


    她抱起那个看起来很公事的大皮包递交给他。内坦把包放在地上，轻轻地拉了拉她。“慢慢向我转过来，好吗。”


    她点了点头，汽车随着她的动作而摇晃。当她扭过身体并成功将脚放在地上时，汽车呻吟着，又向老树干处滑动了一英寸。


    内坦的心也随着车辆一起咯了一下，呼吸屏住了。那根老树桩撑不了多久了。“数三，”他说，“一，二，三。”


    他的手现在按着她的腰，将她向上拉出，然后将她拉离那辆正在震抖的汽车。随着一声呻吟和轮胎与金属的嘶嘶声，汽车坠向了那根脆弱的树干，导致风化的木头崩成上百片干枯的粉末。内坦按住艾莉莎，听到汽车前右翼子擦过岩石的声音，它滑过深谷的边缘，在最后一次哀鸣中坠入下方。一声沉闷的撞击声，接着是金属破碎的声音在山丘间回荡。


    他们一起掉在道路弯道附近的草地上。内坦紧紧抱住她，闭上眼睛，呼吸着她头发上甜美的香气。


    “艾莉莎。”


    她突然直起身来，从他身边开了。“什么？”


    他躺在那儿检查她的状况，想要紧紧抱着她的冲动依然强烈。“你还好吗？”


    “还好。但我的车……没了。”


    内坦看着她散落在心形脸周围的深金色长发，有些凌乱。“对这件事我很抱歉，但我必须把你救出来。你的车已经太晚了，但我需要带你离开这里。”


    拍掉她头发和衣服上的灰，她叹了一口长长的、颤抖的口气。“我那辆车还没还清呢。”


    还是很务实，他心想，脉搏在耳边像电钻一样砰砰作响。“你有保险吗？”


    她向他点了点头，此刻神情空洞。“你叫援军了吗？”


    “叫了——附近有个朋友，当地人也在路口等着。如果身体哪里疼就告诉我。你撞到头了吗？”


    “没有。我的意思是我撞到了东西，但我没事。当他们撞向我时，我试图把车转向一棵树。我发现了一块石头和一棵树。弹了一下。如果你没来，我可能就死了。”


    她很受震惊，但内坦了解这个女人。坚强又固执。


    “好了，但你没死。”他站起来向她伸出手。她犹豫了一下，然后抓住了，在他将她拉起来时，皮肤与手指的触感让他感到一阵清醒的震栗。“我叫了我的朋友卡森·班顿。他是一名副警官，经常帮我忙。”


    “是非官方的，我确信。我希望他把他们赶走了。”


    “是非官方，是的。我希望他们没射他。”


    他打量着她，看着靴子和直筒黑裙、棕色皮夹克和黑色高领毛衣。优雅。“艾莉莎，听着，他们不知道你还活着。这给了我们时间。我们需要带你去一个安全的地方，好吗？”


    “我要去坎普顿家。”


    正如他想的那样，那是目前最近的隐藏处。“很好。坎普顿太太有一套先进的安全系统。”


    “我知道。我告诉她安装系统是因为我们有些案件的性质很敏感。它有时也可以作为安全屋。”


    “那将大有用处，因为在我想清楚这件事情之前，我们必须让你躲起来。他们认为你死在里面的时间越长越好。”

