    内森对房间进行了自己的周全搜查，然后拉出艾莉莎的椅子。“你觉得我们需要在这里呆多久？”他问向芬威克探员，芬威克探员正坐在对面整理她自己的椅子。


    “只要你们是安全的，而且亨德森先生不介意我们躲在这里，我觉得可以待上一会儿。”她的目光从他们移向米尔切。“但多亏了你们的配合，我们已经很成功了。我们关押了一个人，并拿了`Corey
    Cooper`的口供。他开始意识到告诉我们他所知的事情是明智的。”


    “`Corey Cooper` 是谁？”米尔切一边问，一边在每个盘子里盛上上排骨并分发给大家。


    芬威克探员的目光落在内森和艾莉莎身上。毕竟，这位早早在坎普顿中心出现过的摄影师，或许能帮他们破译此案。“先生，我真的不能和您讨论此案的所有细节，您理解的。我不应该提到那件事的。”


    “我明白了，”米尔切带着会会心的微笑回答道，“但`你`应该明白，艾莉莎已经给了我大部分大部分细节。我只是记不起那个特定的名字了。”


    内森接过了话。“这房子真惊人。它是哪年建的？”


    “一九四五年，”米尔切一边回答，一边上完剩下的菜。“它在我家族已经传了七多年了。”


    那之后的晚餐进行得很快，期间只有些尴尬的寒暄。没有人留下来吃甜点和咖啡。


    “我们应该找个地方谈谈，”芬威克探员在他们上楼时说，“布克斯顿小姐，我在你们套房后面看到一间小书房。在那儿见吗？”


    “我们会等你的，”内森说。


    在她回到房间后，他对艾莉莎补充道：“我去检查一下地方有没有窃器。”


    “内森，别再那么偏执了，”艾莉莎说，她内心的怀疑也在困扰着她。“我们那个在木小屋袭击我们的人之一被关在附近的医院了，而且现在有了`Corey Cooper`的配合。如果他能证实我对其中任何一个人的身份识别，那很有进展，对吧？”


    “对。”内森引导她进入那间小书房，圆窗向外可以看到泳池和后院外的山丘和平谷。但今晚厚重的百叶窗关着，安保灯的黄色光芒映在窗帘上。


    在检查了灯具下方、摸了家具下方以及小壁炉上方后，他转头看向艾莉莎。“我有不好的预感，艾莉莎。我不喜欢这样。”


    “内森，别吓我了，”她说，焦躁和疲惫让她发了火。“我们在这里很安全。”


    “你不觉得奇怪吗？你的老板非要带我们来这里？他对这个案子了如指掌？”


    “他了解我，”她回答道。“他正在和你做同样的事，试图保我的命。我需要提醒你吗，从这一切发生的那个晚上起，他就一直派了一支团队在跟进这件事？”


    “不，我很清楚。”内森坐在一把软垫椅子上。“我觉得我们需要离开这里。”


    芬威克探员走进来并关上门。“你们哪儿也去不了。这太危险了。”


    “谢谢你保持了理智，”艾莉莎说。“内森不信任任何人。”


    “好了，私家探`Craig`，你需要听听我准备分享给你的，”桑迪·芬威克说，“你需要明白，没有别人能知道这件事。”


    “我们在听着，”内森说。


    “艾莉莎，你无意中撞上了宾夕法尼亚州最大的几个药丸窝点之一的两个大人物。你在搜索中发现的所有人——`Wests`家族、`Deke Garrison` 和 `Andrea
    Sumter`——都是这个极高效网络的一部分。他们到处都是运毒的跑腿和间谍。他们雇佣流浪汉、临时工者、罪犯，凡你能想到的。他们通过诱正医生开具假处方来进行医疗保险诈骗，并给他们分成。`Wests`家族就是这样介入的——贪婪最终害了他们。这个药丸工厂像卖糖一样推芬太尼，他们专门经营从柯酮到海因的一切。”


    她吸了一口气。“当我们正准备把他们收网时发生了这种。有人收到了消息并雇佣了这次暗杀。现在他们都四散了。”


    “而且其中一个人因为艾莉莎所看到的而想让她死，”内森说，表情严峻。


    “我觉得他们人都想让她死，”探员回答道。“我觉得艾莉莎身边的人一直在向他们透露风声。”


    ***


    “你相信她吗？”在芬威克探员回房间后，内森后来问艾莉莎。她没有告诉他们她怀疑谁，但内森心里其实很有数。


    “我无法想象谁会做这种事。我给你打了电话，然后`Carson`也介入了。我不相信坎普顿溪镇的警方会向任何人透露风声。”


    “你奶奶和`Mrs. Campton`绝不会故意告诉任何人你的行踪。”


    “不，你的家人也不会。”


    “那就剩下一个人了，”内森说，他讨厌说出他直觉一直在叫嚣的答案。


    “你不是认真的吧，”艾莉莎回答道。“米尔切？他当了多年我的导师，内森。他承诺法学院毕业后就给我找工作，而且他一直在没日没夜地帮助我们。”


    “我以前问过你是否信任他，我看得出你信任他，但也许我们需要重新考虑一下。”


    “那是什么意思？”她问道，表情固执，目光看向客厅外的大走廊。

