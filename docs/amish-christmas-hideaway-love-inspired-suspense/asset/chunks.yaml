    Pulling Alisha close while they waited in a closed storefront doorway, he could
    feel her shivering. “How did they find us this time?”


    “Someone is always watching,” she said, her voice shaky. “And we’re running out
    of options.”


    # TWENTY


    “I’ll take care of everything.”


    Alisha gave her boss an appreciative smile. “Thank you, Mr. Henderson,” she said,
    too tired to focus on the whirl of the precinct around her.


    Dawn had greeted them by the time they’d arrived back at the downtown police headquarters.
    She should be warm by now since someone had provided her with a blanket and boots.
    But she couldn’t stop shivering. Right now, going to Mitchell Henderson’s house
    seemed like the right thing to do. Warmth and protection and someone else she
    could trust.


    Except Nathan wasn’t so keen on the idea.


    “Look, we’ve tried everything,” he said. “Something just isn’t right. I think
    you need to be surrounded by a security team day and night and hidden away here
    at the station.”


    “I’d have to sleep in a jail cell.”


    “You’d be safe.”


    Mitchell Henderson sat down beside them. “I guarantee Alisha’s safety, Mr. Craig.
    My home is gated. No one can get in or out without knowing the code.”


    “I’m coming with her.”


    Mitchell didn’t even blink. “I’d expect no less.”


    Detective Mathers came in and slumped into a chair. “Milly has a concussion but
    she’ll be fine. The guard on the back door is still in surgery.” Shrugging, he
    added, “And the intruder got away. No prints. Nothing. I think you’re being pursued
    by some kind of ghost who knows how to shadow people 24/7.”


    “You think?” Nathan asked, full of fire. “Do you want to tell us who your main
    suspect is so we can be more aware?”


    “I can’t do that,” the detective replied, his face as blank as the old white blinds
    on both sides of the room hiding them from the buzz of the precinct and the outside
    world.”


    Mitchell stood up. “Look, my staff will take care of Alisha and provide everything
    she and Mr. Craig need. I’ve got my own experienced investigators on this, too.
    None of you have managed to stop this assault. It’s time for me to step in and
    protect my employee. Alisha is a valued member of my law team.”


    Agent Fenwick came into the room. “Nothing on the intruder. I’m sorry, Miss Braxton.”


    Nathan looked from her to the detective. “All out of ideas?”


    “We’re pulling things together,” Agent Fenwick replied. “I think I have to agree
    with Mr. Henderson. But on one condition.”


    “What’s that?” Alisha asked.


    “I’m going with you,” the female agent said, her dark eyes daring anyone to protest.
    “I can’t let a star witness out of my sight. Last night proved that.”


    “I agree with her,” Detective Mathers said on a drawn-out note full of grudge.
    “We’ll do what we can to help, too. The opioid epidemic is going strong in the
    state of Pennsylvania but we’re so close to nabbing these drug runners. We all
    want these pill mills gone.”


    “So, we agree?” Agent Fenwick asked the room in general.


    “I’m in,” Nathan said. “Where Alisha goes, I go.”


    “I feel the same, PI Craig,” Agent Fenwick replied, her expression closed to discussion.


    Mitchell Henderson looked around the room. “Seems I’m going to have a full house
    for the New Year.”


    After everyone had left to make arrangements, Nathan glanced at Alisha. “I don’t
    like this. They agreed too readily. I think they know something they aren’t telling
    us.”


    “Such as?”


    “Such as—they know who’s after us but they can’t say it out loud. They’re setting
    us up as part of a sting. If they mess this up, they’ll have me to deal with.”


    “Why would they let us go to Mitchell’s place if they’re setting us up?” Alisha
    asked.


    “Maybe he’s in on it,” Nathan replied. “He seems to keep his cards close to his
    vest.”


    “Nathan, we’ve got to trust someone.”


    “Like we did last night?”


    “These people are relentless,” she replied, her tone beyond weary. “If they find
    us at Mitchell’s house, well, then I’ll be ready to discuss moving permanently
    to an undisclosed location.”


    “Not if they kill you, Alisha.”


    ***


    Later, Alisha stood in the middle of the big bedroom where Mitchell’s maid had
    placed her. “Mrs. Henderson suggested some clothes for you,” the dark-haired maid
    explained with a practiced smile. “Dinner is at six.”


    “You’ll have to thank Mrs. Henderson for me,” Alisha said, thinking that had to
    mean dressing for dinner. But why? She wasn’t here to socialize. Remembering Nathan’s
    chilling words to her earlier, Alisha wondered where she’d go from here.


    Her silent prayers held her in place. **Lord, let this end in a good way, with
    justice for those who have died and punishment for those who are evil.*


    “Mrs. Henderson is out of town,” the maid replied, bringing her out of her prayers.
    “She sends her regrets but she did instruct me to loan you some clothes.”


    Funny, Mitchell hadn’t mentioned that but Alisha was glad she wouldn’t have to
    indulge Miriam Henderson with idle chit-chat. Miriam was a kind, caring person
    who lived in her own little bubble of luxury.

