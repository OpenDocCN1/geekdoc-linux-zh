  trans: '

    他呻吟着，举起枪向天空射了一枪。这给了她踢他并推他的时间，迫使他掉了枪。她连滚带爬地扑过去，刚拿到枪，这时他正向她扑来。


    “住手，米切尔！求你停手。”


    他吼着，继续冲过来。于是她朝他开了一枪。


    他倒在她脚下，双手在冰冷溪床闪烁的水中挣扎着。然后，他再也没有动了。


    * *


    纳坦赶到了现场，手机发出的微弱光芒照在森林和溪流上。“艾丽莎？”


    他祈祷着，脑海中无声的尖叫让他僵在原地。


    “在这儿。”


    艾丽莎！


    “我来了。”他顺着岩石滑落，膝盖撞在一个扭曲的树枝上。但他达到了溪边，大声叫她的名字。“艾丽莎。”


    “在这。”


    纳坦这时看到了她，她正坐在一块石头上，低着头，双臂交叉抱胸。她手里拿着一把手枪，盯着躺在水边的男人。


    “艾丽莎，”他说道，在她面前跪下，“你还好吗？”


    她点了点头，吸了吸鼻子。“我杀了米切尔。”


    纳坦将她拉进怀里。“没事的。一切都会好起来的


    “看看他死死。”


    纳坦放开了她，把那个年长的男人从水边拉开。“他的脉搏很弱，但他活着。”


    艾丽莎咽着哭了出来。“是他，纳坦。是他雇佣了那些职业杀手。”


    “我们以后再说这个，”纳坦说道，房子那边传来了警报声。“我现在得去求救。”


    她再次点了点头，手伸向他。“我们接下来该怎么办？”


    纳坦转过身将她抱进怀里，紧紧搂住她。“我们回家，艾丽莎。我们回家。”


    ## 跨夜


    “你感觉怎么样，小宝贝？”


    艾丽莎拉了拉奶奶早些盖在她身上的暖毯子。“我很好，奶奶。真的。”


    “你睡了一个很舒服的觉，”贝蒂说道，眼中充满忧虑。“不再有噩梦了。”


    艾丽莎想了想过去的几天。“没有。我睡得好多了。”


    纳坦言出必行，在他们做完证词，且执法人员确认他们有足够的证据彻底终结那个药丸工厂后，纳坦就带她离开了医院，把她带了这里的坎普顿溪。


    家。他把她带了家。


    然后在她在睡觉时他离开了。那是两天前的事。她不知道他是否还会回来。


    “我们的食物多到吃不完，”朱迪小姐坐在墙角的椅子上说道。“你饿吗，艾丽莎？”


    “不，”艾丽莎回答，“现在不。”


    “如果你愿意，我们今晚可以看电视庆祝活动，”奶奶建议道，目光与坎普顿夫人交汇。


    “随你们便。”


    “你们经历了一场巨大的考验，”坎普顿夫人说。“我相信纳坦正在外面协助当局结束这个案子。”


    “也许吧。”


    还有很多事情要处理，但现在，艾丽莎在享受完一个长长的热热水澡后，感到安全、温暖且干净。但尽管如此，她还是抖了抖。


    奶奶看了看表。“晚饭时间。”


    “你们吃吧，”艾丽莎说。“我就在这儿眯一会儿。”


    “行吧。”奶奶敏捷地向厨房移动。坎普顿夫人也坐进轮椅，做了同样的动作。


    那两个，总是在一起密谋。


    门铃响了，意味着有人在楼下。


    “艾丽莎，你介意去开门吗？”


    “呃，好的。”艾丽莎强迫自己起来，拉了拉盖在厚格子打裤外面的黑色羊毛上衣。


    她走下楼，打开门，盯着站在那里的男人。那个男人手里拿着一束玫瑰和一盒糖果。


    “现在不是情人节，”她说，心中交织着喜悦与恐惧。


    纳坦让门框充满了新鲜的空气和香料味。“不是，但今天是个值得庆祝的好日子。”


    她看了一眼身后。“如果你是这么说的话。”


    “我是这么认为，”他说。“你能跟我一起去吗？”


    “我不确定。我的意思是，你没打招呼就走了。”


    “我有些事情要处理。”


    她感觉到厨房里那两个极度安静的女人参与了这场惊喜，所以她没费力告诉她们自己要去哪里。但她必须问问。“纳坦，你要带我去哪儿？”


    “你会看到的的。”


    他引导她穿过过道进入主屋。当他们到达大阳光房时，他停下了脚步。“新年快乐，艾丽莎。”


    艾丽莎着迷地看着有人挂在房间里的闪烁灯光。一张摆着蜡烛和瓷器的小餐桌已准备就绪，旁边的柜子上放着盖好的菜肴。外面，后院看起来像童话世界，一切洁白、无暇且闪闪发光。


    “是谁做了这一切？”


    “我认识人，”他说，让她坐在椅子上。在他把花给她后，他把糖果放在旁边，坐在她对面。“我们从没有真正进行过一次正式约会，你知道的。”


    艾丽莎把花放在侧边柜上，全神贯注地看着他。“就在你两天前走掉之后。”


    握住她的手说道：“是的，没错，就在你两天前走掉之后。”

