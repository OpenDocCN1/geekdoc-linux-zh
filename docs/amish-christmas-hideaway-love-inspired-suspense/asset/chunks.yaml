  trans: '


    也许这一切都是她的梦。在她用胡辣椒喷雾喷他们后，那两个男人尖叫着，她确保喷到了他们的眼睛和脸上。


    艾斯（Ace）抓住了她，将她推倒并拽了回去。


    “我现在就此结束这一切。我受够了在这些恼人的山丘和溪间追逐你。为了这种事，给我再多钱也不够。”


    她在他那双深邃、布满血丝的眼里看到了愤怒。恶意弥漫在他周围的空气中。他会毫不犹豫地杀了她。


    这时，传来一声俯冲的声音，一个巨大而野性的生物向他们冲了过来，几乎直接撞倒了那个抱着她的男人。那个人来得太突然、太恐惧，尖叫着逃了。他的朋友在咒骂了几句后，也跟了上去。


    那只长着巨大角的大鹿吓走了她的捕手。阿莉莎（Alisha）设法站起来，在深雪中尽力奔跑。


    但她偏离了小路，现在天黑了，雪又开始持续地落下。筋疲力竭的她坐在一棵茂盛橡树的树下。


    “我只是休息一下，”她对着夜色说道，“为了喘口气，找到离开这里的路。”


    在甜美的睡意袭来之前，她最后的念头是内坦（Nathan）。*主啊，请保佑他平安。*


    ***


    内坦念着他童年所有的祈祷，既有英语也有他长大时说的宾夕法尼亚荷兰语，同时，他用那小小的手电筒寻找阿莉莎的任何迹象。他本该在一小时前就找到她的，但他追踪的足印转入了东北方向的森林，新雪覆盖了痕迹。他失去了她的踪迹。


    他迷路了，现在他担心阿莉莎也迷路了。


    他也感到痛苦。他的手臂和肩膀在抽痛，但他不断敷上雪球，将一把白色雪泥按在外套袖子上，以此来冷却伤口，并希望它能止血。他的额头上起了一个包，随着每一次心跳而隐隐作痛。


    但他继续沿着那只大鹿冲刺的方向艰难行进，因为大脑一片空白，内坦已经没有其他选择。他将跟随他在这片森林中唯一的盟友。


    微弱的月光引导他进入森林深处。当他听到溪水顺着山坡流动的时，他停下来观察。他没有发现麦（Mack）和那个叫亚当（Adam）的人，但内坦知道罪犯是如何活动的。如果阿莉莎进了森林，他们要么躲起来等待机会，要么更有可能放弃了追捕。


    一群懦夫，但他对此感到庆幸。他们的老板不会高兴，但内坦现在不在乎。如果他能在他们之前找到她，内坦就能把她藏在一个偏僻而安全的地方。


    他来到了溪流穿过山脚的地方，用手电筒环顾森林，光束在树木和阴影间移动。当他在一个通往水边的空地上发现新鲜足迹时，他知道自己找对了路。


    就在那时，他看到了她。


    阿莉莎蜷缩在一棵树旁睡着，大雪覆盖了她的身体，毫无顾忌，毫无差别。


    寒雪。


    “阿莉莎？”他喊道，声音颤抖，心如被撕了一般。“阿莉莎？”


    她没有回应。内坦顺着岩石山坡滑下，跌跌撞撞，直到倒在她躺的地方几英尺远处。他爬着向她走去，将阿莉莎抱进怀里。


    “阿莉莎？”她很冷，脸冻得近乎蓝色。他揉了搓她的外套，又揉了搓她的脸。她没有戴帽子，也没有戴手套。


    感受她的脉搏，当他感到微弱的跳动时，他舒了一口气。再过一小时左右，他可能就会永远失去她。现在他们可能有机会。


    他抱起她，让她在怀里靠在树上，那种和她一起睡在这里的冲动如此强烈，他不得不用力眨眼来驱散这种念头。他的肩膀抗议地疼痛着，但他不能放她。“我们会没事事的。我们会避难所，你醒来时会温暖又安全。”


    她没有动，也没有回应。


    内坦不知道如何带她上山坡，但他会找到办法的。他不情愿地把她重新靠在树上，脱下自己的外套盖在她身上。他的长袖衫破了，满是血迹。他不在乎。


    抬头，他将光投向山坡，寻找上山的路。看到树上方有一些凹槽和岩台，他决定那是最好的路。


    他把光照得更高处，看到了另一个东西。


    那只大雄鹿站在那里，鹿角对称地张开，深色的眼睛盯着内坦。


    “谢谢你，”内坦用沙哑的声音低声唤道，“我们要回家了，留你在这里守卫。”


    公鹿低下头贴地，喷了几口气，然后抖了抖鬃毛，像是一种告别的姿态。接着它跃跃而去，消失在森林中。


    内坦找到了所需的体力。他拿回外套，用力将阿莉莎静止的身体抱进怀里，开始缓慢地带她上山，回到那条能带他们去温暖安全之地的小路上。


    他父母的家。


    他的第一次尝试失败了。他的靴子踩在一块湿滑的岩石上，滑了一下，坐在屁股上，阿莉莎还在怀里。


    “不太顺利，”他挪了一下阿莉莎的位置说道。他站起来走上山坡。


    “我希望他们在家。”意识到阿莉莎和大部分时间都在森林里，他说道，“快天明了，他们应该已经起床了。你知道的，农活。”


