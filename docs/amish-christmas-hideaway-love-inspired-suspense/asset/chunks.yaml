  trans: '

    他们获得了一个暂时的喘息。艾莉莎（Alisha）并不想要，也不配拥有。但内坦（Nathan）需要和父母共度这段时光，于是保持了沉默。


    内坦看着父亲走出房间，然后目光转向艾莉莎。“你还好吗？”


    “有点站不稳，”她说，扶着墙。


    “过来到桌旁坐下，”他拉着她的胳膊说道。


    她没有争辩。浓咖啡的气味吸引了她的注意力。看到咖啡壶，她没有表现得无礼，而是要了一杯。


    内坦读穿了她的心思。“妈（Mamm），我能给艾莉莎倒点咖啡吗？”


    “*Ja*，”他的母亲说，“我的礼数去哪儿了？”


    她的语气和蔼但带着犹豫。在如此极端的情况下再次见到儿子，她一定很难过。


    “我会非常感激的，”艾莉莎说，“我真不敢相信我睡了这么久。”


    “你情况很糟糕，”玛莎（Martha）在给内坦递了两杯咖啡后说道，“内坦抱怨我帮他清理伤口时，你一直睡着。”


    “很疼，”他微笑着承认道，“但妈有三个儿子，她很会照料受伤的儿子。”


    “*Ja*，不是吗？”他的母亲轻笑了一下，然后给艾莉莎递了一块抹了苹果果酱的暖饼干。“这能让你撑到晚餐。”


    内坦等她坐在长木桌旁后，接过了母亲递给的咖啡，坐在艾莉莎对面。“我已经发消息告诉了卡森（Carson）关于那些闯入者的事。他发现森林里鹿群观察哨上驻守的那名警官受伤了，但成功报告了情况。我离开后不久，有两名警察到达了木屋，但雪下得太大了，他们只能放弃当晚搜寻。”


    艾莉莎记得那层厚实而冰冷的雪。感激现在流淌在周身的温暖，她问道：“你还好吗？”


    内坦点了点头。“我经历过更糟的。”接着他继续报告。“我把他们使用的名字告诉了卡森，根据他们的描述和名字，他们会进行核查。在他们向路边回溯时搜遍了森林，发现了一个男人。他在附近的一家医院里被关押，但拒绝提供任何信息。”


    当他的母亲忙于家务时，她低声耳语道：“显然，他们没有找到另外两个。”


    “没有。但他们发现了被关押那个人留下的血迹。那至少可能给他们提供用来控诉他的 DNA 证据。他们还认为自己看到了那些男人开的那辆深色皮卡车。”


    艾莉莎抑制住颤抖。“我在这里感觉不舒服。”


    “你觉得在外面会更好？”


    玛莎对他们喊道。“让她安静地吃饭吧，内坦。”


    艾莉莎暂时放下了手中的东西，咬着饼干。饼干很好吃，但她似乎没吃多少。


    玛莎看着她的儿子。“内坦，你去去找你父亲好吗？晚餐很快准备好了。”


    内坦犹豫了一下，然后按照母亲的要求做了。


    当他走出后门后，在他关上门之前，一阵冷风溜了进来，玛莎转向艾莉莎，指了指一个小凳。然后她端了自己的了自己的茶走过来。


    “我觉得现在是你和我好好聊聊的好时机，艾莉莎·布克斯顿（Alisha Braxton）。”


    艾莉莎不知道该跑回卧室，还是直接走出大门迎接命运。


    玛莎等待着，蓝色的眼睛里带着的一丝挑衅。


    “当然可以，施罗克夫人（Mrs. Schrock），”她说，拿起凳。


    # 十四


    当他在想他的*妈（mamm）*和艾莉莎独自在家里情况如何时，内坦静静地帮父亲检查动物并翻新干草。马匹、奶牛和山羊根据它们的饲养计划，大部分在今天早晨已经吃饱了大餐。他的父亲有一个生物闹钟，总是在旭日升起前就起床，检查动物并忙于农场的工作。内坦无法入睡，从楼上旧房间的窗外看着他的*爹（daed）*忙碌。他那时没有下去，担心父亲不想让他帮忙。


    但现在，他已经克服了起初的犹豫。他的*爹（daed）*可能会怨恨他在这里，并不认同内坦现在的样子，但他回到家了，几天后就是圣诞节了。是时候拿出勇气面对他的父亲了。


    于是他在这里做着那些像吃母亲做的煎饼一样轻而易举的家务。与此同时，他扫视着平线和森林边缘，寻找任何潜伏者或闯入者。他没有看到有卡车在路上巡游，但他不禁好奇谁会潜伏在山山谷之外。


    但这片土地显得安稳宁静，就像他现在借穿的衣服一样老旧而舒适。没有被人等待攻击的迹象。他希望事情能保持一段时间的平静。


    一旦阿莫斯（Amos）对动物满意了，他就走向鸡舍确保母鸡温暖安全。那只凶的公鸡追着阿莫斯跑，但他父亲忽略了那只傲慢的鸟。内坦跟在后面，等待他沉默的*爹（daed）*开口。


    阿莫斯走到木堆旁拿起一把斧头。


    他把斧头递给内坦，内坦既惊讶又欢喜地接过来，看着父亲又找到了另一把。他们一起劈木，用来支撑运行家用电器的丙气罐。他的母亲仍然爱着她的木炉，在冬天最寒冷的时候会用它。


    “明天就是圣诞夜，然后是圣诞节，之后是探亲日，”阿莫斯指着显而易见的事说，“你可以留到圣诞节，但我希望你履行你的信仰，不要把*英语人（Englisch）*的暴力行为带进我们家。”


    “我会尽力让这种情况保持非暴力状态。”


    “如果那些男人出现在这里怎么办，内坦？”


    “我会把他们引离房子，确保大家的安全。”


    他希望如此。他必须找到自己的武器并制造吸引注意力。但内坦决定等战斗来临时了他去应对。


    “你从事的暴力工作是如何荣耀主主的？”


    “我的工作并不总是这样，”内坦试图解释道。“我帮助过很多人，主要是阿米士人（Amish），寻找亲人。我也通过寻找真相来帮助解决犯罪。”


    阿莫斯看着田野。“像这一块这样？”


    “是的，像这一块这样。”


    效法父亲父亲，他把一根圆木放在劈木架上，然后看着父亲。“我从未停止过荣耀上帝。我只是换了一种不同的方式。”


    “*英语人（Englisch）*的方式，”阿莫斯用力劈砍，木头轻易地裂成了柴。


    “是的，不同的传统，但同一个上帝。”


    “所以你经常去教堂吗？”


    他在这一点上被问住了。“我有空的时候。”


    “当你不在外面寻找恶人的时候？”


    “或者寻找失踪的人时候。”内坦无法承认自己很久没有踏进教堂大门了。“是的，我有空的时候，”他重复道。


    “你母亲很想你。”


    劈，裂。劈，裂。


    “我也很想你们。”

