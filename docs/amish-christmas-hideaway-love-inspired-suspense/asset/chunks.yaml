    Maybe she’d dreamed the whole thing. The two men screaming after she’d pepper-sprayed
    them, making sure she’d hit them in the eyes and face.


    Ace had grabbed her, knocked her down and dragged her back.


    “I’m going to end this here and now. I’m tired of chasing you around these aggravating
    hills and streams. They can’t pay me enough for this kind of stuff.”


    She’d seen the rage in his dark, red-rimmed eyes. Evil permeated the air around
    him. He’d kill her without any qualms.


    Then a swooping sound and something big and wild had leaped toward them and practically
    plowed into the man holding her. He’d been so taken by surprise and so terrified
    that he’d screamed and run away. After cursing at him, his friend had joined him.


    The big deer with the massive antlers had scared off her captors. Alisha had managed
    to get up and run as fast as she could in the deep snow.


    Except she’d veered off the path and now it was dark and the snow had started
    falling steadily again. Exhausted, she sat down near the trunk of a billowing
    oak tree.


    “I’ll just rest for a minute,” she said into the night. “Just to catch my breath
    and find my way out of here.”


    Her last thoughts before a sweet sleep took over were of Nathan. *Please keep
    him safe, Lord.*


    ***


    Nathan prayed all the prayers of his childhood, in both English and the Pennsylvania
    Dutch he’d grown up speaking, all the while searching with his tiny flashlight
    for any sign of Alisha. He should have found her an hour ago but the footprints
    he’d followed had taken a turn into the woods to the northeast and a new snow
    had covered them. He’d lost her trail.


    He was lost and now he feared that Alisha was also.


    He was also in pain. His arm and shoulder throbbed but he kept applying snowballs,
    placing a handful of the white slush over the sleeve of his jacket to cool down
    the wound and hopefully stop it from bleeding. His forehead had a knot on it that
    complained with each heartbeat.


    But he kept trudging in the way the big deer had charged because with his mind
    so fuzzy, Nathan was running out of options. He’d follow his only ally in this
    forest.


    A scant moonlight guided him deeper into the woods. When he heard a stream gurgling
    down the hillside, he watched and listened. He hadn’t spotted Mack and the one
    named Adam, but Nathan knew how criminals operated. If Alisha had gone off into
    the woods, they’d either hidden to wait for an opportunity or, more likely, given
    up the chase.


    Cowards, but he was glad for that. Their boss wouldn’t be happy but Nathan didn’t
    care about that right now. If he could find her before they did, Nathan would
    be able to hide her somewhere secluded and safe.


    He made it to where the stream ran through the foothills and shined his flashlight
    around the woods, touching it on shifts and shadows. When he spotted fresh footprints
    in an opening leading down toward the water, he knew he was on the right track.


    And that’s when he saw her.


    Alisha, lying curled up and asleep by a tree, snow covering her body without consideration
    or discrimination.


    A freezing snow.


    “Alisha?” he called, a catch in his voice, a rip in his heart. “Alisha?”


    She didn’t respond. Nathan slid down the rocky hillside, tumbling and tripping
    until he fell a few feet away from where she lay. Crawling and clawing his way
    to her, he lifted Alisha into his arms.


    “Alisha?” She was cold, almost blue with cold. He rubbed his hands over her coat
    and then her face. She didn’t have on a hat or gloves.


    Feeling for her pulse, he let out a relieved breath when he felt a weak beat.
    Another hour or so and he might have lost her for good. Now they might have a
    chance.


    Lifting her up, he held her in his arms and leaned back against the tree, the
    urge to sleep here with her so strong that he had to blink it away. His shoulder
    throbbed in protest, but he couldn’t let her go. “We’re going to be okay. We’ll
    find shelter and you’ll wake up warm and safe.”


    She didn’t move or respond.


    Nathan didn’t know how he’d get her up the hillside, but he’d find a way. Reluctantly,
    he laid her back against the tree and took off his jacket to put over her. His
    long-sleeved shirt was torn and covered with blood. He didn’t care.


    Looking up, he pointed his light to the hillside and searched for a way up. Seeing
    some grooves and ledges up past the tree, he decided that would be the best way
    to go.


    He shined the light up higher and saw something else.


    The big stag standing there, his antlers spread out in perfect symmetry, his dark
    eyes on Nathan.


    “Thank you,” Nathan called on a hoarse whisper. “We’re going to go home now and
    leave you to stand watch.”


    The stag lowered his head to the ground, snorted and then shook out his mantle
    in what could have been a parting gesture. Then he leaped away and pranced off
    into the woods.


    Nathan found the strength he needed. Taking back his jacket, he tugged Alisha’s
    still body up and into his arms and started the slow process of getting her up
    the hill and back to the path that would take them to a warm, safe place.


    His parents’ home.


    His first attempt didn’t work. His boot hit on a wet patch of rock and he slipped
    down, falling onto his backside, Alisha still in his arms.


    “That didn’t go well,” he said, shifting Alisha in his arms. He stood and made
    it to the hill.


    “I hope they’re home.” Realizing Alisha and he had been in the woods for most
    of the night, he said, “It’s almost dawn, so they should be up anyway. Farm work,
    you know.”


    # THTEEN


    Nathan didn’t think he could take one more step. He’d been walking for over hour,
    Alisha in his arms. She was still asleep and that worried him. But he held her
    so tightly to his shoulder he could feel her heartbeat against his own.


    At least she was warmer now, her warmth helping him stay focused as he trudged
    through the hills and made it onto the country lane that led up to the front door
    of his childhood home.


    Heaving another grunt as he shifted Alisha in his arms, Nathan whispered in her
    ear. “We’re here. That house right there is my parents’ place. You’ll be okay.
    I promise.”


    Stopping as the house came into view, Nathan’s body surged with a homesick longing.
    How he’d missed his family. Why had he stayed away so long?


    Memories reminded him of why he’d run like a coward and never looked back. He
    couldn’t bear the burden of his family’s grief, a grief that he felt so responsible
    for.


    Alisha moaned in his arms, reminding him of the here and now. He didn’t need to
    be standing here in uncertain fear.


    So he started walking, wondering how he’d explain this but hoping he wouldn’t
    need to. He made it halfway up the drive and stopped again, fatigue dragging him
    down.


    “Maybe this is a bad idea,” Alisha said in a weak whisper. “They don’t approve
    of me.”


    Looking down at her, Nathan couldn’t help but smile. “You got any better ideas?”


    “No.” Her eyes closed again but at least she had woken up. That had to be a good
    sign.


    Nathan said another prayer, thinking he’d caught up on his quota in one long,
    horrible night.

