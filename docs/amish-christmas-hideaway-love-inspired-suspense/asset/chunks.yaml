    Martha gasped and reached out a hand to him. “All this time, they brought me such
    joy and to know they were made by my son. `Denki`, Nathan. That and now knowing
    you’ve been nearby all this time. Another gift to cherish.”


    Nathan held his mother’s hand tight but he didn’t speak.


    Soon, they had the whole story. Amos sat still through all of the chatter. “If
    I may speak,” he said, a gentle tone in his voice.


    “Or course, Amos,” Mrs. Campton said, her smile beaming.


    “I am glad we have our Nathan back. I have prayed toward that end. And I’m happy
    to share our home with all of you today.”


    Judy Campton straightened in her chair. “But?”


    Amos shook his head. “What makes you think I have more to say?”


    “Just a hunch,” Mrs. Campton replied, biding her time.


    “But there is danger out there. We don’t abide by this kind of violence but...
    As my wife has pointed out, `Gott verlosst die Sein nicht.* God doesn’t abandon
    one of his own so I cannot turn away a loved one in need.”


    “But you still want us gone, right?” Nathan said, coming to stand by where Alisha
    sat.


    “It’s not that I want you gone,” Amos replied, his gnarled hand moving down his
    beard. “I am thankful for your return but I want that evil out there gone.”


    “We all do,” Granny replied. “We all do. We have prayed for that and with the
    help of Nathan and the authorities, we hope that will come to pass.”


    Nathan’s gaze touched on Alisha. “We have a new plan and we don’t want to involve
    any of you in it,” he said. “But that’s for another day. Alisha and I need this
    reprieve. It’s been a long time coming.”


    “We can all agree to that,” Amos said, standing. “Martha, `kumm`.”


    Nathan’s mother motioned them to the table. Nathan and Alisha served the coffee
    and passed the food, unusual tasks for a man in an Amish house but Alisha appreciated
    him doing it.


    Soon they were passing gifts. Alisha received some knitted gloves from Martha
    and Nathan was handed a basket full of preserves and jellies.


    “I’ll keep them here for you,” his mother had whispered. “For when you return
    for home-cooked meals with biscuits and bread.”


    “That is a plan, Mamm,” he told her.


    Everyone received a small token and no one complained. Alisha took this simple
    Christmas morning as an example to use when she returned to her life. If that
    day ever came.


    The day passed too soon and while her grandmother and Mrs. Campton were strong
    and spry, they needed their rest. So after the early dinner feast was over, Amos
    offered to take them home before dusk settled.


    “It’s not safe for you,” Bettye said, shaking her head.


    “If it was a trip you were willing to make, then I can certainly do the same,”
    Amos retorted. “I will not even need a disguise.”


    “I’ll come with you,” Nathan offered. “I can wear a hat and coat and no one will
    know it’s me.”


    “Do you think that’s wise?” Martha asked.


    Alisha’s heart went into overdrive. “Nathan, maybe we should get word to Josiah?
    You’re injured and can barely use your left arm.”


    “Josiah said he’d come back if we needed him,” Bettye added. “I have my cell with
    me, just in case.”


    Nathan lowered his head, thinking. “I shouldn’t leave you alone but I don’t want
    Daed going into town by himself.”


    “Then you should go,” Alisha replied. “Josiah knows we’ll use the phone booth
    or Granny’s cell to call Raesha’s work cell if we need him.”


    Nathan took her to the side. “I’d feel better taking them back. My `daed` will
    insist on going so I should go with him. Use the gun I gave you last night if
    anything happens. We should be there and back in less than an hour.”


    In the end, Alisha couldn’t argue with him. She wanted her grandmother and Mrs.
    Campton to get home safely. So she hugged them tight and thanked them for taking
    this risk. Then she stood with Martha and waved goodbye to them, her heart pulled
    in so many different directions, she wasn’t sure she’d ever breathe normally again.


    Nathan had made this happen. In the midst of running for their lives, he’d brought
    her a gift she’d never forget.


    Now she just had to worry about Nathan and his father making it back without any
    problems.


    # SEVENTEEN


    Martha walked up to where Alisha stood by the front window.


    Close to an hour had gone by and the snow was falling again in soft, silent flakes.
    It would be fully dark soon.


    “Here,” Martha said, holding up a cup of tea. “Meadow tea, mostly mint and sugar
    but good for calming us down.”


    “It’s getting late,” Alisha said, taking the tea, her eyes still on the road.
    “Thank you, Mrs. Schrock.”


    “Call me Martha,” the other woman said. “We don’t stand on formality around here.”


    Alisha turned away from the window, the last of the sun’s feeble rays casting
    out in a golden sheen over the snowy yard and woods while the snow clouds hovered,
    waiting for nightfall. “I wanted to thank you for today,” she told Martha. “I
    was so touched by what Nathan did and how you welcomed my grandmother and Mrs.
    Campton into your home.”


