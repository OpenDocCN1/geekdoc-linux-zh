    The next afternoon, Nathan and Alisha sat at the dining table wearing more borrowed
    Amish clothes. Earlier that morning, Alisha had helped his mother with the washing
    machine, which ran with a paddle powered by hand. Martha had shown her how to
    clean their clothes with lye soap. They worked together in the small side room
    off the kitchen, where Alisha and Nathan had taken turns freshening up.


    This room was used for laundry, bathing and as a mudroom—clothes hanging on a
    stringed line to dry over a small propane heater along with coats, boots and work
    shoes lined up along the wall underneath the clothing pegs. All neat and tidy
    and simple but with efficient indoor plumbing discreetly hidden behind another
    small enclosure. For which Alisha was eternally grateful.


    While they’d worked, Martha had talked about Nathan growing up here with his younger
    brothers. She even mentioned Hannah a couple of times.


    “`Gut kinder`, but rambunctious,” Martha said, shaking her head. “But Nathan always
    did have a curiosity about life outside of Campton Creek. Wanderlust, I think.
    I prayed he’d come home after his `rumspringa`, but God had other plans for my
    son.”


    Alisha wanted to tell his mother she was so sorry that she’d interfered with those
    plans. He might have returned home if she hadn’t become his forbidden sweetheart.


    But before she could voice that, Martha turned to her and gave her a hesitant
    smile. “It wasn’t his fault, you understand. And it wasn’t your fault, either.
    You both left because of a terrible thing. I think God has used this current horrible
    tragedy to bring you both home.”


    Logic told Alisha she’d been in the wrong place at the wrong time when she’d pulled
    into that little Christmas market. That two people possibly involved with criminals
    had lost their lives and she happened to be the only person around to witness
    that. But here, in the quiet of this kitchen, another kind of logic took over.
    Had she been exactly where she should have been the other night?


    Martha’s eyes met hers. “You don’t seem so sure about what I’ve said.”


    “I want to be sure,” Alisha admitted, “but if God wants to bring us together,
    why does it have to be in such a violent way? With evil men murdering people,
    chasing us and threatening everyone we love?”


    “Hmm, seems that happened in the Bible a few times, ain’t so?” Martha let that
    observation hang in the air and then went back to her work, her deft hand holding
    Nathan’s shirt against a scrub board.


    “Good point.” Alisha hung the dress she’d worn yesterday on the line and watched
    to make sure it wouldn’t drip everywhere.


    “Time will show us why, Alisha,” Martha replied, her tone firm and calm. She carefully
    helped to hang the rest of their wet clothes on the taut line stretched across
    the mudroom. “But I believe that sometimes, we have to walk through the fire to
    find the calm we seek. Think about it. If you both survive this, you can survive
    anything, and your feelings will be stronger than ever. If that is `Gott`’s will.”


    “And what if someone else loses their life?”


    “God’s will always stands—and we must accept that no matter the pain.”


    Now, sitting here wearing a clean dress and apron, her hair pulled back in a ponytail
    and covered with a white `kapp`, Alisha marveled at how Nathan’s parents had allowed
    them to stay. She felt secure inside these sturdy walls, cocooned by the snow
    outside. Their forgiveness now was in sharp contrast to what she remembered that
    awful summer way back. This home was roomy and simple, but full of God’s grace.
    Why had it taken so long for Nathan to come back? Did time heal all wounds?


    *He might not have returned, if not for you*.


    Martha had been convinced of that. Alisha had to consider being here a blessing
    at least. No matter the circumstances, Nathan was back in the house he’d loved.
    She hoped that would bring him a time of healing. She didn’t expect he’d return
    to the Amish, but if he could still visit with his family and be a part of their
    lives, it could all be worth it.


    Alisha looked around, marveling at the simplistic beauty of the place. “It’s Christmas
    Eve,” she blurted, her gaze lifting toward Nathan. “I’d almost forgotten.”


    “Yes, it is.” He gave her a smile. “We get to spend it here together.”


    His gentle words made her blush but she couldn’t give in to all these erratic
    impulses she’d been holding so close. So she glanced around the room instead,
    searching for signs of the holiday.


    The kitchen was sparse and neat, with a huge table that had to have been handmade
    years ago, along with matching high-backed chairs. A deep farmhouse sink held
    a pump for drawing water and a refrigerator that ran on propane sat full of prepared
    dishes for tomorrow. Alisha had offered to sweep the floor after dinner but Martha
    had shooed her away.


    “I do that every morning to start the day fresh. You can do it tomorrow morning
    if you wish.”


    The home held bits of Christmas, but no tree or lights. Christmas cards from family
    and friends, most of them handmade, lined the wooden ridge of a big, practical
    sideboard across from the table. It held three freshly baked pies—pecan, sweet
    potato and apple—and two different cakes—a coconut layer cake and a pound cake
    that had been made from exactly a pound of each ingredient. Tomorrow, they would
    have a big meal of baked turkey, mashed potatoes, vegetable casseroles and all
    sorts of other side dishes.


    “After devotionals and exchanging simple presents, we’ll share the meal,” Nathan
    had told her earlier. “If Christmas had been one day earlier, we’d have gone to
    church.”


    Alisha longed to see her grandmother, but today they were trying to map out their
    next move. “I should be there with Granny and Mrs. Campton,” she whispered to
    Nathan. “I’ve waited all year to spend the holidays with them. It was the only
    gift my grandmother wanted.” Shrugging, she added, “It’s the only gift I want
    this year, too.”


    He stared over at her, both of them mindful of his mother puttering in the kitchen
    and his father sitting in his rocker reading an Amish newspaper. Alisha could
    tell being here had helped Nathan so much. She didn’t want to mess with that.


    “I’m sorry,” he said, his hand touching hers in a brief brush. “If I could make
    this all go away, that would be my gift to you.”


    “Your parents have been more than kind to me,” she said, “so I don’t mean to sound
    ungrateful. I just wish—”


    “We both have our wishes,” he said, his eyes going a dark blue that reminded her
    of a deep lake. “I’m going to get you back to your grandmother soon.”


    Since phone service was sketchy, and because they wanted to honor the rules of
    the house, they didn’t use their phones to work. Their laptops were still at the
    cabin, she hoped. She missed her big briefcase with the shoulder straps. Her shield,
    her work companion. Nothing to be done about now, though. Instead, they put together
    on paper a timeline of events based on the research they’d done already.


    “The doctor had some major debts to pay,” Nathan whispered. “The cars, the homes
    and too many charge cards. All a facade.”


    “That is a great motive to start selling opioids illegally,” Alisha replied. “And
    to get in your head with some nasty people. But the money had to be enticing.”


    “Yes, from what weve pieced together, I think he owed them money or drugs maybe,
    and when he couldn’t pay up, they decided to off him and his wife.”


    Alisha stared at the timeline. “But that won’t get these people their money back.”


    “No, but they could easily find a way to break into his offshore accounts if there’s
    any money left in them.”


    Jotting a note to find out about those possible accounts, she asked, “But how
    do we nail Deke Garrison for this? The man is like a ghost. Nowhere to be found.”


    “He’s hiding,” Nathan said. “The hit was completed but you saw the whole thing.
    He’ll kill his own men because they keep messing up. You got away over and over.”


    “Thanks to you,” she said, her words low.

