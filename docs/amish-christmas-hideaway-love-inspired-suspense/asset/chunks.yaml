    Bryce shook his head even as Officer Dylan Fitzgerald spun the wheel and turned
    in to the parking lot of the old mill. The headlights cast two strips of light
    onto the building, and he shivered. It was as spooky as he remembered from his
    teen years. Wipers battled the snow falling, and Bryce thought thought they were
    having a harder time of clearing the windshield than they had just ten minutes
    ago.


    From his seat, he peered at the mill. The place should have been demolished years
    ago. However, the historical society members had screeched at the top of their
    lungs about wanting to have the building placed on the registry for historical
    landmarks. He had no idea whether they’d done that or not, and frankly, didn’t
    care. At the moment, his only concern was the fact that his former friend, Jade
    Hollis, had called for backup. Former friend? No, she’d been more. Much more.
    Only he’d discovered it too late to do anything about it. Two weeks before he’d
    deployed overseas, he’d gone to tell his sister goodbye at her college. Jade had
    been Kristy’s roommate and her grandmother had passed away that day. He’d found
    her crying, meant to comfort her and had wound up sharing one unintentional night
    they both regretted the next morning. But it was then he’d realized just how much
    Jade meant to him. Too late. “Is she all right?” he asked, reaching for the door
    handle and shoving aside the memories.


    “I’m going to find out,” Dylan said. He pointed at Bryce. “You stay put.”


    “We’ve been over this. I’ve got training. I can handle myself.” Bryce had signed
    a waiver absolving the department of any harm he might come to, so instead of
    arguing, Dylan rolled his eyes.


    “Then bring that flashlight. We might need it,” the man said.


    Bryce grabbed the light and followed Dylan to the door just as a noise from the
    end of the building caught his attention. A figure dove out of a broken window,
    rolled to his feet and sprinted into the wooded area behind the mill.


    “You see that?” Bryce asked.


    “I did.” He took off after the person. “Check on Jade! And watch your back!”


    Bryce bolted toward the opening and stepped inside, keeping one hand on the weapon
    at his side. He flipped the light on and swept it around the interior. “Jade?”


    “Back here.” Her voice reached him, sounding weak, shaky.


    He hurried to her, keeping an eye on the surrounding area in case the person who’d
    run had company. Bryce rounded the end of the spindle row to see Jade on the floor,
    holding her head. Blood smeared a short path down her cheek. “You’re hurt!” For
    a moment, she simply stared up at him, complete shock written across her features.
    “Jade? Hello?” He waved a hand in front of her eyes.


    She blinked. “Bryce?”


    “Hi.” He glanced over his shoulder, then swung the beam of the flashlight over
    the rest of the interior. When he didn’t see anyone else, he focused back on Jade.
    The shock hadn’t faded.


    “You’re here?”


    “Yeah. This wasn’t exactly the way I wanted to let you know I was coming home,
    but—”


    “What are you doing here?”


    “Can we discuss that later? Let’s focus on you and the fact you’re bleeding from
    a head wound.”


    “I... I’m all right. It was a glancing blow, but it made me see stars for a few
    seconds.”


    “Did you get a look at who it was?”


    “No. I thought you were in Afghanistan. Or dead. Or something.”


    “Nope. None of the above.” He paused. “Well, the ‘or something’ might be accurate.”
    He could understand her shock. It had been six years since they’d seen each other—and
    that hadn’t gone exactly well. “Anyone else here?”


    “I don’t think so.”


    A car door slammed. Blue lights whirled through the broken windows and bounced
    off the concrete-and-brick walls. Bryce helped her to her feet. “Let’s get that
    head looked at.”


    “Wait.” He could see her pulling herself together, the shock of his appearance
    fading. “I need to take a look at something.”


    He frowned. “Okay.” She slipped away from him and went to the old trunk next to
    the wall. He stayed with her, and when she went still, he let his gaze follow
    hers. “What is it?”


    “The person who hit me was very interested in whatever was over here.”


    Bryce nodded to the shovel and disturbed dirt in front of the trunk. “Looks like
    he was trying to dig something up.” Footsteps sounded behind them and Bryce whirled,
    pulling his weapon and aiming the flashlight.


    “It’s just me,” Dylan said, raising his hands and turning his head from the full
    force of the light. When Bryce lowered the gun, Dylan swiped an arm across his
    forehead and blew out a breath that was visible in the beam.


    Bryce slid the weapon into his shoulder holster. “You catch him?”


    “Afraid not. He had too much of a head start.” Dylan stepped forward, brows together
    over the bridge of his nose. “You okay, Jade?”


    “I’m fine.” Her low voice pulled Bryce’s attention back to her. With the shovel,
    she’d moved dirt from in front of the trunk. “What does this look like to you?”


    “Looks like someone’s been digging.”


    “Yes, but why? What could they possibly be looking for out here?”


    “Who knows?” Bryce studied the pile of dirt and the bricks. “Actually, I don’t
    think they were looking for anything. I think they were in the middle of `burying`
    something.”

