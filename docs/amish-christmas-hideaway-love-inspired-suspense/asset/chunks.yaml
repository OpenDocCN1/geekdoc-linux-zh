    她正在躲避杀手的追杀……


    她能在阿米士地区找到避风港吗？


    当莉莎·布克斯顿（Alisha Braxton）目睹了一场双人杀时，一个欢快的夜晚很快变成了假日的噩梦。杀手冰冷的眼神预示着她是下一个目标。莉莎唯一托付生命的人是私家侦探内森·克雷格（Nathan
    Craig），那个她曾经爱过的男人。但在阿米士地区躲避时，他们能否智胜那个决心要让她活不过这个圣诞节的杀手呢？


    “求你带我离开这里……拜。”


    莉莎的汽车距离一个看起来像深渊的巨大落差只有几英寸之遥。


    “我抓住你了，”内森说，“快，抓住我的手。”


    她点了点头。“我的包。”


    “好的，拿过来。但要小心。”


    她拎起那个看起来公事风的大皮包，递给他。


    “慢慢向我转过来，好吗？”


    她点了点头，汽车随着她的动作摇晃着，在旧树干上又滑动了几英寸。


    内森屏住了呼吸。那根旧树桩支撑不了多久了。


    “数到三，”他说，“一，二……三。”


    他用力将她拉了起来，然后将她拉离了正在剧烈摇晃的汽车。随着一声呻吟，汽车的前右保险杠擦在岩石上，然后滑过深渊边缘，重重地坠入下方。


    金属破碎的声音在山丘上回荡。


    “你还好吗？”


    莉莎吐出一口长长的、颤抖的息气。“如果你没来，我可能就死了……”


    `Lenora Worth` 出版了 70 多本书，印数量数百万，专门撰写屡获殊荣的浪漫小说和浪漫悬疑小说。她有三本书进入了 ACFW Carol 奖决赛，她的灵感浪漫悬疑小说
    `Body of Evidence` 曾成为《纽约时报》畅销书。她在`Mistletoe Kisses`中的短篇小说让她成为了《美国今日周》畅销书作家。莉诺拉经常和退休的丈夫唐（Don）一起去冒险，并喜欢阅读、烘焙和购物……尤其是买鞋。


    ### Lenora Worth 的著作


