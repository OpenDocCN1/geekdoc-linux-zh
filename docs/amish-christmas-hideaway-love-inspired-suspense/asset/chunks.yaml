    “Such as?”


    “Such as—they know who’s after us but they can’t say it out loud. They’re setting
    us up as part of a sting. If they mess this up, they’ll have me to deal with.”


    “Why would they let us go to Mitchell’s place if they’re setting us up?” Alisha
    asked.


    “Maybe he’s in on it,” Nathan replied. “He seems to keep his cards close to his
    vest.”


    “Nathan, we’ve got to trust someone.”


    “Like we did last night?”


    “These people are relentless,” she replied, her tone beyond weary. “If they find
    us at Mitchell’s house, well, then I’ll be ready to discuss moving permanently
    to an undisclosed location.”


    “Not if they kill you, Alisha.”


    * * *


    Later, Alisha stood in the middle of the big bedroom where Mitchell’s maid had
    placed her. “Mrs. Henderson suggested some clothes for you,” the dark-haired maid
    explained with a practiced smile. “Dinner is at six.”


    “You’ll have to thank Mrs. Henderson for me,” Alisha said, thinking that had to
    mean dressing for dinner. But why? She wasn’t here to socialize. Remembering Nathan’s
    chilling words to her earlier, Alisha wondered where she’d go from here.


    Her silent prayers held her in place. *Lord, let this end in a good way, with
    justice for those who have died and punishment for those who are evil.*


    “Mrs. Henderson is out of town,” the maid replied, bringing her out of her prayers.
    “She sends her regrets but she did instruct me to loan you some clothes.”


    Funny, Mitchell hadn’t mentioned that but Alisha was glad she wouldn’t have to
    indulge Miriam Henderson with idle chit-chat. Miriam was a kind, caring person
    who lived in her own little bubble of luxury and extravagance. But she’d always
    been polite to Alisha the few times they’d been at social events.


    After the prim maid indicated the closet, Alisha checked and found a couple of
    wool dresses and some pants and sweaters. She and Miriam were close to the same
    size. Still, it felt strange to wear these obviously expensive clothes while hiding
    out.


    No matter, she was here now and Nathan was down the hallway. Agent Fenwick had
    been put in a room between them. Strategy, or to keep her eye on both of them?


    Alisha didn’t want to delve into that. Nathan was safe and they had an experienced
    FBI agent on the premises. The Henderson estate had Campton House beat on state-of-the-art
    security. Gated and back off the street, the big house loomed dark and ominous
    in the middle of a huge acreage of snow-covered woods.


    After going over her notes again, she left her room to go down to dinner. But
    her appetite disappeared underneath the weight of this stress. Soon it would be
    a new year. What did that year hold for her?


    Nathan called after her. “Alisha?”


    She whirled at the top of the spiraling staircase. “Do you have a tracker on me?”


    He shook his head. “I heard a door opening.”


    “Have you seen Fenwick?”


    “I’m right behind you,” came the edgy feminine voice.


    “Do *you* have a tracker on us?” Nathan asked, repeating Alisha’s question.


    “Should I?” the agent asked, still wearing her dark suit.


    “Is it just me, or is this weird?” Alisha asked. “I’ve been here many times but
    this feels different. The house is so empty.”


    Fenwick lifted her eyebrows. “Yes, your boss seems to be thriving here alone and
    with a skeleton staff. I’m sure he figures the fewer people involved, the better
    for you.”


    “He’s very dedicated to his associates,” Alisha said in Mitchell’s defense. “His
    wife Miriam is out of town. She tends to travel a lot.”


    “I tend to agree with you there,” Agent Fenwick said, her tone and expression
    neutral. “I did my research on both of them. He’s insistent, I’ll give him that.
    His concern for you is touching.”


    “Why did you agree to this?” Nathan asked, obviously still suspicious.


    “I have my reasons, one being I don’t want you two out there on some vigilante
    mission,” Fenwick replied, her expression completely blank.


    “And you aren’t going to share any other reasons with us?” Alisha asked, her gaze
    meeting Nathan’s.


    “Need-to-know basis,” the agent said as they came to the bottom of the stairs.
    “Which way is dinner?”


    Nathan gave Alisha a warning glance while she led the way to the huge formal dining
    room. Mitchell was waiting before the roaring fire near the long table. Four places
    had been set at the end near the fire. Cozy in spite of the opulent scale of the
    room. Alisha couldn’t stop the shivers going down her spine, however. She wanted
    things to be normal again.


    “Sorry we can’t open the curtains,” he said in greeting. “Best to keep the house
    closed up.”'
