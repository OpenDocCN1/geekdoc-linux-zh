    a motel out on the main highway and the police put two plainclothes officers nearby
    to see who shows. So we’ll see if they go looking there first.”


    Alisha wondered if someone had seen them leaving the estate, but they’d circled
    back by the creek and crossed over the main covered bridge so it would look like
    they were walking from a nearby farm. The late hour would be questioned, but if
    stopped they’d had the excuse of visiting into the night with a sick relative.


    “Why did you tell me to run to your father’s house if something happened?” she
    asked, remembering his words from before.


    “It’s the closest one to this cabin,” he explained when he brought over two cups
    of dark, rich coffee. “Just through the woods, about a half mile beyond the cabin.
    A narrow path but there. Look for the birdhouses.”


    He’d always loved building birdhouses. She still had one he’d made for her, a
    small white house with blue shutters and flowers painted on the sides. He told
    her a bluebird would live there when they built their house in the woods.


    Alisha sat down on the cold leather couch, wanting to know everything about him.
    “Why did you change your name?”


    He placed his coffee mug on the table by the side chair and turned to get a fire
    going. “Craig is my professional name,” he said while he gathered kindling and
    found matches on the mantel. “I took a professional name to protect my family.
    I didn’t want any of my findings to fall back on them.”


    “Ah, because sometimes you take on cases such as this one. Dangerous.”


    “Yes.” He studied the growing fire and, satisfied, dusted off his hands and then
    sat down across from her. “I’ve brought them enough grief without having someone
    trying to get to me through them.”


    “And yet, you built a home nearby and told me to run to them.”


    “This is an unusual circumstance. I hope it won’t come to that.”


    “Because it involves murder or because it involves me?”


    “Both.”


    Alisha wasn’t sure how to respond to his admission. The fire crackled in the quiet,
    its warmth reaching out to her shivering bones. “I won’t say what I’m thinking.”


    Nathan put down his coffee cup and leaned forward. “I know what you’re thinking.
    You tend to blame yourself for a lot that happens in life.”


    She couldn’t deny that. “Yes, I guess I do. Being an only child can sure put a
    tremendous pressure on a person. Perfection is hard to achieve and so...guilt
    takes over.”


    “So you and your parents still don’t see eye-to-eye?”


    “No. My dad is mad that I didn’t join his law firm right away and my mom is so
    involved in her teaching and research, she tends to forget I exist. I think I’m
    one big letdown.”


    “Your parents are stupid.”


    She burst out laughing at that. “Well, that or too intelligent for their own good.”


    “Sometimes intelligent people are the stupidest.”


    “Duly noted.” She finished her coffee. “Let’s talk about what we know so far on
    this case.”


    “So you’re not ready to discuss all of our flaws and dysfunctions?”


    She wanted to question him about so many things but Nathan would get the wrong
    idea and peg her as nosy. “No, are you?”


    “Not in the least. Not right now, anyway.” He grabbed the small leather overnight
    bag he’d brought with him. “I have written notes and I’ve saved some things on
    my laptop.”


    “Do we have Wi-Fi?”


    He pulled out a heavy oval gadget. “Wireless hotspot. It’s charged to last thirty-six
    hours and there’s a tower about ten miles away.”


    “Always this prepared?”


    “It’s how I roll,” he quipped. “I wind up in some sketchy places at times. But
    I’ve managed to get some solid information regarding this case. I have the police
    report.”


    “I’m not going to ask how you obtained that so quickly.”


    “Good, because I won’t tell you who helped me.”


    “I’ve had my people digging, too.” She reached for the briefcase she’d insisted
    on carrying underneath her cloak. “I printed mine out before we left.”'
