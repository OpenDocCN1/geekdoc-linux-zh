    face pale. “Bryce?”


    “That looks like Frank’s jersey.”


    Jade dropped beside him and squinted. She reached in, snagged the shirt and pulled
    it from the dirt. The Panthers jersey was achingly familiar. “Well, he has one
    like this, but so do a lot of other people. Doesn’t mean it’s his.” Number nine.
    Frank’s favorite kicker.


    “Look at the left sleeve,” Bryce said, his voice low and tight. “Frank’s was autographed.”


    She inspected the sleeve and bit her lip. “Yeah, it’s autographed.”


    “Then it’s his.”


    She turned it over and sucked in hard. “No. Oh no.”


    “What?”


    She swallowed. “Holes.”


    “What kind of holes?” Bryce narrowed his eyes and drew back.


    “Bullet holes, I think,” she croaked. “Two of them. In the chest. And...” Her
    tight throat wouldn’t allow any more words to pass.


    “And?” Dylan and Bryce nearly shouted the words as one voice.


    “And,” she said, “the front is soaked in blood. It’s dry, but it’s blood.”


