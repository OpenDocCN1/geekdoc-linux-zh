    “Smart. We can compare notes.” Then he asked, “Have you explained all of this
    to your firm?”


    “Yes. I didn’t want my boss to hear about my involvement on the evening news or
    worry that I’d gone missing. I called the main office and talked to him and then
    asked for an investigator there to help with some online searches.”


    Remembering Mitchell Henderson’s concern, Alisha knew the senior partner would
    stand by by her. “You keep us posted,” he’d said during their conversation. “These
    people need to be stopped.”


    He’d questioned her in his lawyerly way, asking for details on the shooter. She
    gave him what she knew which, beyond a description, wasn’t too much.


    “Do you trust the people you work with to keep this quiet? They can’t reveal where
    you are.”


    “Of course.” Telling Nathan about her conversation with `Mitchell Henderson`,
    she nodded. “Why wouldn’t I trust them? They know this is a bad situation.”


    “Because whoever is behind this is ruthless and will stop at nothing to get to
    you, including infiltrating your workplace.”


    “Do you think they’ll go after my boss and coworkers?”


    “To get to you, possibly. But since you’ve warned your firm, I hope they’re all
    on the alert.”


    “Knowing Mr. Henderson, I can almost guarantee that. We have a top-notch security
    protocol online and on the premises.”


    “Okay, just needed to check that off my list.”


    “Thanks. Now I can add worrying about adding the dozens of people who work with
    me to `my` list.”


    “Don’t. They’d only take that route as a last resort.”


    He pulled up his phone files while she went through her papers. “So our reporter
    isn’t going to tell us much,” Nathan said. “We can only hold him on trespassing
    but I’m sure he’s lawyered up. We need to find out who his lawyer is, to give
    us a clue.”


    “Like that will happen.”


    Alisha studied the paperwork one of the paralegals had sent her earlier. “Hey,
    I have a list of some of the good doctor’s patients. According to what we’ve found,
    these are some nefarious people who don’t always want to go through proper procedures
    to get their medications.”


    “What kind of medications?”


    “Opioids,” she said, dropping the page she’d been reading. “So a successful doctor
    who has high-powered and high-paying clients and is willing to write them prescriptions
    for whatever they need.”


    Nathan scoffed. “I’d call that a quack.”


    “But a rich one, according to his bank account. Owns property in Philadelphia,
    which we’ve verified, and owns a fancy beach house in the Caymans.”


    “Of course, the Caymans. Offshore money and all of that. Not to mention a wife
    who sells pharmaceuticals.” Rubbing a hand down his face, he said, “Let’s take
    the top five on that list and see what we can find.”


    Alisha got up to find more of the diesel-fuel coffee. She’d be up all night but
    she couldn’t sleep anyway. Searching her briefcase, she found the tin of cookies
    her grandmother had insisted they bring along and carried it back to the tiny
    sitting area. “This new information might explain why the `FBI` is now involved
    in this case. Philadelphia has a huge opioid problem.”


    They quickly zoomed on a woman named `Andrea Sumter`. Nathan read what he’d found.
    “A widowed socialite with money to burn, travels to the Caymans a lot herself,
    plenty of photos of her hanging with the Wests at high-society events. Let’s keep
    her high up on the list.”


    One man on the list was dead. They eliminated two more names. But the last one
    caught Nathan’s attention. “Deke Garrison. Filthy rich. Dirty money. I’ve heard
    his name in certain circles.”


    “Certain bad circles?” she asked, passing the cookie tin.


    Nathan took the tin when she offered it and found an oatmeal cookie. “I’d say.
    You’re the only eyewitness, and if he’s our man the `FBI` might already be on
    this case or they’re just snooping, hoping to capture him at last.”


    “They’ll want me to testify if we find these people and bring them to trial. I’ll
    never forget what happened the other night. Those hit men need to go to jail.”


    “And that’s why you’re in hiding. We’re dealing with dangerous people who’ve already
    found you and tried to take both of us out.”


    She didn’t want to think about what would have happened earlier if her feisty
    grandmother hadn’t taken matters into her own hands. “Let’s see if we can find
    out who else the doctor socialized with. He might have kept his drug-trafficking—if
    that’s what he was doing—hidden from his legit friends. The couple I saw shouted
    rich, entitled and indulgent. Their car, their clothes, their shopping bags said
    it all.”


    “And now they can’t brag to anyone.”


    Alisha shivered and then caught herself.


    Nathan stood. “Are you cold?”


    “No. Just... This is so creepy. I’ve always dealt in helping people and working
    with a lot of business contracts, some divorces and some petty criminals. But
    nothing like this. It’s a horror story.”


    Nathan came and sat down beside her. “Rest,” he said, pulling her into his arms.
    “Just rest.”


    Alisha knew she should protest but being in his arms again took away all of her
    horrible memories of the last few days. She felt secure here in this little cabin
    with Nathan, the fire’s warmth lulling her to relax. But this couldn’t happen.

