    “Here and there. Jealous?”


    “Nope. Just curious.”


    “What about you? Got anyone special in your life?”


    “*That* is *neither* here *nor* there,” she retorted, her tone telling him she
    could be a tad bitter about any love connections.


    He thought of her briefcase and how she carried it like a shield. Same as him,
    she was married to her work. They both wore the armor of indifference to hide
    the brutality of being hurt.


    Back to business. “What else did you find?”


    “Well, they live in an upscale part of the city in a new development. A modern
    condo in a building that went up about eight months ago. Comps sell for a million
    and over.”


    “How did you find out all of this while I slept?”


    “I have my sources, PI Craig, same as you. My firm has been more than willing
    to help. As I said, Mr. Henderson had offered me protection, too.”


    Her firm would have investigators. “Probably not as good as me, though.”


    “They found the information I needed and during a holiday week at that.”


    “Touché,” he said, admiring her determination. “Anything else I need to know?”


    “Mitchell Henderson recognized the West couple, told me he’d been at a fund-raiser
    or two where they’d been top donors. He claims they like to flash their money.”


    She studied the screen and then let out a gasp. “Dr. and Mrs. Joshua West. He
    has a family practice and—this is interesting—she’s a pharmaceutical sales rep,
    which my boss failed to mention. That explains the fancy sports car and all the
    shopping bags.”


    “Those things didn’t save them,” he replied.


    “No, but their lifestyle might have something to do with the way they died. I
    mean, a doctor and a big pharma rep. Are you thinking what I’m thinking?”


    “Illegal drugs? Now who’s not trusting?”


    “Look, we know it had to be a professional hit,” she reminded him. “I’m trying
    to get a report from the crime scene but my connections only go so far.”


    “So *now* you need me around,” he teased, a sense of relief washing over him.
    He needed to be needed to keep from going to that dark place that kept him up
    at night.


    “Yes, now you can make yourself useful.” Her smile softened the edge. “Do what
    you do best—get to the truth.”


    “Is that what I do?” He felt the glow of her praise even if she might be sarcastic.


    “You do.” She nodded and placed her elbows on the desk then cupped her hands together
    to rest her chin on them while she stared over at him. “And for once, I don’t
    care what nefarious methods you use.”


    “I have friends in high places,” he said. “And some in low places. Let me make
    some calls and call in some favors. Maybe we can put our own case file together
    soon.” Then he added, “If you think the FBI will get involved, you must believe
    this wasn’t random.”


    She closed her eyes for a moment. “No. It felt deliberate. Like a professional
    hit.”


    Nathan couldn’t argue with that. “If that’s the case, this could go way beyond
    just protecting you. You’ll be questioned by everyone from Campton Creek police
    to the state police and the Philly police. And probably the DEA.”


    “Yes,” she said. “I’ll tell them everything I witnessed. I just need to get there
    from here.”


    “Yes, because we can only hide you for so long.”


    Giving him that lifted-chin attitude, she said, “I’ll do whatever needs to be
    done to find these killers.”


    “That’s what I thought,” he said with a grim smile.


    She gave him a grim smile back. “Meantime, I’ll go and find us some lunch.”


    “So far, so good,” he replied watching her walk out into the hallway. “Be aware.”


    She turned at the door. “Always.”


    Nathan marveled at her calm nature. But then Alisha had always had a good head
    on her shoulders and a sense for doing the right thing. That’s why she’d walked
    away from him.


    A flash came through the window, causing Nathan to reach for his gun and rush
    to the hallway door. Grabbing her, he said, “Get down.”


    Alisha crouched with him as he guided her into the hallway. Nathan held a hand
    on her back and whispered, “Get in the powder room and lock the door.”


    “My phone—”


    “No time. Now.”'
