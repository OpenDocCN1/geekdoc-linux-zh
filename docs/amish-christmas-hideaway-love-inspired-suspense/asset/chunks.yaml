    things with us. Because believe me, you’re next on the kill list. They don’t want
    you to identify any of their hit men or any of them, and they won’t stop until
    they can silence you permanently.”


    # NINETEEN


    Once they’d given their statements, Alisha described the men she’d seen to a sketch
    artist. When the artist was finished, Alisha nodded her head. “That’s definitely
    the shooter. They called him Ace but he also used the name Adam Baker.”


    Detective Mathers nodded. “That matches what we have on the official report from
    the Campton Creek town police.” He handed the sketch to one of the lab techs,
    obviously leaning toward believing Alisha’s story. “See if we get a match.”


    Agent Fenwick grabbed her notes to go off and work her side of the case—mainly
    trying to figure out if they had enough evidence to bring these criminals to trial.
    But she stopped at the open door. “All of these details will help and we’ll keep
    after the man we’ve moved to a nearby hospital. He doesn’t have a record other
    than an outstanding parking ticket. Does a lot of odd jobs here and there so we
    don’t have an accurate work history. Scott Kemp is an alias. He also goes by Scott
    Kincaid.”


    Alisha’s head came up. “Did you say Kincaid?”


    The agent shut the door and came back to the table. “Yes. Ring a bell?”


    “It sounds familiar,” Alisha said, her gaze hitting on Nathan. “I don’t know.
    Maybe a client?”


    Mitchell Henderson had already left for another appointment so they couldn’t ask
    him. Her boss was good at remembering names. “Scott Kincaid,” she said, shaking
    her head. “I know I’ve heard that name before.”


    Agent Fenwick waited. “Do you know this man, Miss Braxton?”


    Alisha gave her a perplexed stare. “If I knew him, I’d say so. Why do I get the
    impression that I’m being treated like the criminal here?”


    Nathan held up a hand. “Because you ran away, Alisha. You know how this works.
    You stumbled onto their case and things got blown apart. The agent wants to find
    closure, so she’s leaning on you since you didn’t come straight here and put yourself
    in even more danger. But she’s not willing to let us in on exactly who might be
    targeting us. Probably isn’t too happy about the Philly police taking the lead
    on this, either.”


    “We can protect witnesses the same as you, PI Craig. Probably better from what
    we’ve heard. It is, after all, part of what we do.”


    Nathan’s eyes flared with anger. “Oh, I’m counting on it.”


    Alisha stood up, putting a hand between them. “I won’t have you two trying to
    one-up each other on my behalf. I ran because I was scared and confused and I
    wanted to make sure my grandmother was safe. I take full responsibility for not
    being rational but I gave a complete statement to the officers on the scene and
    I stand by that. They told me I could go and even offered me an escort.”


    “They didn’t exactly clear that with the FBI,” the agent pointed out, her eyes
    as dark as her hair while she shot a hostile glance toward Detective Mathers.
    “This whole thing could have been handled differently.”


    “Beginning with you taking responsibility for keeping your clients from getting
    shot,” Nathan pointed out.


    The agent pinned her stern frown back on him. “I have work to do. Since you came
    in so *we* could help protect you, I suggest you let us take you to our safe house
    instead of the place Mr. Craig has booked.”


    Alisha looked at Nathan. “What do you think?”


    Nathan studied the detective and then lifted his gaze to the agent. “You *do*
    have more man power and you *do* want to keep tabs on us, right?”


    “That’s right. No more taking matters into your own hands.”


    “I’ll consider that,” Alisha said. “Right now, I want a hot shower, some food
    and some clean clothes. That is, if I’m free to go.”


    Detective Mathers stood up. “Yes, you can go but we’ll take you to our safe house
    in an unmarked car and we’ll station officers all around. I suggest you don’t
    try to go it alone anymore, understood?”


    “Got it,” Nathan said, taking Alisha by the arm. “Let’s go and get some rest.
    I’ll keep the reservation at the other place. Just in case.”


    Both the detective and the agent gave him a bland lift of their eyebrows. “Don’t
    move her again,” Detective Mathers said.


    After they’d been shoved into the unmarked car, Alisha turned to Nathan. “They
    have you figured out, I see.”


    “I don’t know what you mean.”


    “They know you’ll go all rogue if things aren’t to your liking.”


    “Well, if I don’t agree with how they handle this, yes, I’ll do what I have to
    do.”


    “I trust you,” she admitted. “In fact, I’d say you’re the only person I can trust
    right now.”


    She wanted to say more but she wouldn’t go that far until they had this behind
    them and could have a fresh start.


    That is, if Nathan wanted a fresh start with her.


    * * *


    Late afternoon sunshine moved over what was left of the snow, painting the powdery
    white trees and sidewalks in shades of vanilla and cream. A leftover wreath on
    a street lamp hung in limbo, its faded red bows beating helplessly against the
    wind.


    “It’s strange being back here,” Alisha said as they watched the skyscrapers change
    into row houses and condos.


    Nathan grunted. “I try to avoid cities. Don’t like the crowds.”


    “You could go home,” she said, her tone quiet. “You’ve done more than enough for
    me.”'
