    当两个男人看到她眼中带着调侃的光芒时，他们对视了一眼。“他确实对我有很多诉求，是的。但我对他也有很多要求。我们认识彼此很久了。”


    “我也认识他一段时间了，”她回答道，心里觉得现在已经更了解纳坦了，但她很奇纳坦是否真的对任何人敞开心扉。


    “现在是‘欺负纳坦时间’吗？”他冲她笑着问道。


    “只是试着活跃一下气氛，”卡森反驳道，“就像在玩一场回忆之旅的游戏。”


    “别玩了，”纳坦提议道，“我们需要保持警惕。”


    “有人试图跟上我们吗？”艾丽莎问道，希望自己不要回到现实。挖掘 `Nathan` 的心理活动要有趣有趣得多。


    “目前为止一切正常，”卡森说。`“我没有告诉调查人员以外的任何人我要把你们带去哪里。”`


    `Nathan` 检查了交通状况。“没有车在跟着我们，”他说，“等我们坐在市中心的警察局里时，我就知足了。”


    “我也是一样，”艾丽莎说，“我想把‘亡里逃生’从我的遗愿清单上划掉。”


    `Nathan` 拿起她的手握在手里，目光掠过她。他没有说话，但她知道他一定有同样的感受。


    当他们停止逃跑时，事情会走向何方？那时怎么办？他们还没有时间去审视或探索这种新的常态。肾上腺素会消失吗，让他们后悔当初没有相处如此亲密吗？他会后悔再次和她纠在一起吗？


    `Nathan` 的眼睛迎上她的眼睛，仿佛他也产生了动摇。“你准备好面对下一步了吗？”


    她想告诉他她已经准备好不再隐藏了，不仅是为了躲避那些杀手，她还想停止隐藏自己的心，与这个她无法停止热爱的男人共度余生。


    相反，她说：“我需要这样做，这样我才能继续生活并再次感到安全。是的，我准备好了。”


    他的表情变了，只是细微的转变，瞬间暗淡了，仿佛云层遮住了太阳。随后那种消失消失，取而代之的是な担忧。“我也是。继续生活听起来不错。”


    所以他还没有准备好全投入他们重燃的吸引力中？


    艾丽莎应该感到松了一口气，但她感受到的只有内心深处的隐痛。他只是在等待机会，直到他可以履行职责，寻找正义并再次离开她。


    ***


    所以她想继续她的生活？`Nathan` 想那种生活现在是否会包括他。他们在很短的时间内走了很远，他并不是在想象他们建立的这种亲密关系。但他知道逃亡和时刻保持警觉会干扰一个人的精神。回到正常可能会让她变回那种不惜一切代价回避他的样子。


    而尽管他更想和她在一起。


    “先带我们去警察局。之后我们可以入住我租的地方，”他告诉 `Carson`，并给了路线。“他们在那里认识我，但老板总是很谨慎，不会透露任何信息。等和警察谈完后，我们可以换衣服并洗洗脸。”


    当 `Carson` 穿行在车流中，他的手机响了。“州警察。”他接了起来，希望是好消息。“`Nathan Craig`。”


    `Nathan` 看着 `Carson` 沿着另一条小路通向 `Belmont Avenue`，然后转入 `Philadelphia police department`
    的方向。


    “我不想带来坏消息，`Craig`，”电话那头的警官说，“但那个闯入你家族财产的男人今天早上手术期间去世了。`Joe Watson`——职业罪犯，与宾夕法尼亚州的几名涉嫌毒品贩子有关。主要是阿片类药物，但在毒品运送者的地位很低。”


    `Nathan` 深吸了一口气。“所以我们没有从他那里得到任何东西？”


    “他没醒过来。”


    `Nathan` 感谢警官的报告，然后告诉 `Alisha` 和 `Carson`。“一个守口如瓶，一个死了。”


    艾丽莎颤抖了一下。“那些马马救了我们的命，但我希望我们能审问过他。”


    “是啊，继续吧，”在 `Carson` 停好车后回答道，“我们要进入一个全新的领域了。我知道你可以应付任何 `LEO`（执法人员）。但我会在你身边。”


    她点了点头。“如果一切按计划进行，`Mitchell Henderson` 应该在这里等我们。”


    “那我们就做该做的事吧，”他说，希望自己知道她真实的感受。但像他一样，`Alisha` 也习惯于把最深处的想法藏在心里。


    他们走进警察局，`Carson` 充当保镖，依然穿着他们的阿米派衣服。


    `Nathan` 只希望计策成功了。现在除了寻找失踪人员，他还有更重要的事情要处理。保护他一生中最深爱的女人。他只希望她会同意那个计划。


    一旦进入房间，他们就保持沉默。空气中弥漫着他们共同秘密的重量。`Nathan` 看着 `Alisha`，然后看着 `Carson`。


    “我们需要动作快，”`Nathan` 低声说，声音很轻，“我们留得越久，他们发现我们的可能性就越大。”


    `Alisha` 点头，尽管疲惫但意志坚定。“我准备好了。告诉我们需要做什么。”


