    face Nathan. “How are you, son?”


    Nathan’s eyes pricked with a wet sheen, whether from the cold air or the kindness
    in his father’s quiet question.


    “I’ve had better times, Daed. I can’t let anything happen to Alisha.”


    Amos rubbed a hand down his beard. “So you still to this day have feelings for
    this woman?”


    “I’ll always have feelings for her,” Nathan admitted. “We might have been wrong
    for each other but... I can’t forget her. And when she needed me, I had to go
    to her.”


    “So she *did* get you involved in this?”


    Nathan looked for the condemnation in his father’s stormy eyes, but was surprised
    and relieved to find none. “She witnessed a horrible murder and then they came
    after her to silence what she saw. Tried to run her off the road.”


    Amos nodded. “We heard two officers were in a bad accident near Green Mountain.
    Does that have something to do with her?”


    “They were following her to make sure she got here safely.”


    “And someone caused their accident?”


    “Yes.” Nathan stared at the house, the cold settling over him as the wind picked
    up. “She witnessed that, too. She called me out of desperation, Daed. I couldn’t
    say no.”


    Amos dusted his hands and turned toward the barn. His frown didn’t show much but
    his eyes had softened. “That must have been a terrible burden for her to bear.
    I can see why she’d call someone she trusts.”


    Floored, Nathan could only nod. “I suppose so.”


    Did Alisha trust him? She’d come here under duress and because she was terrified.
    But he knew she could bolt and try to outrun these people on her own to protect
    his family and hers.


    Once they reached the big double doors, Amos glanced around. “I’m sorry I was
    harsh earlier but seeing you at our door was both a joy and a shock. Your *mamm*
    is right, though. I can’t turn away a family member in need. What is your plan?”


    “I’m making that up as I go,” Nathan admitted, accepting his father’s apology
    as a victory. “If I can keep her hidden until we figure out who’s coming after
    us, then we can put them away and she’ll be able to testify in a court of law
    as to what she saw that night. I can’t believe she managed to get here safely
    after they came after her so fast.”


    “But she brought harm on her *grossmammi* and Mrs. Campton.”


    “She needed a safe haven. They didn’t question that. We have security at the Campton
    Center day and night and officers on patrol there. We also put out the word that
    we were headed back to Reading, but unfortunately, that didn’t fool them.”


    “Reading?”


    “She works for a law firm there that also has offices in Philadelphia.”


    “Where do you live?”


    Nathan thought about his secluded little cabin. As far as he knew, his family
    wasn’t aware it belonged to him. “I travel a lot and stay in rented apartments
    or hotels.”


    “That is no way to live.”


    “It’s the only way I know.”


    Amos waited for him to enter the barn. “But you are home now, son. And for that,
    I am thankful.”


    Nathan let out a breath he’d been holding for over a decade. “Does that mean I’m
    forgiven for leaving?”


    “There is nothing to forgive. God will see us through.”


    “But you were so angry—”


    Amos held up a hand. “I was angry about a lot of things but I’ve had many days
    and nights to think about my actions since then. That was a bad time for all of
    us, but we accept it as God’s will. I should not have taken out my anger on you.”


    Nathan wanted to ask his father about Hannah. Did he ever wonder why this terrible
    thing had to happen to one so innocent? Did he believe that what happened to her
    was God’s will? But he held off on that. He wouldn’t upset his father after such
    an honest talk. He’d do what his father had suggested. He’d accept things for
    now because he had to keep Alisha alive so they could get these people put away
    for a long time.


    After that, Nathan would become that nomad again, wandering and always on the
    move. But he didn’t think he’d ever be able to chase his pain away.


    * * *


    Alisha looked into Martha Schrock’s eyes and wished she could figure out what
    Nathan’s mother truly thought about her. “What would you like to discuss?” she
    asked, cutting to the chase.


    “You’ve been through a terrible ordeal,” Martha said, shaking her head. “To witness
    something so horrible. What a shock for you.”


    Surprised at the compassion in Martha’s blue eyes, Alisha bobbed her head. “It
    happened so quickly and then I had to go into hiding when they came after me.
    But I was concerned for my grandmother and Miss Judy. So we went on the run again
    and then they came again. I think the shock caught up with me.”


    “More than shock,” Martha replied as she got up to stir the good-smelling soup.
    “You almost froze to death. Nathan was right to bring you here.”


    “But now, we’ve put you in danger—if those men find us.”


    “I’m not worried about that,” Martha replied, her hand touching Alisha’s arm.
    “I am more concerned about my son.”


    “You’re worried about Nathan?”


    “*Ja*.” Martha moved her hand away but her smile was brief and soft. “He’s been
    through some terrible things, too. I know he left because he blamed himself for
    our little Hannah’s disappearance and...death. He and his father said things in
    anger that night that they both need to ask forgiveness for.”


    Thinking about what Nathan had also said to her, Alisha lowered her head. They
    were way past that now. “He wants to do that, I think. He told me he had unfinished
    business here with both of you.”


    “And yet, he brought *you* here.”


    “Do you resent that?”


    “It’s not my place to resent anything,” Martha replied. “What I’m trying to say,
    what you need to see, is that he brought you here to help with that unfinished
    business. He wants to resolve things with us but he also wants to resolve things
    with you.”


    “He’s trying to save my life. That’s all,” Alisha said, not wanting Nathan’s mother
    to misunderstand. “Once I’m safe, Nathan will take off again.”


    Compassion lightened Martha’s eyes. “Is that what my son does, takes off?”


    Alisha wanted to be honest and Nathan’s mom had a way of bringing out the honesty
    in people. “He’s been running for over a decade now. He thinks he’ll find all
    of the lost people in the world.”


    “He might,” Martha said, her whisper so low Alisha barely heard it. “But then,
    he might not. Sometimes, they are found but...they are in the hands of God.”


    Wanting to bring Martha some comfort, Alisha said, “But sometimes Nathan finds
    them alive and reunites them with the people they love. That’s important to him.
    It’s his calling.”


    “So his calling keeps him from coming home to us?”


    “No, his guilt takes care of that. He left all of us behind when he left Campton
    Creek.”


    “You still care for my son?”


    Alisha wasn’t ready to answer that. But she did nod. Then she said, “I’ll always
    care for Nathan.”


    *Now more than ever.*


    “I had to walk away because he couldn’t stay,” she admitted. “He couldn’t stay
    with me and he couldn’t come home. He’s become a wanderer, a nomad without a permanent
    home. He can’t move past what happened that night.”


    “But God sometimes moves those who can’t find their own way,” Martha said, tears
    misting in her eyes. “Nathan left us because of you and because of Hannah. Now,
    he has come home to us—for you and I think to find some peace with his sister’s
    death. So despite what brought you both here, I pray he can let go of the pain
    and guilt of her death and just rest. Saving you from harm might actually bring
    my son his salvation.”


    # FIFTEEN'
