    “You did the only thing you could do—you got away. It was probably too late for
    the one who died at the scene and hopefully, the other one won’t die.”


    He didn’t want her to meet that same fate.


    “That will be in the news, too. His poor family. To lose him at Christmas. Maybe
    I should have gone back to Reading.”


    “No.” Nathan couldn’t tell her that he was glad to see her, glad to help her.
    “No. You need to be with family right now.”


    She nodded, her head down.


    “Tell me what you saw tonight,” he said in a gentler tone, wishing he could touch
    her, hold her and make her feel better.


    But that would be the worst idea he’d ever had and he’d had a few bad ones at
    times.


    She nodded and started speaking, her voice strained and weary. Once she’d finished,
    Nathan couldn’t stop himself. He reached over and took her hand. This reeked of
    a professional hit. But he wouldn’t tell her that until he did some digging.


    “You’ll be safe at `Campton` for now.”


    She stared down at his hand and then pulled hers away. “Of course. It’s solid.”


    “What exactly does that mean?”


    “That means we’ll be spending together,” he replied with a soft smile. “Because
    I’ll staying there until we find these killers.”


    # THREE


    Oh, no,” Alisha replied, the shock of his statement overtaking her body. “That
    is not going to happen.”


    “It’s happening,” he retorted as he took all the back roads she’d planned on taking.
    “I’m not leaving you alone.”


    “I’ll be alone. I have my grandmother and `Campton`.”


    “Right. Two elderly ladies who have to use elevator to get downstairs.”


    He had a point but Alisha wasn’t ready to concede. “And good security system.”


    “That helps but we both know a criminal can work around.”


    Right. But Alisha wasn’t to let him hang around. Yes, she’d called him in a moment
    of panic but reason was taking over. “I’m not willing to wait and see if happens.
    Are you?”


    She shook her head. “No. I have a week before I go back to `Reading` the day after
    Christmas.”


    “Call your boss and make that two weeks. Just until the New Year.”


    “I can’t do that.”


    “Yes, you can. Explain the situation. Take some vacation.”


    “I’ll take the time allotted and I’ll use that time to track these killers. You
    do realize Christmas is not the time to work, right?”


    “Yes. But watching gunman shoot up market five days before the holidays kind of
    puts a damper on things.”


    “Are you going to tell the ladies the truth?


    I have to,” she said, hating the idea. “They need to be warned so they can be
    aware.”


    “And they need protection. Maybe I should stay somewhere else. No, this is the
    best plan for now. But Alisha, I’m going to stay there with all of you whether
    you like it not. I know the place has a couple of extra bedrooms in the main house.
    I’ll bunk in one of those. Bad idea. So why did she feel safer, just knowing he’d
    nearby?


    Because she was frightened, shaken and... She’d need his help. Nathan `Craig`
    was good at his job and he could go where others didn’t dare. He found people.
    Good people. Scared people. Lost people. And sometimes the worst of people.


    “I can see those wheels turning inside your head,” he said when she didn’t retort
    away. “What are you thinking?


    She twisted to stare at him as they turned onto `Creek Road`. I’t have much of
    a choice. I need you—I mean I need your experience and expertise. Her head told
    her to be logical, while her heart shouted that she did need him, too. She’d always
    needed him. But she’d been fighting that need since she first met him the summer
    after her senior year. Funny, how he’d been on the fringes of her life for most
    of her life. Around but always out of reach. Once, they’d been close. Teenage
    sweethearts. But they were both adults now. Professional and on a case. Nothing
    more. Because neither one of them had anything to give. Tonight, he’d saved her.
    Alisha couldn’t forget that.


    “Don’t worry,” he said in a tight tone, as if he knew exactly what she was thinking.
    “I’ll stay out of your way. I’ll have plenty to keep me busy.”


    Justice. The man always wanted justice.


    Well, so did she, but she sure hadn’t planned on getting it with Nathan’s help.
    She didn’t want to spend her holidays chasing after a killer, but her instincts
    told her the murderers would keep chasing after her.


    “I’ll be busy, too,” she said. “I just want this over.


    “Are you referring to this murder investigation or being forced to keep me around?


    “Both,” she admitted.


    Nathan pulled the truck up to the quiet, looming house and switched off the motor.
    “We’ll have to wake them and I’ll need to hide my truck in the garage.” Alisha
    stared at the stately redbrick mansion trimmed in white columns, the rows of tall
    windows now looking vulnerable instead of comforting, the big evergreen wreath
    on the door reminding her of all the holidays she’d spent here.


    Too many memories for tonight, coupled with Nathan being here beside her. A great
    weight of fatigue and shock pushed at her soul. “Yes. Let’s get inside and do
    what we have to do.”


    Nathan quickly came around the truck and opened her door, his gaze scanning the
    old oaks and high shrubs and then the driveway and parking areas. “At least the
    backyard is gated and fenced.


    “We have security lights and alarms everywhere.”


    He helped her down, his hands on her waist. Alisha stared up and into his eyes,
    really seeing him for the first time in a long time. He had always been good-looking,
    but that world-weary cragginess that shadowed his face made him handsome and mysterious.
    His eyes, so cobalt blue and shimmering, held too many secrets and his dark hair,
    always unruly, curled against his neck. A rogue sweep of heavy bangs shielded
    his frown while his gaze held hers.

