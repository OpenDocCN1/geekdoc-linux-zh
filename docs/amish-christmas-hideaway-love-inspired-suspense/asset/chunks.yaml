  raw: '“Or he won’t talk because he *does* know who hired him and he’s afraid he’ll
    be next on the hit list,” Nathan replied, still sore that she’d left the powder
    room. He decided there was no point in telling this woman what to do. She’d always
    been independent and stubborn.


    “Probably the latter,” Carson said, nodding. “They’d need proof that you’re here.
    Hiring a somewhat experienced reporter known for snooping on his own allows them
    to keep their identity a secret.” He stood and gave them both a stern glance.
    “You two stay out of trouble. I’ll check on you later today.”


    “Thank you,” Alisha said, her gaze touching on Nathan. “I’m worried about Mrs.
    C and my grandmother but they seem to be taking all of this excitement in stride.”


    “A formidable pair,” Carson said. “Those two are solid in their faith.”


    Nathan didn’t voice what he was thinking. His parents were solid in their faith,
    too, but that had not brought his sister back. Nathan couldn’t accept that Hannah’s
    unsolved death was the will of God. Now he was being overprotective with Alisha.
    But the thought of something happening to her gave him chills.


    Alisha watched him as if she knew his every thought. “I don’t want to continue
    this—putting them in danger. These people are vicious.”


    “You’re still in the best place possible,” Nathan said, meaning it. “Strangers
    tend to stand out around here and news travels fast. Even though no one has identified
    you publicly and most people don’t know you’re here, I’m sure the whole town is
    on the watch whether we realize it or not. The shooting has been reported all
    across the state and we have an officer dead and one in the hospital because of
    this. Not to mention a car that went over a ravine not far from here.”


    “Anyone can trace the license plate back to me.” Alisha shook her head. “This
    is such a mess. I should go into hiding somewhere far away from here.”


    “You know they’ll find you,” Nathan said. “Look, this place is a stronghold. Carson’s
    gone out of his way to help and the state police have agreed to place officers
    around the property. And... I’m here. I won’t let you go out there alone.”


    Her twisted frown and straight-out stare indicated frustration but her eyes held
    apprehension. Both echoes of how Nathan felt but he wouldn’t tell her that. Of
    course, he’d shown her *his* apprehension over and over. No wonder she was ready
    to bolt.


    “I have to go,” Carson said. “I do have regular duties to carry out.”


    Nathan walked with him to the door. “We’ll compare notes later.”


    After Carson left, he turned to find Alisha staring at him with that stern expression
    on her heart-shaped face. “What?”


    She lifted away from the door jamb. “Are you and Carson telling me everything?”


    “Of course. You’ve been right here the whole time we’ve talked.”


    “But you two have a thing.”


    “A thing?”


    “Yes. He goes out of his way to help you, even so far as sharing the details of
    an open, active case.”


    “A lot of law enforcement personnel share with private detectives and investigators.
    It’s how we get things done.”


    “I understand but how did you two become friends?”


    Chafing under her scrutiny, Nathan moved past her and back into the office. “I
    knew him growing up and then when I left Campton Creek, he was one of the few
    people I stayed in touch with. He suggested I become a private investigator.”


    “Because you were born to do that or because you feel the need to help others
    find their loved ones? So they won’t have to go through what your family did?”


    So she wanted to get to the core of what drove him and made him tick? He didn’t
    want to bring up Hannah’s death. “A little of both, I think. And I don’t want
    to talk about that.”


    “*That* is like the elephant in the room, Nathan.”


    “It doesn’t concern you.”


    “Right. Hannah will always concern me.”


    “No,” he said, anger washing over him. “She is not *your* concern.”


    “But I was part of the problem that night.”


    “I tried to tell you then and now—I don’t blame you for what happened to Hannah.”


    “But Nathan, you blamed me when you came to me in the park after...after they’d
    found her. You said we should have never been together that night.”


    Shaking his head, he stood silent before responding. “I was angry at the world.
    I didn’t handle any of it very well.” His expression softening, he added, “I wish
    I could take back what I said to you but...maybe things worked out for the best
    with us.”


    “Then why won’t you talk to me? Be honest with me.”


    He couldn’t do this. Not now when he was already antsy and wired. “Alisha, let
    it go, okay? She’s gone. I can’t change that.”


    “So you do still blame me.”


    He didn’t want her to keep thinking anything was her fault. Hannah’s death was
    on him and they both knew it. “I’m the one to blame. Me, alone. She would have
    never run out into a storm that night if I hadn’t left. And we need to get back
    to trying to figure out who’s trying to kill you. That’s my priority right now.”


    “I wish I’d never called you.”


    “Well, you did and now you’re stuck with me, so that line is getting old.”


    They had a stare-down right there, just inches between them but so much distance,
    Nathan knew they’d never reach a peaceful compromise.


    He’d keep her alive and then he’d be out of her life again. This time for good.


    * * *


    Two hours later, Alisha pulled the last of the sugar cookies out of the oven.
    “Okay, Granny, this batch makes six dozen cookies. I hope that’s enough for the
    baskets we’re putting together.”


    Frazzled from searching for answers on the two men who were now wanted by the
    law, she’d offered to help her grandmother make cookies. The reprieve had cleared
    her head, at least.


    “Plenty, darling,” her grandmother replied. “Why don’t you make us some Christmas
    tea while these finish cooling? Then we’ll ice them and hopefully we can deliver
    them tomorrow.”


    The kitchen smelled of sugar and spice, the familiar scents making Alisha wish
    this was an ordinary day during the Christmas season. A day where she could go
    for a walk near the creek or stroll through one of the garden trails.


    Alisha wanted to help deliver the cookies, but Nathan had warned her she needed
    to stay hidden here on the estate. Growing up, she’d always enjoyed baking and
    decorating Christmas cookies and then going on the deliveries afterward. Her grandmother
    knew a lot of people within the Amish community so they’d bundle up and head out
    in Granny’s sturdy station wagon and go door-to-door visiting with several of
    the Amish families, Miss Judy all warm and cozy in the back seat. They’d come
    home with baked goods and handmade trinkets from their Amish friends.


    The first time she’d ever seen Nathan had been during one of those deliveries.
    A senior in high school, she’d been fascinated with the Amish for a long time.
    Her parents didn’t like coming here much, called it country and boring, but Alisha
    loved the quietness of this quaint village and the history behind it even if her
    mother, who’d been raised here, resented it. Charlotte Willis Braxton, married
    to a successful Boston lawyer and herself a tenured professor, loved the big city
    and her society friends but Alisha loved Campton Creek.


    One smile from Nathan and she’d become even more intrigued with the Amish. He
    might have jumped the fence but when he smiled now, she saw that rugged, handsome
    boy who’d taken her heart over a basket of freshly baked cookies.


    Pushing away that memory and those of the summer afterward, when she and Nathan
    met again and became so close that they fell in love, she thought about the faith
    and strength in this community.


    Admiral Edward Campton Senior’s grandfather had owned most of the land on both
    sides of the winding creek that deepened near the big covered bridge in the middle
    of the community. When an Amish couple with six hungry children had knocked on
    the door of Campton House one cold winter, Mr. Campton had invited them in and
    his wife had fed them and then they’d let the family stay in their home until
    they could make arrangements for them.'
