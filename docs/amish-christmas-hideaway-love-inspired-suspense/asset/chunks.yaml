    Dragging himself back inside, he pushed away the dizziness in his brain, a throbbing
    pain coursing through his temple like a roaring train. He managed to shut the
    door then he turned to where he’d seen Alisha shoot one of the intruders. The
    man was gone but he’d left a trail of blood out the other door.


    Searching for a towel, Nathan dragged himself up and worked to stop the blood
    oozing out of his upper right shoulder. With a bit of effort and waves of dizziness,
    he hurriedly cleaned and bandaged it with supplies from the first aid kit he kept
    in the cabin. His head wound had stopped bleeding and the dizziness subsided once
    he settled down. But he couldn’t stay settled.


    Then he bundled up, checked the magazine on his gun and took some pain medicine
    for his headache. He’d tried to call for help but his phone’s battery had gone
    dead. Too late for that. He had to track Alisha. Not sure how far ahead they were,
    he checked his supplies one last time and hurried to the back door. Stumbling,
    he hit his foot on Alisha’s briefcase.


    She’d said her life was inside that case. Right now, she didn’t have it as her
    shield. He’d have to be her shield and pray that God was watching over them. His
    heart hammering an urgent beat, Nathan stashed her case under some clothes in
    the closet, put on a wool hat and his coat, then rushed out to begin the desperate
    race to find Alisha before it was too late.


    # TWELVE


    She’d watched for the birdhouses.


    Now Alisha saw them up ahead in the gray dusk. If she planned to make a run for
    it, now would be the time. Checking her pocket again, she held her fingers on
    the container of pepper spray. It had a stretch gripper band that she’d already
    slipped over her fingers. She used it mostly for jogging but now she was glad
    she’d kept an extra container in her briefcase. Being jostled here and there,
    she’d managed to unlock the safety. She was ready.


    “Keep moving,” Long Hair, or Ace as his friend called him, growled, hurling her
    forward. They all had nicknames. Mack the Knife, Ace, and Scooter. “Your man isn’t
    coming to help you.”


    “He’s not my man,” she retorted. “But he’ll find me. He’s good at finding people.”


    “He’s probably dead by now,” the other one said. “Scooter wasn’t hurt too bad.”


    She prayed Scooter had either left in a hurry or passed out cold.


    Ace held her arm in a tight grip that was sure to leave bruises in the shape of
    his meaty fingers, while the other one kept watch behind them. They didn’t speak
    much except to let her know that if she ran, she’d die and then they’d kill her
    grandmother.


    Alisha had to go on faith. She would escape and she would find someone to help
    her and save her grandmother, too. This wasn’t going to end in the cold woods.
    She’d do as Nathan had told her and run along the birdhouse path and find someone,
    anyone, to get back to him.


    But as the two men pushed her toward the path she planned to take, they veered
    to the left instead of the right. Left was nothing but deep, snow-covered woods
    for miles. Right had a path and held hope. She had to act now or they’d have her
    back on the road and in a vehicle.


    And then, she’d never have a chance to save anyone.


    Ace yanked at her. “Keep up. We’re almost there.”


    Alisha took a breath and said a little prayer for courage. Then she went limp.


    “What’s wrong?” Ace snarled, anger flashing in his eyes. “You’d better not be
    faking.”


    “I don’t feel so good,” she said, falling to her knees. I’m so tired and I need
    some water.”


    “We don’t have water and you’re walking,” he said, trying to drag her up. “Someone
    wants to meet you.”


    Alisha was ready. Pulling her right hand out of her pocket, she sprayed him in
    the eyes and then turned toward the other man and did the same to him.


    While they both screamed in agony, Alisha took off running with all her might.
    She had to get to the Schrock farm.


    *** *


    Nathan followed the path of the footsteps, thanking the snow for stopping long
    enough to give him a perfect trail. He was about twenty minutes behind and growing
    weaker by the minute, but he had to keep going. Three sets of prints until they
    got to the fork in the path. His pulse pressing against his temple, he blinked
    away pain and studied the trail. Three sets about five feet into the path to the
    left and then—


    He stopped and knelt down, his mind whirling with the worst-case scenario. The
    snow was all smudged and gutted here, as if there had been a struggle.


    Had Alisha gotten away?


    Or had those two dragged her farther into the woods to the left?


    He didn’t know which path to take.


    *Lord, I need you. Guide me*.


    Nathan stumbled toward the other path, his breath fanning out in a cold fog in
    front of him. His body protested every step, his ears ringing with pain while
    his head throbbed. The bullet hole in his shoulder wasn’t too happy, either.


    But he kept trudging.


    And found one set of footsteps digging through the deepening snow.


    “Did you get away, Alisha?”


    He looked around and realized he was on the birdhouse path. Squinting, he put
    one foot in front of the other and trudged ahead, not knowing if the prints belonged
    to her or not. But who else would be out here?


    When he heard a rustling up ahead, Nathan dragged himself off the trail and hid
    in the snow-covered undergrowth behind a large pine. Something moved to the east.
    He could hear footfalls.


    He watched, holding his breath, the `Beretta` Alisha had left behind tight against
    his fingers. He hoped she’d kept going.


    The air shook with an echo of footfalls. A massive shadow fell across the white
    snow, casting long in the waning moonlight.


    Nathan braced for what might come.


    The big stag strolled along the path, heading in the direction Nathan had just
    come. Breathing a sigh of relief, Nathan watched as the animal stopped and lifted
    his head, his nostrils flaring, his eyes watchful.


    Then he looked in the direction of where Nathan was hiding. The deer didn’t move
    and Nathan was afraid to move.


    The big animal seemed to be standing guard, watching, waiting, listening. Then
    he turned around and took off, leaping back to the right.


    Nathan decided he’d follow the stag.


    Maybe the Lord had sent him another sign.


    The stag left him behind, but Nathan saw a clear path now. The same smaller set
    of prints moved up the path, past the birdhouses he’d built and placed here, one
    at a time, from the time he’d moved into the cabin until now. He’d made a birdhouse
    to represent every celebration he’d missed with his family—birthdays and Easter,
    summer, fall, winter and spring. A dozen or so, each unique and meaningful to
    him. He’d often walked this path, his creations bringing him joy and a sense of
    home. He enjoyed watching the birds make their nests there in the tiny houses
    and he’d watched their babies learning to fly away.


    *Please let her be safe. Let her be okay. Let her be alive*.


    He prayed silently and sometimes in soft whispered pleas. He would keep praying
    until he had Alisha in his arms again.


    ***


    Alisha blinked and tried to focus. But the darkness seemed to close in around
    her with the same cloying strength as the men who’d tried to take her.


    She’d gotten away and then she’d gotten lost. The two men had left earlier but
    then she’d heard them again, arguing about what to do, their voices getting closer.
    She kept running east but she’d gone off the open trail to stay hidden.


    The cold chill that held her in ice, coupled with the shock coursing through her
    body, made her disoriented and tired. So tired.

