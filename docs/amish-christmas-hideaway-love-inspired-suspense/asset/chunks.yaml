    Alisha had never truly known that concept until now. Even when they were young
    and so in love, she’d been selfish. She’d given up on Nathan too quickly and gone
    off to do what she thought she needed to do. But she’d become jaded and critical
    of love, had fought against it and closed off her heart.


    She wouldn’t do that this time, even if she and Nathan couldn’t make it work.
    But she wanted it to work. “I’ll try my best,” she managed to say.


    Martha hugged her close. “Send word.”


    Amos didn’t hug Alisha but he patted her arm. “*Gott* will watch over you both.”


    Nathan stood nearby, awkward and clearly shaken. “We’ll let you know how things
    progress.”


    His mother rushed to hug him. “Take care and Nathan, *kumm* home to see us soon.”


    “I’ll do that, Mamm,” he said, his eyes searching Alisha’s face while he hugged
    his mother.


    Amos cleared his throat and nodded. Nathan shook his father’s hand. “*Denki,*
    Daed.”


