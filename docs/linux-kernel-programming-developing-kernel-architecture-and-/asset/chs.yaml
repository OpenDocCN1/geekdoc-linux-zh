  \n![](img/fm1.png)\n\n# 第 9 章 Linux 安全模块\n\n## 引言\n\n在本章中，我们将看到 Linux 安全模块（LSMs）是如何工作的，它们负责整个系统的高级安全。目前存在多种此类模块，例如\
  \ SELinux、AppArmor、Smack 和 Tomoyo。最后，我们将看到如何实现自己的模块。\n\n## 结构\n\n本章涵盖了以下主题：\n\n\
  *   强制性访问控制\n*   常用 Linux 安全模块的剖析\n*   Linux 安全模块的架构\n*   开发自定义的 Linux 安全模块\n\n\
  ## 目标\n\n在本章结束时，我们能够理解用于保护 GNU/Linux 系统的现有机制的复杂性。我们能够实现自己的模块。访问控制模型非常重要，因为它们规定了哪些用户、应用程序和设备可以查看、编辑、添加和删除环境中的资源。控制访问是保护敏感数据免受盗窃、误用、滥用和其他威胁的关键实践之一。访问控制有两个级别：物理访问和逻辑访问。\n\
  \n## 强制性访问控制\n\n强制性访问控制（MAC）是 IT 系统中的一种安全模型，用于根据系统管理员定义的预定义安全策略限制并控制对资源的访问。\n\n\
  与自主访问控制（DAC）不同（后者的访问控制决策通常由资源所有者做出），MAC 根据系统定义的规则实施访问限制，而不取决于用户的操作。\n\n在 MAC 系统中：\n\
  \n*   访问决策：访问决策基于附加在主体（如进程、用户）和对象（如文件、设备）上的安全标签的。这些标签分别表示主体的敏感性或分级以及对象的敏感性或分级。\n\
  *   执行：MAC 系统不分用户的偏好或操作执行访问控制策略。这意味着即使是特权用户也无法绕过系统定义的访问控制。\n*   集中化控制：MAC 策略通常由系统管理员或安全专业人员集中定义和管理。这确保了安全策略在整个系统中的执行的一致性。\n\
  *   细粒度控制：MAC 系统通常对访问权限提供细粒度控制，允许管理员详细规定谁在什么条件下可以访问什么资源。\n*   隔离与划分：MAC 可用于强制资源的严格隔离和划分，确保敏感数据或关键系统组件仅由授权的实体访问。\n\
  *   高信誉：MAC 系统通常被用于高安全性环境，这些环境对机密性、完整性和可用性有很的要求。与自主访问控制机制相比，它们提供了更高的信誉。\n\nMAC 实现的示例包括安全增强\
  \ Linux（SELinux）、AppArmor、IMA/EVM、LoadPin、Yama、简化强制性访问控制内核（Smack）以及 TOMOYO。这些系统通过为主体体的对象分配安全标签并根据预定义的安全策略执行访问决策来实施强制性访问控制。\n\
  \n下图显示了 GNU/Linux 下使用的多种 MAC 之间的区别：\n\n![](img/Figure9.1.png)\n\n图 9.1：多种 LSM 的比较\n\
  \n\n\n\nMAC 是一种访问控制模型，操作系统根据数据隐私和用户权限级别为用户提供访问权限。在该模型中，访问权限是基于“按需知”原则授予的：用户在访问信息之前必须证明其对该信息有需求。MAC\
  \ 也称为非强制性访问控制模型，这意味着控制权并非由用户或文件所有者的主裁来获得。MAC 通过其控制机制实现了零信任原则。MAC 被认为所有访问控制模型中最安全的。该模型中的访问规则由系统管理员手动设置，并由操作系统或安全内核严格执行。普通用户即使对于其创建的数据，也无法更改其安全属性。\n\
  \n### MAC 最重要的原则如下：\n\n- 组织信息资源的高度机密性和隐私性至关重要。没有人拥有默认权限来访问或修改他人的数据。\n- 访问权限的提供由集中管理。\n\
  - 系统中的每个个体和资源都带有其排名和类别的安全标签。\n\n下图显示了 MAC 各组件之间不同的交互作用：\n\n![](img/Figure9.2.png)\n\
  \n图 9.2：MAC 架构\n\n### 访问过程\n在 MAC 中，访问过程如下：\n\n- 管理员配置访问策略并定义安全属性：隐私级别、访问权限、不同项目和资源类型。\n\
  - 管理员为每个主体（访问数据的用户或资源）和对象（文件、数据库、端口等）分配一组属性。\n- 当主体尝试访问对象时，操作系统会检查主体的安全属性并决定是否授予访问权限。\n\
  - 为了获得对对象的访问权限，用户需要提供其凭据。\n\n除了检查隐私和权限级别（主体与对象之间的分类匹配）外，操作系统还关注主体与对象之间的类别匹配。拥有“最高机密”分类并不意味着如果该文件不属于对象所需的类别，就会自动授予用户对文件的完全访问权限。\n\
  \n### 实现示例\n让我们再次以强制性访问控制为例。假设一个组织拥有带有“最高机密”和“工程项目”机密性安全级别的数据。这些数据可以被一组同时拥有“机密”授权（分类）和“工程文档访问授权”（类别）的用户访问。这些用户也可以访问权限级别较低的信息。然而，权限级别较低或没有技术访问权限文档的员工无法访问这些信息。MAC\
  \ 为网络安全系统带来了许多好处，但也有几个需要考虑的缺点。\n\n### 优点与缺点\n让我们看看强制性访问控制的缺点和优点：\n\n### 优点：\n- 高级数据保护：管理员定义对对象的访问，用户无法更改该访问权限。\n\
  - 粒度细：管理员手动设置用户访问权限和对象访问参数。\n- 免疫木马攻击：用户无法对数据进行降级，无法共享对已分类数据的访问权限。\n- 错误更少：严格且持续控制的策略有助于减少导致用户权限过大的错误。\n\
  - 严格划分：管理员将用户划分为子集，并使用安全属性限制这些子集的资源暴露。\n\n### 缺点：\n- 可维护性：安全级别和许可范围的手动配置需要管理员的持续关注。\n\
  - 可扩展性：MAC 不具备自动扩展能力。新用户和新数据需要不断更新对象和账户配置。\n- 对用户工作的干扰：用户必须为每项新数据请求访问权限；他们不能自行配置访问。\n\
  - 无法针对自己的数据设置参数。\n\n### 用例\n这种访问控制模型主要由政府、组织、军事和执法机构使用。为了在保险和银行业中获得更好的数据保护和合规性，组织使用\
  \ MAC 控制对客户账户数据的访问。这种非强制性访问控制模型还可以保护对数据库的访问，其中过程、表、视图和其他元素将成为对象。对于重视数据安全胜于运营灵活性成本的组织，使用\
  \ MAC 是合理的。由于此类系统的复杂性和僵性，在私有组织中实施 MAC 非常罕见。\n\n### 混合模型\n纯 MAC 模型提供了高水平、细粒度的安全性。另一方面，它很难建立和维护。这就是为什么通常将\
  \ MAC 与其他访问控制模型相结合的原因。例如，将其与基于角色的模型相结合可以加速用户配置的配置。管理员不需要为每个用户设置访问权限，而是创建用户角色。每个组织都有具有相似角色和访问权限的用户：相同职位的员工、第三方供应商等。管理员可以为这些组配置角色，而不是从零开始设置单个用户配置文件。\n\
  \n下图详细列出了在获取资源时不同的利益诉求：\n\n![](img/Figure9.3.png)\n\n图 9.3：资源访问请求\n\n另一种流行的组合是 MAC\
  \ 和自主裁量访问控制 (DAC) 模型。MAC 可用于保护敏感数据，而 DAC 允许同事在公司文件系统中共享信息。\n\n## 常用 Linux 安全模块剖析\n\
  \nLinux 安全模块 (LSM) 驱动是 Linux 内核安全架构的一个关键方面。LSM 为各种安全模块集成到内核中提供了框架，允许执行访问控制策略和其他安全机制。LSM\
  \ 允许在不修改内核本身的情况下实现不同的安全模型，从而确保了灵性和可维护性。\n\nLSM 驱动本质上是与 Linux 内核安全基础设施集成的内核模块。这些驱动程序拦截安全相关的系统调用和其他内核操作以执行安全策略。LSM\
  \ 驱动程序的示例包括：增强型 Linux (SELinux)、AppArmor、Smack、TOMOYO 等。以下是某些主要的 LSM 驱动程序的简要概述：\n\
  \n### 增强型 Linux (SELinux):\n- 最初由美国国家安全局 (NSA) 开发，后改为开源。\n- 提供精细粒度的 MAC 系统。\n- 使用附加到文件、进程和其他对象上的安全标签来执行访问控制策略。\n\
  - 基于安全标签执行访问控制，提供强大的隔离和防止权限提升的保护。\n- 需要支持 SELinux 的特定内核构建，策略的配置和管理可能复杂。\n- 文档：\n\
  \    - [`selinuxproject.org/page/User_Resources`](https://selinuxproject.org/page/User_Resources)\n\
  \    - [`www.kernel.org/doc/html/v4.15/admin-guide/LSM/SELinux.html`](https://www.kernel.org/doc/html/v4.15/admin-guide/LSM/SELinux.html)\n\
  \n下图详细说明了 SELINUX 架构的不同组件：\n\n![](img/Figure9.4.png)\n\n图 9.4：SELinux 架构\n\n####\
  \ Yama:\n- Yama 专注于进程相关的安全功能，允许对进程操作进行细粒度的限制。\n- 它允许管理员限制进程跟踪、防止进程附加并限制进程能力。\n-\
  \ 在某些主流发行版（如 Fedora）中可用，Yama 提供了额外的进程级安全控制。\n\n\n\n\n\n- [`www.kernel.org/doc/html/v4.15/admin-guide/LSM/Yama.html`](https://www.kernel.org/doc/html/v4.15/admin-guide/LSM/Yama.html%20)\n\
  \n![](img/Figure9.5.png)\n\n图 9.5: Yama 与其他 LSM (Loadpin, selinux) 的集成\n\n### LoadPin\n\
  \n- `LoadPin` LSM 持续监控系统负载指标，如 CPU 利用率、内存使用和磁盘 I/O 活动。\n- 管理员可以定义策略指定不同系统资源的负载阈值。当负载超过这些阈值时，可以限制对相应资源的访问。\n\
  - `LoadPin` LSM 可以帮助保护关键系统资源免受过量负载的影响。例如，当系统负载过高时，它可以阻止创建新进程或限制对某些文件或目录的访问。\n- `LoadPin`\
  \ LSM 允许管理员根据变化的系统状况动态调整负载阈值和访问控制策略。这种灵活性能够根据特定的工作负载模式对资源保护机制进行精调。\n- `LoadPin`\
  \ LSM 可以与其他 LSM（如 `SELinux` 或 `AppArmor`）结合使用，提供全面的安全强化。\n- **文档：**\n    - [`www.kernel.org/doc/html/v4.15/admin-guide/LSM/LoadPin.html`](https://www.kernel.org/doc/html/v4.15/admin-guide/LSM/LoadPin.html%20)\n\
  \    - [`github.com/torvalds/linux/blob/master/security/loadpin/loadpin.c`](https://github.com/torvalds/linux/blob/master/security/loadpin/loadpin.c%20)\n\
  \n### AppArmor\n\n- 最初由 Immunix 开发，后被 Novell 收购，并集成到 Linux 主内核中。\n- 侧重于限制单个程序而非用户。\n\
  - 使用基于路径的配置（profiles）来指定应用程序允许和拒绝的访问。\n- `AppArmor` 集成在基于 Ubuntu 的发行版中，并提供基于配置的访问控制。\n\
  - 为常用应用程序提供预配置配置，简化了安全策略的设置和管理。\n- 使用基于路径的访问控制来限制对文件和资源的访问，增强了应用级安全性。\n- 在安全性和可用性之间取得了平衡，使其对许多用户更容易上手。\n\
  - **文档：**\n    - [`apparmor.net/`](https://apparmor.net/%20)\n    - [`www.kernel.org/doc/html/v4.15/admin-guide/LSM/apparmor.html`](https://www.kernel.org/doc/html/v4.15/admin-guide/LSM/apparmor.html)\n\
  \n下面的图详细介绍了 APPARMOR 架构的不同组件：\n\n![](img/Figure9.6.png)\n\n图 9.6: AppArmor 架构\n\n\
  ### 简化强制性访问控制内核 (Smack)\n\n- 由 Immunix 的 Casey Schaufler 开发，后集成到 Linux 主内核中。\n-\
  \ 与 `SELinux` 相比，实现了一个简单的 MAC 系统。\n- 使用附加在进程和文件标签（labels）来执行访问控制。\n- `Smack` 是一种轻量级基于标签的访问控制\
  \ LSM，侧重于简单性和灵活性。\n- 使用分配给进程和文件的安全标签来执行访问控制策略。\n- `Smack` 的标签方法实现了细粒度的访问控制，以轻量级的方式增强了安全性。\n\
  - 它未包含在主流发行版中，但可以通过特定的内核编译启用。\n- **文档：**\n    - [`schaufler-ca.com/`](http://schaufler-ca.com/%20)\n\
  \    - [`www.kernel.org/doc/html/v4.18/admin-guide/LSM/Smack.html`](https://www.kernel.org/doc/html/v4.18/admin-guide/LSM/Smack.html)\n\
  \n### TOMOYO\n\n- 由日本电信电话 (NTT) 开发，后集成到 Linux 主内核中。\n- 提供了一种基于策略的访问控制机制。\n- 使用基于路径的策略规范和学习模式来生成安全策略。\n\
  - 管理员根据路径、执行文件和属性定义策略，降低了复杂性。\n- 提供了一种白名单安全方法，仅允许明确许可的操作，通过简单性增强安全性。\n- 与 `SELinux`\
  \ 和 `AppArmor` 相比使用较少，通常出现在特定的发行版和分众用例中。\n- **文档：**\n    - [`tomoyo.sourceforge.net/`](https://tomoyo.sourceforge.net/%20)\n\
  \    - [`www.kernel.org/doc/html/v4.15/admin-guide/LSM/tomoyo.html`](https://www.kernel.org/doc/html/v4.15/admin-guide/LSM/tomoyo.html%20)\n\
  \n每个 LSM 驱动都有自己的访问控制和安全策略执行方法，适应不同的用例和安全需求。\n\nLSM 驱动是 Linux 内核安全基础设施不可缺的一部分，对 Linux\
  \ 系统的整体性和完整性重大贡献。它们允许管理员执行访问控制策略、缓解安全威胁并保护敏感资源。\n\n## 安全模块架构\n\nLSM 框架的设计使其几乎所有的钩子（hooks）都是限制性的。\n\
  \n- GNU/Linux 内核仍然执行自身的安全检查。\n- 当内核需要决定是否允许访问时，它还会询问安全模块该操作是否允许。\n- 管理员应该选择他们想要的安全模块。\n\
  - 权威钩子（authoritative hook）做出绝对决策：如果钩子说请求应该允许，那么无论如何都会被允许。\n- 限制性钩子只能增加额外的限制，不能授予权限。\n\
  \n### 安全函数接口\n\n- `security.h` 拥有 `security_operations` 结构，该结构以函数指针的形式定义安全函数。\n\
  - 它定义了一个全局变量：\n    - `extern struct security_operations security_ops;`\n- `security.h`\
  \ 定义了一组与每个安全调用对应的静态函数。\n- 对于每个静态函数 `x`，它执行 `security_ops->x()`。因此，内核调用 `x`，而 `x`\
  \ 调用注册的函数指针。\n\n### 安全钩子的插入\n\n- LSM 在内核代码的关键点插入对安全函数的调用，以执行访问控制：\n    - `fork.c`:\
  \ 任务创建\n    - `namei.c`: 虚拟文件系统创建\n- LSM 在内核代码的关键点插入对安全函数的调用，以管理安全字段：\n    - `inode.c`:\
  \ `security_inode_alloc()`\n    - `inode.c`: `security_inode_free()`\n    - `fork.c`:\
  \ `security_task_alloc()`\n    - `fork.c`: `security_task_free()`\n\n### 内核对象中的安全字段\n\
  \n- 添加到各种内核对象的安全字段（`void* security`）。\n- 安全字段的设置由安全模块处理。\n- 这些字段被安全模块用于标记。\n\n下表显示了\
  \ lsm 在内核对象方面的影响：\n\n| 对象 | 影响 |\n| :--- | :--- |\n| `task struct` | 任务 (进程) |\n\
  | `linux_binprm` | 程序 |\n| `super_block` | 文件系统 |\n| `inode` | 管道、文件或套接字 |\n| `sk_buff`\
  \ | 网络缓冲区 |\n| `net_device` | 网络设备 |\n| `kern_ipc_perm` | 信号量、共享内存、段或消息队列 |\n\n\
  表 9.1: 受影响的内核对象\n\n###模块注册\n\n- 提供函数并允许内核模块作为安全模块进行自身的注册和注销：\n- 主安全模块必须使用 `security.c`\
  \ 文件中的 `register_security` 函数进行自注册。\n\n\n\n\n\n- 它仅注册一个模块作为主模块。\n- 模块堆叠决策由主模块决定：\n\
  \    - 如果辅助模块无法使用 `register_security()` 注册，则它需要调用 `mod_reg_security`，该函数会调用主函数来决定是否堆叠。\n\
  - 将能力逻辑移动到可选的安全模块中：\n    - `capabilities` 的名称源于废弃的 `POSIX 1003.1e`。\n    - 这些能力是对强大的\
  \ root 权限的划分。\n    - 进程拥有三组位图，分别称为 `inheritable(I)`、`permitted(P)` 和 `effective(E)`\
  \ 能力。\n    - 每个能力都实现为三个位图中的一个位，处于设置或未设置状态。\n    - 内核将检查进程有效集（effective set）中相应的位以允许执行特权操作。\n\
  \n下表详细列了与进程相关的不同能力：\n\n| 能力 | 描述 |\n| :--- | :--- |\n| `CAP_AUDIT_WRITE` | 允许通过向\
  \ netlink socket 写入数据来生成审计消息 |\n| `CAP_AUDIT_CONTROL` | 允许通过 netlink socket 控制内核审计活动\
  \ |\n| `CAP_CHOWN` | 忽略文件用户和组所有权更改的限制 |\n| `CAP_DAC_OVERRIDE` | 忽略文件访问权限 |\n| `CAP_DAC_READ_SEARCH`\
  \ | 忽略文件/目录的读取和搜索权限 |\n| `CAP_FOWNER` | 通常情况下忽略对文件所有权的权限检查 |\n| `CAP_FSETID` | 忽略对文件设置\
  \ setuid 和 setgid 标志的限制 |\n| `CAP_KILL` | 在生成信号时绕过权限检查 |\n| `CAP_SETGID` | 忽略进程组凭据操作的组限制\
  \ |\n| `CAP_SETPCAP` | 允许对其他进程进行能力操作 |\n| `CAP_SETUID` | 忽略用户进程凭据操作的限制 |\n| `CAP_SYS_ADMIN`\
  \ | 允许通用的系统管理 |\n| `CAP_SYS_BOOT` | 允许使用 `reboot()` |\n| `CAP_SYS_CHROOT` | 允许使用\
  \ `chroot()` |\n| `CAP_SYS_PTRACE` | 允许对每个进程使用 `ptrace()` |\n| `CAP_SYS_RESOURCE`\
  \ | 允许增加资源限制 |\n| `CAP_SYS_TIME` | 允许操作系统时钟和实时钟 |\n\n表 9.2: 能力子集\n\n权威模型更加灵活，但它需要对\
  \ Linux 内核进行许多根本性的更改。\n\n下图详细说明了 LSM 不同元素的模块化设计：\n\n![](img/Figure9.7.png)\n\n图\
  \ 9.7: LSM UML 图\n\n安全是一个长期且不断严变的问题，随着更多系统的上线，受动机驱动的攻击不断增加，Linux 也无法完全免于这种威胁：\n\n\
  - Linux 系统存在大量的软件漏洞。\n\n缓解软件漏洞的一种重要方法是有效使用访问控制。\n\nLSM 试图通过为安全策略模块提供框架来解决这个问题。\n\
  \n对于 DAC（强制性访问控制），只有两类用户：管理员和用户。它避免了权限提升。\n\n`Uid=0` 表示我们是 root，`gid=0` 是 root 组。如果\
  \ `uid=0`，内核将绕过权限检查。当创建进程时，它总是继承父进程的凭据。可以使用系统调用修改有效凭据：\n\n- `setuid()`\n- `setresuitd()`\n\
  - `setfsuid()`\n- `setreuid()`\n\n下表列出了 LSM 中使用的不同标识符：\n\n| 标识符 | 描述 |\n| :--- |\
  \ :--- |\n| `uid,gid` | 用户和组真实标识符 |\n| `fuid,egid` | 用户和组有效标识符 |\n| `fsuid,fsgid`\
  \ | 文件访问的用户和组有效标识符 |\n| `groups` | 补充组标识符 |\n| `suid,sgid` | 用户和组保存标识符 |\n\n表 9.3:\
  \ 与每个进程相关的凭据\n\nLSM 框架提供了钩子（hooks）——Linux 内核中可以做出安全决策或强制安全检查的特定点。\n\n这些钩子允许 LSM\
  \ 模块拦截各种内核操作并根据模块特定的安全模型应用安全策略。\n\n下图显示了 LSM 在内核空间和用户空间之间的交换：\n\n![](img/Figure9.8.png)\n\
  \n图 9.8: 用户空间与内核空间之间的 LSM 架构\n\n以下是 LSM 模块使用的一些关键钩子：\n\n- **文件系统钩子**：\n    - `inode_permission()`：在访问文件或目录时检查权限。\n\
  \    - `inode_create()`：控制文件创建。\n    - `inode_unlink()`：控制文件删除。\n    - `inode_mkdir()`，`inode_rmdir()`：控制目录的创建和删除。\n\
  - **进程钩子**：\n    - `task_create()`：控制新进程的创建。\n    - `cred_alloc_blank()`，`cred_prepare()`：管理进程凭据的初始化。\n\
  \    - `bprm_check_security()`：控制二进制程序的执行。\n- **网络钩子**：\n    - `socket_create()`，`socket_bind()`，`socket_connect()`：控制网络\
  \ socket 操作。\n    - `skb_send_security()`，`skb_recv_security()`：管理网络数据包的安全检查。\n\
  \    - `inet_conn_request()`：处理入的网络连接。\n- **系统调用钩子**：\n    - 钩入特定的系统调用，如 `open()`，`read()`，`write()`，`execve()`\
  \ 等，以执行这些操作的安全策略。\n    - 示例包括 `file_open()`，`file_permission()`，`file_mmap()` 等。\n\
  - **能力钩子**：\n    - `capable()`：检查进程是否具有特定能力。\n    - `capable_wrt_inode()`：相对于 inode\
  \ 的能力。\n- **SELinux 上文钩子**：\n    - 与 SELinux 上文相关的钩子，例如用于 socket 的 `sock_rcv()`。\n\
  \    - `selinux_inode_getattr()`：获取 inode 属性。\n    - `selinux_inode_setsecurity()`，`selinux_inode_getsecurity()`：设置和获取\
  \ inode 上下文。\n- **审计钩子**：\n    - `inode_post_setxattr()`，`inode_post_removexattr()`：对\
  \ inode 进行审计。\n- **挂载钩子**：\n    - `sb_mount()` 和 `sb_umount()`：挂载和卸载文件系统的钩子。\n \
  \   - `sb_alloc_security()`，`sb_free_security()`：管理文件系统安全上下文的分配。\n\n这些钩子仅代表了 LSM\
  \ 可用钩子的部分。LSM 模块可以根据其安全模型和需求实现这些钩子的任何子。\n\n下图详细说明了 LSM 对资源的不同验证阶段：\n\n![](img/Figure9.9.png)\n\
  \n图 9.9: inode 的内核细节\n\n通过拦截这些钩子，LSM 模块可以执行安全策略、执行访问检查并在内核中提供细粒度的安全执行。\n\n### 开发自定义\
  \ Linux 安全模块 (#contents.xhtml_sc2_146)\n\n创建一个实现钩子的完整 LSM 是一项巨大的工程，因为它涉及到对广泛内核操作的实现，并确保在系统的组件上正确执行安全策略。\n\
  \n以下 c 代码显示了 LSM 内可用钩子的函数指针数据结构：\n\n```c\nstruct security_operations {\n    int\
  \ (*ptrace_access_check)(struct task_struct *child, unsigned int mode);\n    int\
  \ (*ptrace_traceme)(struct task_struct *parent);\n    int (*capget)(struct task_struct\
  \ *target, kernel_cap_t *effective,\n                  kernel_cap_t *inheritable,\
  \ kernel_cap_t *permitted);\n    int (*capset)(struct cred *new, const struct cred\
  \ *old,\n                  const kernel_cap_t *effective, const kernel_cap_t *inheritable,\n\
  \                  const kernel_cap_t *permitted);\n    int (*bprm_check_security)(struct\
  \ linux_binprm *bprm);\n    int (*inode_alloc_security)(struct inode *inode);\n\
  \    int (*inode_free_security)(struct inode *inode);\n    int (*inode_permission)(struct\
  \ inode *inode, int mask);\n    int (*file_open)(struct file *file);\n    int (*file_permission)(struct\
  \ file *file, int mask);\n    // 更多钩子...\n};\n```\n\n如所见，有很多钩子需要实现。\n\n\n\n\n\n\
  以下是一个简化的 Linux LSM 模块示例，它实现了多个与文件系统访问控制相关的钩子（hooks）：\n\n```c\n#include <linux/kernel.h>\n\
  #include <linux/init.h>\n#include <linux/module.h>\n#include <linux/security.h>\n\
  #include <linux/fs.h>\n\n// 文件权限钩子函数\nstatic int my_lsm_inode_permission(struct\
  \ inode *inode, int mask) {\n    // 检查当前进程是否有访问该文件的权限\n    if (!security_task_is_allowed(current,\
  \ mask)) {\n        printk(KERN_INFO \"LSM: Access denied for PID %d to inode %lu\\\
  n\",\n        current->pid, inode->i_ino);\n        return -EACCES; // 拒绝访问\n  \
  \  }\n    return 0; // 允许访问\n}\n\n// 文件创建钩子函数\nstatic int my_lsm_inode_create(struct\
  \ inode *dir, struct dentry *dentry, umode_t mode, bool excl) {\n    // 检查当前进程是否允许在目录中创建文件\n\
  \    if (!security_task_is_allowed(current, MAY_WRITE)) {\n        printk(KERN_INFO\
  \ \"LSM: Creation of file denied for PID %d in directory %lu\\n\",\n        current->pid,\
  \ dir->i_ino);\n        return -EACCES; // 拒绝创建\n    }\n    return 0; // 允许创建\n\
  }\n\n// 文件删除钩子函数\nstatic int my_lsm_inode_unlink(struct inode *dir, struct dentry\
  \ *dentry) {\n    // 检查当前进程是否允许删除文件\n    if (!security_task_is_allowed(current,\
  \ MAY_WRITE)) {\n        printk(KERN_INFO \"LSM: Deletion of file denied for PID\
  \ %d in directory %lu\\n\",\n        current->pid, dir->i_ino);\n        return\
  \ -EACCES; // 拒绝删除\n    }\n    return 0; // 允许删除\n}\n\n// 钩子函数注册\nstruct struct\
  \ security_hook_list my_lsm_hooks[] = {\n    LSM_HOOK_INIT(inode_permission, my_lsm_inode_permission),\n\
  \    LSM_HOOK_INIT(inode_create, my_lsm_inode_create),\n    LSM_HOOK_INIT(inode_unlink,\
  \ my_lsm_inode_unlink),\n    // 根据需要添加更多钩子\n};\n\n// LSM 初始化\nstatic int __init\
  \ my_lsm_init(void) {\n    printk(KERN_INFO \"LSM: Initializing LSM\\n\");\n   \
  \ // 注册 LSM 钩子\n    security_add_hooks(my_lsm_hooks, ARRAY_SIZE(my_lsm_hooks));\n\
  \    return 0;\n}\n\n// LSM 清理\nstatic void __exit my_lsm_exit(void) {\n    printk(KERN_INFO\
  \ \"LSM: Cleaning up LSM\\n\");\n}\n\nmodule_init(my_lsm_init);\nmodule_exit(my_lsm_exit);\n\
  MODULE_LICENSE(\"GPL\");\nMODULE_AUTHOR(\"BPB\");\nMODULE_DESCRIPTION(\"A simple\
  \ Linux Security Module\");\n```\n\n以下是一些说明：\n\n- 第 #1-5 行：这些行包含了内核开发所需的头文件，包括用于内核日志的\
  \ `kernel.h`、模块初始化 `init.h`、模块开发 `module.h`、安全框架 `security.h` 以及文件系统操作 `fs.h`。\n\
  - 第 #8 行：此行定义了一个名为 `my_lsm_inode_permission` 的静态函数，它是 `inode_permission` 钩子的回调函数。每当进程尝试对文件执行操作时，就会触发此钩子。该函数接受两个参数：代表文件的\
  \ `inode` 结构体指针和一个表示请求操作的整数 `mask`。\n- 第 #10 行：此行检查当前进程是否允许对文件（`inode`）执行请求的操作（`mask`）。它调用\
  \ LSM 框架提供的 `security_task_is_allowed` 函数，传入当前进程（`current`）和操作掩码。\n- 第 #11 行：如果访问被拒绝，此行将记录一条消息，表示拒绝当前进程（`current->pid`）访问指定的\
  \ inode（`inode->i_ino`）。\n- 第 #13 行：如果访问被拒绝，此行返回 `-EACCES` 以表示操作应被拒绝。\n- 第 #15 行：如果访问被允许，此行返回\
  \ `0` 以表示操作应继续。\n- 第 #19 行和 #30 行：`my_lsm_inode_create` 和 `my_lsm_inode_unlink`\
  \ 函数与 `my_lsm_inode_permission` 类似，但分别处理文件创建和删除操作。\n- 第 #40-46 行：此区块初始化了一个包含 `struct\
  \ security_hook_list` 实例的数组 `my_lsm_hooks`。每个实例将钩子名称与其对应的钩子函数配对。\n- 第 #49 行：此行定义了\
  \ LSM 模块的初始化函数。\n- 第 #50 行：此行记录一条消息，表示 LSM 模块正在初始化。\n- 第 #52 行：此行将 `my_lsm_hooks`\
  \ 数组中定义的 LSM 钩子注册到 LSM 框架。\n- 第 #53 行：此行返回 `0` 表示初始化成功。\n- 第 #57 行：此行定义了 LSM 模块的清理函数。\n\
  - 第 #58 行：此行记录一条消息，表示 LSM 模块正在清理。\n- 第 #61-66 行：这些行指定了 LSM 模块的初始化和清理函数，以及许可证、作者和描述等模块元数据。\n\
  \n总结来说，以下是上述代码的功能列表：\n\n### 访问控制钩子：\n- LSM 驱动拦截了多个访问控制钩子，包括 `inode_permission`、`inode_create`\
  \ 和 `inode_unlink`。这些钩子对于在文件系统对象上执行访问策略至关重要。\n- `inode_permission`：控制权限。钩子函数 `my_lsm_inode_permission`\
  \ 检查当前进程是否有访问该文件的权限。\n- `inode_create`：管理文件创建。钩子函数 `my_lsm_inode_create` 确保当前进程允许在目录中创建文件。\n\
  - `inode_unlink`：处理文件删除。钩子函数 `my_lsm_inode_unlink` 验证当前进程是否有权删除文件。\n\n### 权限检查：\n\
  - 钩子函数利用 LSM 框架提供的 `security_task_is_allowed` 函数来检查当前进程是否允许执行请求的操作。该函数接收当前进程和操作掩码作为参数。\n\
  - 如果访问被拒绝，钩子函数会记录消息并返回相应的错误码。\n\n### 初始化与清理：\n- LSM 驱动分别定义了 `my_lsm_init` 和 `my_lsm_exit`\
  \ 来管理模块的生命周期。\n- 在初始化期间（`my_lsm_init`），驱动通过 `security_add_hooks` 将其钩子（`my_lsm_hooks`）注册到\
  \ LSM 框架。\n- 在清理期间（`my_lsm_exit`），驱动执行必要的清理任务。\n\n### 模块元数据：\n- LSM 模块使用宏 `MODULE_LICENSE`、`MODULE_AUTHOR`\
  \ 和 `MODULE_DESCRIPTION` 提供元数据。\n\n### 日志：\n- 驱动使用 `printk` 记录消息，提供有关访问控制决策以及模块初始化/清理的信息。\n\
  \n### 错误处理：\n- 当访问被拒绝时，驱动返回相应的错误码（例如 `-EACCES`），确保通知调用者失败。\n\n### 可扩展性：\n- 驱动可以根据需要扩展更多的钩子，以实施更广泛的安全策略。例如，可以添加与网络操作、进程创建或系统调用相关的钩子来增强\
  \ LSM 的功能。\n\n本章结束；我们希望你能够更多地了解用于保护系统的机制。这些机制是可选的，并非总是被实现，一方面是因为它们的复杂性，另一方面是因为这会增加对\
  \ CPU/内存资源的消耗开销。然而，对于超安全的服务器或工作站，这些机制是必不可少的，这也是 Android 系统使用 SELinux 或 Tomoyo 的挑战。\n\
  \n在下一章中，我们将通过 GNU/Linux 内核学习内存管理。\n\n加入我们的书籍 Discord 空间\n\n加入书籍的 Discord 工作区，获取最新动态、优惠、全球科技新闻、新发布以及与作者的互动：\n\
