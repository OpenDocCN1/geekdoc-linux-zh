  \n# 第 8 章：网络驱动程序\n\n## 引言\n\n在本章中，我们将看到 Linux 内核最重要的构建模块之一，即网络协议栈。我们将看到从网络卡到其弯折结构的组成部分。此外，我们还将如何使其变得高效。\n\
  \n## 结构\n\n本章涵盖了以下主题：\n\n*   网络协议栈的历史\n*   网络架构\n*   协议层\n*   网络模块\n*   网络驱动程序的加载\n\
  *   `sk_buff`\n*   性能与调优\n*   DPDK 项目\n\n## 目标\n\n在本章结束时，你将能够理解网络协议栈的工作原理，并为网卡开发驱动程序，改进网络协议栈的运行或确保其运行安全。\n\
  \n为了能够管理千比特级的吞吐量，我们将看到 DPDK 开源项目的结构。\n\n## 网络协议栈的历史\n\nLinux 内核中网络层的发展是由几位独立的程序员协调的。目标是实现一个至少与其他系统一样高效的系统，同时保持在自由软件领域。\n\
  \n最重要的是由 Ross Biro 使用基本原语开发的 TCP/IP 协议。Orest Zborowski 为 GNU Linux 内核产生了第一个 BSD\
  \ socket 接口。\n\n随后，代码由红帽公司的 Alan Cox 接管。\n\n下图给出了 Linux 下网络协议栈的发展时间线：\n\n![](img/Figure8.1.png)\n\
  \n图 8.1：GNU/Linux 网络协议栈的起源\n\n在 GNU/Linux 下开发协议栈的关键阶段如下：\n\n*   早期网络支持 (1991-1995)：\n\
  \    *   Linux 在 Linus Torvalds 于 1991 年创建时，最初缺乏内置的网络支持。然而，随着 1991 年 9 月份 0.01 版本的发布，它迅速获得了网络能力。\n\
  \    *   Linux 初始网络支持是原始的，提供了如 TCP/IP 网络和以太网支持等基本功能。\n*   内核版本 1.x 和 2.x (1996-2000)：\n\
  \    *   在 20 世纪 90 年代后期，Linux 网络能力随着每个内核版本的发布显著扩展。\n    *   1996 年 6 月发布的内核 2.0\
  \ 版本对网络协议栈进行了重大增强，包括支持更多网络协议、提高性能和更好的可扩展性。\n    *   1999 年 1 月发布的内核 2.2 版本引入引入了如\
  \ IPv6 支持、增强的路由能力和改进的网络设备驱动程序等功能。\n*   内核版本 2.4 和 2.6 (2001-2006)：\n    *   2001\
  \ 年 1 月发布的内核 2.4 版本 标志着网络领域的一个重要里程碑。它引入了 Netfilter 框架，允许通过 `iptables` 等工具进行数据包过滤。\n\
  \    *   2003 年 12 月发布的内核 2.6 版本为网络协议栈带来了进一步增强，包括可扩展性、网络命名空间和用于事件通知的 `epoll` 系统调用。\n\
  *   内核版本 3.x 和 4.x (2011-2019)：\n    *   2011 年 7 月发布的内核 3.0 版本没有引入重大的网络变化，而是继续优化现有功能。\n\
  \    *   2013 年 6 月发布的内核 3.10 版本引入了 TCP Fast Open 功能，旨在减少 TCP 连接建立的时间。\n    *  \
  \ 2016 年 1 月发布的内核 4.4 版本改进了网络协议栈的性能和可扩展性，并增强了网络协议和安全性。\n    *   2018 年 1 月发布的内核\
  \ 4.15 版本引入了 Retpoline Spectre 缓解措施，解决了网络协议栈及内核其他部分的安全漏洞。\n*   近期进展 (2020 至今)：\n\
  \    *   最近的内核发布侧重于提高安全性、性能，以及对 5G、物联网（IoT）和软件定义网络（SDN）等新兴网络技术的支持。\n\n 网络架构\n\n\
  Linux 网络协议栈是 Linux 内核中一个复杂的系统，负责处理网络的所有方面，包括数据包处理、协议实现、设备驱动程序和网络配置。\n\n以下是 GNU/Linux\
  \ 网络协议栈的详细技术概述：\n\n*   数据包处理\n    *   传入的网络数据包由网络接口接收，接口由内核中的设备驱动程序表示。\n    *  \
  \ 接收后，网络数据包被封装成称为套缓冲区（`sk_buff`）的数据结构，其中包含数据包的元数据，如协议类型、源和目的地址以及指向数据包数据的指针。\n  \
  \  *   内核网络栈通过一系列协议层处理传入的数据包，包括链路层（例如以太网、Wi-Fi）、网络层（例如 IP）、传输层（例如 TCP、UDP）和应用层（例如\
  \ sockets）。\n*   协议实现：\n    *   Linux 内核包含了各种网络协议的实现，如 TCP/IP、UDP、ICMP、IPv4 和 IPv6。\n\
  \n\n\n\n\n- 每个协议都实现为一组函数，负责数据包处理、协议特定操作、错误处理和状态管理。\n- 协议实现之间通过定义良好的接口和数据结构相互交互，从而实现了模块化和可扩展的网络功能。\n\
  \n## 设备驱动\n- Linux 中的网络接口由设备驱动表示，它们负责控制物理或虚拟网络设备。\n- 设备驱动与硬件交互，处理如数据包收发、中断处理和设备初始化等任务。\n\
  - 内核网络子系统为设备驱动提供了统一的接口，允许它们轻松地集成到网络协议栈中。\n\n### Socket 层\n- Linux 中的 Socket 层为应用程序提供了一个接口，使其通过\
  \ socket 进行网络通信。\n- Socket 是通过 IP 地址、端口号和协议类型（例如 TCP、UDP）标识的通信端点。\n- 应用程序通过 `socket()`、`bind()`、`listen()`、`connect()`、`send()`\
  \ 和 `recv()` 等系统调用与 Socket 交互，这些系统调用由内核的 Socket 层实现。\n\n### 路由与转发\n- Linux 内核维护路由表，决定网络数据包如何转发到目的地。\n\
  - 路由决策基于目的 IP 地址和在内核中配置的路由策略。\n- 内核路由子系统还支持高级路由功能，如基于策略的路由、基于源的路由和网络地址翻译 (NAT)。\n\
  \n### 数据包过滤与防火墙\n- Linux 包含了 Netfilter 框架，它提供了数据包过滤和防火墙功能。\n- Netfilter 允许管理员根据源目的地址、端口号和数据包内容等标准定义过滤、修改和转发网络包的规则。\n\
  - `iptables` 和 `nftables` 等工具提供了用户空间接口，用于配置 Netfilter 规则和管理防火墙策略。\n\n### 性能与可扩展性\n\
  - Linux 网络协议栈为性能和可扩展性设计，针对多核处理器、高速网络和高效数据包处理进行了优化。\n- 使用内核旁路（kernel bypass）、零拷贝网络和中断调节等技术来最小化开销并提高吞吐量。\n\
  - 内核网络子系统不断优化和调优，以满足现代网络应用的性能需求。\n\nIP 栈中对刚接收或准备发送的帧的处理可以分为几个层，如图所示：\n\n![](img/Figure8.2.png)\n\
  \n图 8.2：从网卡到用户态的多个层表示\n\n这种 IP 处理包含四个主要阶段：\n\n- **帧接收**：在网络接口上接收到的帧进入 IP 层的入口。\n\
  - **路由**：数据包在另一个接口/网络或本地目的地重传时选择遵循的路径。\n- **转发**：在移动重传阶段之前对 `TTL` 和 `MTU` 进行控制。\n\
  - **传输**：要发送或重传的数据包将通过此阶段。在离开 IP 层之前，完成以太网头的构建。\n\n下图详细说明了 Netfilter 在网络栈上可以使用的钩子（hooks）：\n\
  \n![](img/Figure8.3.png)\n\n图 8.3：GNU/Linux 网络栈全局视图\n\nNetfilter 是 Linux 内核中的一个框架，为数据包过滤、网络地址翻译\
  \ (NAT) 和数据包改写（mangling）提供设施。它由网络栈中的一组钩子（入口）组成，被称为 Netfilter hooks 的内核模块可以在这些处拦截并处理网络包。\n\
  \n它通常用于在基于 Linux 的系统中实现防火墙、NAT 网关、数据包过滤和流量整形，其中每个钩子都是 Linux 内核网络栈中的入口，内核模块可以在此处注册回调函数来拦截网络包。\n\
  \n共有五个主要的 Netfilter 钩子，每个对应数据包处理路径中的一个特定点：\n\n- `NF_INET_PRE_ROUTING`：在数据包进行路由之前调用的钩子。用于数据包过滤和\
  \ NAT 操作。\n- `NF_INET_LOCAL_IN`：当数据包指向本地系统时调用的钩子。用于本地数据包过滤和流量监控。\n- `NF_INET_FORWARD`：当数据包被转发到另一个主机时调用的钩子。用于过滤系统转发的数据包。\n\
  - `NF_INET_LOCAL_OUT`：当数据包从本地系统发送时调用的钩子。用于过滤输出数据包并执行 NAT。\n- `NF_INET_POST_ROUTING`：数据包路由后立即调用的钩子。用于对输出数据包执行\
  \ NAT 操作。\n\nNetfilter 钩子为根据数据包在网络栈中的位置实现数据包过滤和处理提供了灵活性细粒度。\n\n内核模块向 Netfilter 钩子注册回调函数（称为钩子函数），以拦截和处理网络包。每个钩子函数被调用时都会带有一个指向拦截包的\
  \ `sk_buff` 结构指针和其他相关信息。\n\n钩子函数可以检查包头、根据可配置的规则执行包过滤、修改包内容，并采取适当的操作，如接受、丢弃或转发包。\n\
  \n除了钩子和钩子函数外，Netfilter 子系统还包括其他组件，例如管理钩子注册和包遍历的 Netfilter 核心，以及实现特定包过滤和 NAT 功能的各种内核模块。\n\
  \n常见的 Netfilter 模块包括用于包过滤和防火墙的 `iptables`、用于 IPv6 包过滤的 `ip6tables`、用于以太帧过滤的 `ebables`\
  \ 以及用于连接跟踪和 NAT 的 `conntrack`。Netfilter 提供了一个灵活可扩展的框架，用于在基于 Linux 的系统中构建复杂的包过滤和防火墙解决方案。\n\
  \nGNU Linux 内核网络栈不同层中的数据包路由所示：\n\n![](img/Figure_8.4.png)\n\n图 8.4：深度 GNU/Linux\
  \ 网络栈\n\n网卡使用两个列表来管理数据包，即网络接口的入包 (`rx_ring`) 和出包 (`tx_ring`)。因此，我们可以将传输过程与接收过程区分开。对于像\
  \ 2.2 及以下非常旧的内核，帧处理是不同的（例如，我们找不到 `tx` 和 `rx` 文件）。\n\nLinux 内核中的 Netfilter 框架在 `PRE_ROUTING`\
  \ 钩子处拦截数据包并进行相应的处理。\n\n以下是用于该目的的主要组件和函数的说明：\n\n- `hook_func_tunnel_in` 函数：\n   \
  \ - 该函数作为 Netfilter 钩子 `NF_IP_PRE_ROUTING` 的回调，在路由决策做出之前拦截数据包。\n    - 它接收的参数包括钩子号、指向\
  \ `sk_buff` 结构的指针、输入和输出网络设备，以及调用下一个钩子函数的函数指针。\n    - 该函数首先获取 `sk_buff` 结构并提取 IP\
  \ 头。\n    - 然后它检查数据包是否来自特定的输入网络设备（`\"eth0\"`）以及目的 IP 地址是否匹配预定义值（`ip1`）。\n    - 如果满足条件，该函数通过修改数据包的\
  \ MAC 头、调整包长度并将数据包入队列到另一个网络设备（`\"eth1\"`）进行传输来执行隧道封装。\n    - 最后，该函数返回 `NF_STOLEN`\
  \ 表示它已接管了该包的所有权。\n\n- `init_module` 函数：\n\n\n\n\n\n## 功能概述\n\n* 该函数作为初始化 Netfilter\
  \ 模块的入口点。\n\n* 它设置了一个 Netfilter 钩子对象 (`nfho_tunnel_in`)，使用了指定的钩子函数 (`hook_func_tunnel_in`)、钩子编号\
  \ (`NF_IP_PRE_ROUTING`)、协议族 (`PF_INET`) 和优先级 (`NF_IP_PRI_FIRST`)。\n\n* `nf_register_hook`\
  \ 函数将钩子对象注册到 Netfilter 框架，允许其在指定的钩子点拦截数据包。\n\n## `cleanup_module` 函数：\n\n* 该函数作为清理\
  \ Netfilter 模块的退出点。\n\n* 它使用 `nf_unregister_hook` 函数注销之前注册的钩子对象 (`nfho_tunnel_in`)。\n\
  \n## 要构建并安装此 Netfilter 内核模块，请遵循以下步骤：\n\n1. 将提供的代码保存到文件中，例如 `nf_hook.c`。\n2. 在您的系统中设置\
  \ Linux 内核开发环境。\n3. 使用适当的内核构建工具（`gcc`、`make` 等）编译模块。\n4. 使用 `insmod` 将模块加载到内核。\n\
  5. 使用 `lsmod` 和适当的日志机制（`dmesg`、`journalctl` 等）验证模块已加载并正常运行。\n\n以下 Linux 内核模块实现了一个\
  \ Netfilter 钩子，用于拦截和重定向 IPv4 数据包。它捕获 `eth0` 上特定目标 IP 的数据包，修改其 MAC 头，并通过队列规则将其转发到\
  \ `eth1`。该模块使用 `NF_STOLEN` 处理数据包所有权，确保高效的内核隧道传输：\n\n```c\n#include <linux/module.h>\n\
  \n#include <linux/kernel.h>\n#include <linux/netfilter.h>\n#include <linux/netfilter_ipv4.h>\n\
  \n#include <linux/skbuff.h>\n#include <linux/ip.h>\n#include <linux/netdevice.h>\n\
  static unsigned int hook_func_tunnel_in(unsigned int hooknum,\n\nstruct sk_buff\
  \ *skb,\n\nconst struct net_device *in,\n\nconst struct net_device *out,\n\nint\
  \ (*okfn)(struct sk_buff *skb)) {\nstruct iphdr *ip_header;\nstruct net_device *dev;\n\
  struct Qdisc *q;\nint len;\n\n// 检查数据包是否有 IP 头\nif (!skb || !skb_network_header(skb))\n\
  return NF_ACCEPT;\nip_header = ip_hdr(skb);\n\n// 检查数据包是否为 IPv4\nif (ip_header->version\
  \ != 4)\nreturn NF_ACCEPT;\n\n// 检查数据包是否来自 eth0 且目标 IP 为 ip1\nif (in && strcmp(in->name,\
  \ \"eth0\") == 0 && ip_header->daddr == htonl(ip1)) {\nlen = skb->len;\n// 执行隧道处理\n\
  skb_push(skb, ETH_HLEN);\nskb_reset_mac_header(skb);\nmemcpy(skb->data, hd_mac2,\
  \ ETH_ALEN * 2);\n\n// 将数据包入队以便在 eth1 上传输\ndev = dev_get_by_name(\"eth1\");\nif\
  \ (!dev)\nreturn NF_ACCEPT;\nq = dev->qdisc;\nspin_lock_bh(&dev->queue_lock);\n\
  q->enqueue(skb, q);\nqdisc_run(dev);\nspin_unlock_bh(&dev->queue_lock);\nreturn\
  \ NF_STOLEN; // 表示我们已经获取了数据包的所有权\n}\nreturn NF_ACCEPT; // 允许数据包正常继续\n}\n\n// Netfilter\
  \ 钩子结构\nstatic struct nf_hook_ops nfho_tunnel_in = {\n.hook = hook_func_tunnel_in,\n\
  .hooknum = NF_INET_PRE_ROUTING, // IPv4 使用 NF_INET_PRE_ROUTING\n.pf = NFPROTO_IPV4,\
  \ // IPv4 使用 NFPROTO_IPV4\n.priority = NF_IP_PRI_FIRST,\n};\n\n// 模块初始化函数\nstatic\
  \ int __init nf_hook_init(void) {\nint ret;\n// 注册 Netfilter 钩子\nret = nf_register_hook(&nfho_tunnel_in);\n\
  if (ret < 0) {\nprintk(KERN_ERR \"Failed to register Netfilter hook\\n\");\nreturn\
  \ ret;\n}\nprintk(KERN_INFO \"NF_HOOK: Module installed\\n\");\nreturn 0;\n}\n\n\
  // 模块清理函数\nstatic void __exit nf_hook_exit(void) {\n// 注销 Netfilter 钩子\nnf_unregister_hook(&nfho_tunnel_in);\n\
  printk(KERN_INFO \"NF_HOOK: Module removed\\n\");\n}\nmodule_init(nf_hook_init);\n\
  module_exit(nf_hook_exit);\nMODULE_LICENSE(\"GPL\");\nMODULE_AUTHOR(\"BPB\");\n\
  MODULE_DESCRIPTION(\"Netfilter hook example\");\n```\n\n以上是上述代码的关键行：\n\n* 第 1/7\
  \ 行：头文件：包含了 Netfilter、skb、IP 头和 netdevice 必要的头文件。\n* 第 20 行：函数参数检查：增加了检查，确保在访问成员之前函数参数（`skb`,\
  \ `in`）不为 `NULL`。\n* 第 26 行：IPv4 检查：增加了检查，在访问 IP 头之前确保数据包为 IPv4。\n* 第 30 行：字节序转换：使用\
  \ `htonl()` 在与 `ip1` 比较之前将目标 IP 地址转换为网络字节序。\n* 第 52 行：返回值：将 `NF_STOLEN` 改为 `NF_ACCEPT`。\n\
  * 第 63/86 行：模块初始化：将 `nf_hook_init` 重命名为 `nf_hook_init()`。\n* 第 79/87 行：模块清理：将 `nf_hook_exit`\
  \ 重命名为 `nf_hook_exit()`。\n* 第 89/91 行：模块信息：添加了模块元数据，如许可证和描述。\n\n\n\n\n\n## 传输层\n\
  \n传输层负责为运行在不同主机上的应用程序提供端到端通信。\n- 在 Linux 中，传输层包括传输控制协议（`TCP`）和用户数据报协议（`UDP`）。\n\
  - `TCP` 提供可靠的面向连接的通信，具有流量控制、拥塞控制和错误恢复等特性。\n- `UDP` 提供不可靠的、无连接的通信，开销最小，适用于流媒体传输和在线游戏等实时应用。\n\
  - Linux 内核包含了分别对应 `TCP` 和 `UDP` 的协议实现（`tcp` 和 `udp`），并通过 `socket()`、`bind()`、`connect()`、`send()`\
  \ 和 `recv()` 等系统调用支持基于 socket 的通信。\n\n## 应用层（第 5-7 层）\n\n- 应用层涵盖了实现特定网络应用和服务的各种协议和服务。\n\
  - 在 Linux 中，应用层包括超文本传输传输协议（`HTTP`）、文件传输协议（`FTP`）、简单邮件传输协议（`SMTP`）和域名系统（`DNS`）。\n\
  - 运行在 Linux 上的应用程序通过操作系统或第三方软件提供的库和 API 使用这些协议。\n- Linux 中应用服务的示例包括：用于提供网页的 Apache\
  \ `HTTP` 服务器、用于发送和接收电子邮件的 Postfix 邮件服务器，以及用于解析域名的 BIND `DNS` 服务器。\n\n下表列出了网络协议实现随时间的演变：\n\
  \n| 内核版本 | 协议支持 |\n| :--- | :--- |\n| 1.x (早期) | 基础 `TCP/IP` 网络（`IPV4`, `TCP`, `UDP`,\
  \ `ICMP`） |\n| 2.0 (1996) | `IPV4`, `TCP`, `UDP`, `ICMP`, `ETHERNET`, `PPP`, `SLIP`\
  \ |\n| 2.2 (1999) | `IPV4`（增强）、`ARP`, `RARP`, `IP` 转发与路由、`Ethenrt`、`PPP`, `SLIP`,\
  \ `DHCP`, `BOOTP`, `VLAN` 标记 |\n| 2.4 (2001) | `IPV4`（改进）、`IPV6`（早期支持）、`IPSEC`,\
  \ `ARP`, `RARP`, `IP` 转发与路由、`Ethernet`, `PPP` |\n| 2.6 (2003) | `IPV4`, `IPV6`,\
  \ `ARP`, `RARP`, `IP` 转发与路由、`Ethernet`, `PPP`, `VLAN` 标记、`IGMP`, `Multicast` |\n\
  | 3.x (2011) | `IPV4`, `IPV6`（优化）、`ARP`, `RARP`, `IP` 转发与路由、`Ethernet`, `PPP`, `VLAN`\
  \ 标记、`IGMP`, `Multicast` |\n| 4.x (2015) | `IPV4`, `IPV6`, `ARP`, `RARP`, `IP` 转发与路由、`Ethernet`,\
  \ `PPP`, `VLAN` 标记、`IGMP`, `Multicast` |\n\n表 8.1：GNU/Linux 版本的协议演变\n\n## 网络模块\n\
  \n在 GNU/Linux 语境下，网络驱动程序是负责 Linux 内核与网络硬件设备之间通信的软件组件。这些驱动程序对于网网卡（`NICs`）、无线适配器和其他网络设备的运行至关重要。让我们仔细观察\
  \ GNU/Linux 网络驱动程序的关键组件和特性：\n\n### 设备驱动程序接口\n- Linux 中的网络驱动程序通常实现为内核模块或直接构建内核内核。\n\
  - 它们通过网络设备接口规范（`NDIS`）与 Linux 内核交互，该规范为网络驱动程序提供了标准化接口，用于注册、处理网络设备操作以及与网络栈的高层通信。\n\
  \n### 硬件抽象\n- 网络驱动程序抽象了底层网络硬件的细节，为 Linux 内核和网络栈提供了统一的接口。\n- 它们管理特定的硬件任务，如初始化设备、配置硬件参数（例如\
  \ `MAC` 地址、`MTU`）、处理中断以及收发网络包。\n\n### 数据包处理\n- 网络驱动程序负责将传出的数据包从内核发送到网络设备，并从设备接收入站包。\n\
  - 它们实现了收包逻辑，包括缓冲区管理、数据包队列以及用于系统内存与网络设备之间高效数据传输的内存访问（`DMA`）操作。\n\n### 中断处理\n- 网络驱动程序处理由网络设备生成的中断，用指示入站包的到达、传输操作的完成或硬件事件的发生。\n\
  - 它们在 Linux 内核中注册中断处理程序以响应中断信号，处理入站包并执行必要的操作以维持网络连接和性能。\n\n### 错误处理与恢复\n- 网络驱动程序实现了错误检测和恢复机制，以处理硬件错误、网络故障以及任何异常情况。\n\
  - 它们监控网络设备的状态，检测错误或异常，并采取适当措施，如重置设备、重试失败的操作或将错误报告给内核进行进一步处理。\n\n### 配置与管理\n- 网络驱动程序通过\
  \ Linux `sysfs` 接口暴露配置参数和统计信息，允许管理员动态查询和调整驱动设置。\n- 它们支持链路聚合、`VLAN` 标记、混杂模式和卸载能力（例如校验和卸载、分段卸载），以优化网络性能和功能。\n\
  \nGNU/Linux 中的网络驱动程序包括用于 Intel 千兆太网控制器的 `e1000e` 驱动、用于 Atheros 无线局域网适配器的 `ath9k`\
  \ 驱动以及用于 Intel 万兆太网适配器的 `ixgbe` 驱动。\n\n网络驱动程序是块设备驱动和字符设备之后的第三类 Linux 驱动程序。\n\n系统内部网络接口的操作与块驱动非常相似。块驱动被内核核心用于传输或接收数据块。从类似的角度来看，网络驱动程序向内核注册，以便与外部世界交换数据包。\n\
  \n然而，它与块驱动的区别在于，块驱动在专用的目录 `/dev` 中没有条目。因此，无法应用“Unix/GNU Linux 中一切皆视为文件”的规则。\n\n\
  这两类驱动程序之间最重要的区别是：块驱动需要在发送发送到内核之前进行准备，而网络驱动程序则要求推送数据。\n\n下图显示了 GNU/Linux 内核驱动程序的不同分类：\n\
  \n![](img/Figure8.6.png)\n\n图 8.6：GNU/Linux 下的驱动程序分类。\n\n网络架构允许 Linux 内核通过网络连接到其他系统。存在大量的硬件和支持的协议。\n\
  \n每个网络对象都通过 `socket` 表示。`Sockets` 与进程关联，就像文件系统中的 `i-nodes` 可以关联一样。一个 `socket` 可以被多个进程共享。\n\
  \n网络架构使用 Linux 内核进程调度器 `schedule()` 来挂起或恢复处于等待数据状态（由控制和数据流管理系统管理）的进程。此外，`VFS` 层提供了逻辑文件系统（例如\
  \ `NFS` 的情况；在用户模式下通过 `libfuse` 也有可能性）。\n\n下图显示了与 `VFS` 和网络栈交互的不同块的细节：\n\n![](img/Figure8.7.png)\n\
  \n图 8.7：GNU/Linux 下网络栈的模块化或分层划分\n\n所有网卡可以通过两种不同的方式与内核交互：\n\n- 轮询：内核定期检查设备状态以查看是否有需要处理的操作。\n\
  \n\n\n\n\n-   **中断 (Interrupts)**：卡以中断的形式向内核发送信号，通知内核有需要处理的任务：\n    - **硬件**：接收来自网络接口的传入数据包并将其直接放置在输入队列中。\n\
  \    - **软件 (`NET_RX_SOFTIRQ`)**：执行接收包处理程序。它负责管理协议。传入的数据包由此中断处理并放入队列中。要转发的数据包被放在输出接口的输出队列中。\n\
  \n以下来自网络驱动程序源码（`drivers/net/3c59x.c`）的代码示例，适用于内核 `2.2.14`。其中存在大量的 `#ifdef MODULE`\
  \ 和 `#if defined (MODULE)`：\n\n```c\n#if defined(MODULE) && LINUX_VERSION_CODE >\
  \ 0x20115\n\nMODULE_AUTHOR(\"Donald Becker <becker@cesdis.gsfc.nasa.gov>\");\n\n\
  MODULE_DESCRIPTION(\"3Com 3c590/3c900 series Vortex/Boomerang driver\");\n\nMODULE_PARM(debug,\
  \ \"i\");\n\n...\n\n#endif\n\n...\n\n#ifdef MODULE\n\nint init_module(void)\n\n\
  {\n\n...\n\n}\n\n#else\n\nint tc59x_probe(struct device *dev)\n\n{\n\n...\n\n}\n\
  \n#endif /* not MODULE */\n```\n\n这非常典型地代表了旧的编程方式，即动态模块的操作基于其在内核镜像中作为静态模块编译的方式定义的。\n\
  \n...\n\n```c\nstatic int vortex_scan(struct device *dev, struct pci_id_info pci_tbl[])\n\
  \n{\n\n...\n#if defined(CONFIG_PCI) || (defined(MODULE) && !defined(NO_PCI))\n\n\
  ...\n\n#ifdef MODULE\nif (compaq_ioaddr) {\nvortex_probe1(0, 0, dev, compaq_ioaddr,\
  \ compaq_irq,\ncompaq_device_id, cards_found++);\ndev = 0;\n}\n\n#endif\nreturn\
  \ cards_found ? 0 : -ENODEV;\n}\n\n...\n\n#ifdef MODULE\nvoid cleanup_module(void)\n\
  {\n... ... ...\n}\n\n#endif\n```\n\n在这个新版本中，不再需要预处理指令，从而移除了所有的 `#ifdef` 和 `#endif`。这使得通过使用一组宏（`__init`、`__exit`\
  \ 和 `__devinitdata`），驱动程序开发人员更容易阅读代码：\n\n```c\nstatic char version[] __devinitdata\
  \ = DRV_NAME \" ... \";\n\nstatic struct vortex_chip_info {\n\n...\n\n}\n\nvortex_info_tbl[]\
  \ __devinitdata = {\n{\"3c590 Vortex 10Mbps\",\n... ... ...\n}\n\nstatic int __init\
  \ vortex_init (void)\n\n{\n\n...\n}\n\nstatic void __exit vortex_cleanup (void)\n\
  {\n...\n}\n\nmodule_init(vortex_init);\n\nmodule_exit(vortex_cleanup);\n```\n\n\
  这里是一个可以管理网卡的示例代码：\n\n```c\n#include <linux/module.h>\n#include <linux/pci.h>\n#include\
  \ <linux/netdevice.h>\n#include <linux/etherdevice.h>\n\n#define DRIVER_NAME \"\
  my_ethernet_driver\"\n\nstruct my_priv_data {\nstruct net_device *netdev;\nstruct\
  \ pci_dev *pdev;\n// 添加任何驱动特定的数据在此处\n};\n\nstatic int my_probe(struct pci_dev *pdev,\
  \ const struct pci_device_id *ent)\n{\nstruct my_priv_data *priv;\nstruct net_device\
  \ *netdev;\n// 为驱动私有数据分配内存\npriv = kzalloc(sizeof(struct my_priv_data), GFP_KERNEL);\n\
  if (!priv)\nreturn -ENOMEM;\n// 初始化 PCI 设备\nif (pci_enable_device(pdev))\ngoto err_free_priv;\n\
  // 启用主线并设置其他 PCI 配置\npci_set_master(pdev);\n// 分配并初始化网络设备结构\nnetdev = alloc_etherdev(sizeof(struct\
  \ my_priv_data));\nif (!netdev)\ngoto err_disable_dev;\npriv->netdev = netdev;\n\
  priv->pdev = pdev;\n// 设置设备特定参数（例如 MAC 地址、MTU）\n// 示例：ether_setup(netdev);\n// 设置驱动特定的数据和函数\n\
  // 示例：netdev->netdev_ops = &my_netdev_ops;\n// 向内核注册网络设备\nif (register_netdev(netdev))\n\
  goto err_free_netdev;\n//在此处添加设备特定的初始化代码\nreturn 0;\nerr_free_netdev:\nfree_netdev(netdev);\n\
  err_disable_dev:\npci_disable_device(pdev);\nerr_free_priv:\nkfree(priv);\nreturn\
  \ -ENODEV;\n}\n\nstatic void my_remove(struct pci_dev *pdev)\n{\nstruct my_priv_data\
  \ *priv = pci_get_drvdata(pdev);\nstruct net_device *netdev = priv->netdev;\n//\
  \ 取消网络设备注册\nunregister_netdev(netdev);\n// 释放网络设备结构\nfree_netdev(netdev);\n// 禁用\
  \ PCI 设备\npci_disable_device(pdev);\n// 释放驱动私有数据\nkfree(priv);\n}\n\n// PCI 设备 ID\
  \ 表\nstatic const struct pci_device_id my_pci_tbl[] = {\n{ PCI_DEVICE(0x1234, 0x5678)\
  \ }, // 供应商和设备 ID\n{ 0, },\n};\nMODULE_DEVICE_TABLE(pci, my_pci_tbl);\n\n// PCI\
  \ 驱动结构\nstatic struct pci_driver my_driver = {\n.name = DRIVER_NAME,\n.id_table\
  \ = my_pci_tbl,\n.probe = my_probe,\n.remove = my_remove,\n};\n\n// 模块初始化\nstatic\
  \ int __init my_init(void)\n{\nreturn pci_register_driver(&my_driver);\n}\n\n//\
  \ 模块清理\nstatic void __exit my_exit(void)\n{\npci_unregister_driver(&my_driver);\n\
  }\n\nmodule_init(my_init);\nmodule_exit(my_exit);\nMODULE_LICENSE(\"GPL\");\nMODULE_AUTHOR(\"\
  BPB\");\nMODULE_DESCRIPTION(\"My Ethernet Driver\");\n```\n\n现在，让我们解释这段代码的主要技术方面：\n\
  \n-   **包含与定义**：\n    - 该代码包含了 Linux 内核模块开发所需的头文件（`<linux/module.h>`, `<linux/pci.h>`,\
  \ `<linux/netdevice.h>`, `<linux/etherdevice.h>`）。\n    - 它定义了驱动名称宏（`DRIVER_NAME`）。\n\
  - **驱动数据结构**：\n    - `struct my_priv_data`：该结构存储了驱动特定的数据，例如指向网络设备（`netdev`）和 PCI\
  \ 设备（`pdev`）的指针。\n- **探测函数 (`my_probe`)**：\n    - 该函数在驱动加载且检测到匹配的 PCI 设备时调用。\n \
  \   - 它初始化 PCI 设备，为驱动私有数据分配内存，设置网络设备并向内核注册。\n- **移除函数 (`my_remove`)**：\n    - 该函数在驱动卸载或关联\
  \ PCI 设备移除时调用。\n    - 它取消网络设备注册，释放分配的资源，并禁用 PCI 设备。\n- **PCI 设备 ID 表**：\n    - `my_pci_tbl`：此表列出了驱动支持的\
  \ PCI 设备 ID。\n- **PCI 驱动结构**：\n    - `my_driver`：该结构定义了 PCI 驱动，包括其名称、支持的设备 ID、探测函数和移除函数。\n\
  - **模块初始化与清理**：\n    - `my_init`：该函数在模块加载时调用。它在内核中注册 PCI 驱动。\n    - `my_exit`：该函数在模块卸载时调用。它注销\
  \ PCI 驱动。\n- **模块信息**：\n    - `MODULE_LICENSE`、`MODULE_AUTHOR` 和 `MODULE_DESCRIPTION`\
  \ 宏提供了有关模块的信息，例如其许可证、作者和描述。\n\n\n\n\n\n当网络驱动程序加载到 Linux 内核时，会发生几个阶段来初始化驱动程序并使其运行。以下是所涉及的主要步骤：\n\
  \n### 检测与初始化\n- 当 Linux 内核启动时，它会扫描系统硬件以检测网络设备。\n- 如果检测到网络设备，内核会加载相应的驱动模块或固件来初始化该设备。\n\
  - 这一检测过程可以通过多种机制实现，例如 PCI 总线枚举、USB 设备检测或特定平台的探测。\n\n### 驱动注册\n- 一旦检测到网络设备并加载了相应的驱动模块，驱动程序就会向\
  \ Linux 内核注册自身。\n- 注册涉及向内核提供回调函数和数据结构，这些结构定义了驱动程序如何与网络子系统交互。\n- 驱动程序向内核的网络设备接口注册，该接口管理网络设备及其相关的驱动程序。\n\
  \n### 数据结构初始化\n- 注册后，驱动程序初始化数据处理和设备管理所需的内部数据结构和资源。\n- 这包括为数据包收发分配内存缓冲区、设置 DMA 操作以及初始化硬件寄存器。\n\
  \n### 设备配置\n- 驱动程序根据设备能力和系统网络配置配置网络设备。\n- 这可能涉及设置参数，如设备的 MAC 地址、最大传输单元（MTU）、工作模式（例如混杂模式）以及中断处理设置。\n\
  \n### 中断处理设置\n- 如果网络设备产生中断以信号如数据包接收或传输完成等事件，驱动程序将设置中断处理。\n- 这通常涉及向内核注册中断处理程序，以处理网络设备生成的中断。\n\
  - 中断处理程序负责处理传入的数据包、管理数据包队列并协调数据包传输。\n\n### 设备激活\n- 初始化并配置完成后，网络设备被激活并准备好发送和接收网络数据包。\n\
  - 驱动程序可能会启用设备的发送和接收队列，启动 DMA 操作并将设备投入运行状态。\n\n### 内核通知\n- 网络驱动程序完成初始化过程后，可能会通知内核或其他系统组件设备已准备就绪。\n\
  - 此通知可能包括发送系统日志、通过内核事件子系统发布事件或更新系统状态指示器。\n\n# `sk_buff`\n\n当网卡必须发送或接收数据包时，会创建一个\
  \ `sk_buff`。插入到网络栈中的数据包在进入用户空间部分或可能被删除之前，永远不会被复制。\n\n该控制结构特别包含：\n- 表示以太网、网络和传输层的结构\n\
  - 用于在 `sk_buffers` 列表中管理 `sk_buffer` 的指针\n- 关于输入/输出设备的信息\n- 关于数据包类型的信息（广播、组播等）\n\
  - 包含数据包本身的缓冲区\n\n一个与 `sk_buffer` 关联的内存块描述，其中一个是空的，另一个是经过初始化的包含数据包的内存块。\n\n这个由双向链表使用的头部允许高效地管理网络栈中的数据包。下图的左半显示了一个未初始化的内存块，右图是一个已初始化的内存块：\n\
  \n![](img/Figure8.11.png)\n\n图 8.11：`sk_buf` 头的细节\n\n后续章节将讨论如何使用单链表或双链表。\n\n![](img/Figure8.12.png)\n\
  \n图 8.12：网络栈数据包的双链表\n\n链头节点由以下数据结构定义：\n\n```\nstruct sk_buff_head {\n  /* 这两个成员必须在最。\
  \ */\n  struct sk_buff *next;\n  struct sk_buff *prev;\n  __u32 qlen;\n  spinlock_t\
  \ lock;\n};\n```\n\n![](img/Figure8.13.png)\n\n图 8.13：头部 `sk_buff` 的细节\n\n它的初始化非常简单：\n\
  \n![](img/Figure8.14.png)\n\n图 8.14：`sk_buff` 双链表的初始化\n\n以下是用于处理 `sk_buff` 结构的一些主要宏和函数：\n\
  \n- 宏：`skb_alloc(size, priority, fclone)`：分配一个带有指定大小的新 `sk_buff` 结构。\n    - `size`：要分配的数据缓冲区的大小。\n\
  \    - `priority`：分配的优先级。\n    - `fclone`：指示是否分配缓冲区完整克隆（深拷贝）的标志。\n    - 示例：`skb_alloc(1500,\
  \ GFP_KERNEL, 0)`\n- 宏：`skb_clone(skb, priority)`：创建现有 `sk_buff` 结构的浅拷贝。\n    -\
  \ `skb`：指向原始 `sk_buff` 结构的指针。\n    - `priority`：分配的优先级。\n    - 示例：`skb_clone(skb_orig,\
  \ GFP_KERNEL)`\n- 函数：`skb_put(skb, len)`：调整 `sk_buff` 结构的尾指针，为额外数据留出空间。\n    - `skb`：指向\
  \ `sk_buff` 结构的指针。\n    - `len`：向缓冲区添加的字节数。\n    - 返回指向新增空间起始的指针。\n    - 示例：`skb_put(skb,\
  \ 100)`\n- 函数：`skb_pull(skb, len)`：从 `sk_buff` 结构的开始移除数据。\n    - `skb`：指向 `sk_buff`\
  \ 结构的指针。\n    - `len`：向缓冲区添加的字节数（注：原文此处描述可能有误，应为移除长度）。\n    - 示例：`skb_pull(skb,\
  \ 50)`\n- 函数：`skb_reserve(skb, len)`：在 `sk_buff` 头部为额外的头部预留空间。\n    - `skb`：指向 `sk_buff`\
  \ 结构的指针。\n    - `len`：预留的字节数。\n    - 示例：`skb_reserve(skb, 32)`\n- 函数：`skb_copy_expand(skb,\
  \ new_len, headroom, tailroom)`：将 `sk_buff` 的内容拷贝到大小扩展且具有额外头部空间/尾部空间的新缓冲区。\n   \
  \ - `skb`：指向原始 `sk_buff` 结构的指针。\n    - `new_len`：缓冲区的新大小。\n    - `headroom`：预留的额外头部空间。\n\
  \    - `tailroom`：预留的额外尾部空间。\n    - 返回指向新 `sk_buff` 结构的指针。\n    - 示例：`skb_copy_expand(skb_orig,\
  \ new_len, 16, 16)`\n- 函数：`skb_clone_sk(skb)`：创建 `sk_buff` 的深拷贝，包括相关的套接字和传输头部。\n\
  \    - `skb`：指向原始 `sk_buff` 结构的指针。\n    - 返回克隆 `sk_buff` 结构的指针。\n    - 示例：`skb_clone_sk(skb_orig)`\n\
  \n# 性能与调优\n\n调优 Linux 网络栈涉及调整各种参数，以针对特定负载和环境优化网络性能、吞吐量、延迟和资源利用。\n\n以下是用于调优 Linux\
  \ 网络栈的常用参数：\n\n### TCP/IP 参数\n- `net.ipv4.tcp_mem`：定义分配给 TCP 缓冲区的最小、初始和最大内存。\n-\
  \ `net.ipv4.tcp_window_scaling`：启用 TCP 窗口缩放以支持大带宽延迟乘积。\n- `net.ipv4.tcp_timestamps`：启用\
  \ TCP 时间戳，用于往返时间测量和拥塞控制。\n- `net.ipv4.tcp_sack`：启用选择性确认 (SACK)，以便更高效地重传丢失的数据包。\n\
  - `net.ipv4.tcp_syncookies`：启用 TCP SYN Cookie 以缓解 SYN 洪水攻击。\n- `net.ipv4.tcp_tw_reuse`\
  \ 和 `net.ipv4.tcp_tw_recycle`：控制 TCP TIME-WAIT 状态字的复用和回收。\n- `net.core.rmem_default`\
  \ 和 `net.core.wmem_default`：定义默认的套接字接收和发送缓冲区大小。\n- `net.core.rmem_max` 和 `net.core.wmem_max`：定义最大的套接字接收和发送缓冲区大小。\n\
  \n\n\n\n\n## 内核参数\n\n- `net.ipv4.tcp_keepalive_time`, `net.ipv4.tcp_keepalive_intvl`,\
  \ `net.ipv4.tcp_keepalive_probes`: 配置 TCP 存活设置。\n\n### 网络接口参数\n- `net.core.netdev_max_backlog`:\
  \ 设置网络接口接收数据包队列的最大长度。\n- `net.core.dev_weight`: 调整网络接口在负载均衡中的权重。\n- `net.ipv4.tcp_mtu_probing`:\
  \ 开启 TCP 最大传输单元 (MTU) 探测用于路径 MTU 发现。\n- `net.ipv4.tcp_congestion_control`: 指定 TCP\
  \ 拥塞控制算法（例如 `cubic`、`reno`、`bbr`）。\n\n### 缓冲区与内存管理参数\n- `net.core.optmem_max`: 定义为网络相关缓冲区分配的最大内存量。\n\
  - `net.ipv4.tcp_mem`: 指定分配给 TCP 缓冲区的最小、初始和最大内存。\n- `net.ipv4.udp_mem`: 指定分配给 UDP\
  \ 缓冲区的最小、初始和最大内存。\n- `vm.dirty_background_bytes` 和 `vm.dirty_bytes`: 分别控制触发后台写入和同步写入之前的脏内存量。\n\
  \n### 数据包处理参数\n- `net.core.busy_poll`: 开启忙轮模式以降低网络延迟。\n- `net.core.dev_weight`:\
  \ 设置网络接口在负载均衡中的权重。\n- `net.core.somaxconn`: 指定监听队列中等待连接的最大数量。\n- `net.ipv4.tcp_fastopen`:\
  \ 开启 TCP 快速打开 (Fast Open)以减少连接建立的延迟。\n- `net.ipv4.tcp_fin_timeout`: 指定关闭活动 TCP 连接的超时时间。\n\
  \n### 安全与防火墙参数\n- `net.ipv4.conf.all.accept_redirects` 和 `net.ipv4.conf.all.secure_redirects`:\
  \ 控制 IPv4 ICMP 重定向接受和安全重定向设置。\n- `net.ipv4.conf.default.rp_filter`: 设置默认的反向路径过滤\
  \ (RPFilter) 模式。\n- `net.ipv4.conf.all.accept_source_route`: 控制 IPv4 源路由接受。\n- `net.ipv4.conf.all.log_martians`:\
  \ 记录可疑的 IPv4 数据包（Martian 包）。\n\n### IPv6 参数\n- 类似于 IPv4 对应的参数，用于调整 IPv6 行为。\n- `net.ipv6.conf.all.disable_ipv6`:\
  \ 禁用所有接口上的 IPv6。\n\n### 防火墙参数 (iptables/nftables)\n- 用于配置数据包过滤、NAT 和连接跟踪规则的各种参数。\n\
  - 可以 `netfilter` 和 `nft` 命令管理防火墙规则和设置。\n\n## sysctl 命令\n\n所有这些参数都可以通过 `sysctl` 命令进行修改。`sysctl`\
  \ 是 Linux 中的一种命令行工具，用于运行时动态查看、设置和管理内核参数。\n\n它允许管理员配置内核行为和性能的各个方面，例如网络设置、虚拟内存管理和安全选项。\n\
  \n通过 `sysctl`，用户可以查询内核参数的当前值，临时修改它们，或通过编辑配置文件使更改在重启后依然有效。\n\n`sysctl` 命令通常用于调整网络缓冲区大小、启用/禁用\
  \ IP 转发、调整 TCP 参数以及控制进程调度等任务。\n\n管理员可以使用 `sysctl -a` 探索可用的内核参数及其当前值，而可以使用 `sysctl\
  \ -w` 修改特定参数。\n\n使用 `sysctl` 进行的配置更改会立即生效，影响运行系统的行为而无需重启。然而，为了使更改在重启后持久化，管理员应该更新相应的配置文件，例如\
  \ `/etc/sysctl.conf` 或 `/etc/sysctl.d/` 目录下的文件。\n\n在使用 `sysctl` 修改内核参数时务必保持谨慎，因为错误的设置可能会影响系统的稳定性、性能和安全性。\n\
  \n`sysctl` 工具提供了一种强大的机制，可以微调 Linux 内核以适应特定的工作负载、硬件配置和安全需求。\n\n总的来说，`sysctl` 是系统管理员的一种多功能工具，用于根据其需求优化和自定义\
  \ Linux 内核的行为。\n\n## 零拷贝网络\n\n这是一项旨在估算将数据包拷贝到网络栈中的成本（时间和内存消耗）：即网络数据包从网卡到 BSD Socket\
  \ 的内存拷贝估计：\n\n![](img/Figure8.15.png)\n\n图 8.15：该研究使用的网络栈高层视图\n\n零拷贝（或零拷贝网络）是网络栈设计（包括\
  \ Linux 网络栈）中的一个重要概念。它指的是数据从一个内存缓冲区传输到另一个缓冲区，而无需 CPU 进行中间拷贝的技术。\n\n零拷贝机制不是在内核空间和用户空间之间或不同内核缓冲区之间拷贝数据，而是允许数据直接从源缓冲区传输到目标缓冲区，通常通过\
  \ `DMA` 等机制实现。\n\n零拷贝网络很重要基于以下几点：\n\n- **减少 CPU 开销**：通过消除对数据中间拷贝的需求，零拷贝网络减少了与内存拷贝相关的\
  \ CPU 开销。这可以显著提高性能，特别是对于处理海量数据的高速网络应用。\n- **更低的延迟**：在缓冲区之间拷贝数据涉及 CPU 处理和内存访问，这可能会在数据包处理中引入延迟。零拷贝机制通过跳过这些中间步骤使延迟最小化，允许数据更快地通过网络栈传输。\n\
  - **提高吞吐量**：通过减少 CPU 开销和延迟，零拷贝网络可以提高整体吞吐量，从而实现更高的数据传输率。\n- **改进资源利用率**：通过减少数据拷贝操作消耗的\
  \ CPU 时间和内存带宽，零拷贝网络有助于优化系统资源利用率。\n- **能源效率**：通过减少 CPU 使用和内存访问，零拷贝网络有助于提高网络系统的能源效率，特别是在功率受限的移动设备和数据环境中。\n\
  \n在 Linux 中，各种机制和 API 支持零拷贝网络，包括：\n\n- **套字缓冲区 (`sk_buff`)**：Linux 的 `sk_buff` 数据结构支持零拷贝网络，允许在内核和用户空间之间处理数据包无需拷贝。\n\
  - **直接 I/O (DIO)**：Linux 提供了 `sendfile()` 和 `splice()` 等接口，支持文件描述符和网络套字之间的零拷贝传输。\n\
  - **内存映射 I/O (`mmap`)**：Linux 支持内存映射 I/O (`mmap`) 操作，允许用户空间进程直接访问内核缓冲区。\n\n总的来说，零拷贝网络是一项重要的优化技术，有助于提高网络系统的性能、效率和可扩展性，使其成为\
  \ Linux 等现代网络栈中非常有价值的功能。\n\n让我们进入细节：\n\n![](img/Figure8.16.png)\n\n图 8.16：网络栈中的工作流\n\
  \n数据包的接收围绕缓冲区环形展开：\n\n![](img/Figure8.17.png)\n\n图 8.17：Rx 处理\n\n下图详细描述了传输栈流：\n\n\
  ![](img/Figure8.18.png)\n\n图 8.18：Tx 处理\n\n可以使用 `ethtool` 工具管理环形缓冲区：\n\n如果可能，可以更改\
  \ Tx 和 Rx 的环形缓冲区大小：\n\n```bash\nsudo ethtool enp3s0 -G tx 256 rx 256\n```\n\n\n\n\
  \n研究每秒通过 UDP 和 TCP 发送 1024 字节包的 TCP/IP 网络栈各层的延迟，结果如下：\n\n- 总体而言，1024 字节的拷贝时间为 1\
  \ µs，调用 BSD socket 系统原语的时间约为 2 µs，UDP 中的校验和时间也为 2 µs。\n- 从性能角度来看，在设备和内存之间使用 DMA\
  \ 数据是一个真正的优势。\n- 网络驱动程序传输数据包的时间低于 2 µs，但在接收端，由于驱动程序在接收模式下固有的复杂性，时间增加到约 4 µs。此外，最后这种模式存在不可忽视的内存拷贝。\n\
  - UDP：在需要校验和的情况下，UDP 发送 1024 字节的时间为 18.9 µs，而接收该请求需要 35 µs。因此，UDP 的最大发送能力为 433 Mbits/s，接收速率为\
  \ 234 Mbps。\n- TCP：使用 TCP 协议，发送 1024 字节包需要 22.5 µs，接收需要 36 µs。传输的最大速度为 364Mbits/s，接收为\
  \ 228Mbits/s。\n\n当接收者/发送者为本地（`localhost`）时，最大容量约为 150 Mbit/s。\n\n在 GNU Linux 内核中，内存拷贝、校验和系统调用所需的总时间，TCP\
  \ 传输部分占 22%，相同协议的接收部分占 16.7%。UDP 也是如此。\n\n# DPDK 项目\n\nDPDK 全称为数据平面开发包（Data Plane\
  \ Development Kit），是一个开源项目，提供了一系列库和驱动，用于加速软件网络数据面的包处理任务。DPDK 主要由 Intel 开发，旨在优化通用硬件上的数据包处理性能，特别是对于需要高吞吐量、低延迟和可扩展性的网络应用。\n\
  \nDPDK 是一个革命性的软件组件，能够实现高达数个比特的速度，这是真正的技术性能。这就是为什么 DPDK 经常与特定的网卡配合使用，例如带有两个光纤 SFP\
  \ 笼罩的 NVIDIA CONNECTX-6 DX 网卡。\n\n以下是官方网站 [`www.dpdk.org`](https://www.dpdk.org)\n\
  \n以下是 DPDK 项目关键特性和组件的介绍：\n\n- 包处理加速：\n    - DPDK 提供了一个框架，通过绕过 Linux 内核网络栈并直接与网络接口和硬件交互，来构建高性能包处理应用。\n\
  \    - 通过利用轮询（polling）、零拷贝包 I/O 和无锁数据结构等技术，DPDK 与传统的基于内核的网络方法相比，实现了显著的性能提升。\n- 用户空间网络栈：\n\
  \    - DPDK 提供了一个用户空间网络栈，包括用于数据包 I/O、内存管理、缓冲区池和协议处理的库。\n    - 使用 DPDK 开发的应用完全可以在用户空间中进行包处理，绕过内核上下文切换和内存拷贝的开销，从而获得更延迟和更高的吞吐量。\n\
  - 支持的硬件：\n    - DPDK 支持广泛的网络接口适配器（NIC）和硬件平台，包括 Intel 以太网控制器、Mellanox InfiniBand\
  \ 适配器以及各种虚拟化网络接口。\n    - DPDK 利用了硬件特性，例如 Intel 的 DPDK 为 Intel 以太网控制器提供了优化的驱动程序和库，增强了性能和可扩展性。\n\
  - 包处理库：\n    - DPDK 包含一组包处理库，提供了常见网络任务的优化实现，如数据包分类、过滤、转发和流量管理。\n    - 这些库提供了用于构建自定义包处理流水线和应用的\
  \ API，使开发者能够对网络流量和性能进行细粒度控制。\n- 与其他软件的集成：\n    - DPDK 可以与其他软件框架和项目集成，以加速网络功能和应用，例如软件定义网络（SDN）控制器、虚拟网络函数（VNF）和网络监控工具。\n\
  \    - DPDK 经常与 Open vSwitch (OVS)、FD.io（矢量包处理，VPP）以及编程协议无关包处理器（P4）等项目结合使用，以增强软件定义网络环境中的包处理性能和可扩展性。\n\
  - 社区与生态系统：\n    - DPDK 拥有活跃的开源社区和生态系统，来自各种公司、组织和个人的贡献。\n    - DPDK 社区积极开发和维护该项目，提供定期更新、错误修复和新功能，以提高性能、功能以及与各种硬件平台和软件环境的兼容性。\n\
  \n总的来说，DPDK 是一个强大且广泛使用的框架，用于加速软件网络数据面的包处理任务，为各种网络应用和用例提供了性能、灵活性可扩展性。\n\n![](img/Figure8.20.png)\n\
  \n图 8.20：DPDK 架构\n\n以下是一个使用 DPDK 实现包处理的简化示例。该示例演示了如何使用 DPDK 的 API 进行基础包接收、包处理和包传输。\n\
  \n注意，此示例假设你熟悉 C 语言编程和基础网络概念：\n\n```c\n#include <linux/module.h>\n#include <linux/pci.h>\n\
  #include <linux/netdevice.h>\n#include <linux/etherdevice.h>\n\n#define DRIVER_NAME\
  \ \"my_ethernet_driver\"\n\nstruct my_priv_data {\nstruct net_device *netdev;\n\
  struct pci_dev *pdev;\n// 此处添加任何驱动特定的数据\n};\n\nstatic int my_probe(struct pci_dev\
  \ *pdev, const struct pci_device_id *ent)\n{\nstruct my_priv_data *priv;\nstruct\
  \ net_device *netdev;\n// 为驱动私有数据分配内存\npriv = kzalloc(sizeof(struct my_priv_data),\
  \ GFP_KERNEL);\nif (!priv)\nreturn -ENOMEM;\n// 初始化 PCI 设备\nif (pci_enable_device(pdev))\n\
  goto err_priv;\n// 设置总线主控\npci_set_master(pdev);\n// 分配并初始化网络设备结构\nnetdev = alloc_etherdev(sizeof(struct\
  \ my_priv_data));\nif (!netdev)\ngoto err_dev;\npriv->netdev = netdev;\npriv->pdev\
  \ = pdev;\n// 设置设备特定的参数（例如 MAC 地址、MTU）\n// Example: ether_setup(netdev);\n// 设置驱动特定的数据和函数\n\
  // Example: netdev->netdev_ops = &my_netdev_ops;\n// 向内核注册网络设备\nif (register_netdev(netdev))\n\
  goto err_netdev;\n// 此处添加设备特定的初始化\nreturn 0;\nerr_netdev:\nfree_netdev(netdev);\n\
  err_dev:\npci_disable_device(pdev);\nerr_priv:\nkfree(priv);\nreturn -ENOEV;\n}\n\
  \nstatic void my_remove(struct pci_dev *pdev)\n{\nstruct my_priv_data *priv = pci_get_drvdata(pdev);\n\
  struct net_device *netdev = priv->netdev;\n// 取消注册网络设备\nunregister_netdev(netdev);\n\
  // 释放网络设备结构\nfree_netdev(netdev);\n// 禁用 PCI 设备\npci_disable_device(pdev);\n// 释放驱动私有数据\n\
  kfree(priv);\n}\n\n// PCI 设备 ID 表\nstatic const struct pci_device_id my_pci_tbl[]\
  \ = {\n{ PCI_DEVICE(0x1234, 0x5678) }, // 厂商和设备 ID\n{ 0, },\n};\nMODULE_DEVICE_TABLE(pci,\
  \ my_pci_tbl);\n\n// PCI 驱动结构\nstatic struct pci_driver my_driver = {\n.name = DRIVER_NAME,\n\
  .id_table = my_pci_tbl,\n.probe = my_probe,\n.remove = my_remove,\n};\n\n// 模块初始化\n\
  static int __init my_init(void)\n{\nreturn pci_register_driver(&my_driver);\n}\n\
  \n// 模块清理\nstatic void __exit my_exit(void)\n{\npci_unregister_driver(&my_driver);\n\
  }\nmodule_init(my_init);\nmodule_exit(my_exit);\n\nMODULE_LICENSE(\"GPL\");\nMODULE_AUTHOR(\"\
  BPB\");\nMODULE_DESCRIPTION(\"My Ethernet Driver\");\n```\n\n\n\n以下是上述示例中的细节：\n\n\
  *   我们使用 `rte_eal_init()` 初始化 DPDK 环境，并使用 `rte_pktmbuf_pool_create()` 为数据缓冲区创建内存池。\n\
  *   我们使用 `rte_eth_dev_configure()`、`rte_eth_rx_queue_setup()`、`rte_eth_tx_queue_setup()`\
  \ 和 `rte_eth_dev_start()` 配置并初始化每个网络端口的 RX 和 TX 传输操作。\n*   在主数据包处理循环中，我们持续地从第一个网络端口接收数据包（`rte_eth_rx_burst()`）并将其转发到第二个网络端口（`rte_eth_tx_burst()`）。\n\
  *   数据包处理循环会无限运行，直到程序终止。\n\n此示例演示了如何使用 DPDK 的 API 实现网络端口配置、数据缓冲区管理和数据包 I/O 操作的基本数据包转发应用程序。根据具体的应用，实际\
  \ DPDK 应用可能包括数据包过滤、数据包检查和协议处理等额外功能。\n\n要构建提供的 DPDK 示例，你需要设置开发环境并编译代码。以下是构建示例的通用步骤：\n\
  \n1.  确保系统上已安装 DPDK。你可以从官方网站（`https://www.dpdk.org/`）下载 DPDK。\n2.  按照 DPDK 安装说明设置开发环境，包括设置环境变量（RTE_SDK`\
  \ 和 `RTE_TARGET`）以及配置大页（hugepages）。\n3.  创建一个 C 文件，并将之前的回复中提供的 DPDK 示例代码复制到文件中。\n\
  4.  使用 DPDK 提供的构建系统编译示例代码。通常，你会使用 `make` 命令并带有相应的参数来构建 DPDK 应用。\n5.  创建一个 `Makefile`\
  \ 来构建示例。`Makefile` 应该包含必要的 DPDK 库和头文件路径，并指定目标架构（`RTE_TARGET`）。\n6.  运行 `make` 命令编译示例代码。这将生成一个\
  \ DPDK 应用的可执行文件。\n7.  示例成功编译后，你就可以运行可执行文件来执行 DPDK 应用。确保你拥有访问网络接口的相应权限和配置。\n\n这是一个用于构建\
  \ DPDK 示例的简化版 `Makefile`：\n\n```makefile\n# DPDK 示例的 Makefile\n\nCC := gcc\n\nCFLAGS\
  \ := -03 -std=gnu99 -Wall\n\n# DPDK 配置\n\nRTE_SDK := /path/to/dpdk\n\nRTE_TARGET\
  \ := x86_64-native-linuxapp-gcc\n\n# 包含 DPDK 构建系统\n\ninclude $(RTE_SDK)/mk/rte.vars.mk\n\
  \n# 应用构建选项\n\nAPP := dpdk_example\n\nSRCS := dpdk_example.c\n\nOBJS := $(SRCS:.c=.o)\n\
  \n# 编译规则\n\n$(APP):$(OBJS)\n\n$(CC) $(LDFLAGS) $(OBJS) -o $@ $(LDLIBS)\n\n# 依赖规则\n\
  \n%.o:%c\n\n$(CC) $(CFLAGS) $(EXTRA_CFLAGS) -c $< -o $@\n\n# 清理规则\n\nclean:\n\n\
  rm -f $(OBJS) $(APP)\n```\n\n注意：将 `/path/to/dpdk` 替换为你 DPDK 安装目录的实际路径。\n\n如果编译成功，你将获得一个名为\
  \ `dpdk_example` 的可执行文件，可以通过它来运行 DPDK 应用。确保为 DPDK 应用正确设置了系统环境和网络接口，以便其访问和处理数据包。\n\
  \n## 结论\n\n在本章中，我们详细解释了 GNU/Linux 内核网络栈的工作原理，包括网卡驱动的开发、调优以及安全性。最后，我们还讨论了围绕 DPDK\
  \ 开源项目在重大流管理方面的最新进展。\n\n在下一章中，我们将学习更多关于保护 Linux 内核的知识。\n\n### 加入我们的书籍 Discord 空间\n\
