  \n**献给**\n\n我的妻子，Yuniati Gayet\n\n我的孩子们，Angela Gayet 和 Luca Gayet\n\n# 作者简介\n\n\
  THIERRY GAYET 目前在 TIXEO 公司担任高级开发人员，该公司开发了一种通过法国国家安全局认证的超安全视频会议系统。\n\n他在 20 世纪 90\
  \ 年代后期从 CNAM（曼芒大学）获得了计算机科学 DEST（研究生文凭），专攻人工智能。\n\n他在 Linux 开发方面拥有 30 多以上的经验，并广泛探索了软件开发。他的专业知识还扩展到人工智能、网络安全和量子物理等领域。\n\
  \n他充满活力并致力于 Linux 和系统黑客（system hacking），参与维修咖啡馆（repair cafés），并继续设计基于嵌入式 Linux 或物联网的系统。\n\
  \n在 20 世纪 90 年代，互联网还没有像今天这样普及时，他创建一个 Linux 用户协会或小组，旨在帮助人们更好地理解和普及 Linux 的使用。\n\n\
  他曾在《Linux Magazine》和《Misc》杂志上发表过大量文章，还曾在各个主题领域进行过多次专业培训课程、会议和讲座。在这本书中，他分享了自己的知识和见解，帮助你更好地理解\
  \ Linux 内核并开发自己的驱动程序。\n\n# 评审员\n\n*   Austin Kim 在嵌入式 Linux 板支持包（BSP）开发方面拥有 14 年以上的经验。他处理过许多板级启动（board\
  \ bring-up）、崩溃和性能故障排除以及基于 Arm 的设备的引导程序（bootloader）开发等任务。他在使用 TRACE32、Crash-Utility\
  \ 和 ftrace 等工具进行反向工程和二进制调试方面具有强大的技能。\n\n目前，Austin 在 LG 担任 Linux 内内核 BSP 工程师。他喜欢通过关于\
  \ Armv8-A、RISC-V 架构和内核崩溃调试的课程分享反向工程和调试的实用技能。\n\n*   Martin Yanev 是一位成就卓越的软件工程师，在航空航天和医疗技术等多个行业拥有近十年的经验。在他辉煌的职业生涯中，Martin\
  \ 在交通控制和色谱系统等关键领域的开发和集成尖端软件解决方案方面开辟了自己的天地。他作为菲奇堡州立大学（Fitchburg State University）受尊敬的导师和计算机科学教授，对\
  \ OpenAI API 全频谱有深入的理解，并在构建、训练和微调 AI 系统方面表现出精湛的造诣。作为一名广受认可的作者，Martin 分享了他的专业知识，帮助他人应对\
  \ AI 开发的复杂性。凭借他卓越的记录和多层面的技能组合，Martin 继续推动创新并驱动软件工程领域的变革性进展。\n\n# 致谢\n\n我对所有为本书完成做出贡献的人表示诚挚的感谢，特别是我的妻子\
  \ Yuniati，她鼓励了我，最后是我的孩子们，他们在整个写作过程中给予了帮助和支持。\n\n我非常感谢 BPB Publications 在本书完成过程中提供的指导和专业知识。他们的支持和协助在应对复杂的出版过程中是无价之的。\n\
  \n我还要感谢评审员、技术专家和编辑，他们提供了宝贵的意见并帮助完善了这手手稿。他们的想法和建议显著提高了书的质量。最后，我想向对我们的小的书感兴趣的读者表示感谢。你们的支持和鼓励令不胜感激。\n\
  \n感谢每一位为本书的完成做出贡献的人。\n\n# 前言\n\n理解操作系统的基础可能相当复杂。本书承担了普及和探索 GNU/Linux 内核中实现的各种概念的挑战。\n\
  \n本书由 13 个深度章节组成，涵盖了理解该内核至关重要的广泛主题。\n\n我们将从对该内核的历史和演变的简要介绍开始。然后，我们将逐块地查看内核结构本身，这将成为后续章节的基础。\n\
  \n第 4 章 将详细描述用于在 `sysfs` 中结构化文件并在内核内部（例如通过 `udev`）使用的设备模型。\n\n第 5 章 将向我们介绍字符驱动的世界，为键盘、鼠标和许多其他设备开发驱动程序。第\
  \ 6 章 将涵盖另一类驱动程序：用于本地或远程网络大规模存储的块驱动程序。此时，如果你愿意，你已经拥有开发自己的文件系统的工具。\n\n第 7 章 将随后其后，描述如何为你的\
  \ USB 设备开发驱动程序。\n\n第 8 章 将详细介绍与 `NetFilter` 相关的网络栈复杂性。随后是通过众多系统钩子保护 Linux 系统的 `LSM`。\n\
  \n剩余章节最后详细介绍与硬件相关的内存通信系统、进程管理和调试。\n\n通过实例、详尽的解释和结构化的方法，本书旨在让读者对 GNU/Linux 内核有坚实的理解。无论你是新手还是资深用户，我希望这本书对于探索操作系统的基础非常有帮助，并帮助你通过开发自己的扩展或驱动程序来进一步开发它。\n\
  \n第 1 章：GNU/Linux 内核的历史- 本章提供了内核演变的历史概述、灵感以及带来这一著名内核的关键人物。\n\n第 2 章：Linux 内核简介-\
  \ 在提供历史概述后，第一部分将对内核架构进行详细介绍。这将成为书中后续章节的基础。\n\n第 3 章：驱动程序简介- 在第二部分，我们将探索 Hello World\
  \ 驱动程序的开发，并讨论各种编译技术、驱动间依赖管理以及模块的加载和卸载。\n\n第 4 章：Linux 设备模型- 本章为驱动程序之间的各种注册和声明过程奠定了基础，这些过程将贯穿本书。\n\
  \n第 5 章：字符设备驱动程序- 本章涵盖了第一类字符驱动程序的开发。\n\n\n\n\n\n## 第 6 章：块驱动程序与虚拟文件系统 (#ch06.xhtml)\n\
  - 这第二类型的块驱动用于管理 SATA 或网络驱动器。\n\n## 第 7 章：USB 驱动程序与 libusb (#ch07.xhtml)\n- 本章详细介绍了通过\
  \ USB 协议控制设备的驱动程序。\n\n## 第 8 章：网络驱动程序 (#ch08.xhtml)\n- 网络作为当今通信的核心，将通过网卡驱动程序的实现来进行讨论。书中还将介绍\
  \ `Netfilter` 架构的细节，用于进行流量过滤或构建你自己的防火墙。\n\n## 第 9 章：Linux 安全模块 (#ch09.xhtml)\n-\
  \ 与所有操作系统一样，最高安全性至关重要。这就是美国国家安全局（NSA）在 2000 年底通过提出 `SELinux` 发起的，它提了系统级钩子允许精确的访问控制。本章将提供幕后的深度理解，并可能提供开发自己的\
  \ `LSM` 的机会。\n\n## 第 10 章：内核内存与 DMA (#ch10.xhtml)\n- 本章详细介绍了物理内存和虚拟内存管理模式。还将涵盖不经过\
  \ CPU 的直接或 `DMA` 访问，包括 `NUMA` 管理。\n\n## 第 11 章：Linux 通信接口的导航 (#ch11.xhtml)\n- 无论是嵌入式设备还是标准主板，都使用了不同的硬件通信协议（如\
  \ `I2C`）来管理外设。\n\n## 第 12 章：进程管理 (#ch12.xhtml)\n- 由于 `GNU/Linux` 内核是一个多任务、多用户系统，因此使用调度器来合理调度内核或用户空间中的各种任务。没有它，内核将是单任务的。\n\
  \n## 第 13 章：GNU/Linux 内核与驱动程序的调试 (#ch13.xhtml)\n- 开发是一回事，但能够精细调驱动程序或内核的特定部分是另一回事。事实上，由于其相对复杂性，Linux\
  \ 内核开发了一些相互补充的特定工具。读者将获得这些各种工具的简要概述。\n\n# 代码包与彩色图片\n\n请点击链接下载本书的 `Code Bundle`（代码包）和\
