  ## 从 kernel.org 下载官方 tar 包\n\n如果你想编译不同版本的内核，最简单的方法是从 `kernel.org` 网站获取指定版本的源码。该网站现在支持四种协议：`HTTPS`、`GIT`\
  \ 和 `RSNC`。可以看到，当内核从主线分支移动到稳定分支时，会发生两种情况：\n\n- **主线内核 (Mainline kernels)**：来自内核社区的最新发布版本。这些版本的生命周期较短，并很快会被新版本取代。\n\
  - **长期支持内核 (LTS kernels)**：某些内核被标记为 LTS，意味着它们有更长的支持周期。LTS 版本会根据具体的内核接收安全补丁和维护更新，通常持续\
  \ 2 到 6 年。\n\n注意 `XML` 和 `JSON` 文件会在每次发布新内核时更新：\n\n- `XML`：`https://www.kernel.org/feeds/kdist.xml`\n\
  - `JSON`：`https://www.kernel.org/releases.json`\n\n下载源码 tar 包可以使用 `curl` 命令：\n\n\
  ```\ncurl -OL https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.5.5.tar.xz\n\
  ```\n% Total % Received % Average Speed Time Current\nDload Upload Total Left\n\
  100 132M 100 132M 0 5208k 0:00:26 0:00:26 --:---- 3713k\n\n下载 Linux 内核源码可能需要确认来源以确保追溯性。这在\
  \ DevSecOps 中非常有用；可以防止恶意代码。为此，来自 `kernel.org` 站的 tar 包关联了以下 GPG 指纹进行控制：\n\n```bash\n\
  curl -OL https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.5.tar.sign\n```\n\
  % Total % Received % Average Speed Time Current\nDload Upload Total Left\n100 987\
  \ 100 987 0 3005 0 --:---- --::-- 3009\n\n现在我们需要通过以下命令导入与 GNU/Linux 项目官方维护者相关的两个\
  \ `gpg` 公钥：\n\n```\ngpg2 --locate-keys torvalds@kernel.org gregkh@kernel.org\n```\n\
  ```\ngpg: key 38DBBDC802693E: public key \"Greg Kroah-Hartman <gregkh@kernel.org>\"\
  \ imported\ngpg: Total number processed: 1\ngpg: imported: 1\ngpg: key 79BE3E4300411886:\
  \ public key \"Linus Torvalds <torvalds@kernel.org>\" imported\ngpg: Total number\
  \ processed: 1\ngpg: imported: 1\npub rsa4096 2011-09-23 [SC]\n647F28654894E3BD457199BE38DBBDC609263E\n\
  uid [ unknown] Greg Kroah-Hartman <gregkh@kernel.org>\nsub rsa4096 2011-09-23 [E]\n\
  pub rsa2048 2011-09-23 [SC]\n```\n\n至于内核本身的配置，位于两个位置：\n\n- 第一在上述目录的 `.config` 文件：`/usr/src/linux-headers-$(uname\
  \ -r)/.config`\n- 第二在 `/boot` 目录中：\n\n```\nls -alh /boot/config\n```\n\n现在，对比签名验证\
  \ `.tar` 存档：\n\n```\ngpg2 --verify linux-6.5.tar.sign linux-6.5.tar.xz\n```\n\n\
  可以将这两个步骤合并为一条命令：\n\n```\nxz -cd linux-6.5.5.tar.xz | gpg2 --verify linux-6.5.tar.sign\n\
  ```\n\n你会观察到签名是在解压缩的版本上进行的，因此对于压缩的 `.gz` 和 `.xz` 版本只需要一个签名。\n\n注意：存在允许你验证官方内核的脚本：[`https://git.kernel.org/pub/scm/linux/kernel/git/mricon/korg-helpers.git/tree/](https://git.kernel.org/pub/scm/linux/kernel/git/mricon/korg-helpers.git/tree/)\n\
  \n另一种备受开发者推崇的方法是从官方 `GIT` 仓库获取：\n\n```\ngit clone git://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git\n\
  ```\nCloning into 'linux'...\nremote: enumerating objects: 9721192, done.\nremote:\
  \ counting objects: 100% (120/120), done.\nremote: compressing objects: 100% (63/63),\
  \ done.\nremote: total 9721192 (delta 74), reused 75 (delta 57), pack-reused 9721072\n\
  \n\n\n\n接收对象: 100% (9721192/9721192), 2.69 GiB | 16.76 MiB/s, 完成。\n\n解析增量: 100%\
  \ (7970513/7970513), 完成。\n\n更新文件: 100% (81757/81757), 完成。\n\n查找可用标签的列表：\n\n```bash\n\
  $ git tag --list\n```\n\n(…)\n\nv6.5\nv6.5-rc1\nv6.5-rc2\nv6.5-rc3\nv6.5-rc4\nv6.5-rc5\n\
  v6.5-rc6\nv6.5-rc7\nv6.6-rc1\nv6.6-rc2\nv6.6-rc3\n(...)\n\n我们可以查找与我们的 Ubuntu Linux\
  \ 发行版最接近的标签，即 6.2.0-33-generic，它对应 v6.2 版本：\n\n```bash\n$ git tag --list |grep 6.2\n\
  ```\n\n在 `linux_6.2` 分支从 v6.2 标签切换到特定的发布/标签：\n\n```bash\n$ git checkout -b linux_6.2\
  \ v6.2\n```\n\n我们准备好进入 Linux 内核配置步骤。\n\n## 配置自定义内核和模块\n\n配置步骤的目的是定义 GNU/Linux 内核特征的标识映射。这将允许许多功能静态地集成在单体内核中（静态部分），或集成在动态模块中（动态部分）。\n\
  \n配置器的目的是生成一个 `.config` 文件，该文件将汇总所有要激活的功能。`.config` 文件就像是构建的身份证。\n\n通过向主 Makefile\
  \ 传递特定的目标名称来调用配置器。该配置模块与许多其他项目（如 `Buillroot`、`Ptxdist`、`crosstool-ng` 等）使用的完全相同。它由\
  \ Yann Morin 在几年前重新开发的。\n\n存在多种不同类型的配置器：\n\n- `config`: 使用文本接口更新配置\n- `nconfig`:\
  \ 使用 ncurse 接口更新配置（轻量黑白版本）\n- `menuconfig`: 使用 ncurse 接口更新配置（彩色版本）\n- `xconfig`:\
  \ 使用 QT 接口更新配置\n- `gconfig`: 使用 GTK 接口更新配置\n- `oldconfig`: 使用内核源码中存在的 `.config`\
  \ 文件更新配置\n- `localmodconfig`: 通过禁用未加载的动态模块更新当前配置\n- `localyesconfig`: 通过将动态模块集成到内核的静态部分更新配置\n\
  - `silentoldconfig`: 与 oldconfig 相同，但静默更新依赖\n- `defconfig`: 更新配置，对给定架构采用默认设置\n-\
  \ `savedefconfig`: 将当前配置保存为 `config`。默认最小化\n- `allnoconfig`: 创建新配置，所有选项都设置为 no\n\
  - `allyesconfig`: 创建新配置，所有选项都设置为 yes\n- `allmodconfig`: 创建新配置，所有选项都为模块\n- `alldefconfig`:\
  \ 创建新配置，将所有请求的选项都设置为其默认值\n- `randconfig`: 通过随机响应启用选项来定义新配置\n- `listnewconfig`: 列出新选项\n\
  - `olddefconfig`: 与 silentoldconfig 相同，但将新符号设置为其默认值\n\n下图包含不同类型配置器的某些截图：\n\n![](img/figure2.6.png)\n\
  \n图 2.6：配置器的若干截图\n\nGNU/Linux 内核的配置是根据您的特定需求自定义内核行为和特征的关键步骤。\n\n每个菜单最多可以有三种状态：在内核静态部分中选择（`y`）、作为动态模块被选择（`m`）以及未选择。\n\
  \n下图给出了使用 QT 配置器的示例：\n\n![](img/figure2.7.png)\n\n图 2.7：QT 配置器视图\n\n带有依赖管理的特征管理激活描述。。每个激活项都可以包含在内核本身的静态部分中，或者在可能的情况下单独包含在动态加载的模块中：\n\
  \n- `ISO9660 CDROM 文件系统支持`: 将包含在独立内核的动态 `.ko` 模块中；如果选择了此配置，将启用两个子依赖。\n- `UDF 文件系统支持`:\
  \ 将包含在 Linux 内核的静态部分中。\n\n生成的配置文件最终每个功能有一行遵循以下规则：\n\n- 任何以数字开头并以 `is not set` 结尾的行将不忽略。\n\
  - 任何以 `=m` 结尾的行将生成一个动态模块。\n- 任何以 `=y` 结尾的行将功能包含在内核的静态部分中。\n\n提取 `.config` 文件：\n\n\
  (…)\n\n## CD-ROM/DVD 文件系统\n\n```text\n#CONFIG_ISO9660_FS=m\nCONFIG_JOLIET=y\nCONFIG_ZISOFS=y\n\
  CONFIG_UDF_FS=y\nCONFIG_UDF_NLS=y\n```\n\n## DOS/FAT/NT 文件系统\n\n```text\n## CONFIG_MSDOS_FS\
  \ is not set\n#CONFIG_VFAT_FS is not set\nCONFIG_NTFS_FS=m\n## CONFIG_NTFS_DEBUG\
  \ is not set\nCONFIG_NTFS_RW=y\n```\n\n(…)\n\n内核配置包含一个选项之间的依赖系统。例如，启用网络驱动程序会激活网络栈。有两种类型的依赖：\n\
  \n- `依赖项`: 选项 `A`。\n- `依赖选择`: 激活 `A` 后，自动选择 `B`。\n\n内核配置通常使用 `menuconfig`、`nconfig`\
  \ 或 `xconfig` 等工具进行，这些工具为修改选项提供了友好的界面。\n\n以下是自定义内核时可以配置的几个关键主题：\n\n- `代码成熟度`: 允许隐藏或显示仍在开发中的选项（如果想从最新特性中选\
  \ yes）。\n- `通用设置`: 系统的一组通用选项（除非你想为特定架构编译），如下：\n    - 内核版本和标识\n    - 内核架构（例如，32 位或\
  \ 64 位）\n    - 内核压缩方法\n    - 内核命令行\n    - 内核定时器频率\n    - 内核抢占模型\n- `块层`: 主板上的输入/输出（对于板可以移除）。\n\
  - `可加载模块支持`: 关于模块管理的选项（默认情况下通常是正确的）\n    - 启用或禁用运行时加载内核模块\n    - 配置模块版本和符号信息\n-\
  \ `处理器类型和特性`: 与处理器相关的选项：类型（x86, Sparc, ...）、超线程、双核、SMP 等。\n    - 处理器家族和微架构优化\n \
  \   - 支持对称多处理 (SMP)\n    - CPU 频率缩放（例如 CPU 调度器）\n    - 虚拟化选项（例如 KVM、Xen、VirtualBox）\n\
  - `电源管理与 ACPI`: 关于节电、待机和 ACPI/APM 的选项\n    - CPU 空闲状态和节能功能\n    - 高级配置电源接口 (ACPI)\
  \ 支持\n    - ACPI 睡眠状态（例如挂起到内存）\n- `总线选项 (PCI, USB, I2C 等)`: 管理所有可以插卡的地方（PCI, PCMCIA,\
  \ ISA 等）\n    - 配置各种总线类型和控制器的支持\n    - 启用或禁用特定的设备驱动和控制器支持\n- `设备驱动`: 关于所有硬件驱动程序的选项（这通常是我们花费最多时间的地方）\n\
  \    - 配置各种硬件设备和外围的支持\n\n\n\n\n## 硬件与支持\n- 启用或禁用特定网卡、存储设备、声卡、显卡等的支持\n- 对文件系统的支持（例如\
  \ `ext4`、`NTFS`、`CIFS`）\n- 输入设备（例如键盘、鼠标、触控板）\n- 存储驱动（例如 `SATA`、`NVMe`、`SCSI`）\n\
  - 网络选项（例如 `Ethernet`、`Wi-Fi`、`Bluetooth`）\n- USB 支持和设备驱动\n\n## 内核功能与选项\n\n### 可执行文件格式\n\
  可执行文件的管理（`ELF` 支持必须始终为 `Y`）\n\n### 文件系统\n关于由内核管理的的文件系统的选项（你将需要查看）\n- 启用对各种文件系统的支持（例如\
  \ `ext4`、`Btrfs`、`XFS`）\n- 网络文件系统（例如 `NFS`、`CIFS`）\n- 磁盘配额支持\n- 文件系统相关选项（例如扩展属性、文件锁定）\n\
  \n### 内核功能\n- 实时支持（`PREEMPT-RT`）\n- 任务调度器选项（例如完全公平调度器、轮询调度）\n- POSIX 兼容性选项\n- 内核调试与跟踪（例如\
  \ `kprobes`、`ftrace`、`perf`）\n- 安全选项（例如 `SELinux`、`AppArmor`、`seccomp`）\n\n### 网络支持\n\
  关于由内核管理的网络协议的选项（默认设置通常足够，但以万一请查看）\n- 网络协议和选项（例如 `IPv4`、`IPv6`、`TCP`、`UDP`）\n- 网络栈选项（例如\
  \ `QoS`、`IPsec`、`netfilter/iptables`）\n- 虚拟网络（例如 `TUN/TAP` 支持）\n  - 数据包过滤和路由选项\n\
  \n###get 支持\n内核分析选项（无需启用）。\n\n### 安全选项\n关于内核安全模型的选项（默认设置足够）\n- 强制访问控制 (MAC) 框架（例如\
  \ `SELinux`、`Smack`）\n- 安全计算模式（`seccomp`）\n- 内核加固选项 [例如地址空间布局随机化 (`ASLR)`)]\n- 加密选项（例如\
  \ `cryptographic API`、加密算法）\n\n### 加密选项\n可以在内核中实现的加密算法（默认设置足够）\n\n### 库例\n常用内核库（默认设置足够）\n\
  - PeKernel 性能计数器（例如 `perf_events`）\n- 分析支持（例如 `OProfile`、`perf`）\n- 硬件性能监控 [例如 Intel\
  \ 性能监控单元 (`PMU`)]\n\n## 内核文档\n启用或禁用内核文档（对内核开发有用）\n\n这些只是你可以在 Linux 内核中配置的一些关键主题。具体的选项及其可用性可能会取决于内核版本和你的硬件。在配置内核时，必须仔细考虑你的系统需求和限制，以创建一个满足你的需求同时尽可能减少不必要功能的定制化内核。\n\
  \n与软件包版本（`.deb`、`.rpm` 等）不同，来自 `kernel.org` 的 tar 包源码并不原生地提供默认配置。在 Linux 发行版上，必须恢复当前的内核配置文件。\n\
  \n## 配置过程\n\n首先，需要使用 `uname` 命令检查当前的内核版本：\n\n```\nuname -a\n```\nLinux tgayet-DS87D\
  \ 6.2.0-33-generic #33~22.04.1-Ubuntu SMP PREEMPT_DYNAMIC Thu Sep 7 10:33:52 UTC\
  \ 2 x86_64 x86_64 x86_64 GNU/Linux\n\n要从特定发行版封装的内核配置开始，必须将 `.config` 配置文件拷贝到 Linux\
  \ 内核源码的根目录或从 `/boot` 目录：\n\n```bash\ncp /boot/config-`uname -r`* .config\n```\n\n\
  或者，\n\n```bash\ncp /usr/src/linux-headers-$(uname -r)/.config .config\n```\n\n为了使此\
  \ `.config` 文件生效，你需要使用 `oldconfig` 目标或 `alldefconfig`：\n\n```bash\nmake oldconfig\n\
  ```\n\n注意，如果当前内核是用伪文件系统 `/proc/config.gz` 编译的，则可以从当前内核配置热生成此文件：\n\n```bash\nzcat\
  \ /proc/config.gz > .config\n```\n\n要实现这一点，内核必须使用以下配置编译：\n```ini\nCONFIG_IKCONFIG=y\n\
  CONFIG_IKCONFIG_PROC=y\n```\n\n然后通过内核中的以下菜单激活：\n```\nGeneral setup --->[*] Kernel\
  \ .config support[*] Enable access to .config through /proc/config.gz\n```\n\n一旦配置阶段完成，源码根目录下应该位于一个\
  \ `.config` 文件。需要注意的是，此功能在当前的内核中正越来越少被激活。\n\n在开始生成阶段之前，识别内核可能会很有用。位于 Makefile 开头的变量集被用于此：\n\
  \n```makefile\nVERSION = 6\nPATCHLEVEL = 2\nSUBLEVEL = 0\nEXTRAVERSION = -bpb\n\
  NAME = Kernel linux for bpb book\n```\n\n另一种添加额外版本的方法是在 `.config` 文件中添加 `CONFIG_LOCALVERSION`。它必须以连字符开头，以便在版本号和定义的额外字符串之间进行转换：\n\
  ```ini\nCONFIG_LOCALVERSION = -custom\n```\n例如，如果你添加了 `-custom` 作为额外版本标签，内核版本看起来可能像\
  \ `5.2.0-custom`。\n\n## 构建内核\n\n一旦内核配置完成，我们需要构建它。\n\n### 表 2.1：构建你的内核所需的工具\n\n|\
  \ 软件 | 最小版本 | 检查命令 |\n| :--- | :--- | :--- |\n| Gnu C | 2.95 | `gcc` |\n| Gnu make\
  \ | 3.7 | `make` |\n| binutils | 2.12 | `ld` |\n| util-linux | 2.10 | `depmod` |\n\
  | module-init-tools | 0.9 | `dep` |\n| e2sprogs | 2.2 | `tune2fs` |\n| jfsutils\
  \ | 1.3 | `fsck` |\n| reiserprogs | 3.6 | `refsck` |\n| xfsprogs | 2.1 | `xfs_db`\
  \ |\n| pcmcia-cs | 3.21 | `cardmgr` |\n| quota-tools | 3.0 | `quota` |\n| PPP |\
  \ 2.4 | `pppd` |\n| isdn-utils | 3.1 | `isdnctrl` |\n| nfs-utils | 1.0 | `showmount`\
  \ |\n| procps | 3.13 | `ps` |\n| oprofile | 0.5 | `oprofiled` |\n\n### 从源码生成 GNU/Linux\n\
  \n一旦内核配置完成，我们需要构建它。\n\n内核的生成分两个步骤进行：\n1. 静态部分（未压缩的 `vmlinux` 等）\n2. 动态部分/模块（*.ko`）\n\
  \n现在，让我们逐步通过每个步骤，从获取配置、编译到最后安装。\n\n注意：基础目标是由 `scripts` 定义的。\n\n```bash\nmake scripts\n\
  HOSTCC scripts/genyms/genyms.o\nYACC scripts/genyms/parse.tab.[ch]\nHOSTCC scripts/genyms/parse.tab.o\n\
  LEX scripts/genyms/lex.lex.c\nHOSTCC scripts/genyms/lex.lex.o\nHOSTLD scripts/genyms/genyms\n\
  HOSTCC scripts/selinux/genheaders/genheaders\nHOSTCC scripts/selinux/mdp/mdp\nHOSTCC\
  \ scripts/kallsyms\nHOSTCC scripts/sorttable\nHOSTCC scripts/asn1_compiler\nHOSTCC\
  \ scripts/sign-file\nHOSTCC scripts/insert-sys-cert\n```\n\n\n\n\n\n如果编译源码的机器具有多个处理器或核心，则可以使用\
  \ `j / --jobs` 和 `-l / --load-average` 参数来实现生成并行化。`-j` 选项设置了 Makefile 可以执行的最大并行任务数，而\
  \ `-l` 选项则在负载低于指定配额时防止启动任何新的并行任务。将任务数设置得比处理器数量高的原因是为了确保处理器使用率达到饱和。\n\n要确定可以进行多少并行处理，可以很容易进行如下简单的计算：\n\
  \n```bash\nexport NBCORE=$(($(grep -c processor /proc/cpuinfo)+1))\n```\n\n或者，\n\
  \n```bash\nexport NBCORE=$(($(cat /proc/cpuinfo|grep processor|wc -l)+1))\n```\n\
  \n对于英特尔酷睿 I7，得到的结果是 9；对于英特尔酷睿 I3，得到的结果是 5。为了让生成过程能够优化地适应编译 Linux 内核源码的机器，可以使用以下命令：\n\
  \n```bash\nexport NBCORE=$(($(cat /proc/cpuinfo | grep processor | wc -l)+1))\n\
  make –jobs=$((NBCORE+1)) –load-average=${NBCORE}\n```\n\n此外，请注意即使你不在源码目录中也可以启动生成过程。事实上，与任何\
  \ GNU Makefile 一样，`-C` 参数允许你指定 Makefile 所在的源码路径：\n\n```bash\nmake -j 9 -C=~/linux_src/\n\
  ```\n\n构建会生成几个主文件：\n\n*   `./vmlinux`: 用于调试的未压缩 Linux 内核\n*   `./System.map`: 静态部分包含的符号表\n\
  *   `./arch/<ARCH>/boot/bzImage`: 压缩后的 Linux 内核\n\n压缩内核名称是 ELF `vmlinux` 文件，可以用于调试或性能分析。这很少是加载到内存的文件，因为我们更倾向于名为\
  \ `bzImage` 的压缩版本：\n\n```bash\nfile vmlinux\n```\n\n```text\nvmlinux: ELF 64-bit\
  \ LSB executable, x86-64, version 1 (SYSV), statically linked, BuildID[sha1]=faed1aa89d99a80ea62b816311a4b55cc49b866,\
  \ not stripped\n```\n\n```bash\nfile arch/x86/boot/bzImage\n```\n\n```text\narch/x86/boot/bzImage:\
  \ Linux kernel x86 boot executable bzImage, version 6.2.0-bpb-dirty (tgayet@tgayet-DS87D)\
  \ #1 SMP PREEMPT_DYNAMIC Sun Oct 1 20:21:24 CEST 2023, RO-rootFS, swap_dev 0XB,\
  \ Normal VGA\n```\n\n| 注意：i386 架构重定向到 x86： |\n\n| `arch/i386/boot/bzImage`: 指向 `../../x86/boot/bzImage`\
  \ 的符号链接 |\n\n一旦构建完成，我们迫不及待地想要使用 `qemu` 和本章开头生成的 rootfs 来测试刚刚构建的内核了：\n\n```bash\n\
  qemu-system-x86_64 -kernel ./arch/x86/boot/bzImage -hda ./rootfs.ext2 -nographic\
  \ -append root=\"/dev/sda console=ttyS0\" -net nic,macaddr=00:11:22:33:44:55 -net\
  \ user\n```\n\n![](img/figure2.8.png)\n\n图 2.8：新构建内核的测试\n\n我们既可以通过 `EXTRAVERSION`\
  \ 提供的后缀来确认这是我们的内核，也可以通过查看传递给内核的参数（通过 `/proc/cmdline` 访问）来确认。\n\n在 Linux 内核的上下文中，`dirty`（脏）一词并不是内核代码或数据的整洁状态。相反，它有一个与内存管理和缓存相关的特定技术含义。\n\
  \n在 Linux 内核中，`dirty` 状态用于表示内存页（通常是 RAM 中的一页）自上次从存储器（例如从磁盘）读取以来已被修改。当内存中的数据被修改时，它会被标记为\
  \ `dirty`，表示它不再与存储在磁盘上的数据保持一致。这一信息对于以下几个原因非常重要：\n\n*   **写效率**：内核可以通过只写回标记为 `dirty`\
  \ 的页来优化对存储器的写入。这有助于减少写入操作并提高整体 I/O 性能。\n*   **缓存**：内核可以将频繁访问的数据保留在内存中（缓存）以便更快速访问。当这些缓存数据被修改时，它们会被标记为\
  \ `dirty`，内核最终会将其写回存储器以确保数据一致性。\n*   **数据完整性**：跟踪 `dirty` 页对于数据完整性至关重要。它确保了内存中数据的更改最终会持久化到存储器中，以便在系统崩溃或断电的情况下，系统可以恢复而不丢失关键数据。\n\
  \n`dirty` 一词在计算机科学和操作系统中被常用，用于描述这种需要与非易失性存储器同步的修改数据概念。它本质上是一个标志，指示内存中的某些数据需要写回磁盘以维护数据一致性。\n\
  \n相比之下，`clean`（洁）页是指自从存储器读取以来未被修改且与磁盘上的对应项同步的页。内核的内存管理系统跟踪这些状态，以便高效地管理数据并确保数据完整性。\n\
  \n## 为 Ubuntu/Debian 生成 DEB 包\n\n为 Ubuntu 构建 DEB 包涉及多个步骤，包括配置内核、编译以及创建包。\n\n1. \
  \ 在开始之前，确保你安装了依赖项：\n    `sudo apt-get install build-essential ncurses5-dev bison\
  \ flex`\n2.  获取内核源码。例如，下载 Ubuntu 的内核源码：\n    `sudo apt-get source $(uname -r)`\n\
  3.  进入源码目录：\n    `cd linux-$(uname -r)`\n4.  文本界面配置：\n    `make menuconfig`\n5.\
  \  图形化界面配置：\n    `make xconfig`\n6.  根据需要配置内核，包括任何自定义功能。使用以下命令构建 Debian 包：\n   \
  \ `fakeroot make-kpkg --initrd --append-to-`\n7.  成功构建内核包后，可以安装：\n    `sudo dpkg\
  \ -i ../linux-image-<custom_version>_amd64.deb`\n8.  你可能还需要安装对应的内核头：\n    `sudo\
  \ dpkg -i ../linux-headers-<custom_version>_amd64.deb`\n9.  更新引导程序以识别新内核：\n    `sudo\
  \ update-grub`\n10. 重启系统以加载新内核：\n    `sudo reboot`\n11. 重启后，你可以验证新内核是否生效：\n    `uname\
  \ -r`\n\n## 为 Fedora Core/Red Hat/SUSE 构建 RPM\n\n为 Fedora Core、Red Hat 或 SUSE 构建内核通常涉及创建一个自定义的\
  \ Red Hat 包管理器 (RPM) 包。这些发行版都有自己的打包和构建过程，以下是每个发行版的概述：\n\n### Fedora Core/Red Hat\n\
  \n1.  确保安装了必要的开发工具：\n    `sudo dnf install rpm-build redhat-rpm-config gcc make`\n\
  2.  从 Fedora 或 Red Hat 仓库下载内核源码。你可以使用 `dnf` 或 `yum` 工具：\n    `sudo dnf download\
  \ --source kernel`\n3.  设置 RPM 构建环境：\n    `rpmdev-setuptree`\n4.  将下载的内核源码 RPM 复制到\
  \ `SOURCES` 目录：\n    `cp kernel*.src.rpm ~/rpmbuild/SOURCES/`\n5.  提取源码 RPM：\n \
  \   `rpm -i ~/rpmbuild/SOURCES/kernel*.src.rpm`\n6.  根据需要配置内核：\n    `cd ~/rpmbuild/SPECS`\n\
  \    `rpmbuild -bp kernel.spec`\n7.  构建内核 RPM 包：\n    `rpmbuild -bb kernel.spec`\n\
  \n\n\n\n\n### 8. 安装生成的 RPM 包：\n\n```bash\nsudo dnf install ~/rpmbuild/RPMS/<architecture>/kernel-*.rpm\n\
  ```\n\n### 9. 更新 GRUB 配置并重启系统以加载新内核：\n\n```bash\nsudo grub2-mkconfig -o /boot/grub2/grub.cfg\
  \ # 用于 GRUB2\nsudo reboot\n```\n\n按照以下步骤为 SUSE Linux 生成 RPM 包：\n\n1.  确保你已经安装了必要的开发工具：\n\
  ```bash\nsudo zypper install rpm-build gcc make\n```\n\n2.  从 SUSE 官方存储库下载内核源码。\n\
  \n3.  设置 RPM 构建环境：\n```bash\nrpmdev-setuptree\n```\n这将创建 `rpmbuild` 目录结构。\n\n4.\
  \  将下载的内核源码 RPM 复制到 `SOURCES` 目录：\n```bash\ncp kernel*.src.rpm ~/rpmbuild/SOURCES/\n\
  ```\n\n5.  提取源码 RPM：\n```bash\nrpm -i ~/rpmbuild/SOURCES/kernel*.src.rpm\n```\n\
  此时，你可以对内核源码应用自定义补丁或修改。\n\n6.  根据需要配置内核，包括你所需的自定义设置或特性：\n```bash\ncd ~/rpmbuild/SPECS\n\
  rpmbuild -bp kernel.spec\n```\n\n7.  构建内核 RPM 包：\n```bash\nrpmbuild -bb kernel.spec\n\
  ```\n\n8.  安装生成的 RPM 包：\n```bash\nsudo zypper install ~/rpmbuild/RPMS/<architecture>/kernel-*.rpm\n\
  ```\n\n9.  更新 GRUB 配置并重启系统以加载新内核：\n```bash\nsudo grub2-mkconfig -o /boot/grub2/grub.cfg\
  \ # 用于 GRUB2\nsudo reboot\n```\n\n请将 `<architecture>` 替换为你系统的架构（例如 `x86_64`）。请记住，构建和安装自定义内核是非常复杂的，在处理内核等系统关键组件时，务必做好妥善的备份和恢复计划。\n\
  \n### 安装](#contents.xhtml_sc2_32a)\n\n一旦完成生成阶段，就可以单独安装各个部分。\n\n可以使用默认路径进行安装，也可以按照如下表所示重新定义：\n\
  \n| Makefile 参数名称 | 描述 | 路径的默认值 | 关联目标 |\n| :--- | :--- | :--- | :--- |\n| `INSTALL_PATHS`\
  \ | 指定内核和映射（系统映射）安装的位置 | `/boot` | Install |\n| `INSTALL_MOD_PATH` | 指定原生动态模块安装到内核源码的的位置\
  \ | `/lib/modules/$(KERNELRELEASE)/kernel` | `modules_install` |\n| `INSTALL_MOD_DIR`\
  \ | 指定源码之外额外动态模块的安装位置 | `/lib/modules/$(KERNELRELEASE)/extra` | `modules_install`\
  \ |\n| `INSTALL_FW_PATH` | 指定在动态模块树中安装固件的位置 | `$(INSTALL_MOD_PATH)/lib/firmware`\
  \ | `firmware_install` |\n\n表 2.2：GNU/Linux 内核 Makefile 参数\n\n通过为 rootfs 根指定前缀可以修改安装。这对于安装内核本身特别有用，内核通常安装在引导加载程序所在的路径下：\n\
  \n```bash\nmake INSTALL_PATH=<kernel_path> install\n```\n\n对于动态模块：\n\n```bash\n\
  make INSTALL_MOD_PATH=<dynamic_modules_path> modules_install\n```\n\n对于固件：\n\n```bash\n\
  make INSTALL_FW_PATH=<dynamic_modules_path> firmware_install\n```\n\n内核安装完成后，你需要让\
  \ grub 进行更新：\n\n```bash\nsudo update-grub2\n```\n\n```\n[sudo] password for tgayet:\n\
  Generating grub.cfg ...\nFound linux image: /boot/bzImage-6.2.0-bpb\nFound initrd\
  \ image: /boot/bzImage-6.2.0-bpb\n```\n\n如果一切顺利，在这一步，内核将（添加到启动时的可引导内核列表中。\n\n###\
  \ 执行与启动序列](#contents.xhtml_sc2_33a)\n\n`vmlinux` 文件是一个包含 ELF/COFF 格式 Linux 内核的静态链接执行文件。它可能用于内核调试、`system.map`\
  \ 符号表生成或其他操作，但在作为操作系统内核使用之前，必须通过 multiboot 头部、引导扇和配置例程使其可引导。在较旧的 UNIX 平台上，内核镜像命名为\
  \ `/unix`。由于虚拟内存的使用，支持该特性的内核被赋予 `vm` 前缀以示区分。`vmlinux` 名称是 `vmunix` 的组合，而 `vmlinuz`\
  \ 结尾的字母 `z` 表示它是压缩过的（例如使用 gzip gzip）。\n\n传统上，在创建可引导内核镜像时，内核也会使用 `gzip` 进行压缩，或者从\
  \ Linux 2.6.30 开始使用 `LZMA` 或 `bzip2`，这要求在生成的镜像中包含一个非常小的解压存根。该存根会解压内核代码，在某些系统上向控制台打印点以指示进度，然后继续启动过程。之后增加了对\
  \ `LZO`、`xz`、`LZ4` 和 `zstd` 压缩的支持。\n\n解压程序对启动时间的影响可以忽略不计，在 `bzImage` 出现之前，某些架构的大小限制非常严格，特别是在\
  \ `x86` 下，使得压缩成为强制性。\n\n压缩的 Linux 内核在启动时的解压：\n\n![](img/figure2.9.png)\n\n图 2.9：Linux\
  \ 内核启动和解压过程\n\n启动镜像的文件并不并不，但大多数发行版使用 `vmlinuz` 作为镜像。\n\n随着 Linux 内核的演变，用户生成的内核大小超过了某些架构的限制，这些架构中用于存储压缩内核代码的空间非常有限。`bzImage`\
  \ (big zImage) 格式的设计通过将内核划分为非连续的内存区域来克服这一限制。\n\n![](img/figure2.10.png)\n\n图 2.10：bzImage\
  \ 结构\n\n`bzImage` 格式一直使用 `gzip` 压缩直到 Linux 2.6.30，该版本引入了更多算法。`bz` 前缀可能会让你认为使用了 `bzip2`，但事实并非如此。\n\
  \n`System.map` 文件在内核编译时也会生成。它是内核使用的一个表。\n\n`bzImage` 文件遵循特定的结构：`bootsect.o` + `setup.o`\
  \ + `misc.o` + `piggy.o`。`piggy.o` 数据段包含了 gzip 压缩的 `vmlinux` 文件。内核源码中 `scripts/`\
  \ 目录下的 `extract-vmlinux` 脚本可以提取 GNU/Linux 内核镜像。\n\n某些发行版可能提供 `kernel-debuginfo`\
  \ 包，其中包含对应内核 RPM 包的 `vmlinux` 文件，它通常安装在 `/usr/lib/debug/lib/modules/$(uname -r)/vmlinux`、`/usr/lib/debug/lib64/modules/$(uname\
  \ -r)/vmlinux` 或 `/boot` 下。\n\n\n\n\n\n- 统一引导加载程序 (`GRUB2`) 是一种在许多 Linux 发行版中常用的二级引导加载程序。\n\
  - 当 `MBR` 代码执行时，它会加载二级引导加载程序的内核镜像，这通常位于名为 `/boot` 分区的特定分区中。\n- `GRUB2` 会向用户显示菜单（如果已配置），并允许选择特定的内核进行启动。\n\
  - `GRUB2` 还可以加载并执行配置文件，例如 `grub.cfg`，它包含有关可用内核及其启动参数的信息。\n- 在嵌入式领域，`qemu` 引导加载程序被广泛使用。\n\
  \n## Linux 内核加载\n\n- 一旦选择了特定的内核，`GRUB2` 会将 Linux 内核镜像（例如 `vmlinuz`）加载到内存中。\n- `GRUB2`\
  \ 还指定内核命令行参数，包括根文件系统和 `initrd` 镜像镜像的位置。\n\n## Initrd (初始内存磁盘)\n\n- `initrd` 是一个初始内存磁盘，包含了挂载根文件系统所需的驱动程序和工具。\n\
  - 内核将 `initrd` 加载到内存中并解压其内容。\n- `initrd` 对于根文件系统存储在复杂存储设备上的系统（如逻辑卷管理器 `LVM` 或软件\
  \ RAID 阵列）特别有用。\n- 它允许内核在挂载实际根文件系统之前访问必要的驱动程序。\n\n## 根文件系统挂载\n\n- 在 `initrd` 的帮助下，内核挂载通常位于硬盘上的根文件系统。\n\
  - 一旦挂载根文件系统，内核会将控制权交给 `init` 进程，该进程是第一个用户空间进程，所有其他进程的祖先。\n- `init` 进程初始化其余的用户空间组件、服务和应用程序。\n\
  \n`initrd` 通常用作临时替代方案，以确保在涉及更复杂的存储或设备配置时系统能够启动。一旦根文件系统挂载，内核就不再需要 `initrd`。启动过程的具体细节可能根据发行版和配置而异，但此概述提供了对\
  \ Linux 内核如何从 BIOS 到 `initrd` 启动的通用理解。\n\n你可以选择内核，甚至可以使用额外的内核参数对其进行修改。可选，你可以使用命令行\
  \ shell 对启动过程进行更强的手动控制。\n\n当第二阶段引导加载程序进入内存后，将查询文件系统并将默认内核镜像和 `initrd` 镜像加载到内存中。一旦镜像就绪，步骤\
  \ 2 中的引导加载程序将调用内核镜像。\n\n接下来，我们来到 GNU/Linux 内核本身。在这个阶段，内核尚未真正执行；首先，内核配置部分需要处理一些内存管理相关的事务。在完成所有这些工作后，内核将解压并最终运行。\n\
  \n## 编码风格\n\nLinux 内核社区遵循定义的编码风格，以维护代码库的一致性和可读性。在内核 Linux 内核代码时，遵循这些编码风格指南至关重要。\n\
  \n主要的编码风格规则在《Linux Kernel Coding Style》文档中概述，可以在内核源码树 `Documentation/process/coding-style.rst`\
  \ 下访问。\n\n以下是在 Linux 内核内编写代码的一些编码风格指南：\n\n### 缩进\n 使用 使用 tab 进行缩进，而不是空格。每个 tab 等于八个空格。\n\
  \n### 行长度\n- 代码和注释的行长度限制在 80 个字符以内。\n- 异常：解释性注释可以多达 100 个字符。\n\n### 大括号\n- 使用 Kernighan\
  \ and Ritchie 风格的大括号，其中左括号与语句或函数声明在同一行：\n```c\nif (condition) {\n    /* code here\
  \ */\n} else {\n    /* code here */\n}\n```\n\n### 函数和变量\n- 函数名使用小写字母并加下划线（例如 `function_name()`）。\n\
  - 变量名使用小写字母并加下划线（例如 `variable_name`）。\n- 使用描述性的变量和函数名。\n\n## 结构\n- 结构名使用小写字母并加下划线，字段名使用小写字母并加下划线（例如\
  \ `struct my_struct { int field_name; }`）。\n\n### 注释\n- 使用 `/* ... */` 注释而不是 `//`。\n\
  - 注释应该简洁，解释“为什么”而不是“是什么”。\n- 记录函数参数、返回值和全局变量。\n- 将注释放在其所描述的代码之前。\n\n### 头文件和包含\n\
  - 按字母顺序组织包含语句，系统头文件在前，然后是内核头文件，最后是本地头文件。\n- 避免在头文件中使用 `#include` 以减少依赖问题。\n\n###\
  \ 空格和空行\n- 逗号后使用单个空格。\n- 行尾不要有尾随空格。\n- 使用空行分隔代码逻辑部分，但不要过度使用。\n\n### Switch 语句\n\
  - case 标签的缩进级别与 switch 语句对齐，没有额外的缩进。\n\n### 返回语句\n- 避免在返回语句中使用复杂的表达式。\n- 除非必要，否则不在返回值周围加括号。\n\
  \n## 错误处理\n- 使用负错误代码（例如 `ENOMEM`）进行错误返回。\n- 避免在错误处理中使用 `goto`；相反应使用结构化的错误处理。\n\n\
  ### 宏\n- 谨慎使用宏，简单任务优先使用内联函数。\n- 宏的命名应使用大写字母并加下划线（例如 `#define MACRO_NAME`）。\n\n###\
  \ 枚举和常量\n- 优先使用枚举而不是 `#define`。\n- 常量应使用大写字母并加下划线命名（例如 `#define CONSTANT_NAME`）。\n\
  \n### 类型转换\n- 避免不必要的类型转换。\n- 在适当时使用 C99 类型（例如 `int32_t`, `uint64_t`）。\n\n### 许可证和版权头文件\n\
  - 在源文件中包含适当的许可证和版权头文件。\n\n\n\n\n*   驱动在内核内部或外的编译\n*   在 Buildroot 内部编译\n*   在 Yocto\
  \ 内部编译\n*   内核设施与辅助函数\n*   错误处理\n*   安装模块\n*   加载和卸载动态模块\n*   模块依赖\n*   模块参数\n*\
  \   模块许可\n*   模块日志\n*   动态内核模块支持\n\n## 目标\n\n主要目标是更好地理解和吸收用户空间与内核本身之间不同的交互。此外，我们将建立贯穿全本书的驱动程序编写基础。在本章结束时，你将能够编写简单的驱动程序、编译它们，并将它们加载到\
  \ GNU/Linux 内核中。\n\n## 用户空间、内核空间和系统调用接口\n\nLinux 主要分为非特权用户空间和内核空间。这两个组件通过一个称为接口（interface）的系统进行交互，该接口是用户态应用程序访问\
  \ Linux 内核的预定义且成熟的接口。\n\n下图将让你对用户空间和内核空间之间的层级划分有一个基本的了解：\n\n![](img/figure3.1.png)\n\
  \n图 3.1：用户空间通过 sci 与内核的交互\n\n以下是对每一层的详细描述：\n\n*   **用户空间 (Userspace)**:\n    * \
  \  用户空间是指计算机内存和处理能力中运行用户级应用程序和进程的部分。\n    *   用户级应用程序包括文本编辑器、网络浏览器、媒体播放器以及典型用户直接交互的软件。\n\
  \    *   用户空间应用程序对硬件和系统资源的访问权限有限。它们依赖操作系统内核来执行特权操作，例如读写硬件设备或管理内存。\n*   **内核空间 (Kernelspace)**:\n\
  \    *   内核空间是指计算机内存和处理能力中运行操作系统内核内核的部分。\n    *   内核是操作系统的核心组件，负责管理系统资源、调度任务、控制硬件设备并执行安全策略。\n\
  \    *   内核空间被认为是特权的，并具有直接访问硬件的权限。内核处理硬件中断和系统调用，使其操作系统操作系统至关部分。\n*   **系统调用接口 (System\
  \ call interface)**:\n    *   系统调用接口 (`SCI`) 是一组函数和机制，允许用户空间中的用户级应用程序请求内核空间提供的服务。\n\
  \    *   系统调用是应用程序与内核交互的标准方式。它们在两个空间之间架起了桥梁，允许用户级应用程序执行需要特权操作的任务，如文件 I/O、进程管理和硬件访问。\n\
  \    *   常见的系统调用包括 `open()`/`close()`、`read()`、`write()`、`fork()`、`exec()`、`exit()`\
  \ 等。\n    *   用户级应用程序使用操作系统提供的特定库和语言结构进行系统调用。例如，在 C 语言中，你可以使用 `open()`、`read()`\
  \ 和 `write()` 等函数来发起系统调用。\n\n执行系统调用时，事件的序列通常涉及以下步骤：\n\n*   用户级应用程序通过操作系统库提供的函数（例如\
  \ C 标准库）调用系统调用。\n*   库函数准备参数并触发软件中断（例如使用汇编指令）。\n*   CPU 从用户空间切换到内核空间，并开始执行内核代码。\n\
  *   内核处理系统调用，执行请求的操作，并将结果返回给用户级应用程序。\n*   CPU 回到用户空间，用户级应用程序继续其执行。\n\n下图显示了调用 C\
  \ 标准库函数之一 `fwrite`（来自名为 `libc` 或 `glibc` 的 C 库）时涉及的步骤序列：\n\n![](img/figure3.2.png)\n\
  \n图 3.2：从用户空间到 Linux 内核的系统调用追踪\n\n过程中的步骤如下：\n\n1.  `fwrite()` 函数（来自标准 C 库）在 `test.c`\
  \ 源码中使用，实现在 `glibc` 中，它是 Linux 的主要组件之一。\n2.  `fwrite()` 是 `write()` 函数的封装。\n3. \
  \ `write()` 将 `sys_write()` 系统调用 ID 及其参数加载到处理器寄存器中，然后执行上下文切换将控制交给内核级。\n4.  执行方式取决于处理器架构，有时取决于处理器型号。例如，x86\
  \ 处理器通常调用中断 80，而 x64 处理器使用 syscall 处理器指令。现在运行在内核空间的处理器将系统调用 ID 传递给系统调用表并调用函数 `sys_write()`。\n\
  \n用户空间、内核空间和系统调用接口是 GNU/Linux 架构的重要组成部分，使其能够为运行应用程序提供安全控制的环境，同时高效地管理系统资源和硬件访问。\n\
  \nLinux 的 `SCI` 在很大程度上符合 POSIX 标准，尽管有一些 Linux 特有的变体和扩展。可移植操作系统接口 (POSIX) 是一项规范，它为类\
  \ Unix 操作系统定义了一 set 系统接口、库和编程标准，旨在确保应用程序在各种 Unix 平台上的可移植性。\n\nLinux 作为一种类 Unix 操作系统，是基于\
  \ POSIX 原则和标准设计的。因此，Linux 中提供的许多函数和系统调用都遵循 POSIX 规范。这意味着根据 POSIX 标准开发的应用程序通常与 Linux\
  \ 以及其他类 Unix 操作系统兼容。\n\n然而，必须注意的是，Linux 也有自己未被 POSIX 覆盖的特定扩展和功能。应用程序开发者应该意识到这些差异，在某些情况下，可能需要调整其应用程序以利用\
  \ Linux 特有的功能。\n\n驱动程序也不例外，它们通过系统调用与二进制文件交互。如果内核什么都不做且不运行，它就不能成为操作系统。它需要进程，因此 SCI\
  \ 被用作标准接口。\n\n所有驱动程序都由两个回调结构化。第一个回调 `init_module()` 在加载时调用，用于初始化并预留所有资源；第二个回调 `cleanup_module()`\
  \ 在卸载时进行清理或释放内存。\n\n下图详细说明了将内核模块动态加载到 GNU/Linux 内核的过程。它展示了驱动程序的输入和输出钩子（hooks）：\n\
  \n![](img/figure3.3.png)\n\n图 3.3：内核中驱动程序的动态（卸）载\n\n为了开始，我们将使用这段简单的代码作为 hello world：\n\
  \n```c\n/*\n\n* 最简单的 hello-world 内核模块\n*/\n#include <linux/init.h> /* 宏需要它 */\n\
  #include <linux/module.h> /* 所有模块都需要 */\n#include <linux/printk.h> /* pr_info()\
  \ 需要它 */\n\nstatic int __init hello_init(void)\n{\n    pr_info(\"Hello, world\\\
  n\");\n    return 0;\n}\n\nstatic void __exit hello_exit(void)\n{\n    pr_info(\"\
  Goodbye, world\\n\");\n}\n\nmodule_init(hello_init);\nmodule_exit(hello_exit);\n\
  \nMODULE_LICENSE(\"GPL\");\n```\n\n在加载驱动程序时执行的初始化回调用于记录和预留驱动程序正常运行所需的资源（能力）。相反，清理回调在卸载驱动程序时释放所有不必要的资源。\n\
  \n我们将使用这个代码骨架来突出本章的不同重点。\n\n## 驱动在内核内部或外的编译\n\n现在我们有了一个极简的驱动程序，想要编译它以便进行测试。\n\n\n\
  \n\n\n对于这一点，有几种可能性，取决于代码是否已经存在 Linux 内核源码中。在第 2 章 Linux 内核简介]中，我们学习了如何获取 GNU/Linux\
  \ 内核源码，现在这对我们来说非常有用，因为项目源码根目录下的 `makefile` 是生成驱动程序的引擎。\n\n## 在 GNU/Linux 内核中编译\n\
  \n目标是自定义 GNU/Linux 内核源码，并添加一个可以通过 `make menuconfig` 命令查看的选项。\n\n以下是 `drivers/helloworld/`\
  \ 目录下所需的文件，当然还包括 `helloworld.c`：\n\n```\ndrivers/helloworld/\n├── helloworld.c\n\
  ├── Kconfig\n└── Makefile\n```\n\n所有驱动都位于 Linux 源码的 `drivers/` 目录下。在此阶段，我们将进入源码根目录。\n\
  \n我们必须先在 `drivers/Makefile`文件的末尾添加以下行，以便源码识别它：\n\n```\nobj-$(CONFIG_HELLOWORLD)\
  \ += helloworld/\n```\n\n要编辑 `drivers/Kconfig` 文件，请在 `endmenu` 行之前添加以下行：\n\n```\n\
  source \"drivers/helloworld/Kconfig\"\n```\n\n从那里，我们将创建一个包含我们的 hello world 驱动程序的新目录：\n\
  \n```bash\nmkdir -p helloworld/\n```\n\n创建 `drivers/helloworld/Kconfig` 文件并编辑它：\n\
  \n```make\nmenu “HELLOWORLD support”\nconfig HELLOWORLD\ntristate \"HELLOWORLD Support\"\
  \ndefault m\nhelp\n  输入 Y 启用 HELLOWORLD 支持，输入 M 编译为模块\nendmenu\n```\n\n最后，创建 `drivers/helloworld/Makefile`\
  \ 文件：\n\n```makefile\nobj-${CONFIG_HELLOWORLD} := helloworld.o\n```\n\n因此，我们可以使用对应开发机器当前内核的\
  \ `.config` 文件（或重新加载）来（重新）配置我们的内核。检查配置界面是否显示了你的新驱动程序，并允许将其选择为模块。选择设备驱动菜单，然后进入底部：\n\
  \n```bash\nmake menuconfig\n```\n\n接下图显示了在 GNU/Linux 内核配置步骤中我们模块的可能选择。箭头表示子部分：\n\
  \n![](img/figure3.4.png)\n\n图 3.4：选择我们的新模块\n\n在 `drivers/helloworld/Makefile` 文件中，我们带有以下状态选择“tristate”：\n\
  \n*   状态 1：未选择。\n*   状态 2 或 M：编译为驱动程序；这将生成 `.ko` 文件。\n*   状态 3 或 \\：编译到 Linux 内核的静态部分。\n\
  \n我们可以使用空格键更改状态。\n\n接下图显示了我们的子菜单中允许如前三态选择的子部分（如果此处为空，则模块不会被编译）：\n\n![](img/figure3.5.png)\n\
  \n图 3.5：内核配置中未选择驱动\n\n接下图显示了在动态模块（M）中选择我们的驱动程序：\n\n![](img/figure3.6.png)\n\n图 3.6：选择编译为动态模块的驱动\n\
  \n接下图显示了在内核本身静态部分选择我们的驱动程序：\n\n![](img/figure3.7.png)\n\n图 3.7：选择编译到内核静态部分的驱动\n\n\
  HELLOWORLD 驱动程序应该出现在设备驱动列表的末尾：\n\n```bash\ncat .config|grep -i helloworld\n```\n\
  \n```\n## HELLOWORLD support\nCONFIG_HELLOWORLD=m\n## end of HELLOWORLD support\n\
  ```\n\n因此，我们可以开始编译模块：\n\n```bash\nmake\n```\n\n[...]\nLD drivers/helloworld/builtin.o\n\
  CC [M] drivers/helloworld/helloworld.o\nMODPOST vmlinux\nBuilding modules, stage\
  \ 2.\nMODPOST 1 modules\nCC drivers/helloworld/helloworld.mod\n```\n\n| 注意：有时内核必须准备好进行模块编译可以使用：\
  \ |\n\n```bash\nmake modules_prepare\n```\n\n以这种方式添加驱动程序非常罕见，因为其存在于内核中；它受到了 GNU/Linux\
  \ 内核 GPL 许可证协议的限制！这就是为什么大多数情况下使用源码中的 `Makefile` 进行外部编译。这正是我们现在将看到的。我们将学习另一种外部方法，即将驱动程序的源码移动到内核源码代码之外。\n\
  \n## 在 GNU/Linux 内核之外编译\n\n与之前的编译区别在于，我们的驱动程序源码不是 GNU/Linux 内核的源码。因此，我们需要一个 `Makefile`，它将远程调用位于内核源码根目录的那个：\n\
  \n让我们创建一个名为 `helloworld` 的目录，包含以下两个文件：\n\n```\nhelloworld\n├── helloworld.c : 我们驱动程序的源码\n\
  └── Makefile : 用于构建/安装我们驱动程序的主文件\n```\n\n我们的 `makefile` 将包含内容：\n\n```makefile\n\
  obj-m := helloworld.o\nKERNEL_DIRECTORY := /lib/modules/$(shell uname -r)/build\n\
  \nall:\n\tmake helloworld-C $(KERNEL_DIRECTORY) modules\n\tmodinfo ./helloworld.ko\n\
  \nload:\n\tinsmod ./helloworld.ko\n\tdmesg\n\nunload:\n\trmmod ./helloworld.ko\n\
  \tdmesg\n\ninstall:\n\tmake M=$(shell pwd)-C $(KERNEL_DIRECTORY) modules_install\n\
  \t/sbin/depmod -a\n\nclean:\n\tmake M=$(shell pwd)-C $(KERNEL_DIRECTORY) clean\n\
  ```\n\n对于此步，你必须安装 `KERNEL_DIRECTORY` 变量指向的 Linux 内核源码！让我们构建驱动：\n\n```bash\nmake\n\
  ```\n\n```bash\nmake M=/home/tgayet/Documents/bpb/03-introduction-to-device-drivers-27-10-2023/helloworld\
  \ -C /lib/modules/6.2.0-35-generic/build\nmake[1]: Entering directory '/usr/src/linux-headers-6.2.0-35-generic'\n\
  CC [M] /home/tgayet/Documents/bpb/03-introduction-to-device-drivers-27-10-2023/helloworld/helloworld.o\n\
  MODPOST /home/tgayet/Documents/bpb/03-introduction-to-device-drivers-27-10-2023/helloworld/Module.symvers\n\
  CC [M] /home/tgayet/Documents/bpb/03-introduction-to-device-drivers-27-10-2023/helloworld/helloworld.mod\n\
  LD [M] /home/tgayet/Documents/bpb/03-introduction-to-device-drivers-27-10-2023/helloworld/helloworld.ko\n\
  make[1]: Leaving directory '/usr/src/linux-headers-6.2.0-35-generic'\n```\n\n它必须生成以下文件：\n\
  \n```bash\nls -al\ntotal 344\ndrwxr-xr-x 2 tgayet tgayet 4096 Oct 23 ..\ndrwxr-xr-x\
  \ 1 tgayet tgayet 4096 Oct 23 .\n-rw-r--r-- 1 tgayet tgayet 366 Oct 23 helloworld.c\n\
  -rw-r--r-- 1 tgayet tgayet 109288 Oct 23 helloworld.ko\n-rw-r--r-- 1 tgayet tgayet\
  \ 497 Oct 23 .helloworld.ko.cmd\n-rw-r--r-- 1 tgayet tgayet 100 Oct 23 helloworld.mod\n\
  -rw-r--r-- 1 tgayet tgayet 891 Oct 23 helloworld.mod.c\n-rw-r--r-- 1 tgayet tgayet\
  \ 364 Oct 23 .helloworld.mod.cmd\n-rw-r--r-- 1 tgayet tgayet 93368 Oct 23 helloworld.mod.o\n\
  -rw-r--r-- 1 tgayet tgayet 39157 Oct 23 .helloworld.mod.o\n-rw-r--r-- 1 tgayet tgayet\
  \ 17336 Oct 23 helloworld.o\n-rw-r--r-- 1 tgayet tgayet 38181 Oct 23 .helloworld.o.cmd\n\
  -rw-r--r-- 1 tgayet tgayet 326 Oct 21 Makefile\n-rw-r--r-- 1 tgayet tgayet 100 Oct\
  \ 23 modules.order\n-rw-r--r-- 1 tgayet tgayet 326 Oct 23 .modules.order.cmd\n-rw-r--r--\
  \ 1 tgayet tgayet 0 Oct 23 Module.symvers\n-rw-r--r-- 1 tgayet tgayet 371 Oct 23\
  \ .Module.symvers.cmd\n```\n\n我们可以检查我们的新的 `helloworld` 驱动程序：\n\n```bash\nfile helloworld.ko\n\
  ```\n\n```\nhelloworld.ko: ELF 64-bit LSB relocatable, x86-64, version 1 (SYSV),\
  \ BuildID[sha1]=8b326f53f0a0c4dddd0358f110e79baa36c83, with debug_info, not stripped\n\
  ```\n\n```bash\nmodinfo helloworld.ko\n```\n\n```\nfilename: /home/tgayet/Documents/bpb/03-introduction-to-device-drivers-27-10-2023/helloworld/helloworld.ko\n\
  license: GPL\nsrcversion: 80158CC88F174840B63317\ndepends:\nretpoline: Y\nname:\
  \ helloworld\nvermagic: 6.2.0-35-generic SMP preempt mod_unload modversions\n```\n\
  \n由于 `uname -r`，驱动程序非常适应我们的内核版本。因此可以无问题地动态加载：\n\n```bash\ninsmod ./helloworld.ko\n\
  ```\n\n我们可以检查模块是否已加载：\n\n```bash\ncat /proc/modules|grep -i helloworld\n```\n\n\
  ```\nhelloworld 16384 0 - Live 0x0000000000000000 (OE)\n```\n\n或者\n\n```bash\nlsmod|grep\
  \ -i helloworld\n```\n\n```\nhelloworld 16384 0\n```\n\n最后，我们可以卸载它：\n\n```bash\n\
  rmmod ./helloworld.ko\n```\n\n内核追踪将显示来自驱动程序的消息：\n\n```bash\ndmesg -w\n```\n\n```\n\
  [20429.883271] Hello, world\n[20624.543701] Goodbye, world\n```\n\n\n\n\n在这里，我们已经有了\
  \ helloworld 驱动，我们将随着时间的推移对其进行进。\n\n如果你需要将源代码分为几个文件（`helloworld.c`、`start.c`、`stop.c`），你可能需要按照如下调整上面的\
  \ makefile：\n\n```makefile\nobj-m += helloworld.o\nobj-m += startstop.o\nstartstop-objs\
  \ := start.o stop.o\nPWD := $(CURDIR)\n\nall:\n\tmake M=$(shell pwd) -C /lib/modules/$(shell\
  \ uname -r)/build modules\nclean:\n\tmake M=$(shell pwd) -C /lib/modules/$(shell\
  \ uname -r)/build\n```\n\n针对嵌入式领域的使用，我们将快速讨论在 Buildroot 或 Yocto 环境中编译驱动。遗憾的是有很多构建系统，我们无法描述所有的，但讨论的两种是最常见的。\n\
  \n### 在 Buildroot 项目中编译\n\n在你的 Buildroot 项目中，在 `package` 目录下创建一个 `helloworld` 目录。\n\
  \n```text\npackage/\n└── helloworld\n├── Config.in\n├── helloworld.mk\n└── helloworld.c\n\
  ```\n\n将上述 `helloworld.c` 源代码添加到 `helloworld` 目录中。\n\n在此目录下，创建一个 `Config.in` 文件。该文件用于配置内核驱动包并在\
  \ Buildroot 配置中启用它：\n\n```text\nconfig BR2_PACKAGE_HELLOWORLD\nbool \"Helloworld\
  \ driver\"\ndepends on BR2_PACKAGE_HELLOWORLD_LOADABLE\nhelp\nMy custom kernel driver\n\
  \nconfig BR2_PACKAGE_HELLOWORLD_LOADABLE\nbool \"Enable helloworld Driver\"\ndefault\
  \ y\nhelp\nEnable building and loading of helloworld Driver\n```\n\n创建一个 `helloworld.mk`\
  \ makefile，用于定义如何编译和安装你的内核驱动。该 makefile 应该指定包名、源码位置、编译指令以及其他相关的细节。\n\n```makefile\n\
  HELLOWORLD_VERSION = 1.0\nHELLOWORLD_SOURCE = $(TOPDIR)/path/to/your/source\nHELLOWORLD_SITE\
  \ = file://$(HELLOWORLD_SOURCE)\nHELLOWORLD_INSTALL_TARGET = YES\n\n$(eval $(kernel-module))\n\
  ```\n\n调整 `HELLOWORLD_VERSION`、`HELLOWORLD_SOURCE` 和其他变量以匹配你特定的内核驱动。`$(eval $(kernel-module))`\
  \ 一行用于指示 Buildroot 将其编译为内核模块。\n\n要在你的 Buildroot 构建中包含你的自定义内核驱动包，请进入你的 Buildroot\
  \ 配置（通常位于 `configs/` 目录下），并在“Target packages”部分下启用你的包。你可以通过 `menuconfig` 界面或直接编辑\
  \ `.config` 文件来实现。\n\n在配置好你的包后，使用 `make` 命令构建你的 Buildroot 项目：\n\n```bash\n$ make\n\
  ```\n\n一旦 Buildroot 构建完成，你可以在输出目录中找到你的内核驱动模块。根据需要并在目标设备上安装和加载它即可。\n\n### 在 Yocto\
  \ 项目中编译\n\nYocto recipe（配方）通常被组织成层（layers）。你应该导航到你想要创建 recipe 的 Yocto 层。`meta` 目录通常用于组织\
  \ Yocto 层。\n\n在你的层内部，创建一个目录来包含你的内核驱动 recipe。目录结构应该如下：\n\n```text\nmeta-yourlayer/\n\
  ├── recipes-kernel/\n│   ├── helloworld/\n│   │   ├── helloworld.bb\n│   │   └──\
  \ helloworld.c\n```\n\n在 helloworld 目录中，创建一个 `helloworld.bb` recipe 文件来定义你的内核驱动\
  \ recipe。`.bb` 文件的内容应该如下：\n\n```text\nDESCRIPTION = \"Helloworld Driver\"\nLICENSE\
  \ = \"CLOSED\" # 指定合适的许可证\n\nSRC_URI = \"file://path/to/your/source.tar.gz\"\nS\
  \ = \"${WORKDIR}\"\n\n# 定义你的构建依赖\nDEPENDS = \"linux-yocto\"\n\n## 指定目标内核版本\nCOMPATIBLE_MACHINE\
  \ = \"your-target-machine\"\n\ndo_compile() {\n    # 在此处添加你的构建指令\n}\n\ndo_install()\
  \ {\n    # 定义安装指令（如果需要）\n}\n\nFILES_${PN} += \"${libdir}/modules/${KERNEL_VERSION}/extra/*\"\
  \n```\n\nYocto 使用模板工作；只需自定义某些变量即可，例如包含我们驱动源码的 git 仓库 URL、其许可证和依赖项：\n\n- `Description`:\
  \ 你的内核驱动的简要描述。\n- `LICENSE`: 指定合适的许可证。\n- `SRC_URI`: 指向你的驱动源码的源码 URI。\n- `DEPENDS`:\
  \ 定义任何构建依赖。在这种情况下，我们指定 `linux-yocto` 作为示例。\n- `COMPATIBLE_MACHINE`: 指定你的驱动的目标机器。\n\
  - `do_compile()`: 添加特定于你的内核驱动的构建指令。\n- `do_install()`: 如果需要，定义安装指令。\n- `FILES_${PN}`:\
  \ 指定安装内核模块文件的位置。\n\n若要在 Yocto 镜像中包含你的自定义驱动，你需要将它添加到你的镜像 recipe 中。你可以通过修改 Yocto 项目配置中的自定义镜像\
  \ recipe 来实现这一点。这里是如何将其添加到镜像 recipe 的简化示例：\n\n```text\nIMAGE_INSTALL_append = \"\
  \ helloworld\"\n```\n\n这一行告诉 Yocto 在镜像中包含你的 `helloworld` 包。\n\n在定义了内核驱动 recipe 并将其添加到镜像中后，你可以使用\
  \ `bitbake` 命令构建 Yocto 镜像：\n\n```bash\n$ bitbake your-image\n```\n\n构建过程完成后，你将在\
  \ Yocto 配置指定的部署目录中找到你的内核驱动模块。根据需要并在目标设备上部署并加载它即可。\n\n\n\n\n\n- `pm_runtime_get()`,\
  \ `pm_runtime_put()` 以及相关函数：用于管理设备的电源状态。\n- 设备树（Device trees）：\n    - `of_get_property()`：从设备树中检索属性的函数。\n\
  \    - `of_platform_populate()`：根据设备树信息向平台总线（platform bus）填充设备的函数。\n- 杂项辅助函数：Linux\
  \ 内核库提供了用于字符串处理、列表管理、位操作等各种辅助函数。\n\n这些设施和辅助函数在内核驱动开发以及内核各个各个方面的实现中起着至关重要的作用。\n\n\
  它们提供了一种标准化的方法与内核核心交互并管理硬件设备，确保了不同硬件平台的稳定性和兼容性。\n\n## 错误处理\n\n在 Linux 驱动程序中处理错误对于维持系统稳定性以及确保硬件或软件组件的正常运行至关重要。\n\
  \n错误处理可能非常复杂，取决于驱动程序的特定上下文。以下是 Linux 驱动程序中处理错误的通用指南：\n\n- **返回值**：在 C 代码中，通常使用返回值来指示错误。可能失败的函数通常返回错误代码或负值。例如，标准惯例是返回\
  \ 0 表示成功，返回负值表示失败，负错误表示特定的错误状况。\n- **错误代码**：使用预定义的错误代码使错误处理更加明确且有意义。在 Linux 内核中，错误代码定义在\
  \ `errno.h` 等头文件中，可以在你的驱动程序代码中使用。\n- **记录错误**：当发生错误时，使用 `pr_err()`、`dev_err()` 或\
  \ `printk()` 等函数将详细记录到内核日志中。这允许系统管理员和人员诊断问题。\n\n示例：\n\n```c\nif (error_condition)\
  \ {\n    pr_err(\"Error message: %s\\n\", error_description);\n    return -ENODEV;\
  \ // 返回适当的错误代码\n}\n```\n\n- **清理资源**：如果你的驱动程序分配了资源（内存、I/O 端口等），确保在发生错误时释放它们。这可能涉及释放内存、注销设备或撤销驱动程序已做的任何设置。\n\
  - **返回适当的错误代码**：在返回错误代码时，确保使用指示特定错误条件的意义代码。Linux 提供了广泛的错误代码（例如，用于内存不足的 `-ENOMEM`，用于\
  \ I/O 错误的 `-EIO`）。选择最合适的代码来描述问题。\n- **恢复**：考虑你的驱动程序是否可以从某些错误中恢复。例如，如果与硬件通信出错，你可以尝试重置设备或优雅地恢复。\n\
  - **避免内核崩溃（Kernel panic）**：尽力避免内核崩溃。如果错误严重到系统无法继续安全运行，那么卸载驱动程序或禁用硬件可能比导致内核崩溃更好。\n\
  - **测试与验证**：在各种条件下对你的驱动程序进行严格测试，以确保它正确处理错误。这包括触发错误状况的负测试用例。\n- **文档**：记录驱动程序代码中使用的错误处理策略，以便其他开发人员能够有效地理解和维护代码。\n\
  - **用户友好的消息**：如果你的驱动程序向用户态提供消息，请确保错误信息清晰，并提供关于发生什么错误的有用信息。\n- **代码审查**：让经验丰富的开发人员审查你的代码。他们可能会识别潜在的错误场景或对错误处理提出改进建议。\n\
  - **使用调试工具**：Linux 内核提供了各种调试工具和框架（例如 `kprobes`、`kdump`、`kexec`），可以帮助诊断和排除驱动程序问题。\n\
  \n内核驱动程序中的错误处理是内核开发的一个关键方面。理解预期的错误场景以及如何响应它们对于创建可靠稳定的驱动程序至关重要。\n\n此主题将在第 13 章“调试\
  \ GNU/Linux 内核与驱动程序”中进行更深入的讨论。\n\n## 安装模块\n\n安装驱动程序通过使用 GNU Linux 内核主 Makefile 的\
  \ `modules_install` 目标来完成：\n\n```bash\n$ make modules_install\n```\n\n`depmod` 命令用于生成模块依赖缓存。这些信息对于内核高效地动态管理和（卸载）内核模块至关重要。要实现这一点，只需在安装模块后使用\
  \ `depmod` 命令即可：\n\n```bash\n$ depmod -a\n```\n\n`depmod` 的主要目的如下：\n\n- **依赖解析**：\n\
  \    - `depmod` 的主要目的之一是分析内核模块并确定它们对其他模块的依赖。\n    - 内核模块通常依赖其他模块才能正常工作。`depmod`\
  \ 识别这些依赖关系（可能包括其他内核模块或符号），并创建这些信息的数据库。\n- **模块加载**：\n    - 内核在使用 `modprobe` 等命令加载模块或在系统启动过程中，会使用\
  \ `depmod` 生成的依赖信息。\n    - 当请求加载模块时，内核会检查依赖信息以确保先加载所有需要的模块。\n- **防止符号冲突**：\n   \
  \ - 内核模块可以定义并使用符号（函数或变量），这些符号可能在多个模块间通用。\n    - `depmod` 通过维护哪些符号被哪些模块记录帮助避免符号冲突。这防止了模块以冲突的方式使用相同的符号名。\n\
  - **高效模块加载**：\n    - `depmod` 创建名为 `modules.dep` 的文件，以内核易于解析的格式存储模块依赖。\n    - 这允许内核高效地加载模块，因为它可以根据依赖关系快速确定所需的加载顺序。\n\
  - **更新模块依赖关系**：\n    - 每当安装新模块、修改现有模块或更新内核时，依赖信息就会更新。\n    - 当系统内核更新时，通常需要运行 `depmod`\
  \ 以确保依赖关系是最新的。\n\n总之，`depmod` 通过生成和维护模块依赖信息，在 Linux 系统中管理和加载内核模块方面起着至关重要的作用。这些信息对于内核及其所依赖的模块的正常运行非常重要。\n\
  \n该命令更新 `/lib/modules/`uname -r`/modules.dep` 文件，该文件主要用于加载和通过 `modprobe` 动态加载：\n\
  \n```bash\n$ cat /lib/modules/`uname -r`/modules.dep\n```\n\nupdates/dkms/sysdig-probe.ko:\n\
  \nkernel/zfs/znvpair.ko: kernel/zfs/spl.ko\n\nkernel/zfs/spl.ko:\n\n(...)\n\n最的缓存文件通常是：\n\
  \n- `/lib/modules/`uname -r`/modules.dep`：该文件包含模块及其依赖的列表。\n- `/lib/modules/`uname\
  \ -r`/modules.alias`：该文件包含模块的别名，允许使用不同的名称加载模块。\n\n## 加载和卸载动态模块\n\nLinux 下有两种加载或卸载驱动的方法，一种是手动的（`insmod`\
  \ / `rmmod`），另一种是自动的（`modprobe`），正如我们在安装时通过 `depmod` 命令看到的那样。\n\n你可以使用 `insmod`\
  \ 或 `modprobe` 命令加载模块。使用 `insmod` 手动加载模块。将 `<module_name>` 替换为不带 `.ko` 扩展名：\n\n\
  ```bash\n$ sudo insmod /path/to/your/module_name.ko\n```\n\n要手动卸载模块，使用以下 `rmmod`\
  \ 命令，将 `<module_name>` 替换为要卸载的模块名称：\n\n```bash\n$ sudo rmmod module_name\n```\n\n\
  \n\n\n`modprobe` 命令是加载模块的推荐命令，因为它处理依赖关系。如果模块具有依赖项，`modprobe` 将自动加载它们。使用方法如下：\n\n\
  ```bash\n$ sudo modprobe module_name\n```\n\n要使用 `modprobe` 卸载模块，请使用带有 `-r` 选项的命令，并将\
  \ `<module_name>`替换为要卸载的模块名称：\n\n```bash\n$ sudo modprobe -r module_name\n```\n\n\
  `-r` 选项告诉 `modprobe` 指定的模块。\n\n如果模块具有依赖项，`modprobe` 还会卸载任何依赖于它的模块。卸载模块时要小心，因为这可能会影响系统的功能。\n\
  \n## 模块依赖\n\n驱动程序通常通过导出有用且可分解的函数来为另一个驱动程序提供功能。\n\n一个驱动程序对另一个驱动程序的依赖基于它们之间共享的符号。例如，我们将看到一个导出符号（函数）的模块，该符号将通过（导入）在另一个独立的模块中使用：\n\
  \n![](img/figure3.8.png)\n\n图 3.8：具有依赖关系的两个驱动程序\n\n为了集中管理导出的共享函数，通常会使用 `.h` 文件，它集中包含了这些函数的原型：\n\
  \n```c\n#ifndef EXPORT_SYMBOLE_H\n\n#define EXPORT_SYMBOLE_H\n\nvoid fonction_hello(int\
  \ numero);\n\n#endif\n```\n\n第一个导出驱动程序的代码是导出 `fonction_hello` 函数的驱动程序代码。我们注意到使用了\
  \ `export_api.h` 头文件：\n\n```c\n#include <linux/module.h>\n\n#include \"export_api.h\"\
  \n\nstatic int __init export_chargement(void)\n{\nprintk(KERN_ALERT \"Hello, world\\\
  n\");\nreturn 0;\n}\n\nstatic void __exit export_dechargement(void)\n{\nprintk(KERN_ALERT\
  \ \"Goodbye, cruel world\\n\");\n}\n\nvoid fonction_hello(int numero)\n{\nprintk\
  \ (KERN_INFO \"Hello, le numero est %d\\n\", numero);\n}\n\nEXPORT_SYMBOL(fonction_hello);\n\
  \nMODULE_LICENSE(\"GPL\");\n\nmodule_init(export_chargement);\n\nmodule_exit(export_dechargement);\n\
  ```\n\n第二个导入驱动程序的代码是导入 `fonction_hello` 函数的驱动程序代码。我们也可以注意到使用了 `\"export_api.h\"\
  ` 头文件：\n\n```c\n#include <linux/module.h>\n\n#include \"export_api.h\"\n\nstatic\
  \ int __init import_chargement(void)\n{\nprintk(KERN_ALERT \"Hello, world\\n\");\n\
  fonction_hello(10); // 导入的函数\nreturn 0;\n}\n\nstatic void __exit import_dechargement(void)\n\
  {\nfonction_hello(20); // 导入的函数\nprintk(KERN_ALERT \"Goodbye, cruel world\\n\");\n\
  }\n\nmodule_init(import_chargement);\n\nmodule_exit(import_dechargement);\n\nMODULE_LICENSE(\"\
  GPL\");\n```\n\n在编译阶段，将生成两个相互依赖的驱动程序：\n\n```bash\n$ make\nmake M=/home/tgayet/Documents/bpb/03-introduction-to-the-device-drivers-27-10-2023/code_3_dependencies\
  \ -C /lib/modules/6.2.0-35-generic/build modules\nmake[1]: Entering directory '/usr/src/linux-headers-6.2.0-35-generic'\n\
  warning: the compiler differs from the one used to build the kernel\nThe kernel\
