  \n![](img/fm1.png)\n\n# 第 4 章：Linux 设备模型\n\n## 引言\n\n在上一章学习了 Linux 驱动程序的基础之后，我们将看到\
  \ Linux 设备模型 (LDM) 的结构。GNU/Linux 内核已经标准化，以简化开发者对内核和驱动程序的维护和可扩展性。本章将提供对这些基础的更好理解。\n\
  \n## 结构\n\n本章涵盖了以下主题：\n\n* Linux 设备模型数据结构\n* 总线模型\n* 设备模型\n* 驱动模型\n* 类 (classes)\n\
  * 关于 `procfs`\n* 关于 DTB 设备树\n\n## 目标\n\nLinux 设备模型是 Linux 内核中的一个框架，提供了一种标准化且统一的方法表示表示管理各种硬件设备。它抽象了与不同类型的设备交互的细节，允许内核和设备驱动程序通过一致的接口工作。我们将逐一研究所有的接口以更好地理解它们。\n\
  \n## Linux 设备模型数据结构\n\n设备模型简化了编写和维护设备驱动程序的任务，同时促进了模块化和设备管理的便利，例如：\n\n* **总线模型**：设备被组织在总线上，总线代表系统中的物理或逻辑互连。总线的示例包括\
  \ `PCI`、`USB`、`I2C` 和平台总线。\n* **设备模型**：设备在设备模型中表示对象，每个对象都有唯一的标识符和一组属性。设备按层级结构组织，反映了设备之间的物理或逻辑关系。\n\
  * **设备节点**：设备与 `/sys` 文件系统中的设备节点关联。这些节点提供了一个用户可读写的接口，用于与设备属性交互。用户和应用程序可以通过读取或写入相应设备节点的值来查询和配置设备。内核通过\
  \ `sysfs` 虚拟文件系统在用户空间提供其模型的表示。它通常挂载在 `/sys` 目录下，包含以下子目录：\n    * `Block`：系统中可用的块设备（磁盘、分区）\n\
  \    * `Bus`：物理设备连接的总线类型（`pci`、`ide`、`usb`）\n    * `Class`：系统中可用的驱动类（`net`、`sound`、`usb`）\n\
  \    * `Devices`：系统的设备的层级结构\n    * `Firmware`：系统固件信息（高级配置电源接口）\n    * `Fs`：挂载文件系统的信息\n\
  \    * `Kernel`：内核状态信息（登录用户、热插拔）\n    * `Module`：当前加载的模块列表\n    * `Power`：与电源管理子系统相关的信息\n\
  * **类模型**：设备根据其功能或类型进行分类（例如，块设备、网络设备）。每个类定义了一组通用属性和行为，该类中的设备应当遵循这些规定。\n* **驱动模型**：驱动模型定义了驱动程序与设备模型之间的接口。驱动程序在模型中注册自身，与特定类型的设备关联。当检测到兼容设备时，会将适当的驱动绑定到该设备。\n\
  * **驱动绑定**：绑定过程涉及将设备与适当的驱动关联。内核根据设备标识符（例如 `PCI IDs`）等标准匹配设备与驱动程序，允许正确的驱动程序处理特定设备。\n\
  * **驱动核心**：驱动核心是 Linux 设备模型的一个基础部分。它监督驱动程序和设备的注册与注销过程。它的主要功能是将设备与适当的驱动程序匹配，并确保它们之间的顺畅通信。\n\
  * **设备树**：在使用设备树的架构（例如 `ARM`）上，设备树是一种描述硬件拓扑和属性的数据结构。它用于在内核启动过程中实例化设备并配置设备模型。\n\n\
  Linux 设备模型提供了一个灵活且可扩展的框架，适应各种硬件架构和设备。它促进了硬件特定细节与驱动逻辑之间的关注点，使得为各种设备开发和维护驱动程序更容易。\n\
  \n为 Linux 内核编写的设备驱动通常通过驱动模型接口与设备模型交互，允许它们注册设备、管理资源并与内核的其他部分通信。设备模型是 Linux 内核的一个基本方面，使其能够支持多样化的硬件生态系统。\n\
  \n`sysfs` 信息可以在包含某些标准属性的文件中，这些属性由同名的文件或目录表示：\n\n* `Dev`：主设备和次设备标识符。它可以用于在 `/dev`\
  \ 目录中自动创建条目。\n* `Device`：指向包含设备目录的符号链接；它可以用于发现提供特定服务的设备（例如 `eth` PCI 卡）。\n* `Driver`：指向驱动程序目录的符号链接（位于\
  \ `/sys/bus/*/drivers`）。\n\n与设备驱动程序使用的若干种数据结构示例：\n\n![](img/figure4.1.png)\n\n图\
  \ 4.1：属性取决于总线和驱动程序\n\n`kobject` 结构通常嵌入在一个更大的结构中。它整合了一系列在 Linux 设备模型较高抽象级别使用的功能。\n\
  \n例如，`cdev` 结构的定义如下：\n\n```\nstruct cdev {\n    struct kobject kob;\n    struct\
  \ module *owner;\n    const struct file_operations *ops;\n    struct list_head list;\n\
  \    dev_t dev;\n    unsigned int count;\n};\n```\n\n我们可以在此结构中注意到类型为 `kobject` 的字段，而其定义如下：\n\
  \n```c\nstruct kobject {\n    const char *name;\n    struct list_head entry;\n \
  \   struct kobject *parent;\n    struct kset *kset;\n    struct kobj_type *ktype;\n\
  \    struct sysfs_dirent *sd;\n    struct kref kref;\n    unsigned int state_initialized:1;\n\
  \    unsigned int state_in_sysfs:1;\n    unsigned int state_add_uevent_sent:1;\n\
  \    unsigned int state_remove_uevent_sent:1;\n    unsigned int uevent_suppress:1;\n\
  };\n```\n\n因此，`kobject` 结构是层级的：一个对象有一个父对象并包含一个 `kset` 成员，该 `kset` 包含同一层的对象。\n\n\
  该结构需要使用 `kobject_init()` 函数进行初始化。在初始化过程中还需要设置 kobject 结构的名称，它将出现在 `sysfs` 中，需要使用\
  \ `kobject_set_name()` 函数。\n\n\n\n\n\n对 `kobject` 的任何操作都是通过使用 `kobject_get()` 增加其内部计数器或在不再使用时使用\
  \ `kobject_put()` 减少计数器来完成的。因此，`kobject` 只有在内部计数器为 0 时才会释放。需要一种通知方法，以便释放与包含 `kobject`\
  \ 结构的设备结构相关的资源（例如 `cdev`）。使用的方法称为 `release`，通过 `ktype` 字段（`struct kobj_type`）与对象关联。\n\
  \n`kobject` 结构是 Linux 设备模型的基础结构。该模型的上层结构是 `struct bus_type`、`struct device` 和 `struct\
  \ device_driver`。\n\n关于 LDM（Linux 设备模型）的更多帮助可以从这里获取：\n\n* [`www.devicetree.org/specifications/`](https://www.devicetree.org/specifications/)\n\
  * [`docs.kernel.org/`](https://docs.kernel.org/)\n\n## 总线模型\n\n总线是指将各种硬件设备连接到系统的逻辑或物理互连。总线模型是一种抽象，为在内核中表示和管理不同类型的总线提供了标准方法。\n\
  \n这种抽象对于处理硬件架构的多样性以及计算机系统中可能存在的大量总线至关重要。\n\nLinux 总线模型是 Linux 内核中的一个框架，提供了一种系统化的表示和管理总线的方法，总线是不同硬件组件和设备之间的通信通路或互连。总线在连接各种硬件元素（如处理器、内存、外围设备和其他子系统）中起着关重要的作用，允许它们通信并协同工作。\n\
  \nLinux 总线模型的特性和概念包括：\n\n* **总线类型 (Bus type)**：总线模型定义了不同的总线类型，每种类型代表一种特定的互连技术或架构。总线类型的示例包括外围部件部件（PCI）、通用串行总线（USB）、集成电路（I2C）和串行外设接口（SPI）。\n\
  * **总线子系统 (Bus subsystem)**：每种总线类型都实现为 Linux 内核中的一个子系统。总线子系统负责管理连接到该特定总线类型的设备。\n\
  * **总线设备**：特定总线的一部分设备被表示为总线设备。每个总线设备都与特定的总线类型关联，并具有该类型总线的共同特征。\n* **总线属性 (Bus attributes)**：总线具有描述其属性的属性，例如速度、地址范围和其他相关信息。这些属性通常在\
  \ `/sys` 文件系统中暴露。\n* **总线注册 (Bus registration)**：总线和总线设备向内核注册自身，允许内核动态地发现和管理连接到这些总线的硬件。\n\
  * **总线枚举 (Bus enumeration)**：内核在启动过程中或当有新设备热插时枚举每条总线上的设备。枚举涉及发现总线上的现有设备、初始化它们并使它们对系统可用。\n\
  * **设备挂载 (Device attachment)**：设备挂载到总线上，且总线模型有助于组织系统内部设备的层级结构。层级结构反映了设备与总线之间的物理或逻辑连接。\n\
  * **热插拔支持 (Hotplug support)**：总线模型支持热插操作，允许在不需要重启的情况下动态地从系统中添加或删除设备。这对于支持热插拔的总线和设备（如\
  \ USB 或 PCI 设备）尤为重要。\n\n通过为表示总线及其设备提供标准框架，Linux 总线模型有助于 Linux 内核的整体模块化、可扩展性和活性。它通过为处理总线和设备提供通用基础设施，简化了设备驱动程序的开发，无论底层的硬件架构如何。`/sys`\
  \ 文件系统中的 `/sys/bus` 目录是用户空间访问总线相关信息和配置的入口。\n\nLinux 设备模型提供了若干数据结构以确保硬件设备与设备驱动程序之间的交互。模型基于\
  \ `kobject` 结构。层级结构使用以下结构构建：\n\n* `struct bus_type`\n* `struct device`\n* `struct\
  \ device_driver`\n\n下图插示了驱动程序记录中数据结构的层级结构：\n\n![](img/figure4.2.png)\n\n图 4.2：层之间的不同交互\n\
  \nLinux 总线模型包含了各种总线，每种总线都有特定的用途。常见的总线类型包括：\n\n* **外围部件部件 (Peripheral component interconnect)**：`PCI`\
  \ 用于将扩展卡连接到主板。\n* **通用串行总线 (Universal Serial Bus)**：`USB` 常用于连接外围设备和外部设备。\n* **集成电路\
  \ (Inter-integrated circuit)**：`I2C` 用于色板上集成电路之间的通信。\n* **平台总线 (Platform bus)**：代表集成到系统板的设备。\n\
  \n记录总线涉及的各个步骤包括多个操作，如下：\n\n* **总线类型注册**：每种类型的总线都在 Linux 内核注册，表示内核支持连接到该类型总线的设备。注册过程包括提供一组函数，定义如何枚举和管理该总线上的设备。\n\
  * **总线特定操作**：总线特定操作定义了如何发现、探测（probe）和初始化特定总线上的设备。这些操作特定于总线的特性，可能包括枚举设备、读取配置信息和设置资源的方法。\n\
  * **总线设备枚举**：总线模型协助枚举特定总线上的设备。它提供了一种发现和表示连接到该总线的统一方法，允许内核识别硬件配置。\n* **设备关系**：总线上的设备以层级方式组织，以表示它们的关系。例如，`PCI`\
  \ 总线可能有插槽，每个插槽都可能包含一个设备。这种层级结构反映在设备模型中。\n* **/sys 文件系统表示**：有关总线及其设备的信息通过 `/sys`\
  \ 文件系统暴露给用户空间。用户和应用程序可以通过与 `/sys` 内相应的文件和目录交互来查询和配置设备。\n\n总线是处理器与输出设备之间的通信通道。为了确保模型的通用性，所有\
  \ I/O 设备都通过总线连接到处理器（即使它是虚拟的）。\n\n当添加系统总线时，它将出现在 sysfs 文件系统中。与 `kobject` 一样，总线可以组织成层级结构并在\
  \ sysfs 中表示。\n\n因此，Linux 设备模型是由 `struct bus_type` 结构表示的：\n\n```c\nstruct bus_type\
  \ {\n    const char *name;\n    const char *dev_name;\n    struct device *dev_root;\n\
  \    struct bus_attribute *bus_attrs;\n    struct device_attribute *dev_attrs;\n\
  \    struct driver_attribute *drv_attrs;\n    struct subsys_private *p;\n    int\
  \ (*match)(struct device *dev, struct device_driver *drv);\n    int (*uevent)(struct\
  \ device *dev, struct kobj_uevent_env *env);\n    int (*probe)(struct device *dev);\n\
  \    int (*remove)(struct device *dev);\n    //…\n};\n```\n\n每个总线都有一个名称、一组默认属性、若干特定函数和私有驱动数据。`uevent`\
  \ 函数（以前称为 hotplug）用于热插拔设备。\n\n总线操作如下：\n\n* 记录\n* 实现 `struct bus_type` 结构中描述的操作\n\
  * 迭代\n* 检查\n\n总线使用 `bus_register()` 注册，使用 `bus_unregister()` 取消注册。\n\n实现示例：\n\n\
  ```c\n#include <linux/device.h>\n\n//总线类型\nstruct bus_type my_bus_type = {\n   \
  \ .name = \"my_bus\",\n};\n```\n\n\n\n\n\n```c\n.match = my_match,\n\n.uevent =\
  \ my_uevent,\n};\n\nstatic int __init my_bus_init(void)\n{\n    int err;\n    //...\n\
  \    err = bus_register(&my_bus_type);\n    if (err)\n        return err;\n    //...\n\
  }\n\nstatic void __exit my_bus_exit(void)\n{\n    //...\n    bus_unregister(&my_bus_type);\n\
  \    //...\n}\n```\n\n在 `bus_type` 结构体中初始化的函数有 `match` 和 `uevent`：\n\n```c\n#include\
  \ <linux/device.h>\n#include <linux/string.h>\n\n// 设备匹配驱动；进行简单的名称测试\nstatic int\
  \ my_match(struct device *dev, struct device_driver *driver)\n{\n    return !strncmp(dev_name(dev),\
  \ driver->name, strlen(driver->name));\n}\n\n// 响应热插拔用户事件；添加环境变量 DEV_NAME\nstatic\
  \ int my_uevent(struct device *dev, struct kobj_uevent_env *env)\n{\n    add_uevent_var(env,\
  \ \"DEV_NAME=%s\", dev_name(dev));\n    return 0;\n}\n```\n\n当新设备或驱动添加到总线时，会使用 `match`\
  \ 函数。它的作用是在设备 ID 和驱动 ID 之间进行比较。`uevent` 函数在用户空间生成热插拔之前调用，用于添加环境变量。\n\n总线上的其他可能操作是遍历连接到它的驱动或设备。虽然我们无法直接访问它们（驱动和设备列表存储在驱动的私有数据\
  \ `subsys_private *p` 字段中），但可以使用 `bus_for_each_dev` 和 `bus_for_each_drv` 宏进行迭代。\n\
  \nLDM 接口允许你为相关对象创建属性。这些属性在 `sysfs` 总线子目录下会有对应的文件。\n\n与总线相关的属性由 `bus_attribute` 结构体描述：\n\
  \n```c\nstruct bus_attribute {\n    struct attribute attr;\n    ssize_t (*show)(struct\
  \ bus_type *, char *buf);\n    ssize_t (*store)(struct bus_type *, const char *buf,\
  \ size_t count);\n};\n```\n\n属性通过 `BUS_ATTR` 宏定义，然后可以使用 `bus_create_file()` 和 `bus_remove_file()`\
  \ 函数在总线结构中添加/删除属性。\n\n为 `my_bus` 定义属性的示例所示：\n\n```c\n#define MY_BUS_DESCR \"BPB\
  \ my bus\"\n\n// 导出简单的总线属性\nstatic ssize_t my_show_bus_descr(struct bus_type *bus,\
  \ char *buf)\n{\n    return snprintf(buf, PAGE_SIZE, \"%s\\n\", MY_BUS_DESCR);\n\
  }\n\n/*\n* 定义属性 - 属性名称为 descr;\n* 全称为为 bus_attr_descr;\n* sysfs 条目应该是 /sys/bus/mybus/descr\n\
  */\nBUS_ATTR(descr, 0444, my_show_bus_descr, NULL);\n\n// 指定属性 - 在模块初始化函数中\nstatic\
  \ int __init my_bus_init(void)\n{\n    int err;\n    //...\n    err = bus_create_file(&my_bus_type,\
  \ &bus_attr_descr);\n    if (err) {\n        /* 处理错误 */\n    }\n    //...\n}\n\n\
  static void __exit my_bus_exit(void)\n{\n    //...\n    bus_remove_file(&my_bus_type,\
  \ &bus_attr_descr);\n    //...\n}\n```\n\n总线是 `bus_type` 对象和设备对象的共同表示（总线本身也是一个设备）。\n\
  \n## 设备模型\n\n总线模型在驱动绑定过程中起着至关重要的作用。它帮助将总线上的设备与合适的驱动程序进行匹配。当找到兼容的驱动时，它将绑定到设备上，允许驱动程序管理该设备。\n\
  \n在使用设备树的架构（例如 `ARM`）上，总线模型与设备树集成，在内核启动过程中实例化总线和设备。\n\nLinux 总线模型是整个设备模型不可或缺的一部分，为处理不同类型的总线及其连接的设备提供了基础基础。它确保了跨各种硬件架构管理设备的统一方法，并贡献了内核的模块化和可移植性。\n\
  \n设备节点是指 `/sys` 文件系统中的条目，它们提供了与设备交互的标准化接口。它们是用户和应用程序查询和配置系统中设备的手段。`/sys` 文件系统是一个虚拟文件系统，它将有关设备、驱动和其他内核相关实体的信息暴露给用户空间。\n\
  \n### Linux 设备模型中设备节点的定义\n\n-   **文件系统表示**：设备节点表示为 `/sys` 文件系统中的文件和目录。每个设备和设备相关实体（如设备类）在\
  \ `/sys` 中都有对应的条目，用户可以导航并与之交互。\n-   **设备属性**：设备节点暴露了与相应设备相关的各种属性和参数。这些属性可能包括设备状态、配置设置和其他相关数据。\n\
  -   **读写访问**：用户和应用程序可以从设备节点读取信息，以获取关联设备的详细信息。此外，某些设备节点支持写操作，允许用户配置或控制设备的某些方面。\n\
  -   **设备识别**：设备节点的路径反映了其在设备模型中的位置。连接到特定总线的设备位于 `/sys` 中对应的目录下。\n-   **一致命名规范**：设备节点遵循一致的命名规范，以便用户识别和定位设备。设备节点的名称取决于设备的类型。\n\
  -   **设备类节点**：对于属于类的设备（例如块设备、网络设备），有特定的类目录包含该类的实例设备节点。\n-   **动态创建和删除**：设备节点根据系统中的设备动态创建和删除。当检测到新设备时，内核会在\
  \ `/sys` 中创建相应的设备节点。当设备移除或不可用时，设备节点会被删除。\n-   **/sys/class 和 /sys/devices**：`/sys/class`\
  \ 目录包含不同设备类的子目录，每个目录都包含该类的实例设备节点。`/sys/devices` 目录提供了更详细、完整的设备模型视图，包括设备及其关系。\n\n\
  设备节点在为 Linux 内核设备交互提供用户友好且标准的接口方面起着至关重要的作用。它们促进了用户空间与内核之间的通信。\n\n。\n\n类模型是指一种根据功能或类型对设备进行分类的框架。具有共同特征和行为的设备被分为类，每个类都定义了类内设备应遵循的标准属性和方法。这种分类通过为特定类型的设备交互提供标准化接口简化了设备管理。\n\
  \n### Linux 内核中类模型的定义\n\n-   **设备类**：设备类根据功能或目的对设备进行分类。设备类的示例包括块设备、网络设备、图形设备、输入设备等。每个类代表一种特定类型的设备。\n\
  -   **共同属性和行为**：每个设备类都定义了类内设备预期拥有的共同属性和行为。这包括用于设备初始化、配置和资源管理的标准方法。\n-   **设备类层级结构**：设备类按层次结构组织，反映了不同类型设备之间的关系。例如，块设备类可能有针对特定类型块设备的子类，如硬盘、SSD\
  \ 或 USB 驱动器。\n\n\n\n\n\n## Linux 设备模型概述\n\n*   **/sys 文件系统表示**：关于设备类及其关联设备的信息通过\
  \ `/sys` 文件系统暴露给用户空间。用户和应用程序可以通过与 `/sys/class` 内相应的文件和目录交互来查询和配置设备。\n*   **驱动程序绑定与匹配**：设备驱动程序通常会在特定的类中注册自己，表示它们与该类型设备的兼容性。在驱动程序绑定过程中，内核根据类匹配驱动程序和设备，确保由适当的驱动处理特定类型的设备。\n\
  *   **标准化接口**：设备类为设备驱动程序提供了标准的接口，使得编写遵循通用惯例的驱动程序变得更容易。这促进了代码的可重用，并有助于维护处理特定类设备的一致方法。\n\
  *   **类的动态加载**：Linux 内核支持类的动态加载，允许在运行时添加或删除新类。这种灵活性对于适应各种设备和不断演进的硬件架构至关重要。\n*  \
  \ **设备枚举**：类模型有助于枚举特定类的设备，使内核在系统初始化期间更容易发现和管理设备。\n\n通过将设备组织成类，类模型提供了一种高层抽象，简化了设备驱动程序的开发，增强了代码模块化，并促进了\
  \ Linux 内核中管理设备的一致且标准的方法。每个类封装了类别内设备的共同特征，允许更高效、精的设备管理。\n\n## 设备结构\n\n每个设备都关联一个\
  \ `struct device` 结构。设备通过各种内核方法（热插拔、设备驱动程序、系统初始化等）被发现并在系统中注册。内核中的每个设备在 `/sys/devices`\
  \ 中都有一个条目。\n\n在最底层，Linux 设备模型中的设备由 `struct device` 结构表示：\n\n```c\nstruct device\
  \ {\n//...\nstruct device *parent;\nstruct device_private *p;\nstruct kobject kobj;\n\
  const char *init_name; /* 设备的初始名称 */\n//...\nstruct bus_type *bus; /* 设备所在的总线类型\
  \ */\nstruct device_driver *driver; /* 哪个驱动程序分配了这个设备 */\n//...\nvoid (*release)(struct\
  \ device *dev);\n};\n```\n\n结构字段包括父设备（通常是控制器）、关联的 `kobject`、它连接的总线、设备驱动程序，以及当设备计数器达到\
  \ 0 时调用的函数。\n\n## 注册与属性\n\n在这里，我们也有注册/注销函数 `device_register()` 和 `device_unregister()`。\n\
  \n为了处理属性，我们有 `struct device_attribute` 结构、用于定义的 `DEVICE_ATTR` 宏，以及用于向设备添加/删除属性的函数\
  \ `device_create_file()` 和 `device_remove_file()`。\n\n需要点一点的是`struct device` 结构通常不直接使用，而是嵌入另一个结构中。例如：\n\
  \n```c\n// 我的设备类型\nstruct my_device {\nchar *name;\nstruct my_driver *driver;\n\
  struct device dev;\n};\n```\n\n通常，总线驱动程序会提供添加或删除此类设备的函数，如下所示：\n\n```c\n/* 总线设备 (父设备)\
  \ */\n// 父设备释放\nstatic void my_bus_device_release(struct device *dev)\n{\n}\n\n\
  // 父设备\nstatic struct device my_bus_device = {\n.init_name = \"mybus0\",\n.release\
  \ = my_bus_device_release\n};\n\n/* 设备 */\n/*\n* 由于我们没有使用引用计数，所以我们使用空操作\n* 释放函数\n\
  */\nstatic void my_dev_release(struct device *dev)\n{\n}\n\nint my_register_device(struct\
  \ my_device *mydev)\n{\nmydev->dev.bus = &my_bus_type;\nmydev->dev.parent = &my_bus_device;\n\
  mydev->dev.release = my_dev_release;\ndev_set_name(&mydev->dev, mydev->name);\n\
  return device_register(&mydev->dev);\n}\n\nvoid my_unregister_device(struct my_device\
  \ *mydev)\n{\ndevice_unregister(&mydev->dev);\n}\n\n/* 导出注册/注销设备函数 */\nEXPORT_SYMBOL(my_register_device);\n\
  EXPORT_SYMBOL(my_unregister_device);\n```\n\n`my_register_device()` 和 `my_unregister_device()`\
  \ 函数用于向总线添加/删除设备，它们定义在定义总线的同一个文件中。因此，设备结构体并没有被初始化；它们将在系统通过热插拔或来自驱动程序的直接注册发现设备时进行初始化，然后调用\
  \ `my_register_device` 函数将设备添加到总线。要在驱动程序实现中使用上述定义的总线，我们必须定义类型为 `my_device` 的结构，初始化它，并使用总线导出的函数（`my_register_device`）注册它，如下：\n\
  \n```c\nstatic struct my_device mydev;\nchar devname[NAME_SIZE];\n//…\n// 注册\nint\
  \ errprintntf(devnam“, \"myd”v0\");\nmydev.name = devname;\nmydev.driver = &mydriver;\n\
  dev_set_drvdata(&mydev.dev, &mydev);\nerr = my_register_device(&mydev);\nif (err\
  \ < 0) {\n/* 处理错误 */\n}\n//..\n// 注销\nmy_unregister_device(&mydev);\n```\n\n## Linux\
  \ 驱动模型\n\nLinux 驱动模型有助于内核功能与各种设备驱动程序之间保持清晰的分离，使内核更加模块化。\n\n驱动模型的描述包括：\n\n*   **驱动程序注册与初始化**：\n\
  \    * `struct device_driver`：每个设备驱动程序由 `struct device_driver` 结构表示。该结构包含了有关驱动程序、支持的设备以及初始化和清理的回调。\n\
  \    * `module_driver()`：用于向内核注册驱动程序的宏。它将驱动程序与特定的内核模块关联。\n*   **设备注册与管理**：\n   \
  \ * `struct device`：系统中的每个设备由 `struct device` 数据结构表示。该结构包含了有关设备的信息，如名称、类型和关联的驱动程序。\n\
  \    * `device_create()`：用于创建设备并关联设备驱动程序的函数。\n    * `device_destroy()`：用于销毁之前创建的设备。\n\
  *   **驱动与设备匹配**：\n    * 驱动匹配：根据设备类型、供应商 ID 和产品 ID 等标准匹配驱动程序和设备。\n    * 驱动绑定：当检测到设备时，内核尝试将其绑定到适当的驱动程序。\n\
  *   **驱动操作**：\n    * `struct file_operations`：包含驱动程序可以实现的各种操作指针的结构，如打开、读、写和释放。\n\
  \    * `struct platform_driver` 和 `struct pci_driver`：分别用于平台设备和 PCI 设备的专用驱动结构。\n\
  *   **内核对象模型**：设备、驱动程序和其他相关实体被表示为内核对象。它们按层次结构组织，并通过 `/sys` 文件系统访问。\n*   **Sysfs\
  \ 接口**：Linux 驱动模型在 `/sys` 文件系统中暴露了 sysfs 接口，允许用户空间工具和应用程序查询和配置驱动及设备信息。\n*   **热插拔和热插拔支持**：驱动模型支持热插拔操作，允许在无需重启的情况下动态地从系统中添加或删除设备。\n\
  *   **设备属性和属性**：Linux 驱动模型提供了一种表示和查询设备属性的标准方法，使得用户空间应用程序和脚本与设备交互变得更容易。\n\n通过采用 Linux\
  \ 驱动模型，开发者可以创建遵循标准接口的驱动程序，使新硬件集成到 Linux 内核变得更容易。驱动模型的模块化和可扩展性有助于 Linux 内核的整体稳定性和维护性。\n\
  \n\n\n\n\nLDM 用于启用系统设备与驱动程序之间简单的关联。驱动程序可以独立于物理设备导出信息。\n\n在 `sysfs` 中，驱动程序信息并不与任何单一子目录关联；它们位于目录树的不同位置：加载的模块位于\
  \ `/sys/module`，在 `/sys/devices` 中你可以找到与每个设备关联的驱动程序，在 `/sys/class` 中属于某个类的驱动程序，在\
  \ `/sys/bus` 中与每个总线关联的驱动程序。\n\n设备驱动由 `struct device_driver` 结构体表示，如下：\n\n```c\n\
  struct device_driver {\nconst char *name;\nstruct bus_type *bus;\nstruct driver_private\
  \ *p;\nstruct module *owner;\nconst char *mod_name; /* 用于内置模块 */\nint (*probe) (struct\
  \ device *dev);\nint (*remove) (struct device *dev);\nvoid (*shutdown) (struct device\
  \ *dev);\nint (*suspend) (struct device *dev, pm_message_t state);\nint (*resume)\
  \ (struct device *dev);\n};\n```\n\n在结构体字段中，我们找到了出现在 `sysfs` 中的驱动程序名称、驱动程序工作的总线，以及在设备运行期间被调用的函数。\n\
  \n还有与我们之前看到的类似的函数 `driver_register()` 和 `driver_unregister()`，用于注册/注销驱动程序。为了处理属性，我们有\
  \ `struct driver_attribute` 结构体、用于设置的 `DRIVER_ATTR` 宏，以及用于将属性添加到设备的 `driver_create_file()`\
  \ 和 `driver_remove_file()` 函数。\n\n与设备类似，`struct device_driver` 结构体通常被集成到针对特定总线类型（如\
  \ PCI 或 USB）定制的更专门结构中。参考如下：\n\n```c\n// 我的驱动类型\nstruct my_driver {\nstruct module\
  \ *module;\nstruct device_driver driver;\n};\n\n#define to_my_driver(drv) container_of(drv,\
  \ struct my_driver, driver);\n\nint my_register_driver(struct my_driver *driver)\n\
  {\nint err;\ndriver->driver.bus = &my_bus_type;\nerr= driver_register(&driver->driver);\n\
  if (err)\nreturn err;\nreturn 0;\n}\n\nvoid my_unregister_driver(struct my_driver\
  \ *driver)\n{\ndriver_unregister(&driver->driver);\n}\n\n/* 导出注册/注销驱动函数 */\nEXPORT_SYMBOL(my_register_driver);\n\
  EXPORT_SYMBOL(my_unregister_driver);\n```\n\n驱动程序的注册/注销操作已导出供其他模块使用。而驱动的操作是在总线初始化期间定义的，并导出供驱动程序自身使用。\n\
  \n在实现连接到总线的设备的驱动时，将调用 `my_register_driver` 和 `my_unregister_driver` 函数与总线关联。\n\n\
  为了利用驱动程序实现中的函数，我们需要声明一个 `my_driver` 类型的结构体，初始化其成员，然后使用总线提供的函数进行注册，如下所示：\n\n```c\n\
  static struct my_driver mydriver = {\n.module = THIS_MODULE,\n.driver = {\n.name\
  \ = \"bpbdriver\",\n},\n};\n\n//...\n//注册\nint err;\nerr = my_register_driver(&mydriver);\n\
  if (err < 0) {\n/* 处理错误 */\n}\n//..\n//注销\nmy_unregister_driver(&mydriver);\n```\n\
  \n### 类 (Classes)\n\n类是 Linux 设备模型的高层视图，它总结了实现细节。有针对 SCSI 和 ATA 的驱动程序，但它们都属于磁盘类（disk\
  \ class）。类根据功能对设备进行分组，而不是根据它们如何连接或如何工作。类在 `/sys/class` 中有对应项。\n\n有两个描述类的主要结构：`struct\
  \ class` 和 `struct device`。`class` 结构体描述通用类，而 `device` 结构体描述与设备关联的类。`linux/device.h`\
  \ 中描述了多个用于初始化/初始化和为每个添加属性的函数。\n\n这些类的优点主要是为了 udev 二进制文件（在用户空间）的正常运行，它根据类信息自动在 `/dev`\
  \ 目录创建设备。通用类由 `class` 结构体定义：\n\n```c\nstruct class {\nconst char *name;\nstruct\
  \ module *owner;\nstruct kobject *dev_kobj;\nstruct subsys_private *p;\nstruct class_attribute\
  \ *class_attrs;\nstruct device_attribute *class_dev_attrs;\nstruct device_attribute\
  \ *dev_attrs;\nint (*dev_uevent)(struct device *dev, struct kobj_event *env);\n\
  void (*class_release)(struct class *class);\nvoid (*dev_release)(struct device *dev);\n\
  //...\n};\n```\n\n`class_register()` 和 `class_unregister()` 函数用于如下初始化和反初始化一个类：\n\
  \n```c\nstatic struct class my_class = {\n.name = \"myclass\",\n};\n\nstatic int\
  \ __init my_init(void)\n{\nint err;\n//...\nerr = class_register(&my_class);\nif\
  \ (err < 0) {\n/* 处理错误 */\n}\n//...\n}\n\nstatic void __exit my_cleanup(void)\n\
  {\n//...\nclass_unregister(&my_class);\n//...\n}\n```\n\n`device_create()` 函数初始化设备结构，并将通用类和设备作为参数。此外，这将创建一个类的属性，该属性包含设备的主设备和次设备号（minor:major）。udev\
  \ 二进制文件（在用户空间）可以从此属性中读取必要数据，并通过调用 `mknod` 在 `/dev` 目录中创建节点。\n\n初始化示例所示：\n\n```c\n\
  struct device* my_classdev;\nstruct device cdev;\nstruct device dev;\n//为设备 cdev.dev\
  \ 初始化类\nmy_classdev = device_create(&my_class, NULL, cdev.dev, &dev, \"myclass0\"\
  );\n// 销毁设备 cdev.dev 的类\ndevice_destroy(&my_class, cdev.dev);\n```\n\n当检测到新设备时，它会被分配给特定的类，并在\
  \ `/dev` 目录中创建相应的节点。例如，在上例中，将生成节点 `/dev/myclass0`。\n\n### procfs\n\n与其 `/sys` 对应项一样，`/proc`\
  \ 是允许与用户空间交换信息的文件系统。\n\n```c\n#include <linux/kernel.h>\n#include <linux/module.h>\n\
  #include <linux/proc_fs.h>\n#include <linux/sched.h>\n#include <linux/uaccess.h>\n\
  #include <linux/version.h>\n#include <linux/minmax.h>\n#if LINUX_VERSION_CODE >=\
  \ 5_60\n#define HAVE_PROC_OPS\n#endif\n#define PROCFS_MAX_SIZE 2048\n#define PROCFS_ENTRY_FILENAME\
  \ \"buffer\"\n#define PROCFS_ENTRY_FOLDER \"bpb\"\n\nstatic struct proc_dir_entry\
  \ *parent;\nstatic struct proc_dir_entry *proc_file;\nstatic char procfs_buffer[PROCFS_MAX_SIZE];\n\
  static unsigned long procfs_buffer_size = 0;\n\nstatic ssize_t procfs_read(struct\
  \ file *filp, char __user *buffer,\nsize_t length, loff_t *offset)\n{\nif (*offset\
  \ || procfs_buffer_size == 0) {\npr_debug(\"procfs_read: END\\n\");\n*offset = 0;\n\
  return 0;\n}\nprocfs_buffer_size = min(procfs_buffer_size, length);\nif (copy_to_user(buffer,\
  \ procfs_buffer, procfs_buffer_size))\nreturn -EFAULT;\n*offset += procfs_buffer_size;\n\
  pr_debug(\"procfs_read: read %lu bytes\\n\", procfs_buffer_size);\nreturn procfs_buffer_size;\n\
  }\n\nstatic int procfs_open(struct inode *inode, struct file *file)\n{\ntry_module_get(THIS_MODULE);\n\
  return 0;\n}\n\nstatic int procfs_close(struct inode *inode, struct file *file)\n\
  {\nmodule_put(THIS_MODULE);\nreturn 0;\n}\n\n#ifdef HAVE_PROC_OPS\nstatic struct\
  \ proc_ops file_ops_proc_file = {\n.proc_read = procfs_read,\n.proc_open = procfs_open,\n\
  .proc_release = procfs_close,\n};\n#else\nstatic const struct file_operations file_ops_proc_file\
  \ = {\n.read = procfs_read,\n.open = procfs_open,\n.release = procfs_close,\n};\n\
  #endif\n\nstatic int __init procfs_init(void)\n{\nparent = proc_mkdir(PROCFS_ENTRY_FOLDER,NULL);\n\
  if( parent == NULL )\n{\npr_info(\"Error creating proc entry\");\ngoto r_device;\n\
  }\nproc_file = proc_create(PROCFS_ENTRY_FILENAME, 0644, parent,\n&file_ops_proc_file);\n\
  if (proc_file == NULL) {\npr_debug(\"Error: Could not initialize /proc/%s\\n\",\n\
  PROCFS_ENTRY_FILENAME);\nreturn -ENOMEM;\n}\nreturn 0;\nr_device:\nproc_remove(parent);\n\
  return -1;\n}\n\nstatic void __exit procfs_exit(void)\n{\nproc_remove(proc_file);\n\
  proc_remove(parent);\n}\n\nmodule_init(procfs_init);\nmodule_exit(procfs_exit);\n\
  ```\n\n\n\n\n\n```c\nproc_set_size(proc_file, 80);\n\nproc_set_user(proc_file, GLOBAL_ROOT_UID,\
  \ GLOBAL_ROOT_GID);\n\npr_debug(\"/proc/%s created\\n\", PROCFS_ENTRY_FILENAME);\n\
  \nreturn 0;\n\nr_device:\n\nreturn -1;\n\n}\n\nstatic void __exit procfs_exit(void)\n\
  {\nproc_remove(parent); // /proc/bpb\n// or\n//remove_proc_entry(\"bpb/buffer\"\
  , parent);\n\npr_debug(\"/proc/%s removed\\n\", PROCFS_ENTRY_FILENAME);\n}\n\nmodule_init(procfs_init);\n\
  module_exit(procfs_exit);\nMODULE_LICENSE(\"GPL\");\n```\n\n> 注意：示例代码使 procfs 中的条目为只读的。你可以从与本书关联的\
  \ GitHub 仓库中下载可读写版本。\n\n以下是关于一些有用函数的信息：\n\n* `proc_mkdir()` 函数用于在 `/proc` 文件系统中创建新的目录或子目录条目。该目录可以组织并提供与内核或内核模块相关的特定信息或功能的访问。\n\
  * 原型：`struct proc_dir_entry *proc_mkdir(const char *name, struct proc_dir_entry\
  \ *parent);`\n\n* `proc_create()` 函数用于在 `/proc` 文件系统中创建一个条目（文件或目录）。此函数允许内核开发者通过虚拟的\
  \ `/proc` 文件系统向用户空间应用程序暴露信息或功能。\n* 原型：`struct proc_dir_entry *proc_create(const\
  \ char *name, umode_t mode, struct proc_dir_entry *parent, const struct file_operations\
  \ *proc_fops);`\n    * 其中：\n        * `name`：要创建的条目的名称。\n        * `mode`：条目的权限模式，指定所有者、组和其他用户的访问权限。\n\
  \        * `parent`：指向应创建新条目的父目录的指针。如果父目录为 `NULL`，则条目将在 `/proc` 文件系统的根目录下创建。\n \
  \       * `proc_fops`：指向结构指针，该结构包含新创建条目的的文件操作（例如打开、读、写、释放）。\n    * 该函数返回一个指向已创建的\
  \ `proc_dir_entry` 结构的指针，可用于进一步操作或提供额外信息。由于该结构在 GNU/Linux 内核演进过程中字段名称发生了变化，必须经过测试以保持后兼容性：\n\
  \n```c\n#ifdef HAVE_PROC_OPS\nstatic struct proc_ops file_ops_proc_file = {\n.proc_read\
  \ = procfs_read,\n.proc_write = procfs_write,\n.proc_open = procfs_open,\n.proc_release\
  \ = procfs_close,\n};\n#else\nstatic const struct file_operations file_ops_proc_file\
  \ = {\n.read = procfs_read,\n.write = procfs_write,\n.open = procfs_open,\n.release\
  \ = procfs_close,\n};\n#endif\n```\n\n* `remove_proc_entry()` 用于从 `/proc` 目录中删除条目。\n\
  \  原型：`void remove_proc_entry(const char *name, struct proc_dir_entry *parent);`\n\
  \  在这里，`name` 是要删除的条目的名称，`parent` 是该条目所在父目录的指针。该函数从 `/proc` 目录中删除指定的条目。\n\n值得注意的是，`/proc`\
  \ 文件系统用于以类文件的结构提供有关进程和其他系统信息的信息。`/proc` 文件系统的具体细节和功能在不同版本的 Linux 内核之间可能不同。如果你正在使用此函数，请参考你所使用的特定内核版本的文档或源代码，以获取准确且最新的信息。\n\
  \n* `proc_remove()` 用于递归删除文件夹及其子项。\n* 原型：`void proc_remove(struct proc_dir_entry\
  \ *parent);`\n\n为了在用户空间和内核空间之间交换数据，我们将使用两个重要的函数：`copy_from_user` 和 `copy_to_user`。这些函数对于处理用户空间应用程序与内核之间的数据传输至关重要，可确保正确的内存访问和安全性。\n\
  \n`copy_from_user()` 函数用于从用户空间拷贝数据到内核空间。\n* 原型：`long copy_from_user(void *to, const\
  \ void __user *from, unsigned long n);`\n* 参数：\n    * `to`：内核空间中的目标指针\n    * `from`：用户空间中的源指针\n\
  \    * `n`：要拷贝的字节数\n* 返回值：它返回无法拷贝的字节数。如果返回值为零，则拷贝成功。\n* 示例：\n```c\nchar buffer[256];\n\
  if (copy_from_user(buffer, user_ptr, sizeof(buffer)) != 0) {\n    // 处理错误\n}\n//\
  \ 继续使用 'buffer' 中的数据进行处理\n```\n\n`copy_to_user()` 函数用于从内核空间拷贝数据到用户空间。\n* 原型：`long\
  \ copy_to_user(void __user *to, const void *from, unsigned long n);`\n* 参数：\n  \
  \  * `to`：用户空间中的目标指针\n    * `from`：内核空间中的源指针\n    * `n`：要拷贝的字节数\n* 返回值：\n    * 它返回无法拷贝的字节数。\n\
  * 示例：\n```c\nif (copy_from_user(buffer, user_ptr, sizeof(buffer)) != 0) {\n    //\
  \ 处理错误\n}\n```\n\n\n\n\n\n```bash\nzsh: permission denied: /proc/bpb/buffer\n```\n\
  \n```bash\n$ sudo su\n\n## id\n```\n\n`uid=0(root) gid=0(root) groups=0(root)`\n\
  \n现在我们是 root 用户了，可以向 procfs 条目发送一个字符串：\n\n```bash\n## echo \"hello bpb\" > /proc/bpb/buffer\n\
  ```\n\n最后，我们可以重新读取缓冲器的内容：\n\n```bash\n## cat /proc/bpb/buffer\n```\n\nhello bpb\n\
  \n云提供的关键优势之一是弹性扩展，这允许它只使用所需的资源并仅为该部分付费。某些工作负载的一个非常常见的用例是：在周末，办公室关闭，负载不大，因此基础设施可以缩减到最低。同样，在每个月底的薪资处理期间，数据库、服务器等相关基础设施的利用率非常高，需要更多资源。在这种情况下，扩展的频率需要非常高；而相比之下，在假期期间，基础设施每年仅需要扩展几天来支持销售和业务。持续分析利用率以及相关成本至关重要，要检测模式并据此提供所需的建议或采取自动化操作，以提供合适的基础设施并优化成本。\n\
  \n除了成本优化外，这种分析还有助于防止潜在的安全相关问题或威胁。例如，在周末，连接或使用并不多，但如果你的数据显示利用率激增，这可能表明发生了安全攻击。可以使用算法自动发现数据中的此类异常，并向\
  \ FinOps 团队报警这些事件。\n\n## 关于 DTB 设备树\n\n设备树二进制（DTB）是硬件配置数据的二进制表示，用于需要对硬件进行动态描述的 Linux\
  \ 系统（例如嵌入式系统或片上系统 SoC）。它为内核提供了一种结构化的方法，用于理解可用硬件，而无需将这些信息硬编码在内核中。\n\n设备树是描述硬件的数据结构。它起源于\
  \ PowerPC 世界，但已在嵌入系统中广泛采用。它有助于将硬件特定细节与操作系统或软件分离。\n\n设备树以名为设备树源（DTS）的人类可读格式编写。它被编译成名为\
  \ DTB 的二进制格式供 Linux 内核使用。\n\n## 目的\n\n目的解释如下：\n\n*   描述硬件组件及其相互连接（例如 CPU、内存、总线、GPIO\
  \ 等）。\n*   允许 Linux 内核以极少的修改在广泛的硬件上运行。\n*   提供将设备特定数据传递给操作系统的机制。\n\n设备树由节点和属性（Properties）组成，其解释如下：\n\
  \n*   节点（Nodes）：代表设备或硬件组件。节点可以具有子节点，用于分级硬件描述（例如带有附加设备的总线）。\n*   属性（Properties）：与节点关联键值对。它们描述了内存地址、IRQ\
  \ 和兼容性字符串等属性。\n\n下面的图显示了从 Linux 访问设备树：\n\n![](img/figure4.3.png)\n\n图 4.3：DTS、DTC\
  \ 和 DTB 之间的关系和链接\n\n图 4.3 描述了一个 DTS：\n\n```dts\n/dts-v1/;\n\n/ {\n  compatible =\
  \ \"my-board,example\";\n  model = \"My Custom Board\";\n  memory {\n    device_type\
  \ = \"memory\";\n    reg = <0x80000000 0x20000000>; // 起地址，大小\n  };\n  soc {\n \
  \   compatible = \"simple-bus\";\n    ranges;\n    uart0: serial@1000 {\n      compatible\
  \ = \"ns16550\";\n      reg = <0x1000 0x100>;\n      interrupt-parent = <&intc>;\n\
  \      interrupts = <5>;\n    };\n    gpio: gpio@2000 {\n      compatible = \"gpio-controller\"\
  ;\n      reg = <0x2000 0x100>;\n      gpio-controller;\n      #gpio-cells = <2>;\n\
  \    };\n  };\n};\n```\n\n以下是关键组件：\n\n*   `/`（根节点）：顶层节点，描述整个系统。\n*   `compatible`：标识设备或板的字符串。内核根据此匹配驱动程序。\n\
  *   `reg`：指定设备的内存映射寄存器。\n*   `interrupts`：描述设备使用的中断线。\n*   `Labels`（标签，例如 `uart0`）：允许在\
  \ DTS 的其他地方引用节点。\n\n要使用设备树，需要使用设备树编译器（DTC）将 DTS 源编译成二进制 DTB 文件。\n\n## 编译命令\n\n以下是编译命令：\n\
  \n```bash\n$ dtc -I dts -O dtb -o my-device-tree.dtb my-device-tree.dts\n```\n\n\
  其中：\n\n*   `-I dts`：输入格式为 DTS。\n*   `-O dtb`：输出格式为 DTB。\n*   `-o`：指定输出文件。\n\nDTB\
  \ 在启动期间传递给 Linux 内核。\n\n当 Linux 内核启动时，它使用 DTB 探测并初始化硬件。以下是工作流：\n\n*   **引导程序**：引导程序加载并提供\
  \ DTB。\n    *   DTB 可以嵌入内核中，也可以单独加载。\n*   **内核**：内核读取 DTB 获取硬件信息。\n    *   根据 `compatible`\
  \ 属性匹配驱动。\n*   **动态配置**：允许无需重新编译内核的情况下配置设备树。\n\n使用 DTB 的主要优势是：\n\n*   硬件抽象：内核开发人员无需将硬编码到内核中。\n\
  *   可移植性：通过更改 DTB，相同的内核可以运行在不同的板上。\n*   灵活性：通过覆盖（Overlays）支持运行时修改。\n\n实际示例：考虑具有\
  \ UART 和 GPIO 控制器的系统。覆盖将定义这些设备，内核使用它们。\n\n## 使用 U-Boot 加载 DTB\n\n以下是使用 U-Boot 的步骤：\n\
  \n1.  将 DTB 放入分区。\n2.  更新引导程序配置：\n    ```bash\n    setenv fdtfile my-device-tree.dtb\n\
  \    saveenv\n    ```\n3.  启动内核：\n    ```bash\n    bootz ${kernel_addr} - ${fdt_addr}\n\
  \    ```\n4.  当系统启动失败或设备未识别时：\n    a. 使用 `dtc` 工具将 DTB 反编译回 DTS：\n       ```bash\n\
  \       $ dtc -I dtb -O dts -o output.dts my-device-tree.dtb\n       ```\n    b.\
  \ 检查与设备初始化相关的内核日志（`dmesg`）。\n    c. 确保 `compatible` 字符串与内核中的预期值匹配。\n\n覆盖（Overlays）允许在运行时添加或修改设备树。这对于模块化硬件设计或条件配置非常有用。\n\
  \n示例：\n\n```dts\n/dts-v1;\n/plugin/;\n\n/ {\n  fragment@0 {\n    target = <&gpio;\n\
  \    __overlay__ {\n      new-led {\n        compatible = \"gpio-led\";\n      \
  \  gpios = <&gpio 5 GPIO_ACTIVE_HIGH>;\n        label = \"user-led\";\n      };\n\
  \    };\n  };\n};\n```\n\n该覆盖向 GPIO 控制器添加了 LED 设备。\n\n## [结语]\n\n（此处：）\n\n本章让我们再次进入\
  \ GNU/Linux 内核的世界，详细介绍了多年来为简化维护和开发而开发的基础。考虑到目前看到的元素，我们将在下一章介绍字符驱动的开发。\n\n加入我们书籍的\
