  \ `/lib/modules/<kernel-release>/updates/dkms/`\n\n### 移除\n\n对于移除所有内核版本的 `dkms`\
  \ 支持，这与添加阶段非常相似：\n\n```bash\n$ sudo dkms remove -m helloworld -v 0.1 --all\n```\n\
