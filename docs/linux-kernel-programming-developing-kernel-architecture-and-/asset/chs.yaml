  \ root 4,0K oct. 26 21:51 howmany\n-r--r--r-- 1 root root 4,0K oct. 26 21:51 whom\n\
  ```\n\n我们可以在带任何参数的情况下加载模块（使用默认上下文）：\n\n```bash\n$ sudo insmod param.ko\n$ lsmod\
  \ | grep param\nparam 16384 0\n$ dmesg\n[ 7658.068510] (0) Hello, world\n```\n\n\
  我们将测试每种参数加载组合。在每次测试之间，你必须记得卸载驱动：\n\n```bash\n$ sudo rmmod param\n```\n\n在没有参数或参数未标记标记时，必须设置一个默认值。\n\
  \n然后，使用单个参数：\n\n```bash\n$ sudo insmod param.ko howmany=5\n$ dmesg\n[ 7404.087814]\
  \ (0) Hello, world\n[ 7404.087821] (1) Hello, world\n[ 7404.087822] (2) Hello, world\n\
  [ 7404.087823] (3) Hello, world\n[ 7404.087824] (4) Hello, world\n[ 7404.087825]\
  \ (5) Hello, world\n```\n\n最后，使用另一个参数：\n\n```bash\n$ sudo insmod param.ko whom=bpb\n\
  $ dmesg\n[ 7470.763580] (0) Hello, bpb\n```\n\n最后，使用两个参数：\n\n```bash\n$ sudo insmod\
  \ param.ko howmany=10 whom=bpb\n$ dmesg\n[ 7600.566090] (0) Hello, bpb\n[ 7600.566096]\
  \ (1) Hello, bpb\n[ 7600.566097] (2) Hello, bpb\n[ 7600.566099] (3) Hello, bpb\n\
  [ 7600.566100] (4) Hello, bpb\n[ 7600.566101] (5) Hello, bpb\n[ 7600.566102] (6)\
  \ Hello, bpb\n```\n\n\n\n\n\n示例：`pr_info(\"Hello, world 4\\n\");`\n\n其中 `LOGLEVEL`\
  \ 是日志级别之一。\n\n| 注意：它被连接到格式化字符串中；日志级别不是一个独立的参数。 |\n\n可用的日志级别有：\n\n| 日志级别 (Loglevel)\
  \ | 字符串 | 别函数 |\n| :--- | :--- | :--- |\n| KERN_EMERG | \"0\" | `pr_emerg()` |\n\
  | KERN_ALERT | \"1\" | `pr_alert()` |\n| KERN_CRIT | \"2\" | `pr_crit()` |\n| KERN_ERR\
  \ | \"3\" | `pr_err()` |\n| KERN_WARNING | \"4\" | `pr_warn()` |\n| KERN_NOTICE\
  \ | \"5\" | `pr_notice()` |\n| KERN_INFO | \"6\" | `pr_info()` |\n| KERN_DEBUG |\
  \ \"7\" | 如果定义了 `DEBUG`，则为 `pr_debug()` 和 `pr_devel()` |\n| KERN_DEFAULT | \"\"\
  \ | |\n| KERN_CONT | \"c\" | `pr_cont()` |\n\n表 3.1：每个宏的日志级别合成\n\n例如，内核 `printk.h`\
  \ 包含：\n\n```c\n#define pr_info(fmt,arg...) \\\nprintk(KERN_INFOfmt,##arg)\n```\n\
  \n正如其名称一样，`pr_info()` 是优先级为 `KERN_INFO` 的 `printk()`。\n\n你可以通过根据严重级别过滤内核日志消息来配置\
  \ `dmesg` 命令的日志级别。日志级别通过 `klogd` 服务管理，该它是系统日志基础设施的一部分。以下是配置 `dmesg` 日志级别的方法：\n\n\
  你可以通过运行不带任何选项的 `dmesg` 来检查当前日志级别。该命令根据严重级别显示内核日志消息。默认情况下显示最严重的消息。\n\n`$ dmesg`\n\
  \n或者，\n\n`$ dmesg -w`（实时查看日志）\n\n你可以使用 `dmesg` 的 `-n` 选项来临时设置日志级别。例如，要显示日志级别为警告（级别\
  \ 4）或更高的消息，你可以使用：\n\n`$ dmesg -n 4`\n\n根据你的调试或监控需求需要调整日志级别。\n\n通过某些内核设置，我们必须允许没有\
  \ root 权限执行该命令：\n\n`$ sudo sysctl -w kernel.dmesg_restrict=0`\n\n`kernel.printk`\
  \ sysctl 配置控制 Linux 中内核日志消息的详细程度。它由四个数值组成，每个值代表一个不同的日志级别。这些值用于过滤和控制哪些消息显示在系统控制台上并被记录。`kernel.printk`\
  \ 的格式为：`console_loglevel console_loglevel console_loglevel debug_loglevel`。\n\n\
  以下是 `kernel.printk` 每个部分的可能值：\n\n- `console_loglevel`（控制台消息的控制台日志级别）：\n    - 此值设置显示在系统控制台上的消息日志级别。\n\
  \    - 有效值为 0 到 7，对应的日志级别为：\n        - 0: `KERN_EMERG`（紧急）\n        - 1: `KERN_ALERT`（警告）\n\
  \        - 2: `KERN_CRIT`（关键）\n        - 3: `KERN_ERR`（错误）\n        - 4: `KERN_WARNING`（警告）\n\
  \        - 5: `KERN_NOTICE`（通知）\n        - 6: `KERN_INFO`（信息）\n        - 7: `KERN_DEBUG`（调试）\n\
  - `console_loglevel`（控制台日志缓冲区的控制台日志级别）：此值设置记录在控制台日志缓冲区中的消息日志级别。有效值为 0 到 7，遵循上述提到的相同日志级别。\n\
  - `console_loglevel`（显示在控制台上消息的控制台日志级别）：此值设置将显示在系统控制台上的消息的日志级别。有效值为 0 到 7，具有相同的日志级别。\n\
  - `debug_loglevel`（调试日志级别）：此值设置调试消息的日志级别。有效值为 0 到 7，使用上述列出的相同日志级别。\n\n### 动态内核模块支持\n\
  \n这是一个正在证实的趋势。越来越多的制造商为它们的驱动程序（virtualbox, ndiswrapper, lttng, fglrx 等）提供动态内核模块支持（DKMS），以保证随着开发演进服务的连续性。不仅包括\
  \ GNU/Linux 内核版本，还包括驱动程序本身。\n\n在 Fedora 和 RedHat 等派生版本中，通常使用自动内核模块（akmods），尽管它与\
  \ DKMS 类似。我们只会看到 DKMS，它更具跨平台性，且不针对特定的 Linux 发行版。\n\n每当包管理器更改内核版本时，RPM、DEB 等包的安装后操作中会自动启动触发器。当驱动程序更新时，也会执行相同的操作。\n\
  \n因此，它必须在使用当前内核 API 的情况下从驱动源进行重新编译，以保证某种一致性。\n\nDKMS 由 Dell 公司开发，主要使用 Bash 和 Perl\
  \ 语言，旨在解决这个问题。它根据 GPLv2 许可证作为开源自由发布。\n\nDKMS 架构由不同部分组成：\n\n- 模块源码：`/usr/src/<drv_name>-<version>/`\n\
  - 内核模块树：`/lib/modules/$(uname -r)``：DKMS 将替换或添加\n- `/var/lib/dkms`，包含：\n    - 模块所在的目录\n\
  \    - DKMS 构建的模块 `/var/lib/dkms`\n- `/usr/src/<drv_name>-<version>/`\n\n下图显示了 DKMS\
  \ 使用的路径：\n\n![](img/3.9) 图 3.9：DKMS 使用的主要文件\n\n关于 DKMS 本身，我们区分了位于 `/etc/dkms` 的第一部分。第二部分包含了驱动源、头文件，最后是构建的模块。\n\
  \n```bash\n## DKMS 路径\n```\n\n### 安装\n\nkms 已成为某些 Linux 发行版的必选组件：\n\n- Debian/Ubuntu：`sudo\
  \ apt-get install dkms`\n- OpenSuse：`sudo zypper install dkms`\n- Fedora ：`sudo\
  \ yum install dkms`\n- 从官方 GIT 仓库：`git clone git://dell.com/dkms`\n\n对于包，依赖将是 `make`、`linux-headers`\
  \ 和 `openssl`。\n\n### 配置\n\nDKMS 的可以通过位于 `/etc/dkms/framework.conf` 的文件进行简单配置，其中定义了\
  \ DKMS 的路径：\n\n该配置文件每次运行时都会加载。\n\n```bash\nsource_tree=\"/usr/src\"\ndkms_tree=\"\
  /var/lib/dkms\"\ninstall_tree=\"/lib/modules\"\ntmp_location=\"/tmp\"\nverbose=\"\
  1\"\n```\n\n### 支持 Secure Boot\n\n配合 UEFI 使用 DKMS 支持 Secure Boot 涉及几个关键步骤，以确保自定义内核模块已签名并可以加载\
  \ Secure Boot 已启用。以下是分步骤指南：\n\n1. 安装依赖：`sudo apt install dkms openssl mokutil linux-headers-$(uname\
  \ -r)`\n\n2. 你可以检查是否在使用安全启动：\n`sudo mokutil --sb-state`\n\n安全启动启用\n\n如果没有启用，请先设置安全模式！\n\
  \n3. 创建存储密钥对的目录：\n`sudo mkdir -p /var/lib/dkms/mok`\n`cd /var/lib/dkms/mok`\n\n\
  4. 选项 #1，生成私钥和自签名公证书：\n`openssl req -new -x509 -newkey rsa:2048 -keyout MOK.priv\
  \ -outform DER -out MOK.der -nodes -days 36500 -subj \"/CN=Custom DKMS Module Signing/\"\
  `\n\n它将以下文件：\n\na. `MOK.priv`：用于签名内核模块的私钥。\n\nb. `MOK.der`：DER 格式的自签名证书，将通过 `mokutil`\
  \ 导入 Secure Boot；它也将被 dkms 在构建后步骤中用于驱动程序签名。\n\n\n\n\n## 5. 选项 #2，使用证书机构 (PKI) 验证\
  \ DER 证书\n\n如果你的公司有证书机构（`PKI`），则需要分两个阶段进行：\n\n不要生成自签名证书，而是创建一个证书签名请求 (`CSR`)），它将由你的\
  \ `PKI CA` 签名：\n\n```bash\n$ openssl req -new -newkey rsa:2048 -keyout MOK.priv\
  \ -out MOK.csr -nodes -subj \"/CN=Custom DKMS Module Signing/\"\n```\n\n在此阶段，你需要将\
  \ `MOK.csr` 提交给你组织的 PKI 证书机构（如 `Microsoft AD CS`、`FreeIPA` 或外部 CA）。使用本地 CA 签名 CSR\
  \ 的示例命令：\n\n```bash\n$ openssl x509 -req -in MOK.csr -CA CA.crt -CAkey CA.key -CAcreateserial\
  \ -out MOK.pem -days 36500 -sha256\n```\n\n一旦收到签名的证书（`MOK.pem`），将其转换为 DER 格式：\n\n\
  ```bash\n$ openssl x509 -in MOK.pem -outform DER -out MOK.der\n```\n\n## 6. 创建新证书\n\
  \n```bash\n$ sudo mokutil –enable-validation\n```\n\n—> 在这一步，将要求输入密码；重启后会再次要求。\n\
  \n## 7. 将密钥注册到所有者密钥 (MOK) 列表中\n\n使用 `mokutil` 将密钥导入到 MOK 列表中，内核将用它来验证签名模块：\n\n```bash\n\
  $ sudo mokutil --import MOK.der\n```\n\n检查导入是否成功：\n\n```bash\n$ sudo mokutil --list-new\n\
  ```\n\n按照提示设置密码。你需要在重启后确认注册。\n\n## 8. 重启并注册密钥\n\n在启动过程中，系统将提示你注册密钥。请遵循屏幕上的说明并使用你之前设置的密码。\n\
  \n你可以在 UEFI BIOS 中确认新密钥的导入：\n\n```bash\n$ sudo mokutil --list-enrolled | grep \"\
  Custom DKMS Module Signing\"\n```\n\n## 9. 配置 DKMS 使用签名密钥\n\n编辑或创建 DKMS 配置文件以包含签名命令。\n\
  \n```bash\n$ sudo nano /etc/dkms/framework.conf\n```\n\n添加以下行：\n```text\nmok_signing_key=/var/lib/dkms/mok/MOK.priv\n\
  mok_certificate=/var/lib/dkms/mok/MOK.der\n```\n\n## 10. 要验证模块是否已正确签名并可以在启用 Secure\
  \ Boot 的情况下加载，你可以使用以下命令检查模块签名：\n\n```bash\n$ modinfo -F sig_id /lib/modules/$(uname\
  \ -r)/updates/dkms/example-module.ko\n```\n\n你应该能看到指示模块已签名的输出。\n\n在这一步中，你可以加载/卸载动态模块：\n\
  \n```bash\n$ modprobe example-module\n$ modprobe -r example-module\n```\n\n如果发生签名问题，将报告错误。\n\
  \n## 工作原理\n\nDKMS 的工作类似于一个状态机。第一步是通过配置文件添加驱动程序。一旦在 DKMS 数据库中已知，就可以要求它在一个或多个 GNU/Linux\
  \ 内核版本上编译模块，然后将其安装到 `/lib/module/<kernel-version> /...`\n\n每个步骤都是独立的，因此可以在不构建或安装驱动的情况下添加驱动。\n\
  \n安装可以自动进行，取决于设置：\n\n![](img/figure3.10.png)\n\n图 3.10：DKMS 状态机\n\n每个配置文件都依赖于 DKMS\
  \ 传播的一组变量：\n\n- `kernelver`: 该变量包含正在编译模块的内核版本。这在定义 `MAKE` 命令时特别有用，例如 `MAKE[0]=\"\
  make INCLUDEDIR=/lib/modules/${kernelver}/build/include\"`\n- `dkms_tree`: 该变量指示\
  \ DKMS 树在本地系统上的位置。默认是 `/var/lib/dkms`，但不应在 `dkms.conf` 中硬编码此值，以防用户更改了系统设置（此类设置可以通过使用\
  \ `/etc/dkms/framework.conf` 或在调用时添加 `-dkmstree` 选项来实现）。\n- `source_tree`: 该变量指示\
  \ DKMS 在系统存储模块源码的位置。默认是 `/usr/src`，但不应在 `dkms.conf` 中硬编码此值，以防用户更改了系统设置（这可以通过使用 `/etc/dkms/framework.conf`\
  \ 或在调用时添加 `-source tree` 选项来实现）。\n- `kernel_source_dir`: 该变量包含构建模块的内核源码路径。除非使用 `--kernel-sourcedir`\
  \ 选项指定了其他路径，否则通常为 `/lib/modules/$kernelver/build`。\n\n## 为驱动添加 DKMS 支持\n\n为了演示如何将外部驱动集成到\
