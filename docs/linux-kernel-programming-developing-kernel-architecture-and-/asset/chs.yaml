  \n![](img/fm1.png)\n\n# 第 1 章 GNU/Linux 内核的历史 (#contents.xhtml_ch01a)\n\n## 引言\n\
  \n本章描述了 Linux 内核功能的起源和演变，以便不仅更好地理解内核是什么，还理解它在结构上是如何演进的。\n\n## 结构\n\n本章涵盖了以下主题：\n\
  \n* 灵感\n* Linux 内核历史\n* 各个功能随发布/里程碑的演变\n* `GNU/Linux` 许可证\n\n## 目标\n\n本章是理解 Linux\
  \ 从何而来、其历史以及为什么我们需要学习这个操作系统的重要序言。该系统的声部分归功于代码的开放性、健壮性和性能。在本章结束时，你将对 Linux 内核是什么有一个概览。Linux\
  \ 的发明者 Linus Torvald 并不是从零开始发明一切，而是受到了当时存在的事物的启发，无论他是否拥有这些东西。因此，了解这些灵感对于深入理解是非常有用的。\n\
  \n## 灵感\n\n20 世纪 60 年和 70 年代，Unix 是 AT&T 贝尔实验室开发的一种操作系统。它以模块化设计、稳定性和高效而闻名。Unix（通常大写为\
  \ `UNIX`，特别是在作为官方商标时）是贝尔实验室在 1969 年创建的一种交互式分时共享系统。\n\nUnix 这个名字是一个双关语，结合了 `uniplexed`（意为单路或一次一个）和\
  \ `multics`（指代一个早期的操作系统项目）。Unix 的开发是作为 `Multics` 操作系统的继任者进行的。\n\nKen Thompson 和\
  \ Dennis Ritchie 被认为是 Unix 的发明者。\n\n1974 年，Unix 成为第一个用 `C` 语言开发的操作系统。Linux 内核的创建者\
  \ Linus Torvald 在大学期间是 Unix 用户，并受到了 Unix 多用户、多任务和资源管理概念的启发（见图 1.1](#ch01.xhtml_fig1-1)）。下图向我们展示了\
  \ Unix 系统的同心模型：\n\n![](img/figure1.png)\n\n### UNIX 系统的洋葱模型\n\nUnix 通常被认为基于洋葱模型。\n\
  \nUnix 系统提出的模型是分层的，从硬件通过内核到达用户，内核控制硬件以及提供实用程序的软件。下图向我们展示了洋葱模型的垂直视图：\n\n![](img/figure1.png)\n\
  \n### Unix 系统的另一种分层视图\n\nUnix 系统的架构视图与真实的 Linux 概述相似。\n\n正如我们将探索的那样，Linux 发行版数不胜数，并且它们相互启发。Unix\
  \ 系统也是如此，因为当我们谈论 Unix 系统时（对于那些用过它们的人来说），指的是 `IBM AIX`、`HP UX`、`Irix`、`Solaris`、`UnixWare`、`Ultrix`、`Microsoft\
  \ Xenix`、`SCO Unix`、`Net/OpenBSD` 等。\n\n所有这些系统都以自己的方式演变并为我们今天所知的现代系统做出了贡献。下图向我们展示了当时常见的无数\
  \ Unix 版本，现在它们很大程度上已被 Linux 系统所取代：\n\n![](img/figure1.png)\n\n### Unix 系统的历史与依赖\n\
  \n1972 年 Unix 第二版中的许多命令在今天的 Linux 中仍在使用。\n\n另一个灵感是 `Minix`（微型 Unix），这是一种教育性和实验性的操作系统，由\
  \ Andrew S. Tanenbaum（也称为 AST）于 1984 年创建，供学生剖析真实的操作系统。事实上，AT&T 曾禁止出于教育目的使用 Unix，并禁止将其用于教学。\n\
  \nMINIX 是用 `C` 编程语言编写的微内核，用于重新实现 `V7`。它是为 `IBM PC`（带有 256KB 内存、360KB 5.25 英软磁盘）设计的。它的结构比\
  \ UNIX 更模块化，从用户角度来看与它兼容，但在内核层面完全不同。\n\n\n\n\n它的目标是提供一个学生可以理解的开源、简洁的设计：一个微内核，操作系统的其余部分都是用户进程，并通过同步消息传递进行通信。许多基础程序，如\
  \ `cat`、`grep`、`ls`、`make`……等等以及 `shell` 都存在，且功能与 UNIX 相同，而 UNIX MINIX 需要 20 MB\
  \ 的硬盘分区。MINIX 没有 UNIX 效率高，因为它的设计目标是可读性。下图清晰地显示了控制器在用户空间且没有内核的定位，这在后续图中会被 Linux 视为一种低效的方法：\n\
  \n![](img/figure1.4.png)\n\n图 1.4：微内核架构\n\n内核是操作系统的核心部分；它管理系统资源。它就像计算机应用程序和硬件之间的桥梁。在单体内核中，用户服务和内核服务都存在同一个地址空间内。\n\
  \nLinus Torvalds 曾在 Minix 上工作了一段时间，获得了操作系统系统设计方面的实践经验。然而，他发现 Minix 在性能和功能方面存在局限性，这促使他创建了自己的内核，并在几年后催生了\
  \ Linux 内核。初始版本在出现发热问题一个小时后就会崩溃。\n\n我们不应该忘记让 Linux 内核变成今天模样的最新且最重要的灵感之一。这归功于现在的名称，即\
  \ GNU/Linux，它源于其所附的 `GPL` 权限。\n\nGNU 是由 Richard Stallman 在 1983 年创建的自由操作系统（如图 1.5\
  \ 所示），由 GNU 项目维护。GNU 涵盖了 UNIX 的概念和操作。该项目已经有一个名为 `HURD` 的内核，这是一个双关语，因为它的听起来像 herd（一群动物），代表了远离\
  \ Unix 单体内核模型的愿望。它与 Linux 进入了竞争，但后者盖过了它的光芒。\n\n![](img/figure1.5.png)\n\n图 1.5：Richard\
  \ Stallman，GNU 项目和自由软件基金会创始人\n\nLinus Torvalds 使用了来自 GNU's Not Unix（GNU）项目的开发工具，这是由\
  \ Richard Stallman（也称为 RMS）于 1983 年发起的一项旨在创建完全自由且开源的操作系统的倡议。\n\n尽管 Linux 不是 GNU\
  \ 项目的一部分，但它已与 GNU 工具结合创建了一个完整的操作系统，因此有了 GNU/Linux 术语。GNU 工具在 Linux 的早期开发中起了至关重要的作用。\n\
  \n正如我们所看到的，Linux 的诞生并不是没有从当时的现有事物中获得灵感，但它的创建者 Linus Torvald 知道如何创建一个单体内核，取其者的优点并抛弃他者的缺点。因此，Linux\
  \ 可以被认为是 70/80 年代就已被视为前卫和现代的概念的合体。与 Minix 不同，下图清晰地显示了内核地址空间中大部分控制器的移动：\n\n![](img/figure1.6.png)\n\
  \n图 1.6：作为 Linux 演进后的单体内核架构\n\nLinus Torvalds 受到开源和代码共享概念的影响。他选择在 GNU 通用许可证（`GPL`）下发布其内核源码，这鼓励了全球开发者的协作和贡献。\n\
  \n这些灵感导致了 Linux 内核的诞生，它的开发考虑了开源原则、模块化和效率。它建立在现有 UNIX 系统的最佳实践之上，同时引入了持续的创新和改进。\n\n\
  ## Linux 内核历史](#contents.xhtml_sc2_5a)\n\n曾经，有一个名为 Linux 的项目，它于 1991 年在赫尔辛基大学启动，是一个芬兰人\
  \ Linus Torvald 论文的个人项目，旨在创建一个新的单体自由操作系统内核。\n\n他专门为他正在使用的硬件编写该程序，并且独立于任何操作系统，因为他想使用他配备了\
  \ `80386` 处理器的新 PC 的功能。开发是在 MINIX 上使用 GNU C 编译器进行的。\n\n生成的 Linux 内核从 1991 年首次发布源码以来，在整个历史中一直保持稳步增长。它从最初禁止商业分发的少量许可\
  \ C 文件，增长到 2018 年 `GNUv2` 标签下的 `4.15` 版本，不包括注释在内的 2330 万行源码。\n\n1991 年 4 月，当时 Linus\
  \ Torvalds 是芬兰赫尔辛基大学的一名 21 岁计算机科学学生，开始为一种个人电脑的受 UNIX 启发的操作系统进行一些简单的构想。这一切始于一个 Intel\
  \ `80386` 汇编语言任务切换器和终端驱动程序。\n\n1991 年 7 月 3 日，为了在项目中实现 UNIX 系统调用，Linus Torvalds\
  \ 尝试向 `comp.os.minix` 新闻组提交请求以获取 POSIX 标准文档的数字副本。然而，他未能找到这些文档，因此他首先求助于大学拥有的 `SunOS`\
  \ 文档来确定系统调用，用于操作他的 Sun Microsystems 服务器。他还从 Tenenbaum 的 MINIX 文本中学习了一些系统调用，那是 Unix\
  \ 课程的一部分。\n\n1991 年 8 月 25 日，Torvalds 在 Usenet 新闻组 `comp.os.minix` 发布了以下内容。这里是 Linus\
  \ Torvald 在该日期在论坛发布的内容：\n\n```\n所有正在使用 minix 的各位大家好 -\n\n我正在做一个（免费的）操作系统 -\n\n我一直在为\
  \ AT-386 计算机开发一个类 Minix 的免费版本。它终于达到了一个甚至可以使用的阶段（尽管取决于你的需求，可能并不适用），我愿意发布源代码以进行更广泛的分发。这仅仅是\
  \ 0.02 版本……但我已经在上面成功运行了 bash、gcc、gnu-make、gnu-sed、compress 等。\n\n[正如]我一个月前提到的那样，我一直在为\
  \ AT-386 计算机开发一个类 Minix 的免费版本。它终于达到了一个甚至可以使用的阶段（尽管取决于你的需求，可能并不适用），我愿意发布源代码以进行更广泛的分发。这仅仅是\
  \ 0.02 版本……但我已经在上面成功运行了 bash、gcc、gnu-make、gnu-sed、compress 等。\n\n我目前移植了 bash (1.08)\
  \ 和 gcc (1.40)，一切似乎运行得良好。这意味着我将在几个月内就能得到一些实用的东西，我想知道人们想要什么功能。欢迎任何建议，但我不能保证实现它们。\n\
  \n而且是的——它没有任何任何 minix 代码，并且具有多线程文件系统。它是不可移植的（使用了 386 切换等），并且可能永远不支持其他硬件，因为那我仅有的。\n\
  \n—— Linus Torvalds\n```\n\n1991 年 9 月 17 日，Torvalds 发布了 Linux 0.01 版本并安装了 `ftp.funet.fi`——芬兰大学与研究网络（FUNET）的\
  \ FTP 服务器。它还无法执行，因为其代码需要 Minix 来编译和测试。\n\n1991 年 10 月 5 日，Torvalds 发布了 Linux 的第一个正式版本\
  \ 0.02。此时，Linux 能够运行 Bash、GCC 以及其他几个 GNU 工具：\n\n```\n正如我一个月前提到的那样，我一直在为 AT-386 计算机开发一个类\
  \ Minix 的免费版本。它终于达到了一个甚至可以使用的阶段（尽管取决于你的需求，可能并不适用），我愿意发布源代码以进行更广泛的分发。这仅仅是 0.02 版本……但我已经在上面成功运行了\
  \ bash、gcc、gnu-make、gnu-sed、compress 等。\n```\n\n![](img/figure1.7.png)\n\n图 1.7：Linux\
  \ 0.0.1 源码中的主函数\n\n尽管早期版本功能有限，Linux 迅速赢得了开发者和用户的青睐。许多人为该项目贡献了代码，包括来自 MINIX 社区的一些开发者。\n\
  \n对于 0 版本，Linux 表示主要用于测试，而不是生产性使用。1991 年 12 月发布的 0.11 版本是第一个自托管的 Linux，因为可以在运行相同内核的计算机上进行编译。\n\
  \n\n\n\n根据 Torvald 的说法，在 Orest Zborowski 将 X Window 系统移植到 Linux 之后，Linux 在 1992\
  \ 年开始流行，这使得 Linux 首次支持了图形用户界面（GUI）。此前 Linux 一直是一个可以在命令行使用的系统，就像当时的 MS-DOS 系统一样，而\
  \ X Windows 最终为 Linux 系统提供了图形化界面，这使其普及成为可能：\n\n![](img/figure1.8.png)\n\n图 1.8：带有\
  \ Linux 内核 `0.99` 和 X Window 系统的早期 Slackware 版本\n\nLinux 的冒险之旅自此开始，催生了不断增多的各种发行版。正如我们在\
  \ Unix 版本的年表中所看到的，这些发行版相互启发，共同呈现出我们今天所拥有的最佳成果。\n\nLinux 现在出现在 *nix* 家族中最大的名字之列（如图\
  \ 1.9 中绿色部分所示）：\n\n![](img/figure1.9.png)\n\n图 1.9：Unix 家族树\n\n来源：[wikimedia.org](https://wikimedia.org)\n\
  \n我们今天能遇到的不同发行版之间也充满了冒险精神。有些曾有过辉煌时代，现在已不复存在；另一些如图所示持续至今：\n\n![](img/figure1.10.png)\n\
  \n图 1.10：Linux 发行版\n\n来源:[`futurist.se/gldt/`](http://futurist.se/gldt/)\n\n## 各功能按发布/里程碑的演进](#contents.xhtml_sc2_6a)\n\
  \n记住 Linux 内核功能发展的不同阶段是非常重要的，因为这能让你了解它是如何随时间演变的。在接下来的章节中，我们将详细查看 Linux 内核经历的每个版本的重要点。\n\
  \n### 早期开发 (1991-1993](#contents.xhtml_sc3_7a)\n\n显著进展包括：\n\n* 1991：Linus Torvalds\
  \ 宣布 Linux 项目。\n* 1992：首次公开发 Linux `0.01`，仅支持 Intel `386` 处理器。\n* 1993：在 `GNU GPL`\
  \ 协议发布 Linux `0.99.1`，标志着该项目正式具有开源性质。\n\n早期的 GNU/Linux 内核（如 Linux `0.01` 和 Linux\
  \ `0.99`）与后后的版本相比非常简陋，功能有限。这些早期版本更像是概念验证版本，主要侧重于为基础操作系统提供基本功能。这些早期 Linux 内核版本的一些关键特性包括：\n\
  \n* 基础硬件支持：这些早期版本对 Intel `386` 处理器架构仅有原始的支持。重点是让内核能够在该硬件平台上运行。\n* 多任务处理：Linux `0.01`\
  \ 引入了基础的多任务处理能力，允许多个进程并发运行。\n* 内存管理：这些早期版本包含了基础内存管理，例如分页和进程的内存分配。然而，这与后期版本中看到的先进内存管理有很大差距。\n\
  * 文件系统：实现了一个用于文件存储的简单文件系统，但缺乏后期版本中丰富的文件系统支持。\n* Shell 和基础实用工具：Linux `0.01` 包含一个简单的\
  \ Shell 和几个与系统交互的基础级实用工具。\n* 无网络：这些早期版本缺少网络支持。网络支持是在随后的发布中逐渐添加的。\n* 无模块：这些早期版本中不存在允许动态内核扩展的“可加载内核模块”的概念。\n\
  \n早期 Linux 内核在功能和硬件支持方面非常有限。它们主要是 Linus Torvalds 作为一个爱好项目创建的，其简单性是刻意为之以保持开发的可控性。后期的\
  \ Linux 内核增加了许多功能，扩展了硬件支持并提升了性能，使 Linux 了一个多功能且强大的操作系统。\n\n### 内核版本 1.0 (1994](#contents.xhtml_sc3_8a)\n\
  \n1994 年，Linux `1.0` 发布，标志着稳定和成熟。尽管它没有引入任何特定的革命性功能，但它标志着 Linux 内核开发的一个重要里程碑。\n\n\
  Linux `1.0` 经历了多次早期的发布和改进，等到版本 `1.0` 发布时，它已经达到了某种可靠性和健壮性，适用于更广泛的应用。它的稳定性和成熟对于赢得用户和更广泛软件社区的信任至关重要。\n\
  \n版本 `1.0` 的发布也标志着 Linux 是专有 Unix 类操作系统的可行且稳定的替代方案。它吸引了开发者、企业和组织的关注，促进了 Linux 生态系统的快速增长及其在各个领域的采用。\n\
  \n### 内核版本 2.0 (1996](#contents.xhtml_sc3_9a)\n\n1996 年，Linux `2.0` 发布，引入了更好的硬件支持和改进的性能。这次发布标志着\
  \ Linux 在成为一个更健壮、多功能的操作系统迈出了关键一步。Linux `2.0` 的一些关键特性和进展包括：\n\n* 增强的硬件支持：Linux `2.0`\
  \ 增加了对广泛硬件平台和设备的支持，使其更容易适用于各种计算机系统。\n* 对称多处理 (SMP)：引入了 `SMP` 支持，允许 Linux 运行在多处理器系统上。这一功能显著提高了具有多个\
  \ CPU 的机器上的系统可扩展性伸性能。\n* 改进的网络：Linux `2.0` 包含了增强的网络能力，使其适用于服务器应用。集成了改进的 `TCP/IP`\
  \ 栈、对更多设备的支持以及更好的网络性能。\n* 更好的内存管理：内存管理子系统得到了增强，提供了更好的内存利用和性能。\n* 虚拟文件系统 (VFS)：VFS\
  \ 层的引入允许了更大的文件系统灵活性，并更容易集成各种类型，如 `ext2`、`NFS`。\n* 扩展的文件系统支持：增加了对额外文件系统的支持，包括成为 Linux\
  \ 默认文件系统的 `ext2`。\n* 系统稳定性增加：Linux `2.0` 增加了系统的稳定可靠，使其适用于更广泛的生产环境。\n* 改进的内核模块：引入了动态加载和卸载内核组件的模块。这允许在不需要重新编译的情况下扩展内核功能。\n\
  * 更广泛的软件兼容性：Linux `2.0` 改进的硬件支持和稳定性使其与更广泛的软件应用程序兼容，吸引了更多开发者和用户。\n\n总的来说，Linux `2.0`\
  \ 是 Linux 内核发展的一大步，扩展了其功能并使其成为服务器和桌面领域更成熟、更可靠的选择。这次发布为 Linux 操作系统的持续增长和流行奠定了基础。\n\
  \n### 内核版本 2.2 (1999](#contents.xhtml_sc3_10a)\n\n1999 年，Linux `2.2` 发布，增强了稳定性、性能和硬件支持。该版本相对于其前身有了实质性的改进，使其更适用于广泛的应用。一些关键特性和进展包括：\n\
  \n* 稳定性与错误修复：Linux `2.2` 包含了大量的错误修复和稳定性改进，解决了早期版本中存在的问题。这贡献了一个更可靠、更健壮的操作系统。\n* 增强的硬件支持：继续扩展硬件支持，包括对各种处理器、芯片组和外围设备的更好的兼容性。\n\
  \n\n\n\n\n- 改进的网络功能：对网络能力进行了进一步增强，包括支持更多网络设备和协议，并为网络 密集型应用程序提供了更优性能和可扩展性。\n- 高级文件系统：引入了如日志文件系统（`ext3`）等可选功能，提高了在系统崩溃或断电时文件系统的健壮性和恢复能力。\n\
  - 内核抢占：引入了内核抢占支持，使系统行为更加灵敏，并提供了实时应用支持。\n- USB 支持：对通用串行总线（`USB`）设备的初步支持为后续版本更广泛的\
  \ USB 支持奠定了基础。\n- 改进的可扩展性：性能改进和优化使 Linux 能够更扩展地处理更大、更复杂的负载，使其适用于企业环境。\n- PCMCIA\
  \ 支持：对个人电脑内存卡国际协会（`PCMCIA`）设备提供了更好的支持，这些设备通常用于笔记本电脑和其他便携系统。\n- 内存管理增强：对内存管理进行了进一步精炼，包括内存分配和利用的改进。\n\
  - 内核模块增强：持续开发内核模块系统，用于动态加载和卸载内核组件。\n\nLinux 2.2 是一个关键的发布，巩固了 Linux 作为一个适用于广泛应用的稳定、高性能操作系统的声誉。其改进的硬件支持、提升性能以及更高的稳定性吸引了更多用户和开发者加入\
  \ Linux 生态系统。这次发布还作为 Linux 内核未来发展的跳板。\n\n## 内核版本 2.4 (2001)\n\n2001 年，Linux 2.4\
  \ 发布，在内存管理和文件系统支持方面取得了重大改进。该版本引入了若干关键特性和改进，使 Linux 更加适用于各种应用程序。Linux 2.4 的一些关键特性包括：\n\
  \n- 高级内存管理：Linux 2.4 在内存管理方面带来了实质改进，包括对大量 RAM 更好的支持以及改进的虚拟内存处理。这些增强提升了 Linux 处理内存密集型任务的能力。\n\
  - 可扩展页表（高内存支持）：此版本引入了可扩展页表的概念（也称为高内存支持），这使得 Linux 能够在 32 位系统上访问超过 1 GB 的物理内存。\n\
  - 改进的 SMP 可扩展性：进一步增强对称多处理（`SMP`）支持，使 Linux 2.4 在多 CPU 系统上的可扩展性和效率更高。\n- 增强的文件系统支持：引入了日志文件系统，包括\
  \ `ext3`，它在系统崩溃或断电后提供了更好的数据完整性和更快的文件系统恢复速度。`XFS` 和 `ReiserFS` 也作为可选文件系统得到了支持。\n\
  - 改进的网络栈：对网络栈进行了增强，包括支持更多数量的网络设备、更好的 `IPv6` 支持以及改进的网络性能。\n- 防火墙与 IP 过滤：引入了 `Netfilter`\
  \ 框架，允许实现强大的防火墙和 IP 数据包过滤功能，使管理员能够更有效地保护其系统。\n- USB 支持：持续开发 `USB` 支持，使其更加健壮，并扩展了与更广泛\
  \ `USB` 设备的兼容性。\n- 增强的驱动支持：增加了额外的设备驱动程序和硬件支持，使 Linux 兼容更广泛的硬件组件。\n- 性能改进：整个内核中进行了大量的性能优化和效率改进，导致了更快的系统运行和响应时间。\n\
  - 内核抢占：进一步精炼了内核抢占，提供了更灵敏的行为和对实时及高性能计算应用的支持。\n\nLinux 2.4 是一个重要的发布，巩固了 Linux 作为一个成熟且强大的操作系统的地位，特别是对于服务器和企业环境。其改进的内存管理、文件系统改进和网络改进为它在各种计算场景中的广泛采用做了贡献。\n\
  \n## 内核版本 2.6 (2003)\n\n2003 年，Linux 2.6 发布，带来了重大的性能和资源管理增强。Linux 2.6 的主要特点是强调可扩展性、性能以及对各种硬件平台的改进支持。该版本的一些关键特性包括：\n\
  \n- 改进的可扩展性：Linux 2.6 包含了许多增强，以提高其在多处理器系统和大型服务器配置上的可扩展性。这些改进允许 Linux 能够高效地处理更多并发用户和进程。\n\
  - 新的 I/O 调度器：此版本引入了多个 I/O 调度器，包括完全公平调度器（`CFS`）和预判调度器（anticipatory scheduler）。这些调度器改进了磁盘\
  \ I/O 性能和响应速度。\n- 增强的电源管理：Linux 2.6 对高级电源管理功能提供了更好的支持，使其更适用于笔记本电脑和移动设备。增强了高级配置与电源接口（`ACPI`）支持，实现了更好的电源管理。\n\
  - udev：`udev` 的引入简化了设备管理，并使得处理动态检测硬件设备变得更容易。\n- 基于内核的异步 I/O：此特性允许在内核内部直接进行异步 I/O\
  \ 操作，提高了 I/O 密集型应用程序的性能。\n- 内核抢占：对内核抢占和实时支持的进一步改进使 Linux 2.6 更加灵敏，并适用于实时和高性能计算应用。\n\
  - 大文件支持：增加了对非常大文件的支持，满足了企业和科学计算的需求。\n- 安全增强：引入了如安全增强型 Linux（`SELinux`）和基于能力的安全功能，增强了\
  \ Linux 系统的整体安全性。\n- inotify：`inotify` 的引入提供了一种监控文件和目录变化的机制，使其对于文件同步和监控等各种应用非常有用。\n\
  - IPv6 改进：Linux 2.6 继续改进对 `IPv6` 的支持，反映了 `IPv6` 协议日益增长的重要性。\n- 新文件系统：引入了新的文件系统，如\
  \ `JFS`、`XFS`，以及扩展 4（`ext4`）文件系统的引入，这为 Linux 文件系统栈的可扩展性、性能和健壮性带来了显著改进。\n- 增强的网络：持续改进网络，包括更好的网络栈性能、服务质量（`QoS`）支持以及增强的协议支持。\n\
  \n总而言，Linux 2.6 是 Linux 内核发展的一大步，使其在从桌面到服务器以及嵌入式系统的各种计算环境中都更具适应性、可扩展性和以性能为导向。\n\n\
  \n\n\n\n## Linux 内核 3.0\n\n* **版本号简化**：从 `2.x` 系列（例如 `Linux 2.6.x`）过渡到 `3.0` 版本的主要原因是简化版本编号系统。内核维护者决定增加主版本号，以反映内核的成熟和稳定，而不是引入重大的架构变化。在功能上，`Linux\
  \ 3.0` 与 `Linux 2.6.x` 非常相似。\n* **性和增量改进**：虽然主版本号发生了变化，`Linux 3.0` 继续在各个领域接收增量改进，包括性能增强、驱动程序更新和错误修复。这些改进提升了内核的整体稳定性和可靠性。\n\
  * **符号意义**：版本号的改变作为一种象征性的姿态，承认内核的成熟，以及它自 `Linux 1.0` 时代以来发生的重大演变。然而，这并不代表内核开发或架构的重大转变。\n\
  * **持续开发**：尽管版本号发生了变化，`Linux` 的开发仍如常进行，随后的发布（例如 `Linux 3.1`、`3.2` 等）以渐进和演化的方式引入了新功能和改进。\n\
  \n总之，`Linux 3.0` 主要是版本号的变化，以反映内核的成熟，而不是引入特定的革命性功能。它延续了 Linux 内核持续开发和完善的传统，在性能、硬件支持和整体稳定性方面不断改进。后续版本在此基础上引入了新功能和改进。\n\
  \n## 内核版本 4.0 (2015)\n\n`Linux 4.0` 发布发布，侧重于性能和稳定性的改进。它于 2015 年发布，并非单一的革命性功能，而是一系列旨在提高整体性能、稳定性和硬件支持的增量改进、错误修复和优化。`Linux\
  \ 4.0` 的一些显著特点包括：\n\n* **内核模式设置 (KMS)**：虽然不是在 `4.0` 版本引入的，但该版本通过内核模式设置 (`KMS`) 的广泛采用标志着\
  \ Linux 图形的一个里程碑。`KMS` 改进了图形支持，包括更好的显示分辨率管理和增强的图形硬件支持。\n* **改进的硬件支持**：`Linux 4.0`\
  \ 继续扩大对新硬件组件的支持，包括对更多处理器、芯片组、显卡和外围的支持。\n* **内核热补丁 (Kernel live patching)**：此版本引入了内核热补丁支持，允许将关键安全补丁应用到运行中的内核，而无需重启系统。这是系统可用性和安全性方面的重大进展。\n\
  * **Intel Skylake 架构支持**：对 Intel `Skylake` 微架构的增强支持，为使用 `Skylake` 处理器的系统提供了更好的兼容性和性能。\n\
  * **更快的文件系统挂载**：改进了文件系统挂载性能，特别是对于 `Btrfs` 和 `NFS` 等文件系统，导致更快的系统启动速度和整体响应速度。\n* **改进的电源管理**：电源管理功能继续演进，提高了笔记本电脑和移动设备的能源效率。\n\
  * **新硬件驱动程序**：增加了新的硬件驱动程序，以更好地支持各种设备和外围。\n* **性能优化**：整个内核代码库中进行了通用性能优化和增强。\n* **安全补丁**：继续努力解决安全漏洞并提高系统安全性，包括缓解\
  \ `Spectre`（幽态漏洞）和 `Meltdown`（熔断漏洞）等漏洞。\n\n需要注意的是，Linux 内核开发遵循增量方法，每个版本都建立在上一个版本的基础上。尽管\
  \ `Linux 4.0` 没有引入任何单一的大型功能，但它对 Linux 内核的整体稳定、性能和硬件兼容性做出了贡献，使其成为广泛计算环境的可靠选择。后续内核版本继续添加新功能和改进。\n\
  \n## 内核版本 5.0 (2021 年 9 月)\n\nLinux 内核 `5` 引入了若干重要功能和改进。请注意，可能存在比我们提供的具有更多额外功能和改进的后续版本。以下是\
  \ `Linux 5` 内核的一些主要功能和改进：\n\n* **更高的性能**：`Kernel 5` 引入了各种性能改进，包括降低延迟和更好的资源利用，使其对于桌面和服务器负载都更加高效。\n\
  * **改进的硬件支持**：`Kernel 5` 包含了对新硬件组件和平台的支持，例如 `AMD Navi` GPU、`Intel Icelake` CPU 和\
  \ `Raspberry Pi 4`。它还改进了对现有硬件的支持。\n* **安全性增强**：内核持续接收安全增强以防止各种漏洞和威胁。这包括改进缓解 `Spectre`\
  \ 和 `Meltdown` 漏洞。\n* **I/O 改进**：引入了 I/O 优化（例如 `io_uring` 接口），改进了磁盘和网络 I/O 性能。\n\
  * **实时抢占**：实时抢占补丁合并到了主内核，使其更适合实时和低延迟应用。\n* **文件系统更新**：`ext4` 文件系统收到了若干改进和优化。`Btrfs`、`XFS`\
  \ 以及其他文件系统也收到了更新和错误修复。\n* **图形和 GPU 支持**：`Linux kernel 5` 带来了对新 `AMD` 和 `Intel`\
  \ GPU 的支持。同时，针对 `NVIDIA` GPU 的开源 `Nouveau` 驱动也有改进。\n* **能源效率**：`Kernel 5` 包含了各种电源管理增强，以提高笔记本和其他设备的能源效率。\n\
  * **无线与网络**：对网络栈进行了改进，包括对新的无线芯片组的支持和增强的网络性能。\n* **改进的硬件监控**：内核增加了对新传感器和硬件监控功能的支持，使系统管理员更容易监控和管理硬件。\n\
  * **安全性加固**：通过内核地址空间随机化 (`KASLR`) 等其他加固措施持续提升安全性。\n* **新系统调用和 API**：`Kernel 5` 引入了新的系统调用和\
  \ API，允许开发者创建更复杂的应用程序。\n\n## 内核版本 6.0 (2022 年 10 月)\n\n2022 年 10 月 2 日，Linus Torvalds\
  \ 发布了 `Linux 6.0`，这是一个包含许多更改的版本，特别是在提交数量方面。尽管他解释说主版本号的改变并不意味着基础性变化：\n\n```\n所以，正如大家可能清楚的那样，主版本号的改变更多是因为我的手指和脚趾用完了，而不是由于任何重大的基础变化。\n\
  \n但当然，里面确实有各种变化——我们总共有超过 1.5 万次非合并提交，因此 6.0 至少是长期以来最大的版本之一。\n```\n— Linus Torvalds\n\
  \n\n\n\n\n*   `ext4` 文件系统支持新的 `ioctl()` 操作：`EXT4_IOC_GETFSUUID` 和 `EXT4_IC_SETFSUUID`。\n\
  *   树莓派 V3D 内核驱动程序支持树莓派 4。\n*   由于移除了限制跨 CPU 进程迁移的能量边界启发式算法，能量利用率得到了提高。\n\n自 2022\
  \ 年 12 月的内核 `6.1` 版本以来，它成为除 C 和汇编之外第一个被用于 Linux 内核开发的语言。\n\n要了解有关 Linux 内核中添加的不同支持的更多细节，可以在该网站查看按提交总结：[`Kernelnewbies.org/LinuxChanges`](https://Kernelnewbies.org/LinuxChanges)。\n\
  \n## GNU/Linux 许可证\n\n最初，Torvalds 发布 Linux 时采用的是一种禁止任何商业用途的许可证。\n\n在 0.12 版本中，随着转向\
  \ GNU 通用公共许可证第 2 版 (`GPLv2`)，这一情况发生了变化。该许可证授权分发和销售可能经过修改或未修改的 Linux 版本，但要求所有此类副本必须在相同的许可证下发布，并附带（或根据请求以开放方式提供）完整的相应源代码。Torvalds\
  \ 将在 `GPLv2` 下许可 Linux 描述为：“我所做过最棒的事情”。\n\nLinux 内核明确仅根据 GNU 通用公共许可证第 2 版（`GPL-2.0\
  \ only`）进行许可，并附有显式的系统调用异常 (`linux-syscall-note`)，且未为被许可者提供后续版本的选择。贡献的代码必须在 GPL 兼容许可证下可用。\n\
  \nGNU 通用公共许可证第 2 版 (`GPL-2.0`) 是一种广泛使用的开源软件许可证，由自由软件基金会 (FSF) 开发。以下是其要点的简要总结：\n\n\
  *   **分发与修改**：`GPL-2.0` 允许任何人使用、修改和分发受该许可证保护的软件。你有自由修改代码以适应你的需求并分享这些修改。\n*   **左版许可（Copyleft）**：`GPL-2.0`\
  \ 是一种左版许可，这意味着如果你分发软件的修改版本，你必须按照相同的 `GPL-2.0` 条向其他人提供修改后的源代码。换句话说，它确保了软件及其衍生品保持开源。\n\
  *   **商业用途**：你可以将受 `GPL-2.0` 许可的软件用于商业目的。对于分发、支持或与软件相关的服务收费没有限制。\n*   **归属**：当你分发\
  \ `GPL-2.0` 许可的软件或其衍生品时，你必须保留原始版权声明、免责声明以及 `GPL-2.0` 许可证本身的副本。\n*   **兼容性**：`GPL-2.0`\
  \ 与某些其他开源许可证不兼容，特别是那些具有更宽松条款的许可证。当你将受 `GPL-2.0` 许可的代码与不兼容许可证下的代码结合时，所产生的作品必须完全根据\
  \ `GPL-2.0` 的条款进行许可。\n*   **无保证**：`GPL-2.0` 包含一份免责声明，说明软件是“按现状”提供的，不带任何保证。用户和分发者对对其使用相关的任何风险负责。\n\
  *   **终止**：如果你违反了 `GPL-2.0` 的条款，你使用和分发软件的权利可能会终止。但是，你可以通过遵守许可证来重新获得这些权利。\n\n重要的是，`GPL-2.0`\
  \ 是一份法律文件，其条款在法律上具有约束力。在该许可证下使用或分发软件的开发者和组织应该仔细阅读并理解其规定，以确保符合其要求。此外，`GPL-2.0` 在开源社区中被广泛使用，促进了自由和开源软件的增长。\n\
  \n关于 `GPLv2 only` 许可证的更多信息，你可以访问 [`spdx.org/licenses/GPL-2.0-only.html`](https://spdx.org/licenses/GPL-2.0-only.html)。\n\
  \n关于许可证可以多容易地更改以使用后来的 GPL 版本（包括第 3 版），以及这种更改是否必要，一直存在很大争议。Linus（注：此处应为 Linus 无误）Torvalds\
  \ 本人在发布 `2.4.0` 版本时特别说明，他自己的代码仅在第 `2` 版下发布。然而，GPL 的条款规定，如果没有指定版本，则不能使用任何版本，Alan\
  \ Cox 指出很少有其他 Linux 贡献者指定过特定的 GPL 版本。\n\n2006 年 9 月，对 29 位关键内核程序员的一项调查显示，其中 28 人倾向于使用\
  \ `GPLv2` 而非当前的 `GPLv3`。Torvalds 评论道：“我认为一些局外人……认为我个人只是个奇怪的人，因为我没有公开成为 `GPLv3` 的粉丝。”这组包括\
  \ Torvalds、Greg Kroah-Hartman 和 Andrew Morton 在内的顶尖内核开发者在媒体上就对 `GPLv3` 的反对发表了评论。他们引用了关于\
  \ DRM/硬件化（tivoization）、专利、额外限制的条款，并警告说 `GPLv3` 会导致开源世界的碎片化。决定不为 Linux 内核采用 `GPLv3`\
  \ 的 Linus Torvalds，在多年后仍然重申了他的批评。\n\n## 结论\n\n在第一章中，我们看到了 Linux 内核创建的历史背景，它能够借助\
  \ GNU 项目的工具成为一个完整的发行版。我们也看到了当时技术的影响，这些技术推动了开发，规避了限制并最终形成了我们现在所知的系统。\n\n在下一章中，我们将详细介绍\
  \ 系统的结构，特别是内核本身，这是我们的初始目标。\n\n# 第 2 章 内核简介](#contents.xhtml_ch2a)\n\n简介\n\n本章将介绍\
  \ Linux 内核的内部结构，并引导我们通过首次获取源码、定义要构建的模块、构建内核，最后使用 QEMU 虚拟机进行运行。\n\n结构\n\n本章涵盖了以下主题：\n\
  \n* 准备工作环境\n* 内核简介\n* 下载 Linux 源码重新编译\n* 从 kernel.org 下载官方压缩包\n* 配置自定义内核和模块\n* 构建自己的内核\n\
  * 安装\n* 执行与启动序列\n* 代码风格\n\n目标\n\n在本章结束时，你将理解 GNU/Linux 内核树的结构以及生成 Linux 内核的工作流，这将允许我们开始实际的驱动开发。\n\
  \n准备工作环境\n\n为了与其余命令保持一致，书中提到的所有命令均在 Linux 发行版（Ubuntu 22.04.3 X86_64 LTS）上经过验证。然而，有时经过一些调整，整个过程可以无缝移植到所有\
  \ Linux 发行版。\n\n因此，在本章剩余部分需要安装一些实用的包：\n\n```bash\nsudo apt install git build-essential\
  \ curl qemu-system-gui qemu-system-utils qemu-system-x86 gnupg2 bison flex libncurses5-dev\
  \ libglade2-dev libglade2-0 libgtk2.0-0 libgtk2.0-dev libglib2.0-0 libglib2.0-dev\n\
  ```\n\n\n\n\n\n本书侧重于 `GNU/Linux` 内核；我们将在整个章节中逐步对其进行检查。然而，我们需要一个 `Linux` 系统（用户空间部分通常称为\
  \ `rootfs`），这将允许我们全面地对内核进行验证。\n\n为了实现这一目的，我们将使用嵌入式世界常用的 `Buildroot` 项目（[`buildroot.org`](https://buildroot.org)）生成一个\
  \ `ext2` 格式的存档。\n\n以下是默认分支（`master/HEAD`）上的项目源码：\n\n```bash\n$ git clone --depth\
  \ 1 https://git.busybox.net/buildroot/ && cd buildroot/\n```\n\n正在克隆到 'buildroot'...\n\
  remote: Enumerating objects: 17248, done.\nremote: Counting objects: 100% (17248/17248),\
  \ done.\nremote: Compressing objects: 100% (16360/16360), done.\nremote: Total 17248\
  \ (delta 888), reused 11876 (delta 446), pack-reused 0\nReceiving objects: 100%\
  \ (17248/17248), 7.96 MiB | 8.20 MiB/s, done.\nResolving deltas: 100% (888/888),\
  \ done.\n\n```bash\n$ git branch\n* master\n```\n\n```bash\n$ git log\ncommit d797ecc6f026e1f0af17f91df33e8cd44731a97f\
  \ (grafted, HEAD -> master, origin/master, origin/HEAD)\nAuthor: Thomas Petazzoni\
  \ <thomas.petazzoni@bootlin.com>\n(…)\n```\n\n接下来，我们需要定义一个 `rootfs` 配置，这类似于构建的“身份卡”，它将指示包含哪些内容以及如何进行构建。我们可以注入以下配置。您定义了一个适用于\
  \ `x86_64` 架构的配置：\n\n```bash\n$ nano .config\n## Select a target architecture (e.g.,\
  \ x86_64)\nBR2_x86_64=y\n## Set the system hostname\nBR2_TARGET_GENERIC_HOSTNAME=\"\
  bpb\"\n## Configure the root filesystem (initramfs)\nBR2_TARGET_ROOTFS_INITRAMFS=y\n\
  ## Skip the Linux kernel build (since you don't want to build a kernel)\nBR2_LINUX_KERNEL=n\n\
  ## select ext2 for the target image\nBR2_TARGET_ROOTFS_EXT2=y\nBR2_TARGET_ROOTFS_EXT2_2=y\n\
  BR2_TARGET_ROOTFS_EXT2_2r1=y\nBR2_TARGET_ROOTFS_EXT2_GEN=2\nBR2_TARGET_ROOTFS_EXT2_REV=1\n\
  BR2_TARGET_ROOTFS_EXT2_LABEL=\"rootfs\"\nBR2_TARGET_ROOTFS_EXT2_SIZE=\"250M\"\n\
  BR2_TARGET_ROOTFS_EXT2_INODES=0\nBR2_TARGET_ROOTFS_EXT2_INODE_SIZE=256\nBR2_TARGET_ROOTFS_EXT2_RESBLKS=5\n\
  BR2_TARGET_ROOTFS_EXT2_MKFS_OPTIONS=\"-O ⁶⁴bit\"\nBR2_TARGET_ROOTFS_EXT2_NONE=y\n\
  ```\n\n在 `Buildroot` 中，`defconfig`（默认配置的缩写）指的是指定了构建嵌入式 `Linux` 系统根文件系统和交叉编译环境的默认设置和选项的文件。`defconfig`\
  \ 文件包含一组配置参数，例如要包含哪些包、内核选项、目标架构设置等。\n\n```bash\n$ make defconfig\n```\n\n配置内容应该像这样：\n\
  \n```bash\n$ cat .config | grep -v \"#\" | grep -v '^$'\n(...)\nBR2_HAVE_DOT_CONFIG=y\n\
  BR2_HOST_GCC_AT_LEAST_4_9=y\nBR2_HOST_GCC_AT_LEAST_5=y\nBR2_HOST_GCC_AT_LEAST_6=y\n\
  BR2_HOST_GCC_AT_LEAST_7=y\nBR2_HOST_GCC_AT_LEAST_8=y\nBR2_HOST_GCC_AT_LEAST_9=y\n\
  BR2_USE_MMU=y\nBR2_i386=y\nBR2_ARCH_HAS_TOOLCHAIN_BUILDROOT=y\nBR2_ARCH=\"i686\"\
  \nBR2_NORMALIZED_ARCH=\"i386\"\nBR2_ENDIAN=\"LITTLE\"\nBR2_GCC_TARGET_ARCH=\"i686\"\
  \nBR2_BINFMT_SUPPORTS_SHARED=y\nBR2_READELF_ARCH_NAME=\"Intel 80386\"\nBR2_x86_i686=y\n\
  (...)\n```\n\n如果您想通过添加更多工具来自定义最终的 `rootfs`，可以启动 `ncurse` 配置器：\n\n```bash\n$ make\
  \ menuconfig\n```\n\n接下来是生成步骤。构建的估计时间取决于计算机的性能，但也取决于互联网连接的带宽。然而，在现代设备和光纤网络上，大约需要\
  \ 30 分钟或更久：\n\n```bash\n$ time make\nmake 5540,18s user 583,48s system 308% cpu\
  \ 33:07,71 total\n```\n\n最后，我们因此得到了几种格式的 `rootfs`：\n\n```bash\n$ ls -alh output/images\n\
  total 12M\ndrwxr-xr-x 2 tgayet 4K Jan 30 22 .\ndrwxr-xr-x 6 tgayet 4K Jan 30 22\
  \ ..\n-rw-r--r-- 1 tgayet 60M Jan 30 22 rootfs.ext2\n-rw-r--r-- 1 tgayet 4M Jan\
  \ 30 22 rootfs.tar\n```\n\n仅需 60 兆的大小就能获得一个完整的 `Linux` 系统仍然是非常棒的，这解释了为什么 `Buildroot`\
  \ 和 `Yocto` 构建被用于嵌入式世界。\n\n文件系统层次结构标准（`FHS`）是一套规定目录结构和组织方式的指南和惯例。\n\n\n\n\n下图展示了\
  \ GNU/Linux 内核的架构：\n\n![](img/figure2.3.png)\n\n图 2.3：Linux 内核架构\n\n以下是 GNU/Linux\
  \ 内核的一些技术特性：\n\n*   单体内核架构：\n    *   Linux 内核遵循单体架构，整个操作系统内核作为一个单一的特权进程运行在内核空间中。\n\
  \    *   `kernel space` 是内存中一部分受保护区域，用户态进程无法访问。\n    *   同时计算多个进程，每个进程在 `SMP` 和\
  \ `NUMA` 上执行一个或多个线程。\n*   单一地址空间：\n    *   在单体内核中，所有内核组件共享一个单一的地址空间。\n    *   这意味着内核模块和子系统可以直接调用对方的函数并访问对方的数据结构，而无需通过定义良好的\
  \ API。\n*   高权限级别：\n    *   内核代码运行在 CPU 的最高权限级别，通常称为 `kernel mode`（内核态态）。\n    *\
  \   这允许内核执行敏感的特权操作，例如管理硬件资源和控制用户态进程的执行。\n*   内核子系统：\n    *   Linux 内核被组织成各种子系统，处理操作系统的不同方面，包括进程管理、内存管理、文件系统、网络、设备驱动等。\n\
  \    *   每个子系统负责特定的功能，并包含其自己的数据结构和函数。\n*   模块的动态加载：\n    *   虽然核心内核是单体的，但 Linux\
  \ 支持内核模块的动态加载和卸载。\n    *   内核模块是内核对象，可以加载到运行的内核中以添加或扩展功能，而无需重新编译内核。\n    *   模块允许更好的模块化，并能够支持广泛的硬件而不使内核镜像膨肿。\n\
  *   同步与并发：\n    *   单体内核必须仔细管理并发和同步，因为所有内核代码都运行在单一地址空间中。\n    *   使用 `locks`、`semaphores`\
  \ 和 `spinlocks` 等技术来保护共享数据结构并确保线程安全。\n*   广泛的设备支持：\n    *   单体内核通常对各种硬件设备提供广泛的内置设备驱动支持。\n\
  \    *   设备驱动是内核的一部分，可以直接与硬件交互，提供高效的访问。\n*   高效的函数调用：\n    *   由于内核函数位于同一个地址空间中，可以以最小的开销被直接调用。\n\
  \    *   内核内部的函数调用类似于用户态程序中的普通函数调用。\n*   内核恐慌（Kernel panic）：\n    *   在发生严重错误或不可恢复的故障时，单体内核会触发\
  \ `kernel panic`，从而停止系统以防止进一步损坏。\n    *   内核恐慌通常涉及生成用于调试的堆栈跟踪和诊断信息。\n*   复杂性：\n\
  \    *   由于包含了广泛的子系统和设备驱动，单体内核往往变得更加复杂。\n    *   这种复杂性使得理解和维护内核代码库变得具有挑战性。\n*  \
  \ 高性能：\n    *   单体内核通常提供高性能，因为它们消除了微内核架构中与进程间通信 (`IPC`) 相关的开销。\n    *   内核函数可以针对低层硬件访问进行优化。\n\
  *   尺寸与启动时间：\n    *   由于包含了许多子系统和驱动程序，单体内核可能比微内核大。\n    *   内核大小和启动时间会受启用功能和设备驱动数量的影响。\n\
  \n设备驱动运行在内核空间（在许多 CPU 架构中为 `ring 0`），拥有对硬件的完全特权访问。然而，某些模块被设计运行在用户态：例如基于 `FUSE/CUSE`\
  \ 的文件系统模块，以及 `UIO` 的某些部分或带有 `libusb` 库的 USB 模块。Linux 的窗口系统和显示服务器协议 `X Window System`\
  \ 和 `Wayland` 并不运行内核内核。\n\n与标准的单体内核不同，设备驱动可以很容易地配置为模块并在系统运行时加载或卸载，并且在某些条件下可以抢占，以正确处理硬件中断并更好地支持对称多处理。因此，Linux\
  \ 并没有稳定的设备驱动应用程序二进制接口（ABI）。\n\nLinux 通常启用内存保护和虚拟内存，并还能处理非统一内存访问。`μClinux` 项目允许 Linux\
  \ 在微控制器上运行，该项目不使用虚拟内存。\n\n硬件在 `ramfs` 的文件层次结构中表示。因此，用户应用程序通过约定通过 `/dev` 或 `/sysfs`\
  \ 目录中的项与设备驱动进行交互。进程信息也通过 `/procfs` 目录映射到文件系统。\n\n![](img/figure2.4.png)\n\n图 2.4：分层内核架构\n\
  \n这种模块化的视图以后对我们很有用，在配置部分我们必须记住这一点，这将允许我们选择内核的内容。\n\n构建 Linux 内核的步骤如下：\n\n1. 获取源码，如果是\
  \ tar 包，则验证归包的真实性。\n2. 对构建进行配置，以确定要生成的静态部分和动态模块。\n3. 编译内核和动态模块。\n4. 安装。\n5. 使用 `qemu`\
  \ 配合预构建的根 fs (`rootfs.ext2`) 测试内核。\n\n我们将逐一详细介绍所有这些步骤。\n\n下载 GNU/Linux 内核源码进行重新编译\n\
  \n在本节中，我们将学习如何以不同的方式获取 GNU/Linux 内核源码。\n\n使用发行版的包\n\n修改当前内核配置的第一种解决方案是从 `/usr/src/`\
  \ 目录下的独立包从已安装的源码开始。每个内核版本将有一个以 `linux-headers` 开头后跟其版本号的目录。对于给定版本，因此有几个包：内核运行时及其源码\
  \ (`linux-headers`)：\n\n```\napt-cache search `uname -r`\nlinux-buildinfo-6.2.0-33-generic\
  \ - Linux kernel buildinfo for version 6.2.0 on 64 bit x86\nlinux-cloud-tools-6.2.0-33-generic\
  \ - Linux kernel cloud tools for version 6.2.0-33\nlinux-headers-6.2.0-33-generic\
  \ - Linux kernel headers for version 6.2.0 on 64 bit x86\nlinux-image-6.2.0-33-generic\
  \ - Signed kernel image generic\nlinux-image-unsigned-6.2.0-33-generic - Linux kernel\
  \ image for version 6.2.0 on 64 bit x86\nlinux-modules-6.2.0-33-generic - Linux\
  \ kernel modules for version 6.2.0 on 64 bit x86\nlinux-modules-extra-6.2.0-33-generic\
  \ - Linux kernel extra modules for version 6.2.0 on 64 bit x86\nlinux-modules-ipu6-6.2.0-33-generic\
  \ - Linux kernel ipu6 modules for version 6.2.0-33\nlinux-modules-ivsc-6.2.0-33-generic\
  \ - Linux kernel ivsc modules for version 6.2.0-33\n```\n\n(...)确保你的代码被接收到主内核中。\n\
  \n这些规则对于我们从开始养成良好的习惯很重要。\n\n一旦安装了源码包，它们将位于 `/usr/src/linux-headers-<version>` 目录：\n\
