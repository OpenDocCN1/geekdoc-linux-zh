  \ (deleted)\n```\n\n每个动态库在整个系统中（在内存中）共享代码，但它有独立的数据和上下文区域。以下结果与之前的结果相同，但它使用了 `pmap`\
  \ 命令：\n\n```bash\n$ sudo pmap -X 1519\n1519: /usr/sbin/cron\n```\n\n\n\n\n\n9504\
  \ 712 134 104 596 104 0 0 0 0 0 152 152 0 0 KB\n\n下图展示了在 Linux 上运行的程序所使用的不同内存区域：\n\
  \n![](img/Figure10.5.png)\n\n图 10.5：用户进程的内存栈\n\n因此，一个二进制文件主要由代码区域、数据区域、符号启动数据段（BSS）和堆堆组成。\n\
  \n对于每个动态库，都有一个代码区域（在进程间共享）、一个数据区域以及一个保存其上下文的区域。最后，每个线程都有自己的栈区域。\n\n## 驱动程序中的分配\n\
  \n在 Linux 内核编程中，根据使用情况，有几种方法在驱动程序分配内存。\n\n### 内存分配方法\n\n以下是可用主要内存分配方法的概述：\n\n* `kmalloc`:\
  \ 该函数在内核地址空间中分配物理连续的内存。它适用于分配较少的内存，通常最多到几 KB。分配的内存不保证跨页边界时是物理连续的。\n\n```\nvoid *kmalloc(size_t\
  \ size, gfp_t flags);\n```\n\n* `大小限制`：适用于小内存分配。\n* `连续性`：内存跨页边界可能不连续。\n* `碎片化`：容易受到内存碎片的影响。\n\
  * `用途`：通常用于小型缓冲区、数据结构和控制块。\n\n| 选项 | 说明 |\n| :--- | :--- |\n| `GFP_KERNEL` | 请求可以在内存压力下被处理并允许被交换的内存。这是内核内存分配中最常用的选项。\
  \ |\n| `GFP_ATOMIC` | 请求必须原子分配的内存，不睡眠。适用于中断上下文中或其他不允许睡眠的上下文。 |\n| `GFP_DMA` | 请求适用于\
  \ DMA（直接内存访问）传输的内存。确保分配的内存是物理连续的，并且可以被支持 DMA 的设备访问。 |\n| `GFP_NOWAIT` | 请求内存而不等待其变得可用。如果内存立即不可用，则返回\
  \ `NULL` 而不是阻塞。 |\n| `GFP_NOIO` | 请求不允许 I/O 操作的内存。适用于不应让 I/O 操作触发额外内存分配的上下文。 |\n\
  | `GFP_NOFS` | 请求不允许文件系统操作的内存。适用于不应让文件系统操作触发额外内存分配的上下文。 |\n| `GFP_USER` | 请求用户空间进程可以访问的内存。适用于代表用户空间应用程序分配内存。\
  \ |\n| `GFP_HIGHUSER` | 请求来自高内存的内存，适用于较大的用户空间分配。通常与 `GFP_USER` 结合使用。 |\n| `__GFP_ZERO`\
  \ | 请求对分配的内存进行零初始化。可以与其他标志结合对内存进行零初始化。 |\n\n表 10.2：与 `kmalloc` 配合使用的标志详情\n\n这些标志可以使用按位或\
  \ (`|`) 运算符组合，以指定多个选项。例如，`GFP_KERNEL | __GFP_ZERO` 请求零初始化的内核内存。\n\n* `kzalloc`：它与\
  \ `kmalloc` 类似，但分配的内存会被零初始化。\n\n```\nvoid *kzalloc(size_t size, gfp_t flags);\n\
  ```\n\n* `初始化`：内存被零初始化。\n* `大小限制`：与 `kmalloc` 相同。\n* `连续性`：与 `kmalloc` 相同。\n* `用途`：当需要零初始化内存时，例如用于数据结构或缓冲区。\n\
  \n* `vmalloc`：该函数分配虚拟连续的内存，内存可能跨越多个不连续的物理页。它适用于不需要物理连续内存的大内存分配。\n\n```\nvoid *vmalloc(unsigned\
  \ long size);\n```\n\n* `大小限制`：适用于较大的内存分配。\n* `连续性`：不保证是物理连续的。\n* `用途`：通常用于大型缓冲区、设备驱动以及不需要物理连续内存的数据结构。\n\
  \n* `kmalloc_array` 和 `kzalloc_array`：这些与 `kmalloc` 和 `kzalloc` 类似，但用于分配数组。\n\n\
  ```\nvoid *kmalloc_array(size_t n, size_t size, gfp_t flags);\nvoid *kzalloc_array(size_t\
  \ n, size_t size, gfp_t flags);\n```\n\n* `数组分配`：这些对于分配特定大小的数组非常方便。\n* `大小限制`：与\
  \ `kmalloc` 和 `kzalloc` 相同。\n* `连续性`：与 `kmalloc` 和 `kzalloc` 相同。\n* `用途`：用于分配固定大小的数组。\n\
  \n* `dma_alloc_coherent`：`dma_alloc_coherent` 函数分配适用于 DMA 操作的内存。它通过将内存映射到 DMA 地址空间，确保分配的内存是物理连续的且适用于\
  \ DMA 传输。\n\n```\nvoid *dma_alloc_coherent(struct device *dev, size_t size, dma_addr_t\
  \ *dma_handle, gfp_t flag);\n```\n\n* `DMA 使用`：适用于 DMA 缓冲区。\n* `连续性`：保证物理连续性。\n\
  * `用途`：对于设备驱动程序中的 DMA 缓冲区是关重要的。\n\n* `dma_alloc_attrs`：它与 `dma_alloc_coherent` 类似，但允许指定额外的分配属性。\n\
  \n```\nvoid *dma_alloc_attrs(struct device *dev, size_t size, dma_addr_t *dma_handle,\
  \ gfp_t flag, struct dma_attrs *attrs);\n```\n\n* `额外属性`：允许指定额外的分配属性。\n* `用途`：当需要额外的分配属性时使用。\n\
  \n* `alloc_pages`：`alloc_pages` 函数分配指定数量的物理连续页。它返回一个指向已分配内存的 `struct page *` 指针，可以使用\
  \ `page_address` 宏将其转换为内核虚拟地址。\n\n```\nstruct page *alloc_pages(gfp_t flags, unsigned\
  \ int order);\n```\n\n* `大小灵活性`：允许分配可数量的连续页。\n* `连续性`：保证分配页内部的物理连续性。\n* `用途`：适用于需要物理连续的大型内存分配，例如用于\
  \ DMA 传输的缓冲区或内核数据结构。\n\n* `get_free_pages`：它与 `alloc_pages` 类似，但允许直接指定页数而不是阶数（页数以\
  \ 2 为底的对）。\n\n```\nunsigned long get_free_pages(gfp_t flags, unsigned int order);\n\
  ```\n\n* `大小灵活性`：允许分配可数量的连续页。\n* `连续性`：保证分配页内部的物理连续性。\n* `用途`：与 `alloc_pages` 相同，但接口不同。\n\
  \n* `dma_pool`：`dma_pool` 机制管理一个适用于 DMA 传输的内存缓冲区池。它提供了 DMA 安全内存块的高效分配和释放，这些块在池初始化时已预分配。\n\
  \n```\nstruct dma_pool *dma_pool_create(const char *name, struct device *dev, size_t\
  \ size, size_t align, size_t allocation);\nvoid *dma_pool_alloc(struct dma_pool\
  \ *pool, gfp_t flags, dma_addr_t *dma_handle);\nvoid dma_pool_free(struct dma_pool\
  \ *pool, void *vaddr, dma_addr_t dma_handle);\n```\n\n* `效率`：在池初始化时预分配内存以便高效分配和释放。\n\
  * `连续性`：保证池内内存块的物理连续。\n* `用途`：通常用于设备驱动程序中管理 DMA 缓冲区池以减少开销和碎片。\n\n### 内存操作函数\n\n\
  有几个函数可以用于内存操作。以下列表提到了它们：\n\n* `memset`：它将 `s` 指向的内存区域的前 `n` 个字节设置为指定值 `c`。\n\n```\n\
  void *memset(void *s, int c, size_t n);\n```\n\n* `目的`：它将 `s` 指向的内存区域的前 `n` 个字节设置为指定值\
  \ `c`。\n\n\n\n\n\n*   **用法**：通常用于初始化内存缓冲区或将内存区域重置为特定值。\n\n*   **memcpy**：它从内存区域\
  \ `src` 拷贝 `n` 字节到内存区域 `dest`。\n\n```c\nvoid *memcpy(void *dest, const void *src,\
  \ size_t n);\n```\n\n*   **目的**：它从内存区域 `src` 拷贝 `n` 字节到内存区域 `dest`。内存区域不能重叠。重叠区域请使用\
  \ `memmove`。\n*   **用法**：它用于将数据从一个内存位置拷贝到另一个内存位置。\n\n*   **memmove**：它与 `memcpy`\
  \ 相似，但通过执行基于临时缓冲区拷贝来正确处理重叠内存区域。\n\n```c\nvoid *memmove(void *dest, const void *src,\
  \ size_t n);\n```\n\n*   **目的**：它与 `memcpy` 相似，但通过执行基于临时缓冲区拷贝来正确处理重叠内存区域。\n*   **用法**：用于内存区域可能重叠的情况。\n\
  \n*   **memcmp**：它比较内存区域 `s1` 和 `s2` 的前 `n` 字节。\n\n```c\nint memcmp(const void *s1,\
  \ const void *s2, size_t n);\n```\n\n*   **目的**：它比较内存区域 `s1` 和 `s2` 的前 `n` 字节。如果发现\
  \ `s1` 分别小于、匹配 `s2` 或大于 `s2`，则分别返回小于零、等于零或大于零的整数。\n*   **用法**：用于比较内存区域，例如在排序算法中。\n\
  \n*   **memscan**：它在内存中搜索字节序列，返回第一次出现的地址。\n\n```c\nvoid *memscan(void *addr, int\
  \ c, size_t size);\n```\n\n*   **目的**：它在内存中搜索字节序列，返回第一次出现的地址。\n*   **用法**：通常用于模式匹配或扫描内存以寻找特定数据结构。\n\
  \n*   **memcpy_fromio**：它从 I/O 内存区域 `src` 拷贝 `n` 字节到内存区域 `dest`。\n\n```c\nvoid *memcpy_fromio(void\
  \ *dest, const volatile void __iomem *src, size_t n);\n```\n\n*   **目的**：它从 I/O\
  \ 内存区域 `src` 拷贝 `n` 字节到内存区域 `dest`。\n*   **用法**：用于从 I/O 内存区域拷贝数据到系统内存。\n\n*   **memcpy_toio**：它从内存区域\
  \ `src` 拷贝 `n` 字节到 I/O 内存区域 `dest`。\n\n```c\nvoid *memcpy_toio(volatile void __iomem\
  \ *dest, const void *src, size_t n);\n```\n\n*   **目的**：它从内存区域 `src` 拷贝 `n` 字节到\
  \ I/O 内存区域 `dest`。\n*   **用法**：用于从系统内存拷贝数据到 I/O 内存区域。\n\n*   **memset_io**：它将 I/O\
  \ 内存区域 `dst` 中的 `count` 字节设置为指定值 `val`。\n\n```c\nvoid *memset_io(volatile void __iomem\
  \ *dst, unsigned long val, size_t count);\n```\n\n*   **目的**：它将 I/O 内存区域 `dst` 中的\
  \ `count` 字节设置为指定值 `val`。\n*   **用法**：用于将 I/O 内存区域初始化为特定值。\n\n这些函数为在内核空间高效操作内存提供了强大的工具，允许开发者对内存区域执行初始化、拷贝、比较和搜索操作。\n\
  \n`include/linux/string.h` 中定义了许多与 glibc 等效的函数。\n\n有两个函数允许在用户空间和内核空间之间反反进行数据传输：\n\
  \n*   **copy_from_user**：它用于从用户空间拷贝数据到内核空间。\n\n```c\nunsigned long copy_from_user(void\
  \ *to, const void __user *from, unsigned long n);\n```\n\n参数：\n\n*   `to`：指向内核空间中目标缓冲区的指针。\n\
  *   `from`：指向用户空间中源缓冲区的指针。\n*   `n`：要拷贝的字节数。\n*   **返回值**：返回未能拷贝的字节数。如果返回值为零，则拷贝成功。\n\
  \n*   **copy_to_user**：它用于从内核空间拷贝数据到用户空间。\n\n```c\nunsigned long copy_to_user(void\
  \ __user *to, const void *from, unsigned long n);\n```\n\n参数：\n\n*   `to`：指向用户空间中目标缓冲区的指针。\n\
  *   `from`：指向内核空间中源缓冲区的指针。\n*   `n`：要拷贝的字节数。\n*   **返回值**：返回未能拷贝的字节数。如果返回值为零，则拷贝成功。\n\
  \n以下是一个 Linux 驱动程序的示例，它使用了 DMA 之外的每种内存分配方法：\n\n```c\n#include <linux/module.h>\n\
  #include <linux/kernel.h>\n#include <linux/init.h>\n#include <linux/slab.h>\n#include\
  \ <linux/mm.h>\n\n#define DRIVER_NAME \"memory_allocation_driver\"\n\nstruct mem_alloc_driver\
  \ {\n    void *kmalloc_buffer;\n    void *vmalloc_buffer;\n    struct page *alloc_pages_buffer;\n\
  \    unsigned long get_free_pages_buffer;\n    struct dma_pool *dma_pool_buffer;\
  \ // 我们会声明这个但不会使用它，因为它不是此示例的一部分\n};\n\nstatic int __init mem_alloc_init(void) {\n\
  \    struct mem_alloc_driver *drv;\n    drv = kmalloc(sizeof(struct mem_alloc_driver),\
  \ GFP_KERNEL);\n    if (!drv)\n        return -ENOMEM;\n\n    drv->kmalloc_buffer\
  \ = kmalloc(1024, GFP_KERNEL);\n    if (!drv->kmalloc_buffer)\n        goto fail;\n\
  \n    drv->vmalloc_buffer = vmalloc(4096);\n    if (!drv->vmalloc_buffer)\n    \
  \    goto fail_kmalloc;\n\n    drv->alloc_pages_buffer = alloc_pages(GFP_KERNEL,\
  \ 2); // 分配 2 个页 (8KB)\n    if (!drv->alloc_pages_buffer)\n        goto fail_vmalloc;\n\
  \n    drv->get_free_pages_buffer = __get_free_pages(GFP_KERNEL, 2); // 分配 2 个页 (8KB)\n\
  \    if (!drv->get_free_pages_buffer)\n        goto fail_alloc_pages;\n\n    //\
  \ DMA 池初始化（在此示例中未使用）\n    // drv->dma_pool_buffer = dma_pool_create(\"example_pool\"\
  , NULL, 4096, 32, 0);\n\n    pr_info(\"Memory allocation example driver loaded successfully\\\
  n\");\n    return 0;\n\nfail_alloc_pages:\n    __free_pages(drv->alloc_pages_buffer,\
  \ 2);\nfail_vmalloc:\n    vfree(drv->vmalloc_buffer);\nfail_kmalloc:\n    kfree(drv->kmalloc_buffer);\n\
  fail:\n    return 0;\n}\n\nstatic void __exit mem_alloc_exit(void) {\n    struct\
  \ mem_alloc_driver *drv = NULL;\n    // 清理资源\n    // DMA 池清理（在此示例中未使用）\n    // if\
  \ (drv->dma_pool_buffer)\n    // dma_pool_destroy(drv->dma_pool_buffer);\n\n   \
  \ // 释放资源\n    if (drv) {\n        __free_pages(drv->alloc_pages_buffer, 2);\n \
  \       vfree(drv->vmalloc_buffer);\n        kfree(drv->kmalloc_buffer);\n    }\n\
  \n    pr_info(\"Memory allocation example driver unloaded\\n\");\n}\n\nmodule_init(mem_alloc_init);\n\
  module_exit(mem_alloc_exit);\n\nMODULE_LICENSE(\"GPL\");\nMODULE_AUTHOR(\"BPB\"\
  );\nMODULE_DESCRIPTION(\"Memory Allocation Driver\");\n```\n\n**使用 DMA 访问内存**\n\n\
  DMA 是一种允许外围设备在不涉及 CPU 的情况下与内存进行数据交换机制。在 Linux 中，DMA 常用于设备驱动以优化数据传输性能。本节将深入探讨在 Linux\
  \ 驱动中实现 DMA 的复杂细节。\n\n对于任何 DMA 传输，首先要考虑的问题是用户可能会向给定的缓冲区请求大容量传输（从 KB 到 MB 不等）。但由于虚拟内存的管理方式，该在虚拟空间中连续的区域可能由分散在整个物理内存中的一系列页组成。Linux\
  \ 期望任何超过页大小（x86 系统上为 4 KB）的传输必须由离散聚集列表（SG 列表）描述。通常，这些列表是由块 I/O（BIO）层构建的。\n\n几乎所有针对大量数据传输优化的设备都设计为使用离散聚集列表（SG\
  \ 列表）处理这些传输。虽然此列表的具体格式可能与内核提供的有所不同，但将其适配设备需求通常是简单的。\n\n\n\n\nIOMMU 是一种连接 I/O 总线（或总线层次结构）与主内存的内存管理单元。这个\
  \ MMU 与集成在 CPU 中的 IOMMU 不同。为了执行设备到主内存的传输，必须对 IOMMU 进行传输所需的地址翻译编程，其方式与 CPU MMU 的编程方式几乎相同。这样做的一个优点是，BIO\
  \ 层生成的 SG 列表（散列表列表可以被编程到 IOMMU 中，使得内存区域在总线设备上再次显示为连续。\n\n图形地址重映射表（GART）基本上类似于一个简单的输入/输出内存管理单元（IOMMU）。它由物理内存中的一个窗口和一个页列表组成。它的工作是将窗口中的物理地址映射到列表中的物理页。窗口通常很窄，只有\
  \ 128 MB 左右，且对该窗口之外物理内存的任何访问都不会被重映射。这种局限性揭示了 Linux 内核目前处理 DMA 方式的一个弱点，因为如果内存映射失败，没有任何\
  \ DMA API 会提供失败反馈。然而，GART 的重映射空间有限，一旦该空间耗尽，在某些 I/O 完成并释放映射空间之前，无法进行任何映射。\n\n有时，像\
  \ GART 一样，IOMMU 可以被编程为不在特定窗口的 I/O 总线与内存之间执行地址重映射。这被称为旁过模式（bypass mode），并非所有类型的 IOMMU\
  \ 都支持。旁过模式有时是需要的，因为重映射操作会给传输带来性能影响，因此移除 IOMMU 可能有助于增加吞吐量。\n\n然而，BIO 层假设如果存在 IOMMU\
  \ 就会使用，并此计算设备 SG 列表所需的空间。目前，还没有方法告知 BIO 层设备想要旁过 IOMMU。如果 BIO 层假设存在 IOMMU，就会出现问题；这同时也假设\
  \ SG 条目是由 IOMMU 分组的。因此，如果设备驱动程序决定旁过 IOMMU，得到的 SG 条目可能会超过设备允许的数量。\n\n这两个问题都在内核 2.6\
  \ 中得到修复。IOMMU 旁过的修复方案已经在考虑中，并且对于驱动编写者来说是不可见的，因为平台代码将选择何时执行旁过。无法映射的解决方案可能是让映射 API\
  \ 返回失败。由于此修复影响系统上所有的 DMA 驱动程序，实现过程将很缓慢。\n\n为了通信最大寻址位宽，每个通用设备都有一个名为 DMA 掩码（DMA mask）的参数，它包含一个位图，对应于设备驱动程序必须配置的可访问地址线。DMA\
  \ 位宽根据是否使用 IOMMU 有两种含义。如果存在 IOMMU，DMA 掩码仅代表可以映射的总线地址的限制，但得益于 IOMMU，设备能够访问物理内存的任何部分。如果没有\
  \ IOMMU，DMA 掩码代表了设备的根本性限制。设备无法传输到该掩码之外的物理内存区域。\n\n块层在创建 SG 列表时使用 DMA 掩码来确定是否应该返回页。Bounce（缓冲）是块层的一种，它从\
  \ DMA 掩码区域获取一个页，并将超出范围页的所有数据拷贝到其中。DMA 完成后，块层再次将其拷贝到超出范围页并释放缓冲页。这种拷贝是非常无效的，这就是为什么大多数制造商都确保其服务器型机器配备的设备没有\
  \ DMA 掩码限制。\n\nDMA 在不使用 CPU 的情况下发生，因此内核必须提供一个 API 来同步 CPU 缓存与 DMA 修改的内存。需要记住的一点是，DMA\
  \ API 仅针对内核虚拟地址更新 CPU 缓存。必须像我的文章《理解缓存》中描述的那样使用单独的 API 来更新用户空间的缓存。\n\n有时，高端总线芯片也具有缓存电路。底层概念是\
  \ CPU 写入芯片组的速度很快，而写入总线的速度相对较慢。为了优化性能，总线控制器可能会透明地缓存写入。如果对设备内存区域的任何部分执行基于内存的读取，则保证在读取操作开始之前所有之前缓存的写入已刷新到总线。\n\
  \n没有 API 可以帮助发布（posting），因此驱动编写者在读写设备内存区域时，需要记住遵守总线发布规则。一个好用的小技巧是，如果你真的想不出任何必要的读取操作来刷新悬挂的写入操作，只需从设备的总线配置空间中读取一条信息即可。\n\
  \n该 API 在内核文档目录（`Documentation/DMA-API.txt`）中有详尽记录。通用 DMA API 还有一个仅适用于外围部件接口（PCI）设备的对应项，描述在\
  \ `Documentation/DMA-mapping.txt` 中。本节的意图是提供使 DMA 正常工作所需步骤的高级概述。有关详细指令，你还应该阅读上述提到的文档。\n\
  \n开始时，当设备驱动程序初始化时，必须设置 DMA 掩码：\n\n```c\nint dma_set_mask(struct device *dev, mask\
  \ u64);\n```\n\n在前面的命令中，`dev` 是通用设备，`mask` 是你尝试设置的掩码。如果掩码被接受，函数返回 true，否则返回 false。如果系统的实际宽度较窄，掩码可能会被拒绝；例如，32\
  \ 位系统可能会拒绝 64 位掩码。因此，如果你的设备能够寻址所有 64 位，你应该先尝试 64 位掩码，如果设置 64 位掩码失败，则回退到 32 位掩码。\n\
  \n接下来，你需要分配并初始化队列。这个过程稍微超出了本章的范围，但在 `Documentation/block/` 中有记录。一旦有了队列，就需要调整两个基本设置。首先，通过以下操作允许\
  \ SG 表达到最大 own（或告诉它接受任意大小的表）：\n\n```c\nempty blk_queue_max_hw_segments(request_queue_t\
  \ *q, max_unsigned short segments);\n```\n\n其次，如果需要，按以下方式设置总最大值：\n\n```c\nempty\
  \ blk_queue_max_sectors(request_queue_t *q, unsigned short max_sectors);\n```\n\n\
  最后，必须将 DMA 掩码编程到队列中：\n\n```c\nempty blk_queue_bounce_limit(request_queue_t *q, u64\
  \ max_address);\n```\n\n通常将 `max_address` 设置为 DMA 掩码。然而，如果使用了 IOMMU，必须将 `max_address`\
  \ 设置为 `BLK_BOUNCE_ANY`，指示块层不要执行缓冲。\n\n为了让设备工作，必须有一个查询函数（参见 BIO 文档），其工作是使用命令从设备队列中循环并提取请求：\n\
  \n```c\nstructure request *elv_next_request(request_queue_t *q);\n```\n\n查询所需的映射项数可以在\
  \ `req->nr_phys_segments` 中找到。你需要以 `sizeof(struct scatterlist)` 为单位分配此大小的中间表。然后使用以下操作进行中间映射：\n\
  \n```c\nint blk_rq_map_sg(request_queue_t *q, structure query *req, struct scatterlist\
  \ *sglist);\n```\n\n这返回所使用的 SG 列表条目数。\n\n以下命令提供了块层提供的临时表，最后通过它进行映射：\n\n```c\nint\
  \ dma_map_sg(struct device *dev, struct scatterlist *sglist, int number, enum dma_data_direction\
  \ dir);\n```\n\n在前面的命令中，`count` 是返回值，`sglist` 与传入 `blk_rq_map_sg` 函数的列表相同。返回值是查询所需的实际\
  \ SG 列表条目数。\n\nSG 列表被重用，并用需要编程到设备 SG 输入中的实际输入填充。目录提供了关于如何正确管理缓存一致性的指导。\n\n\n\n它可以有三个值：\n\
  \n*   `DMA_TO_DEVICE`: 数据从内存传输到设备。\n*   `DMA_FROM_DEVICE`: 设备仅将数据传输到主内存。\n*   `DMA_BIDIRECTIONAL`:\
  \ 未提供传输方向指示。\n\n在遍历 SG 列表（散列表列表）以以下方式编程设备 SG 表时，必须使用两个宏：\n\n```\ndma_addr_t sg_dma_address(struct\
  \ scatterlist *sglist_entry);\n```\n\n此外添加：\n\n```\nint sg_dma_len(struct scatterlist\
  \ *sglist_entry);\n```\n\n上述宏分别返回总线的物理地址和每个输入段的长度。\n\n采用这种两步查询映射的原因是，`BIO` 层被设计为通用代码，不与平台层直接交互，而平台层才知道如何配置\
  \ `IOMMU`。因此，`BIO` 层唯一能计算的是 `IOMMU` 为请求创建的 SG 段数。`BIO` 层不知道 `IOMMU` 分配给这些段的总线地址，因此它必须传输所有需要映射的页物理内存地址列表。是\
  \ `dma_map_sg` 函数与平台层通信、配置 `IOMMU` 并检索物理总线地址列表。这也是为什么 `BIO` 层所需的列表元素数量可能比 `DMA API`\
  \ 返回的数量多的原因。\n\n一旦 DMA 完成，应使用以下命令删除 DMA 事务：\n\n```\nint dma_unmap_sg(struct device\
  \ *dev,\nstruct scatterlist *sglist,\nint hwcount,\nenum dma_data_direction dir);\n\
  ```\n\n在上述命令中，除 `hwcount` 外，所有参数都与传递给 `dma_map_sg` 的参数相同，`hwcount` 该函数的返回值。\n\n\
  通常，设备驱动程序在不接触传输数据的情况下运行。然而，设备驱动程序可能需要在将数据交给块设备层之前对其修改或检查。为了做到这一点，必须使用以下方法使 CPU 缓存与数据保持一致性：\n\
  \n```\nint dma_sync_sg(struct device *dev,\nstruct scatterlist *sglist,\nint hwcount,\n\
  enum dma_data_direction dir);\n```\n\n在上述命令中，参数与 `dma_unmap_sg` 相同。\n\n访问数据时最重要的因素是执行访问的时机。\n\
  \n访问数据的规则取决于 `dir`：\n\n*   `DMA_TO_DEVICE`: 必须在修改数据后、发送到设备之前调用 API。\n*   `DMA_FROM_DEVICE`:\
  \ 必须在设备返回数据后、驱动程序尝试读取之前调用 API。\n*   `DMA_BIDIRECTIONAL`: API 可能需要调用两次，一次是在修改数据后发送到设备之前，另一次是在设备处理完成后、驱动程序再次访问之前。\n\
  \n大多数设备使用邮箱（mailbox）类型的内存区域进行设备与驱动程序之间的通信。这种邮箱区域的通常特征是它永远不在设备驱动程序之外使用。使用之前的 API\
  \ 管理邮箱的一致性将非常麻烦，因此内核提供了一种方法来分配一个在设备和 CPU 之间始终保持一致的内存区域：\n\n```\nvoid *dma_alloc_coherent(struct\
  \ device *dev, size_tsize,\ndma_addr_t *physaddr, int flag);\n```\n\n该函数返回一个一致性区域的虚拟地址，该区域同样具有指向设备的总线物理地址（`physaddr`）。`flag`\
  \ 用于指定分配类型，`GFP_KERNEL` 表示分配可能会休眠以获取内存，`GFP_ATOMIC` 表示分配可能不会休眠；如果无法获取内存则可能返回 `NULL`。此\
  \ API 分配的所有内存都保证在虚拟和物理内存中都是连续的。有一个绝对要求，大小必须小于 128 KB。\n\n作为驱动程序移除的一部分，必须使用以下函数释放一致性内存区域：\n\
  \n```\nvoid dma_free_coherent(struct device *dev, size_tsize,\nvoid *virtaddr,\n\
  dma_addr_t *physaddr);\n```\n\n在上述命令中，size 是一致区域的大小，`virtaddr` 和 `physaddr` 分别是返回性区域的\
  \ CPU 虚拟地址和总线物理地址。\n\nDMA 通过将数据移动任务从 CPU 卸载到专用的 DMA 控制器实现了高效的数据传输。这对于网络接口、存储控制器和显卡等高速\
  \ I/O 设备特别别用。通过利用 DMA，CPU 可以在数据传输独立进行的同时专注于其他任务。\n\n在 Linux 内核中，DMA 通过 `DMA Engine`\
  \ 框架管理，该框架为设备驱动程序与 DMA 控制器的交互提供了统一的接口。该框架抽象了硬件特定细节，使得在不同架构之间开发可移植驱动程序变得更容易。\n\n\
  DMA 允许硬件设备在没有 CPU 协助的情况下访问系统内存。通过这种方式，设备与内存之间传输数据的速度比处理器快得多。考虑一种需要移动大量数据的情况，例如存储设备、网卡等。你可以在下面的图中看到使用\
  \ DMA 的示例：\n\nDMA 是一种协议（类似于计算机网络中的 `TCP/UDP`），其参与者包括：CPU、设备、DMA 控制器和主内存。控制器有不同的寄存器来管理\
  \ DMA 操作并在 CPU 之间传输信息。控制器还支持三种主要的编程模式：突发模式、循环夺空模式和传输模式。\n\n下图详细说明了 DMA 内存的工作原理：\n\
  \n![](img/Figure10.7.png)\n\n图 10.7：带有 NIC 的 DMA 示例\n\n为了说明如何在 Linux 驱动程序中实现 DMA，考虑为基于\
  \ PCIe 的网卡 (NIC) 开发驱动程序的假设场景。\n\n*   **设备初始化**：驱动程序在系统启动期间初始化 NIC 和关联的 DMA 控制器。这涉及探测\
  \ PCIe 总线、识别 NIC 设备以及配置 DMA 控制器。\n*   **DMA 缓冲区分配**：驱动程序为 DMA 传输分配内存缓冲区。这些缓冲区需要是\
  \ DMA 控制器和 NIC 都能访问的连续内存区域。\n*   **描述符设置**：DMA 传输通常由描述符控制，描述符包含源和目的地址、传输大小和传输方向等信息。驱动程序设置这些描述符以启动\
  \ NIC 与分配的内存缓冲区之间的 DMA 传输。\n*   **DMA 传输操作**：当需要传输或接收数据时，驱动程序通过适当的描述符编写 DMA 控制器以开始传输。随后，DMA\
  \ 控制器独立在 NIC 和内存之间移动数据，无需 CPU 干预。\n*   **中断处理**：一旦 DMA 传输完成或遇到错误，DMA 控制器会产生中断通知驱动程序。驱动程序通过处理完成的传输、更新缓冲区状态并可能启动新传输来处理这些中断。\n\
  *   **缓冲区管理**：数据传输完成后，驱动程序可能需要进一步处理或传输接收到的数据。它会相应地管理 DMA 缓冲区，根据需要回收或释放它们。\n\n在 Linux\
  \ 驱动程序中实现 DMA 时，应遵循以下考虑和实践，以确保最佳性能和可靠性：\n\n*   **缓冲区对齐**：DMA 传输通常需要硬件设定的缓冲区对齐限制。根据这些要求对缓冲区地址进行对齐非常重要，以避免性能损失或数据损坏。\n\
  *   **缓存管理**：当 DMA 涉及 CPU 缓存的内存区域时，可能会出现缓存一致性问题。应采用适当的缓存管理技术（如缓存刷新和失效）来维护数据的完整性。\n\
  \n\n\n## 第 11 章 导航 Linux 接口\n\n## 引言\n\n本章将解释不同的通信接口在 Linux 内核中是如何组织的。它补充了第 7 章\
  \ USB 驱动程序以及 `libusb`。我们将从学习通信的软件基础开始。\n\n## 结构\n\n本章涵盖了以下主题：\n\n- 双线制（2-Wire）架构\n\
  - 串行外设接口（SPI）架构\n- 串行架构\n- 外设组件部件（PCI）架构\n\n## 目标\n\n在本章结束时，你将能够理解并实现如 `I2C`、`SPI`、`SERIAL`\
  \ 以及 `PCI` 等通信协议，并理解 `RTC` 时钟。事实上，存在多种类型的总线，这些正是我们将学习的内容。\n\n## 双线制架构\n\n双线接口 (`I2C`)\
  \ 是一种用于连接低速设备的串行协议，例如微控制器、`EEPROM`、A/D 和 DA 转换器、`I/O` 接口以及嵌入式系统中类似的外设。\n\n`I2C`\
  \ 术语如下：\n\n- 发送者：向总线发送数据的设备\n- 接收者：从总线接收数据的设备\n- 主设备：产生时钟、启动通信、发送 `I2C` 命令并停止通信的设备\n\
  - 从设备：监听总线并被主设备寻的设备\n- 多主：`I2C` 可以有多个主设备，每个主设备都可以发送命令\n- 仲裁：当多个主设备需要使用总线时，确定哪个主设备可以使用它的过程\n\
  - 同步：同步两个或多个设备时钟的过程\n\n它由飞利浦发明，现在几乎所有主要的集成电路制造商在使用。每个 `I2C` 从设备都需要一个地址，该地址应始终从 NXP（原飞利浦半导体）获取。\n\
  \n![](img/11.1.png)\n\n图 11.1：主设备与从设备之间的 `I2C` 总线图\n\n## 结论\n\n`I2C` 总线之所以流行是因为它使用简单，可以有多个主设备，只需设置总线的最高速度，并且只需要两根带有上拉电阻的线即可连接几乎数量的\
  \ `I2C` 设备。\n\n`I2C` 可以使用更慢的具有通用 I/O 引脚的微控制器，因为除了一个字节的读写功能外，它们只需要产生正确的起始和停止条件。\n\
  \n\n\n\n每个从设备都有一个唯一的地址。与主设备之间的传输是串行进行的，并分为 8 位数据包。所有这些简单的要求使得 I2C 接口的实现非常简单，即使对于没有特殊\
  \ I2C 硬件控制器的廉价微控制器也是如此。你只需要 2 个空闲的 I/O 引脚一些简单的 I2C 例程来发送和接收命令。\n\nI2C 总规范描述了双向数据传输的四种工作速度分类：\n\
  \n| 模式 | 波特率 |\n| :--- | :--- |\n| 标准模式 (Sm) | 比特率高达 100 kbit/s |\n| 快速模式 (Fm) |\
  \ 比特率高达 400 kbit/s |\n| 高快速 (Fm+) | 比特率高达 1 Mbit/s |\n| 高速模式 (Hs-mode) | 比特率高达 3.4\
  \ Mbit/s |\n| 超快速模式 (UFm) | 比特率高达 5 Mbit/s |\n\n表 11.1：不同模式下的数据传输速度\n\nI2C 仅使用两根线：\n\
  \n* `SCL`（串行时钟）\n* `SDA`（串行数据）\n\n两根线都必须电阻上拉到 `+Vdd`。还有 I2C 电平转换器可以用于连接电压不同的两个 I2C\
  \ 总线。\n\n基础 I2C 通信使用 8 位或字节传输。每个 I2C 从设备都有 7 位地址，该地址在总线上必须是唯一的（图 11.2）。某些设备具有固定的\
  \ I2C 地址，而另一些设备具有几条决定 I2C 地址低位的地址线。这使得总线上的所有 I2C 设备拥有同一个 I2C 地址变得很容易。规范还允许具有 10\
  \ 位地址的设备。\n\n7 位地址表示第 7 到 1 位，而第 0 位用于指示向设备读取或写入。如果地址字节的第 0 位设置为 1，则主设备将从 I2C 从设备读取数据。\n\
  \n主设备不需要任何地址，因为它产生时钟（通过 `SCL`）并对各个 I2C 从设备进行寻址。\n\n![](img/Figure11.2.png)\n\n图\
  \ 11.2：I2C 总线上使用的帧示例\n\n在正常状态下，两条线（`SCL` 和 `SDA`）均为高。通信由主设备启动。它产生起始条件 (S)，随后是从设备的地址\
  \ (B1)。如果地址字节的第 0 位设置为 0，则主设备将向从设备写入 (B2)。否则，将从从设备读取下一个字节。一旦完成所有字节的读取或写入 (Bn)，主设备就会生成停止条件\
  \ (P)。这信号总线上的其他设备通信已完成，另一个设备可以使用该总线。\n\n大多数 I2C 设备支持重复启动条件。这意味着在通信通过停止条件结束之前，主设备可以重复起始条件带有地址字节，并将模式从写更改为读。\n\
  \n## 使用](#contents.xhtml_sc3_162a)\n\n### Linux I2C 子系统\n\n内核将 I2C 子系统（图 11.3）分为总线和外围设备。总线再次分为算法和适配器。设备再次分为驱动程序和客户端。\n\
  \n![](img/Figure11.3.png)\n\n图 11.3：GNU/Linux I2C 子系统\n\nLinux I2C 子系统是运行 Linux\
  \ 的系统与连接到系统 I2C 总线的设备交互的接口。它的设计使得运行 Linux 的系统始终是 I2C 主设备。它包含以下子部分。\n\n板上可能有多个 I2C\
  \ 总线，因此 Linux 使用 `i2c_adapter` 结构（定义在 `include/linux/i2c.h` 中）表示每个系统总线。\n\n以下是该结构中存在的重要字段：\n\
  \n* **bus number (总线编号)**：系统中的每条总线都分配有一个位于 I2C 适配器结构中的编号代表它。\n* **I2C algorithm\
  \ (I2C 算法)**：每个 I2C 总线在设备之间通过特定的通信协议工作。总线使用的算法由此字段定义。目前 I2C 总线有算法，即 `pca`、`pcf`\
  \ 和 `bitbanging`。当驱动程序请求从设备读取或写入数据时，这些算法被用于与设备通信。\n* **I2C client (I2C 客户端)**：连接到系统\
  \ I2C 总线的每个设备使用 `i2c_client` 结构（定义在 `include/linux/i2c.h` 中）表示。以下是该结构中的重要字段。\n \
  \   * **Address (地址)**：此字段由设备在总线上的地址组成。驱动程序使用此地址与设备通信。\n    * **Name (名称)**：用于匹配驱动程序与设备的设备名称。\n\
  \    * **Interrupt number (中断号)**：这是设备的中断线号。\n    * **I2C adapter (I2C 适配器)**：这是\
  \ `i2c_adapter` 结构，代表设备连接的总线。当驱动程序向总线发出写或读请求时，使用此字段来识别应该在哪个总线上执行事务，以及应该使用什么算法与设备通信。\n\
  * **I2C driver (I2C 驱动程序)**：对于系统中的每个设备，必须有一个控制它的驱动程序。对于 I2C 设备，相应的驱动由 `struct i2c_driver`（定义在\
  \ `include/linux/i2c.h` 中）表示。以下是该结构中定义的重要字段。\n    * **Probe (探测)**：这是指向驱动探测例程的函数指针，当\
  \ Linux 设备驱动程序子系统在系统中找到设备和驱动程序时会调用该函数。\n\n通常，你将实现一个的驱动结构并从中实例化所有客户端。请记住，驱动结构包含通用访问例程，并且除了包含你提供的数据的字段外，必须初始化为零。客户端结构包含设备特定信息，例如驱动模型的设备节点和其\
  \ I2C 地址。\n\n```c\nstatic struct i2c_device_id foo_idtable[] = {\n{ \"foo\", my_id_for_foo\
  \ },\n{ \"bar\", my_id_for_bar },\n{ }\n};\n\nMODULE_DEVICE_TABLE(i2c, foo_idtable);\n\
  \nstatic struct i2c_driver foo_driver = {\n.driver = {\n.name = \"foo\",\n.pm =\
  \ &foo_pm_ops, /* optional */\n},\n.id_table = foo_idtable,\n.probe_new = foo_probe,\n\
  .remove = foo_remove,\n/* 如果需要设备自动检测: */\n.class = I2C_CLASS_SOMETHING,\n.detect\
  \ = foo_detect,\n.address_list = normal_i2c,\n.shutdown = foo_shutdown, /* optional\
  \ */\n.command = foo_command, /* optional, deprecated */\n}\n```\n\n`name` 字段是驱动程序的名称且不能包含空格。它必须与模块名匹配（如果驱动程序可以编译为模块），尽管你可以使用\
  \ `MODULE_ALIAS`（在此示例中传递 \"foo\"）为模块添加另一个名称。如果驱动程序名称与模块名不匹配，模块将不会自动加载（热插/冷插）。\n\n\
  所有其他字段用于回调函数，将会在后面解释。\n\n每个客户端结构都有一个特殊的数据字段，可以指向任何结构。你应该使用它来维护设备特定数据：\n\n```c\n\
  /* 存储值 */\nvoid i2c_set_clientdata(struct i2c_client *client, void *data);\n\n/*\
  \ 获取值 */\nvoid *i2c_get_clientdata(struct i2c_client *client);\n```\n\n注意，从内核 2.6.34\
  \ 开始，你不再需要在 `Remove()` 中或 `probe()` 失败时将数据字段设置为 NULL。i2c 核心在这些情况下会自动执行此操作。这些也是内核接触该区域的时刻。\n\
  \n假设我们有一个有效的客户端结构。在某个时刻，我们需要从客户端收集信息或向客户端写入新信息。\n\n作者发现为此定义函数 `foo_read` 和 `foo_write`\
  \ 是很有用的。在某些情况下，直接调用 I2C 函数会更简单，但许多芯片具有某种寄存器值概念，可以很容易封装：\n\n```c\nint foo_read_value(struct\
  \ i2c_client *client, u8 reg)\n{\nif (reg < 0x10) /* 字节大小寄存器 */\nreturn i2c_smbus_read_byte_data(client,\
  \ reg);\nelse /* 字字大小寄存器 */\nreturn i2c_smbus_read_word_data(client, reg);\n}\n\n\
  int foo_write_value(struct i2c_client *client, u8 reg, u16 value)\n{\nif (reg ==\
  \ 0x10) /* 无法写入 - 驱动错误! */\nreturn -EINVAL;\nelse if (reg < 0x10) /* 字节大小寄存器 */\n\
  return i2c_smbus_write_byte_data(client, reg, value);\n}\n```\n\n\n\n\n\n```c\n\
  else /* word-sized register */\n\nreturn i2c_smbus_write_word_data(client, reg,\
  \ value);\n\n}\n```\n\n当然，上面的函数骨架不应直接复制，而必须根据你的用例进行修改和适配。\n\nLinux I2C 栈最初是为了支持访问\
  \ PC 主板上的硬件监控芯片而编写的，因此，它集成了一些对于 SMBus（以及 PC）而言比 I2C 更合适的假设。这些假设之一是，大多数适配器和设备驱动程序都支持\
  \ `SMBUS_QUICK` 协议来检测设备是否存在。另一个原因是，设备及其驱动程序仅通过此类探测原语（probe primitives）就可以完成充分配置。\n\
  \n随着 Linux 及其 I2C 栈在嵌入式系统和如 DVB 适配器等复杂组件中得到更广泛的使用，这些假设变得越来越成问题。发出中断的 I2C 设备驱动程序需要更多（且不同）的配置信息，处理无法通过协议探测区分的变体或需要板级特定信息才能正确运行的芯片驱动程序也是如此。\n\
  \n系统基础设施（通常是板级特定的初始化代码或引导固件）指示了现有的 I2C 设备。例如，内核或引导加载程序中可能有一个表，识别 I2C 设备并将它们与有关 IRQ\
  \ 和其他布线特性、芯片类型等的板级特定配置信息关联。这可以用于为每个 I2C 设备创建 `i2c_client` 对象。\n\n使用这种绑定模型的 I2C 设备驱动程序的工作方式与\
  \ Linux 中任何其他类型的驱动程序一样：它们提供一个 `probe()` 方法来绑定这些设备，并提供一个 `remove()` 方法来取消绑定：\n\n\
  ```c\nstatic int foo_probe(struct i2c_client *client);\n\nstatic void foo_remove(struct\
  \ i2c_client *client);\n```\n\n记住 `i2c_driver` 并不会创建这些客户端描述符。句柄可以在 `foo_probe()`\
  \ 中使用。如果 `foo_probe()` 成功（返回零，而不是负状态码），它可以保存该句柄并一直使用它直到 `foo_remove()` 返回。大多数 Linux\
  \ 驱动程序都使用这种绑定模型。\n\n当 `table_id` 字段中的某个条目与设备名称匹配时，会调用探测函数。如果探测函数需要此输入，可以使用以下方式获取：\n\
  \n```c\nconst struct i2c_device_id *id = i2c_match_id(foo_idtable, client);\n```\n\
  \n如果你确定某个 I2C 设备连接到给定的 I2C 总线，你可以通过简单填充 `i2c_board_info` 结构体的设备地址和驱动名称，并调用 `i2c_new_client_device()`\
  \ 来实例化该设备。这将创建设备，然后驱动内核将负责找到正确的驱动程序并调用其 `probe()` 方法。如果驱动程序支持不同的设备类型，可以使用 `type`\
  \ 字段指定所需的类型。如有必要，还可以指定 IRQ 和平台数据。\n\n有时，你知道某个设备连接到给定的 I2C 总线，但不知道它使用的精确地址。这种情况发生在例如\
  \ TV 适配器上，同一个驱动程序支持几十种略有不同的型号，且 I2C 设备地址会在不同型号之间变化。在这种情况下，你可以使用 `i2c_new_scanned_device()`\
  \ 变体，它与 `i2c_new_client_device()` 类似，但它需要一个额外的可能的 I2C 地址列表进行探测。系统会列表中第一个响应的地址创建一个设备。如果你预计地址范围内存在多个设备，只需相应多次调用\
  \ `i2c_new_scanned_device()` 即可。\n\n对 `i2c_new_client_device()` 或 `i2c_new_scanned_device()`\
  \ 的调用通常发生在 I2C 总线驱动程序中。你可能想要保存返回的 `i2c_client` 引用供以后使用。\n\n设备检测机制有几个缺点。你需要一种可靠的方法来识别支持的设备（通常使用专用的设备特定\
  \ ID 寄存器），否则会发生检测错误，很快就会变得糟糕。记住，I2C 协议并不包含任何检测给定地址处芯片存在的标准方法，更不用说识别设备的标准方法了。更糟糕的是总线传输缺乏语义，意味着同一次传输可能被一个芯片视为读取操作，而被另一个芯片视为写入操作。由于这些原因，设备检测被认为是一种遗留机制，不应在新代码中使用。\n\
  \n使用使用 `i2c_new_client_device()` 或 `i2c_new_scanned_device()` 创建的每个 I2C 设备都可以通过调用\
  \ `i2c_unregister_device()` 来注销。如果你不显式调用它，它将在底层 I2C 总线本身移除之前自动调用，因为在设备驱动模型中，设备的生命周期不能超过其父设备。\n\
  \n下面的代码显示了一个与 I2C 设备通信的几乎完整的驱动程序：\n\n* 包含 Linux 内核模块开发所需的头文件，例如模块管理 (`module.h`）、初始化\
  \ (`init.h`）、内存管理 (`slab.h`）、I2C 总线通信 (`i2c.h`）、延迟函数 (`delay.h`）以及内核相关函数 (`kernel.h`）：\n\
  \n```c\n#include <linux/module.h>\n#include <linux/init.h>\n#include <linux/slab.h>\n\
  #include <linux/i2c.h>\n#include <linux/delay.h>\n#include <linux/kernel.h>\n```\n\
  \n* 为 I2C 总线号（`I2C_BUS_AVAILABLE`）、从设备名称和驱动名称（`SLAVE_DEVICE_NAME`）以及 SSD1306 OLED\
  \ 显示屏的 I2C 地址（`SSD1306_SLAVE_ADDR`）定义常量：\n\n```c\n#define I2C_BUS_AVAILABLE ( 11\
  \ ) // 我们创建的 I2C 总线\n#define SLAVE_DEVICE_NAME ( \"BPB_DEVICE\" ) // 设备和驱动名称\n#define\
  \ SSD1306_SLAVE_ADDR ( 0x3C )\n```\n\n* 指向 `i2c_adapter` 和 `i2c_client` 结构的静态指针，分别用于处理\
  \ I2C 适配器和 OLED 显示客户端设备。它们初始化为 `NULL`：\n\n```c\nstatic struct i2c_adapter *etx_i2c_adapter\
  \ = NULL;\nstatic struct i2c_client *etx_i2c_client_oled = NULL;\n```\n\n* 定义函数\
  \ `I2C_Write` 向 I2C 客户端设备发送数据。它接收一个缓冲区 `buf` 和其长度 `len` 作为参数。在函数内部，调用 `i2c_master_send`\
  \ 函数执行实际的数据传输。函数的返回值表示操作成功或失败：\n\n```c\nstatic int I2C_Write(unsigned char *buf,\
  \ unsigned int len)\n{\n    /*\n     * Sending Start condition, Slave address with\
  \ R/W bit,\n     * ACK/NACK and Stop condtions will be handled internally.\n   \
  \  */\n    int ret = i2c_master_send(etx_i2c_client_oled, buf, len);\n    return\
  \ ret;\n}\n```\n\n* 定义函数 `I2C_Read` 从 I2C 客户端设备读取数据。它接收缓冲区 `out_buf` 和其长度 `len`\
  \ 作为参数。在函数内部，调用 `i2c_master_recv` 函数执行实际的数据接收。函数的返回值表示操作成功或失败：\n\n```c\nstatic int\
  \ I2C_Read(unsigned char *out_buf, unsigned int len)\n{\n    /*\n     * Sending\
  \ Start condition, Slave address with R/W bit,\n     * ACK/NACK and Stop condtions\
  \ will be handled internally.\n     */\n    int ret = i2c_master_recv(etx_i2c_client_oled,\
  \ out_buf, len);\n    return ret;\n}\n```\n\n* 定义函数 `SSD1306_Write` 向 SSD1306 OLED\
  \ 显示屏写入数据或命令。它接收一个布尔参数 `is_cmd`，用于判断提供的数据是否为命令。在函数内部，根据 `is_cmd` 的值构造一个控制字节，然后使用\
  \ `I2C_Write` 函数将数据发送到 OLED 显示屏：\n\n```c\nstatic void SSD1306_Write(bool is_cmd,\
  \ unsigned char data)\n{\n    unsigned char buf[2] = {0};\n    int ret;\n    if(\
  \ is_cmd == true )\n    {\n        buf[0] = 0x00;\n    }\n    else\n    {\n    \
  \    buf[0] = 0x40;\n    }\n    buf[1] = data;\n    ret = I2C_Write(buf, 2);\n}\n\
  ```\n\n\n\n\n\n*   定义了 `SSD1306_DisplayInit` 函数，该函数用于初始化 `SSD1306` OLED 显示。它通过发送一系列命令来配置\
  \ OLED 显示的各种参数和设置，例如关闭显示、设置时钟分频比、设置复用率、设置显示偏移、启用电荷泵、设置内存映射模式、设置对比度等。最后，它在正常模式下开启显示并返回\
  \ `0` 表示初始化成功：\n\n```c\nstatic int SSD1306_DisplayInit(void)\n{\nmsleep(100); //\
  \ delay\n/* Commands to initialize the SSD_1306 OLED Display */\nSSD1306_Write(true,\
  \ 0xAE); // Entire Display OFF\nSSD1306_Write(true, 0xD5); // Set Display Clock\
  \ Divide Ratio and Oscillator Frequency\nSSD1306_Write(true, 0x80); // Default Setting\
  \ for Display Clock Divide Ratio and Oscillator Frequency that is recommended\n\
  SSD1306_Write(true, 0xA8); // Set Multiplex Ratio\nSSD1306_Write(true, 0x3F); //\
  \ 64 COM lines\nSSD1306_Write(true, 0xD3); // Set display offset\nSSD1306_Write(true,\
  \ 0x00); // 0 offset\nSSD1306_Write(true, 0x40); // Set first line as the start\
  \ line of the display\nSSD1306_Write(true, 0x8D); // Charge pump\nSSD1306_Write(true,\
  \ 0x14); // Enable charge dump during display on\nSSD1306_Write(true, 0x20); //\
  \ Set memory addressing mode\nSSD1306_Write(true, 0x00); // Horizontal addressing\
  \ mode\nSSD1306_Write(true, 0xA1); // Set segment remap with column address 127\
  \ mapped to segment 0\nSSD1306_Write(true, 0xC8); // Set com output scan direction,\
  \ scan from com63 to com 0\nSSD1306_Write(true, 0xDA); // Set com pins hardware\
  \ configuration\nSSD1306_Write(true, 0x12); // Alternative com pin configuration,\
  \ disable com left/right remap\nSSD1306_Write(true, 0x81); // Set contrast control\n\
  SSD1306_Write(true, 0x80); // Set Contrast to 128\nSSD1306_Write(true, 0xD9); //\
  \ Set pre-charge period\nSSD1306_Write(true, 0xF1); // Phase 1 period of 15 DCLK,\
  \ Phase 2 period of 1 DCLK\nSSD1306_Write(true, 0xDB); // Set Vcomh deselect level\n\
  SSD1306_Write(true, 0x20); // Vcomh deselect level ~ 0.77 Vcc\nSSD1306_Write(true,\
  \ 0xA4); // Entire display ON, resume to RAM content display\nSSD1306_Write(true,\
  \ 0xA6); // Set Display in Normal Mode, 1 = ON, 0 = OFF\nSSD1306_Write(true, 0x2E);\
  \ // Deactivate scroll\nSSD1306_Write(true, 0xAF); // Display ON in normal mode\n\
  return 0;\n}\n```\n\n*   定义了 `SSD1306_Fill` 函数，该函数用指定的数据填充整个 `SSD1306` OLED 显示。它计算显示器中的总像素数（128\
  \ 列 x 8 页 x 每页 8 位），然后遍历每个像素，使用 `SSD1306_Write` 函数向显示器写入数据，其中 `false` 表示数据传输：\n\n\
  ```c\nstatic void SSD1306_Fill(unsigned char data)\n{\nunsigned int total = 128\
  \ * 8; // 8 pages x 128 segments x 8 bits of data\nunsigned int i = 0;\nfor(i =\
  \ 0; i < total; i++)\n{\nSSD1306_Write(false, data);\n}\n}\n```\n\n*   定义了 OLED\
  \ 驱动程序的探测函数 (`etx_oled_probe`)。当在 I2C 总线上检测到新设备时，会调用此函数。它使用 `SSD1306_DisplayInit`\
  \ 初始化 OLED 显示，并使用 `SSD1306_Fill` 用指定的数据模式填充显示。然后它向内核日志打印一条消息以表示探测成功，并返回 `0` 表示成功：\n\
  \n```c\nstatic int etx_oled_probe(struct i2c_client *client,\nconst struct i2c_device_id\
  \ *id)\n{\nSSD1306_DisplayInit();\nSSD1306_Fill(0xFF);\npr_info(\"OLED Probed!!!\\\
  n\");\nreturn 0;\n}\n```\n\n*   定义了 OLED 驱动程序的移除函数 (`etx_oled_remove`)。当设备被移除或驱动程序卸载时，会调用此函数。它简单地向内核日志打印一条消息，表示\
  \ OLED 显示已移除，并返回 `0` 表示成功：\n\n```c\nstatic int etx_oled_remove(struct i2c_client\
  \ *client)\n{\npr_info(\"OLED Removed!!!\\n\");\nreturn 0;\n}\n```\n\n*   定义了用于\
  \ I2C 设备匹配的 `etx_oled_id` 数组。它包含了驱动程序支持的设备 ID。\n\n*   定义了用于 OLED 驱动的 `etx_oled_driver`\
  \ 结构体。它包含了驱动名称、所有者、探测和移除函数以及 ID 表。\n\n*   定义了用于 `SSD1306` OLED 显示的 `oled_board_info`\
  \ 结构体。它包含了 I2C 设备名称和兼容 ID。\n\n\n\n\n\nSPI 的核心思想是每个设备都有一个位移寄存器，可以使用它发送或接收一个字节的数据。这两个位移寄存器以环形连接，其中一个的输出连接另一个的输入，反之亦然。其中一个设备（主设备）控制公共时钟信号，确保每个寄存器在移入一位的同时，另一个寄存器恰好移出一个位（反之亦然）：\n\
  \n![](img/Figure11.4.png)\n\n图 11.4: 互连的两个位移寄存器\n\nSPI 至少需要四根线。然而，最近的一些设备还支持 3 引模式和\
  \ 4 引模式：\n\n* `MOSI`: 主输出，从机输入\n* `MISO`: 主输入，从机输出\n* `SCLK`: 串行时钟\n* `SS/CS/CE`:\
  \ 片选选择/芯片选择/芯片激活\n\n下图详细说明了使用 SPI 总线的空模块和多个从机之间的电子原理图：\n\n![](img/Figure11.5.png)\n\
  \n图 11.5: 主机与从机之间的 SPI 总线框图\n\n此处列出的 SPI 总线特性为声明 SPI 总线和设备提供了一个通用接口，并根据标准 Linux\
  \ 驱动模型对其进行管理，以及执行输入/输出操作。目前，仅支持“主”端接口，即 Linux 与 SPI 设备通信，而本身不实现此类设备（支持 SPI 从机实现的接口将是不同的）。\n\
  \n编程接口围绕两种类型的驱动程序和两种类型的设备构建。“控制器驱动程序”抽象了控制器硬件，它可以简单到只有一组 GPIO 引脚，也可以复杂到连接到 SPI 位移寄存器另一端两个\
  \ DMA 引擎的一对 FIFO（从而实现吞吐量最大化）。此类驱动程序桥接了它们所处的总线（通常是平台总线）与 SPI 之间，并将其设备的 SPI 侧暴露为 `spi_master`\
  \ 结构。SPI 设备是该主设备的子设备，由 `spi_device` 结构表示，并由 `spi_board_info` 结构描述符组成，这些符通常由特定板卡的初始化代码提供。`spi_driver`\
  \ 结构被称为“协议驱动程序”，并通过普通的驱动模板调用与 `spi_device` 链接。\n\nI/O 模型是一组队列消息。协议驱动程序提交一个或多个 `struct\
  \ spi_message` 对象，这些对象会被异步处理并完成的。（尽管确实存在同步封装器。）消息由一个或多个 `spi_transfer` 结构体对象构建，每个对象封装了一个全双工\
  \ SPI 。各种协议调优选项是必要的，因为不同的芯片对于如何使用 SPI 传输的位采用完全不同的策略。\n\n### SPI 传输统计信息：\n\n```\n\
  struct spi_statistics {\nspinlock_t lock;\nunsigned long messages;\nunsigned long\
  \ transfers;\nunsigned long errors;\nunsigned long timedout;\nunsigned long spi_sync;\n\
  unsigned long spi_sync_immediate;\nunsigned long spi_async;\nunsigned long long\
  \ bytes;\nunsigned long long bytes_rx;\nunsigned long long bytes_tx;\n#define SPI_STATISTICS_HISTO_SIZE\
  \ 17\nunsigned long transfer_bytes_histo;\nunsigned long transfers_split_maxsize;\n\
  };\n```\n\nLinux 中的 SPI 设备驱动主要由 SPI 子系统管理，分为三个部分：\n\n* SPI 核心：SPI 核心提供了用于定义基本数据结构、注册以及处理\
  \ SPI 控制器驱动和设备驱动回滚的 API。它是一个与平台无关硬件层，隐藏了向下物理总线控制器的差异，并定义了统一的访问策略和接口。\n\n它向上提供统一的接口。因此，SPI\
  \ 设备驱动可以通过 SPI 总线控制器发送和接收数据。在 Linux 内核中，主要的 SPI 代码位于 `kernel/drivers/spi/spi.c`。\n\
  \n* SPI 控制器驱动：SPI 控制器驱动是特定平台的驱动。因此，每个 SoC 制造商都必须为其平台或 MCU 编写此驱动。这些 SPI 控制器驱动可以集成到系统级处理器中，并通常支持主、从机角色。\n\
  \n这些驱动程序接触硬件寄存器并可能使用 DMA，或者它们可能是 GPIO 位带器（bit bangers），只需要 GPIO 引脚。它们的职责是为系统中的每个\
  \ SPI 总线实现相应的读写方法。\n\n物理上，每个 SPI 控制器可以连接多个 SPI 从设备。当系统启动时，首先加载 SPI 控制器驱动。控制器驱动用于支持读写特定的\
  \ SPI 总线。因此，此 SPI 控制器驱动类似于 I2C 适配器/总线驱动。\n\n你可以在 `kernel/drivers/spi/` 查看所有的 SPI\
  \ 控制器驱动。\n\n* SPI 协议驱动：每个 SPI 总线控制器都可以连接到多个从设备。此驱动用于通过 SPI 总线与特定设备通信。这类似于 I2C 客户端驱动。\n\
  \n### 使用\n\n为了详细说明，让我们来看使用 SPI 消息的驱动示例：\n\n* 包含 Linux 内核模块开发所需的头文件，例如模块管理（`module.h`）、初始化（`init.h`）、SPI\
  \ 使用（`spi.h`）：\n\n```\n#include <linux/module.h>\n#include <linux/init.h>\n#include\
  \ <linux/spi/spi.h>\n#include <linux/delay.h>\n#include <linux/kernel.h>\n```\n\n\
  * 为 SPI 总线号、片选线和总线速度定义宏：\n\n```\n#define SPI_BUS 0\n#define SPI_BUS_CS1 0\n#define\
  \ SPI_BUS_SPEED 1000000\n```\n\n* 定义 `spi_device` 结构的指针，表示 SPI 设备：\n\n```c\nstatic\
  \ struct spi_device *spi_device;\n```\n\n* 定义 probe 函数，该函数在检测到 SPI 设备时被调用。设置 SPI\
  \ 设备参数，使用 `spi_setup` 配置设备，并执行简单的读/写操作以验证通信。将消息打印到内核日志，成功时返回 0，失败时返回错误码：\n\n```c\n\
  static int spi_device_probe(struct spi_device *spi)\n{\n  int ret;\n  u8 tx[] =\
  \ {0xAA};\n  u8 rx[ARRAY_SIZE(tx)];\n  spi->max_speed_hz = SPI_BUS_SPEED;\n  spi->mode\
  \ = SPI_MODE_0;\n  spi->bits_per_word = 8;\n  ret = spi_setup(spi);\n  if (ret)\
  \ {\n    pr_err(\"spi_setup failed\\n\");\n    return ret;\n  }\n  ret = spi_write_then_read(spi,\
  \ tx, ARRAY_SIZE(tx), rx, ARRAY_SIZE(rx));\n  if (ret) {\n    pr_err(\"spi_write_then_read\
  \ failed\\n\");\n    return ret;\n  }\n  pr_info(\"SPI device probed successfully\\\
  n\");\n  return 0;\n}\n```\n\n* 定义 remove 函数，该函数在 SPI 设备移除时被调用：\n\n```c\nstatic\
  \ int spi_device_remove(struct spi_device *spi)\n{\n  pr_info(\"SPI device removed\\\
  n\");\n  return 0;\n}\n```\n\n* 定义设备树 ID 数组，指定兼容的设备：\n\n```c\nstatic const struct\
  \ of_device_id spi_device_dt_ids[] = {\n  { .compatible = \"spi_device\" },\n  {\
  \ }\n};\n```\n\n* `MODULE_DEVICE_TABLE` 宏将此数组注册到内核：\n\n```\nMODULE_DEVICE_TABLE(of,\
  \ spi_device_dt_ids);\n```\n\n* 定义 SPI 驱动结构，指定驱动名称、设备树表、probe 函数和 remove 函数：\n\n\
  ```c\nstatic struct spi_driver spi_device_driver = {\n  .driver = {\n    .name =\
  \ \"spi_device\",\n    .of_match_table = spi_device_dt_ids,\n  },\n  .probe = spi_device_probe,\n\
  \  .remove = spi_device_remove,\n};\n```\n\n* 初始化驱动：\n\n```c\nstatic int __init\
  \ spi_device_init(void)\n{\n  int ret;\n  struct spi_master *master;\n  master =\
  \ spi_busnum_to_master(SPI_BUS);\n  if (!master) {\n    pr_err(\"spi_busnum_to_master\
  \ failed\\n\");\n    return -ENODEV;\n  }\n  spi_device = spi_alloc_device(master);\n\
  \  if (!spi_device) {\n    pr_err(\"spi_alloc_device failed\\n\");\n    return -ENOMEM;\n\
  \  }\n  spi_device->chip_select = SPI_BUS_CS1;\n  spi_device->max_speed_hz = SPI_BUS_SPEED;\n\
  \  spi_device->mode = SPI_MODE_0;\n  spi_device->bits_per_word = 8;\n  spi_device->dev.platform_data\
  \ = NULL;\n  strlcpy(spi_device->modalias, \"spi_device\", SPI_NAME_SIZE);\n  ret\
  \ = spi_add_device(spi_device);\n  if (ret) {\n    pr_err(\"spi_add_device failed\\\
  n\");\n    spi_dev_put(spi_device);\n    return ret;\n  }\n  ret = spi_register_driver(&spi_device_driver);\n\
  \  if (ret) {\n    pr_err(\"spi_register_driver failed\\n\");\n    spi_unregister_device(spi_device);\n\
  \    return ret;\n  }\n  return ret;\n}\n```\n\n\n\n\n\n```\npr_info(\"SPI device\
  \ driver registered\\n\");\n\nreturn 0;\n\n}\n```\n\n*   在退出前清理驱动：\n\n```c\nstatic\
  \ void __exit spi_device_exit(void)\n{\n    spi_unregister_driver(&spi_device_driver);\n\
  \    spi_unregister_device(spi_device);\n    pr_info(\"SPI device driver unregistered\\\
  n\");\n}\n```\n\n# 串口架构\n\n为了正确地集成到 Linux 系统中，串口端口必须能够让用户态应用程序以 TTY 设备的形式可见。因此，串口驱动程序必须是内核\
  \ TTY 子系统的一部分。在 2.6 版本之前，串口驱动程序直接实现在 TTY 内核之后，这涉及大量的复杂性。从 2.6 版本开始，一种特殊的 TTY 驱动程序\
  \ `serial_core` 促进了驱动程序的开发；请参见 `include/linux/serial_core.h` 中 `Serial_core` 的主要定义。\n\
  \n行规律（line discipline）处理与 tty 驱动程序交换的数据。对于普通串口，使用 `N_TTY`。\n\n![](img/Figure11.6.png)\n\
  \n图 11.6：Linux 串口架构\n\n为了正确地集成到 Linux 系统中，串口端口必须能够让用户态应用程序以 TTY 设备的形式可见。因此，串口驱动程序必须是内核\
  \ TTY 子系统的一部分。在 2.6 版本之前，串口驱动程序直接实现在 TTY 内核之后，这涉及大量的复杂性。从 2.6 版本开始，一种特殊的 TTY 驱动程序\
  \ `serial_core` 促进了驱动程序的开发；请参见 `include/linux/serial_core.h` 中 `Serial_core` 的主要定义。\n\
  \n行规律处理与 tty 驱动程序交换的数据。对于普通串口，通常使用 `N_TTY`。\n\n名为 `uart_driver` 的数据结构代表一个驱动程序：\n\
  \n*   每个驱动程序一个唯一实例\n*   `uart_register_driver()` 和 `uart_unregister_driver()`\n\
  *   来自 `drivers/serial/atmel_serial.c` 的示例代码：\n\n```c\nstatic struct uart_driver\
  \ atmel_uart = {\n    .owner = THIS_MODULE,\n    .driver_name = \"atmel_serial\"\
  ,\n    .dev_name = ATMEL_DEVICENAME,\n    .major = SERIAL_ATMEL_MAJOR,\n    .minor\
  \ = MINOR_START,\n    .nr = ATMEL_MAX_UART,\n    .cons = ATMEL_CONSOLE_DEVICE,\n\
  };\n\nstatic struct platform_driver atmel_serial_driver = {\n    .probe = atmel_serial_probe,\n\
  \    .remove = atmel_serial_remove,\n    .driver = {\n        .name = \"atmel_usart_serial\"\
  ,\n        .of_match_table = of_match_ptr(atmel_serial_dt_ids),\n        .pm = pm_ptr(&atmel_serial_pm_ops),\n\
  \    },\n};\n```\n\n名为 `uart_port` 的数据结构代表一个端口：\n\n*   每个端口一个实例（每个驱动程序可能有多个）\n*\
  \   `uart_add_one_port()` 和 `uart_remove_one_port()`\n*   可以静态或动态地分配\n*   通常在 probe\
  \ 期间 () 保存，在 delete 期间 () 不进行保存\n*   最重要的区域：\n    *   `iotype`: I/O 访问类型，内存映射设备通常为\
  \ `UPIO_MEM`\n    *   `mapbase`: 寄存器的物理地址\n    *   `irq`: IRQ 通道号\n    *   `membase`:\
  \ 寄存器的虚拟地址\n    *   `uartclk`: 时钟频率\n    *   `ops`: 操作指针\n    *   `dev`: 指向设备的指针（`platform_device`\
  \ 或其他）\n\n名为 `uart_ops` 的数据结构包含指向操作的指针：\n\n*   通过 `uart_port` 的 `ops` 字段链接\n*  \
  \ 重要操作：\n    *   `tx_empty()`：指示发送 FIFO 是否为空\n    *   `set_mctrl()` 和 `get_mctrl()`：允许你设置和获取调制解器控制参数（RTS,\
  \ DTR, LOOP 等）\n    *   `start_tx()` 和 `stop_tx()`：开始和停止传输\n    *   `stop_rx()`：停止接收\n\
  \    *   `startup()` 和 `shutdown()`：在端口打开/关闭时调用\n        *   `request_port()` 和\
  \ `release_port()`：请求/释放 I/O 或内存区域\n        *   `set_termios()`：修改端口参数\n*   请参见\
  \ `Documentation/serial/driver` 中的详细描述\n\n`start_tx()` 方法应该开始通过串口传输字符。要传输的字符存储在循环缓冲区中，该缓冲区由结构体\
  \ `uart_circ` 实现。它包含：\n\n*   `buf[]`: 字符缓冲区\n*   `tail`: 下一个要传输字符的索引。传输后必须使用 `tail\
  \ & (UART_XMIT_SIZE - 1)` 更新 tail\n\n在 `uart_circ` 上有一些工具函数：\n\n*   `uart_circ_empty()`：指示循环缓冲区是否为空\n\
  *   `uart_circ_chars_ending()`：返回剩余待传输的字符数\n\n通过 `uart_port` 指针，可以使用 `port->status->xmit`\
  \ 访问该结构。\n\n在接收时（通常在中断处理程序中），驱动程序必须：\n\n*   增加 `port->icount.rx`\n*   如果接收到 BRK，调用\
  \ `uart_handle_break()`，如果返回 `TRUE`，则忽略并处理下一个字符\n*   如果发生错误，根据错误类型增加 `port->icount.parity`、`port->icount.frame`、`port->icount.overrun`\n\
  *   使用接收到的字符调用 `uart_handle_sys_char()`，如果返回 `TRUE`，则移动到下一个字符\n*   调用 `uart_insert_char()`\
  \ 并传入接收到的字符和状态；如果一切正常，状态为 `TTY_NORMAL`，错误情况下为 `TTY_BREAK`、`TTY_PARITY`、`TTY_FRAME`。\n\
  *   调用 `tty_flip_buffer_push()` 将数据推送到 TTY 层\n\n# 使用\n\n为了详细介绍，让我们来看使用串口接口的驱动程序示例：\n\
  \n*   包含 Linux 内核模块开发所需的头文件，例如模块管理 (`module.h`）、初始化 (`init.h`）、串口使用 (`serial_core.h`、`serial_reg.h`）以及\
  \ tty：\n\n```c\n#include <linux/module.h>\n#include <linux/init.h>\n#include <linux/serial_core.h>\n\
  #include <linux/serial_reg.h>\n#include <linux/tty.h>\n#include <linux/tty_flip.h>\n\
  #include <linux/platform_device.h>\n```\n\n*   为驱动程序名称、UART 基地址（COM1 的示例地址）和 IRQ\
  \ 号（COM1 的示例 IRQ 号）定义宏：\n\n```c\n#define DRIVER_NAME \"simple_serial\"\n#define\
  \ UART_BASE 0x3F8 // COM1 的基地址（示例地址）\n#define UART_IRQ 4 // COM1 的 IRQ 号（示例 IRQ\
  \ 号）\n```\n\n*   定义一个包含 `uart_port` 的结构体 (`simple_serial_port`)），代表 UART 端口：\n\n\
  ```c\nstruct simple_serial_port {\n    struct uart_port port;\n};\n```\n\n*   声明\
  \ `simple_serial_port` 结构的静态实例，代表由该驱动程序管理的串口：\n\n```c\nstatic struct simple_serial_port\
  \ simple_port;\n```\n\n*   定义 `simple_serial_startup` 函数，该函数被调用以启动串口。它打印内核日志并返回\
  \ `0`。实际初始化步骤应在此处添加：\n\n```c\nstatic int simple_serial_startup(struct uart_port\
  \ *port)\n{\n    pr_info(\"%s: starting up\\n\", DRIVER_NAME);\n    // 启动串口的初始化步骤（例如启用中断）\n\
  \    return 0;\n}\n```\n\n*   定义 `simple_serial_shutdown` 函数，它被调用以关闭串口。它打印内核日志。实际清理步骤应在此处添加：\n\
  \n```c\nstatic void simple_serial_shutdown(struct uart_port *port)\n{\n    pr_info(\"\
  %s: shutting down\\n\", DRIVER_NAME);\n    // 关闭串口的清理步骤\n}\n```\n\n*   定义 `simple_serial_tx_empty`\
  \ 函数，它检查发送缓冲区是否为空并返回状态：\n\n```c\nstatic unsigned int simple_serial_tx_empty(struct\
  \ uart_port *port)\n{\n    // 检查发送缓冲区是否为空\n    return UART_LSR_THRE; // 发送寄存器空\n\
  }\n```\n\n*   定义 `simple_serial_set_mctrl` 函数，它设置调制解器控制线。实际实现应在此处添加：\n\n```c\nstatic\
  \ void simple_serial_set_mctrl(struct uart_port *port, unsigned int mctrl)\n{\n\
  \    // 设置调制解器控制线\n}\n```\n\n*   定义 `simple_serial_get_mctrl` 函数，它获取调制解器控制线状态：\n\
  \n```c\nstatic unsigned int simple_serial_get_mctrl(struct uart_port *port)\n{\n\
  \    // 获取调制解器控制线\n    return 0;\n}\n```\n\n*   定义 `simple_serial_stop_tx` 函数，它停止数据传输并打印内核日志。实际实现应在此处添加：\n\
  \n```c\nstatic void simple_serial_stop_tx(struct uart_port *port)\n{\n    pr_info(\"\
  %s: stopping TX\\n\", DRIVER_NAME);\n    // 停止数据传输\n}\n```\n\n\n\n\n\n- 定义了 `simple_serial_start_tx`\
  \ 函数，该函数开始传输数据并向内核日志打印消息。实际实现应添加在指示处：\n\n```c\nstatic void simple_serial_start_tx(struct\
  \ uart_port *port)\n{\n  pr_info(\"%s: starting TX\\n\", DRIVER_NAME);\n  // Start\
  \ transmitting data\n}\n```\n\n- 定义了 `simple_serial_stop_rx` 函数，该函数停止接收数据并向内核日志打印消息。实际实现应添加在指示处：\n\
  \n```c\nstatic void simple_serial_stop_rx(struct uart_port *port)\n{\n  pr_info(\"\
  %s: stopping RX\\n\", DRIVER_NAME);\n  // Stop receiving data\n}\n```\n\n- 定义了 `simple_serial_enable_ms`\
  \ 函数，该函数用于调制解解器状态中断。实际实现应添加在指示处：\n\n```c\nstatic void simple_serial_enable_ms(struct\
  \ uart_port *port)\n{\n  // Enable modem status interrupts\n}\n```\n\n- 定义了 `simple_serial_handle_irq`\
  \ 函数，该函数处理串口的中断并向内核日志打印消息。实际实现应添加在指示处：\n\n```c\nstatic void simple_serial_handle_irq(struct\
  \ uart_port *port)\n{\n  pr_info(\"%s: handling IRQ\\n\", DRIVER_NAME);\n  // Handle\
  \ interrupts for the serial port\n}\n```\n\n- 定义了一个 `uart_ops` 结构体 (`simple_serial_ops`)，它将\
  \ UART 操作映射到之前代码块中实现的函数：\n\n```c\nstatic const struct uart_ops simple_serial_ops\
  \ = {\n  .startup = simple_serial_startup,\n  .shutdown = simple_serial_shutdown,\n\
  \  .tx_empty = simple_serial_tx_empty,\n  .set_mctrl = simple_serial_set_mctrl,\n\
  \  .get_mctrl = simple_serial_get_mctrl,\n  .stop_tx = simple_serial_stop_tx,\n\
  \  .start_tx = simple_serial_start_tx,\n  .stop_rx = simple_serial_stop_rx,\n  .enable_ms\
  \ = simple_serial_enable_ms,\n  .handle_irq = simple_serial_handle_irq,\n};\n```\n\
  \n- 定义了一个 `uart_driver` 结构体 (`simple_uart_driver`)，代表 UART 驱动程序，指定了模块所有者、驱动程序名称、设备名称、主设备和次设备号以及该驱动程序管理的设备数量：\n\
  \n```c\nstatic struct uart_driver simple_uart_driver = {\n  .owner = THIS_MODULE,\n\
  \  .driver_name = DRIVER_NAME,\n  .dev_name = DRIVER_NAME,\n  .major = 0,\n  .minor\
  \ = 0,\n  .nr = 1,\n};\n```\n\n- 此代码块定义了模块初始化函数 (`simple_serial_init`)：\n\n```c\n\
  static int __init simple_serial_init(void)\n{\n  int ret;\n  simple_port.port.iotype\
  \ = UPIO_PORT;\n  simple_port.port.iobase = UART_BASE;\n  simple_port.port.irq =\
  \ UART_IRQ;\n  simple_port.port.uartclk = 1843200;\n  simple_port.port.fifosize\
  \ = 16;\n  simple_port.port.ops = &simple_serial_ops;\n  simple_port.port.flags\
  \ = UPF_BOOT_AUTOCONF;\n  simple_port.port.line = 0;\n  ret = uart_register_driver(&simple_uart_driver);\n\
  \  if (ret)\n    return ret;\n  ret = uart_add_one_port(&simple_uart_driver, &simple_port.port);\n\
  \  if (ret) {\n    uart_unregister_driver(&simple_uart_driver);\n    return ret;\n\
  \  }\n  pr_info(\"%s: driver initialized\\n\", DRIVER_NAME);\n  return 0;\n}\n```\n\
  \n- 移除 UART 端口并注销 UART 驱动程序：\n\n```c\nstatic void __exit simple_serial_exit(void)\n\
  {\n  uart_remove_one_port(&simple_uart_driver, &simple_port.port);\n  uart_unregister_driver(&simple_uart_driver);\n\
  \  pr_info(\"%s: driver exited\\n\", DRIVER_NAME);\n}\n```\n\n## 外设组件互连架构 (Peripheral\
  \ Component Interconnect architecture)\n\nPCI Linux 驱动模型限制一个设备只能有一个驱动程序。Linux 驱动程序根据\
  \ PCI 设备 ID 和功能加载。一旦加载了驱动程序，该设备就无法加载其他驱动程序。参考图 11.7，如果首先加载根端口热插拔驱动程序，它将接管根端口设备。因此，PCI\
  \ Linux 驱动模型防止了通过单个服务驱动程序对每个 PCI Express 端口支持多个服务。\n\n![](img/Figure11.7.png)\n\n\
  图 11.7：Linux PCI 驱动模型下的服务驱动程序\n\nPCI 架构的设计旨在取代 ISA 标准，三个三个目标：在计算机与其外设设备之间传输数据时获得更好的性能、尽可能实现平台无关，以及简化系统中添加和移除设备。\n\
  \nPCI 总线通过使用比 ISA 更时钟频率来实现更好的性能；其时钟运行频率为 25 或 33 MHz（实际频率取决于系统时钟），最近也部署了 66 MHz\
  \ 甚至 133 MHz 的实现方案。此外，它配备了 32 位数据总线，并在规范中包含了 64 位扩展。平台无关性通常是计算机总线设计的目标，这也是 PCI 特别重要的特征，因为\
  \ PC 世界历史上一直由特定处理器的接口标准主导。PCI 目前被广泛应用于 IA-32、Alpha、PowerPC、SPARC64 和 IA-64 系统以及其他平台。\n\
  \n然而，对驱动程序编写人员最相关的是 PCI 对接口卡自动检测的支持。PCI 设备是不带跳线线的（与大多数旧设备不同），并且在启动时自动配置。接下来，设备驱动程序必须能够访问设备配置信息以完成初始化。这不需要任何验证即可完成。\n\
  \n每个 PCI 设备通过总线号、设备号和功能号识别。PCI 规范允许单个系统托管多达 256 条总线，但由于 256 条总线对于许多大型系统仍然不够，Linux\
  \ 现在支持 PCI 域 (domains)。每个 PCI 域可以托管最多 256 条总线。每个总线容纳最多 32 个设备，每个设备可以是一个多功能卡（例如带有\
  \ CD-ROM 驱动器的音频设备），最多有 8 个功能。因此，每个功能可以在硬件层面上通过 16 位地址或键进行识别。然而，为 Linux 的设备驱动程序不需要处理这些二进制地址，因为它们使用特定的数据结构\
  \ `pci_dev` 来操作设备。\n\n较新的工作站至少有两个 PCI 总线。在单个系统中连接多个总线是通过桥接器 (bridges) 实现的，桥接器是用于连接两条总线的特殊\
  \ PCI 设备。PCI 系统的通用布局是一个树，其中每条总线都连接到更高层的总线，直到树根处的 0 号总线。CardBus PC 卡系统也通过桥接器连接到 PCI\
  \ 系统。典型的 PCI 系统如图 11.8 所示，其中突出了各种桥接器。\n\n![](img/Figure11.8.png)\n\n图 11.8：典型 PCI\
  \ 系统的布局\n\n与 PCI 设备关联的 16 位硬件地址大部分隐藏在 `pci_dev` 结构体对象中，但偶尔仍可见，特别是在使用设备列表时。其中一种情况是\
  \ `lspci` 的输出（pciutils 包的一部分，大多数发行版都提供）以及 `/proc/pci` 和 `/proc/bus/pci` 中的信息排列。PCI\
  \ 设备的 sysfs 表示也显示了这种地址方案，并增加了 PCI 域信息。当显示硬件地址时，它可以显示为两个值（8 位总线号和 8 位设备和功能号）、三个值（总线、设备和功能）或四个值（域、总线、设备和功能）；所有值通常以十六进制形式显示。\n\
  \n例如，`/proc/bus/pci/devices` 使用单个 16 位字段（便于解析和排序），而 `/proc/bus/busnumber` 将地址拆分为三个字段：\n\
  \n提取 PCI 设备类、厂商 ID 和设备 ID：\n\n![](img/Figure11.9.png)\n\n图 11.9：提取 PCI 总线地址\n\n\
  ![](img/Figure11.10.png)\n\n图 11.10：显示 PCI 设备层级\n\n![](img/Figure11.11.png)\n\n\
  图 11.11：显示 PCI 总线设备树\n\n这三个设备列表按相同的顺序排序的，因为 `lspci` 使用 `/proc` 文件作为信息源。以 VGA 视频控制器为例，0x00a0\
  \ 在划分为域（16 位）、总线（8 位）、设备（5 位）和功能（3 位）时意味着 0000:00:14.0。\n\n\n\n\n每个外设板上的硬件电路都会响应对三个地址空间的请求：内存位置、I/O\
  \ 端口和配置寄存器。前两个地址空间由同一 PCI 总线上的所有设备共享（即，当你访问内存插槽时，该 PCI 总线上的所有设备都会同时看到总线周期）。而配置空间本身使用地理位置寻址。配置请求一次只访问一个位置，因此永远不会发生冲突。\n\
  \n对于驱动程序，内存和 I/O 区域通过 `inb`、`readb` 等常规方式访问。相反，配置事务是通过调用特定的内核函数来访问配置寄存器来完成的。至于中断，每个\
  \ PCI 插槽都有四个中断引脚，每个外设功能功能可以使用其中一个，而无须担心这些引脚是如何路由到 CPU 的。这种路由是 IT 平台的责任，并在 PCI 总线之外实现。由于\
  \ PCI 规范要求中断线是共享的，即使是像 `x86` 这样 IRQ 线数量有限的处理器也能容纳许多 PCI 接口卡（每个卡有四个引脚）。\n\nPCI 总线中的\
  \ I/O 空间使用 32 位地址线（导致 4 GB 的 I/O 端口），而内存空间则使用 32 位或 64 位地址访问。较新的平台提供 64 位地址。地址理论上应该是设备独有的，但软件可能会错误地为两个设备配置相同的地址，导致无法访问任何一个设备。除非驱动程序故意弄乱它不应该触碰的寄存器，否则这个问题永远不会发生。好消息是，接口卡提供的每个内存和\
  \ I/O 地址区域都可以通过配置事务进行重映射。也就是说，固件在系统启动时初始化 PCI 硬件，将每个区域映射到不同的地址以避免冲突。这些区域当前映射的地址可以从配置空间读取，以便\
  \ Linux 驱动程序无需探测即可访问其设备。在读取配置寄存器后，驱动程序就可以安全地访问其硬件。\n\nPCI 配置空间每个设备功能占用 256 字节（PCI\
  \ Express 设备除外，每个功能拥有 4 KB 的配置空间），且配置寄存器的布局是标准化的。配置空间中的四个字节包含一个唯一的功能 ID，因此驱动程序可以通过查找该设备的特定\
  \ ID 来识别其设备。总之，每个设备卡通过地理位置寻址来获取其配置寄存器；这些寄存器中的信息随后可用于执行标准的 I/O 访问，而无需额外的地理寻址。\n\n\
  从此描述可以看出，PCI 接口标准与 ISA 相比的主要创新在于配置地址空间。因此，除了常规的驱动代码外，PCI 驱动程序必须能够访问配置空间，以避免执行危险的探测任务。\n\
  \n在本章的剩余部分，我们使用“设备”一词来指代设备功能，因为多功能卡上的每个功能都是作为一个独立的实体运行的。当我们引用设备时，我们指的是一个元组：域号、总线号、设备号和功能号。\n\
  \n### PCI 配置寄存器\n\n配置寄存器配置 PCI 设备。所有 PCI 设备都至少有 256 字节的地址空间。前 64 字节是标准化的，其余部分取决于设备。图\
  \ 11.12 显示了与设备无关的配置空间的布局：\n\n![](img/Figure11.12.png)\n\n图 11.12：标准化的 PCI 配置寄存器\n\
  \n让我们详细查看这些寄存器：\n\n*   **Supplier ID（供应商 ID）**：这个 16 位寄存器用于标识硬件制造商。例如，每个 Intel 设备都具有相同的供应商\
  \ ID `0x8086`。这些数字有一个全局注册表，由 PCI 特别兴趣小组（PCI Special Interest Group）维护，制造商必须申请分配一个唯一的数字。\n\
  *   **Device reference（设备引用）**：这是另一个由制造商选择的 16 位寄存器；设备 ID 不需要官方注册。此标识符通常与供应商 ID\
  \ 结合使用，为硬件设备创建一个唯一的 32 位标识符。我们使用“签名（signature）”一词来指代供应商和设备 ID 对。驱动程序通常依赖于签名来识别其设备；你可以在目标设备的硬件手册中找到要查找的值。\n\
  *   **Class（类）**：每个设备都属于某一类。类寄存器是一个 16 位值，其前 8 位标识“基类”（或组组）。例如，“以太网”和“令牌环”是属于“网络”组的两个类，而“串口”和“并行”类分别属于“网络”组和“通信”组。某些驱动程序可能支持多个相似的设备，每个设备具有不同的签名，但都属于同一个类。正如后文所述，这些驱动程序可以依靠类寄存器来识别它们的设备。\n\
  \    *   Subsystem Vendor ID（子系统供应商 ID）\n    *   Subsystem Device ID（子系统设备 ID）\n\
  \n这些字段可用于进一步识别设备。如果是一个带有本地（集成）总线的通用接口芯片，它通常被用于几种完全不同的角色，驱动程序必须识别它与其通信的实际设备。子系统标识符便用于此目的。\n\
  \n初始化 `struct pci_device_id` 结构时必须使用两个辅助宏：\n\n*   `PCI_DEVICE(vendor, device)`：创建一个仅匹配特定供应商和设备\
  \ ID 的 `pci_device_id` 结构。该宏将框架的子供应商和子设备字段置为 `PCI_ANY_ID`。\n*   `PCI_DEVICE_CLASS(device_class,\
  \ device_class_mask)`：创建一个对应于特定 PCI 类的 `pci_device_id` 结构。\n\n使用这些宏定义驱动程序所支持的设备类型的示例可以在以下内核文件中找到：\n\
  \n```c\nstatic const struct pci_device_id bypass_pci_id_table[] = {\n\n/* ChipIdea\
  \ on Intel MID platform */\n{ PCI_DEVICE(PCI_VENDOR_ID_INTEL, 0x0811), },\n{ PCI_DEVICE(PCI_VENDOR_ID_INTEL,\
  \ 0x0829), },\n{ PCI_DEVICE(PCI_VENDOR_ID_INTEL, 0xe006), },\n{}\n};\n```\n\n这些示例创建了一个\
  \ `struct pci_device_id` 结构列表，其中一个空结构作为列表的最后一个值设置为零。此 ID 数组用于 `pci_driver` 结构（下文所示），并被用于告知用户空间该特定驱动程序支持哪些设备。\n\
  \n此 `pci_device_id` 结构应该导出到用户空间，以便热插拔和模块加载系统知道哪些模块与哪些硬件设备匹配。`MODULE_DEVICE_TABLE`\
  \ 宏实现了这一功能。\n\n示例如下：\n\n```c\nMODULE_DEVICE_TABLE(pci, i810_ids);\n```\n\n该语句创建了一个名为\
  \ `_mod_pci_device_table` 的局部变量，指向 `pci_device_id` 结构列表。在内核构建过程的后期，`depmod` 程序搜索所有模块以查找符号\
  \ `_mod_pci_device_table`。如果找到了该符号，它将提取模块数据并将其添加到 `/lib/modules/KERNEL_VERSION/modules.pcimap`\
  \ 文件中。在 depmod 完成后，内核模块支持的所有 PCI 设备都列在该文件中，并带有模块名称。当内核通知热插拔系统发现新的 PCI 设备时，热插拔系统使用\
  \ `modules.pcimap` 文件来查找合适的驱动程序。\n\n所有 PCI 驱动程序必须创建并正确向内核注册的主结构是 `struct pci_driver`\
  \ 结构。该结构由几个函数回调和变量组成，向 PCI 核心描述 PCI 驱动程序。\n\n以下是 PCI 驱动程序应该注意的该结构字段：\n\n\n\n\n\n\
  - `const char *name;`: 驱动程序的名称。它在所有内核 PCI 驱动程序中是唯一的，通常被设置为与驱动模块相同的名称。当驱动程序位于内核中时，它出现在\
  \ sysfs 的 `/sys/bus/pci/drivers/` 下。\n- `const struct pci_device_id *id_table;`:\
  \ 指向在本章之前描述的 `struct pci_device_id` 表的指针。\n- `int (*probe) (struct pci_dev *dev,\
  \ const struct pci_device_id *id);`: PCI 驱动程序中 `probe` 函数的指针。当 PCI 核心认为该驱动程序想要控制某个\
  \ `pci_dev` 结构时，会调用此函数。PCI 核心用于做出此决策的 `pci_device_id` 结构指针也会传递给此函数。如果 PCI 驱动程序声明了传递给它的\
  \ `pci_dev` 结构，它应该正确初始化设备并返回 `0`。如果驱动程序不想拥有该设备或发生错误，它应该返回一个负错误值。关于此功能的更多细节将在本章稍后部分介绍。\n\
  - `void (*remove) (struct pci_dev *dev);`: 当 `pci_dev` 结构从系统中移除或 PCI 驱动程序从内核卸载时，PCI\
  \ 核心调用的函数指针。关于此功能的更多细节将在本章稍后部分介绍。\n- `int (*suspend) (struct pci_dev *dev, state\
  \ u32);`: 当 `pci_dev` 结构挂起时，PCI 核心调用的函数指针。挂起状态通过 `status` 变量传递。此功能是可选的；驱动程序不需要提供。\n\
  - `int (*resume) (struct pci_dev *dev);`: 当恢复 `pci_dev` 结构时，PCI 核心调用的函数指针。它在挂起调用之后总是调用。此功能是可选的；驱动程序不需要提供。\n\
  \n总之，创建一个创建一个 `struct pci_driver` 结构，只需要初始化四个字段：\n\n```c\nstruct pci_driver {\n\
  \    const char *name;\n    const struct pci_device_id *id_table;\n    int (*probe)(struct\
  \ pci_dev *dev, const struct pci_device_id *id);\n    void (*remove)(struct pci_dev\
  \ *dev);\n    int (*suspend)(struct pci_dev *dev, pm_message_t state);\n    int\
  \ (*resume)(struct pci_dev *dev);\n    void (*shutdown)(struct pci_dev *dev);\n\
  \    int (*sriov_configure)(struct pci_dev *dev, int num_vfs);\n    int (*sriov_set_msix_vec_count)(struct\
  \ pci_dev *vf, int msix_vec_count);\n    u32 (*sriov_get_vf_total_msix)(struct pci_dev\
  \ *pf);\n    const struct pci_error_handlers *err_handler;\n    const struct attribute_group\
  \ **groups;\n    const struct attribute_group **dev_groups;\n    struct device_driver\
  \ driver;\n    struct pci_dynids dynids;\n    bool driver_managed_dma;\n};\n```\n\
  \n要向 PCI 内核注册 `pci_driver` 结构，需要调用 `pci_register_driver` 并传入 `pci_driver` 结构的指针。这通常在\
  \ PCI 驱动程序的模块初始化代码中完成：\n\n```c\nstatic int __init pci_skel_init(void) {\n    return\
  \ pci_register_driver(&pci_driver);\n}\nstatic void __exit pci_skel_exit(void) {\n\
  \    pci_unregister_driver(&pci_driver);\n}\n```\n\n让我们来看一个使用 PCI 接口的驱动示例：\n\n-\
  \ 包含 Linux 内核开发所需的头文件，例如模块管理 (`module.h`)、初始化 (`init.h`)、PCI 使用 (`pci.h`)、`io.h`：\n\
  ```c\n#include <linux/module.h>\n#include <linux/init.h>\n#include <linux/pci.h>\n\
  #include <linux/io.h>\n```\n- 为驱动程序名称、PCI 厂商 ID 和 PCI 设备 ID 定义宏：\n```c\n#define\
  \ DRIVER_NAME \"simple_pci\"\n#define PCI_VENDOR_ID 0x1234\n#define PCI_DEVICE_ID\
  \ 0x5678\n```\n- 定义一个 `pci_device_id` 结构数组 (`pci_ids`)，指定该驱动程序支持的设备。`MODULE_DEVICE_TABLE`\
  \ 宏将此数组注册到内核：\n```c\nstatic struct pci_device_id pci_ids[] = {\n    { PCI_DEVICE(PCI_VENDOR_ID,\
  \ PCI_DEVICE_ID), },\n    { 0, }\n};\nMODULE_DEVICE_TABLE(pci, pci_ids);\n```\n\
  - 定义一个结构 (`simple_pci_dev`) 来表示 PCI 设备的私有数据。它包含指向 `pci_dev` 结构的指针和指向映射 I/O 地址的指针：\n\
  ```c\nstruct simple_pci_dev {\n    struct pci_dev *dev;\n    void __iomem *mmio_base;\n\
  };\n```\n- 定义 `probe` 函数 (`simple_pci_probe`)，当找到匹配的 PCI 设备时调用该函数：\n```c\nstatic\
  \ int simple_pci_probe(struct pci_dev *dev, const struct pci_device_id *ent) {\n\
  \    struct simple_pci_dev *dev;\n    int bars, err;\n    dev = kzalloc(sizeof(*dev),\
  \ GFP_KERNEL);\n    if (!dev) return -ENOMEM;\n    dev->dev = dev;\n    pci_set_drvdata(dev,\
  \ dev);\n    err = pci_enable_device(dev);\n    if (err) goto err_free_dev;\n  \
  \  bars = pci_select_bars(dev, IORESOURCE_MEM);\n    err = pci_request_selected_regions(dev,\
  \ bars, DRIVER_NAME);\n    if (err) goto err_disable_device;\n    dev->mmio_base\
  \ = pci_ioremap(dev, 0, 0);\n    if (!dev->mmio_base) {\n        err = -EIO;\n \
  \       goto err_release_regions;\n    }\n    pr_info(DRIVER_NAME \": device probed\\\
  n\");\n    return 0;\nerr_release_regions:\n    pci_release_selected_regions(dev,\
  \ pci_select_bars(dev, IORESOURCE_MEM));\nerr_disable_device:\n    pci_disable_device(dev);\n\
  err_free_dev:\n    kfree(dev);\n    return err;\n}\n```\n- 定义 `remove` 函数 (`simple_pci_remove`)，当\
  \ PCI 设备被移除时调用该函数：\n```c\nstatic void simple_pci_remove(struct pci_dev *dev) {\n\
  \    struct simple_pci_dev *dev = pci_get_drvdata(dev);\n    pci_iounmap(dev, dev->mmio_base);\n\
  \    pci_release_selected_regions(dev, pci_select_bars(dev, IORESOURCE_MEM));\n\
  \    pci_disable_device(dev);\n    kfree(dev);\n    pr_info(DRIVER_NAME \": device\
  \ removed\\n\");\n}\n```\n- 定义 PCI 驱动程序结构 (`simple_pci_driver`)，指定驱动名称、设备 ID 表、probe\
  \ 函数和 remove 函数：\n```c\nstatic struct pci_driver simple_pci_driver = {\n    .name\
  \ = DRIVER_NAME,\n    .id_table = pci_ids,\n    .probe = simple_pci_probe,\n   \
  \ .remove = simple_pci_remove,\n};\n```\n- 定义模块初始化函数 (`simple_pci_init`)：\n```c\n\
  static int __init simple_pci_init(void) {\n    return pci_register_driver(&simple_pci_driver);\n\
  }\n```\n- 定义模块退出函数 (`simple_pci_exit`)：\n```c\nstatic void __exit simple_pci_exit(void)\
  \ {\n    pci_unregister_driver(&simple_pci_driver);\n}\n```\n\n## 结论\n在本章中，我们讨论了与主板不同硬件组件通信所需的各种通信协议，无论是在串行还是并行总线上。大多数与串行总线相关的历史产物。没有讨论并行总线或\
  \ centronic，是因为它们已经不存在了。然而，其他总线已成功演变为数据传输量日益增长的通信手段。\n\n在下一章中，我们将理解管理内核或用户态进程的不同调度算法。\n\
  \n\n\n\n在 GNU/Linux 中，任务调度由内核处理，内核采用复杂的算法来确保进程高效且公平地执行。本次演示将深入探讨 GNU/Linux 任务调度的复杂性，探索其核心原理、机制和策略。\n\
  \n进程是程序在执行过程中的实例。一组进程组合在一起构成了一个完整的程序。Unix 中的进程分为两类，即：\n\n*   用户进程在用户空间内以非特权模式运行。\n\
  *   内核进程在内核空间内以特权模式运行。\n\n进程的生命周期可以分为若干状态，每种状态都有描述进程的特定特征。理解以下状态至关重要：\n\n*   进程当前在用户模式下执行。\n\
  *   进程当前在内核模式下执行。\n*   进程未执行，但一旦调度器选择它，它就可以准备运行。许多进程可能处于这种状态，调度算法决定下一个执行哪一个进程。\n\
  *   进程处于睡眠状态。当进程无法继续执行时，它会进入睡眠状态，例如等待 `1/O` 完成。\n*   进程已就绪，但交换器（`process 0`）必须在内核调度其运行之前将该进程交换到主内存中。\n\
  *   进程处于睡眠状态，交换器已将进程切换到次级存储器，为主内存中的其他进程腾留空间。\n*   进程从内核返回用户模式，但内核预见到了这一点并执行上下文切换以调度另一个进程。\n\
  *   进程是新创建的，处于过渡状态；进程存在，但尚未准备好运行或处于睡眠。此状态是除 `process 0` 之外所有进程的起始状态。\n*   进程已执行了\
  \ `exit` 系统调用并处于僵尸状态。进程不再存在，但它留下了一个包含退出代码和时间统计信息的记录，供其父进程收集。僵尸状态 `i.` 是进程的最终状态。\n\
  \n由于处理器一次只能运行一个进程，因此最多有一个进程处于状态 1 和 2。这两种状态对应于两种执行模式：用户态和内核态。\n\n进程在从开始到结束的工作期间进入的状态被称为进程状态。列举如下：\n\
  \n*   进程刚由系统调用创建，尚未准备好运行。\n*   用户运行：进程在用户模式下运行，意味着它是一个用户进程。\n*   内核运行：表示该进程是内核内核模式下运行的内核进程。\n\
  *   僵尸：进程不存在/已终止。\n*   抢占：当进程从内核模式运行到用户模式时，被称为被抢占。\n*   内存中就绪：表示进程已进入在内存中就绪运行的状态，正在等待内核调度它。\n\
  *   就绪，已交换：进程已准备好运行，但没有空闲的主内存\n*   睡眠，已交换：进程已移动到次级存储器并处于阻塞状态。\n*   内存中睡眠：进程在内存中（未传输到次级存储器），但处于阻塞状态。\n\
  \n下图显示了 GNU/Linux 下进程的状态转换图：\n\n![](img/Figure12.1.png)\n\n图 12.1：进程状态转换图\n\n进程的工作过程可以通过以下阶段来解释：\n\
  \n*   由用户运行：进程由用户运行。\n*   内核执行：进程被分配给内核，因此处于内核模式。\n*   内存中就绪：此外，在主内存中处理完后，进程被重新调度到内核。也就是说，进程本身不执行，但一旦内核调度它，它就准备好执行。\n\
  *   内存中睡眠：进程处于睡眠状态但留在主内存中。它等待任务开始。\n*   就绪，已交换：进程已准备好运行并被处理器交换到主内存，允许内核调度其执行。\n\
  *   睡眠，交换：进程处于次级存储器中的睡眠状态，为主内存中的其他进程执行腾留空间。一旦任务完成，它可以恢复。\n*   抢占：当第一个进程从内核模式切换到用户模式时，内核为了分配另一个进程而抢占正在运行的进程。\n\
  *   创建：进程刚创建尚未运行。这是所有进程的起始状态。\n*   僵尸：进程已完全完成并激活了 `exit` 调用。因此进程不再存在。然而，它存储了进程的统计记录。这是所有进程的最终状态。\n\
  \n调度器负责为系统上运行的各种进程分配 CPU 时间。其主要目标是最大化 CPU 利用率、提供公平的 CPU 资源访问、确保系统响应性，并在时支持实时进程。Linux\
  \ 内核采用完全公平调度器（`CFS`）作为默认调度算法，该算法在内核版本 `2.6.23` 中引入以取代旧的 `O(1)` 调度器。\n\n`CFS` 旨在在进程之间公平分配\
  \ CPU 时间。与传统的轮询或基于优先级的调度算法不同，`CFS` 不使用固定时间片。相反，旨在确保每个进程根据其权重或优先级获得比例 CPU 时间。\n\n\
  下图显示了不同调度策略之间的关系：\n\n![](img/Figure12.2.png)\n\n图 12.2：Linux 调度器家族\n\n`CFS` 的核心概念如下：\n\
  \n*   虚拟运行时间 (`vruntime`)：`CFS` 使用一种称为虚拟运行时间的指标来跟踪进程运行的时间。`vruntime` 值越小的进程优先级越高。调度器旨在平衡所有可运行进程的\
  \ `vruntime`。\n*   红黑树：`CFS` 使用红黑树（一种平衡搜索树）来管理进程。树中的每个节点代表一个进程，树按 `vruntime` 组织。`vruntime`\
  \ 最小的左侧节点被选择为下一个执行。\n*   负载均衡：`CFS` 包含了跨多个 CPU 或核心的负载均衡机制，确保没有单个 CPU 过载而其他 CPU 处于空闲状态。\n\
  \nLinux 支持多种调度策略以适应不同类型的进程，包括实时和非实时策略。\n\n下图显示了单进程和多线程模式下的数据局部性：\n\n![](img/Figure12.3.png)\n\
  \n图 12.3：单进程 vs 多线程模式\n\n非实时策略如下：\n\n*   `SCHED_NORMAL`（或 `SCHED_OTHER`）：这是普通非实时进程的默认策略。它使用\
  \ `CFS` 在所有进程之间公平地管理 CPU 时间。\n    *   描述：这是用于普通非实时任务的默认调度策略。它利用 `CFS` 管理进程调度。\n\
  \    *   特点：为所有进程提供公平的 CPU 时间份额，确保 CPU 资源平衡且高效地使用。\n*   `SCHED_BATCH`：该策略适用于不需要用户交互的批处理作业。其目标是通过以较低优先级运行批处理作业，最大化\
  \ CPU 吞吐量并减少对交互式进程的影响。\n    *   描述：该策略适用于不需要立即用户交互的批处理作业。\n    *   特点：针对吞吐量而非交互性进行了，在此策略下的进程运行优先级低于交互任务，最大限度地减少了它们对系统响应性的影响。\n\
  *   `SCHED_IDLE`：具有此策略的进程仅在 CPU 没有其他可运行任务时运行，适用于非常低优先级的后台任务。\n\n\n\n\n# 实时调度策略\n\
  \n- **描述**: 一种实时调度策略，其中最高优先进程将运行，直到它阻塞或显式释放 CPU。\n- **特点**: 不使用时间片；在高优先级进程完成之前，低优先级进程将不会运行。适用于时间敏感型应用程序。\n\
  \n实时调度策略如下：\n\n### SCHED_FIFO（先进先出）\n该策略是一种实时调度策略，其中最高优先进程将运行，直到它阻塞或自愿释放 CPU。它不使用时间片，这意味着如果高优先级进程持续可运行，低优先级进程可能会被饿死。\n\
  \n- **描述**: 一种实时调度策略，其中最高优先进程将运行，直到它阻塞或显式释放 CPU。\n- **特点**: 不使用时间片；在高优先级进程完成之前，低优先级进程将不会运行。适用于时间敏感型应用程序。\n\
  \n下图展示了使用 `SCHED_DEADLINE` 进行调度的示例：\n\n![](img/Figure12.4.png)\n\n图 12.4：截止时间调度示例\n\
  \n### SCHED_RR（轮询）\n与 `SCHED_FIFO` 类似，但为每个进程分配了时间片。相同优先级的进程以轮询方式循环执行，防止饿死并确保每个实时进程都能获得周期性的\
  \ CPU 时间。\n\n- **描述**: 它与 `SCHED_FIFO` 类似，但带有时间片。每个进程在移动到下一个相同优先级的进程之前，会运行固定的时间片。\n\
  - **特点**: 确保相同优先级的进程周期性地获得 CPU 时间，防止饿死并为实时任务提供可预测的性能。\n\n下图展示了使用 `SCHED_RR` 进行调度的示例：\n\
  \n![](img/Figure12.5.png)\n\n图 12.5：轮询调度示例\n\n### SCHED_DEADLINE\nLinux 中的一种实时调度策略，旨在保证任务在指定的截止日期之前完成。它根据运行时间、截止日期和周期等参数调度任务，确保对时间有严刻刻的应用程序（如多媒体处理或嵌入式系统）提供精确计时。\n\
  \n- **描述**: 一种更高级的实时调度策略，旨在保证任务在指定的截止日期之前完成。\n- **特点**: 适用于对时间有严格刻的应用程序，例如多媒体处理或嵌入式系统。任务根据截止日期而非优先级进行调度。\n\
  \n实时任务具有从 1 到 99 的固定优先级，其中 99 为最高优先级。这些优先级决定了任务调度的顺序。非实时/普通任务使用“nice”值来影响其调度优先级。nice\
  \ 值的范围从 -20（最高优先级）到 19（最低优先级）。nice 值越高，优先级越低，意味着进程获得的 CPU 时间越少。\n\nGNU/Linux 任务调度是操作系统中复杂但至关重要的组件，确保了\
  \ CPU 资源的高效公平分配。CFS 代表了调度算法的重大进展，提供了公平的 CPU 时间分配。通过理解各种调度策略、优先级和可用工具，用户和管理员可以优化系统性能并有效管理进程。无论是处理实时应用程序还是常规负载，Linux\
  \ 多用途的调度能力都能满足广泛的需求，确保系统行为稳健且响应灵敏。\n\n## 实际示例\n\n以下是使用特定 nice 值启动进程的实际示例：\n\n###\
  \ 带有特定 nice 值的进程\n```bash\nnice -n 10 myprocess\n```\n- 此 `nice` 命令以 10 的 nice 值启动\
  \ `myprocess`，与默认 nice 值为 0 的其他进程相比，它的优先级较低。`renice` 用于更改一个或多个运行进程的调度优先级。第一个参数是要使用的优先级值。其他参数被解释为进程\
  \ ID（默认情况下）、进程组 ID、用户 ID 或用户名。`renice` 一个进程组会导致该进程组中的所有进程的调度优先级被更改。`renice` 一个用户会导致该用户所有的所有进程的调度优先级被更改。\n\
  \n### 将进程的调度策略更改为 SCHED_RR\n```bash\nchrt -r -p 20 1234\n```\n- 此 `chrt` 命令将 PID\
  \ 为 `1234` 的进程调度策略设置为优先级为 20 的轮询。\n\n### 监控进程调度\n```bash\ntop\n```\n- `top` 命令提供了运行进程的实时视图，包括它们的优先级和调度策略。\n\
  \n## 监控工具\n\n可以使用其他工具进行监控：\n\n- **Top**: 实时显示运行的进程、CPU 和内存使用情况。\n- **Htop**: top\
  \ 的交互式版本，具有更好的 UI 和鼠标支持。\n- **Atop**: 带有磁盘和网络统计的高级进程监控。\n- **Btm**: 终端的可定制图形化进程/系统监控，灵感来自\
  \ `gtop`、`gotop` 和 `htop`。\n- **Btop**: 现代且丰富的命令行资源监控器，显示处理器、内存、磁盘、网络和进程的使用及统计。\n\
  - **Glances**: 带有详细统计数据的跨平台监控工具。\n- **Ps**: 显示运行进程的快照。\n- **Pgrep**: 按名称搜索进程。\n\
  - **Pidstat**: 报告单个进程随时间的 CPU 使用情况。\n- **nice/renice**: 动态调整进程优先级。\n\n# GNU/Linux\
  \ 与实时\n\nGNU/Linux 本身的标准形式并不是一种实时操作系统 (RTOS)，但可以通过特定的修改和配置来满足实时需求。以下是关于实时计算背景下 GNU/Linux\
  \ 的能力和局限性的详细说明：\n\n### 特性\n- 默认 Linux 内核被设计为通用操作系统，针对跨范围应用程序的整体性能、响应能力和灵活性进行了优化。\n\
  - 在标准 Linux 下，内核不是完全可抢占的，这意味着某些内核操作可能会阻塞其他进程，导致可变且有时高的延迟。\n- 默认调度器（`CFS`）旨在为进程之间提供公平的\
  \ CPU 时间分配，但并未针对实时应用程序所需的严格计时进行优化。\n\n### 局限\n- 标准 Linux 中的延迟是不可预测的，使其不适用于精确计时至关重要的困难实时应用。\n\
  - 标准 Linux 中任务调度和中断处理的非确定性本质可能导致时间敏感型应用程序错过截止日期。\n\n为了解决标准 Linux 在实时应用中的局限性，人们开发了若干扩展和修复程序，例如\
  \ `PREEMPT_RT` 补丁。`PREEMPT_RT` 补丁是将标准 Linux 内核转换为实时内核的最大努力。\n\n### 实时特性\n- **全内核抢占**:\
  \ `PREEMPT_RT` 补丁使得内核的几乎所有部分变得可抢占，降低了峰值延迟。\n- **优先级继承**: 实现优先级继承以防止优先级反转，确保高优先级任务不会被持有资源的低优先级任务无当延延迟。\n\
  - **高分辨率定时器**: 为精确的任务调度提供高分辨率定时器。\n- **中断处理**: 将大多数中断处理程序转换为可抢占的内核线程，允许它们以实时优先级进行调度。\n\
  \n以下应用需要实时系统：\n- 工业自动化\n- 机器人\n- 军事（导弹、高度受限系统）\n- 电信\n- 多媒体处理\n- 医疗设备\n\n\n\n\n\n\
  若干 Linux 发行版包含了 `PREEMPT_RT` 补丁或其他实时增强功能，为实时应用提供开箱即用的支持：\n\n*   Red Hat Enterprise\
  \ Linux 实时版 (`RHEL-RT`)：`RHEL` 的实时变，包含了 `PREEMPT_RT` 修复程序和其他优化。\n*   Ubuntu Studio：提供适用于实时音频处理的低延迟内核。\n\
  *   Fedora Jam：一个带有实时内核的 `Fedora` 版本，面向音频制作和其他实时工作负载而设计。\n\n要设置实时任务，你可以按照以下步骤操作：\n\
  \n1. 下载并安装带有 `PREEMPT_RT` 补丁的 Linux 内核，或使用提供实时内核的发行版，例如 `Fedora` 的实时内核。\n2. 使用 `chrt`\
  \ 工具配置实时调度，以设置实时策略：\n```\nsudo chrt -f -p $99 (pgrep myrealtimeapp)\n```\n3. 这会将\
  \ `myrealtimeapp` 设置为使用最高优先级的 `SCHED_FIFO` 策略。\n4. 使用 `cyclictest` 工具进行监控和测试以测量延迟：\n\
  ```\nsudo cyclictest -t1 -p 80 -n -i 10000 -l 10000\n```\n5. 此命令测试系统延迟，提供有关其实时性能的信息。\n\
  \n# Kthreads\n\n内核线程 (`kthreads`) 是一种运行在 GNU/Linux 操作系统内核空间中的特殊线程类型。\n\n与由用户应用程序创建和管理的用户空间线程不同，`kthreads`\
  \ 由内核本身创建和管理。它们执行对操作系统运行至关重要的各种内核级任务。\n\n`kthreads` 用于执行需要在后台运行、且独立于用户空间进程的函数。它们处理的任务类如：\n\
  \n*   管理硬件中断\n*   执行 I/O 操作\n*   处理定时器和超时\n*   执行维护任务\n*   执行各种子系统的操作（例如：网络栈、文件系统操作）\n\
  \n`kthreads` 的特征如下：\n\n*   `kthreads` 在内核模式下运行，这意味着它们可以直接访问内核数据结构和硬件资源。\n*   它们与任何用户进程关联，且没有用户上下文，因此非常适合需要不顾用户空间活动而运行的任务。\n\
  *   Linux 调度器对待 `kthreads` 类似于用户空间进程，根据它们的优先级和系统负载对其进行调度。\n\n`kthreads` 使用特定的内核\
  \ API 创建和管理。最常用的 kthread 管理函数包括：\n\n*   `kthread_create()`：创建一个新的 `kthread` 但不立即启动它。\n\
  \    *   用法：\n    ```\n    struct task_struct *kthread_create(int (*threadfn)(void\
  \ *data), void *data, const char namefmt[], ...);\n    ```\n    *   参数：\n      \
  \  *   `threadfn`：由 `kthread` 执行的函数。\n        *   `data`：传递给线程函数的参数。\n        *\
  \   `namefmt`：`kthread` 名称的 printf 风格格式字符串。\n*   `wake_up_process()`：启动已创建但尚未启动的\
  \ `kthread`。\n    *   用法：\n    ```\n    int wake_up_process(struct task_struct *p);\n\
  \    ```\n    *   参数：\n        *   `p`：指向要启动的 `kthread` 的 `task_struct` 指针。\n* \
  \  `kthread_run()`：结合了 `kthread_create()` 和 `wake_up_process()` 的便利函数。\n    *  \
  \ 用法：\n    ```\n    struct task_struct *kthread_run(int (*threadfn)(void *data),\
  \ void *data, const char namefmt[], ...);\n    ```\n    *   参数：与 `kthread_create()`\
  \ 相同。\n*   `kthread_stop()`：停止正在运行的 `kthread`。\n    *   用法：\n    ```\n    int kthread_stop(struct\
  \ task_struct *k);\n    ```\n    *   参数：\n        *   `k`：指向要停止的 `kthread` 的 `task_struct`\
  \ 指针。\n\n这里是一个创建和管理 `kthread` 的简单示例：\n\n```\n#include <linux/module.h>\n#include\
  \ <linux/kernel.h>\n#include <linux/kthread.h>\n#include <linux/delay.h>\n\nstatic\
  \ struct task_struct *my_kthread;\n\nint my_thread_function(void *data) {\n    while\
  \ (!kthread_should_stop()) {\n        pr_info(\"Kernel Thread: Running\\n\");\n\
  \        ssleep(5); // Sleep for 5 seconds\n    }\n    pr_info(\"Kernel Thread:\
  \ Stopping\\n\");\n    return 0;\n}\n\nstatic int __init my_module_init(void) {\n\
  \    pr_info(\"Module Loaded\\n\");\n    my_kthread = kthread_run(my_thread_function,\
  \ NULL, \"my_kthread\");\n    if (IS_ERR(my_kthread)) {\n        pr_err(\"Failed\
  \ to create kthread\\n\");\n        return PTR_ERR(my_kthread);\n    }\n    return\
  \ 0;\n}\n\nstatic void __exit my_module_exit(void) {\n    kthread_stop(my_kthread);\n\
  \    pr_info(\"Module Unloaded\\n\");\n}\n\nmodule_init(my_module_init);\nmodule_exit(my_module_exit);\n\
  MODULE_LICENSE(\"GPL\");\nMODULE_AUTHOR(\"BPB\");\nMODULE_DESCRIPTION(\"A simple\
  \ example of kthread usage\");\n```\n\n`kthreads` 是 GNU/Linux 内核的一个强大功能，允许在内核级别执行后台任务。\n\
  \n\n\n\n\n`void destroy_workqueue(struct workqueue_struct *wq);`\n\n* 参数：\n    *\
  \ `wq`: 要销毁的工作队列。\n\n这是一个简单的示例，展示了如何创建工作队列以及调度一个工作项：\n\n```c\n#include <linux/module.h>\n\
  #include <linux/kernel.h>\n#include <linux/init.h>\n#include <linux/workqueue.h>\n\
  \nstatic struct workqueue_struct *my_wq;\n\nstatic struct work_struct my_work;\n\
  \nvoid my_work_function(struct work_struct *work) {\n    pr_info(\"Workqueue: Executing\
  \ my work function\\n\");\n}\n\nstatic int __init my_module_init(void) {\n    pr_info(\"\
  Module Loaded\\n\");\n    // 创建自定义工作队列\n    my_wq = create_workqueue(\"my_workqueue\"\
  );\n    if (!my_wq) {\n        pr_err(\"Failed to create workqueue\\n\");\n    \
  \    return -ENOMEM;\n    }\n    // 初始化并入队工作项\n    INIT_WORK(&my_work, my_work_function);\n\
  \    queue_work(my_wq, &my_work);\n    return 0;\n}\n\nstatic void __exit my_module_exit(void)\
  \ {\n    // 销毁工作队列\n    destroy_workqueue(my_wq);\n    pr_info(\"Module Unloaded\\\
  n\");\n}\n\nmodule_init(my_module_init);\nmodule_exit(my_module_exit);\nMODULE_LICENSE(\"\
  GPL\");\nMODULE_AUTHOR(\"BPB\");\nMODULE_DESCRIPTION(\"A simple example of workqueue\
  \ usage\");\n```\n\nGNU/Linux 内核工作队列提供了一种灵活且强大的机制，用于将任务推迟到进程上下文中执行。它们对于处理需要异步执行的任务至关重要，特别是那些由于需要睡眠或执行阻塞操作而无法在中断上下文中执行的任务。理解工作队列以及如何有效地使用它们，对于需要高效管理后台任务的内核开发者来说非常关键。\n\
  \n## 锁 (Locks)\n\nGNU/Linux 内核提供了各种锁机制，以确保内核空间的同步并防止竞态条件，特别是在开发内核驱动程序时。以下是对 GNU/Linux\
  \ 内核中可用不同锁机制的详细介绍：\n\n* **自旋锁 (Spinlocks)** 用于短的临界区，预计锁持有者会快速释放锁。它们之所以被称为自旋锁，是因为尝试获取锁的线程会在循环中旋转，反复检查锁是否可用。\n\
  \    * 基础自旋锁：\n      ```c\n      spinlock_t my_lock;\n      spin_lock_init(&my_lock);\n\
  \      spin_lock(&my_lock);\n      // 临界区\n      spin_unlock(&my_lock);\n      ```\n\
  \    * 中断安全的自旋锁：用于代码可能在中断上下执行的情况。\n      ```c\n      spinlock_t my_lock;\n     \
  \ unsigned long flags;\n      spin_lock_irqsave(&my_lock, flags);\n      // 临界区\n\
  \      spin_unlock_irqrestore(&my_lock, flags);\n      ```\n\n* **互斥锁 (Mutexes)**\
  \ 用于保护多个线程访问的数据结构，确保一次只有一个线程访问临界区。与自旋锁不同，如果锁可用，互斥锁会将线程设置为睡眠。\n    * 使用方法：\n    \
  \  ```c\n      struct mutex my_mutex;\n      mutex_init(&my_mutex);\n      mutex_lock(&my_mutex);\n\
  \      // 临界区\n      mutex_unlock(&my_mutex);\n      ```\n\n* **读写锁 (Read-write\
  \ locks)**：允许多个读取者或单个写入者访问临界区的锁。它们适用于读操作比写操作频繁的场景。有两种类型：\n    * 读锁：\n      ```c\n\
  \      rwlock_t my_rwlock;\n      read_lock(&my_rwlock);\n      // 只读的临界区\n    \
  \  read_unlock(&my_rwlock);\n      ```\n    * 写锁：\n      ```c\n      rwlock_t my_rwlock;\n\
  \      write_lock(&my_rwlock);\n      // 写入临界区\n      write_unlock(&my_rwlock);\n\
  \      ```\n\n* **序列锁 (Seqlocks)** 设计用于数据读取者比数据写入者常见的情况。写入者获得独占访问权限，而读取者可以在不加锁的情况下进行，但如果写入者正在运行，它们可能需要重试。与读写锁一样，有两种类型：\n\
  \    * 写入：\n      ```c\n      seqlock_t my_seqlock;\n      write_seqlock(&my_seqlock);\n\
  \      // 写入临界区\n      write_sequnlock(&my_seqlock);\n      ```\n    * 读取：\n   \
  \   ```c\n      unsigned int seq;\n      do {\n          seq = read_seqbegin(&my_seqlock);\n\
  \          // 读取临界区\n      } while (read_seqretry (&my_seqlock, seq));\n      ```\n\
  \n* **完成量 (Completion)** 是一种同步机制，允许一个线程等待另一个线程完成某些任务。它们通常用于中断处理程序和普通内核代码之间的信号传递。\n\
  \    * 使用方法：\n      ```c\n      struct completion my_completion;\n      init_completion(&my_completion);\n\
  \      // 在等待线程中\n      wait_for_completion(&my_completion);\n      // 在信号线程中\n\
  \      complete(&my_completion);\n      ```\n\n* **读写拷贝更新 (RCU)** 是一种同步机制，允许读取者与写入者并发访问数据，写入者通过创建数据结构的新版本来做出更改。锁机制也有两种类型：\n\
  \    * 读取：\n      ```c\n      rcu_read_lock();\n      // 读取临界区\n      rcu_read_unlock();\n\
  \      ```\n    * 写入：\n      ```c\n      synchronize_rcu();\n      ```\n\n* **信号量\
  \ (Semaphores)** 用于管理资源访问，允许一定数量的线程访问临界区。\n    * 使用方法：\n      ```c\n      struct\
  \ semaphore my_sem;\n      sema_init(&my_sem, 1);\n      down(&my_sem);\n      //\
  \ 临界区\n      up(&my_sem);\n      ```\n\n* **带 RCU 的自旋锁** 为读多同步提供了高效机制。它允许读取者在不加锁的情况下访问共享数据，而写入者可以在不阻塞读取者的情况下更改结构。\n\
  \    * 使用方法：\n        * RCU 读锁：\n          ```c\n          rcu_read_lock();\n  \
  \        // 读取临界区\n          rcu_read_unlock();\n          ```\n        * RCU 写锁：\n\
  \          ```c\n          spinlock_t my_spinlock;\n          spin_lock(&my_spinlock);\n\
  \          // 更新数据结构\n          spin_unlock(&my_spinlock);\n          synchronize_rcu();\n\
  \          ```\n\n* **大内核锁 (BKL)**（已弃用）是旧版本 Linux 内核中用于整个内核互斥的全局锁。它已被弃用并移除。\n\n\
  这些锁机制对于确保内核空间中的同步至关重要，特别是在开发内核驱动程序时。每种锁类型取决于特定的需求，例如是否需要睡眠、读写频率以及受保护区域的重要性。理解并正确实现这些锁对于编写高效的内核代码至关重要。\n\
  \n## 总结\n\n本章介绍了 Linux 调度器如何工作、kthreads 管理、工作队列以及与任务管理相关的其他。内核线程 (kthreads) 是运行在内核空间的轻量级线程，允许独立于用户进程执行任务。工作队列提供了一种结构化的方式，将执行推迟到特定的内核工作线程，从而允许阻塞操作。\n\
  \n对于同步，存在多种锁机制：自旋锁对于短临界区非常高效，但会导致忙等；而互斥锁和信号量在发生冲突时会将线程设置为睡眠，从而提高 CPU 效率。读写锁通过允许多个并发读取同时确保独占写入访问来优化性能。序列锁和\
  \ RCU 适用于读多型工作负载，能够在最小竞争的情况下实现无锁读取。\n\n选择合适的同步机制对于性能至关重要，需要在效率、公平性和响应之间取得平衡。\n\n\
  在下一章中，我们将学习如何调试和安装 Linux 驱动以及内核本身。\n\n# 第 13 章调试 GNU/Linux 内核与驱动](#contents.xhtml_ch13a)\n\
  \n引言\n\n本章解释了如何调试新的内核或驱动。为了这一点，我们将学习多种技术。在运行的内核空间开发驱动程序比在用户空间复杂得多。事实上，断点的使用只能通过串口或以太网从另一台机器来实现。这就是为什么创建了探针，以尽可能减少干扰。\n\
  \n\n\n\n\n下图展示了在 GNU/Linux 内核调试驱动程序时使用的不同方法的概述：\n\n![](img/Figure13.1.png)\n\n图\
  \ 13.1：某些调试调查总结\n\n## 结构\n\n本章涵盖以下主题：\n\n* GNU/Linux 内核调试选项\n* Magic SysRq 键\n*\
  \ 通过打印进行调试\n* 动态调试\n* kgdb/kdb 内核调试器\n* 内核探针 (Kernel probes)\n* OOPS\n* 性能分析 (Profiling)\n\
  \n## 目标\n\n在本章结束时，你将理解如何调试你的驱动程序。事实上，任何软件设计都可能涉及这一步，特别是内核和驱动程序运行在与用户世界隔离的特权环境中。此外，一个错误的步骤可能会导致整个系统阻塞和崩溃。\n\
  \n## GNU/Linux 内核调试选项\n\n在开发模式下调试 GNU/Linux 内核需要启用特定的内核配置选项。\n\n这些选项改进了内核提供详细诊断信息的能力，便于运行时调试，并有助于检测错误。\n\
  \n这些选项可以在 GNU/Linux 内核配置工具的“Kernel hacking”（内核黑客）或“Kernel debugging”（内核调试）菜单中找到。然而，重要的是，某些选项在所有架构上并不可用。\n\
  \n以下是一些常用于调试内核和驱动程序的常用 GNU/Linux 内核配置选项列表：\n\n* `CONFIG_DEBUG_KERNEL`: 启用内核中的调试选项；启用它是强制的，但不会启用任何其他功能。\n\
  * `CONFIG_DEBUG_SLAB`: 在内核内存分配函数中启用多种验证机制，以检测内存溢出和未初始内存访问错误。每个分配的字节在返回给调用者之前初始化为\
  \ `0xA5`，在释放时设置为 `0x6B`。如果这些模式出现在驱动程序日志或内核 oops 消息中，它们表示特定类型的内存损坏。当启用调试时，内核会在每个分配的内存块前后插入哨兵值；对这些值的任何修改都意味着缓冲区溢出，从而触发异常。还会强制执行额外的高级完整性检查。\n\
  * `CONFIG_DYNAMIC_DEBUG`: 启用动态调试功能，允许在运行时启用或禁用调试消息。\n* `CONFIG_LOCKDEP`: 启用锁依赖检查，用于检测内核中的死锁和其他锁定问题。\n\
  * `CONFIG_PROVE_LOCKING`: 扩展 `CONFIG_LOCKDEP` 的功能，以证明锁的正确性并在编译时发现潜在的死锁。\n* `CONFIG_DEBUG_PAGEALLOC`:\
  \ 启用后，在释放内存时从内核地址空间移除整个页。注意，此选项可能会显著降低内核速度，但对于识别某些类型的内存损坏错误很有用。\n* `CONFIG_DEBUG_SPINLOCK`:\
  \ 启用对内核中未初始化自旋锁的操作的拦截以及各种其他错误（例如两次解锁锁）。\n* `CONFIG_DEBUG_SPINLOCK_SLEEP`: 启用后，此选项允许检查持有自旋锁时的尝试睡眠的情况。如果检测到错误，可以调用可能导致睡眠的函数，即使初始调用不会睡眠。\n\
  * `CONFIG_INIT_DEBUG`: 启用此选项时，标记为 `_init`（或 `_initdata`）的项将在系统初始化后或模块加载后立即被移除。这允许检查在启动时初始化完成后尝试访问内存的代码。\n\
  * `CONFIG_DEBUG_INFO`: 导致内核在编译时包含完整的调试信息。如果你想用 `gdb` 调试内核，将需要这些信息。如果你计划使用 `gdb`，可能还想启用\
  \ `CONFIG_FRAME_POINTER`。\n* `CONFIG_MAGIC_SYSRQ`: 激活“magic SysRq”键。\n* `CONFIG_DEBUG_STACKOVERFLOW`\n\
  * `CONFIG_DEBUG_STACK_USAGE`: 启用后，这有助于检测 GNU/Linux 内核中的栈溢出。第一个选项为内核添加显式的溢出检查，而第二个选项强制内核监控栈的使用并生成可通过\
  \ SysRq 魔法键提供的统计数据。\n* `CONFIG_KMEMCHECK`: 帮助检测未初始化内存的使用，可以捕捉微妙的内存相关 bug。\n* `CONFIG_DEBUG_MEMORY_INIT`:\
  \ 确保内存分配被显式初始化，有助于捕捉与使用未初始化内存相关的问题。\n* `CONFIG_DEBUG_PAGEALLOC`: 延迟释放内存以捕捉释放后使用（use-after-free）错误。\n\
  * `CONFIG_SLUB_DEBUG`: 为 SLUB 分配器提供广泛的检查和统计，用于调试 SLUB 内存问题。\n* `CONFIG_KALLSYMS`:\
  \ 启用（在 General Configuration/Standard Features 下），允许生成在 GNU/Linux 内核静态部分编译并用的符号列表；此选项默认启用。此符号信息用于调试上下文，例如分析\
  \ oops，它可以显示仅带十六进制显示的内核符号地址的堆栈跟踪，如果你没有映射，则非常没用。在通过 `kdb` 或 `kgdb` 调试时也非常有用。\n* `CONFIG_IKCONFIG`\n\
  * `CONFIG_IKCONFIG_PROC`: 启用（在 General Configuration 菜单下），此选项会导致从内核中提取完整的内核配置状态并通过\
  \ `/proc` 提供。通常，GNU/Linux 内核的选项列表是已知的，或者可以通过内核源码中的 `.config` 文件获取（见第 2 章《Linux 内核简介》）。然而，如果你尝试调试他人构建的内核中的问题，通过重新构建\
  \ `.config` 文件，它们可能是很有用的，然后可以使用它可以重新编译新内核。\n* `CONFIG_ACPI_DEBUG`: 启用（在 Power Management/ACPI\
  \ 下），此选项在怀疑有 ACPI 相关问题时提供有关高级配置和电源接口（ACPI）调试的详细信息访问。\n* `CONFIG_DEBUG_DRIVER`: 在\
  \ GNU/Linux 内核驱动中启用调试信息。这对于检测接近硬件的底层代码中的问题通常是甚至是必要的。\n* `CONFIG_SCSI_CONSTANTS`:\
  \ 启用（在 Device Drivers/SCSI Device Support 下），此选项允许向详细的 SCSI 错误消息添加信息。\n* `CONFIG_FTRACE`:\
  \ 启用函数跟踪基础设施，允许你跟踪内核代码中的函数调用。\n* `CONFIG_FUNCTION_TRACER`\n* `CONFIG_FUNCTION_GRAPH_TRACER`:\
  \ 这些选项提供整个内核函数调用和返回的跟踪，有助于性能分析和调试。\n* `CONFIG_STACKTRACE`: 在内核的不同部分提供堆栈跟踪支持，有助于诊断问题或崩溃。\n\
  * `CONFIG_SCHED_DEBUG`: 从调度程序提供详细的调试输出，提供调度行为和潜在问题的见解。\n* `CONFIG_DEBUG_LIST`: 通过在链表周围执行额外检查，帮助检测列表处理问题。\n\
  * `CONFIG_BUG_ON_DATA_CORRUPTION`: 在检测到数据损坏时触发内核 `BUG`，对于早期捕捉损坏的状态至关重要。\n* `CONFIG_X86_DEBUG_FPU`（针对\
  \ x86 架构）：跟踪 FPU 使用以捕捉 FPU 状态损坏，特别是在复杂的驱动程序交互中。\n* `CONFIG_ARM_UNWIND`（针对 ARM 架构）：在\
  \ ARM 上启用栈回溯支持，这对于生成堆栈跟踪至关重要。\n* `CONFIG_KGDB`: 通过串口或 USB 使用 `gdb` 进行内核调试，提供了一个交互式调试内核问题的强大接口。\n\
  * `CONFIG_KASAN`（内核地址消毒器）：检测内存错误，如缓冲区溢出或释放后使用漏洞，这对驱动程序开发至关重要。\n\n要了解如何在你的内核中激活选项，请参阅第\
  \ 2 章《Linux 内核简介》获取更多解释。\n\n\n\n\n\n## Magic SysRq 键\n\nMagic SysRq 键是 Linux 内核的一个特性，提供了一种通过键盘直接向内核发送命令的方法，这在系统无响应的情况下可能极其有用。当系统遇到严重的崩溃或冻结时，该功能通常用于恢复和调试目的。\n\
  \nMagic SysRq 键通过键盘上的按键组合激活。通常，它涉及以下按键：\n\n* `Alt`\n* `SysRq`（通常与 Print Screen 打印屏幕键共用）\n\
  * 另一个按键代表特定的命令。\n\n在使用 magic SysRq 命令之前，你必须确保在你的 Linux 内核中启用了该功能。它可以通过两种主要方式启用：\n\
  \n* 内核配置：在编译内核时，确保启用了 `CONFIG_MAGIC_SYSRQ`。\n* 运行时配置：修改 `/proc/sys/kernel/sysrq`\
  \ 文件来控制功能：\n    * 写入 `1` 启用所有功能。\n    * 写入 `0` 禁用所有。\n    * 写入其他值可根据位掩码选择性地启用特定功能。\n\
  \n要在运行时启用所有功能，你可以使用：\n\n```bash\necho 1 > /proc/sys/kernel/sysrq\n```\n\n使用这些命令：\n\
  \n* 确保你的系统上已启用 SysRq 功能，如前所述。\n* 记住使用这些某些命令可能会导致数据丢失（特别是在没有先使用 `s` 和 `u` 的情况下使用\
  \ `b` 和 `o`）。\n* 这些命令通常在其他更标准的工具和方法失效时使用，例如系统挂起或硬件相关的冻结。\n\nmagic SysRq 提供的命令可以作为系统管理员在处理无响应的\
  \ Linux 系统时的最后手段工具箱。\n\n是一些常用的 magic SysRq 组合键组合及其效果。在按住 `Alt` 和 `SysRq` 键的同时按下这些键：\n\
  \n* `reisub`: 这是一个用于安全重启冻结系统的系列命令的助记符：\n    * `r`: 将键盘从原始模式（raw mode）切换到 `XLATE\
  \ mode`。\n    * `e`: 向除 `init` 之外的所有进程发送 `SIGTERM` 信号。\n    * `i`: 向除 `init` 之外的所有进程发送\
  \ `SIGKILL` 信号。\n    * `s`: 同步（`sync`）所有已挂载的文件系统，将其相关数据缓存刷入磁盘。\n    * `u`: 将所有文件系统重新挂载为只读。\n\
  \    * `b`: 在不同同步或未卸载磁盘的情况下立即重启系统。\n* `b`: 重启：在不卸载或同步文件系统的情况下立即重启系统。\n* `c`: 崩溃：通过触发\
  \ `NULL` 指针解引用导致内核崩溃，这对于测试崩溃恢复和产生崩溃转储（crash dumps）很有用。\n* `d`: 显示所有锁定状态：显示当前持有的所有锁。\n\
  * `e`: SIGTERM: 向除 `init` 之外的所有进程发送 `SIGTERM` 信号，给它们优雅退出的机会。\n* `F`: OOM Killer:\
  \ 启动内存溢出杀死器，以杀死占用大量内存且未响应 `SIGTERM` 信号的进程。\n* `g`: 生成崩溃转储：（在配置了 `kump` 或类似崩溃转储机制的系统上）触发崩溃转储。\n\
  * `h`: 帮助：显示帮助。显示所有可用的 SysRq 键及其操作。\n* `i`: SIGKILL: 向除 `init` 之外的所有进程发送 `SIGKILL`\
  \ 信号，强制它们立即终止。\n* `j`: 解冻文件系统：解冻所有冻结的文件系统，撤销 `SysRq-s` 的效果。\n* `k`: 安全键盘输入：杀死当前虚拟控制台上的所有程序，用于安全登录屏幕。\n\
  * `l`: 显示所有活动 CPU 的堆栈回溯：在控制台中显示所有活动处理器的堆栈跟踪。\n* `m`: 内存信息：显示当前内存使用情况，对于诊断内存相关问题有用。\n\
  * `n`: Nice 级别：将所有 `RT` 任务设置为静态优先级为 `0` 的普通调度策略（有助于从某些死锁中恢复）。\n* `o`: 关机：立即关闭你的计算机。\n\
  * `p`: 显示寄存器：向控制台显示当前寄存器和标志位，用于诊断问题或崩溃。\n* `q`: 查询其他 CPU：显示除当前 CPU 之外的所有 CPU 回溯。\n\
  * `r`: 关闭键盘原始模式：禁用原始键盘模式并将其设置为 `XLATE mode`，帮助在紧急情况下重新获得键盘的控制权。\n* `s`: 同步磁盘：尝试通过将数据刷入磁盘来同步所有挂载的文件系统。\n\
  * `t`: 任务列表：在控制台中显示当前任务列表以及一些关联信息。\n* `u`: 卸载：尝试将所有挂载的文件系统重新挂载为只读模式。\n* `v`: 如果屏幕变黑时使用，通过强制恢复帧（framebuffer）来恢复。\n\
  * `w`: 显示阻塞任务：显示在资源上被阻塞的任务，用于死锁诊断。\n* `x`: 用于 Xen：如果你运行在 `Xen` 虚拟化程序上，`x` 键可用于特殊的\
  \ `Xen` 操作。\n* `z`: 冻结文件系统：冻结所有文件系统，使其在不卸载的情况下变为只读状态。\n\nMagic SysRq 命令是强大的工具，特别是在传统方法失效的系统恢复或紧急场景下。然而，应该谨慎使用它们，因为某些命令（如立即重启或杀死命令）如果文件系统没有被正确同步或进程被突然终止，可能会导致数据丢失。\n\
  \n由于其功能强大的强大性，对 magic SysRq 的访问应该受到限制，特别是在具有物理安全考虑或多用户环境中。\n\n\n\n\n\n# 表 13.1:\
  \ GNU/Linux 内核中的调试级别列表\n\n| 级别 | 字符串 | 别名 | 说明 |\n| :--- | :--- | :--- | :--- |\n\
  | `KERN_WARNING` | “4” | `pr_warn()` | 与内核相关的烦人情况警告，但问题程度低于错误。 |\n| `KERN_NOTICE`\
  \ | “5” | `pr_notice()` | 驱动程序运行中的正常情况，但值得提及。大多数与安全相关的消息在此跟踪级别报告。 |\n| `KERN_INFO`\
  \ | “6” | `pr_info()` | 许多驱动程序使用的信息性消息，用于显示启动时发现的硬件有用信息。 |\n| `KERN_DEBUG` | “7”\
  \ | 如果定义了 `DEBUG` 则使用 `pr_debug()` 和 `pr_devel()` | 用于调试消息。 |\n| `KERN_DEFAULT`\
  \ | “c” | | 默认内核日志级别。 |\n| `KERN_CONT` | “” | `pr_cont()` | 日志打印的“延续”行（仅在不包含换行符\
  \ \\n 的行之后执行）。 |\n\n## 调整日志级别\n\n调整日志级别有助于管理日志消息的冗余程度，这在生产环境中特别有用。\n\n`printk` 宏的日志级别指定了消息本身重要性。\n\
  \n内核可以根据其日志级别以及通过内核变量定义并可通过 `procfs` 修改的当前 `console_loglevel`，决定是否立即通过打印到当前控制台来显示消息。\n\
  \n如果消息具有较高的优先级级别和较低的日志级别，则该消息将打印在控制台上。\n\n如果未指定日志级别，该消息将具有 `KERN_DEFAULT` 优先级。\n\
  \n可以使用以下命令查看当前日志级别或优先级：\n\n```bash\ncat /proc/sys/kernel/printk\n4 4 1 7\n```\n\n\
  此命令显示了一组四个日志级别：当前、默认、最小，最后是启动时的默认值。\n\n要修改当前日志级别，只需向 `/proc/sys/kernel/printk` 写入所需的级别即可。例如，若要在控制台上选择所有调试消息，只需简单使用\
  \ `dmesg` 命令：\n\n```bash\nsudo echo 5 > /proc/sys/kernel/printk\n```\n\n然后可以使用 `dmesg`\
  \ 命令从终端查看内核跟踪信息：\n\n```bash\nsudo dmesg -w\n```\n\n![](img/Figure13.2.png)\n图 13.2:\
  \ 使用 `dmesg` 命令的结果示例\n\n另一种方法，使用 `dmesg`：\n\n```bash\nsudo dmesg -n 7\n```\n\n通过此命令，可以为\
  \ `dmesg` 指定用于过滤显示的日志级别。\n\n## 速率限制 (Rate Limiting)\n\nLinux 内核提供了几种处理日志消息速率限制的机制。用于此目的的主要函数是\
  \ `printk_ratelimit()`。该函数允许以特定的速率打印日志消息，有助于防止缓冲区被重复的消息淹没。\n\n`printk_ratelimit()`\
  \ 函数通常与 `printk()` 函数配合使用。以下是你可能在内核模块或驱动程序中看到它的用法：\n\n```c\nif (printk_ratelimit())\
  \ {\n    printk(KERN_INFO \"This message is rate-limited!\\n\");\n}\n```\n\n这段代码段将日志消息的频率限制为内核中定义的默认值，这些值通常设置为允许突发\
  \ 10 条消息，随后每 5 秒允许一条消息。这些参数可以通过以下 `sysctl` 设置进行调整：\n\n* `/proc/sys/kernel/printk_ratelimit`:\
  \ 设置内核消息之间的间隔；单位为秒。\n* `/proc/sys/kernel/printk_ratelimit_burst`: 设置在应用限制之前允许的突发消息数，并防止突发流量。\n\
  \n在实践中，速率限制对于错误条件可能在短时间内记录大量错误消息的场景非常有用。例如：\n\n* 重复触发中断的硬件错误。\n* 在特定条件下遇到频繁数据包错误的网络驱动程序。\n\
  * 由于磁盘问题导致的文件系统错误可能会许多类似的日志条目。\n\n虽然速率限制对于保持日志的可管理性和防止日志引发的性能问题很有用，但如果配置不当，可能会抑制重要消息。开发者必须在信息需求与日志泛滥的风险之间取得平衡。\n\
  \n在某些情况下，根据系统状态动态调整速率限制可能是有益的。`printk_ratelimit()` 不直接支持这一点，但可以通过根据外部因素条件地调用该函数来实现。\n\
  \n对于更复杂或可调整的日志机制，开发者可能会使用动态调试 (`CONFIG_DYNAMIC_DEBUG`) 或在他们的驱动程序或模块代码中实现自己的日志控制，可能对何时记录日志和何时保留消息使用更复杂的标准。\n\
  \n总的来说，`printk_ratelimit()` 是运行时控制内核日志冗余性的一个简单有效的工具，有助于在发生潜在的日志风暴时维持系统的稳定性能。\n\n\
  ## 用户空间日志 (Userspace Logging)\n\n在某些情况下，特别是在自动化测试期间，向内核日志缓冲区插入消息以注释正在发生的情况非常有用：\n\
  \n```bash\necho \"Start debugging\" > /dev/kmsg\n```\n\n当然，此消息接收的是默认日志级别，如果你想例如发布一条\
  \ `KERN_DEBUG` 消息，你必须使用日志级别的特殊字符串表示——在这种情况下为 `\"<2>\"`。该特殊字符串与内核内部使用的日志级别字符串不同，以便从用户空间更容易使用。日志级别的\
  \ ASCII 值被括号括起来。（从历史上，这是内部日志级别字符串的表示方式，因此为了后兼容，保留了从用户空间提交的日志消息格式）：\n\n```bash\n\
  echo \"<7>Start debugging (from userspace)\" >/dev/kmsg\n```\n\n该消息将与其他任何内核消息一样显示——没有办法区分它们！\n\
  \n注意：我们从用户空间打印内核消息，这与 `printf()` 调用非常不同。\n\n如果 `/dev/kmsg` 不存在，可以使用以下命令创建：\n\n```bash\n\
  sudo mknod -m 600 /dev/kmsg c 1 11\n```\n\n默认情况下，设备 `/dev/kmsg` 属于 `root:root`，但可以使用管理员组更改组：\n\
  \n```bash\nsudo groupadd admingroup\nsudo chown :admingroup /dev/kmsg\n```\n\n然后我们可以增加该组对\
  \ `/dev/kmsg` 的权限：\n\n```bash\nsudo chmod u=rw,g=rw,o=r /dev/kmsg\n```\n\n所有的 `printk`\
  \ 消息都存储在环形缓冲区中，可以通过 `dmesg` 查看。该缓冲区有固定大小，旧消息会被新消息覆盖。\n\n可以使用 `dmesg`、`trace-cmd`、`ftrace`\
  \ 和 `perf` 命令提取和分析内核日志及跟踪信息。\n\n\n\n\n动态调试具有更多实用的功能。事实上，一种简单的查询语言允许通过匹配以下 0 或 1\
  \ 的任意组合来启用或禁用调试语句：\n\n- 源文件名\n- 函数名\n- 行号（包括行号范围）\n- 模块名\n- 格式化字符串\n\n这些宏允许在运行时动态启用或禁用调试消息，从而在不需要调试时减少性能开销。\n\
  \n###  own\n这些宏通过 `/sys/kernel/debug/dynamic_debug/control` 进行控制，允许对调试输出进行精粒度控制：\n\
  \n```c\n#define pr_fmt(fmt) \"%s:%s: \" fmt, KBUILD_MODNAME, __func__\n#define pr_info(fmt,\
  \ ...) eprintf(0, verbose, pr_fmt(fmt), ##__VA_ARGS__)\n\ndev_dbg(dev, \"Device-specific\
  \ debug message: %d\\n\", value);\n\n#define pr_info(fmt, ...) eprintf(0, verbose,\
  \ pr_fmt(fmt), ##__VA_ARGS__)\n```\n\n通过 `/sys/kernel/debug/dynamic_debug/control`\
  \ 在运行时对其控制。\n\n使用 `echo` 命令启用/禁用特定驱动程序的消息，例如：\n\n```bash\n# echo -n 'file svcsock_bpb.c\
  \ line 1603 +p' > <debugfs>/dynamic_debug/control\n# echo -n ' file svcsock_bpb.c\
  \ line 1603 +p ' > <debugfs>/dynamic_debug/control\n# echo -n 'file svcsock_bpb.c\
  \ line 1603 +p' > <debugfs>/dynamic_debug/control\n# echo \"file drivers/usb/* +p\"\
  \ > <debugfs>/dynamic_debug/control\n# echo 'file driver_bpb.c +p' > /sys/kernel/debug/dynamic_debug/control\n\
  ```\n\n### 如何使用动态调试\n- **访问控制文件**：导航到 `/sys/kernel/debug/dynamic_debug/control`。你可能需要\
  \ root 权限来查看和修改此文件。\n- **查看当前设置**：要查看当前的动态调试设置，可以使用 `cat` 命令：\n  ```bash\n  $ cat\
  \ /sys/kernel/debug/dynamic_debug/control\n```\n- **修改设置**：要启用或禁用特定消息的调试输出，向控制文件写入命令。这些命令可以按源文件、行号、模块名和函数进行过滤，并启用或禁用日志。\n\
  \n示例，启用特定源文件中的所有消息：\n```bash\n$ echo 'file my_module.c +p' > /sys/kernel/debug/dynamic_debug/control\n\
  ```\n- **禁用特定函数的所有消息**：\n  ```bash\n  $ echo 'func my_function -p' > /sys/kernel/debug/dynamic_debug/control\n\
  ```\n\n控制文件支持使用匹配描述符的简单查询语言进行查询。你可以使用这些查询来精炼哪些调试语句被启用或禁用：\n- 文件：`file filename.c`\n\
  - 行号：`line 1234`\n- 模块：`module mymodule`\n- 函数：`func my_function`\n\n开发者可以只对感兴趣系统部分开启调试，减少噪声和开销。\n\
  \n由于调试可以在不需要时关闭，因此与将静态调试编译到内核中相比，其性能影响微乎其微。\n\n可以在不重启或重新编译内核的情况下控制调试，这对于调试活动系统或难以复现的系统具有极价值。\n\
  \n动态调试是 Linux 内核开发者的强大工具，提供了一种灵活的方法以受控、按需的方式管理调试输出。这使其成为开发和生产环境中开发与故障排除的极佳选择。\n\n\
  ## kgdb/kdb 内核调试器\n内核有两个与 GNU/Linux 内核交互的接口可用于调试：`kdb` 和 `kgdb`。\n\n如果你在编译和运行时为内核配置了正确的选项，可以使用这些调试接口之一，甚至可以在它们之间进行动态切换。\n\
  \n`kdb` 是一个简单的 shell 或命令行界面，你可以在带有键盘和/或串口控制器的系统控制台上使用它。它可以检查内存、寄存器、进程列表、`dmesg`，甚至可以设置断点在内核的特定点停止。\n\
  \n`kdb` 不是一个源码级调试器，尽管可以设置断点并对内核执行进行基本监控。`kdb` 主要用于执行分析任务以辅助开发或诊断内核问题。因此，如果代码在创建时使用了\
  \ `CONFIG_KALLSYMS`，你可以通过名称访问内核内置函数或内核模块中的某些符号。\n\n`kgdb`（类似于 `gdb-server`）旨在作为一个与\
  \ Linux 内核源码关联的调试器。它与 `gdb`（客户端）配合使用来调试 Linux 内核。目标是让 `gdb` 可以被广泛用于检查内存和变量并浏览调用栈信息，就像用户空间应用程序开发者使用\
  \ `gdb` 调试应用程序一样。因此，可以在内核代码或动态模块中设置断点并执行某些有限的执行步骤。\n\n为了这一点，使用 `kgdb` 需要两台机器。其中一台是存放所有源码并进行编译的开发机，另一台是用于执行正在开发的内核本身的目标机。事实上，想象一下如果只有一台机器用于开发，在内核中使用断点将停止主机操作系统。后者在专门用于开发的\
  \ `vmlinux` 文件（未压缩）上运行 `gdb` 实例，该文件包含了所有符号；此镜像与启动时使用的镜像（如 `bzImage`、`zImage`、`uImage`）不同。开发者由开发者指定串口或\
  \ IP 连接参数，然后连接到 `kgdb` 模块。开发者与 `gdb` 建立的连接类型取决于测试机内核中编译为内置模块或可加载内核模块的 `kgdb` 输入/输出\
  \ (I/O) 模块是否可用。\n\n### KDB\n要使用 `kdb`，需要在内核配置中启用它：\n1. 内核破解：\n   - 内核调试\n   - 使用调试信息编译内核\n\
  \   - 为内核提供 Oops 跟踪\n   - KGDB: 内核调试器\n   - 为 kgdb 包含 kdb 前端\n   - 网络上的 KGDB (KGDBoE)\n\
  \n内核配置提取：\n```text\n- CONFIG_KGDB=y\n- CONFIG_KGDB_SERIAL_CONSOLE=y\n- CONFIG_KGDB_KDB=y\n\
  - CONFIG_KGDB_TESTS=y\n- CONFIG_NETCONSOLE=y\n- CONFIG_NETPOLL=y\n- CONFIG_NETPOLL_KGDB=y\n\
  ```\n2. 保存配置并重建内核：\n   ```bash\n   $ make\n   $ make modules\n   $ make install\n\
  \   $ make modules_install\n   ```\n3. 使用新内核重启系统。在 GNU/Linux 内核命令行中添加以下启动参数以通过串口启用\
  \ `kdb`：\n`kgdboc=ttyS0,115200 kgdbwait`\n\n代码解释如下：\n- `kgdboc=ttyS0,115200`:指定\
  \ `kgdb` 的串口控制台。\n- `kgdbwait`:停止内核并等待调试器附加。\n4. 系统启动后，你可以通过触发断点进入 `kdb`：\n   ```bash\n\
  \   $ echo g > /proc/sysrq-trigger\n   ```\n\n在 `kdb` 中，你可以使用各种命令检查系统：\n- `bt`:打印堆栈回溯。\n\
  - `ps`:显示当前任务。\n- `lsmod`:列出已加载的模块。\n- `dmesg`:显示内核消息缓冲区。\n- `go`:继续正常执行。\n\n###\
  \ KGDB\n遵循与 `kdb` 相同的步骤，在内核配置中启用 `kgdb`。你需要两台机器：目标机（运行要调试的内核）和主机（运行 `gdb`）。\n\n\
  使用空调制解调串口线连接目标机和主机。在目标机上，在引导加载程序中指定 `kgdboc` 参数：\n`kgdboc=ttyS0,115200 kgdbwait`\n\
  \n或者，\n```bash\n$ sudo modprobe kgdboc\n$ sudo modprobe netconsole\n$ sudo modprobe\
  \ netpoll\n$ sudo modprobe netpoll_kgdb\n$ sudo echo \"kgdboe=@eth0,192.168.1.100/,@192.168.1.50/\"\
  \ > /sys/module/kgdboe/parameters/kgdboe\n$ sudo echo g > /proc/sysrq-trigger\n\
  ```\n\n在主机上，确保你已安装了 `gdb`，然后使用 `vmlinux` 文件启动 `gdb`：\n```bash\n$ gdb /path/to/vmlinux\n\
  ```\n\n你现在可以使用 `gdb` 调试目标机上的内核：\n- `break function_name`: 设置断点。\n- `continue`: 继续执行到下一个断点。\n\
  - `step/next`: 单步执行代码。\n\n\n\n\n\n- `print variable`: 打印变量的值。\n- `bt`: 显示回溯（backtrace）。\n\
  \n连接到目标机器：\n\n```\ntarget remote /dev/ttyS0\n```\n\n或者，\n\n```\ntarget remote udp:192.168.1.100:6443\n\
  ```\n\n设置断点：\n\n```\nbreak do_fork\n```\n\n继续执行：\n\n```\ncontinue\n```\n\n单步执行代码：\n\
  \n```\nstep\n```\n\n检查变量：\n\n```\nprint some_variable\n```\n\n显示回溯：\n\n```\nbt\n\
  ```\n\n继续执行：\n\n```\ncontinue\n```\n\n通过遵循这些步骤，你可以使用 `kdb` 和 `kgdb` 有效地调试 Linux\
  \ 内核。\n\n## 内核探针 (Kernel probes)\n\n内核探针，特别指 `Kprobes` 和 `Kretprobes`，是 Linux 内核中强大的诊断工具，允许开发人员动态地检查和调试内核行为。这些工具对于在不需要重启系统或永久修改内核代码的情况下，识别内核中的性能问题和\
  \ bug 至关重要。\n\n探针有两种类型：`kprobes` 和 `kretprobes`（也称为返回探针）。\n\n`kprobe` 可以插入到几乎任何内核指令上。`kretprobes`\
  \ 探针会在特定函数的返回时触发。\n\n基于 Kprobes 的插桩被封装成动态模块。此类模块的 `init` 函数安装一个或多个探针，而 `exit` 函数负责移除它们。诸如\
  \ `register_kprobe()` 之类的注册函数指示了探针应该插入的位置，以及当探针触发时应该调用哪个处理函数（handler）。\n\n还有 `register_/unregister_*probes()`\
  \ 函数用于注册/注销一组探针。当你需要一次注销多个探针时，这些功能可以简化注销阶段的操作。\n\nKprobes 可以探测除自身以外的大多部分内核部分。这意味着有某些函数是\
  \ `kprobes` 无法探测的。探测一个函数可能会导致发生双重故障（double fault）导致递归终止，或者嵌套的探针处理程序永远不会被调用。Kprobes\
  \ 还维护了一个函数列表作为黑名单。如果你想将一个函数添加到黑名单，只需包含 `linux/kprobes.h` 并使用 `NOKPROBE_SYMBOL()`\
  \ 宏。事实上，Kprobes 会根据黑名单检查给定的探针的地址，如果给定的地址在黑名单中，将拒绝注册。\n\n## Kprobe\n\nKprobes 允许你监控任何内核例程，并在不中断的情况下收集调试和性能信息。\n\
  \n它们的设计尽可能保持了非侵入性，这使得它们对于无法承受高开销或失败风险的生产系统特别有用：\n\n- **功能**：`Kprobe` 可以设置在内核空间中的几乎任何指令上。当内核执行该指令时，探针点会触发自定义的句柄函数。\n\
  - **用途**：常见用途包括检查数据结构的状态、跟踪性能指标以及记录特定事件。\n\nKprobe 数据结构：`struct kprobe` 定义在 Linux\
  \ 内核头文件中，特别是 `<linux/kprobes.h>` 中。该结构封装了设置探针所需的所有信息，包括放置探针的位置、要调用的处理函数以及特定探针的可选数据。以下是\
  \ `struct kprobe` 中主要字段的详细说明：\n\n- `kprobe_addr`:\n    - 类型：`void *`\n    - 描述：种植\
  \ `kprobe` 的地址。如果使用了 `kprobe.symbol_name`，则 `kprobe_addr` 将解析为与符号名称对应的地址。\n- `offset`:\n\
  \    - 类型：`unsigned long`\n    - 描述：从 `kprobe_addr` 放置探针的偏移量。用于探测特定函数或内存区域内的地址。\n\
  - `symbol_name`:\n    - 类型：`const char *`\n    - 描述：要放置探针的符号名称。内核在注册期间将其解析为地址。\n\
  - `pre_handler`:\n    - 类型：`int (*)(struct kprobe *, struct pt_regs *)`\n    - 描述：指向在执行被探测指令之前将调用的函数指针。\n\
  - `post_handler`:\n    - 类型：`void (*)(struct kprobe *, struct pt_regs *, unsigned\
  \ long)`\n    - 描述：指向在被探测指令执行后立即调用的函数指针。第三参数包含命中探针点之前的标志寄存器内容。\n- `fault_handler`:\n\
  \    - 类型：`int (*)(struct kprobe *, struct pt_regs *, int)`\n    - 描述：可选处理程序，如果执行探针导致故障（如页错误），则会被调用。它可以用于处理特定错误或在需要时进行清理。\n\
  - `addr`:\n    - 类型：`unsigned long`\n    - 描述：内部用于存储实际安装探针的地址。通常在注册过程中设置。\n- `opcode`:\n\
  \    - 类型：`kprobe_opcode_t`\n    - 描述：存储被断点指令替换的原始操作码。这在移除探针时内部内部恢复原始代码。\n- `flags`:\n\
  \    - 类型：`kprobe_flags_t`\n    - 描述：控制 `kprobe` 行为各种内部方面的标志位。\n\nkprobes 的组件如下：\n\
  \n- **探针点 (Probe points)**：内核代码中附加探针的具体位置。这些可以是函数名或内核中的特定地址。\n- **处理函数 (Handler\
  \ functions)**：你编写的在命中探针点时调用的自定义函数。通常有两种类型：\n    - 前处理程序 (Pre-handler)：在被探测指令之前运行。\n\
  \    - 后处理程序 (Post-handler)：在被探测指令之后立即运行。\n\n定义一个 kprobe：指定目标函数或地址，并定义一个处理函数：\n\n\
  ```c\n#include <linux/kprobes.h>\n\nstatic int handler_pre(struct kprobe *p, struct\
  \ pt_regs *regs) {\n    printk(KERN_INFO \"Pre-handler: probe hit at %p\\n\", p->addr);\n\
  \    return 0; // 0 意味着继续执行\n}\n\nstruct kprobe kp = {\n    .symbol_name = \"do_fork\"\
  ,\n    .pre_handler = handler_pre,\n};\n```\n\n注册 kprobe：\n\n```c\nint ret = register_kprobe(&kp);\n\
  if (ret < 0) {\n    printk(KERN_INFO \"Failed to register kprobe\\n\");\n    return\
  \ ret;\n}\n```\n\n## KRETPROBE\n\nKretprobes 是 Kprobes 的变体，侧重于函数的返回点。\n\n它们允许你拦截内核函数的返回，这对于检查函数执行后的状态和输出特别有用：\n\
  \n- **功能**：`Kretprobe` 附加到函数的入口处，并自动在栈上的返回地址处放置断点。当函数返回时，将调用你的处理函数。\n- **用途**：通常用于错误检查和记录内核函数的结果。\n\
  \n定义一个 Kretprobe：设置一个 kretprobe 及其处理函数：\n\n```c\nstatic int handler_ret(struct kretprobe_instance\
  \ *ri, struct pt_regs *regs) {\n    printk(KERN_INFO \"Return-handler: probe hit\
  \ at %p\\n\", ri->rp->kp.addr);\n    return 0;\n}\n\nstatic struct kretprobe rp\
  \ = {\n    .handler = handler_ret,\n    .kp.symbol_name = \"do_fork\",\n    .maxactive\
  \ = 20, // 同时活跃的探测函数最大实例数\n};\n```\n\n注册 Kretprobe：\n\n```c\nint ret = register_kretprobe(&rp);\n\
  if (ret < 0) {\n    printk(KERN_INFO \"Failed to register kretprobe\\n\");\n   \
  \ return ret;\n}\n```\n\n最佳实践如下：\n\n- **最小化影响**：确保处理函数尽可能简单、快速，以最小化其对系统的影响。\n- **安全与清理**：在不再需要探针或移除模块时，始终提供清理代码以注销探针。\n\
  - **错误处理**：正确处理注册和设置期间潜在的失败。\n\nKprobes 和 Kretprobes 为动态内核分析提供了灵活且强大的机制，对于内核开发人员和系统管理员来说都是不可或缺的工具。\n\
  \n\n\n\n\n| 特性 | Kprobe | Kretprobe |\n| :--- | :--- | :--- |\n| 优点 | 可以附加到内核代码中的几乎任何点。不激活时开销极小。不需要修改代码。\
  \ | 特别适用于在函数返回时捕捉数据。自动处理保存和恢复寄存器状态。 |\n| 用场景 | 监控或拦截任何内核函数或指令。适用于追踪难以发现的错误。 | 检查函数返回值和执行后状态的理想选择。在函数执行后的性能分析中有用。\
  \ |\n| 灵活性 | 极高的灵活性，可以在几乎任何内核指令上进行探测。 | 灵活性低于 Kprobes，因为它们仅用于函数返回点。 |\n| 对性能的影响\
  \ | 如果被大量使用或放置在频繁执行的代码路径中，可能会减慢系统。 | 性能影响通常比 Kprobes 低，但取决于函数的频率和复杂度。 |\n| 复杂度 |\
  \ 需要理解内核的内部工作机制才能有效使用。 | 用于函数退出监控时较简单，但需要理解在函数执行后捕获什么数据。 |\n| 缺点 | 如果使用不当，可能会导致系统不稳定。开销随着活动探测数量的而增加。\
  \ | 限于函数返回，提供的粒度不如 Kprobes 细。如果函数是关键的，仍可能影响性能。 |\n\n表 13.2：kprobe 和 kretprobe 的比较\n\
  \n一些额外的考虑因素如下：\n\n- **安全性**：`Kprobes` 和 `Kretprobes` 都应该应该谨慎使用，特别是在生产环境中。它们的侵入性意味着，如果使用不当，可能会在无意中影响系统稳定性。\n\
  - **数据收集**：两种方法都允许复杂的数据收集，在标准调试工具无法胜任的环境中特别有用，例如无法轻易停止或重启的系统。\n- **学习曲线**：有效使用这些工具具有显著的学习曲线。理解内核的架构和行为对于充分利用\
  \ Kprobes 和 Kretprobes 至关重要。\n- **开发与维护**：随着内核版本的演进，可能需要维护和更新探测点，以适应内核代码和内部 API\
  \ 的变化。\n\nKprobes 和 Kretprobes 是强大的工具，能够提供对内核运行的深层洞察，使得对于参与底层内核开发、调试或性能调优的开发者来说是无价的。\n\
  \n## OOPS (Out of Place)\n\nLinux 中的 Out of Place State (OOPS) 是内核提供的一种诊断工具，用于报告严重的系统错误，通常由于内核或其模块中的\
  \ bug 引起。当发生 OOPS 时，它并不像内核恐慌（kernel panic）那样崩溃系统，但它指示了可能导致不稳定或安全风险的严重问题。\n\nOOPS\
  \ 可由内核内部各种问题触发，例如：\n- 解引用空指针或无效指针。\n- 内核空间内的访问冲突。\n- 内核模块或驱动程序中的 bug 导致非法操作。\n\n\
  下图通过显示当前执行上下文的细节以及调用栈，展示了进程的内存崩溃：\n\n![](img/Figure13.3.png)\n\n图 13.3：内核跟踪中的 oops\
  \ 示例\n\n最后，还有一个名为 `oops_limit` 的参数，它表示发生多少次 oops 后应该发生 panic。默认值为 10,000 (https://docs.kernel.org/admin-guide/sysctl/kernel.html#oops-limit)。\n\
  \n当发生 OOPS 时，内核会生成一份报告，其中包含几项重要信息以帮助诊断问题：\n- **错误类型**：报告以错误描述开头，例如段错误或通用保护保护。\n\
  - **寄存器和标志**：列出错误发生时 CPU 寄存器和标志的状态。\n- **堆栈跟踪**：提供从错误发生点开始堆栈跟踪，显示导致故障的执行路径。\n- **代码段**：包括触发错误的故障代码片段。\n\
  - **内核模块**：列出已加载的内核模块及其状态，这有助于识别是否是特定模块出现问题。\n- **符号信息**：如果可用，符号将被解析，以提供堆栈跟踪中人类可读的函数和变量名称。\n\
  \n当生成 OOPS 时：\n- **日志记录**：OOPS 的细节被记录在系统日志中，可以使用 `dmesg` 或 `journalctl` 等工具进行审查。\n\
  - **系统响应**：取决于错误的严重程度和内核配置，系统可能会继续运行，或者特定功能可能会禁用。\n- **崩溃转储**：在某些配置下，OOPS 可能会触发内核崩溃转储\
  \ (`vmcore`)，以捕获内存的完整状态，这对于全面的死后分析具有极高价值。\n\n要调试 OOPS：\n- **系统日志**：检查日志中的 OOPS 报告以及事故发生前任何相关消息。\n\
  - **复现**：如果可能，尝试在控制条件下复现问题，以更好地理解触发因素。\n- **内核配置**：确保内核编译时带有调试符号且未优化，以增强诊断数据的质量。\n\
  - **外部工具**：使用 `kdump`、`crash` 和 `gdb` 等工具分析内核状态以及如果存在 `vmcore`。\n\n`Kdump` 内部使用\
  \ `kexec` 在每次需要执行系统内核内存转储时，从内核的快照上启动，例如在内核 panic 期间。系统内核内存转储将被保留并在跨重启期间保持持久。\n\n\
  `Kdump` 和 `kexec` 目前支持以下架构：x86, x86_64, ppc64, ia64, s390x, arm, 和 arm64。\n\n\n\n\
  \n\n你可以通过 `dpkg-reconfigure kexec-tools` 和 `dpkg-reconfigure kdump-tools` 命令手动（重新）启用该功能。要执行此操作，你需要对两个问题都回答“Yes”。\n\
  \n也可以通过编辑 `/etc/default/kexec` 文件直接设置参数：\n\n```bash\n# Load a kexec kernel (true/false)\n\
  LOAD_KEXEC=true\n```\n\n此外，编辑 `/etc/default/kdump-tools` 文件并包含以下行来启用 kdump：\n\n\
  ```bash\nUSE_KDUMP=1\n```\n\n如果在安装 `linux-crashdump` 软件包后未进行重启，则需要通过传递 `crashkernel=`\
  \ 启动参数重启来启用它。重启后，`kdump-tools` 将被启用并处于激活。\n\n此外，如果你在重启后启用了 `kdump-tools`，你只需要运行\
  \ `kdump-config load` 命令即可启用用于 kdump 的机制。\n\n可以通过 `kdump-config show` 命令访问 kdump\
  \ 的当前状态。它的显示内容如下：\n\n```text\nDUMP_MODE: kdump\nUSE_KDUMP: 1\nKDUMP_SYSCTL: kernel.panic_on_oops=1\n\
  KDUMP_COREDIR: /var/crash\ncrashkernel addr:\n/var/lib/kdump/vmlinuz\nkdump initrd:\n\
  /var/lib/kdump/initrd.img\ncurrent state: ready to kdump\nkexec command:\n/sbin/kexec\
  \ -p --command-line=\"...\" --initrd=...\n```\n\n之后，核心转储将位于 `/var/crash` 以供进一步调查。\n\
  \n## 性能分析 (Profiling)\n\n对 GNU/Linux 内核进行性能分析涉及收集和分析有关性能的数据，以识别瓶颈并优化系统性能。\n\n###\
  \ 设置环境\n确保你已经安装了性能分析所需的工具。常用工具包括 `perf`、`ftrace`、`systemtap` 和 `bpftrace`：\n\n```bash\n\
  $ sudo apt-get install linux-tools-$(uname -r) linux-tools-common linux-tools-generic\n\
  $ sudo apt-get install systemtap\n$ sudo apt-get install bpfcc-tools bpftrace\n\
  ```\n\n### perf 命令\n第一个命令是 `perf`。这是一个用于 Linux 内核和应用程序分析的强大工具。\n\n开始使用 `perf` 收集数据：\n\
  ```bash\n$ sudo perf record -a\n```\n\n记录内核事件，例如 CPU 周期、指令、缓存引用等：\n```bash\n$ sudo\
  \ perf record -e cycles -a sleep 10\n```\n\n分析特定的内核函数：\n```bash\n$ sudo perf record\
  \ -e probe:do_sys_open -aR\n```\n\n使用跟踪点 (tracepoints) 跟踪内核中的特定事件：\n```bash\n$ sudo\
  \ perf record -e 'syscalls:sys_enter_*' -a\n```\n\n记录并分析上下文切换：\n```bash\n$ sudo\
  \ perf record -e context-switches -a sleep 10\n```\n\n监控并分析缺页错误：\n```bash\n$ sudo\
  \ perf record -e page-faults -a sleep 10\n```\n\n监控特定进程或全系统的 CPU 使用情况：\n```bash\n\
  $ sudo perf stat -a -- sleep 10\n```\n\n分析内存访问模式：\n```bash\n$ sudo perf record -e\
  \ mem_load_uops_retired.l3_miss -a sleep 10\n```\n\n记录并分析分支预测错误：\n```bash\n$ sudo\
  \ perf record -e branch-misses -a sleep 10\n```\n\n监控 L1 数据缓存缺失：\n```bash\n$ sudo\
  \ perf record -e L1-dcache-load-misses -a sleep 10\n```\n\n跟踪正在执行的特定指令：\n```bash\n\
  $ sudo perf record -e instructions -a sleep 10\n```\n\n使用 `kprobes` 跟踪内核函数：\n```bash\n\
  $ sudo perf probe do_sys_open\n$ sudo perf record -e probe:do_sys_open -a \n```\n\
  \n获取特定函数的详细跟踪信息：\n```bash\n$ sudo perf probe -x /path/to/vmlinux 'do_sys_open%return'\n\
  $ sudo perf record -e probe:do_sys_open -a \n```\n\n记录硬件事件：\n```bash\n$ sudo perf\
  \ record -e r003c -a sleep 10\n```\n\n创建并使用自定义事件进行性能分析：\n```bash\n$ sudo perf record\
  \ -e 'cycles:u,instructions:u,cache-misses:u' -a sleep 10\n```\n\n监控空闲 CPU 时间：\n\
  ```bash\n$ sudo perf record -e cpu-idle -a sleep 10\n```\n\n分析特定的内核模块：\n```bash\n\
  $ sudo perf probe -x /path/to/module.ko 'function'\n$ sudo perf record -e probe:module:function\
  \ -a sleep 10\n```\n\n分别对用户空间和内核空间事件进行分析：\n```bash\n$ sudo perf record -e cycles:u\
  \ -a sleep 10 # 用户空间\n$ sudo perf record -e cycles:k -a sleep 10 # 内核空间\n```\n\n\
  添加动态探针以在无需重新编译的情况下跟踪内核函数：\n```bash\n$ sudo perf probe 'do_sys_open'\n$ sudo perf\
  \ record -e probe:do_sys_open -aR\n```\n\n该命令记录全系统分析数据。使用 `Ctrl+C` 停止记录。\n\n一旦收集了数据，就可以对其进行分析：\n\
  ```bash\n$ sudo perf report\n```\n\n以视化格式查看调用图数据：\n```bash\n$ sudo perf report --call-graph\n\
  ```\n\n获取内核中符号的详细报告：\n```bash\n$ sudo perf report --symbols\n```\n\n分析特定工作负载：\n\
  ```bash\n$ sudo perf record -a -g -- your_command\n```\n`-g` 选项捕获调用图（堆栈跟踪），有助于理解执行流。\n\
  \n生成各种内核指标的统计分析配置：\n```bash\n$ sudo perf stat -e cycles,instructions,cache-references,cache-misses\
  \ -a sleep 10\n```\n\n分析调度器以分析任务调度和上下文切换：\n```bash\n$ sudo perf sched record\n$\
  \ sudo perf sched latency\n```\n\n分析内核中的锁竞争：\n```bash\n$ sudo perf lock record\n\
  $ sudo perf lock report\n```\n\n实时监控系统以查看哪些函数消耗了最多的 CPU 时间：\n```bash\n$ sudo perf\
  \ top\n```\n\n### ftrace 命令\n第二个命令是 `ftrace`，它是 Linux 内置的内核函数跟踪器。\n\n启用所需的跟踪器并设置跟踪：\n\
  ```bash\n$ echo function > /sys/kernel/debug/tracing/current_tracer\n```\n\n开始跟踪：\n\
  ```bash\n$ echo 1 > /sys/kernel/debug/tracing/tracing_on\n```\n\n停止跟踪：\n```bash\n\
  $ echo 0 > /sys/kernel/debug/tracing/tracing_on\n```\n\n查看跟踪：\n```bash\n$ cat /sys/kernel/debug/tracing/trace\n\
  ```\n\n### systemtap 命令\n第三个命令是 `systemtap`，它允许你编写脚本来收集详细内核信息：\n\n1. 创建脚本：\n```bash\n\
  ## myscript.stp\nprobe kernel.function(\"vfs_read\") {\n  printf(\"vfs_read called\
  \ by %s\\n\", execname())\n}\n```\n\n2. 运行脚本：\n```bash\n$ sudo stap myscript.stp\n\
  ```\n\n### bpftrace 命令\n第四个命令是 `bpftrace`。它用于使用 GNU/Linux 的高级跟踪语言进行高级跟踪：\n\n1. 创建脚本来跟踪读系统调用：\n\
  ```bash\n## read_trace.bt\ntracepoint:syscalls:sys_enter_read {\n  printf(\"%s read\\\
  n\", comm);\n}\n```\n\n这里有几种脚本：\n\n* **跟踪打开事件**：跟踪系统中的文件打开事件：\n```bash\ntracepoint:syscalls:sys_openat\
  \ {\n  printf(\"File open: %s by %s\\n\", str(args->filename), comm);\n}\n```\n\n\
  * **跟踪 TCP 连接**：跟踪建立的 TCP 连接：\n```bash\ntracepoint:inet:inet_set_state /args->protocol\
  \ == IPPROTO_TCP && args->newstate == TCP_ESTABLISHED/ {\n  printf(\"TCP connection\
  \ from %s to %s\\n\", args->sport, args->dport);\n}\n```\n\n* **测量在函数中花费的时间**：测量\
  \ `vfs_read` 函数中花费的时间：\n```bash\nkprobe:vfs_read {\n  @start[tid] = nsecs;\n}\n\
  kretprobe:vfs_read /@start[tid]/ {\n  @time = hist(nsecs - @start[tid]);\n  delete(@start[tid]);\n\
  }\nEND {\n  print(@time);\n}\n```\n\n* **监控磁盘 I/O 延迟**：监控读取操作的磁盘 I/O 延迟：\n```bash\n\
  tracepoint:block:block_rq_issue {\n  @start[sector] = nsecs;\n}\ntracepoint:block:block_complete\
  \ /@start[sector]/ {\n  @latency = hist(nsecs - @start[sector]);\n  delete(@start[sector]);\n\
  }\nEND {\n  print(@latency);\n}\n```\n\n* **跟踪内存分配**：跟踪大于指定大小的内存分配：\n```bash\ntracepoint:kmem:kmalloc\
  \ /args->bytes > 1024/ {\n  printf(\"Large allocation: %d bytes by %s\\n\", args->bytes,\
  \ comm);\n}\n```\n\n* **计数系统调用**：统计每个进程的系统调用次数：\n```bash\ntracepoint:raw_syscalls:sys_enter\
  \ {\n  @syscalls[comm] = count();\n}\ninterval:s:5 {\n  print(@syscalls);\n}\n```\n\
  \n* **跟踪上下文切换**：跟踪上下文切换并打印进程名：\n```bash\ntracepoint:sched:sched_switch {\n  printf(\"\
  Context switch: %s -> %s\\n\", str(args->prev_comm), str(args->next_comm));\n}\n\
  ```\n\n* **监控缺页错误**：监控进程的缺页错误：\n```bash\ntracepoint:vm:vm_fault {\n  @faults[comm]\
  \ = count();\n}\ninterval:s:10 {\n  print(@faults);\n}\n```\n\n\n\n\n\n### 网络跟踪\n\
  \n* 跟踪网络数据包传输：它可以跟踪网络数据包传输并打印数据包的大小：\n\n```\ntracepoint:net:net_dev_xmit\n\n{\n\
  \    printf(\"Packet transmitted: %d bytes by %s\\n\", args->len, comm);\n}\n```\n\
  \n这些脚本是分析 Linux 内核不同方面特性的良好起点。你可以根据特定需求对它们进行修改，或者根据提供的示例创建新脚本。\n\n运行脚本：\n\n`$ sudo\
  \ bpftrace read_trace.bt`\n\n一旦你使用上述工具收集了数据，请对其进行分析以找到性能瓶颈。关注以下内容：\n\n*   高 CPU\
  \ 占用率：识别消耗过多 CPU 时间的函数或进程。\n*   I/O 瓶颈：检查缓慢的 I/O 操作及其原因。\n*   内存使用：识别内存密集型操作。\n\
  *   锁竞争：寻找导致显著等待时间的锁。\n\n不同的性能分析技术可以用于以下几种用例：\n\n*   对导致瓶颈的代码进行优化或重构；如果瓶颈与硬件有关，可以考虑硬件升级。\n\
  *   调整内核参数以更好地适应其运行。\n\n记录性能分析过程、发现和所做的优化。与相关利益者共享结果，以确保透明度和协作改进。\n\n### 典型的性能分析工作流\n\
  \n*   识别问题：注意性能问题（例如高 CPU 占用率）。\n*   收集数据：使用 `perf` 记录分析数据（CPU 消耗、内存使用、磁盘使用 (I/O)、网络入出流量使用）。\n\
  *   分析数据：使用 `perf report` 识别 CPU 占用率高的函数。\n*   跟踪特定函数：使用 `ftrace` 或 `bpftrace` 获取问题函数的详细跟踪。\n\
  *   实施更改：优化内核或应用代码中识别出的瓶颈。\n*   验证改进：再次进行性能分析以确保更改改进了性能。\n\n通过遵循这些步骤，你可以有效地对 Linux\
  \ 内核进行分析和优化，以提高性能。\n\n在本章中，我们解释了如何开发带有断点的驱动程序，同时在特定点注入探针，以避免对正在运行的驱动程序产生过大的干扰。这在出现问题或\
  \ bug 时至关重要，同时也为了确保驱动程序名义上运行（跟踪）。\n\n到此，本关于 GNU/Linux 内核及其驱动程序的书籍结束了。我们希望你喜欢阅读这本书并开发了你自己的驱动程序。\n\
