  \n![](img/fm1.png)\n\n# 第 7 章 USB 驱动程序与 libusb\n\n## 引言\n\n在本章中，我们将学习 Linux 内核的\
  \ USB 栈，从靠近硬件的底层到上层驱动程序的开发，以及基于 libusb 的用户态模块开发。\n\n## 结构\n\n本章涵盖了以下主题：\n\n- USB\
  \ 架构\n- Linux USB 子系统\n- Linux USB 数据结构\n- 枚举\n- 类驱动\n- Gadget 驱动程序\n- 使用 libusb\
  \ 在用户空间编写 USB 驱动程序\n\n## 目标\n\n在本章结束，你将能够理解 USB 设备如何通过 Linux 内核工作，并在用户空间或内核中编写驱动程序。\n\
  \n## USB 架构\n\nUSB（通用串行总线）协议由英特的 Ajay V. Bhatt 于 1996 年开发并首次发布。这种 USB 替换了不同类型的串口和并行端口，用于在计算机以及各种外设（如扫描仪、打印机、键盘、游戏控制器、数字相机、质存储设备等）之间传输数据。\n\
  \nUSB 是一种通用接口，用于实现不同设备之间的通信，例如鼠标、数字相机、打印机、键盘、多媒体设备、扫描仪、U 盘和外部硬盘，以及如智能手机或 PC 等主机控制器。\n\
  \n通用串行总线旨在实现热插拔并改进即插用。即插即用允许操作系统在不启动计算机的情况下自动配置和发现新设备，而热插拔允许在不重启的情况下移除和更换设备。\n\n\
  市场上有不同类型的 USB 连接器，其中 A 型和 B 型是最常用的。目前，旧的连接器正在被 Mini-USB、Micro-USB 和 USB-C 线缆取代。\n\
  \nUSB 协议架构如下所示。一旦各种 I/O 设备通过 USB 连接到计算机，它们的结构就像一棵树。在这个 USB 结构中，每个 I/O 设备将建立一个点对点的连接，通过串行传输格式传输数据。\n\
  \n在这种架构中，I/O 设备通过 USB 连接到被称为 hub 的集线器上。架构中的 Hub 是 I/O 设备与计算机之间的连接点。该架构的根集线器（root\
  \ hub）用于将整个结构连接到主机计算机。该架构中的 I/O 设备是键盘、鼠标、扬声器、摄像头等。\n\n下图说明了 USB 类型总线上的设备枚举，以树结构的形式表示：\n\
  \n![](img/Figure7.1.png)\n\n图 7.1：USB 协议架构\n\nUSB 协议简单运行在轮询（polling）原理之上，因为在轮询期间，处理器持续检查输入输出设备是否准备好传输数据。因此，I/O\
  \ 设备不需要向处理器更新其状态，因为不断检查是处理器的主要职责。这使得 USB 变得既简单又廉价。\n\n每当有新设备与集线器关联时，它的地址被定寻为 0。在正常期间，主机计算机轮询集线器的状态，这让主机知道系统的\
  \ I/O 设备已连接或断开系统。\n\n一旦主机对新设备做出响应，它将通过读取设备 USB 接口特定内存中的可用数据来了解设备的功能。主机使用适当的驱动程序与设备通信。之后，主机为新设备分配一个地址，该地址被写入设备寄存器。通过这种设备，USB\
  \ 提供了即插即用功能。\n\n此功能简单地允许主机在设备连接后自动识别新的可用 I/O 设备。设备的 I/O 能力将由主机软件确定。\n\nUSB 协议的另一个特性是热插拔，这意味着\
  \ I/O 设备可以在不执行关机或重启的情况下插入或从主机系统中移除。这确保了当 I/O 设备连接或断开时你的系统持续运行。\n\nUSB 协议还可以支持等时流量（isochronous\
  \ traffic），数据按预定义的时间间隔传输。与同步和异步数据传输相比，等时数据传输非常快。\n\n为了维持等时流量，根集线器通过 USB 传输一系列比特位，指定等时数据的开始，实际数据可以在这些比特位之后传输。\n\
  \n下图显示了 USB 类型连接的电子细节：\n\n![](img/Figure7.2.png)\n\n图 7.2：USB 硬件架构细节\n\n系统中只能存在主机，与设备的通信从主机的角度进行。主机是上游（upstream）组件，而设备是下游（downstream）组件。\n\
  \n从主机移动到设备的数据是 OUT 传输。从设备移动到主机的数据是 IN 传输。\n\n主机（特别是主机控制器）控制所有流量并向设备发送命令。\n\n常见的\
  \ USB 主机控制器有三种类型：\n\n\n\n\n\n* 通用主机控制器接口 (`UHCI`): 由 Intel 为 `USB 1.0` 和 `USB 1.1`\
  \ 设计。使用 `UHCI` 需要获得 Intel 的许可。该控制器支持低速和全速。\n* 开放主机控制器接口 (`OHCI`): 由 、微软和国家半导体为 `USB\
  \ 1.0` 和 `1.1` 设计。支持低速和全速，并且在硬件中实现更多功能方面通常比 `UHCI` 更高效。\n* 扩展主机控制器接口 (`EHCI`):在\
  \ `USB-IF` 要求仅创建一个主机控制器规范后，为 `USB 2.0` 创建。`EHCI` 用于高速传输，并将低速和全速传输委托给辅助 `OHCI` 或\
  \ `UHCI` 控制器。\n\n总线接口层提供物理连接、电气信号和数据包连接。这是由设备硬件管理的层级。它是通过设备外部的物理接口实现的。\n\n设备层是 USB\
  \ 系统软件执行 USB 操作（如发送和接收信息）的视图。这是通过设备内部的串行接口引擎实现的。\n\n最后，功能层是软件侧。这是 USB 设备中对接收到的信息进行处理或收集数据传输到主机的部分。\n\
  \n![](img/Figure7.3.png)\n\n图 7.3：USB 接口管理的三层表示\n\n### USB 特性\n\nUSB 有若干特性，其中提到：\n\
  \n* `USB 2.0` 的最大速度可达 `480 Mbps`。\n* 单个 USB 长度在有 Hub 的情况下可达 40 米，没有 Hub 的情况下可达 5\
  \ 米。\n* USB 是即插用设备。\n* 它可以通过计算机或自身的电源供电。\n* 使用单个 USB 主机控制器可以连接超过 100 个设备。\n* USB\
  \ 设备使用的功率可达 `5 V` 并提供高达 `500 mA`。\n* 计算机进入节能模式，某些类型的 USB 驱动器会自动转换为睡眠模式。\n* USB 端口有两根线；一根用于供电，另一根用于传输数据。\n\
  * 在 `5 V` 下，计算机可以通过电源线提供高达 `500 mA` 的功率。\n* 低功耗设备可以直接从 USB 取电。\n* 计算机和外围设备之间可以使用\
  \ USB 端口进行双向通信。\n\n### USB 标准和规范\n\nUSB 标准和规范讨论如下：\n\n* USB 规范会随 USB 标准的时间演进而变化。\n\
  * USB 支持三种速度类型，即低速 - `1.5 Mbps`、全速 - `12 Mbps` 和高速 - `480 Mbps`。\n\n### USB 2.0\
  \ 标准\n\n`USB 2.0` 标准如下：\n\n* 这是一个高速 USB 端口，最大数据传输速度为 `480 Mbps`。此 USB 支持所有连接器。\n\
  * 最大电缆长度为 5 米。\n* 它的最大充电功率可达 `15W`。\n\n### USB 3.2 标准\n\n`USB 3.2` 标准如下：\n\n* `USB\
  \ 3.2`（第 1 代）是一种超级 USB，最大数据传输速度为 `5 Gbps`。\n* 它支持不同的连接器，如 `USB 3 USB-A`、`USB 3 USB-B`\
  \ 和 `USB-C`。\n* 此 USB 的最大电缆长度为 3 米。\n* 它的最大充电功率可达 `15W`。\n\n### USB 3.2 第 2 代\n\n\
  `USB 3.2` 第 2 代标准如下：\n\n* `USB 3.2`（第 2 代）也是一种超级 USB，最大数据传输速度为 `10 Gbps`。\n* 此 USB\
  \ 的最大电缆长度为 1 米。\n* 它也支持不同的连接器，如 `USB 3 USB-A`、`USB 3 USB-B` 和 `USB-C`。\n* 它的最大充电功率可达\
  \ `100W`。\n\n### USB 3.2 第 2x2 代\n\n`USB 3.2` 2x2 代标准如下：\n\n* `USB 3.2` 2x2 代是一种超级\
  \ USB，最大数据传输速度为 `20 Gbps`。\n* 此 USB 的最大电缆长度为 1 米。\n* 它支持 USB 连接器。\n* 它的最大充电功率可达\
  \ `100W`。\n\n### Thunderbolt 3 标准\n\n`USB 3` 标准（别名 Thunderbolt）如下：\n\n* 此 USB 驱动器也称为\
  \ Thunderbolt，包括高达 `40 Gbps` 的最大数据传输速度。\n* 此 USB 的最大电缆长度主动电缆为 2 米，被动电缆为 0.8 米。\n\
  * 它支持 USB 连接器。\n* 它的最大充电功率可达 `100W`。\n\n### USB 4 标准\n\n`USB 4` 标准如下：\n\n* 此 USB\
  \ 闪存盘也称为 Thunderbolt，包括高达 `40 Gbps` 的最大数据传输速度。\n* 此 USB 的最大电缆长度主动电缆为 2 米，被动电缆为 0.8\
  \ 米。\n* 它支持 USB 连接器。\n* 它的最大充电功率可达 `100W`。\n\nUSB 协议时间线所示：\n\n```\n![](img/Figure7.4.png)\n\
  ```\n\n在 图 7.4 中发生了填充（stuffing），这意味着为了同步而添加了逻辑 1。如果数据包含多个 1，USB 驱动器将无法同步。因此，通过这种方式，硬件会注意到一个额外的位并忽略它。\n\
  \nUSB 协议时间线所示：\n\n```\n![](img/Figure7.5.png)\n```\n\n下图向我们展示 USB 帧的细节：\n\n* SYNC：在\
  \ USB 协议中，每个 USB 数据包都以 `SYNC` 字段开头，通常用于同步发送端和接收端以准确传输数据。在低速或高速 USB 系统中，像 `SYNC`\
  \ 字段包含 3 组 `KJ`，随后是 `2 K` 以包围 8 位数据。\n\n在高速 USB 系统中，同步需要 15 组 `KJ`，后跟 `2 K` 以跨越\
  \ 32 位数据。该字段在低速和高速下为 8 位，最高速下为 32 位，用于同步发送端和接收端的 `CLK`。最后 2 位将指示 `PID` 字段的起始位置。\n\
  \n\n\n\n\n- `Packet identification field` (`PID`)：USB 协议中的数据包识别字段主要用于识别传输的数据包类型，从而确定数据包的格式。该字段的长度为\
  \ 8 位，高 4 位识别数据包类型，低 4 位是高 4 位的位反反。\n- `Address field`（地址字段）：USB 协议地址字段指示数据包的主要目标设备。7\
  \ 位长度仅允许支持 127 个设备。地址 0 是无效的，因为任何尚未分配的设备都必须响应传输到地址 0 的包。\n- `Endpoint field`（端点字段）：USB\
  \ 协议端点字段长度 4 位，为寻址提供了额外的灵活性。通常这些端点会被分为输入和输出。`0` 端点是一个特殊情况，称为 `CONTROL` 端点，每个设备都包含一个\
  \ `0` 端点。\n- `Data field`（数据字段）：数据字段的长度不是固，从 0 到 8192 位不等，并且始终字节计数中不可缺的一部分。\n- `CRC\
  \ field`（CRC 字段）：对数据包载荷数据进行循环冗余校验（`CRC`），其中所有 Token 包包含 5 位 `CRC`，数据包包含 16 位 `CRC`。`CRC-5`\
  \ 长度为 5 位，用于 Token 包以及帧包的起始。\n- `EOP field`（EOP 字段）：每个数据包都以数据包结束（`EOP`）字段结束，它包含持续\
  \ 2 位的 `SE0` 或非对称零，随后是持续 1 位的 `J`。\n\nUSB 协议中常见的同步问题包括以下内容。每当开发 USB 设备时，USB 开发人员通常会遇到许多同步问题，称为\
  \ USB 通信错误。其中某些错误会导致系统崩溃。\n\n以下是 USB 总线上可能发生的一些问题：\n- USB 数据包错误和数据顺序错误。\n- USB 传输或重传。\n\
  - 电源或基于 `VBUS` 的问题。\n- 枚举过程中的问题。\n- 高速交易问题。\n\n## USB 的优缺点\n\nUSB 的优点如下：\n- 易于使用\n\
  - 对于多个设备，仅使用一个接口\n- 尺寸紧凑\n- 连接系统稳健\n- 价格不贵\n- 提供不同尺寸和不同连接器\n- 自动配置\n- 扩展容易\n- 速度快\n\
  - 可靠且廉价\n- 功耗低\n- 兼容且耐用\n\nUSB 的缺点如下：\n- 某些制造商以较低成本设计低质量的 USB 盘\n- 容量有限\n- 与其他系统相比，其数据传输不快\n\
  - USB 不提供广播功能，因此个体消息仅在主机和设备之间通信\n\n目前，大多数外围设备都通过 USB 连接到系统，例如鼠标、打印机、扫描仪、摇杆、调制解调器、摄像头、键盘、数码相机、存储设备、飞行控制器、网络适配器以及科学领域的数据采集设备。\n\
  \n## Linux USB 子系统\n\nLinux USB 子系统是 Linux 内核的一部分，负责管理通用串行总（`USB`）设备及其与系统的交互。\n\n\
  它提供了在多种硬件架构上支持 USB 设备所需的架构和驱动程序。\n\n以下是对 Linux USB 子系统的介绍：\n\n### USB 设备类\n- USB\
  \ 设备类是标准化的规范，定义了特定类型的 USB 设备如何与主机通信。\n- USB 类的示例包括：\n    - 人机接口设备 (`HID`）：键盘、鼠标、游戏控制器。\n\
  \    - 大容量存储类 (`MSC`)：USB 闪存、外部硬盘。\n    - 通信设备类 (`CDC`)：调制解调器、网络适配器、串口。\n    - 音频类：声卡、麦克风、扬声器。\n\
  \    - 视频类：摄像头、摄像机。\n\n### USB 类驱动\n- Linux 以内核模块的形式提供 USB 类驱动程序，实现 USB 类定义的协议。\n\
  - 这些驱动程序抽象了 USB 通信的低层细节，使开发者能够更容易处理特定类型的 USB 设备。\n\n### 类特定有协议\n- 每个 USB 类都有自己的协议和规范，规定了设备与主机之间的通信。\n\
  - 类驱动程序实现这些协议，确保与标准的兼容性，并实现与 USB 主机和其他设备的互操作性。\n\n### 内核配置\n- 在构建 Linux 内核时，用户可以通过启用或禁用相应的内核选项来配置支持哪些\
  \ USB 类。\n- 使用 `make menuconfig` 等工具或通过直接编辑内核配置文件完成配置。\n\n### 设备识别\n- 当 USB 设备连接到\
  \ Linux 系统时，USB 核心会自动识别设备类，并在可用时加载相应的类驱动程序。\n- 这种识别基于 USB 描述符提供的设备类、子类和协议标识符。\n\n\
  ### 复合设备\n- USB 设备可以同时支持多个功能，类驱动程序在复合设备中通常协同工作。\n- 复合设备结合多个 USB 类以提供一系列功能。例如，单个\
  \ USB 设备可以同时作为大容量存储设备和音频设备。\n\n### 用户空间交互\n- 用户空间应用程序可以通过内核提供的标准接口和 API 与 USB 类设备进行交互。\n\
  - 例如，USB 大容量存储设备的文件操作可以类似于块设备的方式访问。\n- USB 类驱动程序的示例：\n    - `usb-storage`：为存储设备实现\
  \ `MSC`。\n    - `usbhid`：为输入设备支持 `HID` 类。\n    - `cdc-acm`：为串口实现 `CDC`。\n\n在 Linux\
  \ 内核中使用 USB 类驱动通过提供标准接口并处理底层细节简化了 USB 设备的开发。它还确保了与支持相同 USB 类的主机的兼容性。开发者可以专注于实现设备的高级功能，而依靠\
  \ USB 类驱动程序管理 USB 通信。\n\nUSB 树可以在逻辑和物理拓扑之间进行比较。物理是现实，而逻辑是一种抽象，允许我们通过省略中间集线器来更好地理解主机的分离。如下所示：\n\
  \n```\n!images/Figure7.6.png\n```\n图 7.6：逻辑与物理\n\nUSB 设备是通过 USB 接口连接到计算机或其他主机的硬件外围设备。USB\
  \ 设备形式多样，用途各异，从键盘和鼠标等简单的输入输出设备到复杂的存储设备、网络适配器、音频接口等。\n\n下图显示了端点和接口之间的关系：\n\n```\n\
  !images/Figure7.7.png\n```\n图 7.7：USB 设备定义\n\n端点路由通常是指数据在 USB 通信端点内的路径或路线。在 USB\
  \ 术语中，端点是 USB 设备内发送接收数据的特定缓冲区或目标。端点通过唯一地址标识，可以是 `IN` 端点或 `OUT` 端点。\n\n- 端点 0 可以双向传输数据\n\
  - 所有其他端点只能向一个方向传输数据：\n    - `IN`：从设备传输到主机\n    - `OUT`：从主机传输到设备\n\n\n\n\n\n## 端点类型\n\
  \n端点可能有以下几种类型：\n\n* **控制型 (Control)**：\n    * 双向端点\n    * 用于枚举\n    * 可用于应用程序\n\
  * **中断型 (Interrupt)**：\n    * 以低延迟传输少量量数据\n    * 在总线上预留带宽\n    * 用于时间敏感数据 (HID)\n\
  * **批量型 (Bulk)**：\n    * 用于大数据量传输\n    * 用于大量且时间不敏感的数据（网络包、大容量存储等）\n    * 不在总线上预留带宽；使用剩余时间\n\
  * **等时型 (Isochronous)**：\n    * 传输大量时间敏感的数据\n    * 不保证交付（不发送 ACK）\n    * 用于音频和视频流\n\
  \    * 延迟的数据等同于没有数据\n    * 丢弃帧图像比延迟并强制传输要好\n    * 不重传\n* USB 是由主机控制的总线：\n    * 如果主机不先发起，总线上的就不会发生任何事情。\n\
  \    * 设备无法发起任何通信。\n    * USB 是轮询总线（Polled Bus）。\n* 主机轮询每个设备，请求数据或发送数据。\n\n## USB\
  \ 传输 (IN) 算法\n\nUSB 传输 (IN) 如下：\n\n* 主机发送一个 `IN` 令牌\n* 如果设备有数据，那么：\n    * 设备发送数据\n\
  \    * 主机发送 `ACK`\n* 否则：\n    * 设备发送 `NAK`\n    * 主机将重试直到超时\n\n下图详细展示了 USB 总线上输入传输的序列图：\n\
  \n![](img/Figure7.8.png)\n\n图 7.8：IN 传输序列图\n\n## USB 传输 (OUT) 算法\n\nUSB 传输 (OUT)\
  \ 如下：\n\n* 主机发送一个 `OUT` 令牌\n* 主机发送数据（一个包）\n* 如果设备接受数据传输，那么：\n    * 设备发送 `ACK`\n\
  * 否则：\n    * 设备发送 `NAK`\n    * 主机将重试直到成功或超时\n\n下图详细展示了 USB 总线上输出传输的序列图：\n\n![](img/Figure7.9.png)\n\
  \n图 7.9：OUT 传输序列图\n\n USB 标准有许多标准连接器，它们可以相互通信：\n\n![](img/Figure7.10.png)\n\n图 7.10：根据\
  \ USB 标准定义的 USB 连接器类型\n\n![](img/Figure7.11.png)\n\n图 7.11：不同连接器之间的连接矩阵\n\nUSB On-The-Go\
  \ (USB OTG) 是一种允许 USB 设备动态地充当主机（host）或外设（peripheral）的规范。这意味着配备 USB OTG 的设备可以根据情况充当\
  \ USB 主机（如计算机）和 USB 外设（如键盘或闪盘）。\n\n以下是 USB On-The-Go 的关键特性：\n\n* **主机或外设角色切换**：USB\
  \ OTG 允许设备在 USB 主机和 USB 外设角色之间切换。例如，支持 USB OTG 的智能手机在连接 USB 闪盘进行数据传输时可以作为 USB 主机，在连接计算机进行数据同步时可以作为\
  \ USB 外设。\n* **Micro-USB 和 USB-C 连接器**：USB OTG 通常使用 Micro-USB 和 USB-C 连接器，与标准 USB\
  \ 连接器相比，它们具有额外的引脚。这些额外的引脚允许设备之间协商主机或外设角色。\n* **OTG 线缆或适配器**：为了使用 USB OTG 功能，设备通常需要\
  \ OTG 线缆或适配器。该线或适配器包含了必要的布线和电路，以实现设备之间的角色切换。\n* **ID 引脚检测**：USB OTG 设备使用 USB 连接器中的\
  \ `ID`（识别）引脚来检测它们应该充当主机还是外设。当 `ID` 引脚接地时（表示连接到设备的地线），设备充当主机。当 `ID` 引脚未接地时，设备充当外设。\n\
  * **双重角色设备 (DRD)**：支持 USB OTG 的设备被称为 DRD，因为它们可以根据需要承担主机或外设角色。DRD 必须能够快速、高效地切换角色，以支持无缝操作。\n\
  * **应用场景**：USB OTG 常用于智能手机和平板电脑等移动设备，以便实现与键盘、鼠标、游戏控制器和存储设备等 USB 外设的连接。它允许用户在不需要计算机的情况下扩展设备功能并轻松传输数据。\n\
  * **USB OTG 协议**：USB OTG 设备必须符合 USB OTG 协议，该协议定义了设备之间角色协商、电源管理和数据传输的规则和程序。\n\n下图显示了标准\
  \ USB 线缆与 OTG 兼容线缆的区别：\n\n![](img/Figure7.12.png)\n\n图 7.12：普通 USB 线缆与 OTG 之间的布线细节\n\
  \n检测低速或高速连接取决于布线方式：\n\n![](img/Figure7.13.png)\n\n图 7.13：检测 USB 设备连接\n\n# Linux\
  \ USB 数据结构\n\nUSB 数据结构用于表示 USB 设备、端点、描述符和事务的各种组件和配置。\n\n这些数据结构帮助内核管理 USB 设备，处理与\
  \ USB 外设的通信并维护有关配置的信息。\n\n* **usb_device**：表示连接到系统的 USB 设备。该结构包含了设备厂商 ID、产品 ID、类、配置和端点等信息。\n\
  ```c\nstruct usb_device {\n    int devnum;\n    char path[16];\n    enum usb_state\
  \ state;\n    enum usb_speed speed;\n    struct usb_tt * tt;\n    struct usb_device\
  \ *parent;\n    struct usb_bus *bus;\n    struct usb_endpoint ep0;\n    struct device\
  \ dev;\n    struct usb_descriptor descriptor;\n    struct usb_host_config * config;\n\
  \    struct usb_host_config * actconfig;\n    struct usb_host_endpoint * ep_in[16];\n\
  \    struct usb_host_endpoint * ep_out[16];\n    char ** rawdescriptors;\n    unsigned\
  \ short busmA;\n    u8 portnum;\n    u8 level;\n    unsigned can_submit:1;\n   \
  \ unsigned persist_enabled:1;\n    unsigned have_langid:1;\n    unsigned authorized:1;\n\
  \    unsigned wusb:1;\n    int string_langid;\n    char * product;\n    char * manufacturer;\n\
  \    char * serial;\n    struct list_head filelist;\n    #ifdef CONFIG_USB_CLASS\n\
  \    struct device * classdev;\n    #endif\n    #ifdef CONFIG_USB_FS\n    struct\
  \ dentry * usbfs_dentry;\n    #endif\n    int maxchild;\n    struct usb_device *\
  \ children[USB_MAXCHILD];\n    u32 quirks;\n    atomic_t urbnum;\n    unsigned long\
  \ active_duration;\n    #ifdef CONFIG_PM\n    unsigned long connect_time;\n    unsigned\
  \ do_remote_wakeup:1;\n    unsigned reset_resume:1;\n    #endif\n    struct wusb_dev\
  \ * wusb_dev;\n    int slot_id;\n};\n```\n\n* **usb_interface**：表示 USB 设备的接口。每个\
  \ USB 设备可以有多个接口，每个接口提供一个特定功能。`usb_interface` 结构包含了有关接口端点、描述符和关联程序的信息。\n```c\nstruct\
  \ usb_interface {\n    struct usb_host_interface *altsetting;\n    struct usb_host_interface\
  \ *cur_altsetting;\n    unsigned num_altsetting;\n    struct usb_interface_assoc_descriptor\
  \ *intf_assoc;\n    int minor;\n    enum usb_interface_condition condition;\n  \
  \  unsigned sysfs_files_created:1;\n    unsigned ep_devs_created:1;\n    unsigned\
  \ unregistering:1;\n    unsigned needs_remote_wakeup:1;\n    unsigned needs_altsetting0:1;\n\
  \    unsigned needs_binding:1;\n    unsigned resetting_device:1;\n    unsigned authorized:1;\n\
  \    struct device dev;\n    struct device *usb_dev;\n    struct work_struct reset_ws;\n\
  };\n```\n\n* **usb_device_descriptor**：描述 USB 设备的一个端点。该结构包含了端点地址、传输类型（例如控制、批量、中断、等时）、最大包大小、轮询间隔以及其他端点特定属性。\n\
  ```c\nstruct usb_device_descriptor {\n    __u8 bLength;\n    __u8 bDescriptorType;\n\
  \    __le16 bcdUSB;\n    __u8 bDeviceClass;\n    __u8 bDeviceSubClass;\n};\n```\n\
  \n\n\n\n\n```c\n__u8 bDeviceProtocol;\n__u8 bMaxPacketSize0;\n__le16 idVendor;\n\
  __le16 idProduct;\n__le16 bcdDevice;\n__u8 iManufacturer;\n__u8 iProduct;\n__u8\
  \ iSerialNumber;\n__u8 bNumConfigurations;\n} __attribute__ ((packed));\n```\n\n\
  * `usb_host_endpoint`: 代表 USB 设备的主机端点。该结构由 USB 主机控制器驱动使用，用于管理与 USB 设备上端点的通信。\n\n\
  ```c\nstruct usb_host_endpoint {\n    struct usb_endpoint_descriptor desc;\n   \
  \ struct usb_ss_ep_comp_descriptor ss_ep_comp;\n    struct usb_ssp_isoc_ep_comp_descriptor\
  \ ssp_isoc_ep_comp;\n    struct list_head urb_list;\n    void * hcpriv;\n    struct\
  \ ep_device * ep_dev;\n    unsigned char * extra;\n    int extralen;\n    int enabled;\n\
  \    int streams;\n};\n```\n\n* `usb_request`: 代表 USB 数据传输请求。该结构包含了有关数据缓冲区、传输类型、端点地址、传输长度以及启动\
  \ USB 数据传输所需的其他参数。\n\n```c\nstruct usb_request {\n    void *buf;\n    unsigned length;\n\
  \    dma_addr_t dma;\n    struct scatterlist *sg;\n    unsigned num_sgs;\n    unsigned\
  \ num_mapped_sgs;\n    unsigned stream_id:16;\n    unsigned no_interrupt:1;\n  \
  \  unsigned zero:1;\n    unsigned short_not_ok:1;\n    unsigned dma_mapped:1;\n\
  \    void (*complete)(struct usb_ep *ep, struct usb_request *req);\n    void *context;\n\
  \    struct list_head list;\n    unsigned frame_number;\n    int status;\n    unsigned\
  \ actual;\n};\n```\n\n* `usb_ctrlrequest`: 代表 USB 控制请求。该结构用于向 USB 设备发送控制消息，例如设备描述符请求、配置设置请求或功能控制请求。\n\
  \n```c\nstruct usb_ctrlrequest {\n    __u8 bRequestType;\n    __u8 bRequest;\n \
  \   __le16 wValue;\n    __le16 wIndex;\n    __le16 wLength;\n};\n```\n\n* `usb_driver`:\
  \ 代表在 USB 子系统中注册的 USB 设备驱动程序。该结构包含了用于处理 USB 设备初始化、附加、卸载和数据传输操作的函数指针。\n\n```c\nstruct\
  \ usb_driver {\n    const char * name;\n    int (* probe) (struct usb_interface\
  \ *intf,const struct usb_device_id *id);\n    void (* disconnect) (struct usb_interface\
  \ *intf);\n    int (* unlocked_ioctl) (struct usb_interface *intf, unsigned int\
  \ code,void *buf);\n    int (* suspend) (struct usb_interface *intf, pm_message_t\
  \ message);\n    int (* resume) (struct usb_interface *intf);\n    int (* reset_resume)\
  \ (struct usb_interface *intf);\n    int (* pre_reset) (struct usb_interface *intf);\n\
  \    int (* post_reset) (struct usb_interface *intf);\n    const struct usb_device_id\
  \ * id_table;\n    struct usb_dynids dynids;\n    struct usbdrv_wrap drvwrap;\n\
  \    unsigned int no_dynamic_id:1;\n    unsigned int supports_autosuspend:1;\n \
  \   unsigned int disable_hub_initiated_lpm:1;\n    unsigned int soft_unbind:1;\n\
  };\n```\n\n* `usb_device_id`: 定义了 USB 设备驱动程序用于识别支持的设备 匹配项。该结构包含了用于设备匹配的厂商 ID、产品\
  \ ID、设备类、子类、协议以及其他属性。\n\n```c\nstruct usb_device_id {\n    __u16 match_flags;\n\
  \    // 用于特定产品的匹配\n    __u16 idVendor; // 厂商 ID\n    __u16 idProduct; // 产品 ID\n\
  \    // 用于设备类匹配\n    __u8 bDeviceClass; // 类代码\n    __u8 bDeviceSubClass; // 子类代码\n\
  \    __u8 bDeviceProtocol; // 协议代码\n    // 用于接口类匹配\n    __u8 bInterfaceClass; //\
  \ 接口类代码\n    __u8 bInterfaceSubClass; // 接口子类代码\n    __u8 bInterfaceProtocol; //\
  \ 接口协议代码\n    // 不匹配，由驱动程序使用\n    kernel_ulong_t driver_info; // 驱动程序特定数据\n};\n\
  ```\n\n### 枚举\n\n在枚举 USB 设备时，主要步骤涉及 USB 子系统的初始化、检测连接的 USB 设备、解析设备描述符、配置设备以及加载相应的设备驱动程序。\n\
  \n这些步骤将进行进一步讨论：\n\n#### 1. USB 子系统初始化\na. 操作系统中的 USB 子系统在系统启动或 USB 驱动程序加载时初始化。\n\
  b. 初始化包括设置数据结构、注册 USB 主机控制器以及初始化其他必要的组件。\n\n#### 2. 主机控制器检测\na. USB 子系统检测并初始化系统中\
  \ USB 主机控制器。\nb. 主机控制器管理 USB 通信并为连接 USB 设备提供物理接口。\n\n#### 3. 设备连接检测\na. USB 子系统检测\
  \ USB 设备何时连接到系统。\nb. 这种检测可能涉及硬件中断、轮询或其他机制，取决于系统。\n\n### 4. 枚举\na. 检测到 USB 设备连接时，USB\
  \ 子系统开始枚举过程。\nb. 枚举涉及向设备发送控制请求以获取描述符和配置信息。\n\n#### 5. 描述符解析\na. USB 子系统解析设备提供的描述符。\n\
  b. 描述符包含了厂商 ID、产品 ID、设备类、配置等信息。\n\n### 6. 配置选择\na. 根据描述符，USB 子系统选择合适的配置。\nb. USB\
  \ 设备可能有多个配置，每个配置具有不同的接口。\n\n### 7. 接口初始化\na. 对于所选配置中的每个接口，USB 子系统都会初始化相应的驱动程序。\n\
  b. 接口初始化包括加载模块、注册接口以及设置端点。\n\n### 8. 驱动绑定\na. USB 子系统根据驱动程序定义的匹配标准将初始化的接口绑定。\nb.\
  \ 如果找到了合适的驱动程序，则将其绑定到接口，允许设备工作。\n\n### 9. 设备注册\na. USB 子系统将设备注册到操作系统，以便访问。\nb. 注册的设备可能会以文件节点的形式出现，或通过系统\
  \ API 。\n\n#### 10. 设备配置\na. 一旦枚举和初始化完成，USB 设备即完成配置并就绪。\nb. 应用程序或设备驱动程序现在可以与设备通信，发送控制请求并根据需要执行数据传输。\n\
  \n以下是我们讨论的步骤总结：\n1. 插入设备\n2. 检测连接\n3. 获取基本信息\n4. 设置地址\n5. 获取详细信息\n6. 选择驱动程序\n7.\
  \ 选择配置\n8. 使用\n\n### 类驱动\n\nUSB 类驱动是指负责支持特定 USB 设备类的内核模块。USB 类定义了 USB 设备与主机之间通信的标准协议。\n\
  \nLinux 提供了类驱动以实现这些标准。\n\n* USB 设备类\n* USB 设备类是标准规范，定义了特定类型的 USB 设备如何与主机通信。\n  \
  \  * USB 类示例包括：\n        * `HID`: 键盘、鼠标、游戏控制器。\n        * `MSC`: USB 闪盘、外部硬盘。\n\
  \        * `CDC`: 调制解调器、网络适配器、串口。\n        * `Audio class`: 声卡、麦克风、扬声器。\n      \
  \  * `Video class`: 摄像头。\n\n* USB 类驱动\n* Linux 以内核模块的形式提供 USB 类驱动，这些实现了 USB 类定义的协议。\n\
  * 这些驱动程序抽象了 USB 通信的底层细节，使开发者更容易处理特定类型的 USB 设备。\n\n* 类特定协议\n* 每个 USB 类都有自己的一套协议和规范，规定了设备与主机之间的通信。\n\
  \n\n\n\n\n- `Class` 驱动程序实现了这些协议，确保了与标准的兼容性，并实现了与 USB 主机和其他设备的互操作。\n\n### 内核配置\n\
  - 在编译 Linux 内核时，用户可以通过启用或禁用相应的内核选项来配置支持哪些 USB 类。\n- 可以使用 `make menuconfig` 等工具或直接编辑内核配置文件来完成配置。\n\
  \n### 设备识别\n- 当 USB 设备连接到 Linux 系统时，USB 核心会自动识别设备类，并在可用时加载相应的类驱动程序。\n- 这种识别是基于设备在\
  \ fact USB 描述符中提供的设备类、子类和协议标识符。\n\n### 复合设备\n- USB 设备可以同时支持多个功能，类驱动程序在复合设备中通常会协同工作。\n\
  - 复合设备结合了多个 USB 类以提供系列功能。例如，单个 USB 设备可以同时作为大存储设备和音频设备使用。\n\n### 用户空间交互\n- 用户空间应用程序可以通过内核提供的标准接口和\
  \ API 与 USB 类设备进行交互。\n- 例如，对 USB 大存储设备的文件操作可以以类似于其他块设备的方式访问。\n\n### USB 类驱动程序示例\n\
  - `usb-storage`：为 USB 存储设备实现 `MSC`（大存储类）。\n- `usbhid`：支持输入设备的 `HID` 类。\n- `cdc-acm`：为串口通信实现\
  \ `CDC`（通信设备设备类）。\n\n在 Linux 内核中使用 USB 类驱动程序通过提供标准化接口并处理许多底层细节，简化了 USB 设备的开发。\n\n\
  它还确保了与支持相同 USB 类的 主机的兼容性。\n\n![](img/Figure7.14.png)\n\n图 7.14：USB 类总结\n\n开发者可以专注于实现设备的高层功能，同时依靠\
  \ USB 类驱动程序来管理 USB 通信。\n\n### USB Gadget 驱动程序\nUSB Gadget 驱动是指实现 USB 设备功能的内核模块。\n\
  \n与管理 USB 外设（例如键盘、鼠标、存储设备）的 USB 主控制器不同，Gadget 驱动允许 Linux 设备本身作为 USB 外设。\n\n以下是 Linux\
  \ 内核中 USB Gadget 驱动程序的介绍：\n\n#### USB Gadget 框架\n- USB Gadget 框架是 Linux 内核的一部分，允许设备作为\
  \ USB 外设发挥作用。\n- 它提供了一套实现各种 USB Gadget 功能的 API 和基础设施。\n\n#### USB Gadget 类型\n- Linux\
  \ 支持多种 USB Gadget 类型，每种代表一种不同的 USB 设备类。常见的 Gadget 类型包括大存储 Gadget（用于模拟 USB 存储设备）、以太网\
  \ Gadget（用于模拟 USB 网络适配器）和串口 Gadget（用于模拟 USB 串口）。\n\n#### Gadget 驱动\n- Gadget 驱动是实现特定\
  \ Gadget 功能的内核模块。\n- 这些驱动定义了 Gadget 在连接到 USB 主机时的行为。例如，大存储 Gadget 驱动将定义 Gadget 如何向主机暴露存储空间。\n\
  \n### 内核配置\n- 要使用 USB Gadget 功能，必须配置 Linux 内核相应的选项。这涉及启用 USB Gadget 框架并选择特定的 Gadget\
  \ 驱动。\n\n#### ConfigFS（配置文件系统）\n- ConfigFS 是一种用于动态配置 USB Gadgets 的虚拟文件系统。\n- 它允许用户空间工具在运行时创建、配置和管理\
  \ USB Gadget 配置。\n\n#### Gadget 复合设备\n- 单 Gadget 可以同时支持多个功能。例如，Gadget 可以同时模拟大存储设备和以太网设备。\n\
  - 这是通过复合 Gadget 实现的，多个 Gadget 驱动协同工作以提供不同的 USB 功能。\n\n#### USB 设备类\n- Gadget 驱动通常对应于特定的\
  \ USB 设备类，如 `CDC` 或 `MSC`。\n- 每个 USB Gadget 驱动都实现特定 USB 设备类所需的协议和行为。\n\n#### 用户空间交互\n\
  - 用户空间应用程序可以通过 ConfigFS 或使用高级别的库和工具与 USB Gadgets 交互。\n- 例如，`Gadgetfs` 接口允许用户空间像对待普通文件系统一样与\
  \ USB Gadget 交互。\n\n通过使用 USB Gadget 驱动，Linux 设备可以提供广泛的 USB 功能，使其在设备需要作为 USB 外设的场景中具有多功能。\n\
  \n无论是模拟 USB 存储设备、网络适配器还是串口，USB Gadget 驱动在为基于 Linux 的系统实现化的 USB 能力方面起着至关重要的作用。\n\n\
  下面的示例展示了一个基于 Gadget 的处理 USB panic 键的 USB 驱动示例：\n\n![](img/Figure7.15.png)\n\n图 7.15：USB\
  \ panic 键视图\n\n它包含一个基于字符设备骨架的 Linux 驱动程序和一个从用户空间与之通信的程序：\n- `panicb.c`：Linux USB\
  \ 驱动程序\n- `panic_test.c`：用户空间中的程序\n- `Makefile`：用于管理（编译、加载/卸载等）内核模块\n\n以下是 Makefile\
  \ 的概览：\n\n```makefile\nobj-m := panicb.o\nKDIR := /lib/modules/$(shell uname -r)/build\n\
  all:\nmake M=$(shell pwd) -C $(KDIR) modules\nmodinfo ./panicb.ko\ngcc panicb_test.c\
  \ -o panicb_test\ninfo:\nmodinfo ./panicb.ko\nload:\ninsmod ./panicb.ko\ndmesg\n\
  unload:\nrmmod ./panicb.ko\ninstall:\nmake M=$(shell pwd) -C $(KDIR) install\nclean:\n\
  make M=$(shell pwd) -C $(KDIR) clean\n```\n\n用于说明驱动程序的 GNU/Linux 驱动程序源代码：\n\n```c\n\
  #include <linux/kernel.h>\n#include <linux/errno.h>\n#include <linux/init.h>\n#include\
  \ <linux/slab.h>\n#include <linux/usb.h>\n#include <asm/uaccess.h>\n#include <linux/module.h>\n\
  \n#define VENDOR_ID 0x1130\n#define PRODUCT_ID 0x0202\n\n// 私有结构\nstruct usb_panicb\
  \ {\n    struct usb_device *udev;\n    unsigned int button;\n};\n\n// 前向声明\nstatic\
  \ struct usb_driver panicb_driver;\n\n/* 与此驱动程序工作的设备表 */\nstatic struct usb_device_id\
  \ id_table[] = {\n    { USB_DEVICE(VENDOR_ID, PRODUCT_ID) },\n    { },\n};\nMODULE_DEVICE_TABLE(usb,\
  \ id_table);\n\n/* 查询 panic 键按钮状态 */\nstatic int get_panicb_button_status(struct\
  \ usb_panicb *panicb_dev) {\n    char *buf;\n    int ret = 0;\n    printk(KERN_INFO\
  \ \"get_panicb_status\\n\");\n    // 分配消息缓冲区\n    if (!(buf = kmalloc(8, GFP_KERNEL)))\
  \ {\n        printk(KERN_WARNING \"panicb: can't alloc buf\\n\");\n        return\
  \ -1;\n    }\n    memset(buf, 0, 8);\n    ret = usb_control_msg(panicb_dev->udev,\
  \ usb_rcvctrlpipe(panicb_dev->udev, 0), 0x01, 0xA1, 0x300, 0x00, buf, 8, 2 * HZ);\n\
  \    if (ret < 0)\n        printk(KERN_WARNING \"panicb: IN, ret = %d\\n\", ret);\n\
  \    else\n        panicb_dev->button = *buf;\n    kfree(buf);\n    return 0;\n\
  }\n\n// 字符设备函数\nstatic int panicb_open(struct inode *inode, struct file *file) {\n\
  \    struct usb_panicb *dev;\n    struct usb_interface *interface;\n    int minor;\n\
  \    minor = iminor(inode);\n    // 获取设备的接口\n    interface = usb_find_interface(&panicb_driver,\
  \ minor);\n    if (!interface)\n        return -ENODEV;\n    // 从接口获取私有数据\n    dev\
  \ = usb_get_intfdata(interface);\n    if (dev == NULL) {\n        printk(KERN_WARNING\
  \ \"panicb: can't find device for minor %d\\n\", minor);\n        return -ENODEV;\n\
  \    }\n    // 设置文件结构体\n    file->private_data = (void *)dev;\n    return 0;\n}\n\
  \nstatic int panicb_release(struct inode *inode, struct file *file) {\n    return\
  \ 0;\n}\n```\n\n\n\n\n```c\nstatic int panicb_ioctl (struct inode *inode, struct\
  \ file *file, unsigned int cmd, unsigned long arg)\n{\n\tstruct usb_panicb *dev;\n\
  \tprintk(KERN_DEBUG \"panicb_ioctl\\n\");\n\t/* get the dev object */\n\tdev = file->private_data;\n\
  \tif (dev == NULL)\n\t\treturn -ENODEV;\n\tswitch (cmd) {\n\tcase 0 :\n\t\tprintk(KERN_INFO\
  \ \"panicb_ioctl\\n\");\n\t\tif (get_panicb_button_status (dev) == 0) {\n\t\t\t\
  if (copy_to_user((void*)arg, &(dev->button), sizeof(int*))) {\n\t\t\t\tprintk (KERN_WARNING\
  \ \"panicb: copy_to_user error\\n\");\n\t\t\t\treturn -EFAULT;\n\t\t\t}\n\t\t}\n\
  \t\tbreak;\n\tdefault :\n\t\tprintk(KERN_WARNING \"panicb_ioctl(): unsupported command\
  \ %d\\n\", cmd);\n\t\treturn -EINVAL;\n\t}\n\treturn 0;\n}\n\nstatic struct file_operations\
  \ panicb_fops = {\n\t.open = panicb_open,\n\t.release = panicb_release,\n\t.ioctl\
  \ = panicb_ioctl\n};\n\n// USB driver functions\nstatic struct usb_class_driver\
  \ panicb_class_driver = {\n\t.name = \"usb/panicb\",\n\t.fops = &panicb_fops,\n\t\
  .minor_base = 0\n};\n\nstatic int panicb_probe (struct usb_interface *interface,\
  \ const struct usb_device_id *id)\n{\n\tstruct usb_device *udev = interface_to_usbdev\
  \ (interface);\n\tstruct usb_panicb *panicb_dev;\n\tint ret;\n\tprintk (KERN_INFO\
  \ \"panicb_probe: starting\\n\");\n\tret = usb_register_dev(interface, &panicb_class_driver);\n\
  \tif (ret < 0) {\n\t\tprintk(KERN_WARNING \"panicb: usb_register_dev() error\\n\"\
  );\n\t\treturn ret;\n\t}\n\tpanicb_dev = kmalloc (sizeof(struct usb_panicb), GFP_KERNEL);\n\
  \tif (panicb_dev == NULL) {\n\t\tdev_err (&interface->dev, \"Out of memory\\n\"\
  );\n\t\treturn -ENOMEM;\n\t}\n\t// Fill private structure and save it with usb_set_intfdata\n\
  \tmemset (panicb_dev, 0x00, sizeof (*panicb_dev));\n\tpanicb_dev->udev = usb_get_dev(udev);\n\
  \tpanicb_dev->button = 0;\n\tusb_set_intfdata (interface, panicb_dev);\n\tdev_info(&interface->dev,\
  \ \"USB Panic Button device now attached\\n\");\n\treturn 0;\n}\n\nstatic void panicb_disconnect(struct\
  \ usb_interface *interface)\n{\n\tstruct usb_panicb *dev;\n\tdev = usb_get_intfdata\
  \ (interface);\n\tusb_deregister_dev (interface, &panicb_class_driver);\n\tusb_set_intfdata\
  \ (interface, NULL);\n\tkfree(dev);\n\tdev_info(&interface->dev, \"USB Panic Button\
  \ now disconnected\\n\");\n}\n\nstatic struct usb_driver panicb_driver = {\n\t.name\
  \ = \"panicb\",\n\t.probe = panicb_probe,\n\t.disconnect = panicb_disconnect,\n\t\
  .id_table = id_table,\n};\n\n// Init & exit\nstatic int __init usb_panicb_init(void)\n\
  {\n\tint retval = 0;\n\tretval = usb_register(&panicb_driver);\n\tif (retval)\n\t\
  \tprintk(KERN_WARNING \"usb_register failed. Error number %d\", retval);\n\treturn\
  \ retval;\n}\n\nstatic void __exit usb_panicb_exit(void)\n{\n\tusb_deregister(&panicb_driver);\n\
  }\n\nmodule_init (usb_panicb_init);\nmodule_exit (usb_panicb_exit);\n```\n\n让我们详细分析源代码的关键行：\n\
  \n*   头文件包含以下内容：包含了内核编程、USB 支持、内存分配以及用户空间访问所需的必要头文件：\n```c\n#include <linux/kernel.h>\n\
  #include <linux/errno.h>\n#include <linux/init.h>\n#include <linux/slab.h>\n#include\
  \ <linux/module.h>\n#include <linux/usb.h>\n#include <asm/uaccess.h>\n```\n*   模块信息：以下代码定义了模块的元数据，包括作者、描述和许可证：\n\
  ```c\nMODULE_AUTHOR(\"BPB\");\nMODULE_DESCRIPTION(\"Panic Button driver: no URB\
  \ + char device\");\nMODULE_LICENSE(\"GPL\");\n```\n*   设备识别：以下代码将驱动与指定的 `Vendor_ID`\
  \ 和 `Product_ID` 关联：\n```c\n#define VENDOR_ID 0x1130\n#define PRODUCT_ID 0x0202\n\
  ```\n一方面，这允许模块在检测到此 ID 对时自动加载，例如通过 `UDEV` 规则。\n\n*   私有结构体：定义了一个私有结构体 `usb_panicb`\
  \ 用于存储特定设备的数据：\n```c\nstruct usb_panicb {\n\tstruct usb_device * udev;\n\tunsigned\
  \ int button;\n};\n```\n*   前向声明：USB 驱动的前向声明：\n```c\nstatic struct usb_driver panicb_driver;\n\
  ```\n*   USB 设备 ID 表：定义了与驱动兼容的 USB ID 表，并将其注册到内核：\n```c\nstatic struct usb_device_id\
  \ id_table [] = {\n\t{ USB_DEVICE(VENDOR_ID, PRODUCT_ID) },\n\t{ },\n};\nMODULE_DEVICE_TABLE(usb,\
  \ id_table);\n```\n*   Panic 按钮状态：实现 `get_panicb_button_status` 以获取状态。\n*   字符设备函数：实现了\
  \ `open`、`release` 和 `ioctl`。\n*   文件操作结构体：初始化 `panicb_fops` 及其指针。\n*   USB 类驱动初始化：初始化\
  \ `panicb_class_driver` 以处理设备操作。\n*   USB Probe 和断开函数：当设备插入或移除时调用 `probe` 和 `disconnect`。\n\
  *   USB 驱动结构体：定义 `panicb_driver` 包含 `probe`、`disconnect` 和 `id_table` 信息。\n*   模块初始化与退出：`usb_panicb_init`\
  \ 和 `usb_panicb_exit` 用于向内核注册模块。\n\n现在，我们可以学习用户态的小程序的源码：\n```c\n#include <stdlib.h>\n\
  #include <stdio.h>\n#include <unistd.h>\n#include <fcntl.h>\n#include <errno.h>\n\
  #include <string.h>\n#include <sys/ioctl.h>\n#include <limits.h>\n\nint main (int\
  \ argc, char **argv)\n{\n\tint b, fd = open(argv[1], O_RDONLY);\n\tif (fd < 0) {\n\
  \t\tperror(\"open()\");\n\t\treturn EXIT_FAILURE;\n\t}\n\tif (ioctl(fd, 0, &b))\
  \ {\n\t\tperror(\"ioctl\");\n\t\tclose(fd);\n\t\treturn EXIT_FAILURE;\n\t}\n\tprintf(\"\
  button= %d\\n\", b);\n\tclose(fd);\n\treturn EXIT_SUCCESS;\n}\n```\n\n执行：\n`$ ./panic_test\
  \ \"/dev/usbpanic\"`\n\n将 `usbpanic` 替换为 `mknod` 使用的正确名称。\n\n一旦程序建立了 `ioctl` 连接，驱动将提供按钮状态并显示它。\n\
  \n### 使用 libusb 在用户态编写 USB 驱动\n\nlibusb 是一个强大且灵活的库，它为用户态应用程序提供了一种在各种操作系统上与 USB 设备通信的标准方法。libusb\
  \ 的核心抽象了 USB 通信的低层细节，允许开发者无需处理不同平台的复杂性即可与 USB 设备交互。\n\nlibusb 通过提供一组 API 允许应用程序执行\
  \ USB 相关的任务，例如设备发现、配置和数据传输。它抽象了 USB 协议层并提供了统一的接口，使得开发者在 Windows、Linux 和 macOS 等不同平台上处理\
  \ USB 设备变得更加。\n\nlibusb 的主要功能包括：\n\n*   设备发现：libusb 允许应用程序发现已连接的 USB 设备，检索它们的信息并识别其能力。\n\
  \n\n\n\n\n- 配置与接口管理：它提供了配置 USB 设备和管理单个设备上多个接口的功能。这对于具有多功能或模式的设备至关重要。\n- 数据传输：`libusb`\
  \ 促进了应用程序与 USB 设备之间的数据传输。它支持多种传输类型，例如控制传输、批量传输、中断传输和等时传输。\n- 异步操作：开发者可以执行异步操作，实现与\
  \ USB 设备之间的非阻塞式通信。这对于需要快速响应且不希望在数据传输期间被阻塞的应用程序特别有用。\n- 平台无关性：`libusb` 抽象了底层的操作系统细节，允许开发者编写无需重大修改即可在不同平台运行运行的\
  \ USB 应用程序。\n- 热插拔事件：`libusb` 支持热插拔事件，当 USB 设备动态连接或断开时，可以通知应用程序。\n- 驱动程序交互：它提供了与\
  \ USB 设备驱动程序交互的机制，并在需要时从 USB 设备上挂载/卸载内核驱动程序。\n\n`libusb` 使开发者能够以平台无关的方式与 USB 设备交互，抽象了\
  \ USB 通信的复杂性。其全面的 API 集合能够处理广泛的 USB 相关任务，使其成为需要 USB 设备交互的应用程序的价值工具。\n\n在 Linux 系统上，`libusb`\
  \ 提供了一个 C API，允许开发者与 USB 设备进行交互。\n\n以下是 `libusb` API 中关键组件和函数的概述：\n\n### 初始化与退出函数\n\
  \n- `libusb_init`：初始化 `libusb` 库。在使用任何其他 `libusb` 函数之前必须调用此函数。\n- `libusb_exit`：在使用完成\
  \ `libusb` 库后对其去初始化。\n\n用法示例：\n\n```c\n#include <libusb.h>\n\nint main() {\n  libusb_init(NULL);\
  \ // Initialize Libusb\n\n  // ... (perform USB operations)\n\n  libusb_exit(NULL);\
  \ // Deinitialize Libusb\n\n  return 0;\n}\n```\n\n### USB 设备发现函数\n\n- `libusb_get_device_list`：检索当前连接到系统的\
  \ USB 设备列表。\n- `libusb_free_device_list`：释放从 `libusb_get_device_list` 获取的设备列表。\n\
  \n用法示例：\n\n```c\nlibusb_device **list;\nssize_t count = libusb_get_device_list(NULL,\
  \ &list);\nfor (ssize_t i = 0; i < count; ++i) {\n  // Access each device in the\
  \ list\n  libusb_device *device = list[i];\n  // ... (handle device information)\n\
  }\nlibusb_free_device_list(list, 1); // Free the list when done\n```\n\n### 获取 USB\
  \ 设备信息的函数\n\n- `libusb_get_device_descriptor`：检索 USB 设备描述符，提供供应商 ID (vendor ID)、产品\
  \ ID (product ID) 等信息。\n\n用法示例：\n\n```c\nstruct libusb_device_descriptor desc;\n\
  libusb_get_device_descriptor(device, &desc);\n// Access information in the 'desc'\
  \ structure\n```\n\n### 用于配置设备及其接口的函数\n\n- `libusb_get_config_descriptor`：检索设备的配置描述符。\n\
  - `libusb_set_configuration`：设置设备的活动配置。\n- `libusb_claim_interface`：声明设备上的某个接口供应用程序使用。\n\
  \n用法示例：\n\n```c\nlibusb_config_descriptor *config;\nlibusb_get_config_descriptor(device,\
  \ 0, &config); // 0 for the first configuration\n// Access information in the 'config'\
  \ structure\n(...)\nlibusb_set_configuration(handle, config->bConfigurationValue);\n\
  libusb_claim_interface(handle, interface_number);\n```\n\n### 用于传输数据的函数\n\n- `libusb_bulk_transfer`：在应用程序与\
  \ USB 设备之间执行批量传输。\n\n用法示例：\n\n```c\nunsigned char buffer[64];\nint transferred;\n\
  libusb_bulk_transfer(handle, endpoint, buffer, sizeof(buffer), &transferred, timeout);\n\
  // Access data in the 'buffer' after the transfer\n```\n\n### 支持异步数据传输的函数\n\n- `libusb_submit_transfer`：提交异步传输请求。\n\
  \n用法示例：\n\n```c\nlibusb_transfer *transfer = libusb_alloc_transfer(0);\n// Initialize\
  \ transfer parameters\nlibusb_submit_transfer(transfer);\n// Wait for the transfer\
  \ to complete or handle it asynchronously\nlibusb_free_transfer(transfer);\n```\n\
  \n### 错误处理函数\n\n- `libusb_strerror`：将 libusb 错误码转换为人类可读的字符串。\n\n用法示例：\n\n```c\n\
  int result = libusb_bulk_transfer(handle, endpoint, buffer, sizeof(buffer), &transferred,\
  \ timeout);\nif (result < 0) {\n  fprintf(stderr, \"Error: %s\\n\", libusb_strerror(result));\n\
  }\n```\n\n通过 `libusb` 与 USB 设备（如如下所示的按钮）进行交互，需要理解设备的通信协议：\n\n具体的实现方式将根据您的 USB 设备的规范而异。以下是一个简化的示例，假设有一个假设的\
  \ USB 设备在按下或释放按键时会发送信号。\n\n此示例在输入端点（假设为 `0x81`）上设置了中断传输。它会持续轮询 USB 设备以按钮状态的变化。\n\
  \n您需要根据特定的 USB 设备通信协议对此代码进行调整。\n\n请参考您特定的 USB 设备通信协议。\n\n\n\n\n\n以下是一个使用 `pkg-config`\
  \ 调用 `libusb` 项目的简单 `CMakeLists.txt` 文件示例。这假设你在同一目录下有一个名为 `main.c` 的源文件。\n\n下面的列表详细说明了构建该项目的\
  \ `CMakeLists.txt`：\n\n```\ncmake_minimum_required(VERSION 3.5)\nproject(libusbExample)\n\
  find_package(PkgConfig REQUIRED)\npkg_check_modules(LIBUSB REQUIRED libusb-1.0)\n\
  add_executable(myusbprogram main.c)\n```\n\n以下是每个部分的简要解释：\n\n*   第 4 行：`find_package(PkgConfig\
  \ REQUIRED)`\n    *   此行确保 CMake 能够找到并使用 `pkg-config`。\n*   第 5 行：`pkg_check_modules(LIBUSB\
  \ REQUIRED libusb-1.0)`\n    *   此行使用 `pkg-config` 查找 `libusb` 库的必要信息，包括包含目录和库。\n\
  *   第 7 行：`add_executable(myusbprogram main.c)`\n    *   此行告诉 CMake 从源文件 `main.c`\
  \ 构建一个名为 `myusbprogram` 的可执行文件。\n*   第 9 行：`target_include_directories(myusbprogram\
  \ PRIVATE ${LIBUSB_INCLUDE_DIRS})`\n    *   此行为目标 `myusbprogram` 包含 `libusb` 的包含目录。\n\
  *   第 10 行：`target_link_libraries(myusbprogram PRIVATE ${LIBUSB_LIBRARIES})`\n \
  \   *   此行将 `libusb` 库链接到 `myusbprogram` 可执行文件。\n\n将此内容保存到与 `main.c` 相同目录下的 `CMakeLists.txt`\
  \ 文件中。然后，你可以使用以下命令构建你的项目：\n\n```\n$ mkdir build && cd build\n$ cmake ..\n$ make\n\
  ```\n\n这假设你的系统中已经安装了 CMake（在 Debian/Ubuntu 系统上使用 `sudo apt-get install cmake`）。根据需要调整\
  \ `main.c` 和项目结构。\n\n## 结论\n\n在本章中，我们回顾了 USB 架构后，解释了如何使用 USB 类型设备。然后，我们详细介绍了如何实现一个控制此类设备的驱动程序。\n\
