    The DRAM on the Raspberry Pi board is DDR2, which is generally not vulnerable
    to Rowhammer-type exploits.


    # 11.5.2 Spectre, Meltdown, Foreshadow


    A modern OS has memory protection mechanisms which stop a process from accessing
    data belonging to another, and also stop processes from accessing kernel memory.
    Speculative execution attacks exploit the fact that a CPU will already start accessing
    data before it knows it is allowed, i.e., while the memory protection check is
    progress. In theory, this is permissible because the results of this speculative
    execution should be protected at the hardware level. If a process does not have
    the right privilege, it is not allowed to access this data, and the data is discarded.


    However, the protected data is stored in the cache regardless of the privilege
    of the process. Cache memory can be accessed more quickly than regular memory.
    The attacker process can try to access memory locations to test if the data has
    been cached, by timing the access. This is known as a side-channel attack. Both
    Spectre and Meltdown, and also the most recent Foreshadow exploit, by combining
    speculative execution and a cache-side channel attack.


    Meltdown [9] gives a user read access to kernel memory. The protection in Linux
    is a fundamental change to how memory is managed: as explained in Chapter 6, Linux
    normally maps kernel memory into a portion of the user address space for each
    process. On systems vulnerable to the Meltdown exploit, this allows the attacker
    process to read from kernel memory. The solution is called kernel page-table isolation
    (KPTI).


    Spectre [10] is a more complex exploit, harder to execute, but also harder to
    mitigate against. There are two variants: one ("bounds-check bypass", CVE-2017-5753)
    depends on the existence of a vulnerable code sequence that is conveniently accessible
    from user space; the other ("branch injection", CVE-2017-5715) depends on poisoning
    the processor''s branch prediction mechanism so that indirect jumps under speculative
    execution be redirected to an attacker-chosen location. The mitigation strategies
    are discussed in a post on LWN.


    Finally, Foreshadow [11] (or L1 Terminal Fault) is the name for three speculative
    execution vulnerabilities that affect Intel processors. Foreshadow exploits a
    vulnerability in Intel''s SGX (Software Guard Extensions) technology. SGX creates
    a ''secure enclave'' in which users can provide secure software code that runs
    without being observed by the operating system. SGX protects Meltdown and Spectre;
    however, Foreshadow manages to circumvent this protection. A good explanation
    of the exploit is given by Jon Masters, chief arm architect at Red Hat.


    The Arm processor on the Raspberry Pi board is not susceptible to these speculative
    execution attacks as it does not perform speculative execution.'
