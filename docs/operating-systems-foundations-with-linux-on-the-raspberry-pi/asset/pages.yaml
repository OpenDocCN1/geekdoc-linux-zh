    # Memory barriers

    Memory barriers smp_mb <before,after>atomic() are not the only types of barrier
    provided by the Linux kernel. We can distinguish the following types [6]:


    # General barrier


    A general barrier (barrier) from include/linux/compiler.h has no effect at runtime;
    it only serves as an instruction to the compiler prevent reordering of memory
    accesses from one side of the statement to the other. For the gcc compiler, this
    is implemented in the kernel code as


    ```

    Listing 7.3.9: Linux kernel general barrier

    ```

    1 #define barrier() asm__volatile__(":"": "memory")

    ```

    ```


    # Mandatory barriers


    To enforce memory consistency on a full system level, you can use mandatory barriers.
    This is most common when communicating with external memory-mapped peripherals.
    The kernel mandatory barriers are guaranteed to expand to at least a general barrier,
    independent of the target architecture.


    The Linux kernel has three mandatory CPU barriers:


    GENERAL mb() A full system barrier. All memory operations before the mb() in the
    instruction stream will be committed before any operations after the mb() are
    committed. This ordering will be visible to all bus masters in the system. It
    will also ensure the order in which accesses from a single processor reaches slave
    devices.


    WRITE wmb() Like mb(), but only guarantees ordering between read accesses: all
    read operations before an rmb() will be committed before any operations after
    the rmb().


    READ rmb() Like mb(), but only guarantees ordering between write accesses: all
    write operations before a wmb() will be committed before any write operations
    after the wmb(). [6].


    For the Arm Arch64 architecture, these barriers are implemented in arm64/include/asm/barrier.h
    as with the dsb() macro implemented in arm/include/asm/barrier.h as:


    ```

    Listing 7.3.10: Arm implementation of kernel memory barriers (1)

    ```

    1 #define mb() dsb(sy)

    2 #define rmb() dsb(ld)

    3 #define wmb() dsb(st)

    ```

    ```


    with the dsb() macro implemented in arm/include/asm/barrier.h as:


    ```

    Listing 7.3.11: Arm implementation of kernel memory barriers (2)

    ```

    1 #define isb(option) asm__volatile__("isb" #option : : "memory")

    2 #define dsb(option) asm__volatile__("dsb" #option : : "memory")

    3 #define dmb(option) asm__volatile__("dmb" #option : : "memory")

    ```

    ```


