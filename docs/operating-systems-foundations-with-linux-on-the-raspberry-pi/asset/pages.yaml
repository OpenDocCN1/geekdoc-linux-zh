    # 6.5.7 Copy on write


    When a process is forked, it shares its parent''s memory (although logically it
    has a distinct, isolated copy of the parent''s virtual address space). The child
    virtual address space maps to the same physical frames, until either parent or
    child tries to write some data. At that stage, a fresh frame is allocated dynamically
    for the writing process.


    This copy on write mechanism is supported through duplicated page table entries
    between parent and child processes, page protection mechanisms, and sophisticated
    page fault handling, as outlined above.


    Copy on write leads to efficient forking; child page allocation is deferred until
    data write operations occur—pages are shared between parent and child until their
    diverges through write operations.


