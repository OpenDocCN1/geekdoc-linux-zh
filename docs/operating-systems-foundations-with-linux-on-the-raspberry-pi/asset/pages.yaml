  md: '# Operating Systems Foundations with Linux on the Raspberry Pi


    Create a socket descriptor: socket()


    A socket (socket(2)) is opened, and its descriptor created using:


    ```

    Listing 10.6.4: socket(2) API call

    ```c

    #include <sys/types.h>      /* See NOTES */

    #include <sys/socket.h>

    int socket(int domain, int type, int protocol);

    ```

    ```


    Return value: the returned socket descriptor is a standard I/O system file descriptor
    and can also be used with the I/O functions: close() and in the case of stream
    type sockets with read()'' and ''write()''. On error, value -1 is returned.


    Input parameters: The address parameter domain should be set to AF_INET for internet
    socket communications. The socket type parameter type should be selected from
    SOCK_STREAM or SOCK_DGRAM for stream (TCP) and datagram (UDP) sockets respectively.
    The protocol family parameter can be set to 0 to allow the socket function to
    select the associated protocol automatically.


    Bind a server socket to a socket descriptor: bind()

    For ''server'' type applications (i.e., those for listening on connections on
    an opened socket) the server socket address is bound to a socket descriptor using
    bind(2):


    ```

    Listing 10.6.5: bind(2) API call

    ```c

    #include <sys/types.h>      /* See NOTES */

    #include <sys/socket.h>

    int bind(int socketfd, const struct sockaddr *addr, socklen_t addrlen);

    ```

    ```


    Return value: the function returns 0 on success or -1 if the socket is invalid,
    the specified socket address is invalid or if the specified socket descriptor
    is already bound.


    Input parameters: typically for internet server type applications an internet
    socket address is used for convenience when specifying the local socket address;
    however since the internet socket structure is designed as the generic socket
    address structure — variables of type struct sockaddr_in can be passed as the
    addr parameter using a suitable cast. Before calling the bind() function it is
    necessary to populate the internet socket address (shown as myaddr below) with
    the local system IP address and the required server port number:'
