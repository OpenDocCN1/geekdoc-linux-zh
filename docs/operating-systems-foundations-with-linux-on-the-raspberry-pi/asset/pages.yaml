- img_proc: true
  md: '# Operating Systems Foundations with Linux on the Raspberry Pi


    clock algorithm inspects the current candidate—if its access bit is set, then
    the access bit is unset and the clock hand advances to the next page. The first
    page with an unset access bit is selected as the victim to be swapped out. This
    is a ‘second chance’ algorithm.


    ![](img/17ca5177da1b1e15b2169f9c7932e5b6_169_0.png)


    Figure 6.13: Clock page replacement algorithm.


    # Least recently used


    A genuine recently used (LRU) scheme either upgrades the single access-linked
    list to sort them by longer access timestamp for each page, or shuffles pages
    in a doubly-linked list to sort them in order of access time. The victim page
    is then easily selected as the page with the oldest timestamp, and the page at
    the tail of the list respectively. Both of these techniques have significant management
    overhead.


    The memory manager actually implements a variant of the LRU replacement scheme.
    Pages allocated to processes are added to the head of a global active pages queue.
    When a page needs to be evicted, the tail of this queue is examined. If the tail
    page has its access bit set, it is moved back to the head of the queue, and its
    access bit is unset. However, if the tail page does not have its access bit set,
    it is a candidate for replacement, and it is moved to the inactive pages queue
    from where it may be swapped.


    The page replacement algorithm is implemented in function `do_try_to_free_pages()`
    in source code file `linux/mm/vmscan.c`, but be be aware that this is a complex
    piece of code to trace.


    # Tuning the system


    Linux has a kernel parameter called `swappiness`, which controls how aggressively
    the kernel swaps pages out to the backing store. The value should be an integer
    between 0 and 100 inclusive. Higher values are more aggressive at swapping pages
    from less active processes out of physical memory, which improves file-system
    performance (cache).


    Note that on a Raspberry Pi device, the swappiness may be set at a particularly
    low value, since the swap file is on an SD card, which has high access latency
    and may fail with excessive write operations.


    Find your current system''s swappiness value with:


    ```

    cat /proc/sys/vm/swappiness

    ```'
