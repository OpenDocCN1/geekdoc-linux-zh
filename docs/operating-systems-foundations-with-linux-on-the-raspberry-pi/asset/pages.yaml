  md: 'Preface


    In Chapter 7, Concurrency and parallelism, we discuss how the OS supports concurrency
    and how the OS can assist in exploiting hardware parallelism. We define concurrency
    and parallelism and discuss how they relate to threads and processes. We discuss
    the key issue of resource sharing, covering locking, semaphores, deadlock and
    livelock. We look at OS support for concurrent and parallel programming via POSIX
    threads and present an overview of practical programming techniques using OpenMP,
    MPI and OpenCL.


    Chapter 8 Input/output presents the abstraction of an IO device. We review device
    interfacing, covering topics like Polling, Interrupts and DMA. We investigate
    a range of device types, to highlight their features and behavior. We will cover
    hardware registers, memory mapping and coprocessors. Further, we will examine
    the ways in which devices are exposed to programmers. We will review the structure
    of a typical device driver.


    Chapter 9 Persistent storage focuses on data storage. We outline the range of
    cases for file systems. We explain how the raw hardware (block- and sector-based
    2d storage, etc.) is abstracted at the OS level. We talk mapping high-level concepts
    like files, directories, permissions, etc., down to physical entities. We review
    allocation, space management, and recovery from failure. We present a case study
    of a Linux file system. We also discuss Windows-style FAT, which is how USB bulk
    storage operates.


    Chapter 10 Networking introduces networking from an OS perspective: why is networking
    treated differently from other types of IO, what are the OS requirements to support
    the OSI stack. We introduce socket programming with a focus of the role the OS
    plays (e.g. zero-copy buffers, file abstraction, supporting multiple clients,
    ...).


    Finally, Chapter 11 Advanced topics discusses concepts that go beyond the material
    of the previous chapters: The first part of this chapter deals with customisation
    of Linux for Embedded Systems, Linux on systems without MMU, and datacentre level
    operating systems. The second part discusses the security of Linux-based systems,
    focusing on validation and verification of OS components and the analysis of recent
    security exploits.


    We hope that you enjoy reading our book and doing the exercises – especially if
    you are trying them on the Raspberry Pi. Please do let us know what you think
