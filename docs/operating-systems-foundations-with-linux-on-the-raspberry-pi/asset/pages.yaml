    +   1. Why does Linux use a separate socket API for networking, instead of using
    the file API?

    2. Sketch in pseudocode the timeline of the various socket library function calls
    required in a typical (simple) stream socket connection.

    3. Which POSIX socket API calls are blocking and why?'
