  md: '# Operating Systems Foundations with Linux on the Raspberry Pi


    implement these layers. The lower three layers, Network, Data Link and Physical,
    are known as “Media layers” (short for communications media layer). The media
    layers are responsible for delivering the information to the destination for which
    it was intended. The functionality of these layers is typically implemented in
    the network adapter.


    # 10.5 The Linux networking stack


    In practice, the Session and Presentation layers are not present as distinct layers
    in the typical TCP/IP based networking stack. A practical layer model for the
    TCP/IP protocol stack is shown in Figure 10.1.


    | Network stack | Example |

    |---|---|

    | User space | |

    | User/Application | Web browser, email client |

    | Application layer | HTTP, SMTP, SSL protocols |

    | Kernel space | |

    | Transport layer | TCP, UDP protocol |

    | Network layer | IP, IPv6 protocols |

    | Link layer | Ethernet driver |

    | Hardware layer | Ethernet |


    Figure 10.1: Layer model for the TCP/IP protocol stack.


    The Linux kernel provides the link layer, network layer, and transport layer.
    The link layer is implemented through POSIX-compliant device drivers; the network
    and transport layers (TCP/IP) are implemented in the kernel code. In the next
    sections, we provide an overview of the Linux kernel networking architecture (Figure
    10.2).


    ![](img/17ca5177da1b1e15b2169f9c7932e5b6_277_0.png)


    Figure 10.2: Linux kernel networking architecture.'
