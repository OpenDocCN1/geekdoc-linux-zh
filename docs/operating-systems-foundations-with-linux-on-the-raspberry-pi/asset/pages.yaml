  md: '# Glossary of terms


    Persistent storage


    Also known as non-volatile storage is a type of storage that retains its data
    even if the device is powered off. Examples are solid-state drives (SSD), hard
    disks, and magnetic tapes.


    Polling


    The action of periodically checking the state of a peripheral.


    POSIX


    The Portable Operating System Interface (POSIX) is a family of IEEE standards
    aimed at maintaining compatibility between operating systems. POSIX defines the
    application programming interface (API) used by programs to interact with the
    operating system.


    Preemption


    The act of temporarily interrupting a task being carried out by a computer system
    (and in particular a process running on a CPU), without requiring the cooperation
    of that task, and with the intention of resuming the task at a later time. Preemption
    is a key feature of preemptive multitasking. The alternative approach where the
    cooperation of a task is needed called cooperative multitasking.


    Process


    A process is a running program, i.e., the code for the program and all system
    resources it uses. The concept of a process is used for the separation of code
    and resources. With this definition, a process can consist of multiple threads.


    Process control block (PCB)


    Also known Task Control Block (TCB). The operating system kernel data structure,
    which contains the information to manage the scheduling of a particular process.


    RAM


    Random-access memory. Data stored in RAM can be read or written in almost the
    same amount of time irrespective of the physical location of data inside the memory.
    This opposed to other direct-access data storage media such as hard disks, CDs,
    DVDs, and magnetic tapes.


    Reduced instruction set computing (RISC)


    A CPU with a small set of simple and general instructions, rather than a large
    set of complex and specialized instructions. Arm processors have a RISC architecture.


    Register file


    An array of words called registers, typically implemented as SRAM memory and part
    of the CPU.


    Root user


    In Linux and other Unix-like computer OSes, root is the conventional name of the
    user who has all rights or permissions (to all files and programs) in all modes
    (single- or multi-user). Alternative names include superuser and administrator.
    In Linux, the actual name of the account is not the determining factor.


    Scheduling


    The mechanism used by the operating system kernel to allocate CPU time to tasks.'
  merge: -1
  pgno: 325
- img_proc: true
  md: '# Glossary of terms


    SIMD (Single instruction multiple data)


    A type of parallel computation where multiple processing elements perform the
    same operation on multiple data points simultaneously.


    SRAM


    Static random-access memory, lower-density memory, faster than DRAM. It is typically
    used for cache memory in a computer system. An SRAM cell is a latch, so it retains
    its value as the device is powered on, without the need for refreshing.


    Symmetric multiprocessing (SMP)


    An operational model for multicore systems where two or more identical cores are
    connected to a single, shared main memory, have full access to all input and output
    devices, and are controlled by a single operating system instance that treats
    all processors equally, reserving none for special purposes. Most modern multicore
    systems use an SMP architecture.


    System clock


    A counter of the time elapsed since some arbitrary starting date the epoch. Linux
    and other POSIX-compliant systems system time as the number of seconds elapsed
    since the start of the Unix epoch at 1 January 1970 00.00.00 UT, with exceptions
    for leap seconds.


    System state


    The set of all information in a system that the system remembers between events
    or user interactions.


    System-on-chip (SoC)


    Also called system-on-a-chip, an IC (integrated circuit) that integrates all components
    of a computer system. These components typically include a CPU, memory, I/O ports,
    and secondary storage, combined on a single chip.


    Task


    A unit of execution or unit of work on a computer system. The term is somewhat
    less strictly defined and usually relates to scheduling.


    Thread


    Multiple concurrent tasks executing within a single process are called threads
    of execution. The threads of a process share its resources. For a process with
    a single thread of execution, the terms task and process are often used interchangeably.


    Timer


    A specialized type of clock used for measuring specific time intervals.


    Translation look-aside buffer (TLB)


    A special type of cache which stores recent translations of virtual memory to
    physical memory. It is part of the MMU.


    User


    In general, a user is a person who utilizes a computer system. However, in the
    context of an operating system, the term user is used more broadly to identify
    the ownership of processes and resources. Therefore a user does not need to be
    a person.'
  merge: -1
  pgno: 326
- img_proc: true
  md: '# Glossary of terms


    # Virtual machine


    A program which emulates a computer system. Virtual machines are based on computer
    architectures and provide the functionality of a physical computer. Modern computer
    systems provide hardware support for deployment of Virtual Machines (virtualization)
    through hypervisors.


    # Word


    A fixed-size, contiguous array of bits used by a given processor design. A word
    is a fixed-sized piece of data handled as a unit by the instruction set or the
    hardware of the processor. The number of bits in a word (also called word size,
    word width, or word length) is a key characteristic for any specific processor
    architecture. Typically, a word consists of a number of bytes (a sequence of 8
    bits), which are stored either in little-endian or big-endian format (see endianness).
    The most common word sizes for modern processors are 64 and 32 bits, but processors
    with 8 or 16-bit word size are still used for embedded systems.'
  merge: -1
