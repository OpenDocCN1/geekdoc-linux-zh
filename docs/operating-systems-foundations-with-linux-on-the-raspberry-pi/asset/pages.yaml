    would push the content of R1 onto the stack and then pop it into R2. The PUSH
    and POP instructions are encoded similar to the LDR and STR memory operations.
    We extend the executeInstruction definition to support the stack with the following
    functions:


    ```

    Listing 1.4.2 Push/pop implementation

    1 def doPush(registers,systemState,args):

    2 sptr = registers[SP]

    3 r1_,=args

    4 systemState[sptr]=registers[r1]

    5 registers[SP]=-1

    6 return(registers,systemState)

    7

    8 def doPop(registers,systemState,args):

    9 sptr = registers[SP]

    10 r1_,=args

    11 registers[r1]=systemState[sptr]

    12 registers[SP]=-1

    13 return(registers,systemState)

    ```


    # 1.4.2 Subroutine calls


    One of the main reasons for having a stack is so that the processor can handle
    subroutine calls, and in particular, subroutines that call other subroutines or
    call themselves (recursive call). This is because whenever we call a subroutine,
    the code in the subroutine will overwrite the register file, so we need to store
    the registers somewhere before we call a subroutine.


    To support this mechanism, most processors have instructions to change the control
    flow: a first instruction, the call instruction changes the program counter to
    the location of the subroutine to be called. A second instruction, the return
    instruction, returns the location after the subroutine call instruction. These
    instructions use either the stack or a dedicated register to save the program
    counter.


    In the Arm 32-bit instruction set the call and return instructions are usually
    implemented using BL and BX; the Arm convention stores the return address in the
    link register LR, and we will use the same convention in our model. We extend
    the executeInstruction to support subroutine call and return as follows:


    ```

    Listing 1.4.3 Call/return implementation

    1 def doCall(registers,args):

    2 pctr=registers[PC]

    3 (_,saddr,)=args

    4 registers[LR]=pctr

    5 registers[PC]=saddr

    ```'
