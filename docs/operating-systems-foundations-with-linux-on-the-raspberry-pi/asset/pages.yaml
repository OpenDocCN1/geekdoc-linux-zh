    \ with a pointer to the embedded struct rb_node, the containing data structure\
    \ may be accessed with the standard container_of) macro. In addition, individual\
    \ members may be accessed directly via rb_entry(node, type, member).\n\nAt the\
    \ root of each rbtree is a rb_root structure, which is initialized to empty via:\n\
    \n```\nListing 5.8.20: Root for rbtree\n```\nstruct rb_root mytree = RB_ROOT;\n\
    ```\n```"
