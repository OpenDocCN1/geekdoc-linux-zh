    To avoid confusion, note that a ''page table entry'' may refer to one of two different
    concepts:


    +   1. A Linux PTE, which is a leaf in the page table, containing 512 mappings
    from virtual to physical addresses.


    +   2. A single mapping from a virtual to a physical address, along with corresponding
