  md: '# Operating Systems Foundations with Linux on the Raspberry Pi


    In a computer system, there are many shared resources: file system, IO devices,
    memory. Let''s first consider the case of a shared file, e.g., a file in your
    home directory will be accessible by all processes owned by you. Slightly simplifying,
    when a process opens a file, the file content is read into the memory space of
    the process. When the process closes the file, any changes will be written back
    to disk. If two or more processes access the file concurrently while writing,
    there is a potential for conflict: the changes made by the last process to write
    back to disk will overwrite all previous changes. Therefore, most editors will
    warn if a file was modified by another process while open in the editor.


    ![](img/17ca5177da1b1e15b2169f9c7932e5b6_185_0.png)


    Figure 7.2: Concurrent access to a shared file using echo and vim.


    For example, in Figure 7.2, I opened a file test_shared_access.txt in vim (right
    pane), and while it was opened, I modified it using echo (left pane). As you can
    see, when I tried to save the file in the editor, it warned me that the file had
    been changed.


    In the case of shared files, most operating systems leave the access control to
    the user. In the previous example, before writing, vim checked the file on disk
    for changes. This is not possible for shared access to IO devices because they
    are controlled by the operating system. This makes access control easy because
    the OS can easily keep track of the processes using an IO resource. Shared access
    to memory is more problematic. However, seen, memory is not normally shared between
    processes; each process has its own memory space. However, in a multithreaded
    process, the memory is shared between all threads. In this case, the operating
    system leaves the access control to the user, i.e., the programmer of the application.
    However, the operating system and the hardware provide support for access control.
    The OS uses hardware support to implement its internal mechanisms, and these are
    used to implement the programmer API (e.g., POSIX threads).


    # Exchange of information


    When concurrent tasks need to exchange information that is required to continue
    execution, there is a need to make sure that the sender waits for the message
    (if it is sent late) or stores the message until needed (if it was sent early).
    Furthermore, if two or more tasks require information'
