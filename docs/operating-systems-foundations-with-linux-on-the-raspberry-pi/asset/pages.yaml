  md: "# Chapter 7 | Concurrency and parallelism\n\nAlthough OpenCL supports task-parallel\
    \ programming, its main model is data parallelism. To divide a data space over\
    \ compute units and processing elements, OpenCL provides the concepts of the n-dimensional\
    \ range (NDRange), work-groups, and work-items, as illustrated in Figure 7.10\
    \ for a 2-D space. The NDRange specifies how many threads will be used to process\
    \ the data. Note that this can be larger than the actual number of hardware threads,\
    \ in which case OpenCL will schedule threads on the available hardware. The NDRange\
    \ can be further split into a global range and a local range. To illustrate this,\
    \ consider a 1-D case for a device with 16 compute units which each have 128 threads,\
    \ and we want to map exactly one hardware thread per element in the NDRange. In\
    \ that case, the global NDRange will be 16*128 and the local NDRange 128. Now\
    \ assume that the data to be processed is an array of 64M words, then how to process\
    \ 32,768 elements per hardware thread. We can use the global NDRange index and\
    \ global size to identify which portion of the array thread must process, as shown\
    \ in the following code:\n\n> Listing 7.10: OpenCL example\n\n```\n// aSize =\
    \ the size of array, i.e. 64M\n// kernel square(global float a, ..global float\
    \ a_squared, const int aSize) (\n    int gl_id = get_global_id(0); // 0 .. 16*128-1\n\
    \    int gSize = get_global_size(0); // 16*128\n    // alternatively\n    int\
