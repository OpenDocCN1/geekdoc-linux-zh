  md: '# Chapter 6 | Memory management


    On a desktop Linux installation, the default value is generally 60. Try something
    like:


    ```

    sudo sysctl -w vm.swappiness=100

    ```


    and see whether this changes the performance of your system over time.


    When the physical memory resource becomes chronically over-committed, active pages
    may be swapped out and swapped with increasing frequency. The whole system slows
    down drastically since no process can make progress without incurring major page
    faults. All the system time is spent servicing these page faults, no useful work
    is achieved. The phenomenon is known as thrashing, and it badly affects system
    performance.


    # 6.5.6 Demand paging


    Linux implements demand paging, which means physical memory is allocated to processes
    in a lazy, or just-in-time, manner. A call to mmap has only an effect on the process
    page table; frames are not allocated to the process directly. The process is only
    assigned physical memory resource when it really needs it.


    The memory management subsystem records areas of virtual memory that are mapped
    in the virtual address space, but for the physical memory has not yet been allocated.
    (These are zeroed-out entries in the page table.) This is the mechanism that enables
    demand paging: when the process tries to access a memory location that is in this
    uninitialized state, a page fault occurs, and the physical memory is directly
    allocated. This corresponds to the bottom left case (alloc fresh empty page) in
    Figure 6.12.


    The high-level layout of a process'' virtual address space is specified by the
    mm_struct data structure. The process'' task_struct instance contains a field
    that points to the relevant mm_struct. The definition of mm_struct is in include/linux/mm_types.h.
    It stores a linked list of vm_area_struct instances, which model virtual memory
    areas (VMAs).


    The list of VMAs encapsulates each set of non-overlapping, contiguous blocks of
    memory. Each VMA has a start and end-address, also aligned with page boundaries.
    The vm_area_struct, defined in include/linux/mm_types.h, has permission flags,
    and prev and next pointers for the linked list structure. Reading from /proc/PID/maps
    traces the linked list of VMAs one by one, for instance, see Figure 6.10.


    Each vm_area_struct also has a field for a backing file, in this case VMA is a
    memory-mapped file. If there is no file, this is an anonymous VMA which corresponds
    to an allocation of physical memory. When a page fault occurs for an address due
    to demand paging, the kernel looks up the relevant VMA data via the mm_struct
    pointer. Each VMA has an embedded set of function pointers wrapped in a vm_operations_struct.
    One of these entries points to a specific do_no_page function that implements
    the appropriate paging behavior for this block of memory: the invoked allocation
    might be allocating a fresh physical frame for an anonymous VMA, or reading data
    from a file pointer for a file-backed VMA.


