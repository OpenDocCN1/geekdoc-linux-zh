    \ the program counter to the starting address, then the fetch-decode-execute cycle\
    \ will execute each instruction on subsequent clock ticks until the program is\
    \ finished.\n\nNow we want to run two programs at the same time. Therefore, we\
    \ will need a mechanism to run instructions of each program alternately. This\
    \ mechanism translates to managing the state. As we have seen before, the state\
