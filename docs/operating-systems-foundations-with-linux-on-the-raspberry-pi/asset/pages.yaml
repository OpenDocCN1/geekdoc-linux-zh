    # 6.7 Advanced topics


    There are several memory management techniques to improve system security and
    defend against overflow attacks. Address layout space randomization (ASLR) introduces
    random noise into the locations of executable code and runtime memory areas like
    the stack and heap. This unpredictability makes it more difficult for an attacker
    to verify known code. The page metadata bit NX indicates a page is not executable.
    Again, this mitigates code injection attacks from user-input.


    ![](img/17ca5177da1b1e15b2169f9c7932e5b6_174_0.png)


    Figure 6.15: Visualizations of memory access patterns for an invocation of the
    ls command, shown for first 100,000 instructions; the high red/yellow line is
    the stack, the low blue line is the program executable text.


    As single address space systems become larger, in in both of the number of processor
    cores and the amount of installed physical memory, there is increasing variance
    in memory access latency. One reason for this is that some processor cores are
    located closer to RAM chips; perhaps a motherboard has several sockets, and integrated
    packages are plugged into each socket with RAM and processor cores. This arrangement
    is referred to as non-uniform memory access or NUMA.


    Figure 6.16 shows an example NUMA system, based on the Cavium ThunderX2 Arm processor
    family. There are two NUMA regions (per socket). Each region has tens of cores
    and a local bank of RAM. Physical memory is mapped to pages, as outlined above.
    There is a single address space, so every memory location is accessible from every
    core, but with different access latencies. Processor'
