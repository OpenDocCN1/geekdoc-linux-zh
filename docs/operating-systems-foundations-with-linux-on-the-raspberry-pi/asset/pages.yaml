    # 7.6.5 Intel threading blocks (TBB)


    Intel threading blocks (TBB) is an open-source, object-oriented C++ template library
    for parallel programming originally developed by Intel [21, 22]. It is not specific
    to the Intel CPU architecture and works well on the Arm architecture; because
    it is implemented using the POSIX thread API. Intel TBB contains several templates
    for parallel algorithms, such as parallel_for and parallel_reduce. It also contains
    useful data structures, such as concurrent_vector and concurrent_queue. Other
    important features of the TBB are its scalable memory allocator as well as its
    primitives for synchronization and atomic operations.


    TBB abstracts the low-threading details. However, the tasks come with an overhead.
    Conversion of the legacy code requires restructuring certain parts of the program
    to fit the TBB templates. Moreover, there is a significant overhead associated
    with the sequential execution of a TBB program, i.e., with a single thread [23].'
