  md: '# Chapter 7 | Concurrency and parallelism


    Memory operation ordering

    On a symmetric multiprocessing (SMP) system, accesses to memory from different
    CPUs are in principle not ordered. We say that the memory operation ordering is
    relaxed. Very often, some degree of ordering is required. The default for the
    Linux kernel is to impose a strict overall order via what is called a memory barrier.
    Strictly speaking, a memory barrier imposes a partial ordering over the memory
    operations on either side of the barrier. To quote from the Linux kernel documentation
    (memory_barriers.txt),


    Such enrichment is important because the CPUs and other devices in a system can
    use a variety of tricks to improve performance, reordering, deferral, and combination
    of memory operations; speculative loads; branch prediction and various types of
    caching. Memory barriers are used to override or suppress these tricks, allowing
    the code to safely control the interaction of multiple CPUs and/or devices.


    The kernel provides the memory barriers smp_mb_before_atomic() and in practice,
    the strict operation is composed of a relaxed operation preceded and followed
    by a barrier, for example:


    # Listing 7.3: Linux kernel atomic operation through barriers


    ```

    1 atomic_fetch_add();

    2 // is equivalent to :

    3 smp_mb before_atomic();

    4 atomic_fetch_add_relaxed();

    5 smp_mb after_atomic();

    ```


    Between relaxed and strictly ordered there are two other possible semantics, called
    acquire and release.


    Acquire semantics apply to RMW operations and load operations that read from shared
    memory (read-acquire), and it prevents memory reordering of the read-acquire with
    any read or write operation that follows it in program order.


    Release semantics apply to RMW operations and store operations that write to shared
    memory (write-release), and it prevents memory reordering of the write-release
    with any read or write operation that precedes it in program order.


    Table 7.1 provides a summary of the possible cases.


    | Type of operation | Ordering |

    |---|---|

    | Non-RMW operations | Unordered |

    | RMW operations | |

    | RMW operations | That have no return value | Unordered |

    | | That have a return value | Fully ordered |

    | | That have an explicit ordering | |

    | | [operation name]_relaxed | Unordered |

    | | [operation name]_acquire | RMW read is an ACQUIRE |

    | | [operation name]_release | RMW write is a RELEASE |


    Table 7.1: Memory operation ordering semantics.'
