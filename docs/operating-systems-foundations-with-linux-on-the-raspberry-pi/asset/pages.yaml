  md: '# Chapter 5 | Process scheduling


    Assume for a moment the system would execute these tasks one by one, waiting until
    a task completes, execute the next task. The very first task would occupy the
    processor, so one of the other tasks would be able to run. Therefore the operating
    system gives each process, in turn, a slice of CPU time.


    # 5.2.3 Scheduling for performance


    However, there is another important benefit of scheduling. The processor is very
    fast (remember, even the Raspberry Pi executes 10 million instructions in a single
    Linux time slice). When accessing peripherals for I/O, the processor has to wait
    for the peripheral, and this can take a long time because peripherals such as
    disks are comparatively slow. For example, simply accessing DRAM without a cache
    takes between 10 and 100 clock cycles: accessing a hard disk takes several milliseconds,
    millions of cycles. Without concurrent execution, the CPU would idle until the
    I/O request had completed. The operating system will schedule the next task on
    the CPU.


    # 5.2.4 Scheduling policies


    A policy is used to decide what of CPU time a process will get and when it will
    be scheduled. In practice, processes have different needs. For example, when playing
    a video, it is important that the image does not freeze or stutter, so it is better
    to give such a process frequent short slices than infrequent long ones. On the
    other hand, many of the systems that run invisibly in the background are not time
    critical, so the operating system might decide to schedule them with low priority.


    In the rest of the chapter, we will look in detail the scheduling component of
    the kernel and its relationship to the process management infrastructure discussed
    in the previous chapter.


    # 5.3 Recap: the process lifecycle


    Recall from the previous chapter that the operating system manages each process
    through a data structure called the Process Control Block, which in Linux is implemented
    using the task_struct. With respect to the process lifecycle, the main attribute
    of interest is the state which can be one of the following from (linux/sched.h)


    ```

    #define TASK_RUNNING 0x0000

    #define TASK_INTERRUPTIBLE 0x0001

    #define TASK_UNINTERRUPTIBLE 0x0002

    #define TASK_STOPPED 0x0004

    #define TASK_TRACED 0x0008

    #define TASK_PARKED 0x0010

    #define TASK_WAKEILL 0x0100

    #define TASK_WAKING 0x0200

    #define TASK_NOLAD 0x0400

    #define TASK_NEW 0x0800

    #define TASK_SLEEP_MAX 0x1000

    #define TASK_NORMAL (TASK_INTERRUPTIBLE | TASK_UNINTERRUPTIBLE)

    #define TASK_IDLE (TASK_UNINTERRUPTIBLE | TASK_NOLAD)

    ```


    as well as the exit_state which can be one of the following:'
