    If you compile the Linux kernel on a Raspberry Pi device, it will take several
    hours—even with parallel compilation threads enabled. On the other hand, cross-compiling
    the kernel on a modern x86-64 PC takes only a few minutes at most.


    # ### 2.5 Administrator and programmer view of the key chapters


    From a systems programmer or administrator perspective, Linux is a POSIX-compliant
    system. POSIX (the Portable Operating System Interface) is a family of IEEE standards
    aimed at maintaining compatibility between systems. POSIX defines the application
    programming interface (API) used by programs to interact with the operating system.
    In practice, the standards are maintained by [The Open Group](The Open Group),
    the certifying body for the UNIX trademark, which publishes the [Single UNIX Specification](Single
    UNIX Specification), an extension of the IEEE POSIX standards (currently at version
    4). The key chapters in this book discuss both general (non-POSIX specific) concepts
    and theory as well as the POSIX-compliant implementations.


    ### 2.5.1 Process management

    Linux administrators and programmers need to be familiar with processes, what
    they are, and how they are managed by the kernel. Chapter 4 ''Process management''
    introduces the process abstraction. We outline the state that needs to be encapsulated.
    We walk through the typical lifecycle of a process from forking to termination.
    We review the typical operations that will be performed on a process.'
