    Reproducibility is a key goal in modern systems. This is important for scientific
    experiments, for debugging, for ensuring compatibility in a highly eclectic system
    of software components. Declarative scripting languages, like those provided by
    Nix or Puppet, enable systems to be configured easily to a common standard. This
    is ideal for DevOps scenarios. The Nix package manager keeps track of all code
    and dependencies required to build each executable, via a cryptographic hash.
    This is encoded directly in the path for the executable, e.g. /nix/store/a9i0a06cs89jf9ngsh10b6vvqpzip4-bash4p3
    which means multiple versions of an application can coexist in the same system,
    and be managed with configurable profiles. System administrators never need to
    ''overwrite'' an old application or library when they upgrade to a new version,
    which makes compatibility and reliability much easier.


