  md: '# Operating Systems Foundations with Linux on the Raspberry Pi


    The third approach, which is new in ext4, involves extents. An extent is a contiguous
    area of storage reserved for a file (or a file which may contain multiple extents).
    An extent is characterized by a starting block number, a length measured in blocks,
    then the logical block address corresponding to the starting number. See struct
    ext4_extent in fs/ext4/ext4_extents.h for details.


    The chief benefit of an extent-based file system is reduction in meta-data. Whereas
    a block map system requires a metadata entry (a block location) for every block,
    each extent only returns a single block address for a contiguous run of blocks.
    It is good practice to make file data as contiguous as possible, to improve access
    times.


    The 60 bytes of ext4_inode may be used to store a 12-byte extent header followed
    by an array of up to four 12-byte extent structures.


    If there are more than four extents in the file, the extent data can be arranged
    as a multi-level N-ary tree, up to five levels. Extent data spills out from the
    inode into data blocks. A data block storing extent data begins with an ext4_extent_header
    which states how many extent entries are in this block and the tree depth. The
    entries follow in an array layout. If the tree depth is 0, the entries are leaf
    nodes, i.e., entries pointing directly to extents of data blocks on disk. If the
    tree depth is greater than 0, then the entries are index nodes, i.e., ext4_extent_idx
    entries, pointing to further blocks of extent data. These structures are all defined
    in fs/ext4/ext4_extents.h. Figure 9.14 gives an example, with a two-level extent
    tree. This is similar to the indirect addressing used in the previous approach.


    ![](img/17ca5177da1b1e15b2169f9c7932e5b6_261_0.png)


    Figure 9.14: Schematic diagram of ext4 extents scheme for data block locations.'
