  md: '# Chapter 9 | Persistent storage


    There are other special-purpose values for FAT entries, as listed in Figure 9.15.
    All entries have the same fixed length, as specified by the FAT variant. FAT12
    has 12-bit entries, FAT16 is 16-bit, FAT32 has 32-bit.


    | entry | meaning | FAT16 value |

    |---|---|---|n| 0 | free block | 0x0000 |

    | 1 → (MAXWORD - 16) | temporarily non-free | 0x0001 |

    | MAXWORD - 15 → MAXWORD - 9 | next block pointer | |

    | MAXWORD - 8 | reserved values | 0xFF6 |

    | MAXWORD - 7 → MAXWORD | bad block | 0xFF7 | of file marker | 0xFF8 → 0xFFFF
    |


    **Figure 9.15** FAT entries and their interpretation.


    In FAT systems, a directory is a special type of file that consists of multiple
    entries. Each directory occupies 32 bytes and encodes the name and other metadata
    of a file (although not as rich as an inode, generally) along with the FAT index
    of the first block of file data.


    In earlier FAT formats (i.e., 12 and 16) the root directory occupies the special
    root directory region. It is statically sized when the file system is created,
    so there is a limited number of entries in the root directory. For FAT32, the
    root directory is a general file in the data region so it can be resized dynamically.


    Figure 9.16 shows how the various regions of the FAT file system are laid out
    on a device. The initial reserved block is for boot code. The FAT is a fixed size,
    depending on the number of blocks available in the data region. Each FAT entry
    is n bytes long, for the FAT-n variant of the file system, n may be 12, 16 or
    32. For FAT12 and FAT16, as shown in the diagram, the root directory is a distinct,
    fixed-size region. This is followed by the data region, which contains all other
    directories and files.


    ![](img/17ca5177da1b1e15b2169f9c7932e5b6_264_0.png)


    **Figure 9.16** Schematic diagram showing regions for a FAT format disk image.


    # 9.12.1 Advantages of FAT


    Due to the linked list nature of files, they may accessed sequentially by chasing
    pointers from the start of the file. Since the pointers are all close together
    (in the FAT, rather than inline in the data blocks) they have high spatial locality.
    The FAT is often cached in RAM, so it is efficient to access and traverse.


    FAT is a simple file system in terms of implementation complexity. Its simplicity,
    along with its longevity, ensures its widespread deployment.


