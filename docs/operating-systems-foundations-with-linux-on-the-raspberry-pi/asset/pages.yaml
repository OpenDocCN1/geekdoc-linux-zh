  md: 'Waiting time: The time spent by a task in the ready queue waiting to be run
    on the CPU.


    Response time: The time taken between submitting a request and obtaining a response.


    Load average: The average number of processes in the ready queue. On Linux, it
    is reported by \`uptime` and \`who`.


    In general, we want to optimize the average value of criteria, i.e., maximize
    CPU utilization and throughput, and minimize all the others. It is also desirable
    to minimize the variance of a criteria because users prefer a consistently predictable
    system over an inconsistent one, even if the latter performs better on average.


