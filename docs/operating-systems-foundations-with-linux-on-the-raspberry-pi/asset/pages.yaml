  md: '# File system


    Each partition of a disk contains a further system for logical organization. The
    purpose of most file systems is to provide the file and directory (folder) abstractions.
    There are a great different file systems (e.g., fat32, ext4, hfs+, ...) and we
    will cover the most important ones in Chapter 9. For the purpose of this chapter,
    what you need to know is that a file system not only allows to store information
    in the form of files organized in directories but also information about the permissions
    of usages for files and directories, as well as timestamp information (file creation,
    modification, etc.).


    The information in a file system is typically organized as a hierarchical tree
    of directories, and the directory at the root of the tree is the root directory.
    To use a file system, the kernel performs an operation mounting. As long as a
    file system has not been mounted, the system can''t access the data on it.


    Mounting a file system attaches file system to a directory (mount point) and makes
    it available to the system. The root (/) file system is always mounted. Any other
    file system can be connected or disconnected from the file system at any point
    in the directory tree.


    # 2.2.6 ''Everything is a file''


    One of the key characteristics of Linux and other UNIX-like operating systems
    is the often-quoted concept of ''everything is a file''. This does not mean that
    all objects in Linux are files as defined above, but rather Linux prefers to treat
    all objects which the OS can read data or to which it can write using a consistent
    interface. So it might be more accurate to say ''everything is a stream of bytes''.
    Linux uses the concept of a file descriptor, an abstract handle used to access
    an input/output resource (of which a file is just one type). So one can also say
    that in Linux, everything is a file descriptor.


    What means in practice is that the interface to, e.g., a network card, keyboard
    or display is represented as a file in the file system (in the /dev directory);
    system information about both hardware and software is available under /proc.
    For example, Figure 2.2 shows the listing of /dev and /proc on the Raspberry Pi.
    We can see devices representing memory (ram*), terminals (tty*), modem (ppp),


    ![](img/17ca5177da1b1e15b2169f9c7932e5b6_58_0.png)'
