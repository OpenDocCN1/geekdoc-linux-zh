  md: '# Chapter 7 | Concurrency and parallelism


    A task is the central unit of execution in TBB, which is scheduled by the library''s
    runtime engine. One of the advantages of TBB over OpenMP is that it does not require
    specific compiler support. TBB is based on efficient runtimes.


    # 7.6.6 MapReduce


    MapReduce, originally developed by Google [24], has become a very popular model
    for processing large data sets, especially on large clusters (cloud computing).
    The processing consists of partitioning the dataset to be processed and defining
    map and reduce functions. The map functionality is responsible for parallel processing
    of a large volume of data and generating intermediate key-value pairs. The role
    of the reduce functionality is to merge all the intermediate values with the same
    intermediate key.


    Because of its simplicity, MapReduce has quickly gained popularity. The partitioning,
    communication and message passing, and scheduling across different nodes are all
    handled by the runtime system so the user only has to express the MapReduce semantics.
    However, its is limited to scenarios where the dataset can be operated on in embarrassingly
    parallel fashion. The MapReduce specification does not assume a shared or distributed
    memory model. Most of the implementations have been on large clusters, there has
    been work on optimizing it for multicores [25]. Popular implementations of the
    MapReduce model are Spark and Hadoop.


    # 7.7 Summary


    In this chapter, we have introduced the concepts of concurrency and parallelism,
    explained the difference between them and looked at why both are essential in
    modern computer systems. We have studied how the Arm hardware architecture and
    the Linux kernel handle and support concurrency and parallelism. In particular,
    we have discussed the synchronization primitives in the kernel (atomic operations,
    locks, semaphores, barriers, etc.) and how they rely on hardware features; we
    have also looked at the kernel support for parallelism, in particular in terms
    of the scheduler and the control over the placement of threads.


    We have introduced the data-parallel and task-parallel programming models and
    briefly discussed a number of popular practical parallel programming frameworks.


