    architecture uses the concept of shareability domains [4], which are the Inner
    Shareable, Outer Shareable, System, or Non-shareable, as illustrated in Figure
    7.4. These domains are mainly used to restrict the range of memory barriers, as
    discussed in Section 7.3.5.


    ![](img/17ca5177da1b1e15b2169f9c7932e5b6_189_1.png)


    Figure 7.4: Shareability domains in An manycore system, based on [5].'
