    # 5.4.2 The implications of the system call mechanism


    Whenever a user wants to perform I/O or any other system-related operation, the
    operating system takes over. This means that every system call involves a context
    switch, with overheads, as discussed in the previous chapter. Note that in the
    time taken to perform a context switch time (around 10µs) the CPU could have executed
    10,000 operations, so the overhead of context switching is considerable.


    Virtual dynamic shared object (vDSO)

    to reduce the overhead of system calls, over two mechanisms have been introduced
    into the Linux kernel: vsyscall (virtual system call) and vDSO Dynamic Shared
    Object). The original syscall mechanism is now obsolete so we only discuss the
    vDSO. The purpose of both mechanism is the same: allow system calls without the
    need for a context switch. The rationale behind this mechanism is that some system
    calls are frequently used but not actually require kernel privileges and therefore
    handing control over these operations to the kernel is an unnecessary overhead.
    As the names indicate, these are implemented in a specially dynamically shared
    library (linux-vdso.so) which is automatically provided by the kernel to any process.
    In practice, for the Arm architecture only two system calls are implemented this
    way: clock_gettime() and gettimeday().


    # 5.5 Scheduling principles


    After this detour into the process lifecycle and the role of system system calls,
    let''s have a look at the principles of OS scheduling and what criteria an OS
    can use for making decisions.


    Let''s assume a number of tasks are active in the system, and each of these tasks
    spends a certain portion of its lifetime running on the CPU and another portion
    waiting. It is also possible that the task is ready to run, but the CPU is occupied
    by another task.'
