  md: '# Operating Systems Foundations on Linux on the Raspberry Pi, a special interface
    called Accelerator Coherency Port


    However, in the higher-end Arm Cortex-A series provided as part of the Arm AXI
    standard. The reason is that on multicore processors with cache coherency, the
    cache system complicates the DMA transfer because it is possible that some data
    has not been written to the main memory during the transfer. With the ACP, the
    Cortex-A series implement a hardware mechanism to ensure that shared DMA memory
    regions are cache-coherent. Without such a mechanism, the operating system (or
    end-user software on a bare-metal system) must ensure the coherency. More details
    on integrating a DMA engine in an Arm-based multiprocessor SoC are provided in
    the Application Note Implementing DMA on ARM SMP Systems [10].


    On the Arm Cortex A53, the ACP is optional, and it is not provided on the SoC
    in the Raspberry Pi 3. The DMA controller on the Raspberry Pi SoC is not a Arm
    IP core. It is part of the I/O peripheral address space. An additional complication,
    in this case, is that the DMA controller uses CPU bus so for a DMA transfer the
    software needs to translate between the Arm physical addresses and the CPU busses.


    In general, DMA controllers are complex devices that usually have their own instruction
    set as well as a register file. This means the Linux kernel needs a dedicated
    driver for the DMA controller.


    # 3.7 Summary


    In this chapter, we had a look at two different types of Arm processors: the Arm
    Cortex M0+, a singlecore, low gate count, highly energy-efficient processor for
    microcontroller and deeply embedded applications that implement the Armv6-M architecture,
    and the Arm Cortex A53 used in the Raspberry Pi 3, a mid-range, low-power processor
    that implements the Armv8-A architecture and has all required to run an OS like
    Linux. We have discussed these processors in terms of their instruction set, interrupt
    model, security model, and memory system. We have also introduced the Arm address
    maps and Direct memory access (DMA) support.


