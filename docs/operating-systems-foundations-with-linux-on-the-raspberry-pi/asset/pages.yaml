  md: '# 10.5.1 Device drivers


    The physical network devices (NIC) are managed by device drivers. For what follows,
    we assume the NIC is an Ethernet device. The device driver is a software interface
    between the kernel and the device hardware. On the kernel side, it uses a low-level
    and standardized API so that any driver for a different NIC can be used in the
    same way. In other words, the device driver abstracts away as much as possible
    the specific hardware.


    The normal file operations (read, write, ...) do not make sense when applied to
    the interaction between a driver and a NIC, so they do not follow the "everything
    is a file" philosophy. The main difference is that a file and a storage device
    is passive, whereas a network device actively wants to push packets towards the
    kernel. So NIC Interrupts are not a result of a previous kernel action (as is
    the case with, e.g., file operations), but of the arrival of a packet. Network
    interfaces exist in their own namespace with a different API.


    # 10.5.2 Device-agnostic interface


    The network protocol interfaces with the device code through an agnostic interface
    layer which allows us to connect various protocols to a variety of hardware device
    drivers. To achieve this, the calls work on a packet-by-packet basis so that it
    is not necessary to inspect the packet content or keep protocol-specific state
    information at this level. The interface API is defined in linux/net/core/dev.c
    The actual interface is a struct of function pointers net\_ defined in include/linux/net/device.h.
    In the driver code, the applicable fields are populated using device-specific
    functions.


    # 10.5.3 Network protocols


    Packets get handed over the actual network protocol functionality in the kernel.
    For our purpose, we focus on the TCP/IP protocol, known in the Linux kernel as
    inet. This is a whole suite of protocols, the best-known of which are IP, TCP,
    and UDP. The code for this can be found in ipv4.h for IPv4 and ipv6.h for IPv6.


    In particular, ipv4 protocols are initialized in an inet\_init() defined in linux/net/ipv4/af_inet.c.
    This function registers each built-in protocols using the proto\_register() function
    defined in linux/net/core/sock.c. It adds the protocol to the active protocol
    list and also allocates one or more slab caches. The Linux kernel implements a
    caching allocator to hold caches (slabs) of identical objects. A slab is one of
    one or more groups of pages set aside by the slab allocator for an individual
    cache.


    # 10.5.4 Protocol-agnostic interface


    The network protocols interface with a protocol-agnostic layer that provides a
    set of common functions to support a variety of different protocols. This layer
    is the sockets layer, and it supports not only the common TCP and UDP transport
    protocols but also the IP routing protocol, various Ethernet protocols, and others,
    e.g., Stream Control Transmission Protocol (SCTP). We will discuss the POSIX socket
    interface more detail in section 10.6.


    The socket is an abstraction for the network connection. The socket datructure
    contains all of the required state of a particular socket, including the particular
    protocol used by the socket and the operations that may be performed on it. The
    networking subsystem knows about the'
