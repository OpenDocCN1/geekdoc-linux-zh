  md: '# Operating Systems Foundations with Linux on the Raspberry Pi


    # 6.1 Overview


    As with other hardware resources, a machine''s random access memory (RAM) is managed
    by the operating system on behalf of user applications. This chapter explores
    specific details of memory management in Linux.


    # What you will learn


    After you have studied the material in this chapter, you will be able to:


    +   1. Constrain the speed and size of data storage locations across the range
    of physical memory technologies.


    +   2. Justify the reasons for using a virtual addressing scheme.


    +   3. Navigate Linux page data structures to decode a virtual address.


    +   4. Assess the relative merits of various page replacement policies.


    +   5. Appraise the design decisions underlying Arm hardware support for virtual
    memory.


    +   6. Explain why a process must maintain its working set of data in memory.


    +   7. Describe the operation of key kernel routines that must be invoked to maintain
    the virtual memory abstraction.


    # 6.2 Physical memory


    Memory is a key high-level computing component. Along with the processor, it is
    the main element identified in Von Neumann''s original, abstract model of computer
    architecture from the 1940s, see Figure 6.1.


    ![](img/17ca5177da1b1e15b2169f9c7932e5b6_151_0.png)


    Figure 6.1: Von Neumann architecture of a computer.


    RAM technology has advanced significantly since those early days, when a flat
    memory structure, featuring a few kilobytes of storage, would require large, specialized,
    analog circuits.


    The sheer complexity of modern memory is mostly due to the inherent trade-off
    between size and speed. Small memory may be accessed rapidly, e.g., an individual
    register in a CPU. On the other hand, large memory has a high access latency—the
    worst case is often backing storage based on tape drives in a data warehouse.'
