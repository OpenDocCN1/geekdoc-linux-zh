  md: '# Operating Systems Foundations with Linux on the Raspberry Pi


    For short-term scheduling, the process context data is stored in RAM (i.e., kernel
    memory). For processes that are not likely to be executed again in the short-term,
    the process memory is paged out to disk. Given that the context captures all we
    need to resume the process, this paging is relatively straightforward (see Chapter
    6). Another possibility is that the process might be migrated across a network
    link to another machine, perhaps within a cloud datacenter (see Chapter 11).


    There are three practical questions to ask, in terms of context switching on a
    Linux system.


    Q1: How long does a process actually execute before it is switched out?

    We will cover process scheduling in more detail in the next chapter. However,
    Linux specifies a scheduling quantum which is a notional amount of time each process
    will be executed in a round-robin style before a context switch. This quantum
    time value is specified on my Raspberry Pi as 10ms. You can check the default
    value on your Linux system with:


    Q2: How much data do we need to save for a process context?

    For each thread, there is a thread_info struct, to capture saved register values
    and other processor context. This data structure can be up around 500 bytes on
    a 32-bit Arm processor with hardware floating-point store. There is also process
    context information, however, how much of this data will already be in memory,
    so probably minor updates required at a context switch event.


    Q3: How long does a context switch take, on a standard Linux machine?

    The context overhead measures the time taken to suspend one process and resume
    another. This overhead must be made as low as possible on interactive systems,
    to enable rapid and smooth context switching between user processes.


    The open-source Imbench utility [2] contains code to measure a range of low-level
    system performance characteristics, including the context switch overhead. Download
    the code 따로, then execute the following commands:


    ![](img/17ca5177da1b1e15b2169f9c7932e5b6_107_0.png)


    ```

    tar xvzf lmbench3.tar.gz

    cd lmbench3/src

    make results

    # ignore errors

    cd .../bin/armv7l-linux-gnu/

    ./lat_ctx -s 0 10

    ```


    This reports the context switch overhead for your machine. On my Raspberry Pi
    2 Model B v1.1 running Linux kernel 4.4, Imbench reports a context switch overhead
    of around 12 µs. What do you measure on your machine?'
