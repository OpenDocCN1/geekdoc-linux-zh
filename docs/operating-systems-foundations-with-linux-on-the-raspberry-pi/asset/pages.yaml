  md: '# Operating Systems Foundations with Linux as the Raspberry Pi


    # 9.1 Overview


    Where does data go when your machine is powered down? Volatile data, stored in
    RAM, will be lost; however, data saved on persistent storage media is retained
    for future execution. A file system is a key OS component that supports the consolidation
    of persistent data into discrete, manageable units files.


    The Linux design philosophy is often summarized as, ''Everything is a file.''
    All kinds of OS entities, including processes, devices, pipes, and sockets, may
    be treated as files. For this reason, it is important to have a good understanding
    of the Linux file system since it underpins the entire OS.


    # What you will learn


    After you have studied the material in this chapter, you will be able to:


    +   1. Illustrate the directed acyclic graph nature of the Linux file system.


    +   2. Appreciate how the user-visible file system maps onto OS-level file system
    concepts and primitives.


    +   3. Explain how file system directories work, to index and locate file contents.


    +   4. Analyze the trade-offs involved in different file system decisions


    +   5. Understand the need for file system consistency and integrity, identifying
    approaches to preserve or repair this integrity.


    +   6. Identify appropriate techniques for file system operations on a range of
    modern persistent storage media.


    # 9.2 User perspective on the file system


    # 9.2.1 What is a file?


    A file is a collection of data that is logically related; it somehow ''belongs''
    together. A file is the smallest discrete unit of data in a file system. Regular
    files may contain textual data (with utilities like cat) or binary data (with
    utilities like hexdump). The stat command will report details about a single file.
    It uses it to determine basic information about the target file, and then it checks
    a set of ''magic'' heuristics to guess the actual type of file based on its contents.


    Other users infer the type of a file from its extension (the letters after the
    dot in the filename). However, this is not always a reliable guide to the file
    system, since the extension is simply a part of the filename and can be modified
    by users.


    In Linux, everything is a file (at least, everything appears to be a file). In
    simplest terms, this means everything is addressable by a name in the file system,
    and these names can be the target of file calls such as stat. Entities that aren''t
    actually regular files have distinct types. For instance, if you execute ls -1
    in a directory, you will see the first character on each line specifies the distinct'
