  md: '# Operating Systems Foundations with Linux on the Raspberry Pi


    However, files can belong to multiple directories due to hard links. For example,
    consider this sequence of commands:


    > Listing 9.2.1: File creation example


    ```

    1 cd /tmp

    mkdir a; mkdir b

    echo hello > a/thefile.txt

    4 ln a/thefile.txt b/samplefile.txt

    ```


    where /tmp/a/thefile.txt and /tmp/b/samplefile.txt are actually the same file.
    Try editing one of them, and viewing the other. You will observe that the changes
    are carried over; also that the two filenames have common metadata when viewed
    with ls -1. Filenames should be considered more like pointers to files, rather
    than the actual file themselves. This leads to a graph-like structure, see Figure
    9.3. However, if you try to remove one of the files, e.g., rm /tmp/a/thefile.txt,
    then the link is removed, but the file is still present. It can be accessed via
    the other link.


    ![](img/17ca5177da1b1e15b2169f9c7932e5b6_245_0.png)


    Figure 9.3: Graphical view of multiple linked files that map to the same underlying
    data.


    Note that files can belong to multiple directories (i.e., have multiple hard links)
    but directories cannot have extra links. For example, try to do ln /tmp/a /tmp/b/another_a
    and notice the error that occurs. Additional hard links for directories are not
    allowed. This is because we want to prevent cycles into the directory hierarchy.
    If we consider a link to be a directed edge in the directory graph, then we want
    to enforce a directed acyclic graph. If the only nodes that have multiple incoming
    edges are regular files (i.e., nodes with no successors), then it is impossible
    to introduce cycles into the graph.


