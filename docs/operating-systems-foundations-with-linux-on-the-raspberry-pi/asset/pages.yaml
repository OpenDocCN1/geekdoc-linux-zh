    # 11.5.1 Rowhammer, Rampage, Throwhammer, and Nethammer


    The original Rowhammer exploit makes use of DRAMs in modern DRAM, in particular,
    DDR3 and DDR4 SDRAM. Essentially, in such DRAMs, there is a non-zero probability
    of flipping a bit in a row by alternating accesses to the adjacent rows [4]. The
    actual exploit uses this flaw by allowing permission bits to be flipped in a page
    table entry (PTE) that causes the PTE to point to a physical page containing the
    target of attacking process. This process thereby read-write access to one of
    its own pages, and hence to the entire memory. A very good explanation is given
    in the original blog post by Mark Seaborn. You can also test if your computer
