    \ sockaddr*)s_addr, sizeof(s_addr)) < 0) {\n    perror(\"connect\");\n    return(-1);\n\
    }\n```\n\n# 10.6.7 Handling multiple clients\n\nThe skeleton code from Section\
    \ 10.6.5 will block the accept() and read() calls for the connection to a single\
    \ client. That means it can only serve itself. Typically, servers should be able\
    \ to handle many client requests. In this section, we discuss the mechanisms that\
    \ can be used to build multi-client servers.\n\n# The select(2) system call\n\n\
    The select(2) enables one to monitor several sockets at the same time. It indicates\
    \ which sockets are ready for reading, which are ready for writing, and which\
    \ sockets have raised exceptions. While select() is primarily used for networking\
    \ applications, it works for file descriptors bound to any I/O device. The synopsis\
    \ is:\n\n# Listing 10.6.26 select(2) API call\n\n```\n/* According to POSIX.1-2001,\
    \ POSIX.1-2008 */\n#include <sys/select.h>\n/* According to earlier standards\
    \ */\n#include <sys/time.h>\n#include <sys/types.h>\n#include <unistd.h>\n\nint\
    \ select(int nfds, fd_set *readfds, fd_set *writefds, \n    fd_set *exceptfds,\
    \ struct timeval *timeout\\imeout);\n```\n\n**Return value:** the return value\
    \ is the number of file descriptors that have been set in the fd_-sets; if a timeout\
    \ occurred, then the return value is 0. On error, the value -1 is returned.\n\n\
    **Input parameters:** For the *nfds* parameter, see below. Each *fd_set* parameter\
    \ should have bits corresponding to file descriptors of interest for reading/writing/exceptions);\
    \ upon return, the *fd_set* parameter will have bits set for those file descriptors\
    \ that are ready for reading/writing or those that have generated exceptions.\
    \ The timeout parameter should contain the time to wait before returning; if the\
    \ parameter has a value of 0, select() simply checks the current state of the\
    \ file descriptors in the *fd_set* parameter and returns immediately; if *timeout*\
    \ is NULL, then select() waits until there is some activity on one of the file\
    \ descriptors specified."
