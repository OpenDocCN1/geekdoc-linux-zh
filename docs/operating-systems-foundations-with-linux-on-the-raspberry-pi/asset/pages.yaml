    valuable material, including source code commentary. It is the definitive overview
    of the complex virtual memory management subsystem in the Linux kernel.


    Details of more recent kernel changes are available at the Linux Memory Management
    wiki, https://linux-mm.org.


    To learn about Arm hardware support for memory management, consult Furber''s Arm
