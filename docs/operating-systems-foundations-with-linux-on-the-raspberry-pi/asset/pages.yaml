    # 9.9 Constructing a logical file system


    Given this block-based storage scheme, how we do build a high-level file system
    on top of


    Some blocks will be dedicated to indexing, allowing us to associate block addresses
    with high-level files and directories. Other blocks will be used to store user
    data, the contents of files. As outlined above, the smallest space a file can
    occupy is a single block. Depending on the block size and the average file size,
    this may cause internal fragmentation, where space is allocated to a file but
    unused by that files.


    A system architect makes decisions about how to arrange sets of blocks for large
    files. There are trade-offs to consider, such as avoiding space fragmentation
    and minimizing file access latency. Possible strategies include:


    +   **Contiguous blocks**: a large file occupies a single sequence of consecutive
    blocks. This is efficient when there is lots of space, but can lead to external
    fragmentation problems (i.e., awkwardly sized, unusable holes) when files are
    deleted, or files need to grow in size.


    +   **Indexed blocks**: a large file occupies a set of blocks scattered all over
    the disk, with an accompanying index to maintain block ordering. This reduces
    locality of disk access and requires a large index overhead (like page tables
    for virtual memory). However, there are no external fragmentation issues.


    +   **Linked blocks**: a large file is a linked list of blocks, which may be scattered
    across the disk. There is no fragmentation issue and requirement for a complex
    index. However, it is now inefficient to access the file contents in anything
    other than a linear sequence from the beginning.


    Every concrete file system incorporates such design decisions. First, we consider
    an abstraction that allows Linux to handle multiple file systems in a scalable
    way.


