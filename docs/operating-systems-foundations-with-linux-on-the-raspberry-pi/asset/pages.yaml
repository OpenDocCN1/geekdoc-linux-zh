  md: '# Operating Systems Foundations with Linux on the Raspberry Pi


    # 8.1 Overview


    While the conceptual von Neumann architecture only presents processor and memory
    as computer components, in fact, there is a wide variety of devices that users
    hook up to computers. These devices facilitate input and output (IO) to enable
    the computer system to interact with the real world. This chapter explores the
    OS structures and mechanisms that are used to communicate with such devices and
    to control them.


    # What you will learn


    After you have studied the material in this chapter, you will be able to:


    +   1. Sketch the hardware organization and datapaths supporting device interaction.


    +   2. Comprehend the rationale for the distinctive Linux approach to supporting
    devices.


    +   3. Implement simple device driver and interrupt handler routines.


    +   4. Justify the need for direct-memory access for certain classes of devices.


    +   5. Identify buffering strategies in various parts of the system.


    +   6. Appreciate the requirement to minimize expensive block memory copy operations
    between data regions.


    # 8.2 The device zoo


    A vast variety of devices may be connected to the Raspberry Pi, using a range
    of connection ports and protocols.


    Modern devices vary wildly in size, price, bandwidth, and purpose. Input devices
    receive information from the outside world, digitize it, and enable it to be processed
    on the computer. In terms of input devices, a push-button (perhaps attached to
    the Raspberry Pi GPIO pins) is a simple input device, with a binary [0, 1] value.
    A high-resolution USB camera is a complex input device, with a large pixel array
    of inputs to be sampled. Output devices take data from the machine and represent
    this, or respond to it in some way. A simple output device is an LED, which is
    either on or off. The green on-board activity LED may be turned on or off with
    a shell command, as shown below.


    > Listing 8.2.1: Controlling the on-board LED


    ```

    # these commands must be executed without privileges

    # turn on the green LED

    echo 1 >/sys/class/led0/brightness

    # turn off the green LED

    echo 0 >/sys/class/led0/brightness

    ```'
