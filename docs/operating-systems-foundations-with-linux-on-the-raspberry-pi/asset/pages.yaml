  md: '# Operating Systems Foundations with Linux on the Raspberry Pi


    caches may hide some of the variance in memory access times, but NUMA caching
    protocols are complex. Writes to shared data can invalidate shared cache entries,
    forcing fresh data fetches from main memory.


    ![](img/17ca5177da1b1e15b2169f9c7932e5b6_175_0.png)


    Figure 6.16 The Isambard HPC facility uses Cavium ThunderX2 processors which support
    multiple sockets with a shared address space; note the distinctive memory banks
    surrounding each processor package. Photo by Simon McIntosh-Smith.


    Linux has several schemes to optimize memory access for NUMA architectures. Memory
    allocation may be interleaved, so it is placed in a round-robin fashion across
    all nodes; this ensures memory access times are uniform on average, assuming an
    equal distribution of probable accesses across the address space. Another allocation
    policy is node-local, which allocates memory close to the processor executing
    the malloc; this assumes the memory is likely to be accessed by threads running
    on cores in that NUMA region.


    You can determine whether your Linux system supports NUMA, by executing:


    ```

    numactl --hardware

    ```


    and see how many nodes are reported. Most Arm systems (in particular, Raspberry
    Pi boards) are not NUMA. However, multiple socket motherboards will become increasingly
    common as core counts increase, tracking Moore''s law in future years.


    Another memory issue that affects large-scale servers, but may be seen on smaller
    systems is distributed memory. Protocols such as remote memory access (RDMA) enable
    pages to be transferred rapidly from memory to the local machine, copying memory
    from a remote buffer to a local buffer with minimal OS intervention. This is useful
    for migration of processes or virtual machines in cloud data centers. In more
    general terms, direct memory access (DMA) is a technique for efficient copying
    of data between devices and memory buffers. We will cover DMA in more detail in
    Chapter 8 where we explore input/output. There is some additional complexity because
    many devices work entirely in terms of physical memory addresses since they operate
    outside of the processor''s virtual addressing domain.'
