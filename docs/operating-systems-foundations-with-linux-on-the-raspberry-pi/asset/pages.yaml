  md: "# Chapter 7 | Concurrency and parallelism\n\nIn its most basic form, it also\
    \ includes a wait-queue and a spin lock that serializes access to it.\nCONFIG_SMP\
    \ systems can also include a pointer to the lock task owner as well as a spinner\
    \ MCS lock (see the kernel documentation).\n\nWhen acquiring a mutex, there are\
    \ three possible paths that can be taken, depending on the state of the lock:\n\
    \n+   1. Fastpath: tries to atomically acquire the lock by decrementing the counter.\
    \ If it was already taken by another task, it goes to the next possible path.\
    \ This logic is architecture-specific but typically requires a few instructions.\n\
    \n+   2. Midpoint: aka optimistic spinning, tries to spin for acquisition when\
    \ the lock owner is running, and there are no other tasks running that have higher\
    \ priority (need_resched). The rationale is that if the lock owner is running,\
    \ it is likely to release the lock soon.\n\n+   3. Slowpath: if the lock is still\
    \ unable to be acquired, the task is added to the wait queue and sleeps until\
    \ woken by the lock path. Under normal circumstances, it blocks as TASK_UNINTERRUPTIBLE.\n\
    \nWhile kernel mutexes are sleepable locks, the midpoint makes this lock attractive,\
    \ because busy-waiting for a few cycles has lower overhead than putting a task\
