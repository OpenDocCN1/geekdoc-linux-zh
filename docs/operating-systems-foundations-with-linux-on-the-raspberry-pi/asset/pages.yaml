  md: '# Operating Systems Foundations with Linux on the Raspberry Pi


    1. Distributed access control: global user identities are managed and authenticated
    in the system.


    2. High and variable latency: underlying data may be stored in remote locations
    over a wide area network, with clients experiencing occasional lack of connectivity.


    3. Consistency: multiple users may concurrently access and modify a shared, possibly
    replicated, resource.


    A union file system, also known as an overlay file system, is a transparent composition
    of two distinct file systems. The base layer, often a read-only system like a
    live boot CD, is composed with an upper layer, often a writeable USB stick. Overlays
    are also extensively used for containerization, in systems like Docker. From user
    space, the union appears to be a single file system. The listing below shows how
    you can set up a union file system on your Raspberry Pi. If you inspect the lower
    layer, the upper layer acts like a "file diff" applied to the lower layer, is
    not affected by modifications in the merged layer.


    ![](img/17ca5177da1b1e15b2169f9c7932e5b6_269_0.png)


    ```

    1 cd /tmp

    2 # set up directories

    3 mkdir lower

    4 echo "hello" > a.txt

    5 touch b.txt

    6 mkdir upper

    7 mkdir merged

    8 mkdir merged

    9 sudo mount -t overlay overlay -olowerdir=/tmp/lower,

    10 -oupperdir=/tmp/upper,workdir=/tmp/merged /tmp/merged

    11 cd merged

    12 echo "hello again" >> b.txt

    13 touch c.txt

    14 ls

    15 ls ../upper

    16 ls ../lower

    ```


    Standard, concrete file system implementations are built into the kernel or loaded
    as kernel modules. The goal of the FUSE project is to enable file systems in user
    space. FUSE consists of:


    1. A small kernel module that mediates with VFS on behalf of non-privileged code.


    2. An API that can be accessed from user space.


    FUSE enables more flexibility for development and deployment of experimental file
    systems. Multiple high-level language bindings available, allowing developers
    to create file systems in languages as diverse as Python and Haskell.'
