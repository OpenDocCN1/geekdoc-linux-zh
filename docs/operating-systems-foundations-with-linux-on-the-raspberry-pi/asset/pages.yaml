  md: '# Chapter 2 | A practical view of the Linux system


    Note that because the ''everything is a file'' approach, this system of permissions
    extends in general to devices, system information, etc. However, the actual kernel
    security policies can restrict access further. For example, in Figure 2.2, the
    numbers in the /proc listing represent currently running processes by their PID.


    To illustrate the connection between users, permissions, and processes, Figure
    2.4 shows how user wim can list processes in /proc belonging to two different
    non-root users, wim and pleroma. The command cat /proc/548/maps prints the entire
    memory map for the process with PID 548. The map is quite large, so for example,
    only the heap memory allocation is shown (using grep heap).


    ![](img/17ca5177da1b1e15b2169f9c7932e5b6_60_0.png)


    Figure 2.2: Example of restrictions on process memory access via /proc the Raspberry
    Pi running Raspbian.


    However, when we try to do so with /proc/600/maps, we get ''Permission denied''
    because the cat process owned by user wim does not have the right to inspect the
    memory map of a process owned by another user. This is despite the file permissions
    allowing read access.


    # 2.2.9 Privileges and user administration


    The system administrator creates user accounts and grants access to resources
    using groups (using tools such as useradd(8), groupadd(8), chgrp(1), etc.). The
    kernel manages credentials per process using struct cred which is a field of the
    task_struct.


    The admin also decides how each user and process gets, e.g., using ulimit.


    Resource limits are set in /etc/security/limits.conf and can be changed at runtime
    via the shell command ulimit. Internally, the kernel implementation uses the getrlimit
    and setrlimit calls which modify the kernel struct rlimit in include/uapi/linux/resource.h.'
