    # 8.2.1 Inspect your devices


    It is possible to inspect some of the devices that are attached to your Raspberry
    Pi over USB. The lsusb command will display information about about devices that
    are connected to your Pi over. Observe that each device has a unique ID. Also
    notice that the Ethernet adapter is connected via USB, which is the reason for
    slow network performance on Raspberry Pi.


    The lsblk command will display information about block devices, which are generally,
    storage devices, connected to your Pi. Figure 8.2 shows the reported block devices
    on a Raspberry Pi 3 with an 8GB SD card. File system mount points for each partition
    are given. Note that mmblk0alias to the same physical device. The next chapter
