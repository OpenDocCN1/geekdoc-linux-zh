  md: "# Operating Systems Foundations with Linux on the Raspberry Pi\n\nThe function\
    \ monitors sets of file descriptors; in particular readfds, writefds, and exceptfds.\
    \ Each of these is a bitset. If you want to see if you can read from standard\
    \ input and some socket descriptor, sockfd, just add the file descriptors 0 (for\
    \ stdin) and sockfd to the set readfds.\n\nThe parameter numfds should be set\
    \ to the values of the highest file descriptor plus one. In this example, it should\
    \ be set to sockfd+1, since it is assuredly higher than standard input (O).\n\n\
    The select call will block until either\n\n+   - a file descriptor becomes ready;\n\
    - the call is interrupted by a signal handler; or\n- the timeout expires.\n\n\
    When select() returns, readfds will be modified to reflect which of the file descriptors\
