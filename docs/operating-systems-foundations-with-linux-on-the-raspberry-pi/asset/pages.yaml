  md: '# Operating Systems Foundations with Linux on the Raspberry Pi


    # 8.3 Connecting devices


    8.3.1 Bus architecture


    Since the Raspberry Pi is built around a commercial system-on-chip solution, which
    is also used for mobile devices, it has a set of direct IO connections. Figure
    8.3 presents this IO connectivity at an abstract level.


    Some connections are point-to-point, such as the UART (universal asynchronous
    transmitter/receiver) for direct device to device communication. Others allow
    multiple devices to share a bus, i.e., signals travel along shared wires and are
    directed to the appropriate device. The I²C bus supports over 1000 devices; these
    share data, clock and power wires, with each device having a unique address to
    direct message packets.


    Some IO interfaces are principally for output, such as HDMI for video output to
    screen. Other interfaces are for input, such as the CSI (Camera Serial Interface)
    for digital cameras. Many interfaces, like the Ethernet connection, are bidirectional
    in that they support both input and output.


    Generally, IO is encoded as digital signals. A small number of interfaces use
    analog signals, such as the audio-out port. The GPIO signals are all digital;
    Arduino devices, the Raspberry Pi does not include a built-in analog-to-digital
    converter.


    ![](img/17ca5177da1b1e15b2169f9c7932e5b6_231_0.png)


    Figure 8.3: IO architectural diagram for Raspberry Pi.


    In terms of bandwidth, low bandwidth connections (like those on the right-hand
    side of SoC in Figure 8.3) operate around 10kbps. High bandwidth connections (like
    those at the bottom of SoC in Figure 8.3) operate around 100Mbps. One peculiarity
    of the Raspberry Pi architecture is that the ethernet piggybacks around the USB
    interface, which sometimes restricts network bandwidth.


    More conventional, larger computers may have higher performance busses such as
    PCI Express. These are useful for powerful devices such as graphics cards that
    need to process and transfer bulk data extremely rapidly.


    206'
