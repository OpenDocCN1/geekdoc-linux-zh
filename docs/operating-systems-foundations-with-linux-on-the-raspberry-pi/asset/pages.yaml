    sudo apt-get install dostools # for manipulating FAT images

    d if=/dev/zero of=/fat.img bs=512 count=8192 # blank image

    mkfs.fat -f 1 -F 16 -l 41424344 -M 0xF8B -n TEST_DISK \

    -r 32 -R 1 -s 1 -S 512 /fat.img

    ```


    # 9.13 Latency reduction techniques


    To minimize the overhead of accessing persistent storage, which can have relatively
    high latency, Linux maintains an in-memory cache of blocks recently read or written
    to secondary storage. This is known as the buffer cache. It is sized to occupy
    free RAM, as it grows and shrinks as other processes require more or less memory.
    The contents of the buffer cache are flushed to disk at regular intervals, to
    ensure consistency.'
