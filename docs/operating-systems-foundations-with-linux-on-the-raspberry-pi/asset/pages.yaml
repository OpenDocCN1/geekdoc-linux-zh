    In the Arm architecture, the system coprocessor CP15 is responsible for the configuration
    of memory management. Translation table base registers (TTBRs) in this unit are
    configured to point to process-specific page tables by the OS, on a context switch.
    These registers are only accessible in privileged mode.


    To read TTBR0 into general purpose register r0, use the instruction:


    ```

    mcr p15 0, r0, c2, c0, 0

