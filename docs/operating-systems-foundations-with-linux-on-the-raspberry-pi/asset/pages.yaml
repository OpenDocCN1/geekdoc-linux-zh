  md: '# Critical section


    A section of a program which cannot be executed by more than one process or thread
    at the same time. Critical sections typically access a shared resource and require
    synchronization primitives such as mutual exclusion locks to function correctly.


    # Deadlock


    The state in which each process in a group of communicating process is waiting
    for a message from the other process in order to proceed with an action. Alternatively,
    in a group of processes with shared resources, there will be deadlock if each
    process is waiting for another process to release the resource that it needs to
    proceed with.


    # Direct memory access (DMA)


    A mechanism that allows peripherals to transfer data directly into the main memory
    without going through the processor registers. In Arm systems, the DMA controller
    unit is typically a peripheral.*


    # DRAM


    Dynamic random-access memory, high-density memory, slower than SRAM. It is typically
    used as the main memory in a computer system. A DRAM cell is typically a small
    capacitor. As the charge leaks, it needs to be periodically refreshed.


    # Endianness


    The sequential order in which bytes are arranged into words when stored in memory
    or transmitted over digital links. There are two incompatible formats in common
    use, called big-endian and little-endian. In big-endian format, the most significant
    byte (the byte containing the most significant bit) is stored at the lowest address.
    Little-endian format reverses this order.


    # Everything is a file


    # File


    A named set of related data that is presented to the user as a single, contiguous
    block of information, and is kept in persistent storage.


    # File system


    A system for the logical organization of data. The purpose of most file systems
    is to provide the file and directory (folder) abstractions. A file system not
    only allows to store information in the form of files organized in directories
    but also information about the usages of files and directories, as well as timestamp
    information. The information in a file system is typically organized as a hierarchical
    tree of directories, and the directory at the root of the tree is called the root
    directory.'
  merge: -1
