    # Reduction


    On the opposite side of the performance spectrum, we have purely sequential computations,
    i.e., where it is not possible at all to perform even part of the computation
    in parallel. In computational terms, this is the case for non-associative reduction
    operations. Reduction (the second part in map-reduce) means a computation which
    combines all elements of a data set to produce its result. In functional programming,
    reductions are also known as folds. In Python, the corresponding function reduce.
    Unless a reduction operation is associative, it cannot be parallelized and will
    have linear time complexity O(N) for a data set of N elements.


    # Associativity


    In formal terms, a function of two arguments is associative if and only if


    ```

    f(x,y),z)=f(x,f(y,z))

    ```


    For example, addition and multiplication are associative:


    ```

    x+y+z=(x+y)+z=x+(y+z)

    ```


    but division and modulo are not:


    ```

    (x/y)/z!=x*/(y/z)

    ```


    # Binary tree-based parallel reduction


    In practice, many of the common operations on sets are associative: sum, product,
    min, max, concatenation, comparison, ...


    If the reduction operation is associative, the computation can still be parallelized,
    not using a map pattern but through a binary tree-based parallelization (tree-based
    fold). For example, to sum 8 numbers, we can perform 4 pairwise sums in parallel,
    then sum the 4 results in two parallel operations, and then compute the final
    sum.


    ```

    1+2+3+4+5+6+7+8

    = 3+7+11+15

    = 10+26

    = 36

    ```


    Another example is merge sort, where the list to be sorted is split into as many
    chunks as there are threads, each chunk is sorted in parallel, and the chunks
    are merged pairwise. Whereas'
