  md: '# Preface


    The book is organized into eleven chapters.


    Chapters 1 and 2 provide alternate introductory views to operating systems.


    Chapter 1 A memory-centric system model presents a top-down view. In this chapter,
    we introduce a number of abstract models for processor-based systems. We use Python
    code to describe the models and only use simple data structures and functions.
    The purpose is to help the student understand that in a processor-based system,
    all actions fundamentally reduce to operations on addresses. The models are gradually
    being refined as the chapter advances, and by the end, the model integrates the
    basic operating system functionality into a runnable Python-based processor model.


    Chapter 2 A practical view of the Linux system approaches the Linux system from
    a practical perspective: what happens when we boot and run the system, how does
    it work and what is required to make it work. We first introduce the essential
    concepts and techniques that the student needs to know in order to understand
    the overall system, and then we discuss the system itself. The aim of this part
    is to help the student answer questions such as “what happens when the system
    boots?” or “how does Linux support graphics?”. This is not a how-to guide, but
    rather provides the student with the background knowledge how-to guides.


    Chapter 3 Hardware architecture, we discuss the hardware on which the operating
    system runs, the hardware support for operating systems (dedicated registers,
    MMU, DMA, interrupt architecture, relevant details about the bus/NoC architecture,
    ...), the memory subsystem (caches, TLB), high-level language support, boot subsystem
    and boot sequence. The purpose is to provide the student with a usable mental
    model for the hardware system and to explain the need for an operating system
    and how the hardware supports the OS. In particular, we discuss the Linux view
    of the hardware system.


    The next seven chapters form the core of the book, each of these introduces a
    core Operating System concept.


    Chapter 4 Process management, we introduce the process abstraction. We outline
    the state that needs to be encapsulated. We walk through the typical lifecycle
    of a process from forking to termination. We review the typical operations that
    will be performed on a processor.


    Chapter 5 Process scheduling discusses how the OS schedules processes on a processor.
    This includes the rationale for design, the concept of context switching, and
    an overview of scheduling policies (CFS, priority, ...) and scheduler architectures
    (FIFO, multilevel feedback queues, priorities, ...). The Linux scheduler is studied
    in detail.


    While memory is remarkably straightforward, OS architects have built lots of abstraction
    layers on top. Principally, these abstractions serve to improve performance and/or
    programmability. In Chapter 6 Memory management, we review caches (in hardware
    and software) to improve access speed. We go detail into virtual memory to improve
    the management of physical memory resource. We will provide highly graphical descriptions
    of address translation, paging, page tables, page faults, swapping, etc. We explore
    standard schemes for page replacement, copy-on-write, etc. We will examine concrete
    examples in Arm architecture and Linux OS.


    xii'
