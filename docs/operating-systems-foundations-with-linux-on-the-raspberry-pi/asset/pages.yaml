    # ## 5.7.5 Shortest elapsed time first (SETF)


    SJF and SRT are so clairvoyant algorithms, they require the scheduler to know
    information that is not available, in this case, the remaining time of the process.
    A more practical approach is to use the elapsed time of a process instead, which
    is of course easily measurable by the OS. The paper "Speed is as Powerful as Clairvoyance"
    [5] proved that SETF not only obtains good average-case response time but also
    does not starve any job.


    # ## 5.7.6 Priority scheduling


    The "priority scheduling" is used for priority-driven scheduling where the priority
    of the task is an entirely separate attribute, not related to other attributes.
    Priority driven scheduling can be either preemptive or nonpreemptive, as illustrated
    in Figures 5.8 and 5.9.


