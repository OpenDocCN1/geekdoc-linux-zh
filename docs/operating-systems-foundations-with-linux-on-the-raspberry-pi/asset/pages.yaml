    \ a DMA transfer is a transfer of a large block of data, which would otherwise\
    \ keep the processor occupied for a long time. In our simple model, the DMA controller\
    \ has four registers:\n\n+   - Source Address Register (DSR)\n\n+   - Destination\
    \ Address Register (DDR)\n\n+   - Counter (DCO)\n\n+   - Control Register (DCR)\n\
    \nThis peripheral is different from the others in our model because it can manipulate\
    \ the entire system state. In away, we can view a DMA controller as a special\
    \ type of processor that only performs memory transfer operations. The model implementation\
    \ is:\n\n![](img/17ca5177da1b1e15b2169f9c7932e5b6_39_0.png)\n\n```\ndef dmaAction(systemState):\n\
    \    dmaIrq=0\n    # DMA is the start of the address space\n    # DCR values:\
    \ 1 = transfer, 0 = idle\n    if systemState[DMA+DCR]==1:\n        if systemState[DMA+DCO]==0:\n\
    \            ctr = to_addr = systemState[DMA+DDR]+ctr\n            from_addr =\
    \ systemState[DMA+DSR]+ctr\n            systemState[to_addr] = systemState[from_addr]\n\
    \            systemState[DMA+DCO]-=1\n        else systemState[DMA+DCR]=0\n  \
    \          dmaIrq=1\n    return (systemState, dmaIrq)\n```\n\nTo initiate memory\
    \ transfer using the DMA controller, the processor writes the source and destination\
    \ addresses to DSR and DDR, and the size of the transfer to DCO (the 'counter').\
    \ The status is set to 1 in the DCR. DMA controller then starts the transfer and\
    \ decrements the counter for every word transferred. When the counter reaches\
    \ zero, an interrupt is raised (count-zero interrupt).\n\n# 1.4.5 Complete cycle-based\
