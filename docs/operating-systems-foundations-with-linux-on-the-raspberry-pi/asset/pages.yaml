  md: '# Chapter 7 | Concurrency and parallelism


    In a concurrent program, several threads of operation are running at the same
    time because the user expects several actions to be happening at the same time.
    For example, a web browser must at least have a thread for networking, one for
    rendering the pages and one for user interactionsmouse clicks, keyboard input).
    If these threads were not concurrent, the browser would not be usable.


    By contrast, in a parallel program, what happens is the work that would be performed
    on a single CPU is split up and handled to multiple CPUs who execute each part
    in parallel. We can further distinguish between task parallelism and data parallelism.
    Task parallelism means that every CPU will perform a different part of the computation;
    for example, the steps in an image processing pipeline. Data parallelism means
    that every CPU will perform the same computation but on a different part of the
    data. If we run a parallel program on a single-core system, the only effect will
    be that it runs slower.


    Because effectively parallel programs execute concurrent threads, many of the
    issues of concurrent programs are also encountered in parallel programming.


    # 7.3 Concurrency


    In this section, we have a closer look at concurrency: the issues arising from
    concurrency and the techniques to address them; support for concurrency in the
    hardware and the OS, and the POSIX programming API.


    # What are the issues with concurrency?


    There are two factors that can lead to issues when several tasks are running concurrently:
    shared resources and exchange of information between tasks.


    # Shared resources


    When concurrent tasks share a resource, access to that resource needs to be controlled
    to avoid undesirable behavior. A very clear illustration of this problem is a
    shared section of railroad track, as shown in Figure 7.1. Clearly, uncontrolled
    access could lead to disaster. Points, in a railway system are protected by semaphore
    signals. The single-track section is the shared resource as it is required by
    any trains traveling on it. When the signal indicates "Clear," the train can use
    the shared section, at which point the signal will change to "Stop." Any train
    wanting to use the shared section will have to wait until the train occupying
    it has left, and the signal is "Clear" again. We will discuss the OS equivalent
    in 7.3.3.


    ![](img/17ca5177da1b1e15b2169f9c7932e5b6_184_0.png)


    **Figure 7.1: Shared railroad track section with points and semaphores.


