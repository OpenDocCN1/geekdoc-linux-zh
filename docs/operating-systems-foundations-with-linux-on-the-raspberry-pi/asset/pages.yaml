    ```\n\n# 4.5 Context switch\n\nThe earliest electronic computers are single-tasking.\
    \ These systems executed one exclusively until another program was loaded into\
    \ memory. For instance, the early EDSAC machine at Cambridge would ring a bell\
    \ when a program completed execution, so the technician could read off the results\
    \ and load in a new program. Up until the 1980s, micro-computers ran single-program\
    \ operating systems like DOS and CP/M. For such computers, process management\
    \ was unnecessary.\n\nProcesses are the basis of multi-programming, where the\
    \ operating system executes multiple processes concurrently. Effectively, the\
    \ operating system multiplexes many processes into a smaller physical of processor\
    \ cores.\n\nThe context switch enables its multiplexing. All the runtime data\
    \ required for a process (as we outlined in Section 4.3) is saved into a process\
    \ control block (effectively the task_struct in Linux). The OS serializes the\
    \ process metadata. Then the process is paused, and another process resumes execution.\n\
    \nIf processes are switched in and out of execution at sufficiently high frequency,\
    \ then it appears that all the processes are executing simultaneously. This is\
    \ analogous to a person who is juggling, see Figure 4.10. In the same way, as\
    \ the OS handles more processes than there are processors, the persons deals with\
    \ more juggling balls s/he has hands.\n\n![](img/17ca5177da1b1e15b2169f9c7932e5b6_106_0.png)\n\
