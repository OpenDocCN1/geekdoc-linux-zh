    +   - 16-byte read interface to the L2 memory system. This means it takes 4 cycles
    to read a cache line from the L2 cache.


    The L1 data memory system has the following features:


    +   - Cache line size of 64 bytes.


    +   - 4-way associative.


    +   - 32-byte write and 16-byte read interface to the L2 memory system.


    +   - 64-bit read and 128-bit write path from the data L1 memory system to the
    datapath. In other words, the CPU can read one 64-bit word and write 2 64-bit
    words directly from the L1 data cache.


