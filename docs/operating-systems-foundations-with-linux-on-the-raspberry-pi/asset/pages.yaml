  md: "# Operating Systems Foundations with Linux on the Raspberry Pi\n\n# 4.6.2 Handling\
    \ signals\n\nWe have looked at sending signals to processes. Now let's consider\
    \ how to handle such signals when a process receives them. A **signal handler**\
    \ is a callback routine which is installed by the process to deal with a particular\
    \ signal. Below is a simple example of a program that responds to the SIGINT signal.\n\
    \n```\nListing 4.6.2: Simple signal handler in C\n```c\n#include <stdio.h>\n#include\
    \ <signal.h>\n#include <string.h>\n#include <unistd.h>\n\nstruct sigaction;\n\n\
    void sighandler(int signum, siginfo_t *info, void *p) {\n    printf(\"Received\
    \ signal %d from process %lu\\n\",\n           signum, (unsigned long)info->si_pid);\n\
    \    printf(\"goodbye\\n\");\n}\n\nint main() {\n// instructions for interactive\
    \ user\n    printf(\"Kill -2 %%lu, or just press CTRL+C\\n\", (unsigned long)getpid());\n\
    \    // zero-initialize the sigaction instance\n    memset(&act, 0, sizeof(act));\n\
    \    // set up the volatile pointer\n    act.sa_handler = sighandler;\n    //\
    \ set up the flags, so the signal handler receives relevant info\n    act.sa_flags\
    \ = SA_SIGINFO;\n    // install the handler\n    sigaction(SIGKILL, &act, NULL);\n\
    \    // wait for something to happen\n    return 0;\n}\n```\n```\n\nSome signals\
    \ cannot be handled by the user process, in particular, SIGKILL and SIGSTOP. Even\
    \ if you attempt to install a handler for these signals, it will never be executed.\n\
    \nIf we do not install a handler for a signal, then the default OS handler is\
    \ used instead. This will report the signal and cause the process to terminate.\
    \ For example, consider what happens when your C programs dereference a null pointer;\
    \ normally the default SIGSEGV supplied by the OS is invoked, see Figure 4.11.\n\
    \n![](img/17ca5177da1b1e15b2169f9c7932e5b6_109_0.png)\n\n**Figure 4.11** When\
    \ a program dereferences a null pointer, a segmentation fault occurs and the appropriate\
