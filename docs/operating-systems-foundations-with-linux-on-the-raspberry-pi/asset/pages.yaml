  md: "# Operating Systems Foundations with Linux on the Raspberry Pi\n\nHowever,\
    \ note that a kernel module is not an application; it is a piece of code to be\
    \ used by the kernel. As you can see, there is no main(). Furthermore, kernel\
    \ modules:\n\n+   - do not execute sequentially: a kernel module registers itself\
    \ to handle requests using its initialization function, which runs and terminates.\
    \ The types of request that it can handle are defined within the module code.\
    \ This is quite similar to the event-driven programming model that is commonly\
    \ used in graphical-user-interface (GUI) applications.\n- do not have automatic\
    \ resource management (memory, file handles, etc.): any resources that are allocated\
    \ in the module code must be explicitly deallocated when the module is loaded.\n\
    - do not have access to the common user-space system calls, e.g., print(). However,\
    \ there is a printk() function that can output information to the kernel log,\
    \ and can be viewed from user space.\n- kernel modules can be used by several\
    \ different programs/processes at the same time, as they are part of the kernel.\
    \ When writing a kernel module you must, therefore, be very careful to ensure\
    \ that the module behavior is consistent and correct when the module is interrupted.\n\
    - have to be very resource-aware: as a module is kernel code, its execution competes\
    \ with the kernel runtime, both in terms of CPU cycles and memory usage. You have\
