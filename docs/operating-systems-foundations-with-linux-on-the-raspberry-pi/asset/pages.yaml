  md: '# Operating Systems Foundations on Linux on the Raspberry Pi


    and many others. In particular, it is /dev/null which is a special device that
    discards the information written to it, and /dev/zero which returns an endless
    stream of zero bytes (i.e., 0x00, when you try cat /dev/zero you will see nothing.
    Try cat /dev/zero | hd instead.)


    # 2.2.7 Users


    A Linux system is typically a multi-user system. What this means is that it supports
    another level of separation, permissions, and protection above the level of processes.
    A user can run and control multiple processes, each in their own memory space,
    but with shared access to system resources. In particular, the concept of users
    and permission is tightly connected with the file system. The file system permissions
    for a given user control the access of that user in terms of reading, writing,
    and executing files in different parts of the file hierarchy.


    Just as the kernel runs with privilege to control the user processes, there is
    also a need for a privileged user to control the other users (similar to the ''Administrator''
    on Windows systems). In Linux, this is called root* when the system boots, the
    first process (init, which has PID=1) is run as the root user. The init process
    can create new processes. In fact, Linux any process can create new processes
    (as explained in more detail in Chapter 4). However, a process owned by the root
    user can assign ownership of a created process to another user, whereas processes
    created by a non-root user process can only be owned by itself.


    # 2.2.8 Credentials


    In Linux, credentials is the term for the set of privileges and permissions associated
    with any object. Credentials express, e.g., ownership, capabilities, and security
    management properties. For example, for files and processes, the keys are the
    user ID and group ID. To determine what a certain object (e.g., a task) can do
    to another object (e.g., a file), the Linux kernel performs a security calculation
    using the credentials and a set of rules. In practice, processes executed as root
    access all files and other resources in the system; for a non-root user, file
    and directory access is determined by a system of permissions on the files and
    by the membership of groups: a user can belong to one or more groups of users.


    File access permissions can be specified for individual users, groups, and everyone.
    For example, in Figure 2.3, we see that the directory /home/min can be written
    to by user min in group min. If we try to create an (empty) file using the touch
    command, this succeeds. However, if we try to do the same in the directory /home/plomer,
    owned by user plomer in group plomer, we get ''permission denied'' because only
