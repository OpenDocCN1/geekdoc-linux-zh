  md: '# Operating Systems Foundations with Linux on the Raspberry Pi


    #  5.5.1 Preemptive versus non-preemptive scheduling


    A first decision to make is if the scheduler will be able to interrupt running
    tasks, for example, to run a task that it considers more important (i.e. it has
    a higher priority). If this is the case, the scheduler is called pre-emptive.
    In Linux, all scheduling is preemptive. The opposite, non-preemptive scheduling,
    can be used if the tasks voluntarily yield the CPU to other tasks. This is called
    cooperative multitasking and is not commonly used in modern operating systems.


    Note that we do not use the term preemption when a task is moved to the waiting
    state because this is not a scheduling activity. From a scheduling perspective,
    the remainder of the task can be considered as a new task (going to the same process
    or thread).


    #  5.5.2 Scheduling policies


    The scheduling policy is the approach to scheduling taken by the scheduler. To
    understand the concept better, consider that the scheduler must keep a list of
    tasks that are ready to run. This list is ordered in some way, and the main decision
    of the scheduler is in which position in the list to put a new ready task. Furthermore,
    the scheduler must also decide for how long a task can run if it is not preempted
    by another task or interrupted by a system call. Essentially, these two decisions
    form the scheduling policy. Linux has several different scheduling policies, each
    task (i.e., each process or thread) can be set to one of the policies. The practical
    implementation of a policy is anonymous, so sometimes we use the term scheduling
    algorithm instead.


    #  5.5.3 Task attributes


    We mentioned above (Section 5.5.1) that the scheduler can consider one task more
    important than another, and therefore give a higher priority of execution to the
    more important task. This means that the more important task can either be run
    sooner, for longer, or both. The importance of a task depends on its attributes.
    A task attribute could, for example, be the time when the task was put in the
    task list, or its position in the task list; or the time it takes for the task
    to run; or the amount of CPU time that has already been spent by the task. The
    task can have an explicit priority attribute, which in practice is a small integer
    value used by the kernel to assess how important a process is.


    The Linux kernel uses several of the above-mentioned attributes, depending on
    the scheduling policy, and all threads have a priority attribute.


    #  5.6 Scheduling criteria


    When selecting a scheduling policy, we can use different criteria, e.g., depending
    on the typical process mix on the system, or depending on the requirements of
    the threads in an application. The most commonly used criteria are:


    CPU utilization: Ideally, the CPU would be busy 100% of the time, so that we don''t
    waste any CPU cycles.


    Throughput: The number of processes completed per unit time.


    Turnaround time: The elapsed (wall clock) time required for a particular task
    to complete, from birth time to death.'
