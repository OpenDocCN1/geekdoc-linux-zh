    \ scheduling policy\n\nSince kernel version 3.14 of the Linux kernel (2014), Linux\
    \ supports hard real-time scheduling via the SCHED_DEADLINE scheduling class.\
    \ This is an implementation of the Earliest Deadline First (EDF) algorithm discussed\
    \ in Section 5.7.8, combined with the Constant Bandwidth Server (CBS) algorithm\
    \ [8].\n\nThe SCHED_DEADLINE (sporadic task model scheduling) policy is currently\
    \ implemented using GEDF (Global Early Deadline First) in conjunction with CBS\
    \ (Constant Bandwidth Server). A sporadic task is one that has a sequence of jobs,\
    \ where each job is activated at most once per period. Each job also has a relative\
    \ deadline, before it should finish execution, and a computation time, which is\
    \ the CPU time for executing the job. The moment a task wakes up a new job has\
    \ to be executed is called the arrival time. The start time is the time at which\
    \ task starts execution. The absolute deadline is obtained by adding the relative\
    \ deadline to the arrival time.\n\nA SCHED_DEADLINE task is guaranteed to receive\
    \ a runtime every period, and this runtime is within deadline from the beginning\
    \ of the period.\n\nThe runtime, period, and deadline are stored in the sched_dl_entity\
    \ struct (dl1 in the task_struct) and can be set using the sched_setattr() system\
    \ call:"
