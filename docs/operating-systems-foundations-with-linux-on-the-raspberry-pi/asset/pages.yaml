    \ Linux. As shown in Figure 1.3, this region (called user space) contains the\
    \ program code, the stack for the program and the random-access memory for the\
    \ program, commonly known as the 'heap'. Typically, each task gets a fixed amount\
    \ of memory allocated to it, and in the code, this memory is referenced relative\
    \ to the program counter."
