    This multi-level indirect scheme has several benefits. There are the advantages
    of direct block addressing, for short files or the first few blocks of a long
    file. There is the advantage of hierarchical metadata, like multi-level page tables,
    to avoid wasted space for medium size files. There is the advantage of indication,
    to avoid bloating inodes directly, for very large files. Check out fs/ext4/indirect.c
    for further implementation details.


