    The simplest possible structure is a single-level page table. For each page, there
    is an entry in the table which contains a value corresponding to the appropriate
    virtual address space. This wastes space—32-bit GB address space, divided into
    distinct 4KB pages, needs a single-level page table to contain 1M entries. Each
    entry consists of an address, say 4B, along with some metadata bits. However,
    most processes do not make use of their virtual address space, so many page table
    entries would remain unused.


    This motivates the design of a hierarchical page table. Before we get into specific
    details for Linux on Arm, let''s consider an idealized two-level page table. A
    typical is divided into three parts:


    +   1. A 10-bit first-level page table index.

    2. A 10-bit second-level page table index.

    3. A 12-bit page offset.


    Given that pages are 4KB, this is a convenient subdivision. The 10 bits enable
    us to address 1024 32-bit word entries. Each entry can contain a single address.
    This means each sub-table of the page table can fit into a single page.


    For unused regions of the address space, the OS can invalidate corresponding entries
    in the first-level page table, as a consequence of which, we do not need second-level
    page tables for these address ranges. This is the main space-saving for hierarchical
    page tables since each invalid first-level page table entry corresponds to 1024
    invalid second-level page table entries—potentially saving up to 4MB of second-level
    page table space.


    6.7 gives a schematic overview of a single virtual address translation, as handled
    by the MMU, using the two-level page table outlined above. Note the consecutive
    pair of table indexing operations, based on the P1 and P2 bitfields in the virtual
    address. The entry in the second-level page table contains the physical frame
    number, which is concatenated with the page offset to generate the actual physical
    address. There are spare bits in the 32-bit page table entry since the frame number
    will only occupy 20 bits. These remaining (low-order) bits can be used for page
    metadata such as access permissions, see Section 6.4.3.


    ![](img/17ca5177da1b1e15b2169f9c7932e5b6_156_0.png)


    Figure 6.7: Virtual address translation via a two-level page table.


