  md: 'A process maps onto a user application (e.g., spreadsheet), a background utility
    (e.g., file indexer) or a system service (e.g., remote login daemon). It is possible
    that multiple processes might be executing the same program at once. These would
    be different runtime instances of the same program. Some complex applications
    only permit a single instance of the process to be executed at once. For instance,
    the Firefox web browser has a lock file, that prevents multiple instances of the
    application from executing with the same user profile, see Figure 4.3.


    ![](img/17ca5177da1b1e15b2169f9c7932e5b6_96_0.png)


    Figure 4.3: Firefox displays an error message and refuses to run multiple application
    instances for a single user process.


    # 4.2.1 Discovering processes


    How many processes are executing on your system right now? In an interactive shell
    session, type:


    ```

    ```

    ps aux | wc -l

    ```

    ```


    The ps command displays information about processes currently registered with
    the OS. The options we use are as follows:


    | | |

    |---||

    | a | Include all users'' processes |

    | u | Display user-friendly output |

    | x | Include processes not started from a user |


    My Linux server shows 257 processes. How many processes are on your machine? Every
    time you invoke a new program, a new process starts. This might occur if you click
    a program icon in an app launcher bar, or if you type an executable file name
    at a shell prompt.


    # 4.2.2 Launching a new process


    Let''s find out how to start a new process programmatically, using the fork system
    call. This is the standard Unix approach to create a new process. The forking
    process (known as the *parent*) generates an exact copy (known as the *child*),
    that is executing the same code. The only difference between the parent and the
    child (i.e., the only way to distinguish the two processes) is the *return value*
    of the fork call. In the child process, the return value is 0. In the parent process,
    the return value is a positive integer that denotes the allocated process identifier
    (pid) of the child. Figure 4.4 shows this sequence schematically. Note that if
    we can''t fork a new process, fork returns 1.'
