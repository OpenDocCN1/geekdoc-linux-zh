  md: '# Operating Systems Foundations with Linux on the Raspberry Pi


    ![](img/17ca5177da1b1e15b2169f9c7932e5b6_309_0.png)


    Figure 11.2: Archer high-performance computing facility. Photo by Edinburgh Parallel
    Computing Centre.


    Rack-scale systems feature tens of nodes, with hundreds of cores. Large data processing
    tasks are scheduled on such systems and may require inter-node cooperation, e.g.,
    for distributed garbage collection. This inter-node synchronization of activities
    is effectively a meta-level OS [2].


    As system architectures become larger and more complex, and the distinction between
    on-node and off-node memory is increasingly blurred, there is a trend towards
    multi-node, distributed OS designs.


    The Barrelfish experimental OS is a multernel system. Each CPU core runs a small,
    single-core kernel, and the OS is organized as a distributed system of message-passing
    processes on top of these kernels. Processes are location agnostic, since inter-process
    communication may be with local or remote cores. From a programmer perspective,
    there is no distinction.


    A related project is Plan 9 from Bell Labs, a distributed operating system that
    maintains the ''everything is a file'' abstraction. Its developers include some
    of the original designers of Unix. The key novelty is a per-process namespace
    (individual view of the shared network file system) and a message-based file system
    protocol for all communication. Eric Raymond summarizes the elegance of Plan 9
    and the reasons for its minimal adaption [3]. Note there is Plan 9 OS available
    for installation on the Raspberry Pi.


    The growth of heterogeneous computing means many machines with special-purpose
    accelerators such as GPUs, encryption units, and machine learning processors.
    These resources should be under the control of the OS, which mediates access by
    users and processes. This is particularly important for utility computing contexts,
    where many tenants are sharing an underlying physical resource.


    In addition to supporting scaled up computing on large machines, the next-generation
    OS also needs to handle scaled up storage. Traditional Linux file systems like
    ext4 do not scale well to massive'
