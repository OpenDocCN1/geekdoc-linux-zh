  md: '# Glossary of terms


    # Hypervisor


    A program, firmware, or hardware system that creates and runs virtual machines.


    # Instruction


    A computer program consists of a series of instructions. Each instruction determines
    how the processor interacts with the system through the address space.


    # Interrupt


    A signal sent to the processor by hardware (peripherals) or software indicating
    an event that needs immediate attention. The action of sending the signal is called
    an interrupt request (IRQ).


    # Kernel


    The program that is the core of an operating system, with complete control over
    everything in the system. It is usually one of the first programs loaded when
    booting the system (after the bootloader). It handles the rest of startup and
    initialization as well as requests for system services from other processes.


    # Memory


    The hardware that stores information for immediate use in a computer, typically
    SRAM or DRAM.


    # Memory management unit (MMU)


    A system hardware component which manages access control and memory translation,
    in particular, the translation of virtual memory addresses to physical addresses.


    # Memory address


    An unsigned integer value used as the identifier for a word of data stored in
    memory.


    # MIPS for the masses


    The slogan of the original Arm design team, which aimed to create a cheap but
    powerful processor that would provide lots of processing power ("MIPS" means Millions
    of Instructions Per Second for a price that everybody could afford.


    # Mnemonic


    An abbreviation for an operation. Assembly language uses mnemonics to represent
    each low-level machine instruction or opcode, typically also each architectural
    register, flag, etc. Also the surname of the eponymous character in William Gibson''s
    "Johnny Mnemonic" (1981).


    # MPI (Message passing interface)


    An API specification for high-performance computing. It provides a distributed
    memory model for parallel programming. Its main targets have clusters and multiprocessor
    machines, but also manycore system. The message passing model means that tasks
    do not share any memory. Instead, every task has its own private memory, and any
    communication between tasks is via the exchange of messages.'
