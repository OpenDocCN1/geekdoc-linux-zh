    # 11.7 Reconfigability


    As computing platforms become more flexible, incorporating technology such as
    FPGA accelerators, the OS must support the on-the-fly reconfiguration. Similarly,
    in cloud computing contexts, the resources to a VM may change as the guest OS
    is migrated to virtual servers with a range of hardware options. Even a commodity
    CPU on a laptop can be configured to operate at different clock frequencies, trading
    off compute performance and power consumption.


    Linux supports dynamic reconfiguration with a range of heuristic policies for
    particular resources. For instance, there is a CPU frequency generator that controls
    clock frequency depending on current resource usage. Various research projects
    have explored the potential for machine learning to enable automatic runtime tuning
    of OS parameters. There, there is no machine learning component embedded in a
    mainstream OS kernel. Self-tuning systems based on learning may arrive soon, although
    they would not be compliant with current domain-specific certification, e.g.,
    in the automotive or aerospace sectors.


    There is an accelerating trend to move components into user space. We introduced
    the notion of a file system in user space (FUSE) in Chapter 9. Networking in user
    space is also supported, with frameworks like the Data Plane Development Kit (DPDK)
    that support accelerated, customized packet processing in user application code.
    This flexibility enables techniques like software-defined'
