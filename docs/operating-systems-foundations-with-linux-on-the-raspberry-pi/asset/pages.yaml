  md: "# 4.6 Signal communications\n\nInter-process communication will be covered\
    \ in a future chapter. For now, we focus only on sending signals to processes.\
    \ A signal is like an interrupt — it's an event generated by the kernel to invoke\
    \ a signal handler in another process. Signals are one-way asynchronous notifications,\
    \ with a minimal data payload. The recipient process only knows the signal number\
    \ and the identity of the sender. Check the siginfo_t struct definition in the\
    \ <sys/siginfo.h> header for more details.\n\n# 4.6.1 Sending signals\n\nThe simplest\
    \ way to send a signal to a process is to use the kill command, at a shell prompt,\
    \ also specifying the target pid. Below is an example to kill an annoying repeat\
    \ print loop.\n\n| Name | Number | Description | Interactive |\n| SIGINT | 2 |\
    \ Terminal interrupt | CTRL + c |\n| SIGQUIT | 3 | Terminal quit | |\n| SIGILL\
    \ | 4 | Illegal instruction | |\n| SIGKILL | 9 | Kill process (cannot be caught/ignored)\
    \ | |\n| SIGSEGV | 11 | Segmentation fault (bad memory access) | |\n| SIGPIPE\
    \ | 13 | Write on a pipe with no reader, broken pipe | |\n| SIGALRM | 14 | Alarm\
    \ clock | Use alarm function to set an alarm |\n| SIGCHLD | 17 | Child process\
    \ has stopped or exited | |\n| SIGCONT | 18 | Continue executing, if stopped |\
    \ bg or fg |\n| SIGSTOP | 19 | Stop executing (cannot be caught/ignored) | CTRL\
    \ + z |\n\nTable 4.3: A selection of Linux signals, consult siginfo.h for the\
    \ full set.\n\n```\nwhile ((1)); do echo \"hello $BASHPID\"; sleep 5; done & \\\
    \n  # suppose this prints out hello 15082\n  # ... then you should type\n  kill\
    \ 15082\n```\n\nEffectively, this kill is like interactively pressing CTRL + c\
    \ on the console. Study the table of selected signals to see some other events\
    \ that a process may handle and their equivalent interactive key combinations.\n\
    \nNote that some signals are standardized across all Unix variants, whereas other\
    \ signals may be system-specific. Execute the command man kill or kill -1 for\
    \ details."
