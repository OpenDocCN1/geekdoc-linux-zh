  md: '# Chapter 7 | Concurrency and parallelism


    DMB, DSB, and ISB are respectively Data Memory Barrier, Data Synchronization Barrier,
    and Instruction Synchronization Barrier

    DMB, DSB, and ISB are respectively Data Memory Barrier, Data Synchronization Barrier,
    and Instruction Synchronization Barrier [7]. In particular, DSB acts as a special
    kind of memory barrier. No instruction occurring in the program order after this
    instruction executes until this instruction has completed. The DSB instruction
    completes when all explicit memory accesses before this instruction have completed
    (and all cache, branch predictor and TLB maintenance operations before this instruction
    has completed).


    The argument SY indicates a full system DSB operation; LD is as DSB operation
    that waits only for loads to complete and ST is a DSB operation that waits for
    stores to complete.


    # SMP conditional barriers


    The SMP conditional barriers are used to ensure a consistent view of memory between
    different cores within a cache-coherent SMP system. When compiling a kernel without
    CONFIG_SMP, SMP barriers are converted into plain generic (i.e., compiler barriers).
    Note that this means SMP barriers cannot replace a mandatory barrier, but a mandatory
    barrier can replace an SMP barrier.


    The Linux kernel has three SMP conditional CPU memory barriers:


    **GENERAL smp_mb()** Similar to smp_mb(), but only guarantees ordering between
    cores/processors within an SMP system. All memory accesses before the smp_mb()
    will be visible to all cores within the SMP system before any accesses after the
    smp_mb().


    **WRITE smp_wmb()** Like smp_mb(), but only guarantees ordering between read accesses.


    **READ smp_rmb()** Like smp_mb(), but only guarantees ordering between write accesses.
    [6]


    The SMP barriers are implemented in include/asm-generic/barrier.h as:


    ```

    Listing 7-3 12: Linux kernel barriers

    1 #ifdef CONFIG_SMP

    2 #ifndef smp_mb()

    3 #define smp_mb() __smp_mb()

    4 #endif

    5 #ifndef smp_rmb

    6 #define smp_rmb() __smp_rmb()

    7 #endif

    8 #ifndef smp_wmb

    9 #define smp_wmb() __smp_wmb()

    10 #endif

    11 #endif

    ```


