  md: '# 1.3.3 Processor instructions


    A typical processor can perform a wide range of instructions on memory addresses
    and/or register values. We will use a simple list-based notation for all instructions.
    We will use the (uppercase) Armemonics for registers and instructions; in Python,
    these are simply variables; their definitions can be found in the code repository
    file abstract_system_constants.py.


    We will assume that all instructions take up to three registers as arguments,
    for example


    ```

    add_instr = [ADD,R3,R1,R2]

    ```


    which means that the result of ADD operating on registers R1 and R2 is stored
    in register R3.


    Apart from computational (arithmetic and logic) instructions we also introduce
    the instructions LDR, e.g.


    ```

    load_instr = [LDR,R1,R2]

    ```


    and STR, e.g.


    ```

    store_instr=[STR,R1,R2]

    ```


    which respectively load the content of a memory address stored in R2 into register
    R1 and store the content of register R1 at the address location given in R2.


    We also have MOV which copies data between two registers, e.g.


    ```

    set_instr = [MOV,R1,R2]

    ```


    will set the content of R1 to the content of R2.


    We have a special non-Arm instruction called SET, which takes a register and a
    value as arguments, e.g.


    ```

    set_instr = [SET,R1,42]

    ```


    will set the content of R1 to 42.


    We also need some instructions to control the flow of the program, such as branches
    (B)


    ```

    goto_instr = [B,R1]

    ```


    where R1 contains the address of the target instruction in the program, and conditional
    branches (CBZ, ''Compare and Branch if Zero'')


    ```

    if_instr = [CBZ,R1,R2]

    ```


    where R1 contains the condition variable (0 or 1) and the program branches to
    the address in R2 if R1=0 and continues on the next line otherwise. We also have
    CBNZ, ''Compare and Branch if Non-Zero''.'
