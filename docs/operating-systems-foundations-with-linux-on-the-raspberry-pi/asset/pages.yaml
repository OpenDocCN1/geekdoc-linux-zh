  md: '# 2.3 Booting Linux on Arm-based systems (Raspberry Pi 3)


    In this section, we discuss the boot process for Linux on the Raspberry Pi 3.
    The boot sequence of Linux on Arm-based systems varies significantly from platform
    to platform. The differences sometimes arise due to the needs of the target market
    but can also be to choices of SoC and platform vendors. The boot sequence discussed
    here is a specific example to demonstrate what happens on a particular platform.


    This Raspberry Pi 3 (Figure 2.5) runs Raspian Linux on an Arm Cortex-A53 processor
    which is part of the Broadcom BCM2837 System-on-Chip (SoC). This SoC also contains
    a GPU (Broadcom VideoCore IV) which shares the RAM with the CPU. The CPU controls
    the initial stages of the boot process. The SoC also has a small amount of One
    Time Programmable (OTP) memory which contains information about the boot mode
    and a ROM with the initial boot code.


    ![](img/17ca5177da1b1e15b2169f9c7932e5b6_61_0.png)


    # 2.3.1 Boot process stage 1: Find the bootloader


    Stage 1 of the boot process begins with reading the OTP to check which boot modes
    are enabled. By default, this is SD card boot, followed by a USB device boot.
    The code for this stage is stored on-chip ROM. The boot code checks each of the
    sources for a file called bootcode.bin in the root directory of the first partition
    on the storage medium (FAT32 formatted); if it is successful, it will load the
    code into the local 128K (L2) cache and jump to its first instruction to start
    Stage 2.


    Note: The boot ROM supports GUID partitioning and MBR-style partitioning.


    # 2.3.2 Boot process stage 2: Enable the SDRAM


    Stage 2 is controlled by bootcode.bin, which is closed-source firmware. It enables
    the SDRAM and loads Stage 3 (start.elf) from the storage medium into the SDRAM.'
