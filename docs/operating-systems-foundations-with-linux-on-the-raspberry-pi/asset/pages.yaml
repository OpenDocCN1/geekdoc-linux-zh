  md: '# 3.1 Overview


    In this chapter, we discuss the hardware on which the operating system runs, with
    a focus on the Linux view on the hardware system and the OS support of the Arm
    Cortex series processors. The purpose of this chapter is to provide you with a
    useful mental model for the hardware system and to explain the need for an operating
    system and how the hardware supports the OS.


    # What you will learn


    After you have studied the material in this chapter, you will be able to:


    +   1. Discuss the support that modern hardware offers for operating systems (dedicated
    registers, timers, interrupt architecture, DMA).


    +   2. Compare and contrast instruction sets for the Arm Cortex M0+ and Arm Cortex
    A53 in terms of purpose, capability and OS support.


    +   3. Explain the role and structure of the address map.


    +   4. Explain the hardware structure of the memory subsystem (caches, TLB, MMU).


    # 3.2 Arm hardware architecture


    Figure 3.1 [1] shows the entire Arm family, with the most recent members on the
    right, and the highest performance and capability processors at the top. We will
    illustrate the Arm hardware architecture using quite different processors as examples:
    the Arm Cortex M0+ is a single-core, very low gate count, highly energy-efficient
    processor that is intended for microcontroller and deeply embedded applications
    that require an area optimized processor and low power consumption, such as IoT
    devices. This will not have a cache and the 16-bit Armv6-M Thumb instruction set.
    In general, such processors will not run Linux, however many of the main OS support
    features are available.


    ![](img/17ca5177da1b1e15b2169f9c7932e5b6_74_0.png)


    Figure 3.1: Arm processor family.'
