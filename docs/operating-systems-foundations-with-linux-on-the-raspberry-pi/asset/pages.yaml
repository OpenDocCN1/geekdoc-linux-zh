  md: "# Operating Systems Foundations with Linux on the Raspberry Pi\n\nInterrupt\
    \ handlers are like system event handlers. A handler routine may be registered\
    \ for a particular interrupt. When the interrupt occurs (physically, a pin on\
    \ the processor goes high) the system changes mode and vectors to the interrupt\
    \ handler.\n\nSection 8.5 explains the details regarding how to define and install\
    \ an interrupt handler in Linux. This is probably the most common way to deal\
    \ with IO interaction.\n\n# Direct memory access\n\nThe motivation underlying\
    \ direct memory access (DMA) is to minimize processor involvement in IO data transfer.\
    \ For polling and interrupts (collectively known as programmed IO) the processor\
    \ explicitly receives each word of the data and writes it to a local memory buffer,\
    \ or vice versa for transfer to the device.\n\nWith DMA, the processor merely\
    \ initiates the transfer of a large block of memory, then receives a notification\
    \ (via an interrupt) when the entire transfer is completed. This reduces context\
    \ switching overhead from being linear in the data transfer size to a small, constant\
    \ cost.\n\nThe key complexity of DMA is that the hardware device must be much\
    \ more intelligent since it needs to interface directly with the memory controller\
    \ to copy data into the relevant buffer. DMA is most useful for high-bandwidth\
    \ devices such as GPUs and hard disk controllers, not for smaller-scale embedded\
    \ systems.\n\nThe Raspberry Pi has 16 DMA channels, which may be used for high-bandwidth\
    \ access to IO peripherals. Various open-source libraries exploit this facility.\n\
    \n# 8.5 Interrupt handlers\n\nThere are three kinds of events that are managed\
    \ by the OS using the handler pattern. These are: \n\n+   1. Hardware interrupts,\
    \ which are triggered by external devices.\n\n+   2. Processor exceptions, which\
    \ occur when undefined operations (like divide-by-zero) are executed.\n\n+   3.\
    \ Software interrupts, which take place when user code issues a Linux system call,\
    \ encoded as an SWI instruction.\n\nThis section focuses on hardware interrupts,\
    \ but the mechanisms are similar for all three kinds of events.\n\nInterrupt-driven\
    \ IO can be more efficient than polling, giving relative speed disparity between\
    \ processor and IO device. A context switch (from user mode to kernel mode) only\
    \ when an interrupt is generated, indicating there is IO activity to be serviced\
    \ by the processor. There is minimal busy-waiting with interrupts. Figure 8.5\
    \ presents a sequence diagram to show the interactions between CPU and device\
    \ for interrupt-driven programmed IO."
