  md: '# Operating Systems Foundations with Linux on the Raspberry Pi


    The Armv8 architecture: as each VM must provide the illusion of running on real
    hardware, there is an extra level of addressing called Intermediate Physical Address
    (IPA) required.


    The MMU controls table hardware that accesses translation tables in main memory.
    It translates virtual addresses to physical addresses and provides fine-grained
    memory system control through a set of virtual-to-physical address mappings and
    memory attributes in page tables.


    These are loaded into the Translation look-aside buffer (TLB) when a location
    is accessed. In practice, the TLB is split into a very small, very fast micro
    TLB and a larger main TLB.


    The MMU in each core comprises the following components:


    # Translation look-aside buffer


    The TLB consists of two levels:


    +   1. A 10-entry fully-associative instruction micro TLB and 10-entry fully-associative
    data micro TLB. We explained the concept of a fully-associative cache in Chapter
    1. There are two separate micro TLBs for instructions and data to allow parallel
    access for performance reasons.

    2. A 4-way set-associative 512-entry unified main TLB (Figure 3.9). "Unified"
    means that this TLB is used for both instructions and data. The main TLB is not
    fully associative but 4-way set-associative. Remember that "fully associative"
    means every address can be stored at any possible entry of the TL. If the cache
    or TLB is not fully associative, it means that there are restrictions on where
    an address can be stored. A very common approach is an n-way set-associative cache,
    which means the cache is divided into blocks of n entries, and each block is mapped
    to a fixed region of memory. An address from a given region of memory can only
    be stored in a given block, but it can be stored in any of the n entries in that
    block. For example, on the Raspberry Pi 3, the RAM is 1GB. Given a size of 4kB,
    this means 256K pages. This is mapped to 128 blocks (4 entries per block in the
    TLB), so every physical memory block has 4 entries, of which can be stored in
    one of 4 entries in the TLB.


