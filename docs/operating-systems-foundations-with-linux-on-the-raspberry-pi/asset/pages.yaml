  md: '# Operating Systems Foundations with Linux on the Raspberry Pi


    # 10.1 Overview


    This chapter will introduce networking from an operating systems perspective.
    We discuss why networking is treated differently from other types of I/O and the
    operating system requirements to support networking. We introduce POSIX socket
    programming both in terms of the role OS plays (e.g., socket buffers, file abstraction,
    supporting multiple clients.) as well as from a practical perspective.


    The focus of this book is not on networking per se; we refer the reader to the
    standard textbooks by Peterson and Davies [1] or Tanenbaum [2] or the open source
    book [3] by Bonaventure¹.


    # What you will learn


    After you have studied the material in this chapter, you will be able to:


    +   1. Explain the role of the Linux kernel in networking.

    2. Discuss the relationship between and and structure of the Linux networking
    stack and the kernel networking architecture.

    3. Use the POSIX API for programming networking applications: data types, common
    API and utility functions.

    4. Build TCP and UDP client/server applications and handle multiple clients.


    # 10.2 What is networking


    When we say "networking", we refer to the interaction of a computer system with
    other computer systems using an intermediate communication infrastructure. In
    particular, our focus will be on the TCP/IP protocol and protocols implemented
    on top of TCP/IP such as HTTP; and to a lesser extent on the wired (802.3) and
    wireless (802.11) Ethernet media access control (MAC) protocols.


    # 10.3 Why is networking part of the kernel?


    The network interface controller (NIC, aka network adapter) is a peripheral I/O
    device . Therefore, as all peripherals, access to this device is controlled via
    a device driver which must be part of the kernel. Why does the kernel also implement
    the TCP/IP protocol suite? Why does it not leave this to user space and simply
    deliver the data as received by the NIC to the user application?


    And indeed, there are a number of user space TCP/IP implementations [4, 5, 6,
    7]. Some of these claim to outperform the Linux kernel TCP/IP implementation,
    but the performance of the Linux kernel stack has improved considerably, and version
    4.16 (the current kernel at the time of writing) contained a lot of networking
    changes.


    > ¹Available at http://crp3book.info.uci.edu/'
