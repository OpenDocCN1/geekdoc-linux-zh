  md: '# Floating-point SIMD support


    The Armv8 architecture provides support for IEEE 754-2008 floating-point operations
    and SIMD (Single Instruction Multiple Data) or vector operations through dedicated
    registers and instructions.


    The Armv8 architecture provides two register files, a general-purpose register
    file, and a SIMD and floating-point register (SIMD&FP) register file. In each
    of these, the possible register widths depend on the Execution state.


    +   In AArch64 state, there is:

    - A general-purpose register file containing 31 64-bit registers. Many instructions
    can access these registers as 64-bit registers or as 32-bit registers, using only
    the bottom 32 bits.

    - A SIMD&FP register file containing 32 128-bit registers. The quadword integer
    and floating-point data types only apply to the SIMD&FP register file. The AArch64
    vector registers support 128-bit vectors (the effective vector length can be 64-bits
    or 128-bits depending on the instruction encoding).


    +   In AArch32 state, there is:

    - A general-purpose register file containing 32-bit registers. Two 32-bit registers
    can support a doubleword; vector formatting is supported.

    - A SIMD&FP register file containing 64-bit registers. AArch32 state does not
    support quadword integer or floating-point data types.


    Both AArch32 and AArch64 states support SIMD and floating-point instructions.


    +   AArch32 state provides:

    - SIMD instructions in the base instruction sets that operate on the 32-bit general-purpose
    registers.

    - Advanced SIMD instructions that operate on registers in the SIMD&FP register
    file.

    - Floating-point instructions that operate on registers in the SIMD&FP register
    file.


    +   AArch64 state provides:

    - Advanced SIMD instructions that operate on registers in the SIMD&FP register
    file.

    - Floating-point instructions that operate on registers in the SIMD&FP register
    file.'
