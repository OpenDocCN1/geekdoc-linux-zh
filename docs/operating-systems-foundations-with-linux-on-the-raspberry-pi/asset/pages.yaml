  md: '# 2.5.2 Process scheduling


    Scheduling of processes and threads has a huge impact on system performance, and
    therefore Linux administrators and programmers need a good understanding of scheduling
    in general and the scheduling capabilities of the Linux kernel in particular.
    It is important to understand how to manage priorities, per-process and per-user
    resources, and how to make efficient use of the scheduler. Chapter 5 ''Process
    scheduling'' discusses the OS processes on a processor. includes the rationale
    for scheduling, the concept of context switching, and an overview of scheduling
    policies (FCFS, priority, ...) and scheduler architectures (FIFO, multilevel feedback
    queues, priorities, ...). The Linux scheduler is studied in detail, with particular
    attention to the Completely Fair Scheduler but also discussing soft and hard real-time
    scheduling in the Linux kernel.


    # 2.5.3 memory management


    While memory is remarkably straightforward, OS architects have built lots of abstraction
    layers on top. Principally, these abstractions serve to improve performance and/or
    programmability. for both the administrator and the programmer, it is important
    to have a good understanding of how the memory system works and what its trade-offs
    are. This is tightly connected with concepts such as virtual memory, paging, swap
    space, etc. The programmer also needs to understand how memory is allocated and
    what memory protection mechanisms are. All this is covered in Chapter 6, ''Memory
    Management.'' We briefly review caches (in hardware and software) to improve access
    speed. We get into detail virtual memory to the management of physical memory
    resource. We provide highly graphical descriptions of address translation, paging,
    page tables, page faults, swapping, etc. We explore standard schemes for page
    replacement, copy-on-write, etc. We will examine concrete examples in Arm architecture
    and Linux OS.


    # 2.5.4 Concurrency and parallelism


    Concurrency and parallelism are more important for the programmer than the administrator,
    as concurrency is needed for responsive, interactive applications and parallelism
    for performance. From an administrator perspective, it is important to understand
    the impact of the use of multiple hardware threads by a single application. In
    Chapter 7,''Concurrency and parallelism,'' we discuss how the OS supports concurrency
    and how the OS can assist in exploiting hardware parallelism. We define concurrency
    and parallelism and discuss how they relate to threads and processes. We discuss
    the key issue of resource sharing, covering locking, semaphores, deadlock, and
    livelock. We look at OS support for concurrent and parallel programming techniques
    such as OpenMP, MPI, and OpenCL.


    # 2.5.5 Input/output


    Chapter 8 ''Input/output,'' presents the OS abstraction of an I/O device. We review
    device interfacing, covering topics like polling, interrupts, and DMA, and we
    discuss memory-mapped I/O. We investigate a range of devices, to highlight their
    diverse features and behavior. We cover hardware registers, memory mapping, and
    coprocessors. Furthermore, we examine the ways in which devices are exposed to
    programmers, and we review the structure of a typical device driver.


    # 2.5.6 Persistent storage


    Because Linux, as a Unix-like operating system, is designed around the file system
    abstraction, a good understanding files and file systems is important for the
    administrator, in particular of concepts such'
