  md: '# Operating Systems Foundations with Linux on the Raspberry Pi


    The SDV simplifies input C by converting it to an abstract boolean, retaining
    the original control flow by encoding all relevant program state as boolean variables.
    This abstract program is executed symbolically to identify and report kernel API
    violations. An example rule specifies that locks be acquired then subsequently
    released in strict sequence. The collection of pre-packaged API rules is harvested
    from previously identified error reports and Windows driver documentation. Empirical
    evidence shows the SDV approach has significantly reduced bugs in Windows drivers.


    When modern OS software is built-in high-level languages such as C# and Rust,
    it is feasible to perform static analysis directly on the source code, to provide
    guarantees about memory safety and data race freedom, for instance. Such guarantees
    may be composed to generate high-level OS safety properties.


    The4 project is a fully verified microkernel system [14]. The OS consists of several
    independent components with clearly defined communication channels. Minimal functionality
    is provided in verified microkernel, which is implemented in 10K lines of code,
    mostly C with some assembly. Properties include access control guarantees, memory
    safety, and system termination. Generally, there is proof that the C source code
    matches the high-level abstract specification of the system. These kinds of proofs
    are extremely expensive in terms of expert effort, to construct.


