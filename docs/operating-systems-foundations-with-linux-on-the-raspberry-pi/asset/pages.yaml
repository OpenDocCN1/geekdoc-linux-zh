    \ call invokes the LKM's initialization routine immediately after it loads the\
    \ LKM. insmod passes to init_module() the address of the initialization subroutine\
    \ in the Kernel using the macro module_init().\n\nThe LKM author sets up the module's\
    \ init_module to call a kernel function that registers the subroutines that the\
    \ LKM contains. For example, a character driver's init_module subroutine might\
    \ call the register_chdev kernel subroutine, passing the major and minor number\
    \ of the device it intends to drive and the address of its own open() routine\
    \ as arguments. register_chdev records records that when the kernel wants to open\
    \ that particular device, it should call the open() routine in our LKM.\n\nWhen\
    \ an LKM is unloaded (e.g., via rmmod(8) command), the LKM's cleanup subroutine\
