  md: '# Operating Systems Foundations with Linux on the Raspberry Pi


    The systemd process executes several processes to initialize the system: keyboard,
    hardware drivers, file systems, network, services. It has a sophisticated system
    for configuring all the processes under its control as well as for starting and
    stopping processes, checking their status, logging, changing privileges, etc.


    The systemd process performs many tasks, but the principle is always the same:
    it starts a process under the required user name and monitors its state. If the
    process exits, systemd takes appropriate action, eg., restarting the process or
    reporting the error that caused it to exit.


    # 2.3.7 Login


    One of the systemd running processes is that users log into the system (system-logind).
    To login via a terminal (or virtual console), Linux uses two programs: getty and
    login (originally, the tty meant ''teletype'', a precursor to modern terminals).
    Both run as.


    A basic getty program opens the terminal device, initializes it, prints the login
    prompt, and waits for a user name to enter. When this happens, getty executes
    the login program, and the login program then prompts the user for a password.
    If the password is wrong, login simply exits. The systemd process will notice
    this and spawn another getty. If the password is correct, login executes the user''s
    shell program as that. From then on, the user can start processes via the shell.


    The reason why there are two separate programs is that both getty and login can
    be used on their own, for example, a remote login over SSH does not use a terminal
    but uses login: each new connection is handled by a program called ssh that starts
    a login process.


    A graphical login is conceptually not different from the above description. The
    difference is that instead of getty/login programs, a graphical login program
    called the display manager is run, and after authentication, the process launches
    the graphical shell.


    In Raspberry the display manager is LightDM, and the graphical shell is LXDE (Lightweight
    X11 Desktop Environment). Like most Linux distributions, the graphical desktop
    environment is based on the X Window System (X11), a project started at MIT and
    now managed by the XOrg Foundation.


    # 2.4 Kernel administration and programming


    The administrator of a Linux system does not need to know the inner workings of
    the Linux kernel but need to be familiar with tools to configure the operating
    system, including adding functionality to the kernel through kernel modules, and
    compilation of a custom kernel.


    # 2.4.1 Loadable kernel modules and device drivers


    As explained above, the kernel is modular, and functionality can be loaded at
    run time using Loadable Kernel Modules (LKM). This feature is used in configure
    drivers for the system hardware. Therefore the administrator needs to be familiar
    with the main concepts of the module system and a basic understanding of the role
    of a device driver.'
