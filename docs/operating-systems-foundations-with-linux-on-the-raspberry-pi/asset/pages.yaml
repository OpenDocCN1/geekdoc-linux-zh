  md: 'from one another, care must be to avoid deadlock, i.e., the case where all
    tasks are waiting for the other tasks so no tasks can continue execution. In the
    case of communication between threads in a multithreaded process, the communication
    occurs via the shared memory. For communication between processes, there are a
    number of possibilities e.g., communication using shared files, operating system
    pipes, network sockets, operating system message queues, or ever shared memory.


    The issues with exchange of information in concurrent processes can be best explained
    using the producer-consumer problem: each process is either a producer or a consumer
    of information. Ideally, any item of information produced by a producer would
    be immediately consumed by a consumer. However, in general, the rate of progress
    of producers and consumers is different (i.e., they are not operating synchronously).
    Therefore, information needs to be buffered, either by the consumer or by the
    producer. In practice buffering is always limited (the problem is also known as
    the bounded buffer problem), so at some point, it is possible that the producer
    will have to suspend execution until there is sufficient capacity for the information
    to be buffered. Note that in general there can be more than one buffer (e.g.,
    it is common for each consumer to have a buffer per producer).


    Effectively, the buffer is a shared resource, so in terms of access control, information
    exchange and resource sharing are the same problem. This is also true for synchronization:
    the consumer needs the information from the producer(s) in order to progress.
    So as long as information is not there, the producer has to wait. This is also
    the case with shared resources; for example, trains have to wait until the shared
    section of track is free. In other words, control of access to shared resources
    and synchronization of the exchange of information are just two different views
    on the same problem. Consequently, there will be a single set of mechanisms that
    can be used to address this problem.


    Note that if there are multiple producers and/or consumers, and a single shared
    resource, the problem is widely known as the reader-writer problem, and has to
    address the concurrent access to the shared resource.


    # 7.3.2 Concurrency terminology


    When discussing synchronization and shared resources, it is useful to define some
    additional terms and concepts.


    # Critical section


    A critical section for a shared resource is portion of a program which accesses
    the resource in such a way that multiple concurrent accesses would lead to undefined
    or erroneous behavior. Therefore, for a shared resource, only one process can
    be executing its critical section at a time. The critical section is said to be
    protected if the access to it is controlled in such a way that the behavior is
    well-defined and correct.


    # Synchronization


    In this context, by synchronization, we mean synchronization between concurrent
    threads of execution. When multiple processes need the exchange information, synchronization
    f the processes results in a well-defined sequence of interactions.


    # Deadlock


    Deadlock is the state in which each process in a group of communicating process
    is waiting for a message from the other process in order to proceed with an action.
    Alternatively, in a group of'
