    interface applicable to uniprocessor or multiprocessor systems. The GIC is a much
    more advanced and flexible interrupt handling system than the NVIC of the Cortex-M0+
    because it needs to support heterogeneous multicore systems and virtualization.
    Rather than the simple set of registers used by the NVIC, the GIC uses a memory-mapped
    interface of 255KB as well as a set of GIC control registers (GIC*) and registers
    to support virtualization of interrupts (GICH*, GCV*) in the CPU.


    # 3.4.2 instruction set


    The Cortex-A53 supports both the AArch32 and AArch64 instruction sets. The AArch32
    includes the Thumb instruction set in the Cortex-M series. Conveniently, compiled
    for the Cortex-M0+, for example, run on the Cortex-A53. More to the point, the
    Raspberry Linux distribution for the Raspberry Pi 3 is a 32-bit distribution,
    so the processor runs the OS and all applications in the AArch32 state.


