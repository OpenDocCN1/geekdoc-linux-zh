    The advantage of using a separate priority rather than, a time-based attribute
    of the task is that the priority can be changed if required. This is essential
    to prevent starvation, as mentioned for SJF. Any priority-based scheduling carries
    the risk that low-priority processes may never execute because there is a higher-priority
    process taking precedence. To remedy this, the priority should not be static but
    increased with the age of the process. This is called aging.


    # ## 5.7.7 Real-time scheduling


    Real-time applications are applications that process data in real-time, i.e.,
    without delays. From a scheduling perspective, this means that the tasks have
    well defined time constraints. Processing must be within the defined constraints
    to be considered correct, in particular, not finishing a process within a given
    deadline can cause incorrect functionality.


    We can distinguish two types of real-time systems:


    +   - Soft real-time systems give no guarantee as to when a critical real-time
    process will be scheduled, but only that the critical process will have a higher
    priority. A typical example is video and audio stream processing: missing deadlines
    will affect the quality of the playback but is not fatal.


    +   - In real-time systems, a task must be serviced by the device, so the scheduler
    must be able to guarantee this. This is, for example, the case for the controls
    of an airplane or other safety-critical systems.'
