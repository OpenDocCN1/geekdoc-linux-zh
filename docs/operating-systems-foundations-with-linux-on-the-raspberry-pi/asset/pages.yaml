  md: '# Operating Systems Foundations with Linux on the Raspberry Pi


    Example character devices include /dev/tty, which is the current interactive terminal
    and /dev/watchdog, which is a countdown timer.


    A block device transfers data in fixed-size chunks called blocks. These large
    data transfers may be buffered by the OS. A block device supports a file system
    that can be mounted, as described in Chapter 9. Example block devices include
    storage media like a RAM disk or an SD card (which may be known as /dev/mmcblk0
    on your system).


    Other classes of device include network devices, which operate on packets of data,
    generally exchanged with remote nodes. See Chapter 10 for more details.


    # 8.2.3 Trivial device driver


    To present the typical Linux approach to devices, this section implements a trivial
    device driver. A driver is a kernel module that provides a set of functions enabling
    the device to be mapped to a file abstraction. Once the module is loaded, we can
    add a device file for it and interact with the device via the file.


    The C code below implements the trivial device driver as a kernel module. This
    is a character-level driver that returns a string of characters when it is read.
    In homage to Douglas Adams, our driver is called ‘The Meaning of Life’, and it
    supplies an infinite stream of * characters, which have decimal value 42 in ASCII
    or UTF8 encoding.


    The key Linux API call is register_chrdev, which allows us to provide a struct
    of file operations to implement interaction with the device. The only operation
    we define is read, which returns the * characters. The registration function returns
    an int, which is the numeric identifier the Linux kernel assigns to this device.


    We use this identifier to ‘attach’ the driver to a device file, via the mknod
    command. See the bash code below for how to compile and load the kernel module,
    attach the driver to a device file, then read some data.


    The stream of characters appears fairly slowly when we cat the device file. This
    is because our code is highly inefficient; we use the copy_to_user call to transfer
