  md: "# Internet socket address data type: structaddr_in\n\nThe members of the socket\
    \ address data structure do not seem to relate much to what we expect for an internet\
    \ address (and port number). This is due to the fact that the socket interface\
    \ is not restricted to internet communications and many alternative underlying\
    \ host to transport mechanisms are available (by the value of the sa_family' socket\
    \ address structure member), and these have different address schemes that to\
    \ be supported. The 14-byte address data is formatted in different ways depending\
    \ on the underlying transport. For simplicity; a specific internet socket address\
    \ has also been defined which is used as an overlay to the more generic socket\
    \ address structure. This makes programming the address information more convenient\
    \ as a template for the specific internet address value format:\n\n**Listing 10.6.2:\
    \ internet socket address struct**\n\n```\n#include <netinet/in.h>\nstruct sockaddr_in\
    \ {\n    sa_family_t sin_family; /* address family: AF_INET */\n    in_port_t\
    \ sin_port; /* port in network byte order */\n    struct in_addr sin_addr; /*\
    \ internet address */\n};\n```\n\nThe internet socket address structure has the\
    \ member type struct in_addr:\n\n**Listing 10.6.3: internet address struct (IPv4)**\n\
    \n```\n#include <netinet/in.h>\nstruct in_addr {\n    uint32_t s_addr; /* address\
    \ in network byte order */\n};\n```\n\nWhen using a variable of internet socket\
    \ address type, it is good practice to zero-fill the padding sin_zero.\n\n**Network\
    \ byte order versus host byte order**\n\nThe network byte order for TCP/IP is\
    \ defined as big-endian; this is reflected in the data types used in the standard\
    \ socket interface library. As such it is essential that the host byte order is\
    \ correctly mapped to the network byte order when setting values of the standard\
    \ socket data type variables used and vice versa when interpreting these values.\
    \ htons() and htonl() functions are used to convert host byte order to ntohs()\
    \ and ntohl() functions are used to convert network byte order 16-bit and 32-bit\
    \ data types to their respective host byte order. This feature of standard socket\
    \ programming is a minor but essential aspect to ensure the portability of internet\
    \ application code.\n\nArm platforms can be configured to run in little-endian\
    \ or big-endian mode at boot time, so it is essential to use the above conversion\
    \ functions to ensure correctness of the code."
