  md: "# Operating Systems Foundations on Linux on the Raspberry Pi\n\nOn running\
    \ this program, the timer will fire every 100 clock ticks and raise an interrupt\
    \ request. Let's have a look at the interrupt handler. What should this do to\
    \ achieve time slicing between two tasks? Let's assume Task 1 has been running\
    \ and we now want to run Task 2.\n\n+   - First, save the register file for Task\
    \ 1, we do this by pushing all register contents onto the stack. (If you spot\
    \ an issue here, well done! We'll get back to this in Section 1.5.4.)\n- Then\
    \ determine which task is to run next (i.e., Task 2). We can identify each task\
    \ using a small integer ('task identifier') that we store in the memory accessible\
    \ by the kernel. We load the task identifier for Task 2 into a register and update\
    \ the memory with the task identifier for the next task (in our case, again Task\
    \ 1).\n- We now move the register file of Task 1 from the stack to kernel memory.\
    \ In practice, the kernel uses a special data structure, the Task Control Block\
    \ (TCB), for this purpose.\n- Now we can read the register file contents for Task\
    \ 2 from its TCB. Again, we have to do this via the stack (why?).\n- Once this\
    \ is done, Task 2 will start running from the location indicated by PC and run\
    \ until the next interrupt.\n\nWe can express this sequence of actions in high-level\
    \ Python code for our processor:\n\n```\ndef time_slice(systemState,registers):\n\
    \    # Push registers onto the stack\n    for r in range(0,16):\n        systemState[registers[MSP]]=registers[r]\n\
    \        registers[MSP]+=1\n    # Get next task\n    pid1 = systemState[PID] =\
    \ 0 or 1\n    pid2 = 1-pid1\n    tcb1 = T_OFFSET+pid1*TCB_SZ\n    tcb2 = T_OFFSET+pid2*TCB_SZ\n\
    \    # Pop registers from stack and store to tcb1\n    # We use r0 to show that\
    \ in actual code we'd need to read into a temporary register\n    for r in range(0,16):\n\
    \        r0=systemState[registers[MSP]]\n        systemState[tcb1+r]=r0\n    \
    \    registers[MSP]+=1\n    # Pop registers for Task 2 from stack\n    for r in\
    \ range(0,16):\n        registers[MSP]=systemState[tcb2+r]\n        registers[MSP]-=1\n\
    ```\n\nThis code is a minimal example of a round-robin scheduler for two tasks."
