    # 5.7.3 Priority-driven scheduling


    In-driven scheduling, the order in the run queue is determined by the priority
    of the process or thread; in other words, the run queue is a priority queue. In
    general, we can observe the following:


    +   - A priority-driven scheduler is an on-line scheduler.

    - It does NOT precompute a schedule of tasks/jobs.

    - It assigns priorities to jobs when they are released and places them on a ready
    job in priority order.

    - When preemption is allowed, a scheduling decision is made whenever a job is
    released or completed.

    - At each scheduling time, the scheduler updates the ready queue and then schedules
    and executes the job at the head of the queue.'
