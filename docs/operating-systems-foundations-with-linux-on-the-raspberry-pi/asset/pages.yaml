    ```


    Note files in the directory /mnt/ramdisk are not persistent. This directory is
    lost when the system is powered down. RAM disks are particularly useful for embedded
    devices like the Raspberry Pi, which repeated high frequency writes to disk can
    cause SD corruption.


    # 9.14 Fixing up broken file systems


    Persistent storage may be unreliable. Bad blocks should be detected and avoided.
    File systems have mechanisms for recording bad blocks to ensure data is not allocated
    to these blocks. For instance, FAT has a bad block marker.


    Sometimes, file systems are in an inconsistent state if the system is powered
    down unexpectedly, or devices are removed without unmounting. Some data may have
    been cached in RAM, but not written back before the shutdown or removal.


    Fixup utilities like fsck can check and repair file system glitches. They check
    for directory integrity and make alterations (e.g., to inode reference counts)
    as appropriate. File System journals may be used to replay incomplete actions
    on file systems.


    These general-purpose tools can handle many common file system problems. For more
    serious issues, expert cyber forensic tools are available. These facilitate partial
    data recovery from damaged devices.


    # 9.15 Advanced topics


    Some storage media are read-only, as optical disks. On Linux, any file system
    may be mounted for read-only access. This implies that only operations are permitted,
    and no metadata updates (even access timestamps) are possible. Generally, read-only
    media have specialized file formats such as the universal disk format (UDF) for
    DVDs.


    Specialized Raspberry Pi distributions may mount the root file system as read-only,
    with any file written to transient RAM disk storage. This is an attempt to guarantee
    system integrity, e.g., for public display terminals in museums.


    Network file systems are commonplace, particularly given widespread internet connectivity.
    In addition to the issues outlined above for local file systems, network file
    system protocols must also handle:'
