    \ need to store these bits in the lookup tables of the cache because the cache\
    \ stores only cache lines. In other words, from the perspective of the cache,\
    \ the memory consists of cache lines rather than individual locations. So we have\
    \ the following formulas:\n\n```\ndata_position_in_cache_line = address & 0xF\n\
