  md: '# 7.3.3 Synchronization primitives


    In 1962, the famous Dutch scientist Edsger Dijkstra wrote a seminal – though interestingly,
    technically unpublished – article titled ''Over seinpalen'' [1], i.e., ''About
    Semaphores,'' which he introduced the concept of semaphores as a mechanism to
    protect a shared resource. In Dijkstra''s article, a semaphore is a special type
    of shared memory, storing a non-negative integer. To access the semaphore register,
    Dijkstra proposes two operations, V(S), which stands for ''verhoog'', i.e., increment,
    and P(S), which stands for ''prolog'', i.e., try to decrement. The P(S) operation
    will block until the value of S has been successfully decremented. Both operations
    must be atomic.


    If the semaphore can take only 0 or 1, Dijkstra specifically mentions the V-operation
    means ''the free track'' and the P-operation ''try to pass by the semaphore onto
    the single track'', and that this is only possible if the semaphore is set to
    ''Safe'' and passing it implies it to ''Unsafe''.


    Dijkstra calls a binary semaphore (mutual exclusion lock) [2]; a non-binary semaphore
    is sometimes called a counting semaphore. Although there is no general agreement
    on this definition, the definitions in the Arm Synchronization Primitives Development
    Article [3] agree with this:


    *Mutex* A variable, to indicate the two states locked and unlocked. Attempting
    to lock a mutex already in the locked state blocks execution until the holding
    mutex unlocks it. Mutexes are sometimes called locks or binary semaphores.


    *Semaphore* A counter that can be atomically incremented and decremented. Attempting
    to decrement a semaphore that holds a value less than 1 blocks execution until
    another agent increments the semaphore.


    The key requirement of Dijkstra''s semaphores is the atomicity of the operation.
    Modern processors provide special atomic instructions that allow implementing
    semaphores efficiently.


    # 7.3.4 Arm hardware support for synchronization primitives


    # Exclusive operations and monitors


    The ARMv architecture introduced the Load-Exclusive and Store-Exclusive synchronization
    primitives, LDREX and STREX, in combination with a hardware feature called exclusive
    monitor. Quoting from the Arm Synchronization Primitives Development Article [3]:


    LDREX The LDREX instruction loads a word from memory, initializing the state of
    the exclusive monitor(s) to track the synchronization operation. For example,
    LDREX R1, [R0] performs a Load-Exclusive from the address in R0, places the value
    into R1 and updates the exclusive monitor(s).


    STREX The STREX instruction performs a conditional store of a word to memory.
    If the exclusive monitor(s) permits the store, the operation updates the memory
    location and returns the value 0 in the destination register, indicating that
    the operation succeeded. If the exclusive monitor() do not permit the store, the
    operation does not update the memory location and returns the value 1 in the destination
    register. This makes it possible to implement conditional execution paths based
    on the success or failure of the memory operation. For example, STREX R2, R1,
    [R0] performs a Store-Exclusive operation to the address in R0, conditionally
    storing the value from R1 and indicating success or failure in R2.'
