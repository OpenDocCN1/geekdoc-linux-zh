    # 8.5.1 Specific interrupt handling details


    Look at the /proc/interrupts file on the Raspberry Pi. This lists the statistics
    for how many interrupts have been seen by the system. Figure 8.6 shows an example
    from Raspberry Pi 2 Model B that has been running for several hours. Each interrupt
    has an integer identifier (left-most column), a count of how many times it has
    been handled by CPU0 (second left column) and other CPUs (in subsequent columns),
    and a name for the event that triggered the interrupt (right-most column). The
    timer and dwc_otg_ devices are likely to have the highest interrupt counts.


    ![](img/17ca5177da1b1e15b2169f9c7932e5b6_236_1.png)


    Figure 8.6: Sample /proc/interrupts file.


    Interrupt handlers, also known as interrupt service routines, are generally registered
    during system boot time, when a module is dynamically loaded into the kernel.
    An interrupt handler is registered with the request_irq() function, from include/linux/interrupt.h.
    Required parameters include the interrupt number, the handler function, and the
    associated device name. An interrupt handler is unregistered with the free_irq()
    function.'
