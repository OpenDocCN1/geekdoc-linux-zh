  md: '# Foreword


    In 1983, when I started modeling a RISC processor using a simulator written in
    BBC Basic on a BBC Microcomputer, I could hardly have conceived that there would
    be billions of Arm (then short for ''Acorn RISC Machine'') processors all over
    the world within a few decades.


    I expect Lin Torvalds has similar feelings, when he thinks back to the early days,
    crafting a prototype operating system for the i386 PC. Now Linux runs on a vast
    array of devices, from smartwatches to supercomputers. I am delighted that an
    increasing proportion of these devices are built around Arm processor cores.


    In a more recent tale of runaway success, the Raspberry Pi single-board computer
    has far exceeded its designers'' expectations. The Raspberry Pi Foundation thought
    they might sell one thousand units,''maybe 10 thousand in our wildest dreams''.
    With sales figures now around 20 million, the Raspberry Pi is firmly established
    as Britain''s best-selling computer.


    This textbook aims to bring these three technologies together—Arm, Linux, and
    Raspberry Pi. The authors'' ambitious goal is to ''make Operating Systems fun
    again''. As a professor in one of the UK''s largest university Computer Science
    departments, I am well aware that modern students demand engaging materials. Dusty
    900-page textbooks with occasional black and white illustrations are not well
    received. Today''s learners require interactive content, gaining understanding
    through practical experience and intuitive analogies. My observation applies to
    students in traditional higher education, as well as those pursuing blended and
    fully online education. I am confident this innovative textbook will meet the
    needs of the next generation of Computer Science students.


    While the modern systems software stack has become large and complex, the fundamental
    principles are unchanging. Operating Systems must trade off abstraction for efficiency.
    In this respect, Linux on Arm is particularly instructive. The authors have done
    an excellent job of presenting Operating Systems, with direct lines to concrete
    examples of these concepts in Linux on the Raspberry Pi. Please don''t just read
    this textbook—buy a Pi and try out the practical exercises as you go.


    Was it Plutarch who said, ''The mind is not a vessel to be filled, but a fire
    to be kindled?'' We could translate this into the Operating Systems domain as
    follows: ''Learning isn''t just reading source code; it''s bootstrapping machines.''
    I hope that you enjoy all these activities, as you explore Operating Systems with
    Arm using your Raspberry Pi.


    Steve Furber CBE FREng

    ICL Professor of Computer Engineering

    The University of Manchester, UK

    February 2019'
