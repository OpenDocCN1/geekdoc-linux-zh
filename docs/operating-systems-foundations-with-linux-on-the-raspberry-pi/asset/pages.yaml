    # 6.6 Process view of memory


    A process has the abstraction of logical memory spaces, which are superimposed
    on the paging virtual address space as contiguous segments. The text segment contains
    the program code. This is generally loaded to known addresses by the runtime loader,
    reading data from the static ELF file. Text generally starts at a known address.
    For instance, invoke:


    ```

    ld --verbose | grep start

    ```


    to find this address for your system.


    Data is usually located immediately after the text. This includes statically allocated
    data which may be initialized (the data section) or uninitialized (the bss section).
    The runtime heap comes after this data. The runtime stack, which supports function
    evaluation, parameter passing, and scoped variables, starts near the top of memory
    and grows downwards.


    From a process perspective, there are three ways in which the OS might add new
    pages to the virtual address space while the program is running:


    +   1. brk or sbrk extends the program break, effectively growing the heap.

    2. mmap allocates a new block of memory, possibly backed by a file.

    3. The stack can grow down, as more functions are called in a dynamically nested
    scope; the stack expands on-demand, managed as part of the page fault handler.


    ![](img/17ca5177da1b1e15b2169f9c7932e5b6_173_0.png)


    Figure 6.14: Evolution of a process''s user virtual address space, dynamic changes
    in red, lower addresses at the bottom.'
