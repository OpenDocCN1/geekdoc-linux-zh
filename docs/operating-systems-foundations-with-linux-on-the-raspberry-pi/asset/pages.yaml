  md: 'distributed contexts, due to the metadata updates and consistency that are
    required. Parallel frameworks often layer custom distributed file systems on top
    of per-node file systems, for instance, HDFS for Hadoop.


    Global-scale distributed data systems are often key-value stores, such as etcd
    or mongodb, which feature replication and eventual consistency to mitigate latencies
    in wide area networks. Object stores, such as Minio and Ceph, allow binary blobs
    to be stored at known locations (perhaps web addresses) with associated access
    controls and other metadata.


    # # 11.4 Virtualization and containerization


    Utility computing implies general compute resource situated in the cloud. Users
    simply rent CPU time on virtual servers they can provide on-demand.


    Virtualization enables multiple virtual machines (VMs) to be hosted and isolated
    from each other on a single physical node. The hypervisor manages guest VMs on
    top of the host machine. Figure 11.3 presents the concepts of virtualization as
    a schematic diagram. This approach is crucial for infrastructure service to support
    flexible deployment and resource overprovisioning. It is possible to migrate a
    VM to another physical node if service levels are not sufficient. Modern processors
    have extensions to support virtualization natively. These include extra privilege
    levels and an additional layer of indirection in memory management. Linux supports
    hardware virtualization with the Kernel-based Virtual Machine (KVM), which acts
    as a hypervisor. Virtual machine software that runs on top of KVM includes the
    QEMU full system emulator. This allows a distinct guest OS, possibly compiled
    for a different processor architecture, to execute on top of the Linux host OS.


    | app | app | app |

    | libs | libs | libs |

    | Guest OS | Guest OS | Guest OS |

    | Virtual Machine | Virtual Machine | Virtual Machine |

    | Hypervisor | |

    | Host OS |


    Figure 11.3: Schematic diagram for virtualization, showing that an app actually
    runs on top of two kernels (in guest and host OS respectively).


    There is an alternative approach: unlike fully-fledged virtualization where each
    VM runs a distinct guest OS, Linux containers enable lightweight isolation of
    processes that share a common host OS'
