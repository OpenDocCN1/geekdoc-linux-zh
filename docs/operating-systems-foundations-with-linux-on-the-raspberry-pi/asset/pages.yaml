  md: '# 11.9 Further reading topics


    Throughout this chapter, we have given a flavor of contemporary trends in OS development
    and deployment. Some of these issues have an immediate impact on Linux; others
    may affect the platform over the next decade.


    The annual workshop on Hot Topics in Operating Systems (HotOS) is an excellent
    venue for OS future studies and speculation. If you are interested in OS research
    and development, consult recent years'' proceedings of this event, which should
    be available online.


    # 11.10 Exercises and questions


    # 11.10.1 Make a minimal kernel


    Configure and build a custom Linux kernel for your Raspberry Pi. How small a kernel
    image can you create?


    # 11.10.2 Verify important properties


    Verified software systems provide formal guarantees about their properties and
    behavior. Suggest some properties you might want to prove about components of
    an OS.


    # 11.10.3 Commercial comparison


    Much of the popularity of Linux could be attributed to the fact it is free, open-source,
    software (FOSS). Compare Linux with a mainstream OS that is not FOSS. Can you
    identify any differences, and explain why they occur? Is there a different emphasis
    on developing new features?


    # 11.10.4 For or against certification


    Software certification has a number of advantages and disadvantages, which must
    be carefully assessed. Draw up a debate, listing the pros and cons of OS certification.
    This could form the basis for a group discussion with your peers.


    # 11.10.5 Devolved decisions


    The modern linux kernel abdicates responsibility for certain policies to user
    space, e.g., for file systems (with FUSE) and networking (with DPDK). Discuss
    other services that might be transferred from the kernel to user space. System
    logging is one candidate.


    # 11.10.6 Underclock, overclock


    It is possible to modify the configuration of your Raspberry Pi to change the
    CPU frequency. Find the line setting arm_freq = 1200 in your /boot/config.txt
    and modify this. The frequency is specified as an integer, denoting MHz. Are there
    other frequencies you can change, as those for GPU and memory. Check online documentation
    for details, and note that some settings may void your warranty.


    You can investigate how frequency and power trade-off, by monitoring your Raspberry
    Pi power consumption when you run CPU-intensive applications (perhaps the stress
    utility). You will need to use an external USB multimeter or power monitor. Produce
    a graph to show the relationship between frequency and power in W.'
