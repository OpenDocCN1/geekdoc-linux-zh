  md: '# Additional caches


    As we will see in Chapter 6, in practise page tables are hierarchical and address
    translation in a hypervisor-based environment has two stages (Figure 3.10). The
    Cortex-53 MMU, therefore, provides additional caches:


    +   - 4-way set-associative 64-entry walk cache.

