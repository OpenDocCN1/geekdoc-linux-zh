    # 11.6 Verification and certification


    Formal verification techniques use mathematical models and proofs to provide guarantees
    about the properties and behavior of systems. This is essential as software grows
    in size and complexity, and as it becomes the essential foundation of our everyday
    societal interactions. Many industrial sectors are establishing certified requirements
    for software to be verified formally, e.g., ISO 26262 for automotive vehicles
    and DO-178C for aerospace. Since the OS is a critical part of the software stack,
    it will become increasingly necessary to apply verification techniques to sets
    of OS components.


    Microsoft pioneered verified components for the Windows OS with its device driver
    verification program. Poor quality, third-party device drivers running in privileged
    mode can compromise kernel data structures and invariants, often resulting in
    the ''blue screen of death,'' see Figure 11.7. This is the Windows equivalent
    of the Unix kernel panic. At one point, bugs in device drivers caused 85% of system
    crashes in Windows XP. [12]


    ![](img/17ca5177da1b1e15b2169f9c7932e5b6_314_1.png)


    Figure 11.7: Blue screen of death in Windows XP (left) and Windows 10 (right)
    – since the driver verification program, such blue screens are much less common.
    Photo by author.


    The SLAM project blends ideas from static analysis, model checking, and theorem
    proving [13]. The key tool is the Static Driver Verifier (SDV) which analyzes
    C source code, typically a device driver implementation comprising thousands of
    lines of code, to check it against a set of hard-coded rules that encapsulate
    legal interactions with the Windows kernel.


