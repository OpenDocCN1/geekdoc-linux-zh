    \ Of these, SCHED_OTHER, SCHED_FIFO and SCHED_RR are required by the POSIX 1003.1b\
    \ real-time standard [6].\n\nFor threads using one of the normal policies, the\
    \ static priority is not used in scheduling decisions (it is set to 0). Processes\
    \ scheduled under one of the real-time policies have a static priority value in\
    \ the range 1 (low) to 99 (Thus real-time always has higher static priority than\
    \ normal threads.\n\nThe scheduler maintains a list of runnable threads per static\
    \ priority value. To determine which thread to run next, it looks for the non-empty\
    \ list with the highest static priority and selects the thread at the head of\
    \ this list.\n\nThe scheduling policy determines where a thread is to be inserted\
    \ into the list of threads with equal priority and how it will progress to the\
    \ head of the list.\n\nIn Linux, all scheduling is preemptive: if a thread with\
    \ a higher static priority becomes ready to run, the currently running thread\
    \ will be pre-empted and returned to the run list for its priority level. The\
    \ scheduling policy determines the ordering within the run list. Thus, e.g., for\
    \ the run list with priority 0, i.e., the normal scheduling category (SCHED_NORMAL),\
    \ there can be up to three different policies that decide the ordering of threads.\
