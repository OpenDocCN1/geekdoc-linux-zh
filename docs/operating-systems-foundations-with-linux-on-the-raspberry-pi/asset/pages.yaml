  md: 'It is possible to lock a file to prevent concurrent access by multiple processes.
    There are various ways to perform file-based locking. The C code below demonstrates
    the use of lockf, which relies on the underlying fcntl system call.


    # Listing 9.6.1: The log.txt file for single writer access

    ```c

    1 #include <stdio.h>

    2 #include <stdlib.h>

    3 #include <string.h>

    4 #include <sys/file.h>

    5 #include <unistd.h>

    6

    7 /* takes a single integer command-line

    8  * parameter, specifying how long to

    9  * sleep after each write operation

    10 */

    11

    12 int main(int argc, char **argv) {

    13     int t = atoi(argv[1]);

    14     int i;

    15     char msg[30];

    16

    17     int fd = open("log.txt", O_WRONLY|O_CREAT|O_APPEND, 0666);

    18     if(fd == -1) {

    19         perror("unable to open file");

    20         exit(1);

    21 }

    22     /* lock the open file */

    23     if (lock(fd, F_LOCK, 0) == -1) {

    24         perror("unable to lock file");

    25         exit(1);

    26 }

    27

    28     for (i=0; i<t; i++) {

    29         printf(msg, "sleeping for %d seconds\n", t);

    30         write(fd, msg, strlen(msg));

    31         sleep(t);

    32     }

    33

    34     /* unlock file */

    35     if (lock(fd, F_ULOCK, 0) == -1) {

    36         perror("unable to unlock file");

    37         exit(1);

    38 }

    39     close(fd);

    40     return 0;

    41 }

    ```


    If a file is already locked, a subsequent call to lockf blocks until that file
    has been unlocked. Try compiling this C code, running two instances of the executable
    concurrently to observe what happens—the first process should complete all its
    writes to the log before the second process is allowed to do anything.


    Note this kind of file-based locking on Linux is only advisory. Processes may
    ''ignore'' file locks entirely and proceed to read from or write to open files
