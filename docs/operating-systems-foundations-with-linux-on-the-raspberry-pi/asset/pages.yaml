    command-line invocation.


    # 4.3.2 Linux kernel data structures


    The Linux kernel spreads metadata across several linked blocks of memory. In this
    section, we will examine three key data structures:


    +   - thread_info

    -* task_struct

    -* thread_struct


    The c struct thread_info is architecture-specific; for the Arm platform the struct
    is defined in arch/include/asm/thread_info.h. Each thread of execution has its
    own unique thread_info instance, embedded at the base of the thread''s runtime
    stack. Each thread has a dedicated 8KB stack in kernel memory for use when executing
    kernel code; this is distinct from the regular user-mode stack. We can extract
    the thread_info pointer by a low-overhead bitmask operation on the stack pointer
    register, see code below.


    ![](img/17ca5177da1b1e15b2169f9c7932e5b6_101_1.png)


    ```

    return (struct thread_info *)

    (current_stack_pointer & ~(THREAD_SIZE - 1));

    ```


    The majority of information in thread_info relates to the low-level processor
    context, such as register values and status flags. The data structure includes
    a pointer to the corresponding task_struct instance for the process.


    The struct called task_struct is the Linux-specific instantiation of the process
    control block. It is necessarily a large data structure, storing all the context
    for the process. The data structure is defined in the architecture-independent
    kernel header file linux/sched.h. In the kernel, the C macro returns a pointer
    to the task_struct for the current process. On 32-bit Arm kernel v4, the code
