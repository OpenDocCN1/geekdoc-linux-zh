  md: '# Operating Systems Foundations with Linux on the Raspberry Pi


    The ext4 file system supports encryption of empty directories, which can then
    have files added to them. The file names and contents are encrypted. The e4crypt
    utility is an appropriate tool to handle ext4 encrypted directories.


    Note that ext4 encryption is not supported on Raspian kernels by default. Encryption
    requires the following configuration:


    +   1. The kernel build option EXT4_ENCRYPTION must be set.


    +   2. The target ext4 partition must have encryption enabled.


    There are alternative, single-file encryption tools. For instance, zip archives
    can be encrypted with a passphrase. In general, the gpg command-line tool allows
    single file payloads to be encrypted.


    Lower-level encryption techniques include dm-crypt which operates at the block
    device level.


    # 9.12 FAT


    The File Allocation Table (FAT) file system is named after its characteristic
    indexing data structure. FAT was a DOS-based file system used for floppy disks.
    Although it is not ''native'' to Linux, it is well-supported since FAT is ubiquitous
    in removable storage such as USB flash drives and SD cards. Due to its simplicity
    and long history, FAT is highly compatible with other mainstream and commercial
    OSs, as well as hardware devices such as digital cameras. For SD cards, the default
    format is FAT. Observe that your Raspberry Pi SD card has a FAT partition for
    booting.


    | Listing 9.12.1: A Raspberry Pi SD card has a FAT partition |

    | 1 | cat /etc/mtab | grep fat |


    The idea behind the FAT format is that a file consists of a linked list of sequential
    data blocks. A directory for a file simply needs a pointer to the first data block,
    along with some associated metadata. Rather than storing the data blocks pointers
    inline, where they might be easily corrupted, the FAT system has a distinct table
    of blocks near the start of the on-disk file system. This is the file allocation
    table (FAT). Often the FAT may be duplicated for fault tolerance.


    Given a fixed number of data blocks on a file system, N, then the file allocation
    table should have N entries, for a one-to-one correspondence between table entries
    and data blocks.


    +   * If the data block is used as a part of a file, then the corresponding table
    entry contains the pointer to the next block.


    +   * If this is the last block of the file, the table entry contains an end of
    file marker.'
