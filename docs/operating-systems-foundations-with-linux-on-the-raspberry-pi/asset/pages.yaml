    # 8.6 Efficient IO


    One of the issues is that IO slows the constant need for context switches. When
    IO occurs, kernellevel activity must take place. User-invited system calls vector
    into the kernel, so do interrupts generated by the hardware. Switching into the
    kernel takes time, switching processor mode and saving context. DMA minimizes
    kernel interventions in IO, which is why it is so more efficient.


    Another inefficiency in IO is excessive memory copying. Recall from our simple
    device driver example that we used the copy_to_user function call, to transfer
    data from kernel memory to user memory. The problem is that user code cannot access
    data stored in kernel memory.


    The technique of buffering improves performance. The objective is to batch small
    units of data into a larger unit and process this in bulk. Buffering quantizes
    data processing. Effectively, a buffer is a temporary storage location for data
    being transferred from one place to another.


    The technique of pooling is for contended resources. A pool is like a queue; jobs
    wait in the queue until they are ready. The canonical example is the printer spool,
    but the technique also applies to other slow peripheral devices. There may be
    multiple producers and a single consumer, with the producers writing each job
    to the spool faster than the consumer can perform that job. These techniques are
    used to accelerate IO by avoiding the need for processes to wait for slow IO devices.


    # 8.7 Further reading


    For a user-friendly introduction to interfacing devices with your Raspberry Pi,
    check out Molloy''s highly practical textbook [1] with its companion website.
    There are lots of ideas for projects involving small-scale hardware components,
    building up to a Linux module implementation task.


    The Linux Drivers textbook from O''Reilly presents a comprehensive view of IO
    and the Linux approach to device drivers [2]. The book is available online for
    free. Although it is fairly old, dealing with Linux kernel version 2.6, the concept
    coverage is wide-ranging and still highly relevant.


