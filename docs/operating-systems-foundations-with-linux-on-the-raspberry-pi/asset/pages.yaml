  md: 'However, there are two main reasons to put networking in the kernel:


    +   - If we do not do this, only a single process at a time could have access
    to the network card. by using the kernel network stack, we have the ability to
    run multiple network applications, servers as well as clients. Achieve the same
    result in user space is impossible because a process cannot preempt another process
    like the OS scheduler chan.


    +   - Furthermore, there is the issue of control over the incoming packets. Unlike
    other peripherals, which are typically an integral part of the system and entirely
    under control of the user, the NIC delivers data from unknown sources. If we would
    delegate the networking functionality to user space, then the kernel couldn''t
    act as the controller of the incoming (and outgoing) data.


    # 10.4 The OSI layer model


    Communication networks have traditionally been represented as layered models.
    In particular, the OSI (Open Systems Interconnection) reference model [8], officially
    the ITU standard X.200, is very widely known. A shown in Table 10.1, this model
    consists of seven layers. The protocol data unit (PDU) is information that is
    transmitted as a single unit among entities of a computer network.


    | Layer | Protocol data unit | Function |

    | --- | --- | --- |

    | Host layers | Application | Data | The sole means for the application process
    to access the OSI environment, i.e., all OSI services directly by the application
    process. |

    | | Presentation | | Representation of information communicated between computer
    systems. This could, for example, including encoding, compression, and encryption.
    |

    | | Session | | Control of the connections between computer systems. Responsible
    for session management, including checkpointing and recovery. |

    | | Transport | Segment, Datagram | Transparent transfer of data, including reliability,
    flow control, and error control. |

    | Media layers | Network | Packet | Functionality to transfer packets between
    computer systems. In practice, this means the routing protocol and the packet
    format. |

    | | Data link | Frame | Functionality to manage data link (i.e. node-to-node)
    connections between computer systems. |

    | | Physical | Symbol | Actual hardware enabling the communication between computer
    systems as raw bitstreams. |


    Table 10.1: OSI layer model.


    The upper layers, Application, Presentation, Session, and Transport, are known
    as the "Host layers." They are responsible for accurate and reliable data delivery
    between applications in computer systems. They are called "host" layers because
    their functionality is implemented—at least in principle—solely by the host systems,
    and the intermediate systems in the network do not need to'
