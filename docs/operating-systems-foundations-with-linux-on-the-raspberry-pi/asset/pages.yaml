  md: '# Operating Systems Foundations with Linux on the Raspberry Pi


    # Glossary of terms


    | Address space | A set of discrete memory addresses. The physical address space
    is the set of all the memory in a computer system, including the system memory
    (DRAM) as well as the I/O devices and other peripherals such as disks. |

    | Application binary interface (ABI) | The specifications to which an executable
    must conform in order to execute in a specific execution environment. |

    | Arithmetic logic unit (ALU) | The part of a processor that performs computations.
    |

    | Assembly language | A low-level programming language with a very strong correspondence
    between the program''s statements and the architecture''s machine code instructions,
    used as a target by compilers for higher-level languages. |

    | Atomic operation | An operation which is guaranteed to be isolated from interrupts,
    signals, concurrent processes, and threads. |

    | Booting | The process of starting up a computer system and putting it in a state
    that it can be used. |

    | Cache | A small but fast memory used to limit the time spent by the CPU waiting
    for main memory access. For every read operation, first the processor checks if
    the data is present in the cache, and if so (cache hit) it uses data rather than
    accessing the DRAM. Otherwise (cache miss) it will fetch the data from memory
    and store it in the cache. |

    | Cache coherency | In a multicore system with multiple caches, cache coherency
    (or cache coherence) is the mechanism that ensures changes in data are propagated
    throughout the memory system in a timely fashion so that all the caches of a resource
    have the same data. |

    | Clock tick | Informal synonym for clock cycle,, the term between two consecutive
    rising (positive) edges of the system clock signal. |

    | Complex instruction set computing (CISC) | A CPU with a large set of complex
    and specialized instructions rather a small set of simple and general instructions.
    The typical example is the x86 architecture. |

    | Concurrency | The fact that more one task is running concurrently (at the same
    time) on the system. In other words, concurrency is a property of the workload
    rather than the system, provided that the system has support for running more
    than one task at the same time. In practice, one of the key reasons to have an
    OS is to support concurrency through scheduling of tasks on a single shared CPU.
    |'
