  md: '# 10.7 Summary


    In this chapter, we have discussed why and how networking is implemented in the
    Linux kernel and provided an overview of the POSIX API for socket programming.
    We have provided examples of the most typical client and server functionality
    and discussed the different mechanisms a server can use to handle multiple clients.


    # 10.8 Exercises and questions


    # 10.8.1 Simple social networking


    +   1. Implement a minimal Twitter-like TCP/IP client-server system.


    +   - The client can send messages of 140 characters to one other client via a
    server.


    +   - Each client has an 8-character name.


    +   - Implement the server using select(), fork/exec, and pthreads.


    +   2. Add additional features:

    a) client discovery;

    b) ability to send to multiple clients.


    # 10.8.2 The Linux networking stack


    +   1. Discuss the structure of the Linux networking stack and the structure and
    role of the socket buffer datastructure.

    2. How does the Linux model differ from the OSI model?


