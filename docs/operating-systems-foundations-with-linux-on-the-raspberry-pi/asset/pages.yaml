  md: '# 6.5 Managing virtual address over-commitment


    Since a process virtual address space may be much larger than the available physical
    memory, it is possible to allocate more memory than the system contains. This
    supports the abstraction that the system appears to have more memory than is physically
    installed. Recall that each process has a separate virtual address space (VAS);
    all VASs are mapped onto a single physical address space. Memory over-commitment
    is managed by the OS.


    # 6.5.1 Swapping


    When the system has more pages allocated than there are frames available in physical
    memory, the OS has to swap pages out of RAM and into the backing storage. The
    Linux swap facility handles this overflow of memory. Swapping in Linux is often
    referred to as paging as in other OS capabilities.


    Swap space is persistent storage, generally orders of magnitude slower than RAM.
    Typical swap space is a file partition or a large file on the root file system.
    Check out /proc/swap to inspect swap facilities on your Raspberry Pi Linux device.
    The Raspian default swap facility is a single 100MB file in /var/swap.


    ```

    sudo hexdump -C /var/swap | less

    ```


    Examine to see what is stored in the swap container, although much of this data
    may be stale copies of old pages. Look for the SWAPSPACE magic header near the
    start of the file. In general, the swap file is divided into page-size slots.
    Note that swapping is not particularly common on Raspberry Pi since access latency
    to SD card storage is particularly high and frequent access can cause device corruption.


    In a page table, individual entries may be marked as swapped out. The pte_present()
    macro checks whether a page is resident in memory or swapped out to disk. The
    bitfield of the page table entry for a swapped page is shown in Figure 6.9, with
    distinct fields for the swap device number and the device-specific index.


    A process may execute when some of its pages are not resident in memory. However,
    the OS needs to handle the situation when the process tries to execute a memory
    access from a swapped out (non-resident) page. The next section describes this
    OS support for page faults.


