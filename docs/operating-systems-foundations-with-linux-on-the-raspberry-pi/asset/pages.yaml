  md: '# Operating Systems Foundations with Linux on the Raspberry Pi


    **Exclusive monitors** An exclusive monitor is a simple state machine, which must
    implement two sets of monitors, local and global (Figure 7.3). To support synchronization
    between processors, a system must implement local and global monitors. A Load-Exclusive
    operation updates the monitors to exclusive state. A Store-Exclusive operation
    accesses the monitor(s) to determine whether it can complete successfully. A Store-Exclusive
    can succeed if all accessed exclusive monitors are in the exclusive state.


    ![](img/17ca5177da1b1e15b2169f9c7932e5b6_189_0.png)


    Figure 7.3: Local and global monitors in a multi-core system (from [3]).


    The LDREX and STREX instructions are used by the Arm-specific Linux kernel code
    to implement the kernel-specific synchronization primitives which in turn are
    used to implement POSIX synchronization primitives. For example, include/asm/spin
    lock.h implements spin lock functionality for the Arm architecture, and this is
    used in the non-architecture-specific implementation in include/linux/spin lock.h.


