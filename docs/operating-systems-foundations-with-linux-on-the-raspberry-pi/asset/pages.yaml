    the smaller address maps, at the lower addresses. Each increment of 4 address
    bits results in a 16-fold increase in addressable space. The address space is
    partitioned in a repeatable way:


    8/16 DRAM;


    4/16 Mapped I/O;


    3/16 Reserved space;


    1/16 Previous memory map (i.e., without the additional 4 address bits).


    For example, the 36-bit address map contains the entire 32-bit address map in
    the lowest 4GB of address space.


    The address maps are partitioned into four types or regions:


    +   1. Static I/O and Static Memories, for register, mapped on-chip peripherals,
    boot ROMs, and scratch RAMs.


    +   2. Mapped I/O, for dynamically configured, memory-mapped busses, such as PCIe.


    +   3. DRAM, for main system dynamic memory.


    +   4. Reserved space, for future use.


    The "DRAM holes" mentioned in the Figure are an optional mechanism to simplify
    the decoding scheme when partitioning a large capacity DRAM device across the
    lower physically addressed regions, at the cost of leaving a small percentage
    of the address space unused.


