  md: '# Chapter 4 | Process management


    The thread_struct data structure is defined in the header file/arm/include/asm/processor.h.
    This is a small block of memory, referenced by task_struct, which stores more
    processor-specific context relating to fault events and debugging information.


    Each thread has its own unique instances of these three key data structures, although
    references to other metadata elements may be shared (e.g., for memory maps or
    open files, recall the earlier discussion of the clone system call). Figure 4.7
    shows a schematic diagram of these per-thread data structures and their relationships.


    ![](img/17ca5177da1b1e15b2169f9c7932e5b6_102_0.png)


    Figure 4.7: Runtime layout of Linux data structures that encapsulate process metadata,
    residing in kernel memory space.


    When a process starts, its process identifier (PID) has the same integer value
    as its thread group identifier (TGID). If the process creates a new thread, then
    the new thread shares the original process address space. The new thread acquires
    its own PID but retains the original TGID.


    As we will see in the next chapter, the Linux scheduler handles all threads in
    a process as separate items: in other words, a thread is a kernel-visible schedulable
    execution entity, but a process is a user-visible execution context. Process tools
    generally merge multiple threads that share a TGID into a single process.


    # 4.3.3 Process hierarchies


    Every process p has a parent, which is the process created p. The initial system
    process is the ancestor of all processes. In Linux, this is the init process,
    which has pid 1. The global variable init_task contains a pointer to the init
    process'' task_struct.


    There are two ways to iterate over processes:


    +   1. Chase the linked list of pointers from one process to the next. This circular
    doubly-linked list runs through the processes. Each task_struct instance has a
    next and prev pointer. The macro for_each_process iterates all tasks.'
