  md: 'Linux distributions. One example is Alpine Linux, which has a minimal installation
    footprint of around 100MB. Reduced runtime memory requirements are supported by
    a specialized C library, such as must!, and monolithic executables that provide
    a range of Unix utilities, e.g., busybox.


    ![](img/17ca5177da1b1e15b2169f9c7932e5b6_308_0.png)


    **Figure 11.1:** Chromebook running a Linux variant on an Arm chipset. Photo by
    author.


    There is a logical progression in this trend to consolidate OS kernel, libraries,
    and application into a single monolithic image. If the user knows ahead-of-the-precise
    system use-cases, then it is feasible to eliminate large portions of the OS and
    libraries from the build, since they will never be required. This *unikernel*
    concept, exemplified by MirageOS, which performs aggressive and dead code elimination
    to produce slim binaries for deployment.


    # # 11.3 Scaling up


    Linux is the default OS for supercomputers. Since 2017, all machines in the TOP500
    list of most powerful supercomputers in the world run Linux.


    Generally, high-performance computing tasks are handled via a parallel framework
    such as MPI (see Section 7.6.3). Work is divided into small units to execute on
    the various nodes. Each shared-memory node runs Linux individually, so a supercomputer
    may have tens of thousands of Linux kernels running concurrently. The Archer facility
    at the Edinburgh Parallel Computing Centre, sees Figure 11.2, incorporates 4920
    nodes.


    Largely, large-scale datacenters may have hundreds of thousands of nodes, each
    running a Linux image with higher-level control software, such as OpenStack, to
    make effective resource management. This is warehouse-scale computing, a phrase
    appropriately coined by Google engineers [1].'
