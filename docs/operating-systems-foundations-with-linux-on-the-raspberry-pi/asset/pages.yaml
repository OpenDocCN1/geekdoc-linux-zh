  md: "# Searching for a value in a rtree\n\nWriting a search function for your tree\
    \ is fairly straightforward: start at the root, compare each value, and follow\
    \ the left or right branch as necessary.\n\nExample:\n\n```\nListing 5.8.21- Search\
    \ function for rtree\n```c\nstruct mytype *my_search(struct rb_root *root, char\
    \ *string)\n{\n    struct rb_node *node = root->rb_node;\n\n    while (node) {\n\
    \        struct mytype *data = container_of(node, struct mytype, node);\n    \
    \    int result;\n\n        result = strcmp(string, data->keystring);\\n\n   \
    \     if (result < 0)\n            node = node->rb_left;\n        else if (result\
    \ > 0)\n            node = node->rb_right;\n        else\n            return data;\n\
    \    }\n    return NULL;\n}\n```\n```\n\nInserting data into a rtree\nInserting\
    \ data in the tree involves first searching for the place to insert the new node,\
    \ then inserting the node and rebalancing (“recoloring”) the tree. The search\
    \ for insertion differs from the previous search by finding the location of the\
    \ pointer on which to graft the new node. The new node also needs a link to its\
    \ parent node for rebalancing purposes.\n\nExample:\n\n```\nListing 5.8.22- Insertion\
    \ in rtree\n```c\nint my_insert(struct rb_root *root, struct mytype *data)\n{\n\
    \    struct rb_node **new = &(root->rb_node), *parent = NULL;\n\n    /* Figure\
    \ out to put new node */\n    while (*new) {\n        struct mytype *this = container_of(*new,\
    \ struct mytype, node);\n        int result = strcmp(data->keystring, this->keystring);\n\
    \n        parent = *new;\n        if (result < 0)\n            new = &(*new)->rb_left);\n\
    \        else if (result > 0)\n            new = &(*new)->rb_right);\n       \
    \ else\n            return FALSE;\n    }\n\n/* Add new node and rebalance tree.\
    \ */\n```\n```"
