    # Futexes


    As discussed in Section 7.3.3, a mutex is a binary semaphore. A futex is a "fast
    user-space mutex," a Linux-specific implementation of mutexes optimized for performance
    for the case when there is no contention for resources.


    A futex (implemented in kernel/futex.c) is identified by a user-space address
    which can be shared between processes or threads. A basic futex has semaphore
    semantics: it is a 4-byte integer counter that can be incremented and decremented
    atomically; processes can share this integer using mmap(2), via shared memory
    segments, or - if they are threads - they share memory.


    As the name suggests, futex occurs entirely in user space for the non-contended
    case. The kernel is only invoked when the lock is owned and another process tries
    to acquire it; the lock is marked with a value that says "waiting," and the syt_futex
    (FUTEX_WAIT) syscall is used to wait for the process to release it. The kernel
    creates a futex queue internally so that it can, later, match up the waiter with
    the waiter - without them having to know about each other. When the owner releases
    the futex, it notices (via the variable name) and sends the sya_futex (FUTEX_WAKE)
    syscall to wake them up. Once all waiters have taken and released the lock, the
    futex is back to the uncontended state. At that point there is no in-kernel state
    associated with it, i.e., the kernel has no memory of the futex at address. This
    makes futexes very lightweight and scalable.


    Originally futexes, as described above, were used to implement POSIX threads.
    However, the current design is significantly complicated due to the need to handle
    crashes. When a process crashes, it can''t clean the mutex, but the kernel can''t
    do it because it has no memory of the futex. The changes required to address this
    issue are described in the kernel documentation in robust-futexes.txt.


    # Kernel mutexes


    The kernel also has its own mutex implementation (mutex.h), which is intended
    for kernel-use (where the futex is designed for user-space programs). As usual,
    the kernel documentation (mutex-design.txt) is the canonical reference. Here we
    summarize the key points of the implementation. The mutex consists of the following:


    Listing 7.3.18. Kernel mutex struct


    ```

    1 struct mutex {

    2   atomic_long t owner;

    3   spin_lock wait_lock;

    4   struct optimistic_spin_queue osq; // Spinner MCS lock *

    5   struct list_head wait_list;

    6 };

    ```


    The kernel uses a three-state atomic counter to represent the different possible
    transitions that can occur during the lifetime of a lock: 1: unlocked; 0: locked,
    no waiters; <0: locked, with potential waiters'
