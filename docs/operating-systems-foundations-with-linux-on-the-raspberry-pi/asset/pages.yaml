    The second approach is the traditional Unix hierarchical block map structure.
    This is the same as earlier ext2 and ext3 file systems. The 60 bytes of location
    are split into 15 4-byte pointers to logical block addresses. The first 12 pointers
    are direct pointers to the first 12 blocks of the file data. The next pointer
    is a single indirect pointer; it points to a block containing a table of pointers
    to subsequent data blocks for the file. Conventionally, the block size is 4KB,
    and each pointer is 4B, it is possible to have 1K pointers in the single indirect
    block. The next pointer is to a double indirect pointer, and the final pointer
    is to a triple indirect pointer. In total, this allows us to address over 1 billion
    blocks, making for a maximum file size of over 4TB. Figure 9.13 illustrates this
    structure schematically, showing pointers up to the second level of indirect node.
    Note that the tables of pointers, for indirect blocks, are stored in data blocks,
    rather than in the inode table.


