  md: '# Operating Systems Foundations on Linux on the Raspberry Pi


    # 9.12.2 Construct a Mini File System using FAT


    The best way to understand how a file system works is to construct one for yourself.
    In this practical, we will programmatically build a disk image for a simple FAT16
    file system, then mount the image file on a Raspberry Pi system and interact with
    it.


    The Python program shown below will create a blank file system image. Read through
    this source code to understand the metadata details required for specifying a
    FAT file system.


    ![](img/17ca5177da1b1e15b2169f9c7932e5b6_265_0.png)


    ```

    # create a binary file

    f = open(''fatexample.img'', ''wb'')


    ###### BOOT SECTOR, 512B

    # first 3 bytes of boot sector are ''magic value''

    f.write(bytearray([0x55, 0xAA,]))


    # next 8 bytes are manufacturer name, in ASCII

    f.write(b''TEXTBOOK''.encode(''ascii''))


    # next 2 bytes are bytes per block - 512 is standard

    # this is in little endian format - so 0x0200 is 512

    f.write(bytearray([0x00, 0x02]))


    # next 1 byte, number of blocks per allocation unit - say 1

    # An allocation unit == Cluster in FAT terminology

    f.write(bytearray([0x01]))


    # next 2 bytes, number of reserved blocks

    # say 1 for boot sector only

    f.write(bytearray([0x01, 0x00]))


    # next byte, number of File Allocation tables - can have multiple

    # tables for redundancy - we''ll stick with 1 for now

    f.write(bytearray([0x01]))


    # next 2 bytes, number of root directory entries - including blanks

    # let''s say 16 files for now, so root dir is contained in single block

    f.write(bytearray([0x10, 0x00]))


    # next 2 bytes, number of blocks in the entire disk - we want a 4 MB disk,

    # so need 8192 0.5 kb blocks == 2^13 = 0x0200

    f.write(bytearray([0x00, 0x02]))


    # single byte media descriptor - magic value 0xf8

    f.write(bytearray([0xf8]))\n

    # next 2 bytes, number of blocks for FAT

    # FAT16 needs 2 bytes per block, so we have 8192 blocks on disk

    # 512 bytes per block - i.e. can store FAT metadata for 256 blocks in

    # a single block, so need 8192/256 blocks == 2^13 / 2^8 = 2^5 = 32

    f.write(bytearray([0x20, 0x00]))

    ```


