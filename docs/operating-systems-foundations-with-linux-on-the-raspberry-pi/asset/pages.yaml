- img_proc: true
  md: '# 2.3.3 Boot process stage 3: Load the kernel into memory


    **Stage 3** is controlled by start.elf, which is a closed-source ELF-format binary
    running on the GPU.


    start.elf loads the compressed Linux binary kernel.img and copies it to memory.
    It reads config.txt, cmdline.txt and bcm2710-rpi-3-b.dtb (Device Tree Binary).


    The file.txt is a text file containing system configuration parameters which would
    on a conventional PC be edited and stored using a BIOS.


    The cmdline.txt contains the command line arguments to be passed to the Linux
    kernel (e.g., the file system type and location of the root file system) using
    ATAGs, and the .dtb contains the Device Tree Blob.


    # 2.3.4 Boot process stage 4: Start the kernel!


    **Stage 4** starts on the CPU: releasing reset on the CPU causes it to run from
    the address where the kernel.img data was written. The kernel runs Arm-specific
    code to populate CPU registers and turn on the cache, then decompresses itself,
    and runs the decompressed kernel code. The kernel initializes the MMU using Arm-specific
    code and then runs the rest of kernel code which is processor-independent.


    # 2.3.5 Boot process stage 5: Run the processor-independent kernel code


    **Stage 5** is the processor-independent kernel code. This code consists mainly
    of initialization functions to set up interrupts, perform further memory configuration,
    and load the RAM disk initramfs.


    This is a complete set of directories that you would find on a normal root file
    system and was loaded into memory by the Stage 3 boot loader. It is copied into
    kernel space and mounted. This initramfs as a temporary root file system in RAM
    and allows the kernel to fully boot and perform user-space operations without
    having any physical disks.


    A Linux kernel image can run on multiple platforms for a large number of devices/peripherals.
    To reduce the overhead of loading and running a kernel binary support for features
    that are not used widely, Linux supports runtime loading of components (modules)
    that are not needed during early boot. Since the necessary modules needed to interface
    with peripherals can be part of the initramfs, the kernel can be very small, but
    still, support a large number of possible hardware configurations. After the kernel
    is booted, the initramfs root file system is unmounted, and the real root file
    system is mounted. Finally, the init function is started, which is the first user-space
    process. After this, the task started, and the scheduler starts operation.


    # 2.3.6 Initialization


    After the kernel has booted it launches the first process, called *init*. This
    process is the parent of all other processes. In the Raspian distribution that
    runs on the Raspberry Pi 3, this *init* is actually an alias for /lib/systemd/systemd
    because Raspian, as a Debian-derived distribution, uses systemd as its init. Other
    Linux distributions can have different implementations of init, e.g., SysV init
    or upstart.'
