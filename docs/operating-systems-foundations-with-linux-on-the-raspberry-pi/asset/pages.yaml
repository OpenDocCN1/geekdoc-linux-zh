  md: '# Operating Systems Foundations with Linux on the Raspberry Pi


    # 3.4.3 System timer


    The Cortex-A53 implements the Arm Generic Timer architecture [6]. The Generic
    Timer can schedule events and trigger interrupts based on an incrementing counter
    value. It provides:


    +   - Generation of timer events as interrupt outputs.

    - Generation of event streams.


    The Generic Timer can schedule events and trigger interrupts based on an incrementing
    counter. It provides a system counter that measures the passing of time in real-time
    but also supports virtual counters that measure the passing of virtual-time, i.e.,
    the "equivalent real-time" on a Virtual Machine.


    The Cortex-A53 processor provides a set of timer registers within each core of
    the cluster. The timers are:


    +   - An EL1 Non-secure physical timer.

    - An EL1 Secure physical timer.

    - An EL2 physical timer.

    - A virtual timer.


    The Cortex-A53 processor does not include the system counter. This resides in
    the SoC. The system counter value is distributed to the Cortex-A53 processor with
    a synchronous binary encoded 64-bit bus. For more details, we refer to the Technical
    Reference Manual [4].


    # 3.4.4 Processor mode and privileges


    In terms of privileges, the Cortex-A53 defines the Armv8 exception model, with
    four Exception levels, ELO-EL3, that provide an execution privilege hierarchy:


    +   - EL0 has the lowest software execution privilege, and execution at ELO is
    called unprivileged execution.

    - Increased values of n, from 1 to 3, indicate increased software execution privilege.
    The OS would run in EL1.

    - EL2 provides support for processor virtualization.

    - EL3 provides support for two security states, as part of the TrustZone architecture.


    +   - In Secure state, the processor can access both the Secure and the Non-secure
    memory address space. When executing at EL3, it can access all the system control
    resources.

    - In Non-secure state, the processor can access only the Non-secure memory address
    space and cannot access the Secure system control resources.'
