  md: '# Chapter 4 | Process management


    The most basic metadata is the unique, positive integer identifier associated
    with a process, conventionally known as the process pid. Some metadata is related
    to context saved data, such as register values, open file handles, or memory configuration.
    This information enables the process to resume execution after it has been suspended
    by the OS. Further metadata relates to the interactions between a process and
    the OS–e.g., profiling statistics and scheduling details. Figure 4.6 shows a high-level
    schematic diagram of the metadata stored in a process control block.


    ![](img/17ca5177da1b1e15b2169f9c7932e5b6_100_0.png)


    Figure 4.6: Generic OS management metadata required for each process, stored in
    a per-process data structure known as the process control block.


    # 4.3.1 The /proc file system


    The Linux kernel exposes some process metadata as part of a virtual file system.
    Let’s look in the /proc directory on your Linux system:


    > Listing 4.3.1: The /proc file system


    +   1 /proc

    2 ls


    You should see a list of directories, many of which will have names that are integers.
    Each integer corresponds to a pid, and the files inside this pid directories capture
    information about the relevant process.


    | cmdline | The textual command that was invoked to start this process |

    | cwd | A symbolic link to the current working directory for this process |

    | exe | A symbolic link to the executable file for this process |

    | fd/ | A folder containing file descriptors for each file opened by the process
    |

    | maps | A table showing how data is arranged in memory |

    | stat | A list of counters for various OS events, specific to this process |


    Table 4.1: Virtual files associated with a process in /proc/[pid]/.


    75'
