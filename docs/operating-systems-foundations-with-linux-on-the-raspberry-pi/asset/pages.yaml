    # 5.7.1 First-come, first-served (FCFS)


    This is a very simple scheduling policy where the attribute deciding its priority
    is simply its relative arrival time in the list of runnable tasks. In this context,
    this lists is a FIFO queue called the run queue. The scheduler takes the head
    of the queue and runs it on the CPU until it finishes or is interrupted by a system
    call and moves it to the waiting. When the tasks have finished waiting, it will
    be re-added at the tail of the run queue. FCFS scheduling can either be preemptive
    or non-preemptive, as illustrated in Figures 5.2 and 5.3.


