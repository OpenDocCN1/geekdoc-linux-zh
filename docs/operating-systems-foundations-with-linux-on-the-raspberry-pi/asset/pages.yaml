  md: "To start iterating, call rb_first() or rb_last() with a pointer to the root\
    \ of the tree, which will return a pointer to the node structure contained in\
    \ the first or last element in the tree. To continue, fetch the next or previous\
    \ node by calling rb_next() or rb_prev() on the current node. This will return\
    \ NULL when there are no more nodes.\n\nThe iterator functions return a pointer\
    \ to the embedded rb_node, from which the containing data structure may be accessed\
    \ via the container_of() macro, and individual members may be accessed directly\
    \ via rb_entry(node, type, member).\n\nExample:\n\n![](img/17ca5177da1b1e15b2169f9c7932e5b6_144_0.png)\n\
    \n```\nstruct rb_node *node;\nfor (node = rb_first(mtree); node; node = rb_next(node))\n\
    \    printf(\"key:%s\\n\", rb_entry(node, struct mytype)->keystring);\n```\n\n\
    # Cached rbtrees\n\nAn interesting feature of the Linux implementation of the\
    \ red-black tree is caching. Because computing the leftmost (smallest) node in\
    \ a red-black tree is quite a common task, the cached rbtree rb_root_cached can\
    \ be used to optimize O(logN) rb_first() calls to an O(1) simple pointer fetch,\
    \ avoiding potentially expensive tree iterations. The runtime overhead for maintenance\
    \ is negligible, and the memory footprint is only slightly larger: a cached rbtree\
    \ is a regular rb_root with an extra pointer to cache the leftmost node. Consequently,\
    \ any occurrence of rb_root can be substituted by rb_root_cached.\n\n# 5.8.9 Linux\
    \ scheduling commands and API\n\nThere are a number of commands that allows users\
    \ to set and change process priorities for both normal and real tasks.\n\n# Normal\
    \ processes\n\nThe nice command allows the user to set the priority of the process\
    \ to be executed:\n\n![](img/17ca5177da1b1e15b2169f9c7932e5b6_144_1.png)\n\n```\n\
    $ nice -n 12 command\n```\n\nThe renice command allows to change the priority\
    \ of a running process:\n\n![](img/17ca5177da1b1e15b2169f9c7932e5b6_144_2.png)\n\
    \n```\n$ renice -n 15 -p pid\n```\n\nRemember that nice values range from -20\
    \ to 19 and lower nice values correspond to higher priority. So, -12 has a higher\
    \ priority than 12. The default nice value is 0. Regular users can set lower priorities\
    \ (positive nice values). superuser privileges are required."
