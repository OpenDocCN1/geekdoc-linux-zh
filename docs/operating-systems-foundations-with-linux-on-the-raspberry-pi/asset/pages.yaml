  md: '# Operating Systems Foundations on Linux on the Raspberry Pi


    For a process to execute effectively, the RSS should be at least large as the
    working set size (WSS). Linux does not measure WSS directly; however, third-party
    scripts are available to estimate process WSS, e.g., consult http://www.brandandregg.com/wss.html


    # 6.5.4 In-memory caches


    Physical memory frames that are not being used to store page pages could be used
    effectively by the OS for other processes, such as caching data. Linux features
    several kinds of in-memory caches that use these free frames.


    The file system page cache stores page-sized chunks of files in memory, after
    they are first touched. The OS reads ahead, to load portions of the file into
    memory in anticipation of future accesses. The fadvise function allows the process
    to specify how the file will be accessed. The page cache is the reason why subsequent
    accesses to a file generally take much less time than the initial access.


    The swap cache keeps track of which physical frames have been written out to a
    swap file. This is highly useful for pages shared between multiple processes,
    for example. Once a page has been written out to the swap, the next time the data
    remains in the swap slot. If this page is not modified after regaining memory
    residence, and then at some later stage it is swapped out again, we can avoid
    the writeback if it has not been modified since the last swap. The swap file records
    where the page lives in swap, so we can record this in the relevant page entry.
    On the other hand, if the page is modified in memory, then its swap cache is expunged
    because the page becomes dirty and must be written back. This swap cache may feature
    unnecessary swap file writes.


    The buffer cache is used to optimize access to block devices (see later on I/O).
    Since read and write operations are expensive for slow block devices, the buffer
    cache intercepts these accesses to reduce I/O latency. For instance, individual
    writes from a collection of processes could be batched up for a block device.
    A buffer cache will record blocks of data that have been read from or written
    to a device.


    We can use commands free -h or vmstat -s to inspect how the Raspberry Pi physical
    RAM is allocated between process pages, OS buffers, page cache, etc. Ideally,
    all unused frames in a system would be occupied by buffers and caches, since this
    is preferable to underutilizing physical RAM. Then the caches shrink when the
    process requirements increase as more processes are admitted.


    # 6.5.5 Page replacement policies


    The kernel swap daemon is a background process that commences running after kernel
    initialization.


    ```

    ps -eo kswapd

    ```


    Invoke to see this daemon running on your Pi. The responsibility of kswapd is
    to swap out pages that are not currently needed. This serves to maintain a set
    of free frames that are available for newly allocated or swapped in pages.'
