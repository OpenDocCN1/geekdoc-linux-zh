    # 9.17 Exercises and questions


    # 9.17.1 Hybrid Contiguous and linked file system


    Consider a block-structured file system where the first N blocks of a file are
    arranged contiguously, and then subsequent blocks are linked together in a linked
    list data structure (like FAT). What are the advantages of this file system organization?
    What are the potential disadvantages?


    # 9.17.2 Extra FAT pointers


    Consider a linked file system, like FAT. The directory entry for each file has
    a single pointer to the first block of the file. Why might it be a good idea to
    keep a second pointer, to the final block of the file? Which operations would
    have their efficiency improved?


    Imagine a FAT style system with doubly linked lists, i.e., each FAT entry has
    pointers to both the next and previous blocks. Would this improve seek times,
    in general? Do you think the space overhead is acceptable?


    # 9.17.3 Expected file size


    Inspect your ext4 root system. See how much space is available on it with df -h.
    Then see how many inodes are free with df -i. Use these to calculate the expected
    space to be occupied by each future file, assuming a single inode per file (i.e.,
    multiple links).


    # 9.17.4 Ext4 extents


    This question concerns the relative merits of ext4 style extents in comparison
    to traditional block mapping. Creating and writing data to an N-block file, where
    the data blocks are laid out contiguously on disk. How many bytes would need to
    be written for extent-based location metadata? When might a block map index be
    more efficient than extent-based metadata?


    # 9.17.5 Access times


    Create a RAM disk, using the commands outlined above. Now plug in a USB drive.
    Compare the write times for both devices, by writing a 100MB file of random data
    to them. Use the dd command from source /dev/random. Which device has lower latency,
    and why? You might also compare these times with 100MB to your Pi SD card.'
