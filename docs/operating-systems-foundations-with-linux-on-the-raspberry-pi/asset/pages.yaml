  md: '# Operating Systems Foundations with Linux on the Raspberry Pi


    #  2.2.3 User space and kernel space


    The terms ''user space'' and ''kernel space'' are used mainly to indicate process
    execution with different privileges. As we have seen in Chapter 1, the kernel
    code can access all hardware and memory in the system, but for user processes,
    the access is much more restricted. When we use the term ''kernel space'', we
    mean the memory space accessible by the kernel, which is effectively the complete
    memory space in the system¹. By ''user space'', we mean the memory accessible
    by a user process. Most operating systems support multiple users, and each user
    can run multiple processes. Typically, each process gets its own memory space,
    but processes belonging to a single user can share memory (in which case we call
    them threads).


    #  2.2.4 Device tree and ATAGs


    The Linux kernel needs information about the system on it runs. Although a kernel
    binary must be compiled for a target architecture (e.g., Arm), a kernel binary
    must be able to run on a wide variety of platforms for this architecture. This
    means that the kernel needs to be provided with information about the hardware
    at boot time, e.g., CPUs, amount of memory, location of memory, devices and their
    location in the memory map, e.g. The traditional way to do this on Arm systems
    using a format called ATAGs, which provided a data structure in the kernel that
    would be populated with information that the bootloader provides. A more modern
    and flexible approach is called Device Tree². It defines a format syntax to describe
    hardware in a Device Tree Source file. A device tree is a data structure with
    nodes that describe the physical devices in a system. The Device Tree source files
    can be compiled by a special compiler into a machine-architecture-independent
    binary format called Device Tree Blob.


    #  2.2.5 Files and persistent storage


    The Linux Information Project defines a file as:


    A file is a collection of related data that appears to the user as a single, contiguous
    block of information and is retained in storage.³


    In this definition, storage refers to computer devices or media which can retain
    data for relatively long periods (e.g., years or decades), as solid state drives
    and other types of non-volatile memory, magnetic hard disk drives (HDDs), CDROMs
    and magnetic tape, in other words, persistent storage. This is in contrast with
    RAM memory, the content of which is retained only temporarily (i.e., only while
    in use or while the power supply remains on).


    A persistent storage medium (which I will call ''disk'') such as an SD card, USB
    memory stick or hard disk, stores data in a linear fashion with sequential access.
    However, in practice, the disk does not contain a single array of bytes. Instead,
    it is organized using partitions and file systems. We discuss these in more detail
    in Chapter 9, but below is a summary of these concepts.


    # Partition


    A disk is divided into partitions, which instead of presenting as a single blob
    of data, it presents several different blobs. Partitions are logical rather than
    physical, and the information about how the disk is partitioned (i.e., the location,
    size, type, name, and attributes of each partition) is stored in a partition table.
    There are several standards for the structure of partitions and partition tables,
    e.g., GUID Partition Table and MBR.


    > ¹ Assuming the system does not run a kernel. Otherwise, it is the memory accessible
    to the Virtual Machine running the kernel.


    > ² http://www.linux.org/file.html


    > ³ https://www.devicree.org/specifications'
