  md: '# Chapter 10 | Networking


    Essentially, an sk_buff combines a control structure with a block of memory. Two
    main sets of functions are provided in the sk_buff library: the first set consists
    of routines to manipulate doubly linked lists of sk_bufs; the second set of functions
    for controlling the attached memory. The buffers are stored in linked lists optimized
    for the common network operations of append to end and remove from start. In practice,
    the structure is quite complicated (the complete struct comprises 66 fields).
    Figure 10.3 shows a simplified diagram of the sk_buff struct.


    # 10.6 The POSIX socket interface library


    In this section, we present some of the most useful POSIX socket interface library
    functions and the related internet data types and constants. The selection focuses
    on IPv4 TCP stream sockets.


    # 10.6.1 Stream socket (TCP) communications flow


    The Transmission Control Protocol is a core protocol in the TCP/IP stack and implements
    one of the two transport layer (OSI layer 4) protocols (the other being UDP, the
    Datagram Protocol). All incoming IP network packets are marked with the TCP identifier
    in the IP protocol header and all outgoing TCP packets are passed down to the
    IP layer for sending. In turn, TCP is responsible for identifying the (16-bit)
    port number from the TCP packet header and forwarding the TCP packet payload to
    any active socket with the specified port number.


    TCP is reliable and connection-oriented and as employs variousにつき activities in
    the background between the TCP layers in the communicating nodes to handle the
    setup, reliability control and shutdown of the TCP connection. The socket API
    provides a simplified programming model for the TCP to application interface,
    and the connected stream sockets can be considered the communication endpoints
    of a virtual circuit between two processes.


    To establish a socket connection, one of the communicating processes (the server)
    needs to be actively waiting for a connection on an active socket and the other
    process (the client) can then request a connection and if successful the connection
    is made. The timeline of the various socket library function calls in a typical
    (simple) stream socket connection is shown below:


    | Server timeline | Client timeline | Description |

    |---|---|--|

    | 1. Socket(..) | | Server creates a socket file descriptor |

    | 2. Setsockopt(..) | | Configure socket protocol options (1 call per option)
    |

    | 3. Bind(..) | | Associate the server socket with a predefined local port number
    |

    | 4. Listen(..) | | Allow client connections on the server socket |

    | 5. Accept(..) | | Wait for client connection request |

    | | 1. Socket(..) | Client creates a socket file descriptor |

    | | 2. Connect(..) | Client requests connection to the server socket |

    | 6. Recv(..)/send(..) | 3. Recv(..)/send(..) | Client/Server data communications
    |

    | 7. Close(..) | 4. Close(..) | Either process can close the stream socket connection
    first |'
