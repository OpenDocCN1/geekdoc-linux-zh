  md: '# 5.8 Earliest deadline first (EDF)


    The Linux kernel supports both types of real-time scheduling. For soft real-time
    scheduling, it uses Round-Robin or FIFO. For hard real-time scheduling, it uses
    an algorithm known as Earliest Deadline First (EDF). This is a dynamic priority-driven
    scheduling algorithm for periodic tasks, i.e., tasks that periodically need some
    work to be done. This periodic activity is usually called a job. The period and
    the deadline for the jobs of each task must be known.


    The job queue is ordered by the earliest deadline of the jobs. To compute this,
    the scheduler must be aware of the period of each task, the phase differences
    between those periods and the execution times and deadlines for each job. Usually,
    the deadline is the same as the period, i.e., a job for a given task must finish
    within one period. In that case, each task can be described by a tuple (phase,
    period, execution time).


    Algorithm 5.1 EDF for example tasks T1 = (0,2,1), T2 = (0,5,2.5)


    | Time | Ready to Run | Scheduled |

    |---|---|---|

    | 0 | J1[1,2]; J2,1[5] | J1,2 |

    | 1 | J1[2,4]; J2,1[5] | J2,1 |

    | 2 | J2[2,1] | J1,2 |

    | 3 | J2[1,5]; J1,3[6] | J2,1 |

    | 4.5 | J1[3,6] | J1,3 |

    | 5.5 | J1[3,6]; J2[2,10] | J1,3 |

    | 6 | J1[4,8]; J2[2,10] | J1,4 |

    | 7 | J2[2,10] | J2,2 |

    | 8 | J1[5,10]; J2[2,10] | J1,5 |

    | 9 | J2[2,10] | J2,2 |


    For example, consider a system with two tasks which both started at time t=0,
    so the phase is 0 for both. T1 has a period of 2 and an execution time of 1; T2
    has a period of 5 and an execution time of 2.5:


    > T1 = (0 , 2 , 1)

    T2 = (0 , 5 , 2. 5)


    In other words, both tasks are active half of the time, so in principle together,
    they will use the CPU 100%. Because the tasks are periodic, it is sufficient to
    calculate a schedule for the least common multiple of the periods of T1 and T2,
    in this task 2*10. The schedule is shown below. This is an important property
    of EDF: it guarantees that all deadlines are met provided that the total CPU utilization
    is not more than 100%. In other words, it is always possible to create a valid
    schedule.


    # 5.8 Scheduling in the Linux kernel


    The Linux kernel supports two categories of scheduling, normal and real-time.
    A good explanation is provided in the sched(7) man page. With regards to scheduling,
    the thread is the main abstraction, i.e., the scheduler schedules threads rather
    than processes.


    Each thread has an associated scheduling policy and a static scheduling priority.
