  md: '# 1.4.6 Caching


    In an actual system, accessing DRAM memory requires many clock cycles. To limit
    the time spent waiting for memory access, processors have a cache, a small but
    fast memory. For every memory read operation, the first processor checks if the
    data is present in the cache, and if so (this is called a ''cache hit'') it uses
    data rather than accessing the DRAM. Otherwise (''cache miss'') it will fetch
    the data from memory and store it in the cache.


    For a single-core processor, memory write operations are treated in the same way.
    Real-life caches are very complicated and will be discussed in more detail in
    Chapters 3 ''Hardware architecture'' and 6 ''Memory management''. Here we will
    create a simple conceptual model of a cache to illustrate the key points.


    First of all, as a cache is limited in size, how do we store portions of the DRAM
    content in it? Like the other memories, we will model the storage part of the
    cache as an array of fixed size. So if we want to store data in the cache, we
    find a free location and copy the data into it. At some point, the data will be
    removed from the cache, freeing up this location. We need a data structure, e.g.,
    a stack to keep track of the free locations.


    So what happens when the cache is full (so the stack is empty)? We need to free
    space by evicting data from the cache. As we will see in Chapter 6 ''Memory management'',
    there are several different policies to do this. The simplest one (but certainly
    not the best) is to evict data from the most recently used location because all
    requires that we keep track of that single location. When we evict data from the
    cache, it needs to be written back to the DRAM memory. Conversely, the data that
    we put into the cache must not only keep track of the data but also its original
    address. In other words, we need a lookup between the address and the corresponding
    address. In Python, we can use a dictionary for this, a data structure that associates
    keys with values. A cache which behaves like a dictionary - in that it allows
    us to store any address at any cache location - is ''fully associative''.


    In Python, we can write such a cache model as follows:


    ![](img/17ca5177da1b1e15b2169f9c7932e5b6_40_0.png)


    ```

    # Initialise the cache

    def init_cache():

    # Cache of size CACHE_SZ

    cache_storage=[]

    location_stack=range(0, CACHE_SZ)

    location_stack_ptr=CACHE_SZ

    last_used_loc = location_stack[location_stack_ptr]

    location_stack = location_stack[location_storage,location_stack_ptr,last_used_loc)

    address_to_loc={}

    cache_loc_to_address={}

    cache_lookup=(address_to_cache_loc,cache_loc_to_address,location_stack)

    return cache


    # Some helper functions

    def get_next_free(location_stack):

    (location_stack,location_storage,location_stack_ptr,last_used_loc) = location_stack

    loc = location_storage[location_stack_ptr]

    location_stack_ptr-=1

    ```'
