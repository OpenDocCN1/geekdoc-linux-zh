    The L1 data cache supports only a Write-Back policy (remember from Chapter 1,
    this means that initial writes are to the cache, and write back to memory only
    occurs on eviction of the cache). Normally it*allocates* a cache line on either
    a read miss or a write miss (i.e., both write-allocate and re-allocate). A special
    feature of the L1 data cache is that it includes logic to switch into pure read
    allocate mode for certain scenarios. When in read allocate mode, loads behave
    as normal, and writes still look up in the cache, but if miss, they write out
    to L2 only.


    The L1 data cache uses physical memory addresses. The micro TLB produces the physical
    address from the virtual address before performing the cache access.


    # L2 Cache


    The L2 cache is a unified cache shared by all cores, with a configurable cache
    size of 128KB, 256KB, 512KB, 1MB, 2MB. The Raspberry Pi 3 configuration is 512KB.


    Data is allocated to the L2 cache only when evicted from the L1 memory system,
    not first fetched from the system. Instructions are allocated to the L2 cache
    when fetched from the system and can be invalidated during maintenance operations.


    The L2 cache has the following key features:


    +   - Cache line size of 64 bytes.


    +   - 16-way set-associative cache structure;


    +   - Uses physical addresses.'
