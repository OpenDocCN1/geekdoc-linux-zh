  md: '# Chapter 6 | Memory management


    Next-generation systems may feature non-volatile memory (NV-RAM). Whereas conventional
    volatile RAM loses its data when the machine is powered down, NV-RAM persists
    data (like flash drives or hard disks, with faster access times). NV-RAM is byte-addressable
    and offers significant new features for OSs, as immediate restart of processes
    or entire systems, and full persistence for in-memory databases.


