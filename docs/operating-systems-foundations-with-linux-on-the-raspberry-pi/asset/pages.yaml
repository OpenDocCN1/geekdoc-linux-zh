  md: '# Operating Systems Foundations with Linux on the Raspberry Pi


    Table 4.1 lists a few of these files and the information they contain. For the
    full list, execute man 5 proc at a Linux terminal. The /proc/[pid] files are not
    ''real''--look at the file sizes with is -1. These pseudo-files are not stored
    on the persistent file system instead; they are file-like representations of in-memory
    kernel metadata for each process.


    Let''s list the commands that all the processes in our system are executing:


    ![](img/17ca5177da1b1e15b2169f9c7932e5b6_101_0.png)


    ```

    cd /proc

