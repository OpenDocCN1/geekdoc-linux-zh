    Figure 3.7, adapted from [5], shows the Armv7-A architecture has been incorporated
    into the Armv8-A architecture. In addition, Armv8 supports two execution states:
    AArch32, in which the A32 and T32 instruction sets (Arm and Thumb in Armv7-A)
    are supported and AArch64, in the 64-bit instruction set. Armv8-A is compatible
    with Armv7-A, but the exception, privilege, and security model has been significantly
    extended as discussed below. In AArch32, the Armv7-A Large Physical Address Extensions
    are supported, providing 32-bit virtual addressing and 40-bit physical addressing.
