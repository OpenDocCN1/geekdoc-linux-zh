  md: "# Chapter 7 | Concurrency and parallelism\n\nSpin locks\nSpin locks are the\
    \ simplest form of locking. Essentially, the task trying to acquire the locks\
    \ goes into\na loop doing nothing until it gets the lock, in pseudocode:\n\n```\n\
    Listing 7.3.15 Spin lock pseudocode\nwhile (! has_lock ) {\n  // try to get the\
    \ lock\n}\n```\n\nSpin locks have the obvious drawback of occupying the CPU while\
    \ waiting. If the wait is long, another task should try to obtain the lock should\
    \ be to sleep. However, for the cases where it is not desirable to put a task\
    \ to sleep, or if the user knows the wait will be short, the kernel provides spin\
    \ locks, also known as busy-wait locks (kernel/locking/spin.c).\n\nThe spin lock\
    \ functionality for SMP systems is implemented as a macro which creates a lock\n\
    \ a given operation (read or write). Essentially, the implementation is a forever\
    \ loop with\na conditional break. First, preemption is disabled, then the function\
    \ tries to atomically acquire the lock,\n exits it if it succeeded; otherwise,\
    \ it re-enables preemption and calls the architecture-specific relation relax,\
    \ which is effectively an efficient way of doing a no-op, and it performs another\n\
    iteration of the loop and tries again.\n\n```\nListing 7.3.16: Linux SMP lock-building\
    \ macro\n#define BUILD_LOCK_OPS(op, locktype)\nvoid __lockfunc__raw_op##_lock(locktype)_t\
    \ *lock)\nfor ();\n  preempt_disable();\n  if (likely(do_raw__op##_trylock(lock))\n\
    \    break;\n  preempt_enable();\n  arch__op##_relax(lock->raw_lock);\n}\n```\n\
    \nFor uniprocessor systems (include/linux/spin_lock_api.h), the spin lock is much\
    \ simpler:\n\n```\nListing 7.3.17: Linux kernel uniprocessor spin lock\n#define\
    \ LOCK(lock) \\\ndo do { __acquire(lock); (void)(lock); } while (0)\n#define LOCK(lock)\
    \ \\\ndo do { preempt_disable(); __LOCK(lock); } while (0)\n//...\n#define raw_spin_lock(lock)\
    \ __LOCK(lock)\n```\n\nIn other words, code only disables preemption; there is\
    \ no actual spin lock. The references to the\\ lock variable are there only to\
    \ suppress compiler warnings.\n\n173"
