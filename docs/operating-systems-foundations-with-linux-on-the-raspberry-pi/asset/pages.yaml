  md: '# Operating Systems Foundations with Linux on the Raspberry Pi


    The particular mechanism chosen to implement virtual addressing in Linux is paging,
    which supports fine-grained resource allocation and management of physical memory.
    In a paging memory scheme, physical memory is divided into fixed-size frames.
    Virtual memory is similarly divided into fixed-size pages, where a single page
    has the same size as a single frame. This allows us to set up a mapping from pages
    to frames. The typical size of a single page in Linux is 4KB on a 32-bit ARM platform.
    Try getconf PAGESIZE on your terminal to find your system''s configured page size
    in bytes.


    The default page size is small enough to minimize fragmentation but large enough
    to avoid excessive overhead for page metadata. The page is the minimum granularity
    of memory that can be allocated to a user process. Larger pages are natively supported
    on Arm. For instance, 64KB ''HUGE'' pages are also supported. The advantage of
    large pages is that fewer virtual to physical address translation mappings need
    to be stored. The main disadvantage comes from internal fragmentation, where a
    process is unable to use such a large amount of contiguous space effectively.
    Effectively, internal fragmentation means there is free memory which belongs to
    one process and cannot be assigned to another process. Generally, huge pages are
    appropriate for database systems and similar data-intensive application workloads.


    The next section explains the underlying mechanisms required to translate page-based
    virtual addresses into physical addresses.


    # 6.4 Page tables


    During normal process execution, the processors and caches operate entirely in
    terms of virtual addresses. As outlined above, the MMU intercepts all memory requests
    and translates virtual addresses into physical addresses.


    The translation process relies on a mapping table, known as a page table which
    is stored in memory, see Sections 6.4.1 and 6.4.2. Dedicated MMU base registers
    are available to point to page tables for rapid access. An MMU cache of frequently
    used address mappings is maintained in the translation look-aside buffer, see
    Section 6.4.4.


    Generally, the address translation is performed by the MMU hardware, transparently
    from the process or OS point of view. The OS is invoked when a translation does
    not succeed—causes a page fault, see Section 6.5.2. When, a process begins execution,
    the OS needs to set up the initial page table and subsequently maintain it as
    the virtual address evolves.


    Some OS need to operate on physical addresses directly, perhaps for device driver
    interactions. There are macros like virt_to_phys(), which only work for memory
    buffers allocated by the kernel with kmalloc routine.


    # 6.4.1 Page table structure


    The page table is an in-memory data structure that translates from virtual to
    physical addresses. The translation happens automatically through the MMU hardware,
    which is directly supported by the processor. The MMU will actually read the translation
    tables when necessary; this process is known as a page walk. The OS simply must
    maintain up-to-date mapping information in each process''s page table, and refresh
    the page base register each time a different process executes.'
