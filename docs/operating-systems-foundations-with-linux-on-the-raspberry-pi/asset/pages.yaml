  md: '# 10.6.6 Building applications with UDP


    The UDP protocol provides an unreliable, bi-directional datagram service over
    an IP-based network between pairs of processes. Unlike TCP, there are no "connections"
    in UDP. A process that wishes to interact with other processes via UDP simply
    binds itself to a UDP port on its host. As long as it knows of at least one process''s
    host/port pair, it can begin to communicate with that. When a process receives
    a UDP message, it can be informed of the host/port pair for the process that sent
    the message.


    If you think about servers in the TCP realm, they advertise on well-known ports
    . We can think of long-lived processes that bind themselves to well-known UDP
    ports as servers.


    Processes that bind themselves to random UDP ports, and initiate communications
    with other processes, can be considered as UDP clients.


    The timeline of the various socket function calls required in a typical (simple)
    datagram socket interaction is shown below:


    | Server Process | Client Process | Alternative Client | Description |

    |---|---|---|--|

    | 1. socket(...) | 1. socket(...) | 1. socket(...) | Creates a socket file descriptor
    |

    | 2. bind(...) | 2. bind(...) | 2. bind(...) | Associate the socket with a UDP
    port number (server''s is predefined) |

    | 3. connect(...) | 3. recvfrom(...)/

    sendto(...)/... | 3. sendto(...)/

    recvfrom(...)/ | Client binds server info to socket |

    | 4. send(...)/recv(...) | 4. Close(...) | 4. Close(...) | Client/Server data
    communications |

    | 5. Close(...) | | | Stop using the socket |


    Note that UDP communication is unreliable. UDP primarily provides the ability
    to put application-level data directly into IP packets, with the UDP header providing
    the port information necessary to receive the data, if received, to the correct
    receiver. UDP also provides a integrity checksum of the application data so a
    receiver knows if it receives the data, it has received the correct data — the
    data has not been corrupted.


    Since the application data is placed in an IP packet, this implies that the size
    of the application message, plus the UDP and IP headers, cannot exceed the size
    of an IP packet. Hosts negotiate the maximum IP packet size for communications
    between them;; most networks support packets containing 1536-byte UDP packets,
    but some are limited to 512 bytes UDP packets. If you have larger messages to
    send, then you must fragment your message into multiple UDP packets, and reassemble
    them at the receiver. For this reason, most uses of UDP are for short messages,
    such as measurements from distributed sensors.


    The following program listings are for UDP versions of the service provided in
    Section 10.6.5.'
