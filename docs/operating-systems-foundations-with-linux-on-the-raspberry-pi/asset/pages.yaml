  md: '# Operating Systems Foundations with Linux on the Raspberry Pi


    # # 5.1 Overview


    This chapter discusses how the OS schedules processes on a processor. This includes
    the rationale for scheduling, the concept of context switching, and an overview
    of scheduling policies (FCFS, priority, ...) and scheduler architectures (FIFO,
    multilevel feedback queues, priorities, ...). The Linux scheduler is studied in
    detail.


    **What you will learn**


    After you have studied the material in this chapter, you will be able to:


    +   1. Explain the rationale for scheduling and relationship to the process lifecycle.


    +   2. Discuss the pros and cons of different policies for scheduling in terms
    of the principles and criteria.


    +   3. Calculate scheduling criteria and reason about scheduling policy performance
    with respect to the criteria.


    +   4. Analyze the implementation of scheduling in the Linux kernel.


    +   5. Control scheduling of threads and processes as a programmer or system administrator.


    # # 5.2 Scheduling overview: what, why, how?


    In Chapter 1, we introduced the concept of tasks and explained what a processor
    needs to do to allow multiple tasks to execute concurrently. Each task constrains
    an amount of work for the CPU, and scheduling is the method by which a task is
    assigned to the CPU. The operating system scheduler is the component responsible
    for the scheduling activity.


    # ## 5.2.1 Definition


    According to the Oxford dictionary [1], a schedule¹ is a "plan for carrying out
    a process or procedure, giving lists of intended events and times; we have drawn
    up an engineering schedule"; to schedule means "arrange or plan (an event) to
    take place at a particular time" or to "make arrangements for (someone or something)
    to do". In the context of operating systems, both meanings hold: the scheduler
    arranges events (i.e., execution of task code on the CPU) to take place at a particular
    time and makes arrangements for the task to run.


    Scheduling is primarily motivated by the need to execute multiple tasks concurrently.
    In a modern computing system, many tasks are active at the same time. For example,
    on a desktop system, every tab in a web browser is a task; the graphical user
    interface represents a number of tasks, there are tasks taking care of networking.
    At the time of writing this text, my laptop was running 317 processes. From these,
    106 super tasks, 24 services, and 190 remaining were my user account. Most of
    these tasks are long-running, i.e., they only exit when the system shuts down.
    In fact, out of the 190 processes under my user name, only 33 belonged to applications
    that I had actually launched.


    > ¹ The origin is late Middle English (in the sense ''scroll, explanatory note,
    appendix)''; from Old French wszel, from late Latin schedule ''slip of paper'',
    diminutive of regula, from Greek ''papyros''.'
