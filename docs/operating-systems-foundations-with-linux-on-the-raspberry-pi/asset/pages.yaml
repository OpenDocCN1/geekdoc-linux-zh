    # Listing 7.3.7 Atomic behavior through masking interrupt requests


    ```

    1 / * Aarch64 has flags for masking: Debug, Asynchronous (serror), Interrupts
    and

    2 / * FIQ exceptions, in the ''daif'' register. We mask and unmask them in ''dai''

    3 /

    4 / * order:

    5 / * Masking debug exceptions causes all other exceptions to be masked too

    6 / * Masking Error exceptions masks irq, but not debug exceptions. Masking irqs
    has no

    7 / * side effects for other flags. Keeping to this order makes it easier for

    8 / * entry_s to know which exceptions should be unmasked.

    9 /

    10 /

    11 / * CPU interrupt mask handling.

    12 /

    13 static inline unsigned long arch_local_irq_save(void)

    14 {

    15 unsigned long flags;

    16 asm volatile(

    17 "mrs %0, daif // arch_local_irq_save\n"

    18 "msr daif, %2"

    19 : "r" (flags)

    20 :

    21 : "memory");

    22

    23 return flags;

    24 }

    25

    26 / /

    27 / * restore saved IRQ state

    28 /

    29 static inline void arch_local_irq_restore(unsigned long flags)

    30 {

    31 asm volatile(

    32 "msr daif, %0 // arch_local_irq_restore"

    33 : "r" (flags)

    34 : "memory");

    35 }

    ```


    Masking interrupts is a simple and effective mechanism to guarantee atomicity
    on a single-core processor because the only other thread could interfere with
    the operation would be through an interrupt. On a multicore processor, it is in
    principle possible that a thread running on another core would access the same
    memory location. Therefore, this mechanism is not useful outside the kernel. If
    you use it in kernel, it is assumed that you know what you are doing, and that
    is why the routines have_local_ in name, to indicate that they only operate on
    the local CPU.


    A new overview of the API for operations on atomic types can be found in the kernel
    documentation in the files atomic.txt and atomic_bitops.txt. The operations can
    be divided into non-RMW and RMW. The former are read, set, acquire and set_release;
    the latter are arithmetic, bitwise, swap, and reference count operations. Furthermore,
    each of these comes in an atomic_ and atomic64_variant, as well as variants to
    indicate that there is a return value or not, and that the fetched rather than
    the stored value is returned. Finally, they all come with relaxed, acquire, and
    release variants, which need a bit more explanation.'
