    mmblk0   7:0  7.4G part \

    └mmblk0p1 7:1  238M part \

    └mmblk0p2 7:2  411M part /boot

    ```


    Figure 8.2: Typical output from the lsblk command.


    # 8.2.2 Device classes


    Look at the /proc/devices file to see devices that are registered on your system.
    This file shows Linux distinguishes between two fundamental classes of devices:
    character and block devices.


    A character device transfers data at byte granularity in arbitrary quantities.
    Data is accessed as a stream of bytes, like a file, although it may not be possible
    to seek to a new position in the stream.'
