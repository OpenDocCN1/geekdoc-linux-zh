- img_proc: true
  md: '1. **Predicting**: The OS must estimate ahead-of-time how long user tasks will
    take to complete and which resources they will need. This is useful for efficient
    scheduling.


    2. **Accounting**: The OS must keep track of precisely which resources are used
    by each application. This depends on low-level tools like perf, alongside higher-level
    application-specific metrics such as number of database queries. This is essential
    for billing users accurately for their workloads.


    3. **Constraining**: The OS must allow certain sets of actions for each application.
    Similar to sandboxing, there are constraints on the application behavior. Often
    the constraints are expressed as a blacklist of disallowed actions; this is exactly
    how software apps are executed. On the other hand, the constraints could be expressed
    as a whitelist of allowable actions; this might be supported by a capability-based
    system. CPU usage constraints, as outlined above, rely on quantitative thresholds
    that must be enforced by the kernel.


