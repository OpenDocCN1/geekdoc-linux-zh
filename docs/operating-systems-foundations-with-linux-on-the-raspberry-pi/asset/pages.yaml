  md: '# # 7.1 Overview


    In this chapter, we discuss how the OS supports concurrency, how the OS can assist
    in exploiting hardware parallelism, and how the OS support concurrency and parallelism
    can be used to write parallel and concurrent programs. We look at OS support for
    concurrent and parallel programming via POSIX threads and present an overview
    of practical parallel programming techniques such as OpenMP, MPI, and OpenCL.


    The exercises in this chapter focus on POSIX thread programming to explore the
    concepts of concurrency, shared resource access and parallelism, and programming
    using OpenCL to expose the student to parallel heterogeneous programming.


    # What will you learn


    After you have studied the material in this chapter, you will be able to:


    +   1. Relate definitions to the programmer''s view of concurrency and parallelism.


    +   2. Discuss programming primitives and APIs to handle concurrency and the OS
    and hardware support for them.


    +   3. Use the POSIX programming API to exploit parallelism and OS and hardware
    support for them.


    +   4. Compare and contrast parallel data- and task-parallel programming models.


    +   5. Illustrate by example the popular parallel programming APIs.


    # # 7.2 Concurrency and parallelism: definitions


    To understand the implications and properties, first of all, we need clear definitions
    of concurrency and parallelism.


    #  7.2.1 What is concurrency?


    Concurrency means that more than one task is running concurrently (at the same
    time) on the system. In other words, concurrency is a property of the workload
    rather than the system, provided that the system has support for running more
    than one task at the same time. In practice, one of the key reasons to have an
    OS is to support concurrency through scheduling of tasks on a single shared CPU.


    #  7.2.2 What is parallelism?


    Parallelism, by contrast, can be viewed as a property of the system: when a system
    has more than one CPU core, it can execute several tasks in parallel, even if
    there is no scheduler to time-slice the tasks. If the kernel supports hardware
    parallelism, it will try to speed up the execution of tasks by making use of the
    available parallel resources.


    #  7.2.3 Programming model view


    Another way of defining the terms parallelism and concurrency is as programming
    models. In practical terms, concurrent programming is about user experience and
    parallel programming about performance.'
