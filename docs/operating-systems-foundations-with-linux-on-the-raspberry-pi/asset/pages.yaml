  md: '# Operating Systems Foundations with Linux on the Raspberry Pi


    # 11.1 Overview


    So far in this textbook, we have presented standard concepts for current mainstream
    OS distributions, with particular reference to Linux. This final chapter will
    outline more advanced trends and features: many of these are not yet reflected
    in contemporary OS code bases; however, they may be integrated within the next
    decade. Rather than presenting concrete details, this chapter will provide pointers
    and search keywords to facilitate further investigation.


    What you will learn


    After you have studied the material in this chapter, you will be able to:


    +   1. Give examples of different classes of systems on which Linux is deployed.

    2. Explain how the characteristics of diverse systems lead to various trade-offs
    in OS construction and configuration.

    3. Justify the requirement for lightweight, rapid deployments of specialized systems,
    particularly in the cloud.

    4. Illustrate security vulnerabilities and mitigations in modern manycore systems,
    particularly with respect to speculative execution.

    5. Assess the need for formal verification of OS components in various target
    scenarios.

    6. Appreciate the community-based approach to developing new features in the Linux
    kernel.


    # 11.2 Scaling down


    The computer on which Torvalds initially developed Linux in 1991 was a 32-bit
    286 processor clocked at 33MHz, with 4MB of RAM. Thanks to Moore''s law, present-day
    smartphones and wearable devices are much more powerful than this original Linux
    machine. Many small-scale devices run variants of Linux as Android, Tizen, or
    Chrome OS, see Figure 11.1. The compelling advantage of Linux is that it provides
    a highly customizable, off-the-shelf, core OS platform, enabling rapid time-to-market
    for consumer electronics. These modern Linux variants are specialized to enable
    fast boot times on specialized, proprietary hardware. They often restrict execution
    to a controlled set of trusted vendor-supplied apps.


    The motivation is radically different for Raspberry Pi and other single board
    computers, which are intended to be be as flexible and general-purpose as possible.
    These devices will support the broad flexibility of Linux kernel configurations,
    with a vast range of optional hardware support. Generally, single board computers
    track smartphone hardware in terms of features and capabilities, since they are
    often based around similar chips and peripherals.


    Smaller, less capable, embedded devices include internet-of-things (IoT) sensors
    or network devices. These nodes have minimal RAM and persistent storage, and may
    only have access to low bandwidth, intermittent network connections. Generally,
    such devices are targeted with specialized'
