    \ is stated in the kernel documentation (https://elixir.bootlin.com/linux/latest/source/kernel/sched.h)\
    \ as follows:\n\n80% of CFS' design can be summed up in a single sentence: CFS\
    \ basically models an \"ideal, precise multitasking CPU\" on real hardware.\n\n\
