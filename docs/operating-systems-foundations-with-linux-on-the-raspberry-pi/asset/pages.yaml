    blocks, waiting for data from/dev/random.


    Now modify the Python script to make read operations to be non-blocking. Do this
    by changing the flags in the open call to os._O_RDONLY | os.O_NONBLOCK. When we
    execute the script again, it always returns immediately. If there is no random
    data available, then it reports an OSError.


    # 8.4.3 Managing IO interactions


    There are three general approaches to interacting with IO devices, in terms of
    structuring a ''conversation'' or communication session:


    +   1. Polling;


    +   2. Interrupts;


    +   3. Direct memory access (DMA).


    The particular approach is generally implemented at device driver level; it is
    not directly visible to the end-user. Rather, the approach is a design decision
    made by the manufacturer of the hardware device in collaboration with the developer
    of the software driver.


    Subsequent paragraphs explain the three mechanisms and their relative merits.
    The idea is that data has the information we want to fetch into memory, and we
    need to manage this data transfer.


    (Alternatively, the device may require the information we have in memory, and
    we need to handle this transfer.)


    The cartoon illustration in Figure 8.4 presents an analogy to compare the different
    approaches. The customer (on the left-hand side) is like a CPU requesting data;
    the delivery depot (on the right-hand side) is like a device; the package delivery
    is the data transfer from device to CPU. In each of the three cases, this transfer
    is coordinated differently.'
