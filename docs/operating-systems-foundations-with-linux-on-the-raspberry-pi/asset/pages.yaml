  md: "# Treating sockets as system devices: read()/write()\n\nThe read() and write()\
    \ low level I/O library functions are not part of the standard socket library;\
    \ however stream sockets behave in the same manner as any other operating system\
    \ device (standard input/output, file, etc) and low-level system I/O operations\
    \ are compatible with stream socket I/O. The use of these functions in place of\
    \ the standard socket library functions send(), and recv() (used for stream sockets\
    \ only) is a common programming nicely that will allow the simple redirection\
    \ of communications from any other available I/O device in the host OS. In comparison;\
    \ the standard socket library functions sendto() and recvfrom() used for datagram\
    \ sockets (UDP) are not compatible with the low-level stream I/O due to their\
    \ unreliable and connectionless characteristics and therefore cannot be treated\
    \ in the same way.\n\n> Note\nA read from a stream socket (using the read() or\
    \ recv() functions) may not return all of the expected bytes in the first go,\
    \ and the read operation may need to be repeated until the full number of expected\
    \ bytes has been received. If the expected number of bytes is not in advance,\
    \ the stream should read a small block of bytes (possible 1 byte) at a time until\
    \ the receive count is identified using a data size field within the received\
    \ data or a predefined data terminator sequence. It is up to the individual internet\
    \ application to define any data size field syntax and/or data terminators Attempting\
    \ to read more data that has been sent will block the read() or recv() function\
    \ which will hang waiting for new data.\n\n# 10.6.2 Common Internet data types\n\
    \nAs mentioned previously – only the stream socket related library functions and\
    \ associated data types and constants are listed here. Due to target differences\
    \ in the fundamental integer data types used between various implementations of\
    \ the standard socket interface – the POSIX defined types 'char' (8-bit), 'short'\
    \ (16-bit) and 'long' (32-bit) (normally declared in sys/types.h for UNIX systems)\
    \ are used here to signify fixed word length integer data types and may be utilized\
    \ in any required programming type casts.\n\nThe following sections discuss some\
    \ reference material for useful socket interface library functions and integer\
    \ data types.\n\n# Socket address data type: struct sockaddr\n\nThe socket address\
    \ data structure is defined in various socket library call functions in sys/socket.h\
    \ as:\n\n```\nListing 10.6.1: socket address struct\nstruct sockaddr {\n    unsigned\
    \ char sa_family; /* address family */\n    char sa_data[14]; /* value of address\
    \ */\n};\n```"
