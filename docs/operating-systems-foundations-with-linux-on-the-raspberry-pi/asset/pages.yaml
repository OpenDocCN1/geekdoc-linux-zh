    The L1 memory system consists of separate-core instruction and data caches. The
    implementer configures the instruction and data caches independently during implementation,
    to sizes of 8KB, 16KB, 32KB, or 64KB. The Raspberry Pi 3 configuration has 16KB
    for both Instruction and Data. Note that the instruction cache is read-only because
    instruction memory is read-only.


    The L1 instruction cache has the following key features:


    +   - Cache line size of 64 bytes.


    +   - 2-way set associative.'
