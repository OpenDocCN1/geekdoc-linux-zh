    \ 127\n    int gr_id = get_group_id(0); // 0 .. 15\n\n    int wSize = aSize/gSize;\
    \ // 32,768\n    int start = gl_id*wSize;\n    int stop = (gl_id+1)*wSize;\n \
    \   for (int idx = start; idx<stop; idx++) {\n        a_squared[idx]=a[idx]*a[idx];\n\
    \    }\n)\n```\n\nAlternatively we could use the local NDRange index, group index\
    \ and number of workgroups, the relationship is as follows:\n\nwork_group_size\
