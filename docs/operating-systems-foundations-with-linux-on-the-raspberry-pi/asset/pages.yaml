  md: '# Mounting


    The operation performed by the kernel to provide access to a file system. Mounting
    a file system attaches that system to a directory (mount point) and makes it available
    to the system. The root file system is always mounted. Any other file system can
    be connected or disconnected from the root file system at any point in the directory
    tree.


    # Multitasking


    The concurrent execution of multiple tasks (also known as processes) over a certain
    period of time.


    # Network interface controller (NIC)


    Also known as a network interface card or network adapter, is a computer hardware
    component that connects a computer to a computer network.


    # Networking


    The interaction of a computer system with other computer systems using an intermediate
    communication infrastructure.


    # Opcode


    An opcode or operation code is the part of a machine language instruction that
    specifies the operation to be performed. Most instructions also specify the data
    to be processed in the form of operands.


    # OpenCL


    An open standard for parallel computing on heterogeneous architectures.


    # OpenMP


    A standard for shared-memory parallel programming. It is based on a set of compiler
    directives or pragmas, combined with a programming API to specify parallel regions,
    data scope, synchronization, etc.. OpenMP is a portable parallel programming approach,
    and the specification supports C, C++, and Fortran.


    # Operating system


    An operating system (OS) is a dedicated program that manages the hardware and
    software resources of a computer system and provides common services for computer
    programs running on the system. Modern operating systems keep track of resource
    usage of tasks and use time-sharing to schedule tasks for efficient use of the
    system.


    # Parallelism


    Parallel processing is a capability of a computer system.


    # Partition


    A disk can be divided into partitions, which means that instead of presenting
    as a single blob of data, it presents as several different blobs. Partitions are
    logical rather than physical, and the information about how the disk is stored
    in a partition table.


    # Peripheral


    A device connected to a computer, used to put information into and get information
    out of the computer. "Peripheral" is also the name of a science fiction novel
    by William Gibson (2014).'
