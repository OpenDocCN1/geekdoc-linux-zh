    # 10.6.5 Building applications with TCP\n\nThe TCP protocol provides a reliable,\
    \ bi-directional stream service over an IP-based network pairs of processes.\n\
    \nOne process is known as the server; when it comes to life, it binds itself to\
    \ a particular TCP port number on which upon it executes and at which it will\
    \ provide its particular service.\n\nThe other process is known as the client;\
    \ when it comes to life, it connects to a server on a particular TCP host that\
    \ is bound to. Upon completion of the connection, either party can begin sending\
    \ bytes to the other party over the stream.\n\n# Request/response communication\
    \ using TCP\n\nThe TCP protocol is designed to maximize the reliable delivery\
    \ of data end-to-end; to enable both the reliable delivery and to maximize the\
    \ amount of data so delivered, the protocol is allowed to ship the data supplied\
    \ by the sender in as many packets as it (within reason). In particular, TCP does\
    \ not guarantee that:\n\n+   - A sender's data is sent as soon as the send() or\
    \ write() system call completes — i.e., your system can choose to buffer the data\
    \ from several sized()/write() system calls before actually sending the data to\
    \ the network.\n\n+   - A receiver receives the data in the same sized chunks\
    \ that were specified in the sender's send()/write() system calls — i.e., it does\
    \ not maintain \"message\" boundaries.\n\nIf you are trying to implement a request/response\
    \ application protocol over TCP, then you need to program around these features.\
    \ In the following sections, it is assumed that your client and server must maintain\
    \ message boundaries."
