    \      # Set program counter to ISR start address\n      registers[PC]=ivt[idx]\n\
    \      # Clear the interrupt request\n      irqs[idx]=False\n      break\n   \
    \ idx+=1\n  return (registers, irqs)\n```\n\n# 1.4.4 Direct memory access\n\n\
    Another component of a modern processor-based system is support for Direct Memory\
    \ Access (DMA). This is a mechanism that allows peripherals to transfer data directly\
    \ into the main memory without going through the processor. In systems, the DMA\
    \ controller unit is typically a peripheral (e.g., the PrimeCell DMA Controller),\
    \ we will implement our DMA model as a peripheral as well.\n\nThe principle of\
    \ a DMA transfer is that the CPU initiates the transfer by writing to the DMA\
    \ unit's registers, then runs instructions while the transfer is in progress,\
    \ and finally receives an interrupt from the DMA controller when the transfer\
    \ is done."
