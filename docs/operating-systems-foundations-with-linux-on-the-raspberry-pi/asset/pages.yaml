    # 1.5.4 Privileges


    In Section 1.5.3, we hinted at a potential issue with the stack. The problem is
    that ''pushing onto the stack'' means modifying the stack pointer SP. So how can
    we preserve the stack pointer of the current task? The short answer for the ARM
    processor is that it has two stacks, one for user space stacks (PSP) and one for
    the kernel stack (MSP). User tasks cannot access the kernel stack pointer; the
    kernel code can select between the two using the MRS and MSR instruction.


    This raises the topic of privileges: clearly if the kernel code can access more
    registers than the user task code, the kernel code is privileged. This is an essential
    security feature of any operating system because, without privileges, a userspace
    task code could modify the kernel code or other task code.


    We will discuss this in more detail in Chapter 4, ''Process management''. For
    the moment, it is sufficient to know that in the ARM Cortex-M3 there are privilege
    levels; ''Unprivileged'' and ''Privileged''; in Unprivileged mode the software
    has limited access to the MRS and MSR instructions which allow access to special
    registers, and cannot use the CPS instruction which allows us to change the privilege
    level. For further restrictions, see [2].


    # 1.5.5 Memory management


    So far we have assumed that tasks reside in memory. In practice, the OS will have
    to load the program code into memory. To do so, the OS must find a sufficient
    amount of memory for both the program code and the memory required by the program.
    It would clearly not be practical if the program were to use absolute memory addresses;
    this would mean that the compiler (or the programmer) would need to know in advance
    where the program would reside in memory. This would be very inflexible. Therefore,
    program code will use relative addressing, e.g., relative to the value of the
    program counter. The OS will set the PC to the starting address of code in memory.


    However, relative addressing does not solve all problems. The main question is
    how to allocate space in memory for the processes. Initially, we could simply
    fill up the memory, as shown in Figure 1.4. But what happens with the memory of
    finished tasks? The OS should, reuse it, but it could only do so if a new task
    does not use any more memory than one of the finished tasks. Again, this would
    be very restrictive.


    The commonly used solution to this problem is to introduce the concept of a logical
    address space. This is a contiguous address space allocated to a process. The
    physical addresses that correspond to this logical address space do not be contiguous.
    The operating system is responsible for the translation between the logical and
    physical address spaces. What is explained in detail in Chapter 6, ''Memory management'',
    but you can also think of ways to organize non-contiguous blocks of physical memory
    of varying size into a logical contiguous space. Apart from translation, the OS
    must also ensure that a process cannot access the memory of another process: this
    is called memory protection. Typically, this involves checking a logical address
    against the upper and a lower bound of the process logical address space. This
    is a very common'
