    The dual MCR instruction writes from r0 into TTBR0, to update the page table base
    pointer.


    Generally, Arm uses a one-page table base register for process-specific addresses
    (TTBR0) and devotes the other for OS kernel addresses (TTBR1). The page table
    control register TBCFR determines which page table register is used for hardware
    page table walks; TBCFR is set when we enter the kernel.


