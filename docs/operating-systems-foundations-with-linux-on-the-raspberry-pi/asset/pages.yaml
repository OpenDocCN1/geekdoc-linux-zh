    When a processor completes multiple processing, the hardware must be designed
    to support parallel processing on all cores. Apart from supporting cache-coherent
    shared memory and the features to support concurrency as discussed above, there
    are few other ways in which Arm multicore processors support parallel programming.
    The first is through SIMD (Single Instruction Multiple Data) instructions, also
    known as vector processing. This type of parallelism does not require intervention
    from the OS as it is instruction-based per-core parallelism, it is handled by
    the compiler. The Arm Cortex-A53 MPProcessor used in the Raspberry Pi 3 supports
    "Advanced SIMD" extensions, as discussed in [8].


    Next, the handling of interrupts must also be multi-aware. The Arm Generic Interrupt
    Controller Architecture [9] provides support for controller delivery of hardware
    interrupts to a particular processing element ("Targeted distribution model")
    as well as to one PE of a given set ("1 of N model"); and to control the delivery
    of software interrupts to multiple PEs ("Targeted list model").


    Then we have support for processor affinity through the Multiprocessor Affinity
    Register, MPIDR. This feature allows the OS to identify the PE on which a thread
    is scheduled.'
