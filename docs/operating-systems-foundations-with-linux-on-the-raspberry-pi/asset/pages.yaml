  md: '# Operating Systems Foundations with Linux on the Raspberry Pi


    kernel. While containers lack the flexibility of heavyweight virtualization, they
    are potentially much more efficient. For this reason, containerization is popular
    for use cases requiring rapid deployment times such as DevOps, cloud systems,
    and serverless computing. A user wants to pick a relevant application service
    with minimal latency. Tools like Docker enable services to be specified and decomposed
    declaratively as scripts, then prebuilt images can match these scripts. This avoids
    lengthy configuration and build times, enabling services to come up quickly.


    Linux kernel facilities such as control groups (cgroups) enable containerization.
    Key concepts are namespace isolation and resource limiting. Sets of processes
    can be collected together into a cgroup and controlled as a unit. The bash listing
    below illustrates how to exercise this control, and Figure 11.4 shows the output
    on a typical quad-core Raspberry Pi node.


    ![](img/17ca5177da1b1e15b2169f9c7932e5b6_311_0.png)


    | Listing 11.4.1 Using cgroups to limit CPU resource |

    |---||

    | 1 | sudo apt-get install stress # tool for CPU stress-testing |

    | 2 | sudo apt-get install cgroup-tools # utils for cgroups |

    | 3 | sudo cgroup create -r cpu:morecpu |

    | 4 | sudo cgroup create -r cpu:lesscpu # default is 1024 |

    | 5 | sudo cgset -r cpu.cpu.shares=128 lesscpu # limit CPU usage |

    | 6 | # now run some stress code in different control groups |

    | 7 | sudo cgexec -g cpu:lesscpu stress --cpu 4 & |

    | 8 | sudo cgexec -g cpu:morecpu stress --cpu 4 & |

    | 9 | top # to see the cpu usage |

    | 10 | 11 sudo killall stress # to stop the stress jobs |


    Process sandboxes throw-away execution. Processes may be run once; then their
    side-effects may be isolated and discarded. In this sense, Linux containers are
    a progression of earlier Unix chroot and BSD jail cells. User-friendly configuration
    tools like Docker have massively popularized containerization.


    The growth in the utility computing market requires greater levels of resource
    awareness in the underlying system. In particular, the OS needs to support three
    key activities:'
