  md: "# Operating Systems Foundations on Linux on the Raspberry Pi\n\nReturn value:\
    \ the function returns the actual number of bytes read into the receive buffer;\
    \ 0 on end of file (socket disconnection); or -1 on error.\n\nInput parameters:\
    \ in-stream the socket transport protocolwise flags of MSG_OOB (urgent data) and\
    \ MSG_PEEK (copy data without removing it from the socket) can be used (multiple\
    \ bitwise flags can be set concurrently by ORing the selection). For standard\
    \ data receive, the value 0 is used for parameter flags.\n\nBecause of the stream\
    \ socket operation compatibility with system I/O device operation, the recv()\
    \ socket specific function is replaced with the generic read() I/O function. This\
    \ means that data reception can be easily redirected to other system devices (such\
    \ as an opened file or standard input). Care should be taken when reading an expected\
    \ number of bytes; the socket transport does not guarantee when to receive bytes\
    \ will be available, and blocks may be split into smaller sections which may find\
    \ a simple socket approach.\n\nIf no messages are available at the socket, the\
    \ recv() waits for a message to arrive, unless the socket is nonblocking via fcnt(2),\
    \ in which case the value -1 is returned and the external variable errno is set\
    \ to EAGAIN or EWOULDBLOCK. The recv() normally returns any data available, up\
    \ to the requested amount, rather than waiting for receive of the full amount.\
    \ Therefore in practice, recv() is usually called in a loop until the required\
    \ number of bytes has been received.\n\nSetting socket options: setsockopt()\n\
