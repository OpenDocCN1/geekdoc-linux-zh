  md: '# Operating Systems Foundations on Linux on the Raspberry Pi


    available protocols through a special structure that defines its capabilities.
    Each protocol maintains a (large) structure proto (in include/net/sock.h). This
    structure defines the particular socket operations that can be performed from
    the sockets layer to the transport layer (for example, how to create a socket,
    how to establish a connection with a socket, how to close a socket, etc.).


    # 10.5.5 System call interface


    We have covered the System call interface in Chapter 5. Essentially, this is the
    interface between user space and kernel space. Recall that Linux system calls
    are identified by a unique number and a variable number of arguments. When a networking
    call is made by the user, the system call interface of the kernel maps to a sys_socketcall
    (defined as SYSCALL_DEFINE2(socketcall, ...) in net/socket.h), which then further
    demultiplexes the call to its intended target, e.g., SYS_SOCKET, SYS_BIND.


    It is also possible to use the file abstraction for networking I/O. For example,
    typical read and write operations may be performed on a networking socket (which
    is represented by a file descriptor, as a normal file). Therefore, while there
    exists a number of operations that are specific to networking (creating a socket
    with the socket call, connecting it to a destination with the connect call, and
    so on), there are also a number of standard file operations that apply to networking
    objects just as they do to regular files.


    # 10.5.6 Socket buffers


    A consequence of having many layers of network protocols, each using the services
    of another, is that each protocol needs to add protocol headers (and/or footers)
    to the data as it is transmitted and to remove them as packets are received. This
    could make passing data buffers between the layers difficult as each layer would
    need to find where its particular protocol headers and footers are located within
    the buffer. Copying buffers between layers would, of course, work, but it would
    be inefficient. Instead, the Linux kernel uses socket buffers (a.k.a. sk_buff)
    (struct sk_buff) to pass data between the protocol layers and the network device
    drivers. Socket buffers contain pointer and length fields that allow each protocol
    layer to manage the application data via standard functions.


    ![](img/17ca5177da1b1e15b2169f9c7932e5b6_279_0.png)


    Figure 10.3: Socket buffer structure.


