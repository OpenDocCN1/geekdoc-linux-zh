    # 5.8.5 Soft real-time scheduling policies


    The Linux kernel supports both soft real-time scheduling policies SCHED_RR and
    SCHED_FIFO required by the POSIX real-time specification [7]. Real-time processes
    are managed by a separate scheduler, defined in <kernel/sched/rt>.


    From the kernel''s perspective, real-time processes have one key difference compared
    to other processes: if there is a runnable real-time task, it will run—unless
    there is another real-time task with a higher priority.


    There are currently scheduling policies for soft real-time tasks:


    +   - SCHED_FIFO: This is a First-Come, First-Served scheduling algorithm as discussed
    in Section 5.7.1. Tasks follow this policy which do not have timelines; they run
    until they block, yield the CPU or get pre-empted by a higher priority real-time
    task. A SCHED_FIFO task must have a static priority > 0 so that it preempts any
    SCHED_NORMAL, SCHED_BATCH or SCHED_IDLE process. Note that this means that a SCHED_FIFO
    task will use the CPU until it is finished, and no real-time tasks will be scheduled
    on CPU. Several SCHED_FIFO tasks of the same priority run round-robin. A task
    can be pre-empted by a higher-priority task, in which case it will stay at the
    head of the list for its priority and resume execution as soon as all tasks of
    higher priority are blocked. When a blocked SCHED_FIFO thread becomes runnable,
    it will be inserted at the end of the list for its priority.


    +   - SCHED_RR: This is a Round-Robin (explained in Section 5.7.2) enhancement
    of SCHED_FIFO scheduler, so it runs every task for a maximum fixed time slice.
    Tasks of the same priority run round-robin until they run out. If running for
    a time quantum, a task is not finished, it will be put at the end of the list
    for its priority. A task that has been pre-empted by a higher priority task and
    subsequently resumes execution will complete the remaining portion of its round-robin
    time quantum. As mentioned before, the length of the time quantum can be retrieved
    via /proc/sys/kernel/sched_rr_timeslice_ms or by using sched_rr_get_interval(2).'
