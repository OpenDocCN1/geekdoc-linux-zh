    as mounting, formatting, checking, permissions and links. Chapter 9 ''Persistent
    storage'' focuses on file systems. We discuss the use cases and explain how the
    raw hardware (block- and sector-based storage, etc.) is abstracted at the OS level.
    We talk about mapping high-level concepts like files, directories, permissions,
    etc. to physical entities. We review allocation, space management, and recovery
    from failure. We present a case study of a Linux file system. We also discuss
    Windows-style FAT, which is how USB storage operates.


    # 2.5.7 Networking


    Networking is important at many levels: when booting, the firmware deals with
    the MAC layer, the kernel starts the networking subsystem (dhcp and init daemons);
    user processes start shortly and after. The administrator may need to tune the
    TCP/IP stack and configure the kernel firewall. Most applications today require
    network access. As the Linux networking stack is handled by the kernel, the programmer
    needs to understand how Linux manages networking as well as the basic APIs.


    Chapter 10 ''Networking'' introduces networking from a Linux kernel perspective:
    why is networking treated differently from other types of IO, what are the OS
    requirements to support the network stack, etc.. We introduce socket programming
    with a focus on the role the OS plays (e.g.-buffering, file abstraction, supporting
    multiple clients, ..).


