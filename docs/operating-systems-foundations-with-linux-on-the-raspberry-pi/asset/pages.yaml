  md: "# Operating Systems Foundations with Linux on the Raspberry Pi\n\nThe only\
    \ complication in the cache line-based model is that we need to manipulate the\
    \ memory address to determine the cache line and the location of the data inside\
    \ the cache line. Do this by using bit shift and mask operations: the first 4bits\
