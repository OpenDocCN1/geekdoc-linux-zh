    Inspect the FAT data, which starts at address 0x200 in the file; after the initial
    magic values, subsequent entries are sequential cluster numbers, with an end-of-cluster
    marker.


    Because the FAT file system we created is initially blank, the newly allocated
    file is stored in consecutive clusters on the disk. Over time, as a FAT file system
    becomes more used and fragmented, files may not be consecutive.


    | 0001f0 | 0000 | 0000 | 0000 | 0000 | 0000 | 0000 | aa55 |

    | 000200 | fff8 | ffff | 0000 | 0004 | 0005 | 0006 | 0007 | ffff |

    | 000210 | 0000 | 0000 | 0000 | 0000 | 0000 | 0000 | 0000 | 0000 |


    When free data blocks are required, the system scans through the FAT to find the
    index numbers of blocks that are marked as free and uses these for free file data.


    If the Python code above is too long to attempt, you could also use the mkfsfat
    tool to create a blank FAT16 disk image, as shown below.


