  md: '# Operating Systems Foundations with Linux on the Raspberry Pi


    # 1.1 Overview


    In this chapter, we will introduce a number of abstract memory-centric models
    for processor-based systems. We will use Python code to describe the models and
    only use simple data structures and functions. The models are abstract in the
    sense that we do not build the processor system starting from its physical building
    blocks (transistors, logic gates, etc.), but rather, we model it in a functional
    way.


    The purpose is to help you understand that in a processor-based system, all actions
    fundamentally reduce to operations on addresses. This is a very important point:
    every observable action in a processor-based system is the result of writing to
    or reading from an address location.


    In particular, this includes all peripherals of the system, such as the network
    card, keyboard, and display.


    # What you will learn


    After you have studied the material in this chapter, you will be able to:


    +   1. Discuss the importance of state and the address space in a processor-based
    system.


    +   2. Create a processor-based system model in a high-level language.


    +   3. Implement basic operating system concepts such as time slicing in machine
    code.


    +   4. Explain how hardware and software features of a processor-based system
    are designed to handle I/O, concurrency, and performance.


    # 1.2 Modeling the system


    +   A microprocessor is driven by a clock.


    +   Our model will describe the actions at every tick of the clock using functions.


    +   We will model the system through its state, represented as a simple data structure.


    By "state," we mean information that is persistent, i.e., some form of memory.
    This is not limited to computer memory. For example, if your system controls a
    robot arm, then the position of the arm is part of the state of the system.


    # 1.2.1 The simplest possible model


    We start our system model by stating that the action of the processor modifies
    the system state:


    ```

    systemState = processorAction(systemState)

    ```


    In practice, the system also interacts with the outside world through peripherals
    such as the keyboard, network interface, generally called "I/O devices", storage
    devices as disks, etc. Let''s just see these types of actions to modify the state
    ''non-processor actions''. Adding this to our model, we'
