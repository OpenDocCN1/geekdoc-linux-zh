  md: '# # Operating Systems

    Foundations

    with Linux on the Raspberry Pi


    The aim of this book is to provide a practical introduction to the foundations
    of modern operating systems, with a particular focus on GNU/Linux and the Arm
    platform. The unique perspective of the authors is that they explain operating
    systems theory and concepts but ground them in practical use through illustrative
    examples of their implementation in GNU/Linux, making the connection with the
    Arm hardware supporting the OS functionality. For use in ECE, EE, and CS Departments.


    # ## Contents


    +   1 A Memory-centric System Model

    2 A Practical View of the Linux System

    3 Hardware Architecture

    4 Process Management

    5 Process Scheduling

    6 Memory Management

    7 Concurrency and Parallelism

    8 Input / Output

    9 Persistent Storage

    10 Networking

    11 Advanced Topics


    > "While the modern systems software stack have become large and complex, the
    fundamental principles are unchanging. Operating Systems must trade off abstraction
    for efficiency. In this respect, Linux on Arm is particularly instructive. The
    authors do an excellent job of presenting Operating Systems concepts, with direct
    links to concrete examples of these concepts in Linux on the Raspberry Pi, Please
    don''t just read this textbook - buy a Pi and try out the practical exercises
    as you go."


    Steve Furber CBE FREng

    ICL Professor of Computer Engineering

    The University of Manchester


    Arm Education Media is a publishing operation with Arm Ltd, providing a range
    of educational materials for aspiring and practicing. For more information, visit:
    armedumedia.com'
  merge: -1
