  md: '# Cache cache coherency


    Cache coherency refers to ensure that local caches on different cores in a multicore
    system with a shared memory have a coherent view on the memory. This essentially
    means that the system should behave as if there are no caches. We note for completeness
    that the Cortex-A53 processor uses MOESI protocol to maintain cache coherency
    between multiple cores. In this protocol, each cache line is in one of five states:
    Modified, Owned, Exclusive, Shared or Invalid. The L2 memory system includes a
    Snoop Control Unit (SCU) which implements this protocol. For more information,
    we refer to the "Arm Cortex-A Series Programmer''s Guide for ARMv8-A", [7].


    # 3.5 Address map


    The description of the purpose, size, and position of the address regions for
    memory and peripherals in a system is called the *address map or memory map*.
    Because Arm system can be 32 or 64-bit, the address space ranges from 4GB (32-bit)
    to 1TB (40-bit). The white paper Principles of Arm Memory Maps describes address
    maps for 32, 36 and 40-bit systems, and provides extensions for 44 and 48-bit
    systems.


    Arm harmonized the memory maps across its various systems to provide internal
    consistency and software portability, and to address the constraints that come
    with mixing 32-bit components within larger address spaces. The introduction of
    Large Physical Address Extension (LPAE) to ARM7 CPUs has grown the physical address
    spaces to 36-bit and 40-bits, providing 64GB or 1024GB (1TB) memory space. The
    64-bit ARMv8 architecture addresses 48-bits, providing 256TB.


    | 32-bit | 36-bit | 40-bit |

    |---|---|---||

    | 1024 GB | | | 40-bit |

    | 512 GB | | DRAM | |

    | 256 GB | | 32 GB hole or DRAM | |

    | 128 GB | | Mapped I/O | |

    | 64 GB | | Reserved | 36-bit |

    | 32 GB | | 2 GB hole or DRAM | |

    | 16 GB | | Mapped I/O | |

    | 8 GB | | Reserved | 32-bit |

    | 4 GB | | 2 GB of DRAM | |

    | 2 GB | | Mapped I/O | |

    | 1 GB | | ROM & RAM & I/O | |

    | 0 GB | 32-bit | 36-bit | 40-bit |


