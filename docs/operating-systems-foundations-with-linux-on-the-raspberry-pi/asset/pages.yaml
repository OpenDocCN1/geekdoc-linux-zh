    ```


    syscall() is a small library function that invokes the system call whose assembly
    interface has specified the number with the specified arguments. Allowing syscall()
    is useful, for example, when invoking a system call that has no wrapper in the
    C library. syscall() saves CPU registers before making the system call, restores
    the registers upon returning from the system call, and stores any error code returned
    by the system call in errno(3) if an error occurs. Symbolic constants for system
    call numbers can be found in the header file <sys/syscall.h>.


    The return value is defined by the system call being invoked. In general, a 0
    return value indicates success. A ~1 return value indicates an error, and an error
    code is stored in errno.


    # Architecture calling conventions


    Each ABI (Application Binary Interface) has its own requirements on how system
    call arguments are passed to the kernel. For system calls that have a glibc wrapper
    (e.g., most system calls), glibc handles the details of copying arguments to the
    right registers in a manner suitable for the architecture.


    Every architecture has its own way of invoking and passing arguments to the kernel.
    The details for the (32-bit) EABI and arm64 (i.e., AArch64) are listed in the
    two tables below.


    Table 5.1 The instruction used to transition to kernel mode (which might not be
    the fastest or best way to transition to the kernel, so you may have to refer
    to vdso(7)), the register used to identify the system call number, the register
    used to return the system call result, and the register used to signal an error.


    | ABI | Instruction | Syscall# | Retval | Error |

    |---|---|---|---||

    | arm/EABI | swi #0 | r7 | r0 | - |

    | arm64 | svc #0 | x8 | x0 | - |


    Table 5.2 shows the registers used to pass the system call arguments.


    | ABI | arg1 | arg2 | arg3 | arg4 | arg5 | arg6 | arg7 |

    |---|---|---|---|---|---|---|-|

    | arm/EABI | r0 | r1 | r2 | r3 | r4 | r5 | r6 | |

    | arm64 | x0 | x1 | x2 | x3 | x4 | x5 | - |


    Table 5.2: Registers used to pass the system call arguments.'
