    # 7.6.2 OpenMP


    OpenMP is the de-facto standard for shared-memory parallel programming. It is
    based on a set of compiler directives or pragmas, combining with a API to specify
    regions, data scope, synchronization, etc.. OpenMP is a portable parallel programming
    approach, and the specification supports C, C++, and Fortran. It has historically
    used for data-parallel programming. Since version 3.0, OpenMP also supports task
    parallelism [14]. It is widely used in both task and data parallelism scenarios.
    Since OpenMP is a language enhancement, every new construct requires compiler
    support. Therefore, its functionality is not as extensive as library-based models.
    although OpenMP provides the user with a high level of abstraction, the onus is
    on the programmer to ensure proper synchronization.


    A typical example of OpenMP usage is the parallelization of a for-loop, as shown
    in the following code snippet:


    +   Listing 7.6.7 OpenMP example


    ```

    #include <omp.h>

    //

    #pragma omp parallel \

    shared(collection, vocabulary) \

    private(docsz_min, docsz_max, docsz_mean)

    {

    //

    #pragma omp for

    for (unsigned int docid = 1; docid<NDOCS; docid++) {

    //

    }

    ```


    The #pragma omp for directive will instruct the compiler to parallelize the loop
    (using POSIX threads), treating it effectively as a map. The shared() and private()
    clauses in the #pragma omp parallel let the programmer identify which variables
    are to be treated as shared by all threads or private (per thread). However, this
    clause does not regulate access to the variable, so we require some kind of access
    control. OpenMP provides a number of directives to control access to sections
    of code, the most important of which correspond to concepts introduced earlier:


    #pragma omp critical indicates a critical section, i.e., it specifies a region
    of code that must be executed by one thread at a time.


    #pragma omp atomic indicates that a specific memory location must be updated atomically,
    rather than letting multiple threads attempt to write to it. Essentially, this
    directive provides a single-statement critical section.


