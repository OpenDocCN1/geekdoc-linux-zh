  md: '# Listing 10.6.6: populating the inet socket address for bind()


    ```

    1 mysqld = socket(AF_INET, SOCK_STREAM, 0);

    2 memset((char *) &myaddr, 0, sizeof(struct sockaddr_in)); /*/ zero out socket
    address */

    3 myaddr.sin_len = (u char) sizeof(struct sockaddr_in); /*/ address length */

    4 myaddr.sin_family = AF_INET; /*/ internet family */

    5 myaddr.sin_addr.s_addr = inet_addr("192.168.1.100"); /*/ local IP address */

    6 myaddr.sin_port = htons(3490); /*/ local server port */

    7 bind(mysqld, struct sockaddr_in *) &myaddr, sizeof(struct sockaddr));

    ```


    Note the use of `memset()` from the ANSI string library to zero the internet socket
    address bytes and the internet address manipulation function `inet_addr()` to
    produce the (network byte order)  byte IP address. Using the specific port 0 tells
    `bind()` to choose a unused port - if that is desired than having a fixed server
    port allocation (the selected port gets written to the supplied socket address
    before return). Writing the specific local IP address is not very convenient,
    and the code can be made more portable using the INADDR_ANY predefined prefix
    (defined for use with struct sockaddr_in) which tells `bind()` to use the local
    system IP address automatically (which is also written to the supplied socket
    address before return). Therefore, the server local IP address is more typically
    set using:


    myaddr.sin_addr.s_addr = htonl(INADDR_ANY); /*/ auto local IP address */


    Enable server connection requests: `listen()`

    Once a server socket descriptor has been bound to a socket address it is then
    necessary to enable connection requests to this socket and create an incoming
    request queue using `listen(2)`;


    # Listing 10.6.7: listen(2) API call


    ```

    1 #include <sys/types.h> /** SEE NOTES */

    2 #include <sys/socket.h>

    4 int listen(int sockfd, int backlog);

    ```


    **Return value:** the function returns 0 if okay or -1 if the socket is invalid
    or unable to listen.


    **Input parameters:** incoming connection requests are queued until they are accepted
    or rejected by the server. The parameter `backlog` is used to specify the maximum
    length of this queue and should have a value of at least 1.


    **Accept a server connection request request: `accept()`**

    Server socket connection requests are accepted using `accept(2)`;


    # Listing 10.6.8: accept(2) API call


    ```

    1 #include <sys/types.h> /** See NOTES */

    2 #include <sys/socket.h>

    4 int accept(int sockfd, struct sockaddr *addr, socklen_t *addrlen);

    ```'
