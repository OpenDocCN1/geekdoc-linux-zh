  md: '# Operating Systems Foundations with Linux on the Raspberry Pi


    Each compute device (Figure 7.9) consists of a number of compute units each comprise
    a number of processing elements. All compute units can access the shared compute
    device memory (which consists of a global and a constant memory), optionally via
    a shared cache; each compute unit has local memory accessible by all processing
    elements, and private memory per processing element.


    ![](img/17ca5177da1b1e15b2169f9c7932e5b6_217_0.png)


    Figure 7.9: OpenCL device model [from [20]].


    The programming framework of OpenCL consists of an API for controlling the operation
    of the devices and transfer of data and programs between the host memory and the
    device memory, and a language for writing kernels (the programs running on the
    devices) based on C99, with the following restrictions: no function pointers;
    no recursion; no variable-length arrays; no irreducible control flow. Furthermore,
    it is assumed that memory space of the compute device is not under control of
    the host OS and it does not run its own OS, system calls are not supported either.
    These restrictions originate from the nature of typical OpenCL devices, GPUs.


    ![](img/17ca5177da1b1e15b2169f9c7932e5b6_217_1.png)


