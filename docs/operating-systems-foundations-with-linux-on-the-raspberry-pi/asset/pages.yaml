  md: '# Chapter 9 | Persistent storage


    Another technique to reduce latency is the use of a RAM disk. This involves dedicating
    a portion of memory to be handled explicitly as part of the file system. It makes
    sense for transient files (e.g., those resident in /tmp) or log files that are
    accessed frequently. The kernel has specific support for this mapping of memory
    to file system, called tmpfs. Create a RAM disk of 50MB size as follows:


