  md: '# Operating Systems Foundations with Linux on the Raspberry Pi


    A brief history of Arm, based on an interview from 2012 with Sophie Wilson FRS
    FREng, a British computer scientist and software engineer who designed the Acorn
    Micro-Computer and later the instruction set of the Arm processor, which became
    the facto model used in 21st-century smartphones.

    Image © 2013 Chris Monk, CC BY 2.0, commons.wikimedia.org


    ![](img/17ca5177da1b1e15b2169f9c7932e5b6_73_0.png)


    In 1983 Acorn Computers had produced the BBC Microcomputer. It was designed from
    the outset in order to be able to build both a small cheap machine and a big expensive
    workstation-style machine. This was possible by using two processors: an IO processor
    and a second processor that would do the actual heavy lifting. Arm made many variants
    of the second processor based on existing microprocessors.


    In Sophie''s words, "We could see all that these processors did and what they
    didn''t. So, the first thing they didn''t do was they didn''t make good use of
    the memory system. The second thing they didn''t do was that they weren''t fast,
    they weren''t easy to use." Regarding the rationale behind the design of the original
    Arm processor, Sophie said, "We hoped that we could get to a level such as if
    you wrote in a higher-level language, you could, e.g., write 3D graphics games.
    For the processors that were on sale at the time that wasn''t true. They were
    too slow. So we needed a better processor. We particularly felt we needed a better
    processor in order to compete with what was just beginning to be a flood of IBM
    PC compatibles. So, we ourselves a project slogan which had MIPS for the masses.
    This was very different to what other people were doing at the time. RISC processor
    research had just been sort of released by IBM, by Berkeley, Stanford, and they
    were all after making workstation-class machines that were quite high end. We
    ended up doing the same thing but at the low end, a machine for the masses that
    would be powerful but not super powerful"


    "ARM was that machine: a machine that was MIPS for the masses. We started selling
    ARM powered machines in 1986, 1987. The things we didn''t endow it, what we set
    Arm up to be, with its cheap and powerful mindset, were the things that became
    valuable. When people wanted to put good amounts of processing into something,
    that was the really important attribute"


    "We designed a deeply embedded processor, or an embedded processor, without consciously
    realizing it in our striving for what we thought would be ideal for our marketplace;
    that''s what''s really mattered. As a sort of effect of making the chip and simple
    to use, we also ended up making it power efficient; that wasn''t intentional.
    In hindsight, it was an obvious consequence. We had only 25,000 transistors in
    the first one. We were worried about power dissipation. We needed something that
    would be mass produced and put into cheap machines without heat sinks and that
    sort of thing. There were already some aspects of power conservation in the design,
    but we performed better than that and as the world has gone increasingly mobile
    that aspect of Arm has matured as well. But to start off, we designed a really
    good, deeply embedded processor."'
