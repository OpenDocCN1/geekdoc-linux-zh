    # 5.4.1 The Linux syscall (2) function


    ```

    Listing 5.4.1 Linux syscall

    ```c

    1 #define GNU_SOURCE /* See feature_test_macros(7) */

    2 #include <unistd.h>

    3 #include <sys/syscall.h> /* For SYS xxx definitions */

    4 long syscall(long number, ...);

