  md: '# 4.2.3 Doing something different


    The fork call allows us to start a new process, but the child is almost exactly
    a replica of the parent. How do we execute a different program in a child process?
    Linux supports this with the exec system call, which replaces the currently running
    process with data from a specified binary. The first parameter is the name of
    the executable file, the second parameter is the argument vector (effectively
    argv in C), and the third parameter is a set of environment variables, as key/value
    pairs.


    ```

    Listing 4.2.3: Example of execve() in Python

    ```python

    import os

    os.execve("/bin/ls", ["ls", "-l", "*"], {})

    ```

    ```


    This is precisely how an interactive shell, like bash, launches a new program;
    the first shell calls execve to load the new program binary that the user wants
    to run.


    The exec call does not return unless there is an error that prevents the new program
    from executing. See man execve for details of errors, in which case execve returns
    -1. There are other variants of execve, which you can find via man execl.


    In Linux, the fork operation is implemented by the underlying clone system call.
    The clone function allows the programmer to explicitly specify which parts of
    the old process are duplicated for the new process, and which parts are shared
    between the two processes. A clone call allows the child to share parts of its
    context, as the virtual address space, with the parent process. This allows us
    to support threads as well as processes with a single API, which is the implementation
    basis of the Native Posix Threads Library (NPTL) in Linux. For instance, the pthread_create
    function invokes the clone system. Torvalds [1] gives a description of the design
    rationale for clone.


    # 4.2.4 Ending a process


    A parent process can block, waiting for a child process to complete. The parent
    calls the wait function for this purpose. Conversely, a child process can complete
    by calling the exit function with a status code argument (a non-zero value completely
    indicates an error). Alternatively, the child process may terminate by returning
    from its main routine.


    The example C code below illustrates the duality between wait in the parent and
    exit in the child processes.


    ```

