    # Real-time processes


    There is a single command to control the real-time properties of a process, chrt.
    This command sets and retrieves the real-time scheduling attributes of a running
    process or runs the command with the given attributes. There are a number of flags
    that allow us to set the scheduling policy (-other, -fifo, -rr, -batch, -idle,
    -deadline).


    For example:


    ```

    Listing 5.8.30: Use of the chrt command

    ```bash

    $ chrt --batch 0 pwd

    ```

    ```


    All real-time policies require super privileges, for example:


    ```

    Listing 5.8.31: Use of the chrt command

    ```bash

    $ sudo chrt --rr 32 pwd

    ```

    ```


    The -deadline policy only works with sporadic tasks that have actual runtime,
    deadline, and period attributes via the sched_setattr system call.


    # 5.9 Summary


    In this chapter, we have introduced the concept of scheduling, the rationale behind
    it, and how it relates to the process life cycle and the concept of system calls.
    We have discussed the scheduling principles and criteria and covered a number
    of scheduling policies, both the basic policies and the more advanced policies
    used in the Linux kernel, including soft and hard real-time scheduling policies.
    We have applied all this basic scheduling theory in a study of the Linux scheduler,
    covering the actual data structures and algorithms used by the different schedulers
    supported by the Linux kernel, the Completely Fair Scheduler, the soft real-time
    scheduler, and the hard real-time scheduler.


