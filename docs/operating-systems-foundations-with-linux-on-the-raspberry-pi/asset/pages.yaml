  md: '# # Introduction to System-on-Chip Design

    Online Courses


    The Internet of Things promises devices endowed with processing, memory, and communication
    capabilities. These processing nodes will be, in effect, simple Systems-on-Chips
    (SoCs). They will need to be inexpensive, and able to operate under stringent
    performance, power and area constraints.


    The Introduction to System-on-Chip-Design Online Course focuses on building SoCs
    around Arm Cortex-M0 processors, which are perfectly suited for IoT needs. Using
    FPGAs as prototyping platforms, this course explores a typical SoC development
    process: from creating high-level functional specifications to design, implementation,
    and testing on real FPGA hardware using standard hardware description and software
    programming languages.


    Learning outcomes:


    +   - Knowledge and understanding of

    - Arm Cortex-M processor architectures and Arm Cortex-M based SoCs

    - Design of Arm Cortex-M based SoCs in a standard hardware description language

    - Low-level software design for Arm Cortex-M based SoCs and high-level application
    development


    Intellectual


    +   - Ability to use and choose between different techniques for digital design
    and capture

    - Ability to evaluate implementation results (e.g., speed, area, power) and correlate
    them with the corresponding high-level design and capture


    Practical


    +   - Ability to use commercial tools to develop Arm Cortex-M based SoCs


    Course Syllabus:


    Prerequisites: Basics of hardware description language (Verilog or VHDL), Basic
    C, and assembly programming.


    Modules


    ![](img/17ca5177da1b1e15b2169f9c7932e5b6_338_0.png)'
  merge: -1
