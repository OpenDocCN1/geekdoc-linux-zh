  md: '# Operating Systems Foundations with Linux as the Raspberry Pi


    # 4.1 Overview


    Processes are in execution. Have you ever seen a whale skeleton displayed in a
    museum? This is like a program—it''s a static object, see Figure 4.1. Although
    it has shape and structure, it''s never going to ''do'' anything of interest.
    Now think about a live whale swimming through the ocean, see Figure 4.2. This
    is like a process—it''s a dynamic object. It incorporates the skeleton structure,
    but it has more attributes and is capable of activity.


    In this chapter, we explore what Linux processes look like, how they operate,
    and how they enable multi-program execution. We outline the context that needs
    to be encapsulated in a process. We walk through the process lifecycle, considering
    typical operations that will be performed on a process.


    ![](img/17ca5177da1b1e15b2169f9c7932e5b6_95_0.png)


    ![](img/17ca5177da1b1e15b2169f9c7932e5b6_95_1.png)


    Figure 4.1: Blue whale skeleton at the Natural History Museum in London. Photo
    by author.


    Figure 4.2: Blue whale swimming in the ocean. Public domain photo by NOAA.


    # What you will learn


    After you have studied the material in this chapter, you will be able to:


    +   1. Describe why processes are used in operating systems.

    2. Justify the need for relevant metadata to be maintained for each process.

    3. Sketch an outline data structure for the process abstraction.

    4. Recognize the state of processes on a running Linux instance.

    5. Develop simple programs that interact with processes in Linux.


    # 4.2 The process abstraction


    A process is a program in execution. A program consists only of executable code
    and static data. These are stored in a binary format, such as an ELF object or
    a Java class file. On the other hand, a process also encapsulates the runtime
    execution context. This includes the program counter, stack pointer and other
    hardware register values for each thread of execution, so we know whereabouts
    we are in the program execution. The process also records memory management information.
    Furthermore, the process needs to keep track of owned resources such as open file
    handles and network connections.'
