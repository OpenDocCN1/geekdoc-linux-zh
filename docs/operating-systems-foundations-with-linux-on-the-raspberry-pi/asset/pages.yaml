  md: "# Linux kernel implementation of select()\n\nThe `select()` call works by looping\
    \ over the list of file descriptors. For every file descriptor, it calls the `poll()`\
    \ method, which will add the caller to file descriptor's wait queue, and return\
    \ which events (readable, writable, exception) currently apply to that file descriptor.\n\
    \nThe implementation of the `poll()` method depends on the corresponding device\
    \ driver, but all implementations have the following prototype:\n\nListing 10.6.28:\
    \ Linux kernel poll() method prototype\n\n```\nunsigned int (*poll)(struct file\
    \ *, poll_table *);\n```\n\nThe driver's method will be called whenever the `select()`\
    \ system call is performed. It is responsible for monitoring one or more wait\
    \ queues that could indicate a change in the poll status.\n\n+   * `poll_wait()`\
    \ on one or more wait queues that could indicate a change in the poll status.\n\
    * Return a bitmask describing operations that could be immediately performed without\
    \ blocking.\n\nThe `poll_table` struct (the second argument to the `poll()` method),\
    \ is used within the kernel to implement the `poll()` and `select()` calls; it\
    \ is defined in linux/poll.h as a struct which contains a method to operate on\
    \ a poll queue and a bitmask.\n\nListing 10.6.29: Linux kernel poll table struct\n\
    \n```\ntypedef struct poll_table_struct {\n    poll_queue_proc _qproc;\n    __poll_t\
    \ _key;\n} poll_table;\n```\n\nAn event queue that can wake up the process and\
    \ change the status of the poll operation can be added to the `poll_table` structure\
    \ by calling the function `poll_wait()`,\n\nListing 10.6.30: Linux kernel poll_wait()\n\
    \n```\nstatic inline void poll_wait(struct file * filp,\n    wait_queue_head_t\
    \ * wait_address, poll_table *p){\n    if (p && p->_qproc && wait_address)\n \
    \       p->_qproc(filp, wait_address, p);\n}\n```"
