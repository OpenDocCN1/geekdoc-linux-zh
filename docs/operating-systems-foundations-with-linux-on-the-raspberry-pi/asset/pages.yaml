    # 7.6.3 Message passing interface (MPI)


    The Message Passing Interface (commonly known under its acronym MPI) [16] is an
    API specification designed for high-performance computing. Since MPI provides
    a distributed memory model for parallel programming, its main targets have clusters
    and multiprocessor machines. The message passing model models tasks that do not
    share any memory. Every task has its own memory, and any communication between
    tasks is via the exchange of messages.


    In MPI, the two basic routines for sending and receiving messages are MPI_Send
    and MPI_Recv:


    ![](img/17ca5177da1b1e15b2169f9c7932e5b6_215_1.png)


    ```

    1 int MPI_Send(void *buf, int count, MPI_Datatype datatype, int dest, int tag,

    2 MPI_Comm comm)

    3 int MPI_Recv(void *buf, int count, MPI_Datatype datatype, int source, int tag,

    4 MPI_Comm comm, MPI_Status *status)

    ```


    The buffer contains the data to send or receive, the count its size in multiples
    of the specified datatype. Further arguments are the destination (dest) or source
    (source) rank. These are usually called ranks, i.e. "a sender with rank X to a
    receiver with rank Y." The two remaining fields, tag, and communicator, require
    a bit more detail.


    The communicator is essentially an object describing a group of processes that
    can communicate with one another. For simple problems, the default communicator
    MPI_COMM_WORLD can be used, but custom communicators allow, for example, collective
    communication between subsets of all'
