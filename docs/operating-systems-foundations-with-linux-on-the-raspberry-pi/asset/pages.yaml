    # 5.7.2 Round-robin (RR)


    Round robin is another very simple scheduling policy that is nevertheless very
    wisely used. We introduced it already in Chapter 1. This policy consists of running
    every task for a fixed amount of time.This amount of time is known as the time
    slice or scheduling quantum. The choice of the quantum is crucial: if it is too
    long, the system will become unresponsive; if it is too short, the context switching
    overhead will be considered. As mentioned in the previous chapter, you can check
    this value on your Linux system using:


    ```

    Listing 5.7.1: Linux round-robin quantum from /proc/

    1 cat /proc/sys/kernel/sched_rr_timeslice_ma

    ```


    On the Raspberry Pi 3, it is 10 ms.


