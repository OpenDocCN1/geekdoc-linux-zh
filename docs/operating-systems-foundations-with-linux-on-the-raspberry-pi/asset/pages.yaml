    # 3.6 Direct memory access


    Direct memory access (DMA) is a mechanism that allows blocks of data to be transferred
    to or from devices with no CPU overhead. The CPU manages DMA operations by submitting
    DMA requests to a DMA controller. While the DMA transfer is progress, the CPU
    can continue executing code. When the DMA transfer is completed, the DMA controller
    signals the CPU via an interrupt.


    DMA is advantageous if large blocks of memory have to be copied or if the transfer
    is repetitive because both cases would otherwise consume a considerable amount
    of CPU time. Like most modern operating systems, Linux supports DMA transfers
    through a kernel API, if the hardware has DMA support. It should be noted that
    this does not require special instructions:the DMA controller is memory-mapped,
    and the CPU simply writes the request to that region of memory.


    ![](img/17ca5177da1b1e15b2169f9c7932e5b6_88_0.png)


    Figure 3.13: Example system with Cortex-A and CoreLink DMA controller.


    Arm processors do not include a DMA engine as part of the CPU core. Arm provides
    dedicated DMA controllers such as the lightweight PrimeCell uDMAController [8],
    a very low gate DMA controller compatible with the AMBA-AHB-Lite protocol used
    in the Cortex-M series, and the more advanced CoreLink DMA-330 DMA Controller
    [9] which has a full AMBA-compliant interface or for the SoC manufacturers can
    provide their own DMA engines. Figure 3.13 shows an example system with the CoreLink
    DMAC. In the Cortex M series, the DMA controller will be a peripheral on the the
    AHB bus.


