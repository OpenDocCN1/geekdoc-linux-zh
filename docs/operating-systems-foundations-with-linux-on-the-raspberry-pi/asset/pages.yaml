  md: '# 2.2.1 Operating system hierarchy


    The Linux kernel is only one component of the complete operating system. Figure
    2.1 illustrates the complete Linux system hierarchy. Interfacing between the kernel
    and the user space applications is the system call interface, a mechanism to allow
    user space applications to interact with the kernel and hardware. This interface
    is used by system tools and libraries, and finally by the user applications. The
    kernel provides functionality such as scheduling, memory management, networking
    and file system, and support for interacting with system hardware via device drivers.


    Interfacing between the kernel and the hardware are device drivers and the firmware.
    In the Linux system, device drivers interact closely with the kernel, but they
    are not considered part of the kernel because depending on the hardware different
    drivers will be needed, and they can be added on the fly.


    # 2.2.2 Processes


    A process is a running program, i.e., for the program and all system resources
    it uses. The concept of a process is used for the separation of code and resources.
    The OS kernel allocates memory resources and other resources to a process, these
    are private to the process, and protected from all other processes. The scheduler
    allocates time for a process to execute. We also use the term task, which is a
    bit less distinct, and usually relates to scheduling: a task is an amount of work
    to be done by a program. We will also see the concept of threads, which are used
    to indicate multiple concurrent tasks executing within a single process. In other
    words, the threads of a process share its resources. For a process with a single
    thread of execution, the task and process are often used interchangeably.


    When a process is created, the OS kernel assigns it a unique identifier (called
    process ID or PID for short) and creates a corresponding data structure called
    the Process Control Block or Task Control Block (in the Linux kernel this data
    structure is called task_struct). This is the main mechanism the kernel uses to
    manage processes.


    ![](img/17ca5177da1b1e15b2169f9c7932e5b6_56_0.png)'
