  md: '# Operating Systems Foundations on Linux on the Raspberry Pi


    most commonly used 32-bit instructions. Thumb instructions have corresponding
    32-bit instructions that have the same effect on the processor model. Thumb instructions
    operate with the standard Arm register configuration. On execution, 16-bit Thumb
    instructions are transparently decompressed to full 32-bit Arm instructions in
    real-time, without performance loss. For more details, we refer to [2]. Figure
    3-4 illustrates the various Arm instruction sets and the purposes of the Armv6
    Thumb instruction set is very small and it is a very reduced subset of the complete
    Thumb instruction set.


    # 3.3.3 System timer


    An interesting feature of the Cortex-M0+ is the optional 24-bit System Timer (SysTick).
    This timer can be used by an operating system. It can be polled by software or
    can be configured to generate an interrupt. The SysTick interrupt has its own
    entry in the vector table and therefore can have its own handler. The SysTimer
    is controlled via a set of special system control registers.


    # 3.3.4 Processor mode and privileges


    The Cortex-M0+ processor supports the Armv6-M Thread and Handler mode through
    a control register (CONTROL) and two stack pointers, Main Stack Pointer (MSP)
    and Process Stack Pointer (PSP) as explained in Chapter 1. Thread mode is used
    to execute application software. The processor enters Thread mode when it comes
    out of reset. Handler mode is used to handle exceptions. The processor returns
    to Thread mode when it finished all exception processing.


    It also (optionally) supports different privilege levels for software execution
    as follows:


    +   * Unprivileged: The software has limited access to the MSR and MRS instructions,
    and cannot use the CPS instruction or access the system timer, NVIC, or system
    control block. It might have restricted access to memory or peripherals.


    +   * Privileged: The software can use all the instructions and has access to
    all resources.


    In Thread mode, the CONTROL register governs whether software execution is privileged
    or unprivileged. In Handler mode, software execution is always privileged. Only
    privileged software can write to the CONTROL register to change the privilege
    level for software execution in Thread mode. Unprivileged software can use the
    SVC instruction to make a supervisor call to transfer control to privileged software.


    # 3.3.5 Memory protection


    The Cortex-M0+ (optional) supports memory protection through an optional Memory
    Protection Unit (MPU). When implemented, the processor supports the Armv6 Protected
    System Architecture model [2]. The MPU provides support for protection regions
    with priorities and access permissions. The MPU can be used to enforce privilege
    rules, separate processes, and manage memory attributes.


    Considering the above features, in principle, the M0+ is capable of running an
    OS like Linux. In practice, embedded systems with a Cortex-M0+ will not have sufficient
    storage and memory to run Linux, but they can support other OSs such as freeRTOS.²


    > ² https://www.freertos.org/'
