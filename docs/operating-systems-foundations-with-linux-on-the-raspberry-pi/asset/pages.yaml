  md: '# 9.7 File metadata


    Metadata describes the properties of each file. There is a standard set of attributes
    that the Linux file system supports directly, so these items are recorded for
    all files.


    This includes user-centric metadata, such as the textual name and type of the
    file. The type is conventionally encoded as part of the name, a suffix after the
    final character in the name. Particular file system formats may impose restrictions
    on names, such as their length or permitted characters.


    The file name is a human-friendly label for the user to specify the file of interest.
    However, the file system maintains a unique identifier for each file, which is
    used internally. It is the case that multiple names may actually map to the same
    file (i.e., the same numeric acyclic graph directory structure of Linux), as explained
    in Section 9.2.2.


    The size of the file is specified in bytes, i.e., its length. The file occupies
    some number of blocks on a device, these blocks may not be full if the file size
    is not a precise multiple of the block size. Unlike null-terminated C-style strings,
    there is no explicit-of-file (EOF) marker. Instead, we must use the length of
    the file to determine when we reach the end of its data.


    File access metadata is supported in Linux. Each file has an owner (generally
    the creator of the file, although the chown command can modify the owner). Each
    file has a group (to which the owner or may not belong; the chgrp command can
    modify the group). The owner and group are encoded as integers, which may be looked
    up in the relevant tables in /etc/passwd and /etc/group files.


    For permissions, there are nine bits of metadata, three for the owner, the group,
    and everyone else. Each triple of bits (from most significant to least significant
    bit) encodes read, write and execute permission respectively. Figure 9.6 illustrates
    these bits. This metadata can be set using the chown command, followed by octal
    numbers for the triplets. More advanced capabilities and fine-grained permissions
    are supported by the SELinux system.


    ![](img/17ca5177da1b1e15b2169f9c7932e5b6_250_0.png)


    Timestamp fields record creation time, most recent edit time, and most recent
    access time for each file. These are recorded as seconds since 1970, the start
    of the Unix epoch. Since they are signed 32-bit integers, the maximum timestamp
    that can be encoded is some time on 19 January 2038.'
