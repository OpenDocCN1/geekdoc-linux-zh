    \ handlers are forced. Furthermore, several substitution mechanisms, like sleeping\
    \ spinlocks and rt_mutex are implemented to reduce preemption disabled sections.\
    \ Additionally, large preemption disabled sections are substituted by separate\
    \ locking constructs. This preemption model has be selected in order to obtain\
    \ real-time behavior.\n\n# 5.8.8 Red-black tree in the Linux kernel\n\nThe Linux\
    \ kernel uses a red-black tree as the implementation of its priority queues. The\
    \ red-black tree is a self-balancing binary search tree with O(log n) guarantees\
    \ on accessing (search), insertion and deletion of node. More specifically, the\
    \ height H of a red-black tree with n nodes (the length of the path from the root\
    \ to the deepest node in the tree) is bounded:\n\nlog (n + 1) ≤ H ≤ 2 log n\n\n\
    The implementation of the red-black tree in the Linux kernel is lib/rbtree.c,\
    \ the API is include/linux/rbtree.h and the data structure is documented in rbtree.txt.\
    \ The API is quite simple, as illustrated by example in the documentation:\n\n\
    # Creating a new rbtree\n\nData nodes in the rbtree tree are structures containing\
