  md: '# Chapter 7 | Concurrency and parallelism


    processes. An important point is that the rank of a process is specific to the
    communicator being used, i.e., the same process will typically have different
    ranks in different communicators.


    The tag is an arbitrary integer that is used for matching of point-to-point messages
    like and receive: if a sender sends a message to a given destination with rank
    dest with a comm and a tag, then the receiver must match all of these specifications
    to receive the message, i.e., it must specify as its communicator, tag for its
    tag (or the special wildcard MPI_ANY_TAG), and the rank of the sender as the source
    (or the special wildcard MPI_ANY_SOURCE).


    The MPI specification has evolved considerably since its initial release in 1994.
    For example, MPI-1 already provided point-to-point and collective message communication.
    Messages could contain either primitive or derived data types packed in unpacked
    or packed data content. MPI-2 added dynamic process creation, one-sided communication,
    remote memory access, and parallel I/O.


    Since there are lots of MPI implementations with emphases on different aspects
    of high-performance computing, Open MPI [17], an MPI-2 implementation, evolved
    to combine these technologies and resources with the main focus on the compon
    concepts. The specification is very extensive, with almost 400 API calls.


    MPI is portable, and in general, an MPI program can run on shared memory and distributed
    memory systems. However, for performance reasons and due to the distributed nature
    of the model, there might exist multiple copies of the global data in a shared
    memory machine, resulting in increased memory usage. Message buffers also introduce
    the overhead of MPI on shared-memory platforms [18]. Furthermore, because the
    API is both low level and very extensive, MPI-programming, especially for performance,
    tends to be complicated.


