  md: '# 9.11.3 Journaling

    ext ext4 file system supports a journal, a dedicated log file that records each
    change that is to occur the file system. An append-only log file like this is
    vital when complex file system operations may be scheduled, which would cause
    file system corruption if they start but do not complete, due to power failure.
    The log may be consulted on system restart to recover the file system to a consistent
    state, either replaying or undoing the partial actions.


    Transaction records are added to the log rapidly and atomically. The journal file
    is effectively a circular buffer, so older entries are overwritten when it fills
    up. Examine the file /proc/fs/jbd2/info to see statistics about the number of
    transaction entries in the log.


    # 9.11.4 ChecksummingnA checksum is a bit-level error detection mechanism. This
    is highly useful for persistent storage, where there is a possibility of data
    corruption.


    The most popular algorithm is CRC32c, which generates a 32-bit checksum for an
    arbitrary size input array. The CRC32c algorithm may be implemented efficiently
    in software, although some Arm CPUs have a built-in instruction to perform the
    calculation directly.


    The ext4 file system supports CRC32 checksums for metadata. Try the following
    grep command to explore fields that have checksums attached:


    ```

    9.11.2: Find checksum fields

    1 cd linux/fs/ext4/

    2 grep crc *

    ```


    Some checksums are embedded in top-level file system metadata. These include checksum
    fields in the superblock and the block group descriptor, although each 32-bit
    value may be split across two 16-bit fields in these structures. Checksums are
    ideal when are redundant copies of such metadata. If superblock corruption is
    detected, the metadata can be easily restored by cloning a reserve copy.


    Each block group bitmap that tracks free inodes or data blocks also has a checksum
    to ensure its integrity. Further, there are checksums for individual file metadata.
    Each inode has its own checksum field. There are checksums for some location metadata
    (extent trees) and extended attributes.


    Some systems like btrfs and zfs store checksums for all blocks, including data
    blocks. On the other hand, ext4 only supports checksums for file system metadata.


    # 9.11.5 EncryptionnEncryption involves protecting data by means of a secret key,
    usually a text string. The data appears to be gibberish without this key. Encryption
    is used for portable devices or scenarios where untrusted individuals can access
    the file system. Security is particularly important for corporate organizations,
    given recent developments in data protection legislation.'
