  md: '# # Preface


    # ## Introduction


    Modern computer devices are fabulously complicated both in terms of the processor
    hardware and the software they run.


    at the heart of any modern computer device sits the operating system. And if the
    device is a smartphone, IoT node, datacentre server or supercomputer, then the
    operating system is very likely to be Linux: at about half of consumer devices
    run Linux; the vast majority of smartphones worldwide (86%) run Android, which
    is built on the Linux kernel. Of the the top one million web servers, 98% run
    Linux. Finally, the top 500 fastest supercomputers in the world run Linux.


    on the hardware side, Arm has a 95% market share in smartphone and tablet processors
    as well as being used in the majority of Internet (IoT) devices such as webcams,
    wireless routers, etc. and embedded devices in general.


    s its creation by Linux Torvalds in 1991, the efforts of thousands of people,
    most of them volunteers, have turned Linux into a state-of-the-art, flexible and
    powerful operating system, suitable for any system from tiny IoT devices to the
    most powerful supercomputers.


    while, in roughly the same period, the Arm processor range has expanded to cover
    an equally wide gamut of systems and devices, including the remarkably successful
    Raspberry Pi.


    if you want to learn about Operating Systems but keep a practical, real-world
    focus, this book is an ideal starting point. This book will help you answer questions
    such as:


    +   * What is a file, and why is the file concept important in Linux?

    * What is scheduling and how can knowledge of Linux scheduling help you create
    a high-throughput video processor or a mission-critical real-time system?

    * What are POSIX threads, and how can the Linux kernel assist you in making your
    multithreaded applications faster and more responsive?

    * How does the Linux kernel support networking, and how do you create network
    clients and servers?

    * How does the Arm hardware assist the Linux kernel in managing memory and how
    does understanding memory management make you a better programmer?


    The aim of this book is to provide a practical introduction to the foundations
    of modern operating systems, with a particular focus on GNU/Linux and the Arm
    platform. Our unique perspective is that we explain operating systems theory and
    concepts but ground them in practical use through illustrative examples of their
    implementation in GNU/Linux, as well as making the connection with the Arm hardware
    supporting the OS functionality.'
  merge: -1
  pgno: 19
- img_proc: true
  md: '# Is this book suitable for you?


    This book does not require prior knowledge of operating systems, but some familiarity
    with command-line operations in a GNU/Linux system is expected. We discuss technical
    details of operating systems, and we use source code to illustrate many concepts.
    Therefore, you need to know C and Python, and you need to be familiar with basic
    data structures such as arrays, queues, stacks and trees.


    This textbook is ideal for a one-semester course introducing the concepts and
    principles underlying modern operating systems. It complements the Arm online
    courses in Real-Time Operating Systems Design and Programming, and Embedded Linux.


    # Online additional material


