    # Mutexes


    POSIX mutexes are defined as an opaque type pthread_mutex_t (effectively a small
    integer). The API is simple and simple:


    ```

    ### Listing 7.3.24: POSIX mutex API

    ```c

    // To create mutex:

    pthread_mutex_t lock = PTHREAD_MUTEX_INITIALIZER;

    // or

    int pthread_mutex_init(pthread_mutex_t *mutex, const pthread_mutexattr_t *attr);

    //

    // To destroy a mutex:

    int pthread_mutex_destroy(pthread_mutex_t *mutex);

    //

    // To lock/unlock the mutex:

    int pthread_mutex_lock(pthread_mutex_t *lock);

    int pthread_mutex_unlock(pthread_mutex_t *lock);

    ```

    ```


    # Semaphores


    POSIX semaphores (defined in <semaphore.h>) are counting semaphores as introduced
    above, i.e., the block on attempt to decrement them when the counter is zero.
    The Linux man page sem-overview(7) provides a overview. The semaphore is defined
    using the opaque type sem_t_. The P and V operations are called sem_wait() and
    sem_post():


    ```

    ### Listing 7.3.25: POSIX semaphore API

    ```c

    // Separate header file, not in <pthread.h>

    #include <semaphore.h>

    // V operation

    int sem_post(sem_t *sem);

    // P operation

    int sem_wait(sem_t *sem);

    // Variants

    int sem_trywait(sem_t *sem);

    int sem_timedwait(sem_t *sem, struct timespec *abs_timeout);

    ```

    ```


    The sem_wait() sem_trywait() returns an error if the decrement cannot be immediately
    performed instead of blocking. The variant sem_timedwait() allows to set a timeout
    on the waiting time. If the timeout expires while the semaphore is still blocked,
    an error is returned.


    POSIX semaphores come in two forms: named semaphores and unnamed semaphores.


    # Named semaphores


    A named semaphore is identified by the form "sem/name", i.e., a null-terminated
