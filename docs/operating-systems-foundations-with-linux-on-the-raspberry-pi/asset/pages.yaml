    # 1.4 Advanced processor model


    The bare-bones model is missing a few features that are essential to support an
    operating system; in this, we introduce these features and add them to the model.


    # 1.4.1 Stack support


    A stack is a contiguous block of memory that is accessed in LIFO (last in, first
    out) fashion. Data is added to the top of the stack using a ''push'' operation
    and taken from the top of stack using a ''pop'' operation. Stacks are used to
    store temporary data, and they are commonly used to handle function calls. Most
    computer architectures include at least a register that is usually reserved for
    the stack pointer (e.g., as we have seen the Arm processor has a dedicated ''SP''
    register) as well as ''PUSH'' and ''POP'' instructions to access the stack. In
    our model, we will implement the stack as part of the RAM memory, and define the
    push and pop operations as in the Arm instruction set, for example:'
