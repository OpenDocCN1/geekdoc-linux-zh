  md: '# Chapter 6 | Memory management


    Some pages are obvious candidates for swapping out: these clean pages whose data
    is already in the backing store, e.g., executable code, other memory-mapped files,
    or pages in the swap cache. Pages can be discarded without copying any data since
    the data is already stored elsewhere. On the other hand, dirty pages have been
    updated since they were read from backing store; other pages (e.g., anonymous
    process pages) may never have been written to the backing store. Such pages must
    have their data transferred to persistent storage before they can be swapped out.


    It is not efficient to swap out pages if their data may be required in the near
    future since the swap operation will be followed swiftly by a swap of the same
    data.


    Bélady’s optimal page replacement policy is a theoretical oracle that looks into
    the future, to select a candidate page for replacement that will not be used again,
    or will only be used in the future than any other page currently resident. Since
    this abstraction is not implementable, Linux assumes that, if a page has not been
    used in the recent past, then it is unlikely to be used again in the near future.
    This is the principle of temporal locality.


    Two memory manager mechanisms are used to keep track of page usage over time:


    +   1. Each page has an associated metadata bit that may be set when the page
    is accessed.


    +   2. Pages may be stored in a doubly-linked list that approximates least-recently-used
    (LRU) order.


    Pages grow older as they are not accessed over time; old pages are ideal candidates
    for swapping out. Below we review several page replacement policies.


    # Random


    The simplest page replacement algorithm does not take page age or usage into account.
    It selects a random victim page to be swapped out immediately, to make space for
    a new page.


    # Not recently used


    A page is not recently used (NRU) if its access metadata bit is unset. Such a
    page is a good candidate for replacement. The NRU algorithm might work as follows:


    +   1. A page $p$ is randomly selected as a candidate.


    +   2. If $p$ access bit is set, go back to (1).


    +   3. Assert $p$ access bit is unset, and select $p$ for replacement.


    There is no guarantee of termination with NRU, since all pages may have access
    bits set. We assume the OS will periodically unset all bits.


    # Clock


    The clock algorithm keeps a circular list of pages. There is a conceptual ‘hand’
    that points to the next candidate page for replacement, see Figure 6.13. When
    a page replacement needs to take place,'
