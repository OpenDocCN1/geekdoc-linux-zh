    #  1.2.2 What is this ''system state''?


    We say that the processor "modifies the system state", let''s take a closer look
    at this system state. From the point of view of the processor, the system state
    is simply a fixed-size array of unsigned integers. Number more than that. In C
    syntax, we can express this as shown in Listing 1.2.2:


    | Listing 1.2.2 System state as C array |

    |---||

    | 1 | int systemState[STATE_SZ] |


    Which means that manipulation of the system state, and by consequence, anything
    that happens in a processor-based system boils down to modifying this array.


    So, what does this array actually represent? It represents all of the memory in
    the system, not just the actual system memory (DRAM, Dynamic Random Access Memory)
    including the I/O devices and other peripherals such as disks. In system terms,
    this is known as the ''physical address space'', and we will discuss this in detail
    in Chapter 6, ''Memory management.''


    In other words, the system state is composed of the states of all the system components,
    for example a system with a keyboard kbd, network interface card nic, solid state
    ssd, graphics processing gpu, and random access memory ram:


    ```

    systemState = ramState + kbdState + nicState + ssdState + gpuState

    ```


    Where ramState, kbdState, nicState, etc. are all fixed-size arrays of integers.


    However, it could of course be:


    ```

    systemState = ssdState + kbdState + nicState + ramState + gpuState

    ```


    The above are two examples of address space layouts. The description of the purpose,
    size, and position of the address regions for memory and peripherals is called
    the address map. As an illustration, the Arm address map for A-class systems [1]
    is shown in Figure 1.1.'
