  md: '# Operating Systems Foundations with Linux on the Raspberry Pi


    By contrast, the Arm Cortex A53, used in the Raspberry Pi 3, is a mid-range, low-power
    processor that implements the Armv8-A architecture. The Cortex-A53 processor has
    four cores, each with an L1 memory system and a single L2 cache. It is a 64-bit
    processor which supports the AArch64 and AArch32 (including Thumb) execution modes.
    It is intended as an Application Processor for application domains such as mobile
    computing, smartphones, and energy-efficient servers.


    All Arm processors use the Advanced Microcontroller Bus Architecture (AMBA), an
    open-standard specification for the connection and management of functional blocks
    in system-on-chip (SoC) designs.


    All Arm processors have a RISC (Reduced Instruction Set Computing) architecture¹.
    RISC architecture based processors typically require fewer transistors than those
    with a complex instruction setting (CISC) architectures (e.g., x86), which can
    result in lower cost and lower power consumption. Furthermore, as the instructions
    are simpler, most instructions can be executed in a single cycle, which makes
    instruction pipelining simpler and more efficient. The complex functionality supported
    in a RISC instruction set is achieved through a combination of multiple RISC instructions.


    Typically, RISC machines have a large number of general-purpose registers (while
    CISC machines have more special-purpose registers). In a RISC architecture, any
    register can contain either data or an address. Furthermore, a RISC processor
    typically operates on data held in registers. Separate load and store instructions
    transfer data between the register bank and external memory (this is called a
    load-store architecture).


    # 3.3 Arm Cortex M0+


    The Arm Cortex-M0+ is a low-spec embedded processor, typically used for applications
    that need lower power and don''t need full OS. Figure 3.2 shows the Arm MPS2+
    Prototyping Board for Cortex-M based designs, an FPGA development platform supporting
    the entire Cortex-M processor range except for the M23 and M33. The functional
    block diagram of the Cortex-M0+ processor [2] is shown in Figure 3.3. The Cortex-M0+
    uses the AHB-Lite (Advanced High-performance Bus Lite) Lite bus standard. AHB-Lite
    is a bus interface that supports a single bus master and provides high-bandwidth
    operation.


    ![](img/17ca5177da1b1e15b2169f9c7932e5b6_75_0.png)


    Figure 3.2: Arm MPS2+ FPGA Prototyping Board for Cortex-M based designs. Photo
    by author.


    ¹ The name ARM was originally an acronym for Acorn RIS Machine and was altered
    to Advanced RISC Machines.'
