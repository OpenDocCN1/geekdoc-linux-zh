  md: '# 8.4 Communicating with Devices


    # 8.4.1 Device Abstractions


    From user space, devices generally appear like files, and processes interact with
    devices using standard API calls like open and read. Some devices support special
    commands, accessed using the generic ioctl system call on Linux. We use ioctl
    for device-specific commands that cannot be mapped easily onto the file API.


    A simple example involves the console. It is possible to set the status LEDs for
    an attached keyboard using iotctl. The Python script below flashes the scroll
    lock on then off for two seconds. Try this on your Raspberry Pi with a USB keyboard
    attached.


    ![](img/17ca5177da1b1e15b2169f9c7932e5b6_232_0.png)


    ```

    import fcntl

    import os

    import time


    SETLED = 0x4b32

    SCROLL LED = 0x01

    NUMKL LED = 0x02

    CANLK LED = 0x04

    RESET_ALL = 0x08


    console_fd = os.open(''/dev/console'', os.O_NOCTTY)

    fcntl.ioctl(console_fd, KDSET, SCROLL_LED)

    time.sleep(2)

    fcntl.ioctl(console_fd, KDSET, 0)

    time.sleep(2)

    fcntl.ioctl(console_fd, KDSET, RESET_ALL)

    ```


    From kernel space in Linux on, devices are memory-mapped. The kernel device handling
    code writes to memory addresses to issue commands to devices and uses memory accesses
    to transfer data between device and machine memory.


    # 8.4.2 Blocking versus non-blocking IO


    From user space, when you use an IO command, it may return immediately (non-blocking),
    or it may wait (blocking) until the operation completes when all the data is transferred.
    The key problem with blocking is that IO can be slow, waiting for IO to complete
    may take a long time. The thread that initiated the blocking IO is unable to do
    any other work while it is waiting.


    On the other hand, a non-blocking IO returns immediately, performing as much data
    transfer as is possible with the specified device. If no data transfer can be
    performed, an error status is returned.


    In terms of Unix file descriptor flags, the O_NONBLOCK flag indicates that an
    open file should support non-blocking IO calls. We illustrate this in the source
    code below, by reading bytes from the /dev/random device. This device generates
    cryptographically secure noise, seeded by interactions with the outside world
    such as human interface events and network package arrival times.'
