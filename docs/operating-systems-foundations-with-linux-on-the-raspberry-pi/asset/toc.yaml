- - '#'
  - 创建二进制文件
- - '######'
  - 引导扇区, 512B
- - '###'
  - 引导扇区的 3 字节是“魔值”
- - '###'
  - 接下来的 8 字节是厂商名称，使用 ASCII
- - '###'
  - 接下来的 2 字节是每块字节数 - 512 是标准
- - '###'
  - 这是小端格式 - 所以 0x0200 是 512
- - '###'
  - 下一个 1 字节是每个单元块数 - 说是 1
- - '###'
  - 在 FAT 术中称为 Cluster
- - '###'
  - 接下来的 2 字节是预留块数
- - '###'
  - 仅用于引导扇区
- - '###'
  - 下一个 1 字节是文件表数量 - 可以有多个
- - '###'
  - 为了冗余 - 我们先保留 1 个
- - '###'
  - 接下来的 2 字节是根目录条目数 - 包括空白
- - '###'
  - 我们假设有16 个文件，因此根目录包含在内
- - '###'
  - 接下来的 2 字节是整个磁盘的块 - 8192 个块
- - '###'
  - 每一个块需要256 个字节的 FAT 元数据
- - '###'
  - 每一个块需要256 个字节的 FAT 元数据
