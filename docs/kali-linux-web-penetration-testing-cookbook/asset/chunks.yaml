    # 使用 Metasploit 的 browser_autpwn2 攻击客户端


    Metasploit Framework 包含大量的客户端漏洞利用程序，其中许多旨在利用 Web 浏览器的已知漏洞，并且有一个模块能够检测客户端正在使用的浏览器版本，并选择最佳利用程序进行触发，该模块就是
    `browser_autopwn` 或者其最新版本中的 `browser_autopwn2`。


    在本教程中，我们将使用 `browser_autopwn2` 设置攻击，并准备好迎接受害者。


    ## 如何操作...


    1. 启动 `msfconsole`。


    2. 我们使用版本 2 的 Browser Autopwn (BAP2)：


    ```

    use auxiliary/server/browser_autopwn2

    ```


