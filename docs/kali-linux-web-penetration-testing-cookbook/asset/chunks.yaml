    ### 工作原理……


    利用盲 SQL 注入比基于错误的注入花费更多的精力和时间；在本配方中，我们看到了如何获取连接到数据库的用户名称，而在第 6 章“SQL 注入利用——轻而易得的果实”中，我们使用单个命令来获取。


