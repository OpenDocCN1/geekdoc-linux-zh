    ## 第 2 章：使用 John the Ripper 生成字典


    John the Ripper 可能是世界上大多数渗透测试人员和黑客喜欢的密码破解工具。它具有许多功能，例如自动识别最常见的加密和哈希算法、能够使用字典以及暴力攻击；因此，我们能够将规则应用于字典单词并对其进行修改，在破解时无需存储该列表的情况下获得更丰富的词列表。这项功能正是我们将在本教程中使用的，用于根据一个非常简单的单词列表生成一个大量的字典。


    ### 准备工作


    我们将使用上一个教程生成的单词列表（*使用 CeWL 进行密码分析*）来生成一个可能密码的字典。


    ### 如何操作...


    1. John 有选项仅显示它将用于破解某个密码文件的密码。让我们用我们的单词列表尝试一下：


    ```

    john --stdout --wordlist=cewl_WackoPicko.txt

    ```


    ![](img/index-66_1.png)


    2. 正如之前提到的，John 的另一个功能允许我们以各种方式应用规则来修改列表中的每个单词，以便获得一个更完整的字典：


    ```

    john --stdout --wordlist=cewl_WackoPicko.txt --rules

    ```


    47


    ![](img/index-66_2.png)


    [Technet24.ir](http://technet24.ir)


    *侦察*


    正如你在结果所示，John 通过切换大小写、添加后缀和前缀以及用数字和符号替换字母（十六替换）修改了单词。


    3. 现在我们需要执行相同的操作，但将列表发送到文本文件中，以便我们以后使用：


    ```

    john --stdout --wordlist=cewl_WackoPicko.txt --rules > dict_WackoPicko.txt

    ```


    ![](img/index-67_1.png)


    4. 现在，我们拥有了一个包含 999 个单词的字典，稍将用于对应用程序登录页面尝试密码猜测攻击。


    ### 工作原理...


    虽然 John the Ripper 的目标不是成为字典生成器，而是高效地使用单词列表来破解密码（它做得非常好），但它的功能允许我们用它来扩展现有列表，并创建一个更适应现代用户密码的字典。


    在本教程中，我们使用了默认规则集来修改我们的单词。John 的规则定义在它的配置文件中，位于 Kali Linux 的 `/etc/john/john.conf`。


    ### 更多内容...


    关于创建和修改 John the Ripper 规则的更多信息可以在此处找到：


    [`www.openwall.com/john/doc/RULES.shtml`](http://www.openwall.com/john/doc/RULES.shtml)


    ## 使用 ZAP 查找文件和文件夹


    OWASP ZAP (Zed Attack Proxy) 是一种多功能的 Web 安全测试工具。它具有代理、被动和主动漏洞扫描器、模糊器、爬虫、HTTP 请求发送器和其他有趣的功能。在本教程中，我们将使用最近添加的“强制浏览”（Forced
    Browse），这是 DirBuster 在 ZAP 内部实现。


    ### 准备工作


    为了使此教程运行，我们需要将 ZAP 作为 Web 浏览器的代理：


    1. 启动 OWASP ZAP，从应用程序菜单导航到：Applications | Kali Linux | Web Applications | Web
    Application Fuzzers | owasp-zap。


    48


    ![](img/index-67_2.png)


    ## 第 2 章


    2. 在 Mantra 或 Iceweasel 中，进入主菜单并导航到 Preferences | Advanced | Network，在 Connection
    中点击 Settings…


    3. 选择手动代理配置，并将 `127.0.0.1` 设置为 HTTP 代理，将 `8080` 设置为端口。勾选对所有协议使用相同代理的选项，然后点击 OK。


    ![](img/index-68_1.png)


    4. 现在，我们需要告诉 ZAP 它从哪个文件获取目录名称。进入 ZAP 菜单并导航到 Tools | Options | Forced Browse，然后点击
    Select File…


    49


    ![](img/index-68_2.png)


    [Technet24.ir](http://technet24.ir)


    *侦察*


    5. Kali Linux 包含一些单词列表。我们将使用其中之一：选择文件 `/usr/share/wordlists/dirbuster/directory-list-lowercase-2.3-small.txt`
    并点击 Open。


    ![](img/index-69_1.png)


    6. 一个警报将告诉我们文件已安装。点击 OK 并再次点击 OK 以退出 Options 对话。


    ### 如何操作...


    1. 正确配置代理后，访问 `http://192.168.56.102/WackoPicko`。


    2. 我们将看到 ZAP 对此操作做出反应，显示我们刚刚访问的主机的树形结构。


    50


    ![](img/index-69_2.png)


    ## 第 2 章


    ![](img/index-70_1.png)


    3. 现在，在 ZAP 的左上面板（Sites 标签页）中，右键点击 `http://192.168.56.102` 内部的 WackoPicko 文件夹，进入
    Attack | Forced Browse：


    ![](img/index-70_2.png)


    51


    ![](img/index-70_3.png)


    [Technet24.ir](http://technet24.ir)


    *侦察*


    4. 在底部面板我们将看到 Forced Browse 标签页。在这里我们可以看到扫描进度及其结果：


    ![](img/index-71_1.png)


    ### 工作原理...


    当我们配置浏览器使用 ZAP 时，它并不是直接向服务器发送请求，而是发送到我们想要查看的 ZAP 监听的地址。


    ZAP 的 Forced Browse 工作原理与 DirBuster 相同；它获取我们配置的字典向服务器发送请求，如果文件存在，服务器将响应；如果不存在，则将返回错误。


    ### 另


    Kali Linux 中包含的另一个非常有用的代理是 BurpSuite。它也有一些有趣的功能；可以作为我们刚刚使用的 Forced Browse 替代品的是
    Burp 的 Intruder。


    52


    ![](img/index-71_2.png)


    ## 第 3 章：爬虫与蜘蛛 3


    在本章中我们将涵盖：


    - 使用 Wget 下载页面用于分析

    - 使用 HTTrack 下载页面用于分析

    - 使用 ZAP 的 spider

    - 使用 Burp Suite 爬取网站

    - 使用 Burp 的 repeater 重复请求

    - 使用 WebScan

    - 从爬取结果识别相关文件和目录


    ### 引言


    渗透测试可以使用不同的方法进行，例如黑盒、灰盒和白盒。黑盒测试是指测试团队除了服务器 URL 之外，对应用程序没有任何任何先验信息。白盒测试是指测试团队拥有关于目标的所有信息，其基础设施、软件版本、测试用户、开发信息等；灰盒测试介于黑盒和白盒之间。


    对于黑盒和灰盒测试，侦察阶段都是必要的，以便测试团队发现通常由应用程序所有者在白盒方法提供的信息。我们将遵循黑盒方法，因为它涵盖了外部攻击者为了获取足够信息以破坏应用程序或服务器某些功能而采取的所有步骤。


    **[53]**


    ![](img/index-72_1.png)


    [Technet24.ir](http://technet24.ir)


    *爬虫与蜘蛛*


    作为 Web 渗透测试侦察阶段的一部分，我们需要浏览网页中包含的每个链接，并记录它显示的每个文件。帮助我们自动化和加速此任务的工具被称为网络爬虫（crawler）或网络蜘蛛（spider）。这些工具通过跟踪所有链接和外部文件的引用来浏览网页，有时会填写表单并将其发送到服务器，保存所有的请求和响应，从而让我们有机会离线分析它们。


    '
- fmt: '

    In this chapter, we will cover the use of some crawlers included in Kali Linux
    and will also look at the files and directories that will be interesting to look
    for in a common web page.


    ## Downloading a page for offline analysis with Wget


    Wget is a part of the GNU project and is included in most of the major Linux distributions,
    including Kali Linux. It has the ability to recursively download a web page for
    offline browsing, including conversion of links and downloading of non-HTML files.


    In this recipe, we will use `Wget` to download pages that are associated with
    an application in our `vulnerable_vm`.


    ### Getting ready


    All recipes in this chapter will require `vulnerable_vm` running. In the particular
    scenario of this book, it will have the IP address `192.168.56.102`.


    ### How to do it...


    1. Let''s make the first attempt to download the page by calling `Wget` with a
    URL as the only parameter:


    ```

    wget http://192.168.56.102/bodgeit/

    ```


    ![](index-73_1.png)


    As we can see, it only downloaded the `index.html` file to the current directory,
    which is the start page of the application.


    [54]


    ![](index-73_2.png)


    2. We will have to use some options to tell `Wget` to save all the downloaded
    files to a specific directory and to copy all the files contained in the URL that
    we set as the parameter. Let''s first create a directory to save the files:


    ```

    mkdir bodgeit_offline

    ```


    3. Now, we will recursively download all files in the application and save them
    in the corresponding directory:


    ```

    wget -r -P bodgeit_offline/ http://192.168.56.102/bodgeit/

    ```


    ![](index-74_1.png)


    ### How it works...


    As mentioned earlier, `Wget` is a tool created to download HTTP content. With
    the `-r` parameter we made it act recursively, which is to follow all the links
    in every page it downloads and download them too. The `-P` option allows us to
    set the directory prefix, which is the directory where `Wget` will start saving
    the downloaded content; it is set to the current path, by default.


    [55]


    ![](index-74_2.png)


    [Technet24.ir](http://technet24.ir)


    *Crawlers and Spiders*


    There''s more...


    There are some other useful options to be considered when using `Wget`:


    - `-l`: When downloading recursively, it might be necessary to establish limits
    to the depth `Wget` goes to, when following links. This option, followed by the
    number of levels of depth we want to go to, lets us establish such a limit.

    - `-k`: After files are downloaded, `Wget` modifies all the links to make them
    point to the corresponding local files, thus making it possible to browse the
    site locally.

    - `-p`: This option lets `Wget` download all the images needed by the page, even
    if they are on other sites.

    - `-w`: This option makes `Wget` wait the number of seconds specified after it
    between one download and the next. It''s useful when there is a mechanism to prevent
    automatic browsing in the server.


    ## Downloading the page for offline analysis with HTTrack


    As stated on HTTrack''s official website ([http://www.httrack.com](http://www.httrack.com)):


    "It allows you to download a World Wide Web site from the Internet to a local
    directory, building recursively all directories, getting HTML, images, and other
    files from the server to your computer."


    We will be using `HTTrack` in this recipe to download the whole content of an
    application''s site.


    ### Getting ready


    HTTrack is not installed by default in Kali Linux, so we will need to install
    it, as shown:


    ```

    apt-get update

    apt-get install httrack

    ```


    ### How to do it...


    1. Our first step will be to create a directory to store the downloaded site and
    then enter it:


    ```

    mkdir bodgeit_httrack

    cd bodgeit_httrack

    ```


    [56]


    ![](index-75_1.png)


    2. The simplest way to use `HTTrack` is by adding the URL that we want to download
    to the command:


    ```

    httrack http://192.168.56.102/bodgeit/

    ```


    It is important to set the last "/"; if it is omitted, `HTTrack` will return a
    404 error because there is no "bodgeit" file in the root of the server.


    ![](index-76_1.png)


    3. Now, if we go to `file:///root/MyCookbook/test/bodgeit_httrack/index.html`
    (or the path you selected in your test environment), we will see that we can browse
    the whole site offline:


    ![](index-76_2.png)


    [57]


    ![](index-76_3.png)


    [Technet24.ir](http://technet24.ir)


    *Crawlers and Spiders*


    ### How it works...


    `HTTrack` creates a full static copy of the site, which means that all dynamic
    content, such as responses to user inputs, won''t be available. Inside the folder
    we downloaded the site, we can see the following files and directories:


    - A directory named after the server''s name or address, which contains all the
    files that were downloaded.

    - `cookies.txt`: A file, which contains the cookies information used to download
    the site.

    - `hts-cache`: The directory contains a list of files detected by the crawler;
    this is the list of files that `httrack` processed.

    - `hts-log.txt`: The file contains the errors, warnings, and other information
    reported during the crawling and downloading of the site.

    - `index.html`: An file that redirects to the copy of the original index file
    located in the server-name directory.


    There''s more...


    `HTTrack` also has an extensive collection of options that will allow us to customize
    its behavior to fit our needs better. The following are some useful modifiers
    to consider:


    - `-rN`: Sets the depth to `N` levels of links to follow

    - `-%eN`: Sets the limit depth to external links

    - `+[pattern]`: Tells `HTTrack` to whitelist all URL matching `[pattern]`, for
    example `+*google.com/*`

    - `-[pattern]`: Tells `HTTrack` to blacklist (omit from downloading) all links
    matching the pattern

    - `-F [user-agent]`: This options allows us to define the user-agent (browser
    identifier) that we want to use to download the site.


    ## Using ZAP''s spider


    Downloading a full site to a directory in our computer leaves us with a static
    copy of the information; this means that we have the output produced by different
    requests, but we neither have such requests nor the response states of the server.
    To have a record of that information, we have spiders, such as the one integrated
    in OWASP ZAP.


    In this recipe, we will use `ZAP''s spider to crawl a directory in our `vulnerable_vm`
    and will check on the information it captures.


    [58]


    ![](index-77_1.png)


    ### Getting ready


    For this recipe, we need to have the `vulnerable_vm` and `OWASP ZAP` running,
    and the browser should be configured to use `ZAP` as proxy. This can be done by
    following the instructions given in the *Finding files and folders with ZAP* recipe
    in the previous chapter.


    ### How to do it...


    1. To have `ZAP` running and the browser using it as a proxy, browse to `http://192.168.56.102/bodgeit/`.

    2. In the `Sites` tab, open the folder corresponding to the test site (`http://192.168.56.102`
    in this book).

    3. Right click on `GET:bodgeit`.

    4. From the drop-down menu select `Attack | Spider…`.


    ![](index-78_1.png)

    5. In the dialog box, leave all the default options and click on `Start Scan`.


    [59]


    ![](index-78_2.png)


    [Technet24.ir](http://technet24.ir)


    *Crawlers and Spiders*


    6. The results will appear in the bottom panel in the `Spider` tab:


    ![](index-79_1.png)

    7. If we want to analyze the requests and responses of individual files, we go
    to the `Sites` tab and open the site folder and the `bodgeit` folder inside it.
    Let''s take a look at `POST:contact.jsp(anticsrf,comments,null)`.


    ![](index-79_2.png)


    On the right side, we can see the full request made, including the parameters
    used (bottom half).


    [60]


    ![](index-79_3.png)


    8. Now, select the `Response` tab in the right section:


    ![](index-80_1.png)

