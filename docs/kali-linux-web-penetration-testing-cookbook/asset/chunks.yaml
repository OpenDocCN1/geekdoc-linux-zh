    # Setting up the Iceweasel browser


    If we don''t like OWASP Mantra, we can use the latest version of Firefox and install
    our own selection of testing-related add-ons. Kali Linux includes Iceweasel, another
    variant of Firefox, which we will use in this recipe to see how to install our
    testing tools in a browser.


    ## How to do it...


    1. Open `Iceweasel` and navigate to `Tools | Add-ons`, as shown in the following
    screenshot:

    ![](index-26_1.jpg)

    7

    ![](index-26_2.png)

    *Setting Up Kali Linux*

    2. In the search box, type `tamper data` and hit `Enter`.

    ![](index-27_1.jpg)

    3. Click on `Install` in the `Tamper Data` add-on.

    4. A dialog box will pop up, asking us to accept the EULA; click on `Accept` and
    `Install...`.

    You might have to restart your browser to complete the installation of certain
    add-ons.

    5. Next, we search for `cookies manager+` in the search box.

    6. Click on `Install` in the `Cookies Manager+` add-on.

    7. Now, search and install `Firebug`.

    8. Search and install `Hackbar`.

    9. Search and install `HTTP Requester`.

    10. Search and install `Passive Recon`.


    ## How it works...


    So far we''ve just installed some tools on our web browser but what are these
    tools good for when it comes to penetration-testing a web application?


    - `Cookies Manager+`: This add-on will allow us to view and sometimes modify the
    value of cookies the browser receives from applications.

    - `Firebug`: This is a must-have for any web developer; its main function is to
    be an in-line debugger for web pages. It will also be useful when you have to
    perform some client-side modifications to pages.

    8

    ![](index-27_2.png)


    ## Chapter 1


    - `Hackbar`: This is a very simple add-on that helps us to try different input
    values without having to change or rewrite the full URL. We will be using this
    a lot when doing manual checks for Cross-site scripting and injections.

    - `Http Requester`: With this tool it is possible to craft HTTP requests including
    `GET`, `POST`, and `PUT` methods and watch the raw response from the server.

    - `Passive Recon`: It allows us to get public information about the website being
    visited by querying `DNS` records, `Whois`, and searching information, such as
    email addresses, links, and collaborators in Google, among other things.

    - `Tamper Data`: This add-on has the ability to capture any request on the server
    just after it is sent by the browser, thus giving us the chance to modify the
    data after introducing it in the application''s forms and before it reaches the
    server.


    ## There''s more...


    Other add-ons that could prove useful for web application penetration testing
    are:

    - `XSS Me`

    - `SQL Inject Me`

    - `FoxyProxy`

    - `iMacros`

    - `FirePHP`

    - `RESTClient`

    - `Wappalyzer`


    # Installing VirtualBox


    This is the first of the four recipes that will help us to get a virtual laboratory
    up and running to practice our penetration tests. We will use a `VirtualBox` to
    run the virtual machines in such a laboratory. In this recipe, we will see how
    to install `VirtualBox` and get it working.


    ## Getting ready


    Before we install anything in Kali Linux, we must make sure that we have the latest
    version of package lists:


    ```apt-get update

    ```

    9

    ![](index-28_1.png)

    *Setting Up Kali Linux*


    ## How to do it...


    1. Our first step is the actual installation of `VirtualBox`:

    ```

    apt-get install virtualbox

    ```

    ![](index-29_1.png)

    2. After the installation finishes, we will find `VirtualBox` in the menu by navigating
    to `Applications | Usual applications | Accessories | VirtualBox`. Alternatively,
    we can call it from a terminal:

    ```

    virtualbox

    ```

    ![](index-29_2.png)

    10

    ![](index-29_3.png)


    ## Chapter 1


    Now, we have `VirtualBox` running and we are ready to set up the virtual machines
    to make our own testing laboratory.


    ## How it works...


    `VirtualBox` will allow us to run multiple machines inside our Kali Linux computer
    through virtualization. With this, we can mount a full laboratory with different
    computers using different operating systems and run them in parallel as far as
    the memory resources and processing power of our Kali host allow us to.


    ## There''s more...


    The `VirtualBox Extension Pack` gives the `VirtualBox`''s virtual machine extra
    features, such as `USB 2.0/3.0` support and Remote Desktop capabilities. It can
    be downloaded from `https://www.virtualbox.org/wiki/Downloads`. After it is downloaded,
    just double click on it and `VirtualBox` will do the rest.


    ## See also


    There are some other virtualization options out there. If you don''t feel comfortable
    using `VirtualBox`, you may want to try:

    - `VMware Player/Workstation`

    - `Qemu`

    - `Xen`

    - `KVM`


    # Creating a vulnerable virtual machine


    Now we are ready to create our first virtual machine, it will be the server that
    will host the web applications we''ll use to practice and improve our penetration
    testing skills.


    We will use a virtual machine called `OWASP-bwa` (`OWASP Broken Web Apps`) that
    is a collection of vulnerable web applications specially set up to perform security
    testing.


    11

    ![](index-30_1.png)

    [Technet24.ir](http://technet24.ir)

    *Setting Up Kali Linux*


    ## How to do it...


    1. Go to `http://sourceforge.net/projects/owaspbwa/files/` and download the latest
    release''s `.ova` file. At the time of writing, it is `OWASP_Broken_Web_Apps_VM_1.1.1.ova`.

    ![](index-31_1.png)

    2. Wait for the download to finish and then open the file.

    12

    ![](index-31_2.png)


    ## Chapter 1


    3. `VirtualBox`''s import dialog will launch. If you want to change the machine''s
    name or description, you can do it by double-clicking on the values. We will name
    it `vulnerable_vm` and leave the rest of the options as they are. Click on `Import`.

    ![](index-32_1.png)

    4. The import should take a minute and after that we will see our virtual machine
    displayed in `VirtualBox`''s list. Let''s select it and click on `Start`.

    13

    ![](index-32_2.png)

    [Technet24.ir](http://technet24.ir)

    *Setting Up Kali Linux*

    5. After the machine starts, we will be asked for login and password, type `root`
    as the login and `owaspbwa` as the password and we are set.

    ![](index-33_1.png)


    ## How it works...


    `OWASP-bwa` is a project aimed at providing security professionals and enthusiasts
    with a safe environment to develop attacking skills and identify and exploit vulnerabilities
    in web applications, in order to be able to help developers and administrators
    fix and prevent them.


    This virtual machine includes different types of web applications, some of them
    are based on `PHP`, some in `Java`; we even have a couple of `.NET`-based vulnerable
    applications. There are also some vulnerable versions of known applications, such
    as `WordPress` or `Joomla`.

    14

    ![](index-33_2.png)


    ## Chapter 1


    ## See also


    There are many options when we talk about vulnerable applications and virtual
    machines. A remarkable website that holds a great collection of such applications
    is `VulnHub` (`https://www.vulnhub.com/`). It also has walkthroughs that will
    help you to solve some challenges and develop your skills.


    In this book, we will use another virtual machine for some recipes: `bWapp Bee-box`,
    which can also be downloaded from `VulnHub`: `https://www.vulnhub.com/entry/bwapp-bee-box-v16,53/`.


    # Creating a client virtual machine


    When we get to the man in the middle (`MITM`) and client-side attacks, we will
    need another machine to make requests to the already set up server. In this recipe,
    we will download a Microsoft Windows virtual machine and import it to `VirtualBox`.


    ## How to do it...


    1. First we need to go to the download site `http://dev.modern.ie/tools/vms/#downloads`.

    2. Through this book we will use the `IE8` on `Win7` virtual machine.

    ![](index-34_1.png)

    15

    ![](index-34_2.png)

    [Technet24.ir](http://technet24.ir)

    *Setting Up Kali Linux*

