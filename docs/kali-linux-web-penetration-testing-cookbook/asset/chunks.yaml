    5\. Now, if we check the contents of hb_test.txt:


    **cat hb_test.txt**


    ![](index-196_1.png)


    Our exploit extracted information from the HTTPS server and, from that, we can
    see a session ID and even a full login request including a username and password
    in clear text.


    6\. If you want to skip all the binary data and see only the readable characters
    in the file,


    use the strings command:


    **strings hb_test.txt**


