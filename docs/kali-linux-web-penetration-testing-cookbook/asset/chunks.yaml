    How it works...


    In this recipe, we saw how to use a Man In The Middle attack to force users to
    navigate to pages even when they believe they are on other sites.


    In the first step, we modified Ettercap''s name resolution file, ordering it to
    resolve all names requested to the address of our Kali machine.


    After that, we ran Ettercap with the following parameters: (-i wlan0 -T -P dns_spoof
    -M arp /192.168.71.14///)


    f-i wlan0: Remember we needed the client to ask for DNS resolution, so we needed


    it to have a bridged adapter and to be within reach of our Kali machine so we
    set the sniffing interface as wlan0 (the attacker''s computer wireless card).


    f-T: This is used for text-only interface.


    f-P dns_spoof: This is to enable the DNS spoofing plugin.


    f-M arp: This is to perform an ARP spoofing attack.


    f /192.168.71.14///: This is how we set targets to Ettercap in the command line:


    MAC/ip_address/port where // means any MAC address corresponding to IP 192.168.71.14
    (the client) at any port.


    Finally, we just confirmed that the attack was working OK.


