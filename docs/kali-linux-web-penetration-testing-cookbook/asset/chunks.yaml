    *Crawlers and Spiders*


    As a part of every reconnaissance phase in a web penetration test, we will need
    to browse every link included in a web page and keep a record of every file displayed
    by it. There are tools that help us automate and accelerate this task called web
    crawlers or web spiders. These tools browse a web page by following all the links
    and references to external files, sometimes filling forms and sending them to
    servers, saving all the requests and responses made, thus giving us the opportunity
    to analyze them offline.

