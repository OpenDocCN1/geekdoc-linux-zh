    ### How it works...


    From our first injection `1'' order by 1 -- ''` through `1'' order by 3 -- ''`
    we are using a feature in SQL language that allows us to order the results of
    a query by a certain field or column using its number in the order it is declared
    in the query. We used this to generate an error and be able to know how many columns
    the query has, so we can use them to create a union query.


    The UNION statement is used to concatenate two queries that have the same number
    of columns, by injecting this we can query almost anything to the database. In
    this recipe, we first checked if it was working as expected, after that we set
    our objective in the users'' table and investigated our way to it.


