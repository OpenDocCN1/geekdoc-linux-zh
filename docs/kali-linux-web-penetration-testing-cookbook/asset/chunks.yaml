    ### How it works...


    Once a web page is received by the browser, all its elements can be modified to
    alter the way the browser interprets it. If the page is reloaded, the version
    generated by the server is shown again.


    Firebug allows us to modify almost every aspect of how the page is shown in the
    browser; so, if there is a control-established client-side, we can manipulate
    it with this tool.


    ### There''s more...


    Firebug is not only a tool to unhide inputs or change values, it also has some
    other very useful tools:


    - The `Console` tab shows errors, warnings, and some other messages generated
    when loading the page.

    - The `HTML` is the tab we just used. It presents the HTML source in a hierarchical
    way thus allowing us to modify its contents.

    - The `CSS` tab is used to view and modify the CSS styles used by the page.

    - Within `Script` we can see the full HTML source, set breakpoints that will interrupt
    the page load when the process reaches them, and check variable values when running
    scripts.

    - The `DOM` tab shows us the `DOM` (Document Object Model) objects, their values,
    and the hierarchy.

    - `Net` displays the requests made to the server and its responses, their types,
    size, response time, and its order in a timeline.

    - `Cookies` contain, as the name says, the cookies set by the server and their
    values and parameters.


