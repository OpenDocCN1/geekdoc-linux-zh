    \ for a HTTP packet from `192.168.56.101` to `192.168.56.102` with `POST /dvwa/login.php`\
    \ in its info field.\n\n![](index-232_2.png)\n\nIf we look through all the captured\
    \ packets, we will find the one corresponding to the authentication and see that\
