    # Reconnaissance


    ## Finding files and folders with DirBuster


    DirBuster is a tool created to discover, by brute force, the existing files and
    directories in a web server. We will use it in this recipe to search for a specific
    list of files and directories.


    ### Getting ready


    We will use a text file that contains the list of words that we will ask DirBuster
    to look for. Create a text file `dictionary.txt` containing the following:


    ```

    info

    server-status

    server-info

    cgi-bin

    robots.txt

    phpmyadmin

    admin

    login

    ```


    ### How to do it...


    1. Navigate to `Applications | Kali Linux | Web Applications | Web Crawlers |
    dirbuster`:


    ![](index-61_1.png)


    42


    ![](index-61_2.png)


    ## Chapter 2


    2. On the DirBuster''s window, set the target URL to `http://192.168.56.102/`.

    3. Set the number of threads to 20.

    4. Select `List` based brute force and click on `Browse`.

    5. In the browsing window, select the file we just created (`dictionary.txt`).

    6. Uncheck the `Be Recursive` option.

    7. For this recipe, we will leave the rest of options at their defaults.

    8. Click on `Start`.


    ![](index-62_1.png)


    43


    ![](index-62_2.png)


    [Technet24.ir](http://technet24.ir)


    # Reconnaissance


    9. If we go to the `Results` tab, we will see that DirBuster has found at least
    two of the files in our dictionary: `cgi-bin` and `phpmyadmin`. The response code
    `200` means that the file or directory exists and can be read. `PhpMyAdmin` is
    a web-based MySQL database administrator; finding a directory with this name tells
    us that there is a DBMS in the server and it may contain relevant information
    about the application and its users.


    ![](index-63_1.png)


    ### How it works...


    DirBuster is a mixture of crawler and brute forcer; it follows all links in the
    pages it finds but also tries different names for possible files. These names
    may be in a file similar to the one we used or may be automatically generated
    by DirBuster using the option of "pure brute force" and setting the character
    set and minimum and maximum lengths for the generated words.


    To determine if a file exists or not, DirBuster uses the response codes from the
    server. The most common responses are listed, as follows:


    - `200. OK`: The file exists and the user can read it.

    - `404. File not found`: The file does not exist in the server.


    44


    ![](index-63_2.png)


    ## Chapter 2


    - `301. Moved permanently`: This is a redirect to a given URL.

    - `401. Unauthorized`: Authentication is required to access this file.

    - `403. Forbidden`: Request was valid but the server refuses to respond.


    ## Password profiling with CeWL


    With every penetration test, reconnaissance must include a profiling phase in
    which we analyze the application, department or process names, and other words
    used by the target organization. This will help us to determine the combinations
    that are more likely to be used when the need to set a user name or password comes
    to the personnel.


    In this recipe, we will use `CeWL` to retrieve a list of words used by an application
    and save it for when we try to brute-force the login page.


    ### How to do it...


    1. As the first step, we will look at `CeWL`''s help to have a better idea of
    what it can do. In the terminal, type:


    ```bash

    cewl --help

    ```


    ![](index-64_1.png)


    2. We will use `CeWL` to get the words on WoPicko application. We want words with
    a minimum length of five characters; show the word count, and save the results
    to `cewl_WackoPicko.txt`: `cewl -w cewl_WackoPicko.txt -c -m 5 http://192.168.56.102/WackoPicko/`

    3. Now, we open the file that CeWL just created and see a list of "word count"
    pairs. This list still needs some filtering in order to discard words that have
    a high count but are not likely to be used as passwords; for example, "Services",
    "Content", or "information".


    45


    ![](index-64_2.png)


    [Technet24.ir](http://technet24.ir)


    # Reconnaissance


    4. Let''s delete some words to have a first version of our word list. Our word
    list, after having removed some words and the count, should look similar to the
    following:


    ```

    WackoPicko

    Users

    person

    unauthorized

    Login

    Guestbook

    Admin

    access

    password

    Upload

    agree

    Member

    posted

    personal

    responsible

    account

    illegal

    applications

    Membership

    profile

    ```


    ### How it works...


    `CeWL` is a tool in Kali Linux that crawls a website and extracts a list of individual
    words; it can also provide the number of repetitions for each word, save the results
    to a file, use the page''s metadata, and so on.


    ### See also


    There are other tools for similar purposes; some of them generate word lists based
    on rules or other word lists and some crawl a website looking for the most used
    words:


    - `Crunch`: This is a generator based on a character set provided by the user.
    It uses this set to generate all the possible combinations. `Crunch` is included
    in Kali Linux.

    - `Wordlist Maker (WLM)`: `WLM` has the feature of generating a word list based
    on the character sets and it can also extract words from text files and web pages
    [(http://www.pentestplus.co.uk/wlm.htm](http://www.pentestplus.co.uk/wlm.htm)).

    - `Common User Password Profiler (CUPP)`: This tool can use a word list to profile
    the possible passwords for common user names and download word lists and default.

