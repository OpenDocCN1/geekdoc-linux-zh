    ## Middle Attacks Man in the 8


    In this chapter, we will cover:


    - Setting up a spoofing attack with Ettercap

    - Being the MITM and capturing traffic with Wireshark

    - Modifying data between the server and the client

    - Setting up an SSL MITM attack

    - Obtaining SSL data with SSLsplit

    - Performing DNS spoofing and redirecting traffic


    ### Introduction


    A Man in the Middle (MITM) attack is the type of attack in which the attacker
    sets himself in the middle of the communication line between two parties, usually
    a client and a server. This is done by breaking the original channel and then
    intercepting messages from one party and relaying them (sometimes with alterations)
    to the other.


    207


    ![](index-226_1.png)


    [Technet24.ir](http://technet24.ir)


    *Man in the Middle Attacks*


    Let''s look at the following example:


    ![](index-227_1.png)


    Alice is connected to a web server and Bob wants to know what information Alice
    is sending so Bob sets up a MITM attack by telling the server he is Alice and
    telling Alice he is the server. Now, all Alice''s requests will go to Bob and
    Bob will resend them (altered or not) to the web server, doing the same with the
    server''s responses. In this way, Bob will be able to intercept, read and modify
    all traffic between Alice and the server.


    ### Setting up a spoofing attack with Ettercap


    Address Resolution Protocol (ARP) spoofing is maybe the most common MITM attack.
    It is based on the fact that Address Resolution Protocol—the one that translates
    addresses to MAC addresses—does not verify the authenticity of the responses it
    gets. This means that, when Alice''s computer asks all devices "what is the MAC
    address of xxx.xxx", it will believe the answer it gets from any device, be it
    desired or not. ARP spoofing works by sending lots of ARP responses to both ends
    of the communications chain, telling each one that the attacker''s MAC address
    corresponds to the IP address of their counterpart.


    In this chapter, we will set up a MITM attack and set ourselves between a client
    and a server.


