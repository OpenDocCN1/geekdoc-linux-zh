    ### 使用 WebScarab


    WebScarab 是另一个网络代理，具有许多渗透测试人员可能感兴趣的功能。在本食谱中，我们将使用它来爬取网站。


    #### 准备工作


    默认配置下，WebScarab 使用 `8008` 端口捕捉 HTTP 请求，因此我们需要配置浏览器使用 `localhost` 的该端口作为代理。你需要按照与
    Owasp-Zap 和 Burp Suite 类似的步骤配置浏览器。在这种情况下，端口必须是 `8008`。


