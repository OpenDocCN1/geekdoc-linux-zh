    ## Advanced Exploitation - Part 7


    ### Chapter 7


    In this chapter we will cover:

    - Searching `Exploit-DB` for a web server''s vulnerabilities

    - Exploiting `Heartbleed` vulnerability

    - Exploiting `XSS` with `BeEF`

    - Exploiting `Blind SQLi`

    - Using `SQLMap` to get database information

    - Performing cross-site request forgery attack

    - Executing commands with `Shellshock`

    - Cracking password hashes with `John the Ripper` by using dictionary

    - Cracking password hashes by brute force with `hashcat`


    ### Introduction

    Having benefited from some relatively easy to discover and exploit vulnerabilities,
    we will now move on to other issues that may require a little effort from us as
    penetration testers.


    In this chapter, we will search for exploits, compile programs, set up servers
    and crack passwords that will allow us to access sensitive information and execute
    privileged functions in servers and applications.


    171


    [Technet24.ir](http://technet24.ir) - Advanced Exploitation


    ### Searching Exploit-DB for a web server''s vulnerabilities

    From time to time we find a server with vulnerabilities in its operating system,
    in a library the web application uses, in an active service or may be another
    security issue which is not exploitable from the browser or the web proxy. In
    these cases we could use `Metasploit`''s exploit collection or, if what we need
    is not in Metasploit, we could search for it in `Exploit-DB`.


    Kali Linux includes a copy of the exploits contained in `Exploit-DB` for offline
    use; in this recipe, we will use the commands Kali includes to explore the database
    and find the exploit we need.


    #### How to do it

    1. Open a terminal.

    2. Type the following command:

    ```

    searchsploit heartbleed

    ```

    3. The next step is to copy the exploit to a place where we can modify it, if
    necessary, and then compile it, as demonstrated:

    ```

    mkdir heartbleed

    cd heartbleed

    cp /usr/share/exploitdb/platforms/remote/32998.c .

    ```

    4. Usually, the exploits have some information about themselves and how to use
    them in the first few lines, as shown here:

    ```

    head -n 30 32998.c

    ```

    172


    #### Chapter 7

    5. In this case, the exploit is in `C` so we need to compile it for it to work.
    The compilation command shown in the file (`gcc -lssl -lssl3 -lcrypto heartbleed.c
    -o heartbleed`) doesn''t work correctly in Kali Linux so we need to use the following
    instead:

    ```

    gcc 32998.c -o heartbleed -Wl,-Bstatic -lssl -Wl,-dynamic -lssl3 -lcrypto

    ```

    173


    ### Exploiting Heartbleed vulnerability

    #### How it works

    The `searchsploit` command is the interface to the local copy of `Exploit-DB`
    installed on Kali Linux and it looks for a string in the exploit''s title and
    description and displays the results.


    Exploits are located in `/usr/share/exploitdb/platforms` directory. The exploit
    path shown by `searchsploit` is relative to that directory which is why, when
    we copied the file, we used the full path. Exploit files are also named after
    the exploit number they were assigned when they were submitted to `Exploit-DB`.


    The compilation step was done differently to how it was recommended in the source
    code because the `OpenSSL` libraries in Debian-based distributions lack functionality
    due to the way in which they are built at source.


    #### There''s more

    It is very important to monitor the effect and impact of an exploit before we
    use it in a live system. Usually, exploits in `Exploit-DB` are trustworthy, even
    though they often need some adjustment to work in a specific situation, but there
    are some of them that may not do what they say; because of that we need to test
    them in a controlled environment like our laboratory first.


    此外，我们经常会发现在操作系统中存在漏洞的服务器，在Web应用程序使用的库中，在活动服务中，或者是另一个无法从浏览器或网络代理利用的安全漏洞。这些情况下，我们可以使用`Metasploit`的漏洞集合，或者如果我们需要的在`Metasploit`中，我们可以在`Exploit-DB`中搜索它。


    Kali Linux包含了`Exploit-DB`中漏洞的副本供离线使用；在本教程中，我们将使用Kali包含的命令来探索数据库并找到我们需要的漏洞。

