    Client-Side Attacks and 9 Social Engineering


    In this chapter, we will cover:


    f Creating a password harvester with SET


    f Using previously saved pages to create a phishing site


    f Creating a reverse shell with Metasploit and capturing its connections


    f Using Metasploit''s browser_autpwn2 to attack a client


    f Attacking with BeEF


    f Tricking the user to go to our fake site


    Introduction


    Most of the techniques that we have seen so far in this book try to exploit some
    or the other vulnerability or design flaw on the server and gain access to it
    or extract information from its database. There are other kinds of attacks that
    use the server to exploit vulnerabilities on the user''s software or try to trick
    the user to do something they wouldn''t do under normal circumstances, in order
    to gain information the user possesses; these attacks are called client-side attacks.


    In this chapter, we will review some techniques used by attackers to gain information
    from clients, be it by social engineering and deception or by exploiting software
    vulnerabilities.


    229


    ![](index-248_1.png)


    [Technet24.ir](http://technet24.ir)


    *Client-Side Attacks and Social Engineering* Although it''s not specifically related
    to web application penetration testing, we will cover them here because most of
    them are web based and it is a very common scenario that we are able to gain access
    to applications and servers when attacking a client. So, it is very important
    for a penetration tester to know how attackers behave in these attacks.


    Creating a password harvester with SET


    Social engineering attacks may be considered as a special kind of client-side
    attacks. In such attacks, the attacker has to convince the user that the attacker
    is a trustworthy counterpart and is authorized to receive the information the
    user has.


    SET or the Social-Engineer T[oolkit (https://www.trustedsec.com/social-engineer-](https://www.trustedsec.com/social-engineer-toolkit/)


    [toolkit/](https://www.trustedsec.com/social-engineer-toolkit/)) is a set of tools
    designed to perform attacks against the human element; attacks, such as Spear-phishing,
    mass e-mails, SMS, rouge wireless access point, malicious websites, infected media,
    and so on.


    In this recipe, we will use SET to create a password harvester web page and look
    at how it works and how attackers use it to steal a user''s passwords.


