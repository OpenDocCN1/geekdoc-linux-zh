    嗅探开始后，我们选择目标。


    ### 预先选择你的目标


    在单次攻击中，仅包含绝对必要的主机作为目标是非常重要的，因为中毒攻击会产生大量的网络流量并对所有主机造成性能问题。在启动中间人（MITM）攻击之前，请明确识别哪两个系统将成为目标，并仅对这些系统进行伪骗。


    一旦设置了目标，我们就开始 ARP 毒攻击。嗅探远程连接意味着 Ettercap 将捕获并读取端点之间发送的所有数据包；而当我们只想中毒客户端而不想知道来自服务器或网关的响应（或者它有任何防止
    ARP 中毒的措施）时，单向中毒是有有用的。


