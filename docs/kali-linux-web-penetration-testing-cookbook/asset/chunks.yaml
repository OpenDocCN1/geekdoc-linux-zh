    ### Setting Up Kali Linux 1


    In this chapter, we will cover:


    - Updating and upgrading Kali Linux

    - Installing and running OWASP Mantra

    - Setting up the Iceweasel browser

    - Installing VirtualBox

    - Creating a vulnerable virtual machine

    - Creating a client virtual machine

    - Configuring virtual machines for correct communication

    - Getting to know web applications on a vulnerable VM


    #### Introduction


    In the first chapter, we will cover how to prepare our Kali Linux installation
    to be able to follow all the recipes in the book and set up a laboratory with
    vulnerable web applications using virtual machines.


    #### Updating and upgrading Kali Linux


    Before we start testing web applications'' security, we need to be sure that we
    have all the necessary up-to-date tools. This recipe covers the basic task of
    keeping Kali Linux and its tools at their most recent versions.


    #### 1


    ![](index-20_1.png)


    *Setting Up Kali Linux*


    ##### Getting ready


    We start from having Kali Linux installed as the main operating system on a computer
    with Internet access; the version that we will be using through this book is 2.0.
    You can download the live CD and installer from `https://www.kali.org/downloads/`.


    ###### How to do it...


    Once you have a working instance of Kali Linux up and running, perform the following
    steps:


    1. Log in as a root on Kali Linux; the default password is `"toor"`, without the
    quotes. You can also use `su` to switch the user or `sudo` to execute single commands
    if using a regular user is preferred instead of root.

    2. Open a terminal.

    3. Run the `apt-get update` command. This will download the updated list of packages
    (applications and tools) that are available to install.


    ```bash

    apt-get update

    ```


    ![](index-21_1.png)


    4. Once the update is finished, run the following command to update non-system
    packages to their last stable version:


    ```bash

    apt-get upgrade

    ```


    #### 2


    ![](index-21_2.png)


