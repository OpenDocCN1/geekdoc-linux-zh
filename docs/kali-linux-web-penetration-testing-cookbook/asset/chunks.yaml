    `200` 意味着文件或目录存在且可以读取。`PhpMyAdmin` 是一个基于 Web 的 MySQL 数据库管理员；发现以此命名的目录告诉我们服务器上存在一个
    DBMS，它可能包含有关应用程序及其用户的相关信息。


    ![](img/index-63_1.png)


    ### 工作原理...


    DirBuster 是爬虫和暴力破解器的结合体；它会跟踪它找到的页面中的所有链接，但也会尝试可能文件的不同名称。这些名称可能存在于类似于我们使用的文件中的，也可能由
    DirBuster 使用“纯暴力破解”选项并设置字符集以及生成单词的最小和最大长度来自动生成。


    为了确定文件是否存在，DirBuster 使用服务器的响应代码。常见的响应列出如下：


    - `200. OK`：文件存在且用户可以读取。

    - `404. File not found`：服务器上不存在该文件。


