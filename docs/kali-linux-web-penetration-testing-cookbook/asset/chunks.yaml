    ## Chapter 7


    One other thing you could try is using SQLMap to exploit this kind of injection.


    There is another kind of blind injection, which is the Time-Based Blind SQL Injection,
    in which we don''t have a visual clue whether or not the command was executed
    (as in valid or invalid account messages); instead, we need to send a sleep command
    to the database and, if the response time is slightly longer than the one we sent,
    then it is a true response. This kind of attack is really slow as it is sometimes
    necessary to wait even 30 seconds to get just one character. It is very useful
    to have tools like `sqlninja` or `SQLMap` in these situations [(https://www.owasp.org/index.php/Blind_SQL_Injection](https://www.owasp.org/index.php/Blind_SQL_Injection)).


    ### Using SQLMap to get database information


    In Chapter 6, Exploitation – Low Hanging Fruits, we used SQLMap to extract information
    and the content of tables from a database. This is very useful but it is not the
    only advantage of this tool, nor the most interesting. In this recipe, we will
    use it to extract information about database users and passwords that may allow
    us access to the system, not only to the application.


    ### How to do it...


    1. With the Bee-box virtual machine running and BurpSuite listening as a proxy,
    log in and select the SQL Injection (POST/Search) vulnerability.

    2. Enter any movie name and click Search.

    3. Now let''s go to BurpSuite and check our request:


    ![](index-208_1.png)


    189


    ![](index-208_2.png)


    [Technet24.ir](http://technet24.ir)


    *Advanced Exploitation*


    4. Now, go to a terminal in Kali Linux and enter the following command:


    ```

    sqlmap -u "http://192.168.56.103/bWAPP/sqli_6.php" --cookie="PHPSESSID=15bfb5b6a982d4c86ee9096adcfdb2e0;
    security_level=0" --data="title=test&action=search" -p title --is-dba

