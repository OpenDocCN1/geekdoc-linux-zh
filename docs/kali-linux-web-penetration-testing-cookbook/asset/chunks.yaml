    # 设置 Iceweasel 浏览器


    如果我们不喜欢 OWASP Mantra，可以使用最新版本的 Firefox，并安装我们自己选择的测试相关插件。Kali Linux 包含了 Iceweasel，它是
    Firefox 的另一个变体，我们将在本教程中使用它来学习如何在浏览器中安装测试工具。


    ## 如何操作...


    1. 打开 `Iceweasel` 并导航到 `Tools | Add-ons`（工具 | 插件），如下所示所示：

    ![](img/index-26_1.jpg)

    7

    ![](img/index-26_2.png)

    *设置 Kali Linux*

    2. 在搜索框中输入 `tamper data` 并按 `Enter`。

    ![](img/index-27_1.jpg)

    3. 点击 `Tamper Data` 插件中的 `Install`（安装）。

    4. 会弹出一个对话框，要求我们接受 EULA；点击 `Accept`（接受）和 `Install...`（安装...）。

    你可能需要重启浏览器以完成某些插件的安装。

    5. 接下来，我们在搜索框中搜索 `cookies manager+`。

    6. 点击 `Cookies Manager+` 插件中的 `Install`（安装）。

    7. 现在，搜索并安装 `Firebug`。

    8. 搜索并安装 `Hackbar`。

    9. 搜索并安装 `HTTP Requester`。

    10. 搜索并安装 `Passive Recon`。


    ## 工作原理...


    到为止，我们只是在浏览器上安装了一些工具，但在对 Web 应用进行渗透测试时这些工具有什么用？


    - `Cookies Manager+`: 此插件允许我们查看有时修改浏览器从应用程序接收的 cookie 值。

    - `Firebug`: 这是任何 Web 开发人员的必备工具；它的主要功能是网页内联调试器。当你需要对页面进行某些客户端修改时，它也会非常有用。

    8

    ![](img/index-27_2.png)


    ## 第一章


    - `Hackbar`: 非常简单的插件，帮助我们尝试不同的输入值，而无需更改或重写完整的 URL。在手动检查跨站脚本（XSS）和注入漏洞时，我们将经常使用它。

    - `Http Requester`: 使用此工具可以构建包括 `GET`、`POST` 和 `PUT` 方法的 HTTP 请求，并观察服务器的原始响应。

    - `Passive Recon`: 它允许我们通过查询 `DNS` 记录、`Whois` 以及搜索信息（如 Google 中的电子邮件地址、链接和协作者等）来获取访问网站的公开信息。

    - `Tamper Data`: 此插件能够在浏览器发送任何请求后立即捕获该服务器上的请求，从而让我们有机会在数据数据引入应用程序表单之后、到达服务器之前对其进行修改。


    ## 更多...


    其他可能对 Web 应用渗透测试有用的插件还包括：

    - `XSS Me`

    - `SQL Inject Me`

    - `FoxyProxy`

    - `iMacros`

    - `FirePHP`

    - `RESTClient`

    - `Wappalyzer`


    # 安装 VirtualBox


    这是四个教程中的第一个，将帮助我们建立并运行一个虚拟实验室，以练习我们的渗透测试。我们将使用 `VirtualBox` 在此类实验室中运行虚拟机。在本教程中，我们将看到如何安装
    `VirtualBox` 并让其运行起来。


    ## 准备工作


    在 Kali Linux 中安装任何内容之前，我们必须确保拥有最新版本的包列表：


    ```apt-get update

    ```

    9

    ![](img/index-28_1.png)

    *设置 Kali Linux*


    ## 如何操作...


    1. 我们的步是实际安装 `VirtualBox`：

    ```

    apt-get install virtualbox

    ```

    ![](img/index-29_1.png)

    2. 安装完成后，我们通过导航到 `Applications | Usual applications | Accessories | VirtualBox`
    在菜单中找到 `VirtualBox`。或者，我们也可以从终端调用它：

    ```

    virtualbox

    ```

    ![](img/index-29_2.png)

    10

    ![](img/index-29_3.png)


    ## 第一章


    现在，我们的 `VirtualBox` 正在运行，我们已准备好设置虚拟机来创建我们自己的测试实验室。


    ## 工作原理...


    `VirtualBox` 允许我们通过虚拟化在 Kali Linux 计算机内部运行多个机器。通过这种方式，我们可以使用不同操作系统的不同计算机创建一个完整的实验室，并在
    Kali 宿主机内存资源和处理能力允许范围内并行运行它们。


    ## 更多...


    `VirtualBox Extension Pack`（扩展包）为 `VirtualBox` 虚拟机提供了额外功能，例如 `USB 2.0/3.0` 支持和远程桌面功能。它可以从
    `https://www.virtualbox.org/wiki/Downloads` 下载。下载后，只需双击它，`VirtualBox` 将完成其余工作。


    ## 另请


    市场上还有其他的虚拟化选项。如果你不习惯使用 `VirtualBox`，你可能想尝试：

    - `VMware Player/Workstation`

    - `Qemu`

    - `Xen`

    - `KVM`


