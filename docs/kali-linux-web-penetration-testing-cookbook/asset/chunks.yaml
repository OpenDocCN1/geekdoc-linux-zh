    Tomcat 能够将封装为 `WAR`（Web 归档）格式的 Web 应用程序部署到服务器中。我们曾使用此功能上传了 `udanum` 中的 `webshell`。在上传并部署后，我们只需访问它并执行命令，就发现拥有该系统的
