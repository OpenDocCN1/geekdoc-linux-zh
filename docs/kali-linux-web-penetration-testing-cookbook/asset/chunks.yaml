    ### How it works...


    In this recipe, we configured our CA and certificate to act as CA. In the first
    steps, we configured `iptables` rules to redirect the traffic traffic to its destination.


    Now we are ready to sniff encrypted.


    ### Obtaining SSL data with SSLsplit


    In the previous recipe, we prepared our environment to attack SSL/TLS connection.
    In this recipe, we will use `SSLsplit` to complement a MITM attack and extract
    information from encrypted communication.


    ### Getting ready


    We need to have ARP spoofing attack executing before we start this recipe.


    ### How to do it...


    1. Firstly, we need to create the directories in which `SSLsplit` is going to
    store the logs. To do that, open a terminal and create two directories:


    `mkdir /tmp/ssplit`


    `mkdir /tmp/ssplit/logdir`


    2. Now, let''s start `SSLsplit`:


    `sslsplit -D -l connections.log -j /tmp/ssplit -S logdir -k certauth.key -c ca.crt
    ssl 0.0.0.0 8443 tcp 0.0.0.0 8080`


    3. Now that `SSLsplit` is running and the MITM between the windows client and
    the `vulnerable_vm`, go to the client and browse to: `https://192.168.56.102/dvwa/`.


    4. The browser may ask for confirmation as our CA and certificate are not officially
    recognized by any web browser. Set the exception and continue.


    5. Now log in to DVWA using the admin user and password.


    6. Let''s see what happened in `SSLsplit` by going to a new terminal and checking
    the contents of the logs in the directory we created for `SSLsplit`:


    `ls /tmp/ssplit/logdir/`


    `cat /tmp/ssplit/logdir/*`

