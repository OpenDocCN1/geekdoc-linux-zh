    ## About the Author


    Gilberto Nájera-Gutiérrez leads the Security Testing Team (STT) at Sm4rt Security
    Services, one of the top security firms in Mexico.


    He is also an Offensive Security Certified Professional (OSCP), an EC-Council
    Certified Security Administrator (ECSA), and holds a master''s degree in computer
    science with specialization in artificial intelligence.


    He has been working as a Penetration Tester since 2013 and has been a security
    enthusiast since high school; he has successfully conducted penetration tests
    on networks and applications of some of the biggest corporations in Mexico, such
    as government agencies and financial institutions.


    To Leticia, thanks for your love, support and encouragement; this wouldn''t have
    been possible without you. Love you Mi Reina!


    To my team: Daniel, Vanessa, Rafael, Fernando, Carlos, Karen, Juan Carlos, Uriel,
    Iván, and Aldo. Your talent and passion inspire me to do things like this and
    to always look for new challenges. Thank you guys, keep it going!


    ![](index-5_1.png)


    ## About the Reviewers


    Gregory Douglas Hill is an ethical hacking student from Abertay University, Scotland,
    who also works for an independent web application developer focusing on security.
    From several years of programming and problem solving experience, along with the
    invaluable level of specialized training that Abertay delivers to their students,
    security has become an integral part of his life. He has written several white
    papers ranging from IDS evasion to automated XSS fuzzing and presented talks on
    SQL injection and social engineering to the local ethical hacking society.


    I would like to thank my friends and family for the inspiration I needed to help
    produce this book, especially with my increasing academic workload.


    Nikunj Jadawala is a security consultant at Cigital. He has over 2 years of experience
    in the security industry in a variety of roles, including network and web application
    penetration testing and also computer forensics.


    At Cigital, he works with a number of Fortune 250 companies on compliance, governance,
    forensics projects, conducting security assessments, and audits. He is a dedicated
    security evangelist, providing constant security support to businesses, educational
    institutions, and governmental agencies, globally.


    I would like to thank my family for supporting me throughout the book-writing
    process. I''d also like to thank my friends who have guided me in the InfoSec
    field and my colleagues at Cigital for being there when I needed help and support.


    ![](index-6_1.png)


    Abhinav Rai has been associated with information security, and has experience
    of application security and network security as well. He has performed security
    assessments on various applications built on different platforms. He is currently
    working as an information security analyst.


    He has completed his degree in Computer Science and his post-graduate diploma
    in IT Infrastructure System and Security. He also holds a certificate in communication
    protocol design and testing.


    He can be reached at `abhinav.rai.55@gmail.com`.


