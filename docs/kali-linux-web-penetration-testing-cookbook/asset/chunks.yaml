    In this recipe, we continued with the attack on an SSL connection. In the first
    step, we created the directories in which `SSLsplit` was going to save the information
    that was captured. The second step was the execution of `SSLsplit` with the following
    options:


    - `f-D`: This is to run `SSLsplit` in the foreground, not as a daemon, and with
    verbose output.

    - `f-l connections.log`: This saves a record of every connection attempt to the
    `connections.log` file in the current directory.

    - `f-j /tmp/sslsplit`: This is used to establish the jail directory directory
    that will contain `SSLsplit`''s environment as root (`chroot`) to `/tmp/sslsplit`.

    - `f-S logdir`: This is used to tell `SSLsplit` to save the content log—all the
    requests and responses—to `logdir` (in the jail directory) saving data to separate
    files.

    - `f-k` and `-c`: This is used to indicate the private key and the certificate
    to be used by `SSLsplit` when acting as CA.


    223


    ![](index-242_2.png)


    [Technet24.ir](http://technet24.ir)


    *Man in the Middle Attacks*


    - `f ssl 0.0.0.0 8443`: This tells `SSLsplit` where to listen for HTTPS (or other
    encrypted protocol) connections, remember that this is the port we forwarded from
    `443` using `iptables` in the previous recipe.

    - `f tcp 0.0.0.0 8080`: This tells `SSLsplit` where to listen for HTTP connections,
    remember that this is the port we forwarded from `80` using `iptables` in the
    previous recipe.


    After executing the command, we waited for the client to browse to the server''s
    HTTPS page and submit data, then we checked the log files to discover the unencrypted
    information.


    # Performing DNS spoofing and redirecting traffic


    DNS spoofing is an attack in which the person carrying out the MITM attack uses
    it to change the name resolution in the DNS server''s response to the victim,
    sending them to a malicious page instead of to the one they requested while still
    using the legitimate name.


    In this recipe, we will use `Ettercap` to perform a DNS spoofing attack and make
    the victim visit our site when they really wanted to visit a different site.


    ## Getting ready


    For this recipe, we will use our Windows client virtual machine but this time
    with the network adapter bridged to consult DNS resolution. Its IP address in
    this recipe will be `192.168.71.14`.


    The attacking machine will be our Kali Linux machine with the IP address `192.168.71.8`.
    It also will need to have an Apache server running and have a demo `index.html`
    page, ours will contain the following:


    ```

    # Spoofed SITE

    ```


    How to do it...


    1. Supposing we already have our Apache server running and the fake site correctly
    configured, let''s edit the file `/etc/ettercap/etter.dns` so that it contains
    only the following line:


    `A 192.168.71.8`


    We will set only one rule: All `A` records (address records) will resolve to `192.168.71.8`,
    which is our Kali Linux address. We could have left the other entries but we want
    to avoid noise in this example.


    224


    ![](index-243_1.png)


    ## Chapter 8


    2. This time, we will run `Ettercap` from the command line. Open a root terminal
    and issue the following command:


    ```

    ettercap -i wlan0 -T -P dns_spoof -M arp /192.168.71.14//*

    ```


    It will run `Ettercap` in text mode performing ARP spoofing with the `dns_spoof`
    plugin enabled, having only `192.168.71.14` as a target.


    ![](index-244_1.png)


    3. Having started the attack we go to the client machine and try to browse to
    a site by using its domain name, for example [www.yahoo.com](http://www.yahoo.com)
    as shown:


    ![](index-244_2.png)


    Note how the address and title bars show the name of the original site even though
    the content is from a different place.


    225


    ![](index-244_3.png)


    4. We can also try to perform an address resolution using `nslookup`, as shown
    here:


    ![](index-245_1.png)


    ## How it works...


    In this recipe, we saw how to use a Man In The Middle attack to force users to
    navigate to pages even when they believe they are on other sites.


    In the first step, we modified `Ettercap`''s name resolution file, ordering it
    to resolve all names requested to the address of our Kali machine.


    After that, we ran `Ettercap` with the following parameters: `-i wlan0 -T -P dns_spoof
    -M arp /192.168.71.14///`


    - `f-i wlan0`: Remember we needed the client to ask for DNS resolution, so we
    needed it to have a bridged adapter and to be within reach of our Kali machine
    so we set the sniffing interface as `wlan0` (the attacker''s computer wireless
    card).

    - `f-T`: This is used for text-only interface.

    - `f-P dns_spoof`: This is to enable the `dns_spoof` plugin.

    - `f-M arp`: This is to perform an ARP spoofing attack.

    - `f /192.168.71.14///`: This is how we set targets to `Ettercap` in the command
    line: `MAC/ip_address/port` where `//` means any MAC address corresponding to
    IP `192.168.71.14` (the client) at any port.


    Finally, we just confirmed that the attack was working OK.


    226


    ![](index-245_2.png)


