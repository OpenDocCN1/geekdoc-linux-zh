    ### 设置 Kali Linux 1


    在本章中，我们将涵盖：


    - 更新和升级 Kali Linux

    - 安装并运行 OWASP Mantra

    - 设置 Iceweasel 浏览器

    - 安装 VirtualBox

    - 创建一个带有漏洞的虚拟机

    - 创建一个客户端虚拟机

    - 配置虚拟机以正确通信

    - 了解漏洞虚拟机上的 Web 应用程序


    #### 导言


    在第一章中，我们将介绍如何准备 Kali Linux 安装，以便遵循书中的所有配方，并使用虚拟机建立带有漏洞 Web 应用程序的实验室。


    #### 更新和升级 Kali Linux


    在开始测试 Web 应用的安全之前，我们需要确保已拥有所有必要的最新工具。本配方涵盖了将 Kali Linux 及其工具保持在最新版本的基本任务。


    #### 1


    ![](img/index-20_1.png)


    *设置 Kali Linux*


    ##### 准备工作


    我们从在连接了网络的计算机上安装 Kali Linux 作为主操作系统开始；我们在本书中将使用的版本是 2.0。您可以从 `https://www.kali.org/downloads/`
    下载现场 CD 和安装程序。


    ###### 如何操作……


    一旦您运行了可用的 Kali Linux 实例，请执行以下步骤：


    1. 在 Kali Linux 上以 root 身份登录；默认密码为 `"toor"`（不带引号）。如果您倾向于使用普通用户而不是 root，可以使用 `su`
    切换用户或使用 `sudo` 执行单条命令。

    2. 打开终端。

    3. 运行 `apt-get update` 命令。这将下载可安装的软件包（应用程序和工具）更新列表。


    ```bash

    apt-get update

    ```


    ![](img/index-21_1.png)


    4. 更新完成后，运行以下命令将非系统软件包更新到其最后一个稳定版本：


    ```bash

    apt-get upgrade

    ```


    #### 2


    ![](img/index-21_2.png)


    ## 第 1 章


    ![](img/index-22_1.png)


    5. 当询问是否继续时，按 `Y` 然后按 `Enter`。

    6. 接下来，让我们升级系统。输入以下命令并按 `Enter`：


    ```bash

    apt-get dist-upgrade

    ```


    ![](img/index-22_2.png)


    7. 现在，我们的 Kali Linux 已经更新到最新状态并准备好继续。


    #### 3


    ![](img/index-22_3.png)


    *设置 Kali Linux*


    ##### 工作原理……


    在本配方中，我们涵盖了基于 Debian 的系统（如 Kali Linux）中软件包更新的基本程序。首次带有 `update` 参数调用 `apt-get`
    下载了在配置存储库中适用于我们特定系统的最新软件包列表。在下载并安装了存储库中所有最新版本的软件包后，`dist-upgrade` 处理依赖关系的变化。


    ###### 安装并运行 OWASP Mantra


    OWASP（开放 Web 应用安全项目）的人员整合了一个带有许多插件的 Firefox，旨在帮助渗透测试人员和开发者测试 Web 应用程序的漏洞。在本配方中，将在
    Kali Linux 上安装 OWASPMantra (`https://www.owasp.org/`)，首次运行它并查看某些功能。


    大多数 Web 渗透测试是通过浏览器完成的；这就是我们需要一个拥有正确工具集的浏览器的原因。OWASP Mantra 包含了用于执行任务的插件，例如嗅探和拦截
    HTTP 请求、调试代码以及修改 Cookie。


    工具（如 Metasploit 框架）有自己的命令；这些命令可以按照本配方执行。命令是：


    ```bash

    msfupdate

    ```


    ##### 准备工作


    幸运的是，OWASP Mantra 包含在 Kali Linux 默认存储库中。因此，为了确保获得最新的浏览器，我们需要更新软件包列表：


    ```bash

    apt-get update

    ```


    ###### 如何操作……


    1. 打开终端并运行：


    ```bash

    apt-get install owasp-mantra-ff

    ```


    ![](img/index-24_1.png)


    2. 安装完成后，导航到菜单 `Applications | 03 - Web Application Analysis | Web Vulnerability
    Scanners | owasp-mantra-ff` 首次 Mantra。或在终端中使用以下命令：


    ```bash

    owasp-mantra-ff

    ```


    ![](img/index-24_2.png)


    #### 5


    ![](img/index-24_3.png)


    3. 打开新浏览器后，点击 OWASP 图标然后点击 Tools。在这里我们可以访问 OWASP Mantra 包含的所有工具。


    ![](img/index-25_2.png)


    4. 我们将在后面的章节中使用其中一些工具。


    ##### 另请


    您可能对 Mantra on Chromium (MoC) 感兴趣，它是基于 Chromium 浏览器的 Mantra 替代版本。目前，它仅适用于 Windows：


    `http://www.getmantra.com/mantra-on-chromium.html`


