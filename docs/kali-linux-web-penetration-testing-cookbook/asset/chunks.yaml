    ### How it works...


    An ARP spoofing attack is only the start of more complex attacks. In this recipe,
    we used the packet filtering capability of `Ettercap` to identify a packet with
    specific content and modified it to force the user to log in to the application
    as an administrator. This can also be done from server to client and can be used
    to trick the user by showing them fake information. Our first step was to create
    the filtering script, which first checks if the packet being analyzed contains
    the information that identifies the one we want to alter, as illustrated:


