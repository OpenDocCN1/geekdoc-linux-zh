    This task of detecting vulnerabilities and discovering their impact on organizations
    is the one that is addressed through penetration testing. A penetration test is
    an attack or attacks made by a trained security professional who is using the
    same techniques and tools that real hackers use in order to discover all the possible
    weak spots in the organization''s systems. These weak spots are exploited and
    their impact is measured. When the test is finished, the penetration tester informs
    all their findings and tells how they can be fixed to prevent future damage.


    In this book, we follow the whole path of a web application penetration test and,
    in the form of easy-to-follow, step-by-step recipes, show how the vulnerabilities
    in web applications and web servers can be discovered, exploited, and fixed.


    ## What this book covers


    ### Chapter 1, Setting Up Kali Linux, takes the reader through the process of
    configuring and updating the system; also, the installation of virtualization
    software is covered, including the configuration of the virtual machines that
    will comprise our penetration testing lab.


    ![](index-14_1.png)


    ### Preface


    ### Chapter 2, Reconnaissance, enables the reader to put to practice some of the
    information gathering techniques in order to gain intelligence about the system
    to be tested, the software installed on it, and how the target web application
    is built.


    ### Chapter 3, Crawlers and Spiders, shows the reader how to use these tools,
    which are a must in every analysis of a web application, be it a functional one
    or more security focused, such as a penetration test.


    ### Chapter 4, Finding Vulnerabilities, explains that the core of a vulnerability
    analysis or a penetration test is to discover weak spots in the tested applications;
    recipes are focused on how to manually identify some of the most common vulnerabilities
    by introducing specific input values on applications'' forms and analyzing their
    outputs.


    ### Chapter 5, Automated Scanners, covers a very important aspect of the discovery
    of vulnerabilities, the use of tools specially designed to automatically find
    security flaws in web applications: automated vulnerability scanners.


    ### Chapter 6, Exploitation – Low Hanging Fruits, is the first chapter where we
    go further than just identifying the existence of some vulnerability. Every recipe
    in this chapter is focused on exploiting a specific type of vulnerability and
    using that exploitation to extract sensitive information or gain a more privileged
    level of access to the application.


    ### Chapter 7, Advanced Exploitation, follows the path of the previous chapter;
    here, the reader will have the opportunity to practice a more advanced and a more
    in-depth set of exploitation techniques for the most difficult situations and
    the most sophisticated setups.


    ### Chapter 8, Man in the Middle Attacks. Although not specific to web applications,
    MITM attacks play a very important role in the modern information security scenario.
    In this chapter, we will see how these are performed and what an attacker can
    do to their victims through such techniques.


    ### Chapter 9, Client-Side Attacks and Social Engineering, explains how it''s
    constantly said that the user is the weakest link in the security chain, but traditionally,
    penetration testing assessments exclude client-side attacks and social engineering
    campaigns. It is the goal of this book to give the reader a global view on penetration
    testing and to encourage the execution of assessments that cover all the aspects
    of security; this is why in this chapter we show how users can be targeted by
    hackers through technological and social means.


    ### Chapter 10, Mitigation of OWASP Top 10, shows that organizations hire penetration
    testers to attack their servers and applications with the goal of knowing what''s
    wrong, in order to know what they should fix and how. This chapter covers that
    face of penetration testing by giving simple and direct guidelines on what to
    do to fix and prevent the most critical web application vulnerabilities according
    to OWASP (Open Web Application Security Project).


    #### vi


    ![](index-15_1.png)


    #### Preface


    ## What you need for this book


    To successfully follow all recipes in this book, the reader needs to have a basic
    understanding of the following topics:


    - Linux OS installation

    - Unix/Linux command-line usage

    - HTML

    - PHP web application programming


    The only hardware that is necessary is a personal computer, preferably with `Kali
    Linux 2.0` installed, although it may have any other operation system capable
    of running `VirtualBox` or other virtualization software. As for specifications,
    the recommend setup is:


    - Intel i5, i7, or similar CPU

    - 500 GB hard drive

    - 8 GB RAM

    - Internet connection


    ## Who this book is for


    We tried to make this book with many kinds of reader in mind. First, computer
    science students, developers, and systems administrators that want to go one step
    further in their knowledge about information security or want to pursue a career
    in the field will find here some very easy-to-follow recipes that will allow them
    to perform their first penetration test in their own testing laboratory and will
    also give them the basis and tools to continue practicing and learning.


    Application developers and systems administrators will also learn how attackers
    behave in the real world, what steps can be followed to build more secure applications
    and systems and how to detect malicious behavior.


    Finally, seasoned security professionals will find some intermediate and advanced
    exploitation techniques and ideas on how to combine two or more vulnerabilities
    in order to perform a more sophisticated attack.


    ## Conventions


    In this book, you will find a number of styles of text that distinguish between
    different kinds of information. Here are some examples of these styles, and an
    explanation of their meaning. Code words in text, database table names, folder
    names, filenames, file extensions, pathnames, dummy URLs, user input, and Twitter
    handles are shown as follows: "We will be using one of them: select the file `/usr/share/wordlists/dirbuster/directory-list-lowercase-2.3-small.txt`."


    #### vii


    ![](index-16_1.png)


