    ### How it works...


    Exploiting a Blind SQL Injection takes up more effort and time than an error-based
    injection; in this recipe we saw how to obtain the name of the user connected
    to the database while, in the SQLi exploitation in Chapter 6, Exploitation – Low
    Hanging Fruits, we used a single command to get it.


    We could have used a dictionary approach to see if the current user was in a list
    of names but it would take up much more time and the name might not be in the
    list anyway.


    We initially identified the vulnerability and revealed the messages telling us
    whether our requests were true or false.


    Once we knew there was an injection and what a positive response would look like,
    we proceeded to ask for the length of the current username, asking the database,
    is 1 the length of the current username, is it 2, and so on, until the length
    is discovered. It is useful to know when to stop looking for characters in the
    username.


    After finding the length, we use the same technique to discover the first letter,
    the `LIKE ''b%''` statement tells the SQL interpreter whether or not the first
    letter is b; the rest doesn''t matter, it could be anything (% is the wildcard
    character for most SQL implementations). Here, we saw that the first letter was
    an S. Using the same principle, we found the second character and worked out the
    name.


    ### There''s more...


    This attack could continue by finding out the DBMS and the version being used
    and then using vendor-specific commands to see if the user has administrative
    privileges. If they do, you would extract all usernames and passwords, activate
    remote connections, and many more things besides


