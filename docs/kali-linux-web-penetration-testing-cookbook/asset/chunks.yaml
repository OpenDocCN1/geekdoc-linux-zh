    *Advanced Exploitation*


    How it works...


    As mentioned in *Chapter 4*, *Finding Vulnerabilities*, Heartbleed vulnerability
    allows an attacker to read information from the OpenSSL server memory in clear
    text, which means that we don''t need to decrypt or even intercept any communication
    between the client and the server, we simply ask the server what''s in its memory
    and it responds with the unencrypted information.


    In this recipe, we have used a publicly available exploit to perform the attack
    and obtained at least one valid session ID. It is sometimes possible to find passwords
    or other sensitive information with Heartbleed dumps.


    Finally, the strings command displays only printable strings in files, skipping
    all the special characters thereby making it easier to read.


    Exploiting XSS with BeEF


    BeEF, the browser exploitation framework, is a tool that focuses on client-side
    attack vectors, specifically on attacking web browsers.


    In this recipe, we will exploit an XSS vulnerability and use BeEF to take control
    of the client browser.


