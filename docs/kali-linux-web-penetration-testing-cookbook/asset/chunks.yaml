    ### How it works...


    In this recipe, we used the ZAP proxy to intercept a valid request, modified it
    to make it invalid or malicious, and then sent it to the server and provoked an
    unexpected behavior in it.


    The first three steps were meant to enable the security protection so that the
    application can detect the apostrophe as a bad character.


    After that we made a test request and verified that some validation was performed.
    The fact that no request went through the proxy when the alert showed up told
    us that the validation was performed on the client side, maybe using JavaScript.
    Upon knowing this, we made a valid request and intercepted it with the proxy,
    this made us bypass the protection on the client side; we converted that request
    into a malicious one and sent it to the server; which was unable to process it
    correctly and returned an error.


