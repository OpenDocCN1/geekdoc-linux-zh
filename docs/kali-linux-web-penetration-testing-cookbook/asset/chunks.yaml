    ### How it works...


    When we configure our browser to use ZAP as a proxy, it doesn''t send the requests
    directly to the server that hosts the pages we want to see but rather to the address
    we defined, in this case the one where ZAP is listening. Then ZAP forwards the
    request to the server but not without analyzing the information we sent.


    ZAP''s Forced Browse works the same way DirBuster does; it takes the dictionary
    we configured and sends requests to the server, as if it was trying to browse
    to the files in the list. If the files exist the server will respond accordingly,
    if they don''t exist or aren''t accessible by our current user, the server will
    return an error.


    ### See also


    Another very useful proxy included in Kali Linux is BurpSuite. It also has some
    very interesting features; one that can be used as an alternative for the Forced
    Browse we just used is Burp''s Intruder. Although it is not specifically intended
    for that purpose, it is a versatile tool worth checking.


