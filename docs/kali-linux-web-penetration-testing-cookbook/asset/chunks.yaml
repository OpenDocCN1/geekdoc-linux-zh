    # 侦察


    ## 利用 robots.txt


    在侦察中更进一步一步，我们需要确定网站中是否有任何页面或目录没有链接到普通用户看到的内容。例如，内网的登录页面或内容管理系统（CMS）的管理界面。找到此类站点将极大扩展我们的测试面，并能提供关于应用程序及其基础设施的一些重要线索。


    在本教程中，我们将使用 `robots.txt` 文件来发现一些可能没有链接到主程序任何地方的文件和目录。


