    Authentication is the process whereby users prove that they are who they say they
    are; this is usually done through usernames and passwords. Some common flaws in
    this area are permissive password policies and security through obscurity (lack
    of authentication in supposedly hidden resources).


    Session management is the handling of session identifiers of logged users; in
    Web servers this is done by implementing session cookies and tokens. These identifiers
    can be implanted, stolen, or "hijacked" by attackers by social engineering, cross-site
    scripting or `CSRF`, and so on. Hence, a developer must pay special attention
    to how this information is managed.


    In this recipe, we will cover some of the best practices when implementing username/password
    authentication and to manage the session identifiers of logged users.


    254


    ![](index-273_1.png)


    ## Chapter 10


    How to do it...


    1. If there is a page, form, or any piece of information in the application that
    should be viewed only by authorized users, make sure that a proper authentication
    is done before showing it.

    2. Make sure usernames, `IDs`, passwords, and all other authentication data are
    case-sensitive and unique for each user.

    3. Establish a strong password policy that forces the users to create passwords
    that fulfill, at least, the following requirements: More than 8 characters, preferably
    10. Use of upper-case and lower-case letters. Use of at least one numeric character
    (`0-9`). Use of at least one special character (space, `!`, `&`, `#`, and so on).
    Forbid the username, site name, company name, or their variations (changed case,
    `l33t`, fragments of them) to be used as passwords.

    Forbid the use of passwords in the "Most common passwords" list: [https://www.teamsid.com/worst-passwords-2015/](https://www.teamsid.com/worst-passwords-2015/)

    4. Never specify in an error message if a user exists or not or if the information
    has the correct format. Use the same generic message for incorrect login attempts,
    non-existent users, names or passwords not matching the pattern, and all other
    possible login errors. Such a message could be:

    `Login data is incorrect.`

    `Invalid username or password.`

    `Access denied.`

    5. Passwords must not be stored in clear-text format in the database; use a strong
    hashing algorithm, such as `SHA-2`, `scrypt`, or `bcrypt`, which is especially
    made to be hard to crack with GPUs.

    6. When comparing a user input against the password for login, hash the user input
    and then compare both hashing strings. Never decrypt the passwords for comparison
    with a clear text user input.

    7. Avoid Basic HTML authentication.

    8. When possible, use multi-factor authentication (`MFA`), which means using more
    than one authentication factor to login: Something you know (account details or
    passwords) Something you have (tokens or mobile phones) Something you are (biometrics)


    255


    ![](index-274_1.png)


    [Technet24.ir](http://technet24.ir)


    ### Mitigation of OWASP Top 10


    9. Implement the use of certificates, pre-shared keys, or other passwordless authentication
    protocols (`OAuth2`, `OpenID`, `SAML`, or `FIDO`) when possible.

    10. When it comes to session management, it is recommended that you use the language''s
    built-in session management system, `Java`, `ASP.NET`, and `PHP`. They are not
    perfect, but surely provide a well designed and widely tested mechanism and they
    are easier to implement than any homemade version a development team, worried
    by release dates, could make.

    11. Always use `HTTPS` for login and logged in pages—obviously, by avoiding the
    use of `SSL` and only accepting `TLS v1.1`, or later, connections.

    12. To ensure the use of `HTTPS`, HTTP Strict Transport Security (`HSTS`) can
    be used. It is an opt-in security feature specified by the web application through
    the use of the `Strict-Transport-Security` header; it redirects to the secure
    option when `http://` is used in the URL and prevents the overriding of the "invalid
    certificate" message, for example, the one that shows when using `Burp Suite`.
    For more information, you could check: [https://www.owasp.org/index.php/HTTP_Strict_Transport_Security](https://www.owasp.org/index.php/HTTP_Strict_Transport_Security)

    13. Always set `HTTPOnly` and `Secure` cookies'' attributes.

    14. Set reduced, but realistic session expiration times. Not so long that an attacker
    may be able to reuse a session when the legitimate user leaves, and not so short
    that the user doesn''t have the opportunity to perform the tasks the application
    is intended to perform.


    How it works...


    Authentication mechanisms in Web applications are very often reduced to a username/
    password login page. Although not the most secure option, it is the easiest for
    users and developers; and when dealing with passwords, their most important aspect
    is their strength.


    As we have seen throughout this book, the strength of a password is given by how
    hard it is to break, be it by brute force, dictionary, or guessing. The first
    tips in this recipe are meant to make passwords harder to brute-force by establishing
    a minimum length and using mixed character sets, harder to guess by eliminating
    the more intuitive choices (user name, most common passwords, company name); and
    harder to break if leaked, by using strong hashing or encryption when storing
    them.


    As for session management: the expiration times, uniqueness, and strength of session
    `ID` (already implemented in the language''s in-built mechanisms), and security
    in cookie settings are the key. The most important aspect when talking about authentication
    probably, is that no security is secure if it can be intercepted and read through
    a man in the middle attack; so, the use of properly configured encrypted channel,
    such as `TLS`, is vital to keep our users'' authentication data secure.


    256


    ![](index-275_1.png)


    ## Chapter 10


    See also


    OWASP has a couple of really good pages on authentication and session management;
    I absolutely recommend reading and taking them into consideration when building
    and configuring a Web application.

    f [https://www.owasp.org/index.php/Authentication_Cheat_Sheet](https://www.owasp.org/index.php/Authentication_Cheat_Sheet)

    f [https://www.owasp.org/index.php/Session_Management_Cheat_Sheet](https://www.owasp.org/index.php/Session_Management_Cheat_Sheet)


    ## A3 – Preventing cross-site scripting


    Cross-site scripting, as seen previously, happens when the data shown to the user
    is not correctly encoded and the browser interprets it as a script code and executes
    it. This also has an input validation factor, as a malicious code is usually inserted
    through input variables.


    In this recipe, we will cover the input validation and output encoding required
    for developers to prevent XSS vulnerabilities in their applications.


    How to do it...


    1. The first sign of an application being vulnerable to XSS is that in the page
    it reflects the exact input given by the user. So, try not to use user-given information
    to build output text.

    2. When you need to put user-provided data in the output page, validate such data
    to prevent the insertion of any type of code. We already saw how to do that in
    the *A1 – Preventing injection attacks* recipe.

    3. If, for some reason, the user is allowed to input special characters or code
    fragments, sanitize or properly encode the text before inserting it in the output.

    4. For sanitization, in PHP, `filter_var` can be used; for example, if you want
    to have only e-mail valid characters in the string:


    ```php

    $email = "john(.doe)@exa//mple.com";

    $email = filter_var($email, FILTER_SANITIZE_EMAIL);

    echo $email;

    ```

    5. For encoding, you can use `htmlspecialchars` in PHP:


    ```php

    $str = "The JavaScript HTML tags are";

    ```

    '
