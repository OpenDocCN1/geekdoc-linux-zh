    4\. Considering the fact that an injection occurs, it is also useful to restrict
    the amount of


    damage that can be done. So, use a low-privileged system user to run the database
    and web servers.


    5\. Make sure the user that the applications allow to connect to the database
    server is


    not a database administrator.


    6\. Disable or even delete the stored procedures that allow an attacker to execute
    system


    commands or escalate privileges, such as xp_cmdshell in MS SQL Server.


    How it works...


    The main part of preventing any kind of code injection attack is always a proper
    input validation, both on the client-side and server-side.


    For SQL Injection also, always use parameterized or prepared queries instead of
    concatenating SQL sentences and inputs. Parameterized queries insert function
    parameters in specified places of an SQL sentence, eliminating the need for programmers
    to construct the query themselves, by concatenation.


