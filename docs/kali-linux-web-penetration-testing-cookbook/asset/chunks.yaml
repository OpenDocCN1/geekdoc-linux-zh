    ## 中间人攻击（第 8 节）


    在本章中，我们将涵盖：


    - 使用 Ettercap 设置欺骗攻击

    - 充当中间人（MITM）并使用 Wireshark 捕获流量

    - 修改服务器与客户端之间的数据

    - 设置 SSL 中间人（MITM）攻击

    - 使用 SSLsplit 获取 SSL 数据

    - 执行 DNS 欺骗并重定向流量


    ### 介绍


    中间人（MITM）攻击是攻击者将自己置于通信双方（通常是客户端和服务器）之间通信链路中间的攻击类型。这是通过破坏原始通道，然后拦截一方的消息并将其（有时会进行修改）转发给另一方来实现的。


    207


    ![](img/index-226_1.png)


    [Technet24.ir](http://technet24.ir)


    *中间人攻击*


    让我们来看下面的示例：


    ![](img/index-227_1.png)


    Alice 连接到一个 Web 服务器，Bob 想知道 Alice 发了什么信息，因此 Bob 通过告诉服务器他是 Alice 并告诉 Alice 他是服务器来建立中间人攻击。现在，Alice
    的计算机询问所有设备“xxx.xxx 的 MAC 地址是多少”时，它将相信从任何设备获得的答案，无论该答案是否是想要的。ARP 欺骗通过向通信链的末端发送大量
    ARP 响应来实现，告诉每一方攻击者的 MAC 地址与其对方的 IP 地址对应。


    在本章中，我们将设置中间人攻击，并将自己置于客户端和服务器之间。


