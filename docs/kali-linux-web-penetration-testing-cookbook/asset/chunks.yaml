    ### 工作原理...


    在这个用例中，我们使用了 `script` 标签的 `src` 属性来调用外部 JavaScript 文件，在这种情况下是指向我们 BeEF 服务器的挂钩。`hook.js`
    文件与服务器通信、执行命令并返回响应，以便攻击者查看它们；它在客户端浏览器中不打印任何内容，因此受害者通常不知道其浏览器已被入侵。在让受害者执行我们的挂钩脚本后，我们使用了持久化工具
    `Man In The Browser` 让浏览器在用户每次点击同一域名的链接时都执行 AJAX 请求，这样该请求就能保持挂钩并加载新页面。我们还看到 BeEF
    的日志记录了用户在页面上执行的每一个操作，我们能够从中获取用户名和密码。此外还可以远程获取会话 cookie，这可能允许攻击者劫持受害者的会话。


    ### 更多功能...


    BeEF 拥有惊人的功能，从确定受害者使用的浏览器类型到对已知漏洞的利用，再到对客户端系统的完全控制。一些有趣的功能如下：


    - `Social Engineering/Pretty Theft`：这是一个社会工程学工具，允许我们模拟类似于 Facebook、LinkedIn 等其他常见服务的登录弹出窗口。

    - `Browser/Webcam` 和 `Browser/Webcam HTML5`：虽然显而易见，这两个模块能够利用宽松的配置来激活受害者的摄像头，第一个使用隐藏嵌入，另一个使用
    HTML5。

    - `Exploits`：包含一组针对特定情况的利用程序，其中一些利用服务器，另一些则利用客户端浏览器。


