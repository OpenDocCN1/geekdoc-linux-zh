    ## Introduction


    Every penetration test, be it for a network or a web application, has a workflow;
    it has a series of stages that should be completed in order to increase our chances
    of finding and exploiting every possible vulnerability affecting our targets,
    such as:


    - Reconnaissance

    - Enumeration

    - Exploitation

    - Maintaining access

    - Cleaning tracks


