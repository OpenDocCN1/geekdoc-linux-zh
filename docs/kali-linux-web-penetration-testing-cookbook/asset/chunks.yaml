    *高级利用*


    3. 要破解文件中的哈希值，我们只需要在之前的命令中将哈希替换为文件名即可：


    ```

    oclhashcat -m 0 -a 3 hashes_only_6_7.txt

    ```


    ![](img/index-225_1.png)


    如你所示，它在不到三分钟内涵盖了一到七字符的所有可能组合（速度为每秒 6.885 亿哈希），测试所有八字符组合将需要稍多两个小时。对于暴力破解来说，这似乎很棒了。


    ### 工作原理...


    我们在本教程中运行 `oclHashcat` 使用的参数定义了要使用的哈希算法：`-m 0` 通知程序使用 MD5 对其生成的单词进行哈希处理，以及攻击类型。`-a
    3` 表示我们想要使用纯暴力破解攻击，尝试所有可能的字符组合直到得到密码。最后，我们在第一种情况下添加了想要破解的哈希，在第二种情况下添加了包含哈希集合的文件。


    `oclHashcat` 还可以使用字典文件并进行混合攻击（暴力破解加字典）来定义要测试的字符集，并将结果保存到指定文件（它们被保存到 `/usr/share/oclHashcat/oclHashcat.pot`）。它还可以对单词应用规则并使用统计模型（马尔可夫链）来提高破解效率。要查看所有选项，请使用
    `--help` 命令，如下：


    ```

    oclhashcat --help

    ```


