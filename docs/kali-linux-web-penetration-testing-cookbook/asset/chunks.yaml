    \n*客户端攻击与社会工程学*\n\n### 使用之前保存的页面创建钓鱼网站\n\n在在上一个教程中，我们使用 SET 复制了一个网站并用它收集密码。有时，仅克隆登录页面对于更高级的用户可能不起作用；当他们输入正确的密码并被再次重定向到登录页面时，他们可能会怀疑；或者他们会尝试浏览页面上的其他链接，由于他们离开我们的页面回到原始页面，我们就会失去他们。\n\
