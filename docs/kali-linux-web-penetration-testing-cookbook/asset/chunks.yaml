    Shellshock affected a huge number of servers and devices all around the world
    and there is a variety of ways to exploit it, for example, the `Metasploit Framework`
    includes a module to set up a DHCP server to inject commands on the clients that
    connect to it; this is very useful in a network penetration test in which we have
    mobile devices connected to the LAN (`https://www.rapid7.com/db/modules/auxiliary/server/dhclient_bash_env`).


    ### Cracking password hashes with John the Ripper by using a dictionary


    In the previous recipe and in Chapter 6, *Exploitation – Low Hanging Fruits*,
    we extracted password hashes from databases. Sometimes, this is the only way of
    finding password information when performing penetration tests. In order to find
    the real password, we need to decipher them and as hashes are generated through
    irreversible algorithms we have no way of decrypting the password directly, hence
    it is necessary to use slower methods like brute force and dictionary cracking.


    In this recipe, we will use `John the Ripper` (`JTR` or simply `John`), the most
    popular password cracker, to recover passwords from the hashes extracted in the
    Step by step SQL Injection recipe in Chapter 6, *Exploitation – Low Hanging Fruits*.


    ### How to do it...


    1. Although `JTR` is very flexible with respect to how it receives input, to prevent
    misinterpretations, we first need to set usernames and password hashes in a specific
    format. Create a text file called `hashes_6_7.txt` containing one name and hash
    per line, separated by a colon (`username:hash`), as illustrated:


    ![](index-221_1.png)


    202


    ![](index-221_2.png)


    ## Chapter 7


    2. Once we have the file, we can go to a terminal and execute the following command:


    `john --wordlist=/usr/share/wordlists/rockyou.txt --format=raw-md5 hashes_6_7.txt`


    ![](index-222_1.png)


    We are using one of the word lists preloaded into `Kali Linux`. We can see that
    there are five out of six passwords in the word list. We can also see that `John`
    checked 10,336,000 comparisons per second (10,336 KC/s).


    3. `John` also has the option to apply modifier rules — add prefixes or suffixes,
    change the case of letters, and use leetspeak on every password. Let''s try it
    on the still uncracked password:


    `john --wordlist=/usr/share/wordlists/rockyou.txt --format=raw-md5 hashes_6_7.txt
    --rules`


    ![](index-222_2.png)


    We can see that the rules worked and we found the last password.


    ### How it works...


    `John` (and every other offline password cracker) works by hashing the words in
    the list (or the ones it generates) and comparing them to the hashes to be cracked
    and, when there is a match, it assumes the password has been found.


    The first command uses the `--wordlist` option to tell `John` what words to use.
    If it is omitted, it generates its own list to generate a brute force attack.
    The `--format` option tells us what algorithm was used to generate the hashes
    and if the format has been omitted, `John` tries to guess it, usually with good
    results. Lastly, we put the file that contains the hashes we want to crack.


