    ![](index-22_1.png)


    5. When asked to continue, press `Y` and then press `Enter`.

    6. Next, let''s upgrade our system. Type the following command and press `Enter`:


    ```bash

    apt-get dist-upgrade

    ```


    ![](index-22_2.png)


    7. Now, we have our Kali Linux up-to-date and ready to continue.


    #### 3


    ![](index-22_3.png)


    *Setting Up Kali Linux*


    ##### How it works...


    In this recipe, we have covered a basic procedure for package update in Debian-based
    systems (such as Kali Linux). The first call to `apt-get` with the `update` parameter
    downloaded the most recent list of packages available for our specific system
    in the configured repositories. After it downloads and installs all the packages
    that have the most recent versions in the repository, the `dist-upgrade` handles
    changing dependencies.


    ###### Installing and running OWASP Mantra


    People in OWASP (Open Web Application Security Project) have put together a Mozilla
    Firefox with plenty of add-ons aimed at helping penetration testers and developers
    to test web applications for bugs or security flaws. In this recipe, we will install
    OWASPMantra (`https://www.owasp.org/`) in our Kali Linux, run it for the first
    time, and see some of its features.


    Most of the web application penetration testing is done through a web browser;
    that''s the reason why we need to have one with the correct set of tools. OWASP
    Mantra includes a collection of add-ons to perform tasks, such as sniffing and
    intercepting HTTP requests, debugging code, and modifying cookies.


    There are tools, such as the Metasploit Framework, that have their own commands;
    these can be executed following this recipe. The command is:


    ```bash

    msfupdate

    ```


    ##### Getting ready


    Fortunately for us, OWASP Mantra is included in the default Kali Linux repositories.
    So, to make sure that we get the latest version of the browser, we need to update
    the packages list:


    ```bash

    apt-get update

    ```


    ###### How to do it...


    1. Open a terminal and run:


    ```bash

    apt-get install owasp-mantra-ff

    ```


    ![](index-24_1.png)


    2. After the installation is finished, navigate to menu: `Applications | 03 -
    Web Application Analysis | Web Vulnerability Scanners | owasp-mantra-ff` to start
    Mantra for the first time. Or use a terminal with the following command:


    ```bash

    owasp-mantra-ff

    ```


    ![](index-24_2.png)


    #### 5


    ![](index-24_3.png)


    3. With the new browser open, click on the OWASP logo and then Tools. Here we
    can access all the tools that OWASP Mantra includes.


    ![](index-25_2.png)


    4. We will use some of these tools in later chapters.


    ##### See also


    You may also be interested in Mantra on Chromium (MoC), which is an alternative
    release of Mantra based on the Chromium web browser. Currently, it is only available
    for windows:


    `http://www.getmantra.com/mantra-on-chromium.html`

