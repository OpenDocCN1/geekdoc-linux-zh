    Account Details)。


    ![](img/index-103_3.jpg)


    我们收到了一条警告消息，告诉我们输入中的某些字符是无效的。在这种情况下，单引号 ('''') 肯定被应用程序的安全措施检测并拦截了。


    5. 点击确定 (OK) 关闭警报。


    如果我们检查 ZAP 中的历史记录，可以看到没有发送带有我们输入的数据的请求，这是由于客户端验证机制。我们将使用代理拦截来绕过此保护。


    6. 现在，我们通过点击“拦截所有请求”(break on all requests)”按钮来启用请求拦截（在 ZAP 中称为断点/breakpoints）。


