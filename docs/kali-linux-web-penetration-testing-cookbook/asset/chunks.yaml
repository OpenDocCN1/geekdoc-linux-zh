    Exploiting Heartbleed vulnerability


    In this recipe, we will use our previously compiled Heartbleed exploit to extract
    information about the vulnerable Bee-box server (https://192.168.56.103:8443/
    in this recipe).


    The Bee-box virtual machine can be downloaded from [https://www.vulnhub.com/](https://www.vulnhub.com/entry/bwapp-bee-box-v16,53/)


