    #### 前言


    ## 阅读此书所需的准备


    为了成功遵循书中的所有谱，读者需要对以下主题有基础了解：


    - Linux 操作系统安装

    - Unix/Linux 命令行使用

    - HTML

    - PHP Web 应用程序编程


    唯一的必需硬件是个人电脑，最好安装了 `Kali Linux 2.0`，尽管它可以是任何其他能够运行 `VirtualBox` 或虚拟化软件的操作系统。至于规格，推荐的配置是：


    - Intel i5, i7 或类似的 CPU

    - 500 GB 硬盘

    - 8 GB RAM

    - 互联网连接


    ## 本书的读者群


    我们尝试考虑到多种读者编写此书。首先，计算机科学专业的学生、开发者和系统管理员，如果他们想在信息安全知识上更进一步，或想在该领域追求职业，将在这里找到一些非常易于遵循的谱，这些谱将允许他们在自己的测试实验室中进行首次渗透测试，并为他们继续实践和学习的基础和工具。


    应用程序开发者和系统管理员也将学习攻击者在现实世界中的行为、可以遵循哪些步骤来构建更安全的应用程序和系统，以及如何检测恶意行为。


    最后，经验丰富的安全人员将发现一些中高级的利用技术，以及如何结合两个或多个漏洞以执行更复杂的攻击的想法。


