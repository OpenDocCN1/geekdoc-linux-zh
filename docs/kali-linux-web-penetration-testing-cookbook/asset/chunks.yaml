    \ receive and send information through a single network interface. We select bridged\
    \ mode when our targets are reachable through different network interfaces, for\
    \ example, if we have two network cards and connect to the client through one\
    \ and to the server through the other.\n\nAfter the sniffing is started, we select\
    \ our targets.\n\n### Select your targets beforehand\n\nIt is important to include\
    \ only strictly necessary hosts as targets for a single attack since poisoning\
    \ attacks generate a lot of network traffic and cause performance problems to\
    \ all hosts. Before starting an MITM attack, identify clearly which two systems\
    \ are going to be the targets and spoof only those systems.\n\nOnce our targets\
    \ are set, we start the ARP poisoning attack. Sniffing remote connections means\
    \ that Ettercap will capture and read all the packets sent between endpoints,\
    \ and Only poison one way is useful when we only want to poison the client and\
    \ don't want to know the responses from the server or gateway (or if it has any\
    \ protection against ARP poisoning).\n\n211\n\n![](index-230_2.png)\n\n[Technet24.ir](http://technet24.ir)\n\
    \n*Man in the Middle Attacks*\n\n### Being the MITM and capturing traffic with\
    \ Wireshark\n\nEttercap can detect when relevant information such as passwords\
    \ is transmitted through it. However, it is often not enough to intercept a set\
    \ of credentials when performing a penetration test, we might be looking for other\
    \ information like credit card numbers, social security numbers, names, pictures,\
    \ or documents. It is therefore useful to have a tool that can listen to all the\
    \ traffic in the network so that we can save and analyze it later; this tool is\
    \ a sniffer and the best one for our purposes is Wireshark and it is included\
    \ in Kali Linux.\n\nIn this recipe, we will use Wireshark to capture all the packets\
    \ sent between the client and the server in order to obtain information.\n\n###\
    \ Getting ready\n\nWe need to have MITM working before starting this recipe.\n\
    \n#### How to do it...\n\n1. Run Wireshark from the middle of the Windows client\
    \ and `vulnerable_vm` from Kali's Applications menu | Sniffing & Spoofing or from\
    \ the terminal run: `wireshark`\n2. When Wireshark loads, select the network interface\
    \ you want to capture packets from. We will use `vboxnet0`, as shown:\n\n![](index-231_1.png)\n\
    3. Then click on Start. You will immediately see Wireshark capturing ARP packets,\
