    ## How it works...


    Browser Autopwn sets up a web server with a main page that uses JavaScript to
    identify what software the client is running and based on that choose what exploit
    to try with it.


    In this recipe, we set our Kali machine to listen on port 80 for requests to the
    kittens directory. Other options we configured were:


    - `EXCLUDE_PATTERN`: To tell BAP2 to exclude (not load) exploits for Android browsers
    or for Flash plugins.

    - `ShowExploitList`: To show the loaded exploits when BAP2 is run.

    - `VERBOSE`: To tell BAP2 to display more information about what was loaded, where
    and what''s happening at every step After that, we just need to run the module
    and make some users to come to our /kittens site.


