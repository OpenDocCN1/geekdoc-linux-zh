    ### How it works...


    Burp''s spider follows the same methodology as other spiders, but it operates
    in a slightly different way. We can have it running while we browse the site and
    it will add the links we follow (that match the scope definition) to the crawling
    queue.


    Just like in ZAP, we can use Burp''s crawling results to perform any operation;
    we can perform any request, such as scanning (if we have the paid version), repeat,
    compare, fuzz, view in browser, and so on.


    ### Repeating requests with Burp''s repeater


    When analyzing the spider''s results and testing possible inputs to forms, it
    may be useful to send different versions of the same request changing specific
    values.


    In this recipe, we will learn how to use Burp''s repeater to send requests multiple
    times with different values.


    #### Getting ready


    We begin this recipe from the point we left the previous one. It is necessary
    to have the `vulnerable_vm` virtual machine running, Burp Suite started, and the
    browser properly configured to use it as a proxy.


    #### How to do it...


    1. Our first step is to go to the `Target` tab and then to the request the spider
    made to the login page (`http://192.168.56.102/bodgeit/login.jsp`), the one that
    says `username=test&password=test`.


