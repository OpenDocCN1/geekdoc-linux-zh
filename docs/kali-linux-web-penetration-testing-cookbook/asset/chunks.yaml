    Setting up an SSL MITM attack


    If we try to sniff on an HTTPS session using what we have seen so far, we won''t
    be able to get very much from it as all communication is encrypted.


    In order to intercept, read and alter SSL and TLS connections, we need to do a
    series of preparatory steps to set up our SSL proxy. SSLsplit works by using two
    certificates, one to tell the server that it is the client so that it can receive
    and decrypt server responses and one to tell the client that it is the server.
    For this second certificate, if we are going to supplant a site which possesses
    its own domain name, and its certificates have been signed by a Certificate Authority
    (CA) we need to have a CA to issue a root certificate for us and, as we are acting
    as attackers, we need to do it ourselves.


    In this recipe, we will configure our own Certificate Authority and a few IP forwarding
    rules to carry out SSL Man In The Middle attacks.


    How to do it...


    1\. Firstly, we are going to create a CA private key on the Kali Linux computer
    so issue the


    following command in a root terminal:


    **openssl genrsa -out certaauth.key 4096**


    2\. Now let''s create a certificate signed with that key:


    **openssl req -new -x509 -days 365 -key certauth.key -out ca.crt**


    3\. Fill out all the requested information (or just hit *Enter* for every field).


    4\. Next, we need to enable IP forwarding to enable the system''s routing functionality
    (to


    forward IP packets not meant for the local machine to the default gateway): **echo
    1 > /proc/sys/net/ipv4/ip_forward**


    219


    ![](index-238_1.png)


    [Technet24.ir](http://technet24.ir)


    *Man in the Middle Attacks*


    5\. Now we are going to configure some rules to prevent forwarding everything.
    First, let''s


    check if we there is anything in our iptables'' nat table: **iptables -t nat -L**


    ![](index-239_1.png)


    6\. If there is anything there, you may want to back it up because we are going
    to flush


    everything, as shown:


    **iptables -t nat -L > iptables.nat.bkp.txt**


    7\. Now let''s flush the table:


    **iptables -t nat -F**


    8\. We then set up the prerouting rules:


    **iptables -t nat -A PREROUTING -p tcp --dport 80 -j REDIRECT --to-****ports 8080**


    **iptables -t nat -A PREROUTING -p tcp --dport 443 -j REDIRECT --to-****ports
    8443**


    Now we are ready to sniff encrypted connections.


    220


    ![](index-239_2.png)


    ## *Chapter 8*


    How it works...


    In this recipe, we configured our Kali machine to act as a CA which meant it could
    validate the certificates that SSLsplit issues. In the first two steps, we only
    created the private key and the certificate to be used to sign those certificates.


    Next, we established port forwarding and its rules. We first enabled the forwarding
    option and, after that, created iptables rules to forward requests from ports
    80 and 443 (HTTP and HTTPS). This was done to redirect the requests our MITM attack
    was intercepting to SSLsplit so that it could decrypt the received message with
    one certificate, process it, and encrypt it with the other to send it to its destination.


    See also


    You should read a little more about encryption certificates and SSL and TLS protocols,
    as well as about SSLsplit, which you can do here:


    f [https://en.wikipedia.org/wiki/Public_key_certificate](https://en.wikipedia.org/wiki/Public_key_certificate)


    f [https://www.roe.ch/SSLsplit](https://www.roe.ch/SSLsplit)


    f [https://en.wikipedia.org/wiki/Iptables](https://en.wikipedia.org/wiki/Iptables)


    f man iptables


    Obtaining SSL data with SSLsplit


    In the previous recipe, we prepared our environment to attack an SSL/TLS connection
    while, in this recipe, we will use SSLsplit to complement a MITM attack and extract
    information from an encrypted communication.


    Getting ready


    We need to have an ARP spoofing attack executing before we start this recipe and
    have successfully completed the previous recipe *Setting up an SSL MITM attack*.


    How to do it...


    1\. Firstly, we need to create the directories in which SSLsplit is going to store
    the logs.


    To do that, open a terminal and create two directories, as shown:


    **mkdir /tmp/sslsplit**


    **mkdir /tmp/sslsplit/logdir**


    221


    ![](index-240_1.png)


    [Technet24.ir](http://technet24.ir)


    *Man in the Middle Attacks*


    2\. Now, let''s start SSLsplit:


    **sslsplit -D -l connections.log -j /tmp/sslsplit -S logdir -k** **certauth.key
    -c ca.crt ssl 0.0.0.0 8443 tcp 0.0.0.0 8080**


    ![](index-241_1.png)


    3\. Now that SSLsplit is running and the MITM between the windows client and the


    vulnerable_vm, go to the client and browse to: https://192.168.56.102/dvwa/.


    4\. The browser may ask for confirmation as our CA and certificate are not officially


    recognized by any web browser. Set the exception and continue.


    ![](index-241_2.png)


    222


    ![](index-241_3.png)


    ## *Chapter 8*


    5\. Now log in to DVWA using the admin user and password.


    6\. Let''s see what happened in SSLsplit by going to a new terminal and checking
    the


    contents of the logs in the directory we created for SSLsplit:


    **ls /tmp/sslsplit/logdir/**


    **cat /tmp/sslsplit/logdir/***


    ![](index-242_1.png)


    Now, even if Ettercap and Wireshark only see encrypted data, we can view the communication
    in clear text with SSLsplit.


