    For a CSRF attack to be successful it needs preconditions. Firstly, we need to
    know the requests and parameters required to carry out a specific operation and
    the response we will need to make in all cases.


    In this recipe, we used a proxy and a valid user account to perform the operation
    we wanted to replicate and gather the required information: requests involved
    in the purchase process, information required by these requests and the correct
    order in which to make them.


