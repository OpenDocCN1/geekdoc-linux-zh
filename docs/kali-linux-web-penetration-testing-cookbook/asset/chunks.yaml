    ### How it works...


    Like any other crawler, ZAP''s spider follows every link it finds in every page
    included in the scope requested and the links inside it. Also, this spider follows
    the form responses, redirects, and URLs included in `robots.txt` and `sitemap.xml`
    files. It then stores all the requests and responses for later analysis and use.


    ### There''s more...


    After crawling a website or directory, we may want to use the stored requests
    to perform some tests. Using ZAP''s capabilities, we will be able to do the following,
    among other things:


    - Repeat the requests that modify some data

    - Perform active and passive vulnerability scans

    - Fuzz the input variables looking for possible attack vectors

    - Replay specific requests in the web browser


