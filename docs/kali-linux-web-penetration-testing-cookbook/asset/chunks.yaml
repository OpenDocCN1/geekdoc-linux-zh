    ## Chapter 4


    ### How it works...


    Tamper Data will capture the request just before it leaves the browser and give
    us the time to alter any variable it contains. However, it has some limitations,
    such as not having the possibility to edit the URL or GET parameters.


    ### Using ZAP to view and alter requests


    Although Tamper Data can help with the testing process, sometimes we need a more
    flexible method to modify requests and more features, such as changing the method
    used to send them (that is, from GET to POST) or saving the request/response pair
    for further processing by other tools.


    OWASP ZAP is much more than a web proxy, it not only intercepts traffic, it also
    has lots of features similar to the crawler we used in the previous chapters,
    vulnerability scanner, fuzzer, brute forcer, and so on. It also has a scripting
    engine that can be used to automate activities or to create a new functionality.


    In this recipe, we will begin the use of OWASP ZAP as a web proxy, intercept a
    request, and send it to the server after changing some values.


    #### Getting ready

    Start ZAP and configure the browser to send information through it.


    #### How to do it...


    1. Browse to `http://192.168.56.102/mutillidae/`.


    2. Now, in the menu navigate to OWASP Top 10 | A1 – SQL Injection | SQLi – Extract
    Data | User Info.


    3. The next step is to raise the security level in the application, click once
    on Toggle Security. Now the Security Level should be 1 (Arrogant).


    [83]


    ![](index-102_1.png)


    #### Finding Vulnerabilities

    4. Introduce test'' (including the apostrophe) as Name and password'' as Password
    and click on View Account Details.


    ![](index-103_1.jpg)


    We get a warning message telling us that some characters in our inputs were invalid.
    In this case, the apostrophe ('')'') is surely detected and stopped by the application''s
    security measures.


    5. Click on OK to close the alert.


    If we check the history in ZAP, we can see that no request was sent with the data
    we introduced, this is due to a client-side validation mechanism. We will use
    the proxy interception to bypass this protection.


    6. Now, we will enable request interception (called break points in ZAP) by clicking
    the "break on all requests" button.


    ![](index-103_2.png)


