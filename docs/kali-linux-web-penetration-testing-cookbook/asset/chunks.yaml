    \n213\n\n![](index-232_3.png)\n\n[Technet24.ir](http://technet24.ir)\n\n*Man in\
    \ the Middle Attacks*\n\n### Using filters\n\nWe can use filters in Wireshark\
    \ to show only the packets that we are interested in, for example, to view only\
    \ those HTTP requests to the login page that we can use: `http.request.uri contains\
    \ \"login\"`.\n\nIf we look at the Ettercap's window we can also see the username\
    \ and password there, as shown:\n\n![](index-233_1.png)\n\nBy capturing traffic\
    \ between the client and the server, an attacker is able to extract and use all\
