    *漏洞利用 – 手手可得的果实* 第一步是发现数据库和表的名称，我们通过查询 `information_schema` 数据库来实现这一点，该数据库存储了
    MySQL 中所有关于数据库、表和列的信息。


    一旦我们知道了数据库和表的名称，我们就查询了该表中的列，以确定我们要找的是哪些，结果证明是 `user` 和 `password`。


    最后，我们注入了一个查询，请求 `dvwa` 数据库中 `users` 表中的所有用户名和密码。


    ## 使用 SQLMap 发现和利用 SQL 注入


    如前面的教程所示，利用 SQL 注入可能是一个密集的过程。`SQLMap` 是一个包含在 Kali Linux 中的命令行工具，它可以帮助我们通过多种技术在各种数据库中自动检测和利用
    SQL 注入。


    在本教程中，我们将使用 `SQLMap` 来检测并利用 SQL 注入漏洞，并以此获取应用程序的用户名和密码。


    #### 如何操作……


    1. 访问 http://192.168.56.102/mutillidae。


    2. 在 Mutillidae 的菜单中，导航到 OWASP Top 10 | A1 – SQL Injection | SQLi Extract Data
    | User Info。


    3. 尝试任意用户名和密码，例如 `user` 和 `password`，然后点击 View Account Details。


    4. 登录将失败，但我们感兴趣的是 URL；进入地址栏并将完整 URL 复制到剪贴板。


    5. 现在，在终端窗口中输入以下命令：


    ```

    sqlmap -u "http://192.168.56.102/mutillidae/index.php?page=user-info.php&username=user&password=password&user-info-php-submit-button=View+Account+Details"
    -p username --current-user --current-db

    ```


    你可以注意到 `-u` 参数的值是复制的 URL。通过 `-p` 我们告诉 `SQLMap` 我们想在 `username` 参数中寻找 SQL 注入，并且在漏洞被利用后让它检索当前数据库用户名和数据库名称。我们只想检索这两个值，因为我们只想知道该
    URL 的用户名参数中是否存在 SQL 注入。


    160


    ![](img/index-179_1.png)


    ## 第 6 章


    6. 一旦 `SQLMap` 检测到应用程序使用的 DBMS，它会询问我们是否想要跳过对其他 DBMS 的测试，以及是否想要包含对检测特定系统的所有测试（即使它们超出了当前级别的范围）。在这种情况下，我们对跳过其他系统回答
    Yes，对包含所有测试回答 No。


    7. 一旦发现指定的参数存在漏洞，`SQLMap` 将询问我们是否想测试其他参数，我们对此问题回答 No，然后查看结果：


    ![](img/index-180_2.png)


    161


    ![](img/index-180_3.png)


    [Technet24.ir](http://technet24.ir)


    *漏洞利用 – 手手可得的果实*


    8. 如果我们获取用户名和密码，类似于我们在上一个教程中所做的，我们需要知道包含此类信息的表名。在终端中执行以下命令：


    ```

    sqlmap -u "http://192.168.56.102/mutillidae/index.php?page=user-info.php&username=user&password=password&user-info-php-submit-button=View+Account+Details"
    -p username -D nowasp --tables

    ```


    ![](img/index-181_1.png)


    `SQLMap` 保存了它执行的注入日志，因此第二次攻击会比第一次快。如你所见，我们指定了要提取信息的数据库 (`nowasp`)，并告诉 `SQLMap`
    我们想要该数据库的表列表。


    9. `accounts` 表是包含我们要信息的表。让我们导出它的内容：


    ```

    sqlmap -u "http://192.168.56.102/mutillidae/index.php?page=user-info.php&username=user&password=password&user-info-php-submit-button=View+Account+Details"
    -p username -D nowasp -T accounts --dump

    ```


    162


    ![](img/index-181_2.png)


    ## 第 6 章


    ![](img/index-182_1.png)


    我们现在拥有了完整的用户表，可以发现在这种情况下密码没有加密，所以我们可以直接使用它们。


    #### 工作原理……


    `SQLMap` 对给定 URL 和数据中的所有输入进行模糊测试（fuzz），或者仅对 `-p` 选项指定的参数使用 SQL 注入字符串，并解释响应以发现是否存在漏洞。一种良好的做法是不对所有输入进行模糊测试，最好使用
    `SQLMap` 利用已知的注入，并尽可能通过提供我们拥有的可用信息（如漏洞参数、DBMS 类型等）来缩小搜索范围。在开启所有可能性寻找注入可能会花费大量时间，并在网络中产生非常可疑的流量。


