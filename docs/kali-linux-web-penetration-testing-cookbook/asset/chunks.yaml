    which is the one that stores all the information on databases, tables, and columns
    in MySQL.


    Once we knew the names of the database and table, we queried for the columns in
    such table to know which ones we were looking for, which turned out to be `user`
    and `password`.


    And last, we injected a query asking for all usernames and passwords in the table
    `users` of the database `dvwa`.


    ## Finding and exploiting SQL Injections with SQLMap


    As seen in the previous recipe, exploiting SQL Injections may be an industrious
    process. `SQLMap` is a command-line tool, included in Kali Linux, which can help
    us in the automation of detecting and exploiting SQL Injections with multiple
    techniques and in a wide variety of databases.


    In this recipe, we will use `SQLMap` to detect and exploit an SQL Injection vulnerability
    and will obtain usernames and passwords of an application with it.


    ### How to do it...


    1. Go to http://192.168.56.102/mutillidae.


    2. In Mutillidae''s menu, navigate to OWASP Top 10 | A1 – SQL Injection | SQLi
    Extract Data | User Info.


    3. Try any username and password, for example `user` and `password` and then click
    on View Account Details.


    4. The login will fail but we are interested in the URL; go to the address bar
    and copy the full URL to the clipboard.


    5. Now, in a terminal window, type the following command:


    ```

    sqlmap -u "http://192.168.56.102/mutillidae/index.php?page=user-info.php&username=user&password=password&user-info-php-submit-button=View+Account+Details"
    -p username --current-user --current-db

    ```


    You can notice that the `-u` parameter has the copied URL as a value. With `-p`
    we are telling `SQLMap` that we want to look for SQL Injections in the `username`
    parameter and the fact that we want it to retrieve the current database username
    and database''s name once the vulnerability is exploited. We want to retrieve
    only these two values because we want to only tell if there is an SQL Injection
    in that URL in the username parameter.


    160


    ![](index-179_1.png)


    ## Chapter 6


    ![](index-180_1.png)


    6. Once `SQLMap` detects the DBMS used by the application, it will ask if we want
    to skip the test for other DBMSes and if we want to include all the tests for
    the specific system detected, even if they are out of the scope of the current
    level. In this case, we answer Yes to skip other systems and No to include all
    tests.


    7. Once the parameter we specified is found to be vulnerable, `SQLMap` will ask
    us if we want to test other parameters, we will answer No to this question, and
    then see the result:


    ![](index-180_2.png)


    161


    ![](index-180_3.png)


    [Technet24.ir](http://technet24.ir)


    *Exploitation – Low Hanging Fruits*


    8. If we want to obtain the usernames and passwords, similar to how we did in
    the previous recipe, we need to know the name of the table that has such information.
    Execute the following command in the terminal:


    ```

    sqlmap -u "http://192.168.56.102/mutillidae/index.php?page=user-info.php&username=user&password=password&user-info-php-submit-button=View+Account+Details"
    -p username -D nowasp --tables

    ```


    ![](index-181_1.png)


    `SQLMap` saves a log of the injections it performs, so this second attack will
    take less time than the first one. As you can see, we are specifying the database
    from which we will extract this information (`nowasp`) and telling `SQLMap` that
    we want a list of tables in such database.


    9. The `accounts` table is the one that has the information we want. Let''s dump
    its contents:


    ```

    sqlmap -u "http://192.168.56.102/mutillidae/index.php?page=user-info.php&username=user&password=password&user-info-php-submit-button=View+Account+Details"
    -p username -D nowasp -T accounts --dump

    ```


    162


    ![](index-181_2.png)


    ## Chapter 6


    ![](index-182_1.png)


    We now have the full users'' table and we can see that in this case passwords
    aren''t encrypted, so we can use them right as we see them.


    ### How it works...


    `SQLMap` fuzzes all the inputs in the given URL and data, or only the specified
    one in the `-p` option with SQL Injection strings and interprets the response
    to discover if there is a vulnerability or not. It''s a good practice not to fuzz
    all inputs, it''s better to use `SQLMap` to exploit an injection that we already
    know exists and always try to narrow the search process by providing all the information
    available to us, such as vulnerable parameters, DBMS type, and others. Looking
    for an injection with all the possibilities open could take a lot of time and
    generate a very suspicious traffic in the network.

