    ![](img/index-174_2.png)


    [Technet24.ir](http://technet24.ir)


    *利用 – 易得的果实*


    还有更多...


    不仅仅是将会话 cookie 保存到文件中，恶意服务器还可以使用这些 cookie 向应用程序发送请求以冒充合法用户，从而执行诸如添加或删除评论、上传图片或创建新用户（甚至是管理员）的操作。


