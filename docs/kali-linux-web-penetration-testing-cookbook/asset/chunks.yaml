    工作原理...


    微软提供了这些虚拟机，让开发者可以在不同版本的 Windows 和 Internet Explorer 的帮助下测试其应用程序，这些免费许可限制为 30 天，对于我们进行练习已经足够了。


    作为渗透测试人员，重要的是意识到现实世界中的应用程序可能是跨平台的，而且这些应用程序的用户可能使用许多不同的系统和网络浏览器与之通信；知晓这一点，我们应该准备好对任何客户端-服务器架构的组合执行成功的测试。


