    ![](index-83_3.png)


    ### Chapter 3


    7. Next, we will be asked to fill in the username and password for the registration
    page. We will ignore this form by clicking on `Ignore form`.


    8. We can check the spider status in the `Spider` tab. We can also stop it by
    clicking on the `Spider is running` button. Let''s stop it now, as shown:


    ![](index-84_1.png)


    9. We can check the results that the spider is generating in the `Site map` tab,
