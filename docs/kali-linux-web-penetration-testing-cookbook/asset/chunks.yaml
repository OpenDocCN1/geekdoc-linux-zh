    5. 现在我们将配置一些规则以防止转发所有内容。首先，检查我们的 `iptables` nat 表中是否有内容：`iptables -t nat -L`


    ![](img/index-239_1.png)


    6. 如果里面有内容，你可能想备份它，因为我们要清空它，如下所示：


    `iptables -t nat -L > iptables.bkp`


