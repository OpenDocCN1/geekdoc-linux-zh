    ![](index-222_3.png)


    [Technet24.ir](http://technet24.ir)


    Advanced Exploitation


    We can increase the chance of finding passwords by using the `--rules` option
    because it looks at common modifications people make to words when trying to create
    harder passwords to crack. For example, for the word "password", `John` will also
    try the following, among others:


    f Password

    f PASSWORD

    f password123

    f Pa$$w0rd


