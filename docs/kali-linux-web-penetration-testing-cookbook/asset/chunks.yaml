    *Mitigation of OWASP Top 10*


    In this recipe, we have used the language''s built-in validation functions, but
    you can create your own if you need to validate some special type of input by
    using regular expressions.


    Apart from doing a correct validation, we also need to reduce the impact of the
    compromise in case somebody manages to inject some code. This is done by properly
    configuring a user''s privileges in the context of an operating system for a Web
    server and for both database and OS in the context of a database server.


    See also


    The most useful tool when it comes to data validation is Regular Expressions;
    they also make the life of a penetration tester much easier when it comes to processing
    and filtering large amounts of information, so it is very convenient to have a
    good knowledge of them, I would recommend a couple of sites to take a look at:


    f [http://www.regexr.com/](http://www.regexr.com/): A really good site where we
    can get examples and


    references and test our own expressions to see if a string matches or not.


    f [http://www.regular-expressions.info](http://www.regular-expressions.info):
    It contains tutorials and examples to


    learn how to use Regular Expressions; it also has a useful reference on the particular
    implementations of the most popular languages and tools.


    f [http://www.princeton.edu/~mlovett/reference/Regular-Expressions.](http://www.princeton.edu/~mlovett/reference/Regular-Expressions.pdf)


    [pdf](http://www.princeton.edu/~mlovett/reference/Regular-Expressions.pdf) (Regular
    Expressions, The Complete Tutorial) by Jan Goyvaerts: As its title states, it
    is a very complete tutorial on RegEx including examples in many languages.


    A2 – Building proper authentication and session management


    Flawed authentication and session management are the second most critical vulnerability
    in web applications nowadays.'
