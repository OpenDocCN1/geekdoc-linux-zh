    一旦我们知道存在注入以及正向响应长什么样，我们就继续询问当前用户名的长度，询问数据库：当前用户名的长度是 1 吗？是 2 吗？等等，直到发现长度。知道何时停止查找用户名中的字符是有用的。


    找到长度后，我们使用相同的技术来发现第一个字母，`LIKE ''b%''` 语句告诉 SQL 解释器第一个字母是否为 b；其余部分不重要，它可以是任何字符（%
