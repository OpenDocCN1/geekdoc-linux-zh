    我们可以看到规则生效了，找到了最后一个密码。


    ### 工作原理……


    `John`（以及其他离线密码破解器）的工作是对列表中的单词（或它生成的单词）进行哈希，并与要破解的哈希进行比较，当匹配成功时，它假设找到了密码。


    第一个命令使用 `--wordlist` 选项告诉 `John` 使用哪些单词。如果省略，它将生成自己的列表来进行暴力破解攻击。`--format` 选项告诉我们生成哈希的算法，如果格式被省略，`John`
