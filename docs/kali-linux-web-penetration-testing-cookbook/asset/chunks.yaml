    ## How it works...


    `msfvenom` helps us create payloads from the extensive list of Metasploit''s payloads
    and incorporate them into source code in many languages or create scripts and
    executable files, as we did in this recipe. The parameters we used here were the
    payload to use (`windows/meterpreter/reverse_tcp`), the host and port to connect
    back (`LHOST` and `LPORT`), and the output format (`-f exe`); redirecting the
    standard output to a file to have it saved as `cute_dolphin.exe`.


    The `exploit/multi/handler` module of Metasploit is a payload handler; in this
    case we used it to listen for the connection and after the connection was established,
    it ran the meterpreter payload.


    Meterpreter is the Metasploit''s version of a shell on steroids; it contains modules
    to sniff on a victim''s network, to use it as a pivot point to access the local
    network, to perform privilege escalation and password extraction, and many other
    useful things when performing penetration tests.


