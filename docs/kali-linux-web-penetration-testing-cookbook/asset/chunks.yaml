    检测漏洞并发现其对组织的影响这项任务正是渗透测试所解决的问题。渗透测试是由受过训练的安全专业人员进行的攻击或多次攻击，他们使用与真实黑客相同的技术和工具，以发现组织系统中所有可能的弱点。这些弱点会被利用，并衡量其影响。测试完成后，渗透测试人员会告知他们发现的所有结果，并告诉如何进行修复以防止未来的损害。


    在本书中，我们将遵循 Web 应用程序渗透测试的全路径，并以易于遵循的逐步分步谱（recipes）的形式，展示如何发现、利用和修复 Web 应用程序及 Web
    服务器中的漏洞。


    ## 本书涵盖内容


    ### 第 1 章，设置 Kali Linux，将引导读者完成配置和更新系统的过程；还涵盖了虚拟化软件的安装，包括构成我们渗透测试实验室的虚拟机的配置。


    ![](img/index-14_1.png)


    ### 前言


    ### 第 2 章，侦察，使读者能够实践一些信息收集技术，以获取有关被测试系统、其安装的软件以及目标 Web 应用程序如何构建的情报。


    ### 第 3 章，爬虫与蜘蛛，向读者展示如何使用这些工具，这些工具在每个 Web 应用程序分析中都是必不可少的，无论是功能性的还是更侧重于安全的（例如渗透测试）。


    ### 第 4 章，发现漏洞，解释了漏洞分析或渗透测试的核心是发现被测试应用程序中的弱点；谱侧重于如何通过在应用程序表单中引入特定的输入值并分析其输出，手动识别一些最常见的漏洞。


    ### 第 5 章，自动化扫描器，涵盖了漏洞发现的一个非常重要的方面：使用专门设计用于自动发现 Web 应用程序安全缺陷的工具：自动化漏洞扫描器。


    ### 第 6 章，利用——触手可得的果实，这是我们超越识别漏洞存在的第一章。本章中的每一个谱都侧重于利用特定类型的漏洞，并利用该利用提取敏感信息或获得对应用程序更高权限的访问。


    ### 第 7 章，进阶利用，遵循了上一章的路径；在这里，读者将有机会针对最复杂的情况和最复杂的设置练习更高级、更深层次的利用技术。


    ### 第 8 章，中间人攻击。虽然不是特定于 Web 应用程序，但 MITM 攻击在现代信息安全场景中起着非常重要的作用。在本章中，我们将看到这些是如何执行的，以及攻击者通过此类技术对受害者可以做什么。


    ### 第 9 章，客户端攻击与社会工程学，解释了人们常说用户是安全链中最薄弱的环节，但传统上，渗透测试评估排除了客户端攻击和社会工程学活动。本书的目标是给读者提供渗透测试的全局视图，并鼓励执行涵盖所有安全方面的评估；这就是为什么在这一章中，我们展示了黑客如何通过技术和社交手段针对用户的用户。


    ### 第 10 章，OWASP Top 10 的缓解，展示了组织聘请渗透测试人员攻击其服务器和应用程序的目的是了解哪里错了，以便知道他们应该修复以及如何修复。这一章通过提供关于如何修复和防止根据
    OWASP（开放 Web 应用程序安全项目）的最关键 Web 应用程序漏洞的简单直接指南，涵盖了渗透测试的这一面。


