    ![](index-82_3.png)


    [Technet24.ir](http://technet24.ir)


    *Crawlers and Spiders*


    4. Now, to activate the spider, we right-click on the `bodgeit` folder and select
    `Spider this branch` from the menu.


    ![](index-83_1.png)


    5. Burp will ask if we want to add the item to scope, we click on `Yes`. By default,
    Burp''s spider only crawls over the items matching the patterns defined in the
    `Scope` tab inside the `Target` tab.


    6. After this, the spider will start. When it detects a login form, it will ask
    us for the login credentials. We can ignore it and the spider will continue or
    we can submit some test values and the spider will fill in those values into the
    form. Let''s fill both the fields `user name` and `password` with the word `test`
    and then click on `Submit form`:


    ![](index-83_2.png)


