    The first line shows the method used: `POST`, the requested URL and the protocol:
    `HTTP 1.1`. The next lines, down to `Cookie:`, are the header parameters; after
    them we have `POST` parameters with the values we introduced.


    5. In the response section we have some tabs: `Raw`, `Headers`, `Hex`, `HTML`,
    and `Render`. These show the same response information in different formats. Let''s
