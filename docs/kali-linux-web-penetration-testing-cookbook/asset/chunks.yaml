    ## 侦察


    在网络渗透测试场景中，侦察是测试人员必须识别网络中所有资产、防火墙和入侵检测系统的阶段。他们还收集有关公司、网络和员工的最大信息。在我们的案例中，对于 Web
    应用渗透测试，这一阶段将完全关于了解应用程序、数据库、用户、服务器以及应用程序与我们之间的关系。


    侦察是每一个渗透测试中至关重要的阶段；我们对目标掌握的信息越多，在发现和利用漏洞时所拥有的选项就越多。


    ### 使用 Nmap 扫描并识别服务


    `Nmap` 可能是世界上最常用的端口扫描器。它可以用于识别活动主机、扫描 TCP 和 UDP 开放端口、检测防火墙、获取远程主机上运行的服务版本，甚至在使用脚本的情况下发现并利用漏洞。


    在本教程中，我们将使用 `Nmap` 来识别运行在目标应用程序服务器上的所有服务及其版本。为了学习目的，我们将多次调用 `Nmap` 来完成，但也可以使用单个命令完成。


    ### 准备工作


    我们只需要让我们的 `vulnerable_vm` 运行。


    ### 如何操作...


    1. 首先，我们想看看服务器是否对 ping 有响应，或者主机是否在线：


    ```

    nmap -sn 192.168.56.102

    ```


    ![](img/index-47_1.png)


    2. 现在我们知道它在线了，让我们看看哪些端口是开放的：


    ```

    nmap 192.168.56.102

    ```


