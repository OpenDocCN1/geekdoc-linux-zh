    ### 工作原理……


    在前五个步骤中，我们发现了一个对 shell 脚本的调用，由于它本应该由 shell 解释器运行，它可能是 `bash` 或受影响的 `bash` 版本。为了验证这一点，我们执行了以下测试：


    `() { :;}; echo "Vulnerable:"`


    第一部分 `() { :;};` 是一个空函数定义，因为 `bash` 可以将函数存储为环境变量，而这就是漏洞的核心，因为解析器会在函数结束后继续解释（并执行）后面的命令，这允许我们发布第二部分
    `echo "Vulnerable:"`，这是一个简单返回其输入输入内容的命令。


    漏洞发生在 Web 服务器中，是因为 CGI 实现将请求的所有部分映射到环境变量，因此如果通过 `User-Agent` 或 `Accept-Language`
