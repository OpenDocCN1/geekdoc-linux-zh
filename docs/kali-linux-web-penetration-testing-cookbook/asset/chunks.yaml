    In this recipe, we already knew that the username parameter was vulnerable to
    SQL Injection (since we used the SQL Injection test page from Mutillidae). In
    the first attack, we only wanted to be sure that there was an injection there
    and asked for some very basic information: user name (`--curent-user`) and database
    name (`--current-db`).


    In the second attack, we specified the database we wanted to query with the `-D`
    option and the name obtained from the previous attack, and we also asked for the
    list of tables it contains with `--tables`.


    After knowing what table we wanted to get (`-T accounts`), we told `SQLMap` to
    dump its contents with `--dump`.


    There''s more...


    SQLMap can also inject input variables in POST requests, to do that we only need
    to add the option `--data` followed by the POST data inside quotes, for example:
    `--data "username=test&password=test"`.


    Sometimes, we need to be authenticated in some application in order to have access
    to the vulnerable URL of an application; if this happens, we can pass a valid
    session''s cookie to `SQLMap` using the `--cookie` option:


    `--cookie "PHPSESSID=ckleiuvrv60fs01hlj72eeh37"`


    This is also useful to test for injections in cookie values.


    Another interesting feature of this tool is that it can bring us an SQL shell
    where we can issue SQL queries, as if we were connected directly to the database
    using the `--sql-shell` option; or, more interesting, we could gain command execution
    in the database server using `--os-shell` (this is especially useful when injecting
    Microsoft SQL Server).


    To know all the options and features that `SQLMap` has, you can run: `sqlmap --help`


    ### See also


    Kali Linux includes other tools that are capable of detecting and exploiting SQL
    Injection vulnerabilities that might be useful to use instead of or in conjunction
    with SQLMap:


    - `sqlninja`: A very popular tool dedicated to MS SQL Server exploitation.

    - `Bbqsql`: A blind SQL injection framework written in Python.

    - `jsql`: A Java based tool with a fully automated GUI, we just need to introduce
    the URL and click a button.

    - `Metasploit`: It includes various SQL Injection modules for different DBMSes.


    ### Attacking Tomcat''s passwords with Metasploit


    Apache Tomcat, or simply Tomcat, is one of the most widely used servers for Java
    web applications in the world. It is also very common to find a Tomcat server
    with some configurations left by default, among those configurations. It is surprisingly
    usual to find that a server has the web application manager exposed, this is the
    application that allows the administrator to start, stop, add, and delete applications
    in the server.


    ## Chapter 6


    In this recipe, we will use a Metasploit module to perform a dictionary attack
    over a Tomcat server in order to obtain access to its manager application.


    ### Getting ready


    Before we start using the Metasploit Framework, we will need to start the database
    service in a root terminal run:


    ```

    service postgresql start

    ```


    ### How to do it...


    1. Start the Metasploit''s console:

    ```bash

    msfconsole

    ```


    2. When it starts, we need to load the proper module and type the following in
    the `msf>` prompt:

    ```bash

    use auxiliary/scanner/http/tomcat_mgr_login

    ```


    3. We may want to see what parameter it uses:

    ```bash

    show options

    ```


    4. Now, we set our target hosts:

    ```bash

    set rhosts 192.168.56.102

    ```


    5. To make it work a little faster, but not too fast, we increase the number of
    threads:

    ```bash

    set threads 5

    ```


    6. Also, we don''t want our server to crash due to too many requests, so we lower
    the brute force speed:

    ```bash

    set bruteforce_speed 3

    ```


    7. The rest of the parameters work just as they are for our case, let''s run the
    attack:

    ```bash

    run

    ```


    After failing in some attempts, we will find a valid password; the one marked
    with a green `[+]` symbol.


    ### How it works...


    By default Tomcat uses the TCP port 8080 and has its manager application in `/manager/`.
    That application uses basic HTTP authentication. The Metasploit''s auxiliary module
    we just used (`tomcat_mgr_login`) has some configuration options worth mentioning
    here:


    - `BLANK_PASSWORDS`: Adds a test with blank password for every user tried.

    - `PASSWORD`: It''s useful if we want to test a single password with multiple
    users or to add a specific one not included in the list.

    - `PASS_FILE`: The password list we will use for the test.

    - `Proxies`: This is the option we need to configure if we need to go through
    a proxy to reach our target or to avoid detection.

    - `RHOSTS`: The host, hosts (separated by spaces), or file with hosts (`file:/path/to/file/with/hosts`)
    we want to test.

    - `RPORT`: This is the TCP port in the hosts being used by Tomcat.

    - `STOP_ON_SUCCESS`: Stop trying a host when a valid password is found in it.

    - `TARGETERURI`: Location of the manager application inside the host.

    - `USERNAME`: Define a specific username to test, it can be tested alone or added
    to the list defined in `USER_FILE`.

    - `USER_PASS_FILE`: A file containing "username password" combinations to be tested.

    - `USER_AS_PASS`: Try every username in the list as its password.


    ### See also


    This attack can also be performed with `THC-Hydra`, using `http-head` as service
    and the `-L` option to load the user list and `-P` to load the passwords.


    ### Using Tomcat Manager to execute code


    In the previous recipe we obtained the Tomcat''s Manager credentials and mentioned
    that it could lead us to execute code in the server. In this recipe, we will use
    such credentials to log into the Manager and upload a new application that will
    allow us to execute operating system commands in the server.


    ### How to do it...


    1. Go to `http://192.168.56.102:8080/manager/html`.


    2. When asked for username and password, use the ones obtained in the previous
    recipe: `root` and `owaspbwa`.


    3. Once inside the Manager, look for the section WAR file to deploy and click
    on the `Browse…` button.


    4. Kali includes a collection of webshells in `/usr/share/laudanum`, browse there
    and select the file `/usr/share/laudanum/jsp/cmd.war`.


    5. After it is loaded, click on `Deploy`.


    6. Verify that you have a new application called `cmd`.


    7. Let''s try it, go to `http://192.168.56.102:8080/cmd/cmd.jsp`.


    8. In the textbox, try a command, for example: `ifconfig`.


    9. We can see that we can execute commands, but to know which user and what privilege
    level we have, try the `whoami` command.


    We can see that Tomcat is running with root privileges in this server; this means
    that at this point, we have full control of it and can perform any operation,
    such as creating or removing users, installing software, configure operating system
    options, and much more.


    ### How it works...


    Once we have obtained the credentials for Tomcat''s Manager, the attack flow''s
    pretty straightforward; we just need an application useful enough for us to upload
    it. Laudanum, included by default in Kali Linux, is a collection of webshells
    for various languages and types of web servers including PHP, ASP, ASP.NET, and
    JSP. What can be more useful to a penetration tester than a webshell?

