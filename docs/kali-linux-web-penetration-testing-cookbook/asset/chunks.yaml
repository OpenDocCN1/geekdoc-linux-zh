    ### 使用 oclHashcat/cudaHashcat 通过暴力破解破解哈希


    近年来，显卡的发展巨大，它们包含的芯片现在拥有数百或数千个处理器，并且它们都并行工作。当这应用于密码破解时，意味着如果单个处理器每秒可以计算一万个哈希，一个拥有数千核心的
    GPU 就可以计算一千万个哈希。这意味着破解时间缩短了千倍或更多。


