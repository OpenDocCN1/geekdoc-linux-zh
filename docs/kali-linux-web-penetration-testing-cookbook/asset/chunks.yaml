    第一个有趣的调用是 `/WackoPicko/cart/action.php?action=add&picid=8`，它是将图片添加到购物车的调用。当我们点击相应的按钮时，会调用
    `/WackoPicko/cart/confirm.php`，可能需要使用它来购买。另一个对攻击者有用的是指向购买操作的 POST 调用（`/WackoPicko/cart/action.php?action=purchase`），它告诉应用程序将图片添加到购物车并收集相应的
    `Tradebux`。


