    In this recipe, we will obtain the information from the application to see what
    the attacking site needs do to be able to send valid requests to the vulnerable
    server. Then, we will create a page to simulate the legitimate requests and trick
    the user into visiting the page while authenticated. The malicious page will then
    send requests to the vulnerable server and, if the application is open in the
    same browser, it will perform the actions as if the user had sent them.


    ## Getting ready


    To perform this CSRF attack, we will use the `WackoPicko` application in `vulnerable_vm`:
    `http://192.168.56.102/WackoPicko`. We need two users, one will be called `v_user`,
    the victim, and the other one will be called `attacker`.


    We will also need to have `BurpSuite` running and configured as a proxy in the
    web server.


    ## How to do it...


    1. Log in to `WackoPicko` as `attacker`.

    2. The first thing the attacker needs to know is how the application behaves,
    so if we wanted to make the user buy our picture, having `BurpSuite` as a proxy,
    we would browse to: `http://192.168.56.102/WackoPicko/pictures/recent.php`

    3. Pick the picture with the ID `8` `http://192.168.56.102/WackoPicko/pictures/view.php?picid=8`.

    4. Click on `Add to Cart`.

    5. It will cost us 10 `Tradebux`, but it will worth it so click on `Continue to
    Confirmation`.`.

    6. On the next page, click on `Purchase`.


    192

    ![](index-211_1.png)


    7. Now, let''s go to `BurpSuite` to analyze what happened:

    ![](index-212_1.png)


    The first interesting call is `/WackoPicko/cart/action.php?action=add&picid=8`
    and is the one that adds the picture to the cart. `/WackoPicko/cart/confirm.php`
    is called when we click the corresponding button and it may be necessary to use
    it to purchase. The other one that is useful for the attacker is the POST call
    to the purchase action (`/WackoPicko/cart/action.php?action=purchase`), which
    tells the application to add the pictures to the cart and to collect the corresponding
    `Tradebux`.


    8. Now, the attacker is going to upload a picture to force other users to buy
    it. Once logged in as `attacker`, go to `Upload`, fill in the requested information,
    select an image file to upload, and click on `Upload File`:

    ![](index-212_2.png)


