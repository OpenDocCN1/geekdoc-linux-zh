    ```\n\n3. 接下来，我们需要更新登录页面，使其重定向到收集密码的脚本。打开 `bodgeit` 目录（`/var/www/html/bodgeit`）下的\
    \ `login.jsp` 文件，并寻找以下代码：\n\n```html\nPlease enter your credentials: \n```\n\n\
    4. 现在，在 `form` 标签中添加调用 `post.php` 的 action：\n\n234\n\n![](img/index-253_1.png)\n\
    \n## 第 9 章\n\n5. 我们需要在与 `login.jsp` 相同的目录下创建该文件，使用以下代码创建 `post.php`：\n\n```php\n\
