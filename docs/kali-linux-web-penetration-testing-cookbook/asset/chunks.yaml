    ## 使用 DirBuster 寻找文件和文件夹


    DirBuster 是一个通过暴力破解法发现 Web 服务器中现有的文件和目录的工具。我们将在本教程中使用它来搜索特定的文件和目录列表。


    ### 准备工作


    我们将使用包含单词列表的文本文件，让 DirBuster 查找这些单词。创建一个 `dictionary.txt` 文本文件，包含以下内容：


    ```

    info

    server-status

    server-info

    cgi-bin

    robots.txt

    phpmyadmin

    admin

    login

    ```


