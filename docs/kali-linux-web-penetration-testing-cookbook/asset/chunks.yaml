    ### 侦察


    ### 工作原理...


    `Nmap` 是一个端口扫描器，这意味着它向指定 IP 地址上的若干 TCP 或 UDP 端口发送包并检查是否有响应。如果有，则意味着端口是开放的；因此，该端口上运行着服务。


    在第一条命令中，通过 `-sn` 参数，我们指示 `Nmap` 仅检查服务器是否响应 ICMP 请求（或 ping）。我们的服务器响应了，所以它是存活的。


    第二个命令是调用 `Nmap` 最简单的方法；它只指定了目标 IP 地址。它的作用是 ping 服务器；如果它响应，`Nmap` 会向 1000 个 TCP
    端口列表发送探测，查看哪些端口有响应，然后报告有响应端口的结果。


    第三条命令在第二个命令的基础上增加了以下两个任务：


    - `-sV` 请求每个找到开放端口的标志（banner）——头部或自标识，这被用作版本号

    - `-O` 告诉 `Nmap` 利用从开放端口和版本中收集的信息尝试猜测目标上运行的操作系统


    ### 更多功能...


    使用 `Nmap` 时的其他有用参数是：


    - `-sT`：默认情况下，当以 root 用户运行时，`Nmap` 使用一种被称为 SYN 扫描的类型。使用此参数我们强制扫描器执行全连接扫描。它的速度较慢，会在服务器日志中留下记录，但被入侵检测系统检测到的概率较低。

    - `-Pn`：如果我们已经知道主机是存活的或不响应 ping，我们可以使用此参数告诉 `Nmap` 跳过 ping 测试并扫描所有指定目标，假设它们在线。

    - `-v`：这是详细模式。`Nmap` 将显示更多关于它正在做什么以及获取的响应的信息。此参数可以在同一命令中多次使用：使用得越多，详细程度就越高（即 `-vv`
    或 `-v -v -v -v`）。

    - `-p N1,N2,…NN`：如果我们想测试特定端口或某些非标准端口，可以使用此参数告诉 `Nmap`，其中 `N1` 到 `Nn` 是我们要扫描的端口号。例如，扫描端口
    21、80-90 和 137，参数为 `-p 21,80-90,137`。

    - `--script=script_name`：`Nmap` 包含了许多用于漏洞检查、扫描识别、登录测试、命令执行、用户枚举等脚本。使用此参数告诉 `Nmap`
    在目标上运行脚本。你可能想查看某些 `Nmap` 脚本的使用：https://nmap.org/nsedoc/scripts/


