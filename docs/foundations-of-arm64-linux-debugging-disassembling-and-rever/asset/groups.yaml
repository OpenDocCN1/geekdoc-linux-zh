  mdcn: "\n\n## 第 1 章 内存、寄存器与简单算术\n\n请注意，在引用寄存器内容时，我们不使用括号。\n后一条指令意味着将位置（地址）“a”处的数字赋值（复制）到寄存器。\n\
    在汇编语言中，我们写道：\n\n```\nmov w1, #1      // 1 被复制到 X1 的前半部分\n                    register\n\
    mov x1, #1      // X1 寄存器的完整内容\n                    替换为 1\nadr x0, a        //\
    \ 将位置（地址）“a”复制到\n                    X0 寄存器\nldr w1, [x0]   // 将存储在 X0 中的位置数字\n\
    \                    复制到 X1 寄存器的前半部分\nldr x1, [x0]   // 将存储在 X0 中的位置数字\n     \
    \               复制到 X1\n```\n\n在 GDB 反汇编输出中，我们可能会看到输出，其中一个 `adr` 指令被带有地址值部分的 `adrp/add`\
    \ 指令替换：\n\n```\nadrp x0, 0x4b2000  // 0x4b2000 + 0xb000 = 0x4b2b00\n         \
    \           (\"a\" 地址)\nadd x0, x0, #0xb000\nldr w1, [x0]\n```\n\n## “算术”项目：向内存单元累加数字\n\
    \n现在让我们详细地查看以下伪代码语句：\n[b] <- [b] + [a]\n\n回想一下，“a”和“b”分别表示位置地址 000000000042b200\
    \ 和 000000000042b204 的名称（参见图 1-4A 和 1-4B）。[a] 和 [b] 分别表示“a”和“b”处的内容，简单来说存储在那里的某些数字。\n\
    \n在 C 或 C++ 语言中，我们编写以下语句：\n\n```\nb = b + a;\nb += a;\n```\n\n在汇编语言中，我们使用 `ADD`\
    \ 指令。由于 ARM 架构的限制，我们无法在一个步骤（指令）中使用内存地址，例如 `add b, b, a`。我们只能使用 `add` 寄存器指令将寄存器0中的值加到寄存器1，将寄存器1中的值加并将结果移动到寄存器1。因此，首先我们需要加载（`ldr`）“a”和“b”处的内容到寄存器，并在加后存储（`str`）结果存回内存位置“b”。回想一下，寄存器在这里就像一个临时内存单元：\n\
    \n```\nRegister2 <- [b]\nRegister1 <- [a]\nRegister2 <- register2 + register1\n\
    [b] <- register2\n```\n\n在汇编语言中，我们写道：\n\n```\nadr x0, b\nldr w1, [x0]\nadr x0,\
    \ a\nldr w0, [x0]\nadd w1, w1, w0\nadr x0, b\nstr w1, [x0]\n```\n\n在 GDB 反汇编输出中，我们可能会看到以下代码：\n\
    \n```\nadrp x0, 0x4b2000\nadd x0, x0, #0xb00\nldr w1, [x0]\nadrp x0, 0x4b2000\n\
    add x0, x0, #0xb00\nldr w0, [x0]\nadd w1, w1, w0\nadrp x0, 0x4b2000\nadd x0, x0,\
    \ #0xb04\nstr w1, [x0]\n```\n\n现在我们可以将伪代码翻译为汇编语言：\n\n```\n[a] <- 1 // x0 = a adr\
    \ x0, a\n // w1 = 1 mov w1, #1\n // [a] = 1 str w1, [x0]\n[b] <- 1 // x0 = b adr\
    \ x0, b\n // w1 = 1 mov w1, #1\n // [b] = 1 str w1, [x0]\n[b] <- [b] + [a] //\
    \ x0 = b adr x0, b\n // w1 = 1 ldr w1, [x0]\n // x0 = a adr x0, a\n // w0 = 1\
    \ ldr w0, [x0]\n // w1 = 2 add w1, w1, w0\n // x0 = b adr x0, b\n // [b] = 2 str\
    \ w1, [x0]\n```\n\n在执行 ADR、LDR、ADD 和 STR 指令后，我们得到了图 1-5 所示的内存布局。\n\n位置：a\n（地址\
    \ 0000000004b2b00）\n\n| 0 |\n|---|---|\n| 1 |\n| 2 |\n| 0 |\n| 0 |\n| 0 |\n\n\
    寄存器 X0\n4b2b04\nW0\n\n位置：b\n（地址 0000000004b2b004）\n\n地址（位置）：\n0000000004b2b008\n\
    \n寄存器 X1\n1\nW1\n\n图 1-5. 执行 ADR、LDR、ADD 和 STR 指令后的内存布局\n\n## 在内存和寄存器中递增/递减数字\n\
    \n在伪代码中，它看起来很简单，意味着递增（递减）存储在位置（地址）“a”的数字：\n\n+ [a] <- [a] + 1\n[a] < [a] - 1\n\
    \n在 C 或 C++ 语言中，我们可以三种可能的方式编写它：\n\n```\na = a + 1;\n++a;\na++;\nb = b - 1;\n--b;\n\
    b--;\n```\n\n在汇编语言中，我们使用指令 ADD 和 SUB，并写道：\n\n```\nadd x0, x0, #1\nsub x0, x0,\
    \ #1\nadr x0, a\nldr w1, [x0]\nadd w1, w1, #1\nstr w1, [x0]\nadr x0, b\nldr w1,\
    \ [x0]\nsub w1, w1, #1\nstr w1, [x0]\n```\n\n在 GDB 反汇编输出中，我们可能会看到类似的指令：\n\n```\n\
    adrp x0, 0x4b2000\nadd x0, x0, #0xb000\nldr w0, [x0]\nadd w1, w0, #0x1\nadrp x0,\
    \ 0x4b2000\nadd x0, x0, #0xb000\nstr w1, [x0]\n```\n\n现在我们加上递增的汇编语言翻译：\n\n```\n\
    [a] <- 1      // x0 = a      adr x0, a\n                   // w1 = 1      mov\
    \ w1, #1\n                   // [a] = 1     str w1, [x0]\n[b] <- 1      // x0\
    \ = b      adr x0, b\n                   // w1 = 1      mov w1, #1\n         \
    \          // [b] = 1     str w1, [x0]\n[b] <- [b] + [a] // x0 = b      adr x0,\
    \ b\n                   // w1 = 1      ldr w1, [x0]\n                   // w0\
    \ = 1      ldr w0, [x0]\n                   // x0 = a      adr x0, a\n       \
    \            // w0 = 2      ldr w0, [x0]\n                   // w1 = 2      add\
    \ w1, w1, w0\n                   // x0 = b      adr x0, b\n                  \
    \ // [b] = 2     str w1, [x0]\n[a] <- 1      // x0 = a      adr x0, a\n      \
    \             // w1 = 1      mov w1, #1\n                   // [a] = 1     str\
    \ w1, [x0]\n[b] <- 1      // x0 = b      adr x0, b\n                   // w1 =\
    \ 1      mov w1, #1\n                   // [b] = 1     str w1, [x0]\n[b] <- [b]\
    \ + [a] // x0 = b      adr x0, b\n                   // w1 = 1      ldr w1, [x0]\n\
    \                   // w0 = 1      ldr w0, [x0]\n                   // x0 = a\
    \      adr x0, a\n                   // w0 = 2      ldr w0, [x0]\n           \
    \        // w1 = 2      add w1, w1, w0\n                   // x0 = b      adr\
    \ x0, b\n                   // [b] = 2     str w1, [x0]\n```\n\n在执行 ADD 指令后，我们得到了图\
    \ 1-6 所示的内存布局。\n\n| 寄存器 X0 | 寄存器 X1 |\n|---|---|\n| 0 | 0 |\n| 1 | 1 |\n| 2 |\
    \ 2 |\n| 0 | |\n| 0 | |\n| 0 | |\n\n位置：a\n（地址 0000000004b2b00）\n\n位置：b\n（地址 0000000004b2b004）\n\
    \n地址（位置）：\n0000000004b2b008\n\n图 1-6. ADD 指令后的内存布局\n\n## 数字乘法\n\n在伪代码中，它看起来很简单，意味着乘以存储在位置（地址）“b”的数字：\n\
    \n+ [b] <- [b] * [a]\n\n在 C 或 C++ 语言中，我们可以这样写：\n\n```\nb = b * a;\n```\n\n在汇编语言中，我们使用\
    \ MUL 指令并写道：\n\n```\nadr x0, b\nldr w1, [x0]\nadr x0, a\nldr w0, [x0]\nmul w1,\
    \ w1, w0\nadr x0, b\nstr w1, [x0]\n```\n\n在 GDB 反汇编输出中，我们可能会看到以下代码：\n\n```\nadrp\
    \ x0, 0x4b2000\nadd x0, x0, #0xb00\nldr w1, [x0]\nadrp x0, 0x4b2000\nadd x0, x0,\
    \ #0xb04\nldr w0, [x0]\nmul w1, w1, w0\nadrp x0, 0x4b2000\nadd x0, x0, #0xb04\n\
    str w1, [x0]\n```\n\n现在我们可以将伪代码翻译为汇编语言：\n\n```\n[a] <- 1 // x0 = a adr x0, a\n\
    \ // w1 = 1 mov w1, #1\n // [a] = 1 str w1, [x0]\n[b] <- 1 // x0 = b adr x0, b\n\
    \ // w1 = 1 mov w1, #1\n // [b] = 1 str w1, [x0]\n[b] <- [b] * [a] // x0 = b adr\
    \ x0, b\n // w1 = 1 ldr w1, [x0]\n // x0 = a adr x0, a\n // w0 = 1 ldr w0, [x0]\n\
    \ // w1 = 2 mul w1, w1, w0\n // x0 = b adr x0, b\n // [b] = 2 str w1, [x0]\n```\n\
    \n在执行 ADR、LDR、MUL 和 STR 指令后，我们得到了图 1-7 所示的内存布局。\n\n![](img/75ad7b091e3ad3da1f54f0b706f6bf2e_30_0.png)\n\
    \n图 1-7. 执行 ADR、LDR、MUL 和 STR 指令后的内存布局\n\n"
