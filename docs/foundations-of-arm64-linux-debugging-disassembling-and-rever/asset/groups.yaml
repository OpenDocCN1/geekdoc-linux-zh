    # # Summary


    This chapter introduced CPU registers and explained the memory layout of a simple
    arithmetic program. We learned basic ARM64 commands, including loading values
    from and storing values in memory. We also manually translated C and C++ code
    to assembly language.


    The next chapter looks at assembly language code produced by a debugger via disassembling
    binary code. Then, we reverse it to C and C++ code. We also compare the disassembly
    output of nonoptimized code to optimized code.'
