    layout, and integral C and C++ types.'
- md: "\n# CHAPTER 5\n\n# Bytes, Halfwords, Words, and Doublewords\n\n## Using Hexadecimal\
    \ Numbers\n\nIf we want to use hexadecimal numbers in the C/C++ language, we prefix\
    \ them with 0x, for example:\n\n```cpp\na = 12;          // 12_dec\na = 0xC; \
    \        // C_hex\n```\n\nIn the GDB disassembly output, and when entering commands,\
    \ numbers are interpreted as decimals by default. If we want a number to be interpreted\
    \ as hexadecimal, we prefix it with 0x, for example:\n\n```assembly\nmov X0, #12\n\
    mov X0, #0xC\n```\n\n## Byte Granularity\n\nFigure 5-1 shows the difference between\
    \ bytes, halfwords, words, and doublewords in terms of byte granularity. We see\
    \ that each successive size is double the previous.\n\n| | | | | | | | | | |\n\
    |---|---|---|---|---|---|---|---|---|\n| Byte | | | | | | | | | |\n| Halfword\
    \ | Byte | Byte | | | | | | |\n| Word | Byte | Byte | Byte | Byte | | | | |\n\
    | Doubleword | Byte | Byte | Byte | Byte | Byte | Byte | Byte | Byte | |\n\n**Figure\
    \ 5-1.** Difference between bytes, halfwords, words, and doublewords\n\n## Bit\
    \ Granularity\n\nEvery byte consists of eight bits. Every bit has a value of zero\
    \ or one. There are some examples of bytes, halfwords, words, and doublewords\
    \ shown as bit strings (we can also clearly see the correspondence between 4-bit\
    \ sequences and hexadecimal numbers, Table 3-1):\n\n- Byte\n  - C/C++: unsigned\
    \ char\n  - 8 bits\n  - Values $0_{dec}-255_{dec}$ or $0_{hex}-FF_{hex}$\n  -\
    \ Example: $12_{dec}$ $00001100_{bin}$ $0C_{hex}$\n- Halfword\n  - C/C++: unsigned\
    \ short\n  - 16 bits\n  - Values $0_{dec}-65535_{dec}$ or $0_{hex}-FFFF_{hex}$\n\
    \  - Example: $0000000000001100_{bin}$ $000C_{hex}$\n- Word\n  - C/C++: unsigned\
    \ int\n  - 32 bits\n  - Values $0_{dec}-4294967295_{dec}$ or $0_{hex}-FFFFFFFF_{hex}$\n\
    \  - Example: $00000000000000000000000000001100_{bin}$ $0000000C_{hex}$\n- Doubleword\n\
    \  - C/C++: long, unsigned long long\n  - 64 bits\n  - Values $0_{dec}-18446744073709551615_{dec}$\
    \ or $0_{hex}-FFFFFFFFFFFFFFFF_{hex}$\n  - Example: $0000000000000000000000000000000000000000000000000000000001100_{bin}$\
    \ $00000000C_{hex}$\n\n## Memory Layout\n\nThe minimum addressable element of\
    \ memory is a byte. The maximum addressable element is a word on 32-bit machines\
    \ and a doubleword on 64-bit machines. All general registers are 32-bit on 32-bit\
    \ CPUs and can contain word values. On 64-bit CPUs, all general registers are\
    \ 64-bit and can contain doubleword values. Figure 5-2 shows a typical memory\
    \ layout, and Figure 5-3 shows the byte layout of some general CPU registers.\n\
    \n| Address | Byte | |\n|---|---|---|\n| Address 0000000000402000 | Byte | |\n\
    | Address 0000000000402001 | Byte | |\n| | Byte | |\n| | Byte | |\n| Address 0000000000402004\
    \ | Byte | DOUBLEWORD |\n| | Byte | |\n| | Byte | |\n| | Byte | |\n| Address 0000000000402008\
    \ | Byte | |\n\n**Figure 5-2.** Typical memory layout\n\n| | Byte | Byte | Byte\
    \ | Byte | Byte | Byte | Byte | Byte | Byte |\n|---|---|---|---|---|---|---|---|---|---|\n\
    | X0 | Byte | Byte | Byte | Byte | Byte | Byte | Byte | Byte | Byte |\n| X1 |\
    \ Byte | Byte | Byte | Byte | Byte | Byte | Byte | Byte | Byte |\n| X2 | Byte\
    \ | Byte | Byte | Byte | Byte | Byte | Byte | Byte | Byte |\n| X3 | Byte | Byte\
    \ | Byte | Byte | Byte | Byte | Byte | Byte | Byte |\n\n**Figure 5-3.** Typical\
    \ registry layout\n\nRemember that memory addresses are always 64-bit, and memory\
    \ addresses to 32-bit memory cells like integers are also 64-bit.\n\n## Summary\n\
    \nThis chapter discussed the bit- and byte-level memory granularity, corresponding\
    \ layout, and integral C and C++ types.\n\nThe next chapter looks at pointers\
    \ in greater detail, considering different byte memory granularity. We also discuss\
    \ issues related to abnormal defects, such as uninitialized, invalid, and NULL\
    \ pointers. Finally, we disassemble and trace a program that uses variables as\
    \ pointers.\n\n# CHAPTER 6\n\n# Pointers to Memory\n\n## Pointers Revisited\n\n\
    The pointer is a memory cell or a register that contains the address of another\
    \ memory cell. Memory pointers have their own addresses because they are memory\
    \ cells too. On 32-bit Linux, pointers are 32-bit, and on 64-bit Linux, pointers\
    \ are 64-bit.\n\n## Addressing Types\n\nAs we have seen in Chapter 5, memory cells\
    \ can be one of byte, halfword, word, or doubleword size. Therefore, we can have\
    \ a pointer to a byte, a pointer to a halfword, a pointer to a word, and a pointer\
    \ to a doubleword. If we want to load or store a byte, we use LDRB/STR and W-registers\
    \ for data, a halfword – LDRH/STRH and W-registers for data, a word – LDR/STR\
    \ and W-registers for data, a doubleword – LDR/STR and X-registers for data. We\
    \ always use X-registers for memory addresses. Here are some illustrated examples:\n\
    \n```assembly\nmov w1, #0FF\nldrb w1, [x0]      // load one byte\nstrb w1, [x0]\
    \      // stores one byte\nstr w1, [x0]       // stores one word\nldr x1, [x0]\
    \      // loads one doubleword\n```\n\nWe prefix 0FF with the # sign to differentiate\
