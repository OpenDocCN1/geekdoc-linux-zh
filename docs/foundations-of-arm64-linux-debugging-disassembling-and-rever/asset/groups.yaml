- md: "\n# Preface\n\nThe book covers topics ranging from ARM64 assembly language\
    \ instructions and writing programs in assembly language to pointers, live debugging,\
    \ and static binary analysis of compiled C and C++ code.\n\nDiagnostics of core\
    \ memory dumps, live and postmortem debugging of Linux applications, systems,\
    \ malware, and vulnerability analysis require an understanding of ARM64 assembly\
    \ language and how C and C++ compilers generate code, including memory layout\
    \ and pointers. This book is about background knowledge and practical foundations\
    \ that are needed to understand internal Linux program structure and behavior,\
    \ start working with the GDB debugger, and use it for disassembly and reversing.\
    \ It consists of practical step-by-step exercises of increasing complexity with\
    \ explanations and many diagrams, including some necessary background topics.\n\
    \nBy the end of the book, you will have a solid understanding of how Linux C and\
    \ C++ compilers generate binary code. In addition, you will be able to analyze\
    \ such code confidently, understand stack memory usage, and reconstruct original\
    \ C/C++ code.\n\nThe book will be useful for\n\n- - Software support and escalation\
    \ engineers, cloud security engineers, SRE, and DevSecOps\n- Software engineers\
    \ coming from JVM background\n- Software testers\n- Engineers coming from non-Linux\
    \ environments, for example, Windows or Mac OS X\n- - Engineers coming from non-ARM\
    \ environments, for example, x86/x64\n- - Linux C/C++ software engineers without\
    \ assembly language background\n- Security researchers without assembly language\
    \ background\n- Beginners learning Linux software reverse engineering techniques\n\
    \nThis book can also be used as an ARM64 assembly language and Linux debugging\
    \ supplement for relevant undergraduate-level courses.\n\n## Source Code\n\nAll\
    \ source code used in this book can be downloaded from github.com/apress/arm64-linux-debugging-disassembling-reversing.\n\
    \n# CHAPTER 1\n\n## Memory, Registers, and Simple Arithmetic\n\n### Memory and\
    \ Registers Inside an Idealized Computer\n\nComputer memory consists of a sequence\
    \ of memory cells, and each cell has a unique address (location). Every cell contains\
    \ a “number.” We refer to these “numbers” as contents at addresses (locations).\
    \ Because memory access is slower than arithmetic instructions, there are so-called\
    \ registers to speed up complex operations that require memory to store temporary\
    \ results. We can also think about them as stand-alone memory cells. The name\
    \ of a register is its address. Figure 1-1 illustrates this.\n\n| Address (Location):\
    \ 100 | 0 |\n| :--- | :--- |\n| Address (Location): 101 | 0 |\n| Address (Location):\
    \ 102 | 1 |\n| Address (Location): 103 | 1 |\n| Address (Location): 104 | 2 |\n\
    | Address (Location): 105 | 0 |\n\n| Register 1 |\n| --- |\n| 0 |\n| Register\
    \ 2 |\n| --- |\n| 10 |\n\nFigure 1-1. Computer memory represented as a sequence\
    \ of memory cells and locations\n\n### Memory and Registers Inside ARM 64-Bit\
    \ Computer\n\nHere, addresses for memory locations containing integer values usually\
    \ differ by four or eight, and we also show two registers called X0 and X1. The\
    \ first halves of them are called W0 and W1 as shown in Figure 1-2.\n\n| Address\
    \ (Location) | Register X0 | Register X1 |\n| --- | --- | --- |\n| Address (Location):\
    \ 100 | 0 | |\n| Address (Location): 104 | 0 | W0 |\n| Address (Location): 108\
    \ | 1 | |\n| Address (Location): 112 | 1 | 10 |\n| Address (Location): 116 | 2\
    \ | W1 |\n| Address (Location): 120 | 0 | |\n\n**Figure I-2. Typical ARM 64-bit\
    \ memory and register layout**\n\nBecause memory cells contain “numbers,” we start\
    \ with simple arithmetic and ask a processor to compute the sum of two numbers\
    \ to see how memory and registers change their values.\n\n## “Arithmetic” Project:\
    \ Memory Layout and Registers\n\nFor our project, we have two memory addresses\
    \ (locations) that we call “a” and “b.” We can think about “a” and “b” as names\
    \ of their respective addresses (locations). Now we introduce a special notation\
    \ where (a) means contents at the memory address (location) \"a.\" If we use the\
    \ C or C++ language to write our project, we declare and define memory locations\
    \ \"a\" and \"b\" as\n\n```\nstatic int a, b;\n```\n\nBy default, when we load\
    \ a program, static memory locations are filled with zeroes, and we can depict\
    \ our initial memory layout after loading the program, as shown in Figure 1-3.\n\
    \n| | Register X0 |\n| --- | --- |\n| Location: a (Address 000000004b2b000) |\
    \ 0 | 0 |\n| Location: b (Address 000000004b2b004) | 0 | W0 |\n| Address (Location):\
    \ 000000004b2b008 | 0 | Register X1: 0, W1 |\n\n**Figure 1-3.** Initial memory\
    \ layout after loading the program\n\n### “Arithmetic” Project: A Computer Program\n\
    \nWe can think of a computer program as a sequence of instructions for the manipulation\
    \ of contents of memory cells and registers. For example, addition operation:\
    \ adds the contents of memory cell N#12 to the contents of memory cell N#14. In\
    \ our pseudo-code, we can write\n\n```\n[14] <- [14] + [12]\n```\n\nOur first\
    \ program in pseudo-code is shown on the left of the table:\n\n```\n[a] <- -\n\
    [b] <- 1\n[b] <- [b] + [a]\n[a] <- [a] + 1\n[b] <- [a] * [a]\n```\n\n“-\" moving\
    \ (assigning) the new value to the contents of a memory location (address). \"\
    // is a comment sign, and the rest of the line is a comment. \"=\" shows the current\
    \ value at a memory location (address).\nTo remind, a code written in a high-level\
    \ programming language is translated to a machine language by a compiler. However,\
    \ if its digital codes are represented in some mnemonic system called assembly\
    \ language. For example, ADD X1, X1, #1 is increment by one of what is stored\
    \ in the register memory cell X1.\n\n### “Arithmetic” Project: Assigning Numbers\
    \ to Memory Locations\n\nWe remind that “a” means the location (address) of the\
    \ memory cell, and it is also the name of the location (address) 0000000004b2b00\
    \ (see Figure 1-3). [a] means the contents (number) stored at the address “a.”\n\
    \nIf we use the C or C++ language, \"a\" is called \"the variable a,\" and we\
    \ write the assignment as\n\na = 1;\n\nIn ARM64 assembly language, we write several\
    \ instructions for that:\n\n```\nadr x0, a\nmov w1, #1\nstr w1, [x0]\n```\n\n\
    In the GDB disassembly output, we may see the following code:\n\n```\nadrp x0,\
    \ 0x4b2000\nadd x0, x0, #0xb00\nmov w1, #0x1\nstr w1, [x0]\n```\n\nWe show the\
    \ translation of our pseudo-code into assembly language in the right column:\n\
    \n+   [a] <- 1\n    // x0 = a      adr x0, a\n    // w1 = 1      mov w1, #1\n\
    \    // [a] = 1     str w1, [x0]\n+   [b] <- 1\n    // x0 = b      adr x0, b\n\
    \    // w1 = 1      mov w1, #1\n    // [b] = 1     str w1, [x0]\n+   [b] <- [b]\
    \ + [a]\n    // x0 = b      add x0, x0, #0xb00\n    // [a] = 1     str w1, [x0]\n\
    +   [a] <- [a] + 1\n    // x0 = a      adrp x0, 0x4b2000\n    add x0, x0, #0xb00\n\
    \    // w1 = 1      str w1, [x0]\n+   [b] <- [a] * [a]\n\nLiteral constants have\
    \ the # prefix, for example, #1. The 0x prefix means the following number is hexadecimal.\
    \ We explain such numbers in Chapter 3. Please also notice that the movement direction\
    \ is the same in both the disassembly output and the pseudo-code: from right to\
    \ left (except for the str instruction).\n\nAfter the first three assembly language\
    \ instructions, we have the memory layout shown in Figure 1-4A.\n\n![](img/75ad7b091e3ad3da154f0b706f6bf2e_19_0.png)\n\
    \n**Figure I-4A.** Memory layout after executing the first three assembly language\
    \ instructions\n\nAfter the next three assembly language instructions, we have\
    \ the memory layout shown in Figure 1-4B.\n\n| Register X0 |\n| --- |\n| 0 |\n\
    | 1 |\n| 4b2b04 |\n| W0 |\nLocation: a (Address 00000000004b200)\nLocation: b\
    \ (Address 00000000004b2b04)\n\n| Register X1 |\n| --- |\n| 0 |\n| 0 |\n| 1 |\n\
    | W1 |\nAddress (Location): 00000000004b2b08\n\n**Figure 1-4B.** Memory layout\
    \ after executing the next three assembly language instructions\n\n## Assigning\
    \ Numbers to Registers\n\nIn the previous section, we saw that assigning numbers\
    \ was a part of memory assignments. We can write it in pseudo-code:\n\n```\nregister\
    \ <- 1\nregister <- [a]\n```\n"
  mdcn: '


    # 前言


    本书涵盖了从 ARM64 汇编语言指令、使用汇编语言编写程序，到指针、实时调试以及编译后的 C 和 C++ 代码的静态二进制分析等多个主题。


    核心内存转储（core memory dumps）诊断、Linux 程序的实时和事后调试、系统、恶意软件以及漏洞分析，都需要理解 ARM64 汇编语言以及
    C 和 C++ 编译器如何生成代码（包括内存布局和指针）。本书介绍了理解内部 Linux 程序内部结构和行为、开始使用 GDB 调试器以及将其用于反汇编和逆向工程所需的背景知识和实践基础。它由复杂度递增的实操步骤练习组成，并配有解释和大量的图表，包括一些必要的背景主题。


    读完本书，你将对 Linux C 和 C++ 编译器如何生成二进制代码有坚实的理解。此外，你将能够自信地分析此类代码，理解栈内存的使用情况，并重建原始的 C/C++
    代码。


    本书对以下人员非常有用：


    - 软件支持与升级工程师、云安全工程师、SRE 和 DevSecOps

    - 拥有 JVM 背景的软件工程师

    - 软件测试人员

    - 来自非 Linux 环境（例如 Windows 或 Mac OS X）的工程师

    - 来自非 ARM 环境（例如 x86/x64）的工程师

    -  un具备汇编语言背景的 Linux C/C++ 软件工程师

    - 不具备汇编语言背景的安全研究人员人员

    - 学习 Linux 软件逆向工程技术的初学者


    本书也可以作为相关本科课程 ARM64 汇编语言和 Linux 调试的补充教材。


    ## 源代码


    本书中使用的所有源代码都可以从 github.com/apress/arm64-linux-debugging-disassembling-reversing
    下载。


    # 第 1 章


    ## 内存、寄存器与简单算术


    ### 理想计算机内部的内存与寄存器


    计算机内存由一系列内存单元组成，每个单元都有一个唯一的地址（位置）。每个单元都包含一个“数字”。我们把这些“数字”称为地址（位置）的内容。由于内存访问速度比算术指令慢，因此存在所谓的“寄存器”，用于加速需要内存存储临时结果的复杂操作。我们也可以把它们视为独立的内存单元。寄存器的名称就是它的地址。图
    1-1 所示。


    | 地址 (Location): 100 | 0 |

    | :--- | :--- |

    | 地址 (Location): 101 | 0 |

    | 地址 (Location): 102 | 1 |

    | 地址 (Location): 103 | 1 |

    | 地址 (Location): 104 | 2 |

    | 地址 (Location): 105 | 0 |


    | 寄存器 1 |

    | --- |

    | 0 |

    | 寄存器 2 |

    | --- |

    | 10 |


    图 1-1. 表示为内存单元和位置序列的内存


    ### 64 位计算机内部的内存与寄存器


    在这里，包含整数值的内存位置地址通常相差四或八字节，我们还展示了两个名为 X0 和 X1 的寄存器。它们的半部分称为 W0 和 W1，如图 1-2 所示。


    | 地址 (Location) | 寄存器 X0 | 寄存器 X1 |

    | --- | --- | --- |

    | 地址 (Location): 100 | 0 | |

    | 地址 (Location): 104 | 0 | W0 |

    | 地址 (Location): 108 | 1 | |

    | 地址 (Location): 112 | 1 | 10 |

    | 地址 (Location): 116 | 2 | W1 |

