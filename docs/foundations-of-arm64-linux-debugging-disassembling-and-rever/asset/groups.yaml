  - '[PAGE 40]


    What happened to all our assembly code in this executable? This code seems to
    be directly placing the end result into “a” and “b” memory cells if we observe.
    Why is this happening? The answer lies in compiler optimization. When the code
    is compiled in optimization mode, the compiler can calculate the final result
    from the simple C/C++ source code itself and generate only the necessary code
    to update corresponding memory locations.


    # # Summary


    In this chapter, we looked at assembly language code produced by a debugger via
    disassembling binary code. Then, we reversed it to C and C++ code. We also compared
    the disassembly output of nonoptimized code to optimized code and understood why.


    The next chapter refreshes number representations, especially hexadecimal one.'
