    # CHAPTER 4 POINTERS


    This statement means that we multiply the contents of the memory cell whose address
    is stored in the X1 register by the value stored in the memory cell whose address
    is stored in the X0 register. In the C or C++ language, we write a similar expression
    as the addition statement we have seen in the previous sections (note that we
    have two distinct meanings of the "*" operator: pointer dereference and multiplication):


    ```

    *pb = *pb * *pa;

    *pb *= *pa;

    ```


    The latter is a shorthand notation. In assembly language, we use instruction MUL
    and registers that hold values to multiply. Registers W2 and W4 already hold values
    from [X0] and [X1] from the previous code, so we don''t need load instructions,
    but we use W3 to hold the multiplication result:


    ```

    mul w3, w4, w2

    str w3, [x1]

    ```


