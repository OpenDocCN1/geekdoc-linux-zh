    # CHAPTER 1 MEMORY, REGISTERS, AND SIMPLE ARITHMETIC


    To recall, "a" and "b" mean the names of locations (addresses) 000000000042b200
    and 000000000042b204, respectively (see Figures 1-4A and 1-4B). [a] and [b] mean
    contents at "a" and "b", respectively, simply some numbers stored there.


    In the C or C++ language, we write the following statement:


    ```

    b = b + a;

    b b += a;

    ```


    In assembly language, we use the instruction ADD. Because of ARM architecture
    limitations, we cannot use memory addresses in one step (instruction), for example,
    add b, b, a. We can use only the add register instruction to add the value stored
    in the register0 to register1, add the value stored in the register1 and move
    the result to the register1. So, first, we need to load (ldr) contents at "a"
    and "b" to registers and store (str) the result back to a memory location "b"
    after addition. Recall that a register is like a temporary memory cell here:


    ```

    Register2 <- [b]

    Register1 <- [a]

    Register2 <- register2 + register1

    [b] <- register2

    ```


    In assembly language, we write


    ```

    adr x0, b

    ldr w1, [x0]\adr x0, a

    ldr w0, [x0]

    add w1, w1, w0

    adr x0, b

    str w1, [x0]

    ```


