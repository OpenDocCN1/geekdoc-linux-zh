  mdcn: "\n\n## 第 12 章\n\n##更多指令\n\n### PSTATE 标志\n\n除了寄存器，CPU 还包含一个 32 位的 PSTATE，其中四个独立的位\
    \ N、Z、C 和 V（图 12-1）会根据算术和其他操作被设置或清零。单独的指令可以操作某些位的值，这些位的值会影响代码的执行。\n\n![](img/75ad7b091e3ad3da1f54f0b706f6bf2e_156_0.png)\n\
    \n这些标志有它们专门的寄存器 NZCV。\n\n## 零测试\n\nNZCV 寄存器中的 Z 位在指令结果为零时置为 1，否则清零。该位受以下指令影响：\n\
    \n- 带有 S 后缀的算术指令（例如 ADDS, SUBS, MULS）\n\n## TST – 逻辑比较\n\n此指令计算两个操作数之间的位逻辑与（AND）操作，并根据计算结果设置标志（包括\
    \ Z），计算结果会被丢弃：\n\n```\nTST reg, reg\nTST reg, #imm\n```\n\n示例：\n\n```\nTST X0,\
    \ #4\n```\n\n假设 X0 寄存器包含 4 (100bin)：\n\n```\n100bin AND 100bin = 100bin != 0 (Z\
    \ 清零)\n```\n\n```\nTST W1, #1\n```\n\n假设 W1 包含 0 (0bin)：\n\n```\n0bin AND 1bin\
    \ = 0bin == 0 (Z 置位)\n```\n\n这里是 TST 指令的伪代码（省略了与 Z 位相关的细节）：\n\n```\nTEMP <- OPERAND1\
    \ AND OPERAND2\nIF TEMP = 0 THEN\nZ <- 1\nELSE\nZ <- 0\n```\n\n## CMP – 比较两个操作数\n\
    \n```\nCMP reg, reg\nCMP reg, #imm\n```\n\n示例：\n\nCMP X1, #0\n\n假设 X1 包含 0：\n\n\
    0 - 0 == 0 (Z 置位)\n\nCMP W0, #0x16\n\n假设 W0 包含 4hex：\n\n```\n4hex - 16hex = FFFFFFEhex\
    \ != 0 (Z 清零)\n4dec - 22dec = -18dec\n```\n\n这里是 CMP 指令的伪代码（省略了与 Z 位相关的细节）：\n\n\
    ```\nTEMP <- OPERAND1 - OPERAND2\nIF TEMP = 0 THEN\n    Z <- 1\nELSE\n    Z <-\
    \ 0\n```\n\n## 第 12 章更多指令\n\n## TST 还是 CMP？\n\n如果我们想测试零，这两个指令是等价的，但 CMP 指令影响的标志比\
    \ TST 多：\n\n```\nTST X0, X0\nCMP X0, #0\n```\n\nCMP 指令用于比较不等性（TST 指令无法在此使用）：\n\
    \n```\nCMP X0, #0 // > 0 还是 < 0 ？\n```\n\nTST 指令用于查看单个位是否被设置：\n\n```\nTST X0,\
    \ #2 // 2 == 0010bin 或在 C 语言中: if (var & 0x2)\n```\n\nX0 值为 2 的示例：\n\n```\nTST\
    \ X0, #4 # 0010bin AND 0100bin = 0000bin (Z 置位)\nTST X0, #6 # 0010bin AND 0110bin\
    \ = 0010bin (Z 清零)\n```\n\n## 条件跳转\n\n考虑以下两个 C 或 C++ 代码片段：\n\n```\nif (a == 0)\
    \ if (a != 0)\n{\n    ++a;\n}\nelse\n{\n    --a;\n}\nelse\n```\n\nCPU 按顺序取取指令，因此我们必须告诉\
    \ CPU 如果某些条件（不）满足，我们想要跳过某些指令，例如当 a != 0 时。\n\nB.NE（非零跳转）和 B.EQ（零跳转）测试 Z 标志，如果\
    \ Z 位清零（对于 B.NE）或置位（对于 B.EQ），则更改 PC。下面的汇编代码与之前的 C/C++ 代码等：\n\n```\nADR X0, A \
    \              ADR X0, A\nLDR X1, [X0]            LDR X1, [X0]\nCMP X1, #0   \
    \           TST X1, X1\nB.NE label1             B.EQ label1\nADD X0, X0, #1  \
    \        ADD X0, X0, #1\nB label2                B label2\nlabel1: SUB X0, X0,\
    \ #1 label1: SUB X0, X0, #1\nlabel2: STR X1, [X0]    label2: STR X1, [X0]\n```\n\
    \n## 函数返回值\n\n许多函数通过 X0 寄存器返回值。例如：\n\n```\nlong func();\n```\n\n返回值位于 X0 中。\n\n\
    ```\nbool func();\n```\n\n返回值位于 W0 中。\n\n布尔值在内存中占用一个字节，因此编译器使用 W0 而不是 X0。\n\n\
    ## 总结\n\n在本章中，我们学习了 CPU 标志、比较指令、条件分支和函数返回值——这些通常出现在二进制代码中，我们需要在调试时反汇编它们来理解程序逻辑。下一章是我们的“函数指针”项目——反汇编分析一个使用函数参数的项目。\n\
    \n## 第 13 章 函数指针\n\n## 函数指针项目\n\n源代码摘要：\n\n```cpp\n// FunctionParameters.cpp\n\
    int main(int argc, char* argv[])\n{\n    int a, b;\n\n    printf(\"Enter a and\
    \ b: \");\n    scanf(\"%d %d\", &a, &b);\n\n    if (arithmetic(a, b))\n    {\n\
    \        printf(\"Result = %d\\n\", b);\n    }\n    return 0;\n}\n```\n\n```cpp\n\
    // Arithmetic.cpp\nbool arithmetic (int a, int *b)\n{\n  if (!b) {\n    return\
    \ false;\n  }\n  *b = *b + a;\n  ++a;\n  *b = *b * a;\n  return true;\n}\n```\n\
