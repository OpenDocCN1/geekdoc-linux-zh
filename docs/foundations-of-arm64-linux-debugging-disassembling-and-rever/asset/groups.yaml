  - '[PAGE 82]


    # Registers Revisited


    X0–X30 64-bit registers can be used as pointers to memory. They contain 32-bit
    registers W0–W30.


    If an instruction uses W0–W30 registers, the size of operations is 32-bit. Otherwise,
    it is 64-bit.


    # NULL Poointers


    The first addresses starting from 0x0000000000000000 are specifically made inaccessible
    on Linux. On your ARM64 system, it is the range 0x0000000000000000–0x00000000000007FFF.
    The following code will force an application crash or kernel panic if executed
    inside a driver:


    ```

    mov x0, #0

    str x1, [x0]      // Access violation

    ```


    # Invalid Pointers


    There are different kinds of invalid pointers that cause an access violation when
    we try to dereference them:


    +   - NULL pointers

    - Pointers to inaccessible memory

    - Pointers to read-only memory when writing


    Other pointers may or not cause an access violation, and some of them are discussed
    in subsequent chapters:


    +   - Pointers pointing to “random” memory

    - Uninitialized pointers having random value inherited from past code execution

    - Dangling pointers'
  - '[PAGE 83]


    The latter pointers are similar to pointers to “random” memory locations and arise
    when we get set pointer variables to zero (NULL) after disposing of the memory
    they point to. By nullifying pointers, we indicate that they no longer point to
    memory.


    # Variables As Pointers


    Suppose we have two memory addresses (locations) “a” and “b” declared and defined
    in C and C++ as


    ```

    int a, b;

    ```


    These are normal variables “a” and “b.” Also, we can have another two memory addresses
    (locations) “pa” and “pb” declared and defined in C and C++ as


    ```

    int *pa, *pb;

    ```


    Here, pa is a pointer to an int, or in other words, the memory pa contains the
    address of another memory cell that contains an integer value.


    # Pointer Initialization


    In order to have pointers to point to memory, we need to initialize them with
    corresponding memory addresses. Here is a typical C or C++ code that does what
    we need:


    ```

    int a; // uninitialized variable

    int *pa; // uninitialized pointer

    pa = &a; // (pa) now contains the address of a

    int b = 12; // initialized variable

    int *pb = &pb; // initialized pointer

    ```'
