    \ C/C++ 代码计算最终结果并更新内存位置。\n\n## 总结\n\n在本章中，我们通过反汇编查看了调试器产生的汇编语言，将其还原为 C/C++ 代码。我们还比较了未优化的代码和优化后的代码并理解了原因。下一章介绍数字表示法，特别是进制。\n\
    \n## 第 3 章 数字表示法\n\n## 数字及其表示法\n\n想象一个古代的牧羊人正在数羊。他有一定数量的石头（十二）：\n\n![](img/75ad7b09e3ad3154f0b70f62e41_0.png)\n\
    \n然而，他只能数到三，并按三一组排列：\n\n![](img/75ad7b09e3ad3154f0b70f62e41_1.png)\n\n最后一张图是石头数量的一种表示（符号）。我们有一组三加另一组三。如果能数到十，我们会看到相同数量石头的不同表示方法。我们会有一组十和另一组二。\n\
    \n## 十进制表示（十）\n\n让我们看看如果我们能数到十，十二块石头如何在算术表示法中表示。我们有一组十加二：\n\n$12_{dec} = 1 * 10\
    \ + 2$ 或 $1 * 10^{1} + 2 * 10^{0}$\n\n另一个 123 块石头的练习。我们有一**一组**十，另一组**2** 组十，最后一组**3**\
    \ 块石头：\n\n$123_{dec} = 1 * 10^{3} + 2 * 10^{1} + 3$ 或 $1 * 10^{2} + 2 * 10^{1}\
    \ + 3 * 10^{0}$\n\n我们可以将其形式化为以下求和：\n\n$N_{dec} = a_{n}*10^{n} + a_{n-1}*10^{n-1}\
    \ + ... + a_{2}*10^{2} + a_{1}*10^{1} + a_{0}*10^{0}$\n$0 \\le a_{i} \\le 9$\n\
    \n使用求和符号，我们得到了公式：\n\n$N_{dec} = \\sum_{i=0}^{n} a_{i}*10^{i}$\n\n## 三进制表示（三进制）\n\
    \n现在回到牧羊人十二块石头的例子。我们有**一组**三三，**一组**三，以及一个代替十二的空组。我们可以顺序写下数字：110。因此，110 是石头的三进制表示（符号），它等于十进制的十二：\n\
    \n$12_{dec} = 1*3^{2} + 1*3^{1} + 0*3^{0}$\n$N_{dec} = \\sum_{i=0}^{n} a_{i}*3^{i}$\n\
    $0 \\le a_{i} \\le 2$\n\n## 表示法\n\n## 二进制表示（二进制）\n\n在数到二的情况下，我们有更多的石头分组：1100。因此，1100\
    \ 是十进制 12 的二进制表示（符号）：\n\n$12_{dec} = 1*2^{3} + 0*2^{2} + 1*2^{1} + 0*2^{0}$\n\
    $N_{dec} = \\sum_{i=0}^{n} a_{i}*2^{i}$\n\n## 十六进制表示（十六进制）\n\n如果我们能数到十六，十二只需要一组十，但我们需要更多符号：A、B、C、D、E\
    \ 分别代表十、十一、十二、十三、十五：\n\n$12_{dec} = C$ 在十六进制表示\n$12_{dec} = 7B_{hex}$\n$12_{dec}\
    \ = 1*16^{1} + 5*16^{0}$\n\n## 为什么使用十六进制？\n\n考虑这个二进制数字：1100101011。它的十进制表示是 315：我们将二进制位四位一组，并用十进制和十六进制写出：\n\
    \n```\n1100 1010 1011\n\n$12_{dec}$ $5_{dec}$\n\n$C_{hex}$ $A_{hex}$ $3_{hex}$\n\
    ```\n\n我们看到每四位数字对应一个十六进制数字。\n\n"
