    # Number Representations\n\n## Numbers and Their Representations\n\nImagine a\
    \ herder in ancient times trying to count his sheep. He has a certain number of\
    \ stones (twelve):\n\n![](img/75ad7b091e3ad31154f0b70f6bf2e_41_0.png)\n\nHowever,\
    \ he can only count up to three and arranges the total into groups of three:\n\
    \n![](img/75ad7b091e3ad31154f0b70f6bf2e_41_1.png)\n\nThe last picture is a representation\
    \ (a kind of notation) of the number of stones. We have one group of three groups\
    \ of three stones plus a separate group of three stones. If we count up to ten,\
    \ we would see a different representation of the same number of stones. We would\
    \ have one group of ten stones and another group of two stones.\n\n## Decimal\
    \ Representation (Base Ten)\n\nLet's see how twelve stones are represented in\
    \ arithmetic notation if we can count up to ten. We have one group of ten plus\
    \ two:\n\n$12_{dec} = 1 * 10 + 2$ or $1 * 10^{1} + 2 * 10^{0}$\n\nHere is another\
    \ exercise with 123 stones. We have **1 group** of ten by ten stones, another\
    \ group of **2** groups of ten stones, and the last group of **3 stones**:\n\n\
    $123_{dec} = 1 * 10^{3} + 2 * 10^{1} + 3$ or $1 * 10^{2} + 2 * 10^{1} + 3 * 10^{0}$\n\
    \nWe can formalize it in the following summation notation:\n\n$N_{dec} = a_{n}*10^{n}\
    \ + a_{n-1}*10^{n-1} + ... + a_{2}*10^{2} + a_{1}*10^{1} + a_{0}*10^{0}$\n$0 \\\
    le a_{i} \\le 9$\n\nUsing the summation symbol, we have this formula:\n\n$N_{dec}\
    \ = \\sum_{i=0}^{n} a_{i}*10^{i}$\n\n## Ternary Representation (Base Three)\n\n\
    Now we come back to herder's example of twelve stones. We have **1 group** of\
    \ three by three, **1 group** of three, and an empty **(0)** group instead of\
    \ twelve. We can write down the number sequentially: 110. Therefore, 110 is a\
    \ ternary representation (notation) of stones, and it is equivalent to 12 written\
    \ in decimal:\n\n$12_{dec} = 1*3^{2} + 1*3^{1} + 0*3^{0}$\n$N_{dec} = \\sum_{i=0}^{n}\
    \ a_{i}*3^{i}$\n$0 \\le a_{i} \\le 2$\n\n## REPRESENTATIONS\n\n## Binary Representation\
    \ (Base Two)\n\nIn the case of counting to two, we have more groups for stones:\
    \ 1100. Therefore, 1100 is a binary representation (notation) for 12 in decimal:\n\
    \n$12_{dec} = 1*2^{3} + 0*2^{2} + 1*2^{1} + 0*2^{0}$\n$N_{dec} = \\sum_{i=0}^{n}\
    \ a_{i}*2^{i}$\n\n## Hexadecimal Representation (Base Sixteen)\n\nIf we can count\
    \ up to sixteen, twelve stones fit in one group, but we need more symbols: A,\
    \ B, C, D, E, and F for ten, eleven, thirteen, and fifteen, respectively:\n\n\
    $12_{dec} = C$ in hexadecimal representation (notation)\n$123_{dec} = 7B_{hex}$\n\
    $123_{dec} = 7*16^{1} + 11*16^{0}$\n$N_{dec} = \\sum_{i=0}^{n} a_{i}*16^{i}$\n\
    \n## Why Are Hexadecimals Used?\n\nConsider this number in binary notation: $11001010111_2$.\
    \ Its equivalent in decimal notation is 3155:\n\n$3155_{dec} = 1*2^{11} + 1*2^{10}\
    \ + 0*2^9 + 0*2^8 + 0*2^7 + 1*2^{6} + 0*2^{5} + 1*2^{4} + 0*2^3 + 0*2^{2} + 1*2^{1}\
    \ + 1*2^0$\n\nWe divide the binary number digits into groups of four and write\
    \ them in decimal and hexadecimal notation:\n\n```\n$11001010011\n\n$12_{dec}$\
    \ $5_{dec}$ $3_{dec}$\n\n$C_{hex}$ $5_{hex}$ $3_{hex}$\n```\n\nWe see that hexadecimal\
    \ notation is more compact because every four digit group number corresponds to\
    \ one hexadecimal number. Table 3-1 lists hexadecimal equivalents for every binary\
    \ digit combination.\n\n## Table 3-1. Hexadecimal Equivalents for Every Four Binary\
    \ Digit Combination\n\n| Binary | Decimal | Hexadecimal |\n|---|---|---|\n| 0000\
