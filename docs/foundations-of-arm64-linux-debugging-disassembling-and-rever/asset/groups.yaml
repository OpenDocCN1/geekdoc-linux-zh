    # Summary


    This chapter looked at pointers in greater detail, considering different byte
    memory granularity. We also discussed issues related to abnormal defects, such
    as uninitialized, invalid, and NULL pointers. Finally, in the GDB debugger, we
    disassembled and traced a program that used variables as pointers and learned
    additional commands to display memory addresses and contents.


    The next chapter introduces logical instructions, the zero register, and the program
    counter register. We also learn an additional GDB command to get program code
    and data section addresses.'
