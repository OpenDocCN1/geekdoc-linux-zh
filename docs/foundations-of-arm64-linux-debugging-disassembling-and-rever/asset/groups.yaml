    # 第4章 指针


    ![](img/75ad7b091e3ad3da1f54f0b706f6bf2e_48_0.png)


    图 4-1. 指针示例与内存布局


    ## “指针”项目：内存布局与寄存器


    在我们的调试项目中，我们有两个内存地址（位置）“a”和“b”。我们可以将“a”和“b”视为地址（位置）的名字。我们提醒，符号 (a) 表示内存地址（位置）“a”处的内容。


    我们还有寄存器 X0 和 X1，作为指向“a”和“b”的指针。这些寄存器分别包含“a”和“b”的地址。符号 [X0] 表示地址存储在寄存器 X0 中的内存单元的内容。


    在 C 语言和 C++ 语言中，我们声明并定义指向“a”和“b”的指针：


    ```

    int *a, *b;

    ```


    我们的项目在程序执行前的内存布局如图 4-2 所示。地址始终占用 64 位的内存单元或完整的 64 位寄存器（如 X0 或 X1）（它们无法放入 W0、W1
    或 32 位内存单元中）。如有必要，我们使用 X2–X4 寄存器的低半部分（W2-W4）来存放临时整数值。


    | 位置：a (地址 00000000004100f0) | 寄存器 X0 |

    | :--- | :--- |

    | | 0 |

    | | 0 |

    | | 0 |

    | | 0 |

    | | 0 |

    | | 0 |

    | 位置：b (地址 00000000004100f4) | 寄存器 W2 |

    | | 寄存器 X1 |

    | | 寄存器 W3 |

    | | 寄存器 W4 |


    **图 4-2.** 程序执行前的项目内存布局


    ## “指针”项目：计算


    为了从底层汇编语言的角度更好地理解指针，我们使用内存指针而不是直接内存地址来执行第1章中的旧算术计算：


    ```

    X0 <- address a

    [X0] <- 1

    X1 <- address b

    [X1] <- [X1] + [X0]

    [X0] <- [X0] + 1

    [X1] <- [X1] * [X0]

    ```


    ## 使用指针为内存单元赋值数字


    首先，以下伪代码指令序列意味着我们把 X0 寄存器的内容解释为内存单元的地址，并为该内存单元赋值：


    ```

    X0 <- address a

    [X0] <- 1

    ```


    在 C 语言和 C++ 语言中，这被称为“解引用指针”，我们写道：


    ```c

    int a;

    int *pa = &a; // 指针的声明和定义

    *pa = 1; // 获取内存单元（解引用指针）

    // 并对其赋值

    ```


    在汇编语言中，我们写道：


    ```assembly

    adr x0, a // 将地址 "a" 加载到 x0

    mov w3, #1 // 将临时寄存器设置为 1

    str w3, [x0] // 使用 x0 作为指针并将 1 存储在 x0 指向的内存地址

    ```


