    \      ldr w1, [x0]\n               // [a] = 2     add w1, w1, #1\n[b] <- [b]\
    \ * [a] // x0 = b      adr x0, b\n               // w1 = 2      ldr w1, [x0]\n\
    \               // x0 = a      adr x0, a\n               // w0 = 2      ldr w0,\
    \ [x0]\n               // w1 = 4      mul w1, w1, w0\n               // x0 = b\
    \      adr x0, b\n               // [b] = 4     str w1, [x0]\n```\n\nAfter the\
    \ execution of the STR instruction, we have the memory layout illustrated in Figure\
    \ 1-7."
