    # Function Prolog and Epilog


    Now, before we try to make sense of the FunctionParameters project disassembly,
    we look at the simple case of one function parameter of type long and one local
    variable of type long to illustrate the standard function prolog and epilog sequence
    of instructions and corresponding stack memory changes.


    ```

    func0() { func2(long i) {

    ```


    | mov x0, #1 | | sub, sp, #0x20 | str | x0, [sp#8] |

    |---|---|---|---||

    | | | | |

    | | | SP → | SP → |

    | | | | |

    | | | | 1 |

    | | | | |

    | | | | | |

    | SP → 0x10001000 | SP → 0x10001000 | 0x10001000 | 0x10001000 |


    **Figure 11-2.** Memory layout for the prolog with one function parameter and
    one local variable


    The function prolog is illustrated in Figure 11-2, and the function epilog is
    illustrated in Figure 11-3.


    Here, the function parameter is passed via the X0 register. It is saved on the
    stack because the register may be used later in calculations or the function parameter
    passing to other functions. Generally, the first eight parameters of a function
    are passed via X0–X7 registers from left to the'
