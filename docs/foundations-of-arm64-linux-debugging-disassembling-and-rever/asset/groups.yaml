  - "[PAGE 136]\n\n# Stack Structure (No Function Parameters)\n\nSuppose the following\
    \ function is called:\n\n```\nvoid func()\n{\n    int var1, var2;\n    // body\
    \ code\n    // ...\n}\n```\n\nBefore the function body code is executed, the following\
    \ pointers are set up:\n\n+   * [SP, #8] contains local variable var1 (word).\n\
    * [SP, #12] contains local variable var2 (word).\n\nIt is illustrated in Figure\
    \ 10-2. Stack room space needs to be aligned by 16 bytes by ARM64 specification.\n\
    \n![](img/75ad7b091e3ad3da1f54f0b706f6bf2e_136_0.png)\n\nFigure 10-2. Stack memory\
    \ layout without function parameters"
  - "[PAGE 137]\n\n# Function Prolog\n\nThe sequence of instructions resulting in\
    \ the initialization of the SP register, saving X29/LR (if there are further calls\
    \ inside), and making room for local variables is called the function prolog.\
    \ One example of it is Figure 10-3, where func calls func2, which has one local\
    \ variable. Sometimes, saving necessary registers is also considered as part of\
    \ a function prolog.\n\n```\nfunc() { func2(); }\n\nfunc2() { long var; call func3();\
    \ }\n    bl func2\n    stp x29, x30, [sp.-#32]\n    mov x29, sp\n```\n\n| | |\
    \ SP | X29 |\n|---|---|---||\n| 0 | | |\n| 0 | | X30 (LR) |\n| 0 | | 0 |\n| 0\
    \ | | 0 |\n| 0x10001000 | 0x10001000 | 0x10001000 |\n\n**Figure 10-3.** Example\
    \ memory layout for function prolog\n\n# Raw Stack (No Local Variables and Function\
    \ Parameters)\n\nNow we can understand additional data that appears on the raw\
    \ stack together with function return addresses that we saw in Chapter 9 project\
    \ \"SimpleStack\":"
