    [b] <- [b] + [a]

    [a] <- [a] + 1

    [b] <- [a] * [a]

    ```


    “-" moving (assigning) the new value to the contents of a memory location (address).
    "// is a comment sign, and the rest of the line is a comment. "=" shows the current
    value at a memory location (address).

    To remind, a code written in a high-level programming language is translated to
    a machine language by a compiler. However, if its digital codes are represented
    in some mnemonic system called assembly language. For example, ADD X1, X1, #1
    is increment by one of what is stored in the register memory cell X1.


