  - '[PAGE 77]


    # CHAPTER 6


    # Pointers to Memory


    # Pointers Revisited


    The pointer is a memory cell or a register that contains the address of another
    memory cell. Memory pointers have their own addresses because they are memory
    cells too. On 32-bit Linux, pointers are 32-bit, and on 64-bit Linux, pointers
    are 64-bit.


    # Addressing Types


    As we have seen in Chapter 5, memory cells can be one of byte, halfword, word,
    or doubleword size. Therefore, we can have a pointer to a byte, a pointer to a
    halfword, a pointer to a word, and a pointer to a doubleword. If we want to load
    or store a byte, we use LDRB/STR and W-registers for data, a halfword – LDRH/STRH
    and W-registers for data, a word – LDR/STR and W-registers for data, a doubleword
    – LDR/STR and X-registers for data. We always use X-registers for memory addresses.
    Here are some illustrated examples:


    ```

    mov w1, #0FF

    ldrb w1, [x0]      // load one byte

    strb w1, [x0]      // stores one byte

    str w1, [x0]       // stores one word\ldr x1, [x0]      // loads one doubleword

    ```'
