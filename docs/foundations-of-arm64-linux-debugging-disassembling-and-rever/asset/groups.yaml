    \ | 0x10001000 | 0x10001000 |\n\n**Figure 11-2.** Memory layout for the prolog\
    \ with one function parameter and one local variable\n\nThe function prolog is\
    \ illustrated in Figure 11-2, and the function epilog is illustrated in Figure\
    \ 11-3.\n\nHere, the function parameter is passed via the X0 register. It is saved\
    \ on the stack because the register may be used later in calculations or the function\
    \ parameter passing to other functions. Generally, the first eight parameters\
    \ of a function are passed via X0–X7 registers from left to the right when parameters\
    \ are doublewords like pointers or long values via W0–W7 registers when parameters\
    \ are like integers. Additional parameters are passed via the stack locations\
    \ using STR/STP instructions.\n\n```\nadd sp, sp, #0x20 ret\n```\n\n| | | | |\n\
