- md: "\n## CHAPTER 12\n\n## More Instructions\n\n### PSTATE Flags\n\nIn addition\
    \ to registers, the CPU also contains a 32-bit PSTATE where four individual bits\
    \ N, Z, C, and V (Figure 12-1) are set or cleared in response to arithmetic and\
    \ other operations. Separate machine instructions can manipulate some bit values,\
    \ and their values affect code execution.\n\n![](img/75ad7b091e3ad3da1f54f0b706f6bf2e_156_0.png)\n\
    \nThese flags have their own special register NZCV.\n\n## Testing for zero\n\n\
    The Z bit in the NZCV register is set to one if the instruction result is zero\
    \ and cleared otherwise. This bit is affected by:\n\n- Arithmetic instructions\
    \ with the S suffix (e.g., ADDS, SUBS, MULS)\n\n## TST – Logical Compare\n\nThis\
    \ instruction computes bitwise logical AND between both operands and sets flags\
    \ (including Z) according to the computed result (which is discarded):\n\n```\n\
    TST reg, reg\nTST reg, #imm\n```\n\nExamples:\n\n```\nTST X0, #4\n```\n\nSuppose\
    \ the X0 register contains 4 (100bin):\n\n```\n100bin AND 100bin = 100bin != 0\
    \ (Z is cleared)\n```\n\n```\nTST W1, #1\n```\n\nSuppose W1 contains 0 (0bin):\n\
    \n```\n0bin AND 1bin = 0bin == 0 (Z is set)\n```\n\nHere is the TST instruction\
    \ in pseudo-code (details not relevant to the Z bit are omitted):\n\n```\nTEMP\
    \ <- OPERAND1 AND OPERAND2\nIF TEMP = 0 THEN\nZ <- 1\nELSE\nZ <- 0\n```\n\n##\
    \ CMP – Compare Two Operands\n\n```\nCMP reg, reg\nCMP reg, #imm\n```\n\nExamples:\n\
    \nCMP X1, #0\n\nSuppose X1 contains 0:\n\n0 - 0 == 0 (Z is set)\n\nCMP W0, #0x16\n\
    \nSuppose W0 contains 4hex:\n\n```\n4hex - 16hex = FFFFFFEhex != 0 (Z is cleared)\n\
    4dec - 22dec = -18dec\n```\n\nHere is the CMP instruction in pseudo-code (details\
    \ not relevant to the Z bit are omitted):\n\n```\nTEMP <- OPERAND1 - OPERAND2\n\
    IF TEMP = 0 THEN\n    Z <- 1\nELSE\n    Z <- 0\n```\n\n## CHAPTER 12 MORE INSTRUCTIONS\n\
    \n## TST or CMP?\n\nBoth instructions are equivalent if we want to test for zero,\
    \ but the CMP instruction affects more flags than TST:\n\n```\nTST X0, X0\nCMP\
    \ X0, #0\n```\n\nThe CMP instruction is used to compare for inequality (the TST\
    \ instruction cannot be used here):\n\n```\nCMP X0, #0 // > 0 or < 0 ?\n```\n\n\
    The TST instruction is used to see if individual bits are set:\n\n```\nTST X0,\
    \ #2 // 2 == 0010bin or in C language: if (var & 0x2)\n```\n\nExamples where X0\
    \ has the value of 2:\n\n```\nTST X0, #4 # 0010bin AND 0100bin = 0000bin (Z is\
    \ set)\nTST X0, #6 # 0010bin AND 0110bin = 0010bin (Z is cleared)\n```\n\n## Conditional\
    \ Jumps\n\nConsider these two C or C++ code fragments:\n\n```\nif (a == 0) if\
    \ (a != 0)\n{\n    ++a;\n}\nelse\n{\n    --a;\n}\nelse\n```\n\nThe CPU fetches\
    \ instructions sequentially, so we must tell the CPU that we want to skip some\
    \ instructions if some condition is (not) met, for example, if a != 0.\n\nB.NE\
    \ (jump if not zero) and B.EQ (jump if zero) test the Z flag and change PC if\
    \ the Z bit is cleared for B.NE or set for B.EQ. The following assembly language\
    \ code is equivalent to the preceding C/C++ code:\n\n```\nADR X0, A          \
    \     ADR X0, A\nLDR X1, [X0]            LDR X1, [X0]\nCMP X1, #0            \
    \  TST X1, X1\nB.NE label1             B.EQ label1\nADD X0, X0, #1          ADD\
    \ X0, X0, #1\nB label2                B label2\nlabel1: SUB X0, X0, #1 label1:\
    \ SUB X0, X0, #1\nlabel2: STR X1, [X0]    label2: STR X1, [X0]\n```\n\n## Function\
    \ Return Value\n\nMany functions return values via the X0 register. For example:\n\
    \n```\nlong func();\n```\n\nThe return value is in X0.\n\n```\nbool func();\n\
    ```\n\nThe return value is in W0.\n\nBool values occupy one byte in memory, so\
    \ the compiler uses W0 instead of X0.\n\n## Summary\n\nIn this chapter, we learned\
    \ about CPU flags, comparison instructions, conditional branches, and function\
    \ return values – usually present in binary code that we need to disassemble to\
    \ understand program logic during debugging. The next chapter is our “Function\
    \ Pointer” project – we disassemble analyze a project that uses function parameters.\n\
    \n## CHAPTER 13 Function Pointer\n\n## Function Pointer Project\n\nSummary of\
    \ source code:\n\n```cpp\n// FunctionParameters.cpp\nint main(int argc, char*\
    \ argv[])\n{\n    int a, b;\n\n    printf(\"Enter a and b: \");\n    scanf(\"\
