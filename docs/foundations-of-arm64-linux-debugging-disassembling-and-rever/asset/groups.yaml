    # # Summary


    In this chapter, we disassembled and analyzed a project that used function parameters
    which are pointers.


    The next, final chapter of the book summarizes various basic disassembly patterns.'
  - '[PAGE 171]


    # CHAPTER 14


    # Summary of Code Disassembly Patterns


    This final chapter summarizes the various patterns we have encountered during
    the reading of this book.


    # Function Prolog/Epilog


    Function prolog


    ```

    stp x29, x30, [sp,-48]!

    mov x29, sp

    ```


    Some code may omit stp if there are no nested calls inside:


    ```

    sub sp, sp, #0x10

    ```


    Function epilog


    ```

    ldp x29, x30, [sp],#48

    ret

    ```


    Some code may omit to restore X29/X30 if there are no nested calls inside:


    ```

    add sp, sp, #0x10

    ret

    ```'
  - '[PAGE 172]


    Knowing the prolog can help identify situations when symbol files or function
    start addresses are not correct. For example, suppose we have the following backtrace:


    ```

    foo3+0x5F

    foo2+0x8F

    foo0+0x20

    ```


    If we disassemble the foo2 function and see that it does not start with the prolog,
    we may assume that backtrace needs more attention:


    ```

    (gdb) x/i foo2

    0x0000000000455165:  ldr x0, [x1]

    ```


    # ADR (Address)


    The following instructions


    ```

    adrp x0, 0x400000

    add x0, x0, #0x7d0

    ```


    are equivalent to the following instruction for smaller addresses:


    ```

    adr x0, 0x4007d0

    ```


    # Passing Parameters


    The first eight function parameters are passed from left to right via


    X0 - X7'
  - '[PAGE 173]


    Note Although we haven''t seen examples for more than eight function parameters,
    they are passed via the stack, for example, via STR or STP instructions. Passed
    parameters are saved on the stack by the callee.


    # Static/global variable address (or string constant)


    ```

    adrp x0, 0x400000

    add x0, x0, #0x7d0

    ```


    # Local variable value


    ```

    ldr x0, [reg]            // local variable value

    call func

    ```


    # Local variable address


    ```

    add x0, x29, #offset      // local variable address

    call func

    ```


    # Accessing Saved Parameters and Local Variables


    # Local word (int) variable value


    ```

    ldr w0, [sp, #offset]

    ```


    # Local doubleword (long) variable value


    ```

    ldr x0, [sp, #offset]

    ```


    # Local variable address


    ```

    add x0, sp, #offset

    ```'
