- img_proc: true
  md: 'Note Although we haven''t seen examples for more than eight function parameters,
    they are passed via the stack, for example, via STR or STP instructions. Passed
    parameters are saved on the stack by the callee.


    # Static/global variable address (or string constant)


    ```

    adrp x0, 0x400000

    add x0, x0, #0x7d0

    ```


    # Local variable value


    ```

    ldr x0, [reg]            // local variable value

    call func

    ```


    # Local variable address


    ```

    add x0, x29, #offset      // local variable address

    call func

    ```


    # Accessing Saved Parameters and Local Variables


    # Local word (int) variable value


    ```

    ldr w0, [sp, #offset]

    ```


    # Local doubleword (long) variable value


    ```

    ldr x0, [sp, #offset]

    ```


    # Local variable address


    ```

    add x0, sp, #offset

    ```'
