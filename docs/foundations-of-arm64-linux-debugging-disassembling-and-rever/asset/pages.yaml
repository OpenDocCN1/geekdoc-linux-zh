  md: '```

    a = a + 1;

    ++a;

    a++;

    b = b - 1;

    --b;

    b--;

    ```


    In assembly language, we use instructions ADD and SUB and write


    ```

    add x0, x0, #1

    sub x0, x0, #1\adr x0, a

