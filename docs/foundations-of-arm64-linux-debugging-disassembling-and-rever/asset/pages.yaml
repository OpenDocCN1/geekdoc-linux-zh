    We see that the compiler was able to figure out the result of computation: a=2;
    b=4. However, one question remains: Why did the compiler not optimize away instructions
    initializing pa and pb variables? The answer lies in the nature of a separate
    compilation model in C and C++. We can compile several compilation unit (.c or
    .cpp) files separately and independently. Therefore, there is no guarantee that
    another compilation unit would not reference our globally declared and defined
    pa and pb variables.'
