- img_proc: true
  md: 'right when parameters are doublewords like pointers or long values via W0–W7
    registers when parameters are like integers. Additional parameters are passed
    via the stack locations using STR/STP instructions.


    ```

    add sp, sp, #0x20 ret

    ```


    | | | |

    |---|---|---|

    | | 0 | | 0 |

    | | 0 | | 0 |

    | SP → | 0 | | 0 |

    | | 1 | | 1 |

    | | 0 | | 0 |

    | | 0 | | 0 |

    | 0x10001000 | → | 0x10001000 | → | 0x10001000 |


    **Figure 11-3.** Memory layout for the epilog with one function parameter and
    one local variable


    We also see that local variables are not initialized by default when their storage
    space is allocated via the SUB instruction and not cleared during the epilog.
    Whatever memory contents were there before allocation, it becomes the local variable
    values, the so-called garbage values.


