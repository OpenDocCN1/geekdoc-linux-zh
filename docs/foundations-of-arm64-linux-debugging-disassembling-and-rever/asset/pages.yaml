- img_proc: true
  md: '# CHAPTER 12 MORE INSTRUCTIONS


    The CPU fetches instructions sequentially, so we must tell the CPU that we want
    to skip some instructions if some condition is (not) met, for example, if a !=
    0.


    B.NE (jump if not zero) and B.EQ (jump if zero) test the Z flag and change PC
    if the Z bit is cleared for B.NE or set for B.EQ. The following assembly language
    code is equivalent to the preceding C/C++ code:


    ```

    ADR X0, A               ADR X0, A

    LDR X1, [X0]            LDR X1, [X0]

    CMP X1, #0              TST X1, X1

    B.NE label1             B.EQ label1

    ADD X0, X0, #1          ADD X0, X0, #1

    B label2                B label2

    label1: SUB X0, X0, #1 label1: SUB X0, X0, #1

    label2: STR X1, [X0]    label2: STR X1, [X0]

    ```


    # Function Return Value


    Many functions return values via the X0 register. For example:


    ```

    long func();

    ```


    The return value is in X0.


    ```

    bool func();

    ```


    The return value is in W0.


    Bool values occupy one byte in memory, so the compiler uses W0 instead of X0.


    151'
