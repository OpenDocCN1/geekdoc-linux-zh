    So far, we have encountered these registers:


    +   * X0/W0 (among its specific uses are to contain function return values)

    * X1/W1-X29/W29

    * XZR/WZR (X31, zero register)

    * LR (X30, Link Register, stores the return address)

    * PC (Instruction Pointer, points to the next instruction to be executed)

    * SP (Stack Pointer, points to the top of the stack)


    We come to the next important register on Linux platforms called Base Pointer
    or sometimes as Stack Frame Pointer register. It is X29, and it is used for stack
    reconstruction.


    # Addressing Array Elements


    We can also consider stack memory as an array of memory cells, and any general-purpose
    register can be used to address stack memory elements in the way shown in Figure
    10-1, where it slides into the frame of stack memory called a stack frame. The
    first diagram depicts 64-bit (doubleword) memory cells, and the second depicts
    32-bit (word) memory cells. Offsets for addresses are in hexadecimal, but for
    accessing values, offsets are in decimal, like we usually see in GDB disassembly.'
