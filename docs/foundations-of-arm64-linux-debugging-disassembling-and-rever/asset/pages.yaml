  md: '# CHAPTER 7


    # Logical Instructions and PC


    # Instruction Format


    We have seen that most language instructions have a uniform format, for example:


    +   Opcode operand

    Opcode destination_operand, source_operand

    Opcode destination_operand, source_operand1, source_operand2


    > STR-family of instructions have this format:

    Opcode source_operand, destination_operand


    Operands can be registers (reg), memory labels (mem), or some numbers, called
    immediate values (imm). Typical notational examples:


    ```

    add reg, reg, reg

    add reg, reg, imm

    mov reg, imm

    adr reg, mem

    ldr reg, [reg]

    str reg, [reg]

    ```'
  merge: -1
  pgno: 100
- img_proc: true
  md: 'and some concrete assembly language examples:


    ```

    add w0, w1, w2

    str x0, [x1]

    adr x1, a

    ldr w4, [x8]

    mov w7, #2

    ```


    # Logical Shift Instructions


    In addition to arithmetic instructions, there are so-called logical shift instructions
    that just shift a bit string to the left or the right.


    Shift to the left:


    ```

    11111110 <- 11111111 ; shift by 1

    11110000 <- 11111110 ; shift by 3

    lsl regDst, regSrc, regShiftValue

    mov x0, #3

    lsl X2, X1, X0

    ```


    Shift to the right:


    ```

    01111111 <- 11111111 ; shift by 1

    00001111 <- 01111111 ; shift by 3

    lsr regDst, regSrc, regShiftValue

    mov x0, #3

    lsr X2, X1, X0

    ```


    # Logical Operations


    Here, we recall logical operations and corresponding truth tables. We abbreviate
    True as T and False as F.


    AND'
