  md: '# CHAPTER 4 POINTERS


    Recall that [X0] and [X1] mean contents of memory whose addresses (locations)
    are stored in X0 and X1 CPU registers. The preceding statement is equivalent to
    the following C or C++ language expression where “*” operator means to get memory
    contents pointed to by the pa or pb pointer (also called pointer dereference):


    ```

    *pb = *pb + *pb;

    ```


    In assembly language, we use the instruction ADD for the “+” operator, but we
    cannot use memory addresses in one step instruction:


    ```

    add [x1], [x0]      // invalid instruction

    ```


    We can use registers, and therefore, we need to employ two registers as temporary
    variables:


    ```

    RegisterA <- [X0]

    RegisterB <- [X1]

    RegisterC <- RegisterB + RegisterA

    [X1] <- RegisterC

    ```


    We cannot use W0 and W1 to hold values since they are contained in X0 and X1;
    the addresses would be overwritten, so we use W2, W3, and W4. In assembly language,
    we write this sequence of instructions:


    ```

    ldr w2, [x0]

    ldr w3, [x1]

    add w4, w3, w2

    str w4, [x1]

    ```


