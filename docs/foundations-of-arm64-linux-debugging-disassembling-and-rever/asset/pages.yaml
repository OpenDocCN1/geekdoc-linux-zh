  md: "# CMP – Compare Two Operands\n\n```\nCMP reg, reg\nCMP reg, #imm\n```\n\nExamples:\n\
    \nCMP X1, #0\n\nSuppose X1 contains 0:\n\n0 - 0 == 0 (Z is set)\n\nCMP W0, #0x16\n\
    \nSuppose W0 contains 4<sub>hex</sub>:\n\n```\n4<sub>hex} - 16<sub>hex} = FFFFFFE<sub>hex}\
    \ != 0 (Z is cleared)\n4<sub>dec} - 22<sub>dec} = -18<sub>dec}\n```\n\nHere is\
    \ the CMP instruction in pseudo-code (details not relevant to the Z bit are omitted):\n\
    \n```\nTEMP <- OPERAND1 - OPERAND2\nIF TEMP = 0 THEN\n    Z <- 1\nELSE\n    Z\
    \ <- 0\n```"
