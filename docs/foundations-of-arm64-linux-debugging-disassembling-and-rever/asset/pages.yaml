- img_proc: true
  md: '# CHAPTER 7 LOGICAL INSTRUCTIONS AND PC


    1 and 1 = 1 T and T = T

    1 and 0 = 0 T and F = F

    0 and 1 = 0 F and T = F

    0 and 0 = 0 F and F = F


    # OR


    1 or 1 = 1 T or T = T

    1 or 0 = 1 T or F = T

    0 or 1 = 1 F or T = T

    0 or 0 = 0 F or F = F


    # Zeroing Memory or Registers


    There are several ways to put a zero value into a register or a memory location:


    +   1. Move a value to a register:


    mov x0, #0

    mov w1, #0


    +   2. Use the XOR (Exclusive OR) logical operation:


    eor regDst, regSrc1, regSrc2

    eor x0, x0, x0


    # XOR


    1 xor 1 = 0 T xor T = F

    1 xor 0 = 1 T xor F = T

    0 xor 1 = 1 F xor T = T

    0 xor 0 = 0 F xor F = F'
