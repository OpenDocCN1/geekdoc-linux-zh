    **Figure 9-7.** Example memory and register layout for BL/BRL and RET instruction
    execution


    We see that the BRL instruction saves the current value of PC to LR and changes
    PC to another memory address. Then the program execution continues from the new
    location. The RET instruction restores the saved PC value from LR to the PC register.
    Then the program execution resumes at the memory location after the BRL instruction.
    If you need nested calls, you need to save the current LR on the stack manually.


