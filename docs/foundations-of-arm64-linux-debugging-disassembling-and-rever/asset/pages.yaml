  md: "# Function Prolog\n\nThe sequence of instructions resulting in the initialization\
    \ of the SP register, saving X29/LR (if there are further calls inside), and making\
    \ room for local variables is called the function prolog. One example of it is\
    \ Figure 10-3, where func calls func2, which has one local variable. Sometimes,\
    \ saving necessary registers is also considered as part of a function prolog.\n\
    \n```\nfunc() { func2(); }\n\nfunc2() { long var; call func3(); }\n    bl func2\n\
    \    stp x29, x30, [sp.-#32]\n    mov x29, sp\n```\n\n| | | SP | X29 |\n|---|---|---||\n\
    | 0 | | |\n| 0 | | X30 (LR) |\n| 0 | | 0 |\n| 0 | | 0 |\n| 0x10001000 | 0x10001000\
    \ | 0x10001000 |\n\n**Figure 10-3.** Example memory layout for function prolog\n\
    \n# Raw Stack (No Local Variables and Function Parameters)\n\nNow we can understand\
    \ additional data that appears on the raw stack together with function return\
    \ addresses that we saw in Chapter 9 project \"SimpleStack\":"
