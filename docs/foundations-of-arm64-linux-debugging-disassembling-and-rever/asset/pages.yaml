    # # Function Epilogue


    Before the function code returns to the caller, it must restore the previous values
    of X29 and X30 (LR) registers to allow the caller to resume its execution from
    the correct address, previously saved in LR, and continue addressing its stack
    frame properly. This sequence of instructions is called the function epilog, and
    it is shown in Figure 10-4.


    ![](img/75ad7b091e3ad3da1f54f0b706f6bf2e_139_0.png)


    **Figure 10-4.** Example memory layout for function epilog'
