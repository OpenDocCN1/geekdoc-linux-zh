    # Numbers and Their Representations


    Imagine a herder in ancient times trying to count his sheep. He has a certain
    number of stones (twelve):


    ![](img/75ad7b091e3ad3da1f54f0b706f6bf2e_41_0.png)


    However, he can only count up to three and arranges the total into groups of three:


