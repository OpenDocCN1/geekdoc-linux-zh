  md: 'What happened to all our assembly code in this executable? This code seems
    to be directly placing the end result into “a” and “b” memory cells if we observe.
    Why is this happening? The answer lies in compiler optimization. When the code
    is compiled in optimization mode, the compiler can calculate the final result
    from the simple C/C++ source code itself and generate only the necessary code
    to update corresponding memory locations.


