    # # Application Memory Simplified


    When an executable file is loaded into memory, its header and sections are mapped
    to memory pages. Some data and code are copied unmodified, but some data is initialized
    and expanded. The first stack is also created at this stage. The PC register is
    set to point to the first program instruction, and SP points to the top of the
    stack. This simplified process is shown in Figure 9-4.'
