  md: '# CHAPTER 10


    # Frame Pointer and Local Variables


    # Stack Usage


    In addition to storage for return addresses, a stack is used to pass additional
    parameters to functions (if you have more than eight parameters) and store local
    variables. The stack is also used to save and restore values held in registers
    when we want to preserve them during some computation or across function calls.
    For example, suppose we want to call some function, but at the same time, we have
    valuable data in registers X0 and X1. The function code may overwrite X0 and X1
    values, we temporarily save their current values on the stack:


    ```

    mov x0, #10

    mov x1, #20

    ...

    ...\ // now we want to preserve

    X0 and X1

    stp x0, x1, [sp, #-16]! // store the pair at once

    bl func

    ldp x0, x1, [sp], #16 // restore the pair at once

    ```'
