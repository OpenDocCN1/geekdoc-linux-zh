    # Stack Push Implementation


    Push is implemented via these instructions:


    ```

    str x0, [sp, #-16]! // sp <- sp - 16

    stp x0, x1, [sp, #-16]! // [sp] <- sp - 16

    // [sp] <- x0

    // [sp+8] <- x1

    ```


    # Stack Pop Implementation


    Pop is implemented via these instructions:


    ```

    ldr x0, [sp], #16 // x0 <- [sp]

    // sp <- sp + 16

    ldp x0, x1, [sp] #16 // x0 <- [sp]

    // x1 <- [sp+8]

    // sp <- sp + 16

    ```


