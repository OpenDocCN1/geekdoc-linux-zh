- img_proc: true
  md: 'The last picture is a representation (a kind of notation) of the number of
    stones. We have one group of three groups of three stones plus a separate group
    of three stones. If the could count up to ten, we would see a different representation
    of the same number of stones. We would have one group of ten stones and another
    group of two stones.


    # # Decimal Representation (Base Ten)


    Let''s see how twelve stones are represented in arithmetic notation if we can
    count up to ten. We have one group of ten numbers plus two:


    $12_{dec} = 1 * 10 + 2$ or $1 * 10^{1} + 2 * 10^{0}$


