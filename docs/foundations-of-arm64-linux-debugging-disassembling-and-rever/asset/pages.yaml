  md: '# “Arithmetic” Project: A Computer Program


    We can think of a computer program as a sequence of instructions for the manipulation
    of contents of memory cells and registers. For example, addition operation: adds
    the contents of memory cell N#12 to the contents of memory cell N#14. In our pseudo-code,
    we can write


    ```

    [14] <- [14] + [12]

    ```


    Our first program in pseudo-code is shown on the left of the table:


    ```

    [a] <- -

    [b] <- 1

    [b] <- [b] + [a]

    [a] <- [a] + 1

    [b] <- [a] * [a]

    ```


    “-" moving (assigning) the new value to the contents of a memory location (address).
    "// is a comment sign, and the rest of the line is a comment. "=" shows the current
    value at a memory location (address).

    To remind, a code written in a high-level programming language is translated to
    a machine language by a compiler. However, if its digital codes are represented
    in some mnemonic system called assembly language. For example, ADD X1, X1, #1
    is increment by one of what is stored in the register memory cell X1.


    # “Arithmetic” Project: Assigning Numbers to Memory Locations


    We remind that “a” means the location (address) of the memory cell, and it is
    also the name of the location (address) 0000000004b2b00 (see Figure 1-3). [a]
    means the contents (number) stored at the address “a”.'
  merge: -1
