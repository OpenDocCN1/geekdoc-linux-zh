    # Calls


    We discuss two essential instructions that make the implementation of C and C++
    function calls. They are called BL/BRL and RET. The return address is saved in
    the so-called Link Register (LR, X30). Figure 9-7 shows instructions in memory
    and corresponding values of PC and LR registers.'
