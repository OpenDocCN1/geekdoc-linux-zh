  md: '# CHAPTER 12


    # More Instructions


    # PSTATE Flags


    In addition to registers, the CPU also contains a 32-bit PSTATE where four individual
    bits N, Z, C, and V (Figure 12-1) are set or cleared in response to arithmetic
    and other operations. Separate machine instructions can manipulate some bit values,
    and their values affect code execution.


    ![](img/75ad7b091e3ad3da1f54f0b706f6bf2e_156_0.png)


    These flags have their own special register NZCV.


    # Testing for o


    The Z bit in the NZCV register is set to one if the instruction result is zero
    and cleared otherwise. This bit is affected by


    +   - Arithmetic instructions with the S suffix (e.g., ADDS, SUBS, MULS)'
  merge: -1
  pgno: 156
- img_proc: true
  md: '# TST – Logical Compare


    This instruction computes bitwise logical AND between both operands and sets flags
    (including Z) according to the computed result (which is discarded):


    ```

    TST reg, reg

    TST reg, #imm

    ```


    Examples:


    ```

    TST X0, #4

    ```


    Suppose the X0 register contains 4 (100bin):


    ```

    100bin AND 100bin = 100bin != 0 (Z is cleared)

    ```


    ```

    TST W1, #1

    ```


    Suppose W1 contains 0 (0bin):


    ```

    0bin AND 1bin = 0bin == 0 (Z is set)

    ```


    Here is the TST instruction in pseudo-code (details not relevant to the Z bit
    are omitted):


    ```

    TEMP <- OPERAND1 AND OPERAND2

    IF TEMP = 0 THEN

    Z <- 1

    ELSE

    Z <- 0

    ```'
  merge: -1
