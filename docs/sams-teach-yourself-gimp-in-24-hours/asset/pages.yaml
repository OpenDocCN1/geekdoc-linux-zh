    # Other Color Options


    Many color options are available by right-clicking the image and going to Image,
    Color. I''ll introduce some of them briefly here.


    # Equalize


    The Equalize function tries to adjust and correct images that are too washed out
    or too dark. It is done by setting the darkest pixels to black and the lightest
    ones to white and adjusting everything in between (see Figure 7.12). Sometimes
    this actually works. Of course, if you''re like me, you might find this function
    more useful as a graphic filter than a photo repair tool. Sometimes, it can give
    your image that certain look that''s right...even if it is a bit of odd.


    # FIGURE 7.12


    Equalize can correct photos or simply add a strange effect to your images.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_109_1.png)'
  merge: -1
  pgno: 109
- img_proc: true
  md: '# Working with Color


    # Posterize


    Posterize reduces the color depth of your image—but in a different way than normal
    indexing does. It does by using a number called the Posterize level. This level
    determines the number of colors used—the lower level, the lower number of colors
    used. It’s a fun function to play with (see Figure 7.13).


    FIGURE 7.13


    The posterize function reduces the quality of your image; used sparingly, it can
    be a cool effect in and of itself.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_110_0.png)


    # Threshold


    This dialog box, shown in Figure 7.14, shows a graphical representation of the
    amount of brightness within an image. Each line from left to right represents
    a certain brightness value. The higher the value, the more pixels there are with
    that particular level of brightness. You can select a range of lines within the
    dialog box and watch what happens. Only pixels with a brightness value within
    the selected range will show through. Pixels within the range of selected values
    are turned completely white, whereas values outside the range are turned black.
    Used within a relatively large selection area, this can increase the contrast,
    intensity, and, subsequently, the quality of those slightly faded images.


    # Color Balance


    By Color Balance, you can alter the colors of your entire image by affecting your
    pixels towards the values represented at the end of the sliders (see Figure 7.15).
    The Preserve Luminosity option keeps your image from changing its brightness,
    which otherwise tends to happen with this tool.'
  merge: -1
  pgno: 110
- img_proc: true
  md: '# FIGURE 7.14


    Threshold lets you display portions of your image according to brightness.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_111_0.png)


    # FIGURE 7.15


    The Color Balance dialog box where you can quickly adjust color in your image
