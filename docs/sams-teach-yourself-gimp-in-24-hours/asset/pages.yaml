- img_proc: true
  md: '56 Hour 5


    +   * Fuzzy Select

    * Bézier Select

    * Intelligent Scissors


    # # The Selection Tool Icons


    The first six tools in the toolbox, as shown in Figure 5.1, are the selection
    tools.


    FIGURE 5.1

    Familiarize yourself with these important tools. Rectangle/Square-Ellipse/Circle-Lasso/Free
    Select Fuzzy Select (Magic Wand)-Intelligent Scissors Bézier Select


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_71_0.png)


    # # Tool Options


    Before you start selections, spend a few minutes going over the options that are
    available for the different kinds of selections. Bring up the options window for
    each of the six tools to acquaint yourself with the choices offered by each (see
    Figure 5.2).


    FIGURE 5.2

    Each tool has an options box.


    > With all tools in the toolbox, there are two ways to bring up the options windows.
    You can either double-click the icon of the tool you want to use, or you can go
    to the top of the toolbox window, and click File, Dialogs, Toolbox options, and
    the options window will automatically show for any tool you click on.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_71_1.png)


    # # Setting the Basic Options


    Antialas and Feather are two basic options available for all the tools, with the
    exception of the Rectangle/Square tool, which has no antialiasing option.'
  merge: -1
  pgno: 71
- img_proc: true
  md: '# Working on Selections


    # # Antialias Is Your Friend


    **Antialasing** is an effect used to produce a smooth-edged selection by filling
    in pixels just along the edge of the selection with similar colors, thereby blending
    it in with de-jacent colors. If antialasing is not used, a selection might tend
    to appear jagged around the edges, especially along curves. This is a condition
    commonly known among graphic artists as the *jaggies*. By using the Antialias
    option, you will end up with a much softer and smoother appearance to your selection
    edges, as shown in Figure 5.3 (which has been magnified somewhat to enable you
    to see the difference).


    # ### FIGURE 5.3


    Compare the difference in the edges of these two filled selections; one is antialased,
    and the other is not.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_72_0.png)


    # ## Feather Effects


    The Feathering produces an even smoother transition between the selection and
    the surrounding area. It works by fading the pixels into the background along
    the edge by a chosen amount, called the *feather radius*. You control the feather
    radius by a slider in the Tool Options window. The higher you set the slider (0–100),
    the further the pixels of your selection will feather out and blend in. This is
    an invaluable effect, particularly when working with photo manipulations.


    # ## Sample Merged


    This option is only available when using the Fuzzy Select tool. When activated,
    this option causes the selection to be based on the composite image created by
    all layers, instead of the contents of the current layer alone. (This will be
    easier to understand when you get to Hours 8, “Introduction to Layers,” and and
    9, “Hands-on Layering.”)'
  merge: -1
  pgno: 72
- img_proc: true
  md: '# Viewing a Selection


    When a selection is made, it is identified as such by a border of flashing black-and-white
    dashes in most graphics programs as a *marquee*. In the GIMP, this flashing border
    is also referred to as *marching ants*, but I will keep things simple and refer
    to it as the marquee. After it is selected, the area within the marquee is now
    the only part of the image that is *active*, meaning that it is the only part
    of the image that will be affected by the administration of tools or applications.


    Sometimes the flashing marquee can be in the way when trying to view changes in
    your image. However, once you''ve made your selection, you can use an option *Toggle*
    to turn the marquee on or off while keeping the selection intact. Just right-click
    anywhere on the image and select File, Select, Toggle. Repeat to reverse the action.
    You can also toggle the marquee on and off by pressing Ctrl+T on your keyboard.
    When you use the toggle, just remember your selection is still active, even though
    you cannot see the marquee.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_73_0.png)


    # Making a Selection


    Get started by making a simple selection with the Rectangle/Square tool.


    +   1. Open a new image (size doesn’t matter at this point, but make it a large
    enough area to work in easily).

    2. Activate the Rectangle tool by clicking the icon.

    3. Place the mouse cursor at the corner of the area you want to select.

    4. Left-click, and while holding down the button, drag across the image in the
    direction you want to select it. As you move the mouse, you''ll see a line appearing,
    where the border of your selection will be.

    5. When you release the button, the marquee will indicate your selected area,
    as shown in Figure 5.4.


    FIGURE 5.4

    A simple rectangular selection.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_73_1.png)'
  merge: -1
  pgno: 73
- img_proc: true
  md: '# Extra Selections


    If you need to have more than one selected area in the same image, you can do
    this in a couple of easy steps:


    +   1. Make the first selection and release the mouse button to show your marquee.

    2. Press and hold the Shift key while making the additional selection.


    As long as the selections do not touch one another or overlap, they will become
    individual selections within the image (see Figure 5.5).


    Figure 5.5


    You can have many selected areas in one image.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_74_0.png)


    # Adding to a Selection


    Sometimes you might want to attach additional sections to a selected area to create
    a unique shape. This is also easily achieve, Just follow the steps you used to
    create an extra selection, but this time, you''ll want to touch or overlap the
    two sections, and as you release the mouse button, they will then become one single
    selection, as in Figure 5.6.


    Figure 5.6


    Two selections can be merged into one.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_74_1.png)'
  merge: -1
  pgno: 74
- img_proc: true
  md: '# # Subtracting from a Selection


    In a similar way, you can use the Ctrl key to subtract an area from a selection.


    +   1. Make an active selection; try another rectangle.

    2. For the next step, do something a little different and switch over to the Ellipse
    tool by clicking the Ellipse icon in the toolbox.

    3. Now press and hold the Ctrl key while you drag over the area you deleted from
    your active selection. As you release the mouse button this time, you will see,
    as in Figure 5.7, that the area where the ellipse overlapped the rectangle has
    been subtracted from that selection.


    **FIGURE 5.7**

    The ellipse area has been removed from the rectangle.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_75_0.png)


    # # Intersecting the Selections


    By using the Shift and Ctrl keys together, you can choose the intersection (the
    overlapping region) of two areas as your active selection.


    +   1. Make a selection.

    2. Press and hold Shift and Ctrl at the same time and drag as if you were making
    an addition to a selection, but notice where the two areas overlap. When you release
    the mouse button, the overlapping region will become the only active selection
    (see Figure 5.8).


    **FIGURE 5.8**

    The intersection of a rectangle and ellipse becomes the selected area.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_75_1.png)'
  merge: -1
  pgno: 75
- img_proc: true
  md: '# Working on Selections


    # Deactivating a Selection


    An active selection can be deactivated in three ways. You can begin making a new
    selection, and the first one will disappear automatically. Another way to deactivate
    is to left-click on your image while in the Rectangle/Square tool mode, Ellipse/Circle
    tool mode, or Lasso tool mode. The third method is to right-click on your image
    to bring up the menu options, and then Select, None.


    # Shape Tool Extras


    Specifically, the shape tools are the Rectangle/Square and Ellipse/Circle tools,
    because they are the only tools limited to forming those shapes. However, you
    have already learned by using the Shift and Ctrl keys to add, subtract, and so
    on, you can use the shape tools to make a variety of uniquely shaped selections.
    There are also a few extra tricks that you can play with the Shift and Ctrl keys,
    giving them dual functionality when used in combination with the shape tools.


    +   1. You can achieve geometrically perfect squares and circles by keeping the
    Shift key held down as you make the selection.

    2. Pressing and holding Shift and Ctrl together while selecting will cause your
    perfect squares and circles to begin at the point where you place the cursor and
    radiate out from there, rather than starting at the center.

    3. Holding only the Ctrl key as will make rectangles and ellipses also form from
    the center of the shape, rather than from the corner.


    You''ll notice that when working with the shape tools, the dual functionality
    of the Shift and Ctrl actions can conflict with one another in certain circumstances.
    Luckily, you can separate these actions or combine them in different ways by a
    well-timed release.


    For instance, let''s say you want to make a selection, and then add an addition
    to it (requiring the use of the Shift key). But, the addition you want to make
    is an ellipse, and because you''re holding down the Shift key, it makes a perfect
    circle. What you have to do in this situation is to set one action and release
    the key before you begin the next action. For example


    +   1. Make an active selection in a shape of your choice.

    2. Press and hold the Shift key. The *pressing* of the Shift key has told the
    GIMP you want to make an additional selection.

    3. Left-click the mouse button and hold.

    4. Release only the Shift key, but continue holding the mouse button as you drag
    in your additional selection. The release of the Shift key before actually forming
    the added selection freed it from having to make only perfect circles or squares.'
  merge: -1
  pgno: 76
- img_proc: true
  md: 'The difference in the timing of the Shift and Ctrl keys can also permit two
    actions to be mingled in the same selection. For example


    +   1. This time, let''s say you want to subtract from the first selection (requiring
    the use of the Ctrl key), but you want to do it with a perfect circle (requiring
    the Shift key). You would follow these steps:

    2. Make your first selection as normal.

    3. Press and hold the Ctrl key and left-click and hold the mouse button. The pressing
    of Ctrl has told GIMP what to subtract with the next selection.

    4. Now release the Ctrl key while still holding the mouse button. The release
    of Ctrl freed you to make another choice.

    5. While still holding the mouse button down, you can now use the Shift key to
    form the perfect circle.


    It might seem a little confusing at first, but after you''ve worked with these
    functions couple of times, it will begin to make sense and you''ll see how easy
    it really is!


    # Lasso Selections


    To make a lasso, or freehand selection, activate the Lasso tool, and place your
    cursor at the point where you''d like the selection to begin. Now left-click and
    drag, as you move your cursor you will notice a line forming your shape. After
    you have the desired selected area and you''re back at the starting point, release
    your mouse button and you''ll see the marker designating your selection. If you
    release the mouse button before you get back to your starting point, the Lasso
    tool will automatically close the ends of your selection with a straight line
    between the two points. You can add, subtract, and intersect lasso selections
    using the same methods you learned with the shape tools.


    # Fuzzy Select


    This tool is similar to the Magic Wand tool, which is familiar in most graphics
    programs. It is unique in comparison to the other selection tools in that it makes
    selections based on color value. It''s a handy tool for making selections that
    are essentially one color, such as selecting a background out of a picture. All
    you have to do is click on a pixel in the color you selected and adjacent pixels
    that are the same color are included in the selection area. If you want your selection
    area to expand, including several colors, click and drag the cursor over all the
    colors you want to incorporate, and the adjacent pixels of all colors will be
    included. By using your Shift and Ctrl methods along with the Fuzzy tool to add
    or subtract areas of color, you can quickly modify a selection to the color specifications
    you like.'
  merge: -1
  pgno: 77
- img_proc: true
  md: '# The Bézier Tool


    This gadget, although probably the most challenging to learn of the six selection
    tools, can be remarkably useful once you master it.


    It works by the placement of a number of points which, when clicked on by turn,
    develop two handles that are then used to manipulate the shape. By moving the
    handles, you can form curves and angles of what began as a series of straight
    lines.


    The Bézier tool can be a lot of fun to play with, and that''s probably the best
    way to learn to use it, so you can jump right in with this one.


    +   - Create a new image large enough to work in comfortably.

    - Activate the Bézier tool by clicking the icon in the toolbox.

    - Place your cursor over the area where you want your selection to begin, and
    click once to create a starting point.

    - Move your cursor over a little and click again. You will notice you have added
    another point, connected to the first by a straight line. Repeat the moving and
    clicking until you''ve made a basic shape consisting of the straight lines. Connect
    back to your starting point by clicking your ending point into it.

    - You will now have a selection area that resembles a connect-the-dots picture,
    as Figure 5.9.


    FIGURE 5.9


    A Bézier selection in the first stages.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_78_0.png)


    And the fun begins. Let''s make some curves...


    Click on any point and you will see an additional line curve. This new line consists
    of your point in the center (marked by a small circle), and a tiny square at each
    end. These are your handles, as in the lower-right corner of Figure 5.10. By manipulating
    them in different directions, you''ll see that they give your selection line the
    capability to form a curve. It will probably seem awkward at first, but you''ll
    get the feel of maneuvering curves as you go.'
  merge: -1
  pgno: 78
- img_proc: true
  md: '# FIGURE 5.10


    The handles appear when the point is clicked on.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_79_0.png)


    Click on each point in turn and practice making curves so that you really get
    the hang of it. Try pulling your handles out longer and notice the difference
    the change makes in respect to your curves. Now try shortening the handles, and
    you''ll notice your curve gets sharper. To make an angle, you will need to press
    the Shift key while clicking your point. This enables the handles to be manipulated
    separately, giving you the control necessary to form very sharp curves and turns.


    > If you''re not happy with the placement of your points, you can easily move
    them by pressing the Ctrl key while dragging a point to a better position.


    # Setting as a Selection


    You will probably notice that you are not seeing the marquee while you are creating
    lines with either the Bézier or the Intelligent Scissors tool. When using these
    tools, you will wait until you are ready for your outline to become a selection.
    By clicking anywhere inside the outlined area, the area will be converted to a
    selection, and you will be able to see your marquee, as in Figure 5.11.


    > When clicking on your points to either manipulate or move them, you must be
    careful not to accidentally click inside the selection area and set it prematurely.'
  merge: -1
  pgno: 79
- img_proc: true
  md: '# Working on Selections


    FIGURE 5.11


    The first Bézier selection completion. What a difference a few curves can make.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_80_0.png)


    # Putting the Bézier to Work


    Now that you''ve experienced the possibilities for using the Bézier to create
    new selections, you have probably already come to the realization that the ability
    to form anomalous shapes also provides the Bézier tool with an excellent capability
    to select objects from images you already have.


    +   1. Find a picture that contains a complex shape you''d like to isolate, as
    in Figure 5.12.

    2. Begin by clicking around the desired area to form your points. Stay fairly
    close to the edges seem to be covering parts of your selection, but at this time,
    don''t worry if the straight lines seem to move points if you need to. All you
    are trying to achieve this with is a rough draft of the desired selection area.


    FIGURE 5.12


    Click the points around the desired area.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_80_1.png)'
  merge: -1
  pgno: 80
- img_proc: true
  md: '66


    Hour 5


    3. Now you can begin clicking on your points and maneuvering your Bézier curves
    until you have the desired area selected to your satisfaction (see Figure 5.13).
    Pretty amazing, don''t you?


    # FIGURE 5.13


    Practicing curves on an inter-esting shape can quickly enhance your abilities.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_81_0.png)


    > If you''ve mastered the technique of working with curves, try this for an even
    quicker way to select an area with the Bézier tool:

    Place your first point in the desired location, but this time, instead of just
    clicking in the next points, try dragging and clicking. When you do it way, each
    successive point you click will have the handles ready to mani-ulate as you go,
    selecting on-the-fly, so to speak.


    # Intelligent Scissors


    This tool has a mind of its own (hence the name intelligent). It works by analyzing
    the colors of the pixels along the line formed as you select, and then snapping
    to an edge around the pixels that do not fall into the same color values. It is
    mostly used for outlining-ing areas of color that contain an edge which has enough
    difference in color value from the surrounding areas that the tool can differentiate
    between the two.


    +   1. Find a picture that has a nice area of contrast.

    2. Begin your selection with this tool by dragging your cursor around the area
    you want to select, just as you would the Lasso tool. Try to get as close as you
    to the desired area.

    3. When you release the mouse button, you''ll see the Intelligent Scissors leap
    into action and try to find the edges that differ greatly in color value.'
  merge: -1
  pgno: 81
- img_proc: true
  md: '# Working on Selections


    # Intelligent Scissors Options


    In addition to Antialias and Feather tools, the Intelligent Scissors tool has
    a few extra options that are not included with the other tools.


    # Edge-Detect Threshold


    This is basically a tolerance control in which you can set the amount of tolerance
    you want the Scissors tool to have as far as including color value while it tries
    to find an edge. Setting a high tolerance will allow more similar colors to be
    included along the line of the selection area while the tool tries to detect a
    good edge with enough difference to isolate.


    # Elasticity


    Elasticity controls how elastic or flexible the tool will be when it detect an
    edge. If you have the elasticity set too low, the tool cannot snap into place
    as it needs, because you haven''t allowed enough room. If the elasticity is set
    too high and there are several different areas of color in your image, the tool
    might snap to a nearby color area that isn''t the one you have in mind.


    # Curve Resolution


    If you have a very curvy selection, the Curve Selection allows you to have some
    control in the way the tool forms the shape of the curves. A curve resolution
    setting tends to produce a jagged edge, while a higher setting results in a much
    smoother, even curve.


    # Convert to Bézier Curve


    This is self-explanatory. If you have made a selection with the Intelligent Scissors
    and feel it requires further modification to the edges, you can convert to a Bézier
    selection, and your line will form points all around. You can then move and manipulate
    those points to your satisfaction before making your selection active.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_82_0.png)


    > Although the Intelligent Scissors is suited to perform certain selection tasks,
    it is generally faster and easier to use one of the other selection tools, due
    to the amount of variables that have to be set to work properly together in the
    Intelligent Scissors options. Stable Intelligent Scissors were a late addition
    to GIMP version 1.0, and as such, they might not behave predictably and usefully.'
  merge: -1
  pgno: 82
- img_proc: true
  md: '# # The Selection Menu Options


    In addition to the options included with each individual tool, there are a number
    of available menu options for selections. Right-click on an open image to pull
    up a menu. Click Select, and you''ll see the following options:


    # Toggle


    This tool is discussed earlier in this hour; it toggles the marquee on and off,
    allowing you to view the selection area without the flashing if necessary.


    # Invert


    You will definitely want to remember when this option is. It has the capability
    to make some selection tasks much easier. In certain instances, it can be less
    troublesome to select the area that you don''t want, and then reverse that selection
    to include only the area that you do. For instance, if you have a complex image
    surrounded by a one-color background, you could use the Fuzzy Select tool to choose
    the background color as the selection, go to Select, Invert, and your complex
    image is now selected inverted.


    # All


    By combining All with a layer option called Keep Transparent, you can isolate
    image areas in a layer while leaving the transparent areas non-selected.


    # None


    Earlier you learned how to deactivate a selection by clicking outside the selection
    area. The Select None option will perform the same action; your marquee will be
    removed and the selection area deselected.


    # Float


    There are two basic types of selections, standard and floating. Standard means
    your selected area is still a part of your image or layer. If you modify a standard
    selection, you modify the selection area within your image. A floating selection
    floats or hovers over the image or layer, and you can move or modify it without
    affecting the original image. There are two ways you can deflate a selection,
    or cause it to merge with your image. One is by deactivating the selection, and
    the other is by using the Anchor function in the Layers dialog box.'
  merge: -1
  pgno: 83
- img_proc: true
  md: '# Feather


    It performs the same as the Feather in the tool options, the only difference being
    that it does not use a slider to control the feather radius, but rather the input
    of a numerical value.


    # Sharpen


    The Sharpen function gets rid of some of the outermost pixels along the edge of
    a feathered or antialased selection, leaving a slightly smaller and sharper-edged
    selection in it''s place—kind of the opposite of feathering.


    # Border


    By choosing this option, you can surround the selected area with a chosen number
    of pixels that then becomes the selected area—subject to all modifications such
    as color fill, and so on. This can be a convenient option to use if you want to
    transform a selection into a frame or an outline.


    # Grow and Shrink


    These options allow you to expand or contract the selected area by a chosen number
    of pixels.


    # Save to Channel


    By saving your selection in a channel, you are storing the selection''s shape
    in a grayscale form that you can reuse and use again in the form of a mask.


    # Select by Color


    This is similar to Fuzzy Select, but with more control. When this option is chosen,
    you''ll see another pop-up menu containing five choices. First *Replace*, which
    you will use when the Fuzzy Select tool, you want to click on a color to have
    it become the selection. The next three choices, *Add*, *Subtract*, and *Intersect*
    also work by letting you click the color to which you would like the option applied.
    Last, the *Fuzziness Threshold*, controlled by a numerical slider, lets you determine
    just how much tolerance toward other colors will be allowed when applying any
    of the previous options.


    # The Stroke


    Talk about features, and the Stroke has to be right up there in the top ten. This
    ingenious little option can transform the outline of your selection (the part
    that''s showing as the marquee) into a line drawing in one easy stroke, therefore,
    your selection tools'
  merge: -1
  pgno: 84
- img_proc: true
  md: '# Hour 5


    also become Drawing tools. By changing the brush settings, you can use it not
    only to make line drawings and outlines, but also to come up with some very interesting
    effects. Let me show you how it works.


    +   1. Open a blank image and create a selection area using a selection tool of
    your choice.

    2. The Stroke function will use the settings from the Brush dialog box, so you''ll
    need to bring up the dialog box (File, Dialogs, Brushes), and choose the options
    you''d like to see in the Stroke, such as brush size, mode, and so on.

    3. The color of the stroke will be the foreground color showing in your toolbox.

    4. Right-click your image to bring up the menu, and click Edit, Stroke. You''ve
    turned your selection into an outline, as shown in Figure 5.14.


    # Figure 5.14


    A thick stroke has been applied to our earlier selection from Figure 5.11.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_85_0.png)


    # Using Guides with Selections


    When you have an open image, you''ll see that there are two rulers in your image
    window—one just over the image and one to the left. Place the cursor on the top
    ruler, click and drag down. You''ll notice a colored, dotted line pulling over
    your image as you drag; this is a horizontal guide. Now click on the left ruler
    and drag to set your vertical guide. Guides are helpful when you need to place
    a selection in a precise location. You can use them in a couple of different ways:


    +   * Use guidelines as markers by placing in the desired location and manually
    moving your selections in line with them.

    * There is a Snap to Guides option in the View menu that pops up when you right-click
    your image. When the Snap to Guides is on, any selection that moved close to a
    guideline will then automatically snap into place alongside the line.'
  merge: -1
  pgno: 85
- img_proc: true
  md: '# Editing Selections


    This hour has been devoted entirely to creating selections, but I''d like to briefly
    introduce two of the editing functions that you will be using when working with
    selections.


    # Moving a Selection


    The Move tool, along with the transformation tools, will be covered in depth in
    the next hour, I will touch on the image here because it applies directly to selections.
    As soon as a selection is made, you''ll notice that when you hold the cursor over
    the selected area, the Move symbol shows up even though you haven''t activated
    the Move tool. This allows you to move your selection one time, changing it to
    a Floating selection. As you move it, you''ll see that the area is replaced by
    an area of solid color—the same as the background color in the toolbox. After
    it is a Floating selection, you must switch over to the Move mode if you want
    to move it again. Now your selection can be dragged anywhere in the image. However,
    when you switch to the Move mode, it will not move, but rather will allow you
    to make subsections that become active selections upon the deactivation of the
    original selection.


    You can move the outline of a selection (the marquee) without moving the contents
    by holding down the Alt key while dragging to the desired area.


    # Copying and Pasting Selections


    To open the Copy option, right-click on your image and select File, Copy. This
    places a copy of your selection in the Clipboard, leaving the original image intact.
    You can then paste the selection into another area of the same image, or into
    a different layer by selecting File, Paste.


    > If you are working on an image and have to stop, but do not want to lose your
    selection, be sure to save your image as an XCF extension. This will keep your
    selection area intact—marquee and all—for the next time you open the image, and
    it will preserve your layer information.'
  merge: -1
  pgno: 86
- img_proc: true
  md: '# Summary


    Proper selections are an essential element for effectual image editing.


    The mere act of being able to zero in on a targeted area of a larger image, whether
    to extract or manipulate it, can provide unlimited possibilities to your artistic
    endeavors. The ability to acquire the kind of selection necessary to achieve a
    desired result is truly a talent worth developing.


    At this time, you might be wondering just what you are going to do with the selections
    after you have them, but because I will be referring to selections throughout
    the book, I wanted you to gain a complete understanding of the varied selection
    processes offered in the GIMP.


    # Q&A


    +   - When should I set my options, before or after making a selection?

    - Tool options that you pull up with each individual selection tool must be before
    you begin your selection, but the Select options (the ones you see by right-clicking
    your image and choosing Select) can be applied after your selection is in place.

    - If I have an image with more than one selection, can I move the selections at
    a time?

    - No. Multiple selections within a single image will act in unison as if they
    were a single selection when applying any kind of transformation.


    # Exercise


    Find a picture of yourself or a friend. Practice using the various selection tools
    to isolate different parts of the picture, such as the hair only, and both eyes,
    and the lips. When trying to isolate small areas, you might want to use the Zoom
    tool. Just for fun, when you have a selection made, right-click the image, select
    Image, Colors, Hue-Saturation, and play around with the sliders. You might be
    surprised at what you''ll come up with!'
  merge: -1
  pgno: 87
- img_proc: true
  md: '![](img/1e2e1cd1a8efa63a199c864a651e3086_88_0.png)


    # HOUR 6


    # Transformations


    You made a good deal of progress by learning to isolate selected elements of images
    in Hour 5, “Working with Selections.” The next logical step is to delve into specifics
    about some of the great tools for editing images and selections—the transformation
    tools.


    To transform an image means to change or alter it in some way to give it a different
    appearance. Of course, you can alter your image in any number of ways, such as
    changing the color or applying a filter, as you will study in later hours. This
    hour, however, you will focus on transformations of a different sort, using the
    following tools and applications:


    +   * Move

    * Magnify

    * Crop

    * Transform

    * Flip'
