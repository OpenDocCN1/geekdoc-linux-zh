- img_proc: true
  md: 'You have many fractal designs to choose from, such as the Mandelbrot set, Julia,
    and many, others. They are available as option boxes near the bottom of the dialog
    box (under the Parameters tab).


    You will see a preview window to the left where the fractal resides. You can zoom
    in on any portion of the fractal by dragging your cursor into a rectangular area
    over the image. Clicking the Unzoom button will undo this action.


    To the right of the preview window, you will see many different variants that
    affect the composition of your fractal. I will not get into the mathematical implications
    of these sliders, but it suffices to say that by changing their values, you alter
    the fractal in new and unusual ways, by way of size, position, view perspective,
    and slider is important because it defines how complex and detailed your fractal
    will be, and in turn how it looks and how long it will take your machine to render
    it. Because a fractal is nothing more than a repeated pattern, the iterations
    variable determines how many times down your computer will draw the pattern. The
    maximum on this is 10,000, which is way more than you will need and unless you''re
    lucky to be running a nice Alpha, it is likely to take quite a while to render.
    (Thank goodness for that Cancel button!)


    If you click on the Fractals tab (refer to Figure 20.13), you will see a whole
    list of presets, some of which are truly amazing! I implore you to take some time
    and browse through them now.


    Neat, eh? Okay, now that you''ve done that, go ahead and click the Gradients tab.
    Here you can choose from a list of gradients taken from the Gradient editor, plus
    a few custom ones, to alter the coloring of the fractal in the preview window
    (see Figures 20.14). You are bound to stumble upon some neat effects this way,
    but remember that this activity alone can quickly away the hours, so be careful!
    Also, by clicking on the Colors tab (see Figure 20.15), you can alter the individual
    colors more precisely.


    If, after tinkering with the sliders in the first tab and with colors in the third,
    you happen to come up with a pattern that is just too cool, you can save it as
    a preset. Just click the Save button and let the plug-in do the rest (see Figure
    20.16).'
