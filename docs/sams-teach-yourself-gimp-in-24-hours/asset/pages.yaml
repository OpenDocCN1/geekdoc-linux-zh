- img_proc: true
  md: 'That''s right. Now scroll down the list of gradients until you come across
    one named Burning Transparency. Now you can see that one of the active gradient
    colors is transparent. You can use these gradients for nifty lighting effects.


    +   1. Start a blank image or use an already existing one if you like. Now make
    sure your favorite gradient is selected in the gradient editor.


    +   2. Now you''ve got that, you should select the option Custom (From Editor)
    in the Blend drop-down menu in the Tool Options box for the Gradient.


    +   3. Now draw your gradient. To make it more like a lighting effect and not
    overpower your image, you should set the opacity of the gradient no more than
    50% in the Tool Options box. This fades the gradient into your image with varying
    degrees of opacity.


    # FIGURE 7.29


    One of many custom gradients in action.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_119_0.png)


    +   4. You can now try it with different gradient schemes. For example, using
    the radial gradient from a source of light will give you a cool lens flare effect.
    Using the bilinear gradient gives an object more depth, and using the Shapeburst
    sometimes looks cool.


    # Summary


    Gradients can help you do a lot of really cool things. Now that you''ve had an
    introduction to them, I invite you to play around with them as much as you can.
    You will visit gradients again, especially in combination with the GIMP''s powerful
    layering capabilities, in later hours.


    As far as the color models go, the GIMP mainly uses RGB, HSV, Indexed, and Grayscale.
    However, if you do need the way to do a little impress, it is a good idea to understand
    CMYK so you''ll know the differences between print and digital media. Doing professional
    quality print and prepress with the GIMP is not terribly difficult with a little
    knowledge and preparation, and it''s covered in depth in Hour 24, “Using Peripherals
    with Linux."'
  merge: -1
