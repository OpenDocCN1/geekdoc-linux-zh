- img_proc: true
  md: '![](img/1e2e1cd1a8efa63a199c864a651e3086_136_0.png)


    # HOUR 9


    # Hands-on Layering


    Now that you''ve had a little glimpse at the power of layering, you probably have
    about a million or so great ideas popping into your head concerning ways you can
    use the techniques you just learned.


    Hold on though, there''s even more to this layering business! This hour you are
    going to look at combining the versatility of layering with the usefulness of
    blend modes.


    After you''ve gone over the blend modes in detail, you''ll spend some time doing
    step-by-step tutorials, and put a couple of the blend modes to practical use so
    that you will be able to see their functionality first.


    # Blend Modes


    Layer blend modes can basically be described as methods or various ways of combining
    pixels in an image or layer with the pixels in the images or layers underneath.


    The GIMP contains 15 blend mode options. Although blend modes are usually applied
    during layering operations, they are also available in the Brush Selection dialog
    box and can be applied directly to an image with any of the painting tools.'
  merge: -1
  pgno: 136
- img_proc: true
  md: 'To blend the blend modes, open either the Brush or Layers & Channels dialog
    box and click on the blend mode drop-down menu, as seen here in Figure 9.1. You
    must have an open layered image for the menu to function in the layer dialog box.


    # FIGURE 9.1


    The 15 blend modes are located in the drop-down menu.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_137_0.png)


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_137_1.png)


    > The drop-down menu in the Layer dialog box actually contains only 14 blend modes.
    The drop-down menu in the Brush dialog contains an extra mode called Behind, bringing
    the total number to 15.


    # Blend Modes Quick Reference Guide


    Let''s begin by examining the different modes with a brief description of each.


    +   1. *Normal*—All pixels on the selected layer completely covers the lower layers,
    and can only be blended by varying the opacity setting.

    2. *Dissolve*—This also requires a reduction in the opacity setting to see results.
    As the opacity is decreased, so is the number of visible pixels in the current
    layer, which results in a speckled appearance.

    3. *Multiply*—This works by multiplying color values in the selected layer with
    the colors in the lower layers to produce darker colors. To multiply means to
    increase, so think of it as increasing the depth of color. When working with blend
    modes, each color channel is treated as a value from 0-1. In the case of Multiply,
    for example, if you had two channels at .5 and .5, multiplying them would result
    in .25, a darker value, which is why Multiply makes images darker.

    4. *Screen*—This option produces lighter colors because they are combined by multiplying
    the inverse of blended colors. Think of it as multiply in reverse.

    5. *Overlay—This will combine the multiply and screen modes, depending on the
    color of the underlying layers. Lower color values get darker, whereas higher
    values get lighter.'
  merge: -1
  pgno: 137
- img_proc: true
  md: '# Hands-on Layering


    +   6. Difference—This compares the color values of all layers and subtracts any
    lighter values in the selected layer, showing the difference.


    +   7. Addition—This blends together the color values of all layers involved.


    +   8. Subtraction—Subtracts the selected layer''s color from the combined color
    of the underlying layers.


    +   9. Darken Only—Makes a comparison of color values in all layers and picks
    the darkest pixels of each.


    +   10. Lighten Only—Works much the same as Darken Only, except this one chooses
    the lightest pixels of each layer.


    +   11. Hue—Applies the hue of the selected layer to all layers.


    +   12. Saturation—Applies the saturation (color intensity) of the selected layer
    to all layers.


    +   13. Color—Works by applying the combined hue and saturation of the selected
    layer to all layers, will not affect the luminance, or brightness of the underlying
    layers.


    +   14. Value—Known as luminance or luminosity in other programs, this will blend
    the brightness of the selected layer with the hue and saturation of the underlying
    layers.


    +   15. Behind—This mode is only available in the Brush dialog box. It works by
    enabling you to paint on transparent areas while not affecting other image areas,
    seemingly painting behind these other areas.


    # Examples


    I will attempt to illustrate some of the modes here, but I have left out a few
    that would not illustrate well the grayscale constraints of this book.


    You can get a better idea of how the modes function by actually applying them
    in an image so you can see the changes, so let''s approach it from that angle.


    Open the cameo.jpg image from the tutorial section of the CD-ROM.


    Add a new transparent layer, and use the rectangle Select tool to select half
    of the picture from the middle out—as in Figure 9.2—and anchor the selection.
    By doing this way, you will be able to compare the original image with the results
    of the different blend modes.'
  merge: -1
  pgno: 138
- img_proc: true
  md: '# FIGURE 9.2


    By testing the blend modes on just part of an image, you will really see the effects.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_139_0.png)


    Pick a foreground color that you would like to see blended with the image in the
    varied modes. I used a medium purple (R=128,G=0,B=128) for my illustrations. Use
    the Bucket tool to fill the selected half of the image with your chosen color.


    Because you are in the default Normal blend mode, the color will fill the selected
    area, covering the lower layer area, as in Figure 9.3.


    # FIGURE 9.3


    In the Normal mode, the only way to blend layers is through the opacity setting.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_139_1.png)


    Now click on the drop-down menu for blend modes and switch over to Dissolve. You''ll
    have to adjust the opacity to see the changes brought about by this mode (see
    Figure 9.4).'
  merge: -1
