- img_proc: true
  md: '# Exiting the GIMP


    Exiting the GIMP is as straightforward as any application. You can either


    +   * Click on the Close button in your favorite Window Manager.

    * Or, Go to File, Quit on the Toolbox dialog box or right-click the image itself
    (Figure 2.11).


    FIGURE 2.11 Exiting the GIMP.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_43_0.png)


    If you have unfinished changes while exiting the GIMP, you will be asked if you
    want to exit the GIMP名叫, or cancel the exit in order to save your changes first.
    (This has saved me from a lot of mistakes times.)


    # Summary


    In this year, you became acquainted with the GIMP interface—getting around, finding
    files, and so forth. the GIMP interface can be a little tricky at first, but stick
    with this! It will make a whole more sense as you go along. In truth, the lack
    of readily visible menu items (remember right-clicking on the images?) in many
    applications can actually be great after you get used to it. Being graphic-centric
    in nature does make for a very space-efficient and logical approach—in my opinion,
    but, again, I am a little biased.


    # Q&A


    +   * Why doesn’t the GIMP support ______ format?


    +   * If the format is indeed popular enough, chances are, it will be. The great
    thing about GIMP is that you don’t have to wait for a newer version to be released
    in order to take advantage of new features. The GIMP does this by incorporating
    plug-ins. So far, however, the GIMP supports those formats that 99 percent of
    us ever really care to use.'
