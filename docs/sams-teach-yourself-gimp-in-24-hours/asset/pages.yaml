  md: '# Introduction


    Because you''re undoubtedly wondering by now, GIMP is an acronym for GNU Image
    Manipulation Program. And it''s more than just its name that sets this application
    apart from the norm. The GIMP itself is a tremendously sophisticated and powerful
    image editing program written for UNIX and the X Window environment. It is used
    for editing and creating digital graphics, and is similar in finding and to Adobe
    Photoshop, Corel Draw, Paint Shop Pro, and other applications, with the added
    benefit that it happens to be free, and it runs on the world''s greatest PC operating
    system, Linux. Furthermore, its modular design allows for the continual addition
    of functionality—it will never become an abandoned project. It has unequivocally
    fantastic laundry list of features that tend to make even the most hardened hacker
    puzzle and delight at just how incredibly functional and polished GIMP really
    is. It is utilitarian, fast, feature-laden, stable, expandable, and is possibly
    the greatest thing since sliced bread (and the Linux kernel). In short, to be
    prepared and amazed!


    # A Little Background


    The GIMP began in 1995 as a small class project by two students at the University
    of California, Berkeley: Peter Mathis and Spencer Kimball. It was released under
    the GNU GPL (General Public License), and, due to the contributions of many coders
    and thousands of testers, has subsequently evolved beyond a simple compiler project
    into the fully-fledged-graphics suite it is today. GIMP is a relatively young
    program, now developing into maturity, and now that it has arrived, its development
    is occurring at an increasingly accelerated rate. In, by the time this book hits
    the presses, there will likely be new features, additional functionality, and
    perhaps an entirely updated version of the GIMP available for download from FTP
    sites around the globe. Welcome to the wonderful world of Open Source! (May the
    source be with you!)


    The most important aspect of the GIMP is not necessarily its power or utility
    as a application (although that is, of course, what you want and expect from well-coded
    software), but that it is in free software—released under the GPL as defined by
    the Free Software Foundation. This means that it is not merely in terms of free
    cost, but also in the sense of freedom—end users are liberty to alter and distribute
    the source code as they fit. This is because the GNU GPL ensures that the source
    code of the application is always freely available, without restriction, to anyone
    with the inclination to take a peek. This adds tremendous momentum to the development
    of software projects such as Linux, the many FSF projects, Apache, KDE, GNOME,
    Mozilla, and the'
  merge: -1
