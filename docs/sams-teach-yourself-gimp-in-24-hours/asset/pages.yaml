  md: '# Q&A


    +   - When I paint using using the Airbrush tool, it sometimes comes out too faint.
    What am I doing wrong?


    +   - Remember, the Airbrush functions just as a real live spray can would. The
    slower you paint or the longer you hold it in one spot, the more paint is deposited
    there.


    +   - I want to achieve a brush stroke that appears to run out of paint, just
    as a real one would. Can I do this?


    +   - You can if you you are using the Paintbrush tool. Double-click the tool
    and set the Fade Out option. (Refer to Hour 4, “Using Brushes and Patterns in
    Depth,” to refresh your memory on how this option works).


