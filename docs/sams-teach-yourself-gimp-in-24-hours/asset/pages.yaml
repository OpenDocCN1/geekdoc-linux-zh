    # Summary


    In this hour, you were introduced to the wonder that is Script-Fu, and looked
    at a few examples. There were no tutorials in this hour, but don''t worry, the
    next hour will uncover some more Script-Fu secrets!


    Because this is a brief primer, I did not cover all the scripts. There are simply
    too many out there, and to attempt to do so would be an effort in futility (The
    GIMP is such a young program!). For every script I touched on, there are at least
    10 more that are of equal quality and coolness. Each script has its own behavior
    and purpose, and these can be understood by direct contact with the scripts. Script-Fu
    encompasses a lot of different functions, and can be used for many things that
    we haven''t really thought of yet. We really are living on the edge of development
    and experimentation, and I can think of no better environment for doing this in
    the graphical realm than the GIMP and Script-Fu.


    # Q&A


    +   Q When I try to execute a script, I keep getting a Procedural Error and the
