- img_proc: true
  md: '# Using Brushes and Patterns in Depth


    FIGURE 4.8


    A signature brush can come in handy.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_64_0.png)


    # Using Patterns


    You will spend the second part of this hour concentrating on patterns. Through
    the position of color, design, and special effects, you''ll be able to create
    mind-blowing patterns.


    Patterns can be useful in many graphics tasks. The capability of the Bucket Fill
    to perform fills in selections can help you easily and quickly achieve a cool-toned
    look to your graphics and text, and using GIMP''s Seamless Tiling function enables
    your patterns to become beautifully tiled backgrounds.


    # The Pattern Dialog


    The Pattern Select dialog box, shown in Figure 4.9, by going to File, Dialogs,
    Patterns.


    FIGURE 4.9


    The pattern dialog box is a great place to browse for inspiration.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_64_1.png)


    Notice that the GIMP comes with an abundance of preloaded patterns. To choose
    a pattern, left-click on the thumbnail image. The pattern name shows at the top
    of the pattern window. Take a few minutes to click on the patterns in turn, and
    note that if you hold down the mouse button, you can get a full size view of the
    chosen pattern, as in the brush dialog box.'
  merge: -1
  pgno: 64
- img_proc: true
  md: '# Using the Fill Tool with Patterns


    Patterns can be used to fill any selected area, whether it is a text or other
    defined selection or an entire image area. Let''s do a simple pattern fill to
    see how it works.


    +   * With the pattern selection dialog box open, select a pattern that you like.

    * Open a new blank image with a white background.

    * Double-click on the Bucket Fill tool to activate it and also pull up the Options
    box.

    * In the Options box, set the opacity to 100 and check Pattern Fill.

    * Now merely left-click once on your image and watch your pattern choice fill
    the area, as shown in Figure 4.10.


    # Figure 4.10


    A built-in GIMP pattern fills a blank image.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_65_0.png)


    # Custom Patterns


    Now that you have the general idea of how pattern fills operate, you will no doubt
    to create some patterns of your own.


    Follow the steps outlined here to build your first simple GIMP pattern from the
    ground.


    Open a new blank image, background color of your choice. I''ve chosen a dark color
    for my illustration purposes.


    Set the foreground color to a color you''d like to use in your pattern. Because
    my ground is dark, I''m going to use bright colors for the background. Open the
    Brush dialog box, pick any brush, and randomly place bits of color in the image.
    Repeat this procedure several times using different brushes and changing colors
    until you have something similar to Figure 4.11.


    Now for the fun part. This gives you an introduction to what special filters can
    do, Right-click on the image and go to Filters, Distorts, Whirl and Pinch. Play
    around with the sliders until you have a look that you like (see Figure 4.12).'
  merge: -1
  pgno: 65
- img_proc: true
  md: '# Using Brushes and Patterns in Depth


    # FIGURE 4.11


    Play with colors and brushes to form the beginnings of a pattern.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_66_0.png)


    # FIGURE 4.12


    The whirl creates a colorful vortex effect.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_66_1.png)


    # Seamless Tiling


    After you have a pattern look that you are satisfied with, you should make it
    tileable, meaning that when you use it as a background or pattern fill on a large
    area, the seams edges blend smoothly together with no visible lines.


    This is relatively easy to achieve with a function called Make Seamless. Right-click
    the image you want to tile and go to Filters, Map, Make Seamless. Your pattern
    now magically units with no seams showing when saved and tiled. See Figure 4.13
    and notice how the edges have changed so that the pattern tiles correctly.


    # FIGURE 4.13


    Your seamless pattern is now ready to be saved.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_66_2.png)'
  merge: -1
