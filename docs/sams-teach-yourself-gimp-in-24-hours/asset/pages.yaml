  md: '# About the Authors


    **Joshua Pruitt** is an administrator/digital-graphic artist residing in Nashville,
    Tennessee. He works for a local college and also teaches UNIX. He is part of a
    Web design and hosting firm known as Mid-TN Network. He sets up local area networks
    for small businesses, and he is also Webmaster for the Nashville Linux User''s
    Group (www.nlug.org). Joshua spends too much of his spare time with his books
    and computers, follows the politics of the tech industry soap opera, and will
    never pass up an opportunity to extol the virtues of Linux and the GIMP. If you
    don''t believe that, write him at joshua@mid-tn.com.


    **Ramona Pruitt** is a self-taught graphic artist, cutting her first graphic teeth
    on Windows-based programs such as Photoshop and Paint Shop Pro, and then applying
    that knowledge to explore the GIMP. Like Joshua, she lives in Nashville, Tennessee,
    and is a part of the Web design team at Mid-TN Network, using her computer as
    a tool for her creative abilities. In her spare time, she enjoys sewing, reading,
    hiking, and spending time with a beautiful new German Shepherd pup. She welcomes
    email addressed to wildflower@mid-tn.com.'
  merge: -1
