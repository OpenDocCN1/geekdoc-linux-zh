- img_proc: true
  md: '# HOUR 7


    # Working with Color


    Color is perhaps one of the most important aspects of dealing with art and graphics—because
    color is richly and deeply embedded into almost everything you do. By merely altering
    a few colors within a composition, you can completely modify the tone and feel
    of the entire image, and in turn, how your audience reacts to it. Therefore, put
    a lot of thought into the color composition of your images before you begin.


    > Is color really that important? I invite you to take a look at some of your
    favorite Websites and pay special attention to the way in which they deal with
    color scheming. How would they look if they simply altered their entire color
    scheme one day? They would probably lose that unique feel that makes them distinct,
    and chances are you would feel a bit thrown off by it. Your images are the same
    way. You should make sure that whatever colors you use in any graphic have a purpose
    and are more than random hues without function. People notice and react to color
    more than they might realize.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_100_0.png)'
  merge: -1
  pgno: 100
- img_proc: true
  md: 'In order to work with color effectively in digital form, you first need to
    touch base on exactly how your computer recognizes color and how using different
    media can alter the way in which your machine thinks about color.


    # The GIMP and Color


    The GIMP version 1.0 is designed primarily with digital graphics in mind—whether
    you use them online, embed them in your documents, create animations, or use any
    other digital media. (The GIMP outshines most other applications when dealing
    specifically with Web graphics; therefore, the Web is the GIMP’s primary focus.)
    Admitted, the GIMP is not as effective as a professional tool, although the developmental
    versions of the GIMP are already showing promise in that area well. (That function
    could well be part of the stable distribution even by the time your book is on
    shelves.) However, for regular day-to-day printing tasks, the GIMP can perform
    nicely.


    # Color Models


    The Color models define how your computer interprets color and displays it in
    various media. You should familiarize yourself with these models, because they
    are essential for understanding some of the language and concepts behind graphics
    and color in general.


    # RGB Model


    Figure 7.1

    Most graphics applications use the RGB color model to describe color in terms
    of how it appears on monitors and screens.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_101_0.png)


    The GIMP deals primarily with the RGB model of color (RGB stands for Red, Green,
    and Blue). This is the model used for representing color on monitors and screens,
    because it is defined by light instead of by paints and tints. Therefore, any
    colors represented onscreen are composed of a combination of the colors red, green,
    and blue.'
  merge: -1
  pgno: 101
- img_proc: true
  md: '# Working with Color


    (Televisions also work in this same way—which you can see if you ever take the
    time to look at a television closely. You will see lots of little red, green,
    and blue dots with varying degrees of brightness.)


    For creating Web sites, colors in HTML are also represented in RGB as sets of
    base-16 (hexadecimal) numbers. One handy function of the Color Picker tool is
    to automatically show you the HTML code for your color. I have grown to love this
    feature.


    # HSV Model


    The HSV Model is a way to describe hue, saturation, and value. The GIMP uses this
    color model in combination with the RGB model. It is model used by the Color Selection
    dialog box, shown in Figure 7.2, and in many other filters and dialog boxes.


    # Figure 7.2


    The HSV color model is used by the Color Selection dialog box along with the RGB
    model. You can adjust the hue, saturation, and value by using the sliders.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_102_0.png)


    +   - Hue refers to the color itself—any color in the rainbow, whether red, green,
    blue, yellow, and so on.


    +   - Saturation represents intensity of color. The lack of color intensity results
    in grayscale, and full saturation results in 100% full color. So if you were to
    slide the Saturation slider in the color dialog box down, your color would become
    more and more washed out until you were left with pure grey.


    +   - Value is the amount or intensity of light within the color. A color is true
    at 50% value. By contrast, 100% value is white, and 0% value is black.


    You can attain a wide range of colors by using the HSV model, although you should
    experiment a little in order to get the hang of it. For example, turn up the value,
    and perhaps tone down the saturation a bit, to see pastel colors. By contrast,
    you can find deep rich Earth tones by turning down the brightness and, to a lesser
    degree, the saturation.'
  merge: -1
  pgno: 102
- img_proc: true
  md: '# Indexed Model


    The Indexed model refers to images that have a fixed number of colors, usually
    256 (8-bit). Each pixel in an indexed image is assigned a specific color index,
    and therefore indexed color does not use RGB in the strictest sense.


    Indexed images are used most on the Web (in GIF format) in order to save space
    and, subsequently, download time. Because indexed images have limited colors,
    they are much smaller in size, although many times this sacrifices image quality.


    To reduce the active color depth, right-click and go to Image, Indexed. This will
    pull up the dialog box pictured in Figure 7.3. (The option Enable Floyd-Stein
    Dithering simply tries to improve the image quality by dithering, or effectively
    emulating a color by using dots of color—much like a comic strip looks on close
    examination.)


    # FIGURE 7.3


    The Indexed model is used by graphics formats that use a limited number of colors—traditionally
    no more than256 of them. The GIF format is an example of a popular indexed format.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_103_0.png)


    These images can also use any number of palettes, which are indexed color maps,
    to assign specific colors to limited color graphics. This could be a palette of
    nothing but shades of blue, primary colors, the Windows and Netscape 8-bit palettes,
    and so forth. These will be discussed at length when you get into Hour 15, “Web
    Graphics.”


    # Using Custom Indexed Palettes


    The GIMP enables you to load and apply any number of custom palettes into your
    indexed image. Palettes, like their real-life counterparts, are predefined tables
    of specific colors for your image. They limit the amount of colors and the specific
    colors you can use, but they can help you get a more specialized indexed image.
    For example, they can exactly match the original colors of a higher quality image
    or more closely match a system palette, such as Netscape''s Web palette, in order
    to create an image that looks the same across platforms, even on low-end 256 color
    displays. We will talk more about this in Hour 15.'
  merge: -1
  pgno: 103
- img_proc: true
  md: '# Working with Color


    In order to do this, go to the toolbox menu File, Dialogs, Palettes, and you will
    see a dialog box, as shown in Figure 7.4, with a drop-down menu from which you
    can select many default palettes. These palettes are available from the Use Custom
    Palette option in the Indexed Color Conversion dialog box. With the Palette dialog
    box, you can also create new palettes and edit palettes to your liking and apply
    them to your image.

    Any GIMP palettes you make or find online should in your ~/.gimp/palettes directory.
    They will be accessible from the Color Palette drop-down menu.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_104_0.png)


    FIGURE 7.4

    Palettes enable you to customize the exact color values of your indexed images.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_104_1.png)


    # Grayscale


    The concept of grayscale is easy. A grayscale image is one that has no color,
    only 256 shades of black, white, and gray. To grayscale an image, simply right-click
    and go to Image, Grayscale. Note when you save that not all image formats support
    grayscale, and most do.


    # CMYK Model


    Print does not use ink to display color, but instead (or toner, if you like).
    As you know, adds value to each when mixed together, but inks and paints are subtractive
    in nature, as shown in Figure 7.5. (I know it''s a black-and-white book...you''ll
    have to use your imagination) This means that mixing the RGB colors using light
    gives you white, but mixing paint using the CMYK colors gives black. (Well, in
    practice it''s more a dark brown.)


    Print deals with color using the CMYK model. (CMYK stands for cyan, magenta, and
    black; the K is for black, because using the letter B might cause to confuse black
    and blue.) It works by splitting the image into four color channels, corresponding
    to the appropriate ink cartridge or toner of matching color.'
  merge: -1
  pgno: 104
- img_proc: true
  md: '# Hour 7


    # FIGURE 7.5


    The CMYK model of color is used for high-quality printing. Unlike RGB, it uses
    four main color channels instead of three. Black, is, needed for a, good-looking
    printout.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_105_0.png)


    Cyan


    If you are primarily concerned with your images coming out properly in professional-quality
    print, it is best to work on them in CMYK mode. The conversion from RGB to CMYK
    is less than. (Although you will never have a perfect representation of colors
    on your monitor, you can still get pretty close.) CMYK support is not yet fully
    implemented in the current stable release of GIMP, as far as I know the next version
    of GIMP currently in development, will have much better support for CMYK. I assume
    that your primary concern right now is creating graphics for onscreen display
    or for casual printing. I have covered CMYK simply for the purpose of understanding.


    # Color Channels


    Channels describes the colors to your output source, whether it is a digital screen
    or a printer. They do this by being change of one color per channel, at which
    point the device combines them into a multicolored image that is human readable.
    Therefore, whenever I speak of RGB channels, I speak distinctively of red, green,
    and blue portions of an image. The GIMP enables you to manipulate the separate
    color channels individually and create new channels if you want.


    In order to view the working image''s channels, do to go to the Layers and Channels
    dialog box from a right-click, Layers, Layers & Channels (see Figure 7.6). The
    first tab of this dialog box shows your image''s layering information. Because
    you are now working with only one layer, you can go ahead and click the tab labeled
    Channels. Here, you will see your image as represented by the three RGB channels.
    You can now click any one of the'
