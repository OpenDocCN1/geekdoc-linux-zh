    # Summary


    In this hour, you learned about the magic of masks and a few of the techniques
    involved in creating and using them. By learning how to work with masks effectively,
    you have gained a valuable new skill in the world of image manipulation.


    # Q&A


    +   Q I use the Mask to Selection option, which part of the mask becomes the selection?


    +   A The opaque (white) portion of the mask is the part that will become your
    area. If you want the transparent (black) area to be selected, you can perform
    the Mask to Selection function, and then use the Select menu to choose Select,
    Invert.


    +   Q I made a pretty cool mask. Can I save it to another image?


    +   A You sure can, but it’s a little tricky. First, add a new layer in black
    and place it directly below the masked layer. Turn off layer visibility in all
    layers except the black and the masked layer so that you see only the mask in
    the image window and select Edit, Copy Visible. Now create a new window with the
    same dimensions and select Edit, Paste. Save it in your choice of format and when
    you'
