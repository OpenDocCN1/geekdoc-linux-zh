  md: '# Edge Effects


    In some of the previous hours, you''ve learned many cool ways to apply edge effects
    to images by using masks, gradients, feathering, and so forth.


    To wrap up this hour, you''ll create one more simple yet interesting edge that''s
    fun to add to create photos.


    To start, you''ll need to open an image. Use the burro from the last lesson.


    What you will do here is create a look that resembles a torn and burned edge.
    The first step is to use the Lasso to select an uneven jagged area around the
    image so that it will appear as if it is ripped along the edges (see Figure 17.14).


    # Figure 17.14


    Visualize a piece of ripped paper while you form this selection.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_253_0.png)


    Right-click and choose Select, Invert, to reverse the selected area to the outside
    border.


    Open the Pattern dialog box (File, Dialogs, Patterns) and choose a pattern to
    put in the selected area. I''ve chosen one called pine. Use the Bucket tool to
    fill the selection with the pattern (or you can use the Clone tool set to the
    pattern source and paint the pattern). At your point, your image should look something
    like Figure 17.15.


    # Figure 17.15


    By filling the background with a pattern, the image is beginning to stand out.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_253_1.png)'
  merge: -1
  pgno: 253
- img_proc: true
  md: 'Now, once again, right-click and choose Select, Invert, to reverse the selection
    back to

    how it originally was.


    Add a drop shadow by right-clicking and going to Script-Fu, Shadows, Drop Shadow.

    Make sure the Allow Resizing option is unchecked.


    Now for the finishing touch, give the edges a burned appearance using the Gradient

    editor.


    Double-click the Gradient tool to bring up the options. Change the shape option
    to

    Shapeburst Angular and choose the Custom (from editor) Gradient option.


    Open the Gradient dialog box (File, Dialogs, Gradients) and choose Coffee. This
    is a gra-

    dient that goes from transparent to a dark brown.


    Apply the gradient to the selected area of the image by starting in the center
    and drag-

    ging to the edge in any direction. Deactivate the selection and presto! Your picture
    will

    now have a ripped and burned edge, as in Figure 17.16.


    FIGURE 17.16


    Making new images

    look tattered can be

    just as much fun as

    restoring old ones.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_254_0.png)


    # Summary


    This hour you looked at some of the ways GIMP can be used to spiff up old photo

    albums (and newer ones too!). Tools that were once available only to professionals
    are

    now readily accessible for anyone with a computer.


    Whether you want to give an old photo new life or make a new photo look as if
    it were a

    hundred years old, you''ll be able to achieve some miraculous results with a little

    patience and a practice.'
  merge: -1
