  md: When you make graphics to use on the Web, you must take into account that the
    larger the files are, the longer they will take to load when someone
  merge: -1
  pgno: 216
- img_proc: true
  md: 'accesses your site. The idea is to keep all graphics with as small a file size
    as possible without losing quality. You might be able to create fantastic images
    for a site, but keeping them small enough for Web surfers on slower modems can
    be a major challenge. In Linux, you can check the size of a saved file either
    using a graphical file manager or by going to your shell and typing ls -l <filename>.


    # File Formats


    At this time, there are primarily two file formats used for Web graphics, each
    having different properties and uses. One is JPEG (Joint Photographic Experts
    Group) and the other GIF (Graphics Interchange Format). Take a closer look at
    each of these in the following sections.


    # JPEG


    JPEG is the format to for photographs that you want to display on the Web. It
    allows the use of millions of colors, also making it ideal for images with lots
    of gradients and color complexities. JPEGs use what is known as a lossy compression
    scheme, meaning that you can control the file size by means of compression, but
    the more you compress, the more image quality will lost.


    When you save an image as a JPEG in GIMP, an option will appear where you choose
    the compression percentage from 0-100 (0 being totally compressed and 100 uncompressed).
    A good starting point is to set the slider around 85 or so for minimal loss of
    quality with reduced file size. Because it really depends on the particular image,
    you might want to save several copies of your image to play with the compression
    ratio and get the smallest file size you can while retaining decent quality. To
    get the lowest possible file size, it''s often recommended to save at an unacceptable
    low


    > After you save an image in JPEG format, it will lose quality each time you edit
    and save it. It''s best to save a copy of images in another format, such as GIMP''s
    native XCF format if you think they will need further editing. Saving the image
    in a JPEG format should be performed only on completion.


    quality (say, 50), and then slowly upward until the image is acceptable.


    # GIF'
  merge: -1
  pgno: 217
- img_proc: true
  md: '# Web Graphics


    GIF is probably the most widely used format on the Web. GIFs enable you to save
    images with transparent backgrounds. You create images only in rectangular or
    square windows, but when you want only a portion of the image to be visible, as
    a round button or a non-rectangular shape, transparent backgrounds can be an invaluable
    asset.


    The down side to GIFs is that they do not support millions of colors, but just
    a 256 or less, and therefore any image you create in high color must have the
    color depth reduced before saving as a GIF. Because of this, the images you are
    most likely to turn into GIFs are simple items such as logos, navigational buttons,
    divider bars, and so forth.


    To reduce colors and save an image in GIF format from the GIMP, right-click on
    the image and choose Image, Indexed. This brings you to the Options window where
    you have several choices of color reduction methods, including 256 color, Web
    safe, and customized palettes.


    In the same Options box, you have the choice to save the GIF as interlaced. This
    means that when your Web page containing the image is accessed, the image will
    load in levels, first appearing fuzzy and slowly sharpening to its final stage.
    It''s a good idea to interlace your Web images so that people can have something
    to look at while the page finishes loading.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_218_0.png)


    There is one more promising file format that is edging its way into Web design.
    PNG (Portable Network Graphics) possesses not only transparency capabilities,
    but also full color and relatively small file size without loss of quality. At
    this time, however, PNGs are only supported by the latest browser versions (Netscape
    and Internet Explorer 4.0) and therefore cannot be viewed by any of the older
    browsers. As time passes and more and people upgrade browsers, you will no doubt
    begin to see PNGs as one of the major Web file formats.


    Unlike JPEGs, GIFs use a lossless compression scheme, meaning that no image quality
    is lost when it is compressed into the GIF format.'
  merge: -1
  pgno: 218
- img_proc: true
  md: '# Web-Safe Palettes—Necessary or Outdated?


    Recently, most people had 256-color color monitors, whereas the new computers
    and monitors now see virtually all support millions of colors. What does this
    mean for Web page design? It is something that will probably be debated until
    the old 256-color monitors finally wear out! When an image is created and put
    on the Web in full color, results are beautiful on a full-color monitor, but they
    are sometimes less satisfying than a 256-color monitor. If there are colors used
    that are not in the safe palette, the 256-color system tries to accommodate by
    arranging the colors it does possess to appear in the places of those it does
    not. This is known as *dithering*. Sometimes dithering doesn''t cause too much
    loss of quality and other times can be disastrous.


    You have several choices to make in regards to which color palette to use design-


    > When designing graphics for a Web page, you might want to choose in full color
    because certain filters and functions will not work on indexed images. You can
    always reduce index color after you finish. When working with large areas of solid
    color, however, try to use a color from the safe palette to avoid later instances
    of dithering, which can make solid areas appear patchy. Make copies of your work,
    save them in two different file formats, and check them by changing your monitor
    settings to 256 colors (type start--bpp at the example). Ideally, the goal should
    be to have images that are wonderful on high-color monitors, yet presentable on
    256-color monitors, rather than settling for mediors all the way down the line.


    for the Web. If you feel most of the people who will be visiting your site will
    be using high-color monitors, you don''t need to worry about the safe palette.
    If you are designing a site that you expect to be viewed by the masses, you might
    want to consider the pros and cons of sticking to Web-safe colors so that your
    site will look good to all viewers.


    You probably noticed in the Indexed Color Conversion window that there are options
    to reduce to 256 colors or to the Web-optimized palette. These aren''t quite the
    same. When you reduce to 256 colors, the image will use 256 nearest matching colors
    it can find. The Web-safe palette actually consists of only 216 specific colors.
    Even though there are 256 colors built in to a system palette that is used in
    the operating system, 40 of these colors differ between operating systems and
    are, therefore, eliminated from the Web-safe'
  merge: -1
  pgno: 219
- img_proc: true
  md: '# FIGURE 15.1


    The Web-safe palette is included in the Palette dialog box.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_220_0.png)


    palette, leaving 21 colors that are the same on all platforms.


    To view the Web-safe palette within GIMP, select File, Dialogs, Palettes, and
    you will find the Web-safe palette listed among the many-built GIMP palettes (see
    Figure 15.1). To choose a color from the safe palette to work with, click it,
    and it will appear as your foreground color in the toolbox.


    # Making Good Looking Web Sites Quickly and Effectively


    There are several key elements to keep in mind when designing a Web site, even
    if it''s just a personal one. The best kinds of sites are classy, interesting,
    organized, navigable, and quick to load. The graphics used can play an important
    part in all these functions. Here you will take a look at a few of the different
    kinds of graphics that can come and really make a site flow.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_220_1.png)


    > When creating backgrounds, remember that they should be subtle enough so that
    the text placed over them can be easily read. If you prefer dark colored or busy
    backgrounds, you might want to consider putting your text in a table containing
    a solid color, having the background show in the areas surrounding the table.
    Also, if you have information on the site that people want to print, such as instructions
    or directions, you will want dark text over a light background so that when printed,
    the text will show on white paper.


    # Backgrounds


    The type of background used can set the look and style for an entire site. You
    can, of course, choose to go with a plain solid color background, but a graphic
    or textured back-'
  merge: -1
  pgno: 220
- img_proc: true
  md: 'ground can add a special flavor and uniqueness. In general, backgrounds should
    not be overpowering, but should add just enough depth and color to a site to give
    it its own look.


    # Textures as Backgrounds


    The easiest backgrounds to make are simple textures. These are similar to painting
    with textured paint in your home, adding color and a decorative touch to plain
    walls.


    Besides being easy to make, textured backgrounds are good to use because you really
    need only a small piece of texture that can be tiled (repeated over and over with
    seamless edges) as the background. This keeps your site''s total file size down.


    # FIGURE 15.2


    Because this will be tiled, it doesn''t need to be very big.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_221_0.png)


    Create a quick and simple texture here to illustrate the effect.


    First, open a new canvas in a small size, to around 100 x 100, and fill with a
    background color.


    Now choose a darker shade of the same color, open the Brush dialog box and choose
    one


    # FIGURE 15.3


    A couple of quick filter applications give the texture some depth.


