- img_proc: true
  md: '# FIGURE 6.14


    Arrange your photos such as this in the larger image window.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_98_0.png)


    In turn, copy and paste the three smaller images into the large blank image window,
