  md: '# Using More Plug-ins and Extensions


    # FIGURE 20.18


    Setting an image as a temporary root window image.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_290_0.png)


    # Crypto Tools


    Yes. You read correctly. Crypto. The GIMP has a few great plug-ins that allow
    for the encrypt and embedding of files within graphics. Real spy type of stuff.
    You might not have a real need for this, but they are still cool plug-ins nonetheless.


    # Encrypt/Decrypt


    This plug-in (right-click, Filters, Crypto, if you have it installed), does exactly
    what the name implies (see Figure 20.19). It will use a phrase key from you to
    encrypt your favorite image what appears to be pure garbledook. And, of course,
    only the supplied phrase can decrypt it back into recognizable form. I will not
    supply you with any ideas as to what this could be useful for; but I will say
    to my current knowledge this GIMP filter is the only application that can effectively
    decrypt these files (without, without a fight, anyway).


    # FIGURE 20.19


    As you can see, an encrypted image leaves no visible clues as to what is inside.
    This is almost as cool as my old Captain Crunch decoder ring!


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_290_1.png)


    # 20'
  merge: -1
  pgno: 290
- img_proc: true
  md: 'One thing to note with this plug-in: You should encrypt something only after
    you have finished making any changes to it, and then you should only save it in
    a non-lossy graphics format. Yes, this means no JPEGs. (GIFs, TIFs, PNGs, BMPs
    and so forth should work fine, though.)


    This plug-in is not the strongest or most secure encryption formula there is,
    so dont count on keeping your secret counterrevolutionary blueprints out of the
    reach of the CIA or NSA, but it is powerful enough to keep them safe from the
    probing eyes of your little sister.


    # Stegano


    Stegano provides a way to embed other files within a graphics file. It''s simple
    enough; just startup this plug-in, click the Browse button, and use the dialog
    box to locate the file you want to embed. Click the Write button, and then save
    it in your favorite non-lossy format (see Figure 20.20).


    # FIGURE 20.20


    Using Stegano is an easy way to transfer one type of file hidden inside another.
    How you would want to use this is entirely up to you.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_291_0.png)


    To hide a hidden file, open the graphic and this plug-in, click the Read button,
    and should write the hidden file into your directory.


    This filter will not embed a file that is too large in proportion to your graphic.
    If you get a message that says your file is too big, you will have to use a smaller
    file or larger graphic.'
