- img_proc: true
  md: '# Getting Started


    A Word About UNIX and File Format Extensions

    Because you''re no longer working in Windows, I should mention that Linux deals
    with file formats and extensions a little differently than you might be accustomed
    to. For the most part, you should follow the standard naming conventions for graphics
    files, appending the usual three or four letter extension to the end of the name,
    as .gif for GIF files, .eps for script files, .tif or .tiff for TIFF graphics,
    and so on. You do this in order to stay compatible with your friends, as well
    as a convention of habit, so you can remember many kinds of files you''re dealing
    with. But keep in mind that in UNIX files are not defined by their filename extension.
    It is entirely possible to save a GIF file with no extension whatsoever, as long
    as you specify to the application that opens what kind of file it is. So, for
    the sake of obfuscation, we GIF file named picture.jpg, you can easily open it
    with GIMP. In the Determine File Type menu in the dialog box, the Automatic option
    is selected by default. Nine times out of ten, the GIMP will not be fooled and
    will open it the GIF it really is. It does by more or less looking at the file
    data itself, not at the extension. If, for some reason it does detect the type
    of a file with no extension (or a misspelled one) correctly, you must then select
    the correct file type from the menu to tell the GIMP directly what kind of file
    you''re dealing with.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_38_0.png)


    Take a laundry-list look at what file formats GIMP can handle by.


    # TABLE 2.1 FORMATS IN GIMP


    | Format | Open | Save | Information |

    |---|---|---|---|

    | ASCII | X | | ASCII text (such as those nifty BBS, for example). |

    | bitmap | X | | Windows and OS/2 bitmap. A popular compressed format. |

    | bzip2 | X | | bzip2 is a compression utility. GIMP allows you to open and save
    compressed images directly from the program. |

    | CEL | X | | KISS indexed file format. |

    | Fax G3 | X | | The format used by fax machines. |

    | FITSX | X | | The Flexible Image Transport system. |

    | FLC, FLI | X | | Popular animation formats. |

    | GBR | X | | GIMP Brush (GIMP''s native brush format). |


    continues'
