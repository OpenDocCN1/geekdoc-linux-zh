- img_proc: true
  md: '# FIGURE 2.8


    You pull up the Save as menu by right-clicking on the image.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_41_0.png)


    # FIGURE 2.9


    The Image dialog box is where images are saved to disk. Remember to use the correct
    extension, or choose the file format from the menu when saving.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_41_1.png)


    > When saving files to your local disk, make absolutely sure that you have write
    permissions to the directory which you are attempting to save. Your attempt will
    fail, and the image will not be written to disk. (Permissions are an intrinsic
    concept to UNIX. You should familiarize yourself with them, if you haven''t done
    so already.) Of course, saving to your own home directory should present no problems.


    # Other Toolbox Menu Options


    The File menu on the Toolbox dialog box also has a few other options you should
    be aware of.


    # About


    The About item pulls up a dialog box that lists the GIMP development team, the
    version you''re running, and so on.'
