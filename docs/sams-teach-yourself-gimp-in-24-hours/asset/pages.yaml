- img_proc: true
  md: '![](img/1e2e1cd1a8efa63a199c864a651e3086_204_0.png)


    # HOUR 14


    # Cool Text Effects


    The creation of cool text effects is something that has been around just as long
    as art itself. The earliest efforts began as an art called calligraphy (the art
    of writing beautifully) and have been traced as far back as circa 2500 B.C.


    Why turn simple text into works of art? The answer to that is straightforward
    and totally logical—to attract and focus attention on a particular word or group
    of words. For instance, when you design a logo or Web page header is the first
    thing you want to look at. Any other information comes secondary to. It’s a way
    of making a good first impression and having something that sticks in people’s
    minds.


    Think of some of the ways that text effects have unconsciously impacted your way
    of thinking. I know the bold white cursive Coca-Cola text on the red background
    is so ingrained into my brain that glancing at it can make me thirsty. I associate
    that particular text effect with the product itself. Or about how the simple and
    conservative IBM logo? It makes me think of business and computers. My point?
    Text effects are a powerful way to get noticed and remembered.


    With GIMP, creating cool text effects is a snap. This hour checks out some of
    the steps involved in producing some striking text looks.'
  merge: -1
  pgno: 204
- img_proc: true
  md: '# Working with the Text Tool


    As you remember from Hour 3, “Basic GIMP Tools,” when the Text tool is activated,
    a click anywhere in your image window will bring up the text box. From there you
    choose a style from a list of installed fonts and can also control things as font
    size, antialiasing, slant, and so on.


    When you place a text string in an image, it becomes a text selection, complete
    with flashing marquee, enabling changes to be only to the selected area. However,
    text is automatically considered a floating selection. This means that you can
    move it around without affecting the other areas of the image, while it is floating,
    the regular Selection menu items (accessed by right-click, Select) are non-functional
    on it. You anchor the floating selection in the same way as a regular selection,
    by clicking once in the selected area or using the Anchor option in the Layer
    dialog box.


    > If you want to use the Selection menu on a floating text selection, you must
    first change it to a regular selection. Place and anchor the selection in its
    own layer, and then right-click, Layers, Alpha to Selection. This brings back
    the marquee around the text, but this time it will not be considered a floating
    selection, but just a normal selected area. To change it back to floating, right-click,
    and Select, Float.


    # Dazzling Text Effects from Scratch


    While there are usually any number of ways to produce a given look, I''ve chosen
    popular text effects here and will illustrate direct and simple methods for achieving
    each one.


    # Beveled Text


    Beveling is one of the easiest and most attractive ways to add a touch of depth
    to your letters. By beveling, you add a sort of incline or slope to the outer
    edges, resulting in more of a 3D look.


    # Soft Rounded Bevel


    Adding a soft bevel to text can be performed with little effort, thanks to the
    GIMP Gradient tool.


    To appear beveled, the text needs a little shading around the edges. Try the following
    steps on a text string of your own to see just how easy is to add a little depth
    to your words.'
  merge: -1
  pgno: 205
- img_proc: true
  md: '# Cool Text Effects


    Open a new image window. Right-click to bring the Layer dialog box, and then select
    Layers, Layers and Channels. Add a new transparent layer to place the text in.
    Choose the foreground color as the color you want the text to be, and set the
    background color to black. Insert the text.


    With the text still selected, double-click the Gradient tool to activate it and
    bring up the gradient options.


    For the settings, choose FG to BG (foreground to background) for the blend option,
    and Shapeburst Spherical for the gradient option. Use the cursor to draw the gradient
    across your text and unselect it.


    Figure 14.1 illustrates how a text string would look before and after the addition
    of a soft bevel.


    # FIGURE 14.1


    A slight bevel can really give your text some shape.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_206_0.png)


    # Shiny Bevel


    To dress up the bevel a little more, you can give it sort of a smooth plastic
    appearance. A few well-placed airbrush strokes can take care of this.


    Add another new transparent layer. Make the foreground color in white, and choose
    a small soft brush size using the Brush dialog box.


    Use the Airbrush tool to spray on some highlights in strategically placed spots
    as if a light were shining on the text. (Remember the definition of speculars
    in Hour 11, “Special Effects”?) To soften the look of the speculars even more,
    you can use one of the blur filters if you''d like (right-click, and select Filters,
    Blur). In Figure 14.2, you can see how the addition of the highlights has added
    some gloss to the text.'
  merge: -1
  pgno: 206
- img_proc: true
  md: '# FIGURE 14.2


    A shiny plastic look has emerged with the aid of a few highlights.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_207_0.png)


    Plastic text is nice, but just for practice, take this text one step further and
    give it more of a glossy look.


    First, give this text a background pattern by activating the background layer
    and using the Bucket Fill tool to fill with a pattern from the GIMP Pattern dialog
    box. That way, when you make the text into see-through glass, there will be something
    to show through. Another alternative wanted would be to place an image into the
    background layer.


    Okay, now to turn that plastic text into see-through glass, activate the original
    layer and change the blend mode to Multiply for a result similar to the one shown
    in Figure 14.3.


    # FIGURE 14.3


    Plastic becomes see-through glass with a change of a blend mode.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_207_1.png)


    Now that you have the text looking like glass, you might as well take it all the
    way and assume the sun could shining directly on it. How about putting a few sparkles
    here and there?


    Add one more transparent layer.


    Using the Paint, place just a few small white dots of paint in the new layer at
    points on the text where you think a sparkle would look good.


    Right-click, and select Filters, Light Effects, Sparkle. You can play around with
    the sparkle options here. If you don''t get the look you want right away, undo
    and start the sparkle over with different settings. In Figure 14.4, you can see
    the settings I used to achieve some nice sparkles.'
  merge: -1
  pgno: 207
- img_proc: true
  md: '# Cool Text Effects


    # FIGURE 14.4


    This text is getting flashier by the minute!


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_208_0.png)


    # Sharp Bevel


    Another sort of beveled look is a bevel with a sharp incline, like the soft bevel,
    it can also be fashioned using nothing but the GIMP basics.


    To begin, open a new image window, add a new transparent layer (name it *original*),
    insert some text and create a soft bevel using the technique you just learned
    with the Gradient tool.


    Now, add another new transparent layer (name it *bump*) and insert the same text
    directly over the original text. Anchor the selection.


    The next step involves using the Bump filter to map the second layer over the
    first. To bring up the bump map options, right-click, and select Filters, Map,
    Bump Map.


    In the Bump Options box, (see Figure 14.5) there is an option called *Active Layer*.
    (This can get a little tricky.) Although the layer that is showing in the Layer
    dialog box active should be the layer called *bump*, you want to map this bump
    layer to the layer called *original*, so choose original in the bump options active
    setting.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_208_1.png)


    > The bump map is a versatile filter. Try applying it on a plain one-layered text
    selection for a very small bevel along the edge.'
  merge: -1
  pgno: 208
- img_proc: true
  md: '# FIGURE 14.5


    There are a lot of bump map options.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_209_0.png)


    By doing this, you will not only gain a sharp bevel, but can also change the look
    of it by using the bump map options. The Azimuth can be used somewhat like a light
    source that can be moved all around, creating different shading effects, while
    you also have control over options such as Depth and Elevation. See Figure 14.6
    for an example of text that has a bump map applied over a soft bevel, resulting
    in a very sharp bevel.


    # FIGURE 14.6


    Attaining a sharp bevel is another GIMP talent.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_209_1.png)


    # Metallic Text


    Metallic text is an extremely popular look and is also easy to produce by using
    the Gradient tool with your own chosen colors or GIMP''s wide array of built-in
    metallic gradients.


    # Smooth Metal


    For a smooth and shiny metallic look, begin by opening a new image window and
    adding a new transparent layer. Insert a text string.


    Set the foreground color to white and the background to black.


    Double-click the Gradient tool and, and in the options box, set the blend option
    at FG to BG. Set the Gradient option to Bi-Linear.'
  merge: -1
  pgno: 209
- img_proc: true
  md: '# Cool Text Effects


    Start in the center of the text (any letter) and drag either up or down to the
    edge for a smooth silvery metal, as in Figure 14.7. I''ve also applied a drop
    shadow to make the text stand out against the white background.


    > When adding text to an image, always place it in its own transparent layer.
    If you decide to add a drop shadow using the Script-Fu shadow option while the
    text is floating, the shadow layer will form its own layer above the text and
    will have to be moved underneath the lower layer option in the Layer dialog box.
    If the text is applied in the background layer, the shadow will not be able to
    be moved beneath.


    You can change the metal to gold, copper, and so on, by right-clicking, and selecting
    Image, Colors, Color Balance and adjusting the sliders.


    # Figure 14.7


    A shimmering metallic forms from a black-and-white gradient.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_210_0.png)


    # Brushed Metal


    What if you want a brushed effect instead of a smooth metal effect? No problem.
    Use the Custom (from editor) as the blend option, Linear for the gradient option,
    and choose Brushed Aluminum in the gradient editor (select File, Dialogs, Gradient
    editor). Figure 14.8 shows the brushed aluminum gradient applied.


    # Figure 14.8


    Brushed metal is ready-made in the gradient editor.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_210_1.png)'
  merge: -1
  pgno: 210
- img_proc: true
  md: '# Golden


    > To achieve even more of a brushed metal appearance, try adding a small amount
    of noise (right-click, Filters, Noisify), and then applying a motion blur.


    You''ll definitely want to play around with the built-in Golden gradient. Add
    it to text as a linear gradient for a smooth gold, or try applying it using one
    of the Shapeburst blends for a look similar to the one in Figure 14.9.


    Figure 14.9

    Golden text will add a touch of class to any image.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_211_0.png)


    Here you''ve looked at a couple of the metallic gradients, but there are still
    more in the editor. Be sure to check out Metallic Something and Cold Steel if
    you like metallic looks.


    # Cutout Text


    To give the appearance of having been cut out of an image (like a stencil sheet
    that you can spray paint through), you can utilize the Drop Shadow function, using
    a slightly different technique with it. Basically, you get the effect with an
    inverted drop shadow. This technique works best with light that is to medium colored
    or filled with a pattern. The shadow would not show up in black or very dark text
    until you used a lighter shadow color.


    Open a new window. Bring up the Layer dialog box and add a new transparent layer.
    Activate the Text tool, insert your text, and anchor it in the transparent layer.
    Now, right-click, and select Layers, Alpha to Selection. Right-click again, and
    choose Select, Invert. Now that your selection is inverted, you''re ready to apply
    the drop shadow. Right-click, and go to Script-Fu, shadows, drop shadow to bring
    up the shadow options. Keep the default options, but make sure that Allow window
    resizing is unchecked. Apply the shadow, unselect, and you have a cutout, as in
    Figure 14.10.'
  merge: -1
  pgno: 211
- img_proc: true
  md: '# Cool Text Effects


    FIGURE 14.10


    No scissors required for this type of cutout!


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_212_0.png)


    # Easy Emboss


    If you want your text to look embossed, but that old gray Emboss filter just doesn’t
    cut it, try this technique for a quick and easy emboss that leaves your colors
    intact:


    First, open a new window. Choose a pattern and use the pattern fill option of
    the Bucket tool to fill the blank image. Add a new transparent layer over that,
    choose your text and insert it. Use the Bucket tool to fill the text with the
    same pattern. Anchor the text selection. (At this point, the text seems to have
    disappeared, but it hasn’t really!). Right-click, and go to Layers, Alpha to Selection.
    Ah, there it is. Now, right-click, Select, Invert. You’re right if you’re thinking
    all this seems awfully familiar to the last tutorial! The steps are basically
    the same up to a point.


    Okay, now that you have the inverted selection, you’re ready to emboss. Right-click
    and bring up the Script-Fu drop shadow options. Reduce the X and Y values around
    2 this time and the blur radius to 5. (Once again, Allow window resizing needs
    to be unchecked). Apply the shadow.


    So far, it looks pretty much like the cutout, hmm? Just one more step to the embossed
    look. Right-click and bring the Script-Fu shadow options one more time. This time,
    change the X and Y values both to -1 (minus 1), blur radius to 5, and set the
    shadow color to white inside the default black. Apply the shadow, inset it, and
    then you have it (see Figure 14.11).


    FIGURE 14.11


    A subtle and elegant look can be achieved with embossing techniques.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_212_1.png)


    14'
  merge: -1
  pgno: 212
- img_proc: true
  md: 'For a reversed emboss (a raised look as opposed to pressed), you can follow
    the same steps, only apply the white shadow with the positive X and Y values and
    the black shadow with the negative X and Y values, for a similar result to the
    one in Figure 14.12.


    # FIGURE 14.12


    Try a raised emboss for a slightly different appearance.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_213_0.png)


    At this point in the development of GIMP, the Text tool does not allow the input
    of more than one line of text at a time. A simple workaround for this is to open
    a text editor and enter multiple lines of text as you want them to appear. Highlight
    these multiple lines of text, and place them in the text box by either clicking
    the middle button or clicking the right and left mouse button simultaneously.


    # Summary


    This hour you examine just a few of the millions of different ways to spruce up
    text. By learning to perform some of the fundamental techniques step by step,
    you will be able to understand how easily effects are made and dabbling with the
    steps to create your own custom looks. And if you love cool effects, you’re going
    to be blown away when you get to the hours on Script-Fu (Hours 21, “What the Heck
    Is Script-Fu?” and 22, “More with Script-Fu”). The things you learned this hour
    will later give you a greater insight into the way Script-Fu works.


    # Q&A


    +   - The Gradient tool affects all the letters in my text string. Is there a
    way to apply a gradient to just one letter at a time?


    +   - The Gradient tool sees the text string as a single selection. If you want
    to apply a gradient to each letter separately, you will need to insert each letter
    at a time and apply the gradient before inserting the next, or put each letter
    in a separate layer. You could also use the Fuzzy Select tool to select one individual
    letter at time.'
  merge: -1
  pgno: 213
- img_proc: true
  md: 'Q After placing some text, I changed my mind about the color, but when I used
    the Bucket Fill tool to change to a different color, it didn''t fill completely
    to the edges. Why not?


    A More than likely, the Bucket Fill tool had a low fill threshold setting. Bring
    up the bucket fill options to raise the threshold.


    #  Exercise


    For the assignment this hour, work on training your eye to spot the different
    text effects in your surrounding, which you might not have noticed before. Look
    at your bookshelf and check out the cover text. Open the fridge and see what text
    the pickle jar artist used. You might come up with some great ideas this way!'
