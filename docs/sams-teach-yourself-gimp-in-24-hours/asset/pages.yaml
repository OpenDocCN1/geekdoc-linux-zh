    # Screen Shot


    You''ve spent hours and days putting together the world''s greatest X desktop.
    You''ve worked hard putting together a great Enlightenment theme, made some great
    rxvt pixmaps, found the perfect background image, tweaked your GTK theme, and
    now you want to show it off. This plug-in (see Figure 20.17) lets you do just
    that, quickly and easily. Using this plug-in is easy. Select an option between
    single window and full screen, set a delay if you like, click OK, and when your
    PC speaker peeps, you''ll have a screen shot.


    # FIGURE 20.17


    This plug-in provides convenience by allowing you to work with screen shots from
    within GIMP.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_289_1.png)


    # Inroot


    Having this plug-in, from a right-click, File, Inroot will set the active image
    as your X background image (known as wallpaper in Windows nomenclature). This
    will not set the image as the permanent background on startup—that is usually
    handled by your window manager—but it is an easy way to view an image as your
    desktop background (see Figure 20.18).'
