  md: '# System Requirements for Running GIMP


    In order to successfully install and run GIMP 1.0, the following items are required:


    +   - A working UNIX variant (Linux, Solaris, HP-UX, FreeBSD, OpenBSD, AIX, DEC
    UNIX, IRIX, and so on)

    - A working implementation of the X Window System (X11R5 or better—preferably
    X11R6)

    - The GNU C compiler or equivalent

    - GTK 1.0.1 or higher

    - The latest graphics libraries (libjpeg, libgif, libpng, libxmpx, libmpeg, libz)

    - Sufficient hardware (on a PC, this would probably mean at the least 486 with
    16+MB of RAM)

    - At least 20MB of hard drive space for minimal installation (100MB for a full
    compilation and debugging session) with room to spare (if you plan on getting
    any work done)


    # About GTK


    GTK is short for the GTK ToolKit. It is a vital and required component of the
    GIMP—as it is the GUI on which the GIMP is built. (In case you prefer, a toolkit
    is more or less any library that draws the "widgets" for a graphical application—scrollbars,
    buttons, menus, check boxes, and so on. UNIX traditionally had many different
    toolkits to choose from, with varying degrees of simplicity or robustness, depending
    on the needs of the programmer.) Originally, the GIMP used Motif as the toolkit
    of choice, but the creators of GIMP created GTK as a more modern and workable
    alternative to the commercially licensed and developmentally represent Motif.
    GTK is very clean, powerful, efficient, and aesthetically pleasing (to me, at
    least). It is now being used for many other applications, as well as the GNOME
    desktop project.


    As of this writing, it is best to install only the stable series of GTK for use
    with the GIMP (that is, the stable 1.0 series opposed to the developmental 1.1
    series). You cannot compile GIMP 1.0 with GTK 1.1+ (which is needed for the latest
    releases of GNOME). Of course, as with anything in the Open Source community (or
    free software community, if you prefer), this is likely to change very rapidly—perhaps
    even by the time this book hits the shelves this will no longer be an issue, because
    GNOME is reaching the completion stage, the next release of GIMP might likely
    use the developmental version of GTK. So, you will want to check out http://gtk.org/
    and http://www.gimp.org/ for the current, up-to-date details.'
