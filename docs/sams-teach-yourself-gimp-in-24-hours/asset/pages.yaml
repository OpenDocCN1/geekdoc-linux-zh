  md: '# Sams Teach Yourself GIMP in 24 Hours


    GIMP. It allows developers from all over the Internet to view, study, alter, revise,
    and improve the code in a dynamic way, withকিন্ত and quality that is simply unmatched
    by private companies alone, which are staffed with limited numbers of developers
    and motivated by immediate marketability. In short, Open Source software generates
    the most stable and easily improved software in the world. And, GIMP stands as
    a shining testament to this fundamental truth.


    GIMP binaries are currently available for Solaris, SunOS, HP-UX, IRIX, Linux,
    and FreeBSD, and probably any other relatively modern UNIX variant you can name.
    There is also an OS/2 port available, a Microsoft Windows port that is workable,
    but still in heavy development, and a BeOS port is churning around the rumor mill.
    As of yet, there are no plans to put GIMP to the Macintosh. (Sorry, guys.)


    # Who This Book Is For


    This book assumes that you are running and comfortable using the Linux operating
    system. (Most UNIX variants will work well, but they''re not as fun as running
    Linux, in the author''s most opinion). It is suggested that you take the time
    to familiarize yourself with your computer''s operating system before attempting
    to tackle the GIMP for the first time.


    As far as the GIMP goes, the process is the same as with any other robust application:
    the best way to learn is simply to play with it! I suggest that you take time
    between hours to push all the buttons, try new things out, and get a feel for
    the software (who could resist doing that anyway?). This book is designed as an
    addendum and an aid to the learning process, with some time and effort, you''ll
    be a GIMP guru by the time you''re finished.


    # Conventions Used in This Book


    This book is designed to teach you topics in one-hour sessions. All books in the
    Sams Teach Yourself series enable you to start working and become productive with
    the product quickly as possible. This book will do that for you!


    Each hour, or session, starts with a quick overview of the topic to inform you
    of what to expect in that lesson. The overview helps you determine the nature
