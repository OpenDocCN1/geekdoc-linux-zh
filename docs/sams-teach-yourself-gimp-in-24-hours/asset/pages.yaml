- img_proc: true
  md: '# HOUR 11


    # Special Effects


    The first part of this book has been devoted to the intrinsic nature of the GIMP,
    how it works, and how you can find your way around to recognize and use the basic
    tools and functions required to get the job done.


    Because you''ve studied so hard and accomplished so much in such a short time,
    I think you deserve a break, so for now, and essentially for the next few hours,
    consider that the bell has rung and recess has begun—have some fun with graphics!


    This hour, you will look at an assortment of special effects that can be easily
    performed with the aid of the basic GIMP tools and a little imagination.


    # Tips and Tricks


    What I mean by special effects is the art of creating or adding some distinguishing
    characteristic to an image, whether to give the appearance of a real-life object
    or just to achieve something that looks cool. The following is a list of a few
    things to keep in mind when you are thinking about special effects.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_160_0.png)'
  merge: -1
  pgno: 160
- img_proc: true
  md: '+   - Many through experimentation or just plain playing around, you can stumble
    across an astonishing effect. When experimenting, try to keep a mental note of
    the steps you perform as you go so that you''ll be able to duplicate the look
    if you find a good one.


    +   - Of the available tools, one of the handiest for producing awesome looks
    is the Gradient tool, which was introduced in Hour 7, "Working with Color." If
    you haven''t yet dared around much with this, I encourage you to do so. Open the
    Gradient dialog box and check the various built-in gradients.


    +   - So many factors must be taken into consideration when trying to achieve
    a certain look. Take a close look at the objects around you in the room. Notice
    the light shines on them and the shadows they make. Try to visualize what steps
    it would involve to create a realistic looking graphic of a particular object.


    # # Creating Sharp Images from Scratch


    Sometimes you can get a really good graphic idea in your head, but you need to
    know the right techniques to make it happen onscreen. Your goal hour is to cover
    some of the more common tricks to help you learn to create the look you want.


    Begin by looking at a couple of ways to create something from nothing.


    # # Simple and Complex Shapes


    Forming shapes with the selection tools can be a quick-and-easy way to create
    images. In just a few steps, you can make a fairly complex object out of a simple
    shape.


    To illustrate this point, I''m going to start out here by opening a new blank
    window, using a transparent layer, and using the Lasso tool to form a single odd-shaped
    selection, as in Figure 11.1. Open a new window and follow along for practice.


    # ## 11.1


    This little selection stands a pretty good chance of actually becoming an interesting-piece
    of work.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_161_0.png)'
  merge: -1
  pgno: 161
- img_proc: true
  md: '# Special Effects


    Now you can add some color; I''ve chosen purple and black as the foreground and
    background colors in the toolbox. Bring up the gradient options by double-clicking
    the Gradient tool. Leave most of the default settings in place, but change the
    gradient option to Bilinear. This will enable the color to gradate from black
    to purple and back to black again.


    Apply the gradient starting from the middle portion and dragging to one end of
    the selection. You should have something similar to Figure 11.2.


    # FIGURE 11.2


    The bilinear gradient adds color and depth.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_162_0.png)


    Okay, now you have the basic start you need to form your shape. With the selection
    still active (as indicated by the flashing marquee), right-click on the image
    and select Edit, Copy, and then select Edit, Paste. This will give you an identical
    selection placed over the first one. For this new selection, use the Transform
    tool to rotate it. Double-click the Transform tool to bring up the options, and
    then choose Rotate. Grab one of the corner handles and rotate it to the right
    (around 20 degrees). Now activate the Move tool and move the rotated selection
    to where you can line up the tip of it with the tip of the first selection, as
    in Figure 11.3. You undoubtedly see where I''m headed with this, don''t?


    # FIGURE 11.3


    The raw beginnings of an object taking shape.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_162_1.png)'
  merge: -1
  pgno: 162
- img_proc: true
  md: 'Repeat the previous steps of copying, pasting, rotating, and moving, but add
    another 20 degrees to each rotation. Keep repeating as often as needed to bring
    the shape to the stage of desired completion, as shown in Figure 11.4.


    # FIGURE 11.4


    You can take this shape as far as you want it to go.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_163_0.png)


    By using the previous technique of copying, pasting, and rotating with basic geometric
    shapes, you can form some pretty interesting objects, as illustrated in Figure
    11.5. (If you enjoy working with geometric shapes, you''re going to love the GIMP
    plug-in known as Gfig. You''ll learn more about it in Hour 20, Using Plug-ins
    and Extensions.)


    # FIGURE 11.5


    Easy geometric works in progress.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_163_1.png)


    # Drop Shadows and Glows


    The technique of applying drop shadows and underglows can really make an image
    stand out and be noticed, and it is easily accomplished in the GIMP by using layers.


    There are a couple of ways to add a drop shadow, one of them in the shadow options
    of Script-fu. This one is simple; right-click on the image, select Script-fu,
    Shadows. You have your choice of drop shadow or perspective shadow, each having
    various options.


    Another way to get a drop shadow is to actually make one out of the image shape
    itself, which is the method explained here.'
  merge: -1
  pgno: 163
- img_proc: true
  md: '# Special Effects


    Add a drop shadow to the previous homemade image and you''ll see what difference
    it can make.


    First, select the image that you want to place a shadow behind. If the image''re
    using here, choose the Fuzzy Select tool (with Sample Merge activated) on the
    back-ground, and then Select, Invert. If the selection you are working on is of
    the background layer, you will need to select Edit, Copy, and then select Edit,
    Paste to paste it into a new transparent layer. Name it Edit, Copy, before adding
    the shadow.


    To make a shadow, right-click on the image and bring up the Layer dialog box.
    Add another new transparent layer. Name it Shadow. Use the Bucket Fill to fill
    the selected area in the new layer with solid black. Deactivate the selection.


    Right-click and select Filters, Blur, Gaussian Blur (either one), and apply a
    blur strength of 15 or so. In the Lower Layer button to place the shadow layer
    under the image. Because the shadow is in its own layer, you can use the layer''s
    opacity slider to make the shadow appear if you like.


    What will you want to do is offset the shadow so that it appears the light source
    making it over to one side. To do this, right-click and go to Image, Channel Ops,
    Offset. This brings up an option box where you can choose the amount of offset
    (in pixels) for both the X and Y values of the shadow layer. (Remember, X is horizontal
    and Y is vertical.) Positive numbers offset the shadow to the right for X and
    down for Y. If you want the shadow up or to the left, enter negative numbers (for
    example, -8). In Figure 11.6, the drop shadow offset is X8, Y8. You can also offset
    the shadow by moving the layer, but the channel ops gives you more control if
    you want to offset it in an exact amount.


    # Figure 11.6


    Use the offset to place the shadow in either direction. Here it is shown down
    and to the right from the image itself.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_164_0.png)


    Now you''ll work on giving a glow to a selection.


    For this, you''ll want to begin by following the first steps as you used to create
    the drop shadow. Place the selection in a transparent layer. Add another transparent
    layer and'
  merge: -1
  pgno: 164
- img_proc: true
  md: 'name Glow. This time, however, instead of filling the selected area of the
    new layer with black, use a lighter color. White is good for achieving a halo
    effect, whereas bright green gives a radioactive appearance. (I am somewhat partial
    to red and purple glows myself.)


    Deactivate the selection and apply a Gaussian Blur, this time making it a slightly
    higher blur strength. Try 20 to begin. You can play around with the blur strength
    to get the desired effect. Lower the glow layer under the image layer.


    Because my image began on a white background, the glow doesn''t show up too well,
    so I''ve used the Bucket Fill tool to fill in the background layer under the image
    and shadow with a darker color (see Figure 11.7).


    # 11.7


    A glow is made by using a brighter color than a drop shadow and leaving out the
    offset.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_165_0.png)


    # Imitating Real Objects in 3D


    One thing the Gradient tool is extremely useful for to give a sense of depth to
    an object so that it has more of a 3D appearance rather than just a flat two-dimensional
    look. In the next tutorial, you will start with a simple shape and take it through
    several changes to make it seem more *real*.


    Open a new blank window with a white background. Bring up the Layer dialog box
    and add a new layer to work on. (The reason I like to add a transparent layer
    before beginning is that later on, if I choose to do so, I can easily change back-ground
    colors without affecting the object I''m making.)


    Use the Ellipse/Circle tool and make a perfect selection in the image window.
    (Reminder: Holding Shift as you select will create perfect circles.) Open the
    Pattern dialog box, choose a pattern, and use the Pattern Fill of the Bucket tool
    to fill the circle. Then deactivate the selection. In Figure 11.8, I''ve begun
    by filling my circular selection with a built-in GIMP pattern called *Marble*.'
  merge: -1
  pgno: 165
- img_proc: true
  md: '# Special Effects


    # FIGURE 11.8


    A plain circular selection gets a pattern fill to start it on its way to becoming
    an object.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_166_0.png)


    Now you will attempt to give it some depth. Imagine there a light source just
    above and to the left of the circle. It would shine on the area of the circle
    it was closest to and the other side of the circle would appear darker because
    it wasn''t in the path of the light.


    To achieve this look, you will rely on the Gradient tool. Because you don''t want
    to change the color or cover the pattern, but do want to add depth, you need a
    gradient that goes from transparent (completing the pattern show through where
    the light is hitting the object) to black (forming the shadowy area). This is
    a good opportunity to make a custom gradient. Bringing up the gradient editor
    by selecting File, Dialogs, Gradient Editor, and clicking the New Gradient button
    in the upper-right corner. This brings up a box where you can give the gradient
    a name. (I’ve named mine trans-to-black.)


    Now, going back to the gradient dialog box, right-click in the area where the
    gradient colors appear and other options pop up. This is where you set the colors
    you want in the gradient. In the top of the options box, you’ll see it says Left
    End Points Color. This means the color will begin at the left side of the gradient.
    Because you can place gradients in any direction you want by merely dragging the
    cursor in the different directions, it doesn''t really matter which color you
    choose to go on the left or right. Directly under Left End Points is the option
    called Load From. Clicking that will bring up a window where you can choose a
    color to insert into the left end point. Because you are making transparent to
    black, choose transparent, which is RGBA (0.000, 0.000, 0.000, 0.000) and appears
    as the checkerboard. Now right-click again to bring up the same options, but this
    time to go to Right End Points Color and choose black. Your custom gradient is
    now set in the gradient editor. You can leave it in the editor for future projects.


    Activate the Gradient tool by double-clicking to bring up the options, and then
    choose Radial for the gradient option and Custom (from editor) for the blend option.
    The radial option gives a sunburst effect if it is applied from the center out.
    But because you want'
  merge: -1
  pgno: 166
- img_proc: true
  md: 'the effect of the light source to be in the upper-left, place the cursor in
    the selection where the light source would be shining on the object, and drag
    it to the lower-right outer portion of the selection. Now the circle you began
    with will take the shape of a sphere, as in Figure 11.9.


    # FIGURE 11.9


    It''s amazing what a little gradient shadowing can do to a plain, flat circle!


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_167_0.png)


    Take the light effect even one step further and apply an extra little sheen to
    the sphere to give it more of a glossy appearance. Activate the Airbrush tool,
    set the foreground color to white, and open the Brush dialog box to choose a medium-sized,
    soft-edged brush. By spraying in a little spotlighted area at the point where
    the imaginary light is shining, the sphere will have gained a much shinier look,
    as in Figure 11.10. (This is called a *specular*. Specular highlights appear as
    bright white reflections of the light on the surface of the object.)


    # FIGURE 11.10


    With the addition of a specular, the sphere takes on the look of a well-polished
    bowling ball.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_167_1.png)


    Now try another little trick and cut off the top of the sphere and hollow it out
    to make a bowl.'
  merge: -1
  pgno: 167
- img_proc: true
  md: 'Activate the Ellipse Select tool and make an elliptical selection in the upper
    half of the sphere, starting at a point on one outer edge and ending on the opposite
    edge, as in Figure 11.11.


    # Figure 11.11


    The elliptical selection is the first step to cutting-the sphere.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_168_0.png)


    Now, right-click on the image and choose Select, Invert. Use the Eraser tool to
    erase the portion of the sphere that''s now just above the elliptical part. Once
    again, right-click, choose Select, Invert, and your image should look like the
    one in Figure 11.12.


    # Figure 11.12


    Now it''s starting to resemble a bowl.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_168_1.png)


    All you need to do now is shade the inner portion of the bowl. Because your imaginary
    light source is coming from the upper-left, it is shining into the bowl at an
    angle, lighting the inner portion, with the left side of the bowl shadowing. To
    get to look right, use the transparent to black custom gradient that you made
    previously, but this time you will apply it in the opposite direction.


    Open the Gradient dialog box and click on the trans-to-black gradient to select
    it. Activate the Gradient tool and, with Radial as the gradient option, and Custom
    as the blend option, blend the gradient to the far right side of the elliptical
    selection and drag to the left. Deactivate the selection, and your bowl is complete
    (see Figure 11.13).'
  merge: -1
  pgno: 168
- img_proc: true
  md: '# FIGURE 11.13


    The Gradient tool plays a major part in achieving a realistic look.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_169_0.png)


    Okay, that was pretty easy, wasn''t it? Now take the bowl you created and add
    a perspective shadow to give it one more touch of realism. While there is a perspective
    shadow filter in the Script-fu options, you can do this one by hand so that you
    get a better understanding of how a perspective shadow works.


    By noticing where the light source is coming from, you can judge where the shadow
    will fall. An easy way to understand this is to think of how the shadows around
    your house fall at different times of the day. At high noon, there are no shadows
    because the sun is directly above you, and as it slowly moves to west, the shadows
    get longer and longer on the east side. Thinking realistically in those terms
    then, because the light source was on the left of the bowl, the perspective shadow
    naturally fall to the right.


    The first step is to select the bowl. Now open the Layer dialog box and add a
    new parent layer name Shadow. In this new layer, fill the selected area with black
    (gray if you want a lighter shadow). To get the shadow to fall to the right, activate
    the Transform tool and choose Perspective. Grab the upper corners of the selection
    one at a time and drag to the right until the shadow appears to be falling correctly
    according to the light source, as in Figure 11.14.


    # FIGURE 11.14


    The shadow layer can be manipulated into shape using the Transform tool.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_169_1.png)'
  merge: -1
  pgno: 169
- img_proc: true
  md: '# Special Effects


    Deactivate the selection and apply a Gaussian Blur, just as you did for the drop
    shadow.

    Move the shadow underneath the bowl layer, and there you have it. You can lower
    the opacity in the layer if the shadow is too dark (see Figure 11.15).


    # FIGURE 11.15


    The effect is accomplished by blurring and moving the shadow layer under the bowl
    layer.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_170_0.png)


    # Stained Glass Effect


    There are many different ways to get a stained glass look. After you start experimenting,
    you might find that it''s easier than you imagined. To get started, you''ll create
    a stained glass image.


    Open a new image window (white) in a large size enough to be comfortable to work
    with. The first thing you''ll do here is make the basic outline of the lead that
    will hold the glass panes together. Open the Layer dialog box and add a new transparent
    layer. Name it *Lead*. (You''re going to be using the original paint layer later
    on, so don''t delete it.) Set the foreground color in the toolbox to a medium
    gray.


    To make the outline design, use the Paintbrush tool to draw in the lines. Or as
    I''ve done in Figure 11.16 and use a combination of straight lines and form shapes
    with the different selection tools using the Stroke function. The stroke size
    is controlled by the brush size, the lines will all match. (Here I am using a
    brush called Fuzzy 05).


    Now to give the lead some depth and thickness. Right-click and select Filters,
    Map, Bump map. When the options box appears, leave the default settings, but make
    sure you have the correct layer (lead) selected under the Bump option. Apply the
    filter.


    Add a new transparent layer (name it *Color*) and lower it under the Lead layer.


    With the Color layer activate, use the Fuzzy Select to select an area within the
    lead lines. (To do this, make sure that Sample Merged option is checked in the
    Fuzzy Select options.) To ensure that the selected area goes right in the lead
    lines, you might want'
  merge: -1
  pgno: 170
- img_proc: true
  md: 'to right-click, and choose Select, Grow (by about 2 pixels or so). Use the
    Bucket Fill tool to fill the selection with a color of your choice. Repeat the
    Select, Grow, and Bucket Fill steps for each of the other areas between the lines,
    using a different color for each until the image is completely colored in, as
    in Figure 11.17.


    # FIGURE 11.16


    Straight lines and stroked selections are good for drawing a simple design.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_171_0.png)


    # FIGURE 11.17


    You can make the stained glass as colorful as you like, or use one color for all
    the panes if you''d want a more monochromatic look.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_171_1.png)


    It''s getting there, but let''s add a little texture to the glass panes. Add another
    transparent layer and call it Texture. Lower it to just under the Color layer.
    Right-click on the image and choose Select, All. (The reason to select the entire
    layer is because you are going to use the Bucket Fill tool. Remember that the
    Bucket Fill tool must have either a selection or an area of color to fill. ...
    ) Now open the Pattern dialog box and choose a pattern that has a good rough texture
    to it. (Here I''ve chosen one called Green 3.D.) Use the Bucket Fill tool (set
    to Pattern Fill) to fill the new layer with the pattern. Because you want to use
    this texture from this pattern, but not the green color, right-click and select
    Image, Colors, Desaturate.'
  merge: -1
  pgno: 171
- img_proc: true
  md: '# Special Effects


    Now you need to blend the layers so that the texture can be seen through the colored
    panes of glass. Go to the Layer dialog box and set the Blend mode to Overlay in
    the texture layer. Activate the color layer and do the same for it. Your stained
    glass should look similar to Figure 11.18.


    FIGURE 11.18


    The addition of the texture gives it a more realistic appearance.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_172_0.png)


    You could leave it at this, but don''t you want to see some light shining through
    your window?


    Activate the original white background layer. Set the foreground color in the
    toolbox to white and the background color to black. Open the Gradient tool and
    choose either Shapeburst Angular or Radial for the Gradient option.


    Place the cursor in the center of the image and drag to any edge. The light now
    brightens up the stained glass (see Figure 11.19).


    FIGURE 11.19


    A light shining in is a must for a stained glass image.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_172_1.png)'
  merge: -1
  pgno: 172
- img_proc: true
  md: '# Summary


    There are usually several different ways to achieve a particular look. In this
    hour, you learned some of the techniques that are used to create effects. You''ll
    find in the world of graphics, the more techniques you know, the better off you''ll
    be. If you think you''ll never use a specific effect, it can''t hurt to practice
    the techniques and learn how each step works, so you can apply that knowledge
    in various combinations to come up tricks and techniques of your own.


    # Q&A


    +   I''ve seen special effect tutorials for other graphics programs. Can I use
    these same lessons in the GIMP?


    +   Definitely! Most graphics tutorials can be easily translated to work in the
    GIMP. Of course, because all program interfaces are different, you might have
    to experiment a little to find the corresponding tools, filters, and so on. In
    fact, translating other tutorials can be a great learning tool for finding your
    way around the GIMP.


    # Exercise


    For this hour''s assignment, look around the Web and find a graphic that appeals
    to you—try and find something simple yet challenging. Study it and see if you
    can use the tools available in the GIMP to duplicate it (or even improve upon
    it).'
  merge: -1
  pgno: 173
- img_proc: true
  md: '![](img/1e2e1cd1a8efa63a199c864a651e3086_174_0.png)


    # HOUR 12


    # # Using Filters to Improve or Distort Images


    *Filters are one of the best features in the GIMP. With them, you can enhance
    any image and create all kinds of special effects to shock and amaze. Filters
    are perhaps one of the most fun things to use with GIMP, as well as one of the
    most useful.*


    By using filters, you will be able to do things to your images that would take
    quite a while to duplicate by hand. So filters are not only neat to play with,
    but they can also be a tremendous time saver when creating images that you use
    frequently.


    # What Exactly Are Filters?


    Basically, filters belong to a group of functions in the GIMP known as *plugins*.
    A plug-in is an extension to GIMP that lends it added functionality and extends
    its capabilities. A filter, then, is a specific kind of plug-in that is involved
    in manipulating graphics directly to achieve any number of alterations and special
    effects. For the most part, most plug-ins are filters.'
  merge: -1
  pgno: 174
- img_proc: true
  md: 'Plug-in—A piece of code written to interface directly with the GIMP. This allows
    for third parties to augment the GIMP’s already impressive list of features and
    capabilities.


    Filter—Any plug-in that specifically alters an image in various ways to create
    new and unique effects.


    For those of you who have used graphics programs before, plug-in filters in the
    GIMP work similarly to plug-ins in Photoshop and the like. Additionally, there
    are more and more filters being written for the GIMP all the time. (And the best
    part is, to my knowledge, they are all free and open).


    Most of the plug-in filters are not written by the original authors of GIMP, they
    are written by many people from all over the Internet in order to fill a specific
    need. However, this can theoretically mean that some filters are bound to be a
    little useful or well written than others. For the record, I''ve installed every
    GIMP plug-in and 99 percent of them work like a champ.


    Many filters have their own dialog interface, although they tend to follow the
    facto interface conventions and for the most part fit in with the GIMP quite seamlessly.


    # Using Filters


    You use filters just like you would any other GIMP function—right-click, and go
    to the Filters submenu. From there, you will have access to a whole plethora of
    special effects that you will doubt spend hours playing with over and over. The
    selected filter will then either apply the effect or pull up a dialog box from
    which you can select options.


    # Filters that Come with the GIMP


    If you installed the GIMP from the CD-ROM that comes with this book, chances are
    you already have access to most of the plug-ins available at this time. However,
    I will begin with the simplest of plug-in filters that come with the GIMP.


    The graphics filters in the GIMP are all accessible by right-clicking the Filters
    menu. From there, you will see all the filters sub-categorized into different
    menus.


    You are going to begin using filters that are most commonly used to improve photos
    and images.'
  merge: -1
  pgno: 175
- img_proc: true
  md: '+   * **Randomization Seed**—A value that the plug-in uses in order to create
    a random blur value—this can be anything. But unlike most filters, one lets you
    choose the value you want to use for a randomization seed, instead of just picking
    one for you. (I fail to see where this could be useful, but it is kind of empowering.)
    In any case, the seed can be based on the current time or on a value you supply.

    * **Randomization %**—The amount that the randomized Blur function is applied
    to your image. This, more or less, alters the amount of blur.

    * **Repeat**—The number of passes the filter uses to blur your image. As with
    anything, the more times it is blurred, the deeper the blur effect.'
  merge: -1
  pgno: 176
- img_proc: true
  md: '# Gaussian Blur


    Below the Blur option on the Filters menu you will see two Gaussian Blur filters:
    IIR and RLE. They do essentially the same thing, let you blur an image by varying
    degrees.


    Supposedly, IIR is somewhat faster for photographic quality images whereas RLE
    is better for line art and such. (I have never seen any difference between the
    two.) In any case, to use a Gaussian blur, select it from the menu, and a dialog
    box will appear as in figure 12.2 (in this case the RLE dialog box).


    Figure 12.2

    These blur filters are a little more straightforward—if not as feature-laden.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_177_0.png)


    The Gaussian Blur options include the following:


    +   * Blur Horizontally and Blur Vertically—Defines how the blur is applied—by
    selecting both of them your blur is applied evenly on both planes.

    * Blur Radius—Controls the radius of the applied blur (how many neighboring pixels
    are affected). The higher the number, the more intense the blur.


    # Pixelize


    Another blur filter is called Pixelize. Stated simply, it distorts your image
    by enlarging the pixels, creating an image much like the masking of anonymous
    faces on the six o''clock evening news (see Figure 12.3). You can set how large
    you want your pixels to be, as well.'
  merge: -1
  pgno: 177
- img_proc: true
  md: '# Using Filters to Improve or Distort Images


    # FIGURE 12.3


    Well... maybe not a true improvement in this case. Pixelization is a neat effect.
    Sometimes it can add that “digitized” feel to an image.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_178_0.png)


    # Motion Blur


    Motion blur—now here’s a cool effect (if used in the right place). It emulates
    an object in motion by applying a custom directional blur. This adds the effect
    of motion trails that are universally recognizable.


    Of course, slow shutter-speed, or really bad photography, this effect in real
    life. In some cases, it does capture the effect of a fast moving object. (Or just
    shaky hands!) Whatever effect you’re going for, this filter works quite nicely
    (see Figure 12.4).


    # FIGURE 12.4


    As you can see, this effect can be valuable with many graphics and photos. Notice
    how the effect makes the truck appear to be traveling high speed, while the same
    effect makes the second picture seem to have a shaky-handed photographer.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_178_1.png)


    In the Motion blur dialog box, the Length option refers to the length of the trail
    effect.'
  merge: -1
  pgno: 178
- img_proc: true
  md: 'The Blur type options enable you to choose from three blur effects, one of
    which

    (Linear) is shown in Figure 12.4, and the other two are shown in Figure 12.5.
    These

    effects are great for experimentation.


    # FIGURE 12.5


    Changing the blur type

    can make quite a difference.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_179_0.png)


    Angle sets the direction of the blur trail in degrees of a circle.


    # Enhancing Your Images


    The next filters are those that do the opposite of blur; they attempt to sharpen
    and

    enhance graphics. It''s been my experience that applications are usually better
    at blurring

    images than at sharpening them. There are, however, certain situations where using
    these

    filters sparingly can vastly improve the quality of your image, as shown in Figure
    12.6.

    By following flows, cleaning out anomalies, and adding just a touch of desired
    effect, it

    possible to rescue those photos that might have been unusable before. This means
    mak-

    ing appear without any visible signs of digital alteration.


    # FIGURE 12.6


    Making a fuzzy image

    look much cleaner and sharper.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_179_1.png)'
  merge: -1
  pgno: 179
- img_proc: true
  md: The Despeckle dialog box, (shown in Figure 12.7), shows that you can use this
    filter with or without the Adaptive and Recursive options. Adaptive will try and
    determine the
  merge: -1
  pgno: 180
- img_proc: true
  md: '# Hour 12


    best radius value for you. (Sometimes this works well, and sometimes it doesn’t).

    Recursive, in effect, increases the intensity of the effect—sometimes a little
    too much.

    (Recursive applies more effect in a smaller radius size.) By using these options
    together, you get an effect that’s recursively applied in an adaptively sized
    radius (as same as adaptive, but a little stronger).


    Black Level and White Level options are also available. Use Black Level to repair
    damage on darker pixels, and use White Level for lighter pixels.


    # NL Filter


    The NL filter tries to combine the best of the Sharpen and Despeckle filters.
    In fact, this is actually a combination of filters (see Figure 12.8).


    FIGURE 12.8

    Attempting to clean this spotted image up a bit.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_181_0.png)


    The Alpha Trimmed Mean filter is a lot like the Despeckle filter—it tries to remove
    image noise. It also works much the same way as the Despeckle filter. You can
    adjust the radius as you would in Despeckle, and the Alpha variable in this case
    changes the behavior of the filter. A lower value will smooth pixels, as in a
    blur filter, and a higher alpha will try to depict the image.


    Optimal Estimation is another smoothing filter that is similar in effect to Alpha
    Trimmed Mean. It works by determining the optimal range of color values within
    an area of surrounding pixels.


    Edge Enhancement is similar to the Enhance filter—it tries to unblur an image
    by brightening and sharpening the edges (areas of contrasting color) in an image.'
  merge: -1
  pgno: 181
- img_proc: true
  md: '# Using Filters to Improve Distort Images


    # Destripe


    The Destripe filter tries to fix images with muddy stripes (or snail trails) on
    them—usually a result of a poor scan job.


    # Noise Filters


    Noise filters are useful for a number of things. They can improve images that
    have too much contrast between color boundaries or are too sharp. Also, they can
    be used to add a different texture to an image.


    # Noisify


    This filter, shown in Figure 12.9, lets you add and adjust random noisy pixels
    in an image.


    FIGURE 12.9

    Adding texture with the noise filter.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_182_0.png)


    Each RGB channel is individually adjustable. A value of 0 is no noise, and a value
    of 1 is total garbage. Obviously, this filter should be used with subtlety.


    # Randomize


    This filter is similar to Noisify, but with many more options and effects (see
    Figure 12.10). It shifts the colors of the pixels in the graphic. The Randomization
    types determine how this filter accomplishes this.'
  merge: -1
  pgno: 182
- img_proc: true
  md: '168


    Hour 12


    # FIGURE 12.10


    Randomize is a good effect for adding many different tones and textures to your
    photo. (Who picked the names Hurl, Pick, and Slur, anyway?)


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_183_0.png)


    +   - Hurl—Changes a pixel''s color to a random value.

    - Pick—Picks a color value to apply to a pixel from a randomly chosen neighbor.

    - Slur—Chooses the neighbors above a pixel for a color value. This results in
    a slightly different effect than Pick.


    # Spread


    Spread does what it sounds like—it spreads pixels around in any direction and
    amount you choose. This can be useful for creating animations with fade-outs and
    so forth (see Figure 12.11).


    # FIGURE 12.11


    Spreading an image can create a unique and very cool effect.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_183_1.png)


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_183_2.png)'
  merge: -1
  pgno: 183
- img_proc: true
  md: '# Using Filters to Improve Distort Images


    The Spread filter, if used sparingly, is great for reducing the effect in gradients
    commonly known as banding. Banding is where the gradient shift is so pronounced
    that the individual colors are visible in banded lines, especially on video hardware
    that renders less than 24-bit color. This is not a good effect; a little spreading
    can fix this (see Figure 12.12).


    By setting your subtlety, you can add just enough randomness to riot your image
    of that annoying banding. By the way, this effect is great for use on HTML documents
    with gradient background images. You''ll achieve a much smoother effect this way.


    # Figure 12.12


    This effect might be difficult to spot in a black-and-white book, so you may want
    to try it out yourself. Also, sometimes the Random filter works better on gradients
    than the Spread filter does. It just takes tweaking.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_184_0.png)


    # Obtaining Filters


    To obtain new plug-in filters, you need no further than www.gimp.org. You will
    find a site called The GIMP Plug-in Registry. It has a database of all registered
    plugins for you to scroll through and choose from. Most of these are filters,
    although other functions are available here as well. Download and compile those
    you. If course, for now you are concerned only with the effects filters specifically,
    and luckily those are generally the easiest to install.


    To install a graphics filter, you need to untar/zip the file, read the README
    document, and run the plug-in installation tool called gimptool, like this


    ```

    tar xvzf plugin.tar.gz

    cat README | more

    gimptool —install-bin plugin

    ```'
  merge: -1
