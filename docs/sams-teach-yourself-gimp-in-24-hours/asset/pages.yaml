  md: '# Dedication


    We dedicate this book to you, our readers, whether aspiring or accomplished artists.
    It is our hope in writing this book, we have provided you with a diverse look
    at how the GIMP functions, and practical applications for its use.


    # Acknowledgments


    It''s amazing how many people are involved in a project such as this one. We''d
    like to thank, first and foremost, the two men responsible for the GIMP itself,
    Peter Mattis and Spencer Kimball. Thanks guys, for creating such a cool and inspiring
    program. Next we''d like to thank David Fugate, our agent at Waterside Productions,
    for helping us get the gig. A very special thanks to our favorite editors at Macmillan
    Publishing, Dustin Sullivan and Tom Dinse, and of course to all the other folks
    at Macmillan who were involved in bringing the project to completion. Also, many
    thanks to Zach Beane, for taking on the task of technical editing. And finally,
    a big thank you to Robert Pruitt, for his support and encouragement throughout,
    and to Jasari, our favorite lion at the Nashville Zoo, who was kind enough to
    stand still and be photographed for book illustration purposes.'
