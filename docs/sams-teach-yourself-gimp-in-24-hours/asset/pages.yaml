  md: '# Basic GIMP Tools


    FIGURE 3.11


    The Fill Tool Option dialog box enables you to use the tool in many ways.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_52_0.png)


    +   - Opacity—Refers to the see-through quality of the color or pattern used as
    a fill. You can adjust this incrementally to let more or less of the background
    seep through.


    +   - Fill threshold—Approximates the area to fill by looking at the surrounding
    pixels and determining if they are close enough to the one selected and whether
    or not fill them as well. For example, a setting of 1 would mean that only the
    color you click on will be filled. The maximum setting of 255 will fill the whole
    image or selection regardless of color.


    +   - Fill type—Lets select what you want to fill your selection with, a color
    or a pattern. You can select any color using GIMP’s Color Selection dialog box
    by double-clicking the Foreground color on the toolbox.


    > Patterns are accessible from File, Dialogs, Patterns in the Patterns menu. Patterns
    are interesting, repetitive designs that can be used to fill in a selection or
    background to add texture. You can select a pattern in the Pattern dialog box,
    and then fill an image with that to create interesting effects. Using and creating
    your patterns will be discussed in Hour 4, “Using Brushes and Patterns in Depth."


    NEW TERM


    # Gradient Tool


    The Gradient tool will enable you to draw a gradient (transition between two or
    more colors) into your image or selection (see Figure 3.12). You can do this in
    many different patterns and color combinations. You can also create custom gradients
    using the Gradient Editor, which will be thoroughly detailed in Hour 7, “Working
    with Color."


    FIGURE 3.12


    Gradient fills can add a lot of tone and realism to your images.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_52_1.png)'
  merge: -1
  pgno: 52
- img_proc: true
  md: '# The Foreground/Background Color Selector


    As long as you''re covering the topic of color, you should go ahead and learn
    how to use this tool, shown in Figure 3.13, because it is a vitally important
    one.


    FIGURE 3.13


    The Foreground/Background Color Selector is primarily what you will use to deal
    with color when working in the GIMP.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_53_0.png)


    The foreground color is used by your tools—Paintbrush, Pencil, Airbrush, Bucket
    Fill, and Gradient (the first color). The background color is used by the Eras
    tool when cutting a selection from an image, and acts as the endpoint of gradients.


    You can access the GIMP Color Selection dialog box by double-clicking on either
    the foreground or background color icons in the box (see Figure 3.14). Now you
    can select any color available by either dragging the cursor through the spectrum
    and color boxes, or by specifying any value with the sliders and text boxes. The
    sliders control Hue, Saturation, Value, Red, Green, and Blue. By clicking the
    Close button, you have made your color select active, which you can use with any
    tool.


    FIGURE 3.14


    The Color Selection dialog box lets you pick any color to use with your tools.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_53_1.png)


    The little arrows on the Foreground/Background Color Selector tool allow you to
    swap the foreground and background colors. And the little black-and-white boxes
    in the lower-left corner bring the colors to the default black and white.


    # Text Tool


    The GIMP Text tool is very useful, especially in regards to creating graphics
    for on the Web. It enables you to insert text anywhere into your image. And because
    text is treated essentially as a selection, you can insert it into anything as
    you would a selection—fill it with patterns, gradients, or alter it any number
    of ways (see Figure 3.15).'
  merge: -1
  pgno: 53
- img_proc: true
  md: '# Basic GIMP Tools


    FIGURE 3.15


    The Text could arguably be one of the most useful tools in the GIMP. With it,
    you can not only create simple text, but used in conjunction with the other tools
    and plug-ins, it can create really neat effects, which is almost essential in
    creating a look for your Web site.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_54_0.png)


    # Using the Text Tool


    Clicking on the Text Tool will change the cursor over the image into an I-beam.
    To insert some text, click the mouse over the image. This brings up the Text dialog
    box, as in Figure 3.16.


    FIGURE 3.16


    The Text Tool dialog box.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_54_1.png)


    Near the bottom of the Text Tool dialog box, you will see a blank text space.
    This is where you need to type in your text. After this has been done, look toward
    the left side of the dialog box to see a listing of the fonts that are available
    to the X Window System. By clicking on any one of these, your text will be previewed,
    in that font, right where you typed it.'
  merge: -1
  pgno: 54
- img_proc: true
  md: '# Hour 3


    At the top of the dialog box, you will see an option for text size. The implication
    here is obvious. Type in any text size, click Enter, and your preview will be
    updated.


    Foundry refers to the maker of the font. This can be important when dealing with
    fonts that have the same name but are made by different individuals or companies.


    Other Options are available on the dialog box well, such as Slant (Italics), Weight
    (Bold), Set Width (Spacing), and so forth.


    After your text appears how you want it, click OK, and your text will be the active
    foreground color in the Foreground/Background Color Select box in the toolbox.
    You can move your cursor to any position in the page. Or, because it is an active
    selection, you can apply any pattern, fill, gradient, or effect to it. You will
    practice many of these effects as you continue throughout the hours in this book.


    # Using X Fonts with the GIMP


    X supports many styles of fonts. In using the GIMP, you will likely want to increase
    the volume of fonts available to use on your system. (The fonts that come with
    X are pretty dull). On the CD-ROM, in the Fonts directory, there are two font
    packages: shefonts.tar.gz and freefonts.tar.gz You should look into installing
    these. Uncompress them into /usr/X11R6/include/X11/ directory, read the READMEs,
    and follow the directions. These font packages can also be downloaded from many
    Linux FTP repositories, such as Red Hat''s pub/contrib directory.


    You will find that your native X fonts are located in subdirectories of /usr/X11R6/lib/X11/fonts
    (or variant thereof, on different systems). If you ever want to add or remove
    fonts from the future, you''ll know where to go. I''ve also found it helpful to
    remove extraneous fonts by deleting them and editing out the reference to them
    in the files directory. The Far Eastern are good candidates for deletion (unless
    you really need them), and they do take a long time to render.


    Although these fonts are pretty good, I am still itchin'' to utilize my collection
    of TrueType fonts with the GIMP. Fortunately, X can be supportive of those two—with
    a little assistance. In order to use TrueType, you have to install and run a TrueType
    Font Server. This isn''t too difficult, either. All you need to do is acquire
    the xfst TrueType Font Server and install it. It, too, is available on the CD-ROM
    in the font directory as Xsfst.tar.gz. Unzip it into your directory, compile it,
    and install it as follows:


    ```

    make && install

    ```


    Create the directory /usr/ttf/, and copy your favorite TrueType TTF files there.
    Run xfst sync to load the fonts.'
  merge: -1
  pgno: 55
- img_proc: true
  md: '# Basic GIMP Tools


    Start xfstst as a background process:


    ```

    xfstst &

    ```


    Tell the running X11 server about the new font service:


    ```

    xset +fp unix::/7100

    ```


    Add the new font path to the X11 config file (probably /etc/X11/X86Config):


    ```

    FontPath "unix:/7100";

    ```


    You should be able to bring up the GIMP Text dialog box and see your TrueType
    fonts there. After installing xfstst, you might then want to start it automatically
    every Linux boots (that Linux ever needs rebooting) by adding a reference to it
    in /etc/rc.d/rc.local. This keeps you from having to start the TrueType Server
    every time you start X. One caveat: if you do, make sure that you add the full
    pathname to rc.local, as in /usr/X11R/bin/xfstst , especially if you use xdm to
    start a graphical login automatically on startup.


    Also, you might not want to load in every single TrueType font you own, but instead
    be selective with the type you want to use with Linux. Xfstst is a handy application,
    but it can suck up a little RAM if you load 200+ fonts. I''ve found it''s best
    to use only 30 or so of the very best fonts instead. And finally, there are other
    TrueType servers out there as well, although I have not personally used them yet.
    One server is called xfstst, which uses the FreeType library and has had a lot
    of positive review. It''s available online everywhere xfstst is, so you might
    want to check it out. You can grab a RPMs of Free86 with integrated TrueType font
    support via xfstst from http://www.darmstadt.gmd.de/~pommitz/xfstst.html.


    # Summary


    The essential concepts in dealing with a graphics application as the GIMP have
    been covered during the first three hours. Before any real techniques can be applied,
    you must have an understanding of the basic tools illustrated here. In the next
    few hours, you will move on to mastering these concepts in order to create some
    interesting images and effects. You might be surprised at what can be accomplished
    using only these simple tools. And, gaining mastery over them will give you an
    edge when confronted with specific graphics issues, such as image restoration
    or simple manipulation.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_56_0.png)'
  merge: -1
  pgno: 56
- img_proc: true
  md: '# Q&A


    +   Q When selecting fonts, the GIMP freezes up and won’t do anything.


    +   It is likely that you have inadvertently selected one of the Far Eastern fonts
    that come with Linux. The GIMP isn’t really locked up, but if your video card
    is like mine, it is taking its sweet time rendering these fonts. (The glyphs are
    quite complex in these fonts). You might want to avoid these fonts in the future,
    or delete them altogether.


    # Exercise


    You might be wondering how much you can accomplish using these ordinary tools.
    Well, in order to gain an understanding of them, you must use them. I suggest
    that you start experimenting right away. Try opening a new palette, and begin
    to paint simple shapes and textures with the tools outlined here. You can start
    off with simple things, such as geometric shapes, logos, buttons, or even hand-crafted
    text. Then try emulating some real-world objects and textures—the Gradient Fill
    to create metal, or the Airbrush to create mist. As you move along in the hours
    ahead, you will come across easier and more efficient ways of doing these things,
    which will in turn increase your mastery at a faster pace. Then the real fun stuff
    begins.'
  merge: -1
