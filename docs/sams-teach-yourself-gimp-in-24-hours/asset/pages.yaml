- img_proc: true
  md: '![](img/1e2e1cd1a8efa63a199c864a651e3086_58_0.png)


    # HOUR 4


    # Using Brushes and Patterns in Depth


    Congratulations! You''ve put in some time and learned the elementary GIMP basics
    during the first three hours. At this point, you are probably starting to understand
    the interface and recognize the many tools you have to work with.


    Now it''s time to graduate to some of the fun stuff, really focus on the various
    aspects of the program, and learn how wonderful and versatile it can be for creating
    and editing graphics.


    This hour concentrates on the wide array of brushes and patterns—including the
    Brush and Pattern dialog boxes, the options, and even how to turn your own creations
    into custom brushes and patterns—and look at different ways they can be put to
    work in your graphics.'
  merge: -1
  pgno: 58
- img_proc: true
  md: '# Using Brushes


    In Hour 3, “Basic GIMP Tools,” you were introduced to the tools in the GIMP toolbox.
    For the first part of this hour, I''ll direct your attention to the tools that
    will more than likely become some of your favorites—the painting and drawing tools.


    By activating any one of these tools, you''ll have at your disposal an entire
    collection of brushes containing a variety of appearances and textures.


    # The Brush Settings


    By going to File, Dialogs, Brushes, and using the brush Selection window, as shown
    in Figure 4.1. Your choice of brush settings can be applied using any of the painting
    and drawing tools (Pencil, Paintbrush, Eraser, Airbrush), the look and feel dependent
    on the characteristics of the particular tool. The Paintbrush yields a much softer
    appearance, for instance, whereas the pencil gives a hard-edged look.


    FIGURE 4.1

    The Selection window offers many brush choices.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_59_0.png)


    In the left area of the window, you can see an assortment of preinstalled brush
    tips, ranging in size and shape from a tiny circular to textured tips, and even
    that are made from images.


    When you select a brush by clicking on it, notice the brush name and size (in
    pixels) show in the right area of the window. The GIMP works a little differently
    than most graphics programs in relation to brush size. There is no जिक्र where
    you can adjust the size via a slider or numerical value. You simply choose a brush
    in the size you want to use. By clicking and holding on the thumbnail image of
    each brush, you can see the size as it appears when used.


    > Large brushes cannot easily be seen in the browsable brush thumbnails of the
    brush select dialog box. If you can''t find a particular brush, by clicking and
    holding on the thumbnails that appear to be blank.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_59_1.png)'
  merge: -1
  pgno: 59
- img_proc: true
  md: '# Using Brushes and Patterns in Depth


    Underneath the brush name is an option Mode. This is where you can change the
    blend mode. Blend modes are primarily used in conjunction with layers and are
    discussed in depth in Hour 9, “Hands-on Layering.” For now, leave the mode setting
    on Normal.


    # Opacity


    The next setting is the opacity, which is controlled by a slider with values ranging
    from 0–100. Setting the slider to 0 enables total transparency in the brush, whereas
    the 100 setting is totally opaque. Think of the opacity as paint thinner, diluting
    your paint to the point of transparency when applied to an image.


    # Spacing


    This setting is also controlled by a slider and is used to determine the space
    between brush strokes. If you look at Figure 4.2, you can see if you want to paint
    in a smooth continuous line, you should set the spacing low. A higher setting
    separates the strokes of the brush by the desired amount, resulting in a totally
    different look. You might want to experiment with the Spacing using different
    brush tips.


    # Figure 4.2


    The top line shown here was drawn with the spacing set to 0, and the bottom spacing
    gradually increased in the following lines.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_60_0.png)


    # Tool Options


    Double-click on the Paintbrush tool to bring up the options box, as in Figure
    4.3. You’ll take a more in-depth look at what these two options can accomplish,
    now that you’re familiar with the brush settings.


    # Fade Out


    This option is used to create a gradually diminishing color effect, as shown in
    Figure 4.4. By setting the numerical fade value, you can choose how many pixels
    are colored in the brush before the fading effect actually begins. To fade entirely
    uses out approximately three times the amount of the set value. Setting the fade
    out value to 0.0 (which is the default setting) disables the effect.'
  merge: -1
  pgno: 60
- img_proc: true
  md: '# FIGURE 4.3


    The Paintbrush also has some unique options you can set in the tool option box.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_61_0.png)


    # FIGURE 4.4


    Shown here are several different brushes with the fade effect applied.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_61_1.png)


    # Incremental


    When you drag the Paintbrush swiftly across an image, it appears to be painting
    in a continuous line. However, if you drag it across very slowly, you''ll notice
    that it is actually adding one increment at a time of the shape of your chosen
    brush tip. Choosing the Incremental function in the tool options enables you to
    see the overlap of these increments in the painted line, as in Figure 4.5. This
    is visible only when you are painting with the brush settings at a reduced opacity.
    The following steps show you how this feature works:


    +   * Open a new image with a white background.

    * Set the foreground color to black.

    * Open the Brush dialog box. Choose a large brush, such as the circle(19). Set
    the opacity to around 50 and spacing to around 70 or so.

    * Double-click the Paintbrush, set the fade to 0, and leave the Incremental option
    unchecked. Paint a line across your image.

    * Now check the Incremental box and paint another line under your first one, and
    you''ll see how the Incremental option functions.'
  merge: -1
  pgno: 61
- img_proc: true
  md: '# Using Brushes and Patterns in Depth


    FIGURE 4.5


    The Incremental option at work.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_62_0.png)


    # Making Custom Brushes


    As you play and experiment with the numerous brushes that are included in the
    GIMP, you will find that the uses for these brushes are virtually unlimited—from
    creating textures to making matching sets of brush images that you can use and
    over in your graphics.


    Because basically any image can be resized, grecaled, and saved as a brush (thereby
    gaining access to the varied brush options), the capability to create custom brushes
    presents some interesting ideas on various ways to put them to use. You’ll explore
    two possibilities here.


    # A Custom Graphic Brush


    Find or draw a small simple graphic on a white background that you would like
    to make into a brush, such as in Figure 4.6.


    FIGURE 4.6


    Simple images make the best brushes.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_62_1.png)


    The first step is to grayscale the image. Right-click on the image and go to Image,
    Grayscale. Your image now appears in shades of gray, as if you were looking at
    it on a black-and-white television set.


    Next you are ready to invert the colors by right-clicking on the image and going
    to Image, Colors, Invert. This causes your image to show up as a negative, but
    when it’s saved as a brush, it reverts back to positive.


    Now you are ready to save it as a brush. Right-click and go to File, Save As.
    Here you need to give your image a name and GBR (GIMP Brush) extension. Save it
    in your personal folder or somewhere you can remember.'
