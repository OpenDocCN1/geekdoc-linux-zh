  md: '# Installation and Configuration


    # Graphics Libraries


    Your operating system (OS) installation, if installed recently or well maintained,
    is likely to have fairly up-to-date graphics libraries available, but you will
    want to make sure you have installed all from the latest versions—to make for
    more stability and less headaches in the installation process. The most recent
    libraries, in source form and in various packaged formats, are provided on the
    CD-ROM. Otherwise, you can find them at many FTP mirrors worldwide, such as


    ftp://ftp.x.org/contrib/libraries/ and ftp://ftp.gimp.org/pub/gimp/libs.

    Here is a checklist:


    +   * aal 1.2 or later.

    * xdelta .20 or later.

    * libpng 1.0.1 or later.

    * libxpm 4.7 or later.

    * libtiff 3.4 or later.

    * libmpeg 1.2.1 or later.

    * libjpeg 6b or later.

    * zlib 1.1.2 or later.

    * ImageMagick (not really required, but it includes support for many file formats,
    and some very handy utilities as well). It can be found at http://www.wizards.dupont.com/cristy/ImageMagick.html.


    # Other Things


    In addition to what is required, you will likely want to have these things installed
    as well:


    +   * XV—XV is an image viewer/editor that a good tool for use in concert with
    the GIMP. Being nearly a staple of any standard X environment, XV is probably
    already installed. If not, you can grab it at any Linux-centric FTP site.

    * SANE—You’ll need this if you want to use a scanner from within the GIMP. SANE
    can be found at http://www.mostang.com/sane/. Using a SANE supported scanner within
    GIMP is a real joy.

    * gzip and bzip2—Enables internal file compression.

    GNU zip and bzip2 are compression formats, such as zip or Infl files. GIMP allows
    for the direct compression/decompression of graphics files within the GIMP environment.
    This is a really handy feature, especially if you find yourself passing unfinished
    files around online or SneNet (carrying pies around on foot). They can be snagged
    at http://www.gnu.org/ and'
