    ![](img/1e2e1cd1a8efa63a199c864a651e3086_50_1.png)


    # The Color Tools


    The Color tools, as you''ve probably guessed, have to do with color, and the way
    it is applied to your images. With these tools, shown in Figure 3.8, you can choose
    and fill selections with color in ways that would be difficult to do using physical
    equipment. But thanks to the wonders of technology, changing and altering colors
    is as simple as moving a mouse. We will go ahead and touch some of their aspects,
    as they will be vastly useful when working with the other tools.


    # FIGURE 3.8


    The Color tools are used for selecting, filling, and creating effects with color.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_50_2.png)


    # Color Select Tool


    The Color Select tool, also known as the Eyedropper, can select any color in your
    image. By clicking on the Tool icon, your cursor will be transformed into a little
    cross-hair, at which point you can pick up a color from any pixel in your image
    (see Figure 3.9). By way of a mouse click, this tool will change the selected
    color box in the toolbar'
