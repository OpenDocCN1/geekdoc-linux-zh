    ![](img/1e2e1cd1a8efa63a199c864a651e3086_111_1.png)


    # Brightness/Contrast


    You can adjust the relative brightness and contrast of any image with this tool
    in the same way that you would adjust the brightness and contrast on your monitor
    (see Figure 7.16).


    # FIGURE 7.16


    This tool is self-explanatory.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_111_2.png)


    # Hue/Saturation


    The tool shown in Figure 7.17 enables you to adjust the relative color of your
    image quickly and drastically. The Master option enables you to alter all pixels
    in the entire image at once, clicking on any color option will enable you to change
    only those pixels within that color range.'
  merge: -1
  pgno: 111
- img_proc: true
  md: '# Working with Color


    # FIGURE 7.17


    The lightness option in this dialog box is synonymous with value in the HSV color
    model.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_112_0.png)


    # Curves


    This tool lets you change the colors and values of your image by manipulating
    a graphical representation of your image''s colors (see Figure 7.18). It is quite
    a complicated tool, but when you play with it enough, chances will you find it
    quite useful. It lets you change the brightness and hue at any point by dragging
    the curve around freely. The curve itself represents your image''s RGB values.


    # FIGURE 7.18


    The Curve tool is both very handy and complex at the same time.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_112_1.png)


    The Value option in the drop-down menu refers to altering all three RGB colors
    at the same time. (Not value meaning brightness, as in HSV. This tool deals strictly
    in RGB.) You can also deal individually with red, green, and blue.


    Why would you use this tool instead of the Hue–Saturation dialog box? Well, this
    tool gives you more control. By changing the Curve Type to Free instead of Smooth,
    you can now move your curve every way to achieve all sorts of funky color effects.
    By inverting a curve, for example, you can invert the image. Likewise, creating
    a parabola of the curve, you can create a color saturated effect that might be
    useful somewhere. In any case, the best way to figure out this tool is simply
    to play with it.'
  merge: -1
  pgno: 112
- img_proc: true
  md: 'By the way, always make sure that the Preview option is checked, so you can
    observe what this tool is doing to your image while it does it.


    # Levels


    Unlike the Threshold tool, the tool shown in Figure 7.19 lets you alter the amount
    of brightness and saturation your RGB values have by adjusting the range of values.
    By moving the arrows at the bottom, you can adjust the brightness and contrast
    output of your pixels. This way, you can enhance or subdue the brightness and
    shadow properties in any part of an image you choose. By moving the black arrow
    to the point where your lines begin to group together, and the same thing for
    the white arrow, you equalize your image''s values to the point where your image
    is not so muddy. As a good clean-up tool, as well as an effect tool.


    Figure 7.19


    The Levels tool lets you alter your image''s brightness and contrast properties
    by manipulating a histogram.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_113_0.png)


    # A Few Others


    Desaturate—Converts your image to grayscale, without actually reducing the color
    depth, so you can still apply color to the image.


    Auto-Stretch Contrast—This tool enhances the contrast and brightness of the RGB
    values of an image by stretching the lowest and highest values to their fullest
    range, adjusting everything in between. This is noticeable only with washed-out
    images and can be a good fix-it tool for bad photographs.'
  merge: -1
  pgno: 113
- img_proc: true
  md: 'Auto-Stretch HSV—The same as the previous tool, except that it adjusts the
    HSV values to its fullest extent. Used for the same purposes, too.


    Normalize—Does the same as the Auto-Stretch tools, but not so drastically. It
    does this by only stretching the values as a whole, and therefore keeping the
    relative color balance intact. This is perhaps the most useful "washout fixer"
    tool, because it will not disturb the colors otherwise.


    # Gradients


    Gradients are a concept presently found in other graphics applications, but no
    other program I have ever come in contact with even begin to compare the intensive
    and extremely powerful use of gradients that the GIMP gives you access to. This
    is really one area that distinguishes the GIMP and makes it a killer app. With
    it, you can draw realism to your graphics that will never amaze.


    A gradient, in the simplest of terms, is the transition from one color to another.
    So a basic gradient is a transition from black to white. Pretty elementary stuff.
    But the GIMP takes it, way, beyond that. Not only does it enable you to place
    gradients in a variety of positions and shapes, but also enables you to create
    custom gradients, using more than two colors (any number you can handle), including
    transparencies. Now this is too cool, as I will later demonstrate. But for now,
    start with something simple.


    In this first tutorial, you will create a simple beveled button with a metallic
    look.


    +   1. Create a new image. This can have any color background you want, although
    transparent is preferred if you''re going to save it as a GIF. After you have
    a blank canvas, you can start selecting a rectangular area with the Rectangular
    Select tool.


    +   2. Now that your selection is made, as in Figure 7.20, fill it in with a simple
    gradient. To do this, you first need to get the colors how you like. For this
    example, I used the default black and white, although you are perfectly free to
    use any colors you want. Then double-click the Gradient tool icon to bring up
    the Tool Options dialog box. (You can also do this by going to File, Dialogs,
    Tool Options on the toolbox.) In the Tool Options dialog box, make sure the Gradient
    drop-down menu is set on Linear, as shown in Figure 7.21.'
