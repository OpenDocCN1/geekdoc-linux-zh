- img_proc: true
  md: '# Working with Color


    # Q&A


    +   Q If I reduce my color depth to grayscale, can I still use colors in certain
    parts of my image?


    +   A No. By reducing to grayscale, you have changed the color model of your image.
    Attempting to add color will simply add shades of gray. If you want to work with
    a black-and-white image and add hits of color to it, the thing to do is to use
    the Desaturation option. That way, your image appears black and white, but it
    is still in RGB image, so you can continue to use color in it.


    +   Q When I reduce my image to an indexed 256-color palette, some of them look
    good others don''t look good at all. What''s up with that?


    +   A It depends on how many colors your image has to begin with. If your image
    consists of many shades of blue, for example an indexed image will create a palette
    consisting of 256 different shades of blue, which should look pretty good. It
    saves space without losing quality. If, on the other hand, every color in the
    rainbow, reducing to 256 colors might not be your best option. If you absolutely
    must save, using the JPEG format might be a better bet. However, if you have to
    save in an indexed format, but the quality is still poor, dithering is one option
    that might help alleviate the problem. Also, by playing around custom palettes,
    you might stumble on one that closely matches the image''s colors.


    # Exercise


    Gradients are a very powerful feature that I''ve only begun to cover here. To
    get used to dealing with gradients, you should think of them as doing more than
    one thing. They add texture, creating light and shadow effects, the illusion of
    certain types of material, and accomplish other such nifty things. A neat thing
    to do with gradients is to experiment with them in various selections using different
    gradient shapes. You will be surprised how different your gradients can look with
    only a few alterations.


    To familiarize yourself with gradients, one really good thing to do is to experiment
    with them as lighting resources. Grab an image, preferably a well-lit one, and
    try out of the gradients with transparencies to create effects of light and shadow.
    Again, a radial gradient that ranges from a subtle light color to transparency
    makes a great lens effect. Likewise, a dark-to-transparent gradient can add enough
    shadow to give an object


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_120_0.png)'
