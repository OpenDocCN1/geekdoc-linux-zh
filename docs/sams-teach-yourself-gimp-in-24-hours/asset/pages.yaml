  md: '# Working with Color


    # Gradient Editor


    Now you''ve come to the good stuff—the Gradient Editor (see Figure 7.28). This
    tool makes it all worthwhile. It enables you to move beyond one color and make
    custom gradient using any combination of colors you. Using these gradients makes
    it possible to generate photo-realistic lighting and shadow effects, landscape
    effects, and a plethora of other things.


    To get to the Gradient Editor, go to File, Dialogs, Gradient Editor in the toolbox.


    FIGURE 7.28

    The Gradient Editor gives you access to all kinds of advanced gradient functions.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_118_0.png)


    After you have the Gradient Editor open, as shown in Figure 7.28, you can scroll
    through a list of predefined gradients and they will be previewed in the box at
    the bottom. After you have selected a gradient, you can apply it to your image
    by going to the Tool Options dialog box and selecting Custom Gradient from the
    Blend pull-down menu.


    After you have selected a custom gradient, there are all kinds of nifty options
    to play with. With any of the colors in the gradient finish by right-clicking
    on an active segment and selecting Left Endpoint''s Color or Right Endpoint''s
    Color. This brings up the Color dialog box so that you can alter the color. An
    active segment is any between black arrows that is a darker shade of gray. You
    can activate any segment you want and move the segments around the black arrows
    to change the shape and feel of your gradient. The white arrows represent segment
    midpoints, and changing their position will not move the segments but will alter
    the segment color balance.


    You can create a new gradient by clicking New Gradient. Learning this powerful
    editor and all its options can be tricky, but it is very useful and is of those
    things that is best learned by experimentation.


    But wait...there''s more!'
  merge: -1
