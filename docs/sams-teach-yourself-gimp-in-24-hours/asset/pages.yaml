    speed up and smooth out your animation. All frames default to 100ms, or 1/10


    # FIGURE 23.3


    The animation starts to take shape. You can probably already see where it is going.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_319_0.png)


    # FIGURE 23.4


    Playing back the animation to see if it was sketched out the first time. Sometimes
    the animation is too choppy, more frames will need to be added to smooth out the
    effect (or subtracted to save).


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_319_1.png)'
