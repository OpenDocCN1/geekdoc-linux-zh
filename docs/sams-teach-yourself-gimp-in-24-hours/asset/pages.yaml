- img_proc: true
  md: 'very cool function you can find in the menu is called New View. This works
    by opening one or more duplicate windows of your image to show any changes you
    apply to the original. For instance, if you are working on an image where you
    need to zoom in a great deal, the duplicate window can show the effects of the
    changes on a non-zoomed duplicate that you don''t have to constantly zoom in and
    out to see whether the changes you make are achieving the desired results.


    # Crop


    The Crop tool works by enabling you to choose an image area and eliminate any
    unwanted edges by cutting them off, like trimming a photograph with scissors.


    Open an image and click the Crop tool to activate it. Move the cursor over your
    image to the place you want to begin the crop.


    By clicking and dragging diagonally across the image area, you should notice rectangular
    lines forming an outline to show the selected crop area, as shown in Figure 6.4.
    As you release the mouse, a crop window pops up on the screen with information
    about the crop area, including the size of the crop width and height, which can
    come in handy if you need an image to be a specific size. The crop window also
    shows the X and Y origin of the upper left point of the crop area. The rulers
    in the image as you drag the crop area. The X (horizontal) origin is the amount
    in pixels from the left side of the image window to the left side of the crop
    area, where the Y (vertical) origin is the pixel amount from the top of the image
    window to the top of the crop area.


    By pressing the Crop button located at the bottom of the crop window, you automatically
    trim the extraneous edges from your image and drop it to the chosen size. This
    works snapping the crop lines to the edges of an active selection area; it comes
    as close as it can to the actual selection, yet still maintains the rectangular
    crop shape. You can then click the Crop button to perform the crop.


    Two extra crop functions are in the menu. With an image open, right-click and
    go to Image, Transforms, and you can see autocrop, which automatically removes
    any solid bordered from an image. The other is zealous crop, which cuts off areas
    of highly contrasting color surrounding an image area, such as a border.'
  merge: -1
