    frame in its entirety (traditional flip-book animation style). And Make Frame
    from Cumulative Layers (Combine) enables you to show each new frame on top of
    each previous frame (using the optimization techniques outlined next, this is
    similar to using a separately painted background image on top of which your subjects
    interact—like LooneyTunes and other cartoons were made before


    # FIGURE 23.5


    The Save As GIF dialog box adapts itself to dealing with animations.


