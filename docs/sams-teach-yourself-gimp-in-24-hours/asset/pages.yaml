  md: '# # HOUR 1


    # ## Installation and Configuration


    # ### Bring Out the GIMP


    This hour is designed to assist you through the mundane task of getting GIMP (GNU
    Image Manipulation Program) v.1.0 successfully installed and running smoothly
    on your system—if you haven''t done so already. It is primarily geared for those
    of you who are running Linux 2.0+ on architecture (Intel and clones), although
    the steps laid out here can easily apply to the other UNIX variants and hardware
    platforms as well, with generally little or no alteration involved (most of the
    time).


    I''m assuming that you have some Linux or some UNIX variant and an implementation
    of the X Window System up and running already. However, if this is not the case,
    this hour also briefly touches on getting Linux installed on a PC. There''s really
    no excuse not to try this stuff out.


