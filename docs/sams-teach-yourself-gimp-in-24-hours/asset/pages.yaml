    # GUASH


    GUASH is a simple file previewer program to run within GIMP. It enables you to
    preview your images by way of ordered thumbnails and open selected files accordingly
    in the GIMP, if you choose. Using GUASH is a very convenient feature when dealing
    with directories that contain many graphics files, which in saves time by eliminating
    the need for hide and seek when you can''t seem to remember exactly what you named
    that particular image you''re looking for.


    Starting and using GUASH is simple: select Xtms, GUASH, and you''re ready to go.
    You will see the initialization screen, and then a directory listing of the directory
    you''re in (see Figure 20.6). Navigating GUASH is as straightforward as any modern
    graphical file manager. Click the folders to view that particular directory, open
    graphics files, and so on. You can also move, rename, and delete files within
    GUASH.


    # FIGURE 20.6


    Using GUASH gives you an easily browse graphical representation of your file tree.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_281_1.png)


    After you encounter a directory containing many files, GUASH might take a few
    seconds rendering the thumbnails, depending on the number and size (the machine
    you''re'
