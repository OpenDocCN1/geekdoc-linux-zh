- img_proc: true
  md: '# Artistic Filters


    and most complex ones should be sufficient for assisting you in the tutorials
    ahead, which will purposely utilize some filters you have not yet encountered.


    Filters are truly a blessing. They make short work of otherwise tedious tasks,
    and they’re fun. The only thing you need to be wary of is the overuse of any cool
    new techniques. Truly, in practice, less is more, and an effect used sparingly
    usually has more impact. There have been too many times that I have been guilty
    of wearing out new tricks, and it is even easier to observe in other people’s
    work. A Web site that would be slick, if only it weren’t for the fact that there
    are five lens flares on every page would be a prime example.


    # Q&A


    +   I try to apply a certain plug-in, but it’s gosthed out in the menu.

    Well, if you’ve made sure that your image is in RGB color depth, you might want
    to check for layering. Some plug-ins won''t work with layers, while others require
    them. The presence of another open image, or a selection, can also be an issue.
    It just depends on the filter itself.

    How do I know which .8fs I can use with the User Filters plug-in?

    To my knowledge, only Filter Factory filters work. Any Photoshop filters that
    require the presence of dynamic libraries such as msvert.dll and the like will
    not work under GIMP, which is to say any filter that behaves like a separate application
    will not work. That’s what GIMP plug-ins are for.


    # Exercise


    Tinker with all the filters I did not get to in this hour and see if you can find
    uses for (and there are, many of them). Traditional logic would compel you to
    use the filters you know for purposes need, but sometimes playing with filters
    just to see what they do be an enlightening experience. You may come up with effects
    that you never thought of.


    Try the Lighting Effects plug-in on some of those old photos lying around. A simple
    photo cube and light source is enough to impress the heck out of your friends
    and family, and it’s really not all that difficult to do. (But don’t tell them
    that.)'
