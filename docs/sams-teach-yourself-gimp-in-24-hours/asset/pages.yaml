    # Binary Installation for RPM Enabled Systems


    You can find GIMP on the CD-ROM in the RPM format under /gimp/RPMS/ directory.
    As root, simply change into the directory reflecting your form of choice (that
    is, /mnt/cdrom/gimp/RPMS/) and type the following at:


    ```

    rpm -Uvh gimp-1.0.2.i386.rpm

    rpm -Uvh gimp-devel-1.0.2.i386.rpm

    rpm -Uvh gimp-data-extras.1.0.2.i386.rpm

