    # Working with Transparen


    In any working image, you can have in any area a transparency, which is an area
    of an image with no color. Of course, not every image file format supports image
    transparencies, but for those that do it is a fantastic feature.


    You can create a new image from scratch using transparencies. Simply go to File,
    New and select transparency as Fill Type. When the image pops up, you will see
    that it is covered with a light and dark grey checkerboard pattern, as in Figure
    7.7. This is to let you know that what you are looking at is indeed invisible
    by the GIMP.


    FIGURE 7.7


    A transparent image lets you insert any element without having a background of
    any kind.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_106_1.png)'
