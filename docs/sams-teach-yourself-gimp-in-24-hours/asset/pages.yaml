- img_proc: true
  md: 'As a quick demonstration, I will use this same script, but this time change
    the variables more drastically, thereby showing just how versatile these things
    can be (see Figure 21.7).


    # Figure 21.6


    Gikfontsel is a handy program for previewing and managing your fonts. I regard
    it as an indispensable companion to GIMP and Script-Fu in particular.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_299_0.png)


    # Figure 21.7


    This effect has now taken on an entirely new personality.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_299_1.png)


    # Script-Fu—The Art of Web Graphics


    Of course, Script-Fu is useful for much more than logo creation. One of my favorite
    things about Script-Fu is the simplicity it brings to Web creation. Under the
    Xtns, Script-Fu, Web Page Themes, you will see several scripts grouped together
    that will help you create sets of logos, banners, icons, and things. In Hour 15,
    "Web Graphics," you learned about GIMP in relation to making Web sites, but I
    did not mention that you can cheat and make this stuff easily with a few parameters
    and a click of the mouse. It really isn''t hard to find. Look a look, you plug,
    in the font, textures, and so forth, and a Web site is made. The GIMP comes with
    three of these Web pages by default, one of which emulates the look and feel of
    gimp.org—with more of these available for download if you look around a little.
    As a quick demonstration, I used a Script-Fu Web page theme to create a simple
    Web page, as illustrated in Figure 21.8.'
  merge: -1
  pgno: 299
- img_proc: true
  md: '# What the Heck Is Script-Fu?


    # Figure 21.8


    Script-Fu can make the art of creating Web sites quick and pain-.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_300_0.png)


    Here''s a webpage I rigged up using Script-Fu. It''s not the best I''ve ever done,
    but it''s not bad for put together in about 10 minutes. By using a "Page Theme"
