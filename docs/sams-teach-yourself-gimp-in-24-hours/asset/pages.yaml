    One final step to really make this work will be to add shadows to the frame, just
    as you did before the inner mat.


    Activate the Fuzzy Select tool and click in the outer frame area to select it.
    You''ll notice that the top and left sides are the only ones selected because
    they are just lighter in color than the right and bottom sides. You will need
    to press Shift and click on the right side to add it to the selection. Right-click,
    and choose Script-Fu, Decor, Xach-Effect, OK. Deactivate the selection.


    Now, right-click again, and select Script-Fu, Decor, Xach-Effect. Change the x
    and y drop shadow offsets to -2 (minus 2). Click OK; deactivate the selection,
