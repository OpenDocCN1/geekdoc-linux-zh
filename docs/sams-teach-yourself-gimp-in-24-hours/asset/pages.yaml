  md: '# FIGURE 17.1


    This badly damaged photo looks as if it did some time in a wallet!


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_246_0.png)


    # FIGURE 17.2


    By magnifying the area, it''s much easier to work on.


