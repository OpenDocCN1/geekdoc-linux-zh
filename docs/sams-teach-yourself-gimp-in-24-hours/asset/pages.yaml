- img_proc: true
  md: '# FIGURE 6.16


    Making cubes is a fun way to practice transformations.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_99_0.png)


    once again, but this time select the side square and pull it into cube shape using
