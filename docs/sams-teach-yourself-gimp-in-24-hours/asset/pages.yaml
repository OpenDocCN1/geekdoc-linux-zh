- img_proc: true
  md: '# Apply Canvas and Apply Carpet


    These two are so similar so I will cover them at the same time. The Apply Canvas
    plugin-creates a texture map for your image, much like the Paper function in GIMPression,
    and gives the image the appearance of being painted on a certain texture (see
    Figure 13.16). The dialog box gives you many options and can be previewed from
    within the plug-in.


    Apply Carpet does essentially the same thing, except that it adds a carpet texture
    to the picture. This can make the composition look like one of those latch hook
    rugs (found at the local arts and craft store).


    FIGURE 13.16


    You can never have too many textures.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_197_0.png)


    # Light Effects


    The plug-ins that add the illusion of lighting are particularly interesting—especially
    the Lighting Effects plug-in. They can add a measure of depth and realism to your
    image.


    # Lighting Effects


    This filter is pretty complex. If you are familiar with raytracers and modelers,
    this plug works in the same way they handle light. The Lighting Effects filter
    enables you to create a light source and place it in the composition using an
    XYZ coordinate system (although, it must be in front of the image respectively,
    as this is not a true modeler by any means). This and the capability to alter
    the type, intensity, and reflective qualities of the light give you an amazing
    amount of control over the lighting in your composition (see Figure 13.17).'
  merge: -1
  pgno: 197
- img_proc: true
  md: '# Artistic Filters


    # FIGURE 13.17


    A simple composition with the added element of spot lighting. What a difference
    a little light can make!


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_198_0.png)


    The interface of this plug-in takes a little getting used to, but the utility
    of this plug-in outweighs its complexity. The first thing you need to do in order
    to add some light is to choose a type of light source for your image. You have
    four choices: Point Light, Direct Light, Spot Light, and No Light. You can preview
    the effect by clicking the Preview button (see Figure 13.18). (This can take a
    second or two, depending on the size and complexity of the image).


    # FIGURE 13.18


    Editing the type of light source and setting the position.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_198_1.png)


    By clicking the Tab (as in Figure 13.18), you will see options for changing the
    position of your light source (This option is not available on Spot Light). This
    is done with the XYZ coordinate system. Essentially you move the source along
    a 3D grid: X for left and right, Y for up and down, and Z for forward and backward.
    Most of the time you adjust the sliders by eyeballing the image and finding what
    looks best.


    The Material tab, as shown in Figure 13.19, enables you to set the reflective
    quality of the object in your image. This changes how the light interacts with
    your object, which can change the feel and texture of your object to be dull,
    glassy, metallic, diffused, and so on.'
  merge: -1
  pgno: 198
- img_proc: true
  md: '# FIGURE 13.19


    Setting the reflective qualities.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_199_0.png)


    # Miscellaneous Effects


    Here are a couple of commonly used filters that might be of interest, not to say
    that the filters in these two hours are the only plug-ins worth mentioning with
    GIMP. I tried to take a random sampling of the filters that *I* find most useful,
    and leave discovering the rest of them up to you. You don''t want to take all
    the fun out of it for you.


    # Alien Map


    Alien Map, as illustrated by the name, is a pretty weird one. It alters the color
    map in your image in a randomized way, leaving you with something that looks like
    it was taken from the point of view of an alien life form with infrared and ultraviolet
    capabilities (ever see *Predator*?). In any case, this filter is pretty to use,
    and can be handy if you want to create something with certain sci-fi or psychedelic
    look.


    To use, go to the Alien Map dialog box and manipulate the *alpha* slider left
    or right until you achieve the desired effect, as shown in Figure 13.20 (Alpha
    refers to how much effect is applied).


    # User Filters


    Yes, you read it correctly. The GIMP, with the aid of the User Filters plug-in,
    can handle Photoshop Filter Factory Filters. And because there are literally hundreds
    of these available, this capability is fantastic.'
