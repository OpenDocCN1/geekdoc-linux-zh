    Note that many of these filters are stored in PiCo format. PiCo is a file converter
    that archives and converts Photoshop filters. Unfortunately, many Filter Filters
    are stored in FFL archives, which need to be converted to .bf format before GIMP
    can use them. There is no PiCo-compatible application for UNIX, in order to use
