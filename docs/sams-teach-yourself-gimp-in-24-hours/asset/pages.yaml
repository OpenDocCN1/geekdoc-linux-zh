  md: '# FIGURE 16.18


    Framing an image is an excellent way to spice it up and draw attention to it.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_242_0.png)


    # Summary


    The merging of images is probably one of the most enjoyable ways to let your creative
    juices flow. After you master the techniques you need to know to effectively combine
    images, you''ll never look at a photograph the same! Instead, you will undoubtedly
    begin to visualize the possibilities that could happen with the image and your
    newly honed compositing skills.


    # Q&A


    +   * What if the images I want to combine are all different sizes?


    +   * No problem. Either resize or rescale the images before you begin. Or better
    yet, start with a large blank image and add each of your images in its own layer
    so that you can rescale the dimensions you need as you go.


    +   * After I cut and paste one selection into another, I can see unnatural jagged
    edges around the selection I pasted. What can I do?


    +   * First, make sure you have the antialasing button checked in the selection
    options before making the selection. Create a new layer to paste into, rather
    than pasting the selection directly into the other image. That way, you can use
    the Eraser tool to carefully erase those jaggies and get a more realistic look
    for your composite.'
  merge: -1
