- img_proc: true
  md: 'Rendering a pattern isn''t nearly as difficult as you may think. Although this
    tool is based on mathematical principles that are way beyond the scope of this
    book, using it to achieve a certain graphical effect is really a matter of tweaking.
    As an example, if you want to create a neat-looking complex pattern, you would
    have to follow only a few steps.


    +   - Start with a transparent layer over a clean slate or an image that you want
    to use as a background.

    - Open IfsCompose.

    - This is where the fun begins. First, click the Rotate/Resize button underneath
    the preview window. Then drag over the selected triangle. You can see just that
    the simplest movement of that shape can affect the entire composition easily.
    Be subtle here (see Figure 20.10)


    # Figure 20.10


    You can see by experimentation one small alteration in a single triangle affects
    the composition.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_284_0.png)


    +   - Now do the same to the other triangles in order to get the basic pattern
    sketched out (see Figure 20.11).

    - In addition to rotating and moving the shapes, you might also want to alter
    their shape to add some more texture to your pattern. This is where the Stretch
    button comes into play. Used like the Move, Rotate, and Scale buttons, this one
    will actually change the aspect ratio of the triangle to a more angular position.'
  merge: -1
  pgno: 284
- img_proc: true
  md: '# FIGURE 20.11


    Adjusting all the triangles brings the fractal into focus.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_285_0.png)


    +   - Now that your pattern is pretty much you want it, you might be thinking
    about coloring it. Go to the Color tab and you will see two options for coloring
    your fractal image: Simple and Full. Simple changes the color of your selected
    fractal (see Figure 20.12). For example, if you choose the color orange (by clicking
    in the right-hand box by the Simple option and bringing up the GIMP Color dialog
    box), the image in the preview window will be colored orange in a pattern matching
    the triangle''s position.

    - By contrast, using the Full coloring function lets you create more sophisticated
    schemes with your pattern by setting the influence of color from the other fractals.
    This is a good tool for experimentation, and it can create some pretty strange
    (or realistic) coloring effects.


    Now that you have your pattern looking more or less how you want, click OK, and
    the pattern will be drawn onto your palette. As you can see, this is much more
    efficient (and within the realm of possibility) than attempting to draw these
    kinds of things by hand.


    This tool has a few more options. The Relative Probability value changes how much
    each fractal triangle has over the other object. Altering this can affect your
    fractal in subtle but noticeable ways. Subdivide determines how much detail goes
    into drawing each fractal. Raising this value will usually not affect the image
    much except in the case of larger images, but it can slow down the render process
    quite a bit.'
