  md: '# Saving Patterns


    After creating a pleasing pattern, you can save it in the Pattern Select dialog
    box for future use.


    +   * Right-click the finished image and select File, Save, to bring up the save
    options.

    * Name your pattern and save with a PAT (pattern) extension.

    * A small window called Save as Pattern appears and prompts you to give your pattern
    a simple name description. This is the name that shows up when you view the pattern
    in the pattern selection dialog box.

    * The pattern can now be moved to the GIMP pattern directory (.gimp/patterns).

    * In the Pattern Select dialog window, click Refresh and your pattern is now ready
    for use.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_67_0.png)


    # Figure 4.14


    The resource possibilities are endless for making great patterns.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_67_1.png)'
  merge: -1
  pgno: 67
- img_proc: true
  md: '# Summary


    As you work more and more with graphics, you will come to think of brushes and
    patterns as your basic tools of the trade.


    In this hour, I covered the essentials to get you started working with these artist’s
    little helpers.


    The capability to create and save your own custom brushes and patterns will, without
    a doubt, enhance your understanding of the intricacies involved in the creation
    of great graphics.


    # Q&A


    +   Q Can I make custom brushes in full color?

    A No. All images must be grecaled before becoming custom brushes. When you paint
    with them, then they use your chosen foreground color.

    Do I have to save my pattern as a PAT file before I can use it to fill an image
    or selection?

    A Yes. Although some programs enable you to use any open image as a pattern fill,
    the GIMP requires that the image first be saved with a PAT extension and placed
    in the Pattern Selection dialog box.


    # Exercise


    Look out your window or take a walk and have a good look around at things: the
    trees, the grass, the water, everything that surrounds you. Examine the textures
    and patterns in these everyday items from an artist’s viewpoint. Isolate small
    areas of color and texture and try to imagine how you could re-create the look
    using brushes and patterns.

    If you have a flatbed scanner, try scanning some simple textures, such as a leaf
    or a fabric and turn them into patterns.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_68_0.png)'
