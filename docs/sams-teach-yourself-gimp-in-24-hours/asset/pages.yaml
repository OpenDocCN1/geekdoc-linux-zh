- img_proc: true
  md: '# Transformation Tools


    I''ll begin with the basic transformation tools that appear in the toolbox window,
    as shown in Figure 6.1.


    # FIGURE 6.1


    These tools have more versatility than you might imagine.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_89_0.png)


    # Move


    After your brief introduction to the Move tool in Hour 5, you have probably accurately
    guessed that you should get to know it better.


    The first capability I will discuss is the capability of moving an entire image.
    When the Move tool is activated, think of it as a little grabber, which you can
    use to grab on your image and drag it to another location by pressing and holding
    the mouse button. Figure 6.2.


    # FIGURE 6.2


    When no selection is made, the Move tool moves the entire image.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_89_1.png)


    > To move an image or layer that has been created within a transparent background,
    you must either grab the visible portion of the image or use the Shift key while
    clicking the mouse button and moving the image.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_89_2.png)


    When moving selections within an image, the Move tool works a little differently
    than it does in most other graphics programs. It might seem confusing until you
    get used to the way it functions. When the mouse cursor is held over a completed
    selection with the selection tool still active, the Move tool symbol appears over
    it if you had switched to the move mode. This enables you to move the selection,
    but only once. If'
  merge: -1
