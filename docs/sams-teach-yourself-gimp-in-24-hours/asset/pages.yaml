- img_proc: true
  md: '# Artistic Filters


    One of my favorite things to do with the GIMPressionist is to use this effect
    in combination with layering to achieve a composite effect. This is actually pretty
    easy to do. By altering the background of an image differently than the focus
    of your composition, you can draw attention to the main subject.


    +   - The first thing to do is to create a layered image. I will first copy the
    selected subject (with the Bézier tool), paste it into a new layer (see Figure
    13.8), and then apply the GIMPressionist filter to the background layer, which
    is separated from the subject, in a way that will give it a surreal feel. For
    this example, I chose an effect that is pretty heavy to subdue the background
    (see Figure 13.9).


    Figure 13.8

    Copying the subject into a new layer.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_192_0.png)


    Figure 13.9

    The background layer gets a new look. Now the subject matter appears to be floating
    above the rest of the image.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_192_1.png)


    As you can see, there are simply a million possibilities with the GIMPressionist
    plug-in.'
  merge: -1
