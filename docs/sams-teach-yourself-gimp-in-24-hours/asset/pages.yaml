- img_proc: true
  md: '# Transformations


    you want to move the selection further, you must remember to activate the Move
    tool by by clicking on the Move icon in the toolbox. Otherwise, the selection
    tool assumes that you want to make another selection inside your original. You
    should notice that this inner selection area is surrounded by a gray nonflashing
    marquee (indicating that it is not active), yet it becomes active by clicking
    in the original selection area. By doing so, the original selection is deactivated.
    See Figure 6.3.


    # Figure 6.3


    If you forget to activate the Move tool, your efforts to move end up forming inner
    selections by accident. No reason to despair; simply undo them and turn on the
    Move tool.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_90_0.png)


    # Magnify


    Although the Magnify (Zoom) tool does not actually alter an image in a permanent
    way, I want to cover it in this hour because it can alter the view you image while
    you work on it.


    The premise is simple. You can magnify or zoom in on an area to get a closer look
    at it. This is very handy for work repairing old photos where you need to make
    pixel-by-pixel changes. With the Zoom tool activated, you merely click to zoom
    in and Shift-click to zoom out. You can also zoom in and out using the plus (+)
    and (-) keys on the keyboard. To zoom in on a particular area of an image, click
    and drag across that area.


    If you pull up the Zoom tool dialog box, you can see that it has only one option,
    Allow Window Resizing. If this option is unchecked, your image window keeps its
    original size, no matter how much you zoom. Checking the option enables the window
    to reduce or enlarge to fit the size of amount applied.


    A few other zoom features are located in the menu. Right-click an image and go
    to View. Most of the features are pretty self-explanatory. You can zoom in, zoom
    out, or zoom to a certain scale amount among nine choices. You can look at the
    window information to see window size, scale ratio, and so on and toggle window
    functions in and off. Applying the shrink wrap function resizes your canvas to
    fit your image. One'
  merge: -1
