    # Summary


    I devoted this hour to studying the powerful-yet-basic transformation tools available
    in the GIMP.


    By knowing how to alter existing images achieve everything from creating a totally
    new look to fitting the image into desired dimensions, you can experience a whole
    new freedom in image manipulation.


    Let the metamorphosis begin!


    # Q&A


    +   Can I use the Move tool to move a selection from one image to another?


    +   No. The Move tool is used to move selections within an image. To move a selected
    area from one image to another, you have to use the copy and paste functions.
    Activate the image containing the selection, right-click it to bring up the menu,
    and go to Edit, Copy. Copy. The selection is now in the clipboard. Now activate
    the image you want to paste the selection into and click Edit, Paste.


    +   Is there a way I can enter the amount of rotation I want my image to have?


    +   No, but you can usually get fairly precise to a desired amount by watching
    the dialog box containing the angle information while you rotate.'
