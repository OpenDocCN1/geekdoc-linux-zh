- img_proc: true
  md: '# HOUR 16


    # Photo Compositing


    Even though GIMP possesses a multifarious array of tools and functions that can
    be used for such feats as creating cool Web graphics, animations, and so forth,
    I know there are many of you out there who would like to really focus your graphics
    skills on photo manipulation. The next two hours will be written with you in mind.


    In Hours 9, "Hands-on Layering," and 10, "Using Masks," you got a glimpse of what
    can be done with photos using layering and masks. During this hour, you will concentrate
    on combining the methods you''ve learned with some additional tricks to achieve
    some very popular and surprisingly easy effects.


    # What Is a Composite?


    A composite is something that is composed or made up of separate parts or elements.
    When you refer to composites in terms of photographs and graphic images, basically
    you are talking about combining two or more images into one.'
  merge: -1
  pgno: 230
- img_proc: true
  md: 'There are multitudes of ways you can go about combining images. By using layering,
    opacity, blend mode techniques, you can virtually see through one image into another.
    With the use of masks and gradients, you can make one image appear to fade into
    another. By utilizing the selection tools, you can select portions of one image
    and place them into another, or you can create a collage effect by placing selections
    adjacent to each other in a larger area.


    # # Creating Composites


    To plan a composite, the first thing to do is try and visualize the arrangement
    of the images. After you have the general idea of what you want, it''s just a
    matter of using the right tools to get them, and believe me, GIMP contains all
    the right tools to create the various types of composites.


    # # Using Selections in Composites


    To illustrate compositing, I am going to start with two images, and combine them
    into one more interesting image. Take a look at Figures 16.1 and 16.2. Open the
    sunset.jpg and skull.jpg images from the CD-ROM to practice with.


    For this type of composite, use one of the selection tools (the Lasso or Bézier
    would both work well in this instance) and select the skull in the first image
    (see Figure 16.3).


    Now, right-click, and select Edit, Copy, to copy the selection into the Clipboard.
    Then right-click, and select Edit, Paste into the other image to get the final
    picture, as in Figure 16.4.


    FIGURE 16.1

    This image could use some color in the background.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_231_0.png)'
  merge: -1
  pgno: 231
- img_proc: true
  md: '# Photo Compositing


