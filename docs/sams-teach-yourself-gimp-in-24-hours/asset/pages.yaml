- img_proc: true
  md: '# Photo Restoration and Enhancement


    # Tinting


    The tint used on many older photos was the Sepia tone. Sepia toning produced a
    brownish-red hue to the entire picture giving it a unique quality and warmer appearance
    than a regular black-and-white picture. By reproducing the look, a newer photo
    can achieve a real-old look.


    To give a photo (or any other tone) tint is easy to accomplish in GIMP. Open the
    picture you want to tint, right-click and select Image, Color, Hue-Saturation.
    By playing around the sliders, you will be able to apply the hue of your choice.


    # Colorizing


    Have you ever seen an old photo that looks as though it was painted with watercolors?
    Basically, that''s the method they had to use in the early days before color became
    widely available. This is also fairly easy to duplicate with only a paint-brush
    and a blend mode.


    To begin, open the image you want to colorize.


    Bring up the Brush box and after choosing your brush size and shape, click on
    the blend mode drop-down menu and choose Color as the blend mode. In essence,
    this enables the original image luminance to show while while accepting the new
    color hue.


    Choose the color you want to begin painting in the foreground color area of the
    toolbox and watch your picture spring to life as you paint.


    Another way you can do this is to add a new transparent layer to the image and
    access the Color blend mode from the Layer window. By doing this, you, will also
    control over the opacity of the painted layer if need be.


    # Red Eye


    When the light from a camera flash hits the eye of a subject at a certain angle
    (usually looking straight at the camera), the result is that the flash reflects
    off the eyes and can cause an unattractive orange-red tint to the eyes in finished
    photo.


    Most cases of red eye can be fixed effortlessly. Usually all that is required
    is the use of a selection tool as the Lasso to select the eye area, and right-click,
    Image, Color, Hue-Saturation to bring up the options and adjust the hue slider
    until the color is back to normal.


    When an animal looks at the camera flash, it can also result in red eye or even
    worse, a reflection making the eyes appear a bright green or yellow, such as happened
    to the pup in Figure 17.9.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_250_0.png)'
  merge: -1
  pgno: 250
- img_proc: true
  md: '# FIGURE 17.9


    In reality, this dog possesses big brown eyes, but the reflection of a flash bulb
    has hidden them.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_251_0.png)


    The first step to repair the damage here is to zoom in and use the Lasso to select
    the eyes. After selecting the first eye, hold the Shift key, which will allow
    you to add the second eye as a selection also (see Figure 17.10).


    # FIGURE 17.10


    By using the Lasso to select the discolored eye areas, the color changes will
    not affect the rest of the image


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_251_1.png)


    Because these eyes are reflecting so badly, there’s more to than just change the
    hue to brown. Right-click and select Image, Colors, Hue-Saturation. In addition
    to getting the right hue, I also need to get rid of the reflectivity by greatly
    lowering the Lightness slider.


    With these changes comes a vast improvement to the image, but because the selected
    area required such a major shift in brightness, the selections now acquired jagged
    edges and do not blend well in the surrounding area.


    To remedy this, with the eyes selected, right-click, Select, Grow, and set the
    grow option to 2 pixels. This expands the selected areas just a little (see Figure
    17.11).


    Then right-click and select Filters, Blur. By blurring the outer edges of the
    changed eyes will blend well in the image, as see Figure 17.12.


    # Color Enhancement


    Sometimes a photo can be enhanced just by changing and brightening some of the
    colors. Open the bur.jpg image from the CD-ROM tutorials section and I''ll show
    you what I mean (see Figure 17.13).'
  merge: -1
