    came into play).


    # Size Issues


    When building animated buttons, banners, and such for the Web, there are a few
    things to take into consideration. Most importantly, bandwidth is everything.
    Not everyone has the luxury of a T1 line. (You''d be surprised how much your world-view
    changes when moving from the campus fast Ethernet to a 28.8 modem)


    This is especially true for advertisement banners. If you are faced with making
    one of these remember that people did not come to the site to look at banners
    specifically, and they tend to get cranky when a bulky ad detracts from the load
    time of the content they came to see. If you want to increase banner click-throughs,
    a small, simple, non-bulky banner is usually best. You can even sacrifice on color-depth
    and detail a little more (as long as you still antalias your fonts), because you
    do not want to overimpose your presence on the site on which you are advertising.
    Keywords here are small and optimized!'
  merge: -1
  pgno: 321
- img_proc: true
  md: '# FIGURE 23.6


    Banner ads help pay for Web space, a small, less-detailed, quick-loading banner
    makes for an enjoyable browsing experience.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_322_0.png)


    For example, the banner shown in Figure 23.6 consists of only two frames (to emulate
    the flowing water effect) and is therefore quickly downloaded, but the effect
    is still eye-catching, and it gets the points across.


    # Optimizing Animations


    When you build an animation, there are a lot of elements in the picture that are
    repeated within every single frame. This is extremely wasteful, repeating the
    same portions of animations takes valuable space and bandwidth. The way to counteract
    this is to use only the information that changes from the previous frames in each
    new frame.


    You can improve your animation efficiency by hand by cutting out the obvious unnecessary
    information. Figure 23.7 illustrates this with the example of a simple, traditional
    88 x 31 animated button. Eliminate the unnecessary by cropping every-thing that
    was not within the animated portion after the first frame, which is confined to
    a little square area in space. The animation is then saved with the Make Frame
    from Cumulative Layers option, which allows the background frames to show through
    each frame. This saves a lot of space.


    As you can see, this is fairly simple to accomplish when dealing with an animation
    which you know that altered portions are taking place within the confines of a
    small square (or window). But what if the animation has things going throughout
    the entire image, as in Figure 23.8? Obviously, it would be a bit more difficult
    to determine exactly what is static and cut it out from the successive frames.
    Fortunately, there is a wonderful plug-in that can take care of it for you named
    Animation Optimize. This plug-in is great because it can find every single pixel
    that is static after the first frame and cut them all out! This not only can cut
    out a few extra kilobytes (or many more, depending on the file), but can also
    make it possible to drastically slim down the more complex animations'
  merge: -1
