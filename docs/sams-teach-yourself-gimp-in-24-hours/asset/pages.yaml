  md: '![](img/1e2e1cd1a8efa63a199c864a651e3086_244_0.png)


    # HOUR 17


    # Photo Restoration and Enhancement


    In Hour 16, “Photo Compositing,” you looked at some of the different ways of combining
    images, but you haven''t really explored the possibilities of repairing and enhancing
    photos that aren''t quite right to begin with.


    If you have ever experimented a little bit with photography or taken some quick
    snapshots, you know that there are many variables to be considered to get a good
    picture. The subject, lighting, angle, background, and camera adjustments themselves,
    can all affect the way a picture turns out.


    Luckily for you, you have GIMP and its uncanny capability to easily correct most
    of the flaws and mistakes in your pictures. Just about any photo problem can be
    remedied with the tools at hand. In this hour, you will learn some tips on how
    to:


    +   * Restore old photos

    * Add enhancing touches to newer photos

    * Create a cool photo edge effect'
  merge: -1
  pgno: 244
- img_proc: true
  md: '# “This Photo Looks Bad! Is It Salvageable?”


    Almost all pictures can be improved in some way, even pictures that are extremely
    damaged. In the case of old photographs, many times all is needed is a little
    color adjustment. You might want to refer to Hour 7, “Working with Color,” to
    refresh your memory on the different color adjustment tools and what they can
    accomplish before you begin practicing photo repair


    # Tips and Tricks for Working with Old Photos


    The following is a general list of some practical techniques to keep in mind when
    manipulating photos:


    +   - Always work on a copy and keep it side by side with the original to make
    it easy to compare and decide on changes as you make.

    - The Zoom tool is invaluable for photo restoration. Use it to greatly magnify
    areas that need pixel-by-pixel editing.

    - Most basic color functions in the GIMP can be accessed by right-clicking and
    selecting Image, Colors.

    - For old photos that have yellowed, a simple grayscale conversion can wonders.
    However, you might want to use the Desaturate option so that the color depth is
    not reduced in the process.

    - Faded pictures can be brought back to life with either the Normalize or Auto
    Stretch Contrast in the Color menu.

    - For photos that are blurry, try applying the Sharpen function located in the
    Filters menu under Enhance. If only a portion of the image is blurry, you can
    make a selection before applying this feature.


    # Removing Flaws


    A major problem that plagues older photos is that they’ve been passed around a
    lot and haven’t been properly stored, resulting in things that scratches, bends,
    and frayed edges.


    Here you’ll take a look at a couple of old photos that are in need of repair so
    you can see how to begin the restoration process.


    The first photo (see Figure 17.1) is about 50 years old, but looks as though it
    has really been through the wringer. it has been badly bent, scratched, and stained.


    In a case like this, where almost every part of the image works, the first step
    is to pick a starting place and zoom in on it to get a really good look at the
    damage, as in Figure 17.2. That way, you can work on a small area at a time to
    see if the damage can be undone.'
  merge: -1
