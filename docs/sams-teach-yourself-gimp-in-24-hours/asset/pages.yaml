  md: '# Working with Black and White


    Because the blend modes work by blending colors in such a large variety of ways,
    let''s take a look at unleashing the power of color in an image.


    A very popular technique used in everything from movies to photos is the use of
    just a drop of color to bring the focus to a certain item in a black and white
    image. One reason the technique is so popular is it is very effective. An image
    can end up with a completely different feel by using this method.


    In this tutorial, we will use a combination of layering and blend modes to achieve
    this color (or should I say lack of color) effect.


    Open the puppy.jpg image from the tutorial section of the CD-ROM (see Figure 9.13).


    When you look at this image, what do you see? More than likely, you''ll probably
    say it''s a very happy puppy running through the green grass.


    # Figure 9.13


    The bright contrasting colors in this image draw your eyes to the grass and the
    dog.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_144_0.png)


    Take a look at the lone flower in the lower-left corner of the picture. Sure,
    you probably saw the flower before, but your eye was naturally drawn to the larger
    areas of color in the image. Let''s make the flower, rather than the puppy, the
    focal point of the picture.


    Make a copy of the image to work on.


    Add a new transparent layer and set the blend mode to Saturation.


    Set the foreground color in the toolbox to either black or white.


    Activate the Paintbrush tool. Open the Brush dialog box and choose a medium sized
    soft brush.


    Now by sweeping the brush over the image, you will in essence remove all color,
    leaving just a grayscale look to the picture. While you are painting, leave only
    the flower unpainted, preserving the color.'
  merge: -1
  pgno: 144
- img_proc: true
  md: 'Take a look at both the original and the edited copy side by side. It''s the
    same image, but notice how your eye is drawn to the flower in the second image.


    > Although you can blend modes either by selecting the mode in the Brush dialog
    or Layer dialog box, you might find it more helpful to use layering at first,
    until you learn what the modes do and know just what effect you want to achieve.
    When you choose from the Brush dialog box, the chosen mode is applied to the brushed
    area, but to test a different mode, you would have to undo and start over area
    with the brush. By using the Layer dialog box, the chosen mode is applied, but
    you can change modes to view the different effects.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_145_0.png)


    # Blending Images


    You''ve seen how a single color in a layer can affect an image by applying the
    various blend modes. Now try something a little different and use one of the modes
    to blend images together.


    Open the 2men.jpg and sunset.jpg images from the CD-ROM (see Figure 9.14).


    # FIGURE 9.14


    These two images will blend into one more interesting images.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_145_1.png)


    Add a layer to the 2men.jpg image, and then copy and paste the sunset.jpg image
    into that new layer.'
  merge: -1
  pgno: 145
- img_proc: true
  md: '# Hands-on Layering


    Go to the Blend Mode options and choose Difference. Notice how you''ve given a
