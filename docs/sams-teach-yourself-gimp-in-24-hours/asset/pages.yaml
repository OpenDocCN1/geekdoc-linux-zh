  md: '# Photo Compositing


    The first thing to do here is bring up the Layer dialog box to add a new transparent
    layer to the cards image. That is where you will put the derringer.


    Go back to the derringer image and use a selection tool to select only the gun.
    This is an instance where the Fuzzy Select tool will probably be the best for
    the job. Activate the tool, click on the white portion of the image to select
    it, and then right-click, choose Select, Invert to pick the selection around the
    gun.


    Right-click, Edit, Copy, and you are ready to Edit, Paste the gun image into the
    new layer you created in the card image.


    Now you are ready to use the opacity slider. With the derringer layer as the active
    layer, change the opacity setting to around 50 or so—just enough to let the cards
    through, as in Figure 16.10. Your image is complete.


    **Figure 16.10**


    This composite gives an eerie but effective reminder that these cards are known
    as "The Dead Man’s Hand."


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_236_0.png)


    # Blend Modes


    The use of blend modes in a composite can create some striking effects, as you
    learned in Hour 9. You''ll use a blend mode here to blend two images in a certain
    way.


    For this exercise, open the bird.jpg and sky.jpg images from the CD-ROM (see Figure
    16.11).


    To begin, give these two images the sort of hue before you mix them they will
    blend together well. The bird image has a sort of golden hue, so give the sky
    image a similar hue by right-clicking, and then selecting Image, Colors, Hue-Saturation.
    Adjusting the hue slider until you see a similar golden tint to the clouds and
    sky. When you are satisfied, click OK, and then right-click the image, and select
    Edit, Copy.'
  merge: -1
  pgno: 236
- img_proc: true
  md: 'Now, go back to the bird image, add a new transparent layer and select Edit,
    Paste to paste the sky into this new layer. Anchor it.


    Now comes the blending magic. Click in the blend mode drop-down menu and choose
    Multiply Watch as the two images transform into one, as illustrated in Figure
    16.12.


    # Figure 16.11


    With the help of blend modes, these two images will appear as though they were
    meant to be together.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_237_0.png)


    # Figure 16.12


    The bird looks much more at home with a few clouds in the sky.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_237_1.png)


    # Gradients


    You can get some fascinating effects when you use gradients and masks to make
    composites. I must warn you though, after you learn to use these two functions
    together, you can spend hours on coming up with a million different looks to any
    given image! You might get hooked.


    For the technique demonstrated here, you can use the images bird.jpg and bird2.jpg
    (see Figure 16.13) from the CD-ROM.'
