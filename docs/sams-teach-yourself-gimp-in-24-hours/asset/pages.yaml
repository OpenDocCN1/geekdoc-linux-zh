- img_proc: true
  md: '# HOUR 10


    # Using Masks


    Wow! You''re not even halfway through the book yet, and you''re applying layers
    like an old pro.


    By now you are probably really getting hooked on the total versatility that layering
    offers for editing your images.


    This hour will teach you a few final tricks involving layering, namely layer masks
    and channels. Yeah, you heard me right, there are even more cool things you can
    use layers! You will learn how those mysterious layer work and follow through
    with these tutorials to apply what you''ve learned, including:


    +   - Gradient masks

    - Photo edge masks

    - Text masks


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_148_0.png)'
  merge: -1
  pgno: 148
- img_proc: true
  md: '# # What Are Masks?


    Think of a party or Halloween mask. They’re used to cover or conceal parts of
    your face, but can be removed at any time, revealing your identity by uncovering
    the parts of your face that were hidden. A *layer mask* is the same. It is used
    to cover certain parts of your layer. It can enable you to hide or reveal specific
    portions of your image and apply special effects to those portions.


    In a way, a selection is somewhat like a mask. You can select a specific area
    and the rest of the image will be *masked off* or protected from any applied changes.
    Masks take this capability a step further by allowing you to apply changes to
    a layer based on the alpha values of the layer.


    I like to think of a mask as a custom stencil. They are basically grayscale alpha
    channels that you can attach to a layer. When changes are applied to a layer using
    a mask, the black parts of the mask are viewed by the layer as totally open to
    visibility, white portions are totally immune, and various shades of gray allow
    various degrees of the change to be visible.


    # Creating Masks


    Masks can be created from images, selections, gradients, or entirely from scratch.
    Here I will use a simple image to illustrate basic masking.


    Open an image (see Figure 10.1), and right-click on it to bring up the Layer dialog
    box and add a new layer in white.


    # FIGURE 10.1


    The original image before the masking process begins.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_149_0.png)'
  merge: -1
  pgno: 149
- img_proc: true
  md: '# Using Masks


    Next, I click the thumbnail image of my new layer to bring up the Layer Dialog
    menu and click Add Layer Mask. This brings up the Add Mask Options box (see Figure
    10.2).


    FIGURE 10.2


    Three options are available for the initial mask.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_150_0.png)


    The mask options box contains three choices to set the mask with:


    +   * **White (Full Opacity)**—By choosing white , you get a totally opaque mask.
    completely covers your layer in white until it is edited.

    * **Black (Full Transparency)**—This option creates the mask in black, which appears
    as transparent; you will be able to see your layer through it.

    * **Layer’s Alpha Channel**—This means that the mask will be created out of the
    graysed version of alpha values in the layer.


    For this example, I have chosen to create a white mask, which is also the default
    option. As you will see in Figure 10.3, a new thumbnail indicating the mask appears
    in the Layer dialog window to the right of the layer thumbnail. Because I haven’t
    begun to edit the mask, it appears as solid white.


    # New layer


    FIGURE 10.3


    A thumbnail image of the mask appears next to the layer thumbnail.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_150_1.png)


    Layer mask'
  merge: -1
  pgno: 150
- img_proc: true
  md: 'To begin editing the mask, click on the thumbnail to activate the mask. A white
    border will appear around the thumbnail to indicate that it is active. If you
    want to switch and work on the layer, click the layer thumbnail and the white
    active indicator border will appear there instead.


    Because black is the totally open or transparent color as far as masks are concerned,
    I chose black as the foreground color in the toolbox and use the Brush to paint
    in an area of black. Notice in Figure 10.4 how the area that has the black applied
    to it allows the image to show through the white layer.


    # FIGURE 10.4


    Like magic, the black areas of the mask become transparent.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_151_0.png)


    You see how the white area of the mask is totally opaque and the black transparent.
    Now, as I switch my foreground color to a shade of gray and paint in the mask,
    you''ll notice that area becomes partially transparent, as in Figure 10.5. Look
    also at the mask thumbnail in the Layer dialog window and see how it shows the
    mask I just created.


    # FIGURE 10.5


    Compare the masked image with the mask thumbnail to see how it works.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_151_1.png)'
  merge: -1
  pgno: 151
- img_proc: true
  md: '# Viewing the Mask


    If you want to view only the mask in the image window, hold down the Alt key while
    clicking the mask thumbnail. A green border will appear around the thumbnail to
    indicate mask visibility. Alt+click to view as normal. To view your layer with
    no mask, Ctrl+click on the mask thumbnail, and you will see a red border around
    the thumbnail indicating the mask is hidden. Ctrl+click again to return.


    # Applying the Mask


    After you have a mask the way you want it, right-click on the mask thumbnail to
    bring up the menu and select Layer mask. This brings up options, as seen in Figure
    10.6, which gives you a choice of whether to apply or discard the mask.


    Figure 10.6


    With these options, you can apply the mask, thus merging it with the layer, or
    discard it, meaning it will be totally removed.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_152_0.png)


    > Most filters and effects can be applied to masks, giving you creative freedom
    when making them. However, some filters and effects cannot be utilized until the
    mask has been applied to the layer.


    # Masks with Selections and Channels


    If you have made a complex selection and would like to make it into a mask, add
    a new layer mask and click on the Layer Mask icon to activate it. The selection
    will still be active (as by the flashing marquee) and you can manipulate it within
    the mask.


    If you have already made a mask, but would like to turn it into a selection, you
    can do that also. Look in the Layers menu and you will see an option called Mask
    to Selection. This automatically turns the mask into a selection, which can be
    useful if you want to edit the mask further by utilizing the selection options,
    as grow, shrink, feather, and such.


    By using the Copy and Paste functions, you can paste a selection or an entire
    image directly into a layer mask, where it then becomes the grayscale mask. This
    is a neat effect to use if you want to merge two images into one.'
  merge: -1
  pgno: 152
- img_proc: true
  md: '# Mask Tutorials


    To add a mask to an image containing only one layer, you must first add an alpha
    channel by going to the Layer menu and clicking Add Alpha Channel. You can then
    add the layer mask as usual. When editing the mask, the black areas appear as
    the checkered transparency. You can add another layer and lower it under the original
    layer, and the mask will allow the lowered layer to show through the transparent
    areas.


    Now you''ve seen the beginnings of how this masking business works, but it can
    be kind of confusing until you actually do a few. By completing each of the following
    tutorials, you should gain a good basic understanding of the way masks works.
    Once again, you will prove correct the old adage experience being the best teacher.


    # Gradient Masks


    Gradients are one of the easiest ways to make masks, and you can really get some
    cool effects by using the two together.


    For this lesson, open the image named elephants.jpg from the CD-ROM (see Figure
    10.7), or feel free to use any one of yours.


    FIGURE 10.7


    Let''s see how gradient mask will affect this image!


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_153_0.png)


    +   1. First of all, right-click the image and select Layers, Layers and Channels,
    to bring up the Layer dialog box, and then add a new layer in white.

    2. Right-click the new layer name to bring up the menu and add a layer mask in
    white. You will now see only a blank area in your image window.

    3. Set the foreground color to black and the background color to white in the
    toolbox. (This is the default, so they are probably already set as such.)'
