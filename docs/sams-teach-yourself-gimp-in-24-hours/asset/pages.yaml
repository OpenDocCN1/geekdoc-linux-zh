  md: '# Cubism


    Cubism is another interesting painting effect, similar to GIMPressionist, but
    much less complex. It creates a painted effect using gradient cubes applied at
    different angles using Figure 13.12.


    FIGURE 13.12


    Cubism tries to emulate a different style of painting.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_195_0.png)


    # Mosaic


    Mosaic, from the Artistic menu, creates the illusion of an image painted onto
    a stained glass type of texture (see Figure 13.13). It creates a pattern of bordered
    polygons of varying size and texture, and approximates the fill pattern of your
    original image.


    FIGURE 13.13


    Mosaics can make good backdrops for various compositions. There are a lot of options
    here, but they are pretty easy to figure out.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_195_1.png)'
  merge: -1
  pgno: 195
- img_proc: true
  md: '# Whirl and Pinch


    This is a fun filter. It is accessible by selecting Filters, Distorts. It whirls
    and pinches your picture by means of variable slider controls (see Figure 13.14).


    Figure 13.14


    Whirling and pinching.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_196_0.png)


    # Waves


    This is a pretty simple and effective filter. It distorts your image with the
    illusion of waves and ripples (see Figure 13.15). It has a preview window, and
    with the sliders you can alter intensity and size.


    Figure 13.15


    Adding a rippling water effect can be great for some backgrounds and textures
    (not to mention emulating the look of water).


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_196_1.png)'
  merge: -1
