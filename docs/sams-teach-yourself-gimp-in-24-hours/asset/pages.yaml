    # # LfsCompose


    This remarkably plug-in renders fractals-on-the-fly. Fractals are mathematical
    principles, composed of complex types of geometric shapes that usually exhibit
    the property of self-similarity (snowflakes are a good example of this). You can
    use this tool to create complex, realistic and natural (or unnatural) patterns,
    textures, and objects by manipulating three or more triangles in 2D space. (The
    interface is shown in Figure 20.8)


    Your fractal starts out with three isosceles triangles. To create a unique pattern,
    all you need to do is start these triangles with your mouse until it appears to
    your liking. You can rotate, move, stretch, and resize them to any proportions.
    It''s really all that difficult, and you might be surprised at what you can come
    up with. For example, many organic objects, such as trees, feathers, corals, mollusks,
    leaves, landscapes, and so forth can be very closely approximated by fractal shapes.
    Using this tool, coupled with a little experimentation, can be useful in replicating
    these kinds of objects (see Figure 20.9).'
  merge: -1
  pgno: 282
- img_proc: true
  md: '# FIGURE 20.8


    This interactive fractal generator, although quite mundane looking at first glance,
