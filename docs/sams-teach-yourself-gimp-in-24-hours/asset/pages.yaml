  md: 'change the x and y drop shadow offsets in the options box to -2 (minus 2) and
    apply it. Deactivate the selection. The image now has the appearance of being
    set behind the mat, as in Figure 16.17.


    # FIGURE 16.17


    A shadow adds depth and realism to the image border.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_241_0.png)


    This is looking pretty good, but let''s make it a little fancier.


    Right-click the image and select Script-Fu, Modify, Add Border. For this image,
    try a nice thick. Change the x and y sizes in the Add Border options box to 25
    and choose a color complementary to the image. (This color will end up being darkened
    by the Xach-Effect, so choose one darker than you want). Click OK and watch as
