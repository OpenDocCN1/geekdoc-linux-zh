    # Fractal Explorer


    Fractal Explorer is, if nothing else, a great time-killer. This plug-in is just
    plain cool (see Figure 20.13). It lets you browse through a list of predefined
    fractal designs and draw them into your image. It''s a quick-and-easy way to come
    up with some intense designs and textures.


    # Figure 20.13


    This is definitely one of the plug-ins you want to have available for demonstration
    purposes.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_286_1.png)'
