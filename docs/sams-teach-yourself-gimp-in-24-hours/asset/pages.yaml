    # FIGURE 20.9


    Just a sample of what is possible with the wonderful world of fractal geometry.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_283_1.png)


    To render a pattern, you need to start the plug-in on a clean canvas. Now you
    can begin playing with those triangles. As you can see, any slight movement in
    one triangle can drastically alter the entire image quickly (see Figure 20.10).
    This is a delicate instrument.'
