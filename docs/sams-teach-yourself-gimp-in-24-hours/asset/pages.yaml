- img_proc: true
  md: 'You should now also see the GIMP toolbox on your desktop. This is the dialog
    box that contains icons representing the 21 most common image editing tools.


    # # The GIMP Interface


    Before beginning on an image, one of the first things you will want to do is familiarize
    yourself with the basic interface.


    The GIMP toolbox dialog, as pictured in Figure 2.5, is the single most important
    element in the entire program. From it, you will gain access to all your graphics
    files and the most essential controls. The first thing you''ll notice, if you''ve
    used other popular graphics applications, is that this toolbox works in the same
    way as you''d expect. The GIMP toolbox contains the controls for as well as the
    main menus (File and Xns) and the Foreground/Background Color Selection box.


    # ### FIGURE 2.5


    The GIMP toolbox contains the most essential tools and menus.


    File menu Xns menu


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_35_0.png)


    Foreground/Background Color Selector


    # # Creating a New File


    Obviously, the most common task in dealing with graphics is to create, open, and
    edit files. In fact, the GIMP doesn''t even automatically open a new blank image
    for you; it assumes that you will primarily be altering graphics. This is where
    you''ll begin. The first thing to do is go to the File menu and click New. You
    will be greeted with the New Image dialog box, as shown in Figure 2.6.'
  merge: -1
  pgno: 35
- img_proc: true
  md: '# Getting Started


    FIGURE 2.6


    The New Image dialog box creates an empty canvas from which to work.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_36_0.png)


    # File Size


    NEW TERM


    In the top portion of the New Image dialog box, the width and height options are
    visible. You can specify the size for your new image here. The GIMP always measures
    image sizes in pixels, which are, of course, the singular picture elements that
    make up your digital palette.


    # Image Type


    The middle portion of the dialog box consists of two image types pertaining to
    color depth. RGB (referring to full color) and grayscale. It is always wise to
    create an image in full color, because it can be reduced to any number of colors
    or graysed later on. (Certain GIMP functions will only work on full color images.)


    # Fill Type


    Fill type refers to the background color of the image you are working with. Background
    is the color that is the second one in the Foreground/Background Color Selector
    on the toolbox. This usually defaults to white, but then you can choose any color
    you want. Next, the White option is pretty self-explanatory. And finally, the
    Transparent option allows you to create an image with transparent (invisible)
    background, such as the kind found in transparent images.


    After you click OK, your new canvas will appear. You can, of course, have more
    than one image in the GIMP at any given time.


    # Opening Files


    Opening files work in the same way as creating new ones. First, go to the File,
    Open menu. The file selector box is pretty easy to follow (see Figure 2.7). Essentially,
    listings of your directories are on the left, and files are listed on the right.
    You will notice that at the top, three option buttons allow you to create directories,
    and delete, or rename files as well. (This can come in handy moments.)'
  merge: -1
