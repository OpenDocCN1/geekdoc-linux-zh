- img_proc: true
  md: 'This will compile the source code and install the binary plug-in for you. Pretty
    simple,

    actually. Restart GIMP for changes to take effect.


    # Summary


    This gave you some insight into how filters and plug-ins work, and how images
    can

    be improved by using filters (and not just distorted with a lot of weird effects
    that are

    cool but never used). Of course, you''re not messing with filters and plug-ins
    just

    yet—in fact, you''re just getting started. Obviously, this book can''t cover all
    the plug-ins

    there are, but going over the most commonly used will give you enough impetus
    to

    move into the various tutorials and techniques.


    In order to use these filters effectively, the best advice is less more. The filters
    covered

    in this hour are designed to help images move from okay to high quality. Using
    them

    can make your images look like they''ve been tampered with. You''ll most likely

    use these filters when you want to avoid making your images altered.


    # Q&A


    +   Q If I change my mind about a filter? Can I undo it?


    +   A Fortunately, yes. Undo functions with plug-ins just as it does with any
    of the stan-

    dard tools. Just remember Ctrl+Z when you get into trouble with an image.


    +   Q Are there filters that are not plug-ins?


    +   A Not to my knowledge. Filters are either plug-ins written by a third party,
    or some-

    thing the GIMP deals with internally. (Assuming anything working outside of

    tnGIMP is considered a separate application.)


    # Exercise


    The best thing to do with these particular filters is to tweak images; that is
    your assign-\ment. Find some scanned photos, perhaps of friends and family, and
    find the visible

    flaws in the images—few pictures are perfect. Then try to improve those photos
    with the

    filters, looking closely for any imperfections you can find, either technical
    or aes-

    thetic. The Zoom tool can be handy for this). As you work, you might find out

    sometimesimes it is easy to over-correct an image, leaving it worse than before.
    The skill to

    aquire from this exercise is the ability to know when to stop. It takes some practice
    to

    get the hang of determining when you''ve tweaked enough. I''ve ruined many images

    going one step to far. Thank goodness for multiple undo''s!'
