- img_proc: true
  md: "# Animations\n\na second, if not specified otherwise.\n building an animation,\
    \ you'll want to try and make it as smooth as possible, within size constraints.\
    \ How smooth your animation will be depends on a few factors, as the timing in\
    \ milliseconds for your frames, as well as the amount or subtlety of movement\
    \ of the animated elements between the individual frames. Obviously, for a smoother\
    \ animation, you would use subtle movements, more frames, and less time for each\
    \ frame. But there is also a balance to be achieved for file size and build time.\
    \ (For example, 100 subtle frames with a movement of 1 pixel at high speed might\
    \ be a little more than is practical to build.) Each graphic is different, but\
    \ good rule of thumb to remember is that if the animation starts choppy with the\
    \ frames speeds at ~100ms, you'll probably need to build a few intermediary frames\
    \ to tighten the movement.\n\nIf you don't have size constraints, that is, you're\
    \ not making it for online, there is reason to avoid going for detail—a little\
    \ more spent building more frames at higher speed, each with smaller changes in\
    \ movement, can result in a much cleaner image.\n\n# Animations for the Web\n\n\
    As you can see, building a simple animation is relatively painless. There are\
    \ a lot of little effects you can use—pixelization, noise transition, banding\
    \ and blending effects for text logos, blinking, pulsating, and color transformation\
    \ effects for small objects such as buttons. These things are easily created with\
    \ a few copies of single image to work on and little patience. But there are few\
    \ more things to consider when building specifically for the Web.\n\nGIF89a is\
    \ pretty much your choice for use on the Web, especially because it is the only\
    \ animated format that GIMP supports saving at this time.\n\n# A Word About GIF89a\n\
    \nWhen you have finally built, timed, and tweaked your image, you should course\
    \ save it! When you save an animated GIF, remember that first of all you must\
    \ reduce the color depth, just like any other GIF. Then go to the Save As menu\
    \ and name your file with a GIF extension. The GIMP automatically recognizes that\
    \ you are about to save a GIF89a animation and gives you a few more options in\
    \ the Save As dialog box (see Figure 23,5). Loop allows you to determine if you\
    \ want the animation to loop endlessly or play one"
  merge: -1
