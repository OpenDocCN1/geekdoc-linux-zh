- img_proc: true
  md: '# IWarp


    Have you ever Kai''s Power Goo? Well, this is essentially the same thing under
    GIMP (with the benefit of being free and running in UNIX). With it, you can manipulate
    many intense warp effects by hand. You can pull up its dialog box by selecting
    the Distort menu.


    In the IWarp dialog box (see Figure 13.10), you can interact and apply the effect
    by dragging the mouse (keeping the mouse button clicked) directly over the preview
    window. You will see six options for what kind of distort you want to apply.


    +   * Move—Smudges the paint around your image.

    * Grow—Enlarges the affected area.

    * Swirl CCW—Swirls the area in a counter-clockwise fashion.

    * Remove—Removes any applied effect in the given area. (This is really meant to
    action.)

    * Shrink—Shrinks the area in a pinching fashion.

    * Swirl CW—Swirls in a clockwise motion.


    # FIGURE 13.10


    An IWarp effect in action—from different to just plain nuts. (I''ve always thought
    that lions would look cooler with big Shepherd ears.)


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_193_0.png)


    At the top of the dialog box you will see two slider controls. Deform Radius adjusts
    the size of the area your mouse will affect, and Deform Amount adjusts the depth
    of the applied effect.'
  merge: -1
  pgno: 193
- img_proc: true
  md: '# Artistic Filters


    If you go too far with your effect and want to start over, click the Reset button.
    The bilinear next to it will create a smoother effect, but might take longer to
    render. I find it best to just leave it.


    Adaptive Supersample is useful for creating a higher quality image. It is like
    an antialiasing method for smoothing out the image by adding intermediary pixels
    between colors, thereby increasing color and depth. This option takes longer to
    render, but sometimes the slight increase in quality is worth.


    This filter also has animation capabilities, a morphing effect, switching from
    the original image to the distorted one. In order to use this, click the Animation
    tab (see Figure 13.11), and activate the Animation option. You can choose the
    number of frames the animation will have (the higher number, the smoother the
    animation, but this also increases the file size). The other two options choose
    the animation style: Reverse plays the animation backward from distortion to original,
    Ping-Pong goes from the original image to the distorted one and back to the original.
    Using both these options creates a reverse Ping-Pong. And finally, using neither
    of these options animates from the original to the distortion.


    > Remember: If you want to save your animation, you will need to save it in a
    format that supports animations, such as MPEG or GIF89a. You will learn more about
    animations in Hour 23, "Animation—The Basics."


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_194_0.png)


    # Figure 13.11


    Creating an IWarp animation. Unfortunately, this is an unanimated book, so it''s
    something you will need to experience first hand.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_194_1.png)


    13'
  merge: -1
