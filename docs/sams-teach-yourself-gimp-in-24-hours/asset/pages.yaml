  md: '# HOUR 5


    # # Working with Selections


    In the preceding hours, you learned the basics of how the image editing tools
    work, and how to create, open, and save images in different file formats. Your
    next step is to learn how to utilize the various selection tools to select, or
    identify a certain portion of an image.


    In essence, a selection is a specifically chosen area of an image that can be
    moved, edited, or manipulated without affecting the non-selected areas of the
    same image.


    There are many different methods of making a selection. For instance, you can
    select an area by color alone, by using a shape tool—such as a square or circle,
    or by drawing freehand around the area you want to modify.


    The GIMP contains six handy selection tools that will be covered in this hour,
    along with the options for these tools.


    +   * Rectangle/Square tool

    * Ellipse/Circle tool

    * Lasso/Free Select


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_70_0.png)'
