  md: '# Animations


    transparency and full opacity with no variations. If you create an animation

    with pixels shadows that allow shades of the image behind to show through (as
    with

    drop shadows), such pixels will be effectively converted to a solid or trans-

    parency when saving to GIF89a.


    In this example, I would build a simple text logo animation so you can get a feel
    for it. This replicates a spotlight effect and was made with the gradient editor,
    used on lay-ers with protected transparencies, and with the added assistance of
    Script-Fu. It was cre-ated with detail in mind as opposed to size. It is included
    on the CD-ROM so you can take a peek at it you want (for a proof of concept as
    to how animations basically work).


    +   - The first thing you''ll want to do is by creating the first frame of your
    anim-ation onto the first layer (see Frame 23.2). Name this Frame 1. (Or Frame
    0, if


    # FIG 23.2


    An animation has to start somewhere.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_318_0.png)


    you''re real picky me).


    +   - The next step, as you''ve probably guessed, is to create your next frame.
    You do this by creating a new layer in the Layer dialog box. You will need to
    name it Frame 2. In this example, I have already prepared all the individual frames
    from separate images before, so I am merely pasting each frame onto a new layer
    (see Figure 23.3). This is usually the most convenient way to approach animations
    that aren''t too complex.


    +   - Continue in fashion until all the frames are created and the movement proceeds
    in an endless looping (unless you want a play-once animation). When all the frames
    are in place, you can test your animation by right-clicking the image and going
    to Filters, Animation, Animation Playback. After clicking Play, your animation
    will spring to life (see Figure 23.4).


    At this point, a preliminary animation is built, but there is still some work
    to be done. For one, you might have noticed that your animation is a little choppy—that
    is, there is delay between frames. Fortunately, you can change the delay between
    frames. In the GIMP, the timing for the frames is reflected directly within the
    frame naming conven-tion. It might be a little disconcerting at first. For example,
    if you want frame two to'
