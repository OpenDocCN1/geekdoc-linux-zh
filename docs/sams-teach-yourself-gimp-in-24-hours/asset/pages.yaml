- img_proc: true
  md: '# Summary


    Now you''ve played with some plug-ins that do a little more than just distort
    pictures—they allow GIMP to do things that it wasn''t really planned or designed
    to do. And it keeps getting better. It is a good idea to keep your eyes on the
    GIMP Plug-in Registry because there are always new plug-ins, extensions, and filters
    being added.


    One thing to do is to find new uses for these plug-ins. In other words, for many
    of these plug-ins, you often have a solution looking for a problem. (How often
    you had the need to render fractals in the past, for example?) Keep with it, and
    you might be surprised at what is possible with these things—you never know just
    when they might be useful.


    # Q&A


    +   - Q When using Gfig, I find that the image I painted does not look very smooth,
    but instead looks somewhat choppy. What can I do?

    - A In the Brushes tab, make sure that you have the brush spacing set to 0.


    # Exercise


    Now that you have had more exposure to many of the good plug-ins in the GIMP,
    your task now is to try to determine your favorites and find as many possible
    uses for them as you can. For example, many of these applications can be used
    in concert with such things as special effect images, Web graphics, and photo
    manipulation. Keep your eyes peeled and whenever you apply a technique, try and
    think if there is an easier and more appealing way to accomplish the same thing
    using one of these fancy plug-ins.(For example, I frequently find Gfig to be a
    worthy substitute of the Bézier tool.)


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_292_0.png)'
