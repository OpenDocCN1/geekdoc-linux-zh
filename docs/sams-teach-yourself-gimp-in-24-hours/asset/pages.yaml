- img_proc: true
  md: 'After tweaking and tinkering with the many GIMPressionist settings and spending
    a lot of time coming up with perfect effect, you might want to save it in order
    to apply it to future images (or in order to create a matched set of graphics).
    The options in the Presets tab (see Figure 13.6) lets you do that! In order to
    save your brush, pattern, and stroke settings, click on Save Current, and you
    will be prompted to name your presets. After doing so, it should appear in the
    list (you might need to click the Refresh button to see your entry in the list
    for the first time). From now on, in order to apply your preset to an image, click
    Apply. All your settings are now in place, and clicking OK will apply your settings
    exactly as before.


    # Figure 13.6


    Saving your settings is a must if you come up with anything extraordinary. Additionally,
    the GIMPression comes with a few custom presets that are pretty good.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_191_0.png)


    Now that you''ve been playing around with these settings, you will probably want
    to view the effect before applying it, as it might need more tweaking. The Preview
    option (see Figure 13.7) enables you to do that. Just click the Update button
    to view your changes.


    # Figure 13.7


    Previewing the changes before applying them or saving the preset can save a lot
    of time and energy.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_191_1.png)'
