  md: '# Using Feathering


    By adjusting the feathering control when you make a selection, you can give a
    soft-edged look to your images and make interesting composites and collages.


    To illustrate this technique, I will use three images, as shown in Figure 16.5
    (cat.jpg, tiger.jpg, and lion2.jpg). These are also available in the CD-ROM tutorials
    section.


    FIGURE 16.5


    When combined, these images will make a unique collage.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_233_0.png)


    The first thing you need to do is resc the three individual images so that the
    areas you want to use are sized to fit together in the correct way. The next step
    is to open a new blank image window and set the dimensions large enough to accommodate
    all three. I''ve filled my new image window with a radial gradient just to give
    it some extra color.


    This time, before making the selections that will be moved into the larger image,
    activate the feathering options (accessed by double-clicking the selection tool
    of your choice) and set the feather radius to 40 or so to give a nice soft blended
    edge to each.


    One by one, you can select the desired areas and Edit, Copy and then Edit, Paste
    into the larger image area. You should end up with a picture collage something
    similar to Figure 16.6.'
  merge: -1
  pgno: 233
- img_proc: true
  md: '# FIGURE 16.6


    Feathering can really give a composite a soft touch.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_234_0.png)


    Now let''s try taking it even a step further by feathering, copying, and pasting
    this entire image into another background.


    Open a new image window and fill it with a pattern of your choice. Make a feathered
    selection containing the previous image and select Edit, Copy, and then Edit,
    Paste into this new image. Anchor it. You will have a double-feathered image,
    as in Figure 16.7.


