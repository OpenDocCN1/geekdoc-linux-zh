- img_proc: true
  md: '# Transformations


    # FIGURE 6.7


    Scaling an image down to size is a quick and easy task in the GIMP.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_94_0.png)


    Now you''re on the subject of scaling, look at the scaling and resizing options
    in the menu. First, right-click on image and go to Image, Scale. An dialog box
    appears, as shown in Figure 6.8, which works in the same way as the Tool options
    for scaling, but this does for you. You simply enter the dimensions you want your
    image to scale. By having the Constrain Ratio option checked, which keeps your
    X and Y ratios the same, the image scales to a smaller or larger version without
    shape distortion.


    # FIGURE 6.8


    You can enter the desired scale specifies in the menu dialog box.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_94_1.png)


    Now right-click your image and take a look at Image, Resize. This performs a little
    differently than scaling. Look at the Image Resize dialog box, as shown in Figure
    6.9. This enables you to enter the desired dimensions; but rather it deletes everything
    except the portion in the dimensions you have requested, much the same as cropping.
    The dialog box defaults to the center portion of the image, but by changing the
    X and Y offset values, you can position the sized area anywhere in the image.
    This is useful if you need to have several images with the exact same dimensions.'
  merge: -1
  pgno: 94
- img_proc: true
  md: '# FIGURE 6.9


    The Image Resize dialog box lets you reposition the location of the desired area
    by changing the offset values.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_95_0.png)


    # Shearing


    Shearing produces a relative X or Y displacement, resulting in a sort of leaning
    effect, seen in Figure 6.10. Clicking and dragging up or down the corner of an
    image changes the Y (vertical) magnitude of the shearing effect, while dragging
    horizontally changes the X displacement.


    # FIGURE 6.10


    The shearing effect produces a kind of tilting distort to an image.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_95_1.png)


    # Perspective


    The Perspective option enables pulling the corners of an image one by one to any
    position, altering the image to match the new positions. One nifty effect you
    can produce with Perspective is the illusion of receding into a vanishing point
    (see Figure 6.11).'
  merge: -1
  pgno: 95
- img_proc: true
  md: '# Transformations


    # FIGURE 6.11


    An image with a different perspective.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_96_0.png)


    Performing certain transformations on very large images can be quite memory intensive
    and thus takes time. Unless you have a pretty good amount of RAM in your computer,
    you might want to practice with a small image while you are first learning the
    techniques.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_96_1.png)


    # Flip


    The Flip tool enables you to flip an image either horizontally or vertically,
    resulting in a mirror image, as illustrated in Figure 6.12.


    # FIGURE 6.12


    Vertical flips produce a mirror image, such as the one seen here. Great for making
    images in pairs.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_96_2.png)


    # Tutorial


    Now that you''ve been through a few hours and have learned some of the basics,
    put them into practice and create a unique image while you''re at it.


    In this tutorial, you will make an image that resembles a photo cube.


    To begin, you need three images or photos close to the same size range. This might
    be a good chance to practice your scaling techniques. If you prefer, you can use
    one photo and put it on all three visible sides of your cube. Using three different
    but complimentary pictures makes a more interesting effect.'
  merge: -1
  pgno: 96
- img_proc: true
  md: 'Keeping your photo images open, create three new blank image windows in a size
    that looks a little larger than the heads or portions of the photos you plan to
    use on the cube. Make the width and height the same so they are square. Use the
