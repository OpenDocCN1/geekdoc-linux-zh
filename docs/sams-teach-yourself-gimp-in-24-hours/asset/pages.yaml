  md: '# Digital Cameras


    Getting digital cameras to work with Linux is a little more straightforward. There
    are packages for many different types of video and tuning devices under Linux.
    As long as you have a good parallel port interface, you can get many of them to
    work.


    You can find a listing of compatibility client applications for Linux at http://roadrun-ner.swansea.uk.linux/v41.shtml.


    If you''re using the Quickcam, you can use the application gnomovi-sion (available
    from gnome.org) or something similar to capture and save video snap-shots.


    # Color Printers


    Fortunately, printers connected directly to the printer port are one of the easiest
    periph-eral to get working under Linux. In fact, there are only a few obscure
    models that are not supported (beware Winprinters!) The GIMP print plug-in uses
    a straight PCL/PostScript printing interface with regular UNIX, so this plug-in
    should give you no trouble whatsoever.


    After you have your printer plugged in, you can set it up of two ways: 1) Use
    the Printer Setup utility with Red Hat Linux (on their CD-ROM), or 2) Set it up
    by hand. Both methods are relatively painless, pending a standard printer setup.


    If you set up Red Hat Linux, start the printtool as root, as is shown in Figure
    24.2. This will give you a nice, friendly TCL/Tk interface to printer configuration.
    Scroll the list of printers, pick one, and try out the Print Test page. If this
    doesn''t work right away, there are a few things you can try.


    Otherwise, if you do not want to use printtool, you can do this by hand. You can
    consult the Printer Howto, which should be in /usr/doc, or you can find it at
    the Linux Documentation Web site: http://metalab.unc.edu/LDP/index.html.


    The next thing to take care of is the GIMP print plug (see Figure 24.3). This
    should be installed by default, but if not, it is easy to do with gimptool. After
    you have taken care, start the GIMP, open an image, and try printing it. Right-click
    and select File, Print; choose the resolution and layout and press OK.


    Sometimes, printing something in the GIMP, even on a nice color printer, will
    not turn out as a nice image as it appears onscreen. This is due to the limitations
    of the printing parameters, print resolution, and the differences between monitor
    and printer gamut. These topics are a little complex, and are not covered here.
    But, with a keen eye and'
  merge: -1
  pgno: 329
- img_proc: true
  md: '# Using Peripherals with Linux


