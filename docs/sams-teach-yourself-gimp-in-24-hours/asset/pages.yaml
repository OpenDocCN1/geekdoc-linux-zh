    # HOUR 23


    # Animations


    Animations are one of the more entertaining aspects of working with digital graphics.
    Creating an image that appears to move is a little eye candy that can enhance
    any project. (For instance, what would the Netscape/Mozilla browser be like without
    that cute little lizard?)


    You have probably noticed what a simple movement can have on a Web site. A scrolling
    banner or small, animated button can make quite a difference and enhance the site
    considerably without a lot of effort. (Wilber''s eyes on gimp.org or the title
    graphic on opponent.org are good examples of animation used well.) Sure, it''s
    frivolous, but people like things that add a little life to something that is
    static and motionless.


    Likewise, a Web page with too many animated GIFs can be distracting and can look
    downright goofy, and thus detract from the experience. It is obvious that these
    frivolous animations, if used, can enhance or break a site altogether. (I''m sure
    you have run across sites built by newbies got carried away with animated GIF
    fever. It is sometimes difficult to avoid the temptation to use a new technique.)
    Therefore, it is easy to see just how much these animations can have.


    The GIMP in particular lends well to creating graphics for the Web, and animations
    are no exception. In this hour, you''ll learn a few'
  merge: -1
  pgno: 316
- img_proc: true
  md: 'techniques for creating some simple animated graphics for the Web and otherwise,
    as well as optimizing them for use in low-bandwidth situations.


    # Creating a Simple Animation


    As you probably already know, an animation is a visual effect created by layering
    frames of the same subject in motion, and cycling through them at a speed that
    is high enough to fuel the human eye. (You probably made those little animated
    flips in elementary school.) Well, making animations digitally is really no different.
    You start out with many different images, or frames, which represent a continual
    flow of motion, and pile them one on top of the other, and play them in sequence
    to create the illusion of motion.


    Creating an animation in GIMP is really a easy working working with limited frames
    of an animation is really the same as dealing with layers. The Layer dialog box
    in this case doubles as a frame manager. The only real difference is that the
    layers must have a specific name in which the timing is informed. An example of
    this is shown in Figure 23.1.


    Figure 23.1

    If you can use layers in GIMP, you can build an animation.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_317_0.png)


    To build an animation, you need to start with a clean canvas, and then add a layer
    for each subsequent frame. This is really no different than drawing a cartoon,
    altering the subject so slightly in each frame to achieve the illusion of motion.


    > Well, however, probably want to build your frames or less separately, and combine
    them into your final animation. When building animations, the Layers dialog box
    becomes a frame manager, and works pretty much the same, except that animation
    frames do not support varying degrees of opacity, as with many layered images.
    Animations support full


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_317_1.png)'
  merge: -1
  pgno: 317
