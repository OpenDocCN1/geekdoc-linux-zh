  md: '# Other Effects


    Script-Fu can also be used to create many other things besides simple text. Among
    other things, they can render patterns, fractals, geometric shapes, and many other
    odd things, some of which you might find useful. You can find many of these scripts
    under Xtns, Script-Fu, Patterns and Xtns, Script-Fu, Misc. I haven''t gone into
    much detail here, as each of these scripts has its own special purpose, and some
    of these are merely proof of concept exercises more than anything. Figure 21.10
    illustrates some of the possibilities available with these type of scripts.


    # Figure 21.10


    Some of the patterns and textures produced by Script-Fu.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_301_0.png)


    # Script-Fu to Alter Images


    Now come some of the other type of scripts—those that alter images and behave
    like a filter. Remember that most of these scripts can be found from the right-click
    menu in Script-Fu. Unlike their counterparts, these kinds of scripts require the
    presence of an open image on which to do their work. And their effects on your
    image are limited only by the script''s ingenuity. Alas, I have encountered scripts
    that do little to an image, and others that leave it in a completely unrecognizable
    state. That''s part of makes playing with and trying new scripts so fun.


    # Drop Shadow


    The first example illustrates a simple, yet very helpful: the Drop Shadow. No
    more hassling with blurring and offsetting here—a simple execution of a script
    can give your object a nice, clean, antialiased drop shadow in a matter of seconds.
    This will lend your image a nice, simple, 3D look and feel.'
