    installation snap.


    # Summary


    Now that you have the resources available, you should have no problems getting
    GIMP

    to do more than it had had done before. Go to the GIMP Plug-in Registry (http://

    registry.gimp.org/) and download and install as many plug-ins as you can.

    When you play with this stuff, keep in mind that your directory structure might
    differ

    than the one illustrated in this book (that is, your administrator might have
    installed it in

    /usr/local or even /opt...). Also in mind that plug-ins might have special

    needs, such as file dependencies or they might need to be installed as root. Therefore,
    I

    cannot stress this enough: README is your friend.


    # Q&A


    +   - I get an (insert error here) error during the make stage. What do I do?

    - Make sure that the gtk and glib libraries are the latest compatible version,

    make sure that the plug-in version is the latest available as well. If these two

    criteria are met and you are still having problems, it might be that your makefile'
  merge: -1
  pgno: 273
- img_proc: true
  md: '# About Plug-ins


    is looking for libraries that aren''t in their proper location. You should compare
    notes between what the Makefile says and where files are actually located.

    Otherwise, you might have a good for GIMP gurus to answer.


    Q My source has no Makefile and no good instructions! What do I do?


    A You can either try a straight compile, or create a Makefile. This is a little
    beyond the scope of this book, and it can be a little disconcerting to those with
    little or no programming experience, doing this once or twice will make the process
    more bearable.


    If you run across a source package like this and you still want to pursue it (fortunately
    most packages are packaged a little better), the best thing to do is to get online
    and ask questions. You will find someone willing to help you. There are also many
    good tutorials and references for this situation. Be warned that the few plug-ins
    packaged in this manner to be new and experimental, so you are somewhat on your
    own. (But again, life on the bleeding edge can be rewarding in and of itself).


    # Exercise


    In the next hour you will do a little exploring into some of these more complex
    plug-ins. After that, I have little doubt that you will be inspired to find, download,
    and compile many of these great plug-ins as you can. Remember that for every plug-in
    you touch on, there are at least 10 more out there that are just as neat, if not
    better. Go get ''em!


    As with anything, the best way to approach this if you''ve never done it before
    is to start small and simple. Go to the plug-registry online and find what would
    look to be simple, uncomplicated filters. Use gimptool to compile and install
    them. Do this a few times, moving up the ladder to some of the larger and more
    complex plug-ins, and before you realize it, you will soon have installed every
    GIMP plug-in there is.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_274_0.png)'
