- img_proc: true
  md: '# Transformations


    FIGURE 6.4


    The Crop tool enables you to easily eliminate unnecessary parts of an image.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_92_0.png)


    # Transform


    The Transform tool works its magic by moving image information around your specifications,
    thus creating transformed versions of the original. It can be used to rotate,
    scale, skew, and distort images, selections, or layers. Double-click the Transform
    tool to bring back the options, which you can see in Figure 6.5.


    FIGURE 6.5


    The Transform tool can perform some pretty interesting effects.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_92_1.png)


    # Rotation


    The first option you will look at is Rotation. This works pretty much as you would
    expect from the name, enabling you to rotate the image or selection by clicking
    and pulling it in the direction you want to rotate. As you move, you should notice
    a small window pop showing the angle of the rotation. The Rotation tool is especially
    useful when working with scanned images that might not have been scanned perfectly
    straight. Look at Figure 6.6 to see a before-and-after version of an image that
    needed to be straightened with the Rotation option.'
  merge: -1
  pgno: 92
- img_proc: true
  md: 'There are extra Rotation options in the menu. Right-click your image and go
    to Image, Transforms and you should find options that enable the rotation to be
    performed by degrees of 90, 180, and 270.


    | By holding down the Ctrl key while rotating, you can turn your image in 15-degree
    increments. |


    # FIGURE 6.6


    The original image is at an unattractive slant, but the rotation has corrected
    it.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_93_0.png)


    > The Smoothing option of the Transform tool works somewhat like antialasing as
    you perform the different transformations, blending the image as it changes. If
    you perform many rotations in a row, it can sometimes result in a blurry image
    because it is blending each one in turn. After you know the degree of rotation
    you want the image to end up with, you can get a sharper look if you go back to
    the original and rotate only once to the desired angle.


    # Scaling


    This effect sounds interesting, but I promise you won''t find any snakeskin here.
    The Scaling function works by scaling your image or selection to a specific size.
    With scaling activated, the Scale options, as shown in Figure 6.7, show up as
    soon as you click your cursor on any corner of the image to begin the operation.
    The information includes the original image width and height, the current width
    and height which changes as you scale the image, and the X and Y ratios. If you
    want to merely scale the size of the image without stretching it out of shape
    one way or another, you must make sure the X and Y ratios match.'
  merge: -1
