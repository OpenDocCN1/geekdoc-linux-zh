    ```


    Of course, this might need a little tweaking from the example listed here, and
    the device setting will depend on how your device is set up. If you are using
    one of the pens that shares a PS/2 with your mouse, /dev/mouse should be a safe
    bet. Likewise, if it uses a dedicated serial port (recommended), you will need
    to use /dev/ttyS0.


    After this is in place, you will need to make sure that the GIMP supports X. This
    is actually done through GTK, so you might need to patch it. (The latest releases
    of GTK have built in.) You can grab patches for GTK here: http://www.gtk.org/-otlaylor/xinput/patches.html.
    You will need to recompile GIMP after applying the patches.


    # A Word About Video Editing


    Video editing in GIMP is now in its infantile development stages, but it promises
    to be quite powerful in future releases. Nonetheless, you can get started playing
    with video now—with a few tweaks.


    As of yet, you cannot use the ATI All-In-Wonder card with Linux, although there
    is work now done on this. Stay tuned, this could change pretty quickly.


    There is right now another developmental branch of GIMP development that is singularly
    dedicated to improving interoperability with the GIMP and professional video editing
    equipment. This series is not yet ready for prime time, but if you are inclined,
    you can learn more about it at http://film.gimp.org.


    # Summary


    Using peripherals in order to acquire and manipulate graphics with Linux is usually
    not a difficult task, but it can be a process that requires a little digging.
    certain devices (especially scanners) might have support from specific software
    packages. Some of them are all commercially supported. Any good Linux resource
    or'
  merge: -1
  pgno: 332
- img_proc: true
  md: 'search engine inquiry, should land you some good results. There really aren''t
    that many PC devices that aren''t supported by Linux in some way. The trick is
    to research. Chances, no matter how obscure you device may be, if more than 500
    people have one, at least one of them has gotten it to work under Linux.


    # Q&A


    +   Q I have a USB device. Can I use that?

    - Perhaps. USB support in Linux is really in its infancy, but it is there. USB
    support does require you to patch the kernel. Because this is life on the bleeding
    edge, you might be successful at getting the device to work. But if the device
    is a pretty cutting-edge, standard one, there is no reason why it would work.
    Therefore, although I wouldn''t recommend buying a USB device explicitly for use
    in Linux at this point in time, expect this situation to change quickly. In any
    case, full USB support should work its way into kernel releases after it has proven
    to be reliable enough. (By the way, if you happen to be an iMac owner, you''re
    a perfect candidate to help test and debug USB support in Linux.)


    # Exercise


    Well, honestly, if you have such graphics-related peripheral device, chances are
    you want it to work in Linux, so that isn''t much of an exercise, really. Your
    assignment then, now that the end of the book is at hand, is try and surpass everything
    you have learned so far. At this point, if you have followed the tutorials diligently,
    you have acquired a base of understanding that will enable you to create stunning
    digital graphics with a little effort and creativity. The journey is far from
    over. One thing I have encountered often in my pursuits is the simple, yet true,
    popular signification: “The more I learn, the more I find out that I don''t know
    as much as I thought I did...” As you have probably found, this maxim is especially
    true in the realm of computers. So, with that in mind, keep at it! And remember
    that the fun you have had learning what you know so far in comparison to what
    lies ahead. You ain''t seen notin''!'
  merge: -1
