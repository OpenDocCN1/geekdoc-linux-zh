- img_proc: true
  md: '# What the Heck Is Script-Fu?


    frequently happens when the user references a font that is not installed (or is
    misspelled, as has often happened to me), a numeric value that is invalid or out
    of range, or the script internally references a GIMP plug-in that is not installed.
    In all practicality, 99 percent of all Script-Fu errors are a result of faulty
    information, either from non-installed fonts, misspelled fonts, or entering wrong
    information (using normal where the script viewer expects medium, for example.)
    This is precisely why having a font viewer utility nearby is of great use to anyone
    using the GIMP extensively.


    +   Q I downloaded a script into my .gimp/scripts directory, but it''s not showing
    up.


    +   A Make sure to click Refresh from the Xns menu any time you add a script.


