- img_proc: true
  md: 'the exact colors you need to cover scratches, bends, and so on, directly from
    the area surrounding the damage, and then replace the bad portions with the cloned
    portions, perfectly blending colors and textures.


    The Clone tool uses the Brush dialog box (File, Dialog, Brushes) to set the size
    and shape of the area, so that you can clone one pixel at a time, which is great
    for areas that need extreme detail. You can set a bigger brush size to paint in
    large areas of the image, which is good for filling in missing pieces of backgrounds.


    Double-click the Clone tool to bring up the options, as in Figure 17.3.


    # FIGURE 17.3


    The Clone tool offers a few choices.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_247_0.png)


    +   - **Image Source**—Clones a selected area of the image.

    - **Pattern Source**—Enables painting with a chosen pattern.

    - **Aligned**—When this option is checked, the Clone brush can create a duplicate
    of an entire image or pattern from the point where you begin painting. If you
    release the mouse button, and then begin painting, it will pick up where you left
    off. In other words, it allows you to stop painting and resume again without starting
    a new clone. With the Aligned option unchecked, the cloned area will be duplicated
    over and over again, starting a new clone each time you release the mouse and
    start painting.


    To clone, place the cursor over it, and hold the Ctrl button as you click. Then
    release Ctrl and left-click in the area you want to begin painting with the clone.
    As you can see in Figure 17.4, using the Clone tool and a soft brush, the most
    and scratch marks are already beginning to disappear.


    After start working with this tool, you''ll find you can do some repair work extremely
    quickly and easily. Even with no additional restoration, the photo, shown in Figure
    17.5, is already looking a lot better.


    > Try using one of the artistic filters, such as the GIMPressionist, to add some
    texture and help hide flaws in a severely damaged image.'
