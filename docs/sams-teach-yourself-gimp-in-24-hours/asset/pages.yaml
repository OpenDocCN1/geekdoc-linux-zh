- img_proc: true
  md: '# Q&A


    Q I want a photo to appear just barely visible (as if in a fog) so I can use it
    for a background. How can I do that?


    Add a new layer in white and adjust the opacity until you get the effect you want.


    Q What is the best file format to save my photos in?


    A That depends on what you are planning to do with them. For Web use, JPEG is
    the format of choice for photos. If you want to view them on your own computer
    or maybe do some editing, any format that supports full color will be (BMP, PNG,
    TIFF). If you recall from Hour 15, “Web Graphics,” the JPEG loses image quality
    each time it is edited, and then resaved with the changes, so if you plan on doing
    anything to the images besides simple viewing, you''ll want to choose something
    other than JPEG.


    # Exercise


    To put into practice what you''ve learned during this hour, try these two assignments:


    +   1. Get the lousiest photo of yourself (you know, the one where you had spinach
    in your teeth, or maybe that one where your hair resembles that of a troll doll).
    Use the tricks you''ve learned and see just how much better you can make it!


    +   2. I know you''ve been dying to do this one, so right ahead. Pull out that
    old, dog-eared, crumpled, faded photo of your first love that you''ve been sporting
    around in your wallet for how many years? Restore it, and then sit back and admire
    your work.'
  merge: -1
  pgno: 255
- img_proc: true
  md: '![](img/1e2e1cd1a8efa63a199c864a651e3086_256_0.png)


    # HOUR 18


    # # Digital Painting


    According to my dictionary, to paint means to “make a representation paints or
    colors”. It would follow then that everything created in the GIMP could actually
    be considered a digital painting.


    In this hour though, you are going to explore some techniques in digital painting
    that are akin to real painting—the kind where you have brushes, easels, and turpentine
    (a smock and beret if you''re really into it!). You’ll use various brushes and
    settings to create different looks that are similar to watercolor and oil paintings.


    There are several factors that can make painting with GIMP in the digital realm
    even more enjoyable than painting on canvas.


    +   - You can undo and start over every time you make a mistake.

    - You have a plethora of tools and filters to help your natural talent along.

    - You won’t spill paint on your clothes and there are no brushes to clean when
    you’re finished.'
  merge: -1
  pgno: 256
- img_proc: true
  md: '# Simulating Painting


    In Hour 13, “Artistic Filters,” you learned about some of the artistic filters,
    such as GIMPressionist and Van Gogh, which can give any photo or image the appearance
    of a work that has been painted.


    What you are going to do now is a little different. Using a tutorial approach
    (and familiarity with the basic program tools acquired from the previous hours),
    you are going to make three paintings from scratch—each with a blank canvas and
    work your way through from beginning to end until you have complete paintings.
    After you''ve finished the tutorials, you will feel comfortable using your mouse
    as a paintbrush handle. While painting, try to keep the following tips in mind:


    +   * Keep the Brush dialog box open to make it easier to switch brushes and settings.
    You can minimize it to keep it out of the way.

    * Use a new layer for each consecutive step of your painting. That way, if you''re
    not happy with a certain section, you can delete the entire layer and start a
    new one.

    * As with all graphics, remember to keep light sources and shadows consistent
    on all objects in the painting.

    * Utilize the Magnify tool when working on small, highly detailed areas.


    # Lesson 1—Watercolor


    This first painting simulates a rose that has been painted with watercolors.


    By opening a new white canvas in a medium to large size. Add a new transparent
    layer (you’ll come back to the white background layer later).


    To get the basic rose shape, use one of the small plain brushes to sketch in a
    rough outline of the flower, as in Figure 18.1.


    Figure 18.1


    A simple sketch forms a basis to grow on.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_257_0.png)'
  merge: -1
  pgno: 257
- img_proc: true
  md: '# Digital Painting


    After you have the sketch, you''ll be surprised how easy it is to fill in the
    colors and have your painting complete. When going for a watercolor color, think
    how you would paint if you were using real watercolors. You would have a medium
    sized soft brush to spread the water paint, with so choose a GIMP brush that would
    be similar to that. I like to use the circle fuzzy brushes. You might also want
    to adjust the opacity slider in the Brush dialog box to give the painting transparent,
    watered down look. In Figure 18.2 the darker edge colors have been painted in
    (in a new separate layer, of course).


    # Figure 18.2

    Use smooth, easy strokes to fill with color, just as you would with a real paintbrush.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_258_0.png)


    Keep adding layers, and by reducing the opacity of the brush each time, you can
    paint in lighter, watered-down hues of the same colors to get a blended appearance,
    as in Figure 18.3. To give the colors a softly blended look, try using the Blur
    filter to apply a slight blur over each new layer of color.


    # Figure 18.3

    The painting gets a softer look as each new layer of color adds highlights.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_258_1.png)


    > Because the Eraser tool also uses the Brush dialog box options, you can use
    it to lighten colors that have been painted too dark. By reducing the opacity
    in the options, it will not erase completely, but it will erase in varying degrees
    according to the opacity setting. Think of it as an unpaint brush.'
  merge: -1
  pgno: 258
- img_proc: true
  md: 'After you have the flower portion finished, go back to the white background
    layer and color in the background. For the background in Figure 18.4, a radial
    gradient was used to give a little glow around the rose. Over the gradient, I
    used sweeping motions with a large brush (with reduced opacity and white as the
    color) to give the background of wrinkled look that sometimes happens when painting
    with watercolors.


    # Figure 18.4


    With GIMP and a little planning, you can produce watercolor simulations that appear
    though they were painted with a brush on paper.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_259_0.png)


    # Lesson 2—Landscape


    Now try a more complex image, this time giving the appearance of a more detailed
    oil painting.


    Open a new image window—give yourself plenty of room. Don’t use a sketch to start
    off this time, that way, you can add sketches of elements as your imagination
    calls for them.


    Because you are doing a landscape, start off by filling in the background with
    a vertical linear gradient going from a dark to light blue (or color of your choice)
    for the basis of a sky. Add new transparent layer and choose one of the small
    texture brushes to begin a white cloud formation, as in Figure 18.5.


    # Figure 18.5


    To begin the clouds, dab in a line of white using a texture brush, such as the
    Galaxy, small brush.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_259_1.png)'
  merge: -1
  pgno: 259
- img_proc: true
  md: 'To fill in the rest of the clouds, choose a very light shade of the sky color
    and a fuzzy brush tip. Use the Airbrush tool to give the clouds some shape using
    small circular motions (see Figure 18.6). After the shape is there, blur to soften
    the clouds.


    # Figure 18.6


    With few wispy clouds here and there, the painting has a start.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_260_0.png)


    This painting is screaming for mountains, so add a few of those too.


    To form the mountains, you''ll need a simple custom brush with a flat tip, similar
    to a fan brush used in oil painting. To make this, open a new, very small image
    (around 15 × 10). Draw a straight line horizontally across the center of the image.
    Right-click, and select Script-Fu, Selection, To Brush (in the description option,
    name it something such as *fan brush* or *line brush*). If you check in the Brush
    dialog box, you''ll find the new brush waiting for you.


    Take the new shapes, reduce the opacity a little, and use quick downward strokes
    to put the basic shapes of mountains. By having the opacity reduced, you''ll see
    that overlapping the strokes causes the mountainside to automatically gain cliffs
    and ridges, as in Figure 18.7. You might want to add a few lighter strokes to
    highlight one side of the mountains as if the sun were shining on them.


    Now that you have a start on the mountains, you''ll need a tranquil line in front
    of them. Use the Rectangle selection tool to select the mountains and a large
    part of the sky. Then copy and paste it into a new transparent layer. Use the
    Flip tool to perform a vertical flip on this new layer and place it so that the
    foot of the mountains meet on both sides to form a reflection. Use a 180 degree
    motion blur on the reflection layer and reduce the opacity a little to give a
    more realistic effect, as in Figure 18.8.'
  merge: -1
  pgno: 260
- img_proc: true
  md: '# FIGURE 18.7


    A custom horizontal brush makes quick work of building mountains.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_261_0.png)


    # FIGURE 18.8


    The Flip tool saves you the trouble of painting in a reflection.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_261_1.png)


