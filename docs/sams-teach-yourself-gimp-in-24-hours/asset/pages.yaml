    Now that you''ve seen the various file formats that GIMP supports, you will doubt
    want to experiment with them and discover their strengths and weaknesses for you.


    # Closing and Saving Files


    Since you have opened a file, you will probably want to do something to it, and
    save it to your disk. The procedure is simple. You go to the dialog box by right-clicking
    the image you want to save, and selecting File, Save as (see Figure 2.8). This
    right-click pulls up the additional menu items that ultimately add a tremendous
    amount of functionality to the GIMP by letting access filters, scripts, and many
    other options. (These are discussed in detail in the following hours.)


    To save a file, bring up the Save Image dialog box, enter the name of the file
    in the text area, name your file (with the three letter extension), and click
    OK, as shown in Figure 2.9.'
