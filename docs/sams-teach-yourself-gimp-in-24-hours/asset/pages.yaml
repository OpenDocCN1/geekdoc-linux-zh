  md: '![](img/1e2e1cd1a8efa63a199c864a651e3086_294_0.png)


    # HOUR 21


    # # What the Heck Is Script-Fu?


    Script-Fu adds a tremendous powerhouse of additional functionality to GIMP by
    enabling you to automate and group together some of your favorite and most used
    effects into GIMP-executable scripts. This is a very useful feature, especially
    if you happen to have a favorite effect that requires the application of a number
    of various steps (that take a while to do by hand).


    If the effect is cool enough, the benefit of writing a script is two-fold. First,
    you won''t have to go through every step to re-create the effect again, and second,
    in the open source tradition, you will probably post your fantastic scripts on
    your home page for the entire world to download and use. This is where the power
    of Script-Fu is most easily observed: By becoming a Script-Fu collector, you will
    gain a potentially massive library of quick-and-easy effects that can be remarkably
    complex in nature and difficult to reproduce otherwise.


    Script-Fu scripts are generally written in a language known as SCHEME. However,
    if you are more comfortable in another programming language'
  merge: -1
  pgno: 294
- img_proc: true
  md: 'environment, the GIMP also has plug-in interfaces available for the use of
    Perl and a few other languages for your scripting needs. Given a little fortitude
    and patience, there’s almost nothing you can’t accomplish with a well-written
    script!


    Because Script-Fu employs the use of a fully-fledged scripting language, the possibilities
    that this tool gives you almost limitless. These scripts appear in the GIMP not
    as files with a few sequential instructions, but with a graphical front-end in
    the GIMP style. In fact, without the knowledge of what exactly Script-Fu is, scripts
    appear to be the end user just as any GIMP plug-in would. They truly are a blessing.


    # Using Script-Fu


    Now that you know a little about Script-Fu, you can start using some scripts.
    By default, GIMP comes with a plethora of great scripts to start with right away,
    but of course you will want to download and try out new ones. The first thing
    to know is that Script-Fu scripts are stored in text files with a SCM extension.
    Therefore, installing a new script is as easy as downloading one to ~/.gimp/scripts
    directory. Depending on what the script is supposed to do, it should be categorized
    somewhere under Xtns, Script-Fu in the Tool dialog (or Script-Fu from the right-click
    menu). The general rule of thumb is that scripts that alter an existing image
    are usually stored under the right-click menu, whereas scripts that generate new
    graphics from scratch are stored in the Xtns menu. If you are wondering where
    to acquire more of these scripts, gimp.org has references to many Scriptmaster’s
    resources.


    # Script-Fu Examples


    The first scripts you will try out generate new graphics from scratch, so you
    can really see how they work. One of the best things to use Script-Fu for is text
    effects, like those used as Web page headers and so forth; Script-Fu has gained
    quite some measure notoriety for its utility with this purpose in mind. By setting
    a few variables, such as font properties, color, texture, background, and so,
    you can use these scripts to wipe up some awesome text with absolutely no work.
    Script-Fu is indeed the Lazy Webmaster’s dream tool because you can come out looking
    like a real pro in a few seconds. Is it considered cheating to use this method
    to create difficult looking logos with little effort? Maybe not, but it is fun
    nonetheless.


    # Text Effects—Quick and Easy


    To use your first Script-Fu text logo, try out one named Basic 1, because it is
    one of the simpler effects.


    First, go to Xtns, Script-Fu, Text Logos, Basic 1. You’ll see the dialog pop-up
    now, as shown in Figure 21.1. You can choose the appropriate options, such as
    font size,'
  merge: -1
  pgno: 295
- img_proc: true
  md: '# What the Heck Script-Fu?


    color or pattern, effect depth, etc., whatever the script offers you. Now simply
    click the Ok button to see what this one does. This illustrates just how easy
    it is to create a simple logo. You now merge layers, reduce color depth, and save
    as a GIF for a quick and easy header. That was easy. Let''s go ahead and try another
    one, then.


    # Figure 21.1


    The Basic 1 dialog box and result. It''s as easy as that.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_296_0.png)


    This next one, named Starscape, creates a slightly more complex logo. The steps
    in creating one are exactly the same as before. After running this script, you
    should have a result similar to Figure 21.2.


    # Figure 21.2


    This logo is a little more complex looking, but just as easy to create.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_296_1.png)


    You could stop there and be happy with what you''ve got, but one of the great
    things about Script-Fu is that it frequently leaves you with an image that is
    still in a layered format. This is nice because it leaves you free to alter and
    enhance the resulting image as'
  merge: -1
  pgno: 296
- img_proc: true
  md: 'you see fit. In this example, the image background and some colors and textures
    were altered, and whammo! The end result is something that looks quite different
    from the original (see Figure 21.3).


    # Figure 21.3


    Most scripts leave the image layered and ready for more tweaking by hand.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_297_0.png)


    For the Script-Fu example, they named Glossy. It''s a little more sophisticated,
    and it happens to be one of my personal favorites.


    The first thing to do is open the Glossy dialog box by going to Xntns, Script-Fu,
    Text Logos, Glossy (see Figure 21.4). After Glossy does its magic, it creates
    a neat embossed effect (see Figure 21.5).


    # Figure 21.4


    The Glossy Script-Fu dialog box. As you can see, with Script-Fu it is possible
    to define any number of variables that can enrich the script and make it much
    versatile.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_297_1.png)'
  merge: -1
  pgno: 297
- img_proc: true
  md: '# What the Heck Is Script-Fu?


    # FIGURE 21.5


    The effect after having defined some fairly standard variables. With Script-Fu,
    sharp logo creation is almost too.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_298_0.png)


    You might have noticed that the Script-Fu dialog boxes have no drop-down menus
    or preview boxes in reference to fonts (like the Text tool does). This isn''t
    so bad, except that you might not remember all the fonts installed on your system,
    or you might just want to browse the fonts to see what suits your fancy.


    Actually, this is not a problem because there are many good third-party previewers
    to choose from. For example, if you''re running a standard Linux setup, you already
    have a program called xfontsel if you have a few fonts and are running at 1220
    × 1024 resolution or above, because the font list tends to scroll way off screen.
    For the rest of us then, there are two good options.


    If you are a KDE user, there is a program in the distribution called kfontsel,
    which is a very handy application.


    Otherwise, there''s a similarly good program that completes the GNOME project
    called gtkfontsel (see Figure 21.6). I like this program. You should go ahead
    and snag it from http://glade-pn.org/fontsel/ right away (along with the rest
    of the GNOME distribution, while you''re at).


    Another thing to keep in mind is that many scripts require some pretty information
    from you, such foundry, weight, and so on. Not only is it difficult to remember
    which foundry font belongs to, but some fonts have different ideas of weight—some
    use normal while others use medium, for example. This is another situation where
    one of these font utilities will come in handy.


    Fortunately, future versions of GIMP (what''s in development right now) would
    include an implementation of Script-Fu with more robust Font, Pattern, and Gradient
    dialog boxes.


    You probably noticed that the application of this script involves many individual
    steps. As it renders the effect, you can observe each plug-in referenced within
    the script doing its thing. So, the script did nothing you couldn''t do by hand—simply
    performed these actions for you.'
  merge: -1
