  md: '# Framing Photos


    Now that you''re learning all these great photo effects, you will probably want
    to show off your work. Whether you are going to display your images on your desktop
    or print them, a good way to give a final finishing touch is to add a frame.


    To begin the frame, open any image. I will use the simple composite from the beginning
    of this hour.


    Check the size of the image by right-clicking, and going to View, Window Info.


    Now you need to decide how large the image will need to be with a frame added.
    Because the image for the example is 400 × 350, it would be good to make the frame
    20 pixels wide. Open a new blank window and make it 40 pixels bigger than the
    original image in width and height, making it 440 × 390. That will give you 20
    pixels on each side to form the frame.


    Go back to the original image and select Edit, Copy, and then Paste, into the
    new window. It will automatically be centered on the plain background, giving
    it a border. Deactivate the selection.


    Click on the Fuzzy Select tool to activate it and click once anywhere in theing
    area. This area will now become surrounded by the selection marquee, as shown
    in Figure 16.15.


    Figure 16.15


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_239_0.png)


    The border area is selected and ready for whatever effect you choose to apply.


    For this image, a wood border will look good, so you can use a pattern fill. Open
    the Pattern dialog box (File, Dialogs, Patterns), and choose one of the wood patterns.
    The'
  merge: -1
  pgno: 239
- img_proc: true
  md: 'one for this example is called wood#1. Double-click the Bucket tool to activate
    it and bring up the options box. Choose Pattern Fill and click in the selected
    area to fill.


    Now you have a nice wood frame around the image, but before you deactivate the
    selection, there''s one thing you can do to make it look good.


    Right-click the image and go to Script-Fu, Decor, Add Bevel. Use the default setting
    in the Bevel Options box and click OK. Activate the selection and there you have
    it. A quick-and-easy beveled photo frame, as illustrated in Figure 16.16.


    # FIGURE 16.16


    A beveled wood frame sets off the image and takes little effort to make.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_240_0.png)


    Now try a frame with a little more pizzazz.


    Once again, open any image, get the dimensions and make a new blank image window
    40 or so pixels larger. Select Edit, Copy and Edit, Paste the original image into
    the new blank window. Use the Fuzzy Select tool to select the border area.


    This time, fill the border area with a light-colored pattern. For the illustration,
    I''ve chosen wood.


    This time, you are going to add a shadow to give the impression that your image
    is underneath the border, just as a real picture would be underneath the mat of
    a picture frame. With the border area still selected, right-click the image and
    go to Script-fu, Decor, Xach-Effect. Leave the default settings and click OK.
    The image will have a shadow from the top and left sides of the border. Add a
    small shadow on the other sides by right-clicking once more and selecting Script-Fu,
    Decor, Xach-Effect. This time,'
  merge: -1
