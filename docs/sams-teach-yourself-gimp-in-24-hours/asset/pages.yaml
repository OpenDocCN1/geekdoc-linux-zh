- img_proc: true
  md: '# Hour 2


    # FIGURE 2.7


    The Load Image dialog shows you a listing of the files on your disk.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_37_0.png)


    In the directory listings on the left, you will see two directory representations
    you might be unfamiliar with: ./ and ../ ./ refers to the directory you are currently
    in. Double-clicking it will allow the contents of the working directory to be
    refreshed, which is good if you happened to have changed the contents of the directory
    while the dialog box is open. The ../.. option, even more importantly, allows
    you to go back one directory into the one containing the directory you''re in.
    Sound confusing? You will just have to try it out and see. (For reference, if
    you''re from a Windows background, /.. functions exactly the same way as the Up
    icon in Windows Explorer.)


    Below the directory listings, you will see an Detect File Type drop-down menu.
    Most of the time, this can be left on Automatic with no problems. However, in
    the event that GIMP fails to recognize the file you are trying to open, you might
    need to tell GIMP exactly what type of file it is by selecting it in the Detect
    File Type menu.


    # File Formats


    So, what kind of files can the GIMP deal with? The GIMP can open and save just
    about any file format you could ever care to use, and then some.'
