  md: '# Wacom Pens and Other Pointing Devices


    Using Wacom pens is a matter of getting the device recognized by X. You must have
    the XFree86 module xf86Wacom.so available in order for this work. It comes with
    most distributions of XFree86, otherwise, you can get it from

    http://www.levien/free/linux_intuos.html. You will need to make sure that it is
    in your modules, which is probably /usr/X11R/lib/modules.


    In order to get XFree86 with another pointing device, you will need to edit /etc/X11/XF86Config
    file. Add is the module in the modules section of the config file, like this:


    +   Section Modules

    Load xf86Wacom.so

    EndSection


    Then, X will need to set some parameters for using the module. These are set in
    the Xinput section, in this example:


    +   Section "Xinput"

    Section "WacomStylus"

    Port "/dev/tty0"

    DeviceName "Wacom"

    Mode Absolute

    Suppress 15

    EndSection

    Section "WacomStylus"

    Port "/dev/tty0"

    DeviceName "WacomCore"

    Mode Absolute

    AlwaysCore

    Suppress 15

    EndSection

    Section "WacomCursor"

    Port "/dev/tty0"

    DeviceName "CURSOR"

    Mode Absolute

    Suppress 15

    EndSection

    Section "WacomCursor"

    Port "/dev/tty0"

    DeviceName "CursorCore"

    Mode Absolute

    AlwaysCore

    Suppress 15

    EndSection

    Section "WacomEraser"

    Port "/dev/tty0"

    Mode Absolute

    Suppress 15'
  merge: -1
  pgno: 331
- img_proc: true
  md: '# Using Peripherals with Linux


    ```

    EndSubSection

    SubSection "WacomEraser"

    Port "/dev/ttyS0"

    DeviceName "EraserCore"

    Mode Absolute

    AlwaysCore

    Suppress 15

    EndSubSection

