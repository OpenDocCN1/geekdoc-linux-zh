- img_proc: true
  md: '![](img/1e2e1cd1a8efa63a199c864a651e3086_186_0.png)


    # # HOUR 13


    # # Artistic Filters


    You''ve seen a little of what filters can do. In this hour, you will expand on
    what you''ve learned in Hour 12, “Using Filters to Improve or Distort Images,”
    and get into some of the more eccentric and exciting effects you can create with
    such filters and a little experimentation. These are the kinds of things that
    make the unhardened graphics newbie ooh and ahh with delight and amazement.


    # # Using Filters Artistically


    These filters (and most filters you encounter in GIMP) are designed to add some
    abstraction to your image—sometimes in order to approximate a real life effect
    (such as painting and brush techniques, murals, and so forth), and sometimes to
    create something new and unique. All filters are subcategorized into different
    menus as Artistic, Color, Combine, Distort, and so forth, depending on what they
    do specifically, but ultimately they are made with the same goal in mind—to abstract
    your images.


    You will use these filters in the same way you activated the enhancing filters
    in the previous hour—only the desired effects of using filters has changed'
  merge: -1
  pgno: 186
- img_proc: true
  md: '# Hour 13


    somewhat. Now you should concentrate not on making your image more life-like,
    but just the opposite. Of course, there is no way to cover all the GIMP filters
    here there are so many, but the most common and useful ones will be touched, giving
    you a basic understanding and the knowledge to apply them in given situations,
    such as the tutorials in upcoming hours. Many filters work in the same way so
    it should be relatively easy to figure out any new filters you encounter and how
    they work.


    Now then, the rarest filter available in GIMP is the GIMPression. This filter
    (or better yet, plug-in encompassing a whole suite of filters) does not come with
    the base distribution of GIMP at this time. However, if you installed the GIMP
    from the ROM, chances are you have it on your system. If not, it is available
    from the GIMP Plug-in Registry at http://registry.gimp.org/.


    # GIMPression


    It things like GIMPression that make Linux and working with free software worthwhile.
    It does intensive and fantastic effects and textures, and it can make any ordinary
    image look really cool. The GIMPression will quickly become one of your most used
    and well-liked utilities in GIMP. It''s great for creating a set of graphics with
    a matching look and feel (Web graphics come to mind), adding just enough texture
    to a photograph to transform it from ordinary to unique, with minimal effort,
    and doing some weird things with pictures.


    The term GIMPression, as if you haven''t already figured it out, is a play on
    words with impressionist, which is, of course, the famous school of art that uses
    brushes, paints, and stroke methods to paint everyday subjects with fuzzy, glanced-at
    appearance. GIMPression expands on this concept by giving you access to many brushes,
    styles, and patterns to distort your images just enough to give them an impressionist
    tone. And, as anything in the GIMP, everything in GIMPression expandable—you can
    add your own brushes and patterns later on if you choose. It is a marvelous plug-in.
    It is also a pretty complex and sophisticated


    To use GIMPression, you obviously need an image to start with that you want to
    manipulate. In this example, as shown in Figure 13.1, start with an image and
    open the GIMPression dialog by choosing Filters, Artistic. Before you begin, you
    should make sure that a local copy of the GIMPression data files are located in
    your .gimp directory (You can do this by copying the contents of /usr/share/gimp/gimpression
    to ~/.gimp). This will enable you to make customizations easily.'
  merge: -1
  pgno: 187
- img_proc: true
  md: '# Artistic Filters


    > Remember that GIMPressionist, as with most plug-ins, needs a full-color RGB
    image on which to work. Indexed and grayscale images will have most filter ghosted
    out.


    # Figure 13.1


    The GIMPressionist dialog box. Papers are textures that you apply to the image
    using the brushes.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_188_0.png)


    In the area, GIMPressionist gives you options for a paper texture to apply to
    your image—this will be a kind of backdrop or canvas that your image will be painted
    on. The Scale lets you set the size of the pattern, and the relief changes the
    depth of the embedded effect. (A relief of 0 allows no textured canvas, which
    is sometimes desirable.) Select any paper texture you like, and then click the
    Brush tab, as shown in Figure 13.2 (You can add more papers by copying the pattern
    in grayscale PGM format to .gimp/gimpressionist/Papers).


    # Figure 13.2


    GIMPressionist brushes. Installing more of these is as easy as copying a grayscale
    PGM file to the .gimp/gimpressionist/Brushes directory.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_188_1.png)'
  merge: -1
  pgno: 188
- img_proc: true
  md: 'Here you will have many brushes to choose from. Which brush you will alter
    the appearance of the entire effect, because the brush is the element that determines
    the texture of painting effect. You can alter the size of the brush, Relief, and
    Stroke Density, which reflects how many times the brush is applied to the image.
    (A Stroke Density that''s too high can distort your image beyond all recognition—but
    sometimes you want that.). The slider below the brush sets the brightness/contrast
    of the brush in view. Figure 13.3 demonstrates the effect applied with different
    brushes.


    # Figure 13.3


    As you can see, the wide range of brushes to choose from (and create) GIMPimpression
    nearly infinite capabilities.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_189_0.png)


    In the Orientation tab (see Figure 13.4), you will see options for altering the
    brush stroke pattern. These are fine to play with, but a little complex at first.
    The Directions option lets you choose how different stroke positions your brush
    will create (the angles at which the brush is applied). The higher the number
    of stroke positions, the more complex and random the effect will appear (see Figure
    13.4). The Start Angle option is the angle in degrees that your stroke position
    will start out with (an angle of 0 is the original brush angle as shown in the
    Brush preview). Span is the amount of derivation from its original brush rotate.


    The Orientation options let you change what type of directional application your
    brush will form. These are different patterns that determine the way in which
    the brush is applied to the picture. A Radial orientation applies the brush in
    a circular fashion around the image, each stroke painted from center outward.
    Random orientation paints them in any direction. These options are pretty self-explanatory.
    Sometimes the difference ensued by using these options is visible, and sometimes
    it''s not—experiment.'
  merge: -1
  pgno: 189
- img_proc: true
  md: '# Artistic Filters


    FIGURE 13.4


    Many ways in which a brush can be applied. Changing the direction and orientation
    values can drastically alter the feel of the image.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_190_0.png)


    The Placement tab has two options: Random or Even Distributed. A randomly painted
    image (random applied brush) has a more organic feel, whereas an evenly distributed
    one has a cleaner, more sterile feel.


    By clicking the General tab, you will see options that will affect the texture
    of painting itself. Edge Dark lets you create an effect similar to a photo edge
    mask by painting a border around your image. Edge Dark changes the width of your
    border; the border can be either a simple matching pattern paper or painted as
    a solid color. Paint Edges applies the effect all the way to the edge of the image,
    regardless of the presence of border (see Figure 13.5).


    FIGURE 13.5


    General options for GIMPressionist and the difference between a solid and patterned
    border.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_190_1.png)


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_190_2.png)


