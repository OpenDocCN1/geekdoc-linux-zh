- img_proc: true
  md: '# Using More Plug-ins and Extensions


    If you use one or more extra layers when painting, the With BG Option enables
    you to choose between Transparent, Background (your BG color), White, and Copy,
    which duplicates the background image on each new layer.


    It is easy to use these simple shapes with each other in order to come up with
    something little more complex. For example, you can use the Bézier curves in combination
    with a slanted brush to create something a calligraphic look and feel to it, or
    tweak around until you come up with a representation of a real object outline
    (see Figure 20.4).


    # Figure 20.4


    A variations of the same painted object. You can use Gfig to automate tasks that
    take a little longer to do by hand.


