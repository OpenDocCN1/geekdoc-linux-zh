- img_proc: true
  md: '![](img/1e2e1cd1a8efa63a199c864a651e3086_46_0.png)


    # # HOUR 3


    # # Basic GIMP Tools


    By now, the interface has become a little more familiar to you, and you can get
    around in the GIMP well enough to open and save images in various file formats.
    You are now well on your way toward achieving full GIMP apprenticeship. In this
    hour, you begin to learn more about the basic tools, so we can illustrate the
    essential concepts well enough to proceed into creating and editing images (which
    is why this book was written, after all). We will also begin going into a little
    more detail about some of the tools, and continue this trend into the next few
    hours, thoroughly illustrating specific techniques for using the tools productively
    and creatively.


    # # Using the Basic Tools


    As a GIMP user, you will have at your disposal a tremendous library of various
    effects, plug-ins, and scripts to help you do amazing things with graphics. The
    GIMP undoubtedly acquire many more of these in the future the program continues
    to evolve. And yet the standard tools are the ones you will likely rely on most
    for your creative tasks. Master these, and you will'
  merge: -1
  pgno: 46
- img_proc: true
  md: 'be surprised at the level of sophistication your images can achieve with relative
    ease. And ultimately, what you will be able to accomplish using this knowledge
    in concert with the intense effect capabilities the GIMP has to offer will be
    no less than astounding.


    The 21 basic tools, as shown briefly in the Hour 2, "Getting Started," are essential
    to creating nearly any image. These tools often have more than one function, and
    many options available as well. To access the additional options and functions
    of any tool in the toolbox, double-click on the Tool Button icon. This will pull
    up that particular tool’s Option dialog box, as shown in Figure 3.1.


    # FIGURE 3.1


    Additional options and functions can be invoked by double-clicking a tool icon,
    or by going to File, Dialogs, Options on the Toolbar menu.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_47_0.png)


    In the interest of continuity and organization, these tools will be grouped here
    into five basic categories—Selection tools, Transformation tools, Artistic tools,
    Color tools, and the Text tool.


    # Selection Tools


    Selection tools are a way to mark a portion of the image apart from the rest of
    the composition. This allows the program to apply any functions or changes specify
    only to which you have selected, without affecting the rest of your work. Changes
    can include, but are not limited to, alterations in color, size, shape, composition,
    orientation, and so on.


    NEW TERM


    The six tools at the top of the toolbox deal with creating and editing selections
    (see Figure 3.2). Selections enable you to select any part of an image, marked
    by a blinking border, called the marching snts or marquee (see Figure 3.3). This
    marquee is animated, and to some people resembles blinking marquee lights or ants
    on the move, depending.'
  merge: -1
  pgno: 47
- img_proc: true
  md: '# Basic GIMP Tools


    # FIGURE 3.2


    The Selection tools are valuable for affecting change on only portions of your
    image.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_48_0.png)


    # FIGURE 3.3


    A selection is made. Any changes applied by any tool or menu item would happen
    only within the confines of the marching ants.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_48_1.png)


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_48_2.png)


    > You can change the rate of the marquee (or ants) by going to File, Preferences,
    clicking the Interface tab, and changing the value in the Marching Ants Speed
    text box.


    Also, you can toggle the marquee on or off by right-clicking the image, and going
    to Select, Toggle.


    When you make a selection, you will need to use the proper select tool for the
    job. With these six tools you will set apart any shape, size, and color portion
    of an image for alterations. Later in this book, you will go over selections in
    greater detail, and learn how to utilize them to do new and interesting things
    to your images.


    # Transformation Tools


    A transformation is anything that alters the perspective of the image, whether
    it is by size, position, rotation, mirroring, or slight distortion.


    You have a good image to begin with, but something isn''t right with it somewhat.
    Perhaps you could position it little better, rotate it, or get a closer look at
    it. That''s what the Transformation tools are for (see Figure 3.4). These tools
    are great at altering the perspective, size, position, ratio, or orientation of
    an image, as in Figure 3.5.'
  merge: -1
  pgno: 48
- img_proc: true
  md: '# FIGURE 3.4


    The Transformation tools alter your image in terms of shape, size, and position.


    # FIGURE 3.5


    Transformations in actions. Transformations can make elements your graphics more
    interesting.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_49_0.png)


    # Artistic Tools


    The Artistic tools do exactly what their name implies—they enable you to draw,
    paint, erase, and brush your images with colors and patterns. The tools used to
    do these resemble the tools you''d find in any artist''s tool collection—pencils,
    brushes, erasers, airbrushes, and so forth (see Figure 3.6). And they work in
    much the same way as the real things (see Figure 3.7).


    The three last Artistic tools are unique, and worth mentioning here. The Airbrush
    works just like a can of spray paint, thickening the longer you use it in one
    place or enabling a thin spray of color to be applied with a sweeping motion.
    The Clone tool will paint with an exact duplicate of any image or pattern (which
    will come in handy for photo retouching). And the Convolve tool works like a paintbrush,
    but will blur or sharpen an image instead of painting it with color.'
  merge: -1
