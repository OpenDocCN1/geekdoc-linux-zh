  md: '![](img/1e2e1cd1a8efa63a199c864a651e3086_276_0.png)


    # # HOUR 20


    #  Using More Plug-ins and Extensions


    In this hour you will acquaint yourself with some of the more complex plug-ins
    that behave differently than mere graphics filters, and I will illustrate just
    how beneficial they can be.


    The plug-ins in this hour can be found in the Filters, Render menu, as well as
    the Xtns menu. They are like mini-applications embedded in GIMP, and can therefore
    achieve a level of complexity like no simple filter can.


    The main difference between these plug-ins and those labeled as filters is that
    they do more than just alter images. In fact, many of them will help you create
    new images and patterns from scratch, among other things. Other than that, though,
    they work in much the same way as anything else you will encounter in the GIMP.'
  merge: -1
  pgno: 276
- img_proc: true
  md: '# Gfig


    Gfig is a very interesting application, and a very well written one. Gfig is robust,
    nearly self-contained drawing program used for the design and implementation of
    geometric shapes and patterns. It was inspired by the popular UNIX application
    Xfig. Working with this tool within the GIMP environment is much more useful and
    convenient, in my opinion.


    To invoke Gfig, go to the right-click menu from any (preferably clean-slated and
    layered) image and find Filters, Render, Gfig. You will now see the Gfig interface,
    as shown in Figure 20.1. Now this is where the fun begins! To render a simple
    shape, select a preset pattern from the left in the Shapes list item.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_277_0.png)


    This is the initial window from Gfig. You can see, it is an apparently complex
    plugin-.


    Looking at the dialog box, you will see a drawing area on the left and an Object
    area to the right. The Object area is where you can load and save custom objects.
    You don''t have to save your pattern after you put it onto your image, but if
    it is good, you might want to so you won''t have to duplicate it in the future.


    Drawing common shapes in Gfig is a snap. The first thing to do is to get a clean
    palette in the drawing window. You do this by clicking New in the Object area.
    There will now be a highlighted area indicating your unsaved object. Double-click
    it to name and save it (they are saved as files in ~/.gimp/gfig). Later, if you
    want to work on it some more, you can find it in the list. Right-click and select
    Edit (or click the Load button for figures not in the ~/.gimp/gfig directory).
    You can also merge two objects into one image by'
  merge: -1
  pgno: 277
- img_proc: true
  md: '# Using More Plug-ins and Extensions


    finding an object, clicking Edit, and then finding another good drawing and clicking
    the Merge button.


    Now let''s say you want to draw something simple, such as a star. All you need
    to start with a clean slate and select the kind of shape you want to draw from
    the panel of choices in the Ops toolbar. Obviously, you would select the one that
    says Star. Now, if you click and drag over the preview, you will see a star shape
    (refer to Figure 20.1). This is much easier than simply drawing it by hand!


    These tools on the left have many options as well. For example, you do not want
    to be stuck with a four-sided star but want to draw a six-sided one. To take a
    look at all the available options, all you need to double-click the Star button.
    This will bring you a dialog box with all available star shapes, as shown in Figure
    20.2.


    # FIGURE 20.2


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_278_0.png)


    Gfig has more options for each function you will probably use. (How often do you
    need to draw a 100-sided star?) It''s great to have it available!


    After your shape is drawn, you might want to move and resize it to just get it
    so. If you look at your shape, you will notice little rectangles placed on the
    outline. These are your control points; they enable you to control the size and
    position of your object. By clicking on the Move button, and then positioning
    your cursor over a control point, you can now move the shape anywhere you want.
    Likewise, using Mvnt will move only one point at a time, thereby resizing and
    reshaping the object. Using the Copy option will create an exact duplicate of
    the object, which you can drag into any position. The control point behavior is
    a little different for each shape. For example, a star usually has three control
    points, one in the center, and two others, each corresponding with the outer and
    inner points in the star.'
  merge: -1
  pgno: 278
- img_proc: true
  md: '# 264 Hour 20


    If you need a closer or more removed view of what you''ve just drawn, you can
    use the slider next to the Scale to Image option in the Paint tab to zoom in or
    out (You may need to check the option first). You can then recheck the Scale to
    Image to restore the original view.


    After you draw your shape, you can paint onto your canvas. Gfig uses the standard
    GIMP brushes in order to draw it. Go to the Brushes tab and select the brush you
    want to use. (Click the Paint button to draw the shape using the FG color and
    brush you selected. Make sure to save your object in the Object list if you want
    to use it).


    There are a few more options to consider when painting your image. In the Paint
    tab (shown in Figure 20.3), you can set the tone for the way in which Gfig paints
    your object. Brush using the dropping menu defines what sort of drawing you will
    have selection will turn your object into a selection. Selection+Fill will paint
    your selection according to the Select tab options, which resemble the Fill tools.
    Furthermore, the Draw On will let you paint your image onto one of canvases: Original
    paints the object directly onto your image, New paints the object onto a new layer,
    and Multiple paints each single part of your object (having unique control points)
    onto a separate layer.


    # Figure 20.3


    You can manipulate the size, shape, and position of your object by using control
    points.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_279_0.png)'
