  md: '# Tip of the Day


    This option pulls up the Tip of the Day box anytime you want to look at it.


    # Dialogs


    These items you give the dialog boxes for various features and options—brushes,
    patterns, palettes, gradient editor, and tool options. These will be covered in
    the Hour 3, “Basic GIMP Tools."


    # Preferences


    This option brings up the Preferences dialog box, as in Figure 2.10. As you become
    more familiar with the GIMP, you will likely want to customize the application
    in terms of look, feel, and performance. For now, the main preference you might
    want to alter is Levels of Undo (how many steps back you can go in the editing
    process) on the Interface tab. The GIMP can accommodate a tremendously large amount
    of undo, as this is limited not by software, but if you do not have memory in
    your RAM, you might want to lower this setting. There is no reason not to bump
    this to 15 or more (if you’d really use it, of course.) Also, note that this can
    be dependent on the size of the image you are working with. If you are editing
    an extra large image, you might want to bump down a couple of notches to conserve
    memory.


    FIGURE 2.10 You can customize your GIMP installation in the Preferences dialog
    box.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_42_0.png)


    # The Xtns Menu


    The Xtns menu (an abbreviation for Extensions) contains many plug-ins and Script-FU
    items supplementing the GIMP, which are written by various talented authors. These
    items extend the functionality of the GIMP, enabling it to acquire many more features
    than it has by default. These very numerous extensions are covered in Hours 19–22.'
