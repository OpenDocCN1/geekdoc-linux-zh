  md: 'Animations can lend enhancement to any project, but keep in mind that anything
    used in excess can detract from a project more than if it hadn''t been used at
    all. So subtlety is key here (most of the time). Also, if you are going to use
    some GIFs for whatever reason, you should take into consideration that some browsers
    (Microsoft Internet Explorer, specifically) might play some of your GIFs at a
    slightly different speed (a little faster) than you might have intended, depending.
    It tends to roundup the frame speeds at times.


    # # Q&A


    +   Q I have changed the duration of each frame, but I want some frames to stick
    around longer than others. Can I do this, or do all frames have to be the same?


    +   A Frequently, each frame can have its own individual frame speed. This enables
    you to have more freedom in creating custom animated effects, including momentary
    pauses in motion.


    # # Exercise


    A good thing to do when creating Web animations is to play around with optimization
    techniques, such as color depth reduction, dithering, and so on. The smaller you
    can get the file size, the more room you''ll have to play with—to use for more
    animation detail or to ease download time.'
