- img_proc: true
  md: '![](img/1e2e1cd1a8efa63a199c864a651e3086_326_0.png)


    # HOUR 24


    # Using Peripherals with Linux


    Well, after all the techniques and tutorials outlined in this book, you have acquired
    a basic understanding of how GIMP works, and you have a competent knowledge of
    manipulating digital graphics with it. But, for all that, something this still
    missing... how to get all digital imaging devices to communicate with the GIMP.
    Using the GIMP is even more fun when digital scanners and cameras are involved.


    For what it''s worth, the quick tips outlined within this hour are pretty Linux-centric
    in nature. If you happen to be running another UNIX variant, the steps illustrated
    here are probably valid there as well, especially if you are using Intel-style
    hardware, but I can make no guarantees that everything will apply exactly the
    same.


    # Digital Scanners


    Ah, yes, the digital scanner. I don''t know what I''d do without one. The scanner
    makes using your hand-drawn and painted work a snap—not to mention making collages
    and photo manipulation that much easier to do!'
  merge: -1
  pgno: 326
- img_proc: true
  md: '# Hour 24


    So now you are faced with the challenge of attaching your scanner device to your
    Linux box. If you are in the market for a good digital scanner, there are a few
    things to keep in mind if you want to maintain Linux-compatibility.


    +   - A SCSI interface is your best option. Some parallel scanners are supported,
    and you can, at least in theory, get one of those SCSI-to-parallel to work, with
    luck and a lot of hacking, but if you want to keep your sanity, make sure that
    you get a good SCSI card to accompany your scanner.

    - You should take a look at the SANE compatibility list. SANE is the scanner interface
    software that is becoming the most frequently used and this is the one you will
    be dealing with. You can find the list at http://www.mostang.com/sane.

    - Don''t be afraid to spend a little extra. The quality you will gain by spending
    more on a higher end scanner will be worth it. The reason: besides scanner quality
    and durability, there is also the issue of user-adjustable scanner resolution.
    You will want a scanner that will let you change this easily, otherwise, you might
    be stuck with RAM-intensive stages at 1800 x 1600 resolution for something thinner
    than your driver''s license photo. This can cost a waste of time.


    There are (not surprisingly) a lot of choices faced with using a scanner with
    Linux. However, the SANE package offers the widest variety of supported devices,
    as well as any expandability and good networking support. Scanner device support
    is still in its developmental stages in Linux, so you will definitely want to
    check the compatibility list before purchasing a scanner to use explicitly with
    Linux.


    After you have chosen, purchased, and wired your scanner, getting it picked-under
    Linux isn''t too difficult, provided that you do have a fairly standard scanner
    attached to a SCSI interface.


    The first thing to do is to download the SANE distribution from www.mostang.com/sane.

    After unrarring, follow the directions outlined in the README (./configure &&
    make install), and you should be all set. Then you will want to start with the
    scanimage command. This brings up the Sane dialog box, as shown in Figure 24.1.
    You can also use it via the command line with the scanimage command. (Consult
    the man page for more details.)


    By going to scanner interface in the dialog box and selecting your scanner interface
    model, you will be ready to scan something, as long as there are no difficulties.


    To scan, turn your scanner on, load your source into the scanner, select the proper
    interface from within ximage, and press OK. Your image should appear onscreen
    shortly (see Figure 24.1). You can also use the Preview function to get a quick
    overview of the appearance of your scan.'
  merge: -1
  pgno: 327
- img_proc: true
