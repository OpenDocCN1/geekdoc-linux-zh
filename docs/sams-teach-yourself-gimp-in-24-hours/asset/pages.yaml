- img_proc: true
  md: '# Using More Plug-ins and Extensions


    working with). It will then display the thumbnails in alphabetical order. After
    you find what you''re looking for, double-click the file to open it in the GIMP
    (see Figure 20.7).


    In my opinion, GUASH has one shortcoming: the plug-in might crash when attempting
    to view files contained on a neighboring FAT16 or FAT32 partition (Windows). This
    might not be an issue by the time you read this, but to be forewarned.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_282_0.png)


    **Figure 20.7** GUASH is useful for keeping track of your images, and it also
    gives you some simple options for managing your graphics files and directories.


