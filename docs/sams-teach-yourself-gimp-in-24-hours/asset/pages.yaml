    # Summary


    This gives you a brief introduction to Web-weaving techniques from a graphical
    point of view. Although there are many aspects to be considered in building Web
    sites, graphics are an integral part of Web pages. Learning how to create and
    manipulate Web-ready images in the GIMP gives you a head start on Site design.


    # Q&A


    +   I have an image surrounded by a colored background that I''d like to make
    transparent for a GIF. How can I get the color to be transparent?


    +   Select the color or portion of the image you want to change and right-click,
    and choose Edit, Cut. Anything that is included in the selected area will then
    become transparent.


    +   Why make all those navigational buttons? Can''t I just put everything on one'
