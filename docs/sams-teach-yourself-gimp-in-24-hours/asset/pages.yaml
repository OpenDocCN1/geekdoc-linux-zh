  md: '# Photo Compositing


    # FIGURE 16.13


    This procedure will use two variations of the bird image, the original and the
    lithograph copy.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_238_0.png)


    Open the bird.jpg image and right-click it to access the menu and open the Layer
    dialog (click Layers, Layers and Channels). Add a new transparent layer.


    Open the second image and right-click, Edit, Copy, and then paste it into the
    new layer of the first image. Remember to anchor it.


    Right-click the thumbnail image of this new layer in the Layer dialog box and
    choose Add Layer Mask. Choose white in the Add Layer options box.


    In the toolbox, set the foreground color to black and the background color to
    white.


    Double-click the Gradient tool to activate it and bring up the gradient options.
    Choose Radial. Apply the gradient to the mask beginning in the center of the image
    and dragging to any edge.


    Your result will be a mixture of the original image and the lithograph copy, giving
    the illusion of a bird picture fading into a black-and-white drawing around the
    edges (see Figure 16.14). You can intensify the effect by adjusting the brightness
    and contrast before you apply your mask.


    # FIGURE 16.14


    Astonishing effects can be achieved with the use of gradient masks.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_238_1.png)'
