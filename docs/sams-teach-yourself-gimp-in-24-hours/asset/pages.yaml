    You can copy them to your machine. You can get PiCo at http://pico.i-com/


    After you get the User Filter .bf''s uncompressed and copied over to UNIX, you
    can put them in /usr/local/share/gimp/filter Now you can start using these. If
    you have Windows machines on your network, this is even easier for you. Save drive
    space by creating a symlink to the directory on the PC containing the filters.)


    Using these filters is easy. Open an image, find User Filters in the Filters menu
    and click the Filter Manager tab (see Figure 13.21). Here, you will see a list
