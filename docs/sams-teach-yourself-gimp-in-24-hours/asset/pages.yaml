  md: '![](img/1e2e1cd1a8efa63a199c864a651e3086_268_0.png)


    # HOUR 19


    # About Plug-ins


    In Hour 12, “Using Filters to Improve or Distort Images,” you learned a little
    plug-ins (in the form of graphics filters, specifically), and how to use them
    to alter your images directly. Now you will spend some time learning how GIMP
    interacts with plug-ins, what exactly they are, and how you can use them to augment
    your GIMP experience.


    # So, What Exactly Are Plug-ins?


    The GIMP relies on plug-ins for its internal operations. In fact, everything you
    do in the GIMP is the direct result of a plug-in at work. This is how GIMP was
    designed.


    Because it''s an Open Source application, development on the GIMP is taking place
    at a mind-blowing pace. New features and elements are being added all the time.
    Therefore, in order to satisfy the end user’s appetite for new functions and features,
    and to make things easier for the developer, GIMP was designed from the ground
    up to be modular application. This means that many things, such as graphics filters,
    file types, small internal applications, can be added to GIMP. They can be written
    as plug-ins, and'
  merge: -1
  pgno: 268
- img_proc: true
  md: 'can enhance the GIMP directly without the need to reinstall or recompile the
    entire application, at least most of the time. As often as new things are added
    to the GIMP, continually recompiling would be a pain.


    This modularity has many benefits. For one, a developer with knowledge about a
    certain kind of application can extend the GIMP relatively easily. For the end
    user, this is fantastic because it means he or she can immediately enjoy new benefits
    without the need to recompile the application or wait for the next release. In
    the traditional commercial arena, being able to use an added feature or function
    means waiting for another release of the product or purchasing an upgrade.) Therefore,
    an added feature such as support for a new file format, a new type of filter,
    or even a sophisticated internal application, can be enjoyed with little trouble.
    And, release development of the GIMP can concentrate on improving and stabilizing
    the application itself, providing a faster and more secure environment for these
    plug-ins to run.


    This also means that it is relatively easy for a large number of people to contribute
    to the GIMP project. And the more people contribute, the more robust the application
    will become. (It''s only at version 1.0 now; imagine how robust the GIMP will
    be a couple of major revisions from now!)


    # A WORD ABOUT GIMP DEVELOPMENT


    If you are a little daring and to try your hand at contributing to GIMP development,
    there are a few things you can do.


    +   * From the user end standpoint, if you run into a bug or find something that
    doesn''t work like it''s supposed to, you can always submit it to the GIMP bug
    report mailing address. Find out Zach Beane''s bug report at

    http://xach.dorknet.com/gimp/bug-report.html.

    * Writing plug-ins is the easiest way to contribute to GIMP development, because
    it adds features and functionality without tinkering around the core source tree.
    It also doesn''t require official approval from the GIMP developer community at
    large. You simply need to write your plug-in, and submit it to the plug-in registry
    at http://registry.gimp.org/. The end user is your quality assurance-if your plug-in
    doesn''t live up to its expectations, it can be deleted without affecting the
    rest of the GIMP installation. If yours is good enough there is a chance that
    it will become a staple of any good GIMP distribution in the future.

    * If you want to dig a little deeper, you can download the latest developer''s
    core source tree and muck around in it for a while. The unstable releases are
    available from the GIMP CVS (Concurrent Version System), which is a method of
    version control for software products. Please read http: //www.gimp.org/devel_ver.html
    carefully for more details. You should also check out the GIMP developer FAQ at
    http://www.rru.com/-meo/gimp/faq-dev.html.'
  merge: -1
  pgno: 269
- img_proc: true
  md: '# About Plug-ins 255


    +   - Of course, if you start creating your own patches for the core GIMP development
    tree, you will want to start communicating with other GIMP developers and get
    your fantastic patches accepted into the official distribution. This is handled
    through the GIMP developer mailing list. You can subscribe and unsubscribe from
    the GIMP lists at http://www.gimp.org/mailing_list.html. The GIMP development
    community is composed of many people from all areas of life, each with their ideas
    about how things should work. The GIMP, inheriting the strength and most practical
    ideas from this pool of knowledge, grows and evolves like a true Darwinian organism—thrives
    on developer dissent and rivalry. It is really exciting, even if you only sit
    back and watch it all happen.


    This is somewhat different than the concept of plug-ins in Photoshop. In that
    application, plug-ins are mainly filters and similar apps that alter and create
    images. The GIMP, a plug-in is *anything* that can be added to the GIMP without
    affecting the core source tree. This makes the GIMP infinitely more scalable,
    but perhaps a bit more obfuscated at times.


    Yes, there are many things that are native to the GIMP itself that are not plugins.
    These include the color models, the basic tools, the GTK interface, the Plugin
    API, the Script-Fu interface, and the core functions such as layers, undos, masks,
    antialiasing, core dialog boxes, and so on. *Everything else* is handled by a
    plug-in of some sort. This includes all the filters, extraneous tools, file formats,
    interfacing applications (for scanners, printers, email, and so forth), and many
    other things.


    # How to Obtain and Install New Plug-ins


    In order to install a plug-in, you will need to find and compile its source. (No
    binary distributions here!) Note that few of the plug-ins are version-dependent
    and as they will only work in versions 1.0 or 1.1 of GIMP. This is because the
    plug-ins must communicate with the GIMP directly, and the internals can get drastically
    altered between releases. If you do encounter a plug-in, its documentation should
    tell you everything you will need to know. With smaller, less complex plug-ins,
    you can almost get away using it with any relatively recent version.


    # Why Compile?


    Again, *compiling* is the process by which source code is translated into an executable
    binary, and while it would in theory be simpler to distribute plug-ins as binaries,
    this would not quite be in the Open Source tradition. Source code does offer a
    few benefits: It allows for the easy installation on any number of operating systems
    and'
  merge: -1
  pgno: 270
- img_proc: true
  md: 'processors (not everyone runs Linux or uses an Intel processor), and it makes
    for easy patching and bug fixing in the public arena. Trust me, compiling is a
    good thing, and even the non-coding newbie can get the hang of it after a few
    tries.


    # Installing the Easy Way


    After you have the source downloaded, you can begin compiling. GIMP provides a
    remarkable tool for accomplishing called gimtool. You can use this tool to compile
    and install the plug-in only if the source has no .c file. This applies to most
    of the filters you will encounter. Of course, you should read the READMEs that
    with any source distribution, but the procedure is usually as:


    +   - tar -xvf foo.plugin.tar.gz (decompress)

    - cd foo (cd to directory)

    - gimtool —install-admin foo.c (compile and install)


    gimtool takes care of compiling, installing, and relocating the plug-in for you.
    The example illustrates the steps needed to install a plug-in system-wide, which
    should be done as root. Otherwise, if you want to install the plug-in locally
    in your .gimp/plug-ins directory (not system-wide) all you need to do is give
    gimtool — install argument. For any other functionality, the man gimtool page
    should give you the answers you need.


    Otherwise, if the plug-in is more complex, that is, has .c source files, makefiles,
    and so forth, you will need to take a more traditional installation route.


    # /configure && make && make install


    If you''re familiar with UNIX, the preceding headline phrase should be a mantra
    for you by now. One thing you should know is that your binary is compiled and
    recompiled, on the next step the GIMP registers the plug-in in your local pluginrc,
    which is the way the GIMP keeps track of which plug-ins are available and their
    preferences. It is located in your .gimp directory (.gimp/plugins). The system-wide
    one, of course, is installation-dependent, but is traditionally in /usr/share/gimp/.
    If you should ever find that one of your plug-ins is acting weird, sometimes deleting
    this file in your local directory will fix it (GIMP will automatically create
    a new one on startup). In any case, editing this file is probably not a good idea.


    When installing, involved plug-ins with more than one source file, there is really
    only one rule: Read the README or INSTALL documents, and follow the directions.
    Depending on the author, the documentation can range from informative to terse'
  merge: -1
  pgno: 271
- img_proc: true
  md: '# About Plug-ins


    nearly non-existent. Usually, a little perusal through the directory will turn
    up something, and after you''ve done a few, it seems that most them install pretty
    the same way. If you have problems, feel free to ask the world''s most responsive
    technical support team—a newsgroup, a mailing list, or 12-year-old Linux hacker
    down the street. You should be back in business in no time. Also, it might be
    good to hit the GIMP newsgroups and mailing lists; they tend to be very helpful.


    +   - Newsgroup—comp.graphics.apps.gimp

    - Mailing list—http://www.gimp.org/mailing_list_list.html


    # The DB Browser


    This plug-in keeps a searchable database of all the installed plug-ins, extensions,
    and internal functions in the GIMP. It can tell you the author, the version and
    date, and other such information. It can be very helpful when you''re trying to
    determine what your GIMP installation has, or at least it serves as to look now
    and just to get a slight glimpse into what makes GIMP tick (short of looking at
    source).


    You can find DB Browser under Xtns, DB Browser. It might take a moment to initialize,
    but once you have it, you out see that what is pictured here in Figure 19.1.


    # FIGURE 19.1


    The DB Browser gives you a searchable list of everything that is registered in
    the GIMP


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_272_0.png)


    You have two options: you can browse the database to find what you want, or you
    can use the Search by Name (refer to Figure 19.1) or Search by Blurb (see Figure
    19.2) functions to find what you''re looking for. Simply enter a search by plug-in
    name or function (for example, blur), and you should be able to find what you''re
    looking for—as long as you actually have the target plug-in installed and running.'
  merge: -1
