    ![](img/1e2e1cd1a8efa63a199c864a651e3086_232_0.png)


    # FIGURE 16.3


    Carefully select only the skull so that you will be able to move out of this dull
    background.


    ![](img/1e2e1cd1a8efa63a199c864a651e3086_232_1.png)


