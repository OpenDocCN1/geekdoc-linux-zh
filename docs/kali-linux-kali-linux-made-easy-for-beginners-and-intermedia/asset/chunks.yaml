    # Kali Linux 从入门到中级：手把手实战项目（包含 Kali Linux 黑客攻击与网络安全基础）

    作者：Craig Berg


    ## 简介

    Kali Linux 是一种基于 Debian 的 Linux 发行版，专为渗透测试和取证分析设计。Kali 是渗透测试的理想选择，因为它内置了许多让此类任务变得简单的工具和程序。它预装了超过
    600 个工具，每种工具都能协助渗透测试和取证任务。Kali Linux 最初于 2012 年推出，作为之前版本 Back Track Linux 的继任者，作为一个操作系统运行，你可以将其安装在硬盘上、在虚拟机中运行或通过
    Live 模式——本指南的第一部分将介绍 Kali Linux 的安装。[Offensive Security](https://www.offensive-security.com/about-us/)
    是一家，核心开发者为 Devon Kearns、Matt Aharoni 和 Raphael Hertzog，维护着 Kali Linux。


    **注意**：尽管 Kali Linux 拥有世界上最优秀的渗透测试工具和程序，但在本实战 Kali Linux 指南中，我们可能需要安装其他工具，以便更容易学习如何使用
    Kali Linux 进行渗透测试和网络安全取证。


    以下是 Kali Linux 的一些主要特性：

    - 它是一个基于 Debian 的 Linux 发行版。

    - 它预装了超过 600 多个工具和程序。

    - 它支持 ARM 架构。

    - 它具有用于数据注入的自定义内核。

    - 它是一个开源发行版。

    - 它符合文件系统层次结构标准（FHS）。

    - 它支持多种语言。

    - 它可以根据用户需求和内核重建进行完全自定义。

    - 默认带有 gnome 桌面环境。

    - 它具有对高级网卡的支持。


    在这本书中，我们将涵盖由 Kali Linux 提供的主要功能和工具。它们包括：

    - 信息搜集工具

    - 漏洞评估

    - 无线攻击

    - Web 应用攻击

    - 漏洞利用工具

    - 取证工具

    - 嗅探与欺骗

    - 密码破解

    - 维持访问

    - 社会工程工具

    - 反向工程工具

    - 硬件黑客工具

    - 报告工具

    - 拒绝服务攻击


    我们将逐一介绍这些每一个功能和工具，以便在读完本指南后，你将拥有使用 Kali Linux 的实战经验，并在完成本指南第 17 部分的 Kali Linux
    实战项目时运用你所学到的知识。


    **PS**：如果你喜欢这本书，别忘了在 Amazon 上给它留个评价！


    ## 目录

    - 简介


    在下载页面，你将发现根据架构和 Kali 镜像类型提供的各种下载选项。对于本教程，我们将从在硬盘上安装 Kali 开始；要执行此操作，请下载下方突出显示的的
    ISO 版本。


    你可以选择默认的 Kali ISO（如上标所示），它使用 gnome 桌面环境。但是，如果你想使用其他桌面环境，可以下载 KDE、XFCE、MATE 和 LXDE。


    **注意**：不要下载 Kali Linux 的轻量版，因为它不包含所有默认工具，要使用其中任何一个工具，你都必须逐个安装，这是一个繁琐的过程。


    一旦获取了 Kali Linux 磁盘镜像副本，你需要将下载的镜像的 `SHA1` 哈希值与下载页面提供的哈希值进行对比。这确保了你获取的镜像未被篡改且未损坏。如果你正在运行
    Windows，可以使用 `hashMyFile` 工具检查 `sha1` 哈希的有效性。你可以从下面的资源页面下载该工具：[`www.nirsoft.net/utils/hash_my_files.html`](https://www.nirsoft.net/utils/hash_my_files.html)


    ### 如何进行 Kali Linux 硬盘安装

    长期使用 Kali Linux 最方便的方法将其安装在硬盘。你可以与 Windows、MacOS 和其他 Linux 发行版一起安装 Kali Linux。要在硬盘上安装
    Kali Linux，我们需要几个工具。它们包括：

    - USB/DVD 可启动介质

    - Kali Linux 安装至少 20GB 的磁盘空间

    - Kali Linux ISO – 上述获取


    在物理机上安装 Kali Linux 需要一个干净、未分区的、没有任何数据的硬盘。在这里，我们将与操作系统一起安装 Kali。一旦获取了介质（如 USB 或
    DVD），就可以制作启动盘。如果你使用 USB 闪存，请下载并安装 `BalenaEtcher` 并按照指示刻录镜像。你可以从下面的资源页面下载该工具：[`www.balena.io/etcher/`](https://www.balena.io/etcher/)。如果你使用
    DVD，下载并安装 `Burnaware`：[`burnaware.com/`](http://burnaware.com/)。一旦创建了启动介质，就需要为
    Linux 创建分区。如果你使用 Windows，打开磁盘管理器，选择分区，设置分区大小——必须在 10GB 以上——并点击缩小。


    **注意**：不同的电脑型号有不同的启动。你可以在网上搜索启动选项。一旦系统启动，Kali Linux 将弹出菜单。选择安装方法。图形化安装程序对初学者更友好。选择并配置首选语言。下一步是地理位置。接下来是配置键盘设置。设置网络并连接到网络。之后为
    root 用户创建账户和密码。在下一个屏幕上，选择分区，选择之前创建的磁盘。分配磁盘空间，然后选择 `yes` 并继续。等待安装过程完成。下一步是软件包管理器。选择
    `yes` 并继续。如果选择 yes，请确保你的设备有活动连接。安装完成后，重启电脑并在 `GRUB` 菜单中选择 Kali Linux。


    ### 如何进行 Kali Linux 虚拟机安装

    不安装在物理机上而使用 Kali Linux 的另一种方法是作为虚拟机运行。使用虚拟化软件可以在当前操作系统上运行 Kali Linux。要执行此操作，第一步是下载并安装虚拟化软件，从下方的资源页面获取：[`www.virtualbox.org/wiki/Downloads`](https://www.virtualbox.org/wiki/Downloads)


    **注意**：你也可以使用 `VMware Workstation`，但本指南未涵盖 VMware 的配置。


    一旦下载并安装了 Virtual Box，去 Kali 下载页面下载镜像镜像。一旦有了镜像文件，将其提取并保存到文件夹中。提取的文件包含 `.ova` 文件。打开它并选择
    VirtualBox。下一个窗口允许你自定义位置、内存和其他系统配置。一旦设置完成，点击导入启动操作系统。一旦完成，点击启动启动新系统。默认用户名是 `root`，密码是
    `toor`。如果你使用的是 VMware 版本，步骤非常。


    ## 虚拟机配置

    在使用 VirtualBox 创建并启动 Kali Linux 后，我们需要设置一些重要的配置以完善渗透测试环境。以下是最重要的配置：


    #### 1：VirtualBox 增强功能

    一旦启动系统，VirtualBox 增强功能是“必须安装的”。它们提供了额外的系统功能，例如：

    - 使系统支持全屏模式

    - 允许主机和客机共享文件和文件夹

    - 允许主机和虚拟机之间进行复制粘贴

    - 修复主机和客机之间可能出现的鼠标错误


    要安装 VirtualBox 增强功能，前往 VirtualBox 菜单的“设备”选项卡并选择安装增强功能。如果收到警告消息，忽略它并点击继续。接下来，打开终端窗口并导航到增强功能
    CD 的挂载点。进入目录后，输入 `ls -l` 列出目录下所有文件。现在使用命令运行 `VBoxLinuxAdditions.run` 文件：


    ```

    ./VBoxLinuxAdditions.run

    ```

    等待所有模块成功构建并安装。接下来，返回根目录并卸载增强功能 CD。之后，在终端中输入 `reboot` 重启系统。一旦系统重启，你应该能够进入全屏模式。


    #### 2：VirtualBox 网络设置

    默认情况下，Kali Linux VirtualBox 镜像使用网络地址转换 (`NAT`) 连接。这种连接类型允许客机连接到网络，但网络上的其他设备无法连接
    Kali Kali。对于渗透测试，网络中的所有机器都应该相互通信。要更改系统的网络设置，请按照以下步骤操作。首先关闭客机。然后打开 VirtualBox 管理并选择
    Kali Linux 虚拟机。在右侧选择网络图标。在下拉框中，选择适配器 1 并从 `NAT` 更改为“桥接”(Bridged)。然后选择用于连接的网络接口。


    #### 3：激活无线

    作为虚拟机运行 Kali Linux 不允许你使用内置无线设备。但是，你可以使用外部网络设备。要在 Kali Linux 中使用外部网络适配器，插入你的适配器并导航到设备、USB
    设备，选择你的网络适配器名称。一旦适配器连接，你可以启动终端并输入 `ipconfig` 查看名称和适配器信息。


    ### 如何以 Live 模式运行 Kali Linux

    使用 Kali Linux 的另一种方法是直接运行。要 Live 运行 Kali Linux，将 Kali ISO 刻录到 DVD 或 USB 驱动器并从中启动。选择
    Live。以 Live 模式运行 Kali Linux 的优势之一是速度。Live 模式易于设置和使用。但是，如果你运行的是 Live 模式，重启后所有设置都会丢失。如果你只想尝试
    Kali Linux，这种方法非常有用。如果你打算深度使用 Kali Linux，建议将其安装在硬盘上。


    ### 安装虚拟机

    在这一部分，我们将为测试目的设置一个虚拟机。该服务器允许我们在后续章节中执行攻击。该虚拟机还给了我们完全的控制，我们可以根据类型增加或减少安全。我们将使用的服务器是
    Metasploitable。你可以从资源页面下载 Metasploitable：[`sourceforge.net/projects/metasitable/`](https://sourceforge.net/projects/metasitable/)。一旦下载了文件，提取它并使用
    VirtualBox 部分概述的步骤设置。一旦配置完成，使用用户名 `msfadmin` 登录，密码为 `msfadmin`。**注意**：还有其他虚拟机可以使用，如
    Metasploitable 3、Hera 以及其他。你可以在以下页面阅读关于 Metasploitable 2 的更多信息：[`rapid7.com/docs/metasploitable-2`](https://rapid7.com/docs/metasploitable-2)（注：此处链接根据原文保留并翻译）。


    ### 更新 Kali Linux

    Kali Linux 有许多频繁更新的工具和应用程序。你应该定期更新你的系统以获取最新功能。与其他基于 Debian 的发行版一样，Kali Linux 的软件包管理器是
    `dpkg`，因此使用 `apt` 命令。要更新 Kali Linux，打开终端并输入以下命令以确保仓库可用：`nano /etc/sources.list`。如果这些仓库没有包含，你可以手动添加它们，然后输入
    `apt-get update`。上述命令同步了软件包的索引。你可以使用以下命令更新 Kali Linux：

    - `apt-get upgrade`：我们使用此命令升级软件包。

    - `apt-get dist-upgrade`：我们使用此命令升级整个 Kali Linux 发行版到最新版本。


    一旦你选择了要执行的更新类型，Kali Linux 将自动执行升级。


    ## 操作步骤

    使用本章中学到的材料设置你的工作环境，为后续的实用 Kali Linux 课程做好准备。在指南的下一部分，我们将查看 Linux 内核系统的基础介绍，以便当你进入渗透测试、黑客攻击和网络安全需求，你对后续部分将处理的基本元素有一个明确的概念。


    ## 第 2 部分：网络基础介绍与 Linux 内核系统操作

    在这一部分，我们将涵盖上述设置的 Linux 内核系统的基础知识。这部分对于初学者来说很重要，因为 Kali 运行的基于 Debian 系统与常见的 Windows
    或 OS 界面不同。让我们从理解 Linux 文件系统及其组织结构开始。文件系统是操作系统组织文件和数据的方法或数据结构。所有基于 Linux 的发行版都有类似的结构，尽管某些可能有额外的文件和目录。在这一部分中，我们将使用
    Kali Linux 结构：

    - `/`：根目录。这是根或起点。Linux 文件系统的每个目录都从这个文件夹开始。在大多数 Linux 发行版中，只有 root 用户拥有该目录的权限。

    - `/bin`：二进制文件。包含基础程序的目录。

    - `/boot`：内核文件。这些是 Linux 内核和早期启动所需的文件。

    - `/dev`：设备文件。该目录包含设备文件。

    - `/etc`：配置文件。包含 Linux 配置文件的目录。

    - `/home`：用户目录。这是用户的目录；包含了用户的个人文件，如视频、文档等。

    - `/lib`：系统库，包含基础库。

    - `/media`：挂载点。这是移动设备（如 USB 驱动器、CD 等）的挂载点。

    - `/mnt`：临时挂载点。这是临时挂载点。主要在 Live 模式下可用。

    - `/opt`：第三方应用程序。包含由第三方提供的应用程序。

    - `/root`：管理员个人目录。包含管理员的个人文件，如媒体和文档。

    - `/run`：易性数据。包含重启后擦除的数据。

    - `/sbin`：系统二进制文件。包含系统程序。

    - `/srv`：服务。

    - `/tmp`：临时目录。

    - `/usr`：用户系统（可选资源）。

    - `/var`：变量数据。

    - `/proc`：进程文件系统。

    - `/sys`：内核参数。

