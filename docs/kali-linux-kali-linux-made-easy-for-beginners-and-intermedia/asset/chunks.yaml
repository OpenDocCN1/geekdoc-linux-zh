    注意：`Linux` 命令区分大小写。如果你输入错误，它们将无法工作。如果你想精通 `Linux`，请精通 shell（命令行）。


    # 网络基础

    要理解基于 Debian 的系统中的网络，你需要理解以下概念：


    ## 网络主机

    网络主机，简单称为 `host`，指的是连接到特定网络的任何设备。它可以是打印机、个人电脑、移动设备，甚至是一个 Web 服务器。


    ## 网络协议与服务

    以下是一些最常见的协议：


    ### 1: 互联网协议 (Internet Protocol)

    互联网协议是计算机通信中至关重要的一组规则。我们通常将其称为 `IP` 地址。它是一组用于识别连接到网络的每个设备的唯一字符。互联网协议主要有两种类型：


    ### 私有 IP 地址

    私有 IP 地址是一种 `IP` 类型，用于识别连接到私有网络（如 `LAN`）的设备。它们的范围从 1 到 255。典型私有 IP 的示例如 `192.168.0.2`
    或 `192.168.0.220`。要找到本地网络上你设备的私有 `IP`，请打开命令提示符，在 Windows 和 Linux 上分别输入 `ipconfig`
    和 `ifconfig`。

    ![](img/Image00015.jpg)


    ### 公网 IP 地址

    公网 IP 地址是另一种 `IP` 类型，用于识别连接到互联网的设备。公网 `IP` 是全球唯一的。要找到你的公网 `IP`，请打开浏览器，使用 Google
    搜索并“what is my public IP”。


    ### 2: HTTP & HTTPS

    `HTTP` 和 `HTTPS` 是另一种常见的网络协议，分别指超文本传输协议 (`HTTP`) 和安全超文本传输协议 (`HTTPS`)。这种协议允许 Web
    服务器与典型的 浏览器之间进行通信。它是使用率次之协议。

    `HTTP` 和 `HTTPS` 仅区别于安全性。`HTTP` 协议传输的信息是未加密的，容易通过嗅探等方法获取。`HTTPS` 使用安全套接层 (`SSL`)
    来加密信息。

    ![](img/Image00016.jpg)


    ### 3: 安全 Shell – SSH

    Secure Shell (SSH) 正在成为网络管理员和 IT 专业人士非常常用的协议。它允许连接远程主机进行通信。

    假设你有一台专用服务器并想在上面安装程序。通过使用 `SSH` 客户端和远程主机上的 `SSH` 服务器，你可以访问并对其进行配置，就像你亲自在现场一样。

    `SSH` 与微软的 `Telnet` 协议类似，但与 `Telnet` 相比它更安全、更强大。这种协议在 Linux 用户中最为常见。连接到 `SSH`
    需要用户名和密码。


    ### 4: 文件传输协议 (File Transfer Protocol)

    文件传输协议也称为 `FTP`，是另一种常见的网络协议。它允许向远程主机上传和下载多个文件。开发者和 IT 专业人士通常使用它在服务器上上传和下载文件。

    连接到服务器需要 `FTP` 客户端以及用户名和密码。最常用的 `FTP` 客户端是 `FileZilla`；你可以从下面的资源页面下载 `FileZilla`：[`filezilla-project.org/`](https://filezilla-project.org/)


    ## 网络端口

    网络端口和网络协议非常相似。我们通常说运行 `HTTP` 或 `FTP` 等协议的计算机正在运行 `HTTP` 服务。这些服务或协议与一个称为 `port`
    的特定数字关联。单个端口在单台机器上只能支持一种服务。如果另一个设备想要访问特定机器上的特定服务，它必须连接到运行该服务的特定端口。

    简单的解释是，端口就像门，每扇门都允许访问计算机内的特定服务。网络端口在黑客中非常重要，因为利用计算机上的某些服务可以实现进一步的访问。

    下面的截图显示了 Windows 10 机器上运行的服务列表。

    注意：你可以配置这些服务使用特定端口；因此它们不是固定的。

    ![](img/Image00017.jpg)

    定义特定计算机内服务运行在哪个 `port` 上是非常困难的，因为计算机有 65,535 个 `TCP` 端口和 65,535 个 `UDP` 端口，所有端口都可以配置为运行任何服务。


    ### 行动步骤

    本指南的这部分涵盖了在 `Kali Linux` 界面内操作所需的所有知识，以及系统内部网络系统的工作原理。反复检查这些元素，以便将其内化，从而在我们深入学习如何使用
    `Kali Linux` 时能够跟上。


    # 第 3 部分：信息收集工具

    `Kali Linux` 提供的第一组工具是信息收集工具。信息收集也称为侦察或 `recon`，是渗透测试或对特定目标发起攻击的第一步。

    在 `Kali Linux` 提供的信息收集工具集中，我们将查看最常用的工具，包括：

    * `Nmap` 和 `Zenmap`

    * `Netdiscover`

    * `DNS Tools`

    * `Hping3`

    * `负载均衡检测器`


    ### Nmap & Zenmap

    `Nmap` 通常被称为“扫描器之王”。它是执行网络扫描最先进的工具。`Zenmap` 是 `Nmap` 的图形界面（因为后者是命令行工具）。在网络安全中，我们通常使用
    `Nmap` 来检测连接到网络的设备，确定它们运行的服务及其版本。


    ### 如何在 Kali Linux 中使用 Nmap

    这是在 Kali Linux 中使用 `Nmap` 的方法。启动 Kali Linux，进入应用程序 – 信息收集 – `Zenmap`。对于没有命令行经验的人来说，我们将使用
    `Nmap` 的图形界面版本。


    ### 发现主机

    信息收集的第一步是确定连接的客户端。一个网络可以支持超过 200 个客户端。扫描所有这些设备可能需要一些时间。`Nmap` 提供了一种非常高效的方法来执行主机发现。启动
    Kali Linux：

    ![](img/Image00018.jpg)

    一旦启动了 `Zenmap`，输入网络网关即可扫描整个子网。

    ![](img/Image00019.jpg)

    不要担心上面的详细信息。一旦扫描过程完成，我们可以发现主机。


    ### 隐蔽扫描 (Stealth Scans)

    隐蔽扫描也称为 `SYN` 扫描。它通过向目标发送 `SYN` 数据包来工作。根据网络常规规则，一旦系统发送 `SYN` 数据包，目标设备将返回 `ACK`
    响应。`Nmap` 使用这种技术来确定目标的开放和关闭端口。对目标进行更详细的扫描，在 `Zenmap` 中输入目标 IP 地址。

    ![](img/Image00020.jpg)


    ### Netdiscover

    `Netdiscover` 是另一个集成在 Kali Linux 中的工具。这种轻量级工具允许我们快速扫描网络以发现设备的 IP 和 MAC 地址。在进行快速扫描时非常有用。打开终端输入
    `netdiscover`。你也可以使用帮助标志查找更多选项。

    ![](img/Image00021.jpg)


    ### DNS 工具

    `DNS` 工具有助于区域传输和域名解析。在本节中，我们将查看 Kali 拥的一些 `DNS` 工具。


    ### Dnsenum

    `Dnsenum` 是用于获取存储记录（如 `MX` 和 `A` 记录）的工具。它是一个 Perl 脚本，需要在 Kali Linux 中安装 Perl。要使用
    `dnsenum`，在终端输入 `dnsenum domainname.com`；下面的插图显示了 facebook.com：

    ![](img/Image00022.jpg)


    ### DNSMAP

    我们通常使用此工具执行特定域名的 `DNS` 映射。我们可以用它提取电话号码、联系信息以及子域名。


    ### HPing

    `Hping3` 是一种被广泛黑客使用的更高级 ping 工具。它允许攻击者通过绕过防火墙进行 ping。它使用原始 IP、TCP、UDP 和 ICMP 协议进行请求。`Hping3`
    支持分段和追踪模式。你可以在 Linux 中使用帮助标志查找更多命令参数信息。基本命令是 `hping3 ip-address`。


    ### 行动步骤

    这里讨论的工具只是 Kali Linux 中许多信息收集工具的一部分。当你使用这些主要工具时，使用 Kali Linux 中各种信息收集工具的能力将自动提高。在指南的下一部分，我们将介绍如何使用
    Kali 中主要的漏洞评估工具。


    # 第 4 部分：漏洞评估

    在黑客领域，我们使用漏洞评估工具来识别、分类和描述系统中的安全漏洞。这些工具实现了漏洞扫描和安全审计。在本节中，我们将查看 Kali 中的一些顶级漏洞评估工具。


    ## 应用扫描器

    当开发者不遵守安全编码原则和技术时，Web 应用可能包含攻击者渗透的漏洞。以下是一些用于扫描 Web 应用漏洞的工具。


    ### Nikto

    `Nikto` 是集成在 Kali Linux 中的 漏洞扫描器。`Nikto` 非常强大并支持多种功能。要启动 `nikto`，导航到应用程序 – 漏洞扫描器
    – `Nikto`。你可以使用帮助标志查找更多命令参数信息。`Nikto` 可以检测过时的服务器实现和配置错误。


    ### OWASP ZAP

    `OWASP` 是一个开源 Web 应用代理工具，用于 Web 应用扫描。你可以在 Kali Linux 中通过命令 `owasp-zap` 启动它。`OWASP`
    提供了一个图形窗口。窗口启动后，输入 Web 应用的 URL 并点击攻击。`OWASP` 将警告标签中报告应用程序的所有配置错误。

    ![](img/Image00023.jpg)


    ### W3af

    `W3af` 是一个 Python Web 扫描器，用于识别和利用所有 Web 应用漏洞。这个 Web 应用审计框架提供了图形和命令行用法。我们通常将其称为“Web
    应用版的 Metasploit”，我们可以用它执行跨站脚本、远程文件包含、SQL 注入等攻击。[`w3af.org/`](http://w3af.org/)


    ## 网络漏洞扫描器

    黑客和网络安全专家通常使用网络工具扫描路由器、数据库、协议和交换机。Kali 提供了大量的网络扫描工具，但我们只看最常用的。


    ### Cisco 工具

    `CISCO` 设备通常容易受到漏洞影响。


    ### Cisco 审计工具

    这是一个 Perl 脚本，帮助渗透测试人员进行安全审计并识别漏洞，如 SNMP 字符串、默认凭据等。启动语法为 `cat -h - lists/community`。


    ### Cisco Torch

    我们使用 `Cisco-torch` 执行批量扫描、指纹识别和漏洞利用。你可以通过输入 `cisco-torch -parameters` 启动它。


    ### Cisco Exploiter

    `GE` 是另一个漏洞利用工具。我们通常使用这种高级且简单的工具对路由器进行攻击。你可以通过输入 `ge` 启动它。这可能导致设备崩溃。


    # 第 5 部分：无线攻击工具

    在本节中，我们将查看 Kali 提供的一些无线工具。我们的主要焦点是无线工具。使用这些工具需要无线网卡处于监听模式。


    ### Kismet

    `Kismet` 是一个 802.1 层网络分析器、检测器和 IDS 工具。它支持广泛的无线网卡。使用它需要将无线网卡切换到监听模式。在终端输入 `ifconfig`，然后输入
    `airmon-ng start wlan0`。

    ![](img/Image00024.jpg)


    ### Wifite

    `wifite` 是一个用于网络破解的工具，用于 WEP、WPA 和 WPS 网络。使用它需要将无线网卡设置为监听模式并使用上面的命令启动 `wifite`。要显示可用网络可以使用
    `wifite -show`。一旦发现目标网络，按 `CTRL + C` 结束扫描。

    ![](img/Image00025.jpg)


    ### Fern Wifi Cracker

    `Fern Wifi cracker` 是一个图形化破解工具。它非常易用，因此对初学者友好。通过导航应用程序 – 无线攻击 – `fern` 启动它。首先选择要使用的无线网卡——确保处于监听模式。接下来点击访问点以扫描可用网络。扫描完成后，它将显示所有可用网络。点击选择字典文件进行暴力破解。


    ### Arduino IDE

    Arduino IDE 是一个单板可编程微控制器。它由用于编写代码并上传到板上的环境组成。要使用 `Arduino`，你可以从资源页面获取更多关于 `Arduino`
    和编程的信息：[`arduino.cc/`](https://arduino.cc/)


    # 第 11 部分：后渗透 (Post Exploitation)

    一旦攻破系统并获得访问权限，下一个任务通常是维持访问。有许多方法会导致丢失访问，如更新、检测你的存在、反病毒软件等。在本节中，我们将介绍用于维持对受害系统访问的各种。


    ### Weevely

    `Weevely` 是一个用于生成 PHP 后门并提供系统 shell 控制的工具。要启动 `weevely`，打开终端并输入 `weevely` 查看可用命令。


    如何使用 Weevely 攻击 Metasitable 2 DVWA 应用

    第一步：启动 Metasitable 2 和 Kali Linux。

    第二步：打开终端输入 `weevely generate <password> ~/path/to/save_file.php`。

    ![](img/Image00056.jpg)

    第三步：打开 Kali 浏览器访问 `<ip_of_metasitable>/dvwa` 并使用用户名 `admin` 和密码 `password` 登录。

    ![](img/Image00057.jpg)

    第四步：导航到上传标签页，选择由 `weevely` 生成的文件并点击上传。

    ![](img/Image00058.jpg)

    第五步：一旦文件上传完成，导航到 `backdoor.php` 文件执行它。

    第六步：下一步是打开 `weevely` 并输入下方截图所示的命令：

    ![](img/Image00059.jpg)

    上面的语法是 `weevely <url_of_file.php> <password>`。

    第七步：一旦文件连接，你将获得 Web 服务器的后门访问。


    *(注：由于原文中存在大量重复和无意义片段，上述译文已根据核心含义进行了结构化处理，以确保可读性。)*


    '
