    \ `Arduino` and programming from the following resource page:[https://arduino.cc/](https://arduino.cc/)\n\
    \n# Part 15 : Reporting Tools\nReporting is the last step after a successful penetration\
    \ testing. It provides detailed information about the entire testing process.\
    \ A penetration test report contains information such as methodologies used, results,\
    \ and recommended security measures. Many testers do not spend a lot of time on\
    \ it because it is non-technical and involves a lot of writing. In this section,\
    \ we are going to look at some the tools available in Kali Linux for reporting\
    \ tasks.\n\n### Dradis\n`Dradis` or `Dradis` framework is a penetration-testing\
    \ tool written in Ruby to help cybersecurity professionals handle pen-testing\
    \ reports easily. It helps organize all the penetration testing process, methodologies,\
    \ and discoveries in one place. It also allows exports of saved information from\
    \ other tools such as `Nmap`, `Nessus`, `Burp Suite`, etc.\nHow to work with Dradis\n\
    Step 1: Open the terminal and enter `dradis` command. Wait until it activates:\n\
    ![](Image0062.jpg)\nStep 2: Wait until it opens in browser. In case it does not,\
    \ open the browser and go to [http://localhost:3000](http://localhost:3000)\n\
    Step 3: Next, set the Dradis server password to use the app.\nStep 4: Login with\
    \ the credentials set above.\nStep 5: On the left sidebar, you will notice a list\
    \ of operations that will help in penetration.\nStep 6 On the All issues tab,\
    \ contains ways to add results in the library.\nStep 7: On the Methodologies tab,\
    \ it allows you to add the penetration-testing methodologies used. They include\
    \ National Institute of Standards and Technology, Penetration Testing Execution\
    \ Standards, Open Source Testing Methodology Manual, and Information Systems Assessment\
    \ Framework.\nStep 8: Next, continue by adding nodes and adding sub-nodes. Adding\
    \ notes on each node and corresponding sub nodes. After successful report collection\
    \ and notes and screenshots addition, you can export the report into html formats.\
    \ Exportation of reports in pdf or word (doc, docx) version is not available in\
    \ the community version of Dradis. You can learn more about Dradis from the following\
    \ resource[https://dradisframework.com/](https://dradisframework.com/)\n\n###\
    \ Magic Tree\n`Magic tree` is a reporting and data management tool for penetration\
    \ testers. It provides an easy and straightforward interface for data consolidation,\
    \ querying, and report generation. It also uses a tree-like project directory\
    \ structure to organize files. It comes bundled in Kali Linux and is located under\
    \ Reporting tools in the applications menu. Once you launch it, you can start\
    \ by upload scan result from `Nmap`. You can learn more about Magic tree from\
    \ the Official web:[https://www.gremwell.com/](https://www.gremwell.com/)\nThe\
    \ next part of the guide covers Denial of Service Attacks:\n\n# Part 16 : Denial\
    \ of Service Attacks\nDenial of service or `DOS` is a type of attack used by hackers\
    \ and penetration testers to disable access or usage to an important service or\
    \ resource causing inconvenience to the users. `DOS` attacks do not collect any\
    \ critical information. However, they combine well with other type of attacks\
    \ making them deadlier. For example, a `DOS` attack on a server can cause the\
    \ administrators to perform maintenance measures leading to a disabling of all\
    \ security measures. This gives an attacker a chance to compromise the system\
    \ and perform other operations such as uploading a rootkit or other malwares.\
    \ Understanding DOS\nDenial of Service are unpredictable and do not have fast\
    \ and hard solutions to prevent them. However, you can be able to detect them\
    \ and perform necessary measures to disable them. Denial of service attacks are\
    \ mainly of three types:\n* Volume based attacks: These are the simplest type\
    \ of DOS attacks. They occur when an attacker sends large volumes of packets to\
    \ the target system using all the bandwidth, which may result in system failure.\
    \ The most common are `UDP` and `ICMP` floods.\n* Protocol Based: These are the\
    \ second type of dos attacks that work by using all the target resources apart\
    \ from the bandwidth. These types of attacks mainly focus on resources such as\
    \ firewall, intrusion systems, and network switches. They include attacks such\
    \ as `Smurf` attacks, `Fraggle` attacks, `SYN` floods, and many others.\n* Application\
    \ layer attacks: Application attacks are deadlier as they attack the application\
    \ layer itself. They mainly focus on specific vulnerabilities and comprise of\
    \ fake application layer. They involve sending application requests with the intent\
    \ of crashing it. Their main targets are usually Apache servers and Microsoft\
    \ IIS.\n\nTools used in Denial of Service\nWe have more than a thousand tools\
    \ that you can use to performing denial service attacks. In Kali Linux, we are\
    \ going to use Metasploit auxiliaries. Start by opening the terminal and then\
    \ navigate to following directory `/usr/share/metasploit-framework/modules/auxiliary/dos`\
    \ lists all the type of dos auxiliaries as shown below:\n![](Image0063.jpg)\n\
    Xxes\nXxes is very powerful denial service and stress-testing tool. It has the\
    \ following features that allow it to work efficiently for denial service:\n*\
    \ Multiple Attack Vector\n* `TLS` support\n* `HTTP` header randomization\n* Multiprocessing\n\
    * User agent\nTo use it in Kali, open the terminal and clone the following repository:[https://github.com/sepehrdaddev/Xxes.git](https://github.com/sepehrdaddev/Xxes.git)\n\
    Navigate to the cloned directory and execute it by typing `./Xxes -h` to show\
    \ list of commands required.\nAction stepHaving covered all the major features\
    \ and tools provided by Kali Linux you now have a fairer idea of how to use the\
    \ Debian-based distribution to perform penetration testing and forensics. As mentioned\
    \ severally, the best way to get better at using primary tools is to practice\
    \ them often as possible until you truly master Kali Linux.\n\nPart 17 : Hands-on\
    \ Kali Projects: Exploiting Metasitable 2\nIn this section, we are going to perform\
    \ a comprehensive attack against Metasitable 2 using the techniques learned throughout\
    \ this guide. We will start with network scanning and then move on exploiting\
    \ any vulnerabilities found. Here are the services we are going to exploit in\
    \ the Metasitable machine:\n* Scanning using `Nmap`\n* Exploiting `FTP`\n* Exploiting\
    \ `SSH`\n* `SSH RSA` exploit\n* `Telnet` exploit – brute-force and credential\
    \ capture\n* `Java` Exploit\n* `VNC` exploit\n* `PHP CGI` (port 80)\n\nRequirements\n\
    In this section, we are going to require the following utilities and tools:\n\
    * `Kali Linux` – attacker\n* `Metasitable 2` – Target system\n\nNetwork Scanning\
    \ – Nmap\nThe first step we are going to perform is to scan the target machine\
    \ for running services. We are going to achieve this using `Nmap` (terminal version)\
    \ Open the terminal and enter `nmap -sV -p- <ip address>` This will scan the Metasitable\
    \ machine for all running services and their versions.\n![](Image0064.jpg)\nFrom\
    \ the above scan, we can see some services that run of the Metasitable machine\
    \ such as `VSFTPD` version 2.3.4, `OpenSSH`, `VNC` and more. `Nmap` gives detailed\
    \ information about specific services. Once you have the information, you can\
    \ use it to find its vulnerabilities either using `searchsploit` or `exploitdb`\
    \ website.\n\nExploiting FTP\nLet us try to crack the `FTP` password using `Hydra`.\
    \ The first set is to create a `username.txt` file and save it on the desktop,\
    \ in the file include the following usernames:\n![](Image00065.jpg)\nNext, create\
    \ a `password.txt` file, save it on the desktop, and include the following passwords:\n\
    ![](Image00066.jpg)\nOpen the terminal and enter the command `hydra -L ~/Desktop/usernames.txt\
    \ -P ~/Desktop/passwords.txt <ip_of_Metasitable> ftp`\n![](Image00067.jpg)\n`Hydra`\
    \ will start the cracking process using the list of usernames and passwords contained\
    \ in the wordlist. From the above screenshot, we can see that the tool found 17\
    \ passwords. In Metasitable 2, it is acceptable to use `ftp` (lowercase or uppercase)\
    \ as username and any other password. To test whether the credentials are correct,\
    \ let us try to connect to the `FTP` of the Metasitable 2 machine.\nStep 1: Open\
