    install Kali Linux on the hard drive, we are going to require several tools.They
    include:❖         USB/DVD bootable media❖         A minimum 20GB disk space for
    Kali Linux installation❖         Kali Linux ISO – obtained aboveInstallation of
    Kali Linux on a physical machine requires a clean, non-partitioned hard drive
    without any data in it. Here, we are installing Kali alongside another operating
    system.Once you have obtained a media device such as USB or DVD, it is time to
    create a bootable disk. If you are using a USB flash drive, download and install
    BalenaEtcher tool and follow instructions to burn the image. You can download
    the tool from the resource page below:[https://www.balena.io/etcher/](https://www.balena.io/etcher/)If
    you are going to use a DVD, download and install Burnaware:[http://www.burnaware.com/](http://www.burnaware.com/)Once
    you have created your bootable media, you need to create a partition for Linux
    partition. If you are using windows, open disk manager, select the disk to partition,
    and click shrink volume. Set the size of the partition—it must be 10 GB and above—and
    click shrink.![](Image00003.jpg)Once you have allocated your partition size, boot
    your device using the created bootable media above. NOTE: Different computer models
    have different boot configuration. You can search the internet for your device
    boot options.Once your system boots, Kali Linux will prompt you with the following
    boot menu window.![](Image00004.jpg)Choose the method of installation. The graphical
    installer is the friendlier to beginners. Select and configure your preferred
    language of installation. Next, select your geographical location. The next step
    is to configure your keyboard settings. Follow this with setting up your network
    settings and connect to a network. After that, create a password for the root
    user, which is a MUST-do. Continue to setup user account and password.On the next
    screen, which is the partition part, select ‘use the largest continuous disk space’
    and select the partition you created earlier. Confirm and allocate the disk space,
    and then select ‘write changes to disk.’ Select ‘yes’ and click continue. Wait
    until the installation process completes.The next step is the package manager.
    Select ‘yes’ and click continue. If you select yes, make sure your device has
    an active network connection. If not, select no.Next, install the GRUB bootloader
    on to the disk. Once the installation has completed, reboot the computer and select
    Kali Linux in the GRUB menu.How to Do a Kali Linux Virtual Machine InstallationThe
    other way to use Kali Linux without installing it on the physical machine is running
    it as a virtual machine. Using virtualization software, you can run Kali Linux
    on your current operating system.To do this:The first step is to download a virtualization
    software and install it on your computer. In this guidebook, we are going to use
    VirtualBox from Oracle available from the resource page below:[https://www.virtualbox.org/wiki/Downloads](https://www.virtualbox.org/wiki/Downloads)NOTE:
    You can also use VMware Workstation but this guide does not cover the VMware configuration
    process.Once you downloaded and install Virtual Box, go to Kali download page
    and download the Kali Linux VirtualBox image. Once you have the image file, extract
    the file and save it in a folder. The extracted file contains a .ova file. Open
    it and select VirtualBox.The next window allows you to customize the location,
    memory and other configuration of the system. Once you are all set, click import
    to start the process that imports the operating system. Once you complete that,
    click on start to boot the new system. The default username is root and password:
    toor.The steps are very similar if you are using VMware version.Virtual Machine
    ConfigurationsAfter creating and launching Kali Linux using VirtualBox, we need
    to set some important configuration so that we can completely setup a penetration-testing
    environment.Here are the most important configurations:1: VirtualBox Guest AdditionsVirtualBox
    guest additions are ‘required-installation’ once you have launched the system.They
    provide extra system features such as:❖         It enables the system to support
    full screen mode.❖         It enables host and guest systems to share files and
    folders❖         It allows copy and paste between host and guest machines❖       
    It Fixes errors that may occur with the mouse between host and guest systemsTo
    install VirtualBox guest additions, go to Devices tab on VirtualBox menu and select
    install Guest additions. If you receive a warning message, ignore it and click
    cancel to continue. Next, open a terminal window and navigate to guest additions
    CDROM mount point as follows.Once in the directory, enter ls -l to list all the
    files in that directory. Now run the VBoxLinuxAdditions.run file using the command:./VBoxLinuxAdditions.runWait
    until all the modules successfully build and install.![](Image00005.jpg)Next,
    change back to the root directory and unmount the guest additions cdrom. After
    that, reboot the system by entering reboot in the terminal. Once the system has
    rebooted, you should be able to enter full screen mode.2: VirtualBox Network Settings.By
    default, the Kali Linux VirtualBox image uses the Network Translation Address
    (NAT) connection type. This connection type allows the guest system to connect
    to the network using the host system. However, the other devices on the network
    including the host system will not connect to the Kali Machine. For penetration
    testing, all machines in a network should be able to communicate with each other.To
    change the system’s network settings, follow the steps below.Start by turning
    off the guest system. Then Open the VirtualBox Manager and select the Kali Linux
    virtual machine. On the right hand, select the network icon. On the dropdown box,
    select adapter 1 and change the Attached from NAT to Bridged Adapter. Then select
    the network interface to use for connections.![](Image00006.jpg)3: Activating
    Wireless NetworkRunning Kali Linux as a virtual machine does not allow you to
    use the embedded wireless device. However, you can use an external wireless network
    device.To use the external network adapter in Kali Linux, insert your network
    adapter and navigate to Devices, USB Devices, and select the name of your network
    adapter. Once the network adapter connects, you can launch the terminal and type
    ipconfig to see the name and adapter information as shown below.![](Image00007.jpg)How
    to Run Kali Linux in Live ModeThe other method of using Kali Linux is by running
    it live. To run Kali Linux live mode, burn the Kali ISO into a DVD or USB drive
    and boot with it. Select run Live.One of the advantages of running Kali Linux
    in live mode is speed. Live mode is easy to setup and use. However, if you are
    running live mode, all the files and configurations settings made will be lost
    once you reboot your device. This method is very useful if you want to try out
    Kali Linux or perform a quick task. If you are going to use Kali Linux extensively,
    we recommend installing it on the hard disk.Installing Vulnerable MachineIn this
    section, we are going to setup a virtual vulnerable server for testing purposes.
    This server will allow us to perform attacks discussed in later sections of the
    book.A virtual vulnerable server is a great way to perform attacks on unauthorized
    servers on the internet. This virtual machine also gives us full control as we
    can increase and decrease its security according to the type of tests we want
    to perform. It also allows room for errors as we can just re-install the system
    in case of errors.The vulnerable server we are going to use is Metasploitable
    2\. You can download Metasploitable file from the resource page below:[https://sourceforge.net/projects/metasploitable/](https://sourceforge.net/projects/metasploitable/)Once
    you download the file, extract it, and set it up using the steps outlined in the
    Kali Linux VirtualBox section.![](Image00008.jpg)Once configured, launch it and
    log in using username msfadmin and password msfadmin .![](Image00009.jpg)NOTE:
    There are other vulnerable servers available you can use such as Metasploitable
    3, Hera Lab, Pwn OS, Vuln Hub and others.We are using Metasploitable 2 because
    it has an active development team Rapid 7 and tons of vulnerabilities in the application,
    network, and web and operating system layers. You can read more about Metasploitable
    2 on the Rapid 7 page available from the resource below:[https://metasploit.help.rapid7.com/docs/metasploitable-2](https://metasploit.help.rapid7.com/docs/metasploitable-2)Updating
    Kali LinuxKali Linux has tons and tons of tools and applications that receive
    frequent updates. You should regularly update your system so that you get the
    latest features. Just like other Debian-based distributions, the package manager
    for Kali Linux is dpkg and therefore uses apt update command.To update Kali Linux,
    open the terminal and enter apt-get update . This command refers to the sources.list
    file to get the repositories available. To ensure the correct repositories are
    available in this file, type the following command in the terminal, nano /etc/apt/sources.list.The
    following repositories should be available:![](Image00010.jpg)If these repositories
    are not included on your sources.list, you can manually add them and then type
    apt-get update .The above command synchronizes the package’s index files from
    the repositories included in the sources.list file. Make sure to synchronize all
    the repositories before installing or updating a software.Once the packages have
    been synched, the next step is to update all the software and packages included
    in the system. You can use the following commands to update packages in Kali Linux❖
           apt-get upgrade – We use this command to upgrade only the packages included
    in version of Kali Linux we are using.❖        apt-get dist-upgrade – We use this
    command to upgrade the entire Kali Linux distribution to the latest version.Once
    you select the type of update you want to conduct, Kali Linux will perform upgrades
    automatically. The system may prompt for some input depending on the type of operation
    in performance.NOTE: These types of upgrades may take a while depending on your
    machine’s capabilities and your internet speed.The following illustration shows
    an upgrade in progress.![](Image00011.jpg)Action StepUse the materail you have
    learned in this chapter to setup your working environment in readiness for the
    practical Kali Linux lessons in later parts of this ultimate Kali Linux tutorial.In
    the next part of the guide, we shall look at a basic introduction to working within
    the Linix kernel system, of which Kali Linux is, and its network interface so
    that as you move forth into using Kali Linux for pen-testing, hacking, and for
    your cyber security needs, you have a firm idea of the basic elements we shall
    be dealing with in later parts of this Kali Linux tutorial:Part 2: A Basic Introduction
    to Networking and Working with the Linux Kernel SystemIn this section, we are
    going to cover the basics of working with the Linux kernel system and the working
    environment you set up above. This section is important for beginners because
    the Debian-based system upon which Kali works on is different from the common
    Windows or OSx interface.Let us start by understanding the Linux filesystem and
    its organizational structure. A filesystem is the methods or data structure that
    an operating system uses to organize files and data to control how it is retrieved
    or stored.Linux Directory StructureAll Linux based distro have similar structure
    even though some may have additional files and directories. In this section, we
    are going to use the Kali Linux directory structure.![](Image00012.jpg)/- Root
    DirectoryThis is root or the starting point. Every directory in the Linux FS starts
    from this folder. In most Linux distributions, only the root user has access to
    this directory./bin/ - Binary FilesThis is the directory containing basic programs/boot/
    - Kernel Boot FilesThese are the Linux kernel and files required for the early
    boot process./dev/ - Device FilesThis directory contains device files./etc/ -
    Configuration FilesThis is the directory containing Linux configuration files./home/
    - User DirectoryThis is the user’s directory; it contains users’ personal files
    such as videos, images, documents etc./lib/ - System LibrariesDirectory containing
    basic libraries files./media/* - Mount PointThis is the mount point for removable
    devices such as USB drives, CD and DVD drives etc./mnt/ - Temporary Mount PointThis
    is the temporary mount point. It is available mostly in live Linux live mode./opt/
    - Third Party ApplicationsContains applications provided by third parties./root/
    - Admin personal directoryThis contains administrator’s personal files such as
    media and documents./run – Volatile DataContains volatile runtime erased upon
    reboot./sbin/ - System BinariesContains system programs/srv/ - Server FilesContains
    data used by servers hosted on the system/tmp/ - Temporary dataContains temporary
    data erased at boot./usr/ - ApplicationsThis is the directory containing application
    files. It has various other sub-directories./var/ - Variable dataContains variable
    data required by daemons. These files include; log files, spools, queues, and
    caches./proc/This is a special directory containing runtime system information
    e.g. system memory, devices mounted, hardware config etc. We can refer to it as
    a control center for the kernel during runtime./sysSys filesystem is a pseudo
    file system that exports device information and drivers through virtual files.The
    Linux Command-LineThe power of the Linux operating system lies within an application
    called a terminal. It may have many names like terminator, terminal, iterm, xterm,
    and more but it is still a terminal.Let us see what makes this tool such an important
    tool in the Linux/Debian-based operating system.The TerminalIn Linux, the term
    terminal refers to an interactive, text-based interface. It allows the user to
    enter, execute, and view the results of the commands. In desktop-oriented distros,
    we can launch the terminal from a graphical desktop session while in server-oriented
    distros, it is the only thing you see when the computer boots up; server-oriented
    distros such as the Fedora server do not provide a graphical session.Launching
    TerminalBy default, Kali Linux provides the gnome graphical desktop environment.
    If you downloaded the right Kali Linux and if your system is working properly,
    you should have a graphical desktop environment.On the left hand of your desktop
    screen, you will notice a dock that contains a list of your favorite application.
    Select the black icon with a text inside; it’s usually the second from top. You
    can also move your mouse pointer to your top left of the screen to activate the
    activity page.Type terminal to launch it:![](Image00013.jpg)Command line Basics
    – Managing FilesAs a Linux user, managing files via the terminal is very essential.Rarely
    will you encounter cases where you switch from terminal to GUI control. In this
    section, we are going to see how to manage files from the terminal similar to
    how you would use a GUI (graphical user interface) file manager.Launch the terminal
    and let us get started.❖        pwd. This command stands for print working directory;
    it shows your current working directory in the file system.❖        cd – We use
    this command to navigate to the targeted directory. The complete syntax is cd
    <name of target directory>. If the directory is outside the current working directory,
    the path is required. If you do not specify the target directory, it takes you
    to your home directory. To go back to the previous directory since your last cd
    call, type cd .. or cd ­–❖        ls – We use the command ls to list all the files
    and directories within the current working directory. The syntax for ls command
    is ls <option> [file|dir] . The table below shows some of the options for ls command.![](Image00014.jpg)❖
           mkdir – We use this command to create new directories. To create a new
    directory in your current workspace, type mkdir <dir name> For example, mkdir
    newFolder. For cases where you want to create a directory outside your current
    directory, you must specify a path. For example, mkdir /user1/Desktop/Report/lastWeek
    where in this case, lastWeek is the name of the directory you want created.❖       
    rmdir – We use the rmdir command to remove directories. Similar to the mkdir command,
    this command takes options that determine how the system deletes files.❖       
    mv and cp – We use the mv command to move and rename directories and files. We
    use the cp command to copy files. The syntax for copying files is cp <source file>
    <target-file> . Here is an example, mv helloDir > /usr/share/.Other Useful CommandsApart
    from the file management commands we have discussed above, Linux supports a wide
    array of commands.In this section, we are going to look at some of the must know.'
