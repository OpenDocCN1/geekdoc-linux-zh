- fmt: ' own# Kali Linux Made Easy For Beginners And Intermediates Step By Step With
    Hands On Projects (Including Hacking and Cybersecurity Basics with Kali Linux)

    By Craig Berg


    ## Introduction

    Kali Linux is a Debian-based Linux distribution designed for penetration testing
    and forensics. Kali is ideal for penetration testing because it has in-built tools
    and utilities that make this task easier. It has over 600 pre-installed tools
    each of which aids the tasks of penetration testing and forensics. First introduced
    in 2012 as a successor to its previous version Back Track Linux, Kali Linux runs
    as an operating system that you can install on a hard disk, run virtually, or
    live—the first part of this guide covers Kali Linux installation. [Offensive Security](https://www.offensive-security.com/about-us/),
    a firm whose core developers are Devon Kearns, Matt Aharoni, and Raphael Hertzog,
    maintains Kali Linux.


    **NOTE**: Although Kali Linux has some of the best tools and utilities for penetration
    testing in the world, for this hands-on, Kali Linux guide, we may have to install
    some other tools needed to make it easier to learn how to use Kali Linux for penetration
    testing and cyber security forensics.


    The following are some of the major features of Kali Linux:

    - It is a Debian-based Linux distro.

    - It comes prepackaged with over 600 tools and utilities.

    - It supports ARM architectures.

    - It has custom kernel for packet injection.

    - It is an open source distribution.

    - It is Filesystem Hierarchy Standard Complaint.

    - It has Multiple Language Support.

    - It is fully customizable per user needs and kernel rebuild

    - Defaulted with gnome desktop environment

    - It has advanced wireless card support.


    In this book, we are going to cover the major features & tools provided by Kali
    Linux. They include:

    - Information Gathering Tools

    - Vulnerability Assessment

    - Wireless Attacks

    - Web Application attacks

    - Exploitation Tools

    - Forensics tools

    - Sniffing and spoofing

    - Password cracking

    - Maintaining Access

    - Social Engineering tools

    - Reverse Engineering tools

    - Hardware Hacking tools

    - Reporting tools

    - Denial of Service Attacks


    We shall cover each of these features & tools individually so that after reading
    this guide, you have hands-on experience with using Kali Linux and can use what
    you learn when completing the hands-on Kali Linux practice project found in the
    part 17 of this guide.


    **PS**: Don’t forget to leave a review of this book on Amazon if you like it!


    ## Table of Content

    - [Introduction](#

    - [Part 1]: Installation and Configuration

    - [Part 2]: A Basic Introduction to Networking and Working with the Linux Kernel
    System

    - [Part 3]: Information Gathering Tools

    - [Part 4]: Vulnerability Assessment

    - [Part 5]: Wireless Attacking Tools

    - [Part 6]: Web Application Attacks

    - [Part 7]: Exploitation Tools

    - [Part 8]: Forensics Tools

    - [Part 9]: Sniffing and Spoofing Tools

    - [Part 10]: Password Cracking

    - [Part 11]: Post Exploitation

    - [Part 12]: Social Engineering

    - [Part 13]: Reverse Engineering Tools

    - [Part 14]: Hardware Hacking

    - [Part 15]: Reporting Tools

    - [Part 16]: Denial of Service Attacks

    - [Part 17]: Hand-on Kali Linux Projects: Exploiting Metasploitable 2

    - [Conclusion](#


    ## Part 1: Installation and Configuration

    In this section of the guide, we are going to look at how to install and configure
    Kali Linux. We will cover both hard disk installation (dual boot) and virtual
    machine installation.


    Before we can install Kali Linux, the first thing we need to do is download the
    ISO. To do so, go to the following web page: [https://www.kali.org/downloads/](https://www.kali.org/downloads/)


    On the download page, you will find various download options based on architecture
    and Kali image type. For this tutorial, we are going to start by installing Kali
    on the hard drive; to do this, download the ISO version as highlighted below.


    You can select the default Kali ISO (marked above) that uses the gnome desktop
    environment. However, if you want to use other desktop environments, you can download
    the KDE, XFCE, MATE, and LXDE.


    **NOTE**: Do not download the light version of Kali Linux because it does not
    have all the defaulted tools and to use any of them, you will have to install
    each tool individually, a tedious process.


    Once you have obtained a copy of the Kali Linux disk image, you need to compare
    the `SHA1` hash of the image you just downloaded with the one provided on the
    download page. This ensures the image you have acquired is untampered and incorrupt.
    If you are running Windows, you can use the `hashMyFile` tool to check for the
    `sha1` hash validity. You can download the tool from the resource page below:
    [https://www.nirsoft.net/utils/hash_my_files.html](https://www.nirsoft.net/utils/hash_my_files.html)


    ### How to Do Kali Linux Hard Disk Installation

    The most convenient way to use Kali Linux long-term is by installing it on your
    hard drive. You can install Kali Linux alongside operating systems such as Windows,
    MacOS, and other Linux distributions. To install Kali Linux on the hard drive,
    we are going to require several tools. They include:

    - USB/DVD bootable media

    - A minimum20GB disk space for Kali Linux installation

    - Kali Linux ISO – obtained above


    Installation of Kali Linux on a physical machine requires a clean, non-partitioned
    hard drive without any data. Here, we are installing Kali alongside operating
    system. Once you have obtained a media such as USB or DVD, it is time to create
    bootable disk. If you are using a USB flash drive, download and install `BalenaEtcher`
    and follow instructions to burn the image. You can download the tool from the
    resource page below: [https://www.balena.io/etcher/](https://www.balena.io/etcher/)
    If you are going to use a DVD, download and install `Burnaware`: [http://burnaware.com/](http://burnaware.com/)


    Once you have created bootable media, you need to create a partition for Linux.
    If you are using windows, open disk manager, select the disk to partition, and
    click shrink. Set the size of the partition—it must be 10 GB and above—and click
    shrink. Once you have allocated your partition size, boot your device using the
    created bootable media.


    **NOTE**: Different computer models have different boot configuration. You can
    search the internet for your device boot options. Once your system boots, Kali
    Linux will prompt you with boot menu.


    Choose the method of installation. The graphical installer is friendlier to beginners.
    Select and configure your preferred language of installation. Next, select your
    geographical location. The next step is to configure your keyboard settings. Follow
    this with setting up your network settings and connect to a network. After that,
    create a password for the root user, which is a MUST-do. Continue to setup user
    account and password. On the next screen, which is partition, select `use the
    largest disk space` and select the partition you created earlier. Confirm and
    allocate the disk space, then select `write changes to disk.` Select `yes` and
    continue. Wait until the installation process completes. The next step is the
    package manager. Select `yes` and continue. If you select yes, make sure your
    device has an active network connection. If not, select no. Next, install the
    `GRUB` bootloader on the disk. Once the installation has completed, reboot the
    computer and select Kali Linux in the `GRUB` menu.


    ### How to Do Kali Linux Virtual Machine Installation

    The other way to use Kali Linux without installing it on the physical machine
    is running it as a virtual machine. Using virtualization software, you can run
    Kali Linux on your current operating system. To do this: the first step is to
    download a virtualization software and install it on your computer. In this guidebook,
    we are going to use `VirtualBox` from Oracle available from the resource page
    below: [https://www.virtualbox.org/wiki/Downloads](https://www.virtualbox.org/wiki/Downloads)


    **NOTE**: You can also use `VMware Workstation` but this guide does not cover
    the VMware configuration process.


    Once you downloaded and install Virtual Box, go to Kali download page and download
    the Kali Linux `VirtualBox` image. Once you have the image file, extract the file
    and save it in a folder. The extracted file contains a `.ova` file. Open it and
    select `VirtualBox`. The next window allows you to customize the location, memory
    and other configuration of the system. Once you are all set, click import to start
    the process that imports the operating system. Once you complete that, click on
    start to boot the new system. The default username is `root` and password: `toor`.
    The steps are very similar if you are using VMware version.


    ## Virtual Machine Configurations

    After creating and launching Kali Linux using VirtualBox, we need to set some
    important configuration so that we can completely setup a penetration-testing
    environment. Here are the most important configurations:


    #### 1: VirtualBox Guest Additions

    VirtualBox guest additions are `required-installation` once you have launched
    the system. They provide extra system features such as:

    - It enables the system to support full screen mode.

    - It enables host and guest systems to share files and folders

    - It allows copy and paste between host and guest machines

    - It fixes errors that may occur with the mouse between host and guest systems


    To install VirtualBox guest additions, go to Devices tab on VirtualBox menu and
    select install Guest additions. If you receive a warning message, ignore it and
    click cancel to continue. Next, open a terminal window and navigate to guest additions
    CDROM mount point as follows. Once in the directory, enter `ls -l` to list all
    the files in that directory. Now run the `VBoxLinuxAdditions.run` file using the
    command:


    ```

    ./VBoxLinuxAdditions.run

    ```

    Wait until all the modules successfully build and install. Next, change back to
    the root directory and unmount the guest additions cdrom. After that, reboot the
    system by entering `reboot` in the terminal. Once the system has rebooted, you
    should be able to enter full screen mode.


    #### 2: VirtualBox Network Settings

    By default, the Kali Linux VirtualBox image uses the Network Translation Address
    (`NAT`) connection type. This connection type allows the guest system to connect
    to the network. However, the other devices on the network will not connect to
    the Kali Machine. For penetration testing, all machines in a network should be
    able to communicate with each other. To change the system’s network settings,
    follow the steps below. Start by turning off the guest system. Then Open VirtualBox
    Manager and select Kali Linux virtual machine. On the right hand, select the network
    icon. On the dropdown box, select adapter 1 and change from `NAT` to `Bridged`.
    Then select the network interface to use for connections.


    #### 3: Activating Wireless

    Running Kali Linux as a virtual machine does not allow you to use the embedded
    wireless device. However, you can use an external network device. To use the external
    network adapter in Kali Linux, insert your network adapter and navigate to Devices,
    USB Devices, and select the name of your network adapter. Once the network adapter
    connects, you can launch the terminal and type `ipconfig` to see the name and
    adapter information.


    ### How to Run Kali Linux in Live Mode

    The other method of using Kali Linux is by running it live. To run Kali Linux
    live, burn the Kali ISO into a DVD or USB drive and boot with it. Select `Live`.
    One of the advantages of running Kali Linux in live mode is speed. Live mode is
    easy to setup and use. However, if you are running live mode, all the files and
    configurations settings will be lost once you reboot your device. This method
    is very useful if you want to try out Kali Linux or perform a quick task. If you
    are going to use Kali Linux extensively we recommend installing it on the hard
    disk.


    ### Installing Vegetable Machine

    In this section, we are going to setup a vulnerable server for testing purposes.
    This server will allow us to perform attacks discussed in later sections. A virtual
    server is a great way to perform attacks on the internet. This virtual machine
    also gives us full control as we can increase and decrease its security according
    to the type of tests we want to perform. It also allows room for errors as we
    can just re-install the system in case of. The vulnerable server we are going
    to use is Metasploitable 2. You can download Metasploitable file from the resource
    page: [https://sourceforge.net/projects/metasploitable/](https://sourceforge.net/projects/metasploitable/)
    Once you download the file, extract it, and set it up using the steps outlined
    in the Kali Linux VirtualBox section. Once configured, launch it and log in using
    username `msfadmin` and password `msfadmin`.


    **NOTE**: There are other vulnerable servers you can use such as Metasploitable
    3, Hera Lab, Pwn OS, Vuln Hub and others. We are using Metploitable 2 because
    it has an active development team Rapid 7 and tons of vulnerabilities in the application,
    network, and web and operating system layers. You can read more about Metasploitable
    2 on the Rapid 7 page: [https://metasploit.rapid7.com/docs/metasploitable-2](https://metasploit.rapid7.com/docs/metasploitable-2)


    ### Updating Kali Linux

    Kali Linux has tons of tools and applications that receive frequent updates. You
    should regularly update your system so that you get the latest features. Just
    like other Debian-based distributions, the package manager for Kali Linux is `dpkg`
    and therefore uses `apt update` command. To update Kali Linux, open the terminal
    and enter `apt-get update`. This command refers to the `sources.list` file to
    get the repositories available. To ensure the correct repositories are available
    in this file, type the following command in the terminal: `nano /etc/apt/sources.list`.
    If these repositories are not included on your `sources.list`, you can manually
    add them and then type `apt-get update`. The above command synchronizes the package’s
    index files from the repositories included in the `sources.list` file. Make sure
    to synchronize all the repositories before installing or updating a software.
    Once the packages have been synced, the next step is to update all the software
    and packages included in the system. You can use the following commands to update
    packages in Kali Linux:

    - `apt-get upgrade`: We use this command to upgrade only the packages included
    in version of Kali Linux we are using.

    - `apt-get dist-upgrade`: We use this command to upgrade the entire Kali Linux
    distribution to the latest version.


    Once you select the type of update you want to conduct, Kali Linux will perform
    upgrades automatically. The system may prompt for some input depending on the
    type of operation in performance. **NOTE**: These types of upgrades may take a
    while depending on your machine’s capabilities and your internet speed.


    ## Action Step

    Use the material you have learned in this chapter to setup your working environment
    in readiness for the practical Kali Linux lessons in later parts of this ultimate
    Kali Linux tutorial. In the next part of the guide, we shall look at a basic introduction
    to working within the Linux kernel system, of which Kali Linux is, and its network
    interface so that as you move forth into using Kali Linux for pen-testing, hacking,
    and for your cybersecurity needs, you have a firm idea of the basic elements we
    shall be dealing with in later parts of this Kali Linux tutorial.


    ## Part 2: A Basic Introduction to Networking and Working with the Linux Kernel
    System

    In this section, we are going to cover the basics of working with the Linux kernel
    system we set up above. This section is important for beginners because the Debian-based
    system upon which Kali works is different from the common Windows or OS interface.
    Let us start by understanding the Linux filesystem and its organizational structure.
    A filesystem is the methods or data structure that operating system uses to organize
    files and data.

    All Linux based distro have similar structure though some may have additional
    files and directories. In this section, we are going to use Kali Linux directory
    structure.

    - `/`: Root Directory. This is root or the starting point. Every directory in
    the Linux FS starts from this folder. In most Linux distributions, only the root
    user has access to this directory.

    - `/bin`: Binary Files. This is the directory containing basic programs.

    - `/boot`: Kernel Files. These are the Linux kernel and files required for early
    boot process.

    - `/dev`: Device Files. This directory contains device files.

    - `/etc`: Configuration Files. This is the directory containing Linux files.

    - `/home`: User Directory. This is the user’s directory; it contains users’ personal
    files such as videos, documents etc.

    - `/lib`: System Libraries containing basic libraries.

    - `/media`: Mount Point. This is mount point for removable devices such as USB
    drives, CD and etc.

    - `/mnt`: Temporary Mount Point. This is the temporary mount point. It is available
    mostly in live mode.

    - `/opt`: Third Party Applications. Contains applications provided by third parties.

    - `/root`: Admin personal directory. This contains administrator’s personal files
    such as media and documents.

    - `/run`: Volatile Data. Contains runtime erased upon reboot.

    - `/sbin`: System Binaries. Contains system programs.

    - `/srv`: Server Files. Contains data used by servers hosted on the system.

    - `/tmp`: Temporary Data. Contains temporary data erased at boot.

    - `/usr`: Applications. This is the directory containing application files. It
    has various sub-directories.

    - `/var`: Variable Data. Contains variable data required by daemons. These files
    include log files, spools, and caches.

    - `/proc`: This is a special directory containing runtime information e.g. system
    memory, devices mounted, hardware config etc. We can refer to it as control center
    for the kernel during runtime.

    - `/sys`: Sys filesystem is pseudo system that exports device information and
    drivers through virtual files.


    ### The Linux Command Line

    The power of the Linux operating system lies within an application called a terminal.
    It may have many names like `terminator`, `terminal`, `iterm`, `xterm`, and more
    but it is still a terminal. The terminal refers to an interactive, text-based
    interface that allows the user to enter, execute, and view the results of the
    commands. In desktop-oriented distros, we can launch the terminal from a graphical
    desktop session while server-oriented distros such as Fedora do not provide a
    graphical session.


    ### Launching Terminal

    By default, Kali Linux provides gnome gnome desktop environment. If you downloaded
    the right Kali Linux and if your system is working properly, you should have a
    graphical desktop environment. On the left hand of your desktop screen, you will
    notice a dock that contains a list of your favorite application. Select the black
    icon with a text inside; it’s usually the second from top. You can also move your
    mouse pointer to your top left of the screen to activate the activity page. Type
    terminal to launch it:


    ### Command line Basics – Managing Files

    As a Linux user, managing files via the terminal is very essential. Rarely will
    you encounter cases where you switch from terminal to GUI control. In this section,
    we are going to see how to manage files from the terminal similar to how you would
    use a GUI (graphical user interface) file manager. Launch the terminal and let
    us get started.

    - `pwd`: This command stands for print working directory; it shows your current
    directory in the file system.

    - `cd`: We use this command to navigate to the targeted directory. The complete
    syntax is `cd <name of target directory>`. If the directory is outside the current
    working directory, the path is required. If you do not specify the target directory,
    it takes you to your home directory. To go back to the previous directory since
    your last cd call, type `cd ..` or `cd -`.

    - `ls`: We use the command `ls` to list all the files and directories within the
    current working directory. The syntax for `ls` command is `ls <option> [file|dir]`.

    - `mkdir`: We use this command to create new directories. To create a new directory
    in your current workspace, type `mkdir <dir name>` for example, `mkdir newFolder`.
    For cases where you want to create a directory outside your current directory,
    you must specify a path. For example, `mkdir /user1/Desktop/Report/lastWeek` where
    in this case, `lastWeek` is the name of the directory you want created.

    - `rmdir`: We use the `rmdir` command to remove directories. Similar to the `mkdir`
    command, this command takes options that determine how the system deletes files.

    - `mv` and `cp`: We use the `mv` command to move and rename directories and files.
    We use the `cp` command to copy files. The syntax for copying files is `cp <source
    file> <target-file>`. Here is an example, `mv helloDir > /usr/share/`.


    ### Other Useful Commands

    Apart from the file management commands we have discussed above, Linux supports
    a wide array of commands. In this section, we are going to look at some of the
    must know.

