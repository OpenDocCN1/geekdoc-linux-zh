    \ You can find these modules by navigating to `/usr/share/powersploit` in Kali\
    \ Linux. You can learn more about `powersploit` from the following resource page:[https://github.com/PowerShellMafia/Powersploit](https://github.com/PowerShellMafia/Powersploit)\n\
    \n### Shellter\n`Shellter` is a very popular shellcode insertion tool that encodes\
    \ payloads to bypass some security software applications such as Antiviruses.\
    \ It works by embedding 32-bit windows applications with the shellcode thus evading\
    \ antiviruses. You can use shellcodes from Metasploit and other frameworks or\
    \ create your own.\n* Install `Shellter` using `apt-get install Shellter`\n* Next\
    \ install `wine` using `apt-get install wine2`\n* Next, launch `Shellter` from\
    \ the terminal\n`Shellter` provides an easy to use interface with interactive\
    \ questions.\n\n### Nishang\n`Nishang` is another post exploitation tool similar\
    \ to `Powersploit` offering PowerShell scripts to use alongside `Metasploit`.\
    \ You can find more information on `Nishang` from the resource page:[https://github.com/samratashok/nishang](https://github.com/samratashok/nishang)\n\
    Action stepRun using the various tools discussed here. Other parts of this guide\
    \ shall have practical practices that will test your ability to use some the Kali\
    \ Linux tools whose usage of we are illustrating in this guide. The more you practice,\
    \ the easier and more intuitive using Kali Linux becomes, and the better a hacker/security\
    \ analyst you become.\n\n# Part 12 : Social Engineering\nSocial Engineering is\
    \ the art of psychologically manipulating a client into tasks that lead to you\
    \ gaining private information. It is a very powerful and popular technique among\
    \ hackers. In this section, we are going to cover some the Kali Linux tools that\
    \ allow us to perform these kinds attacks.\n\n### Social Engineering Toolkit (SET)\n\
    Social Engineering Toolkit, or `SET`, is the most popular social engineering tool.\
    \ By design, the tool’s main task is to perform attacks on human beings through\
    \ psychological manipulation. `SET` offers a wide range of features such as:\n\
    * Infectious Media\n* SMS Spoofing\n* Web Attack\n* Human Interface Attack\nTo\
    \ launch `SET` in Kali, open the terminal and enter `setoolkit`. This provides\
    \ a menu allowing to select the type of attack to carry out.\n![](Image0060.jpg)\n\
    Let us discuss some features in `SET`:\n* Infectious Media Generator: We use this\
    \ feature to create a Metasploit payload with autorun on USB or DVD.\n* SMS Spoofing:\
    \ We use this feature to spoof specifically created SMSs to the target.\n* Web\
    \ Attack: We use these to perform phishing attacks on a target—mostly carried\
    \ out using fake link.\n* HID vectors: This feature is the use of a programmable\
    \ microcontroller that acts as a keyboard once plugged in. They include USB Ducky\
    \ and Teensy both of which you can download from the resource pages:[https://shop.hak5.org/products/usb-ducky-deluxe](https://shop.hak5.org/products/usb-ducky-deluxe)[https://www.pjrc.com/store/](https://www.pjrc.com/store/)\n\
    For more information on `SET`, visit the resource page:[https://github.com/trustedsec/social-engineer-toolkit](https://github.com/trustedsec/social-engineer-toolkit)\n\
    \n### U3-pwn\n`U3pwn` is a tool used to inject executable files into SanDisk smart\
    \ devices. It contains the Metasploit payloads injection for SanDisk devices.\
    \ It performs this action by removing the current ISO file and replacing it with\
    \ a custom one with autorun capabilities. You can launch it by opening the terminal\
    \ and typing `u3pwn`. This tool can fall under social engineering or gaining access.\n\
    \n### Ghost-phis\n`Ghost phisher` is a python-based tool used for wireless audit\
    \ and social engineering. It supports features that allow you to create fake networks\
    \ that allow to capture traffic on the network. It includes the following features:\n\
    * HTTP server\n* Inbuilt DNS server\n* Session Hijacking\n* Web hosting\n* Credential\
    \ Harvester\n* Metasploit Pentest Binding\n* SQLite database support\n* Fake Wi-Fi\
    \ access point\n* Inbuilt DHCP server\n* Standalone update support\nGhost phisher\
    \ provides a graphical interface using the python Qt Graphical library. Once you\
    \ launch it, you just type the URL and perform the tasks needed. Learn more about\
    \ Ghost phisher from this GitHub resource page:[https://github.com/savio-code/ghost-phisisher](https://github.com/savio-code/ghost-phisisher)\n\
    \n# Part 13 : Reverse Engineering Tools\nReverse engineering is the process of\
    \ taking apart an already completed system or software and learning how it works\
    \ backwards. In earlier days, the reverse engineering process only applied to\
    \ hardware items but that has largely shifted over the years. In this section,\
    \ we are going to look at some of the tools within Kali Linux that help us take\
    \ apart software so that we can learn how it works and the base infrastructure\
    \ behind its operation.\n\n### Dex2jar\nDexjar is a lightweight tool used to read\
    \ Dalvik Executable files. It helps in disassembling of Android applications to\
    \ jar files. The tool works with `java` and Android application classes. It comprises\
    \ of several components that allow it to perform operations as:\n* Reading `dex`\
    \ instructions to `dex-ir` format\n* Converting `dex-ir` to `asm` format\n* Representing\
    \ `dex` instructions\n* Reading Dalvik Executable files\n* Disassembling and assembling\
    \ `dex` file into and from `smali` files\nFor more information, peruse the Dex2jar\
    \ Wiki guide on the resource page below:[https://sourceforge.net/p/dex2jar/wiki/UserGuide/](https://sourceforge.net/p/dex2jar/wiki/UserGuide/)\n\
    \n### Java Snoop\n`Javanoop` is a penetration-testing tool used to test the security\
    \ of applications. It allows attaching of processes such as debugger, thus modifying\
    \ method and injecting custom code. You can learn more about this tool from the\
    \ following resource page:[https://code.google.com/archive/javasnoop/](https://code.google.com/archive/javasnoop/)\n\
    \n### OllyDbg\n`OllyDbg` is an assembly level x86 debugger and analyzer for Windows.\
    \ It is a very popular tool used to produce cracks for commercial applications.\
    \ It accepts an `exe` or `dll` file that then disassembles and displays in binary\
    \ thus for modifications as illustrated below.\n![](Image00061.jpg)\nThis tool\
    \ offers exclusive features such as:\n* Direct disassemble of `exe` and `dll`\
    \ files\n* Interactive graphical interface\n* Multithreading application support\n\
    * Dynamic frame stacks\n* Static code analysis\n* `UNICODE` support\n* Automatic\
    \ recognition of `ASCII` and `UNICODE` strings\n* Allows attaching of running\
    \ processes\n* Supports `Borland` format\n* Portable\n* Supports file scanning\n\
    * Dynamic address analysis – `API` calls, loops, strings, etc. (Wait, I is where\
    \ it ends here)\n\n### EDB-Debugger\n`Edb-debugger` is a cross platform `Arch32/x86/64`\
    \ debugger. Its primary focus is modularity in reverse engineering. It offers\
    \ features such as:\n* Dump memory\n* Conditional breakpoints\n* Dynamic inspection\n\
    \n### Apktool\n`Apktool` is a popular and effective tool for reverse engineering\
    \ android applications. It has the capability of decoding and rebuilding entire\
    \ resources into native format. It offers step-by-step code edit.\nAction stepRun\
    \ using the various tools discussed here. Other parts of this guide shall have\
    \ practical practices that will test your ability to use some the Kali Linux tools\
    \ whose usage of we are illustrating in this guide. The more you practice, the\
    \ easier and more intuitive using Kali Linux becomes, and the better a hacker/security\
    \ analyst you become.\n\n# Part 14 : Hardware Hacking\nHardware hacking is a very\
    \ important aspect of penetration testing. It involves programming hardware to\
    \ perform tasks automatically. NOTE: Kali Linux does not have wide serving of\
