- fmt: "\nNOTE: `Linux` Commands are case Sensitive. If you type them incorrectly,\
    \ they will not work. If you want to master `Linux`, Master the shell.\n\n# Networking\
    \ Basics\nTo understand networking in in the Debian-based system, you need to\
    \ understand the following concepts:\n\n## Network Hosts\nA network host, simply\
    \ called `host`, refers to any devices connected to a specific network. It could\
    \ be a printer, personal computer, mobile device or even a web server.\n\n## Network\
    \ Protocols & Services\nThe following are some of the most common protocols:\n\
    \n### 1: Internet Protocol\nInternet protocol is the main set of rules that are\
    \ very essential in computer communication. We normally refer to this as the `IP`\
    \ address. It is unique set of characters identifying each device connected to\
    \ a network. There are two main types of Internet Protocol:\n\n### Private IP\
    \ address\nA private IP address is a type of `IP` that identifies devices connected\
    \ on a private network such as `LAN`. They range from 1 to 255\\. An example of\
    \ a typical private IP would be something like `192.168.0.2` or `192.168.0.220`.\
    \ To find the Private `IP` of your device on your local network, open up the command\
    \ prompt and type `ipconfig` and `ifconfig` on windows and Linux respectively.\n\
    ![](Image00015.jpg)\n\n### Public Internet Protocol\nA public IP address is the\
    \ other type of `IP` used to identify devices connected on the internet. Public\
    \ `IP` is globally unique. To find your public `IP`, open your browser, and using\
    \ Google Search, type and search for “what is my public IP.” \n\n### 2: HTTP &\
    \ HTTPS\n`HTTP` and `HTTPS` are another common type of network protocol that refer\
    \ to Hyper Text Transfer Protocol (`HTTP`) and Hyper Text Transfer Protocol Secure\
    \ (`HTTPS`) respectively. This type of protocol allows communication between web\
    \ servers and typical web browser. It is the second most used protocol.\n`HTTP`\
    \ and `HTTPS` only differ on security. The information transferred on the `HTTP`\
    \ protocol is unencrypted and easily accessible through sniffing methods and such.\
    \ `HTTPS` uses secure socket layer (`SSL`) to encrypt the information.\n![](Image00016.jpg)\n\
    \n### 3: Secure Shell – SSH\nSecure shell is becoming a very common protocol among\
    \ network administrators and IT professionals. It allows the connection of remote\
    \ hosts for communication.\nSuppose you have a dedicated server and you want to\
    \ install programs on it. With the use of `SSH` client and the `SSH` server on\
    \ the remote hosts, you can be able to gain access to it and configure it as if\
    \ you were actually there to configure it.\n`SSH` is similar to the Microsoft\
    \ `Telnet` protocol except that it is more secure and more powerful compared to\
    \ `Telnet`. This protocol is most common among Linux users. Connecting to `SSH`\
    \ requires a username and password.\n\n### 4: File Transfer Protocol\nFile Transfer\
    \ Protocol, also called `FTP`, is another common type of network protocol. It\
    \ allows upload and download of multiple files to and from a remote host. Developers\
    \ and IT professionals normally use it to upload and download files on the server.\n\
    Connecting to the server requires an `FTP` client and a username and password\
    \ . The most common `FTP` client is `FileZilla`; you can download `FileZilla`\
    \ from the resource page below:[https://filezilla-project.org/](https://filezilla-project.org/)\n\
    \n## Network Ports\nNetwork ports and network protocols are very similar. We normally\
    \ say that a computer running a protocol such as `HTTP` or `FTP` is running the\
    \ `HTTP` service. These services or protocols associate with a specific number\
    \ called a `port`. A single port can support only one service on a single machine.\
    \ If another device wants to access a specific service on a certain machine, it\
    \ has to connect to the specific port where the intended service is running.\n\
    A simple explanation can be that ports are doors where each door allows access\
    \ to a specific service within the computer. Network ports are very important\
    \ in hacking since exploiting a certain service on a computer can allow further\
    \ access.\nThe screenshot below shows the list services running on a windows 10\
    \ machine.\nNOTE: You can configure these services to use a specific port; they\
    \ are therefore un-fixed.\n![](Image00017.jpg)\nDefining which `port` a service\
    \ will be running on within a specific computer is very difficult because a computer\
    \ has over 65, 535 `TCP` ports and 65, 535 `UDP` ports all of which are configurable\
    \ to run any service.\n\n### Action step\nThis part of the guide has covered everything\
    \ you need to know about working within the `Kali Linux` interface and how the\
    \ networking system works within the system. Go over these elements several times\
    \ so that you internalize them and can therefore follow along as we delve deeper\
    \ into learning how to use `Kali Linux`.\n\n# Part 3: Information Gathering Tools\n\
    The first set of tools `Kali Linux` offers are information-gathering tools. Information\
    \ gathering, also called reconnaissance or `recon`, is the very first step in\
    \ penetration testing or launching an attack against a certain target.\nIn the\
    \ information-gathering toolset offered by `Kali Linux`, we are going to look\
    \ at the most ones that include:\n* `Nmap` and `Zenmap`\n* `Netdiscover`\n* `DNS\
    \ Tools`\n* `Hping3`\n* `Load Balancing Detectors`\n\n### Nmap & Zenmap\n`Nmap`\
    \ is the often referred to as King of scanners. It is the most advanced tool for\
    \ performing network scanning. `Zenmap` is the Graphical version of `Nmap` as\
    \ it is command line tool. In cyber security, we normally use `Nmap` to detect\
    \ the devices connected on the network, determine services running on them, versions\
    \ of the specified services, and even the operating system running.\n\n### How\
    \ to use Nmap in Kali Linux\nHere is how to use `Nmap` in `Kali Linux`. Fire up\
    \ `Kali Linux` and go to applications – information gathering – `Zenmap`. We are\
    \ going to use the GUI version of `Nmap` as it is easy to use for people with\
    \ not command line experience.\n\n### Discovering Hosts\nThe first step in information-gathering\
    \ phase is to determine the connected clients. A network can support more than\
    \ 200 clients. Scanning the information on all of these devices can take a while.\
    \ `Nmap` offers a very efficient way to perform host discovery in order to find\
    \ your target on the target network. Let us start up Kali Linux and Metasitable\n\
    ![](Image00018.jpg)\nOnce you have launched `Zenmap`, enter your network gateway/\
    \ which scans the entire subnet. The illustration below show `nmap` of the entire\
    \ network:\n![](Image00019.jpg)\nDo not worry about most of the details in the\
    \ above. We can see that once the network scanning process completes, 7 hosts,\
    \ two of which were discovered as Metasitable. The details we are looking for\
    \ is the Metasitable machine.\n\n### Stealth Scans\nStealth scan is also known\
    \ as `SYN scan`. It works by sending a `SYN` packet to the target. According to\
    \ the general rule of networking, once system sends a `SYN` packet, the targeted\
    \ device will return an `ACK` (acknowledgment) response. If this does not happen,\
    \ `Nmap` uses this technique to determine the open and closed ports in target.\
    \ To perform more detailed scan on target, instead of scanning the entire network,\
    \ enter the IP address of the target in `Zenmap`. The following result is what\
    \ the system returns for Metasitable.\n![](Image00020.jpg)\n\n### Netdiscover\n\
    `Netdiscover` is another tool bundled into Kali Linux. This lightweight tool allows\
    \ us to scan the network for connected devices quickly. It is very useful when\
    \ doing a quick scan and discovering the IP and MAC addresses. To perform a quick\
    \ scan, open the terminal and enter `netdiscover`. You can also use the help flag\
    \ in Linux to find more options.\n![](Image00021.jpg)\n\n### DNS Tools\n`DNS`\
    \ tools help in zone transfers and IP resolving for domain names. In this section,\
    \ we are going to look at some of the `DNS` tools Kali has.\n\n### Dnsenum\n`Dnsenum`\
    \ is a tool used to get records of stored domain such as `MX` and `A` records.\
    \ It is a Perl script and requires that you install Perl in Kali Linux. To use\
    \ `dnsenum`, type `dnsenum domainname.com` on the terminal; the following illustration\
    \ shows `dnsenum` for `facebook.com`:\n![](Image00022.jpg)\n\n### DNSMAP\nWe normally\
    \ use this tool to perform `DNS` mapping of specific domain name. We can use it\
    \ to extract information such as phone numbers, contact information, and other\
    \ subdomains within it.\n\n### HPing\n`Hping3` is a more advanced ping tool used\
    \ by wide range of hackers. It allows the attacker to perform ping by bypassing\
    \ firewall filters. It uses RAW-IP, TCP, UDP and ICMP protocols for ping requests.\
    \ `Hping3` supports file share between channels and traceroute mode. You can use\
    \ the help flag in Linux to find more information on the command parameters. The\
    \ basic command is `hping3 ip-address`.\n\n### Action step\nThe tools we have\
    \ discussed here are just a serving of the many information-gathering tools within\
    \ Kali Linux. As you use these primary tools, your ability to use the various\
    \ information-gathering tools within Kali Linux will automatically improve. In\
    \ the next part of the guide, we shall look at how to use the primary vulnerability\
    \ assessment tools within Kali Linux.\n\n# Part 4: Vulnerability Assessment\n\
    In hacking, we use vulnerability assessment tools to recognize, categorize, and\
    \ characterize security vulnerabilities within a system. These tools automate\
    \ vulnerability scanning and security audit. In this section, we are going to\
    \ look at some of the top vulnerability assessment tools in Kali.\n\n## Web Application\
    \ Scanners\nWhen developers do not adhere to secure coding principles and techniques,\
    \ web application can contain vulnerabilities that allow an attacker to penetrate\
    \ them. Here are some of the tools used to scan web applications for vulnerabilities.\n\
    \n### Nikto\n`Nikto` is web vulnerability scanner bundled into Kali Linux. `Nikto`\
    \ is very powerful and supports wide range of capabilities. To launch `nikto`,\
    \ navigate to Applications – vulnerability scanners – `Nikto`. You can use the\
    \ help flag to find more information on command parameters. `Nikto` can detect\
    \ outdated server implementation and misconfigurations.\n\n### OWASP ZAP\n`OWASP`\
    \ is an open-source, web-application proxy tool used to perform web application\
    \ scanning. You can launch it in Kali Linux by entering the command `owasp-zap`.\
    \ `OWASP` offers a graphical window to work with. Once the window has launched,\
    \ you can enter the URL of a web application and click attack. `OWASP` will report\
    \ all misconfigurations of the application in the alerts tab.\n![](Image00023.jpg)\n\
    \n### W3af\n`W3af` is a python web scanner used to identify and exploit all web\
    \ application vulnerabilities. This web-application audit framework offers both\
    \ graphical and command line usage. We normally refer to it as ‘Metasploit for\
    \ web application’ and we can use it to perform attacks such as cross-site scripting,\
    \ remote file inclusion, SQL injections etc.[http://w3af.org/](http://w3af.org/)\n\
    \n## Network Vulnerability Scanners\nHackers and cybersecurity experts normally\
    \ use network tools to scan routers, databases, protocols, and switches. Kali\
    \ Linux offers a ton of tools for network scanning but we will only look at the\
    \ most common one.\n\n### Cisco Tools\n`CISCO` devices are usually prone to a\
    \ number of vulnerabilities that are accessible using a number of tools. Here\
    \ are some of the tools we are going to cover:\n\n### Cisco Auditing Tool\nThis\
    \ is a Perl script tool that helps a penetration tester perform security audits\
    \ and identify vulnerabilities such as `SNMP` strings, `cisco` bugs and default\
    \ credentials for `cisco` devices. The syntax for launching it is `CAT -h IP -w\
    \ lists/community -a lists/words`.\n\n### Cisco Torch\nWe use `Cisco torch` to\
    \ perform mass scanning, fingerprinting, and exploitation of vulnerabilities within\
    \ `cisco routers`. You can launch it by typing `cisco-torch -parameters IP`. Once\
    \ the command has executed, the tool will report if it found anything.\n\n###\
    \ Cisco Global Exploiter\n`GE` is another `cisco` exploitation tool. We normally\
    \ use this advanced and simple tool to perform attacks on `cisco devices`. You\
    \ can launch it by typing `ge. IP`. Wrong use of this tool such as performing\
    \ Router of Service can cause devices to crash.\n\n### Action step\nBefore moving\
    \ on the next part of the book, orient yourself well with these, and the other\
    \ vulnerability assessment tools within Kali.\n\n# Part 5: Wireless Attacking\
    \ Tools\nIn this section, we are going to look at some of the wireless tools offered\
    \ by Kali Linux. Our primary focus shall be Wi-Fi hacking tools. To use these\
    \ tools, you need a wireless card with monitor mode.\n\n### Kismet\n`Kismet` is\
    \ 802.1 layer wireless network analyzer, detector, sniffer, and IDS tool. `Kismet`\
    \ supports wide range of wireless cards they support monitor mode. To use it,\
    \ you need to turn your wireless card into monitor mode. To discover the name\
    \ of your wireless card, type `ifconfig` in the terminal; in most cases it will\
    \ be `wlan0`. Once you get the name of your wireless card, enter the command `airmon-ng\
    \ start wlan0`. Launch the terminal and enter `kismet`. Click OK on the window\
    \ that appears to start sniffing for wireless. Agree to start the `Kismet` server\
    \ upon request otherwise it will not work.\n![](Image00024.jpg)\n\n### Wifite\n\
    `wifite` is a network-cracking tool used on WEP, WPA and WPS networks. To use\
    \ it, you need to set your network card to monitor mode using the command shown\
    \ above. Launch `wifite` by navigating to applications – wireless attacks – `wifite`.\
    \ To show the networks available, use `wifite -show`. Once you have found the\
    \ network to attack, end the scan by hitting `CTRL + C`. Select the target by\
    \ entering its corresponding number. The tool will start cracking the network\
    \ and display the key. Once the tool finds the key, it will display it below the\
    \ program.\n![](Image00025.jpg)\n\n### Fern Wifi Cracker\n`Fern Wifi cracker`\
    \ is graphical cracking tool. It is very easy to use and is therefore very friendly\
    \ for beginners. Launch it by navigating to applications – wireless attacks –\
    \ `fern`. First select the wireless card you want to use – ensure the card is\
    \ in monitor mode. Next, click for access points to scan for available networks.\
    \ Once the scan has completed, it will display all the available networks. Once\
    \ you select the network to attack, click Browse to choose a wordlist to use for\
    \ the brute-force. If the tool finds the key, it will display it below.\n\nArduino\
    \ IDE is a single-board programmable microcontroller. `Arduino` uses simplified\
    \ C++, which makes it easy to work with. It comprises of a programming environment\
    \ used to write the code and upload it on the board. To use `Arduino`, you can\
    \ find out more about `Arduino` and programming from the following resource page:[https://arduino.cc/](https://arduino.cc/)\n\
    \n# Part 8: Forensics Tools\nForensics is becoming a very important aspect of\
    \ cybersecurity. Forensics is the art of using scientific methods to investigate\
    \ a crime and perform recovery measures for evidence. `Kali Linux` has tons of\
    \ tools to help you achieve this easily. Let us look at some of the Kali tools\
    \ used in this area.\n\n### Autopsy\n`Autopsy` is an open-source forensic tool\
    \ used to investigate disk images. It provides a nice user interface for easy\
    \ control and management of files. Usage of `Autopsy` is common among law enforcement\
    \ personnel. `Autopsy` contains wide range of functionalities such as keyword\
    \ search, hash filtering, data craving and multimedia extraction. `Autopsy` supports\
    \ disk images in certain types such as `E01` and Raw images. It then produces\
    \ reports in HTML and XSL formats. To launch `autopsy`, navigate to Forensics\
    \ – `Autopsy`. Once you launch it, you can access its web-based interface by opening:\
    \ `https://localhost:9999/autopsy`\n![](Image00040.jpg)\n\n### Binwalk\n`Binwalk`\
    \ is another forensics tool written in python that makes it possible to analyze\
    \ binary images. It allows penetration testers to find embedded files and executable\
    \ files. `Binwalk` provides very powerful features to those who know how to use\
    \ it expertly. You can use the tool to extract sensitive firmware that you can\
    \ then use `libmagic` which makes it efficient at working with signature files.\
    \ You can find more information from this resource:https://github.com/FirmLabs/binwalkImage00041.\n\
    \n### Rkhunter & Chkrootkit\n`rkhunter`, or rootkit hunter, is a program used\
    \ to find rootkits in installed systems. It allows detection of compromised systems\
    \ and removal of malicious files in a computers system. `chkrootkit` is similar\
    \ to `rkhunter` and can be able to detect system binaries for malicious modifications,\
    \ deletion of log files, string replacements, and temp file deletions. Both programs\
    \ provide very simple interfaces.\n![](Image00042.jpg)\n\n### Volatility\n`Volatility`\
    \ is the most popular python framework for extracting digital data from RAM samples.\
    \ `Volatility` supports memory dumps in several formats such as crash dumps, hibernation\
    \ files, and VM snapshots (a copy of virtual machine disk file). `Volatility`\
    \ is compatible with 64 and 32-bit variations of windows and Linux distros such\
    \ as Android. This tool comes in handy when investigating encrypted data on a\
    \ hard disk. Since this kind of data is stored in RAM, when available, this tool\
    \ saves a lot of time and makes tasks easier. Find more information about this\
    \ tool from this resource page:https://www.volatilityfoundation.org/](https://www.volatilityfoundation.org/)\n\
    Image00043.jpg)\n\n### Hashdeep\n`Hashdeep` is hash-auditing tool that deals with\
    \ SHA-256 and MD5 hash formats. It performs recursive hash calculations using\
    \ various algorithms.\n![](Image00044.jpg)\n\n### DDRescue\n`DDRescue` is a hard\
    \ disk data extraction tool used to copy data from a hard disk block in case of\
    \ read error. `DDRescue` performs automatically; it reads from good blocks of\
    \ a hard disk and recovers it. This tool is quite advanced; not use it unless\
    \ you know what you are doing. It may lead to data loss or disk damage.\nAction\
    \ step\nPractice using the six tools we have discussed here; they are the one\
    \ commonly used in forensic auditing and their mastery will enrich your forensic\
    \ testing knowledge and expertise:\n\n# Part 9: Sniffing and Spoofing Tools\n\
    In this section, we are going to discuss sniffing and spoofing techniques using\
    \ tools provided by Kali Linux. In some instance, we will deviate a little from\
    \ the tool’s topic and into networking.\nNOTE: To understand this section, you\
    \ need a proper understanding of `networking basics` such as protocols, DNS, and\
    \ OSI model. If you need to, cycle back to the part 2 of the book to relearn the\
    \ most important networking basics:\n\n### ARP Protocol\n`ARP` protocol or Address\
    \ Resolution Protocol is a communication protocol used for discovering link layer\
    \ address of a given layer address. We normally use it to map network addresses\
    \ as `Internet Protocol v4` to its respective physical address. You can read more\
    \ about `ARP` protocol from the following resource page:[https://en.wikipedia.org/wiki/Address_Resolution_Protocol](https://en.wikipedia.org/wiki/Address_Resolution_Protocol)\n\
    \n### How ARP Works\nThe `ARP` protocol is similar to `DNS`. If you are unfamiliar\
    \ with how `DNS` works, `ARP` matches a domain name to its respective IP address.\
    \ Take the example of a device with an IP `192.168.0.20`. This device wants to\
    \ communicate with a device on the same network with IP `192.168.0.21` but does\
    \ not know its physical address (MAC address). The device will broadcast an `ARP`\
    \ request across all devices asking who owns the `192.168.0.21`. When the device\
    \ with matching IP address receives this request, the owner of the requested IP\
    \ will reply with an `ARP` response that contains the physical address of the\
    \ device. Next, we are going to perform sniffing and spoofing using the following\
    \ tools:\n* `Ettercap`\n* `Wireshark`\n* `SSL strip`\n\n### Ettercap\n`Ettercap`\
    \ is network sniffer used to perform spoofing and man-in-the-middle attacks. In\
    \ this section, we are going to see how to perform `ARP` poisoning using `Ettercap`.\
    \ Launch `Ettercap` from the Kali Linux application. Once open, navigate to the\
    \ top bar and select, sniff. Select sniffing and then continue to select your\
    \ interface as `eth0` and `wlan0` for wireless.\n![](Image00045.jpg)\nNext, select\
    \ the hosts tab and click for hosts. Once the scan is complete, you will see the\
    \ list of connected devices on your network. Next, we need to specify `target1`\
    \ and `target2`. `target1` is the target machine we want to attack; `target2`\
    \ is the IP address of the router. With the targets specified, open the start\
    \ menu, select sniffing to start the process. `Ettercap` involves sending packets\
    \ to the network with requests to update the `ARP` cache replacing the MAC address\
    \ of your computer. This allows us to view all unencrypted information passing\
    \ on the network.\n\n### Wireshark\n`Wireshark` is a popular network tools bundled\
    \ with Kali. It is a packet sniffer and analyzer in the frame level. For better\
    \ understanding how `Wireshark` works, we are going to cover the `OSI model` in\
    \ basics. Once you launch `Wireshark`, select the network interface, and then\
    \ click on start sniffing. Once the tool captures network traffic, it will display\
    \ the information as illustrate below:\n![](Image00049.jpg)\nFrom the above image,\
    \ we can see that `Wireshark` captured traffic in the second Layer containing\
    \ mac address and IP address. You can find more information on how to read and\
    \ analyze network packets here:[https://www.hackingarticles.in/network-packet-forensic-using-wireshark/](https://www.hackingarticles.in/network-packet-forensic-using-wireshark/)\n\
    \n### SSL strip\n`SSLstrip` is a MITM tool that converts `HTTPS` traffic to `HTTP`\
    \ to allow the attacker to view information in plain text. It strips `https://www.url`\
    \ to `http://www.url`. You can start it by typing `SSLstrip` in terminal.\n![](Image00050.jpg)\n\
    Action stepKali Linux has various other sniffing and spoofing tools but the ones\
    \ we have discussed in this part of the guide are the primary ones that you should\
    \ know how to use:\n\n# Part 10 : Password Cracking\nPasswords are a very common\
    \ way of securing digital information and accounts. A password is a sort of ‘secret\
    \ code’ or ‘word’ used for owner-verification to gain access to personal information.\
    \ In this section, we are going to cover ways to use Kali Linux tools to crack\
    \ passwords. We can define Password cracking as the art of recovering passwords\
    \ from previous stored locations and formats. For this section, we are going to\
    \ cover the common set of tools for password cracking using Kali Linux. They include:\n\
    * `John the Ripper`\n* `Medusa`\n* `Hydra`\n* `Crunch`\n* `Rainbow crack`\n\n\
    ### John the Ripper\n`John the Ripper` is a popular, open source password-cracking\
    \ tool from Rapid 7 family. It supports brute forcing, dictionary and single crack\
    \ attacks. It automatically detects password flaws that make the computer vulnerable.\
    \ You can learn more about `John the Ripper` from the resource page:[http://www.openwall.com/john/](http://www.openwall.com/john/)\n\
    In this example, we are going to extract passwords stored in the `SAM` database.\
    \ Follow the steps below:\n* Download and install `PWDump` and extract it. [Download](https://www.openwall.com/passwords/pwdump)\n\
    * Navigate to the extracted directory and enter the command shown below: `PwDump.exe\
    \ > d:\\hashed.txt`\n* After the password hash completes the extraction, open\
    \ `John the Ripper` and enter the following command `john --format=LM path/to/hashed_file.txt`.\n\
    * After the tool cracks the password, it will display the corresponding username.\n\
    \n### Medusa\n`Medusa` is a network password-cracking tool that provides modular\
    \ and parallel brute force. It supports wide range of protocols such as `Telnet`,\
    \ `SSH`, `MySQL` etc. It requires target address, username list, and password\
    \ list. It offers a command line interface. You can launch it by entering the\
    \ command `medusa` in the terminal which returns the list of possible commands.\n\
    \nHow to Use Medusa to Crack Usernames and Passwords for Ftp\nLet us look at an\
    \ example of how to use `medusa` to crack usernames and passwords for `ftp` protocol\
    \ `medusa -h 192.168.0.25 -U ~/path/to/usernames.txt -P ~/path/to/passwords.txt\
    \ -M ftp`\n![](Image00051.jpg)\nOnce the tool finds the matched username and password,\
    \ appeas shown below:\n![](Image00052.jpg)\n\n### Crunch Password Generator\n\
    `Crunch` is a simple password generator. We normally use it to generate random\
    \ usernames and passwords and store them in a file. It accepts `min` and `max`\
    \ length followed by the characters to be included in wordlist. `Crunch` supports\
    \ the following features:\n* Unicode characters\n* It uses combination and permutation\n\
    * It supports lower and uppercase characters\nOnce you set `min` and `max` value,\
    \ you can then set where `crunch` will save the file.\n![](Image00053.jpg)\n\n\
    ### Rainbow Crack\n`Rainbow crack` is password-cracking tool that uses rainbow\
    \ tables. Rainbow tables are password files that you can download from online\
    \ sources and store in the computer storage. NOTE: Some rainbow tables range from\
    \ 100GB to 10TB. The larger the rainbow table, the longer it takes to crack the\
    \ password. Rainbow tables are available in different formats such `NTLM` hashes,\
    \ `LM` hashes, `SHA-1`. Use the following command: `rcrack ~/path/to/rainbow_table\
    \ -f ~/path/to/password_hash`.\nYou can download rainbow table from the following\
    \ resource:[http://project-rainbowcrack.com/table.htm](http://project-rainbowcrack.com/table.htm)\n\
    \n### Johnny\nCyber security experts and hackers rarely use this tool. The tool\
    \ is a graphical interface of John the Ripper, a tool discussed earlier.\n![](Image00055.jpg)\n\
    \n# Part 11: Post Exploitation\nOnce you compromise and gain access to a computer\
    \ system, the next task is usually to maintain access to this system. There are\
    \ a million ways to lose access such as updates, detection of your presence in\
    \ the system, antiviruses, and such. In this section, we are going to look at\
    \ the various methods you can use to maintain access to a system you have compromised.\n\
    \n### Weevely\n`Weevely` is tool used to generate stealth PHP backdoors providing\
    \ shell controls into the system. To launch `Weevely`, open the terminal and type\
    \ `weevely` to see the available commands.\n\nHow to use Weevely to exploit Metasitable\
    \ 2 DVWA web application\nHere is an example of how to use `weevely` to exploit\
    \ Metasitable 2 DVWA web application.\nStep 1: Launch Metasitable 2 and Kali Linux\n\
    Step 2: Open the terminal and type `weevely generate <password> ~/path/to/save_file.php`\n\
    ![](Image00056.jpg)\nStep 3: Open your Kali Linux web browser and navigate to\
    \ `<ip_of_metasitable>/dvwa` and login with username: `admin` and password: `password`.\n\
    ![](Image00057.jpg)\nStep 4: Navigate to upload tab and select the file generated\
    \ by `weevely` and click upload.\n![](Image00058.jpg)\nStep 5: Once the file completes\
    \ uploading, navigate to `backdoor.php` file to execute it.\nStep 6: The next\
    \ step is to open `weevely` and enter the command as Illustrated on the screengrab\
    \ below:\n![](Image00059.jpg)\nThe syntax above is `weevely <url_of_file.php>\
    \ <password>`\nStep 7: Once the file connects, you will get a backdoor access\
    \ to the web server.\n\n### Powersploit\n`Powersploit` is an exploitation tool\
    \ that allows a hacker to install a `PowerShell` backdoor to the target machine,\
    \ thus allowing you to connect to the target machine via `PowerShell`. `Powersploit`\
