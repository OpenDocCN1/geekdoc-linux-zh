  md: '# Chapter 3. Packages and Patches


    # 3.1. Introduction


    This chapter includes a list of packages that need to be downloaded in order to
    build a basic Linux system. The listed version numbers correspond to versions
    of the software that are known to work, and this book is based on their use. We
    highly recommend against using newer versions because the build commands for version
    may not work with a newer version. The latest package versions may also have problems
    that require work-arounds. These workarounds will be developed and stabilized
    in the development version of the book.


    Download locations may not always be accessible. If a download location has changed
    since this book was published, Google (http://www.google.com/) provides a useful
    search engine for most packages. If this search is unsuccessful, try one of the
    alternative means of downloading discussed at http://www.linuxfromscratch.org/lfs/packages.


    Downloaded packages and patches need to be stored somewhere that is conveniently
    throughout the entire build. A working directory is also required to unpack the
    packages and build them. $LFS/sources can be used both as the store for the tarballs
    and as a working directory. By using this directory, the required elements will
    be located on the LFS partition and will be available during all stages of the
    building process.


    To create this directory, execute the following command, as user root, before
    starting the download session:


    ```

    mkdir -v $LFS/sources

    ```


    Make this directory writable and sticky. "Sticky" means that if multiple users
    write permission on a directory, only the owner of a file can delete the file
    within a sticky directory. The following command will enable the write and create
    sticky modes:


    ```

    chmod -v a+wt $LFS/sources

    ```


    An easy way to download all of the packages and patches is by using wget-list
    as an input to wget. For example:


    ```

    wget -i wget-list -P $LFS/sources

    ```


    Additionally, starting with LFS-7.0, there is a separate file, md5sums, can be
    used to verify that all the correct packages are available before proceeding.
    Place that file in $LFS/sources and run:


    ```

    pushd $LFS/sources

    md5sum -c md5sums

    pop

    ```


