- img_proc: true
  md: '# Linux From Scratch - Version 7.1


    This package contains a number of essential programs for vicwing and manipulating
    files and directories. These programs are needed for command line file management,
    and are necessary for the installation procedures of every package in LFS.


    +   - DejaGNU

    This package contains a framework for testing other programs. It is only installed
    in the temporary toolchain.

    - Diffultils

    This package contains programs that show the differences between files or directories.
    These programs can be used to create patches, and are also used in many packages''
    build procedures.

    - Expect

    This package contains a program for carrying out script dialogues with other interactive
    programs. It is only installed in the temporary toolchain.

    - E2fsprogs

    This package contains the utilities for handling the ext2, ext3 and ext4 file
    systems. These are the most common and thoroughly tested file systems that Linux
