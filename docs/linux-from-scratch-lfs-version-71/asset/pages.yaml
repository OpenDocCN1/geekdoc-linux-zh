    This may be another manifestation of the previous problem. If not, and your rule
    uses sysfs attributes, it may be a kernel timing issue, to be fixed in later layers.
    For now, you can work around it by creating a rule that waits for the used sysfs
    attribute and appending it to the /etc/udev/rules.d/10-wait-for_sysfs.rules file
    (create this file if it does not exist). Please notify the LFS if you do this
    and so on.


