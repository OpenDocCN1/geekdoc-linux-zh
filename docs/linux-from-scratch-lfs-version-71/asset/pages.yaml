  md: 'The files /etc/profile and ~/.bash_profile are read when the shell is invoked
    as an interactive login shell.


    The basc /etc/profile sets some environment variables necessary for native language
    support. Setting them properly results in:


    +   - The output of programs translated into the native language

    - Correct classification of characters into letters, digits and other classes.
    This is necessary for bash to properly accept non-ASCII characters in command
    lines in non-English locales

    - The correct alphabetical sorting order for the country

    - Appropriate default sort size

    - Correct formatting of monetary, time, and date values


    Replace <ll below with the two-letter code for the desired language (e.g., "en")
    and <CC> with the two-letter code for the appropriate country (e.g., "GB") should
    be replaced with the canonical charm for your chosen locale. Optional modifiers
    such as "@euro" may also be present.


    The list of all locales supported by Glibc can be obtained by running the following
    command:


    ```

    locale -a

    ```


    Charmaps have a (e.g., "ISO-8859-1" is also referred to as "iso8859-1" and "iso88591".
    Some applications cannot handle the various synonyms correctly (e.g., require
    that "UTF-8" is written as "UTF-8", not "utf8”), so it is safest to choose the
    canonical name for a particular locale. To determine the canonical name, run the
    following command, where <locale name> is the output given by locale -a for your
    preferred locale ("enGB.iso88591" in our example).


    ```

    LC_ALL=<locale name> locale charmap

    ```


    For the "en_GB.iso88591", the command will print:


    ```

    ISO-8859-1

    ```


    This results in a local setting of "en_GB.ISO-8859-1". It is important that the
    locale found using the heuristic is tested prior to being added to the Bash startup
    files:


    ```

    LC_ALL=<locale name> locale language

    LC_ALL=<locale name> locale charmap

    LC_ALL=<locale name> locale int curr symbol

    LC_ALL=<locale name> locale int prefix

    ```


    The above commands should print the locale name, the character encoding used by
    the locale, the local currency and the prefix to dial before the phone number
    in order to get into the country. If any of the commands fail with a message similar
    to the one shown below, this means that your locale was not installed in Chapter
    6 or is not supported by the default installation of Glibc.


    ```

    locale: Cannot set LC_ to default locale: use the localectl command, or choosing
    a

    ```


    If this happens, you should either install the default locale using the localectl
    command, or choosing a different locale. Further instructions assure there are
    no such error messages from Glib.'
