  md: "# 4.3. Adding the LFS User\n\nWhen logged in as root, making a single mistake\
    \ can damage or destroy a system. Therefore, we recommend building the packages\
    \ in this chapter as an unprivileged user. You could use your user name, but to\
    \ make it easier to set up a clean working environment, create a new user lfs\
    \ as a member of a new group (also named lfs) and use this during the installation\
    \ process. As root, issue the following commands to add to the new user:\n\n```\n\
    groupadd lfs\nuseradd -s /bin/bash -g lfs -m -k /dev/null lfs\n```\n\nThe meaning\
    \ of the command line options:\n\n+   - s /bin/bash\nThis makes bash the default\
    \ shell for user lfs.\n- g lfs\nThis option adds user lfs to group lfs.\n- m\n\
    This creates a home directory for lfs.\n- k /dev/null\nThis parameter prevents\
    \ possible copying of files from a skeleton directory (default is /etc/skel) by\
    \ changing the input location to the local null device.\n\nlfs\nThis is the actual\
    \ name for the created group and user.\n log in as lfs (as opposed to switching\
    \ to user lfs when logged in root, which does not require the lfs user to have\
    \ a password), give lfs a password:\n\n| password lfs |\n| Grant lfs full access\
    \ to $LFS/tools by making lfs the directory owner: |\n| chown -v lfs $LFS/tools\
    \ |\nIf a separate working directory was created, give lfs ownership of this directory:\
    \ |\n| chown -v lfs $LFS/sources |\n\nNext, log in as user lfs. This can be done\
    \ via a virtual console, through a display manager, or with the following substitute\
    \ command:\n\n```\nsu - lfs\nThe \"-\" instructs su to start a login shell as\
    \ opposed to a non-login shell. The difference between these two types of shells\
    \ can be found in detail in chapter 11 and info bash.\n```\n\n# 4.4. Setting Up\
    \ the Environment\n\nSet up a good working environment by creating two new startup\
    \ files for the bash shell. While logged in as user lfs, issue the command to\
    \ create a new .bash_profile:\n\n```\ncat ~/.bash profile << \"EOF\"\nexec env\
    \ -i HOME=$HOME TERM=$TERM u:\\w\\$ /bin/bash\nEOF\n```"
  merge: -1
