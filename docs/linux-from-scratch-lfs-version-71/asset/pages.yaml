  md: '# 6.9.3. Configuring the Dynamic Loader


    By default, the dynamic loader (/lib/ld-linux.so.2) searches through /lib and
    /usr/lib for dynamic libraries that are needed by programs as they run. However,
    if there are libraries in directories other than /lib and /usr/lib, these need
    to be added to the /etc/ld.so.conf file in order for the dynamic loader to find
    them. Two directories that are commonly known to contain additional libraries
    are /usr/local/lib and /opt/; add them to the dynamic loader''s search path.


    Create a new file /etc/ld.so.conf by running the following:


    ```

    cat /etc/ld.so.conf << "EOF"

    # Begin /etc/ld.so.conf

    /usr/local/lib

    /opt/lib


    EOF

    ```


    If desired, the dynamic loader can also search a directory and include the contents
    of files found there. Generally the files in this directory are one line specifying
    the shared library path. To add this capability by running the commands:


    ```

    cat >> /etc/ld.so.conf << "EOF"

    # Add an include directory

    include /etc/ld.so.d/*.conf


    EOF

    mkdir /etc/ld.so.d

    ```


