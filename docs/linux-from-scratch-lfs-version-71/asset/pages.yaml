  md: '# Chapter 9. The End


    # 9.1. The End


    Well done! The new LFS system is installed! We wish you much success with your
    shiny new custom-built Linux system.


    It may be a good idea to create an /etc/lfs-release file. By having this file,
    it is very easy for you (and for us you need to ask for help to find out which
    LFS version is installed on the system. Create this file by running:


    ```

    echo 7.1 > /etc/lfs-release

    ```


    # 9.2. Get Counted


    Now that you have finished the book, do you want to be counted as an LFS user?
    Head over to http://www.linuxscratch.org/cgi-bin/lfscounter.php and register as
    an LFS user by entering your name and the first LFS version you have used.


    Let''s reboot into LFS now.


    # 9.3. Rebooting the System


    Now that all the software has been installed, it is time to reboot your computer.
    However, you should be aware of a few things. The system you have created in this
    book is quite minimal, and most likely will not have the functionality you need
    to be able to continue forward. By installing a few extra packages from the BLFS
    book while still in our current chroot environment, you can leave yourself in
    a much better position to continue on once into your new LFS installation. Installing
    a text web browser, such as Lynx, you can easily view the BLFS book in one virtual
    terminal, while building packages in another. The GPM package will also allow
    you to perform copy/paste actions in your virtual terminals. Lastly, if you are
    in a situation where static IP configuration requires installing packages as Dhcp
    or PPP at this point might also be useful.


    Now that we have said that, let''s move on to booting our new LFS installation
    for the first time! First exit the chroot environment:


    ```

    logout


    umount -v $LFS/dev/pts

    umount -v $LFS/dev/shm

    umount -v $LFS/dev

    umount -v $LFS/proc

    umount -v $LFS/sys

    ```


    Unmount the LFS file system itself:


    ```

    umount -v $LFS

    ```'
  merge: -1
  pgno: 245
- img_proc: true
  md: "# Linux From Scratch - Version 7.1\n\nIf multiple partitions were created,\
    \ unmount the other partitions before unmounting the main one, like this:\n\n\
    ```\numount -v $LFS/usr\numount -v $LFS/home\numount -v $LFS\n```\n\nNow, reboot\
    \ the system with:\n\n```\nshutdown -r now\n```\n\nAssuming the GRUB boot loader\
    \ was set up as outlined earlier, the menu is set to boot LFS 7.1 automatically.\n\
    When the reboot is complete, the LFS system is ready for use and more software\
    \ de added to suit your needs.\n\n# # 9.4. What Now?\n\nThank you for reading\
    \ this LFS book. We hope that you have found this book helpful and have learned\
    \ more about the system creation process.\nNow that the LFS system is installed,\
    \ you may be wondering “What next?” To answer that question, we have compiled\
    \ a list of resources for you.\n\n+   * Maintenance\nBugs and security notices\
    \ are reported regularly for all software. Since an LFS system is compiled from\
    \ source, it is up to you to keep abreast of such reports. There are several online\
    \ resources that track reports, some of which are shown below:\n  * Freshmeat.net\
    \ (http://freshmeat.net/)\nFreshmeat can notify you (via email) of new versions\
    \ of packages installed on your system.\n  * CERT (Computer Emergency Response\
    \ Team)\nCERT has a mailing list that publishes security alerts concerning various\
    \ operating systems and applications. Subscription information is available at\
    \ http://www.us-cert.gov/cas/signup.html.\n* Bugtraq\nBugtraj is a full-disclosure\
    \ computer security mailing list. It publishes newly discovered security issues,\
    \ and occasionally potential fixes for them. Subscription information is available\
    \ at http://www.securityfocus.com/archive.\n* Beyond Linux From Scratch\nThe Linux\
    \ From Scratch book covers installation procedures for a wide range of software\
    \ beyond the scope of the LFS Book. The BLFS project is located at http://www.linuxfromscratch.org/blfs/\n\
    * LFS Hints\nThe LFS Hints are a collection of educational documents submitted\
    \ by volunteers in the LFS community. The hints are available at http://www.linuxfromscratch.org/hints/list.html.\n\
    * Mailing lists\nThere are several LFS mailing lists you may subscribe to if you\
    \ are in need of help, want to stay current with the latest developments, want\
    \ to contribute to the project, and more. See Chapter 1 - Mailing Lists for more\
    \ information.\n\n226"
