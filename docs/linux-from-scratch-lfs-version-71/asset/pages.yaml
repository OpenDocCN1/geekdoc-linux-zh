    # # Chapter 5. Constructing a Temporary System


    # ## 5.1. Introduction


    This chapter shows how to build a minimal Linux system. This system will contain
    enough tools to start constructing the final LFS system in Chapter 6 and allow
    a working environment with more user convenience than a minimum environment would.


    There are two steps in building this minimal system. The first step is to build
    a new and host-independent toolchain (compiler, assembler, linker, libraries,
    and a few useful utilities). The second step-uses this toolchain to build the
    other essential tools.


    The files compiled in this chapter will be installed under the `$LFS/tools` directory
    to keep them separate from the files installed in the next chapter and the host
    production directories. Since the packages compiled here are temporary, we do
    not want to pollute the soon-to-be LFS system.


    # ## 5.2. Technical Notes


    This section explains some of the rationale and technical details behind the overall
    build method. It is not essential to immediately understand everything in this
    section. Most of this information will be clearer after performing the actual
    build. This section can be referred to


    The overall goal of Chapter 5 is to produce a temporary area that contains a known-good
    set of tools that can be isolated from the host system. By using **root**, the
    commands in the remaining chapters will be within that environment, ensuring a
    clean, trouble-free build of the target LFS system. The build process has been
    designed to minimize the risks for new readers and to provide the most educational
    value at the time.


    > **Important** Before continuing, be aware of the name of the working platform,
    often referred to as the target triplet. A simple way to determine the name of
    the target triplet is to run the `config.guess` script that comes with the source
    for many packages. Unpack the Binutils and run: `./config.guess`. For example,
    for a modern 32-bit Intel processor the output will be `i686-pc-linux-gnu`.

    Also be aware of the name of the platform''s dynamic linker, often referred to
    as the dynamic linker (not to be confused with the static linker `ld` that is
    part of Binutils). The dynamic linker provided by Glibc loads and the shared libraries
    needed by a program, prepares the program to run, and then runs it. The name of
    the dynamic linker for a 32-bit Intel machine will be `ld-linux.so.2`. A sure-fire
    way to determine the name of the dynamic linker is to inspect a random binary
    from the host system by running: `readelf -1 <name of binary> | grep interpreter`
    and noting the output. The authoritative reference covering all platforms is in
    the `shlib-versions` file in the root of the source code.


    Some key points of how the Chapter 5 build method works:


    +   - Slightly adjusting the name of the working platform, by changing the "vendor"
    field target triplet by the LFS_TGT, ensures that the first build of Binutils
    and GCC produces a compatible cross-linker and cross-compiler. Instead of producing
    binaries for another architecture, the cross-linker and cross-compiler will produce
    binaries compatible with the current hardware.


