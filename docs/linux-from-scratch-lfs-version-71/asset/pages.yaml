  md: '# 6.40. Findutils-4.4.2


    The Findutils package contains programs to find files. These programs are provided
    to recursively search through a directory tree and to create, and search a database
    (often faster than the recursive find, but unreliable if the database has not
    been recently updated).


    Approximate build time: 0.5 SBU

