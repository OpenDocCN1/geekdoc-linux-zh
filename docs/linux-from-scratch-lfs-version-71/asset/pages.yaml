  md: '# 6.10. Re-adjusting the Toolchain


    Now that the C libraries have been installed, it is time to adjust the toolchain
    again. The toolchain will be adjusted so that it will link any newly compiled
    program against these new libraries. This is a similar process used in the "Adjusting"
    phase in the beginning of Chapter 5, with the adjustments reversed. In Chapter
    5, the chain will have guided from the hosts/{usr,lib} libraries to the new /tools/lib
    directory. The chain will be guided from that /tools/lib directory to the /FS/{usr,lib}
    directories.


    First, backup the /tools/bin/ld, and replace it with the adjusted linker. We''ll
    also create a link to its counterpart in /tools/{gcc}/{gcc-dumpmachine}/bin:


    ```

    mv -v /tools/bin/{ld,ld-old}

    mv -v /tools/{gcc}/$(gcc-dumpmachine)/bin/{ld,ld-old}

    ln -s /tools/{gcc}/$(gcc-dumpmachine)/bin/ld /tools/bin/ld

    ```


    Next, add the GCC specs to the gpec file so that it points to the new dynamic
    linker. Simply deleting all instances of "tools" should leave us with the correct
    path to the dynamic linker. Also adjust the specs file so that gcc knows where
    to find headers and binary starts. A sed command accomplishes this:


    ```

