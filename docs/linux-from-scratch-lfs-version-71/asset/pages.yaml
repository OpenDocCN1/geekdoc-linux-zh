  md: '# # Chapter 1. Introduction


    # ## 1.1. How to Build an LFS System


    The LFS system will be built using an already installed Linux distribution (such
    as Debian, Mandriva, Red Hat, or SUSE). This existing Linux system (the host)
    will be used as a starting point to provide necessary programs, including a compiler,
    linker, and shell, to build the new system. Select the “development” option during
    the distribution installation to be able to access these tools.


    As an alternative to installing a separate distribution onto your machine, you
    may wish to use a LiveCD from a commercial distribution.


    Chapter 2 of this book describes how to create a new Linux partition and file
    system. This is the place where the new LFS system will be compiled and installed.
    Chapter 3 explains how packages and patches need to be downloaded to build and
    how to store them on the new file system. Chapter 4 discusses the setup of an
    appropriate working environment. Please read Chapter 4 carefully as it explains
    several important issues you may be aware of before beginning your work through
    Chapter 5 and beyond.


    Chapter 5 explains the installation of a number of packages that form the basic
    development suite (or toolchain) which is used to build the actual system in Chapter
    6. Some of these packages are needed to resolve circular dependencies—for example,
    to compile a compiler, you need a compiler.


    Chapter 5 also shows you how to build a first part of the toolchain, including
    Binutils and GCC (first basically these two packages will be rebuilt). a second
    pass of the toolchain will be built. The next step is to build Glibc, the C library.
    Glibc will be compiled by the toolchain in the first pass, the toolchain will
    be dynamically linked against the newly built Glibc. The remaining 5 packages
    are built using this second pass toolchain. When this is done, the LFS installation
    process will no longer depend on the host distribution, with the exception of
    the running kernel.


    This effort to isolate the new system from the host distribution may seem excessive.
    A full technical explanation as to why this is done is in Section 5.2, “Toolchain
    Technical Notes”.


    In Chapter 6, the full LFS system is built. The **chroot** (change root) program
    is used to enter a virtual environment and start a new shell root directory will
    be set to the LFS partition as the root partition. This is very similar to rebooting
    and installing the kernel to mount the LFS partition without reboot because creating
    a bootable system requires additional work which is not necessary just. The major
    advantage is that “chrooting” allows you to continue using the host system while
    LFS is being built. While waiting for compilations to complete, you can continue
    using the host system as normal.


    To finish the installation, the LFS-Bootscripts are set up in Chapter 7, and the
    kernel and boot loader are set up in Chapter 8. Chapter 9 contains information
    on continuing the LFS experience beyond this book. After the steps in this book
    have been implemented, the computer will be ready to reboot into the LFS system.


    This is the process in a nutshell. Detailed information on each step is discussed
    in the following chapters and package descriptions. Items that may seem complicated
    will be clarified, and everything will fall into place as you embark on the LFS
    adventure.


    # ## 1.2. What new since the last release


    Below is a list of package updates since the previous release of the book.'
