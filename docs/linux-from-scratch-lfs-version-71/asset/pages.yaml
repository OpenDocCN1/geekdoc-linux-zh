  md: '# Linux From Scratch - Version 7.1


    Notice that /tools/bin comes last in the PATH. This means that temporary tool
    will no longer be once

    its final version is installed. This occurs when the shell does not "remember"
    the locations of executed binaries—for example, hashing is switched off by passing
    the +h option to bash.


    Note that the bash prompt will have no name! This is normal because the /etc/passwd
    file has not

    been created yet.


    ![](img/cae12e13b7a17e5c4e4585e940ebdf45_99_0.png)


    # Note


    It is important that all commands throughout the remainder of this chapter and
    the following chapters

    are run from within the root environment. If you leave this environment for any
    reason (rebooting for

    example), ensure that the virtual filesystems are mounted as explained in Section
    6.2.2,"Mounting

    and Populating dev" and Section 6.2.3,"Mounting Virtual Kernel File Systems" and
    enter again

    before continuing with the installation.


    # 6.5. Creating Directories


    It is time to create some structure in the LFS system. Create a standard directory
    tree by issuing the following

    commands:


    ```

    mkdir -pv /bin,boot,etc/{opt,sysconfig},home,lib,mnt,opt,run

    mkdir -pv /media/{floppy,cdrom},sbin,srv,var

    install -dv -m 0750 /root

    install -dv -m 1777 /var/tmp

    mmkdir -pv /usr/{local}/bin,include,lib,sbin,src

    mdir -v /usr/{local}/share/{doc,info,locale,man}

    mdir -pv /usr/{local}/share/man/man{1..8}

    for dir in /usr /usr/local; do

    ln -sv share/man,doc,info $dir

    done

    case $(uname -m) in

    x86_64) ln -sv lib /usr/lib64 && ln -sv lib /usr/lib64 ;;

    esac

    mdir -v /var/{log,mail,pool}

    ln -sv /var/run

    ln -sv /run/lock /var/lock

    mdir -pv /var/{cache,lib}/{misc,location},local

    ```


    Directories are, by default, created with permission 755, but this is not desirable
    for all directories. In the

    comm above, two changes are made—to the home directory of user root, and to the
    directories for

    temporary files.


    The first mode change ensures that not anybody can enter the /root directory—the
    same as a normal user would

