  md: '# # Appendix C. Dependencies


    Every package in BFS relies on one or more other packages in order to build and
    install properly. Some packages even participate in circular dependencies, that
    is, the first package depends on the second which in turn depends on the first.
    Because of these dependencies, the order in which packages are built in BFS is
    very important. The purpose of this page is to document the dependencies of each
    package in BFS.


    For each package, we have listed three, and sometimes four, types of dependencies.
    The first list lists what other packages need to be available in order to run
    the test suites. The third list lists what packages, in addition to the first
    list, need to be available in order to compile and install the package in question.
    The dependencies are packages that require this package to be built and installed
    in its final location before they are built and installed. If not built in a certain
    order, this could result in /tools/bin/[binary] being placed inside scripts to
    install the system. This is obviously not desirable.


    The last list contains optional packages that are not addressed in BFS, but could
    be useful to the user. These packages may have additional mandatory or optional
    dependencies of their own. For these, the recommended practice is to install them
    after completion of the BFS book and then go back and rebuild the BFS package.
    In some cases, reinstallation is advised in BFS.


    # ## Autoconf


    **Installation depends on:** Bash, Coreutils, Grep, M4, Perl, Sed, and Texinfo


    **Test suite depends on:** Automake, Diffutils, Findutils, GCC, and Libtool


    **Must be installed before:** Automake


    **Optional dependencies:** Emacs


    # ## Automake


    **Installation depends on:** Autoconf, Bash, Coreutils, Gettext, Grep, M4, Make,
    Perl, Sed, and Texinfo


    **Test suite depends on:** Binutils, Bison, Bzip2, DejaGNU, Diffutils, Findutils,
    Expect, Flex, GCC, Gettext, Gzip, Libtool, and Tar.


    **Must be installed before:** None


    **Optional dependencies:** None


    # ## Bash


    **Installation depends on:** Bash, Binutils, Coreutils, Diffutils, File, Gawk,
    GCC, Glib, Grep, Make, Neurses, Patch, Readline, Sed, and Texinfo


    **Test suite depends on:** None


    **Must be installed before:** None


    **Optional dependencies:** Xorg


