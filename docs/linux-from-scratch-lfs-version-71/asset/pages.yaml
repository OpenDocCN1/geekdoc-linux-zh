  md: '# 6.47. IPRoute2-3.2.0


    The IPRoute2 package contains programs for basic and advanced IPV4-based networking.

    Approximate build time: 0.1 SBU

    Required disk space: 6.6 MB


    # 6.47.1. Installation of IPRoute2


    The arpd binary included in this package is dependent on Berkeley DB. Because
    arpd is not a common requirement on a Linux system, remove the dependency on Berkeley
    DB by applying the commands below. If the arpd binary can be found in the BLFS
    Book at http://www.linuxfromscratch.org/lfs/view/server/databases.html#db.


    ```

    sed -i ''/TARGETS/s@arp@arpd@'' misc/Makefile

    sed -i /ARPD/d Makefile

    rm man/man8/arpd.8

    ```


    Remove references to Libnl headers that are not required by IPRoute2:


    ```

    sed -i -e ''/netlink\/d'' ip/ipl2tp.c

    ```


    Compile the package:


    ```

    make DESTDIR=

    ```


    The meaning of the option:


    DESTDIR=

    ures that the IPRoute2 binaries will install into the correct directory. By default,
    DESTDIR is set to /usr.


    This package comes with a test suite, but due to assumptions it makes, it is not
    possible to reliably run these tests within the chroot environment. If you wish
    to run these tests after booting into your LFS system, ensure you select /proc/config.gz
    CONFIG IFCONFIG PROC ("General setup") -> "Enable access to config through /proc/config.gz"
    support your kernel then run `make all` from the testsuite/ subdirectory.


    Install the package:


    ```

    make DESTDIR=/usr/share/man /

    DOCDIR=/usr/share/doc/iproute2-3.2.0 install

    ```


    # 6.47.2. Contents of IPRoute2


    +   - Installed programs:

    ctstat (link to Instat), genl, ifconfig, ifstat, ip, Instat, ntable, route, routel,
    rtatcet, rtmon, rtpr

