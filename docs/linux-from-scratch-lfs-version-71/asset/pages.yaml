  md: '# 6.57. Sysvinit-2.88dsf


    The Sysvinit package contains programs for controlling the startup, running, and
    shutdown of the system.

    Approximate build time: less than 0.1 SBU

    Required disk space: 1 MB


    # 6.57.1. Installation of Sysvinit


    When run-levels are changed (for example, halting the system), init sends termination
    signals to those processes that init itself started and should not be running
    in the new run-level. While doing this, init outputs messages like "Sending processes
    the TERM signal" which seem to imply that it is sending these signals to all currently
    running processes. To avoid this misinterpretation, modify the source so that
    these messages read like "Sending processes configured via /etc/initab the TERM
    signal"


    ```

    sed -i ''ssending processes@ configured via /etc/initab@g''

    src/init.c

    ```


    Maintained versions of the wall and mountpoint programs were installed carlier
    by Util-linux. Suppress the installation of Sysvinit''s versions of programs and
    their man pages:


    ```

    sed -i -e ''s/utmpdump wall/utmpdump/''

    -e ''/mountpoint/d''

    -e ''s/mountpoint.l wall//'' src/Makefile

    ```


    Compile the package:


    ```

    make -C src

    ```


    This package does not come with a test suite.


    Install the package:


    ```

    make -C src install

    ```


    # 6.57.2. Contents of Sysvinit


    +   **Installed programs:** bootlogd, fstab-decode, halt, init, killall5, last,
    lastb (link to init), mesg, pidof (link to killall5), poweroff (link to halt),
    reboot (link to halt), runlevel, shutdown, sulogin, tlemit (link to init), and
    utmpdump


    # Short Descriptions


    +   **bootlogd** Log messages to a log file

    **fstab-decode** Run a command with fstab-encoded arguments

    **halt** Normally invokes shutdown with the -h option, except when already in
    run-level 0, then it tells the kernel to halt the system; it informs the file
    /var/log/what the system is being brought down

    **init** The first process to be started when the kernel has initialized the hardware
    which takes over the boot process and starts all the processes it is instructed
    to

    **killall5** Sends a signal to all processes, except the processes in its own
    session so it will not kill the shell running the script that called it'
