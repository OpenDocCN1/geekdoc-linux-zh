  md: '# Linux From Scratch - Version 7.1


    For information on the different lists, how to subscribe, archive locations, and
    additional information, visit http://www.linuxfromscratch.org/mail.html.


    # 1.4.3. IRC


    Several members of the LFS community offer assistance on our community Internet
    Relay Chat (IRC) network. Before using this support, please make sure your question
    is not already answered in the LFS FAQ or the mailing list archives. You can find
    the IRC network at irc.linuxfromscratch.org. The support channel is named #LFS-support.


    # 1.4.4. Mirror Sites


    The LFS project has a number of world-wide mirrors to make accessing the website
    and downloading the required packages more convenient. Please visit the LFS website
    at http://www.linuxfromscratch.org/mirrors.html for a list of current mirrors.


    # 1.4.5. Contact Information


    Please direct all your questions and comments to one of the LFS mailing lists
    (see above).


    # 1.5. Help


    If an issue or question is encountered while working through this book, please
    check the FAQ page at http://www.linuxfromscratch.org/faq/#generalfaq. Questions
    are often already answered. If your question is not answered on this page, try
    to find the source of the problem. The following hint will give you some guidance
    for troubleshooting: http://www.linuxfromscratch.org/hints/downloads/files/errors.txt.


    If you cannot find your problem listed in the FAQ, search the mailing lists at
    http://www.linuxfromscratch.org/search. See the Section 1.4, "Resources" section
    of this book). However we get several support questions every day and many of
    them can be easily answered by going to the FAQ and searching the mailing lists.
    So for us to provide the best assistance, you need to do some research on your
    own. That allows us to focus on the more unusual support needs. If your searches
    do not produce a solution, please include all relevant information (mentioned
    below) in your request for help.


    # 1.5.1. Things to Mention


    Apart from a brief explanation of the problem being experienced, the essential
    things to include in any request for help are:


    +   - The version of the book being used (in this case 7.1)

    - The host distribution and version being used to create LFS

    - The output from the Section vii, "Host System Requirements" [english]

    - The package or section the problem was encountered in

    - The exact error message or symptom being received

    - Note whether you have deviated from the book at all'
