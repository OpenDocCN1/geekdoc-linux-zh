  md: '# 6.5.1. FHS Compliance Note


    The directory tree is based on the Filesystem Hierarchy Standard (FHS) (available
    at http://www.pathname.com/fhs/). In addition to the FHS, we create compatibility
    symlinks for the man, doc, and info directories since packages still try to install
    their undoubtedly into /usr/<directory> or /usr/local/<directory> as opposed to
    /usr/share/<directory> or /usr/local/share/<directory>. The FHS stipulates the
    existence of /usr/local/games and /usr/share/games. The FHS is not precise as
    the structure of the /usr/local/share subdirectory, so we create the directories
    that are needed. However, feel free to create these directories if you prefer
    to conform strictly to the FHS.


    # 6.6. Creating Essential Files and Symlinks


    Some programs use hard-wired paths to programs that do not exist. Yet to satisfy
    these programs, create a number of symbolic links which will be replaced by real
    files throughout the chapter after the software has been installed:


    ```

    ln -sv /tools/bin/{bash,cat,echo,pdw,stty} /bin

    ln -sv /tools/bin/perl /usr/bin

    ln -sv /tools/lib/libgcc s.so,.1} /usr/lib

    ln -sv /tools/lib/libstdcc++.so,.6} /usr/lib

    sed ''s:/tools/usr://tools/lib/libstdcc++.la'' /usr/lib/libstdcc++.la

    ln -sv /bash /bin/sh

    ```


    A proper Linux system maintains a list of the mounted file systems in the /etc/mtab.
    Normally, this file will be created when we mount a new file system. Since we
    will not be mounting any file systems inside our crowd environment, create an
    empty file for utilities that expect the presence of /etc/mtab:


    ```

    touch /etc/mtab

    ```


    In order for user root to be able to login and for the name "root" to be recognized,
    there must be relevant entries in the /etc/passwd and /etc/group files.


    Create the /etc/passwd file by running the following command:


    ```

    cat /etc/passwd << "EOF"

    root:x:0:0:root:/bin/bash

    bin:x:1:1:/dev/null:false

    nobody:x:99:99:Unprivileged User:/dev/null/false

    EOF

    ```


    The actual password for root (the "x" used here is just a placeholder) will be
    set later.'
