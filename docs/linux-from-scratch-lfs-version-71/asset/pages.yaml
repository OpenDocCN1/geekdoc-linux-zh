  md: 'Create the /etc/group file by running the following command:


    ```

    cat > /etc/group <<EOF

    root:x:0:

    bin:x:0:

    sys:x:2:

    kmem:x:3:

    tty:x:4:

    tape:x:5:

    demon:x:6:

    floppy:x:7:

    disk:x:8:

    lpl:x:9

    dialout:x:10

    audio:x:11

    video:x:12

    tmpmp:x:13

    usb:x:14

    cdrom:x:15

    mail:x:34

    nogroup:x:99

    EOF

    ```


    The created groups are not part of any standard—they are groups decided on in
    by the requirements of the Udev configuration in this chapter, and in part by
    common convention employed by a number of existing Linux distributions. The Linux
    Standard Base (LSB), available at http://www.linuxbase.org recommends only that,
    group root with a Group ID (GID) of 0, a group with a GID of 1 be present. All
    other group names and GIDs can be chosen by the system administrator since well-written
    programs do not depend on GID numbers, but rather use the group''s name.


    To remove the "have no name!" start a new shell. Since a full Glibc was installed
    in Chapter 5 and the /etc/passwd and /etc/group files have been created, user
    and group name resolution will work now:


    ```

    exec /tools/bin/bash --login +h

    ```


    Note the use of the +h directive. This bash tells not to use its internal path
    hashing. Without this, bash would remember the paths to binaries it executes.
    To ensure the use of newly compiled binaries as soon as they are installed, bash
    be used for the duration of this session.

    The login, getty, and init programs (and others) use a number of log files to
    record information as who was logged into the system and when. However, these
    programs will not write to the log files if they do not already exist. Initialize
    the log files and give them proper permissions:


    ```

    touch /var/run/utmp /var/log/btmp,lastlog,wtmp

    chgrp -v utmp /var/run/utmp /var/log/lastlog

    chmod -v 664 /var/run/utmp /var/log/lastlog

    chmod -v 600 /var/log/btmp

    ```


    The /var/run/utmp file records the users that are currently logged in. The /var/log/wtmp
    file records all logins and logouts. The /var/log/lastlog file records when each
    user logged in. The /var/log/btmp file records the bad login attempts.'
