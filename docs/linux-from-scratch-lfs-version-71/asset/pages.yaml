  md: '# 8.3. Linux-3.2.6


    The Linux package contains the Linux kernel.

    Approximate build time: 1.0 - 5.0 SBU

    Required disk space: 540 - 800 MB


    # 8.3.1. Installation of the kernel


    Building the kernel involves a few steps—configuration, compilation, and installation.
    Read the README file in the kernel source tree for alternative methods to the
    way this block configures the kernel:


    Prepare for compilation by running the following command:


    ```

    make mrproper

    ```


    This ensures the kernel tree is absolutely clean. The kernel team recommends this
    command be used prior to each kernel compilation. Do not rely on the source tree
    being clean after un-tarring.


    Configure the kernel via a menu-driven interface. For general information on kernel
    configuration see http://www.linuxfromscratch.org/hints/downloads/files/kernel-configuration.txt.
    BLFS has some information regarding particular kernel requirements of packages
    outside of LFS at http://www.linuxfromscratch.org/blfs/view/longindex.html#kernel-index.


    > Note

    Due to recent changes in udev, be sure to select:

    Device Drivers -->

    Generic Driver Options -->

    Maintain a devmpfs filesystem to mount at /dev


    ```

    make LANG=<host LANG_value> LC_ALL=menuconfig

    ```


    The meaning of the make parameters:


    ```

    LANG=<host_LANG> LC_ALL=

    ```


    This establishes the locale to the one used on the host. This is needed for a
    proper menuconfig interface line drawing in UTF-8 Linux console.

    Be sure to replace <host_LANG> by the value of the $LANG variable from your host.
    If you not set it, you could use the host''s value of $LC_ALL or $LC_CTYPE.


    Alternatively, make oldconfig may be more appropriate in some situations. See
    the README file for more information.


    If desired, skip kernel configuration by copying the kernel config file, .config,
    from the host system (assuming it is available) to the unpacked linux-3.2.6 directory.
    However, we do not recommend this option. It is better to explore all configuration
    menus and create the kernel configuration from scratch.


    Compile the kernel image and modules:


    ```

    make

    ```'
