    +   - chfn Used to change a user''s full name and other information


    +   - chpgpasswd Used to update group passwords in batch mode


    +   - chpasswd Used to update user passwords in batch mode


    +   - chsh Used to change a user''s default login shell


    +   - expiry Checks and enforces the current password expiration policy


    +   - faillog Is used to examine the log of login failures, to set a maximum number
    of failures before an account is blocked, or to reset the failure count


    +   - gpasswd Is used to add and delete members and administrators to groups


    +   - groupadd Creates a group with the given name


    +   - groupdel Deletes the group with the given name


    +   - groupperms Allows a user to administer his/her group membership list without
    the requirement of super user privileges.


    +   - groupmod Is used to modify the group name or GID


    +   - grpck Verifies the integrity of the group file /etc/group and /etc/gshadow


    +   - grpconv Creates or updates the shadow group file from the normal group file


    +   - grpunconv Updates /etc/group from /etc/gshadow and deletes the latter


    +   - lastlog Reports the most recent login of all users or of a given user


    +   - login Is used by the system to let users login on time and periods


