  md: '# Linux From Scratch - Version 7.1


    In this example, this means that in snd-fm801, the obsolete (and unwanted) forte
    driver will be loaded if it is available. See below for ways in which the loading
    of unwanted drivers can be prevented.


    The kernel is also able to load modules for network protocols, filesystems and
