  md: '# 6.49. Kmod-5


    The Kmod package contains libraries and utilities for loading kernel modules


    Approximate build time: less than 0.1 SBU

    Required disk space: 16.0 MB


    # 6.49.1. Installation of Kmod


    Prepare Kmod for compilation:


    ```

    liblzma CFLAGS="-I/usr/include" \

    llzma LIBS="-L/lib -lzma" \

    zlib CFLAGS="-I/usr/include" \

    zlib LIBS="-L/lib -lz" \

    ./configure --prefix=/usr --bindir=/bin --libdir=/lib --sysconfdir=/etc \

    with-xz --with-zlib

    ```


    The meaning of the configure options:

    lib* and --with-z*


    These options enable Kmod to load compressed kernel modules. The shell variables
    are required in order for the xz and zlib headers and libraries to be found in
    the absence of pkg-config.


    Compile the package:


    ```

    make

    ```


    To test the results, issue:


    ```

    make check

    ```


    Install the package, and create symlinks for compatibility with Module-Linit-Tools,
    the package that previously handled Linux kernel modules:


    ```

    make pkgconfigdir=/usr/lib/pkgconfig install

    for target in dep ../bin/kmod insmod modinfo modprobe rmmod; do

    ln -sv $target /sbin/$target

    done

    ln -sv kmod /bin/lsmod

    ```


