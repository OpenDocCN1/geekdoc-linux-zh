    ```


    Install the documentation for the Linux kernel:


    ```

    install -d /usr/share/doc/linux-3.2.6

    cp -r Documentation/* /usr/share/doc/linux-3.2.6

    ```


    It is important to note that the files in the kernel source directory are not
    owned by root. Whenever a package is unpacked as user root (like did inside chroot),
    the files have the user and group IDs of whatever they were on the packer''s computer.
    This is usually not problem for any other package to be installed the source tree
    is removed after the installation. However, the Linux source tree is retained
    for a long time. Because of this, there is a chance that whatever user ID the
    packer used will be assigned to somebody on the machine. That person would then
    have write access to the kernel source.


    If the kernel source tree is to be retained, chown -R 0:0 on the linux-3.2.6 directory
    to ensure all files are owned by user root.


