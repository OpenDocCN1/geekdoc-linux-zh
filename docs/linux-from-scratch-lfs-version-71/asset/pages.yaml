  md: '# 8.4. Using GRUB to Set Up the Boot Process


    # 8.4.1. Introduction


    > > Warning


    Configuring GRUB incorrectly can render your system inoperable without an alternate
    boot device such as a CD-ROM. This section is not required to boot your LFS system.
    You may just want to modify your current boot loader, e.g. GRUB-Legacy, GRUB2,
    or LILO.


    Ensure that an emergency boot is ready to "rescue" the computer if the computer
    becomes unusable (un-bootable). If you do not already have a boot device, you
    can create one. In order for the procedure below to work, you need to jump ahead
    to BLFS and install xriso.


    ```

    cd /tmp &&

    grub-mkrescue --output=grub-img.iso &&

    xorriso -as cdrecord -v dev=/dev/cdrw blank=as needed grub-img.iso

    ```


    # 8.4.2. GRUB Naming Conventions


    GRUB uses its naming structure for devices and partitions in the form (hdn,m),
    where n is the hard drive number and m is the partition number. Hard drive number
    starts from zero, but the partition number starts from one for normal partitions
    and five for extended partitions. Note that this is different from earlier versions
    where both numbers started from zero. For example, partition da1 is (hd0,1) and
    sdb3 is (hd1,3). In contrast, GRUB does not consider CD-ROM devices to be hard
    drives. For example, using a CD on hd0 and a second hard drive on hdc, the second
    hard drive would still be (hd1).


    You can determine what GRUB thinks your disk devices are by running:


    ```

    grub-mkdevemap --device-map=device.map

    cat device.map

    ```


    # 8.4.3. Setting Up the Configuration


    GRUB works by writing data to the first physical track of the hard disk. This
    area is not part of any file system. The programs access GRUB modules in the boot
    partition. The default location is /boot/.


    The location of the boot partition is a choice of the user that affects the configuration.
    One recommendation is to have a separate small (suggested size 100 MB) partition
    for boot information. That way each build, whether LFS or some commercial distro,
    can access the same boot files and can be made from any booted system. If (the
    linux kernel you built in the previous version) to the new partition. You will
    then need to mount the separate partition, move all files in the current /boot/
    directory to the partition and remount it as /boot. If you do this, remember to
    update /etc/fstab.


    Using the LFS partition will also work, but configuration for multiple systems
    is more difficult.

    Using the above information, determine the appropriate descriptor for the root
    partition (or boot partition, if a separate one is uscd). For the following example,
