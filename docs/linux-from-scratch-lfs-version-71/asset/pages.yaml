  md: "# Linux From Scratch - Version 7.1\n\nWith each and modular network drivers,\
    \ the interface numbering is not persistent across reboots by default, because\
    \ the drivers are loaded in parallel and, in random order. For example, on a computer\
    \ with two network cards made by Intel and Realtek, network card manufactured\
    \ by Intel may become eth0 and the Realtek card becomes eth1. In some cases, after\
    \ a reboot the cards get the other way around. To avoid this, udev comes with\
    \ a script and some rules to assign names to network cards based on their MAC\
    \ address.\n\nPre-generate the rules to ensure the same names are assigned to\
    \ the devices at every boot, including the first:\n\n```\nfor NIC in /sys/class/net/*;\
    \ do\n  INTERFACE=${NIC##*/} udevadm test --add $NIC\ndone\n```\n\nNow, inspect\
    \ the /etc/udev/rules.d/70-persistent-net.rules file to find out which name was\
    \ assigned to which device:\n\n```\ncat /etc/udev/rules.d/70-persistent-net.rules\n\
    ```\n\nThe file begins with a comment followed by two lines for each NIC. The\
    \ first line for each NIC is a comment describing its hardware IDs (e.g. its PCI\
    \ vendor and device IDs, if a PCI card), along with its driver in parentheses,\
    \ if the driver can be found. Neither the hardware nor the driver is used to determine\
    \ which name to an interface; this information is only for reference. The second\
    \ line is the Udev rule that matches this NIC and actually assigns a name.\n\n\
    All Udev rules are made up of several keys, separated by commas and whitespace.\
    \ The rules and an explanation of them are as follows:\n\n+   * SUBSYSTEM==\"\
    net\" - This tells Udev to ignore devices that are not network cards.\n* ACTION=\"\
    add\" - This tells Udev to ignore this for an event that isn't add (\"remove\"\
    \ and \"change\" events also happen, but don't need to remove network interfaces).\n\
    * DRIVERS==\"?\" - This exists so that Udev will ignore VLAN or bridge sub-interfaces\
    \ (because these sub-interfaces do not have drivers). These sub-interfaces  sub-interfaces\
    \ are skipped because the name that would be assigned collides with parent devices.\n\
    * ATTR{address} - The value of this key is the NIC's MAC address.\n* ATTR{type)==\"\
    1\" - This ensures only matches the primary interface in the case of certain wireless\
    \ drivers, which create multiple virtual interfaces. The secondary interfaces\
    \ are skipped for the reason that VLAN and bridge sub-interfaces would be a name\
    \ collision.\n* KERNEL==\"eth*\" - This key is added to the Udev rule generator\
    \ to handle machines with multiple network interfaces, all with the same MAC address\
    \ (the PS3 is one machine). If the independent interfaces have different basenames,\
    \ this key will allow udev to tell them apart. This is generally not necessary\
    \ for most Linux From Scratch users, but does not hurt.\n* NAME - The value of\
    \ this key is the name udev has assigned to each of your network cards before\
    \ proceeding, and be sure to use that NAME value when creating your configuration\
    \ files below.\n\n# 7.2.2. Creating Network Interface Configuration Files\n\n\
    Which interfaces are brought up and down by the network script depends on the\
    \ files in /etc/sysconfig/. This directory should contain a file for each interface\
    \ to be configured, such ifconfig.xyz, where \"xyz\" is meaningful to the administrator\
    \ as the device name (e.g. eth0). Inside this file are attributes to this interface,\
    \ such as its IP address(es), subnet masks, and so. It is necessary that the name\
    \ of the filename be ifconfig."
  merge: -1
  pgno: 214
- img_proc: true
  md: 'The following command creates a sample file for the eth0 device with a static
    IP address:


    ```

    cd /etc/sysconfig/

    cat > ifconfig.eth0 << "EOF"

    ONBOOT=yes

    IFACE=eth0

    SERVICE=ipv4-static

    IP=192.168.1.1

    GATEWAY=192.168.1.2

    PREFIX=24

    BROADCAST=192.168.1.255

    EOF

    ```


    The values of these variables must be changed in every file to match the proper
    setup.


    If the ONBOOT variable is set to "yes" the network script will bring up the Network
    Interface Card (NIC) during booting of the system. If anything "no" the NIC will
    be ignored by the network and not automatically brought up. The interface can
    be manually started or stopped using the ifup and ifdown commands.


    The IFACE variable defines the interface name, for eth0. It is required for all
    network device configuration files.


    The SERVICE variable defines the method for obtaining the IP address. LFS-Bootscripts
    package has a modular IP assignment format, and creating files in the /lib/services/
    directory allows other IP assignment methods. This is commonly used for Dynamic
    Host Configuration Protocol (DHCP), which is addressed in the BLFS books.


    The GATEWAY variable should contain the default gateway IP address, if one is
    present. If not, comment out the line.


    The PREFIX variable needs to contain the number of bits in the subnet. Each octet
    in an IP address is 8 bits. If the subnet''s mask is 255.255.255.240, then it
    is using the first three octets (24 bits) to specify the network number. Prefixes
    longer than 24 bits are commonly used by DSL and cable-based Internet Service
    Providers (ISPs). In this example (PREFIX=24), the netmask is 255.255.255.250.
    Adjust the PREFIX variable according to your specific subnet.


    # 7.2.3 Creating the /etc/resolv.conf file


    If the system is going to be connected to the Internet, it will need some means
    of Domain Name Service (DNS) to resolve domain names to IP addresses, and vice
    versa. This is best achieved by placing the IP address of the server, available
    from the ISP or network administrator, /etc/resolv.conf. Create the file by running
    the following:


    ```

    cat > /etc/resolv.conf << "EOF"

    # /etc/resolv.conf


    domain Your Domain Name

    nameserver <IP address of your primary nameserver>

    nameserver <IP address of your secondary nameserver>


    # End /etc/resolv.conf

    ```'
  merge: -1
  pgno: 215
- img_proc: true
  md: '# Linux From Scratch - Version 7.1


    The domain statement can be omitted or replaced with a search statement. See the
    main page for resolv.conf for more details.


    Replace <IP address of the nameserver> with the IP address of the DNS most appropriate
    for the setup. There will often be more than one entry (requirements demand secondary
    servers for fallback capability). If you only need want one DNS server, remove
    the second nameserver line from the file. The IP address may also be a router
    on the local network.


    > Note The Google IPv4 DNS addresses are 8.8.8.8 and 8.8.4.4.


    # 7.3. Customizing the /etc/hosts File


    If a network card is to be configured, decide on the IP address, fully-qualified
    domain name (FQDN), and possible aliases for use in the /etc/hosts file. The syntax
    is:


    IP address myhost.example.org aliases


    Unless the card is to be visible to the Internet (i.e. there is a registered domain
    and a valid block of assigned IP addresses—most users do not have this), make
    that the IP address is in the private IP address range. Valid ranges are:


    | Private Network Address Range | Normal Prefix |

    | 10.0.0.1 - 10.255.255.254 | 8 |

    | 172.x.0.1 - 172.x.255.254 | 16 |

    | 192.168.y.1 - 192.168.y.254 | 24 |


    x can be any number in the range 16-31. y can be any number in the range 0-255.


    A valid private IP address could be 192.168.1.1. A valid FQDN for this IP could
    be lfs.example.org.


    Even if not using a network card, a valid FQDN is still necessary. This is required
    for certain programs to operate correctly.


    Create the /etc/hosts file by running:


    ```

    cat > /etc/hosts << "EOF"

    # Begin /etc/hosts (network card version)

    127.0.0.1 localhost

    <192.168.1.1> <HOSTNAME.example.org> [alias1] [alias2 ...]


    # End /etc/hosts (network card version)

    EOF

    ```


    The <192.168.1.1> and <HOSTNAME.example.org> values need to be changed for specific
    uses or requirements (if assigned an IP address by a network/system administrator
    and the machine will be connected to an existing network). The optional alias
    name(s) can be omitted.'
