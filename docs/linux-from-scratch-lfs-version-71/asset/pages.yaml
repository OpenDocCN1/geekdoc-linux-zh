    files with bzip2 yields a much better compression percentage than with the traditional
    gzip.


    Approximate build time: less than 0.1 SBU

    Required disk space: 6.4 MB


    #  6.19.1. Installation of Bzip2


    Apply a patch that will install the documentation for this package:


    ```

    patch -npi -i ../bzip2-1.0.6-install docs-1.patch

    ```


    The following command ensures installation of symbolic links are:


    ```

    sed -i ''s@/ -s -f $(PREFIX)/bin/@/1@'' Makefile

    ```


    Prepare Bzip2 for compilation:


    ```

    make -f Makefile-libbz2 -so

    make clean

    ```


    The meaning of the make parameter:


    - Makefile-libbz2 -so to be built using a different Makefile, in this case the
    Makefile-libbz2-so file, which creates a dynamic libbz2 .so library and links
    the Bzip2 utilities against it.


    Compile and test the package:


    ```

    make

    ```


    Install the programs:


    ```

    make PREFIX=/usr install

    ```


    Install the bzip2 binary into the /bin directory, make some necessary symbolic
    links, and clean up:


    ```

    cp -v bzip2-shared /bin/bzip2

    cp -av libbz2.so* /lib

    ln -sv ../libbz2.so.1.0 /usr/lib/libbz2.so

    rm -v /usr/bin/[bzip2,bzcat,bzip2]

    ln -sv bzip2 /bin/bzip2

    ln -sv bzip2 /bin/bzcat

    ```


    # # 6.19.2. Contents of Bzip2


    +   - Installed programs: bzip2 (link to bzip2), bzcat (link to bzip2), bzemp
    (link to bzdiff), bzdiff, bzegrep (link to bzgrep), bzgrep (link to bzegrep),
    bzegrep, bzip2, bzip2recover, bless (link to bzgrep), bzmore, and bmore


    +   - Installed libraries: libbz2.a,{so}


    +   - Installed directory: /usr/share/doc/bzip2-1.0.6'
