  md: '# 4.5. About SBUs


    Many people would like to know beforehand approximately how long it takes to compile
    and install each package. Because Linux From Scratch can be built on many different
    systems, it is impossible to provide accurate estimates. The biggest package (Glibc)
    will take approximately 20 minutes on the fastest systems, but could take up to
    three days on slower systems! Instead of predicting actual times, the Standard
    Build Unit (SBU) measure will be used instead.


    The SBU measure works as follows. The first package to be compiled from this book
    is Binutils in Chapter 5. The time it takes to compile this package will be referred
    to as the Standard Build Unit or SBU. All other times will be expressed relative
    to this time.


    For example, a package whose compilation time is 4.5 SBUs. This means that if
    it takes 10 minutes to compile and install the first pass of Binutils, it will
    take approximately 45 minutes to build this example package. Fortunately, most
    builds are shorter than the one for Binutils.


    In general, SBUs are not entirely accurate because they depend on many factors,
    including the host system''s version of GCC. They are provided here to give an
    estimate of how long it will take to install a package, the numbers can vary by
    much as dozens of minutes in some cases.


    To view actual timings for specific machines, we recommend the LinuxFromScratch
    Home Page at http://linuxfromscratch.org/sbu/.


    # Note


    For modern systems with multiple processors (or cores) the compilation time for
    a package can be reduced by performing a "parallel make" by setting an environment
    variable or telling the program how many processors are available. For instance,
    Core2Duo can support two simultaneous processes with:


    ```

    export MAKEFLAGS=''-j 2''

    ```


    or just building:


    ```

    make -j2

    ```


    When multiple processors are used in this way, the SBU units in the book will
    vary even more than they would normally. Analyzing the output of the build process
    will also be more difficult because the lines of different processes will be interleaved.
    If you run into a problem with a build step, revert to a single processor builder
    to properly analyze the error messages.


    # 4.6. About the Test Suites


    Most packages provide a test suite for a newly built package is a good idea because
    it can provide a "sanity check" that everything compiled correctly. A test suite
    that passes its sets of checks usually proves the package is functioning as the
    developer intended. It does not, however, guarantee that the package is totally
    free.


    Some test suites are more important than others. For example, the test suites
    for the core toolchain packages—GCC, Binutils, and Glibc—are of the utmost importance
    due to their central role in a properly functioning system. The test suites for
    GCC and Glibc can take a very long time to complete, especially on slower hardware,
    but are strongly recommended.'
