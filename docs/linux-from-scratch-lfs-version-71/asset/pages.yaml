    # 7.9. Configuring the setclock script


    The setclock script reads the time from the hardware clock, also known as the
    BIOS or the Complementary Metal Oxide Semiconductor (CMOS) clock. If the hardware
    clock is set to UTC, this will convert the hardware clock''s time to the local
    time using the /etc/localtime file (which tells the hwclock program timezone the
    user is in). There is no way to detect whether or not the hardware clock is set
    to UTC, so this needs to be configured manually.


    The setclock is run via udev when the kernel detects the hardware capability out.
    It can also be run manually with the stop parameter to store the system time to
    the CMOS clock.


    If you cannot remember whether or not the hardware clock is set to UTC, find out
    by running the hwclock --localtime --show This will display what the current time
    is according to the hardware clock. If the time matches your watch shows, then
    the clock is set to local time. If the output from hwclock is not local time,
    chances is that you are currently in UTC time. Verify this by adding or subtracting
    the proper amount of hours for the timezone shown by hwclock. For example in MST
    timezone, which is also known as GMT-0700, add seven hours to the local time.


    Change the value of the UTC variable by a value of O (zero) if the hardware clock
    is not set to UTC.


    Create a new file /etc/sysconfig/clock by running the following:


    ```

    cat > /etc/sysconfig/clock << "EOF"

    # Begin /etc/sysconfig/clock

    UTC=1


    # Set this any options you might need to give to hwclock,

    # such as machine hardware clock type for Alphas.

    CLOCKPARAMS=


    # End /etc/sysconfig/clock

    EOF

    ```


    A good hint explaining how to deal with time in TFS is available at http://linuxfromscratch.org/hints/downloads/files/time.txt.
    It explains issues as time zones, UTC, and the TZ environment variable.


    > Note

    The ClockPARAMS and UTC parameters may be alternatively set in the /etc/sysconfig/rc.site
    file.


    # 7.10. Configuring the Linux Console


    This section discusses how to configure the console bootscript that sets up the
    keyboard map, console font and console kernel log level. If non-ASCII characters
    (e.g., the copyright sign, the British pound sign and Euro symbol) will not used
    and the keyboard is a U.S. one, much of this section can be skipped. Without the
    configuration file, (or equivalent settings in rc.site), the console bootscript
    will do nothing.


    208'
  merge: -1
