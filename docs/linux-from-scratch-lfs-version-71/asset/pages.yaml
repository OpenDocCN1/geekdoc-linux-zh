  md: '# Linux From Scratch - Version 7.1


    First, the script can operate in "by-path" mode (used by USB and FireWire devices),
    where the rules depend on the physical path to the CD or DVD device. Second, it
    can operate in "by-id" mode (default for IDE and SCSI devices), where the rules
    depend on identification strings stored in the CD or DVD device itself. The path
    is determined by Udev''s path script, and the identification strings are read
    from the hardware by its ata_id or scsi_id programs, depending on which type of
    device you use.


    There are advantages to each approach; the correct approach to will depend on
    what kind of devices may happen. If you expect the physical path to the device
    (that is, the paths and/or slots it plugs into) to change, for example you may
    be moving the device to a different IDE port or a USB connector, then you should
    use the "by-path" mode. On the other hand, if you expect the device to change,
    for example because it may die, and you replace it with a different device with
    the same capabilities and which plugged into the same connectors, then you should
    use the "by-path" mode.


    If either type of change is possible with your drive, then choose a mode based
    on the type of device you expect to have more often.


    +   Important

    External devices (for example, a USB-connected CD drive) should not use by-path
    persistence, because each time the device is plugged into a new external port,
    its physical path will change. All-connected devices will have this problem if
    you write Udev rules to recognize them by their physical path; the problem is
    not limited to CD and DVD drives.


    If you see values that the Udev scripts will use, then for the appropriate CD-ROM
    device, find the corresponding directory /sys (e.g., this can be /sys/block/hdd)
    and run a command similar to the following:


    ```

    udevadm test /sys/block/hdd

    ```


    Look at the lines containing the output of * id programs. The "by-id" will use
    the ID SERIAL value if it exists and is not empty, otherwise it will use a combination
    of ID_MODEL and ID_REVISION. The "by-path" mode will use the ID_PATH value.


    If the default is not suitable for your situation, the following modification
    can be made to the /lib/udev/rules.75-cd-aliases-generator.rules file, as follows
    (where is one of "by-id" or "by-path\):


    ```

    sed -i e ''s/"write cd rules"/write cd rules mode=\\/'' /lib/udev/rules.75-cd-aliases-generator.rules''

    ```


    That it is not necessary to create the rules or symlinks at this time, because
    you will have-bound the /dev directory into the LFS system, and we assume the
