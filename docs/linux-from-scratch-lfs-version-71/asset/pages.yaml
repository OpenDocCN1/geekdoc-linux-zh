  md: '# 6.9.2. Configuring Glibc


    Then use the localef command to create and install locales not listed in the glibc-2.14.1/localedata/

    SUPPORTED file in the unlikely case you need them.


    The /etc/nswitch.conf file needs to be created because, although Glibc provides
    defaults when this file is

    missing or corrupt, the Glibc defaults do not work well in a networked environment.
    The time zone also needs to

    be configured.


    Create a new file /etc/nswitch.conf by running the following:


    ```

    cat > /etc/nswitch.conf << "EOF"

    # Begin /etc/nswitch.conf


    asswd: files

    group: files

    shadow: files


    hosts: files dns

    networks: files


    protocols: files

    services: files

    ethers: files

    rpc: files


    # End /etc/nswitch.conf

    EOF

    ```


    One way to determine the local time zone, run the following script:


    tzselect


    After answering a few questions about the location, the script will output the
    name of the time zone (e.g., America/Edmonton). There are also other possible
    timezones listed in /usr/share/zoneinfo such as Canada/Eastern or ESTEDT that
    are not identified by the script but can be used.


    Then create the /etc/localtime file by running:


    ```

    cp -v --remove-destination /usr/share/zoneinfo/<xxx> \

    /etc/localtime

    ```


    Replace <xxx> with the name of the time zone selected (e.g., Canada/Eastern).


    The meaning of the cp option:


    ```

    --remove-destination

    This is needed to force removal of the already existing symbolic link. The reason
    for copying the file instead of using a symlink is to cover the situation where
    /usr is on a separate partition. This could be important when

    booted into single user mode.

    ```'
