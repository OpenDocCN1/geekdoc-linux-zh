  md: '# Linux From Scratch - Version 7.1


    When logged on as user lfs, the initial shell is usually a login shell which reads
    the /etc/profile of the host (probably containing some settings and environment
    variables) and then .bash_profile. The exec env -/bash command in the .bash_profile
    replaces the running shell with a new one with a completely empty environment,
    except for the HOME, TERM, and variables. This ensures that no unwanted and potentially
    hazardous environment variables from the host system lead into the build environment.
    The technique used here achieves the goal of a clean environment.


    The new shell of instance is a nonlogin shell, which does not read the /etc/profile
    or .bash_profile. Create the .bashrc file now:


    ```

    cat ~/bashrc << "EOF"

    set +h

    umask 022

    LFS=/mnt/lfs

    LC_ALL=POSIX

    LFS_TGT-$(uname -m)-lfs-linux-gnu

    PATH=$PATH/tools/bin:/bin:/usr/bin

    export LFS LC_ALL LFS_TGT PATH

    EOF

    ```


    The set +h command off bash''s hash function. Hashing is ordinarily a useful feature--bash
    uses a table to remember the full path of executable files to avoid searching
    the PATH again and to find the same executable. However, the new tools should
    be used as soon as they are installed. By switching off the hash function, the
    shell will always search the PATH when a program is to be run. As such, the shell
    will find the newly compiled tools in $LFS/tools as soon as they are available
    without remembering a previous version of the program in a different location.


    Setting the user-file creation (umask 022) ensures that newly created files and
    directories are only writable by their owner, but are readable and executable
    by any (assuming default modes are used by the open (2) system call, new files
    will end up with permission 644 and directories with 755).


    The LC_ALL variable controls the localization of certain programs, making their
    messages follow the conventions of a specified country. If the host system uses
    a version of gl older than 2.2.4, having LC_ALL set to "POSIX" or "C" (during
    this chapter) may cause issues if you exit the chroot and return to. Setting LC_ALL
    to "POSIX" or "C" (the two equivalents) ensures everything that will work as expected
    in the chroot environment.


    The LFS_TGT variable sets a non-default, compatible machine description for building
    our cross compiler and linker when compiling our temporary toolchain. More information
    is contained in Section 5.2, "Toolchain Notes".


    By putting /tools/bin ahead of the standard PATH, all the programs installed in
    Chapter 5 are picked up by the shell immediately after their installation. Combined
    with turning off hash, this limits the old programs used from the host from where
    the same programs are available in the chapter 5 environment.


    Finally, to have the environment properly prepared for building the toolchain,
    use the just-created user profile:


    ```

    source ~/bash_profile

    ```


