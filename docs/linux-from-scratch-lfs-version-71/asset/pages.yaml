  md: '# 6.20. Ncurses package-5.9


    The Ncurses package contains libraries for terminal-independent handling of character
    screens.

    Approximate build time: 0.8 SBU

    Required disk space: 35 MB


    # 6.20.1. Installation of Ncurses


    Prepare Ncurses for compilation:


    ```

    ./configure --prefix=/usr --with-shared --without-debug --enable-wide

    ```


    The meaning of the configure option:

    --enable-wide

    This switch causes wide-character libraries (e.g., libncursesw.so.5.9) to be built
    instead of normal ones (e.g., .so.5). these wide-character libraries are usable
    in both multibyte and traditional 8-bit locales, while normal libraries works
    only in 8-bit locales. Wide-character and normal libraries are source-compatible,
    but not binary-compatible.


    Compile the package:


    ```

    make

    ```


    This package has a test suite, but it can only be run after the package has been
    installed. The tests are in the test/directory. See the README in directory for
    further details.


    Install the package:


    ```

    make install

    ```


    Move the shared libraries to the /lib directory, where they are expected to reside:


    ```

    mv -v ../../usr/lib/libncurses.so.5* /usr/lib/libncurses.so

    ```


    Because the libraries have been moved, one symlink points to a non-existent file.
    Recreate it:


    ```

    ln -sfv /usr/lib/libncursesw.so /usr/lib/libncurses.so

    ```


    Many applications still use the linker as able to find non-wide Ncurses libraries.
    Trick them into linking with wide-character libraries by means of symlinks and
    linker scripts:


    ```

    for lib in ncurses form panel menu; do \

    rm -vf /usr/lib/lib${lib}.so /usr/lib/${lib}.so ; \

    echo "INPUT-${lib}w" >/usr/lib/${lib}.so ; \

    ln -sfv lib${lib}w.a /usr/lib/${lib}.a \

    done

    ln -sfv libncurses++.a /usr/lib/libncurses++.a

    ```


    Finally, make sure all applications that look for -lcurses are still buildable:


    ```

    rm -vf /usr/lib/libncurses.so

    echo "INPUT-ncursw" >/usr/lib/libncurses.so

    ln -sfv libncurses.so /usr/lib/libncurses.so

    ln -sfv libncursesw.a /usr/lib/libncurses.a

    ln -sfv libncurses.a /usr/lib/libncurses.a

    ```'
