  md: '# 7.5.2. Dealing with duplicate devices


    As explained in Section 7.4, "Device and Module Handling on an LFS System", the
    order in which devices with the same function appear in /dev is essentially random.
    E.g., if you have a USB web camera and a TV tuner, timesometimes /dev/video0 refers
    to the camera and /dev/video1 refers to the tuner, and sometimes after a reboot
    the order changes to the opposite one. For all classes of hardware except sound
    cards and network cards, this is fix by creating udev rules for persistent symlinks.
    The case of network cards is covered separately in Section 7.2, "General Network
    Configuration", and sound card configuration can be found in BLFS.


    For each of devices that is likely to have this problem (if the problem doesn''t
    exist in your current Linux distribution), find the corresponding directory under
    /sys/class or /sys/block. For video devices, this may be /sys/class/video4linux/videoX.
    Figure out the attributes that identify the device uniquely (usually, video and
    product IDs and/or serial numbers):


    ```

    udevadm info -a -p /sys/class/video4linux/video0


    cat > /etc/rules.d/83-duplicate_devs.rules << "EOF"


    # Persistent symlinks for webcam and tuner

    KERNEL==="video", ATTRS{idProduct}==="1910", ATTRS{idVendor}==="0d81", \

    SYMLINK+="video", ATTRS{device}==="0x036f", ATTRS{vendor}==="0x109e", \

    SYMLINK="tvtuner"


    EOF

    ```


    The result is that /dev/video0 and /dev/video devices still refer randomly to
    the tuner and the web camera (and should never be used directly), but there are
    symlinks /dev/tvtuner and /dev/webcam that always point to the correct device.'
  merge: -1
