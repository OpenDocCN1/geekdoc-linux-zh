  md: '# Linux-3.2.6 API Headers


    The Linux API Headers (in linux-3.2.6.tar.xz) expose the kernel''s API for use
    by Glibc.


    Approximate build time: 0.1 SBU

    Required disk space: 515 MB


    # 6.7.1. Installation of Linux API Headers


    The kernel needs to expose an Application Programming Interface (API) for the
    system''s C library (Glibc in LFS) to use. This is done by sanitizing various
    C header files that are shipped in the Linux kernel source tarball. Make sure
    there are no stale files and dependencies lying around from previous activity:


    ```

    make mrproper

    ```


    Now test and extract the user-visible kernel headers from the source. They are
    placed in an intermediate local directory and to the needed location removes any
    existing files in the target directory. There are also hidden files used by the
    kernel developers and not removed by LFS that are removed from the intermediate
    directory.


    ```

    make headers check

    make INSTALL HDR_PATH=dest headers install

    find dest/include/* -name .install -o -name .install.cmd \ -delete

    cp -rv dest/include/* /usr/include/

    ```


