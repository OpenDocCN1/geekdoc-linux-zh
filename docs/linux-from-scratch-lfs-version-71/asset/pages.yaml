  md: '# Chapter 2. Preparing a Partition


    # 2.1. Introduction


    In this chapter, the partition which will host the LFS system is prepared. We
    will create the partition itself, create a file system on it, and mount it.


    # 2.2. Creating a New Partition


    Like most operating systems, LFS is usually installed on a dedicated partition.The
    recommended approach to building an LFS system is to use an empty partition or,
    or if you have unpartitioned space, to create one.


    A minimal system requires a partition of around 2 gigabytes (GB). This is enough
    to store all the source tarballs and compile the packages. However, if the LFS
    is intended to be the primary Linux system, additional software will probably
    require additional space. A 10GB partition is a reasonable size to provide for
    growth. The LFS itself will not take up much space. A large portion of this requirement
    is to provide free temporary storage. Compiling packages can require a lot of
    disk space which will be reclaimed after the package is installed.


    Because there is not always Random Access Memory (RAM) available for compilation
    processes, it is good idea to use a small disk partition as swap. This is used
    by the kernel to store some-used data and leave more memory for active processes.
    The swap partition for an LFS system can be the same as the one used for the host,
    in which case it is not necessary to create another.


    Start a partitioning program such as fdisk or fdisk with a command line option
    naming the disk on which the new partition will be created—example /dev/hda for
    the primary Integrated Drive Electronics (IDE) disk. Create a LFS native partition
    and a swap partition, if needed. Please refer to cfdisk(8) or fdisk(8) if you
    do not know how to use the programs.


    > Note

    For experienced users, other partitioning schemes are possible. The new LFS system
    can be on a software RAID array or an LVM volume. However, some of these options
    require an initramfs, which is an advanced topic. These partitioning methodologies
    are not recommended for first LFS users.


    Remember the designation of the new partition (e.g., hda5). This book will refer
    to this LFS partition. Also remember the designation of the swap partition. These
    names will be used later for the /etc/fstab file.


    # 2.2.1. Other Partition Issues


    Requests for advice on system partitioning are often posted on the LFS mailing
    lists. This is a highly subjective topic. The default for distributions is to
    use the entire drive with the exception of one small swap partition. This is not
    optimal for LFS for several reasons. It reduces flexibility, making sharing of
    data across multiple distributions or LFS builds difficult, makes backups more
    time consuming, and can waste space through inefficient allocation of file system
    structures.


    # 2.2.1.1. The Root Partition


    A root LFS partition (not to be confused with the /root directory) of ten gigabytes
    is a good compromise for most systems. It provides enough space to build LFS and
    many of BLFS, but is small enough so that multiple partitions can be created for
    experimentation.'
  merge: -1
  pgno: 31
- img_proc: true
  md: '# 2.2.1.2. The Swap Partition


    Most distributions automatically create a swap partition. Generally the recommended
    size of the swap partition is about twice the size of physical RAM, however this
    is rarely needed. If disk space is limited, hold the swap partition to two gigabytes
    and monitor the amount of disk swapping.


    Swapping is never good. Generally you can tell if a system is swapping by just
    listening to disk activity and observing how the system reacts to commands. The
    first reaction to swapping should be to check for an unreasonable command such
    as trying to edit a five gigabyte file. If swapping becomes a normal occurrence,
    the best solution is to purchase more RAM for your system.


    # 2.2.1.3. Convenience Partitions


    There are other partitions that are not required, but should be considered when
    designing a disk layout. The following list is not comprehensive, but it is meant
    as a guide.


    +   * /boot – Highly recommended. Use this partition to minimize potential boot
    problems with larger disks, make this the first physical partition on your first
    disk drive. A partition size of 100 megabytes is quite adequate.

    * /home – Highly recommended. Share your home directory and user customization
    across multiple distributions the size is generally large and depends on available
    disk space.

    * /usr – A separate /usr partition is generally used if providing a server for
    a thin client or workstation it is normally needed for LFS. A size of five gigabytes
    will handle most installations.

    * /opt – This directory is most useful for BLFS when multiple installations of
    large packages like Gnome or KDE can be installed without embedding the files
    in the /usr hierarchy. If used, ten gigabytes is generally adequate.

    * /tmp – A separate /tmp directory is useful, but if configuring a thin client
    will not need to exceed a couple of gigabytes.

    * /usr/src – This partition is very useful for providing a location to store BLFS
    source files and share them across LFS builds. It can also be used as a location
    for building BLFS packages. A reasonably large partition of 30-50 gigabytes allows
    plenty of room.


    Any separate partition that you will automatically mounted upon boot needs to
    be specified in /etc/fstab. Details how to specify partitions will be discussed
    in Section 8.2, "Creating the /etc/stab File".


    # 2.3. Creating a File System on the Partition


    Now that a blank partition has been set up, the file system can be created. The
    most widely-used system in the Linux world is the second extended file system
    (ext2), but with newer-capacity hard disks, journaling file systems are becoming
    increasingly popular. The third extended filesystem (ext3) is a widely used enhancement
    to ext2, which adds journaling capabilities and is compatible with the E2fsgs
    utilities. We will create an ext3 file system. Instructions for creating other
    file systems can be found at http://www.linuxfromscratch.org/blfs/view/post/filesystems.html.


    To create an ext file system on the partition, run the following:


    ```

    mk2fs -jv /dev/<xxx>

    ```'
