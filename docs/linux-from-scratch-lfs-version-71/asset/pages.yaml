  md: '# 7.6. LFS-Bootscripts-20120229


    The LFS-Bootscripts package contains a set of scripts to start/stop the LFS system
    at bootup/shutdown.


    Approximate build time: less than 0.1 SBU

    Required disk space: 260 KB


    # 7.6.1. Installation of LFS-Bootscripts


    Install the package:


    ```

    make install

    ```


    # 7.6.2. Contents of LFS-Bootscripts


    +   - Installed scripts: checkfs, cleanfs, console, functions, halt, ifdown, ifup,
    localnet, modules, mountfs, mountkernfs, network, rc, reboot, reboots, setclock,
    static, swapt, syscall, syslog, template, udev, and udev_retry

    - Installed directories: /etc/rc,/etc/init.d (symbolic link),/etc/sysconfig,/lib/services,/lib/bs
    (symbolic link)


    # Short Descriptions


    +   - checkfs: Checks the integrity of the file systems before they are mounted
    (with the exception of journaled and network based file systems)

    - cleanfs: Removes files that should not be preserved between reboots, such as
    those in /var/run/ and /var/lock/; it-recreates /var/run/utmp and removes the
    possibly present /etc/login,/fastboot, and /forceck

    - console: Loads the correct keymap table for the desired keyboard layout; it
    also sets the screen font

    - functions: Contains common functions, such as error and status checking, that
    are used by several bootscripts

    - halt: Halts the system

    - ifdown: Stops a network device

    - ifup: Initializes a network device

    - localnet: Sets up the system''s hostname and local loopback device

    - modules: Loads kernel modules listed in /etc/sysconfig/modules, using arguments
    that are also

    - mountfs: Mounts all file systems, except ones that are marked noauto or are
    network based

    - mountkernfs: Mount virtual kernel file systems, such as proc

    - network: Sets up network interfaces, such as network cards, and sets up the
    default gateway (applicable)

    - rc: The master level control script; it is responsible for running all the other
    bootscripts one-by-one, in a sequence determined by the name of the symbolic links
    being processed

    - reboot: Reboots the system

    - sendsignal: Makes sure every process is terminated before the system reboots
    or halts

    - setclock: Resets the kernel clock to local time in case the hardware clock is
    not set to UTC time'
