    \ --enable-locale=gnu \\\n  --enable-shared --enable-threads=posix \\\n  --enable-languages=c,c++\
    \ \\\n  --disable-libstdcxx-pch --disable-multilib \\\n  --disable-bootstrap --disable-libomp\
    \ \\\n  --without-ppl --without-clog \\\n  --with-mpfr-include=$(pwd)/../mpfr/src\
    \ \\\n  --with-mpfr-lib=$(pwd)/mpfr/src/libs\n```\n\n44"
