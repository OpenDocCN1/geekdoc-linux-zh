  md: "# Warning\n\nThe following command will overwrite the current boot loader.\
    \ Do not run the command if this is not desired, for example, if using a third\
    \ party boot manager to manage the Master Boot Record (MBR).\n\n```\ngrub-install\
    \ /dev/sda\n```\n\n# Note\n\ngrub-install is a script and calls another program,\
    \ grub-probe, that may fail with a message \"cannot stat /dev/root\". If so, create\
    \ a temporary symbolic link from your root partition to /dev/root:\n\n```\nln\
    \ -sv /dev/sda2 /dev/root\n```\n\nThe symbolic link will only be present until\
    \ the system is rebooted. The link is only needed for the installation procedure.\n\
    \n# 8.4.4. Creating the Configuration File\n\nGenerate /boot/grub/grub.cfg:\n\n\
    ```\ncat > /boot/grub/grub.cfg << \"EEOF\"\n# Begin /boot/grub/grub.cfg\nset default=0\n\
    set timeout=5\ninsmod ext2\nset root=(hd0,2)\n\nmenuentry \"GNU/Linux, Linux 3.2.6-lfs-7.1\"\
    \ {\n\tlinux /boot/vmlinuz-3.2.6-lfs-7.1 root=/dev/sda2 ro\n}\nEOF\n```\n\n# Note\n\
    \nFrom GRUB's perspective, the kernel files are relative to the partition used.\
    \ If you used a separate /boot partition, remove /boot from the above linux line.\
    \ You will also need to change the set root line to point to the boot partition.\n\
    \nGRUB is an extremely powerful program and it provides a tremendous number of\
    \ options for booting from a wide variety of devices, operating systems, and partition\
    \ types. There are also many options for customization such as graphical splash\
    \ screens, playing sounds, mouse input, etc. The details of these options are\
    \ beyond the scope of this introduction."
  merge: -1
