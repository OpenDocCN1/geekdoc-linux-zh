    # 7.4.2. Handling Hotpluggable/Dynamic Devices


    When you plug in a device, such as a Universal Serial Bus (USB) MP3 player, the
    kernel recognizes the device is now connected and generates a event. This event
    is handled by udev as described above.


    # 7.4.3. Problems with Loading Modules and Creating Devices


    There are a few possible problems when it comes to automatically creating device
    nodes.


    # 7.4.3.1. A kernel module is not loaded automatically


    Udev will only load a module if it has a bus-specific alias and the bus driver
    exports the necessary aliases to sysfs. With Linux-3.2.6, Udev is known to load
    properly-written drivers for INPUT, IDE, PCI, USB, SCSI, SERIO, and FireWire.


    To determine if the device you require has the necessary support for Udev, run
    modinfo with the name as argument. Then locate the device directory under /sys/bus
    and check whether there is a medias file.


    If there is no medias in the relevant directory under /sys/bus, this means the
    kernel developers have not yet added support to this bus type. With Linux-3.2.6,
    this is the case with ISA buses. Expect this issue to be fixed in later kernel
    versions.


    Udev is not intended to load "wrapper" drivers such as snd-pcm-oss and non-hardware
    drivers as loop at all.


    # 7.4.3.2. A kernel module is not loaded automatically, and Udev is not intended
    to load it


    If the "wrapper" module only enhances the functionality provided by some other
    module (e.g., snd-pcm-oss enhances the functionality of snd-pcm by making the
    sound cards available to OSS applications), configure modprobe to load the wrapper
    after udev loads the wrapped module. To do this, add a "softdep" line in /etc/modprobe.conf/<filename>.


    ```

    softdep snd-pcm-conf: snd-pcm-oss

    ```


    Note that the "softdep" command also allows pre dependencies, or a mixture of
    both pre and post; see modprobe.d(s) for more information on "softdep" syntax
    and capabilities.


    If the module in question is not a wrapper and is useful itself, configure the
    modules bootscript to load this module on system boot. To do this, add the module
    name to /etc/sysconfig/modules file on a separate line. This works for modules
    too, but is suboptimal in that case.


    # 7.4.3.3. Udev loads some unwanted module


    Either don''t build the module, or blocklist it in a /etc/modprobe.d/blacklist.conf
    file with the forte module in the example below:


    ```

    blacklist forte

    ```'
