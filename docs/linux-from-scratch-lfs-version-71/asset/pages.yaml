  md: '# 6.62. About Debugging Symbols


    Most programs and libraries are, by default, compiled with debugging symbols included
    (with gcc -g option). This means when debugging a program or library that was
    compiled with debugging information included, the debugger can provide not only
    memory addresses, but also the names of the routines and variables.


    However, the inclusion of these debugging symbols enlarges a program or library
    significantly. The following is an example of the space these symbols occupy:


    +   * A bash binary with debugging symbols: 120 KB

    * A bash binary without debugging symbols: 480 KB

    * Glibc and GCC files (/lib and /usr/lib) with debugging symbols: 87 MB

    * Glibc and GCC files: 16 MB


    Sizes may vary depending on which compiler and C library were used, but when comparing
    programs with without symbols, the difference will be a factor between two and
    five.


    Most users will never use a debugger on their system software, a lot of disk space
    can be reclaimed by removing these symbols. The next section shows how to strip
    debugging symbols from the programs and libraries.


    # 6.63. Stripping Again


    If the user is not a programmer and does not plan to do any debugging on the system
    software, the system size can be decreased by about 90 MB by removing the debugging
    symbols from binaries and libraries. This causes no inconvenience other than not
    being able to debug the software fully.


    Most people who use the command mentioned below will not experience any difficulties.
    However, it is easy to make a typo and render the new system unusable, before
    running the strip command, it is a good idea to make a backup of the LFS system
    in its current state.


    Before performing the stripping, take special care to ensure that none of the
    binaries that are to be stripped are running. If unsure whether the user entered
    with the command given in Section 6.4, "Entering the Chroot Environment," first
    exit from chroot:


    ```

    logout

    root $LFS /tools/bin/env -i \

    HOME=/root TERM=$TERM PS=\u:\w\$ '' \

    PATH=/bin:/usr/bin:/sbin:/usr/sbin \\

    /tools/bin/bash --login

    ```


    Then reenter with:

    Now the binaries and libraries can be safely stripped:


    ```

    /tools/bin/find /{bin,lib,sbin} -type f \

    -exec /tools/bin/strip --strip-debug ''{}'' '';''

    ```


    A large number of files will be reported as having their file format not recognized.
    These warnings indicate that those files are scripts instead of binaries.'
  merge: -1
  pgno: 211
- img_proc: true
  md: '# 6.64. Cleaning Up


    From now on, when reentering the chroot environment after exiting, use the following
    modified chroot command:


    ```

    chroot "$LFS" /usr/bin/env -i \\

    HOME=/root TERM="$TERM" PS1=''\u:\w\$ '' \\

    PATH=/bin:/bin:/usr/bin:/sbin:/usr/sbin \\

    /bin/bash --login

    ```


    The reason for this is that the programs in /tools are no longer needed. Since
    they are no longer needed you can delete the /tools directory if so desired.


    > Note

    Removing /tools will also remove the temporary copies of Tcl, Expect, DejaGNU
    which were used for running the toolchain tests. If you need these programs later
    on, they will need to be recompiled and reinstalled. The BLFS book has instructions
    for this (see http://www.linuxfromscratch.org/bfs/).


    If the virtual kernel file systems have been unmounted, either manually or through
    a reboot, ensure that the virtual kernel file systems are mounted when reentering
    the chroot. This process was explained in Section 6.2.2, "Mounting and Populating
    /dev" and Section 6.2.3, "Mounting Virtual Kernel File Systems".'
