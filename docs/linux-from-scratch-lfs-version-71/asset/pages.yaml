  pgno: 97
- img_proc: true
  md: '# Linux From Scratch - Version 7.1


    This approach is used by the package managers found in the commercial distributions.
    Examples of package managers that follow this approach is RPM (which, incidentally,
    is required by the Linux Standard Base Specification), pkg-utils, Debian''s apt,
    and Gentoo''s Portage system. A hint describing how to adapt this style of package
    management for LFS is located at http://www.linuxfromscratch.org/hints/downloads/files/fakerool.txt.


    Creation of package files that contain dependency information is complex and is
    beyond the scope of LFS. Slack uses a tar based system for package archives. This
    system purposely does not handle package dependencies as more complex package
    managers do. For details of Slack package management, see http://www.slackbook.org/html/package-management.html.


    # 3.6.2. User Based Management


    This scheme, unlike LFS, was devised by Matthiasmann, and is available from the
    Hints Project. In this scheme, each package is installed as a separate unit into
    the standard locations. Files belonging to a package are easily identified by
    the user ID. The features and shortcomings of such approach are too complex to
    describe in this section. For the details see the hint at http://www.linuxfromscratch.org/hints/downloads/more_control_and_pkg_man.txt.


    # 3.6.3. Deploying on Multiple Systems


    The advantages of an LFS system is that there are no files that depend on the
    position of files on a disk system. Cloning an LFS build to another computer with
    an architecture similar to the base system is possible using tar the LFS partition
    that contains the root directory (250MB uncompressed for a LFS build), copying
    via file network or CD-ROM to the new system and expanding it. From that, a few
    configuration files will have to be changed. Configuration files may need to be
    updated: /etc/hosts, /etc/fstab, /etc/passwd, /etc/group, /etc/shadow, /etc/ld.so.conf,
    /etc/scsi_id.config, /etc/sysconfig/network and /etc/sysconfig/network-devices/ifconfig.eth0/ipv4.


    A custom kernel need to be built for the new system depending on differences in
    system hardware and the original kernel configuration.


    Finally the new system has to be bootable via Section 8.4, "Using GRUB to Set
    Up the Boot Process",


    # 6.4. Entering the Chroot Environment


    It is time to enter the chroot environment to begin building and installing the
    final LFS system. As user root, the command to enter the realm is, at the moment,
    populated with the following temporary variables:


    ```

    chroot "$LFS/tools/bin/env -i \

    HOME=/root TERM=\$TERM PS1=u:\w\$ \

    PATH=/usr/bin:/usr/sbin:/bin:/bin \

    /tools/bin/bash -login +h

    ```


    The -i option given to the env will clear all the variables of the chroot environment.
    After that, only the HOME, TERM, PS1, and PATH variables are set. The TERM=$TERM
    construct will set the TERM variable inside to the same value as outside. This
    variable is needed for programs vim and less to operate properly. If other variables
    are needed, such as CFLAGS or CFLAGS, this is a good place to set them all.


    From this point on, there is no need to use the LFS anywhere anymore, because
    all work will be restricted to the LFS file system. This is because the Bash shell
    is that LFS is now the root (/) directory.


    78'
