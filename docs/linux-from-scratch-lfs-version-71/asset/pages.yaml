  md: '# # Chapter 7. Setting Up System Bootscripts


    # ## 7.1 Introduction


    This chapter discusses configuration files and boot scripts. First, the general
    configuration files needed to set up networking are presented.


    +   - Section 7.2, "General Network Configuration"

    - Section 7.3, "Customizing the /etc/hosts File."


    Second, issues that affect the proper setup of devices are discussed.


    +   - Section 7.4, "Device and Module Handling on an CFS System"

    - Section 7.5, "Creating Custom Symlinks to Devices."


    The next sections detail how to install and configure the scripts needed for the
    boot process. Most of these scripts will work without modification, but a few
    require additional configuration files because they deal with hardware-dependent
    information.


    System-V style init scripts are employed in this book because they are widely
    used and relatively simple. For additional options, a hint detailing the BSD style
    setup is available at http://www.linuxfromscratch.org/hints/downloads/bsd-init.txt.
    Searching the FBS mailing lists for "depinit", "upstart", or "systemd" will also
    offer additional information.


    If using an alternative of init scripts, skip these sections.


    A listing of the boot scripts are found in Appendix D.


    +   - Section 7.6, "LFS-Bootscripts-20120229"

    - Section 7.7, "How Do These Bootscripts Work?"

    - Section 7.8, "Configuring the system hostname."

    - Section 7.9, "Configuring the setclock Script."

    - Section 7.10, "Configuring the Linux Console."

    - Section 7.11, "Configuring the syslogd."


    Finally, there is a brief introduction to the scripts and configuration files
    used when the user logs into the system.


    +   - Section 7.13, "The Bash Shell Startup Files."

    - Section 7.14, "Configuring the /etc/inputrc File."


    # ## 7.2 General Network Configuration


    This section only applies if a network card is to be configured.


    If a network card will not be used, there is likely no need to create any configuration
    files relating to network cards. If that is the case, remove the network symlinks
    from all run-level directories (/etc/rc.d/rc*).


    # ### 7.2.1 Creating stable names for network interfaces


    If there is only one network interface in the system to be configured, this section
    is optional, although it will never be wrong to do it. In many cases (a laptop
    with a wireless and a wired interface), accomplishing the configuration in this
    section is necessary.'
