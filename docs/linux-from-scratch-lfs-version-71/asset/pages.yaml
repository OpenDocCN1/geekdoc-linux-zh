- img_proc: true
  md: '# # Chapter 6. Installing Basic System Software


    # ## 6.1. Introduction


    In this chapter, we enter the building site and start constructing the LHS system
    early. That is, we crooth into the temporary mini Linux system, make a few final
    preparations, and then begin installing the packages.


    The installation of this software is straightforward. Although in many cases the
    installation instructions could be shorter and more generic, we have opted to
    provide the full instructions for every package to minimize the possibilities
    for mistakes. The key to learning what makes a Linux system work is to know what
    each package is used for and why (or the system) may need it.


    We do not recommend using optimizations. They can make a program run slightly
    faster, but they may also cause compilation difficulties and problems when running
    the program. If a package fails to compile when using optimization, try to fix
    the problem. Even if the package compiles when using optimization, there is the
    risk it have been compiled incorrectly because of the complex interactions between
    the code and build tools. Also note that the -march and -mtune options values
    not specified in the book have not tested. This may cause problems with the toolchain
    packages (Binutils, GCC and Glibc). The small potential gains achieved in using
    compiler optimizations are often outweighed by the risks. First-time builders
    of LTS are encouraged to build without custom optimizations. The subsequent system
    will still run fast and stable at the same time.


    The order that packages are installed in this chapter must be strictly followed
    to ensure that no program acquires a path referring to `/tools` hard-wired into
    it. For the same reason, do not compile packages in parallel. Compiling in parallel
    may save time (especially on dual-CPU machines), but it could result in a program
    containing a hard-wired path to `/tools`, which will cause the program to stop
    working when directory is removed.


    Before the installation instructions, each installation page provides information
    about the package, including a concise description of what it contains, approximately
    how long it will take to build, and how much disk space is required during this
    building process. Following the installation instructions, there is a list of
    programs and libraries (along with brief descriptions of these) the package installs.


    # ## 6.2. Preparing Virtual Kernel File Systems


    Various file systems exported by the kernel are used to communicate to and the
    kernel itself. These file systems are virtual that no disk space is used for them.
    The content of the file systems resides in memory.


    Begin by creating directories onto which the file systems will be mounted:


    ```

    mkdir -v $LFS/{dev,proc,sys}

    ```'
  merge: -1
  pgno: 94
- img_proc: true
  md: '# 6.2.1. Creating Initial Device Nodes


    When the kernel boots the system, it requires the presence of a few device nodes,
    in particular the console and null devices. The device nodes must be created on
    the hard disk so they are available before udev has started, and additionally
    when Linux starts with init=/bin/bash. The device creates by running the following
    commands:


    ```

    knod -m 600 LFS/dev/console 5 1

    knod -m 666 LFS/dev/null 1 3

    ```


    # 6.2.2. Mounting and Populating /dev


    The recommended method of populating the /dev directory with devices is to mount
    a virtual filesystem (such as tmpfs) on the /dev directory, and allow the devices
    to be created dynamically on virtual filesystem as they are detected or processed
    by Udev. Since this new system does not use Udev and not yet been booted, it is
    necessary to populate /dev manually. This is accomplished by bind mounting the
    host system''s /dev directory. A bind mount is a special type of mount that allows
    you to create a mirror of a device or mount point to some other location. Use
    the following command to achieve this:


    ```

    mount -v --bind /dev $LFS/dev

    ```


    # 6.2.3. Mounting Virtual Kernel Filesystems


    Now mount the virtual kernel filesystems:


    ```

    mount -vt devpts devpts $LFS/dev/pts

    mount -vt tmpfs shm $LFS/dev/shm

    mount -vt proc proc $LFS/proc

    mount -vt sysfs sysfs $LFS/sys

    ```


    # 6.3. Package Management


    Package Management is an often requested addition to the LFS Book. A Package Manager
    allows tracking the installation of files making it easy to upgrade and packages.
    As well as the binary and library files, a package manager will handle the installation
    of configuration files. Before you begin to use, NO—this section will not talk
    about any particular package manager. What is a roundup of the more popular techniques
    and how they work. The perfect package manager for you may be among these techniques
    or may be a combination of two or more of these techniques. This section briefly
    mentions issues that may arise when upgrading packages.


    Some reasons why no package manager is mentioned in LFS or BLFS include:


    +   - Dealing with package management takes the focus away from the goals of these
    books—teaching how a Linux system is built.

    - There are multiple solutions for package management, each having its strengths
    and drawbacks. Including one that satisfies all distributions is difficult.


    There are some hints written on the topic of package management. Visit the Hints
    Project and see if one of them fits your need.'
  merge: -1
  pgno: 95
- img_proc: true
  md: '# ### 6.3.1. Upgrade Issues


    A Package Manager makes it easy to upgrade to newer versions when they are released.
    Generally the instructions in the LFS and BLFS Book can be used to upgrade to
    the newer versions. There are some points that you should be aware when upgrading
    packages, especially on a running system.


    +   - If one of the toolchain Packages (glibc, GCC or Binutils) needs to be upgraded
    to a newer minor version, it is safer to rebuild LFS. Though you may be fast by
    rebuilding all the packages in their dependency order, we do not recommend it.
    For example, if glibc-2.2.x needs to be updated to glibc-2.3.x, it is safer to
    rebuild. For micro version updates, a simple reinstall works, but is not guaranteed.
    For example, upgrading from glibc-2.3.4 to glibc-2.3.5 will not cause any problems.

    - If a package containing a shared library is updated, and if the name of the
    library need to link against a newer version. (Note that there is no correlation
    between a package and the name of the library.) For example, consider a package
    foo-1.2.3 that installs a shared library with libfoo. Say you upgrade the package
    to a newer version foo-1.2.4 that installs a shared library with name libfoo.2.
    In this case, all packages that are dynamically linked to libfoo.1 need to be
    recompiled to link against libfoo.2. Note that you should not remove the previous
    libraries until the dependencies are recompiled.


    # ### 6.3.2. Package Management Techniques


    The following are some common package management techniques. Beforemaking a decision
    on a package manager, do research on the various techniques, particularly the
    drawbacks of the particular scheme.


    # ### 6.3.2.1. It is All in My Head!


    Yes, this is a package management technique. Some folks do not find the need for
    a package manager because they know the packages intimately and know what files
    are installed by each package. Some users do not need any extra package to manage
    the package management because on rebuilding the entire system when a package
    is changed.


    # ### 6.3.2.2. Install in Separate Directories


    This is a simplistic package management that does not extract any package to a
    separate directory. For example, package foo-1.1 is installed in `/usr/pkg/foo-1.1
    and a symlink is made from `/usr/pkg/foo` to `/usr/pkg/foo-1.1. When installing
    a new version foo-1.2, it is installed in `/usr/pkg/foo-1.2 and the previous symlink
    is replaced by a symlink to the new version.


    Environment variables such as PATH, LD_LIBRARY_PATH, MANPATH, INFOPATH and CPPFLAGS
    need to be expanded to include `/usr/pkg/foo`. For more than a few packages, this
    becomes unmanageable.


    # ### 6.3.3. Symlink Style Package Management


    This is a variation of the previous package management technique. Each package
    is installed to the previous scheme. But instead of making the symlink, each file
    is symlinked into the `/usr` hierarchy. This removes the need to expand the environment
    variables. The symlinks can be created by the user to automate the creation, many
    package managers have been written using this approach. A few of the popular ones
    include Stow, Epkg, Graft, and Depot.'
  merge: -1
  pgno: 96
- img_proc: true
  md: '# Linux From Scratch - Version 7.1


    The installation needs to be faked, so the package thinks that it is installed
    in /usr though in reality it is installed in the /usr/pkg hierarchy. Installing
    in this manner is not usually a trivial task. For example, consider that you are
    installing a package libfoo-1.1. The following instructions may not install the
    package:


    ```

    ./configure --prefix=/usr/pkg/libfoo/1.1

    make

    make install

    ```


    The installation will work, but the dependent packages may not link to libfoo
    as you would expect. If you notice that it is linked to /usr/pkg/libfoo/1.1/lib/so
    instead of /usr/libfoo.so.1 as you would expect, the correct approach is to use
    the DESTDIR strategy to fake installation of the package. This approach works
    as follows:


    ```

    /configure --prefix=/usr

    make

    make DESTDIR=/usr/pkg/libfoo/1.1 install

    ```


    Most packages support this approach, but there are some who do. For the non-compliant
    packages, you may either need to manually install the package, or you may find
    that it is easier to install problematic packages into /opt.


    # 6.3.2. Timestamp Based


    In this technique, a file is timestamped before the installation of the package.
    After the installation, a simple use of the find command with the appropriate
    options can generate a log of all the files after the timestamp file was created.
    A package manager with this approach is install-log.


    Though this scheme has the advantage of being simple, it has two drawbacks. If
    during installation, the files are installed with a timestamp other than the current
    time, those files will not be tracked by the package manager. Also, this scheme
    can only be used when one package is installed at a time. The logs are not reliable
    if two packages are being installed on two different consoles.


    # 6.3.2.5. Tracing Installation Scripts


    In this approach, the installation scripts perform are recorded. There are two
    techniques that one can use:


    The LD_PRELOAD environment variable can be set to point to a library to be preloaded
    during installation. Installation, this library tracks the packages that are being
    installed by attaching itself to various executables such as cp, install, and
    tracking every system call that modifies the filesystem. For this approach, all
    the executables must be dynamically linked without the sudo or gid. Preloading
    the library may cause some unintended effects during installation. Therefore,
    it is advised that one performs tests to ensure that the package manager does
    not break anything and logs all the appropriate files.


    The second technique is to use strace, which logs all system calls made during
    the execution of the installation scripts.


    # 6.3.2.6. Creating Package Archives


    In this scheme, the package installation is faked into a separate tree as described
    in the Symlink style package management. After the installation, a package archive
    is created using the installed files. This archive is then used to install the
    package either on the local machine or even be used to install the package on
    other machines.


    77'
