- img_proc: true
  md: 'If using multiple partitions for LFS (e.g., one for / another for /usr), mount
    them using:


    ```

    mkdir -pv $LFS

    mount -v -t ext3 /dev/<xxx> $LFS

    mkdir -v $LFS/usr

    mount -v -t ext3 /dev/<yyy> $LFS/usr

    ```


    Replace <xxx> and <yyy> with the appropriate partition names.


    Ensure that this new partition is not mounted with permissions that are too restrictive
    (such as the nosuid, nodev, or noatime options). Run the mount command without
    any parameters to see what options are set for the mounted LFS partition. If nosuid,
    nodev, or noatime are set, the partition will need to be remounted.


    ```

    /sbin/swapon -v /dev/<zzz>

    ```


    Replace <zzz> with the name of the swap partition.


    Now that there is an established place to work, it is time to download the packages.'
