  md: '# 6.55.2. Configuring Shadow


    This package contains utilities to add, modify, and delete users and groups; set
    and change their passwords; and perform other administrative tasks. For a full
    explanation of what password shadowing, see the doc/HOWTO file within the unpacked
    source tree. If using Shadow support, keep in mind that programs which need to
    verify passwords (display managers, FTP programs, pop3 daemons, etc.) must be
    Shadow-compliant. That is, they need to be able to work with shadowed passwords.


    To enable shadowed passwords, run the following command:


    ```

    pwconv

    ```


    To enable group passwords, run:


    ```

    grpconv

    ```


    Shadow''s stock configuration for the useradd utility has few caveats that need
    some explanation. First, the default action for the useradd is to create the user
    and a group of the same name as the user. By the default the user ID (UID) and
    group ID (GID) will begin with 1000. This means if you do not pass parameters
    to useradd, the user will be a member of a unique group on the system. If this
    behaviour is undesirable, you''ll need to pass the -g parameter to useradd. The
    default parameters are stored in the /etc/default/useradd file. You may need to
    modify two parameters in this file to suit your particulars


    # /etc/default/useradd Parameter Explations


    GROUP=1000

    This parameter sets the beginning of the group numbers used in the /etc/group
    file. You can modify it to anything you desire. Note that useradd will not reuse
    a UID or GID. If the number identified in this parameter is used, it will use
    the next available number after this. Note also that if you don''t have a group
    1000 on your system the first time you use useradd without the -g parameter, you
    get a message displayed on the terminal that says: useradd: unknown GID 1000.
    You may disregard this message and group 1000 will be created.


    CREATE_MAIL=yes

    This parameter causes useradd to create a mailbox for the newly created user.
    useradd will make the group ownership of this file to the mail group with 0660
    permissions. If you would prefer that mailbox files are not created by useradd,
    use the following command:


    ```

    sed -i ''/s/yes/no/'' /etc/default/useradd

    ```


    # 6.55.3. Setting the root password


    Choose a password for user root and set it by running:


    ```

    passwd root

    ```


    # 6.55.4. Contents of Shadow


    +   Installed programs: chage, chfn, chpasswd, chpasswd, expiry, faillog, gpasswd,
    groupadd, groupdel, memgroups, groupmod, grpck, grconv, grpunconv, lastlog, login,
    logout, newgrp, newcomers, nologin, passwd, pwconv, pwunconv, sg (link to newgrp),
    su, useradd, userdel, usermod, vig (link to vipw), and vipw


    +   Installed directory: /etc/default


    177'
  merge: -1
