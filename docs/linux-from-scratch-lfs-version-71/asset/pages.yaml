- img_proc: true
  md: '# Linux From Scratch - Version 7.1


    Replace <xxx> with the name of the LFS partition (hda5) in our previous example.


    # Note


    Some distributions use custom features in their filesystem creation tools (E2fsprogs).
    This can cause problems when booting into your new LFS in Chapter 9, as those
    features will not be supported by the LFS-installed E2fsprogs; you will get an
    error similar to "unsupported filesystem features, upgrade your c2fsprogs". To
    check if your system uses custom enhancements, run the following command:


    ```

    debugfs -R create /dev/<xxx>

    ```


    If the output contains features other than has_journal, each_attr, resize_inode,
    dir_index, filetype, sparse_sum, large_file or needs_recovery, then your system
    may have custom enhancements. In that case, to avoid later problems, you should
    compile the stock E2fsprogs package and use the resulting binaries to re-create
    the filesystem on your LFS partition:


    ```

    cd /tmp

    tar -xvf /path/to/sources/e2fsprogs-1.42.tar.gz

    e2fsprogs-1.42

    mkdir -v build

    cd build

    ..../configure

    make #note that we intentionally don''t ''make install''!

    ./.misc/mke2fs -jv /dev/<xxx>

    cd /tmp

    rm -rfv e2fsprogs-1.42

    ```


    If you are using an existing swap partition, there is no need to format it. If
    a new swap partition was created, it will need to be initialized with this command:


    ```

    mkswap /dev/<xxx>

    ```


    Replace <xxx> with the name of the swap partition.


    # 2.4. Mounting the New Partition


    Now that a file has been created, the partition needs to be made accessible. In
    order to do this, the partition needs to be mounted at a chosen point. For the
    purposes of this book, it is assumed that the file system is mounted at /mnt/lfs,
    the directory choice is up to you.


    Choose a mount point and assign it to the LFS environment variable by running:


    ```

    export LFS=/mnt/lfs

    ```


    Next, create the mount point and mount the LFS file system by running:


    ```

    mkdir -pv $LFS

    mount -v t ext3 /dev/<xxx> $LFS

    ```


    Replace <xxx> with the designation of the LFS partition.'
