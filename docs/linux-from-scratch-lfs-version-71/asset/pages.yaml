  md: '# 6.30. Readline-6.2


    The Readline package is a set of libraries that offers command-line editing and
    history capabilities.


    **Approximate build time:** 0.2 SBU

    Required disk space: 13.8 MB


    # 6.30.1. Installation of Readline


    Reinstall Readline will cause the old libraries to be moved to <library>.old.
    While this is normally a problem, in some cases it can trigger a linking bug in
    ldconfig. This can be avoided by issuing the following two seeds:


    ```

    sed -i ''/.*old/d'' Makefile.in

    sed -i ''/[OLDSUFF]/c'' support/shlib-install

    ```


    Apply a patch to a known bug that has been fixed upstream:


    ```

    patch -Npl -i ../readline-6.2-fixes-1.patch

    ```


    Prepare Readline for compilation:


    ```

    ./configure --prefix=/usr --libdir=/lib

    ```


    Compile the package:


    ```

    make SHLIB_LIBS=-lncurses

    ```


    The meaning of the make option:


    SHLIB_LIBS=-lncurses

    This option forces Readline to link against libncurses (really, libncursesw) library.


    This package does not come with a test suite.


    Install the package:


    ```

    make install

    ```


    Now move the static libraries to a more appropriate location:


    ```

    mv -v /lib/lib{readline,history}.a /usr/lib

    ```


    Next, remove the .so files in lib and relink them into /usr/lib:


    ```

    rm -v /lib/lib{readline,history}.so

    ln -sf ..//lib/libreadline.so.6 /usr/lib/libreadline.so

    ln -sf ..//lib/libhistory.so.6 /usr/lib/libhistory.so

    ```


    If desired, install the documentation:


    ```

    mkdir -v /usr/share/doc/readline-6.2

    install -v -m644 doc.*{ps,pdf,html,dvi} \

