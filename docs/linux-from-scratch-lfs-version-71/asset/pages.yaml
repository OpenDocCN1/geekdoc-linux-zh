  md: '# 5.10. GCC-4.6.2 - Pass 2


    The GCC package contains the GNU cc collection, which includes the C and C++ compilers.


    Approximate build time: 7.0 SBU

    Required disk space: 1.5 GB


    # 5.10.1. Installation of GCC


    Versions of GCC later than 4.3 will treat this as if it were a relocated compiler
    and disallow searching for startfiles in the location specified by --prefix Since
    this is not a relocated compiler, and the startfiles in tools are crucial to building
    a working compiler linked to the libs in /tools, apply the following patch which
    reverts GCC to its old behavior:


    ```

    patch -npl -1 ... //gcc-4.6.2-startfiles fix-1.patch

    ```


    Under normal circumstances the GCC fixinc script is run in order to fix potentially
    broken headers files. As GCC-4.6.2 and Glibc-2.14 have already been installed
    at this point, and their respective header files are known to require fixing,
    the fixinc script is not executed. In fact, this script may pollute the environment
    by installing fixed headers from the system into GCC''s private include directory.
    The running of the fixinc script can be suppressed by issuing the following commands:


    ```

    cp v gcc/Makefile.in{..} > gcc/Makefile.in

    sed ''s/\fixinc\/shb-c true/'' gcc/Makefile.in

    ```


    For x86 machines, a bootstrap build of GCC using the --fomit-frame-pointer compiler
    flag builds this file by default, and the goal is to produce a compiler that is
    exactly the same as if it were bootstrapped. By applying the following command
    to force the build to use the flag:


    ```

    cp v gcc/Makefile.in{..}.tmp

    sed ''s/T CFLAGS=$/& -fomit-frame-pointer/'' gcc/Makefile.in.tmp \

    do > gcc/Makefile.in

    ```


    The following will change the location of GCC''s default dynamic linker to the
    one installed in /tools/. It also removes /usr/include from GCC''s search path.
    Doing this rather than adjusting the specs file after installation ensures that
    the new dynamic linker is used during the actual build of GCC. To, all of the
    binaries created during this build will link against the new Gibc.


    ```

    for file in \

    $(gcc/config -name linux64.h -o -name linux.h -o -name sysv4.h)

    do

    cp -uv $file{,orig}

    sed ''s/\/lib/(64@\\(32@)/tools@&@g'' \

    -e ''s//usr@@@@g'' $file > $file

    echo

    #ifndef STANDARD INCLUDE DIR

    #define STANDARD INCLUDE DIR 0

    #define STANDARD STARTFILE PREFIX 1 "*"

    #define STANDARD STARTFILE PREFIX 2 "*" >> $file

    touch $file.orig

    done

    ```'
  merge: -1
  pgno: 63
- img_proc: true
  md: "# Linux Search - Version 7.1\n\nIn case the above seems hard follow, let's\
    \ break it down a bit. First we find all the files under the gccconfig directory\
    \ that are named linux.h, linux64.h or sys4.h. For each file, we copy it to a\
    \ file of the same name but with an added suffix of \"orig\". Then the first ser\
    \ expression expands \"tools\" to every instance of /libd/, /lib64/ or /lib32/,\
    \ where the second one replaces hard-coded instances of \"usr\". We then add our\
    \ define statements which also include the search path and the default static\
    \ prefix to the end of the file. Finally, we use touch to update the timestamp\
    \ in the config file. When used in conjunction with cp -u, this prevents unexpected\
    \ changes to the original files in the command as the multibilib spec gcc is inadvertently\
    \ run twice.\n\nOn x86_64, unset the multibilib spec gcc ensures that it won't\
    \ attempt to link against libraries on the host:\n\n```\ncase ($name -m) in\n\
    \  x86 64)\n    for file in $(find gcc/config -name t-linux64); do \\\n      cp\
    \ -v $file,.orig\n      sed /$MULTILIB OSIRDAMES/d $file.orig > $file\n    done\n\
    \  esac\n```\n\nAs in the first build of GCC it requires the GMP, MPFR and MPC\
    \ packages. Unpack the tarballs and move them into the required directory:\n\n\
    ```\ntar -jxf ../mpfr-3.1.0.tar.bz2\nmv -v mpfr-3.1.0 mpfr\ntar -xxf ../gmp-5.0.4.tar.xz\n\
    mv -v gmp-5.0.4 gmp\ntar -zxf ../mpc-0.9.tar.gz\nmv -v mpc-0.9 mpc\n```\n\nCreate\
    \ a separate build directory again:\n\n```\nmkdir -v ../gcc-build\ncd ../gcc-build\n\
    ```\n\nBefore starting to build GCC, remember to unset any environment variables\
