  md: "# 7.7. How Do These Bootscripts Work?\n\nLinux uses a special booting facility\
    \ named SysInit that is based on a concept of run-levels. It can be quite different\n\
    \ one system to another, so it cannot be assumed that because things worked in\
    \ one particular Linux distribution,\nthey should work the same in LFS too. LFS\
    \ has its own way of doing things, but it respects generally accepted\nstandards.\n\
    \nSysInit (which will be referred to as \"init\" from now on) works using a run-level\
    \ scheme. There are seven\nnumbered 0 to 6) run-levels (actually, there are more\
    \ run-levels, but they are for special cases and are generally not\nused. See\
    \ init (8) for more details), and each one of those corresponds to the actions\
    \ the computer is supposed\nto perform when it starts up. The default run-level\
    \ is 3. Here are the descriptions of the different run-levels as they are\nimplemented:\n\
    \n+   0: halt the computer\n1: single-user mode\n2: multi-user mode without networking\n\
    3: multi-user mode with networking\n4: reserved for customization, otherwise does\
    \ the same as 3\n5: same as 4, it is usually used for GUI login (like X's xdm\
    \ or KDE's kdm)\n6: reboot the computer"
  merge: -1
  pgno: 225
- img_proc: true
  md: '# 7.7.1. Configuring Sysvinit


    During the kernel initialization, the first program that is run is either specified
    on the command line, or by default **init**. The program reads the initialization
    file `/etc/inittab`. Create this file with:


    ```

    cat >/etc/inittab << "EOF"

    # Begin /etc/inittab

    id:3:initdefault:

    si::sysinit/etc/rc.d/init.d/rc S


    10:0:wait/etc/rc.d/init.d/rc 0

    11:S:wait/etc/rc.d/init.d/rc 1

    12:2:wait/etc/rc.d/init.d/rc 2

    13:3:wait/etc/rc.d/init.d/rc 3

    14:4:wait/etc/rc.d/init.d/rc 4

    15:5:wait/etc/rc.d/init.d/rc 5

    16:6:wait/etc/rc.d/init.d/rc 6


    ca:12345:ctrlaltdel:/bin/shutdown -t a -r now


    su:0:once:/sbin/getgetin


    1:2345:respawn:/sbin/agetty --noclear tty1 9600

    2:2345:respawn:/sbin/agetty tty2 9600

    3:2345:respawn:/sbin/agetty tty3 9600

    4:2345:respawn:/sbin/agetty tty4 9600

    5:2345:respawn:/sbin/agetty tty5 9600

    6:2345:respawn:/sbin/agetty tty6 9600


    # End /etc/inittab

    EOF

    ```


    An explanation of this initialization file is in the man page for `inittab`. For
    LFS, the command that is run is `rc`. The initialization file above will instruct
    `rc` to run all scripts starting with an S in the `/etc/rc.d/rcysinit` directory
    followed by all scripts starting with an S in the `/etc/rc.d/rc?` directory where
    the question mark is replaced by the default value.


    As a convenience, the `rc` script reads a library of functions in `/lib/ls/init-functions`.
    This library also reads an optional configuration file, `/etc/sysconfig/rc.site`.
    Any of the system file parameters described in subsequent sections can be alternatively
    placed in this file allowing consolidation of all system parameters in one file.


    As a debugging convenience, the functions script also logs all output to `/run/var/log`.
    Since the `/run` directory is a tmpfs, this file is not persistent across boots.'
  merge: -1
  pgno: 226
- img_proc: true
  md: "# 7.7.2. Changing Run Levels\n\nChanging run-levels is done with **init <runlevel>,\
    \ where <runlevel> is the target run-level. For example, to reboot the computer,\
    \ a user could use the **init 6** which is an alias for the **reboot** command.\
    \ Likewise, **init 0** is an alias for the **halt** command.\n\nThere are a number\
    \ of directories under /etc/rc.d that look like rc?.d (where ? is the number of\
    \ the run-level) and rcysinit.d, all containing a number of symbolic links. Begin\
    \ with a K, the others with an S and all of them follow two numbers following\
    \ the initial letter. The K means to stop (kill) a service and the S means to\
    \ start a service. The numbers determine the order in which the scripts are run,\
    \ from 00 to 99--the lower the number it gets. When init switches to another run-level,\
    \ the appropriate services are either started or stopped, depending on the level.\n\
    \nThe real scripts are in /etc/rc.d/init.d. They do the actual work, and the symlinks\
    \ all point to them. K and S links point to /etc/rc/init.d. This is because the\
    \ scripts can call with different parameters like *start, restart, reload, status*.\
    \ When a K link is encountered, the appropriate script runs with the *start* argument.\
    \ When an S link is encountered, the appropriate script runs with the *start*\
    \ argument.\n\nThere is one exception to this explanation. Links that start with\
    \ an S in the rc0.d and rc6.d directories will not cause anything to be started.\
    \ They will be called with the parameter stop to stop something. The logic behind\
    \ this is when a user is going to reboot or halt the system, nothing needs to\
    \ be started. The system only needs to be stopped.\n\nThese are descriptions of\
    \ what the arguments make the scripts do:\n\n+   * start\n  The service is started.\n\
    * stop\n  The service is stopped.\n* restart\n  The service is stopped and then\
    \ started again.\n* reload\n  The configuration of the service is updated. This\
    \ is used after the configuration file of a service was modified, when the service\
    \ does not need to be restarted.\n* status\n  Tells if the service is running\
    \ and with which PIDs.\n\nFeel free to modify the boot process (after all, it\
    \ is your own LFS system). Files given here are example of how it can be done.\n\
    \n# 7.8. Configuring the system hostname\n\nPart of the job local script is setting\
    \ the system's hostname. This needs to be configured in the /etc/sysconfig/network\
    \ file.\n\nCreate the /etc/sysconfig/network file and enter a hostname by running:\n\
    \n```\necho \"HOSTNAME=lfs\" > /etc/sysconfig/network\n```"
  merge: -1
