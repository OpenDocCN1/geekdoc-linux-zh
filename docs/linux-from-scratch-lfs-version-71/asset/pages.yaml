    # Prerequisites


    Building an LFS system is not a simple task. It requires a level of existing knowledge
    of Unix system administration in order to resolve problems and correctly execute
    the commands listed. In particular, as an absolute minimum, you should already
    have the ability to use the command line (shell) to copy or move files and directories,
    directory file and contents, and change the current directory. It is also expected
    that you have a reasonable knowledge of installing and using Linux software.

    Because the LFS book assumes at this basic level of skill, the very LFS support
    forums are unlikely to provide you with much assistance in these areas. You will
    find that your questions regarding such basic knowledge will likely go unanswered
    or will be referred to the LFS essential pre-reading list.

    Before building an LFS, we recommend reading the following HOWTOs:


    +   - Software-Building-HOWTO

    This is a comprehensive guide to building and installing "generic" Unix software
    packages on Linux. Although it was written some time ago, it still provides a
    good summary of the basic techniques needed to build and install software.

    - The Linux Users'' Guide

    This guide covers the usage of assorted Linux software. This reference is also
    fairly old, but still valid.'
