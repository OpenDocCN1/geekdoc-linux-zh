    Further text assumes that the device is built statically into the kernel or already
    loaded as a module, and that you have already checked that Udev did not create
    a mismatched device.


    Udev has no information to create a device node if a kernel device does not export
    its data to sysfs. This is most common with third party drivers from the outside
    kernel. Create a static device node in /lib/udev/devices with the appropriate
    major/minor numbers (see the file details). text inside the kernel device or the
    documentation provided by the third party driver. The static device node will
    be copied to /dev by the udev boots.


    # 7.4.3.7. Udev device naming changes after reboot


    This is due to the fact that Udev, by design, handles events and modules in parallel,
    and thus in an unpredictable order. This will not be "fixed". You should not rely
    upon the kernel device names being stable. Create your own rules that make stable
    names based on some stable attributes of the device, such as a serial number or
    the output of * id utilities installed by Udev. See Section 7.5, "Creating Custom
    Symlinks to Devices" and Section 7.2, "General Network Configuration" for examples.


