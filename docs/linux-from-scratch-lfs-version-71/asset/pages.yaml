    # 5.5.1. Installation of Core GCC


    GCC now requires the GMP, MPFR and MPC packages. As these packages may not be
    included in your host distribution, they will be built with GCC. Unpack each package
    into the GCC source directory and rename the resulting directories so the GCC
    build proceeds will automatically use them:


    > Note\There are frequent misunderstandings about this chapter. The procedures
    are the same as every other chapter explained earlier (build instructions). First
    extract the gcc tarball from the sources directory and then change to the directory
    created. Only then should you proceed with the instructions below.


    ```

    tar -jxf ../mpfr-3.1.0.tar.bz2

    mv - mpfr-3.1.0 mpfr

    tar -zxf ../gmp-5.0.4.tar.xz

    mv - gmp-5.0.4 gmp

    tar - xf ../mpc-0.9.tar.gz

    mv - mpc-0.9 mpc

    ```


    Apply a patch that will allow the building of liberty and zlib targets to be disabled
    as these do not build in a correctly-compiled environment:


    ```

    patch -Npl -i ../gcc-4.6.2_cross_compile-1.patch

    ```


    The GCC documentation recommends building GCC outside of the source directory
    in a dedicated directory build:


    ```

    mkdir -v ../gcc-build

    cd ../gcc-build

    ```


    Prepare for compilation:


    ```

    ../gcc-4.6.2/configure --prefix=/tools \

    --target=n-is --disable-shared --disable-multilib \

    --disable-decimal-float --disable-threads \

    --disable-libhfduplat --disable-libssp \

    --disable-libgomp --disable-libquadmath \

    --disable-liberty --disable-target-zlib \

    --enable-languages=c --without-ppl --without-cloggo \

    --with-mpfr-include=$(pwd) ../gcc-4.6.2/mpfr/src \

    --with-mpfr-lib=$(pwd) ../mpfr/src/.libs

    ```


    The meaning of the configure options:

    --disable-shared

    This switch forces GCC to link its internal libraries statically. We do this to
    avoid possible issues with the host system.'
