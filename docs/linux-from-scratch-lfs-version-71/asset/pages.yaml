    # 8.3.2. Configuring Linux Module Load Order


    The /etc/modprobe.d/usb.conf file needs to be created so that the USB drivers
    (ehci_hcd, ohci_hcd, and uhci_hcd) have been built as modules, they will be loaded
    in the correct order, ehci_hcd needs to be loaded prior to uhci_hcd in order to
    avoid warning being output at boot time.


    Create a new file /etc/modprobe.d/usb.conf by running the following:


    ```

    install -v -m755 -d /etc/modprobe.d

    cat /etc/modprobe.d/usb.conf << "EOF"

    # Begin /etc/modprobe.d/usb.conf


    install ohci_hcd /sbin/modprobe ehci_hcd ; /sbin/modprobe -i ohci_hcd ; true

    install uhci_hcd /sbin/modprobe ehci_hcd ; /sbin/modprobe -i uhci_hcd ; true


    # End /etc/modprobe.d/usb.conf

    EOF

    ```


