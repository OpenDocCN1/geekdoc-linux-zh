- img_proc: true
  md: '# The meaning of the enable-locale options:


    --enable-locale=gnu

    This option ensures the correct locale model is selected for the C++ libraries
    under all circumstances. If the configure script finds the de_DE locale installed,
    it will select the correct gnu locale model. However, if the de_DE locale is not
    installed, there is the risk of building Application Binary Interface (ABI)-incompatible
    C+ libraries which use the incorrect generic locale model may be selected.


    --enable-threads=posix

    This enables C++ exception handling for multi-threaded code.


    --enable-cxa-atexit

    This option allows use of _cxa_atexit, rather than register C++ destructors for
    local static and global objects. This option is essential for fully standards-compliant
    handling of destructors. It also affects the C++ ABI, and therefore results in
    C++ shared libraries and C++ programs that are interoperable with other Linux
    distributions.


    --enable-languages=c++

    This option ensures that both the C and C++ compilers are built.


    --disable-libstdcxx-pch

    Do not build the pre-compiled header for libstdc++.  It takes up a lot of space,
    and we have no use for it.


    --disable-bootstrap

    For native builds of GCC, the default is to a "bootstrap" build. This does not
    just compile GCC, but compiles it several times. It uses the programs compiled
    in a first round to compile itself a second time, and then again a third time.
    The second and third iterations are compared to make sure it can reproduce itself
    flawlessly. This also implies that it was compiled correctly. However, the LFS
    build method should provide a solid compiler without the need to bootstrap each
    time.


    Compile the package:


    ```

    make

    ```


    Install the package:


    ```

    make install

    ```


    As a finishing touch, create a symlink. Many programs and scripts run cc instead
    of gcc, which is used to keep programs generic and therefore usable on all kinds
    of UNIX systems where the GNU C compiler is not always installed. Running cc leaves
    the system administrator free to decide which C compiler to install:


    ```

    in -vs gcc /tools/bin/cc

    ```'
