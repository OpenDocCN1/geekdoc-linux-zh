  md: '# Linux From Scratch - Version 7.1


    Some packages beyond LFS may also lack support for your chosen locale. One example
    is the X library (part of the X Window System), which outputs the following error
    message if the locale does not exactly match one of the character map names in
    its internal files:


    > Warning: locale not supported by XLib, locale set to C


    In several cases XLib expects that the character map will be listed in notation
    with canonical dashes. For instance, "ISO-8859-1" rather than "iso88591". It is
    also possible to find an appropriate specification by removing the charset part
    of the locale specification. This can be checked by running the locale charset
    command in other locales. For example, one would have to change `de_DE.ISO-8859-15@euro`
    to `_de_DE=euro` in order to get this locale recognized by XLib.


    Other packages can also function (but may not necessarily display any error messages)
    if the locale name does not meet your expectations. In those cases, investigating
    how other Linux distributions support your locale might provide some useful information.


    Once the proper locale settings have been determined, create the /etc/profile
    file:


    ```

    cat > /etc/profile << "EOF"

    # Begin /etc/profile


    export LANG=<language>_CC.<charset>@modifiers


    # End /etc/profile

    EOF

    ```


    The "C" (default) and "en_US" (the recommended for United States English users)
    locales - "C" uses the US-ASCII-7 bit character set, and treats bytes with the
    high bit set as invalid characters. That''s why, e.g., the Is command substitutes
    them with question marks in that locale. Also, an attempt to send mail with such
    characters from Mutt or Pine results in non-RFC-conforming messages being sent
    (the charset in the outgoing mail is indicated as "unknown 8-bit"). So you can
    use the "C" locale only if you are sure that you will never need 8-bit characters.


    UTF-8 based locales are not supported well by many programs. Work is in progress
    to document and, if possible, fix problems, see http://www.linuxfromscratch.com/bifs/view/svn/introduction/locale-issues.html.


    # 7.14. Creating the /etc/inputrc File


    The inputrc file handles keyboard mapping for specific situations. This file is
    the startup file for Readline — the input-related library — used by Bash and most
    others.


    Most people do not need user-specific keyboard bindings so the command creates
    a global /etc/inputrc used by everyone who logs in. If you later decide to override
    the defaults on a per-user basis, you can create a .inputrc file in the user''s
    directory with the modified mappings.


    For more information on how to edit the inputrc file, see info bash under the
    Readline Init File section. info readline is a good source of information.'
