    The meaning of the new configure options:


    CC="$LFS TGT-gcc -B/tools/lib" AR="$LFS TGT-ar RANLIB=$LFS TGT-ranlib

    Because this is a native build of Binutils, setting these variables ensures that
    the build system uses the

    cross-compiler and associated tools instead of the ones on the host system.


    --with-lib-path=/tools/lib

    This tells the configure script to specify the library search path during the
    compilation of Binutils, resulting in

    /tools/lib being passed to the linker. This prevents the linker from searching
    through library directories

    on the host.


    Compile the package:


    ```

    make

    ```


    Install the package:


    ```

    make install

    ```


    Now prepare the linker for the "Re-adjusting" phase in the next chapter:


    ```

    make -C 1 ld clean

    make -C 1 ld LIB PATH=/usr/lib

    cp -v 1d/ld-new /tools/bin

