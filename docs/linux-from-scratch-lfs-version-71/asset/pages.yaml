  md: '# Linux From Scratch - Version 7.1


    # Note


    Deviating from this book does not mean that we will help you. After all, LFS is
    about personal preference. Being upfront about changes to the established procedure
    helps us evaluate and determine possible causes of your trouble.


    # 1.5.2. Configure Script Problems


    If something goes wrong while running the configure script, review the config.log
    file. This may contain errors encountered during configure which were not printed
    to the screen. Include the relevant lines if you need to ask for help.


    # 1.5.3. Compilation Problems


    Both the screen output and the contents of various files are useful in determining
    the cause of compilation problems. The screen output of configure script and the
    make can be helpful. It is not necessary to include the entire output, but do
    enough of the relevant information. Below is an example of the type of information
    to include from the screen output of make:


    ```

    gcc -DALIASPATH="*/mnt/lfs/usr/share/locale:."

    -DLOCEDIR="*/mnt/lfs/usr/share/local\"

    -DLIBDIR="*/mnt/lfs/usr/lib\"

    -DINCLUDEDIR="*/mnt/lfs/usr/include\" -DHAVE CONFIG_H -I.

    g -g02 -static -o make ar.o arscan.o commands.dir.o

    expand.file.o get.o implicit.o job.main.o

    misc.o read.o remake.o.rule signe.o variable.o vpath.o

    default.o make-stub.o.rule version.o opti.o

    -lutil job.o: In function "load_too_high"

    /lfs/tmp/make-3.79.1/job.c:1565: undefined reference

    to ''getodloadav''

    collect2: *** 1 returned 1 exit status

    make[2]: *** [make] Error 1

    make[2]: Leaving directory /lfs/tmp/make-3.79.1

    make[1]: *** [all-recursive] Error 1

    make[1]: Leaving directory /lfs/tmp/make-3.79.1

    make: *** [all-recursive-am] Error 2

    ```


    In this case, many people would include the following section:


    ```

    make [2]: *** [make] Error 1

    ```


    This is not enough information to properly diagnose the problem because it only
    notes something went wrong, not what went wrong. The entire section, as in the
    example above, is what should be saved because includes the command that was executed
    and the error message(s).


    An excellent article about asking for help on the Internet is available at http://catb.org/--fs/faqs/smart-questions.html.
    Follow the hints in this document to increase the likelihood of getting the help
    you need.'
