    The meaning of the make parameters:


    -C 1 ld clean

    This tells the make program to remove all compiled files in the 1d subdirectory

    -C 1 ld LIB PATH=/usr/lib

    This option rebuilds everything in the 1d subdirectory. Specifying the LIB_PATH
    Makefile variable on

    command line allows us to override the default value of the temporary tools and
    point it to the proper final path.'
