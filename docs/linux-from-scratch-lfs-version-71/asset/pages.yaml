  md: '# ## 5.11. Tcl-8.5.11


    The Tcl package contains the Tool Command Language.


    +   - Approximate build time: 0.3 SBU

    Required disk space: 33 MB


    # ### 5.11.1. Installation of Tcl


    This package and the next three (Expect, DejaGNU, and Check) are installed to
    support running the test suites for GCC and Binutils and other packages. Installing
    four packages seem excessive, but it is very reassuring, if not essential, to
    know that the most important tools are working-properly. Even if the test suites
    are not in this chapter (they are not mandatory), these packages are required
    to run the test suites in Chapter 6.


    Prepare Tcl for compilation:


    ```

    cd unix

    ./configure --prefix=/tcl

    ```


    Build the package:


    ```

    make

    ```


    Compilation is now complete. As discussed, running the test suite is not mandatory
    for the temporary tools in this chapter. To run the Tcl test suite anyway, issue
    the following command:


    ```

    TZ=UTC make test

    ```


    The Tcl test may experience failures under certain conditions that are not fully
    understood. The suite failures are not surprising, and are not considered critical.
    The TZ=UTC parameter sets the time zone to Coordinated Universal Time (UTC), also
    known as Greenwich Mean Time (GMT), but only for the duration of the test run.
    This ensures that the clock tests are exercised correctly. Details on the TZ environment
    variable are provided in Chapter 7.


    Install the package:


    ```

    make install

    ```


    Make the installed library writable so debugging symbols can be removed later:


    ```

    chmod -v u+w /tools/lib/libtcl8.5.so

    ```


    Install Tcl''s headers. The next package, Expect, requires them to build.


    ```

    make install-private-headers

    ```


    Now make a necessary symbolic link:


    ```

    ln -sv tclsh8.5 /tools/bin/tclsh

    ```


    # ## 5.11.2. Contents of Tcl


    +   - Installed programs: tclsh (link to tclsh8.5) and tclsh8.5

    - Installed library: libtcl8.5.so, libtclstub8.5.a'
