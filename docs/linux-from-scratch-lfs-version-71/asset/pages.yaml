  md: '# Preface


    # Foreword


    My journey to learn and understand Linux began a decade ago, back in 1998. I had
    just installed my first Linux distribution and quickly became intrigued with the
    whole concept and philosophy behind Linux.


    There are always many ways to accomplish a single task. The same can be said about
    Linux distributions. A great many have existed over the years. Some still exist,
    have been merged into something else, others have been relegated to our memories.
    They all do differently to suit the needs of their target audience. Because so
    many different ways to accomplish the same end goal exist, I realize I no longer
    limited by any one implementation. Prior to discovering Linux, we simply put up
    with issues in other Operating Systems as you had no choice. It was what, whether
    you liked it or not. With Linux, the concept of choice began to emerge. If you
    didn''t like something, you were free, encouraged to change it.


    I tried a number of distributions and could not decide on any. They were great
    systems in their own right. It wasn''t a matter of right and wrong anymore. It
    had become a matter of personal taste. With all that choice available, it became
    apparent that there would be a single system that would be perfect for me. So
    I set out create my own Linux system that would fulfill confirm personally to
    my personal preferences.


    To truly make this, I resolved to create everything from source code instead of
    using pre-compiled packages. This "perfect" Linux would have the strengths of
    various systems without their weaknesses. At first, the idea was daunting. I remained
    committed to the idea that such a system could be built. After sorting issues
    such as circular dependencies and compile-time errors, I finally built a custom-built
    Linux system. It was fully operational and perfectly unlike any of the other Linux
    systems out there at the time. It was my own creation. It was so satisfying to
    have put together such a system myself. The only better thing would have been
    to create each piece of software myself. This was the next best thing.


    As I shared my goals and experiences with other members of the Linux community,
    it became apparent that there such custom-built Linux systems serve not only to
    meet user requirements, but also serve as an ideal learning opportunity for programmers
    and system administrators to enhance their (existing) Linux systems. Out of this
    broadened interest, the Linux From Scratch project was born.


    This Linux From Scratch book is the core core around that. It provides the backgrounds
    and instructions necessary for you to design and build your own system. While
    this book provides a template that will result in a working system, you are free
    to alter the instructions to yourself, which is, in part, an important part of
    this project. You remain in control; we just lend a helping hand to get you started
    on your own journey.


    I sincerely hope you will have a great time working on your own Linux From Scratch
    system and enjoy the numerous benefits of having a system that is truly yours
    own.


    Gerard Beekmans

    gerard@linuxfromscratch.org


    # Audience


    There are many reasons why you would want to read this book. One of the questions
    many people raise is, "why go through all the hassle of manually building a Linux
    system from scratch when you can just download and install an existing one?"'
  merge: -1
  pgno: 9
- img_proc: true
  md: '# Linux From Scratch - Version 7.1


    One important reason for this project''s existence is to help you learn how a
    Linux system works from the inside out. Building an LFS system helps demonstrate
    what makes Linux tick, and how things work together and depend on each other.
    The best things that this learning experience provides is the ability to customize
    a Linux system to suit your own unique needs.


    Another key of LFS is that it allows you to have more control over the system
    without relying on someone else''s LFS implementation. With LFS, you are in the
    driver''s seat and dictate every aspect of the system.


    LFS allows you to create very custom Linux systems. When installing distributions,
    you are often forced to install many great programs which are rarely used or obsolete.
    These programs waste resources. You may argue that with today''s hard drive and
    CPUs, such resources are no longer a consideration. Sometimes, however, you are
    still constrained by size considerations if needed. Think about CDs, USB sticks,
    and embedded systems. There are areas where LFS can be beneficial.


    Another advantage of a custom built Linux system is security. By compiling the
    entire system from source code, you are empowered to audit everything and all
    the security patches. It is no longer necessary to wait for somebody to compile
    binary packages that fix a security hole. Unless you change the patch and implement
    yourself, you have no guarantee that the new package was built correctly and adequately
    fixes the problem.


    The goal of Linux From Scratch is to build a complete and useful foundation-level
    system. If you do not wish to build your own Linux from scratch, you may not entirely
    benefit from the information in this book.


    There are too many good reasons to build your LFS system to list them all. In
    the end, education is by far the most powerful of reasons. As you continue in
    your LFS experience, you will discover the power that information and knowledge
    truly bring.


    # LFS Target Architectures


    The primary target of LFS is the 32-bit CPU. If you have not built an LFS system
    before, you should probably start with that target. The 32-bit architecture is
    the most widely supported Linux system and is most compatible with both open source
    and proprietary software.


    On the other hand, the instructions in this book are known to work, with some
    modifications, with both Power PC and 64-bit AMD/Intel CPUs. To build a system
    that utilizes one of these CPUs, the main prerequisite, in addition to the next
    few pages, is an existing LFS installation, Ubuntu, Red Hat/ Fedora, SUSE, or
    other distribution that takes the architecture that you have. Also note that a
    32-bit distribution can be installed and used as a host on a 64-bit AMD/Intel
    computer.


    Some other facts about 64-bit systems need to be added here. When compared to
    a 32-bit system, the sizes of executable programs are slightly larger and the
    execution speeds are only slightly faster. For example, in a test of LFS-6.5 on
    a Core2D CPU based system, the following statistics were measured:


    | Architecture | Build Time | Build Size |

    | --- | --- | --- |

    | 32-bit | 198.5 minutes | 648 MB |

    | 64-bit | 190.6 minutes | 709 MB |


    As you can see, the 64-bit build is only 4% faster and 9% larger than the 32-bit
    build. The gain from going to a 64-bit system is relatively minimal. Of course,
    if you have more than 4GB of RAM or want to manipulate data that exceeds 4GB,
    the advantages of a 64-bit system are substantial.'
  merge: -1
  pgno: 10
- img_proc: true
  md: '# Linux From Scratch - Version 7.1


    The default 64-bit build that results from LFS is considered a "pure" 64-bit system.
    That is, it 64-bit executables only. Building a "multi-lib" system requires compiling
    many applications twice, once for a 32-bit system and once for a 64-bit system.
    This is not directly supported in LFS because it would interfere with the educational
    objective of providing the instructions for a straightforward Linux system. You
    can refer to the Cross Linux project for this advanced topic.


    There is one last comment about 64-bit systems. There are some packages that cannot
    be built in a "pure" 64-bit system or require specialized builds. Generally, these
    packages have some embedded 32-bit assembly language instructions that fail when
    building on a 64-bit system. This includes Xorg drivers from Beyond Linux From
    Scratch (BLFS). Many of these problems can be worked around, but may require specialized
    patches or procedures.


    # LFS and Standards


    The structure of LFS follows Linux standards as closely as possible. The primary
    standards are:


    +   - POSIX-1-2008.

    - Filesystem Hierarchy Standard (FHS)

    - Linux Standard Base (LSB) Core Specification 4.0


    The LSB has five separate standards: Core, C++, Desktop, Runtime Languages, and
    Printing. In addition to generic requirements there are also architecture specific
    requirements. LFS attempts to conform to the architectures discussed in the previous
    section.


    > Note: Many people do not agree with the requirements of the LSB. The main purpose
    of this is to ensure that proprietary software will be able to be installed and
    run properly on a compliant system. Since LFS is source-based, the user has complete
    control over what packages are desired and many choose not to install packages
    that are specified by the LSB.


    Creating a complete LFS system capable of passing the LSB certifications tests
    is possible, but not without additional packages that are beyond the scope of
    LFS. Most of these additional packages have installation instructions in BLFS.


    # Packages supplied by LFS needed to satisfy the LSB Requirements


    | LSB Core: | Bash, Binutils, Corcutils, Diffutils, File, Findutils, Gawk, Grep,
    Gzip, M4, Debian, Courses, Propcs, Pmisc, Sed, Shadow, Tar, Util-linux, Zlib |

    | LSB C++: | GCC |

    | LSB Desktop: | None |

    | LSB Runtime Languages: | Perl |

    | LSB Printing: | None |

    | LSB Multimedia: | None |


    # Packages supplied by BLFS needed to satisfy the LSB Requirements


    | LSB Core: | Bc, Cpio, Ed, Ferontab, Initd-tools, PAM, Sendmail (or Postfix or
    Exim) |

    | LSB C++: | None |'
