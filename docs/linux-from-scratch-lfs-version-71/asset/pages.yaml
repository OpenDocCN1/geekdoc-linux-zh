- img_proc: true
  md: '# Linux From Scratch - 7.1


    **The console** script reads the `/etc/sysconfig/console` file for configuration
    information. Various language-specific HOWTOs can also help with, see http://www.tldp.org/HOWTO/HOWTO-INDEX/other-lang.html.
    If still in doubt, look in the /lib/kbd directory for valid keymap and screen
    fonts. Read loadkeys(1) and setfont(8) pages to determine the correct arguments
    for these programs.


    The `/etc/sysconfig/console` file should contain lines of the form: VARIABLE="value".
    The variables are recognized:


    LOGLEVEL

    This variable sets the log level for kernel messages to the console as set by
    **dmesg**. Valid levels are from "0" (no messages) to "8".


    KEYMAP

    This variable specifies the arguments for the **loadkeys** program, typically,
    the name of keymap to load, e.g., "us104". If this variable is not set, the bootscript
    will not run the **loadkeys** program, and the default kernel keymap will be used.


    KEYMAP_CORRECTIONS

    This (unused) variable specifies the arguments for the second call to the **loadkeys**
    program. This is useful if the stock keymap is not completely satisfactory and
    a small adjustment to be made. E.g., to include the Euro sign into a keymap that
    does not support it, set this to "euro2".


    FONT

    This variable specifies the arguments for the **setfont** program. Typically,
    this includes the font "-m" and the name of the application character map to load.
    E.g., in order to load the "lat16" together with the "8859-1" character map (as
    it is appropriate in the USA), set this to "lat16 -m 8859-1". In UTF-8 mode, the
    kernel uses the application character map for conversion of composed 8-bit key
    codes in the keymap to UTF-8, and thus the "-m" parameter should be set to the
    encoding of the composed key codes.


    UNICODE

    Set this variable to "1", "yes" or "true" in order to put the console into UTF-8
    mode. This is useful in UTF-8 based locales and harmful otherwise.


    LEGACY_CHARSET

    For many keyboard layouts, there is no stock Unicode KEYMAP in the Kbd path. The
    **console** bootscript will convert an available keymap to UTF-8 on the fly if
    this variable is set to the encoding of the available non-UTF-8 keymap.


    Some examples:


    +   - For a Non-Unicode set, only the KEYMAP and FONT variables are generally
    needed. E.g., for a Polish system, one would use:


    ```

    cat /etc/sysconfig/console << "EOF"

    # /etc/sysconfig/console


    KEYMAP="p122"

    FONT="lat2a-16 8859-2"


    End /etc/sysconfig/console

    EOF

    ```


    209'
  merge: -1
  pgno: 229
- img_proc: true
  md: 'As mentioned above, it is sometimes necessary to adjust a stock keymap slightly.
    The following example adds the Euro symbol to the German keymap:


    ```

    cat > /etc/sysconfig/console << "EOF"

    # Begin /etc/sysconfig/console


    KEYMAP=de-latin1

    KEYMAP_CORRECTIONS="euro2"

    FONT="lat0-16 -m 8859-15"


    # End /etc/sysconfig/console

    EOF

    ```


    The following is a Unicode-enabled example for Bulgarian, where a stock UTF-8
    keymap exists:


    ```

    cat > /etc/sysconfig/console << "EOF"

    # Begin /etc/sysconfig/console


    UNICODE="1"

    KEYMAP="bg_bds-utf8"

    FONT="LatArCyrHeb-16"


    # End /etc/sysconfig/console

    EOF

    ```


    Due to the use of a 512-glyph LatArCyrHeb-16 font in the previous example, bright
