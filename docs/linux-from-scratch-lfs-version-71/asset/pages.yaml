  md: '# # 6.48. Kbd-1.115.2


    The Kbd package contains key-table files and keyboard utilities.


    Approximate build time: less than 0.1 SBU

    Required disk space: 16.0 MB


    # ## 6.48.1. Installation of Kbd


    The behaviour of the Backspace and Delete keys is not consistent across the keymaps
    in the Kbd package. The following patch fixes this issue for i386 except:


    ```

    patch -Npl -i ..kbd-1.115.2-backspace-1.patch

    ```


    After patching, the Backspace key generates the character with code 127, and the
    Delete key generates a well-known escape sequence.


    Prepare Kbd for compilation:


    ```

    ./configure --prefix=/usr --datadir=/lib/kbd

    ```


    The meaning of the configure options:


    +   --datadir=/lib/kbd

    This option puts keyboard layout data in a directory that will always be on the
    root partition instead of the default /usr/share/kbd.


    Compile the package:


    ```

    make

    ```


    This package does not come with a test suite.


    Install the package:


    ```

    make install

    ```


    > Note: For some languages (e.g., Belarusian) the Kbd package doesn''t provide
    a useful keymap where the "by" keymap assumes the ISO-8859-5 encoding, and the
    CP1251 keymap is normally used. Users of such languages have to do working keymaps
    separately.


    Some in the LFS-Scripts package depend on kbd_mode, loadkeys, openset, and setfont.
    As /usr may not be available during the early stages of booting, these binaries
    need to be on the root partition:


    ```

    mv -v /usr/bin/{kbd_mode, loadkeys, openset, setfont} /bin

    ```


    If desired, install the documentation:


    ```

    mkdir -v /usr/share/doc/kbd-1.115.2

    cp -R -v doc/* \

    /usr/share/doc/kbd-1.115.2

    ```'
