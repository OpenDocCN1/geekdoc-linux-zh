    # 7.4. Device and Module Handling on an LFS System


    In Chapter 6, we installed the Udev package. Before we go into the details regarding
    how this works, a brief history of previous methods of handling devices is in.


    Linux systems in general traditionally use a static device creation method, whereby
    great many device nodes are created under /dev (sometimes thousands of nodes),
    regardless of whether the hardware devices actually exist. This is typically done
    via a MAKEDEV script which contains a count of numbers to the mknod program with
    the relevant major and minor device numbers for every possible device that might
    exist in the world.


    Using the Udev method, only those devices which are detected by the kernel get
    device nodes created for them. Because these device nodes will be created each
    time the system boots, they will be stored on a devtmpfs file (a virtual file
    system that resides entirely in memory). Device nodes do not require much space,
    so the memory that it uses is negligible.


    # 7.4.1 History


    In 2000, a new filesystem called devfs was merged into the 2.3.46 kernel and was
    made available during the 2.4 series of stable kernels. Although this method of
    creating devices dynamically never received overwhelming support from the kernel
    developers.


    The main problem with the approach adopted by devfs was the way it handled device
    detection, creation, and naming. The latter issue, that of device naming, was
    perhaps the most critical. It is generally accepted that if device names are allowed
    to be configurable, the device naming policy should be up to a system administrator,
    not imposed by any particular developer(s). The devfs filesystem also suffers
    from race conditions that are inherent in its design and cannot be fixed without
    a substantial rewrite of the kernel, as was deprecated for a long period – due
    to a lack of maintenance – and was finally removed from the kernel in June, 2006.


    With the development of the unstable 2.5 kernel tree, later as the 2.6 series
    of stable kernels, a virtual filesystem called sysfs came to be. The job of sysfs
    is to export the system''s hardware configuration to userspace processes. With
    this userspace-visible representation, the possibility of seeing a userspace replacement
    for devfs became more realistic.


    # 7.4.2. Udev Implementation


    # 7.4.2.1. Sysfs


    The sysfs filesystem was mentioned briefly above. One might wonder how sysfs knows
    about the devices present on a system and what device numbers should be used.
    Drivers that have been compiled into the kernel directly register their objects
    with sysfs as they are detected by the kernel. For compiled modules, this


    197'
  merge: -1
  pgno: 217
- img_proc: true
  md: '# Linux From Scratch - Version 7.1


    registration happen when the module is loaded. Once the sysfs filesystem is mounted
    (on /sys), data which the built-in drivers registered with sysfs are available
    to userspace processes and udev for processing (including modifications to device
    nodes).


    # 4.7.2.2. Udev Bootscripts


    The /etc/rc.d/init.d/udev iniscript takes care of creating device nodes when Linux
    is booted. The script unsets the uevent handler from the default of /sbin/hotplug.
    This is because the kernel no longer needs to replay uvents for any devices that
    have already registered. Unlike udev which listens on a socket for events that
    the kernel raises, the bootscript copies any static device node that exists in
    /lib/udev/devices to /dev. This is necessary because devices, directories, and
    symlinks are merged before dynamic device handling are possible during the early
    stages of booting system, or are created by udev itself. Creating static nodes
    in /lib/udev/devices also provides an easy workaround for devices that are not
    supported by the dynamic device handling infrastructure. The bootscript starts
    the udev daemon, udev, which will act on any events it receives. Finally, the
    bootscript finishes being registered and then waits for udev to handle them.


    The /etc/rc.d/init.d/udev_retry inscript takes care of re-triggering events for
    subsystems whose rules may rely on files that are not mounted until the mounts
    script is run (in particular, /usr and /var may cause this). This script runs
    after the mounts so rules (if re-triggered) should succeed the second time. It
    is configured from /etc/sys/udev_retry; any words in this file other than considered
    system rules to trigger at time. To find the subsystem of a device, use udevadm
    info --attribute-walk.


    # 4.7.2.3. Device Node Creation


    As of udev-181, no longer creates device files in /dev. This must be handled in
    the kernel, by devmpfs filesystem. Any driver that wishes to register a device
    node will go through devmpfs (via the driver core) to it. When devmpfs instance
    is mounted on /dev, the device node will initially be created with a fixed name,
    permissions, and order.


    A short time later, the kernel will send an event to udev. Based on the rules
    specified in file /etc/udev/rules.d, /lib/udev/rules.d and /run/udev/rules.directories,
    udev will create entries to link the name to the device, or change its properties,
    owner, or group, or modify the internal udev database entry for that object.


    The rules in these three directories are merged in a similar fashion to the LFS-scripts
    package, and all three directories are merged together. If udev cannot find a
    rule for the device it is creating, it will leave the permissions and ownership
    at whatever devmpfs used initially.


    # 4.7.2.4. Module Loading


    Device drivers compiled as modules may have aliases built into them. Aliases are
    visible in the output of the modinfo program and are usually related to the identifiers
    of devices supported by a module. For example, snd-pcm supports devices with vendor
    ID 0x1319 and device ID 0x0801, and has an alias of "pci:v00001319d00000081sdevbc4sc010".
    For most devices, the kernel exports the aliases of the device that would handle
    the device via sysfs. e.g., /sys/bus/pci/devices/0000:0d:0d.0/modalias might contain
    the string "pci:v00001319d00001319sdevbc4sc010". The default rules provided with
