  md: '# 6.41. Flex-2.5.35


    The Flex package contains a utility for generating programs that recognize patterns
    in text.


    Approximate build time: 0.7 SBU

    Required disk space: 28 MB


    # 6.41.1. Installation of Flex


    Apply a patch that fixes a bug in the C++ scanner generator, that causes scanner
    compilation to fail when using GCC-4.6.2:


    ```

    patch -Npl -i ../flex-2.5.35-gcc44-1.patch

    ```


    Prepare Flex for compilation:


    ```

    ./configure --prefix=/usr

    ```


    Compile the package:


    ```

    make

    ```


    To test the results (about 0.5 SBU), issue:


    ```

    make check

    ```


    Install the package:


    ```

    make install

    ```


    There are some packages that expect to find the lex library in /usr/lib. Create
    a symlink to account for this:


    ```

    ln -sv libflib.a /usr/lib/libl.a

    ```


    A few programs do not know about flex yet and try to run its predecessor, lex.
    To support those programs, create a wrapper script named that calls flex in lex
    emulation mode:


    ```

    cat > /usr/bin/lex << "EOF"

    #!/bin/sh

    # Begin /usr/bin/lex

    exec /usr/bin/flex -l "$@"


    # End /usr/bin/lex

    EOF

    chmod -v 755 /usr/bin/lex

    ```


    If desired, install the flex.pdf documentation file:


    ```

    mkdir -v /usr/share/doc/flex-2.5.35 \

    cp -v doc/flex.pdf /usr/share/doc/flex-2.5.35

