  md: '# 7208 Model 345 External 8-mm Tape Drive


    The 7208-345 External 8-mm Drive is a 5.25-inch device that can be used with all
    pSeries models. Of course, many pSeries servers offer an internal 8-mm tape option
    (#6156). The 7208 is a standalone device designed to be placed beside a pSeries
    system and attached to the pSeries systems through a SCSI port. It can be used
    for data interchange with other systems and for data backup. The Model 345 uses
    a cartridge capable of natively holding up to 60 GB of information. In addition,
    the Model 345 supports a data-compression function that allows up to 150 GB of
    data to be stored on a single cartridge. It supports a maximum information transfer
    rate of 12 Mbps in normal mode and 30 Mbps when data compression is being used.


    # DLT Options


    # 7205 Model 440 Digital Linear Tape Drive


    The 7205-440 employs DLT8000 technology and is designed for users who have large
    amounts of data to back and/or limited time for system backup. It is read/write
    compatible with previous DLT tape technologies. Each cartridge can hold up to
    40 GB of data (80 GB compressed) and provides an Ultra2-SCSI LVD data rate of
    6 Mbps (12 Mbps compressed).


    # 7205 Model 550 Digital Linear Tape Drive


    The 7205-550 also employs DLT8000 technology, but offers four times the capacity
    of the 7205-440 at a data rate up to 16 Mbps using an Ultra2-SCSI LVD interface.
    It is read/write compatible with previous DLT tape technologies. Each cartridge
    can hold up to 160 GB of data (320 GB compressed).


    # IBM TotalStorage Ultrium Tape Libraries


    The latest family of LTO (Linear Tape—Open) products offered by IBM is the TotalStorage
    Tape Library family, which use Ultrium 2 tape drives. LTO tape is a new technology,
    considered to be an excellent alternative to DLT, 8-mm, 4-mm, or 1/4-inch tape
    drives for streaming'
