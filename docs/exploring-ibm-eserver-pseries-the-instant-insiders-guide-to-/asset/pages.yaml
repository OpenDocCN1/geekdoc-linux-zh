  md: 'offloads from the AIX 5L operating system the TCP segmentation operation on
    outgoing traffic (transmit side). It also has “checksum offload,” meaning that
    the adapter handles the TCP/UDP checksum operation, rather than requiring the
    system processor to handle that workload. The 2-port adapter supports NIM and
