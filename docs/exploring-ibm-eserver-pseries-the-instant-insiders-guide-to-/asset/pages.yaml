  md: '# 10 Exploring IBM @server pSeries


    for four processors whereas the pSeries 620 Model 6F1 offers up to a 6-way SMP
    configuration. The reason for the distinction between Models 6F1 and 6FO is that
    the maximum of four processors in the p620-6FO qualifies it for workgroup pricing
    for popular software programs, such as Oracle and IBM DB2 databases, making the
    total system cost more attractive for many users.


    The rack-mount pSeries 630 Model 6C4 and desktop pSeries 630 Model E4 are 1-,
    2-, and 4-way SMP servers with either 1.2 GHz or 1.45 GHz POWER4+ processors.
    The 1- and 2-way configurations provide attractive entry points for small businesses,
    with room to grow in processing power, memory, and I/O capacity. The p630-6C4
    rack system meets NEBS Level 3 standards, which it is designed to withstand under
    rugged conditions of temperature, vibration, and the like. This versatile entry
    system also offers the flexibility of logical partitioning (LPAR—the acronym LPAR
    is used in this book to refer to "logical partitioning" as a technology or function
    to, which allows users to create four "virtual servers within a server." The p630-6E4
    is positioned as a replacement for the pSeries 640, and the p630-6E4 will replace
    the RS/6000 Model 270.


    The pSeries 640 is a rack-mountable server designed especially for high-density
    server farms in e-commerce and Telco applications. In addition, the 1- 4-way POWER3-II
    microprocessors used in the p640 provide the floating-point power needed for many
    HPC applications. The pSeries640 meets NEBS Level 3 standards, making it suitable
    for Telco and harsh environments.


    The pSeries 650 is IBM''s most popular midrange server. This 2-8-way rack-mount
    system offers 1.2 GHz or 1.45 GHz POWER4+ processors, LPAR support, and the capacity
    for attaching up to IBM 7311-D10 or 7311-D20 I/O expansion drawers. The p650,
    positioned as the POWER4-based replacement for the p660-6M1, is an excellent choice
    for business processes such as enterprise resource planning (ERP), supply chain
    management (SCM), customer relationship management (CRM) and business intelligence.


    The cluster-optimized pSeries 655 fills a special niche in the pSeries family.
    It is a high-density configuration, offering 4-way 1.7 GHz or 8-way 1.5 GHz processors
    in a compact unit that occupies 4 EIA units (4U) in half of a 24-inch rack. This
    allows up to 128 processors in a single 42U 24-inch frame, making the p655 an
