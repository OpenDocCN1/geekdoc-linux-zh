    the computer basically feels out the main memory than it actually has. The largest
    of today''s pSeries systems have 512 GB of main memory, an amount that only a
    few years ago would seemed impossible. Sixty-four pSeries systems allow 1 trillion
    TB of virtual memory to be addressed. Virtual memory allows more programs, data,
    and users to be simultaneously active on the system than can be supported in real
    memory without virtual memory. That is, allows you to make the most out of whatever
    size main memory you have.


    Here''s how virtual memory works. A user tells the computer to start a word-processing
    program. The computer would first attempt to load the needed portion of the word-processing
    program into main memory. If no space is left in main memory, some space will
    be made available by overwriting an inactive portion of some program or “swapping
    out” some inactive data to a temporary space in disk storage. The needed portion
    of the word-processing program can then be loaded into the available space and
    the user can begin typing. If the program that was overwritten or the data that
    was swapped out is needed again, it will be reloaded from disk storage to some
    other available main memory area. So a virtual memory computer system is constantly'
