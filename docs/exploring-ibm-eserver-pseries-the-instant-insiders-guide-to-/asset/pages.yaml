- pgno: 288
  md: '# 5

    npSeries and Your Environment


    An important first step in bringing in a pSeries system or any computer into a
    business environment is planning. Largely depending on how well planning is done,
    introducing new computer resource(s) can be like pouring water or gasoline on
    a fire. Many readers will already have computer systems installed in their businesses
    and are considering the addition of a pSeries system to their computer arsenal.
    Others are considering a pSeries system as their first computer. In either case,
    the information in this chapter should help in understanding how to introduce
    pSeries systems into a particular environment.


    The chapter starts by discussing the evaluation process critical to any automation
    project and then covers software selection, followed by a brief general discussion
    of differences among PCs, iSeries, and zSeries systems. Finally, some specific
    Series hardware configurations appropriate for example environments are offered.


    The latter part of the chapter includes discussions on financial decisions, physical
    planning, education, technical support, ergonomics, security, and service. This
    chapter is by no means a complete guide to introducing pSeries systems into a
    business environment, but it will give you a starting point for developing your
    plan and will discuss some important issues. Perhaps you will find in this chapter
    some new considerations that are applicable to your situation.'
  merge: -1
  img_proc: true
- pgno: 289
  md: '# What Are My Computing Needs?


    Many people today use some type of computer system(s) to do their job or run their
    business. These users constantly ask themselves if their current system is good
    enough. Those organizations that are still operated using manual methods must
    ask themselves if automating their organization might help. This book can''t answer
    the question for every customer, but it does give some of the relevant considerations.
    Whether an organization has millions of dollars'' worth of computer systems or
    none at all, the place to begin answering the question of automation (or additional
    automation) can help a company to look very closely at the organization and its
    needs. Too often, organizations buy computer systems and then look for problems
    to solve. A properly managed computer project should start with introspection
    into the collective needs of all functional areas within the organization. Independently
    attacking specific problems can often result in a “dead-end” computer solution
    that provides no coherent strategy for the future. From the very start, people
    from all areas of the organization should be collected into a project team. Because
    all areas will likely be involved, the top management of the organization must
    consistently demonstrate a commitment to the project. Without top management involvement,
    disagreements among the peer business areas are slow to be resolved and the sense
    of priority is diminished. Lack of consistent management commitment at either
    the investigation or the implementation phase of a computer project is a common
    cause of unsuccessful projects. The cost of a computer project''s failure is much
    higher than the cost doing it right in the first place.


    The project team should start by reviewing the overall goals of the organization
    (or segment of a larger organization) over the next few years. In some these goals
    will be well known, but in others a great deal of soul-searching will be necessary.
    These goals should be as specific as possible and include organizational strategies
    in place to achieve the goals.


    After the organization''s goals are clearly defined, the project team should look
    closely at the day-to-day operations of the organization as it is. Consider the
    movement of information through the entire organization. Only after the information
    flow is understood can the team realistically discuss what is good and what is
    bad about the current way of doing things. Work to identify the sources of problems
    rather'
  merge: -1
  img_proc: true
- pgno: 290
  md: 'than focusing on symptoms. Understand the interaction among the vari- areas
    of the organization. Consider the flow of information from one group to another
    as you trace the activities. Chances are, not every problem you will uncover with
    a computer solution. For example, an inventory management application program
    will not solve inventory problems in a business if unauthorized people can walk
    into the storeroom and get what they need. Computers and application programs
    are simple tools that can be used to effectively manage an organi-zation. People,
    not computer systems, manage organizations.


    After the current operation has been examined with a critical eye, it will become
    whether a computer solution makes sense for an or-ganization. In a small organization,
    this type of analysis can be done in a matter of weeks or even days. In larger
    organizations, it can span months or years and typically is done on ongoing basis.
    Some organizations choose to do the analysis on their own. For assistance in solving
    problems with computers, there are plenty of places to turn to, such as consultants,
    software companies, and computer manufacturers.


    # Choosing the Software


    Computer systems become a useful tool only when they are executing the appropriate
    application programs. There are many ways of generating a strategy for introducing
    computers, but considering software needs before selecting detailed hardware configurations
    usually makes sense. The hardware requirements, such as processor speed, memory
    size, disk space, and so on, will be based in part on the needs of the application
    program(s) selected.


    The application programs selected must perform the tasks needed by the end users
    in a company—both today and in the foreseeable future. Chapter 3 has already discussed
    some basic types of application programs commonly used today. Selecting the best
    type of application program usually is fairly simple. For example, an accounting
    department needs an accounting application program, a secretary needs a wordprocessing
    application program, and an engineer needs a computer-aided design application
    program. What is more difficult the specific application program that fits a company’s
    needs. Is a custom application program preferred, or will a prewritten application
    program be acceptable? If a prewritten application program is desired, exactly
    which one is best? If a custom application program is desired, who should write
    it and what should it include?'
  merge: -1
  img_proc: true
- pgno: 291
  md: 'The answers to these questions depend largely on the specifics of a given environment
    and are beyond the scope of this book. However, a few basics remain the same whether
    a program is being selected for a multinational corporation or for a corner fish
    market. First of all, the task to be done must be precisely understood before
    pursuing any application program alternatives. A thorough knowledge of the task
    helps to identify specific requirements an application program must meet. After
    a detailed understanding of the task is attained, a search can begin through the
    sea of prewritten, or "off-the-shelf," application programs. If an appropriate
    prewritten application program is found that fits a company’s needs, then the
    expense, delay, and effort associated with custom application program development
    can be avoided. Good prewritten application programs can be quite flexible. However,
    because everyone has slightly different needs and methods, within a given business
    function, it is likely that any prewritten application will have features not
    needed in a specific company and won''t have some features that would be desirable.


    There are many sources of information about the prewritten application programs.
    Software companies and consultants can recommend application programs to fit the
    needs of a business. Many popular computer magazines consistently extend reviews
    of prewritten application programs. These can be excellent and timely sources
    of information.


    For specific or highly specialized needs, prewritten application programs may
    not be adequate. In this case, custom-developed software may be desirable. The
    development and maintenance of custom software involves a long-term commitment
    that typically is expensive, but it may be costly in the long run to pay for the
    development of custom software than to settle for a prewritten application program
    that does not do the job. If the custom software is chosen, an important step
    is to select the proper developer. Organizations that have their own programming
    staff can do their own custom application program development. Companies that
    do not have their own programmers (probably small and medium-sized businesses)
    will find it necessary to seek help (i.e., an outside software developer). In
    either case, it is the developer who will have the largest effect on the ultimate
    success or failure of the custom development activity. The developer’s job is
    not an easy one. Besides programming expertise, developers must become experts
    in all aspects of the organization''s activities right down to every step performed.
    They must be good communicators to understand and discuss users'' requirements.
    They must understand human psychology'
  merge: -1
  img_proc: true
- pgno: 292
  md: '# Exploring IBM @server pSeries


    when defining the user interface for the program. They must be proficient teachers
    to train the end users on the new program. Finally, they must be dependable and
    reliable so that there will be technical support and software maintenance for
