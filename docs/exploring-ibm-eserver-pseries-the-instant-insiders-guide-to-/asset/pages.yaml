    # Communications Options


    This section will provide a quick communications tutorial and then an overview
    of communications options available for pSeries systems. These options are either
    feature cards installed in an adapter slot or external controllers attached to
    the pSeries systems. With these communications options, pSeries systems can be
    attached to external devices or in a variety of network environments using local
    area network (LAN) or wide area network (WAN) technologies. Chapter 4 describes
    how these options can be used to allow pSeries systems to participate in various
    communications configurations.


    # Communications Interfaces/Protocols—A Road Map


    One of the easiest areas in which to get confused in today''s computer environment
    is communications. This section will serve as a quick communications tutorial
    providing you with the background necessary to'
  merge: -1
  img_proc: true
- pgno: 184
  md: '# 158 Exploring IBM @server pSeries


    understand the differences among the various communications options covered in
    this chapter.

    A communications line can be thought of as a telephone wire or wireless link between
    two or more computer systems across long distances, or as a cable between a computer
    and peripheral devices in the same room, or by using multiple types of communications
    lines, information and host access can be provided to users in many locations.

    To be attached to a communications line, the pSeries system must first have the
    proper electrical interface. The term “interface” refers collectively to the connector,
    electrical voltage levels, connector pin functions, and so on that are provided
    for the attachment to a communications line. We will discuss options such as the
    EIA-232D, EIA-422A, MIL-STD-188-114, CCITT X.21, CCITT V.35, and Token-Ring interfaces.
    For our purposes, it is not necessary to understand exactly all these cryptic
    names mean. Simply know that different types of interfaces are necessary to support
    different types of communications.

    In addition to the different interfaces, you must also know about communications
    protocols to conversant in computer communications. Just as there are different
    rules of grammar and punctuation in English, French, and other languages, there
    are different rules for types of computer communications. In computer communications,
    a set of rules calls a communications protocol. The protocols of most interest
    for our purposes are the async, bisync, SDLC, X.25, CSMA/CD (IEEE 802.3), and
    Token-Ring (IEEE 802.5). Each of these protocols has the same basic goal of moving
    information from one place to another efficiently and reliably. Each protocol
    has advantages and disadvantages, and the proper choice depends on system requirements
    in the area of transmission speed, cost, and compatibility with the other devices
    in the network. At all times, however, all devices using a given communications
    line must be using the same protocol.

    The async protocol (short for asynchronous) is a low-speed, low-cost communications
    method very commonly used, but now used mainly for legacy devices such as ASCII
    terminals and hand-held devices such as barcode scanners or personal organizers.
    The async protocol is a good place to start in understanding the fundamentals
    of communications protocols. With async, individual bytes of information are transmitted
    (one bit at a time) with no fixed relationship between bytes. Figure 2.10 shows
    one way a byte might be packaged before it is'
  merge: -1
  img_proc: true
- pgno: 185
  md: '# Asynchronous Communications Data Organization


    7 bits of user data (e.g., ASCII code)


    | Start bit | | | | | Parity bit | Stop bit |


    **Figure 2.10.** Example data format used in ASCII asynchronous communications.


    sent over an async communications line. The start bit tells the receiving end
    that information is coming down the line. The user''s data follows the start bit.
    The parity bit is used by the receiving end to check for transmission errors in
    the user''s data. Finally, the stop bit signifies the end of the transmission
    of the character. This is just one example of how information might be transmitted
    over an async line. The async protocol has been used for many years, some types
    of equipment used slightly different data organizations used must be established
    at both ends of the communications link before communications can begin.


    Next is the bisync (short for Binary Synchronous Communications, or BSC). The
    “synchronous” means that a special character preceding the information synchronizes
    the receiver with the incoming information. This synchronization allows many bytes
    of information to be sent as a single block, in contrast to the asynchronous protocol,
    in which transmission occurs one by a time. The ability to send blocks of characters
    makes bisync more efficient than the asynchronous protocol. Bisync is an older
    protocol used by various kinds of equipment and different computers, including
    IBM''s System 360 and 370 mainframes. As a result of its popularity, many of today''s
    systems use bisync.


    The Synchronous Data Link Control is basically an updated version of bisync. As
    with bisync, SDLC is a synchronous protocol. However, SDLC is a more flexible
    protocol that is part of IBM''s Systems Network Architecture (SNA), which is a
    set of communications standards published by IBM that was used for many years
    as a road map to ensure compatible communications are provided for current and
    future computer systems and software. SNA'
  merge: -1
  img_proc: true
- pgno: 186
  md: '# Exploring IBM @serverPSeries


    has mostly been replaced by today''s Internet Protocol (IP)-based communications.


    The X.25 protocol is an industry standard used in the packet-switched networks
    available to the public. Whereas more traditional communications networks are
    based on analog (or voice-type) communications signals, packet-switched networks
    use digital (or computer-like) communications signals. Because computer information
    is naturally in digital form, packet-switched networks are better to carry information
    and can move the information more quickly. The X.25 protocol used on packet-switched
    networks splits the information (using the SDLC protocols as a packaging format,
    for example) into small groups of digital data called packets. Each packet is
    sent through the most economical and available route to its destination where
    in the network. Because each packet is routed in the most efficient way, overall
    information flow is improved over conventional techniques. X.25 is fully supported
    in IBM''s Systems Network Architecture (SNA) and Internet Protocol.


    The Carrier Sense Access/Collision Detection protocol is a protocol used on some
    Ethernet LANs to move information around the network in an orderly fashion. Its
    name is a mouthful, but really it''s a simple protocol. In fact, we follow this
    protocol in our everyday telephone conversations. There, too, only one person
    can speak at a time. One party waits for the other to finish before beginning
    to speak. The phone line thus carries only one party''s voice at a time, so the
    message is clear. This protocol handles the times when two nodes start simultaneously
    the same way two people do when both begin talking at the same time during a phone
    call. Both stop talking and begin again a few seconds later, hoping that time
    one begins sooner than the other. Similarly, with CSMA/CD protocol, if two (or
    more) nodes begin transmitting at the same time, the messages "collide" on the
    network. If such a collision occurs, all nodes stop transmitting and begin again
    after a pause of random length. All Ethernet LANs today are connected through
    a network of hubs and switches, rather than the CSMA/CD protocol is still used
    to negotiate among nodes connected to a hub. But at the next level in the LAN
    hierarchy, the Ethernet switch handles the contention among all nodes without
    using the CSMA/CD protocol.


    The Token-Ring network is another type of local area network. The Token-Ring protocol
    passes packets of information around the ring from'
