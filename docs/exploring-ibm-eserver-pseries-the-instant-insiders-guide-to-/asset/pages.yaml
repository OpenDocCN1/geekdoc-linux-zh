  md: '# 138 Exploring IBM @serverPSeries


    doing this, more read/write disk heads can be active on a single data file at
    any one time. However, should a disk fail, that data would be lost. RAID 5 all
    stripes data, but it maintains parity data as well. RAID 5, data that might be
    lost because of a disk failure can be rebuilt using the parity data. RAID 5 will
    obviously cost more because of the extra disk space, but it provides a better
    balance between performance and data protection/availability. RAID 1, often called
    mirroring environments. Two or three separate copies of all data are kept on separate
    disk disks. In the event of a disk failure, AIX uses another copy of the data
    from a surviving disk. Although performance is higher than RAID 5, RAID 1 also
    requires the use of more disks. Options also exist to combine multiple RAID functions
    such as striping with mirroring (RAID 0+1) using hardware and/software. RAID 10,
    which combines striping (RAID 0) and mirroring (RAID 1), offers some performance
    advantages over mirroring by itself, but not all controllers provides RAID 10
    mode of operation. AIX provides software implementations of striping or mirroring
    using host CPU processing. Hardware RAID adapters and external controller-based
    systems off-load the CPU processing and implement the RAID function in their microprocessors.


    There are two ways to provide external storage with RAID capacity in pSeries systems.
    One method is to attach the 2104 Expandable Storage Plus and the 7133 Serial Disk
    System described in the previous section using a RAID controller, as the PCI Ultra2-SCSI
    Ultra3-SCSI RAID adapters or the SSA multi-initiator/RAID adapter. The electronics
    to control the RAID functions are on the adapter, not in the external disk system.
    The other alternative is to attach an external system that incorporates RAID technology
    within the unit itself and is attached to the pSeries system by a non-RAID adapter.
    Several disk systems with integrated RAID capability are available from IBM.


    # Storage Area Networks


    Networks of host servers and high-capacity, high-performance storage systems are
    known as storage area networks, or SANs. SANs provide users of large systems with
    the capacity of sharing, managing, and protecting vital business information in
    widely dispersed locations. The design of a SAN system is complex and requires
    careful evaluation of many factors, including such things as the applications
    and amount of'
  merge: -1
  img_proc: true
- pgno: 165
  md: 'data traffic to the storage server, the type and location of host systems to
    be attached, data integrity and system availability requirements, and communications
    costs. A wide variety of IBM storage servers designed for use in SANs, coupled
    with other building blocks such as Tivoli Storage Manager, Fibre Channel switches,
    and storage gateway products, allow be used in high-performance, scalable SAN
    environments.


    A key technology for SAN connectivity is a serial communication protocol Fibre
    Channel Standard (FCS) and a lower cost implementation called Fibre Channel Arbitrated
    Loop (FC-AL). Fibre Channel-based products were first offered for IBM UNIX servers
    in 1999, and the breadth of offerings has grown rapidly over the past four years.
    In addition to the storings themselves, other SAN building blocks include Fibre
    Channel adapters, wiring hubs, switches, and network management software.


    SANs are a complex and evolving technology, and a wide variety of SAN products
    are available from various suppliers. The key is to have “open” system solution,
    meaning that heterogeneous systems and operating systems can operate together
    and share—if not a particular file—at least the storage subsystems and connecting
    network. IBM’s SAN architecture integrates many technologies—including operating
    systems, Fibre Channel adapters, hubs and switches, storage subsystems with RAID
    controllers, tape, optical, and SAN management software—to provide reliable, scalable,
    and versatile storage solutions. SANs can vary in scope and therefore, in the
    definition of openness. SANs may involve multiple servers using the same operating
    system and located in a single building or campus. Or, they could include servers
    over extended distances and requiring interoperability with servers from multiple
    vendors. A discussion of this topic is beyond the scope of this book, but the
    reader will find a link to the IBM Web site on SAN storage on the “Members Only”
    Web site at www.maxxpress.com.


    There are many storage subsystem and SAN products available from IBM. We will
    describe a few of the key storage servers designed for either the SAN environment
    or for attachment to a single pSeries server.


