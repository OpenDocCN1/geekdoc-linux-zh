    # Symmetric Multiprocessor Implementation


    The design of pSeries symmetric multiprocessor systems combines functions of both
    the processor and the AIX 5L operating system, along with complex logic for accessing
    memory and I/O buses. The basic design of any SMP system (Figure 1.32) involves
    multiple processors (CPUs) accessing a common, shared set of resources (for example,
    memory, fixed disk, communication adapters, and operating system). The processors
    communicate with each other and main memory via a bus.


    Each processor in the system will be performing separate jobs or running different
    programs at any point in time (for example, data-base access, terminal interaction,
    or network communication). Figure 1.32 gives you a look inside a symmetric multiprocessor
    system at a single point in time with several applications running on the system.
    It is important to say “single point in time” because, in a true multitasking
    environment, in the next few ticks of the system clock, these applications have
    an equal chance to be rescheduled on the same or other CPUs in the complex. The
    applications will also be swapped out when they have exhausted their time-slice
    to let other programs run.


    ![](img/29c52a1767a1e621ce6343faa9399737_130_0.png)


    **Figure 1.32.** Basic design of a typical N-way symmetric multiprocessor.'
