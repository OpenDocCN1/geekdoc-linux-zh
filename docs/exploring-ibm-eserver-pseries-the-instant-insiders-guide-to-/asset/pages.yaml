- pgno: 223
  md: '# Application Programs and Operating Systems 197


    pSeries systems provide the disk storage capacity, the communications interfaces,
    and the processing performance required to implement large databases and to support
    many users making queries of databases. Products such as IBM DB2® Universal Database
    (UDB) and Oracle 9i are often used in conjunction with other applications to provide
    complete industry-specific solutions. Since the database software is used between
    the end-user application program and the AIX 5L operating system, databases are
    sometimes called “middleware” products. Middleware products are those which work
    with the operating system to compose the infrastructure needed for a particular
    application.


    # Industry-Specific Application Programs


    Most companies will need specialized software designed for their particular industry
    or environment. These “industry-specific” application programs are written to
    address the needs of a well-defined environment. A research lab office has different
    application program needs than a dental practice. Such prewritten industry-specific
    application programs allow pSeries systems to be used effectively in highly specialized
    professional, and scientific environments.


    There are applications designed for market sectors like banking, manufacturing
    and distribution, telecommunications, Internet Service Providers (ISPs), retail,
    government and the public sector, healthcare, scientific research, petrochemicals,
    and research organizations—name only a few. Many software vendors offer modular
    software products, based on a single underlying software design, that can be tailored
    to the needs of various industries or types of users. This approach allows for,
    both a manufacturer and a healthcare provider to manage products or customer relationships
    using essentially the same software product—but with interfaces and specific functions
    suitable for their unique business environment. Users select only the software
    modules needed, which helps them control costs. Since the software design is used
    across all the industry-specific solutions, all customers benefit from improved
    software quality and stability.


    It would be impractical to list in this book in which pSeries servers are used—and
    almost impossible to identify all the software suppliers who offer products for
    each category. Readers who are interested in that level of detail can refer to
    the companion Web site for this book (www.maxpress.com) for links to applications'
  merge: -1
  img_proc: true
- pgno: 224
  md: 'software for pSeries systems. Some of the key applications areas in which pSeries
    servers include enterprise resource planning (ERP), supply chain management (SCM),
    customer relationship management (CRM), banking, retail, science and technology,
    e-business/e-commerce, and business intelligence (BI).


    There is a lot of overlap among these categories, since nearly every business
    or enterprise has some of the same computing requirements. For example, almost
    all organizations have customers or clients to support, and many have supplier
    interactions to manage. Today, almost every organization must manage Web-based
    interfaces for customers and employees. Finally, many different kinds of customers
    need real-time data to measure levels of service, orders and deliveries, and inventory.


    # Custom Application Programs


    Although cross-industry and industry-specific application programs fit many needs,
    others require software designed to perform unusual and specific tasks or to conform
    with existing procedures. In these cases, it is often better to develop custom
    application programs written to exact specifications.


    Custom application programs may be written by programmers within the company or
    by an outside consulting firm. In either case, the basic development steps are
    first to write a software specification that describes what the program will do.
    Then a preliminary version of the program is written that demonstrates the function
    that will eventually be in the final program. This preliminary version is evaluated
    by the user, and the specification is altered to reflect any needed changes. The
    final program is written and installed at the user''s location. Typically, training
    will be provided by the developer and any problems iron out. Once the user accepts
    the program, the software then has to be supported. That is, users need a place
    to go when they have questions not addressed by the manuals. Support also includes
    making changes to the application program as the user''s needs change over time.
    This kind of ongoing support is critical to the success of any computer automation
    project.


    Custom application program development is expensive and time-consuming, compared
    to the prewritten application program approach. But some companies may find that
    this additional expense and time can be recovered by the increased productivity
    and competitive advantage'
