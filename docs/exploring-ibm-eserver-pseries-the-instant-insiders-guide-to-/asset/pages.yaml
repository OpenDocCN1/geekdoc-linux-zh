    They are placed on a desktop near the server and attached to the pSeries systems
    by a cable to a graphics adapter in one of the PCI slots. Graphics adapter options
    will be discussed in the next section.


    The color used with pSeries systems provide high-resolution, full-color images.
    The IBM displays currently available, with their maximum viewable screen size
    when measured diagonally and maximum flicker-free resolution, are listed next.'
