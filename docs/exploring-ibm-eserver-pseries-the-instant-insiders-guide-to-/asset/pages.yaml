- pgno: 27
  md: '# # 1

    IBM @server pSeries—An Overview


    This chapter begins with an overview of pSeries, then moves in for a closer look
    at the design details of specific models. As mentioned in the Introduction, “pSeries”
    will refer to both pSeries and the remaining available RS/6000 systems, except
    as required for historical accuracy or to describe individual computer models.


    # Meet the Family


    The IBM pSeries family is IBM’s third generation of computers based on the Reduced
    Instruction Set Computing (RISC) architecture developed by IBM in the late 1970s.
    With this concept, a very simple set of programming instructions is used to perform
    work within the computer system. Because the instructions are very simple, they
    can be executed at extremely high speed, and also lend themselves to a more efficient
    implementation of the program being executed. The RISC architecture was first
    introduced in the IBM RT Personal Computer, later renamed the IBM RT System. The
    RS/6000 was the second generation of systems based on the RISC architecture, using
    the Performance Optimized With Enhanced RISC (POWER) architecture, and its PowerPC
    (including the RS64 superscalar processor family, optimized'
  merge: -1
  img_proc: true
- pgno: 28
  md: '# Exploring IBM @server pSeries


    for commercial workloads), POWER2™, and POWER3™ derivatives. The POWER architecture
    combines the concepts of the original RISC architecture with a sprinkling of more
    traditional concepts to create systems with optimum overall performance. The pSeries
    of servers, the third generation of RISC products, was introduced using the POWER3
    and PowerPC architectures. The latest RISC generation—POWER4—was introduced in
    October 2001 on the pSeries 690 server, and this architecture has been followed
    by POWER4+TM technology on the most recent pSeries models.


    The pSeries family is designed to address the computing needs of both high-performance
    computing (HPC) users and those who run more general commercial applications.
    High-performance computing applications can be found in business, government,
    and academic environments in areas as statistical analysis, geological analysis,
    molecular chemistry simulations, artificial intelligence, and life sciences. The
    engineering/scientific user may perform such tasks as designing mechanical devices
    on the screen (computer-aided design, or CAD), simulating physical stresses to
    test the strength of the design (computer-aided engineering, or CAE), and then
    automatically generating the programming necessary to manufacture the part with
    numerical control tools (computer-aided manufacturing, or CAM). Many HPC applications
    are best implemented on shared servers or clusters of servers, with each user
    having a PC as his or her workstation.


    If three-dimensional (3D) graphics capability is required for the application
    (in the case of automotive or aircraft design), then an IBM IntelliStation POWER
    275 or 265, the pSeries 630 Model 6E4, or one with large display and specialized
    input devices, as the IBM Spaceball, should be selected as that user''s personal
    workstation. These workstations are usually networked to allow the user community
    to share programs, data, and peripheral equipment.


    Another type of environment addressed by pSeries computers is of traditional commercial
    applications found in business, government, and academic organizations. In these
    environments, a single pSeries server or cluster of servers is shared by multiple
    users, each working at a personal computer (PC), which is connected to the server
    on a local area network (LAN). Applications in commercial environments cover a
    great range, from general accounting and order entry to the most advanced database
    management systems for supply chain management, data mining, and business-to-business
    transactions using the Internet. Sometimes'
  merge: -1
  img_proc: true
- pgno: 29
  md: '# IBM @serverpSeries—An Overview 3


    in the commercial environment there are also technical business users who, like
    engineering/scientific users, need their own pSeries system dedicated to demanding
    applications as business statistical analysis, financial analysis, economic simulations,
    and securities trading. These users will usually be attached to a LAN, allowing
    them to share programs, data, and peripheral equipment with other users and to
    access the Internet.


    The pSeries family uses the AIX 5L operating system, IBM''s version of the UNIX
    operating system. In AIX 5L, IBM has combined the basic functions of the UNIX
    operating system with many enhancements, both developed by IBM and those designed
    by other companies and academic institutions. AIX 5L adheres to many industry
    standards that have been developed to make systems from various vendors more compatible
    and to facilitate interchange between different manufacturers.


    Because the AIX 5L operating system conforms to many industry standards, the pSeries
    family is considered an open system. This means that the AIX 5L operating system
    conforms to standards (programming interfaces, communications protocols, and so
    on) defined by independent standards rather than using an IBM proprietary standards
    not generally adhered to by other computer manufacturers. The advantage of the
    open-system strategy comes when an independent development company writes an application
    program conforming to these industry standards. Because many computer manufacturers
    of open-system computers can offer its application program on many brands of computers.
    The advantages of open systems to computer users are that (1) after selecting
    the application program that meets their needs, they have more flexibility as
    to which brand of open-system computer to buy, (2) after users have purchased
    the large body of open application programs they can choose to meet new needs
    as they emerge, and (3) users have the flexibility to purchase multiple open-system
    computers of different brands and know that they will be able to interoperate
    over a communications network.


    The open-system concept is not without its difficulties, however. First, multiple
    organizations are simultaneously defining standards for the same open-system environment.
    This leads to conflicts and incompatibilities. Further, although open-system computer
    manufacturers conform to industry standards, they also offer proprietary extensions
    to help differentiate their open-system computers from those of others.'
  merge: -1
  img_proc: true
