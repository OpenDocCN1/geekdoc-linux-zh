    system. The activation process is the same as activating CuOD processors. That
    is, the appropriate 4 GB activation feature is ordered, and IBM provides an encrypted
    key (activation code), which the user applies when more memory is needed.


    # On/Off Capacity on Demand


    On p690, p670, and p650 systems with CuOD processors installed, another type of
    processor activation is available—on/off or temporary CoD. This capability does
    not apply to memory CuOD, but only to processors. Rather than purchasing a permanent
    activation feature for a pair of processors, as described in "Capacity Upgrade
    on Demand," an On/Off CoD feature provides a way to activate processors for infrequent
    workload increases. For instance, a business may have infrequent seasonal workload
    or may need extra processing power for a short time to test a new application.


    On/Off CoD works like a prepaid phone card. Each feature entails the customer
    to 60 processor days of usage, measured for each 24-hour period during which a
    processor is activated. Processors are still activated in pairs. If more than
    two CuOD processors are available, multiple pairs of processors can be activated
    using a single On/Off CoD activation feature. Like the activation features for
    processor and memory CuOD, the user is sent an encrypted key to activate one or
    more pairs of processors.


    A processor usage day is charged beginning when the pair of processors is turned
    on and then each 24-hour period of continuous usage thereafter. The minimum usage
    time measured is one day. For example, if a pair of processors is turned on at
    eight o''clock in the morning and then at five o''clock in the afternoon, two
    processor days are charged. Or, if four processors are activated at eight o''clock
    one morning and are deactivated at noon the next day (28 hours later), eight processor
    days are charged (four processors times two days).


    On/Off CoD is a valuable tool for some businesses, but it is not for everyone.
    Companies who are seeking to minimize their investment while preparing to handle
    growing workloads will probably find their requirements adequately met with processor
    and memory CuOD. On/Off CoD is designed as a buffer against unexpected or very
    infrequent spikes in workload.'
