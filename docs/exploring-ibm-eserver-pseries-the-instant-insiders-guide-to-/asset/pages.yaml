    # Distributed Computing


    Among the most far-reaching extensions to AIX 5L are the AIX Distributed Computing
    Environment products. In the open-system environment, many different brands of
    computers are typically found in the same communications network. An environment
    in which many small computers (rather than one central computer) are used to satisfy
    the computing needs of users is a distributed computing environment. Although
    the computer systems are physically attached via the network, the application
    program(s) running on one computer system or operating system can''t interact
    effectively with an application program running on a different computer system
    or operating system—even when no one is breaking open-system rules. This problem
    becomes more apparent as networks grow and users on one workstation (a client
    workstation) need access to the resources located on another computer (a server).


    One way to address the need for a more homogeneous environment for distributed
    computing is to provide a set of common services that are always present in a
    distributed computing environment. Then any'
  merge: -1
  img_proc: true
