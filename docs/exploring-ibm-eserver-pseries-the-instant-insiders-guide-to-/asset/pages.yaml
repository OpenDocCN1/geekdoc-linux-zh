    The Models 150 and B50 will accommodate up to four ECC 10-ns SDRAM DIMMs. The
    minimum memory configuration is 128 MB, and the default for this is a single 128
    MB DIMM. The DIMMs are available in three sizes: 64 MB (#4149), available only
    on Model 150, 128 MB (#4150), and 256 MB (#4169). It is not necessary to install
    these DIMMs in pairs. The maximum memory of 1,024 MB (1 GB) can be achieved with
    four of the 256 MB DIMMs (#4169).


