- pgno: 221
  md: '# Application Programs


    The previous discussion covered the three basic software layers in pSeries systems
    that cooperate to perform useful work for the user. Now we turn our attention
    to the top layer of our software model—application programs (see Figure 3.2, shown
    previously). It is the application program that “applies” the pSeries system''s
    computational power to a particular task. Some companies choose from available
    application programs designed, written, and sold by various software suppliers.
    They are called prewritten application programs. Other businesses design and write
    their own custom application programs or use a combination of prewritten and custom
    application programs. Although some basic types of application programs will be
    discussed, this chapter is by no means a comprehensive guide to application programs.


    Application programs range from simple programs that concentrate on a very specific
    task designed to work. They perform a myriad of functions as diverse as the environments
    in which you find computers today. Every person who uses a personal computer (PC)
    is familiar with prewritten application programs—word processors, spreadsheets,
    databases, graphics presentation packages, and Web browsers. These are known as
    cross-industry application packages because they provide basic tools that are
    used by every type of enterprise to communicate with one another and manage information.
    pSeries systems are targeted to the server marketplace and seldom seldom run these
    common personality applications on a PC attached to the server on a local area
    network (LAN).


    Just as word-processor and graphics presentation programs are important tools
    for individuals to use on a personal computer for documenting ideas and information
    and for communicating with others, there are many applications available for use
    on pSeries servers. Some applications, such as databases, are useful in almost
    every type of business. Database applications store information in a structured
    way and allow access in a variety of formats or “views,” depending on the needs
    of the user. For readers who are not familiar with databases, the following simple
    illustration will explain how they work.


    To deal with large amounts of information efficiently, it is necessary to organize
    the information in a uniform manner. For example, the information in a telephone
    book is organized into an alphabetical list of names, addresses, and telephone
    numbers.'
