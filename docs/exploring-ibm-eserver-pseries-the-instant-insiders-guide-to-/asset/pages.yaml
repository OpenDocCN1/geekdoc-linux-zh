    # 10/100 Mbps Ethernet PCI Adapter II (#4962)


    The 100/100 Mbps Ethernet PCI Adapter II (#4962) is a small-factor, high-performance,
    low-power Ethernet adapter. Like the other #2968, it supports 10 Base-T attachment
    using either CAT-3 or CAT-5 unshielded twisted pair and 100 Base-TX using CAT-5
    UTP. This adapter supports network boot and AIX Network Install Manager.


