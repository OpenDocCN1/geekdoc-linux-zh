    This RAID adapter supports up to two loops of 48 devices (a total of 96 disks,
    with an instantaneous data transfer rate of 160 Mbps per loop. The adapter can
    be configured for several modes of operation.

    In 8-way or eight-initiator-RAID mode, up to eight adapters can operate on the
