    bus is available for any other SCSI bus traffic. When the target device is ready,
    it gains control of the bus and supplies the requested information along with
    a completion status indicator to the original initiator.


    One of the primary differences between SCSI and earlier disk interfaces is that
    each SCSI device must have local processing capability to participate in the SCSI
    command protocol. That is, each SCSI device attached to the bus is responsible
    for much of its own processing (e.g., error checking, error correction, and retry
    of failed operations). Earlier disk interface standards put the responsibility
    for managing the various devices in a centralized I/O controller rather than distributing
    the responsibility among the connecting devices.


