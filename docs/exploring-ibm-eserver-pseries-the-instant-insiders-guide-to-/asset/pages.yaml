    When a controlling device, called an initiator (e.g., the SCSI I/O controller),
    wants to perform an information transfer with another device (e.g., a disk unit),
    called a target, the initiator arbitrates for control of the SCSI bus. Once the
    initiator has control of the bus, it issues one of the commands defined in the
