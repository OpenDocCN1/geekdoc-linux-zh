    # What About 64-Bit Capability?


    Before we go into further detail, let''s discuss this whole notion of 64-bit computing
    power and what it means to you. This is an issue that has been confusing to many
    people for a number of years. After, not long ago we were all running operating
    systems with just 16-bit ad-dressing on our desktops.


    The primary advantage of using more bits is gaining addressability for more memory.
    Until very recently, most UNIX operating systems were 32-bit systems, allowing
    memory up to 4 GB to be addressed. Now, 4 GB is an awful lot of real memory, but
    the performance of very large applications can be improved by having even more.
    When you go to 64-bit addressability, the theoretical limit on your memory goes
    up to a whopping 16 TB (16,000,000,000,000,000 bytes). Figure 3.12 illustrates
    the exponential growth in addressability as the number of bits available grows.
    It should be several years before we outgrow the capabilities in 64-bit addressing
    (notice, we don''t say never).'
  merge: -1
  img_proc: true
- pgno: 261
  md: '# Application Programs and Operating Systems 235


    | Number of Bits | Addressable Bytes | Theoretical Memory Limit |

    |---|---|--|

    | 8 | 2 raised to the power 8 | 256 bytes |

    | 16 | 2 raised to the power 16 | 64 KB |

    | 32 | 2 raised to the power 32 | 4 GB |

    | 64 | 2 raised to the power 64 | 16 million TB |


    **Figure 3.12.** Memory addressability for operating systems with varying numbers
    of bits.


    Let''s assume that you are a manufacturing firm and that you have a relatively
    large database of, say 30 GB, which you make available to your enterprise applications
    as human resources, accounting, and distribution. If you have a UNIX system with
    16 GB of main memory, you can load large segments of your database into real memory,
    increasing the likelihood that the data you require will be in main memory. This
    allows you to avoid the performance hit of going to the disks for the information,
    swapping or paging this data into real memory, and writing the replaced data back
    to the disk.


    The preceding example assumed a 64-bit database as well as operating system and
    hardware, allowing big “chunks” (more than 4 GB) to be manipulated at one time.
    However, even if an individual database is not that large, performance advantages
    can still be realized by having a 64-bit operating system and large memory available.
    In this case, you may have several applications and many processes running more
    than, say, 2 GB or 3 GB of memory (or even considerably), greater amounts of total
    memory will reduce memory contention between the processes that are running.


    AIX 5L gives the application developer and the end user a full 64bit environment.
    It supports 64-bit hardware, which includes all pSeries systems and currently
    available RS/6000 systems except Models B550 and 150, and 64-bit applications,
    such as Oracle 8 and IBM DB2. AIX 5L has preserved full binary compatibility with
    previous hardware and applications. Existing 32-bit applications will run absolutely
    unchanged and without performance degradation on AIX 5L. It will run on all of
    the existing 32-bit RS/6000 systems that are still supported. This is important
    to many users because they prefer, for ease of management, to have all of the
    systems in their enterprise the same'
  merge: -1
  img_proc: true
- pgno: 262
  md: '# Exploring IBM@server pSeries


    operating system level. With AIX 5L, 64-bit and unusual 32-bit systems can have
    the same operating system installed, and 64-bit systems can also run 32-bit and
    64-bit applications at the same time.


    Since AIX 5L provides either a 32-bit kernel or a 64-bit kernel (selection at
    installation), a word about compatibility using AIX 5L is in order. The 32-bit
    kernel provides compatibility with existing 32-bit AIX applications, while the
    64-bit kernel includes 64-bit device drivers and APIs, enabling increased use
    of resources and larger application workflows on 64-bit hardware. Obviously, most
    pSeries systems have 64-bit architecture, it is advantageous to install the 64-bit
    kernel in most situations.


    From a compatibility standpoint, applications written to earlier AIX 32-bit versions
    are binary compatible and will run on AIX 5L (both 32-bit and 64-bit), except
    in some unusual circumstances, such as the programmer having used undocumented
    software interfaces. Note that 64-bit applications produced using AI Version 4
    will not execute directly on AIX 5L. Those applications must be recompiled before
    they execute on AIX 5L.


    The next question you may have about your 32-bit applications is, "Should I recompile
    them to 64 bits to gain further performance advantage?" The answer is simple:
    Unless your application is under stress constraint, you will not improve performance
    by a recompile. In fact, you will really end up is increasing the application
    footprint because your pointers take twice as much in 64-bit applications.


    One last point about compatibility between 32-bit and 64-bit systems is this:
    Application developers can develop 64-bit applications even if they are using
    AIX 5L on a 32-bit system. The ability to build 64-bit objects does not depend
    on having 64-bit hardware. Of course, running these objects do require the full
    64-bit environment.


    AIX 5L has the predominant standard that this is the Single UNIX Specification,
    Version 2 (http://www.rdg.opengroup.org/public/tech/unixversion2/). This specification
    addresses issues such as the API, large file support (AIX 5L v5.2 supports files
    as large as 16 TB), Compliance with this standard has been verified to the satisfaction
    of the Open Group, and AIX 5L has also adopted the 64-bit data standard called
    LP64, as is shown in Figure 3.13. This defines for developers how many bits should
    be allocated for the various data types.'
  merge: -1
  img_proc: true
- pgno: 263
  md: '# Application Programs and Operating Systems 237


    | Data Type | LP64 | ILP32 |

    |---|---|--|

    | char | 8 bits | 8 bits |

    | short | 16 bits | 16 bits |

    | int | 32 bits | 32 bits |

    | long | 64 bits | 32 bits |

    | pointer | 64 bits | 32 bits |


    **Figure 3.13.** AIX uses the industry 64-bit data standard LP64. This chart shows
    the number of bits used by the different data types in the LP64 standard as well
    as the 32-bit ILP32 standard.


    # AIX 5L Summary


    AIX 5L, together with the Bonus Pack, Expansion Pack, and Web Download Pack, provides
    an open, high-performance UNIX operating system with a rich set of networking
    and security features, systems management and performance analysis tools, and
    application development facilities. AIX 5L supports the most recent pSeries hardware
    technology as well as the latest open-system standards and technologies. As has
    been the case since AIX was introduced in 1986, AIX 5L will continue to be enhanced
    as hardware, software, and network technologies.


    # The Linux Operating System


    It''s easy to see that the Linux operating system, once a phenomenon of academic
    or investigative interest, has moved fully to the stage of commercial implementation.
    Just walk through your local computer store and notice all the Linux distributions
    and Linux applications that are available. Or browse some software sites on the
    Internet, and it will be obvious that Linux is here to stay. Most of the Linux
    products in the stores are designed for Intel-based systems for small business
    and home use. But there are several distributors of Linux and suppliers of Linux
    services that provide the products and services that businesses require in order
    to embrace Linux as one of their operating system options—or perhaps as their
    only operating system.'
  merge: -1
  img_proc: true
- pgno: 264
  md: '# 238 Exploring IBM@serverSeries


    IBM in general, and pSeries in particular, have embraced Linux and open source
    software as key components in taking e-business to the next level. Along with
    other open standards, such as HTTP, XML, and TCP, Linux plays a pivotal role in
    bringing interoperability to disparate server platforms and providing customers
    with an open, integrated e-business structure. Linux has evolved into an industry
    standard, and IBM continues to work with Linux and open source communities to
    support open source software and related standards across its servers. Linux is
    UNIX in the sense that it is based on the open-system design philosophy used in
    the original UNIX development, but Linux is not a UNIX operating system. Whereas
    UNIX has split into several competing UNIX operating systems, such as IBM''s AI
    5L and Sun Microsystems'' Solaris, Linux is a distinct single-source operating
    system. Because of its strict adherence to open-standard systems, Linux does not
    have all the extensions that have been developed for the variouse UNIX implementations,
    since those enhancements may depend on unique capabilities of one particular manufacturer''s
    systems. But Linux is an outgrowth of the UNIX heritage, it is a natural fit for
