    # Memory Expansion Options


    Nothing seems to grow faster than the computer user''s appetite for main memory.
    Several different options allow the user to expand the main memory in pSeries
    computers. However, owing to technical differences inside the systems, memory
    expansion options are not interchangeable among all pSeries models. Main memory
    systems of all available pSeries and RS/6000 systems use the Error Checking and
    Correction (ECC) method to detect and offset correct memory problems, as discussed
    in Chapter 1. The latest POWER4+ servers—p615, p630, p650, p655, p670, and p690—also
    implement Chipkill memory, decreasing even further the likelihood of a system
    outage due to memory failure.


    The following discussion of memory features covers the currently available pSeries
    and RS/6000 systems.


