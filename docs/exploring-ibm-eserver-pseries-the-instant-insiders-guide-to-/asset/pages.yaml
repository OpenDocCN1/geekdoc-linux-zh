    # 2104 SCSI Expandable Storage Plus


    The IBM 2104 Expandable Storage Plus (EXP Plus) provides flexible, scalable, and
    low-cost external SCSI storage for pSeries servers. The EXP Plus is available
    in two types of packages—the Model TU3 is a standalone tower; the Model DU3 is
    designed to be mounted in a 19-inch rack and offers optional 48-volt DC power
    for telecommunications customers. Each can hold up to 14 Ultra3-SCSI (160 Mbps)
    10K rpm drives of 18.2 GB, 36.4 GB, 73.4 GB, or 146.8 GB, allowing a maximum capacity
    of 2.055 TB. The 2104 also supports 36.4 GB and 73.4 GB 15K rpm drives. Drives
    can be hot-plugged while the unit is operating. Redundant power is available as
    an option for each model.'
