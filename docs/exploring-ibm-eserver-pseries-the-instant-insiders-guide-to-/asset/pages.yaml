  md: '# Options and Peripherals 169


    and various physical connections. Cable options are available for configuring
    the system for the particular network in which the pseries is attached. These
    multiprotocol adapters are part of the AIX Realtime Interface Coprocessors (ARTIC)
    family of adapters designed to remove the burden of communications traffic from
    the pseries by handling the detailed processing associated with communications
    links and nonstandard device interfaces.


    The IBM AIX960Hx 4-Port Multiprotocol PCI Adapter (#2947) provides four ports
    for EIA-232, EIA-530, RS-449, X.21, or V.35. Each port can support speeds up to
    2 Mbps. Using the appropriate software support provided with AIX, this adapter
    provides SDLC, bisync, or X.25 packet-switched communications capability. The
    adapter requires one full-length 32-bit PCI slot.


    The 2-port Multiprotocol PCI Adapter (#2962) provides high-speed connections between
    standalone systems on a WAN, connected via external communications equipment such
    as Service Units (CSUs), Data Service Units (DSUs), and synchronous mediums. Using
