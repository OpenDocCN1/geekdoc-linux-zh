    request comes, if the needed information is already available in the buffer area,
    it can be sent to the SCSI I/O controller immediately, eliminating the mechanical
    delays associated with disk seek time, latency, and so on. The result is highly
    efficient transfer of information between the SCSI I/O controller and the disk
