    # Virtual Private Networks


    With the pervasiveness of the Internet, one choice for a company’s communications
    with customers, employees, and suppliers is simply to use the Internet. Most often,
    some security measures will be used, such as password protection and routers with
    firewall and network address translation capability. Such an arrangement may be
    adequate for routine communications, such as e-mail and non-confidential data
    transmissions. However, if the customer or business data to be communicated is
    sensitive—data that could be used by an “eavesdropper” to steal proprietary information
    or cause denial of service attacks—then there are security concerns that must
    be considered.


    One alternative is the implementation of a private TCP/IP-based private-line network,
    in which the communications are controlled by the company and probably operated
    by a telecommunications provider. The previous two examples of distributed communications
    (Figures 4.2 and 4.3) showed a lease as the link between two locations, and Figure
    4.2 is a leased-line network using the TCP/IP protocol.


    But rather incur the costs of a private-line network using leased telecommunications
    facilities, a company may choose to implement a Virtual Private Network (VPN).
    A VPN refers to the use of the Internet (or any public network, for that matter)
    as the vehicle for implementing a private network or extension of a company’s
    “private” in the sense that the data flowing through it is private. But since
    a VPN operates over a public network (i.e., the Internet), it is really no “private”
    in the physical sense. And, it is a “virtual” network because it has to operate
    over any physical infrastructure.'
