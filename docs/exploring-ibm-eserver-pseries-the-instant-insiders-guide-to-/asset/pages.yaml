    # RAID Technology


    RAID technology is used in many systems, especially those with large amounts of
    disk storage, to help improve reliability and data integrity. The acronym RAID
    originally stood for Redundant Arrays of Inexpensive Dis, since the technology
    was developed to provide improved data integrity for systems using inexpensive
    disk drives designed for the personal computer (PC) market, but now many people
    say that RAID stands for Redundant Arrays of Independent Disks, since the disks
    used in modern RAID arrays are state-of-the-art devices—not just the expensive
    disks available. Whichever definition of the acronym you use, the important point
    is that RAID technology allows data to be written and stored on two or more drives,
    that in the event of a disk failure, data integrity can be maintained.


    Three different RAID types are popular. These types are designated by numbers:
    RAID 0, RAID 1, and RAID 5 (Figure 2.3). Other RAID types are occasionally used,
    but we''ll focus on these. In RAID 0, data gets written to sequential sets of
    disks in a technique called stripping. By'
  merge: -1
