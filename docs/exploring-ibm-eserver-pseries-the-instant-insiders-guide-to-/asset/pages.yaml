    # Disk Management


    One of the jobs performed by the systems administrator of a computer system is
    to subdivide and allocate (manage) the available disk storage to meet the needs
    of the users. The systems administrator uses functions of system to manage the
    disks. Many UNIX operating systems conceptually subdivide a computer''s disk storage
    into many smaller disks called file systems. These file systems can then be used
    to hold programs, data files, and so on. The systems administrator must'
  merge: -1
  img_proc: true
- pgno: 243
  md: '# Application Programs and Operating Systems 217


    decide how large each file system needs to be during the initial installation
    of the application program. However, it is difficult to judge how large a given
    file system needs to be until the system has been in productive use for a while.
    Because it is difficult to increase the size of a file system after the system
    is in productive use, herein lies a problem with the disk management approach
    taken by most traditional UNIX operating systems. Another limitation commonly
    found in UNIX operating systems is that a single file cannot span more than one
    physical disk. That is, the file size is limited by the size of each individual
    disk drive installed in the computer system rather than by the total amount of
    disk storage in the computer system. As application programs grow more sophisticated,
    file systems larger than a single physical drive are desirable.


    To address these limitations, the AIX 5 operating system has expanded on the file
    system of the UNIX operating systems (and earlier AIX versions) with the Logical
    Volume Manager (LVM). The LVM conceptually partitions a group of physical disks
    (up to 128) into equal-sized sections called physical partitions. A logical volume
    is a collection of these physical partitions, conceptually equivalent to a file
    system. One difference in this approach is that a single logical volume can consist
    of physical partitions from multiple disk units in the computer system. This means
    that a logical volume can be larger than any individual disk unit in the system
    if necessary. Another difference is that physical partitions can easily be added
    to a logical volume to increase its size without disrupting normal operation or
    moving any other partition.


    One function of the LVM is mirroring. This feature allows for multiple (or mirror)
    copies of a logical volume to be automatically maintained in disk storage. Each
    physical partition of a mirrored volume has one or two other physical partitions
    allocated on different physical disks to hold identical copies of the data. If
    a permanent disk error occurs while reading a mirrored volume, the LVM will automatically
    read the data from one of the mirrored physical partitions and write any new data
    to a new area of disk. Thus the mirroring function of the LVM often allows a pSeries
    system to recover from permanent errors without disrupting normal system operation.
    Systems providing redundancy for automatic error-recovery purposes are said to
    be designed for high availability. Be aware, however, that you are keeping multiple
    copies of information in the disk system, more disk space will be required when
    the mirroring function is used.'
  merge: -1
  img_proc: true
