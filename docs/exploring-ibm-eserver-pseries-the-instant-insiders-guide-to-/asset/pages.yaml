- pgno: 276
  md: '# 250 Exploring IBM@serverpSeries


    dotted line) through the Internet for a transmission. Such tunnels are created,
    used for one transmission or sequence of transmissions, and then terminated. Thus,
    the VPN is “virtual” (it is not permanently associated with any specific set of
    physical transmission facilities), “private” (protocols and encryption protect
    the company’s data from others), and a “network” (it interfaces and extends the
    intranet network in a well-structured way that is transparent to the computers
    at each end).


    There are many trade-offs to be considered in designing a VPN. First, there are
    security concerns, which involve both the transmission across the public Internet
    and the internal security policies and facilities at the company and remote sites.
    Next, there is performance. In particular, encryption and transmission logging
    take a lot of processor power and storage. Service-level agreements and methodologies
    must be established with ISP. Another consideration is the people involved. Does
    the VPN provide easy-to-use communications, and are the users trained and instructed
    with regard to security policy? Finally, there is the question of initial and
    recurring costs. What is the value to a specific company of various levels of
    security, performance, and responsiveness in a proposed VPN? There is no single
    answer for every situation, but a competent networking consultant can help a company
    make cost/benefit decisions.


    VPNs are not the private province of any one manufacturer. In fact, the VPN concept
    is designed to allow implementation across a heterogeneous set of servers, routers,
    and communications links. In summary, pSeries servers and AIX 5L operating system
    provide the features (e.g., Ethernet adapters, cryptographic coprocessors, and
    accelerators) and the networking software that conform to industry standards allows
    all users to integrate pSeries servers into cost-effective and secure VPNs.


    # pSeries and LANs


    A LAN provides one way for groups of computers located in the same building or
    on a single campus to communicate very efficiently. The most common arrangement
    for attaching user PCs to a pSeries server is by LAN, and, of course, multiple
    pSeries systems can also be attached to the LAN. LANs can move information around
    very quickly. This is important because the speed of a communications link can
