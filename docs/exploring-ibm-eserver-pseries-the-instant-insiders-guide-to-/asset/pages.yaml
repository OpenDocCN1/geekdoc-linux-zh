  md: '# Exploring IBM @serverSeries


    Processor speed or clock rate is just one factor in determining system-level performance,
    and the pSeries 610 design provides outstanding internal bandwidth to both memory
    and I/O devices for a system in this price class. As shown in Figure 1.4, the
    processor-to-memory bus is 128 bits wide, plus 8 ECC bits, which yields a maximum
    bandwidth of 1.44 Gbps (gigabytes per second) with double-bit error detection
    and single-bit error correction. The I/O bus can operate up to 528 Mbps with parity
    checking. This speed and internal error checking features provide high-system
    performance in an entry-level UNIX server.


    The p610 is expandable above either adding a second 333 MHz processor or one or
    two of the 375 MHz processors with 4 MB of Level 2 (L2) cache or the powerful
    450 MHz processors with 8 MB of L2 cache each. Memory can be added up to 8 GB
    in memory DIMMs (Dual In-line Memory Modules). Disk storage begins with a single
    18.2 GB drive mounted on one of the internal bays and can grow to a 291.2 GB (more
    than a quarter of a terabyte) using 36.4 GB drives. In addition to the significant
    number of I/O interfaces integrated into the system planar (see base configuration
    detailed earlier), there are five PCI slots, three of which are 64-bit capable.


    An interesting characteristic of the pSeries 610 is the breadth of reliability,
    availability, and serviceability (RAS) features offered in an entry-priced system.
    These features may especially important for small companies, who have limited
    information technology skills and resources to deal with system problems, and
    for retail stores or branch offices systems scattered in remote locations where
    no computer specialist is available. The p610-61C and the p610-61E are the first
    pSeries to offer Light Path Diagnostics. With Light Path Diagnostics, if a component
    fails, a first-mounted attention light is turned on. The user looks at the system
    indicator LED (Emitting-Device) array to see which component is having a problem;
    this array is similar to those found on many office copiers to help locate paper
    jams. Finally, there are additional LEDs located near each component. Light Path
    Diagnostics makes it easy to locate the component to be replaced; it is particularly
    helpful if a technician is not on site and is working by telephone with local
    personnel to correct a problem.


    The service processor, provided as a standard component on the p610 and all other
    pSeries servers, enables RAS functions such as monitoring of power and temperature
    parameters, error log analysis and'
