  md: '# pSeries Communications 251


    Each the overall productivity of the users participating in it. Slow communications
    can translate to slow response time, leading to frustration and reduced concentration.


    The price one for the high-speed communications available with LANs is limited
    distance, as the term “local” in “local area network” indicates. Because of electrical
    limitations, LANs cannot be used as a direct communications link between distant
    computers (e.g., computers across town from one another). However, multiple LANs
    can be linked together over more traditional communications links (e.g., WANs–wide
    area networks).


    Each computer that participates in a LAN is a node in the network. A pSeries system
    can act as either a client node or a server node. A client node can operate as
    any normal standalone pSeries system and can also participate in LAN communications.
    Any shared resources on the network are accessible by a client node, but the client
    node itself offers no resource for other nodes to do and can also offer resources,
    such as disk storage or a printer, for use by the other nodes in the network.
    pSeries users participating in a LAN have three basic advantages over similar
    users not connected by a LAN:


    +   - Data sharing

    - Program sharing

    - Equipment sharing


    Today, data sharing is often the major reason to connect computers via a LAN.
    It is typical for many users to need access to the same body of information (e.g.,
    design standards, image libraries, telephone directories, inventory information,
    etc.). With a LAN and the proper application programs, multiple users can simultaneously
    access to a single body of information. Further, that information can be located
    on any computer (or even many computers) in the LAN.


    Because programs are stored in files, just like data, application programs available
    on one pSeries system can be loaded and executed by another pSeries in the network,
    subject to the applicable software licensing terms. An even more powerful use
    of program sharing is when one application program on a client (a client application)
    communicates directly with an application program on a server (a server applica'
