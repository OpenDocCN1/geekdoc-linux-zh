    the remaining instructions are fed to and executed by the fixed-point processor
    and the floating-point processor. The fixed-point processor performs mathematical
    and logical operations with things that don''t have decimal points, such as numbers
    (for example, the integers 1, 5, and 6) and numeric representations of text (such
    as ASCII codes). These fixed-point instructions are common in almost any computing
    environment. The floating-point processor performs mathematical and logical operations
    (IEEE 754-1985) with things that have a decimal point (that is, numbers such as
    53.254376, 4.6, and 3.3133). These floating-point instructions are common in engineering/scientific
    applications and others requiring sophisticated graphics.


    For those who aren’t counting, that makes four independent operations going inside
    the system at the same time:


    +   1. A branch instruction


    +   2. A condition register instruction


    +   3. A fixed-point instruction


    +   4. A floating-point instruction


    In fact, if the floating-point instruction happens to be the multiply-add (A ×
    B + C) or the multiply-subtract (A × B – C) instruction, these can be counted
