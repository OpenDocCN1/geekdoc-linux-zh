  md: 'Exploring IBM @server pSeries


    # A Glance Backward


    To appreciate the pSeries family and the AIX 5L operating system fully, it is
    helpful to be familiar with some basic history. The AIX 5L operating system is
    IBM''s version of the UNIX operating system, which was originally developed by
    AT&T Bell Labs in 1969. The original UNIX was not intended to be a commercial
    product but rather a tool for computer programmers at AT&T. In fact, at that time
    AT&T was not in the business of selling computers or operating systems. However,
    in 1975 AT&T began to license universities to use the UNIX operating system at
    no charge and soon the UNIX operating system became widely used in the academic
    community. Students quickly took advantage of the freedom in the academic world
    to make their own improvements to the UNIX operating system, often resulting in
    new commands that although obvious to the creator seemed cryptic to others. For
    example, the BFF command used to pick up electronic mail stored in the computer
    system was added to the UNIX operating system. Why BFF? Because the student who
    made the enhancement had a dog named BFF who was trained to go out and get the
    newspaper every morning. With this freedom to make unstructured improvements to
    the UNIX operating system at all helped UNIX become more powerful, it also left
    holes in areas such as data security and reliability.


    In 1981, the University of California at Berkeley offered its version of the UNIX
    operating system with many enhancements. Berkeley''s version of the UNIX operating
    system, known as Software Distribution 4 (BSD 4), became a very popular operating
    system in its own right—so that most of the enhancements contained in the Berkeley
    version were incorporated by AT&T''s later versions of the UNIX operating system.


    Meanwhile, IBM was busy on the “801 project,” which was started in 1975. Named
    after the building in which it was resident, the 801 project was an experiment
    to develop a minicomputer bucked the existing trend toward complex computer programming
    instructions. Under the leadership of IBM scientist John Cocke, the 801 approach
    was to simplify the range of instructions used to perform tasks and optimize the
    computer to execute this limited range of instructions with extreme efficiency.
    Born of this approach is the name “Reduced Instruction Set Computing,” or RISC.


    In January 1986, IBM announced the first product to use the RISC approach, the
    IBM RT PC (for RISC Technology Personal Computer),'
