    # PCI 4-Channel Ultra3-SCSI RAID Adapter (#2498)


    The PCI 4-Channel Ultra3-SCSI RAID Adapter (#2498) is a non-bootable high-performance
    Ultra3-SCSI RAID adapter providing RAID 0 (data striping), 1 (mirroring), and
    5 (stripping with parity protection) capabilities that can address up to 60 Ultra3-SCSI
    disk drives on two internal and four external independent Ultra3-SCSI buses. Two
    of the external ports are shared with the internal parts, so ports may be used
    for internal attachment or for external attachment, but not for both. If this
    adapter is attached to the internal backplane of the pSeries server, its performance
    will be limited by the maximum speed supported on that backplane.


    To increase the data writing performance, a 128 MB fast-write cache that utilizes
    nonvolatile RAM is provided as a standard, resident part of the adapter. During
    the unlikely event of a PCI 4-Channel Ultra3-SCSI RAID failure, a replacement
    adapter can be installed and the fast-write cache can be removed from the failing
    adapter and installed in the new adapter to maintain data integrity. The 128 MB
    fast-write cache can provide a significant improvement in data throughput and
    response time during certain write sequence operations compared to adapters without
    a fast-write cache.


    # Integrated SCSI Controllers


    Small Computer System Interface (SCSI) controllers are integrated onto the planars
    of all currently available pSeries and RS/6000 systems. Since these controllers
    do not consume an adapter slot, they provide significant value in terms of both
    function and PCI slot utilization. Based generally on the time at which the pSeries
    system was announced, both the number of integrated controllers and their SCSI
    function will vary.'
