  md: 'We also see that even for pSeries that use the same POWER4+ processor speed,
    the benchmark results are not exactly equal. For example, compare the 1.45 GHz
    p630 and p650 or the 1.7 GHz p655 and p690. These variations may be due to system
    designs or compiler variants.


    Since the SPECint2000 and SPECfp2000 benchmark programs do not provide meaningful
    data for comparing SMP systems, the council developed a benchmark called SPECrate.
    For SPECrateint2000 and SPECfp2000, several copies of a given benchmark may be
    executed. This method is particularly suitable for multiprocessor systems. The
    results, called SPECrate, explain how many of a particular type can be executed
    in a given time. SPECrate_int2000 is a geometric average of the 12 SPEC rates
    from SPEC integer tests (SPEC2000). SPECrate_fp2000 is the geometric average of
    the 14 SPEC rates from the SPEC floating-point tests (SPECfp2000). Because of
    the different units, the values of SPECint2000 and SPECrate_int2000 and SPECrate_fp2000
    cannot be compared directly.


    Let’s summarize to this point. The SPEC currently supports the 2000 version of
    its suite. It contains both floating-point and integer workloads, which run on
    an SMP system, must be calculated differently, yielding “rate” measurements.


    In 1995, the SPEC council implemented another variation of its benchmark called
    the SPECBase. Again, there are both floating-point and integer versions, along
    with wide rates for SMP systems. Remember that the SPEC benchmarks are actually
    a collection of programs. These programs get compiled on the pseries system and
    are executed. Here’s where the SPECBase allows only a limited set of compiler
    options when IBM, or any other vendor, compiles the programs that make up the
    benchmark. For example, no preprocessors are allowed that scan the source code
    looking for particular types of loops. Therefore, SPECBase removes any advantages
    that a vendor might have in its compiler technology. This gives the user a bit
    more of an apples-to-apples hardware stick to use when comparing hardware from
    different vendors.


    In summary, SPEC started with SPECint and SPECfp. SPEC then added the “rate” designation
    for SMP systems. Finally, the “base” indicates of only a limited set of compiler
    directives. All of this yields different performance measurements that are available
    for the comparison of pSeries systems among themselves and with competitive systems.'
