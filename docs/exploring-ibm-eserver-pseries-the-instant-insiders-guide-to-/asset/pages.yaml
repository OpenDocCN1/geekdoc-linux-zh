  md: '# 122 Exploring IBM@serverSeries


    hand-held computers, audio system, television sets, there have been rapid advances
    in circuit integration and electronic packaging technologies. The use of Very
    Large Scale Integration (VLSI) and double-Surface Mount Technology (SMT) has reduced
    the overall size of the systems. VLSI is an electronic fabrication technology
    that allows literally thousands of electronic circuits to be packaged on a single
    chip. The type of VLSI circuitry used in pSeries computers is less than 3-micron
    CMOS (CMOS stands for Complementary Metal Oxide Semiconductor, which is a type
    of VLSI circuitry.) CMOS is fairly high-speed circuitry with low power requirements,
    which reduces system power supply and cooling requirements. The advances in circuit
    density for both logic and memory chips have been supported by innovations in
    circuit packaging and connector technologies. Another significant factor has been
    the reduction in size (and increase in capacity) of storage devices as disk drives,
    diskettes, and tape drives.


    Several types of mechanical enclosures are used to house the various elements
    of pSeries systems. There are floor-standing enclosures, desksides, that allow
    for a bit of expansion in main memory, disk storage, I/O adapters, and peripheral
    devices, which can be positioned beside a desk in an office environment. Many
    pSeries systems use another enclosure that complies with industry standards. This
    structure is a 19-inch rack that can house various drawers, such as the CEC drawer
    with the system electronics, the I/O drawers with PCI slots and disk drives, and
    drawers for other attached devices. Multiple drawers are installed in one or more
    racks to build a complete system. Rack heights are measured in EIA units, which
    amount to 1.75 inches each. Currently available racks are the Model T00 (36 EIA
    units) and the Model T42 (42 units). The p655, p670, and p690 systems are designed
    for 24-inch-wide racks to accommodate the expandability of those servers in a
    single frame.


    All pSeries systems are now available only black, using contemporary industrial
    design. Availability of features in the traditional off-white color is being phased
    out. The reasons for this change are to eliminate the cost of releasing the very
    same functional item in two colors and to reduce inventory costs by maintaining
    stocks of only one part.'
