    # IBM 2-Port Gigabit Ethernet-SX PCI-X Adapter (#5707)


    The 2-Port Gigabit Ethernet-SX Adapter (#5707), like its countpart #5706, provides
    two full-duplex 1 Gbps Ethernet connections, but in this case using the LC-type
    connector to standard shortwave multimode fiber. Depending on the cable, the adapter
