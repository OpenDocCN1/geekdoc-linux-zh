    # IBM Token-Rings PCI Adapter (#4959)


    The IBM Token-Rings PCI Adapter (#4959) is a high-performance, 32-bit master adapter.
    Featuring an enhanced system interface for higher throughput and lower system
    utilization, coupled with RJ-45 and DB9 connectors, this adapter is well equipped
    to handle the LAN environment requirements of today’s servers and high-end workstations
