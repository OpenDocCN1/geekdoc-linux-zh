    # AIX Workload Manager


    AIX Workload Manager (WLM) is a standard feature of AIX 5L and is intended to
    help system administrators apply resource management policies to different workloads
    and manage peak demands. This capability can also be used to consolidate workloads
    from several different systems onto one pSeries system.


    The WLM function provides a policy-based method for managing system workload and
    system resources, including the following:


    +   - System resource allocation with fine granularity to specific jobs

    - Logical job separation on the server

    - Keeping applications in memory for more predictable performance

    - Dynamically changing policies as job requirements change

    - Control options that include minimum and maximum percentage limits, shares,
    or a combination of both


    As a function of AIX 5L, WLM will operate on any pSeries system from the smallest
    to the largest. WLM can also be used in LPAR environment. Within each logical
    partition, the system resources assigned to that LPAR can be allocated to certain
    applications, just as if the LPAR were an independent server. This feature is
    extremely useful in guaranteeing proportional or minimal levels of resource to
    various applications.'
  merge: -1
  img_proc: true
- pgno: 254
  md: '# 228 Exploring IBM @serverSeries


    AIX WLM is a very important tool used by the system administrator to allocate
    system resources (processors, memory, I/O) to processes and applications, so that
    the specified applications will always have available the resources needed to
    maintain adequate performance. In other words, with WLM, the administrator can
    prevent certain applications from being "starved" for resources due to peak demands
    from other application workloads.


    WLM allows management of subsets of workloads and control of subsets of total
    system resources. In addition to a graphical user interface, new functions available
    to the system administration are the ability to allocate disk I/O bandwidth and
    a subsystem to perform resource usage accounting per workload class, in addition
    to accounting for user or group of users.


