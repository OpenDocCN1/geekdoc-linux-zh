- pgno: 285
  md: '# pSeries Communications 259


    over.” That is, if one server should fail, the other server should take over the
    failed server''s data and processing.


    Now let''s see what happens when one of the pSeries systems (server A) fails.
    When server A fails, the HACMP program in server B detects that the HACMP program
    in server A has stopped its periodic messages. First, server B tries to contact
    the alternate Ethernet adapter in server A in case the problem is simply a failure
    in the primary Ethernet adapter. If connection is reestablished between the two
    servers via server A''s alternate Ethernet adapter, then no further action is
    required. However, let''s say server A has a complete system failure. In that
    case, when server B finds that it cannot reestablish communication with server
    A, server B automatically takes over for server A. First, server B programs its
    alternate Ethernet adapter to assume the identity (network address) of server
    A''s Ethernet adapter. Thus, all communications intended for server A will not
    automatically go to server B. Then, server B takes control of server A''s disk
    drives in the 2104. This allows server B to make the database of server A available
    to the LAN clients normally assigned to server A. In effect, server B becomes
    server A and the clients on the network get uninterrupted access to the resources
    of both servers (high availability). In fact, except for short “stall time” as
    the switchover is made, the clients know that server A failed.


    This is one simple example (mutual takeover) of how HACMP configurations can be
    used to improve the availability of LAN resources in the event of server failure.
    The AIX mirroring function described in Chapter 3 can be used in conjunction with
    HACMP configurations to automatically respond to a disk drive failure by switching
    to an up-to-date copy of the information on another drive.


    The HACMP software also be configured so that both systems access the same data
    concurrently (concurrent access). Refer to Figure 4. With concurrent access, both
    server A and B would access a single database residing on the 2104''s disk drives.
    This can provide a higher level of performance than a single server might deliver.
    This is especially true when you consider up to eight systems share disks. However,
    database applications on the servers must coordinate (via locking) their activities
    on the shared database. This can impose overhead that can lower the overall performance
    of the cluster. A concurrent access cluster can provide very fast takeover for
    a failing server because the same data is available via a different server to
    all client machines.'
  merge: -1
  img_proc: true
- pgno: 286
  md: '# Exploring IBM @serverpSeries


    High Availability Cluster Multiprocessing configurations with more than two pSeries
    systems are possible. The HACMP program can support up to 32 servers per cluster.
    Because the HACMP program allows the user to define (through AIX shell scripts)
    the actions to be taken in the event of various failures, configurations can be
    tailored to specific environments. The High Availability Subsystem component of
    the HACMP program provides base services for cluster membership, system management,
    cluster configuration integrity and control, and base recovery services for failover
    and recovery. The current Resource Manager component provides shared access to
    disk, file system, network, or application services.


    HACMP configurations can be built with a number of different networks (Ethernet,
    Token-Ring, ATM) and using either SCSI or SSA disks (Chapter 2). Recent enhancements
    to HACMP increase availability further allowing system administrators to reconfigure
    cluster resources making the cluster unavailable.


    # HACMP/XD (Extended Distance)


    HACMP/XD, an optional feature of HACMP Version 5.1, provides long-distance data
    mirroring, fallover, and resynchronization. HACMP/XD allows widely separated pSeries
    systems to operate in a fashion similar to that just described. It provides real-time
    mirroring of user data between systems connected by local or long-distance networks,
    bringing a complete disaster recovery capability to a pSeries cluster placed in
    two widely separated geographic locations. Support for IBM Enterprise Storage
    System (ESS) peer-to-peer remote copy (PPRC) means that HACMP supports failover
    of disks that are synchronous pairs within an ESS unit, as well as between physically
    separate disk storage subsystems. HACMP/XD''s support for IP (Internet protocol)
    based mirroring provides data mirroring across unlimited distances. Figure 4.9
    shows a conceptual model.


    Data mirroring with HACMP/XD can be synchronous, ensuring real-time data consistency,
    or asynchronous, for maximum performance while maintaining sequential data consistency.
    In a synchronous configuration, the data is written first to the remote site,
    then the local site. No input is handled until both writes complete. With asynchronous
    mirroring, the data is written first to the local site, then to the remote site.
    Input can continue at the local site while the previously entered data is being
    mirrored. Each site in this geographic cluster can'
