  md: '# Diskette Storage


    Diskettes provide a convenient way to transfer small amounts of information (up
    to 1.44 MB) between computer systems or to make backup copies of small data files.
    A 3.5-inch 1.44 MB disk drive is standard on pSeries systems. However, diskettes
    are declining in popularity, especially in the server market, where CD-ROM and
    DVD-ROM drives are standard, and where many systems are managed and software is
    installed over a LAN or the Internet.


    # Internal Disk Drives


    All the focus pSeries systems and most other pSeries and RS/6000 servers come
    with some amount of magnetic disk storage. The exceptions are the pSeries 660
    Models 6H0, 6H1, and 6M1, which are designed to use external storage subsystems
    such as the IBM 2104 Expandable Storage Plus (Ultra3-SCS) or IBM 7133 Serial Disk
    System (SSA). However, even those servers offer optional internal boot disk capability.
    Chapter 1 provides information on the standard disk configurations and specifications.
    The disk options used with pSeries systems. The reason multiple feature numbers
    are used for ordering drives is that the physical packaging (disk carrier) of
    drive may vary depending on the pSeries server in which it is supported or there
    may be some technical differences among the disk technologies used. You might
    also refer back to Chapter 1 for the differences between SCSI types. Disk technology,
    in terms of both capacity and rotational speed, is changing rapidly. The smallest
    drive now offered on many pSeries systems is 36.4 GB, and 15,000 rpm drives are
    starting to replace the 10,000 rpm drives. It is anticipated that 18.2 GB disk
    drives will be withdrawn from marketing in 2003.


    # External Disk Systems


    External disk systems are units that contain multiple drives and attach to pSeries
    systems through a storage adapter, providing significant additional storage expansion
    capacity in rack drawer or tower packages. Both SCSI and SSA external units are
    available. These systems'
