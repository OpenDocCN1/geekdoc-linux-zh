    # Open-System Standards


    AIX 5L is UNIX 98 compliant and conforms to standards for compatibility with other
    UNIX systems, including support for a range of standards and specifications including
    POSIX 1003.4a Draft 7 and X/Open XPG4 Base Profile.


    In addition, AIX 5L meets the common application interface defined by the Single
    UNIX Specification (formerly Spec 1170). Spec 1170 is a common API that is a collection
    of the most popular and widely used UNIX application programming interfaces (XPG4,
    SVID3, OSF, and so on). Many vendors are expected to implement this specification,
    making UNIX applications more portable. As a result of meeting the specification,
    AIX 5L has been granted the UNIX brand from X/Open (now the Open Group) as discussed
    earlier.


