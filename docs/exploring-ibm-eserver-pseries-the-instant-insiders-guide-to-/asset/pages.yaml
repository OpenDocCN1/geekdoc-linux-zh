    # TURBOWAYS ATM Adapters


    The TURBOWAYS ATM Adapter and the TURBOWAYS ATM LAN Emulation function that is
    shipped with provide it the pSeries with direct access to high-bandwidth and high-speed
    Asynchronous Transfer Mode (ATM) LANs. Local area network emulation provides the
    ability to run IP or non-IP protocols. The TURBOWAYS adapters are intelligent
    adapters capable of supporting applications requiring greater bandwidth than is
    available with current LAN technology. They support full-duplex attachment to
    155 Mbps and 622 Mbps ATM networks, and some adapters provide function such as
    TCP checksum to minimize processing load on the host pSeries server. Three ATM
    adapters are available. The MMF (multimode fiber) adapters attach with dual-SC
    type, multimode fiber MMF cables, while the UTP adapters connect to CAT-5 UTP.
    The adapters are the following:


    +   - Turnboways 622 Mbps PCI MMF ATM Adapter (#2946)

    - IBM 64-bit/66 MHz PCI ATM 155 UTP Adapter (#4953)

    - IBM 64-bit/66 MHz PCI ATM 155 MMF Adapter (#4957)


    # WAN Communications Adapters


    All pSeries systems can participate in a variety of wide area networks. Unlike
    LANs, WANs allow computers to communicate with other computers and remote devices
    over global distances. For more about WANs, see Chapter 4.


    # Multiprotocol Communications Adapters


    There are two adapters that allow pSeries systems to simultaneously participate
    up to four different communications networks. These adapters work in conjunction
    with software provided with AIX to attach using multiple communications protocols
    (bisync, SDLC, X.25)'
