    who require a data mirroring solution without the fallover and resynchronization
    capabilities of HACMP/XD, GeoRM provides a lower-cost option.


    We have seen that a wide array of communications hardware and software options
    are available to users of pSeries systems. When coupled with appropriate middleware,
    such as HACMP and the HACMP/XD feature, these options can be used to configure
    a more highly available computing environment.'
