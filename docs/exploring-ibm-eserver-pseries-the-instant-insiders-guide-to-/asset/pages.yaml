    The IBM VisualAge C Compiler, a separately ordered product for AIX 5L, supports
    the development of programs written in the popular programming language. A programming
    language can be thought of as a library of instructions from which a programmer
    constructs a program. The instructions of C (and other programming languages)
    are designed to be easily understood by the programmer, facilitating productivity
    while writing programs. However, the resulting of instructions (the program) cannot
    be directly understood by the pSeries hardware. The VisualAge C Compiler takes
    the list of C instructions written by the programmer and automatically converts
    them to a series of instructions that are executable by the pSeries processor.


    Other languages include C++ and FORTRAN. Additional compilers for AIX 5L are also
    available from companies other than IBM. All of these compilers are designed to
    meet existing industry standards that specifically define the elements of each
    language. The language you select depends on the requirements of the application
    program and the skills of your programmer().


    Although not a tool in the same sense as compilers, it is important to note that
    AIX 5L provides runtime execution for programs written in the popular industry-standard
    Java 2 language. One may think of this capability as a Java 2 interpreter. Both
    the 64-bit and the 32-bit kernels of AIX 5L are fully Java 2 compatible.


