    The smallest piece of information the main processor and main memory use is called
    a bit. These bits are grouped into bytes (8 bits), half-words (16 bits), words
    (32 bits), and double words (64 bits) to form the computer''s representation of
    numbers, letters of the alphabet, instructions in a program, and so on. With this
    basic knowledge, let''s take a closer look at the system''s main processor and
