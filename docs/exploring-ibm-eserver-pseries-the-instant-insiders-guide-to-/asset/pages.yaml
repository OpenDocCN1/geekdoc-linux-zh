    in the network is at the fingertips of any authorized user on the network. Also,
    specific server applications can be located on the computer system best suited
    for the task they provide services to all network users.


    Equipment sharing is another reason to connect computers via a LAN. Equipment
    sharing allows server nodes participating in a LAN to share their disk space,
