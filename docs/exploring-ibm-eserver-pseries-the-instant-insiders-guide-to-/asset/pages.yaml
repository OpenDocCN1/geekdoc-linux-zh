  md: '# 3


    # Application Programs and Operating Systems


    # Types of Software—A Conceptual Model


    The term “software” is analogous to the term “publication.” Newspapers are a category
    of publication. Annual reports, novels, and Who’s directories are some other categories
    of publications. These different categories fill very different needs. The same
    situation exists with software. There are three basic categories, or software
    layers—the application program layer, the operating system layer, and the device
    driver layer, as shown in Figure 3.1. Each software layer performs a completely
    different job, but all three work closely together to perform useful work for
    the user.


    # Application Programs


    The top software layer in the model is the application program layer (highlighted
    in Figure 3.2). The programs in this layer “apply” pSystems to a specific task
    (computer-aided design, word processing, ac-'
  merge: -1
  img_proc: true
- pgno: 214
  md: '![](img/29c52a1767a1e621ce6343faa9399737_214_0.png)


    **Figure 3.1.** Conceptual software model of the pSeries system’s basic software
    structure. The three layers of the software model work together to perform useful
    work for the user.


    ![](img/29c52a1767a1e621ce6343faa9399737_214_1.png)


    **Figure 3.2.** The application program software layer of the software model.
    is is the application program that defines the particular task the computer is
    performing for the user.'
  merge: -1
