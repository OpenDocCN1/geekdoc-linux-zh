    2. Also available on pSeries systems are DVD-ROM drives, which can read both CD-ROM
    formatted disks and DVD-ROM drives, including double-sided disks. On some systems,
    the user has a choice of either CD-ROM or DVD-ROM as the installation media device.


    Rewritable optical disks use a similar laser-based technique to store information.
    However, CD-ROM drives can only read information, rewritable optical disks can
    read and write information on an optical disk. The pSeries options at this time
    are a 4.7 GB DVD-RAM drive, which can be mounted internally in a media bay, and
    the 3995 C-Series Optical Library Dataserver, an external device. Rewritable optical
    disks can be used for information or program distribution just as CD-ROMs. Although
    they are inherently slower than magnetic disk drives, they are specialized applications,
    as large databases of images that were originally created by hand and scanned
    into storage (as opposed to being in digital form), in which they may be used
    for working data.


    # Expansion Slots


    The PCI is a local bus that was designed as an intermediate or mezzanine bus.
    You can think of a mezzanine bus as a major expressway that handles a large volume
    of high-speed traffic. Once you exit the expressway, things slow down, but you
    are close to your final destination. The PCI bus is the primary backbone of the
    I/O subsystem. Aside from the memory subsystem, the microprocessor tasks nearly
    everything through the PCI bus. The middleman between the processor and the PCI
    slots is called a PCI bridge. You may have noticed PCI'
  merge: -1
  img_proc: true
- pgno: 142
  md: 'bridge chips in the logic diagrams of the pSeries servers ear- lier in this
    chapter.


    pSeries systems are designed with multiple and separate buses for improved I/O
    throughput. These separate buses can communicate to I/O devices in parallel, thus
    increasing the rate of information sent to and from processors. The PCI bus is
    multiplexed, which means that some pins are used for more than one purpose, depending
    on the operation being performed or the step of a particular operation. This is
    a bit more difficult to design, but results in fewer pins on each component, meaning
    that the components are less costly to produce. The PCI bus was also designed
    from the start to have many autoconfiguration features. This allows new devices
    to be added without setting switches or having conflicts between adapters. Because
    of its high performance and emergence in the PC industry, PCI proves to be a solid
    and cost-effective solution for the pSeries product line.


    The most recent pSeries servers, including p615, p630, p650, p655, p670 and p690,
    provide the faster PCI-X I/O slots. PCI-X is an extension to the PCI architecture,
    doubling the transfer speed from 66 MHz to 133 MHz, enabling data transfer rates
    of more than a gigabyte per second. PCI-X slots are backward compatible with older
    3.3-volt or universal (i.e. 3.3-volt or 5.0-volt) adapters. Also, these latest
    pSeries servers offer hot-plug PCI-X support, a RAS capability that allows an
    adapter that is not in use by an application to be removed while the system is
    up. In addition, the p650 and 7311-D01 (on p650) and 7040-61D (p655, p690) I/O
    drawers provide "blind-swap" hot-plug PCI-X slots. Blind-swap technology provides
    a cartridge that allows the adapter to be installed or removed without moving
    the system or drawer to a server position.


    # Standard Ports


    We have already seen that pSeries systems come standard with one or more Ultra-SCSI
    (or faster) ports. Other ports are provided for serial, parallel, Ethernet 10/100
    Mbps or gigabit Ethernet, keyboard, mouse, and HMC interfaces. Ports are the control
    electronics and connectors accessible from outside the pSeries cores that provide
    a means of attaching external devices (such as storage, LANs, and printers) to
    the system without using one or more of the PCI slots. This saves money (no extra
    adapter is needed for these common interfaces) and preserves'
  merge: -1
  img_proc: true
- pgno: 143
  md: '# IBM @server pSeries—An Overview 117


    the PCI slot capacity for users to configure for their particular system environments.


    Serial ports transfer bytes (one bit at a time) using the asynchronous communications
    protocol at a rate of 38.4 Kbps. They can be used to connect devices such as printers,
    plotters, external modems, and ASCII terminals. The parallel port uses a 25-pin
    D-shell connector and transfers bytes of information one bit at a time, or eight
    bits in “parallel.” This port is an implementation of a widely used industry standard
    for attaching a printer. Ethernet ports provide industry-standard LAN attachment,
    and the HMC ports are used when the Hardware Management Console is required for
    clustering or LPAR. The keyboard and mouse ports provide for the attachment of
    the Enhanced Keyboard and the three-button mouse.


    # Graphics


    Images presented on a computer’s display are used to present information to the
    user. pSeries servers support two-dimensional graphics, which are adequate for
    graphical user interfaces (GUIs) and for Internet access. As has stated earlier,
    many users of pSeries systems will actually be working at a PC attached to LAN
    to the server. Even for 2D graphics, the quality of images can directly affect
    the user''s productivity, effectiveness, and enjoyment during a work session.
    Graphics image quality becomes even more important to workstation users in computer-aided
    design applications that depend on 3D graphics capability. Let’s take a closer
    look at 3D graphics, remembering that this discussion applies only to the pSeries
    630, the pSeries 640, and the RS/6000 Models 150, 170, and 270.


    Two hardware elements work together to generate computer graphics: the display
    (sometimes referred to as a “monitor”) and the graphics adapter (often calls a
    “graphics accelerator”). Most readers are familiar with displays used on their
    PCs and generally know that they come in different sizes and can display images
    with different degrees of resolution. They know, too, that the larger display
    and the higher its resolution capability, the more expensive it is likely to be.


    The ability to display graphics at high performance (for rapidly moving images)
    and with a large range of colors depends even more on the graphics adapter. Graphics
    adapters are circuit boards that convert the bits and bytes inside the computer
    system to the electrical signals that are used by the display to create the image
    you see. The images'
  merge: -1
  img_proc: true
- pgno: 144
  md: '# Exploring IBM @serverSeries


    generated by the graphics adapters are made up of patterns of many individual
    dots on the display, called PELs or pixels, that blend together to form the desired
    image. This technique is depicted in Figure 1.36.


    Each individual PEL on the display screen can be independently turned on or off
    by writing the appropriate bit pattern to its associated location within a special-purpose
    memory area on the graphics adapter called the frame buffer. The buffer determines
    the number of PELs that make up the image (or resolution of the image) seen on
    the surface of the computer''s display. The more PELs represented in the frame
    buffer, the higher the resolution of the image (assuming the display can also
    support that resolution). The latest 3D graphics accelerators support resolutions
    up to 2048 by 1536 PELs.


    The number of bits associated with a single PEL determines how many colors or
    how much brightness it can have. The graphics adapters for pSeries and RS/6000
    systems support up to 24 bits per PEL


    ![](img/29c52a1767a1e621ce6343faa9399737_144_0.png)


    Figure 1.36. Mechanics of a computer-generated All-Points-Addressable (APA) image.'
  merge: -1
  img_proc: true
- pgno: 145
  md: '# IBM @server pSeries—An Overview 119


    (over 16.7 million different colors). A large number of colors can be used for
    shading to create the illusion of depth. The more colors that are available, the
    more realistic the image appears. Using up to 16.7 million colors in a single
    image is called true color and results in extremely lifelike images.


    A buffer of a given size can be used to represent different numbers of PELs (that
    is, different resolutions) with different numbers of bits per PEL (that is, different
    numbers of maximum colors) under the control of the graphics software. Some graphics
    accelerators have two full-frame buffers. This allows one frame buffer to be displayed
    while the second is updated by the application program. When it is time to display
    the updated image, the second frame buffer is displayed, allowing the first frame
    buffer to be updated, and so on. The result of this dual-frame-buffer technique
    is a smoother transition from one image to another. Because screens are not being
    displayed at the same time as they are being updated, no transitional layer is
    displayed, improving overall image quality. This is especially useful for applications
    that operate animation.


    Some other bits associated with each PEL should be mentioned. The overlay frame
    is a separate part of the buffer used to quickly overwrite portions of the display
    screen. If the overlay frame is empty, the image in the normal part of the graphics
    memory will be displayed in its entirety. If an image (such as some text or a
    pop-up window) is written to the overlay frame, it takes precedence over what
    is in the normal part of the frame buffer and is displayed on the screen. Once
    the overlay frame is reset, the original image is restored automatically. This
    allows an application program to quickly overwrite sections of the display screen
    and then restore the original image without having to re-create it. Multiple overlay
    frames mean that each PEL has multiple bits in the overlay frame, which allows
    the image to be overwritten using more colors.


    The 3D graphics adapters used with pSeries and RS/6000 workstations are specially
    designed to generate and manipulate multidimensional images. In 3D adapters, the
    area in graphics memory used in the generation of three-dimensional graphics is
    called the Z-buffer. Although not actually part of the frame buffer itself, the
    Z-buffer is a special purpose memory area that is used for hidden-line and hidden-surface
    removal. As you rotate a solid pyramid, for example, some of the lines and surfaces
