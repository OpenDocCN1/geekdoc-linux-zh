  img_proc: true
- pgno: 225
  md: '# Application Programs and Operating Systems 199


    that result from custom applications that precisely fit their needs. For customers
    who choose the custom software approach, pseries systems and the programming tools
    available for the AIX 5L operating system provide a very productive software development
    environment.


    # Operating System


    Few areas in information processing create more confusion and apprehension over
    the operating system layer of our software model, shown in Figure 3.3. The following
    discussion will help remove some of the mystery associated with the Advanced Interactive
    e (AIX) operating system using all pSeries and RS/6000 systems. The reader will
    become familiar with basic operating system terms such as “active processing”
    and “multiseruser,” and then move for a closer look at the AIX 5L operating system.


    The description of AIX in this chapter provides AIX 5L for POWER Version 5 Release
    1 (AIX 5L v5.1) and Release 2 (AIX 5L v5.2). AIX Version 4 (AIX 4.3) has been
    withdrawn from marketing and service will be discontinued December 31, 2003. Users
    of existing p servers can upgrade to AIX 5L, and only AIX 5L is available with
    new systems. All earlier AIX versions and releases have been withdrawn as newer
    versions have been announced. IBM supports two levels of AIX at any time, the
    latest level (version N) and the prior level (version N-1), at which time are
    AIX 5L v5.2 and v5.1.


    # Introduction to Operating System Concepts


    The operating system provides the necessary interface that allows the user and
    application programs to interact with pSeries systems. The user can interact directly
    with the operating system’s user interface to manage files on a disk, start application
    programs, print files, and so on. The operating system also performs tasks directly
    under the control of application programs without any user assistance. The application
    program initiates tasks by interacting with the operating system through the application
    program interface (API). This is simply a set of operating system commands that
    can be issued directly by the application program. The API simplifies the job
    of the application programmer, who need not get involved with the details of hardware
    interaction. Further, when an application program uses the API, it is shielded
    from changes in'
  merge: -1
  img_proc: true
- pgno: 226
  md: '# 200 Exploring IBM @serverSeries


    the computer hardware as new computers are developed. That is, the operating system
    (and device drivers) can be changed to support new computer hardware while preserving
    the API unchanged and allowing application programs to run unchanged on the new
    computer.

    To understand the job of the operating system, it is necessary to understand a
    few basic concepts:


    +   * Batch versus interactive processing

    * Multiuser

    * Multitasking

    * Multiprocessing


    Batch Versus Interactive Processing

    There are two basic types of work a computer can perform: batch processing and
    interactive processing. To understand the difference between these two concepts,
    let''s use an analogy and examine the difference between two communications through
    the postal service and through the telephone.


    If you wish to ask a distant friend some questions, you can either write a letter
    or phone. With the first option you gather all of your thoughts, put them on paper,
    and submit the letter to a mailbox. A few days later (assuming your friend is
    responsive) you go to your mail box and get the responses to your questions in
    the form of a document. This is analogous to batch processing with a computer
    that you can submit a request for the computer to answer some question(s) or perform
    task(s). Some time later (from minutes to days), you can go to the printer and
    get the computer''s responses in the form of a report. In the early days of computing,
    batch processing was the only alternative for computer interaction. Today, batch
    processing still has its place, but interactive processing is the norm.


    Moving back to our analogy, sometimes you can''t simply write down your list of
    questions in a letter because some of the questions you have depend on the answer
    to one or more initial questions. In this case, you either have to send several
    letters back and forth between yourself and your friend or call your friend on
    the phone. Having a conversation with your friend over the phone is analogous
    to interactive processing'
  merge: -1
  img_proc: true
- pgno: 227
  md: '# Application Programs and Operating Systems 201


    on a computer. With interactive processing, you have a dialogue with the computer
    system from a PC. You enter questions or requests for activity, and the computer
    immediately responds. Interactive processing gives the user an immediate response,
    which is required and expected in most applications (e.g., airline reservations
    or a retail checkout line).


    Some applications use a combination of batch and interactive processing. For example,
    a payroll clerk might enter information from time cards in a dialogue style (interactive
    processing). Once all time cards are entered and verified to be correct, the clerk
    issues a command that tells the computer to print all checks (a batch job). The
    clerk would later get the checks from the printer. AIX, like other operating systems,
    supports both batch and interactive processing.


    # What Is Multiuser?


    A computer system is said to be a multiuser system if two or more users share
    the system at the same time. With a multiuser system, from two to many hundreds
    of computer terminals are attached to a single computer. Each terminal provides
    its user with a “window” into the computer system and allows the user to perform
    tasks independent of all other users. Although the single computer system is being
    used simultaneously by many users, each user is unaware of the activities of the
    other users and seems to have his or her own computer system. However, a user
    may see the computer slow down (increase response time) as more and more users
    sign on to the computer and start working.


    A multiuser computer system has several advantages over singleuser systems. Because
    the system hardware and programs can be simultaneously shared by many users, no
    one has to stand in line waiting for a turn on the computer. Everyone (assuming
    there are enough terminals attached) has access to the computer whenever it is
    needed to do a job. Other advantages offered by a multiuser system are in the
    areas of security, accounting, backup/recovery, and so on. The pSeries running
    the AIX 5L operating system can act as either a single-user or a multiuser computer
    system.


    # What Is Multitasking?


    Many people confuse multitasking with the term “multiuser” just discussed. As
    was just noted, “multiuser” refers to the capability to share a'
  merge: -1
  img_proc: true
- pgno: 228
  md: '# Exploring IBM @serverSeries


    single computer system between two or more users simultaneously. “Multitasking,”
    also called “multiapplication,” refers to the ability to simultaneously run or
    more independent application programs for a single user. The opposite of multitasking
    is single tasking, which means that the computer user must finish using one application
    program before another can be started. The AIX operating system using pSeries
    systems supports a full multitasking environment.


    Multitasking is helpful in many environments. The office, for example, is one
    environment in which workers are often interrupted in the middle of one task to
    perform another. The multitasking capability of operating systems fits naturally
    into this interrupt-driven environment by allowing users to easily switch back
    and forth between several simultaneously active application programs as the interruptions
    occur. Another advantage afforded by multitasking is the ability to have the computer
    system batch-processing tasks while one is working with some other application
    program. This type of batch processing is called background processing. With background
    processing, a programmer can start a (batch processing) and then immediately go
    work on some other program. An engineer can start a finite element analysis of
    a mechanical design (batch processing) and then immediately begin on another design
    project. Without the background-processing capability provided through multitasking,
    the user would have to wait for the batch processing to complete before going
    on to any other tasks.


    # What Is Multiprocessing?


    Whereas “multiuser” refers to the ability for many users to share the resources
    of a system concurrently and “multitasking” means that the system can run many
    different applications simultaneously, the term “multiprocessing” refers to the
    ability of an operating system to support many processors, all of which share
    system resources such as memory and input/output devices. A multiprocessor-capable
    operating system, such as AIX, allocates work to the available processor(s), thus
    increasing the performance of the system above would be possible if there were
    only one processor available. The user does not have to worry about which specific
    processor is running his or her application. In this book we have described many
    pSeries models as symmetric multiprocessing (SMP) systems, and you should have
    noticed that the larger the system (i.e., the more processors), the higher the
    performance.'
  merge: -1
  img_proc: true
- pgno: 229
  md: '# Application Programs and Operating Systems 203


    The word “symmetric” simply means that the processors share memory and I/O devices
    equally.


    In an SMP system, it is possible for one application to “hog” all the system resources.
    To overcome this, AIX Workload Manager is an important software tool that allows
    the systems administrator to allocate a certain amount of processing power for
    specific applications, ensuring a basic level of processing power for each major
    application. So, if the system is very busy, an application will always get at
    least a predetermined level of processing power. And, if the system is less heavily
    loaded, that application may run even faster, since the operating system can allocate
    more processing power to it.


    # What Is Logical Partitioning?


    As explained in the section on logical partitioning in “A Closer Look” in Chapter
    1, logical partitioning is really a capability of the pSeries hardware, namely
    the POWER4 and POWER+ processors and the system firmware or microcode. LPAR allows
    the pSeries system to be partitioned into “virtual servers within a server”, each
    having at least one or several processors assigned to it and each LPAR running
    its own copy of the operating system. The allocation of processors, memory, and
    I/O is flexible and does not conform to physical boundaries, such as how many
    processors are on a multipitch module (MCM) or which PCI bus the I/O slots are
    on. The number of LPARs depends on the size of the pSeries server. A p690 can
    have up to 16, a p650 up to eight, and the p655 and p630 up to four LPARs.


    Although not an operating system, LPAR is supported and enhanced by the operating
    system in several ways. On each partition can run any of three operating systems—AIX
    5L v5.1, AIX 5L v5.2, or Linux. The functions available in each “virtual server”
    depend on the operating system. Each LPAR running AIX 5L v5.1 or v5.2 will have
    the support of all the autonomic computing and systems management capabilities
    of AIX 5L. Since Linux does not currently support all the functions available
    in AIX 5L, LPARs running Linux will be limited to the functions provided by that
    operating system. Two examples of such functional differences are dynamic deallocation
    of processors and PCI buses (which help increase system availability) and AIX
    Workload Manager (which allows the administrator to assign resources to various
    application workloads). For LPARs'
  merge: -1
  img_proc: true
- pgno: 230
  md: '# 204 Exploring IBM @serverSeries


    running AIX 5L, these capabilities work just as they do on a pSeries SMP server
    without LPAR, but LPAR running Linux will lack those functions. On the other hand,
    the reason for running Linux in some LPARs is to have compatibility with the Linux
    applications the user requires and, presumably, those applications will run fine
    without the AIX 5L capabilities.


    AIX 5L v5.2 enhances LPAR with the ability to add or remove processors, memory,
    or adapters to a partition without rebooting the LPAR or the system. In order
    to assign resources to LPARs running AIX 5L.1 or Linux, the partition must be
    restarted (static LPAR). Also, the dynamic LPAR capability provided by AIX 5L
    v5.2 works with processor and memory CuOD (Capacity Upgrade on Demand) to allow
    newly activated processors or memory to be assigned immediately to the appropriate
    LPARs and to allow dynamic processor sparring.


    Local partitioning offers the user many advantages. For example, an application
    or set of applications can run in a specific logical partitioning, guaranteeing
    the availability of the assigned resources for that workload. Since different
    applications can run in each LPAR, one possible scenario is to have a production
    LPAR running the tested version of an application, while in another LPAR there
    is a test system running a new version of the application. Another example is
    to run regional workloads in the region being supported. All of these use scenarios
    provide cost-effectiveness advantages in systems management and physical space,
    since a single system is being used where previously the alternative solution
    was to run multiple smaller systems.


    # AIX 5L—An Executive Overview


    The UNIX operating system was originally developed by AT&T''s Bell Labs in 1969.
    Over the years, it has continuously been enhanced by various independent organizations
    (both academic and business), often in a unstructured way. These independent efforts
    have resulted in a very powerful, somewhat cryptic, often awkward, and usually
    flexible operating system. The UNIX operating system became popular for several
    reasons. First, AT&T licensed the operating system to many different computer
    manufacturers, which offered the UNIX operating system for their computers rather
    than choosing to write their own operating sys-'
  merge: -1
  img_proc: true
- pgno: 231
  md: '# Application Programs and Operating Systems 205


    lems. Second, the UNIX operating system is prevalent in colleges and universities.
    As students learned the UNIX operating system in academic environments, it was
    only natural that they would seek out systems after the nonacademic world. Finally,
    the C programming language fostered by the UNIX operating system is a highly popular
    one, offering very flexible and powerful programming structures.


    The UNIX operating system has evolved to be the basis for the open-system marketplace,
    in which compatibility with industry standards is the hallmark. Compatibility
    means that programs written for one brand of “open system” can easily be migrated
    to another brand. The open-system concept is good for application developers because
    they can easily offer their products on many different brands of computers. This
    is good for users because they have a multitude of software from to choose no
    matter what brand of open system they buy.


    IBM took the UNIX operating system and incorporated many enhancements developed
    by other organizations (e.g., the University of California at Berkeley), added
    many enhancements of its and came with its version, called the Advanced Interactive
    Executive. This system approach was a departure from IBM’s proprietary systems
    such as the AS/400 or MVS operating system for IBM’s S370 and S/390 mainframes.
    pSeries computers running the AIX operating system are IBM’s third generation
    of UNIX computer platforms. (The IBM RT System was the first, and RS/6000 systems
    were the second generation.) Figure 3.6 shows a timeline of the evolution of AIX
    from its inception to the current, AIX 5L v5.2. The chart lists the key functional
    enhancements of each version and indicates what was happening in all the developments
    of previous versions that are still applicable in today’s e-business world. Some
    functions have been dropped over the years, as the evolution of the computer industry
    made obsolete.


    As shown in Figure 3.6, the introduction of AIX 5L in April 2001 marked several
    new capabilities for IBM’s UNIX operating system. AIX 5L v1 provides a 64-bit
    operating kernel and device drivers. It supports up to 32-way SMP servers like
    the pSeries 690, logical partitioning, up to 256 GB of memory, and Linux affinity
    tools. The second version, AIX 5L v5.2, offers the JFS2 file system, which allows
    file and file-system sizes of 16 TB and supports dynamic LPAR, dynamic processor
    and merging Capacity Upgrade on Demand, dynamic processor sparing with CUoD, and
    up to 512 GB of memory.'
