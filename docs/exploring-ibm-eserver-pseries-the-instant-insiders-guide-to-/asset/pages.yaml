    # Network Processors


    As many brands of personal computers and UNIX-based workstations proliferated,
    so did different types of networks (e.g., Token-Ring, Ethernet, and SNA) used
    to interconnect the various computer systems. Some of the protocols are Transmission
    Control Protocol/Internet Protocol (TCP/IP), Xerox Internet Services Transport
    (XNS), Internet Packet Exchange (IPX), and Digital Equipment Corporation Network
    (DCNet). All these communications environments were developed to satisfy specific
    applications and network requirements, and also with the best intentions of providing
    interfaces that would allow future growth. Nonetheless, the result has been many
    incompatible networks of computers found their way into many enterprises. This
    necessitated the development of products called routers and bridges that allow
    different networks to communicate freely with one another.'
  merge: -1
  img_proc: true
- pgno: 199
  md: '# Options and Peripherals 173


    Although bridges and routers use different approaches, devices are used to connect
    two or more independent (and dissimilar) communications networks together so that
    the users on one network can communicate with the users over the other. Network
    processors building and routing functions allow you to directly link two local
    LANs together link a LAN and a WAN, or link two LANs together over a WAN. Network
    processors are commercially available from a number of sources.


    The rapid development of the Internet and the e-business have made it more than
    ever—in fact, almost mandatory—that computer suppliers provide complete hardware
    and software solutions that adhere to industry standards and allow businesses
    to integrate heterogeneous computer systems and to communicate with their customers,
    suppliers, and employees. These communications interfaces include high-speed Internet,
    industry-standard fast (gigabit) Ethernet, wireless LANs, and IP telephony capacity.
    Fundamental of all this is TCP/IP communications and Web-enabled user interfaces.


    Recently, IBM and Cisco Systems announced an alliance to integrate IBM''s products
    and services with Cisco''s leadership networking products for the Internet. pSeries
    systems and the AIX 5L operating systems, historically designed to “open-system”
    standards, are well positioned to play a key role in this alliance. They provide
    the industry-standard communications hardware and software capabilities needed
    to allow integration with third-party networking products, as those from Cisco,
    to form high-performance scalable e-business solutions.


