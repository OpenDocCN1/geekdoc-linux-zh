    Figures 1.1a and 1.1b show the pSeries family and the RS/6000 at a glance. We''ll
    take a look at each of these models, but here is a brief overview of IBM''s naming
    convention on these systems. The pSeries class (e.g., p690 or p615) distinguishes
    the servers by performance, system capacity, and physical packaging. In general,
    a larger pSeries class number indicates a more powerful system, but that is not
