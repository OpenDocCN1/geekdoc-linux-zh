    # The Financial Decisions


    In addition to selecting the hardware and software to address identified needs,
    some financial questions must also be considered when installing a computer solution.
    Two important areas that must be addressed are cost justification and the “lease
    or buy” decision. Let’s look at these issues.


    # Cost Justification


    All businesses are the same in one respect: They exist to make a profit. In the
    final analysis, the only reason for a business to buy a computer is to make the
    business more profitable. Although academic, government, and not-for-profit organizations
    don''t have the profit motive, they'
  merge: -1
  img_proc: true
- pgno: 308
  md: '# 282 Exploring IBM @serverpSeries


    still must decide how to invest their typically limited funds to best meet their
    objectives. In either case, therefore, the computer system must be cost-justified.
    There are two halves to the cost-justification analysis: costs and benefits. The
    price paid to the computer vendor is easily identified early in the project. What
    many people feel to consider are the other costs of owning a computer system.
    The costs of operating the computer installation should also be considered. This
    is called "total cost of ownership." Some costs that should be considered beyond
    the price tag are discussed next.


    **Hardware and Software Costs.** This should be an obvious point, but one must
    include the costs for the pSeries system plus other hardware peripherals (e.g.,
    external storage systems, printers, PCs, etc.) and all the costs of the software
    required for both the pSeries system and any PCs to be purchased.


    **Hardware Maintenance.** This is usually a monthly or annual fee for hardware.
    There are various alternatives, but the basic deal is that if the computer breaks
    down, the service company will come out and fix repairs at no charge. If the system
    is not on a maintenance contract, then service providers will charge an hourly
    fee and parts costs when the system breaks down. Because these parts/labor billing
    approach can be extremely expensive, most businesses choose to put their system
    on a maintenance contract.


    **Software Maintenance.** In many cases, the software supplier will have to pay
    an annual or monthly fee to get software fixes and updates for the programs purchased
    from that company.


    **Technical Support.** Some companies charge fees for technical support, whereas
    others include some level of support in the price of their products. This support
    is a way to get answers to questions and resolve any technical problems in either
    the hardware or software. This kind of support ranges from providing a telephone
    number to having assigned personnel from the computer company on premises. Sometimes
    this support is provided free of charge; other times it is on a fee basis.


    **Facilities.** Often a company must modify its building to accommodate a computer
    system. These modifications might include running cable between workstations and
    the computer or modifying the electrical power services available. Fortunately,
    the cost of such building modifications is relatively low with pSeries systems
    as compared with larger computers, which may require water cooling and raised
    floors.'
  merge: -1
  img_proc: true
- pgno: 309
  md: '# pSeries and Your Environment 283


    Space. Whether raised floor construction is needed or not, one must pay for the
    floor space required for the systems to be installed. Customers who use rack-mounted
    systems should consider the “footprint” of each system being compared. This simply
    means to evaluate the area required for the entire system (processor drawer, I/O
    drawers, storage subsystems, other devices). How many systems can be installed
    per 19-inch rack? One, or more? Does the system require more than one rack? Using
    this approach, one can calculate a figure of merit system density (systems per
    19-inch rack footprint).


    Utilities. In the area of facilities, an increasingly important aspect of total
    cost of ownership is utilities cost. Computer systems can require a lot of electricity—both
    to power the hardware and to run the air conditioning to compensate for the heat
    generated by that hardware. So, when selecting among different computer systems,
    compare the power (in kilowatts, or kw) for each system and the air conditioning
    load that amount of power consumption represents. All system components (server,
    storage, printers, etc.) must be considered in order to make a valid comparison.


    Education/Training. The people who will be using the computer system may need
    training. The computer operators will need to understand how to manage the day-to-day
    operations of the computer. The users of the computer system will have to understand
    the application programs. It may also be necessary for a company to train its
    own programmers to write custom application programs. Although pSeries systems
    are designed for ease of use, some training will still be necessary. Many different
    types of training are available, as is discussed later in the chapter.


    Computer-based classes allow a user to sit at a terminal and learn about various
    subjects are available for free IBM Education Services. Some courses are for the
    users; others for the systems administrator and any programmers who may use the
    system. In addition, pSeries systems provide access to the IBMLink network, which
    allows the users and the systems administrator to electronically research technical
    issues, please service calls, and so on. The services provided by IBMLink are
    available seven days a week around the clock.


    Communications-Line Costs. If the computer system will be attached to remote workstations,
    to other remote computers, or to the Internet (very likely), there will be communications
    costs. Many different communications services are available today, and these should
    be considered in your justification.'
  merge: -1
  img_proc: true
- pgno: 310
  md: 'On the plus side of the ledger, the computer solution is being purchased to
    solve identified problems or address known needs. In other words, there will be
    benefits to the company after the computer system is installed. (Or else will
    you install it?) Although it is fairly easy to identify and quantify the costs
    associated with a computer system, it is often difficult to do the same for the
    benefits. This doesn''t mean that benefits are less than costs, it simply means
    that they require some work to uncover. Benefits are specific to a particular
    situation, so it would be impossible to list them all. Some common benefits associated
    with the application of computer systems are discussed here.


    **Improved Business Cycle.** The basic cycles of most businesses and other organizations
    have the same components. The business buys goods or equipment, takes orders for
    goods or services, delivers the goods, and bills the customer. The classic application
    of computer systems to these areas produces improvements in the basic cycle, resulting
    in collecting accounts receivable more quickly or taking better advantage of payable
    discount terms.


    **Inventory Reduction.** Many carrying costs are associated with inventory. These
    include warehouse space, insurance, taxes, and interest expense. The proper application
    of computers can reduce the level of inventory that must be kept on hand, thus
    reducing carrying costs.


    **Improved Productivity.** Given the proper tools, anyone in any part of an organization
    can do his or her job more efficiently. This allows an organization to get the
    same amount of work done in less time or with fewer people. Excess personnel can
    be redirected to perform other tasks that help meet the organization'' objectives.
    Further, as natural attrition reduces the workforce, it may be possible not to
    hire replacements, allowing for a reduction of the workforce over time.


    **Improved Quality.** By providing more timely or better organized information
    to personnel, organizations can improve the quality of the services or products
    they provide. For example, in manufacturing environments, computers can be applied
    to everything from design situations to statistical quality control.


    **Improved Customer Service.** By allowing an organization to respond to customer
    orders, questions, and special requests, computer systems can improve customer
    service. These improvements can include, for example, quickly responding to requests
    for price quotations and accurately quoting or meeting delivery dates.'
  merge: -1
  img_proc: true
- pgno: 311
  md: '# pSeries and Your Environment 285


    **Competitive Advantage.** The items just discussed, which contribute to reducing
    costs, improving quality, and improving customer service, all work to improve
    the effectiveness of an organization. The flexibility provided by a computer system
    can also help the competitiveness of a business by allowing it to respond more
    quickly to changing market demands. Change is inevitable, and it represents opportunity
    for the flexible and doom for the inflexible.


    This list of general benefits is in no way complete. Each organization will be
    able to add to the list based on its current situation and objectives. Once benefits
    have been identified, however, the job is still not done. The benefits should
    be quantified in dollars and cents where possible to help focus on the areas with
    the largest payoff. However, quantifying benefits can be difficult and subject
    to judgment. Unlike the price of a computer, which can be looked up in a catalog,
    benefits must be calculated based on expected results. For example, if it is estimated
    inventory can be reduced by 10% by installing an inventory management application
    program, one would multiply 10% of inventory value the carrying costs to determine
    the annual benefit. Other areas that are more difficult to quantify include increased
    employee productivity, increased sales (resulting from improved customer service),
    or lower employee turnover (resulting from improved working conditions and pride).
    That these benefits (and others like them) are difficult to quantify doesn''t
    make them any less valuable, but they are often overlooked.


    # Lease or Buy?


    After evaluating all the software and hardware alternatives and doing the cost/benefit
    analysis, a company must then decide on the acquisition method to be used. Several
    methods are commonly used to acquire a computer system. The most obvious alternative
    is to simply pay cash for the computer system, called an outright purchase. This
    is usually the least expensive way to acquire a computer system, but it has a
    direct impact on the organization''s cash flow and capital position. The next
    acquisition alternative is to finance the purchase over a period of time, just
    as one would a new home. In this case, there is simply a down payment (of 10%,
    for example) and a loan for the balance. Since interest must be paid on the loan,
    this is a more expensive alternative than a cash purchase, but it can reduce cash
    flow'
  merge: -1
  img_proc: true
- pgno: 312
  md: '# 286 Exploring IBM @serverSeries


    irements. In either of these cases, the title of the computer system passes to
    the business, as do any tax benefits such as depreciation. The purchaser of a
    computer also has the ability to sell the computer when it is replaced or no longer
    required, thus recovering the residual value of the computer system.


    Another acquisition alternative is the term lease. In this alternative, the lessor
    (computer owner) grants use of a computer system to the lessee (using the company),
    which in turn agrees to make payments for some specified period of time (or term).
    Terms can be any length, but they typically run for two to five years. If the
    lessee decides to terminate the lease before the end of the term, there is usually
    a termination fee. Some of the advantages offered by the term lease alternative
    include the conservation of capital and lines of credit. Common types of leases
    are “rent-to-own.” At the end of the term, the computer system can be purchased
    for a relatively small fee (e.g., 5% or 10% of the original cost), and the lessee
    gets the benefits of ownership. Operating leases are “real” leases, in which there
    is no discount purchase option at the end of the lease term. The lessor is the
    owner and retains the benefits of ownership, and capital lease payments are usually
    lower than with operating leases.


    One final alternative is to rent the computer system month by month. This provides
    the most flexibility because this kind of arrangement typically requires only
    one month’s notice to discontinue of, with higher rental payments are usually
    required to get this flexibility and, because the payment is usually not fixed,
    a company is subject to rental price increases.


    The acquisition of computer software is a different story. Typically, one does
    not have the option to “buy” software; most companies license the right to use
    the software under the conditions specified by the software company, calling the
    licensing agreement. These licenses usually allow the licensee to use the software
    on a specified computer system for a specified fee. Three common ways to pay for
    this are one-time charge, lease, and monthly charge. With the one-time charge,
    the licensee pays a set price and retains the right to use the software indefinitely.
    This charge can be paid in cash or financed. The leasing alternative is really
    another way to finance the one-time charge with no down payment. Finally, the
    monthly charge is like renting the software month to month indefinitely.'
  merge: -1
  img_proc: true
- pgno: 313
  md: '# User Education


    The discussions in the chapter so far should assist you in selecting the appropriate
    software and hardware to fit your needs. However, no matter what computer hardware
    and software you select, you will need people to operate them. To maximize efficiency
    and morale, these people (or users) must be provided with education in the use
    of the computer system itself well as its software.


    Proper education is critical to the success of any automation project. Inadequate
    education will prevent the productivity benefits afforded by moving a task to
    the computer. The goal of education is to make the users proficient at using the
    computer hardware and software and to make their interaction with the computer
    enjoyable. If using the computer is enjoyable, users will be more motivated. If
    the computer represents a frustrating struggle because of inadequate education,
    users will be less productive or perhaps will the computer altogether.


    The education should cover the pSeries hardware, the AIX 5L operating system,
    and the application software that will be used. Both pSeries and AIX 5L have been
    designed with close attention to making them as easy to use as possible. The documentation
    and on-line education courses provide a self-guided tour through pSeries and AIX
    5L basics. These offerings should provide adequate education for most users.


    For programmers and IT personnel who will be responsible for installing and managing
    a pSeries system, more detailed on-line courses and many classroom training offerings
    are available from IBM and others. The amount of education needed will depend
    on the tasks performed performed the experience of the student with AIX 5L or
    another UNIX operating system. Again, the on-line education courses offered by
    IBM are a good starting point for learning the AIX 5L operating system. Although
    the systems administrator will probably need such formal AIX 5L operating system
    education, often the operating system can be all hidden from the users, minimizing
    their needs in this area.


    Education in the use of the application program is usually the most important
    thing for the users. The content of this education depends on the particular application
    program selected. Typically, manuals provided with the application program will
    contain step-by-step tutorials designed to train the user. Depending on the complexity
    of the application program, the experience of the user, and the quality of the
    tutorial, this'
  merge: -1
  img_proc: true
- pgno: 314
  md: 'education method achieves varying levels of success. There are other

    ways of getting application program education. Software companies

    offer classes tailored to teaching how to use their application programs.

    Businesses sometimes send one person to a class of this type and

    then have the person teach other users upon returning. IBM, other soft-

    wawenders, and consultants can provide information about various

    classes, books, and on-line courses.


    Access to IBM education offerings for pSeries and AIX 5L

    products is available on the companion Web site (www.maxpress.com)

    for this book. Once you have logged onto the “Exploring pSeries” site,

    look under “Access Other IBM eServer pSeries Resources.” “AIX and

    pSeries Curriculum” will be one of the selections in that list.


    # IBMLink Support


    No matter what computer system a business chooses, the system and its

    users will require ongoing support. The users will have questions

    that need answering, problems that must be addressed, software

    updates that must be installed, and so forth. This support can be deliv-

    er in many different ways. Personnel from the computer manuf-

    turer, the software company, the business’s own staff, and so on are

    gerally involved in supporting the computer system and its users.


    In an effort to make this support more effective and convenient,

    IBM offers IBMLink. Just as electronic mail and on-line business in-

    formation streamline a business’s operation, IBMLink streamlines the sup-

    port to the business. Access to IBMLink is available on the

    companion Web site (www.maxpress.com) for this book. Once you have

    logged onto the “Exploring pSeries” site, click on “Access Other IBM

    eServer pSeries Resources,” “IBMLink” will be one of the selections in

    that list. Many of the information resources on IBMLink are publicly

    accessible, including the IBM sales manual, announcement letters, IBM

    news, a publications catalog, lists of local dealers, and IBM education.

    Others, such as product pricing and discounts and support services, are

    available only to registered users with a user ID and password. Gener-

    gally speaking, registered users will be either IBM customers or IBM

    Business Partners.'
  merge: -1
  img_proc: true
- pgno: 315
  md: '# pSeries and Your Environment 289


    ServiceLink allows customers who have maintenance agreements with IBM to communicate
    electronically with IBM service personnel to report problems. Further, it is possible
    to search electronically through IBM’s software updates (e.g., Program Fixaries,
    or PTFs), to receive the software update electronically and to apply the fix.
    There are interfaces to provide some simple e-mail functions between IBM personnel
    and the users, thus reducing “telephone tag.” With IBMLink, support is delivered
    electronically, improving access to technical and product information and streamlining
    communications between IBM and the users.


    # Ergonomics


    No plan would be complete without addressing the human needs that directly affect
    the day-to-day productivity of computer users—ergonomics. pSeries systems have
    been designed with careful attention to ergonomics. Everything from the power
    switch to the length of the keyboard cable is scrutinized. Much effort is expended
    fine-tuning the ergonomics of most application programs. To get the most out of
    your pSeries system, such as the American Optometric Association (AOA) and the
    New York Committee for Occupational Safety and Health (NYCOSH), as well as IBM,
    have probed deeply into the relationship between the computer and the user. Items
    such as desks, chairs, lighting, noise, and the like are important to productivity.


    # Comfort for the Eyes


    Like any other part of the human body, the eyes can get tired as a result of intensive
    use. This fatigue, called eyestrain, is nothing new to people who read for many
    hours at a time. With the increase in computer use over recent years, we have
    seen an increase in eyestrain. Although strain is only a temporary condition,
    it can cause a user to feel tired and irritated, especially if he or she continues
    to work because of the pressures of deadlines. Some simple actions will help include
    breaks'
  merge: -1
  img_proc: true
- pgno: 316
  md: '# 290 Exploring IBM@serverSeries


    or working on tasks that do not involve the computer. Also, it is desirable to
    put any paper that is frequently referenced during a computer session at the same
    distance and orientation as the computer screen. A clip-type holder used by typists
    to hold documents works well for this.


    Another contributor to eye fatigue commonly found in offices is improper lighting.
    The amount of glare by windows can be reduced by positioning the display at right
    angles to any window. Curtains or horizontal blinds can also be used to direct
    light away from the screen. Diffused office lighting will provide fewer “hot spots”
    and tend to provide the most uniform light and soften harsh shadows, or lower
    intensity bulbs or dimmer switches may be installed. To reduce the glare in the
    user’s environment, pSeries displays and terminals have antiglare screens.


    # Workstation Comfort


    The workstation furniture being used can also affect productivity. For this reason,
    attention should be given to the details of the user’s workstation, that is, the
    chair and desk and table to be used. A properly designed chair can reduce back
    problems and make the user more comfortable and productive. An improperly designed
    chair can lead to reduced alertness and shorter concentration spans. Users may
    not even realize they are uncomfortable as they unconsciously seek a more comfortable
    position.


    Once the user is seated, his or her relationship with the computer display and
    keyboard will affect comfort and thus productivity, so the computer display should
    be positioned properly. The top of the computer display should be positioned at
    10 degrees below eye level, the center of the display at 20 degrees below eye
    level and 14 to 22 inches away. A tilt/swivel stand under the terminal or display
    allows the user to adjust the display screen angle as desired. Users should avoid
    using bifocal lenses, which make them tilt their heads back when reading the screens.
    This can lead to discomfort in the back and shoulders.


    The keyboard should also be in a comfortable position. pSeries systems and associated
    terminals all provide separate keyboards attached by a flexible cable, which allows
    the user to position the keyboard as desired. The keyboard height should allow
    the elbow to be bent at 90 degrees used during typing. Finally, provide sufficient
    desk space for documents used during the computer session.'
  merge: -1
  img_proc: true
- pgno: 317
  md: '# What About Noise?


    Noise is not conducive to efficiency. Irregular noise is more distracting than
    constant noise. Unfortunately, irregular noise is commonplace in almost any busy
    environment. It results from nearby conversations, telephones, printers, copy
    machines, and many other things. If possible, isolate noise sources such as printers
    and copy machines by placing them in isolated areas or separate rooms. Noise can
    also be reduced by installing doors, carpets, and other sound-insulating materials.


    # Security


    In many environments, computer systems are the backbone of day-to-day operations.
    This makes the information stored on the computers an asset as valuable as cash.
    Like an organization''s cash, computer information must be protected from loss
    or theft. Let''s look at how this vital information can be protected.


    # Loss Prevention


    An ever-present hazard when dealing with information (with or without computers)
    is the possibility that the information will be lost. Loss can occur in many different
    ways. A computer system''s breakdown, such as a disk failure, can result in lost
    information. Further, operator error can cause data to be accidentally corrupted,
    resulting in lost information. Finally, a disaster (such as a fire or flood) can
    result in a loss of vital information. For this reason, recovery from the loss
    of vital information must be addressed.


    One way to deal with the losing of vital information is to have backup copies
    of computer information at regular intervals (for example, daily). Multiple backup
    copies should be made on a revolving basis and kept in a place safe from damage
    or loss. Three copies will allow at least one copy to be kept in safe storage
    at all times and provide for different levels of backup. In the event of an information
    loss, the computer system can be restored to the point at which the most recent
    backup copy was made. The AIX 5L operating system and the various tape and DVDRAM
    devices discussed in Chapter 2 are designed for these kinds of save/restore operations.
    Any changes to information after the point of'
  merge: -1
  img_proc: true
- pgno: 318
  md: 'the last backup will have to be re-created after the backup copy is used to
    restore the system. This may involve manually re-entering the trans-actions since
    the last backup. Mirroring, discussed in Chapter 3, can also be used to decrease
    the likelihood of losing valuable information.


    # Theft Prevention


    Theft prevention deals deals with protecting sensitive information from unauthorized
    disclosure. Security requirements vary widely from environment to environment
    and should be considered early in your planning.


    pSeries systems provide various levels of security that help deter unauthorized
    access. Security is provided by the computer system itself along with the operating
    system. In fact, pSeries systems and the AIX 5L operating system have been designed
    to meet the stringent security requirements defined by the National Security Center
    Trusted Computer System Evaluation Criteria C2.


    On the needs of the environment, various levels of security can be activated,
    from no security to detailed access control. A security officer is usually assigned
    to manage the security of the system.


    For sensitive environments, some customers may consider restricting access to
    areas where pSeries systems or associated terminals are located. These site-planning
    considerations should be considered early in a computer automation project.


    # Service


    Although every effort has been made to make pSeries systems as reliable as possible,
    some computers will fail, and if a computer does have a problem, there must be
    a way of getting it fixed. All pSeries systems come with a warranty from IBM.
    For many systems, the standard offering is a 1-year warranty that provides free
    on-site repairs from IBM’s service division 24 hours a day, 7 days a week. In
    order to be competitive in the entry and midrange UNIX server markets, IBM has
    begun to offer on some models a 1-year warranty with “9 to 5, nextbusiness-day”
    service. Upgrading to “7 x 24” support is available for an additional charge on
    these systems. These alternate options are not available in every geography, so
    the local IBM Service Representative or IBM Business Partner should be consulted.
    The vari-'
  merge: -1
  img_proc: true
- pgno: 319
  md: 'ous terminals, storage systems, and printers associated with pSeries sys-

    tems each have their own warranty terms and conditions.


    After the warranty period, the customer becomes responsible for

    maintenance of the system. IBM and others offer service agreements

    that, for a fee, provide postwarranty on-site service just like that pro-

    vided during the warranty, as well as less expensive options for other

    than $7 x 24$ support. Various maintenance discounts are available, de-

    pending on the level of systems management procedures implemented

    in a specific situation.


    If the system fails and there is no service contract, the user will have

    to pay for parts and labor, which can quickly become extremely expen-

    sive. For this reason, many businesses choose to keep their systems on

    maintenance after warranty as a type of insurance policy.


    Many factors affect the choice of computer system for a particular

    use. These factors include application availability, total cost of owner-

    ship, ergonomics, and the availability of qualified support providers.

    Where a UNIX solution fits the bill, IBM eServer pSeries systems, the

    AIX 5L operating system and associated software products, and the

    support offerings available from IBM and IBM Business Partners, de-

    liver solutions that merit careful consideration.'
  merge: -1
  img_proc: true
