    # Small Business—Bob’s Gearbox Company


    Our hypothetical small business is a gearbox manufacturer named Bob’s

    Gearbox Company. Bob’s has a standard line of gearboxes and also

    accept orders for custom gearboxes. It is a private corporation (owned

    by Bob, of course) with 32 employees. Bob has been in business for five

    years and has experienced moderate growth. He currently conducts

    business by noncomputer methods but finds himself needing to stream-

    line operation as the business grows. Bob is especially concerned

    that his profits seem to be shrinking as basics. A study of

    Bob’s business shows two basic causes for this. First, salespeople

    o commit to discounted pricing on a gearbox order to capture the

    business. The trouble is that Bob never knows what it actually

    costs him to produce a given gearbox. He uses standard cost estimates

    to price a customer’s order and hopes that his actual costs to build the

    gearbox are somewhere close.


    The second basic problem uncovered in the study is that Bob’s in-

    ventory is not well managed. The production department is often ham-\pered by
    not having the right parts and raw materials in inventory. This

    causes slips in the delivery of customer orders, hurting customer

    satisfaction and fueling heated arguments among the marketing man-

    ager, the production manager, and the materials manager. Finger point-

    ing is commonplace. The study also showed that 25% of the inventory

    items in stock are obsolete and will never be used.


    In this scenario, it is clear that Bob has outgrown his manual meth-

    of doing business and needs a better way to track the actual costs

    associated with manufacturing his products. This may uncover the fact

    that his salespeople sell gearboxes at or below cost. Bob also needs

