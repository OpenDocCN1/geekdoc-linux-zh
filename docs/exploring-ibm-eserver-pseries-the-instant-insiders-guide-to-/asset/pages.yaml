    # The Quiet Touch Keyboard


    The pSeries systems use the IBM Quiet Touch Keyboard shown in Figure 1.38. This
    keyboard has the same layout as the keyboard used by IBM''S ASCII displays, the
    PC family, and the InfoWindow family of displays used with other IBM computer
    systems. This means that familiar with this layout, the user will not have to
    adapt to different keyboard layouts when using other IBM computer equipment. This
    same keyboard is available in different languages to fill the needs of many different
    users around the world. The keyboard cable plugs into the pSeries systems. Small
    retractable legs on the bottom of the keyboard can be extended to change the angle
    of the keyboard if desired.


    # Mechanical Packaging


    The overall physical size of the pSeries systems is kept to a minimum, consistent
    with the size necessary to accommodate greater expansion options. As with other
    common electronic devices (e.g., cell phones,


    ![](img/29c52a1767a1e621ce6343faa9399737_147_0.png)


    **Figure 1.38.** The IBM Quiet Touch Keyboard used with pSeries systems.'
