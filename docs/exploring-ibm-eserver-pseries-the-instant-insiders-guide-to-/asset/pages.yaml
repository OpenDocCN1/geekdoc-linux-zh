- pgno: 16
  md: '# Introduction


    # What This Book Is


    This book is dedicated to IBM eServer pSeries™ servers, the UNIX® systems of the
    IBM eServer brand, which encompasses the complete range of IBM hardware architectures
    and operating systems. The IBM eServer pSeries follows in the tradition of IBM
