- pgno: 6
  md: '# Foreword


    It''s an exciting time in the world of UNIX computing as UNIX® operating systems
    represent an increasingly important component of a successful infrastructure,
    driving many of the most business-critical functions in enterprises throughout
    the world.


    According to IDC analyst Jean Bozman, in the July 7, 2003 issue of Computer World,
    “UNIX is a tremendous presence, and it is still the single largest size of the
    market.” And the reasons for this are quite simple: performance, RAS, total cost
    of ownership, application availability and flexibility to name a few. These attributes
    are critically important criteria for enterprise workloads, and customers are
    confident UNIX systems deliver.


    In the case of IBM eServer™ pSeries™ systems, we''re making extraordinary advances
    in the underlying technologies that address these business critical. The POWER™
    architecture is perhaps the most proven and reliable 64-bit processor platform
    in the industry. Our extensive POWER roadmap helps customers that POWER based
    offerings continue to add value. The latest POWER4™ processors, for example, were
    incorporated in the entry-class p615 through the flagship p690, in less than six
    months.


    The common trend throughout all the pSeries product offerings are the “no compromise”
    value position. The basic premise behind “no compromises” is that customers should
    not have to sacrifice reliability or functionality for low-price solutions. The
    objective is to provide customers with mainframe strength technologies throughout
    the entire pSeries line at affordable prices.


    AIX 5L”, for example, continues to represent IBM as our strategic enterprise-class
    UNIX operating system, and IBM continues to invest resources into AIX to extend
    its leadership as a world-class UNIX environment. Customers can be assured that
    the AIX excellence continues to advance, as is the case with the most recent release
    of the AIX 5L operating system, version 5.2, which has enabled new levels of partitioning
    and capacity planning for customers to attain even greater functionality and flexibility.


    Flexibility is increasingly more important for customers and pSeries is making
    every effort to ensure our platform is ready to accommodate'
  merge: -1
  img_proc: true
- pgno: 7
  md: '# Exploring IBM @server pSeries


    a wide range of infrastructure requirements. For example, we have integrated Linux
    into our overall pSeries ecosystem where it makes sense for customers. It''s clear
    that Linux is an option that customers want available to them, particularly at
    the entry and midrange levels, and pSeries has a number of Linux Ready Express
    Configurations for low customers to integrate Linux using pSeries servers. In
    addition to native Linux on pSeries systems, our Dynamic Logical Partitioning
    (DLPAR) technology allows customers to utilize Linux, AIX 5 or both operating
    systems in any combination—all on one server. Customers have never had such extraordinary
    levels of flexibility and pSeries is only making it better.


    Taking flexibility to the next level is what IBM''s e-business on demand initiative
    is all about. IBM is connecting the future of how business gets done with technology
    in a way that is revolutionizing the entire concept of e-business. At its core,
    e-business on demand is fundamentally about taking organizational productivity
    to new levels of success. And pSeries technology plays a critical role in this
    new era of productivity.


    In fact, many of the pSeries technology advantages developed by IBM over the years
    are perfectly suited for an on demand operating environment. It''s in our DNA.
    We''ve been at this for a while and the pSeries heritage fits perfectly into an
    on demand era. IBM has a strong history in developing technologies that can breathe
    “on demand” life into customer enterprises in new and exciting ways.


    Market dynamics are altering the IT approach customers must take to support their
    business in an era of demand computing. The pSeries platform is ready and waiting
    to implement with a host of new demand customers can implement immediately. And
    with a solid on demand roadmap in place, the pSeries offerings are well-positioned
    to represent cutting-edge “no compromises” on demand UNIX and Linux solutions.


    I hope you enjoy this latest edition of Exploring IBM eServer pSeries and that
    it provides you deeper insights on how IBM technology is breaking new ground to
    provide even greater levels of customer value.


    Adalio Sanchez, General Manager,

    IBM eServer pSeries, IBM Corporation'
  merge: -1
  img_proc: true
