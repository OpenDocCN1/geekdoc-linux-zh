  md: 'node to node in a continuous circle. These packets are called message frames.
    A unique frame, called a token frame, controls access to the ring. When a node
    receives a frame, it checks to see if it is a message or a token frame. If it
    is a message frame, the node examines the destination address (see Figure 2.11)
    to see if the message is intended for that


    ![](img/29c52a1767a1e621ce6343faa9399737_187_0.png)


    **Figure 2.11.** The token-ring network uses a messssage frame to move information
    around the network in an orderly fashion.'
