  md: 'application programs that are designed to use only those services will work
    on any type of computer system and network. The Open Group (discussed earlier
    in this chapter in “AIX 5L—An Executive Overview”) has selected and endorsed a
    set of distributed computing technologies taken from many different vendors and
    collectively called them the distributed computing environment. IBM’s AIX DCE
    products are built on the Open Group’s DCE.


    Many of the base “run-time” services of DCE and its major service, the Distributed
