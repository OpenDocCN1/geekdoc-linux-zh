    support for pSeries servers. For links to additional information about

    Linux, see the companion Web site for this book (www.maxpress.com).


    # Device Drivers


    The third and final layer of software in our software model is the device

    driver layer (highlighted in Figure 3.4). “Device driver” is a fancy term

    for a set of highly specialized programs, usually written by the manuf-

    turer of hardware. These specialized programs reside in pSeries

    main memory or in memory provided right on the adapters they control.


    Unlike application programs or operating systems, device drivers

    are only used by the users and exist only to help application programs and

    the operating system elements under their tasks. They interact directly with

    computer hardware elements under the control of the operating system


    ![](img/29c52a1767a1e621ce6343faa9399737_217_0.png)


    **Figure 3.4.** The device driver software layer of the software model. Device

    drivers directly control the hardware elements of pSeries systems and shield

    application programs and operating systems from hardware details.'
  merge: -1
  img_proc: true
- pgno: 218
  md: 'or application program layers. Device drivers also help shield applications
    from the hardware specifics of computers, allowing for evolutionary product improvements
    without sacrificing application program compatibility. Each hardware feature (device
    or adapter card) requires a device driver program. The device drivers for pSeries
    features (discussed in Chapter 2) are included with AIX 5L.


    # pSeries Software Compatibility


    Computer systems that run the UNIX operating system have been in existence for
    many years. As a result, a wide variety of application programs have been developed
    for UNIX. The flexibility afforded by virtue of this large and diverse software
    allowed computers running to fill many different needs. Of course, this sea of
    available application programs did not exist when the original UNIX operating
    system was first announced. It took the independent efforts of a great many people
    over many years to develop the large number of application programs (called an
    application software base) that exist today.


    # Why Compatibility Is Important


    In order to capitalize on that software base, application software compatibility
    was a primary objective in the design of the AIX 5L operating system. That is,
    most application programs written for UNIX operating systems can easily be migrated
    to the pSeries system and the AIX 5L operating system by the software developer.


    It is important to understand that the three software layers in our software model,
    compatibility with programs in the application programs layer is most important.
    Why? First of all, application programs typically represent the lion''s share
    of a user''s software investment. Further, being forced to abandon an application
    program because of incompatibilities may make users throw away data and training
    or experience they have accumulated with the application program—both of which
    can be substantial. Some users have developed custom application programs at considerable
    cost in development time and money. Incompatibility at the application program
    level would ren-'
  merge: -1
  img_proc: true
- pgno: 219
  md: '# Application Programs and Operating Systems 193


    der these programs virtually useless. Last, and perhaps most important, application
    layer compatibility allows pSeries system users to choose from the thousands of
    application programs that were originally developed for the UNIX operating system.


    What about the operating system and device driver layers? The ability to run earlier
    UNIX operating system software is not important for several reasons. Operating
    systems typically represent only a small fraction of the user''s software investment;
    they can be upgraded without changing the user''s view of the computer system.
    Further, a new operating system is usually necessary to allow users to access
    to new features of the computer system not considered by the programmers of the
    old operating system. Of course, one of the purposes of the device driver layer
    is to allow the computer hardware to change without affecting compatibility with
    the operating system and application programs. This is done by changing the way
    a device driver interacts with hardware without changing the way the device driver
    interacts with the operating system or application programs. The user is supplied
    with new device drivers to support pSeries hardware.


    # Inside pSeries Compatibility


    To understand pSeries compatibility, you must understand a little about how application
    programs are written. First, a programmer writes an application program''s instructions
    or code using a programming language (e.g., C++, FORTRAN, etc.). A programming
    language is basically a library of computer instructions from which a programmer
    may choose to write programs. The list of programming language instructions that
    make an application program is called the program''s source code. In order to
    run the application program on a computer, the source-code instructions must be
    converted into instructions a computer can understand. This process is compiling
    the program. When the source code is compiled, the result is called object code
    and can be directly executed by the computer hardware.


    The most important thing to understand about pSeries compatibility is that any
    model of the pSeries family is object-code-compatible with all other pSeries models
    and earlier RS/6000 systems. That is, you can take the object code for an application
    program compiled on an'
  merge: -1
  img_proc: true
- pgno: 220
  md: '# 194 Exploring IBM@server pSeries


    RS/6000 Model 150, load it on a properly configured pSeries 630, and run the program
    with no changes.


    A word of caution is necessary at this point. Object-code compatibility is described
    for 32-bit applications (i.e., applications written for systems that used 32-bit
    microprocessors). All current pSeries and RS/6000 computers, except Models B50
    and 150, use 64-bit architectures, and they can run AIX 5L applications written
    for earlier 32-bit systems. However, the reverse is not true. Applications written
    to take advantage of 64-bit architectures cannot run on older systems that do
    not have 64-bit capacity. This situation is called “upward compatibility,” since
    it enables users to carry forward their investment in applications on earlier
    systems to run on the latest, most powerful computers.


    Since AIX 5L is compliant with UNIX 98 standards, most application programs written
    for UNIX operating systems, including earlier versions of AIX, and for Linux,
    will be highly source-code-compatible with pSeries systems. This means that a
    programmer must make only a few minor changes in the application program code,
    load the source code written for the UNIX operating system on a pSeries system,
    and recompile the source code using the appropriate pSeries compilers. The new
    object code generated can then be executed on the pSeries system. This process
    is called “porting.”


    In addition to UNIX source-code compatibility, AIX 5L provides “interoperability”
    functions that facilitate systems management in mixed environments of pSeries
    systems and UNIX servers from other suppliers. These functions include UNIX V
    commands, hence the term “SVR affinity.” SVR affinity tools make AIX 5L a bit
    more familiar to technology (IT) personnel who have experience with UNIX operating
    systems other than AIX 5L.


    For applications written for Linux, AI 5L provides interfaces and software libraries
    to make it as easy as possible to port these applications to run on pSeries systems.
    These “Linux affinity” tools will be described later in the chapter. As described
    in Chapter 1, native Linux distributions are available for most pSeries systems,
    and Linux can run in one or more logical partitions on p630, p650, p665, p670,
    and p690 servers.


    The syntax or grammar of source code for various languages is defined by independent
    standards. This compliance to industry standards is what makes an “open system”
    open and is the essential element of pSeries software compatibility.'
