  md: '# Internal Tape Storage


    Computer systems are woven deeply into today''s business, academic, and scientific
    communities, and usually become the core of day-to-day operations. The information
    stored on the computer is a valuable asset and therefore must be protected. Magnetic
    tape storage provides a cost-effective and efficient means of backing up the information
    on the disks of computer systems. Included among the internal tape storage options
    that can be used with pSeries systems are the following.


    # 20/40 GB 4-mm Internal Tape Drive (#6158, #6185)


    20/40 GB 4-mm Internal Tape Drive is a 5.25-inch half-high tape drive that provides
    high capacity for save/restore and achieve functions. This tape drive uses IBM
    4-mm data cartridges and is compression capable, providing a capacity up to 40
    GB (with 2x compression)—a significant increase in capacity over the previous
    12/24 GB 4-mm internal tape drives (when using DDS4 media). It provides a data
    transfer rate of 3 Mbps in native mode and 6 Mbps with typical compression across
    a SCSI-2 interface. It provides compatibility across the following modes:  GB
    mode (read/write), 8 GB compression (read/write), 12 GB mode (read/write), 24
    GB compression (read/write), 20 GB mode (read/write), and 40 GB compression (read/write).


    # 80/160 GB 8-mm Internal Tape Drive with VXA Technology (#6120, #6169)


    80/160 GB Internal Tape Drive with VXA technology uses VXA tape data cartridges
    and is anticipated to replace 4-mm tape technology, since the capacity is four
    times greater and data rates are twice as high. However, at the moment, pSeries
    supports both 4-mm and VXA technology. This tape drive uses a helical scan with
    a rotating read/write head. Its data rate is 6 Mbps in native mode and 12 Mbps
    in compression mode.


    # 60/150 GB 16-bit 8-mm Internal Tape Drive (#6134)


    60/150 GB 16-bit 8-mm Internal Tape Drive (#6134) is a 5.25-inch device that can
    be installed inside a broad range of pSeries systems. This tape drive uses IBM
    8-mm data cartridges and is compression capable,'
  merge: -1
  img_proc: true
- pgno: 173
  md: 'providing a capacity of up to 150 GB, a 375% increase over the previous 20/40
    GB 8-mm tape technology. Data rates from 12 Mbps in native mode and 30 Mbps with
    compression. It attaches via a SCSI-2 wide port on the pSeries system. The 6134
    also provides backward compatibility with much earlier generation 8-mm tape cartridges.


    # External Tape Options


    For smaller systems, external tape drives are often the easiest way to back up
    or install the system. For larger systems with hundreds of gigabytes of data,
    a single tape drive is simply not sufficient either in capacity or speed to fill
    the bill. For these systems, larger tape libraries that can automatically load
    many tape cartridges into multiple tape drives provide an excellent solution.


    # 4-mm Tape Options


    The 4-mm digital audio tape (DAT) employs an advanced helical scan recording technology.
    In helical scanning, tape passes over the tape drive''s recording head at an angle,
    creating thousands of densely packed packed diagonal tracks. The 4-mm technology
    fills the gap between 8-mm and 3-inch tape.


    # 7206 External 4-mm Tape Drive Model 220


    The 7206 4-mm Tape Drive is an external device that can be used with all pSeries
    models. It is a self-contained device designed to rest beside a system. It is
    attached to the pSeries via a cable to a port and gets its power from a standard
    electrical socket. The 7206-220 is primarily used for disk backup, data archiving,
    and information distribution. It provides 20 GB cartridge capacity, expandable
    to a compressed capacity to 40 GB using DDS-4 and either Ultra-SCSI or low-voltage
    differential (LVD) interfaces.


    # 7206 External Tape Drive Model VX2


    The 7206-VX2 is an external tape drive offering the emerging VXA tape technology
    mentioned above for the internal tape drive (#6120). It uses VXA tape cartridges
    and offers 80 GB native and 160 GB com'
