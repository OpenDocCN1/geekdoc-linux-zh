    # Cryptographic Coprocessors


    The pSeries servers offer several adapters that provide data encryption capability
    meeting industry standards for data security. These adapters are called coprocessors
    because they handle much of the processing by complex data encryption algorithms,
    off-loading that workload from the server and providing enhanced throughput and
    security. They are used for secure Internet transactions, such as secure data
    exchange, electronic signature verification, and bulk data encryption and verification.


    The IBM e-business Cryptographic Accelerator (#4960) provides PCI Secure Socket
    Layer (SSL) hardware acceleration for secure Web transactions. Public-key cryptographic
    operations use the SSL handshake protocol to provide secure Web transactions,
    and this adapter is a hardware solution that provides data encryption over the
    PCI bus to the pSeries servers, thus, off-loading this computation-intensive workload
    from the server into it is installed and improving overall cryptographic performance.


