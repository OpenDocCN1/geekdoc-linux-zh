  md: '# LAN Communications Adapters


    All pSeries systems can participate in Ethernet and Token-Ring local area networks.
    Although a Token-Ring adapter is still available, Token-Ring LAN is being phased
    out in favor of the industry-standard Ethernet technology. In fact, all the pSeries
    and R$/6000 servers, except the p670 and p690 servers, have at least one integrated
    Ethernet controller. The new p615 has an integrated Gigabit Ethernet controller
    and 10/100 Mbps Ethernet port.


    # Ethernet Adapters


    All of these adapters allow a pSeries system to connect to an Ethernet Version
    2 or IEEE 802.3 LAN. Ethernet networks initially transferred information at a
    rate of at least 10 Mbps using the CSA/CD protocol discussed earlier. This speed
    has increased to 100 Mbps and to gigabit (1,000 Mbps) capability in recent years.
    Two types of connection are now common—Category 5 (CAT-5) unshielded twisted-pair
    (UTP) and fiber. Older cards supported thick (50-ohm) or thin (RG-58A/U) coaxial,
    but now a faster Ethernet standard has emerged that allows rates of 100 Mbps and
    1000 Mbps using Category 5 cabling. Figure 2.13 summarizes the Ethernet adapters
    available for pSeries systems.


    # Gigabit SX Ethernet PCI Adapter (#2969)


    The IBM Gigabit SX Ethernet PCI Adapter (#2969) provides a 1 Gbps full-duplex
    Ethernet connection using a 1000 Base-SX fiber connection to an Ethernet switch.
    This adapter provides full 64-bit operation and requires a 64-bit PCI slot in
    the host pSeries server. The adapter is supported by both AIX 5L, v5.1 and v5.2,
    and AIX v4.3. When used this adapter offers a function called ''large send'' in
    which the resegmentation of TCP transmissions is off-loaded to the adapter, enhancing
    throughput and reducing processing load on the host server.


    # 10/100/1000 Base-T Ethernet PCI Adapter (#2975)


    The IBM 10/100/1000 Base-T Ethernet PCI Adapter (#2975) provides a full-duplex
    Ethernet connection up to 100 meters long at speeds up to 1 Gbps using CAT-5 UTP
    cabling. For optimum performance, this adapter should be located in a 64-bit PCI
    slot. Like the Gigabit SX'
