    # Logical Partitioning


    The Series 690 offers dynamic logical partitioning of system resources—processors,
    memory, and I/O slots (and the attached devices). System administrators can assign
    these resources in any combination, unconstrained by physical packaging boundaries,
    to form virtual systems within the p690. The design of the p690 LPAR capability
    is based on the experience IBM brings from its mainframe-class systems, which
    have offered logical partitioning capability for over 25 years.


    The p690 allows up to 32 LPARs to be formed, with each partition running its copy
    of the operating system—AIX 5L v5.1, AIX 5L v5.2, or Linux. The system protects
    each partition from software errors in other partitions, and the hardware is designed
    with isolation to prevent propagation of hardware failures. Resource allocation
    requires careful planning by systems administrators. The smallest units of resources
    that can be allocated are one processor, 256 MB of memory (expandable in units
    of 256 MB), and one I/O adapter slot. Each partition must have its own device
    and associated adapter and Ethernet attachment to the IBM 7315-C02 Hardware Management
    Console. Special consideration must be given to handling devices that may be needed
    at times by multiple partitions (e.g., CD-ROM or tape). Media devices should be
    attached to an adapter or integrated controller that can be reassigned among LPARs
    as required for installing software or backup operations.'
