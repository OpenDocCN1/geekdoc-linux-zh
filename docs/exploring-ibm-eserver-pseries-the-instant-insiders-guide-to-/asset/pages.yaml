    # Systems Management


    With any computer system, various tasks must be performed in support of the computer
    system itself by someone trained to be a systems administrator. These are called
    systems management tasks and involve things as authorizing new users and making
    backup copies of the disk information. This basic operating system tasks can be
    done by stepping through menus in the Systems Management Interface Of AIX 5L.
    More experienced administrators may use AIX 5L operating system commands from
    a command shell, as previously described.


    In today''s distributed world, this is no simple task, especially if one is managing
    a large number of machines that are geographically dispersed. For managing one
    or a small number of pSeries systems, the tools provided with AIX 5L are adequate.
    But for situations in which hundreds of systems and/or a heterogeneous mix of
    pSeries and other systems must be managed, IBM offers the Tivoli 7 suite of systems
    management products, which form the basic infrastructure to link together a vast
    array of systems from various suppliers and running a variety of operating systems.


    One of the first jobs to be done by a systems administrator is to tell the system
    who is authorized to use it. This is done by creating a user profile for each
    user. The user profile contains information such as the user''s nickname (called
    a user identification, or user ID), password, and security level, and accounting
    information for departmental billing for computer services. The AIX 5L operating
    system''s built-in security, if enabled, will require the user to enter the correct
    password before being allowed access to the system. If desired, security can be
    defined so that the user is restricted to specific functions. In fact, security
    enhancements were made to AIX 5L based on'
