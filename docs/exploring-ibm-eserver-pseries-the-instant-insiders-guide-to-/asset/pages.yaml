  md: '# IBM server pSeries—An Overview


    proprietary Micro Channel (MCA) bus. These PCI/ISA systems represented a major
    paradigm shift for the RS/6000 product line. Along with this change, IBM''s RS/6000
    Division began a move from a line of specialized machines with custom-built components
    in fairly low volumes to a more generalized line of systems with common off-the-shelf
    components. There were advantages for both the user and IBM. IBM could design
    new systems and release them to the market more rapidly than before, and the use
    of common, high-volume parts, including some used in the personal computer line
    (power supplies, cables, disks, memory, etc.) allowed the user to continue to
    drop. Recent examples of implementing this open systems paradigm include Fibre
    Channel architecture and storage area networks (SANs), and support for applications
    requiring the Linux operating system. And, following the latest industry standard
    I/O architecture direction, recently announced pSeries servers and I/O drawers
    support hot-plug PCI-X adapters. To understand major differences among the various
    models, the following paragraphs provide a thumbnail sketch of the pSeries family
    and the RS/6000 models still available. Greater detail will be given in the next
    section.


    The pSeries610 is designed for small to medium-sized businesses and is available
    in two models. The pSeries 610 Model 6C1 is a rack-drawer server, and the pSeries
    610 Model 6E1 comes in a desktop configuration. Both models are 1 to 2-way symmetric
    multiprocessing (SMP) servers using 333 MHz, 375 MHz, or 450 MHz POWER-3 processors.
    Larger companies may select the p610 for situations where many small systems must
    be deployed in separate locations, as in retail of stores.


    The pSeries 615, a 1- or 2-way SMP server, introduces POWER4+ technology to the
    lower end of the pSeries family and is intended to replace the older p610 in the
    future. The pSeries 615 Model 6C3 is a rack-mount server, while the pSeries 615
    Model 6E3 is a desktop unit. Both are powered by 2 GHz POWER4+ processors and
    provide extensive scalability for an entry system—up to eight disk drives and
    six PCI-X slots. Like the p610, this server is designed for small to medium-sized
    companies and for distributed systems in large corporations.


    The pSeries 620, a midrange desktop server with up to three processors running
    at either 600 MHz or 750 MHz and lots of expansion capability, can satisfy the
    total computing requirements of many small or even medium-sized companies. There
    are two p620 models, differing solely in the fact that the pSeries 620 Model 6F0
    can be expanded only'
