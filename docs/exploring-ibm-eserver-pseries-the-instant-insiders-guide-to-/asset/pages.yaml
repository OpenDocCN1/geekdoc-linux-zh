    # Is a pSeries System the Right Choice?


    When looking for ways to meet computing needs, one is faced with a seemingly endless
    series of questions. Before we get into the details of how to select pSeries hardware,
    let''s pause and glance at some other hardware alternatives.


    # What About Personal Computers?


    We covered this topic at the introduction of this book because it seems to be
    the first question that everyone asks. For more information the personal computer
    (PC) family, read IBM eServer xSeries by Jim Hoskins and Bill Wilson (Maximum
    Press).


    # What About iSeries Systems?


    iSeries systems are IBM midrange computer system based on the OS/400® operating
    system, replacing the popular AS/400® computer family. iSeries computers are multiuser
    systems designed to meet the needs of business applications. The pSeries family,
    on the other hand, offers models suitable for either commercial or high-performance
    computing (HPC) environments, as described in Chapter 1. Because the iSeries family
    has no capability to be used for technical or HPC applications, the pSeries family
    is clearly the pick for situations where those applications prevail. In the general-purpose
    multiuser computer system arena, however, there is certainly room for confusion
    when deciding between the pSeries and the iSeries families of servers. To resolve
    this confusion, let''s look at some of the design points of each family.'
  merge: -1
  img_proc: true
- pgno: 293
  md: '# pSeries and Your Environment 267


    The iSeries systems architecture includes a built-in relational database. In other
    words, the iSeries hardware and operating system have been designed specifically
    to provide the database function commonly needed in business environments. Most
    other computer systems (including the pSeries) require separately purchased database
    systems that sit on top of the operating system to provide users with a relational
    database. Because the iSeries system''s database is implemented in the hardware-
    and operating system, the performance and elegance of database implementation
    are improved. Further, the programmer productivity afforded by the built-in iSeries
    database makes it a good system for those writing and maintaining their own application
    programs. iSeries systems are designed around an advanced application architecture
    that facilitates the implementation of distributed computing environments. Other
    things being equal, if there is a requirement to coexist with a network of other
    IBM systems following this application-centric architecture or to run applications
    for the OS/400 operating system, then an iSeries system is probably the right
    choice. iSeries computers can also participate in “open” environments through
    their support of TCP/IP communications.


    The pSeries has no built-in database, but many relational database programs are
    available that add this capability to the system. For those who currently a multiuser
    computer system running the UNIX operating system, migrating to a pSeries system
    will be much more natural than migrating to an iSeries system. If there is a need
    to coexist with computer systems of many different brands, the open-system approach
    taken by the pSeries system will be a plus. By supporting many industry standards,
    pSeries systems and the AIX 5L operating system are designed to participate with
    other types of computing equipment. For more information about the iSeries family,
    read Exploring IBM eServer iSeries by Jim Hoskins and Roger Dimmick (Maximum Press).


    # What About zSeries Systems?


    Like pSeries systems, zSeries servers are multiuser computer systems that allow
    many users to share the system. Either zSeries or pSeries systems might provide
    better performance, depending on the specific applications, the number of users
    involved, and other variables. Because zSeries computers can also run UNIX and
    Linux applications on the'
  merge: -1
  img_proc: true
- pgno: 294
  md: 'OS/390® operating system, some of the applications that run on the pSeries
    are available for the zSeries, and vice versa. For these reas, the choice between
    pSeries and zSeries systems is not always clear and will depend heavily on the
    details of a situation. However, here are some general things to consider.


    The zSeries spans the computational power range that overlaps with high-end pSeries
    models and extends to very large mainframe computing systems. To maintain a zSeries
    computer, a highly trained programmer, called a systems programmer, is needed,
    because the operating systems used by zSeries computers are both powerful and
    complex. Experienced personnel are needed to install and manage these operating
    systems. Although zSeries computers can easily be managed by systems programming
    personnel at a central site, the expertise must be available at some level. pSeries
    systems and the AIX 5L operating system, on the other hand, require a systems
    operator and a programming staff only if custom application software is developed
    and supported.


    Another way of comparing a zSeries computer with a group of pSeries systems connected
    via a LAN brings us to the discussion of centralized versus decentralized computing.
    A single system being shared by a community of users is considered a centralized
    computer environment where the significant processing and all auxiliary storage
    are resident in a single computer. One advantage of the decentralized approach
    is easier system management because the computer operators, systems programmers,
    and programming staff have complete control over the computer system. Important
    practices such as nightly tape backup of disk storage are enforced. The decentralized
    approach is represented by multiple systems located throughout a building, throughout
    a campus, or around the world, connected via a LAN and/or telecommunications links.
    Advantages of this approach are physical separation and greater independence of
    operations at each location while retaining the ability to share data. There are
    good and bad points to both the centralized and decentralized approaches. zSeries
    systems, being larger than most pSeries models, offer less granular choices for
    decentralization.


    Using Cluster 1600 technologies, pSeries systems can be clustered to help achieve
    the best of the decentralized and centralized models. Users can have separate
    systems for a distributed client/server environment, while management of the cluster
    is centralized in a single point of control, the cluster management server.'
  merge: -1
  img_proc: true
- pgno: 295
  md: '# pSeries and Your Environment 269


    Many times, the decision between pSeries and zSeries systems will be based on
    the current situation. For instance, if a zSeries or S/390 computer is already
    in place, it may be natural to expand with zSeries systems. On the other hand,
    if the UNIX operating system is being used today, it probably makes sense to migrate
    those applications to a pSeries system, which can easily interface with zSeries
    servers as required. The decision may become a matter of philosophy. For more
    information about the zSeries family, read Exploring IBM eServer zSeries and S/390
    Servers by Jim Hoskins and Bob Frank (Maximum Press).


    # When Should a pSeries System Be Considered?


    As is evident from the foregoing discussions, there is no magic formula for selecting
    a particular type of computer. There are complex and interrelated factors to be
    considered—application software, operating system, and IT skills, existing equipment,
    workload, number of users, and so. If the appropriate application software is
    available for the UNIX environment, then there is probably a pSeries model that
    will handle the workload and number of users. In addition, the scalability of
    processing and storage capacity of individual pSeries models (and the software
    compatibility across the pSeries family) are designed to accommodate increased
    workloads as business grows. Finally, the support of pSeries and AIX 5L for open-systems
    standards and a broad range of communications options can help users incorporate
    pSeries systems into environments with other types of computers.


    # Choosing pSeries Configurations


    Even after the question of application software and operating system has been
    settled, selecting the proper pSeries hardware and software components to meet
    a company''s specific needs can still be confusing. The pSeries system model,
    disk storage and I/O adapter features, peripherals such as tape drives, operating
    system, and supporting software must be selected. We looked at a few guiding principles
    during the introduction of the book, but to aid in this activity, let''s examine
    three hypothetical business scenarios and outfit them with the appropriate pSeries
    configurations. These admittedly simplified examples of a small,'
