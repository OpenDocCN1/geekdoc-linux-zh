    Options and Peripherals


    IBM eServer pSeries systems can be found in diverse environments ranging from
    research laboratories to retail stores to insurance companies. The activities
    these various users perform vary widely, and so do their computing needs. pSeries
    systems can be customized to many environments by selecting the appropriate optional
    equipment. This chapter describes many adapters and peripheral devices that are
    commonly used with pSeries systems.


    Adapters, or feature cards, are circuit boards that are installed in the PCI or
    PCI-X I/O slots of pSeries systems to provide some additional capacity or function
    for the system. These feature cards include storage adapters, LAN adapters, graphics
    accelerators, and cryptographic coprocessors.


    Peripherals are devices that are installed in or attach to pSeries systems to
    perform some specialized function. Disk drives, tape drives, printers, and plotters
    fall into this category.


    It is helpful to understand IBM terminology for these options. Peripheral devices
    have specific product numbers associated with them (e.g., the 2104-DU3 Expandable
    Storage subsystem or the 4247 Serial Matrix Printer). Optional features installed
    in pSeries systems are identified by feature numbers (e.g., the Dual-channel Ultra3-SCSI
    Adapter is feature #6203, and the pSeries 615 1 GB Memory'
