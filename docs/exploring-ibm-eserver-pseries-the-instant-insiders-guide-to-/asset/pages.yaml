    family were based with the POWER2 multipchip main processor design or the more
    powerful POWER2 single-chip design, called the POWER2 Super Chip (P2SC).


    To understand the POWER architecture, it is necessary to look at two pieces of
    pSeries systems—the main processor and main memory system, which, along with other
