    \        error = EOPNOTSUPP;\n        break;\n}\n\nreturn(error);\n```\n\n```\n\
    SYSCALL_MODULE(sc_example, &offset, &sc_example_sysent, load, NULL);\n```\n\n\
    - 列表 1-3: sc_example.c\n\n如你所见，该模块仅仅在本节中描述的所有组件的组合，外加上事件处理函数。以下是加载此模块的结果：\n\n\
