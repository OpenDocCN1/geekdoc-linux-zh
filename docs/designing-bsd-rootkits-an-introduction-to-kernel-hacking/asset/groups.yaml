    # ## 6.1 What HIDSes Do


    In general, an HIDS is designed to monitor, detect, and log the modifications
    to the files on a filesystem. That is, it is designed to detect file tampering
    and trojaned binaries. For every file, an HIDS creates a cryptographic hash of
    the file data and records it in a database; any change to it results in a file
    data with a different hash being generated. Whenever an HIDS audits a filesystem,
    it compares the current hash of every file with its counterpart in the database;
    if the two differ, the file is flagged.


    In principle this is a good idea'
