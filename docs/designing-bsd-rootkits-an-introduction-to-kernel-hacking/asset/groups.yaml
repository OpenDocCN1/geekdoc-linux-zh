    ```


    在上面的列表中，加载了三个“模块”：内核（kernel）、ACPI 电源管理模块（acpi.ko）以及我们在 1.3 节中开发的“Hello, world!”模块（hello.ko）。


    运行命令 kldstat -v（为了获得更详细的输出）将得到以下结果：


    ```

    $ kldstat -v

    Id Refs Size Name

    1 4 0xc0400000 63070c kernel

    Contains modules:

    Id Name

    18 xpt

    19 probe

    20 cam

    ...

    3 1 0xc1e8b000 2000 hello.ko

    Contains modules:

    Id Name

    367 hello

