    \ the offset to be passed to sc_example.\n\n```\n#include <stdio.h>\n#include\
    \ <sys/syscall.h>\n#include <sys/types.h>\n#include <sys/module.h>\n\nint\nmain(int\
    \ argc, char *argv[]) {\n    int syscall_num;\n    struct module_stat stat;\n\n\
    ```\n\nif (argc != 2) {\n    printf(\"Usage:%s <string>\\n\", argv[0]);\n    exit(0);\n\
    }\n```\n\n/* Determine sc_example's offset value. */\nstat.version = sizeof(stat);\n\
