    # 2.2 Keystroke Logging


    Now let''s look at a more interesting (but still somewhat trivial) example of
    a system call hook.

    Keystroke logging is the simple act of intercepting and capturing a user''s keystrokes.
    In FreeBSD, this can be accomplished by hooking the read system call.\^2 As its
    name implies, this call is responsible for reading in input. Here is its C library
    definition:


    ```

    #include <sys/types.h>

    #include <sys/io.h>

    #include <unistd.h>

    ```


    ```

    size_t

    read(int fd, void *buf, size_t nbytes);

    ```


    The read system call reads nbytes of data from the descriptor fd into the buffer
    buf. Therefore, in order to capture a user''s keystrokes, you simply have to save
    the contents of buf (returning from a read call) whenever fd points to standard
    input (i.e., file descriptor 0). For example, take a look at Listing 2-2:


    ```

    #include <sys/types.h>

    #include <sys/param.h>

    #include <sys/proc.h>

    #include <sys/module.h>

    #include <sys/sysent.h>

    #include <sys/kernel.h>

    #include <sys/system.h>

    #include <sys/syscall.h>

    #include <sys/sysproto.h>

    ```


    ```

    /*

    * read system call hook.

    * Logs all keystrokes from stdin.

    * Note: This hook does not take into account special characters, such as

    * Tab, Backspace, and so on.

    */

    ```


