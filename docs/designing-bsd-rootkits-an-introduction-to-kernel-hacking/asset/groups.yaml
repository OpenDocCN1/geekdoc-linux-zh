    \n## 1.4.8 Syscall Function\n\nThe syscall function executes the system call specified\
    \ by its system number.\n\n```\n#include <sys/syscall.h>\n#include <unistd.h>\n\
    \nint\nsyscall(int number, ...);\n```\n\n## 1.4.9 Executing the System Call\n\n\
    Listing 1-4 is a user space program designed to execute the system call in Listing\
