  - '[PAGE 32]


    # 1.5.1 The copyin and copystr Functions


    The copyin and copystr functions allow you to copy a continuous region of data
    from user space to kernel space.


    ```

    #include <sys/types.h>

    #include <sys/system.h>


    int

    copyin(const void *uaddr, void *kaddr, size_t len);


    int

    copystr(const void *uaddr, void *kaddr, size_t len, size_t *done);

    ```


    The copyin function copies len bytes of data from the user space address uaddr
    to the kernel space address.

    The copystr function is similar, except that it copies a null-terminated string,
    which is at most len bytes long, with the number of bytes actually returned in
    done.⁶


    # 1.5.2 The copyout Function


    The copyout function is similar to copyin, except that it operates in the opposite
    direction, copying data from kernel space to user space.


    ```

    #include <sys/types.h>

    #include <sys/system.h>


    int

    copyout(const void *kaddr, void *uaddr, size_t len);

    ```


    # 1.5.3 The copystr Function


    The copystr function is similar to copyincr, except that it copies a string from
    one kernel space address to another.


    ```

    #include <sys/types.h>

    #include <sys/system.h>


    int

    copystr(const void *kfaddr, void *kdaddr, size_t len, size_t *done);

    ```


    > ⁶ In Listing 1-3, the system call function should, admittedly, first call copyincr
    to copy in the user space string and then print it. As is, it prints a userland
    string directly from kernel space, which can trigger a fatal panic if the page
    holding the string is unmapped (i.e., swapped out or not faulted in yet). That''s
    why it''s just an example and not a real system call.'
  - "[PAGE 33]\n\n# 1.6 Character Device Modules\n\nCharacter device modules are KLDs\
    \ that create or install a character device. In FreeBSD, a character device is\
    \ the interface for accessing a specific device within the kernel. For example,\
    \ data is read from and written to the system console via the character device\
    \ /dev/console.\n\nNOTE In Chapter 4 you'll be writing rootkits that hack the\
    \ existing character devices on the system. Thus, this section serves as a primer.\n\
    \nThere are three items that are unique to each character device module: a cdevsw\
    \ structure, the character device functions, and a device registration routine.\
    \ We will discuss each in turn below.\n\n# 1.6.1 The cdevsw Structure\n\nA character\
    \ device is defined by its entries in a character device switch table, struct\
    \ cdevsw, which is defined in the <sys/conf.h> header as follows:\n\n```\nstruct\
    \ cdevsw {\n    int                 d_version;\n    u_int               d_flags;\n\
    \    const char         *d_name;\n    d_open_t            *d_open;\n    d_fdopen_t\
    \          *d_fdopen;\n    d_close_t           *d_close;\n    d_read_t       \
    \     *d_read;\n    d_write_t           *d_write;\n    ioctl_t             *d_ioctl;\n\
    \    d_poll_t            *d_poll;\n    d_mmap_t            *d_mmap;\n    d_strategy_t\
    \        *d_strategy;\n    dumper_t           *d_dump;\n    d_kqfilter_t     \
    \   *d_kqfilter;\n    d_purge_t          *d_purge;\n    d_spare2_t          *d_spare2;\n\
    \    uid_t               *d_uid;\n    gid_t               *d_gid;\n    mode_t\
    \              *d_mode;\n    const char         *d_kind;\n\n    /* These fields\
    \ should not be messed by drivers */\n    LIST_ENTRY(cdevsw)  d_list;\n    LIST_HEAD(cdevsw)\
    \   d_devs;\n    int                 d_spare3;\n    struct cdevsw       *d_giantrick;\n\
    \n};\n```"
- md: "\nTable 1-1 provides a brief description of the most relevant points.\n\n##\
    \ Table 1-1: Entry Points for Character Device Drivers\n\n| Entry Point | Description\
    \ |\n|---|---|\n| d_open | Opens a device for I/O operations |\n| d_close | Closes\
    \ a device |\n| d_read | Reads data from a device |\n| d_write | Writes data to\
    \ a device |\n| d_ioctl | Performs an operation other than a read or write |\n\
    | d_poll | Polls a device to see if there is data to be read or space available\
    \ for write |\n\nHere is an example cdevsw structure for a simple read/write device\
    \ module:\n\n```\nstatic struct cdevsw cd_example_cdevsw = {\n    .d_version =\
    \ D_VERSION,\n    .d_open = open,\n    .d_close = close,\n    .d_read = read,\n\
    \    .d_write = write,\n    .d_name = \"cd_example\"\n};\n```\n\nNotice that I\
    \ do not define every entry point or fill out every attribute. This is perfectly\
    \ okay. For every entry point left null, the operation is considered unsupported.\
    \ For example, when creating a write-only device, you would not declare the entry\
    \ point.\n\nStill, there are two elements that must be defined in every cdevsw\
    \ structure: d_version, which indicates the versions of FreeBSD that the driver\
    \ supports, and d_name, which specifies the device's name.\n\n> NOTE: The constant\
    \ D_VERSION is defined in the <sys/conf.h> header, along with other version numbers.\n\
    \n## 1.6.2 Character Device Functions\n\nFor every entry point defined in a character\
    \ device module's cdevsw structure, you must implement a corresponding function.\
    \ The function prototype for each entry is defined in the <sys/conf.h> header.\
    \ Below is an example implementation for the write entry point.\n\n```\n/* Function\
    \ prototype. */\nd_write_t write;\n\nint\nwrite(struct cdev *dev, struct uio *uio,\
    \ int iflag)\n{\n    int error = 0;\n\nerror = copystr(uio->uio_iov_base, &buf,\
    \ 512, &len);\nif (error != 0)\n    uprintf(\"Write to \\\"cd_example\\\" failed.\\\
    n\");\n\n    return(error);\n}\n```\n\nAs you can see, this function simply calls\
    \ copystr to copy a string from user space and store it in a buffer, buf, in kernel\
    \ space.\n\nNOTE: In Section 1.6.4 I'll show and explain some more entry-point\
    \ implementations.\n\n## 1.6.3 The Device Registration Routine\n\nThe device registration\
    \ routine creates or installs the character device on /dev and registers it with\
    \ the device file system (DEVFS). You can accomplish this by calling the make_dev\
    \ function within the event handler function as follows:\n\n```\nstatic struct\
    \ cdev *sdev;\n\n/* The function called at load/unload. */\nstatic int\nload(struct\
    \ module *module, int cmd, void *arg)\n{\n    int error = 0;\n\n    switch (cmd)\
    \ {\n    case MOD_DEV:\n        sdev = make_dev(&cd_example_cdevsw, 0, UID_ROOT,\
    \ GID_WHEEL, \"cd example\");\n        uprintf(\"Character device loaded\\n\"\
    );\n        break;\n\n    case MOD_UNLOAD:\n        destroy_dev(sdev);\n     \
    \   uprintf(\"Character device unloaded\\n\");\n        break;\n\n    default:\n\
    \        error = EOPNOTSUPP;\n        break;\n    }\n\n    return(error);\n}\n\
    ```\n\nThis example function will register the character device, cd_example, when\
    \ the module loads by calling the make_dev function, which will create a cd_example\
    \ device node on /dev. Also, this function will unregister the character device\
    \ when the module unloads by calling the destroy_dev function, which takes as\
    \ its argument the cdev structure returned from a preceding make_dev call.\n\n\
    ## 1.6.4 Example\n\nListing 1-5 shows a complete character device module (based\
    \ on Rajesh Vaidheeswaran cdev.c) that installs a simple read/write character\
    \ device. This device acts on an area of kernel memory, reading and writing a\
