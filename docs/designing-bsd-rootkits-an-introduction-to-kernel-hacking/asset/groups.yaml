    \ Some sample output follows:\n\n```\n$ ./interface Hello, kernel!\n$ dmesg |\
    \ tail -n 1\nHello, kernel!\n```\n\n## 1.4.10 Executing the System Call Without\
    \ C Code\n\nWhile writing a user space program to execute a system call is the\
    \ \"proper\" way to do it, when you just want to test a system call module, it's\
    \ annoying to have to write an additional program first. To execute a system call\
