    \ `buf` 中。\n\n注意：在 1.6.4 节中我将展示并解释更多的入口点实现。\n\n## 1.6.3 设备注册例程\n\n设备注册例程在 `/dev`\
    \ 上创建或安装字符设备，并将其注册到设备文件系统 (DEVFS)。你可以通过在事件处理函数中如下调用 `make_dev` 函数来实现：\n\n```\n\
