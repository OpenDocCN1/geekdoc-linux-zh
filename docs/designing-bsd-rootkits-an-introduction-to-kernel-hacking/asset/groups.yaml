    \ is at 00401010. The next instruction is at 00401015. The target is 0040101f.\
    \ The offset is 0040101f - 00401015 = 0a (10). This matches the `0a` in the instruction.\n\
    \nWhat if the call goes backwards?\n\n```assembly\n00401020: e8 f5 00 00 00  \
    \  call 9d0\n00401025: 8b 45 fc 8b 45 f8    mov eax, [ebp-4]\n```\n\nThe `call`\
    \ is at 00401020. The next instruction is at 00401025. The target is 004009d0.\
    \ The offset is 004009d0 - 00401025 = -11. In two's complement, -11 is 0xffff5.\
    \ This matches the `f5` in the instruction.\n\nThe call offset is relative to\
    \ the address of the *next* instruction. This is a common source of confusion\
    \ for beginners.\n\nNow, let's look at a far call. A far call is to a different\
    \ segment.\n\n00401030: ea 00 00 00 00 00    call 0:0000\n\nThe `ea` instruction\
    \ is 6 bytes long. The first 2 bytes are the offset, and the next 4 bytes are\
