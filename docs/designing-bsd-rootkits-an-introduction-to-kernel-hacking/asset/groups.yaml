  mdcn: "\n\n表 1-1 提供了最相关点的简要描述。\n\n## 表 1-1: 字符设备驱动程序的入口点\n\n| 入口点 | 描述 |\n|---|---|\n\
    | d_open | 为 I/O 操作打开设备 |\n| d_close | 关闭设备 |\n| d_read | 从设备读取数据 |\n| d_write\
