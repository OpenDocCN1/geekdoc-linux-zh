    # FOREWORD


    I have been working on various parts of the FreeBSD kernel for the past six years.
    During that time, my focus has always been on making FreeBSD more robust. This
    often means maintaining the existing stability of the system while adding new
    features or improving stability by fixing bugs and/or design flaws in the existing
    code. Prior to working on FreeBSD, I served as a system administrator for a few
    networks; my focus was on providing the desired services to users while protecting
    the network from any malicious actions. Thus, I have always been on the defensive
    "side" of the game when it comes to security.


    Joseph Kong provides an intriguing look at the offensive side in Designing BSD
    Rootkits. He enumerates several of the tools used for constructing rootkits, explaining
    the concepts behind each tool and including working examples for many of the tools,
    as well. In addition, he examines the ways to detect rootkits. Subverting a running
    system requires many of the same skills and techniques as building one. For example,
    both tasks require a focus on stability. A rootkit that reduces the stability
    of the system risks attracting the attention of a system administrator if the
    system crashes. Similarly, a system builder must'
- md: "\nbuild a system that minimizes downtime and data loss that can result from\
    \ system crashes. Rootkits must also confront some rather tricky problems, and\
    \ the resulting solutions can be instructive (and sometimes entertaining) to system\
    \ builders.\n\nFinally, Designing BSD Rootkits can also be an eye-opening experience\
    \ for system builders. One can always learn a lot from another's perspective.\
    \ I cannot count the times I have seen a bug solved by a fresh pair of eyes because\
    \ the developer who had been battling the bug was too familiar with the code.\
    \ Similarly, system designers and builders are not always aware of the ways rootkits\
    \ may be used to alter the behavior of their systems. Simply learning some of\
    \ the methods used by rootkits can change how they design and build their systems.\n\
    \nI have certainly found this book to be both engaging and informative, and I\
    \ trust that you, the reader, will as well.\n\nJohn Baldwin\n\nKernel Developer,\
    \ FreeBSD\nAtlanta\n\n# INTRODUCTION\n\n![](img/bfd792ec0e2d264dd5185dbb1d3a3b80_16_0.png)\n\
    \nWelcome to Designing BSD Rootkits! This book will introduce you to the fundamentals\
    \ of programming and developing kernel-mode rootkits under the FreeBSD operating\
    \ system. Through the “learn by example” method, I’ll detail the different techniques\
    \ that a rootkit can employ so that you can learn what makes up rootkit code at\
    \ its simplest level. It should be noted that this book does not contain or diagnose\
    \ any “full-fledged” rootkit code. In fact, most of this book concentrates on\
    \ how to employ a technique, rather than what to do with it.\n\nNote that this\
    \ book has nothing to do with exploit writing or how to gain root access to a\
    \ system; rather, it is about maintaining root access long after a successful\
    \ break-in.\n\n# What Is a Rootkit?\n\nWhile there are a varied definitions of\
    \ what constitutes a rootkit, for the purpose of this book, a *rootkit* is a set\
    \ of code that allows someone to control certain aspects of the host operating\
    \ system without revealing his or her presence. Fundamentally, that’s what makes\
    \ a rootkit—evasion of end user knowledge.\n\nPut more simply, a rootkit is a\
    \ “kit” that allows a user to maintain “root” access.\n\n# Why FreeBSD?\n\nFreeBSD\
    \ is an advanced, open source operating system; with FreeBSD, you have full, uninhibited\
    \ access to the kernel source, making it easier to learn systems programming—which\
    \ is, essentially, what you’ll be doing through this book.\n\n# The Goals of This\
    \ Book\n\nThe primary goal of this book is to expose you to rootkits and rootkit\
    \ writing. By the time you finish this book, you should “theoretically” be able\
    \ to rewrite the entire operating system, on the fly. You should also understand\
    \ the theory and practicality behind rootkit detection and removal.\n\nThe secondary\
    \ goal of this book is to provide you with a practical, handon look at parts of\
    \ the FreeBSD kernel, with the extended goal of inspiring you to explore and hack\
    \ the rest of it on your own. After all, getting your hands dirty is always the\
    \ best way to learn.\n\n# Who Should Read This Book?\n\nThis book is aimed at\
    \ programmers with an interest in introductory kernel hacking. As such, experience\
    \ writing kernel code is not required or expected.\n\nTo get the most out of this\
    \ book, you should have a good grasp of the C programming language (i.e., you\
    \ understand pointers) as well as x86 Assembly (AT&T Syntax). You’ll also need\
    \ to have a decent understanding of operating system theory (i.e., you know the\
    \ difference between a process and a thread).\n\n# Contents Overview\n\nThis book\
    \ is (unofficially) divided into three sections. The first section (Chapter 1)\
    \ is essentially a whirlwind tour of kernel hacking, designed to bring a novice\
    \ up to speed. The next section (Chapters 2 through 6) covers the gamut of current,\
    \ popular rootkit techniques (i.e., what you would find in the “wild”); while\
    \ the last section (Chapter 7) focuses on rootkit detection and removal.\n\n#\
    \ Conventions Used in This Book\n\nThroughout this book, I have used a boldface\
    \ font in code listings to indicate commands or other text that I have typed in,\
    \ unless otherwise specifically noted.\n\n# Concluding Remarks\n\nAlthough this\
    \ book concentrates on the FreeBSD operating system, most (if not all) of the\
    \ concepts can be applied to other OSes, such as Linux or Windows. In fact, I\
    \ learned half of the techniques in this book on those very systems.\n\n> NOTE\
    \ All of the code examples in this book were tested on an IA-32-based computer\
    \ running FreeBSD 6.0-STABLE.\n\n# # LOADABLE KERNEL MODULES\n\n![](img/bfd792ec0e2d264dd5185dbb1d3a3b80_20_0.png)\n\
    \nThe simplest way to introduce code into a running kernel is through a loadable\
    \ kernel module (LKM), which is a kernel subsystem that can be loaded and unloaded\
    \ after bootup, allowing a system administrator to dynamically add and remove\
    \ functionality from a live system. This makes LKMs an ideal platform for kernel-mode\
    \ rootkits. In fact, the vast majority of modern rootkits are simply LKMs.\n\n\
    NOTE In FreeBSD 3.0, substantial changes were made to the kernel module subsystem,\
    \ and the LKM Facility was renamed the Dynamic Kernel Linker (KLD) Facility. Subsequently,\
    \ the term KLD is commonly used to describe LKMs under FreeBSD.\n\nIn this chapter\
    \ we'll discuss LKM (that is, KLD) programming within FreeBSD for programmers\
    \ new to kernel hacking.\n\nNOTE Throughout this book, the terms device driver,\
    \ KLD, LKM, loadable module, and module are all used interchangeably.\n\n## 1.1\
    \ Module Event Handler\n\nWhenever a KLD is loaded into or unloaded from the kernel,\
    \ a function known as the module event handler is called. This function handles\
    \ the initialization and shutdown routines for the KLD. Every KLD must include\
    \ an event handler.¹ The prototype for the event handler function is defined in\
    \ the <sys/module.h> header as follows:\n\n```\ntypedef int (*modeventype_t)(module_t,\
    \ int *modeventype_t /*, void *);\n```\n\nwhere module_t is a pointer to a module\
    \ structure and modeventype_t is defined in the <sys/module.h> header as follows:\n\
    \n```\ntypedef enum modeventype {\n    MOD_LOAD,         /* Set when module is\
    \ loaded. */\n    MOD_UNLOAD,       /* Set when module is unloaded. */\n    MOD_SHUTDOWN,\
    \     /* Set on shutdown. */\n    MOD_QUIESCE,      /* Set on quiescence. */\n\
    } modeventype_t;\n```\n\nHere is an example of an event handler function:\n\n\
    ```\nstatic int\nload(struct module *module, int cmd, void *arg)\n{\n    int error\
    \ = 0;\n\n    switch (cmd) {\n        case MOD_LOAD:\n            printf(\"Hello,\
    \ world!\\n\");\n            break;\n        case MOD_UNLOAD:\n            printf(\"\
    Good-bye, cruel world!\\n\");\n            break;\n        default:\n        \
    \    error = EOPNOTSUPP;\n            break;\n    }\n\n    return(error);\n}\n\
    ```\n\n> ¹ Actually, this isn't entirely true. You can have a KLD that just includes\
    \ a sysctl. You can also dispense with module handlers if you wish and just use\
    \ SYSINT and SYSUNINIT directly to register functions to be invoked on load and\
    \ unload, respectively. You can't, however, indicate failure in those.\n\nChapter\
    \ 1\n\nThis function will print \"Hello, world!\" when the module loads, Good-bye,\
    \ cruel world! when it unloads, and will return with an error (EOPNOTTSUPP)² on\
    \ shutdown and quiescence.\n\n## 1.2 The DECLARE_MODULE Macro\n\nWhen the KLD\
    \ is loaded (by the kload(8) command, described in Section 1.3), it must link\
    \ and register itself with the kernel. This can be easily accomplished by calling\
    \ the DECLARE_MODULE macro, which is defined in the <sys/module.h> header as follows:\n\
    \n```\n#define DECLARE_MODULE(name, data, sub, order) \\\\\n    MODULE_METADATA(md,\
    \ MDT_MODULE, &data, #name); \\\\\n    SYSINIT(name##sub, sub, order, module_register_init,\
    \ &data) \\\\\n    struct _hack\n```\n\nHere is a brief description of each:\n\
    \nname\n\nThis specifies the generic module name, which is passed as a character\
    \ string.\n\ndata\n\nThis parameter specifies the official module name and event\
    \ handler function, which is passed as a moduleledata structure. struct modulated\
    \ is defined in the <sys/module.h> header as follows:\n\n```\nyped struct modulated\
    \ {\n    const char *name;          /* module name */\n    meventhandler_t evanhand;\
    \  /* event handler */\n    void *priv;                 /* extra data */\n} modulatedata_t;\n\
    ```\n\nsub\n\nThis specifies the system startup interface, which identifies the\
    \ module type. Valid entries for this parameter can be found in the <sys/kernel.h>\
    \ header within the sysinit_sub enumeration list.\n\nFor our purposes, we'll always\
    \ set this parameter to SI_SUB_DRIVERS, which is used when registering a device\
    \ driver.\n\norder\n\nThis specifies the KLD's order of initialization within\
    \ the subsystem. You'll find valid entries for this parameter in the <sys/kernel.h>\
    \ header within the sysinit_elem_order enumeration list.\n\nFor our purposes,\
    \ we'll always set this parameter to SI_ORDER_MIDDLE, which will initialize the\
    \ KLD somewhere in the module.\n\n> ² EOPNOTTSUPP stands for Error: Operation\
    \ not supported.\n"
  mdcn: "\n构建一个能够最小化因系统崩溃导致的停机和数据丢失的系统。根内核（Rootkits）还面临一些相当棘手的问题，其产生的解决方案对系统构建者来说具有启发性（有时也很有趣）。\n\
    \n最后，设计 BSD 根内核对于系统构建者来说也是一次大开眼的经历。人们总可以从他人的视角中学到很多东西。我曾数次看到一个全新的视角解决了一个 Bug，因为一直与\
    \ Bug 斗争的开发者对代码太熟悉了。同样，系统设计者和构建者并不总是意识到根内核可能被用来改变系统的行为。只需学习根内核使用的一些方法，就能改变他们设计和构建系统的方式。\n\
    \n我确实发现这本书既引人入胜又内容丰富，我相信你作为读者也会有同感。\n\nJohn Baldwin\n\nFreeBSD 内核开发者\n亚特兰大\n\n\
    # 引言\n\n![](img/bfd792ec0e2d264dd5185dbb1d3a3b80_16_0.png)\n\n欢迎阅读《设计 BSD 根内核》！本书将为你介绍在\
    \ FreeBSD操作系统下编程和开发内核态根内核的基础知识。通过“示例学习”法，我将详细介绍根内核可以采用的不同技术，以便你学习根内核代码在最简单层次是如何构成的。需要注意的是，本书并不包含或诊断任何“全功能”的根内核代码。事实上，本书的大部分内容集中于如何使用某种技术，而不是对其做什么。\n\
    \n请注意，本书与编写漏洞（exploit writing）或如何获取系统的 root 权限无关；它关乎在成功侵入后如何长期保持 root 权限。\n\n\
    # 什么是根内核（Rootkit）？\n\n虽然对根内核的定义有很多种，但对于本书而言，*根内核*是一组允许人在不泄露自己存在的情况下控制主操作系统的某些方面的代码。从根本上说，这就是根内核的本质——规避终端用户的感知。\n\
    \n简单来说，根内核是一个允许用户维持“root”权限的“工具箱”（kit）。\n\n# 为什么选择 FreeBSD？\n\nFreeBSD 是一个先进的开源操作系统；通过\
    \ FreeBSD，你对内核源码拥有完全、不受限制的访问权限，这使得学习系统编程变得更容易——而这本质正是你通过这本书要做的事情。\n\n# 本书的目标\n\
    \n本书的首要目标是让你接触根内核及其编写方法。当你读完这本书时，你应该在“理论上”能够即时重写整个操作系统。你还应该理解根内核检测和移除背后的理论与实践。\n\
    \n本书的次要目标是为你提供对 FreeBSD 内核部分的实用、动手的观察，远期目标是激发你去探索并黑客攻击其余部分。毕竟，亲自动手总是学习的最好方式。\n\
    \n# 谁应该读这本书？\n\n本书面向对入门内核黑客攻击感兴趣的程序员。因此，不要求也不预期你有编写内核代码的经验。\n\n为了从书中获得最大的收益，你应该熟练掌握\
    \ C 语言（即你理解指针）以及 x86 汇编（AT&T 语法）。你还需要对操作系统理论有良好的理解（即你知道进程和线程的区别）。\n\n# 目录概述\n\n\
    本书（非正式）分为三个部分。第一部分（第 1 章）本质上是一场内核黑客攻击的极速之旅，旨在让新手进入状态。下一部分（第 2 章到第 6 章）涵盖了当前流行的根内核技术范围（即你在“野外”会发现的技术）；而最后一部分（第\
    \ 7 章）侧重于根内核的检测和移除。\n\n# 本书使用的规范\n\n在全书中，除非另有特别说明，我在代码列表中使用了粗体字体来表示我输入的命令或其他文本。\n\
    \n# 结语\n\n尽管本书聚焦于 FreeBSD 操作系统，但大部分（如果不是全部）概念都可以应用于其他操作系统，例如 Linux 或 Windows。事实上，我在书中学习一半的技术正是在这些系统上学到的。\n\
    \n> 注意：书中的所有代码示例都是在运行 FreeBSD 6.0-STABLE 的 IA-32 架构计算机上测试过的。\n\n# # 可加载内核模块\n\n\
    ![](img/bfd792ec0e2d264dd5185dbb1d3a3b80_20_0.png)\n\n将代码引入运行中内核的最简单方法是通过可加载内核模块（LKM），它是一种可以在启动后加载和卸载的内核子系统，允许系统管理员从运行中的系统中动态添加和删除功能。这使得\
    \ LKM 成为内核态根内核的理想平台。事实上，绝大多数现代根内核仅仅是 LKM。\n\n注意：在 FreeBSD 3.0 中，内核模块子系统发生了重大变化，LKM\
    \ 设施被重命名为动态内核链接器（KLD）设施。随后，术语 KLD 常用于描述 FreeBSD 下的 LKM。\n\n在本章中，我们将为新内核黑客的程序员讨论\
    \ FreeBSD 内的 LKM（即 KLD）编程。\n\n注意：在全书中，device driver、KLD、LKM、loadable module 和\
    \ module 等术语均通用。\n\n## 1.1 模块事件处理器\n\n每当 KLD 加载或卸载到内核时，都会调用一个名为模块事件处理器（module\
    \ event handler）的函数。该函数处理 KLD 的初始化和关机程序。每个 KLD 必须包含一个事件处理器¹。事件处理函数的原型定义在 <sys/module.h>\
    \ 头文件中如下：\n\n```\ntypedef int (*modeventype_t)(module_t, int *modeventype_t /*,\
    \ void *);\n```\n\n其中 module_t 是指向模块结构的指针，modeventype_t 在 <sys/module.h> 头文件中定义如下：\n\
    \n```\ntypedef enum modeventype {\n    MOD_LOAD,         /* 模块加载时设置。 */\n    MOD_UNLOAD,\
    \       /* 模块卸载时设置。 */\n    MOD_SHUTDOWN,     /* 关机时设置。 */\n    MOD_QUIESCE, \
    \     /* 在静默时设置。 */\n} modeventype_t;\n```\n\n这里是一个事件处理器函数的示例：\n\n```\nstatic\
    \ int\nload(struct module *module, int cmd, void *arg)\n{\n    int error = 0;\n\
    \n    switch (cmd) {\n        case MOD_LOAD:\n            printf(\"Hello, world!\\\
    n\");\n            break;\n        case MOD_UNLOAD:\n            printf(\"Good-bye,\
    \ cruel world!\\n\");\n            break;\n        default:\n            error\
    \ = EOPNOTSUPP;\n            break;\n    }\n\n    return(error);\n}\n```\n\n>\
    \ ¹ 实际上，这并不完全正确。你可以拥有一个只包含 sysctl 的 KLD。如果你愿意，也可以省去模块处理器，直接使用 SYSINT 和 SYSUNINIT\
    \ 来注册分别在加载和卸载时调用的函数。然而，你无法在这些情况下指示失败。\n\n第 1 章\n\n该函数在模块加载时打印 \"Hello, world!\"\
    ，在卸载时打印 \"Good-bye, cruel world!\"，并在关机和静默时返回错误（EOPNOTSUPP)²。\n\n## 1.2 DECLARE_MODULE\
    \ 宏\n\n当 KLD 被加载时（通过第 1.3 节介绍的 kload(8) 命令），它必须与内核链接并注册自己。这可以通过调用 DECLARE_MODULE\
    \ 宏轻松实现，它在 <sys/module.h> 头文件中定义如下：\n\n```\n#define DECLARE_MODULE(name, data,\
    \ sub, order) \\\\\n    MODULE_METADATA(md, MDT_MODULE, &data, #name); \\\\\n\
    \    SYSINIT(name##sub, sub, order, module_register_init, &data) \\\\\n    struct\
    \ _hack\n```\n\n是各部分的简要描述：\n\nname 指定通用模块名称，以字符串形式传递。\n\ndata 参数指定官方模块名称和事件处理器函数，以模块数据结构传递。struct\
    \ modulated 在 <sys/module.h> 头文件中定义如下：\n\n```\nyped struct modulated {\n    const\
    \ char *name;          /* 模块名称 */\n    meventhandler_t evanhand;  /* 事件处理器 */\n\
    \    void *priv;                 /* 额外数据 */\n} modulatedata_t;\n```\n\nsub 指定系统启动接口，标识模块类型。该参数的有效项可以在\
    \ <sys/kernel.h> 头文件的 sysinit_sub 枚举列表中找到。\n\n对于我们的目的，我们总是将此参数设置为 SI_SUB_DRIVERS，这在注册设备驱动程序时使用。\n\
    \norder 指定 KLD 在子系统中的初始化顺序。你可以在 <sys/kernel.h> 头文件的 sysinit_elem_order 枚举列表中找到该参数的有效项。\n\
    \n对于我们的目的，我们总是将此参数设置为 SI_ORDER_MIDDLE，将在模块的中间位置初始化 KLD。\n\n> ² EOPNOTSUPP 代表错误：不支持的操作。\n\
    \n"
