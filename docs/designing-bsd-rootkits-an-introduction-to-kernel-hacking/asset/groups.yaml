    # 5.5 Allocating Kernel Memory from User Space


    Now that you''ve seen how to "properly" allocate kernel memory using module code,
    let''s do it using run-time kernel memory patching. Here is the algorithm (Cesar,
    1998, cited in sd and devik, 2001) we''ll be using:


    +   1. Retrieve the in-memory address of the mkdir system call.

    2. Save sizeof(kmalloc) bytes of mkdir.

    3. Overwrite mkdir with kmalloc.

    4. Call mkdir.

    5. Restore mkdir.


    With this algorithm, you are basically patching a system call with your own code,
    issuing the system call which will execute your code instead, then restoring the
    system call. This algorithm can be used to execute any piece of code in kernel
    space without a KLD.


    However, keep in mind that when you overwrite a system call, any process that
    issues or is currently executing the system call will break, resulting in a kernel
    panic. In other words, inherent to this algorithm is a race condition or concurrency
    issue.


