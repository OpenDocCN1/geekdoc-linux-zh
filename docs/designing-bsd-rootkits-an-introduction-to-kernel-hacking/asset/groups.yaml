    \ ICMP 数据包，可以考虑挂钩不同的 `*_input` 函数，例如 `tcp_input`。\n\n## 7 检测\n\n![](img/bfd792ec0e2d264dd5185dbb1d3a3b80_138_0.png)\n\
    \n我们现在进入充满挑战的 rootkit 检测世界。通常情况下，你可以通过两种方式之一检测 rootkit：通过特征码，或者通过行为。*通过特征码检测*涉及扫描操作系统以寻找特定的\
