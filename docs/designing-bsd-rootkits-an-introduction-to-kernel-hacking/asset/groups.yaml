    \n```\n/* Call sc_example. */\nreturn(syscall(syscall_num, argv[1]));\n}\n```\n\
    \n- Listing 1-4: interface.c\n\nAs you can see, we call ① modfind and modstat\
    \ to determine sc_example's offset value. This value is passed to ② syscall, along\
