    # 4.1.1 The cdev_list Tail Queue and cdev_priv Structures


    In FreeBSD all active character devices are maintained in a private, doubly-linked
    tail queue named cdev_list, which is defined in the file /sys/fs/devfs/devfs.c
    as follows:


    ```

    static HEAD(, cdev_priv) cdev_list =

    TAILQ_HEAD_INITIALIZER(cdev_list);

    ```


    As you can see, cdev_list is composed of cdev_priv structures. The definition
    for struct cdev_priv can be found in the <fs/devfs/devfs.h> header. Here are the
    fields in struct cdev_priv that you’ll need to understand in order to handle a
    character device:


    +   - TAILQ_ENTRY(cdev_priv) list; This field contains the linkage pointers that
    are associated with the cdev_priv structure, which is stored on cdev_list. This
    field is referenced during insertion, removal, and traversal of cdev_list.

    - struct cdev cdev_c; This structure maintains the context of the character device.
    The definition for struct cdev can be found in the <sys/conf.h> header. The fields
    in struct cdev relevant to our discussion are as follows:

    - char *si_name; This field contains the name of the character device.

    - struct cdevsw *si_devdevw; This field points to the character device’s switch
    table.


    # 4.1.2 The devmtx Mutex


    The following excerpt from <fs/devfs/devfs_int.h> lists the resource control associated
    with cdev_list.


    extern struct mtx devmtx;


