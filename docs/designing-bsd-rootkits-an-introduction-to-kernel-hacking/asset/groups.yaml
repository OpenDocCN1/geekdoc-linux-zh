    ## 结语


    *rootkit* 这个词往往带有负面含义，但 rootkit 仅仅是系统程序。书中概述的技术可以被——也已经被——用于“善意”和“恶意”的目的。无论如何，我希望这本书能激发你进行一些自己的内核黑客活动，无论你是在编写
    rootkit、编写设备驱动程序，还是仅仅在解析内核源码。


    在结束之前，有三点值得提到。首先，除非你是为了教育目的而编写 rootkit，否则你应该尽量保持其简单性；标新求异只会引入错误。其次，像编写任何内核代码一样，要留意并发问题（包括处理器和
    SMP）、竞态条件以及你如何在内核空间和用户空间之间切换；否则，请做好内核恐慌（kernel panic）的准备。最后，记住，你的 rootkit 只需要找到少数可靠且未受保护的位置即可成功，而反
    rootkit 群体在某种程度上需要进行防御，因为整个内核是一个巨大的空间。祝黑客愉快！


