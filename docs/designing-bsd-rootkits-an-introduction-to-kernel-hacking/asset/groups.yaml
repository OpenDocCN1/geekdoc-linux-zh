    \     read;\nd_write_t    write;\n```\n\n```\nstatic struct cdevsw cdevsw example_cdevsw\
    \ = {\n    .d_version = D_VERSION,\n    .d_open = open,\n    .d_close = close,\n\
    \    .d_read = read,\n    .d_write = write,\n    .d_name = \"cd_example\"\n};\n\
    ```\n\n```\nstatic char buf[512+1];\nstatic size_t len;\n```\n\n```\nint\nopen(struct\
    \ cdev *dev, int flag, int otyp, struct thread *td)\n{\n    /* Initialize character\
    \ buffer. */\n    memset(&buf, '\\0', 513);\n    len = 0;\n\n    return(0);\n\
    }\n```\n\n```\nint\nclose(struct cdev *dev, int flag, int otyp, struct thread\
    \ *td)\n{\n    return(0);\n}\n```\n\n```\nint\nwrite(struct cdev *dev, struct\
    \ uio *uio, int iflag)\n{\n    int error = 0;\n\n/*\n * Take a character string,\
    \ saving it in buf.\n * Note: The proper way to transfer data between buffers\
    \ and I/O\n * vectors that cross the user/kernel space boundary is with\n * uiomove(),\
    \ but this way is shorter. On more device I/O\n * routines, see the uio(9) manual\
    \ page.\n */\nerror = copystr(uio->uio_iov->uio_base, &buf, 512, &len);\nif (error\
    \ != 0) {\n    uprintf(\"Write to \\\"cd_example\\\" failed.\\n\");\n}\n\n   \
    \ return(error);\n}\n\nint\nread(struct cdev *dev, struct uio *uio, int ioflag)\
    \ {\n    int error = 0;\n    if (len <= 0)\n        error = -1;\n    } else {\n\
    \        /* Return the saved character string to userland. */\n        copystr(&buf,\
    \ uio->uio_iov->uio_base, 513, &len);\n    }\n    return(error);\n}\n\n/* Reference\
    \ to the device in DEVFS. */\nstatic struct cdev *sdev;\n\n/* The function called\
    \ at load/unload. */\nstatic int\nload(struct module *module, int cmd, void *arg)\
    \ {\n    int error = 0;\n    switch (cmd) {\n    case MOD_LOAD:\n        sdev\
    \ = make_dev(&cd_example_cdevsw, O, UID_ROOT, GID_WHEEL, 0600, \"cd_example\"\
    );\n        uprintf(\"Character device loaded.\\n\");\n        break;\n    case\
    \ MOD_UNLOAD:\n        destroy_dev(sdev);\n        uprintf(\"Character device\
    \ unloaded.\\n\");\n        break;\n    default:\n        error = EOPNOTSUPP;\n\
    \        break;\n    }\n    return(error);\n}\nDEV_MODULE(cd_example, load, NULL);\n\
    ```\n\nListing 1-5: cd_example.c\n\nThe following is a breakdown of the above.\
    \ First, at the beginning, we declare the cdevsw structure. Next, we fill out\
    \ the entry points: open, close, read, and write. Then, we implement each entry\
