  mdcn: "\n\n为了安全地操作内核队列数据结构——也就是说，为了确保线程同步——你的代码应该获取适当锁（即资源访问控制）。在我们的示例中，这将是一个互斥锁（mutex）或共享/斥锁（shared/exclusive\
    \ lock）。\n\n### 3.2.1 mtx_lock 函数\n\n互斥锁为一个或多个数据对象提供互斥，是线程同步的主要方法。\n内核线程通过调用 `mtx_lock`\
