    \nThe preceding demonstration shows, by taking advantage of Perl's command-line\
    \ execution (i.e., the -e option), its syscall function, and the fact that you\
    \ know your system call's offset value, you can quickly test any system call module.\
    \ One thing to keep in mind is that you cannot use string literals with Perl's\
    \ syscall function, which is why I use a variable ($str) to pass the string to\
    \ sc_example.\n\n## Kernel/User Space Transitions\n\nI'll describe a set of core\
    \ functions that you can use from kernel space to copy, manipulate, and overwrite\
    \ the data stored in user space. We'll put these functions to use much throughout\
    \ this book.\n\n## 1.5.1 The copyin and copystr Functions\n\nThe copyin and copystr\
    \ functions allow you to copy a continuous region of data from user space to kernel\
    \ space.\n\n```\n#include <sys/types.h>\n#include <sys/system.h>\n\nint\ncopyin(const\
    \ void *uaddr, void *kaddr, size_t len);\n\nint\ncopystr(const void *uaddr, void\
    \ *kaddr, size_t len, size_t *done);\n```\n\nThe copyin function copies len bytes\
    \ of data from the user space address uaddr to the kernel space address.\nThe\
    \ copystr function is similar, except that it copies a null-terminated string,\
    \ which is at most len bytes long, with the number of bytes actually returned\
    \ in done.⁶\n\n## 1.5.2 The copyout Function\n\nThe copyout function is similar,\
    \ except that it copies a null-terminated string, which is at most len bytes long,\
    \ with the number of bytes actually returned in done.\n\n```\n#include <sys/types.h>\n\
    #include <sys/system.h>\n\nint\ncopyout(const void *kaddr, void *uaddr, size_t\
    \ len);\n```\n\n## 1.5.3 The copystr Function\n\nThe copystr function is similar\
    \ to copyincr, except that it copies from kernel space to another.\n\n```\n#include\
    \ <sys/types.h>\n#include <sys/system.h>\n\nint\ncopystr(const void *kfaddr, void\
    \ *kdaddr, size_t len, size_t *done);\n```\n\n> ⁶ In Listing 1-3, the system call\
    \ function should, admittedly, first call copyin to copy the string then print\
    \ it. As is, it's just an example and not a real system call.\n\n## 1.6 Character\
    \ Device Modules\n\nCharacter device modules are KLDs that create or install a\
    \ character device. In FreeBSD, a character device is the interface for accessing\
    \ a specific device. For example, data is read from and written to the system\
    \ console via /dev/console.\n\nNOTE In Chapter 4 you'll be writing rootkits that\
    \ hack the existing character devices on the system. Thus, this section serves\
    \ as a primer.\n\nThere are three items that are unique to each character device:\
    \ a cdevsw structure, the character device functions, and a registration routine.\
    \ We will discuss each in turn.\n\n### 1.6.1 The cdevsw Structure\n\nA character\
    \ device is defined by its entries in a character device switch table, struct\
    \ cdevsw, which is defined in the <sys/conf.h> header as follows:\n\n```\nstruct\
    \ cdevsw {\n    int                 d_version;\n    u_int               d_flags;\n\
    \    const char         *d_name;\n    d_open_t            *d_open;\n    d_fdopen_t\
    \          *d_fdopen;\n    d_close_t           *d_close;\n    d_read_t       \
    \     *d_read;\n    d_write_t           *d_write;\n    ioctl_t             *d_ioctl;\n\
    \    d_poll_t            *d_poll;\n    d_mmap_t            *d_mmap;\n    d_strategy_t\
    \        *d_strategy;\n    dumper_t           *d_dump;\n    d_kqfilter_t     \
    \   *d_kqfilter;\n    d_purge_t          *d_purge;\n    d_spare2_t          *d_spare2;\n\
    \    uid_t               *d_uid;\n    gid_t               *d_gid;\n    mode_t\
    \              *d_mode;\n    const char         *d_kind;\n\n    /* These fields\
    \ should not be messed by drivers */\n    LIST_ENTRY(cdevsw)  d_list;\n    LIST_HEAD(cdevsw)\
    \   d_devs;\n    int                 d_spare3;\n    struct cdevsw       *d_giantrick;\n\
    \n};\n```\n"
  mdcn: "\nnew_sysent\n这指定完成的 sysent 结构，它将作为 sysent 结构体指针传递。\n\nevh\n这指定事件处理函数。\n\n\
