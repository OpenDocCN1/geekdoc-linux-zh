    \nvoid\nmtx_lock(struct mtx *mutex);\n```\n\n如果另一个线程当前持有该互斥锁，调用者将睡眠，直到该互斥锁可用。\n\
    \n### 3.2.2 mtx_unlock 函数\n\n通过调用 `mtx_unlock` 函数释放互斥锁。\n\n```c\n#include <sys/param.h>\n\
