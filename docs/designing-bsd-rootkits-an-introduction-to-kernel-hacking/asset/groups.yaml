    \ ensure thread synchronization—your code should acquire the appropriate lock\
    \ (i.e., resource access control). In our examples, this will either be a mutex\
    \ or shared/exclusive lock.\n\n### 3.2.1 The mtx_lock Function\n\nMutexes provide\
    \ mutual exclusion for one or more data objects and are the primary method of\
    \ thread synchronization.\nA kernel thread acquires a mutex by calling the mtx_lock\
    \ function.\n\n```c\n#include <sys/param.h>\n#include <sys/lock.h>\n#include <sys/mutex.h>\n\
    \nvoid\nmtx_lock(struct mtx *mutex);\n```\n\nIf another thread is currently holding\
    \ the mutex, the caller will sleep until the mutex is available.\n\n### 3.2.2\
    \ The mtx_unlock Function\n\nA mutex lock is released by calling the mtx_unlock\
    \ function.\n\n```c\n#include <sys/param.h>\n#include <sys/lock.h>\n#include <sys/mutex.h>\n\
    \nvoid\nmtx_unlock(struct mtx *mutex);\n```\n\n> If a higher priority thread is\
    \ waiting for the mutex, the releasing thread may be preempted to allow the higher\
    \ priority thread to acquire the mutex and run.\n\n- NOTE: For more on mutexes,\
    \ see the mutex(9) manual page.\n\n### 3.2.3 The sx_lock and sx_xlock Functions\n\
    \nExclusive locks (also known as sx locks) are simpler reader/writer locks that\
    \ can be held across a sleep. As their name suggests, multiple threads may hold\
    \ a shared lock, but only one thread may hold an exclusive lock. Furthermore,\
    \ if one thread holds an exclusive lock, no other threads may hold a shared lock.\n\
    \nA thread acquires a shared or exclusive lock by calling the sx_lock or sx_xlock\
