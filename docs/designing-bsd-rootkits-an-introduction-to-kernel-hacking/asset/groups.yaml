    ## There’s more to keeping FreeBSD free than meets the eye.


    They work hard behind the scenes and you hardly ever see them. They’re The FreeBSD
    Foundation and they quietly fund and manage projects, sponsor FreeBSD events,
    Developer Summits and provide travel grants to FreeBSD developers. The FreeBSD
    Foundation represents the Project in executing contracts, license agreements,
    copyrights, trademarks and other legal arrangements that require a recognized
    legal entity. The Foundation’s funding and management expertise is essential to
    keep FreeBSD free. And keeping it free is getting more costly every year.


    That’s why they need your help. The work of The FreeBSD Foundation is entirely
    supported by your generous donations.


    To make a donation visit our web site at:

    www.freebsdffoundation.org


    Please, help us today. Help keep FreeBSD free.


