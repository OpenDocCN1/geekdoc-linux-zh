    # 2.5.3 The mbuf Structure


    Data (and control information) that is passed between two communicating processes
    is stored within an mbuf structure, which is defined in the <sys/mbuf.h> header.
    To be able to read and modify this data, there are two fields in struct mbuf that
    you''ll need to know: m_len, which identifies the amount of data contained within
    the mbuf, and m_data, which points to the data.


    # 2.6 Hooking a Communication Protocol


    +   Listing 2-3 is an example communication protocol hook designed to output a
    debug message whenever an Internet Control Message Protocol (ICMP) redirect for
    Type of Service and Host message containing the phrase Shiny is received.


    > NOTE An ICMP redirect for Type of Service and Host message contains a type field
    of 5 and a code field of 3.


    ```

    #include <sys/param.h>

    #include <sys/proc.h>

    #include <sys/module.h>

    #include <sys/kernel.h>

    #include <sys/system.h>

    #include <sys/mbuf.h>

    #include <sys/protosw.h>


    #include <netinet/in.h>

    #include <netinet/in_system.h>

    #include <netinet/ip.h>

    #include <netinet/ip_icmp.h>

    #include <netinet/ip_var.h>

    ```'
