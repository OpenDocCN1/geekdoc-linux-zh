    ### 7.2.1 寻找隐藏进程


    回顾第 3 章，为了用 DKOM 隐藏运行中的进程，你需要补丁 `allproc` 列表、`pidhashtbl`、父进程的子列表、父进程的进程组列表以及
    `nproc` 列表。如果任何一个对象未被补丁，就可以作为石金测试来判断一个进程是否被隐藏。


    然而，如果所有这些对象都被补丁了，你仍然可以通过在每次上下文切换之前（或之后）检查 `curthead` 来找到隐藏的进程，因为每个运行的进程在执行时都会将其上下文存储在
