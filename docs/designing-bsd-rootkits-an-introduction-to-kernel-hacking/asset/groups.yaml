- md: "\n## 1.3 \"Hello, world!\"\n\nYou now know enough to write your first KLD.\
    \ Listing 1-1 is a complete \"Hello, world!\" module.\n\n```c\n#include <sys/param.h>\n\
    #include <sys/module.h>\n#include <sys/kernel.h>\n#include <sys/system.h>\n\n\
    /* The function called at load/unload. */\nstatic int\nload(struct module *module,\
    \ int cmd, void *arg)\n{\n    int error = 0;\n    switch (cmd) {\n        case\
    \ MOD_LOAD:\n            printf(\"Hello, world!\\n\");\n            break;\n \
    \       case MOD_UNLOAD:\n            printf(\"Good-bye, cruel world!\\n\");\n\
    \            break;\n        default:\n            error = EOPNOTSUPP;\n     \
    \       break;\n    }\n    return(error);\n}\n/* The second argument of DECLARE_MODULE.\
    \ */\nstatic moduledata_t hello_mod = {\n    \"hello\",\n    load,\n    /* module\
    \ name */\n    /* event handler */\n    NULL /* extra data */\n};\nDECLARE_MODULE(hello,\
    \ hello_mod, SI_SUB_DRIVERS, SI_ORDER_MIDDLE);\n```\n\nListing 1-1: hello.c\n\n\
    As you can see, this module is simply a combination of the sample event handler\
    \ function from Section 1.1 and a filled-out DECLARE_MODULE macro. To compile\
    \ this module, you can use the system Makefile b.kmod.mk. Listing 1-2 shows the\
    \ complete Makefile for hello.c.\n\n> ⁵ A Makefile is used to simplify the process\
    \ of converting a file or files from one form to another by the make by describing\
    \ the dependencies and build scripts for a given output. For more on Makefiles,\
    \ see the make(1) manual page.\n\n```make\nKMOD= hello # Name of KLD to build.\n\
    SRCS= hello.c # List of source files.\n```\n\n```make\n.include bsd.kmod.mk\n\
    Listing 1-2: Makefile\n```\n\nNOTE Throughout this book, we'll adapt the Makefile\
    \ to compile every KLD by filling out KMOD and SRCS with the appropriate module\
    \ name and source listing(s), respectively.\n\nNow, assuring the Makefile and\
    \ hello.c are in the same directory, simply make type and (if we haven't botched\
    \ anything) the compilation should proceed—verbely—and produce an executable file\
    \ named hello.ko, as shown here:\n\n```bash\n$ make\nWarning: Object directory\
    \ not changed from original /usr/home/ghost/hello\n- -> /usr/src/sys\nmachine\
    \ -> /usr/src/sys/i386\ncc -02 -pipe -fullroll-loops -march-athlon-mp -fno-strict-aliasing\
    \ -Werror -D_KERNEL KLD_MODULE -nostdic -I- -I @ -I/../include/altq-I/../include\
    \ -I/usr/src-finline-limit-8000 -fno-common -mno-align-strings -mprefacked-stack-boundary=2\
    \ -mno-mmx -mno-3dwn -mno-sse -mno-sse2 -freestanding-Wall -Wundant-decls -Wnested-exts\
    \ -Wstrict-prototypes -Wmissing-prototypes -Wpointer-arithith -Winline -Wcast\
    \ -Wformat-extensions -D_=c99 -C\\hello.ldld -d -warn-common -r -d -o hello.ko\
    \ hello.ld\ntouch export_symbols\nawk -f /sys/config/kmod_sys.awk hello.kld export_symbols\
    \ | xargs -J objcopy hel.kld\nld -shared -d -warn-common -o hello.ko hello.kld\n\
    objcopy --strip-debug hello.ko\n$ ls -F\n@@ export_symbols hello.kld hello.o\n\
    Makefile hello.c hello.ko* machine@\n```\n\nYou can load and unload hello.kld\
    \ with the kldload(8) and kndown(8) utilities as shown below:\n\n```bash\n$ sudo\
    \ kldload ./hello.ko\nHello, world!\n$ sudo kldload hello.ko\nGood-bye, cruel\
    \ world!\n```\n\nExcellent—you have successfully loaded and unloaded code into\
    \ a running kernel, let's try a little more advanced.\n\n4 With a Makefile that\
    \ includes bsd.kmod.mk, you can also make load and unload to load and unload the\
    \ module you have built it.\n\n## 1.4 System call Modules\n\nSystem call modules\
    \ are simply KLDs that install a system call. In operating systems, a system call,\
    \ also known as system service request, is the mechanism an application uses to\
    \ request service from the operating system's kernel.\n\n**NOTE** In Chapters\
    \ 2, 3, and 6, you will be writing rootkits that either hide the existing system\
    \ calls or install new ones. Thus, this section serves as a primer.\n\nThere are\
    \ three items that are unique to each system call module: the system call function,\
    \ the sysent structure, and the offset value.\n\n### 1.4.1 The System Call Function\n\
    \nThe system call function implements the system call. Its function prototype\
    \ is defined in the `<sys/sysent.h>` header as:\n\n```c\ntypedef int sy_call_t(struct\
    \ thread *, void *);\n```\n\nwhere thread * points to the currently running thread,\
    \ and void * points to the system call's arguments structure, if there is any.\n\
    \nHere is an example system call that takes in a character pointer (i.e., a string)\
    \ and outputs it to the system console and logging facility via printf(9).\n\n\
    ```c\nstruct sc_example_args {\n    char *str;\n};\n\nstatic int\nsc_example_args(struct\
    \ thread *td, void *syscall_args) {\n    struct sc_example_args *uap;\n    uap\
    \ = (struct sc_example_args *)syscall_args;\n    printf(\"%s\\n\", uap->str);\n\
    \    return(0);\n}\n```\n\nNotice that the system call's arguments are ① declared\
    \ within a structure (sc_example_args). Also, notice that these arguments are\
    \ accessed within the system call function by ② declaring a struct sc_example_args\
    \ pointer (uap) and then assigning ③ the coerced void pointer (syscall_args) to\
    \ that pointer. Keep in mind that the system call arguments reside in user space\
    \ but that the system call executes in kernel space. ⑤ Thus, when you access the\
    \ arguments via uap, you are actually working in kernel space.\n\n⁵ FreeBSD segregates\
    \ its virtual memory into two parts: user space and kernel space. User space is\
    \ where all-user applications run, while kernel space is where the kernel and\
    \ kernel extensions (i.e., LKMs) run. Code running in user space cannot access\
    \ kernel space directly (but code running in kernel space can access user-space\
    \ memory). To access kernel space from user space, an application issues a system\
    \ call.\n\n### 1.4.2 The sysent Structure\n\nSystem calls are defined by their\
    \ entries in the <sys/sysent.h> as follows:\n\n```c\nstruct sysent {\n    int\
    \ sy_narg;                  /* number of arguments */\n    void *sy_call;    \
    \           /* implementing function */\n    int sy_flags;                /* flags\
    \ */\n};\n```\n\nHere is the example sysent for the system call (shown in 1.4.1):\n\
    \n```c\nstatic struct sysent sc_example = {\n    1,                          /*\
    \ number of arguments */\n    sc_example                  /* implementing function\
    \ */\n};\n```\n\nWhenever a system call is installed, its sysent structure is\
    \ placed within. One additional point is worth mentioning.\n\nNOTE Throughout\
    \ this book, I'll refer to the system call table as sysent.\n\n### 1.4.3 The Offset\
    \ Value\n\nThe offset value (also known as system call number*) is a unique integer\
    \ between 0 and 456 that is assigned to each system call to indicate its sysent\
    \ structure’s offset.\n\nWithin a system call module, the offset value needs to\
    \ be explicitly declared. It is typically done as follows:\n\n```c\nstatic int\
    \ offset = NO_SYSCALL;\n```\n\nThe constant NO_SYSCALL sets offset to the next\
    \ available element in sysent. \n\n### 1.4.4 The SYSCALL_MODULE Macro\n\nRecall\
    \ from Section 1.2 that when a KLD is loaded, it must link and register itself\
    \ with the kernel and use the DECLARE_MODULE macro to do so. However, when writing\
    \ a system call, the DECLARE_MODULE macro is somewhat inconvenient, as you’ll\
    \ see soon. Thus, we use the SYSCALL_MODULE macro instead, which is defined in\
    \ the /sys/sysent.h header as follows:\n\n```c\n#define SYSCALL_MODULE(name, offset,\
    \ new_sysent, evh, arg) \\\nstatic struct syscall_module data name##syscall_mod\
    \ = { \\\n    evh, arg, offset, new_sysent, { 0, NULL } \\\n} \\\nstatic moduledata_t\
    \ name##mod = { \\\n    #name, \\\n    syscall_module_handler, \\\n    &name##syscall_mod\
    \ \\\n}; \\\nDECLARE_MODULE(name, name##mod, SI_SUB_DRIVERS, SI_ORDER_MIDDLE)\n\
    ```\n\nAs you can see, if we were to use the DECLARE_MODULE macro, we’ve had to\
    \ set up a syscall_module_data and moduledata structure first; thankfully, SYSCALL_MODULE\
    \ saves us this trouble.\n"
