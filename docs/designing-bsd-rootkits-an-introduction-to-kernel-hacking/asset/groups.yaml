    To safely manipulate the kernel queue data structures—that is, in order to ensure
    thread synchronization—your code should acquire the appropriate lock (i.e., resource
    access control). In our examples, this will either be a mutex or shared/exclusive
    lock.


    # 3.2.1 The mtx_lock Function


    Mutexes provide mutual exclusion for one or more data objects and are the primary
    method of thread synchronization.

    A kernel thread acquires a mutex by calling the mtx_lock function.


    ```

    #include <sys/param.h>

    #include <sys/lock.h>

    #include <sys/mutex.h>


    void

    mtx_lock(struct mtx *mutex);

    ```


    If another thread is currently holding the mutex, the caller will sleep until
    the mutex is available.


    # 3.2.2 The mtx_unlock Function


    A mutex lock is released by calling the mtx_unlock function.


    ```

    #include <sys/param.h>

    #include <sys/lock.h>

    #include <sys/mutex.h>


    void

    x_unlock(struct mtx *mutex);

    ```


    > If a higher priority thread is waiting for the mutex, the releasing thread may
    be preempted to allow the higher priority thread to acquire the mutex and run.


    +   NOTE For more on mutexes, see the mutex(9) manual page.


    # 3.2.3 The sx_lock and sx_xlock Functions


    Exclusive locks (also known as sx locks) are simpler reader/writer locks that
    can be held across a sleep. As their name suggests, multiple threads may hold
    a shared lock, but only one thread may hold an exclusive lock. Furthermore, if
    one thread holds an exclusive lock, no other threads may hold a shared lock.


    A thread acquires a shared or exclusive lock by calling the sx_lock or sx_xlock
    functions, respectively.


    ```

    #include <sys/param.h>

    #include <sys/lock.h>

    #include <sys/sx.h>

    ```'
