    # 7.2 Detecting DKOM


    As stated in Chapter 3, DKOM is one of the most difficult-to-detect rootkit techniques.
    This is because you can unload a DKOM-based rootkit from memory patching, which
    leaves almost no signature. Therefore, in order to detect a DKOM-based attack,
    your best bet is to catch the operating system in a "lie." To do this, you should
    have a good understanding of what is considered normal behavior for your system.


    > One cave to this approach is that you cannot trust the APIs on the system you
    are checking.


    # 7.2.1 Finding Hidden Processes


    Recall from Chapter 3 that in order to hide a running process with DKOM, you need
    to patch the allproc list, pidhashtbl, the parent process''s child list, the parent
    process''s process-group list, and the nproc list. If any of the objects is left
    unpatched, it can be used as the litmus test to determine whether or not a process
    is hidden.


    However, if all of these objects are patched, you can still find a hidden process
    by checking curthead before (or after) each context switch, since every running
    process stores its context in curtheadread when it executes. You can check curtheadread
    by installing an inline function hook at the beginning of mi_switch.


