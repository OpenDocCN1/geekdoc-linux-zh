    \n注意 在本书中，我们将系统调用表称为 sysent。\n\n### 1.4.3 偏移量值\n\n偏移量（也称为系统调用号）是一个 0 到 456 之间的唯一整数，分配给每个系统调用以指示其\
    \ sysent 结构的偏移。\n\n在系统调用模块中，偏移量需要显式声明。通常做法如下：\n\n```c\nstatic int offset = NO_SYSCALL;\n\
    ```\n\n常量 NO_SYSCALL 将 offset 设置为 sysent 中的下一个元素。\n\n### 1.4.4 SYSCALL_MODULE\
    \ 宏\n\n回顾第 1.2 节，当 KLD 加载时，它必须与内核链接并使用 DECLARE_MODULE 宏来实现。然而，在编写系统调用时，DECLARE_MODULE\
    \ 宏相当不太方便，你很快就会看到。因此，我们使用 SYSCALL_MODULE 宏，它定义在 /sys/sysent.h 头文件中如下：\n\n```c\n\
    #define SYSCALL_MODULE(name, offset, new_sysent, evh, arg) \\\nstatic struct syscall_module\
    \ data name##syscall_mod = { \\\n    evh, arg, offset, new_sysent, { 0, NULL }\
    \ \\\n} \\\nstatic moduledata_t name##mod = { \\\n    #name, \\\n    syscall_module_handler,\
    \ \\\n    &name##syscall_mod \\\n}; \\\nDECLARE_MODULE(name, name##mod, SI_SUB_DRIVERS,\
    \ SI_ORDER_MIDDLE)\n```\n\n你可以看到，如果我们使用 DECLARE_MODULE 宏，我们必须先设置一个 syscall_module_data\
    \ 和 moduledata 结构；幸运的是，SYSCALL_MODULE 为我们省去了这些麻烦。\n\n"
