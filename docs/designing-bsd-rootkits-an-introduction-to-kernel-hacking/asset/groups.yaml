    ```\nint\nwrite(struct cdev *dev, struct uio *uio, int iflag)\n{\n    int error\
    \ = 0;\n\n/*\n * 取一个字符字符串并将其保存在 buf 中。\n * 注意：在缓冲区和跨越用户/内核空间边界的 I/O \n * 向量之间传输数据的正确方法是使用\n\
