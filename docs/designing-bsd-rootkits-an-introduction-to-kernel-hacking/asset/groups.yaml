    注意，kernel 包含了多个“子模块”（xpt, probe, cam）。这引出了本节的真正要点。前面的输出中，kernel 和 hello.ko 在技术上是链接器文件，而
    xpt、probe、cam 和 hello 是真正的模块。这意味着 kldload(8) 和 kunload(8) 的参数实际上是链接器文件，而不是模块；对于加载到内核的每一个模块，都有一个相应的链接器文件。（这一点在我们之后讨论隐藏
    KLD 时会用到。）


    对于我们的目的来说，可以将链接器文件看作是一个或多个内核模块的引导者（或护送），引导它们进入内核空间。


