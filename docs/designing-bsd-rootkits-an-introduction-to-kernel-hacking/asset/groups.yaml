    到目前为止一切正常。现在，让我们写一个简单的用户空间程序来执行并测试这个新的系统调用。但在之前，需要对 modfind、modstat 函数进行说明。\n\n\
    ## 1.4.6 modfind 函数\n\nmodfind 函数根据模块名称返回内核模块的 modid。\n\n```\n#include <sys/param.h>\n\
    #include <sys/module.h>\n\nint\nmodfind(const char *modname);\n```\n\nModids 是用于唯一标识系统中每个已加载模块的整数。\n\
    \n## 1.4.7 modstat 函数\n\nmodstat 函数根据其 modid 返回内核模块的状态。\n\n```\n#include <sys/param.h>\n\
    #include <sys/module.h>\n\nint\nmodstat(int midst, struct module_stat *stat);\n\
    ```\n\n返回的信息存储在 stat 中，这是一个 module_stat 结构体，它定义在 <sys/module.h> 头文件中，如下：\n\n```\n\
    struct module_stat {\n    int version;\n    char name[MAXMODNAME];\n    int refs;\n\
    \    int id;\n    modspecific_t data;\n};\nunion modspecific {\n    int intval;\n\
    \    u_int uintval;\n    long long longval;\n    u_long ulongval;\n} modspecific_t;\n\
    ```\n\n## 1.4.8 Syscall 函数\n\nsyscall 函数通过编号执行系统调用。\n\n```\n#include <sys/syscall.h>\n\
    #include <unistd.h>\n\nint\nsyscall(int number, ...);\n```\n\n## 1.4.9 执行系统调用\n\
    \n列表 1-4 是用于执行列表 1-3（命名为 sc_example）中系统用的用户空间程序。该程序接受一个传递给 sc_example 的命令行参数：\n\
    \n```\n#include <stdio.h>\n#include <sys/syscall.h>\n#include <sys/types.h>\n\
    #include <sys/module.h>\n\nint\nmain(int argc, char *argv[]) {\n    int syscall_num;\n\
    \    struct module_stat stat;\n\nif (argc != 2) {\n    printf(\"Usage:%s <string>\\\
    n\", argv[0]);\n    exit(0);\n}\n/* 确定 sc_example 的偏移量。 */\nstat.version = sizeof(stat);\n\
    modstat(modfind(\"sc_example\"), &stat);\nsyscall_num = stat.data.intval;\n\n\
    /* 调用 sc_example。 */\nreturn(syscall(syscall_num, argv[1]));\n}\n```\n\n- 列表 1-4:\
    \ interface.c\n\n我们调用 ① modfind 和 modstat 来确定 sc_example 的偏移量。该值连同命令行参数传递给 ② syscall，从而执行了\
    \ sc_example。以下是示例输出：\n\n```\n$ ./interface \"Hello, kernel!\"\n$ dmesg | tail\
    \ 1\n```\n\n## 1.4.10 无 C 代码执行系统调用\n\n虽然编写用户空间程序来执行系统调用是“正确”的方法，但当你只想测试系统调用模块时，先写一个程序非常麻烦。在不写用户空间程序的情况下执行系统调用，我是这样做的：\n\
    \n```\n$ sudo kload ./sc_example.ko\nSystem call loaded at offset 210.\n$ perl\
    \ -e '$str = \"Hello, kernel!\"'; -e 'syscall(210,$str);'\n$ dmesg | tail 1\n\
    ```\n\n前面的演示表明，通过利用 Perl 的命令行执行（即 -e 选项）、其 syscall 函数以及已知系统调用偏移量的事实，你可以快速测试任何系统调用模块。需要注意的是，\
    \ Perl 的 syscall 函数不能使用字符串字面量，这就是为什么使用变量 ($str) 将字符串传递给 sc_example。\n\n## 内核/用户空间切换\n\
    \n我将描述一组可以在内核空间拷贝、操作和覆盖存储在用户空间的数据的核心函数。我们在书中将使用这些函数。\n\n## 1.5.1 copyin 和 copystr\
    \ 函数\n\ncopyin 和 copystr 函数允许你从用户空间向内核空间拷贝连续区域。\n\n```\n#include <sys/types.h>\n\
    #include <sys/system.h>\n\nint\ncopyin(const void *uaddr, void *kaddr, size_t\
    \ len);\n\nint\ncopystr(const void *uaddr, void *kaddr, size_t len, size_t *done);\n\
    ```\n\ncopyin 函数从用户空间地址 uaddr 拷贝 len 字节的数据到内核空间地址。copystr 函数类似，但它拷贝一个以空结尾的字符串，最大长度为\
    \ len 字节，实际字节数返回在 done 中。⁶\n\n## 1.5.2 copyout 函数\n\ncopyout 函数类似，但它拷贝一个以空结尾的字符串，最大长度为\
    \ len 字节，实际字节数返回在 done 中。\n\n```\n#include <sys/types.h>\n#include <sys/system.h>\n\
    \nint\ncopyout(const void *kaddr, void *uaddr, size_t len);\n```\n\n## 1.5.3 copystr\
    \ 函数\n\ncopystr 函数与 copyin 类似，区别是从内核空间拷贝到另一个空间。\n\n```\n#include <sys/types.h>\n\
    #include <sys/system.h>\n\nint\ncopystr(const void *kfaddr, void *kdaddr, size_t\
    \ len, size_t *done);\n```\n\n> ⁶ 在列表 1-3 中，诚然承认系统调用函数应该先调用 copyin 拷贝字符串然后打印它。目前，它只是一个示例，不是真正的系统调用。\n\
    \n## 1.6 字符设备模块\n\n字符设备模块是创建或安装字符设备的 KLD。在 FreeBSD 中，字符设备是访问特定设备的接口。例如，数据通过 /dev/console\
    \ 从系统控制台读写。\n\n注意：在第 4 章中，你将编写攻击系统中现有字符设备的 rootkit。因此，本节作为入门介绍。\n\n每个字符设备三个三个项目：cdevsw\
    \ 结构体、字符设备函数和注册例程。我们将逐一讨论。\n\n### 1.6.1 cdevsw 结构体\n\n字符设备通过其在字符设备切换表 struct cdevsw\
    \ 中的项定义，该结构在 <sys/conf.h> 头文件中如下：\n\n```\nstruct cdevsw {\n    int           \
    \      d_version;\n    u_int               d_flags;\n    const char         *d_name;\n\
    \    d_open_t            *d_open;\n    d_fdopen_t          *d_fdopen;\n    d_close_t\
    \           *d_close;\n    d_read_t            *d_read;\n    d_write_t       \
    \    *d_write;\n    ioctl_t             *d_ioctl;\n    d_poll_t            *d_poll;\n\
    \    d_mmap_t            *d_mmap;\n    d_strategy_t        *d_strategy;\n    dumper_t\
    \           *d_dump;\n    d_kqfilter_t        *d_kqfilter;\n    d_purge_t    \
    \      *d_purge;\n    d_spare2_t          *d_spare2;\n    uid_t              \
    \ *d_uid;\n    gid_t               *d_gid;\n    mode_t              *d_mode;\n\
    \    const char         *d_kind;\n\n    /* 这些字段不应被驱动程序修改 */\n    LIST_ENTRY(cdevsw)\
    \  d_list;\n    LIST_HEAD(cdevsw)   d_devs;\n    int                 d_spare3;\n\
    \    struct cdevsw       *d_giantrick;\n\n};\n```\n\n"
