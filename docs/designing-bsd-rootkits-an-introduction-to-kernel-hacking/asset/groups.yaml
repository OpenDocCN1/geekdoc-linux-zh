    \n在本章中，你将学习如何检测全书中描述的各种 rootkit 技术。但请记住，rootkit 和 rootkit 检测器之间处于永恒的军备竞赛中。当一方开发出新技术时，另一方就会开发出对。换句话之，今天有效的方法明天可能就不灵了。\n\
    \n### 7.1 检测调用钩子\n\n如第 2 章所述，调用钩子实际上是关于重定向函数指针的。因此，要检测调用钩子，只需要确定函数指针是否仍然指向其原始函数。例如，你可以通过检查其系统结构\
    \ `sys_call` 成员来确定 `mdir` 系统调用是否被挂钩。如果它指向 `mdir`以外的任何函数，你就发现了一个调用钩子。\n\n### 7.1.1\
    \ 寻找系统调用钩子\n\n列表 7-1 是一个旨在寻找（并卸载）系统调用钩子的简单程序。该程序带有两个参数被调用：要检查的系统调用名称及其对应的系统调用号。它还有一个可选的第三个参数，字符串\
    \ \"fix\"，如果发现钩子，它将恢复原始系统调用函数。\n\n> 注意：以下程序实际上是 `checkcall.c`；我做了一些细微修改，使其在 FreeBSD\
    \ 6 下可以顺利编译。我还做了一些外观上的修改，使其在打印时看起来更好。\n\n```\n#include <fcntl.h>\n#include <kvm.h>\n\
    #include <limits.h>\n#include <nlist.h>\n#include <stdio.h>\n#include <stdlib.h>\n\
