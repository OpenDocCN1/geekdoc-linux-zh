    # 5.3 Understanding x86 Call Statements


    In x86 assembly the call statement is a control transfer instruction used to call
    a function or procedure. There are two types of call statements: near and far.
    For our purposes, we only need to understand near call statements. The following
    (contrived) code segment illustrates the details of a near call.


    200: b8 12 95 00 00 mov $0x9512,%ebx

    205: e8 f6 00 00 00 call 300

    20a: b8 2f 14 00 00 mov $0x142f,%eax


    > In the above code snippet, when the instruction pointer hexadecimal address
    205—the call statement—it will jump to 300. The hexadecimal representation for
    the call is e8. However, f6 00 00 00 is obviously not 300. At first glance, it
    appears that the machine code and assembly code don''t match, but in fact, they
    do. In a near call, the address of the instruction after the call statement is
    saved on the stack, so that the procedure knows where to return to. The machine
    code for a call statement is the address of the called procedure, minus the address
    of the instruction following the call statement (0x300–0x20a=0xf6). This explains
    why the machine code operand is f6 00 00 00 in this example, not 03 00 00. This
    is an important point that will come into play shortly.


    # 5.3.1 Patching Call Statements


    Going back to Listing 5-1, let''s say when we not out for the loop, we want hello
    to call printf instead of printf. The program in Listing 5-3 patches hello to
    just that.'
