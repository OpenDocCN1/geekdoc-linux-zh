    \ break;\n\n    case MOD_UNLOAD:\n        destroy_dev(sdev);\n        uprintf(\"\
    Character device unloaded\\n\");\n        break;\n\n    default:\n        error\
    \ = EOPNOTSUPP;\n        break;\n    }\n\n    return(error);\n}\n```\n\n此示例函数将在模块加载时通过调用\
    \ `make_dev` 函数来注册字符设备 `cd_example`，该函数将在 `/dev` 上创建一个 `cd_example` 设备节点。此外，该函数将在模块卸载时通过调用\
