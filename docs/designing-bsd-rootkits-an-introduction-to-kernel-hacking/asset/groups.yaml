    by MICHAEL ZALEWSKI


    Zalewski shares his expertise and experience to explain how computers and networks
    work, how information is processed and delivered, and what security threats lurk
    in the shadows. No humdrum technical white paper or manual for protecting one''s
    network, this book is a fascinating narrative that explores a variety of unique,
