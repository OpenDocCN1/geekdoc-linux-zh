    \ *module, int cmd, void *arg)\n{\n    int error = 0;\n\n    switch (cmd) {\n\
    \    case MOD_DEV:\n        sdev = make_dev(&cd_example_cdevsw, 0, UID_ROOT, GID_WHEEL,\
