    ## 钩钩 (HOOKING)


    ![](img/bfd792ec0e2d264dd5185dbb1d3a3b80_42_0.png)


    我们将从调用钩（call hooking）或简单的钩子（hooking）开始讨论内核模式 rootkit，这无疑是最流行的 rootkit 技术。


    *钩子（Hooking）* 是一种编程技术，它使用处理函数（称为 *hooks*）来修改控制流。一个新的钩子将其地址注册为特定函数的位置，这样当函数被调用时，运行的是钩子而不是原函数。通常，钩子会在某处调用原始函数，以保留原始行为。图
    2-1 展示了子程序在安装调用钩子前后的控制流。


    | 正常执行 | | 钩子执行 |

    |---|---|---|

    | Function A | -> | Function A | -> Function B |

    | | | | Hook |


    图 2-1：正常执行与钩子执行


    如你所见，钩子用于扩展（或减少）子程序的功能。在 rootkit 设计中，钩子被用于更改操作系统应用程序编程接口（APIs）的结果，最常见的是涉及记录和报告。

    现在，让我们开始滥用 KLD 接口吧。


    ## 2.1 钩住系统调用


    回想第 1 章，系统调用是应用程序请求操作系统内核提供服务的入口点。通过钩住这些入口点，rootkit 可以更改内核返回给任何或所有用户空间进程的结果。事实上，钩住系统调用是非常有效的，以至于大多数（可能可用的）
    rootkit 都以某种方式使用了它。


    在 FreeBSD 中，系统调用通过将其地址注册为目标系统调用内的系统调用函数来安装。通过钩住这些入口点，rootkit 可以更改内核返回给任何或所有用户空间进程的结果。事实上，钩住系统调用是非常有效的。


    关于系统调用的更多信息，请见第 1.4。


