    \ 的 Makefile，你也可以通过 make load 和 unload 来加载和卸载你构建的模块。\n\n## 1.4 系统调用模块\n\n系统调用模块仅仅是安装系统调用的\
    \ KLD。在操作系统中，系统调用（也称为系统服务请求）是应用程序请求操作系统内核提供服务的机制。\n\n**注意** 在第 2、3 和 6 章中，你将编写既能隐藏现有系统调用又能安装新系统调用的\
    \ rootkit。因此，本节将作为入门介绍。\n\n每个系统调用模块都有三个独特的条目：系统调用函数、sysent 结构体和偏移量值。\n\n### 1.4.1\
    \ 系统调用函数\n\n系统调用函数实现了系统调用。其函数原型定义在 `<sys/sysent.h>` 头文件中，如下：\n\n```c\ntypedef\
