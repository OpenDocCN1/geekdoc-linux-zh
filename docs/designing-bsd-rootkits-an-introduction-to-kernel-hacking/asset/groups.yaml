    by a hash function. That is, given a key (e.g., a name), you can easily find the
    corresponding value.


    ### 3.4.2 The pidhashbl


    For efficiency, all running processes, in addition to being on the allproc list,
    are stored on a hash table named pidhash.


    ### 3.4.3 The pindfind Function


