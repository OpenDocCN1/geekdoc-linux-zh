    \ 示例\n\n列表 1-5 显示了一个完整的字符设备模块（基于 Rajesh Vaidheeswaran 的 `cdev.c`），该模块安装了一个简单的读/写字符设备。该设备对内核内存区域进行操作，从参数读取并向其写入单个字符字符串。\n\
