    Wrote \"Hello, kernel!\" to device /dev/cd_example.\nRead \"Hello, kernel!\" from\
    \ device /dev/cd_example.\n```\n\n## 1.7 Linker Files and Modules\n\nBefore wrapping\
    \ this chapter, let's take a brief look at the kldstat(8)\ncommand, which displays\
    \ the status of any files dynamically linked into the\nkernel.\n\n```\n$ kldstat\n\
    Id Refs Size Name\n1 4 0xc0400000 63070c kernel\n2 16 0xc0a31000 568dc acpi.ko\n\
    3 1 0xc1e8b000 2000 hello.ko\n```\n\nIn the above listing, three \"modules\" are\
    \ loaded: the kernel (kernel), the\nACPI power-management module (acpi.ko), and\
    \ the \"Hello, world!\" module\n(hello.ko) that we developed in Section 1.3.\n\
    \nRunning the command kldstat -v (for more verbose output) gives us the\nfollowing:\n\
    \n```\n$ kldstat -v\nId Refs Size Name\n1 4 0xc0400000 63070c kernel\nContains\
    \ modules:\nId Name\n18 xpt\n19 probe\n20 cam\n...\n3 1 0xc1e8b000 2000 hello.ko\n\
    Contains modules:\nId Name\n367 hello\n```\n\nNote that kernel contains multiple\
    \ \"submodules\" (xpt, probe, cam). This brings us to the real point of this section.\
    \ The preceding output, kernel and hello.ko are technically linker files, and\
    \ the xpt, probe, cam, and hello are the actual modules. This means that the arguments(s)\
    \ for kldload(8) and kunload(8) are actually linker files, not modules, and that\
    \ for every module loaded into the kernel, there is an accompanying linker file.\
    \ (This point will come into play when we discuss hiding KLDs.)\n\nFor our purposes,\
    \ think of a linker file as an usher (or escort) for one or more kernel modules,\
    \ guiding them into kernel space.\n\n## 1.8 Concluding Remarks\n\nThis chapter\
    \ has been a whirlwind tour of FreeBSD kernel-module programming. I have described\
    \ some of the various types of KLDs that we will encounter again and again, and\
    \ you've seen numerous small examples to give you a feel for the remainder of\
    \ this book is like.\n\nTwo additional points are also worth mentioning. First,\
    \ the kernel source tree, which is located in /usr/src/sys/, is the best reference\
    \ and learning tool for a newbie FreeBSD kernel hacker. If you have yet to look\
    \ through this directory, by all means, do so; much of the code in this book is\
    \ gleaned from there.\n\nSecond, consider setting up a FreeBSD machine with a\
    \ debug kernel or kernel-mode debugger; this helps considerably when you write\
    \ your own kernel code. The following online resources will help you.\n\n- *The\
    \ FreeBSD Developer's Handbook*, specifically Chapter 10, located at http://www.freebsd.org/doc/en_US.ISO8859-1/books/developers-handbook.\n\
    - *Debugging Kernel Problems* by Greg Lehey, located at http://www.lemis.com/grog/Papers/Debug-tutorial/tutorial.pdf.\n\
    \n> 7 Typically, there is also a symlink from /sys/ to /usr/src/sys/.\n\n## #2\n\
    \n## HOOKING\n\n![](img/bfd792ec0e2d264dd5185dbb1d3a3b80_42_0.png)\n\nWe’ll start\
    \ our discussion of kernel-mode rootkits with call hooking, or simply hooking,\
    \ which is arguably the most popular rootkit technique.\n\n*Hooking* is a programming\
    \ technique that employs handler functions (called *hooks*) to modify control\
    \ flow. A new hook registers its address as the location for a specific function,\
    \ so that when function is called, the hook is run instead. Typically, a hook\
    \ will call the original function at some point in order to preserve the original\
    \ behavior. Figure 2-1 illustrates the control flow of a subroutine before and\
    \ after installing a call hook.\n\n| Normal Execution | | Hooked Execution |\n\
    |---|---|---|---|\n| Function A | -> | Function A | -> Function B |\n| | | | Hook\
    \ |\n\nFigure 2-1: Normal execution versus hooked execution\n\nAs you can see,\
    \ hooking is used to extend (or decrease) the functionality of a subroutine. In\
    \ terms of rootkit design, hooking is used to alter the results of the operating\
    \ system's application programming interfaces (APIs), most commonly involved with\
    \ bookkeeping and reporting.\nNow, let's start abusing the KLD interface.\n\n\
    ## 2.1 Hooking a System Call\n\nRecall from Chapter 1 that a system call is the\
    \ entry point through which an application program requests service from the operating\
    \ system's kernel. By hooking these entry points, a rootkit can alter the kernel\
    \ returns to any or every user space process. In fact, hooking system calls is\
    \ so effective that most (possibly available) rootkits employ it in some way.\n\
    \nIn FreeBSD, a system call is installed by registering its address as the system\
    \ call function within the target system call's sysent structure (which is located\
    \ within sysent{}\n\nNOTE For more on system calls, see Section 1.4.\n\nListing\
    \ 2-1 is an example system call hook (albeit a trivial one) designed to output\
    \ a debug message whenever a user space process calls the mkdir system call—in\
    \ other words, whenever a directory is created.\n\n```c\n#include <sys/types.h>\n\
    #include <sys/param.h>\n#include <sys/proc.h>\n#include <sys/module.h>\n#include\
    \ <sys/sysent.h>\n#include <sys/kernel.h>\n#include <sys/system.h>\n#include <sys/syscall.h>\n\
    #include <sys/sysproto.h>\n```\n\n```c\n/* mkdir system call hook. */\nstatic\
    \ int\nmkdir_hook(struct thread *td, void *syscall_args)\n{\n    struct mkdir_args\
    \ /* {\n        char *path;\n        int mode;\n    } */ uap;\n    uap = (struct\
    \ mkdir_args *)syscall_args;\n\n    char path[255];\n    size_t done;\n    int\
    \ error;\n\n    error = copyinstr(uap->path, path, 255, &done);\n    if (error\
    \ != 0)\n        return(error);\n\n\n    /* Print a debug message. */\n```\n\n\
    ```c\nuprintf(\"The directory %%s\" will be created with the following\\n permissions:\
    \ %%o\\n\", path, uap->mode);\n\nreturn(mkdir(td, syscall_args));\n\n/* The function\
    \ called at load/unload. */\nstatic int\nload(struct module *module, int cmd,\
    \ void *arg)\n{\n    int error = 0;\n\n    switch (cmd) {\n    case MOD_LOAD:\n\
    \        /* Replace mkdir with mkdir_hook. */\n        osysent[SYS_mkdir].sys_call\
    \ = (sys_call_t*)mkdir_hook;\n        break;\n    case MOD_UNLOCK:\n        /*\
    \ Change everything back to normal. */\n        osysent[SYS_mkdir].sys_call =\
    \ (sys_call_t*)mkdir;\n        break;\n    default:\n        error = EOPNOSSUP;\n\
    \        break;\n    }\n\n    return(error);\n}\n\nstatic struct module_t mkdir_mod\
    \ = {\n    \"mkdir_hook\",\n    NULL,\n    load,\n    NULL,\n    NULL,\n    NULL\n\
    };\n\nDECLARE_MODULE(mkdir_mod, KLD, SI_ALL);\n```\n\nListing 2-1: mkdir_hook.c\n\
    \nNote that upon load, the event handler registers mkdir_hook (which simply prints\
    \ a debug message). To remove the hook, simply reinstate the original system call\
    \ function. The constant SYS_mkdir is defined as the offset value for the system\
    \ call. This constant is defined in <sys/syscall.h>.\n\nThe following output shows\
    \ the results of executing mkdir(1) after loading mkdir_hook.\n\n```\n$ sudo kldload\
    \ ./mkdir_hook.ko\n$ mkdir test\nThe directory \"test\" will be created with the\
    \ following permissions: 777\n$ ls -l\ndrwxrwxrwx 2 root ghost 512 Mar 22 08:40\
    \ test\n```\n\nAs you can see, mkdir(1) is now more verbose.\n\n## 2.2 Keystroke\
    \ Logging\n\nNow let's look at a more interesting (but still trivial) example\
    \ of a system call hook.\nKeystroke logging is the simple act of intercepting\
    \ and capturing a user's keystrokes. In FreeBSD, this can be accomplished by hooking\
    \ the read system call. Here is its C library definition:\n\n```c\n#include <sys/types.h>\n\
    #include <sys/io.h>\n#include <unistd.h>\n```\n\n```c\nsize_t\nread(int fd, void\
    \ *buf, size_t nbytes);\n```\n\nThe read system call reads nbytes of data from\
    \ the descriptor fd into the buffer buf. Therefore, in order to capture a user's\
    \ keystrokes, you simply have to save the contents of buf (returning from a read\
    \ call) whenever fd points to standard input (i.e., file descriptor 0). For example,\
    \ take a look at Listing 2-2:\n\n```c\n#include <sys/types.h>\n#include <sys/param.h>\n\
    #include <sys/proc.h>\n#include <sys/module.h>\n#include <sys/sysent.h>\n#include\
    \ <sys/kernel.h>\n#include <sys/system.h>\n#include <sys/syscall.h>\n#include\
    \ <sys/sysproto.h>\n```\n\n```c\n/*\n* read system call hook.\n* Logs all keystrokes\
    \ from stdin.\n* Note: This hook does not take into account special characters,\
    \ such as\n* Tab, Backspace, and so on.\n*/\n```\n\nListing 2-2: read_hook.c\n"
