    Phone: +1-720-227-5142 Fax: +720-222-2350 Web: www.freebsdffoundation.org


    ## COLOPHON


    Designing BSD Rootkits was laid out in Adobe FrameMaker. The font families used
    are New Baskerville for body text, Futura for headings and tables, and Dogma for
    titles.


    The book was printed and bound at Malloy Incorporated in Ann Arbor, Michigan.
    The paper is Glatfelter Thor 60# Antique, which is made from 50 percent recycled
    materials, including 30 percent postconsumer content. The book uses a RepKover
    binding, which allows it to lay flat when open.


    ## UPDATES


    You can download the code from the book, as well as find updates, errata, and
    other information at www.nostarch.com/rootkits.htm.


    Though rootkits have a fairly negative image, they can be used for both good and
    evil. **Designing BSD Rootkits** arms you with the knowledge you need to write
    offensive rootkits, to defend against malicious ones, and to explore the FreeBSD
    kernel and operating system in the process.


    Included:


    - The fundamentals of FreeBSD kernel-module programming

    - Using call hooking to subvert the FreeBSD kernel

    - Directly manipulating the objects that the kernel depends upon its internal
    record-keeping

    - Patching kernel code resident in main memory; in other words, altering the kernel''s
    logic while it''s still running

    - How to defend against the attacks described


    Organized as a tutorial, *Designing BSD Rootkits* will teach you the fundamentals
    of programming and developing rootkits under the FreeBSD operating system. Author
    Joseph Kong''s goal is to make you smarter, not to teach you how to write exploits
    or launch attacks. You''ll learn how to maintain root access after gaining access
    to a computer, and how to hack FreeBSD.


    So go right ahead. Hack the FreeBSD kernel yourself


    ## ABOUT THE AUTHOR


    Kong''s liberal use of examples assumes no prior kernel-hacking experience but
    doesn''t water down the information. All code is thoroughly described and analyzed,
    and chapter contains at least one real-world application.


    Tinkering with computers has always been a primary passion of author Joseph Kong.
    He is a self-taught programmer who dabbles in information security, operating
    system theory, reverse engineering, and vulnerability assessment. He has written
    for Prack Magazine and was a system administrator for the City of Toronto.


