    # HOOKING


    ![](img/bfd792ec0e2d264dd5185dbb1d3a3b80_42_0.png)


    We’ll start our discussion of kernel-mode rootkits with call hooking, or simply
    hooking, which is arguably the most popular rootkit technique.


    *Hooking* is a programming technique that employs handler functions (called *hooks*)
    to modify control flow. A new hook registers its address as the location for a
    specific function, so that when function is called, the hook is run instead. Typically,
    a hook will call the original function at some point in order to preserve the
    original behavior. Figure 2-1 illustrates the control flow of a subroutine before
    and after installing a call hook.


    | Normal Execution | | Hooked Execution |

    |---|---|---|---||

    | Function A | -> | Function A | -> Function B |

    | | | | Hook |


    Figure 2-1: Normal execution versus hooked execution'
