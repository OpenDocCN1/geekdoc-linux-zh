    \n```c\nint add(int a, int b) {\n    return a + b;\n}\n```\n\nThe assembly:\n\n\
    ```assembly\nadd:\n    push ebp\n    mov ebp, esp\n    mov eax, [ebp+8]\n    mov\
    \ edx, [ebp+12]\n    add eax, edx\n    pop ebp\n    ret\n```\n\n`[ebp+8]` is the\
    \ first argument, `[ebp+12]` is the second, and so on.\n\nWhen a function calls\
