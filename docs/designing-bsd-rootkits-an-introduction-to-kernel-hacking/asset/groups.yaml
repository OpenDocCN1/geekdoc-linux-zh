    # 5.1.1 The kvm_openfiles Function


    Access to kernel virtual memory is initialized by calling the kvm_openfiles function.
    If kvm_openfiles is successful, a descriptor is returned to be used in all subsequent
    libkvm calls. If an error is encountered, NULL is returned instead.

    Here is the function prototype for kvm_openfiles:


    ```

    #include <fcntl.h>

    #include <kvm.h>


    kvm_t *

    vm_openfiles(const char *execfile, const char *corefile,

    const char *swapfile, int flags, char *errbuf);

    ```


    The following is a brief description of each parameter.


    execfile

    This specifies the kernel image to be examined, which must contain a symbol table.
    If this parameter is set to NULL, the currently running kernel image is examined.


    corefile

    This is the kernel memory device file; it must be set to either /dev/mem or a
    crash dump generated by savecore(8). If this parameter is set to NULL, /dev/mem
    is used.


    swapfile

    This parameter is currently unused; thus, it''s always set to NULL.


    flags

    This parameter indicates the read/write access permissions for the core file.
    It must be set to one of the following constants:


    +   - O_RDONLY Open for reading only.

    - O_WRONLY Open for writing only.

    - O_RDWR Open for reading and writing.


    errbuf

    If kvm_openfiles encounters an error, an error message is written into this parameter.


    # 5.1.2 The kvm_nlist Function


    The kvm_nlist function retrieves the symbol table entries from a kernel image.


    ```

    #include <kvm.h>

    #include <nlist.h>


    int

    kvm_nlist(kvm_t *kd, struct nlist *nlist);

    ```'
  - '[PAGE 84]


    Here, nl is a null-terminated array of nlist structures. To make proper use of
    kvm_nlist, you''ll need to know two fields in struct nlist, specifically n_name,
    which is the name of the symbol loaded in memory, and n_value which is the address
    of the symbol.


    The kvm_nlist function iterates through nl, looking up each symbol in turn through
    the n_name field; if found, n_value is filled out appropriately. Otherwise, it
    is set to 0.


    # ### 5.1.3 The kvm_geterr Function


    The kvm_geterr function returns a string describing the most recent condition
    on a kernel virtual memory descriptor.


    ```

    #include <kvm.h>

    ```


    ```

    char *

    kvm_geterr(kvm_t *kd);

    ```


    The results are undefined if the most recent libkvm call did not produce an error.


    # ### 5.1.4 The kvm_read Function


    Data is read from kernel virtual memory with the kvm_read function. If the read
    is successful, the number of bytes transferred is returned. Otherwise, -1 is returned.


    ```

    #include <kvm.h>

    ```


    ```

    ssize_t

    kvm_read(kvm_t *kd, unsigned long addr, void *buf, size_t nbytes);

    ```


    Here, nbytes indicates the number of bytes to be read from the kernel space addr
    to the buffer buf.


    # ### 5.1.5 The kvm_write Function


    Data is written to kernel virtual memory with the kvm_write function.


    ```

    #include <kvm.h>

    ```


    ```

    ssize_t

    kvm_write(kvm_t *kd, unsigned long addr, const void *buf, size_t nbytes);

    ```


    The return value is usually equal to the nbytes argument, unless an error has
    occurred, in which case -1 is returned instead. In this definition, nbytes indicates
    the number of bytes to be written to addr from buf.'
