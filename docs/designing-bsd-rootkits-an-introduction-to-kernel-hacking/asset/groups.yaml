    # ACKNOWLEDGMENTS


    Foremost, I am especially grateful to Bill Pollock for his belief in me and for
    his help in this book, as well as giving me so much creative control. His numerous
    reviews and suggestions show in the final result (and yes, the rumors are true,
    he does edit like a drill sergeant). I would also like to thank Elizabeth Campbell
    for, essentially, sheding this entire book (and remaining cheerful at all times,
    even when I rewrote an entire chapter, after it had been through copyedit). Thanks
    to Megan Dunchak for performing the copyedit and for improving the "style" of
    this book, and to Riley Hoffman for reviewing the entire manuscript for errors.
    Also, thanks to Patricia Witkin, Leigh Poehler, and Ellen Har for all of their
    work in marketing.


    I would also like to thank John Baldwin, who served as this book''s technical
    reviewer, but went beyond the normal call of duty to provide a wealth of suggestions
    and insights; most of which became new sections in this book.


    Also, I would like to thank my brother for proofreading the early drafts of this
    book, and my dad for getting me into computers (he''s still the best hacker I
    know), and my mom for, pretty much, everything (especially her patience, because
    I was definitely a brat growing up).


    Last but not least, I would like to thank the open-source software/hacker community
    for their innovation, creativity, and willingness to share.'
