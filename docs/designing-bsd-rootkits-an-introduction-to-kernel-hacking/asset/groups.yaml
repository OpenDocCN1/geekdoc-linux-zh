    \ 210.\n```\n\nSo far, so good. Now, let's write a simple user space program to\
    \ execute and test this new system call. But first, an explanation of the modfind,\
    \ modstat, and functions is required.\n\n## 1.4.6 The modfind Function\n\nThe\
    \ modfind function returns the modid of a kernel module based on its module name.\n\
    \n```\n#include <sys/param.h>\n#include <sys/module.h>\n\nint\nmodfind(const char\
