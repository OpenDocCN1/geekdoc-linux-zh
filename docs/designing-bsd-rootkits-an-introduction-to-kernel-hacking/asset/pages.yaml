- img_proc: true
  md: '# 5.1.1 The kvm_openfiles Function


    Access to kernel virtual memory is initialized by calling the kvm_openfiles function.
    If kvm_openfiles is successful, a descriptor is returned to be used in all subsequent
    libkvm calls. If an error is encountered, NULL is returned instead.

    Here is the function prototype for kvm_openfiles:


    ```

    #include <fcntl.h>

    #include <kvm.h>


    kvm_t *

    vm_openfiles(const char *execfile, const char *corefile,

    const char *swapfile, int flags, char *errbuf);

    ```


    The following is a brief description of each parameter.


    execfile

    This specifies the kernel image to be examined, which must contain a symbol table.
    If this parameter is set to NULL, the currently running kernel image is examined.


    corefile

    This is the kernel memory device file; it must be set to either /dev/mem or a
    crash dump generated by savecore(8). If this parameter is set to NULL, /dev/mem
    is used.


    swapfile

    This parameter is currently unused; thus, it''s always set to NULL.


    flags

    This parameter indicates the read/write access permissions for the core file.
    It must be set to one of the following constants:


    +   - O_RDONLY Open for reading only.

    - O_WRONLY Open for writing only.

    - O_RDWR Open for reading and writing.


    errbuf

    If kvm_openfiles encounters an error, an error message is written into this parameter.


    # 5.1.2 The kvm_nlist Function


    The kvm_nlist function retrieves the symbol table entries from a kernel image.


    ```

    #include <kvm.h>

    #include <nlist.h>


    int

    kvm_nlist(kvm_t *kd, struct nlist *nlist);

    ```'
