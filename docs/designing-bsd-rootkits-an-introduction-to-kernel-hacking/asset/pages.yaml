    > NOTE For more on shared/exclusive locks, see the sx(9) manual page.


    # 3.3 Hiding a Running Process


    Now, equipped with the macros and functions from the previous sections, I''ll
    detail how to hide a running process using DKOM. First, though, we need some background
    information on process management.


    # 3.3.1 The proc Structure


    In FreeBSD the context of each process is maintained in list structure, which
    is defined in the <sys/proc.h> header. The following list describes the fields
    in struct proc that you''ll need to understand in order to hide a running process.


    > NOTE I''ve tried to keep this list brief so that it can be used as a reference.
    You can skip over this list on your first reading and refer back to it when you
    see some real C code.


    +   LIST_ENTRY(proc) p_list;

    This field contains the linkage pointers that are associated with the proc structure,
    which is stored on either the allproc or proc list (discussed in Section 3.3.2).
    This field is referenced during insertion, removal, and traversal of either list.


    +   int p_flag;

    These are the process flags, such as P_WEXIT, P_EXEC, and so on, that are set
    on the running process. All the flags are defined in the <sys/proc.h> header.'
