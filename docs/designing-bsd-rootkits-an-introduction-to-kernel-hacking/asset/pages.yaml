    Disassembly of section .text:


    ```

    c063e7dc <mi_switch>:   push %ebp

    c063e7dc:               55

    c063e7dd:             89 e5    mov %esp,%ebp

    c063e7df:             57      push %edi

    c063e7e0:             56      push %esi

    c063e7e1:             53      push %ebx

    c063e7e2:             83 ec 30    sub $0x30,%esp

    c063e7e5:         64 a1 00 00 00 00  mov %0x0,%eax

    c063e7eb:             89 45 do    mov 0xfffffffd(%ebp)

    c063e7ee:             88 38      mov (%eax),edi

    ```


    Assuring that your mi_switch hook is going to be installed on a wide range of
    systems, you can use the fact that mi_switch always accesses ① the fs segment
    register (which is, of course, thread) of your placeholder holder. You can use
    Ux64 in a manner similar to how we used Ox8 in Chapter 5''s mkdir inline function.


    With regard to the hook itself, you can write something very simple, such as a
    hook that prints out the process name and PID of the running thread (which, given
    enough time, would give you the “true” list of running processes on your system)
    or something very complex, such as a hook that checks whether the current thread''s
    process structure is still linked in allproc.


    Regardless, this hook will add a substantial amount of overhead to your system''s
    thread-scheduling algorithm, which means that it''s in place, your system will
    become more or less usable. Therefore, you should also write an uninstall routine.


    Also, because this is a rootkit detection routine and not a rootkit, I would suggest
    that you allocate kernel memory for your hook “proper” way—with a kernel module.
    Remember, the algorithm to allocate kernel memory via run-time patching has an
    inherent race condition, and you don''t want to crash your system while checking
    for hidden processes.


    That''s it. As you see, this program is really just a simple inline hook, no more
    complex than the example from Chapter 5.


    > NOTE Based the process-hiding routine from Chapter 3, you can also detect a
    hidden process by checking the UMA zone for processes. First, select an unused
    flag from p_flag. Next, iterate through all of the slabs/buckets in the UMA zone
    and find all of the allocated processes; lock each process and clear the flag.
    Then, iterate through allproc and set the flag on each process. Finally, iterate
    through the processes again, and look for any processes that don''t have the flag
    set. You''ll need to hold allproc lock the time you are doing this to prevent
    rates that result in false positives; you can use a shared lock, to avoid starving
    the system too.


    Of course, all this means that your process-hiding routine needs to patch the
    UMA zone for processes and threads. Thanks, John.


    124 Chapter 7'
