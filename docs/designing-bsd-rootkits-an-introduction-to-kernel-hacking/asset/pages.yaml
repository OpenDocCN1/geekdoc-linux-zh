  md: "Because the code to do this is rather lengthy (it's longer than mkdir_patch.c),\
    \ I'll simply explain how it's done and leave the actual code to you.\n\nThe system\
    \ call dispatcher in FreeBSD is syscall, which is implemented in the file /sys/i386/i386/trap.c\
    \ as follows.\n\nNOTE In the interest of saving space, any code irrelevant to\
    \ this discussion is omitted.\n\n```\nvoid\nsyscall(frame)\n    struct trapframe\
    \ frame {\n        caddr_t params;\n        struct sysent *callp;\n        struct\
    \ thread *td = curthread;\n        struct proc *p = td->td_proc;\n        register_t\
    \ orig_tf_eflags;\n        u_int sticks;\n        int error;\n        int narg;\n\
    \        int args[8];\n        u_int code;\n    };\n\n    if (code >= p->p_sysent->sv_size)\n\
    \        callp = &p->p_sysent->sv_table[0];\n    else\n        callp = &p->p_sysent->sv_table[code];\n\
    }\n```\n\nIn syscall, the system call references the system call table and stores\
    \ the address of the system call to be dispatched into call. Here is what this\
    \ line looks disassembled:\n\n```\n486:    64 a1 00 00 00 00   mov     %fs:0x0,%eax\n\
    48c:    8b 00               mov     (%eax),%eax\n48e:    8b 80 0a 01 00 00   mov\
    \     0x1a(%eax),%eax\n494:    8b 40 04             mov     (%eax)\n```\n\nThe\
    \ first instruction loads curread, the currently running thread (i.e., the %fs\
    \ segment register), into eax. The first field in a thread structure is a pointer\
    \ to its associated proc structure; hence, the second instruction loads the current\
    \ process into eax. The next instruction loads p->p_sysent into eax. This can\
    \ be verified, as the p_sysent field (which is a sysventec pointer) is located\
    \ at an offset of 0x1a0 within a proc struct. The last instruction loads the system\
    \ call table into eax. This can be verified, as the sv_table field is located\
    \ at an offset of 0x4 within a sysventec struct. This last line is the one you'll\
    \ need to scan for and patch. However, be aware, that the system call table can\
    \ be loaded into a different general-purpose register."
