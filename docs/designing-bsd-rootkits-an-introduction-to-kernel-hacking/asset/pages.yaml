    oubtedly, I''m going to remedy this. But first, some background information on
    FreeBSD hash tables¹ is required.


    # 3.4.1 The hashinit Function


    In FreeBSD, a hash table is a contiguous array of LIST_HEAD entries that is initialized
    by calling the hashinit function.


    ```

    #include <sys/malloc.h>

    #include <sys/system.h>

    #include <sys/queue.h>


    *

    hashinit(int nelelements, struct malloc_type *type, u_long *hashmask);

    ```


    This function allocates space for a hash table of size nelements. If successful,
    a pointer to the allocated hash table is returned, with the bit mask (which is
    used in the hash function) set in hashmask.


    # 3.4.2 pidhashhtbl


    For efficiency purposes, all running processes, in addition to being on the allproc
    list, are stored on a hash table named pidhashhtbl. This hash table is used to
    locate a proc structure by its PID more quickly than an O(n) walk of (i.e., a
    linear search through) the allproc list. This hash table is how the hidden process
    at the beginning of this section was found through its PID. pidhashhtbl is defined
    in the <sys/proc.h> header as follows:


    ```

    extern LIST_HEAD(pidhashhead, proc) *pidhashhtbl;

    ```


    It is initialized in the file /sys/kern/kern_proc_c.c as:


    ```

    pidhashhtbl = hashinit(maxproc / 4, M_PROC, &pidhash);

    ```


    > ¹In general, a hash table is a data structure in which keys are mapped to array
    positions by a hash function. The purpose of a hash table is to provide quick
    and efficient data retrieval. That is, given a key (e.g., a person''s name), you
    can easily find the corresponding value (e.g., the person''s phone number). This
    works by transforming the key, using a hash function, into a number that represents
    the offset in an array, which contains the desired value.'
