  md: 'Note that kernel contains multiple "submodules" (xpt, probe, cam). This brings
    us to the real point of this section. The preceding output, kernel and hello.ko
    are technically linker files, and the xpt, probe, cam, and hello are the actual
    modules. This means that the arguments(s) for kldload(8) and kunload(8) are actually
    linker files, not modules, and that for every module loaded into the kernel, there
    is an accompanying linker file. (This point will come into play when we discuss
    hiding KLDs.)


    For our purposes, think of a linker file as an usher (or escort) for one or more
    kernel modules, guiding them into kernel space.


    # 1.8 Concluding Remarks


    This chapter has been a whirlwind tour of FreeBSD kernel-module programming. I
    have described some of the various types of KLDs that we will encounter again
    and again, and you''ve seen numerous small examples to give you a feel for the
    remainder of this book is like.


    Two additional points are also worth mentioning. First, the kernel source tree,
    which is located in /usr/src/sys/, is the best reference and learning tool for
    a newbie FreeBSD kernel hacker. If you have yet to look through this directory,
    by all means, do so; much of the code in this book is gleaned from there.


    Second, consider setting up a FreeBSD machine with a debug kernel or kernel-mode
    debugger; this helps considerably when you write your own kernel code. The following
    online resources will help you.


