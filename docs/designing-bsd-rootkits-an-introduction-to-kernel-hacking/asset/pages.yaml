  md: "# 1.6 Character Device Modules\n\nCharacter device modules are KLDs that create\
    \ or install a character device. In FreeBSD, a character device is the interface\
    \ for accessing a specific device within the kernel. For example, data is read\
    \ from and written to the system console via the character device /dev/console.\n\
    \nNOTE In Chapter 4 you'll be writing rootkits that hack the existing character\
    \ devices on the system. Thus, this section serves as a primer.\n\nThere are three\
    \ items that are unique to each character device module: a cdevsw structure, the\
    \ character device functions, and a device registration routine. We will discuss\
    \ each in turn below.\n\n# 1.6.1 The cdevsw Structure\n\nA character device is\
    \ defined by its entries in a character device switch table, struct cdevsw, which\
    \ is defined in the <sys/conf.h> header as follows:\n\n```\nstruct cdevsw {\n\
    \    int                 d_version;\n    u_int               d_flags;\n    const\
    \ char         *d_name;\n    d_open_t            *d_open;\n    d_fdopen_t    \
    \      *d_fdopen;\n    d_close_t           *d_close;\n    d_read_t           \
    \ *d_read;\n    d_write_t           *d_write;\n    ioctl_t             *d_ioctl;\n\
    \    d_poll_t            *d_poll;\n    d_mmap_t            *d_mmap;\n    d_strategy_t\
    \        *d_strategy;\n    dumper_t           *d_dump;\n    d_kqfilter_t     \
    \   *d_kqfilter;\n    d_purge_t          *d_purge;\n    d_spare2_t          *d_spare2;\n\
    \    uid_t               *d_uid;\n    gid_t               *d_gid;\n    mode_t\
    \              *d_mode;\n    const char         *d_kind;\n\n    /* These fields\
    \ should not be messed by drivers */\n    LIST_ENTRY(cdevsw)  d_list;\n    LIST_HEAD(cdevsw)\
    \   d_devs;\n    int                 d_spare3;\n    struct cdevsw       *d_giantrick;\n\
    \n};\n```"
