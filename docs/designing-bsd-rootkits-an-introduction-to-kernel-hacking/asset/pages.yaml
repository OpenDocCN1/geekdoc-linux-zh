  md: 'M_WAITOK causes malloc to sleep and wait for resources if the allocation request
    cannot be fulfilled immediately. If this flag is set, malloc cannot return NULL.


    Either M_NOWAIT or M_WAITOK must be specified.


    # 5.4.2 The MALLOC Macro


    For compatibility with legacy code, the malloc function is called with the MALLOC
    macro, which is defined as follows:


    ```

    #include <sys/types.h>

    #include <sys/malloc.h>


    MALLOC(space, cast, unsigned long size, struct malloc_type *type, int flags);

    ```


    This macro is functionally equivalent to:


    ```

    (space) = (cast)malloc((u_long)(size), type, flags)

    ```


    # 5.4.3 The free Function


    To deallocate kernel memory that was previously allocated by malloc, call the
    free function.


    ```

    #include <sys/types.h>

    #include <sys/malloc.h>


    void

    free(void *addr, struct malloc_type *type);

    ```


    Here, addr is the memory address returned by a previous malloc call, and its type
    is its associated malloc_type.


    # 5.4.4 The FREE Macro


    For compatibility with legacy code, the free function is called with the FREE
    macro, which is defined as follows:


    ```

    #include <sys/types.h>

    #include <sys/malloc.h>


    FREE(void *addr, struct malloc_type *type);

    ```


    This macro is functionally equivalent to:


    ```

    free((addr), type)

    ```'
