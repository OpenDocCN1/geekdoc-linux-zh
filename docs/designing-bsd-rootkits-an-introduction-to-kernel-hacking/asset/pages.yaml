  md: "# 1.4.3 The Offset Value\n\nThe offset value (also known as the *system call\
    \ number*) is a unique integer between 0 and 456 that is assigned to each system\
    \ call to indicate its sysent structure’s offset within sysent].\n\nWithin a system\
    \ call module, the offset value needs to be explicitly declared. It is typically\
    \ done as follows:\n\n```\nstatic int offset = NO_SYSCALL;\n```\n\nThe constant\
    \ NO_SYSCALL sets offset to the next available or open element in sysent.\nAlthough\
    \ you could manually set offset to any unused system call number, it’s considered\
    \ good practice to avoid doing so when implementing something dynamic, like a\
    \ KLD.\n\n**NOTE** For a list of used and unused system call numbers, see the\
    \ file /sys/kern/syscalls.master.\n\n# 1.4.4 The SYSCALL_MODULE Macro\n\nRecall\
    \ from Section 1.2 that when a KLD is loaded, it must link and register itself\
    \ with the kernel and use the DECLARE_MODULE macro to do so. However, when writing\
    \ a system call, the DECLARE_MODULE macro is somewhat inconvenient, as you’ll\
    \ see soon. Thus, we use the SYSCALL_MODULE macro instead, which is defined in\
    \ the /sys/sysent.h header as follows:\n\n```\n#define SYSCALL_MODULE(name, offset,\
    \ new_sysent, evh, arg)\nstatic struct syscall_module data name##syscall_mod =\
    \ {\n    evh, arg, offset, new_sysent, { 0, NULL }\n}\nstatic moduledata_t name##mod\
    \ = {\n    #name,\n    syscall_module_handler,\n    &name##syscall_mod\n};\nDECLARE_MODULE(name,\
    \ name##mod, SI_SUB_DRIVERS, SI_ORDER_MIDDLE)\n```\n\nAs you can see, if we were\
    \ to use the DECLARE_MODULE macro, we’ve had to set up a syscall_module_data and\
    \ moduledata structure first; thankfully, SYSCALL_MODULE saves us this trouble.\n\
    \nThe following is a brief description of each parameter in SYSCALL_MODULE:\n\n\
    name\nThis specifies the generic module name, which is passed as a character string.\n\
    \noffset\nThis specifies the system call’s offset value, which is passed as an\
    \ integer pointer."
