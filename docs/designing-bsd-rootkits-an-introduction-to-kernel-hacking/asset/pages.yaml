  md: 'More No-Nonsense Books from


    # # HACKING: THE ART OF EXPLOITATION

    2ND EDITION


    by JOHN ERICKSON


    In this new second edition, author Jon Erickson again uses practical examples
    to illustrate the most common computer security issues in three related fields:
    programming, networking, and cryptography. All sections have been extensively
    updated and expanded, including a more thorough introduction to the complex, low-level
    workings of a computer. The live CD provides a Linux programming environment and
    also includes security tools and sample code.


    AUGUST 2007, 296 PP. w/CD, $39.95 ($49.95 CDN)

    ISBN 978-1-59327-144-2


    ![](img/bfd792ec0e2d264dd5185dbb1d3a3b80_157_0.png)


    # # SILENCE ON THE WIRE


    *A Field Guide to Passive Reconnaissance and Indirect Attacks*


    by MICHAEL ZALEWSKI

    Zalewski shares his expertise and experience to explain how computers and networks
    work, how information is processed and delivered, and what security threats lurk
    in the shadows. No humdrum technical white paper or manual for protecting one''s
    network, this book is a fascinating narrative that explores a variety of unique,
    uncommon and often quite elegant security challenges that defy classification
    and eschew the traditional attacker-victim model.


    APRIL 2005, 312 PP., $39.95 ($53.95 CDN)

    ISBN 978-1-59327-046-9


    ![](img/bfd792ec0e2d264dd5185dbb1d3a3b80_157_1.png)


    # # SECURITY DATA VISUALIZATION


    by REG CONTI


    Security data visualization tools offer graphical windows into the world of computer
    security data, revealing fascinating and useful insights into networking, cryptography,
    and file structures. After learning how to graph and display data correctly, readers
    will be able to understand complex data sets at a glance. Readers also learn what
    network attacks look like and how to assess their network for vulnerabilities
    with visualization software like Afterglow and RUMINT, as well as how to build
    and defend their own network visualization systems by recognizing how systems
    can be manipulated and attacked.


    AUGUST 2007, 256 PP., $49.95 ($61.95 CDN)

