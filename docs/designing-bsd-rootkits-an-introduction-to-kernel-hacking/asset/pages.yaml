  md: '# 5


    # RUN-TIME KERNEL MEMORY PATCHING


    ![](img/bfd792ec0e2d264dd5185dbb1d3a3b80_82_0.png)


    In the previous chapters we looked at the classic method of introducing code into
    a running kernel: through a loadable kernel module. In this chapter we''ll look
    at how to patch and augment a running kernel with userland code. This is accomplished
    by interacting with the /dev/kmem device, which allows us to read from and write
    to kernel virtual memory. In other words, /dev/kmem allows us to patch the various
    code bytes (loaded in executable memory space) that control the logic of the kernel.
    This is commonly referred to as run-time kernel memory patching.


    # 5.1 Kernel Data Access Library


    The Kernel Data Access Library (libkvm) provides a uniform interface for accessing
    kernel virtual memory through the /dev/kmem device. The following six functions
    from libkvm form the basis of run-time kernel memory patching.'
  merge: -1
