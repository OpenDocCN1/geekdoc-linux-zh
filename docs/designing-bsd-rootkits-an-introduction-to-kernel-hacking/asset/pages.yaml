  md: "# 1.4 System call Modules\n\nSystem call modules are simply KLDs that install\
    \ a system call. In operating systems, a system call, also known as system service\
    \ request, is the mechanism an application uses to request service from the operating\
    \ system's kernel.\n\n**NOTE** In Chapters 2, 3, and 6, you will be writing rootkits\
    \ that either hide the existing system calls or install new ones. Thus, this section\
    \ serves as a primer.\n\nThere are three items that are unique to each system\
    \ call module: the system call function, the sysent structure, and the offset\
    \ value.\n\n# 1.4.1 The System Call Function\n\nThe system call function implements\
    \ the system call. Its function prototype is defined in the `<sys/sysent.h>` header\
    \ as:\n\n```\ntypedef int sy_call_t(struct thread *, void *);\n```\n\nwhere thread\
    \ * points to the currently running thread, and void * points to the system call's\
    \ arguments structure, if there is any.\n\nHere is an example system call that\
    \ takes in a character pointer (i.e., a string) and outputs it to the system console\
    \ and logging facility via printf(9).\n\n```\nstruct sc_example_args {\n    char\
    \ *str;\n};\n\nstatic int\nsc_example_args(struct thread *td, void *syscall_args)\
    \ {\n    struct sc_example_args *uap;\n    uap = (struct sc_example_args *)syscall_args;\n\
    \    printf(\"%s\\n\", uap->str);\n    return(0);\n}\n\n```\n\nNotice that the\
    \ system call's arguments are ① declared within a structure (sc_example_args).\
    \ Also, notice that these arguments are accessed within the system call function\
    \ by ② declaring a struct sc_example_args pointer (uap) and then assigning ③ the\
    \ coerced void pointer (syscall_args) to that pointer. Keep in mind that the system\
    \ call arguments reside in user space but that the system call executes in kernel\
    \ space. ⑤ Thus, when you access the\n\n⁵FreeBSD segregates its virtual memory\
    \ into two parts: user space and kernel space. User space is where all-user applications\
    \ run, while kernel space is where the kernel and kernel extensions (i.e., LKMs)\
    \ run. Code running in user space cannot access kernel space directly (but code\
    \ running in kernel space can access user-space memory). To access kernel space\
    \ from user space, an application issues a system call."
  merge: -1
