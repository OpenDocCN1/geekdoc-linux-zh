    \ system's kernel. By hooking these entry points, a rootkit can alter the kernel\
    \ returns to any or every user space process. In fact, hooking system calls is\
    \ so effective that most (possibly available) rootkits employ it in some way.\n\
    \nIn FreeBSD, a system call is installed by registering its address as the system\
