  md: '# # 3

    DIRECT KERNEL OBJECT MANIPULATION


    ![](img/bfd792ec0e2d264dd5185dbb1d3a3b80_56_0.png)


    All operating systems store internal record-keeping data within main memory, usually
    as objects—that is, structures, queues, and the like. Whenever you ask the kernel
    for a list of running processes, open ports, and so on, this data is parsed and
    returned. Because this data is stored in main memory, it can be manipulated directly;
    there is no need to install a call hook to redirect control flow. This technique
    is commonly referred to as *Direct Kernel Object Manipulation* (Hoglund and Butler,
    2005).


    Before I get into this topic, however, let''s look at how kernel data is stored
    in a FreeBSD system.


    # ## 3.1 Kernel Queue Data Structures


    In general, a lot of interesting information is stored as a *queue* data structure
    (also known as a *list*) inside the kernel. One example is the list of loaded
    linker files; another is the list of loaded kernel modules.'
  merge: -1
  pgno: 56
- img_proc: true
  md: "The header file <sys/queue.h> defines four different types of queue data structures:\
    \ singly-linked lists, singly-linked tail queues, doubly-linked tail queues. This\
    \ file also contains 61 macros for declaring and operating on these structures.\n\
    \nThe following five macros are the basis for DKOM with doubly-linked lists.\n\
    \nNOTE The macros for manipulating singly-linked lists, singly-linked tail queues,\
    \ and doubly-linked tail queues are not discussed because they are in effect identical\
    \ to the ones shown below. For details on the use of these macros, see the queue(3)\
    \ manual page.\n\n# 3.1.1 The LIST_HEAD Macro\n\nA doubly-linked list is headed\
    \ by a structure defined by the LIST_HEAD macro. This structure contains a single\
    \ pointer to the first element on the list. The elements are doubly-linked so\
    \ that an arbitrary element can be removed without traversing the list. New elements\
    \ can be added to the list before an existing element, or at the head of the list.\n\
    \nThe following is the LIST_HEAD macro definition:\n\n```\n#define LIST_HEAD(name,\
    \ type)\nstruct name {\n    struct type *lh_first; /* first element */\n}\n```\n\
    \nIn this definition, name is the name of the structure to be defined, and type\
    \ specifies the types of elements to be linked into the list.\n a LIST_HEAD structure\
    \ is declared as follows:\n\nLIST_HEAD(HEADNAME, TYPE) head;\n\nthen a pointer\
    \ to the head of the list can later be declared as:\n\n```\nstruct HEADNAME *hpdp;\n\
    ```\n\n# 3.1.2 The LIST_HEAD_INITIALIZER Macro\n\nThe head of a doubly-linked\
    \ list is initialized by the LIST_HEAD_INITIALIZER macro.\n\n```\n#define LIST_HEAD_INITIALIZER(head)\n\
    (NULL);\n```\n\n# 3.1.3 The LIST_ENTRY Macro\n\nThe LIST_ENTRY macro declares\
    \ a structure that connects the elements in a doubly-linked list."
