    # 3.3.2 The allproc List


    FreeBSD organizes its proc structures into two lists. All processes in the ZOMBIE
    state are located on the proclist; the rest are on the allproc list. This list
    is referenced—albeit indirectly—by ps(1), top(1), and other reporting tools to
    list the running processes on the system. Thus, you can hide a running process
    by simply removing its proc structure from the allproc list.


    > Naturally, one might think that by removing a proc structure from the associated
    process would not execute. In the past, several authors and hackers have stated
    that modifyingallproc would be far too complicated because it is used in process
    scheduling and other important system tasks. However, because processes are now
    executed at thread granularity, this is no longer the case.


    The allproc list is defined in the <sys/proc.h> header as follows:


    ```

    extern struct proclist allproc;      /* list of all processes */

    ```'
