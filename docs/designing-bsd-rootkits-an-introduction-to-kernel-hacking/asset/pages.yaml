  md: '# 7.2.2 Finding Hidden Ports


    Recall from Chapter 3 that we hid an open TCP-based port by removing its inpcb
    structure from tcbinfo.listhead. Compare that with hiding a running process, which
    involves removing its proc structure from three lists and a hash table, as well
    as adjusting variables. Seems a little imbalanced, doesn''t it? The fact is, if
    you want to completely hide an open TCP-based port, you need to adjust one list
    (tcbinfo.listhead), two hash tables (tcbinfo.hashbase and tcbinfo.hashbase), and
    one variable (tcbinfo.ip_count). But there is one problem.


    When data arrives for an open TCP-based port, its associated inpcb structure is
    retrieved through tcbinfo.hashbase, not tcbinfo.listhead. In other words, if you
    remove an inpcb structure from tcbinfo.hashbase, the associated port is rendered
    useless (i.e., no one can connect or exchange data with it). Consequently, if
    you need to find every open TCP-based port on your system, you just need to iterate
    through tcbinfo.hashbase.


    # 7.3 Detecting Run-Time Kernel Memory Patching


    There are essentially two types of run-time kernel memory patching attacks: those
    that employ inline function hooks and those that don''t. I''ll discuss detecting
    each in turn.


    # 7.3.1 Finding Inline Function Hooks


    Finding an inline function hook is rather tedious, which also makes it somewhat
    difficult. You can install an inline function hook just anywhere, as long as there
    is enough room within the body of your target function, and you can use a variety
    of instructions to get the instruction pointer to point to a region of memory
    under your control. In other words, you don''t have to use the exact jump code
    presented in Section 5.6.1.


    What this means is that in order to detect an inline function hook you need to
    scan, more or less, the entire range of executable kernel memory and look through
    each unconditional jump instruction.


    In general, there are two ways to do this. You could look through each function,
    one at a time, to see if jump instructions pass control to a region of memory
    outside the function''s start and end addresses. Alternately, you could create
    a HIDS that works with executable kernel memory instead of files; that is, first
    scan your memory to establish a baseline and then periodically scan it again,
    looking for differences.


    # 7.3.2 Finding Code Byte Patches


    Finding a function that has its code patched is like looking for a needle in a
    haystack, except that you don''t know what the needle looks like. Your best bet
    is to create (or use) an HIDS that works with executable kernel memory.'
