  md: "```\n#define LIST_ENTRY(type) \\\nstruct {\n    struct type *le_next; /* next\
    \ element */\\\n    struct type **le_prev; /* address of previous element */\\\
    \nn}\n```\n\nThis structure is referenced during insertion, removal, and traversal\
    \ of the list.\n\n# 3.1.4 The LIST_FOREACH Macro\n\nA doubly-linked list is traversed\
    \ with the LIST_FOREACH macro.\n\n```\n#define LIST_FOREACH(var, head, field)\
    \ \\\nfor ((var) = LIST_FIRST(head)); \\\n    (var);\\\n    (var) = LIST_NEXT((var)))\
    \ \\\n```\n\nThis macro traverses the list referenced by head in the forward direction,\
    \ assigning each element to var. The field argument contains the structure declared\
    \ with the LIST_ENTRY macro.\n\n# 3.1.5 The LIST_REMOVE Macro\n\nAn element on\
    \ a doubly-linked list is decoupled with the LIST_REMOVE macro.\n\n```\n#define\
    \ LIST_REMOVE(elm, field) do { \\\nif (LIST_NEXT(elm, field) != NULL) \\\n   \
    \ LIST_NEXT(elm, field)->field->le_prev = \\\n    (elm)->field->le_prev;\\\n \
    \   *(elm)->field->le_prev = LIST_NEXT((elm), field); \\\n} while (0)\n```\n\n\
    Here elm is the element to be removed, and field contains the structure declared\
    \ with the LIST_ENTRY macro.\n\n# 3.2 Synchronization Issues\n\nAs you will see,\
    \ you can alter how the kernel perceives the operating system's state by manipulating\
    \ the various kernel queue data structures. However, you risk damaging the system\
    \ by simply traversing and/or modifying these by virtue of preemptive; that is,\
    \ if your code is interrupted and another thread accesses the same objects that\
    \ you were manipulating, data corruption can result. Moreover, with symmetric\
    \ multiprocessing (SMP), preemption isn't even necessary; if your code is running\
    \ on one CPU, while another thread on another CPU is manipulating the same object,\
    \ data corruption can occur."
