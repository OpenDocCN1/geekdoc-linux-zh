  md: 'First, notice how the first 15 bytes of hello are actually data; to be exact,
    these bytes make the string Hello, world!\nThe actual assembly instructions don''t
    start until offset 15. This is why the unconditional jump code, which overwrites
    mkdir, is set to add + 0xf.


    Second, note hello''s final three instructions. The first zeros out the %ax register,
    the second cleans up the stack, and the last restores the %eb register. This is
    done so that when mkdir actually begins executing, it''s as if the hook never
    happened.


    The following output shows mkdir_patch in action:


    ```

    $ gcc -o mkdir_patch mkdir_patch.c -lkvm\n$ sudo ./mkdir_patch\n$ mkdir TESTING\nHello,
    world!\n$ ls -F\nTESTING/          mkdir_patch* mkdir_patch.c

    ```


    # 5.6.2 Gotchas


    Because mkdir_patch.c is a simple example, it fails to reveal some typical gotchas
    associated with inline function hooking.


    First, by placing an unconditional jump within the body of a function, whose behavior
    you intend to preserve, there is a good chance you''ll cause a kernel panic. This
    is because the unconditional jump code requires the use of a general-purpose register;
    however, it is likely that within the body of a function, all the general-purpose
    registers will be in use. To get around this, push the register you are going
    to use onto the stack before jumping, and pop it off later.


    Second, if you copy a call or jump statement as it is and place it into a different
    region of memory, you cannot execute it as is; you have to adjust its operand
    to be relative. This is because a call or jump statement''s machine code operand
    is a relative address.


    Finally, it''s possible for your code to be preempted while patching, and during
    that time in its incomplete state. Therefore, if possible, you should avoid patching
    with multiple writes.


    # 5.7 Cloaking System Call Hooks


    Before concluding this chapter, let''s take a brief look at a nontrivial application
    for run-kernel memory patching: cloaking system call hooks. That is, implementing
    a system call hook without patching the system call table or any system call function.
    This is achieved by patching the system call dispatcher with an inline function
    hook so it references a Trojan system call table instead of the original. This
    renders the original table frictionless, but maintains its integrity, enabling
    the Trojan table to direct system call requests to any handler you like.'
