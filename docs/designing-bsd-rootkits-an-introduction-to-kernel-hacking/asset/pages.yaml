  md: 'An interesting detail about process_hiding is that prior to process name comparison,
    I examine each process''s virtual address space and process flags. If the former
    does not exist or the latter is set to ''working on exiting'' and skipped over.
    What''s the point of hiding a process that''s not going to run?


    Another detail worth mentioning is that after I remove the user-specified proc
    structure from the allproc list, the for loop has no break statement. To understand
    why, consider a process that has duplicated or forked itself so the parent and
    child can execute different sections of code at the same time (This is a popular
    practice in network servers, such as http.) In this situation, asking for a list
    of running processes would return both the parent and child processes, because
    each process gets its own individual entry in the allproc list. Therefore, in
    order to hide every instance of a single process, you need to iterate through
    allproc in entirety.


