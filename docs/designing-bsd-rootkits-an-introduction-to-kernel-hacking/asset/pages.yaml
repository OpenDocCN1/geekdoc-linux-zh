  md: '# # LOADABLE KERNEL MODULES


    ![](img/bfd792ec0e2d264dd5185dbb1d3a3b80_20_0.png)


    The simplest way to introduce code into a running kernel is through a loadable
    kernel module (LKM), which is a kernel subsystem that can be loaded and unloaded
    after bootup, allowing a system administrator to dynamically add and remove functionality
    from a live system. This makes LKMs an ideal platform for kernel-mode rootkits.
    In fact, the vast majority of modern rootkits are simply LKMs.


    NOTE In FreeBSD 3.0, substantial changes were made to the kernel module subsystem,
    and the LKM Facility was renamed the Dynamic Kernel Linker (KLD) Facility. Subsequently,
    the term KLD is commonly used to describe LKMs under FreeBSD.


    In this chapter we''ll discuss LKM (that is, KLD) programming within FreeBSD for
    programmers new to kernel hacking.'
  merge: -1
  pgno: 20
- img_proc: true
  md: "NOTE Throughout this book, the terms device driver, KLD, LKM, loadable module,\
    \ and module are all used interchangeably.\n\n# 1.1 Module Event Handler\n\nWhenever\
    \ a KLD is loaded into or unloaded from the kernel, a function known as the module\
    \ event handler is called. This function handles the initialization and shutdown\
    \ routines for the KLD. Every KLD must include an event handler.¹ The prototype\
    \ for the event handler function is defined in the <sys/module.h> header as follows:\n\
    \n```\ntypedef int (*modeventype_t)(module_t, int *modeventype_t /*, void *);\n\
    ```\n\nwhere module_t is a pointer to a module structure and modeventype_t is\
    \ defined in the <sys/module.h> header as follows:\n\n```\ntypedef enum modeventype\
    \ {\n    MOD_LOAD,         /* Set when module is loaded. */\n    MOD_UNLOAD, \
    \      /* Set when module is unloaded. */\n    MOD_SHUTDOWN,     /* Set on shutdown.\
    \ */\n    MOD_QUIESCE,      /* Set on quiescence. */\n} modeventype_t;\n```\n\n\
    Here is an example of an event handler function:\n\n```\nstatic int\nload(struct\
    \ module *module, int cmd, void *arg)\n{\n    int error = 0;\n\n    switch (cmd)\
    \ {\n        case MOD_LOAD:\n            printf(\"Hello, world!\\n\");\n     \
    \       break;\n        case MOD_UNLOAD:\n            printf(\"Good-bye, cruel\
    \ world!\\n\");\n            break;\n        default:\n            error = EOPNOTSUPP;\n\
    \            break;\n    }\n\n    return(error);\n}\n```\n\n> ¹ Actually, this\
    \ isn't entirely true. You can have a KLD that just includes a sysctl. You can\
    \ also dispense with module handlers if you wish and just use SYSINT and SYSUNINIT\
    \ directly to register functions to be invoked on load and unload, respectively.\
    \ You can't, however, indicate failure in those.\n\nChapter 1"
  merge: -1
  pgno: 21
- img_proc: true
  md: "This function will print \"Hello, world!\" when the module loads, Good-bye,\
    \ cruel world! when it unloads, and will return with an error (EOPNOTTSUPP)² on\
    \ shutdown and quiescence.\n\n# 1.2 The DECLARE_MODULE Macro\n\nWhen the KLD is\
    \ loaded (by the kload(8) command, described in Section 1.3), it must link and\
    \ register itself with the kernel. This can be easily accomplished by calling\
    \ the DECLARE_MODULE macro, which is defined in the <sys/module.h> header as follows:\n\
    \n```\n#define DECLARE_MODULE(name, data, sub, order) \\\\\n    MODULE_METADATA(md,\
    \ MDT_MODULE, &data, #name); \\\\\n    SYSINIT(name##sub, sub, order, module_register_init,\
    \ &data) \\\\\n    struct _hack\n```\n\nHere is a brief description of each:\n\
    \nname\n\nThis specifies the generic module name, which is passed as a character\
    \ string.\n\ndata\n\nThis parameter specifies the official module name and event\
    \ handler function, which is passed as a moduleledata structure. struct modulated\
    \ is defined in the <sys/module.h> header as follows:\n\n```\nypedef struct modulated\
    \ {\n    const char *name;          /* module name */\n    meventhandler_t evanhand;\
    \  /* event handler */\n    void *priv;                 /* extra data */\n} modulatedata_t;\n\
    ```\n\nsub\n\nThis specifies the system startup interface, which identifies the\
    \ module type. Valid entries for this parameter can be found in the <sys/kernel.h>\
    \ header within the sysinit_sub enumeration list.\n\nFor our purposes, we'll always\
    \ set this parameter to SI_SUB_DRIVERS, which is used when registering a device\
    \ driver.\n\norder\n\nThis specifies the KLD's order of initialization within\
    \ the subsystem. You'll find valid entries for this parameter in the <sys/kernel.h>\
    \ header within the sysinit_elem_order enumeration list.\n\nFor our purposes,\
    \ we'll always set this parameter to SI_ORDER_MIDDLE, which will initialize the\
    \ KLD somewhere in the module.\n\n> ² EOPNOTTSUPP stands for Error: Operation\
    \ not supported."
  merge: -1
  pgno: 22
- img_proc: true
  md: "# 1.3 \"Hello, world!\"\n\nYou now know enough to write your first KLD. Listing\
    \ 1-1 is a complete\nn“Hello, world!” module.\n\n```\n#include <sys/param.h>\n\
    #include <sys/module.h>\n#include <sys/kernel.h>\n#include <sys/system.h>\n\n\
    /* The function called at load/unload. */\nstatic int\nload(struct module *module,\
    \ int cmd, void *arg)\n{\n    int error = 0;\n    switch (cmd) {\n        case\
    \ MOD_LOAD:\n            printf(\"Hello, world!\\n\");\n            break;\n \
    \       case MOD_UNLOAD:\n            printf(\"Good-bye, cruel world!\\n\");\n\
    \            break;\n        default:\n            error = EOPNOTSUPP;\n     \
    \       break;\n    }\n    return(error);\n}\n/* The second argument of DECLARE_MODULE.\
    \ */\nstatic moduledata_t hello_mod = {\n    \"hello\",\n    load,\n    /* module\
    \ name */\n    /* event handler */\n    NULL /* extra data */\n};\nnDECLARE_MODULE(hello,\
    \ hello_mod, SI_SUB_DRIVERS, SI_ORDER_MIDDLE);\n```\n\nListing 1-1: hello.c\n\n\
    As you can see, this module is simply a combination of the sample event\nhandler\
