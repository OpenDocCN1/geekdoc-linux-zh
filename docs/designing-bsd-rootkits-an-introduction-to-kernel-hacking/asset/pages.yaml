    # 3.5 Hiding with DKOM


    As you''ve seen, the main challenge to overcome hiding an object with DKOM is
    removing all references to your object in the kernel. The best way to do so is
    to look through and mimic the source code of the object''s function(s), which
    are designed to remove all references to the object. For instance, to identify
    all the data structures that reference a running process, refer to the _exit(2)
    system call function, which is implemented in the file /sys/kern/kern_exit.c.


    > Because sorting unfamiliar kernel code is never quick and easy, I didn''t dump
    the source for _exit(2) at the beginning of Section 3.3, when I first discussed
    hiding a running process.


    At this point, you should know enough to be able to go through _exit(2) on your
    own. Still, here are the remaining objects you need to patch in order to hide
    a running process:


    +   - The parent process'' child

    - The parent process'' process-group

    - The nprocs variable'
