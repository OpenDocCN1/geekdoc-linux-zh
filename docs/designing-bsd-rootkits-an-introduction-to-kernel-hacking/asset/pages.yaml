  md: '# # 4

    KERNEL OBJECT HOOKING


    ![](img/bfd792ec0e2d264dd5185dbb1d3a3b80_78_0.png)


    In the previous chapter we covered subverting the FreeBSD kernel using simple
    data-state changes. The discussion centered around modifying the data contained
    within the kernel queue data structures. In addition to record keeping, many of
    these structures are also directly involved in control flow, as they maintain
    a limited number of entry points into the kernel. Consequently, these can be hooked,
    too, just like the entry points discussed in Chapter 2. This technique referred
    to as Kernel Object Hooking (KOH). To demonstrate it, let''s hook a character
    device.


    # ## 4.1 Hooking a Character Device


    Recall from Chapter 1 that a character device is defined by its entries in a character
