    # 3.7 Corrupting Kernel Data


    Before I conclude this chapter, let''s consider the following: What happens when
    one of your hidden objects is found and killed?

    In the best case scenario, nothing. In the worst case scenario, the kernel panics
    when an object is killed, the kernel unconditionally removes it from its various
    lists. However, in this situation, the object has already been removed. Therefore,
    the kernel will fail to find it, and will walk off the end of its lists, corrupting
    that data structures in the process.'
