  md: '# 2.7 Concluding Remarks


    As you can see, calling hook is really all about redirecting function pointers,
    and at this point, you should have no trouble doing that.


    Keep in mind that there are usually a few different entry points you could hook
    in order to accomplish a specific task. For example, in Section 2.2 I created
    a keystroke logger by hooking the read system call; however, this can also be
    accomplished by hooking the l_read entry point in the terminal line discipline
    (termios)⁴ switch table.


    For educational purposes and just for fun, I encourage you to try to hook the
    l_read entry point in the termios switch table. To do so, you''ll need to be familiar
    with the lines[] switch table, which is implemented in the file /sys/kern/tty_conf.c,
    as well as struct linew, which is defined in the <sys/linedisc.h> header.


    NOTE This hook entails a bit more work than the ones shown throughout this chapter.


    > ⁴ The terminal line discipline (termios) is essentially the data structure used
