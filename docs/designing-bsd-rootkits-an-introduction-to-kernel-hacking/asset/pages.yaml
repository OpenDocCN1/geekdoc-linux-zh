    As you might have guessed, in order to modify a character device’s switch table,
    you have to go through cdev_list. Listing 4-1 shows an example. This code traverses
    cdev_list, looking for cd_example; if it finds it, cd_example’s read entry is
    replaced with a simple call hook.


    ```

    #include <sys/param.h>

    #include <sys/proc.h>

    #include <sys/module.h>

    ```


    cd_example is the character device developed in Section 1.6.4.'
