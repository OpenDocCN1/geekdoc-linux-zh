  md: "arguments via uap, you are actually working by value, reference. This means\
    \ that with this approach, you aren't to modify the actual arguments.\n\nNOTE\
    \ In Section 1.5, I'll detail how to modify data residing in user space while\
    \ in kernel space.\n\nIt is probably of size mentioning that the kernel expects\
    \ each system call argument to be register_t (which is an int on i386, but is\
    \ typically a long on other platforms) and that it builds an array of register_t\
    \ values that are then cast to void * and passed as the arguments. For this reason,\
    \ you might need to include padding in your arguments' structure to make it work\
    \ correctly if it has any types that aren't of size register_t (e.g., char, or\
    \ on a 64-bit platform). The <sys/systproto.h> header provides some macros to\
    \ do this, with examples.\n\n# 1.4.2 The sysent Structure\n\nSystem calls are\
    \ defined by their entries in a sysent structure, which is defined in the <sys/sysent.h>\
    \ header as follows:\n\n```\nstruct sysent {\n    int sy_narg;               \
    \ /* number of arguments *\n    sys_call *sy_sccall;      /* implementing function\
    \ *\n    au_event_t sy_auevent;     /* audit event associated with system call\
    \ */\n};\n```\n\nHere is the complete sysent structure for the example system\
    \ call (shown in Section 1.4.1):\n\n```\nstatic struct sysent sc_example_sysent\
    \ = {\n    1,                          /* number of arguments *\n    sc_example\
    \                  /* implementing function *\n};\n```\n\nRecall the example system\
    \ call has only one argument (a character pointer) and is named sc_example.\n\n\
    One additional point is also worth mentioning. In FreeBSD, the system call table\
    \ is simply an array of sysent structures, and it is declared in the <sys/sysent.h>\
    \ header as follows:\n\n```\nextern struct sysent[];\n```\n\nWhenever a system\
    \ call is installed, its sysent structure is placed within an open element in\
    \ sysent(). (This is an important point that will come into Chapters 2 and 6).\n\
    \nNOTE Throughout this book, I'll refer to FreeBSD's system call table as sysent]."
