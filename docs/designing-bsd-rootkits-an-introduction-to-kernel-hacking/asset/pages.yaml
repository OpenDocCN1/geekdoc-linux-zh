    # 2.3 Kernel Process Tracing


    Kernel process tracing is a diagnostic and debugging technique used to intercept
    and record each kernel operation—that is, every system call, namesake, I/O, signal
    process, and context switch performed on behalf of a specific running process.
    In FreeBSD, this is done with ktrace(1) and kdump(1) utilities. For example:


    ```

    $ ktrace ls

    file1 file2 ktrace.out

    $ kdump

    517 ktrace RET ktrace 0

    ```


