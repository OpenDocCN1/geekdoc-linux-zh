  md: "# 7.1 Detecting Call Hooks\n\nAs stated in Chapter 2, call hooking is really\
    \ about redirecting function pointers. Therefore, to detect a call hook, you simply\
    \ need to determine whether or not function pointer still points to its original\
    \ function. For example, you can determine if the mdir system call has been hooked\
    \ by checking its system structure sys_call member. If it points to any function\
    \ other than mdir, you've got yourself a call hook.\n\n# 7.1.1 Finding System\
    \ Call Hooks\n\nListing 7-1 is a simple program designed to find (and uninstall)\
    \ system call hooks. This program is invoked with two parameters: the name of\
    \ the system call to check and its corresponding system call number. It also has\
    \ an optional third parameter, the string \"fix\", which restores the original\
    \ system call function if a hook is found.\n\n> NOTE The following program is\
    \ actually checkcall.c; I have made some minor changes so that it compiles cleanly\
    \ under FreeBSD 6. I also also made some cosmetic changes so that it looks better\
    \ in print.\n\n```\n#include <fcntl.h>\n#include <kvm.h>\n#include <limits.h>\n\
    #include <nlist.h>\n#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\n\
    #include <sys/types.h>\n#include <sys/sysent.h>\n\nvoid usage();\n\nint\nmain(int\
    \ argc, char *argv[])\n{\n    char errbuf[POSIX2_LINE_MAX];\n    kvm_t *kd;\n\
    \    struct nlist nl[] = { { NULL }, { NULL }, { NULL }, NULL };\n\n    unsigned\
    \ long addr;\n    int callname;\n    struct sysent call;\n\n    /* Check arguments.\
    \ */\n    if (argc < 3) {\n        usage();\n        exit(-1);\n    }\n\n    nl[0].n_name\
    \ = \"sysent\";\n    nl[1].n_name = argv[1];\n```"
