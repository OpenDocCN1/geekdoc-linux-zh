    +   - Do nothing. If your hidden objects are never found, they can never be killed—right?


    # 3.8 Concluding Remarks


    DKOM is one of the hardest rootkit techniques to detect. By patching the objects
    the kernel relies upon for its bookkeeping and reporting, you can produce desirable
    results while leaving an extremely small footprint. For example, in this chapter
    I''ve shown how to hide a running process and an open port using a few simple
    modifications.


