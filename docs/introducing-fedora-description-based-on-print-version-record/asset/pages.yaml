  md: '# CHAPTER 2


    # # BEFORE YOU INSTALL

    FEDORA


    You''ve made the decision. After hearing about this operating system known as
    Fedora from friends, family, or maybe the IT staff down at the office, you are
    going to try it out for yourself.


    But installing an operating system is not as simple as installing an application
    like Photoshop or Firefox. While the Fedora developers have made the process as
    painless as possible, there''s no getting around the fact that putting a new operating
    system on a PC is not something that should be taken lightly. Unless you just
    bought the computer at the store and took it out of its box, there will be existing
    data on the machine that you will want to save.


    Also, while Fedora is ultimately safer and faster than a Windows-based operating
    system, some upfront planning (discussed later in this chapter) is required to
    ensure that the installation process goes smoothly.


    In this chapter, you''ll do all the fact-finding and planning needed to successfully
    pull off your own installation of Fedora. Specifically, you will:


    +   - Learn about the different versions of Fedora, called spins, and decide which
    is best for you.


    +   - Discover how to obtain a copy of Fedora for yourself.


    +   - Gather information about your computer to assess how well it will run with
    Fedora.


    +   - Prepare your system for single or multiple operating systems.'
