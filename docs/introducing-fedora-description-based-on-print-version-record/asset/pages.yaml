    the blocks are welded into one monster piece. Other blocks can connect to this
    kernel, but only in very specific ways. (In fact, to really play up the analogy,
    in Linux the blocks can be any color or shape you want; in Windows the blocks
    are all the same shades and very similar in shape.)


    In Linux, individual “blocks” are small, and you never use them all at the same
    time. In Windows, however, individual “blocks” are larger and often used in groups.
    This difference in structure quickly reveals one of the more significant benefits
    of Linux over Windows: Linux doesn’t need as many machine resources as Windows
    to run efficiently. In fact, Linux runs very on PCs that Windows would just sputter
    on.


    Nowhere is this difference more apparent than with the newest Windows operating
