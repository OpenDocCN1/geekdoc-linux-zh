  md: '# Chapter 16 ■ Analyzing with Calc


    Agreement on timekeeping is still a hot issue in international circles. While
    most countries have adopted the Gregorian calendar for trade purposes, many countries
    still have their own calendars and dates. And, to make it more confusing, dates
    displayed from the same calendar can be shown in different ways. In the U.S.,
    4/27/10 translates to 27.4.10 to Europe.


    Calc takes this all in stride and lets you choose your preferred method of displaying
    dates and times—at least based on the Gregorian calendar. These steps show how
    to modify the format of date and time values within a spreadsheet.


    +   1. Enter your date of birth into an empty cell within any open Calc document.
    Use any number-based format.


    +   2. Select the cell.


    +   3. Choose Format | Cells.


    +   4. In the Format Cells dialog box, click the Numbers tab.


    +   5. Select Date in the Category list.


    +   6. Select the Friday, December 31, 1999 option in the Format list. In the
    Preview window, you can see the day of the week on which you were born.


    +   7. To convert the date to an hour-based format, select Time in the Category
    list.


    +   8. Select the 876613:37:00 option in the Format list.


    +   9. Click OK. Now you can see the number of hours, minutes, and seconds that
    have passed between Midnight, January 1, 1900 and your birthday.


    # Formatting Currency


    Now for the nitty-gritty stuff. What do accountants, the originators of sheets,
    count most of all?


    Money.


    The next steps show how Calc not only formats currency values, but also does so
    in a very cosmopolitan manner.'
