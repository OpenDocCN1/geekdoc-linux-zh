    had the same problem (or worse) with the last version of Windows, Vista.


    # Security


    Another big difference in the two operating systems’ makeup is in their security.
    It is a documented fact that there are tens of thousands of Windows viruses, Trojans,
    and worms out there: a veritable zoo of malicious software designed to cause damage
    to your data, copy it for others to abuse, or even take over your computer so
    it can be used to attack other computers. On the other hand, there are only 500
    known Linux viruses, and none of them has ever loose in the wild on the massive
