- img_proc: true
  md: '# Chapter 3 ■ Installing Fedora


    # Back Up Your Data


    As stated in Chapter 2, before you use any tool to manipulate or create partitions,
    back up or save your data to an alternate physical drive. And definitely back
    up everything if you plan to completely replace Windows with Fedora. Please.


    # Partitions Fedora Will Need


    When Fedora is installed, it uses an seven-step application known as Anaconda
    to accomplish the task. When Anaconda detects another operating system on your
    computer, it will ask you whether you want to replace the contents of your entire
    hard drive or perform a partition operation.


    This is the choice point that will determine if you have a single Fedora operating
    system on your computer or multiple ones (Fedora and Windows). The mechanics of
    how to go through this procedure will be outlined in the "Partition Settings"
    section later in this chapter. For now, there are recommendations that should
    be passed on to new Fedora users.


    In Fedora systems, the file system is oriented toward a key root directory that
    is based on the drive letter of the hard drive. For most primary drives, drive
    letter is "C," so the root directory in Windows is denoted as C:\. Other drives
    have root directories (D:\, E:\, etc.), too. The root directories are always tied
    to the physical drive or partition, and all the subdirectories (or subfolders
    as they''re called in Windows) are directly descended from the root directory
    on the same physical drive. C:\Documents and Settings\Brian\My Documents will
    always be located on the primary (C:) drive or partition.


    The file systems in Fedora are a bit more flexible. For instance, the common path
    for a user''s home directory is /home/<username>. The "home" is a subdirectory
    of the root folder, which is denoted in Linux-based systems as "/". So, in the
    author''s case, the home directory might be /home/bproffitt. Here''s the default
    directory structure for a Fedora machine.


    ```


    /bin

    /boot

    /dev

    /etc

    /home

    /lib

    ```'
