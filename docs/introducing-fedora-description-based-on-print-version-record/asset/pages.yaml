  md: '# Chapter 9 Basic File Management


    file. Other characters indicate it is a special type of file. After that letter,
    the permissions come. There are three groups of three letters.


    Although detailed information on permissions is beyond the scope of this book,
    “r” stands for “read,” which means—depending on which group the “r” appears—that
    the owner, group, or anyone can read or view that file. A “w” stands for “write”
    and means—depending on which group the “w” appears—that the owner, group, or anyone
    can write or change that file. And lastly, an “x” stands for “execute” and means—depending
    on which group the “w” appears—that the owner, group, or anyone can write or change
    that file.


    The first set is the permissions given to the owner of the file. The next set
    of three is for the group of the file, and finally the permissions for everyone
    else. You''ll see the owner of the file, followed by the group to which the file
    belongs. By default, the size of each file is displayed in bytes. Next in the
    listing, you''ll see the last time the file was modified, or touched, and then
    the name of the file itself, as shown in this excerpt:


    ```

    total 15244

    drwxr-xr-x 43 username users 4096 2007-05-03 19:03 .

    drwxr-xr-x 4 root 4096 2007-01-20 22:15 ...

