    # Forms to Fill Out


    You have created the heart of the database by making the table. You could stop
    right now and enter data to your heart’s content. But, after a while, it might
    become difficult to enter data in a monotonous way.


    So take the next step and create a form to enter your material.


    +   1. Click the Forms object in the Database pane. The Base window will display
    form-oriented functions and objects.

    2. Click Use Wizard to Create Form in the Tasks pane. The Form Wizard dialog box
    and the Form Design view of Writer will open (see Figure 18.12).'
