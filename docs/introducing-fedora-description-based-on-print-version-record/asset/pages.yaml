    Figure 10.4

    A blank tab.


    Tabs can also be moved around and put in whatever order you prefer. Simply click
    a tab and drag and drop the tab in the new position, which will be indicated by
    a miniature preview of the screen and a small arrow in the Tab bar as you move
    the mouse pointer (see Figure 10.5).


    # More Tab Tricks


