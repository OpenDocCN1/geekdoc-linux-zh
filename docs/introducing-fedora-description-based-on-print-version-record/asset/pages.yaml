  md: '# Setting Up User Accounts


    When you first installed Fedora, two user accounts were created: the administrator
    (root) and your own. Root is the name of Fedora’s “super” account. Like all Linux
    distributions, the root user account is the most powerful—and the most dangerous.
    That’s because root literally do anything possible on a Fedora machine. This is
    very, very helpful if you are trying to accomplish a lot of administrative tasks
    quickly and don’t want to keep typing the administrative password. But it’s very,
    very bad if you make a mistake and accidentally end up deleting a critical file
    on your system.


    Not to mention what could happen if you walked away from a machine logged in root
    and someone happened to walk by and decided to play with your computer. Or hack
    into it from the outside, no matter where you are.


    # Another Warning About Root


    +   - Don’t log in to your PC as root. Ever.


    The account you created when you installed Fedora has some administrative capabilities
    by virtue of the fact that the original, installing user of a system is going
    to be the one administering it. There are times, however, when the user who installed
    Fedora is not the administrator, or you simply want multiple user accounts, each
    with its own workspace. If that’s the case, you need to know how to set up a new
    account. To do so, follow these steps:


    +   - Click on the System | Administration | User and Groups menu command. After
    entering your administrative password, the User Manager window will open, as shown
    in Figure 7.1.


    +   - Click on the Add User button. The Add New User dialog box will open (see
    Figure 7.2).


    +   - Using the user’s information, fill in the information in the top section
    of the Add New User dialog box.


    +   - Confirm that the Create Home Directory and Create a Private Group for the
    User options are selected.


    +   - Click OK. The new user will be added to the User Manager (see Figure 7.3).'
