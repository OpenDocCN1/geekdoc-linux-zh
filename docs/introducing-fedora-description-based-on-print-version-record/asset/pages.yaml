- img_proc: true
  md: '# CHAPTER 16


    # ANALYZINGnWITH CALC


    Accountants aren’t the only ones using spreadsheets these days. With online banking,
    online trading, and online loan applications available to the average consumer,
    more and more people use spreadsheets to track their rapidly changing finances.


    This new demand, coupled with the already present needs of the business world
    for clearer, faster reporting, Calc delivers the spreadsheet power you need to
    your Fedora desktop. This component of OpenOffice.org delivers many of the same
    functions found in Microsoft Excel or Lotus 1-23 and maintains interoperability
    with the rest of OpenOffice.org.


    In this chapter, you will learn about:


    +   - The basics of spreadsheets and Calc


    +   - Formatting data in Calc


    +   - Building basic spreadsheets


    # A Spreadsheet Primer


    You have likely used a spreadsheet before, at one time or another. Many spreadsheet
    users, however, often do not create or modify the basic workings of'
  merge: -1
  pgno: 352
- img_proc: true
  md: '# Chapter 16  Analyzing with Calc


    the spreadsheets they use. They just plug in the numbers and print the assigned
    reports like they’re supposed to.


    There comes a time in computer users’ lives when they need to create a spreadsheet-for
    themselves. At that time, it’s a good idea to know how these spreadsheet doodads
    work.


    It all comes down, more or less, to cells. A familiar type of cell is the basic
    building block of your body. There are many different types of cells: muscle cells,
    skin cells, liver cells—the list goes on and on. But no what kind of cell you
    look at, they all have pretty much the same basic structure: nucleus, plasma,
    cell wall, mitochondria, and other hard-to-pronounce components. Even though they
    have the same overall structure, cells can have vastly different jobs because
    of the specialized way they have been put together.


    The same theory applies to spreadsheet cells. They are all rectangular, and they
    all can contain data. But each cell in a spreadsheet can have a different type.
    One may sit empty, filled in with an attractive shade of purple. Another cell
    may contain the number 42. Still another may contain a formula that refers to
    the number 42 in another cell and displays something completely different.


    Cells are all the same, but they can be used in many different ways.


    Cells are typically positioned and referred to rows and columns. By universal
    convention, spreadsheet rows are denoted with numbers, and columns are denoted
    with letters. Because spreadsheets sometimes need more than 26 columns, the columns
    after the letter Z move to a two-letter notation (AA, AB, AC, and so on). This
    lettering convention continues to column IV, which makes 256 the maximum number
    of columns a Calc spreadsheet can have. A spreadsheet can contain 65,536 rows,
    giving you the potential to fill 16,777,216 cells. With over 16 million cells
    to fill, you probably won’t run out of space to perform the needed calculations,
    unless, maybe, work for NASA.


    You identify cells by their row and column position in the spreadsheet. Cell that
    four rows down and eight columns across is identified as cell H4. The cell reference
    by looking at the bold column or reading the coordinates (C4) from the Name Box
    field in the Formula Bar, as seen in Figure 16.1.


    Multiple cells are called ranges. An inverted color denotes a selected range of
    cells. The coordinates of a range include the cell in the upper-left corner of
    the'
  merge: -1
