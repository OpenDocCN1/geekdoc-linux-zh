  md: '# Chapter 14 ■ Working with Windows


    ask yourself this: When have you ever installed Windows on a machine? If you''re
    like most people, you have purchased a machine that already has Windows installed
    on it—you never had deal with installation.


    Installing Windows is a lot like Linux: you set the disc in the drive and boot
    the machine to begin the installation process. In this case, the machine we will
    boot be a virtual one.


    # Get the Right Windows


