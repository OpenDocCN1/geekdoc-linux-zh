  md: '# Command-Line File Management


    One of the best benefits of Linux is the power and simplicity to be found in the
    command line. Even if you plan to spend most of your time in GNOME or one of Fedora''s
    other GUIs, you will find using these file management commands in Terminal very
    useful.


    Are the solutions in this section easier than using Nautilus? In some respects,
    no, especially if you are used to using GUI-based file managers. The command line
    offers a lot of flexibility and power: try out these examples and see if they
    fit your work style.


    # Copying Files: The cp Command


    The cp command is similar to the MS-DOS command copy; it''s used to copy files
    or directories from one place to another. You can copy one file to a new file,
    one file to another place, or a large number of files all at once to a new place.
    When you copy a file, you do not delete the original file by default. If you want
    to move a file rather than make a copy of it, use the mv command instead.


    To use the cp command, type cp, followed by any options, and then type the directory
    or filename(s) you want to copy, followed by the destination. If you want to copy
    multiple files, you can use a wildcard character (which can stand for any character),
    or you can list multiple files separated by spaces.


    Table 9.1 lists some of the available options for the cp command.


    Let''s say that you download a .zip file called program.zip into your home directory,
    and you want to unzip it, but you don''t want to do it in your home directory.
    You can cp the file into the /tmp directory and work with it there. To do this,
    type in the following:


    ```

    cp program.zip /tmp

    ```


    Note that you do not get an error message if the file already exists, unless you
    use the interactive option. If the file exists, you are asked whether you want
    to overwrite the file or not, like this:


    ```

    cp -i program.zip /tmp

    cp: overwrite /tmp/program.zip?

    ```


    If you answer y, the file is overwritten; if n, the file is not overwritten.'
  merge: -1
  pgno: 191
- img_proc: true
  md: '# Command-Line File Management 175


    | Table 9.1 cp Command Options |

    | Option | Name | Description |

    | -f | Force | Removes any existing files of the same name. |

    | -i | Interactive | Prompts the user if there is an existing file of the same
    name in the destination directory. |

    | -p | Preserve | Tells the cp command to preserve the original file''s permission,
    ownership, and timestamp data, if possible. |

    | -R, -r | Recursive | Copies directories located under the starting directory.
    The default is not to copy subdirectories. |


    If you have a group of files you want to move into another directory without having
    to type each filename individually, you can use wildcards. If you want to copy
    all files in the current directory to another directory, type:


    ```

    cp * /tmp

    ```


    This copies all files in the directory to the /tmp directory; however, it does
    not copy directories unless specifically told to. To copy files and directories,
    use the recursive option.


    ```

    cp -R /tmp

    ```


    If you''d to copy all files with a specific extension to another directory, you
    can use wildcards to selectively copy groups of files like this:


    ```

    cp *.jpg *.gif images

    ```


    This copies all JPEG and GIF files to the images directory without copying any
    other files with them. You can also use the question mark character (?) to match
    a single character rather than a group of characters.


    # Moving Files: The mv Command


    The mv command can be used to move a file or files to another directory, or to
    rename a file or files. The mv command is similar to the move command under'
  merge: -1
  pgno: 192
- img_proc: true
  md: '# Chapter 9 = Basic File Management


    MS-DOS, but the mv command is much more powerful than its MS-DOS equivalent. The
    mv command does delete the original file that is being moved, so be sure to use
    the command carefully. The mv command is also used to rename files in Fedora,
    so it also takes the place of the REN command under MS-DOS.


    To move a file, type mv, followed by any options, then the name of the file(s)
    or directories to be moved, and then the destination to which you want the file(s)
    moved. As with the cp command, you can use wildcards to move multiple files rather
    than typing individual filenames.


    Table 9.2 lists some of the available options for the mv command.


    To move the file index.html to another directory without making a backup or being
    prompted in the event of an overwrite, use the mv command, followed by the name
    of the file and its destination (where username is your login name):


    mv index.html /home/username/backup/


    | Table 9.2 mv Command Options |

    | Option | Name | Description |

    | - | - | - |

    | -b | Backup | Creates a backup file of any files that would be overwritten by
    moving a file. By default, backup files have a tilde character (-) extension.
    |

    | -f | Force | When trying to move a file, removes any files of the same name
    without prompting the user. |

    | -i | Interactive | Prompts the user if the current file will overwrite another
    file. If there are no conflicting files, mv simply moves the file with no complaint.
    |

    | -S | Suffix | Appends a suffix to any backup files. By default, the tilde suffix
    is applied, but you can specify any type of suffix, such as .bak or .tmp. |'
  merge: -1
  pgno: 193
- img_proc: true
  md: '# Command-Line File Management


    If you''re not certain whether a file of the same name already exists, use the
    interactive mode of mv. If the file already exists, your output looks like this:


    ```

    mv -i index.html /home/username/backup/

    mv: replace /home/username/backup/index.html?''

    ```


    You can use wildcards to move more than one file to another. Be careful! The mv
    command can move directories as well as regular files. Be sure you actually want
    to move everything under a directory before using the wildcard (*).


    If you want to move all of the .html files in the current directory to the /home/httpd
    directory, you can use this command:


    ```

    mv *.html /home/httpd/

    ```


    The *.html specifies that you want to move all files that end in .html to another
    directory. You want to move all files in the current directory to the /home/httpd/
    directory, you type:


    ```

    mv * /home/httpd/

    ```


    Fedora does not have a separate rename command, so the mv command is used to rename
    files. If you want to rename index.html to index.html.old, for instance, use the
    mv command like this:


    ```

    mv index.html index.html.old

    ```


    As far as Fedora is concerned, moving a file and renaming it are the same thing.


    # Creating Directories: The mkdir Command


    The mkdir command is pretty straightforward. It behaves the same way that the
    MS-DOS command MKDIR works. The Fedora command has some additional functionality—you
    can set the permissions of the directory when it is created.


    To create a new directory, simply mkdir and any options and then the name of the
    directory you want to create.


    Table 9.3 lists some of the options for the mkdir command.


    To create a new directory html under the current directory, use the mkdir command
    followed by the name of the new directory:


    ```

    mkdir html

    ```'
