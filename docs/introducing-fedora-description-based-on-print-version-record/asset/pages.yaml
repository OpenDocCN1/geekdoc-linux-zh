  md: '# What Is Linux?


    You might be asking yourself, why bother with a history lesson? No one kicks off
    a book on how to use Windows or Mac OS X with a detailed biography of Bill Gates
    or Steve Jobs. In this case, to understand the origins of Fedora is to understand
    the functionality of Fedora itself.


    Besides, it''s a good story, which you can read while you''re installing Fedora
    on your own PC.


    # A Brief History of Linux


    The beginnings of Fedora actually began in Helsinki, Finland. It was there, in
    1991, a young computer science student at the University of Helsinki put the word
    out to an online newsgroup asking for input on a new operating system he was building
    for his home PC: a copy of the Minix operating system that, then, could only be
    run on big, high-end machines.


    That was in August. By the next month, the first version was released with no
    public announcement; only the group working with the system was privy to the release.
    On October 5, 1991, version 0.02 of the brand-new code was publicly announced.
    The rest, as they say, is history. The student, Linus Torvalds, based his master''s
    thesis on the project, now dubbed Linux.


    By the end of the decade, Linux was found on thousands of computers around the
    world, most notably the operating system on which most Web site software runs.
    Current estimates show anywhere from 70–80 percent of the world''s Web sites run
    on top of some version of Linux. Linus himself serves as project manager for the
    Linux kernel—the very heart of the operating system—even as businesses ranging
    from IBM to neighborhood churches use Linux operating systems every day.


    Linux has grown to a multibillion dollar a business, which is not bad for a piece
    of code that is available absolutely free of charge to anyone wants it.


    You read that right: Linux is indeed free, and in more than one sense of the word.
    This is understandably puzzling to many new to this operating system, since the
    concept of making money from something that''s free counter-intuitive. How does
    this work? To answer, let''s take a look at how Linux is put together.'
  merge: -1
