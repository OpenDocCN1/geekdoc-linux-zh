  md: '# Chapter 1 ■ What Is Fedora?


    Instead, you could pay a company that has already put Linux together for you to
    download from the Internet or buy in a nice box, complete with instruction manuals.
    Whatever you prefer. Such a company or organization has created what’s known as
    a Linux distribution. All distributions are slightly different from each other,
    but they’re all Linux.


    The second reason someone would pay for something is for support. After you buy
    software, many companies will offer free or fee-based technical support, such
    as a phone number or a Web site for you to get questions answered. Linux is no
    different; in fact, Linux companies depend on support fees to generate their revenue.


    It should be noted at this point that Fedora isn’t going to charge you every time
    you need some help. Fedora doesn’t ask for support fees from single users or even
    commercial users. Instead, the commercial sponsor of Fedora, Red Hat, asks for
    fees from larger companies that have decided to use the more business-oriented
    Red Hat Enterprise Linux in their organization. For such customers, having a support
    contact isn’t a luxury—it’s necessity.


    The relationship between Fedora and Red Hat Enterprise Linux (RHEL) is relatively
    straightforward: Fedora is the community-based distribution that acts as a testing
    ground and “sandbox” for new features and what will, once made secure and streamlined,
    end up in RHEL.


    Now you know the secret to making money with Linux: don’t charge for the software
    itself—charge for the services you can provide for the software.


    So who puts all of this code together? And why do they do it? It’s not always
    to earn a living, as you might expect.


    # Distributions of All Shapes and Sizes


    In the very beginning, there was one distribution of Linux, known as MCC Interim
    Linux. Its singular status didn’t last long. Very soon, there were handful of
    distributions. Today, nearly 18 years later, there are upwards of 200 distributions.
    No one knows the exact number, since new ones are being created every week, and
    old ones are being allowed to languish into obscurity.


    # Watching Distributions


    For an up-to-date inventory of Linux distributions, visit DistroWatch (www.distrowatch.com).'
  merge: -1
  pgno: 25
- img_proc: true
  md: 'Whatever the exact number, there are a lot of distributions out there, and
    they all fall into one of two categories: commercial (like RHEL) or noncommercial
    (like Fedora).


    The commercial distributions exist for a pretty self-explanatory reason: some-either
    a company or a group of developers, wants to make money. These distributions tend
    to be the most well-known of the Linux distributions, although they are not necessarily
    the most influential.


    Distributions in this category include RHEL, SUSE Linux Enterprise Server, Mandriva
    Linux, and Ubuntu Server. Those are the more commercially successful distributions;
    it is by no means a complete list.


    Noncommercial distributions are generally run as not-for-profits, if they are
    well organized, or even as a hobby for one of a group of developers. The motivation
    for developers is varied. Some want to create something meaningful. Some do to
    earn extra money. (Actually, some nonprofit distributions receive some funding
    through voluntary support and donations.) Some want to have fun coding. Whatever
    the reason, developers have made noncommercial distributions very popular and
    extremely influential among all Linux developers.


    Noncommercial distributions include Debian GNU/Linux, Slackware Linux, Ubuntu,
    openSUSE, and SimplyMEP. Just to give you an idea of how influential noncommercial
    distributions can be, know that SimplyMEPIS, Freespire, Linspire, and Xandros
    are among the many Linux distributions (commercial or otherwise) based on what
    has become the most popular noncommercial distribution today: Debian GNU/Linux.


    # What Fedora Is


    If you were to ask which category Fedora falls, well technically the answer would
    have to be commercial, or only because its development is ultimately funded by
    Red Hat, Inc. It''s a hard thing to define, though, since community involvement
    in Fedora development is so intense. In fact, this involvement is a good reason
    why Fedora has become so popular. With so much user involvement, backed by corporate
    funding, Fedora has been able to become one of the most user-friendly Linux distributions
    available.


    There is more to it, of course.'
  merge: -1
  pgno: 26
- img_proc: true
  md: '# The Red Hat Connection


    According to legend—because you can have legends under 20 years of the Internet—the
    name "Red Hat" came from Ewing''s habit of wearing a red hat while at CMU. The
    name stuck, even ever after Ewing''s company was purchased by entrepreneur Bob
    Young in 1995.


    Red Hat''s initial popularity is attributed to some key technological advantages
    it had over other Linux distributions of the time. One such advantage was the
    addition of a graphical configuration system used when installing Red Hat. Primitive
    by today''s standards, nonetheless this simple series of screens was hugely helpful
    for these early adopters who wanted to try out Linux.


    # Family History


    Red Hat Linux is one of three major branches of Linux distributions that exist
    today. Many successful distributions, including Fedora, are based on Red Hat Linux,
    such as Red Flag, a popular Chinese distribution, and Yellow Dog, a flavor of
    Linux designed to run on Apple''s Mac hardware.


    Another advantage Red Hat had was how software applications were distributed over
    the Red Hat Linux platform.


    Recall that while open and free software is always available in its source code
    form, such a format is not easy to use. What software developers must do is deliver
    their application in a form that''s easy to install. On Windows, this is done
    with a self-executing file that users can double-click and have the new program
    installed.


    On Linux, such an approach is not a good idea. Self-executing installs bring a
    host of mistakes and potentially malicious changes to a computer, and at the most
    fundamental level, all Linux systems resist such packages. Instead, applications
    are installed using packages. A Linux package can contain many of the same files
    as a Windows installation routine, but the control of the installation lies with
    the package manager—not the package itself.


    Package managers will not only ensure the package is properly and safely together,
    but they will also make sure that any other software the application needs will
    be installed as well.'
  merge: -1
  pgno: 27
- img_proc: true
  md: 'Red Hat’s advantage here was the introduction of the RPM package management
    system. RPM packages are one of two major Linux packaging systems (the other being
    Debian GNU/Linux’s DEB package system).


    Over the next nine years, Red Hat Linux would continue to capitalize on these
    and other advantages, devoting much of its marketing and sales efforts to getting
    Linux into the workplace; specifically, the enterprises that are organizations
    with 500 or more computer users. By targeting this market, Red Hat was essentially
    aiming for the low-hanging fruit; there aren''t a lot of enterprise-level customers
    out there, but it only takes a few to really build your revenue stream.


    But this approach, while commercially successful, gave Red Hat a problem. While
    Red Hat Linux was becoming increasingly popular in the corporate world, the community-oriented
    developer and user bases that had helped to bring Red Hat Linux to where it was
    technologically were feeling increasingly disenfranchised. What good was it to
    develop cutting-edge software, the community complained, when Red Hat, fearing
    any software instability for its well-heeled customers, would only include it
    after a laborious quality control process?


    This issue was serious enough to prompt Red Hat to launch several community outreach
    programs—because if the community began to vote with their feet and walk away
    from Red Hat, highly valuable development resources could be lost, and Red Hat’s
    community reputation would plummet. Some of this outreach helped, but in the end,
    it took the birth of a new distribution and the death of Red Hat Linux to help
    save Red Hat.


    # The Fedora Connection


    Fedora actually began its existence as a simple collection of software.


    One of the community outreach projects started by Red Hat as it was working to
    keep community interest high was the Fedora project, a collection of newer and
    more experimental software that, when installed on Red Hat Linux, would give users
    a chance to enhance their computers without introducing risky software to the
    main Red Hat distribution.


    It’s important to note that Fedora Linux was not a stand-alone version of Linux,
    like other distributions, but was actually what’s known as a repository of software.
    But it would play a key role in what was to come next.'
  merge: -1
  pgno: 28
- img_proc: true
  md: '# Chapter 1 ■ What Is Fedora?


    In September 2003, Red Hat made a stunning announcement: Red Hat Linux would cease
    to be a product. Instead, users who wanted to have commercial-grade support (such
    as those coveted enterprise customers) would now use and pay for Red Hat Enterprise
    Linux. Users who wished to continue using Red Hat for free and without support
    would use Fedora Core, a formal merging of Red Hat Linux and the software from
    the Fedora Linux project.


    The new Fedora Core distribution would be governed not by Red Hat, but by an independent
    nonprofit organization known as the Fedora Project. At the time, this was considered
    to be a radical move, but as Linux became more commercially viable, vendors like
    Red Hat were able to make the jump to a pure commercial distribution.


    Initially, reaction was mixed. After all, many people wondered, what about home
    and small business users who wanted some level of support? In response, in 2004
    Red Hat (rather quietly) released Red Hat Professional Workstation, a $100 version
    of Red Hat Linux that came with direct Red Hat support. It was, unfortunately,
    a commercial failure.


    What happened next would shape the commercial/community distribution model for
    all future releases—not just for Red Hat, but also for other followers of the
    model.


    Simply put, the Fedora community took care of the support problem itself.


    By becoming a cohesive, flexible body, members of the Fedora Project began to
    fill the gaps that were once occupied by Red Hat. Documentation was created; support
    issues resolved; bugs tracked, identified, and removed. In short, the Fedora Core
    distribution became as robust and powerful as Red Hat Linux ever was and so soon
    surpassed its parent distribution in terms of use and features.


    In fact, the Fedora Project became so strong that eventually Red Hat would drop
    its efforts for a home/small business desktop product and put time, effort, and
    resources back into Fedora Core.


    Ultimately, this approach worked out very well for both sides. Power users and
    developers got a complete and robust distribution to experiment with and use,
    and Red Hat kept its commercial distribution solid and mature. And, as an added
    benefit, Fedora Core, later just Fedora, would become a test bed'
  merge: -1
  pgno: 29
- img_proc: true
  md: 'for new technologies and applications, which would later be included in Red
    Hat Enterprise Linux.


    It''s a good example of a win-win situation for users, developers, and commercial
    vendors alike.


    # Conclusion


    In this chapter, you learned quite a bit about the history of the operating system
    you are about to install. This is important, because if you understand where Fedora
    came from and how it is put together, you will understand the capabilities and
    the limitations of this popular operating system.


    In Chapter 2, “Before Install Fedora,” we''ll spend some very important time making
    a plan for your Fedora installation. Will you use it exclusively or dual boot
    your machine with Windows? Is your hardware going to be compatible with Fedora,
    or will you need to plan for some finagling to get everything to run smoothly?
    The beginnings of these answers will be explored in the next chapter.'
