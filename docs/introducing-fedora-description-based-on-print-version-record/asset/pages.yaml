    # Conclusion


    In this chapter, you have learned how to get the best of both worlds, should you
    not be able to learn Windows completely behind. By using virtualization technology,
    it is easy to get a fully functional Windows installation running right inside
    Linux.

    While hanging on to Windows is all well and good, let''s not forget, Fedora has
    some serious native tools of its own. In the remaining chapters of this book,
