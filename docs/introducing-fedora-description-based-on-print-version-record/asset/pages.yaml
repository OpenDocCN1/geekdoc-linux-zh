  md: '# CHAPTER 13


    # MULTIMEDIA TOOLS


    Computers were never really designed to handle audio and video. This capability
    was more of an afterthought that occurred when computer processors got really
    fast and video monitors came into existence. At this point, more users began noticing
    the similarities between computers and televisions.


    If a computer has a screen and a television has a screen, folks wondered, why
    couldn''t they both display pictures? Never mind the fact that computers and televisions
    were about as technologically alike as an elephant and a rhododendron. The new
    monitors represented a challenge to programmers: how to bring animation and video
    to these new devices.


    Was all this multimedia? In the strictest sense, yes. Machines designed to create
    one form of media were being used to create another form. More than one medium
    on one device certainly qualifies as multimedia. Of course, what we think of multimedia
    is full-motion video with stereo sound blasting out of our speakers.


    Sights and sounds on your computer are very necessary things, even though your
    boss might not always agree. The ability to play music and video files on a PC
    seems, at first, an indulgence. More and more, however, business workers are asked
    to put together multimedia presentations and interactive Web sites for their employers.
    It makes increasing sense to have that functionality built into modern operating
    systems.


    And it doesn''t hurt to be able to play some tunes while typing that quarterly
    report for the boss, either.'
  merge: -1
  pgno: 270
- img_proc: true
  md: 'In this chapter, you will review the following:


    +   - Why some multimedia is not ready to play out of the box


    +   - Playing CDs


    +   - Playing MP3 files, including podcasts


    +   - Getting tuned into Internet radio


    +   - Burning CDs


    +   - Playing video files


    # The Big Deal: Formats and Codecs


    One of the biggest problems with running Linux in general is coming up an incompatible
    file format. Many people who encounter this problem often blame the software developers
    for not being able to put together a decent program. In reality, it’s not the
    developers’ fault. It is actually not hard to put together an application that
    will run MP3s or Windows Media files. The problem lies in the licenses that these
    formats carry.


    If you recall from Chapter 1, “What is Fedora?”, there was a discussion on the
    nature of Fedora’s free and open source licenses and a comparison with how they
    worked versus proprietary licenses. When software companies use a proprietary
    license, they want to get paid when someone uses their software. There is nothing
    inherently bad about this—everyone’s got to eat. But there is often conflict between
    the free and proprietary software worlds, and unfortunately it’s the user who
    gets caught in the middle.


    The conflict centers on the way developers in both camps want to get paid. (Because
    open source developers have to eat, too.) Proprietary vendors have the revenue
    model that says: when people use our software, they need to pay for using it because
    we invented it. The open source revenue model flips around: when people use our
    software, we’ll let them it for free and make money providing support for our
    software.


    The open source people would gladly pay the proprietary developers to use their
    software, but since they don’t charge license fees for their open source, there’s
    nothing to actually give to the proprietary vendors. The revenue generated from
    support, of course, but the profit margin is so tight for the'
  merge: -1
  pgno: 271
- img_proc: true
  md: '# The Big Deal: Formats and Codecs 255


    pay-for-support-and-updates business model that there is still very little to
    send to the proprietary vendors.


    The problem is exacerbated by what proprietary vendors have identified as theirs.
    It''s not just the software application that copyrighted; sometimes, it''s the
    actual format of the file that''s protected by an individual or company. The popular
    MP3 format is one example. Thomson Consumer Electronics has made several legal
    claims that it owns the patent for the code to play the MP3 file format (known
    as a codec, which stands for enCoder/deCoder) and vigorously pursued software
    developers who make MP3 players and don''t pay Thomson a fee for those applications.


    Some software developers have just avoided the legal issues and moved to another
    format. Linux developers, for instance, prefer the open source Ogg Vorbis audio
    format. Some developers, like Apple, have gone ahead and settled in some manner
    with Thomson.


    But there''s still a lot of MP3 files out there, and as PC users, we want to be
    able to listen to them. Fedora 13 does not officially support any software that
    plays MP3s because of these ongoing legal pursuits, but there are ways to obtain
    software-plugins to run MP3 files in some of the included audio software.


    Some of you may be wondering at this point if this is illegal. While there is
    still ongoing patent litigation, and there are no injunctions for MP3 player inventors
    to stop what they are doing, then users are not to be penalized for installing
    code on their systems.


    Unfortunately, this is not the case with the codecs used to play DVDs on a PC.
    The Motion Picture Association of America has pushed through litigation in Congress
    that makes it illegal for anyone in the U.S. to use unlicensed software to play
    DVD movies. Note, that it''s the software, not just make. So, if you are residing
    in the U.S., you cannot legally use software in Linux to watch DVDs, even though
    there''s perfectly good software to do it. But since DVD-on-Linux player software
    is given away, its makers are unable to afford a license to use the DVD codecs.
    Also, the very act of watching a DVD means you have to decrypt the content, which
    is illegal to do in the U.S.


    It seems kind of strange, because all Fedora users want to do watch a movie from
    a DVD they bought and paid for. But while the MPAA is hell-bent on'
  merge: -1
  pgno: 272
- img_proc: true
  md: 'battling movie piracy, which is a laudable goal, innocent users, like those
    who run Linux systems, could get caught in the crossfire.


    For the record, it should be noted that libvdcss has not been tested in any court
    decision, and thus far the movie industry has been reluctant to initiate any real
    legal fight—possibly because it knows most users just want to watch movies they
    own, not steal them.


    # Audio on Fedora


    There''s something nice about being able to stick a CD into your computer and
    listen to it, with no muss or fuss. But it''s not just CDs that get music to your
    PC days: there are plenty of Internet sites out there that will let you purchase
    MP3 versions of your favorite tunes, as well as streaming Internet “radio stations.”
    Podcasts are still popular, too: they are MP3 files put together by news organizations
    or bloggers, which can be played on computer or portable MP3 players.


    Let''s start listening.


    # Playing CDs


    Audio CDs, fortunately, are encoded with an Advanced Audio Coding format (AAC)
    that is a very open standard, so Fedora (and other Linux distributions) has no
    legal issues about playing them. Even better, AAC files are higher quality than
    MP3s, and Fedora includes some robust applications to actually enhance your music
    collecting experience.


    There are two applications in Fedora that will play CDs: Sound Juicer and Rhythbox.
    Sound Juicer is a music player and extractor that will play and copy CD’s contents.


    Rhythmbox is a full-featured media application, analogous to Apple’s iTunes or
    Real’sPlayer. It will also play CDs for you, although not by default. It is designed
    for handling and organizing music files stored on your system or out the Internet.


    What many Fedora users usually do is use both applications in tandem. Sound Juicer
    is used to copy files from audio CDs and store them in a format that takes up
    less space on your hard drive. Rhythmbox can then be used to organize your music
    into playlists for your listening pleasure.'
  merge: -1
  pgno: 273
- img_proc: true
  md: 'Audio on Fedora 257


