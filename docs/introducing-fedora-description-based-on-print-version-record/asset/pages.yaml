    # LAN/Cable


    Most broadband connections in the home or office these days will connect to your
    PC’s NIC port through what’s known as a Local Area Network (LAN). The cable itself
    (known in the IT bit as “Cat 5” or “Cat 6” wire) looks like a phone cord, with
    a rectangular head that plugs into a matching port on your router and your PC.
    Another term you have heard about is “Ethernet,” which describes the specific
    kind of network you are plugged into, namely many PCs connected to one central
    router.


    The router is the heart of your network, and it is important to keep it running
    nice and smoothly. Make sure it’s got plenty of ventilation, a steady stream of
    power, and updated software. A happy router is a functioning router.


    Routers and PCs speak to each other via the TCP/IP protocol described earlier
    in this chapter. And, because no phones are involved, there’s no need to apply
    any additional software to translate anything to PPP or else a phone line needs.


    What’s nice about using a LAN or Ethernet connection is that nine times out of
    ten, it just works. Plugging in the Cat 5 cable into your PC tells Fedora to start
    the network connection software.


    A router has two main functions. First, it acts as a switchboard, sending and
    receiving signals from the PCs on the network with great speed. Second, to keep
    these signals straight, the router is often responsible for assigning each PC
    or device that’s connected to the network a unique IP address.


    An IP address is a unique combination of four numbers (1.2.3.4) that belongs to
    only one device on a network at time. Users can specify their own IP addresses
    if they want, but often the router does for them using a tool known as DHCP, which
    automatically assigns IP addresses to a device whenever it is physically connected
    to the network.


    Most home and small office networks have a combination router/modem at their hub,
    which not only connects the network devices together, but also handles communication
    with the outside world. Most ISPs will assign modems coming in their network a
    unique IP address via DHCP. Any computer'
