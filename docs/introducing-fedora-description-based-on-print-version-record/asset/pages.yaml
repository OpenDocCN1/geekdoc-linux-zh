  md: '# Understanding the GNOME Desktop


    First, it’s not “gnome”, like those odd little blue-coated, red-hatted critters
    that run around the Scandinavian countryside. It’s “guh-mome,” heavy on the “G”
    and light on the “uh.”


    GNOME is the brainchild of Miguel de Icaza, a Mexican computer engineering student
    who took one look at the KDE environment and really liked what he saw—until he
    discovered the non-free code sitting (at the time) within.


    De Icaza, a devoted follower of the free software ideals, decided what was needed
    in Linux was a similar desktop environment that had none of the licensing limitations
    of KDE.


    GNOME first debuted in August 1997, when De Icaza first made the announcement
    about the project he was working on in the comp.os.linux.announce newsgroup. By
    December of that same year, the first workable version was made available to the
    Linux community. It would not be until March of 1999 version 1.0 would be released
    to the general public, but then the word had gotten out, and thousands of free
    software devotees climbed on board the GNOME bandwagon.


    GNOME, like KDE, is a desktop environment. It is not a window manager, like Enlightenment
    or Metacity. Window managers control the look and feel of the windows, menus,
    and other visual components of a graphic interface. Desktop environments provide
    a specific platform for applications to operate within. If an application is written
    for a desktop environment, therefore, it can tap into a wide range of common features
    with other applications in that environment.


    In the Linux community, GNOME is lauded for more than its free software status.
    It has historically been regarded as more aesthetically pleasing than KDE, as
    the themes available for GNOME have more of an eye-candy appeal. Recent versions
    of KDE would seem to dispute this, which you will learn if you should try Fedora
    KDE.


    Beyond the look of GNOME, de Icaza has pushed new boundaries for the perception
    of free software in the corporate world. A year after the release of GNOME 1.0,
    de Icaza partnered with several major corporations to form the GNOME Foundation—a
    nonprofit organization dedicated to the ideal of keeping GNOME development moving
    forward in a rapid and open way.'
  merge: -1
  pgno: 79
- img_proc: true
  md: '# Desktop Settings and Features


    The GNOME Foundation, with high-power members such as Red Hat, HP, and IBM, want
    to make GNOME the interface for Linux and make that interface very easy for users
    to adapt to.


    One of the major hurdles for people using Linux has been the perception that it
    is too hard to use, a perception the GNOME Foundation wants to change. By offering
    software developers a stable and communicative environment within which to create
    new GNOME apps, the GNOME Foundation serves as an incubator of sorts for bringing
    more user-friendly applications to the GNOME interface.


    It is for many of these same reasons that Fedora''s default desktop is GNOME.
    Let''s take a brief tour and learn how to change the look of the desktop along
    the way.


    # Desktop Settings and Features


    When you look at the GNOME desktop, you will see how simple and clean it is (see
    Figure 4.1). That''s because the interface designers decided to present just the
    tools you need in unobtrusive a way as possible. No Recycle Bins or My Documents
    icons will be found here—unless you want them.


