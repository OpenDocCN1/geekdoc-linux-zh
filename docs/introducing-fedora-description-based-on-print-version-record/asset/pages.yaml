  md: '# How Linux and Windows Are Nothing Alike


    When looking at Linux, invariably comparisons are made to its strongest competitor,
    Microsoft Windows. It''s a fair comparison, since Windows sits on over 90 percent
    of desktops in the world and has made its company, Microsoft, arguably the richest
    company on the planet. When you look at each operating system by side, they look
    quite a bit alike: there are menus, windows, icons, toolbars—all of the familiar
    visual cues that most people take for granted when they use a computer these days.
    When you crack open the hood, however, you will find that Linux and Windows are
    nothing alike.


    # Modularity


    Let revisit the work of young Linux. What he and his fellow contributors were
    working on was not an operating system like Windows or Mac OS X. He was working
    on what is known as the kernel: the tiny, but powerful, core that lies at the
    center of all operating systems. An operating system is not just a kernel; there
    is software to talk to keyboards, mice, screens, the Internet, installed applications,
    not to mention the software that makes all of those pretty nifty-looking windows,
    icons, and menus. Underneath all of that, the kernel: the piece of software that
    organizes all of the tasks a human being needs a computer to do and translates
    them into instructions the computer can understand.


    Linux is not the only operating system with a kernel at its core. All operating
    systems have kernels, even Windows, but not all kernels are created equally.


    To illustrate, think of a kernel as a child''s connecting toy block. It''s self-contained,
    and other blocks can be attached to it. In fact, in this example, other blocks
    certainly do, like the block that displays the computer''s output on the screen
    or the block that controls the network card that lets the computer talk to the
    Internet. All the blocks connect rather neatly to the kernel block, which is only
    slightly bigger than the rest of the blocks, because it''s not doing all of the
    work—the other blocks are. The whole thing is put together into what we know as
    the Linux operating system.


    By contrast, the Windows kernel is also a connecting block, but it''s much bigger
    than the blocks that connect to it. It''s nearly as big as all of Linux itself,
    and that''s just the Windows kernel. The reason for this size disparity is because
    the Windows kernel is so interconnected to its helper applications that essentially
    all'
