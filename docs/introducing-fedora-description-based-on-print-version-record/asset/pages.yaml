  md: '# Chapter 1 ■ What Is Fedora?


    see sometimes while working with Fedora. It means, in a clever, geeky, recursive
    play on words, `GNU''s Not UNIX`.


    At the same time, beyond the wordplay, Stallman did something really radical:
    he created a free software license.


    All software created is released under some sort of license. A license dictates
    how a piece of software can be sold, copied, and used. Much of the software that
    you have used until now, especially with Windows or OS X, has used what are known
    as proprietary licenses. A proprietary license states—in painfully long legal
    detail—that you, the user, can use one copy of the software, say, Windows. You
    can''t copy it and sell it to anyone else. Nor are you allowed to see or otherwise
    manipulate the code that made Windows. To do so would bring certain doom and destruction
    upon you. Or worse, lawyers.


    Stallman proposed was a license that would be a mirror image of proprietary licenses.
    His original idea went something like this:


    +   - You have the freedom to run the program for any purpose.


    +   - You have the freedom to change the program to suit your needs. This means
    that you can have the source code—the actual human instructions used to put an
    application together.


    +   - You have the freedom to redistribute copies of the program, either for free
    or for a fee.


    +   - You have the freedom to redistribute changed copies of the original program.


    Those are the four basic principles found in the license Stallman created: the
    GNU General Public License, or GPL for short. This license was written to guarantee
    that once software is made free under this license, it will always stay that way.


    Free, in this context, means free of charge and also free of restrictions to share
    and change the code itself. A very common euphemism around the Linux community
    is that the GPL is ''free as free speech,'' not as in ''free beer.''


    To break this down in nontechnical and nonlocal terms, here''s what the GPL means:
    Here''s the source code. What do you want with it? If you improve it, make sure
    you include all of the source code with your improvements and pass it along. Don''t
    ever try to keep other people from getting'
  merge: -1
  pgno: 23
- img_proc: true
  md: 'your improvements to the source code. We can tell you how to do this, because
    we wrote the software, and these are the terms under which we’re willing to let
    you have it.


    In a less litigious society, this could be broken down even further to: “Be excellent
    to each other.”


    How the GPL became tied to Linux was really a matter of practicality. Torvalds
    had his kernel but none of the tools that would make that kernel into a real operating
    system. (Think engine with the gears, wheels, shafts, and axles as a car.) “you’ve
    got your chocolate in your peanut butter” flash of inspiration, Torvalds modified
    the GNU tools so they would run with his Linux kernel, and poof! the Linux operating
    system was born.


    Because the close interplay of the GNU tools and the Linux kernel, Torvalds decided
    to adopt GNU’s GPL for the kernel as well. This interplay is also why you will
    often see the operating system referred to as GNU/Linux and the kernel just as
    Linux. Purists, Stallman the most vocal, believe that adding GNU/ to the name
    reflects the high contribution the GNU tools made to the birth of the GNU/Linux
    operating system.


    Whether people back this stance or not, the commonly accepted term for the kernel
    and the operating system is Linux, which is what this book will use unless referring
    to a version of Linux that specifically uses “GNU/Linux” in its official-name.


    Now you know how the free part of Linux works. But with all that freedom, how
    does anyone make money in the Linux business? Well, if you recall from that list
    of principles that formed the basis of the GPL, the third item said that one could
    redistribute GPL software as either, free or for a fee. This means that companies
    are allowed to package Linux (or other free software) and sell it to whoever is
    willing to buy it.


    Okay, so why would a user pay money for something that’s free?


    There are two reasons, actually. The first one is while Linux and all of its components
    are free to acquire, getting all of this software and putting it together is not
    always something wants to do. To return to our analogy, you could buy the box
    of connecting blocks and put Linux together on your own, but that takes a lot
    of time and technical expertise.'
