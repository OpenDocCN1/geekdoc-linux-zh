  md: '# CHAPTER 3


    # INSTALLING FEDORA


    Now comes the moment of truth. You’ve done the homework, figured out how you want
    to install your copy of Fedora, and you’re ready to go.


    This chapter won''t disappoint you. Its sole goal is to walk you through the installation
    process using the Anaconda graphical installer. Along the way, you will:


    +   - Discover how to explore Fedora—without installing it.


    +   - Choose which option will be best for you, installing Fedora alone or along-side
    another operating system.


    +   - Journey step by step through the installation process.


    +   - Create one or more users for your Fedora machine.


    # Try Before You Buy


    This section may leave you from scratching your head and wondering why you just
    went through all of the preparation in Chapter 2. Patient, there’s a method to
    this madness.


    All spins of Fedora are currently available to users as a LiveCD version.\“LiveCD”
    is the label for operating systems that can be booted and run right from the CD
    itself—without installing on your computer’s hard drive.'
  merge: -1
  pgno: 58
- img_proc: true
  md: '# Chapter 3 ■ Installing Fedora


    This means that when you insert your Fedora CD into the disc drive and restart
    your computer, Fedora will automatically begin running on your computer without
    putting on any new files or touching pre-existing data on your machine. Fedora
    just starts up and runs.


    So why, you ask, should I bother installing Fedora at all? I can just run it from
    the CD. Well, this is true, and many people do—especially when they are using
    someone''s PC and don''t want to use the pre-existing operating system. We use
    Windows on your friend''s computer when you can just insert your Fedora LiveCD
    and have a more familiar environment ready to go?


    The first issue is: running any operating system from the CD drive means it will
    be a much slower process. Data has to be pumped constantly from the drive, and
    only the fastest drives will give you any kind of decent user experience.


    If your system is low on RAM, performance of the LiveCD will take an even bigger
    hit. When an operating system and its applications run, use the RAM as a workspace
    to perform their operations. The more memory that''s available, the more efficient
    the apps will run. But once there are a lot of applications running, the RAM gets
    filled up. To keep up with the demand, the operating system uses space on the
    disk drive known as swap space to fulfill memory needs. This is why you will hear
    your hard drive churning when you''re running a lot of stuff on your computer.
    Using swap space is slower, but it gets the job done.


    # When to Upgrade the RAM


    > If you have hard drive working a lot—even when you are using one or two applications—it''s
    proper to consider getting more RAM installed on your machine. It not only speeds
    your operations, but it will save a lot of wear and tear on your hard drive.


    When you run a LiveCD, however, the swap option does not apply, since Fedora from
    the CD won''t touch your drive''s data. If your system does not have a lot of
    RAM installed, be prepared for slow LiveCD operation.


    Slow operations notwithstanding, the advantages of the LiveCD are that it lets
    you take your operating system with you, as mentioned before, and something that
    benefits you right now—it lets you try Fedora before you “buy” it. Buy, in this
    case, means installation.


    Everything in the LiveCD instance of Fedora matches what you would get if you
    installed Fedora onto your PC. All you need to do is insert the disc into your
    CD drive and reboot your PC.'
