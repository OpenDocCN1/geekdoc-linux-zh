    # Using USB Mass Storage Devices


    One of the latest and greatest inventions in digital technology is the portable
    mass storage device that can hold anywhere from 1 to 1,000GB worth of data. These
    portable devices come in a variety of configurations, from the small memory sticks
    or thumb drives that you carry in your pocket or on a lanyard, to the portable
    external hard drives that can hold, at the time of this writing, anywhere up to
    2TB (2,000GB) of data.


    The common feature of these devices is that they all connect to your computer
    via a USB port. Fedora is very good at recognizing USB storage devices; literally,
    all you have to do is plug the storage hardware into your PC. A drive icon will
    appear on the desktop, and the Nautilus file manager will open to show the contents
    of the device, as displayed in Figure 7.12.


