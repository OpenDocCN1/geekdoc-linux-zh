  md: '# Chapter 18 = Organizing with Base


    regarded as complicated. And while it is true that manipulating data can be a
    complex process at times, Base’s tools are not going to make it more complicated.
    In fact, the automated wizards in Base can create any component need, which makes
    it even simpler.


    # Creating a Table


    Now that you have created the database file and poked around the interface, it’s
    time to put something in the database file. The logical place to start is creating
    the container to hold the data, which is the table. Using the Table Wizard, which’s
    how to create the database table.


    +   1. Click the Tables object in the Database pane. The Base window will display
    table-oriented functions and objects.


    +   2. Use Wizard to Create Table in the Tasks pane. The Table Wizard dialog box
    will open (see Figure 18.6).


    +   3. In the Category section, select the Personal radio button.


    +   4. In the drop-down list, select the Sample Tables option that most closely
    matches the kind of table you want to build. Don’t worry if you don’t see an exact
    match—you can modify the table in a moment. For this example, choose Library.


    ![](img/3e28f1fd2891c0b928a818897dbd0840_405_0.png)'
  merge: -1
  pgno: 405
- img_proc: true
  md: '+   5. In the Available fields box, click the Fields that most closely match
    those you want to use.


    +   6. Use the arrow keys to move the fields from the Available Fields box to
    the Selected Fields box.


    # Adding New Fields


    If you do not see any fields close to your desired fields, add extra placeholder
    fields that you can rename. For this example, select the fields Title, Publisher,
    EditionNumber, CopyrightYear, Genre, and Notes.


    +   7. Click the Next button. The Set Field Types and Formats page will appear
    (see Figure 18.7).


    +   8. Select EditionNumber in the Selected Fields box.


    +   9. In the Field Name field, change EditionNumber to Volume.


    +   10. Repeat Steps 8 and 9, changing CopyrightYear to Issue.


    +   11. Click the Next button. The Set Primary Key page will appear (see Figure
    18.8).


    ![](img/3e28f1fd2891c0b928a818897dbd0840_406_0.png)


