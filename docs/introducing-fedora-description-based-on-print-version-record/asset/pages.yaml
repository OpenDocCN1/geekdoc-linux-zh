    Almost all new laptops have wireless built in, which is why most mobile users
    are interested in this section. But even in a home or office PC, wireless can
    be a good option because it saves you the time, materials, and hassle in setting
    up a wireless network.


    Configuring wireless is, on one level, exactly like configuring wired network
    access. You still need to connect to a router, and you still need a unique IP
    address for that router to recognize your machine. And, like an Ethernet connection,
    DHCP is the best way to have that IP address automatically assigned to your PC.


    Wireless requires an additional level of configuration. Think of your wireless
    card as a radio (which it is) that needs to tune into a specific radio station
    (on your router). Or, if you move around with a laptop, it needs to be able to
    seek out all the wireless routers within its range and give you the choice of
    which to connect.


    Once the whole radio/radio station connection is worked out, you will have to
    tell your WiFi card how to actually talk to the router. This is because most routers
    signals are encrypted so no unauthorized computers can jump on a network. This
    is usually done with an encryption protocol known as WEP.


    # Get Secure


    If WEP is not enabled on your wireless router, it should be. See your router''s
    documentation on how to set this up.


    Wireless connections, then, have three levels of complexity to deal with: the
    network addressing, the wireless signal acquisition, and the security. Fortunately,
    Fedora''s NetworkManager handles them all in one place.


