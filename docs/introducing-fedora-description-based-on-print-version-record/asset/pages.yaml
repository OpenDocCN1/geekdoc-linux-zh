    When you start cooking, you want to have all of your ingredients out on the counter
    before you begin. Nothing is as frustrating as having to stop to find the jar
    of saffron when your hands are covered in flour. Even better, have your ingredients
    chopped, cut, and measured before you begin for true speed.


    The same concept applies when building a spreadsheet. You need to have all of
    your tools ready before you begin. In this section, the Calc tools will be examined,
    with special emphasis on those tools unique to Calc.'
