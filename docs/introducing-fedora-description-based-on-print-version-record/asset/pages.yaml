    # Listing and Finding Files: The ls Command


    The ls command lists the contents of a directory. This command is similar to the
    MS-DOS command DIR. In fact, typing dir in Fedora is the same as typing ls -c.
    The ls command is one of the commands you use the most in the Fedora Terminal.
    You can also use the ls command to get information about a specific file in a
    directory.


    To use the ls command, you simply type the command, followed by any options you
    want to invoke and any filenames (including wildcards) that you want to specify.

    Table 9.4 lists some of the available options for the ls command.


    You probably want to know what files are in your home directory from time to time,
    so it''s a good idea to know how to check. To list the files in your home directory,
    type the following command:


    ```

    ls ~

    ```


    That''s all you need to type. The ~ character is a shortcut that refers to your
    home directory.'
