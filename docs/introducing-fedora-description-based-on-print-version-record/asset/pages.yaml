    # Protecting Your Inbox


    One of the sad truths about working on the Internet messaging is no one is ever
    immune to spam, or junk mail, as Evolution refers to it. There are ways to minimize,
    the most important method being to keep your email address close to the vest.
    Sometimes that''s not possible, especially with work accounts. But if you have
    a personal email address, just give it to family and friends and never post it
    on the Web.


    When, not if, you start getting junk mail, Evolution initially let it roll right
    into your Inbox, leaving you wondering where this vaunted protection is. Don''t
    worry, it''s there.


    Evolution uses a Bayesian filter to sort through junk mail. A Bayesian filter
    looks at messages and decides if they are spam or not based on criteria it has
    learned over the course of time. But in order to learn, it has to be trained,
    and that''s where the user comes in.


    When you select a junk message and mark it as Junk, two things will happen: first,
    the offending message will be removed from the Inbox and moved to the Junk folder.
    Second, the Bayesian filter will ''learn'' that messages with certain words and
    characteristics should be regarded in the future as junk mail. When more messages
    like that come in, the Junk filter should automatically dump the spam into the
    Junk filter, leaving your Inbox much cleaner.'
