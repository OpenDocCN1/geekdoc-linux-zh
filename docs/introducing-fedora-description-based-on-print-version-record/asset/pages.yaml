  md: '# Table 16.2 Calc-Specific Formatting Toolbar Buttons


    | Name | Function |

    | Merge and Center Cells | Centers data horizontally in selected cells. |

    | Number Format: Currency | Applies currency format to numeric data in selected
    cells. |

