  md: '# 248 Chapter 12 Messaging Tools


    Using Fedora, you can talk or video conference to anyone in the world who is using
    a Skype client. For a pay-as-go-go fee, you can also dial up any regular phone.


    At a minimum, to really get the benefit of this application, your Fedora PC will
    need a functioning sound card, with speakers, as well as a working microphone.
    This will get you voice communication capability, which will be very useful.


    Because it is proprietary software, Skype is not available through PackageKit.
    However, the Skype developers have made a custom Fedora package that will let
    you install Skype very quickly, a process that will be examined in the next section.


    # Installing and Configuring Skype


