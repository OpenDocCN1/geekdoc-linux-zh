    # Know What You Want Your PC to Do


    With all these choices for Fedora, it''s pretty easy to get hung up on which one
    to pick. For the purposes of this particular book, the recommended flavor is going
    to be the main Fedora Desktop distribution itself. Beyond simplicity, there are
    a couple of good reasons for going with Fedora:


    +   * **GNOME is a good first step.** Since GNOME is the default desktop environment
    on Fedora, this makes Fedora a good beginner''s choice. GNOME is not as robust
    as other desktop environments, but it is simple to configure and has some fantastic
    eye candy.


    +   * **Everything is available.** Choosing Fedora will not exclude you from the
