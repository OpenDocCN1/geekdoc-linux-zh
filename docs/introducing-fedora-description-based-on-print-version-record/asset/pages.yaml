  md: '# The Writer Interface 311


    2. Click Edit | Redo to put the change back on-screen.


    3. Click Edit | Repeat to repeat the most recent change.


    # Viewing Your Document


    The way you look at things influences how you treat them. For example, look at
    a bug down the ground, and you will likely feel indifferent. Look at the same
    bug through an electron microscope, and you may shudder in revolulsion.


    How you view a document is important to your work. When you have a document with
    a lot of graphics, seeing the whole page at once helps you balance the look of
    the page. Conversely, those with vision problems may want to make the print appear
    really big without increasing the font size. Follow these steps to change your
    outlook on your document.


    +   1. In an open document, click View | Zoom. The Zoom & View Layout box will
    appear (see Figure 15.8).


    +   2. Select the option that matches your desired view choice.


    +   * If you want a precise zoom percentage, click the Variable option and enter
    the numeric value (see Figure 15.9).


    # Zoom-a-Zoom!


    The minimum zoom percentage is 20% and the maximum zoom percentage is 600%.


    +   * To see an entire page, select the Fit Width and Height option in the Zoom
    & View Layout dialog box.


    +   * For the best size for your current screen dimensions, select the Optimal
    option.


    ![](img/3e28f1fd2891c0b928a818897dbd0840_328_0.png)


    Figure 15.8

    Decide how close up you want to see the document.'
  merge: -1
