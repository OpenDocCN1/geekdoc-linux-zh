    -rw-r--r-- 1 username users 603993 2007-02-21 18:20 51302-Dark Plastic 2.

    tar.gz

    -rw--r--r-- 1 username users 13588 2007-04-19 21:43 .bash_history

    -rw--r--r-- 1 username users 1177 2007-01-20 22:15 .bashrc

    drwx------ 7 username users 4096 2007-05-03 19:04 .beagle

    drwxr-xr-x 2 username users 4096 2017-01-20 22:15 bin

    -rw-r--r-- 1 username users 132063 2007-01-20 23:40 bookmarks.html

    drwxr-xr-x 6 username users 4096 2007-04-27 09:42 Books

    -rw--r--r-- 1 username users 62048 2007-02-26 07:12 example.pdf

    ```


    # Touche Files


    The expression touch is not one coined. In UNIX-style operating systems, like
    Fedora, a file is said to be touched when it is modified or viewed by a user in
    some way. A file is not touched when you just list the contents of a directory
    or view the contents of the file.'
