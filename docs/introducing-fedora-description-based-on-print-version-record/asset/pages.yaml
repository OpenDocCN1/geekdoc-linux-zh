  md: '# CHAPTER 8


    # TAKING THE GRAND TOUR


    It''s installed, it''s running smoothly, and now you have a whole Fedora operating
    system to play with. After all of this configuring and customizing, you''re prob-ably
    wondering: does Fedora actually *do* anything?


    Indeed it does. For instance, when you hear people comparing Linux to Win-d, one
    of the big gripes you will hear is about the perceived lack of available Linux
    applications. At the moment, Windows has some 100,000-plus applications available.
    While there are not quite that many Linux applications, the number of available
    applications is greater than many people realize.


    Because Fedora applications typically are not commercially advertised, they are
    far less known than their Windows counterparts. Word, PowerPoint, and Excel—most
    people have heard of these applications. But many have heard of Writer, Impress,
    and Calc? Not many, although that''s changing rapidly. Those who have heard of
    them know that these are part of a very robust office suite, fully comparable
    to *and* compatible with Microsoft Office.


    The GIMP is another prime example of an application that is just as feature-rich
    as its Windows counterpart, Adobe Photoshop. But, since GIMP, like most its Linux
    brethren, is not on the public radar, it is often treated as nonexistent—for the
    time being.'
  merge: -1
  pgno: 168
- img_proc: true
  md: '# Chapter 8 ■ Taking the Grand Tour


    In this chapter, you will visit some of the essential tools packaged with Fedora,

    including:


    +   - Firefox, a popular browser on any platform


    +   - Evolution, a powerful Outlook-like email application


    +   - OpenOffice, the fastest growing office suite in the world


    +   - Additional Fedora applications that you will find many uses for


    # Introducing Firefox


    In the old days of the Internet (all of 17 years ago), life was just emerging.
    The simple concept of hyperlinks on a text page was just uncomplicated. Some links
    went to other pages; others went to files to be downloaded—perhaps a picture or
    two. Browsers such as Lynx only had to contend with text—life was good.


    In 1993, everything changed forever. The National Center for Supercomputing Applications
    (NCSA) at the University of Illinois created Mosaic—a browser capable of displaying
    text and pictures. Suddenly, users could illustrate Web pages, which facilitated
    the flow of information. A year later, one of the Mosaic developers left NCSA
    and launched his own browser—Netscape Navigator 1.1.


    Since then, the capability of browsers has grown even more in response to more
    complex content. Need to hear a sound file? The browser will take care of it.
    Need to view a Flash animation? Not only will a browser display it for you, but
    the browser can also automatically get the required viewer if you don’t already
    have it.


    These sophisticated features are a long way from the early Internet days, that’s
    for sure.


    One of the direct descendants of early Netscape browser is Firefox, cross-platform
    open-source browser that has taken the desktop world by storm, no matter what
    the platform. On Windows, traditionally the bailwick of Internet Explorer, Firefox
    has a 10+ percent browser share, which may not seem like a lot, except when it’s
    only been around for a couple of years.


    What makes Firefox special is its speed, stability, and security. Unlike Internet
    Explorer, which is tied closely to the Windows operating system on a code level,'
  merge: -1
  pgno: 169
- img_proc: true
  md: '# Introducing Firefox 153


    Firefox is a separate application. So, even if someone can figure out how to maliciously
    hack Firefox, it won''t damage anything beyond the browser. When Internet Explorer
    is hacked, all of Windows can become vulnerable.


    Another unique feature of Firefox is the available extensions. Because Firefox
    is open, developers can create small add-on programs that can handle a variety
    of tasks, like displaying newsfeeds, synchronizing a user''s settings with any
    Firefox browser they use, blocking advertising... it''s a long list.


    Finally, something that Firefox has for quite some time, before Internet explorer
    picked up, is a tabbed interface (see Figure 8.1). Tabs let you display multiple
    pages in a single window, a very useful feature for power surfers.


    In Chapter 10, "Surfing the Web," you will take a closer look at Firefox, as well
    as some of the other browsers used in Fedora. For now, let''s take a quick look
    at Fedora''s flagship email client, Evolution.


    ![](img/3e28f1fd2891c0b928a818897dbd0840_170_0.png)


    Figure 8.1

    The tabbed Firefox interface. **'
