    least of which were added HTML extensions that only Netscape would support, such
    as tables, colors, text size, and (Lord help us all) blinking text. None of these
    functions were included in the original HTML specifications; Netscape added them
    because they looked good. And they did look good (except for the blinking) and
    eventually led to the adoption of these extensions by early Web developers, who
    in turn encouraged visitors to their sites to download and install Netscape to
    see their cool new Web site. This viral marketing had its effect—soon, controlled
    more than 90 percent of the browser market.


    Around this time, Microsoft realized that this Internet thing was a good idea,
