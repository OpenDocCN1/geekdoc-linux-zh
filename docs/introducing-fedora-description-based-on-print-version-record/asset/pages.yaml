- img_proc: true
  md: '# Chapter 11 ■ Mail Call


    +   1. Right-click the example message. A context menu will appear.


    +   2. Select the Mark as Junk menu command. The message will be removed from
    the folder and input into the Junk filter.


    There are a few things to remember when working with Evolution''s Junk filter.
    To begin with, it takes a while to learn what''s really junk or not, so for the
    first few sessions may not seem like it''s doing its job. Eventually, spam will
    slip though as the learning process continues.


    Another important point: The Junk filter is not infallible, especially early in
    its learning process. Not only will spam go unmarked, but genuine emails may get
    treated as spam by mistake. Therefore, it''s very important that you periodically
    scan the contents of your Junk folder to look for real messages. If you find any,
    be sure to click on the Not Junk button when the message is selected. This will
    help Evolution''s Junk filter learn faster.


    # Using Thunderbird


    As you learned in Chapter 10, "Surfing the Web," the Mozilla Application Suite
    is the source for the open source Firefox browser. The Mozilla Foundation, the
    organization charged with maintaining the Mozilla code, still works on the entire
    suite, but some application developers feel that the suite itself (codenamed SeaMonkey)
    was just too big to be fast and effective.


    Just as a development team spun off a light and fast web browser from SeaMonkey,
    another team took the code for SeaMonkey''s email and contact manager and created
    the Thunderbird application.


    Compared to Evolution, Thunderbird is lighter on features. If you are looking
    for an all-in-one personal information manager application like Outlook, Thunderbird
    may not be the best choice. But if you don''t need all of those tools, and you
    just want a fast email client, Thunderbird will definitely fit the bill.


    Unlike Evolution, Thunderbird is not included in the default installation of Fedora.
    So, you will need to install it if you want to use it. Start PackageKit as demonstrated
    in Chapter 6, "Installing and Updating Software," and search for the Thunderbird
    package. Once found, mark it for installation and allow the dependent packages
    to be installed as well.'
