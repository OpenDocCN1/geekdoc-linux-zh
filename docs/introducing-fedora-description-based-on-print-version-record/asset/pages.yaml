  md: '# Understanding Software Repositories 115


    included in one package. Fedora uses RPM-based, or .rpm, packages.

    (Other Linux distributions, such as Debian or Ubuntu, use Debian-based,

    or .deb, packages.)


    As you may have guessed, package management is the preferred method of software
    installation in Fedora. Package installation is actually performed by an application
    known as a package manager. It helps keep track of all the applications that are
    already installed on your PC and also helps keep track of those dependencies we
    mentioned. If you install a package that needs some additional software tools
    to properly operate on your Fedora system, it''s the package manager that will
    figure out what other packages you need.


    In Fedora, there are actually three package managers that will assist you in your
    installation needs:


    +   - PackageKit. This robust graphical package manager lists every package available
    for Fedora, which lets you search for software applications from a very big list.
    Applications are categorized by type, status on your system (installed or not),
    or origin.


    +   - Software Update. Another graphical tool, this package manager has one job
    to do: keep your system as up to date as possible. If there''s a new version of
    any of your installed applications out there, Software Update will know about
    it and flag it for you to download and install.


    +   - yum. The core package manager for Fedora, this command line application
    makes getting new packages as easy as typing one line of text and pressing the
    Enter key.


    Each of these three package managers is configured to find all of the packages
    from Fedora''s package repositories. In the next section, we''ll walk through
    repositories and how they work.


    # Understanding Software Repositories


    One of the brilliant features of Fedora is that it only comes on one CD disc.
    Not every operating system can brag about it. Indeed, many Linux distributions
    are delivered to users through multiple disks.


    Formerly, the strategy in delivering a Linux distribution to your home or office
    was not very complex: all of the applications a user needed or would ever need
    in'
