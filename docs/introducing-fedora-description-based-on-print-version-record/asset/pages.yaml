  md: '# Installation Preparation


    Unless you are installing Fedora a brand-new machine with no personal data on
    it, you should always back up your files so you can get them to later, whether
    something goes wrong or right. Even if you are installing a new machine, there
    are still some steps you need to take prior to installation.


    # Gathering Information About Your System


    Fedora is a very robust operating system, and on most computers, it will install
    without a problem. But, if there is a problem, it will likely be because Fedora
    did not recognize a piece of hardware on your PC.


    There are various reasons why this happens, perhaps the biggest one that there
    are so many different kinds of hardware out in the world that it is impossible
    for even the hard-working Fedora and Linux developers to keep with them all. Because,
    in a world where more hardware companies care only about working with Windows,
    the companies'' developers generally don''t spend time writing software drivers
    that will allow their devices to work on Linux. Forately, as Linux becomes more
    prevalent (thanks to easy-to-use distributions like Fedora) a few companies are
    seeing the error of this plan and are now working on Linux drivers.


    There are still gaps in hardware coverage, unfortunately, and while most times
    those gaps are able to be closed with some work on the user''s part, it helps
    you know ahead of time.


    # Hardware Issues


    Hardware concerns will be covered in Chapter 7, "Making Things Work."


    If you''re like most people, you may know the superficial information about your
    PC, like: "19-inch monitor, CD/DVD drive, printer, how many USB ports,..." etc.
    to get a proper list for compatibility issues with Fedora, you will need to dig
    a little further. For some, this can be the most intimidating part of the installation,
    but really, it''s not too bad.


    As you begin examining your computer, you will first notice a lot of the information
    you need to know is right there in front of you. Your monitor, for instance, is
    sitting on your table or desk with its brand name and model displayed on the front
    or back. Likely, the same is true for your printer and any'
