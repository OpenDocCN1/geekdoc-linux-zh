    # Queries to Ask


    You enter data into the form, which in turn goes into the table. All is well and
    happy in the world.


    Then you decide you want to know how many Spider-Man comic books you have entered
    so far. You can''t see this in the form, and after entering so many comic books,
    you find it impractical to scan the table for every Spider-Man issue you have.


    So what do you do? Build a query!


    A query is a set of instructions that tells the database to pull out certain pieces
    of information and store them in a query table, which is sort of like a subtable.
    You'
  merge: -1
  pgno: 416
- img_proc: true
  md: 'can even edit records from the query table and have those changes reflected
    in the main database table.


    # Working Ahead


    In this example, several comic book records have been entered into the database
    already.


    +   1. Click the Queries object in the Database pane. The Base window will display
    query-oriented functions and objects.

    2. Use Use Wizard to Create Query in the Tasks pane. The Query Wizard dialog box
    will open.

    3. In the Available Fields dialog box, choose the fields you want to have in the
    query. In this example, move all but Notes to the Fields in the Query box.

    4. Click Next. The Sorting Order page will appear.

    5. Select Comics.Publisher in the first Sort By field.

    6. Select Comics.Title in the first Then By field.

    7. Click Next. The Search Conditions page will appear.

    8. Select Comics.Title as the first Field value.

    9. Select Equal to for the first Condition value.

    10. Enter Spider in the Value field.

    11. Click Next. The Detail or Summary page will appear.

    12. For most queries, leave the default settings and click Next. The Aliases page
    will appear.

    13. Again, for most queries, leave the alias settings and click Next. The Summary
    page will appear.

    14. Review the query selections and click Finish. The Query Wizard will close,
    and the Query Results window will appear.


    The main database will reflect any changes made to the data in the query if you
    click the Refresh icon on the Database toolbar after making your edits.'
  merge: -1
  pgno: 417
- img_proc: true
  md: '# Reports to Make


    A query is nice for those occasions when you seek information for yourself on
    your Fedora PC. But, if you want to share the information with others or you want
    to transport the information, a report is the way to go.


    A report differs from a query only in the type of output. Reports are read-only.
    Once information is in a report, you cannot change it. You would have to change
    data in the database table and re-run the report to make changes on the report.


    +   1. Click the Reports object in the Database pane. The Base window will display
    report-oriented functions and objects.


    +   2. Click Use Wizard to Create Report in the Tasks pane. The Report Wizard
    dialog box and a blank Writer window will open.


    +   3. Confirm that the selected Tables or Queries are Table: Comics.


    +   4. In the Available Fields box, click the fields that you want in your form.


    +   5. Use the arrow keys to move the fields from the Available Fields box to
    the Fields in Report box.


    +   6. Click Next. The Labeling fields page will appear.


    +   7. Confirm the labels are the ones you want to use and click Next. The Grouping
    page will appear.


    +   8. Click the arrow key to move desired fields to the Groupings box.


    +   9. Click Next. The Sort Options page will appear.


    +   10. Select Publisher in the first Sort By field.


    +   11. Select Title in the first Then By field.


    +   12. Click Next. The Choose Layout page will appear.


    +   13. Choose an option in the Layout of Data field. The style will be reflected
    in the Writer window behind the Report Wizard.


    +   14. Choose an option in the Layout of Headers and Footers field. The style
    will be reflected in the Writer window behind the Report Wizard.'
  merge: -1
  pgno: 418
- img_proc: true
  md: '15. Click Next. The Create Report page will appear.


    16. Enter a name for your report, leaving all other options as is.


    17. Click Finish. The report will be generated in the Writer window.


    # Conclusion


    There is much power to Base than just keeping track of collections, and this chapter
    was intended to give you a taste of this robust application. You are invited to
    experiment with Base on your own and create your own databases, which will help
    you you at your job, business, or home projects.


    We have come to the end of our introduction to Fedora. By now you should have
    a pretty good understanding of this popular operating system and be well on on
    your way to making Fedora an integral part of your computing life. Thanks for
    coming along on this journey, and enjoy your Fedora!'
