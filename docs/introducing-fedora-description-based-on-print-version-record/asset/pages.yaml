  md: '# Making Lists


    If you want to remember something, write it down.


    We all do it every day: create lists of things to do, groceries to buy, people
    to send cards to. Lists are a big part of our lives, if only because our brains
    are wired to think in sequential terms.


    We like it when we can plan ahead, and since we perceive the world around us moment
    by moment, we tend to organize our thoughts sequentially, too. So we use lists
    to plan and to communicate.


    Lists in documents are commonplace. Two major types of lists include numbered
    lists and bulleted lists. The following steps describe how to create numbered
    and bulleted lists in Writer.


    +   1. Type a four- to five-item list, pressing Enter after each item.


    +   2. Select the entire list.


    +   3. From the Format menu, click Bullets and Numbering.


    +   4. In the Bullets and Numbering dialog box, click the Numbering Type tab (see
    Figure 15.22).


