    you see online and in stores is an Upgrade version—that is, a version of Windows
    that is meant to replace an existing, older version of Windows. What you need
    is an OEM (original equipment manufacturer) version. Upgrades are less expensive
    than OEMs, so you might be tempted to get that instead. Don''t—when you try to
    install an Upgrade version of Windows to a blank machine, even if it''s virtual,
    Windows install will fail.


