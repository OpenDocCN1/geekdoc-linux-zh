  md: '# # CHAPTER 6


    # # INSTALLING AND UPDATING SOFTWARE


    Saying “out of the box” about Fedora is really a metaphorical statement. After
    all, there is no real box from which you unpacked your software. Still, it’s a
    phrase that gets used a lot in the software business to refer to features and
    applications that come with a given piece of software or operating system when
    you first install it on your computer.


    One of the really interesting things about Fedora, and Linux in general, is that
    it comes with a lot of software out of the box. If you recall from Chapter 1,
    “What is Fedora?”, by its very modular nature, Fedora essentially is a collection
    of separate applications all coordinated to work together so that the operating
    system behaves like a single, functioning tool.


    Philosophy aside, however, Fedora still has a lot of applications packaged for
    users, enough to get started right out of the box. That doesn’t mean there aren’t
    more applications out there for you to use.


    In this chapter, you will learn:


    +   - How Fedora handles software installation

    - About software repositories and how to manage them

    - How to use Software Update, PackageKit, and yum

    - How to use the command line to install software'
