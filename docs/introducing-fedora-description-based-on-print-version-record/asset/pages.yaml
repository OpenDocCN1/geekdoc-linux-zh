  md: '# ABOUT THE AUTHOR


    Brian Proffitt is a Linux and Open Source expert, who most recently was the Community
    Manager of the Linux Foundation, and part of the 2009 relaunch of Linux.com. He
    has also been Managing Editor of Linux Today (linxtoday.com), a news and information
    site about all things Linux and Open Source, as well as four other Linux Web sites
    for Juptermedia Corp. He is the author of numerous books on computer technology,
    mostly on Linux, but with a Mac and Windows book thrown in just for variety. He
    is also the author of a student guide on Plato. A black belt in taekwondo and
    a private pilot, he enjoys spending time with his family in his home in northern
    Indiana.


