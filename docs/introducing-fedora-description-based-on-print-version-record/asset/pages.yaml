    # Where''s My Modem?


    Presumably your modem was correctly recognized by Fedora, and all of these steps
    went smoothly. Unfortunately, if your modem is your computer, then it is likely
    that things did not go as well. Internal modems, and software-only modems winmodems,
    are notorious for not working for Fedora and other Linux distributions, because
    of the lack of Linux support by the modem manu-facturers. This is not to say,
    however, using an internal modem is not possible. See the "Modems" section in
    Chapter 7 for the steps needed to get internal modems up and running.


    # DSL


    DSL is one of the two main forms of broadband used in the U.S. today, the other
    being cable. There are, of course, other ways of getting broadband into your home,
    such as broadband cellular, satellite, fiber optic, or municipal WiFi. But in'
  merge: -1
  pgno: 122
- img_proc: true
  md: '# Chapter 5 Getting Online


    nmany cases, these methods are not common or are far enough to justify using them.



    DSL uses the same copper phone lines that run into your home or business; in fact,
    you can make a voice phone call and still maintain Internet access on the same
    line at the same time. This is because a DSL line sends the digital “Internet”
    signal at frequencies that are far above the range of human hearing. Once the
    signal gets back to the phone company, the voice and the network signals are split
    by a switcher, the voice signal routed to the person on the other end of your
    conversation and the network signal sent out to the Internet.


    There is, though, a catch to all of this techno-brilliance: because of the very
    high frequencies involved, a digital signal in a DSL can only travel a short distance
    in the wires before degrading, about one and a quarter miles. So, people who work
    in rural settings are unable to enable DSL—at least, until their phone company
    gets a springer near their location.


    There are two types of DSL modems that a phone company will provide for you. One
    is the older type, which acts like a traditional modem that you have to connect
    and disconnect to the Internet as the need arises. The newer models of DSL modem
    essentially behave as routers: they are always connected to the Internet and manage
    that connection with onboard software.


    Connecting with this latter type of modem, known as an Ethernet DSL modem, is
    very straightforward: computers are connected to the DSL modem/router via network
    cable or by WiFi, and the Ethernet modem/router handles all the rest. In fact,
    you can visit the next section, “LAN/Cable,” to proceed with connecting to the
    Internet.


    The older types of DSL modems are known as USB modems, because they connect to
    your PC through the USB port. unfortunately, they are not ideal for any broadband
    connection on any computer, Fedora, Windows, or otherwise. That’s because PCs
    are designed with hardware (network interface cards or NICs) made specifically
    to go out and talk to other computers. Using a USB port to accomplish this is
    like asking your nose to start speaking instead of your mouth.


    This is the one place in the book where you are strongly encouraged not to use
    a piece of hardware. This is because of the limitations of the hardware itself,
    not Fedora. If your computer doesn’t have a NIC, they can be purchased and'
  merge: -1
  pgno: 123
