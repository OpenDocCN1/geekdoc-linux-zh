    By now you know the three ways you can use package management to update, install,
    or uninstall software in Fedora. Now you have much more ability to play and work
    in Fedora.


    These functions also help get things to work in Fedora. As mentioned in earlier
    chapters, sometimes things in Fedora don''t work as smoothly as they should. Fixes
    about the Fedora community, and now that you know how to install software, you
    can quickly apply any needed fixes to your Fedora PC. You’ll learn how in the
    Chapter 7, “Making Things Work.”'
