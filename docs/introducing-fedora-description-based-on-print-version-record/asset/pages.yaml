    #  Conclusion


    Calc is an effective tool for the creation and management of data spreadsheets.

    This chapter reviewed many of the basic concepts of Calc, and as you explore your
    application in the context of Fedora, you will find it to be a very powerful tool.


    Chapter 17 will move on to review an OpenOffice.org component that will enable
