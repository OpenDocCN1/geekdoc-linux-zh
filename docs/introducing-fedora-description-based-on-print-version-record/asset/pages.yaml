  md: '# Chapter 10 ■ Surfing the Web


    JavaScript. In August 1996, the critics got what they wanted, when Navigator and
    IE 3.0 were each released within a single week, with IE 3.0 including a new technology
    called ActiveX. ActiveX went beyond the simple scripting model of JavaScript and
    the plug-in methodology of Navigator. Now, IE could pick up the tools they needed
    to read any special Web media automatically—they didn''t need to find and install
    any helper apps like Navigator.


    No one would be laughing at IE anymore.


    The next targeted release of the Big Two browsers would be 4.0, and each had its
    own plan for changing the face of the desktop itself. IE would become integrated
    directly into the Windows desktop (a decision that has since come back to them),
    while Navigator would become more powerful and versatile so it would essentially
    become the platform upon which every application needed to run. The desktop would
    become the Internet, it was announced at a Netscape conference in 1997. But it
    was too late—Netscape''s market share was dropping like a rock. By the end of
    that same year, Navigator held anywhere from 10 to 20 percent of the overall browser
    market share.


    By the turn of the century, IE''s market share was consistently 95 percent or
    higher.


    There was no clear end to the Browser War, though many believe it came to a halt
    in December 1997, when the U.S. government levied charges of unfair competitive
    practices against Microsoft because of its decision to integrate IE into the then-upcoming
    Windows 98.


    But what may have seemed like the end for Netscape may have turned into the beginning
    of the end for IE. In 1998, Andreessen announced the release of the Netscape Communicator
    5.0 application suite, which contained the Navigator browser and Messenger email
    client, as well as a calendaring function under the open source Mozilla Public
    License. “Mozilla,” once the name of Netscape’s lizard mascot, would become the
    name of the project created to manage the non-free Netscape code.


    The Netscape Communicator suite would eventually be known as the Mozilla Application
    Suite, and many spin-offs would be created from this rich repository of source
    code, including several browsers for Linux, such as Galeon, Epiphany, and K-Melon.
    The Mozilla Foundation, the organization charged with maintaining the Mozilla
    code, continued to work on the entire suite, but some application developers felt
    that the suite itself (code-named SeaMonkey) was just too big to'
