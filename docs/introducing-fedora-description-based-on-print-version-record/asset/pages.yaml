    perform a dual boot (running Windows and Fedora on the same PC), then you will
    need to make sure you''ve safeguarded most of your Windows data.


    # Completely Replacing Windows


    Even if you plan to completely remove Windows and install Fedora in its place,
    there is still merit to saving your data files. Files created in Windows can be
    opened in Fedora, as graphic files (GIFs, JPEGs, PNGs) and Adobe Acrobat (PDF)
    files. In addition, even Microsoft Office files can be opened, compliments of
    the OpenOffice org site that is fully compatible. You''ll need to save, not back
    up, these files if you plan to use them on your Fedora machine, though. Fedora
    will not be able to read a Windows backup file. If this is the case, use an external
    hard drive or a Flash memory stick (also known as a thumb drive) and directly
    save your data files to a device using Windows Explorer. You will be able to use
    Fedora to retrieve them later.


    # Prepping for Dual Boot


    If you are planning on dual booting your machine, a backup operating system is
    needed to ensure that you can still get to your Windows side in case something
    goes wrong with the setup. Most computer applications these days use huge amounts
    of disk space, primarily because today''s big hard drives enable them to do so.
    Backing up your data and your application files is, therefore, a big job. If you
    have sufficient storage capacity (such as one of external hard drives), then it
    is recommended that you back up your entire hard drive.


    For those of you who do not have a sufficient large-capacity device to hold an
    entire drive''s worth of data, just back up your data files. Your data files are
    the documents, spreadsheets, drawings, and other files that you have created over
    time on your computer. If you run into trouble, you can restore your system by
    first'
