  md: '# Instant Messaging with Empathy


    When you first create an account, you will be confronted with a temporary unpleasant
    thought: you have no contacts.


    Contacts are Empathy-speak for the online personas of your friends or associates.
    Empathy doesn''t let you just IM anyone. You have to specify the person you want
    to IM first. Once you have people in your contact list, Empathy shows which are
    online and whether they are available, busy, or offline.


    Adding a contact is the first step. Many people with Google Talk or other IM accounts
    send their contact information out via email or post it on their Web sites.


    +   - Select the Chat | Add Contact menu command. The New Contact dialog box will
    open (see Figure 12.7).

    - Type the identifier for the person you want to connect with. This will be their
    full Google Gmail address. You can add an alias (such as their given name) if
    you want.

    - Click Add. The New Contact dialog box will close, and after the requested contact
    verifies they know you, they will be added to your Contact List, as displayed
    in Figure 12.8.


