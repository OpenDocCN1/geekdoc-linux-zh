    document window, carefully click and drag the toolbar''s title bar to toward the
    part of the window where you want the toolbar to be docked. A gray outline will
    appear, marking the planned position of the toolbar. Use a light touch.


    +   4. Release the mouse button. The toolbar will be dropped into the desired
    space on the border of the document window (see Figure 15.6).


    +   5. To undock or move a toolbar to another position, click the toolbar handle
    (refer to Figure 15.2) and drag the cursor toward the part of the window where
    you want the toolbar to be. A gray outline will appear, marking the planned position
    of the toolbar.


    +   6. Release the mouse button. The toolbar will be dropped into the desired
    space.'
