  md: '# Chapter 6 ■ Installing and Updating Software


    Update yum at their cores to do much of their work. PackageKit and Software Update
    serve as easier-to-use graphical interfaces for yum.


    "yum" is shorthand for Yellow Dog Update Manager, and is common to Red Hat-based
    Linux distributions. "Yellow Dog" is a version of Red Hat that ran on Apple’s
    Mac machines before Apple shifted its computers to Intel processors. Yellow Dog
    built such a good update tool that Red Hat and Fedora soon incorporated into their
    own distributions. It is a very powerful manager and because it doesn’t have to
    take up system resources neat-looking interfaces, it’s pretty fast, too.


    One thing that must be noted is that yum is an application that needs administrative
    permissions to run (just like Software Update and PackageKit). To do this on the
    command line, type the command su (which stands for super—or administrative—user)
    before you enter any commands. You will be asked for your administrative password.
    After that, you will have root access and can install and uninstall apps as needed.
    When you are finished running commands, type exit in the terminal to leave mode.


    The first thing you should do, particularly if you have made any changes to your
    repositories list, is make sure yum knows about it. To do this, type:


