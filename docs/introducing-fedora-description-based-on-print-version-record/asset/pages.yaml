  md: 'Chapter 17 ■ Presenting with Impress


    | Table 17.1 The Impress Views |

    | View | Function |

    | Normal | The default (and primary) view in Impress where you edit slides on
    an individual level. This view enables the creation and editing of the presentation''s
    outline, which the slides directly reflect. |

    | Outline | Many presenters need notes to guide them through their presentation.
    Use this view to create notes. |

    | Handout | Sometimes handouts accompany presentations so the audience can follow
    along and create their own notes. This view enables the creation of presentation
    handouts. |

    | Slide Sorter | Use the Slide Sort view to shift the slide order in a presentation,
    if needed. |

    | Slide Show | This read-only view shows the presentation in its entirety. |


    # Normal View


