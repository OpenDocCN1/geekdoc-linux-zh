- img_proc: true
  md: '# Getting Fedora 27


    In this method, known as peer-to-peer or distributed downloading, no one computer
    has the burden of being the source for a given file or files. The traffic load
    is shared among all the members of the swarm. The neat thing is that as more computers
    in the swarm acquire 100 percent of the files they need, those machines in turn
    become seeds. In this way, the process actually gets faster as time goes on.


    There are many BitTorrent clients available for the three major operating systems,
    and you may have one already. One that can be recommended is Vuze, a robust BitTorrent
    client that can be used on Linux, OS X, and Windows. It’s also (as a huge bonus)
    an open source software product.


    # Getting Vuze


    To obtain your copy of Vuze, visit www.vuze.com with your favorite browser.


    After you obtain a copy of Vuze or any other BitTorrent client, you will need
    to find and download what’s known as a tracker file. A tracker file, which is
    very small, tells your BitTorrent application where seeds and swarms that have
    the files you need are located on the Internet.


    Locating a BitTorrent tracker file is pretty simple, as Fedora keeps a list of
    on its site. You just have to make sure you get the right one.


    +   1. Surf to the Get Fedora page at http://fedoraproject.org/en/get-fedora.


    +   2. Near the bottom of the page, click the See All Torrents link. A very detailed
    list of files will appear.


    +   3. Click the Fedora-13-i686-Live.torrent link. Your browser will open the
    Opening Fedora-13-i686-Live.torrent dialog box.


    # The Right Stuff


    Be sure "i686" appears in the name of the file, if you have a older PC. If your
    PC happens to be 64-bit, click Fedora-12-x86_64-Live.torrent.


    +   4. Click the Save File radio button.


    +   5. Click OK. The download process will begin, and the tracker file will be
    saved to the default location on your Windows PC.'
