  md: '# Sound Cards and Microphones


    Sound is another concern that shows up in some Fedora installations. Curiously,
    though, Fedora (and Linux) pretty much has sound card compatibility l. Yet, there
    is one strange problem that may crop up: the sound card is properly detected,
    and yet the microphone may not work. This happens quite a bit on laptops, which
    often have a tiny internal microphone (that really needs avoided) as well as whatever
    external microphone you''ve plugged in.


    If your sound is working but your microphone isn''t, try these steps.


