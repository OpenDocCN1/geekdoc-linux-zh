    # Getting Fedora


    We''ve covered the menu of Fedora spins; now it''s time to order.


    The simplest way to acquire Fedora is to use the CD included in this book. It
    contains a full-featured copy of Fedora 13, no different from anything you will
    download from the Internet.


    Of course, sometimes CDs get damaged or lost. Or you may want to download future
    editions of Fedora. If that''s the case, the rest of this chapter will be useful
    for you to learn how to acquire Fedora.


    Getting your hands on Fedora is not as simple as driving down to the computer
    store and buying a boxed set of software. Few Linux distributions are sold as
    retail offerings, and Fedora is not one of them. Nor will it already installed
    on a new computer, like Windows or OS X. No, Fedora is free, but you will need
    to invest some time in obtaining it.


    Before you begin, let''s review what you will need to lay your hands on a copy
    of Fedora if you don''t have access to the CD from this book. At a minimum, you
    will need a working CD drive capable of burning CDs and a dial-up connection to
    the Internet. This will enable you to download the software and create your own
    CD (or DVD if you have the right equipment). It takes a little time, but ultimately
    getting Fedora is pretty simple.


    # Download Fedora


    Downloading software has become a much more common practice than it used to be.
    The advent of broadband, plus some technological tricks to get the software into
    smaller packages so downloads won''t take as long, have made this'
