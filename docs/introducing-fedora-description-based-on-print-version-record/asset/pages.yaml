    This component. Here is where you enter all of the functions and formulas in your
    spreadsheet.


    The Formula Bar has two distinct modes: the Cell Edit mode and the Data Input
    mode. The distinction may seem a bit too fine, but you''ll pick up on it quickly.


    In the Cell Edit mode, the Formula Bar''s tools deal with the selected cell or
    cells as they relate to other cells. When Data Input mode, the functions of the
    Formula Bar apply to data or formulas within one cell.


    Figure 16.6 shows the Formula Bar in the Cell Edit mode, and Figure 16.7 shows
    the same bar in the Data Input mode.


    Table 16.3 lists the functions of all of the buttons in either mode of the Formula
    Bar.


