    2. Click one of the options. That page will appear in the browser window.


    One of the nicer features of Fedora is its capability to call the default Web
    browser whenever any hyperlink or Web page shortcut is clicked—in any application.
    That capability is particularly handy in email clients, such as Thunderbird or
    Evolution, where you often receive URLs from friends or colleagues.


