  md: 'Chapter 2  Before You Install Fedora


    # Choosing the Right Fedora


    After all of the discussion about all those different kinds of Linux, I’m sure
    you’re thinking that at least it''s nice just one Fedora.


    If not. but not to worry. The differences between the versions are not so great—your
    choice at this point will really just come down to personal preference. And the
    nice thing is that you can switch to other Fedora versions if you want to try
    one later.


    # Yes, There’s More Than One Way to Spin Fedora


    You could almost say that Fedora is a victim of its own popularity. Because Fedora
    is so efficient and easy to use (even among Linux distributions), developers of
    all persuasions have taken a good thing and recrafted it into something they prefer
    even more. These variations of Fedora are known as spins, and they follow the
    same release cycle as the main version (though they might be offset by a few days
    here and there). Most of the differences between the flavors of Fedora are purely
    cosmetic: sometimes it’s a different desktop environment, sometimes it’s a different
    set of installed applications.


    It is important to note that these spins are not completely different versions
    of Fedora; they are just Fedora pre-packaged in different ways. If you can, wish
    download and install all of the software needed to create identical versions of
    these spins. Having the spins already set up will save you a great deal of time
    and effort.


    While this book will focus on the original Fedora Desktop, it won’t hurt to take
    a quick look at the other variations, in case you see something you’d like to
    try later.


    # Desktop Environments


    Before we discuss the differences between the Fedora spins, it would be a good
    idea to discuss what is different—specifically, the graphical interfaces that
    users work with when they work with any kind of Linux.


    Most computer users are used to seeing one graphical interface when they run their
    PC. Windows 7 Home Edition get to use the basic Windows interface, Windows 7 Premium
    and Ultimate Editions use the fancier Aero interface, and OS X use Aqua. Graphical
    interfaces are the technical name for the windows, menus, and icons that so many
    computer users have grown accustomed to.'
  merge: -1
  pgno: 33
- img_proc: true
  md: '# Choosing the Right Fedora


    In these operating systems, you get the interface that comes with the OS. You
    can change the colors and the sizes of some items (bigger icons, for instance),
    but at the end of the day, you''re still using the same interface.


    In Linux, this is not the case: There are literally dozens of interfaces for you
    to choose from. This goes back to the modular nature of Linux. Unlike Windows
    7, the interface applications are separate from the operating system. So, if something
    creates a glitch on a Linux interface, known as a desktop environment, the core
    operating system is not affected.


    These desktop environments do more than just look different; they are managed
    by completely different tools, and each carries its own set of specialized applications.
    For example, a text editor (like Windows Notepad) called Gedit is available for
    the GNOME desktop environment, and in the K Desktop (KDE) the same kind of environment
    is known as Kate. (The first letter of an application is often a clue to the preferred
    environment for that.)


    Confusing? It shouldn''t be. The good news is that applications for one desktop
    environment usually work in other environments without a hitch. (The author, for
    instance, prefers to work in KDE but won''t part with Gedit text editor. The two
    work together well.)


    # Fedora Desktop


    The Fedora Desktop is the primary version among the Fedora “family” of spins,
    the one from which all others are based.


    One of Fedora''s main characteristics is that it uses, by default, the GNOME desktop
    environment. GNOME, along with its predecessor KDE, is one of the most popular
    desktop environments for Linux and other UNIX-based operating systems. It''s often
    regarded as an easier-to-use environment, with fewer controls for users to worry
    about. Free software purists prefer it for the free nature of the code that is
    used to build GNOME (see Figure 2.1).


    # Fedora KDE


    Fedora KDE makes exclusive use of KDE and its attendant applications, as shown
    in Figure 2.2.'
