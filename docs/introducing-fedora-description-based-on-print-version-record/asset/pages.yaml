- img_proc: true
  md: '# CHAPTER 17


    # PRESENTING WITH IMPRESS


    They’re not called meetings anymore, you know. The “in” business crowd refers

    to them as collaboration sessions or community meet-ups.


    Nor are these discussions held in traditional conference rooms. More and more,

    corporations are turning away from the same old long table and swivel chairs in

    favor of more comfortable surroundings.


    Corporations around the world have begun to recognize that how we meet is

    least important as why we meet.


    Why we meet is to trade new ideas and improve the condition of the environ-

    ment we share with others. (That, and free donuts.) And fancy collaborative fads

    aside, meetings work better when the many settle down and listen to one person

    ever once in a while.


    Which means that one person has to get up and speak before the many. Often-

    times, this person speaks with informal, impromptu statements. But some-

    times, this person will give a full-fledged presentation. And that is where

    OpenOffice.org’s Impress application comes into play.


    In this chapter, you will:


    +   - Explore the Impress interface


    +   - Learn how to organize ideas for a presentation


    +   - Create an Impress presentation'
  merge: -1
  pgno: 378
- img_proc: true
  md: '# The Second Greatest Fear


    Some people are good at presentations. They stand up in front of everyone else
    and mesmerize us with their logic, charisma, and charm. No notes, no slides—just
    the person and his or her vision.


    The rest of us may require a little assistance. In a public speech, the power
    of the speaker''s words is the only thing that can help people remember the speaker''s
    message. Have you ever noticed how politicians always work some sort of catch
    phrase in their speeches? They are not trying to be trite—they''re trying to give
    their audiences something to remember, because our memory and sense of hearing
    do not always work well together.


    In a private business setting, where a lot of detail may be required, entirely
    verbal presentations would be impossible for others to remember later. So speakers
    have two choices: reduce the presentation to its mere essence to get the overall
    points across, or rely on some other form of communication to get the finer points
    of the message to the audience.


    Since many people fear public speaking only to death, most would rather become
    fiery orators in order to get their points across. This leaves the second option:
    use another way to communicate. We simply remember better if we have seen them
    with our own two eyes.


    Thus, the corporate slide show was born.


    It started off with placards, showing charts created by people whose job was to
    do nothing but show the charts. Overheads were used next, lending presenters the
    ability to support their points on the fly. Then came slides, which added color
    and speed to presentations. Finally, the slides were created directly on a computer
    and projected from there, as well.


    Which brings us to the component in OpenOffice.org that gets this job done for
    you: Impress.


    # Learning the Tools to Use


    The makers of Impress have loaded it with dozens of interesting tools that you
    build incredible presentations with ease. This is readily apparent looking at
    the Impress interface (see Figure 17.1).'
  merge: -1
  pgno: 379
- img_proc: true
