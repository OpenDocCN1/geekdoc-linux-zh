  md: '# CHAPTER 5


    # GETTING ONLINE


    Now that you have run through some of the basic configuration steps for your Fedora
    PC, it''s time to take a look at how you can get Fedora talking to other computers,
    namely through that ubiquitous medium of the twenty-first century, the Internet.


    In this chapter, you will learn how to configure Fedora to connect to the Internet
    through:


    +   - A home or office network

    - Broadband cable/DSL modems

    - Dial-up connections

    - Wirelessly via WiFi


    # How to Get on the Internet


    Much has been said about the Internet this past couple of decades. Although much
    hoopla and hype have been associated with this phenomenon—the largest of all public
    computer networks—it should be noted that the Internet is not even close to being
    finished, even in developed nations.


    The growth of the Internet (thus far) is in many ways similar to the growth of
    the telephone in the United States in the late nineteenth century. For the first
    five years of its commercial existence, the telephone was in about 10 percent
    of U.S.'
  merge: -1
  pgno: 116
- img_proc: true
  md: 'Chapter 5 Getting Online


    households. In five more years, it was in 50 percent of American homes. And in
    another five years, it was in 90 percent of all U. homes.


    The Internet matches this growth pattern fairly closely. By 1994, five years after
    the Internet broke out of its pure academic setting, connections to the Internet
    could be found in about 10 percent of U.S. homes. Now, 16 years later, the pervasiveness
    of Internet access in the United States has reached almost 80 percent. Incredible
    as it may seem, the United States is still just over the three-quarter mark toward
    full Internet usage. (The Internet’s presence in other nations is now catching
    up and has surpassed the U.S. in terms of percentages, even though the U.S. had
    a head start.)


    Whether you are one of the new kids on the Internet block or have been surfing
    since the days of Mozilla, you will find the Internet is becoming less of a place
    to play and more of a place to work. Every day people are turning to the Internet
    to handle banking needs, shop for holiday gifts, and talk to friends and family
    through Web-based phone services.


    The history of Linux and the Internet is an intertwined one. Linux’s predecessor,
    UNIX, was the operating system upon which the Internet was built. In fact, much
    of the syntax of the Internet (“http://”), FTP commands, forward slashes for directory
    separators) is directly derived from UNIX line commands, which in turn can be
    found in Fedora today.


    So it could come no surprise that Fedora provides a rich set of Internet tools
    for access. All you have to do is get yourself connected.


    Getting to the Internet is fairly simple these days. Broadband access is provided
    by a variety of carriers, which boils down to cable from the cable companies or
    digital subscriber line (DSL) access from the phone companies. Within some cities,
    wireless access to the Internet is freely or cheaply available in some neighborhoods.
    Offices and retail buildings are almost always wired for network access for tenants.
    And there’s always narrowband access: when your computer’s modem dials up to the
    Internet on a regular phone line.


    Fedora can handle them all. Often seamlessly.


    # Configuring Connections


    For the most part, Fedora comes Internet-ready. This means if you plug in some
    kind of cord to your computer that’s connected on its other end to the Internet,'
  merge: -1
  pgno: 117
- img_proc: true
  md: '# Configuring Connections


    chances are pretty good that Fedora will recognize what’s going on and go ahead
    and make that connection for you.


    Still, there are some parts of the process that might need your help. Dial-up,
    for instance, Dialing up to the Internet is not a complicated business for Fedora,
    figuring out how to use the modem that came with your computer could present a
    hurdle, since many manufacturers don''t have Linux drivers to operate them. Wireless
    connections can be tricky sometimes as well, for the same lack of drivers for
    WiFi cards.


    Most of these situations have been discovered, however, and solutions have found
    their way into Fedora. In the next sections, we''ll step through the processes
    of connecting to the Internet, no matter what method you prefer. In Chapter 7,
    “Making Things Work,” we’ll review the troubleshooting techniques needed in case
    something doesn’t work as planned.


    # Dial-Up


    The “language” of the Internet is called TCP/IP (Transmission Control Protocol/Internet
    Protocol). This language is how data is sent from your computer to a Web server
    computer anywhere in the world.


    Even though TCP/IP is a UNIX-based product, Fedora needs additional protocol connecting
    to the Internet through a dial-up connection. TCP/IP, after all, does not transmit
    the IP (Internet Protocol) data packets through serial lines very well—serial
    lines like those for phones, for example.


    To get all of the data packets through a modem, an additional protocol, PPP, is
    used. The irony of this is that PPP is not a UNIX invention—and its predecessor,
    SLIP, were developed to connect Windows computers to the Internet. Despite the
    Windows origins of PPP, Fedora has absolutely no problems handling this protocol.


    While dial-up, or narrowband, connections comprise just 20 percent of all Internet
    connections—a number that falls every year—is still prevalent enough that you
    should know how to use it. Many broadband Internet accounts, DSL especially, will
    provide you with dial-up access to use in the main DSL connection is under repair,
    or if you are traveling and need to access the Internet from another location.'
  merge: -1
  pgno: 118
- img_proc: true
