  md: '# # INTDUCING

    # Fedora: Desktop Linux


    # # About the Author


    Brian Profitt is a Linux and Open Source expert, who most recently was the Community
    Manager of the Linux Foundation, and was as part of the 2009 relaunch of Linux.com.
    He has also been Managing Editor of Linux Today (linuxtoday.com), a news and information
    site about all things Linux and Open Source, as well as other Linux Web sites
    for Jupiteredia Corp. He is also the author of numerous books on computer technology,
    mostly on Linux, but with a Mac and Windows book thrown in just for variety. He
    is also the author of a student guide on Plato.


    Many people think of Fedora as an operating system that is way over their heads
    — that only techies can use this strange, arcane OS with the odd name. *Introducing
    Fedora* is to tell you that is simply not the case. Fedora and Linux in general,
    have become very easy for everyday home and business users to install and use.
    Now you can find out for yourself, in just one weekend, how easy it is to get
    started using Fedora and discover that is life beyond wonders.


    **Introducing Fedora** is for anyone who wants to learn Fedora, specifically Fedora
    13. Think of this book as a personal tutorial, a one-on-one class with an expert
    of user. You''ll learn to:


    +   - Use Fedora as a sole operating system or have it exist unusually with Windows.

    - Gather information about your system to assess your system''s capability to
    use Fedora.

    - Explore the many versions of Linux and the entire Fedora family.

    - Install the Fedora operating system.

    - Deal with any unusual installations.

    - Explore the GNOME interface.

    - Create a customized desktop.

    - Connect to the Internet.


    +   - Add a printer to your PC.

    - Add additional hardware to your PC.

    - Explore some of the essential tools included in Fedora.

    - Examine and configure Fedora to browse the Internet and use Evolution to read
    your email and manage your appointments.

    - Use OpenOffice 3.2 as your preferred office suite.

    - Troubleshoot any installation and configuration issues that might pop up.


    # # ON THE CD


    +   - A free, licensed copy of Fedora 13, ready to install

    - OpenOffice.org, a full-featured suite for Fedora and Windows

    - Firefox, the popular browser that beats Internet Explorer on speed and reliability

    - Evolution, a robust messaging and contact management application


    ![](img/3e28f1fd2891c0b928a818897dbd0840_451_0.png)


    # COURSE TECHNOLOGY

    CENGAGE Learning


    ISBN-13: 978-1-4354-5778-2

    ISBN-10: 1-4354-5778-1


    courseptr.com

