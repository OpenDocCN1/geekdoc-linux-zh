  md: '# Chapter 2 ■ Before You Install Fedora


    For general desktop and small business use, Fedora Desktop is the recommended
    version to start with—at least until you get your feet wet.


    The only exception to this suggestion is for users who are interested in installing
    Fedora in an academic setting. In this case, you might want to check out the Fedora
    spin first. Fedora Edu also uses GNOME, so most of the material covered in this
    book will apply to this flavor, if you want to look at it. The additional educational
    software is certainly worth exploring. Even if you choose Fedora Desktop, you
