  md: '# Chapter 16 ■ Analyzing with Calc


    Formatting cells goes beyond just making the data look pretty. Recall that the
    human eye needs to have something to keep it focused. Following a long row of
    data across a screen is very difficult if nothing keeps the eye from wandering
    up or down into the adjacent rows.


    With the judicious addition of fills and borders, you can help the eye track data
    across a screen.


    All cells have borders. Sometimes, the borders are invisible, but they are always
    there, like the air we breathe.


    Cell borders can come in all of the available OpenOffice.org colors and can be
    as thick as 9 pts. I don''t recommend that you use such an extreme width on individual
    cells, as you will obscure the cell''s contents. You may find uses for all of
    the various thicknesses.


    Cell fills are also referred to as backgrounds for cells. These, too, come in
    a vast variety of colors. Care should be taken, however, to avoid the darker shades,
    as these obscure the text as well. But if you do a dark fill color, you can change
    the text color to increase the contrast between text and background.


    As you create your own fills, try to keep the number of different colors to a
    maximum of three shades. More than that could lead to confusing data representation
    and a frustrated brain.


    +   1. Open a Calc document.


    +   2. Select a range of cells one column wide.


    +   3. Choose Format | Cells.


    +   4. In the Format Cells dialog box, click the Borders tab, as seen in Figure
    16.18.


    +   5. In the Preview window, click the areas immediately to the right of and
    below the gray box. Solid lines will appear in the Preview window.


    +   6. In the Style list, select the 2.50 pt option.


    +   7. In the Color field in the Line group, select Blue.'
