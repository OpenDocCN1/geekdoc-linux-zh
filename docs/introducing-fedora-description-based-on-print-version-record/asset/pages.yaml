    # Figure 17.1


    The Impress interface in Normal view.


    Within Impress, you can choose from six views when working with your presentation.
    Five of these views enable you to edit your presentation in different ways. The
    sixth lets you view your presentation from start to finish. Figure 17.1 highlights
    the view controls in the center of the interface. Table 17.1 outlines the different
