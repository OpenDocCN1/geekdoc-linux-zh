  md: '# Chapter 2 ■ Before You Install Fedora


    virus attacks, computer theft, or anything else that could affect your ability
    to access the data on your machine.


    Installing Fedora certainly can''t be classified as a catastrophic event. But
    depending on how you are going to be changing your hard drive''s partitions or
    perhaps evens formatting your hard drive, these events can and erase data completely.


    The first thing you should decide what data should be backed up. That really depends
