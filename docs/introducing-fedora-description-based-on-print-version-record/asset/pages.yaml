  md: '# CHAPTER 1


    # WHAT IS FEDORA?


    A fedora is typically defined as a man’s hat with a low, creased crown. Popular
    in the mid-twentieth century, these fashion accessories have recently begun to
    make a comeback with urban American males.


    If you think you’ve just picked up a book that was incorrectly shelved in the
    computer section rather than fashion, hold on. We’re getting there.


    Fedora is also the name of a popular desktop Linux distribution. Like distributions,
    it’s community-driven and free of charge for users.


    You may be asking, what’s Linux? For that matter, what’s a distribution? And just
    how is it that an operating system that can do anything Windows can do can be
    offered for free?


    These are common questions to those who are new to Fedora, and the whole concept
    of free and open source software. To really explain Fedora, we’ll need to take
    a step back and examine the origins of the software from which sprang—GNU/Linux.


    In this chapter, we’ll explore the origins of Linux, learning about its many different
    types, of which Fedora is just one. We’ll look into the more recent history of
    this branch of Linux, Fedora, which is directly descended from Red Hat Linux,
    and how the most successful commercial company to date can make money giving away
    free software.'
