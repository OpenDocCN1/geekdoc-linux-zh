  md: '# ACKNOWLEDGMENTS


    It goes without saying that you would not be holding this book in your hands had
    not some some very talented and creative people lent their skills to help me get
    this done in what may be record time.


    I can never express enough gratitude to my editors. For those of you who think
    brilliant writing is the sole product of my fevered work, you would be wrong.
    So I thank Mitzi Koontz, Marta Justak, Chris Small, and Sharon Hilgenberg profusely
    for their efforts in making my stuff so much better. Marta gets an extra helping
    of thanks, since she has had to contend with my odd sense of humor for years.


    They say no man is an island. I am fortunate enough to have four spectacular women
    in my life who know how to treat me right (or drive me, depending on the time
    of day). My wife and three wonderful daughters get the big thanks and smooches
    for putting up with my squirreled away in the basement office (a.k.a. “The Cave”)
    for days at a stretch.


    Thanks must also be extended to my friends and colleagues in the Linux community,
    who are always there for technical assistance, unsolicited advice, and general
    putting-me-in-my-place. In particular, Joe Brockmeier, Joe Eckert, and Robert
    Bogueue—who, even though he’s an avowed Microsoft consultant, has the heart of
    a penguin.'
