  md: '# Chapter 8 ■ Taking the Grand Tour


    # Introducing Evolution


    In 1999, GNOME founder Miguel de Icaca made mention of the Camel code-set, which
    was the very beginning of the Evolution email client. Originally called Helix
    Code, de Icaca''s company would start working on what would become one of the
    most popular mail clients on Fedora or any other Linux flavor, for that matter.


    Though the GNOME interface already had plenty of mail clients, calendars, and
    address books, a certain level of integration was missing. Few of the mail clients,
    for instance, took advantage of the address book. None of the programs available
    offered the sort of all-in-one convenience of a Groupwise or Outlook application.
    Evolution was designed to change this (see Figure 8.2).


    The application has seen a lot in its days: the name of its originating company
    to Ximian and then Ximian''s subsequent purchase by the large IT company


    ![](img/3e28f1fd2891c0b928a818897dbd0840_171_0.png)


    Figure 8.2


    The Evolution application.'
  merge: -1
