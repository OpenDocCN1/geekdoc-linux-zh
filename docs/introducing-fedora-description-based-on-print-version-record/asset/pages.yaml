    # Key Combinations


    Key combinations are the quickest way to execute commands. As fast as a mouse,
    anytime you have to lift your fingers and grab a mouse, it slows down your typing.


    Accelerator keys do a good job of emulating menu commands, but often combinations
    are even shorter, and therefore faster.


    Table 15.3 lists the key combinations found in Writer''s default menus. Although
    this is not all of the available key combinations, these tend to be used most
    often.


    # Key Listing


    > For a complete listing of all of the key combinations available in Writer, click
    any toolbar extension control, choose Customize from the menu, and then click
    the Keyboard tab in the Customize dialog box.


    # Creating Documents


    Flight school offers two kinds of lessons: those on the ground and those in the
    air. In ground school, students learn how a plane flies and what all of the instruments
    do. In the airplane, student experience everything works together to perform the
    miracle of flight.


    The tools of Writer have been described with some detail in the previous sections
    of this chapter. Ground school is over. Now it is time to fly and experience how
    to use those tools to accomplish basic tasks for your document.


    # Formatting Text


    Formatting a document is essential in today''s world. No longer are readers content
