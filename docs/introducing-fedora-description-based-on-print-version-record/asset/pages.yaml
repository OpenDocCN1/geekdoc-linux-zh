  md: '# Moving and Copying Files


    Moving and copying files with a graphical file browser is a simple process: you
    pick up the file or directory you want to move or copy and drag and drop it into
    its new location. But there are some details that will help.


    +   1. Click the Places | Home Folder menu command (or double-click the Home folder
    on the desktop). The Nautilus file manager will open.

    2. Double-click the Documents directory. The contents will be displayed.

    3. Click and drag a file to your home directory in the side pane.

    4. Release the mouse button. The file will be moved to the home directory.

    5. Click your home directory in the Location bar. The window will display the
    contents of your home directory.


