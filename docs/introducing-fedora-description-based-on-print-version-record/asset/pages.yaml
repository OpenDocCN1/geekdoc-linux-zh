  md: '# INTRODUCTION


    Many people think of Fedora as an operating system that is way over their heads—that
    only techies can use this strange, arcane OS with the funny name.


    For all of you who have been having these thoughts, this book is here to tell
    you that this is simply not the case. Fedora, and Linux, in general, have become
    very easy for everyday home and business users to install and use.


    Now you can find out for yourself, in just one weekend, how easy it is to started
    using Fedora and discover that there is life beyond Windows.


    # Is This Book for You?


    Introducing Fedora is for anyone who wants to get started using Fedora, specifically
    Fedora 13, and has only one computer at their home or business on which to install
    this new operating system. Think of this book as a personal tutorial, a one-on-one
    class with an expert user of Fedora. You get to stay in the comfort of your own
    home or office and learn how to do the following:


    +   - Use Fedora as a sole operating system or have it happily co-exist with Windows.


    +   - Gather information about your system to assess your system’s capability
    to use Fedora.


    +   - Learn about the many versions of Linux and the entire Fedora family.'
