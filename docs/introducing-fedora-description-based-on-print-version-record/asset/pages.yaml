- img_proc: true
  md: '# Introducing OpenOffice 15


    Novell. But through it all, Evolution has remained closely tied to its GNOME origins,
    and since Fedora Desktop is primarily a GNOME distribution of Linux, it makes
    sense that it would be featured so prominently here.


    Chapter 11, "Mail Call," will demonstrate how to use Evolution and other Linux
    email clients. Now, let''s turn our attention to OpenOffice.org.


    # Introducing OpenOffice.org


    OpenOffice.org is a product that definitely deserves some attention. Is OpenOffice.org
