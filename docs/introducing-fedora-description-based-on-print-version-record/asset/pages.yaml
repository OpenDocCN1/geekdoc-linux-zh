    # Organizing Mail


    After you have read your messages and sent your replies, what next? You don''t
    want to leave your Inbox cluttered, and unless it''s junk mail, you don''t want
    to delete everything, either.


    Evolution is very good at handling lots of email at once. Let''s take some steps
    to organize your Inbox first.


    If you click the Show drop-down list, you will see a list of categories to filter
    the Message list. Click these, as desired, to see the results in your Inbox.


    You can also sort messages based on the criteria of the columns in the Message
    list. If you want to sort by date, click the Date column header. A down arrow
    will appear in the header button, and the messages will be listed from earliest
    to most recent down the screen. Clicking the Date header again will change the
    sort order from most recent to earliest. You can do this for any column header.


    The folder is a really useful tool in Evolution for organizing your information.
    Using folders, you can essentially treat messages as files (which, you should
    know, they are) that can be organized just like files in the Nautilus file manager,
    which you learned about in Chapter 9, "Basic File Management."


    Creating a folder is very quick.


    +   1. Right-click the Inbox folder. A context menu will appear.'
