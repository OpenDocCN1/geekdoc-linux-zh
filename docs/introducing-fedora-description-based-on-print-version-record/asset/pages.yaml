  md: '# Customizing Toolbars


    The Standard and Formatting toolbars are not the only sets of tools available
    in Writer, not by a long shot. In fact, as of OpenOffice 3.2, the version that
    ships with Fedora 13, there are a total of 22 available toolbars in Writer. Most
    of these toolbars will pop up as needed. For instance, when you begin to insert
    a table, the Table toolbar will appear as a floating window.


    To make a toolbar visible at any time, a quick procedure is all you need.


    +   1. Click the View | Toolbars menu. The Toolbars submenu will appear (see Figure
    15.4).


    +   2. Click Picture. The Picture toolbar will appear as a floating toolbar (see
    Figure 15.5).


