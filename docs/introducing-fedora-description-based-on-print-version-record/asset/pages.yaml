  md: '# The Writer Interface


    ![](img/3e28f1fd2891c0b928a818897dbd0840_326_0.png)


    Figure 15.7


    Choose which buttons to see and hide.


    # ## Do All These Menus Mean?


    The toolbars contain a voluminous amount of functions to assist in the creation
    of documents. Yet, they pale in comparison to the depth of the menu commands found
    in Writer. The menus represent every toolbar command, plus many additional commands.
    In theory, you could put every menu command on the toolbars, but that would add
    so much clutter to the screen that you''d only have a two-inch-tall space in which
    to type your document.


    Because of the sheer number of menu commands, this section of the chapter will
    not detail every available command. Instead, the more commonly used menu commands
    will be explained.


    # ## Editing Your Document


    Of all the available menus in Writer, the Edit menu is perhaps the most useful.
    It contains the most pervasive commands in Writer, except for the Open and Save
    commands in the File menu.'
  merge: -1
  pgno: 326
- img_proc: true
  md: 'In this menu, you''ll find the ubiquitous Cut, Copy, and Paste functions, as
    well as the Undo, Redo, and Repeat commands. You can open the Find & Replace dialog
    box from here, as well as track changes to the document.


    The examples in this section will highlight the most basic of these commands,
    starting with cutting and pasting any document object using the Edit menu commands.


    +   1. In an open Writer document, select a passage of text, a graphic, or a form
    field.


    # Click Mania


    You can select an entire paragraph of text by quadruple-clicking anywhere within
    the paragraph. Double-clicking selects a word. Triple-clicking selects an entire
    sentence in a paragraph.


    +   2. From the Edit menu, click Cut.


    +   3. Move the cursor to another area of the document.


    +   4. Again from the Edit menu, click Paste. The cut text will appear in the
    new spot.


    You can create copies of document items such as text or graphics in just a few
    steps.


    +   1. To copy an item, select the desired item.


    +   2. From the Edit menu, click Copy.


    +   3. Move the cursor to another area of the document.


    +   4. From the Edit menu, click Paste. A copy of the text will appear in the
    new spot.


    Here is how the Undo, Redo, and Repeat functions of the Edit menu can help you
    work.


    +   1. After performing any edit within a document, click Edit | Undo. The most
    recent change to the document will vanish.


    # Undo Actions


    The Undo, Redo, and Repeat commands will always be followed by a one-word description
    of the action that will be performed.'
  merge: -1
