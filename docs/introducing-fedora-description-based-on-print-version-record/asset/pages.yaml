  md: '# Starting Firefox


    You can also start Firefox by clicking its launcher icon in the upper panel.


    +   2. Double click the Location bar so the URL in the field is highlighted.


    +   3. Type the URL for the Web site you want to visit in the Location bar.


    # A Helping URL Hand


    You do not have to type the URL identifier http:// before the Web site address.
    Firefox will fill it for you.


    +   4. Press Enter to go to the new page.


    +   5. Place the mouse cursor over a highlighted or underlined hyperlink.

    The link will change color, and the full URL for the link will appear at the Status
    bar at the bottom of the window.


    +   6. Click the hyperlink to go to the new page.


    You don''t have to type in the full address every time you visit a Web site, thanks
    to the Autofill feature in the Location bar. Just typing the URL, and Firefox
    will display a list of similar URLs for you to choose from.


    After you have been browsing for a while, you may need to go back to a Web page
    visited earlier in your current browser session. Two controls on the Navigation
    toolbar, the Back and Forward buttons, will enable you to navigate through the
    pages you have visited.


    Note, however that navigation through Web pages is not tracked for every Web page
    you visit during a session. Firefox uses a sequential navigation method that tracks
    only the pages along a particular path. For instance, assume you were browsing
    Page A, then Pages B, C, and D. On Page D, you found a hyperlink back to B and
    clicked to visit that page. Now, from Page B again, assume you went off and visited
    Pages E and F. If you were to use the Back button in this session, the order of
    pages that would appear for each click of the Back button would be F to E to B
    to A. Pages C and D, because they were on another “track” of browsing, would no
    longer be a part of the browser’s navigation—even if you were cycled forward through
    the same pages using the Forward button.


    Of course, you can do more with the Back and Forward buttons than just cycle through
    Web pages one at a time.'
  merge: -1
