  md: '# CHAPTER 4


    # DESKTOP BASICS


    One of the first things new users notices about the Fedora desktop is its muted
    tones. Some users are a little more blunt: “It certainly is… blue…” they may mutter,
    less than enthusiastically.


    Indeed, the glitz and glam of many of today’s graphic environments, is rather
    sedated. But there is a good reason: think of a plain-ish desktop as a blank canvas
    upon which you can create a desktop that’s purely customized to your needs. Indeed,
    there are so many ways to customize your desktop, and not just through color—you
    will hardly know where to begin.


    That is what this chapter will happily do: provide guidance on how to begin the
    process of making your Fedora desktop truly your own.


    In this chapter, you will:


    +   - Learn more about the development of the GNOME desktop.


    +   - Ensure that your monitor is set at the best resolution.


    +   - Discover how to modify settings for various desktop elements.


    +   - Navigate the GNOME desktop.'
