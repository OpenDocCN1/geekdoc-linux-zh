  md: '# Working with System Logs


    Most Linux systems are configured to log many of the activities that occur on
    those systems. These activities are written to log files in the /var/log directory
    or its subdirectories. This logging is done by the Syslog facility.


    Fedora, RHEL, and CentOS use the syslog (system log daemon) and klogd (kernel
    log daemon) from the syslog package to manage system logging. These daemons are
    started automatically by the syslog init script (/etc/init.d/syslog). Information
    about system activities is cron, and boot.log, based on settings in the /var/log
    directory as messages, secure, and boot.log.


    Automatic log rotation is handled by logrotate, based on settings in the /etc/logrotate.conf
    file and /etc/cron.daily/logrotate cronjob causes this daily log rotating taking
    place.


    You can check any of the log manually (using vi or another favorite text editor).
    However, if the logpackage is installed (it should be by default), highlights
    of your log files will be automatically mailed to your root''s mailbox every day.
    You can change the sender and recipient address of mail by editing the /etc/cron.daily/01logwatch
    file. To prevent e-mail, you should change the sender address to a real-email
    address where the recipient is not on the local machine. Another way to change
    the recipient is to forward root''s email to another address by editing /etc/aliases
    and running neweliases to enact the changes. Otherwise, just log as root and type
    the following to read your logwatch e-messages:


    ```

    # mail

    >U 1 logwatch@joe Sat Jun 16 0432 88/2536 "Logwatch for joe (Linux) "n>&

    ```


    Type 1 to page through the log message. You will see information about SELinux
    audits, system startup, SSH daemon, disk space in each partition, login problems
    caused by PAM, and new packages installed by.


    You can send your own messages to the syslog logging facility using the logger
    command. Here are a couple of examples:


    ```

    # logger Added new video cardMessage added to messages file

    # logger -p info -t CARD -f /tmp/my.txt  Priority, tag, message file

    ```


    In the first example the words "Added new video card" are sent to the messages
    file. In the second example, the priority of the message is set to info, and a
    tag of CARD is added to each line in the message. The message text is taken from
    the /tmp/my.txt file. To see these log entries in real time, use tail -f or less
    described in Chapter 5.'
  merge: -1
