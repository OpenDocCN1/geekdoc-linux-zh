    chris 2678 2645 0 1082 852 Augl tty 00:00:00 /bin/sh startx

    chris 2689 2678 0 602 488 Augl tty 00:00:00 xinit

    chris 2710 2689 0 5504 5440 Augl tty 00:00:09 gnome-session

