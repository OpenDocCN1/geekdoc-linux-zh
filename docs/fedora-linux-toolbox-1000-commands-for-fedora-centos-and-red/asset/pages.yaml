  md: 'In this example, the hardware clock is set to March 18, 2008 at 6:22 p.m. This
    update does not immediately affect the system clock.


    # Using Network Time Protocol to Set Date/Time


    When you install Fedora, RHEL, or CentOS, you are given the opportunity to set
    your system date and time. An option at that time is to use preconfigured Network
    Time Protocol (NTP) servers to automatically get the current date and time when
    your system reboots. If you choose that option, the installer will set up the
    ntpd daemon and use it to keep your system synchronized.


    If you didn''t configure NTP to set the time for your system when you first installed
    your Linux system, you can do so later by turning on the ntpd service. Here is
    how:


    ```

    # yum install ntpd          Install ntpd package if necessary.

    # service ntpd start      Start ntpd service immediately

    # chconfig ntpd on               Set ntpd service to start at each reboot

    ```


    The ntpd service uses information in the /etc/sysconfig/ntpd file. For example,
    by the default date/time from the NTP server is not to reset the hardware clock.
    To have the hardware clock updated, set SYNC_HWCLOCK to yes (SYNC_HWCLOCK=yes)
    in the /etc/sysconfig/ntpd file.


    Whether you installed ntpd manually or let the anaconda installer do it automatically,
    the resulting setup needs to turn your machine into a time server, listening on
    UDP port 123. Unless you have very specific needs (and your own GPS or atomic
    clock), ntpd on system administrators prefer prefer using ntdate (often in a daily
    cronjob) to set their system time via ntp:


    ```

    # ntpd pool.ntp.org

    15 Aug 03:37:12 ntdate[9706]:

    adjust time server 66.92.68.11 offset 0.009204 sec

    ```


    If you running ntdate while ntpd is running, you will get the following error:


    ```

    # ntdate pool.ntp.org

    15 Aug 03:37:00 ntdate[9695]: the NTP socket is in use, exiting

    ```


    Note that the ntdate command has been marked as deprecated and will disappear
    in the future. It has been replaced by the following options of ntpd:


    ```

    # ntpd -g

    ```


    The -q option tells ntpd to exit after setting the clock (as opposed to keep running
    as a daemon). The -g option prevents ntpd from panicking if the system clock is
    off by more than 1000 seconds.'
