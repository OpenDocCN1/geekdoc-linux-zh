    ```

    # /usr/sbin/showmount -e server.example.com

    /export/myshare client.example.com

    /mnt/public *

    ```


    # Mount NFS Shares


    Use the mount command to mount a remote NFS share on the local computer. Here
    is an example:


    ```

    # mkdir /mnt/server-share

    # mount server.example.com:/export/myshare /mnt/server-share

    ```


    This example notes the NFS server (server.example.com) and the shared directory
    from that (/export/myshare). The local point must exist before mounting the share,
    appears at the end of the command (/mnt/server-share).


    Pass NFS-specific options to the mount command by adding them to the -o option:


    ```

    # -o rw,hard,int server.example.com:/export/myshare /mnt/server-share

    ```


    The rw option mounts the remote directory with read-write permissions, assuming
    permission is available. With hard set, someone using the share will see a server
    not responding message when a read or write timeout occurs. If that happens, having
    the int option lets you interrupt a request to a remote server (type Ctrl+c).


    By default, NFS version 3 (nfs3) protocol is used to connect to the share. To
    use NFS version 4, which is designed to work over the Internet and through firewalls,
    indicate that protocol as the file system type command line as:


    ```

    # -t nfs4 server.example.com:/ /mnt/server-share

    ```


    > NOTE Depending on which version of Fedora you are using, the implementation
    of NFS v4 may not be robust enough for production. It may be safer and/or more
    reliable to tunnel earlier versions of NFS over SSH. You can find more Information
    on this topic with an Internet search for "nfs ssh".'
