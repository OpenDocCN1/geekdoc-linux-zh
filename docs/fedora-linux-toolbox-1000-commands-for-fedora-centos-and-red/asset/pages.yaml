    # Monitoring CPU Usage


    An overburdened CPU is another place to look for performance problems on your
    system. The vmstat command, shown early, can produce basic statistics relating
    to CPU usage (user, activity, idle time, I/O wait, and time stolen from a virtual
    machine). The iostat command (from the sysstat package), generate more detailed
    reports of CPU utilization.


