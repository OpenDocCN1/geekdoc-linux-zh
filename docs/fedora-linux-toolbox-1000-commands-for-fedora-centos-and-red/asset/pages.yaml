  md: '# Chapter 4: Working Files


    The -R option is a handy feature of the chmod command. With -R, you can recursively
    change permissions of all files and directories starting from a file system. Here
    are some examples:


    ```

    # chmod 700 /tmp/test      Open permission only to owner below /tmp/test

    # chmod 000 /tmp/test      Close all permissions below /tmp/test

    # chmod -a+rwx /tmp/test  Open permissions to all below /tmp/test

    ```


    Note that the -R option is inclusive of the directory you indicate. So the permissions
    above, for example, would change for the /tmp/test directory itself, and not just
    for the files and directories below that directory.


    # Setting the umask


    Permissions given to a file or directory are assigned originally at the time that
    item is created. How those permissions are set is on the user''s current umask
    value. Using the umask command, you can set the permissions given to files and
    directories when you create them.


    ```

    $ umask 0066      Make directories drw--x--x and files -rw-----

    $ umask 0077      Make directories drwx------ and files -rw------

    $ umask 0022      Make directories drwxr-xr-x and files -rw-r---

    $ umask 0777      Make directories d--------- and files

    ```


    # Changing Ownership


    When you create a file or directory, your user account is assigned to that file
    or directory. So is your primary group. As root user, you can change the ownership
    (user) and group assigned to a different user and/or group using the chown and
    chgrp commands. Here are some examples:


    ```

    # chown chris test/       Change owner to chris

    # chown chris:market test/  Change owner to chris and group to market

    # chgrp market test         Change group to market

    # chown -R chris test/      Change all files below test/ to owner

    ```


    The recursive option to chown (-R) is useful if you need to change the ownership
    of an entire directory structure. With chmod, using chown recursively changes
    permissions for the directory named, along with its contents. You might use chown
    recursively when a person leaves a company or stops using your web service. You
    can use chown -R to reassign their entire /home directory to a different user.


    Related commands for changing group assignments and passwords include newgrp and
    gpasswd, as well as the /etc/gshadow file.'
