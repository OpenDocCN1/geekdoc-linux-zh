    # Finding and Controlling Processes


    Changing a running process first means finding the process you want to change,
    modifying the processing priority or sending the process a signal to change its
    behavior. If you are looking for a particular process, you might find it tough
    to locate it in a large list of processes by ps or top. The grep command offers
    ways of searching through your active processes for the ones you are looking for.
    The ren lets you change the processing priority of running processes. The kill,
    pkill, and killall commands let you send signals to running processes (including
    signals to end processes).


    # Using grep to Find Processes


    In its most basic form, you can use grep to search for a command name (or part
    of one) and produce the process ID of any that includes that. For example:


    ```

    $ pgrep init

    Show PID for any process including ''init'' string

    1

    2689

    ```


    Because we know there is only one init command running, we next use the -l option
    to see each process''s command name (to learn why two processes showed up):


    ```

    $ pgrep -l init

    Show PID and name for any process including ''init'' string

    1

    2689 xinit

    ```


    You can also search for processes that are associated with a particular user.


    ```

    $ pgrep -lu chris

    List all processes owned by user chris

    2551 sshd

    2552 bash

    2803 vim

    ```


    Probably the most useful way to use grep is to have it pipe PIDs to another command
    to produce the output. Here are some examples (look for other commands of metacity
    or firefox aren''t running):


    ```

    $ ps -p `pgrep metacity`

    Search for metacity and run ps (short)

    PID TTY TIME CMD

    ```


