  md: '# Chain 14: Locking Down Security


    Chain PROUTSTING (policy ACCEPT)

    target prot opt source destination

    MASQUERADE all -- 0.0.0.0 0.0.0.0


    Chain OUTPUT (policy ACCEPT)

    target prot opt source destination


    The nat table shown above applies to a feature called Network Address Translation
    (NAT). NAT enables you to do such things as use private addresses behind your
    firewall. The packets from internal LAN exit the firewall, the source private
    address is rewritten with the IP address of the firewall''s external interface.
    The firewall keeps track of these sessions in order to allow the return traffic
    through the LAN machines. This is configured with the MASQUERADE line in the PROUTING
    chain.


    In the example, the DNAT line in the PREROUTING chain allows requests to port
    8785, at IP address 11.22.33.44, to be forwarded to the internal LAN IP address
    10.0.0.155 on port 22 (a trick to let ssh to a computer behind the firewall through
    a non-standard port).


    Here are other examples for listing information about your firewall, the iptables
    command is part of the iptables package.


    ```

    # iptables -nL                   Filter rules, iptables numbers (no DNS lookup)

    # iptables -vL                      Verbose output (with packet/byte counts)

    # iptables -L --line-numbers        Show line number in chain for each rule

    # iptables -nvL --line-numbers      Our Tech Editor''s favorite combination

    # iptstate                          Show top-like listing of iptables entries

    # iptstate -tl                      Same with dns names and totals

    ```


    In Fedora, if iptables is not started you can start iptables manually by typing
    the following:


    ```

    # service iptables start           To start iptables now

    # chconfig iptables on              To set iptables to start at boot time

    ```


    Here is how you can stop or flush all iptables rules on a Fedora system:


    ```

    # iptables -F                      Flush iptables rules

    # service iptables stop            To turn off iptables service now

    # chconfig iptables off             To set iptables to not start at boot time

    ```


    The iptables rules that are reinstated on every reboot are stored permanently
    in the /etc/sysconfig/iptables file. Firewall changes you make with the iptables
    command will be lost on your next reboot if they are not added to this file. Save
    the currently active firewall rules for the permanent /etc/sysconfig/iptables
    file, type one of the following commands:


    ```

    # service iptables save            Permanently save settings

    # iptables-save > /etc/sysconfig/iptables Same as above

    ```'
