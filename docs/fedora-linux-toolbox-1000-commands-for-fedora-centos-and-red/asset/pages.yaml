    \ — Command line sftp client that is part of the PuTTY suite.\n\n# Sharing Remote\
    \ Directories\n\nTools described to this point in the chapter atomic file access,\
    \ where a connection is set up and files are transferred in one shot. In times\
    \ more persistent, access to a remote directory of files is needed, for sharing\
    \ and mounting remote file systems can be most useful. Such services include Network\
    \ File System (NFS), Samba, and SSHFS.\n\n# Sharing Remote Directories with NFS\n\
    \nAssuming a server is already running the NFS service (typing service nfs start\
    \ as root starts it in Fedora), you can use exports and showmount commands to\
    \ see available and mounted shared directories. Mounting a shared directory is\
    \ done with special options to the standard mount command.\n\n# Viewing and Exporting\
    \ NFS Shares\n\nRun from the NFS server, this exports command shows all shared\
    \ directories available from that server:\n\n```\n# /usr/bin/exports -v\n/export/myshare\
    \ client.example.com(ro,wdelay,root_squash,no_subtree_check)\n  <world>(ro,wdelay,root_squash,no_subtree_check)\n\
    /mnt/public\n```\n\nThe two directories being shared are /export/myshare and the\
    \ first is only available to host client.example.com, whereas the second is available\
    \ to everyone. Options for each share are shown in parents. The first share is\
    \ available read-only (ro); writes to the server are delayed to improve performance\
    \ when more writes are exported (wdelay); and requests from the root user on the\
    \ client are mapped into the anonymous UID (root_squash). Also, a shorter check\
    \ of file system permission is done (no_subtree_check). The second share allows\
    \ read-write (rw).\n\nAdd and modify NFS directories by making changes to the\
    \ /etc/exports file. To get changes to effect, apply any of the following as root:\n\
    \n```\n# service nfs reload      Reloaded exported shared directories\n# exportfs\
    \ -r               Reloaded exported shared directories\n# exportfs -rv      \
