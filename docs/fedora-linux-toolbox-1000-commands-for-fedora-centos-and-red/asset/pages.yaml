    # Troubleshooting Network Problems


    Troubleshooting networks is generally done from the bottom layer up. As discussed
    in the beginning of this chapter, the first step is to make sure that the physical
    network layer components (cables, NICs, and so on) are connected and working.
    Next, check that the links between physical nodes are working. After that, there
    are lots of tools for checking the connectivity to a particular host.


    # Checking Connectivity to a Host


    When you have a link and no duplex mismatch, the next step is to ping your default
    gateway. You should have configured the default gateway (gw) in the /etc/sysconfig/network
    file or in the individual network card''s /etc/sysconfig/network-script/ifcfg-eth2
    script. Check your default gateway in the actual routing table, use the ip command
    as follows:


    ```

    # ip route

    10.0.0.0/24 dev eth0 proto kernel scope link src 10.0.0.155

    169.254.0.0/16 dev eth0 scope link

    default via 10.0.0.1 dev eth0

    ```


    The gateway for the default route is 10.0.0.1. To make sure there is IP connectivity
    to the gateway, use the ping command as follows:


    ```

    $ ping 10.0.0.1

    PING 10.0.0.1 (1) 56(84) bytes of data.

    64 bytes from 10.0.0.1: icmp_seq=1 ttl=64 time=0.382 ms

    64 bytes from 10.0.0.1: icmp_seq=2 ttl=64 time=0.313 ms

    64 bytes from 10.0.0.1: icmp_seq=3 ttl=64 time=0.360 ms

    64 bytes from 10.0.0.1: icmp_seq=4 ttl=64 time=1.43 ms

    ```


    ```

    -- 10.0.0.1 ping statistics

    4 packets transmitted, 4 received, 0% packet loss, time 2999ms

    rtt min/avg/mdev = 0.313/0.621/1.432/0.469 ms

    ```


    By default, ping continues until you press Ctrl+c. Other options include the following:


    ```

    $ ping -a 10.0.0.1

    Add an audible ping as ping progresses

    $ ping -c 4 10.0.0.1

    Ping 4 times and exit (default in Windows)

    $ ping -q -c 5 10.0.0.1

    Show summary of pings (works best with -c)

    # ping -f 10.0.0.1

    Send a flood of pings (must be root)

    ```'
