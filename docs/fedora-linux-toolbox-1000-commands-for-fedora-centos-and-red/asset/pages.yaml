    If this sounds useful to you, please read on.


    # About Fedora, Red Hat, and Linux


    Fedora is a Linux operating system that is sponsored by Red Hat, Inc. Its roots
    come from Red Hat Linux, which ended its development life under that name in 2003.
    At that time, Red Hat transitioned its single Red Hat Linux distribution into
    Fedora Core (now called simply Fedora) and Red Hat Enterprise Linux.


    +   - Fedora (http://fedoraproject.org) became the community-driven, rapid-development
    operating system that was distributed for free (as is) six to nine months. The
    goal was to stay on the cutting edge of open source technology, while also providing
    a development platform for enterprise-quality software that could become part
    of Red Hat Enterprise Linux.


    +   - Red Hat Enterprise Linux (RHEL) became the commercial, subscription-based
    Linux operating system produced by Red Hat, Inc (www.redhat.com). The goal was
    to release RHEL on an 18-month schedule. Red Hat has built its product line around
    RHEL, offering support, training, documentation, hardware certification, and other
    products to support RHEL customers. In 2006, Red Hat purchased the open source
    software developer JBoss, so Red Hat can now offer a complete application stack
    composed of middleware running on top of its RHEL product line.


    Because Fedora and RHEL are other operating systems, built on the GNU license,
    people can take the source code from those Linux systems and create their own
    distributions. And that is just what they have. For that reason, the skills you
    learn with Fedora could also help you if you use any of the following operating
    systems:


    +   - CentOS (www.centos.org) — Many Linux consultants who don''t need Red Hat''s
    commercial support and don''t want to pay Red Hat subscription have migrated to
    CentOS. CentOS is a rebuild of RHEL source code, with a goal of 100-percent compatibility
    with RHEL.


    Aside from logos and Red Hat branding (which CentOS removed), applications and
    interfaces would be exactly the same for CentOS and RHEL. Of all the RHEL rebuilds,
    CentOS is the most widely adopted and the one we recommend.


    +   - Yellow Dog Linux (www.yellowdoglinux.com) — Based originally on Red Hat
    Linux, Yellow Dog Linux runs on a variety of Apple hardware (PowerBook, iBook,
    iMac, G3, G4, G5, and on) as well as on PlayStation 3.'
