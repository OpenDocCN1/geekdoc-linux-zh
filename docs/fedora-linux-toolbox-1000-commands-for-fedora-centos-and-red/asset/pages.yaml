  md: '# Chapter 13: Doing Remote System Administration


    # Summary


    If you ever find yourself in a position where you need to administer multiple
    Linux systems, you have a rich set of commands with Linux for remote system administration.
    The Secure Shell (SSH) facility offers encrypted communications between clients
    and servers for remote login, tunneling, and file transfer.


    Virtual Network Computing (VNC) lets one Linux system share its desktop with a
    client system so that the remote desktop appears right on the client''s desktop.
    With tools such as Vino, you can even share a desktop in such a way that the VNC
    server and client can both work from the same desktop at the same time.'
