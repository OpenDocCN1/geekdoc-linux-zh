  md: '# Chapter 12: Accessing Network Resources


    After pressing Enter as instructed, you can see the settings from your smb.conf
    file. Here''s how an entry for the myshare shared directory, earlier in an example,
    may appear in the smb.conf file:


    ```

    [myshare]

    path = /home/francois

    username = francois

    valid users = francois

    hosts allow = einstein

    available = yes

    ```


    This entry allows the Samba user francois to access the /home/francois directory
    (represented by the myshare name) from the host computer einstein. The share is
    being currently available.


    The previous example of testparm showed the entries you entered in the sm.conf
    file. However, it doesn''t show all the default entries you didn''t. You can view
    those using the -v option. Pipe it to the less command to manage the settings:


    ```

    $ testparm -v | less

    ```


    If you want to test a configuration file before it goes live, you can tell testparm
    to use a file other than /etc/samba/smb.conf:


    ```

    $ testparm /etc/samba/test-smb.conf

    ```


    # Sharing Remote Directories with SSHFS


    Another magical trick you can do over the SSH protocol is mount remote file systems.
    Using the SSH file system (sshfs), you can mount any directory from an SSH server
    that your user account can access from your local Linux system. sshfs provides
    encryption of the mount operation as well as all of the data transferred. Another
    cool aspect of sshfs is that it requires no setup on the server side other having
    ssh running.


    Here is a quick procedure for mounting a directory of documents from a remote
    server to a local directory. This only requires that the remote server is running
    SSH, it is accessible, and that the directory you want is accessible to your user
    account on the server. Here we are mounting a directory named /var/docs at the
    host 10.0.0.50 to a mount point /mnt/docs on the local system:


    ```

    # yum install fuse-sshfs

    # mkdir /mnt/docs

    # sshfs chris@10.0.0.50:/var/docs /mnt/docs

    ```


    When you are using the remote directory, you can remove it with the fusermount
    command:


    ```

    # fusermount -u /var/docs

    Unmount remote directory

    ```'
