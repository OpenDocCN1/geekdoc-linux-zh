    # ifconfig wlan0 channel 3 Set the channel to 3

    # ifconfig wlan0 mode Ad-Hoc Change from Managed to Ad-Hoc mode

    # ifconfig wlan0 ap any Use any access point available

    # ifconfig wlan0 sens -50 Set sensitivity to -50

    # ifconfig wlan0 retry 20 Set MAC retransmissions to 20

    # ifconfig wlan0 key 1234-5555-66 Set encryption key to 1234-5555-66

    ```'
