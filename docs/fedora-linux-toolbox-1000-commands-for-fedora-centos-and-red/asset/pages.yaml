    # Using Text-Based E-mail Clients


    Most Mail User Agents (MUAs) are GUI-based these days. So if you began using e-mail
    in the past or perhaps you know Evolution, Kmail, Thunderbird, or (on Windows
    systems) Outlook when it comes to e-mail clients. On the first Unix and Linux
    systems, however, e-mail was handled by text-based applications.


    If you find yourself needing to check e-mail on a remote server or other text-based
    environment, venerable text-based clients are available and still quite useful.
    In fact, some hard-core geeks use text-based clients exclusively, touting their
    efficiency and scoffing at HTML-based messages.


    The mail clients described in this chapter expect your messages to be stored in
    standardbox format on the local system. This means that you are either logged
    into the mail server or you have already downloaded the messages locally (for
    example, using POP3 or similar).


    > NOTE Text-based mail clients can be used to read mail already downloaded by
    other clients. For example, you could open your Evolution mail Inbox file by typing
    mail -f $HOME/.evolution/mail/loc/Inbox.


    # Managing E-mail with mail


    The oldest command, and easiest to use when you just want a quick check for messages
    in the root user''s mailbox on a remote server, is the mail command (/bin/mail).
    Although mail can be used interactively, it is often used for sending script-based
    e-mails. Here are some examples:


    ```

    $ mail -s ''My Fedora version'' chris@example.com < /etc/redhat-release

    $ ps aux | mail -s ''My Process List'' chris@example.com

    ```


    The mail examples just shown provide quick ways to mail off text without having
    to open a GUI mail application. The first example sends the contents of the'
