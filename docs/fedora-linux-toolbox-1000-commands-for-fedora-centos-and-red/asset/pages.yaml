    your drive can burn the media you have, here are some simple crecord commands
    for burning a CD or DVD images:


    ```

    # crecord --dummy home.iso          Test burn without actually burning

    # crecord -v home.iso               Burn CD (default settings) in verbose

    # crecord -v speed+24 home.iso      Set specific speed

    # crecord -pad home.iso               Can''t read track so add 15 zeroed sectors

    # crecord -eject home.iso             Eject CD/DVD when burn is done

    # crecord /dev/cdrw                  Identify drive by device name (may differ)

    # crecord dev0,2 home.iso            Identify drive by SCSI name

    ```


    The crecord command can also burn multi-session CDs/DVDs. Here is an example:


    ```

    # crecord -multi home.iso          Start a multi-burn session

    # crecord --mininfo                  Check the offset for next run

    Using /cdrom of unknown capabilities

    0,93041

    # mkisofs -J -R -o new.iso \        Create a second ISO to burn

    -C 0,93041 /home/chris/more      Indicate start point and new data for ISO

    # crecord new.iso                    Burn data to existing CD

    ```


    You can use multiple -multi burns until the CD is filled. For the final burn,
    don''t use -multi, so that the CD will be closed.


