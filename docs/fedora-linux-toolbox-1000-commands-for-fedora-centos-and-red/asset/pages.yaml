    # Dial-Up Modems


    Although high-speed DSL, cable modem, and wireless LAN hardware have become widely
    available, there are still times when a phone line and a modem are your only way
    to get on the Internet. Linux offers both graphical and command line tools for
    configuring and communicating with modems.


    As with other network connections in Fedora, dial-up modem connections can be
    configured using the Network Configuration window. Most external serial modems
    will work with Linux without any special configuration. However, many hardware
    PCI modems will also work, sometimes called Winmodems will often not work in Linux
    (although some can be configured with special drivers, and are therefore referred
    to as Linmodems).


    Instead of the contortions you go through to get Winmodems working in Linux, we
    recommend that you purchase a modem that connects to an external serial port or
    hardware modem. If you want to configuring your Winmodem yourself, refer to the
    Linmodems site (www.linmodems.org).


    If you are not able to get your modem working from the Network Configuration,
    you can try several commands. First try the wdwialconf command to try to scan
    any modems connected to serial ports and create a configuration file:


