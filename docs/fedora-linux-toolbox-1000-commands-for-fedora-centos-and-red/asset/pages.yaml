- img_proc: true
  md: '# Chapter 14: Locking Down Security


    When you install Fedora, you have the option to enable the firewall on your system.
    This generates an iptables configuration that is a good starting point for simple
    server firewalling, which consists of opening just a few ports for daemons and
    blocking the rest. You can customize this default configuration by editing /etc/sysconfig/iptables
    and using simple copy-and-paste to add or remove ports. To make your changes take
    effect, use the following command:


    ```

    # service iptables restart

    ```


    For complex needs, when iptables is used as the firewall in front of multiple
    machines, we recommend using one of the graphical tools mentioned above. However,
    there are times when either you don''t have a GUI or you need a firewall rule
    that isn''t available through a GUI. In those cases, it''s useful to know the
    syntax of the iptables command to list current rules and add a new rule.


    Before you start messing around your firewall in Fedora, RHEL, or CentOS, you
    should check if the firewall is set up on your system. Here is how to list the
    current rules on your Linux system:


    ```

    # iptables -L

    Display current iptables filter table

    ```


    ```

    Chain INPUT (policy ACCEPT)

    target prot source destination

    ACCEPT udp anywhere anywhere udp dpt:iptables

    ACCEPT tcp anywhere anywhere tcp dpt:iptables

    ACCEPT 0 anywhere anywhere STATE RELATED, ESTABLISHED

    ACCEPT tcp anywhere anywhere STATE NEW tcp dpt:ftp

    ACCEPT tcp anywhere anywhere STATE NEW tcp dpt:ssh

    ACCEPT tcp anywhere anywhere STATE NEW tcp dpt:http

    REJECT 0 anywhere anywhere reject-with-icmp-host-prohibited

    ```


    ```

    Chain FORWARD (policy ACCEPT)

    target prot source destination

    REJECT 0 anywhere anywhere reject-with-icmp-host-prohibited

    ```


    ```

    Chain OUTPUT (policy ACCEPT)

    target prot source destination

    ```


    The example illustrates the default iptables filter table. It shows that packets
    coming into the computer''s network interfaces, packets for Internet Printing
    Protocol (ipp) on tcp protocols are accepted. Likewise, tcp packets matching the
    FTP (ftp), Secure Shell (ssh), and web (http) destination ports are accepted.
    Packets are accepted if they are associated with an established connection. You
    can look at the nat table:


    ```

    # iptables -t nat -L

    Display current iptables nat table

    ```


    ```

