- img_proc: true
  md: '# Backups and Removable Media


    Data backups in Linux were traditionally done by running commands to archive and
    compress the files to back up, writing that backup archive to tape. Choices for
    tools, compression techniques, and backup media have grown tremendously in recent
    years. Tape archiving has, for many, been replaced with techniques for backing
    up data over the network, to other hard disks, or to CDs, DVDs, and other low-cost
    removable media.


    +   ### IN THIS CHAPTER

    **Creating backup archives with tar**

    **Compressing backups with gzip, bzip2, and izop**

    **Backing up over the network with SSH**

    **Doing network back-ups with rsync**

    **Making backup ISO images with mkisof**

    **Burning backup images to CD or DVD with ddrecord and growisofs


    This chapter details some useful tools for backing up and restoring your critical
    data. The first part of the chapter details how to use basic tools such as tar,
    gzip, and rsync for backups.


    # Backing Up Data to Compressed Archives


    If you are coming from a Windows background, you may be used to tools such as
    WinZip and PKZIP, which both archive and compress groups of files in one application.
    Linux offers separate tools for gathering groups of files into a single archive
    (as tar) and compressing that archive for efficient storage (gzip, bzip2, and
    lzop). However, you can also do the two steps by using additional options to the
    tar command.


    # Creating Backup Archives with tar


    The tar command, stands for tape archiver, dates back to early Unix systems. Although
    magnetic tape was the common medium that tar wrote to originally, today tar is
    most often used to create an archive file that can be distributed to a variety
    of media.'
  merge: -1
  pgno: 161
- img_proc: true
  md: '# Chapter 8: Backups and Removable Media


    The fact that the tar command is rich in features is reflected in the dozens of
    options with tar. The basic operations of tar, however, are used to create a backup
    archive (-c), extract files from archive (-x), compare differences between archives
    (-d), and update files in archive (-u). You can also add files to (-r or -a) or
    delete files from (-d) an existing archive, or list the contents of an archive
    (-t).


    > NOTE Although the tar command is available on nearly all Unix and Linux systems,
    it behaves differently on many systems. For example, Solaris does not support
    -z to manage tar archives in gzip format. The Star (ess-tar) command supports
    access control lists (ACLs) and file flags (for extended permissions used by Samba).


    As part of creating a tar archive, you can add options that compress the resulting
    archive. For example, -j to compress the archive in bzip2 format or -z to compress
    in gzip format. Regular tar files end in .tar, while compressed files end in .tar.bz2
    (compressed with bzip2) or .tar.gz (compressed with gzip). If you compress a file
    manually with lzip (see www.lzop.org), the compressed file should end in .tar.lz


    Besides being backups, tar files are popular ways to distribute source code and
    binaries from software projects. That''s why you can expect every Linux and Unix-like
    system to contain the tools you need to work with tar files.


    > One quirk of working with the tar command comes from the fact that tar was created
    before there were standards regarding how options are entered. Although you can
    prefix options with a dash, it isn''t always necessary. So you might see a command
    that begins tar xvf with no dashes to indicate the options.


    A classic example of using the tar command might combine old-style options and
    pipes for compressing the output:


    ```

    $ tar c *.txt | gzip -c myfiles.tar.gz Make archive, zip it, and output

    ```


    The example just shown illustrates a two-step process you might find in documentation
    for Unix systems. The tar command creates (-c) an archive from .txt files in the
    current directory. The output is piped to the gzip command and output to stdout
    (-c), and redirected to the myfiles.tar.gz file. Note that tar is one of the few
    commands which don''t require options to be preceded by a dash (-).


    New tar versions, on modern Linux systems, can create the archive and compress
    the output in one step:


    ```

    $ tar czf myfiles.tar.gz *.txt Create zipped tar file of .txt files

    $ tar czvf myfiles.tar.gz *.txt Be more verbose creating archive

    ```


    textfile1.txt

    textfile2.txt'
  merge: -1
