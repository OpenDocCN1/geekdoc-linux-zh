  md: '# Chapter 14: Locking Down Security


    # Checking on Users


    After you have created accounts, and let those users loose on your computer, you
    can use several commands to keep track of how they are using your computer. Commands
    for checking on user activity on your Linux system are covered in other chapters
    include the following:


    +   - The find command to search the system for files anywhere on the system that
    are owned by selected users (Chapter 4)

    - The du command to see how much disk space has used in selected users'' home
    directories (Chapter 7)

    - Commands such as fuser, ps, and top to find which processes users are running
    (Chapter 9)


    Aside from the commands mentioned, there are commands for checking things who
    is logged into your system and getting general information about the users with
    your system. Here are examples of getting information about logging into your
    system:


    ```

    $ last                    The most recent successful logins

    greek tty3               Sun Aug 5 18:05 still logged in

    chris tty1               Sun Aug 4 13:39 still logged in

    root pts/4              thompson     Sun Aug 5 14:02 still logged in

    chris pts/4              :0           Sat Aug 4 15:47 still logged in

