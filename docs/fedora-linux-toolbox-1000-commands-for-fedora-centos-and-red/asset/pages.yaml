- img_proc: true
  md: '# Chapter 9: Checking and Managing Running Processes


    Note after the at or batch commands you see a secondary at> prompt. Type the command
    you want to run at that prompt and press Enter. After that, you can continue to
    enter commands. When you are done, press Ctrl+d on a line to queue the commands
    you entered to run.


    After the commands are entered, you can check the queue of jobs that are set to
    run by typing the at command:


    ```

    $ atq

    11 Wed Sep 5 21:10:00 2007 a francois

    10 Fri Aug 24 21:10:00 2007 a francois

    8 Thu Aug 23 20:53:00 2007 a francois

    ```


    Regular users can only see their own jobs that are queued. The root user can see
    everyone''s queued jobs. If you want to delete a job from the queue, use the atm
    command:


    ```

    $ atm 11 Delete at job number 11

    ```


    The at and batch commands are for queuing a command to run as a one-shot deal.
    You can use the cron facility to set up commands to run repeatedly. These commands
    are scripted into cron jobs. There is one system crontab file (/etc/crontab).
    Also, you can create a personal crontab file that can launch commands at times
    that the user chooses. To create a personal crontab file, type the following:


    ```

    $ cron -e Create a personal crontab file

    ```


    The crontab -e command opens your crontab (or creates a new one) using the vi
    editor. Here are examples of several entries you could add to a crontab:


    ```

    15 8 * * 1 Mon,Tue,Wed,Thu,Fri mail chris < /var/project/stats.txt

    * * 1,4,7,0 * * / grep .doc$ > /var/sales/documents.txt

    ```


    The first crontab example shows a message to the user named chris directing the
    contents of /var/project/stats.txt into that message. That mail command is run
    Monday through Friday at 8:15 am. On the first day of January, April, July, and
    October, the cron command runs to look every .doc file on the system and sends
    the list of files to /var/sales/documents.txt.


    The last part of each crontab entry is the command that is run. The first five
    fields represent the date and time the command is run. The fields from left to
    right are: (0 to 59), hour (0 to 23), day of the month (0 to 31), month (0 to
    12 or Jan, Feb, Mar, Apr, May, Jun, Jul, Aug, Sep, Oct, Nov, Dec), and day of
    the week (0 to 7 or Sun, Mon, Tue, Wed, Thu, Fri, Sat). An asterisk (*) in a field
    means to match any value for that field.'
