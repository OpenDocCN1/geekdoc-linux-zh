  md: '# Chapter 2: Installing Fedora and Adding Software


    # Verifying Installed Packages


    There are times when you will the behavior of the software installed on a machine.
    For example, when a system has been compromised, the attackers will often replace
    system binaries such as ls or ps with corrupt versions to cover their tracks.
    It becomes useful to check the files on the file system against the information
    stored in the RPM database.


    > NOTE It''s possible that an intruder replaces a key binary file may also have
    tampered with your RPM database. So, use this tool as one way of checking the
    validity of your system, but not necessarily the only way.


    For each file verified, rpm runs multiple checks and displays the series of characters
    at the beginning of the line. A dot means the check was okay. A letter or number
    means the check failed. Table 2-3 shows the most useful checks and the character
    that represent their failure.


    # Table 2-3: RPM Package Verification Failure Messages


    | Letter indicating check failure | Description |

    |---|---|

    | S | File size differs |

    | M | Mode differs: includes permissions and file type |

    | 5 | MD5 checksum differs |

    | U | User ownership differs |

    | G | Group ownership differs |

    | T | mTime (timestamp of last modification) |


    Use the following command to verify all installed packages and filter for files
    with bin in their path:


    ```

    # rpm -Va | grep bin

    S.5...T /usr/bin/curl

    ```


    This shows that the curl binary on the file system has a different size, MD5 checksum,
    and modification time than the one that came with the curl RPM. In other words,
    this file has been replaced. Here are a few other examples using the verify option:


    ```

    # rpm -Vv coreutils               Verbose check files from coreutils

    # rpm -V -f /usr/bin/pr             Verify package containing pr

    # rpm -V -g Applications/Multimedia  Verify packages from selected group

    ```'
  merge: -1
