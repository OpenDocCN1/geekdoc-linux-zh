  md: '# Chapter 2: Installing Fedora and Adding Software


    # Using the rpm Command


    Using the rpm command, any user can query the local RPM database. To use the command
    to install or remove software from your system, you must have root privileges.


    # Installing a Package


    The following command installs a new package located in the current directory.
    Options in this command include i for install, v for verbose, and h for progress
    hash marks.


    ```

    # rpm -ivh rpmforge-release-0.2-2.2.fc5.rf.x86_64.rpm

    Preparing... ########################### [100]

    1:rpmforge-release ########################### [100]

    ```


    The following example installs a new package on the Internet. This approach works
    with http and ftp protocols:


    ```

    # rpm -ivh http://ftp.belnet.net/packages/dries.ullysis.org/fedora/fc5/x86_64/RPM.dries/rpmforge-release-0.2-2.2.fc5.rf.x86_64.rpm

    Retrieving http://ftp.belnet.net/packages/dries.ullysis.org/fedora/fc5/x86_64/RPM.dries/rpmforge-release-0.2-2.2.fc5.rf.x86_64.rpm

    Preparing... ########################### [100]

    1:rpmforge-release ########################### [100]

    ```


    # Upgrading a Package


    If older version of the package is already installed, an error will occur when
    you go to install it. Use -Uvh to upgrade an existing package to a newer version.


    ```

    # rpm -Uvh flash-plugin-9.0.31.0-release.i386.rpm

    ```


    # Removing a Package


    To remove an installed package, use the -e option as follows:


    ```

    # rpm -e rpmforge-release

    ```


    Sometimes on 64-bit systems that have 32-bit packages installed for backwards
    compatibility, you may have two or more versions of a package installed. If you
    get an error when trying to remove one, you might be able to fix that using a
    full package name or by removing all matching packages:


    ```

    # rpm -e avahi-0.6.11-3.fc5

    # rpm -e avahi-0.6.11-3.fc5.i386

    # rpm -e --allmatches avahi-0.6.11-3.fc5

    error: Failed dependencies:

    libavahi-client.so(3) (64bit) needed by (installed)

    vino-2.13.5-2.2.x86_64

    ```'
