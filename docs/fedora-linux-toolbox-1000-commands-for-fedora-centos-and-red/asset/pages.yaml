    # Using Symbolic and Hard Links


    Instead of copying files and directories to different parts of the file system,
    links can be set up to access that same file from multiple locations. Linux supports
    both soft links (called symbolic links) and hard links.


    When you try to create a symbolic link which points to a file or change to a directory
    that is the target of that link. The target has its own set of permissions and
    ownership that you cannot see from the symbolic link. The symbolic link can exist
    on a different disk partition than the target. The symbolic link can exist, even
    if the target doesn''t.


    A hard link can only be used for files (not directories) and is basically a way
    of giving multiple names to the same physical file. Every physical file has at
    least one hard link, which is commonly thought of as the file itself. Any additional
    names (hard links) that point to that single file must be on the same partition
    as the original file (in fact, one way to tell that hard links are that they all
    have the same inode number). Changing permissions, ownership, date/time stamps,
    or content of any hard link to a file results in all others being changed as well.
    However, deleting one link will not remove the file; it will continue to exist
    until the last link to it is deleted.


    Here are examples of the ln command to create hard and symbolic links:


    ```

    $ myfile

    $ ln myfile myfile-hardlink

    $ ln -s myfile myfile-symlink

    $ ls -li *

    292007 -rw-xr-r-- 3 francois francois 0 Mar 25 00:07 myfile

    292007 -rw-xr-r-- 3 francois francois 0 Mar 25 00:07 myfile-hardlink

    292008 l lwxrxrwx 2 francois francois 6 Mar 25 00:09 myfile-symlink

    ```


