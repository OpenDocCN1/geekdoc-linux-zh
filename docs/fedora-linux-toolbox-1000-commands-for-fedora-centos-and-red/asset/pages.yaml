    # Using the yum Command


    Use the yum command to do most of the activities for getting, installing, upgrading,
    checking, and searching for packages from yum repositories for Fedora. The command
    has many options for dealing with packages individually or in groups.


    > NOTE If you prefer to use a GUI tool, the Package Manager window is built on
    top of the yum family. To start it, select Applications Add/Remove Software or
    run the pirut command as root. New features for Fedora 7 make it easy to search,
    and browse available packages, and then select the ones you want to remove.


    The following sections provide examples of some yum command lines.


    # Finding Packages


    There are lots of options to yum for finding information about specific packages
    or searching repositories for specific packages or components. Use the option
    to list packages meeting your criteria, in the following examples:


    +   * yum list available List packages available to be installed

    * yum list installed List packages already installed

    * yum list extras List packages not installed from any repo

    * yum list *vorbis List packages with *vorbis in title

    * yum list updates List packages that have updates available


    Use the info option to see package descriptions from repos. Here are some examples:


    +   * yum info wordpress Description for wordpress package

    * yum info word* Descriptions for packages beginning with "word"


    To search packages for a string that appears in the description, packager, package
    name, or summary of the package, use the search option as follows:


    +   * yum search mp3 Search for packages including the "mp3* string


    To search packages for a file or other feature and list the packages found, use
    the whatprovides option. For example:


    +   * yum whatprovides ogg123


    ```

    vorbis-tools.i386 1:1.1.5-fc7 installed

    Matched from:

    /usr/bin/ogg123

    /usr/share/doc/vorbis-tools-1.1.1/ogg123rc-example

    /usr/share/man/man1/ogg123.gz

    ```'
