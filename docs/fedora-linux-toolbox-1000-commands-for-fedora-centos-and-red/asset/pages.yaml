  md: '# Chapter 10: Managing the System


    Similar information about your processor(s) is collected by the system at the
    very beginning of the boot process, and can be obtained by looking at the beginning
    of your /var/log/dmesg file.


    # Monitoring Storage Devices


    Basic information about storage space available to your Linux file systems can
    be seen using commands such as du and df (as described in Chapter 7). If you want
    details about how your storage devices are performing, however, commands as vmstat
    and iostat can be useful.


    Some of the kind of output from the iostat command earlier can be used to tell
    if bottlenecks occur while doing read and writes. Here''s an example:


    ```

    $ iostat 3    Check disk reads and writes per disk

    Linux 2.6.21-3194fc (davinci)    08/11/2007

    ```


    | avg-cpu    user  %user %wiostat  steal  idle |

    | 13.15      0.60  0.16       0.00  85.49 |

    | Device:    tps   BkB/s  Blkrt/s   BkB_read  Blkrt/n |

    | sda         1.09   42.14     58.94 16086324 2955342 |

    | sdb         0.29    5.27     11.23 2644482 561348 |

    | avg-cpu    user  %user %wiostat  steal  idle |

    | 1.00       0.00  4.15       0.00  11.71 |

    | Device:    tps   BkB/s  Blkrt/s   BkB_read  Blkrt/n |

    | sda                 411.37    6651.05    2.68 198880 8 |

    | sdb                 68.20     2.68 14696.99      0 43994 |

    | avg-cpu    user  %user %wiostat  steal  idle |

    | 0.67       0.00  41.50      0.00  0.00 |

    | Device:    tps   BkB/s  Blkrt/s   BkB_read  Blkrt/n |

    | sda                 239.67  52530.6   106.67 157592 320 |

    | sdb                 236.00     0.00 55077.33      0 165232 |


    The first part of the output of iostat shows averages of CPU usage since the last
    reboot. The next part reports occur when a large amount of data is copied from
    the first disk (sda) to the second disk (sdb). High iostat values indicate disk
    input/output is the bottleneck on the system. In other words, disk writing would
    improve performance than a faster CPU.


    The vmstat command can also list statistics about your devices. Here''s an example
