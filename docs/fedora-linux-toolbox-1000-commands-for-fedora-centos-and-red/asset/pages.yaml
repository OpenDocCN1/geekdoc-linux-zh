    server. For example, log in as the user (in this example, francois or chris) and
    type the:


    ```

    $ vi -/.vnc/xstartup

    ```


    When editing that file, remove the comment characters from two lines so they appear
    as:


    ```

    unset SESSION_MANAGER

    exec /etc/X11/xinit/xinitrc

    ```


    Older versions of the VNC software, the file may not exist. So create it and add
    the two lines above. After creating the file, set its permissions as follows:


    ```

    # chmod 755 -/.vnc/xstartup

    ```


    Then, for the change to take effect, you need to restart the VNC server. As root
    user, type:


    ```

    # service vncserver restart

    ```


    # Using VNC on Untrusted Networks with SSH


    VNC is considered to be an insecure protocol. The password is sent using fairly
    weak encryption, and the rest of the session is not encrypted at all. For that
    reason, using VNC over an untrusted network or Internet, we recommend tunnel it
    SSH.


    For a general description of how the SSH service works, refer to the “Doing Remote
    Login and Tunneling with SSH” section earlier in this Chapter. To forward VNC
    display 2 (port 5902) on the computer myserver, to the same local port, type the
    following:


    ```

    $ ssh -L 5902:localhost:5902 myserver

    ```'
