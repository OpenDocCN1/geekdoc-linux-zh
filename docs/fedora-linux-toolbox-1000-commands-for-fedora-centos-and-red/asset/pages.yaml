  md: '# Chapter 7: Administering File Systems


    | sysfs | /sys sysfs defaults 0 0 |

    | proc | /proc defaults 0 0 |

    | /dev/VolGroup00/LogVol01 | swap defaults 0 0 |

    | /dev/sda | /mnt/windows vfat noauto 0 0 |


    All the systems are mounted automatically, except for /dev/sda (as indicated by
    the noauto option). The root (/) and hard disk partitions are configured as logical
    volume management (LVM). LVM makes it easier to move or join physical partitions,
    while still retaining the volume ID. Pseudo systems (not associated with a partition)
    include devpts (an interface to pty terminals), sysfs (information from 2.6 kernel),
    and proc (kernel information implemented prior to 2.6 kernel). The /dev/sda disk
    partition was added manually in this example to mount the Windows partition on
    that device.


    The /etc/fstab file typically holds information about removable media. That''s
    because hardware abstraction layer (HAL) facility automatically detects removable
    media and mounts those media in appropriate points in the /media directory (based
    on such things as volume ID on the media).


    Table 7-2 describes each field in the /etc/fstab file.


    # Table 7-2: Fields in /etc/fstab File


    | Field | Description |

    | 1 | The device name representing the file system. Originally, this contained
    the device name of the partition to mount (such as /dev/sda). It can now contain
    a LABEL or universally unique identifier (UUID), instead of a device name. |

    | 2 | The mount point in the file system. The file system contains all data from
    the mount point down the directory tree structure, unless another file system
    is mounted at some point beneath it. |

    | 3 | The file system type. See Table 7-1 for a list of many common file system
    types. |

    | 4 | The mount command options. Examples of mount options include noauto (to
    prevent the file system from mounting at boot time) and ro (to mount the file
    system read-only). To let any user mount a file system, you could add the user
    or owner option to this file. Commas separate options. See the mount command usage
    (under the -o option) for information on supported options. |

    | 5 | Dump file system? This field is only significant if you run backups with
    dump. A number 1 signifies that the file system needs to be dumped. A zero means
    it doesn''t. |

    | 6 | File system check? The number in this field indicates whether or not the
    file system needs to be checked with fsck. A zero indicates that the file system
    should not be checked. A number 1 means that the file system needs to be checked
    first (this is used for the root file system). A number 2 assumes that the file
    system can be checked at any point after the root file system is checked. |'
