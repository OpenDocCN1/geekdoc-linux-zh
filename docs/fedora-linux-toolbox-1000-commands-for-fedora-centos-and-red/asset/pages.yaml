  md: '# Chapter 9: Checking and Managing Running Processes


    # # Listing Active Processes


    To see which processes are currently running on a system, most people use the
    ps and top commands. The ps command gives you a snapshot (in a simple list) of
    processes running at the moment. The top command offers a screen-oriented, constantly
    updated listing of running commands, sorted as you choose (by CPU use, memory
    use, UID, and so on).


    # # Viewing Active Processes with ps


    Every Linux system (as well as every system derived from Unix, such as BSD, Mac
    OS X, and others) includes the ps command. Over the years, many different versions
    of ps have appeared, offering slightly different options. Because ps dates back
    to the first Unix systems, it supports nonstandard ways of entering some options
    (for example, allowing you to drop the dash before an option in some cases).


    The different uses of ps shown in this chapter work on Fedora, RHEL, CentOS, and
    most other Linux systems. Here are some examples of running processes for the
    current user (Table 9-1 lists column output of ps):


    ```

    $ ps                          List processes of current user at current shell

    PID TTY CMD

    2552 pts/0                   00:00:00

    3438 pts/0                   00:00:00

    ```


    ```

    $ ps -u chris               Show all chris'' running processes (simple output)

    PID TTY TIME COMMAND

    2678 tty 00:00:00 startx

    2689 tty 01:00:00 xinit

    2710 tty 01:06:00 gnome-session

    ```


    ```

    $ ps -u chris               Show all chris running processes (with CPU/MEM)

    USER PID %CPU %MEM VZ RSS TTY STAT TIME COMMAND

    chris 2678 2645 0.0 438 852 tty S+ Augl 04 00:00 /bin/sh startx

    chris 2689 2678 0.0 241 488 tty S+ Augl 04 00:00 xinit

    chris 2710 2769 0.0 1221 5496 tty S Augl 04 00:09 gnome-session

    ```


    ```

    $ ps -U Chris               Show all chris running processes (with SZ and PR)

