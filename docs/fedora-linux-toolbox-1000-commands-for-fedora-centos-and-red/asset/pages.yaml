  md: '# Chapter 1: Starting with Fedora Linux


    +   Other RHEL and Fedora rebuild — Other rebuilds of RHEL include Lineox (www.lineox.net)
    from Finland and Scientific Linux (www.scientificlinux.org), which was created
    by Fermilab of the U.S. Department of Energy. Linux distributions such as those
    mentioned were created primarily to allow an organization that relied on Red Hat
    Linux to roll their own enterprise-quality distribution for their organization''s
    needs.


    There is a larger list of Linux distributions built on Fedora and RHEL at DistroWatch
    (http://distrowatch.com/dwres.php?resource=independence). Other Linux systems
    have also drawn heavily from technology developed least in part by Red Hat. For
    example, distributions such as Mandriva, PLinuxOS, and Linsp use the RPM package
    management system described in this book for managing software packages, descriptions
    of rpm in Chapter 2 will help you with Mandriva, PLinuxOS, and Linspire as well.


    # Comparing Fedora to Other Linuxes


    Fedora is the rapid-development, cutting edge Linux system, as compared with the
    more stable, less-often-updated Red Hat Enterprise Linux. The speed at which Fedora
    is developed (with a new release every six months) makes it perfect for the Fedora
    enthusiast who want the latest software and can deal with some level of instability.


    Using Fedora Linux might be the best way to learn Linux if you have an eye towards
    becoming a Linux professional. With its short development cycle, you can be assured
    that you have the newest cool features to use. Because Red Hat uses Fedora for
    its commercial software, the skills you learn will scale nicely to the largest
    enterprise computing environments.


    Besides Red Hat, Novell is the other major corporation that is marketing Linux
    in the enterprise market. Novell''s operating systems follow the same basic dual-distribution
    model, with SUSE Linux as the basis of its commercial products and OpenSUSE as
    its free, community-driven Linux system. however, question Novell''s long-term
    commitment to open source of because its 2006 "covenant not to use" with Microsoft
    (see www.novell.linux/microsoft/covenant.html).


    Debian is considered to be a high-quality Linux distribution with a strong commitment
    to the ideals of open source software. Any derivative Linux distributions, such
    as the popular Ubuntu Linux and the KNOPPIX CD, are based on Debian. Although
    Debian is good for use in small business, the project doesn''t have the same enterprise
    infrastructure (training, support, documentation, and so on) that is built around
    RHEL. However, Ubuntu has begun offering paid enterprise-level support contracts
    (www.ubuntu.com/support/paid).'
