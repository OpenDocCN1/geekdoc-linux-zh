  md: "# Chapter 14: Locking Down Security\n\nNow that you know how to start, stop,\
    \ list, and save settings related to your system's iptables facility, you might\
    \ want to see some examples of how the iptables command can be used to change\
    \ rules on an active firewall:\n\n```\n# iptables -A INPUT -p TCP \\\n  -d eth0\
    \ \\\n  --destination-port 25 \\\n  -j ACCEPT \\\n\n# iptables -t nat \\\n  -A\
    \ POSTROUTING \\\n  -o eth0 \\\n  -j SNAT \\\n  --to-source 11.22.33.1\n```\n\n\
    Add filter input rule for TCP packets \\\non the first Ethernet interface \\\n\
    destined for mail service port (25) \\\n  to accept those packets when encountered\n\
    \nAdd nat rule \\\nPOSTROUTING chain \\\nfor packets received on eth0 interface\
    \ \\\n  jump to network address translation \\\n  using outgoing address 11.22.33.1\n\
    \nOf the two examples, the first creates a rule that allows incoming requests\
    \ to your system on port 25. This is presumably because you have configured your\
    \ computer as a mail server (with sendmail, postfix, or other SMTP service). The\
    \ second example creates a NAT table to allow the firewall to do Source Network\
    \ Address Translation (SNAT). The SNAT feature lets you have private IP addresses\
    \ behind your firewall that can communicate with the public Internet using the\
    \ firewall's external IP address.\n\nTo use SNAT or any other format of NAT, you\
    \ must also enable IP forwarding on the machine. This can be done by changing\
    \ the following:\n\n```\n# echo 1 > /proc/sys/net/ipv4/ip_forward  Allow port\n\
    ```\n\nTo make the change permanent across reboots, edit the /etc/sysctl.conf\
    \ file and change the following variable:\n\n```\nnet.ipv4.ip_forward = 1\n```\n\
    \nIn cases you have an Internet-facing service on a machine behind your firewall,\
    \ you can instruct the firewall to forward requests for that service to that machine.\
    \ The following example uses a feature called port forwarding to pass requests\
    \ for a service through the firewall to the destination machine behind the firewall:\n\
    \n```\n# iptables -t nat -A PREROUTING \\\n  -p tcp -d 11.22.33.1 \\\n  --dport\
    \ 80 \\\n  -j DNAT \\\n  --to-destination 10.0.0.2\n```\n\nAdd nat PREROUTING\
    \ rule \\\n  accept tcp requests on 11.22.33.1 \\\n  for port 80 (Web service)\
    \ \\\n  jump to the DNAT target \\\n  forward those packets to 10.0.0.2\n\nYou\
    \ can create many other types of rules to change how your firewall behaves. Refer\
    \ to the iptables man page or the Netfilter web site (www.netfilter.org) for further\
    \ information on using the iptables facility.\n\n258"
