    # Using awk and cut to Process Columns


    Another massive text processing tool is the awk command. Although there is much
    more you can do with the awk command, the following examples show you a few tricks
    to extracting columns of text:


    ```

    $ ps awk | awk ''{print $1,$11}''               Show columns 1, 11 of ps

    $ ps awk | awk ''/francois/ (print $11)''      Show francois'' processes

    $ ps awk | awk ''{print $1,$11}''                   Same as above

    ```


    The first example displays the contents of the first column (user name) and eleventh
    column (command name) from currently running processes out the ps (ps awk). The
    next two commands produce the same output, with one using the awk command and
    the other using the grep command to find all processes by the user named francois.
    In each case, processes owned by francois are found, column 11 (name) is displayed
    for each of those processes.


    By default, the awk assumes the delimiter between columns is spaces. You can specify
    a delimiter with the -F option as follows:


    ```

    $ awk -F: ''{print $1,$5}'' /etc/passwd      Use colon delimiter to print cols

    ```


    You can get similar results with the cut command. As with the previous awk example,
    we specify a colon (:) as the column delimiter to process information from the
    /etc/passwd file:


    ```

    $ cut -d: -f1,5 /etc/passwd              Use colon delimiter to print cols

    ```


    The cut command can also be used with ranges of fields. The following command
    prints columns 1 thru 5 of the /etc/passwd file:


    ```

    $ cut -d: -f1-5 /etc/passwd          Show columns 1 through 5

    ```


    Instead of using a dash (-) to indicate a range of numbers, you can use it to
    print all columns from a particular column number and above. The following command
    displays all columns from column 5 and above from the /etc/passwd file:


    ```

    $ cut -d: -f5- /etc/passwd           Show columns 5 and later

    ```


