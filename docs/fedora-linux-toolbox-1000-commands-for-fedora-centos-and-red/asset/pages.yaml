  md: '# # Moving Around in vi


    The first thing to get used to vi is that you can''t just start typing. Vi has
    multiple modes that enable you to perform a different set of tasks. You start
    a vi session in Normal mode, where vi is waiting for you to type a command to
    get started. While you are in Normal mode, you can move around the file, to position
    where you want to be in the file. To enter or modify text, you need to go into
    Insert or Replace modes.


    Assuming vi is open with a file that contains several pages of text, Table A-1
    shows some keys and combinations you can type to move around the file while in
    normal mode.


    # ### Table A-1: Keystroke Commands for Moving Around


    | Key | Result | Key | Result |

    | PageDown or Ctrl+f | Move down one page | PageUp or Ctrl+b | Move up one page
    |

    | Ctrl+d | Move down half page | Ctrl+u | Move up half page |

    | Shift+g | Go to last line of file | :1 | Go to first line of file (use any number
    to go to that line) |

    | Shift+h | Move cursor to screen top | Shift+l | Move cursor to screen bottom
    |

    | Shift+m | Move cursor to middle of screen | Ctrl+l | Redraw screen (if garbled)
    |

    | Enter | Move cursor to beginning of the next line | - | Move cursor to beginning
    of the previous line |

    | Home or $ | Move cursor to end of line | End or ^ or 0 | Move cursor to line
    beginning |

    | ( | Move cursor to beginning of previous sentence | ) | Move cursor to beginning
    of next sentence |

    | { | Move cursor to beginning of previous paragraph | } | Move cursor to beginning
    of next paragraph |

    | w | Move cursor to next word (space, new line, or punctuation) | Shift+w | Move
    cursor to next word (space or new line) |'
