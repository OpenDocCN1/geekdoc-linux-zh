    # Listing, Joining, and Adding Files to tar Archives


    So far, all we''ve done with tar is create and unpack archives. There are also
    options for listing the contents of archives, joining archives, adding files to
    an existing archive and deleting files from an archive.


    To list an archive''s contents, use the -t option:


    ```

    $ tar tvf myfile.tar      List files from uncompressed archive

    --rw-r--r-- root/root      9584 2007-07-05 10:21:33 textfile1.txt

    --rw-r--r-- root/root      9584 2007-07-09 10:23:44 textfile2.txt

    $ tar tfvf myfile.tgz      List files from gzip compressed archive

    ```


    If the archive were tar archive compressed with lzo and named myfile.tar.lzo,
    you could use tar -lf file''s contents as:


    ```

    $ tar --use-compress-program=lzo myfile.tar.lzo List archives

    ```


    To concatenate one file to another, use the -A option. The following command results
    results in the contents of archive2.tar being added to the archive1.tar archive:


    ```

    $ tar -Af archive1.tar archive2.tar

    ```


    Use the -r option to add one or more files to an existing archive. In the following
    example, myfile is added to the archive.tar archive file:


    ```

    $ tar rvf archive.tar myfile Add a file to a tar archive

    ```


    You can use wildcards to match multiple files to add to your archive:


    ```

    $ tar rvf archive.tar *.txt Add multiple files to a tar archive

    ```'
