  md: '# Chapter 10: Managing the System


    your computer''s virtual memory, processor, storage devices, and network interfaces
    are being used on your system.


    There are commands that can monitor several different aspects of your system''s
    resources. Because this book is not just a page, however, we have divided the
    sections by topic (monitoring memory, CPU, and storage devices) rather than by
    the commands they do (top, vmstat, and iostat).


    > NOTE Many of the applications described in this section are installed by default
    in Fedora, in packages such as the procps package. To use iostat or sar, however,
    you need to install the sysstat package.


    # Monitoring Memory Use


    Few things will kill system performance faster than running out of memory. Commands
    as free and top let you see information about how your RAM and swap are being
    used. The vmstat command gives detailed information about how memory can run continuously.
    The slabtop command can show how much memory the kernel (slab cache) is consuming.


    The free command provides the quickest way to see how much memory is being used
    on your system. It shows the total amount of RAM (Mem:) and swap (Swap:), along
    with the amount being used. Here are examples of the free command:


    $ free List usage in kilobytes (-k default)

    | | used free shared buffers cached |

    | Mem: 742476 | 725108 | 17368 | 0 | 153388 | 342544 |

    | -/+ buffers/cache: | 229176 | 513300 |

    | Swap: 1020116 | 72 | 10200456 |


    $ free -m List usage in megabytes

    | | used free shared buffers cached |

    | Mem: 725 | 706 | 18 | 0 | 148 | 333 |

    | -/+ buffers/cache: | 223 | 501 |

    | Swap: 996 | 996 |


    $ free -b List usage in blocks

    | | used free shared buffers cached |

    | Mem: 76209524 | 74251092 | 17784832 | 0 | 157114368 | 357065056 |

    | -/+ buffers/cache: | 234631668 | 526542556 |

    | Swap: 104459784 | 73728 | 104452056 |


    $ free -mt List usage with totals displayed (Swap + Mem)

    | | used free shared buffers cached |

    | Mem: 725 | 708 | 16 | 0 | 149 | 334 |

    | -/+ buffers/cache: | 223 | 501 |

    | Swap: 996 | 996 |

    | Total: 1721 | 708 | 1013 |


    $ free -s List usage in gigabytes

    Continuously display memory usage every 5 seconds


    To avoid wasting RAM and speed up applications'
