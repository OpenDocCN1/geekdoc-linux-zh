    # Searching for Files


    Fedora keeps a database of all files in the file system (with a few exceptions
    defined in /etc/updated.conf) using features of the mlocate package. The locate
    command allows you to search databases. The database is built back instantly,
    since most Linux users run the find command to find files in the file system.
    Both locate and find are covered here.


    # Finding Files with locate


    Because the database contains the name of every node in the file system, and not
    just commands, you can use locate to find commands, man pages, devices, data files,
    or anything else identified by name in the file system. Here is an example:


