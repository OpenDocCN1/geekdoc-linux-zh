  md: '# Chapter 10: Managing the System


    The following sections describe commands for modifying the boot loader, startup
    scripts, and run levels associated with your Linux system.


    # Using the GRUB Boot Loader


    Assuming GRUB was set up when you first installed Fedora, the settings for your
    boot loader are stored in `/boot/grub/grub.conf`. (You may find some references
    to `/etc/grub.conf`, but that is a symlink to the same.).) changes you make to
    the file are picked up automatically when you reboot Fedora. Here''s an example
    of the contents of the `/boot/grub/grub.conf` file:


    ```

    default=0

    timeout=5

    splashimage=(hd0,0)/boot/grub/splash.xpm.gz

    hiddenmenu

    title Fedora (2.62-1.1394.fc7)

    root (hd0,0)

    kernel /2.62-1.1394.fc7 root=LABEL=/1 rhgb quiet

    initrd /initrd-2.62-1.1394.fc7.initrd.img

    ```


    This example shows only one bootable operating system (Fedora). The default=0
    line says the first entry is booted by default. The timeout=5 line says that GRUB
    passes five seconds at the splash screen before booting. The image on splash screen
    is a compressed xpm file (splash.xpm.gz) from the /boot/grub/ directory on the
    first partition of the hard disk (hd0,0). The hiddenmenu indicates that you won''t
    see the list of bootable titles when the boot splash screen appears (press a key
    during the kernel period to see the menu).


    The actual boot entry (title Fedora) points to the first partition of the hard
    disk (hd0,0), which contains the kernel and initial RAM disk (initrd) to be booted.
    To change how kernel boots work, you can add options to the end of the kernel
    line. You can add new title entries to boot kernels or operating systems.


    Some available boot options are described in Table 2-1 in Chapter 2. You might
    want to add to the end of the kernel line include 3 (to boot runlevel 3, text
    mode) or ide=nodma (to turn off DMA if you are having hard disks).


    In normal circumstances, you don''t need to run any commands to have changes to
    grub.conf picked up by your boot loader. When you reboot, the grub.conf file is
    read directly from the hard disk. However, if the MBR becomes corrupted for reason
    and your system won''t boot, you may need to reload the boot loader.


    To reinstall GRUB on your hard disk''s MBR, boot a Fedora live CD or install CD
    in rescue mode and follow the instructions to change root (chroot) to the hard
    partition containing your Fedora system. Then, assuming you''re booting from your
    computer''s first SATA hard disk, type the following to reload the boot loader
    to the MBR:


    ```

    # grub-install /dev/sda

    ```


    179'
