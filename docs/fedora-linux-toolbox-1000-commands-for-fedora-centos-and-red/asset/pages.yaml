  md: '# Chapter 4: Working with Files


    Or send all errors to the /dev/null bucket:


    ```

    $ find / -name e100 -print 2 >/dev/null

    ```


    Because searches with find are case sensitive and must match the name exactly
    (e100 won''t match e100.ko), you can use regular expressions to make your searches
    more inclusive. Here''s an example:


    ```

    $ find /-name ''e100*'' -print

    lib/modules/2.6.20-1.2982.fc7/kernel/drivers/net/e100

    ```


    You can also find files based on timestamps. This command line finds files in
    /usr/bin/ that have been accessed in the past two minutes:


    ```

    $ find /usr/bin/-amin -2 -print

    /usr/bin/

    /usr/bin/find

    ```


    This finds files that have not been accessed in /home/chris for more than 60 days:


    ```

    $ find /home/chris/-atime +60

    ```


    Use the -type option to find directories. The following command line finds all
    directories under /etc and redirects stderr to the bucket (/dev/null):


    ```

    $ find /etc -type d -print 2 >/dev/null

    ```


    This command line finds files in /sbin with permissions that match 750:


    ```

    $ find /bin/-perm 750 -print

    ```


    The exec option to find is very powerful, because it lets you find all the files
    found with the command. The following command finds all files in /var owned by
    the user francois (must be a valid user) and executes the ls -l command on each
    one:


    ```

    $ find /var -user francois -exec ls -1 {} \

    ```


    An alternative to the command''s exec option is xargs:


    ```

    $ find /var -user francois -print | xargs ls -1

    ```


    There are differences on how the two commands just shown operate, leading to a
    very different performance. The find -exec spawns the command ls for each result
    finds. The xargs command works more efficiently by passing many results as input
    to a single ls command.


    To negate a search criterion, place an exclamation point (!) before that criterion.
    The next example finds all the files that are not owned by the group root and
    are regular files, and then does an ls -1 on each:


    ```

    $ find ! -group root -type f -print 2 /dev/null | xargs ls -1

    ```


