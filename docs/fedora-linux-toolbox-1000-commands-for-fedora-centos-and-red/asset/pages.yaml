    If you just want to see the IP address of a host computer, use the +short option:


    ```

    $ dig +short www.turbosphere.com Display only name/IP address pair\nturbosphere.com.\n66.113.99.70

    ```


    You can use dig -x to perform a reverse lookup to find DNS information based on
    an IP address:


    ```

