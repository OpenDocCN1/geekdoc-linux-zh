    | Character | Description |

    | --- | --- |

    | ~ | Refers to the $HOME directory. |

    | ~+ | Value of the shell variable PWD (working directory). |

    | ~- | Refers to the previous working directory. |

    | . | Refers to the current working directory. |

    | .. | Refers to the directory above the current directory. Can be used repeatedly
    to reference several directories up. |

    | $param | Used to expand a shell variable parameter. |

    | cmd1 `cmd2` or | cmd2 is executed first. The call to cmd2 is substituted with
    the output of cmd2, and cmd1 is executed. |

    | cmd1 > | Redirects standard output to command. |

    | cmd1 < | Redirects standard input to command. |

    | cmd1 >> | Appends standard output to file command, without erasing its contents.
    |

    | cmd1 | cmd2 | Pipes the output of one command to the input of the next. |

    | cmd1 & | Runs the command in the background. |

    | cmd1 && cmd2 | Runs first command, if it returns a zero exit status, runs the
    second command. |

    | cmd1 | cmd2 | Runs first command, if it returns a non-zero exit status, runs
    the second command. |

    | cmd1 ; cmd2 | Runs the first command and when it completes, runs the second
    command. |


    # Using Shell Variables


    You identify a string of characters as a parameter (variable) by placing a $ in
    front of it (as in HOME). Shell environment variables hold information that is
    used by the shell itself, as well as commands you run from the shell. Not all
    environment variables will be populated by default. Some of these variables can
    change (such as the default printer in $PRINTER or your command prompt in $PS1).
    Others are managed by the shell (such as $PWD). Table B-2 contains a list of many
    useful shell variables.'
