    lftp example.com:-> cd /home/chris/songs Change to a local directory

    lftp example.com:-> cd pub/uploads Change to server directory

    lftp example.com:-> mkdir songs Create directory on server

    lftp example.com:-> chmod 700 songs Change remote perms

    ```


