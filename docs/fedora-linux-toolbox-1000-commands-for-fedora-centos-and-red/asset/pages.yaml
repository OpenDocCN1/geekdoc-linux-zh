  md: '# Chapter 6: Playing with Multimedia


    Here are some interesting ways to create thumbnails with the convert command:


    ```

    $ convert -thumbnail 120x120 a.jpg a-a.png

    $ convert -thumbnail 120x120 -polaroid 8 a.jpg a-b.png

    $ convert -thumbnail 120x120 -polaroid 8 -rotate 8 a.jpg a-c.png

    ```


    All examples create a 120 × 120 thumbnail. The second adds the -polaroid option
    to put a border around the thumbnail, so it looks like a Polaroid picture. The
    last example sets the -polaroid angle to 8 so that the image slightly askew. Figure
    6-1 shows the results of these three examples.


    ![](img/f31d58b45db9cf626cd14878d271e531_130_0.png)


    Figure 6-1: Use convert to create a thumbnail, Polaroid, and angled Polaroid.


    Besides the things you can do to make images useful and manageable, there are
    also ways of making your images fun and weird. Here are some examples:


    ```

    $ convert -sepia-tone 75% house.jpg oldhouse.png

    $ convert -charcoal 5 house.jpg char-house.png

    $ convert -colorize 175 house.jpg color-house.png

    ```


    The -sepia-tone option gives the image an "old west" sort of look. The -charcoal
    option makes the image look as if it were hand-drawn using charcoal. By using
    the -colorize option, every pixel in the image is modified by the colorize number
    provided (175 in this case). Figure 6-2 shows the original house picture in the
    upper-left corner, the sepia in the upper-right, the charcoal in the lower-left,
    and the colourized house in the lower right.


    If you are looking for one more example of weird image conversions, try swirling
    your image. For example:


    ```

    $ convert -swirl 300 photo.pcx weird.pcx

    ```


    # Converting Images in Batches


    Most of the image conversions described in this chapter can be done quite easily
    using a graphical image manipulation tool like the GIMP. However, where the convert
    commands can really shine when you use them in scripts. Instead of resizing, rotating,
    writing on, or colorizing a single file, you can do any (or all) of those things
    to a whole directory of files.'
