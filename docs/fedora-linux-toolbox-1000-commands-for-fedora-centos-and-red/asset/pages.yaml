- img_proc: true
  md: '# Chapter 9: Checking and Managing Running Processes


    The SIGKILL (9) signal, used generously by trigger-novice administrators, should
    be reserved as a last resort. It does not allow the target process to cleanly
    but forces it to end abruptly. This can potentially result in loss or corruption
    of data handled by that process. The SIGHUP signal was originally used on Unix
    systems to indicate that a terminal was disconnected from a mainframe (such as
    from hang-up of a dial-in modem). However, daemon processes, such as sendmail
    and httpd, were implemented to catch SIGHUP signals as an indication that those
    processes should read configuration files.


    # Running Processes Away from the Current Shell


    If you want a process to continue running, even if you disconnect from the current
    shell session, there are several ways to go about doing that. You can use the
    nohup command to run a process that is impervious to a hang-up signal:


    ```

    $ nohup updatedb & Run updatedb with no ability to interrupt

    # nohice -9 gcc hello.c & Run gcc uninterrupted and higher priority

    ```


    Using nohup is different than running the command with an ampersand & with nohup
    the command will keep running, even if you exit the shell that launched the command.


    The nohup command was commonly used in the days of slow processors and dial-up
    connections (so you didn''t have to log in to an expensive connection while a
    long complete alone). Also, today using tools as screen (described in Chapter
    14) you can keep a shell session active, even after you disconnect your network
    connection to shell.


    # Scheduling Processes to Run


    Commands associated with the cron facility can be used to set a command to run
    at a specific time (including now) so that it is not connected to the current
    shell. The at runs a command at the time you set:


    ```

    $ at now +1 min Start command running in one minute

    at> updatedb

    at> <Ctrl+d> <EOT>

    job 5 at Mon Aug 20 20:37:00 2007

    $ at teatime Start command at 4pm today

    $ at now +5 days Start a command in five days

    $ at 06/25/08 Start a command at current time on June 25, 2008

    ```


    Another way to run a command that''s not connected with the current shell is with
    the batch command. With batch, you can set a command to start as soon as the processor
    is ready (load average below .8):


    ```

    $ batch Start command running immediately

    at> find /mnt/isos | grep jpg$ > /tmp/mypypics

    at> <Ctrl+d> <EOT>

    ```'
