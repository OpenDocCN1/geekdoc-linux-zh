    +   For Fedora 7, Fedora Core and Fedora Extras were merged into a single, online
    repository. Different installation sets are available for Fedora 7, such as a
    GNOME live/install CD, KDE live/install CD, and an installation DVD. Choose the
    set of media that best suits your need. Use online repositories to download and
    install other packages you you need.


