  md: '# Chapter 14: Locking Down Security


    # Using Advanced Security Features


    A dozen or pages covering security-related commands are not nearly enough to address
    the depth of security tools available to you as a Linux system administrator.
    Beyond the commands covered in this chapter, here are descriptions of some features
    you may want to look into to secure your Linux system:


    +   **Security Enhanced Linux (SELinux):** The SELinux feature provides a means
    of securing files, directories, and applications in your Linux system in such
    a way that exploitation of one of those areas is used to breach other areas. For
    example, if intruders were to compromise your web daemon, they wouldn''t necessarily
    be able to compromise the rest of the system. SELinux was developed by the U.S.
    National Security Agency (NSA), who hosts a FAQ at www.nsa.gov/selinux/info/faq.cmf.


    SELinux can be enabled when you install Fedora, RHEL, or CentOS. To protect selected
    services with SELinux, you can use the Security Level Configuration window. Simply
    enable SELinux, and then check the services you want enabled on the SELinux tab
    of that window. SELinux can be configured from the CLI.


    +   **Central logging:** If you''re managing a couple of Linux servers, it becomes
    preferable to have all your logs to a central syslog server. When you implement
    your syslog server, you may want to explore using syslog-log. Also, if you outgrow
    logwatch, you should consider using a log parser such as Splunk.


    +   **Tripwire:** Using the tripwire package, you can take a snapshot of all the
    files on your system, then later use snapshot to find out if any of those files
    have been changed. This is particularly useful to find out if any applications
    have been modified that should not have been. First, you take a baseline of your
    system file. Then at regular intervals, you run a tripwire integrity check to
    see if any of your applications or configuration files have been modified.


    +   **RPM database:** Another way to check if any of your applications have been
    modified is using the rpm command to validate the applications and configuration
    files you have installed on your system. Using rpm -V, you can verify the size,
    MD5sum, permissions, and ownership of every item in an RPM package. Chapter 2
    for information on ownership of rpm to verify the contents of installed RPM packages.


    +   **chkrootkit:** If you suspect your system has been compromised, download
    and build chrootkit from www.chkrootkit.org. This will help you detect rootkits
    that may have been used to take over your machine. We recommend you run chrootkit
    from a LiveCD or after mounting the suspected drive on a clean system.


    260'
  merge: -1
  pgno: 290
- img_proc: true
  md: '# Summary


    Although there are many tools available for securing your Linux system, the first
    line of security starts with securing the user accounts on your system and the
    services that run on your system. Commands such as useradd, groupadd, and password
    are standard tools for setting up user and group accounts.


    Because most serious security breaches outside your organization can come from
    intruders accessing your systems on public networks, setting up secure firewalls
    the iptables facility provides the firewall features that are built into the Linux
    kernel.


    To keep track of activities on your system, the Syslog facility logs information
    about nearly every aspect of the actions that take place on your system. Packages
    that are installed by default, such as logrotate and logwatch, make it easy to
    manage and do daily checks on your system logs.'
  merge: -1
