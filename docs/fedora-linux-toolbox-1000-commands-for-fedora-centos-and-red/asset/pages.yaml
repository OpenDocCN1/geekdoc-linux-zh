  md: '# Chapter 10: Managing the System


    # Trying Other Date/Time Commands


    There are a few extraneous commands you can use to work with time settings on
    your system. The clockdiff command can be used to check the difference between
    the date/time on your system and that on another. For example:


    ```

    # clockdiff pool.nt.org  Compare clocks on local/remote

    host=pool.nt.org rtt=63(0)ms/60ms delta=4ms/5ms

    --- Aug 12 16:35:25 2007

    ```


    A pride of among enthusiasts is how long they can keep their Linux systems without
    having to reboot. Linux systems are known to run for years without having to reboot.
    The time that a Linux system has been running since the previous reboot is referred
    to as uptime. You can check your system''s uptime as follows:


    ```

    uptime Check how long your system has been running

    6:53pm up 19 days, 14:25, 3 users load=1.66, 0.88, 0.35

    ```


    The output of uptime shows the current time, how many days and hours the system
    has been up, and how many users are currently logged in. After that, uptime shows
    the system load over the last 1-, 5-, and 15-minute time periods.


    # Managing the Boot Process


    When a computer starts up, the basic input/output system (BIOS) looks to its boot
    order settings to determine where the operating system to boot. Typically, if
    a bootable medium has not been inserted into a removable drive (CD, DVD, floppy
    disk, and so on), the BIOS looks to the master boot record (MBR) of the first
    bootable hard disk. At this point, for most Linux systems, the boot process is
    handled by the boot loader.


    For Fedora, CentOS, and, in fact, most Linux systems these days, the Grand Unified
    Boot Loader (GRUB) is the boot loader that is used by default. GRUB is a replacement
    for LILO, which was the most popular Linux boot loader during the 1990s. GRUB
    can be set up to boot only your Linux system, but also to boot any other operating
    systems installed on your hard disks (Windows, BSD, or others). GRUB can also
    include boot options with each bootable operating system to refine the boot process,
    such as turn on or off support for a particular type of hardware.


    Once a Linux is selected to boot from the boot loader, the boot loader loads the
    kernel. The following dilemma occurs: the kernel needs to mount the root file
    system on the hard drive. This requires the appropriate storage drivers (block
    device modules). And these devices are located on your hard drive! To break this
    cycle, a small initial ram (initrd) containing the block device modules is mounted
    by the boot loader. This allows the Linux kernel to read the root file system.
    After that, the init process takes over and begins starting the system services,
    based on the run level that is set for the system.


    178'
