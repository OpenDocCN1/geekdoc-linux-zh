    and 9.

    Compression levels for bzip2 behave differently.


    To uncompress a gzipped file, you can use the gzip command. Use either of the
    following examples:


    ```

    $ gzip -v myfile.gz           Unzips myfile.gz and renames it myfile

    file.gz:                      86.0% -- replaced with myfile

    $ gzip -dv myfile.gz           Same as previous command line

    ```


    Although the examples shown refer to zipping regular files, the same options can
    be used to compress tar archives.


    # Compressing with bzip2


    The bzip2 command is considered to provide the highest compression among the compression
    tools described in this chapter. Here are some examples of bzip2:


    ```

    $ bzip2 myfile                Compresses file and renames it myfile.bz2

    $ bzip2 -v myfile             Same as previous command, but more verbose

    file: 9,529:1, 0.840 bytes/byte, 89.51% saved, 334045 in, 35056 out.

    $ bzip2 -d myfile.gz          Uncompresses file and renames myfile

    $ bzip2 -dv myfile.gz         Same as previous command

    $ bzip2 -v myfile.bz2         Same as previous command, but more verbose

    file.bz2: done

    ```


    # Compressing with lzop


    The lzop command behaves differently from gzip and bzip2. The lzop command is
    best in cases where compression speed is more important than the resulting compression
    ratio. When lzop compresses the contents of a file, it leaves the original file
    (unless you use -u), but creates a new file with a .enzo suffix. Use either of
    the following examples of the lzop command to compress a file called myfile:


    ```

    $ lzop -v myfile            Leave myfile, create compressed myfile.enzo

    compressing myfile into myfile.enzo

    $ lzop -U myfile             Remove myfile, create compressed myfile.enzo

    ```


