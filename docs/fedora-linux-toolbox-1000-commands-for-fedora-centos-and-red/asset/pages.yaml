  md: '# Chapter 8: Backups and Removable Media


    to share encryption keys, you can transfer files between them without entering
    passwords for each transmission. That fact lets you create scripts to back up
    your data from an SSH client to an SSH server, without any manual intervention.


    From a central Linux system, you can gather backups from multiple client using
    SSH commands. The following example runs the tar command on a remote site (and
    compress the files), pipes the tar to standard output, and uses the ssh command
    to copy the backup locally (over ssh) with tar:


    ```

    $ mkdir mybackup ; cd mybackup

    $ ssh francis@server1 ''tar cf - myfile*'' | tar xvf -

    francis@server1''s password: *****

    myfile1

    myfile2

    ```


    In the example just, all files being copied with myfile from the home directory
    of francois are placed in the current directory. Note that the left side of the
    pipe creates the archive and the right side expands the files from the archive
    to the current directory. Keep in mind that ssh will overwrite local files if
    they exist, which is why we created an empty directory in the example.


    To reverse the process and copy files from the local system to the remote system,
    we run a local tar command. First time, however, we add a cd command to put the
    files in the directory of our choice on the remote machine:


    ```

    $ tar cf - myfile | ssh francois@server1 \

    ''cd /home/francois/folder; tar xvf -''

    francis@server1''s password: *****

    myfile1

    myfile2

    ```


    In this next example, we''re not going to untar the files on the receiving end,
    but instead write the rules to tgz files:


    ```

    $ ssh francois@server1 ''tar czf - myfile*'' | cat > myfiles.tgz

    $ tar cvf - myfile | ssh francois@server1 ''cat > myfiles.tgz''

    ```


    The first example takes all files beginning with myfile from the francois''s home
    directory, server1, tar compresses the files, and directs those compressed files
    to the myfiles.tgz file on the local system. The second example does the reverse
    by taking all files beginning with myfile in the local directory and sending them
    to a myfiles.tgz file on the remote system.


    The examples just shown are good for copying files over the network. Besides improving
    compression they also enable you to use any tar features you choose, such as incremental
    backup features.'
