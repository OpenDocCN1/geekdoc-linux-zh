    Keep in mind that standard FTP clients are insecure because they do all their
    work in clear text. So your alternative, especially when securing a major issue,
    is to use SSH tools to transfer files.


    # Using SSH Tools to Transfer Files


    SSH utilities are among the most important tools in a system administrator’s arsenal
    of communications commands, some of the more complex uses of configuring and using
    SSH utilities are covered in Chapter 13. However, in their most basic form, SSH
    utilities are the tools you should use most often for basic file transfer.


    In particular, the scp command will do most of what you need to get a file from
    one computer to another, while making communication safe by encrypting both the
    password and data transfer stage of the process. The ssh command replaces the
    rcp command as the most popular tool for host-host copy files.


    > WARNING! You do not get a warning before overwriting existing files with scp,
    so be sure that the target host doesn''t contain any files or directories you
    want in the path of your scp copy files.


    # Copy Remote Files with scp


    To use scp to transfer files, the SSH service (usually the sshd daemon) must be
    running on the remote system. Here are some examples of useful scp commands:


    ```

    $ scp myfile francois@server1:/tmp/

    Password: *****

    $ scp server1:/tmp/myfile .

    Password: *****

    ```


    Copy file to server

    Copy remote myfile to local working directory'
