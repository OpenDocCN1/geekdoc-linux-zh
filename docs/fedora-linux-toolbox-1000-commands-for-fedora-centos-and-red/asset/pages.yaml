    As with most FTP clients, type help or ? to see a list of available commands.
    Like-wise, you can use common shell-type commands, such as cd, ls, get, put, and
    quit, to get around the SMB host.


    # Mounting Samba Shares


    You can mount remote Samba shares on your local file system as much as you would
    a local file system or remote NFS system. To mount the share:


    ```

    # mount -t cifs - username=francois,password=MySecret \ //192.168.1.1/myshare
    /mnt/myshare/

    ```


    > NOTE The Samba file system (smbfs) is deprecated and should no longer be used.
    Instead, indicate CIFS (-t cifs) as the file system type when you mount a remote
    Samba share.'
