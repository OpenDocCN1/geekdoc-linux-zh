    existed during the previous backup (now in backup-old), a hard link is created
    between the file in the backup-current directory and backup-old directory.


    You can save a lot of space by having hard links between files in your backup
    and backup-current directory. For example, if you had a named file.txt in both
    directories, you could check that both are the same physical file by listing the
    files'' inodes:


    ```

    $ ls -i /var/backups/backup*/file1.txt

    26061 /var/backups/backup-current/file1.txt

    26061 /var/backups/backup-old/file1.txt

    ```


    # Backing Up with unison


    Although the rsync command is to back up one machine to another, it assumes the
    machine being backed up is the only one where the data is being modified. What
    if you have two machines that modify the same file and you want to sync those
    files? Unison is a tool that will let you do that.


    It''s common for people to work with the same documents on their laptop and desktop
    systems. Those machines might run even different operating systems. Because Unison
    is a cross-platform application, it can sync files that are on Linux and Windows
    systems. To use Unison, you must install the unison package (the yum install command).


    With unison, you can define two roots representing the two paths to synchronize.
    Those roots can be local or remote over ssh. For example:


    ```

    $ unison /home/francois ssh://francois@server1/home/fcaen

    $ unison /home/francois /mt/backups/francois-homedir

    ```


    Unison contains both graphical and command-line tools for doing backups. It will
    try to run the graphical version by default. This may fail if you don''t have
    a desktop running or if you''re launching unison from screen. To force unison
    to run in command line, add the -ui text option as:


    ```

    $ unison /home/francois ssh://francois@server1//home/fcaen -ui text

    Contacting server...

    francois@server1''s password:

    Looking for changes

    Waiting for changes

    Reconciling changes

    local        server

    newfile ---> memo.txt {f} y

    Propagating updates

    ...

    ```'
  merge: -1
