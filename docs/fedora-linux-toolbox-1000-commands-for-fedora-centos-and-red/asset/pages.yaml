  md: '# Chapter 7: Administering File Systems


    loader and kernel, and a root file system partition. The boot and root file system
    partitions are usually an ext3 file system type.


    The ext3 file system is based on the ext2 file system type, adding a feature called
    journaling to its predecessor. Journaling can improve data integrity and recovery,
    especially after unclean shutdowns. Time-consuming file system checks are avoided
    during the next reboot after an unclean shutdown, because the changes that occurred
    since the most recent write to disk are saved and ready to be restored.


    Most of the examples in this chapter use ext3 file systems to illustrate how a
    file system is created and managed. However, there are times when you might want
    to use other file system types. Table 7-1 lists different file system types and
    describes when you might want to use them.


    # Table 7-1: File Systems Supported in Linux


    | File System Type | Description |

    |---|---|

    | ext3 | Most commonly used file system with Linux. Contains journaling for safer
    data and fast reboots after unintended shutdowns. |

    | ext2 | Predecessor of ext3, but doesn''t contain journaling. |

    | iso9660 | Evolved from the High Sierra file system (which was the original standard
    on CD-ROM). May contain Rock Ridge extensions to allow iso9660 file systems to
    support long names and other information (permissions, ownership, and links).
    |

    | Jfs2 | Journaling Flash File System version 2 (JFS2) that is designed for efficient
    operations on USB flash drives. Successor to JFS2. |

    | jfs | JFS file system that IBM used for OS/2 Warp. Tuned for large file systems
    and high-performance environments. |

    | mdos | MS-DOS file system. Can be used to mount older MS-DOS file systems, as
    those on old floppy disks. |

    | ntfs | Microsoft New Technology File System (NTFS). Useful when file systems
    need to share files with newer Windows systems (as with dual booting or removable
    drives). |

    | reiserfs | Journaling file system that used to be by default on some SUSE, Slackware,
    and other Linux systems. Reiserfs is not well-supported in Fedora or RHEL. |

    | squashfs | Compressed, read-only file system used on many Linux live CDs. |

    | swap | Used on swap partitions to hold data temporarily when RAM is currently
