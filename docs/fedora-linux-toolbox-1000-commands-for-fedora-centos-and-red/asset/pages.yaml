    In the first example, stdout is redirected to the file output.txt, while stderr
    is directed to the screen. In the second example, stderr (stream 2) is directed
    to errors.txt while stdout goes to the screen. In the third example, the first
    two are combined. The last example directs both streams to the everything.txt
    file. To append to a file instead, use two greater-than signs:


    ```

