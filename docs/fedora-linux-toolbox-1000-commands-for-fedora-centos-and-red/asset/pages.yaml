  md: '# Chapter 10: Managing the System


    Because the system in this example booted directly to run level 3, there is no
    previous run level (n). To change the current run level, you can use the init
    command:


    ```

    # init 5    Change the current run level to 5 (X Desktop)

    ```


    In this example, the current run level changes from the previous level (in this
    case, 3) to run level 5 (starts the X Window graphical interface). You can also
    use the q option to the init command to reexamine the /etc/initabb file and start
    or stop processes based on changes made to that:


    ```

    # init q    Start or stop processes in initabb

    ```


    Note that init q does not start or stop System services. It is used most when
    tinkering with the gettyys daemon in initabb.


    To manage services, you can use the chconfig and service commands. For example,
    to start the Samba service immediately, you could type this:


    ```

    # service smb start    Start Samba service immediately

    Starting SMB services:      [ OK ]

    ```


    The service command starts the init script named (smb in this example) from the
    /etc/init.d directory. Most of these scripts support start and stop options, where
    some other features are also shown. Here''s how to use service to start and stop
    services:


    ```

    # service smb             Show usage statement (with options)

    Usage: /etc/init.d/smb [start|stop|restart|reload|status|config]

    # service smb restart Restart Samba service (first off, then on)

    Shutting SMB services:      [ OK ]

    Shutting NMB services:      [ OK ]

    Starting SMB services:      [ OK ]

    Starting NMB services:      [ OK ]

    # service smbbdrestart Restart Samba service (already running)

    Shutting SMB services:      [ OK ]

    Shutting NMB services:      [ OK ]

    Starting SMB services:      [ OK ]

    Starting NMB services:      [ OK ]

    # service smb reload     Reload settings in smb.conf file

    Reloading smb.conf file: [ OK ]

    # service smbd status    Check if the Samba service is running (smbd)

    smbd [2591:25915] is running...

    # service smb stop       Stop Samba service

    Shutting SMB services:      [ OK ]

    Shutting NMB services:      [ OK ]

    ```


    Any of the init scripts contained in /etc/init.d can be started in this, but not
    all scripts support all the features shown. Most init scripts, will show their
    usage with no option (as shown in the first example above).


    # 181'
