    Direct file contents to another file

    Append file contents to another file

    Display consecutive blank lines as one

    Show line numbers with output

    Show line numbers only on non-blank lines


    However, if your block of text is more than a few lines long, using cat by itself
    becomes impractical. That''s when you need better tools to look at the beginning
    or end, or page through the entry.


    To view the top of a file, use head:


    ```

    $ head myfile.txt

    $ cat myfile.txt | head

    ```


    Both of these command lines use the head command to output the top 10 lines of
    the file. You can use the line count as a parameter to display any number of lines
    from the beginning of a file. For example:


    ```

    $ head -n 50 myfile.txt

    $ ps auxw | head -n 15

    ```


