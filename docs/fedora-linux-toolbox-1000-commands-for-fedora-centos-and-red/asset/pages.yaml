- img_proc: true
  md: '# Chapter 12: Accessing Network Resources


    Instead of supporting large, recursive downloads (as wget), curl is designed for
    single-shot file transfers. It does, however, support more protocols (as noted)
    and some advanced features. There are some few examples of file transfers with
    curl:


    ```

    $ curl -O ftp http://kernellog.mirrors.tds.net/pub/linux/kernel/v1.0/patch[6-8].sign

    $ curl -O0 http://kernellog.mirrors.tds.net/pub/linux/kernel/v2.6/\nChangeLog-2.6.(1,4)

    $ curl -O ftp ftp://chris:Mypasswd8ftp.example.com/home/chris/fileA \

    -Q "DELETE fileA"

    $ curl -T install.log ftp://chris:Mypasswd8ftp.example.com/tmp/\

    -Q "NRFR install.log" -Q "RTO Xinstall.log

    $ curl --ftp ftp.kernel.org/%2fpub/

    ```


    The first two commands show how to use square brackets to indicate a range [6-8]
    and curly brackets for a list [1, 4] of characters or number to match files.


    The third command illustrates how to use a user name and password (chris:Mypasswd),
    download a file (fileA) from the server, and then delete the file on the server
    which is done (-Q ''DELETE fileA'').


    The fourth example uploads (-T) install.log to an FTP server. It renames the file
    to Xinstall.log. The last example tells curl to list the contents of the /pub/
    directory via ftp.kernel.org.


    # Transferring Files with FTP Commands


    Fedora comes with the standard FTP client (ftp command), that works the same way
    it does on most Unix and Windows systems. We recommend using the full-featured,
    user-friendly lftp instead. The ftp command replaces nftp, which was the default
    FTP client delivered with older Red Linux distributions, due to licensing issues.


    With these FTP clients, you open a session to the FTP server (as opposed to grabbing
    a file, as do with wget and curl). You may navigate the server as you would a
    local file system, getting and putting documents across the network connection.
    Here are examples of how to connect to FTP server with ftp:


    ```

    $ ftp mirrors.kernel.org

    lftp mirrors.kernel.org:>

    $ ftp francrois@example.com

    Authenticated connection

    $ ftp example.com:>

    $ ftp -u francisco example.com

    Authenticated connection

    Password: *****

    $ ftp example.com:>

    $ ftp -u francrois.Mypwd example.com

    Authentication with password

    lftp ftp example.com:>

    $ lftp

    Start lftp with no connection

    lftp :-> open mirrors.kernel.org

    Start connection in lftp session

    lftp mirrors.kernel.org:->

    ```


    213'
