  md: "# Chapter 14: Locking Down Security\n\n# # Modifying User Accounts\n\nAfter\
    \ a user is created, you can change values for that account with the usermod command.\
    \ Most are the same ones you would use with useradd. For example:\n\n```\n# usermod\
    \ -c \"Thomas Lotto\" tlot Change user's name in comment field\n# usermod -s /bin/sh\
    \ joeq Change default shell to sh\n# usermod -l swanson Lock the user account\
    \ named swanson\n# usermod -u travis Unlock user account named travis\n```\n\n\
    Note that these two examples lock and unlock a user account, respectively. Locking\
    \ a user account does not remove the user's account from the system or delete\
    \ any of the user's files and directories. However, it keeps the user from logging\
    \ in. Locking an account can be useful if an employee is leaving the company,\
    \ but the work in that employee's files needs to be passed to another person.\
    \ Under these circumstances, locking the user instead of deleting prevents the\
    \ files owned by that user from appearing belonging to an unassigned ID.\n\nBecause\
    \ a regular user cannot use the usermod or usermod command, there are special\
    \ commands for changing personal information. Here are examples:\n\n```\n$ chsh\
    \ -s /bin/sh Change current user's shell to /bin/sh\n$ chsh -s /bin/francois Change\
    \ a user's shell to /bin/sh\n$ chfn -f \"Francois Caen\" \\ Change full name\n\
    \  -o \"B-205\" \\ Change office number\n  -h 212-555-1212 \\ Change home phone\
    \ number\n  -p 212-555-1957 Change office phone number\n```\n\n$ finger finger\n\
    Login: francois Name: Francois Caen\nDirectory: /home/francois Shell: /bin/bash\n\
    Office: B-205, 212-555-1212 Home Phone: 212-555-1957\nOn since Sat Aug 4 13:39\
    \ (CDT) on tty 4 seconds idle\nNo mail.\nNo Plan.\n\nThe information changed above\
    \ with the chfn command and displayed with finger are stored in the fifth field\
    \ of the /etc/passwd for the selected user. (/etc/passwd can only be edited by\
    \ the root user, and should only be edited using the vipwd command and extreme\
    \ caution.)\n\n# # Deleting User Accounts\n\nWith the userdel command, you can\
    \ remove user accounts from the system, as well as other files (home directories,\
    \ mail spool files, and so on) if you choose. Here are examples:\n\n```\n# userdel\
    \ jimbo Delete user, not user's home directory\n# userdel -r lily Delete user,\
    \ home directory, and mail spool\n```"
