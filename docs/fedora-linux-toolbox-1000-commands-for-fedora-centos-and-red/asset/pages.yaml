    # Looking Up Samba Hosts


    NetBIOS names are used to identify hosts in Samba. You can determine the IP address
    of a computer using the nmblookup command to broadcast for a particular NetBIOS
    name on the local subnet as follows:


    ```

    $ nmblookup thompson

    queryinging on 192.168.1.255

    192.168.1.1 server<0>

    ```


    To find the IP address for a specific subnet, use the -U option:


    ```

    $ nmblookup -U 192.168.1.255 server1

    querying server1 on 192.168.1.255

    192.168.1.1 server<0>

    ```


    # Checking Samba Configuration


    If you are unable to use a Samba server, or if you have other problems communicating
    with your Samba server, you can testpar command can be used to check your Samba
    configuration file (smb.conf):


    ```

    $ testpar

    Load smb config files from /etc/samba/smb.conf

    Processing section "[homes"

    Processing section "[printers]"

    Processing section "[myshare]"

    Loaded services file OK.

    Server role: ROLE_STANDALONE

    Press Enter to see a dump of your service definitions

    ```'
