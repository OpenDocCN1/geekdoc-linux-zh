  md: '# Chapter 2: Installing Fedora and Adding Software


    # Rebuilding Your RPM Database


    If your RPM database becomes corrupted to the point where you can no longer install
    packages, you can rebuild the database from the installed package headers. First
    remove the old database, and then rebuild the new ones:


    ```

    # rm /var/lib/rpm/__db.0*

    # rpm --rebuilddb

    ```


    For further information on using the rpm command, check the rpm man page (man
    rpm) or display help information (rpm --help).


    # Building RPMs from SRPMs


    By rebuilding the source code that is used to build an RPM package, you can change
    it to better suit the way you use the software. To begin, you need to get the
    source RPMs (SRPMs) you want to modify and install the rpm-build package (yum
    rpm-build).


    For example, you could download and install the rpmforge-release SRPM package
    in the current directory by typing the following command:


    ```

    # wget http://dl.fedorapro.org/packages/rpmforge-release/rpmforge-release-0.3-6.1.sr.rpm

    # mkdir -p /usr/src/redhat/SOURCES

    # rpm -ivh rpmforge-release-0.3-6.1.sr.rpm

    ```


    When a source code package (src.rpm) is installed, rpm places the files it contains
    in the default build tree under the /usr/src/redhat directory. If you have development
    tools packages and the rpm-build package installed, you can rebuild the binary
    RPM from this package. You can make changes to the spec file or the source code
    of that package, and then rebuild the package using the command shown in the following
    example:


    ```

    # rpmbuild -bb /usr/src/redhat/SPECS/rpmforge-release.spec

    ```


    The result of this command is an RPM file that is output to a directory that is
    specific to your computer architecture: /usr/src/redhat/RPMS/arch, where arch
    is replaced by a name indicating the computer architecture (such as i386, i586,
    and so on). The resulting RPM file is ready to be installed.


    # Extracting Files from RPMs


    An RPM is basically an archive of files that you want to install to your computer
    and some header information that identifies the software (descriptions, checksums,
    build information, and so on). You can remove the archive from an RPM package
    and output the archive to a cpio archive.'
  merge: -1
  pgno: 61
- img_proc: true
  md: '# Chapter 2: Installing Fedora and Adding Software


    The cpio format is similar to the tar format, described in Chapter 8, and can
    be similarly used for backing up and transporting files. Here''s an example using
    the rpm2cpio command to extract the cpio archive from an RPM:


    ```

    * rpm2cpio rpmforge-release-0.3.6-1.rf.x86_64.rpm > rpmforge-release.cpio

    ```


    In this example, the software archive contained within the rpmforge-release RPM
    package is extracted to a cpio archive named rpmforge-release.cpio. Instead of
    sending the output of the rpm2cpio command to a cpio archive file, you can pipe
    it through the `cpio -tv` command to view a list of the contents of that archive:


    ```

    * rpm2cpio rpmforge-release-0.3.6-1.rf.x86_64.rpm | cpio -tv

    ```


    The results of the preceding command can also be produced by the rpm command.
    For example, `rpm -qlvp rpmforge-release-0.3.6-1.rf.x86_64.rpm` produces the identical
    output of the rpm2cpio command line shown.


    To extract a single file from an RPM file, you can use `rpm2cpio` with a `cpio
    -idv` command that indicates the file you want. In the following command, the
    `rpmforge.yum` file is extracted to the `usr/doc/rpmforge-release-0.3.6` directory
    in the current directory.


    ```

    * rpm2cpio rpmforge-release-0.3.6-1.rf.x86_64.rpm \

    | cpio -idv ./usr/doc/rpmforge-release-0.3.6/rpmforge.yum

    ```


    If you try this example, the package you get will have different version numbers
    and the specific rpm-release directory you must match that one exists.


    # Summary


    Software for Fedora and other Red Hat-based distributions is packaged in RPM format.
    The anaconda installer is used to initially install Fedora. Using boot options,
    you can choose different install types and adapt to different environments. To
    install additional software, you can use the `yum` command to get packages from
    online repositories. To install packages locally or query and verify installed
    packages, you can use the `rpm` command.'
