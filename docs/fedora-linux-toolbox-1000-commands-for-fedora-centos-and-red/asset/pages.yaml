    # Using Public Key Logins


    Here''s the process for setting up key-based communications between two Linux
    systems. The following example, we use empty passphrases for no-password logins.
    If you prefer to use your key with a passphrase, simply enter it when prompted
    during the first step (key pair creation).


    On the client system, run the ssh-keygen command to generate the key pair while
    logged in as the user who needs to initiate communications


    ```

    $ ssh-keygen

    Generating public/private r key pair.

    Enter file in which to save the key (/home/chris/.ssh/id_rsa): <Enter>

    Enter passphrase (empty for no passphrase): <Enter>

    Enter passphrase again: <Enter>

    Your identification has been saved in /home/chris/.ssh/id_rsa.

    Your public key has been saved in /home/chris/.ssh/id_rsa.pub.

    The key fingerprint is:

    ac:db8:a4:e8:f3:2a:90:4f:05:f9:b4:44:db3db chris@host.domain.com

    ```


    Note that at each prompt, you pressed the Enter to create the default key file
    name and enter (and verify) an empty passphrase. You now have a private key that
    you need to keep very safe, especially since in this procedure you didn''t protect
    it with a passphrase.'
