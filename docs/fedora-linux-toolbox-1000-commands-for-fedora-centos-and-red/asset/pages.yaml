    The 0 in the mode line can usually be dropped (so you can use 777 instead of 0777).
    That place holder has special meaning. It is an octal digit that can be used on
    commands (executables) to indicate that the command can run as a set-UID program
    (4), run as a SET-GID program (2), or become a sticky program (1). With set-UID
    and set-GID, the command runs with the assigned user or group permissions (instead
    of running with the permission of the user or group that launched the command).


    > **WARNING!** SUID should not be used on shell scripts. Here is a warning from
    the Linux Security HOWTO "SUID shell scripts are a serious security risk, and
    for this the kernel will not honor them. Regardless of how secure you think the
    shell script is, it can be exploited to give the cracker a root shell."


    Having the sticky bit on a directory keeps users from removing or renaming files
    from that directory that they don''t own (/tmp is an example). Given the right
    permission settings, however, users can change the contents of files they don''t
    own in a sticky bit directory. The final permission character is t instead of
    x on a sticky directory. A command with sticky bit on used to cause the command
    to stay in memory, even while not being used. This is an old Unix feature that
    is not supported in Linux.'
