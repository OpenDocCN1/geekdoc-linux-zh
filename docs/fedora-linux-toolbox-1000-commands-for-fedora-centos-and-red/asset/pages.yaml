    administrator. One day, if you find yourself in a minimalist, foreign Linux environment
    trying to bring a server back online, vi is the tool that will always be there.


    On Fedora, make sure you have the vim-enhanced package installed. Vim (Vi Improved)
    with the vim-enhanced package will provide the most up-to-date, feature-rich,
    and userfriendly vi editor. For more details about using vi, refer to Appendix
    A.


    Traditionally, the other UNIX text editor is Emacs and its most graphical variant,
    XEmacs. Emacs is a powerful multi-function tool that can act as a mail/news reader
    or shell, and perform other functions. Emacs is also known for its very complex
    series of keyboard shortcuts that require three arms to execute properly.


    In the mid-90s, Emacs was ahead of vi in terms of features. Now that Vim is widely
    available, both can provide all the editing features you''ll ever need. If you
    are not familiar with either vi or Emacs, we recommend you start by learning vi.


    There are many other command line and GUI text editors you may find for Linux.
    Text-based editors that may be simpler than vi and Emacs include JED, JOE, and
    nano. Start any of these editors by typing their command name, optionally followed
    by the file name you want to edit. The following sections offer some descriptions
    of how to use each of those editors.


