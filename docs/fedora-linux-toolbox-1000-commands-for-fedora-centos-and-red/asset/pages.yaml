    After you disowned a process, you can close the shell without killing the process.


    > NOTE With fg, bg, or disown, if you don''t indicate which process to act on,
    the current job is used. The current job has a plus sign (+) next to it.


    The fg and bg commands manipulate running processes by moving those processes
    to the foreground or background. Another way to manipulate running commands is
    to send signals to those processes. A common way to send signals to running processes
    is with the kill and killall commands.


    # Killing and Signaling Processes


    You can stop or change processes by sending signals to those processes. Commands
    as kill and killall can send signals you select to running processes, as their
    names imply, is often a signal to kill the process.


    Signals are represented by numbers (9, 15, and so) and strings (SIGKILL, SIGTERM,
    and so on). Table 9-2 shows standard signals you can send to processes in Linux.'
