  md: '# Chapter 2: Installing Fedora and Adding Software


    Until Fedora 6, Fedora was represented by an installation set (a single DVD or
    up to five CDs) that contained more than 2200 RPM packages. The packages in that
    set were referred to as Fedora Core. Red Hat, Inc. employees were primarily responsible
    for maintaining Fedora Core. Additional packages submitted by the Fedora community
    were tested and approved by the Fedora Extras committee, then added to a separate
    online repository.


    Both Core and Extras RPM packages were held to the same standards: packages must
    be open source, not encumbered by patents, legal under U.S. laws such as the Digital
    Millennium Copyright Act (DMCA), and licensed for redistribution. That made it
    easier in Fedora 7 to merge Core and Extras into a single repository. So, getting
    an installation set that included a cross-section of desktop, workstation, and
    server packages, separate spins were created for Fedora 7 desktop, server, and
    other groupings. Packages outside of your spin can be downloaded from the massive,
    online Fedora repository.


    Other software packages that worked with Linux, but may not meet Red Hat requirements,
    are available from third-party yum repositories. Some of those repositories built
    their dependencies on the main Fedora repository. The following section describes
    some of those repositories and how to access them.


    # Using yum Software Repositories


    In the old days of Red Hat, when people needed packages that had been left out
    by Red Hat, they had to hunt the packages down on the Web. If they got lucky,
    they located an RPM for the exact version of Red Hat Linux they were using. If,
    they had to fight against RPM dependency hell or do a dirty install from source.


    The rpm command, while very powerful for installing packages (either locally or
    from the Internet), did not go out and find dependent packages you needed to install
    your package. It also didn''t grab the latest version of a package by asking for
    it.


    Debian GNU/Linux and other Linux distributions based on Debian enjoy the bliss
    of apt — a one-line command that allowed a user to install virtually any package
    out there. Dependencies are calculated and installed automatically. At first,
    aptrpm emerged as a tool for letting Red Hat-based distributions get RPM packages
    from apt-enabled repositories. So, however, yum emerged as the tool for getting
    Fedora software.


    Just as apt was borrowed from Yellow Dog Linux (a distribution based on Red Hat
    Linux that ran on Mac hardware), the yum utility (Yellow dog Updater, Modified)
    offered near-identical features to apt and has now become an integral part of
    Fedora; aptrpm is no longer maintained and should no be used. While Fedora was
    adopting yum, RHEL went with its own RPM management tool: up2update. With RHEL
    5, however, yum provides the underlying structure for software installation.'
  merge: -1
