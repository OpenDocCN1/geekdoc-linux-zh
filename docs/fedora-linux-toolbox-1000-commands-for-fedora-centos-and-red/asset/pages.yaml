  md: '# Chapter 14: Locking Down Security


    # Managing Passwords


    Adding or changing a password is usually done quite simply with the `passwd` command.
    However, there are additional options available with `passwd` that let an administrator
    manage things such as account locking, password expiration, and warnings to change
    passwords. Besides `passwd`, there are commands such as `chage`, `chfn`, and `vipw`,
    for working with user passwords.


    Regular users can change only their own passwords, whereas the root user can change
    the password for any user. For example.


    ```

    $ passwd Change a regular user''s own password

    Changing password for chris.

    Changing password for chris.

    (current) UNIX password: ********

    New UNIX password: *

    BAD PASSWORD: it''s WAY too short

    New UNIX password: ********

    Retype new password: ********

    passwd: all authentication tokens updated successfully.

    # joseph Root can change any user password

    Changing password for joseph.

    New UNIX password:

    BAD PASSWORD: it''s WAY too short

    Retype new password: *

    passwd: all authentication tokens updated successfully.

    ```


    In the first example, a regular user (chris) changes his own password. Even logged
    in, the user must type the current password before entering a new one. Also, passwd
    keeps a regular user from setting a password that is too short, based on a dictionary
    word, doesn''t have enough different characters, or is easy to guess. The root
    user, in the second example, can change any user password without the old password.
    Likewise, the root user is warned about a password that''s insecure. However,
    the root user can assign a short or easy-to-guess password, despite those warnings.


    Passwords should be at least eight characters, a combination of letters and other
    characters (numbers, punctuation, and so on), and not include real words. Passwords
    easy to remember but hard to guess.


    A system administrator can use `passwd` to lock and unlock user accounts. For
    example.


    ```

    $ passwd -l carl Lock the user account (carl)

    Locking password for user carl.

    passwd: Success

    # passwd -u carl Unlock a locked user account (carl)

    Unlocking password for user carl.

    passwd: Success

    ```


    251'
