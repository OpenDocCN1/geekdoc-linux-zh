  md: '# Chapter 8: Backups and Removable Media


    # Creating Backup Images with mkisosfs


    Most data CDs and DVDs can be accessed on both Windows and Linux systems because
    they are created using the ISO9660 standard for formatting the information on
    those discs. Because most modern operating systems need to save more information
    about files and directories than the basic ISO9660 standard includes, extensions
    to that standard were identified to contain that information.


    Using the mkisosfs command, you can back up the file and directory structure from
    any point in your Linux file system and produce an ISO9660 image. That image can
    include the following kinds of extensions:


    +   * Use Sharing Protocol (SUSP) are records identified in the Rock Interchange
    Protocol. SUSP records can include Unix-style attributes, such as ownership, long
    file names, and special files (such as character devices and links).


    +   * Joliet directory records store longer file names in a format that makes
    them to Windows systems.


    +   * Hierarchical File System (HFS) extensions allow the ISO to appear as an
    HFS file system, which is the native file system for Macintosh. Likewise, Data
    and Resource forks can be added in different ways to be read by Macs.


    When you set out to create your ISO image, consider where you will ultimately
    need to access the files by backing up using mkisosfs (Linux, Windows, or Macs).
    Once the image is created, it can be used in different ways, the most obvious
    of which is to burn the image to a CD or DVD.


    Besides being in producing all or portions of a Linux file system to use on a
    portable medium, mkisosfs is also useful for creating CDs/DVDs. It does this by
    adding boot information to the image that can launch a Linux kernel or other operating
    system, bypassing the computer''s hard drive.


    > Although you can still use the mkisosfs command in Fedora, mkisosfs is a pointer
    to genisoimage. The genisoimage command was derived from mkisosfs, which was part
    of the cdtools package (see http://cdrecord berilios.de). Development of genisoimage
    is part of the cdkit project (www.cdkit.org).


    Because Linux users store their personal files in their home directories, a common
    way to use mkisosfs to back up files is to back up everything the /home directory.
    Here are some examples of using mkisosfs to create an ISO image from all files
    and directories under the /home directory.


    ```

    # cd /tmp

    # mkisosfs -o home.iso /home          Create basic ISO9660 image

    # mkisosfs -o home2.iso -J -R /home      Add Joliet Rock Ridge extensions

    # mkisosfs -o home3.iso -J -R -hfs /home Also add HFS extensions

    ```'
  merge: -1
  pgno: 172
- img_proc: true
  md: '# Chapter 8: Backups and Removable Media


    In each of the three examples, all files and directories beneath the /home directory
    are added to the ISO image (home.iso). The first example has no extensions, so
    all file names are converted to DOS-style naming (8 characters). The second example
    uses Joliet and Ridge extensions, so file names and permissions should appear
    as they did on the original Linux system when you mount the ISO on a Linux or
    Windows system. The last example also makes the files on the image readable from
    a Mac file system.


    You can have multiple sources added to the image. Here are some examples:


    ```

    # mkisofs -o home.iso -R -J music/ docs/ \ Multiple directories/files

    chris.pdf -J /spool/mail

    # mkisofs -o home.iso -J \ Graft files on the image

    graft-Pictures /var/pics/ \

    home/chris

    ```


    The first example shows various files and directories being combined and placed
    at the root of the /home image. The second example grafts the /var/pics directory
    to the /home/chris/Pictures directory. As a result, the CD image the /Pictures
    directory will contain all content from the /var/pics directory.


    Adding information to the header of the ISO image can help you identify the contents
    of that image later. This is useful if the image is being saved or distributed
    online, without a physical disk to write on. Here are some examples:


    ```

    # mkisofs -o /tmp/home.iso -R - \ Add header to info

    -p www.handsonhistory.com \ \

    -publisher "Swan Folk Art Center" \ \

    -V "WebBackup" \

    -A "mkisofs"

    -volset "1 of 4 backups, July 30, 2007" \ \

    /home/chris

    ```


    In the example below, -p indicates the preparer ID, which could include a phone
    number, mailing address, or web site for contacting the preparer of the ISO image.
    With the option -publisher, you can indicate a 128-character description of the
    preparer. -V indicates the volume ID. Volume ID is important because in Linux
    systems, this volume is used to mount the CD when it is inserted. in the command
    line shown above, the CD would be mounted on /media/WebBackup in Fedora and other
    Linux systems. The -A option can be used to identify the application used to create
    the ISO image. The -volset option can contain a string of information about set
    of ISO images.


    When you have created your ISO image, and before you burn it, you can check the
    image and make sure you can access the files in it. Here are ways to check it
    out:


    ```

    # volumename home.iso Display volume name

    WebBackup

    # isinfo -d -i home.iso Display header information

    CD-ROM is in ISO 9660 format

    System id: LINUX

    ```


