  md: '# Chapter 8: Backups and Removable Media


    The unison will then compare the two roots and for each change that occurred since
    last time, ask you what you want to do. In the example above, there''s a new file
    called memo.txt on the local system. If you are asked if you want to proceed with
    the update (in this case, copy memo.txt from the local machine to server1). Type
    y to do the updates.


    If you trust unison, add -auto to make it take default actions without prompting
    you:


    ```

    $ unison /home/francois ssh://francois@server1:/home/fcaen -auto

    ```


    There is no man page for unison. However, you can view unison options using the
    -help option. You can also display page through the unison manual using the -doc
    option as shown here:


    ```

    $ unison -help              See unison options

    $ unison -doc all | less      Display unison manual

    ```


    If you find synchronizing two roots frequently, you can create a profile, which
    is a series of presets. In graphical mode, the default screen makes you create
    profiles. Profiles are stored in .prof text files in the ~/.unison/ directory.
    They can be as simple as following:


    ```

    root = /home/francois

    root = ssh://francois@server1:/home/fcaen

    ```


    If this is in a profile fc-home.prof, you can invoke it simply with the following
    command line:


    ```

    $ unison fc-home

    ```


    # Backing Up to Removable Media


    The capacity of CDs and DVDs, and the low costs of those media, have made them
    attractive options as computer backup media. Using tools that commonly come with
    Linux systems, you can gather files to back up to CD or DVD images and burn them
    to the appropriate media.


    Command line tools as mkisosf (for CD images) and ccdrecord (for burning images
    to CD or DVD) once provided the most popular interfaces for making backups to
    CD or DVD. There now many graphical front-ends to those tools you could also consider.
    For example, GUI tools for mastering and burning CDs/DVDs include K3b (the CD
    and DVD Kreator) and Nautilus (GNOME’s file manager that includes a CD-burning
    feature). Other GUI tools for burning CDs include gcomb, X-CD-Roast, and gravem.


    The commands for creating file system images to back up to CD or DVD, as well
    as to burn those images, are described in this section.'
