  md: 'To start and stop your network, commands such as service, chkconfig, ifup,
    and ifdown are easy to manage. When a connection is established, you can see statistics
    about that connection using ifconfig and ip commands.


    Besides using wired Ethernet cards, other network hardware such as wireless LAN
    cards and dial-up modems are supported in Linux. Use commands as iwconfig to work
    with wireless interfaces, and wvdialconf and minicom to configure modems.


    To check DNS name resolution, use the dig, host, and hostname commands. Commands
    for checking connectivity and routes to a host include ping, arp, traceroute,
    and ip.'
