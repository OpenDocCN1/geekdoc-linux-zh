    The current message has a greater-than (>) next to it. New messages have a beginning,
    (but not) messages have a U, and if there is no letter, the message has been read.
    The prompt at the bottom (&) is ready to accept messages.


    At this point, you are in command mode. You can use simple commands to move around
    and perform basic mail functions. Type ? to see a list of commands, or change
    the number of messages you use, Type 7 to view a message. Type v3 to open the
    third message in the vi editor. Type h18 to see a list of message headers that
    begins with 18. Type to reply to a message, type r7 (type your message, put a
    dot on line by to send the message). Type d4 to delete the fourth message (or
    d4–9 to delete messages 4 through 9). Type !bash to escape to the shell (then
    exit to return to mail).


    Before you exit mail, know that any messages you view will be copied from your
    mailbox file to $HOME when you exit, unless you preserve them (pre). To have all
    messages stay in your mailbox, exit by typing x. To save changes to the mailbox,
    type q to exit.


