  pgno: 260
- img_proc: true
  md: '# Chapter 13: Doing Remote System Administration


    project. OpenSSH provides both client and server components. Here are a few facts
    about SSH:


    +   - For Windows, you can use the Linux SSH tools within Cygwin (www.cygwin.com).
    But unless you are already using Cygwin (a Linux-like environment for Windows),
    we recommend PuTTY (www.chiark.greenend.org/uk/sgatatham/putty). PuTTY is a free
    open source source Telnet/SSH client.

    - Use SSH version 2 whenever possible, because it is the most secure. Some SSH-enabled
    network appliances may only support older, less secure versions. OpenSSH supports
    all versions. Some older versions of Fedora and RHEL accepted SSH v1 and v2. Newer
    releases accept version 2 by default.

    - In Fedora and RHEL, ost run start sshd to start the SSH service (ssh daemon).
    To configure the service, edit the /etc/ssh/ssh_config file.

    - To configure the SSH client, edit the /etc/ssh/ssh_config file.


    If you prefer to use graphical tools to manage your remote Linux system, you can
    enable X11 Tunneling (also called X11 Port Forwarding). With X11 Tunneling (on
    both the SSH client and server), you can start an X application on the server
    and have it displayed on your client. All communication that connection is encrypted.


    Both Fedora and RHEL come with X11 forwarding enabled (X11Forwarding yes) for
    the server (ssh daemon). You still need to enable it on the client. To enable
    X11 forwarding for a one-time session, connect with the following command:


    ```

    $ ssh -X francois@myserver

    ```


    To enable X11 forwarding permanently for all users, add ForwardX11 yes to /etc/ssh/ssh_config.
    To enable it for a specific user only, add the line to the user''s ~/.ssh/config.
    After setting this has been added, the -X option is no longer required to use
    X11 Tunneling. Run ssh to connect to the remote system as you would normally.
    To test that the tunneling is working, run xclock after sshing into the remote
    machine, and it should appear on your client desktop.


    SSH Tunneling is an excellent way to securely use remote graphical tools!


    # Logging in Remotely with ssh


    To log in to a remote host, you can use either of two different syntaxes to specify
    the user name:


    ```

    $ ssh -l francois myserver

    $ ssh francois@myserver

    ```


    However, scp and smtp commands (discussed in Chapter 12) only support the user@server
    syntax, so we recommend you get used to that. If you do not specify the user name,
    ssh will attempt to log in using the same user you are logged in as locally. When
    connected, if you need to forcibly exit your ssh session, type the sequence of
    tilde followed by a period (-).


    231'
