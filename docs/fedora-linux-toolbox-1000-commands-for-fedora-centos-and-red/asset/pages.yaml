  md: '# Appendix A: Using vi or Vim Editors


    To benefit from all the improvements of many systems, vi is aliased to the vim
    command. You may want to double-check that using the alias command. If you specifically
    want to use the older-style vi command, use the full path to the vi command instead:


    ```

    /bin/vi /tmp/text.txt

    ```


    Here are a few other ways you can start:


    ```

    $ vi +25 /tmp/inittab      Begin on line 25

    $ vi +/tmp/inittab           Begin editing file on the last line

    $ vi //tty /tmp/inittab         Begin on first line with word "tty"

    $ vi -r /tmp/inittab           Recover file from crashed edit session

    $ view /tmp/inittab             Edit file in read-only mode

    ```


    When you are done with your session, there are several different ways to save
    and quit. To save the file before you are ready, type `:w`. To quit and save changes,
    either ZZ or `:wq`. To quit without saving, type `:q!`. If you find you can''t
    write to the file you are editing, it may be opened in read-only mode. If that''s
    the case, you can forcing a change by writing `:w!` or you can save the contents
    of the file to a different name. For example, type the following to save the contents
    of the current file to a file named myfile.txt:


    ```

    :w /tmp/myfile.txt

    ```


    The editor also enables you to line up several files at a time to edit. For example,
    type:


    ```

    $ cd /tmp

    $ touch a.txt b.txt c.txt

    $ vi a.txt b.txt c.txt

    ```


    In this example, vi will open the a.txt file first. You can move to the next file
    by typing :n. You may want to save changes before moving to the next file (:w)
    or save changes as the next file (:wn). To abandon changes while moving to the
    next file, type :n!


    You will probably find it easier to open multiple files by splitting your screen.
    When you''re in and have a open file, you can split your screen multiple times
    either horizontally or vertically:


    ```

    :split /etc/httpd/conf/httpd.conf

    :vsplit /etc/init.d/httpd

    ```


    Use <Tab> to complete the path to the files, just like you would in a bash Shell.
    To navigate between split windows, press Ctrl+w, followed by the w key. To close
    the current window, use the usual exit command (:q).


    264'
