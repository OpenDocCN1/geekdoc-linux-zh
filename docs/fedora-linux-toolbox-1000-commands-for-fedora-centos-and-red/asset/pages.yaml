    # Adding Groups


    Each new user is assigned to one or more groups. You can create groups at any
    time and add users to those groups. The permissions that each group has to use
    files and directories in Linux depend on how the group permission bits are set
    on each item. Assigning users to a group enables you to attach ownership to files,
    directories, and applications so that those users can work together on a project
    or have common access to resources.


    Commands similar to those for working with users are available for managing your
    groups. You can add groups (groupadd), change group settings (groupmod), delete
    groups (groupdel), and add and delete members from those groups (groupadd). Here
    are examples of adding new groups with the groupadd command:


    ```

    # groupadd marketing      Create new group with next available GID

    # groupadd -g 701 sales    Create new group with GID of 701

    # groupadd -r myadmin      Create group with admin GID (under 499)

    # groupadd -o -g 74 mysshd   Create group with existing GID

    ```


    With the groupmod command, you can change the name or group ID of an existing
    group. Here are examples:


    ```

    # groupmod -g 491 myadmin   Modify myadmin to use GID 491

    # groupmod -n myad myadmin   Change name of myadmin group to myad

    ```


    To remove existing group, use the groupdel command. Here is an example:


    ```

    # groupdel myad           Remove existing myad group

    ```


    Keep in mind that removing a group or user does not remove the files, directories,
    devices, or other items owned by that group or user. If you do a long listing
    (ls -l) of a file or directory assigned to a group or user that was deleted, the
    UID or GID of the deleted user or group is displayed.


    253'
