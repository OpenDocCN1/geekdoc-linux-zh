  md: '# Chapter 7: Administering File Systems


    **NOTE** The mount command can also be used to attach to NFS, Samba/Windows CIFS
    shares. See Chapter 12 for information on mounting those remote file system types.


    # Unmounting File Systems with unmount


    Unmounting a file system, use the `umount` command. You can mount the file system
    using the device name or the mount point. You''re better off unmounting with the
    mount point, to avoid the confusion when bind mounts (one device, multiple mount
    points). Here is an example of each, with verbosity on:


    ```

    # umount -v /dev/sda          Unmount by device name

    /dev/sda unmounted

    # umount /mnt/mymount/           Unmount by mount point

    /tmp/diskboot.img unmounted

    ```


    If the device is busy, the unmount will fail. A common reason for an unmount to
    fail is that you have a shell open with the current directory of a directory inside:


    ```

    # umount -v /mnt/mymount/

    umount: /mnt/mymount: device is busy

    numount: /mnt/mymount: device is busy

    ```


    Sometimes, it''s not obvious what makes the device busy. You can use `lsof` to
    list open files, then search for the mount point that interests you:


    ```

    # lsof | grep mymount             Find open files on mymount partition

    bash      9341  francois  cwd       DIR      8,1  1024  2 /mnt/mymount

    ```


    You can see that a bash process run by francois with a PID of 9341 is preventing
    the mymount partition from being unmounted.


    Another option when a file system is to perform a lazy unmount:


    ```

    # umount -vl /mnt/mymount/      Perform a lazy unmount

    ```


    A lazy unmounts the file system from the tree now, but waits for the device to
    no longer be busy before cleaning everything. Unmounting of removable media can
    also be done with eject. This unmounts a CD and ejects the CD from the drive:


    ```

    # eject /dev/cdrom           Unmount and eject a CD

    ```


    # Checking File Systems


    In Linux, instead of just having the scandisk utility you have in Windows, you
    can scan a physical device for bad blocks at a physical level with the badblocks
    command


    119'
