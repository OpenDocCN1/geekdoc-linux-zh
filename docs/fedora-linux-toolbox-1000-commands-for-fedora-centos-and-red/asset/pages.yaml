    But whether you are a Linux guru or novice, one challenge looms large. How do
    you remember the most critical commands and options you need, when a command shell
    might only show you this:


    $


    Fedora Linux Toolbox is not just another command reference or rehash of man pages.
    Instead, this book presents commands in Fedora Linux by the way you use them.
    In other words, instead of listing commands alphabetically, we group commands
    for working with file systems, connecting to networks, and managing processes
    in their sections, so you can access commands by what you want to do, not only
    by how they’re named.


    Likewise, we won''t give you a list of every option available for every command.
    Instead, we''ll show you working examples of the most important and useful options
    to use with each command. From there, we''ll tell you quick ways to find more
    options, if you need them, from man pages, the info facility, and help options.


    # Finding Commands


    Some of the commands described in this book may not be installed when you go to
    run them. You might type a command and see a message similar to:


    ```

    bash: mycommand: command not found

    ```


    This might happen for the following reasons:


    +   - You mistyped the command name.


    +   - The command is not in your PATH.


    +   - You may need to be the root user for the command to be in your PATH.


    +   - The command is not installed on your computer.'
