  md: '# Chapter 11: Managing Network Connections


    As you can see, the longest hop is between 4 (Global Crossing probably in Minneapolis)
    and 5 (GC in Seattle). That gap is not really a bottleneck; it reflects the distance
    between those hops. Sometimes, the last hops look like this:


    +   28 * *\ *

    29 * *\ *

    30 * *\ *


    The lines of asterisks (*) at the end of the trace can be caused by firewalls
    that block traffic to the trace. However, if you see several asterisks before
    the destination, this can indicate heavy congestion or equipment failures and
    point to a bottleneck.


    By default, traceroute uses UDP packets, which provide a more realistic picture
    than ICMP. That''s because some Internet hops have lower priority to ICMP traffic.
    If you''d still like to trace using ICMP packets, try one of these two commands:


    ```

    # traceroute -I boost.turbosphere.com   Use ICMP packets to trace a route

    # traceroute -t boost.turbosphere.com    Use ICMP packets to trace a route

    ```


    To trace a route to a remote host using TCP packets, use the -T option to traceroute:


    ```

    # traceroute -T -p 25 boost.turbosphere.com   Use TCP packets

    ```


    By default, traceroute connects to port 80. You can set a different port using
    the -p option:


    ```

    # traceroute -n boost.turbosphere.com   Disable name resolution in trace

    ```


    You can view IP addresses instead of hostnames by disabling name resolution of
    hops:


    ```

    # tracepath boost.turbosphere.com    Use UDP to trace the route

    ```


    An alternative to traceroute is the tracepath, which also uses UDP to perform
    the trace:


    To view and manage the kernel''s routing table, the route command used to be the
    tool of choice. This is slowly being replaced by the ip route command. For the
    most part, it doesn''t hurt to be familiar with both commands, because route is
    still quite commonly used.


    You can use the old route command to display your local routing table. Here are
    two examples of the route command, and with DNS name resolution:


    ```

    # route                Display local routing table information

    Kernel IP routing table

    ```'
