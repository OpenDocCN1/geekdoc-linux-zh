  md: '# Enabling Repositories for yum


    With the merging of Fedora Core and Fedora Extras into one massive repository,
    literally thousands of open source software packages are available for you to
    install for free. If you have an Internet connection, Fedora 7 is automatically
    configured to access the repository.


    Repositories that are represented by .repo files in the /etc/yum.repos.d directory.
    Simple yum commands, described later, can be used to download and install software
    packages from those repositories. To access many more software packages that were
    built particularly for your version of Fedora, you can enable more software repositories
    for yum.


    Although the Fedora Project doesn''t officially bless any of the yum repositories
    outside of the main Fedora repository, most Fedora users draw on one or more repositories
    to get the software they need. Keep in mind, that some repositories go to lengths
    to be compatible with existing Fedora packages, as well as from other repositories.
    This should reduce occurrences of packages from outside repositories not installing
    because of dependencies.


    > **WARNING!** The Fedora project doesn''t officially recommend outside repositories.
    So, you are basically on your when you get packages from these third-party repositories.
    Risks include potential conflicts with repositories that offer the same software
    and dangers that can come from replacing core system components. Be careful with
    blanket yum upgrade. You''re sometimes better off selectively installing the specific
    packages you need from the third-party repository.


    To enable repositories from the following list, you will need to install the .repo
    files and GPG keys needed to verify the authenticity of the packages you download
    from them. Instead of creating this information manually, most of the third-party
    repositories offer an RPM package you can download and install that includes information.


    Based on recommendations from Fedora users, consider using the following repositories
    (in the order):


    +   - RPMForge (http://rpmforge.org) — Provides a wide range of packages, while
    for stability with the main Fedora repository. Packages are also available for
    RHEL/CentOS, Red Hat Linux, and other distributions across i86, x86_64, and other
    architectures. Several popular repositories including Dag Weiers (http://dag.wieers.com/rpm)
    are being merged into RPMForge.


    +   - Livna (http://rpm.livna.org) — Contains packages that include codecs and
    drivers (such as AVI and NVIDIA video drivers) that have restrictions prevent
    them from being redistributed with Fedora. The packages may include components
    needed for otherwise unsupported audio and video players.


    +   - FreshRPMS (http://freshrpms.net) — Contains packages particularly for media
    players and wireless network card support.'
