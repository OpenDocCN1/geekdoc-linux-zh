    # Using Again Shell History


    The Bourne Again Shell (bash) is the shell used by default by most modern Linux
    systems. Built into bash, as with others, is a history feature that lets you review,
    change, and reuse commands that you run in the past.


    When bash starts, it reads the ~/.bash_history file and loads it into memory.
    This file is set by the value of $HISTSIZE. When bash exits, history in memory
    is written back to the .bash_history file. The number of commands held in history
    during a bash session is set by $HISTSIZE, while the number of commands actually
    in the history file is set by $HISTFILESIZE:


    ```

    $ HISTSIZE $HISTSIZE $HISTFILESIZE

    /home/fcaen/.bash_history 1000 50

    ```


    To list the entire history, history type. To list a previous number of history
    commands, follow history with a number. This lists the previous five commands
    in your history:


    ```

    $ history 5

    975 mkdir extras

    976 mv *doc extras/

    977 ls -CF

    978 vi house.txt

    979 history

    ```


    To move among the commands in your history, use the up arrow and down arrow. When
    a command is displayed, you can use the keyboard to edit the current command like
    any other command: left arrow, right arrow, Delete, Backspace, and so on. Here
    are some other ways to recall and run commands from your history:


    ```

    $ !!

    Run the previous command

    $ 1997

    Run command number 997 from history

    ls -CF

    $ 1997 *doc

    Append *doc to command 997 from history

    ls -CF *doc

    $ 17?

    Run previous command line containing the CF string

    ls -CF *doc

    $ 11s

    Run the previous ls command

    ```


    # 36'
