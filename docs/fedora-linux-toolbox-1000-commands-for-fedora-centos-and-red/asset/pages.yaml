    With the last command, you can see each user who logged in (or opened a shell)
    and either how they were logged in or a note that they are "still logged in."
    The tty and tty terminal lines show users working from virtual terminals to the
    console. The pts lines identify person opening a shell from a remote computer
    (thompson) or local X display (:0.0). We recommend you use the -option for improved
    readability. The lastb command shows failed attempts and where they are from.
    The -u users show information currently and where logged-in users.


