  md: '# Adjusting Audio Levels


    The command line audio tools you use to enable audio devices and adjust audio
    levels depend on the type of audio system you use. Advanced Linux Sound Architecture
    (ALSA) is the sound system used by most Linux systems these days. The Open Source
    Sound System (OSS) has been around longer and is still used on older hardware.
    In general, you can use alsixer to adjust sound when ALSA is used and amix with
    OSS.


    ALSA is the default sound system for most Linux systems. By loadable modules that
    enable OSS device interfaces to work as well, audio applications that require
    the OSS device interface to work with ALSA as well. To see OSS modules are loaded,
    including snd-pcm-cm (emulates /dev/dsp and /dev/audio), snd-mixer-oss (emulates
    /dev/mixer), and snd-seq-oss (emulates /dev/sequencer), type:


    ```

    # lsmod grep snd

    ```


    If the modules are loaded, you can use alsixer to adjust audio levels for OSS
    sound applications. Start alsixer as follows:


    +   $ alsixer Show alsixer screen with playback view

    $ alsixer -V playback Show only playback channels (default)

    $ alsixer -V all Show with playback and capture views

    $ alsixer -c 1 Use alsixer on second (1) sound card


    Volume bars appear for each volume channel. Move the right and left keys to highlight
    different channels (Master, PCM, Headphone, and on). Use the up and down arrow
    keys to raise and lower the volume on each channel. With a channel highlighted,
    press m to mute or unmute that channel. Press the spacebar on a highlighted input
    channel (Mic, Line, and so on) to assign the channel to the capture channel (record
    audio input). To quit alsixer, press Alt+q or the Esc key. Press Tab to cycle
    through settings for Playback, Capture, and All.


    The amix audio mixing application (amix packages) can operate in scene-oriented
    or plain command mode. In plain text you use options to change or display settings.
    Here are examples of amix commands:


    +   $ amix -q Show left/right volume and type for all channels

    $ amix -1 -q -m List current settings for line and mic only

    $ amix -v 80 -m 0 Set volume to 70% and microphone to 0

    $ amix -m 80 -r -q Set mix by 80%, set it to record, list mix

    $ amix With no options, amix runs scene-oriented


    When run scene-oriented, amix displays all audio channels. In scene-oriented mode,
    use keys to highlight and change displayed audio settings. Use PageUp, PageDown,
    and the up arrow and down arrow keys to increase or decrease to select channels.
    Type m to mute the current channel. Press the spacebar to select the current channel
    as the recording device. If a mouse is available, you can use to select volume
    levels, balance levels, or the current recording channel.'
