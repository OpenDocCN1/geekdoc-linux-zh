  md: '# Chapter 10: Managing the System


    To find out what kernel is currently running on your system, type the following:


    ```

    $ uname -r                Display name of kernel release

    2.6.21-13194.fc7

    $ uname -a                Display all available kernel info

    Linux server.domain.com 2.6.20-13220.fc5 #1 SMP Tue 12 18:50:49 EDT

    2007 x86_64 x86_64 x86_64 GNU/Linux

    ```


    When the kernel starts, what happens occurs in the kernel ring buffer. You can
    display the contents of the kernel buffer using the dmesg command:


    ```

    $ dmesg |less

    Linux version 2.6.21-13194.fc7 (Kojibuilder@xenbuilder.4.fedora.phx.redhat.com)

    (gcc version 4.1.2 20070502 (Red Hat 4.1-12)) #1 SMP Wed May 23 22:35:01 EDT

    2007

    BIOS-physical RAM map:

    sanitize start

    sanitize end


    CPU: L2 Cache: 256K (bytes/line)

    CPU: After all inits, caps: 0183f3ff clc7cbff 00000000 00000420 00000000000000000

    Intel machine check architecture supported.

    Intel machine checking enabled on CPU0.

    ```


    If buffer fills up, it may no longer contain the beginning of the recorded information.
    In that case, you can use /var/log/dmesg.


    Other information about kernel processing can be found in the /var/log files —
    in particular the messages file. You can page through these files as follows:


    ```

    $ cat /var/log/dmessages* | less    Page through /var/log/dmessages

