    # Changing File Attributes


    Files and directories in Linux file systems have read, write, execute permissions
    associated with user, group, and others. However, there are also other attributes
    that can be attached to files and directories that are specific to certain file
    system types.


    Files on ext2 and ext3 file systems have special attributes that you may choose
    to use. You can list these attributes with the lattr command. Most attributes
    are obscure and not turned on by default. Here''s an example using lattr to see
    some few attributes:


    ```

    # lattr /etc/host*

    ---- /etc/host.conf

    ---- /etc/hosts

    ---- /etc/host.allow

    ---- /etc/host.deny

    $ lattr -ah --tmp | less    Recursively list all /tmp attributes

    ```


    The dashes represent ext2/ext3 attributes that can be set. None are by default.
    Those attributes (append only), c (compressed), d (no dump), i (immutable), j
    (data journaling), s (secure deletion), t (no tail-merging), u (undeletable),
    A (no time updates), D (synchronous directory updates), S (synchronous updates).
    You can change these attributes using the chattr command. Here are examples:


    ```

    # chattr +i /boot/grub/grub.conf

    ```'
