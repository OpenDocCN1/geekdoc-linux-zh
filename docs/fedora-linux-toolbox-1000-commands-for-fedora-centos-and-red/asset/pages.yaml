  md: '# Chapter 6: Playing with Multimedia


    # # Encoding Music


    After a music file is ripped from CD, encoding that file to save disk space is
    usually the next step. Popular encoders include oggenc, flac, and lame, for encoding
    to Ogg Vorbis, FLAC and MP3 formats, respectively.


    With oggenc, you can start with audio files or streams in WAV, AIFF, FLAC or raw
    format and convert them to Ogg Vorbis format. Although Ogg Vorbis is a lousy format,
    the default encoding on WAV files still produces very good quality and can result
    in a file that''s about one-tenth the size. Here are some examples of oggenc:


    ```

    $ oggenc mysong.wav

    $ oggenc ab.flac -o new.ogg

    $ oggenc ab.wav -q 9

    ```


    Encodes WAV to Ogg (mysong.ogg)

    Encodes FLAC to Ogg (new.ogg)

    Raises encoding quality to 9


    By default, the quality (-q) of the oggenc output is set to 3. You can set the
    quality to any number from -1 to 10 (including fractions such as 5.5).


    ```

    $ oggenc NewSong.wav -o NewSong.ogg \\

    -a Bernstein -G Classical \\

    -d 06/15/1972 -t "Simple Song" \\

    -1 "Bernstein Mass" \\

    -c info=From Kennedy Center

    ```


    The command just shown converts MySong.wav to MySong.ogg. The artist name is Bernstein
    and the music type is Classical. The date is June 15, 1972, the song title is
    Simple Song and the album name is Bernstein Mass. A comment is From Kennedy Center.
    The backslashes aren''t needed if you just keeping the command on one line. However,
    if you do add backslashes, make sure there are no spaces after the backlash.


    The preceding example adds information to the header of the ogg file. You can
    see the header information, with other information about the file, using ogginfo:


    ```

    $ ogginfo NewSong.ogg

    Processing file "NewSong.ogg"

    ...

    Channels: 2

    Rate: 44100

    Nominal bitrate: 112.000000 kb/s

    User comments section follows...

    info=From Kennedy Center

    title=Simple Song

    artist=Bernstein

    genre=Classical

    date=06/15/1972

    album=Bernsteins Mass

    ```


    93'
