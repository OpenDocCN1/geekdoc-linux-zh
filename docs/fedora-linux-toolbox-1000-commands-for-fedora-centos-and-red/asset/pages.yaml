  md: '# Chapter 14: Locking Down Security


    ```

    # passwd -u jordan Fails to unlock account with blank password

    Unlocking password for user.

    passwd: Warning: unlocked password would be empty.

    passwd: Unsafe operation (use -f to force)

    # passwd -u f jordan Able to unlock user with blank password

    Unlocking password for user.

    passwd: Success

    ```


    A user account with passwd causes two exclamation marks (!!) to be placed at the
    front of the password file in the /etc/shadow file (where user passwords are stored).
    When a user account is unlocked, the exclamation marks are removed and the user''s
    previous password is restored.


    An administrator can use the passwd command to require users to change passwords
    regularly, as well as warn users when passwords are about to expire. To use the
    password expiration feature, the user account needs to have password expiration
    enabled. The following examples use passwd to modify password expiration:


    ```

    # passwd -n 2 vern Set password life to 2 days

    # passwd -x 300 vern Set maximum password life to 300 days

    # passwd -w 10 vern Warn of password expiration 10 days in advance

    # passwd -i 14 vern Days after expiration is disabled

    ```


    In the first example, the user must wait at least two days (-n 2) before changing
    to a new password. In the second example, the user must change the password within
    300 days (-x 300). In the next example, the user is warned 10 days before the
    password expires (-w 10). In the last example, the user account is disabled 14
    days after the password expires (-i 14).


    To view password expiration, you can use the chage command as follows:


    ```

    # chage -l vern View password expiration information

    Last password change : Aug 04, 2007

    Password expires : May 31, 2008

    Password inactive : Jun 14, 2008

    Account expires : never

    Minimum number of days between password change : 2

    Maximum number of days between password change : 300

    Number of days of warning before password expires : 10

    ```


    As system administrator, you can use the chage command to manage password expiration.
    Being able to set minimum (-m), maximum (-M), and warning (-W) days for password
    expiration, chage can also set the day when a user must set a new password or
    a particular date the account becomes inactive:


    ```

    # chage -I 40 frank Make account inactive in 40 days

    # chage -d 5 per Force user''s password to expire in 5 days

    ```'
