    # Locating Files with find


    Before the days of locate, the way to find files was with the find command. Although
    locate will come up a lot faster, find has many other powerful options for finding
    files by attributes other than the name.


    > NOTE Searching the entire file system can take a long time to complete. Before
    searching the whole file system, considering a subset of the file system or excluding
    directories or mounted file systems.


    This example shows the root file system (/) recursively for files named e100:


    ```

    $ find -name "e100*" -print

    find:/usr/lib/audit: Permission denied

    find:/usr/libexec/utemp: Permission denied

    /sys/node/e100

    /sys/node/mi/holders/e100

    ```


    Running find as a normal user can result in long lists of Permission denied for
    tries to enter a directory you do not have permissions to. You can filter out
    the inaccessible directories:


    ```

    $ find -name "e100" -print 2>&1 | grep -v "Permission denied"

    ```'
