    # Starting the Install Process


    Most people start the install process from the DVD or first CD in the install
    set. As an alternative, use boot images contained in the images directory of the
    CD or DVD (refer to the README file in that directory). In Fedora, do one of the
    following to start anaconda:


    +   CD and DVD — Insert the installation DVD or CD and reboot the computer.


