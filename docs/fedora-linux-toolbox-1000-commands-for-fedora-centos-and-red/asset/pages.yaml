    # Formatting a File System


    With your disks in place, you can build a file system of your choice on each partition.
    Most Linux systems come with the commands needed to make and check file systems
    that are commonly used in Linux. Commands for formatting and checking file systems
    are mkfs and fsck, respectively.


    The mkfs command serves as the front for many different commands aimed at particular
    file types, such as mkfs.ext2, mkfs.ext3, mkfs.ext4, mkfs.mddos, mkfs.ntfs, and
    mkfs.vfat. By adding packages that support other file systems, additional mkfs
    commands are available to seamlessly work with mkfs. These include mkfs.bbfs,
    mkfs.minix, mkfs.xfs, and mkfs.xiafs. Use each command directly (as in mkfs.vfat
    /dev/sdb) or via the mkfs command (as in mkfs -t vfat /dev/sdb).


    # Creating a File System on a Hard Disk Partition


    Basic software packages you need in Fedora to create a file system and checking
    util-linux (includes mkfs and other general utilities) and e2fsprogs (ext2/ext3-specific
    tools). Specific mkfs commands for different file system types are included in
    ntfs (ntfs), dostools (msdos and vfat), xfsprogs (xfs), jsutils (jfs), mtd-utils
    (jfs and jfs2) and reiserfs-utils (reiserfs).


    Here are examples of the mkfs command to create file systems (be sure to add the
    -t option first):


    ```

