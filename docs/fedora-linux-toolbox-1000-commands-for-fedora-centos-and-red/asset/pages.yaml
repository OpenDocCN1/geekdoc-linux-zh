  md: '# Introduction


    time (some dating back over 30 years to the original Unix days), most will work
    exactly as described here on RHEL, CentOS, and other Fedora derivative systems,
    regardless of CPU architecture.


    Many of the commands described in this book will work on other Linux and Unix
    systems as well. Because this book focuses on Fedora and other Red Hat-based distributions,
    descriptions will differ from other Linux systems most prominently in the areas
    of packaging, installation, and GUI administration tools.


    # Conventions


    To help you get the most from the text and keep track of what''s happening, we''ve
    used a number of conventions throughout the book. In particular, we have created
    styles for showing commands that allow us to fit as many command lines as in the
    book.


    With command examples, computer output (shell prompts and messages) is shown in
    regular monospont text, computer input (the stuff you type) is in bold monospont
    text, and a short description (if included) appears in italics. Here is an example:


    ```

    $ ls *jpg

    List all JPEG files in the current directory

    hat.jpg

    dog.jpg

    ...

    ```


    To save space, output is sometimes truncated (skipped altogether). Three dots
    (...) are used to indicate that additional output was cut. If a command is particularly
    long, backslashes (\) will appear at the end of each line to indicate that it''s
    continuing to the next line. Here is an example:


    ```

    # oggenc NewSong.wav -o NewSong.ogg \

    - *Bernstein -G Classical \

    - d 06/15/1972 -t "Simple Song" \

    - 1-"Bernsteins Mass" \

    - c info=*From Kennedy Center"

    ```


    In the example just shown, you can literally type the backslashes to have all
    that information included in the single command. Or, you can simply put all the
    information on a single line (excluding the backslashes). Notice that command
    prompts are shown in one of ways:


    +   $ Indicates a regular user prompt

    # Indicates the root prompt


    As noted, when a dollar sign prompt ($) appears, any user can run the command.
    With a pound sign prompt (#), you probably need to be the root user for the command
    to work.


    XXV'
