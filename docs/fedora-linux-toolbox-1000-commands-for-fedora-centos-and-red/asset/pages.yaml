    the dd command takes /dev/zero as input file and outputs to /tmp/nullfile. The
    count is the number of blocks. By default, a block is 512 bytes. The result is
    a 512-bytes long file of null characters. You could use less or vi to view the
    contents of the file. However, a better tool to view the file would be od (Octal
    Dump) command:


    ```

