    # ip r add 192.168.0.24 via 10.0.0.100 dev eth0  Add to interface

    # ip r add 192.168.0.24 via 10.0.0.100      Add to no interface

    # ip r del 192.168.0.24                               Delete route

    ```


    To make a new permanent route, create a /etc/sysconfig/network-scripts/file named
    route-ethX (for example, route-eth0) and provide the information about the route
    in file. For example, to add the route added with the ip command above, adding
    the following lines to /etc/sysconfig/network-scripts/route-eth0:


    ```

    ADDRESS0=192.168.0.0

    NETMASK0=255.255.255.250

    GATEWAY0=10.0.0.100

    ```


