    ```

    # echo $MAIL

    # /var/spool/mail

    # mail

    mail 8.1 6/6/93. Type ? for help.

    */var/spool/root*: 25 messages 25 new

    U logwhatab.1 Fri Jun 15 00:03 44/167 * "Logwhat for ab (Linux)"

    U logwhatab.1 Sat 16 04:32 87/256 * "Logwhat for ab (Linux)"

