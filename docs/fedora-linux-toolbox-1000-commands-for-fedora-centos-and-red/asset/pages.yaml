  md: '# # Listing Text Files


    The most basic method to display the contents of a text file is with the cat command.
    The cat command concatenates (in other words, outputs as a string of characters)
    the contents of a text file to your display (default). You can then use different
    shell metacharacters to direct the contents of that file in different ways. For
    example:


    ```

    $ cat myfile.txt

    $ cat myfile.txt > copy.txt

    $ cat myfile.txt >> myfile.txt

    $ cat -s myfile.txt

    $ cat -n myfile.txt

    $ cat -b myfile.txt

    ```


