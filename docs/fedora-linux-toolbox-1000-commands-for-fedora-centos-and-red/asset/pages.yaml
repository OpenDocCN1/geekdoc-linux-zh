    # Checking Name Resolution


    Because IP addresses are numbers, and people prefer to address things by name,
    TCP/IP networks (such as the Internet) rely on DNS to resolve hostnames into IP
    addresses. Fedora provides several tools for looking up information related to
    DNS name resolution.


    When you first installed Fedora, you either identified Domain Name System (DNS)
    servers to do name resolution or had them assigned automatically from a DHCP server.
    That information is then stored in the /etc/resolv.conf file, looking something
    like the following:


    ```

    nameserver 11.22.33.44

    nameserver 22.33.44.55

    ```


    The numbers shown above are replaced by real IP addresses of computers that serve
    as DNS servers. When you connect to working DNS servers, you can use commands
    to query those servers and look up host computers.


    You can use the dig command (which should be used instead of the deprecated nslookup
    command) to look up information from a DNS server. The host command can be used
    to look up address information for a hostname or domain name.


    To search your DNS servers for a particular host name (www.turbosphere.com in
    the following examples), use the dig command as follows:


    ```

    $ dig www.turbosphere.com Search DNS servers set in /etc/resolv.conf

    ```'
