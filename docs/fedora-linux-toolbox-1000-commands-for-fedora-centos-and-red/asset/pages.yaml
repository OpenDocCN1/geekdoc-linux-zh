  md: '# Chapter 7: Administering File Systems


    +   - --bind -- Mount an existing file system to another location in the tree.
    Assuming /dev/sda1 is already mounted on /mnt/mymount, type the following:


    ```

    # --bind -v /mnt/mymount/ /tmp/mydir/

    /mnt/mymount on /tmp/mydir type none (rw,bind)

    ```


    The new file system is accessible from two locations. The new mount point has
    the same mount options as the original.


    +   - --move Move a file system from one mount point to another. Assuming /dev/sda1
    is already mounted on /mnt/mymount, this moves the file system to /tmp/mydir:


    ```

    # mount -v --move /mnt/mymount/ /tmp/mydir/

    /mnt/mymount on /tmp/mydir type none (rw)

    ```


    Just like you can swap a file, you can create a file system in a file and mount
    what it is called a loopback mount. Creating and mounting such a file is described
    in the "Creating Virtual File System" earlier in this chapter. A common situation
    where you might want to mount a file in loopback after downloading a Linux CD
    or LiveCD. By mounting that CD image loopback, you can view its contents or copy
    files from your hard disk.


    In the following example, the mount command is allowed to automatically pick an
    existing loopback device when mounting a CD image file (file type iso9660). The
    command output shows /dev/loop0 selected:


    ```

    # mount -v -t iso9660 -o loop /tmp/mimage.iso /mnt/mymount/

    mount: to use the loop device /dev/loop0

    /tmp/mimage.iso on /mnt/mymount type ext3 (rw=/dev/loop0)

    ```


    In the following example, we downloaded a Fedora USB flash drive boot image diskboot.img
    to /tmp. Here is an example of how to mount the boot image:


    ```

    # mount -v -o loop /tmp/diskboot.img /mnt/mymount

    mount: to use the loop device /dev/loop0

    mount: you didn''t specify a filesystem type for /dev/loop0

    I will try type vfat

    /tmp/diskboot.img on /mnt/mymount type vfat (rw=/dev/loop0)

    ```


    To see the status of the loopback devices, use the losetup command:


    ```

    # losetup -a List mounted loopback device

    /dev/loop0: [0807]:1009045 (/tmp/diskboot.img)

    ```


    If a loopback mount gets "stuck" and you have problems detaching it as as follows:


    ```

    # losetup -d /dev/loop1 Force unmount of a mounted loopback device

    ```'
