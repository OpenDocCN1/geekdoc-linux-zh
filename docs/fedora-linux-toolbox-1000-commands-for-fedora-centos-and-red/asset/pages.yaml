  md: '# Chapter 7: Administering File Systems


    # # Finding Out File System Use


    Running out of disk space can be annoying on your server system and potentially
    a disaster on your servers. To determine how much disk space is available and
    how much is currently in use, you can use the df command. To check how much space
    for particular files and directories are consuming, use the du command.


    The df command provides utilization summaries of your mounted files. With the
    -h option, you can have the data (which is shown in bytes by default) converted
    to megabytes (M) and gigabytes (G), to make that output human-readable:


    | Filesystem | Size | Used | Avail% | Mounted on |

    |---|---|---|---|---||

    | /dev/sda2 | 7.6G | 3.4G | 3.9G | 47% | / |

    | /dev/sda1 | 14M | 80M | 15% | /boot |

    | tmpfs | 501M | 501M | 0% | /dev/shm |

    | /dev/sda5 | 197G | 137G | 59% | /home | |

    | /home/chris | 9204796 | 5.5G | 307068 | 66% | /mnt/mymunt |


    Because file systems have only a few inodes created at make time, if you have
    lots of small files, you can possibly run out of inodes before you run out of
    actual space. To check inode usage, use the -i option:


    | Filesystem | Inodes | IUsed | IU% | Mounted on |

    |---|---|---|---|---||

    | /dev/sda2 | 2.0M | 108K | 1.9M | 6% | / |


    If you have network mounts (such as Samba or NFS), these will show up in toon
    your df output. To limit df to local file systems, use the following:


    ```

    $ df -hl Display disk space only for local file systems

    ```


    To add the file type to the listing, use the -T option:


    | Filesystem | Type | Size | Used | Avail% | Mounted on |

    |---|---|---|---|---|---||

    | /dev/sda | ext3 | 8.8G | 5.5G | 2.9G | 66% | / |


    To check disk space usage for particular files or directories in a file system,
    use the du command. The following command was run as the user named francois:


    ```

    $ du -h /home/ Show disk space usage for /home directory

    d: `/home/chris`: Permission denied

    4.0K

    /home/francois/Mail

    52K

    /home/francois

    64K

    /home/

    ```


    The output shows that access to another home directory''s disk use (in this case
    /home/chris) was denied for security reasons. The next examples show how to'
