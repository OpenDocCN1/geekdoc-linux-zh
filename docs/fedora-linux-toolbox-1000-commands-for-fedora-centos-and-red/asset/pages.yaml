    # Mounting and Unmounting File Systems


    Before you use a regular, non-swap file system, you need to attach it to a directory
    in your computer''s file tree by mounting it. Your root file system (/) and other
    file systems you are using on an ongoing basis are typically mounted automatically
    based on entries in your /etc/fstab file. Other file systems can be mounted manually
    as are needed using the mount command.


    # Mounting File Systems from the fstab file


    When you install Linux, the /etc/fstab file is usually set up automatically to
    contain information about your root file systems and other file systems. These
    systems can be set to mount at boot time or be ready to mount manually (with mount
    points and other options to use when a manual mount is done).


    Here is an example of /etc/fstab file:


    ```

    /dev/VolGroup00/LogVol100 / ext3 defaults 1 1

    LABEL=/boot /boot ext3 defaults 1 2

    tmpfs /dev/shm tmpfs defaults 0 0

    devpts /dev/pts devpts gid=5,mode=620 0 0

    ```'
