- img_proc: true
  md: '# Chapter 13: Doing Remote System Administration


    Although there are still some uses for the legacy remote commands (see the “Using
    Legacy Communications Tools” sidebar, most of this section describes how to use
    SSH commands to handle most of your needs for remote communications.


    # Using Legacy Communications Tools


    Despite the fact that SSH provides better tools for remote communications, legacy
    communications commands, sometimes referred to as “r” commands, are still included
    with most Linux distributions. Some of these tools will perform faster than equivalent
    SSH commands because they don''t need to encrypt. Some old-school Unix administrators
    may use them occasionally on private networks or still in old scripts. For the
    most part you should ignore these legacy remote commands, one of these commands
    in particular can be useful in some cases: telnet.


    The telnet command is still used to communicate with some network appliances (routers,
    switches, UPS, and some) that do not have the horsepower to run an ssh daemon.
    Even though it poses a security risk, appliance manufacturers include telnet support.


    One way to use the telnet command, however, is for troubleshooting many Internet
    protocols such POP3, SMTP, HTTP, and others. Under the hood, these plain-text
    protocols are simply automated telnet sessions when a client (such as a browser
    or mail agent) exchanges text with a server. The only difference is the TCP port
    use. Here is an example of how you could telnet to the HTTP port (80) of a web
    server:


    ```

    $ telnet www.example.com 80

    Trying 208.77.188.166...

    Connected to www.example.com.

    Escape character is ''^''.

    GET / HTTP/1.0

    nEnter a second carriage return here


    HTTP/1.1 200 OK

    ```


    Similarly, you can telnet to a mail server on port 25 (SMTP) and 110 (POP3) and
    use the proper commands to troubleshoot e-mail problems. For more descriptions
    of using the telnet command to troubleshoot network protocols, refer to Linux
    Troubleshooting Bible (ISBN 07645697X, Wiley Publishing, 2004), pages 505 and
    508.


    If you need to exit your telnet session, use the escape sequence (Ctrl+) by default.
    This will stop sending your keyboard input to the remote end and bring you to
    the telnet command prompt where you can quit or ? for more options.


    # Configuring SSH


    Nowadays, the Swiss Army knife of remote system administration is Secure Shell
    (SSH). SSH commands and services replace all the old tools and add encryption,
    public keys, and many other features. The most common implementation of SSH in
    the Linux world is OpenSSH (www.openssh.com), maintained by the OpenBSD


    13'
