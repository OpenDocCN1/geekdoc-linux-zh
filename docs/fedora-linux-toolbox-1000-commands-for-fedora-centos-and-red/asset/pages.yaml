  md: '# Using vi or Vim Editors


    Although easy-to-use graphical text editors (such as gedit and kedit) are readily
    available with Linux, most power users use vi or Emacs to edit text files. Besides
    the fact that vi and Emacs will work from any shell (no GUI editor), they offer
    other advantages such as required), hands never having to leave the keyboard and
    integration with useful utilities. Unlike GUI editors, text-based editors are
    usable over Internet connections such as dial-up or satellite.


    # IN THIS APPENDIX


    +   Using the vi editor


    +   Starting/quitting the vi editor


    +   Moving around in vi


    +   Changing and deleting text


    +   Using Ex commands


    +   Using visual mode


    This appendix focuses on features of the vi editor that can not help you with
    basic editing, but also help you do some advanced text manipulation. We chose
    to cover rather than Emacs because vi is more universal and leaner, and also because
    many Linux systems use the Vim (Vi Improved) editor in place of the older vi,
    the descriptions in this appendix are extended to cover Vim as well. Some features
    in Vim that are not in vi include multiple undo levels, syntax highlighting, and
    online help.


    > NOTE If you have never used vi or Vim before, try out the tutor that comes with
    the vim-enhanced package. Run the vimutor command and follow the instructions
    to step through many of the key features of vi and Vim.


    # Starting and Quitting the vi Editor


    If you want to experiment with using vi, you should copy a text file to practice
    on. For example, type:


    ```

    $ cp /etc/nittab /tmp

    ```


    Then open that using the vi command as follows:


    ```

    $ vi /tmp/nittab

    ```'
  merge: -1
