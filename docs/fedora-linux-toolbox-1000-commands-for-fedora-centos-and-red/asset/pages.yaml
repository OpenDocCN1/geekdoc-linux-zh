- img_proc: true
  md: '# Chapter 7: Administering File Systems


    In the examples above, the mount command will either look for an entry for /dev/sda1
    in the /etc/fstab file or try to guess the type of file system.


    Use -t to explicitly indicate the type of file system to mount:


    ```

    # mount -v ext3 /dev/sda1 /mnt/mymymount/ Mount an ext3 file system

    /dev/sda1 on /mnt/mymymount type ext3 (rw)

    ```


    You can also display the label/name of the partition that is mounted:


    ```

    # mount -vl ext3 /dev/sda1 /mnt/mymymount/ Mount file system/show label

    ```


    If you''re mounting something that is listed in your fstab already, you only need
    to specify one item: mount point or device. For example, with the following fstab
    entry:


    ```

    /dev/sda1 /mnt/mymymount ext3 defaults 1 2

    ```


    you can do either of the mounting to the file system:


    ```

    # mount -v /dev/sda1 Mount file system with device name only

    /dev/sda1 on /mnt/mymymount type ext3 (rw)

    # mount -v /mnt/mymymount/ Mount file system with mount point only

    /dev/sda1 on /mnt/mymymount type ext3 (rw)

    ```


    You can specify mount options by adding -o, and comma-separated list of options.
    They are the same options you can add field 4 of the /etc/fstab file. By default,
    partitions are read-write. You can explicitly indicate to mount a partition system
    as read-write (rw) or read-only (ro):


    ```

    # mount -v ext3 -o rw /dev/sda1 /mnt/mymymount/ Mount read/write

    /dev/sda1 on /mnt/mymymount type ext3 (rw)

    # mount -v ext3 -o ro /dev/sda1 /mnt/mymymount/ Mount read-only

    /dev/sda1 on /mnt/mymymount type ext3 (ro)

    ```


    A few useful mount options you can use include:


    +   - noatime Does not update the access time of files. Good on file systems with
    a lot of I/O, such as mail pools and logs.


    +   - noexec Prevents execution of binaries located on this file system. This
    can be used to increase security, for example /tmp in environments with untrusted
    users.


    +   - remount Change options on a mounted file system. With remount, you can unmount
    the file system and remount it with the new options in a single command. In this
    example, we change a previous read/write mount to read-only:


    ```

    # mount -v o remount,ro /dev/sda1

    /dev/sda1 on /mnt/mymymount type ext3 (ro)

    ```'
