  md: '# Chapter 12: Accessing Network Resources


    **WARNING!** The fourth example should be avoided in real life. Passwords that
    are entered in a command line end stored in clear text in ~/.bash_history. They
    may also be visible to other users in the output of ps auxw.


    When a connection is established to an FTP server, you can use a set of commands
    during the FTP session. FTP commands are similar to shell commands. Just like
    in a bash shell, you can press Tab to autocomplete file names. In a session, lftp
    also supports multiple jobs to the background (Ctrl+z) and returning them to foreground
    (wait or fg). These are useful if you want to continue traversing the FTP site
    while files are downloading or uploading. Background jobs run in parallel. Jobs
    to see a list of lftp session uses commands Type help to use a list of lftp commands.


    The sample lftp session uses commands when downloading:


    ```

    $ lftp mirrors.kernel -> pwd

    lftp://mirrors.kernel

    $ lftp mirrors.kernel -> ls

    drwxr-xr-x 8 4000 4096 02 20 20:19 debian/

    drwxr-xr-x 7 5337 77 May 21 13:37 fedora/

    $ lftp mirrors.kernel -> cd fedora/releases/7/Live/i386

    lftp://mirrors.kernel -> get Fedora-7-live-i386.iso

    Fedora-7-live-i386.iso at 776398 (467.2K/s at 26m: Receiving data)

    $ lftp mirrors.kernel -> Ctrl+z

    Send to background

    lftp mirrors.kernel -> mget /edu/*

    Get in all /edu/

    $ lftp mirrors.kernel -> ls

    Run local ls

    lftp mirrors.kernel -> bookmark Add Live

    Bookmark location

    lftp mirrors.kernel -> quit

    Close FTP

    ```


    This session logs as the anonymous user at mirrors.kernel. After changing to the
    directory containing the ISO image I was looking for, I downloaded it using the
    get command. By typing Ctrl+z, the download could continue while I did other activities.
    Next, the mget command (which allows wildcards as *) downloaded all files from
    /edu directory.


    Any command preceded by an exclamation mark (such as !ls) is executed by the local
    shell. The bookmark command saves the current location (in this case, ftp://mirrors.kernel/fedora/releases/7/Live)
    under the next time I can run lftp Live to return to the same location. The quit
    command ends the session.


    Here are some useful commands for an authenticated lftp upload session. This assumes
    you have the necessary permissions on the server:


