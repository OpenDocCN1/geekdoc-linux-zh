  md: '# Chapter 5: Manipulating Text


    # Paging Through Text


    When you have a large chunk of text and need to get more than just its beginning
    or end, you need a tool to page through the text. The original Unix system pager
    was the more command:


    ```

    $ ps aux | more

    $ more myfile.txt

    ```


    However, more has some limitations. For example, in the line with ps above, more
    could not scroll up. The less command was created as a more powerful and user-friendly
    more. The common saying when less was introduced was: "What is less is more! We
    recommend you no longer use more, and use less instead.


    > NOTE The less has another benefit worth noting. Unlike text editors such as
    vi, it does not read the entire file when it starts. This results in faster start-up
    times when viewing large files.


    The less command can be used with the same syntax as in more for these examples:


    ```

    $ ps aux | less

    $ cat myfile.txt | less

    $ less myfile.txt

    ```


    The less command enables you to navigate using the up and arrow keys, PageUp,
    PageDown, and the spacebar. If you are using less for a file (not standard input),
    press v to open the current file in vi. As in vi, Shift+g takes you to the end
    of the file. Shift+f takes you to the end of the file, and the scrolls scrolls
    as new input is added, mirroring to a tail -f.


    Press Ctrl+c to interrupt that mode. As in vi, while viewing a file with less,
    you can search for a string by pressing / (forward slash) followed by the string
    and Enter. For further occurrences, press / Enter repeatedly.


    To scroll forward and back while using less, use the f and b keys, respectively.
    For example, 10f scrolls forward 10 lines and 15 scrolls back 15 lines. Type d
    to scroll down half a screen and u to scroll up half a screen.


    # Paginating Text Files with pr


    The pr command provides a quick way to format a chunk of text into a form where
    it can be printed. This can be particularly useful if you want to print the results
    of some commands, without having to open up a word processor or text editor. With
    pr, you can format text with header information such as date, file name, and page
    number. Here is an example:


    ```

    $ rpm -qa | sort | pr --column=2 | less Paginate package list in 2 cols

    ```'
  merge: -1
