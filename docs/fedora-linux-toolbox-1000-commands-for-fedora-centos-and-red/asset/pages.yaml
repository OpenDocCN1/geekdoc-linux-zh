    # Using Device Files


    When applications need to communicate with your computer''s hardware, they direct
    data to device files. By convention, device files are stored in the /dev directory.
    Devices are generally divided into block devices (such as storage media) and character
    devices (such as serial ports and terminals).


    Each device file is associated with a major number (indicating the type of device)
    and minor number (the instance number of the device). For example, terminal (tty)
    devices are represented by major character 4, while SCSI hard disks are represented
    by major device 8. Here are examples of device files:


    ```

    $ ls -l /dev/tty0 /dev/sda      List character and special devices

    crw-rw---- 1 root disk 8, 1 2007-09-05 08:34 /dev/sda

    crw-rw---- 1 root 4, 0 2007-09-05 08:34 /dev/tty0

    ```


    A list of devices and numbers located in Linux is available in Fedora or the /usr/share/doc/MAKEDEV/*
    txt file. Most device files are created automatically at boot time, based on entries
    in the /etc/makevd.d directory. Most people never create device files manually,
    however you can create your own device file using the mknod command. Here''s an
    example:


    ```

    $ mknod /dev/ttyS4 4 68      Add device for fifth serial port

    $ ls -l /dev/ttyS4             List new device file

    crw-rw-rw-- 1 root 4, 68 Sep 06 00:35 /dev/ttyS4

    ```


    # Using Named Pipes and Sockets


    When you want to allow one process to send information to another process, you
    can simply pipe (|) the output from one to the input of the other. However, to
    provide a presence in the file system from which a process can communicate with
    other processes, you can create named pipes or sockets. Named pipes are typically
    used for interprocess communication on the local system, while sockets can be
    used for communicating over a network.


    Named pipes and sockets are set up by applications in the /tmp directory. Here
    are examples of named pipes and sockets:


    ```

    $ ls -l /tmp/TV-char/vttimeemifo-local /tmp/.X1-unix/X

    prw-rw-rw-- 1 chris chris 0 Sep 26 2007 /tmp/TV-char/vttimeemifo-local

    srwxrw-wx 1 root root 0 Sep 04 01:30 /tmp/.X11-unix/X0

    ```'
