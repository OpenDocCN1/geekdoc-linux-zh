    # Graphical Text Editors


    Just because you are editing text doesn''t mean you have to use a text-based editor.
    The main advantages of using a graphical text editor is that you can use a mouse
    to select menus, highlight text, copy and paste text, or run special plugins.


    You can expect to have the GNOME text editor (gedit) if your Linux system has
    the GNOME desktop installed. Features in edit enable you to check spelling, list
    document statistics, change display fonts and colors, and print your documents.
    The KDE desktop also has its own KDE text editor (kedit in kdeutils package).
    It includes similar features to the GNOME text editor, along with a few extras,
    such as the ability to send the current document with knail or another user-configurable
    KDE component.


    Vim comes with an X GUI version. It is launched with the gvim command, which is
    part of the vim-X11 package. If you''d like to turn GUI into a more user-friendly
    text editor, you can download a third-party configuration called Cream from http://cream.sourceforge.net/.


    Other text editors you can install nedit (with features for macros and executing
    shell commands) and leafpad (which is similar to the Windows Notepad text editor).
    The Scribes text editor (scribes) includes some advanced features for automatic
    correction, replacement, indentation, and word completion.


    # Listing, Sorting, and Changing Text


    Instead of just editing a single text file, you can use a variety of Linux commands
    to display, search, and manipulate the contents of one or more text files at a
    time.


