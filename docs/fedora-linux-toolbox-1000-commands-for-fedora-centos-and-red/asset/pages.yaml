  md: '# Chapter 11: Managing Network Connections


    To turn off auto-negotiation and hard-set the speed to 10 Mpbs, half-duplex, this
    is:


    ```

    # ethtool -s eth0 10 duplex autoneg off Change NIC settings

    ```


    The changes you made to your NIC settings are good for the current session. When
    you reboot, however, those setting will be lost. To make these settings stick
    at the next reboot or network restart, add the options you want to the EHTOOL_OPTS
    line in the /etc/sys/network-scripts/ifcfg-eth0 file. For example:


    ```

    ETHTOOL_OPTS="speed 10 duplex autoneg"

    ```


    As mentioned earlier, ethtool may not work on some older NICs. If you have an
    older NIC, try using mi-tool as:


    ```

    # mi-tool Show negotiated speed and link status of old NIC

    eth0: negotiated 100baseTx-FD flow-control, link ok

    ```


    This example was taken from the same machine as the one above, with the NIC auto-negotiating
    at 100 Mbps, full-duplex. The mi-tool command is misreading the speed setting.
    This is why we recommend using mi-tool only as a resort if ethtool does not work
    with your NIC.


    To display mi-tool output with more verbosity, use the -v option:


    ```

    # mi-tool -v Show verbose output of settings for old NIC

    eth0: negotiated 100baseTx-FD flow-control, link ok

    product info: vendor 00:50:43, model 12 rev 2

    basic mode: autonegotiation enabled

    basic status: autonegotiation complete, link ok

    capabilities: 100baseTx-FD 100baseTx-HD 10baseT-HD 10baseT-HD

    advertising: 100baseTx-FD 100baseTx-HD 10baseT-HD 10baseT-HD flow-control

    link partner: 100baseTx-FD 100baseTx-HD 10baseT-HD 10baseT-HD flow-control

    ```


    In the example above, you can see that each (100baseTx and 10baseT) supports both
    half-duplex (HD) and full duplex (FD). To disable auto-negotiation and a particular
    setting, use the -F option as:


    ```

    # mi-tool -F 10baseT-FD eth0 Force speed/duplex to 10baseT-FD

    ```


    If you change your mind and want to re-enable auto-negotiation, use the -r option:


    ```

    # mi-tool -r eth0 Re-enable auto-negotiation for an old NIC

    restarting autonegotiation...

    ```


    mi-tool does not provide a capability to save settings ethtool, so you have to
    run it after every reboot. This can be done by adding it to the end of /etc/rc.local.'
