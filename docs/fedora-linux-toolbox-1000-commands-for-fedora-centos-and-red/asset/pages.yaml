- img_proc: true
  md: '![](img/f31d58b45db9cf626cd14878d271e531_131_0.png)


    You may want to create thumbnails for your duck decoy collections. Or perhaps
    want to reduce all your wedding photos so they can play well on a digital photo
    frame. You might even want to add copyright information to every image in a directory
    before you share them on the Web. All these things can be done easily with the
    convert commands already described and some simple shell scripts.


    Here''s an example of a script you can run to resize an entire directory of photos
    to 1024 × 768 pixels to play on a digital photo frame:


    ```

    $ cd $HOME/images

    $ mkdir small

    $ for pic in `*.png`

    do

    echo "converting $pic"

    convert -resize 1024x768 $pic small/sm-$pic

    done

    ```


    Before running the script, this procedure changes the $HOME/images directory (which
    contains a set of high-resolution images). It then creates a subdirectory to hold
    the reduced images small. The script itself starts with a for loop that lists
    each file ending in .png in the current directory (you might need to make that
    .jpg or other image suffix). Then, each file is resized to 1024 × 768 and copied
    to the small directory, with sm- added to each file name.'
  merge: -1
