  md: '# Appendix A: Using vi or Vim Editors


    # Using Ex Commands


    The editor was originally built on an editor called Ex. Some of the vi commands
    you''ve seen so far start with a semicolon and are known as Ex commands. To enter
    Ex commands, start from normal mode and type a colon (:). This switches you to
    command line mode. In this mode, you can use the Tab key to complete your command
    or file name, and the arrow keys to navigate your command history, as you would
    in a bash shell. When you press Enter at the end of your command, you are returned
    to normal mode.


    Table A-6 shows some examples of Ex commands.


    # Table A-6: Ex Command Examples


    | Command | Result |

    |---|---|

    | !bash | Escape to a bash shell. When you are done, type exit to return to vi.
    |

    | !date | Run date (or any command you choose). Press Enter to return. |

    | !! | Rerun the command previously run. |

    | :20 | Go to line 20 in the file. |

    | :5,10 abc.txt | Write lines 5 through 10 to the file abc.txt. |

    | :e abc.txt | Leave the current file and begin editing the file abc.txt. |

    | :r def.txt | Read the contents of def.txt into the file below the current line.
    |

    | :s/RH/RedHat | Substitute Red for the first occurrence of RH on the current
    line. |

    | :s/RH/Red Hat/g | Substitute Red for all occurrences of RH on the current line.
    |

    | :%s/RH/Red Hat/g | Substitute Red for all the occurrences of RH in the entire
    file. |

    | :g/Red Hat/p | List every line in the file that contains the string "Red Hat".
    |

    | :g/gaim/s//pidgin/gp | Find every instance of gain and change it to pidgin.
    |


    From the ex prompt you can also see and change settings related to your vi session
    using the set command. Table A-7 shows some examples.


