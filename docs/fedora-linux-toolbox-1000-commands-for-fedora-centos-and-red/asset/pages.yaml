    # Changing Disk Partitions with fdisk


    The fdisk command is a small Linux tool for listing and changing disk partitions.
    Keep in mind that modifying or deleting partitions can cause valuable data to
    be removed, so be sure of your changes before writing them to disk. To use the
    fdisk command to list information about partitions on your hard disk, type the
    command as root user:


