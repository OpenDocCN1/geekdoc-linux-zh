    Besides the file systems types listed in the table, there are also what referred
    to as network shared file systems. Locally, a network shared file system may be
    an ext3, ntfs, or other normal file system type. Whether or all of those file
    systems can be shared with network protocols such as Samba (smbfs or cifs file
    type), NFS (nfs), and NetWare (ncfs)


    Many available file systems are either not useful for creating new file systems
    or not fully supported in every version of Linux. For example, file system types
    such as minix (for Minix), bbfs (for BeOS systems), and affs (for Amiga systems)
    are mostly useful if you need to mount and access old backup media from those
    systems. Even popular file systems may not be fully supported. For example, reiserfs
    file systems can''t be used with Security Enhanced Linux (SELinux) in Fedora and
    RHEL.


    # Creating and Managing File Systems


    Fedora and RHEL give you the option of either the anaconda installer create a
    default partitioning and file system scheme or letting you set all manually when
    you install Linux. The installer lets you choose to erase the entire hard disk,
    erase only partitions, or use free disk space to set up the partitions. To take
    the manual approach inside, you must choose to create a custom layout.


    With the manual approach, the disk-partitioning tool (formerly called Disk Druid)
    lets you divide the hard disk into partitions as you choose. Later, there are
    a lot of command-line utilities you can use to change and work with your disk
    partitions and the file systems created on those partitions.


    # Partitioning Hard Disks


    Historically, PC hard drives have used a 32-bit PC-BIOS partition table with a
    Master Boot Record (MBR). This limits partition sizes to 2TB and allows only four
    primary partitions per drive. The use of extended partitions is a to overcome
    the first'
