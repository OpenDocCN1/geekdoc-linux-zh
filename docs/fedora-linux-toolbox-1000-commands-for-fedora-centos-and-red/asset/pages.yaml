    of remote commands:


    ```

    $ ssh -L 12345:google.com:80 -N myserver

    ```


    # Using SSH as a SOCKS Proxy


    The previous example demonstrates that you can forward a port from the client
    to a machine other than the server. In the real world, the way to get your browser
    traffic out of your local network via an encrypted tunnel is SSH''s built-in SOCKS
    proxy feature. For example:


    ```

    $ ssh -D 12345 myserver

    ```


    The dynamic (-D) option of ssh enables you to log in to myserver (as usual). As
    long as the connection is open, all requests directed to port 12345 are forwarded
    to myserver. Next, set your browser of choice to use localhost port 12345 as a
    SOCKS v5 proxy and you''ll be good to go. Do not enter anything on the fields
    for HTTP and other protocols. They all work over SOCKS. See the Firefox Connections
    Settings window in Figure 13-1.


    To test your, disconnecting your ssh session and browsing to any web site. Your
    browser should give you a proxy error.


    From a Windows client, the same port forwarding can be accomplished in Putty by
    selecting Connection ✜ SSH ✜ Tunnels.


    # Using ssh with Public Key Authentication


    Up to this point, we''ve only used ssh with the default password authentication.
    The ssh command also supports public key authentication. This offers several benefits:


    +   - Automated logins scripts and cron jobs: By assigning an empty passphrase,
    you can use ssh in a script to log in automatically. Although this is convenient,
    it is also dangerous, because anybody who gets your key file can connect to any
    machine you can. Configuring for automatic login can also be done with a passphrase
    and a key agent. This is a compromise between convenience and security,


    +   - Two-factor authentication: When using a passphrase-protected key for interactive
    logins, authentication is done using two factors (the key and the passphrase)
    instead of one.'
