  md: '# Chapter 10: Managing the System


    The date command can also be used to change the system date and time. For example:


    +   # date 08121522008 Set date/time to Aug. 12, 2:21PM, 2008

    Tue Aug 12 11:42:00 CDT 2008

    # date --set=7 minutes'' Set time to 7 minutes later

    Sun Aug 12 11:49:33 CDT 2008

    # date --set=1 month'' Set date/time to one month earlier

    Sun Jul 11 11:50:20 CDT 2008


    The next time you boot Fedora, the system will be reset based on the value of
    your hardware clock (or your NTP server, if NTP service is enabled). And the next
    time you shut down, the hardware clock will be reset to the system, in order to
    preserve that time while the machine is powered off. To change the hardware clock,
    you can use the hwclock command.


    # Displaying and Setting Your Hardware Clock


    Anyone can use the hwclock command to view hardware clock settings; however, you
    must have privileges to change those settings. Use hwclock to view the current
    time from your computer''s hardware clock type, type the following:


    ```

    # hwclock -r Display current hardware clock settings

    Sun 12 Aug 2007 03:45:40 PM CDT -0.47403 seconds

    ```


    Even if your hardware clock is set to UTC time, hwclock displays local time by
    default. If your system time drifts from your hardware clock (for example, if
    you tried of the date commands shown previously), you can reset your system clock
    from your hardware clock as:


    ```

    # hwclock --hctys Reset system clock from hardware clock

    ```


    Likewise if your hardware clock is set incorrectly (for example, if you replaced
    the CMOS battery on your motherboard), you can set the hardware clock from your
    system clock as:


    ```

    # hwclock --systohc Reset system clock from hardware clock

    ```


    Over time your hardware clock can drift. The clock tends to drift the same each
    day (which it does in the /etc/adjtime file). You can adjust the hardware clock
    time based on the adjtime file as:


    ```

    # hwclock --adjust Adjust hardware clock time for drift

    ```


    To set the hardware clock to a specific time, you can use the --set option. Here
    is an example:


    ```

    # hwclock --set --date="3/18/08 18:22:00" Set clock to new date/time

    ```'
