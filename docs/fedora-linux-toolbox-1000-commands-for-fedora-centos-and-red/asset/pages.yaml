  md: '# # 13


    # # Doing Remote System Administration


    Most professional Linux administrators do not run a graphical interface on their
    Internet servers. As a result, when you need to access other computers you will
    almost surely need to work from the command line at some time. Luckily there are
    many feature-rich Linux commands to help you do so.


    Tools associated with the Secure Shell (SSH) service not only allow remote login
    and file transfer, but they also offer encrypted communication to keep your remote
    administration work. With tools such as Virtual Network Computing (VNC), you can
    have a server''s remote desktop appear on your local client computer. These and
    other features for doing remote systems administration are described in this chapter.


    | IN THIS CHAPTER |

    | Configuring SSH |

    | Using SSH for remote tunneling |

    | Using SSH to do more |

    | Using SSH to provide proxy service |

    | Using SSH with private keys |

    | Using screen remote multiplexing terminal |

    | Accessing remote Windows desktops |

    | Sharing remote Linux desktops with VNC |


    # # Doing Remote Login and Tuning with SSH


    Linux''s big brother Unix grew up on university networks. At a time when the only
    users of these networks were students and professors, and with networks mostly
    isolated from each other, there was little need for security.


    Applications and protocols that were designed in those times (the 1970s and 1980s)
    reflect lack of concern for encryption and authentication. SMTP is a perfect example
    of that. This is also true of the first generation of Unix remote: telnet, ftp
    (file transfer protocol), rsh (remote shell), rcp (remote copy), rexec (remote
    execution), and login (remote login). These tools send credentials and traffic
    in clear text. For reason, they are very dangerous to use the public, untrusted
    Internet, and have become mostly deprecated and replaced with the Secure Shell
    (SSH) commands (ssh, scp, sftp commands and related services).'
  merge: -1
