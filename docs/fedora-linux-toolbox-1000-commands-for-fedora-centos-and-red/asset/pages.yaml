  md: '# 14


    # Locking Down Security


    Securing your Linux system means first restricting access to the user accounts
    and services on that system. After that, security means checking that no one has
    gone around the defenses you have set up.


    | IN THIS CHAPTER |

    | Add user accounts and change user settings with useradd |

    | Change user accounts with usermod |

    | Delete users with userdel |

    | Add, change, and manage passwords passwd |

    | Manage groups with groupadd, groupmod, and groupdel |

    | See who''s logged in with last, lasth, and who |

    | Configure firewalls with iptables |

    | Manage log files with logrotate and logwatch |

    | Check out advanced security with SELinux, tripwire, and rpm |


    Fedora, Red Hat Enterprise Linux, CentOS, and other systems based on Linux distributions
    are designed to be secure by default. That means there are no user accounts with
    blank passwords, that the firewall is restrictive by default, and that most network
    services (Web, FTP, and so on) are off by default (even if their software is installed).


    Although many of the commands covered in this book can be used to check and improve
    the security of your Linux system, some basic Linux features are particularly
    geared toward security. For example, secure user accounts with good password protection,
    a solid firewall, and consistent logging (log monitoring) are critical to having
    a secure Linux system. Commands related to those features, plus some advanced
    features, such as SELinux and tripwire, are covered in this chapter.


    # Working with Users and Groups


    During Linux installation procedures, you are asked to assign a password to the
    root user (for system administration). Then you might be asked to create a user
    name of your choice and assign a password to that as well (for computer use).
    We encourage you to always log in as a regular user and only sudo to the root
    account when necessary. When Linux is installed, you can use commands or graphical
    tools to add more users, modify user accounts, and assign change passwords.'
  merge: -1
  pgno: 277
- img_proc: true
  md: '# Chapter 14: Locking Down Security


    # Managing Users the GUI Way


    For a desktop system with X, you can manage users and groups with the User manager
    (System Administration Users and Groups). When managing user accounts for servers,
    one option is to use web-based GUIs. The most commonly used general-purpose tool
    is Webmin (www.webmin.com). Make sure you do not run Webmin on its default port
    (10000) for security reasons. You can also use special-purpose web interfaces.
    For example, there are many web-hosting automation GUIs, such as cPanel (www.cpanel.com),
    Plesk (www.swsoft.com/plesk), and Ensim (www.ensim.com).


    # Adding User Accounts


    To add new users, you can use the user command. The only option that is required
    to add a new user is the user you are adding. You can see some of the default
    settings for adding a user by entering the -d:


    ```

    # useradd -D             Show useradd default values

    GROUP=100               Set group ID to 100 (users)

    HOME=/home              Set base home directory to /home

    INACTIVE=-1             Password expiration is disabled (-1)

    EXPIRE=                  Don''t set default to disable user account

    SHELL=/bin/bash         Set the default shell to /bin/bash

    SKEL=/etc/skel          Copy default config files from /etc/skel to HOME

    CREATE_MAIL_SPOOL=      Create a mail spool directory

    ```


    Fedora and other Hat-hosted systems override the default group (100) and create
    a new group for every user. By default, the user ID assigned to the first user
    created is 500 and the group ID is also 500. The group name is the same as the
    user name. The home directory is the user name appended to /home. So, for example,
    if you created the first regular user account on the system as:


    ```

    # useradd willz

    ```


    ```

    # passwd horatio

    Changing password for user horatio.

    New UNIX password: ********

    Retype new UNIX password: ******

    passwd: all authentication tokens updated successfully.

    ```


    > NOTE Remember to use strong, non-dictionary-based passwords.'
  merge: -1
  pgno: 278
- img_proc: true
  md: '# # Chapter 14: Locking Down Security


    There are many options you can enter to override the defaults when you create
    a user. Combine the different options as you choose. Here are some examples:


    +   * useradd -u 1001 -g skolmes

    * useradd -d /home/jj jome

    * useradd -g support,sales timd

    * useradd -c "Tom G. Totto" loto

    * useradd -s /bin/tcsh qoeq

    * useradd -e 2008-04-01 jerry

    * useradd -f 0 jdoe

    * useradd -s /sbin/nologin bilt

    * useradd -M billyq


    The -e option is useful for setting an expiration date for a user that needs to
    be temporary. Change the default shell to login when you want a user to be able
    to access the computer (via FTP, POP3, and so on), but you don''t want a user
    to access a regular Linux login shell. Likewise, the last (-M) might allow a user
    to access a machine, but not have a home directory.


    Before you add a user to a group, that group must exist (see the group command
    in the “Adding Groups” section later in this chapter). A user must belong to one
    initial group that can be defined with -g and can also belong to supplementary
    groups, defined with -G.


    ```

    $ groups francois List the groups that a user belongs to

    francois ftpusers

    ```


    # Changing useradd Defaults


    The default values you get when you create a new user account with useradd (default
    shell, GID, expire dates, and so on) are set by values in /etc/login.defs and
    /etc/useradd files. You can edit those files to change defaults or run the useradd
    command with the -D option to select or list change values:


    +   * useradd -D List default settings for useradd

    * useradd -D -b -s /bin/bash Set default base dir and shell

    * useradd -D -e 2009-01-01 Set all new users to expire in 2009


    As noted earlier, files and directories from the /etc/skel directory are copied
    to the new user''s home directory when the account is created. These files include
    some shell files and configuration files in the .kde. You can add other files
    and directories to /etc/skel so that each new user gets them. For example, if
    you are configuring a web server, you might create public_html and public_ftp
    directories for users to add web pages and files they want to share.


    249'
