  md: '# Chapter 6: Playing with Multimedia


    # # Ripping CD Music


    To be able to play your personal music collection from Linux, you can use tools
    such as cdparanoia to rip tracks from music CDs to WAV files on your hard disk.
    The ripped files can be encoded to save disk space, using tools such as eggenc
    (ogg Vorbis), flac (FLAC), or lame (MP3).


    NOTE There are some excellent tools for ripping and encoding CDs, such as grip
    and sound-jlicer. Because they are CDDB-enabled, these tools can also use information
    about the music on the CD to name the output files (artist, album, song, and so
    on). This section, however, describes how to use some of the underlying commands
    to rip and encode CD manually.


    Using cdparanoia, you can check that your CD drive is capable of ripping Compact
    Digital Audio (CDDA), retrieve audio tracks from your CDs drive, and copy them
    to hard. Start by inserting a music CD in your drive and typing the following:


    ```

    $ cdparanoia -veq

    ```


    Checking /dev/cdrom for cdrom...

    Checking for SCSI emulation...

    Checking for MMC style command set...

    Verifying CDDA command set...


    Table of contents (audio tracks only):

    | track | length | begin | copy | pre ch |

    |---|---|---|---|---||

    | 1. | 17908 | [03:58.58] | 0 | [00:00.00] | no no 2 |

    | 2. | 16872 | [03:44.72] | 18295 | [04:03.70] | no no 2 |

    | ... | | | | | |

    | 11. | 17908 | [03:58.58] | 174587 | [38:47.62] | no no 2 |

    | 12. | 17342 | [03:51.17] | 192495 | [42:46.45] | no no 2 (audio only) |

    | TOTAL | 20987 | [46:37.62] | | |


    The snippet output shows cdparanoia checking the capabilities of /dev/cdrom, looking
    for SCSI emulation and MMC command support, and verifying that the drive can handle
    CDDA information. Finally, it prints information about each track. Here are examples
    of cdparanoia command lines for ripping a CD to hard drive:


    ```

    $ cdparanoia -B Rip tracks as WAV files by track name

    $ cdparanoia -B -- "5-7" Rip tracks 5-7 into separate files

    $ cdparanoia -- "3-8" abc.wav Rip tracks 3-8 to one file (abc.wav)

    $ cdparanoia -- "1-[40]" Rip track 1 from 40 secs to end

    $ cdparanoia -f -- "3" Rip track 3 and save to AIFF format

    $ cdparanoia -a -- "5" Rip track 5 and save to AICF format

    $ cdparanoia -w -- "1" my.wav Rip track 1 and name it my.wav

    ```'
