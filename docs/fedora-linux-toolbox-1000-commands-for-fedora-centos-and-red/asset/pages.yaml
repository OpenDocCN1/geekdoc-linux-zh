    # Burning Backup Images with cdrecord


    The cdrecord command is the most popular Linux command line tool for burning CD
    and DVD images. If you have created an ISO image (as described earlier) or obtained
    one otherwise (such as downloading an install CD or live CD from the Internet),
    cdrecord makes it easy to put that image on a CD.


    > NOTE As of Fedora 7, cdrecord was replaced with the womind command. womind command
    was created from the cdrecord code base and still supports most of the options.
    If you run cdrecord, you will actually be running womind in this Fedora. If you
    have problems with that utility, contact the CDRKit project (http://cdkit.org).


    There is no difference in making a CD or DVD ISO image, aside from the fact that
    a DVD image can obviously be bigger than a CD image. Check the media you have
    for their capacities. A CD can typically hold 650MB, 700MB, or 800MB, whereas
    mini CDs can hold 50MB, 180MB, 185MB, or 193MB. Single-layer DVDs can hold 4.7GB,
    while double-layer DVDs can hold 8.4GB.'
