  md: '# Chapter 7: Administering File Systems


    You can create your own entries for any hard disk or removable media partitions
    you want in the /etc/fstab file. Remote file systems (NFS, Samba, and others)
    can also contain entries in the /etc/fstab file to automatically mount those file
    systems at boot time or by later.


    # Mounting File Systems

    with the mount Command


    The mount command is used to view mounted file systems, as well as mount any local
    (hard disk, USB drive, CD, DVD, and so on) or remote (NFS, Samba, and on) file
    systems. Here is an example of the command for listing file systems:


    ```

    $ mount List mounted remote and local file systems

    /dev/sda on / type ext3 (rw)

    proc on / proc type (rw)

    sys on /sys type sys (rw)

    devpts on /dev/pts type devpts (rw,gid=5,mode=620)

    /dev/sda on /mnt/debian type ext3 (rw)

    /dev/sda on /mnt/slackware type ext3 (rw)

    tmpfs on /dev/shm type tmpfs

    none on /proc/sys/fs/binfmt_misc type binfmt_misc (rw)

    sunprc on /var/lib/nfs/rpc_pipes type rpc_pipes (rw)

    ```


    Use the -t option to list only man of a file system type:


    ```

    $ mount -t ext3 List mounted ext3 file systems

    /dev/sda on / type ext3 (rw)

    /dev/sda on /mnt/debian type ext3 (rw)

    /dev/sda on /mnt/slackware type ext3 (rw)

    ```


    To display partition labels with mount information, use the -l option:


    ```

    $ mount -t ext3 -l List mounted ext3 file systems and labels

    /dev/sda on / type ext3 (rw) [/123]

    /dev/sda on /mnt/debian type ext3 (rw) [/mnt/debian]

    /dev/sda on /mnt/slackware type ext3 (rw) [/mnt/slackware]

    ```


    Here is a simple command to mount the /dev/sda device on an existing directory
    named /mnt/mymount:


    ```

    # mount /dev/sda /mnt/mymount/ Mount a local file system

    # mount -v /dev/sda /mnt/mymount/ Mount file system, more verbose

    mount: you didn''t specify a filesystem type for /dev/sda

    I will try ext!

    /dev/sda on /mnt/mymount type ext3 (rw)

    ```


    # 116'
