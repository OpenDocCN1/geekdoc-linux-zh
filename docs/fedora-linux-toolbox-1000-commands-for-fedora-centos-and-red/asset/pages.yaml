    # Checking Differences Between Two Files with diff


    When you have two versions of a file, it is useful to know the differences between
    the two files. For example, when upgrading an RPM, your old configuration file
    is typically left in place and the configuration file for the new version is created
    as file.rpmnew. When that occurs, you can use the diff command to discover which
    lines differ between your configuration and the new configuration, in order to
    merge the two. For example:


    ```

    $ diff /etc/named.conf.rpmnew /etc/named.conf

    ```


    You can change the output of diff to what is known as unified format. Unified
    format can be read by human beings. It adds three lines of context before and
    after each block of changed lines that it reports, and uses + and - to show the
    difference between the files. The following set of commands creates a file (f1.txt)
    containing a sequence of numbers (1–7), creates a file (f2.txt) with one of those
    numbers changed (using sed), and compares the two files using the diff command:


    ```

    $ seq 1 7 > f1.txt Send a sequence of numbers to f1.txt

    $ cat f1.txt Display contents of f1.txt

    1

    2

    3

    4

    5

    6

    7

    ```


