    # Cleaning Up Packages


    Using the clean option to yum, you can clean up packages, headers, metadata, cache,
    and dbcache left around by yum. If keepcache is set to 1 in /etc/yum.conf, as
    packages and headers are downloaded, they are saved in packages and headers directories
    of /var/cache/yum/repo/, respectively. Metadata are stored in repom.xml and comps.xml
    files in the directory. Here are ways of cleaning them out:


    ```

    # yum clean packages

    # yum clean metadata

    # yum clean headers

    # yum clean all

    ```


    Cleans out packages left over in cache

    Cleans out metadata left over in cache

    Cleans out headers left over in cache

    Cleans out metadata, headers, and packages


    # Useful Combinations of Options


    There are some options that can be very useful in certain situations. For example,
    enabling and disabling repositories can be useful on certain occasions. You can
    use --enablerepo= and --disablerepo= with a variety of yum options shown earlier,
    particularly if you know which repository you are interested in at the moment.
    Here are some examples (assume you have the livna repository enabled):


    ```

    # yum --enablerpo=livna search yum-utils

