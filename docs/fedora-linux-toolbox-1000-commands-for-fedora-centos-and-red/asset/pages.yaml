  md: '# Chapter 1: Starting with Fedora Linux


    # Command Reference Information in Fedora


    Original Linux and UNIX documentation was all done on manual pages, generally
    referred to as *man pages*. A more sophisticated documentation effort came a bit
    later with the *info* facility. Within each command itself, help messages are
    almost always available.


    This reference information is component oriented — in other words, there are separate
    man pages for nearly every command, file format, system call, device, and other
    component of a Linux system. Documentation more closely aligned to whole software
    packages is typically stored in a subdirectory of `/usr/share/doc` directory.


    All three references — man pages, info docs, and help messages — are available
    in Fedora.


    # Using help Messages


    The *-h* or *--help* options are often used to *display* help messages for a command.
    The following example illustrates how to *display help* for the command:


    ```

    $ ls --help | less

    Usage: ls [OPTION]... [FILE]

    List information about the FILEs (the current directory by default).

    Sort entries alphabetically if none of -ctfusUX nor --sort.

    ```


    +   Mandatory arguments to long options are mandatory for short options.

    -a, --all do not hide entries starting with .

    -A, --almost-all do not list implied and ..


    The preceding output shows how the *ls* command line lets and lists available
    options. Piping the output to the *less* command lets you page through it. You
    can format the help messages into a reference card using the *card* command. For
    example:


    ```

    $ ls --output=tmp/ls.ps

    $ lpr ls.ps

    ```


    The result here is a file named *ls.ps* that you can open in a PostScript reader
    (Select Rotate Right to view the card properly). You can use the *lpr* command
    to print the card, or if you don''t use the `--output* option, to send it to your
    default printer automatically.


    # Using Man Pages


    Suppose you want to *find* man pages for commands related to a certain word. Use
    the *apropos* command to search the man page database. This shows man pages that
    have *crontab* in the man page NAME line:


    ```

    $ apropos crontab

    ...

    ```'
