    # # Working with Software Packages


    Software delivered particularly for Fedora systems is packaged in what are called
    RPM packages. An RPM package (.rpm extension) contains not only the software you
    want to install, as a compressed archive, but it can also hold lots of information
    about the contents of the package. That information can include software descriptions,
    dependencies, computer architecture, vendor, size, licensing, and other information.


    When a basic Fedora system is installed, you can add, remove, and otherwise manage
    packages to suit how you use that system. Fedora, RHEL, CentOS, and other Linux
    systems use RPM Package Management (RPM) tools to create and manage software packages.
    You use two primary commands to manage RPMs in Fedora:


    +   - yum to download and install packages from online repositories. The yum command
    is preferred over rpm for installing packages in most cases because yum will get
    dependent packages needed by those you request to install, and by getting packages
    from official repositories, you are most likely to get the latest available packages.

    - rpm Use rpm to install RPM packages available from your local system (hard disk
    or CD/DVD) and otherwise manage installed packages (remove, query, and so on).
    Related commands and options are available for verifying software packages and
    repairing your RPM database, if problems should occur.'
