  md: "# # 4\n Working with Files\n\nEverything in a Linux file system can be viewed\
    \ as a file. This includes data files, directories, devices, named pipes, links,\
    \ and other types of files. Associated with each file is a set of information\
    \ that determines who can access the file and how they can access it. This chapter\
    \ covers many commands for exploring and working with files.\n\n+   IN THIS CHAPTER\n\
    * Setting permissions\n* Traversing the file system\n* Creating/copying files\n\
    * Using hard/symbolic links\n* Changing file attributes\n* Searching for files\n\
    * Listing and verifying files\n\n# ## Understanding File Types\n\nDirectories\
    \ and regular files are by far the file types you will use most often. However,\
    \ there are several other types of files you will encounter when you use Linux.\
    \ From the command line, there are many ways you can create, find, and list different\
    \ types of files.\n\nFiles that provide access to the hardware components on your\
    \ computer are referred to as device files. There are character and block devices.\
    \ There are hard links and soft links you can use to make the same file accessible\
    \ from different locations. Less often used directly by regular users are named\
    \ pipes and sockets, which provide access points for processes to communicate\
    \ with each other.\n\n# ## Using Regular Files\n\nRegular files consist of data\
    \ files (documents, music, images, archives, and so on) and commands (binaries\
    \ and scripts). You can determine the type of a file using the file command. In\
    \ the following example, you change to the directory containing bash shell documentation\
    \ and use the file command to view some of the file types in that directory:\n\
    \n```\n$ cd /usr/share/doc/bash*\n$ file article* bash*\narticle.ms: ASCII troff\
    \ or preprocessor input text\narticle.ps: PostScript document conforming to level\
    \ 3.0\n```"
