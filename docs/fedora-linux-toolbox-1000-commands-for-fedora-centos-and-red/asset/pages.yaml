  md: '# Chapter 5: Manipulating Text


    Adding a g to the end of the substitution line, as in the following command, causes
    every occurrence of francois to be changed to chris. Also, in the following example,
    input is directed to the file myfile.txt and output is directed to newfile.txt:


    ```

    $ sed s/francois/chris/g myfile.txt > newfile.txt

    ```


    The next example replaces the first occurrences of /var/www on each line in the
    /etc/httpd/conf/httpd.conf file with /home/www. Here, we have to use quotes and
    backslashes to escape the forward slashes so they are not interpreted as delimiters:


    ```

    $ s''/\var\/www\''//home\/www/'' < /etc/httpd/conf/httpd.conf

    ```


    Although the forward slash is the sed command''s default delimiter, you can change
    the delimiter to any character of your choice. Changing the delimiter can make
    it easier when the string contains slashes. For example, the previous line that
    has a path could be replaced with either of the following commands:


    ```

    $ s-''var/www/-/home/www/-'' < /etc/httpd/conf/httpd.conf

    $ sD/var/www/D/home/www/D < /etc/httpd/conf/httpd.conf

    ```


    In the first line, a dash (-) is used as the delimiter. In the second case, the
    D is the delimiter.


    The sed command can run multiple substitutions at once, by preceding each one
    with -e. Here, in the text streaming from myfile.txt, all occurrences of francois
    are changed to FRANCOIS and occurrences of chris are changed to CHRIS:


    ```

    $ sed -e s/francois/FRANCOIS/g -e s/chris/CHRIS < myfile.txt

    ```


    You can use sed to add newline characters to a stream of text. Where Enter appears,
    press the Enter key. The > on the second line is generated by hash, not typed
    in.


    ```

    $ echo aaabccc | sed ''s/b/\Enter''

    aaa

    ccc

    ```


    The trick just does not work on the left side of the sed substitution command.
    When you need to substitute newline characters, it''s easier to use the tr command.


