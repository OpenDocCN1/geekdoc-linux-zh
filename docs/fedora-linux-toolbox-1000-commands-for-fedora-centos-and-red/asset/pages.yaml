    # Managing Network Connections


    Starting and stopping the network interfaces for your Wired connections to your
    LAN or the Internet is usually handled automatically at the time you boot and
    shut down your Fedora system. However, you can use the service command to start
    and stop your network interfaces any time or use chconfig to change whether or
    not your network starts automatically.


    The ifconfig and ip commands can also be used to configure, activate, and deactivate
    interfaces. However, on Fedora and other Red Hat distributions, service and chconfig
    commands provide simpler tools to start and stop network interfaces. Therefore,
    in most cases, you should only use ifconfig and ip commands to get information
    about your Ethernet interfaces and NICs (as shown later in this section).


    # Starting and Stopping Ethernet Connections


    The reason that your wired Ethernet interfaces just come up in many cases when
    you boot Fedora is that the network service is set to be on when the system enters
    the common boot run levels (run level 3 and 5). There is a set of underlying configuration
    files and scripts that make that and a few commands that let you control it.'
  merge: -1
  pgno: 221
- img_proc: true
  md: '# Chapter 11: Managing Network Connections


    For Fedora, RHEL, control scripts and configuration files are located in the /etc/sysconfig/network-scripts/
    directory. NICs are configured by editing /etc/sysconfig/network-scripts/ifcfg-interface,
    where interface is your NIC''s network interface. For example, for the first Ethernet
    interface, the configuration is named ifcfg-eth0.


    To get more information on network-scripts files, type the following and search
    for the network-scripts section:


    ```

    $ /usr/share/doc/initscripts-*/sysconfig.txt

    ```


    The script that started the configured network-scripts files is /etc/init.d/network.
    As with other Linux services, you can start and stop the network service using
    the service command and set it to start automatically with the chconfig command.


    To take all NICs offline then bring them back online, allowing any change to the
    network scripts to take effect, type:


    ```

    # service network restart          Shutdown and bring up network interfaces

    Shutting down interface eth0:         { OK }

    Shutting down loopback interface:     { OK }

    Bringing up loopback interface:        { OK }

    Bringing up interface eth0:           { OK

    ```


    Use the start and stop options to start your network interfaces, respectively:


    ```

    # service network stop          Shutdown network interfaces

    # service network start         Bring up network interfaces

    ```


    To check the status of your network interfaces, type the following:


    ```

    # service network status          Check network interface status

    Configured devices:

    eth0

    Currently active devices:

    eth0

    ```


    The service command starts your network interfaces for the current session, but
    doesn''t configure them to start the next time your system boots. To configure
    your network connections to start when Linux boots, use the chconfig command as
    follows:


    ```

    # chconfig network on          Turn on network service to start at boot

    # chconfig --list network      View levels where network is on or off

    network  0:off 1:off 2:on 3:on 4:on 5:on 6:off

    ```


    If you have multiple network interfaces, you might want to bring one interface
    up or down. To do that, use the ifup and ifdown commands:


    ```

    # ifdown eth0             Take the eth0 network interface offline

    # ifup eth0               Bring the eth0 network interface online

    ```'
