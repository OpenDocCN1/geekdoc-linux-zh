    # Using Wireless Connections


    Setting up wireless connections in Fedora has been tricky in the past, primarily
    due to the fact that open drivers have not been available for the majority of
    wireless LAN cards on the market. The Fedora Project helped greatly solve this
    problem starting with Fedora 7 including firmware for LAN cards that can be freely
    distributed (although not as open source). Now many wireless cards can be detected
    and configured automatically in Fedora.


    Wireless configuration is an area where we would suggest using the GUI tools (in
    particular, the Network Configuration window described earlier in this chapter,
    or Network Manager) to do basic configuration. You may need to add wireless packages
    to this tool, such as wireless-tools and b43km-fwcutter packages, which are available
    with Fedora. Likewise, you may need firmware that is available in the following
    packages: iw2100-firmware, ipw2200-firmware, zd1211-firmware, and iwlwifi-firmware
    packages.


    If you are not able to configure your LAN card using the Network Configuration
    window, you may be able to get yours working using drivers and tools available
    from Atheros (www.atheros.com), the MadWifi (www.madwifi.org) project, or the
    Ndiswrapper project (ndiswrapper.sourceforge.net). RPM packages from those projects
    are available from the rpm.livna.org repository, described in Chapter 2.


    194'
