  md: '# Chapter 10: Managing the System


    The boot loader should now be installed on your hard disk''s MBR. If your grub.conf
    file is correct, your system should be able to reboot from hard disk now.


    # Repairing the initial ramdisk (initrd)


    The initrd file is located in /boot with a name like initrd-2.6.20-1.2316.fc5.img.
    If your initrd becomes corrupted, or if you need to add new block devices to it,
    run the minitrd command. First, make sure you make a copy of your existing initrd
    file. Then run the following command:


    ```

    # minitrd -f /boot/initrd-2.6.20-1.2320.fc5.img 2.6.20-1.2320.fc5

    ```


    Replace the kernel version in the example above (2.6.20-1.2320.fc5) with your
    own kernel version. Alternatively, to use the currently running kernel version,
    you can use:


    ```

    # minitrd -v -f /boot/initrd `uname -r` `uname -r`

    ```


    Unfortunately, you will realize that you need to reboot your initrd file if it
    is too late, as you witness a kernel panic during the root file system mount of
    boot. When that occurs, boot into rescue mode as described in the previous section
    and run minitrd after chrooting to the proper hard disk partition.


    # Controlling Startup and Run Levels


    After the kernel has started up, it hands control of the system to the init process.
    The init process becomes the first running process on the system (PID 1), directing
    the startup of other processes based on the contents of the /etc/inittab file,
    the default run level, and the init scripts to run at that run level.


    The default run level is typically set to 5 for desktop systems and 3 for server
    systems (based on the value of initdefault in the /etc/inittab file). As noted
    earlier, that value can be overridden by adding a different run level number (S,
    1, 2, 3, 4, or 5) to the end of the kernel boot line from the boot screen.


    Most Linux administrators leave the basic startup features alone and focus on
    which services are turned on or off at the selected run level. The mechanism for
    starting run level scripts in Fedora, RHEL, and similar systems is based on the
    System V init facility (sysv and includes packages), used originally in AT&T UNIX
    System V systems.


    This section contains commands for working with init scripts and changing run
    levels. As root, you can use the runlevel command to see the current run level:


    ```

    # runlevel

    Display current and previous run levels

    N3

    ```'
