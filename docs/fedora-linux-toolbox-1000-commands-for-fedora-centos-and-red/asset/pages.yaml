  md: '# Chapter 12: Accessing Network Resources


    # Transferring Files


    Commands in Linux for downloading files from remote servers (HTTP, HTTPS, FTP,
    or SSH) are plentiful and powerful. You might choose one command over another
    because of the specific options you need. For example, you may want to perform
    a download over an encrypted connection, resume an aborted download, or recurse
    downloads. This section describes how to use wget, ftp, lftp, scp, and scftp.


    # Downloading Files with wget


    Sometimes you need to download a file from a remote server using the command line.
    For example, you find a link to RPM software package, the link goes through several
    HTTP redirects that prevent rpm from installing from HTTP. You may want to script
    the automated download of a file, as a log file, every night.


    The wget command can download files from web servers (HTTP and HTTPS) and FTP
    servers. With a server that doesn''t require authentication, a wget command can
    be as simple as the wget command and the location of the download:


    ```

    $ wget \

    http://dag.wieers.com/rpm/packages/acread/acread-5.0.10-1.el5.rf.rpm

    ```


    If, an FTP server requires a login and password, you can enter information on
    the wget command line in the following:


    ```

    $ ftp://user:password@ftp.example.com/path/to/file

    $ wget --user=user --password=password ftp://ftp.example.com/path/to/file

    ```


    For example:


    ```

    $ wget://chris:mykulpwd@ftp.linuxtoys.net/home/chris/image.jpg

    $ wget --user=chris --password=mykulpwd \

    ftp://ftp.linuxtoys.net/home/chris/image.jpg

    ```


    You can use wget to download a single web page as follows:


    ```

    $ wget http://www.wiley.com          Download the Web page

    ```


    If you open the resulting index.html, you''ll have all sorts of broken links.
    To download all the images and other elements required to render the page properly,
    use the -p option:


    ```

    $ wget -p http://www.wiley.com          Download Web page and other elements

    ```


    But if you open the resulting index.html in your browser, chances you will still
    have all the broken links even though the images were downloaded. That''s because
    the links need to be translated to point to your local files. So do this, you:


    ```

    $ wget -pk http://www.wiley.com          Download pages and local file names

    ```


    # 211'
  merge: -1
  pgno: 241
- img_proc: true
  md: '# Chapter 12: Accessing Network Resources


    And if you''d like wget to keep the original file and also do the translation,
    type this:


    ```

    $ wget -pkK http://www.wiley.com  Rename to local names, keep original

    ```


    Sometimes an HTML file you download does not have a .html extension, but ends
    in .asp or .cgi instead. This may result in your browser not knowing how to open
    your local copy of the file. You can wget append .html to those files using the
    -O option:


    ```

    $ wget -E http://www.asexamples.com  Append .html to downloaded files

    ```


    With the wget command, you can recursively mirror an entire web. While copying
    files and directories for the entire depth of the server''s file structure, the
    -m option adds timestamping and keeps FTP directory listings. (Use this with caution,
    because it can take a lot of time and space):


    ```

    $ wget -m http://www.linuxxtoys.net

    ```


    Using some of the options described, the following command line results results
    in the most usable local copy of a web site:


    ```

    $ wget -mEkK http://www.linuxxtoys.net

    ```


    If you have ever had a large file download (such as a CD or DVD image file) disconnect-completed,
    you may find the -c option to wget a lifesaver. Using -c, wget resumes where it
    left off, continuing an interrupted file download. For example:


    ```

    $ wget http://example.com/DVD.iso  Begin downloading large file

    95%================= } 685,251,583K/s  Download killed before completion

    $ wget -c http://example.com/DVD.iso  Resume download where stopped

    ```


    HTTP request, awaiting response... 206 Partial Content

    Length: 699,389,952 (667), 691,513 (66M) remaining [text/plain]


    Because of the continue feature (-c), wget can be particularly useful for slow
    internet connections need to download large files. If you have ever had a several-hour
    download killed before it finished, you''ll know what we mean. (Note that if you
    don''t use -c when you mean to resume a file download, the file will be saved
    as a different file: the original name with .1 appended to it)


    # Transferring Files with cURL


    The client for URLs application (curl command) provides similar features to wget
    for transferring files using web and FTP protocols. However, the curl command
    can also transfer files using other popular protocols, including SSH protocols
    (SCP and SFTP), LDAP, DICT, Telnet, and more.


