  md: '# Chapter 5: Manipulating Text


    In this example, the rpm -qa command lists all software packages installed on
    your system and pipes that list to the sort command, to be sorted alphabetically.
    Next that list is piped to the pr command, which converts the single-column list
    into two columns --columns=2 and Finally, the less command enables you to paginate
    it through the text.


    Instead of paging the output, you can send the output to a file or to a printer.
    Here are examples of:


    ```

    $ rpm -qa | sort | pr --column=2 > pkg.txt   Send pr output to a file

    $ grep -qa | sort | pr --column=2 | lpr      Send pr output to printer

    ```


    Other text manipulation you can do with the pr command includes double-spacing
    the text (-d), showing control characters (-c), or offsetting the text a certain
    number of spaces from the left margin (for example, -o 5 indent fives from the
    left).


    # Searching for Text with grep


    The grep command is handy in when you need to perform more advanced string searches
    in a file. In fact, the phrase grep has actually entered the computer jargon as
    a verb, just as Google has entered the popular language. Here are examples of
    the grep command:


    ```

    $ grep francois myfile.txt Show lines containing francois

    $ grep 404 /var/log/httpd/access_log Show lines containing 404

    $ ps aux | grep grep               Show lines from ps output

    $ ps aux | grep "[[:]"             Show bracketed commands

    $ dmesg | grep "[l][ata]*"          Show ata kernel device

    ```


    These commands use some particular uses, beyond being examples of the grep command.
    By searching access_log for 404 you can see requests to your web server for pages
    that were not found (this could be someone fishing to exploit your system, or
    a page you moved or forgot to create). Displaying bracketed commands from the
    ps command is a way to see which ps cannot display options. The last command checks
    the kernel buffer for any ATA device information, such as hard disks and CD-ROM
    drives.


    The grep command can also recursively search for a whole lot of files at the same
    time. The following command recursively searches files in the /etc/httpd/conf
    and /etc/httpd.conf directories for the string VirtualHost:


    ```

    $ grep -R VirtualHost /etc/httpd/conf*

    ```


    Add line numbers (-n) to your grep command to find the exact lines where the search
    terms occur:


    ```

    $ grep -Rn VirtualHost /etc/httpd/conf*

    ```


