  md: '# Chapter 11: Managing Network Connections


    # Displaying netstat Connections and Statistics


    The tools above cover network troubleshooting mostly at the network layer (layer
    3). To display information about packets sent between transport-layer protocols
    (TCP and UDP) and ICMP, you can use the netstat command:


    ```

    $ netstat -s | less Show summary of TCP, ICMP, UDP activities

    ```


    You can see a list of all TCP connections, including which process is handling
    the connection:


    ```

    # netstat -tamp View active TCP connections

    Active Internet connections (servers and established)

    Proto Recv-Q Local Address Foreign Address State PID/Program name

    tcp 0 127.0.0.1:631 0.0.0.0:* LISTEN 2039/cupsd

    tcp 0 127.0.0.1:25 0.0.0.0:* LISTEN 2088/sendmail

    ```


    You can also view UDP connections as:


    ```

    # netstat -tamp View active UDP connections

    Active Internet connections (servers and established)

    Proto Recv-Q Local Address Foreign Address State PID/Program name

    udp 0 0.0.0.0:631 0.0.0.0:* 2039/cupsd

    udp 0 192.168.122.123 0.0.0.0:* 2067/ntpd

    ```


    To narrow your output from netstat to daemons bound to a TCP port, look for the
    word listen. For example:


    ```

    # netstat -tamp | grep -i listen View daemons listening to a port

    ```


    The command just shown is a great way to resolve port usage conflicts between
    daemons.


    # Other Useful Network Tools


    If you''d like to see header information about packets as they are sent and received
    by your system, use tcpdump. The tcpdump command has a list of advanced features,
    most of which revolve around filtering and finding a needle in a haystack of packets.
    If you run tcpdump on a remote machine, your screen will be flooded with all ssh
    traffic between your client and the remote machine. To start without having to
    learn too much about how tcpdump filtering works, run the following command:


    ```

    # tcpdump | grep -v ssh Find packets except those associated with ssh

    ```'
  merge: -1
  pgno: 236
- img_proc: true
  md: '# Chapter 11: Managing Network Connections


    If you''d like to dig deeper into packet-level traffic, use wireshark (formerly
    known as ethereal). Make sure you have the wireshark-gnome package installed so
    you can use the X version of wireshark. You can run wireshark with X over ssh
    on a remote machine. Wireshark is a very powerful packet sniffer that rivals the
    best commercial tools.


    To explore networks and remote machines and what services offer, use nmap. The
    nmap command is the most common port scanner. It was even featured in the The
    Matrix Reloaded! Make sure that you are explicitly authorized to scan the systems
    or networks you are scanning. The nmap command is the first of nmap package and
    can be run as a user, but several scan types require root privileges.


    Here''s how to do a basic host scan with nmap:


    ```

    # nmap 10.0.0.1 Scan ports on computer at 10.0.0.1

    ```


    To get maximum verbosity from nmap, use the -vv option:


    ```

    # nmap -vv 10.0.0.1 Show maximum verbosity from nmap output

    ```


    ```

    # nmap -vv -sP 10.0.0.0/24 Scan hosts on an entity network

    ```


    You can be very specific about the information that nmap gathers for. In the following
    example, the -P option tells nmap not to use ping (this is good for scanning machines
    that do not respond to ping). The -O option displays OS fingerprinting for the
    machine you are scanning. The -p 100-200 option tells nmap to scan only ports
    100 through 200:


    ```

    # nmap -vv -P -O -p 100-200 10.0.0.1 No ping, OS fingerprint, ports 100-200

    ```


    The nmap command has a lot more options for advanced usage. Refer to the nmap
    man page (man nmap) for further information.


    # Summary


    Nearly every aspect of the network connections from your Fedora system can be
    configured, checked, and monitored using command line tools. You can view and
    change settings of your NICs using ethtool and mii-tool commands. You can view
    network statistics with netstat.'
