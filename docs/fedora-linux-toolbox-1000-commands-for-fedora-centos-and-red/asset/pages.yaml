    # Streaming Media


    If your music is on one machine, but you’re working from another machine, setting
    up a streaming server is a quick way to broadcast your music so it can be picked
    up from one or more computers on your network. The icecast streaming media server
    and ices audio source client can be installed in Fedora by:


    ```

    $ yum install icecast ices

    ```


    Here’s a quick and dirty procedure for setting up icecast and ices to stream your
    music. Perform this task on the computer that contains the music you want to serve:


    +   1. Edit the /etc/icecast.xml file to change all passwords loaded. Search for
    hackme to find the current passwords. You probably want different user and administrative
    passwords, especially if you allow others to stream to the server. Remember the
    passwords you set for later. You may want to change other settings in this file
    as well, such as hostname.'
