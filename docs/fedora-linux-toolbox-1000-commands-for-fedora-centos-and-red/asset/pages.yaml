  md: '# Chapter 12: Accessing Network Resources


    # Sharing Remote Directories with Samba


    Samba is the open source implementation of the Windows file and print sharing
    protocol originally known as Server Message Block (SMB) and now called Common
    Internet File System (CIFS). There is an implementation of Samba in Linux, as
    well as in many other operating systems.


    Graphical tools for sharing, querying, and mounting shared SMB directories from
    Windows include the Samba SWAT web-based administration tool. To use the SWAT
    tool in Linux, install the samba-swat package, enable the xinetd service (by typing
    xinetd) and turn on SWAT (chkconfig swat on). Open SWAT by pointing your browser
    to the SWAT service (http://localhost:901) and typing the root user name and password.


    Commands for working with Samba shares can be used to query SMB servers, mount
    directories, and share directories.


    # Viewing and Accessing Samba Shares


    To scan your network for SMB hosts, type the following:


    ```

    $ findsmb

    *=DMB

    +=LMB

    IP ADDR NETBIOS NAME WORKGROUP/OS/VERSION

    192.168.1.1 SERVER1 +[MYWORKGROUP] [Unix] [Samba 3.0.25a-3.fc7]

    ```


    To view a text representation of your network neighborhood (shared directories
    and printers), use smbtree:


    ```

    # smbtree

    Password: ******

    MYGROUP

    \THPSON Samba Server Version 3.0.25a-3.fc7

    \THPSON\hp2100 HP LaserJet 2100M Printer

    \THPSON\IPC$ IPC Service (Samba Server Version 3.0.25a-3.fc7)

    \EINSTEIN HP DeskJet 5550 Printer

    \EINSTEIN\IPC$ IPC Service (Samba Service

    ```


    To add an existing Linux user as a Samba user, use the smbpasswd command:


    ```

    # smbpasswd -a francois

    New SMB password: ******

    Retype new SMB password: ******

    Added user francois

    ```'
