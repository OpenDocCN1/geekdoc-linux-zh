    # Listing Files


    When you list files, you are probably familiar with the ls command, you may not
    be familiar with many of the useful options for ls that can help you find out
    a lot about the files on your system. Here are some examples of using ls to display
    list (-1) of files and directories:


    ```

    $ ls -1          Files and directories in current directory

    $ ls -la         Includes files/directories beginning with dot (.)

    $ ls -lt         Orders files by time changed

    $ ls -1u         Orders files by time recently accessed

    $ ls -S          Orders files by size

    $ ls -i          Lists the node associated with each file

    $ ls -n          List numeric user/group IDs, instead of name

    $ ls -h          List file size in human-readable form (K, M, etc.)

    $ ls -R          List files recursively, from current directory and subdirectories

    ```


    When you list files, there are also ways to have different types of files that
    appear differently in the listing:


    ```

    $ ls -F          Add a character to indicate file type

    FC70            FC/  memo.txt pipefile| script.socket*

    $ ls --color=always Show file types as different colors

    $ ls -C          Show file listing in columns

    ```


    In the -F example, the output shows several different types of files. The FC70
    indicates a regular directory, memo.txt is a regular file (no extra characters),
    pipefile| is a named pipe (created with mkfifo), script.sh* is an executable file,
    and xid.socket is a socket. The next examples display different file types in
    different colors and list out columns, respectively.


    # Verifying Files


    When files such software packages and CD or DVD images are shared over the Internet,
    a SHASUM or MD5 file is published with it. These files contain checksums that
    can be used to make sure that the file you downloaded is exactly the one that
    the repository published.


    The following are examples of the md5sum and shalsum commands being used to produce
    checksums of:


    ```

    $ md5sum FC-6-i386-rescuecd.iso

    54881969da026da24a92db4aad1bcc6 FC-6-i386-rescuecd.iso

    $ shalsum FC-6-i386-rescuecd.iso

    834df761b9c0a5dc5010d9730dac998103a68 FC-6-i386-rescuecd.iso

    ```'
