  md: '# Chapter 10: Managing the System


    # Mastering Time


    Keeping correct time on your Linux system is critical to the system''s proper
    functioning. Your computer running Linux keeps time in two different ways: a system
    clock (which Linux uses to keep track of time) and a hardware clock (that sets
    the system when Linux boots up).


    The system time is used to set timestamps for file creation, process runtimes,
    and anything else where date and time are used. System time can be viewed and
    manually (with the `date` command) or automatically (with the `ntpd` service).


    The hardware clock is part of the motherboard''s CMOS and runs on a battery attached
    to the motherboard when the system is powered off. You set the hardware clock
    with the `hwclock` command.


    There are many other tools that can be used to work with time in Linux systems.
    For example, there are tools for checking time in different ways, such as using
    `clockdiff` (to measure clock difference between computers) and `uptime` (to see
    how long your system has been up).


    # Changing Time/Date with Graphical Tools


    Graphical tools in Fedora, RHEL, and other Linux systems for changing the date,
    time, and time zone on your system include the Date/Time Properties window (system-config-date
    command). That window can also be used to enable the Network Time Protocol (NTP),
    to automatically synchronize your Linux system''s date and time with a selected
    time server over the network.


    The Date/Time Properties window modifies the `/etc/sysconfig/clock` file. During
    Fedora startup, the `/etc/sysconfig/clock` file is read to set your time zone
    and whether your system is using UTC time.


    Your Linux system''s time zone is based on contents of the `/etc/localtime` file.
    You can set a new zone immediately by copying the file representing your time
    zone from `/usr/share/zoneinfo`. For example, to change the current time to that
    of America/Chicago, you could do the following:


    ```

    * /usr/share/zoneinfo/America/Chicago /etc/localtime

    ```


    This can also be accomplished by creating a link:


    ```

    # ln -s /usr/share/zoneinfo/America/Chicago /etc/localtime

    ```


    To change the time zone permanently, set the ZONE value in `/etc/sysconfig/clock`
    to the time zone you want. For example, ZONE="America/Chicago".'
