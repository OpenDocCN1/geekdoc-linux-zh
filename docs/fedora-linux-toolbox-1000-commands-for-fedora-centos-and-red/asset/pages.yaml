    as root user, but want to open the mailbox for the user chris, type is this:


    ```

    mail -f /var/spool/mail/chris

    ```


    # Managing-mail with mut


    If you want to use a command-line mail client on an ongoing basis, we recommend
    you use mut instead of mail. The mail command has many limitations, such as with
    the being able to send attachments without encoding them in advance (such as the
    uuencode command), while mut has many features for handling modern e-mail needs.
    The mut command is part of the mut package.


