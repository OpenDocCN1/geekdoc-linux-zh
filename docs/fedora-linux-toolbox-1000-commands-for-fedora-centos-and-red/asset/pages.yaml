  md: '# Chapter 3: Using the Shell


    The following example code assigns the string abc to the variable MYSTRING. It
    then tests the input to see if it equals abc and acts based on the outcome of
    the test. Test is what takes place between the brackets ( [ ):


    ```

    MYSTRING=abc

    if $MYSTRING = abc ; then

    echo "The variable is abc"

    fi

    ```


    To negate the test, use != instead of = as shown in the following:


    ```

    if [ $MYSTRING != abc ]; then

    echo "MYSTRING is not abc"


    ```


    The following are examples of testing for numbers:


    ```

    MYNUMBER=1

    if [ $MYNUMBER -eq 1 ]; then echo "MYNUMBER equals 1"; fi

    if [ $MYNUMBER -lt 2 ]; then echo "MYNUMBER < 2"; fi

    if [ $MYNUMBER -le 1 ]; then echo "MYNUMBER <= 1"; fi

    if [ $MYNUMBER -gt 0 ]; then echo "MYNUMBER > 0"; fi

    if [ $MYNUMBER -ge 1 ]; then echo "MYNUMBER >= 1"; fi

    ```


    Let''s look at some tests on file names. In this example, you can check whether
    a file exists (-e), whether it a regular file (-f), or whether is a directory
    (-d). These checks are done with if/then statements. If there is no match, the
    else statement is used to produce the result.


    ```

    filename="HOME"

    if [ -e $filename ]; then echo "$filename exists";nif [ -f $filename ]; then

    echo "$filename is a regular file"

    elif [ -d $filename ]; then

    echo "$filename is a directory"

    elelse

    echo "I have no idea what $filename is"

    nfi

    ```


    Table 3-1 shows examples of tests you can perform on files, strings, and variables.


    # Table 3-1: Operators for Test Expressions


    | Operator | Test being performed |

    | - | - |

    | -a file | Check that the file exists (same as -e). |

    | -b file | Check whether the file is a special device. |

    | -c file | Check whether the file is a character special device. |'
