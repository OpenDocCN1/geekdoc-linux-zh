    # Delegating Power with sudo


    The sudo command allows very granular delegation of power to users other than
    the root user. The sudo facility is a great tool when you have multiple users
    for granting specific escalated privileges and logging everything the users do
    with those privileges. Unless otherwise specified, sudo runs as root.


    The sudo command is configured in /etc/sudoers.


