  md: '# 10


    # Managing the System


    Without careful management, the demands on your Linux system can sometimes exceed
    the resources you have available. Being able to monitor your system''s activities
    (memory, CPU, and device usage) over time can help you make sure that your machine
    has enough resources to do what you need to. Likewise, managing other aspects
    of your system, as the device drivers it uses and how the boot process works,
    can help avoid performance problems and system failures.


    This chapter is divided into several sections that relate to managing your Fedora
    or other Linux system. The first section can help you monitor the resources (processing
    power, devices, and memory) on your Linux system. The next section describes how
    to check and set your system clock. Descriptions of the boot process and subsequent
    run levels follow. The last sections describe how to work with the kernel and
    related device drivers, as well as how to view information about your computer''s
    hardware components.


    # IN THIS CHAPTER


    +   * Checking memory usage with free, top, vmstat, and slabtop

    * Viewing usage with iostat, dstat, and top

    * Monitoring storage devices with iostat, vmstat, and isof

    * Working with dates/time using date, hwclock, cal, and ntp

    * Changing GRUB boot behavior

    * Rebuilding the initial ramdisk

    * Dealing with run levels with reboot and init

    * Adding, removing, and listing services with chconfig and service

    * Shutting down the system with reboot, halt, and shutdown

    * Checking and changing kernel driver settings with imsd, modinfo, and modprobe

    * Watching hardware settings with lspci, dmidecode, and hdparam


    # Monitoring Resources


    Fedora, RHEL, CentOS, and other Linux systems can do a wonderful job of keeping
    track of what they do. If you care to look, you can find lots of information about
    how your CPU, hard disks, virtual memory, and other computer resources are being
    used.


    You can go to the Linux kernel real-time information about your system by directly
    viewing the contents of files in the /proc filesystem (see Appendix C). An alternative,
    however, is to use commands to view information about how'
