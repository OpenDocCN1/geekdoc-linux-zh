    info database by simply typing the info command or by opening a particular component:


    ```

    $ info ls

    ```


    The previous command shows information on the ls command. Use up, down, left,
    and right arrows and Page Up and Page Down to move around the screen. Home and
    End keys go to the beginning and end of a node, respectively. When you are displaying
    the info screen, you can get around using the keystrokes shown in Table 1-4.


    # Table 1-4: Moving through the Info Screen


    | Keystroke | Movement |

    | --- | --- |

    | ? | Display the basic commands to use in info windows. |

    | Shift+l | Go back to the previous node you were viewing. |

    | n, p, u | Go to the node that is next, previous, or up. |

    | Tab | Go to the next hyperlink that is in this node. |

    | Enter | Go to the hyperlink that is under the cursor. |

    | Shift+r | Follow a cross-reference. |

    | Shift+q | Quit and exit from info. |


    Software packages that have particularly extensive text available in the info
    database include gzip, festival, lib, automate, zip, sed, tar, and bash. Files
    used by the info database are stored in the /usr/share/info directory.


    # Summary


    Although you can read this book from cover to cover if you like, the book is designed
    to be a reference to hundreds of features in Fedora Linux that are most useful
    to power users and systems administrators. Because information is organized by
    topic, instead alphabetically, you don''t have to know the commands in advance
    to find what you need to get the job done.


    Most of the features described in this book will work equally well in Fedora,
    Red Hat Enterprise Linux, CentOS, and other Linux systems based on technology
    from Red Hat, Inc. In fact, many of the commands described here are in widespread
    use that you could use them exactly as described here on most Linux and UNIX systems.


    The next chapter describes how to get and install Fedora Linux software.'
