    We prefer to use the awk command when columns are separated by a varying number
    of spaces, such as the output of the ps command. And we prefer the cut command
    when dealing with deletes by commas (,) or colons (:); such as the /etc/ password
    file.


    # Converting Text Files to Different Formats


    Text files in the Unix world use a different end-of-line character (\n) than those
    used in the DOS/Windows world (\r\n). You can view these special characters in
    a text file with the od command:


    ```

    $ od -c -t x1 myfile.txt

    ```


    So they will appear properly when converted from one environment to the other,
    it is necessary to convert the files. Here are some examples:


    ```

    $ unix2dos myfile.txt > dosfile.txt

    $ cat dosfile.txt > dos2unix myfile.txt

    ```


    The unix2dos example shows how convert a Linux or Unix text file (mynixfile.txt)
    to a DOS or Windows text file (dosfile.txt). The dos2Unix example does the opposite
    by converting a DOS/Windows file to a Linux/Unix file.


    # Summary


    Linux and Unix systems traditionally use plain text files for system configuration,
    documentation, output from commands, and many forms of stored information. As
    a result, many commands have been created to search, edit, and otherwise manipulate
    plain text files. Even with today’s GUI interfaces, the ability to manipulate
    plain text files is critical to becoming a power Linux user.


    This chapter explores some of the most popular commands for working with plain
    text files in Linux. Those commands include text editors (such as vi, nano, and
    JOE), as well as commands that can edit streaming data (such as sed and awk commands).
    There are also commands for sorting text (sort), counting text (wc), and translating
    characters in text (tr).'
