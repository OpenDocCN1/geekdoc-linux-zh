  md: '# Chapter 12: Accessing Network Resources


    Because elinks supports multiple colors, as long as the terminal you are using
    supports multiple colors, it’s easy to spot links and headings in the text. (Colors
    may not work within a screen session.) Here are some examples of elinks command
    lines:


    ```

    $ elinks  Prompts for file name or URL

    $ elinks www.handsonhistory.com  Opens file name or URL you request

    ```


    If you have a mouse available, click near the top of the window to see the menu.
    Select the menu or item you want. Select a link to go to that link. Table 12-1
    shows elinks keyboard navigation keys.


    Table 12-1: Control Keys for Using elinks


