  md: '# Chapter 4: Working with Files


    Using the -P and -L options pwd and cd, you can work with symbolically linked
    directories in their permanent or link locations, respectively. For example, cd
    -L .. takes you one level to your home directory, whereas cd -P .. takes you one
    level above the permanent directory (/). Likewise, the -P and -L options to pwd
    show permanent and link locations.


    Bash can remember a list of working directories. Such a list can be useful if
    you want to return to previously visited directories. That list is organized in
    the form of a stack. Use pushd and popd to add and remove directories.


    ```

    $ pwd

    home/francois

    $ pushd /usr/share/man/

    /usr/share/man ~

    $ pushd /var/log/

    /var/log /usr/share/man ~

    $ dirs

    /var/log /usr/share/man ~

    $ dirs -v

    0 /var/log

    1 /usr/share/man

    2 ~

    $ popd

    /usr/share/man ~

    $ pwd

    /usr/share/man

    $ popd


    $ pwd

    home/francois

    ```


    The dirs, pushd, and popd commands can also be used to manipulate the order of
    directories on the stack. For example, pushd -0 pushes the last directory on the
    stack to the top of the stack (making it the current directory). The pushd -2
    pushes the third directory from the bottom of the stack to the top.


    # Copying Files


    Provided you have permission to the target directory, copying files and directories
    can be done with fairly simple commands. The standard cp command will copy a file
    to a new name or the same name in a new directory, with a new time stamp associated
    with the new file. Other options to cp let you retain date/time stamps, copy recursively,
    and prompt before overwriting. Here are some examples:


    ```

    # cd ; touch index.html

    # cp -i index.html /var/www/html/

    # cp -il index.html /var/www/html

    ```'
