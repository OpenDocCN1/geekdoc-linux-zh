- img_proc: true
  md: '# Chapter 7: Administering File Systems


    and scan a file system for errors at the logical level with the fsck command.
    Here''s

    how to scan for bad blocks:


    ```

    # badblocks /dev/sda          Physically scan hard disk for bad blocks

    # badblocks -v /dev/sda     Add verbosity to hard disk scan

    Checking blocks 0 to 200781

    Checking for bad blocks (read-only) test: done

    Pass completed, 0 bad blocks found.

    ```


    By default, badblock does a safe-read test of the blocks. You can also perform
    a

    on-destructive/write test. This is the slowest, but the best one you can per-

    without destroying the data on the device. -s is to see the ongoing progress:


    ```

    # badblocks -vs /dev/sda     Check bad blocks, non-destructive

    Checking for bad blocks in non-destructive read-write mode

    From block 0 to 200781

    Testing with random pattern: Pass completed, 0 bad blocks found.

    ```


    The following command performs a faster, destructive read-write test:


    > WARNING! This will erase all the data on the partition.


    ```

    # badblocks -vw /dev/sda     Check bad blocks, destructive

    Checking for bad blocks in read-write mode

    From block 0 to 200781

    Testing with pattern 0xaa: done

    Reading and comparing: done

    Testing with pattern 0x55: done

    Reading and comparing: done

    Testing with pattern 0xff: done

    Reading and comparing: done

    Testing with pattern 0x00: done

    Reading and comparing: done

    Pass completed, 0 bad blocks found.

    ```


    You can perform multiple badblocks passes; for example, this command line can
    be used to

    burn in a drive and screen for high infant mortality:


    ```

    # badblocks -vsw /dev/sda

    ```


    Like the mkfs command, the fsck command is just a front to file-system-specific

    utilities. You can check an ext3 file system by simply adding the device name
    of the disk

    partition you want to check to the fsck command:


    ```

    # fsck /dev/sda

    fsck 1.39 (29-May-2006)

    e2fsck 1.39 (29-May-2006)

    mypart has gone 18 days without being checked, check forced.

    Pass 1: Checking inodes, blocks, and sizes

    Pass 2: Checking directory structure

    Pass 3: Checking directory connectivity

    ```'
