    # Using the pico and nano Editors


    Pico is a popular, very small text editor, distributed as part of the Pine e-mail
    client. Although Pico is free, it is not truly open source. Therefore, many Linux
    distributions, including Fedora, do not offer Pico. Instead, they offer an open
    source clone of Pico called nano (nano''s ancestor). This section describes the
    nano editor.


    Nano (represented by the nano command) is a compact text editor that runs from
    the shell, but is screen-oriented (owing to the fact that it is based on Pine''s
    editor library). Nano is popular with those who formerly used the Pine e-mail
    client because nano''s editing features are the same as those used by Pine''s
    editor. On the rare occasion that you don''t have the vi editor available on a
    Linux system (such as when installing a minimal Gentoo Linux), nano may be available.
    Nano is part of the nano package and relies on the aspell package for spell checking.


    As with the JOE editor, instead of having command and typing modes, you can begin
    typing. To open a text file for editing, just type nano and the file name or use
    some of the following options:


    ```

    $ nano memo.txt      Open memo.txt for editing

    $ nano -B memo.txt      When saving, back up previous to ~filename

    $ nano -m memo.txt      Turn on mouse to move cursor (if supported)

    $ nano +83 memo.txt     Editing begin line 83

    ```


    With JOE, to add text, just begin typing. Use arrow keys to move the cursor left,
    right, up, or down. Use the Delete key to delete text under the cursor or the
    Backspace key to erase text to the left of the cursor. Press Enter to add a line
    break. Press Ctrl+g to read help text. Table 5-3 shows the control codes for nano
