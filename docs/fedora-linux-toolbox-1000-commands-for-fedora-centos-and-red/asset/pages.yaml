    # Configuring the Built-In Firewall


    A firewall is a critical tool for keeping your computer safe from intruders over
    the

    Internet or other network. It can protect your computer by checking every packet
    of

    data comes to your computer''s network interfaces, making a decision about

    what to do with that packet based on the parameters you set. The firewall facility
    built

    to the current Linux kernel is called iptables. (You may also hear of iptchains,
    which

    was iptables''s predecessor in kernel 2.2 and below).


    The iptables facility (www.netfilter.org) is extraordinarily powerful, yet complex

    to use from the command line. For reason, many people set their basic firewall

    using a graphical interface. Fedora comes with the Security and Configuration-

    window (select System ↩ Administration ↩ Firewall and SELinux) for configuring

    basic firewalls. It also offers add-on packages such as Firestarter (firestarter
    package),

    FWBuilder (fwbuilder package) and Shorewall (shorewall package) for graphically

    configuring.


    255'
