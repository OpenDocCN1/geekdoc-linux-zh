  md: '# Chapter 10: Managing the System


    Although the service command starts the run level script service immediately,
    to have a service start automatically at boot time or during a run level change,
    you can use the chconfig command. With chconfig, you can list services, turn them
    on, or turn them off on a per-run level basis. Here are examples:


    ```

    # chconfig smb               Turn on the Samba service

    # chconfig --list smb      List runlevels service is on or off

    smb       0:off 1:off 2:on 3:on 4:on 5:on 6:off

    # chconfig --list           List all services, indicating on or off

    # chconfig --level 2 smb   Turn off Samba for run level 2

    ```


    When an init script starts at /etc/init.d, chconfig needs to be aware of its existence.
    This is done automatically when the new init script is part of an rpm, and needs
    to be done manually if you add your new init scripts. To do so, run the following:


    ```

    # chconfig --add mydaemon   Add /etc/init.d/mydaemon to chconfig

    ```


    Although you can use the init command to change to run level, including init 0
    (shut down) and 6 (reboot), there are also specific commands for stopping Linux.
    The advantages of commands such as halt, poweroff, and shutdown are that they
    include options to turn off some features before shutdown, especially on a remote
    system. For example:


    > **WARNING!** Don''t try to follow the commands if you don''t intend to turn
    off your system, especially on a remote system.


    ```

    # reboot               Reboot the computer

    # halt -n             Don''t sync to sync hard drives before shutdown

    # halt -h              Put hard drives in standby mode before halting

    # shutdown -r 10      Reboot in ten minutes after warning the users

    # shutdown -s 10 ''Bye!'' Send custom message to users before shutdown

    ```


    Besides the reboot and init 6 commands, you can use the old PC keystrokes Ctrl+Alt+Del
    to reboot your computer. If you''d like to disable that feature, on a public-access
    PC, simply comment out the following line from /etc/inittab:


    ```

    ca::ctrlaltdel:/bin/shutdown -t3 -r now

    ```


    # Straight to the Kernel


    In general, when the kernel starts up on your Linux system, you shouldn''t have
    to do too much with it. However, there are tools for checking the kernel that
    is in use and for seeing information how the kernel started up. Also, if something
    goes wrong or if there is some extra support you need to add to the kernel, there
    are tools to do those things.


    122'
