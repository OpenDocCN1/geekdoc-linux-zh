    # Connecting to a Windows Desktop with rdesktop


    If you prefer not to use the tclient wrapper described above, you can log to a
    remote Windows desktop using the rdesktop command. The rdesktop command requests
    a login to the Windows machine, then opens the Windows desktop for the user after
    you log in. Here are examples of the rdesktop command:


    ```

    $ rdesktop 17.2.16.16             Login to desktop at IP address

    $ rdesktop -u chris -p M6pyXX win   Identify user/password for host win1

    $ rdesktop -f win                   Run desktop in full-screen mode

    $ rdesktop -0 -r local:win           Direct from server to client

    $ rdesktop -E win                    Disable client/server encryption

    ```


    If you disable client/server encryption, the login packet is encrypted, but everything
    after that is not. Although this can improve performance, anyone sniffing your
    LAN would be able to see your clear-text communications (including any interactive
    logins after the initial login packet). Or rdesktop options can improve performance
    or your Windows desktop include: -m (don''t send mouse motion events), -D (hide
    window manager''s decorations), and -K (don''t override window manager key bindings).


    # Using Remote Linux Desktop and Applications


    The X Window System (X) should not be run on typical production servers for security
    and performance reasons. Thanks to the client-server nature of X, you can run
