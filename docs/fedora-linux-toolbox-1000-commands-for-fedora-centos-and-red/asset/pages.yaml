  pgno: 163
- img_proc: true
  md: '# Chapter 8: Backups and Removable Media


    If you are archiving and compressing large amounts of data, the time it takes
    to compress your backups can be significant. So you should be aware that, in general,
    bzip2 may take over 10 times longer than lzip and only give twice the compression.
    However, with each compression command, you can choose different compression levels,
    to balance the need for more compression with the time that takes.


    To use the tar command with bzip compression, use the -j option:


    ```

    $ tar cvjf myfiles.tar.bz2 *.txt Create archive, compress with bzip2

    ```


    You can also uncompress (-j) a bzip2 compressed file as you extract files (-x)
    using the tar command:


    ```

    $ tar xjvf myfiles.tar.bz2 Extract files, uncompress bzip2 compression

    ```


    The lzip compression utility is a bit less integrated into tar. Before you use
    lzip, you might need to install the lzip package. To do lzip compression, you
    need the --use-compress-program option:


    ```

    $ yum install lzip

    $ tar --use-compress-program=lzip -cf myfiles.tar.lzo *.txt

    $ tar --use-compress-program=lzip -xf myfiles.tar.lzo

    ```


    In the previous examples, compression reverses the syntax of tar with a switch
    before the command. For normal use and in other examples, we used the modern syntax
    of tar with no switch.


    > NOTE You may encounter compressed files in the RAR format. This format seems
    to be popular in the world of peer-to-peer networks. RAR is a proprietary format
    so there is no widespread compressing tool. The FreshRPMs.net repository has a
    rar RPM package for some versions of Fedora. The unrar command, on the other hand,
    is more widely available. The Livna.org repository has an unrar RPM package for
    Fedora.


    # Compressing with gzip


    As noted, you can use any of the compression commands alone (as opposed to the
    tar command line). Here are some examples of the gzip command to create and work
    with gzip-compressed files:


    ```

    $ gzip myfile gzips myfile and renames myfile.gz

    ```


    The following command provides the same result, with verbose output:


    ```

    $ gzip -v myfile gzip myfile with verbose output

    myfile: 86.0% -- replaced with myfile.gz

    $ gzip -tv myfile.gz Tests integrity of gzip file

    myfile.gz: OK

    ```'
