  md: '# Chapter 12: Accessing Network Resources


    Use the -p option to preserve permissions and timestamps on the copied files:


    ```

    $ scp -p myfile server1:/tmp/

    ```


    If the SSH service is configured to listen on a port other than the default port
    22, use

    -P to indicate that port on the scp command line:


    ```

    $ scp -P 12345 myfile server1:/tmp/      Connect to a particular port

    ```


    To do recursive copies, from a particular point in the remote file system, use
    the

    -r option:


    ```

    $ scp -r mydir francois@server1:/tmp/      Copies all mydir to remote /tmp

    ```


    Although scp is most useful when you know the exact locations of the file(s)

    need to copy, sometimes it''s more helpful to browse and transfer files interactively.


    # Copying Remote Files in sftp and lftp Sessions


    The sftp command allows you to use an FTP-like interface to find and copy files
    over SSH

    protocols. Here is an example of how to start an sftp session:


    ```

    $ sftp chris@server1

    chris@server1:password: ******

    sftp>

    ```


    Use sftp in the same manner as you use regular FTP clients. Type ? for a list
    of-

    mands. You can change directories (cd), change local directories (lcd), check

    current and remote directories (pwd and lpwd), and list remote and local con-

    ts (ls and ll). Depending on the permission of the user you logged in, you

    may be able to create and remove directories (mkdir and rmdir), and change per-

    missions (chmod) and ownership/group (chown and chgrp) of files and directories.


    You can also use lftp (discussed earlier in this chapter) as an sftp client. Using

    lftp adds some user-friendly features such as path completion under the Tab key:


    ```

    $ lftp sftp://chris@server1

    Password: ******

    lftp chris@server1:->

    ```


