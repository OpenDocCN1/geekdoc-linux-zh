    command.


    # Running Processes in the Background and Foreground


    When you run a process from a shell, it is run in the foreground by default. This
    means you can''t type another command until the first one is done. By adding an
    ampersand (&) to the end of a command line, you can run that command in the background.
    Using the fg, bg, and jobs commands, along with various control codes, you can
    move commands between background and foreground.


    In the following sequence of commands, we start the GIMP image program from a
    terminal. After that is a series of control keys and commands to stop and move
    it between foreground and background:


    ```

    $ gimp <Ctrl+z>                                     Run gimp in the foreground

    [1]+ Stopped gimp                             Stop process and place in background

    $ bg 1                                              Start process running again
    in background

    $ fg 1                                              Continue process in foreground

    gimp

    <Ctrl+c>                               Kill process

    ```


    Note that processes placed in the background are given a job ID number (in this
    case, 1). By placing a percentage sign in front of the number (for example, %1)
    you can identify a particular background process to the bg and fg commands or
    simply type the number


    158'
