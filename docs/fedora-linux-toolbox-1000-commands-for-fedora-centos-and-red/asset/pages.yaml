- img_proc: true
  md: '# Appendix C: Getting Information from /proc


    The /proc/stat file contains statistics related to CPU and process activities.
    The cpu line shows totals for all CPUs, while separate lines for each processor
    (cpu0, cpu1 and so on) show stats for each CPU on the computer. There are seven
    fields of CPU information: number of normal processes executed in user mode, kernel
    processes executed in user mode, idle processes, iowait processes (waiting for
    input/output), servicing interrupts (IRQ), and


    ```

    $ /proc/swaps

    List information about swap space

    Filename Type Size Used Priority

    /dev/sda2 partition 102888 201124 -1

    $ /proc/utime

    Seconds since system booted/total seconds

    2300251.0 2261855.3

    $ /proc/version

    List kernel version and related compiler

    Linux version 2.6.21-3.194.c7

    (kojibuilder@xenbuilder4.fedora.phx.redhat.com)

    (gcc version 4.1.2 20070502 (Red Hat 4.1.2-12))

    #1 SMP Wed May 23 22:35:01 EDT 2007

    ```


    # Changing /proc/sys information


    Values in the /proc/sys directory can be changed on the fly. For /proc/sys files
    accept any binary values (0 disabled or 1 enabled) people would simply echo a
    value to any files they wanted to change. For example, used forwarding of IPv4
    packets, such as to allow a system to do Network Address Translation (NAT) or
    IP Masquerading, you could type:


    ```

    # echo 1 > /proc/sys/net/ipv4/ip_forward

    ```


    Although you could still use this technique to make temporary changes to your
    system, the preferred method of changing /proc/sys information on the fly is using
    the sysctl command. To change these settings on a more permanent basis, you should
    add entries to the /etc/sysctl.conf file. Here are some examples of the sysctl
    command:


    ```

    # sysctl -A | less Display all kernel runtime parameters

    # sysctl -w net.ipv4.ip_forward=1 Turn on IPv4 packet forwarding

    ```


    See Chapter 10 as well as the sysctl and sysctl.conf man pages for further information.'
