- img_proc: true
  md: '# Chapter 7: Administering File Systems


    The basic business of using LVM to create the volume groups and logical volumes
    you need, assign the extents (small chunks of disk space) to those areas where
    they are needed. Unlike older disk partitioning, where you might need to back
    up your data, change your partitioning, return data to the resized partitions,
    you can simply add unused extents where they are needed.


    In Fedora, the Logical Volume Management GUI (system-config-lvm package) lets
    you view and work with your LVM volumes. There is also a set of commands that
    comes with LVM (lvm2 package) that can be used to work with LVM volumes. Step
    through the procedure in the following section to learn about many of those LVM
    commands.


    **WARNING!** To avoid messing the hard disks your computer relies on as learn
    LVM, we recommend you try the following examples on some non-critical storage
    device. For example, we used an inexpensive 32 MB USB flash drive (/dev/sdb) to
    run the commands shown in this section.


