  md: '# Chapter 2: Installing Fedora and Adding Software


    # Choosing How Install Proceeds from the Boot Screen


    To have the install proceed in different ways, you can add boot options. Here
    are examples of different types you can request from the boot prompt:


    ```

    boot: linux text

    boot: linux vnc

    boot: linux vncconnect=192.168.0.20 vncpassword=99pass

    boot: linux ksfloppy

    boot: linux ks-hd=/dev/hda/ks.cfg

    boot: linux ks-http://example.com/ks.cfg

    ```


    Use linux text to run the install in text mode (if your graphical screens are
    garbled). If you use linux vnc, you can step through the graphical section of
    the install remotely by connecting a VNC client to the IP of the install machine.
    The installer will show the IP address and display to connect to it after starts
    the VNC server. You can also start a VNC client on your network in listening mode
    and post the installer to using vconnect. In the second vnc example, vnc-listen
    is running on the machine at 192.168.0.20 with password=99pass.


    The three ks examples tell the installer where to find a kickstart file to guide
    the install process. The first looks for a ks.cfg file on the local floppy disk,
    the second looks for ks.cfg in the first IDE hard partition, and the last looks
    for ks.cfg in the root of the web server at example.com. A kickstart file contains
    information that lets the install bypass some or all questions asked during installation.
    A sample kickstart file can be found in /root/anaconda-ks.cfg after Fedora install
    is completed. Using that, you can repeat the install on that machine on another
    computer. For information on kickstart, refer to the following site:


    ```

    http://fedora.redhat.com/projects/config-tools/redhat-config-kickstart.html

    ```


    > NOTE To learn about kickstart, install the anaconda package, refer to the kickstart-docs.txt
    file in the /usr/share/doc/anaconda-.*


    You also have the choice of going into other modes than installation mode. For
    example:


    ```

    boot: linux rescue

    boot: linux local

    boot: linux memtest86

