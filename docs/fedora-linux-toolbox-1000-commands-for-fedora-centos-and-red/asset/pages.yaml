    # Logical Volume Manager


    Logical Volume (LVM) is a feature designed to help you cope with the chang-

    needs for disk space on your Linux systems. With your hard disks configured as

    VM volumes, you have tremendous flexibility in growing, shrinking, and moving
    the

    storage space on your systems as your needs change. LVM also allows for snapshots,

    feature typically found on expensive SANs.


    Fedora incorporates LVM2 into its releases and uses it to define how disk partitions

    allocated when you first install Fedora. Using LVM2, you define and manage volume

    groups (vg), logical volumes (lv), and physical volumes (pv). Each logical volume
    andnphysical volume is divided into logical extents and physical extents, respectively.


    124'
