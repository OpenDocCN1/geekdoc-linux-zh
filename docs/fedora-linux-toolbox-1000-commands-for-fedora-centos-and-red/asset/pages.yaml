    # Fedora Software


    Before Fedora 7, development of Fedora software consisted of the basic operating
    system (Fedora Core) and contributed outside packages (Fedora Extras). With the
    merge of Fedora Core and Fedora Extras software into one massive repository named
    Fedora, you can now go to one location to get all the software projects that have
    been packaged to run on Linux (see http://fedaproject.org/get-fedora.html).


    Sites that offer software packages built for Fedora that are the Fedora project
    jurisdiction include http://rpm.lnva.org, http://atrpms.net, http://freshprms.net,
    and http://dag.wieers.com/rpm. Information on how to use these and other Fedora
    repositories is contained in Chapter 2.


    # Focusing on Linux Commands


    These days, many important tasks in Linux can be done from both graphical interfaces
    and from commands. However, the command line has always been, and still remains,
    the interface of choice for Linux powers.


    Graphical user interfaces (GUIs) are meant to be intuitive. With some experience,
    you can probably figure out, for example, how to add a user, change the time and
    date, and configure a card from GUI. For these cases, we''ll mention which graphical
    tool you could use for the job. However, you will probably need to rely on the
    command line:


    +   - Almost any time goes wrong — Ask a question on an online forum to solve
    some Linux problem you are having and the help you get will always come in the
    form of commands to run. Also, command line tools typically offer much more feedback
    if there is a problem configuring a device or accessing files and directories.


    +   - Remote systems administration — If you are administering a remote server,
    you may not have graphical tools available. Although remote GUI access (using
    X applications or VNC) and web-based administration tools may be available, they
    usually run more slowly than what you can do from the command line.'
