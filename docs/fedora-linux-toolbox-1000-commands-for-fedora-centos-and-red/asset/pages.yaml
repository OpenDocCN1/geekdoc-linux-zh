  md: '# Chapter 2: Installing Fedora and Adding Software


    that what you want to do doesn''t require fresh metadata, you can have yum get-data
    only from the cache on your local machine. This will speed up performance quite
    a lot, with the small risk that the package information you are looking for may
    have changed since your last metadata update. Using the -c option, you can tell
    yum to use metadata:


    ```

    # yum -c info yum-utils

    Setting up repositories

    Reading metadata from local files

    ...

    ```


    Without the -c, yum will get fresh metadata from the repository if the local cache
    of that information is more than 30 minutes old (by default). The expiration time
    of the metadata is set in seconds by the metadata_expire option in the /etc/yum.conf
    file (metadata_expire=1800).


    By installing the yum-utils package (yum install yum-utils), you have access to
    a handful of useful commands that you can use for accessing and creating yum repositories.
    The repquery command can be used to list information about a package in a yum
    repository. For example:


    ```

    # repquery -il tomcat5

    # repquery --provides tomcat5

    ```


    The yumdownloader is useful for downloading packages from a yum repository to
    the local disk. For example, the following command downloads the cacti package
    to the local directory:


    ```

    # yumdownloader cacti

    ```


    # Managing Software with rpm


    Although yum has supplanted rpm as the tool of installing RPM packages from online
    repositories, rpm has some extraordinary options for querying RPMs and verifying
    installed RPMs. It is also a useful tool for installing, removing, and validating
    RPMs that are available on your computer.'
