  md: '# 11


    # Managing Network Connections


    Connecting to a network from Linux is often as easy as attaching your computer''s
    network interface card to your ISP''s hardware (such as a DSL or cable modem).
    However, if your network interface doesn''t come up or requires manual intervention,
    there are many commands available for configuring network interfaces, checking
    network connections, and setting special routing.


    This chapter covers many useful commands for configuring and working with your
    network interface cards (NICs), such as `ethtool`, `midi`, and `ifconfig`. In
    particular, it covers ways of configuring wired Ethernet, wireless Ethernet, and
    modem network hardware. With your hardware-connected and network interfaces in
    place, the chapter describes commands such as `netstat`, `dig`, `ip`, and `ping`
    for getting information about your network.


    # IN THIS CHAPTER


    +   * Using ethtool and miitool to work with network interface cards


    +   * Getting network statistics with netstat


    +   * Starting network devices with service, ifconfig, ifup, and ifdown


    +   * Viewing Ethernet information with ifconfig and ip


    +   * Managing wireless cards with iwconfig


    +   * Configuring modes with wdialconfig, stty, and minicom


    +   * Checking DNS name resolution with dig, host, and hostname


    +   * Checking connectivity with ping and arp


    +   * Tracing connections with traceroute, route, and ip


    +   * Watching the network with netstat, tcpdump, and nmap


    # Configuring Networks from the GUI


    When you install Fedora, RHEL, or CentOS, the anaconda installer lets you configure
    any wired Ethernet cards attached to your computer, with a DHCP server detected
    on your network. Alternatively, you can set a static IP address, along with your
    hostname and IP addresses for your gateway machine and name servers. After installation,
    there are also graphical tools for configuring your network interfaces.'
  merge: -1
  pgno: 217
- img_proc: true
  md: "# Chapter 11: Managing Network Connections\n\nThe Network Configuration window\
    \ (select System Administration from the GNOME desktop) offers a GUI for configuring\
    \ your network interface, network hardware, DNS servers, host list, and IPec virtual\
    \ private networks. You can configure both dynamic (DHCP, bootp) and static IP\
    \ addresses. You can even set up static network routes.\n\nIn some cases, your\
    \ network interfaces may not be working. There may be ways you want to work with\
    \ your network interfaces that are not supported from the GUI. For those cases,\
    \ the following sections describe how to work with your network interfaces from\
    \ the command line.\n\n# Managing Network Interface Cards\n\nIf the network hardware\
    \ on your computer didn't immediately come up and let you connect to the Internet,\
    \ there are some steps you should go through troubleshoot the problem:\n\n+  \
    \ - Check that your network interface card (NIC) is properly installed and that\
    \ the cable is connected to your network (ISP's CPE, switch, and so on).\n- After\
    \ the cable is connected, make sure you have a link with no speed or duplex mismatches.\n\
    - If all else fail, consider replacing your NIC with known-good spare to isolate\
    \ a hardware failure.\n\nTo check your link from Linux, and to set speed and duplex,\
    \ there are two commands you can use: the older mi-tool (net-tools package) and\
    \ the newer ethtool (ethtool rpm). Unless you have a very old NIC and NIC driver\
    \ that are not compatible with the ettool command.\n\nTo view the syntax of the\
    \ ethtool command, type the following:\n\n```\n# ethtool 2|i |      View options\
    \ to the ethtool command\n```\n\nThe ethtool command outputs its built-in to stderr.\
    \ To be able to page through that with less, redirect stderr to stdout.\n\nTo\
    \ display settings for a specific Ethernet card, add the interface name to the\
    \ command. For example, to view card information for eth0:\n\n```\n# ethtool eth0\
    \             See settings for NIC at eth0\nSettings for eth0: [ TP MII ]\n  Supported\
    \ ports: [ 10BaseT/Half 10BaseT/Full\n  Supported link modes: 100BaseT/Half 100BaseT/Full\n\
    \n  Supports auto-negotiation: Yes\n```"
