    # Expressions, Statements and Operators


    These are 2 words used to describe certain parts of any programming language and
    it is important to understand them.


    ## An Expression


    An expression is a collection of variable names, numbers and operators which can
    be used together in a calculation to produce a single result e.g.


    a + 2*b - 4*(c+d)


    An expression normally forms the *right hand side of an assignment statement.*


    ## A Statement


    Is any complete command in a program. In ''C'', a statement is terminated by a
    semi-colon:


    **e =** a + 2*b - 4*(c+d)**;**


    Here, the *expression* a + 2*b - 4*(c+d) forms *part* of the whole statement.
    The following is also a statement


    printf (“Crinkly Brindlewurdles...”);


    ## Operators


    | Symbol | Operation |


    | + | Addition |


    | - | Subtraction |


    | * | Multiplication |


    | / | Division |


    | % | Modulus (remainder) |


    Operators are the symbols used in the language to represent the common operations
    done on data. There are arithmetic and other types of operators (introduced later).
    In all, ''C'' has a rich set of operators, but the basic ones are shown in the
    table above. (Later we shall see **EQUALITY TESTING** uses **“= =”.**)


    ## Auto-Increment and Auto-Decrement


    “Increment” normally means “increase by 1”, “decrement” normally means “decrease
    by 1”. Some very useful operators in ''C'' are the “auto-increment” and “auto-decrement”
    ones.


    ++ increments by 1.


    -- decrements by 1.


    ### Auto-Increment


    e.g. The auto-increment operator can be seen to have the following effect:


    i = 0;


    i++;            /* i now equals 1\. */


    The auto-decrement operator has the reverse effect:-


    i = 4;


    i--;            /* i now equals 3\. */


    **++** and **--** can either come before or after the variable name they are being
    used on - the effect is slightly different. These operators can also be put almost
    anywhere in a C statement e.g.


    i = 0;


    j = i++;      /* Result: i = 1, j = 0 */


    /* BUT */


    i = 0;


    j = ++i;      /* Result: i = 1, j = 1 */


    The auto-increment and auto-decrement operators are commonly used within “for”
    loops (introduced later).


    ### Summary of Auto Increment / Decrement


    In other words, increment/decrement is performed *before* the operation on the
    variable if the operator is placed *before,* or it is performed *after* operation
    on the variable if the operator is placed *after.*


    ## Some Other Operators


    Similar to **++** and **--** are **+ =** and **- =** are


    +=            adds on the amount specified.


    -=             subtracts the amount specified.


    e.g.


    i = 5;


    i += 10;/* Result is now 15\. */


    i = 17;


    i -= 10;/* Result is now 7\. */


    Overall, we can say that:-


    i += x; /* equivalent to i = i + x; */


    i -= x; /* equivalent to i = i - x; */


    Note: Operators “/=“, “*=“ and “%=“ are also available.


    # Outputting To The Screen - “Printf”


    We are now going to look at the “printf” function in more detail.


    printf (“some text”, <some variables>);


    (1)       (2)                  (3)


    1.  function name


    2.  Control String


    3.  Variables whose values are to be printed


    The simple case of “printf” is like the first example program, which just contains
    text to be printed and no other variables.


    ## Printing Values stored in Variables – “Conversion” Characters


    The more complicated case is where you put one or more “conversion characters”
    in the “Control String”. Conversion characters follow the “%” symbol. One Conversion
    character is “%d” which means “substitute an integer variable value here”. Other
    Conversion characters are:-


    | Conversion Specifier | Purpose |


    | %ld | is used to print long data. |


    | %c | is used to print char data. |


    | %f | is used to print float or double number data. |


    | %s | is used to print string data (covered later). |


    NOTE: You must include a variable after the control string for every conversion
    character you specify, otherwise unpredictable results may occur.


    ### Example Program Using “printf”


    #include "stdio.h"


    int main( )


    {


    char any_letter;


    int any_number;


    long any_long_number;


    float any_decimal_number;


    any_letter = ''z'';


    any_number = 37;


    any_long_number = 1000000;


    any_decimal_number = 9.81;


    printf (“The letter is %c.**\n**”, any_letter);


    printf (“The number is %d.**\n**”, any_number);


    printf (“The long number is %ld.**\n**”,       any_long_number);


    printf (“The decimal number is %f.**\n**”, any_decimal_number);


    }


    ### Notes


    The program does the following:-


    1.  Initialises a char, int, long and float var.


    2.  Prints out the value of each of these, in a message, followed by a “carriage
    return” (new line).


    But what is the “**\n**” here?


    ## Special Characters with “printf”


    In the last program, we saw each “message” appear on a new line. This was achieved
    by placing another special printing character in the “control string” - which
    was “\n”. Hence “\n” in the control string prints a “new line”. All special printing
    characters are preceded with a “\” (backslash) some of them are listed below:-


    | \n | new line (Carriage return/line feed). |


    | \t | tab (normally max 8 spaces). |


    | \r | carriage return only. |


    | \b | backspace. |


    | \\ | backslash character. |


    It is possible to freely mix “conversion” and “special printing” characters e.g.
    This line can be added to the previous program:-


    printf (“The number is %d \t\t. The long number is %ld \n”,


    any_number, any_long_number);


    ## Codecracker Game – Printing the Board


    Now that we know how to print things out, we can write a very short program to
    print out a simple representation of our board (we will improve this later):


    #include "stdio.h"


    int main( )


    {


    /* Print out the board. */


    printf ("%s",+----+----+\n);


    printf ("%s",| | |\n);


    printf ("%s",| | |\n);


    printf ("%s",| | |\n);


    printf ("%s",| | |\n);


    printf ("%s",| | |\n);


    printf ("%s",| | |\n);


    printf ("%s",| | |\n);


    printf ("%s",| | |\n);


    printf ("%s",| | |\n);


    printf ("%s",| | |\n);


    printf ("%s",+----+----+\n);


    /* Print out a title. */


    printf (" * * * M A S T E R M I N D * * *");


    }


    We still have some other things to think about:


    1.  How will we display the guess and the marks “inside” the play/board area?


    2.  How will we display each guess in a position lower down the board?


    # Text Strings


    In the same way as we can define data items for numbers and characters, we can
    also define data items for text, and print them out. This is done in the following
    program.


    int main ( )


    {


    char android_name[ ] = “Kryten”;


    char android_type[ ] = “Mechanoid 2000”;


    printf (“Here comes the string... \n”);


    printf (“Android''s name is \t%s\n”, android_name);


    printf (“Android''s model number is \t %s\n”, android_type);


    }


    ### Program Notes


    The program does the following:-


    1.  Declares 2 string variables called “android_name” and “android_type”, and
    initialises them to the characters shown.


    2.  Prints out a message.


    3.  Prints out each string within a message, followed by a new line.


    ### Why do String Declarations use [ ]?


    This peculiarity of declaring text strings in ''C'' is due to the fact that a
    string is actually an *Array of Characters*. Strictly speaking, when we declare
    a string, we should do it thus:-


    char any_string[18] = “Zaphod Beeblebrox”;


    Here we are declaring an array of 18 characters, to store the letters of “Zaphod
    Beeblebrox” - which is actually only 17 letters long! The extra character is needed
    because ''C'' identifies the end of strings of text by a character of 0 value.
    The Compiler puts in a 0 character for us (invisibly), before the closing quotation
    mark of the string. So in ''C'',


    All Strings are NULL (0) Terminated.


    When declaring a string, using the “[ ]” is a short cut - because the ''C'' Compiler
    can work out the length of the string, it effectively puts this number between
    the “[ ]” for us.


    The “Zaphod Beeblebrox” string shown above could hence be shown as an *array of
    characters*:-'
