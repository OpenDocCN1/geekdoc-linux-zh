    编译器和文本编辑器可能是完全独立的，但我们将使用 `Codeblocks IDE`（集成开发环境），在其中它们可以被视为同一个东西。


    ### 目标系统


    在这里，我们的目标系统可以是树莓派（Raspberry Pi）或 Windows PC——但你可以在运行不同类型系统的 PC 或树莓派上编译代码。这通常通过所谓的`嵌入式系统`来实现。对于这类开发，你需要使用交叉编译器。


    ## 什么是编译？


    - 它是将一段文本转换为“目标代码”的过程，而目标代码反过来会被转换为“可运行的”或`executable`程序。

    - 编译器会根据相关语言的规则（在本例中为 ''C'' 语言）检查文本，以查看它是否形成了一组有效的指令。

    - 当编译器发现违反语言规则时，它会显示一条信息:-


    “错误 X 行 Y：... 说明 ...”


    或者，较严重的是:-


    “警告 X 行 Z：... 说明 ...”


    ## 编辑、编译、链接


    生成一个可运行的 ''C'' 程序实际上有 3 个不同的阶段，它们是:-


    | 编辑 | 使用文本编辑器将程序输入计算机。输入的文本被称为`source code`或简单的`the source`。 |

    | 编译 | 程序转换为“目标”代码，类似于机器码。 |

    | 链接 | 一个名为`linker`（链接器）的程序将你的程序的目标代码与“运行时库”目标代码相结合，使你的程序成为一个完全独立的“单元”，该单元可以独立于编辑器、链接器和编译器运行。
    |


    通常，这些阶段对用户是隐藏的——特别是如果你使用集成开发环境（IDE）时，正如第 4 章节中提到的那样。如今，“编译”和“链接”通常在一个步骤中完成，如第
    第 5 章节所示。


    #更多关于我们的项目


    ## 需求


    如上所述，我们将构建一个基于“数独大师”（Mastermind）概念的简单游戏。为了做到这一点，我们有一个需要解决的问题——我们将将其分解为以下部分（有些人会把左侧的列称为“用户需求”或“功能需求”）。


    | 需要完成...的代码/指令 | 所需数据 |

    | :--- | :--- |

    | 绘制面板 | 简单的面板布局 |

    | 读取代码猜想 | 猜测中的数字 |

    | 生成秘密代码 | 秘密代码中的数字 |

    | 检查代码和猜测 | 比较“猜测存储”和“秘密代码存储” |

    | 为每个猜测显示标记 | |

    | 在游戏时计算次数 | 单个数字/计数器（猜测计数器） |

    | 检查猜测次数是否过多 | 猜测计数器 |

    | 显示“游戏胜利”或失败 | |

    | 重启游戏 | |


    ## 流程图


    我们可以将此重新视为流程图中的一组步骤，然后对其进行结构化处理。


    ![Image](img/00004.jpeg)


    流程图元素，无结构化。


    我们现在考虑玩游戏所需的步骤并重构流程图，如下：


    ![Image](img/00005.jpeg)


    # 编译和运行 C 程序


    ## 命令行和 GUI


    在现代桌面操作系统中本质有 2 种用户交互模式：


    - 图形用户界面（*很早以前*这被称为 WIMP – 窗口、图标、鼠标、指针！）

    - 命令行或“终端”（后者是指早期计算机如何通过视觉显示单元 – VDU – 仅是键盘和屏幕）提供对计算机的实时访问。）


    有些人更倾向于某一种方法而不是另一种方法——尽管 GUI 方法有许多优点。如果你正在运行一个“精简版”的 Linux——例如运行在无法连接屏幕的低功耗设备上，命令行可能是唯一可行的方法。


    ### GUI


    在这里，你只是在使用另一个应用程序/包来编译和运行程序——其运行方式与你的文字处理器、电子表格等非常相似。你输入程序并直接运行它，然后回去输入/编辑。


    ### 命令行


    在这里你输入命令（在下一节中介绍）来编译和运行程序，然后通常输入另一个命令来运行编辑器（如“nano”）。这在第 5.5 节介绍。


    ## 在树莓派 / Linux 上安装 Codeblocks IDE


    Linux 操作系统下有很多实用且出色的编辑器和 IDE，树莓派上可能也有同样的数量。然而，我为本指南选择了优秀的“Codeblocks” IDE。


    在 Linux 上，你可以通过打开软件中心并搜索“Codeblocks”将其安装在你的系统上，尽管这可能不会给你最新版本。然而，完成以下步骤效果最好。


    ```

    sudo apt-get install

    ```


    ![Image](img/00006.jpeg)


    Raspbian Jessie – 从命令行安装 Codeblocks


    启动器或应用程序文件夹中应该添加一个这样的图标，看起来像这样：![Image](img/00007.jpeg)


    在树莓派上，一旦安装，Codeblocks 应该出现在 Applications/Programming（应用程序/编程）菜单中：


    ![Image](img/00008.jpeg)


    树莓派编程子菜单


    ![Image](img/00009.jpeg)


    Codeblocks 编译器检测 – 应设置为 `gcc`


    ![Image](img/00010.jpeg)


    Codeblocks – 成功加载并运行 – 准备好编写程序！


    ## 第一个程序 – Codeblocks


    有 2 种让你的第一个程序运行的方法，都在下面进行了概述。


    ### 快速/直接方法


    1. 选择“File/New”（文件/新建）和“Create Empty File”（创建空文件）：


    ![Image](img/00011.jpeg)


    2. 当你看到空文件出现时，按照所示*完全*输入以下文本。**不要漏掉任何字符，并注意引号、括号和分号！**


    ```c

    /* 第一个 ''C'' 程序！ */


    #include "stdio.h"


    int main( )

    {


    printf ("Greetings, pop pickers!");


    getchar( );

    }

    ```


    3. 然后点击“Play”（播放）按钮，它应该会给你显示所示的内容。


    ![Image](img/00012.jpeg)


    1. 点击“Yes”（是），然后你应该能看到下面的显示：


    ![Image](img/00013.jpeg)


    1. 输入 `hello.c`（.c 是重要的！），然后点击“Save”（保存）


    ![Image](img/00014.jpeg)


    1. 几秒后，你应该看到以下显示。


    ![Image](img/00015.jpeg)


    1. 你可以一些字符，然后按两次回车键，黑色小窗口就会消失。


    ### 向导方法


    1. 选择“File Menu”（文件菜单）中的“New”（新建）和“Project”（项目）来启动新项目。选择“Console Application”（控制台应用程序）并点击“Go”。


    ![Image](img/00016.jpeg)你会看到一些解释性文本，因此点击“Next”（下一步）。


    1. 它询问你想用什么语言创建你的应用程序——“C”应该已经被选中了——所以点击 Next。


    ![Image](img/00017.jpeg)


    1. 为你的项目输入一个名称，例如“Hello”或“HelloUniverse”（想得大大一点！）并点击 **Next**。


    ![Image](img/00018.jpeg)


    1. 随后你将看到一个设置列表。保持这些设置不变，直接点击 **Finish**（完成）。


    ![Image](img/00019.jpeg)


    1. 你应该看到下面的显示——因此点击左侧“Projects”（项目）面板中的 `main.c`。


    ![Image](img/00020.jpeg)


    1. Codeblocks 生成了一个简单的“Hello World”程序。可以随意将“World”改为“Universe”。工具栏和按钮的布局在你的版本上可能会有不同。你也可以可选地在
    `printf` 行之后添加 `getchar()` 行：


    ![Image](img/00021.jpeg)


    1. 现在点击工具栏上的绿色“播放”按钮：


    ![Image](img/00022.jpeg)你应该看到下面的显示：


    ![Image](img/00023.jpeg)


    1. 你可以输入字符，然后按两次回车键，黑色小窗口就会消失。现在你可以继续阅读第 5.5 节。


    ## 第一个程序 - 命令行方法


