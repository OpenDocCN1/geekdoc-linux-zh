    to be the number entered at the keyboard in the execution of **scanf**. It is,
    in fact, *changing* the value of one of the parameters passed to it. In some programming
    languages, the declaration of the parameter you want to be a “changeable” one
    is specified differently – or you may find that you are forced to do things a
    different way. In ''C'', you have to change the parameter declaration to use a
    pointer. Before we get too carried away, let''s do an example. Consider the following
    program:-


    void print_the_number (int any_number)


    {


    printf (“I was given the number %d to print!\n”,


                any_number);


    any_number = 12;


    printf (“I have now changed the number to %d, so there!\n”,any_number);


    }


    /* Program starts here. */


    int main( )


    {


    int a_number;


    a_number = 10;


    printf (“The value of the number is now %d\n”,       


                a_number);


    print_the_number(a_number);


    printf (“The value of the number is now %d\n”,


                a_number);


    }


    ### Program Notes


    1.      Set up an integer variable with a value of 10.


    2.      Print out the value of this variable whilst in “main”.


    3.      Call a function with the value as a parameter.


    4.      In the function, we print out the value again (it is still 10).


    5.      We then change its value to 12, and print it out once more.


    6.      Program execution then returns to **main**, and we print out our number
    once more.


    The important thing to notice is that when we return to **main**, and print out
    our number for the last time, **it''s value is still 10, even though it apparently
    got changed in the** print_the_number function*.* This is because *when we pass
    the number to the function,* we pass a copy of the value of the variable *to the
    function, so the function can do what it likes to the copy of the value, and our
    original value remains intact and unchanged.* Hence, when we return to the **main**
    program, and print out our variable, the original value is seen. In this example
    the variable has been **passed to the function by value**.


    It is quite common that functions need to be able to change variables used when
    they are not local - and also not global (as with “scanf”). The way this is done
    in ''C'' is not quite as straightforward as in other languages, which are designed
    to remove the need to consider pointers as overtly as in C.


    void print_the_number (int *any_number)


    {


    printf (“I was given the number %d to print!\n”,


           *any_number);


    *any_number = 12;


    printf (“I have now changed the number to %d, so there!\n”,


    *any_number);


    }


    int main( )


    {


    int a_number;


    a_number = 10;


    printf (“The value of the number is now %d\n”,


                a_number);


    print_the_number(&a_number);


    printf (“The value of the number is now %d\n”,


                a_number);


    }


    Without looking closely, there is not much difference to the previous example.
    However, there are some very important changes.


    1.      We have changed the way “print_the_number”''s parameter is declared. It
    has a “*” in front of it.


    2.      In the “print_the_number” function, we now refer to any_number as “*any_number”.


    3.      In the main program, we have called “print_the_number” with “&a_number”.


    Doing all this means that within the function “print_the_number”, we can change
    the value that is passed to the function. The value of the variable that is passed
    to the function is changed within the function, and the variable has the changed
    value *when it returns to the main program*. *Why?*


    The reason is that we have passed the variable by a pointer.


    ## Passing by Reference


    In the diagrams above in section [17.1](#part0007_split_003.html_id_Toc483576786),
    we can also consider that each “box” holds the value of a variable in our program.
    By giving a function a pointer to a variable (i.e. the box number, not the actual
    value in the box), we can change the *contents* of that variable. You can actually
    use pointers anywhere in a ''C'' program, not just in function parameters. Consider
    the following program.


    int main( )


    {


    int a_number;


    /* Declare a “pointer to an int”. */


    int *a_number_ptr;


    /* Consider “ptr” to be an abbreviation for “pointer”. */


    /* Set the pointer variable to point to the “a_number”


    variable. */


    a_number_ptr = &a_number;


    /* Initialise the variable. to 10\. */


    a_number = 10;


    printf (“The value of the number is %d\n”, a_number);


    *a_number_ptr = 12;


    printf (“The value of the number is %d\n”, a_number);


    printf (“The value of the number (referenced through


                the pointer) is %d\n”, *a_number_ptr);


    }


    Program Notes


    1.  We declare 2 variables; an “int” and a “pointer to an int”.


    2.  Using the “&” operator, we get the address of the variable called “a_number”
    and store it in the pointer variable “any_number_ptr”.


    3.  We assign “a_number” to be 10.


    4.  We print out the current value of “a_number” (10).


    5.  We change “whatever is pointed to by” (the “*” says this) a_number_ptr to
    12.


    6.  We print out the number again twice. First we use the normal method, second
    we use a pointer reference (“whatever is pointed to by” again).


    So, let''s now try to describe the use of “*” (star) and “&” (ampersand).


    **& “converts” the object to a pointer - it gives the** address **of the object.**


    *** when used in** data declaration **means “pointer to”.**


    *** when used in** assignment **means “object being pointed to by” - it “converts”
    the pointer to an object.**


    ## Pointers, Arrays and Strings


    The way that ''C'' handles arrays is closely linked to the use of pointers. It
    is common in some programs that pointer and array name references are interchanged.
    An array can actually be manipulated quite easily through use of a pointer.


    The next program manipulates an array using a pointer.-


    int main( )


    {


    char character_array[10];


    char *character_ptr;


    char i;


    character_ptr = &character_array[0];


    for (i=0; i < 10; i++)


    {


          *character_ptr = i;      


          character_ptr++;


    }


    }


    Program Notes


    1.      We declare a character array of 10 elements, a “character pointer” variable
    and a loop control variable “i”.


    2.      We initialise the character pointer to the address of the first element
    of “character_array”.


    3.      In the “for” loop, we set the “object pointed to by” character_ptr (an
    element of the array “character_array”) to be the current value of the loop variable.


    4.      We increment the character pointer variable so that it points to the next
    character in the array.


    5.      We loop.'
