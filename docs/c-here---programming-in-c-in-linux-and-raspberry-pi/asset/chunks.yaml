- fmt: "\nPerhaps the most important feature of any computer program is its ability\
    \ to make decisions - to do a conditional test. The way conditional tests are\
    \ made in 'C' is similar to other high level languages.\n\n## Conditional Statements\n\
    \nThere are a number of ways in 'C' to do conditional tests, but by far the most\
    \ common is “if..else”, which is shown below.\n\n```c\nif (condition)\none line\
    \ statement;\nelse\none line statement;\n```\n\nNOTE: Unlike some other programming\
    \ languages, “THEN” is assumed and this word is not included in the `if` statement.\n\
    \n`if .. else` can also take a slightly different form using a “multi-line statement”.\
    \ This is shown below.\n\n```c\nif (condition)\n{\nstatement 1;\nstatement 2;\n\
    .\n.\nstatement n;\n}\nelse\n{\nstatement 1;\nstatement 2;\n.\n.\nstatement n;\n\
    }\n```\n\nNOTE: Equality is tested for using `==` e.g.\n\n```c\nif (warp_factor\
    \ == 10)\n{\n    printf (“The Engines can nae take it cap'n!!\\n”);\n}\n```\n\n\
    As with other languages, “inequalities” can be tested for. The following symbols\
    \ can be used, where a `==` (“double equals”) might otherwise be used:-\n\n| Symbol\
    \ | Meaning |\n| :--- | :--- |\n| != | not equal to. |\n| > | greater than. |\n\
    | >= | greater than or equal to. |\n| < | less than. |\n| <= | less than or equal\
    \ to. |\n\ne.g.\n\n```c\nif (i != 0)\n{\n    printf (“The number is non-zero.\\\
    n”);\n}\n```\n\n### Another Example\n\nSuppose we wished to check for a resistance\
    \ value being greater than 1000 ohms, we could use the following conditional test.\n\
    \n```c\nif (resistance_value > 1000)\n{\n    printf (“Value is over 1 kilohm.\\\
    n”);\n}\n```\n\nTo test for a number of conditions at once, the “AND” and “OR”\
    \ keywords are required. In 'C', these are expressed thus:-\n\n- `&&` - Logical\
    \ AND.\n- `||` - Logical OR.\n\ne.g.\n\n```c\nif ((character >= '0') && (character\
    \ <= '9'))\n{\n    printf (“The character is a number. “);\n}\n```\n\n### Hints\
    \ on Conditional Testing\n\nA conditional test can be negated by placing a `!`\
    \ in front of it e.g. \n\n```c\nif (!((i >= 6) && (i <= 12)))\n{\n    printf (“Number\
    \ is outside range 6 - 12”);\n}\n```\n\nConditional tests can become quite complex.\
    \ To keep them clear, it may be useful to follow these guidelines:-\n\n- Each\
    \ conditional test should be enclosed in (round) brackets.\n- Try to stick to\
    \ using the multi-line form of the conditional statement.\n- Always align braces\
    \ `{ }` which form the start and end of a block.\n- If conditional tests become\
    \ complicated, split them over a number of lines and align them sensibly.\n\n\
    ## More Complex Conditional Tests - The “switch..case” Statement\n\nConsider the\
    \ idea of writing a 'C' program to play a card game. Suppose you want to print\
    \ out the card value in the form of its number, for cards 2 to 10, or A, J, Q,\
    \ K for the others. If we assume an `int` called `card_value` contains a number\
    \ in the range 1 to 13, we could do this in 'C' in the following way:-\n\n```c\n\
    if ((card_value >= 2) && (card_value <=10))\n    printf (“%d”, card_value);\n\
    else\n    if (card_value == 1)\n        printf (“A”);\nelse\n    if (card_value\
    \ == 11)\n        printf (“J”);\n    else\n        if (card_value == 12)\n   \
    \         printf (“Q”);\n    else\n            if (card_value == 13)\n       \
    \         printf (“K”);\n```\n\nAs we can see, this gives a somewhat large and\
    \ unwieldy set of `if` statements. If we wished to do something as well as `printf`\
    \ for each case, we would have to use the `{ }` with each `if`, making the whole\
    \ thing more troublesome. Another way of doing the example would be...\n\nThe\
    \ `switch..case` statement can be used to test a given variable for a number of\
    \ discrete values. Other languages tend to use the `Case` statement alone. The\
    \ previous example could be re-written thus:-\n\n```c\nswitch (card_value)\n{\n\
    \    /* Control Variable */\n    case 1:\n        printf (“A”);\n        break;\n\
    \    case 11:\n        printf (“J”);\n        break;\n    case 12:\n        printf\
    \ (“Q”);\n        break;\n    case 13:\n        printf (“K”);\n        break;\n\
    \    default:\n        printf (“%d”, card_value);\n        break;\n}\n```\n\n\
    ### Notes:\n\n1. The `switch` statement takes the specified action for the specified\
    \ value of the control variable.\n2. After each action, the word `break;` is inserted\
    \ to cause execution of instructions to carry on after the `}` of the `switch`\
    \ statement. If the `break` is not included, execution continues into the next\
    \ `case` action (which is occasionally useful).\n3. The `default:` case specifies\
    \ the action to be taken if the control variable's value is none of those listed\
    \ in the other cases (this is optional).\n4. Perhaps surprisingly, the statements\
    \ in each `case` need not be included in `{ }`. (Though any `if`, `do...while`,\
    \ `for` statements contained in a `case` would follow the normal rules.)\n\n###\
    \ Limitations of “switch..case”\n\n- The control variable should be of type `int`\
    \ or `char`.\n- The values being tested must be constants - i.e you cannot use\
    \ `switch` to test the value of one variable against another.\n\n## Codecracker\
    \ Game – Some Conditional Tests\n\nIn our code cracker game, we need to do some\
    \ tests.\n\n1. Check whether we have had too many guesses.\n2. Check whether the\
    \ user wants to play again or finish the game.\n3. Check whether the code the\
    \ user entered matches any of the digits in the secret code.\n\nThe “checking\
    \ against the secret code” step, we will leave till later, as there is a little\
    \ more we need to learn before we can easily do this. For checking whether the\
    \ user wants to continue the game we could do:\n\n```c\nchar response;\nresponse=getch();\n\
    if ((response==”y”) || (response==”Y”))\n{\n    /*start a new game!*/\n}\nelse\n\
    {\n    /* exit from the game – end program!! */\n}\n```\n\nBut for checking the\
    \ number of guesses, we can do:\n\n```c\nint guess_counter = 0;\n/* Still things\
    \ to do/think about here! */\nguess_counter++;\n/* We will allow 10 guesses\n\
    if (guess_counter > 10)\n{\n    printf (“You have lost!”);\n}\nelse\n{\n    /*\
    \ Still things to do/think about here! */\n}\n```\n\nWe will see that our final\
    \ code will be slightly different to this, but “we’re getting there”!\n\n# Looping\
    \ The Loop - Iteration\n\nOne of the things it is often necessary to do in a program\
    \ is repeat something a number of times. We need to *iterate.* There are 2 main\
    \ forms of iteration:-\n\n1. Iterating a set number of times.\n2. Iterating until\
    \ a condition changes.\n\nWe can illustrate these forms as shown:-\n\n### 1. Iterating\
    \ a set number of times.\n\nInitialise a count to minimum value.\n\nStart\n\n\
    Execute some instructions.\n\nIncrease the count.\n\nTest if the count is greater\
    \ than the maximum value.\n\nIf No- Go To Start\n\nIf Yes- Go To End\n\nEnd\n\n\
    NOTE: The count could also be initialised to a maximum value and decreased to\
    \ a minimum value.\n\n### 2. Iteration until condition changes.\n\nStart\n\nExecute\
    \ some Instructions (which affect the *Condition*).\n\nTest Condition.\n\nIs *Condition*\
    \ True?\n\nNo-Go To Start\n\nYes-Go To End\n\nEnd\n\nNOTE: If the iteration is\
    \ to be “finite” (i.e finish at some point), the instructions which are executed\
    \ must affect the condition in some way.\n\n### Other Languages\n\nOther programming\
    \ languages have constructs for types (1) & (2) of iteration. Form (1) is expressed\
    \ in BASIC as `FOR...NEXT`. In both BASIC and some other languages, (2) is in\
    \ the form of the `REPEAT ... UNTIL` statement. We will now look at the ‘C’ equivalents.\n\
    \n## Iteration Form (1) - The “for” Loop\n\nIt has this general form:-\n\ninitialisation\
    \ continuation iteration\n\nexpr. condition expr.\n\n```c\nfor ( i=0; i < 10;\
    \ i++ )\n    printf (“Spectrum is green!\\n”);\n```\n\nThe action of the example\
    \ is as follows:-\n\n1. The “loop control variable”, `i`, (which must be declared\
    \ as any other data item) is set to zero.\n2. The condition `i < 10` is tested,\
    \ and evaluates to TRUE.\n3. The `printf` is done.\n4. `i` is incremented by 1.\n\
    5. Steps 2-4 are repeated until `i` reaches 10.\n\nNOTE: The loop only continues\
    \ to execute while the Continuation Condition evaluates to TRUE.\n\n### More Advanced\
    \ “for” Loops\n\nAll parts of the `for` statement can have more than one part\
    \ e.g. Assume `i`, `j`, `k` have been declared as `int`:\n"
