    \ |\n| `%c` | 字符 | `\\r` 回车 |\n| `%s` | 字符串 | `\\b` 退格 |\n| `%ld` | 长整型 | `\\\
    t` 制表符 |\n| `%f` | 浮点数/双精度 | |\n\n`printf(\"%4d\", centigrade_value);` 指定字段宽度（打印空间）为\
    \ 4。字段宽度数字前的 `-` 表示“左对齐”。`\"04\"` 表示打印前导零。转换字符的数量必须与后续数据项匹配。\n\n#### 输入 - scanf\n\
    ```c\nscanf(\"%d\", &centigrade_value);\n```\n将一个整数读入 `centigrade_value`。转换字符与\
    \ `printf` 相同。\n\n#### 运算符与不等式\n```\ntax = 10;      /* 赋值 */\ntax++;         \
