    如果你没有 Linux 且不想在计算机上安装它，只要你有足够的磁盘空间，仍然可以很方便地使用 Linux 和 C 语言。只需搜索“Installing Virtual
    Box”和“Ubuntu Linux and Virtual Box”。如果你能在你的 Windows 或 Mac 电脑上成功安装了这些程序，就可以参考第
    5 章以及本指南其他部分的说明来开始。你需要大约 20GB 的空间来安装所有内容。要成功使用 VirtualBox，你可能需要在 BIOS 中更改“Virtualisation”（虚拟化）设置。详情请在网上。


    ## 注意！


    Linux 几乎每天都会更新——导致应用程序中的功能会被移动、删除和/或更改。图形界面会被重新设计，应用程序会被取代或过时。


    **这意味着，当你阅读第 5 章中的说明时，它们可能并不是最新的，或者它们产生的结果可能略有不同。因此，你可能需要进行一些实验，并在网上搜索关于新功能、增强或更改的更新说明或笔记。**


    你已经收到警告了！


    ## 示例的原理


    某些示例程序看起来毫无意义或不切实际——在这种情况下，它们编写是为了说明语言的特性，而不是作为实用的程序。


    你当然可以下载所有示例程序并编译、运行它们，但你可能会发现，如果你亲自输入它们，学得会更好（这在本指南最初创建的 20 世纪 90 年代非常常见）。如果你自己输入并编译程序，你将了解更多错误信息的含义，并且当你开始编写代码时，你会更擅长发现代码中的错误！


    ## 课程主题


    当我最初开始编程时（在 1981 年的 Sinclair ZX81 电脑上），我的动力是写一个简单的游戏。一年后，当我得到传奇的 Spectrum（16K
    型）时，发生了类似的事情。因此，在本指南中，我们将采取类似的“计划”。我们将建立知识来编写一个简单的“破解密码”游戏——许多人称之为“猜数字”（Mastermind）。


    ### 破解密码游戏 – “猜数字”


    ![Image](img/00002.jpeg)


    这是我小时候很喜欢玩的游戏——我甚至还有一个口袋电子版。一组数字（范围在 0-9 之间）被设置为“秘密密码”（它通常由人类——密码设置者设置，但我们将让计算机来完成）。然后，“破解者”尝试尽可能地猜密码。他或她通过将猜测放在棋板上来进行猜测——通常用户在游戏结束前有
    10 次猜密码的机会。然后，“密码设置者”将根据某些规则对猜测进行“标记”：


    *   如果猜测的某个数字也在密码中，但位于不同的（DIFFERENT）位置，则获得一个白色（WHITE）棋子。

    *   如果猜测的某个数字也在密码中，但位于相同的（SAME）位置，则获得一个黑色（BLACK）棋子。

    *   每个正确的数字最多只奖励一个白色或黑色棋子。


    ### 示例


    *   如果秘密密码是“1234”，猜的值是“4255”，将获得一个黑色棋子（对应“2”）和一个白色棋子（对应“4”）。

    *   在下方所示的示例（摘自我们将开发的程序运行版本），代码中可能有 3 或 4，且秘密密码*不*以 4 结尾，它可能包含 3，但如果包含 3，它不在前
    3 个位置。


    ### 原理


    通过开发一个易于理解且实际上非常有趣的游戏，我们能够引入基础编程概念，如输入和输出、数据存储（数组中）、计数、条件测试和循环（也称为迭代）。


    完整的列表见附录 1。


    ![Image](img/00003.jpeg)


    这就是我们完成后、运行的游戏的样子。


    ## 简单编程练习题


    附录 2 列出了一些你可以编写的非常简单的程序构想——基于指南中给出的示例。没有提供解决方案。


    ## 其他语言


    如果你能掌握本指南中的内容并理解你所做的一切，你将为理解过程化编程（procedural computer programming）中最常用方法的概念打下坚实的基础。逻辑上的下一步是去理解面向对象的计算机编程，这种编程固有地应用于更现代的编程语言，如
    `C++`、`Java`、`Python` 甚至 `BASIC` 的变体中。


    # 编程过程 – 快速总结


    有些人会称之为“算法开发”、“算法设计”甚至“系统思维”。为了本指南的目的，我将称之为“编程过程”。有很多书籍对这些概念进行了极其详细的介绍。在这里，我们介绍本质的基础知识。


    ### 编程过程涉及


    *   考虑问题。

    *   将问题分解成小块。

    *   考虑如何以计算机程序的形式表达问题中每个部分的解决方案。


    ### 程序


    可以分为 2 主要部分：


    *   指令 - 代码

    *   信息 - 数据


    在解决问题时，我们必须考虑需要哪些信息和指令。


    ## 程序中的指令/代码


    可以分为 3 种主要类型：


    1.  信息（数据）处理。

    2.  条件测试。

    3.  跳转/分支。


    你将在本指南中看到每种类型指令的不同示例，尽管跳转/分支通常是通过以某种方式组织程序来隐式完成的。


    ## 程序中的信息/数据


    可以以许多不同的形式存在。例如：


    *   简单的整数值

    *   浮点值（带有小数点的）

    *   文本 / 字符串 / 字符

    *   图形

    *   声音


    ''C'' 只是另一种编程语言，它有自己表达代码和数据的特殊方式。


    ## 编译语言


    *   一旦写好程序，在运行之前必须经过*编译（“转换”）*处理。如果看到错误，程序必须终止、修正、重新编译并从头运行。

    *   转换过程只进行一次，除非对程序进行了修改。


    ## 解释型语言


    *   一旦写好程序，就可以立即运行。如果发生错误，程序可能会完全停止，或者在遵循某种“警告”消息后临时停止。程序可以被中断、修正，然后程序可以从停止的地方继续运行。

    *   “转换”过程每次程序运行时都会发生——这会减慢速度，尽管在 21 世纪初，计算机处理器（CPU）的速度通常比 20 世纪末快几千倍。


    ## 混合语言


    一些更现代的语言使用编译和解释的方法，在某些情况下可以提供特定的优势。


    ## 我们如何将 ''C'' 程序输入计算机？


    为了编写 ''C'' 程序，我们需要能够在计算机中输入和存储文本。为了做到，我们使用*文本编辑器*。


    ### 文本编辑器


    是一种我们在计算机上运行的程序，允许我们输入、修改和保存某些文本到磁盘。这些文本可以是任何东西——一个字母、一本书、一堆垃圾或一个 ''C'' 程序。


    ### 编译器


    是一种我们在计算机上运行的程序，它将某些文本转换为“目标代码”。这种代码将在你编写代码的系统（称为“目标系统”）上运行。还有另一个称为“链接器”的程序，它将其他“标准”代码添加到目标代码中以创建“可执行程序”。


