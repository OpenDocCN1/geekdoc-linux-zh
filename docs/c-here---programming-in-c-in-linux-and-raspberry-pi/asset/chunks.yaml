    (string copy) library function, this is actually what we were doing there.


    2.      We increment the character pointer in the assignment (this sort of thing
    is quite common in many programs).


    ## More Advanced Pointer Usage


    The next program implements its own version of the “strcpy” library function.
    It is a good example of how pointers are often used in ''C''.


    void string_copy (char *destination_ptr, char *source_ptr)


    {


    /* Just copy from source to destination until a NULL


    is reached - at which time the condition will fail! */


    do


    {


    *destination_ptr++ = *source_ptr;


    }


    while (*source_ptr++);


    }


    int main( )


    {


    char source_string[ ] = “Reg Holsworth for PM!”


    char destination_string[50];


    string_copy (destination_string, source_string);


    printf (“My vote is ... %s\n”, destination_string);


    }


    Program Notes


    1.      We define a function “string_copy” which has two “character pointer” parameters
    (“char *”).


    2.      We start a “do” loop.


    3.      We assign the character pointed to by the destination pointer to be the
    character pointed to by the source pointer, and (implicitly with the ++) increment
    the destination pointer.


    4.      We test to see if what the source pointer is pointing to is a NULL (zero)
    character, and implicitly increment the source pointer. If we find a NULL character,
    it will be copied, but the loop will terminate.


    5.      It is not generally recommended that library functions be re-written!
    This example is purely a demonstration of the way pointers can be used.


    6.      This example illustrates the way in which quite a complex set of operations
    can be coded in a few short ''C'' statements.


    7.      The library “strcpy” function is actually of type pointer to “char”. It
    returns a pointer to the destination string (in other words, the value of the
    first parameter).


    NOTE: Great care should be taken when using pointers in ''C'' programs. It is
    yet another area where ''C'' assumes you know what you are doing. Incorrect pointer
    usage could result in loss of data or file corruption of any files your program
    is using.


    # File Handling


    One of the important features of programming languages is their ability to transfer
    data between the main memory of the host system and its disk storage e.g. say
    you had written a ''C'' program to store results from an experiment, you would
    want the program to first allow the user to enter the values, then save them to
    a file on the disk. At a later stage, you then wish to retrieve this data into
    your program to use it for another purpose. Alternatively, you may wish to load
    the data into another package altogether - such as a Word Processor or Spreadsheet.


    ## File Input and Output - File I/O


    The general term applied to manipulating files from programs is “File I/O”. In
    ''C'' file I/O is done through the use of library functions, several of which
    are shown here:-


    | fopen       (<filename>, <mode>) | Prepare file for use - returns value used
    for <stream> |


    | feof (<stream>) | Check for end of file. |


    | fprintf      (<stream>, control string, variables) | Output stuff to file. |


    | fputc (<stream>, char); | Output a single character to the file. |


    | fgetc (<stream>); | Returns single character read from the file. |


    | fscanf (<stream>, control string, variables) | Input (Read) stuff from file
    - like “scanf”. |


    | fclose (<stream>) | End use of file |


    There are a number of ways to do file I/O, not all of which will be shown here.


    ### “fopen”


    This is the function which, given 2 strings as parameters, will ask the system
    to prepare the file for use by your program and set things ready. The 2nd parameter
    to this function is a string indicating which “mode” you wish to access the file
    in:-


    ### “fopen” modes


    | Mode String | Action/Description |


    | r | Open for reading only |


    | w | Create for writing. If a file by that name already exists, it will be overwritten.
    |


    | a | Append; open for writing at end of file, or create for writing if the file
    does not exist. |


    | r+ | Open an existing file for update (reading and writing) |


    | w+ | Create a new file for update (reading and writing). If a file by that name
    already exists, it will be overwritten. |


    | a+ | Open for append; open for update at the end of the file, or create if the
    file does not exist. |


    For example,


    fopen (“otis.txt”, “wt+”);


    will attempt to open the file “otis.txt” in the current directory. If the file
    does not exist, it will be created. The program will attempt to open the file
    for writing, and in “text mode” (see later).


    **“fopen” returns a value which is called a** stream**. This is a special value
    which we use to access the file when we want to do fprintf, fscanf etc. It is
    like a “code number” for accessing the file (but it''s actually a pointer to a
    block of memory about the file which the system allocates when it opens the file).**


    ### Relationship of File I/O to “Normal” (Console) I/O


    Up to now, we have looked at how information is output to the screen (using “printf”)
    and how we can read information from the keyboard (using “scanf”). One of the
    things about ''C'' is that it attempts to treat all I/O in the same manner - in
    other words, outputting data to a file is very similar to outputting data to the
    screen. However, this is only true for ASCII files... read on.


    ## ASCII File Output


    This means file output which is “human readable” - i.e. the outputting of letters
    and numbers (and some special characters like Tabs, New Lines and Carriage Returns).
    This is done using “fprintf”. It works in an exactly similar way to “printf” except
    that the printing is done *to the file* rather than to the screen.


    #include <stdio.h>


    int main(void)


    {


    FILE *stream;


    int i = 100;


    char c = ''C'';


    float f = 1.234;


    /* open a file for update */


    stream = fopen(“otis.txt”, “w+”);


    /* write some data to the file */


    fprintf(stream, “%d %c %f”, i, c, f);


    /* close the file */


    fclose(stream);


    }


    The action of the program is as follows:-


    1.      Declare a variable called “stream” to hold the “code number” (actually
    a pointer) used in accessing the file.


    2.      Declare an “int”, “char” and “float” variable, and initialise them.


    3.      Open the file for writing and store the returned “code number” (pointer).


    4.      “Print” the values of the variables to the file whose “code number” is
    in the variable “stream”.


    5.      “Close” the file.


    Once this program has been run, you could, from the Command Line, do


    pi@raspberrypi:~> cat otis.txt


    and this would display the contents of the file which has been generated by the
    program:-


    100 C 1.234


    If you changed the “fprintf” statement to


    fprintf(stream, “%d\n%c\n%f\n”, i, c, f);


    re-compiled and re-ran the program, you would see the following in the file “**otis.txt**”


    100


    C


    1.234


    ## ASCII FIle Input


    It is possible to read data from a file as if it had been entered at the keyboard
    - this is achieved through the use of the function “fscanf” - this is a very similar
    function to “scanf” - it simply expects to get data from a file rather than the
    keyboard. Consider the following example:-


    #include <stdio.h>


    int main(void)


    {


    FILE *stream;


    int i = 100;


    char c = ''C'';


    float f = 1.234;


    /* open a file for reading */


    stream = fopen(“otis.txt”, “r”);'
