  trans: "\n\n```c\nfor (i=0, j=0; (j<=9) || (k != 1); i+=2, j++)\n{\n    <statements>\n\
    }\n```\n在上面的示例中，`i` 和 `j` 都被初始化为零，评估继续条件（结果为 TRUE），执行 `<statements>`，`i` 增加 2，`j`\
    \ 增加 1。当 `j` 达到 10，或者当第三个变量“k”被设置为 1（这通常发生在“<statements>”内部的某处）时，循环终止。\n\n###\
    \ 注意事项：\n\n1. 对于 “for” 语句，循环内部的代码可能永远不会执行（如果继续条件始终评估为 FALSE）。\n2. “for” 语句中 `(\
    \ )` 内部的所有部分都是 `optional`（可选的），换句话说，这\n\n```c\nfor ( ; ; ; )\n{\n}\n```\n\n是一段合法的代码\
    \ - 它表示一个无限循环（有时在“控制”类型程序中非常有用）。\n\n## 迭代形式 (2) Do...While\n\n这种形式与 BASIC 及类似语言中使用的\
    \ `REPEAT...UNTIL` 语句非常相似。例如：\n\n```c\ni=0;\ndo\n{\n    printf (“Spectrum is green!\\\
    n”);\n    i++;\n}\nwhile (i<10);\n```\n程序的执行动作如下：\n\n1. 将“循环控制变量” `i`（必须像其他数据项一样被声明）设置为零。\n\
    2. 执行 `printf`。\n3. `i` 增加 1。\n4. 测试条件 `i < 10`，评估结果为 TRUE。\n5. 重复步骤 2-4，直到 `i`\
    \ 达到 10。\n\n与 “for” 循环相比，操作上的唯一区别是条件是在动作**之后**测试的（而不是**之前**）。\n\n更多注意事项：\n\n1.\
    \ “do” 循环内部的代码至少执行一次。\n2. 与 `REPEAT..UNTIL` 的主要区别在于，测试的是“继续”条件（而不是“终止”条件）。\n\n\
    ### 迭代形式 (2) - “Reprise” - “While..”\n\n是另一种使用 “while”的形式，用于希望在执行动作**之前**测试条件的情况：\n\
    \n```c\ni = 0;\nwhile (i < 10)\n{\n    printf (“Spectrum is green\\n”);\n    i++;\n\
    }\n```\n1. 将“循环控制变量” `i`（必须像其他数据项一样被声明）设置为零。\n2. 测试条件 `i < 10`，评估结果为 TRUE。\n3.\
    \ 执行 `printf`。\n4. `i` 增加 1。\n5. 重复步骤 2-4，直到 `i` 达到 10。\n\n注意：这里的动作与 “for” 循环相同，但我们在循环外初始化了\
    \ `i`。这种形式可以用于任何觉得 “for” 循环显得大材小用的地方。\n\n### 迭代总结\n\n正如我们所见，`C` 中有三种“循环”或“迭代”结构。示例所示：\n\
    \n```c\nfor (i = 0; i < 10; i++)\n{\n    <statements>\n}\n```\n------------------------------------------------\n\
    \n```c\ndo\n{\n    <statements>\n}\nwhile (<condition TRUE>);\n```\n------------------------------------------------\n\
    \n```c\nwhile (<condition TRUE>)\n{\n    <statements>\n}\n```\n注意：注意 “while” 语句中分号的不同用法。\n\
    \n它们各都非常灵活，使用哪一个可能取决于个人选择，尽管你应该考虑你的迭代是否必须至少执行一次。（如果是这种情况，请选择 “do..while”）。\n\n\
    ## 猜数字游戏 – 使用循环\n\n我们现在可以修改之前的代码，为每次猜测包含一个循环，并为整个游戏包含一个循环。它看起来像这样：\n\n```c\n/*\
    \ 启动一个玩游戏的循环。 */\ndo\n{\n    /* 稍后此处将添加内容。\n    /* 现在进行 10 次猜测循环。 */\n    for\
    \ (guess_no=1; guess_no <= MAX_GUESSES; guess_no++)\n    {\n        /* 待办 */\n\
    \        /* 读取猜测 - 传递当前的猜测数字。 */\n        /* 待办 */\n        /* 标记猜测。 */\n    \
    \    /* 如果猜对了，跳出 \"for\" 循环。 */\n        if (guess_correct == 1)\n        {\n\
    \            break;\n        }\n    }\n    /* 当我们到达这里时，我们要不是已经完了次数，\n    \"guess_correct\"\
    \ 就被设置为 1 - 猜测已经被\n    标记并被发现是正确的。 */\n    /* 检查我们是否猜中了！ */\n    if (guess_correct\
    \ == 1)\n    {\n        printf (\"*** 你赢了! ***\");\n    }\n    else\n    {\n \
    \       printf (\"*** 你输了! ***\");\n    }\n    /* 在此处添加内容！*/\n    /* 现在询问用户不想玩另一个游戏。\
    \ */\n    printf (\"Another Game (enter Y or N)?\");\n    response_entered = getch();\n\
    \    /* 使用 \"toupper\" 将其转换为大写。 */\n    if (toupper(response_entered) == 'Y')\n\
    \    {\n        continue_game = 1;\n    }\n    else\n    {\n        continue_game\
    \ = 0;\n    }\n}\nwhile (continue_game == 1);\n```\n注意对 `toupper` 的使用，它在我们检查之前将字符转换为大写。\n\
    \n## “break” AND “continue”\n\n### “break”\n\n用于在某些条件发生时跳出循环。考虑以下示例：\n\n```c\n\
    for (i = 0; i < 20; i++)\n{\n    if (array[i] == 0)\n        break;\n    array[i]\
    \ = 1/array[i];\n}\n```\n如果发现值为零的数组元素，for 循环将终止（执行 `break`），程序执行从 “for” 循环的末尾继续。\n\
    \n### “continue”\n\n导致控制传递到最内层对应的 while、do 或 for 语句的末尾，在此时重新评估循环继续条件。\n\n示例：\n\
    \n```c\nfor (i = 0; i < 20; i++)\n{\n    if (array[i] == 0)\n        continue;\n\
    \    array[i] = 1/array[i];\n}\n```\n如果数组元素的值为 0，则**不会**执行除以 0 的操作。\n\n# 函数\n\n\
    到为止，我们看到的所有示例都较小且更加自成。计算机程序的特点之一是，它们通常会增长——增长、再增长。如果我们一直尝试像现在这样做，我们将会陷入糟糕的混乱。最初，在考虑编写程序的问题时，我们说必须将其拆分为子程序。\n\
    \n### 子程序\n\n几乎所有的编程语言都有定义子程序或*过程*或*函数*的方法——这些类似于小型的自包含程序，我们从 “main” 中*调用*它们。子程序通常每个只负责一项工作——例如，设置屏幕或显示菜单。对于超过\
    \ 100 行的程序，尝试考虑如何将程序拆分为子程序是非常重要的。这被称为“结构化编程”。\n\n在 'C' 中，子程序被称为“函数”。下面给出了在 'C'\
    \ 中指定它们的示例。\n\n```c\n/* 定义一个打印星号行的函数。 */\nvoid stars()\n{\n    char some_stars[]\
    \ = “**********”;\n    printf (“%s\\n”, some_stars);\n}\n\n/* 定义一个打印不同行星行的函数。\
    \ */\nvoid edge_stars()\n{\n    printf (“* *\\n”);\n}\n\nint main ()\n{\n    //\
    \ 清除控制台“屏幕”区域的特殊命令\n    printf(“033[2J”);\n\n    /* 调用 “stars” 函数。 */\n    stars();\n\
    \n    /* 调用 3 次 “edge_stars” 函数。 */\n    edge_stars();\n    edge_stars();\n  \
    \  edge_stars();\n\n    /* 第 2 次调用 “stars” 函数。 */\n    stars();\n}\n```\n\n###\
    \ 程序说明\n\n1. 我们定义了两个函数，称为 `stars` 和 `edge stars`。\n2. 这些函数只是打印一些星号。\n3. 我们从 “main”\
    \ 程序中反复调用这两个函数，以产生以下输出：\n\n| ********** | <-- stars |\n| * * | <-- edge_stars\
    \ |\n| * * | <-- edge_stars |\n| * * | <-- edge_stars |\n| ********** | <-- stars\
    \ |\n\n1. 函数 “stars”声明了自己的数据——**这些数据无法从 “main” 访问**。也就是说，如果在 “main” 内部任何地方添加行\n\
    \nprintf (“%s”, some_stars);\n\n这都无法运行——*程序甚至无法编译。为什么？*\n\n## 子程序与“局部数据”\n\n正如我们已经提到的，子程序本身就是独立的程序。因此，在函数中声明的任何数据（变量）不能被其他函数使用，除非我们采取明确行动使其可行。\n\
    \n"
- fmt: "\nConsider a room in your house, where you have some books on a shelf. If\
    \ you go into another room, (and, say, close the door) you can not see those books.\
    \ However, if you put your bookshelf, outside in the garden, you will probably\
    \ be able to see it from both rooms, through the window.\n\nWe can do a similar\
    \ thing with data in a 'C' program - we can declare it in a place where it can\
    \ be seen by all functions. We do this by placing the data declaration outside\
    \ all functions.\n\n```c\nchar some_text[ ]=\"This can be accessed by all functions.”;\n\
    \nvoid print_the_text( )\n{\n    printf (“Printing from the function...”);\n \
    \   printf (some_text);\n}\n\nint main ( )\n{\n    printf (“Printing from 'Main'“);\n\
    \    printf (some_text);\n    print_the_text( );\n}\n```\n\nData declared in this\
    \ way i.e. outside all functions, which can be accessed by all functions, is called\
    \ Global Data.\n\n## Functions With Parameters\n\n### Passing Data to Functions\n\
    \nIt is often common to pass data to procedures e.g. pass the value in degrees\
    \ centigrade to a function and it prints out degrees Fahrenheit. The following\
    \ example defines a new 'C' Function called `c_to_f` which takes a value in degrees\
    \ centigrade and prints out a value in Fahrenheit.\n\ntype parameter (also called\
    \ `argument`)\n\n/*\ntype parameter type, parameter (`argument`)\n*/\n\n```c\n\
    void c_to_f (int degrees_c)\n{\n    printf (“%d Degrees C = %d degrees F”,\n \
    \   degrees_c, ((degrees_c * 9) / 5) + 32);\n}\n\nint main ( )\n{      \n    c_to_f\
    \ (20);\n    c_to_f (25);\n}\n```\n\n### Program Notes\n\n1. We define a 'C' function\
    \ of `type void` (see later).\n2. We specify it will take single integer value\
    \ as an argument or parameter.\n3. We write the function so it just prints out\
    \ the converted value.\n4. We call the function twice from the main program, with\
    \ slightly different values.\n\n## Returning a Value from a Function\n\nIt is\
    \ often very useful to pass some values to a function which then “processes” those\
    \ values in some way and then *returns* a value to the main program. We can re-write\
    \ the last program slightly to do this:-\n\nreturn value type, parameter type,\
    \ parameter (`argument`)\n\n```c\nint c_to_f (int degrees_c)\n{\n    int degrees_f;\n\
    \    degrees_f = ((degrees_c * 9) / 5) + 32;\n    return (degrees_f);\n}\n\nint\
    \ main( )\n{\n    printf (“%d degrees C = %d degrees f \\n”,\n    20, c_to_f(20));\n\
    \    printf (“%d degrees C = %d degrees f \\n”,\n    25, c_to_f(25));\n}\n```\n\
    \n### Program Notes\n\n1. The function is defined in the same way as the previous\
    \ example *except* that it is defined to `return` a value to the main program.\n\
    2. The function is called twice from directly *within* the `printf` statement\
    \ (Because we have defined the function to return a value, reference to it can\
    \ be made in *exactly* the same places as a variable or constant, This is a very\
    \ powerful feature of 'C' functions).\n\n## Using Functions\n\n'C' Functions,\
    \ then, fall into 2 main groups:\n\n1. those which return values i.e. are defined\
    \ to be of a certain *type.*\n2. those which do not return values i.e. are defined\
    \ to be of type `void` (no type).\n\nYou should therefore decide, when writing\
    \ a function whether you wish it to return a value to the place from where it\
    \ was called.\n\nIf you define a function *without* specifying any type at all\
    \ (i.e. omit the “void”), the compiler assumes the function to be of type `int`.\n\
    \n## Calling Functions Before They Have Been Defined\n\nConsider the following\
    \ example:-\n\n```c\nvoid function_a( )\n{\n    printf (“Function A, now calling\
    \ function B...\\n”);\n    function_b( );\n}\n\nvoid function_b( )\n{\n    printf\
    \ (“Function B called.\\n”);\n}\n\nint main ( )\n{\n    function_a( );\n}\n```\n\
    \nIn this example program, we are attempting to call function `B` from within\
    \ function `A`. There is nothing wrong with this idea, but the example program\
    \ will not compile. The reason is that when the compiler sees a call to function\
    \ `B` in function `A`, it has no definition, so it assumes that `B` is a function\
    \ of type “int”. Later, it sees the definition for function `B` - and it is of\
    \ type “void”. This does not agree with the already assumed “int” type for function\
    \ `B`, and so the compiler generates an error message. We can get around this\
    \ problem as follows:-\n\n```c\nvoid function_b(void); /* Pre-declaration or *“Prototype”*\
    \ for function B */\nvoid function_a( )\n{\n    printf (“Function A, now calling\
    \ function B...\\n”);\n    function_b( );\n}\n\nvoid function_b( )\n{\n    printf\
    \ (“Function B called.\\n”);\n}\n\nint main ( )\n{\n    function_a( );\n}\n```\n\
    \nThis is exactly the same as the previous program, except that we have told the\
    \ compiler function `B` will be of type “void”. This is called a pre-declaration\
    \ or prototype. You could just put the whole definition of function `B` before\
    \ function `A`, but this is not always convenient. **Function pre-declarations\
    \ should also include the types of any parameters that the function uses:-**\n\
    \nWe now change `function_b` to have an integer as a parameter:-\n\n```c\nvoid\
    \ function_b(int);/* Pre-declaration for function B */\n/* B will take an “int”\
    \ (integer) parameter. */\nvoid function_a( )\n{\n    printf (“Function A, now\
    \ calling function B...\\n”);\n    function_b(99);\n}\n\nvoid function_b(int any_number)\n\
    {\n    printf (“Function B called with %d.\\n”, any_number);\n}\n\nint main( )\n\
    {\n    function_a( );\n}\n```\n\nThe pre-declaration *must* agree with the real\
    \ function declaration in **name, type and number and type of parameters.**\n\n\
    ## Codecracker Game - Functions Required\n\nNow that we have learned about functions,\
    \ we can re-consider the original flowchart and develop functions required to\
    \ make our game work. This list should cover what we need!\n\n```c\n/* Function\
    \ pre-declarations. */\nvoid draw_board(void);\nvoid generate_code(void);\nvoid\
    \ read_in_guess(int guess_number);\nvoid display_guess_on_board(int guess_number);\n\
    int mark_guess(int guess_number);\n```\n\n### Values Passed as Parameters\n\n\
    * We don’t to pass any values to `generate_code` or `draw_board` – they can do\
    \ what they need without any additional information.\n* We will pass the current\
    \ guess number (count) to the `read_in_guess` function so that it can display\
    \ a message to the user, telling them which guess they are currently on.\n* We\
    \ will pass the current guess number (count) to the `display_guess_on_board` function\
    \ so that it “knows” how far down the board to put the guess.\n* We will pass\
    \ the current guess number (count) to the `mark_guess` function so that it “knows”\
    \ how far down the board to put the marks.\n\n### Return Values\n\n* The first\
    \ 4 functions don’t need to return any values passed.\n* The `mark_guess` function\
    \ will return a value telling us whether the guess was 100% correct, so that we\
    \ know whether the game has ended and we can therefore tell the user.\n\n# Standard\
    \ 'C' Functions\n\nWe have looked at how we can define our own functions, and\
    \ pass “parameters” to them. One of the reasons why 'C' has become popular is\
    \ because of what are called “Library Functions”. There are thousands of library\
    \ functions and they broadly fall into 3 main groups:-\n\n* “Standard” C functions\
    \ (ANSI).\n* “UNIX” compatible functions.\n* “System Dependant” functions.\n\n\
    There is some overlap between the first 2 groups. If you want to make your programs\
    \ “portable” (i.e. compilable and runnable on different types of computers), you\
    \ should use functions only from the first 2 groups.\n\nWe have already used several\
    \ Library Functions - **printf,** **scanf,** **clrscr** and **getch.** These fall\
    \ into another general group called “Input/Output” functions.\n\n## Header Files\
    \ or “.h” Files\n"
  raw: 'Consider a room in your house, where you have some books on a shelf. If you
    go into another room, (and, say, close the door) you can not see those books.
    However, if you put your bookshelf, outside in the garden, you will probably be
    able to see it from both rooms, through the window.


    We can do a similar thing with data in a ''C'' program - we can declare it in
    a place where it can be seen by all functions. We do this by placing the data
    declaration outside all functions.


    char some_text[ ]=“This can be accessed by all functions.”;


    void print_the_text( )


    {


    printf (“Printing from the function...”);


    printf (some_text);


    }


    int main ( )


    {


    printf (“Printing from ''Main''“);


    printf (some_text);


    print_the_text( );


    }


    Data declared in this way i.e. outside all functions, which can be accessed by
    all functions, is called Global Data.


    ## Functions With Parameters


    ### Passing Data to Functions


    It is often common to pass data to procedures e.g. pass the value in degrees centigrade
    to a function and it prints out degrees Fahrenheit. The following example defines
    a new ''C'' Function called “c_to_f” which takes a value in degrees centigrade
    and prints out a value in Fahrenheit.


    type parameter (also called *argument*)


    /*


    **type parameter type, parameter (**argument**)**


    */


    void c_to_f (int             degrees_c)


    {


    printf (“%d Degrees C = %d degrees F”,


    degrees_c, ((degrees_c * 9) / 5) + 32);


    }


    int main ( )


    {      


    c_to_f (20);


    c_to_f (25);


    }


    ### Program Notes


    1.  We define a ''C'' function of “type void” (see later).


    2.  We specify it will take single integer value as an argument or parameter.


    3.  We write the function so it just prints out the converted value.


    4.  We call the function twice from the main program, with slightly different
    values.


    ## Returning a Value from a Function.


    It is often very useful to pass some values to a function which then “processes”
    those values in some way and then *returns* a value to the main program. We can
    re-write the last program slightly to do this:-


    **return value type, parameter type, parameter (**argument**)**


    int c_to_f                    (int              degrees_c)


    {


    int degrees_f;


    degrees_f = ((degrees_c * 9) / 5) + 32;


    return (degrees_f);


    }


    int main( )


    {


    printf (“%d degrees C = %d degrees f \n”,


                      20, c_to_f(20));


    printf (“%d degrees C = %d degrees f \n”,


          25, c_to_f(25));


    }


    ### Program Notes


    1.  The function is defined in the same way as the previous example *except* that
    it is defined to **return** a value to the main program.


    2.  The function is called twice from directly *within* the printf statement (Because
    we have defined the function to return a value, reference to it can be made in
    *exactly* the same places as a variable or constant, This is a very powerful feature
    of ''C'' functions).


    ## Using Functions


    ''C'' Functions, then, fall into 2 main groups:


    1.  those which return values i.e. are defined to be of a certain *type.*


    2.  those which do not return values i.e. are defined to be of type void (no type).


    You should therefore decide, when writing a function whether you wish it to return
    a value to the place from where it was called.


    If you define a function *without* specifying any type at all (i.e. omit the “void”),
    the compiler assumes the function to be of type int.


    ## Calling Functions Before They Have Been Defined.


    Consider the following example:-


    void function_a( )


    {


    printf (“Function A, now calling function B...\n”);


    function_b( );


    }


    void function_b( )


    {


    printf (“Function B called.\n”);


    }


    int main ( )


    {


    function_a( );


    }


    In this example program, we are attempting to call function B from within function
    A. There is nothing wrong with this idea, but the example program will not compile.
    The reason is that when the compiler sees a call to function B in function A,
    it has no definition, so it assumes that B is a function of type “int”. Later,
    it sees the definition for function B - and it is of type “void”. This does not
    agree with the already assumed “int” type for function B, and so the compiler
    generates an error message. We can get around this problem as follows:-


    void function_b(void); /* Pre-declaration or *“Prototype”* for function B */


    void function_a( )


    {


    printf (“Function A, now calling function B...\n”);


    function_b( );


    }


    void function_b( )


    {


    printf (“Function B called.\n”);


    }


    int main ( )


    {


    function_a( );


    }


    This is exactly the same as the previous program, except that we have told the
    compiler function B will be of type “void”. This is called a pre-declaration or
    prototype. You could just put the whole definition of function B before function
    A, but this is not always convenient. **Function pre-declarations should also
    include the types of any parameters that the function uses:-**


    We now change function_b to have an integer as a parameter:-


    void function_b(int);/* Pre-declaration for function B */


    /* B will take an “int” (integer) parameter. */


    void function_a( )


    {


    printf (“Function A, now calling function B...\n”);


    function_b(99);


    }


    void function_b(int any_number)


    {


    printf (“Function B called with %d.\n”, any_number);


    }


    int main( )


    {


    function_a( );


    }


    The pre-declaration *must* agree with the real function declaration in **name,
    type and number and type of parameters.**


    ## Codecracker Game - Functions Required


    Now that we have learned about functions, we can re-consider the original flowchart
    and develop functions required to make our game work. This list should cover what
    we need!


    /* Function pre-declarations. */


    void draw_board(void);


    void generate_code(void);


    void read_in_guess(int guess_number);


    void display_guess_on_board(int guess_number);


    int mark_guess(int guess_number);


    ### Values Passed as Parameters


    *   We don’t to pass any values to “generate_code” or “draw_board” – they can
    do what they need without any additional information.


    *   We will pass the current guess number (count) to the “read_in_guess” function
    so that it can display a message to the user, telling them which guess they are
    currently on.


    *   We will pass the current guess number (count) to the “display_guess_on_board”
    function so that it “knows” how far down the board to put the guess.


    *   We will pass the current guess number (count) to the “mark_guess” function
    so that it “knows” how far down the board to put the marks.


    ### Return Values


    *   The first 4 functions don’t need to return any values passed.


    *   The “mark_guess” function will return a value telling us whether the guess
    was 100% correct, so that we know whether the game has ended and we can therefore
    tell the user.


    # Standard ''C'' Functions


    We have looked at how we can define our own functions, and pass “parameters” to
    them. One of the reasons why ''C'' has become popular is because of what are called
    “Library Functions”. There are thousands of library functions and they broadly
    fall into 3 main groups:-


    *   “Standard” C functions (ANSI).


    *   “UNIX” compatible functions.


    *   “System Dependant” functions.


    There is some overlap between the first 2 groups. If you want to make your programs
    “portable” (i.e. compilable and runnable on different types of computers), you
    should use functions only from the first 2 groups.


    We have already used several Library Functions - **printf,** **scanf,** **clrscr**
    and **getch.** These fall into another general group called “Input/Output” functions.


