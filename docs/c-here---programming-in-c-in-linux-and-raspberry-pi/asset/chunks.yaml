  trans: "\n\n为下面的变量使用 `int`。`for` 循环中的元素分别是初始化、持续条件、迭代表达式。\n\n```c\nfor (i = 1; i\
    \ <= 4; i++)\n{\n    printf (“This appears 4 times!”);\n}\n```\n\n### `while`\
    \ 循环\n\n```c\ni = 0;\nwhile (i < 10)\n{\n    i++;\n    printf (“i is now %d, i”,\
    \ i);\n}\n```\n\n### `do` 循环\n\n```c\ni=0;\ndo\n{\n    i++;\n    printf (“i is\
    \ now %d, i”, i);\n}\nwhile (i < 10);\n```\n代码至少执行一次。\n\n### `switch` 语句\n\n使用整数作为控制变量：\n\
    \n```c\nswitch (card_value)\n{\n    case 1:\n        printf (“Ace”);\n       \
    \ break;\n    case 11:\n        printf (“Jack”);\n        break;\n    .\n    .\n\
    \    default:\n        printf (“%d”, card_value);\n}\n```\n\n### 函数\n\n/* 下面将声明三个函数。\
    \ */\n`int global_integer; /* 在外部声明的全局数据*/`\n\n/* 所有函数。 */\n`void function_b(void);\
    \ /* function_b 的预声明 */`\n\n```c\nvoid function_a(int any_number) /* 无返回值*/\n\
    { /* 接收整数 ^^ 参数 */\n    /* 整数仅在此函数中使用。 */\n    int local_integer;\n    printf\
    \ (“The number is %d”, any_number);\n}\n```\n\n```c\nint function_c (int any_number)\
    \ /* 返回整数*/\n{ /* ^^ 接收整数参数 */\n    function_b( ); /* 调用“function b” */\n    printf\
    \ (“The number is %d”, any_number);\n    /* 仅加 10 并返回值。 */\n    any_number +=\
    \ 10;\n    return (any_number);\n}\n```\n\n/* 没有参数也没有返回值的函数。 */\n```c\nvoid function_b\
    \ ( )\n{\n    printf (“This is function b! “);\n}\n```\n\n```c\nint main ( )\n\
    {\n    /* 调用函数 a。 */\n    function_a(10);\n    /* 调用函数 c。 */\n    function_c(\
    \ );\n}\n```\n\n### 库函数\n\n在程序顶部放置：\n\n`#include “stdio.h”      /* 用于 printf,\
    \ scanf 等 */`\n`#include “string.h”      /* 用于字符串函数 */`\n`#include “stdlib.h”\
    \      /* 用于标准 'C' 库 */`\n\n### 字符串函数\n\n- `strlen (string)`: 字符串长度\n- `strcpy\
    \ (dest, source)` 字符串拷贝\n- `strncpy (dest, source, number)` 复制 n 个字符\n- `strcmp\
    \ (string1, string2)` 字符串比较（相等时返回 0）\n- `strncmp (string1, string2, n)` 比较前 n\
    \ 个字符\n- `stricmp (string1, string2)` 不区分大小写的比较\n- `strncmpi (string1, string2)`\
    \ 比较前 n 个字符 - 不区分大小写\n- `sprintf (string, control sting, etc)` 将“printf”内容输出到字符串中。\n\
    - `centigrade_value = atoi (string)` 将字符串转换为整数\n\n### 标准 'C' 库\n\n- `srand (long)`:\
    \ 为“rand”设置种子。\n- `rand ( )`: 返回随机值 0-65535。\n\n"
