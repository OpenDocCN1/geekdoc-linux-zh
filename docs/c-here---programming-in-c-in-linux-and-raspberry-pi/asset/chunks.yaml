    \ > 1)\n{\n// 现在我们逐个使用每个命令行字符串:-\nfor (i = 1; i < no_of_strings; i++)\n{\nprintf\
    \ (“Typing %s\\t\\n”, command_line_strings[i]);\n/* 打开文件。 */\nfile_to_type = fopen\
    \ (command_line_strings[i],”r”);\n// 检查我们是否能够访问\nif (file_to_type == 0)\n{\nfprintf\
    \ (stderr, “*** Couldn't open %s\\n”, command_line_strings[i]);\n}\nelse\n{\n\
    // 循环直到文件结束。 */\ndo\n{\n// 将文件的单行读入我们的缓冲区。\nfgets(line_store,80,file_to_type);\n\
    // 将缓冲区的内容打印到屏幕上！\nprintf (“%s”,line_store);\n}\nwhile (!feof(file_to_type));\n\
    // ^^^^ 继续直到文件结束。\n// 关闭我们刚刚读取的文件。\nfclose (file_to_type);\n}\n}\n}\nelse\n{\n\
    printf (“No command line arguments given.\\n”);\n}\n}\n```\n\n你可以看到，上面是一个很短的程序\
