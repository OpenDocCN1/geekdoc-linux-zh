    正如我们在章节 15.5 中讨论的那样，预先声明程序中使用的所有函数是一个良好的 ''C'' 语言习惯——事实上，大多数编译器倾向于默认强制执行这一做法。我们实际上已经使用了一些函数
    - `printf`、`scanf`、`clrscr` 和 `getch`。严格来说，我们应该在调用这些函数之前，在程序中对它们进行预声明。然而，这此操作有种快捷方法。对于
    `printf` 和 `scanf` 的预声明，我们可以在程序的的最顶部添加以下行。


    ```c

    #include “stdio.h”

    ```


    这一行告诉编译器将 `stdio.h` 文件“插入”到当前文件中（但仅在编译期间）。如果你查看这个文件，你将发现 `printf` 和 `scanf` 的预声明，以及许多其他的“输入和输出”（I/O）函数。这就是为什么这个文件被称为
    `stdio.h` 的原因，它是“standard I/O”（标准输入输出）头文件的缩写。


    当你使用其他预定义的系统函数时，还有其他需要包含的头文件。我们遇到它们时介绍这些内容。你可以为你自己定义的函数定义你自己的头文件，但只有当你的 ''C''
    程序被拆分到多个文件中时，这才是真正必要的。


    ## 输入输出函数


    - `printf` 可以接受任意数量的参数（本课程未涵盖此）。它不返回值。

    - `scanf` 也可以接受任意数量的参数，并返回一个表示匹配并赋值的输入项数量的值。

    - `getch` 是一个不接受参数并等待按键触发的函数。它返回一个表示所按按键的值。（对于字母和数字，这是该字母或数字的 ASCII 值。）


    ## 字符串处理函数


    最常用的库函数组之一是字符串处理函数（String Manipulation functions）。在你的 ''C'' 程序中使用字符串库函数时，请在代码列表的顶部加上该行：


    ```c

    #include <string.h>

    ```


    许多标准 ''C'' 函数（出于历史原因）的名称有些晦涩。字符串处理函数也不例外。


    ### 字符串拷贝函数 - “strcpy”


    在大多数其他高级语言中，我们可以通过简单的赋值将字符串从一个变量“拷贝”到另一个变量:-


    `First_string=Second_string`


    这将将变量 `First_string` 中的所有字符拷贝到变量 `Second_string`。


    如果在 ''C'' 中我们执行以下操作:-


    ```c

    /* 声明 2 个字符串 */

    main ( )

    {

    char text_string_1[ ] = “You are awful, but I like you”;

    char text_string_2[ ] = “It''s all done in the best POSSIBLE taste”;

    text_string_1 = text_string_2;

    }

    ```


    这将不会产生想要的效果。事实上，它可能无法编译！这就是 C 表现出低层性的例子之一。


    ### 字符串拷贝函数 - “strcpy”


    要将字符从一个字符串拷贝到另一个字符串，必须使用函数 `strcpy`。通用格式为:-


    `strcpy (<destination string>, <source string>)`


    在我们的示例中，我们可以这样做


    ```c

    strcpy (text_string_1, text_string_2);

    ```


    `strcpy` 的作用是将 `text_string_2` 中的每个字符拷贝到 `text_string_1`，直到遇到 `NULL` (0) 字符——即字符串的结束。


    警告：目标区域必须有足够的空间来存放正在拷贝的字符串，例如：


    ```c

    /* 任意字符串。 */

    char source_string[ ] = “Be careful using”;

    char destination_string[11] = “Too Small!;

    /* 上述是 10 个字符 + NULL 字符。” */

    strcpy (destination_string, source_string);

    ```


    这可能导致你的程序崩溃（CRASH）！


    ### 字符串拷贝“n”字符 - “strncpy”


    它的工作方式与字符串拷贝相同，但只拷贝前 `n` 个字符，或者在源字符串中遇到 `NULL` 字符为止，例如


    `strncpy (text_string_1, text_string_2, 10)`


    将将 `text_string_2` 的前 10 个字符拷贝到 `text_string_1`（如果它的长度小于 10 个字符）。


    ### 字符串长度 - “strlen”


    此函数返回整数形式的字符串长度，例如


    `strlen (“Reves Mortimer”)` 将返回值 17。返回的值不包括空字符，即


    `strlen (“\0”)`


    ### 字符串比较 - “strcmp”


    此函数比较两个字符串。它的用法如下:-


    `strcmp (string_1, string_2)`


    并返回 3 种可能结果之一：

    - 如果字符串**完全相同**（IDENTICAL），则返回 0

    - 如果 `string_1` 的字母顺序小于 `string_2`，返回 < 0

    - 如果 `string_1` 的字母顺序大于 `string_2`，返回 > 0


    示例调用:-


    ```c

    char string_1[ ]=“Only Me!”, string_2[ ]=“Only Me!;

    if (!strcmp (string_1, string_2))

    {

    printf (“The strings are identical”);

    }

    ```


    （当然，你不会设置两个字符串的赋值然后检查它们是否相等——通常我们会从键盘读取然后使用 `strcmp` 检查输入的值是否为某个字符串。）


    ## 字符串转数字


    为了使用这些函数，请在文件顶部加上


    ```c

    #include <stdlib.h>

    ```


    ### 字符串转整数函数 - atoi


    此函数将字符串转换为整数，例如


    ```c

    int answer_to_l_e;

    answer_to_l_e = atoi (“42”);

    ```


    ### 字符串转浮点数 - atof


    此函数将字符串转换为浮点数，例如


    ```c

    float body_temp;

    body_temp = atof (“98.4”);

    ```


    ### “打印”到字符串 - sprintf


    `sprintf` 是一个非常有用的函数。它可以执行 `printf` 的所有操作，但它将结果放在字符串中。它的用法如下：


    `sprintf (destination, <control string>, parameters)`


    想将数字转换为字符串？使用 `sprintf`。


    ## Codebreaker 游戏 – 完成程序


    我们已经涵盖或提到了用于我们的 Codebreaker 游戏的大部分或全部 C 方面，你可以在 附录 1 – Codebreaker 程序列表 中找到程序。程序中有很多注释，在你阅读完本指南后阅读这些注释，应该能让你理解程序的运行机制。

