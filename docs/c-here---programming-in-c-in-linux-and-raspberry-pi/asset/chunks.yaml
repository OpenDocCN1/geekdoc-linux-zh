    ![](cover.jpeg)


    # C Here: Introduction to Programming with C in Linux and on Raspberry Pi

    By Andrew Johnson


    ## Dedication

    This guide is dedicated to all those who have made its production possible – from
    people in my own family to teachers, tutors and mentors that have guided and instructed
    me over the years. Also, we should all be thankful to many selfless and devoted
    developers, engineers and “geeks” who have helped realise the software technologies
    which play such a large role in our lives in this, the so-called 21^(st) century…


    ## Author Biography

    ![Image](images/00001.jpeg)

    Andrew Johnson grew up in Yorkshire, England and graduated from Lancaster University
    in 1986 with a degree in Computer Science and Physics. Following this, he mainly
    worked in Software Engineering for about 20 years, in the fields of telecommunications,
    process control and embedded systems. He has also worked full and part time in
    lecturing and tutoring and assessing (in Adult Education).


    Since 2012, he has followed Raspberry Pi developments and worked on 2 small personal
    Pi projects – an aircraft tracker and a simple `Python`-Based media kiosk project.


    In his spare time, he has widely researched a number of “alternative knowledge”
    topics which he has written on his website - [www.checktheevidence.com](http://www.checktheevidence.com).
    He can be contacted via that site or through [ad.johnson2211@gmail.com](mailto:ad.johnson2211@gmail.com).


    # Introduction

    This guide attempts to introduce the ''C'' Programming Language to the novice
    programmer. Some readers will perhaps be more familiar with `Java`, `Javascript`,
    `PHP` or even `C#` - all of which have a number of keyword and syntactic features
    which seem to have been borrowed or derived from `C`. (As an aside, it is highly
    likely that compilers and interpreters for these languages were originally written
    in `C` or `C++`.)


    You should find the examples easy to digest and when I originally delivered what
    is in this guide as a 10-week evening class (i.e. about 20 hours of study and
    practice), it seemed to be well-received and helped a number of people learn programming
    for the first time, although `C` is not normally considered a beginner’s programming
    language.


    This guide will not teach you everything you need to know about `C` programming,
    nor programming in general. Neither will it teach you everything you need to know
    about `Linux` or Raspberry Pi’s. It is almost entirely devoted to teaching you
    the **fundamentals of the C language, using `Linux` and/or `Raspberry Pi` as a
    platform for doing this.** The guide does not go into the more advanced features
    of the `C` language, nor does it discuss system programming much, if at all. It
    does, however, discuss the use of pointers in `C`.


    A companion guide **Advanced C Programming** should be available by the time you
    read this. (This will cover the use of `C` Structures, more advanced pointer usage,
    bit and byte level access, binary file access and topics such as dynamic memory
    allocation.)


    ## Introduction to ''C''

    The ''C'' Language “rose to fame” in the 1980’s, having been used in the smallest
    microprocessor systems to the largest mainframes and supercomputers. The language''s
    popularity probably stems from its flexibility and its ease of access to low-level
    features which can give a great deal of control over the host system.


    It is rather a strange language and can be very cryptic (have a look at this example
    - [http://bit.ly/2qAkPVH](http://bit.ly/2qAkPVH)), perhaps because it can still
    maintain some of its original low-level appearance. For the inexperienced programmer,
    there are many pitfalls - some of which this guide attempts to highlight. Once
    mastered, however, the ''C'' language offers a suitable compromise between a high
    and low level language. Since the turn of the millennium, `C` has arguably undergone
    something of a “come-back,” with the increasing uptake and usage of `Linux` across
    many computing platforms and the widespread availability of advanced free open
    source `C` compilers and associated development environments, one of which (“Codeblocks”)
    we will use in this guide.


    For the potential `C++` programmer, learning the original `C` language is probably
    not a bad idea, as most of the fundamentals of `C++` are the same as those for
    `C`.


    ### Applications of C

    It is used by professionals and hobbyists. It is a general purpose language -
    used in the development of Microprocessor Software, Device Drivers, early Operating
    Systems, Applications Software and Games! It is most commonly used through a compiler,
    although at least one `C` interpreter (`Ch`) has become available in recent years.


    Serious and continued use of `C` in programming will force you to learn more about
    the underlying nature of the computer and the operating system you are using.
    Using `C`, you are often forced to think at a “lower machine level” when writing
    programs. In more modern programming languages, much of the low-level activity
    is hidden away in runtime libraries or “imported modules”. With `C`, you are at
    the “bleeding edge” of the system, in most cases.


    ## History of ''C''

    The `UNIX` operating system was developed in parallel with the `C` programming
    language. Now, of course, `Linux` has been developed to be a working clone of
    `UNIX`, hence `C` can essentially be considered a “native” programming language
    for `Linux`.


    ''C'' had its beginnings in a language called `BCPL`, which was introduced in
    the 1960''s. From this, a language called ''B'' was developed and this subsequently
    became ''C,'' written by Dennis Kernighan at Bell Labs in 1972. Later in the 1970''s
    ''C'' became more widely used and an important milestone in the language''s history
    was in 1978 when Brian Kernighan and Dennis Ritchie published a ''C'' Language
    Reference Manual. This eventually became the recognised standard for the language,
    but was not official.


    By 1988, the language was being so widely used that ANSI produced a standard for
    the language - largely based on Kernighan and Ritchie''s 2nd edition of the reference
    manual. All ''C'' compilers which are said to be ANSI compliant adhere to the
    standards laid down by ANSI in 1988.


    ## Philosophy of ''C''

    The ''C'' philosophy is always *“the programmer knows what he / she is doing”*,
    and there are few safeguards for the careless programmer. The language''s attitude
    is much different than BASIC or some of the sophisticated newer languages such
    as `Java`, `Python` and `C#`. It allows you to write illegal and nonsensical code.
    Its syntax and type checking are weak, though default settings in modern compilers
    enforce more strict programming options. The main advantage of `C` is that you
    have a great deal of flexibility and, for instance, access to machine hardware
    is often trivially simple compared to other languages. Also, ''C'' compilers can
    generate compact and well-optimised code which is ideal for small scale applications,
    but also useful for larger ones where you just need “that bit more” from your
    system. Time critical applications can often still benefit from being coded in
    `C`, not just because compiled code can run hundreds of times faster than interpreted
    code, but also because `C` programs can often “bypass” certain operating system
    features which compromise the performance of a program/application.


    # Using This Guide

    1) **You will need to have a device capable of running a version of `Linux` that
    dates from approximately 2012 onwards. I will be referring to `Ubuntu` and `Raspbian`
    versions of `Linux`, which are both derivatives of `Debian`.**

    2) **You need know how to be able to use commands in a terminal window or through
    a command line in `Linux` and/or install a `Linux` Application using the Software
    Centre (Ubuntu), App Grid or some other GUI or command line based application
    installer such “apt-get`.**


    ## Using Windows or Mac Systems for Learning C

