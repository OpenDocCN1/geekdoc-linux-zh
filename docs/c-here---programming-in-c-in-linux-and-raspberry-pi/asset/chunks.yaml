    ```c\nint main()\n{\n    /* 这是一个注释！ */\n    printf(\"Huh?\");\n}\n```\n所有的 `C`\
    \ 语句都以 `;` 结束，`` 之前除外。所有的 `C` 保留字均为小写。`C` 是大小敏感的。\n\n#### 数据声明\n在代码之前：\n```c\n\
    int centigrade_value;   /* 整数 */\nlong unemployment;      /* 大整数 */\nchar any_char;\
    \          /* 字符 */\nfloat exchange_rate;    /* 浮点数 */\nchar any_string[] = \"\
    Only Me!\"; /* 字符串 */\n```\n#### 数组：\n```c\nint card_values[52]; /* 52 个元素的数组\
    \ */\n```\n数组元素引用从零开始，例如 `card_values[4]` 是 `card_values` 数组的第 5 个元素。\n\n####\
    \ 输出到屏幕 - printf\n```c\nprintf(\"The number was %d\\n\", centigrade_value);\n\
