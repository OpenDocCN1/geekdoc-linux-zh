    # Compiling and Running C Programs


    ## Command Line and GUI


    In modern desktop operating systems, there are essentially 2 modes of user interaction:


    - Graphical User Interface (a *long* time ago this was called WIMP – Window Icon
    Mouse Pointer!)

    - Command Line or “Terminal” (The latter being a reference to how early computers
    provided real-time access to a computer via a Visual Display Unit – VDU – which
    was simply a keyboard and a screen.)


    Some people prefer one method over another – though the GUI method has many advantages.
    If you are running a “stripped down” version of Linux – for example to run in
    a lower power device where you can’t attach a screen, command line may be the
    only available method.


    ### GUI


    Here, you are simply using another application/package to compile and run programs
    – which operates in a very similar manner to your word processor, spreadsheet
    etc. You type in the program and essentially run it straight away, then go back
    to typing/editing.


    ### Command Line


    Here you type commands (covered in the next section) to compile and run the program
    and then typically type another command to run and editor program (such as “nano”).
    This is covered in section [5.5](#part0004_split_002.html_id_Toc483576733).


    ## Installing Codeblocks IDE on Raspberry Pi / Linux


    There are many useful and wonderful editors and IDE’s available under the Linux
    Operating system and probably nearly as many of these are available on the Raspberry
    Pi. However, I have chosen the excellent “Codeblocks” IDE for this guide.


    On Linux, it could be installed on your system by opening the Software Centre
    and searching for “Codeblocks,” although this may not give you the very latest
    version available. However, completing the following steps will work best.


    ```

    sudo apt-get install

    ```


    ![Image](images/00006.jpeg)


    Raspbian Jessie – Codeblocks installation from Command Line


    An icon should be added to the launcher or applications folder which looks like
    this: ![Image](images/00007.jpeg)


    On the Raspberry Pi, once installed, Codeblocks should appear in the Applications/Programming
    menu:


    ![Image](images/00008.jpeg)


    Programming Sub Menu on Raspberry Pi


    ![Image](images/00009.jpeg)


    Codeblocks Compiler Detection – Should be set to `gcc`


    ![Image](images/00010.jpeg)


    Codeblocks – Successfully Loaded and Running – Ready for a Program!


    ## First Program – Codeblocks


    There are 2 ways of getting your first program to run, both of which are outlined
    below.


    ### Quick/Direct Method


    1. Select “File/New” and “Create Empty File”:


    ![Image](images/00011.jpeg)


    2. When you see the empty file appear, enter the following text *exactly* as shown.
    **Don’t miss out any of the characters and take care with the quotation marks,
    brackets and semi-colons!**


    ```c

    /* The first ''C'' program! */


    #include "stdio.h"


    int main( )

    {


    printf ("Greetings, pop pickers!");


    getchar( );

    }

    ```


    3. Then click the “Play” button, which should give you the display shown below.


    ![Image](images/00012.jpeg)


    1. Click “Yes” and you should then see the display below:


