    \ In 'C', the way this is done is a little cryptic.\n\n## The 'C' Input Function\
    \ “scanf” for reading strings and numbers.\n\nThe following 'C' program will read\
    \ in a number and print it out.\n\n```c\nint main( )\n{\n    int centigrade_value;\n\
    \    printf (“Enter a value in Degrees Centigrade:”);\n    scanf (“%d”, &centigrade_value);\n\
    \    printf (“The value entered was %d C.\\n”, centigrade_value);\n}\n```\n\n\
    ### Notes\n\n1.  We first declare `centigrade_value`.\n2.  We print out a prompt.\n\
    3.  We read in the number from the keyboard.\n4.  We print out the value entered.\n\
    5.  The `&` before `centigrade_value` is important - we will explain it later.\n\
    \nThe 'C' function `scanf` is used to read in data from the keyboard. It is, more\
    \ or less, the complimentary function to `printf`. When `scanf` is used, it has\
    \ at least 2 parts:-\n\n```c\nscanf (“%d”, &centigrade_value);\n```\n\n(1) (2)\
    \ (3)\n\nThe parts are:\n\n1. Function name\n2. Control String\n3. Variable used\
    \ to store the value read in\n\nThe control string follows the same format as\
    \ the one used for “printf” as described in section [*9.1](#part0004_split_019.html_id_Toc483576750).*\
    \ “scanf” can be used to read values into more than one variable at a time e.g.\n\
    \n```c\nscanf (“%c %d %f”, &gender, &age_in_years, &weight);\n```\n\nHere, we\
    \ have used `scanf` to read values into three variables `gender`, `age_in_years`,\
    \ and `weight`.\n"
