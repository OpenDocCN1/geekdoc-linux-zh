    \ `main` 声明中的参数。因为 `main` 是和其他任何函数一样的 'C' 函数，我们可以给参数起任何喜欢的名称并让它们尽可能易读。`argc` 和\
    \ `argv` 可能（！）代表“参数计数”（argument count）和“参数向量”（arguments vector）。\n\n## 'C 编程风格'\n\
    \n由于 'C' 是一种“自由格式”语言，直接“堆砌”代码而不担心使用一致或合理的布局是非常的，尽管大多数复杂的文本编辑器都具有某种自动格式化功能来帮助布局。在编写程序时，尽量让它们易读是非常重要的。这可以通过遵循简单的准则来实现：\n\
    \n1. 使用合理的变量和函数名，并用划线代替“空格”。例如，使用 `centigrade_value` 而不是 `c` 或 `c_val`。或者，如果你不喜欢使用划线，可以在变量名中使用大字母，例如\
    \ `CentigradeValue`。记住 'C' 是区分大小写的，所以要写对大写字母！\n\n2. 间距留得当并合理缩进，例如将\n\n`if (centigrade_value\
    \ == 30)`\n`{`\n`printf (“Rather Warm”);`\n`average_value += centigrade_value;`\n\
    `}`\n\n而不是：\n\n`if (centigrade_value==30){printf(“Rather warm”);average_value\
