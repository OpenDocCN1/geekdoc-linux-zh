    # Keyboard Input


    Most high level languages have a way of reading in data from the keyboard. In
    ''C'', the way this is done is a little cryptic.


    ## The ''C'' Input Function “scanf” for reading strings and numbers.


    The following ''C'' program will read in a number and print it out.


    int main( )


    {


    int centigrade_value;


    printf (“Enter a value in Degrees Centigrade:”);


    scanf (“%d”, **&**centigrade_value);


    printf (“The value entered was %d C.\n”, centigrade_value);


    }


    ### Notes


    1.  We first declare “centigrade_value”.


    2.  We print out a prompt.


    3.  We read in the number from the keyboard.


    4.  We print out the value entered.


    5.  The “&” before “centigrade_value” is important - we will explain it later.


    The ''C'' function “scanf” is used to read in data from the keyboard. It is, more
    or less, the complimentary function to “printf”. When “scanf” is used, it has
    at least 2 parts:-


    scanf (“%d”, **&**centigrade_value);


    (1) (2) (3)


    The parts are:


    1.  Function name


    2.  Control String


    3.  Variable used to store the value read in


    The control string *follows the same format as the one used for “printf” as described
    in section* [*9.1*](#part0004_split_019.html_id_Toc483576750)*.* “scanf” can be
    used to read values into more than one variable at a time e.g.


    scanf (“%c %d %f”, **&**gender, **&**age_in_years, **&**weight);


    Here, we have used “scanf” to read values into three separate variables “gender”
    (of type “char”, “age_in_years” (an “int”) and “weight” (a “float”). When these
    values are entered at the keyboard, they can be separated (in this example) by
    a space or spaces, or a carriage return.


    We can use the control string to force values to be entered in a certain way e.g.
    to read in dates, separated by dashes:-


    scanf (“%d-%d-%d”, **&**day_number, **&**month_number, **&**year);


    We can use this feature to check and validate inputs.


    ## Single Character input – getchar() and getc()


    Often, we just wish to read a single character from the keyboard (or somewhere
    else). We might want the user to press “Enter” after the character, or we might
    not. The getchar() and getc() functions allow us to do this.


    For example, we could read single guess digits into an array with the following
    code:


    char guess_digits[5];


    guess_digits[0]=getchar();


    guess_digits[1]=getchar();


    guess_digits[2]=getchar();


    guess_digits[3]=getchar();


    An alternative way of doing this is to use **scanf()**, as discussed above. Hence
    we can now consider how another part of our Codecracker game will be written (though
    we will revise this later).


    ### Note about the of a “getch()” function


    In our final program, we will use a “getch()” function which will return a single
    character from the keyboard, without enter being pressed. This will make the final
    game a little more user friendly and it will make the input considerably easier
    to validate.


    ## Codecracker Game – Reading in our Guess


    We can now write a line of code to read in our guess.


    char guess_digits[5];


    scanf(“%4c”,guess_digits);


    This would read 4 characters from the keyboard (the user would need to press enter,
    after the 4^(th) character, though). The characters would be stored in the “guess_digits”
    array. However, there are 2 problems to consider:


    What would happen if the user


    *   Did not enter numbers/digits but letters or other characters?


    *   Entered too few or too many digits?


    Ideally, we need to “force” the user to only enter 4 **digits** (0 to 9) as anything
    else would not match our secret code. We will have to “cheat” slightly, here,
    in order to do this.


