    ```\n\nto initialise elements individually OR\n\n```c\nint phaser_bank_levels[5]\
    \ = {10};\n```\n\nto initialise all elements of the array `phaser_bank_levels`\
    \ to 10.\n\n## Multidimensional Arrays\n\nCan be declared by adding another index\
    \ to the variable name:-\n\n```c\nfloat daily_totals_by_week[52][7];\n```\n\n\
    would declare a 52 x 7 array of floats, the 6th day 22nd week could then be referenced\
    \ with\n\n```c\nprintf (“%f”, daily_totals_by_week[21][5]);\n```\n\n## Use Of\
    \ Arrays\n\nArrays are commonly used to manipulate data as it would be in a table.\
    \ Each “box” in the table corresponds to an element in the array. Consider the\
    \ following example. Suppose we wished to store the rainfall (in mm) for a particular\
