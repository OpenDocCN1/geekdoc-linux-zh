    \n1. 声明一些变量 - 包括一个用于存储文件 `stream` 的变量。\n2. 尝试打开文件进行读取。如果无法打开文件，`stream` 将具有值 `0`\
    \ (`NULL`)。\n3. 检查文件是否已正确打开。\n4. 从文件中读取三个数据项并存入名为 `i`、`c` 和 `f` 的变量中。\n5. 关闭文件并结束。\n\
    \n文件中必须包含与 `fscanf` 尝试读取的内容匹配的数据，因此，包含以下内容的文件：\n\n147 z 9.81\n\n或者\n\n147\nz\n\
    \n9.81\n\n都是可以（每个项目之间用空格或换行分隔）。一旦程序中的 `fscanf` 执行完毕，`i` 将获得值 `147`，`c` 将持有字符 `z`，`f`\
    \ 将获得值 `9.81`。然而，如果文件中包含：\n\nz\n147\n9.81\n\n事情就会“出错”，因为示例中的 `fscanf` 期望先看到一个数字\
    \ - 它实际看到的是一个字符，因此变量将无法正确赋值。\n\n## 命令行参数\n\n考虑 Linux 命令 `cp`，它实际上可以被写成一个 C 程序（正如之前在介绍文件/流操作时暗示的那样）。它的伪代码可能如下：\n\
    \n检查 `>2nd File<`（目标）是否与第一个文件相同。如果相同，立即退出。\n\n打开 `>1st file<` - “源”文件。\n\n(***\
    \ 某人在这里漏掉了一行伪代码)\n\n打开目标文件。\n重复\n    读取源文件的块。\n    将该块写入目标文件。\n    直到（所有源文件已读取完毕）。\n\
    \n当我们运行程序时，标记为 `>this<` 的内容是命令行上的部分信息。它们是 `copy` 命令的 `PARAMETERS` - 要复制的文件名作为\
    \ COMMAND LINE PARAMETERS 传递给 `copy` 程序。当 `copy` 程序运行时，它将命令行上提供的两个字符串视为文件名。然后它尝试打开这些文件并实际执行复制操作。\n\
    \n(*** 多年前在 `cp` 命令原始设计中漏掉的那行伪代码是检查目标驱动器/设备以查看是否有足够的空间存放目标文件 - 如果空间不足，程序应该**立即**退出。)\n\
    \n用于复制的命令行参数如下所示：-\n\n`cp mavis.txt jack.txt`\n`^argument [0]` `^argument[1]`\
    \ `^argument[2]`\n\n事实上，大多数终端命令（它们本身就是程序）都会接受某种形式的命令行参数。\n\n### 在 C 程序中访问命令行参数\n\
    \n在 C 程序中访问命令行参数是相对直接的。它们被 C 程序视为一组字符串 - 一个数组。接下来的 C 程序演示了这一点。\n\n```c\n/*\n这是一个演示命令行参数用法的程序\n\
    */\n#include <iostream.h>\n#include <conio.h>\n\n// 我们修改了“main”的声明，以便我们可以访问命令行\n\
    // 参数...\n/* 系统以以下方式组织它们:-\nString String Number\n+----------------+\n| Program\
    \ Name | 0\n+----------------+\n| | 1\n+----------------+\n| | 2\n+----------------+\
    \ .\n. . .\n. . .\n+----------------+ .\n| | no_of_strings (第一个参数，在\n+----------------+\
    \ 下文的 “main” 声明中).\n*/\n// 注意，使用 “char *” 非常重要。\nint main(int no_of_strings, char\
    \ *command_line_strings[])\n{\nint i;\nprintf(“\\033[2J”); // 用于清除控制台“屏幕”区域的特殊命令\n\
    // 输出我们测试程序的名称 - 它作为数组中的\n//第一个字符串存储:-\nprintf (“The program executable filename\
    \ is: \\t”);\nprintf (“%s\\n\\n”, mmand_line_strings[0]);\nif (no_of_strings >\
    \ 1)\n{\nprintf (“Command line arguments are:\\n”);\n// 现在我们逐个打印每个命令行字符串\nfor\
    \ (i = 1; i < no_of_strings; i++)\n{\nprintf (“\\t%s\\n”, command_line_strings[i]);\n\
    }\n}\nelse\n{\nprintf (“No command line arguments given.\\n”);\n}\n}\n```\n\n\
    将我们在访问文件时使用的内容“缝合”到上述程序中，，可以生成一个新版本的 Linux “cat” 命令（它只是在屏幕上显示文件）。该程序的代码如下。\n\n\
    ```c\n/*\n这是一个演示命令行参数进一步用法的程序，\n它是 Linux/Unix “cat” 命令的简单版本。\n*/\n#include <stdio.h>\n\
    // 我们修改了“main”的声明，以便我们可以访问命令行\n// 参数...\nint main(int no_of_strings, char *command_line_strings[])\n\
