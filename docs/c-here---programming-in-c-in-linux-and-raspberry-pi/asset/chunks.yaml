    \n```bash\ngcc hello.c -o hello\n```\n\n1. 如果你看到任何错误信息，或者收到除了命令提示符以外的任何内容，你需要通过再次输入\
    \ `nano hello.c` 来检查你的程序，并将你输入的内容与上方的内容进行对比。确保它们**完全**一致。如果你没有看到任何错误信息，直接输入：\n\
    \n```bash\n./hello\n```\n\n1. 你应该看到下面的显示。\n\n![Image](img/00027.jpeg)\n\n1. 按回车返回命令行。\n\
    \n2. 恭喜！你现在完成了你的第一个程序并成功运行了它！\n\n## 第一个程序 - 它在做什么？\n\n该程序所做的就是在屏幕上打印一条消息，并等待按下回车键。详细细节如下：\n\
    \n1. `main( )` - 表示程序的开始。\n2. `{`（左大括号）意味着一个“块”的开始。\n3. `printf` 是一个打印“函数”——输出。\n\
    4. `getchar( )` 是一个键盘读取“函数”——读取字符输入并等待按下回车键。\n5. `}`（右大括号）意味着一个块的结束。\n6. `/* */`\
    \ 意味着“注释”。“标记”之间的文本会被编译器忽略——这些文本用于记录每一步的操作。\n\n在本指南结束时，你应该能够理解程序中所有行的作用。\n\n##\
    \ 第一个程序 – 观察\n\n我们从这第一个程序中看到：\n\n* 'C' 是“自由格式”的——程序中不需要输入行号（某些文本编辑器会在左侧边缘显示行号）。\n\
    * 'C' 是“块结构化”的——所有内容都在大大括号 `{ }` 之间的“块”中指定。\n\n我们还应该注意 C 是区分大小写的。这意味着如果你使用 `Printf`（大写字母\
    \ “P”）而不是 `printf`，程序将无法运行。\n\n在接后的示例中，并不总是会列出整个程序。除非另有说明，否则你应该始终将程序输入到以下“骨架”中：\n\
    \n```c\nint main ( )\n{\n    <你的程序代码>\n}\n```\n\n## 关于“控制台应用程序”和控制台窗口的说明\n\n我们刚刚输入的程序与本指南中将看到的所有其他程序一样，都在控制台窗口（Console\
    \ Window）中运行。`控制台窗口`本质上是对交互式计算早期的回溯——那时你有一个基础的计算机控制台，只能显示字符或非常有限的图形。那里没有图形用户界面，而且几乎没有实际的图形。如果你学习《高级\
    \ C 语言编程指南》，我们将查看一些基本的 Linux 图形特性，但不是 GUI 编程。完整的 GUI 编程通常结合使用 C++ 等面向对象的编程语言会更好地理解。\n\
    \n# 'C' 中不同类型的数据\n\n## 程序中的数据是什么？\n\n它是程序执行其功能所需的信息。例如，公司人事记录中员工的姓名和地址，某人收藏中唱片的标题和艺术家。\n\
    \n现实世界中的数据具有无限的变化性。在 'C' 中，与其他编程语言一样，数据只有特定的表达方式。\n\n## 在 'C' 程序中使用数据\n\n要在程序中使用数据，我们必须先声明它，即输入一行特殊的代码，例如：\n\
    \n```c\nint number_of_items;\n```\n\n为了声明一个数据——一个整数，“整数字”，用于存储某些计数操作的项目数量。代码必须知道它将使用什么数据，因此：数据声明始终位于代码之前。\n\
    \n### 关于数据声明的说明\n\n显示的数据声明分三部分：\n\n`int number_of_items ;`\n(1) (2) (3)\n\n它们是：\n\
    1. 数据类型\n2. 数据项名称\n3. 终止符\n\n我们将声明的数据项称为 `variables（变量）`。`Name` 通常被称为 `identifier（标识符）`。\n\
    \n### 数据项（变量）命名\n\n变量命名遵循某些规则：\n\n* 变量名不能以数字开头。\n* 变量名不能包含空格（使用下划线 `_` 代替）。\n\
    * 变量名是“区分大小写”的。\n* 不能使用以下任何字符：`$ - +`。\n\n（注：原始文本中存在大量重复的规则行，已进行清理并保留核心规则）。\n"
