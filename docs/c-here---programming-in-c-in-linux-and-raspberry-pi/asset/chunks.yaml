  trans: "\n`printf` 命令在第 9 章中会有更详细的解释。\n\n# 表达式、语句和运算符\n\n这些是用于描述任何编程语言特定部分的 2 个词汇，理解它们非常重要。\n\
    \n## 表达式\n\n表达式是变量名、数字和运算符的集合，它们可以一起用于计算以产生单个结果，例如：\n\n```\na + 2*b - 4*(c+d)\n\
    ```\n\n表达式通常形成*赋值语句的右侧部分*。\n\n## 语句\n\n是指程序中的任何完整命令。在 'C' 语言中，语句以分号结束：\n\n```c\n\
    e = a + 2*b - 4*(c+d);\n```\n\n在这里，*表达式* `a + 2*b - 4*(c+d)` 构成了整个语句的*部分*。以下也是一条语句：\n\
    \n```c\nprintf (“Crinkly Brindlewurdles...”);\n```\n\n## 运算符\n\n| 符号 | 操作 |\n\
    | :--- | :--- |\n| + | 加法 |\n| - | 减法 |\n| * | 乘法 |\n| / | 除法 |\n| % | 取模（余） |\n\
    \n运算符是语言中用于表示对数据进行常用操作的符号。有算术运算符和其他类型的运算符（后引入）。总之，'C' 拥有一套丰富的运算符，但基本的运算符如上表所示。（稍我们将看到\
    \ `EQUALITY TESTING` 使用 `“= =”.`。）\n\n## 自增和自减\n\n“自增”通常意味着“加 1”，“自减”通常意味着“减 1”。'C'\
    \ 语言中一些非常有用的运算符是“自增”和“自减”运算符。\n\n`++` 增 1。\n\n`--` 减 1。\n\n### 自增\n\n例如，自自增运算符可以产生以下效果：\n\
    \n```c\ni = 0;\ni++;             /* i 现在等于 1\\. */\n```\n\n自减运算符具有相反的效果：\n\n```c\n\
    i = 4;\ni--;             /* i 现在等于 3\\. */\n```\n\n`++` 和 `--` 可以出现在它们所使用的变量名的之前或之后\
    \ - 效果略有不同。这些运算符也可以放在 C 语句的几乎任何地方，例如：\n\n```c\ni = 0;\nj = i++;     /* 结果: i =\
    \ 1, j = 0 */\n/* 但是 */\ni = 0;\nj = ++i;     /* 结果: i = 1, j = 1 */\n```\n\n\
    自增和自减运算符通常用于“for”循环（后引入）。\n\n### 自增/自减总结\n\n换句话说，如果运算符放在变量*之前*，则自增/自减在变量操作*之前*执行；如果运算符放在变量*之后*，则在对变量操作*之后*执行。\n\
    \n## 其他一些运算符\n\n与 `++` 和 `--` 类似的还有 `+=` 和 `-=`\n\n`+=` 加上指定的数值。\n\n`-=` 减去指定的数值。\n\
    \n例如：\n\n```c\ni = 5;\ni += 10;/* 结果现在是 15\\. */\ni = 17;\ni -= 10;/* 结果现在是 7\\\
    . */\n```\n\n总而言，我们可以说：\n\n```c\ni += x; /* 等于 i = i + x; */\ni -= x; /* 等于 i\
    \ = i - x; */\n```\n\n注意：运算符 `/=`、`*=` 和 `%=` 也可以用。\n\n# 输出到屏幕 - “Printf”\n\n\
    我们现在将详细地查看 `printf` 函数。\n\n```c\nprintf (“some text”, <some variables>);\n```\n\
    \n(1) (2) (3)\n\n1. 函数名\n2. 控制字符串\n3. 需要打印其值的变量\n\n`printf` 的简单情况就像第一个示例程序，只包含要打印的文本而没有其他变量。\n\
    \n## 输出存储在变量的值 – “转换”字符\n\n更复杂的情况你在“控制字符串”中放入一个或多个“转换字符”。转换字符紧跟 `%` 符号。一种转换字符是\
    \ `%d`，意味着“在这里替换整数变量的值”。其他转换字符有：\n\n| 转换说明符 | 用途 |\n| :--- | :--- |\n| %ld | 用于打印\
    \ long 数据。 |\n| %c | 用于打印 char 数据。 |\n| %f | 用于打印 float 或 double 数字数据。 |\n| %s\
    \ | 用于打印字符串数据（后介绍）。 |\n\n注意：对于你指定的每一个转换字符，你必须在控制字符串之后包含一个变量，否则可能会出现不可预测的结果。\n\n\
    ### 使用 “printf” 的示例程序\n\n```c\n#include \"stdio.h\"\n\nint main() {\n    char\
    \ letter;\n    int number;\n    long long_number;\n    float decimal_number;\n\
    \n    letter = 'z';\n    number = 37;\n    long_number = 1000;\n    decimal_number\
    \ = 9.81;\n\n    printf (“The letter is %c\\n”, letter);\n    printf (“The number\
    \ is %d\\n”, number);\n    printf (“The long number is %ld\\n”, long_number);\n\
    \    printf (“The decimal number is %f\\n”, decimal_number);\n}\n```\n（注：提供的代码块原始文本是碎片化的；我根据文中提到的格式说明符和变量重构了逻辑）。\n\
    \n### 注释\n\n程序执行了以下操作：\n\n1. 声明了 char, int, long 和 float。\n2. 用值初始化它们。\n3. 在消息中打印每个，并在后跟一个换行。\n\
    \n# 文本字符串\n\n就像我们可以为数字和字符定义数据项一样，也可以为文本定义数据项并打印它们。这通过下面的程序实现。\n\n```c\nint main\
    \ () {\n    char android_name[] = “Kryten”;\n    char android_type[] = “Mechanoid\
    \ 2000”;\n\n    printf (“Here comes the string... \\n”);\n    printf (“Android's\
    \ name is \\t%s\\n”, android_name);\n    printf (“Android's model number is \\\
    t%s\\n”, android_type);\n}\n```\n\n### 程序注释\n\n程序执行了以下操作：\n\n1. 声明了两个名为 `android_name`\
    \ 和 `android_type` 的字符串变量，并将它们初始化为所示的字符。\n2. 打印一条消息。\n3. 在消息中打印每个字符串，并在后跟一个换行。\n\
    \n## 为什么字符串声明使用 []？\n\n在 'C' 语言中声明文本字符串的这种特性是因为字符串实际上是*字符数组*。严格来说，当我们声明一个字符串时，应该这样做：\n\
    \n```c\nchar any_string[18] = “Zaphod Beeblebrox”;\n```\n\n在这里我们声明了一个包含 18 个字符的数组，用于存储“Zaphod\
    \ Beeblebrox”的字母 - 实际上只有 17 个字母！需要额外的字符是因为 'C' 语言通过一个值为 0 的字符来识别文本字符串的结束。编译器在字符串的结束引号之前（隐式地）为我们放入了一个\
    \ 0 字符。所以在 'C' 语言中，\n\n所有字符串都被 NULL (0) 终止。\n\n在声明字符串时，使用 `[]` 是一种捷径——因为 'C' 编译器可以计算出字符串的长度，它实际上是为我们在\
    \ `[]` 之间放置了这个数字。\n\n因此，上面的“Zaphod Beeblebrox”字符串可以显示为*字符数组*:-\n\n"
