    i != 10;        /* 不等于 */\ni > 10;         /* 大于 */\ni < 10;         /* 小于 */\n\
    i >= 10;        /* 大于等于 */\ni <= 10;        /* 小于等于 */\n&&              /* 逻辑与\
    \ */\n||              /* 逻辑或 */\n&               /* 单一操作数 - 地址 */\n*         \
    \      /* 指向所指对象的指针 */\n>>              /* 右移 */\n<<              /* 左移 */\n~\
    \               /* 运算按位取反（反码） */\n|               /* 运算按位或 */\n&             \
