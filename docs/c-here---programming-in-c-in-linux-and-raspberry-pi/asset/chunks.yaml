    \ `character_ptr`。如果你只引用数组名，它意味着数组中第一个元素的地址（无论该元素是什么类型）。回看我们对 `strcpy`（字符串拷贝）库函数的使用，这实际上就是我们那里所做的事情。\n\
    2. 我们在赋值中递增字符指针（这种操作在许多程序中非常常见）。\n\n## 更高级的指针用法\n\n下一个程序实现了它自己的 `strcpy` 库函数。它是指针在“C”语言中如何使用的良好示例。\n\
    \n```c\nvoid string_copy (char *destination_ptr, char *source_ptr)\n{\n    /*\
    \ 从源位置拷贝到目标位置，直到遇到 NULL\n    字符 - 此时条件将失败！ */\n    do\n    {\n        *destination_ptr++\
    \ = *source_ptr;\n    }\n    while (*source_ptr++);\n}\n\nint main( )\n{\n   \
    \ char source_string[ ] = “Reg Holsworth for PM!”\n    char destination_string[50];\n\
    \    string_copy (destination_string, source_string);\n    printf (“My vote is\
    \ ... %s\\n”, destination_string);\n}\n```\n\n#### 程序要说明\n\n1. 我们定义了一个函数 `string_copy`，它包含两个字符指针参数（`char\
    \ *`）。\n2. 我们启动了一个 `do` 循环。\n3. 我们将目标指针指向的字符赋值为源指针指向的字符，并（隐式地通过 `++`）递增目标指针。\n\
    4. 我们测试源指针指向的内容是否为 NULL（零）字符，并隐式地递增源指针。如果我们发现 NULL 字符，它会被拷贝，但循环将终止。\n5. 通常不建议重写库函数！这个示例纯粹是为了演示指针用法。\n\
    6. 这个示例说明了如何用几条简短的“C”语句编写一组相当复杂的操作。\n7. 库函数 `strcpy` 的类型实际上是指向 `char` 的指针。它返回一个指向目标字符串的指针（换句话说，即第一个参数的值）。\n\
    \n**注意**：在“C”程序中使用指针时必须非常小心。这是“C”语言假设你清楚自己在做什么的又一个领域。错误的指针使用可能导致数据丢失或你程序正在使用的任何文件发生文件损坏。\n\
    \n# 文件处理\n\n编程语言的重要特性之一是它们在宿主系统的主内存与其磁盘存储之间传输数据的能力。例如，假设你编写了一个“C”程序来存储实验结果，你可能希望程序首先允许用户输入值，然后将它们保存到磁盘上的文件中。在较晚的阶段，你可能希望将这些数据检索到程序中以供其他用途。或者，你可能希望将数据加载到另一个软件包中——例如文字处理器或电子表格。\n\
    \n## 文件输入与输出 - 文件 I/O\n\n用于程序操作文件的通用术语是“文件 I/O”。在“C”语言中，文件 I/O 通过使用库函数完成，这里显示了其中几个：\n\
    \n| 函数 | 说明 |\n| :--- | :--- |\n| `fopen (<filename>, <mode>)` | 准备文件使用 - 返回用于\
    \ `<stream>` 的值 |\n| `feof (<stream>)` | 检查是否到达结束。 |\n| `fprintf (<stream>, control\
    \ string, variables)` | 将内容输出到文件。 |\n| `fputc (<stream>, char);` | 向文件输出单个字符。\
    \ |\n| `fgetc (<stream>);` | 从文件中读取单个字符。 |\n| `fscanf (<stream>, control string,\
    \ variables)` | 从文件输入（读取）内容——类似于“scanf”。 |\n| `fclose (<stream>)` | 结束文件使用 |\n\
    \n执行文件 I/O 的方法有很多，并不是所有的都会在这里列出。\n\n### `fopen`\n\n该函数接受 2 个字符串作为参数，要求系统为你的程序准备文件使用并做好就绪。该函数的第二个参数是一个字符串，指示你希望以何种“模式”访问文件：\n\
    \n### `fopen` 模式\n\n| 模式字符串 | 动作/说明 |\n| :--- | :--- |\n| `r` | 打开用于读取 |\n| `w`\
    \ | 创建用于写入。如果文件已存在，将会被覆盖。 |\n| `a` | 追加；在文件末尾打开。如果文件不存在则创建。 |\n| `r+` | 以读写模式打开现有文件。\
    \ |\n| `w+` | 创建新文件用于读写。如果存在，将会被覆盖。 |\n| `a+` | 以读写模式打开；在末尾追加。 |\n\n例如，`fopen\
    \ (“otis.txt”, “wt+”)` 将尝试打开文件“otis.txt”。`fopen` 函数返回一个值（一个指针），用于访问该文件。\n\n##\
    \ ASCII 输出\n\n这意味着指的是人类可读的文件输出——其工作方式与 `printf` 完全相同，不同之处是打印到文件而不是屏幕。\n\n```c\n\
    #include <stdio.h>\n\nint main( )\n{\n    FILE *stream;\n    int i = 100;\n  \
    \  char c = 'C';\n    float f = 1.234;\n\n    /* 打开文件进行写入 */\n    stream = fopen(“otis.txt”,\
    \ “w”);\n\n    /* 将一些数据写入文件 */\n    fprintf(stream, “%d %c %f”, i, c, f);\n\n\
    \    /* 关闭文件 */\n    fclose(stream);\n}\n```\n\n程序的运行动作如下：\n1. 声明变量 `stream` 来存储用于访问文件的代码编号（实际上是指针）。\n\
    2. 声明一个 `int`、`char` 和 `float` 变量，并初始化它们。\n3. 打开文件进行写入并存储返回的代码编号（指针）。\n4. 将变量的值打印到变量\
    \ `stream` 中存储的代码编号对应的文件。\n5. 关闭文件。\n\n一旦运行了这个程序，你可以从命令行执行：\n`pi@raspberrypi:~>\
    \ cat otis.txt`\n这将会显示程序生成的文件内容：\n100 C 1.234\n\n如果你将 `fprintf` 语句改为：\n`fprintf(stream,\
    \ “%d\\n%c\\n%f\\n”, i, c, f);`\n重新编译并运行程序，你将在文件 **otis.txt** 中看到：\n100\nC\n1.234\n\
    \n## ASCII 输入\n\n可以从文件中读取数据，就像是从键盘输入的一样——这通过使用函数 `fscanf` 函数实现的——这个函数与 `scanf`\
    \ 非常相似——它只是期望从文件而不是键盘获取数据。考虑以下示例：\n\n```c\n#include <stdio.h>\n\nint main(void)\n\
    {\n    FILE *stream;\n    int i = 100;\n    char c = 'C';\n    float f = 1.234;\n\
    \n    /* 打开文件进行读取 */\n    stream = fopen(“otis.txt”, “r”);\n}\n```\n\n"
- fmt: "\n```c\n/* Check we have access to the file. */\n\nif (stream != NULL)\n{\n\
    \    /*OK, Read some data from the file */\n    fscanf(stream, “%d%c%f”, &i, &c,\
    \ &f);\n}\n\n/* close the file */\nfclose(stream);\n}\n```\n\nThe action of the\
    \ program is as follows:-\n\n1. Declare some variables - including one to hold\
    \ the file `stream`.\n2. Attempt to open the file for reading from. If the file\
    \ cannot be opened, `stream` will have a value of `0` (`NULL`).\n3. Check if the\
    \ file was opened correctly.\n4. Read the three data items from the file and into\
    \ the variables named `i`, `c` and `f`.\n5. Close the file and finish.\n\nThe\
    \ file would have to have data in it which matched what the `fscanf` was trying\
    \ to read in hence, a file which contained\n\n147 z 9.81\n\nOr\n\n147\nz\n\n9.81\n\
    \nwould be OK (each thing separated by space or New Line). Once the `fscanf` in\
    \ the program had executed, `i` would have a value `147`, `c` would hold the character\
    \ `z` and `f` would have the value `9.81`. However, if the file contained\n\n\
    z\n147\n9.81\n\nthings would get “messed up,” because the example `fscanf` was\
    \ expecting to see a number first - what it actually saw was a character, so the\
    \ variables would be set to the correct values.\n\n## Command Line Arguments\n\
    \nConsider the Linux command `cp`, it could actually be written as a C program\
    \ (as has been alluded to before when we were covering file / stream manipulation).\
    \ The pseudo code for it might be as follows:-\n\nCheck `>2nd File<` (destination)\
    \ is not same as first. If it is, quit immediately.\n\nOpen `>1st file<` - “source”\
    \ file.\n\n(***Someone missed out a line of pseudo code here)\n\nOpen destination\
    \ file.\nRepeat\n    Read chunk of source file.\n    Write chunk to destination\
    \ file.\nUntil (All source file has been read).\n\nWhen we run the program the\
    \ things marked like `>this<` are pieces of information which are on the Command\
    \ Line. They are `PARAMETERS` to the `copy` command - the names of the files to\
    \ be copied are supplied to the `copy` program as COMMAND LINE PARAMETERS. When\
    \ the `copy` program runs, it takes the 2 strings supplied on the command line\
    \ as being filenames. It then tries to open these files and actually do the copying.\n\
    \n(***The line of pseudo code which, years ago, was missed out in the original\
    \ design of the `cp` command was the one which checks the destination drive /\
    \ device to see if there is enough space to hold the destination file - if there\
    \ isn't, the program should IMMEDIATELY quit.)\n\nThe command line arguments to\
    \ copy are shown below:-\n\n`cp mavis.txt jack.txt`\n`^argument [0]` `^argument[1]`\
    \ `^argument[2]`\n\nIn fact, most terminal commands - which are programs in their\
    \ own right - take some form of command line argument.\n\n### Accessing Command\
    \ Line Arguments from a C program\n\nTo access command line arguments from a C\
    \ program is relatively straightforward. They are treated by a C program as a\
    \ set of strings - an array. The following C program demonstrates this.\n\n```c\n\
    /*\nThis is a program to demonstrate the use of command line arguments\n*/\n#include\
    \ <iostream.h>\n#include <conio.h>\n\n// We modify the declaration of “main” so\
    \ that we can access command line\n//parameters...\n/* The system organises them\
    \ in the following way:-\nString String Number\n+----------------+\n| Program\
    \ Name | 0\n+----------------+\n| | 1\n+----------------+\n| | 2\n+----------------+\
    \ .\n. . .\n. . .\n+----------------+ .\n| | no_of_strings (first parameter in\n\
    +----------------+ declaration of “main” below).\n*/\n//Note, the use of the “char\
    \ *” VERY important.\nint main(int no_of_strings, char *command_line_strings[])\n\
    {\nint i;\nprintf(“\\033[2J”); // A special command to Clear the console “screen”\
    \ area\n//Print out the name of our test program - this is held as the\n//first\
    \ string in the array:-\nprintf (“The program executable filename is: \\t”);\n\
    printf (“%s\\n\\n”, mmand_line_strings[0]);\nif (no_of_strings > 1)\n{\nprintf\
    \ (“Command line arguments are:\\n”);\n//Now we print out each of the command\
    \ line strings in turn.\nfor (i = 1; i < no_of_strings; i++)\n{\nprintf (“\\t%s\\\
    n”, command_line_strings[i]);\n}\n}\nelse\n{\nprintf (“No command line arguments\
    \ given.\\n”);\n}\n}\n```\n\nIt is fairly simple to “bolt together” the things\
    \ we used when accessing files to the above program to produce a new version of\
    \ the linux “cat” command (which just displays files on the screen). The program\
    \ for this is given below.\n\n```c\n/*\nThis is a program to demonstrate further\
    \ use of command line arguments\nand is a simple version of the Linux/Unix “cat”\
    \ command.\n*/\n#include <stdio.h>\n// We modify the declaration of “main” so\
    \ that we can access command line\n//parameters...\nint main(int no_of_strings,\
    \ char *command_line_strings[])\n{\nint i;\nchar line_store[81];\nFILE *file_to_type;\n\
    //Test the number of command line arguments which were supplied.\nif (no_of_strings\
    \ > 1)\n{\n//Now we use each of the command line strings in turn:-\nfor (i = 1;\
    \ i < no_of_strings; i++)\n{\nprintf (“Typing %s\\t\\n”, command_line_strings[i]);\n\
    /* Open the file. */\nfile_to_type = fopen (command_line_strings[i],”r”);\n//Check\
    \ we were able to access it\nif (file_to_type == 0)\n{\nfprintf (stderr, “***\
    \ Couldn't open %s\\n”, command_line_strings[i]);\n}\nelse\n{\n//Loop till the\
    \ end of the file. */\ndo\n{\n//Read a single line of the file into our buffer.\n\
    fgets(line_store,80,file_to_type);\n//Print the contents of the buffer on the\
    \ screen!\nprintf (“%s”,line_store);\n}\nwhile (!feof(file_to_type));\n// ^^^^\
    \ Continue until the end of the file is reached.\n//Close the file we have just\
    \ read.\nfclose (file_to_type);\n}\n}\n}\nelse\n{\nprintf (“No command line arguments\
    \ given.\\n”);\n}\n}\n```\n\nAs you can see, the above is a fairly short program\
    \ - it will even type a number of files one after another - you just need to supply\
    \ the names of the files you wish to type as command line parameters. If this\
    \ were compiled into a file called `newcat`, stored in the home folder, this can\
    \ be achieved by:\n\n`pi@raspberrypi:~./newtype .profile .bash_history`\n\nthis\
    \ will show the contents of `.profile .bash_history` (2 files created by the system).\n\
    \n**Note** - it is common to see the use of the names `argc` and `argv` in the\
    \ `main( )` declaration where `no_of_strings` and `command_line_strings` are used\
    \ in the example above. The only reason they are called this is that whoever wrote\
    \ the first 'C' program to access command line arguments referred to the parameters\
    \ in the `main` declaration by these rather obscure names. Because `main` is a\
    \ 'C' function like any other, we can give the parameters any name we like and\
    \ make them as readable as possible. `argc` and `argv` probably (!) stand for\
    \ “argument count” and “arguments vector”.\n\n## 'C Programming Style\n\nBecause\
    \ 'C' is a “free format” language, it is quite easy to just “bash in” code without\
    \ worrying about using a consistent or sensible layout, although most text editors\
    \ of any sophistication have some kind of auto-formatting function, to help with\
    \ layout. When writing programs, it is important to try and make them as readable\
    \ as possible. This can be done by following simple guidelines:-\n\n1. Use sensible\
    \ variable and function names with underscores for “spaces”. e.g. use a name `centigrade_value`\
    \ rather than `c` or `c_val`. Or, if you do not like using the underscore, use\
    \ capital letters in variable names e.g. `CentigradeValue`. Remember that 'C'\
    \ is case sensitive so get your capitals right!\n\n2. Space lines out well and\
    \ indent sensibly e.g. put\n\n`if (centigrade_value == 30)`\n`{`\n`printf (“Rather\
    \ Warm”);`\n`average_value += centigrade_value;`\n`}`\n\nrather than:\n\n`if (centigrade_value==30){printf(“Rather\
    \ warm”);average_value += centigrade_value;}`\n\n3. Use comments liberally and\
    \ sensibly and align them to the code they relate to e.g.\n\n`/* Read in the Centigrade\
    \ value. */`\n`scanf (“%d”, &centigrade_value);`\n\n4. At the top of each program\
    \ (before anything else), put a comment box saying what the program does, and\
    \ put in the date and name of the author. e.g.\n"
