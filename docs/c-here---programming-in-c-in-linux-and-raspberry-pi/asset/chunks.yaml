    \ 循环\n\n1. 编写一个程序，使用 `for` 循环读取 5 个数字并计算它们的平均值。\n2. 修改“平均值”程序，首先读取需要平均的数字个数 (!)。\n\
    3. 编写一个程序，从键盘读取四个数字并将它们存储在一个名为 `guess_digits` 的字符串中。将此文件保存为 `guess.c`。\n\n###\
    \ 循环与字符串\n\n1. 编写一个程序，读取单个单词并判断输入的是字母 \"E\" 还是 \"e\"提示：你需要使用循环检查每个字符。记住为你的字符串声明约\
    \ 80 个字符以容纳整行。你可以通过测试正在查看的字符是否为 `\\0` 或 0 来检查字符串的末尾）。\n2. 编写一个程序，读取一个字符串并统计其中的元音数量，打印元音个数。\n\
    \n### switch 语句\n\n1. 编写一个程序，提示并读取两个数字。这两个数字应该是：\n   (i) 1 到 13 之间的值，代表牌号（1 =\
