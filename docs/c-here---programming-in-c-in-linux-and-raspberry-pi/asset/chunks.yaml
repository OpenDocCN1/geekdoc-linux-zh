  trans: "\n\n或许任何计算机程序最重要的功能就是其做出决策的能力——即进行条件测试。在 'C' 语言中进行条件测试的方法与其他高级语言相似的。\n\n\
    ## 条件语句\n\n在 'C' 语言中有许多方法进行条件测试，但到目前为止常用的是“if..else”，如下所示。\n\n```c\nif (condition)\n\
    one line statement;\nelse\none line statement;\n```\n\n注意：与某些其他编程语言不同，这里假设了“THEN”，且该词没有包含在\
    \ `if` 语句中。\n\n`if .. else` 也可以采用略有不同的形式，使用“多行语句”。如下所示。\n\n```c\nif (condition)\n\
    {\nstatement 1;\nstatement 2;\n.\n.\nstatement n;\n}\nelse\n{\nstatement 1;\n\
    statement 2;\n.\n.\nstatement n;\n}\n```\n\n注意：相等性测试是使用 `==` 的，例如：\n\n```c\nif\
    \ (warp_factor == 10)\n{\n    printf (“The Engines can nae take it cap'n!!\\n”);\n\
    }\n```\n\n与其他语言一样，也可以测试“不等式”。可以使用以下符号，而在其他情况下本该使用 `==`（双等号）的地方：\n\n| 符号 | 含义 |\n\
    | :--- | :--- |\n| != | 不等于。 |\n| > | 大于。 |\n| >= | 大于或等于。 |\n| < | 小于。 |\n| <=\
    \ | 小于或等于。 |\n\n例如：\n\n```c\nif (i != 0)\n{\n    printf (“The number is non-zero.\\\
    n”);\n}\n```\n\n### 另一个示例\n\n假设我们想要检查电阻值是否大于 1000 欧姆，可以使用以下条件测试。\n\n```c\nif (resistance_value\
    \ > 1000)\n{\n    printf (“Value is over 1 kilohm.\\n”);\n}\n```\n\n为了同时测试多个条件，需要“AND”（和）和“OR”（或）关键字。在\
    \ 'C' 语言中，它们的表达式如下：\n\n- `&&` - 逻辑与。\n- `||` - 逻辑或。\n\n例如：\n\n```c\nif ((character\
    \ >= '0') && (character <= '9'))\n{\n    printf (“The character is a number. “);\n\
    }\n```\n\n### 条件测试的提示\n\n可以通过在条件前面放置一个 `!` 对条件测试进行取反，例如：\n\n```c\nif (!((i >=\
    \ 6) && (i <= 12)))\n{\n    printf (“Number is outside range 6 - 12”);\n}\n```\n\
    \n条件测试可能会变得非常复杂。为了保持它们清晰，遵循这些指南可能很有用：\n\n- 每个条件测试都应该括在（圆形）括号中。\n- 尽量坚持使用条件语句的多行形式。\n\
    - 始终对齐构成块开始和结束的大括号 `{ }`。\n- 如果条件测试变得复杂，请将其拆分到多行并合理地对齐。\n\n## 更复杂的条件测试 - “switch..case”\
    \ 语句\n\n考虑编写一个玩纸牌游戏的 'C' 程序的想法。假设你想以数字的形式打印牌牌值，对于 2 到 10 的牌牌，或者对于其他牌牌打印 A, J,\
    \ Q, K。如果我们假设一个名为 `card_value` 的 `int` 变量包含 1 到 13 之间的数字，我们可以在 'C' 语言中这样实现：\n\n\
    ```c\nif ((card_value >= 2) && (card_value <=10))\n    printf (“%d”, card_value);\n\
    else\n    if (card_value == 1)\n        printf (“A”);\nelse\n    if (card_value\
    \ == 11)\n        printf (“J”);\n    else\n        if (card_value == 12)\n   \
    \         printf (“Q”);\n    else\n            if (card_value == 13)\n       \
    \         printf (“K”);\n```\n\n正如我们看到的，这产生了一个相当大且笨拙的 `if` 语句集。如果我们想对每个 case 执行除了\
    \ `printf` 之外的操作，我们就必须对每个 `if` 使用 `{ }`，这使得整个事情变得更加麻烦。另一种示例的方法是……\n\n`switch..case`\
    \ 语句可以用于测试给定变量的多个离散值。其他语言往往单独使用 `Case` 语句。之前的示例可以重写为：\n\n```c\nswitch (card_value)\n\
    {\n    /* 控制变量 */\n    case 1:\n        printf (“A”);\n        break;\n    case\
    \ 11:\n        printf (“J”);\n        break;\n    case 12:\n        printf (“Q”);\n\
    \        break;\n    case 13:\n        printf (“K”);\n        break;\n    default:\n\
    \        printf (“%d”, card_value);\n        break;\n}\n```\n\n### 注意：\n\n1. `switch`\
    \ 语句根据控制变量的指定值执行指定的动作。\n2. 在每个动作之后，插入 `break;` 词以导致指令的执行在 `switch` 语句的 `}` 之后继续。如果不包含\
    \ `break`，执行将继续进入下一个 `case` 动作（这有时是有用的）。\n3. `default:` case 指定了当控制变量的值不在其他 case\
    \ 中列出的任何值时要采取的操作（这是可选的）。\n4. 可能会让人惊讶的是，每个 `case` 中的语句不需要包含在 `{ }` 中。（尽管包含在 `case`\
    \ 中的任何 `if`、`do...while`、`for` 语句将遵循正常规则。）\n\n### “switch..case”的局限性\n\n- 控制变量应该是\
    \ `int` 或 `char` 类型。\n- 被测试的值必须是常量——即你不能使用 `switch` 来测试一个变量相对于另一个变量的值。\n\n## 破解密码游戏\
    \ – 一些条件测试\n\n在我们的破解密码游戏中，我们需要进行一些测试。\n\n1. 检查猜测次数是否过多。\n2. 检查用户是否想再次玩或结束游戏。\n\
    3. 检查用户输入的代码是否与秘密代码中的任何数字匹配。\n\n“与秘密代码对比”步骤我们将留到以后，因为在可以轻松这样做之前，我们还需要学习更多。对于检查用户是否想继续游戏，我们可以这样做：\n\
    \n```c\nchar response;\nresponse=getch();\nif ((response==”y”) || (response==”Y”))\n\
    {\n    /*开始一个新游戏！*/\n}\nelse\n{\n    /*退出游戏 –结束程序！！ */\n}\n```\n\n但对于检查猜测次数，我们可以这样做：\n\
    \n```c\nint guess_counter = 0;\n/* 这里还有需要做/考虑的事情！ */\nguess_counter++;\n/* 我们允许猜测\
    \ 10 次\nif (guess_counter > 10)\n{\n    printf (“You have lost!”);\n}\nelse\n\
    {\n    /* 这里还有需要做/考虑的事情！ */\n}\n```\n\n我们将看到我们的最终代码与此略有不同，但“我们正在接近了”！\n\n# 循环\
    \ - 迭代\n\n程序中经常需要执行的操作之一是重复执行某些内容若干次。我们需要*迭代*。迭代有两种主要形式：\n\n1. 固定次数的迭代。\n2. 直到条件改变为止的迭代。\n\
    \n我们可以如下所示说明这些形式：\n\n### 1. 固定次数的迭代。\n\n将计数器初始化为最小值。\n\n开始\n\n执行某些指令。\n\n增加计数。\n\
    \n测试计数是否大于最大值。\n\n如果否-跳转到开始\n\n如果是-跳转到结束\n\n结束\n\n注意：计数也可以初始化为最大值并减少到最小值。\n\n\
    ### 2. 直到条件改变为止的迭代。\n\n开始\n\n执行某些指令（这些会影响*条件*）。\n\n测试条件。\n\n*条件*为真吗？\n\n否-跳转到开始\n\
    \n是-跳转到结束\n\n结束\n\n注意：如果迭代是“有限的”（即在某处结束），则执行的指令必须以某种方式影响条件。\n\n### 其他语言\n\n其他编程语言具有类型\
    \ (1) 和 (2) 迭代的结构。形式 (1) 在 BASIC 中表示为 `FOR...NEXT`。在 BASIC 和某些其他语言中，(2) 是 `REPEAT\
    \ ... UNTIL` 语句的形式。我们现在来看 'C' 语言的等效写法。\n\n## 迭代形式 (1) - “for” 循环\n\n它具有通形式：\n\n\
    初始化 继续 迭代\n\n表达式. 条件表达式.\n\n```c\nfor ( i=0; i < 10; i++ )\n    printf (“Spectrum\
    \ is green!\\n”);\n```\n\n示例的操作如下：\n\n1. “循环控制变量” `i`（必须像其他其他数据项一样声明）设置为零。\n2.\
    \ 测试条件 `i < 10`，且结果为真。\n3. 执行 `printf`。\n4. `i` 增加 1。\n5. 重复步骤 2-4，直到 `i` 达到 10。\n\
    \n注意：只有当继续条件为真时，循环才会继续执行。\n\n### 更高级的 “for” 循环\n\n`for` 语句的所有部分都可以包含多个部分，例如：假设\
    \ `i`、`j`、`k` 已声明为 `int`：\n\n"
- fmt: "\n```c\nfor (i=0, j=0; (j<=9) || (k != 1); i+=2, j++)\n{\n    <statements>\n\
    }\n```\nIn the above example, `i` & `j` are both initialised to zero, the Continuation\
    \ Condition is evaluated (and is TRUE), the `<statements>` are executed, `i` is\
    \ increased by 2 and `j` by 1. The loop terminates when `j` reaches 10, or when\
    \ a 3rd variable, “k” gets set to 1 (happens somewhere in “<statements>“).\n\n\
    ### NOTES:\n\n1. With “for” statements, it is possible that the code inside the\
    \ loop may never be executed (if the continuation condition always evaluates to\
    \ FALSE).\n2. All parts inside the `( )` of a “for” statement are `optional`,\
    \ in other words this\n\n```c\nfor ( ; ; ; )\n{\n}\n```\n\nis a legal piece of\
    \ code - it represents an infinite loop (some times useful in “control” type programs).\n\
    \n## Iteration Form (2) Do...While\n\nThis is very similar in form to the `REPEAT...UNTIL`\
    \ statements used in BASIC and similar languages. e.g.\n\n```c\ni=0;\ndo\n{\n\
    \    printf (“Spectrum is green!\\n”);\n    i++;\n}\nwhile (i<10);\n```\nThe action\
    \ of the program is as follows:-\n\n1. The “loop control variable”, `i`, (which\
    \ must be declared as any other data item) is set to zero.\n2. The `printf` is\
    \ done.\n3. `i` is incremented by 1.\n4. The condition `i < 10` is tested, and\
    \ evaluates to TRUE.\n5. Steps 2-4 are repeated until `i` reaches 10.\n\nThe only\
    \ effective difference in operation to the “for” loop is that the condition is\
    \ tested AFTER the action (rather than BEFORE).\n\nMORE NOTES:\n\n1. The code\
    \ inside the “do” loop always executes at least once.\n2. The main difference\
    \ to `REPEAT..UNTIL` is that the condition tested is the `Continuation` condition\
    \ (not the `Termination` condition).\n\n### Iteration Form (2) - “Reprise” - “While..”\n\
    \nThere is a second form using “while”, which is used in situations where you\
    \ wish to test a condition BEFORE an action:-\n\n```c\ni = 0;\nwhile (i < 10)\n\
    {\n    printf (“Spectrum is green\\n”);\n    i++;\n}\n```\n1. The “loop control\
    \ variable”, `i`, (which must be declared as any other data item) is set to zero.\n\
    2. The condition `i < 10` is tested, and evaluates to TRUE.\n3. The `printf` is\
    \ done.\n4. `i` is incremented by 1.\n5. Steps 2-4 are repeated until `i` reaches\
    \ 10.\n\nNOTE: The action here is identical to that of the “for” loop, except\
    \ we initialise `i` outside the loop. This form can be used wherever a “for” loop\
    \ seems a bit Over-The-Top.\n\n### Iteration Summary\n\nAs we have seen, there\
    \ are three “looping” or “iteration” constructs in `C`. Examples are shown below\n\
    \n```c\nfor (i = 0; i < 10; i++)\n{\n    <statements>\n}\n```\n------------------------------------------------\n\
    \n```c\ndo\n{\n    <statements>\n}\nwhile (<condition TRUE>);\n```\n------------------------------------------------\n\
    \n```c\nwhile (<condition TRUE>)\n{\n    <statements>\n}\n```\nNOTE: Watch for\
    \ the differing use of the semi-colon with the “while” statement.\n\nThey are\
    \ each quite flexible, and which one you use may depend on personal choice, although\
    \ you should consider whether your iteration must be carried out at least once.\
    \ (In which case choose “do..while”).\n\n## Codecracker Game – Using Loops\n\n\
    We can now revise our earlier code to include a loop for each guess and also a\
    \ loop for the whole game. It will look like this:\n\n```c\n/* Start a loop in\
    \ which we will play the game. */\ndo\n{\n    /*Stuff will be added here later.\n\
    \    /* Now loop for 10 guesses. */\n    for (guess_no=1; guess_no <= MAX_GUESSES;\
    \ guess_no++)\n    {\n        /* TO DO */\n        /* Read in the guess - pass\
    \ the current guess number. */\n        /* TO DO */\n        /* Mark the guess.\
    \ */\n        /* If we guessed correctly, break out of the \"for\" loop. */\n\
    \        if (guess_correct == 1)\n        {\n            break;\n        }\n \
    \   }\n    /* When we get to here, we will either have run out of goes, or\n \
    \   \"guess_correct\" will have been set to 1 - the guess has been\n    marked\
    \ and found to be correct. */\n    /* Check if we guessed it! */\n    if (guess_correct\
    \ == 1)\n    {\n        printf (\"*** You Win! ***\");\n    }\n    else\n    {\n\
    \        printf (\"*** You have failed! ***\");\n    }\n    /* Stuff to Add here!*/\n\
    \    /* Now ask if the user wants another game. */\n    printf (\"Another Game\
    \ (enter Y or N)?\");\n    response_entered = getch();\n    /* Use \"toupper\"\
    \ to convert it to upper case. */\n    if (toupper(response_entered) == 'Y')\n\
    \    {\n        continue_game = 1;\n    }\n    else\n    {\n        continue_game\
    \ = 0;\n    }\n}\nwhile (continue_game == 1);\n```\nNote the use to `toupper`\
    \ which converts the character to Upper Case, before we check it.\n\n## “break”\
    \ AND “continue”\n\n### “break”\n\nCan be used to break out of a loop when some\
    \ condition occurs. Consider the following example:-\n\n```c\nfor (i = 0; i <\
    \ 20; i++)\n{\n    if (array[i] == 0)\n        break;\n    array[i] = 1/array[i];\n\
    }\n```\nIf an array element with a zero value is found, the for loop is terminated\
    \ (the `break` is executed), and execution of the program continues at the end\
    \ of the “for” loop.\n\n### “continue”\n\nCauses control to pass to the end of\
    \ the innermost enclosing while, do, or for statement, at which point the loop\
    \ continuation condition is re-evaluated.\n\nExample:\n\n```c\nfor (i = 0; i <\
    \ 20; i++)\n{\n    if (array[i] == 0)\n        continue;\n    array[i] = 1/array[i];\n\
    }\n```\nIf the array element had a value of 0, the division by 0 would *not* be\
    \ done.\n\n# Functions\n\nUp until now, all the examples we looked at have been\
    \ small and more self contained. One of the things about Computer Programs is\
    \ that normally, they grow - and grow - grow. If we always tried to do as we have\
    \ done we would end up in a dreadful mess. Initially, in considering the problem\
    \ of writing a program, we said we had to break up into subroutines.\n\n### Subroutines\n\
    \nAlmost all programming languages have ways of defining subroutines or *procedures*\
    \ or *functions* - these are like small contained programs which we *call* from\
    \ “main”. Subroutines would normally do one job each - e.g. set up the screen\
    \ or display a menu. For programs which are more than 100 lines long, it is very\
    \ important to try and consider how to break a program into subroutines. This\
    \ is called “structured programming”.\n\nIn 'C', subroutines are called “functions”.\
    \ An example of how they are specified in 'C' is given below.\n\n```c\n/* Define\
    \ a function to print a line of stars. */\nvoid stars()\n{\n    char some_stars[]\
    \ = “**********”;\n    printf (“%s\\n”, some_stars);\n}\n\n/* Define a function\
    \ to print a different line of stars. */\nvoid edge_stars()\n{\n    printf (“*\
    \ *\\n”);\n}\n\nint main ()\n{\n    //A special command to Clear the console “screen”\
    \ area\n    printf(“033[2J”);\n\n    /* Call the “stars” function. */\n    stars();\n\
    \n    /* Call the “edge_stars” function 3 times. */\n    edge_stars();\n    edge_stars();\n\
    \    edge_stars();\n\n    /* Call the “stars” function a 2nd time. */\n    stars();\n\
    }\n```\n\n### Program Notes\n\n1. We define 2 functions called `stars` and `edge\
    \ stars`.\n2. the functions just print out some asterisks.\n3. We call the 2 functions\
    \ repeatedly from the “main” program to produce the following output:-\n\n| **********\
    \ | <-- stars |\n| * * | <-- edge_stars |\n| * * | <-- edge_stars |\n| * * | <--\
    \ edge_stars |\n| ********** | <-- stars |\n\n1. The function “stars” declares\
    \ its own data - **this data cannot be accessed from “main”**. i.e. if we were\
    \ to add the line\n\nprintf (“%s”, some_stars);\n\nanywhere inside “main”, this\
    \ would not work - *the program would not even compile. Why?*\n\n## Subroutines\
    \ and “Local Data”\n\nAs we already mentioned, subrout are like programs in their\
    \ own right. As such, any data (variables) declared in a function can not be used\
    \ by other functions, unless we take explicit action make this so.\n"
