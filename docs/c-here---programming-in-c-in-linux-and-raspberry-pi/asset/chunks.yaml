    ![](img/cover.jpeg)


    # C 语言：在 Linux 和树莓派上的 C 语言入门

    作者：Andrew Johnson


    ## 献言

    本指南献给所有让本书出版成为可能的人——从我的家人到多年来指导和教我的老师、导师和良师。此外，我们还应该感谢许多无私和奉献的开发者、工程师和“极客”，他们帮助实现了在这一所谓的
    21 世纪中我们生活中发挥着如此巨大作用的软件技术……


    ## 作者简介

    ![Image](img/00001.jpeg)

    Andrew Johnson 出于英国约克郡，并于 1986 年毕业于兰卡斯特大学，获得计算机科学与物理学学位。之后，他主要电信、过程控制和嵌入式系统领域从事了约
    20 年的软件工程工作。他还全职或兼职从事教学、辅导和评估（成人教育领域）。


    自 2012 年以来，他一直关注树莓派的发展，并参与了两个小型个人树莓派项目——一个飞机追踪器和一个基于 `Python` 的简单媒体亭机项目。


    在空闲时间里，他广泛研究了许多“替代知识”话题，并在他的网站上发表过——[www.checktheevidence.com](http://www.checktheevidence.com)。你可以通过该网站或通过
    ad.johnson2211@gmail.com 与他联系。


    # 引言

    本指南尝试向初级程序员介绍“C”编程语言。某些读者可能对 `Java`、`Javascript`、`PHP` 甚至 `C#` 更熟悉——这些语言都有许多关键字和语法特征，似乎是借用或衍生自
    `C` 的。（顺带提一下，这些语言的编译器和解释器最初可能是用 `C` 或 `C++` 编写的。）


    你会发现这些示例易于理解。当我最初将本指南中的内容作为为期 10 周的晚间课程（即约 20 小时的学习和实践）进行授授时，反非常好，帮助了许多人第一次学习编程，尽管
    `C` 通常不被认为是初学者编程语言。


    本指南不会教你关于 `C` 编程所需的所有知识，也不会教你通用的编程。它同样不会教你关于 `Linux` 或树莓派的所有知识。它几乎完全致力于教你**C 语言的基础知识，并将
    `Linux` 和/或 `树莓派` 作为学习这些知识的平台。** 本指南没有涉及 `C` 语言更高级的特性，也没有过多讨论系统编程。然而，它确实讨论了 `C`
    中指针的使用。


    当你读到这里时，一本配套指南**高级 C 编程** 应该已经出版了。（这将涵盖 `C` 结构的使用、更高级的指针用法、位和字节级访问、二进制文件访问以及动态内存分配等主题。）


    ## ''C'' 语言简介

    “C”语言在 20 世纪 80 年代“声名鹊起”，从从最小的微处理器系统到最大的主机和超级计算机。这种语言的流行可能源于它的灵活性以及对底层特性的易访问性，这可以让你对主机系统拥有巨大的控制力。


    它是一种相当奇的语言，可能非常晦涩（看看这个例子 - [`bit.ly/2qAkPVH`](http://bit.ly/2qAkPVH)），也许因为它仍然保持着一些原始的底层外观。对于没有经验的程序员来说，这里有很多陷阱——本指南试图突出其中的一些陷阱。然而，一旦掌握，“C”语言在高级语言和低级语言之间提供了一个恰恰的折中方案。自千禧年以来，`C`
    可以说经历了某种“复兴”，这源于 `Linux` 在许多计算平台上的采纳和使用增加，以及先进免费开源 `C` 编译器及相关开发环境的广泛可用，我们将在指南中使用其中一个（“Codeblocks”）。


    对于潜在的 `C++` 程序员来说，学习原始的 `C` 语言可能不是一个坏主意，因为 `C++` 的大部分基础知识与 `C` 相同。


    ### C 的应用

    它被专业人士和爱好者使用。它是一种通用语言——用于微处理器软件、设备驱动程序、早期操作系统、应用软件和游戏的开发！它最常用的方式是通过编译器，尽管最近几年至少有一个
    `C` 解释器（`Ch`）问世了。


    在编程中严肃且持续地使用 `C` 将迫使你学习更多关于计算机本质以及你正在使用的操作系统的知识。使用 `C` 时，你在编写程序时通常被迫以“较低的机器级别”思考。在更现代的编程语言中，许多底层活动隐藏在运行时库或“导入模块”中。而在
    `C` 中，大多数情况下你处于系统的“最前沿”。


    ## ''C'' 的历史

    `UNIX` 操作系统与 `C` 编程语言并行开发。现在，`Linux` 的开发是为了 `UNIX` 的工作克隆，因此 `C` 基本上可以被视为 `Linux`
    的“原生”编程语言。


    ''C'' 起于一种名为 `BCPL` 的语言，该语言引入于 20 世纪 60 年。在此基础上开发了名为 ''B'' 的语言，随后''C'' 由 Dennis
    Kernighan 于 1972 年在贝尔实验室编写。随后在 20 世纪 70 年代''C'' 变得更加广泛使用，该语言历史上的一个重要里程碑是 1978
    年，Brian Kernighan 和 Dennis Ritchie 出版了《C 语言参考手册》。这最终成为了该语言的公认标准，但并非官方标准。


    到 1988 年，这种语言的使用非常广泛，以至于 ANSI 为该语言制定了一个标准——很大程度上基于 Kernighan 和 Ritchie 的参考手册第二版。所有据称符合
    ANSI 标准的 ''C'' 编译器都遵循了 ANSI 在 1988 年制定的标准。


    ## ''C'' 的哲学

    ''C'' 的哲学始终是*“程序员知道自己在做什么”*，对于粗心的程序员，很少有保护措施。这种语言的态度与 BASIC 或一些复杂的现代语言（如 `Java`、`Python`
    和 `C#`）大不同。它允许你编写非法且毫无意义的代码。它的语法和类型检查很弱，尽管现代编译器的默认设置执行了更严格的编程选项。`C` 的主要优势在于你拥有巨大的灵活性，例如，与其他语言相比，对机器硬件的访问通常非常简单。此外，''C''
    编译器可以生成紧凑且优化良好的代码，这对于小型应用程序非常理想，对于大型应用程序也有用，因为你只需要从系统中“多榨取一点性能”。时间敏感的应用通常仍从使用
    `C` 编码中受益，不仅是因为编译后的代码运行速度比解释型代码快数百倍，还因为 `C` 程序通常可以“绕过”某些损害程序/应用程序性能的操作系统特性。


    # 如何使用本指南

    1) **你需要一台能够运行大约 2012 年以后版本的 `Linux` 的设备。我将引用 `Ubuntu` 和 `Raspbian` 版本的 `Linux`，它们都是
    `Debian` 的衍生版本。**

    2) **你需要知道如何在 `Linux` 的终端窗口或通过命令行使用命令，以及使用软件中心（Ubuntu）、App Grid 或其他基于 GUI 或命令行的应用程序安装程序（如“apt-get”）来安装
    `Linux` 应用。**


    ## 使用 Windows 或 Mac 系统学习 C 语言


