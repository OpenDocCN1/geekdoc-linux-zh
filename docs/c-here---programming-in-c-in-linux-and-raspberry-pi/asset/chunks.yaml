    \n我们可以对'C' 程序中的数据进行类似的操作 —— 我们可以将数据声明在一个所有函数都能看到的地方。我们通过将数据声明放在所有函数的外部来实现这一点。\n\
    \n```c\nchar some_text[ ]=\"This can be accessed by all functions.”;\n\nvoid print_the_text(\
    \ )\n{\n    printf (“Printing from the function...”);\n    printf (some_text);\n\
    }\n\nint main ( )\n{\n    printf (“Printing from 'Main'“);\n    printf (some_text);\n\
    \    print_the_text( );\n}\n```\n\n这种方式（即在所有函数外部）声明的所有函数可访问的数据被称为全局数据（Global Data）。\n\
    \n## 带参数的函数\n\n### 将数据传递给函数\n\n将数据传递给过程是很常见的，例如将摄氏度值传递给函数，让它打印出华氏度。下面的示例定义了一个名为\
    \ `c_to_f` 的新'C' 函数，它接收一个摄氏度值并打印华氏度值。\n\n类型参数（也称为 `argument`）\n\n/*\n类型参数 类型，参数\
    \ (`argument`)\n*/\n\n```c\nvoid c_to_f (int degrees_c)\n{\n    printf (“%d Degrees\
    \ C = %d degrees F”,\n    degrees_c, ((degrees_c * 9) / 5) + 32);\n}\n\nint main\
    \ ( )\n{      \n    c_to_f (20);\n    c_to_f (25);\n}\n```\n\n### 程序说明\n\n1. 我们定义了一个类型为\
    \ `void` 的'C' 函数（见后文）。\n2. 我们指定它将接受一个整数整数值作为参数。\n3. 我们编写了该函数，使其只打印转换后的值。\n4. 我们在主程序中调用了两次函数，使用了稍微不同的值。\n\
    \n## 从函数返回数值\n\n将某些值传递给函数通常非常有用，函数随后以某种方式“处理”这些值，然后*返回*一个值到主程序。我们可以稍微重写上一个程序来实现这一点：\n\
    \n返回值类型，参数类型，参数 (`argument`)\n\n```c\nint c_to_f (int degrees_c)\n{\n    int degrees_f;\n\
    \    degrees_f = ((degrees_c * 9) / 5) + 32;\n    return (degrees_f);\n}\n\nint\
    \ main( )\n{\n    printf (“%d degrees C = %d degrees f \\n”,\n    20, c_to_f(20));\n\
    \    printf (“%d degrees C = %d degrees f \\n”,\n    25, c_to_f(25));\n}\n```\n\
    \n### 程序说明\n\n1. 函数的定义方式与上一个示例相同，*除了*它被定义为向主程序`return`一个值。\n2. 函数直接*在* `printf`\
    \ 语句内部被调用了两次（因为我们定义了函数会返回一个值，因此可以在与变量或常量*完全*相同的地方对其进行引用，这是'C'函数的一个非常强大的特性）。\n\n\
    ## 使用函数\n\n'C' 函数因此分为两大主类：\n\n1. 返回值的函数，即被定义为某种*类型*的函数。\n2. 不返回值的函数，即被定义为 `void`\
    \ 类型（无类型）。\n\n**因此，在编写函数时，你应该决定是否希望它将一个值返回到调用它的地方。**\n\n如果你在定义函数时*完全没有*指定任何类型（即省略“void”），编译器将假设该函数的类型为\
    \ `int`。\n\n## 在函数被定义之前调用函数\n\n考虑以下示例：\n\n```c\nvoid function_a( )\n{\n    printf\
    \ (“Function A, now calling function B...\\n”);\n    function_b( );\n}\n\nvoid\
    \ function_b( )\n{\n    printf (“Function B called.\\n”);\n}\n\nint main ( )\n\
    {\n    function_a( );\n}\n```\n\n在这个示例程序中，我们尝试从函数 `A` 内部调用函数 `B`。这个想法没有问题，但示例程序将无法编译。原因是当编译器在函数\
    \ `A` 中看到对函数 `B` 的调用时，它还没有定义，因此它假设 `B` 是一个类型为“int”的函数。随后，它看到了函数 `B` 的定义 —— 它的类型是“void”。这与已经假设的函数\
    \ `B` 类型“int”不一致，因此编译器生成了错误信息。我们可以通过以下方式解决这个问题：\n\n```c\nvoid function_b(void);\
    \ /* 函数 B 的预声明或*“原型”* */\nvoid function_a( )\n{\n    printf (“Function A, now\
    \ calling function B...\\n”);\n    function_b( );\n}\n\nvoid function_b( )\n{\n\
    \    printf (“Function B called.\\n”);\n}\n\nint main ( )\n{\n    function_a(\
    \ );\n}\n```\n\n这与之前的程序完全相同，只是我们告诉了编译器函数 `B` 将是“void”类型。这被称为预声明或原型。你可以直接将函数 `B`\
    \ 的整个定义放在函数 `A` 之前，但这并不总是方便。**函数的预声明还应该包含函数使用的任何参数的类型：****\n\n我们现在将 `function_b`\
    \ 使其包含一个整数作为参数：\n\n```c\nvoid function_b(int);/* 函数 B 的预声明 */\n/* B 将接受一个 “int”（整数）参数。\
    \ */\nvoid function_a( )\n{\n    printf (“Function A, now calling function B...\\\
    n”);\n    function_b(99);\n}\n\nvoid function_b(int any_number)\n{\n    printf\
    \ (“Function B called with %d.\\n”, any_number);\n}\n\nint main( )\n{\n    function_a(\
    \ );\n}\n```\n\n预声明*必须*与实际函数声明在**名称、类型以及参数的数量和类型**上一致。\n\n## Codecracker 游戏 -\
    \ 需要的函数\n\n现在我们已经学习了函数，可以重新考虑原始流程图，并开发使游戏运行所需的函数。这个列表应该涵盖了我们需要的内容！\n\n```c\n/*\
    \ 函数预声明 */\nvoid draw_board(void);\nvoid generate_code(void);\nvoid read_in_guess(int\
    \ guess_number);\nvoid display_guess_on_board(int guess_number);\nint mark_guess(int\
    \ guess_number);\n```\n\n### 作为参数传递的值\n\n* 我们不需要向 `generate_code` 或 `draw_board`\
    \ 传递任何值 —— 它们不需要任何额外信息就可以完成它们的工作。\n* 我们将当前的猜测数字（计数）传递给 `read_in_guess` 函数，以便它可以向用户显示消息，告诉他们当前正处于哪一次猜测。\n\
    * 我们将当前的猜测数字（计数）传递给 `display_guess_on_board` 函数，以便它“知道”在板的什么位置放置猜测。\n* 我们将当前的猜测数字（计数）传递给\
    \ `mark_guess` 函数，以便它“知道”在板的什么位置放置标记。\n\n### 返回值\n\n* 前 4 个函数不需要返回传递的值。\n* `mark_guess`\
    \ 函数将返回一个值，告诉我们猜测是否 100% 正，这样我们就知道游戏是否结束，并可以告诉用户。\n\n# 标准 'C' 函数\n\n我们查看了如何定义自己的函数并向它们传递“参数”。'C'\
    \ 变得流行的原因之一是所谓的“库函数”。有数千个库函数，它们大致分为三大类：\n\n* “标准”C 函数 (ANSI)。\n* “UNIX”兼容函数。\n\
    * “依赖系统”的函数。\n\n前两组之间存在重叠。如果你想让你的程序具有“可移植性”（即可以在不同类型的计算机上编译和运行），你应该只使用来自前两组的函数。\n\
    \n我们已经使用了几个库函数 - **printf,** **scanf,** **clrscr** 和 **getch**。这些属于另一类通用函数，称为“输入/输出”函数。\n\
    \n## 头文件或 “.h” 文件\n\n"
