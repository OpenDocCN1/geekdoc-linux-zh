  }\n```\n\n# 附录 1 – 代码破解器程序列表\n\n这是数独游戏（Mastermind Game）的完成版列表。你可以在 [`chereprogramming.blogspot.co.uk/`](http://chereprogramming.blogspot.co.uk/)\
  \ 或 [`bit.ly/2pZLbOQ`](http://bit.ly/2pZLbOQ) 找到副本。\n\n除了其他之外，它也是良好编程风格的示例。因此，我希望代码中的注释能够对程序的工作原理提供足够的解释。\n\
  \n改进程序和编写代码的方法有很多。请记住，它是作为一种学习练习呈现的，并不是最好、最完整或最优化的代码列表。此外，它可以被拆分为 2 或 3 个模块。这种“拆分”是`高级\
  \ C 编程指南`中涵盖的主题之一。\n\n```c\n/****************************************************************************\n\
  * 文件: masterrmind.c\n* 日期: 13.05.2017\n* 作者: A.D. Johnson\n* 版本: 1.0\n* 描述: 运行“数独”游戏。使用了（几乎所有的）标准\n\
  * `C` ，因此应该能到其他系统。\n*\n*****************************************************************************/\n\
  ```\n\n```c\n/****************************************************************************\n\
  这是一个设置数字序列的游戏——“代码”（通常由\n人类设置，但我们将让计算机来完成），“破译者”尝试\n尽可能快地猜出代码。他通过将它们放在棋板上来猜测。“代码设置者”随后将根据某些规则对猜测进行“标记”：-\n\
  如果猜测中的某个数字也在代码中，但\n它位于一个**不同的**位置，则获得一个白色棋子。\n如果猜测中的某个数字也在代码中，但\n它位于**相同的**位置，则获得一个黑色棋子。\n\
  每个正确的数字只会被授予一个白色或黑色棋子。\n示例\n如果代码是“1234”，而猜测是“4255”，则将获得一个黑色棋子（针对“2”）\n以及一个白色棋子（针对“4”）。\n\
  ******************************************************************************/\n\
  ```\n\n```c\n#include <stdio.h> /* 标准输入/输出 - printf, scanf 等等. */\n#include <string.h>\
  \ /* strcpy, strcmp. */\n#include <stdlib.h> /* rand() 和 srand() */\n#include <ctype.h>\
  \ /* toupper */\n#include <time.h> /* 用于 time 函数 */\n#include <termios.h> /* Linux\
  \ 系统 */\n\n#define MAX_GUESSES 10\n\n/* 全局数据 - 猜测和代码。 */\nchar guess_digits[5];\n\
  char code_digits[5];\n\n/* 函数声明。 */\nvoid draw_board(void);\nvoid generate_code(void);\n\
  void read_in(int);\nvoid display_guess_on_board(int);\nint mark_guess(int);\n```\n\
  \n```c\n/*****************************************\n* 函数: gotoxy\n* 参数: 列 - X, 行\
  \ - Y\n* 描述: 移动到指定的屏幕/窗口\n*\n* 返回值: 无\n**************************************************/\n\
  void gotoxy(int x, int y)\n{\n  // 使用 ANSI 转义序列将光标\n  // 移动到窗口的某个位置。\n  printf(\"\
  \\033[%d;%dH\", y, x);\n}\n```\n\n```c\n/*****************************************\n\
  * 函数: clrscr\n* 参数: 无\n* 描述: 清除屏幕区域\n*\n* 返回值: 无\n**************************************************/\n\
  void clrscr()\n{\n  // 使用 ANSI 转义序列清除\n  // 终端视图部分。\n}\n  printf(\"\\033c\");\n\
  }\n```\n\n```c\n/*****************************************\n* 函数: getch()\n* 参数:\
  \ 无\n* 描述: 等待按下单个键，而不是需要\n按下“回车”或“返回”——因此需要这些技巧\n* 返回值: 按下的键码。\n**************************************************/\n\
  char getch()\n{\n  int c=0;\n  struct termios org_opts, new_opts;\n  int res=0;\n\
  \  //----- 将旧设置存储在结构体中 -----------\n  res=tcgetattr(fileno(stdin), &org_opts);\n\
  \  // 保留副本：\n  new_opts = org_opts;\n  // 更新感兴趣的位\n  new_opts.c_lflag &= ~(ICANON\
  \ | ECHO | ECHOE | ECHOK | ECHONL | ECHRT | ECHOKE | ICRNL);\n  // 将设置放入系统。\n  tcsetattr(fileno(stdin),\
  \ TCSANOW, &new_opts);\n  // 检查键\n  c=getchar();\n  //------ 恢复旧设置 ---------\n \
  \ res=tcsetattr(fileno(stdin), TCSANOW, &org_opts);\n  //assert(res==0);\n  return(c);\n\
  }\n```\n\n```c\n/*****************************************\n* 函数: main\n* 参数: 无\n\
  * 描述: 程序的主入口\n* 返回值: 无。\n**************************************************/\nint\
  \ main()\n{\n  /* \"main\" 的数据。 */\n  int continue_game,guess_no,guess_correct;\n\
  \  char response_entered;\n  /* 启动一个我们在其中游戏的循环。 */\n  do\n{\n    /* 清除屏幕。 */\n \
  \   clrscr();\n    /* 调用绘制棋板的函数。 */\n    draw_board();\n\n\n\n\n\n```c\n/* 生成代码\
  \ - 在 \"code_digits\" 中。 */\n\ngenerate_code();\n\n/* 现在循环 10 次猜测。 */\nfor (guess_no=1;\
  \ guess_no <= MAX_GUESSES; guess_no++)\n{\n    /* 读取猜测 - 传递当前的猜测数字。 */\n    read_in_guess(guess_no);\n\
  \n    /* 将猜测放在看板上。 */\n    display_guess_on_board(guess_no);\n\n    /* 标记猜测。 */\n\
  \    guess_correct = mark_guess(guess_no);\n\n    /* 如果我们猜对了，跳出 \"for\" 循环。 */\n\
  \    if (guess_correct == 1)\n    {\n        break;\n    }\n}\n\n/* 当运行到这里时，要么是机会用完了，要么\n\
  \   \"guess_correct\" 被设置为 1 - 意味着猜测被\n   标记并被发现是正确的。 */\n/* 移动光标准备打印游戏结果。 */\n\
  gotoxy(30,7);\n\n/* 检查我们是否猜中了！ */\nif (guess_correct == 1)\n{\n    printf (\"***\
  \ You Win! ***\");\n}\nelse\n{\n    printf (\"*** You have failed! ***\");\n}\n\
  gotoxy (30,9);\n\n/* 打印代码。 */\nprintf (\"The code was %s...\", code_digits);\n\n\
  /* 现在询问用户是否想玩另一局。 */\nprintf (\"Another Game (enter Y or N)?\");\nresponse_entered\
  \ = getch();\n\n/* 使用 \"toupper\" 将其转换为大写字母。 */\nif (toupper(response_entered) ==\
  \ 'Y')\n{\n    continue_game = 1;\n}\nelse\n{\n    continue_game = 0;\n}\n}\nwhile\
  \ (continue_game == 1);\n\n/* 打印结束消息... */\ngotoxy (30,11);\nprintf (\"*** Bye bye...\
  \ ***\\n\\n\");\n}\n\n/*************************************************************************\n\
  * 函数: draw_board\n* 参数: 无\n* : 用 ASCII 字符绘制看板的表示\n* 返回: 无。\n**************************************************************************/\n\
  void draw_board(void)\n{\n    int i;\n    char board_end[] = \"+----+----+\\n\"\
  ;\n    char board_middle[]= \"| | |\\n\";\n    /* 设置屏幕位置到左上角。 */\n    gotoxy(0,0);\n\
  \n    /* 打印看板。 */\n    printf (\"%s\",board_end);\n    for (i=0; i < MAX_GUESSES;\
  \ i++)\n    {\n        printf (\"%s\",board_middle);\n    }\n    printf (\"%s\"\
  ,board_end);\n\n    /* 打印标题。 */\n    gotoxy(30, 1);\n    printf (\" * * * M A S\
  \ T E R M I N D * * *\");\n}\n\n/*************************************************************************\n\
  * 函数: generate_code\n* 参数: 无\n* : 将一个随机代码放入 \"code_digits\" 字符数组中\n* 返回: 无。\n**************************************************************************/\n\
  void generate_code(void)\n{\n    int the_code;\n    /* 设置随机数生成器以提供一个真正的随机值。 */\n\
  \    srand (time(NULL));\n    /* 获取一个 4 位随机数。 */\n    the_code = rand() % 10000;\n\
  \    /* 将此数字放入字符串中，采用正确的格式。 */\n    sprintf (code_digits, \"%04d\", the_code);\n\
  }\n\n/*************************************************************************\n\
  * 函数: read_in_guess\n* 参数: 游戏中的猜测数字\n* : 从键盘读取猜测。\n* 返回: 无。\n**************************************************************************/\n\
  void read_in_guess(int guess_no)\n{\n    int i;\n    char key_entered;\n    /* 将光标移回正确的位置。\
  \ */\n    gotoxy(30,4);\n    /* 打印提示符。 */\n    printf (\"Enter guess %d: \\b\\b\\\
  b\\b\", guess_no);\n    /* 读取 4 位数字。 */\n    for (i=0; i < 4; i++)\n    {\n    \
  \    do\n        {\n            /* 获取按下的键。 */\n            key_entered = getch();\n\
  \        }\n        /* 检查按下的键，如果无效则循环。 */\n        while ((key_entered < '0') ||\
  \ (key_entered > '9'));\n        /* 打印按下的键。 */\n        printf (\"%c\", key_entered);\n\
  \        /* 将键放入猜测数组的正确位置 - \"i\"。 */\n        guess_digits[i] = key_entered;\n\
  \    }\n    /* 将 \"guess_digits\" 的末尾设为 0 - 这并不是真的\n       必需的，但我们这样做是为了万无一失。 */\n\
  \    guess_digits[4] = 0;\n}\n\n/*************************************************************************\n\
  * 函数: display_guess_on_board\n* 参数: 游戏中的猜测数字\n* : 在看板上的正确位置显示输入的猜测\n* 返回: 无。\n**************************************************************************/\n\
  void display_guess_on_board(int guess_no)\n{\n    /* 移动光标。 */\n    gotoxy (2, guess_no\
  \ + 1);\n    /* 打印猜测。 */\n    printf (\"%s\", guess_digits);\n}\n\n/*************************************************************************\n\
  * 函数: mark_guess\n* 参数: 游戏中的猜测数字。\n* : 根据规则标记猜测并在看板上显示结果。\n          这是根据规则的猜测并在看板上显示结果。\n\
  \          这是根据规则的猜测并在看板上显示结果。\n          * 返回: 如果正确 (4) 返回 1。\n**************************************************************************/\n\
  int mark_guess(int guess_no)\n{\n    char guess_copy[5], code_copy[5];\n    int\
  \ no_blacks, no_whites, i, j;\n    /* 设置黑色和白色的数量。 */\n    no_blacks = no_whites\
  \ = 0;\n    /* 制作猜测和代码的副本以便使用它们。 */\n    strcpy (guess_copy, guess_digits);\n  \
  \  strcpy (code_copy, code_digits);\n    /* 处理黑色部分。 */\n    for (i = 0; i < 4; i++)\n\
  \    {\n        /* 比较代码的每一个数字。 */\n        for (j = 0; j < 4; j++)\n        {\n\
  \            /* 这里，我们使用 \"i\" 代表猜测，\"j\" 代表代码。 */\n            if (guess_copy[i]\
  \ == code_copy[j])\n            {\n                /* 如果数字正确，标记它们。 */\n        \
  \        guess_copy[i] = '*';\n                code_copy[j] = '#';\n           \
  \     /* 统计黑色数量。 */\n                no_blacks++;\n            }\n        }\n  \
  \  }\n    /* 计算白色数量。 */\n    for (i = 0; i < 4; i++)\n    {\n        /* 检查数字是否被标记。\
  \ */\n        if (guess_copy[i] != '*')\n        {\n            /* 如果数字未被标记，计算白色数量。\
  \ */\n            no_whites++;\n        }\n    }\n    /* 将光标移动到看板上的正确位置。 */\n  \
  \  gotoxy (7, guess_no + 1);\n    /* 打印黑色部分。 */\n    for (i = 0; i < no_blacks;\
  \ i++)\n    {\n        printf (\"%c\", 'B');\n    }\n    /* 打印白色部分。 */\n    for\
  \ (i = 0; i < no_whites; i++)\n    {\n        printf (\"%c\",'W');\n    }\n    /*\
  \ 如果我们数了 4 个黑色，我们返回 1，否则返回 0。 */\n    if (no_blacks == 4)\n    {\n        /* 代码已被猜中。\
  \ */\n        return (1);\n    }\n    else\n    {\n        return (0);\n    }\n\
  }\n/************************* 结束！ ****************************\n\n## **程序的可能改进**\n\
  \n如上所述，有许多方法可以增强此程序。例如：\n\n1.  某些 `C` 代码在某些地方可以简化，例如在游戏结束时检查响应时。\n2.  游戏可以变得更具“可配置性”，例如：用户选择代码中有多少数字，并可能选择一个控制允许猜测次数的难度级别。\n\
  3.  可以使用彩色图形和音效，而不是单调的 ASCII 字符。\n4.  可以添加评分功能（以及高分表），根据猜中代码的速度（以及难度）计算分数。这些信息可以保存到文件中。\n\
  5.  可以添加另一个人类为朋友设置代码的功能（简单模式）。\n6.  通过允许字母代替数字，可以让代码变得更难以猜。\n7.  可以重写游戏来去泡茶、洗碗、吸地等\
  \ :)\n\n# 附录 2 - 'C' 练习题\n\n1. **这些练习题提供了编写短程序的某些简单想法，以让你练习学到的某些技术/思想。** **为了方便以后参考你的解决方案，在保存“答案”时，使用相应的题目编号命名文件，例如将练习题\
  \ 3 保存为 \"EX3.C\"。**\n\n### 打印内容\n\n1. 编写一个程序打印\n\n`<你的名字>` 的 C 程序！`<日期>`\n\n替换\
  \ `< >`（尖括号）之间的相应信息。\n\n1. 编写一个程序打印 `^^^^^Whoosh!^^^^`，随后是 15 个 `\"\\n\"`（换行符）。\n\
  \n\n\n\n\n### 变量与初始化\n\n1. 编写一个程序，声明两个整数（`int`）分别命名为 `zaphod` 和 `trillian`，并使用 `printf`\
  \ 语句将它们打印出来。你对打印数值有什么发现？\n2. 修改上述程序，使变量在声明时就进行初始化。\n3. 编写一个程序，声明两个浮点数（`float`）分别命名为\
  \ `income` 和 `percent_tax_rate`。将它们分别初始化为 10200 和 17.5。该程序应打印出 \"The Tax Payable\
  \ on \" (`income`) \"at \" (`percent_tax_rate`) \"is \" (计算出的结果)。\n\n### 字符串\n\n\
  1. 编写一个程序，声明一个名为 `kryten` 的字符串，并将其初始化为 \"Mechanoid 2000\"，然后使用 `printf` 将其打印。\n\
  2. 在程序中添加功能，以便单独打印字符串的第 3 个字符和第 6 个字符，与其他字符串的其他部分分开。\n\n### 读取数字\n\n1. 修改练习 6 中的程序，使其从键盘（`scanf`）读取\
  \ `income` 和 `tax_rate` 的值，并带有相应的提示。\n2. 编写一个程序，读取一个摄氏度值并使用公式将其结果转换为华氏度：\n`F = (C*9)/5\
  \ + 32`\n3. 修改程序，使用浮点数（`float`）产生更准确的结果。\n\n### 条件语句\n\n1. 在“摄氏转华氏”程序中添加条件语句：当输入的温度为\
  \ 0°C 或更低时，程序报告 \"Whoa - freezing\"；输入 10°C 或更低时报告 \"Bit chilly...\";输入恰好 20°C 时，报告\
  \ \"Ahhh - room temperature\"；输入大于 30°C 时，报告 \"Ouch - boiling!\"。\n2. 修改程序，使得输入\
  \ 20c 时进行摄氏转华氏，如果输入 68f 则进行华氏转摄氏。（提示：如果你使用 `scanf` 后接 `int` 和 `char` 变量，变量会被设置）。\n\
  3. 编写一个程序，读取 1 到 7 之间的一个数字，然后打印出星期几（提示：使用 `if` 语句测试数字的值，然后打印相应的日期）。\n\n### For 循环\n\
  \n1. 编写一个程序，使用 `for` 循环读取 5 个数字并计算它们的平均值。\n2. 修改“平均值”程序，首先读取需要平均的数字个数 (!)。\n3. 编写一个程序，从键盘读取四个数字并将它们存储在一个名为\
  \ `guess_digits` 的字符串中。将此文件保存为 `guess.c`。\n\n### 循环与字符串\n\n1. 编写一个程序，读取单个单词并判断输入的是字母\
  \ \"E\" 还是 \"e\"提示：你需要使用循环检查每个字符。记住为你的字符串声明约 80 个字符以容纳整行。你可以通过测试正在查看的字符是否为 `\\0`\
  \ 或 0 来检查字符串的末尾）。\n2. 编写一个程序，读取一个字符串并统计其中的元音数量，打印元音个数。\n\n### switch 语句\n\n1. 编写一个程序，提示并读取两个数字。这两个数字应该是：\n\
  \   (i) 1 到 13 之间的值，代表牌号（1 = Ace, 11 = Jack, 12 = Queen 等）。\n   (ii) 1 到 4 之间的值，代表花色（1\
  \ = Clubs, 2 = Diamonds, 3 = Hearts, 4 = Spades）。\n2. 程序应验证这些数字，如果其中任何一个非法，则打印适当的消息。然后根据数字打印诸如\
  \ \"Jack of Clubs\" 的牌名。程序应使用 `switch` 语句为数字打印正确的消息。\n3. 修改第 3 步中的程序，使其打印出牌中所有的完整列表（使用\
  \ `do`、`while` 或 `for` 循环）。\n\n### 函数\n\n1. 编写一个程序，包含一个名为 `print_total` 的函数，该函数打印传递的两个参数的总和。你需要传递\
  \ `integer` 或 `float` 类型的值。\n2. 修改程序，将函数命名为 `calc_total` 并使其返回两个数字相加的总和。\n3. 将计算华氏度/摄氏度值的程序改为使用函数——该函数接收\
  \ `centigrade` 作为参数并以浮点数形式返回华氏度值。\n\n### 指针\n\n1. 编写一个程序，声明三个整数 `holly`、`rimmer`、`starbug`\
  \ 并将其初始化为 10、20 和 30。声明一个指向整数的指针 `integer_ptr`。通过将 `integer_ptr` 替指向 `holly` 和 `rimmer`，通过指针将这两个变量的值相加并将结果存储在\
  \ `starbug` 中。\n2. 输入复制一个字符串到另一个的函数（如笔记所示）。修改该函数使其返回一个表示复制字符数量。在程序中添加 `main` 并声明两个名为\
  \ `source_string` 和 `dest_string` 的字符串变量。将 `source_string` 初始化为 \"vogon poetry\"\
  ，并调用函数打印字符串复制的结果以及函数的返回值。\n\n# 附录 3 - 'C' 快速参考\n\n### 主程序结构\n```c\nint main()\n\
  {\n    /* 这是一个注释！ */\n    printf(\"Huh?\");\n}\n```\n所有的 `C` 语句都以 `;` 结束，`` 之前除外。所有的\
  \ `C` 保留字均为小写。`C` 是大小敏感的。\n\n### 数据声明\n在代码之前：\n```c\nint centigrade_value;   /*\
  \ 整数 */\nlong unemployment;      /* 大整数 */\nchar any_char;          /* 字符 */\nfloat\
  \ exchange_rate;    /* 浮点数 */\nchar any_string[] = \"Only Me!\"; /* 字符串 */\n```\n\
  ### 数组：\n```c\nint card_values[52]; /* 52 个元素的数组 */\n```\n数组元素引用从零开始，例如 `card_values[4]`\
  \ 是 `card_values` 数组的第 5 个元素。\n\n### 输出到屏幕 - printf\n```c\nprintf(\"The number was\
  \ %d\\n\", centigrade_value);\n```\n控制字符串元素\n| 转换字符 | 特殊打印 |\n| :--- | :--- | :---\
  \ |\n| `%d` | 整数 | `\\n` 换行 |\n| `%c` | 字符 | `\\r` 回车 |\n| `%s` | 字符串 | `\\b` 退格\
  \ |\n| `%ld` | 长整型 | `\\t` 制表符 |\n| `%f` | 浮点数/双精度 | |\n\n`printf(\"%4d\", centigrade_value);`\
  \ 指定字段宽度（打印空间）为 4。字段宽度数字前的 `-` 表示“左对齐”。`\"04\"` 表示打印前导零。转换字符的数量必须与后续数据项匹配。\n\n###\
  \ 输入 - scanf\n```c\nscanf(\"%d\", &centigrade_value);\n```\n将一个整数读入 `centigrade_value`。转换字符与\
  \ `printf` 相同。\n\n### 运算符与不等式\n```\ntax = 10;      /* 赋值 */\ntax++;          /*\
  \ 自动增 +1 */\ntax--;          /* 自动减 -1 */\ntax += 20;      /* 等效于 tax + 20; */\n\
  tax -= 20;      /* 等效于 tax - 20; */\n*               /* 相乘 */\n/               /*\
  \ 除法 */\n%               /* 取模（余数） */\ni == 10;        /* 测试是否相等 */\ni != 10;  \
  \      /* 不等于 */\ni > 10;         /* 大于 */\ni < 10;         /* 小于 */\ni >= 10; \
  \       /* 大于等于 */\ni <= 10;        /* 小于等于 */\n&&              /* 逻辑与 */\n||  \
  \            /* 逻辑或 */\n&               /* 单一操作数 - 地址 */\n*               /* 指向所指对象的指针\
  \ */\n>>              /* 右移 */\n<<              /* 左移 */\n~               /* 运算按位取反（反码）\
  \ */\n|               /* 运算按位或 */\n&               /* 双操作数 - 按位与 */\n^         \
  \      /* 运算按位异或 */\n```\n\n### 条件语句\n单条语句:-\n```c\nif (i == 10)\n    printf(\"\
  Variable i is equal to 10\");\n```\n复合语句:-\n```c\nif (i == 10)\n{\n    printf(\"\
  Variable i is equal to 10\");\n}\n```\n\n\n\n\n为下面的变量使用 `int`。`for` 循环中的元素分别是初始化、持续条件、迭代表达式。\n\
  \n```c\nfor (i = 1; i <= 4; i++)\n{\n    printf (“This appears 4 times!”);\n}\n\
  ```\n\n### `while` 循环\n\n```c\ni = 0;\nwhile (i < 10)\n{\n    i++;\n    printf (“i\
  \ is now %d, i”, i);\n}\n```\n\n### `do` 循环\n\n```c\ni=0;\ndo\n{\n    i++;\n   \
  \ printf (“i is now %d, i”, i);\n}\nwhile (i < 10);\n```\n代码至少执行一次。\n\n### `switch`\
  \ 语句\n\n使用整数作为控制变量：\n\n```c\nswitch (card_value)\n{\n    case 1:\n        printf\
  \ (“Ace”);\n        break;\n    case 11:\n        printf (“Jack”);\n        break;\n\
  \    .\n    .\n    default:\n        printf (“%d”, card_value);\n}\n```\n\n### 函数\n\
  \n/* 下面将声明三个函数。 */\n`int global_integer; /* 在外部声明的全局数据*/`\n\n/* 所有函数。 */\n`void\
  \ function_b(void); /* function_b 的预声明 */`\n\n```c\nvoid function_a(int any_number)\
  \ /* 无返回值*/\n{ /* 接收整数 ^^ 参数 */\n    /* 整数仅在此函数中使用。 */\n    int local_integer;\n\
  \    printf (“The number is %d”, any_number);\n}\n```\n\n```c\nint function_c (int\
  \ any_number) /* 返回整数*/\n{ /* ^^ 接收整数参数 */\n    function_b( ); /* 调用“function b”\
  \ */\n    printf (“The number is %d”, any_number);\n    /* 仅加 10 并返回值。 */\n    any_number\
  \ += 10;\n    return (any_number);\n}\n```\n\n/* 没有参数也没有返回值的函数。 */\n```c\nvoid function_b\
  \ ( )\n{\n    printf (“This is function b! “);\n}\n```\n\n```c\nint main ( )\n{\n\
  \    /* 调用函数 a。 */\n    function_a(10);\n    /* 调用函数 c。 */\n    function_c( );\n\
  }\n```\n\n### 库函数\n\n在程序顶部放置：\n\n`#include “stdio.h”      /* 用于 printf, scanf 等\
  \ */`\n`#include “string.h”      /* 用于字符串函数 */`\n`#include “stdlib.h”      /* 用于标准\
  \ 'C' 库 */`\n\n### 字符串函数\n\n- `strlen (string)`: 字符串长度\n- `strcpy (dest, source)`\
  \ 字符串拷贝\n- `strncpy (dest, source, number)` 复制 n 个字符\n- `strcmp (string1, string2)`\
  \ 字符串比较（相等时返回 0）\n- `strncmp (string1, string2, n)` 比较前 n 个字符\n- `stricmp (string1,\
  \ string2)` 不区分大小写的比较\n- `strncmpi (string1, string2)` 比较前 n 个字符 - 不区分大小写\n- `sprintf\
  \ (string, control sting, etc)` 将“printf”内容输出到字符串中。\n- `centigrade_value = atoi\
  \ (string)` 将字符串转换为整数\n\n### 标准 'C' 库\n\n- `srand (long)`: 为“rand”设置种子。\n- `rand\
  \ ( )`: 返回随机值 0-65535。\n\n"
