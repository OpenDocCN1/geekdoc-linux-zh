    \ power and giving you a wireless network wherever there's the most basic of internet\
    \ connections. What if it's not enough to know you can search the web, though?\
    \ What if you want to be wholly secure as you do it? Then it's time to upgrade\
    \ the router with Tor to protect your privacy on the internet.  \nThis 'Onion\
    \ Pi', as dubbed by Adafruit, combines Raspbian and\n\nTor to create and secure\
    \ a wireless access point using just a Raspberry Pi. This project is fairly straightforward:\
    \ after setting up the wireless access point, we install Tor and do some basic\
    \ setup tasks so that it routes traffic properly, and securely. This will keep\
    \ you anonymous online – a handy feature in a time of privacy concerns all around\
    \ the web.  \nWhen the Pi is not connected to the internet, it should still function\
    \ as a wireless router, allowing at the very least a wireless LAN in your location."
