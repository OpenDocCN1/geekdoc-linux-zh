  md: '# # SparkyLinux 3.0


    Debian 7.0-based lightweight distro


    **REVIEW**


    ![](img/dd9251551a61a36067892b1cc68615b0_82_0.png)


    ![](img/dd9251551a61a36067892b1cc68615b0_82_1.png)


    Unlike a lot of modern distros, the installer has you manually partition the hard
    drive – although there are decent instructions on how to do it


    Synaptic grants you access to the entire Debian repos – although we had some issues
    with using apps and other packages we installed to it


    # " Partitioning for SparkyLinux is completely manual "


    the Sparky website has some nice instructions to help you along the way, but the
    graphical installer could be improved by having the auto-partitioning of other
    modern distros. Other than these issues, installation is quick and relatively
    painless and while the majority of people won''t face the GPT problem, it''s something
    that will become more problematic as more and more systems use it.


    are featured on the dock with a couple of other apps, and Synaptic is used as
    the main package manager. While we had no issues with Iceweasel on some websites,
    when we tried using Chromium, Flash or JavaScript, sites would basically break
    the browser – including even the Chromium store. Tabs could be exited and reopened;
    however, the same problems would happen consistently.


    ![](img/dd9251551a61a36067892b1cc68615b0_82_2.png)


    It''s a rolling release based on testing Debian, so all the latest software is
    available to use in Sparky


    # ## Unique aesthetic


    The default login manager is very simple: a drop-down list for users, and a few
    options in the corner hidden away that let you change the locale and desktop session.
    Nothing fancy. However, the default desktops each have an aesthetic quality unique
    to SparkyLinux. A nice use of monochrome icons and colours class up the desktop,
    and the dock included with LXDE increases its usability. There''s also a preconfigured
    Conky display that gives a great selection of system information. This is also
    presented in the live image, just in case you need to keep an eye on your system.


    SparkyLinux has a great graphical system manager, similar to the likes of Mageia,
    albeit not as well laid out or as deep. The SparkyCenter gives you access to change
    the theme and overall look of the distro, software sources, Flash and Java settings,
    default applications, hard drive management etc. The interface is presented in
    icons that move into different layers and while there''s no back button, exiting
    the window will take you back a step.


    The default app selection was nice, although with no commitment to truly free
    software, VLC, GIMP and Iceweasel


    # ## It shouldn''t happen


    That also wasn''t the only extra package we had issues with – trying to install
    Cinnamon went terribly, with only a patchy black screen showing up when trying
    to boot into it. This really shouldn''t happen, even if it''s not available as
    a default desktop. At the very least, the default desktops all work well, especially
    the Razor-Qt offering which is fast becoming one of our favourite lightweight
    desktops.


    Being Debian based, the repos are of course full of all the latest and greatest
    software. The reason SparkyLinux has iterated so much is because it''s considered
    a rolling release – basically updated with snapshots from Debian testing at specific
    intervals. This should mean that Sparky is always up to date if you like to be
    on the cutting edge. However, we don''t think it''s worth it. Being severely limited
    to basically the default applications and desktops, however good they are, is
    not the Linux way. It''s worth a look, but don''t get your hopes up.


    **Rob Zwetsloot**


    ![](img/dd9251551a61a36067892b1cc68615b0_82_3.png)


    Screenshot Gallery


    bit.ly/LUDSL3


    # ### Summary


    There are some great ideas in SparkyLinux, and it works very well – unless you
    decide to step a bit outside the predefined barriers of apps and desktops. Well
    worth a look, but it''s not for everyone.


    ![](img/dd9251551a61a36067892b1cc68615b0_82_4.png)


    Download now


    sparkylinux.org


    83 www.linuxuser.co.uk'
  merge: -1
  img_proc: true
