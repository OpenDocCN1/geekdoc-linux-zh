    is a requirement on Linux. “It’s yet another reason why Linux users shouldn’t
    be complacent about their computer security, and run an anti-virus program,” claimed
    former Sophos consultant Graham Cluley. “The statement that the Linux platform
    is absolutely secure now seems even more illusory,” added Avast’s Peter Kálnai.


