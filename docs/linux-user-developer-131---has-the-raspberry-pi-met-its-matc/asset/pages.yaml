    **ASK THE EXPERTS**

    Send us your questions and we''ll do our best to answer them!


    This month your questions were answered by...


    ![](img/dd9251551a61a36067892b1cc68615b0_87_0.png)


    **Russell Barnes** has been a computer and technology journalist for nearly 15
    years


    ![](img/dd9251551a61a36067892b1cc68615b0_87_1.png)


    **Rob Zwetsloot** studied aerospace engineering, using Python to model simulations


    ![](img/dd9251551a61a36067892b1cc68615b0_87_2.png)


    **Kunal Deo** is a veteran developer of many open source projects


    ![](img/dd9251551a61a36067892b1cc68615b0_87_3.png)


    **Richard Smedley** spends 90% of his screen time shelled into servers in the
    UK and USA


    ![](img/dd9251551a61a36067892b1cc68615b0_87_4.png)


    Clonezilla is a powerful disc imaging tool


    # ## How do I compile software?


    Compiling software from source code isn''t that difficult – all it requires are
    simple build tools available in all repos. To make sure you have the correct build
    tools installed, do the following on a Debian-based system:


    ```

    $ sudo apt-get install build-essentials

    ```


    Alternatively, for other systems, use:


    ```

    $ sudo yum groupinstall ''Development Tools''

    ```


    Once you have the necessary source code for the software you want to compile,
    navigate to the folder in the terminal and type:


    ```

    $ . /configure

    ```


    ...to build the files, and follow up with:


    ```

    $ make

    ```


    ...to compile it.


    # ## Ghost editing


    Hi there. I''ve been playing around with my system recently, and decided to do
