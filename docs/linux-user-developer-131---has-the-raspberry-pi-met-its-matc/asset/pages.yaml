- pgno: 72
  md: '# Integrated development environment group test


    Four of the best IDEs go head to head


    **REVIEW**


    # Code::Blocks


    A more open IDE originally for C++, but now able to do a bit more


    A relatively new IDE, Code::Blocks was first released in early 2008 after three
    years of release candidates. Although a C++ IDE by default, it has plug-in support
    to extend its functionality to allow for building and testing of other languages.
    However, for pure coding, Code::Blocks can be used to write scripts in various
    languages thanks to support for syntax a of vary of different languages. However,
    you cannot test these without add-ons.


    Unfortunately, the plug-in scene for Code::Blocks is fairly immature and there
    isn’t even proper support for Python and other interpreted programming languages.
    Plug-ins are found via the Code::Blocks wiki and are not particularly well laid
    out at the moment. Plug-ins are installed manually, which would be fine normally,
    but the other IDEs in the test have some interesting ways of managing plug-ins
    that make this method seem somewhat archaic.


    While you won’t be able to properly debug test code, the interface for Code::Blocks
    is still very nice for actually writing your code. Projects are handled via proprietary
    projects files which link to specific folders. Projects don’t need to be created
    with a specific language in mind and, like some text editors, it will smartly
    know to highlight the syntax for different languages. Browsing doesn’t always
    work for all functions and classes; however, it will allow you to perform simple
    code editing to test elsewhere if you specifically like the interface.


    Code::Blocks is also quite customisable, allowing you to change the look and behaviour
    of the editor, the way the compiler works and even editing the startup script
    for the application itself.


    Code::Blocks is a nice piece of software, although due to its immaturity it doesn’t
    quite have the best plug-in support of the other IDEs in this test – especially
    if you want to use it for multi-language programming. It’s a bit lighter than
    Eclipse at least, and the interface is well laid out, but it may still be a few
    years before it becomes preferable to the others.


    > “Unfortunately, the plug-in scene for Code::Blocks is fairly immature”


    ▪ There are a few first-party plug-ins available, but not many third-party


    ▪ The interface is nice and aids workflow


    ![](img/dd9251551a61a36067892b1cc68615b0_72_0.png)


    ![](img/dd9251551a61a36067892b1cc68615b0_72_1.png)


    | | | |

    |---|---|---|

    | **SCORES** | | |

    | Installation | Available in repos, but binaries and source code is easily accessible
    elsewhere | 8 |

    | Workflow | Code::Blocks'' interface is generally good for workflow, although
    it doesn''t support all languages properly | 7 |

    | Features | A great selection of features that can all be heavily customised
    | 7 |

    | Plug-in support | Very limited right now, meaning that not all languages are
    properly supported | 4 |

    | Overall | Code::Blocks has a great interface, and some great ideas on how to
    code and manage projects, but the plug-in selection needs to be improved | 6 |'
