  md: '# # Book Reviews


    Latest Linux books revealed


    REVIEWS


    # ## Burn Your Portfolio:


    # ### Stuff They Don''t Teach You in Design School, But Should


    ![](img/dd9251551a61a36067892b1cc68615b0_84_0.png)


    **Authors** Michael Janda

    **Publisher** New Riders

    **ISBN** 978-0321918680

    **Price** £22.99

    **Score** ★★★★☆


    Sage advice for all creatives – programmers and web designers, not just artists
    and illustrators – that should be common sense, but comes (if at all) from decades
    of experience. It’s never too late to learn – improve your work and your workplace
    with Janda’s big-post-sized bites of wisdom.


    # ## Vagrant: Up and Running


    ![](img/dd9251551a61a36067892b1cc68615b0_84_1.png)


    **Author** Mitchell Hashimoto

    **Publisher** O''Relly

    **ISBN** 978-1449335830

    **Price** £22.99

    **Score** ★★★★☆


    Virtual development environments the easy way, with two commands to get a virtual
    machine up, then easy sync of complex development environments. Automated provisioning
    includes Chef, Puppet and shell script options. Vagrant creator Hashimoto expands,
    explains, and expands – including a section on writing plug-ins.


    # ### Functional JavaScript:


    # #### Introducing Functional Programming with Underscore.js


    ![](img/dd9251551a61a36067892b1cc68615b0_84_2.png)


    **Author** Michael Fogus

    **Publisher** O''Relly

    **ISBN** 978-1449367028

    **Price** £22.99

    **Score** ★★★★☆


    The near- ubiquity of JavaScript in the web ego makes it a good platform for teaching
    functional programming techniques. While applying functional concepts to JavaScript
    will improve your apps in many ways – though functional programming people looking
    to learn JS may need an additional guide.


    # ## Scala in Action


    # ### Fast-paced real-world Scala tutorial


    ![](img/dd9251551a61a36067892b1cc68615b0_84_3.png)


    **Authors** Nilanjan Rayachauduri

    **Publisher** Manning

    **ISBN** 978-1935182757

    **Price** £28.99

    **Score** ★★★★☆


    Scala is gaining many new users, attracted by its convenience (runs on JVM and
    .NET), OO implementation (modelled on Smalltalk and Eiffel); functional programming
    features (though it does not force any aspect of this – such as immutable data
    – on the coder); scalability (readily extensible, yet suitable for smaller scripting
    jobs); sane concurrency (through Erlang-style Actors implemented in libraries);
    productivity (say goodbye to ugly Java boilerplate); type inference; and compatibility
    with Java libraries.


    Rayachaudri evangelises these features, but quickly gets you to practical appreciation
    as in chapter 2 you build a command-line REST client, and in chapter 3 you code
    a MongoDB driver using Scala classes and traits. Functional data structures make
    a logical stepping stone to functional programming, and the book stasis started
    with web apps, databases and concurrent programming.


    Testing, Java interoperability, and scalable distribution with Akka round off
    this excellent, fast-paced (if you want good-but- gentle, try O''Reilly) tutorial.


    # ## Arduino Adventures:


    # ### Escape From Gemini Station


    ![](img/dd9251551a61a36067892b1cc68615b0_84_4.png)


    Fun and imaginative Arduino introduction


    **Authors** James Floyd Kelly

    & Harold Timmis

    **Publisher** APress

    **ISBN** 978-1430246053

    **Price** £23.50

    **Score** ★★★★☆


    Framing an Arduino tutorial in a science-fiction story is a big risk. Fortunately,
    Timmis and Kelly have made both story and tutorial work, as their engaging characters
    get caught in an adventure that can only be survived with the help of some creative,
    breadboard-based, hardware hacking – something they must learn from scratch, along
    with the reader.


    An imaginative way of justifying the various beginner projects which can build
    knowledge both of electronics, and of Arduino programming, this book should carry
    young minds easily past some new concepts, and through the acquisition of a number
    of skills.


    Fiction, theory, hardware and software through eight chapters, from simple potentiometer
    and LED projects, through temperature and motion detection, to building your own
    robot. Rounded off by a comprehensive parts list for each project, and the advice:
    “Never stop learning.” Recommended for any beginner, of any age, wanting to start
    learning Arduino.


    # ## Emergent Design:


    # ### The Evolutionary Nature of Professional Software Development


    ![](img/dd9251551a61a36067892b1cc68615b0_84_5.png)


    **Author** Scott J. Bain

    **Publisher** Addison Wesley

    **ISBN** 978-0321899055

    **Price** £38.99

    **Score** ★★★★☆


    Improve old code & professionalise programming


    A profession – an agreed-upon set of minimal standards, and a clear path of entry
    – is not a way of describing software development, but Scott Bain would like it
    to be and, with *Emergent Design*, sets out his view of the standards to “improve
    our lot as creators of software”.


    To make (in vitable) change a opportunity, Emergent Design leans heavily on ''Agent-of-Four
    patterns and refactoring (with attention to coupling, cohesion, redundancy, readability,
    testability) – so Bain concentrates exclusively on object-oriented languages and
    techniques.


    Missing is the functional programming view (most C-to-y patterns are unnecessary
    in FP languages), but this book is valuable for the questions it asks, and its
    (practical) optimism: “An old concept that I used to accept – code must inevitably
    decay over time – fades away in favour of something more hopeful: code can evolve
    over time, getting better and better every time I touch it.”'
