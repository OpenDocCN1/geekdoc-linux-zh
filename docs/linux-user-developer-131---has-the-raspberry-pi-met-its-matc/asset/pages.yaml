  md: "# Exclusive\n\nIntel’s big fish in a little pond\n\n![](img/dd9251551a61a36067892b1cc68615b0_7_0.png)\n\
    \nlarger and pricier than the Pi, the MinnowBoard offers full x86 compatibility\n\
    \nthan developing a successful embedded product and then finding out that your\
    \ components are about to enter end-of-life. Queens Bay is a platform used in\
    \ IVI (In-Vehicle-Infotainment) devices, and was designed with a long lifespan\
    \ - since people tend to own cars for a long time. It still has four to five years\
    \ left in the product’s life cycle.\n\n“Two, the time to execute was now, so we\
    \ weren’t about to wait for upcoming Intel platforms to roll out. Tunnel Creek\
    \ met our main requirements and was available immediately, so we ran with it.”\n\
    \n> **What advantages does the x86 architecture used in the Atom processor offer\
    \ in the embedded space, compared to ARM or other RISC platforms?**\n> \n> \"\
    Compatibility is likely the biggest advantage. Linux originated on the Intel 386,\
    \ and whether you're working on embedded or desktop applications, the toolchain,\
    \ libraries etc were designed on and are pretty much guaranteed to work on x86.\n\
    > \n> \"Performance is another significant one. Countless person-years have been\
    \ put into optimizing compilers such as GCC to take full advantage of x86 platforms,\
    \ so you can leverage that to its greatest benefit.\"\n\nThe MinnowBoard includes\
    \ eight GPIO pins and a dedicated expansion port for ‘Lures’\n\n> **Do you agree\
    \ that the success of the ARM-based Raspberry Pi has demonstrated a clear demand\
    \ for low-cost development boards from hobbyists?**\n> \n> \"Yes, absolutely.\
    \ One of the things I appreciate and respect about the Raspberry Pi project is\
    \ that it's introducing so many new people to embedded Linux development. It used\
    \ to be that embedded was a niche thing that software engineers specialised in,\
    \ and now the embedded Linux community is becoming much more diverse, especially\
    \ with younger people. I love that.\n> \n> **What does the MinnowBoard offer that\
    \ other, more established development boards lack?**\n> \n> \"MinnowBoard stands\
    \ out in its combination of performance, flexibility, openness and standards.\n\
    \nThe Intel Atom CPU provides plenty of performance for high computational workloads.\
    \ It also has strong I/O performance due to PCI Express powering its Gigabit Ethernet\
    \ and SATA disk features. We also make PCI available through MinnowBoard's expansion\
    \ connector to enable high-speed I/O to custom hardware projects, for example\
    \ interfacing with FPGAs or other hardware.\n\n\"The MinnowBoard can be used for\
    \ fun hobby projects, yet scales up to higher workloads. It's expandable via several\
    \ PC and embedded bus standards, and offers an environment for custom firmware\
    \ development.\n\nWith Gigabit Ethernet and a real-time clock, it pulls ahead\
    \ of the Raspberry Pi\n\n![](img/dd9251551a61a36067892b1cc68615b0_7_1.png)"
