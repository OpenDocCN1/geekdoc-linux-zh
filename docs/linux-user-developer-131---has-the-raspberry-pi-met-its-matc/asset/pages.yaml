  md: '# On the DVD


    Your disc


    # On the DVD


    Find out what open source delights we have in Linux User issue 131’s bumper DVD…


    # Distros


    This month we’ve got the stable release of the excellent Elementary OS among others


    ![](img/dd9251551a61a36067892b1cc68615b0_95_0.png)


    # Software


    20 of the best open source packages, including Android Studio so you can follow
    our feature


    # Tutorial files


    If you want to follow along with this month’s or previous guides, this is where
    you’ll find them


    # Distro directory


    Want to find out what’s happening with the biggest distros? Check out our directory...


    If you’re looking for all the very latest open source distros, applications, tools
    and tutorial files, you’ve come to the right place…


    On this month’s disc we’ve got another four cutting-edge distros, and the best
    of them boot directly off the disc – just reboot your machine with the DVD in
    the drive.


    Leading the pack is Elementary OS, one of my Editor’s Picks for this month’s disc
    and probably the most exciting new distro since Linux Mint made its debut in 2006.
    Elsewhere we have the beta of OpenELEC, the excellent HTCPC distro based on XBMC,
    Puppy 5.6; and Sparky Linux 3.0, which we’ve reviewed this issue.


    Trying Elementary OS and Puppy Linux 5.6 is as easy as can be. Just drop the DVD
    in your drive, reboot your computer and select one or the other from the boot
    menu. If the menu doesn’t appear, go to your BIOS and ensure the DVD drive is
    set to load before your hard drive. Enjoy the disc!


    Russell Barnes, Editor


    # How to burn an ISO


    Want to try a new distro ISO? Here’s how to get started…


    ![](img/dd9251551a61a36067892b1cc68615b0_95_1.png)


    **STEP 1:** Grab a new ISO Copy the distro’s ISO from our cover disc to your hard
    drive: go to the Distros tab, click ISO and choose to save. Alternatively, find
    an ISO online to download. If you’re not sure if you need a 32-bit or 64-bit version,
    go with the former to be safe.


    ![](img/dd9251551a61a36067892b1cc68615b0_95_2.png)


    **STEP 2:** Open or install Brasero Brasero is the most popular open source disc-burning
    utility. It’s not already installed on your distro. Locate it in your distro’s
    repository and install it. Then open the program and select ‘Burn image’ from
    the Projects tab on the left.


    ![](img/dd9251551a61a36067892b1cc68615b0_95_3.png)


    **STEP 3:** Burn your disc image In the Image Burning Setup window, click the
    first box – marked ‘click here to select a disc image’ – and navigate to the ISO
    you just put on your hard disk. Once selected, ensure you’ve got a CD or DVD writable
    disc inserted and click ‘Create Image’.'
  merge: -1
  img_proc: true
