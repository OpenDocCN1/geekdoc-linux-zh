  md: '# RasWIK


    Wireless microcontroller connection kit for Pi


    ![](img/dd9251551a61a36067892b1cc68615b0_80_0.png)


    # Technical specs


    Operating system: Raspian Linux

    Dimensions (XinoRF): 70.9 x 53.3mm

    Weight (XinoRF): 25g

    Dimensions (Slice of Radio): 30.3 x 34.3mm

    Weight (Slice of Radio): 7g

    Extras: 4GB SD card, USB cable, small breadboard, 5x red, yellow and green LEDs,
    30 resistors, light sensor, thermistor, piezoelectric buzzer, 3x push-button switches,
    25x jumper wires


    ![](img/dd9251551a61a36067892b1cc68615b0_80_1.png)


    +   Most existing Arduino shields work fine with the XinoRF

    +   The XinoRF can be powered by a mains adaptor or through mini-USB

    +   The Atmel Atmega-328 provides full Arduino compatibility

    +   The same compact radio board is found on the XinoRF as on the Slice of Radio


    # Also consider


    ![](img/dd9251551a61a36067892b1cc68615b0_80_2.png)


    An open source kit, Omoint''s ARDX is the best way to get started with Arduino
    development. While it includes more components than the RasWIK – including a mounting
    plate, servo and motor – it does not include any wireless capabilities as standard.
    These can, however, be added at a later date.


    www.omolot.co.uk


    components and instructions for various experiments and small projects. Using
    the bundled compact breadboard, it''s possible to get building simple circuits
    – remote buzzers, traffic lights, even a light and temperature sensor – in mere
    minutes.


    The RasWIK has a serious trick up its sleeve once your device is built: an embedded
    radio on the XinoRF connects to the Slice of Radio with no effort, allowing you
    to place the XinoRF almost anywhere in the same building as the Raspberry Pi and
    still take control of it. The system uses the Lightweight Local Automation Protocol
    (LLAP), which allows for multiple devices on the same radio network – more XinoRFs,
    more Raspberry Pis, or some of the LLAP-compatible accessories also sold by Ciseo.


    It''s here where the only real downside of the kit comes to light; however, LLAP
    is extremely lightweight, as you might expect from a protocol designed for a microcontroller
    with around 32KB of program storage. Accordingly, it includes no protection against
    intrusion; so if your neighbour buys a RasWIK kit, he or she would be quite able
    to take control of anything you build.


    For the experimenter, though, it''s a minor point. While the kit runs LLAP out
    of the box, the radio can also be used as a point-to-point serial connection,
    and you can write your own protocol to run over the top of it if you desire robust
    security.


    That minor issue aside, there''s little not to like about the RasWIK kit. The
    radios offer surprising range, and the Slice of Radio in particular is a very
    clever bit of design and sits happily on top of the Pi''s GPIO port without increasing
    its dimensions – meaning it can be used in conjunction with the vast majority
    of non-metal cases on the market.


    The only real downside for those who enjoy experimenting with the Pi''s GPIO hardware
    is that the Slice of Radio does not include pass-through connections for the other
    pins on the header, despite only using power and the UART connection itself. Careful
    work with a soldering iron will allow you to fix that, but if you''re not happy
    with such modifications and have only one Pi, you''ll soon grow tired of removing
    the radio board in favour of other GPIO-connected devices you may have.


    Gareth Halfacree


    # Summary


    Although it would be easy to mark the RasWIK down for its insecure protocol, to
    do so misses the point: it''s an easy way to get started with wireless microcontroller
    development, and provides a great platform for adding sensors or actuators to
    a Raspberry Pi. If security is a worry, users can always roll their own protocol.


    ![](img/dd9251551a61a36067892b1cc68615b0_80_3.png)


    # Gerbboard, £5 + 12


    ![](img/dd9251551a61a36067892b1cc68615b0_80_4.png)


    One of the first add-on boards developed for the Pi, the Gerbboard is a wired
    GPIO expansion module. Not entirely suitable for beginners due to inaccessible
    code examples and awkward hardware, it''s still an affordable way of increasing
    the Pi''s GPIO capabilities – but, again, has no integrated wireless hardware.


    uk.farm.co


    ![](img/dd9251551a61a36067892b1cc68615b0_80_5.png)


    ciseo.co.uk'
