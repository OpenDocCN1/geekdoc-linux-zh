    declared Mullenweg and Little’s software as the official successor to b2. “It
    turns out he’d been made redundant or something like that, had to give up his
    flat, gone back to his parents who didn’t even have internet and so on,” smiles
    Little. “So it was just the real world was much more important than a bit of software.”
    WordPress was thus born.


    It was January 2003. Little had been learning PHP and he felt the world worked
    his way around b2 and makes alterations. “No software is perfect, so it was just
    a case of thinking of things that we wanted to add to it,” says Little. “That
    first release of WordPress had a couple of extra features that I’d already created
    for b2 and the same for Matt: he had a couple of extra features that he’d added
    to b2. We’d shared these things on the forums and we kind of incorporated those
    into the core product. And yeah, we just took it from there.”


    One of the biggest changes was the introduction of Pages, which made a massive
    difference to WordPress and set it apart from its rivals at the time. It enabled
    WordPress to become more than blogging software. But the


    ''killer'' feature, Little says, came in the guise of hooks. “It meant you could
    write additions to the product without having to modify the code, and that was
    something that only really big grown-up software did, like some of the Java Stacks,”
    says Little. “This ability to actually change the way it behaves and add things
    to it without having to touch any of the core files was crucial. It’s still the
    hardest thing, I think, for new developers to get their heads round how it works,
    but I think that’s what made it so much easier.”


    He said it made the process of updating the software so much easier. “Prior to
    that, with anything like Drupal or any of those tools, whenever there was an update
    you were in danger of losing your changes because you’d modified original files
    to call your stuff or to add somebody else’s stuff in. You’d stick these function
    calls in there. It meant that as soon as you got the new version, if you just
    literally FTP’ed the new one over the top of the old one, you were going to lose
    your stuff and lose your modifications. So I think that was probably one of the
    key features and I don’t think it’s necessarily something that people appreciate
    because these days they just never see the problem. They update WordPress or they
    update the plug-ins and oh, it’s the new version, and nothing’s gone wrong. And
    yet before then you had to save those files you modified before you updated to
    the new software.”


    Mullenweg and Little continued to work on WordPress and the first release came
    in May of that year.


    ![](img/dd9251551a61a36067892b1cc68615b0_53_1.png)


    # User-friendliness


    Little and Mullenweg saw WordPress as an evolving product. Little worked on doing
    what he could to eliminate the ability to make mistakes, which he believes was
    a crucial step forward. “With the original b2, you could lose your settings,”
    he says. “But with WordPress, I added the config sample PHP and it just took that
    ability to make a mistake away. I took what was the original b2 settings file
    and created an Options interface for it. It was another way, you didn’t have to
    fiddle with it - you didn’t have to know how to edit these files and FTP them
    back up to your server and stuff like that. I think all those bits helped make
    it easier, made it harder to cock up and I think that all helped.”


    The need to be user-friendly was at the forefront of the minds of both developers.
    It was also important for them that WordPress, like b2, was an open source project.
    They loved that b2 operated under a General Public Licence, which meant they had
    the freedom to take the code, change it and distribute it to other people. They
    loved that it was free too. “I’ve always been a huge open source advocate,” says
    Little. “Matt was kind of new to the open source idea, but that was one of the
    reasons behind him choosing to use b2.” Little attributes the popularity of WordPress
    to its open source nature (“if it wasn’t open source, if it wasn’t GPL, there
    wouldn’t be the 20,000 plug-ins that have been written for it or the 10,000 themes,”
    he says) and it matters not to him that he has not made any direct money from
    WordPress. “Nobody does,” he says. “It’s


    > if it wasn’t open source, if it wasn’t GPL, there wouldn’t be the 20,000 plug-ins
    that have been written for it


    # TAKING INSPIRATION


    WordPress was not created in isolation. Although Little and Mullenweg worked on
    their own, with the expanse of the Atlantic ocean separating them, they did look
    at other blogging software being created at the time and they took inspiration
    from it. “There was definitely a lot of studying of rivals and playing catch-up,
    seeing what other people were doing,” Little says. “For a very long time there
    was a lot of Blogger, software and certainly you would see Blogger or Movable
    Type with features that were cool and that we thought we might add to WordPress.
    Eventually it started going the other way round as well and these other apps were
    copying features that had been added to WordPress.”'
