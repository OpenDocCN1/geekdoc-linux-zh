  md: '# # Synchronise your files with Unison


    Use the Unison command-line tool to sync files between computers


    3. Copy the contents of the `~/.ssh/id_rsa.pub` file from your local server into
    the file `~/.ssh/authorized_keys` found on the remote server. One way of doing
    it is by executing the following command:


    `$ cat ~/.ssh/id_rsa.pub | ssh linode `cat >> ~/.ssh/authorized_keys` `


    The next time you try to log into the remote Linux server using SSH, you will
    be asked for the passphrase of step 1 for the last time.


    From now on, you can log into the remote Linux server by just typing `ssh linode`:


    `$ ssh linode`

    `Linux (none) 3.9.3-x86_64-linode33`

    `#1 SMP Mon May 20 10:22:57 EDT 2013`

    `x86_64`

    `. . .`

    `Last login: Wed Jul 31 18:46:23 2013`

    `from ppp-94-64-21-97.home.otenet.gr`

    `mtsouk@ill140-253:~$`


    The first time you log into the remote server without typing your password, the
    following informative message will be on the screen:

    `Identity added: /Users/mtsouk/.ssh/id_rsa (/Users/mtsouk/.ssh/id_rsa)`


    ![](img/dd9251551a61a36067892b1cc68615b0_44_0.png)


    ![](img/dd9251551a61a36067892b1cc68615b0_44_1.png)


    # ## 09 Explaining the advanced profile file


    +   - The `times = true` line tells Unison to synchronise modification times.

    +   - The `maxbackups = 3` line tells Unison to keep the current file version
    plus three backups of it.

    +   - The `backup = Name` line tells Unison to back up over files.

    +   - The `backuplocation = central` which is the default option, tells Unison
    to keep all backups in a central location. If neither the backupdir preference
    nor the environment variable `UNISONBACKUPDIR` are set, the `.unison/backup` directory
    is used as the backup location. If set to local, then all backups will be kept
    in the same directory as the original files.

    +   - The `batch = true` option is a little tricky and you should be careful with
    it as Unison will ask no questions at all and non-conflicting changes will be
    propagated whereas conflicts will be skipped. Nevertheless, it is an essential
    option if you want to use Unison as a cron job.

    +   - The `ignore = Name (._,DS_Store)` line tells Unison to not synchronise files
    that end with `.DS_Store`.


    # ## 10 Using SSH without giving a password


    The single most time-saving thing you can do is to set up SSH so that you will
    not need to enter your password each time you want to synchronise your files and
    directories. The procedure is easy and involves the following three steps:


    1. Run `ssh-keygen -t rsa`


    You will have to enter a passphrase twice, so please do remember the passphrase!
    Two new files are going to be created: `~/.ssh/id_rsa` and `~/.ssh/id_rsa.pub`.


    2. You may need to create a directory called `.ssh` on the remote server if it
    does not already exist.


    ![](img/dd9251551a61a36067892b1cc68615b0_44_2.png)


    # ## 11 Two common Unison troubleshooting techniques


    There are times when things do not work as expected. Unison offers you many options
    that can help you both find and solve problems.


    The first option to try is the `-testserver` option that just connects to the
    remote server and then exits without synchronising any files.


    The second thing to do is to run the following command:


    `$ ssh remote.machine.domain `echo $PATH``


    The aforementioned command let you see whether the `PATH` is the same as when
    you log in using `ssh remote.machine.domain`; if the problem is with the `PATH`,
    check if the option `PermitUserEnvironment` in `/etc/ssh/sshd_config` is set to
    ‘no’ and change it to ‘yes’.


    # ## 12 Unison hints and tips


    +   - The first two or three times you use a new profile, double-check if everything
    works as expected.

    +   - You do not need to use every parameter that Unison supports, just the ones
    that will do your job!

    +   - You can troubleshoot Unison using the `-debug all` command-line option.
    It will generate lots of output useful for debugging.

    +   - The more you use Unison, the more you will understand its practicality.

    +   - You should be very careful with your backup options, especially `maxbackups`,
    as it can take up too much space on your computer.

    +   - You can use Unison to securely exchange files between computers.

    +   - If a Windows machine is involved in the synchronisation process, be careful
    with file and directory permissions.

    +   - For non-critical data files you may run Unison once a day, but for critical
    data you should run it more often.

    +   - Unison cannot replace regular backups!

    +   - When you are making a new profile, either start simple or use an existing
    one as a starting template. Add the extra functionality and features while making
    sure that you always have a working profile.


    ![](img/dd9251551a61a36067892b1cc68615b0_44_3.png)'
  merge: -1
