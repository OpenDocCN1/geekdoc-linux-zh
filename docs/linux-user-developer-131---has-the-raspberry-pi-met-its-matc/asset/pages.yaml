    # # Master Vim in easy steps


    Take a step ahead, learn some advanced features and get more productive with the
    Vim editor


    # Advisors


    Himanshu Arora is a software programmer, open source enthusiast and Linux researcher.
    His articles have been featured on IBM developerWorks, Computerworld and in Linux
    Journal. He (along with some other Linux freaks) blogs at mylinuxbook.com


    # Resources


    Vim: www.vim.org/download.php


    Thanks to a steep learning curve, many people either avoid using Vim or use it
    on a very basic level. If you''re guilty of either of these then you''re really
    missing out.


    Vim, first released in November 1991, is a command-line-based text editor that
    was developed by Bram Moolenaar as an improved Vi clone for Amiga platform. Besides
    including all the features of the popular Vi editor, it also contains a lot of
    new features and so derives its name – from ''Vi improved''. As well as being
    a text editor, Vim can be used as an integrated development environment by software
    programmers. Vim provides a wide range of features, but as it is a command-line
    utility it has a steep learning curve. Please note that Vim is not a word processor,
    which means that you cannot do layout-related changes with it.


    While you will get to know about the real strengths of the Vim editor once you
    master it, on the whole some of the prominent pros include fast text editing (because
    of little to almost no use of the mouse) and easy execution from anywhere on the
    command line. There are also many GUI front-ends (like gVim) available for Vim.


    Although it is command-line based, Vim has a loyal following and is extensively
    used by system administrators and software programmers. Though it is hard to learn
    and understand all the features that Vim provides, in order to reap its real benefits
    it is essential to master Vim for your day-to-day work.


    Through this article you will learn how to work with multiple files, how to indent
    and fold code, how to search and replace keywords, how to split the Vim window
    horizontally/vertically, and many other related features provided by Vim.


    **Note**: This article assumes that you have some basic knowledge (opening, editing,
    saving and closing a file) of the Vim editor.'
