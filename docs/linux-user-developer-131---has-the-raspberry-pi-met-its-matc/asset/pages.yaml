- pgno: 42
  md: '# Synchrornise your files with Unison


    Use the Unison command-line tool to sync files between computers


    TUTORIAL


    ![](img/dd9251551a61a36067892b1cc68615b0_42_0.png)


    # 01 Installing Unison


    Most Linux distributions have Unison as a package ready for installation so that
    you do not have to compile it. At the time of writing, the current stable version
    of Unison is 2.49.102. Note that every machine that is part of the synchronisation
    process must have a copy of the command-line version of Unison installed. Additionally,
    this copy of Unison should be located inside one of the directories of the default
    PATH shell variable. Assuming you''re on a Debian-based system, simply type:


    ```

    sudo apt-get install unison

    ```


    To find the version of Unison you are using, just type the following command:


    ```

    unison -version

    ```


    ![](img/dd9251551a61a36067892b1cc68615b0_42_1.png)


    # 02 Unison profile files


    Unison can run from the command line without using any configuration files (profiles),
    but using a profile file greatly simplifies its use as having a profile file does
    not prevent you from adding extra command-line options (although this article
    will not deal much with such options).


    In the rare event that you have troubles working with Unison, you may run it using
    the `-debug all` command-line option so that you can better trace and resolve
    errors.


    ![](img/dd9251551a61a36067892b1cc68615b0_42_2.png)


    # 03 Synchronising files on the same computer


    Although Unison was initially developed with synchronising files located on different
    machines in mind, you can synchronise files located on the same computer using
    one of the following two methods:


    +   - Using localhost as the remote machine name.

    +   - Using only local directory paths for both root = lines.


    Your advisor prefers the second way as it does not require the SSH server to be
    up and running. The Unison profile file is called localFiles.prf and is located
    inside the ~/.unison directory. The following two lines to work on the same machine,
    as they do not include a remote machine:


    ```

    root = /Users/mtsouk

    root = /tmp

    ```


    # 04 Synchronising files with another computer


    Given a profile name called articles.prf that is located inside the ~/.unison
    directory, you can tell Unison to use it by executing the following command:


    ```

    $ unison articles

    ```


    The remote machine declaration starts with root = ssh:// . There are rare occasions
    — usually when the user changed a file on both computers before synchronising
    — where Unison will not be able to determine whether a file or directory has changed
    on the local or the remote server. In such situations, Unison kindly asks for
    your help so that it will not mistakenly proceed using the wrong version.


    ![](img/dd9251551a61a36067892b1cc68615b0_42_3.png)'
  merge: -1
  img_proc: true
- pgno: 43
  md: "# Synchronise your files with Unison\n\n# 05 Running Unison using a simple\
    \ profile file\n\nSome basic things you need to know about Unison profiles are:\n\
    \n- The default backup level is 2, which controls how many previous versions of\
    \ each file are kept not including the current version of the file. So the default\
    \ backup level keeps two backup copies of a file. This parameter for setting the\
    \ backup level is called maxbackups.\n\n+   * You can tell Unison not to keep\
    \ file backups by not adding any backup options inside a Unison profile file.\n\
    +   * Unison profile files support Unicode characters.\n+   * The log file option\
    \ tells Unison to keep a log file called unison.log inside the .unison directory.\n\
    +   * Sometimes, network problems prohibit file synchronisation, but Unison's\
    \ error messages are denoting the problem:\n\n```\n5 unison articles\nContacting\
    \ server ... \nConnection closed by 109.x.x.y.y.zzz.\nFatal error: Lost connection\
    \ with the server\n```\n\n# 06 Explaining the profile file\n\nLines starting with\
    \ a # denote comments and are not processed any further. Exactly two lines must\
    \ start with root = . They declare the machines (one is always the local computer)\
    \ that are going to participate in the syncing process as well as the directories\
    \ that are considered the root directories for each machine. After those important\
    \ declarations, the actual directories that are going to be synced are listed.\
    \ In this example we have just one directory (one path = line). Its full path\
    \ is /Users/mtsouk/docs/article/working for the local machine and /home/mtsouk/docs/article/working\
    \ for the machine called linode (an IP alias inside /etc/hosts). You can have\
    \ as many path entries as you want. All files are synced except the ones that\
    \ match the ignore option. You can also have as many ignore = lines as you want\
    \ and can use regular expressions in them. The backup option tells Unison to keep\
    \ backups of all files.\n\n```\n# Mihalis Tsoukalos\n#\n# Friday 05 July 2013\n\
    #\nroot = /Users/mtsouk\nroot = ssh://linode/home/mtsouk\n\n# Paths to synchronize\n\
    path = docs/article/working\n\n# Log file\nlogfile = /Users/mtsouk/.unison/unison.log\n\
    \n# Backup files\nbackup = Name *\nignore = Name *.DS_Store\nignore = Name .DS_Store\n\
    ```\n\n# 07 The .unison directory\n\nMost of the Unison housekeeping happens inside\
    \ the .unison directory which resides in the user's home directory. Unison keeps\
    \ the following data there:\n\n+   * Its profile files including the default profile\
    \ called default.prf.\n+   * Its backup files, if you decided to have central\
    \ backups.\n+   * The status file for each used profile.\n+   * The Unison log\
    \ file, should you tell it to keep one. You can put it anywhere you want but it\
    \ is very convenient for it to reside there.\n+   * Unison creates lock files\
    \ there, during synchronisations, which it deletes when finished.\n+   * Note\
    \ It is not recommended to synchronize the whole .unison directory. Synchronising\
    \ just the profiles is okay.\n\n# 08 A more advanced Unison profile file\n\nThe\
    \ contents of the advanced.prf file are as follows:\n\n```\nroot = /Users/mtsouk\n\
    root = ssh://linode/home/mtsouk\ntimes = true\nbatch = true\n\n# Log file\nlogfile\
    \ = /Users/mtsouk/.unison/unison.log\n\n# Paths to synchronize\npath = code/C\n\
    \n# Backup files\nbackup = Name *\nbackuplocation = central\nmaxbackups = 3\n\
    ignore = Name {Thumbs.db}\nignore = Name {.DS_Store}\nignore = Path {Samples.lnk}\n\
    ```\n\n![](img/dd9251551a61a36067892b1cc68615b0_43_0.png)\n\n![](img/dd9251551a61a36067892b1cc68615b0_43_1.png)"
  merge: -1
  img_proc: true
