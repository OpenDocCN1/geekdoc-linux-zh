  md: '# Intel’s big fish in a little pond


    How the MinnowBoard came about


    INTERVIEW


    > “The open hardware model is very attractive in empowering your customers”


    ![](img/dd9251551a61a36067892b1cc68615b0_8_0.png)


    MinnowBoard includes PC architecture standards including PCIe, USB and SATA, as
    well as embedded standards such as SPI, I2C, GPIO and even (a CAN bus) for automotive
    applications. It was designed with the Yocto Project in mind, which is an industry-wide
    standard for embedded Linux.


    The MinnowBoard is open hardware – how important do you think that will be to
    its success in the market?


    “The open hardware model is very attractive in empowering your customers and allowing
    them to innovate in ways you can’t anticipate. Since people are free to reproduce
    and customise the MinnowBoard, the sky is the limit with this board’s potential.
    I think this will be fundamental to [its] success.


    “Keep in mind that open hardware is meaningful not only if design files are available,
    but when all the parts are available through accessible distribution channels
    and the board’s price is not subsidised. If someone wants to rebuild it, or rebuild
    something similar, they can at about the cost it’s being sold for now. Not many
    boards can offer that potential.”


    What made Intel get involved in hobbyist-level embedded computing development?


    “We wanted MinnowBoard to become a useful platform for Yocto Project development
    that encouraged experimentation and the pursuit of fun projects in addition to
    more serious embedded applications, as a board we would use in Yocto Project training
    courses. And we needed it to be flexible enough so you could do interesting things
    in a classroom-style setting, which lines up with what hobbyists want, too.”


    With the board now in the hands of early adopters, have you seen any particularly
    innovative or exciting applications for the MinnowBoard emerge from the community?


    “It’s still a bit early for me to have good visibility into this, as the board
    has only been available for about three weeks [at the time of the interview].
    As I hear about community projects, I do intend to highlight them on our social
    media channels.


    “I am aware of someone who plans to use a MinnowBoard as part of a quality control
    system for 3D printers by making use of computer vision capabilities. I’ve also
    heard that folks in the FPGA design community are quite interested in the MinnowBoard
    due to its high-speed expansion capabilities. There’s also a group of students
    interested in building out learning exercises on the MinnowBoard, as a way to
    advance their embedded design skills.”


    Intel has something of a mixed history with the open source community – in particular
    in failing to release graphics drivers for selected Atom processor models. With
    the MinnowBoard being truly open, does this signal a shift in attitude towards
    the open source and open hardware communities at Intel?


    “The Open Source Technology Center at Intel is full of incredibly talented, well-known
    and passionate people who care deeply about openness. In recent years this group
    has grown dramatically in both size and influence, and it reflects the reality
    of the increased influence open source plays in the global software ecosystem.


    “Intel’s Core graphics have open source drivers that work with hardware acceleration,
    and the upcoming Bay Trail Atom platform makes use of it. This will address the
    issue you mentioned with graphics drivers on Atom. I’m looking forward to this,
    and I think Intel is definitely moving in the right direction in this regard.”


    Intel and CircuikitCo have published a list of current and proposed add-on boards,
    dubbed Lures, for the MinnowBoard. Is there a particular add-on you would like
    to highlight?


    “One of the Lures that I’m sure will be quite popular is the Trainer Lure – the
    one based on an Arduino [microcontroller]. Combining the computational power of
    MinnowBoard with the embedded input/output capabilities and community of Arduino
    will open up a lot of interesting possibilities.”


    Queens Bay


    The code name for the combination of an Intel Atom E6iFx-series processor with
    the E620T controller hub (code-named Tunnel Creek and Topcliff respectively),
    Intel launched the Queens Bay platform in 2010 with the embedded market firmly
    in mind.


    Initially, the company targeted in-car computer systems for navigation and entertainment
    – so-called “infotainment” devices – but claimed the platform would be equally
    at home in gaming, communications, point-of-sale, industrial and digital signage
    applications.


    The Tunnel Creek family of processors offer true system-on-chip designs, offloading
    much of the circuitry to the E620T chip, but the CPU, a graphics processor supporting
    up to two simultaneous displays, an audio controller and a hardware video codec
    on die some 48 per cent smaller than its predecessors.


    Until the launch of the MinnowBoard, however, using Queens Bay in hobbyist applications
    was almost impossible: Intel’s official development board was provided only to
    registered hardware partners, and came with the expectation that you would be
    placing an order for a few thousand processors once you had finished your design.


    How critical is Linux and the Yocto Project to the MinnowBoard’s success?


    “We designed the board to be a Yocto Project development platform, and Yocto produces
    embedded Linux distros. So it’s pretty core to our purpose. It was the primary
    motivation behind the project itself – to my knowledge, MinnowBoard is the first
    hardware platform designed with the Yocto Project in mind. But most people using
    the MinnowBoard may have no knowledge of or interest in the Yocto Project – that’s
    okay, too.”


    Is the MinnowBoard likely to be the first in a family of open development boards
    from Intel, or is it merely an experiment for the company?


    “Here are a lot of people within Intel who are excited about open hardware. I
    can’t speak [about] any specific future product plans, but I think the future
    is very, very bright.”'
