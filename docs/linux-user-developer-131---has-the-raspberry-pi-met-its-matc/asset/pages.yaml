  md: '# Your view


    Your source of Linux news and views


    +   - Contact us...

    +     - Register and post your comments...

    +     - www.linuxuser.co.uk/forums/

    +     - Email us directly...

    +     - linuxuser@imagine-publishing.co.uk


    # YOUR VIEW

    Linux User Letters


    Your opinions about the magazine, Linux and open source


    ![](img/dd9251551a61a36067892b1cc68615b0_93_0.png)


    # Piece of Pisi


    I remember a while ago you talked about Pisi Linux, an alternative to Pardus that
    was a bit more like the original. I was sad to see that DistroWatch refuses to
    even list Pisi Linux because someone trolled them, telling them it was not active,
    setting up fake Pisi Linux sites etc. DistroWatch apparently decided they would
    remove it from their lists. Very sad and disappointing on the part of DistroWatch.
    I hope that when it finally


    Pisi Linux is currently in beta


    reaches stable release they''ll add Pisi back to the database, as the older Pardus
    es were some of my favourite distros!


    Mark Doyle


    It''s a shame that DistroWatch took the stance. Going by the Pisi team''s side
    of the


    story, it seems like DistroWatch were duped; however, the folks over at DistroWatch
    haven''t responded to the Pisi team since their explanation. The beta for it is
    out now, but Pisi is not back on DistroWatch just yet. Look out for a review of
    the full version when it''s finally released.


    # THREAD BARE

    Way of the future


    Things are heating up in the display server space, as both Wayland and Canonical''s
    Mir are set to try to replace the X server shortly. Richard Hillisley''s piece
    on Wayland in issue 127 inspired some debate on the website about replacing X.
    Join in the conversation here: bit.ly/LUDWay


    ![](img/dd9251551a61a36067892b1cc68615b0_93_1.png)


    Wayland is intended as a simpler replacement for X


    +   Henrik Danielson said:

    +   I can tell, one problem is that Mir is intentionally incompatible with Wayland.


    +   Bob Robert said:

    +   I use the network display functionality of X on a regular basis. The switch
    to Wayland is fine by me (I''m a user, not a programmer) so long as I can still
    ''ssh -X'' and launch GUI applications that display on my local machine. That
    X did network transparency ''mainline'' and Wayland would do it with a ''plug-in''
    is actually unimportant to me. What matters is that it DOES it. Its functionality
    I use, and want.


    things shouldn''t be that bad either; because Mir/Wayland support is at the toolkit
    level. The biggest burden will probably be on the toolkits, though: having to
    have and support two back-ends in addition to X (because X will not be totally
    going away any time soon).


    +   bwait47 said

    +   I don''t think the situation is quite as bad as its seems. Both Mir and Wayland
    have several major similarities in their architecture, such as using EGL. For
    drivers, theoretically it should not be difficult to support both as long as they
    provide EGL support. For applications


    +   Gene Moesher said:

    +   Keith Flickard asks: "How many of those applications care about network transparency,
    which was one of the original headline features of X? How many of them care about
    ICCCM compliance? How many of them care about X at all? The answer to all of those
    questions, of course, is ''very few.'' And if we all are among the ''very few,''
    then what does the future hold for us, Keith?"'
  merge: -1
  img_proc: true
- pgno: 94
  md: '# Your view


    Pisi Linux, Wayland vs Mir, Specialist distros, Pi projects


    # LETTERS


    ![](img/dd9251551a61a36067892b1cc68615b0_94_0.png)


    Some specialist distros are more than a selection of apps


    ![](img/dd9251551a61a36067892b1cc68615b0_94_1.png)


    # Android Magazine


    With more and more Android features being merged back into the Linux kernel, it''s
    becoming easier to develop for one of the most popular mobile operating systems
    around. With over 25 billion app downloads, over 1 billion app downloads, and
    over 500 million Android devices worldwide, there''s a huge audience ready to
    consume apps. For a more Android-driven editorial, look to our sister mag Android
    Magazine. It''s our publication dedicated to the platform. Along with news and
    reviews to keep you up to date on everything Android, there are also tutorials
    and advice on developing and hacking your hardware. Find out more at www.littlegreendrobot.com.


    # Specialist distros


    Okay, I am a little confused with the whole distro designed for specific job trend.
    If I want to run audio applications in Windows, Mac or any other OS, I install
    the programs I want. Why oh why with Linux do we see this approach of “just install
    the audio distro for the best audio environment”? What a waste! Instead of customising
    an existing distro and having a nice “aptitude/yum install audio-env” we get all
    the overhead of maintaining a distro just for the applications?


    Isn''t it time we separated the application from the OS and ignored any attempts
    by people to integrate the two?


    Colin McDermott


    There''s no specific reason why you can''t do this anyway – a lot of people will
    probably be fine with a standard Fedora or Ubuntu install for any of their specialised
    needs. However, some distros do more than just come with a selection of themed
    default packages – distros like AV Linux go the extra mile and customise the kernel
    specifically for AV software. Not everyone has the skills to do that in Linux,
    so these kind of distros do serve a purpose. The same with some lightweight distros.
    It''s about choice, and this offers a lot more choice for people.


    Raspberry Pi projects you had. I tried out a couple of them and was pleased with
    the results; there are really so many things you can do with the Raspberry Pi!
    I now use my Raspberry Pi for all my media centre needs and haven''t looked back
    – I even have a spare SD card for using it as a portable access point for when
    I go travelling. Will you be doing another feature like this in the future? If
    so, will I be able to suggest some projects? I have a few in mind which I feel
    will properly make use of the Raspberry Pi.


    Thanks again,


    Phillip Cordan


    We''re glad you enjoyed the projects, Phillip. We always love to hear about Raspberry
    Pi projects ideas from all our readers, even just to feature on their own in the
    magazine. We usually try to get at least one Raspberry Pi related tutorial or
    feature in the magazine every month – for example, in this issue you can find
    how to turn that portable access point into a secure router with our Onion Pi
    tutorial starting on page 46. You can send any ideas to the email address at the
    top of this page.


    +   - **Raspberry Pi projects**

    +   bring out the practical side of Linux


    ![](img/dd9251551a61a36067892b1cc68615b0_94_2.png)


    # More Pi


    I''ve just finished reading issue 129 of your magazine and was very inspired by
    the ten


    ![](img/dd9251551a61a36067892b1cc68615b0_94_3.png)


    ![](img/dd9251551a61a36067892b1cc68615b0_94_4.png)'
