  md: "# # Tutorial\n## Make extensions for XBMC with Python\n### LinuxDeveloper\n\
    \nSimilarly for Vimeo:\n\n```\n```python\ndef getVimeoUrl(id):\n    url = \"plugin://plugin.video.vimeo?path=\\\
    \"root\\\"&action=play_video&videoid=\" + id\n    return url\n```\n```\n\nAnd\
    \ for Dailymotion:\n\n```\n```python\ndef getDailyMotionUrl(id):\n    url = \"\
    plugin://plugin.video.dailymotion.com?url=\" + id + \"&mode=playVideo\"\n    return\
    \ url\n```\n```\n\nOnce we have the video URL resolved into the respective plugin,\
    \ playing it is very simple.\n\n```\n```python\ndef playVideo(url):\n    listItem\
    \ = xbmcgui.ListItem(path=url)\n    xbmcplugin.setResolvedUrl(pluginhandle, True,\
    \ listItem)\n```\n```\n\n# ## 13 Populating plug-in content listing\n\nxbmcplugin\
    \ contains various routines for handling the content listing inside the plug-ins\
    \ UI. The first step is to create directory entries which can be selected from\
    \ the XBMC UI. For this we will use a function called xbmcplugin.addDirectoryItem.\n\
    \nFor our convenience we will be abstracting addDirectoryItem to suit it to our\
    \ purpose, so that we can set name, URL, mode, icon image and type easily.\n\n\
    ```\n```python\ndef addDir(name, url, mode, image, type=\"\"):\n    u = sys.argv[0]\
    \ + \"?url=\" + urllib.quote_plus(url) + \"&mode=\" + str(mode) + \"&type=\" +\
    \ str(type)\n    ok = True\n\n    liz = xbmcgui.ListItem(name,\n        iconImage=\"\
    DefaultFolder.png\",\n        thumbnailImage=image)\n    liz.setInfo(type=\"Video\"\
    ,\n        infoLabels={\"Title\": name})\n    ok = xbmcplugin.addDirectoryItem(handle=int(sys.argv[1]),\
    \ url=u, listItem=liz, isFolder=True)\n    return ok\n```\n```\n\nOn the same\
    \ lines, we can build a function to place links as well...\n\n```\n```python\n\
    def addLink(name, url, mode, iconimage, description, date):\n    u = sys.argv[0]\
    \ + \"?url=\" + urllib.quote_plus(url) + \"&mode=\" + str(mode)\n    ok = True\n\
    \    liz = xbmcgui.ListItem(name,\n        iconImage=\"DefaultVideo.png\",\n \
    \       thumbnailImage=iconimage)\n    liz.setInfo(type=\"Video\",\n        infoLabels={\"\
    Title\": name, \"Plot\": description, \"Aired\": date})\n    liz.setProperty(\"\
    IsPlayable\", \"true\")\n    ok = xbmcplugin.addDirectoryItem(handle=int(sys.argv[1]),\
    \ url=u, listItem=liz)\n    return ok\n```\n```\n\nBased on the abstractions we\
    \ have just created, we can create the base functions which will populate the\
    \ content. But before we do that, let's first understand how Reddit works. Most\
    \ of the Reddit content filters are provided through something called Subreddits.\
    \ This allows you to view discussions related to a particular topic: in our plug-in\
