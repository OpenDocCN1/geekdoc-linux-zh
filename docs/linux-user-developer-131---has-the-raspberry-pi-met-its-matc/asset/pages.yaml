  md: '# Master Vim in easy steps


    Learn some advanced features of Vim


    # TUTORIAL


    ![](img/dd9251551a61a36067892b1cc68615b0_62_0.png)


    # 01 Work with multiple files


    While most regular users use Vim to edit one file at a time, it can also be used
    to edit multiple files in parallel. To open multiple files with the Vim editor,
    just provide names of all these files as arguments to the **vim** command. The
    first file is **displayed by default**. Type `gn` to switch to the next file,
    `gp` (or `gN`) to switch to previous file, `gf` to switch to first file, `gb`
    to switch to last file and `gq` to close the file.


    # 02 Work with multiple files


    Sometimes it is required to open a new or an existing file while editing an already
    opened set of files. Well, this can be done by typing `:e` followed by the filename
    (along with a complete path if it’s not located in the current working directory).


    ![](img/dd9251551a61a36067892b1cc68615b0_62_1.png)


    # 03 Get list of currently opened files in Vim


    To get the list of files currently opened in the Vim editor, just type `ls`. This
    will display list of opened files along with other information like the current
    line number of the cursor in a file, file in current active window (represented
    by `%a), file in previous active window (represented by `#`) etc. Switch between
    current and previous active windows by typing `gtb`.


    # 04 Use wildcard characters


    Vim also supports wildcard characters (like `*`, `?` etc) while opening multiple
    files at a time. This is especially useful in cases where multiple log files begin
    with a common set of characters like the current date (2013-06-05---log), or where
    multiple programming source files have same language extension such as `*.c` or
    `*.cpp`.


    ![](img/dd9251551a61a36067892b1cc68615b0_62_2.png)


    ![](img/dd9251551a61a36067892b1cc68615b0_62_3.png)


    # 05 Copy-paste across the files


    Another frequent requirement is to copy from one file and paste into another.
    For this, you need to split the Vim window to open both files. This can be done
    either by using the `-o` option with the `vim` command (`vim -o <file1-name> <file2-name>`),
    or by opening a file with `vim <file-name>`, then opening the second file in split
    window mode from within the active Vim window with `:split <file2-name>`. To switch
    cursor control between the two windows, press `Ctrl+w` (a couple of times).


    Copy-paste operation across the files can be done as follows: open files in split
    mode (as explained above); copy the required text from one file; press `Ctrl+w`
    to switch the control to the other file; then paste the copied text.


    You can also split a Vim window vertically. All you need to type is `:vsplit <file-name>`
    from within an active window.'
