  md: "# Feature\nAndroid Studio\n\n# Make your first application\n\nCreating your\
    \ first app in Android Studio is easy, and we'll start with the simplest one of\
    \ all – the classic *Hello World*.\nAll basic apps, when created, have Hello World\
    \ already displayed within them – what we're going to do here is learn how to\
    \ simply make Hello World in Android, and what other simple tasks we can do in\
    \ it.\n\n# 01 Visually\n\nTo do it visually, simply select *Plain TextView*, and\
    \ place it on the display. Double-click it and type in 'Hello World!' All static\
    \ text can be placed this way onto the interface, and it will create the necessary\
    \ code in the text view as well.\n\n# 02 Relative text\n\nThe relative layout\
    \ should be included in the code by default. Create a text parameter by opening\
    \ up triangle brackets with: `<>TextView` ...which we will use to display 'Hello\
    \ World!'\n\n# 03 Hello code\n\nTo add 'Hello World' to the Text parameter we\
    \ put in `android:layout_width=\"wrap_content\"` `android:layout_height=\"wrap_content\"\
    ` `android:text=\"Hello World!\"` `android:id=\"@+id/textView\"/>`\nThe layout\
    \ variables can also be set as fixed pixel width/height.\n\n# 04 Quit button\n\
    \nThe file we're editing now is just the display. To do something, we need to\
    \ start editing the java file. While we're still in the .xml, place a button and\
    \ give it the caption 'Quit'. Open up `MainActivity.java` from the Projects column\
    \ before we continue.\n\n# 05 Imported\n\nNow add these imports to the top of\
    \ the code: `import android.view.Menu;` `import android.view.View;` `import android.view.View.OnClickListener;`\
    \ `import android.widget.Button;`\n\n# 06 Coded actions\n\nAdd the following code\
    \ below the line `setContentView(R.layout.activity_main);`: `Button button = (Button)\
    \ findViewById(R.id.button)` `button.setOnClickListener(new OnClickListener()\
    \ {`\n\n`@Override` `public void onClick(View v) {` `finish();` `System.exit(0);`\
    \ `}` `});`\nThis allows us to use some extra Android functions to press and use\
    \ the Quit button.\n\n# Code listing\n\n+   ■ **Package name**\n+   - The name\
    \ of your package according to the Android system\n+   \n+   ■ **Import functions**\n\
    +   - Import the various functions we need to get the code to work on an Android\
    \ device\n+   \n+   ■ **MainActivity class**\n+   - The MainActivity class includes\
    \ all the functions in our main activity that we created\n+   \n+   ■ **Main layout**\n\
    +   - This sets what the main layout, and displays it\n+   \n+   ■ **Quit button**\n\
    +   - The section containing the code to make sure our button (with id button)\
    \ properly quits the app with System.exit\n+   \n+   ■ **Settings menu**\n+  \
    \ - This creates the Android settings menu that appears on the top of the app\n\
    \n```\n```\npackage com.linuxuser.helloworld;\n\nimport android.os.Bundle;\nimport\
    \ android.app.Activity;\nimport android.view.Menu;\nimport android.view.View;\n\
    import android.view.View.OnClickListener;\nimport android.widget.Button;\n\npublic\
    \ class MainActivity extends Activity {\n\n    @Override\n    public void onCreate(Bundle\
    \ savedInstanceState) {\n        super.onCreate(savedInstanceState);\n       \
    \ setContentView(R.layout.activity_main);\n\n        Button button = (Button)\
    \ findViewById(R.id.button);\n        button.setOnClickListener(new OnClickListener()\
    \ {\n            @Override\n            public void onClick(View v) {\n      \
    \          finish();\n                System.exit(0);\n            }\n       \
    \ });\n    }\n\n    @Override\n    public boolean onCreateOptionsMenu(Menu menu)\
    \ {\n        // Inflate the menu; this adds items to the action bar if\n     \
    \   it is present.\n        getMenuInflater().inflate(R.menu.main, menu);\n  \
    \      return true;\n    }\n}\n```\n```"
