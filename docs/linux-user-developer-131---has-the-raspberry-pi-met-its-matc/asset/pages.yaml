    We are on a tram to Manchester, tapping away on our phone as we update one of
    our blogs, engrossed in the words and thinking little about the underlying code
    which is making all of this possible. Just as the last few words are written,
    the tram stops and we make our way to the escalator to Piccadilly Station about
    to meet the man who created the bethemoth that is WordPress, the very blogging
    platform we had been using throughout the journey.


    Our meeting is being held at a railway station because Mike Little, who is from
    Stockport, is a busy man. He has already had one meeting before we shake hands
    and he is due to have another. We decide to sit in a coffee shop and he grabs
    a sandwich before telling us about his latest venture, which is – unsurprisingly
    given the software is used by 18.9 per cent of the top 10 million websites – very
    much related to WordPress.


    Little is currently working on a series of screencasts which showcase how WordPress
    can be used, explaining the fundamentals of it to encourage more people to get
    involved with blogging using the platform. It’s a slow process – “It takes about
    an hour to edit a minute’s footage,” he says – but he’s getting there. The idea
    is that the screencasts will form a paid-for online course. “I want them to be
    better than anything else that is out there, so they have to be done right,” he
    says. “There is a lot of rubbish being made where you get someone just filming
    what they are doing and there are lots of ums and ahs and backtracking. My screencasts
    won’t be like that and people will certainly get value for money.”


    Little, who also teaches WordPress to classes face-to-face, continues to work
    with WordPress for professional clients too. After all, if he cannot produce a
    killer website for companies and organisations using the software, then nobody
    can. It is fitting, then, that he has worked with Downing Street on government
