  md: "# # Make extensions for XBMC with Python\n\nUse Python to create a new plug-in\
    \ for XBMC\n\nTUTORIAL\n\n```\n```python\nimport xbmcgui\nimport xbmcaddon\n```\n\
    ```\n\nApart from `xbmcplugin`, `xbmcgui` and `xbmcaddon`, the rest are all standard\
    \ Python libraries which are available on PyPI (Python Package Index) via pip.\
    \ You will not need to install any library yourself since the Python runtime for\
    \ XBMC has all the components built in.\n\n`urllib` and `urllib2` help in HTTP\
    \ communication. `socket` is used for network I/O; `re` is used for regular expression\
    \ matching; `sqlite3` is the Python module for accessing an SQLite embedded database;\
    \ `xbmcplugin`, `xbmcgui` and `xbmcaddon` contain the XBMC-specific routine.\n\
    \n# ## 10 Initialising\n\nDuring the initialisation process, we will be reading\
    \ various settings from `settings.xml`. Settings can be read in the following\
    \ way:\n\n```\n```python\naddon = xbmcaddon.Addon()\nfilterRating = int(addon.\n\
    \    getSetting(\"filterRating\"))\nfilterVoteThreshold = int(addon.\n    getSetting(\"\
    filterVoteThreshold\"))\n```\n```\n\nIn order to read settings of type bool you\
    \ will need to do something like:\n\n```\n```python\nfilter = addon.getSetting(\"\
    filter\")\n== \"true\"\n```\n```\n\nWe are also setting the main URL, plug-in\
    \ handle and the user agent for it:\n\n```\n```python\npluginhandle = int(sys.argv[1])\n\
    urlMain = \"http://www.reddit.com\"\nuserAgent = \"Mozilla/5.0 (Windows NT 6.2;\
    \ WOW64; rv:22.0) Gecko/20100101 Firefox/22.0\"\nopener = urllib2.build_opener()\n\
    opener.addheaders = [('User-Agent', userAgent)]\n```\n```\n\n# ## 11 Reading localised\
    \ strings\n\nAs mentioned, XBMC uses `strings.xml` to serve up the text. In order\
    \ to read those strings, you will need to use `getLocalizedString`.\n\n```\n```python\n\
    translation = addon.\ngetLocalizedString\ntranslation(30002)\n```\n```\n\nIn this\
    \ example, `translation(30002)` will return the string \"Hot\" when running in\
    \ an English environment.\n\n| idFile | idPath | strFilename | playCount | lastPlayed\
    \ | dateAdded |\n|--------|--------|-------------|-----------|------------|-----------|\n\
    | 1      | 1      | plugin./plugin | | 2013-08-06 22:47 |           |\n| 2   \
    \   | 2      | plugin./plugin | 1         | 2013-08-07 22:42 |           |\n|\
    \ 3      | 2      | plugin./plugin | 1         | 2013-08-08 00:09 |          \
    \ |\n| 4      | 2      | plugin./plugin | 1         | 2013-08-08 00:55 |     \
    \      |\n| 5      | 2      | plugin./plugin | 1         | 2013-08-08 00:58 |\
    \           |\n\n\n# ## 12 Building helper functions\n\nIn this step we will look\
    \ at some of the important helper functions.\n\n**getDbPath():** This return the\
    \ location of the SQLite database file for video. XBMC stores library and playback\
    \ information in SQLite DB files. There are separate databases for videos and\
    \ music, located inside the `.xbmc/userdata/Database` folder. We are concerned\
    \ with the video DB. It is prefixed with 'MyVideo'.\n\n```\n```python\ndef getDbPath():\n\
    \    path = xbmc.\ntranslatePath(\"special://userdata/\nDatabase\")\nfiles = os.listdir(path)\n\
    if file[:3] == 'MyVideos'\nlatest = video\nif file > latest:\n    latest = file\n\
    return os.path.join(path, latest)\n```\n```\n\n**getPlayCount(url):** Once we\
    \ have the database location, we can get the play count using a simple SQL query.\
    \ The `MyVideo` database contains a table called `files`, which keeps a record\
    \ of all the video files played in XBMC by filename. In this case it will be URL.\n\
    \n```\n```python\ndbPath = getDbPath()\nconn = sqlite3.connect(dbPath)\nc = conn.cursor()\n\
    \ndef getPlayCount(url):\n    c.execute('SELECT playCount FROM files WHERE strFilename=?',\
    \ [url])\nresult = c.fetchone()\nif result:\nresult = result[0]\nreturn int(result)\n\
    return 0\nreturn -1\n```\n```\n\nThe above table is an example of a files table.\n\
    \n**addSubreddit():** Our plug-in allows users to add their own Subreddit. This\
    \ function takes the Subreddit input from the user, then saves it in the subreddits\
    \ file inside the addon data folder.\n\nThe following sets the subreddits file\
    \ location:\n\n```\n```python\nsubredditsFile = xbmc.\ntranslatePath(\"special://profile/\n\
    addon_data/*+addonID*\"/subreddits\")\n```\nThis translates into `.xbmc/userdata/addon_data/plugin.video_ludent/subreddits`\n\
    ```\n\n```\n```python\ndef addSubreddit():\n    keyboard = xbmc.Keyboard('', 'translation(30001)')\n\
    if keyboard.isConfirmed() and\nkeyboard.getText():\nsubreddit = keyboard.\ngetText()\n\
    fh = open(subredditsFile, 'a')\nfh.write(subreddit+\\n')\nfh.close()\n```\n```\n\
    \nThis function also demonstrates how to take a text input from the user. Here\
    \ we are calling the Keyboard function with a text title. Once it detects the\
    \ keyboard, it writes the input in the subreddits file with a newline character.\n\
    \n**getYouTubeUrl(id):** When we locate a YouTube URL to play, we pass it to the\
    \ YouTube plug-in (plugin.video.youtube) to handle the playback. To do so, we\
    \ need to call it in a certain format.\n\n```\n```python\ndef getYouTubeurl(id):\n\
    \    url = \"plugin://plugin.video.youtube/`?/root/ ?/playlist=yt_video&id=videoID=\"\
    \ +\nid\nreturn url\n```\n```"
