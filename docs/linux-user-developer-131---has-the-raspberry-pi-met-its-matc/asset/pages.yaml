  md: '# MinnowBoard


    ![](img/dd9251551a61a36067892b1cc68615b0_9_0.png)


    Intel''s

    Atom-powered development board is the

    first to be Yocto Project-compatible and runs

    Angstrom Linux. While considerably more

    expensive than the Raspberry Pi, it utilises the

    x86 architecture so offers computational power

    more akin to desktop and mobile computers.

    It''s also a very complete package, offering both

    Angstrom Linux on a microSD card and a properly

    rated power supply in the box.


    However, without decent driver support for

    the Intel GMA 600 GPU and a DVI-over-HDMI

    video interface (no HD audio or HDCP encryption),

    it lacks the same multimedia appeal as the

    Raspberry Pi.


    +   * SATA support brings

    +   mass storage within easy

    +   reach of MinnowBoard

    +   * Analogue audio input is

    +   a definite step up from the

    +   Raspberry Pi

    +   * Four stilitss and bigger

    +   dimensions mean it

    +   towers over the RasPi

    +   * It has fewer GPIO pins,

    +   but includes two LEDs and

    +   four buttons to control

    +   * Gigabit Ethernet means

    +   faster networking – great

    +   if you''re planning a server

    +   * MinnowBoard needs

    +   a staggering 2.5A to

    +   keep its lights flashing


    ![](img/dd9251551a61a36067892b1cc68615b0_9_1.png)


    ![](img/dd9251551a61a36067892b1cc68615b0_9_2.png)


    +   * The MinnowBoard supports tinkerers with

    +   two on-board LEDs and six buttons

    +   * The stilitss increase airflow to help keep the

    +   1GHz Intel processor (under heat sink) cool


    ![](img/dd9251551a61a36067892b1cc68615b0_9_3.png)


    | | |

    |---|---|

    | Price | £162 |

    | Dimensions | 106 x 115mm |

    | Weight | 119g |

    | Operating system | Angstrom Linux (Yocto certified)

    supplied on microSD |

    | Processor | 32-bit Intel Atom E640T

    single-core at 1GHz |

    | Video | Embedded Intel GMA 600 |

    | Max resolution | 1366 x 768 (no HDCP encryption) |

    | Memory | 1GB DDR2 (shared),

    4MB SPI flash (firmware

