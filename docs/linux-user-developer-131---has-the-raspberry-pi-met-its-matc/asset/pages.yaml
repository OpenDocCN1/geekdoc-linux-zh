  md: '# # Welcome


    to issue 131 of Linux User & Developer


    ![](img/dd9251551a61a36067892b1cc68615b0_2_0.png)


    +   - Your team of Linux experts...


    **Mihalis Tsoukalos** has over 15 years of UNIX system administration and programming
    experience and has been using Linux since 1993. He is also proficient in Oracle
    database administration, Cisco IOS and Cocoa. In this issue Mihalis shows us how
    to sync files with Unison, a useful open source CLI tool (42–45).


    ![](img/dd9251551a61a36067892b1cc68615b0_2_1.png)


    **Himanshu Aurora** is a software programmer, open source enthusiast and Linux
    researcher. His articles have been featured on IBM developerWorks and Computerworld
    among others. He also blogs at mylinuxuxbook.com. This month he shows us how to
    make the most of Vim with his expert guide starting on page 62.


    ![](img/dd9251551a61a36067892b1cc68615b0_2_2.png)


    **Michael Reed** is a technology writer, and he’s been hacking away at Linux for
    over 15 years. He specialises in desktop Linux solutions among other things. In
    issue 131 Michael shows us how to get started with databases using LibreOffice
    – it’s easier than you might think. See his work on pages 34–37.


    ![](img/dd9251551a61a36067892b1cc68615b0_2_3.png)


    **Jon Masters** is a Linux kernel hacker who has been working on Linux for some
    18 years, since he first attended university at the age of 13. Jon lives in Cambridge,
    Massachusetts, USA and works for a large enterprise Linux vendor. You can find
    his indispensable Kernel Column on pages 22–23 this month.


    ![](img/dd9251551a61a36067892b1cc68615b0_2_4.png)


    **Gareth Halfacree** is our newest resident news reporter and brings us the latest
    from all over the open source ecosystem, starting on page 14. Also this issue,
    Gareth speaks to Intel about its new-day platform MinnowBoard on page 6. You can
    also find his review of this potential Raspberry Pi beater on pages 12–13.


    ![](img/dd9251551a61a36067892b1cc68615b0_2_5.png)


    **Rob Zwetsloot** studied aerospace engineering at university, using Python to
    model complex simulations in class. Along with tutorials, reviews and more this
    issue, Rob tells us which IDE we should be using (pages 72–77) and walks us through
    the build process of an Onion Pi (pages 46–49).


    ![](img/dd9251551a61a36067892b1cc68615b0_2_6.png)


    # ## This issue


    +   - MinnowBoard exclusive

    +   - Build add-ons for XBMC

    +   - Sync your files with Unison

    +   - Get started with Android Studio


    Welcome to the latest edition of Linux User & Developer, the UK and America’s
    favourite open source and Linux magazine.


    When you’re trying to make the best Linux and open source read in the world, there’s
    nothing more useful than feedback from readers. There’s little point us being
    here if we don’t aim to give you a healthy dose of what you want, so we pay close
    attention to what you have to say. But what have you been saying? After collecting,
    formatting, graphing and a lot of stubbie scratching, it’s clear many of you want
    more tutorials, bigger reviews and more introductory and intermediate developer
    content.


    As you’ll see this issue, we’ve dedicated more pages to tutorials and guides than
    ever before and we’ve even reformatted our distro reviews to make them more useful.
    We still need your help, though. If you’re keen to learn more about development
    in the open source field, we want to know what languages and frameworks you care
    about. We’ve been focusing very heavily on Python in recent months and intend
    to continue with that, but would you like to see Qt, Vala and C++ here too, or
    something else entirely?


    Let us know on Facebook and Twitter or simply drop me an email directly at russell.barnes@imagine-publishing.co.uk.


    ![](img/dd9251551a61a36067892b1cc68615b0_2_7.png)


    Russell Barnes, Editor


