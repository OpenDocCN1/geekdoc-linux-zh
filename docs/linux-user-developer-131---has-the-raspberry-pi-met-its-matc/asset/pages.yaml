  md: '# Opensource


    Your source of Linux news and views


    # THE OPEN SOURCE COLUMN


    # Fair game


    Simon fears the future of gaming is the future of technology


    ![](img/dd9251551a61a36067892b1cc68615b0_19_0.png)


    Simon Brew is a technology writer and editor, working across the Linux, Windows
    and Mac OS X platforms


    I play games. I’ve always liked playing games, and suspect I’ll continually sneak
    one or two in for the rest of my days. If you talk to my editor, he’ll obviously
    tell you that I’m the most reliable hitter of a deadline that he’s ever met and
    that my words arrive perfectly formed, requiring the barest of edits before they’re
    laid before your


    eyes. Scratch that: thanks to computer games, I’ve slippred over the proverbial
    door seconds before it slams shut more times than I’d care to admit.


    But games are changing. For someone who was brought up with the spirit of 8-bit
    computing, where anyone could spend a day or two locked up in their bedroom coding
    a game, the current climate is all a little disconcerting. Take Watch Dogs: this
    is a big game that a big publisher is making, that before its even been released
    has been put on the fast track for a big-screen movie. Or the evil of Candy Crush
    Saga, the mobile game revolution that doesn’t want any money off you up front,
    but is happy to take as much off you as it can once it’s got you cosy and sitting
    on the sofa.


    Games are interesting, and always have been, because they’re at the forefront
    of control. I think back to sticking dongles in the back of my Commodore Amiga
    to stop people pirating a game (naturally, the only people conveniently turned
    out to be the people who legitimately coughed up), or lining up pictures on wheels.


    Then, as technology evolved, so did the methodologies of control. PC gaming, through
    Windows, has taken things to scary levels. At one stage, the publisher Ubisoft
    implemented a system whereby you had to go online and prove you were legitimate
    once a day, else you weren’t allowed to play the title that you’d legally bought.
    Naturally, one day its servers weren’t working properly and people weren’t allowed
    to play their game. Those running piraties copies could.


    Microsoft has tried to implement a similar system with its upcoming Xbox One games
    console, although it’s had to perform a significant U-turn when the volcano of
    public opinion erupted. Still, those buying a game for an Xbox One machine will
    need to ‘activate’ it. A friendly word that, isn’t it? It sounds so reasonable
    and happy. Just do one thing and everything will be active and working. What could
    be easier? The truth, of course, is that it’s a further eradication of users’
    rights in the proprietary software sector.


    The problem is that what happens in videogaming increasingly becomes a dry-run
    for what we get in the broader technology ecosystem. Publishers know that people
    will endure a degree of hassle to play a game, and they take advantage of it ruthlessly.
    Now, we’re at a point where Adobe’s Creative Suite of tools won’t even be sold
    in a box any more – it’s the cloud version or bust, and a subscription. Someone’s
    been looking at the World Of Warcraft model.


    Even in the app sphere, where the spirit of the bedroom programmer should still
    be alive and well, there’s a corporate sheen that’s taking the fun off things.
    That Candy Crush Saga model has proven to be the proverbial grail for many, in
    that the appearance of free, open approach is just a disguise for one of the most
    ruthless gaming money-making machines I’ve seen in recent times.


    It’s why the good ones need supporting, of course. But for all the marches of
    progress, the loss of an ethos has become real collateral damage.


    ![](img/dd9251551a61a36067892b1cc68615b0_19_1.png)


    King’s *Candy Crush Saga* – a ruthless money-making machine'
