  md: '![](img/dd9251551a61a36067892b1cc68615b0_5_0.png)


    Scott Garman is a Yocto Project engineer at Intel, and the company''s evangelist
    for the MinnowBoard


    ![](img/dd9251551a61a36067892b1cc68615b0_5_1.png)


    # # Intel’s big fish in a little pond


    We chat to Scott Garman about Intel’s first foray into the world of Linux-powered
    open hardware development systems


    **Scott Garman, the man Intel has appointed as the ‘evangelist’ for its first
    steps into open hardware development, has a history of embedded development.**
    “I''m not a hardcore kernel hacker,” he tells us during an interview to commemorate
    the launch of the MinnowBoard single-board computer, “but a generalist who enjoys
    working with the big picture in mind”.


    A software engineer for the Yocto Project, a collaborative effort to make the
    development of Linux distributions for embedded platforms as simple as possible,
    working under Intel''s Open Source Technology Center, Garman has already given
    plenty back to the community. He''s responsible for Yocto-related training materials,
    including one of the most popular screencast introductions to the project, and
    is now leading the effort to introduce the first open hardware platform designed
    with Yocto firmly in mind: the Intel MinnowBoard.


    The MinnowBoard, reviewed on page 12, owes a clear debt of gratitude to devices
    like the Raspberry Pi and the BeagleBoard. Designed around Intel''s ''Queens Bay''
    platform, which has at its heart a low-power 32-bit Atom processor, the board
    is designed as a development platform to bring the flexibility and familiarity
    of the x86 instruction set architecture to embedded systems – and to do so at
    a low cost.


    Most surprisingly of all, the device is open hardware: all specifications, schematics,
    board layouts and firmware packages are available for download and reuse under
    a permissive licence – a first for an Intel hardware product. Clearly, this is
    a departure from the norm, and one of which Garman is understandably proud.'
