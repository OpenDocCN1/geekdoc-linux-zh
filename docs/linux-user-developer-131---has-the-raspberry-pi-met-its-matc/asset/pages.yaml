    \ afford to pay him a wage. “Today it is financially supported via paid upgrades,\
    \ VIP services and advertising and pay pages, but in the early days there wasn’t\
    \ much cash for this and the bulk of the fund-raising efforts went on infrastructure.”\n\
    \n4 billion  \nThe number of page views of WordPress websites from April 2012\
    \ to April 2013\n\nUp until the first release, the development team consisted\
    \ of just Mullenweg and Little, but five people were working on the project after\
    \ that by the end of 2003 and it continued to grow after that. By the end of 2005,\
    \ Little wasn’t able to stay involved. “I had issues at home, real-life issues\
    \ which meant that I couldn’t spend the time working on this thing voluntarily,”\
    \ he says. “It was still a very techy thing, a very geek thing, it wasn’t as good\
    \ and as user-friendly as it has become today and it certainly wasn’t as prominent.”\n\
    \nCash, he insists, is something that does not motivate him, however. “I need\
    \ to pay the bills and we need to eat,” he says. “I am the breadwinner of the\
    \ house and I always have been, but I wish I could put that side of things in\
    \ place and do what interests me from that point on. There’s no doubting my passion\
    \ for open source computing?”\n\nIndeed, he has read up on the philosophy behind\
    \ the General Public’s License and he has devoured Richard Stallman’s story of\
    \ how he created the free software movement. “I not only found it very inspiring,”\
    \ he says, “it just seemed the morally right thing to do, for me. The fact is\
    \ that, at the time, in the 1970s and 1980s, software companies were effectively\
    \ creating artificial scarcity, based on intellectual ideas that were almost free\
    \ to reproduce. Back then firms were making floppy disks and putting them in boxes\
    \ and getting manuals printed and they were charging £500 or £600 for a product\
    \ that had just £30 or £40 worth of materials. As things moved on, it got easier\
    \ and easier to distribute software online where the distribution costs and the\
    \ reproduction costs approach zero, so to then charge artificial amounts on top\
    \ of that just seemed like the wrong thing to do.”\n\nHe hopes that future generations\
    \ go down the same path and release open source software. “But first, he says,\
    \ “I think it is crucial that we just get kids learning how to code. There are\
    \ some good moves in that direction and I love what is being done with the Raspberry\
    \ Pi. Suddenly, a school can’t say it can’t afford to buy lots of computers to\
    \ experiment with. These are costing £25 each, it’s a great time to be in computing\
    \ and I feel it’s good to be plugging back in and helping people learn.”\n\nMike\
    \ Little’s new website is at **mikelittle.org** but he also runs his company site,\
    \ **zed1.com**.\n\n# OUTSTANDING  \nCONTRIBUTION  \nTO DIGITAL\n\nAt SASCon 2013,\
    \ Mike Little was presented with the inaugural ‘Outstanding Contribution to Digital’\
    \ award for his part in co-founding and developing WordPress.\n\nThe award, which\
    \ was handed out at a conference at the new Manchester Metropolitan University\
    \ Business School, acknowledged his instrumental role in setting up and developing\
    \ the first version of WordPress, which has become the most popular content management\
    \ system on the internet.\n\nRichard Gregory, one of SASCon’s founders, said:\
    \ “There isn’t a single digital marketing agency that hasn’t made generated income\
    \ by building WordPress websites, and we are honoured to be able to recognise\
    \ him with this award.”"
