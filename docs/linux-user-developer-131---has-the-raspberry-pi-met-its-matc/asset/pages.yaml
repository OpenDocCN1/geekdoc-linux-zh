    \ display gives a lot of information about your system, all of it relevant\n\n\
    +   - The SparkyCenter is a nice little app for controlling your system, although\
    \ it could do with better navigation\n\n# DISTRO\n\n# SparkyLinux 3.0\n\n**Minimum\
    \ Specs:** CPU 1GHz 1486 RAM 256MB (128MB for CLI Edition) STORAGE 5GB (2GB for\
    \ CLI Edition) **Best for:** Home Office\n\n# One of the first distros using Debian\
    \ 7.0 'Jessie', SparkyLinux is positioning itself as a lightweight system for\
    \ any user\n\n+   **Pros** Lightweight distro based on new testing branch of Debian;\
    \ nice aesthetic; great selection of images\n+   \n+   **Cons** Doesn't play nice\
    \ with all desktops, some issues with Flash and JS on non-Chrome based browsers\n\
    \nSparkyLinux is a relatively new distro, with its first version only coming out\
    \ in May of last year. Since then, it's gone through a few minor upgrades and\
    \ number changes and is now on its third iteration. The idea is to create a lightweight\
    \ distro that computers both old and new can use – with modern aesthetics and\
    \ graphical features available for those with high system specs. In case you don't\
    \ need graphics at all, though, there is a handy CLI image that reduces the space\
    \ down further – another first for a Debian 7.0-based distro.\n\nGraphical images\
    \ come in several flavours: the standard lightweight LXDE image, a purely Openbox-based\
    \ image, a MATE image and a Razor-Qt running edition. These are all customised\
    \ to fit the needs of Sparky, with a dock added in most cases, along with a nice\
    \ custom theme. All of the live images include both a graphical and a command-line\
    \ installer – as used in the CLI version. Both work exactly the same way with\
    \ the exact same options; however, the command-line version uses cfdisk for partitioning,\
    \ and the graphical installer used GParted. It's a minor difference that can actually\
    \ cause a unique issue – SparkyLinux can't detect partitions on a hard drive that\
    \ uses GPT. This means that systems with UEFI may need to be wiped before installing.\
    \ As GParted can work with GPT, you may never know that this is an issue, as no\
    \ warning messages or errors are thrown up.\nThis also means that partitioning\
    \ for SparkyLinux is completely manual. It does explain what it needs to run,\
    \ and"
