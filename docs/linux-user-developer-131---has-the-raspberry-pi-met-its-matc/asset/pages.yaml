- pgno: 66
  md: '# Make a Python Twitter client


    Create a simple Twitter client to make and monitor tweets


    ![](img/dd9251551a61a36067892b1cc68615b0_66_0.png)


    ![](img/dd9251551a61a36067892b1cc68615b0_66_1.png)


    # 01 Accountability


    To create a Twitter app, you need a Twitter account. Sign into your account, or
    create a separate one if you want to split up personal and development accounts
    on the service. Once that''s done, go to dev.twitter.com and log in using your
    desired account.


    ![](img/dd9251551a61a36067892b1cc68615b0_66_2.png)


    ![](img/dd9251551a61a36067892b1cc68615b0_66_3.png)


    # 02 New beginnings


    Go to ''My applications'' and click ''Create a new application''. Here you''ll
    need to enter the app''s name, a short description and a website where more details
    about yourself and/or the app can be found. Names of apps are not allowed to use
    the word Twitter in them.


    ![](img/dd9251551a61a36067892b1cc68615b0_66_4.png)


    # 03 Privileges


    After this has been created, you''ll be brought to the details page of the app.
    Before we go any further, click on Settings and select Read, Write and Access
    Direct Messages under Application Type so that we can use it properly as a Twitter
    client.


    # 04 Access token


    We can now create an access token for the application to work with your Twitter
    account. Go back to the details once the read and write permissions have been
    changed, and scroll down to the bottom. Click ''Create my access token'' to retrieve
    it.


    # 05 Install Pip


    We''ll install the latest version of python-twitter from our website. To do this,
    first install pip, as we''re using Python, available in repos as python-pip. As
    we''re using Debian, this looks like:


    ```

    $ sudo apt-get install python-pip

    ```


    ...which allows us to set up Python modules.


    ![](img/dd9251551a61a36067892b1cc68615b0_66_5.png)


    # 06 Install Twython


    Now that we have Pip installed, we can go ahead and install Twython. To do this,
    continue in your terminal and put:


    ```

    $ sudo pip install twython

    ```


    This will get the Twython module, and all the OAuth packages you need to log into
    your account with tokens we created.


    ![](img/dd9251551a61a36067892b1cc68615b0_66_6.png)


    > We need to create a Python file to hold all our authentication details. Start
    by importing Twython


    # 07 Authentication file


    We need to create a Python file to hold all our authentication details. Start
    up IDLE, or a text editor of your choice, and start by importing Twython with:


    ```

    from twython import Twython

    ```


    Make sure you have the keys we created earlier handy to add in the next parts.
    If the output is long, type it to go to the next screen.


    ![](img/dd9251551a61a36067892b1cc68615b0_66_7.png)


    # 08 App keys


    Add the following to your code:


    ```

    APP_KEY = ''YOUR_CONSUMER_KEY''

    APP_SECRET = ''YOUR_CONSUMER_SECRET''

    ...replacing YOUR_APP_KEY and YOUR_APP_SECRET with your own consumer key and consumer
    secret respectively.

    ```'
