  md: '# Intel MinnowBoard

    x86-based embedded development board


    # REVIEW


    ![](img/dd9251551a61a36067892b1cc68615b0_12_0.png)


    +      - A micro-SDIO slot plays host to a bundled SD card containing the Angström
    operating system


    +      - A small heat sink passively cools the Intel Atom E650T processor


    +      - Bundled risers lift the board up in order to allow the processor room
    to cool


    # Technical specs


    **Operating system**  Angström Linux (Yocto Certified)

    **Processor**  32-bit Intel Atom E640T single-core at 1GHz

    **Video**  Embedded Intel GMA 600

    **Memory**  1GB DDR2, 4MB SPI Flash (Firmware Storage)

    **Dimensions**  106 x 115mm

    **Weight**  119g (excluding PSU)

    **Input/Output**  DVI-over-HDMI, Analogue audio in & out, 2x USB, 1x SATA-2, 1x
    USB device, 1x Serial console, Gigabit Ethernet, 1x micro-SDIO

    **Extras**  Lure connector with CAN bus, HD audio, LVDS, I2C, 3x PCI Express,
    SATA-2, SDIO, SPI bus, 2x UART, 2x USB

    **Power**  5V at 2.5A


    +      - Four switches combine with two user-controllable LEDs to get users started
    with the board''s capabilities


    # Also consider


    ![](img/dd9251551a61a36067892b1cc68615b0_12_1.png)


    **Sage Gizmo**

    **$169 (E14.29)**

    Based on an embedded AMD **APU**, it is far more powerful than the MinnowBoard.
    Embedded graphics aid computer performance and a bundled expansion board makes
    getting started easy. It does, however, require more power under load. gizmosphere.com


    ![](img/dd9251551a61a36067892b1cc68615b0_12_2.png)


    **Raspberry Pi**

    **£26.07**

    The Pi’s ARMv6 processor is considerably less capable than the MinnowBoard’s Atom
    – but at almost a sixth the price, it’s easy to overlook this in favour of having
    spare cash for add-on hardware and tinkering components. raspberrypi.org


    Treating the MinnowBoard as a standard computer, however, misses the point entirely.
    The device is designed for embedded development, and to help Intel regain a foothold
    in a market that has become almost completely dominated by ARM-based systems.
    Accordingly, it includes eight buffered general-purpose input-output pins, along
    with two user-controllable LEDs and a set of four switches. Together, these turn
    the MinnowBoard into a ready-to-run system for developing embedded applications
    – and unlike with ARM-based devices, those used to an x86 toolchain don’t have
    to learn anything new.


    The board also includes an expansion connector for add-in daughterboards dubbed
    ''Lures''. Designed to be analogous to the ''shields'' of the Arduino microcontroller,
    the port gives each Lure access to considerable potential: as well as three PCI
    Express lanes, an SDIO channel, two USB channels and more, the port carries everything
    from CAN to I2C buses. Although there are no Lures available on the open market
    at the time of writing, several are in development – including one which will
    offer compatibility with Arduino shields. That doesn’t mean the main board is
    bereft of connectivity: a micro-SDIO slot for the boot device, two USB ports,
    analogue audio connections, Gigabit Ethernet, and mini- and micro-USB ports for
    acting as a USB device or as a debug serial console are included. The board also
    features a SATA-2 port, offering up to 3Gbps of throughput to a mass storage device
    – with a second port available through the Lure expansion port if required.


    At present, the MinnowBoard ships with a bare-bones installation of Angstrom Linux
    – no friendly out-of-box experience here. With full Yocto Project certification,
    however, rolling your own OS isn’t a challenge and Intel is in talks with distributions
    including Ubuntu to add support for the board’s somewhat unique 32-bit UEFI firmware.


    Using documentation – still in progress – from the project’s founders, the MinnowBoard
    is quick to offer up its GPIO capabilities. The only real disappointment comes
    from the HDMI socket, which only carries a DVI signal and not the audio required
    of a full HDMI implementation. There’s also no support for HDCP encryption, although
    anyone considering using the MinnowBoard as a media playback system has probably
    missed the point of its design and features.


    Gareth Halfacree


    # Summary


    The MinnowBoard is a welcome foray from Intel into the world of open hardware
    and offers considerable potential. While its performance may lag behind the rival
    Gizmo board, the Lure connector holds promise for some impressive add-ons to come
    – but its high price means the Raspberry Pi has little to fear from this upstart.


    More information  minnowboard.org


    13   www.linuxuser.co.uk'
