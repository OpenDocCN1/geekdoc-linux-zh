- pgno: 38
  md: '# Write LaTeX docs with LyX


    Use LyX to lay out your LaTeX documents with ease


    ![](img/dd9251551a61a36067892b1cc68615b0_38_0.png)


    ![](img/dd9251551a61a36067892b1cc68615b0_38_1.png)


    ![](img/dd9251551a61a36067892b1cc68615b0_38_2.png)


    # 01 Installation


    The first step is to get LyX installed on your system. Most distributors should
    have a package available. For your non-Linux friends, there are binaries available
    for Windows, Mac OS X, and even OS/2 and Haiku. As always, you can download the
    source code and build from scratch in the worst-case scenario.


    ![](img/dd9251551a61a36067892b1cc68615b0_38_3.png)


    # 02 Opening a new document


    When you first start up LyX, the main window opens up with a splash screen image
    displayed. You actually have to tell LyX that you want to start a new document
    before you can start writing. You can start a new document by clicking the menu
    item **File->New**.


    ![](img/dd9251551a61a36067892b1cc68615b0_38_4.png)


    # 03 Setting the document class


    Many of the layout properties for your document are set to defaults based on the
    class of your document. You can set this by clicking the menu item **Document->Settings**.
    This will pop up a dialog window that will use for the next few steps. The drop-down
    list will give you a very full list of possible document classes.


    ![](img/dd9251551a61a36067892b1cc68615b0_38_5.png)


    # 04 Text layout


    While the document class sets the defaults for your document, you still have full
    control to change anything in the document. The Text Layout option lets you change
    the indentation size to a custom increment. The vertical spacing and line spacing
    can also be customised. You also have the option to make your document two-column
    here.


    # 05 Page layout


    LaTeX figures out the actual rendering of your document based on a page layout.
    You can select one of a number of standard page formats, or set a custom page
    size. You can set whether the page is oriented as either portrait or landscape
    mode.


    # 06 Numbering and the TOC


    Documents are broken down into several nested subregions. How these regions are
    handled in the layout is decided by the document class. You can also set whether
    these regions are numbered or not, and whether they show up in the generated table
    of contents.


    # 07 View source


    Now that your document is set up, you can start typing. LyX gives you a pseudo-WYSIWYG
    view of the text. But LaTeX is a purely text-based markup language, so you can
    always see the actual source code to verify what LyX is putting into your document.
    To see the source, just click on the menu item **View->View Source**.


    ![](img/dd9251551a61a36067892b1cc68615b0_38_6.png)'
  merge: -1
  img_proc: true
- pgno: 39
  md: '# Write LaTeX documents with LyX


    ![](img/dd9251551a61a36067892b1cc68615b0_39_0.png)


    ![](img/dd9251551a61a36067892b1cc68615b0_39_1.png)


    > Many of the layout properties for your document are set to defaults based on
    the class of your document


    # 08 Title


    The first item your document will need is a title. In LaTeX, you need to worry
    about what a particular piece of text is supposed to be, not what it will look
    like. So at this stage, you can type in your title text. To identify it as a title,
    you can click the drop-down at the top right of the toolbar and select Title.


    ![](img/dd9251551a61a36067892b1cc68615b0_39_2.png)


    # 09 Author


    Hitting Enter will give you a new line, with the type back to Standard. You can
    here enter your name and set the type to Author, again with the drop-down at the
    top right of the toolbar. Where and how this will get rendered depends on the
    document class and the output format.


    # 10 Dates


    You should have noticed that there is a date option in the drop-down. You don’t
    need to use this if you don’t wish to. LyX will automatically add the current
    date when you actually render the document into an output format.


    ![](img/dd9251551a61a36067892b1cc68615b0_39_3.png)


    ![](img/dd9251551a61a36067892b1cc68615b0_39_4.png)


    # 11 Abstracts


    If you are writing an article, or a report, you may need to include an abstract
    of the subject matter being covered. If you have already written your abstract,
    you can highlight the region with your mouse and select ‘Abstract’ from the drop-down.
    This adds the title ‘Abstract’ and changes the format of the text.


    ![](img/dd9251551a61a36067892b1cc68615b0_39_5.png)


    # 12 Sections


    In most documents, you will probably want to break the text down into sections,
    and possibly subsections. Sections are defined by giving them a title. For instance,
    if your first section is going to be an introduction, then you would type the
    section title as ‘Introduction’ and set the type in the drop-down to Section.
    The actual text for this section would be set to the type Standard.


    ![](img/dd9251551a61a36067892b1cc68615b0_39_6.png)


    ![](img/dd9251551a61a36067892b1cc68615b0_39_7.png)


    # 13 Mathematical formulae


    Mathematical formulae are always a problem area in document typesetting. Many
    people in the sciences first move to LaTeX because of the ability to fully control
    equations by explicitly laying out all of the elements. However, for more complex
    equations, this can still be confusing. Therefore LyX provides an equation writer
    tools that helps you create the LaTeX required to lay out your formula in your
    document. You can set the type of maths to be either inline with your text, or
    to be centred and displayed on its own.'
  merge: -1
  img_proc: true
- pgno: 40
  md: '# # Write LaTeX docs with LyX


    Use LyX to lay out your LaTeX documents with ease


    ![](img/dd9251551a61a36067892b1cc68615b0_40_0.png)


    # 14 Lists


    There are several different types of lists available for your use. Both numbered
    and unnumbered lists are available as buttons on the main toolbar. To start a
    list, click on one of the buttons and start typing the first item. Hitting the
    Enter key will give you a new item to enter. Hitting Enter on an empty item will
    drop you out of the list section.


    ![](img/dd9251551a61a36067892b1cc68615b0_40_1.png)


    # 15 Tables


    You can add a table by clicking on the menu item **Insert>Table**. A dialog will
    appear where you can set the number of rows and columns. The first row is set
    aside as a header for the columns, but you can change this in the LaTeX source.


    ![](img/dd9251551a61a36067892b1cc68615b0_40_2.png)


    **[pdflatex]**. There are also other viewing options, in case you want to render
    your document using other methods.


    provided by your LaTeX installation. This is defined in the Document Settings
    dialog, where you can set the family, encoding and fonts to use for Roman, Sans
    Serif and Typewriter.


    ![](img/dd9251551a61a36067892b1cc68615b0_40_3.png)


    ![](img/dd9251551a61a36067892b1cc68615b0_40_4.png)


    # 16 Images


    Clicking on the menu item **Insert>Graphics** opens a dialog window where you
    can select an image file to insert into your document. You can either set a scaling
    factor, or an explicit width and height for its display. You can also rotate your
    image through X degrees. You also have the option to control if and how the image
    gets clipped to a bounding box.


    # 20 Output formats


    Now that you have your document finished, you will want to render it to some final
    output format. A common choice is either PostScript or PDF. This way, you know
    that it will look the same, regardless of who you give it to. But you have several
    other options available, too. You can output to HTML, rich text, plain text or
    even OpenDocument.


    ![](img/dd9251551a61a36067892b1cc68615b0_40_5.png)


    # 17 Previewing


    Now that you have a bunch of content in your document, you probably want to get
    an idea of what it will look like once it is fully rendered. You can get LyX to
    generate a PDF for viewing by clicking the menu item **View>View** [PDF


    # 18 Spellchecking


    Most people need help when it comes to making sure everything is spelled correctly.
    If you want to use the system default spellchecking engine, you can simply click
    on the menu item **Tools>Spellchecker**. You can change the engine being used
    by selecting it in the options window.


    # 19 Fonts


    Linux users have had problems, traditionally, when dealing with fonts. This extends
    to applications like LaTeX. LyX includes options that help you correctly set up
    TrueType fonts, allowing you to use fonts other than those


    41 www.linuxuser.co.uk'
