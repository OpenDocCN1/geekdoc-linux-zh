  md: "![](img/dd9251551a61a36067892b1cc68615b0_79_0.png)\n\n+   - There is no pass-through\
    \ for the Pi’s spare GPIO pins, sadly\n+   - A small chip provides the Pi with\
    \ a radio for wireless communications\n\n+   - The small ceramic antenna can be\
    \ replaced with a wire whip to boost range\n\n+   - While small, the Slice of\
    \ Radio does block the little-used Display Serial Interface (DSI) connector\n\n\
    # **PERIPHERAL**\n\n# Raspberry Pi Wireless Inventors Kit\n\n**£49.99**\n\n![](img/dd9251551a61a36067892b1cc68615b0_79_1.png)\n\
    \nDesigned to mate a wireless Arduino microcontroller with the Raspberry Pi, is\
    \ the RasWiiK what budding developers have been waiting for all this time?\n\n\
    +   **Pros**\n+   - The easiest way to get started with wireless microcontroller\
    \ development using the Raspberry Pi\n+   \n+   **Cons**\n+   - The LLAP wireless\
    \ protocol offers no encryption; Slice of Radio blocks unused pins on the Pi’s\
    \ GPIO header\n\nWhile it’s easy to see the Arduino and the Raspberry Pi as competitors\
    \ – they’re both low-cost electronic devices aimed at the hobbyist market, after\
    \ all – in truth they’re extremely complementary: the Arduino excels at real-time\
    \ control and sensing, while the Pi provides cheap network connectivity and powerful\
    \ data processing capabilities. That’s clearly been the thinking of Dsoco in designing\
    \ the Raspberry Pi Wireless Inventors Kit, or RasWiiK: a bundle of components\
    \ and accessories, it’s designed to make working with the Arduino on the Raspberry\
    \ Pi as simple as possible and showing users just what potential is opened up\
    \ when the two are connected over a radio link.\n\nGetting started couldn’t be\
    \ easier: the kit includes a 4GB SD card with a customised version of the Raspbian\
    \ operating system. Simply slide this into the Pi, pop the bundled Slice of Radio\
    \ board onto the GPIO header and apply power.\n\nThe SD card includes an open\
    \ source example utility for controlling the included Arduino clone, a radio-equipped\
    \ microcontroller dubbed the XinoRF. Using this tool, a visual representation\
    \ of the board appears on screen – and allows the user to turn outputs on and\
    \ off, or read values from digital or analogue input pins.\n\nWith nothing connected\
    \ to the Arduino, that would soon get pretty boring, but the kit also includes\
    \ numerous"
