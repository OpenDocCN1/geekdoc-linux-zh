  md: '# JON MASTERS


    # The kernel column


    The latest developments in the kernel community, including changes to Linux 3.11


    ![](img/dd9251551a61a36067892b1cc68615b0_21_0.png)


    Jon Masters is a Linux kernel hacker who has been working on Linux for some 18
    years, since he first attended university at the age of 13. Jon lives in Cambridge,
    Massachusetts, and works for a large enterprise Linux vendor. He publishes a daily
    Linux kernel mailing list summary at kernelcodcast.org


    Linus Torvalds announced the latest release candidate of the 3.11 ‘Linux for Workgroups’
    on the 32nd anniversary of his original ‘Hello everybody’ email first introducing
    Linux back in 1991.


    The last few weeks have been largely quiet in terms of changes merged into the
    mainline kernel, typical both of late summer and of the late stages in a kernel
    release cycle. It would seem that temporary fixes for the ongoing Windows 8 ACPI
    compatibility issues – which cause display backlight (now managed directly by
    certain Windows graphics drivers, rather than in the ACPI firmware) to misbehave
    on some laptops – will suffice for this release, but will be raised again in the
    next cycle. If all goes according to plan, the final release should be out very
    shortly, in time for a summary in next month''s Linux User & Developer.


    Every Linux release has a (code) name, typically something very silly, and usually
    whatever Linus dreams up at the time he opens the merge window (the period of
    time during which disruptive kernel changes are allowed) for a new kernel release.
    But from time to time, a release name has a deeper meaning. The 3.11 release came
    close to happening on the 20th anniversary of the original Windows 3.11 ‘Windows
    for Workgroups’ release, but it was not to be. Still, Linus had some fun with
    the celebration of the 22nd anniversary of his original Linux announcement, posting
    a Google+ post in which he parodied himself, saying: “I''m doing a (free) operating
    system (just a hobby, even if it''s big and professional) for 486+ AT clones and
    just about anything else out there under the sun. This has been brewing since
    1991, and it is still not ready.”


    # NUMA development


    Linux Weekly News recently noted that there can often seem to be themes to given
    periods of kernel development, and that this past month has had somewhat of a
    memory management theme. This certainly seems to be the case. But even more specifically,
    this month''s theme would seem to actually be that of NUMA (Non-Uniform Memory
    Access) development. NUMA is all about dealing with the reality that as SMP (symmetric
    multiprocessing, the kind used in your computer to provide many CPU cores for
    the operating system) scales, it does not necessarily do so in a linear fashion.
    The truth is that certain memory DIMM banks are ''closer'' to certain CPU cores.


    In an SMP system, every CPU can access every memory location in the system, which
    is typically ''coherent,'' meaning that the underlying hardware takes care of
    ensuring that memory locations cached internally by other CPUs are updated when
    a different CPU updates that same memory. But accessing a given memory location
    can be more expensive in terms of latency if it is not ''local'' to a given processor
    – ie if the underlying hardware must take more steps to reach a given location
    by routing access to that location through an inter-processor local bus. To an
    application (and a user!) this manifests in terms of slower performance than could
    be achieved if the memory for an application were strictly local to a given processor.


    Linux handles NUMA in various ways. To a certain extent it can provide a level
    of transparent support, by ''migrating'' memory for applications to be closer
    to the processors that are using it (copying the underlying memory locations to
    other locations more local to a given processor and updating the virtual memory
    translation tables accordingly), but special tools have been written to allow
    administrators to be more specific about how a given application should manage
    its memory. Mel Gorman, famous for writing the definitive book on Linux memory
    management, has been working on NUMA scalability problems recently, and both he
    and'
