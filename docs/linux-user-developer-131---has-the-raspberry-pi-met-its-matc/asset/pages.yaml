- pgno: 30
  md: '# # Android Studio


    Get to grips with the new IDE for Android development


    # ## FEATURE


    # ## Working with virtual devices


    Create a virtual Android device to test and debug your Android apps, choosing
    from a selection of generic phones and tablets


    ![](img/dd9251551a61a36067892b1cc68615b0_30_0.png)


    +   - **Home screen**

    +     Emulate a list of Android devices, from Nexus phones and tablets to generic
    phones defined by screen resolution.


    +   - **Android buttons**

    +     Software buttons are included on the virtual device, as they are part of
    modern Android.


    +   - **Physical buttons**

    +     There’s a range of physical buttons you can use that work on certain devices,
    with power and volume working on all.


    +   - **Hardware specs**

    +     Edit specific hardware variables to better emulate certain aspects of a
    device, or give it more power via your host system.


    ![](img/dd9251551a61a36067892b1cc68615b0_30_1.png)


    ![](img/dd9251551a61a36067892b1cc68615b0_30_2.png)


    ![](img/dd9251551a61a36067892b1cc68615b0_30_3.png)


    **01 Virtual device manager**

    From the Project View, find the Android Virtual Device (AVD) manager icon along
    the top and click it. From here you can create and edit a range of devices for
    testing your apps on. Click on New so that we can get started.


    **02 New device**

    In the pop-up dialog, name the virtual device, select the device you wish to emulate
    and then the target API level. Some devices will have a minimum Android version
    target. You can edit this later, but for our app we won’t need to change any other
    settings.


    **03 Virtual reality**

    Click OK and Android Studio will confirm the options you’re using. Press Start
    while the device is selected and choose whether you want to get a pixel-accurate
    screen, or a scaled version. It will then boot up a virtual phone or tablet you
    can test on.


    # ## Debugging


    Android Studio includes tools to debug the apps you create. To use them, first
    make sure a device is running to emulate the app. Then, click the Debug button
    — in the shape of a green bug — and the file will rebuild and launch on the device.
    This time, though, it will bring up a full logging window, a console and a debugger
    with full tools to figure out where problems may be occurring in your apps.


    ![](img/dd9251551a61a36067892b1cc68615b0_30_4.png)


    +   - Use Android Studio’s debugging tools to analyse your code.'
  merge: -1
  img_proc: true
