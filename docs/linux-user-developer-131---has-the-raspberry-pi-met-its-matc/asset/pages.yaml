- pgno: 73
  md: '# # Review


    # ## Integrated development environment group test


    # # Geany


    # ## A fully featured IDE that''s a little more lightweight than most


    Geany is sometimes mistaken for a glorified text editor. In reality, it''s a full
    IDE, albeit slightly more lightweight than most.


    Geany has multi-language support out of the box, with easy options to create files
    that use different languages as part of the main interface. Projects are kept
    in specific folders, like Eclipse, although there is a file to go with them that
    Geany can read to manage the projects. Multiple projects can be viewed and edited
    at a time, all in different languages. There are also debuggers and builders for
    the various languages that support them, and you can run and test stuff like Python
    that doesn''t need compiling as such.


    The rest of the interface for Geany is clean and well tabbed. Code is automatically
    highlighted with the left column and there''s a smart tab in the left column that
    allows you to track and view the different variables, functions and classes in
    the projects and code. Navigation through the code is fairly simple via context-sensitive
    menus and nice options within the rest of the interface, and the usual code-editing
    tools such as commenting out a selection or indenting are all present.


    ![](img/dd9251551a61a36067892b1cc68615b0_73_0.png)


    The native languages are supported quite well with compilers and such


    ![](img/dd9251551a61a36067892b1cc68615b0_73_1.png)


    Geany''s interface is smart and easily breaks down code for workflow purposes


    > > “Code is automatically highlighted with the correct syntax”


    Sadly, Geany''s plug-in support is pretty dire. Some plug-ins extend the basic
    functionality for a few of the languages, but there''s not the kind of depth as
    Netbeans or Eclipse in the sheer number of available plug-ins.


    There are a lot of ways to customise Geany with the standard tools and menus,
    though. Almost every part of the interface and workflow is editable, with ways
    to even change the characters required for autocomplete suggestions.


    Geany is a very smart IDE, with a low barrier to getting your project started
    straight away. It does lack in some of the features of some of the bigger IDEs,
    such as more advanced unit testing and debugging, although it will let you browse
    compile errors. The plug-in selection is also pretty poor, so it may not be extendable
    for specific functions.


    # ## SCORES


    | Category | Description | Score |

    |---|---|---|

    | Installation | Readily available in most repos and requires minimal dependencies
    | 9 |

    | Workflow | Workflow is superb for the variety of different languages included
    | 9 |

    | Features | No proper debugger, but a great selection of build and project management
    functions | 7 |

    | Plug-in support | Although it doesn''t quite need it like the others, there
    are very few plug-ins available | 4 |

    | Overall | Geany is a great, lightweight IDE with good native support for a variety
    of languages, but there''s not much room for expansion | 8 |'
  merge: -1
  img_proc: true
- pgno: 74
  md: '# # Integrated development environment group test


    Four of the best IDEs go head to head


    # ## Eclipse


    The ubiquitous Eclipse is an industry standard — how does it fare against more
    community-run efforts?


    **Eclipse is one of the most popular development suites around, and at first glance
    it''s easy to see why.** While created mainly for Java development, Eclipse is
    highly customisable through plug-ins. Thanks to its popularity and community,
    this has resulted in a great selection of add-ons that enable Eclipse to work
    with just about any language. These plug-ins allow for more than that, with a
    marketplace full of interface and behavioural modifications alongside the language
    elements.


    Eclipse has great project management tools as well, with a smart tabbed interface,
    and plug-in-specific menu entries for starting projects in different IDEs if needed.
    Projects are located in plain folders in the location of your choice, allowing
    for easy access of source code if you need it, instead of being inside a proprietary
    file. The function search ability works well and the interface has plenty of tips
    and warnings for


    ![](img/dd9251551a61a36067892b1cc68615b0_74_0.png)


    anything that might be inefficient in terms of the code. There are plenty of editing
    tools too, such as simple indent or dedent options.


    The debug suite in Eclipse is fully featured, with various ways to run, check
    and unit-test code, although this depends on the plug-ins to some degree. The
    tools are there, though, and most of the major plug-ins seem to use them.


    The plug-ins are handled by a repository system, which lets you keep any add-ons
    up to date. While there aren''t a huge amount available by default, it''s easy
    enough to add more to the plug-in manager and you can even


    > > “A great selection of add-ons enables it to work with just about any language”


    select which extensions to install from each of the repositories.


    Eclipse is customisable in other regards, with an expansive properties and settings
    menu that lets you edit a huge amount of the native behaviour of the IDE, from
    the way packages are viewed to little things like key bindings and other shortcuts.
    Eclipse is a fairly big suite of packages, though, and easily the biggest resource
    hog out of all of the IDEs we''re testing; it does have probably the best extensibility
    of all these IDEs, however, meaning it also probably has the most to offer those
    who work on a lot of differing projects.


    ![](img/dd9251551a61a36067892b1cc68615b0_74_1.png)


    Code navigation and highlighting aids your workflow


    # ### SCORES


    | | Score |

    |---|---|

    | Installation | 7 |

    | Workflow | 9 |

    | Features | 8 |

    | Plug-in support | 10 |


    | Overall | 9 |

    |---|---|

    | Eclipse is popular for a reason – it''s got a great selection of features that
    are easily extensible to suit almost any need |


    75 www.linuxuser.co.uk'
  merge: -1
  img_proc: true
- pgno: 75
  md: '# # Netbeans

    ### The Oracle-developed Java development platform that multitasks


    ![](img/dd9251551a61a36067892b1cc68615b0_75_0.png)


    Netbeans started life as a humble student project to make a Java IDE in Prague.
    Within a few years, a company had been set up around the IDE, and then had been
    bought by Sun Microsystems. The rest is history and after over 15 years of development,
    Netbeans is on version 7.3.


    Netbeans has a very similar feature-set to Eclipse, with debuggers, compilers,
    unit testers and the like, although by default Netbeans has support for PHP and
    HTML as well as its Java-specific features. Netbeans also has a huge database
    of plug-ins to call from, allowing you to extend its features to just about any
    programming language. These plug-ins are nicely arranged in a database format
    on the Netbeans website, with simple search functions and a fairly easy way to
    install the plug-ins to the system. There’s no repository function for the plug-ins
    like Eclipse, but the database displays enough information to know if you’re getting
    the latest version of the plug-in.


    The interface is a little confusing – not very well streamlined and aesthetically
    a little dated. While the splash screen is nice for starting new projects, the
    rest of the interface is cluttered


    ![](img/dd9251551a61a36067892b1cc68615b0_75_1.png)


    > “There just isn’t quite the same level of customisation as Eclipse or the others”


    and some functions are hidden away in weird menu options. The code view is not
    particularly well handled, with syntax highlighting a little sparse. The function
    navigator is fairly nice, though, with the sidebar allowing you to track the hierarchy
    a little better than some.


    Customisation in Netbeans is handled with a nice-looking options menu, but there
    just isn’t quite the same level of customisation as Eclipse or the others. However,
    for similar customisation tasks, it’s a little better laid out than Eclipse.


    Overall, Netbeans seems like it’s a little behind the times, with an interface
    that needs a small overhaul and a better selection of customisation options. It’s
    by no means a bad IDE, with a great suite of debugging and testing options to
    use on code. On the other hand, Eclipse is equal or better in almost every regard.


    | | SCORES | |

    | Installation | Packages are readily available for Netbeans and it requires a
    Java install | **8** |

    | Workflow | The interface is a little cluttered and convoluted, but there are
    some-decent options to be found | **7** |

    | Features | A similar feature-set to Eclipse, but not as much customisation |
    **7** |

    | Plug-in support | A fairly large selection of plug-ins are available for it
    within an easy-to-search database | **8** |

    | Overall | Netbeans just misses the mark with a slightly dated interface, but
    it’s made up for somewhat with a good selection of plug-ins | **7** |'
  merge: -1
  img_proc: true
- pgno: 76
  md: '# Integrated development environment group test


    Four of the best IDEs go head to head


    # In brief: Compare and contrast our verdicts


    | | Code::Blocks | Geany | Eclipse | Netbeans |

    |---|---|---|---|---|

    | Installation | Available in repos and via binaries on the website | 8 | Requires
    few dependencies and easy to come by | 9 | A big suite of packages, but readily
    available | 7 | In most major repos and doesn''t have many dependencies | 8 |

    | Workflow | Good for the languages that are supported | 7 | Great workflow ideas,
    with easy code navigation | 9 | Project management is excellent and code navigation
    is good | 9 | A nice workflow view, but the interface is a little dated | 7 |

    | Features | A decent selection of features for C++ | 7 | There''s not a proper
    debugger for Geany | 7 | Eclipse is a feature-full IDE and is highly customisable
    | 8 | A decent debugger and reasonable customisation | 7 |

    | Plug-in support | Code::Blocks'' plug-in support is immature and badly distributed
    | 4 | Geany does not have many available plug-ins | 4 | Eclipse has the best selection
    of plug-ins in this test by a long way | 10 | A huge database of plug-ins, although
    some are a bit old | 8 |

    | Overall | A bit disappointing as of yet, but Code::Blocks shows some potential
    | 6 | A great lightweight IDE that may not be the best, but it''s still recommended
    | 8 | Ubiquitous for a reason, Eclipse has a lot of things going for it | 9 |
    Netbeans just falls short of the other IDEs with some missing features | 7 |


    # AND THE WINNER IS...


    # Eclipse


    We were actually a little surprised that Eclipse was this good compared to the
    other IDEs in this month''s group test. It offers excellent project management
    features, while its hugely expansive plug-in list means that you can make it work
    just about any way you want it to – much more so than Geany or Code::Blocks.


    Geany is definitely a close runner-up, though, and while we''re not specifically
    looking at lightweight IDEs this time, it does have a great selection of features
    while being light on system resources. The only thing that really let it, and
    Code::Blocks, down was its lack of plug-in support.


    Code::Blocks still needs some development time, and more community involvement,
    to make it a truly great IDE. It''s good to work with for C++ for now, we''d recommend
    it for that, but it just doesn''t have enough to recommend it for multi-language
    work.


    Eclipse, on the other hand, has a great balance of all the aspects we''re looking
    for in a multi-language IDE and that''s why it takes the editor''s choice award.


    **Rob Zwteloot**


    > “Offers excellent project management features and a hugely expansive plug-in
    list to work any way you want”


