  md: '# Tutorial


    # Make a Python Twitter client


    Create your own app details by using the Twitter Developer account tools, either
    for personal use or for an app you intend to release


    Access the entire dataset of Twitter via the Python wrapper, allowing you to grab
    timelines, lists and user profiles among others


    ![](img/dd9251551a61a36067892b1cc68615b0_65_0.png)


    Create your authentication keys for user and OAuth, letting you tap into the Twitter
    API


    Write your own tweets in Python using the Twython module to access components
    from the Twitter API


    # Make a Python Twitter client


    Learn the basics of the Twitter API using Python libraries and create a simple
    Twitter client to make and monitor tweets


    **Advisor**

    Rob Zwetsloot models complex systems and is a web developer proficient in Python,
    Django and PHP. He loves to experiment with computing


    ![](img/dd9251551a61a36067892b1cc68615b0_65_1.png)


    Python has many strengths, and one of them is the way you can use it to create
    lightweight desktop software and packages for the Internet of Things. One of the
    services used for this is Twitter, which has a few Python APIs you can make use
    of in a Python script to check and post the tweets from a specified user.


    With this you can create a standard Twitter client in the command line, or make
    a UI for it with Tkinter (from previous issues of LUD). You can also specify the
    login details you''d normally ask for from a client and then use it to check for
    specific words on Twitter, retweets, messages received, or if a specific person
    is sending tweets.


    For this tutorial we''ll be using Twython, which provides a pure Twitter interface
    for Python, and show you how to get your own unique API key to use it with Twitter
    itself.


    # Resources


    +   A Twitter account

    +   Python 2: www.python.org/'
