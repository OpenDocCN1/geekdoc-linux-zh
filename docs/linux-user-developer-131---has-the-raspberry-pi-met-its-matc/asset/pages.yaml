- pgno: 6
  md: '# Intel''s big fish in a little pond


    How the MinnowBoard came about


    # INTERVIEW


    ![](img/dd9251551a61a36067892b1cc68615b0_6_0.png)


    The MinnowBoard itself is compact yet powerful, and boasts impressive I/O capabilities


    # The open hardware movement


    +   - Open hardware – an offshoot of open source, where the schematics, component
    lists, and even the individual Gerber files for having printed circuit boards
    made are released under a permissive licence – is growing increasingly popular.
    Although the Raspberry Pi, one of the most popular low-cost embedded development
    platforms, is proprietary, many of its competitors are more open: as well as the
    MinnowBoard, the Gizmo, the BeagleBoard and its smaller BeagleBone offshoot, and
    the OpenOLinuXino family, and the microcontroller-based Arduino range are all
    open hardware.


    Open hardware can lead to rapid advances in features and technologies for the
    projects that adopt it, but as with open source software there are risks: the
    Arduino’s open nature has led to it being one of the most copied projects around,
    with Far Eastern factories churning out illegitimate clones by the dozen and misappropriating
    the project’s trademark in direct contravention of its otherwise extremely permissive
    licence.


    # How did the MinnowBoard come about?


    “I’d say development in earnest started happening at the end of 2012. MinnowBoard
    was an unusual project because of the way Intel and CircuitCo [the company behind
    the BeagleBoard and BeagleBone development platforms] collaborated on it. The
    Intel Yocto Project team provided input to help design the requirements for MinnowBoard
    around performance, openness, flexibility and standards. CircuitCo then used an
    Intel reference design – the Queens Bay platform – and adapted it as needed. They
    also manufacture and sell the MinnowBoard, so it’s primarily their product, not
    Intel’s. The result is a win-win situation where our team got a great development
    platform and more, and CircuitCo has a compelling product platform to sell.”


    “We’ve been really happy to work with CircuitCo on this, because they understand
    the open hardware/open community model so well, but we both had plenty of things
    to learn from each other during the process of bringing up this first board. It’s
    turned out to be a great collaboration and we’re really pleased with the results.”


    “In one sense, the Intel team working on this is extremely small. At the same
    time, I wouldn’t want to discount the contributions that many people have done
    to help make this happen, even if they weren’t involved with the project full-time
    on a daily basis.”


    # What led to the decision to choose the Queens Bay platform, with its ‘Tunnel
    Creek’ Atom processor, in the MinnowBoard?


    “Two main issues led us to use Tunnel Creek CPU for MinnowBoard. One, we were
    looking for longevity of the platform. Going with an open hardware model means
    that this is going to be an attractive board for embedded product companies to
    use and adapt for commercial products. I can tell you from experience, there is
    nothing more frustrating


    ![](img/dd9251551a61a36067892b1cc68615b0_6_1.png)


    > “To my knowledge, MinnowBoard is the first hardware platform designed with the
    Yocto Project in mind”


    ![](img/dd9251551a61a36067892b1cc68615b0_6_2.png)


    Along with the power and reset buttons on the right, the MinnowBoard boasts four
    programmable buttons


    The MinnowBoard sits on four stilts to help aid the passive cooling of its 1GHz
    Intel Atom processor'
