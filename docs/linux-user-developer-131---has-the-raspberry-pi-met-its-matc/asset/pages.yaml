    \ which provides a very professional look for our add-on.\n\nAs powerful as it\
    \ may seem, we have only built a video plug-in. XBMC’s extension system also provides\
    \ a framework for building fully fledged programs (called Programs). We will cover\
    \ this in a later issue.\n\n# ## 14 Populating the episode view (listing videos)\n\
    \nAt this point we have the URL in hand, which returns JSON data; now we need\
    \ to extract the data out of it which will make sense to us.\n\nBy looking at\
    \ the JSON data, you can see there’s a lot of interesting information present\
    \ here. For example, `url` is set to `youtube.com/watch?v=n4/2zVxWBE`. `title`\
