  md: "+   The Lure connector, for add-on boards, carries everything from CAN bus\
    \ signals to three PCI Express lanes\n\n+   An HDMI port offers DVI video connectivity,\
    \ but does not carry digital audio\n\n![](img/dd9251551a61a36067892b1cc68615b0_11_0.png)\n\
    \n+   Two USB ports provide connectivity for external peripherals\n\n+   Gigabit\
    \ Ethernet gives the MinnowBoard powerful networking capabilities\n\n# **DEV PLATFORM**\n\
    \n# Intel MinnowBoard\n\n£162.83\n($200)\n\nIntel’s answer to the Raspberry Pi\
    \ is here – but at nearly six times the price, can it tempt buyers back to x86?\n\
    \n+   **Pros**\n+   \n+   Powerful, flexible, offers a familiar x86 environment\
    \ for newcomers to embedded development\n\n+   **Cons**\n+   \n+   Compared to\
    \ ARM equivalents it’s expensive, and its performance lags behind AMD’s rival\
    \ Gizmo device.\n\nClearly, the MinnowBoard is no Raspberry Pi. Measuring 102mm\
    \ on its shortest side, it’s significantly larger, requires a whopping 2.5A from\
    \ a 5V power supply to run and costs almost six times as much as the credit-card-sized\
    \ Pi. The MinnowBoard does offer something the Pi lacks, however: full x86 compatibility.\n\
    \nAt the heart of the MinnowBoard is one of Intel’s less powerful processors:\
    \ the Atom E640T. Running at 1GHz, the single-core chip offers a 32-bit x86 implementation\
    \ – already putting it on the back foot compared to the dual-core 64-bit APU found\
    \ on rival AMD’s Gizmo, the closest device for comparison – while generating a\
    \ surprisingly small amount of heat, allowing for passive cooling through a compact\
    \ heat sink.\n\nWith 1GB of RAM, the MinnowBoard offers a surprisingly powerful\
    \ yet lightweight platform for embedded computing. Peaking, during testing, at\
    \ 7W from the socket, it scored a respectable 95th percentile time of 11.49ms\
    \ – almost five times faster than the Raspberry Pi at 51.45ms, but still some\
    \ way behind the Gizmo’s impressive 9.87ms score. Add in the fact that the Gizmo\
    \ can run two threads simultaneously and its clear Intel isn’t going to win on\
    \ outright performance – although it has included Hyper-Threading support in the\
    \ MinnowBoard for pseudo dual-core operation."
