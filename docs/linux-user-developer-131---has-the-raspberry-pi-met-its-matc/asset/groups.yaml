    \n\\* O = 可选\n\n## 您的观点\n\n您获取 Linux 新闻和见解的来源\n\n- 联系我们...\n  - 注册并发布您的评论...\n\
    \  - www.linuxuser.co.uk/forums/\n  - 直接发送电子邮件给我们...\n  - linuxuser@imagine-publishing.co.uk\n\
    \n## 您的观点\n\nLinux User 读者来信\n\n您对杂志、Linux 和开源的看法\n\n![](img/dd9251551a61a36067892b1cc68615b0_93_0.png)\n\
    \n### 一小块披萨\n\n我记得不久前你们讨论过 Pisi Linux，它是 Pardus 的一个替代品，风格稍微更接近原版。看到 DistroWatch\
    \ 拒绝列出 Pisi Linux 让我很难过，因为有人搞破坏，告诉 DistroWatch 说它已经停止活动，并建立了虚假的 Pisi Linux 网站等。DistroWatch\
    \ 显然决定将其从列表中移除。DistroWatch 的这一举动非常令人悲伤和失望。我希望当它最终发布稳定版时，他们会将 Pisi 重新添加到数据库中，因为以前的\
    \ Pardus 版本是我最喜欢发行版之一！\n\nPisi Linux 目前处于测试版\n\nMark Doyle\n\n令人遗憾的是 DistroWatch\
    \ 采取了这种立场。根据 Pisi 团队的说法，DistroWatch 似乎被误导了；然而，自 Pisi 团队做出解释后，DistroWatch 的同事们一直没有回应。它的测试版现在已经发布，但\
    \ Pisi 尚未重新回到 DistroWatch 上。请留意其完整版本最终发布时的评测。\n\n### 线程裸露\n\n未来的道路\n\n显示服务器领域正在升温，因为\
    \ Wayland 和 Canonical 的 Mir 即将尝试取代 X 服务器。Richard Hillisley 在第 127 期中关于 Wayland\
    \ 的文章在网站上引发了一些关于替换 X 的辩论。在这里加入对话：bit.ly/LUDWay\n\n![](img/dd9251551a61a36067892b1cc68615b0_93_1.png)\n\
    \nWayland 旨在作为 X 的更简单的替代方案\n\n- Henrik Danielson 说：\n  可以看出，问题之一是 Mir 故意与 Wayland\
    \ 不兼容。\n\n- Bob Robert 说：\n  我经常使用 X 的网络显示功能。对我（我是用户，不是程序员）来说，转向 Wayland 没问题，只要我仍然可以“ssh\
    \ -X”并在我的本地机器上启动显示 GUI 应用程序。X 曾经将其“主线”支持网络透明性，而 Wayland 通过“插件”实现，这对我其实并不重要。重要的是它确实做到了。这是我要使用且想要的功能。\n\
    \n- bwait47 说：\n  我认为情况并没有看起来那么糟糕。Mir 和 Wayland 在架构上有几个主要相似之处，例如使用 EGL。对于驱动程序来说，理论上支持两者不应该困难，只要它们提供\
    \ EGL 支持即可。对于应用程序，情况也不应该那么糟，因为 Mir/Wayland 支持是在工具包层面。最大的负担可能落在工具包上：除了 X（因为 X 在可预见的未来不会完全消失）之外，它们必须拥有并支持两种后端。\n\
    \n- Gene Moesher 说：\n  Keith Flickard 问道：“有多少应用程序关心网络透明性，而这曾经是 X 的主要特点之一？有多少应用程序关心\
    \ ICCCM 合规性？有多少应用程序关心 X？当然，这些问题的答案都是‘非常少’。如果我们都属于‘非常少’的那一批，那我们的未来将如何，Keith？”\n\
    \n"
