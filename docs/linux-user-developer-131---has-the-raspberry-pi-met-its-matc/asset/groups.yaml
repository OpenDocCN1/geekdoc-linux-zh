    \n#### 02 安装 Apache Web 服务器\n\n我们将较早地安装 Apache，并使用其自己的命令，因为某些其他包需要能够配置一个可用的 Apache\
    \ 安装。使用 `sudo apt-get install apache2` 执行安装。通过导航 Web 浏览器到 http://localhost 进行测试。\n\
    \n![](img/dd9251551a61a36067892b1cc68615b0_34_2.png)\n\n#### 03 安装 Java 和附加类\n\
    \nBase 和 MySQL 之间的连接使用了 Java 类。输入 `sudo apt-get install default-jdk` 以安装 Java\
    \ 运行时。输入 `sudo apt-get install libmysql-java` 以安装所需的附加 Java 类。\n\n![](img/dd9251551a61a36067892b1cc68615b0_34_3.png)\n\
