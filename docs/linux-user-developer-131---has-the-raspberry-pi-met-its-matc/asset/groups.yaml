    ### OPEN SCIENCE


    ## Linux Foundation leads open science initiative


    Partnership with OpenBEL will make sharing scientific data easier


    A collaboration between the Linux Foundation and Selventa''s freshly opened OpenBEL
    project could help push the ideals of open source development further into the
    realms of scientific research, the groups have announced.


    ![](img/dd9251551a61a36067892b1cc68615b0_13_0.png)


    OpenBEL''s Ted Slater extols the virtues of Linux and collaborative development


    Previously a closed-source proprietary platform, OpenBEL – the Open Biological
    Expression Language – was designed to help users to capture, store, share and
    use life sciences content through what its creators describe as a "knowledge engineering
    platform." Addressing the difficulties with sharing and using data, the team behind
    OpenBEL has been using it for ten years – but the platform was only opened up
    in June last year, a move that the Linux Foundation is claiming will be the making
    of the project.


    "All of us are smarter collectively than any one of us is by ourselves, and Linux
    is one of the greatest examples of that principle," claimed Jim Zemlin, executive
    director at The Linux Foundation. "We are able to take what we know about Linux
    and collaborative development and transfer that to new industries. OpenBEL represents
    an amazing opportunity for openness and collaboration to lead for OpenBEL. "It
    is the standard by which all open development projects measure themselves. We
    know our industry can learn a lot from this neutral steward of open development
    and governance... Also, by hosting OpenBEL at The Linux Foundation, we have access
    to a variety of important services to help facilitate collaborative development,
    allowing our teams to focus on our subject matter: life science."


    Hosting the OpenBEL platform with the Linux Foundation, its creators hope, will
    boost its adoption. Since going open source in June 2012, the project has already
    been adopted by organisations as diverse as the Harvard Medical School, the University
    of California at San Diego, the Fraunhofer Institute, and pharmaceutical giants
    Novartis and Pfizer.


    The groups hope that wider adoption of OpenBEL will lead to a pooling of information
    on life sciences, with the platform allowing for easy dissemination and analysis
    using a standardised set of computable networks and application programming interfaces
    (APIs).


    The deal with OpenBEL is the latest of the Linux Foundation''s Collaborative Projects,
    which include partnerships with the Yocto Project, Xen Project, FOSS Bazaar, and
    mobile platforms MeeGo and Tizen.


    Details on the project, and links to the source code, are available on the official
    OpenBEL website at openbel.org.


    ![](img/dd9251551a61a36067892b1cc68615b0_13_1.png)


    OpenBEL provides a platform for the capture and collaborative analysis of life
    sciences data


    > “All of us are smarter collectively than any one of us is by ourselves”

    > – Ted Slater


