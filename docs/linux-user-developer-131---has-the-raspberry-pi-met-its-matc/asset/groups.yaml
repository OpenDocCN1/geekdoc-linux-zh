    \n## Tutorial\n\n### Make a small business database with LibreOffice\n\nphpMyAdmin\
    \ offers a web-based front-end for the creation and maintenance of MySQL databases.\n\
    \nData entry is carried out via an easy-to-use form in Base, the front end to\
    \ our database.\n\nAll of the actual database design (fields, form layout etc)\
    \ is carried out from within Base.\n\nYou import and export data to and from LibreOffice\
    \ Base by using Calc, the spreadsheet module. This enables access to most common\
    \ data formats.\n\n![](img/dd9251551a61a36067892b1cc68615b0_33_0.png)\n\n### Make\
    \ a small business database with LibreOffice\n\nCreate a database that combines\
    \ an easy-to-use, form-based front-end using LibreOffice with a portable, networked\
    \ MySQL back-end.\n\n#### Advisor\n\nMichael Reed is a technology writer, and\
    \ he's been hacking away at Linux for over 15 years. He specialises in desktop\
    \ Linux solutions.\n\n#### Resources\n\n- LibreOffice: [www.libreoffice.org](http://www.libreoffice.org)\n\
    - At least one Ubuntu Linux PC\n\nWe're going to show you how to put together\
    \ a typical database for small business use: a database of customer details. It\
    \ will be possible to both export and import contact data from standard formats\
    \ by making use of Calc, LibreOffice's spreadsheet module. We'll use Grain contracts\
    \ as our source, but you can use any software that can export CSV files -- and\
    \ pretty much everything can.\n\nWe've added a few twists to keep things interesting.\
    \ This project uses the Base module of LibreOffice as the front-end, and this\
    \ provides a GUI for setting up the database, creating the forms for data entry\
    \ and the actual business of entering data. For the back-end, we'll be using the\
    \ industry-standard MySQL. This allows us to locate the back-end on a central\
    \ server. This, in turn, allows multiple users to access the database.\n\nFor\
    \ initial creation of the MySQL database, we'll use phpMyAdmin. Thanks to its\
    \ friendly web interface, although the actual database design will be carried\
    \ out from within Base. By the end of the project, you'll have a GUI system for\
    \ browsing and editing the database with a portable, networked back-end.\n\n###\
    \ Make a small business database with LibreOffice\n\nUse LibreOffice and MySQL\
    \ to create a customer database.\n\n**TUTORIAL**\n\n![](img/dd9251551a61a36067892b1cc68615b0_34_0.png)\n\
    \n#### 01 Install LibreOffice\n\nAt time of writing, the major Linux distributions\
    \ haven't moved over to LibreOffice 4 and are still offering 3.x. This means that\
    \ you may have to install LibreOffice 4 manually. Visit the LibreOffice website\
    \ (www.libreoffice.org) and follow the instructions. On Ubuntu, this consists\
    \ of unpacking the archive and running `sudo dpkg -i *.deb` on the contents.\n\
    \n![](img/dd9251551a61a36067892b1cc68615b0_34_1.png)\n\n#### 02 Install the Apache\
    \ web server\n\nWe'll install Apache early on and with its own command because\
    \ some of the other packages need to be able to configure a working Apache installation.\
    \ Carry out the installation with `sudo apt-get install apache2`. Test it by navigating\
    \ a web browser to http://localhost.\n\n![](img/dd9251551a61a36067892b1cc68615b0_34_2.png)\n\
    \n#### 03 Install Java and additional classes\n\nConnectivity between Base and\
    \ MySQL makes use of a Java class. Type `sudo apt-get install default-jdk` to\
    \ install the Java runtime. Type `sudo apt-get install libmysql-java` to install\
    \ the needed additional Java classes.\n\n![](img/dd9251551a61a36067892b1cc68615b0_34_3.png)\n\
    \n#### 04 Install the MySQL Server\n\nType `sudo apt-get install mysql-server`\
    \ to begin installation. Before long, you should be prompted to set a root MySQL\
    \ password. Note that this isn't the same as the administrator account of your\
    \ system, which is also called 'root'. Choose a password and make a note of it.\n\
    \n#### 05 Install and test phpMyAdmin\n\nType `sudo apt-get install phpmyadmin`\
    \ to begin installation. When prompted to choose a web server, choose Apache2,\
    \ select it with the space bar and press Return. When requested, give it the MySQL\
    \ root password and then choose a password for phpMyAdmin and make a note of it.\
    \ Navigating to http://localhost/phpmyadmin/ should take you to a functioning\
    \ login page. Log in using the MySQL root username and password. We'll use MySQL\
    \ to set up and maintain the actual database, although we'll create the fields\
    \ from within LibreOffice later on.\n\n![](img/dd9251551a61a36067892b1cc68615b0_34_4.png)\n\
    \n#### 06 Create database\n\nWithin the phpMyAdmin web interface, select the Databases\
    \ tab. Now create a new database by entering the name 'customer' into the text\
    \ box and clicking on Create. This database will contain our customer data.\n\n\
    ![](img/dd9251551a61a36067892b1cc68615b0_34_5.png)\n\n#### 07 Add JDBC in LibreOffice\n\
    \nWe now need to tell LibreOffice where to find the JDBC class file. Start LibreOffice\
    \ and go to LibreOfficeOptionsAdvanced, in the Java Options section, select Class\
    \ Path and then Add Archive. The file you need is located at: /usr/share/java/mysql-connector-java.jar.\
    \ Select it and restart LibreOffice.\n\n![](img/dd9251551a61a36067892b1cc68615b0_34_6.png)\n"
