    # ## How do I compile software?


    Compiling software from source code isn''t that difficult – all it requires are
    simple build tools available in all repos. To make sure you have the correct build
    tools installed, do the following on a Debian-based system:


    ```

    $ sudo apt-get install build-essentials

    ```


    Alternatively, for other systems, use:


    ```

    $ sudo yum groupinstall ''Development Tools''

    ```


    Once you have the necessary source code for the software you want to compile,
    navigate to the folder in the terminal and type:


    ```

    $ . /configure

    ```


    ...to build the files, and follow up with:


    ```

    $ make

    ```


    ...to compile it.


