    ![](img/dd9251551a61a36067892b1cc68615b0_53_0.png)


    declared Mullenweg and Little’s software as the official successor to b2. “It
    turns out he’d been made redundant or something like that, had to give up his
    flat, gone back to his parents who didn’t even have internet and so on,” smiles
    Little. “So it was just the real world was much more important than a bit of software.”
    WordPress was thus born.


    It was January 2003. Little had been learning PHP and he felt the world worked
    his way around b2 and makes alterations. “No software is perfect, so it was just
    a case of thinking of things that we wanted to add to it,” says Little. “That
