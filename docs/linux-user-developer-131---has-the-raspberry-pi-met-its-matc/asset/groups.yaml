    \n能为您节省最多时间的单一措施是配置 SSH，以便每次同步文件和目录时都不需要输入密码。此操作很简单，包含以下三个步骤：\n\n1. 运行 `ssh-keygen\
    \ -t rsa`\n\n您需要两次输入密码短语，请务必记住该密码短语！将创建两个新文件：`~/.ssh/id_rsa` 和 `~/.ssh/id_rsa.pub`。\n\
    \n2. 如果远程服务器上尚未存在 `.ssh` 目录，您可能需要创建该目录。\n\n![](img/dd9251551a61a36067892b1cc68615b0_44_2.png)\n\
    \n## 11 两种常见的 Unison 故障排除技术\n\n有时事情会未按预期工作。Unison 提供许多选项，可以帮助您发现并解决问题。\n\n首先要尝试的选项是\
    \ `-testserver` 选项，它仅连接到远程服务器然后退出，而不同步任何文件。\n\n其次要做的是运行以下命令：\n\n`$ ssh remote.machine.domain\
    \ 'echo $PATH'`\n\n上述命令让您看到 `PATH` 是否与您使用 `ssh remote.machine.domain` 登录时相同；如果问题出在\
    \ `PATH` 上，请检查 `/etc/ssh/sshd_config` 中 `PermitUserEnvironment` 选项是否设置为‘no’，并将其更改为‘yes’。\n\
    \n## 12 Unison 提示与建议\n\n- 在前两到三次使用新配置文件时，仔细检查是否一切工作正常。\n- 您不需要使用 Unison 支持的所有参数，只需使用完成您工作所需的参数！\n\
    - 您可以使用 `-debug all` 命令行选项来排除 Unison 的故障。它将生成大量有助于调试的输出。\n- 您使用 Unison 越多，就越能理解其实用性。\n\
    - 您应该非常小心备份选项，特别是 `maxbackups`，因为它可能会占用计算机上过多的空间。\n- 您可以使用 Unison 在计算机之间安全地交换文件。\n\
    - 如果同步过程中涉及 Windows 机器，请注意文件和目录权限。\n- 对于非关键数据文件，您可能每天运行一次 Unison，但对于关键数据，您应该更频繁地运行它。\n\
    - Unison 不能替代常规备份！\n- 在创建新配置文件时，要么从简单的开始，要么使用现有的作为起始模板。在确保始终拥有一个可工作的配置文件的同时添加额外的功能和特性。\n\
    \n![](img/dd9251551a61a36067892b1cc68615b0_44_3.png)\n\n# 教程\n\n这不是硬件黑客操作——备用\
    \ SD 卡可用于 Tor 路由器，其他 SD 卡可用于不同功能而不会有任何问题\n\n使用几乎只是一台树莓派（Raspberry Pi）的装置，您可以通过启用了\
    \ Tor 的接入点路由一个或多个系统，从而保证匿名性\n\n几乎在任何有互联网连接的地方都可以接入互联网——亲戚家、酒店房间等\n\n![](img/dd9251551a61a36067892b1cc68615b0_45_0.png)\n\
    \n# 使用 Onion Pi 私有浏览\n\n通过无线网络连接所有设备——无需使用电缆直接连接树莓派\n\n将您的树莓派变成一个高度安全且非常便携的路由器，以保护您的系统安全并保持浏览匿名，无论您在何处\n\
    \n# 顾问\n\nRob Zwetsloot 改造复杂系统，是一名精通 Python、Django 和 PHP 的 Web 开发人员。他喜欢进行计算实验\n\
    \n# 资源\n\n- **树莓派 Raspbian：** www.raspberrypi.org/downloads\n- **兼容的 Wi-Fi 适配器：**\
    \ www.adafruit.com/products/814\n\n我们在第 129 期中向您展示了如何将树莓派变成终极便携式无线路由器，它耗电很少，并在有最基本互联网连接的地方为您创建无线网络。但如果您觉得仅知道可以搜索网络是不够的，怎么办？如果您想在操作时完全安全，怎么办？是时候升级路由器以安装\
    \ Tor 来保护您的互联网隐私了。\n由 Adafruit 命名的这个“Onion Pi”将 Raspbian 和 Tor 结合，仅使用树莓派创建并保护一个无线接入点。这个项目相当直接：设置无线接入点后，我们安装\
    \ Tor 并进行一些基本配置任务，使其正确且安全地路由流量。这将使您在线匿名——在隐私问题遍布网络的时期，这是一个方便的功能。\n当树莓派未连接到互联网时，它仍应作为无线路由器运行，至少允许在您的位置创建无线局域网。\n\
    \n# 使用 Onion Pi 私有浏览\n\n### 将您的树莓派变成启用 Tor 的无线路由器\n\n**教程**\n\n![](img/dd9251551a61a36067892b1cc68615b0_46_0.png)\n\
    \n## 01 安装 Raspbian\n\nRaspbian 是在 Onion Pi 上应使用的树莓派发行版。下载 zip 文件，解压镜像，然后使用以下命令将其应用到\
    \ SD 卡：\n\n```bash\n$ dd bs=4M if=[version_number]-wheezy-raspbian.img of=/dev/[SD\
    \ card location]\n```\n\n如果您愿意，也可以使用 NOOBS 安装 Raspbian。\n\n## 02 设置 Raspbian\n\
    \n完成初始 Raspbian 设置并确保开启 SSH 服务器，并禁用自动启动到桌面 - 这是不必要的，只会额外消耗电力。如果有空间，还可以指示其填满卡的剩余部分。\n\
    \n## 03 PiIP\n\n我们将通过 SSH 访问您的树莓派进行设置。为此，我们需要知道其 IP 地址 - 您可以通过在命令行中输入 ifconfig\
    \ 来找到它。记下它并关闭您的树莓派。\n\n![](img/dd9251551a61a36067892b1cc68615b0_46_1.png)\n\n\
    ## 04 SSH 连接\n\n将 USB 无线适配器插入树莓派并重新开启。在另一台连接到同一网络的计算机上，打开终端或在命令行中输入：\n\n```bash\n\
    $ ssh [user]@[IP address]\n```\n\n然后如果提示输入 Raspbian 的密码，请输入密码。\n\n![](img/dd9251551a61a36067892b1cc68615b0_46_2.png)\n\
    \n## 05 安装 DHCP\n\n为了使连接到树莓派接入点的任何系统的生活更轻松，我们需要为其安装 DHCP 服务器。我们使用以下命令执行此操作：\n\n\
    ```bash\n$ sudo apt-get install hostapd isc-dhcp-server\n```\n\nDHCP 将自动为网络附属设备分配\
    \ IP 地址，意味着您不需要静态 IP。\n\n![](img/dd9251551a61a36067892b1cc68615b0_46_3.png)\n\n\
    ## 06 配置 DHCP\n\n现在我们需要配置 DHCP 服务器。使用以下命令编辑配置文件：\n\n```bash\n$ sudo nano /etc/dhcpd.conf\n\
    ```\n\n然后在两个 option domain-name 条目前面加上 #，然后删除七行后 authoritative 前面的 #。\n\n## 07\
    \ 服务器地址\n\n在配置文件末尾，添加以下内容：\n\n```\nsubnet 192.168.42.0 netmask 255.255.255.0 {\n\
    \    range 192.168.42.10 192.168.42.50;\n    option routers 192.168.42.255;\n\
    \    default-lease-time 600;\n    max-lease-time 7200;\n    option domain-name\
    \ \"local\";\n    option domain-name-servers 8.8.8.8, 8.8.4.4;\n}\n```\n\n保存并退出。\n\
    \n![](img/dd9251551a61a36067892b1cc68615b0_46_4.png)\n\n## 08 DHCP 服务器\n\n编辑服务器配置文件，使其设置为与无线适配器协同工作：\n\
    \n```bash\n$ sudo nano /etc/default/isc-dhcp-server\n```\n\n滚动到 INTERFACES 并将其更改为：\n\
    \n```\nINTERFACES=\"wlan0\"\n```\n\n47 www.linxuser.co.uk\n\n"
