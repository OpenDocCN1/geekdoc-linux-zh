    ## 评测 SparkyLinux 3.0


    ### 新特性：Debian 7.0 · Linux 内核 3.9.8 · 兼容 GNOME 3.8


    ![](img/dd9251551a61a36067892b1cc68615b0_81_0.png)


    - 提供定制化的桌面环境，如 LXDE、Openbox 和 MATE


    ![](img/dd9251551a61a36067892b1cc68615b0_81_1.png)


    - 预设的 Conky 显示提供了大量关于您系统的信息，且全部具有相关性

    - SparkyCenter 是一个便捷的小型系统控制应用，尽管其导航体验有待改进


    ### 发行版


    **SparkyLinux 3.0**


    **最低配置：** CPU 1GHz | 内存 256MB（CLI 版为 128MB） | 存储 5GB（CLI 版为 2GB）

    **适用对象：** 家庭办公


    SparkyLinux 是首批使用 Debian 7.0 ''Jessie'' 的发行版之一，其定位是适用于任何用户的轻量级系统。


    - **优点：** 基于 Debian 新测试分支的轻量级发行版；美观的界面；出色的图像选择

    - **缺点：** 与某些桌面环境兼容性不佳；非基于 Chrome 内核的浏览器在 Flash 和 JS 方面存在问题


    SparkyLinux 是一个相对较新的发行版，其首个版本直到去年五月才发布。自那时起，它经历了几次小幅升级和编号变更，目前已是第三次迭代。其理念是创建一个轻量级发行版，让新旧计算机都能使用——对于拥有高配置系统的用户，还可以享受现代美观的视觉和图形功能。不过，如果您完全不需要图形界面，还有一个便捷的
    CLI 镜像可以进一步减少空间占用——这是基于 Debian 7.0 的发行版中的又一创举。


    图形镜像有多种风味可选：标准的轻量级 LXDE 镜像、纯 Openbox 基础镜像、MATE 镜像以及运行 Razor-Qt 的版本。这些都是根据 Sparky
    的需求定制的，通常添加了 dock 和一个不错的定制主题。所有实时镜像都包含图形安装程序和命令行安装程序——后者用于 CLI 版本。两者的操作方式完全相同，选项也完全一致；然而，命令行版本使用
    cfdisk 进行分区，而图形安装程序使用 GParted。这是一个细微的差别，实际上可能会引发独特的问题——SparkyLinux 无法检测使用 GPT
    分区的硬盘上的分区。这意味着使用 UEFI 的系统在安装前可能需要清空。由于 GParted 可以处理 GPT，您可能永远不会意识到这是一个问题，因为不会弹出任何警告消息或错误。


    这也意味着 SparkyLinux 的分区完全是手动的。虽然它说明了运行所需的条件，并且 Sparky 网站有一些很好的教程来帮助您，但图形安装程序可以通过像其他现代发行版那样提供自动分区功能来改进。除了这些问题外，安装过程快速且相对无痛，虽然大多数人不会遇到
    GPT 问题，但随着越来越多系统使用 GPT，这将成为一个日益严重的问题。


    **评测**


    ![](img/dd9251551a61a36067892b1cc68615b0_82_0.png)


    ![](img/dd9251551a61a36067892b1cc68615b0_82_1.png)


    与许多现代发行版不同，安装程序要求您手动对硬盘进行分区——尽管有不错的操作说明。


    Synaptic 允许您访问整个 Debian 仓库——尽管我们在使用安装到其中的应用程序和其他软件包时遇到了一些问题。


    > “SparkyLinux 的分区完全是手动的”


    dock 上还列有其他应用程序，Synaptic 被用作主要的包管理器。虽然我们在某些网站上使用 Iceweasel 没有遇到问题，但当我们尝试使用 Chromium、Flash
    或 JavaScript 时，网站基本上会让浏览器崩溃——甚至包括 Chromium 商店。选项卡可以关闭并重新打开；然而，同样的问题会持续发生。


    ![](img/dd9251551a61a36067892b1cc68615b0_82_2.png)


    这是一个基于 Debian 测试分支的滚动发布版本，因此 Sparky 中可以使用所有最新软件。


    ### 独特的审美


    默认登录管理器非常简单：一个用户下拉列表，以及角落里隐藏的几个选项，允许您更改区域设置和桌面会话。没有什么花哨的东西。然而，默认桌面各具特色，拥有 SparkyLinux
    独有的审美质量。单色图标和颜色的巧妙运用美化了桌面，LXDE 包含的 dock 增加了其可用性。还有一个预配置的 Conky 显示，提供了出色的系统信息选择。这在实时镜像中也有展示，以防您需要密切关注系统状态。


    SparkyLinux 拥有一个出色的图形系统管理器，类似于 Mageia 等工具，尽管布局不够好，深度也不够深。SparkyCenter 允许您更改发行版的主题和整体外观、软件源、Flash
    和 Java 设置、默认应用程序、硬盘管理等。界面以图标形式呈现，它们移动到不同的层，虽然没有返回按钮，但退出窗口会让您回退一步。


    默认应用程序选择很不错，虽然没有对真正的自由软件做出承诺，但 dock 上展示了 VLC、GIMP 和 Iceweasel 以及其他几个应用程序，Synaptic
    被用作主要包管理器。


    ### 不该发生的事


    这也不是唯一让我们遇到问题的额外软件包——尝试安装 Cinnamon 时完全失败，启动时只出现斑斑驳驳的黑屏。即使默认桌面没有提供，这种事也不应该发生。至少，默认桌面都运行良好，尤其是
    Razor-Qt 版本，它正迅速成为我们最喜欢的轻量级桌面之一。


    基于 Debian，仓库自然充满了所有最新最好的软件。SparkyLinux 之所以迭代如此频繁，是因为它被视为滚动发布——基本上是根据特定间隔从 Debian
    测试分支更新的快照。如果您喜欢处于最前沿，这意味着 Sparky 始终是最新的。然而，我们认为不值得。虽然默认应用程序和桌面再好，但受到严格限制并不是 Linux
    的方式。它值得一看，但不要抱太大希望。


    **Rob Zwetsloot**


    ![](img/dd9251551a61a36067892b1cc68615b0_82_3.png)


    截图图库


    bit.ly/LUDSL3


    ### 总结


    SparkyLinux 有一些很棒的想法，并且运行非常好——除非您决定稍微超出预定义的应用程序和桌面界限。它值得一看，但不适合所有人。


