    \ the Raspberry Pi at 51.45ms, but still some way behind the Gizmo’s impressive\
    \ 9.87ms score. Add in the fact that the Gizmo can run two threads simultaneously\
    \ and its clear Intel isn’t going to win on outright performance – although it\
    \ has included Hyper-Threading support in the MinnowBoard for pseudo dual-core\
    \ operation.\n\n## Intel MinnowBoard\nx86-based embedded development board\n\n\
    ### Review\n\n![](img/dd925151551a61a36067892b1cc68615b0_12_0.png)\n\n- A micro-SDIO\
    \ slot plays host to a bundled SD card containing the Angström operating system\n\
    - A small heat sink passively cools the Intel Atom E650T processor\n- Bundled\
    \ risers lift the board up in order to allow the processor room to cool\n\n###\
    \ Technical specs\n\n| **Spec** | **Detail** |\n| :--- | :--- |\n| **Operating\
    \ system** | Angström Linux (Yocto Certified) |\n| **Processor** | 32-bit Intel\
    \ Atom E640T single-core at 1GHz |\n| **Video** | Embedded Intel GMA 600 |\n|\
    \ **Memory** | 1GB DDR2, 4MB SPI Flash (Firmware Storage) |\n| **Dimensions**\
    \ | 106 x 115mm |\n| **Weight** | 119g (excluding PSU) |\n| **Input/Output** |\
    \ DVI-over-HDMI, Analogue audio in & out, 2x USB, 1x SATA-2, 1x USB device, 1x\
    \ Serial console, Gigabit Ethernet, 1x micro-SDIO |\n| **Extras** | Lure connector\
    \ with CAN bus, HD audio, LVDS, I2C, 3x PCI Express, SATA-2, SDIO, SPI bus, 2x\
    \ UART, 2x USB |\n| **Power** | 5V at 2.5A |\n\n- Four switches combine with two\
    \ user-controllable LEDs to get users started with the board's capabilities\n\n\
    ### Also consider\n\n![](img/dd925151551a61a36067892b1cc68615b0_12_1.png)\n\n\
    **Sage Gizmo**\n**$169 (E14.29)**\n\nBased on an embedded AMD APU, it is far more\
    \ powerful than the MinnowBoard. Embedded graphics aid computer performance and\
    \ a bundled expansion board makes getting started easy. It does, however, require\
    \ more power under load. gizmosphere.com\n\n![](img/dd925151551a61a36067892b1cc68615b0_12_2.png)\n\
    \n**Raspberry Pi**\n**£26.07**\n\nThe Pi’s ARMv6 processor is considerably less\
    \ capable than the MinnowBoard’s Atom – but at almost a sixth the price, it’s\
    \ easy to overlook this in favour of having spare cash for add-on hardware and\
    \ tinkering components. raspberrypi.org\n\nTreating the MinnowBoard as a standard\
    \ computer, however, misses the point entirely. The device is designed for embedded\
    \ development, and to help Intel regain a foothold in a market that has become\
    \ almost completely dominated by ARM-based systems. Accordingly, it includes eight\
    \ buffered general-purpose input-output pins, along with two user-controllable\
    \ LEDs and a set of four switches. Together, these turn the MinnowBoard into a\
    \ ready-to-run system for developing embedded applications – and unlike with ARM-based\
    \ devices, those used to an x86 toolchain don’t have to learn anything new.\n\n\
    The board also includes an expansion connector for add-in daughterboards dubbed\
    \ 'Lures'. Designed to be analogous to the 'shields' of the Arduino microcontroller,\
    \ the port gives each Lure access to considerable potential: as well as three\
    \ PCI Express lanes, an SDIO channel, two USB channels and more, the port carries\
    \ everything from CAN to I2C buses. Although there are no Lures available on the\
    \ open market at the time of writing, several are in development – including one\
    \ which will offer compatibility with Arduino shields. That doesn’t mean the main\
    \ board is bereft of connectivity: a micro-SDIO slot for the boot device, two\
    \ USB ports, analogue audio connections, Gigabit Ethernet, and mini- and micro-USB\
    \ ports for acting as a USB device or as a debug serial console are included.\
    \ The board also features a SATA-2 port, offering up to 3Gbps of throughput to\
    \ a mass storage device – with a second port available through the Lure expansion\
    \ port if required.\n\nAt present, the MinnowBoard ships with a bare-bones installation\
    \ of Angstrom Linux – no friendly out-of-box experience here. With full Yocto\
    \ Project certification, however, rolling your own OS isn’t a challenge and Intel\
    \ is in talks with distributions including Ubuntu to add support for the board’s\
    \ somewhat unique 32-bit UEFI firmware.\n\nUsing documentation – still in progress\
    \ – from the project’s founders, the MinnowBoard is quick to offer up its GPIO\
    \ capabilities. The only real disappointment comes from the HDMI socket, which\
    \ only carries a DVI signal and not the audio required of a full HDMI implementation.\
    \ There’s also no support for HDCP encryption, although anyone considering using\
    \ the MinnowBoard as a media playback system has probably missed the point of\
    \ its design and features.\n\nGareth Halfacree\n\n### Summary\n\nThe MinnowBoard\
    \ is a welcome foray from Intel into the world of open hardware and offers considerable\
    \ potential. While its performance may lag behind the rival Gizmo board, the Lure\
    \ connector holds promise for some impressive add-ons to come – but its high price\
    \ means the Raspberry Pi has little to fear from this upstart.\n\nMore information\
    \ minnowboard.org\n"
  mdcn: "\n\n![](img/dd9251551a61a36067892b1cc68615b0_10_0.png)\n\n## 鱼灵板 (MinnowBoard)\
    \ 与 树莓派 (Raspberry Pi)\n### 对比分析\n\n### 树莓派\n（B 型号，Rev. 2）\n\n![](img/dd92515151a61a36067892b1cc68615b0_10_1.png)\n\
    \n树莓派激发了成千上万的人首次尝试 Linux，并重新激发了人们对裸机计算的兴趣。它为创建迷人的物联网项目打开了大门，并极大地降低了编程和物理计算入门的门槛。不过，事情并非一帆风顺：其低价意味着开箱即用的体验并不完美。用户仍需自备\
    \ microSD 卡、HDMI 线和电源，这意味着“入门套装”的零售价往往高达 60 英镑以上。\n\n尽管其原始处理能力在英特尔 x86 CPU 面前相形见绌，但树莓派继续以其卓越的多媒体性能令用户惊叹。\n\
    \n![](img/dd925151a61a36067892b1cc68615b0_10_2.png)\n\n- 标准 SD 卡支持良好，但高速 SD 卡是值得额外花费的\n\
    \n![](img/dd92515151a61a36067892b1cc68615b0_10_3.png)\n\n- 树莓派的小巧尺寸使其非常适合隐藏在显示器后面或收纳在项目盒中\n\
    \n### 树莓派规格\n\n| | |\n| :--- | :--- |\n| **价格** | 28 英镑 |\n| **尺寸** | 86 x 54mm\
    \ |\n| **重量** | 40g |\n| **操作系统** | 不包含（支持 Raspbian 及其他系统） |\n| **处理器** | ARM1176JZF-S\
    \ (armv6k) 单核 700 MHz |\n| **视频** | VideoCore IV |\n| **最大分辨率** | 全高清，带 HDCP 加密\
    \ |\n| **内存** | 512MB DDR2（共享） |\n| **输出** | DMI（带 HDCP 加密），复合 RCA，模拟音频输出 |\n\
    | **输入** | 2 个 USB，1 个 micro-USB，SD 卡插槽，26 个 GPIO 引脚 |\n| **网络** | 10/100 以太网\
    \ |\n| **实时时钟** | 无（可通过 GPIO 添加） |\n| **其他** | DSI 显示连接器，JTAG 接头，CSI（摄像头模块）连接器，SPI\
    \ 总线，I2C，UART |\n| **电源** | 5V 700mA（不包含） |\n\n- 这里最好配备 microSD 卡插槽\n\n![](img/dd925151a61a36067892b1cc68615b0_10_4.png)\n\
    \n- 多媒体支持确实非常出色\n- 26 个 GPIO 引脚意味着有巨大的折腾空间。可惜不支持模拟信号\n- 博通 SoC 非常棒，尽管偶尔会卡顿\n-\
    \ 树莓派的音频可能是其最弱的方面。也不支持麦克风\n\n![](img/dd925151a61a36067892b1cc68615b0_10_5.png)\n\
    \n![](img/dd925151a61a36067892b1cc68615b0_10_6.png)\n\n---\n\n- 用于附加板的 Lure 连接器承载了从\
    \ CAN 总线信号到三条 PCI Express 通道的一切\n- HDMI 接口提供 DVI 视频连接，但不传输数字音频\n\n![](img/dd92515151a61a36067892b1cc68615b0_11_0.png)\n\
    \n- 两个 USB 端口为外部外设提供连接\n- 千兆以太网赋予鱼灵板强大的网络能力\n\n## 开发平台\n### 英特尔鱼灵板 (Intel MinnowBoard)\n\
    \n162.83 英镑（200 美元）\n\n英特尔对树莓派的回应来了——但价格几乎是其六倍，它能诱使买家回归 x86 吗？\n\n- **优点**\n \
    \ - 强大、灵活，为嵌入式开发新手提供熟悉的 x86 环境\n- **缺点**\n  - 与 ARM 同类产品相比，它很昂贵，且性能落后于 AMD 的对手产品\
    \ Gizmo。\n\n显然，鱼灵板不是树莓派。其最短边为 102mm，体积明显更大，运行需要 5V 电源提供高达 2.5A 的电流，且价格几乎是信用卡大小的树莓派的六倍。然而，鱼灵板提供了树莓派所缺乏的功能：完整的\
    \ x86 兼容性。\n\n鱼灵板的核心是英特尔较低端的处理器之一：Atom E640T。这款单核芯片运行在 1GHz，提供 32 位 x86 实现——这使得它在与竞争对手\
    \ AMD Gizmo 上的双核 64 位 APU（最接近的可比较设备）对比时处于劣势——同时产生惊人的低热量，允许通过紧凑的散热器进行被动冷却。\n\n\
    凭借 1GB 内存，鱼灵板为嵌入式计算提供了一个令人惊讶的强大且轻量级的平台。在测试中，其插槽功耗峰值为 7W，得分令人尊重的第 95 百分位时间为 11.49ms——比树莓派的\
    \ 51.45ms 快近五倍，但仍落后于 Gizmo 令人印象深刻的 9.87ms 得分。加上 Gizmo 可以同时运行两个线程这一事实，显然英特尔在纯粹性能上不会获胜——尽管英特尔在鱼灵板中包含了超线程支持，以进行伪双核操作。\n\
    \n## 英特尔鱼灵板\n基于 x86 的嵌入式开发板\n\n### 评测\n\n![](img/dd925151551a61a36067892b1cc68615b0_12_0.png)\n\
    \n- micro-SDIO 插槽用于容纳捆绑的 SD 卡，其中包含 Angström 操作系统\n- 小型散热器被动冷却 Intel Atom E650T\
    \ 处理器\n- 捆绑的增高架将主板抬起，以便为处理器留出冷却空间\n\n### 技术规格\n\n| **规格** | **详情** |\n| :--- |\
    \ :--- |\n| **操作系统** | Angström Linux（Yocto 认证） |\n| **处理器** | 32 位 Intel Atom\
    \ E640T 单核 1GHz |\n| **视频** | 嵌入式 Intel GMA 600 |\n| **内存** | 1GB DDR2，4MB SPI\
    \ Flash（固件存储） |\n| **尺寸** | 106 x 115mm |\n| **重量** | 119g（不含电源） |\n| **输入/输出**\
    \ | DVI-over-HDMI，模拟音频输入和输出，2 个 USB，1 个 SATA-2，1 个 USB 设备，1 个串行控制台，千兆以太网，1 个 micro-SDIO\
    \ |\n| **其他** | 带 CAN 总线、高保真音频、LVDS、I2C、3 个 PCI Express、SATA-2、SDIO、SPI 总线、2 个\
    \ UART、2 个 USB 的 Lure 连接器 |\n| **电源** | 5V 2.5A |\n\n- 四个开关与两个用户可控 LED 结合，帮助用户开始探索板子的功能\n\
    \n### 其他推荐\n\n![](img/dd925151551a61a36067892b1cc68615b0_12_1.png)\n\n**Sage Gizmo**\n\
    **169 美元（14.29 英镑）**\n\n基于嵌入式 AMD APU，其性能远强于鱼灵板。嵌入式图形有助于提升计算机性能，而捆绑的扩展板使入门变得容易。然而，在负载下需要更多的电力。gizmosphere.com\n\
    \n![](img/dd925151551a61a36067892b1cc68615b0_12_2.png)\n\n**Raspberry Pi**\n**26.07\
    \ 英镑**\n\n树莓派的 ARMv6 处理器功能远不如鱼灵板的 Atom——但以不到六分之一的价格，人们很容易忽略这一点，转而将省下的钱用于附加硬件和折腾组件。raspberrypi.org\n\
    \n然而，将鱼灵板当作标准计算机看待是完全错误的。该设备专为嵌入式开发设计，旨在帮助英特尔在一个几乎完全由基于 ARM 的系统主导的市场中重新站稳脚跟。相应地，它包括八个缓冲的通用输入/输出引脚，以及两个用户可控的\
    \ LED 和一组四个开关。这些功能共同将鱼灵板转变为一个即可运行的嵌入式应用开发系统——而且与基于 ARM 的设备不同，习惯 x86 工具链的用户不需要学习任何新东西。\n\
    \n该板还包含一个用于附加子板的扩展连接器，称为“Lure”（鱼饵）。其设计类似于 Arduino 微控制器的“Shield”（护盾），该端口赋予每个 Lure\
    \ 相当大的潜力：除了三条 PCI Express 通道、一个 SDIO 通道、两个 USB 通道等外，该端口还承载了从 CAN 到 I2C 总线的一切。虽然撰写本文时开放市场上没有可用的\
    \ Lure，但有几个正在开发中——包括一个将提供与 Arduino Shield 兼容性的产品。这并不意味着主板缺乏连接性：它包含用于启动设备的 micro-SDIO\
    \ 插槽、两个 USB 端口、模拟音频连接、千兆以太网，以及用于作为 USB 设备或调试串行控制台的 mini- 和 micro-USB 端口。该板还具备\
    \ SATA-2 端口，可为大容量存储设备提供高达 3Gbps 的吞吐量——如果需要，可通过 Lure 扩展端口获得第二个端口。\n\n目前，鱼灵板附带的是一个极简的\
    \ Angstrom Linux 安装——这里没有友好的开箱即用体验。然而，凭借完整的 Yocto 项目认证，自行构建操作系统并非难事，英特尔正在与包括 Ubuntu\
    \ 在内的发行版洽谈，以增加对该板独特 32 位 UEFI 固件的支持。\n\n使用项目创建者（仍在进行中）的文档，鱼灵板能迅速展示其 GPIO 功能。唯一的真正失望来自\
    \ HDMI 插座，它仅传输 DVI 信号，而不是完整 HDMI 实现所需的音频。也不支持 HDCP 加密，尽管任何考虑将鱼灵板用作媒体播放系统的人可能已经错过了其设计和功能的核心要点。\n\
    \nGareth Halfacree\n\n### 总结\n\n鱼灵板是英特尔进军开源硬件世界的一次令人欢迎的尝试，并展示了可观的潜力。虽然其性能可能落后于竞争对手\
    \ Gizmo 板，但 Lure 连接器预示着未来将出现一些令人印象深刻的附加组件——但其高昂的价格意味着树莓派无需惧怕这个新来者。\n\n更多信息请访问\
    \ minnowboard.org\n\n"
