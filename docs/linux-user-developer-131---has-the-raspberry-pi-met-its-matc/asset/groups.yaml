    \ Nook 的用户界面，也可以将其切换为标准的 Android。\n\n配备 9 英寸显示屏的 Nook HD+ 握持手感相当不错，结构坚固且分量十足。其设计在好与坏两方面都颇具特色。屏幕周围较大的边框并没有预想中那么碍眼，而“n”形的主页键为平板电脑赋予了微妙的品牌标识。缺点是左下角那个没有任何明显用途的奇怪孔洞。看起来它似乎是为了系挂绳设计的，但平板电脑太大太重，使得这种用法并不实用。\n\
    \n屏幕是 Nook 的突出特色。拥有 1920x1280 的分辨率和 257ppi 的像素密度，它接近 iPad 视网膜显示屏的水平，表现出色。文字清晰锐利，对眼睛非常友好。不过我们发现屏幕亮度稍显不足。也许这是因为该平板电脑主要被设计为电子阅读器，需要减少眩光，但在通用场景下，我们将亮度调至最大，甚至希望还能更亮一些。\n\
    \n软件也是为电子书打造的。就像亚马逊的 Kindle Fire 系列一样，用户界面的大部分旨在鼓励用户购买内容，但与 Kindle 不同的是，你可以获得完整的\
    \ Google 应用套装，并且可以访问 Play 商店。预装了许多应用，从 Spotify 到 Pinterest 再到填字游戏应用，这些应用均无法删除。在使用平板电脑之前，你需要一个\
    \ Nook 账户，并且访问 Play 商店还需要你的 Google 账户详情。\n\n稍微折腾一下，你就可以让 Nook 看起来像一块普通的带定制界面的\
    \ Android 4.0 平板电脑。我们不指望能收到操作系统更新，但它可以被 root，并且有 Jelly Bean ROM 可用。未来也有很大几率会出现\
    \ KitKat (Android 4.4) ROM。\n\n**Sandra Vogel**\n\n> **优点**\n> 出色的屏幕和卓越的电池续航；易于破解\n\
    >\n> **缺点**\n> 预装应用无法移除；某些设计决定显得奇怪\n\n**总结**\n\nNook HD+ 是一款相当不错的设备，拥有良好的硬件和出色的显示屏。它出乎意料地灵活；你可以将其用作休闲的电子书优化平板、使用全套\
    \ Android 应用，或者对其进行破解和调整。\n\n**更多信息**\n\nwww.nook.co.uk\n\n![](img/dd9251551a61a36067892b1cc68615b0_79_0.png)\n\
    \n- 遗憾的是，Pi 的备用 GPIO 引脚没有直通连接\n- 一个小芯片为 Pi 提供用于无线通信的无线电\n- 小型陶瓷天线可以替换为鞭状天线以增强信号范围\n\
    - 虽然体积小，但 Slice of Radio 会阻挡很少使用的显示串行接口（DSI）连接器\n\n### 外围设备\n\n### Raspberry Pi\
    \ 无线发明家套件\n\n**£49.99**\n\n![](img/dd9251551a61a36067892b1cc68615b0_79_1.png)\n\
    \n旨在将无线 Arduino 微控制器与 Raspberry Pi 配对，这款 RasWiiK 是否就是那些有志开发人员一直等待的产品？\n\n- **优点**\n\
    \  - 使用 Raspberry Pi 入门无线微控制器开发的最简单方式\n- **缺点**\n  - LLAP 无线协议不提供加密功能；Slice of\
    \ Radio 会阻挡 Pi GPIO 头针上未使用的引脚\n\n虽然很容易将 Arduino 和 Raspberry Pi 视为竞争对手——毕竟它们都是面向爱好者市场的低成本电子设备——但事实它们是极其互补的：Arduino\
    \ 在实时控制和传感方面表现出色，而 Pi 则提供了廉价的网络连接和强大的数据处理能力。显然，这正是 Ciseo 在设计 Raspberry Pi 无线发明家套件（即\
    \ RasWiiK）时的考量：作为一套组件和配件的组合，它旨在让在 Raspberry Pi 上使用 Arduino 的操作尽可能简单，并向用户展示当两者通过无线电链路连接时所释放的巨大潜力。\n\
    \n开始使用非常简单：套件包含一张 4GB SD 卡，其中预装了定制版的 Raspbian 操作系统。只需将其插入 Pi，将附带的 Slice of Radio\
    \ 板扣在 GPIO 头针上并通电即可。\n\nSD 卡中包含一个开源的示例工具，用于控制随附的无线电装备微控制器——被称为 XinoRF 的 Arduino\
    \ 克隆版。使用该工具，屏幕上会出现该板卡的可视化表示——并允许用户开启或关闭输出，或读取数字或模拟输入引脚的值。\n\n如果 Arduino 没有连接任何设备，这很快就会变得非常乏味，但套件还包含许多组件以及各种实验和小型项目的说明。使用附带的紧凑面包板，你可以在几分钟内开始构建简单的电路——远程蜂鸣器、交通灯，甚至是光线和温度传感器。\n\
    \n当你制作好设备后，RasWiiK 还藏着一个厉害的招数：XinoRF 上的嵌入式无线电可以毫不费力地连接到 Slice of Radio，允许你将 XinoRF\
    \ 放置在 Raspberry Pi 所在建筑物的几乎任何位置，并仍能控制它。该系统使用轻量级本地自动化协议（LLAP），允许在同一无线电网络上存在多个设备——更多的\
    \ XinoRF、更多的 Raspberry Pi，或 Ciseo 出售的其他 LLAP 兼容配件。\n\n这里也露出了该套件唯一的真正缺点：LLAP 极其轻量，这对于一个程序存储容量仅约\
    \ 32KB 的微控制器协议来说是在所难免的。相应地，它不包含任何防入侵保护；因此，如果你的邻居购买了一套 RasWiiK 套件，他或她完全能够控制你制作的任何设备。\n\
    \n不过，对于实验者来说，这只是个小问题。虽然套件开箱即用 LLAP，但该无线电也可以用作点对点串行连接，如果你想要强大的安全性，还可以在其上方编写自己的协议。\n\
    \n除了这个小问题，RasWiiK 套件几乎没有令人不快的地方。无线电提供了令人惊讶的信号范围，特别是 Slice of Radio 是一款非常巧妙的设计，可以安稳地放置在\
    \ Pi 的 GPIO 端口上方而不增加其尺寸——这意味着它可以与市场上绝大多数非金属外壳配合使用。\n\n对于那些喜欢摆弄 Pi 的 GPIO 硬件的人来说，唯一的真正缺点是\
    \ Slice of Radio 不包含头针上其他引脚的直通连接，尽管它只使用了电源和 UART 连接本身。小心翼翼地使用烙铁可以让你修复这一问题，但如果你不喜欢这种修改且只有一块\
    \ Pi，你很快就会厌倦为了使用其他 GPIO 连接设备而反复拆卸无线电板。\n\nGareth Halfacree\n\n### 总结\n\n虽然很容易因不安全的协议而降低\
    \ RasWiiK 的评分，但这样做是本末倒置：它是入门无线微控制器开发的便捷方式，并为在 Raspberry Pi 上添加传感器或执行器提供了绝佳的平台。如果安全是个问题，用户始终可以自行编写协议。\n\
    \n![](img/dd9251551a61a36067892b1cc68615b0_80_3.png)\n\n### Gerbboard，£5 + 增值税\n\
    \n![](img/dd9251551a61a36067892b1cc68615b0_80_4.png)\n\nGerbboard 是早期为 Pi 开发的附加板之一，它是一个有线\
    \ GPIO 扩展模块。由于代码示例难以访问且硬件操作不便，它并不完全适合初学者，但它仍然是一种以负担得起的价格提升 Pi 的 GPIO 能力的方法——但同样，它没有集成无线硬件。\n\
    \nwww.gerbboard.com\n\n![](img/dd9251551a61a36067892b1cc68615b0_80_5.png)\n\n\
