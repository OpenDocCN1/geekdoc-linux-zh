    \ ✔ | ✔ | ✔ | ✔ | ✔ | ✔ |\n\n\\* O = Option\n\n## Your view\n\nYour source of\
    \ Linux news and views\n\n- Contact us...\n  - Register and post your comments...\n\
    \  - www.linuxuser.co.uk/forums/\n  - Email us directly...\n  - linuxuser@imagine-publishing.co.uk\n\
    \n## YOUR VIEW\n\nLinux User Letters\n\nYour opinions about the magazine, Linux\
    \ and open source\n\n![](img/dd9251551a61a36067892b1cc68615b0_93_0.png)\n\n###\
    \ Piece of Pisi\n\nI remember a while ago you talked about Pisi Linux, an alternative\
    \ to Pardus that was a bit more like the original. I was sad to see that DistroWatch\
    \ refuses to even list Pisi Linux because someone trolled them, telling them it\
    \ was not active, setting up fake Pisi Linux sites etc. DistroWatch apparently\
    \ decided they would remove it from their lists. Very sad and disappointing on\
    \ the part of DistroWatch. I hope that when it finally reaches stable release\
    \ they'll add Pisi back to the database, as the older Pardus es were some of my\
    \ favourite distros!\n\nPisi Linux is currently in beta\n\nMark Doyle\n\nIt's\
    \ a shame that DistroWatch took the stance. Going by the Pisi team's side of the\
    \ story, it seems like DistroWatch were duped; however, the folks over at DistroWatch\
    \ haven't responded to the Pisi team since their explanation. The beta for it\
    \ is out now, but Pisi is not back on DistroWatch just yet. Look out for a review\
    \ of the full version when it's finally released.\n\n### THREAD BARE\n\nWay of\
    \ the future\n\nThings are heating up in the display server space, as both Wayland\
    \ and Canonical's Mir are set to try to replace the X server shortly. Richard\
    \ Hillisley's piece on Wayland in issue 127 inspired some debate on the website\
    \ about replacing X. Join in the conversation here: bit.ly/LUDWay\n\n![](img/dd9251551a61a36067892b1cc68615b0_93_1.png)\n\
    \nWayland is intended as a simpler replacement for X\n\n- Henrik Danielson said:\n\
    \  I can tell, one problem is that Mir is intentionally incompatible with Wayland.\n\
    \n- Bob Robert said:\n  I use the network display functionality of X on a regular\
    \ basis. The switch to Wayland is fine by me (I'm a user, not a programmer) so\
    \ long as I can still 'ssh -X' and launch GUI applications that display on my\
    \ local machine. That X did network transparency 'mainline' and Wayland would\
    \ do it with a 'plug-in' is actually unimportant to me. What matters is that it\
    \ DOES it. Its functionality I use, and want.\n\n- bwait47 said\n  I don't think\
    \ the situation is quite as bad as its seems. Both Mir and Wayland have several\
    \ major similarities in their architecture, such as using EGL. For drivers, theoretically\
    \ it should not be difficult to support both as long as they provide EGL support.\
    \ For applications things shouldn't be that bad either; because Mir/Wayland support\
    \ is at the toolkit level. The biggest burden will probably be on the toolkits,\
    \ though: having to have and support two back-ends in addition to X (because X\
    \ will not be totally going away any time soon).\n\n- Gene Moesher said:\n  Keith\
    \ Flickard asks: \"How many of those applications care about network transparency,\
    \ which was one of the original headline features of X? How many of them care\
    \ about ICCCM compliance? How many of them care about X at all? The answer to\
    \ all of those questions, of course, is 'very few.' And if we all are among the\
    \ 'very few,' then what does the future hold for us, Keith?\"\n"
