    # MinnowBoard vs Raspberry Pi


    # **COMPARED**


    # # Raspberry Pi


    (Model B, Rev. 2)


    ![](img/dd9251551a61a36067892b1cc68615b0_10_1.png)


    The Raspberry Pi has inspired thousands to try Linux for the **first time** and
    reinvigorated interest in **bare-metal computing**. It opens the door to the creation
    of fascinating Internet Of Things projects and drastically lowers the barrier
    of entry for both programming and physical computing. It’s not all plain sailing,
    though: its low-price means the out of the box experience isn’t stellar. One still
    needs to acquire a microSD card, an HDMI cable and power supply, meaning ‘starter
    packs’ can retail upwards of £60.


    While its raw processing power is left in the shade by Intel’s x86 CPU, the Raspberry
    Pi continues to amaze users with its remarkable multimedia prowess.


    ![](img/dd9251551a61a36067892b1cc68615b0_10_2.png)


    ■ Standard SD card support is good, but high-speed SD cards are worth the extra
    expense


    ![](img/dd9251551a61a36067892b1cc68615b0_10_3.png)


    ■ The Pi’s small size makes it ideal for hiding behind a monitor or stashing in
    a project box


    # ## Raspberry Pi Specs


    | | |

    | :--- | :--- |

    | **Price** | £28 |

    | **Dimensions** | 86 x 54mm |

    | **Weight** | 40g |

    | **Operating system** | None included (Raspbian & others supported) |

    | **Processor** | ARM1176JZF-S (armv6k) single-core at 700 MHz |

    | **Video** | VideoCore IV |

    | **Max resolution** | Full HD with HDCP encryption |

    | **Memory** | 512MB DDR2 (shared) |

    | **Output** | DMI (with HDCP encryption), composite RCA, analogue audio out |

    | **Input** | 2x USB, 1x micro-USB, SD card slot, 26x GPIO pins |

    | **Networking** | 10/100 Ethernet |

    | **Real-time clock** | No (can be added via GPIO) |

    | **Extras** | DSI display connector, JTAG headers, CSI (camera module) connector,
    SPI bus, I2C, UART |

    | **Power** | 5V at 700mA (not included) |




    ■ A microSD card slot would have been preferable here


    ![](img/dd9251551a61a36067892b1cc68615b0_10_4.png)


    ■ The multimedia support is frankly stellar


    ■ 26 GPIO pins means there’s massive scope for tinkering. No analogue support,
    though, sadly


    ■ The Broadcom SoC is brilliant, even if it chugs occasionally


    ■ The audio on the RasPi is probably its weakest aspect. No mic support either


    ![](img/dd9251551a61a36067892b1cc68615b0_10_5.png)


    ![](img/dd9251551a61a36067892b1cc68615b0_10_6.png)


