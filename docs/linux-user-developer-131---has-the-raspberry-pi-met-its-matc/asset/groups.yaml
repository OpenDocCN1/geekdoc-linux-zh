    # Questions & answers


    ![](img/dd9251551a61a36067892b1cc68615b0_89_0.png)


    ![](img/dd9251551a61a36067892b1cc68615b0_89_1.png)


    ![](img/dd9251551a61a36067892b1cc68615b0_89_2.png)


    One method we''d recommend using on Linux would be wget, the standard downloading
    tool for the command line. You can download the contents of a web directory with
    something like:


    ```

    $ wget --mirror -p --convert-links -P /destination/folder/ http://www.website.com/directory/

    ```


    You can also use curl as well. This can also be used with single files if you
    find yourself without a browser to use.


    ## Assault on battery


    I want to have a notification show up in the event that my laptop battery charge
    falls below 10%, as I regularly move around when working on it. I guess that most
    desktop environments provide a notification of this sort, and I use GNOME with
    a few other programs, so I just need something like a notification daemon and
    front-end. I''ve had a few close calls while working so far, and I''d really rather
    not go back to a desktop environment I don''t have to.


    Can you suggest any notification tools? I would prefer a lightweight package that
    I can extend with other notifications, but any suggestions are welcome. If there
    are any GNOME notification tools that work well outside of their environments,
    that would also do.


    Chris Dodd


    ![](img/dd9251551a61a36067892b1cc68615b0_89_3.png)


    There''s actually a couple of great tools you can use on GNOME to get this type
    of functionality. You can use 13, which is a tiling window manager, which can
    be used on its own or in conjunction with TWM. Both offering notification windows,
    and 13 is specifically designed to work with the xmobar as well. 13 is also very
    extensible, and it can be used for a lot more than just battery notifications.
    Hope this helps.


    ## Oracle of Java


    So I have the OpenJDK installed on my system, and it turns out I need to use the
    official Oracle JDK for a project I''m working on. Only, it seems like I can''t
    just install it and expect it to work — how do I go about setting up my system
    to use the Oracle JDK? I''m currently running Ubuntu. Thanks.


    ![](img/dd9251551a61a36067892b1cc68615b0_89_4.png)


    Peter Chan


    Okay, so the process for doing this is a two-step one. Firstly, you need to download
    the JDK files from the Oracle website, which come in a tarball. Extract these
    and this will create a *jdk1.7.0_0x* directory in the location of your choosing.


    Now create a new directory for it and move into it with:


    ```

    $ sudo mkdir -p /usr/lib/jvm

    $ sudo mv ./jdk1.7.0[Current Version] /usr/lib/jvm/jdk1.7.0

    ```


    Now you need to run some specific commands to update the system Java info, allowing
    you to then switch to it. First of all do:


    ```

    $ sudo update-alternatives --install "/usr/bin/java" "java" "/usr/lib/jvm/jdk1.7.0/bin/java"
    1

    ```


    ```

    $ sudo update-alternatives --install "/usr/bin/javac" "javac" "/usr/lib/jvm/jdk1.7.0/bin/javac"
    1

    ```


    ```

    $ sudo update-alternatives --install "/usr/bin/javaws" "javaws" "/usr/lib/jvm/jdk1.7.0/bin/javaws"
    1

    ```


    Now, correct the file ownership and the permissions of the executables with:


    ```

    $ sudo chmod a+x /usr/bin/java

    ```


    ![](img/dd9251551a61a36067892b1cc68615b0_89_5.png)


    Battery management is not always easy


    ![](img/dd9251551a61a36067892b1cc68615b0_89_6.png)


    Make sure Java knows where itself is located


    ## Questions & answers

    All your technical problems solved


    ![](img/dd9251551a61a36067892b1cc68615b0_90_0.png)


    ■ The right drivers don’t always produce the right response


    ```

    $ sudo chmod a+x /usr/bin/javac

    $ sudo chmod a+x /usr/bin/javaws

    $ sudo chown -R root:root /usr/lib/jvm/jdk1.7.0

    ```


    Now we need to select the new JDK by running:


    ```

    $ sudo update-alternatives --config java

    ```


    You’ll be shown a list with numbers from which to choose the new JDK from – make
    sure to choose the one we’ve been setting up. Now we can make sure it’s done properly
    by checking the Java version with:


    ```

    $ java -version

    ```


    You can now also switch back to OpenJDK, if you need to, with the `config java`
    command.


    ## Graphical Java


    I’ve just upgraded my box to the Radeon drivers, and it’s so far proved to be
    a good idea. The box runs smoothly now. There are some issues with Java OpenJDK,
    though.


    How do I get it to use OpenGL? There may well be the option to use Sun’s Java,
    but it needs AOSS – so, either I tweak the OpenJDK to not crash and use OpenGL/acceleration;
    or I use Sun’s JRE, but it would involve installing OSS.


    **Chris Kimpton**


    You’re going to have to use a little hack so that Java knows where it’s located.
    Create it with:


    ```

    $ nano /etc/ld.so.conf.d/javaworkaround.conf

    ```


    ...and then enter the following into it:


    ```

    /usr/lib/jvm/java-7-openjdk-amd64/jre/lib/amd64

    /usr/lib/xulrunner-17.0

    ```


    ...and run `ldconfig` as root. Choose `/home` for the user and `/libnppj2.so`
    file locations. The Oracle and OpenJDK versions of Java are linked to PulseAudio,
    so sound-wise you’re better off using PulseAudio.


    There’s some Java OpenGL packages, too, that you might want to install with:


    ```

    $ dpkg-query --list-avail -l ''*jogl*''

    ```


    Hopefully that should fix things up for you.


    ## Terminal trouble


    I’m experiencing a very weird problem – every now and then I don’t get some work
    in the terminal on my system. However, whenever I try and open the terminal emulator,
    it opens for a brief instant and then automatically closes.


    The system in question is CentOS, which I have to access remotely via VNC. It’s
    using Xfce as a desktop environment as well. The weird thing is, it works just
    fine if I’m logged in as root, so I can only assume it’s a problem with the user
    type. Obviously, I don’t want to make some of the normal users have full root
    privileges, and I’d much rather not log in as root every time I work on this system.
    Have you heard of anything like this before? Is there something fairly obvious
    that I’m missing?


    Thanks for any help.


    **Thomas Reid**


    ![](img/dd9251551a61a36067892b1cc68615b0_90_1.png)


    ■ When connecting remotely, some settings are different for displays


    > > Open the terminal while logged in as root, and then change to another user


    ```

    $ su -l <user>

    ```


    This will allow you to open another shell to log in with and then try to open
    the terminal. Any errors will show up in the root terminal. What may likely happen
    is that you cannot even load into the shell.


    This is because the user will not have access to connect to the X server because
    you are using it via VNC. To solve this, you just need to add the relevant users
    to the list that are allowed to make this connection. You can do this with `xhost`
    by typing:


    ```

    # xhost local:<user>

    ```


    ...as root. Give the system a reboot and it should now be working fine.


