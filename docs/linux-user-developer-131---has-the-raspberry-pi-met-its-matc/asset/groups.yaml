    我的父母终于决定加入这个世纪，不再依赖我或图书馆的电脑来获取信息，而是购买一台像样的电脑。作为家里的技术支持，我告诉他们，我会为他们设置一套新系统，用于收发电子邮件等。因为他们几乎没有使用过电脑，我想为他们设置一个
    Linux Mint 系统。然而，我唯一的问题是想办法找到备用硬件来启动它。不过我发现我有一台闲置的 Mac Mini，所以我想在上面安装 Linux。但据我记忆，这并不像插入启动盘并安装那么简单。


    我不太在意丢失 OS X，反而更希望我的父母使用 Mint。我该如何在那里安装它？


    **Jeff Vincent**


    虽然 Mint 及其 Ubuntu 基础系统有在支持 UEFI 的安全启动系统上安装的工具，但它需要使用传统模式才能正常工作。但在 Mac 上我们没有这种奢侈，所以你需要多做一点。主要问题是
    Mac 使用不同的分区表，这与 Mint 不兼容，所以如果你不在意丢失 OS X，最简单的做法是将其转换为对 Linux 更友好的格式。


    确保备份你想要保留的任何文件，因为此方法会格式化硬盘。将 Mint 的启动 CD 或 DVD 刻录出来并放入光驱。重启 Mac 并按住 Option 键以调出启动选择屏幕，当然选择
    CD。通过选择 **试用 Linux Mint (Try Linux Mint)** 进入实时环境。


