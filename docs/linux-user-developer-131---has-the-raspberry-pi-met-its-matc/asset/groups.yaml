    ```bash

    $ mencoder abc.mkv -oac pcm -ovc xvid -xvidencopts bitrate=888 -sub ITC0101.srt
    -subfont-text-scale 3 -o zzzz.avi

    ```


    它在我的电脑上运行良好，但在我的 DVD 播放器上（据我所知，它通常对这些编解码器没有问题），却根本无法运行。我在命令中遗漏了什么吗，或者我应该用另一种方式来做这件事？


    **Tim Duley**


