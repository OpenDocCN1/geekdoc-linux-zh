    \n## 英特尔在小池塘中的大鱼\n\n我们访谈了 Scott Garman，探讨英特尔首次进军由 Linux 驱动的开源硬件开发系统领域\n\n**Scott\
    \ Garman，英特尔任命其为进入开源硬件开发领域的“推广人”，有着嵌入式开发的历史记录。** 他在纪念 MinnowBoard 单板计算机发布的访谈中告诉我们要：“我不是硬核内核黑客，”\
    \ “而是一个喜欢从大局出发的通才”。\n\n作为 Yocto 项目的软件工程师，这是一个旨在使嵌入式平台 Linux 发行版开发尽可能简单的协作努力，在英特尔开源技术中心工作下，Garman\
    \ 已经为社区做出了许多贡献。他负责 Yocto 相关的培训材料，包括该项目最受欢迎的屏幕录制介绍之一，并且现在正在领导引入首个以 Yocto 为核心设计的开源硬件平台的工作：英特尔\
    \ MinnowBoard。\n\nMinnowBoard，在第 12 页有评测，对 Raspberry Pi 和 BeagleBoard 等设备负有清晰的感激之债。它围绕英特尔的“Queens\
    \ Bay”平台设计，核心是一个低功耗 32 位 Atom 处理器，该板被设计为一个开发平台，旨在将 x86 指令集架构的灵活性和熟悉感带入嵌入式系统——并且以低成本实现这一点。\n\
    \n最令人惊讶的是，该设备是开源硬件：所有规格、原理图、板布局固件包都可以在宽松的许可协议下下载和重新使用——这是英特尔硬件产品的一大创举。显然，这是与常态的背离，而\
    \ Garman 对此 understandable 感到自豪。\n\n### MinnowBoard 是如何诞生的\n\n## 访谈\n\n![](img/dd9251551a61a36067892b1cc68615b0_6_0.png)\n\
    \nMinnowBoard 本身紧凑而强大，并拥有令人印象深刻的 I/O 能力\n\n### 开源硬件运动\n\n- 开源硬件——开源的一个分支，其中原理图、组件列表，甚至用于制造印刷电路板的单个\
    \ Gerber 文件都在宽松的许可协议下发布——正变得越来越受欢迎。尽管 Raspberry Pi 是最受欢迎的低成本嵌入式开发平台之一，它是专有的，但它的许多竞争对手更加开放：除了\
    \ MinnowBoard，还有 Gizmo、BeagleBoard 及其较小的衍生版本 BeagleBone、OpenOLinuXino 系列，以及基于微控制器的\
    \ Arduino 系列，都是开源硬件。\n\n开源硬件可以促进采用它的项目在功能和技术方面的快速进步，但就像开源软件一样，也存在风险：Arduino 的开放性导致它成为周围被复制最多的项目之一，远东地区的工厂成批生产不合法的克隆产品，并以直接违反其否则极其宽松的许可协议的方式滥用该项目的商标。\n\
    \n### MinnowBoard 是如何诞生的？\n\n“我可以说认真开发是在 2012 年底开始的。MinnowBoard 是一个不寻常的项目，因为英特尔和\
    \ CircuitCo（BeagleBoard 和 BeagleBone 开发平台背后的公司）以协作的方式开展。英特尔 Yocto 项目团队提供输入，帮助设计\
    \ MinnowBoard 在性能、开放性、灵活性和标准方面的需求。CircuitCo 随后使用了一个英特尔参考设计——Queens Bay 平台——并根据需要进行了调整。他们还制造和销售\
    \ MinnowBoard，所以这主要是他们的产品，而不是英特尔的。结果是一个双赢的局面，我们的团队获得了一个出色的开发平台以及更多，而 CircuitCo\
    \ 拥有一个具有吸引力的产品平台来销售。”\n\n“我们很高兴与 CircuitCo 合作这个项目，因为他们非常理解开源硬件/开源社区模式，但在推出这块第一块板的过程中，我们双方都有很多事情要从彼此那里学习。这被证明是一次很棒的协作，我们对结果非常满意。”\n\
    \n“从某种意义上说，参与此工作的英特尔团队非常小。与此同时，我不想低估许多人所做的贡献，他们帮助使这一切成为现实，即使他们没有全天候全职参与该项目。”\n\
    \n### 是什么导致了选择 MinnowBoard 使用带有“Tunnel Creek”Atom 处理器的 Queens Bay 平台？\n\n“两个主要问题促使我们为\
    \ MinnowBoard 使用 Tunnel Creek CPU。第一，我们在寻找平台的 longevity。采用开源硬件模式意味着这将是一块对嵌入式产品公司具有吸引力的板，用于使用和适应商业产品。根据经验告诉你，没有什么比开发一个成功的嵌入式产品后，却发现你的组件即将进入生命周期结束更令人沮丧的了。\n\
    \n![](img/dd9251551a61a36067892b1cc68615b0_6_1.png)\n\n> “据我所知，MinnowBoard 是第一个以\
    \ Yocto 项目为核心设计的硬件平台”\n\n![](img/dd9251551a61a36067892b1cc68615b0_6_2.png)\n\n\
    除了右侧的电源和重置按钮，MinnowBoard 还拥有四个可编程按钮\n\nMinnowBoard 放置在四个支脚上，以帮助其 1GHz 英特尔 Atom\
    \ 处理器的被动冷却\n\n## 独家\n\n英特尔在小池塘中的大鱼\n\n![](img/dd9251551a61a36067892b1cc68615b0_7_0.png)\n\
    \n比 Pi 更大更昂贵，但 MinnowBoard 提供完整的 x86 兼容性\n\nQueens Bay 是一个用于 IVI（车载信息娱乐系统）设备的平台，设计寿命较长——因为人们通常长期使用汽车。它在其产品生命周期中仍有四到五年。\n\
    \n“第二，执行的时间就是现在，所以我们不会等待即将推出的英特尔平台推出。Tunnel Creek 满足我们的主要需求并且立即可用，所以我们就这样做了。”\n\
    \n> **与 ARM 或其他 RISC 平台相比，Atom 处理器中使用的 x86 架构在嵌入式领域有哪些优势？**\n> \n> “兼容性可能是最大的优势。Linux\
    \ 起源于 Intel 386，无论你是在嵌入式还是桌面应用程序上工作，工具链、库等都是在 x86 上设计的，并且几乎可以保证在 x86 上正常工作。\n\
    > \n> “性能是另一个重要的优势。无数的人年投入到了优化像 GCC 这样的编译器中，以充分利用 x86 平台，因此你可以最大程度地利用它的好处。”\n\n\
    MinnowBoard 包括八个 GPIO 引脚和一个专用于“Lures”的扩展端口\n\n> **你同意基于 ARM 的 Raspberry Pi 的成功表明爱好者对低成本开发板有着明确的需求吗？**\n\
    > \n> “是的，绝对如此。我欣赏和尊重 Raspberry Pi 项目的一点是，它正在将许多人引入嵌入式 Linux 开发。过去，嵌入式是一个利基领域，由专门的软件工程师处理，现在嵌入式\
    \ Linux 社区变得多样化得多，特别是年轻人。我热爱这一点。\n> \n> **MinnowBoard 提供了哪些其他更成熟的开发板所缺乏的东西？**\n\
    > \n> “MinnowBoard 在其性能、灵活性、开放性和标准的结合中脱颖而出。\n\n英特尔 Atom CPU 为高计算负载提供了充足的性能。由于其\
    \ PCI Express 支持千兆以太网和 SATA 磁盘功能，它还具有很强的 I/O 性能。我们还通过 MinnowBoard 的扩展连接器提供 PCI\
    \ 访问，以启用高速 I/O 到自定义硬件项目，例如与 FPGA 或其他硬件接口。\n\n“MinnowBoard 可以用于有趣的业余爱好项目，但可以扩展到更高的负载。它可以通过几个\
    \ PC 和嵌入式总线标准进行扩展，并提供自定义固件开发的环境。\n\n凭借千兆以太网和实时时钟，它领先于 Raspberry Pi\n\n![](img/dd9251551a61a36067892b1cc68615b0_7_1.png)\n\
    \n"
