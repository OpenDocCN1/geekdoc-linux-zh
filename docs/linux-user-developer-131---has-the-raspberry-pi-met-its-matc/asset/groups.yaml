    # ## Browse privately with Onion Pi


    ### Turn your Raspberry Pi into a Tor-enabled wireless router


    **TUTORIAL**


    ![](img/dd9251551a61a36067892b1cc68615b0_46_0.png)


    # **01 Install Raspbian**


    Raspbian is the Raspberry Pi distribution to use for the Onion Pi. Download the
    zip file, extract the image and then apply it to an SD card using:


    ```

    ```

    $ dd bs=4M if=[version_number]-

    wheezy-raspbian.img of=/dev/[SD card

    location]

    ```

    ```


    You can also use NOOBS to install Raspbian if you wish.


    # **02 Set up Raspbian**


    Go through the initial Raspbian setup and make sure to turn on the SSH server,
    and to disable auto boot to desktop - this is unnecessary and will only use extra
    power. You can also tell it to fill up the rest of the card if there''s room for
    it.


    # **03 PiIP**


    We''ll be accessing your Raspberry Pi via SSH to set it up. To do this we need
    to know its IP address - you can find it by typing ifconfig into the command line.
    Make a note of it and turn off your Pi.


    ![](img/dd9251551a61a36067892b1cc68615b0_46_1.png)


    # **04 SSH connection**


    Plug your USB wireless adapter into the Pi and turn it back on. On another computer
    connected to the same network, open a terminal or type into the command line:


    ```

    ```

    $ ssh [user]@[IP address]

    ```

    ```


    Then enter the password for your Raspbian if it asks for it.


    ![](img/dd9251551a61a36067892b1cc68615b0_46_2.png)


    # **05 Install DHCP**


    To make life easier for any system connecting to the Pi access point, we need
    to install a DHCP server to it. We do this with:


    ```

    ```

    $ sudo apt-get install hostapd isc-

    dhcp-server

    ```

    ```


    DHCP will automatically assign IP addresses to network-attached devices, meaning
    you won''t need static IPs.


    ![](img/dd9251551a61a36067892b1cc68615b0_46_3.png)


    # **06 Set up DHCP**


    Now we need to configure the DHCP server. Edit the configuration file with:


    ```

    ```

    $ sudo nano /etc/dhcpd.conf

    ```

    ```


    And start by putting a # in front of the two option domain-name entries, then
    remove the # in front of authoritative, seven lines down.


    # **07 Server address**


    At the end of the configuration file, add the following:


    ```

    ```

    subnet 192. 168. 42. 0 netmask

    255. 255. 255. 0 {

    range 192. 168. 42. 10 192. 168. 42. 50;

    option

    192. 168. 42. 255;

    option routers 192. 168. 42. 1;

    default-lease-time 600;

    max-lease-time 7200;

    option domain-name "local";

    option domain-name-servers 8.8.8.8,

    8.8.4.4;

    }

    ```

    ```


    Save and exit.


    ![](img/dd9251551a61a36067892b1cc68615b0_46_4.png)


    # **08 DHCP server**


    Edit the server configuration files so that it''s set to work in conjunction with
    the wireless adapter:


    ```

    ```

    $ sudo nano /etc/default/isc-dhcp-

    server

    ```

    ```


    Scroll to INTERFACES and change it to:


    ```

    ```

    INTERFACES="wlan0"

    ```

    ```


