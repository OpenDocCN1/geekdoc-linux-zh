    the majority of modern desktop distributions shut off behind a password. By being
    careful about what is installed and not providing a password to an unexpected
    pop-up dialog, Linux users should largely be protected from its ravages.


    Those who frequently install software from outside their distribution’s official
    repositories, however, should take heed: as the popularity of Linux grows, sadly
    so too does its attractiveness to criminals.


