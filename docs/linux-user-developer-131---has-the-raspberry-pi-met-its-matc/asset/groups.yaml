    # Make a small business database with LibreOffice


    Use LibreOffice and MySQL to create a customer database


    **TUTORIAL**


    ![](img/dd9251551a61a36067892b1cc68615b0_34_0.png)


    # **01** Install LibreOffice


    At time of writing, the major Linux distributions haven''t moved over to LibreOffice
    4 and are still offering 3.x. This means that you may have to install LibreOffice
    4 manually. Visit the LibreOffice website (www.libreoffice.org) and follow the
    instructions. On Ubuntu, this consists of unpacking the archive and running `sudo
    dpkg -i *.deb` on the contents.


    ![](img/dd9251551a61a36067892b1cc68615b0_34_1.png)


    # **02** Install the Apache web server


    We''ll install Apache early on and with its own command because some of the other
    packages need to be able to configure a working Apache installation. Carry out
    the installation with `sudo apt-get install apache2`. Test it by navigating a
    web browser to http://localhost.


    ![](img/dd9251551a61a36067892b1cc68615b0_34_2.png)


    # **03** Install Java and additional classes


    Connectivity between Base and MySQL makes use of a Java class. Type `sudo apt-get
    install default-jdk` to install the Java runtime. Type `sudo apt-get install libmysql-java`
    to install the needed additional Java classes.


    ![](img/dd9251551a61a36067892b1cc68615b0_34_3.png)


    # **04** Install the MySQL Server


    Type `sudo apt-get install mysql-server` to begin installation. Before long, you
    should be prompted to set a root MySQL password. Note that this isn''t the same
    as the administrator account of your system, which is also called ''root''. Choose
    a password and make a note of it.


    # **05** Install and test phpMyAdmin


    Type `sudo apt-get install phpmyadmin` to begin installation. When prompted to
    choose a web server, choose Apache2, select it with the space bar and press Return.
    When requested, give it the MySQL root password and then choose a password for
    phpMyAdmin and make a note of it. Navigating to http://localhost/phpmyadmin/ should
    take you to a functioning login page. Log in using the MySQL root username and
    password. We''ll use MySQL to set up and maintain the actual database, although
    we''ll create the fields from within LibreOffice later on.


    ![](img/dd9251551a61a36067892b1cc68615b0_34_4.png)


    # **06** Create database


    Within the phpMyAdmin web interface, select the Databases tab. Now create a new
    database by entering the name ''customer'' into the text box and clicking on Create.
    This database will contain our customer data.


    ![](img/dd9251551a61a36067892b1cc68615b0_34_5.png)


    # **07** Add JDBC in LibreOffice


    We now need to tell LibreOffice where to find the JDBC class file. Start LibreOffice
    and go to LibreOfficeOptionsAdvanced, in the Java Options section, select Class
    Path and then Add Archive. The file you need is located at: /usr/share/java/mysql-connector-java.jar.
    Select it and restart LibreOffice.


