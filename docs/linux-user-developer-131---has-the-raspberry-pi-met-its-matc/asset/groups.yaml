    # GOVERNMENT


    # Valencia completes LibreOffice switch


    *Local government coffers already €1.3 million richer*


    The Valencian regional government in Spain has completed its planned switch from
    proprietary software to LibreOffice.


    The project to migrate to an open source alternative began in 2012, and has already
    been credited with saving the government €1.3 million in software licensing fees.


    “Apart from economic benefits, the commitment to free and open source software
