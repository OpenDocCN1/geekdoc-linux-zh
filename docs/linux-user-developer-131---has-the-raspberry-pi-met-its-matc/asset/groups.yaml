    # # Tutorial

    ## Make a small business database with LibreOffice


    phpMyAdmin offers a

    web-based front-end for the

    creation and maintenance of

    MySQL databases


    Data entry is

    carried out via an

    easy-to-use form in

    Base, the front end

    to our database


    All of the actual

    database design

    (fields, form layout

    etc) is carried out

    from within Base


    You import and export data

    to and from LibreOffice

    Base by using Calc, the

    spreadsheet module. This

    enables access to most

    common data formats


    ![](img/dd9251551a61a36067892b1cc68615b0_33_0.png)


    # # Make a small business

    database with LibreOffice


    # Create a database that combines an easy-to-use,

    form-based front-end using LibreOffice with a portable,

    networked MySQL back-end


    ### Advisor

    Michael Reed is a technology

    writer, and he''s been

    hacking away at Linux

    for over 15 years. He

    specialises in desktop

    Linux solutions


    ### Resources

    LibreOffice: [www.libreoffice.org](http://www.libreoffice.org)

    At least one Ubuntu Linux PC


    We''re going to show you how to put together

    a typical database for small business use: a

    database of customer details. It will be possible

    to both export and import contact data from

    in standard formats by making use of Calc,

    LibreOffice''s spreadsheet module. We''ll use

    Grain contracts as our source, but you can use

    any software that can export CSV files -- and

    pretty much everything can.

    We''ve added a few twists to keep things

    interesting. This project uses the Base module

    of LibreOffice as the front-end, and this provides

    a GUI for setting up the database, creating the


    forms for data entry and the actual business

    of entering data. For the back-end, we''ll be

    using the industry-standard MySQL. This allows

    us to locate the back-end on a central server.

    This, in turn, allows multiple users to access

    the database.

    For initial creation of the MySQL database,

    we''ll use phpMyAdmin. Thanks to its friendly

    web interface, although the actual database

    design will be carried out from within Base. By

    the end of the project, you''ll have a GUI system

    for browsing and editing the database with a

    portable, networked back-end.'
