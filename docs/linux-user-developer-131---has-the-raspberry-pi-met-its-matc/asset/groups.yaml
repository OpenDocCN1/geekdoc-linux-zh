    ```


    # 17 Follow


    To follow someone on Twitter, we use the **create_friendship** function. We need
    either the screen name or numerical ID of the Twitter user you want to follow
    – you’ll most likely be using the screen name, so we’ll write it like so:


    ```

    twitter.create_friendship(screen_name = "LinuxUserMag")

    ```


    # 18 Retweeting


    As retweets are an integral part of Twitter, the function for this is simply **retweet**.
    We require the tweet ID for this, the numerical string used for each tweet and
    displayed in the URL for a tweet. We use it with:


    ```

    twitter.retweet(id = ‘12345’)

    ```


    # 19 Favouriting


    This works very similar to retweets, using the unique ID for the tweet used in
    the URL to determine which tweet to favourite. The function for this is **create_favorite**,
    and is written as:


    ```

    twitter.create_favorite(id = ‘12345’)

    ```


    Make sure to use the American spelling (favourite) when doing this.


    ```

    import tweepy

    ...

    API_HEADER = “twitter/...”

    API_FOOTER = “...”

    SIGNED_FOOTER = “...”

    ...

    ```


    # 20 Retrieve favourites


    All of a user’s favourites are stored by Twitter so that you can recover them
    at any time. You can either get your own, or specify a user to get the favourites
    from. The basic code is:


    ```

    twitter.get_favorites()

    ```


    …which will get you your own favourites. As before, you can specify the user ID
    number or screen name with **user_id** and **screen_name** respectively to get
    a specific list.


    ```

    twitter = PyTweeter(user=...)...

    ...

    ```


    # 21 Mentions


    You can also access the list of mentions for your authenticated account. To do
    this, use the **get_mentions_timeline** function. This works like the other timelines,
    allowing you limit the amount of posts you get from the selection. Limit it to
    five like before with:


    ```

    twitter.get_mentions_timeline(count=‘5’)

    ```


    # 22 Trending topics


    Everyone knows what everyone else is talking about thanks to Twitter’s trending
    topics, whether it’s a young Canadian musician or important world events. You
    access the trends with:


    ```

    twitter.get_place_trends(id = ‘1’)

    ```


