    If you prefer to use Twitter by curating lists of people, you can get the contents
    of any list using the **get_list_statuses** function:


    ```

    twitter.get_list_statuses(id = ‘12345’)

    ```


    Each list has a unique ID, or a slug, that you can use. You can also call members
    of any list, or anyone that subscribes to it.


