    ## SourceForge DevShare branded ''malware''


    “They not only crossed the line, they threw up on it”


    Open source hosting outfit SourceForge has been criticised for bundling selected
    binary releases in advertising-laden packages.


    ![](img/dd9251551a61a36067892b1cc68615b0_14_0.png)


    Launched in July this year, DevShare bundles software with add-ons such as AnchoxFree''s
    HotSpotShield. SourceForge claims it provides an easy way for developers to monetise
    their efforts; its critics claim it''s nothing more than malware.


    “SourceForge, once a mighty force for the good of open source, has fallen far
    from its previous lofty heights,” opined Red Hat developer Justin Cliff in a post
    to the Guster Project blog. “I''m not against monetisation at all, we all have
    lives and need to pay our bills. But not through abusing user trust. Not through
    preying on the unskilled or unwary. To misquote Marge Simpson: ‘They not only
    crossed the line, they threw up on it.''”


    SourceForge, now owned by Dice Holdings, has defended the initiative. “SourceForge
    will always respect the rights of our users and we will never infringe on them.
    DevShare offers a transparent installation flow that gives users all the necessary
    information to make educated choices about what software to install.”


    The decision to launch the programme, currently in beta, has led to calls for
    high-profile projects to move to alternative hosts; others – including FTP client
    FileZilla – have, however, already signed up to DevShare.


    ## X.Org loses non-profit status


    The Foundation behind X.Org has lost its status as a 501c(3) non-profit group
    in the US, following a failure to file taxes with the US Internal Revenue Service
    for three consecutive years.


    “I was taken by surprise that the IRS hit us so rudely,” Foundation accountant
    Stuart Kreitman said at the company''s most recent board of directors'' meeting.
    “I''ve had little issues with my own returns and have always found them to be
    reasonable and friendly.”


    Kreitman has, however, admitted that the tax returns have not been filed, but
    argued that the organisation has “never filed returns.”


    ![](img/dd9251551a61a36067892b1cc68615b0_14_1.png)


    The X.Org Foundation is considering letting others take care of its paperwork
    in future


    The Foundation is now considering joining an umbrella organisation in order to
    reduce the paperwork required of its members and prevent this sort of embarrassing
    situation from recurring.


