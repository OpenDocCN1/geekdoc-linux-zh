    \n£179\n\n这款低成本的高清 Kindle Fire 替代机型，是否是安卓破解者的梦想设备？\n\n鉴于 Nook 品牌的未来看起来颇为不明朗，此时投资其中一款平板电脑似乎并非最佳时机。或者也许正是最佳时机。随着大幅降价，Barnes\
