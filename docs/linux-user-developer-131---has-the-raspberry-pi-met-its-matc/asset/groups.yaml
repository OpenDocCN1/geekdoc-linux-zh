  - '[PAGE 5]


    ![](img/dd9251551a61a36067892b1cc68615b0_5_0.png)


    Scott Garman is a Yocto Project engineer at Intel, and the company''s evangelist
    for the MinnowBoard


    ![](img/dd9251551a61a36067892b1cc68615b0_5_1.png)


    # # Intel’s big fish in a little pond


    We chat to Scott Garman about Intel’s first foray into the world of Linux-powered
    open hardware development systems


    **Scott Garman, the man Intel has appointed as the ‘evangelist’ for its first
    steps into open hardware development, has a history of embedded development.**
    “I''m not a hardcore kernel hacker,” he tells us during an interview to commemorate
    the launch of the MinnowBoard single-board computer, “but a generalist who enjoys
    working with the big picture in mind”.


    A software engineer for the Yocto Project, a collaborative effort to make the
    development of Linux distributions for embedded platforms as simple as possible,
    working under Intel''s Open Source Technology Center, Garman has already given
    plenty back to the community. He''s responsible for Yocto-related training materials,
    including one of the most popular screencast introductions to the project, and
    is now leading the effort to introduce the first open hardware platform designed
    with Yocto firmly in mind: the Intel MinnowBoard.


    The MinnowBoard, reviewed on page 12, owes a clear debt of gratitude to devices
    like the Raspberry Pi and the BeagleBoard. Designed around Intel''s ''Queens Bay''
    platform, which has at its heart a low-power 32-bit Atom processor, the board
    is designed as a development platform to bring the flexibility and familiarity
    of the x86 instruction set architecture to embedded systems – and to do so at
    a low cost.


    Most surprisingly of all, the device is open hardware: all specifications, schematics,
    board layouts and firmware packages are available for download and reuse under
    a permissive licence – a first for an Intel hardware product. Clearly, this is
    a departure from the norm, and one of which Garman is understandably proud.'
  - '[PAGE 6]


    # Intel''s big fish in a little pond


    How the MinnowBoard came about


    # INTERVIEW


    ![](img/dd9251551a61a36067892b1cc68615b0_6_0.png)


    The MinnowBoard itself is compact yet powerful, and boasts impressive I/O capabilities


    # The open hardware movement


    +   - Open hardware – an offshoot of open source, where the schematics, component
    lists, and even the individual Gerber files for having printed circuit boards
    made are released under a permissive licence – is growing increasingly popular.
    Although the Raspberry Pi, one of the most popular low-cost embedded development
    platforms, is proprietary, many of its competitors are more open: as well as the
    MinnowBoard, the Gizmo, the BeagleBoard and its smaller BeagleBone offshoot, and
    the OpenOLinuXino family, and the microcontroller-based Arduino range are all
    open hardware.


    Open hardware can lead to rapid advances in features and technologies for the
    projects that adopt it, but as with open source software there are risks: the
    Arduino’s open nature has led to it being one of the most copied projects around,
    with Far Eastern factories churning out illegitimate clones by the dozen and misappropriating
    the project’s trademark in direct contravention of its otherwise extremely permissive
    licence.


    # How did the MinnowBoard come about?


    “I’d say development in earnest started happening at the end of 2012. MinnowBoard
    was an unusual project because of the way Intel and CircuitCo [the company behind
    the BeagleBoard and BeagleBone development platforms] collaborated on it. The
    Intel Yocto Project team provided input to help design the requirements for MinnowBoard
    around performance, openness, flexibility and standards. CircuitCo then used an
    Intel reference design – the Queens Bay platform – and adapted it as needed. They
    also manufacture and sell the MinnowBoard, so it’s primarily their product, not
    Intel’s. The result is a win-win situation where our team got a great development
    platform and more, and CircuitCo has a compelling product platform to sell.”


    “We’ve been really happy to work with CircuitCo on this, because they understand
    the open hardware/open community model so well, but we both had plenty of things
    to learn from each other during the process of bringing up this first board. It’s
    turned out to be a great collaboration and we’re really pleased with the results.”


    “In one sense, the Intel team working on this is extremely small. At the same
    time, I wouldn’t want to discount the contributions that many people have done
    to help make this happen, even if they weren’t involved with the project full-time
    on a daily basis.”


    # What led to the decision to choose the Queens Bay platform, with its ‘Tunnel
    Creek’ Atom processor, in the MinnowBoard?


    “Two main issues led us to use Tunnel Creek CPU for MinnowBoard. One, we were
    looking for longevity of the platform. Going with an open hardware model means
    that this is going to be an attractive board for embedded product companies to
    use and adapt for commercial products. I can tell you from experience, there is
    nothing more frustrating


    ![](img/dd9251551a61a36067892b1cc68615b0_6_1.png)


    > “To my knowledge, MinnowBoard is the first hardware platform designed with the
    Yocto Project in mind”


    ![](img/dd9251551a61a36067892b1cc68615b0_6_2.png)


    Along with the power and reset buttons on the right, the MinnowBoard boasts four
    programmable buttons


    The MinnowBoard sits on four stilts to help aid the passive cooling of its 1GHz
    Intel Atom processor'
  - "[PAGE 7]\n\n# Exclusive\n\nIntel’s big fish in a little pond\n\n![](img/dd9251551a61a36067892b1cc68615b0_7_0.png)\n\
    \nlarger and pricier than the Pi, the MinnowBoard offers full x86 compatibility\n\
    \nthan developing a successful embedded product and then finding out that your\
    \ components are about to enter end-of-life. Queens Bay is a platform used in\
    \ IVI (In-Vehicle-Infotainment) devices, and was designed with a long lifespan\
    \ - since people tend to own cars for a long time. It still has four to five years\
    \ left in the product’s life cycle.\n\n“Two, the time to execute was now, so we\
    \ weren’t about to wait for upcoming Intel platforms to roll out. Tunnel Creek\
    \ met our main requirements and was available immediately, so we ran with it.”\n\
    \n> **What advantages does the x86 architecture used in the Atom processor offer\
    \ in the embedded space, compared to ARM or other RISC platforms?**\n> \n> \"\
    Compatibility is likely the biggest advantage. Linux originated on the Intel 386,\
    \ and whether you're working on embedded or desktop applications, the toolchain,\
    \ libraries etc were designed on and are pretty much guaranteed to work on x86.\n\
    > \n> \"Performance is another significant one. Countless person-years have been\
    \ put into optimizing compilers such as GCC to take full advantage of x86 platforms,\
    \ so you can leverage that to its greatest benefit.\"\n\nThe MinnowBoard includes\
    \ eight GPIO pins and a dedicated expansion port for ‘Lures’\n\n> **Do you agree\
    \ that the success of the ARM-based Raspberry Pi has demonstrated a clear demand\
    \ for low-cost development boards from hobbyists?**\n> \n> \"Yes, absolutely.\
    \ One of the things I appreciate and respect about the Raspberry Pi project is\
    \ that it's introducing so many new people to embedded Linux development. It used\
    \ to be that embedded was a niche thing that software engineers specialised in,\
    \ and now the embedded Linux community is becoming much more diverse, especially\
    \ with younger people. I love that.\n> \n> **What does the MinnowBoard offer that\
    \ other, more established development boards lack?**\n> \n> \"MinnowBoard stands\
    \ out in its combination of performance, flexibility, openness and standards.\n\
    \nThe Intel Atom CPU provides plenty of performance for high computational workloads.\
    \ It also has strong I/O performance due to PCI Express powering its Gigabit Ethernet\
    \ and SATA disk features. We also make PCI available through MinnowBoard's expansion\
    \ connector to enable high-speed I/O to custom hardware projects, for example\
    \ interfacing with FPGAs or other hardware.\n\n\"The MinnowBoard can be used for\
    \ fun hobby projects, yet scales up to higher workloads. It's expandable via several\
    \ PC and embedded bus standards, and offers an environment for custom firmware\
    \ development.\n\nWith Gigabit Ethernet and a real-time clock, it pulls ahead\
    \ of the Raspberry Pi\n\n![](img/dd9251551a61a36067892b1cc68615b0_7_1.png)"
