    files I need to download residing within it. I used to use a Firefox add-on to
    select and download them all in one. However, I’m wanting to know if there’s a
    more universal way of me doing this without having to get extra add-ons for my
    browser?


    **Colin Stilt**


    ![](img/dd9251551a61a36067892b1cc68615b0_88_2.png)


    > It’s most likely an issue with MEncoder and the limited codecs on the DVD player


    # ## Minty Apple


    My parents have finally decided to join this century and get a proper computer
    rather than relying on me or library computers to get their information. As family
    tech support, I’ve told them I’ll get them set up with a new system they can use
    for emails and such. Because they’ve never really used computers much at all,
    I wanted to set up a Linux Mint system for them. However, the only issue I have
    is finding spare hardware to get that going. I did find that I have a Mac Mini
    lying around, though, so I thought about putting Linux on that. However I seem
    to recall it’s not as easy as just putting the live disc in and installing as
    I found out.


    I’m not too bothered about losing OS X, and would much prefer my parents use Mint
    anyway. How do I get it installed on there?


    **Jeff Vincent**


    While Mint and its Ubuntu base have tools to install on Secure Boot systems that
    use UEFI, it requires the use of legacy modes to get it work normally. But we
    don’t have that luxury with a Mac, so you need to do a little more. The main issue
    is that it uses a different partition table that won’t work with Mint, so the
    easiest thing to do if you’d mind losing OS X is convert it to something more
    Linux friendly.


    Make sure any files you want to keep are backed up, as this method will format
