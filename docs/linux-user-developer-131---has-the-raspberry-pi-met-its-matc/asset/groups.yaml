    ## 你的观点


    Pisi Linux、Wayland 与 Mir 之争、专业发行版、树莓派项目


    ### 来信


    ![](img/dd9251551a61a36067892b1cc68615b0_94_0.png)


    一些专业发行版不仅仅是一组应用程序的集合


    ![](img/dd9251551a61a36067892b1cc68615b0_94_1.png)


    ### 《安卓杂志》


    随着越来越多的 Android 特性被合并回 Linux 内核，为当下最流行的移动操作系统之一进行开发变得越来越容易。拥有超过 250 亿次应用下载量、超过
    10 亿次应用下载（原文如此，可能是指累计），以及全球超过 5 亿台 Android 设备，有着庞大的受众群体准备消费这些应用。如需更多以 Android
    为导向的编辑内容，请关注我们的姊妹刊物《安卓杂志》。这是我们专门致力于该平台的产品。除了包含让你紧跟 Android 一切动态的新闻和评测外，还有关于开发及破解你硬件的教程和建议。请访问
    www.littlegreendrobot.com 了解更多。


    ### 专业发行版


    好吧，我对整个“为特定任务设计发行版”的趋势有点困惑。如果我想在 Windows、Mac 或其他操作系统上运行音频应用程序，我会安装我想要的程序。为什么在
    Linux 上我们要看到“为了获得最佳音频环境，只需安装音频发行版”这种方法？真是浪费！相比于定制现有的发行版并拥有一个漂亮的“aptitude/yum install
    audio-env”，我们却要为仅针对应用程序维护一个发行版而承担所有的额外开销？


    难道不是时候将应用程序与操作系统分离，并忽略人们试图将两者整合的尝试了吗？


    Colin McDermott


    其实并没有具体原因阻止你这样做——很多人可能仅使用标准的 Fedora 或 Ubuntu 安装就能满足他们的专业化需求。然而，一些发行版所做的不仅仅是提供一组主题默认包——像
    AV Linux 这样的发行版会多走一步，专门针对音视频软件定制内核。并非每个人都有能力在 Linux 中做到这一点，所以这类发行版确实有其用途。一些轻量级发行版也是如此。这是关于选择，而这为人们提供了更多的选择。


    ### 树莓派项目


    ![](img/dd9251551a61a36067892b1cc68615b0_94_2.png)


    树莓派项目展现了 Linux 的实用性


    ### 更多树莓派


    我刚刚读完了贵刊第 129 期，你们介绍的十个树莓派项目让我深受启发。我尝试了其中几个，结果让我很满意；用树莓派真的可以做很多事！我现在用我的树莓派来满足我所有的媒体中心需求，并且再也没换回去——我甚至有一张备用
    SD 卡，用于旅行时将其作为便携式接入点使用。未来你们还会做类似的特写吗？如果是的话，我能提交一些项目建议吗？我有几个想法，觉得能真正充分利用树莓派。


    再次感谢，


    Phillip Cordan


    很高兴你喜欢这些项目，Phillip。我们始终乐于从所有读者那里听到关于树莓派项目的创意，即使只是为了在杂志中单独展示。我们通常每月都会尝试在杂志中放入至少一个与树莓派相关的教程或专题——例如，在本期中，你可以在第
    46 页找到我们的 Onion Pi 教程，学习如何将那个便携式接入点变成安全路由器。你可以将任何想法发送到本页顶部的电子邮箱地址。


    ![](img/dd9251551a61a36067892b1cc68615b0_94_3.png)


    ![](img/dd9251551a61a36067892b1cc68615b0_94_4.png)


    ## 光碟内容


    你的光碟


    来看看《Linux 用户》第 131 期的超值光碟中有哪些开源惊喜……


    ### 发行版


    本月，我们提供了出色的 Elementary OS 稳定版等


    ![](img/dd9251551a61a36067892b1cc68615b0_95_0.png)


    ### 软件


    20 款最佳开源软件包，包括 Android Studio，以便你跟随我们的专题


    ### 教程文件


    如果你想跟上本月或之前的指南，这里就能找到它们


    ### 发行版目录


    想知道主要发行版的最新动态吗？查看我们的目录...


    如果你在寻找所有最新的开源发行版、应用程序、工具和教程文件，你来的地方没错……


    本月光碟中，我们有另外四个尖端的发行版，其中最好的可以直接从光碟启动——只需将 DVD 放入光驱并重启机器即可。


    领头者是 Elementary OS，这是我本月光碟编辑精选之一，也可能是自 2006 年 Linux Mint 首次亮相以来最令人兴奋的新发行版。此外，我们还有
    OpenELEC 测试版（基于 XBMC 的出色 HTPC 发行版）、Puppy 5.6；以及我们在本期评测过的 Sparky Linux 3.0。


    试用 Elementary OS 和 Puppy Linux 5.6 非常轻松。只需将 DVD 放入光驱，重启电脑，然后从启动菜单中选择其中一个。如果菜单未出现，请进入
    BIOS 并确保 DVD 光驱被设置为先于硬盘加载。祝你使用愉快！


    Russell Barnes，编辑


    ### 如何烧录 ISO


    想试用新的发行版 ISO？这里是入门指南……


    ![](img/dd9251551a61a36067892b1cc68615b0_95_1.png)


    **步骤 1：** 获取一个新的 ISO

    将发行版的 ISO 从我们的封面光碟复制到你的硬盘：转到“发行版”选项卡，点击“ISO”并选择保存。或者，在网上找到一个 ISO 进行下载。如果你不确定是否需要
    32 位还是 64 位版本，为了安全起见，请选择前者。


    ![](img/dd9251551a61a36067892b1cc68615b0_95_2.png)


    **步骤 2：** 打开或安装 Brasero

    Brasero 是最受欢迎的开源光盘烧录工具。它并没有预装在你的发行版中。在你的发行版仓库中找到并安装它。然后打开程序，并在左侧的“项目”选项卡中选择“烧录镜像”。


    ![](img/dd9251551a61a36067892b1cc68615b0_95_3.png)


    **步骤 3：** 烧录你的光盘镜像

    在“镜像烧录设置”窗口中，点击第一个框——标记为“点击此处选择光盘镜像”——并导航到你刚刚放在硬盘上的 ISO。选择后，确保你已插入可写的 CD 或 DVD，然后点击“创建镜像”。


