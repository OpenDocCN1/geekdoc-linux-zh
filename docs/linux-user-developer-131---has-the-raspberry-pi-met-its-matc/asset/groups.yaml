    # # Opinion

    The kernel column – Jon Masters

    OPEN SOURCE


    # ## “This month’s theme would seem to actually be that of NUMA”


    Johannes Weiner have posted patches that aim to better handle NUMA hinting and
    automatic reconciliation of memory closer to where it is used.


    Beyond NUMA, other memory-scalability-related topics were discussed at length
    over the past month. Dave Chinner posted patches that convert the kernel inode
    cache (an internal kernel data structure responsible for caching metadata about
    mounted file systems) to use Paul McKenney’s famous (and IBM patented) RCU (read-copy-update)
    memory access optimisation. This allows the inode cache to scale more easily when
    Linux is run on very large NUMA or non-NUMA systems without using a previously
    global lock. Also scale related, Andy Lutomirski (of a large banking corporation)
    began a discussion concerning a new MADV_WILLWRITE flag that can be used when
    setting up memory mappings to inform the kernel that a given range of virtual
    memory will definitely be written to later. This allows the kernel to forgo its
    usual ‘copy on write’ (deferred allocation of new virtual memory regions until
    the first use) and instead take the (slightly more expensive) up-front hit of
    directly allocating the memory in order to save a latency hit later when that
    memory is touched by a running application.


    Memory management contributions this month also included a virtualisation optimisation
    from Martin Schwidwiesky (of the IBM s390 team), who provided patches that allow
    guest instances to inform a host hypervisor that they are not using pages (the
    fundamental unit of memory chunks that the system uses to manage memory used by
    applications, virtual machines, the kernel itself and so on), which are automatically
    discarded whenever they would be swapped out to disk, and reinitialised when required
    later. Still further in the realm of memory management, Michal Hocko provided
    a patch that prevents the OOM (out of memory) killer from being triggered on kernel
    allocation faults – the kernel should itself be able to handle memory allocations
    failures, or use dedicated reserve memory pools.


    # ### Power capping framework


    Beyond memory management, Srinivas Pandruvada (Intel) posted an initial RFC (Request
    for Comments) patch – the first stage in developing a new idea into code – series
    that implemented an in-kernel power capping framework. The basic idea is to allow
    a given system (platform) to specify how much power is available and for a precise
    cap to be enforced across a variety of CPU and non-CPU devices installed within
    the system. Using this mechanism, it is hoped to provide certain limits (such
    as the amount of power that can be delivered by a battery, or power utility, or
    the amount of power available if a battery is intended to last for a certain time
    period, and so on) and for devices to provide various performance trade-offs within
    those constraints. But by providing an overall framework, it is possible for the
    kernel to make whole-system decisions that are not isolated to a given subsystem
    or to a given device in isolation.


    Initial comments on the power capping framework were favourable, although Greg
    Kroah-Hartman (now of the Linux Foundation) suggested that he wanted to see actual
    users of the framework before it is merged – by which he meant that he really
    wanted to see Intel put code for its own CPUs and platforms to make use of this
    framework. This seems to be in progress, since comments on the mailing list implied
    that such patches exist and have been reviewed by at least a subset of developers
    to this point. It will be interesting to see where this development leads, especially
    in the mobile space, and also when applied to other architectures.


    # ### Ongoing development


    Beyond NUMA and virtual memory, development has included an initial implementation
    of UEFI boot stub support for 32-bit ARM systems (which previously used a less
    standard embedded boot loader called U-Boot), a patch to allow per-process control
    of transparent huge pages, a fix for PCIe reinitialisation when performing a kernel
    crash dump (and kexec into a kernel that must not have outstanding DMA operations
    pending on boot), and optimisations from Andi Kleen for the kernel build system
    known as kbuild. Andi’s patches convert the ‘kallsyms’ stage of the kernel compilation
    into a single-pass, rather than being the multi-stage process that has been the
    case. This is the point during kernel compilation at which all of the symbols
    (function names provided by the kernel for internal and module use) are resolved
    during the final linking of the kernel image. Andi has a series of cute hacks
    proposed for dramatically speeding up the process.


    In this month’s kernel announcements, Ted’lo’s reminded everyone that the 2013
    Linux Kernel Summit is coming up in Edinburgh next month, and that there will
    be places reserved for those who have strictly hotshot developers. This seems
    to have been a late decision since the deadline for submissions came and went
    quickly, but it will be worth keeping an eye on this next year, in case such an
    invitation is repeated. Beyond the Kernel Summit, there will be a number of kernel
    and non-kernel developers present at the Linux Plumbers Conference in New Orleans,
    at which several other mini-conferences will run concurrently. These include an
    ACPI/Power Management gathering, a PCI mini-conference and this year’s Linux Security
    Summit, among many others.'
