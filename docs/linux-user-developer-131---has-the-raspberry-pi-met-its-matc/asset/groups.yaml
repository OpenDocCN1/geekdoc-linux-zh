    \ 4      | 2      | plugin./plugin | 1 | 2013-08-08 00:55 | |\n| 5      | 2  \
    \    | plugin./plugin | 1 | 2013-08-08 00:58 | |\n\n#### 12 构建辅助函数\n\n在这一步中，我们将查看一些重要的辅助函数。\n\
    \n**getDbPath()：** 此函数返回视频 SQLite 数据库文件的位置。XBMC 将库和播放信息存储在 SQLite DB 文件中。视频和音乐有单独的数据库，位于\
