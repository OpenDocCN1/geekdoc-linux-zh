    # # Tutorial


    # ## Make extensions for XBMC with Python


    # ## LinuxDeveloper


    # ## 07 Providing settings for the plug-in


    The following are a few important settings types that you can use...


    **text:** Used for basic string inputs.


    **ipaddress:** Used to collect internet addresses. **number:** Allows you enter
    a number. XBMC will also provide an on-screen numeric keyboard for the input.


    **slider:** This provides an elegant way to collect integer, float and percentage
    values. You can get the slider setting in the following format:


    ```

    ```xml

    <setting label="21223" type="slider"  id="sidinput"  default="10" range="1,1,10"  option="int"  />

    ```

    ```


    In the above example we are creating a slider with min range 1, max range 10 and
    step as 1. In the option field we can state the data type we are interested in
    – we can also set option to "float" or "percent".


    **bool:** Provides bool selection in the form of on or off.


    **file:** Provides a way to input file paths. XBMC will provide a file browser
    to make the selection of file.


    If you are looking to make selection for a specific type of file you can use audio,
    video, image or executable instead of file.


    **folder:** Provides a way to browse for a folder...


    ```

    ```

    <setting label="12001" type="folder"  id="folder"  source="auto" option="writeable"/>

    ```

    ```


    Here, source sets the start location for the folder, while option sets the write
    parameter for the application.


    **sep & lsep:** sep is used to draw a horizontal line in the setting dialog; lsep
    is used for drawing a horizontal line with text. They do not collect any input
    but there are for building better user interface elements...


    # ## 08 Language support


    Language support is provided in the form of the string.xml file located in resources/languages/language
    name. This approach is very similar to many large software projects, including
    Android, where static strings are never used.


    # ## resource/language/english/string.xml example:


    ```

    ```xml

    <?xml version="1.0" encoding="utf-8" standalone="yes"?>

    <strings>

    <string id="30001">Add subreddit</string>

    <string id="30002">Hot</string>

    <string id="30003">New</string>

    <string id="30004">Top</string>

    <string id="30005">Controversial</string>

    <string id="30006">Hour</string>

    <string id="30007">Day</string>

    <string id="30008">Week</string>

    <string id="30009">Month</string>

    <string id="30010">Year</string>

    </strings>

    ```

    ```


    As you may have seen in the settings.xml example, all the labels are referring
    to string ids. You can have many other languages as well. Depending upon the language
    XBMC is running in, the correct language file will be loaded automatically.


    Post XBMC Frodo (12.1), string.xml will be deprecated. Post Frodo, XBMC will be
    moved to a GNU gettext-based translation system: gettext uses PO files. You can
    use a tool called xbmc-xlzoo 2 convert strings.xml into equivalent PO files.


    # ## 09 Building default.py


    Since our plug-in is small, it will all be contained inside default.py. If you
    are developing a more complex add-on then you can create supporting files in the
    same directory. If your library depends upon third-party libraries, you have two
    ways to go about it. You can either place the third-party libraries into the resources/lib
    folder; or bundle the library itself into a plug-in, then add that plug-in as
    the dependency in the addon.xml file.


    Our plug-in works with reddit.tv. This is the website from Reddit which contains
    trending videos shared by its readers. Videos posted on Reddit are actually sourced
    from YouTub, Vimeo and Dailymotion.


    We will be starting default.py with the following imports:


    ```

    ```

    import urllib

    import urllib2

    import xbmcplugin

    ```

