    # # Write LaTeX documents with LyX


    LyX lets you to get your document written without having to deal with LaTeX''s
    steep learning curve. Here''s how...


    # **Advisor**


    **Joey Bernard** As a true rennaissance man, he splits his time between building
    furniture, helping researchers with scientific computing problems and writing
    Android apps. When the kids let him have some time, that is


    ![](img/dd9251551a61a36067892b1cc68615b0_37_3.png)


    # ## Resources


    +   * LyX: **www.lyx.org**

    +   * LaTeX: **www.latex-project.org**


    LaTeX is a typesetting system that gives you full control over how everything
    in your document is rendered. The problem is its really steep learning curve.
    One option is to use a basic text editor and learn all the markup you need for
    your document. The other option is to use an application that wraps the markup
    to some degree. LyX does this very nicely. While a fully WYSIWYG editor for LaTeX
    doesn''t make sense (since your doc isn''t fully rendered until sent to an output
    device), LyX does provide a pseudo-\WYSIWYG interface where you can see how different
    regions will be rendered.


    In this tutorial, you''ll learn how to create a new document and create various
    content sections, like images, tables and lists. You will also learn how to use
    various document settings, like the document class, to control the overall options
    used during document rendering. Since LaTeX is a typesetting system, LyX will
    let you output to several formats, like PDF, Postscript, HTML, plain text and
    OpenDocument files. Regardless of whether you are writing a book, a journal article
    or a set of presentation slides, LyX will help you get your work done with minimal
    fuss.'
