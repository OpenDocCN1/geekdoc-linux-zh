  md: "\n## Tutorial\n\n### Make extensions for XBMC with Python\n#### LinuxDeveloper\n\
    \n#### 07 Providing settings for the plug-in\n\nThe following are a few important\
    \ settings types that you can use...\n\n- **text:** Used for basic string inputs.\n\
    - **ipaddress:** Used to collect internet addresses.\n- **number:** Allows you\
    \ enter a number. XBMC will also provide an on-screen numeric keyboard for the\
    \ input.\n- **slider:** This provides an elegant way to collect integer, float\
    \ and percentage values. You can get the slider setting in the following format:\n\
    \n```xml\n<setting label=\"21223\" type=\"slider\" id=\"sidinput\" default=\"\
    10\" range=\"1,1,10\" option=\"int\" />\n```\n\nIn the above example we are creating\
    \ a slider with min range 1, max range 10 and step as 1. In the option field we\
    \ can state the data type we are interested in – we can also set option to \"\
    float\" or \"percent\".\n\n- **bool:** Provides bool selection in the form of\
    \ on or off.\n- **file:** Provides a way to input file paths. XBMC will provide\
    \ a file browser to make the selection of file.\n\nIf you are looking to make\
    \ selection for a specific type of file you can use audio, video, image or executable\
    \ instead of file.\n\n- **folder:** Provides a way to browse for a folder...\n\
    \n```xml\n<setting label=\"12001\" type=\"folder\" id=\"folder\" source=\"auto\"\
    \ option=\"writeable\"/>\n```\n\nHere, source sets the start location for the\
    \ folder, while option sets the write parameter for the application.\n\n- **sep\
    \ & lsep:** sep is used to draw a horizontal line in the setting dialog; lsep\
    \ is used for drawing a horizontal line with text. They do not collect any input\
    \ but there are for building better user interface elements...\n\n#### 08 Language\
    \ support\n\nLanguage support is provided in the form of the string.xml file located\
    \ in resources/languages/language name. This approach is very similar to many\
    \ large software projects, including Android, where static strings are never used.\n\
    \n**resource/language/english/string.xml example:**\n\n```xml\n<?xml version=\"\
    1.0\" encoding=\"utf-8\" standalone=\"yes\"?>\n<strings>\n<string id=\"30001\"\
    >Add subreddit</string>\n<string id=\"30002\">Hot</string>\n<string id=\"30003\"\
    >New</string>\n<string id=\"30004\">Top</string>\n<string id=\"30005\">Controversial</string>\n\
    <string id=\"30006\">Hour</string>\n<string id=\"30007\">Day</string>\n<string\
    \ id=\"30008\">Week</string>\n<string id=\"30009\">Month</string>\n<string id=\"\
    30010\">Year</string>\n</strings>\n```\n\nAs you may have seen in the settings.xml\
    \ example, all the labels are referring to string ids. You can have many other\
    \ languages as well. Depending upon the language XBMC is running in, the correct\
    \ language file will be loaded automatically.\n\nPost XBMC Frodo (12.1), string.xml\
    \ will be deprecated. Post Frodo, XBMC will be moved to a GNU gettext-based translation\
    \ system: gettext uses PO files. You can use a tool called xbmc-xlzoo to convert\
    \ strings.xml into equivalent PO files.\n\n#### 09 Building default.py\n\nSince\
    \ our plug-in is small, it will all be contained inside default.py. If you are\
    \ developing a more complex add-on then you can create supporting files in the\
    \ same directory. If your library depends upon third-party libraries, you have\
    \ two ways to go about it. You can either place the third-party libraries into\
    \ the resources/lib folder; or bundle the library itself into a plug-in, then\
    \ add that plug-in as the dependency in the addon.xml file.\n\nOur plug-in works\
    \ with reddit.tv. This is the website from Reddit which contains trending videos\
    \ shared by its readers. Videos posted on Reddit are actually sourced from YouTube,\
    \ Vimeo and Dailymotion.\n\nWe will be starting default.py with the following\
    \ imports:\n\n```python\nimport urllib\nimport urllib2\nimport xbmcplugin\nimport\
    \ xbmcgui\nimport xbmcaddon\n```\n\nApart from `xbmcplugin`, `xbmcgui` and `xbmcaddon`,\
    \ the rest are all standard Python libraries which are available on PyPI (Python\
    \ Package Index) via pip. You will not need to install any library yourself since\
    \ the Python runtime for XBMC has all the components built in.\n\n`urllib` and\
    \ `urllib2` help in HTTP communication. `socket` is used for network I/O; `re`\
    \ is used for regular expression matching; `sqlite3` is the Python module for\
    \ accessing an SQLite embedded database; `xbmcplugin`, `xbmcgui` and `xbmcaddon`\
    \ contain the XBMC-specific routine.\n\n#### 10 Initialising\n\nDuring the initialisation\
    \ process, we will be reading various settings from `settings.xml`. Settings can\
    \ be read in the following way:\n\n```python\naddon = xbmcaddon.Addon()\nfilterRating\
    \ = int(addon.getSetting(\"filterRating\"))\nfilterVoteThreshold = int(addon.getSetting(\"\
    filterVoteThreshold\"))\n```\n\nIn order to read settings of type bool you will\
    \ need to do something like:\n\n```python\nfilter = addon.getSetting(\"filter\"\
    ) == \"true\"\n```\n\nWe are also setting the main URL, plug-in handle and the\
    \ user agent for it:\n\n```python\npluginhandle = int(sys.argv[1])\nurlMain =\
    \ \"http://www.reddit.com\"\nuserAgent = \"Mozilla/5.0 (Windows NT 6.2; WOW64;\
    \ rv:22.0) Gecko/20100101 Firefox/22.0\"\nopener = urllib2.build_opener()\nopener.addheaders\
    \ = [('User-Agent', userAgent)]\n```\n\n#### 11 Reading localised strings\n\n\
    As mentioned, XBMC uses `strings.xml` to serve up the text. In order to read those\
    \ strings, you will need to use `getLocalizedString`.\n\n```python\ntranslation\
    \ = addon.getLocalizedString\ntranslation(30002)\n```\n\nIn this example, `translation(30002)`\
    \ will return the string \"Hot\" when running in an English environment.\n\n|\
    \ idFile | idPath | strFilename | playCount | lastPlayed | dateAdded |\n| :-----\
    \ | :----- | :---------- | :-------- | :---------- | :---------- |\n| 1      |\
    \ 1      | plugin./plugin | | 2013-08-06 22:47 | |\n| 2      | 2      | plugin./plugin\
    \ | 1 | 2013-08-07 22:42 | |\n| 3      | 2      | plugin./plugin | 1 | 2013-08-08\
    \ 00:09 | |\n| 4      | 2      | plugin./plugin | 1 | 2013-08-08 00:55 | |\n|\
    \ 5      | 2      | plugin./plugin | 1 | 2013-08-08 00:58 | |\n\n#### 12 Building\
    \ helper functions\n\nIn this step we will look at some of the important helper\
    \ functions.\n\n**getDbPath():** This return the location of the SQLite database\
    \ file for video. XBMC stores library and playback information in SQLite DB files.\
    \ There are separate databases for videos and music, located inside the `.xbmc/userdata/Database`\
    \ folder. We are concerned with the video DB. It is prefixed with 'MyVideo'.\n\
    \n```python\ndef getDbPath():\n    path = xbmc.translatePath(\"special://userdata/Database\"\
    )\n    files = os.listdir(path)\n    if file[:3] == 'MyVideo':\n        latest\
    \ = video\n        if file > latest:\n            latest = file\n    return os.path.join(path,\
    \ latest)\n```\n\n**getPlayCount(url):** Once we have the database location, we\
    \ can get the play count using a simple SQL query. The `MyVideo` database contains\
    \ a table called `files`, which keeps a record of all the video files played in\
    \ XBMC by filename. In this case it will be URL.\n\n```python\ndbPath = getDbPath()\n\
    conn = sqlite3.connect(dbPath)\nc = conn.cursor()\n\ndef getPlayCount(url):\n\
    \    c.execute('SELECT playCount FROM files WHERE strFilename=?', [url])\n   \
    \ result = c.fetchone()\n    if result:\n        result = result[0]\n        return\
    \ int(result)\n    return 0\n    return -1\n```\n\nThe above table is an example\
    \ of a files table.\n\n**addSubreddit():** Our plug-in allows users to add their\
    \ own Subreddit. This function takes the Subreddit input from the user, then saves\
    \ it in the subreddits file inside the addon data folder.\n\nThe following sets\
    \ the subreddits file location:\n\n```python\nsubredditsFile = xbmc.translatePath(\"\
    special://profile/addon_data/*+addonID*\"/subreddits\")\n```\nThis translates\
    \ into `.xbmc/userdata/addon_data/plugin.video_ludent/subreddits`.\n\n```python\n\
    def addSubreddit():\n    keyboard = xbmc.Keyboard('', 'translation(30001)')\n\
    \    if keyboard.isConfirmed() and keyboard.getText():\n        subreddit = keyboard.getText()\n\
    \        fh = open(subredditsFile, 'a')\n        fh.write(subreddit + '\\n')\n\
    \        fh.close()\n```\n\nThis function also demonstrates how to take a text\
    \ input from the user. Here we are calling the Keyboard function with a text title.\
    \ Once it detects the keyboard, it writes the input in the subreddits file with\
    \ a newline character.\n\n**getYouTubeUrl(id):** When we locate a YouTube URL\
    \ to play, we pass it to the YouTube plug-in (plugin.video.youtube) to handle\
    \ the playback. To do so, we need to call it in a certain format.\n\n```python\n\
    def getYouTubeurl(id):\n    url = \"plugin://plugin.video.youtube/`?/root/ ?/playlist=yt_video&id=videoID=\"\
    \ + id\n    return url\n```\n"
