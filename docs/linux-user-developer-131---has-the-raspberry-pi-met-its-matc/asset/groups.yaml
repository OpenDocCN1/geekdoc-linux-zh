    | 功能 | 功能集与 Eclipse 类似，但定制性不及其丰富 | 7 |

    | 插件支持 | 一个易于搜索的数据库内提供了相当大量的插件选择 | 8 |

    | 总体 | Netbeans 因界面略显过时而略逊一筹，但其丰富的插件选择在一定程度上弥补了这一点 | 7 |


    # 简评：对比我们的结论


    | | Code::Blocks | Geany | Eclipse | Netbeans |

    |---|---|---|---|---|

    | 安装 | 在仓库中可用，也可通过网站获取二进制文件 | 8 | 依赖项很少，易于获取 | 9 | 一个大型软件包套件，但很容易获得 | 7 | 在大多数主要仓库中可用，且依赖项不多
    | 8 |

    | 工作流 | 对于支持的语言来说很不错 | 7 | 出色的工作流理念，代码导航轻松 | 9 | 项目管理非常出色，代码导航良好 | 9 | 不错的工作流视图，但界面略显过时
    | 7 |

    | 功能 | 对于 C++ 来说功能选择相当不错 | 7 | Geany 没有合适的调试器 | 7 | Eclipse 是一款功能齐全的 IDE，具有高度可定制性
    | 8 | 调试器不错，定制性合理 | 7 |

    | 插件支持 | Code::Blocks 的插件支持不成熟且分布混乱 | 4 | Geany 可用的插件不多 | 4 | 在本次测试中，Eclipse 拥有远超他人的最佳插件选择
    | 10 | 庞大的插件数据库，尽管有些略显老旧 | 8 |

    | 总体 | 目前略显令人失望，但 Code::Blocks 显示出一些潜力 | 6 | 一款出色的轻量级 IDE，虽然不是最好的，但仍值得推荐 | 8 |
    因其无处不在而知名，Eclipse 拥有许多优势 | 9 | Netbeans 因缺少某些功能而略逊于其他 IDE | 7 |


    # 获胜者是...


    ## Eclipse


    实际上，我们对此月份群组测试中 Eclipse 与其他 IDE 相比如此出色感到些许惊讶。它提供了出色的项目管理功能，其极其庞大的插件列表意味着您可以随心所欲地让它是任意工作方式——这远超过
    Geany 或 Code::Blocks。


    不过，Geany 肯定是紧随其后的亚军，虽然这次我们并未专门关注轻量级 IDE，但它在功能选择丰富的同时，对系统资源占用极低。真正让 Geany 和 Code::Blocks
    落下的只有其缺乏插件支持。


    Code::Blocks 仍需一定的时间开发以及更多的社区参与，才能真正成为一款出色的 IDE。就目前而言，用于 C++ 开发它是不错的选择，我们也会为此推荐它，但它不足以推荐用于多语言开发。


    相比之下，Eclipse 在我们在多语言 IDE 中寻找的所有方面都达到了出色的平衡，这就是为什么它获得编辑选择奖。


    **Rob Zwteloot**


    > “提供出色的项目管理功能和极其庞大的插件列表，可让您以任意方式工作”


