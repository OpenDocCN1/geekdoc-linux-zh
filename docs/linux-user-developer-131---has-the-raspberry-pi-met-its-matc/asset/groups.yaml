    \ default.py\n\n由于我们的插件很小，所有内容都将包含在 `default.py` 中。如果你正在开发更复杂的插件，则可以在同一目录中创建支持文件。如果你的库依赖于第三方库，你有两种方法。你可以将第三方库放入\
