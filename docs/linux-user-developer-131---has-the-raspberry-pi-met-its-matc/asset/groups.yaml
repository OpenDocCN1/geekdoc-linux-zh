    a hobby, even if it’s big and professional) for 486+ AT clones and just about
    anything else out there under the sun,” Torvalds wrote. “This has been brewing
    since April 1991, and is still not ready.”


    The message is an amusing echo of his 1991 initial Linux release notice, which
    called for Minix users to try Linux and claimed it “won’t be big and professional
    like GNU.”


