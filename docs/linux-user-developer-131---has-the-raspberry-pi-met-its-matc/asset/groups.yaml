    A Trojan horse, dubbed the Hand of Thief, has been discovered targeting Linux
    users and attempting to grab banking credentials and other sensitive data.


    The Trojan, discovered by RSA researchers, includes sophisticated anti-monitoring
    and anti-virtualisation techniques which make it hard to analyse. Sold for around
    $2,000 on underground sites, the Trojan is claimed to be effective against all
    common Linux desktop distributions.


