    # GROUP TEST


    # Integrated development environments


    We pit four of the best IDEs against each other to find out which is the best
    way to streamline and enhance your workflow


    The humble IDE can be a very powerful tool for any coder - whether it’s for hobby
    programming or used professionally. With all the various programming languages
    one can use, there’s an even greater number of IDEs that can help you write code
    in them - each with their own advantages and disadvantages.


    In this test, we’ll be looking at the more fully featured, multi-language IDEs,
    rather than specialised single-language environments or lightweight equivalents.
    We’re also testing these IDEs for their abilities to be expanded through plug-ins
    and add-ons - either for other languages, or different interface effects.


    We’ve chosen Eclipse, Code::Blocks, Geany and Netbeans for this review. While
    they’re not included, KDevelop and Anjuta are other, desktop-environment-specific
    IDEs that are also great. We’ve chosen platform-independent IDEs for this test,
    although those two will generally work fine on other desktops.


    ![](img/dd9251551a61a36067892b1cc68615b0_71_0.png)'
  - '[PAGE 72]


    # Integrated development environment group test


    Four of the best IDEs go head to head


    **REVIEW**


    # Code::Blocks


    A more open IDE originally for C++, but now able to do a bit more


    A relatively new IDE, Code::Blocks was first released in early 2008 after three
    years of release candidates. Although a C++ IDE by default, it has plug-in support
    to extend its functionality to allow for building and testing of other languages.
    However, for pure coding, Code::Blocks can be used to write scripts in various
    languages thanks to support for syntax a of vary of different languages. However,
    you cannot test these without add-ons.


    Unfortunately, the plug-in scene for Code::Blocks is fairly immature and there
    isn’t even proper support for Python and other interpreted programming languages.
    Plug-ins are found via the Code::Blocks wiki and are not particularly well laid
    out at the moment. Plug-ins are installed manually, which would be fine normally,
    but the other IDEs in the test have some interesting ways of managing plug-ins
    that make this method seem somewhat archaic.


    While you won’t be able to properly debug test code, the interface for Code::Blocks
    is still very nice for actually writing your code. Projects are handled via proprietary
    projects files which link to specific folders. Projects don’t need to be created
    with a specific language in mind and, like some text editors, it will smartly
    know to highlight the syntax for different languages. Browsing doesn’t always
    work for all functions and classes; however, it will allow you to perform simple
    code editing to test elsewhere if you specifically like the interface.


    Code::Blocks is also quite customisable, allowing you to change the look and behaviour
    of the editor, the way the compiler works and even editing the startup script
    for the application itself.


    Code::Blocks is a nice piece of software, although due to its immaturity it doesn’t
    quite have the best plug-in support of the other IDEs in this test – especially
    if you want to use it for multi-language programming. It’s a bit lighter than
    Eclipse at least, and the interface is well laid out, but it may still be a few
    years before it becomes preferable to the others.


    > “Unfortunately, the plug-in scene for Code::Blocks is fairly immature”


    ▪ There are a few first-party plug-ins available, but not many third-party


    ▪ The interface is nice and aids workflow


    ![](img/dd9251551a61a36067892b1cc68615b0_72_0.png)


    ![](img/dd9251551a61a36067892b1cc68615b0_72_1.png)


    | | | |

    |---|---|---|

    | **SCORES** | | |

    | Installation | Available in repos, but binaries and source code is easily accessible
    elsewhere | 8 |

    | Workflow | Code::Blocks'' interface is generally good for workflow, although
    it doesn''t support all languages properly | 7 |

    | Features | A great selection of features that can all be heavily customised
    | 7 |

    | Plug-in support | Very limited right now, meaning that not all languages are
    properly supported | 4 |

    | Overall | Code::Blocks has a great interface, and some great ideas on how to
    code and manage projects, but the plug-in selection needs to be improved | 6 |'
  - '[PAGE 73]


    # # Review


    # ## Integrated development environment group test


    # # Geany


    # ## A fully featured IDE that''s a little more lightweight than most


    Geany is sometimes mistaken for a glorified text editor. In reality, it''s a full
    IDE, albeit slightly more lightweight than most.


    Geany has multi-language support out of the box, with easy options to create files
    that use different languages as part of the main interface. Projects are kept
    in specific folders, like Eclipse, although there is a file to go with them that
    Geany can read to manage the projects. Multiple projects can be viewed and edited
    at a time, all in different languages. There are also debuggers and builders for
    the various languages that support them, and you can run and test stuff like Python
    that doesn''t need compiling as such.


    The rest of the interface for Geany is clean and well tabbed. Code is automatically
    highlighted with the left column and there''s a smart tab in the left column that
    allows you to track and view the different variables, functions and classes in
    the projects and code. Navigation through the code is fairly simple via context-sensitive
    menus and nice options within the rest of the interface, and the usual code-editing
    tools such as commenting out a selection or indenting are all present.


    ![](img/dd9251551a61a36067892b1cc68615b0_73_0.png)


    The native languages are supported quite well with compilers and such


    ![](img/dd9251551a61a36067892b1cc68615b0_73_1.png)


    Geany''s interface is smart and easily breaks down code for workflow purposes


    > > “Code is automatically highlighted with the correct syntax”


    Sadly, Geany''s plug-in support is pretty dire. Some plug-ins extend the basic
    functionality for a few of the languages, but there''s not the kind of depth as
    Netbeans or Eclipse in the sheer number of available plug-ins.


    There are a lot of ways to customise Geany with the standard tools and menus,
    though. Almost every part of the interface and workflow is editable, with ways
    to even change the characters required for autocomplete suggestions.


    Geany is a very smart IDE, with a low barrier to getting your project started
    straight away. It does lack in some of the features of some of the bigger IDEs,
    such as more advanced unit testing and debugging, although it will let you browse
    compile errors. The plug-in selection is also pretty poor, so it may not be extendable
    for specific functions.


    # ## SCORES


    | Category | Description | Score |

    |---|---|---|

    | Installation | Readily available in most repos and requires minimal dependencies
    | 9 |

    | Workflow | Workflow is superb for the variety of different languages included
    | 9 |

    | Features | No proper debugger, but a great selection of build and project management
    functions | 7 |

    | Plug-in support | Although it doesn''t quite need it like the others, there
    are very few plug-ins available | 4 |

    | Overall | Geany is a great, lightweight IDE with good native support for a variety
    of languages, but there''s not much room for expansion | 8 |'
