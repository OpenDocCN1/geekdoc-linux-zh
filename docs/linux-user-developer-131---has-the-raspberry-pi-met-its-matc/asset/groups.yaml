    # # The other half of WordPress


    The story of WordPress co-founder, Mark Little


    ![](img/dd9251551a61a36067892b1cc68615b0_52_0.png)


    ![](img/dd9251551a61a36067892b1cc68615b0_52_1.png)


    Matt Mullenweg''s WordPress.com website is run by his company Automattic


    # ## LITTLE AND LINUX


    Mike Little is a long-term user of Linux. “I''ve been into Linux since the early
    days,” he recalls. “I could see that the openness, the ability to look at code,
    to modify [it]... was making better software. So I''ve always been passionate
    about it and I just absolutely think it''s the right thing to do.”


    He has fond memories of the days when Linux needed to be downloaded from FTP sites
    and stuck on several 3.5-inch floppies. “I''m gone back to...I remember series
    kernels, so right from when there probably were only three or four distributions.
    Slackware was one but I don''t even think the likes of Debian had started in the
    early days. I remember Red Hat starting so I was into it before that.”


    Little had been involved in a project called DJGPP, which was a port of the GNU
    Compiler Collection onto 16-bit DOS. “It is, he concedes, a ridiculous undertaking
    in hindsight, but it meant developer tools could be obtained from DOS without
    having to shell out money. “I think that was before I even got the world wide
    web, so at that time I had a modem but I was dialing up to bulletin boards...
    and getting software that way,” he explains.


    “And then when I got onto the internet I just kind of continued in that vein.
    So I''d already understood that this DJGPP was a port of these GNU tools so...
    I started looking at what they were and how I could use those and eventually got
    brave enough to partition my Windows machine and get Linux booted on that. Before
    that I used to boot it from a floppy... but yes, eventually I went over dual booting
    into Linux and in 1998 I went over at home full-time to Linux... By the time I
    had a decent laptop, I started with Debian but my last three laptops have run
    Ubuntu.”


    career has been based around WordPress since he left full-time employment in 2008.
    WordPress has, therefore, shaped his life. In between mouthsful, he talks us all
    about the WordPress project, barely pausing for breath, and there is little doubt
    that he is proud of the part he played in the initial years of WordPress''s inception.
    If there was any doubt, then the snazzy WordPress T-shirt he''s wearing at our
    meeting certainly puts paid to that.


    ![](img/dd9251551a61a36067892b1cc68615b0_52_2.png)


    # ## Before WordPress


    Little has been programming professionally since 1990. His first six years were
    spent at an industrial software house called Panteik in Stockport, where he became
    responsible for a team of six and developed Visual Basic apps, learned C++ and
    gained experience in DOS, Windows SDK, assembler, Novell, TCP/IP and Microsoft
    networks. After leaving Panteik, he went on to work at various other software
    companies in the Greater Manchester area, but he was also an early blogger. He
    used software called b2/cafelog which had been written by Michel Valdrighi, the
    first Corsican blogger. A small community had built up around the software with
    around 2,000 active users on the forum, but development of b2/cafelog suddenly
    ground to a halt when Valdrighi disappeared, leaving behind an app that had a
    few bugs, a couple of security issues and a


    domain that was up for renewal. Another programmer, Matt Mullenweg, also used
    b2/ cafelog, or, as it was more commonly known, b2, and he was concerned not only
    about Valdrighi''s disappearance but also about the lack of development of b2.
    He posted an article on his blog called The Bloggine Software Dilemma which discussed
    how he had come to be using b2, primarily because it was the best of the bunch
    and something he was able to develop. Mike Little spotted this blog post and responded,
    asking Mullenweg if he would be interested in forking b2. Mullenweg said he would.
    The pair then got together, albeit remotely over the internet. “I’d communicated
    with Matt a couple of times before because he had a website with a really good
    gallery on it and I''d emailed him to ask him about the software,” recalls Little.
    “I''d actually communicated with him on the b2 forums as well, but I didn''t know
    he was the same person as the one who ran the gallery site. So when I saw his
    blog post about b2, I was interested. As it turned out, I was the only person
    who responded to his posting at the time.”


    # ## Version one


    Mullenweg and Little took the b2 software and began to work on it, fixing bugs
    and adding extra features. Then Valdrighi reappeared. He


    > > “That first release of WordPress had a couple of extra features I''d already
    created for b2”


