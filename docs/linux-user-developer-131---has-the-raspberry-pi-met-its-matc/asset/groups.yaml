    \n### Nook HD+\n\n£179\n\nIs this low-cost, hi-res tablet alternative to the Kindle\
    \ Fire an Android hacker's dream device?\n\nWith the future of the Nook brand\
    \ looking decidedly murky, it may not seem like the best time to be investing\
