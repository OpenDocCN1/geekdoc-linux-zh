    Another frequent requirement – which software programmers usually have – is to
    fold some blocks of code in order to save window space. This helps them to focus
    on the required code blocks. Vim does support block folds. For this, the first
    step is to bring cursor inside the braces of the function definition. For example,
    bring the cursor to the first line of the function body. Once there, just type
    `za`. As you type this, you will observe that `za` is used to activate visual
    mode in Vim, while `Z` selects the complete block including curly braces and `z`
    enables the fold.


    To open the fold, press `zo` to close it, press `zc`. Make sure that the cursor
    is within the block while performing fold open and close. Typing `za` creates
    a fold (that is invisible). `zo` and `zc` work only when a fold is created. An
    existing fold can be deleted by typing `zd`.


