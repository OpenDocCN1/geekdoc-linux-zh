    # WordPress的另一半


    WordPress联合创始人Mark Little的故事


    ![](img/dd9251551a61a36067892b1cc68615b0_52_0.png)


    ![](img/dd9251551a61a36067892b1cc68615b0_52_1.png)


    Matt Mullenweg的WordPress.com网站由其公司Automattic运营


    ## 小麦克与Linux


    Mike Little是Linux的长期用户。“我从早期阶段就迷上了Linux，”他回忆道。“我能看出，这种开放性、查看代码的能力、修改[它]的能力……正在造就更好的软件。所以我一直对此充满热情，并坚信这是正确的做法。”


    他对Linux需要通过FTP站点下载并存储在几盘3.5英寸软盘上的日子有着美好的回忆。“我回顾过去……我记得序列内核，也就是可能只有三四个发行版的时候。Slackware是其中之一，但我想在早期，像Debian那样的发行版甚至还没启动。我记得Red
    Hat的启动，所以我在Red Hat之前就接触Linux了。”


    Little曾参与一个名为DJGPP的项目，该项目是将GNU编译器集合移植到16位DOS系统。“这在事后看来是个疯狂的举措，”他承认道，“但它意味着开发人员可以从DOS获取开发工具，而无需掏钱。‘我认为那甚至是在我接触万维网之前，当时我有调制解调器，但我要是拨号到公告板……并通过这种方式获取软件，’他解释道。


    “然后当我上网后，我只是继续沿着这个方向前进。所以我已经理解了DJGPP是这些GNU工具的移植版本，所以……我开始查看它们是什么以及我如何使用它们，最终鼓起勇气对我的Windows机器进行分区，并在其上启动Linux。在此之前，我通常从软盘启动它……但是的，最终我转向了双启动进入Linux，并在1998年全职在家使用Linux……当我拥有了一台不错的笔记本电脑时，我最初使用Debian，但我最近三台笔记本电脑都运行Ubuntu。”


    自2008年辞去全职工作以来，Little的职业生涯一直围绕WordPress展开。因此，WordPress塑造了他的生活。在交谈的间隙，他向我们讲述了WordPress项目的所有事情，几乎没有喘息的间隙，无疑，他为自己在WordPress初创阶段所扮演的角色感到自豪。如果有任何怀疑，那么他在我们会面时所穿的时尚WordPress
    T恤 certainly 打消了这种怀疑。


    ![](img/dd9251551a61a36067892b1cc68615b0_52_2.png)


    ## 在WordPress之前


    Little自1990年起开始专业编程。他的前六年是在斯托克波特一家名为Panteik的工业软件公司度过的，在那里他负责一个六人团队，开发Visual Basic应用程序，学习C++，并获得了DOS、Windows
    SDK、汇编器、Novell、TCP/IP和Microsoft网络方面的经验。离开Panteik后，他继续在大曼彻斯特地区的其他软件公司工作，但他也是一名早期的博客作者。他使用了一款名为b2/cafelog的软件，该软件由第一位科西嘉博客作者Michel
    Valdrighi编写。围绕该软件形成了一个小型社区，论坛上大约有2000名活跃用户，但当Valdrighi消失时，b2/cafelog的开发突然停滞不前，留下了一款有几个bug、一些安全问题和一个待续费域名的应用程序。


    另一位程序员Matt Mullenweg也使用b2/cafelog，或者更常见的称呼是b2，他不仅担心Valdrighi的消失，还担心b2缺乏开发。他在博客上发表了一篇文章，名为*博客软件的困境*，讨论了他如何开始使用b2，主要原因是它是其中最好的，也是他能够发展的东西。Mike
    Little注意到了这篇博客文章并回复，询问Mullenweg是否对分叉b2感兴趣。Mullenweg表示他愿意。两人随后聚集在一起，尽管是远程通过互联网。“我之前和Matt通过邮件联系过几次，因为他有一个网站，上面有一个非常棒的图库，我给他发电子邮件询问关于软件的问题，”Little回忆道。“我实际上也在b2论坛上和他交流过，但我不知道他就是运营图库网站的人。所以当我看到他的b2博客文章时，我很感兴趣。事实证明，当时我是唯一回复他帖子的人。”


    ## 第一版


    Mullenweg和Little接管了b2软件，并开始对其进行处理，修复错误并添加额外功能。然后Valdrighi重新出现了。他宣布Mullenweg和Little的软件是b2的官方后继者。“原来是他被裁员或类似的事情，不得不放弃他的公寓，回到连互联网都没有的父母那里，等等，”Little微笑着说。“所以现实生活比一点软件重要得多。”WordPress就此诞生。


    那是2003年1月。Little正在学习PHP，他觉得世界是围绕b2转的，并对它进行修改。“没有软件是完美的，所以这只是我们在思考想要添加到其中的功能，”Little说。“WordPress的第一个版本包含了一些我已经为b2创建的几个额外功能，Matt也是如此：他有一些为b2添加的额外功能。我们在论坛上分享了这些内容，并将它们整合到核心产品中。是的，我们从那里开始着手。”


    最大的变化之一是引入了页面（Pages），这对WordPress产生了巨大影响，使其在当时与竞争对手中脱颖而出。它使WordPress成为不仅仅是博客软件。但Little说，真正的“杀手级”功能是以钩子（hooks）的形式出现的。“这意味着你可以在不修改代码的情况下为产品编写扩展，这是只有真正大型的成熟软件才做到的事情，比如一些Java技术栈，”Little说。“这种实际上改变其行为方式并添加功能而无需接触任何核心文件的能力至关重要。我认为这仍然是对新开发人员来说最难理解其工作方式的地方，但我认为正是这一点让它变得更加简单。”


    他说这让软件更新过程变得更加简单。“在此之前，使用像Drupal或那些工具中的任何工具，每当有更新时，你都有丢失更改的风险，因为你修改了原始文件来调用你的内容或添加别人的内容。你把这些函数调用放在那里。这意味着一旦你得到新版本，如果你只是字面上将新版本FTP覆盖到旧版本上，你就会丢失你的内容和修改。所以我认为这可能是关键特性之一，我不认为人们一定
    appreciate 这一点，因为这些天他们根本看不到这个问题。他们更新WordPress或更新插件，哦，这是新版本，什么都没出错。然而在此之前，在更新到新软件之前，你必须保存你修改的那些文件。”


    Mullenweg和Little继续开发WordPress，第一个版本于当年五月发布。


    ![](img/dd9251551a61a36067892b1cc68615b0_53_0.png)


    ## 用户友好性


    Little和Mullenweg将WordPress视为一个不断演进的产品。Little致力于尽其所能消除犯错误的可能性，他认为这是一个关键的进步。“在最初的b2中，你可能会丢失你的设置，”他说。“但在WordPress中，我添加了config示例PHP，它直接消除了犯错误的可能性。我采用了原始的b2设置文件，并为它创建了一个选项界面。这是另一种方式，你不需要去摆弄它
    - 你不需要知道如何编辑这些文件并通过FTP将它们上传到你的服务器等等。我认为所有这些细节都使它更容易使用，更不容易搞砸，我认为这些都很有帮助。”


    对用户友好的需求始终位于两位开发者的思想前沿。对他们来说，WordPress像b2一样是一个开源项目也很重要。他们喜欢b2在通用公共许可证（GPL）下运行，这意味着他们有权获取代码、更改并将其分发给其他人。他们也喜欢它是免费的。“我一直是一个巨大的开源倡导者，”Little说。“Matt当时对开源的想法比较陌生，但这正是他选择使用b2的原因之一。”Little将WordPress的普及归功于其开源性质（“如果它不是开源的，如果不是GPL，就不会有为其编写的20,000个插件或10,000个主题，”他说），对他来说，他没有直接从WordPress中获利这一点并不重要。“没有人从WordPress直接获利，”他说。


    ![](img/dd9251551a61a36067892b1cc68615b0_53_1.png)


    ## 汲取灵感


    WordPress并非孤立创建。尽管Little和Mullenweg各自工作，隔着广阔的大西洋，但他们确实研究了当时正在创建的其他博客软件，并从中汲取灵感。“绝对有很多对竞争对手的研究和追赶，看看其他人在做什么，”Little说。“在很长一段时间内，有很多Blogger、软件，你肯定会看到Blogger或Movable
    Type具有很酷的功能，我们认为可能添加到WordPress中。最终事情也反过来，这些其他应用程序开始复制已添加到WordPress的功能。”


