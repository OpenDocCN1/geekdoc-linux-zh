    # 集成开发环境群组测试


    四款最佳 IDE 正面交锋


    ## Eclipse


    无处不在的 Eclipse 是行业标准——它与更多由社区主导的项目相比表现如何？


    **Eclipse 是当下最流行的开发套件之一，乍一看便不难明白其中的原因。** 虽然 Eclipse 主要是为 Java 开发而创建的，但通过插件它具有高度的可定制性。凭借其受欢迎程度和社区支持，这催生了一个丰富的附加组件库，使
    Eclipse 几乎可以支持任何编程语言。这些插件的功能远不止于此，拥有一个充满界面和行为修改以及语言元素的市场。


    Eclipse 还拥有出色的项目管理工具，具备智能的标签页界面，并包含特定于插件的菜单条目，以便在必要时在不同的 IDE 中启动项目。项目位于您选择位置下的普通文件夹中，如果您需要源代码，可以轻松访问，而不是将其放在专有文件中。函数搜索功能运行良好，界面提供了大量关于代码中可能存在的低效问题的提示和警告。此外，还有许多编辑工具，例如简单的缩进或减少缩进选项。


    Eclipse 中的调试套件功能齐全，提供了多种运行、检查和单元测试代码的方式，尽管这在某种程度上取决于插件。不过，这些工具确实存在，而且大多数主要插件似乎都在使用它们。


    插件由一个仓库系统处理，该系统可以让您随时保持任何附加组件的最新状态。虽然默认提供的数量不多，但向插件管理器添加更多插件非常容易，您甚至可以选择从每个仓库安装哪些扩展。


    > “丰富的附加组件选择使其几乎可以支持任何语言”


    Eclipse 在其他方面也是可定制的，拥有一个庞大的属性和设置菜单，允许您编辑 IDE 的大量原生行为，从包的方式到键绑定和其他快捷方式等小细节。然而，Eclipse
    是一个相当庞大的软件包套件，也是我们所测试的所有 IDE 中资源占用最大的一个；不过，它确实拥有所有这些 IDE 中最好的可扩展性，这意味着对于那些从事许多不同项目的人来说，它提供的价值也最大。


    ![](img/dd9251551a61a36067892b1cc68615b0_74_1.png)


    代码导航和高亮功能有助于提高您的工作效率


    ### 评分


    | | 分数 |

    |---|---|

    | 安装 | 7 |

    | 工作流 | 9 |

    | 功能 | 8 |

    | 插件支持 | 10 |

    | 总体 | 9 |


    Eclipse 之所以流行是有原因的——它拥有大量功能，且易于扩展以适应几乎任何需求


    ## Netbeans


    ### 由 Oracle 开发的、支持多任务的 Java 开发平台


    ![](img/dd9251551a61a36067892b1cc68615b0_75_0.png)


    Netbeans 最初起源于布拉格的一个简单的学生项目，旨在制作一个 Java IDE。几年内，围绕该 IDE 成立了一家公司，随后被 Sun Microsystems
    收购。其余的是历史，经过 15 多年的开发，Netbeans 目前已发布 7.3 版本。


    Netbeans 拥有一套与 Eclipse 非常相似的功能，包括调试器、编译器、单元测试工具等，虽然默认情况下，Netbeans 除了其 Java 特有功能外，还支持
    PHP 和 HTML。Netbeans 还有一个庞大的插件数据库可供调用，允许您将功能扩展到几乎任何编程语言。这些插件在 Netbeans 网站上以数据库形式整齐排列，具有简单的搜索功能以及安装插件到系统相对简单的方式。与
    Eclipse 不同，Netbeans 没有用于插件的仓库功能，但数据库展示了足够的信息，让您知道是否获取了插件的最新版本。


    界面略显混乱——流线型设计不佳，审美上也略显过时。虽然启动新项目的闪屏画面不错，但界面的其余部分杂乱无章，一些功能隐藏在奇怪的菜单选项中。代码视图的处理也不是特别出色，语法高亮略显稀疏。不过，函数导航器相当不错，侧边栏允许您比某些
    IDE 更好地跟踪层次结构。


    > “它确实没有 Eclipse 或其他 IDE 那样程度的定制性”


    Netbeans 中的定制通过外观不错的选项菜单进行处理，但它确实没有 Eclipse 或其他 IDE 那样程度的定制性。不过，对于类似的定制任务，其布局比
    Eclipse 略好。


    总体而言，Netbeans 似乎有点跟不上时代，界面需要小幅改造，定制选项的选择范围也需改善。它绝非一个糟糕的 IDE，拥有出色的调试和测试选项可用于代码。另一方面，Eclipse
    在几乎所有方面都与之持平或更好。


    ### 评分


    | | 描述 | 分数 |

