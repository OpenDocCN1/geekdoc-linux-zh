    地方政府金库已富余130万欧元


    西班牙瓦伦西亚地区政府已完成其从专有软件切换到LibreOffice的计划。


    迁移到开源替代方案的项目始于2012年，已被誉为使政府在软件许可费上节省了130万欧元。


    “除了经济利益外，对自由和开源软件的承诺还带来其他优势，包括解决方案可以用瓦伦西亚语和西班牙语使用，以及IT供应商的独立性，这鼓励了竞争，”瓦伦西亚政府ICT部门总司长Sofia
