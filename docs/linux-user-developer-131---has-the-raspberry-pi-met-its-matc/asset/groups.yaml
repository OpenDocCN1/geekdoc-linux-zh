    ## Review SparkyLinux 3.0


    ### New features: Debian 7.0 · Linux kernel 3.9.8 · GNOME 3.8 compatible


    ![](img/dd9251551a61a36067892b1cc68615b0_81_0.png)


    - Customised desktop environments such as LXDE, Openbox and MATE are available


    ![](img/dd9251551a61a36067892b1cc68615b0_81_1.png)


    - The preset Conky display gives a lot of information about your system, all of
    it relevant

