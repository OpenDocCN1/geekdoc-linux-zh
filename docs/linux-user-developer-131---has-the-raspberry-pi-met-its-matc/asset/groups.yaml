  - '[PAGE 28]


    # ## A view to develop


    The two views for Android Studio serve different purposes – and a purpose. The
    default visual view allows you to drag and drop functions onto the interface,
    with guidelines to make sure you keep them aligned with other UI elements. This
    then adds the elements to the code, so you can edit them further in there.


    The text view works like any good IDE, with a hierarchical view of code, code
    navigation tools, autocomplete and, of course, proper syntax highlighting.


    Whichever view you use is up to you – however, you will ultimately have more control
    with the text view.


    ![](img/dd9251551a61a36067892b1cc68615b0_28_0.png)


    Layouts & widgets

    Drag and drop different layouts and functions to create your app visually – a
    great way for novices to get started


    Live preview

    See a live preview of the way your app will look, even while using the text mode


    Toolbar

    Quick access to preview and debugging tools, along with the ability to change
    the theme, activity type and the device preview


    Component tree

    Even in the visual view, you can break down the code in the individual components
    to see how they work


    # ## Useful resources


    There are plenty of online resources you can use to help you with your development
    – whether you need to figure out a more elegant method to create a specific function,
    or need to wrestle with some bugs. Here’s a list of some of the places you should
    visit.


    > > Android Developer Site – developer.android.com


    As well as the place to get Android Studio, the Developer site has regular posts
    on interesting projects, updates to the SDK, and some troubleshooting tips.


    > > Stack Overflow – stackoverflow.com


    One of the best places on the internet to get advice on an issue – either by searching
    for a related question or submitting your own.


    > > IntelliJ IDEA Support – intellij-support.jetbrains.com/home


    Support for IntelliJ IDEA, the base for Android Studio. Some of the support questions
    may be more suited to the IntelliJ side of things.


    > > XDA Developers – www.xda-developers.com/


    A community built around smartphone development, the XDA forum is a good way to
    find out about Android-specific tips and tools, and even to promote your application.'
  - "[PAGE 29]\n\n# Feature\nAndroid Studio\n\n# Make your first application\n\nCreating\
    \ your first app in Android Studio is easy, and we'll start with the simplest\
    \ one of all – the classic *Hello World*.\nAll basic apps, when created, have\
    \ Hello World already displayed within them – what we're going to do here is learn\
    \ how to simply make Hello World in Android, and what other simple tasks we can\
    \ do in it.\n\n# 01 Visually\n\nTo do it visually, simply select *Plain TextView*,\
    \ and place it on the display. Double-click it and type in 'Hello World!' All\
    \ static text can be placed this way onto the interface, and it will create the\
    \ necessary code in the text view as well.\n\n# 02 Relative text\n\nThe relative\
    \ layout should be included in the code by default. Create a text parameter by\
    \ opening up triangle brackets with: `<>TextView` ...which we will use to display\
    \ 'Hello World!'\n\n# 03 Hello code\n\nTo add 'Hello World' to the Text parameter\
    \ we put in `android:layout_width=\"wrap_content\"` `android:layout_height=\"\
    wrap_content\"` `android:text=\"Hello World!\"` `android:id=\"@+id/textView\"\
    />`\nThe layout variables can also be set as fixed pixel width/height.\n\n# 04\
    \ Quit button\n\nThe file we're editing now is just the display. To do something,\
    \ we need to start editing the java file. While we're still in the .xml, place\
    \ a button and give it the caption 'Quit'. Open up `MainActivity.java` from the\
    \ Projects column before we continue.\n\n# 05 Imported\n\nNow add these imports\
    \ to the top of the code: `import android.view.Menu;` `import android.view.View;`\
    \ `import android.view.View.OnClickListener;` `import android.widget.Button;`\n\
    \n# 06 Coded actions\n\nAdd the following code below the line `setContentView(R.layout.activity_main);`:\
    \ `Button button = (Button) findViewById(R.id.button)` `button.setOnClickListener(new\
    \ OnClickListener() {`\n\n`@Override` `public void onClick(View v) {` `finish();`\
    \ `System.exit(0);` `}` `});`\nThis allows us to use some extra Android functions\
    \ to press and use the Quit button.\n\n# Code listing\n\n+   ■ **Package name**\n\
    +   - The name of your package according to the Android system\n+   \n+   ■ **Import\
    \ functions**\n+   - Import the various functions we need to get the code to work\
    \ on an Android device\n+   \n+   ■ **MainActivity class**\n+   - The MainActivity\
    \ class includes all the functions in our main activity that we created\n+   \n\
    +   ■ **Main layout**\n+   - This sets what the main layout, and displays it\n\
    +   \n+   ■ **Quit button**\n+   - The section containing the code to make sure\
    \ our button (with id button) properly quits the app with System.exit\n+   \n\
    +   ■ **Settings menu**\n+   - This creates the Android settings menu that appears\
    \ on the top of the app\n\n```\n```\npackage com.linuxuser.helloworld;\n\nimport\
    \ android.os.Bundle;\nimport android.app.Activity;\nimport android.view.Menu;\n\
    import android.view.View;\nimport android.view.View.OnClickListener;\nimport android.widget.Button;\n\
    \npublic class MainActivity extends Activity {\n\n    @Override\n    public void\
    \ onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
    \        setContentView(R.layout.activity_main);\n\n        Button button = (Button)\
    \ findViewById(R.id.button);\n        button.setOnClickListener(new OnClickListener()\
    \ {\n            @Override\n            public void onClick(View v) {\n      \
    \          finish();\n                System.exit(0);\n            }\n       \
    \ });\n    }\n\n    @Override\n    public boolean onCreateOptionsMenu(Menu menu)\
    \ {\n        // Inflate the menu; this adds items to the action bar if\n     \
    \   it is present.\n        getMenuInflater().inflate(R.menu.main, menu);\n  \
    \      return true;\n    }\n}\n```\n```"
  - '[PAGE 30]


    # # Android Studio


    Get to grips with the new IDE for Android development


    # ## FEATURE


    # ## Working with virtual devices


    Create a virtual Android device to test and debug your Android apps, choosing
    from a selection of generic phones and tablets


    ![](img/dd9251551a61a36067892b1cc68615b0_30_0.png)


    +   - **Home screen**

    +     Emulate a list of Android devices, from Nexus phones and tablets to generic
    phones defined by screen resolution.


    +   - **Android buttons**

    +     Software buttons are included on the virtual device, as they are part of
    modern Android.


    +   - **Physical buttons**

    +     There’s a range of physical buttons you can use that work on certain devices,
    with power and volume working on all.


    +   - **Hardware specs**

    +     Edit specific hardware variables to better emulate certain aspects of a
    device, or give it more power via your host system.


    ![](img/dd9251551a61a36067892b1cc68615b0_30_1.png)


    ![](img/dd9251551a61a36067892b1cc68615b0_30_2.png)


    ![](img/dd9251551a61a36067892b1cc68615b0_30_3.png)


    **01 Virtual device manager**

    From the Project View, find the Android Virtual Device (AVD) manager icon along
    the top and click it. From here you can create and edit a range of devices for
    testing your apps on. Click on New so that we can get started.


    **02 New device**

    In the pop-up dialog, name the virtual device, select the device you wish to emulate
    and then the target API level. Some devices will have a minimum Android version
    target. You can edit this later, but for our app we won’t need to change any other
    settings.


    **03 Virtual reality**

    Click OK and Android Studio will confirm the options you’re using. Press Start
    while the device is selected and choose whether you want to get a pixel-accurate
    screen, or a scaled version. It will then boot up a virtual phone or tablet you
    can test on.


    # ## Debugging


    Android Studio includes tools to debug the apps you create. To use them, first
    make sure a device is running to emulate the app. Then, click the Debug button
    — in the shape of a green bug — and the file will rebuild and launch on the device.
    This time, though, it will bring up a full logging window, a console and a debugger
    with full tools to figure out where problems may be occurring in your apps.


    ![](img/dd9251551a61a36067892b1cc68615b0_30_4.png)


    +   - Use Android Studio’s debugging tools to analyse your code.'
