    \ root MySQL 密码。请注意，这与系统的管理员帐户不同，后者也称为 'root'。选择一个密码并记录下来。\n\n#### 05 安装并测试 phpMyAdmin\n\
    \n输入 `sudo apt-get install phpmyadmin` 开始安装。当提示选择 Web 服务器时，选择 Apache2，用空格键选中它并按回车。当要求时，提供\
    \ MySQL root 密码，然后为 phpMyAdmin 选择一个密码并记录下来。导航到 http://localhost/phpmyadmin/ 应该会带您进入一个可用的登录页面。使用\
    \ MySQL root 用户名和密码登录。我们将使用 MySQL 来设置和维护实际的数据库，尽管我们稍后将在 LibreOffice 内部创建字段。\n\n\
    ![](img/dd9251551a61a36067892b1cc68615b0_34_4.png)\n\n#### 06 创建数据库\n\n在 phpMyAdmin\
    \ Web 界面中，选择 Databases（数据库）选项卡。现在通过输入名称 'customer' 到文本框中并点击 Create（创建）来创建一个新数据库。此数据库将包含我们的客户数据。\n\
    \n![](img/dd9251551a61a36067892b1cc68615b0_34_5.png)\n\n#### 07 在 LibreOffice\
    \ 中添加 JDBC\n\n我们现在需要告诉 LibreOffice 在哪里找到 JDBC 类文件。启动 LibreOffice，转到 LibreOfficeOptionsAdvanced，在\
    \ Java Options（Java 选项）部分，选择 Class Path（类路径）然后 Add Archive（添加存档）。您需要的文件位于：/usr/share/java/mysql-connector-java.jar。选择它并重启\
    \ LibreOffice。\n\n![](img/dd9251551a61a36067892b1cc68615b0_34_6.png)\n\n"
