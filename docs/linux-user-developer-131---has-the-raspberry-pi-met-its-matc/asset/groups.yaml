    \ Grain 合约作为源，但您可以使用任何可以导出 CSV 文件的软件——几乎都可以。\n\n我们添加了一些变化以保持趣味性。此项目使用 LibreOffice\
    \ 的 Base 模块作为前端，这提供了用于设置数据库、创建数据输入表单以及实际数据输入工作的 GUI。对于后端，我们将使用工业标准的 MySQL。这允许我们将后端位于中央服务器上。进而允许多个用户访问数据库。\n\
    \n对于 MySQL 数据库的初始创建，我们将使用 phpMyAdmin。尽管实际的数据库设计将在 Base 内部进行，但得益于其友好的 Web 界面。项目结束时，您将拥有一个用于浏览和编辑数据库的\
