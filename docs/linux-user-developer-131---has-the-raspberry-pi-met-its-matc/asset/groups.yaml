  - '[PAGE 55]


    # Make extensions for XBMC with Python


    ![](img/dd9251551a61a36067892b1cc68615b0_55_0.png)


    Current media selection


    List of installed plug-ins


    Configure launcher


    Rating (only available for hosted plug-ins)


    Localised description string


    Opens changelog for the plug-in


    Python is the world’s most popular easy-to-use open source language. Learn how
    to use it to build your own features for XBMC, the world’s favourite FOSS media
    centre


    # Advisor


    Kunal Deo is a veteran open source developer. Currently he is leading two open
    source projects: WinOpen64 and KUNWiki. He is also a KDE developer. He has contributed
    to many open source projects, including KDE, Solaris, Beleenix and Openmoko


    # Resources


    +   - **XBMC:** www.xbmc.org/download

    +   - **Python 2.7x**

    +   - **Python IDE (optional)**


    XBMC is perhaps the most important thing that has ever happened in the open source
    media centre space. It started its life on the original Xbox videogame console
    and since then it has become the de facto software for multimedia aficionados.
    It also has been forked into many other successful media centre applications such
    as Boxee and Plex. XBMC has ultimately grown into a very powerful open source
    application with a solid community behind it. It supports almost all major platforms,
    including different hardware architectures. It is available for Linux, Windows,
    Mac OS X, Android, iOS and Raspberry Pi.


    In these pages we will learn to build extensions for XBMC. Extensions are a way
    of adding features to XBMC without having to learn the core of XBMC or alter that
    core in any way. One additional advantage is that XBMC uses Python as its scripting
    language, and this can be also used to build the extensions. This really helps
    new developers get involved in the project since Python is easy to learn compared
    to languages like C/C++ (from which the core of XBMC is made).


    XBMC supports various types of extensions (or Add-ons): Plugins, Programs and
    Skins. Plugins add features to XBMC. Depending on the type of feature, a plug-in
    will appear in the relevant media section of XBMC. For example, a YouTube plug-in
    would appear in the Videos section. Scripts/Programs are like mini-applications
    for XBMC. They appear in the Programs section. Skins are important since XBMC
    is a completely customisable application – you can change the look and feel of
    just about every facet of the package.


    Depending upon which category your extension fits, you will have to create the
    extension directory accordingly. For example...


    ```

    **Plug-ins:** plugin.audio.ludadi: An audio plug-in

    plugin.video.ludadi: A video plug-in

    script.xxx.xxx: A program

    ```


    In this tutorial we will build an XBMC plug-in called LUD Entertainer. This plug-in
    will provide a nice way to watch videos from Reddit from within XBMC. Our plug-in
    will show various content such as trailers and documentaries from Reddit. We’ll
    also allow our users to add their own Subreddit. Each video can then be categorised
    as Hot, New, Top, Controversial etc. With this plug-in we will demonstrate how
    easy it is to hook into XBMC’s built-in method to achieve a very high-quality
    user experience.


    Due to space limitations, we aren’t able to print the full code here. We are highly
    recommended to explore the cover disc to access the complete code, which has many
    other amazing functions.'
  - "[PAGE 56]\n\n# # Make extensions for XBMC with Python\n\nUse Python to create\
    \ a new plug-in for XBMC\n\n![](img/dd9251551a61a36067892b1cc68615b0_56_0.png)\n\
    \n# ## 01  Preparing the directory structure\n\n\nAs we have mentioned previously,\
    \ each XBMC extension type follows a certain directory naming convention. In this\
    \ case we are building a *video* plug-in, so the plug-in directory name would\
    \ be **plugin.video.ludlent**. But that's just the root directory name – we will\
    \ need several other folders and files as well.  \n\nThe following describes the\
    \ directory structure of LUD Linux Entertainer:\n\n```\n```\nplugin.video.ludlent–\
    \ Root Plugin directory\n|-- addon.xml\n|-- changelog.txt\n|-- default.py\n|--\
    \ icon.png\n|-- LICENSE.txt\n|-- README\n|-- resources\n|--- lib\n|--- settings.xml\n\
    ```\n```\n\n# ## 02  Creating addon.xml\n\n\nAn **addon.xml** file needs to be\
    \ created in the root of the extension directory. The **addon.xml** file contains\
    \ the primary metadata from a XBMC extension. It contains overview, credits, version\
    \ information and dependencies information about the extension.\n\nThe root element\
    \ of **addon.xml** is the <**addon> element. It is defined as:\n\n```\n```\n<addon\
    \ id=\"plugin.video.\nludlent\" name=\"LUD HSM Viewer\"\nversion=\"0.0.1\" provider=\n\
    name=\"LUUK\">\nrest of the content is placed here\n</addon>\n```\n```\n\nHere,\
    \ **id** is the identifier for the plug-in, so it should be unique among all the\
    \ XBMC extensions, and **id** is also used for the directory name; **version**\
    \ tells XBMC the extension version number, which helps in its ability to deliver\
    \ automatic updates – XBMC follows the Major.Minor.Patch versioning convention;\
    \ **name** is the English title of the plug-in.\n\n**Note:** Steps 3 to 5 cover\
    \ entries that need to be added within the **addon.xml** file.\n\n# ## 03  Adding\
    \ dependency information\n\n\nDependency inside an extension is managed using\
    \ the <**requires>** element.\n\n```\n```xml\n<import addon=\"xbmc.python\nversion=\"\
    2.1.0\"/>\n<import addon=\"plugin.video.\nyoutube\" version=\"3.0.0\"/>\n<import\
    \ addon=\"plugin.video.vimeo\"\nversion=\"2.3.0\"/>\n<import addon=\"plugin.video.\n\
    dailymotion_com\" version=\"1.0.0\"/>\n</requires>\n```\n```\n\nIn the above code\
    \ we have added a dependency to a library called **xbmc.python** version 2.1.\
    \ Currently it is added as a mandatory dependency. To make the dependency optional\
    \ you will need to add **optional=**“**true**”; eg `<import addon=\"kumal.special\"\
    \ version=\"0.1.0\" optional=\"true\"/>`\n\nIn the above example we have added\
    \ core dependency **xbmc.python** to 2.1.0 because it's the version shipped with\
    \ XBMC version Frondo 12.0 and 12.1. If you were to add **xbmc.python** to 2.0\
    \ then it would only work in XBMC Eden 11.0 and not in the latest version.\n\n\
    For the current version of XBMC 12.1, the following versions of core XBMC components\
    \ are shipped:\n\n```\n```\nxbmc.python 2.1.0\nxbmc.gui 4.0.0\nxbmc.json 6.0.0\n\
    xbmc.metadata 2.1.0\nxbmc.addon 12.0.0\n```\n```\n\nIn addition to **xbmc.python**\
    \ we are also adding some third-party plug-ins as dependencies, such as **plugin.video.youtube**.\
    \ These plug-ins will be installed automatically when we install **plugin.video.ludlent**.\n\
    \n# ## 04  Setting up the provider and entry point\n\n\nOur extension is supposed\
    \ to provide the video content for XBMC. In order to convey that, we have to set\
    \ up the following element:\n\n```\n```xml\n<extension point=\"xbmc.python.\n\
    plugin.source\" library=\"default.\npy\">\n<provides>video</provides>\n</extension>\n\
    ```\n```\n\nHere, the **library** attribute sets up the plug-in entry point. In\
    \ this example **default.py** will be executed when the user activates the plug-in.\
    \ The <**provides>** elements sets up the media type it provides. This also gets\
    \ reflected in the placement of the plug-in. Since ours is a video plug-in, it\
    \ will show up in the Videos section of XBMC.\n\n# ## 05  Setting up plug-in metadata\n\
    \n\nMetadata about the plug-in is provided in <**extension point=\"xbmc.addon.metadata\"\
    >**. The following are the important elements...\n\n**<platforms>:** Most of the\
    \ time, XBMC extensions are cross-platform compatible. However, if you depend\
    \ on the native platform library that is only available on certain platforms then\
    \ you will need to set the supported platforms here. Accepted values for the platform\
    \ are: all, linux, osx, osx32, osx64, ios (Apple iOS), _win32 (Windows DirectX),\
    \ _win64 (Windows OpenGL) and android.\n\n**<summary lang=\"en\">:** This gives\
    \ a brief description of the plug-in. Our example set the language attribute as\
    \ English, but you can use other languages too.\n\n**<description>:** A detailed\
    \ description of the plug-in.\n\n**<website>:** Webpage where the plug-in is hosted.\n\
    \n**<source>:** Source code repository URL. If you are hosting your plug-in on\
    \ GitHub, you can mention the repository URL here.\n\n**<forum>:** Discussion\
    \ forum URL for your plug-in.\n\n**<email>:** Author email. You can directly type\
    \ email or use a bot-friendly email address like **max** at domain dot com.\n\n\
    # ## 06  Setting changelog, icon, fanart and licence\n\n\nWe need a few additional\
    \ files in the plug-in directory...\n\n**changelog.txt:** You should list the\
    \ changes made to your plug-in between releases. The changelog is visible from\
    \ the XBMC UI.\n\nAn example changelog:\n\n+   - Initial Release\n+   - Fixed\
    \ Video Buffering Issue\n\n**icon.png:** This will represent the plug-in in the\
    \ XBMC UI. It needs to be a non-transparent **PNG** file of size 256x256.\n\n\
    **fanart.jpg** (optional): The **fanart.jpg** is rendered in the background if\
    \ a user selects the plug-in in XBMC. The art needs to be rendered in HDTV formats,\
    \ so its size can range from 1280x720 (720p) up to the maximum 1920x1080 (1080p)."
