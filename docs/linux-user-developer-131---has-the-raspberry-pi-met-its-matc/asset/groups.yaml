    />`\nThe layout variables can also be set as fixed pixel width/height.\n\n###\
    \ 04 Quit button\n\nThe file we're editing now is just the display. To do something,\
    \ we need to start editing the java file. While we're still in the .xml, place\
    \ a button and give it the caption 'Quit'. Open up `MainActivity.java` from the\
    \ Projects column before we continue.\n\n### 05 Imported\n\nNow add these imports\
    \ to the top of the code:\n`import android.view.Menu;`\n`import android.view.View;`\n\
    `import android.view.View.OnClickListener;`\n`import android.widget.Button;`\n\
    \n### 06 Coded actions\n\nAdd the following code below the line `setContentView(R.layout.activity_main);`:\n\
    `Button button = (Button) findViewById(R.id.button)`\n`button.setOnClickListener(new\
    \ OnClickListener() {`\n`@Override`\n`public void onClick(View v) {`\n`finish();`\n\
    `System.exit(0);`\n`}`\n`});`\nThis allows us to use some extra Android functions\
    \ to press and use the Quit button.\n\n### Code listing\n\n- **Package name**:\
    \ The name of your package according to the Android system.\n- **Import functions**:\
    \ Import the various functions we need to get the code to work on an Android device.\n\
    - **MainActivity class**: The MainActivity class includes all the functions in\
    \ our main activity that we created.\n- **Main layout**: This sets what the main\
    \ layout, and displays it.\n- **Quit button**: The section containing the code\
    \ to make sure our button (with id button) properly quits the app with System.exit.\n\
    - **Settings menu**: This creates the Android settings menu that appears on the\
    \ top of the app.\n\n```java\npackage com.linuxuser.helloworld;\n\nimport android.os.Bundle;\n\
    import android.app.Activity;\nimport android.view.Menu;\nimport android.view.View;\n\
    import android.view.View.OnClickListener;\nimport android.widget.Button;\n\npublic\
    \ class MainActivity extends Activity {\n\n    @Override\n    public void onCreate(Bundle\
    \ savedInstanceState) {\n        super.onCreate(savedInstanceState);\n       \
    \ setContentView(R.layout.activity_main);\n\n        Button button = (Button)\
    \ findViewById(R.id.button);\n        button.setOnClickListener(new OnClickListener()\
    \ {\n            @Override\n            public void onClick(View v) {\n      \
    \          finish();\n                System.exit(0);\n            }\n       \
    \ });\n    }\n\n    @Override\n    public boolean onCreateOptionsMenu(Menu menu)\
    \ {\n        // Inflate the menu; this adds items to the action bar if\n     \
    \   // it is present.\n        getMenuInflater().inflate(R.menu.main, menu);\n\
    \        return true;\n    }\n}\n```\n\n# Android Studio\n\nGet to grips with\
    \ the new IDE for Android development\n\n## Working with virtual devices\n\nCreate\
    \ a virtual Android device to test and debug your Android apps, choosing from\
    \ a selection of generic phones and tablets.\n\n![](img/dd9251551a61a36067892b1cc68615b0_30_0.png)\n\
    \n- **Home screen**: Emulate a list of Android devices, from Nexus phones and\
    \ tablets to generic phones defined by screen resolution.\n- **Android buttons**:\
    \ Software buttons are included on the virtual device, as they are part of modern\
    \ Android.\n- **Physical buttons**: There’s a range of physical buttons you can\
    \ use that work on certain devices, with power and volume working on all.\n- **Hardware\
    \ specs**: Edit specific hardware variables to better emulate certain aspects\
    \ of a device, or give it more power via your host system.\n\n![](img/dd9251551a61a36067892b1cc68615b0_30_1.png)\n\
    ![](img/dd9251551a61a36067892b1cc68615b0_30_2.png)\n![](img/dd9251551a61a36067892b1cc68615b0_30_3.png)\n\
    \n### 01 Virtual device manager\n\nFrom the Project View, find the Android Virtual\
    \ Device (AVD) manager icon along the top and click it. From here you can create\
    \ and edit a range of devices for testing your apps on. Click on New so that we\
    \ can get started.\n\n### 02 New device\n\nIn the pop-up dialog, name the virtual\
    \ device, select the device you wish to emulate and then the target API level.\
    \ Some devices will have a minimum Android version target. You can edit this later,\
    \ but for our app we won’t need to change any other settings.\n\n### 03 Virtual\
    \ reality\n\nClick OK and Android Studio will confirm the options you’re using.\
    \ Press Start while the device is selected and choose whether you want to get\
    \ a pixel-accurate screen, or a scaled version. It will then boot up a virtual\
    \ phone or tablet you can test on.\n\n## Debugging\n\nAndroid Studio includes\
    \ tools to debug the apps you create. To use them, first make sure a device is\
    \ running to emulate the app. Then, click the Debug button — in the shape of a\
    \ green bug — and the file will rebuild and launch on the device. This time, though,\
    \ it will bring up a full logging window, a console and a debugger with full tools\
    \ to figure out where problems may be occurring in your apps.\n\n![](img/dd9251551a61a36067892b1cc68615b0_30_4.png)\n\
    \n- Use Android Studio’s debugging tools to analyse your code.\n"
  mdcn: "\n## 开发视图\n\nAndroid Studio 的两个视图服务于不同的目的——以及一个共同的目的。默认的可视化视图允许你将功能拖放到界面上，并带有指南线以确保它们与其他\
    \ UI 元素对齐。这会将元素添加到代码中，以便你可以进一步在代码中进行编辑。\n\n文本视图就像一个良好的集成开发环境（IDE）那样工作，提供代码的层级视图、代码导航工具、自动补全功能以及当然还有正确的语法高亮显示。\n\
    \n无论你使用哪个视图都由你决定——然而，最终在文本视图中你将拥有更多的控制权。\n\n![](img/dd9251551a61a36067892b1cc68615b0_28_0.png)\n\
    \n-   **布局和控件**：通过拖放不同的布局和功能来以可视化方式创建你的应用程序——这是新手入门的绝佳方式。\n-   **实时预览**：即使在使用文本模式时，也能看到应用程序外观的实时预览。\n\
    -   **工具栏**：快速访问预览和调试工具，并允许更改主题、活动类型和设备预览。\n-   **组件树**：即使在可视化视图中，你也可以分解各个组件中的代码，以了解它们如何工作。\n\
    \n## 有用的资源\n\n有很多在线资源可以帮助你进行开发——无论是你需要想出一种更优雅的方法来创建特定功能，还是需要处理一些 bug。以下是一些你应该访问的地方列表。\n\
    \n-   **Android 开发者网站** – developer.android.com\n    除了获取 Android Studio 的地方外，开发者网站还有关于有趣项目、SDK\
    \ 更新以及一些故障排除技巧的定期文章。\n-   **Stack Overflow** – stackoverflow.com\n    互联网上获取问题建议的最佳地点之一——可以通过搜索相关问题或提交你自己的问题。\n\
    -   **IntelliJ IDEA 支持** – intellij-support.jetbrains.com/home\n    IntelliJ IDEA\
    \ 的支持，它是 Android Studio 的基础。有些支持问题可能更适合 IntelliJ 那一侧的内容。\n-   **XDA 开发者** – www.xda-developers.com/\n\
    \    围绕智能手机开发建立的社区，XDA 论坛是了解 Android 特定提示和工具的好方法，甚至可以用来推广你的应用程序。\n\n# 功能：Android\
    \ Studio\n\n## 创建你的第一个应用程序\n\n在 Android Studio 中创建你的第一个应用程序很容易，我们将以最简单的那个开始——经典的\
    \ *Hello World*。\n所有基础应用程序在创建时，内部已经显示了 Hello World——我们要在这里学习的是如何简单地制作 Android\
    \ 中的 Hello World，以及我们还能在其中完成的其他简单任务。\n\n### 01 可视化操作\n\n要以可视化方式完成，只需选择 *Plain\
    \ TextView*，并将其放置在显示界面上。双击它并输入 'Hello World!'。所有静态文本都可以这样放置到界面上，并且它也会在文本视图中创建必要的代码。\n\
    \n### 02 相对文本\n\n相对布局默认应包含在代码中。通过打开尖括号创建一个文本参数：`<>TextView` ...我们将用它来显示 'Hello\
    \ World!'\n\n### 03 Hello 代码\n\n为了在 Text 参数中添加 'Hello World'，我们放入：\n`android:layout_width=\"\
    wrap_content\"`\n`android:layout_height=\"wrap_content\"`\n`android:text=\"Hello\
    \ World!\"`\n`android:id=\"@+id/textView\"/>`\n布局变量也可以设置为固定的像素宽度/高度。\n\n### 04\
    \ 退出按钮\n\n我们现在编辑的文件只是显示界面。要执行某些操作，我们需要开始编辑 java 文件。在我们继续之前，当我们在 .xml 文件中时，放置一个按钮并给它标题\
    \ 'Quit'。从 Projects 列中打开 `MainActivity.java`。\n\n### 05 导入\n\n现在在代码顶部添加这些导入：\n\
    `import android.view.Menu;`\n`import android.view.View;`\n`import android.view.View.OnClickListener;`\n\
    `import android.widget.Button;`\n\n### 06 代码操作\n\n在 `setContentView(R.layout.activity_main);`\
    \ 行下方添加以下代码：\n`Button button = (Button) findViewById(R.id.button)`\n`button.setOnClickListener(new\
    \ OnClickListener() {`\n`@Override`\n`public void onClick(View v) {`\n`finish();`\n\
    `System.exit(0);`\n`}`\n`});`\n这允许我们使用一些额外的 Android 功能来按下并使用退出按钮。\n\n### 代码列表\n\
    \n-   **包名**：根据 Android 系统，你的包的名称。\n-   **导入函数**：导入我们在 Android 设备上运行代码所需的各种函数。\n\
    -   **MainActivity 类**：MainActivity 类包含我们在创建的主活动中包含的所有函数。\n-   **主布局**：这设置主布局，并显示它。\n\
    -   **退出按钮**：包含代码的片段，确保我们的按钮（id 为 button）使用 System.exit 正确退出应用程序。\n-   **设置菜单**：这创建出现在应用程序顶部的\
    \ Android 设置菜单。\n\n```java\npackage com.linuxuser.helloworld;\n\nimport android.os.Bundle;\n\
    import android.app.Activity;\nimport android.view.Menu;\nimport android.view.View;\n\
    import android.view.View.OnClickListener;\nimport android.widget.Button;\n\npublic\
    \ class MainActivity extends Activity {\n\n    @Override\n    public void onCreate(Bundle\
    \ savedInstanceState) {\n        super.onCreate(savedInstanceState);\n       \
    \ setContentView(R.layout.activity_main);\n\n        Button button = (Button)\
    \ findViewById(R.id.button);\n        button.setOnClickListener(new OnClickListener()\
    \ {\n            @Override\n            public void onClick(View v) {\n      \
    \          finish();\n                System.exit(0);\n            }\n       \
    \ });\n    }\n\n    @Override\n    public boolean onCreateOptionsMenu(Menu menu)\
    \ {\n        // Inflate the menu; this adds items to the action bar if\n     \
    \   // it is present.\n        getMenuInflater().inflate(R.menu.main, menu);\n\
    \        return true;\n    }\n}\n```\n\n# Android Studio\n\n掌握用于 Android 开发的新\
    \ IDE\n\n## 使用虚拟设备\n\n创建一个虚拟 Android 设备来测试和调试你的 Android 应用程序，你可以从一系列通用手机和平板电脑中选择。\n\
    \n![](img/dd9251551a61a36067892b1cc68615b0_30_0.png)\n\n-   **主屏幕**：模拟一系列 Android\
    \ 设备，从 Nexus 手机和平板到由屏幕分辨率定义的通用手机。\n-   **Android 按钮**：虚拟设备包含软件按钮，因为它们是现代 Android\
    \ 的一部分。\n-   **物理按钮**：有一系列你可以在特定设备上使用的物理按钮，其中电源和音量键在所有设备上都可以使用。\n-   **硬件规格**：编辑特定的硬件变量以更好地模拟设备的某些方面，或通过你的宿主系统赋予它更多性能。\n\
    \n![](img/dd9251551a61a36067892b1cc68615b0_30_1.png)\n![](img/dd9251551a61a36067892b1cc68615b0_30_2.png)\n\
    ![](img/dd9251551a61a36067892b1cc68615b0_30_3.png)\n\n### 01 虚拟设备管理器\n\n从 Project\
    \ View 中，沿顶部找到 Android 虚拟设备 (AVD) 管理器图标并单击它。从这里你可以创建和编辑一系列设备以测试你的应用程序。单击 New 以便我们可以开始。\n\
    \n### 02 新设备\n\n在弹出的对话框中，命名虚拟设备，选择你要模拟的设备，然后选择目标 API 级别。某些设备将有最低的 Android 版本目标。你可以稍后编辑此设置，但对于我们的应用程序，我们不需要更改任何其他设置。\n\
    \n### 03 虚拟现实\n\n单击 OK，Android Studio 将确认你正在使用的选项。选中设备后按 Start，并选择你是否想要像素精确的屏幕或缩放版本。然后它将启动你可以测试的虚拟手机或平板。\n\
    \n## 调试\n\nAndroid Studio 包含用于调试你创建的应用程序的工具。要使用它们，首先确保有一个设备正在运行以模拟应用程序。然后，点击调试按钮——形状像一只绿色的虫子——文件将在设备上重新构建并启动。不过这一次，它将打开一个完整的日志窗口、控制台和一个带有完整工具的调试器，以找出问题可能出现在你的应用程序中的哪里。\n\
    \n![](img/dd9251551a61a36067892b1cc68615b0_30_4.png)\n\n- 使用 Android Studio 的调试工具来分析你的代码。\n\
    \n"
