    ### 06 Views\n\nThe default view is the visual development interface – it includes\
    \ elements down the side that allow you to drag and drop functionality. You can\
    \ also click the text tab to the bottom to get straight into the Java code, with\
    \ a live preview updating as you type.\n"
  mdcn: "\n## 开始使用 Android Studio\n\n了解 Android 开发下一阶段早期预览版的概况\n\n今年早些时候在 Google I/O\
    \ 大会上宣布，Android Studio 将成为 Eclipse 中当前 Android 开发解决方案的替代品。该 Eclipse 配置属于 Android\
    \ 开发者工具（ADT）的一部分，它利用 IDE 的基于 Java 的开发环境和插件支持，目前用于创建 Android 应用的开发部分。结合 SDK 的其余部分，可以创建虚拟设备并在部署到真实设备之前用于测试代码。\n\
    \nAndroid Studio 旨在成为开发和测试的一站式解决方案。它随附完整的 SDK，甚至在 Linux 上无需传统的编译或安装，因此 Android\
    \ Studio 是一种极其简单快捷的方式，让你直接开始编码你的应用——无论你是直接在代码中工作的经验丰富的 Android/Java 开发者，还是希望使用图形化拖放方法来创建应用的初学者。\n\
    \nAndroid Studio 目前仍处于作为免费早期预览版的测试阶段——我们将讨论软件的一些当前怪癖。然而，这绝对是一种在最终切换发生之前熟悉使用该软件的好方法。我们还将介绍如果你已经在使用\
    \ Eclipse 如何从中导出，以及最终完成后如何分发你的应用。\n\n## Android Studio\n\n掌握用于 Android 开发的新 IDE\n\
    \n![](img/dd9251551a61a36067892b1cc68615b0_24_0.png)\n\n## 介绍 Android Studio\n\
    \n新的 Android Studio 基于 IntelliJ IDEA，这是一个比 Eclipse 更小、更精简的 IDE。Android Studio\
    \ 利用其功能创建了一个集成的 Android 开发环境，具备智能可视化视图，非常适合刚开始接触应用开发的人，同时也为熟悉 Java 和 Android API\
    \ 的人提供了标准的文本编辑器。\n\n安装也非常简单——这些文件包含了你创建应用所需的 IDE 和 SDK，因此你不需要像过去在 Eclipse 中开发\
    \ Android 时那样通过 ADT 单独安装 SDK。Studio 允许你编辑 SDK 的使用方式、导入和导出如何工作，甚至还有一个插件管理器。\n\n\
    ![](img/dd9251551a61a36067892b1cc68615b0_25_0.png)\n\n- **最近的项目**\n  最近项目视图允许你直接进入想要处理的任何项目，而无需在“打开项目”提示中查找\n\
    \n- **检查更新**\n  Android Studio 有自己的更新管理器，允许你保持其最新状态。当有新版本可用时，它会通知你\n\n- **新建项目**\n\
    \  通过便捷的 Android 新建项目向导开始新项目，选择 API 级别并设置图标\n\n- **文档和操作指南**\n  欢迎界面直接提供了一些关于\
    \ Android Studio 基础 IntelliJ 的技巧和操作指南\n\n### 安装\n\n![](img/dd9251551a61a36067892b1cc68615b0_25_1.png)\n\
    \n**01 下载**\n转到 Android 开发者网站，从这里获取 Android Studio 早期访问预览版的副本：**bit.ly/1bWFxz**\n\
    然后你需要解压内容——将其放在你容易访问的文件夹中，因为你需要从该文件夹运行 Studio。\n\n![](img/dd9251551a61a36067892b1cc68615b0_25_2.png)\n\
    \n**02 运行时**\n在终端中使用 `cd` 导航到你刚刚创建的文件夹，特别是 `android-studio/bin/` 目录。要启动 Android\
    \ Studio，在终端中输入：`$ ./studio.sh`\n如果它询问你的 Java 设置，暂时按 Enter，因为如果以后成为问题，我们可以修复它。\n\
    \n![](img/dd9251551a61a36067892b1cc68615b0_25_3.png)\n\n**03 首次运行**\n如果你第一次使用\
    \ Android Studio，可以安全地忽略导入任何设置的提示。否则，找到你之前创建的文件或旧安装文件夹，以获取以前的设置。我们稍后可以从中导入 Eclipse。\n\
    \n## Android Studio\n\n掌握用于 Android 开发的新 IDE\n\n### 主要功能\n\n### 开发视图\n\n由于 Android\
    \ 应用的 Java 部分分为视觉和功能元素，你可以使用 XML 代码的可视化 WYSIWYG（所见即所得）编辑器，允许你将按钮、文本和其他 UI 元素放置在屏幕的任何位置。文本部分是一个完整的\
    \ IDE，具有代码导航、调试、语法高亮和智能代码分析器，会警告你已编写代码中任何明显的问题。\n\n![](img/dd9251551a61a36067892b1cc68615b0_26_0.png)\n\
    \n### 虚拟设备\n\n在你定义的虚拟设备上测试你的应用，通过使用主要 Nexus 设备的设置，或通过使用适用于不同尺寸 Android 手机或平板电脑的通用设置。你可以编辑系统设置以限制或增加\
    \ RAM，甚至如果需要，允许它使用系统 GPU。它并不完美，但它是快速测试功能性的极好方式。\n\n![](img/dd9251551a61a36067892b1cc68615b0_26_1.png)\n\
    \n### Eclipse 迁移\n\n对于现有的 Android 开发者来说，从 Eclipse 和 ADT 迁移到 Android Studio 很容易。已经到位的工具可以从\
    \ Eclipse 导出必要的文件，Android Studio 包含一个便捷的功能，允许你然后导入它们，以及任何其他 Studio 文件。这在现在很有帮助，当它替代\
    \ Eclipse 时将是必不可少的。\n\n![](img/dd9251551a61a36067892b1cc68615b0_26_2.png)\n\n\
    ### 调试\n\n特定的调试器可以在代码运行时分析它，并为你提供发生时情况的完整记录，允许你浏览日志并找出任何潜在问题，或确定问题已经发生在哪里。你可以随时暂停程序以隔离问题，而不是在代码继续运行时搜索代码。\n\
    \n![](img/dd9251551a61a36067892b1cc68615b0_26_3.png)\n\n### 有用的快捷键\n\nAndroid\
    \ Studio 拥有便捷、可配置的键盘快捷键。以下是帮助你入门的最常见列表...\n\n| 操作 | 快捷键 |\n| :--- | :--- |\n|\
    \ 命令查找（自动补全命令名称） | **Ctrl** + **Shift** + **A** |\n| 项目快速修复 | **Alt** + **Enter**\
    \ |\n| 重新格式化代码 | **Ctrl** + **Alt** + **L** |\n| 显示所选 API 的文档 | **Ctrl** + **Q**\
    \ |\n| 显示所选方法的参数 | **Ctrl** + **P** |\n| 生成方法 | **Alt** + **Insert** |\n| 导航打开的标签\
    \ | **Alt** + **◄** / **Alt** + **►** |\n| 跳转到源码 | **F4** |\n| 删除行 | **Ctrl**\
    \ + **Y** |\n| 按符号名称搜索 | **Ctrl** + **Alt** + **Shift** + **N** |\n| 构建 | **Ctrl**\
    \ + **F9** |\n| 构建并运行 | **Shift** + **F10** |\n| 切换项目可见性 | **Alt** + **1** |\n\
    \n## 常见问题\n\n由于 Android Studio 仍在开发中，有一些 bug 仍需解决。以下是 Android Studio 的一些已知问题，你可以绕过它们。\n\
    \n**1) 错误：Gradle 项目刷新失败**\n\nAndroid Studio 有一个较新版本的 Gradle，存在一些向后兼容性问题。这些可以通过首先从错误对话框点击链接搜索\
    \ build.gradle 来修复。然后，双击 build.gradle 使用下方的行，打开项目的 build.gradle 文件。编辑类路径以将 gradle\
    \ 版本更改为 '0.5.4.'。最后，保存文件并重新构建你的项目。\n\n**2) 错误：导入 Gradle 项目失败**\n\n在升级 Android\
    \ Studio 后可能会出现此问题，因为项目文件可能指向不再存在的 SDK 元素。要修复此问题，你需要快速安装 Android Support Repository。首先，打开\
    \ Android SDK 管理器，找到并展开 Extras，并安装 Android Support Repository。\n\n![](img/dd9251551a61a36067892b1cc68615b0_27_0.png)\n\
    \n## 迁移\n\n从 Eclipse 导出现有项目然后将其导入到 Android Studio 非常容易。首先，确保你的 ADT 插件是最新的，然后选择文件并导出。从那里打开\
    \ Android 并选择生成 Gradle 文件，然后选择你要导出的项目，点击完成。在基本的 Android Studio 窗口中，点击“导入项目”。找到\
    \ build.gradle 文件，然后在弹出窗口中按 OK。然后你应该能够在 Android Studio 中开始项目开发。\n\n## 创建新项目\n\n\
    **Android Studio 提供了一种快速启动应用的方式**：名称、软件包名称、主题、高级图标选项以及选择不同 Android API 的能力。后者允许你针对特定版本的\
    \ Android 组装应用，使某些新 API 对象可用。我们首先看看基本设置，以便稍后创建我们的 HelloWorld 应用。\n\n![](img/dd9251551a61a36067892b1cc68615b0_27_1.png)\n\
    \n### 01 创建新项目\n\n从欢迎屏幕点击“创建新项目”打开对话框窗口。将项目命名为 HelloWorld – 我们很快就会创建其代码。保留所有其他默认设置\
    \ – 它们与能够使用该应用的 Android 版本有关。\n\n![](img/dd9251551a61a36067892b1cc68615b0_27_2.png)\n\
    \n### 02 设置图像\n\n在这里你可以设置你的图像，给你一个它在不同类型设备上看起来如何的良好预览。你可以设置填充、背景颜色并移动到应用图标。目前，点击下一步，因为我们不需要示例项目的图标。\n\
    \n![](img/dd9251551a61a36067892b1cc68615b0_27_3.png)\n\n### 03 活动选择器\n\n目前，我们只使用空白活动。在制作其他应用时，这个活动选择器可以帮助你选择应用将如何表现\
    \ – 例如全屏或多列流程以查看多个项目。\n\n![](img/dd9251551a61a36067892b1cc68615b0_27_4.png)\n\n\
    ### 04 活动名称\n\n在这里你可以命名活动并自定义其工作方式，包括标签、下拉菜单和其他操作。目前，我们将保持原样。点击完成，项目将被构建。这可能需要一点时间。\n\
    \n![](img/dd9251551a61a36067892b1cc68615b0_27_5.png)\n\n### 05 项目结构\n\nAndroid\
    \ Studio 将为一个简单应用创建大量文件 – 幸运的是我们目前只需关注 `MainActivity.java` 和 `MainActivity.xml`。界面最初也设置为允许\
    \ WYSIWYG 视觉开发。\n\n![](img/dd9251551a61a36067892b1cc68615b0_27_6.png)\n\n### 06\
    \ 视图\n\n默认视图是可视化开发界面 – 它包含侧边的元素，允许你拖放功能。你还可以通过点击底部的文本标签直接进入 Java 代码，实时预览随你输入更新。\n\
    \n"
