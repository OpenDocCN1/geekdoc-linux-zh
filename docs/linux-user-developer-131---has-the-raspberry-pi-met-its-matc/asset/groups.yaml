  - '[PAGE 35]


    # Tutorial


    Make a small business database with LibreOffice


    ![](img/dd9251551a61a36067892b1cc68615b0_35_0.png)


    # 08 Connect the database


    We now need to connect our front-end (LibreOffice) to the back-end (MySQL) of
    our database. Start LibreOffice and launch the Base module. In the dialog that
    pops up, select ‘Connect to an existing database’. From the drop-down menu below
    this, select MySQL as the database type.


    ![](img/dd9251551a61a36067892b1cc68615b0_35_1.png)


    # 09 Configure Base


    On the next page, select ‘Connect using JDBC’. On the next page, click on ‘Test
    class’ to ensure that the Java RT is working. Now enter the name of the database
    that we created, **customer**, and enter **localhost** into the Server field.
    On the next page, add **Root** as the username and tick ‘Password required’. Now
    click on the ‘Test connection’ button and enter the root MySQL password, when
    asked for it, to test the connection between LibreOffice and the local MySQL server.
    Presuming that this completes without errors, click on Next.


    ![](img/dd9251551a61a36067892b1cc68615b0_35_2.png)


    # 10 Save the database


    You can accept the defaults on the next page, so click on Finish. When prompted,
    give the database a name and save it. Remember that this file contains the connection
    information for access to our MySQL database – it doesn’t contain the actual records.


    ![](img/dd9251551a61a36067892b1cc68615b0_35_3.png)


    # 11 Create fields from a template


