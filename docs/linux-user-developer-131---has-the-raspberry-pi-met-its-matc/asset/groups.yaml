    \nopener = urllib2.build_opener()\nopener.addheaders = [('User-Agent', userAgent)]\n\
    ```\n\n#### 11 读取本地化字符串\n\n如前所述，XBMC 使用 `strings.xml` 来提供文本。为了读取这些字符串，你需要使用 `getLocalizedString`。\n\
