    # # Questions & answers


    All your technical problems solved


    ![](img/dd9251551a61a36067892b1cc68615b0_88_0.png)


    It’s certainly possible to do this, and it doesn’t require a huge amount of messing
    around to accomplish either. First of all, boot into a live Linux environment
    from a disc or USB storage.


    Use `fdisk -l` and make a note of the cylinders, heads and sectors, and then edit
    the image file **sda-csh.s** with these new details. Next, use:


    ```

    `$ parted /dev/sda ‘unit s’ print`


    *...*noting down the first few lines, and then edit the file **sda-p.p** to match
    this.

    ```


    Finally, sync/restart and the restore the image with GnomeDisks and you should
    be all set. Next time, you could always shrink a partition to fit the destination
    before cloning, which should make it a little easier.


    # ## Converted


    I’ve been trying to follow a guide on converting an MKV to an AVI using MEncoder.
    It seems to work just fine, but I keep getting problems where it just plays the
    audio on some devices. Here’s what I’m doing to convert the video, weis:


    ```

    `$ mencoder abc.mkv -oac pcm -ovc xvid -xvidencopts bitrate=888 -sub ITC0101_srt
    -subfont-text-scale 3 -o zzzz.avi`

    ```


    It works fine on my PC, but on my DVD player, which has no problem with these
    codecs usually as far as I’m aware, it just doesn’t work. Am I missing something
    with my command, or is there another way I should be going about doing this?


    **Tim Duley**


    No, your command seems to be fine, it’s most likely an issue with MEncoder and
    the limited codecs on the DVD player. You might be better off trying FFmpeg, though,


    ![](img/dd9251551a61a36067892b1cc68615b0_88_1.png)


    and you can do so with the following commands:


    ```

    `$ ffmpeg -i input.mkv -vcodec libxvid -qscale 5 -s 640x272 -aspect 40:17 -r 23.976
    -g 240 -bf 2 -acodec libmp3lame -ab 160k -ar 48000 48000 -ac 2 -pass 1 -an -f
    rawvideo -v /dev/null`

    ```


    ```

    `$ ffmpeg -i input.mkv -vcodec libxvid -qscale 5 -s 640x272 -aspect 40:17 -r 23.976
    -g 240 -bf 2 -acodec libmp3lame -ab 160k -ar 48000 -async 48000 -ac 2 -pass 2
    -f avi Outlander-GS.avi`

    ```


    This should give you a little more control over what you’re outputting, and hopefully
    work a bit better with your DVD player.


