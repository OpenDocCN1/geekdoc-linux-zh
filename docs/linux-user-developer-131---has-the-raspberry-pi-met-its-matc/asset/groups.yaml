    \ the syntax for different languages. Browsing doesn’t always work for all functions\
    \ and classes; however, it will allow you to perform simple code editing to test\
    \ elsewhere if you specifically like the interface.\n\nCode::Blocks is also quite\
    \ customisable, allowing you to change the look and behaviour of the editor, the\
    \ way the compiler works and even editing the startup script for the application\
    \ itself.\n\nCode::Blocks is a nice piece of software, although due to its immaturity\
    \ it doesn’t quite have the best plug-in support of the other IDEs in this test\
    \ – especially if you want to use it for multi-language programming. It’s a bit\
    \ lighter than Eclipse at least, and the interface is well laid out, but it may\
    \ still be a few years before it becomes preferable to the others.\n\n> “Unfortunately,\
    \ the plug-in scene for Code::Blocks is fairly immature”\n\n- There are a few\
    \ first-party plug-ins available, but not many third-party\n- The interface is\
    \ nice and aids workflow\n\n![](img/dd9251551a61a36067892b1cc68615b0_72_0.png)\n\
    ![](img/dd9251551a61a36067892b1cc68615b0_72_1.png)\n\n| Category | Description\
    \ | Score |\n|---|---|---|\n| Installation | Available in repos, but binaries\
    \ and source code is easily accessible elsewhere | 8 |\n| Workflow | Code::Blocks'\
    \ interface is generally good for workflow, although it doesn't support all languages\
    \ properly | 7 |\n| Features | A great selection of features that can all be heavily\
    \ customised | 7 |\n| Plug-in support | Very limited right now, meaning that not\
    \ all languages are properly supported | 4 |\n| Overall | Code::Blocks has a great\
    \ interface, and some great ideas on how to code and manage projects, but the\
    \ plug-in selection needs to be improved | 6 |\n\n## Geany\n\nA fully featured\
    \ IDE that's a little more lightweight than most\n\nGeany is sometimes mistaken\
    \ for a glorified text editor. In reality, it's a full IDE, albeit slightly more\
    \ lightweight than most.\n\nGeany has multi-language support out of the box, with\
    \ easy options to create files that use different languages as part of the main\
    \ interface. Projects are kept in specific folders, like Eclipse, although there\
    \ is a file to go with them that Geany can read to manage the projects. Multiple\
    \ projects can be viewed and edited at a time, all in different languages. There\
    \ are also debuggers and builders for the various languages that support them,\
    \ and you can run and test stuff like Python that doesn't need compiling as such.\n\
    \nThe rest of the interface for Geany is clean and well tabbed. Code is automatically\
    \ highlighted with the correct syntax and there's a smart tab in the left column\
    \ that allows you to track and view the different variables, functions and classes\
    \ in the projects and code. Navigation through the code is fairly simple via context-sensitive\
    \ menus and nice options within the rest of the interface, and the usual code-editing\
    \ tools such as commenting out a selection or indenting are all present.\n\n![](img/dd9251551a61a36067892b1cc68615b0_73_0.png)\n\
    \nThe native languages are supported quite well with compilers and such\n\n![](img/dd9251551a61a36067892b1cc68615b0_73_1.png)\n\
    \nGeany's interface is smart and easily breaks down code for workflow purposes\n\
    \n> “Code is automatically highlighted with the correct syntax”\n\nSadly, Geany's\
    \ plug-in support is pretty dire. Some plug-ins extend the basic functionality\
    \ for a few of the languages, but there's not the kind of depth as Netbeans or\
    \ Eclipse in the sheer number of available plug-ins.\n\nThere are a lot of ways\
    \ to customise Geany with the standard tools and menus, though. Almost every part\
    \ of the interface and workflow is editable, with ways to even change the characters\
    \ required for autocomplete suggestions.\n\nGeany is a very smart IDE, with a\
