    \ Linux 供应商工作。你可以在本月 22–23 页找到他不可或缺的《内核专栏》。\n\n![](img/dd9251551a61a36067892b1cc68615b0_2_4.png)\n\
    \n**Gareth Halfacree** 是我们最新任命的驻站新闻编辑，他从第 14 页开始为我们带来来自开源生态系统各地的最新消息。本期中，Gareth\
    \ 在第 6 页采访了 Intel，探讨其新平台 MinnowBoard。你还可以在 12–13 页找到他对这款可能超越树莓派的设备的评测。\n\n![](img/dd9251551a61a36067892b1cc68615b0_2_5.png)\n\
    \n**Rob Zwetsloot** 在大学攻读航空航天工程，在课堂上使用 Python 对复杂模拟进行建模。除了教程、评测等本期内容外，Rob 还告诉我们应该使用哪个\
