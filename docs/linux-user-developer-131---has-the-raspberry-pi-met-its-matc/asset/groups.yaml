    \ and have only one Pi, you'll soon grow tired of removing the radio board in\
    \ favour of other GPIO-connected devices you may have.\n\nGareth Halfacree\n\n\
    ### Summary\n\nAlthough it would be easy to mark the RasWiiK down for its insecure\
