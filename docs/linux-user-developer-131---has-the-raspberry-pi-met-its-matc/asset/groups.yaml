    ## 开源机器人技术


    ### Linux 是机器人技术的平台


    Linux 正越来越多地用于前沿机器人技术——向任何有兴趣深入学习该领域的人敞开大门


    ![](img/dd9251551a61a36067892b1cc68615b0_17_0.png)


    Alan Broun 目前正在布里斯托机器人实验室攻读博士学位。他也是 Dawn Robotics Ltd 的董事经理——www.dawnrobotics.co.uk


    机器人技术是一个迷人的学科。它将计算机与物理世界联系起来，使它们能够移动、感知环境并与之交互。然而，传统上构建你自己的机器人需要花费大量的时间和精力，即使只是为了让最基本的机器人系统运行起来。你需要机械工程技能来构建底盘或机身，电子工程技能来连接电机和传感器，以及编程技能来让机器人动起来，控制它的身体让它做你想要它做的事。这些入门障碍意味着进入机器人技术领域的人——无论是寻找一个刺激的消遣，还是作为更正式研究的一部分——很容易被所需的大量工作所淹没。最初构建一个机器人来为你取啤酒或遛狗的梦想，会因仅仅让基础功能工作起来所消耗的时间越来越多而不断后推。


    然而，情况正在发生变化，入门障碍正在降低。消费品进步的无情推进使得许多常用的机器人硬件——如摄像头、加速度计和通信设备——比十年前便宜得多，也小得多。实际上，现在利用电子传感器和电机也容易得多，因为像
    Arduino 这样的平台使得将电子组件连接到你的计算机并控制它们变得既快速又简单。除此之外，像 Raspberry Pi 和 BeagleBoard 这样的小型、强大计算机（仅举两例），意味着你现在可以以可承受的价格在机器人中装入更多的处理能力。


    然而，为了充分利用这些硬件，你需要软件，而幸运的是，Linux 正是最激动人心的机器人软件开发发生的平台。为现代机器人编写软件可能是整个过程中最复杂、最繁琐的部分。需要软件来控制电机、读取传感器值，并且可能最重要的是提供高级控制和人工智能。人们开发了许多分布式软件环境，试图简化机器人软件的开发。但由位于硅谷的公司
    Willow Garage 开发的机器人操作系统（ROS）可以说是其中最成功的之一。ROS 实际上不是一个操作系统，而是一个在 Linux 上运行的采用 BSD
    许可证的开源软件框架。它允许为常见的机器人软件组件定义接口，例如摄像头和电机的驱动程序，并允许这些软件作为许多称为“节点”的独立进程运行——要么全部在一台机器上，要么透明地分布在多台机器的网络上。


    在过去五年中，ROS 极大地简化了编写机器人软件的过程。现在你可以下载大量预编译包，快速连接常见的传感器，如摄像头或 Microsoft 的 Kinect。高级服务如逆运动学、地图构建和语音识别很容易插入，ROS
    还提供了丰富的可视化工具选择，让你可以从机器人的视角看到发生了什么。当你需要编写自己的软件时，你可以使用你选择的语言。低级电机驱动程序可以用 C 编写，然后通过
    ROS 的网络层与用 Python 或 Java 等语言编写的高级控制进程进行通信。


    无法获取机器人硬件不再是入门的障碍，因为 ROS 还为 Gazebo 等模拟器提供支持。机器人研究界已经拥抱了 ROS，因此现在许多由构建它们的团队提供的前沿机器人模拟。因此，完全免费，你就可以访问
    Willow Garage 的 PR2 机器人、NASA 的 Robonaut 和 Boston Dynamics 的 Atlas 机器人。最后这款机器人目前正在
    DARPA 机器人挑战赛中使用，该比赛旨在让人形机器人驾驶汽车并在灾区移动，所以这确实是一项雄心勃勃的任务。


    现在是机器人技术令人兴奋的时刻，而 Linux 正是其中最酷的事情发生的平台。如果你还没有尝试过，我敦促你下载并玩玩 ROS，开始构建你自己的机器人，并加入所有的乐趣中！


