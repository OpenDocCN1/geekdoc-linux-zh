    ## 乔恩·马斯特斯


    ### 内核专栏


    内核社区的最新动态，包括 Linux 3.11 的变更


    ![](img/dd9251551a61a36067892b1cc68615b0_21_0.png)


    Jon Masters 是一位 Linux 内核开发者，从事 Linux 相关工作已有约 18 年，自他 13 岁首次上大学以来便开始了这段旅程。Jon 居住在马萨诸塞州剑桥，并供职于一家大型企业级
    Linux 供应商。他在 kernelcodcast.org 上发布每日 Linux 内核邮件列表摘要。


    Linus Torvalds 在 1991 年最初发送“Hello everybody”邮件首次介绍 Linux 的 32 周年纪念日，发布了 3.11 “工作组版
    Linux”的最新发布候选版本。


    过去几周，合入主线内核的变更相对平静，这既是夏末的典型特征，也是内核发布周期后期的常态。看起来，针对持续出现的 Windows 8 ACPI 兼容性问题的临时修复措施——这些问题会导致某些笔记本电脑上的屏幕背光行为异常（现在背光由某些
    Windows 显卡驱动程序直接管理，而不是由 ACPI 固件管理）——对于本次发布已经足够，但这些问题将在下一个周期再次被提出。如果一切按计划进行，最终版本应该很快就会发布，以便在下期的《Linux
    用户与开发者》杂志中进行总结。


    每个 Linux 版本都有一个（代码）名称，通常是一些非常滑稽的东西，而且往往是 Linus 在为新内核版本开放合并窗口（允许破坏性内核变更的时期）时想到的。但偶尔，版本名称会有更深层的含义。3.11
    版本本可能恰逢最初 Windows 3.11 “工作组版 Windows”发布的 20 周年纪念日，但事实并非如此。尽管如此，Linus 还是通过发布一条
    Google+ 帖子，对自己进行戏仿，以此庆祝他最初 Linux 公告的 22 周年纪念日。他写道：“我正在开发一个（免费的）操作系统（即使它很大且很专业，但这只是一个爱好），适用于
    486+ AT 克隆机以及世界上几乎所有其他设备。这个项目从 1991 年就开始酝酿，至今仍未准备好。”


    ### NUMA 开发


    《Linux 每周新闻》最近注意到，内核开发的特定时期往往会有某种主题，而过去这个月似乎带有一种内存管理主题。这确实看起来如此。但更具体地说，这个月的主题似乎实际上是关于
    NUMA（非统一内存访问）的开发。NUMA 旨在应对一个现实情况：随着 SMP（对称多处理，即用于为操作系统提供多个 CPU 核心的类型）的扩展，其扩展方式并不一定是线性的。事实是，某些内存
    DIMM 组距离某些 CPU 核心更“近”。


    在 SMP 系统中，每个 CPU 都可以访问系统中的每个内存位置，这通常是“相干的”，意味着底层硬件负责确保当某个 CPU 更新该内存时，其他 CPU 内部缓存的相同内存位置会得到更新。但是，如果某个内存位置对于某个处理器不是“本地的”——即如果底层硬件必须通过处理器间局部总线路由访问以到达该位置，从而需要更多步骤——那么访问该内存位置的延迟成本会更高。对于应用程序（和用户！）而言，这表现为性能低于如果应用程序的内存严格局限于某个处理器时所能达到的水平。


    Linux 以多种方式处理 NUMA。在一定程度上，它可以通过将应用程序的内存“迁移”到更靠近正在使用它的处理器（将底层内存位置复制到更靠近特定处理器的其他位置，并相应地更新虚拟内存转换表）来提供一定程度的透明支持。但已经编写了特殊工具，允许管理员更具体地指定给定应用程序应如何管理其内存。以撰写关于
    Linux 内存管理权威书籍而闻名的 Mel Gorman，最近一直致力于 NUMA 可扩展性问题，他和 Johannes Weiner 都提交了补丁，旨在更好地处理
    NUMA 提示以及将内存自动重新协调到其使用地点附近。


    除了 NUMA，过去一个月还详细讨论了其他与内存可扩展性相关的主题。Dave Chinner 提交了补丁，将内核 inode 缓存（负责缓存已挂载文件系统元数据的内核内部数据结构）转换为使用
    Paul McKenney 著名的（且被 IBM 专利保护的）RCU（读-复制-更新）内存访问优化技术。这使得在非常大的 NUMA 或非 NUMA 系统上运行
    Linux 时，inode 缓存可以更容易扩展，而无需使用先前全局锁。同样与扩展相关，来自大型银行公司的 Andy Lutomirski 开启了一场关于新的
    MADV_WILLWRITE 标志的讨论，该标志可以在设置内存映射时使用，以通知内核某个虚拟内存范围肯定会在之后被写入。这允许内核放弃其常规的“写时复制”（直到首次使用时才延迟分配新的虚拟内存区域），而是采取稍贵的前置操作，直接分配内存，以便在运行中的应用程序后续触及该内存时节省延迟开销。


    本月的内存管理贡献还包括来自 IBM s390 团队 Martin Schwidwiesky 的虚拟化优化，他提供的补丁允许客户机实例通知主机虚拟化管理程序它们正在使用的页面（系统用于管理应用程序、虚拟机、内核本身等使用的内存块的基本单位）未被使用，这些页面会在被交换到磁盘时自动丢弃，并在稍后需要时重新初始化。在内存管理领域，Michal
    Hocko 还提供了一个补丁，防止在发生内核分配故障时触发 OOM（内存不足）杀手——内核本身应该能够处理内存分配失败，或使用专用的保留内存池。


    ### 功耗限制框架


    除了内存管理，Srinivas Pandruvada（来自 Intel）提交了一个初始 RFC（请求意见）补丁——将新想法开发成代码的第一阶段——系列，该系列实现了内核内的功耗限制框架。基本思路是允许给定系统（平台）指定可用功率量，并在系统内安装的各种
    CPU 和非 CPU 设备之间强制执行精确的限制。利用此机制，希望提供某些限制（例如电池、电力公用事业可提供的功率量，或如果电池旨在持续特定时段时可用的功率量等），并让设备在这些约束条件下提供不同的性能权衡。但通过提供一个总体框架，内核可以做出整体系统决策，而不是孤立地针对某个子系统或某个设备。


    对功耗限制框架的初步评论是积极的，尽管 Greg Kroah-Hartman（现隶属于 Linux 基金会）建议，在合并该框架之前，他希望看到框架的实际使用者——他的意思是他真的希望看到
    Intel 为其自己的 CPU 和平台编写代码以利用此框架。这似乎正在进行中，因为邮件列表上的评论暗示存在此类补丁，并且迄今为止至少有一部分开发者已经审阅过。看看这一开发将走向何方将会很有趣，特别是在移动领域，以及当它应用于其他架构时。


    ### 持续开发


    除了 NUMA 和虚拟内存，开发工作还包括为 32 位 ARM 系统初始实现 UEFI 启动桩支持（这些系统此前使用一种不太标准的嵌入式引导加载程序 U-Boot）、允许对透明大页进行每进程控制的补丁、在执行内核崩溃转储（以及
    kexec 到必须在启动时没有未决 DMA 操作的内核）时修复 PCIe 重新初始化的问题，以及 Andi Kleen 针对名为 kbuild 的内核构建系统所做的优化。Andi
    的补丁将内核编译的 “kallsyms” 阶段转换为单遍过程，而不是成为多阶段过程。这是内核编译期间解析所有符号（由内核为内部和模块使用提供的函数名）的阶段，发生在内核映像的最终链接过程中。Andi
    提出了一系列巧妙的小技巧，旨在大幅加速该过程。


    在本月的内核公告中，Ted''lo''s 提醒大家，2013 年 Linux 内核峰会将于下月在爱丁堡举行，并且将为那些严格的顶尖开发者保留席位。这似乎是一个临时的决定，因为提交截止日期很快过去了，但值得在今年关注，以防这样的邀请再次出现。除了内核峰会，许多内核和非内核开发者将出席在新奥尔良举行的
    Linux 管道工会议，届时将同时举行多个其他小型会议。其中包括 ACPI/电源管理聚会、PCI 小型会议以及今年的 Linux 安全峰会等许多其他活动。


    '
