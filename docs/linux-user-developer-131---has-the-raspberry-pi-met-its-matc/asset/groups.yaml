    To close all the opened files in one go, `qa` to regular close options like `:q`,
    `:wq` or `:q!`. So, to close all the files in a single shot, do something like
    `:qa` or `:wqa` or `:qa!`.


    **07  Close files without closing Vim**


    Normally, when the last open file is closed, the Vim application also exits. But,
    if it is required to close the last open file without closing the application,
    then just type `:bd`. This closes the current file and opens an empty buffer.


