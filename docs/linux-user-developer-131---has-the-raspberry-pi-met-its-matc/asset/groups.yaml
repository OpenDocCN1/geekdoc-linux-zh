    本文中展示的所有示例均在 Ubuntu 13.04 上的 Vim 版本 7.3.547 中经过测试。


    只需输入：`:help c`，Vim 就会向新手展示一些有价值的信息，例如导航键、在 xterm 或 GUI 中启用鼠标的键盘快捷键等。


    ![](img/dd9251551a61a36067892b1cc68615b0_61_0.png)


    输入 `:help iccf`，Vim 将显示与向乌干达贫困地区捐款以及 Vim 编辑器开发相关的信息（包括网络链接）。


    ## 轻松掌握 Vim


    更进一步，学习一些高级功能，提高使用 Vim 编辑器的效率。


    ## 专栏作家


    Himanshu Arora 是一名软件程序员、开源爱好者和 Linux 研究人员。他的文章曾刊登于 IBM developerWorks、Computerworld
    和 Linux Journal。他（与其他一些 Linux 迷们）在 mylinuxbook.com 上撰写博客。


    ## 资源


    Vim: www.vim.org/download.php


    由于学习曲线陡峭，许多人要么避免使用 Vim，要么仅在非常基础的层面使用它。如果你属于这两种情况之一，那你确实错过了很多精华。


    Vim 最早于 1991 年 11 月发布，是一款基于命令行的文本编辑器，由 Bram Moolenaar 开发，作为 Amiga 平台上改进版的 Vi 克隆。除了包含流行
    Vi 编辑器的所有功能外，它还包含许多新功能，因此得名——源自 “Vi improved”（改进的 Vi）。除了作为文本编辑器外，Vim 还可以被软件程序员用作集成开发环境。Vim
    提供了广泛的功能，但由于它是一个命令行工具，因此学习曲线较陡。请注意，Vim 不是文字处理器，这意味着你不能用它进行布局相关的更改。


    虽然一旦你掌握了 Vim 编辑器，你就会了解它真正的优势，但总体而言，一些主要优点包括快速的文本编辑（因为极少或几乎不使用鼠标）以及可以在命令行的任何位置轻松执行。此外，Vim
    还有许多可用的 GUI 前端（如 gVim）。


    虽然 Vim 是基于命令行的，但它拥有一批忠实的支持者，并被系统管理员和软件程序员广泛使用。虽然很难学习和理解 Vim 提供的所有功能，但为了真正获得其好处，熟练掌握
    Vim 对于日常工作至关重要。


    通过本文，你将学习如何同时处理多个文件，如何缩进和折叠代码，如何搜索和替换关键词，如何水平/垂直分割 Vim 窗口，以及 Vim 提供的许多其他相关功能。


    **注意**：本文假设你对 Vim 编辑器有一些基本知识（打开、编辑、保存和关闭文件）。


    ## 教程


    ![](img/dd9251551a61a36067892b1cc68615b0_62_0.png)


    ### 01 处理多个文件


    虽然大多数普通用户一次只用 Vim 编辑一个文件，但它也可以用于并行编辑多个文件。要使用 Vim 编辑器打开多个文件，只需将这些文件的所有名称作为参数提供给
    `vim` 命令。第一个文件**默认被显示**。输入 `gn` 切换到下一个文件，`gp`（或 `gP`）切换到上一个文件，`gf` 切换到第一个文件，`gb`
    切换到最后一个文件，`gq` 关闭文件。


    ### 02 处理多个文件


    有时需要在编辑已打开的一组文件时打开一个新的或现有的文件。嗯，这可以通过输入 `:e` 后跟文件名（如果不在当前工作目录中，则需包含完整路径）来完成。


    ![](img/dd9251551a61a36067892b1cc68615b0_62_1.png)


    ### 03 获取 Vim 中当前打开文件的列表


    要获取当前在 Vim 编辑器中打开的文件列表，只需输入 `ls`。这将显示已打开文件的列表以及其他信息，例如文件中光标的当前行号、当前活动窗口中的文件（用
    `%` 表示）、上一个活动窗口中的文件（用 `#` 表示）等。通过输入 `gt`（或 `gT`）在当前和上一个活动窗口之间切换。


    ### 04 使用通配符


    在同时打开多个文件时，Vim 也支持通配符（如 `*`、`?` 等）。这在多个日志文件以一组共同字符（如当前日期 2013-06-05---log）开头，或者多个编程语言源文件具有相同的语言扩展名（如
    `*.c` 或 `*.cpp`）的情况下特别有用。


    ![](img/dd9251551a61a36067892b1cc68615b0_62_2.png)


    ![](img/dd9251551a61a36067892b1cc68615b0_62_3.png)


    ### 05 跨文件复制粘贴


    另一个常见的需求是从一个文件复制并粘贴到另一个文件。为此，你需要分割 Vim 窗口以同时打开这两个文件。这可以通过在 `vim` 命令中使用 `-o` 选项（`vim
    -o <file1-name> <file2-name>`）来完成，或者先通过 `vim <file-name>` 打开一个文件，然后在活动 Vim 窗口内通过
    `:split <file2-name>` 以分割窗口模式打开第二个文件。要在两个窗口之间切换光标控制，请按下 `Ctrl+w`（几次）。


    跨文件的复制粘贴操作可以按如下步骤进行：以分割模式打开文件（如上文所述）；从其中一个文件复制所需文本；按下 `Ctrl+w` 将控制权切换到另一个文件；然后粘贴复制的文本。


    你还可以垂直分割 Vim 窗口。只需在活动窗口内输入 `:vsplit <file-name>` 即可。


    ### 06 关闭所有文件


    要一次性关闭所有已打开的文件，请参考常规关闭选项，如 `:q`、`:wq` 或 `:q!`。因此，要一次性关闭所有文件，请执行如 `:qa`、`:wqa`
    或 `:qa!` 的操作。


    ### 07 不退出 Vim 的情况下关闭文件


    通常，当最后一个打开的文件被关闭时，Vim 应用程序也会退出。但是，如果需要在不关闭应用程序的情况下关闭最后一个打开的文件，只需输入 `:bd`。这将关闭当前文件并打开一个空缓冲区。


    ![](img/dd9251551a61a36067892b1cc68615b0_63_2.png)


    > 虽然大多数普通用户一次只用 Vim 编辑一个文件，但它也可以用于并行编辑多个文件。


    ### 08 折叠代码块


    另一个常见需求——通常是软件程序员提出的——是折叠某些代码块以节省窗口空间。这有助于他们专注于所需的代码块。Vim 确实支持块折叠。为此，第一步是将光标置于函数定义的大括号内。例如，将光标移至函数体的第一行。到达那里后，只需输入
    `za`。当你输入此命令时，你会发现 `za` 用于激活 Vim 中的可视模式，而 `Z` 选择包括大括号在内的完整块，并且 `z` 启用折叠。


    要打开折叠，请按 `zo`；要关闭折叠，请按 `zc`。请确保在执行折叠打开和关闭操作时，光标位于该块内。输入 `za` 创建一个折叠（它是不可见的）。只有当创建了折叠时，`zo`
    和 `zc` 才起作用。通过输入 `zd` 可以删除现有的折叠。


    ![](img/dd9251551a61a36067892b1cc68615b0_63_3.png)


    ### 09 手动缩进


    Vim 提供的另一个重要功能是代码缩进。软件程序员需要缩进他们的代码，而 Vim 提供了代码缩进的简便步骤。要缩进单行代码，你可以使用 `>` 或 `<`
    分别将该行向右或向左缩进。多行也可以使用 `{number-of-lines}>` 或 `{number-of-lines}<` 进行缩进。


    ### 10 自动缩进


    > 对于那些希望一切自动化的程序员，Vim 还提供了自动缩进功能。


    ```

    mylinuxbook@mylinuxbook-Inspiron-1525:/home/himanshu$ g++ filename1.c

    #include <stdio.h>

    #include <unistd.h>

    // A comment

    int main(void)

    {

    printf("\n Hello World\n");

    sleep(10);

    return 0;

    }

    ```


    这比逐行缩进是一种更好的技术，但你仍然需要计算要缩进的行数。如果行数非常大，这可能会令人沮丧。


    幸运的是，还有另一个技巧：通过以可视模式操作 Vim 来选择行。为了做到这一点，你首先需要将 Vim 带入可视模式。这（如前所述）可以通过使用 **V**
    来完成。进入可视模式后，使用方向键一次性选择你想缩进的所有行。之后，你只需要按下 **B** 或 **L**，整个选区将相应地进行缩进。


    自动缩进


    对于那些希望一切自动化的程序员，Vim 还提供了自动缩进功能。例如，要为 C 代码启用自动缩进，请使用 `set autoindent` 和 `set cindent`。现在，尝试编写一些
    C 代码，你会发现 Vim 在编写时会自动生成缩进。


    有时，根据 Vim 编辑器的现有设置，行可能会被缩进为除四个空格或你期望的其他默认值之外的空格数。作为解决方案，你可以使用 `set shiftwidth=<number-of-spaces>`
    设置要缩进的空格数。例如，只需输入 `set shiftwidth=4` 即可将行缩进四个空格。


    ### 11 搜索单词


    要在活动窗口中搜索单词，只需输入 `/`（搜索关键词）。这将启用 Vim 的搜索模式并找到被搜索关键词的第一个出现位置。


    使用 **N**（只需按下 **N** 即可搜索关键词的更多出现位置）。请注意，在这里无法执行向后搜索。


    如果你需要执行向后搜索，只需输入 `?`（搜索关键词）。这将启用 Vim 的向后搜索模式。同样，使用 **N** 继续搜索，但这次是向后的。


    有时关键词存在于文本/源文件中，并且希望在当前文本/源文件中找到该单词的其他出现位置。在这种情况下，只需将光标移至该单词下方并按下 **T**（或 Shift+8）。这样，你甚至无需输入该单词即可进行搜索。


    ### 12 替换单词


    Vim 还支持搜索和替换操作。要执行基本替换操作，只需输入 `:s/keyword-to-search/keyword-to-replace/` 以将 keyword-to-search
    替换为 keyword-to-replace-with。


    如果你想替换被搜索关键词的所有出现位置，这个小技巧很好，但如果只想替换选定的出现位置怎么办？嗯，有一种方法可以让你在交互模式下运行搜索和替换操作。这意味着
    Vim 在每次替换关键词之前都会进行确认。这可以通过 `: %s/keyword-to-search/keyword-to-replace/g` 来实现。


    第一个出现位置始终被高亮显示，Vim 在底部显示一个提示（绿色），你可以在此输入选择是否要替换此出现位置。这里，**y** = 是，替换此出现位置；**n**
    = 否，跳过此出现位置；**a** = 替换此及所有其他出现位置；**q** = 退出命令；**i** = 替换此匹配项然后退出命令。在此模式下，使用 **Ctrl+e**
    (^E) 和 **Ctrl+y** (^Y) 向上和向下滚动窗口。此外，使用 **i** 和 **I**（配合例如 **/a** 或用于不区分大小写和区分大小写搜索的
    **/ci**）。


    ```

    himanshu@mylinuxbook-Inspiron-1525:~

    #include <iostream>

    class A

    {

    private:

    int a;

    int b;

    public:

    void init()

    {

    a = 10;

    b = a*10;

    }

    }

    replace with char (\d*) (\d*) (\d*) (\d*) (\d*) (\d*) 0,5 Top

    ```


