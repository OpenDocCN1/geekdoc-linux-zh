    # The other half of WordPress


    The story of WordPress co-founder, Mark Little


    ![](img/dd9251551a61a36067892b1cc68615b0_52_0.png)


    ![](img/dd9251551a61a36067892b1cc68615b0_52_1.png)


    Matt Mullenweg''s WordPress.com website is run by his company Automattic


    ## LITTLE AND LINUX


    Mike Little is a long-term user of Linux. “I''ve been into Linux since the early
    days,” he recalls. “I could see that the openness, the ability to look at code,
    to modify [it]... was making better software. So I''ve always been passionate
    about it and I just absolutely think it''s the right thing to do.”


    He has fond memories of the days when Linux needed to be downloaded from FTP sites
    and stuck on several 3.5-inch floppies. “I''m gone back to... I remember series
    kernels, so right from when there probably were only three or four distributions.
    Slackware was one but I don''t even think the likes of Debian had started in the
    early days. I remember Red Hat starting so I was into it before that.”


    Little had been involved in a project called DJGPP, which was a port of the GNU
    Compiler Collection onto 16-bit DOS. “It is,” he concedes, “a ridiculous undertaking
    in hindsight, but it meant developer tools could be obtained from DOS without
    having to shell out money. ‘I think that was before I even got the world wide
    web, so at that time I had a modem but I was dialing up to bulletin boards...
    and getting software that way,’ he explains.


    “And then when I got onto the internet I just kind of continued in that vein.
    So I''d already understood that this DJGPP was a port of these GNU tools so...
    I started looking at what they were and how I could use those and eventually got
    brave enough to partition my Windows machine and get Linux booted on that. Before
    that I used to boot it from a floppy... but yes, eventually I went over dual booting
    into Linux and in 1998 I went over at home full-time to Linux... By the time I
    had a decent laptop, I started with Debian but my last three laptops have run
    Ubuntu.”


    His career has been based around WordPress since he left full-time employment
    in 2008. WordPress has, therefore, shaped his life. In between mouthfuls, he talks
    us all about the WordPress project, barely pausing for breath, and there is little
    doubt that he is proud of the part he played in the initial years of WordPress''s
    inception. If there was any doubt, then the snazzy WordPress T-shirt he''s wearing
    at our meeting certainly puts paid to that.


    ![](img/dd9251551a61a36067892b1cc68615b0_52_2.png)


    ## Before WordPress


    Little has been programming professionally since 1990. His first six years were
    spent at an industrial software house called Panteik in Stockport, where he became
    responsible for a team of six and developed Visual Basic apps, learned C++ and
    gained experience in DOS, Windows SDK, assembler, Novell, TCP/IP and Microsoft
    networks. After leaving Panteik, he went on to work at various other software
    companies in the Greater Manchester area, but he was also an early blogger. He
    used software called b2/cafelog which had been written by Michel Valdrighi, the
    first Corsican blogger. A small community had built up around the software with
    around 2,000 active users on the forum, but development of b2/cafelog suddenly
    ground to a halt when Valdrighi disappeared, leaving behind an app that had a
    few bugs, a couple of security issues and a domain that was up for renewal.


    Another programmer, Matt Mullenweg, also used b2/cafelog, or, as it was more commonly
    known, b2, and he was concerned not only about Valdrighi''s disappearance but
    also about the lack of development of b2. He posted an article on his blog called
    *The Blogging Software Dilemma* which discussed how he had come to be using b2,
    primarily because it was the best of the bunch and something he was able to develop.
    Mike Little spotted this blog post and responded, asking Mullenweg if he would
    be interested in forking b2. Mullenweg said he would. The pair then got together,
    albeit remotely over the internet. “I’d communicated with Matt a couple of times
    before because he had a website with a really good gallery on it and I''d emailed
    him to ask him about the software,” recalls Little. “I''d actually communicated
    with him on the b2 forums as well, but I didn''t know he was the same person as
    the one who ran the gallery site. So when I saw his blog post about b2, I was
    interested. As it turned out, I was the only person who responded to his posting
    at the time.”


    ## Version one


    Mullenweg and Little took the b2 software and began to work on it, fixing bugs
    and adding extra features. Then Valdrighi reappeared. He declared Mullenweg and
    Little’s software as the official successor to b2. “It turns out he’d been made
    redundant or something like that, had to give up his flat, gone back to his parents
    who didn’t even have internet and so on,” smiles Little. “So it was just the real
    world was much more important than a bit of software.” WordPress was thus born.


    It was January 2003. Little had been learning PHP and he felt the world worked
    his way around b2 and makes alterations. “No software is perfect, so it was just
    a case of thinking of things that we wanted to add to it,” says Little. “That
    first release of WordPress had a couple of extra features that I’d already created
    for b2 and the same for Matt: he had a couple of extra features that he’d added
    to b2. We’d shared these things on the forums and we kind of incorporated those
    into the core product. And yeah, we just took it from there.”


    One of the biggest changes was the introduction of Pages, which made a massive
    difference to WordPress and set it apart from its rivals at the time. It enabled
    WordPress to become more than blogging software. But the ''killer'' feature, Little
    says, came in the guise of hooks. “It meant you could write additions to the product
    without having to modify the code, and that was something that only really big
    grown-up software did, like some of the Java Stacks,” says Little. “This ability
    to actually change the way it behaves and add things to it without having to touch
    any of the core files was crucial. It’s still the hardest thing, I think, for
    new developers to get their heads round how it works, but I think that’s what
    made it so much easier.”


    He said it made the process of updating the software so much easier. “Prior to
    that, with anything like Drupal or any of those tools, whenever there was an update
    you were in danger of losing your changes because you’d modified original files
    to call your stuff or to add somebody else’s stuff in. You’d stick these function
    calls in there. It meant that as soon as you got the new version, if you just
    literally FTP’ed the new one over the top of the old one, you were going to lose
    your stuff and lose your modifications. So I think that was probably one of the
    key features and I don’t think it’s necessarily something that people appreciate
    because these days they just never see the problem. They update WordPress or they
    update the plug-ins and oh, it’s the new version, and nothing’s gone wrong. And
    yet before then you had to save those files you modified before you updated to
    the new software.”


    Mullenweg and Little continued to work on WordPress and the first release came
    in May of that year.


    ![](img/dd9251551a61a36067892b1cc68615b0_53_0.png)


    ## User-friendliness


    Little and Mullenweg saw WordPress as an evolving product. Little worked on doing
    what he could to eliminate the ability to make mistakes, which he believes was
    a crucial step forward. “With the original b2, you could lose your settings,”
    he says. “But with WordPress, I added the config sample PHP and it just took that
    ability to make a mistake away. I took what was the original b2 settings file
    and created an Options interface for it. It was another way, you didn’t have to
    fiddle with it - you didn’t have to know how to edit these files and FTP them
    back up to your server and stuff like that. I think all those bits helped make
    it easier, made it harder to cock up and I think that all helped.”


    The need to be user-friendly was at the forefront of the minds of both developers.
    It was also important for them that WordPress, like b2, was an open source project.
    They loved that b2 operated under a General Public Licence, which meant they had
    the freedom to take the code, change it and distribute it to other people. They
    loved that it was free too. “I’ve always been a huge open source advocate,” says
    Little. “Matt was kind of new to the open source idea, but that was one of the
    reasons behind him choosing to use b2.” Little attributes the popularity of WordPress
    to its open source nature (“if it wasn’t open source, if it wasn’t GPL, there
    wouldn’t be the 20,000 plug-ins that have been written for it or the 10,000 themes,”
    he says) and it matters not to him that he has not made any direct money from
    WordPress. “Nobody does,” he says.


    ![](img/dd9251551a61a36067892b1cc68615b0_53_1.png)


    ## TAKING INSPIRATION


    WordPress was not created in isolation. Although Little and Mullenweg worked on
    their own, with the expanse of the Atlantic ocean separating them, they did look
    at other blogging software being created at the time and they took inspiration
    from it. “There was definitely a lot of studying of rivals and playing catch-up,
    seeing what other people were doing,” Little says. “For a very long time there
