    \n![](img/dd9251551a61a36067892b1cc68615b0_33_0.png)\n\n### 使用 LibreOffice 创建小型企业数据库\n\
    \n创建一个结合了使用 LibreOffice 的基于表单的易用前端和便携式网络化 MySQL 后端的数据库。\n\n#### 顾问\n\nMichael\
