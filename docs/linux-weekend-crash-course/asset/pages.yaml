  md: '# Session 25—Scheduling Jobs in Linux


    To remove a cron job, use the following command:


    ```

    crontab -u username -r

    ```


    The cron daemon also executes the cron jobs listed in the system-wide cron file
    /etc/crontab. Here''s the default /etc/crontab file in Linux (type cat /etc/crontab
    to view the file):


    ```

    SHELL=/bin/bash

    PATH=/sbin:/bin:/usr/sbin:/usr/bin

    MAILTO=\nHOME=/

    ```


    # run-parts

    01 * * * root run-parts /etc/cron.hourly

    02 4 * * root run-parts /etc/cron.daily

    22 4 * * root run-parts /etc/cron.weekly

    42 4 1 * * root-parts /etc/cron.monthly


    The first four lines set up environment variables for jobs listed in the file.
    The MAILTO environment variable specifies the user who receives the mail message
    that contains the output from cron jobs in this file.

    The line that begins with a # is a comment line. The last four lines execute the
    run-parts shell (located in the /usr/bin directory) at various times with the
    name of a specific directory as an argument. Each of the arguments that are run-parts
    - /etc/cron.hourly, /etc/cron.daily, /etc/cron.weekly, and /etc/cron.monthly —
    are directories. Essentially, run-parts executes all scripts located in the directory
    you provide as an argument. Here is what those directories contain:


    | Directory Name | Contents |

    |---|---|

    | /etc/cron.hourly | scripts executed every hour |

    | /etc/cron.daily | scripts executed each day at 4:02 a.m. |

    | /etc/cron.weekly | scripts executed weekly on Sunday at 4:22 a.m. |

    | /etc/cron.monthly | scripts executed at 4:42 a.m. on the first day of month
    |

    | /etc/cron.allow | file containing names of users allowed to run cron jobs |

    | /etc/cron.deny | file containing names of users not allowed to run cron jobs
    |'
