  md: '# Session 14—Networking in Linux


    To configure the network interfaces, you need to assign IP

    addresses to each Interface. If you are running a private network,

    y may use IP addresses in the range 192.168.0.0 to

    192.168.255.255. (There are other ranges of addresses reserved

    for private networks, but this range should suffice for most

    needs.) For example, use the 192.168.1.0 address for a small

    private network.


    # TCP/IP Diagnostic Commands


    Assuming the network is configured, you can check to see whether the network is\dup
    and running your Linux system is properly configured for TCP/IP

    networking. You can, of course, use network applications as TELNET or FTP

    verify that the network is up and running, but Linux also includes a number of

    utility programs that help you monitor and diagnose problems.


    # Checking the Interfaces


    Type the /sbin/ifconfig command to view the currently configured network

    interfaces. The ifconfig command also configures a network interface (associates

    in IP address with a network device) during system startup. However, if you run

    config without any command-line arguments, the command displays informa-

    out the current network interfaces. Here is the result of a typical invocation

    of ifconfig:


    ```

    eth0

    encap:Ethernet Hwaddr:02:BC:E8:C6:A9

    inet addr:192.168.1.200 Broadcast:192.168.1.255 Mask:255.255.255.0

    UP BROADCAST MULTICAST MTU:1500 Metric:1

    RX packets:3009 errors:dropped:0 overflows:0 frame:0

    TX packets:1140 errors:dropped:0 overflows:0 carrier:0

    collisions:0 txqueuelen:100

    Interrupt:5 Base address:0x300

    ```


    ```

    lo

    encap:local Loopback

    inet addr:127.0.0.1 Mask:255.255.255.0

    UP LOOPBACK RUNNING MTU:3924 Metric:1

    RX packets:54 errors:dropped:0 overflows:0 frame:0

    TX packets:54 errors:dropped:0 overflows:0 carrier:0

    collisions:0 txqueuelen:0

    ```'
