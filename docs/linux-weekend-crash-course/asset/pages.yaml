- img_proc: true
  md: '# Session 14—Networking in Linux


    The order option indicates the order of services. The sample entry specifies that
    the resolver library should first consult the /etc/hosts file and then check the
    name servers to resolve a name. The name servers are listed in the /etc/resolv.conf
    file, which you examine next.


    > The multi option specifies that hosts listed in the /etc/hosts file can have
    multiple IP addresses. Hosts that have more than one IP address are called multihomed
    because the presence of multiple IP addresses implies that the host has several
    network interfaces (in other words, the host “lives” in several networks simultaneously).


    # /etc/resolv.conf


    The /etc/resolv.conf configuration file is another text file the resolver uses
    — a library that determines the IP address for a host name. Type /etc/resolv.conf
    to view the contents of this file. Following is a sample /etc/resolv.conf file:


    ```

    search xyz.com

    nameserver 164.109.1.3

    nameserver 164.109.1.23

    ```


    The search line specifies names of systems to search for host names. The nameserver
    provides the IP addresses of name servers for your domain. If you have multiple
    name servers, you should list them on separate lines. They are queried in the
    order they appear in the file. Typically, you list in the /etc/resolv.conf file
    the name servers your Internet Service Provider provides.


    If you do not have a name server for your network, you can safely ignore this
    file. TCP/IP will still work, though you can only refer to those hosts listed
    in the /etc/hosts file.


    # /etc/hosts.allow


    This file specifies which hosts are allowed to use the Internet services (such
    as TELNET and FTP) that may be running on your system. The program that starts
    Internet services consults the /etc/hosts.allow file before starting. It starts
    the service only if the entries in the hosts.allow file imply that the requesting
    host can use the services.'
  merge: -1
  pgno: 204
- img_proc: true
  md: 'The entries in /etc/hosts.allow are in the form of a server:IP address format,
    in which server refers to the name of the program providing a specific Internet
    service and IP address identifies the host allowed to use that. For example, if
    you all hosts in your local network (which has the address 192.168.1.0) to access
    the FTP service (which the in.ftpd program provides), add the following line in
    the /etc/hosts.allow file:


    ```

    in.ftpd:192.168.1.1.

    ```


    If you want to let all hosts have access to All services, you can use the ALL
    keyword and rewrite the line as follows:


    ```

    ALL:192.168.1.

    ```


    Finally, to open Internet services to all hosts, you can replace the IP address
    with ALL as follows:


    ```

    ALL:ALL

    ```


    You can also use host names in place of IP addresses.


    > Security experts discourage allowing all hosts access to all services on your
    system. For a more secure system, you should deny all hosts access and then allow
    access to your system. This means you should explicitly list in /etc/hosts.allow
    those hosts that can access your system. Then deny all other hosts access to your
    system using the /etc/hosts.deny file (which you examine in the next section).


    ![](img/448aa2bd6846782b632c764b035753bc_205_0.png)


    # /etc/hosts.deny


    This is just the opposite of /etc/hosts.allow— whereas hosts.allow specifies which
    hosts may access Internet services (such as TELNET and FTP) on your system, hosts.deny
    file identifies the hosts that must be denied services. The program that starts
    Internet services consults the /etc/hosts.deny file if it does not find any rules
    in the /etc/hosts.allow file that apply to the requesting host. The program denies
    service if it finds a rule in the hosts.deny file that applies to the host.


    The entries in the /etc/hosts.deny file follow the same format as those in the
    /etc/hosts.allow file. They are in the form of a server:IP address format, in
    which server refers to the name of the program providing a specific Internet service
    and IP address identifies the host allowed to use that service.'
  merge: -1
  pgno: 205
- img_proc: true
  md: '# Session 14—Networking in Linux


    Assuming you already set up entries in the /etc/hosts.allow file to allow access
    to specific hosts, you can place the following line in /etc/hosts.deny to deny
    all other hosts access to any service on your system:


    ALL:ALL


