- img_proc: true
  md: 'load after booting Linux. In Red Hat, you can configure the sound card by running
    the /usr/sbin/sndconfig utility. This is a text-mode-configuration program, so
    you should run it from a text console by the following procedure:


    +   1. From the graphics screen, press Ctrl+Alt+F1. This brings you to a text
    virtual terminal that displays a login prompt. Log in as root.

    2. Type /usr/sbin/sndconfig. A message informs you that the utility will probe
    for sound cards. Press Enter to continue with the probing.

    3. The utility displays the result of probing for sound cards. Press Enter to
    continue the configuration.

    4. The utility displays one or more dialog boxes that indicate existing configuration
    files will be replaced. Press Enter to continue each step.

    5. A dialog box informs you that sndconfig will play a sound sample. Press Enter.

    6. If all goes well, you will hear sound. A dialog box asks you if you hear sound.
    If you hear sound, press Enter to select Yes. Otherwise, press Tab to select No,
    and then press Enter.

    7. If you select No, sndconfig shows a dialog box from which you may select the
    interrupt request number (IRQ), I/o port addresses, and direct memory access (DMA)
    channels.

    8. The utility plays a MIDI Musical Instrument Digital Interface sound sample.
    You should now hear the MIDI sound sample. You can go through and confirm this
    part as well.


    > You can play audio CDs and other sound files even if you cannot hear the MIDI
    sample play.


    ![](img/448aa2bd6846782b632c764b035753bc_257_0.png)


    +   9. After you exit sndconfig, type exit to log out. Then press Ctrl+Alt+F7
    to return to the graphical user interface.


    Once you configure the sound card for Red Hat Linux, you can play audio CDs and
    other sound files.

    The Caldera and SuSe distributions also have programs for configuring sound cards.
    In Caldera, you need to run the COAS utility and select the Configure Sound Card
    option. In SuSe, you need to start the YaST2 program and choose the Configure
    Sound Card option. Both of these utilities probe for a sound card and attempt
    to configure it. You are then offered the opportunity to test the configuration.
    If the configuration is correct, you hear a sample sound being played.'
