  md: "# Scheduling One Time Jobs\n\nYou can use the at command to schedule the execution\
    \ of one or more commands.\nThe at daemon—a program designed to process jobs submitted\
    \ using at —\nexecutes the commands at the specified time and mails the output\
    \ to you. The follow-\ning configuration files control which users can use the\
    \ at command to schedule tasks:\n\n+   - /etc/at.allow contains the names of users\
    \ who may use the at command\nto submit jobs.\n- /etc/at.deny contains the names\
    \ of users not allowed to use the at command\n to submit jobs.\n\nIf these files\
    \ are not present or if there is an empty /etc/at.deny file, any user\nsubmit\
    \ jobs by using the at command. The default in Linux is an empty\n/etc/at.deny\
    \ file, so anyone can use the at command. If you do not want\nusers to use it,\
    \ simply list user names in the /etc/at.deny file.\n\n# Submitting a time job\n\
    \nIn order to schedule a one time job for execution, follow these steps:\n\n+\
    \   1. Run the at command along with the date or time when you want your\ncommands\
    \ to execute. When you press Enter, the at> prompt appears as\nfollows:\n\n```\n\
    at 21:30\nat>\n```\n\nThis is the simplest way to indicate the time you want to\
    \ execute one\nmore commands — simply specify the time in a 24-hour format. In\
    \ this\ncase, you want to execute the commands at 9:30 p.m. tonight (or tom-\n\
    row, if it's already past 9:30 p.m.). You can, however, execute the\ntime in many\
    \ different ways (see Table 25-1 for examples).\n\n+   2. At the at> prompt, type\
    \ the commands you want to execute as you\ntype them at the shell prompt. After\
    \ each command, press Enter,\nand continue with the next command. When you finish\
    \ entering the\ncommands you want to execute, press Ctrl+D to end this step. Here\
    \ is an\nexample showing a single command:\n\n```\nat ps\nat <EOT>\nwarning: commands\
    \ will be executed using /bin/sh\njob 2 at 2000-05-15 21:30\n```"
  merge: -1
