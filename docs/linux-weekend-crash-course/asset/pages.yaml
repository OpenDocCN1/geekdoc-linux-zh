    # Configuring Samba


    To set up the Windows file and print-sharing services, you have to provide a configuration
    file named /etc/samba/smb.conf. The configuration file is a text file that looks
    like a Microsoft Windows 3.1 INI file.


    Like the Windows INI files, the /etc/samba/smb.conf file consists of sections
    with a list of parameters in each section. Each section of the smb.conf file begins
    with the name of the section in brackets. The section continues until the next
    begins or until the file ends.


    Each line in a section specifies the value of a parameter by using this syntax:


    ```

    name = value

    ```


    As in Windows INI files, comment lines begin with a semicolon (;). In the /etc/samba/smb.conf
    file, comments may also begin with a hash mark or a number sign (#).'
