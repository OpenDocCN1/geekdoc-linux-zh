  md: '# SESSION 15


    # Setting up a Workgroup Server


    # Session Checklist


    +   - Sharing files with NFS

    - Setting up your Linux PC as a Windows server with Samba


    30 Min. To Go


    low-end Pentium PC (or even a 486) configured with Red Hat Linux (from this book''s
    companion CD-ROMs) makes a very capable workgroup or office server. A workgroup
    is a small local area network (LAN) of perhaps a dozen or more PCs. You can configure
    the Linux PC to be the file and print server and the other PCs to be the clients.
    The client PCs can run Windows instead of Linux. This session introduces you to
    the Samba package, which comes with Linux and provides everything you need to
    set up your Linux PC as a server in a Windows network. However, first you learn
    about file sharing through Network File System (NFS), which provides another way
    of sharing files.


