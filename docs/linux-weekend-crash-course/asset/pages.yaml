  md: '# Understanding Internet Services


    The term Internet service refers to a number of network applications that employ
    a client/server architecture to perform specific tasks. (In the client/server
    architecture, two separate programs — a server that provides information and one
    or more clients that request information — implement a service.)


    Many services are specifically designed to deliver information from one system
    to another. The information may be in the form of mail messages, news items, or
    data files. As a user, you can access these common Internet services from a typical
    host:


    +   * Electronic mail (e-mail). From an Internet host, you can send e-mail to
    any other user on the Internet by using addresses such as president@whitehouse.gov.


    +   * World Web. You can use a Web browser to download and view Web pages using
    a Uniform Resource Locator (URL) address such as http://www.whitehouse.gov. The
    Web pages are usually documented in Hypertext Markup Language (HTML).


    +   * Newsgroups. You can read newsgroups and post news items to newsgroups by
    using names such as comp.linux.networking or comp.os.linux.setup.


    +   * Information retrieval. You can search for information by using tools such
    as the World Web browser. You can also download files by File Transfer Protocol
    (FTP). Reciprocally, users on other systems can also download files from your
    system — typically through a feature known as anonymous FTP.


    +   * Remote access. You can use TELNET to log in to another computer (the remote
    computer) on the Internet, assuming you have a user name and password to access
    the remote computer.


    All Internet services rely on client and server software. For example, an e-mail
    server takes care of transferring mail from one system to another while you read
    e-mail by using e-mail client software. Similarly, you use a Web browser client
    to download and view Web from a Web server.


    The clients and servers that implement services employ TCP/IP protocols to communicate
    with one another. You''re already familiar with the IP address that identifies
    a host in a TCP/IP network. The IP address alone, cannot sufficiently distinguish
    among many services running on the same system. The concept of a port number (or,
    simply, port) is used to enable various Internet servers to'
  merge: -1
  pgno: 185
- img_proc: true
  md: '# Session 13—Setting Up Internet Services


    communicate with clients. The port is not a physical entity — it''s simply a number
    between 1 and 65,535 that uniquely identifies each end point of a TCP/IP communication
    link between two processes (typically, a server and a client).


    All-known Internet services have preassigned port numbers. For example, here are
    some commonly used Internet protocols and their assigned port numbers:


    +   * FTP (File Transfer Protocol) allows transfer of files among computers on
    the Internet. FTP uses two ports — data is transferred on port 20, while control
    information is exchanged on port 21. FTP is the underlying protocol for file transfers.


    +   * HTTP (Hypertext Transfer Protocol) is a recent protocol for sending HTML
    documents from one system to another. HTTP is the underlying protocol of the Web.
    By default, the server and client communicate on port 80.


    +   * SMTP (Simple Mail Transfer Protocol) exchanges e-mail messages among systems.
    SMTP uses port 25 for information exchange. SMTP is the underlying protocol for
    the e-mail service.


    +   * NNTP (Network News Transfer Protocol) distributes articles in a store-and-forward
    fashion across the Internet. NNTP uses port 119. NNTP is the underlying protocol
    for the newsgroups service.


    +   * TELNET enables a user on one system to log into another system on the Internet
    (The user must provide a valid user ID and password to log into the remote system
    successfully.) TELNET uses port 23 by default. However, the TELNET client can
    connect to any specified port. TELNET is the underlying protocol for remote access.


    +   * NFS (Network File System) shares files among computers. NFS uses Sun''s
    Remote Procedure Call (RPC) facility, which exchanges information through port
    111.


    A text configuration file — /etc/services — stores the association between an
    Internet service and a port number (as well as the underlying data protocols).
    To see the contents of this file, use the more command as follows:

    more /etc/services


    The following is a small subset of entries in the /etc/services file of a system:


    ```

    ftp-data      20/tcp

    ftp           21/tcp          fspd

    fsp           21/udp

    ssh           22/tcp          # SSH Remote Login Protocol

    ssh           22/udp          # SSH Remote Login Protocol

    ```


    ![](img/448aa2bd6846782b632c764b035753bc_186_0.png)'
