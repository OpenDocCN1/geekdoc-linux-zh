  md: '# Session 19—Multimedia Applications


    GIMP starts and displays a window containing information about how to complete
    a personal installation. The message informs you that a personal installation
    involves creating a directory called .gimp-1.1 in your home directory and placing
    a number of files in that directory. This directory essentially holds information
    about changes to user preferences you might make to the GIMP. Go ahead and click
    the Continue button at the bottom of the window. The GIMP creates the necessary
    directories, copies some files to those directories, and guides you through a
    series of dialog boxes to complete the installation.


    After the installation is complete, click the Continue button. From now on, you
    don''t see these two installation windows; you have to deal with them only when
    you run the GIMP for the first time.


    GIMP then loads any plug-ins — external modules that enhance its functionality.
    A startup window displays messages about each plug-in as it loads.

    After finishing the startup, the GIMP displays a tip of the day in a window. You
    can browse the tips and then click the Close button to close the tip window. At
    the same time it displays the tips window, the GIMP displays the toolbox (as shown
    in Figure 19-2).


    ![](img/448aa2bd6846782b632c764b035753bc_260_0.png)


