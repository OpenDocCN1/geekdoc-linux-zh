- img_proc: true
  md: '# Table 21-1 Continued


    | Action | Description |

    | --- | --- |

    | Initdefault | Starts the system at this run level after it boots. The process
    field is ignored for this action. |

    | Sysinit | Executes the process as the system boots, before any entries in boot
    or bootwait actions (the runlevels field is ignored). |

    | Powerwait | Executes the process when init receives the SIGPWR signal indicating
    something is wrong with the power. Then init waits until the process exits |

    | Powerfail | Similar to powerwait except that init does not wait for the process
    to exit. |

    | Powerokwait | Executes the process when init receives the SIGPWR signal and
    the /etc/powerstatus file contains the word OK (indicating the power is on). |

    | Ctrlldelt | Executes the process when init receives the SIGINT signal, which
    occurs when you press Ctrl+Alt+Del. Typically, the process field should specify
    the /sbin/shutdown command and the -r to reboot the PC. |

    | Kbdrequest | Executes the process when init receives a signal from the keyboard
    driver that a special key combination has been pressed. The key combination should
    be mapped to KeyboardSignal in the keymap file. |


    The process field is typically specified in terms of a shell script, which in
    turn, can start several processes. For example, the 15 entry, is specified as
    follows:

    `15:5:wait:/etc/rc.d/rc 5`


    This entry specifies that init should execute the file /etc/rc.d/rc with 5 as
    an argument. If you look at the file /etc/rc.d/rc you notice it is a shell script
    file. You can study the file /etc/rc.d/rc to see how it starts various processes
    for run levels 1 through 5.


    Getting back to the graphical login screen, the last line of the /etc/initabb
    file, which follows, starts the graphical login process.


    ```

    x:5:respawn:/etc/X11/prefdm -nodaemon

    ```'
