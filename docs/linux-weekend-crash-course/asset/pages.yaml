    190


    which performs this task. All you have to do is select the DOS/Windows Connectivity
    package group during installation. Other distributions also offer the opportunity
    to install Samba during their installation.


    After you install and configure Samba on your Linux system, client PCs running
    Windows 95/98/NT/2000 can access disks and printers on the Linux PC by using the
    Server Block (SMB) protocol, which is the underlying protocol in Windows file
    and print sharing.


    ![](img/448aa2bd6846782b632c764b035753bc_213_0.png)


    With the Samba package installed, you can make your Linux PC a Windows client.
    This means the Linux PC can access the disks and printer a Windows server manages.
    The Samba software package has these major components:


    +   - smbd: the SMB server, which accepts connections from Windows clients and
    provide file and print sharing services

    - bind: the NetBIOS name server, which uses clients to look up servers (NetBIOS
    stands for Network Basic Input/Output System — an interface that uses applications
    to communicate with network transports such as TCP/IP)

    - /etc/samba/smb.conf: the Samba file that the SMB server uses

    - testpam: a program that ensures the Samba configuration file is correct

    - smclient: the Windows client, which runs on Linux and allows Linux to access
    the files and printer on any Windows server

    - smprint: a script, that enables printing on a printer on an SMB server

    - smadduser: a program that adds users to the SMB password file

    - smpasswd: a program that changes the password for an SMB user

    - smbstatus: a command that lists the current SMB connections for the local host


    The following sections describe how to install Samba from the companion CD-ROMs.
    They also discuss the process of setting up a printer on the Linux PC through
    Windows.


