  md: '# Activating Screen Savers


    By default, your Linux system uses a randomly selected screen saver. Whenever
    you do nothing for some time (usually 20 minutes), the screen saver comes on.
    The screen saver can also act as a screen-locking program — you must type your
    password to get back to the graphical desktop.


    # Setting up a screen saver in GNOME


    To select and try out a screen saver from the GNOME desktop, start the GNOME Control
    Center by clicking the toolbox icon on the GNOME panel. Then select Desktop from
    the tree menu in the Control Center. A dialog box, from which you can select a
    screen saver, appears in the Control Center''s work-space. The minscreen on the
    upper-right corner of the dialog box shows how the selected screen saver looks,
    as shown in Figure 18-1.


    ![](img/448aa2bd6846782b632c764b035753bc_249_0.png)


    Figure 18-1


    Selecting and previewing a screen saver in the GNOME Control Center


    From the dialog box shown in Figure 18-1, you can also select several other screen-saver
    settings. For example, you can set the number of minutes of inactivity'
  merge: -1
  pgno: 249
- img_proc: true
  md: '# Session 18—Screen Savers and Playing Games


    after which the screen saver comes on. If you click the Require Password check
    box and enable it, the screen saver locks the screen and forces you to enter your
    password before you can return to the desktop.


    The scroll bar labeled Priority enables you to specify the priority of the screen
    saver program. You should leave it at the default setting (which is midway between
    Low and Normal) or make it; this ensures that other processes have higher priority.
    After all, just because there is no mouse or keyboard activity does not mean your
    Linux system is idle. You may be compiling a huge program when the screen saver
    activates. In case, you don''t want the screen saver to use too much of the processor''s
    time.


    The check box labeled Use power management applies if your PC supports power management
    features. If you check this box, the screen saver puts the monitor in a “sleep”
    mode that draws less power than normal operation.


    # Setting up a screen saver in KDE


    If you use KDE desktop, you can select and test screen savers from the KDE Control
    Center. Start it by clicking the monitor and circuit board icon on the KDE panel
    or selecting KDE Control Center. Then select Look & Feel > Screensaver from the
    tree menu in the KDE Control Center. The Screensaver, from which you can select
    and preview screen savers (as shown in Figure 18-2), appears in the Control Center''s
    workspace.


    Each screen saver has its own setup. To set up the selected screen saver, click
    the Setup button on the KDE Control Center''s Screensaver tab. This brings up
    screen saver''s Setup dialog box, from which you can set that screen saver''s
    configurable parameters.


    You can easily test a screen saver from the KDE Panel''s Screensaver tab. Simply
    click the Test button that appears under the list of screen savers. This causes
    the screen saver to activate the full. You can return to the desktop by pressing
    a key or moving (or clicking) the mouse. The Test button makes it really easy
    to test the KDE savers.


    The KDE Control Center tab also enables you to set other parameters that control
    the screen saver. Specifically, you can set the number of minutes of inactivity
    after which the screen saver should start in the Wait for box. You can also click
    the check box labeled Required password to make the screen saver require a password
    before returning to the desktop. Additionally, you can set the priority of the
    screen saver-process.


    ![](img/448aa2bd6846782b632c764b035753bc_250_0.png)'
