    # Checking Disk Performance and Disk Usage


    Linux comes with the /sbin/hdparm program you can use to check disk performance
    and usage. It controls IDE or ATAPI hard disks that are common on most PCs. One
    feature of the hdparm program is the -t option enables you to determine the rate
    at which data can be read from the disk into a buffer in memory.


    ```

    /sbin/hdparm -t /dev/hda

    ```


    For example, here''s the result of this command on your system:


    ```

    /dev/hda:

    Timing buffered disk reads: 64 MB in 15.18 sec = 4.22 MB/sec

    ```


    As you can see, the command requires the IDE drive''s device name (/dev/hda) as
    an argument. If you have an IDE disk, you can try this command to see how fast
    data can be read from your system''s disk drive.


    To display the space available in the mounted filesystem, use the df command.
    If you want a more human-readable output from, type df -h to see the following
    output:


    | Filesystem Size Used Avail Use% Mounted on |

    | /dev/hda2 1.9G 765M 59% / |

    | /dev/hda1 2.0G 1.86 256M 88% /desc |


    As this example shows, the -h option causes the df command to show the sizes in
    gigabytes (G). If you want to see the output in megabytes (M), use the -m option.


    To check the disk space specific directories, employ the du command. You can specify
    the output in kilobytes (k) or the -m option to view the output in megabytes (M).
    Typing du -h /var/log, provides the following example:


    ```

    12k /var/log/httpd

    4.0k /var/log/news/OLD

    8.0k /var/log/news

    ```'
