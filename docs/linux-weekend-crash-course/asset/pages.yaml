  md: '38


    Friday Evening


    The root user is the super user in Linux. Because the super user can do anything

    in the system, you should assign a password you can remember — but that others

    cannot guess easily. Typically, make the password at least eight characters long,

    include a mix of letters and numbers, and (for good measure) throw in some spe-cial
    characters such as + or *. Remember the password is also sensitive.


    Type the password on the first line and then re-enter the password on the next
    line. Each character in the password appears as an asterisk (*) on the screen.
    Both entries must match before the installation program accepts the password.
    The installation program displays a message when it accepts the root password.
    Passwords should be at least six characters in length and a combination of numbers
    and letters. Do not use proper names or words from a dictionary. After you type
    the root password twice, you might also want to add one or more accounts.


    You should add a user account, even if you are the only one using the PC. If you
    log in as root, it is very easy to make a mistake and cause irreparable damage
    to the system because root has free access to the system. By logging in as a user,
    you are ensuring that you can''t damage the system by mistake. To add a user account,
    fill in the Account Name, Password, and Full Name fields and then click the Add
    button. The new account information then appears in the table underneath the Add
    button. You do not have to add all the accounts at this time. Later, you can use
    the Linuxconf tool (which comes with Red Hat) to add more user accounts.


    You must enter the root password before you can proceed with the rest of the installation.
    After you do so and add any other user accounts you need, click the Next button
    to continue with the installation.


    ![](img/448aa2bd6846782b632c764b035753bc_61_0.png)


    # Configure password authentication


    The installation program displays a screen from which you can configure the password
    authentication options. There are several options you can enable or disable. Of
    the first two you are already selected:


    +   - Enable MD5 passwords: Select this option to enable users to use long passwords
    up to 256 characters instead of the standard password that can be, at most, eight
    characters long. Note that MD5 refers to Message Digest 5, an algorithm developed
    by RSA, Inc. to compute the digest of the entire data of a message. Essentially,
    MD5 reduces a message'
  merge: -1
