  md: '# Session 4—Running Linux for the First Time


    # What Is KDE?


    KDE stands for the K Desktop Environment. The KDE project started in October 1996
    with the intent to develop a common GUI for UNIX systems that use the X Window
    System. The first beta version of KDE was released a year later in October 1997,
    and KDE version 1.0 was released in July 1998.


    From the user''s perspective, KDE provides a graphical desktop environment that
    includes a window manager (kwm); a file manager (kfm); a panel (kpanel) for starting
    applications; a help system; configuration tools; and many applications, including
    an image viewer, PostScript viewer, and news programs.


    From the developer''s perspective, KDE has class libraries and object models for
    easy application development in C++. KDE itself is a large development project.


    After you select KDE as the GUI for the session and login, you see an initial
    KDE desktop similar to the one shown in Figure 4-6.


    KDE is easy to use and shares many similarities with the Windows 95/98/NT/2000
    GUI. You can start applications from a menu similar to the Start menu in Windows.
    KDE also allows you to place folders and applications directly on the desktop.


    The KDE panel appearing along the bottom edge of the screen starts applications.
    The left and right ends of the panel show outward-pointing arrows. You can click
    these arrows to hide the panel and make more room on the desktop for applications.
    When the panel is hidden, it shows a small bar with an arrow. To view the entire
    panel again, click that, and the panel slides out.


    The KDE desktop also includes a menu bar along the top of the desktop. From the
    pull-down menus on this menu bar, you can perform a number of tasks, such as log
    out, configure the desktop, and get help. You can perform all of these tasks through
    the K button on the KDE panel as well.


    ![](img/448aa2bd6846782b632c764b035753bc_80_0.png)'
