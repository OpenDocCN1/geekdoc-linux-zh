    # Upgrading RPMs


    When you use the rpm -U to upgrade an RPM, you must provide the name of the RPM
    file that contains the new software. For example, suppose I have version 4.72
    of Netscape Communicator installed on my system, I want to upgrade to version
    4.74. I download the RPM file netscape-communicator-4.74-0.6.2.1386 from Red Hat''s
    FTP server (ftp://ftp.redhat.com/pub/redhat/updates/) or from one of the mirror
    sites listed at http://www.redhat.com/. Then I use the following command:


    ```

    rpm -U netscape-communicator-4.74-0.6.2.1386

    ```


    The rpm performs the upgrade by first removing the former version of the Netscape
    Communicator package and installing the new RPM.


    Whenever possible, you should upgrade (rather than remove) the former package
    and install the new version. Upgrading automatically saves the former configuration
    files, which saves you the hassle of configuring the software after a fresh installation.


    When you upgrade the kernel and the kernel module packages that contain a-run
    Linux kernel, do not use the rpm -U command. Instead, install it with the rpm
    -i command to ensure that you not overwrite files the current kernel is using.


