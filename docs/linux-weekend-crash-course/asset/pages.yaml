  md: '# SESSION


    ![](img/448aa2bd6846782b632c764b035753bc_90_0.png)


    # Configuring the X Window System


    # Session Checklist


    +   - Setting up the X Window System

    - Running and controlling the X Window System


    > 30 Min.

    To Go


    This morning''s sessions focus on various system administration tasks, such as
    configuring X; learning the Linux boot sequence; installing new software packages
    from RPM and tar files; building a new kernel; scheduling jobs to run at specific
    times and performing system backups. This session shows you the steps involved
    in configuring the X Window System, or X for short. It''s important to learn how
    to configure X because graphical desktops such as GNOME and KDE require X to work.


    # Setting Up the X Window System


    The term X Window System, or X for short, is loosely applied to several components
    that facilitate window-based graphics output (or a graphical interface) on a variety
    of bitmap displays. A bitmap display has two distinct components: a video'
  merge: -1
  pgno: 90
- img_proc: true
  md: '# 68 Saturday Morning


    monitor on which the graphics output appears and a video card (or graphics card)
    — either a plug-in card or some circuitry built into the system''s motherboard
    — causes the output to appear on the monitor.


    The Window System for Linux comes from the XFree86 project — a cooperative project
    of programmers who bring X to the PC. (You can access the XFree86 home page at
    http://www.xfree86.org/) As a result, the Linux version of X is called XFree86.


    ![](img/448aa2bd6846782b632c764b035753bc_91_0.png)


    # Understanding the X


    At the heart of X is the X server — a process (computer program) running on a
    computer that is a mapped display, a keyboard, and a mouse. Applications (X clients)
    that need to display output do so by communicating with the X server via one of
    several possible interprocess communication mechanisms.


    When you run X on your system, the X server runs on your computer and controls
    the monitor, keyboard, and mouse. The server responds to commands X clients send
    to open windows and draw in those windows. The clients may run locally or on remote
    systems.


    The X server configures the display (number of colors, resolution in terms of
    pixels horizontally and vertically), mouse and keyboard based on information stored
    in a configuration file. Linux comes with two versions of XFree86 — 3.3.6 and
    4.0.1. Depending on your video card, the configuration selects an X from one of
    the versions of XFree86. Each version has a different configuration. For XFree86
    3.3.6, the configuration file is /etc/X11/XFree86Config. For XFree86 4.0.1, the
    configuration file is /etc/XFree86Config-4.


    Configuring X requires you to prepare the configuration file. The configuration
    file contains information about your video card, monitor, keyboard, and mouse.
    Red Hat Linux comes with a utility program called x86config (same name as the
    configuration file, but in lowercase) that enables you to create the XFree86 working
    configuration file.


    You don''t need to create the X configuration file with xf86config program if
    you install Red Hat Linux (following the instructions outlined in Sessions 1 through
    9) the installation program automatically detects your system''s video chipset
    and enables you to configure X through a number of dialog boxes. Additionally,
    Session 4 shows you to run the Xconfigurator utility to create the X configuration
    file.


    ![](img/448aa2bd6846782b632c764b035753bc_91_1.png)'
  merge: -1
  pgno: 91
- img_proc: true
  md: '# Session 5—Configuring the X Window System


    This session walks you through the X configuration process using xf86config so
    that you can see the configuration options in detail and understand the format
    and purpose of various items stored in the configuration file. In particular,
    when you configure X with xf86config, you see the list of over 600 video cards
    the latest version of Free86 supports. If X is not configured correctly during
    Linux installation, you can select your card from this list and create a working
    X configuration file.


    # Using the xf86config program


    The xf86config program asks you questions. You need to have some information about
    your PC video card and monitor to answer these questions.


    To run xf86config, log in as root and type xf86config at the shell command prompt.
    The xf86config program displays a screen of text with some helpful information.
    Press Enter to continue.


    The xf86config program asks you to specify a mouse protocol that determines how
    the X server communicates with the mouse. The program shows you list of mouse
    types. Type the number that corresponds to your mouse type; then press Enter.


    The xf86config program asks you the following:


    > Please answer the following question with either ''y'' or ''n''.

    Do you want to enable EmulateButtons?


    If your mouse has two buttons, you enable EmulateButtons. Enter y. if you enable
    EmulateButtons, you can simulate a middle click by pressing both buttons simultaneously.
    Many X applications assume that the mouse has three buttons, so this feature comes
    handy in the PC world, where a mouse has two buttons.


    Next, you need to specify the full device name for the mouse. For Red Hat Linux
    installation, you configure the mouse, and the installation program creates a
    link between your mouse device and the standard name /dev/mouse. Therefore, you
    can press Enter.


    The xf86config program displays a list of keyboard types and prompts you for the
    one that matches your keyboard. Enter the number from the list. If none of the
    types match, you can always select 1, which represents Generic 101-key keyboard.


    ![](img/448aa2bd6846782b632c764b035753bc_92_0.png)


    ![](img/448aa2bd6846782b632c764b035753bc_92_1.png)'
  merge: -1
