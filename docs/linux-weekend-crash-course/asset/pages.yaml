    ![](img/448aa2bd6846782b632c764b035753bc_194_0.png)


    # Networking in Linux


    # Session Checklist


    +   - Setting up an Ethernet LAN

    - Configuring TCP/IP networking in Linux

    - Using TCP/IP diagnostic commands in Linux

    - Examining TCP/IP network configuration files


    Linux includes extensive built-in in networking capabilities. In particular, Linux
    supports TCP/IP (Transmission Control Protocol/Internet Protocol) networking-over
    several physical interfaces such as Ethernet cards, serial ports, and parallel
    ports. TCP/IP is a suite of networking protocols used for information exchange
    over the Internet. You do not need to know the details of TCP/IP to set up and
    use TCP/IP networking on your Linux system.) You typically use an Ethernet network
    for your local area network (LAN). TCP/IP networking over the serial port enables
    you to connect to other networks by dialing out over a modem.


    This session focuses on Ethernet LANs. You learn to set up, configure, and monitor
    an Ethernet TCP/IP network. Much of what you learn also applies to TCP/IP networking
    over a dial-up modem, which is covered in Session 12.


    30 Min.

    To Go'
