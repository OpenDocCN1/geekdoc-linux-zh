    # Mounting a DOS/Windows file system with the mount command


    As discussed in Session 9, you can use the mount command to mount a device on
    the Linux file system manually at a specified directory. That directory is referred
    as the mount point. You can use any directory as the mount point. However, if
    you mount a device on a directory containing files, you lose the ability to access
    the files in that directory until you unmount the device using the umcommand.
    Furthermore, you should always use an empty directory (such as /mnt/cdrom) as
    the mount point.


    If your DOS/Windows partition is the first partition on your IDE drive and you
    want to mount it to /dos, using the following mount command:


    ```

    mount -t vfat /dev/hd1 /dos

    ```


    The -t vfat part of the mount command specifies that the device you mount /dev/hd1
    has an MS-DOS file system. Linux has built-in support for MS-DOS files. Figure
    16-1 shows the effect of this mount command.


    Figure 16-1 also shows how directories in your DOS partition are mapped to the
    Linux file system. Once was the C:\DOS directory under DOS is now /dos/dos under
    Linux. Similarly, C:\WINDOWS is now /dos/windows. You probably see the pattern.
    To convert a DOS filename to Linux (for this specific case, when you mount the
    DOS partition on /dos), perform the following steps:


    +   1. Change the DOS names to lowercase.

    2. Change C:\ to /dos/.

    3. Change all backslashes (\ to slashes (/).'
