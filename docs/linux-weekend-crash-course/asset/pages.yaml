    # Using SWAT


    Beginning with version 2.0, Samba includes a utility called the Samba Web Administration
    Tool (SWAT). This tool makes setting up Samba very easy. SWAT allows you to use
    a Web browser as the interface to /etc/smb.conf and makes the necessary modifications
    to this file. A sample smb.conf file is created during installation that can be
    used for reference. Renaming this file is a good idea because you will be using
    SWAT to create a new smb.conf file, and it will overwrite the original file.


    Before you use SWAT, you need to change two files to enable it. The first file
    is /etc/services. This file is a list of internet services and their port numbers
    and protocols. You need to add the following line to /etc/services:


    +   - Swat 901/tcp


    Next, you need to add a line to /etc/inetd.conf. The inetd runs at system startup
    and listens for connections to specific ports. The inetd.conf file lists the programs
    that should run when the inetd daemon detects a request for one of the ports.
    You need to add the following line:


    ```

    swat      stream  tcp     nowait.400      root /usr/sbin/swat swat

    ```


    If you''re interested in more details about this line, see the inetd page.


