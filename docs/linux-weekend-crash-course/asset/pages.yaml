    # Exploring the /proc File System


    You can learn a great deal about your Linux system by consulting the contents
    of a special file system known as the /proc (also called the process file system)
    system. It can help you monitor a variety of information about your system. In
    fact, you can even change kernel parameters through the /proc file system and
    thereby modify your system''s behavior.


    The /proc file system is not a real directory on the disk, but a collection of
    data structures in memory (managed by the Linux kernel) that appears to the user
    as a set of directories and files.


    You can access the /proc file system and navigate it as you do any other directory,
    but you have to know the naming of various files to interpret the information.
    Typically, you can use the cat or more command to view the contents of a file
    in /proc; the file''s contents provide information about some aspect of the system.


    As any directory, you may want to start by looking at a detailed listing of /proc.
    To do so, use -ls /proc. In the output, the first set of directories (indicated
    by the letter d at the beginning of the line) processes currently running on your
    system. Each directory corresponds to a process with process ID (a number) as
    its name.


    You should also notice a very large file in the listing named /proc/kcore; that
    file represents the entire physical memory of your system. No physical file occupies
    that space on your hard disk, so do not try to remove the file to reclaim disk
    space.


    ![](img/448aa2bd6846782b632c764b035753bc_358_0.png)


