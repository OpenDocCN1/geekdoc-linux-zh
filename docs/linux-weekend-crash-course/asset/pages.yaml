    Using vi

    The editor is a full-screen editor that enables you to view a file several lines
    at a time. Most UNIX systems, including Linux, come with vi. Therefore, if you
    learn the basic features of vi, you can edit text files on almost any UNIX system.

    Like the editor, vi works with buffer. When vi edits a file, it reads the file
    into a buffer — a block of memory — and enables you to change the text in the
    buffer. vi also uses temporary files during editing, but the original file is
    not altered until you save the changes with a specific command.

    Before you start a full-screen text editor, you have to set the TERM environment
    variable to the terminal type (such as vt100 or xterm). For example, export TERM=vt100
    to set the terminal type to VT100. The vi editor uses the terminal type to control
    the terminal in full-screen mode.

    When you run X and a graphical interface such as GNOME or KDE, you can use vi
    in a terminal window. The terminal window''s terminal type is xterm. (To verify
    this, type echo $TERM at the command prompt.) When you start the terminal window,
    automatically sets the TERM environment variable to xterm. Therefore, you should
    be able to use vi in an xterm window without explicitly setting the TERM variable.

    To start the editor, use vi name followed by an optional filename. You can provide
    other arguments besides the filename. However, if the vi starts with a filename
    as the only argument, as shown here:

    vi /etc/hosts


