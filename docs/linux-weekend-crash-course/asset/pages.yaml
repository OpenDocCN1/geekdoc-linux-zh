    ```

    telnet 23/tcp

    # 24 - private

    smtp 25/tcp mail

    # 26 - unassigned 37/tcp timerver

    time 37/udp timerver

    lp 39/udp resource # resource location

    nameserver 42/tcp name # IEN 116

