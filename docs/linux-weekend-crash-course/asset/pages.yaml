    # Building and Installing the Kernel and Modules


    This section describes the next three phases of rebuilding a kernel: building
    the kernel, building and installing the modules, and setting up LILO to load the
    new kernel when you reboot the system.


    # Building the kernel


    You should initiate the next three tasks with a single command line (by entering
    multiple semicolon-separated commands on the same line) so you can type the line,
    press Enter, and take a break because building a kernel takes a while. a few minutes
    to an hour.


    Type the following on a single line to initiate the building process:


    ```

    make dep; make clean; makeImage

    ```


    The make dep command determines which files have changed and which need compiling
    again. The make clean command deletes old, unneeded files (such as copies of the
    kernel). Finally, make zImage creates the new kernel in a compressed file and
    places it in a certain directory.'
