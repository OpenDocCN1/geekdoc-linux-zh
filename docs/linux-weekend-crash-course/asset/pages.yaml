    30 Min. To Go


    A system administrator, you may need to run some programs automatically at regular
    intervals or to execute one or more commands at a specified time in the future.
    Your Linux system includes facilities that enable you to schedule jobs to run
    at any future date or time you want. You can set up the system to perform a task
    periodically or just once at any future date. Here are some typical tasks you
    can perform by scheduling jobs on your Linux system:


    +   * Back up the files in the middle of the night.

    * Download large files in the early morning when the system is not busy.

    * Send yourself messages as a reminder of meetings.

    * Analyze the system logs periodically and look for any abnormal activities.


    You can perform these tasks on a one time basis by using the at command or on
    a recurring basis by using the crontab facility of Linux. This session introduces
    you to these job-scheduling features.'
