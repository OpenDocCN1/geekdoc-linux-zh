  md: '# Understanding RPM filenames


    An RPM contains a number of files, but it appears as a single file on your Linux
    system. By convention, the RPM filenames have a specific structure. To see the
    names of RPM files on the companion CD-ROM, use the following steps:


    +   1. Place the CD-ROM in the CD-ROM drive, and mount it by using the following
    command (you must be logged in as root):


    mount /mnt/cdrom


    This mount works because an entry for this mount point is in the /etc/fstab file.

    2. Go to the directory in which the RPMs are located, and type the following:


    cd /mnt/cdrom/RedHat/RPMS


    ls *.rpm | more


    to view a listing such as this:

    ElectricFence-2.2.2-4.i386.rpm

    ImageMagick-5.2.2-5.i386.rpm

    ImageMagick-devel-5.2.2-5.i386.rpm

