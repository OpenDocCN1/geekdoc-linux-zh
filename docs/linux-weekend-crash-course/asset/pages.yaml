- img_proc: true
  md: 'If you are running a 10BaseT LAN, it is possible to connect computers together
    by using a special cable, called a crossover cable, between the Ethernet cards
    in each computer. This solution works for two computers, but for networks with
    more than two computers, this is not practical.


    When you use Red Hat Linux from this book''s companion CD-ROMs on a PC connected
    to an Ethernet LAN, the installation program should install the appropriate drivers
    for the card, provided the installation program successfully detects the Ethernet
    card. Otherwise, you can install Linux in expert mode, as described in Session
    4.


    Once installed, Linux should load the driver for the Ethernet card every time
    it boots. To verify that the Ethernet driver is loaded, use the dmesg command
    as follows:


    ```

    dmesg | grep eth0

    ```


    This command searches the boot messages for any line that contains the string
    eth0. (As discussed in this session, eth0 is the device name for the first Ethernet
    card in your Linux system). On my PC, I have a 3Com 3C503 Ethernet card installed.
    I got the following output when I type dmesg | grep eth0 on my:


    ```

    eth0: 3c503 at i/o 0x300, node 02 60 8c 8c c6 a9, using Internal* xsvr

    eth0: 3c503-P10, 16K8 RAM, using programmed I/O (REJUMPER FOR SHARED MEMORY).

    ```


    You should see something similar that shows the name of the Ethernet card and
    other relevant parameters. If the dmesg command does not show any Ethernet device,
    type grep eth0 /var/log/messages to look for the eth0 device name in the boot
    messages stored in the /var/log/messages file.


    # Configuring TCP/IP Networking


    Like almost else in Linux, TCP/IP setup is a matter of preparing a bunch of configuration
    files (text files that you can edit with any editor). These configuration files
    reside in the /etc directory and subdirectories of /etc. Most Linux distributions
    include a network configuration utility that you can use to configure the network.
    First, Refer to the documentation or help files for your specific distribution.
    First, you need to learn how to refer the network devices.'
