    # Playing Audio CDs


    You need a special application to play audio CDs in Linux. All Linux distributions
    come with several CD-player applications such as xplaycd, an X application that
    provides a graphical control panel for playing audio CDs. Additionally, both Gnome
    and KDE come with CD players.


    +   Before using any CD-player program, make sure you dismay any CD-ROM in the
    drive (use the umount /dev/cdrom command in Session 8) and place an audio CD in
    the drive.


    To try out the xplaycd program, type xplaycd in a terminal window from the Gnome
    or KDE desktop. The graphical user interface of xplaycd is intuitive. Try the
    buttons to see how they work. Click the Exit button to quit the program.


    If you are using the Gnome desktop, you can play audio CDs using the CD Player
    application. To launch the Gnome CD Player, select the Main Menu (Foot) �� Multimedia
    CD Player. Figure 19-1 shows this CD player playing a track from an audio CD.


    ![](img/448aa2bd6846782b632c764b035753bc_258_0.png)


    Figure 19-1

    Gnome CD Player playing a track from an audio CD


    As you can see, the Gnome CD Player displays the title of the CD and the name
    of the current track. The Gnome CD Player gets the song titles from CDBDB — a
    database on the Internet. This means you need an active Internet connection for
    the CD Player to download song information from the CD database. Once the CD Player
    downloads information about a particular CD, it caches that information in a local
    database for future use. The CD Player''s user interface is intuitive, and you
    can learn it easily. One nice feature is that you have the ability to select a
    track by title.'
