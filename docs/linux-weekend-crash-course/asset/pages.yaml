  md: '# Get Up to Speed on Linux — in a Weekend!


    2 CD-ROMS INCLUDE:


    RED HAT® LINUX 7.1

    Publisher''s Edition,

    featureing:


    +   - GNOME and KDE

    - Networking tools

    - Internet applications

    - GIMP and other graphics software

    - Emacs and other text editors

    - And much more


    ASSESSMENT TEST nSOFTWARE


    The big day is Monday. The day you get to show off what you know about Linux.
    The problem is, you''re not really up to speed. Maybe it''s been a while since
    you worked with Linux. Or you might just like a challenge. In any event, we''ve
    got a solution for you — Linux Weekend Crash Course. Open the book Friday and
    Sunday afternoon, after completing 30 fast, focused sessions, you''ll be able
    to jump right in and put Linux to work. It''s as simple as that.


    # The Curriculum


    FRIDAY

    Evening: 4 Sessions, 2 Hours

    - Getting to Install Linux

    - Partitioning the Hard Drive

    - Installing Linux

    - Running Linux for the First Time

    SATURDAY

    Morning: 6 Sessions, 3 Hours

    - Configuring the X Window System

    -Installing a Printer

    - Linux File and Directory Structure

    - The Command Shell

    - Linux Commands

    - Linux Text Editors


    SATURDAY

    Afternoon: 6 Sessions, 3 Hours

    - Configuring a Modem

    - Connecting to the Internet

    - Setting Up Input Services

    - Networking in Linux

    - Setting Up a Workgroup Server

    - Accessing Windows and DOS Files

    Evening: 4 Sessions, 2 Hours

    - Customizing the GNOME and KDE Desktops

    - Screen Savers and Playing Games

    - Multimedia Applications

    - GNOME and KDE Office Tools


    SUNDAY

    Morning: 6 Sessions, 3 Hours

    - Understanding How Linux Works

    - Building Software Packages from Source Files

    - Installing Software Packages

    - Building a New Kernel

    - Scheduling Jobs in Linux

    - Backing Up and Restoring Files

    Afternoon: 4 Sessions, 2 Hours

    - Performing System-Administration Tasks

    - Monitoring System Performance

    - Maintaining System Security

    - Getting Help from Available Resources


    System Requirements:

    Intel 486-compatible or higher with PC hard drive, CD-ROM drive, and 3½" floppy
    disks.

    See the About the CD-ROMS appendix for details and complete system requirements.


