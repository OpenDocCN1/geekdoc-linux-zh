  md: '# SESSION 28


    # Monitoring System Performance


    # Session Checklist


    +   - Using the top utility

    - Using the GNOME System Monitor

    - Using the vmstat utility

    - Checking disk performance and usage by using the hdparm program and other commands

    - Exploring the /proc file system


    A key system-administration task is keeping track of how well your Linux system
    perform. You can monitor the overall performance of your Linux systems by gathering
    information such as: central processing unit (CPU) usage, physical memory usage,
    virtual memory (swap space) usage, and hard disk usage. Linux comes with a number
    of utilities you can use to monitor one or more of these performance parameters.
    This session introduces you to a few of these utilities and shows you how to understand
    these utilities present.'
