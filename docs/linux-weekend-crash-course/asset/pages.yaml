  md: '# Session 14—Networking in Linux


    # Learning network-device names


    For most devices, Linux uses files in the /dev directory. The networking devices,
    however, have names defined internally in the kernel; no files for these devices
    exist in the /dev directory (or, for matter, in any directory). Following are
    the common network-device names in Linux:


    +   lo— the loopback device. This device efficiently handles network packets sent
    from your system to itself (when


    +   eth0— the first Ethernet card. If you have multiple Ethernet cards, they get
    device names eth1, eth2 and so on.


    +   ppp0— the first serial port configured for a point-to-point link to another
    computer, using Point-to-Point Protocol (PPP). If you have more serial ports configured
    for PPP networking, they are assigned device names ppp1, ppp2 and so on.


    +   s10— the first serial port configured for Serial Line Internet Protocol (SLIP)
    networking. SLIP establishes a point-to-point link to a TCP/IP network. If you
    use a second serial port for SLIP, it gets the device name s11.


    > You have a loopback device (lo) regardless of your network. It passes data from
    one process to another without having to go out to a network. In fact, the loopback
    device allows network applications to work as long as the communicating processes
    are on the same system.


    ![](img/448aa2bd6846782b632c764b035753bc_198_0.png)


    If you want to see the names of network devices installed on your system, log
    in root, and use the following command:


    ```

    cat /proc/net/dev

    ```


    This command shows the names of currently installed network devices, as well as
    statistics on the number of packets sent and received for a specific device.


    # Running Red Hat''s network configuration tool


    When you set up TCP/IP networking during Red Hat installation, the installation
    program prepares all appropriate configuration files by using the information
    you provide. However, Red Linux comes with the netcfg graphical network configuration
    tool you can use to add a new network interface or alter information'
  merge: -1
