    enable you to view message logs as the messages Linux kernel displays as your
    Red Hat Linux boots.


    To explore the Config, Control, and Status buttons, click each tab, and then click
    the buttons to see what happens. You should spend a few minutes exploring all
    three tabs in Linuxconf to get a feel for the types of system-administration and
    network-administration tasks you can perform with this.


    # REVIEW


    This session began with an overview of Linux system-administration and network-administration
    tasks. You then used Linuxconf to add one or more user accounts. Finally, you
    explored the tabs in Linuxconf to learn the types of system-administration and
    network-administration tasks you can perform by using Linuxconf.


