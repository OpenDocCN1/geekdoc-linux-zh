    # Ghostscript


    Ghostscript is an interpreter for previewing and printing Postscript documents.
    Ghostscript enables you to print Postscript documents on many non-Postscript devices.


    At its heart, Ghostscript is a nearly complete implementation of the Postscript
    language. Ghostscript includes the interpreter that processes Postscript input
    and generates output on an output device. A Ghostscript device can be a printer
    (or display screen), as well as an image-file format such as BMP or PCX.


    Ghostscript is distributed under the GNU GPL, as Aladdin Enterprises copyrights
    it and maintains it. Some Ghostscript documentation is installed in the /usr/doc
    directory. To change to the appropriate directory, cd /usr/doc/ghostscript*. (The
    exact directory name depends on the version of Ghostscript installed on your system).
    You can find the latest contact information in the README file in that directory.
    That directory also contains some other Ghostscript documentation. All of these
    documentation are text files you can view by using the more command.'
