- img_proc: true
  md: '# Session 26—Backing Up and Restoring Files


    If your tape can hold several gigabytes of data, you may want to write several
    tar archives — one after another — to the same tape. (Otherwise, much of the tape
    may be empty.) To do this, you do not want the tape device to rewind the tape
    after the program finishes. To help you with this, some Linux tape devices are
    non-rewinding devices. The non-rewinding SCSI tape device is called /dev/nst0.
    Use this device name if you want to write one archive after another on a tape.


    After each archive, the non-rewinding tape device writes an end-of-file (EOF)
    marker to separate one archive from the next. You can use the mt command to control
    the tape. Essentially, it moves from one marker to the next or rewinds the tape.
    For example, after you finish writing several archives to a tape by using the
    /dev/nst0 device name, you can use the following command to rewind the tape:


    ```

    mt -f /dev/nst0 rewind

    ```


    After rewinding the tape, you can use the following command to extract files from
    the first archive to the current disk directory:


    ```

    tar xvf /dev/nst0

    ```


    After that, you must move the EOF marker to the next archive. To do this, use
    the mt command:


    ```

    mt -f /dev/nst0 fsf 1

    ```


    This positions the tape at the beginning of the next archive. You can now use
    the tar xvf command to read this archive.


    > If you save multiple archives on a tape, you have to keep track of the archives
    yourself.


    ![](img/448aa2bd6846782b632c764b035753bc_338_0.png)


    # Performing incremental backups


    Suppose you backed up your system''s hard disk on a tape by using the tar command.
    Because such a backup can take quite some time, you do not want to repeat this
    task every night. Besides, only a small number of files may have changed during
    the day. You can use the find command to list those files that have changed in
    the past 24 hours, as follows:


    ```

    find -mtime -1 -type f -print

    ```'
  merge: -1
  pgno: 338
- img_proc: true
  md: '# 316 Sunday Morning


    This command prints a list of files that have changed within the last day. The
    -mtime -1 option means you want the files that have been modified modified within
    the last day. You can now combine the find command with the tar-command to back
    up only those files that have changed within the last day, as follows:


    ```

    tar cvf /dev/st0 `find / -mtime -1 -type f -print`

    ```


    When you place a comma between single back quotes, the shell executes that command
    and places the output at that point in the command line. The result is that the
    tar program saves only the changed files in the archive. Thus, you get an incremental
    backup includes files that have changed since the previous day.


    # Performing automated full and incremental backups


    In Session 25, you learned to use crontab to set up recurring jobs called cron—tasks
    the Linux system performs at regular intervals. Backing up your system is a good
    use of the crontab facility. Suppose your backup strategy is as:


    +   * Every Sunday morning at 1:15 a.m., you back up the entire disk on the tape.

    * On the other days of the week (Monday through Saturday), you perform an incremental
    backup at 3:10 a.m. by saving only those files that have changed during the past
    24 hours.


    To set up this automated backup schedule, log in as root, and type the following
    lines in a named backups. (This example assumes you use a SCSI tape drive).


    ```

    15 1 * * 0 tar zcvf /dev/st0 /

    10 3 * * 1-6 tar zcvf /dev/st0 `find / -mtime -1 -type f -print`

    ```


    Next, submit this job schedule by using the following crontab command:


    ```

    crontab backups

    ```


    Now you should be set for an automated backup. You only need to place a new tape
    in the tape drive every day. You should also label each tape appropriately.


    ![](img/448aa2bd6846782b632c764b035753bc_339_0.png)


    Done!'
