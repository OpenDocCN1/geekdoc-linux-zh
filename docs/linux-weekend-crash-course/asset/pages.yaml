  md: '# Preface


    Because of Linux''s increasing popularity, many computer users want to learn it
    quickly. If you work for an organization interested in Linux, you need to get
    up to speed do so is to install, configure, use, and manage Linux systems. The
    best way to do so is to install Linux and learn its commands and applications
    alike — is a well-organized set of sessions that teaches Linux over a weekend.
    What potential Linux aficionados—beginners to advanced alike need


    Linux® Weekend Crash Course™ is such a teaching guide. It provides 30 easy-to-use
    sessions, each a period of one hour, that gradually build up your Linux skills.
    Part of the Hungry Minds “Weekend Crash Course” series, starting with Red Hat
    Linux installation on Friday evening and ending with several system administration
    topics on Sunday afternoon — are designed for you to complete over a weekend.


    The crash course''s pace is fast. Each session starts with a “Session Checklist”
    — a short list of topics that you learn within the session hands-on. Each session
    ends with a “Quiz Yourself” section that enables you to test your skills by answering
    questions. For each major part, which corresponds with a time during the week,
    the book also includes Review Questions, which cover what is taught in the sessions
    within that part. You can try answering the Part Review Questions, and you can
    check your answers in Appendix A.


    This book includes CD-ROMs that contain the latest version of Red Hat Linux, which
    you can install by following the instructions in Sessions 1 through 3. You can
    use either this version of Red Hat Linux or one of the other widely used Linux
    distributions you may have installed on your system as you progress through the
    rest of the sessions in this book.'
  merge: -1
  pgno: 8
- img_proc: true
  md: '# What You Need to Get Started


    To start the sessions, you need a PC on which you can install Red Hat Linux. The
    minimum system requirements for the PC are Intel 486- or Pentium-compatible processor,
    32 MB RAM, 1 GB of disk space, 3.5-inch floppy drive, and a CD-ROM drive. You
    need a 3.5-inch floppy disk to create a boot disk during installation. For some
    of the other sessions, you need an Ethernet networking card, a modem, and Internet
    access. You also need a free weekend to go through all the sessions.


    # Organization of the Book


    Linux Weekend Crash Course has 30 sessions organized into six parts. It also has
    two appendices.


    +   **Part I: Friday Evening** guides you through the steps needed to install
    Red Hat Linux (Wait, the text says CD-ROMs re-reading) **Part I: Friday Evening**
    guides you through the steps needed to install Red Hat Linux from this book''s
    companion CD-ROMs. Assuming the installation program recognizes some of the hardware,
    you should be able to finish the installation in an hour or so.

    **Part II: Saturday Morning** focuses on trying to get Red Hat Linux quickly,
    exploring files and directories, learning Linux commands and text editors, and
    performing some basic system administration tasks.

    **Part III: Saturday Afternoon** shows you how to set up networking (assuming
    the PC has an Ethernet card) and how to connect the Linux PC to the Internet (dial-up
    PPP, by DSL and cable modem are briefly discussed as well). Some of the lessons
    show you how to use the Linux system in a networked environment as an Internet
    server (Web, e-mail) or as a Windows file server that Samba.

    **Part IV: Sunday Evening** teaches you how to use the GNOME and KDE desktops
    as well as some of the applications that come with Red Hat Linux.

    **Part V: Sunday Morning** introduces you to various system-administration tasks:
    configuring X; learning the Linux boot sequence; installing new software packages
    from RPM and tar files; building a new kernel; scheduling jobs to run at specific
    times; and performing backups.

    **Part VI: Sunday Afternoon** focuses on skills that a Linux system administrator
    should have. The afternoon starts with a lesson on using programming tools to
    compile and build a new software package. It covers system performance monitoring,
    security, and obtaining further help.

    **Appendix A: Answers to Part Reviews** provides answers to the Part Review Questions
    that appear after each of the six parts.'
  merge: -1
  pgno: 9
- img_proc: true
  md: '# Preface


    Appendix B: What''s on the CD-ROMs? describes the contents of the accompanying
    CD-ROMs.


    If you are a new user, you should start with Part I, which covers the installation
    of Red Hat Linux from the CD-ROMs. Then you can continue sequentially through
    the sessions. If you have already installed Linux, skip to Part II on Saturday
    morning.


    # Conventions Used in This Book


    Linux Weekend Crash Course uses a simple, notational style. All listings, filenames,
    function names, variable names, keywords, and Web addresses are typeset in monospace
    for ease of reading. The first occurrences of new terms and concepts are in italic.
    Text I direct you to type is in boldface and monospace type italic. Following
    the design of the Hungry Minds ‘Weekend Crash Course’ series, I use icons to help
    you pinpoint useful information quickly. Following is what I have in mind for
    the icons:


    +   Note interesting fact — something I thought you''d like to know.


    +   shortcuts or methods you can follow to make your job easier.


    +   potential pitfalls. With this icon, I’m telling you: “Watch out! This could
    hurt your system!”


    +   Cross-Reference points to other sessions in the book that discuss a specific
    topic — or to specific programs available on the CD-ROMs.'
  merge: -1
  pgno: 10
- img_proc: true
  md: '# Sidebars


    Occasionallyasional, I use sidebars to highlight interesting (but not critical)
    information. Sidebars explain concepts you may not have encountered before or
    give a little insight into a related topic. If you''re in a hurry, you can safely
    skip the sidebars. On the other hand, if you find yourself flipping through the
    book looking for interesting information, I encourage you to read the sidebars.


    Each session also contains four time-oriented icons that let you know how you
    are progressing:


    ![](img/448aa2bd6846782b632c764b035753bc_11_0.png)


    # Reach Out


    The publisher and I would like your feedback. Feel free to contact me directly
    at: naba@ieee.org'
  merge: -1
