  md: 'might expect, it has a lot more capabilities than the DOS command interpreter.
    The Linux command interpreter is referred to as a shell.


    The Linux shell is called bash, and its program is named /bin/bash (found in the
    /bin directory). When you open a terminal window from the GNOME or KDE desktop
    or log in at a text console, the shell prompts you for commands. When you type
    a command, the shell executes that command.


    In addition to the standard Linux commands, bash can execute any program stored
    in an executable file. bash can also execute a shell script, which is a text file
    that contains one or more commands.


    In the minutes ahead, you can try out various features of the bash shell, ranging
    from the general command syntax to the basics of shell programming. If you haven''t
    already done so, go ahead and open a terminal window so you can use the shell.


    # Using the Bash Shell


    A shell interprets what you type, it is important to know how the shell processes
    what you enter. All shell commands have this general format:


    ```

    command option1 option2 ... optionN

    ```


    A single line of command is commonly referred to as a command line. On a command
    line, you enter a command followed by one or more options (arguments) known as
    command-line options (or command-line arguments).


    One basic rule is that you have to use a space or a tab to separate the command
    from the options. You must also separate options with a space or a tab. If you
    want to use an option with embedded spaces, you have to put that option inside
    quotation marks. For example, to search for my name in the password file, I enter
    the following grep command (grep searches for text in files):


    ```

    grep Naba Barkarkati" /etc/passwd

    ```


    When grep prints the line with my name, it looks like this:


    ```

    naba:x:500:500:Naba Barkarkati:/home/naba:/bin/bash

    ```


    If you create a user account in your name, go ahead and type the grep command
    with your name as argument.


    > In the output from the grep command, you can see the name of the shell (/bin/bash)
    following the last colon (:).


