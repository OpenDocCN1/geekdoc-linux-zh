  md: '# Verifying RPMs


    You may not do this often, but if you suspect that a software package is not properly
    installed, use the rpm -V command to verify the package. For example, to verify
    the kernel package, type the following:


    ```

    rpm -V kernel

    ```


    This command causes rpm to compare size and other attributes of each file in the
    package against the original files. If everything verifies correctly, the rpm
    -V command does not print anything. If it detects any discrepancies, you see a
    report of the discrepancies. For example, I have modified the configuration files
    for the Apache Web server. Here is what I see when I verify the apache package
    by typing rpm -V apache:


    ```

    S.5....T c /etc/httpd/conf/httpd.conf

    ```


    In this case, the output from rpm -V shows that a configuration file has changed.
    Each line of this command''s output consists of three parts:


    +   - The line starts with eight characters; each character indicates the type
    of discrepancy found. For example, S means the size is different and T means the
    time of last modification is different. A period indicates that a specific attribute
    matches the original.


    +   - For configuration files, c appears next; otherwise, this field is blank,
    so you can tell whether a file is a configuration file. Typically, you don''t
    have to worry if a configuration file has changed because you made the changes
    yourself.


    +   - The last part of the line is the full pathname of the file. From this part,
    you can tell the exact location of the file.


    ![](img/448aa2bd6846782b632c764b035753bc_309_0.png)


    # REVIEW


