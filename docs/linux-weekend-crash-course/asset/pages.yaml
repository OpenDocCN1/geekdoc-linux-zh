  md: '# Canceling one time jobs and receiving the output


    If you want to cancel a job, use the atrm command to remove the job from the queue.
    When removing a job by using the atrm command, refer to the job by its number,
    as follows:


    ```

    atrm 3

    ```


    This deletes job number 3 scheduled for 3:00 a.m. August 16, 2000. When a job
    executes, the output is mailed to you. Type mail to read your mail and to view
    the output from your jobs.


    # Scheduling Recurring Jobs


    Although the at command is good for running commands at a specific time, it''s
    not useful for running a program automatically at repeated intervals. You have
    to use crontab to schedule such recurring jobs. You need to do this, for example,
    if you want to back up your files to tape at midnight every day.


    Schedule recurring jobs by placing job information in a file with a specific format
    and submitting this file with the crontab command. The cron daemon—checks the
    job information every minute and executes the recurring jobs at the specified
    times. Because the cron daemon processes recurring jobs, such jobs are also referred
    to as cron jobs.


    Any output from the job is mailed to the user who submits the job. (In the submitted
    job information file, you may specify a different recipient for the mailed output.)


    As with the cron, contains two files control can use crontab to schedule cron
    jobs:


    +   * /etc/cron.allow contains the names of users who may use the crontab command
    to submit jobs.

    * /etc/cron.deny contains names of users not allowed to use the crontab command
    to submit jobs.


    If the /etc/cron.allow exists, only users listed in this file can schedule cron
    jobs. If only the /etc/cron.deny file exists, users listed in this file cannot
    schedule cron jobs. If neither file exists, the default Linux setup enables any
    user to submit cron jobs.'
  merge: -1
  pgno: 327
- img_proc: true
  md: '# Submitting a cron job


    To submit a cron job, perform the following steps:


    +   1. Prepare a shell script (or an executable program in any programming language)
    that can perform the recurring task you want to perform. You can skip this step
    if you want to execute an existing program periodically.

    2. Prepare a text file with information about the times you want the shell script
    or program (from step 1) to execute. This is the file you submit using crontab.
    You can submit several recurring jobs with a standard format with at least six
    fields—the first five when the job runs, and the sixth and subsequent fields constitute
    the command to be run. For example, this line executes the myfile shell script
    in a user''s home directory at 5 minutes past midnight each day.


    ```

    5 0 * * * $HOME/myjob

    ```


    Table 25-2 shows the meaning of the first five fields. Also, an entry of the first
    five fields can be a single number, comma-separated list of numbers, a pair of
    numbers separated by a dash (indicating a range of numbers), or an asterisk. An
    asterisk (*) represents all possible values for that field.


    +   3. Submit the information to crontab by using the following command:

    crontab jobinfo


    In this case, the text file jobinfo (in the current directory) contains the job
    information.


    That''s it! You''re all set with the cron job. The cron should run at regular
    intervals (as specified in the job information file), and you should receive mail
    messages that contain the output of the job.


    # Verifying the cron job is scheduled


    To verify that the job is indeed scheduled, type the following command:


    ```

    crontab -l

    ```


    The output of the crontab -l command shows the cron jobs currently installed in
    your name.'
