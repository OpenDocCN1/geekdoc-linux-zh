  md: '16. GNOME Help Browser and KDE Help are two help viewers I can use to view
    online help information from the graphical desktops in Linux.


    17. I type what tr to read a one-line description of the tr command. To view the
    manual page: for the tr command, I type man tr.


    18. I can use the apropos command to search for other commands by using a keyword.


    19. Each HOWTO file contains information about some area of Linux, such as how
    to is connected to the Internet, I can access the HOWTO files by clicking the
    LDP icon on the GNOME desktop and then clicking the link to HOWTO documents. If
    my system is how to configure hardware in Linux or how to create a boot disk.


    20. I can visit Linux Web sites as http://www.linux.org/. I can access Linux newsgroups
    such as comp.os.linux.answers at the Deja.com Web site. I can subscribe to magazines
    such as Linux Journal and Linux Magazine to keep up with Linux news.'
