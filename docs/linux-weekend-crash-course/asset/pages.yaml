    entire file system on a SCSI tape drive, I type:


    ```

    tar cvf /dev/st0 /

    ```


    19. To back up several large files in the /home/share directory onto multiple
    floppies, I use the following command:


    ```

    tar cvm /dev/fd0 /home/share

    ```


    20. To store multiple archive on a single tape, I use a non-rewinding tape device
    with a command such tar cvf /dev/nst0 /home and use similar tar commands to create
    one archive after another. I can rewind the tape by using the following command:


    ```

    mt -f /dev/nst0 rewind

    ```


    I can skip over an archive with the following command:


    ```

    mt -f /dev/nst0 fsf 1

    ```


    # Sunday Afternoon Review Answers


    +   1. Linuxconf is an X Windows I can use to perform many system-administration
    tasks such as adding user accounts, mounting a CD-ROM drive, and configuring a
    dialup PPP connection. To start Linuxconf, I select Main Menu ⮕ Linuxconf from
    the GNOME desktop.


    +   2. I enter the login name, the user''s home directory, and a password.


    +   3. Linuxconf checks the password for words that can be easily guessed.


    +   4. I look for information such as CPU usage, physical memory usage and swap
    space usage, and hard disk usage to monitor the system''s performance.'
  merge: -1
  pgno: 401
- img_proc: true
  md: '# Answers to Part Reviews


    5. Linux includes tools such as the GNOME System Monitor, top, and vmstat to monitor
    system performance.


    6. The top tool is used to see a graphical representation of system performance.


    7. The "load average" is the average number of processes that have been ready
    to run for the past few minutes. Typically, system monitors load average over
    the past 1, 5, and 15 minutes.


    8. The vmstat 10 command-line displays 10-second averages and prints a total of
    5 lines of output. The first line of output from vmstat shows the averages since
    the last reboot.


    9. The /proc file system is not a real directory on the disk but a collection
    of data structures. The Linux kernel manages these data structures, and they appear
    to the user as a set of directories and files. The purpose of /proc is to allow
    users to access information about the Linux kernel and the processes currently
    running on the system.


    10. The security policy provides rules I can apply to secure the system.


    11. The security policy should address areas such as the following: how users
    are authenticated; what users can do; what data must be protected; what Internet
    services are allowed to run; and who is responsible for maintaining and auditing
    security.


    12. The general steps are to install all packages I need, create user accounts
    with strong passwords, enable only the necessary Internet services, and periodically
    check log files for signs of break-in attempts. I should also keep up with security
    news and install upgrades from Red Hat.


    13. Shadow passwords and the MD5 encryption are two ways in which passwords are
    more secure in Linux.


    14. To make a user prompted to change the password in 30 days, type change -M
    30 when logged in as root.


    15. The xinetd starts Internet services using the TCP wrapper program. As specified
    in the /etc/xinetd.conf file, the /usr/sbin/tcpd program starts other services
    as FTP and TELNET; before starting a service, the TCP wrapper consults the /etc/hosts.allow
    file to see if the host requesting service is allowed. If nothing is in /etc/hosts.allow
    about that host, the TCP wrapper checks the /etc/hosts.deny file to see if the
    service should be denied. If both are empty, the TCP wrapper allows the host access
    to the requested service. In this, the TCP wrapper program provides an access-control
    facility for Internet services xinetd.'
