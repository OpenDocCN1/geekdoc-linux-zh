  md: '# Session 28—Monitoring System Performance


    4. The fourth line shows how the physical memory is being used — the total amount
    of memory, how much is used, how much is free, how much is shared, and how much
    is allocated to buffers (for reading from disk, for instance).


    5. The fifth line shows how the virtual memory (or swap space) is being used —
    the total amount of swap space, how much is used, how much is free, and how much
    is cached.


    In top’s output screen (Figure 28-1), the table below the summary information
    lists about about the current processes, arranged in decreasing order of CPU usage.
    Type man top in a terminal window to learn the meanings of the column headings
    in the table displays.


    If the RSS field is drastically smaller than the SIZE field for a process, the
    process employs too little physical memory compared with what it needs. This results
    in a lot of swapping as the process runs. You can use the vmstat utility (which
    you try in this session) to find out how your system is swapping.


    ![](img/448aa2bd6846782b632c764b035753bc_354_0.png)


    # Using the GNOME System Monitor


    Like the text-mode utility, the GNOME System Monitor tool also enables you to
    view the system load in terms of the number of processes currently running, their
    memory usage, and the free disk space on your system. To run the tool, select
    Main Menu -> Programs -> Systems System Monitor. You can also start the tool by
    typing gnome top in a window. The tool starts and displays its output in the Processes
    of its main window, as shown in Figure 28-2.


    This output represents the output you see when you type in a text-mode console
    or in a terminal window. In fact, the column headings in what the top utility
    uses in its output. As the text-mode utility, the display keeps updating to reflect
    the current state of the system. You see the current processes in descending order
    of CPU usage.


    The GNOME System Monitor window has two tabs that display memory usage and free
    space on the file system. To view this information, click the appropriate tab.
    For example, to see how processes are using memory, click the Memory Usage tab.


    The bottom of the window shows the CPU usage summary, system up time (how long
    the system has been up and running), and load averages (the average number of
    processes ready to run in the last 1, 5, and 15 minutes).


    ![](img/448aa2bd6846782b632c764b035753bc_354_1.png)'
