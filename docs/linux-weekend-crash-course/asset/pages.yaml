    expires.


    | Minimum: | 0 |

    |---|---|

    | Maximum: | 99999 |

    | Warning: | 7 |

    | Inactive: | -1 |

    | Last Change: | Apr 30, 2000 |

    | Password Expires: | Never |

    | Password Inactive: | Never |

    | Account Expires: | Never |


    If you want to ensure that the password changes every 90 days, you can use the
    -M option to set the maximum number of days that the password stays valid. For
    example, make sure that user naba is prompted to change the password in 90 days,
    I log in as root and type the following command:


    ```

    chage -M 90 naba

    ```


    You can do this for each user account to ensure that all passwords expire and
    all users must pick new passwords.


    # Pluggable Authentication Modules


    In addition to improving the password file''s security by using the shadow words,
    Linux also improves the actual encryption of the passwords stored in the /etc/shadow
    file. Password encryption is now performed using the MD5 message-digest algorithm
    to convert the plain-text into a 128-bit fingerprint or digest. The MD5 algorithm,
    described in RFC1321 (http://www.faqs.org/rfcs/rfc1321.html), compresses a large
    file in a secure manner so you can digitally sign it through encryption with a
    private key. It also works well for password encryption.'
  merge: -1
  pgno: 368
- img_proc: true
  md: '# Sunday Afternoon


    Another advantage of MD5 over the older-style password encryption is that the
    older passwords were limited to a maximum of eight characters in length; new passwords
    (encrypted with MD5) can be longer. Longer passwords are harder to guess even
    if the /etc/shadow file falls into the wrong hands.


    A clue to the use of MD5 encryption in the /etc/shadow file is the increased length
    of the encrypted password and the increased length of $1, as in the second field
    of the following sample entry:


    ```

    root:$AAAAN$ynEU5hbZlbpy9cgGof1bf0t0:11077:99997:-1:134540356

    ```


    A Pluggable Authentication Module (PAM) performs a flexible method for authenticating
    users on Linux systems.

    Through settings in configuration files, you can change the authentication method
    on the fly without having to modify programs as login and password that verify
    a user''s identity.


    Linux uses MD5 extensively, and the configuration files are in the /etc/pam.d
    directory of your system. Check out the contents of this directory on your system.


    # Securing Internet services


    For an Internet-connected Linux system (or even one on a TCP/IP LAN), a significant
    threat is the possibility that someone will use one of many Internet services
    to gain access to your system. Each service — such as mail, Web, or FTP — requires
    running a server program that responds to client requests over the TCP/IP network.
    Some of these server programs have weaknesses that can allow an attacker to enter
    your system — maybe with root privileges. Luckily, Linux comes with facilities
    you can use to make Internet services more secure.


    Potential intruders can employ a port-scanning tool — to establish a TCP/IP connection
    at a port and look for a response — to check which Internet servers are running
    on your system. The intruder can potentially exploit any known weaknesses of one
    or more services to gain access to your system.


    # Linuxconf, COAS, YaSt2


    To avoid unnecessary entry points to your system, make sure you run only those
    Internet services you need. You can enable and disable services using Linuxconf
    for Red Hat, COAS for Caldera, and YaSt2 for SuSE, all graphical system administration
    utilities. If you have installed Red Hat from the companion CD-ROMs, you can follow
    the next steps to use Linuxconf. Log in as root and select Main Menu ⤊ System
    ⚙️ Linuxconf from the GNOME desktop. Then click the Control Panel button on the
    Control tab. In the next dialog box, click the'
