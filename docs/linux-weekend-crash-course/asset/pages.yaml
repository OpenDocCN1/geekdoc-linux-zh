- img_proc: true
  md: 'The x86config program then asks you for the country for which the keyboard
    should be configured. Again, you have to pick from a list displayed by the program.

    Next, x86config informs you that it needs two critical parameters of your monitor:


    +   - Horizontal synchronization frequency — the number of times per second the
    monitor can display a horizontal raster line, in kilohertz (kHz)

    - Vertical synchronization rate — the number of times per second the monitor can
    display the entire screen, in Hertz (Hz)


