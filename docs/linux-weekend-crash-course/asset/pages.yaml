  md: '# Specifying SCSI Controller Settings


    If you have a SCSI controller in your system, the Red Hat program loads a SCSI
    driver module for that controller. You have to identify the type of SCSI controller
    (such as Adapatec 1542 or Adapatec 2940). The installation program can attempt
    to determine the controller settings, such as the IRQ and I/O port address, by
    probing I/O port addresses. However, if the installation program fails to determine
    the SCSI controller settings, you have to specify these parameters — IRQ and I/O
    address — as options for the driver module. The exact formats of these options
    vary from one module to another. For example, the driver for Adapatec AHA 152x
    accepts the options in the following format:


    ```

    aha152x=IOPORT,IRQ,SCSI_ID,[Reconnect,Parity]

    ```


    WHERE IOPORT is the I/O port address, IRQ is the interrupt request number, and
    SCSI_ID is the SCSI controller. The last two items are optional. A typical module
    option for the aha152x module might be:


    ```

    aha152x=0x340.11.7

    ```


    If the installation is complete and you reboot the PC, you get a text login screen.
    In as root and type Xconfigurator to run a utility program with that name. The
    Xconfigurator utility enables you to create a configuration file that the X server
