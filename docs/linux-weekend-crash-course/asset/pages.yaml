  md: '# GNOME Mahjongg


    Main Menu ⬞ Programs ⬞ Mahjongg to start a game the GNOME Mahjongg game. In this
    version of Mahjongg, your goal is to find and click matching pairs of tiles, which
    are then removed from the game board.


    If you have trouble matching tiles, click the Hint button on the toolbar. The
    game program then flashes matching tiles for a short time. You can click those
    tiles one after another. Of course, the point of the game is for you to figure
    out which tiles to remove, so you should use the Hint button sparingly.


    # Chess game


    Main Menu ⬞ Programs ⬞ Games ⬞ Chess to start a game of chess. By default, the
    computer plays black and you play white. You get the first move. To make your
    move, click and drag a white piece to its new position. The chess program checks
    your move and stops you from making any illegal moves.


    Once you move, the computer responds with your move. Initially, the computer responds
    promptly, but the moves take longer as the game progresses. A timer counts the
    time for whoever has the current turn.


    # Playing Games in KDE


    Try out the games available on the KDE desktop, log in after selecting KDE as
    the current desktop.(Remember to select Session ⬞ KDE from the login window).
    From the KDE desktop, select ⬞ Games to view the menu of available games. Figure
    18-4 shows a typical menu of games in KDE.


    As the menu shows, KDE includes more than a dozen games in its game menu. You
    can try any of these games by selecting one from this menu.


    > KDE includes its own version of Mahjongg, which is similar to the GNOME version
    of Mahjongg introduced earlier in this session.


    ![](img/448aa2bd6846782b632c764b035753bc_253_0.png)


    10 Min.

    Go


    Now that you know where to find and how to start the GNOME games, you can try
    them out at your leisure. In the remainder of this session, you can play a few
    KDE games.'
