  md: 'The configure script starts running and prints lots of messages as it checks
    various features of your system, from the existence of the C compiler to various
    libraries needed to build XMMS. Finally, the configure script creates a Makefile
    you can use to build software.


    > > If the configure script displays error messages and fails, read the INSTALL
    and README files to find any clues solving the problem. You may be able to circumvent
    the problem by providing information through command-line arguments to the configure
    script.


    The configure script finishes, build the software by typing the following command:


    ```

    make

    ```


    This command runs the GNU utility (which takes 10 to 15 minutes to complete) that
    reads the Makefile and starts compiling the source files according to information
    specified in the Makefile. The make command goes through source directories, compiles
    source files, and creates executable files and libraries needed to run XMMS. You
    see a lot of messages scroll as each file is compiled. These show the command
    used to compile and link the files.


    # Installing the software


    After the make command finishes, you can install the XMMS software by using the
    following command:


    ```

    make install

    ```


    This command runs GNU make, but the install argument instructs GNU make to perform
    a specific set of commands from the Makefile. These instructions essentially search
    the subdirectories and copy various files to their final locations. For example,
    the binary executable files xmms, gnomems, wxmms, and xmms-config are copied to
    the /usr/bin directory.


    # Running the software


    Now that you have installed xmms try running it by typing xmms in a window from
    the GNOME or KDE desktop. From the XMMS window, you can open an MP3 file and playing
    it. Note that your PC must have a sound card and you must have it configured correctly.
    (Session 19 discusses sound-card configuration.) Figure 22-1 shows a typical view
    of XMMS playing an MP3 music clip.'
