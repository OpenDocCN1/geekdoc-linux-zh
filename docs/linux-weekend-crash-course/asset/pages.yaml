    between your Linux PC and the Internet through a dial-up modem. You learned to
    use the Red Hat Dialup Connection Tool to set up a PPP connection. Finally, this
    session showed you how to share a single Internet connection by using the IP masquerading
    feature of the IPCHAINS firewall administration program.'
