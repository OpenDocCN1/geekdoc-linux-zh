    world. In addition to the Linux distribution itself, these sites contain many
    other software packages that run under Linux.


    For the latest list of Linux FTP sites worldwide, visit the following Web site:
    http://www.linux.org/dist


    This page has links to information about Linux. These links take you to language-specific
    versions of Linux, books about Linux, and sites where you can download Linux for
    free.


    # Magazines


    Linux Journal is a monthly magazine devoted entirely to Linux. On the Web, the
    magazine home page is at http://www.linuxjournal.com/. There you can find information
    on how to subscribe to this magazine.


    Linux Magazine is another monthly magazine that covers everything Linux. We visit
    the magazine''s home page at http://www.linux-mag.com/ to learn more about Linux
    Magazine and to subscribe.


