  md: '# Session 16—Accessing Windows and DOS Files 205


    After the floppy is mounted, you can copy files to and from the floppy by using
    Linux''s copy command (cp). To copy the file gnome1.pcx from the current directory
    to the floppy, type the following:


    ```

    cp gnome1.pcx /mnt/floppy

    ```


    Similarly, to see the contents of the floppy disk, type the following:


    ```

    ls /mnt/floppy

    ```


    When you want to remove the floppy disk from the drive, first dismount the floppy
    drive. This removes the association between the floppy disk''s file system and
    the mount point on the Linux file system. Use the mount command to mount a device,
    as follows:


    ```

    umount /dev/fd0

    ```


    You can set your Linux system so that any user can mount a DOS floppy. You simply
    log in as root and add a line in the /etc/fstab file. For example, to enable users
    to mount a DOS floppy in the A: drive on the /a directory, perform these steps:


    +   1. Log in as root.


    +   2. Create the /a directory by using the following command:

    mkdir /a


    +   3. Edit the /etc/fstab file in a text editor (such as vi or Emacs), and insert
    the following code. Save the file, and quit the editor.

    /dev/fd0 /a vfat noauto,user 0 0

    On that line, user option (which appears next to noauto) enables all users to
    mount DOS floppy disks. The first field in the line is the device name (/dev/fd0),
    the second field is the mount directory (/a), and the third field shows the type
    of file system (vfat).


    +   4. Log out and log in as a normal (not root) user.


    +   5. To test that you can mount a DOS floppy without being root, insert a DOS
    floppy in the A: drive, and type the following command:

    mount /a


    ```

    /a

    ```


    Notice that you use the mount directory as an argument for the command. The mount
    operation should succeed, and you should see a listing of the DOS floppy when
    you type the command ls /a.


    +   6. To unmount the DOS floppy, type umount /a.


