    # 6-2


    Selecting the type of printer


    You can select from five types of printers:


    +   * Local Printer: Refers to a printer connected directly to a parallel or serial
    port of the PC where you install Red Hat Linux


    +   * Remote Unix (lpd) Queue: Refers to a printer physically connected to another
    Linux system on the local network (lpd refers to the Linux printer daemon — that
    manages the printer queue).


    +   * SMB/Windows 95/NT Printer: Refers to a printer connected to another PC that
    is on the local network and runs the LAN manager protocol (typically used to share
    resources such as disks and printers among PCs running Windows 95/98 or Windows
    NT)


    +   * NetWare Printer (NCP): Refers to a printer connected to a Novell server
    over the local area network


    +   * Direct to port printer: Refers to a network-connected printer that prints
    data received at a specific TCP/IP port (typically port number 9100)


    Specify the printer connection that applies to your configuration. For this discussion,
    assume you are connecting a printer to the PC''s parallel port, which means you
    should select the Local Printer button in the Add a Printer Entry dialog box.
    After you select the Local Printer button and click OK, the print tool displays
    a dialog box with information about the detected parallel ports. Click OK to continue
    with the printer configuration. Next, the Edit Local Entry dialog box prompts
    for various entries for the local printer (as shown in Figure 6-3).


    The fields are already filled in, and you can accept these as they are. You do
    have to select an input filter, which is a printer driver that depends on the
    make and model of the printer you are connecting to the parallel port. To do this,
    click the Select button next to the Input Filter text field. This brings up a
    large dialog box (see Figure 6-4) that enables you to select the printer type
    and to choose some other parameters such as the paper size and the resolution
    of the printer (typically 600 × 600 dots per inch in modern laser printers). Select
    the appropriate values for all the fields.'
