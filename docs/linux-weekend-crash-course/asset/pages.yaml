- img_proc: true
  md: '# Session 25—Scheduling Jobs in Linux


    After you press Ctrl+D, the at command responds with a job number and the date
    and time the job will execute.


    # Table 25-1

    Specifying the Time of Execution with the at Command


    | Command | When the Job Runs |

    | --- | --- |

    | at now | Immediately |

    | at now + 15 minutes | 15 minutes from the current time |

    | at now + 4 hours | 4 hours from the current time |

    | at now + 7 days | 7 days from the current time |

    | at noon | At anytime today (or tomorrow, if already past noon) |

    | at now next hour | Exactly 60 minutes from now |

    | at now next day | At the same p.m. tomorrow |

    | at 17:00 tomorrow | 5:00 p.m. tomorrow |

    | at 4:45pm | At 4:45 p.m. today (or tomorrow, if already past 4:45 p.m.) |

    | at 3:00 Aug 16, 00 | At 3:00 a.m. on August 16, 2000 |


    # Verifying scheduled one time jobs


    After you enter one or more jobs, you can type the at command to view the current
    list of scheduled jobs:


    +   - 2 2000-05-15 21:30 a

    - 3 2000-08-16 03:00 a

    - 4 2000-05-16 21:57 a

    - 5 2000-05-16 16:45 a


    The first field on each line shows the job number — the same number the at command
    displays when you submit the job. The next field displays the year, month, day,
    and time of execution. The last field shows that the jobs are in the queue.'
