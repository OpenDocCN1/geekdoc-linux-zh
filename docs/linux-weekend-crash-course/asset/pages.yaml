    4 packets transmitted, 4 packets received, 0% packet loss

    round-trip min/avg/max = 0.8/1.3/2.2 ms

    ```


    In Linux, ping continues to run until you press Ctrl+C to stop it; then it displays
    summary statistics showing the typical time it takes to send a packet between
    the two systems. On some systems, ping simply reports that a remote host is alive.
    However, you can still get the timing information with appropriate command-line
    arguments.


    # Examining TCP/IP Configuration Files


    Configuring the network during installation or running the network configuration
    tool may be to get TCP/IP configured on your system, but you should also know
    the configuration files so you can edit them if necessary. For example, you can
    specify the name servers through the network configuration tool, but suppose you
    want to add an alternative name server. To do so, you can simply add these names
    directly to the `/etc/resolv.conf` file — the configuration file that stores the
    IP addresses of name servers.


    In the remainder of this session, you familiarize yourself with the basic TCP/IP
    configuration files. Each of these configuration files is a text file you can
    examine with the cat or more command and edit using any text editor.


    # /etc/hosts


    The `/etc/hosts` configuration file contains a list of IP addresses and host names
    for your local network. In the absence of a name server, any network program on
    your system consults this file to determine the IP address that corresponds to
    a host name. Type the cat `/etc/hosts` command to view the contents of this file.


    ![](img/448aa2bd6846782b632c764b035753bc_202_0.png)


    ![](img/448aa2bd6846782b632c764b035753bc_202_1.png)'
