  md: "# Session 24—Building a New Kernel\n\nWhen configuring the kernel, do not link\
    \ too many features into the kernel by answering Yes to configuration options.\
    \ The kernel's file size may be too big to fit the 640KB limit of memory that\
    \ the PC can use as it boots. This 640KB limit exists because the Intel x86 processors\
    \ start in what is known as real mode and can use only 1MB of memory (of 640KB\
    \ is available for programs). This limit is a leftover from the old MS-DOS days\
    \ and applies only as the Linux kernel is initially loaded when the PC starts.\
    \ The kernel's file size is too big, the command line displays an error message\
    \ such as the following:\n\nSystem is too big. Try using bimage or modules.\n\n\
    If you get a \"System too big\" error, type make bimage to use a different type\
    \ of compressed kernel that may fit within the memory limits. Otherwise, go through\
    \ the make config again, and eliminate unnecessary features by answering No to\
    \ these configuration questions. For other features you really need or want to\
    \ try out, type m to create modules. Although the kernel's size is limited at\
