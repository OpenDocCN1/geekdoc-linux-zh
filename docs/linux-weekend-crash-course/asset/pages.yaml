    # Using the E-mail


    Electronic mail — e-mail is one of the most popular services on the Internet.
    E-mail started as a simple mechanism in which messages were copied to a user''s
    mailbox. That simple mechanism remains in use. In Linux, your mail messages are
    stored in the /var/spool/mail directory in a text file that has the same name
    as your user name.


    Messages still are addressed to a user name. That means if John Doe logs in with
    the user name jdoe, e-mail addressed to him is addressed to jdoe. The only other'
  merge: -1
  pgno: 187
- img_proc: true
  md: '# Session 13—Setting Up Internet Services


    piece of information needed to identify the recipient is the fully qualified domain
    name of the recipient''s system. Thus, if John Doe''s system is named someplace.net,
    his complete e-mail address is jdoe@someplace.net. Given that address, anyone
    on the Internet can send-mail to John Doe.


    To set up and use e-mail on your Linux PC, you need two types of mail software:


    +   Mail-user agent software enables you to read your mail messages, write replies,
    and compose new messages. Typically, the mail-user agent retrieves messages from
    the mail server using POP3 or IMAP4 protocol. POP3 is the Post Office Protocol
    version 3, and IMAP4 is the Internet Message Access Protocol version 4. This book''s
    Red Hat CD-ROMs include popular mail-user agents as pine and elm.


    +   Mail-transport agent software actually starts and receives mailmessage. The
    method used for mail transport depends on the underlying network. In TCP/IP networks,
    the mail-transport agent delivers mail using the Simple Mail Transfer Protocol
    (SMTP). This book''s Red Hat CD-ROMs include sendmail, a powerful and popular
    mail-transport agent for TCP/IP networks.


    Most mail-transport agents run as daemons—background processes that run as long
    as your system is up. Because you or another on the system can send mail at any
    time, the transport agent has to be deliver the mail to its destination. The mail-user
    agent runs only when the user wants to check mail.


    > ※ Typically, a mail-transport agent starts after the system boots. The system
    startup files for Linux are set up so that the sendmail mail-transport agent starts
    when the Linux system is in multiuser mode. The shell script file /etc/rc.d/sendmail
    starts sendmail.


    Because the system is already up to start sendmail at boot time, all you have
    to do is use an appropriate sendmail configuration file to get e-mail going on
    your Linux system.


    You cannot send or receive e-mail until the sendmail mail-transport agent is properly
    configured. The sendmail transport agent has the reputation of being a complex,
    complete, mail-delivery system. If you take a quick look at sendmail''s configuration
    file /etc/sendmail.cf, you can see that sendmail is indeed complex. Luckily, you
    do not have to be an expert on the sendmail configuration file. All you need is
    the predefined configuration files from this book''s companion CD-ROMs. A good
    source for Sendmail information is the Sendmail Web site, www.sendmail.org. This
    site contains the the latest version of Sendmail and information about security
    patches and bug fixes.


    ![](img/448aa2bd6846782b632c764b035753bc_188_0.png)'
