    # Maintaining System Security


    # Session Checklist


    +   * Establishing a security policy

    * Securing your system

    * Monitoring system security


    As a system administrator, you have to worry about your Linux system''s security.
    For a standalone system or a system used in an isolated local area network (LAN),
    you must ensure that a user does not intentionally or inadvertently modify, delete,
    or destroy system files. If your Linux system is connected to the Internet, you
    must also secure the system from unwanted accesses. Intruders, known as crackers,
    typically impersonate a user, steal or destroy information, and even deny you
    access to your own system (known as denial of service). This session briefly covers
    some key aspects of securing your Linux system. As you''ll see, Linux already
    has the tools you need to maintain system security.


    30 Min.

    To Go


    > To learn more about Linux security, the Linux Security HOWTO at http://metalab.unc.edu/pub/linux/docs/HOWTO/Security-HOWTO.
    Another good resource is the Linux Administrator''s Security Guide, which you
    can read online at http://www.securityportal.com/lasg/


    ![](img/448aa2bd6846782b632c764b035753bc_364_2.png)'
  merge: -1
