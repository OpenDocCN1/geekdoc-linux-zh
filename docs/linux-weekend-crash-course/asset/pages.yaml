  md: '# Using aliases for commands


    To see the benefit of aliases, type the following command:


    ```

    alias goboot=''cd /usr/src/linux/arch/i386/boot/''

    ```


    This defines goboot as an alias—another name—for the text that appears within
    the single quotes. That text is a command to change the current directory to /usr/src/linux/arch/i386/boot.


    Now that you''ve defined the aliases, type the following at the bash prompt:


    ```

    goboot

    ```


    Now type pwd to confirm that the current directory is indeed /usr/src/linux/arch/i386/


    As you can see, an alias simply is an alternative (and usually shorter) name for
    a lengthy command. bash replaces the alias with its definition and performs the
    equivalent command.


    If you longer need an alias, use the unalias command to remove the alias. For
    example, if you no longer want to use the goboot alias, type:


    ```

    unalias goboot

    ```


    After this step, typing goboot causes you to get an error message like this:


    ```

    bash: goboot: command not found

    ```


    Many users use the alias feature to give more familiar names to common commands.
    If you are a DOS user and use the md command to create a directory, you can simply
    define md as an alias for mkdir (the Linux command that creates a new directory).
    You do this as follows:


    ```

    alias md=mkdir

    ```


    Now, you can type md to create a new directory dirname. Another good use of an
    alias is to redefine a dangerous command, such as rm, to make it safer. By default,
    the rm command deletes one or more specified files. If you type rm * mistake,
    rm deletes all files in your current directory. I learned this the hard way one
