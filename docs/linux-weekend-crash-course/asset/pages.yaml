    # Setting Up the Apache Web Server


    You probably already know how it feels to use the Web, but you may not know how
    to set up a Web server so that you, too, can provide information to the world
    through Web pages. Become an information provider on the Web, you have to run
    a Web server over your Linux PC on the Internet.


    Web servers provide information by using HTTP. Web servers are also known as HTTP
    daemons (because continuously running processes are called daemons in UNIX) or
    HTTPD, for short. The Web server program usually is httpd.


    Among the freely Web servers, Apache Web server is the most popular. Apache is
    freely over the Internet, and it accompanies Red Hat Linux on this book''s companion
    CD-ROMs.


    When you install Red Hat Linux from this book''s companion CD-ROMs, you also have
    the option of installing the Apache Web server. If you install the Mail/WWW/News
    Tools package during Linux installation, Linux automatically starts the Apache
    Web server during system boot. Other distributions, such as Caldera and SuSE,
    also offer the option of installing the Apache Web server and associated tools
    during their installations. If you choose to install the Web server and associated
    tools, the Web server will start automatically at system boot.


    Perform the following steps to verify that the Apache Web server is installed
    and running on your system:


    +   1. Type the following command to check whether the Apache Web server is installed:

    rpm -q apache

    The output shows an apache package name such as the following, you have the Apache
    software installed on your system.

    2. Type the following command to check whether the httpd process (the name of
    the Apache Web server program is httpd) is running:

    ps ax | grep httpd


    ![](img/448aa2bd6846782b632c764b035753bc_189_0.png)


