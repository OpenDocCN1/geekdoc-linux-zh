    The initial GNOME desktop after logging in as root


    # Shutting down Red Hat Linux


    When you are ready to shut down Red Hat Linux, you must do so in an orderly manner.
    Even if you are the sole user of a Linux system, several other programs are usually
    running in the background. Also, operating systems such as Linux try to optimize
    the way they write data to the disk. Because disk access is relatively slow (compared
    with the time needed to access memory locations), data generally is held in memory
    and written to the disk in large chunks. Therefore, if you turn the power off,
    you run the risk of some files not updating properly.


    Any user (you do not have to be logged in) can shut down the system from the desktop
    or the graphical login screen. The System menu in the login box provides menu
    options for rebooting or halting the system. To shut down the system, simply select
    System Halt in the graphical login screen shown in Figure 4-3.'
