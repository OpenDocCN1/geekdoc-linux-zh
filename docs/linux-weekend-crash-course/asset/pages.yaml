    # Using IP Masquerading to Share an Internet Connection


    Linux possesses a feature called IP masquerading that enables you to connect an
    Ethernet LAN with a private IP address to the Internet. This occurs through a
    Linux PC (with an officially assigned IP address) that has a connection to the
    Internet. The Linux PC may be connected to the Internet by dial-up PPP or some
    other connection, such as DSL or cable modem.


    With IP masquerading enabled, your PC acts as a stand-in for any of the other
    systems on the Ethernet LAN. As the router, the Linux PC is designated as the
    gateway for the Ethernet LAN. However, masquerading involves more than forwarding
    IP packets back and forth between the LAN and the Internet.


    When the Linux PC masquerades as another system on the LAN, it modifies outgoing
    packets so that they always appear to originate from the Linux PC. When a response
    to one of the outgoing packets is received, the Linux PC performs the reverse
    task—it modifies the packets so that they appear to come from the Internet directly
    to the system that sends the outgoing packet. The result is, even though the Ethernet
    LAN uses a non-unique private IP address.


    To enable and use IP masquerading, perform the following steps:


    +   1. Make sure the kernel—the core operating system—supports IP firewall chains.
    This should be true for the version of Red Hat Linux you install from the companion
    CD-ROMs. Other distributions of Linux usually support IP chains. If the file /proc/net/ip_fwchains
    exists, the Linux kernel supports IP firewall chains. (Type ls /proc/net/ip_fwchains
    to verify that the file exists).

    2. Make sure the Linux PC has an Internet connection and a network connection
    to your LAN. Typically, the Linux PC has two interfaces—an Ethernet card for the
    LAN and a dial-up PPP connection to the Internet (through an ISP).

    3. Make sure all other systems on your LAN use the Linux PC as the default gateway
    for TCP/IP networking. Use the same ISP-provided DNS addresses on all systems.


    ![](img/448aa2bd6846782b632c764b035753bc_180_0.png)'
  merge: -1
  pgno: 180
- img_proc: true
  md: '4. Enable IP forwarding in the kernel by typing the following command:

    echo "1" > /proc/sys/net/ipv4/ip_forward


    This is necessary because IP forwarding is disabled by default. To ensure that
    IP forwarding is enabled when you reboot your system, place this command in the
    /etc/rc.d/rc.local file. In Linux, you can achieve the same result by changing
    the line FORWARD_IPV4=false to FORWARD_IPV4=true–true in the /etc/sysconfig/network
    file.


    5. Run /sbin/ipchains – the IPCHAINS firewall administration program – to set
    up the rules that enable IP masquerading for your LAN. For example, to masquerading
    a LAN via a Linux PC''s ppp0 network interface, you can use the following commands:


    +   - /sbin/ipchains -P DENY

    - /sbin/ipchains -A forward -i ppp0 -j MASQ


    If you want the IP masquerading set up at startup, you should place these commands
    in the /etc/rc.d/rc.local file. Be sure to look at all the pages for ipchains
    to learn about securing your system.


    ![](img/448aa2bd6846782b632c764b035753bc_181_0.png)


    > You may find IP masquerading a convenient way to provide Internet access to
    a small LAN (for example, a LAN at home or in the office). At home, I use IP masquerading
    to connect an Ethernet LAN to the Internet through a Linux system. The Linux PC
    has an Ethernet card for the LAN connection and a modem to connect to the Internet
    via an ISP. (I have a valid IP address from the ISP.) With IP masquerading on
    the Linux PC, everyone in your family or small business can access the Internet
    from the other PCs on the LAN.


    Done!


