    clicks and keystrokes. You can try out some of the items in the Sawfish configurator.


    # Changing the Default Desktop


    GNOME and KDE are both capable graphical desktop environments. Red Hat Linux comes
    with these GUIs, but you get GNOME as the default desktop. Just before you log
    in at the graphical login screen, you can always select a specific desktop from
    the Session menu of the login window. However, Red Hat also includes a Desktop
    Switcher utility enables you to switch the default desktop from GNOME to KDE and
    vice versa. To switch from GNOME to KDE, follow these steps:


    +   1. From your GNOME desktop, select the Main Menu (foot) Programs Desktop Switching
    Tool. The Desktop Switcher dialog box appears.

    2. In the new dialog box, click the KDE radio button to select it. Then click
    the OK button. Another dialog box appears.

    3. A message in the new dialog box informs you that the desktop configuration
    has been changed, but you must restart X. Click the OK button to dismiss the dialog
    box.


    Although the message in Step 3 states that you must restart X, all you need to
    log out of the session and log back in. To log out, select Main Menu Log out.
