    Linux comes with quite a few multimedia applications that enable you to play audio
    CDs and manipulate graphics and images. In this session, you try out several multimedia
    applications and learn to work with graphics and images. You start the session
    by configuring your PC''s sound card in Red Hat Linux because you need a working
    sound card to listen to audio CDs.


    ![](img/448aa2bd6846782b632c764b035753bc_256_0.png)


    # Configuring the Sound Card


    Your PC must have a sound card and speakers to play audio CDs. I assume your PC
    has a sound card and you have the speakers hooked up according to the instructions
    from the PC''s manufacturer.


    Red Hat, and other versions of Linux, requires sound driver software to access
    and control the sound card. The sound drivers are provided as modules you can'
