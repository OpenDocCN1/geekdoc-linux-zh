  md: '# Using mtools to Access DOS/Windows Floppy Disks


    So, you''ve learned one way to access the MS-DOS file system: mount the DOS hard
    disk or floppy disk by using the mount command; then use regular Linux commands,
    such as ls and cp. This approach to mounting a DOS file system is fine for hard
    disks. Linux can mount the DOS partition automatically at startup, and you can
    access the DOS directories on the hard disk drive anytime.


    If you want a quick directory listing of a DOS floppy disk, however, you may find
    mounting tedious. This is where the mtools package comes to the rescue. The mtools
    package is a collection of utilities that implements most common DOS commands.
    The commands have the same names as in DOS, except you add an m prefix to each
    command. Thus, md retrieves a directory listing, and mcopy files. The best part
    of mtools is that you do not have to mount the floppy disk to use the mtools commands.


    > mtools commands read and write from the physical device (floppy disk), you have
    to log in as root to perform these commands. If you want other users to access
    the mtools commands, you will have to alter the permission settings for the floppy-devices.
    Use the following command to permit other users to read from and write to the
    first floppy drive:


    ```

    chmod +rw /dev/fd0

    ```


    # Verifying if mtools is installed


    The mtools package comes with the Red Hat Linux distribution on this book''s companion
    CD-ROMs. When you install Red Hat Linux, mtools is installed automatically as
    part of the base Linux. The mtools executable files are in /usr/bin directory.
    To see whether you have mtools installed, type ls /usr/bin/mdir in the shell prompt.
    The ls command shows that this file exists, mtools should be available on your
    system.


    You can also type the following rpm command to verify that mtools is installed
    on your system:


    ```

    rpm -q mtools

    ```


    If mtools is installed, the output shows the full name of the mtools package.


    ```

    mtools-3.9.7-3

    ```'
