  md: 'The output of this command shows you the contents of the archive and gives
    you an idea of the directories created once you unpack the archive. In this case,
    a directory named xmms-1.0.1 is created in the current directory (which, in my
    case, is /usr/local/). From the listing, you also learn the programming language
    used to write the package. If you see .c and .h files, that means source files
    are in the C programming language used to write many open source software packages.


    # # Unpacking the software


    Extract (or unpack) the contents of the tar archive, type the following command:


    ```

    tar xvf xmms.*.gz

    ```


    You again see the long list of files as they are extracted from the archive and
    copied to the appropriate directories on your hard disk. Now you are ready to
    build the software.


    # # Building the Software from Source Files and Installing It


    After you unpack the compressed tar archive, all source files are in a directory
    whose name is usually the name of the software package and a version number suffix.
    For example, the XMMS version 1.0.1 source files are extracted in the xmms-1.0.1
    directory. To start the process of building the software, change the directory
    by using this command:


    ```

    xmms*

    ```


    > You don''t have to type the entire name. The shell can expand the directory
    name and change it to the xmms-1.0.1 directory.


    ![](img/448aa2bd6846782b632c764b035753bc_295_0.png)


    Nearly all software packages come with some sort of README or INSTALL files—text
    files with instructions on what to do to build and install the packages. XMMS
    is no exception; it comes with a README file you can read by typing more README.
    There is also an INSTALL file that contains instructions for building and installing
    XMMS.'
