- img_proc: true
  md: '# Session 21—Understanding How Linux Boots


    The fields have the following meanings:


    +   * id field is a unique, one- or two-character identifier. The init process
    uses this field internally. You can use any identifier you want as long as you
    do not use the same identifier on more than one line. For example, si, x, and
    1 are all valid identifiers.

    * runlevels field is a sequence of zero or more characters, each denoting a run
    level. The line with the identifier 1, for example, applies to run levels 1 through
    5, so the runlevels field for this entry is 12345. This field is ignored if the
    action field is set to sysinit, boot, or bootwait.

    * action field tells the init process what to do with the specific entry. If this
    field is initdefault, for example, it interprets the runlevels field as the default
    run level. If this field is set to wait, init starts the process field and waits
    until that process exits.

    * process field specifies the action that has to start. Of course, some settings
    of the action field require no process field. (When action is set to initdefault,
    for example, no need exists for a process field.)


    # Table 21-1

    Valid Actions in /etc/inittab


    | Action | Description |

    |---|---||

    | Respawn | Restarts the process whenever it terminates. |

    | Wait | Restarts the process once at the specified run level; init waits until
    that process exits. |

    | Once | Executes the process once at the specified run level. |

    | Boot | Executes the process as the system boots, regardless of the run level
    (the runlevels field is ignored). |

    | Bootwait | Executes the process as the system boots; init waits for the process
    to exit (the runlevels field is ignored). |

    | Off | Nothing happens for this action. |

    | Ondemand | Executes the process at the specified run level, which must be a,
    b, or c. |


    Continued'
