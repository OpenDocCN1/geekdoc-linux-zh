  md: '# 130 Saturday Morning


    Another common way to start vi is to jump to a specific line number right at startup.
    To begin editing at line 296 of the file /etc/X11/XFB6Config, for example, use
    this command:


    ```

    vi +296 /etc/X11/XFB6Config

    ```


    This way of starting vi is useful when you edit a source file after the compiler
    reports an error at a specific line number.


    When you edit a file with vi, the editor loads the file into a buffer, displays
    the first few lines of the file in a full-screen window, and positions the cursor
    on the first line. When you type the command vi /etc/fstab in a terminal window,
    for example, you get a full-screen text window.


    The last line shows information about the file, including the number of lines
    and the number of characters in it. Later, this area functions as a command-area.
    The rest of the lines display the file. If the file contains fewer lines than
    the window, vi displays the empty lines with a tilde (-) in the first column.


    The current line is marked by the cursor, which appears as a small black rectangle.
    The cursor appears on top of a character. In vi, you work in three modes:


    +   **Visual mode** is what you get by default. In this mode, anything you type
    is interpreted as a command that applies to the line containing the cursor. The
    vi commands are similar to the ed commands.

    * **Command mode** allows you to read or write files, set vi options, and quit.
    All colon commands start with a colon (:). When you enter the colon, vi positions
    the cursor at the last line and allows you to type a command. The command takes
    effect when you press Enter.

    * **Input mode** allows you to enter text into the buffer. You can enter input
    mode with the command a (insert cursor), A (insert append at end of line), or
    i (insert cursor). After entering lines of text, you have to press Esc to leave
    input mode and re-enter visual command mode.


    One problem with all these modes is that you cannot easily tell vi''s current
    mode. It is frustrating to be typing only to realize that vi is not in input mode.
    The converse situation also commonly—you may be typing when you want to enter
    a command. If you want to make sure vi is in command mode, press Esc a few times.
    (Pressing Esc more than once doesn''t hurt.)


    > To view online help in vi, type :help while in command mode.

    Type :q to exit the help screen and to return to the file you are editing.


    ![](img/448aa2bd6846782b632c764b035753bc_153_0.png)'
