  md: 'Gnome RPM is a handy utility for installing, removing, and upgrading various
    software packages for Linux. If you want to learn more about Gnome RPM, read the
    online help text by selecting the appropriate item from Gnome RPM''s Help menu.


    # Use the rpm Command to Install and Remove Packages


    When you use Red Hat Linux from the companion CD-ROM, or install other distributions,
    the installation process uses the rpm command to unpack the packages (RPM files)
    and to copy the contents to the appropriate locations on the disk.

    Although you do not need to understand the internal structure of an RPM file,
    you should know how to work with RPM files. Specifically, you may want to perform
    one or more of the following tasks with RPMs:


    +   - Find the version numbers and other information about RPMs installed on your
    system.

    - Install a new software package from an RPM. For example, you can install a package
    you during the initial installation. In particular, you have to install the source
    files for the Linux kernel before you can rebuild the kernel.

    - Remove (uninstall) unneeded software you installed from an RPM. You can uninstall
    a package to reclaim the disk space if you find you never use the package.

    - Upgrade an older version of an RPM with a newer one. You can upgrade after you
    download a new version of a package from Red Hat''s, Caldera''s or SuSe''s FTP
    server. Often, you must upgrade an RPM to benefit from the fixes in the new version.

    - Verify that an RPM is in working order. You can verify to check if all necessary
    files are in their correct locations.


    You can perform all of these tasks with the rpm command — simply using different
    options. The next few sections briefly introduce you to the rpm command.


    > If you forget the rpm options, follow the following command to see a list of
    its command-line options:

    rpm --help | more


    The number of options rpm has will amaze you!'
