  md: '# SESSION


    ![](img/448aa2bd6846782b632c764b035753bc_38_0.png)


    ![](img/448aa2bd6846782b632c764b035753bc_38_1.png)


    # Partitioning the Hard Drive


    # Session Checklist


    +   - Repartitioning your hard drive with FIPS

    - Starting the Red Hat Linux installation

    - Partitioning the hard disk for Red Hat Linux


    In the previous session, you gathered information about your PC''s hardware and
    prepared a Red Hat boot disk. This session shows you how to do one more preparatory
    task — setting aside disk space. It also demonstrates the next step: using the
    Red Hat boot disk to begin the Red Hat Linux installation and then partitioning
    (dividing) the disk again — this time under Linux — to create the necessary Linux
    partitions. You then move on to the next session, which shows you how to finish
    installing Red Hat Linux.


    30 Min.

    To Go


    > If you plan to install Red Hat Linux on a second hard disk or you want to completely
    wipe your current disk and install Red Hat Linux on it, you do not have to go
    through the process of repartitioning your hard disk under MS-DOS to create room
    for Red Hat Linux. Skip the next section and proceed to the “Starting the Red
    Hat Linux Installation” section.'
  merge: -1
  pgno: 38
- img_proc: true
  md: '# Repartitioning Your Hard Drive with FIPS


    If your PC has a single hard drive, chances are that you have Microsoft Windows
    95/98 installed on that drive. If your hard drive is at least 1GB, recommend that
    you have Windows installed on your system even if you want to work mostly in Linux.
    After all, you have to perform some of the Red Hat Linux steps under MS-DOS or
    Windows. Also, you can access the Windows files from all distributions of Linux.
    Essentially, you get the best of both worlds by keeping MS-DOS and Windows around
    when you install Red Linux.


    > If your PC has one large hard drive (typically larger than 2GB) but two drives—
    C and D— that means the disk already has two partitions. In this case, you may
    simply want to use the extended partition (drive D:) for Linux. Skip this step
    and proceed to the "Starting the Red Hat Linux Installation" section.


    Typically, your PC''s hard drive is set up as a single large drive, designated
    by drive C:. Unless you scourge a second hard drive for your PC, or you already
    have a second disk, your first task is to divide your one and only hard disk to
    make room for Red Linux.


    There are two ways to repartition your hard disk:


    +   - Destroy the existing partition and create two smaller, partitions— one for
    Windows and the other for Red Hat Linux. This requires you to back up and restore
    the existing Windows files. This is the way to repartition a hard disk.

    - Use the FIPS (First Nondestructive Interactive Partition Splitting) utility
    program (included in the companion CD-ROMs) to resize the existing partition and
    free up space for a second partition in which you can install Red Hat Linux. FIPS
    cords off the unused part of a hard disk and makes a new partition out that unused
    part without destroying any data existing on used part. You can also use commercial
    disk partitioning software such as PartitionMagic (http://www.powerquest.com/partitionmagic/index.html).


    No matter which approach you take to repartition your hard disk, do not perform
    this step before you back up the current contents of your hard disk. Backing up
    your hard disk ensures that your files are safe, in case something goes wrong
    with the repartitioning.'
  merge: -1
  pgno: 39
- img_proc: true
  md: '# Session 2—Partitioning the Hard Drive


    In this section, I show you how to repartition your hard disk using FIPS (the
    easiest way to create a new partition for Red Hat Linux). The idea is to shrink
    the existing DOS partition and to create room for the Linux partition. Later,
    during Red Hat Linux installation, you have to divide the partition for Linux
