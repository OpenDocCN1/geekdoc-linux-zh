  md: '# Understanding the mtools commands


    As I explain previously in this chapter, the mtools package is a collection of
    utilities. So far, you have seen the command dir — the mtools counterpart of the
    DIR command in DOS.


    If you know the MS-DOS commands, using the mtools commands is very easy. Type
    the DOS command in lowercase letters, and add filenames are case-sensitive, use
    all lowercase letters when you type the mtools commands.


    Table 16-1 summarizes the various mtools utilities and some of their corresponding
    commands available in mtools version 3.9.6.


    # Table 16-1

    Common mtools Commands


    | mtools Utility | MS-DOS Command (If Any) | Action |

    |---|---|---|

    | Mattrib | ATTRIB | Changes MS-DOS file-attribute flags |

    | Mcd | CD | Changes an MS-DOS directory |

    | Mcopy | COPY | Copies files between MS-DOS and Linux |

    | Mdel | DEL or ERASE | Deletes an MS-DOS file |

    | Mdeltree | DELTREE | Recursively deletes an MS-DOS directory |

    | Mdir | DIR | Displays an MS-DOS directory listing |

    | Mformat | FORMAT | Places an MS-DOS file system on a low-level formatted floppy
    disk (use fdformat to low-level format in Linux) |

    | Mlabel | LABEL | Initializes an MS-DOS volume label |

    | Mmd | MD or MKDIR | Creates an MS-DOS directory |'
  merge: -1
  pgno: 231
- img_proc: true
  md: '# Session 16—Accessing Windows and DOS Files


    | mtools Utility | MS-DOS Command (If Any) | Action |

    |---|---|--|

    | mmove | N/A | Moves or renames an MS-DOS file or subdirectory |

    | mrd | RD or RMDIR | Deletes an MS-DOS directory |

    | mren | REN or Rename | Renames an existing MS-DOS file |

    | mtype | TYPE | Displays the contents of an MS-DOS file |

    | xcopy | XCOPY | Recursively copies a DOS directory into another |


    You can use the mtools commands just as you use the corresponding DOS command.
    For example, the mdir command works like the DIR command in DOS. The same goes
    for all other mtools commands shown in Table 16-1.


    # Formatting a DOS/Windows floppy disk


    Suppose you want to copy files on an MS-DOS/Windows floppy disk. If you already
    have a formatted formatted MS-DOS/Windows floppy, you can simply mount that floppy
    and copy the files to the floppy by using the Linux cp command. What if you do
    not have a formatted DOS floppy? The mtools package provides the mformat utility,
    which can format a floppy disk for use under-DOS. Unlike the DOS format that formats
    a floppy in a single step, the mformat command requires you to follow a two-step:


    +   1. Use the fdformat Linux to low-level format a floppy disk. The fdformat
    command expects the floppy device name to be the argument; the device name includes
    all parameters necessary for formatting the floppy disk. To format a 3.5-inch
    high-density floppy disk in your system''s A: drive, type fdformat /dev/fdH01440.


    +   2. Use the mformat command to put an MS-DOS file system on the low-level formatted
    floppy disk. If the floppy is in drive A;, type the following command:


    mformat a:'
