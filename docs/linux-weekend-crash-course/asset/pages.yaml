    # Partitioning the Hard Disk for Red Hat Linux


    Like MS-DOS, Red Hat Linux requires you to partition and prepare a hard disk before
    you install Red Hat Linux. For a new PC, you usually do not perform this step
    because the vendor normally takes care of preparing the hard disk and installing
    Windows and all other applications on the hard disk. Because you are installing
    Red Hat Linux from scratch, however, you have to perform this crucial step yourself.
    As you see in the following sections, this task is just a matter of following
    instructions.


    The Red Hat installation program runs Disk Druid — a utility that enables you
    to partition the disk and, at the same time, specify which parts of the Linux
    file system you want to load on.


    Before you begin to use Disk Druid to partition your disk, you need to know how
    to refer to the disk drives and partitions in Linux. Also, you should understand
    the terms mount points and swap partition. In the next three sections, learn these
    terms and concepts and then proceed to use Disk Druid.'
