  md: '# Session 8—The Command Shell


    # Letting bash complete your commands


    Many commands take a filename as an argument. To browse through a file named /etc/X11/XF86Config,
    for example, type the following command:


    more /etc/X11/XF86Config


    This command displays the file /etc/X11/XF86Config one screen at a time. The commands
    that take a filename as an argument, bash includes a feature that enables you
    to type short filenames. All you have to do is the bare minimum— just the first
    few characters — identify the file uniquely in its directory.


    To see an example, type more /etc/X11/KF, but don''t press Enter; press Tab instead,
    bash automatically completes the filename so that the command becomes /etc/X11/XF86Config.
    Now press Enter to run the command.


    # Using wildcard characters


    Another way to avoid typing many filenames is to use wildcards—special characters,
    such as the asterisk (*) and question mark (?), match zero or more characters
    in a string. If you are familiar with MS-DOS, you may use commands such as COPY
    *, A: copy all files from the current directory to the A: drive. Bash accepts
    similar wildcards in filenames. In fact, bash provides more wildcard options than
    MS-DOS does.


    +   Bash supports three types of wildcards:

    * The asterisk (*) matches zero or more characters in a filename.

    Therefore, * denotes all files in a directory.

    * The question mark (?) matches any single character.

    * A set of characters in brackets matches any single character from that set.

    The string [x]*, for example, matches any filename that starts with x or X.


    Wildcards are handy when you want to perform a task on a group of files. To copy
    all the files from a directory /mnt/cdrom to the current directory, example, type
    the following:


    ```

    cp /mnt/cdrom/*

    ```


    +   Bash replaces the wildcard character * with the names of all files in the
    /mnt/cdrom directory. The period at the end of the command represents the current
    directory.'
