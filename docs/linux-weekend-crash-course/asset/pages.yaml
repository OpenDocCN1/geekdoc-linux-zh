    only one physical terminal or console (the combination of monitor and keyboard
    is called the terminal or console), it gives you the appearance of having multiple
    consoles. From the graphical X screen (GNOME or KDE desktop), press Ctrl+Alt+F1
    to get to the first virtual console; press Ctrl+Alt+F2 for the second one, and
    so on. Each of these virtual consoles is a text screen where you can log in and
    type Linux commands to perform various tasks.


    Go ahead and press Ctrl+Alt+F2 to switch to the second virtual console. Log in
    and try some Linux commands. You can log out by typing exit at the prompt. To
    get back to the graphical X display, press Ctrl+Alt+F7.


