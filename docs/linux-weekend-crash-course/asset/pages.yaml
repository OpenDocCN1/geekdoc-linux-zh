  md: '# Saturday Evening


    desktop just as you can customize Windows 95/98/NT/2000. For example, you can
    select a different background or change the appearance of the window borders.


    To try your hands at customizing the GNOME desktop, log in from the graphical
    login screen. I assume that GNOME is your default desktop environment because
    that''s what you usually get when you install Red Hat Linux. Later in this session,
    you will learn how to switch the desktop from GNOME to KDE and vice versa.


    > If GNOME is not your default desktop, simply select Session GNOME from the login
    window, and enter your username and password.


    You can configure most aspects of the GNOME desktop''s look and feel — the appearance
    and behavior — from a graphical application called the GNOME Control Center. To
    launch the Control Center, select Main Menu➜ Programs ➜ GNOME Control Center,
    or click the tooltip in the GNOME panel.


    The GNOME Control Center''s window is vertically divided into two parts — a narrow
    area on the left side and a larger workspace on the right side. The left side
    shows a tree menu of all configuration items (also known as capplets). The top-level
    menu items are organized into several categories, such as Desktop and Multimedia.
    You can click a category to see its subcategories. To configure an item, locate
    the item in the tree menu, and click that item. The selected capplet''s user interface
    appears in the workspace on the right-hand side. The user interface is usually
    a dialog box with settings you can change.


    In the next sections, you try out a few customization steps with the Control Center.
    After you finish using the Control Center, select File➜ to quit.


    # Changing the background


    To try a simple customization, select Desktop➜ Background from the tree menu.
    The GNOME Control Center runs the background properties capplet that, in turn,
    displays a window in the workspace (as shown in Figure 17-1).


    As you can see, this window looks similar to the Display Properties dialog box
    in Windows 95/98/NT. It enables you to select a background of solid color or the
    wallpaper (an image used as the background). You can select a background of solid
    color or a color gradient in which the background starts with one color and changes
    to another color. The gradient can start in the vertical direction (top to bottom)
    or the horizontal direction (left to right).


    Go ahead and click the Gradient button and see what happens. You get to preview
    the changes in the image of a monitor that appears in the dialog box.'
