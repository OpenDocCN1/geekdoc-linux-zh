- img_proc: true
  md: 'large file that has the .tar.gz or .tar.Z extension — often referred to as
    a compressed tarball. If you want the software, you have to download the compressed
    tarball and unpack it.


    Download the compressed tar file using anonymous FTP or the Web browser. Typically,
    this involves no more effort on your part than clicking a link and saving the
    file in an appropriate directory on your system.


    To try your hand at downloading and building a software package, you can practise
    on the X Multimedia System (XMMS) — a graphical X application for playing MP3
    files and other multimedia files. XMMS is installed on your system when you select
    the Multimedia Support group during the Red Hat Linux installation you did in
    Session 3. However, there is no harm in downloading and rebuilding the XMMS package
    again.


    You can access source files for XMMS from http://www.xmms.org/download.html in
    the file of a compressed archive. You can also download files from the xmms/1.0
    directory of the anonymous FTP server (ftp.xmms.org). You should try downloading
    from the anonymous FTP server so you can learn to download files manually.


    Before attempting to download a file from an FTP server, make sure your Linux
    system is connected to the Internet. You should also change the directory to the
    location where you want to store the downloaded file (although you can move the
    file after downloading). I typically log in as root and change the directory to
    /usr/local before typing the ftp command. If you use the GNOME or KDE desktop,
    type these commands from a terminal window.


