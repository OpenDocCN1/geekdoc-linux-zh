    # Connecting to the Internet


    # Session Checklist


    +   - Learning the basics of dial-up networking

    - Connecting to the Internet using PPP

    - Using IP masquerading to share an Internet connection


    After installing Linux, you may want to connect your Linux PC (and perhaps your
    own LAN) to the Internet. You have the following popular options for connecting
    a small office or home office to the Internet: Digital Subscriber Line (DSL),
    cable modem, and dial-up networking. The DSL and cable modem options essentially
    involve connecting a special modem to an Ethernet card on your Linux system. In
    these cases, the setup procedures are the same as the ones discussed in Session
    14.


    30 Min. To Go


    This session focuses on dial-up networking, which involves setting up a PPP connection
    from your Linux PC to your ISP''s system. You also learn to use IP masquerading
    to share a Linux system''s Internet connection with other systems on a LAN.'
