    30 Min.

    To Go


    His evening, I focus on using the GNOME and KDE graphical desktops, as well as
    some of the applications and utilities that come bundled with Red Hat Linux. This
    session shows how to customize the GNOME and KDE desktops. You also learn how
    to switch your default desktop from GNOME to KDE and vice versa. The other two
    major distributions of Linux, Caldera and SuSe, use KDE as their default desktop.
    My descriptions of KDE in this session are applicable to KDE used in both Caldera
    and SuSe.


    # Customizing the GNOME Desktop


    As I discuss in Session 4, the default look and feel of the GNOME graphical desktop
    is similar to that of Windows 95/98/NT/2000, and you do not have to customize
    anything to begin using it. However, if you want, you can customize the GNOME'
