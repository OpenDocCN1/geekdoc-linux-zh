  md: '# APPENDIX


    # What’s on the CD-ROMs?


    The CD-ROMs that accompany this book contain Red Hat Linux 7.1. They also contain
    the Linux Weekend Crash Course Assessment Test. The following sections briefly
    explain both.


    # Red Hat Linux 7.1


    The CD-ROMs contain all Red Hat Linux 7.1 binary files with the Linux 2.4.0 kernel,
    which is the latest version of the Linux kernel available as of this writing (Winter
    2001). In addition to the Linux kernel, Red Hat Linux includes a large selection
    of Linux packages. Here are some significant software packages on the Red Hat
    Linux 7.1 CD-ROMs:


    +   - Linux kernel 2.4.0 with driver modules for all major PC hardware configurations,
    including IDE/EIDE and SCSI drives, PCIA devices, some USB devices, and CD-ROM
    drives

    - Complete set of installation and configuration tools for setting up devices
    (such as keyboard and mouse) and services

    - Graphical user interface based on the XFree86 package with GNOME and KDE desktops

    - Full TCP/IP networking for Internet, LANs, and intranets

    - Tools for connecting your PC to your Internet Service Provider by using PPP
    or dialup serial communications programs'
  merge: -1
  pgno: 404
- img_proc: true
  md: '382


    Appendix B


    +   - Complete suite of Internet applications, including electronic mail (send-mail,
    elm, pine, mailx), news (inn, tin, trn), Internet Relay Chat (ircii), TELNET,
    FTP, and NFS

    - Apache Web server 1.3.12 (to turn your PC into a Web server) and Netscape Communicator
    4.74 (to surf the Net)

    - Samba 2.0.7 LAN Manager for Microsoft Windows connectivity

    - Several text editors (GNU Emacs 20.7, vim)

    - Graphics and image manipulation software, such as The GIMP, XPoint, Ghostscript,
    Ghostview, and ImageMagick

    - Programming languages (GNU C and C++ 2.96, Perl 5.6.0, Tcl/Tk 8.3.1, Python
    1.5.2, GNU AWK 3.0.5) and software development tools (GNU Debugger 5.0, CVS 1.10.8,
    GNU Bison 1.28, flex 2.5.4, TIFF, and JPEG libraries)

    - Complete suite of standard UNIX utilities

    - Tools to access and use DOS files and applications (tools 3.9.7)

    - Games such as GNU Chess, Mahjong, Reversi, Minesweeper, FreeCell, Gnobots, and
    AisleRiot


    # Linux Weekend Crash Course Assessment Test


    The CD-ROMs contain 60 multiple-choice questions with answers. The assessment
    test is provided in a Linux-compatible format. You can use them to assess how
    you already know about Linux and thereby determine what sessions you can skip.
    You can also go through the questions after reading individual sessions of this
    book to assess how much you have learned. The questions are organized by session;
    therefore, they follow the order of topics discussed in this book. The session
    each question corresponds with is noted next to each.'
