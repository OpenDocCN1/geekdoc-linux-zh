  md: '# 348 Sunday Afternoon


    before starting the service, it consults the /etc/hosts.allow file to see if the
    host requesting service is allowed that service. If nothing appears in /etc/hosts.allow
    about the, TCP wrapper checks the /etc/hosts.deny file if it should deny the service.
    If both files are empty, TCP wrapper allows the host to access the requested service.


    You can place the line ALL:ALL in the /etc/hosts.deny file to deny all hosts access
    to any Internet services on your system. Then you can add to /etc/hosts.allow
    the names of those hosts that can access services on your system. For example,
    to allow only hosts from the 192.168.1.0 network to access services on your system,
    please follow the following line in the /etc/hosts.allow file:


    ```

    ALL: 192.168.1.0/255.255.255.0

    ```


    If you want to permit a remote host access to a specific Internet service, you
    can use the following syntax for a line:


    ```

    server_program_name: hosts

    ```


