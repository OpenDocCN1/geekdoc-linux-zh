    # Setting Up the Linux PC as a Windows Server with Samba


    If your business relies on Windows for file and print sharing, you probably use
    Windows in your servers and clients. You can move to a Linux PC as your server
    without losing the Windows file and printer sharing because you can set up a Linux
    PC as a Windows server. When you install Red Hat Linux from this book''s companion
    CD-ROMs, you also get a chance to install the Samba software package,


    ![](img/448aa2bd6846782b632c764b035753bc_212_0.png)


    ![](img/448aa2bd6846782b632c764b035753bc_212_1.png)


