  md: '# 178


    # Saturday Afternoon


    This output shows that two interfaces — the loopback interface (lo) and an Ethernet
    card (eth0) — are active on this system. For each interface, you get to see the
    IP address, as well as statistics on packets delivered and sent. For the Ethernet
    card, ifconfig also reports the IRQ (shown as Interrupt: 5) and the base I/O port
    address (0x300). If the Linux system had a dial-up PPP link and up running, you''d
    also see an item for the ppo0 interface in the output.


    # Checking the IP routing table


    Another network configuration command, /sbin/route, also provides status information
    when you run it without any command-argument. If you are having trouble checking
    a connection to another host (that you specify with an IP address), check the
    IP routing table to see whether a default gateway is specified. Then check the
    gateway routing table to ensure that paths to an outside network appear in that
    table.


    A typical output from the /sbin/route command looks like this:


    | Destination Gateway | Mask | Flags Metric Ref Use Interface |

    |---|---|---|---|---|---||

    | 192.168.1.200 * | | 255.255.255 | UM | 0 | 0 | eth0 |

    | 192.168.1.1 | | 255.255.255.0 | U | 0 | 0 | eth0 |

    | 127.0.0.0 | | 0.0.0.0 | U | 0 | 0 | lo |

    | default | 192.168.1.1 | 0.0.0.0 | UG | 0 | 0 | eth0 |


    As this routing table shows, the local network uses the eth0 Ethernet interface,
    and the default gateway is also that Ethernet interface. The default gateway is
    a routing device that handles packets addressed to any network other than the
    one in which the Linux system resides. In this example, packets addressed to any
    network address other than addresses that begin with 192.168.1.x are sent to the
    gateway — 192.168.1.1 — and the gateway forwards those packets to other networks
    (working, of course, the gateway is connected to another network).


    # Checking connectivity to a host


    To check for a network path to a specific host, use the ping command. The ping
    command is widely used TCP/IP tool that employs a series of Internet Control Message
    Protocol (ICMP, often pronounced as echo-comp) messages. ICMP provides for an
    echo message which every host responds. Using ICMP messages and replies, ping
    can determine whether the other system is alive and then compute the round-trip
    delay in communicating with that system.'
