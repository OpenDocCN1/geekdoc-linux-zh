    the modem to answer an incoming call. These commands start with two characters:
    AT (for attention). You can use AT commands for situations in which the communications
    software is primitive and all the software does send the modem whatever you type.


    If you have no changes to make, use the up and down arrow keys to highlight the
    item labeled Save as dfl (meaning save as default), and then press Enter. Minicom
    saves the settings in the /etc/minirc.dfl file — the default file for Minicom.
    After that, you can exit Minicom by selecting Exit from Minicom and pressing Enter.'
