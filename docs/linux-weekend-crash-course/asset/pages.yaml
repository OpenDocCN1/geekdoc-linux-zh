  md: '# Using the CPU processes


    To view the CPU processes — those that use most of the CPU time — you can use
    the top program. To start that program, select Main Menu ⇨ Programs ⇨ Utilities
    ⇨ Top from the GNOME desktop, or type in a terminal window (console). The program
    displays a screen listing the processes, arranged in descending order of CPU usage,
    with other information such as memory and swap space usage. Figure 28-1 shows
    a typical output from the program.


    ![](img/448aa2bd6846782b632c764b035753bc_353_0.png)


    Figure 28-1

    Viewing top CPU processes


    The top utility updates the display every five seconds. You can keep running in
    a window so you can continually monitor the status of your Linux system. Quit
    by pressing Ctrl+C or closing the terminal window.


    The first five lines of the output screen provide summary information about the
    system. Here is what these five lines show:


    +   1. The first line shows the current time, how many users are logged in, and
    three load averages (the average number of processes ready to run during the last
    1, 5, and 15 minutes).


    +   2. The second line shows the total number of processes and the status of these
    processes.


    +   3. The third line shows CPU usage — what percentage of CPU time processes
    employ, what percentage system (kernel) processes use, and what percentage of
    time the CPU is idle.'
