    XFree86-100dpi-fonts-4.0.1-0.43.i386.rpm

    XFree86-30labs-3.3.6-32.i386.rpm

    XFree86-4.0.1-0.43.i386.rpm

    (rest of the listing deleted)


    As you can guess from the listing, all RPM files end with an .rpm-extension. To
    understand the various parts of the filename, consider the following RPM:

    XFree86-4.0.1-0.43.i386.rpm


    This filename has the following parts separated by dashes (-):


    | Package name | XFree86 |

    | Version number | 4.0.1 |

