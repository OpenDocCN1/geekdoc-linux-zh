    # What Is GNOME?


    GNOME stands for GNU Network Object Environment; GNU, as you probably know, stands
    for GNU''s Not UNIX. GNOME is a graphical user interface (GUI) and a programming
    environment. From the user''s perspective, GNOME is the Motif-based Common Desktop
    Environment (CDE) or Microsoft Windows. Behind the scenes, GNOME has many features
    that enable programmers to write graphical applications that can work well. In
    this session, I only point out some key features of the GNOME GUI, and I leave
    the details to you to explore on your own.


    You can always find out the latest information about GNOME by visiting the GNOME
    home page at http://www.gnome.org.'
