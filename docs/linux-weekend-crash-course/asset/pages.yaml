- img_proc: true
  md: '# 176 Saturday Afternoon


    such as name servers and host names. Other distributions also have network configuration
    tools. Refer to the documentation for your distribution to learn to use these
    tools.


    To start the network configuration tool, log in as root, and type netcfg in a
    terminal window to start that program. The network configuration tool displays
    a dialog box, as shown in Figure 14-3.


    ![](img/448aa2bd6846782b632c764b035753bc_199_0.png)


    Figure 14-3 TCP/IP network with the netcfg network configuration tool


    You can configure various aspects of your network through the four buttons at
    the top of the dialog box. Click each button to explore what entries you can add
    or edit. Specifically, these buttons enable you to do the following:


    +   * Names. Enables you to enter the host name for your system and to enter the
    IP addresses of name servers. The name server addresses are stored in the /etc/resolv.conf
    file. The host name is stored in a variable in the /etc/sysconfig/network file.


    +   * Hosts. Shows the current contents of the /etc/hosts file and enables you
    to add, remove, or edit entries. That file contains host names and corresponding
    IP addresses for each host.


    +   * Interfaces. Enables you to add a new network interface, specify the IP address
    of the interface, and activate the interface. This information gets stored in
    various files in the /etc/sysconfig directory.


    +   * Routing. Enables you to add static routes (each route lists the gateway
    to use to reach a specified network).'
