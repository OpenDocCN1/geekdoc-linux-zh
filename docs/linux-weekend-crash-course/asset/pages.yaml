  md: 'Usually, the package name is descriptive enough for you to guess the contents
    of the RPM. The version number is the same as that of the software package''s
    current version number (even when it is distributed in some other form, such as
    a tar file). Red Hat assigns the release number to keep track of changes. The
    architecture should be i386 orarch for the RPMs you want to install on a PC with
    Intel x86-compatible processor.


    # Querying RPMs


    As it installs packages, the rpm command builds a database of installed RPMs.
    You can use the rpm -q command to query this database to find information about
    packages installed on your system, for example, to find the version number (such
    as the following) of the Linux kernel installed on your system, type the rpm -q
    kernel:


    ```

    kernel-2.2.16-21

    ```


    The response is the name of the RPM for the kernel (the executable version of
    the kernel, not the source files). The name is the same as the RPM filename that
    has the last part—.i386.rpm does not appear. In this case, the version part of
    the RPM tells you the kernel is 2.2.16.


    You can see a list of all installed RPMs by typing the following command:


    ```

    rpm -qa | more

    ```


    If you want to search for a specific package, feed the output of rpm -qa to the
    grep command. For example, to see all packages that have kernel in their names,
    type:


    ```

    rpm -qa | grep kernel

    ```


    ```

    kernel-pcmcia-cs-2.2.16-21

    kernel-headers-2.4.0-0.20

    kernel-2.2.16-21

    kernel-source-2.2.16-21

    kernelcfg-0.5-9

    kernel-utils-2.2.16-21

    ```


    You can query more than a package''s version number by using the rpm -q command.
    By adding single-letter options, you can find other useful information about a
    package. For example, try the following command:


    ```

    rpm -ql kernel

    ```'
