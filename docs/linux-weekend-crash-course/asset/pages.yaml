  md: '# Session 21—Understanding How Linux Boots


    This command runs /etc/X11/prefd, which is a symbolic link to a specific display
    manager. For the GNOME graphical desktop (the default in Red Hat Linux), /etc/X11/prefd
    is a symbolic link to /usr/bin/gdm — the GNOME display manager. If you use the
    KDE as your default desktop (the default in the Caldera and SuSE distributions),
    /etc/X11/prefd is a symbolic link to /usr/bin/kdm — the KDE display manager. This
    means regardless of your choice of GUI, init starts a display manager at run level
    5. The display manager, in turn, displays the graphical login box and enables
    you to log into the system.


    If you do not enable the graphical login screen during Linux installation (covered
    in Sessions 1 through 3), you can do so by editing the /etc/inittab file. Locate
    the line containing initdefault, and make sure it reads as follows (the run level
    between two columns should be 5):

    id:5:initdefault:


    ![](img/448aa2bd6846782b632c764b035753bc_286_0.png)


    Before you edit the /etc/inittab file, you should know that any errors in this
    file may prevent Linux from starting up to a point at which you can log in. If
    you cannot log in, you cannot use your system. As I explain next, you can try
    out a specific run level by using the init command before you actually change
    the default run level in the /etc/inittab file.


    # Trying out a new run level with the init command


    To run a new level, you do not have to change the default run level in the /etc/inittab
    file. If you log in as root, you can change the run level (and, consequently,
    the set of processes that run in Linux) with the init command. The init command
    has the format:


    ```

    init runlevel

    ```


    Here, runlevel must be a single character denoting the run level you want. To
    put the system in single-user mode, for example, type the following:


    ```

    init 1

    ```


    Thus, if you want to try run level 5 (assuming your system is not set up for a
    graphical login screen yet) without changing the /etc/inittab file, enter the
    following command at the shell prompt:


    ```

    init 5

    ```'
