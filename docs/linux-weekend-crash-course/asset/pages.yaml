    # Removing RPMs


    You can remove —uninstall a package if you realize you don''t need the software.
    For example, if you install the X Window System development package but you are
    not interested in writing X applications, you can easily remove the package by
    using the rpm -e command.


    You need the name of the package before you can remove it. One good way to find
    the name is to use rpm -qa in conjunction with grep to search for the appropriate
    RPM file. For example, you can type this command:


