  md: '# Session 11—Configuring a Modem


    # Running Minicom as an ordinary user


    You need to do the following before any user can run Minicom:


    +   - Open the text file /etc/minicom.users in a text editor, and verify that
    it has a line with the word ALL. (This enables all users to access to Minicom''s
    default configuration file.) If not, add a line with the word ALL.

    - Assuming that you want all users to be dial out using the modem, any user able
    to read and write to the serial port where the modem is connected. For example,
    if the modem is on COM1 (/dev/ttyS0), type chmod o+w /dev/ttyS0 to give everyone
    write permission for that device.

    - Establish a link between the /dev/modem and the serial port device to which
    the modem is connected. If the modem is on COM1 (/dev/ttyS0), type the following
    command:


    ```

    ln -s /dev/ttyS0 /dev/modem

    ```


    After that, you can run Minicom as an ordinary user. When Minicom runs, it resets
    the modem. Figure 11-3 shows the result of running Minicom in a terminal window.


