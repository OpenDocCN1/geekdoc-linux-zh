  md: "# Creating the Red Hat Boot Disk\n\nTo boot Red Hat Linux for the first time\
    \ and start the Red Hat Linux installation program, you need a Red Hat boot disk.\
    \ For this step, you should turn on your PC without any disk in the A: drive and\
    \ run Windows as usual.\n\n![](img/448aa2bd6846782b632c764b035753bc_35_0.png)\n\
    \n> Tip\nDo not need a boot disk if you can start your PC under MS-DOS—not an\
    \ MS-DOS window in Windows 95—and access the CD-ROM from the DOS command prompt.\
    \ If you run Windows 95/98, restart the PC in MS-DOS mode. However, you may not\
    \ be able to access the CD-ROM in MS-DOS mode because the startup AUTOEXEC.BAT\
    \ and CONFIG.SYS—may not be configured correctly. To access the CD-ROM from DOS,\
    \ you must typically add a CD-ROM driver in CONFIG.SYS and add a line to AUTOEXEC.BAT\
    \ that runs the MSDESC program. Restarting your PC in MS-DOS mode and if accessed\
    \ you may not need a boot disk if your PC is capable of booting from the CD-ROM\
    \ drive. If this is possible, go to your system BIOS and look in the section where\
    \ you can choose the boot drives. If you choose CD-ROM, you can select this option\
    \ and boot directly from the installation CD-ROM. If you succeed, skip this section\
    \ and proceed to Session 2.\n\nThe MS-DOS boot disk, the Red Hat boot disk loads\
    \ essential operating system files on your PC and starts the Red Hat Linux installation\
    \ program. Once you install Red Hat Linux, you no longer need the Red Hat boot\
    \ disk (except when you need to restart Red Hat Linux from the CD-ROMs).\n\nThe\
    \ Red Hat boot disk contains an initial version of Red Hat Linux that you use\
    \ to start Red Hat Linux, prepare the hard disk, and load the rest of Red Hat\
    \ Linux. Creating the Red Hat boot disk involves using a utility program called\
    \ WRITE.EXE to copy a special file called the Red Hat Linux boot image to a disk.\n\
    To create the Red Hat boot disk under Windows, follow these steps:\n\n+   1. Open\
    \ an MS-DOS window (select Start <- Programs <- MS-DOS Prompt).\n\n+   2. In the\
    \ MS-DOS window, enter the following commands at the MS-DOS prompt. (the comments\
    \ are in parentheses, and your input is in boldface):\n   d:   (use the drive\
    \ letter for the CD-ROM drive)\n   cd \\dosutils\n\nraw"
