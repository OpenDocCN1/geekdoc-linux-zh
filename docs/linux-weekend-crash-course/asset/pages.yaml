  md: '# Session 29—Maintaining System Security


    # Log files


    Many Linux system applications, including some servers, write log information
    by using the logging capabilities of syslogd. On Linux systems, the log files
    written reside in the /var/log directory. Make sure only the root user can read
    and write these files.


    You should routinely monitor the log files:


    +   * /var/log/messages contains a variety of logging messages from user logins
    to messages from the TCP wrapper starts.

    * /var/log/secure contains reports from services such as in.telnetd and in.ftpd
    starts.

    * /var/log/maillog contains reports from sendmail.

    * /var/log/xferlog contains reports from all FTP transfers.


    Unfortunately, there is no easy-to-use tool for viewing these log files. The best
    approach is to browse them routinely. You can open the log file in the vi editor
    in read-only mode by typing a command as vi -var/log/messages, which prevents
    you from accidentally overwriting the log file. In the editor, you can search
    for a date of interest and begin browsing from that point.


    Because many potential intruders use port-scanning tools that attempt to establish
    TCP/IP connections to well-known ports on your system, you should look for messages
    that indicate attached connections from unknown hosts (indicated by name or IP
    addresses). For such attached network accesses, you should browse the /var/log/secure
    file. For example, here''s a line in the /var/log/secure file when I connect to
    my Linux system from one of the PCs on the LAN:


    Aug 16 20:18:19 nlb200 xinetd[511]: START: ftp pid=23824 from=192.168.1.40


    The notice pid-23824 that appears next to the word ftp. The process ID of the
    FTP server program xinetd starts. You can use this number to look at corresponding
    messages in the /var/log/messages file to see whether this attempt did or not
    succeed. Here is a sample of how I check this:


    ```

    grep "\[23824\]" messages

    ```


    The output that follows tells me the user naba successfully logged in and some-later
    cleared the FTP session.


    Aug 16 20:30:01 nlb200 ftp[23824]: FTP LOGIN FROM nlb200 [192.168.1.40], naba

    Aug 16 20:30:22 nlb200 ftp[23824]: FTP session closed


    ![](img/448aa2bd6846782b632c764b035753bc_372_0.png)'
  merge: -1
  pgno: 372
- img_proc: true
