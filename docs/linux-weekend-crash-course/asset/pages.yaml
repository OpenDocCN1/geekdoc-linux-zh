    Each line starts with a name of a service followed by a port number and a data
    communications protocol (tcp or udp). The rest of the line shows name for the
    service, if any. Anything following the pound (#) is taken as a comment.


    Browsing the entries in the /etc/services file is instructive as they show the
    breadth of networking services available under TCP/IP.


    During Red Linux installation from this book''s companion CD-ROMs, you can opt
    to install the necessary packages for mail, Web, and news. Other distributions
    provide the same options during installation. All you need to do is select the
    package groups. Mail refers to the e-mail service; WWW refers to the World Wide
    Internet service; News refers to the newsgroups service.


    If you install the mail and news services during Linux installation, you do not
    have to do much more to begin using the mail, Web, and news services. Otherwise,
    you can use the Red Hat Package Manager (RPM) to install individual packages.
    Other Linux distributions, not just the Red Hat Distribution, use the RPM file
    format.


