- img_proc: true
  md: '# Establishing a Security Policy


    The first step in securing your Linux system is to set up a security policy. The
    security policy is your guide (or rules) to what you enable users (as well as
    visitors over the Internet) to do on the Linux system. The level of security depends
    on how you use the Linux system and how much is at risk if someone gains unauthorized
    access to your system.


    If you are a system administrator for Linux systems at an organization of any
    sort, you probably want to involve management as well as users in setting up the
    security policy. Obviously, you cannot create an imposing policy that prevents
    users from working on the system. On the other hand, if you are creating or using
    data from the organization, you have to set up a policy that aims to protect the
    data from disclosure to outsiders. In other words, the security policy should
    strike a balance between users'' needs and the need to protect the system.


    For a standalone Linux system or a home system you occasionally connect to the
    Internet, the security policy can be just a listing of the Internet services you
    want to run on the system and the user accounts you plan to set up system. For
    any larger organization, you probably have one or more Linux systems on a LAN
    connected to the Internet—preferably a firewall (a device that controls the flow
    of Internet Protocol (IP) packets between the LAN and the Internet). In such cases,
    the security policy typically addresses the following areas:


    +   * **Authentication**: Who gets access to the system? What is the minimum length
    and complexity of passwords? How often must you change passwords? How long can
    a user be idle before user is logged out automatically?

    * **Authorization**: What can different classes of users do on the system? Who
    can have the root password?

    * **Data Protection**: What data has to be protected? Who has access to data?

    * **Internet Access**: What restrictions are on users (from the LAN) accessing
    the Internet? What Internet services (such as Web, Internet Relay Chat, and so
    on) users access? Is there a network firewall?

    * **Internet Services**: What Internet services are allowed on each Linux system?
    Are there any file servers? Mail servers? Web servers? What services run on each
    type of server? What services, if any, run on Linux systems used as desktop workstations'
  merge: -1
  pgno: 365
- img_proc: true
  md: '# Session 29—Maintaining System Security


    +   * Security Audits: Who tests whether security is adequate? How often is security
    tested? How are problems found during security testing handled?

    * Responsibilities: Who is responsible for maintaining security? Who monitors
    log files and audit trails for signs of unauthorized access? If a security breach
    occurs, who must be informed?


    The remainder of this session shows you some of the ways in which you can enhance
    and maintain the security of your Linux system.


    # Securing the System


    Once you have defined a security policy, you can secure the system according to
    the policy. The exact steps depend on what you want to do with the system — whether
    it is a server or a workstation and how many users must access the system. The
    general steps for securing the system and maintaining security are as:


    +   * When installing Linux, select only those groups you need for your system.
    Do not install unnecessary software. For example, if your system is a workstation,
    you do not need to install most of the servers (Web server, news server, and so
    on).

    * Create user accounts and make all passwords are strong ones that password-cracking
    programs can’t “guess.” As you’ll learn soon, Linux contains the tools you need
    to enforce strong passwords.

    * Enable only those Internet services you need on a system. In particular, do
    not enable services not properly configured. Later in this session, you will learn
    about enabling and disabling Internet services.

    * Periodically check various log files for signs of break-ins or attempted break-ins.
    These log files are in the /var/log directory of your system.

    * Check security news by regularly visiting and installing updates from your distribution''s
    Web site once a fix becomes available.


    # Securing passwords


    Historically, UNIX passwords are stored in the /etc/passwd file, which any user
    can read. For example, a typical old-style /etc/passwd file entry for the root
    user looks like this:


    ```

    root:t627NWDK1K8Su:0:0:root:/bin/bash

    ```'
  merge: -1
  pgno: 366
- img_proc: true
  md: 'The fields are separated by colons (:), and the second field contains the password
    in encrypted form. To check if a password is valid, the login program encrypts
    the plain-text password the user enters and compares the password with the contents
    of the /etc/passwd file. If there is a match, the user is allowed to log in.


    Password-cracking programs work just like the login program except that password-cracking
    programs work one password at a time from a dictionary, encrypted word, and compare
    the encrypted word with the encrypted passwords in the /etc/passwd file for a
    match. To crack the password, the intruder needs the /etc/passwd file. Often,
    attackers use weaknesses of various Internet servers (such as mail and FTP) to
    get a copy of the /etc/passwd file.


    Recently, several improvements have been made to make UNIX secure. These include
    shadow passwords and pluggable authentication modules, which are described in
    the next two sections.


    # Linux includes password security enhancements by selecting them during installation.
    In Session 3, as you complete the Red Hat installation, one step involves selecting
    on an Authentication Configuration screen. If you accept the default selections—Enable
    MD passwords and Enable shadow passwords—you automatically enable more secure
    passwords in Red Hat Linux.


    ![](img/448aa2bd6846782b632c764b035753bc_367_0.png)


    # Shadow Passwords


    Instead of storing passwords in the /etc/passwd file, which any user can read,
    passwords are now stored in a shadow password file. In Linux, the shadow passwords
    are in the /etc/shadow file. Only the super user (root) can read this file. For
    example, here is the entry for root in the new-style /etc/passwd file:


    ```

    root:x:0:0:root:/root/bash

    ```


    As you can see, the second field contains an x instead of an encrypted password.
    The encrypted password is now stored in the /etc/shadow file where the entry for
    root is:


    ```

    root$$AAAnny/yN$eShZlp99QgcfoB1f050:11077:0:99999::-:13540356

    ```


    The format of the /etc/shadow entries with colon-separated fields differs. The
    entries in the /etc/passwd file, but the means of many fields differ. The first
    field is still the user name, and the second field is the encrypted password.'
  merge: -1
  pgno: 367
- img_proc: true
  md: '# Session 29—Maintaining System Security


    The remaining fields in /etc/shadow entry control when the password expires. You
    do not need to interpret or change these entries in the /etc/shadow file. Instead,
    you should use the chage command to change the password expiration information.
    For starters, you can check a user''s password expiration information by using
    the chage command with the -l option as follows (in this case, you have to be
    logged in as root):


    ```

    chage -l root

    ```


    In this case, the following output shows various expiration information: you can
    change the root password any time (that''s zero minimum time means); it lasts
