    # Accessing Windows resources with smclient


    You can use the smclient program to access shared directories and printers on
    Windows systems on the LAN, as well as to check that your Linux Samba server is
    working. One quick way to check is to use the smclient -L command to view the
    list of servers on your Linux server itself.


    If you have other Windows servers on the LAN, you can look at their services using
    the smclient program. Here is the smclient command I use to view the services
    on my 48 PC running Windows 95:


    ```

    smclient -L Lnb486

    ```


    You can also use smclient to access a disk on a Windows server, as well as to
    send a file to a Windows printer. The smclient program is similar to ftp—you connect
    to a Windows server and then use commands to exchange and send files to the printer.


    The following example how I use smclient to access a disk on my Windows 98 PC
    and view its directory (I use the command smclient //lnbp400/c naba in a terminal
