    # Ghostview


    Ghostview is an X-based graphical front end to the Ghostscript interpreter. Ghostview
    is ideal for viewing and printing PostScript documents. For a long document, you
    can even print selected pages. You can also view the document at various levels
    of magnification (zooming in or out).


    To run Ghostview, type ghostview & in a terminal window. This command causes the
    Ghostview window to appear. The window is divided into three parts:


    +   - Along the top edge, you have eight buttons. The first six buttons are menu
    buttons; when you click any of these buttons, a menu appear.


    +   - On the left side, you see several more buttons, text boxes for information
    display, and scroll bars for scrolling the image.


    +   - The large area occupying most of the Ghostview window is the work area where
    Ghostview displays the PostScript document.


    To load and view a PostScript document in Ghostview, select File Open or click
    the Open button on the left side of the Ghostview window. This action causes Ghostview
    to display a file-selection dialog box. Use this dialog box to select a PostScript
    file. You can choose one of the PostScript files that come with Ghostscript. For
    example, select the file tiger.ps in the /usr/share/ghostscript/5.50/examples
    directory.


    > Your system has a version of Ghostscript later than 5.50, you have to use the
    new version number in place of 5.50.


    ![](img/448aa2bd6846782b632c764b035753bc_263_0.png)


    To open the selected file, click the Open button in the file-selection dialog
    box. Ghostview opens the selected file, processes its contents, and displays the
    output in its window (as shown in Figure 19-5).


    In the last two buttons on the upper-right corner of the window, Ghostview displays
    the current filename and the date the file was created. Ghostview takes this information
    from the comments in the PostScript file itself, not from the time stamp of the
    file.'
