  md: '# # Acknowledgments


    I am grateful to Terri Varveris for giving me the opportunity to write Linux Weekend
    Crash Course — a guide that teaches Linux over a weekend. Thanks to Terry Collings
    for revising the text to accommodate recent changes to the Linux operating system
    and applications. As the project editor, Terry O''Donnell guided the book through
    to its successful completion. Terry Collings and I appreciate the guidance and
    support that Terry O''Donnell provided during this project.


    I would like to thank Matthew Hayden for reviewing the manuscript for technical
    accuracy.


    Thanks to everyone at Hungry Minds, Inc., for transforming the raw manuscript
    into this well-edited and beautifully packaged book.


    Of course, there would be no reason for this book if it were not for Linux. For
    this, I have Linux Torvalds and the legions of Linux developers around the world
    to thank. Thanks also to Red Hat for providing a copy of Red Linux for this book.


    Finally, and as always, my greatest thanks to my wife, Leha, and our daughters,
    Ivy, Emily, and Ashley — it is their love and support that keep me going. Thanks
    for being there!'
