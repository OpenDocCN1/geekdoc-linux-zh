    In this case, the following search result shows three candidate commands, with
    a brief description. You can then select the command that does what you want to
    do.


    +   * modprobe (8) high level handling of loadable modules

    * pnprobe (8) scan Isa for Pnp sound cards

    * SuperProbe (1x) probe for and identify installed video hardware


    > apropos displays a long list of commands that scroll by too fast to read, you
    can type apropos keyword | more to view the output one screen at a time.


