  md: '# Saturday Morning


    The Linux file system provides a unified model of all storage in the system. The
    file system has a single root directory, indicated by a forward slash (/). Then
    there is a hierarchy of files and directories. Parts of the file system can reside
    on different physical media such as a hard disk, floppy disk, and CD-ROM. Figure
    7-1 illustrates the concept of the Linux file system and how it spans multiple
    physical devices.


