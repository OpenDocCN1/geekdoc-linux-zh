  md: '# Installing the Source Files and Rebuilding the Kernel


    Rebuilding the kernel refers to creating a new binary file for the core Linux
    operating system. This binary file runs when Linux boots. You may have to build
    the kernel for various reasons:


    +   - After you apply kernel patches that update the operating system’s source
    files, you have to rebuild the kernel and reboot the system to use the new kernel.

    - After you initially install Linux, you may want to create a new kernel that
    includes support for only the hardware installed on your system. In particular,
    if you have a SCSI driver. The kernel in the companion CD-ROMs contains the SCSI
    driver as an external module you must load at startup.

    - If you have a system with hardware for which only experimental support is available,
    you have to rebuild the kernel to include that support in the operating system.


    > Before you rebuild the kernel, make sure you have the emergency boot floppy
    (covered in Session 3) you prepare when installing Red Hat Linux. If you have
    installed a different distribution of Linux, be sure you have an appropriate boot
    disk. If the system does not boot after you rebuild the kernel, you can use the
    emergency boot floppy to start the system and to repeat the kernel’s rebuild process.


    > Never rebuild and install a new kernel without making sure you have an emergency
    boot floppy. If you do not create the boot floppy during Linux installation, use
    the /sbin/mkbootdisk command to learn the syntax of that command.


    Rebuilding the kernel involves the following phases:


    +   - Installing kernel source files

    - Configuring the kernel

    - Building the kernel

    - Building and installing the modules (if any)

    - Installing the kernel and setting up LILO


    Subsequent sections describe the phases of kernel building.'
