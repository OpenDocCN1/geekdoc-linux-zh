  md: '# Session 5—Configuring the X Window System


    # Running the X Server in 16-Bit Color


    Applications, such as the Apprixware office suite, require you to run the X server
    in 16-bits per pixel mode (also referred to as a 16-bit color depth). To make
    the X server start with a 16-bit color depth, perform the following steps:


    +   1. Open the /etc/X11/XF86Config file using your favorite text editor. (In
    Caldera and SuSE the file is /etc/XF86config.)


    +   2. Locate the Screen corresponding to the X section that corresponds to your
    X server. For example, if you use the SVGA server, look for the Screen section
    that has svga as the Driver entry.


    +   3. Just before the first Display subsection, insert the following line:

    DefaultColorDepth16


    This forces the X server to use a 16-bit color depth. The X server uses the information
    from the Display subsection that specifies Depth as 16.


    +   4. Save the XF86Config file.


    +   5. If X is running (and assuming you have enabled the graphical login screen),
    press Ctrl+Alt+Backspace to stop the X server and force it to restart. It should
    now use a 16-bit color depth.


