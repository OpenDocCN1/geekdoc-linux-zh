  md: 'Disk Druid gathers information about the hard drives on your system and displays
    a list of disk drives in the lower part of the screen and the current partition
    information for one of the drives in the Partitions list in the upper part of
    the screen. For each partition, Disk Druid shows five fields:


    +   - Mount Point indicates the directory where the operating system will mount
    the partition. For example, if you have only one partition for the Linux file
    system, the mount point will be the root directory (/). For the swap partition,
    this field shows `Swap`. If this field appears as `<not set>`, you have to specify
    a mount point. To do so, select the partition and click the Edit button.

    - Device refers to the partition''s name. For example, hda1 is the first partition
    on the first IDE drive.

    - Requested field shows how much space the partition has. For example, if the
    partition has 256MB of space, this field appears as 256M.

    - Actual field shows the amount of disk space the partition is using. Usually,
    the Requested and Actual fields are the same, but they may differ for partitions
    that can grow.

    - Type shows the partition''s type, such as Linux Native or DOS.


    If there are no partitions defined, the table in the Partitions list is empty.
    You have to add new partitions by clicking the Add button.


    You perform disk setup tasks in Disk Druid through the five buttons that run across
    the middle of the screen. Specifically, the buttons perform the following actions:


    +   - Add enables you to create a new partition, assuming there is enough disk
    space available. When you click this button, another dialog box appears in which
    you can fill in information necessary to create a partition.

    - Edit enables you to alter the attributes of the partition currently highlighted
    in the Partitions list. You make changes to the current attribute in another dialog
    box that appears when you click the Edit button.

    - Delete removes the partition currently highlighted in the Partitions list.

    - Reset causes Disk Druid to ignore any changes you have made.

    - Make RAID device sets up a RAID (Redundant Array of Inexpensive Disks) device
    — a technique that combines multiple disks to improve reliability and data transfer
    rates. There are several types of RAID configurations. This button is active only
    if your system has the hardware necessary to support a RAID device.'
