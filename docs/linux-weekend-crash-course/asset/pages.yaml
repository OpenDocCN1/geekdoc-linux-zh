  md: '# Session 2—Partitioning the Hard Drive


    # Naming disks and devices


    The first step is to understand how Red Hat refers to the various disks. Linux
    treats all devices as files and has actual files that represent each device. In
    Red Hat Linux, these device files are in the /dev directory. If you are new to
    UNIX, you may not know about UNIX filenames. But you will learn more as you continue
    to use Red Hat Linux. If you know MS-DOS filenames, you will find Linux filenames
    are similar. However, you have two exceptions: they do not use drive letters (such
    as A: C) and they substitute the slash (/) for the MS-DOS backslash (\) as the
    separator between directory names.


    Because Linux treats a device as a file in the /dev directory, the hard disk names
    start with /dev. Table 2-1 lists the hard disk drive and floppy drive names that
    you may have to use.


    # Table 2-1

    Hard Disk and Floppy Drive Names


    | Name | Description |

    | --- | --- |

    | /dev/hda | First Integrated Drive Electronics (IDE) hard disk drive (the C:
    drive in DOS and Windows) |

    | /dev/hdb | Second hard disk drive |

    | /dev/sda | First Small Computer System Interface (SCSI) drive |

    | /dev/sdb | Second SCSI drive |

    | /dev/f00 | First floppy drive (the A: drive in DOS) |

    | /dev/fd1 | Second floppy drive (the B: drive in DOS) |


    > When Druid displays the list of partitions, the partition names take the form
    hda1, hda2, and so on. Linux constructs each partition by appending the partition
    number (1 through 4 for the four primary partitions on a hard disk) of the disk''s
    name. Therefore, if your PC''s single IDE hard drive has two partitions, not that
    the installation program uses hda1 and hda2 as the names of these partitions.'
