    Only then can you mount the device CD-ROM again on another directory in the Linux

    file system.


    I have shown the longer syntax for the mount command in which you

    explicitly specify the device name and the mount point, but Linux contains a line

    in /etc/fstab file that enables you to mount the CD-ROM through one of the

    following commands:


    ```

    mount /mnt/cdrom

    mount /dev/cdrom

    ```


    It is customary to mount devices in directories in the /mnt directory. Linux

    comes with two predefined directories: /mnt/cdrom for mounting the CD-ROM and

    /mnt/floppy for mounting the floppy.


    In addition to mount and umount, you should know two more commands — df

    and du — that enable you to check the disk space usage. These commands are sim-

    ple to use. The df command shows you a summary of disk space usage for all

    mounted devices, as we show in this example:


    | Filesystem | k-blocks | Used Available% Mounted |

    | /dev/hda2 | 2000236 | 1103852 | 794776 | 59 % / |

    | /dev/hda1 | 2096160 | 1833600 | 262560 | 88 % / /doc |

    | /dev/hdc | 655660 | 655660 | 0 | 100 % / /mnt/cdrom |


    The output is a table that shows the device, total kilobytes of storage, how

    much is used, how much is available, the percentage used, and the

    m point. For example, on my system, the /dev/hda2 device (a disk partition)

    is mounted on the Linux file system’s root directory (/). It has about 2GB of
    storage,

    of which 1.1GB (59 percent) are used and 794MB are available. Similarly, we

    see from the last line that the CD-ROM has about 656MB of storage in.

    The command is useful for finding out how much space directory takes up.

