  md: 'As the output shows, all files with names starting with K and S are symbolic
    links to scripts that reside in the /etc/rc.d and /etc/rc.d/init.d directories.
    In fact, the /etc/rc.d script executes these files exactly in the order they appear
    in the directory listing.


    > Note that the last file in the directory listing is a symbolic link to the ...rc.local
    script. This means that /etc/rc.d is executed after all other scripts. You can
    place any command in that script you want whenever your Linux system boots.


    ![](img/448aa2bd6846782b632c764b035753bc_289_0.png)


    Most of the startup scripts reside in directory /etc/rc.d/init.d. You can manually
    invoke scripts in the directory to start, stop, or restart specific processes
    — universally. For example, to stop the Web server, you type the following command:


    ```

    /etc/rc.d/init.d/httpd stop

    ```


    The following response displays:


    ```

    Shuting down http: [ OK ]

    ```


    You can enhance your system administration skills by familiarizing yourself with
    the scripts in the /etc/rc.d/init.d directory. To see the following list, type
    the ls /etc/rc.d/init.d command:


    | anacron halt keytable netfs sendmail ybind | apmd http killall network random
    single ypassword | apache indent kudzu nfs rawdevices smb ypserv | atd linux nfslock
    rstat snmpd | crond ipchains pcmia rersud syslog | functions isdn mars-we portmap
    rwald xfs | gpm kcodecrate named postgres rhod inetd |


    The script names give you some clue about what server the script can start and
    stop. In fact, nfs scripts start and stops the processes required for NFS (Network
    File System) services. At your leisure, you may want to study some of these scripts
    to see what each script does. You don''t have to understand all the shell programming;
    the comments should help you learn the purpose of each script.


    ![](img/448aa2bd6846782b632c764b035753bc_289_1.png)'
