  md: '# Session 10—Linux Text Editors


    The vi editor initially positions the cursor on the first character. One of the
    things you need to learn is to move the cursor around. Try the following commands.
    Just type the letter, and vi responds.


    +   j Moves the cursor one line down

    k Moves the cursor one line up

    h Moves the cursor one character to the left

    l Moves the cursor one character to the right

    w Moves the cursor one word forward

    w Moves the cursor one word backward

    Ctrl-d Moves half a screen

    Ctrl+u Scrolls half a screen


    Luckily, you can also move the cursor by using the arrow keys. If you cannot remember
    the meaning of jkhl characters, just use the arrow keys to move around the file.


    ![](img/448aa2bd6846782b632c764b035753bc_154_0.png)


    You can go to a specific line number at any time. This is when a colon command
    comes in. To go to line 1, for example, type the following and press Enter:


    :1


    When you type the colon, vi displays the colon on the last line of the screen.
    From on, vi uses the text you type as a command. You have press Enter to submit
    the command to vi. In colon mode, vi accepts all the commands that the ed editor
    accepts—and then moves.


    To search for a string, first type a slash (/). The vi editor displays the slash
    on the last line of the screen. Type the search string and then press Enter. The
    vi editor locates the string and positions the cursor at the beginning of that
    string. Thus, to locate the string cdrom in the file /etc/fstab, type:


    ```

    /cdrom

    ```


    To delete the line that contains the cursor, type dd (two lowercase ds). The vi
    editor deletes that line of text and makes the next line the current one.


    To begin entering text in front of the cursor, type i (a lowercase i by itself).
    The vi editor switches to text input mode. Now you can enter text. When finishing
    entering text, press Esc to return to visual command mode.'
