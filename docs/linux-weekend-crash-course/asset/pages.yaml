  md: '# Session 7—Linux File and Directory Structure


    indicates no permission for a specific operation on the file. Thus, the string
    rw-means the owner has read and write permission, but not execute permission.
    Think of these nine letters as three groups of three letters (rwx), interpreted
    as follows:


    +   - The leftmost group of rwx controls the read, write, and execute permission
    of the file''s owner.

    - The middle three rwx letters control the read, write, and execute permission
    of any user belonging to that file''s group.

    - The rightmost group of rwx letters controls the read, write, and execute permission
    of all other users (collectively referred to as the world).


    Thus, a file with the permission setting rwx------ is accessible only to the file''s
    owner. Meanwhile, the permission setting rxr-r-- makes the file readable by the
    world.


    Each of the three groups of letters is assigned a number value. The r is 4, the
    w is 2, and the x is 1. The chmod command uses these numbers to change file permissions.
    To set full permissions for yourself, set the first number to seven. To deny permission,
    set all numbers to zero. Following are some examples showing the command and the
    results.


    ```

    chmod 700 filename rwx

    chmod 777 filename rwxrxrxr

    chmod 644 filename rw-r---

    chmod 000 filename

    ```


    Typically, executable programs (including shell programs) have execute permission.
    However, for directories, the execute permission is equivalent to a use permission
    — a user must have execute permission on a directory to open and read the contents
    of the directory.


