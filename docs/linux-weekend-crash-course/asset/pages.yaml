  md: '# Setting Up an Ethernet LAN


    Ethernet is a standard way to move packets of data among two or more computers
    connected to a single cable. To set up an Ethernet LAN, you need an Ethernet card
    for each PC. Linux supports a wide variety of Ethernet cards for the PC.


    Ethernet is a good choice for the physical data-transport mechanism because it''s
    a proven, low-cost technology that provides good data transfer rates — typically
    10 million bits per second (10 Mbps), although there are now 100 Mbps and even
    Gigabit Ethernet.


    In an Ethernet LAN, computers are connected to the network with cables. Nowadays,
    there are two popular forms of Ethernet cables. The first option is ThinNet, or
    Base2, or 10Base2 which uses a thin, flexible coaxial cable. The more recent and
    popular alternative is Ethernet over unshielded twisted pair (UTP) cable, known
    as 10BaseT.


    To set up a 10BaseT Ethernet, you need an Ethernet hub — a hardware box with RJ-45
    jacks. You build the network by running twisted-pair wires (usually, Category
    5 or Cat5 cables) from each PC''s Ethernet card to this hub. Nowadays, you can
    get an 8-port 10BaseT hub for about $50 (U.S.). Figure 14-1 shows a typical, small
    10BaseT Ethernet LAN you might set up at a small office or your home.


    ![](img/448aa2bd6846782b632c764b035753bc_195_0.png)


    Figure 14-1

    A 10BaseT Ethernet LAN with a hub'
  merge: -1
  pgno: 195
- img_proc: true
  md: 'ThinNet Ethernet does not need a hub, which makes it attractive for small offices
    or home offices that have more than one PC. You can simply daisy chain the ThinNet
    cable from one PC to another and construct a small Ethernet LAN, as shown in Figure
    14-2.


    # PC with Ethernet card 50 ohm terminator


    ![](img/448aa2bd6846782b632c764b035753bc_196_0.png)


    BNC T connector 10Base2 cable


    Figure 14-2

    A small ThinNet LAN


    As Figure 14-2 shows, you need Ethernet cards in the PCs. The cards should have
    Thinete connectors, known as BNC connectors. You also need segments of ThinNet
    cable (technically known as RG-58 thin coaxial cables with 50-ohm impedance).
    For each Ethernet card''s BNC connector, you need a BNC T-connector (so because
    the connector looks like a T), and you need two 50-ohm terminators for the two
    end points of the Ethernet network. Then all you have to do complete your Ethernet
    LAN is connect the parts in the manner shown in Figure 14-2. ThinNet is easy to
    set up, but it''s not convenient to connect a large number of PCs this way. One
    problem is that any break in the cable causes the entire work to crash.


    You can also connect a 10Base2 LAN with a 10BaseT LAN by using a hub that has
    a 10Base2 port and multiple 10BaseT ports.


    > On a 10Base2 LAN you can''t simply connect the two Ethernet cards with a cable.
    Remember you have to use the BNC T-connectors and 50-ohm terminators even if you
    are connecting only two PCs on a 10Base2 LAN.


    ![](img/448aa2bd6846782b632c764b035753bc_196_1.png)'
  merge: -1
