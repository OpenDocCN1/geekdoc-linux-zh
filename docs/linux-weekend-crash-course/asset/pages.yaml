    As the example shows, each line in the file starts with an IP address, followed

    by the host name for that IP address. You can have more than one host name for
    a

    given IP address.


    # /etc/networks


    The /etc/networks configuration file is another text file that contains the names

    and IP addresses of networks. These network names are commonly used in the

    routing command (/sbin/route) to specify a network by name instead of by its IP

    address.


    > Don''t be alarmed if your Linux PC does not have the /etc/

    etworks file. Your TCP/IP network works fine without this file.

    In fact, the Red Hat installation program does not create a

    /etc/networks file.


    # /etc/host.conf


    The /etc/host.conf configuration file specifies how Linux obtains the IP

    address that corresponds to a host name. Type cat /etc/host.conf to view the

    contents of this file. Typically, this file contains the following lines:


    ```

    order hosts, bind

    multi on

    ```


    The entries in the /etc/host.conf file tell the resolver library what services
    to

    use, and in which order, to resolve names.'
