    p:powerfall:/sbin/shutdown -f -h z2 "Power Failure: System Shutting Down"


    # If power was restored before the shutdown kicked in, cancel it.

    pr:12345:respawn:/sbin/powerokwait:shutdown -c "Power Restored; Shutdown Cancelled"


    +   # Run getys in standard runlevels

    1:23456:respawn:/sbin/mingetty tty1

    2:23456:respawn:/sbin/mingetty tty2

    3:23456:respawn:/sbin/mingetty tty3

    4:23456:respawn:/sbin/mingetty tty4

    5:23456:respawn:/sbin/mingetty tty5

    6:23456:respawn:/sbin/mingetty tty6


    # Run xdm on runlevel 5

    # xdm is not a separate service

    x5:respawn:/etc/X11/predfdm -nodaemon


    Lines that start with a hash mark (#) are comments. The first non-comment line

    in the /etc/initab file specifies the default run level as:


    ```

    id:5:initdefault:

    ```


    Even though you do not know the syntax of the /etc/initab file (and you)

    really do not have to learn the syntax, you probably can guess that the 5 in that

    line denotes the default run level for the graphical login screen. Thus, if you
    want

    your system to run at level 3 after startup (for a plain text-mode login screen),
    all

    you have to do is change 5 to 3.


    > Type man initab to see the detailed syntax of the entries

    the initab file.


    In regard to the file format of the /etc/initab file, each entry in the

    /etc/initab file specifies a process that init should start at one or more speci-

    fied run levels. Simply list all the run levels at which the process should run.
    Each

    entry in the initab file has four fields—separated by colons—in the following

    format:


    ```

    id:runlevels:action:process

    ```'
