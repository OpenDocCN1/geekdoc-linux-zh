  md: '# Saturday Morning


    port, it is easy to configure a printer from an X utility program. To see if Linux
    detected the parallel port, type dmesg | grep par in a terminal window. The dmesg
    command provides information about kernel parameters. In this instance the parameter
    you want to see is the parallel port. Here is typical output from this command:


    ```

    port00: PC-style at 0x378 [SPP,PS2]

    port00: no IEEE-1284 device present

    lp0: using parport0 (polling)

    ```


    The first line with the word parport0 is how Linux identifies the first parallel
    port. The remainder of the line specifies the characteristics and address of the
    port, which in this case is a PC-style located at 0x378. Parallel ports are typically
    at 0x378 and, although not shown, interrupt 7.This line essentially indicates
    that the operating system has detected the parallel port.


    # Linux Printing Basics


    Under Linux, print jobs are typically sent to the printer through print queues.
    Data sent to the printer is first buffered in a print queue and then sent to the
    printer by a program called a print spooler. The print spooler also ensures that
    print jobs sent simultaneously to the print queue are sequentially to the printer
    to avoid causing printer conflicts.


    Data to be printed is usually in a format that the printer cannot understand,
    and a program known as a print filter usually translates data. The print filter
    translates data to a standard print language such as ASCII text, PostScript, PCL
    3, PCL 5, or PCL 6.


    PostScript is the standard Unix/Linux print language. Because PostScript printers
    are somewhat expensive, Linux uses a filter program called Ghostscript to translate
    PostScript into PCL 3, 5, or 6. HP and other compatible inkjet printers use PCL
    5 and 6.


    It is possible to use any printer as long as it understands one of the languages
    mentioned here. However, if the printer does not recognize one of the standard
    languages you discussed, printer usually will not work with Linux and only work
    with the operating system for which it was designed. These printers are known
    as GDI printers (sometimes Winprinters) and will only work with Microsoft Windows.
    If you are considering buying a printer to use with Linux, be sure it is not a
    GDI printer. Check the Printer Compatibility How-To before buying any printer
    for use with Linux.'
