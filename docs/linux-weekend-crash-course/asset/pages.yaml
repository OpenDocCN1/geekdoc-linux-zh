- img_proc: true
  md: '# Connecting a Modem to the PC


    When you install Red Hat Linux from this book''s companion CD-ROMs, you auto-matically
    install tools you can use to dial out from your Linux system with a modem. Other
    distributions also include tools you can use for dialing out. Before you can dial
    out, however, you have to make sure that you have a modem properly connected to
    one of the serial ports of your PC and the Linux devices for the serial ports
    are set up correctly. Make sure that your modem is properly connected to the power
    supply and that the modem is also connected to the telephone line.


    If you have an external modem, you need the right type of cable to connect the
    modem to the PC. You need a straight-through serial cable to connect the modem
    to the PC. The connectors at the ends of the cable depend on the type of serial
    connector on your PC. The modem end of the cable needs a male 25-pin connector.
    The PC end of the cable often is a female 9-pin connector. You can buy cables
    at most computer stores. The 9-pin female — 25-pin male modem cables are often
    sold under the label "AT Modem Cable."


    > If you have an internal modem, all you have to connect the phone line to a phone
    jack at the back of the internal card. (There are some modems that will only work
    with Microsoft Windows. The Linux community calls these modems winmodems, and
    if you have one of these winmodems, the instructions in this section will not
    make it.)


    # Learning the serial-port device names


    The PC typically has two serial ports, called COM1 and COM2 in MS-DOS parlance.
    (Most new PCs with a Universal Serial Bus have only one serial port.) The PC can
    support two more serial ports: COM3 and COM4. Because of these port names, the
    serial ports are often referred to as COM ports.


    Like other devices, the serial ports need interrupt request (IRQ) numbers and
    I/O port addresses. Two IRQs—3 and 4—are shared among the four COM ports. Table
    11-1 lists the IRQs and I/O port addresses assigned to the four serial ports.
    Like other devices in Linux, device files in the /dev directory represent the
    serial port devices. Table 11-1 shows the serial device names corresponding to
    the PC''s COM ports.'
  merge: -1
  pgno: 163
- img_proc: true
  md: '# Session 11—Configuring a Modem


    Table 11-1

    Device Names for Serial Ports


    | COM Port | Device Name | IRQ | I/O Address |

    |---|---|---|--|

    | COM1 | /dev/tty0 | 4 | 0x3f8 |

    | COM2 | /dev/tty1 | 3 | 0x2f8 |

    | COM3 | /dev/tty2 | 4 | 0x3e8 |

    | COM4 | /dev/tty3 | 3 | 0x2e8 |


    If you install Red Linux from this book''s companion CD-ROMs, all these devices
    should already be in your system. Other distributions also install these devices.
    If you check the /dev directory, you should find the /dev/ttyS devices in which
    * is 0, 1, 2, and 3. From a terminal window, type ls -1 /dev/ttyS* to see a list
    of these device files


    # Checking if Linux detects the serial devices


    When you install Linux, the necessary Linux serial devices are automatically created
    for you. You should have the /dev/ttyS* devices for dialing in and out through
    the modem.


    To verify that Linux detects the serial port correctly, check the boot messages
    with dmesg:


    ```

    dmesg | grep ttyS*

    ```


    If you see a message as the following, Linux detects a serial port in your PC:

    ttyS1 at 0x2f8 (irq = 3) is a 1650A


    In this case, the message indicates that Linux detects the second serial port
    (COM2). It shows the I/O address (0x2F8) and IRQ (3). The last part of the message
    —1650A— refers to the identifying number of the universal asynchronous receiver/transmitter
    (UART) chip, which is at the heart of all serial communications hardware. The
    UART converts each byte to a stream of ones and zeros and back to bytes when needed.


    The boot messages are also stored in the /var/log/messages file. Therefore, you
    can search for the serial port name in the /var/log/messages file with the grep
    command, as follows:


    ```

    grep ttyS /var/log/messages

    ```


    ![](img/448aa2bd6846782b632c764b035753bc_164_0.png)'
  merge: -1
  pgno: 164
- img_proc: true
  md: 'You can also check for the serial ports with the setserial command. Type the

    following command to see detailed information about the serial ports:


    ```

    setserial -dev/ttyS*

    ```


    A telltale sign of a problem is a message from setserial that shows the UART

    as unknown (as shown in the following example):


    ```

    /dev/ttyS0, UART: unknown, Port: 0x3f8, IRQ: 4

    ```


    If the UART shows up as above, Linux does not detect the serial port.


    ![](img/448aa2bd6846782b632c764b035753bc_165_0.png)


    Red Hat Linux not detecting the serial port usually occurs

    because your BIOS is set up to expect a Plug and Play (PnP)

    operating system. Reboot your PC


    # # Dialing Out with Minicom


    After you complete the physical installation of the modem and verify that the
    nec-essary Linux device files exist, you can try to dial out through the modem.

    The best approach is to use the Minicom serial communications program included
    in

    The Red Hat Linux distribution on this book''s CD-ROMs and installed in the

    /usr/bin directory. The Minicom program is a serial communications program with

    ate text-based interface that emulates a VT102 terminal. Minicom is similar to
    other\communications software such as Procomm or Crosstalk, which you may have
    used

    er MS-DOS or Windows. Minicom may also be included with other Linux distrib-utions.
    Check the documentation from your version to see whether it is included.


    20 Min.

    To Go


    # # Running Minicom as the root user


    To run Minicom, type minicom at the shell prompt in the terminal window or in
    a

    virtual console. If you run Minicom as a normal user (not root), Minicom displays'
