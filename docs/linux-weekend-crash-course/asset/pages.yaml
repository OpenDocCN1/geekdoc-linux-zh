  md: '# Installing Red Hat Linux in Text Mode


    The Red Hat installation program attempts to use a minimal X Window System (X)
    to display the graphical user installation screens. If the program fails to detect
    a video card, X does not start. If—for this reason or any other reason—X fails
    to start, you can always fall back on the older text mode installation program
    to specify the video card manually. You can also use the text mode installation
    if you are comfortable with the older installation program.


    To use text installation, type text at the boot: prompt after you start the PC
    from the Red Hat Linux boot floppy. Then on, the basic sequence is similar to
    that of the graphical installation described in Session 2. However, many small
    details are different. You should be able to respond to the prompts and perform
    the installation.


    In text mode, when the installation program fails to detect the video card, it
    displays a list of video cards. Select one video card from the list. Because of
    your help in selecting the video card, X may work when you install in text mode.
    If it does not, you can configure X using the information in the “Configuring
    X” section that appears later in this session and in session 5.


    # Red Hat Linux in Expert Mode


    If the Red Hat installation program does not detect your SCSI controller or network
    card, you can specify these devices manually by running the installation in expert
    mode. Look for any indication of SCSI or network devices in the messages displayed
    by the Linux kernel as it boots. To view these messages, press Ctrl+Alt+F4. This
    switches to a text-mode virtual console where the messages appear. A virtual console
    is a screen of text or graphical information stored in memory that you can view
    on the physical screen by pressing the appropriate key sequence.


    To run the installation in expert mode, type expert at the boot: prompt in the
    initial text screen that appears during the Red Hat Linux installation. The installation
    program then displays another text screen that asks for a disk driver, if you
    have one.


    Your hardware vendor provides a floppy disk with Linux drivers. If you have that
    disk, press Enter, and a dialog box prompts you to insert the disk into the A:
    drive. After you do so, press Enter, and the installation program loads the driver
    and guides you through steps necessary to install the driver.'
