- img_proc: true
  md: 'The system should end all current processes and enter run level 5. By default,
    the init command waits 20 seconds before stopping all current processes and starting
    the new processes for run level 5.


    > Switch to run level 5 immediately, type the command

    init -t0 5. The number after the -t option indicates the number of seconds that
    init waits before changing the run level.


    You can also use the telinit command, a symbolic link to init. If you make changes
    to the /etc/inittab file and want to reload its configuration, use the command
    telinit.


    # Understanding the Linux Startup Scripts


    The init process runs a number of scripts at system startup. Notice the lines
    that appear near the beginning of the /etc/inittab file:


    +   * System initialization.

    si::sysinit:/etc/rc.d/rc.sysinit


    As the comment on the first line indicates, the second line causes init to run
    the /etc/rc.d/rc.sysinit script—the first Red Hat startup script that runs. The
    rc.sysinit script performs many initialization tasks, such as mounting the file
    systems, setting the clock, configuring the keyboard layout, starting the network,
    and loading many other driver modules. The rc.sysinit script performs these initialization
    tasks by calling many other scripts and reading configuration files located in
    the /etc/config directory.


    After executing the /etc/rc.d/rc.sysinit script, the init process runs the /etc/rc.d/rc
    script with the run level as its argument. For example, for run level 5, the following
    line in /etc/inittab specifies what init has to execute:


    15:5:wait:/etc/rc.d/rc 5


    This says that init should execute the command /etc/rc.d/rc 5 and should wait
    until that command completes.


    The /etc/rc.d/rc script is somewhat complicated. Here is how it works:


    +   * It changes to the directory corresponding to the run level. For example,
    to change to run level 5, the script changes to the /etc/rc.d/rc5.d directory.'
