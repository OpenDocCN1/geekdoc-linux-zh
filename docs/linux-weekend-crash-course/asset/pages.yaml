    # xinetd Server


    In addition to the standalone servers such as Web server (httpd), mail (sendmail),
    and domain name server (named), you have to configure another server separately.
    The other server, xinetd (the Internet server), starts a host of other Internet
    services such as FTP, TELNET, and so on. Here, briefly look at security aspects
    of the xinetd server.


    The xinetd server reads a configuration file named /etc/xinetd.conf at startup.
    In turn, refers to configuration files stored in the /etc/xinetd.d directory.
    The configuration files in /etc/xinetd.d tell xinetd which ports listen to and
    which to serve for each port. You can browse the files in the /etc/xinetd.d directory
    on your system to find the kinds of services xinetd is set up to. Some of these
    services provide information intruders may use to break into your system. You
    should turn off these services by placing a disable = yes in that service''s configuration
    file. To learn more about xinetd configuration files, type man xinetd.conf at
    the prompt


    in a terminal window.


    Depending on what you need on your system, you may want to disable everything
    the ftp and telnet services. After making changes to the xinetd configuration
    files, you must restart the xinetd service by typing the following


    ```

    /rc/init.d/xinetd restart

    ```


    This command displays the following messages:


    Stopping xinetd: [ OK ]

    Starting xinetd: [ OK ]


    Another security feature of xinetd is its use of the TCP wrapper facility to start
    various services. The TCP wrapper provides an access-control facility for Internet
    services. The TCP wrapper can start other services such as FTP and TELNET; but


