  md: '# Mounting a file system on a device


    Red Hat and other distributions of Linux, you use a physical disk partition by
    associating it with a specific part of the file system. This is a hierarchical
    arrangement of directories — a directory tree. If you have more than one disk
    partition (you may have a second disk with a Linux partition), you can use all
    of them in Red Hat Linux under a single directory tree. You all have to do is
    decide which part of the Linux directory tree should be on each partition — a
    process known in Linux as mounting a file system on a device. (The disk partition
    is a device.)


    > The term mount point refers to the directory you associate with a disk partition
    or any other device.


    ![](img/448aa2bd6846782b632c764b035753bc_47_0.png)


    Suppose that you have two disks on your PC and have created Linux partitions on
    both disks. Figure 2-3 illustrates how you can mount different parts of the Linux
    directory tree (the file system) on these two partitions.


    ![](img/448aa2bd6846782b632c764b035753bc_47_1.png)


    Figure 2-3

    An example of mounting the Red Hat Linux file system on two disk partitions


    # Understanding a swap partition


    Most advanced operating systems support the concept of virtual memory, in which
    part of your system’s hard disk functions as an extension of the physical memory
    (RAM). When the operating system runs out of physical memory, it can move (or'
  merge: -1
  pgno: 47
- img_proc: true
  md: '# Session 2—Partitioning the Hard Drive


    swap out) the contents of currently unused parts of RAM to make room for any program
    that needs more memory. When the operating system needs to access anything in
    the swapped-out data, it has to find something else to swap out, and it swaps
    the required data from disk. This process of swapping data back and forth between
    the RAM and the disk is also known as paging.


    Because the disk is much slower than RAM, the system''s performance is slower
    when the operating system has to perform a lot of paging. However, virtual memory
    enables you to run programs that otherwise couldn''t run.


    Red Linux supports virtual memory and can make use of a swap partition. When you
    create the Linux partitions, create a swap partition as well. With the Disk Druid
    utility program, described in the next section, it is simple to create a swap
    partition. Simply mark a partition type as a swap device, and Disk Druid performs
    the necessary tasks.


