    # Running commands in the background


    When you use MS-DOS, you have no choice but wait for each command to complete
    before you enter the next command. (You can type ahead a bit, but the MS-DOS system
    can hold only a few characters in its internal buffer.) Linux, can handle multiple
    tasks simultaneously. The only problem you may have is that the terminal or console
    is tied up until a command completes.


    If you work in a terminal window and a command takes too long to complete, you
    can open another terminal window and continue to enter other commands. If you
    work in text mode, however, and a command seems too long, you need some other
    way to access your system.


    You can start a lengthy command in the background, which means the shell starts
    the process corresponding to a command and immediately returns to accept more
    commands. The shell does not wait for the command to complete; the command runs
    as a distinct process in the background. To start a process in the background,
    you simply place an ampersand (&) at the end of a command line.


    For example, when I want to search the entire file system by using the find command,
    I typically run that command in the background and send the output to a file.
    To do your find command in the background, type cd to change to your home directory,
    and then type the following:


    ```

    find -name "README.*" -print > all.readme &

    ```


    You should immediately get a bash prompt. You can go on with other commands. When
    the find command finishes, the search results should appear in the file all.readme
    in your home directory.


