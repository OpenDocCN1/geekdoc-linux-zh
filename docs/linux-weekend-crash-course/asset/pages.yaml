    # Minesweeper


    Minesweeper is a popular game you may have played on your PC (because it comes
    with Microsoft Windows). In Minesweeper, your goal is to locate all the mines
    in afield represented by squares arranged in a grid. You are supposed to uncover
    squares that do not contain mines and mark all squares that contain mines.


    To run the KDE version of Minesweeper, select K Games > Minesweeper. To play,
    click squares to clear them. When you uncover a square that does not have adjacent
    mines, Minesweeper clears all neighboring squares that also do not touch squares
    with mines. The number on an uncovered square tells you how many mines are in
    the adjacent squares. To mark a square you suspect has a mine, click the right
    mouse button on that square. When you mark a square by right-clicking, a red flag
    appears on.


    > The Games menu in GNOME also includes a Minesweeper game—it’s called GNOME Mines.'
