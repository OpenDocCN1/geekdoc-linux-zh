  md: '# Session 4—Running Linux for the First Time


    Now that you have installed Red Hat Linux from this book''s companion CD-ROMs,
    you are ready to explore and learn it. First, you learn how to log in, log out,
    and shut down your Linux system. Then you power up again and take a quick tour
    of the GNOME and KDE graphical user interfaces (GUIs) — pronounced "goo-ease".


    # Starting Linux


    After the installation is complete, the Red Hat Linux installation program automatically
    reboots the system. The PC goes through its normal power-up sequence and loads
    LILO from the C drive; a screen appears with the names of the partitions that
    LILO can boot. If you do nothing, LILO proceeds to boot from the partition you
    designated as the default when you configured LILO in Session 1. If you press
    Ctrl+X, the following prompt appears:


    LILO boot:


    When you install LILO, if you specify the Linux partition as the default, you
    can simply wait; after a few seconds, LILO boots Linux.


    > If you want to boot from another partition (such as Windows), press the Tab
    key. LILO displays the names of the available bootable partitions. For example,
    a typical display might be:


    LILO dos


    You can then tell the name of the partition you want to boot or press Enter to
    boot from the first partition.


    LILO boots Linux, you will see a list of opening messages — including the names
    of the devices Linux detects. At the end of all messages, you see a graphical
    login screen, as shown in Figure 4-3.


    The window in the middle of the screen displays a welcome message with your system''s
    host name — the name you assign to your system when you configure the network.
    If the network is not configured, localhost.localdomain is used as the host name.


    You can log in using any of the accounts, including root, which you define during
    the installation. For example, to log in as root, type root (move the mouse over
    the login window before you begin typing) in the text field and press Enter. Then
    type the root password (the one you set during installation) to log in as the
    super user.'
