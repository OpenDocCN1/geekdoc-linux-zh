    !more


    Often, you may want to repeat the last command you typed — perhaps with a slight
    change. For example, perhaps you displayed the contents of the directory using
    the ls -1 command. To repeat that command, type two exclamation points as follows:


    !!


    Sometimes, you may want to repeat the previous command but add extra arguments
    to it. Suppose that ls -1 shows too many files. Simply repeat that command, and
    pipe the output through the more command as:


    !! | more


