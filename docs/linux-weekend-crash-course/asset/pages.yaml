    # Setting up cron jobs for any user


    If you log in as root, you can also set up, examine, and remove cron jobs for
    any user. To set up cron jobs for a user, use this command:


    ```

    crontab -u username filename

    ```


    Here, username is the user for whom you are installing the cron jobs, and filename
    is the file that contains information about the jobs.

    Use the following crontab command to view a user''s cron jobs:


    ```

    crontab -u username -1

    ```'
