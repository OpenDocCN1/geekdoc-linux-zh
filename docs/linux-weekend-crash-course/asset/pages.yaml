    # 1


    # Getting Ready to Install Linux


    # Session Checklist


    +   - Taking stock of your PC''s components

    - Creating a Red Hat boot disk


    In this session, you install Red Hat Linux on your PC. I choose this distribution
    of Linux because it is the most widely used. However, many of the steps described
    in this session also apply to installing other Linux distributions.

    After installing Red Hat Linux on a PC, the best way to learn it is interactively,
    using the Linux commands and applications. To that end, evening''s sessions guide
    you through the steps needed to install Red Hat Linux from this book''s companion
    CD-ROMs. Assuming that the installation program recognizes most of the hardware
    installed in your PC, you should finish the installation in an hour or so. By
    the time you get to the third session of this evening, you should have Red Hat
    Linux installed on your PC. In this session, I guide you through the basic steps
    of gathering information about your PC''s hardware and preparing the Red Hat boot
    disk needed to start the installation in Session 2.'
  merge: -1
  pgno: 28
- img_proc: true
  md: '# Taking Stock of Your PC''s Components


    You have to gather information about your PC''s hardware before you install Linux.
    Like many other operating systems, Linux supports various types of hardware through
    software components called device drivers. For each type of peripheral device,
    such as a networking card or a sound card, Linux needs a separate driver. Because
    Linux is available free (relatively inexpensive), and because many programmers
    scattered throughout the world cooperate to develop Linux, you cannot demand support
    for a specific kind of hardware. Your best bet is to hope that someone can write
    a Linux driver has the same hardware you do. In all likelihood, that person will
    write a driver that will eventually find its way into a version of Linux; it may
    take a while for Linux to support new hardware.


    You can install and run Linux even if no Linux drivers are available for certain
    peripherals. At minimum, however, you must have a Linux-compatible processor,
    bus type, disk video card, monitor, keyboard, mouse, and CD-ROM drive to install
    Red Hat Linux from the companion CD-ROMs. If you want to run the X Window System
    and graphical desktops such as GNOME or KDE, you must ensure that XFree86 (the
    X Window System for Linux) supports the mouse, the video card, and the monitor.


    > If your particular video card isn''t supported, very likely one of the generic
    drivers such as Tseng Labs or will work; or you can use a standard VGA mode, though
    not ideal, will enable you to get the X Window System working.


    ![](img/448aa2bd6846782b632c764b035753bc_29_0.png)


    # Checking if Linux supports your PC hardware


    Before you begin to install Linux on your PC, you need to know if the distribution
    you are installing supports your hardware. To check if Red Hat Linux supports
    the hardware in your PC, perform the following steps:


    +   Gather the make, model, and other technical details of all hardware installed
    in your PC. This is your hardware inventory. You can consult the PC''s manuals
    (if you have them). You can also use the current operating system to find information
    about the hardware. For example, under Windows 95/98, double-click the System
    icon in the Control Panel to gather some of this information. (Click the Device
    Manager tab in the System Properties window to view information about specific
    devices in your system.)'
  merge: -1
  pgno: 29
- img_proc: true
  md: '# Session 1—Getting Ready to Install Linux


    2. With your hardware inventory in hand, visit Red Hat''s Web site at http://www.redhat.com/hardware.
    This Web site contains a list of hardware that the latest version of Red Hat Linux
    supports. Check your PC''s hardware against that list, and make sure Red Hat Linux
    supports the key hardware components. If you are installing another distribution,
    you can check distribution''s Web site for compatibility.


    # Exploring PC hardware


    The following sections provide an overview of the PC hardware that Red Hat Linux
    supports. Even though Red Hat is specifically referenced here, this information
    is also applicable to other Linux distributions. Gather as much information as
    you can about the hardware before you proceed to install Red Hat Linux on your
    PC.


    # Processor


    The processor is the central processing unit (CPU) — the integrated circuit chip
    that performs all the processing in the PC. At minimum, you need an Intel 80386-processor
    to run Red Hat Linux. Any Intel 80386-, 80486-, Celeron-, or Pentium-compatible
    processor can run the Linux operating system. Among the compatibles, Red Hat Linux
    can run on AMD K5, K6, and Cyrix processors. Linux also has a symmetric multiprocessing
    kernel (SMP) that supports multiple processors on one motherboard.


    # Bus


    The bus is the standard electrical connection between the processor and its peripherals.
    Several types of PC buses exist. The most popular bus is the Industry Standard
    Architecture (ISA) bus, formerly called the AT bus because IBM introduced it in
    the IBM PC-AT computer. Other buses include Extended Industry Standard Architecture
    (EISA); VESA local bus (VL-bus); Micro Channel Architecture (MCA); and, most recently,
    Peripheral Component Interconnect (PCI). Currently, Red Hat Linux supports all
    of these buses.


    # Memory


    Commonly referred to as random-access memory or RAM, memory is not a factor in
    compatibility. You do, however, need at least32MB of RAM to get good performance.
    Although you may be able to install and run Red Hat Linux on a PC that'
  merge: -1
  pgno: 30
- img_proc: true
  md: '# 8


    # Friday Evening


    has 16MB of RAM, you cannot run the X Window System on that PC. The X Window System
    manages the graphical interface through an X server, which is a large program
    that needs a lot of memory to run efficiently.


    ![](img/448aa2bd6846782b632c764b035753bc_31_0.png)


    If you are buying a new PC, it probably will come with at least 32MB of RAM —
    if not 64MB or more. If you have an old PC with less than 8MB of RAM, you may
    want to add some memory to bring up the total to 16MB (at least). The more physical
    memory your system has, the more efficiently it runs multiple programs because
    the programs can all fit in memory. Although Linux can use part of the hard disk
    as virtual memory, disk-based memory is much slower than physical memory. The
    required amount of physical memory depends on the size of the operating system
    and the other software that you have to run all the time, as the X Window System.


    # Video Card and Monitor


    Linux works with all video cards in text mode. But when it comes to XFree86 —
    the version of the X Window System — the story is quite different. If XFree86
    does not support your video card explicitly, you may have to work to get XFree86
    configured for your video card.


    The kind of monitor you use is not particularly critical, but it must be capable
    of displaying the screen resolutions the video card uses. These resolutions are
    expressed in terms of the number of picture elements, or pixels, horizontally
    and vertically (such as 1024 × 768).


    Generally, XFree86''s support for a video card depends on the chipset — the integrated
    circuit that controls the monitor and display output. You can find the name of
    the chipset used in a video card from the card''s documentation.


    Do not be alarmed if you do not see your video card''s name in the list that appears
    at http://www.redhat.com/support/hardware/. Most popular video cards use one of
    the video chipsets listed in Red Hat''s. In fact, the same chipset can function
    in many video cards. For example, the Nvidia RIVA TNT chipset is used in many
    video cards as Diamond Viper V550, Hercules TNT, STB Velocity 4400, and ELSA ERAZ
    II. As you install Red Hat, the Red Linux installation program attempts to detect
    the video chipset automatically as it sets up the X Window System.'
  merge: -1
  pgno: 31
- img_proc: true
  md: '# Session 1—Getting Ready to Install Linux


    # Hard Drive


    Linux supports any hard drive that your PC''s basic input/output system (BIOS)
    supports. Or on many older 386 and 486 PCs, you have to use a separate driver
    to access large hard drives — the system BIOS cannot handle these drives. You
    can''t install Linux on such systems. In short, Linux supports your hard drive
    only if the system''s BIOS supports the hard drive without any additional drivers
    — with one significant restriction.


    ![](img/448aa2bd6846782b632c764b035753bc_32_0.png)


    > To be able to boot Linux from a large hard drive (any drive with more than 1,024
    cylinders), the Linux Loader (LILO), the Linux kernel, and the LILO configuration
    files must be located in the first 1024 cylinders of the drive. This is because
    the Linux Loader uses BIOS to load the kernel and the BIOS cannot access cylinders
    beyond the first 1,024.


    For hard drives connected to your PC through a Small Computer System Interface
    (SCSI) controller card, Linux must have a driver that enables the SCSI controller
    to access and use the hard drive.


    The only remaining decision about the hard drive is its capacity. If you have
    an old PC, you may have a relatively low-capacity hard drive — perhaps as low
    as 500MB. Although you can install Linux and the X Window System within 500MB,
    doing so does not leave room for Windows 95/98/2000. (You need at least 2GB of
    disk space to run both Linux and Windows 95/98/2000.) Therefore, if your old PC
    has an IDE interface and one small hard disk (500MB or less), you may want to
    add a second hard drive because most IDE controllers can support two. Adding a
    second hard drive prevents you from messing up your hard drive. If you have a
    SCSI card, you can connect up to seven SCSI devices to it.


    If you are buying a new PC, keep in mind that a complete Red Hat installation
    (with all the Red Hat packages) takes over 1GB of disk space. On top of that,
    you need some disk space for your work. Luckily, most new PCs come with hard drive
    sizes ranging anywhere from 2GB to 20GB. Any hard drive within this range is large
    enough, so you can keep Windows on one of the partitions and then opt to boot
    either Windows or Red Hat.'
  merge: -1
  pgno: 32
- img_proc: true
  md: '# Floppy Disk Drive


    As they do for the hard drive, Linux drivers use the PC BIOS to access the floppy
    disk drive. Therefore, your floppy disk drive is compatible with Linux. You do,
    however, have to boot Linux from a floppy disk drive during the installation.
    For this purpose, use a high-density 3.5” (1.44MB-capacity) floppy disk drive.
    You can avoid booting from a floppy, provided that you can boot your PC under
    MS-DOS (not an MS-DOS window under Windows 95/98/2000) and can access the CD-ROM
    from the DOS command prompt.


    # Keyboard and Mouse


    Red Hat and other Linux distributions support any keyboard that already works
    with your PC. The mouse, however, needs explicit support in Red Hat Linux. You
    need a mouse if you want to configure and run FreeBSD6, the X Window System for
    Linux. Red Hat Linux supports popular mice, including the commonly found PS/2-style
    mouse. Red Hat Linux also supports touchpad devices, such as Alps Glidepoint,
    as long as they are compatible with one of the supported mice.


    # SCSI Controller


    The Small Computer System Interface, commonly called SCSI (and pronounced scuzzy),
    is a standard way of connecting many types of peripheral devices to a computer.
    SCSI is used in many kinds of computers, from high-end UNIX work-stations to PCs.
    Typically, you connect hard drives and CD-ROM drives through a SCSI controller.
    To use a SCSI device on your PC, you need a SCSI controller card that plugs into
    one of the connector slots on your PC''s bus.


    A SCSI controller supports devices 0 through 7, with 7 usually assigned to the
    controller itself. This means you can connect up to seven SCSI devices to your
    PC. If you want to access and use a SCSI device under Linux, you have to make
    sure that Red Hat Linux supports your SCSI controller card. The Red Hat Linux
    release on the companion CD-ROMs supports many popular SCSI controllers.


    # CD-ROM Drive


    CD-ROM (compact disc read-only memory) drives are popular because each CD-ROM
    can hold up to 650MB of data. This is a relatively large amount of storage compared
    with a floppy disk. CD-ROMs are reliable and inexpensive to manufacture.'
  merge: -1
  pgno: 33
- img_proc: true
  md: '# Session 1—Getting Ready to Install Linux


    Vendors can use a CD-ROM to distribute a large amount of information at a reason-
    cost. This book provides Red Hat Linux on CD-ROMs, so you need a CD-ROM drive
    to install the software.


    # Sound Card


    With Linux, you can also play sounds on a sound card to enjoy multimedia pro-grams
    and games. If you have a sound card, you can play audio CDs.


    > The version of Red Hat Linux on the companion CD-ROMs supports a wide variety
    of sound CD-cards. Check your sound card against the list posted at Red Hat''s
    Web site (http://www.redhat.com/support/hardware/).


    ![](img/448aa2bd6846782b632c764b035753bc_34_0.png)


    # Network Card


    A network card is necessary only if you connect your Linux PC to a local area
    net-work (LAN), which is usually an Ethernet network. Red Hat Linux supports a
    vari-ety Ethernet network cards, but using a recognized name brand card, such
    as 3Com or Intel, will make configuration easier because Linux provides more support
    for name brand cards. Linux also supports Archnet and IBM''s token-ring network.
    You can determine the name of the network card by viewing the System Properties
    window in the Windows 95/98 Control Panel.


    If you have a network card and your Linux PC is part of a local area network,
    you should also gather the following information needed to configure the network:


    +   - The PC''s host name


    +   - The Domain name of the network


    +   - The Internet Protocol (IP) address of the PC (or, if the DHCP server provides
    the IP address, the server''s address)


    +   - The Gateway address


    +   - The IP addresses of name servers


    > If you plan to use Linux on a stand-alone PC at home, you use Point-to-Point
    Protocol (PPP) to connect to the Internet over a dial-up connection through an
    Internet Service Provider (ISP).


    ![](img/448aa2bd6846782b632c764b035753bc_34_1.png)'
  merge: -1
