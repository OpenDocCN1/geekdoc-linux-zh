    # Understanding How Linux Boots


    # Session Checklist


    +   - Understanding the init process

    - Understanding the Linux startup scripts


    30 Min.

    To Go


    Learning the sequence in which Linux starts processes as it boots is important.
    You can use this knowledge to start and stop services such as the Web server and
    Network File System (NFS). This session provides you with an overview of how the
    Red Hat, Caldera, and SuSe distributions of Linux boot and start the initial set
    of processes. You also become familiar with the shell scripts that start various
    services.


    # Understanding the init Process


    When Linux boots, it loads and runs the core operating-system program, called
    the kernel, from the hard disk. The core operating system, however, is designed
    to run other programs. A process named init starts the initial set of processes
    on your Linux system.'
  merge: -1
  pgno: 280
- img_proc: true
  md: '# Sunday Morning


    258


    To see the processes currently running on the system, type the command ps ax |
    more. The first column in the output has the heading PID, and that column shows
    a number for each process. PID stands for process ID (identification), which is
    a sequential number the Linux kernel assigns. Right at the beginning of the list
    of processes, you notice a process with a ID (PID) of 1:


    | PID TTY | STAT | TIME COMMAND |

    |---|---|---||

    | 1 ? | S | 0:05 init [5] | |


    As you can see, init is a process, and it always has a PID (or process number)
    of 1. Also, init starts all processes in your Linux system. That''s why init is
    referred to as the mother of all processes.

    What the init process depends on the following:


    +   * The run level, designates a system configuration in which only a selected
    group of processes exists

    * The contents of the /etc/inittab file, a text file that specifies processes
    to start at different run levels

    * A number of shell scripts (located in the /etc/rc.d directory and subdirectories)
    executed at a specific run level


    The current run level, with the contents of the /etc/inittab file, controls which
    processes init starts. Linux, for example, has seven run levels: 0, 1, 2, 3, 4,
    5, and 6. By convention, some of these levels indicate specific processes that
    run at that level. Run level 1, for example, denotes a single-user, stand-alone
    system. Run level 0 means the system is halted, and run level 6 means the system
    is rebooted. Run levels 2 through 5 are multiuser modes that have various levels
    of capabilities. It is possible to change from one run level to another by typing
    init with the command later in this session.

    The initial default run level is 3 for text-mode login screens and 5 for the graphical
    login screen. As the following section explains, you can change the default run
    level by editing a line in the /etc/inittab file.

    To check the current run level, type the following command:


    ```

    /sbin/runlevel

    ```


    This command prints two alphanumeric characters as output.

    N 5

    The first character of the output shows the previous run level (N means there
    was no previous run level), and the second character shows the current run level
    (5).'
  merge: -1
  pgno: 281
- img_proc: true
  md: '# Examining the /etc/inittab file


    The /etc/inittab file is the key to understanding the processes that init starts
    at various run levels. You can look at the contents of the file by using the more
    command as follows:


    more /etc/inittab


    > When looking at the contents of the /etc/inittab file with the more command,
    you do not have to log in root.


    The following is a listing of the /etc/inittab file on my Calder Linux system
    that is set up for a graphical login screen:


    +   # inittab

    # Author:

    #

    # Default runlevel.

    # 0 - halt (DO NOT set default to this)

    # 1 - Single user mode

    # 2 - Multiserer, without NFS (The same as 3, if you do not have networking)

    # 3 - Full multiuser mode

    # 4 unused

    # 5 - X11

    # 6 - reboot (DO NOT set default to this)


    This file describes how the INIT process should set up the system in a certain
    run-level.

    Miquel van Smoenberg, <miquel@drinkel.nl.mugnet.org>\Modified for RH Linux by
    Marc Ewing and Donnie Barnes


    ```

    id5:initdefault:

    # System initialization.

    s1::init:/etc/rc.d/rc.sysinit

    10:0:wait:/etc/rc.d/rc 0

    11:1:wait:/etc/rc.d/rc 1

    12:2:wait:/etc/rc.d/rc 2

    13:3:wait:/etc/rc.d/rc 3

    14:4:wait:/etc/rc.d/rc 4

    15:5:wait:/etc/rc.d/rc 5

    16:6:wait:/etc/rc.d/rc 6

    ```


    # Things to run in every runlevel.

    udonce::/sbin/update

    # Trap CTRL-ALT-DELETE

    ca::ctrlaltdel:/sbin/shutdown -t3 -r now'
  merge: -1
