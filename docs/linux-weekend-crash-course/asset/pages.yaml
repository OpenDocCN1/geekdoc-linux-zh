  md: '292


    Sunday Morning


    You do not have to create a fully monolithic or fully modular kernel. In fact,
    linking some support directly into the kernel is common practice. Conversely,
    you can build infrequently used device drivers in the form of modules. All major
    distributions distribute a generic kernel along a large number of modules to support
    many different types of hardware. Then, the installation program configures the
    system to load only those modules needed to support the hardware installed on
    a user''s system.


    When you create a custom kernel for your hardware configuration, you may link
    all required device drivers into the kernel. You can keep the size of such a monolithic
    kernel under control because you only link in device drivers for the hardware
    installed on your system.


    ![](img/448aa2bd6846782b632c764b035753bc_315_0.png)


    # Configuring the Kernel


    The first phase in rebuilding a kernel is configuring the kernel. To configure
    the kernel, log in as root. Then change the directory to /usr/src/linux by using
    the cd command as follows:


    ```

    cd /usr/src/linux

    ```


    To configure the kernel, you have to indicate the features and device drivers
    (covered in the previous section) you want to include in your Linux system. In
    essence, you build a copy of Linux with the mix-and-match features you want. Linux
    provides three ways for you to configure the kernel:


    +   * Type menuconfig to enter the kernel configuration parameters through a text-based
    interface, similar to the one the Red Hat installation uses.

    * Type xconfig to use an X Window System-based configuration program to configure
    the kernel. You have to run X to use this configuration program with a graphical
    interface.

    * Type menuconfig to use a program that prompts you for each configuration option.
    You can use this configuration program from the Linux command prompt. When you
    use this option, you undergo a long question-and-answer process to specify configuration
    parameters.


    As you configure the kernel, you have to select how to include support for specific
    devices. Typically, for each configuration option, you must type one of the following
    choices:'
