    # Backing Up and Restoring Files


    # Session Checklist


    +   - Selecting a backup strategy and storage media

    - Using tar to backup and restore files

    - Backing up on tapes


    ![](img/448aa2bd6846782b632c764b035753bc_332_2.png)


    By now, you have learned a number of system-administration tasks, from configuring
    X to building a new kernel. This session introduces you to another important system
    administration task—backing up and restoring files from backup-storage media.
    In this session, you learn to back up and restore files by using the tape archiver
    (tar) program that comes with Linux. You also learn to perform incremental and
    automatic backups on tapes.


    # Selecting a Backup Strategy and Storage Media


    Your Linux system''s hard disk contains everything needed to keep the system running,
    as well as other files such as documents and databases you need to keep your business
    running. You need to back up these files so you can recover quickly'
  merge: -1
  pgno: 332
- img_proc: true
  md: '# 310


    bring the system back to normal in case the hard disk crashes. Typically, you
    have to follow a strict regimen of regular backups because you can never tell
    when the hard disk might fail or when the file system might get corrupted. To
    implement such a regimen, you need to decide which files to back up, how often
    to back them up, and what backup storage media to use. This involves selecting
    a backup strategy and backup media.


    Your choice of backup strategy and backup media depends on your assessment of
    the risk of business disruption due to hard disk failure. Depending on how you
    use Linux system, a disk failure may or may not have impact on you.


    For example, if you use your Linux system as a learning tool (to learn Linux or
    programming), all you may need backup copies of some system files to configure
    Linux. In this case, your backup strategy may be to save system-configuration
    files on one or more floppies every time you change any system configuration.
    You may also want to set up a script that runs at a scheduled time to e-mail yourself
    about the configuration changes. Session 25 explains setting up job scheduling.


    In the other hand, if you use your Linux system as an office server that provides
    file storage for many users, the risk of business disruption due to disk failure
    is much higher. In this case, you have to back up all the files every week and
    back up any new or changed files every day. You should perform these backups in
    an automated manner (using the job-scheduling features you learned in Session
    25). Also, you probably need a backup medium that can store large amounts (multiple
    gigabytes) of data on a single tape. In other words, for risk situations, your
    backup strategy is more elaborate and thus requires equipment such as a tape drive.


    Your choice of backup media depends on the amount of data you have to back up.
    For a small amount of data, such as system-configuration files, you can use floppy
    disks as your backup media. If your PC has a Zip drive, you can use Zip disks
    as your backup media. (These are good for backing up a single-user directory.)
    To back up servers, you should use a tape drive — 4mm or 8mm tape drive that connects
    to a SCSI controller. Such tape drives can store gigabytes of data per tape, and
    you can use them to back up an entire file system on a single tape.


    When backing up files to this backup storage media, you have to refer to the backup
    device by name. Here are the device names for some common backup devices:'
  merge: -1
  pgno: 333
- img_proc: true
  md: '# Session 26—Backing Up and Restoring Files


    | Backup Device | Linux Device Name |

    |---|---|

    | Floppy disk | /dev/fd0 |

    | IDE Zip drive | /dev/hdc4 or /dev/hdd4 |

    | SCSI Zip drive | /dev/sda (assuming it''s the first SCSI drive); otherwise,
    the device name depends on the SCSI ID |

    | SCSI tape drive | /dev/st0 or /dev/nst0 (the n prefix means that the tape does
    not rewind after after files are copied to the tape) |


    # Commercial Backup Utilities for Linux


    Although you can manage backups with tar, a number of commercial backup utilities
    come with graphical user interfaces and other features to simplify backups. Here
    are some well-known backup utilities for Linux:


    +   * BRU (A backup and restore utility from EST (see http://www.estinc.com/))

    * LONE-TAR (A backup software package from Lone Star Software Corporation (see
    http://www.cactus.com/))

    * Arkeia (Backup and recovery software for heterogeneous networks from Knox Software
    (see http://www.knox-software.com/))

    * CTAR (Backup and recovery software for UNIX systems from UniTrends Software
    Corporation (see http://www.unitrends.com/))


    Although this session focuses on backing up and restoring files by using the tape
    archiver (tar) program that comes with Linux, other commercially available utilities
    for Linux that perform backups are available. I highlight some well-known commercial
    utilities in the sidebar.


    # Using the Tape Archiver Program to Back Up and Restore Files


    You can use the tape archiver program (tar command) to archive files to a device
    such as a floppy disk or tape. The tar program creates an archive file that can
    contain other directories and files and (optionally) can compress the archive
    for


    ![](img/448aa2bd6846782b632c764b035753bc_334_0.png)'
  merge: -1
  pgno: 334
- img_proc: true
  md: 'efficient storage. The archive is then written to a specified device or to
    another file. In fact, many software packages are distributed in the form of a
    compressed tar file. The command syntax of the tar program is as follows:


    ```

    tar options destination source

    ```


    A sequence of single letters usually specifies the options; each letter specifies
    what tar should do. The device name of the backup device is destination, and source
    is a list of file or directory naming the files to back up.


    # Backing up and restoring a single volume archive


    Suppose you want to back up the contents of the /etc/X11 directory on a floppy
    disk. Log in root, place a disk in the floppy drive, and type the following-command:


    ```

    tar zcvf /dev/fd0 /etc/X11

    ```


    The tar program displays a list of filenames as each file is copied to the pressed
    archive on the floppy disk. In this case, the options are zcvf, the destination
    is /dev/fd0 (the floppy disk), and the source is /etc/X11 directory (which implies
    all its subdirectories and their contents). You can use a similar command to back
    up files to a tape. Simply replace /dev/fd0 with the tape device — such as /dev/st0
    for a SCSI tape drive.


    A common tar options are defined here:


    | Option | Definition |

    |---|---|

    | Z | compresses the tar archive using gzip |

    | C | creates a new archive |

    | V | displays verbose messages |

    | X | extracts files from the archive |

    | T | lists the contents of the archive |

    | M | specifies a multivolume archive (see "Backing up and restoring a multivolume
    archive" later in this session) |

    | F | specifies the name of the archive file or device |


    To view the contents of the tar archive you create on the floppy disk, type the
    following command:


    ```

    tar zvtf /dev/fd0

    ```'
