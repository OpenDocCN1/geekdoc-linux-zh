  md: '# Session 12—Connecting to the Internet


    # Verifying the PPP connection is up


    After you connect, you can verify that the PPP connection is up by typing the
    /sbin/ifconfig command, which shows a listing such as this:


    ```

    eth0

    Link encap:Ethernet Haddr 02:60:bc:8e:c6:a9

