- pgno: 176
  md: '> > **Caution**

    > >

    > > Unless you have an in-depth knowledge of monitor and graphics card functions,
    nothing should be changed in the mode lines, since this could cause severe damage
    to your monitor.


    For those who want to develop their own monitor descriptions, the documentation
    in `/usr/X11/lib/X11/doc` might come in handy. The section [FCR93] deserves a
    special mention. It describes, in detail, how the hardware functions and how mode
    lines are created.


    Actually a “manual” setting of the mode lines is hardly ever needed nowadays.
    If you are using a modern multisync monitor, the allowed frequencies and optimal
    resolutions can, as a rule, be read directly from the monitor by the X server
    via DDC, as described in the SaX2 configuration section. If this is not possible
    for some reason, you can also use one of the VESA modes included in the X server.
    This will function with practically all graphics card and monitor combinations.


    # Integrating Additional (True Type) Fonts


    A standard X11R6 X server installation also includes a large number of fonts.
    These can be found in the directory `/usr/X11R6/lib/X11/fonts`, each divided into
    logically connected groups in subdirectories. Make sure that only subdirectories
    of the X server are used that:


    +   - are entered in the files section, Files of the file `/etc/X11/XF86Config`
    as `FontPath`.

    +   - contain a valid `fonts.dir` file.

    +   - were not closed while the X server was running using the command `xset -fp`
    or were started while the X server was running using the command `xset +fp`.


    Since version 4.0, XFree86 can use not only its own format Type1 (a PostScript
    format) for scalable fonts and pcf for bitmap ones, but also the ttf (True Type
    font) fonts. As described in Section *Version 4.x of XFree86* on page 128, this
    support is provided via loadable modules of the X server. Thus, you can also use
    directories containing True Type fonts together with the X server. To do this,
    hardly any preparation is needed.'
  merge: -1
  img_proc: true
- pgno: 177
  md: 'A big advantage of most True Type fonts, apart from their very good scalability,
    is that these fonts almost always contain more than the normal 255 characters
    of the font for western Europe coded in “iso-8859-1”. With these fonts, you can
    display Cyrillic, Greek, or eastern European languages without any problem and,
    with special software, even Asian languages.


    This description is essentially about the use of fonts as 8-bit character sets.
    If you want to use characters of Asian languages (Japanese, Chinese, etc.), use
    special editors, which are also available in SuSE Linux.


    An 8-bit character set contains 255 characters and basically consists of the US-ASCII
    character set, which defines only the first 128 of 255 possible characters, and
    expands it with further characters. One text character occupies 8-bits in the
    computer memory. As 127 characters are certainly not enough to record the special
    characters, for example, of all European languages, the various languages are
    combined into groups and this group is then given a short name. The relevant character
    set is named according to the appropriate norm as the “iso-8859-x” character set,
    where the x stands for a number from 1 to 15. The exact order of characters in
    the iso-8859-1 character set can be found in the man page for iso-8859-1 (man
    iso-8859-1).


    The more well-known codings are listed in Table 7.5 : further ones can be taken
    from the above-mentioned manual page.


    | Font | Supported regions, contains special characters |

    |---|---|

    | iso-8859-1 | West European languages: Spanish, German, French, Swedish, Finnish,
    Danish, and others |

    | iso-8859-2 | Central and Eastern Europe: Czech, Rumanian, Polish, German, and
    others |

    | iso-8859-5 | Cyrillic characters for Russian |

    | iso-8859-7 | Greek characters for Greek |

    | iso-8859-9 | Turkish characters |

    | iso-8859-15 | As iso-8859-1, but with characters for Turkish and the Euro sign.
    |


    *Table 7.5: Important Font Codings*'
  merge: -1
  img_proc: true
- pgno: 178
  md: 'The user must then — depending on the language used — select the matching encoding.
    Especially when transferring texts between different computers, the encoding used
    must also be transferred. The advantage of this procedure is obvious: To receive
    support for regional special characters, you only need to select the correct encoding
    and immediately most programs will be able to portray these special characters,
    since almost all programs use an 8-bit value (one byte) to represent a text character.
    If the wrong encoding is chosen, the special characters will be wrongly depicted.
    With most X applications, as well as with the KDE desktop, you can usually select
    the coding of the character set when you are configuring the font to use. In X
    applications, the encoding is usually referred to as Encoding.


    The disadvantage of this method is that some language combinations are impossible:
    You cannot, for example, easily write a German text with umlauts in which you
    mention Russian place names in Cyrillic.


    This dilemma can only be solved using a different approach — with the use of Unicode.
    Unicode codes characters, unlike ASCII, with two or even more bytes, allowing
    considerably more characters to be represented. Only if you use Unicode can you
    depict Asian languages with more than 127 characters, such as Chinese, Japanese,
    or Korean, on the computer. The disadvantage of this method is that most existing
    software cannot handle these characters and that you can only read or write texts
    yourself with Unicode characters using special software. For more information
    on using Unicode fonts in Linux, see `http://www.unicode.org`. It is expected
    that, in the future, more and more programs will support Unicode characters. SuSE
    Linux offers the program yudit to enter texts in Unicode. The program yudit can
    be found in the package yudit, series xap and, after installation, via the SuSE
    menu, under Office → Editors.


    After these observations, we now have a step-by-step description of the installation
    of additional fonts, using the example here of True Type fonts.


    Locate the fonts to install in your X Window System. If you have licensed True
    Type fonts, you can simply use these on your system. Mount the partition containing
    these fonts.


    You should create a font directory — if this does not yet exist — and change to
    it. SuSE Linux already has a directory called `/usr/X11R6/lib/X11/fonts/truetype`.
    You can copy the relevant fonts to this directory.


    ```

    earth:/root # cd /usr/X11R6/lib/X11/fonts/truetype

    ```'
  merge: -1
  img_proc: true
- pgno: 179
  md: "Create links to the ttf files and create the font directory. For True Type\
    \ fonts, you will additionally need a special program called ttmkfdir, package\
