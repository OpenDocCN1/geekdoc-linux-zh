    \n> **Note**\n> \n> The create option includes all settings made in `/etc/permissions/*`.\
    \ Be sure that any modifications you make on your own do not cause any conflicts.\
    \ See on page 304.\n\n# Man Pages\n\nFor some GNU applications (e.g., tar) the\
    \ man pages are no longer maintained. They have been replaced by info files. info\
    \ is GNU’s hypertext system. Typing `info info` gives a starting help for using\
    \ info. `info` can be launched via `emacs -f info` or on its own with `info`.\
    \ The programs `tkinfo` and `xinfo` are easy to use on your own access the SuSE\
    \ help system.\n\n# The Command ulimit\n\nWith the `ulimit` (user limits) command,\
    \ it is possible to set limits for the use of system resources and to have these\
    \ displayed. `ulimit` is especially useful for limiting the memory available for\
    \ applications. Through this, an application can be prevented from using too much\
    \ memory on its own. This could bring the system to a standstill.\n\n`ulimit`\
    \ can be used with various options. To limit memory usage, use the options listed\
    \ in Table 11.1 on the next page.\n\n+   - `-m` — maximum size of physical memory\n\
    +   - `-v` — maximum size of virtual memory (swap)\n+   - `-s` — maximum size\
    \ of the stack\n\n*Table 11.1: continued overleaf…*"
  merge: -1
