- pgno: 152
  md: '# Further Configurations


    The following chapter serves as stimulation and as brief instructions to enhanced
    configuration in terms of X11. We cannot offer any assistance in the form of free
    installation support for these configurations.


    # Side Note Regarding Keyboards


    The topic of keyboards does not lend itself to quite the same in-depth discussion
    as other input devices, as you do not normally need to make any specific configurations
    for your keyboard.


    The following applications and files can be of use in certain circumstances. xkeycaps,
    package `xkeycaps`, series `xap`, lets you see your current changes to the keyboard
    layout in action or test different settings. Make changes to the individual characters
    and symbols permanent in the `~/.Xmodmap` file. Refer to the man page for `xmodmap`
    (`man xmodmap`) regarding the structure of this file.


    KDE offers the `kikbd` tool (“international keyboard layout”). It enables you
    to easily switch back and forth between various keyboard layouts. This is useful,
    for example, if you need the special characters in Spanish or German. When using
    the “international keyboard layout” for writing in foreign languages with special
    characters, note that many X applications only recognize the characters belonging
    to your locally configured, country-specific character settings. If this is the
    case, other characters will be ignored. So it is also necessary to correctly configure
    the “locale”. This is done by resetting the environment variable LANG to the desired
    country setting *before starting the application*. Refer to the man page for `locale`
    (`man locale`) for all the possible options.


    # Automatic Configuration (Laptops)


    If you have a notebook, configuring it is even easier in many cases due to the
    special hardware properties for notebooks. In the typical scenario, the notebook
    is operated with its own predesignated internal display — with an LCD/DSTN or
    TFT matrix display.


    SaX2 recognizes the size of the display. Simply enter the command


    ```

    sax2 -a

    ```


    SaX2 will begin hardware detection and automatically create the configuration
    without requiring any additional entries on your part. Start the graphical environment
    after this command has run as described in Section *Starting the Graphical Interface*
    on the preceding page.'
  merge: -1
  img_proc: true
- pgno: 153
  md: '# Reconfiguration (Fastpath)


    The current version of SaX2 allows you to adjust certain aspects of the current
    configuration from a running graphical user environment. “FastPaths” are made
    available for this purpose. SaX2 currently implements the following fastpaths:


    +   1. **mouse** Configuration of input devices, in particular, the mouse

    +   2. **keyboard** Keyboard and font configuration

    +   3. **desktop** Color and resolution configuration

    +   4. **layout** Configuration of the arrangement of the various screens (only
    available for multihead configurations)


    To change the mouse configuration from a running session, for example, enter:


    ```

    sax2 -F mouse

    ```


    This will cause SaX2 not to start hardware recognition, but instead, load the
    existing configuration and display the corresponding dialog. The X server has
    to be restarted following any changes for these to take effect.


    # Multihead


    The XFree86 Version 4 addresses more than one graphics card. This is referred
    to as a “multihead environment”. SaX2 automatically recognises when multiple graphics
    cards are located on your system and will prepare the configuration accordingly.
    Configuration is limited to two aspects:


    ![](img/a4b6c994843f3fbd688003f4cabfa48f_153_0.png)


    *Figure 7.13: Adjusting the Monitor Arrangement*'
  merge: -1
  img_proc: true
- pgno: 154
  md: '# Selecting the multihead type


    SaX2 differentiates between three types of multihead environments


    +   1. ‘Traditional multihead’ — Every monitor is treated as an independent display

    +   2. ‘Xineramaified multihead’ — All monitors are consolidated into one large
    display

    +   3. ‘Cloned multihead’ — There is one display for which all other displays
    are identical copies


    # Defining the multihead layout


    The layout of a multihead environment is the arrangement and partnerships between
    the monitors. SaX2 normally creates a default layout following the order in which
    the graphics cards are detected, which arranges all the monitors in a line, from
    left to right. Modify this layout by moving the respective screen (depicted as
    an icon in the layout dialog) to a new position using the left mouse button.


    Test your new configuration by clicking ‘Start’ after completing the layout dialog
    — you should be aware that the image geometry can only be modified in the *traditional
    multihead*, since this is the only option where each monitor is independent of
    one another. The following procedure is advisable:


    +   1. Define the new layout as already described.

    +   2. Set the multihead type to ‘Traditional’.

    +   3. Click ‘Done’ then ‘Start’.

    +   4. Adjust the image geometry to fit all the monitors and save this status.

    +   5. Answer the prompt asking whether SaX2 should be ended with ‘No’.

    +   6. Set your preferred multihead type.

    +   7. Click ‘Done’ then ‘Save’.

    +   8. Confirm the question as to whether SaX2 should be ended with ‘Yes’.


    Linux does not currently feature 3D support in a multihead environment. SaX2 will,
    in this case, deactivate 3D support.'
  merge: -1
  img_proc: true
- pgno: 155
  md: '# Graphics Tablets


    Currently, only Wacom graphics tablets are supported by XFree86, SaX2 provides
    USB and serial configuration. Unfortunately, at the moment, automatic detection
    and setup of a tablet connected to the system is not available. From a configuration
    perspective, a graphics tablet is viewed as an input device — like a mouse. The
    following procedure is recommended:


    +   1. Start SaX2 and switch to the mouse configuration dialog.

    +   2. Click ‘Add’ and add a graphics tablet.

    +   3. In the same manner, add the pens to the tablet. Note that the pen and the
    eraser are considered separate.

    +   4. Test the connection of all the devices added to the serial tablet: `/dev/ttyS0`
    represents the first serial port, `/dev/ttyS1` the second, and so forth.

    +   5. Save the configuration. Testing the configuration is optional.


    # Touch Screens


    Currently, Microtouch and Elographics touch screens are supported by XFree86.
    However, SaX2 can only automatically detect the monitor, not the toucher. The
    toucher is, again, viewed in the same way as a mouse and is therefore configured
    in the SaX2 mouse dialog. The following procedure is recommended:


    +   1. Start SaX2 and switch to the mouse configuration dialog.

    +   2. Click on the ‘Add’ button and add a touch screen.

    +   3. Save the configuration. Testing the configuration is optional.


    Touch screens feature a multitude of options and usually have to be calibrated
    first. There is, unfortunately, no tool available for this in Linux. However,
    you can define the size proportions in SaX2 under the ‘Advanced’ tab when adding
    the touch screen. These dimensions depend heavily on the hardware used.'
  merge: -1
  img_proc: true
- pgno: 156
  md: "# The X Server Log File\n\nFor analyzing problems with the X server, there\
    \ is a very detailed log that the X server creates when it starts. This file is\
    \ created by the XFree86-4.0 X server according to the following pattern `/var/log/XFree86.Display.Screennumber.log`.\
    \ If you start just one X server (the normal case) and this display is assigned\
    \ the number “0”, the file name of this log file is usually `/var/log/XFree86.0.log`.\
    \ Note that SaX2 here is an exception to this rule: here, at least temporarily,\
    \ two X servers are running (Display :0) for the configuration dialogs and later,\
    \ a second one (Display :1) to test settings.\n\nThe format of this file has changed\
    \ drastically compared to XFree86-3.3.x. Now a much clearer distinction is made\
    \ between information messages, values taken from the configuration file, data\
    \ originating from the computer hardware, and warnings and errors.\n\nSaX2 allows\
    \ you to view the X server log file with the middle mouse button. Here, the various\
    \ types of messages (error, informal, warning, etc.) are shown in different colors.\
    \ This helps you to find the problem quickly if the X server does not start.\n\
    \nIn general the beginning of such a log file appears as shown in 11.\n\n```\n\
    ```\n%\n%\nXFree86 Version 4.0 / X Window System\n(protocol Version 11, revision\
    \ 0, vendor release 6400)\nRelease Date: 8 March 2000\n        If the server is\
    \ older than 6—12 months, or if your card is\n        newer than the above date,\
    \ look for a newer version before\n        reporting problems.  (see http://www.XFree86.Org/FAQ)\n\
    Operating System: Linux 2.2.13 i686 [ELF] SuSE\nModule Loader present\n(==) Log\
    \ file: \"/var/log/XFree86.0.log\", Time: Sat May 20 13:42:15 2000\n(==) Using\
    \ config file: \"/etc/X11/XF86Config\"\nMarkers: (--) probed, (**) from config\
    \ file, (==) default setting,\n         (++) from command line, (!!) notice, (II)\
    \ information,\n         (WW) warning, (EE) error, (??) unknown.\n(==) ServerLayout\
    \ \"Layout[all]\"\n(**) |-->Screen \"Screen[0]\" (0)\n(**) |-->Monitor \"Monitor[0]\"\
    \n%\n```\n```\n\n*Fig 11: Taken from the X Server Log File*"
  merge: -1
  img_proc: true
- pgno: 157
  md: '| Symbol | Meaning |

    |---|---|

    | (==) | Defaults of the X server |

    | (--) | Values taken from the system by automatic hardware detection. |

    | (*) | Settings fixed in the configuration file. |

    | (++) | Parameters entered at the command line. |

    | (!!) | Here, the X server tells you in detail what it “is doing”. |

    | (II) | Version numbers of X server modules, etc., are usually recorded as “informational
    messages”. |

    | (WW) | Warnings: here the X server tells you why it is not carrying out certain
    actions specified in the configuration file or that should be activated by default.
    |

    | (EE) | Error! These messages cancel the start procedure or crash the X server.
    Look out for lines in the log file starting with (EE) if the X server does not
    start. You can remedy most errors yourself by evaluating these messages. |


