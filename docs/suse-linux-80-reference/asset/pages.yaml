- pgno: 300
  md: "**Floppy Disk:** The rescue system can also be started from the floppy disk,\
    \ especially if the computer only has a small amount of working memory.\n\nRegardless\
    \ of the medium chosen, the rescue system will be decompressed, loaded onto a\
    \ RAM floppy disk as a new root file system, mounted, and started. Now it is ready\
    \ for use.\n\n# Working with the Rescue System\n\nThe rescue system provides three\
    \ virtual consoles on keys `Alt` + `F1` to `Alt` + `F3`. Here, root may log in\
    \ without a password. `Alt` + `F4` accesses the system console, where you can\
    \ view the kernel and syslog messages.\n\nA shell and lots of other useful utilities\
    \ (net tools), such as the mount program, can be found in the `/bin` directory.\
    \ In `sbin`, find important file and network utilities for reviewing and repairing\
    \ the file system (e.g., `e2fsck`).\n\nFurthermore, this directory contains the\
    \ most important binaries for system maintenance, such as fdisk, mkfs, mount,\
    \ mount, init, and shutdown, as well as ifconfig, route, and netstat for maintaining\
    \ the network.\n\nAn editor, vi, is located in `/usr/bin`. Also, tools like grep,\
    \ find, and less, along with telnet are available.\n\n# Accessing Your Normal\
    \ System\n\nTo mount your SuSE Linux system using the rescue system, use the mount\
    \ point `/mnt`. You can also use or create another directory.\n\nAs an example,\
    \ assume your normal system is put together according to the `/etc/fstab` shown\
    \ in the example File 38.\n\n| Device | Mount point | Type | Options | Dump |\
    \ Pass |\n|---|---|---|---|---:|---:|\n| `/dev/sdb5` | `swap` | `swap` | `defaults`\
    \ | 0 | 0 |\n| `/dev/sdb3` | `/` | `ext2` | `defaults` | 1 | 1 |\n| `/dev/sdb6`\
    \ | `/usr` | `ext2` | `defaults` | 1 | 2 |\n\n*File 38: Sample `/etc/fstab`*\n\
    \n> **Caution**\n> \n> Pay attention to the order of steps outlined in the following\
    \ section for mounting the various devices.\n\nTo access your entire system, mount\
    \ it step-by-step in the `/mnt` directory using the following commands:\n\n```\n\
    earch:/ # mount /dev/sdb3 /mnt\nearch:/ # mount /dev/sdb6 /mnt/usr\n```"
  merge: -1
  img_proc: true
- pgno: 301
  md: 'Now, you can access your entire system and, for example, correct mistakes in
    configuration files such as `/etc/fstab`, `/etc/passwd`, and `/etc/inittab`. The
    configuration files are now located in the `/mnt/etc` directory instead of in
    `/etc`.


    To recover even completely lost partitions with the fdisk program by simply setting
    it up again, determine where on the hard disk the partitions were previously located
    and make a printout of the `/etc/fstab` directory as well as the output of `fdisk`.


    ```

    earth:  # fdisk -l /dev/(disk)

    ```


    Instead of the `(disk)` variable, insert, in order, the device names of your hard
    disks, such as `hda`.


    # Repairing File Systems


    Damaged file systems are tricky problems for the rescue system. This could happen
    after an unscheduled shutdown caused by power failure or a system crash. Generally,
    file systems cannot be repaired on a running system. If you encounter really severe
    problems, you may not even be able to mount your root file system so the system
    boot ends in a "kernel panic". Here, the only chance is to repair the system from
    the "outside" using a rescue system.


    The SuSE Linux rescue system contains the utilities e2fsck and dumpe2fs (for diagnosis).
    These should remedy most problems.


    In an emergency, man pages often are not available. That is why we have included
    them in this manual in Appendix A on page 431.


    Example: If mounting a file system fails due to an invalid superblock, the e2fsck
    program would probably fail, too. If this were the case, your superblock may be
    corrupted, too. There are copies of the superblock located every 8192 blocks (8193,
    16385, etc.). If your superblock is corrupted, try one of the copies instead.
    This is accomplished by entering the command:


    ```

    earth:  # e2fsck -f -b 8193 /dev/damaged_partition

    ```


    The `-f` option forces the file system check and overrides e2fsck’s error so that
    — since the superblock copy is intact — everything is fine.


    # Virtual Consoles


    Linux is a multiuser and multitasking system. You will learn to appreciate the
    advantages of these features, even on a stand-alone PC system.'
  merge: -1
  img_proc: true
- pgno: 302
  md: 'In text mode, there are six virtual consoles available. Switch between them
    using `(Alt + F1)` to `(Alt + F6)`. The seventh console is reserved for X11. By
    modifying the `/etc/inittab` file, assign more or fewer consoles. To switch to
    a console from X11 without leaving X11, use `(Ctrl + Alt + F1)` to `(Ctrl + Alt
    + F6)`. `(Alt + F7)` then returns to X11.


    # Keyboard Layout


    To standardize the keyboard mapping of programs, changes were made to the following
    files:


    ```

    ```text

    /etc/inputrc

    /usr/X11R6/lib/X11/Xmodmap

    /etc/skel/.Xmodmap

    /etc/skel/.exrc

    /etc/skel/.less

    /etc/skel/.lesskey

    /etc/csh.cshrc

    /etc/termcap

    /usr/lib/terminfo/x/xterm

    /usr/X11R6/lib/X11/app-defaults/XTerm

    /usr/share/emacs/(VERSION)/site-lisp/term/*.el

    /usr/lib/joerc

    ```

    ```


    These changes only affect applications that make use of terminfo entries or whose
    configuration files are changed directly (vi, less, etc.). Other non-SuSE applications
    should be adjusted to these defaults.


    Under X, the compose key (“multikey”) can be accessed using the key combination
    `(Ctrl + Shift)` (right). Also see the corresponding entry in `/usr/X11R6/lib/X11/Xmodmap`.'
  merge: -1
  img_proc: true
- pgno: 303
  md: "# Local Adjustments — I18N/L10N\n\nSuSE Linux is, to a very large extent, internationalized\
    \ and can be modified for local needs in a flexible manner. In other words, internationalization\
    \ (“I18N”) allows specific localizations (“L10N”). The abbreviations I18N and\
    \ L10N are derived from the first and last letters of the words and, in between,\
    \ the number of letters omitted.\n\nSettings are made via LC_* variables defined\
    \ in the file /etc/sysconfig/language. This refers not only to “native language\
    \ support”, but also to the categories Messages (Language), Character Set, Sort\
    \ Order, Time and Date, Numbers, and Money. Each of these categories can be defined\
    \ directly via its own variable or indirectly via a variable in the file language\
    \ (see the man page for locale (man 5 locale)).\n\n+   1. **RC_LC_MESSAGES, RC_LC_CTYPE,\
    \ RC_LC_COLLATE, RC_LC_TIME, RC_LC_NUMERIC, RC_LC_MONETARY:** These variables\
    \ are passed to the shell without the RC_ prefix and determine the above categories.\
    \ The files concerned are listed below. DEFAULT_LANGUAGE is defined in language\
    \ directly and is not exported. The current setting can be shown with the command\
    \ `locale`.\n+   \n+   2. **RC_LC_ALL:** This variable (if set) overwrites the\
    \ values of the variables mentioned in item 1.\n+   \n+   3. **RC_LANG:** If none\
    \ of the above variables are set, this is the “fallback”. By default, SuSE Linux\
    \ only sets RC_LANG. This makes it easier for users to enter their own values.\n\
    +   \n+   4. **ROOT_USES_LANG:** A yes or no variable. If it is set to no, root\
    \ always works in the POSIX environment.\n+   \n+   5. **DEFAULT_LANGUAGE:** This\
    \ variable has two functions. It defines the language in which YaST2 is started\
    \ and, at the same time, is the fallback if RC_LANG is not set. It is set by YaST2,\
    \ depending on the language chosen in the language selection menu. To avoid any\
    \ misunderstanding: DEFAULT_LANGUAGE is not passed to the shell by SuSEconfig\
    \ as LANGUAGE, but the value of this variable is only used to set LANG, if it\
    \ is required.\n\nLANGUAGE can also be used to define a “fallback chain” for language\
    \ support. Read on page 294 to see how this is done.\n\nDEFAULT_LANGUAGE can be\
    \ influenced by YaST2 via the item ‘Select language’. The other variables can\
    \ be set via the sysconfig editor."
  merge: -1
  img_proc: true
- pgno: 304
  md: "The value of such a variable contains the language code, country code, encoding,\
    \ and modifier. The individual components are connected by special characters:\n\
    \n```\n`LANG={language}[_{[COUNTRY]}.Encoding[@Modifier]]`\n```\n\n# Some Examples\n\
    \nYou should always set the language and country codes together. Language settings\
    \ follow the standard ISO 639 (http://www.evertype.com/standards/iso639/iso639-en.html\
    \ and http://www.loc.gov/standards/iso639-2/). Country codes are listed in ISO\
    \ 3166, see (http://www.din.de/gremien/nas/nas/iso3166/codlistp1/en_list.htm).\
    \ It only makes sense to set values for which usable description files can be\
    \ found in /usr/lib/locale. Additional description files can be created from the\
    \ files in /usr/share/i18n using the command localedef. A description file for\
    \ en_US.UTF-8 (for English and United States) can be created with:\n\n```\n`earth:~\
    \ # localedef -i en_US -f UTF-8 en_US.UTF-8`\n```\n\n```\n`LANG=en_US.ISO-8859-1`\n\
    ```\n\nThis sets the variable to English language, country code to United States,\
    \ and the character set to ISO-8859-1. This character set does not support the\
    \ Euro sign, but it will be useful sometimes for programs that have not been updated\
    \ to support ISO-8859-15. The string defining the charset (ISO-8859-1 in our case)\
    \ will then be evaluated by programs like Emacs.\n\n```\n`LANG=en_US.UTF-8`\n\
    ```\n\nIf you use a Unicode xterm, it is necessary to specify UTF-8 as well. To\
    \ achieve this, make a small shell script called uxterm to start xterm with UTF-8\
    \ loaded each time. See File 39.\n\n```\n```bash\n%\n#!/bin/bash\nexport LANG=en_US.UTF-8\n\
    xterm -fn \\\\\n    '-Misc-Fixed-Medium-R-Normal--18 120-100-100-C-90-\nISO10646-1'\
    \ \\\\\n    -T 'xterm UTF-8' $*\n```\n```\n\n*File 39: uxterm to Start a Unicode\
    \ xterm*"
  merge: -1
  img_proc: true
- pgno: 305
  md: 'SuSEconfig reads the variables in `/etc/sysconfig/language` and writes the
    necessary changes to `/etc/SuSEconfig/profile` and `/etc/SuSEconfig/csh.cshrc`.
    `/etc/SuSEconfig/profile` is read or “sourced” by `/etc/profile`. `/etc/SuSEconfig/csh.cshrc`
    is sourced by `/etc/csh.cshrc`. This makes the settings available system-wide.


    # Settings for Language Support


    Files in the category *Messages* are, as a rule, only stored in the language directory
    (e.g. en) to have a fallback. If you set LANG to en_US, and the “message” file
    in `/usr/share/locale/en_US/LC_MESSAGES` does not exist, it will fall back to
    `/usr/share/locale/en/LC_MESSAGES`.

    A fallback chain can also be defined, for example, for Breton → French or for
    Galician → Spanish → Portuguese:


    ```

    LANGUAGE="br_FR:fr_FR"

    LANGUAGE="gl_ES:es_ES:pt_PT"

    ```


    If desired, use the Norwegian variants “ nynorsk” and “bokmål” instead (with additional
    fallback to no):


    ```

    LANG="nn_NO"

    LANGUAGE="nn_NO:nb_NO:no"

    ```


    or


    ```

    LANG="nb_NO"

    LANGUAGE="nb_NO:nn_NO:no"

    ```


    Note that in Norwegian, LC_TIME is also treated differently.


    # Possible Problems


    +   - The thousand comma is not recognized. LANG is probably set to en, but the
    description the glibc uses is located in `/usr/share/locale/en_US/LC_NUMERIC`.
    LC_NUMERIC, for example, must be set to en_US.


    # For More Information


    +   - *The GNU C Library Reference Manual*, Chap. “Locales and Internationalization,”
    included in package glibc-info-series doc.

    +   - Markus Kuhn, *UTF-8 and Unicode FAQ for Unix/Linux*, currently at `http://www.ci.cam.ac.uk/~mgk25/unicode.html`.'
  merge: -1
  img_proc: true
