- pgno: 86
  md: 'The files of the RPM database are placed in `/var/lib/rpm`. If the partition
    `/usr` has a size of 1 GB, this database can occupy nearly 30 MB, especially after
    a complete update. If the database is much bigger than expected, it is useful
    to rebuild the database with the option `--rebuilddb`. Before doing this, make
    a backup of the old database. The cron script `cron.daily` makes daily copies
    of the database (packed with gzip) and stores them in `/var/adm/backup/rpmdb`.
    The number of copies is controlled by the variable `{MAX_RPMDB_BACKUPS}` (default:
    5) in `/etc/rc.config`. The size of a single backup is approximately 3 MB. (This
    value is valid for a 1 GB `/usr` partition.) Take this space requirement into
    account when deciding how large the root partition should be. If `/var` has its
    own partition, you do not have to worry about this.


    # Installing and Compiling Source Packages


    All source packages of SuSE Linux are located in the series `zq` (source packages)
    and carry a `.spm` extension (“Source RPMS”).


    > > **Tip**

    > >

    > > These packages can be handled in the same way as all other packages. The packages,
    however, will not be found in the RPM database (and are not marked with an `[i]`
    in YaST), as only “installed” software is listed. This is because the source packages
    are not incorporated in the RPM database. Only installed operating system software
    is listed in the RPM database.


    > > **Tip** — The rpm directories in `/usr/src/packages` must exist (if none of
    your own settings have been made, for example, in `/etc/rpmrc`).


    +   - **SOURCES** — this is for the original sources (`.tar.gz` files, etc.) and
    for distribution-specific adjustments (`.dif` files).

    +   - **SPECS** — for the “.spec” files, similar to a meta Makefile, which control
    the “build” process.

    +   - **BUILD** — all the sources are unpacked, patched, and compiled in this
    directory.

    +   - **RPMS** — this is where the completed “binary” packages are stored.

    +   - **SRPMS** — here are the “source” RPMs.


    > > **Note**

    > >

    > > Do not experiment with essential system packages, such as package `libc`,
    package `rpm`, or package `nkit`. This could lead to a malfunctioning system.'
  merge: -1
  img_proc: true
- pgno: 87
  md: 'When you install a source package from series zg with YaST, all the necessary
    components will be installed in `/usr/src/packages`: the sources and the adjustments
    in `SOURCES`, the relevant `.spec` file in `SPECS`. To “create packages” see [Bai97].
    More information can be obtained from the man page for rpm.


    For our example, we will choose the `wget.spm` package. After you have installed
    the package with YaST, you should have the following files:


    ```

    `/usr/src/packages/SPECS/wget.spec /usr/src/packages/SOURCES/wget-1.4.5.diff /usr/src/packages/SOURCES/wget-1.4.5.tar.gz`

    ```


    `rpm -ba (X) /usr/src/packages/SPECS/wget.spec` starts the compilation. Here `(X)`
    is a valid card for different stages of the build process (see the output of `rpm
    --help` or the RPM documentation). Here is a short explanation:


    +   - `-bp` Prepare sources in `/usr/src/packages/BUILD`: unpack and patch.

    +   - `-bc` the same as `-bp`, but with additional compilation.

    +   - `-bi` the same as `-bp`, but with additional installation of the built software.

    +     > Caution: if the package does not support the BuildRoot feature, you might
    overwrite configuration files.

    +   - `-bb` the same as `-bi`, with the additional creation of the “binary” package.
    If the compile was successful, the binary should be in `/usr/src/packages/RPMS`.

    +   - `-ba` the same as `-bb`, with the additional creation of the “source RPM”.
    If the compilation was successful, the binary should be in `/usr/src/packages/SRPMS`.

    +   - `-short-circuit` lets you skip specific steps.


    This binary RPM may now be installed by invoking `rpm -i` or, even better, with
    `rpm -U` (to make it appear in the RPM database).


    # Other Tools for Working with RPM Archives


    Midnight Commander (mc) is able to “browse” RPM archives and to operate on parts
    of them. This tool works on an RPM package archive as if the archive were a regular
    file system. Using mc, view HEADER information with `F3` and copy parts of an
    archive with `F5`. Incidentally, there is now even an Emacs front-end for rpm.


    xrpm is a new graphical RPM manager, written in Python, which supports commands
    to FTP-accessed archives.


    KDE can use the tool kpm, a graphical interface in the X Window System, for RPM
    management. krpm is currently in an early development stage.'
  merge: -1
  img_proc: true
