    sections in detail. This summary indicates, for example, whether basic settings
    have been completely reconfigured, whether configuration files have been moved
    to other places, or whether common applications have been significantly changed.
    Only the modifications that would affect the daily use of the system at either
    the user or the administrator level are mentioned below. The list is by no means
    exhaustive or complete. The following also makes references to SDB (Support Database)
    articles. These articles are in the package sdb_en, series doc.


    Problems and bugs for each version have been published on the web server as soon
    as they were recognized. See the links listed below. Important updates of individual
    packages can be accessed at http://www.suse.de/en/support/download/.


    # From 6.x to 7.0


