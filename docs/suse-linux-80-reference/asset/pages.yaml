  md: 'have a precise list of information displayed (updates, configuration, modifications,
    etc.) on a specific package. This example is on the package *rpm*. In any case,
    only the last five entries in the RPM database are installed to save space for
    the installed system. All entries (dating back to the last two years) are included
    in the package itself. This query only works if CD 1 is mounted at /cdrom:


    ```

    earth:  # rpm -qp --changelog /cdrom/suse/a1/rpm.rpm

    ```


    With the help of the installed RPM database, verification checks can be made.
    These checks are initiated with the option -V (or -y or --verify). With this option,
    rpm will show all files in a package that have been changed since installation.
    rpm uses eight character symbols to give some hints about the following changes:


    | Symbol | Meaning |

    |---|---|

    | S | MD5 check sum |

    | 5 | File size |

    | L | Symbolic link |

    | T | Modification time |

    | D | Major and minor device numbers |

    | U | Owner |

    | G | Group |

    | M | Mode (permissions and file type) |


    # *Table 4.2: RPM Verify Options*


    In the case of configuration files, the letter c will be printed. For example,
    if you have changed /etc/wgetrc from the package wget, you may see:


    ```

    earth:  # rpm -V wget

    ```


    ```

    S.5....T.  c /etc/wgetrc

    ```'
