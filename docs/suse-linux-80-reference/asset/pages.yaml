  md: 'Example: `hdc=1050,32,64`


    +   - **EIDE controller chipsets**

    +     `ide0=(chipset)`


    Some EIDE controllers have faulty chipsets or cause problems if the secondary
    controller is used.


    Many of these chipsets are now supported in the kernel. This support needs to
    be specially activated, however, using a kernel parameter.


    The chipsets shown in Table 10.2 are configurable.


    | Chipset | Description |

    |---|---|

    | CMD 640 | This chipset is found on many motherboards. Since it contains many
    bugs, the kernel offers a special support that recognizes the chip and bypasses
    the problems. In some cases, use of the secondary controller is only possible
    by using this special support. In PCI systems, this chip is automatically recognized.
    For VLB systems, the following parameter is needed: `ide0=cmd640_vlb`. |

    | RZ 1000 | This chip is used on many motherboards that use the Neptune chipset
    and it is buggy. If support for this chip is activated, the system works a little
    slower, but reliably. An additional activation with a kernel parameter is not
    required. |

    | DTC-2278 | Only activating this driver via `ide0=dtc2278` makes it possible
    to use the secondary controller. |

    | Holtek HT6560B | The following parameter is needed to activate the secondary
    controller. `ide0=ht6560b`. |

    | QDI QD6580 | If this driver is activated, it enables a higher speed: `ide0=qd6580`.
    |

    | UMC 8672 | For activating the secondary controller, the following parameter
    is needed: `ide0=umc8672`. |

    | ALI M1439/M1445 | The following parameter is needed for activating the secondary
    controller: `ide0=ali14xx`. |

    | PROMISE DC4030 | For activating the secondary controller, the following parameter
    is needed: `ide0=dc4030`. CD-ROMs and tapes on the secondary controller are not
    supported yet. |


    # Table 10.2: *Special EIDE Chipsets*'
