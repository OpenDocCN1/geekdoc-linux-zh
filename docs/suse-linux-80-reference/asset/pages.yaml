    Sets variable LANG for locale. This is the default for local users, as long as
    no RC_LC_* variables are used. The respective sysconfig variables are: RC_LC_ALL
    (overwrites LC_* and LANG!), RC_LC_MESSAGES, RC_LC_CTYPE, RC_LC_MONETARY, RC_LC_NUMERIC,
    RC_LC_TIME, and RC_LC_COLLATE.


