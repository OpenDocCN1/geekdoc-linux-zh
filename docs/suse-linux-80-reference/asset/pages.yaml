- pgno: 202
  md: '# # Printing


    This chapter provides background knowledge on printing in Linux. It will also
    illustrate how this knowledge can be put to use. Included is information about
    connecting to printers both locally and in a network, configuring the print system
    with lprsetup, and information about print filters.


    +   - Printing Basics and Requirements — 192

    +   - Connecting Printers Locally — 194

    +   - Configuring the Print System with lprsetup — 203

    +   - The Printer Spooler and Its Management Tools — 203

    +   - Generating Print Jobs — 205

    +   - The Print Filter — 207

    +   - A Little About Ghostscript — 215

    +   - A Little About a2ps — 218

    +   - ASCII Text Encoding — 220

    +   - Printing in a TCP/IP Network — 221

    +   - Custom-Generated Print Filters — 225'
  merge: -1
  img_proc: true
- pgno: 203
  md: "# Printing Basics and Requirements\n\nPrinting basics and printer configuration\
    \ with YaST2 are described in *Basics in the Chapter YaST2, Printer*. Here is\
    \ a short summary of processes in the print system.\n\n# Process of a Print Job\n\
    \n+   1. The user or an application generates a print job with the `lpr` command.\n\
    +   \n+   2. The data to print is written to the print queue, where the printer\
    \ spooler subsequently relays it to the print filter.\n+   \n+   3. The print\
    \ filter can also define the type of the data to print and, if necessary, uses\
    \ Ghostscript to convert this data to the language recognized by the given printer.\
    \ Finally, the filter sends the printer-specific data to the printer.\n+   \n\
    +   4. After the print job has been sent to the printer in its entirety, the printer\
    \ spooler deletes the print job from the queue.\n\n# Examples of Default Printer\
    \ Languages\n\n**ASCII text** — Normally, any printer is at least capable of outputting\
    \ ASCII text.\n\n**PostScript** — PostScript is the default Unix and Linux language\
    \ used to generate output, which can then be printed by PostScript printers directly.\n\
    \n**PCL5e or PCL6** — These printer languages are common for laser printers.\n\
    \n**PCL3** — This printer language is understood by most HP DeskJet printers and\
    \ compatible models.\n\n**ESC/P, ESC/P2 or ESC/P dot matrix** — These printer\
    \ languages are understood by nearly all Epson printers and compatible devices.\n\
    \n# GDI Printers\n\nPrinters that do not understand any of the default printer\
    \ languages listed above, but can only be accessed via a proprietary protocol,\
    \ are referred to as “GDI printers”. Such printers usually cannot be used in Linux.\
    \ However, there are some GDI printers that also understand a default printer\
    \ language on the hardware level. These printers need to be configured to use\
    \ that language. Consult your printer manual for the necessary information."
  merge: -1
  img_proc: true
- pgno: 204
  md: "# Hardware and Software Requirements\n\n+   - Check whether your printer is\
    \ supported by SuSE Linux. Look at the lists on the installed system and on the\
    \ Internet at\n+     - `file:/usr/share/doc/packages/ghostscript/catalog.devices`\n\
    +     - `http://cdb.suse.de` and `http://hardwaredb.suse.de/` The Ghostscript\
    \ drivers described here are included in the selection corresponding to each model\
    \ offered by YaST2 in the printer configuration.\n+     - `http://www.linuxprinting.org`\
    \ → The ‘Database’ (`http://www.linuxprinting.org/database.html`) and `http://www.linuxprinting.org/printer_list.cgi`\n\
    +     - `http://www.cs.wisc.edu/~ghost/`\n\n> **Note**\n> \n> You will sometimes\
    \ hear of printers that require the current version of Aladdin Ghostscript. For\
    \ licensing reasons, SuSE Linux includes the slightly different GNU Ghostscript.\
    \ In most cases, a GNU Ghostscript driver can be found that is suitable for any\
    \ given printer.\n\n+   - Check that you can make the necessary physical and logical\
    \ connections to the printer. See Section *Connecting Printers Locally* on the\
    \ following page for details of this.\n+   - A self-compiled kernel could lack\
    \ the necessary support for printing; if in doubt, first install and boot from\
    \ a standard SuSE kernel. (This can be done through YaST2.)\n+   - It is recommended\
    \ to install the ‘Standard System’.\n\n# Possible Problems\n\nThe most common\
    \ possible problems are discussed in the *Basics* manual. For other problems,\
    \ refer to the Support Database (`http://www.suse.de/sdb/en/html`) under the keywords\
    \ “printer configuration”."
  merge: -1
  img_proc: true
- pgno: 205
  md: '# Defining a Suitable Printer Driver


    In the lists mentioned in Section *Hardware and Software Requirements* on the
    page before, Ghostscript drivers for specific printer models are provided. If
    your supplier cannot give any Linux-specific information on your printer model,
    the following tips may help:


    +   - Find out if your printer is compatible with a model that does run in Linux
    then use the Ghostscript driver for this compatible model. “Compatible in Linux”
    means that your printer can print correctly with the same binary control sequences
    as the compatible model — the printer can “understand” the same printer language
    directly (rather than just being capable of emulating it in Windows through the
    driver software).


    The fact that two printers have similar names is not always a guarantee that they
    are compatible. This is because printers with similar names do not always understand
    the same printer language directly.


    +   - The best source of information about your printer’s native language is the
    manufacturer. In many cases, find the printer language listed among the technical
    data in the printer manual. Some examples of existing printer languages are given
    in Section *Examples of Default Printer Languages* on page 192.


    # Connecting Printers Locally


    # Parallel Ports


    A printer can be connected to a Linux system via a parallel port. A printer on
    a parallel port is addressed by the kernel’s parport subsystem. The basic configuration
    of a parallel port with YaST2 is explained in the *Basics* manual in Section *Manual
    Configuration*, so only supplemental information is provided here. The parallel
    port must be made known to the parport subsystem by loading architecture-specific
    kernel modules. In this way, a number of devices in series can be used simultaneously
    via one parallel port. The numbering of the device files for parallel port printers
    begins with `/dev/lp0`. To print over the first parallel port, the modules `parport`,
    `parport_pc`, and `lp` must be loaded for a SuSE standard kernel. This is normally
    taken care of by the Kernel Module Loader, kmod (see Section *Kmod — the Kernel
    Module Loader* on page 232) as soon as the corresponding device file (e.g., `/dev/lp0`)
    is accessed.'
  merge: -1
  img_proc: true
- pgno: 206
  md: 'When the kernel module `parport_pc` is loaded without any special parameters,
    it will attempt to automatically detect and configure the parallel ports. In rare
    circumstances, this does not work and the parameters for the `parport_pc` module
    must be configured manually.


    # Manual Configuration


    If certain conditions for automatic configuration are not met or if you require
    a custom configuration, configure the parallel port manually.


    # Hardware connection (port)


    If YaST2 is able to detect the printer model automatically, it is assumed that
    the printer connection is working on the hardware level. If this is the case,
    no settings will have to be made here.


    If the printer was not detected at all, the printer port needs to be configured
    manually. Start the YaST2 Control Center, select ‘Hardware’ then ‘Automatic Printer
    Detection’. An unrecognized printer is listed under the available printers as
    ‘Other (not recognized)’. Next, click ‘Configure’, choose your port in the following
    menu, and click ‘Next’. Then you will see the corresponding ports:


    +   - `/dev/lp0` — first parallel port

    +   - `/dev/usblp0` — port for a USB printer


    At this point, run the test in YaST2 to determine whether your printer can be
    accessed over the selected port. Then, click ‘Next’.


    Select your model now. Click ‘Info’ to obtain information about Linux support
    for each printer and, in case of GDI printers, where you might find Linux drivers.


    If your printer model is not listed, click ‘Generic Printers’ and select one of
    the generic Ghostscript drivers for the standard printer languages.


    > > **Note**

    > >

    > > Consult the printer manufacturer if you do not know which printer language
    your model understands or whether it is compatible with one of the models listed
    in the printer database. Your printer must be able to “understand” the same printer
    language on the hardware level. Software emulation is not sufficient.


    You get the best results when the printer is connected directly to the first parallel
    port and the following settings are specified in the BIOS:


    I/O address 378 (hexadecimal)'
  merge: -1
  img_proc: true
- pgno: 207
  md: 'Interrupt is not relevant (by default, no interrupt is used).


    Mode Normal, SPP, or Output Only (other modes do not always function)


    DMA is disabled (should automatically be disabled for any of the above modes)


    If, despite these BIOS settings, the printer is still not accessible over the
    first parallel port, the IO address must be explicitly entered under the detailed
    parallel port settings in accordance with the settings made in the BIOS in the
    format 0x378. If there are two parallel ports set to the IO addresses 378 and
    278 (hexadecimal), they usually have to be entered in the format of 0x378, 0x278.


    # Printer name


    Printer name refers to the “queue”, which will often have to be given when entering
    the command to print. Therefore, you should only use short names in lowercase
    letters. Numbers can also be used in the names. By default, lp is configured as
    the first queue.


    A raw queue can be set up for use in certain situations. In a raw queue, the data
    to print is not converted by a printer filter, but is sent in raw form directly
    to the printer. For this reason, the data to print must already exist in the model’s
    respective printer language. A queue can be set up with or without “form feed”,
    depending on whether the printer spooler is doing a form feed after each printout,
    so the last page printed is ejected from the printer as well. Normally, the Ghostscript
    driver takes care of this, therefore no explicit formfeed needs to be configured.


    # Ghostscript driver and printer language


    Since the Ghostscript driver generates printer-specific data for non-PostScript
    printers, the configuration of the Ghostscript driver is key to determining the
    type of printout. First, the selected Ghostscript driver, then, the driver-specific
    settings define the print image. For one printer, different configurations can
    be set to get different print images.


    If YaST2 automatically detected the printer model or the model is found in the
    printer database, you will be presented with a reasonable selection of compatible
    Ghostscript drivers. If the printer model is not included in the printer database,
    you will be provided with a selection of generic Ghostscript drivers for the standard
    printer languages.'
  merge: -1
  img_proc: true
- pgno: 208
  md: '> > **Note**

    > >

    > > You might want to consult the manufacturer as to which printer language your
    model understands or with which model listed in the printer database your printer
    is hardware-compatible. The printers must be able to understand the same printer
    language in terms of hardware, without using additional emulation software.


    If you want to use a Ghostscript driver that is not listed, you might find it
    listed under the manufacturer.


    Specific parameters can often be set for each Ghostscript driver. The correlation
    between a selected value and its options can be seen in the structure of the selection
    menu itself — in the menu items and their respective subitems.


    Not all combinations of driver settings work for every printer model — particularly
    if a high resolution is selected. Print the YaST2 test page to make sure your
    settings work. If the test print produces undesired results (e.g., a lot of blank
    pages with just some characters on them), the print job can be immediately stopped
    at the printer by taking out all the paper, then clicking the ‘Stop’ button. However,
    some printers will not print again later if you do that. Therefore, it is better
    to just click the ‘Stop’ button and wait for the printing to stop.


    # Hardware-Dependent Settings


    Although all the available options should produce the desired printout, you should
    still check the settings by printing out a test page.


    +   - The page layout can only be specified for ASCII text printouts, not for
    graphics or documents produced by specific applications.

    +   - An ascii queue can be configured for special cases. In ascii queues, the
    print filter is forced to output ASCII text. This is needed, for instance, when
    ASCII text files are not recognized as such by the print filter for whatever reason.

    +   - Country-specific encoding relates to the display of special characters in
    ASCII text printouts and simple text output from Netscape HTML pages.'
