    earth: # mount -t msdos /dev/fd0 /mnt

    earth: # cp /cdrom/suse/images/eide.lkr /mnt/linux

    earth: # umount /mnt

    ```


    # Supported CD-ROM Drives


    Almost every CD-ROM drive is now supported by Linux.


    +   - Using ATAPI drives (those drives connected to an EIDE controller), there
    should be no problems at all.

    +   - A key issue for SCSI CD-ROM drives is whether the SCSI controller connected
    to the CD-ROM drive is supported. The supported SCSI controllers are listed in
    the http://cdb.suse.de/. However, if your SCSI controller is not supported and
    your hard drive is connected to it, you will have a problem anyway.

    +   - Many proprietary CD-ROM drives are supported under Linux. Here is the most
    likely place for problems to occur. If your drive is not mentioned, try choosing
    a similar type.

    +   - Parallel port CD-ROM drives have become very popular. Unfortunately, there
    is no standard, leading to unexpected trouble. SuSE Linux contains a number of
    alpha drivers for some devices. If none of them works, install via DOS. Keep in
    mind that you may access some of these devices only after they have been set up
    under DOS. You might need a warm reboot.


    # ATAPI CD-ROM Hangs While Reading


    If your ATAPI CD-ROM is not recognized or it hangs while reading, this is most
    frequently due to incorrectly installed hardware. All devices must be connected
    to the EIDE controller in the correct order. The first device is master on the
    first controller. The second device is slave on the first controller. The third
    device should be master on the second controller, and so forth.


    It often occurs that there is only a CD-ROM besides the first device. The CD-ROM
    drive is sometimes connected as master to the second controller (secondary IDE
    controller). This is wrong and can cause Linux not to know what to do with this
    “gap”. Try to fix this by passing the appropriate parameter to the kernel (hdc=cdrom)
    (see section Kernel Parameters at the Boot Prompt on page 240).


    Sometimes one of the devices is just “misjumpered”. This means it is jumpered
    as slave, but is connected as master, or vice versa. When in doubt, check your
    hardware settings and correct them where necessary.'
  merge: -1
  img_proc: true
