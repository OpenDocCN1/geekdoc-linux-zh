- pgno: 233
  md: '# Overview: Possible Cases


    The main difference is how files to print are filtered. At a certain point in
    the chain, the output file must be converted to a format the printer can finally
    print: the printer language (PostScript, HP PCL, ESC/P). This conversion is done
    by the print filter. With network printers and print server units, the filtering
    must be done on the client computer, before sending out the print job. If a print
    server is used, the filtering can be done either on the client or on the print
    server. The following cases are possible:


    # Network printer with filtering on the client:


    +   1. Client: Converts file to printer data (prefilter)

    +   2. Client: Sends print data to the network printer (forward)


    # Print server unit with filtering on the client:


    +   1. Client: Converts file to print data (prefilter)

    +   2. Client: Sends print data to the print server unit (forward)

    +   3. Print server unit: Sends print data to the printer


    # Printer connected to a print server with filtering on the client:


    +   1. Client: Converts file to print data (prefilter)

    +   2. Client: Sends print data to the print server (forward)

    +   3. Print server: Sends print data to the printer


    # Printer connected to a print server with filtering on the print server:


    +   1. Client: Sends the file to the print server (forward)

    +   2. Print server: Converts the file to print data (filter)

    +   3. Print server: Sends the print data to the printer


    Since filtering is managed by the print server, there is no need to configure
    the client if you are using the LPRng spooler, as LPRng spoolers allow the lpd
    command to send print jobs directly to remote queues. See more on this in Section
    *Generating Print Jobs for Remote Queues* on page 206. The LPRng spooler (package
    lprng) must be installed on the client for this reason, but the spooler itself
    (the lpd) does not have to be running. Only an empty readable (for all users)
    file `/etc/printcap` must exist on the client and client users must know the name
    of the print server and the names of the different queues.'
  merge: -1
  img_proc: true
- pgno: 234
  md: '+   - A printer forwarding queue is required wherever it says “forward” in
    the above examples. The data is forwarded without filtering.

    +   - Where it says “prefilter” or “filter”, a print queue is required to filter
    the data. If filtering takes place on the client, this filter queue is a “prefilter”
    for the “printer forwarding queue” of the print server. If filtering takes place
    on the print server, the filter queue is one of the regular queues configured
    on the print server, such as `lp`.


    # Prerequisites


    The printer must be supported by SuSE Linux, since the prefilter produces printer-specific
    data in the same manner as for a locally connected printer (normally via Ghostscript).
    See Section *Connecting Printers Locally* on page 194 for more information on
    this.


    There must be a working TCP/IP connection to the network printer. The name service
    especially needs to be set up properly.


    # Configuration


    Use YaST2 to configure the required prefilter and forwarding queues and test all
    queues defined. The division into prefilter and forwarding queues is the classical
    configuration of printer spoolers that use lpd protocol (according to RFC 1179).


    With print server units or network printers, this may not work (see Section *In
    Case of Problems* on the following page. The LPRng spooler allows for other methods
    of accessing network printers or print server units. These methods are already,
    in part, supported by lprsetup. See `lprsetup --help` and the man page for `lprfilter`
    (man `lprfilter`). Detailed information for the LPRng spooler is outlined in the
    *LPRng Howto* in file: `/usr/share/doc/packages/lprng/LPRng-HOWTO.html`. The lpd
    protocol is also described there. file: `/usr/share/doc/packages/lprng/LPRng-HOWTO.html#NETWORKPRINTER`
    file: `/usr/share/doc/packages/lprng/LPRng-HOWTO.html#NETWORKPRINTER`.


    # In Case of Problems


    # Check the configuration of the prefilter


    Connect the printer directly to the first parallel port of the PC. Configure the
    printer as a local printer for testing purposes to eliminate any network problems
    that may exist. Proceed as described in Section *Connecting Printers Locally*
    on page 194.'
