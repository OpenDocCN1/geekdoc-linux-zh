- pgno: 60
  md: '# Partitioning Tips


    Are Linux and its file systems completely new to you? Then you probably ask yourself
    questions like: How much space should I assign to Linux? What’s the minimum I
    need? What’s best for my needs? How should I divide up the available space?


    # Partition Types on a PC


    Every hard disk contains a partition table that has space for up to four entries.
    Each entry may be either a primary or an extended partition. Only one extended
    partition may be assigned.


    Primary partitions are a continuous section of cylinders assigned to one operating
    system. Using primary partitions, you would only be able to create four partitions.
    More will not fit into the partition table.


    An extended partition itself is also a continuous section of cylinders, but you
    can divide an extended partition into multiple logical partitions, which do not
    need a separate entry in the partition table. The extended partition is like a
    container for logical partitions.


    If you need more than four partitions, make one an extended partition in which
    to assign logical partitions. The maximum is fifteen partitions for SCSI systems
    and sixty-three for (E)IDE systems.


    Linux does not care on what kind of partition it is installed. It can be primary
    or logical.


    # Time to Decide


    Let’s start with the minimum SuSE Linux install: 180 MB. This only works if you
    use the machine for a simple purpose, for example, you only work on a text console
    (no X Window System). If you want to take a look at X and start a few applications,
    you will need 500 MB. Both values include swap.


    What is a reasonable size for an installation? 1 GB — in this world of several
    gigabyte hard disks, this is quite a modest requirement. There is no upper limit.


    What’s the best for your needs? That depends on what you want to do:


    +   - Working in X and using applications such as **Applixware** and **Netscape**
    will require 1.2 GB.

    +   - To create your own applications in X, you also need 1.2 GB.

    +   - Both of the above items: 2 GB.

    +   - To compile your own X servers and write your own CDs together with the items
    mentioned above: 4 GB.'
  merge: -1
  img_proc: true
- pgno: 61
  md: "+   - To set up an Internet or FTP server: 700 MB minimum.\n\nHow should the\
    \ disk be divided up? A simple question which requires a not-so-simple answer.\n\
    \n> > **Tip**  \n> > It is a very good idea, especially for novices, to follow\
    \ the strategy suggested by YaST: if needed, place a small partition at the beginning\
    \ of the hard disk for `/boot` (about 10 MB, for large drives, a 1 cylinder is\
    \ enough), a partition for swap (128–256 MB), all the rest for `/`.\n\nIf you\
    \ want to partition something, but also as little as possible, then the following\
    \ simple rules apply.\n\n+   - Up to 500 MB: swap partition and root (`/`)\n+\
    \   - 500 MB to 4 GB: small boot partition for the kernel and LILO at the very\
    \ beginning of the hard disk (`/boot`, approximately 8–16 MB or 1 cylinder), a\
    \ swap partition, and the rest for the root partition `/`.\n+   - More than 4\
    \ GB: boot (`/boot`), swap, root (250 MB), home (`/home` with approximately 20\
    \ MB per user) and the rest for applications (`/usr`), possibly a further partition\
    \ for `/opt` and for `/var`.\n\n> > **Note**  \n> > If you plan to start Linux\
    \ directly from the hard disk, you will need a Linux partition below the “1024-cylinder\
    \ limit” as a boot partition (read more on this in *LILO Locations* on page 94).\
    \ This does not concern you if you are starting Linux from DOS/Windows with loadlin.\n\
    \nBear in mind that some programs (mostly commercial programs) install their data\
    \ in `/opt`. If you are installing a number of these, either create a separate\
    \ partition for `/opt` or enlarge the dimensions of the root partition accordingly.\
    \ KDE and GNOME are also stored in `/opt`.\n\n# Partitioning for Experts\n\nIn\
    \ Section *Partitioning Tips* on the page before, details are given as to how\
    \ to partition your system. This section should provide more detailed information\
    \ for tailoring a system that best suits your needs. This section is mainly of\
    \ interest for those who want an optimized system as far as security and performance\
    \ are concerned and who are prepared to reinstall the complete system where necessary."
