    \ convert the data to PostScript. This script receives the print data from stdin\
    \ and sends PostScript to stdout.\n+   \n+   2. The PostScript data can be reformatted\
    \ if there is an appropriate script in `/etc/lpdfilter/queue/pre`. You can also\
    \ add your own PostScript preloads using a script for this purpose. This script\
    \ receives PostScript data from stdin and sends the PostScript output to stdout.\
    \ Programs for reformatting PostScript data can be found in the package `psutils`.\
    \ `pstops`, in particular, features extensive reformatting functions. Refer to\
    \ the man page for pstops (man `pstops`) for more information on this.\n+   \n\
    +   3. Special Ghostscript parameters: The parameters for running Ghostscript\
    \ are saved to the `/etc/lpdfilter/queue/upp` file when configuring with YaST2.\
    \ Special Ghostscript parameters can also be added manually to this file. See\
    \ Section *A Little About Ghostscript* on page 215 for more information about\
    \ Ghostscript parameters.\n+   \n+   4. The output of Ghostscript can also be\
    \ reformatted if an appropriate script is located in `/etc/lpdfilter/queue/post`.\
    \ This script receives the Ghostscript output from stdin and sends the printer-specific\
    \ data to stdout.\n\n# A Hardware-Independent Example\n\nSuppose you want a queue\
    \ called `test` to print out ASCII text with numbered lines and with two pages\
    \ reduced to fit on one. Then, you could create the scripts `/etc/lpdfilter/test/ascii2ps`\
    \ and `/etc/lpdfilter/test/pre`:\n\n```\n```bash\n#!/bin/bash\ncat -n - | a2ps\
    \ -1 --stdin=',' -o -\n```\n```"
