- pgno: 420
  md: 'SquidGuard is a free (GPL), flexible, and fast filter, redirector, and access
    controller plug-in for Squid. It lets you define multiple access rules with different
    restrictions for different user groups on a Squid cache. SquidGuard uses Squid''s
    standard redirector interface.


    SquidGuard can be used for the following:


    +   - limit the web access for some users to a list of accepted or well-known
    web servers or URLs

    +   - block access to some listed or blacklisted web servers or URLs for some
    users

    +   - block access to URLs matching a list of regular expressions or words for
    some users

    +   - redirect blocked URLs to an “intelligent” CGI-based info page

    +   - redirect unregistered users to a registration form

    +   - redirect banners to an empty GIF

    +   - have different access rules based on time of day, day of the week, date,
    etc.

    +   - have different rules for different user groups

    +   - and much more


    Neither SquidGuard or Squid can be used to:


    +   - Edit, filter, or censor text inside documents

    +   - Edit, filter, or censor HTML-embedded script languages such as JavaScript
    or VBscript


    # Using SquidGuard


    Install the package squidgrd from the series n. Edit a minimal configuration file
    /etc/squidguard.conf. There are plenty of configuration examples in http://www.squidguard.org/config/.
    Experiment later with more complicated configuration settings.


    The following step is to create a dummy “access denied” page or a more or less
    intelligent CGI page to redirect Squid if the client requests a blacklisted web
    site. Using Apache is strongly recommended.


    Now, tell Squid to use SquidGuard. Use the following entry in the /etc/squid.conf
    file:'
  merge: -1
  img_proc: true
