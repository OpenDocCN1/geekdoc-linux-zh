- pgno: 131
  md: "# Configuring the Boot Mechanism with loadlin\n\nloadlin will be introduced\
    \ in the following sections as another method of booting SuSE Linux. loadlin is\
    \ a DOS application capable of booting a Linux kernel stored in a DOS directory.\
    \ loadlin can be seamlessly integrated into an already existing DOS/Windows 9x\
    \ environment and easily started with the help of Windows boot manager. As there\
    \ is no entry in the MBR, Windows will not know that Linux is installed, but only\
    \ “see” one or more partitions possessing IDs Windows does not recognize. Undesired\
    \ side effects that could result from Linux coexisting on your Windows system\
    \ are minimized that way.\n\nThe procedure described here works for Windows 95\
    \ and Windows 98. The configuration files shown below were developed for Windows\
    \ 95. Therefore, the following only directly refers to Windows 95.\n\nYou will\
    \ have to make some preparations before you can use loadlin to boot Linux. Depending\
    \ on your system environment, you will also have to modify certain boot files.\n\
    \nloadlin can be activated in two ways: by selecting from several configurations\
    \ in the boot menu or by starting loadlin from a running system state switching\
    \ to Linux. Both methods have their advantages and disadvantages:\n\n+   - Using\
    \ the boot menu, avoid starting Linux from within another operating system.\n\
    +   - You can integrate other configurations into a boot menu.\n+   - However,\
    \ you must modify the boot files to set up a boot menu. You might have to try\
    \ out different options. Some helpful tips can be obtained in the DOS help files\
    \ after typing `help menu`.\n+   - Switching to Linux at the DOS prompt is quite\
    \ simple.\n+   - The Linux boot can be nicely built into the graphical user interface\
    \ of Windows 95. Switch to Linux by double-clicking an icon. You can also set\
    \ up a boot menu in Windows 95 (Windows 95 runs on DOS 7.0).\n\n> **Tip**\n> \n\
    > If possible, use a boot menu if you want to boot Linux as soon as you switch\
    \ on the computer. The DOS prompt or the double-click method can additionally\
    \ be used to switch to Linux from DOS/Windows 95. Only a summary of using Windows\
    \ boot menus is included here."
  merge: -1
  img_proc: true
- pgno: 132
  md: "# Required Files for loadlin\n\nThe following is obligatory (in DOS, Windows\
    \ 3.x, and Windows 95):\n\n+   1. If loadlin is not already installed, install\
    \ it from CD 1 by entering the command `setup`.\n+   \n+   2. Switch to the `c:\\\
    loadlin` directory (in MS-DOS). You will find a file `linux.par` there. In this\
    \ directory, create a file with the name `startlin.bat` in an editor (use another\
    \ name if desired). Write this line in the file:\n\n```\nc:\\loadlin\\loadlin\
    \ @c:\\loadlin\\linux.par\n```\n\nNow edit the following lines in the `linux.par`\
    \ file:\n\n```\nc:\\loadlin\\zimage   # first value must be\n                \
    \       # the file name of the Linux kernel\ninitrd=c:\\loadlin\\initrd\nroot=/dev/xxx\
    \       # the device that gets mounted as root FS\nro                  # mount\
    \ root read-only\n```\n\nReplace xxx with the device name of your root partition.\
    \ The initrd entry is only required if, for example, you need to boot SCSI support\
    \ as well (for more on the \"initial ramdisk\" concept, see Section Describing\
    \ the Problem on page 276). Start Linux at the DOS prompt at any time using the\
    \ `startlin.bat` file. The file `linux.par`, used by `startlin.bat` and by `config.sys`,\
    \ contains all the parameters necessary for booting Linux. When you are more familiar\
    \ with Linux, you can add or substitute other boot parameters in `linux.par`.\
    \ If you compile your own kernel later, copy it from the Linux file system to\
    \ the `c:\\loadlin\\zimage` file and, from that point on, your new kernel will\
    \ boot. If necessary, also store a newly-generated `initrd` in that file.\n\n\
    # Setting Up Boot Menus\n\nConfigure a boot menu in DOS or Windows 3.x as follows:\n\
    \n+   1. First, set up a boot menu in the `c:\\config.sys` file. Edit it according\
    \ to the sample file in File 9."
  merge: -1
  img_proc: true
