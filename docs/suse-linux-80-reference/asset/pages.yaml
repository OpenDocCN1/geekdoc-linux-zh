- pgno: 26
  md: '# Manual Partitioning


    With the “Partitioner”, the partitions of your hard disk can be manually modified.
    Partitions may be added, removed, or changed. When started, you will see a list
    of disks and the partitions on them. Disks are listed as whole devices (e.g.,
    `/dev/hda`) while partitions are listed as parts of the devices (e.g., `/dev/hda1`).
    The size, the type, and the mount point are also important parameters. The mount
    point describes where the partition is connected in the Linux file system tree.


    # Creating a Partition


    To create a new partition:


    +   - Select the disk on which to create a partition from the list.

    +   - Select ‘Create’. A dialog appears asking for the type of partition. You
    can create up to four primary partitions or up to three primary partitions and
    one extended partition. Within the extended partition, you can create several
    more partitions.

    +   - Select the format and, if required, the mount point of the new partition.
    Details of this can be found in the following section *Adding a Partition* on
    the current page.

    +   - Select ‘OK’ to apply your changes.


    The new partition will be listed in the partition table. Selecting ‘Next’ writes
    the partition table to disk and does the formatting, if necessary.


    # Adding a Partition


    To add a partition to the file system tree, perform the following:


    +   - Select the partition

    +   - ‘Edit’ the partition and set the parameters:

    +     - File system ID (if you do not want to format the partition): This can
    be “Linux swap”, “Linux”, “Linux LVM”, or “Linux RAID”.'
  merge: -1
  img_proc: true
- pgno: 27
  md: '+   - **File system (if you want to format the partition):** This can be “Swap”,
    “Ext2”, “ReiserFS”, or “JFS”. “Swap” is a special format that makes the partition
    usable as virtual memory. Every system should have at least one swap partition
    of at least 128 MB. By default, “ReiserFS” is used for partitions. Like “JFS”,
    it is a “Journaling File System”. A journaling file system enables a quick recovery
    from a system crash or a bad unmount. Also ReiserFS is very fast in handling lots
    of small files. “Ext2” is not a journaling file system. It is “rock solid” and
    good for smaller partitions, as it does not require too much disk space for the
    management.


    +   - **Mount Point:** Set the directory where the new partition should be connected
    in the file system tree. If you select the last entry in the list, enter your
    own directory name here. “Swap” is used for the special file system “Swap”.


    +   - Select “Next” to format and enable the partition.


    # ### More Partitioning Tips


    If the partitioning is performed by YaST2 and other partitions are detected on
    the system, these partitions will also be entered in `/etc/fstab` to enable easy
    access to this data. You can see a sample in File 1.


    ```

    ```text

    /dev/sda1        /data1  auto    noauto,user 0 0

    /dev/sda8        /data2  auto    noauto,user 0 0

    ```

    ```


    _File 1: /etc/fstab: Data Partitions_


    The partitions, regardless of whether they are Linux or FAT partitions, are specified
    with the options noauto and user. This allows any user to mount or unmount these
    partitions if needed. For security reasons, YaST2 does not automatically enter
    the exec option here. However, to run programs from there, you can enter this
    option yourself. This procedure can wait until encounter system messages such
    as “bad interpreter” or “Permission denied”.


    # ## Scope of Installation


    Specify which software to install on your computer (Figure 2.10 on the next page).
    ‘Default System with Office’ is preselected. SuSE Linux provides the following
    base systems (Figure 2.10 on the facing page):


    +   - **Minimum system**'
  merge: -1
  img_proc: true
- pgno: 28
  md: "![](img/a4b6c994843f3fbd688003f4cabfa48f_28_0.png)\n\n*Figure 2.10: Selecting\
    \ Installation Size*\n\nBy selecting ‘Minimum system’, install a fully functional\
    \ Linux operating system geared towards a text-based mode. It is recommended if\
    \ you have limited space available on your hard disk.\n\n+   - **Minimum graphical\
    \ system without KDE**  \n+     The minimum system supplemented with the X Window\
