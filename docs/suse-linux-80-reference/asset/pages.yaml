  md: "+   1. You should use the nlp printer spooler (package `plp` from series n)\
    \ instead of the BSD spooler. If you still want to use the BSD spooler, proceed\
    \ as described further below.\n\n+   2. Check your `/etc/printcap` file. In addition\
    \ to the usual entries, there need to be some entries specifying parameters for\
    \ the serial port.\n\n```\n```\n:br#9600:\\\n:ty=ixon -imaxbel -ixany -ixoff -crtscts:\\\
    \n```\n```\n\nWith br, the baud rate of the serial port is specified. ty stands\
    \ for the stty options. You may need to adjust both values, depending on the hardware\
    \ you have. Similarly, you might need to set the correct speed value to match\
    \ your specific setup — normally one of these values: 2400, 4800, 9600, 19200,\
    \ 38400, 57600, 115200, and 230400.\n\nWith a HP DeskJet 500, for example, the\
    \ following stty settings should do the trick:\n\n```\n```\n:ixon ixoff imaxbel\
    \ opost\n```\n```\n\nThe man page for stty explains many of the available options.\n\
    \n+   3. If you use the BSD spooler: While this printer spooler does read the\
    \ br entry in `/etc/printcap`, it does not know about the ty option. However,\
    \ serial port parameters can also be configured using the commands `setserial`\
    \ and `stty`.\n\nTo set the parameters to the same values as defined via `/etc/printcap`\
    \ in the example above, use the following command:\n\n```\n```shell\nearth: #\
    \ stty 9600 ixon -imaxbel -ixany -ixoff \\\n    -crtscts </dev/ttyS(x)\n```\n\
    ```\n\nTo achieve the desired result, use a sensible value for ttyS(x) — this\
    \ should be ttyS0 or ttyS1 in most cases.\n\nInserting the required setserial\
    \ and stty commands into the file `/etc/init.d/boot.local` will ensure that they\
    \ are run automatically on boot. In addition to that, edit `/etc/printcap`, removing\
    \ any lines which look like this:\n\n```\n```\n:br#9600:\\\n:ty=ixon -imaxbel\
