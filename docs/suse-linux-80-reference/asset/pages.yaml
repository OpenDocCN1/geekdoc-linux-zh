    # Using Custom PostScript Preloads


    PostScript preloads are small PostScript files containing special PostScript commands.
    They can be upstreamed before the actual print data to initialize a PostScript
    printer or Ghostscript.


    Typically, PostScript preloads are used to activate duplex printing or special
    paper trays in PostScript printers or to set Ghostscript margin settings and gamma
    correction accordingly.


    First, the PostScript printer or Ghostscript must be able to process the special
    PostScript commands listed below properly (Ghostscript does not react to duplex
    print or paper tray commands).


    Suppose the queue in question is called test.


    **Duplex printing** — To enable or disable duplex printing, create the files `/etc/lpd/filter/test/duplexon.ps`
    and `/etc/lpd/filter/test/duplexoff.ps` as follows:


    ```

    ```postscript

    %!PS

    statusdict /setduplexmode known

    statusdict begin true setduplexmode end if pop

    ```

    ```


    # File 20: `/etc/lpd/filter/test/duplexon.ps`: Enable Duplex Printing


    ```

    ```postscript

    %!PS

    statusdict /setduplexmode known

    statusdict begin false setduplexmode end if pop

    ```

    ```


    # File 21: `/etc/lpd/filter/test/duplexoff.ps`: Disable Duplex Printing'
  merge: -1
  img_proc: true
