    # Diagnosing Errors: LILO Start Messages


    Following is a recap of the information found in a section of [Alm94], in the
    description of LILO by Werner Almesberger.


    When LILO is launched, it displays the word `LILO`. Each letter is printed before
    or after performing some specific action. If LILO fails at some point, the letters
    printed so far can be used to identify the problem.


    **nothing**  No part of LILO has been loaded. Either LILO is not installed at
    all or the partition on which its boot sector is located is not active.


    `L` error ... The first stage boot loader has been loaded and started, but it
    cannot load the second stage boot loader (`/boot/boot.b`). The two-digit error
    codes indicate the type of problem. This condition usually indicates a media failure
    or a geometry mismatch.


    `LI`  The second stage has been invoked, but could not be started. This can either
    be caused by a geometry mismatch or by moving `/boot/boot.b` without reinstalling
    LILO.


    `LIL`  The second stage of the boot loader has been started, but it cannot load
    the descriptor table from the map file. This is typically due to a physical error
    of the boot device or a faulty disk geometry.


    `LIL?`  The second stage boot loader has been loaded at an incorrect address.
    This is typically caused by a subtle geometry mismatch or by moving `/boot/boot.b`
    without reinstalling LILO.'
  merge: -1
  img_proc: true
