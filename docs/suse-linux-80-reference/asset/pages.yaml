    the rest of the Internet, unless you apply certain tricks, because these addresses
    cannot be transmitted over the Internet.


    These address domains are specified in RFC 1597 and listed in Table 13.5.


    | Network, Netmask | Domain |

    |---|---|

    | 10.0.0.0, 255.0.0.0 | 10.x.x.x |

    | 172.16.0.0, 255.240.0.0 | 172.16.x.x – 172.31.x.x |

