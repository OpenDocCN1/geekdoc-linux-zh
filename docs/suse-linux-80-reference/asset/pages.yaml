    operation, which makes the device operate very slowly, but sometimes might help
    as a last resort |


    The driver supports up to six IDE interfaces and, according to the ATA 2 specification,
    two devices can be connected to each of these.


    To tell the kernel you have an ATAPI CD-ROM drive connected as master to the 2nd
    IDE controller, pass the parameter `hdc=cdrom`. Also see `/usr/src/linux/Documentation/ide.txt`.


