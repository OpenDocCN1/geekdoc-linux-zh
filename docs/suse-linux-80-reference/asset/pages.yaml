  md: '![](img/a4b6c994843f3fbd688003f4cabfa48f_146_0.png)


    *Figure 7.4: Mouse Configuration*


    # Configuring the Mouse


    If no configuration exists, SaX2 starts with this dialog page. Otherwise, it proceeds
    to the mouse configuration right after the dialog page about loading an existing
    configuration.


    If your mouse is working, you will not have to do anything else here. The configuration
    of special input devices, such as setting up graphics tablets or touch screens,
    also takes place in this screen, but is addressed in Section *Further Configurations*
    on page 141. If the mouse does not function, control the cursor using the number
    pad on the keyboard as described in Section *Controlling the Mouse with the Keyboard*
    on page 132. If you are familiar with the protocol and mouse connection, the procedure
    as described in Chapter *FAQ and Troubleshooting* on page 150 should be applied.


    # Keyboard Configuration


    First, check the language settings. If the language is not set correctly, modify
    the item accordingly then click ‘Apply’. Now, switch to the ‘Velocity’ tab and
    enter some characters in the test field located there. If not all the characters
    are displayed correctly, go to the ‘General’ tab and change the keyboard type.
    Then, click ‘Apply’ again so the changes take effect.'
