- pgno: 32
  md: '# # LILO — Installation


    To start SuSE Linux or any other operating system on your computer, you need a
    program to help you determine whether you want to use SuSE Linux or another operating
    system when starting (or booting) the machine. One such program is the boot manager
    LILO, the “Linux Loader”.\nBy default, YaST2 suggests installing the boot loader
    to the Master Boot Record (MBR) of the hard disk. If you have more than one hard
    disk, it will know which is used to boot by reading the BIOS settings. This is
    shown in the “suggestion screen” under “System boot”.\nYaST2 recognizes if you
    are operating systems other than SuSE Linux. Depending on the hardware, there
    are various ways to install LILO. The following provides you with an introduction
    to the LILO boot manager. A detailed description can be found in Chapter Booting
    and Boot Managers. When you select your LILO configuration by clicking ‘System
    boot’, the following dialog appears as shown in Figure 2.14.


    ![](img/a4b6c994843f3fbd688003f4cabfa48f_32_0.png)


    *Figure 2.14: LILO — Installation*


    Decide in this dialog how and where to install LILO. There are four options for
    this.


    +   1. To `/dev/hda` (in the MBR of your hard disk)\n2. Create boot floppy\n3.
    Do not install LILO (other boot manager)\n4. To another partition'
  merge: -1
  img_proc: true
- pgno: 33
  md: 'In most cases, select Option 1, which installs LILO in the Master Boot Record
    (MBR) of your boot disk. Use this option if SuSE Linux is your only operating
    system or you want to use LILO as the boot manager for multiple operating systems.
    However, be sure your operating system can be booted by LILO (usually, MS-DOS
    and Windows 9x/ME, NT, and 2000 accept LILO).


    If you are using multiple operating systems and are unsure whether they can be
    booted by LILO or want to leave your previous boot mechanism intact, choose the
    option ‘Create boot floppy’. Then insert this disk whenever you want to boot Linux.
    If this floppy is not in the drive, the current boot configuration is used. Later,
    you can always configure LILO as the boot loader in YaST2, so LILO allows you
    to choose the operating system to boot at the boot prompt.


    If you already installed a boot manager and want to integrate SuSE Linux in this
    boot manager, select ‘Do not install LILO’. After you install SuSE Linux, reconfigure
    the existing boot manager and integrate SuSE Linux in the boot procedure.


    If your system requires additional kernel parameters each time you restart the
    system, enter these parameters in the designated field. Usually, you do not need
    to enter anything here.


    The ‘Linear Option’ enables LILO to work with older hardware if the normal settings
    do not function. Most users will not need this option.


    The option ‘Activate LILO Partition’ is also not normally needed. There are only
    some systems where the BIOS can only boot from “activated” partitions.


    # ## Starting Installation


    A click on ‘Next’ accepts the suggestions and any changes you made. You will then
    be taken to the green confirmation screen. After clicking ‘Yes’ here, the installation
    of all your selected settings begins. The installation usually lasts between fifteen
    and thirty minutes, depending on your machine’s performance and your software
    selection. While it is installing, you will see information about SuSE Linux.
    Click ‘Details’ to view information about the progress of your installation instead.


    # ## System Configuration


    After the installation of your system and selected software is complete, you need
    to make three more important settings before you can work with SuSE Linux. Define
    a password for the system administrator, create a normal user, and configure your
    monitor.'
  merge: -1
  img_proc: true
- pgno: 34
  md: "# Root Password\n\nroot is the name of the superuser, the system administrator.\
    \ root is permitted to do all the things normal users are not permitted to do.\
    \ The superuser can make changes to the system, such as installing new applications\
    \ or setting up a new hardware. If users forget their passwords or have problems\
    \ with software, root can help them. As a general rule, only log in as root to\
    \ carry out administrative tasks, such as system maintenance or repairs. root\
    \ is quite risky for everyday use, as root can delete files that cannot be subsequently\
    \ recovered. For verification purposes, the password must be entered twice (Figure\
    \ 2.15). Be particularly careful not to forget the root password. It cannot be\
    \ retrieved later.\n\n> **Caution**\n> \n> The user root has all the permissions\
    \ needed to make changes to the system. To carry out such tasks, the root password\
    \ is required. You cannot carry out any administrative tasks without this password.\n\
    > \n> **Caution**\n\n![](img/a4b6c994843f3fbd688003f4cabfa48f_34_0.png)"
  merge: -1
  img_proc: true
- pgno: 35
  md: '# User Name and Password


    Linux is an operating system that allows several users to work on the same system
    at the same time. For it to function smoothly, each user needs a user account,
    which allows them to log in to the system then to log out again when finished.
    Setting up user accounts provides a strong basis for operating security. Normal
    users cannot change or delete files needed for the system to work properly. Similarly,
    a user’s personal data may not be accessed, modified, or deleted by other users.
    Every user can set up his or her own working environment with preferred applications
    and settings. When users log in to the Linux system, they find their personal
    environments unchanged.


    Create such a user account yourself using the dialog shown in Figure 2.16. Enter
    the user’s first name and last name. Also specify the user name (login name).
    If you cannot think of a suitable user name, click ‘Suggestion’ and the system
    will automatically generate a user name for you.


    ![](img/a4b6c994843f3fbd688003f4cabfa48f_35_0.png)


    *Figure 2.16: Entering User Name and Password*


    Finally, enter a password for the user, which you must repeat to confirm. The
    user name tells the system who you are and the password verifies your identity.'
  merge: -1
  img_proc: true
- pgno: 36
  md: "> **Caution**\n> \n> Memorize your user name and password, as you will need\
    \ this information every time you log in.\n> \n> A password should be between\
    \ five and eight characters long. It could be as long as 128 characters, but only\
    \ the first eight characters are shown. Linux distinguishes between lowercase\
    \ and uppercase letters in the password. Accented characters are not allowed.\
    \ Special characters (e.g., `*`, `,`, `#`, `;`) may be used, however, along with\
    \ the digits `0–9`.\n\n# PAM: Pluggable Authentication Modules\n\nThe configuration\
    \ files for PAM (Pluggable Authentication Modules) are located in `/etc/pam.d`.\
    \ Documentation for programmers and system administrators is available in `/usr/share/doc/packages/pam`.\n\
    \nSuSE Linux can handle MD5 passwords. MD5 encryption passwords can be longer\
    \ than eight characters. MD5 encryption is not compatible with crypt(), the standard\
    \ function in Unix. Therefore, some commercial Unix systems and some applications\
    \ will not work with MD5 passwords.\n\nFind information about the configuration\
    \ in `/usr/share/doc/packages/pam/md5.config`.\n\n# Monitor Settings\n\nThis shows\
    \ graphics card and screen with reasonable settings. In most cases, you can accept\
    \ the suggestion. However, you can customize color depth, resolution, and the\
    \ image repetition rate manually.\n\nThe settings will be tested once you have\
    \ accepted the suggestion or entered your changes. In the following dialog screen\
    \ (Figure 2.17 on the following page), define whether, in the future, SuSE Linux\
    \ should be operated in ‘Text mode only’ or in a ‘Graphical desktop environment’.\n\
    \nWhen you click ‘Change’, you have the option of configuring the graphical interface\
    \ (Figure 2.18 on page 27). Set the screen resolution and color depth for the\
    \ graphical mode. You can even define the image repetition rate. If you have a\
    \ graphics card with a 3D chip, you can select the option ‘3D acceleration’.\n\
    \nBy clicking ‘Test’, test the configuration selected. The installation program\
    \ issues a message telling you that the screen will now switch to the new configuration.\
    \ If you do not see a steady screen, stop the test immediately by pressing `Esc`."
  merge: -1
