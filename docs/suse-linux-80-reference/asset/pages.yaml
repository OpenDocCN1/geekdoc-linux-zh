    # 12. What if the mouse is not working?


    The mouse is identified by the port to which it is connected and by the protocol
    that defines the data format. If SaX2 is not able to recognize the mouse, the
    mouse can be navigated using the emulation on the key pad. Otherwise, run SaX2
    and specify the correct data as to the mouse’s connection and its protocol. The
    command for forwarding this data to SaX2 while launching it is `sax2 -t <protocol>
    -n <connection>`. Table 7.3 shows the various mouse protocols.


    A more exact description of supported mice can be found in the file `/usr/X11R6/lib/X11/doc/README.mouse`.


    # 13. Using the mouse in X with the GPM


    The GPM has the capability of functioning as a “repeater”. In this case, GPM makes
    the mouse’s data available over the `/dev/gpmdata` device. Enable the repeater
    option by adding the option `-R` following the GPM parameters in the `GPM_PARAM`
    variable in the `/etc/sysconfig/mouse` file. By way of the command `rcgpm restart`,
    the GPM now only runs as a repeater. To also use the mouse in X over the GPM,
    start SaX2 using the following command:


    ```

    sax2 -g

    ```'
  merge: -1
  img_proc: true
- pgno: 162
  md: "# 14. Moving the windows leaves behind hash marks, parts of windows, or other\
    \ fragments. They do not disappear after I have stopped moving them. I can only\
    \ get rid of them by refreshing the desktop. What do I do?\n\n+   (a) Reduce the\
    \ image repetition rate or resolution.\n+   \n+   (b) Depending on your chipset,\
    \ apply the relevant options from the README files in `/usr/X11R6/lib/X11/doc/`,\
    \ such as the options `fifo_conservative` or `slow_dram`. This depends on the\
    \ graphics chipset.\n+   \n+   (c) Options `noaccel`, `no_imageblt`, or `no_bitblt`\
    \ may be sufficient.\n\n# 15. “Noise” — image distortions when moving windows\
    \ or viewing videos — that disappears when the contents of the image are static.\n\
    \n+   (a) Reduce image repetition rate, color depth, or resolution.\n+   \n+ \
    \  (b) Lower the card’s clock speed or remove or add a wait state. Sometimes this\
    \ works with `set_mclk` (but not for all chipsets). Find out more in the README\
    \ directory. *Caution:* this option is risky (the card can be put into overdrive).\n\
    +   \n+   (c) The bus may also be in overdrive. Check the bus speed of the PCI/VLB\
    \ or ISA bus.\n\n# 16. The screen goes blank when XFree86 is started.\n\n+   (a)\
    \ Reduce the repetition rate.\n+   \n+   (b) Check the BIOS settings of the computer.\
    \ Deactivate any “optimization settings” of the BIOS. You may need to consult\
    \ the manual for your motherboard. Common problem factors are the Video memory\
    \ cache mode options, AGP Aperture size, and any options that control PCI bus\
    \ access, such as PCI Peer concurrency. You will almost always find these settings\
    \ in a menu labeled Advanced Chipset Features.\n+   \n+   (c) Consider other possible\
    \ causes: Check system for IRQ conflicts (such as a PS/2 mouse requires IRQ 12).\n\
    \n# 17. Configuration with xf86config\n\nIf your X11 system can not be configured\
    \ with SaX2, a very simple text-based tool called `xf86config4` can be used for\
    \ this purpose. It is started as user root by giving the command `xf86config4`"
  merge: -1
  img_proc: true
- pgno: 163
  md: '# Configuration Using xf86config


    In most cases, XF86Setup is superior to xf86config as a simple configuration tool.
    There are, nevertheless, some rare cases where XF86Setup fails. If so, just use
    xf86config, which almost always works.


    XFree86-4.0 includes a similar text-based program, xf86config. At some points,
    this contains dialogs that have been somewhat modified and, of course, it writes
    the configuration file to /etc/X11/XF86Config. In XFree86-4.0 however, the use
    of xf86config is usually not needed, since “problem” graphics cards can also be
    configured with the framebuffer or with the vga module as described in Section
    FAQ and Troubleshooting on page 147.


    Make sure you have the following information available:


    +   - mouse type, port to which the mouse is connected, and baud rate (the baud
    rate is normally optional)

    +   - specifications of the graphics card

    +   - monitor data (frequencies, etc.)


    If these settings are known or you have your manuals at hand, start the configuration.
    Remember that you have to be root to do this.

    The configuration is started with:


    ```

    earth:/root # /usr/X11R6/bin/xf86config

    ```


    # Mouse


    Following the welcome screen, you will be asked about your mouse type. You will
    be presented with the following selections:


    +   1. Microsoft compatible (2-button protocol)

    +   2. Mouse Systems (3-button protocol)

    +   3. Bus Mouse

    +   4. PS/2 Mouse

    +   5. Logitech Mouse (serial, old type, Logitech protocol)

    +   6. Logitech MouseMan (Microsoft compatible)

    +   7. MM Series

    +   8. MM HitTablet


    *Output 5: Mouse Selection for X*


    While selecting the mouse, bear in mind that many of the new Logitech mice are
    either Microsoft compatible or use the MouseMan protocol. The selection Bus Mouse
    refers to any bus mouse, including Logitech.'
  merge: -1
  img_proc: true
