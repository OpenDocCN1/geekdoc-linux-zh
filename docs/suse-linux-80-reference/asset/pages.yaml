- pgno: 424
  md: '# SSH — Secure Shell, the Safe Alternative


    In these times of increasing networks, accessing a remote system also becomes
    more common. Regardless of the activity, the person accessing the system must
    be authenticated.


    Most users should know by now that the user name and password are only intended
    for individual use. Strict confidence pertaining to personal data is usually guaranteed
    between the employer, computer center, or service provider. However, the ongoing
    practice of authenticating and transferring data in clear text form is a frightening
    phenomenon. Most directly affected are the commonly used services Post Office
    Protocol (POP) for retrieving mail and telnet for logging in on remote systems.
    Using these methods, user information and data considered sensitive, such as the
    contents of a letter or a chat via the talk command, travel openly and unsecured
    over the network. This encroaches on the user’s privacy and leaves such access
    methods open to misuse. Usually, this misuse occurs by accessing one system to
    attack another or to obtain administrator or root permissions.


    Any device involved in data transfer or operating on the local network, such as
    firewall, router, switch, mail servers, or workstations, can also access the data.
    There are laws prohibiting such behavior, but it is difficult to detect.


    The SSH software provides the necessary protection. Complete authentication, usually
    user name and password, as well as the communication is encrypted. Even here,
    snatching the transferred data is possible, but the contents cannot be deciphered
    by intruders without the key. This enables secure communication via unsafe networks,
    such as the Internet. In SuSE Linux, the package OpenSSH is available in the sec
    series.'
  merge: -1
  img_proc: true
- pgno: 425
  md: '# The OpenSSH Package


    After installation of the OpenSSH package, the following programs will be available:
    ssh, scp, and sftp, as alternatives to telnet, rlogin, rsh, rcp, and ftp.


    # The ssh Program


    Using the ssh program, it is possible to log in to remote systems and work interactively.
    It replaces both telnet and rlogin. The symbolic name login points to ssh. For
    example, log in to the host sun by entering `ssh sun`. You are then prompted for
    your password on the sun system.


    Following successful authentication, work from the command line there or use interactive
    applications. If the local user name is different from the remote user name, log
    in using a different login name with `ssh -l augustine sun` or `ssh augustine@sun`.


    Furthermore, ssh offers the option of running commands on another system, as does
    rsh. In the following example, we will run the command uptime on the host sun
    and create a directory with the name tmp. The program output will be displayed
    on the local terminal of the host earth.


    ```

    hannah@earth:~> ssh sun ''uptime; mkdir tmp'' hannah@sun password:

    1:21am up 2:17, 9 users, load average: 0.15, 0.04, 0.02

    ```


    Apostrophes are necessary here to send both instructions with one command.


    # scp — Secure Copy


    scp copies files to a remote machine. It is the secure and encoded substitute
    for rcp. For example, `scp MyLetter.tex sun:` copies the file MyLetter.tex from
    the machine earth to the machine sun. To give a different user name, use the username@machine
    format.


    After the correct password is entered, scp starts the data transfer and shows
    a series of stars, gradually marking the progress from left to right. In addition,
    the estimated time of arrival will be shown in the right margin. All output can
    be suppressed by giving the option `-q`.


    scp also provides a recursive copying feature for entire directories.


    ```

    scp -r src/ sun:backup/

    ```


    copies the entire contents of the directory src/ including all subdirectories
    to the machine sun in the subdirectory backup/. If this subdirectory does not
    exist yet, it will be created automatically.


    Via the option `-p`, scp leaves the time stamp of the files unchanged. `-C` compresses
    the data transfer. This minimizes the data volume to be transferred, but creates
    heavier burden on the processor.'
  merge: -1
  img_proc: true
- pgno: 426
  md: '# sftp — Secure File Transfer


    Instead of scp, sftp can be used for secure file transfer. During the session,
    sftp provides many of the commands used by ftp. This may be an advantage over
    scp, especially when transferring data for which the file names are unknown.


    # The SSH Daemon (sshd) — Server-Side


    To work with the SSH client programs ssh and scp, a server, the SSH daemon, has
    to be running in the background. This waits for its connections on TCP/IP port
    22.


    The daemon generates two key pairs when starting for the first time. The key pairs
    consist of a private and a public key. Therefore, this procedure is referred to
    as public key–based. To guarantee the security of the communication via SSH, only
    the system administrator can see the private key files. The file permissions are
    restrictively defined by the default setting. The private keys are only required
    locally by the SSH daemon and must not be given to anyone else. The public key
    components (recognizable by the name extension .pub) are sent to the communication
    partner and are readable for all users.


    A connection is initiated by the SSH client. The waiting SSH daemon and the requesting
    SSH client exchange identification data comparing the protocol and software versions
    and preventing connection to the wrong port. Since a child process of the original
    SSH daemon replies to the request, several SSH connections can be made simultaneously.


    The server will then send its public host key and a server key, regenerated by
    the SSH daemon every hour. Both allow the SSH client to encrypt a freely chosen
    session key then send it to the SSH server. The SSH client also tells the server
    which encryption method (cipher) to use.


    The private host and server keys are absolutely necessary for decoding the session
    key and cannot be derived from the public parts. Only the SSH daemon contacted
    can decipher the session key using its proprietary keys (see also /usr/share/doc/packages/openssh/RFC.nroff).
    This initial connection phase can be watched closely using the SSH client program’s
    error search option -v. It will end with the confirmation output of the SSH daemon,
    “Received encrypted confirmation.” By storing all public host keys after initial
    contact in ~/.ssh/known_hosts on the client side, so-called “man-in-the-middle”
    access attempts can be prevented. SSH servers that try to fraudulently use names
    and IP addresses of others will be exposed by a clear indicator. They will either
    be noticed due to a wrong host key which differs from ~/.ssh/known_hosts or they
    cannot decipher the session key in the absence of an appropriate private counterpart.'
  merge: -1
  img_proc: true
- pgno: 427
  md: 'It is recommended to securely archive the private and public keys stored in
    `/etc/ssh/` externally. In this way, key modifications can be detected and the
    old ones can be used again after a new installation. This spares users the unsettling
    warning. If it is verified that, despite the warning, it is indeed the correct
    SSH server, the existing entry regarding this system will have to be removed from
    `~/.ssh/known_hosts`.


    # SSH Authentication Mechanisms


    Now the actual authentication will take place, which, in its simplest form, consists
    of entering a password as mentioned above. The goal of SSH was to introduce a
    secure software that is also easy to use. As it is meant to replace rsh and rlogin
    programs, SSH must also be able to provide an authentication method good for daily
    use. SSH accomplishes this by way of another key pair generated by the user. The
    SSH package also provides a help program, ssh-keygen, for this. After entering
    ssh-keygen, the key pair will be generated and you will be prompted for the base
    file name in which to store the keys:


    ```

    Enter file in which to save the key (/home/hannah/.ssh/identity):

    ```


    Confirm the default setting and answer the request for a passphrase. Even if the
    software suggests an empty passphrase, a text from ten to thirty characters is
    recommended for the procedure described here. Do not use short and simple words
    or phrases. Confirm by repeating the passphrase. Subsequently, you will see where
    the private and public keys are stored, in our example, the files `identity` and
    `identity.pub`.


    ```

    Enter same passphrase again:  Your identification has been saved

    in /home/hannah/.ssh/identity.  Your public key has been saved

    in /home/hannah/.ssh/identity.pub.  The key fingerprint is:

    79:c1:79:b2:e1:c8:20:c1:89:0f:99:94:a8:4e:da:e8 hannah@sun

    ```


    ```

    Use ssh-keygen -p to change your old passphrase.

    ```


    Copy the public key component (`identity.pub`) to the remote machine and save
    it there at the location `~/.ssh/authorized_keys`. You will be asked to authenticate
    yourself with your old passphrase the next time you establish a connection. If
    this does not occur, verify the location and contents of these files.


    In the long run, this procedure is more troublesome than giving your password
    each time. Therefore, the SSH package provides another tool, the ssh-agent, which
    retains the private keys for the duration of an X session. The entire X session
    will be started as a child process of ssh-agent. The easiest way to do this is
    to set the variable `usessh` at the beginning of the `.xsession` file to yes and
    log in via a display manager such as KDM or XDM. Alternatively, enter `ssh-agent
    startx`.'
  merge: -1
  img_proc: true
- pgno: 428
  md: 'As soon as the X session is started, enable your private key with `ssh-add`.
    If `ssh-add` cannot access a terminal, a graphical input screen appears: `x11-ssh-askpass`.
    Now you can use ssh or scp as usual. If you have distributed your private key
    as described above, you are no longer prompted for your password.


    # X, Authentication, and Other Forwarding Mechanisms


    Beyond the previously described security-related improvements, ssh also simplifies
    the use of remote X applications. If you run ssh with the option `-X`, the DISPLAY
    variable will automatically be set on the remote machine and all X output will
    be exported to the remote machine over the existing ssh connection. At the same
    time, X applications started remotely and locally viewed with this method cannot
    be intercepted by unauthorized persons.


    By adding the option `-A`, the ssh-agent authentication mechanism will be carried
    over to the next machine. This way, you can work from different machines without
    having to enter a password, but only if you have distributed your public key to
    the destination hosts and properly saved it there.


    Both mechanisms are deactivated in the default settings, but can be permanently
    activated at any time in the system-wide configuration file `/etc/ssh/ssh_config`
    or the user’s `~/.ssh/config`.


    ssh can also be used to redirect TCP/IP connections. In the following example,
    the SMTP and POP3 port is redirected through ssh:


    ```

    ssh -L 25:sun:25 sun

    ```


    Here, each connection directed to “earth port 25”, SMTP is redirected to the SMTP
    port on sun via an encrypted channel. This is especially useful for those using
    SMTP servers without SMTP-AUTH or POP-before-SMTP features. From any arbitrary
    location connected to a network, e-mail can be transferred to the “home” mail
    server for delivery. In a similar manner, the following command forwards all port
    110 and POP3 requests on earth to the POP3 port of sun:


    ```

    ssh -L 110:sun:110 sun

    ```


    Both examples must be carried out by user root, because the connection is made
    to privileged local ports. E-mail is sent and retrieved by normal users in an
    existing SSH connection. The SMTP and POP3 host must be set to `localhost` for
    this.


    Additional information can be found in the manual pages for each of the programs
    described above and also in the files under `/usr/share/doc/packages/openssh`.'
  merge: -1
  img_proc: true
- pgno: 429
  md: '# # Security and Confidentiality


    # ## Basic Considerations


    One of the main characteristics of a Linux or UNIX system is its ability to handle
    several users at the same time (multiuser) and to allow these users to perform
    several tasks (multitasking) on the same computer simultaneously. Moreover, the
    operating system is network transparent. The users often do not know whether the
    data and applications they are using are provided locally from their machine or
    made available over the network.


    With multiuser capability the respective data of different users must be stored
    separately. Security and privacy need to be guaranteed. “Data security” was already
    an important issue, even before computers could be linked through networks. Just
    like today, the most important concern was the ability to keep data available
    in spite of a lost or otherwise damaged data medium, a hard disk in most cases.


    This chapter is primarily focused on confidentiality issues and on ways to protect
    the privacy of users, but it cannot be stressed enough that a comprehensive security
    concept should always include procedures to have a regularly updated, workable,
    and tested backup in place. Without this, you could have a very hard time getting
    your data back — not only in the case of some hardware defect, but also if the
    suspicion arises that someone has gained unauthorized access and tampered with
    files.


    # ## Local Security and Network Security


    There are several ways of accessing data:


    +   - Personal communication with people who have the desired information or access
    to the data on a computer

    +   - directly from the console of a computer (physical access)

    +   - over a serial line

    +   - using a network link


    In all these cases, a user should be authenticated before accessing the resources
    or data in question. A web server might be less restrictive in this respect, but
    you still would not want it to disclose all your personal data to any surfer out
    there.'
  merge: -1
  img_proc: true
- pgno: 430
  md: 'In the list above, the first case is the one where the highest amount of human
    interaction is involved, such as when you are contacting a bank employee and are
    required to prove that you are the person owning that bank account. Then you will
    be asked to provide your signature, a PIN, or a password to prove that you are
    the person you claim to be. In some cases, it might be possible to elicit some
    intelligence from an informed person just by mentioning known bits and pieces
    here and there to win the confidence of that person by using clever rhetoric.
    The victim could be led to gradually reveal more information, maybe without even
    becoming aware of it. Among hackers, this is called “social engineering”. You
    can only guard against this by educating people and by dealing with language and
    information in a conscious way.


    Before bringing into computer systems, attackers often try to target receptionists,
    service people working with the company, or even family members. In many cases,
    such an attack based on social engineering will only be discovered at a much later
    time. A person wanting to obtain unauthorized access to your data could also use
    the traditional way and try to get at your hardware directly. Therefore, the machine
    should be protected against any tampering so that no one can remove, replace,
    or cripple its components. This also applies to backups and even any network cable
    or the power cord.


    Likewise, secure the boot procedure, as there are some well-known key combinations
    which invoke special reactions during booting. Protect yourself against this by
    setting passwords for the BIOS and the boot-loader.


    Serial terminals connected to serial ports are still used in many places. Unlike
    network interfaces, they do not rely on a network protocol to communicate with
    the host. A simple cable or an infrared port is used to send plain characters
    back and forth between the devices. The cable itself is the weakest point of such
    a system: with an older printer connected to it, it is easy to record anything
    that runs over the wires. What can be achieved with a printer can also be accomplished
    in other ways, depending on the effort that goes into the attack.


    Reading a file locally on a host requires other access rules than opening a network
    connection with a server on a different host. There is a distinction between local
    security and network security. The line is drawn where data has to be put into
    packets to be sent somewhere else.


    # Local Security


    Local security starts with the physical environment in the location where the
    computer is running. Set up your machine in a place where security is in line
    with your expectations and needs.'
  merge: -1
  img_proc: true
- pgno: 431
  md: 'The main goal of “local security” is to keep users separate from each other,
    so that no user can assume the permissions or the identity of another. This is
    a general rule to be observed, but it is especially true for the user root who
    holds the supreme power on the system. User root can take on the identity of any
    other local user without being prompted for the password and read any locally
    stored file.


    # Passwords


    On a Linux system, passwords are, of course, not stored as plain text and the
    text string entered is not simply matched with the saved pattern. If this were
    the case, all accounts on your system would be compromised as soon as someone
    got access to the corresponding file. Instead, the stored password is encrypted
    and, each time it is entered, is encrypted again and the two encrypted strings
    are compared. Naturally, this will only work if the encrypted password cannot
    be reverse-computed into the original text string. This is actually achieved by
    a special kind of algorithm, also called “trapdoor algorithm,” because it only
    works in one direction. An attacker who has obtained the encrypted string will
    not be able to get your password by simply applying the same algorithm again.
    Instead, it would be necessary to test all the possible character combinations
    until a combination is found which looks like your password when encrypted. As
    you can imagine, with passwords eight characters long, there are quite a number
    of possible combinations to calculate.


    In the seventies, it was argued that this method would be more secure than others
    due to the relative slowness of the algorithm used, which took a few seconds to
    encrypt just one password. In the meantime, however, PCs have become powerful
    enough to do several hundred thousand or even millions of encryptions per second.
    Because of this, encrypted passwords should not be visible to regular users (/etc/shadow
    cannot be read by normal users). It is even more important that passwords are
    not easy to guess, in case the password file becomes visible due to some error.
    Consequently, it is not really useful to “translate” a password like “kantalise”
    into “t@nt@l1s3”.


    Replacing some letters of a word with similar looking numbers is not safe enough.
    Password cracking programs which use dictionaries to guess words also play with
    substitutions like that. A better way is to make up a word with no common meaning,
    something which only makes sense to you personally, like the first letters of
    the words of a sentence or the title of a book, such as “The Name of the Rose”
    by Umberto Eco. This would give the following safe password: “TNotRbUE9”. By contrast,
    passwords like “beerbuddy” or “jasmine76” are easily guessed even by someone who
    has only some casual knowledge about you.'
  merge: -1
  img_proc: true
- pgno: 432
  md: '# The Boot Procedure


    Configure your system so it cannot be booted from a floppy or from CD, either
    by removing the drives entirely or by setting a BIOS password and configuring
    the BIOS to allow booting from a hard disk only. Normally, a Linux system will
    be started by a boot loader, allowing you to pass additional options to the booted
    kernel. This is crucial to your system’s security. Not only does the kernel itself
    run with root permissions, but it is also the first authority to grant root permissions
    at system start-up. Prevent others from using such parameters during boot by using
    the options "restricted" and "password=your_own_password" in /etc/lilo.conf. Execute
    the command lilo after making any changes to /etc/lilo.conf and look for any unusual
    output the command might produce. If you forget this password, you will have to
    know the BIOS password and boot from CD to read the entry in /etc/lilo.conf from
    a rescue system.


    # File Permissions


    As a general rule, always work with the most restrictive privileges possible for
    a given task. For example, it is definitely not necessary to be root to read or
    write e-mail. If the mail program has a bug, this bug could be exploited for an
    attack which will act with exactly the permissions of the program when it was
    started. By following the above rule, minimize the possible damage.


    The permissions of more than 200,000 files included in a SuSE distribution are
    carefully chosen. A system administrator who installs additional software or other
    files should take great care when doing so, especially when setting the permission
    bits. Experienced and security-conscious system administrators always use the
    -l option with the command ls to get an extensive file list, which allows them
    to detect any wrong file permissions immediately. An incorrect file attribute
    does not only mean that files could be changed or deleted. These modified files
    could be executed by root or, in the case of configuration files, that programs
    could use such files with the permissions of root. This significantly increases
    the possibilities of an attacker. Attacks like this are called cuckoo eggs, because
    the program (the egg) is executed (hatched) by a different user (bird), just like
    a cuckoo tricks other birds into hatching its eggs.'
  merge: -1
  img_proc: true
- pgno: 433
  md: 'A SuSE Linux system includes the files `permissions`, `permissions.easy`, `permissions.secure`,
    and `permissions.paranoid`, all in the directory `/etc`. The purpose of these
    files is to define special permissions, such as world-writable directories or
    for files, the setuser ID bits, which means the corresponding program will not
    run with the permissions of the user that has launched it, but with the permissions
    of the file owner, root in most cases. An administrator may use the file `/etc/permissions.local`
    to add his own settings. To define which of the above files is used by SuSE''s
    configuration programs to set permissions accordingly use the submenu `Security`
    in YaST2. To learn more about the topic, read the comments in `/etc/permissions`
    or consult the manual page of `chmod` (`man chmod`).


    # Buffer Overflows and Format String Bugs


    Special care must be taken whenever a program is supposed to process data that
    can or could be changed by a user, but this is more of an issue for the programmer
    of an application than for regular users. The programmer has to make sure that
    his application will interpret data in the correct way, without writing them into
    memory areas that are too small to hold them. Also, the program should hand over
    data in a consistent manner, using the interfaces defined for that purpose.


    A “buffer overflow” can happen if the actual size of a memory buffer is not taken
    into account when writing to that buffer. There are cases where this data (as
    generated by the user) uses up more space than what is available in the buffer.
    As a result, data is written beyond the end of that buffer area, which, under
    certain circumstances, makes it possible that a program will execute program sequences
    influenced by the user (and not by the programmer), rather than just processing
    user data. A bug of this kind may have serious consequences, in particular if
    the program is being executed with special privileges (see Section *File Permissions*
    on the preceding page).


    “Format string bugs” work in a slightly different way, but again it is the user
    input which could lead the program astray. In most cases, these programming errors
    are exploited with programs executed with special permissions — setuid and setgid
    programs — which also means that you can protect your data and your system from
    such bugs by removing the corresponding execution privileges from programs. Again,
    the best way is to apply a policy of using the lowest possible privileges (see
    Section *File Permissions* on the page before).'
  merge: -1
  img_proc: true
- pgno: 434
  md: 'Given that buffer overflows and format string bugs are bugs related to the
    handling of user data, they are not only exploitable if access has been given
    to a local account. Many of the bugs that have been reported can also be exploited
    over a network link. Accordingly, buffer overflows and format string bugs should
    be classified as being relevant for both local and network security.


    # Viruses


    Contrary to what some people will tell you, *there are viruses* that run on Linux.
    However, the viruses that are known were released by their authors as “proof of
    concept” to prove that the technique works as intended. None of these viruses
    have been spotted “in the wild” so far.


    Viruses would not be able to survive and spread without a host on which they could
    live. In our case, the host would be a program or an important storage area of
    the system, such as the master boot record, which needs to be writable for the
    program code of the virus. Owing to its multiuser capability, Linux can restrict
    write access to certain files, especially important with system files. Therefore,
    if you did your normal work with root permissions, you would increase the chance
    of the system being infected by a virus. By contrast, if you follow the principle
    of using the lowest possible privileges as mentioned above, chances of getting
    a virus are slim.


    Apart from that, you should never rush into executing a program from some Internet
    site that you do not really know. SuSE’s RPM packages carry a cryptographic signature
    as a digital label that the necessary care was taken to build them. Viruses are
    a typical sign that the administrator or the user lacks the required security
    awareness, putting at risk even a system that should be highly secure by its very
    design.


    Viruses should not be confused with worms which belong to the world of networks
    entirely. Worms do not need a host to spread.


    # Network Security


    Network security is important for protecting from an attack originating in the
    network. The typical login procedure requiring a user name and a password for
    user authentication is a local security issue. However, in the particular case
    of logging in over a network, we need to differentiate between both security aspects.
    What happens until the actual authentication is network security and anything
    that happens afterwards is local security.'
  merge: -1
  img_proc: true
- pgno: 435
  md: '# X Window System and X11 Authentication


    As mentioned at the beginning, network transparency is one of the central characteristics
    of a UNIX system. X11, the windowing system of UNIX operating systems, can make
    use of this feature in an impressive way. With X11, it is basically no problem
    to log in at a remote host and start a graphical program that will then be sent
    over the network to be displayed on your computer.


    For an X client to be displayed remotely using our X server, the latter is supposed
    to protect the resource managed by it (i.e. the display) from unauthorized access.
    In more concrete terms, certain permissions must be given to the client program.
    With the X Window System, there are two ways to do this, called host-based access
    control and cookie-based access control. The former relies on the IP address of
    the host where the client is supposed to run. The program to control this is xhost.
    xhost enters the IP address of a legitimate client into a tiny database stored
    at the X server. However, relying on IP addresses for authentication is not very
    secure. For example, if there were a second user working on the host sending the
    client program, that user would have access to the X server as well — just like
    someone stealing the IP address. Because of these shortcomings, we will not describe
    this authentication method in more detail here, but you can learn about it from
    man xhost.


    In the case of cookie-based access control, a character string is generated which
    is only known to the X server and to the legitimate user, just like an ID card
    of some kind. This cookie (the word goes back not to ordinary cookies, but to
    Chinese fortune cookies which contain an epigram) is stored on login in the file
    .Xauthority in the user’s home directory and is available to any X Window client
    wanting to use the X server to display a window. The file .Xauthority can be examined
    by the user with the tool xauth. If you were to rename .Xauthority or if you deleted
    the file from your home directory by accident, you would not be able to open any
    new windows or X clients. Read more about X Window security mechanisms in the
    man page of Xsecurity (man Xsecurity).


    ssh (secure shell) can be used to completely encrypt a network connection and
    forward it to an X server transparently without the encryption mechanism being
    perceived by the user. This is also called X forwarding. X forwarding is achieved
    by simulating an X server on the server side and setting a DISPLAY variable for
    the shell on the remote host. Further details about ssh can be found in Section
    *SSH — Secure the Shell, the Safe Alternative* on page 413.'
  merge: -1
  img_proc: true
- pgno: 436
  md: "> **Caution**\n> \n> If you do not consider the host where you log in to be\
    \ a secure host, do not use X forwarding. With X forwarding enabled, an attacker\
    \ could authenticate via your X server connection to intrude on your X server\
    \ and sniff your keyboard input, for instance.\n\n# Buffer Overflows and Format\
    \ String Bugs\n\nAs discussed on page 422, buffer overflows and format string\
    \ bugs should be classified as issues concerning both local and network security.\
    \ As with the local variants of such bugs, buffer overflows in network programs,\
    \ when successfully exploited, are mostly used to obtain root permissions. Even\
    \ if that is not the case, an attacker could use the bug to gain access to an\
    \ unprivileged local account to exploit any other vulnerabilities which might\
    \ exist on the system. Buffer overflows and format string bugs exploitable over\
    \ a network link are certainly the most frequent form of remote attacks in general.\
    \ Exploits for these programs to exploit these newly-found security holes are\
    \ often posted on the security mailing lists. They can be used to target the vulnerability\
    \ without knowing the details of the code. Over the years, experience has shown\
    \ that the availability of exploit codes has contributed to more secure operating\
    \ systems, obviously due to the fact that operating system makers were forced\
    \ to fix the problems in their software. With free software, anyone has access\
    \ to the source code (SuSE Linux comes with all available source codes) and anyone\
    \ who finds a vulnerability and its exploit code can submit a patch to fix the\
    \ corresponding bug.\n\n# DoS — Denial of Service\n\nThe purpose of this kind\
    \ of attack is to force down a server program or even an entire system, something\
    \ which could be achieved by various means: overloading the server, keeping it\
    \ busy with garbage packets, or exploiting a remote buffer overflow.\n\nOften\
    \ a DoS attack is done with the sole purpose of making the service disappear.\
    \ However, once a given service has become unavailable, communications could become\
    \ vulnerable to so-called \"man-in-the-middle attacks\" (sniffing, TCP connection\
    \ hijacking, spoofing) and DNS poisoning."
  merge: -1
  img_proc: true
- pgno: 437
  md: '# Man in the Middle: Sniffing, Hijacking, Spoofing


    In general, any remote attack performed by an attacker who puts himself between
    the communicating hosts is called a “man-in-the-middle attack”. What almost all
    types of man-in-the-middle attacks have in common is that the victim is usually
    not aware that there is something happening. There are many possible variants,
    for example, the attacker could pick up a connection request and forward that
    to the target machine himself. Now the victim has unwittingly established a connection
    with the wrong host, because the other end is posing as the legitimate destination
    machine.


    The simplest form of a man-in-the-middle attack is called “sniffer” — the attacker
    is “just” listening to the network traffic passing by. As a more complex attack,
    the “man in the middle” could try to take over an already established connection
    (hijacking). To do so, the attacker would have to analyze the packets for some
    time to be able to predict the TCP sequence numbers belonging to the connection.
    When the attacker finally seizes the role of the target host, the victims will
    notice this, because they get an error message saying the connection was terminated
    due to a failure. The fact that there are protocols not secured against hijacking
    through encryption, which only perform a simple authentication procedure upon
    establishing the connection, makes it easier for attackers. “Spoofing” is an attack
    where packets are modified to contain counterfeit source data, mostly the IP address.
    Most active forms of attack rely on sending out such fake packets — something
    that, on a Linux machine, can only be done by the superuser (root).


    Many of the attacks mentioned are carried out in combination with a DoS. If an
    attacker sees an opportunity to abruptly bring down a certain host, even if only
    for a short time, it will make it easier for him to push the active attack, because
    the host will not be able to interfere with the attack for some time.


    # DNS poisoning


    DNS poisoning means that the attacker corrupts the cache of a DNS server by replying
    to it with spoofed DNS reply packets, trying to get the server to send certain
    data to a victim who is requesting information from that server. Many servers
    maintain a trust relationship with other hosts, based on IP addresses or host
    names. The attacker will need a good understanding of the actual structure of
    the trust relationships between hosts to disguise itself as one of the trusted
    hosts. Usually, the attacker analyzes some packets received from the server to
    get the necessary information. The attacker often needs to target a well-timed
    DoS attack at the name server as well. Protect yourself by using encrypted connections
    that are able to verify the identity of the host to which to connect.'
  merge: -1
  img_proc: true
- pgno: 438
  md: '# Worms


    Worms are often confused with viruses, but there is a clear difference between
    the two. Unlike viruses, worms do not need to infect a host program to live. Rather,
    they are specialized to spread as quickly as possible on network structures. The
    worms that appeared in the past, such as Ramen, Lion, or Adore, make use of well-known
    security holes in server programs like bind or lprNG. Protection against worms
    is relatively easy. Given that some time will elapse between the discovery of
    a security hole and the moment the worm hits your server, there is a good chance
    that an updated version of the affected program will be available on time. Of
    course, that is only useful if the administrator actually installs the security
    updates on the systems in question.


    # Some General Security Tips and Tricks


    **Information:** To handle security competently, it is important to keep up with
    new developments and to stay informed about the latest security issues. One very
    good way to protect your systems against problems of all kinds is to get and install
    the updated packages recommended by security announcements as quickly as possible.
    SuSE security announcements are published on a mailing list to which you can subscribe
    by following the link `http://www.suse.de/security`. The list `suse-security-announce@suse.de`
    is a first-hand source of information regarding updated packages and includes
    members of SuSE’s security team among its active contributors.


    The mailing list `suse-security@suse.de` is a good place to discuss any security
    issues of interest. Subscribe to it under the URL given above for `suse-security-announce@suse.de`.


    `bugtraq@securityfocus.com` is one of the best-known security mailing lists worldwide.
    We recommend reading this list, which receives between 15 and 20 postings per
    day. More information can be found at `http://www.securityfocus.com`.


    The following is a list of rules which you may find useful in dealing with basic
    security concerns:


    +   - According to the rule of using the most restrictive set of permissions possible
    for every job, avoid doing your regular jobs as root. This reduces the risk of
    getting a cuckoo egg or a virus and protects you from your own mistakes.

    +   - If possible, always try to use encrypted connections to work on a remote
    machine. Use ssh (secure shell) to replace telnet, ftp, rsh, and rlogin.

    +   - Avoid using authentication methods based on IP addresses alone.'
  merge: -1
  img_proc: true
- pgno: 439
  md: "+   - Try to keep the most important network-related packages up-to-date and\
    \ subscribe to the corresponding mailing lists to receive announcements on new\
    \ versions of such programs (bind, sendmail, ssh, etc.). The same should apply\
    \ to software relevant to local security.\n\n+   - Change the `/etc/permissions`\
    \ file to optimize the permissions of files crucial to your system's security.\
    \ If you remove the setuid bit from a program, it might well be that it cannot\
    \ do its job anymore in the way it is supposed to. On the other hand, consider\
    \ that, in most cases, the program will also have ceased to be a potential security\
    \ risk. You might take a similar approach with world-writable directories and\
    \ files.\n\n+   - Disable any network services you do not absolutely require for\
    \ your server to work properly. This will make your system safer. Open ports,\
    \ with the socket state LISTEN, can be found with the program `netstat`. As for\
    \ the options, we suggest that you use `netstat -ap` or `netstat -anp`. The `-p`\
    \ option allows you to see which process is occupying a port under which name.\n\
    +   \n+     Compare the `netstat` results with those of a thorough port scan done\
    \ from outside your host. An excellent program for this job is `nmap`, which not\
    \ only checks out the ports of your machine, but also draws some conclusions as\
    \ to which services are waiting behind them. However, port scanning may be interpreted\
    \ as an aggressive act, so do not do this on a host without the explicit approval\
    \ of the administrator. Finally, remember that it is important not only to scan\
    \ TCP ports, but also UDP ports (options `-sS` and `-sU`).\n\n+   - To monitor\
    \ the integrity of the files of your system in a reliable way, use the program\
    \ `tripwire`, available on the SuSE Linux distribution. Encrypt the database created\
    \ by `tripwire` to prevent someone from tampering with it. Furthermore, keep a\
    \ backup of this database available outside your machine, stored on an external\
    \ data medium not connected to it by a network link.\n\n+   - Take proper care\
    \ when installing any third-party software. There have been cases where a hacker\
    \ had built a trojan horse into the tar archive of a security software package,\
    \ which was fortunately discovered very quickly. If you install a binary package,\
    \ have no doubts about the source from which you downloaded it.\n+   \n+     Note\
    \ that SuSE's RPM packages are gpg-signed. The key used by SuSE for signing reads\
    \ as follows:\n+   \n+     ID:9C800ACA 2000-10-19 SuSE Package Signing Key <build@suse.de>"
