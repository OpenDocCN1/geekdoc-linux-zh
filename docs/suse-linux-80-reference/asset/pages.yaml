    # OpenGL—3D Configuration


    OpenGL and GLIDE are 3D interfaces for 3Dfx Voodoo cards in Linux. Almost all
    modern 3D applications use the OpenGL interface, so 3D hardware acceleration can
    only be implemented over the OpenGL interface, even in the case of 3Dfx Voodoo
    cards. Only older applications still use the GLIDE interface directly. The OpenGL
    driver for 3Dfx Voodoo cards also uses the GLIDE interface. Direct3D from Microsoft
    is not available in Linux.'
  merge: -1
  img_proc: true
- pgno: 181
  md: '# Hardware Support


    SuSE Linux includes several OpenGL drivers for 3D hardware support. Table 7.6
    on the page before provides an overview.


    If you are installing YaST2 for the first time, activate 3D support during installation,
    if the related YaST2 support is recognized. nVidia graphics chips are the only
    exception. For these, the “dummy” driver included must be replaced by the official
    nVidia driver. Use YaST Online Update (YOU) to update the NVIDIA_GLX and NVIDIA_kernel
    packages. If updating with YOU is not an option, download the appropriate RPM
    packages NVIDIA_GLX and NVIDIA_kernel from the nVidia web server (http://www.nvidia.com),
    install them with YaST2, and run the script switch2nvidia_glx. Because of licensing
    stipulations, we can only offer the “dummy” nVidia driver packages. If an update
    is needed made or a new graphics card installed later, 3D hardware support will
    have to be configured differently. The approach to doing this depends on the OpenGL
    driver used and is described in further detail in the section below.


    # OpenGL Driver


    # Mesa Software Rendering


    This OpenGL driver will always be implemented if no 3D support was configured
    during installation or if no 3D support is available for the particular card in
    Linux.

    Mesa software rendering should only be implemented if the 3D driver causes any
    problems (representation errors or system instability). Make sure the package
    mesaソft is installed then run the script switch2mesasoft. If you have an nVidia
    card, also run the switch2nvidiasoft so the nVidia driver will be used for XFree86
    instead of the nvidia driver. With the command 3Ddiag --mesasoft, check to see
    if the Mesa software rendering has been properly configured.


    # nVidia-GLX and DRI


    This OpenGL driver can be quite easily configured using SaX2. After starting SaX2,
    answer “yes” to configuring 3D. If you have an nVidia card and did not update,
    SaX2 will need to replace the SuSE dummy driver packages with the official nVidia
    drivers via the Online Update. With the command 3Ddiag, test if nVidia-GLX and
    DRI are configured properly.'
  merge: -1
  img_proc: true
- pgno: 182
  md: 'For security reasons, only users belonging to the group **video** may access
    the 3D hardware. Verify that all users working locally on the machine are members
    of this group. Otherwise memory access errors will occur when attempting to start
    OpenGL applications (Nvidia-GLX) and the previous *Software Rendering Fallback*
    of the OpenGL driver will be used (DRI). Use the command `id` to check whether
    the active user belongs to the group *video*. If this is not the case, use YaST2
    to add the user to the group.


    # Mesa/Glide


    This OpenGL driver needs to be manually configured with the help of the information
    provided by `3Ddiag`. Details can be found in Section *Diagnosis Tool 3Ddiag*
    on this page.


    If you have a Mesa/Glide driver, start OpenGL applications as `root`, because
    only root can access the hardware. To allow this, the user currently logged in
    will have to enable `$DISPLAY` for root. This can be done with the command `xhost
    localhost`. The resolution used by the OpenGL application requires GLIDE support
    (resolutions supported are 640×480 and 800×600). Otherwise the very slow “Software
    rendering fallback” of the OpenGL driver will be used.


    # Diagnosis Tool 3Ddiag


    The diagnosis tool 3Ddiag is available for the purpose of verifying the 3D configuration
    in SuSE Linux. This is a command line tool that must be invoked inside a terminal.


    The application reviews, for example, the XFree86 configuration to verify that
    3D support packages are installed and the proper OpenGL library is used with the
    GLX extension. Follow the directions in 3Ddiag if "failed" messages appear. Ideally,
    you will only see "done" messages on the screen. Unless 3D support was already
    activated during installation, the 3D configuration of the Mesa/Glide OpenGL driver
    using this diagnosis can be relatively intensive.


    `3Ddiag -h` provides information about options for 3Ddiag.


    # OpenGL Test Applications


    Games, such as `bzflag`, `tuxracer`, and `tuxkart` (from the packages with the
    same name) and `gears` and `glinfo` from the package `mesa`, are suitable as OpenGL
    test applications. If 3D support has been activated, they can be played well on
    a somewhat up-to-date computer. These games, however, are not recommended in conjunction
    with Mesa software rendering because of the resulting slide show effect.'
  merge: -1
  img_proc: true
- pgno: 183
  md: '# Troubleshooting


    If the OpenGL 3D test results are negative (the games cannot be effectively played),
    use 3Ddiag to make sure no errors exist in the configuration ("failed" messages).
    If correcting these does not help or if failed messages have not appeared, take
    a look at the XFree86 log files. Often, you will find the line "DRI is disabled"
    in the XFree86 4.x file `/var/log/XFree86.0.log`. The exact cause can only be
    discovered by closely examining the log file — a task requiring some experience.


    In such cases, it is common that no configuration error exists, as this would
    have already been detected by 3Ddiag. Consequently, at this point, your best bet
    is the Mesa software rendering OpenGL driver, which does not feature 3D hardware
    support. Take advantage of Mesa software rendering and forego 3D hardware acceleration
    to avoid OpenGL representation errors or instability. A familiar example for the
    latter is the use of DRI and bttv (Watching TV in Linux) with ATI Rage 128 cards.


    # Installation Support


    Apart from Mesa software rendering, all OpenGL drivers in Linux are in developmental
    phases and are therefore considered experimental. The drivers are included in
    the distribution because of the high demand for 3D hardware acceleration in Linux.
    Considering the experimental status of OpenGL drivers, we cannot offer any installation
    support for configuring 3D hardware acceleration or provide any further assistance
    with related problems. The basic configuration of the graphical user interface
    X11 does not include 3D hardware acceleration configuration. This chapter answers
    many questions regarding this topic. If you have problems with 3D hardware support,
    use Mesa software rendering as already outlined in Section *Mesa Software Rendering*
    on page 170.


    # Additional Online Documentation


    +   - nVidia GLX: `/usr/share/doc/packages/nv_glx/`, `/usr/src/kernel-modules/nv_glx/README
    NVIDIA_GLX` and `NVIDIA_kernel` from the nVidia server

    +   - DRI: `/usr/X11R6/lib/X11/doc/README.DRI` (package `xf86`, series x)

    +   - Utah GLX: `/usr/share/doc/packages/glx/` (package `glx`, series x3d)

    +   - Mesa/Glide: `/usr/share/doc/packages/mesa3dfx/` (package `mesa3dfx`, series
    x3d)'
  merge: -1
  img_proc: true
