- pgno: 196
  md: "![](img/a4b6c994843f3fbd688003f4cabfa48f_196_0.png)\n\n*Figure 8.6: Connecting\
    \ MIDI Ports with kaconnect*\n\nThe connection between the application port and\
    \ the WaveTable (or external MIDI port) can now be configured manually. To do\
    \ this, select the corresponding ports then click ‘connect’. If you prefer using\
    \ the command line tool aconnect instead, enter something like `aconnect 128:0\
    \ 73:0`. This sets up a (unidirectional) connection between port 128:0 as sender\
    \ and 73:0 as receiver.\n\nYou can now set up a connection between the MIDI port\
    \ of the keyboard and the MIDI port of the ALSA sequencer viewer. If you alter\
    \ keyboard settings, such as panning or the pitch wheel (which must first be enabled\
    \ under ‘View’), these changes will be immediately reflected in qseqview.\n\n\
    View a list of ports available for receiving and sending and their connection\
    \ status by entering `aconnect --i` or `aconnect --o`. The connection set up with\
    \ aconnect can be terminated by specifying the option `--d`, as in `aconnect --d\
    \ 128:0 129:0`.\n\nTo terminate all connections, enter `aconnect --x`. A list\
    \ of further command line options in aconnect can be viewed in the man page for\
    \ aconnect (`man aconnect`).\n\n> **Tip**\n> \n> For experts: aseqnet allows you\
    \ to set up MIDI connections beyond your own machine over the network. Maybe you\
