- pgno: 349
  md: 'Normally, the correct driver for your network card is configured during installation
    and is activated. Therefore, manual hardware parameter settings are only needed
    if multiple network cards are used or if the network hardware is not automatically
    recognized. In this case, select ‘Add’ to specify a new driver module.


    ![](img/a4b6c994843f3fbd688003f4cabfa48f_349_0.png)


    *Figure 13.5: Configuring the Hardware Parameters*


    In this dialog, set the network card type and, for an ISA card, the interrupt
    to implement and the IO address. For some network drivers, also specify special
    parameters, such as the interface to use or whether it uses an RJ-45 or a BNC
    connection. For this, refer to the driver module documentation.


    After entering the hardware parameters, configure additional network interface
    data. Select ‘Interface’ in the dialog ‘Network base configuration’ to activate
    the network card and assign it an IP address. Select the card number then click
    ‘Edit’. A new dialog will appear in which to specify the IP address and other
    IP network data. Look at Figure 13.6 on the next page for more information. Find
    information about assigning addresses to your own network in Section TCP/IP —
    The Protocol Used by Linux on page 321 and Table 13.5 on page 329. Otherwise,
    enter the address assigned by your network administrator in the designated fields.


    Configure a name server under ‘Host Name and name server’ so the name resolution
    functions as described in Section DNS — Domain Name Service on page 349. Via ‘Routing’,
    set up the routing. Select ‘Configuration for Experts’ to make advanced settings.'
  merge: -1
  img_proc: true
- pgno: 350
  md: '![](img/a4b6c994843f3fbd688003f4cabfa48f_350_0.png)


    Figure 13.6: Configuring Network Addresses


    With that, the network configuration is complete. YaST2 starts SuSEconfig and
    transfers the settings to the corresponding files (see Section *Manual Network
    Configuration* on the next page). For the changes to take effect, the relevant
    programs must be reconfigured and the required daemons must be restarted. This
    is done by entering the command `rcnetwork restart`.


    # PCMCIA


    PCMCIA network cards are managed in a somewhat special way. Normal network cards
    are fixed components assigned a permanent device name such as eth0. By contrast,
    PCMCIA cards get assigned a free device name dynamically on an as-needed basis.
    To avoid conflicts with fixed network cards, PCMCIA services are loaded only after
    the network in the boot sequence.


    PCMCIA related configuration and start scripts are located in the directory `/etc/sysconfig/pcmcia`.
    The scripts will be executed as soon as cardmgr, the PCMCIA Device Manager, detects
    a newly inserted PCMCIA card — which is why PCMCIA services do not need to be
    started before the network during boot. More detailed information about PCMCIA
    can be found in the “Reference” Manual.


    # Configuring IPv6


    To configure IPv6, you will not normally need to make any changes on the individual
    workstations. However, the IPv6 support will have to be loaded. Do this most easily
    by entering the command `modprobe ipv6`.'
  merge: -1
  img_proc: true
- pgno: 351
  md: 'Because of the autoconfiguration concept of IPv6, the network card is assigned
    an address in the “link-local” network. Normally, no routing table management
    takes place on a workstation. The network routers can be inquired by the workstation
    by means of the “router advertisment protocol” as to which prefix and gateways
    should be implemented.

    The radvd program out of the package radvd, series n (Network) can be used to
    set up an IPv6 router. This program informs the workstations which prefix to use
    for the IPv6 addresses and which routers.

    To easily assign a workstation an IPv6 address, it is advisable to install and
    configure the router using the radvd program. The workstations will then automatically
    receive the IPv6 addresses assigned to them.


    # Manual Network Configuration


    Manual configuration of the network software should always be the last alternative.
    We recommend using YaST2.


    # Configuration Files


    This section provides an overview of the network configuration files and explains
    their purpose and the format used.


    `/etc/hosts`


    In this file (see File 40), IP addresses are assigned to host names. If no name
    server is implemented, all hosts to which an IP connection will be set up must
    be listed here. For each host, a line consisting of the IP address, the fully
    qualified host name, and the host name (e.g., earth) is entered into the file.
    The IP address has to be at the beginning of the line, the entries divided by
    blanks and tabs. Comments are always preceded by the ''#'' sign.'
  merge: -1
  img_proc: true
