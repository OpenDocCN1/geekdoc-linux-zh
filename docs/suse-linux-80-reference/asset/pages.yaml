    height must be specified in dots, where one dot is 1/72 inches (approx. 0.35 mm).
    The margin offsets left-offset and top-offset, on the other hand, should be specified
    in dot matrices, depending on the resolution.


    If only the position of the printout should be shifted on the paper, the following
    file is sufficient: `/etc/lpd/filter/test/offset.ps`


    ```

    ```postscript

    %!PS

    << /Margins [left-offset top-offset] >> setpagedevice

    ```

    ```


    *File 25: /etc/lpd/filter/test/offset.ps: Position of the Printout*'
