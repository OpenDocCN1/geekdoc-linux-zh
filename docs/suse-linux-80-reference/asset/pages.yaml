- pgno: 388
  md: "# Annotation\n\n+   - **workgroup = working group**  \n+     On any Windows\
    \ machine, Samba is assigned like a work group where it can be seen in the `network`\
    \ environment. `workgroup` is the default work group for Windows for Workgroups.\n\
    \n+   - **guest account = nobody**  \n+     Samba needs a user name listed in\
    \ `/etc/password` that only has limited permissions for certain tasks. If public\
    \ shares (parameter `public = yes`) are defined, all operations are executed with\
    \ this user ID. Even if no public share is defined, the account guest account\
    \ has to be defined for the Samba machine to appear in the networking environment.\n\
    \n+   - **keep alive = 30**  \n+     Windows machines tend to crash from time\
    \ to time. If they leave open connections behind, it could happen that the server\
    \ recognizes them much later. If you do not want Samba to waste resources, tell\
    \ it to check whether the client is still alive by setting keep alive = 30.\n\n\
    +   - **os level = 2**  \n+     The parameter os level = 2 specifies that Samba\
    \ provide browser services to WfW and Windows 95. If there is an NT machine on\
    \ the network, Samba will not provide these services to it, but use the NT machine\
    \ itself.\n\n+   - **Kernel oplocks = false**  \n+     Unfortunately, since Linux\
    \ currently does not support opportunistic locking via the kernel, the value Kernel\
    \ oplocks has to be set to false.\n\n+   - **security = user** See section *Security\
    \ Levels* on the next page.\n\nThe entry [cdrom] is the directory name that can\
    \ be seen from outside. With this name, the directory is exported to the network\
    \ environment. It can be reached by all users in the network, because guest ok\
    \ = yes. The [home] share is of special importance here. If the user has a valid\
    \ account and password for the Linux file server as well as his own home directory,\
    \ he can be connected to this.\n\n+   - **path = /cdrom** The directory `/cdrom`\
    \ is exported by means of path.\n\n+   - **comment = Linux CD-ROM** Every share\
    \ with SMB servers can be provided with a comment describing the share."
  merge: -1
  img_proc: true
- pgno: 389
  md: '+   - **browse = yes** This setting enables the share `cedrom` to be visible
    in the network environment.

    +   - **read only = yes** By default, Samba prohibits write access on exported
    shares. Users logged in should have permission to write in their home directories,
    so `read only = no` must be set.

    +   - **create mode = 750** Windows machines do not understand the concept of
    UNIX permissions, so cannot assign permissions when creating a file. The parameter
    `create mode` assigns what permissions to use when a new file is created. This,
    of course, only applies to shares with write permissions.

    +   - **public = yes** Guest users have access to this share. It does not request
    a password. The user simply appears as user nobody.


    # Security Levels


    The SMB protocol comes from the DOS/Windows world and directly takes into consideration
    the problem of security. Each share access can be protected with a password. SMB
    has three possible ways of achieving this:


    +   - **Share Level Security:** In the Share Level Security, a password is firmly
    allocated to a share. Everyone who knows this password has access to that share.

    +   - **User Level Security:** This variation introduces the concept of the user
    in the SMB. Each user must register with the server with his own password. After
    registering, the server can grant access to individual exported shares independently
    of user names.

    +   - **Server Level Security:** Samba insists that its clients work in User Level
    Mode. However, it passes on all password queries to another User Level Mode Server,
    which takes care of authentication. This setting expects a further parameter (`password
    server =`).


    The differentiation between share, user, and server level security must be made
    for the entire server. It is not possible to export some shares by Share Level
    Security and others by User Level Security. More information on this subject can
    be found in the file `/usr/share/doc/packages/samba/xtdocs/security_level.txt`.'
  merge: -1
  img_proc: true
- pgno: 390
  md: '> > **Tip**

    > >

    > > For simple administration tasks with the Samba server, there is also the program
    swat. It provides a simple web interface with which you can conveniently configure
    the Samba server. In a web browser, call up `http://localhost:901` and log in
    as user root. swat is also activated in the files `/etc/inetd.conf` and `/etc/services`.
    More information about swat can be found in its man page.


    # Samba as Login Server


    In networks where predominantly Windows clients are found, it is often preferable
    that users may only register with a valid account and password. This can be brought
    about with the help of a Samba server. In a pure Windows network, a Windows NT
    server takes on this task. This is configured as a Primary Domain Controller (PDC).
    The following entries must be made in the [global] section of the smb.conf.


    ```

    ```text

    global]

    workgroup = TUI-NET

    domain logons = yes

    domain master = yes

    ```

    ```


    *File 61: []*


    If encrypted passwords are used for verification purposes, the Samba server must
    be able to handle these. The entry encrypt passwords = yes in the [global] section
    enable this functionality. In addition, it is necessary to prepare user accounts
    and passwords in an encryption format that conforms with Windows. This is done
    with the command smbpasswd -a name. Since, in accordance with the Windows NT domain
    concept, the computers themselves need a domain account, this is created with
    the following commands:


    ```

    ```text

    useradd -m machinename

    smbpasswd -a -m machinename

    ```

    ```


    *File 62: Adding a Machine Account*


    With the useradd command, a masked dollar sign, masked by a backslash, is added.
    The command smbpasswd includes this automatically when the -m parameter is used.'
  merge: -1
  img_proc: true
- pgno: 391
  md: '# Installation of Clients


    First, it should be mentioned that clients can only access the Samba server via
    TCP/IP. NetBEUI and NetBIOS via IPX are not available at the moment. Since TCP/IP
    is becoming more and more popular, even with Novell and Microsoft, it is not certain
    whether this is going to change in the near future.


    # Windows 95/98


    Windows 95/98 already has built-in support for TCP/IP. As with Windows for Workgroups,
    however, this is not installed as the default. To add TCP/IP, go to ‘Control Panel’
    → ‘System’ and choose ‘Add’ → ‘Protocols’ → ‘TCP/IP from Microsoft’. Be sure to
    enter your network address and network mask correctly. After rebooting your Windows
    machine, you will find the properly configured Samba server in networks (double-click
    on the network icon on your desktop).


    > > **Tip**

    > >

    > > To use a printer on the Samba server, install the standard or Apple-PostScript
    printer driver from the corresponding Windows version. It is best to link this
    to the Linux printer queue, which includes an automatic apsfilter recognition.


    # Optimization


    It should first be pointed out here that Samba, in its default version, is prepared
    for handling Windows NT server. It is, therefore, actually not necessary to carry
    out optimizations, because the many tuning options only result in a minimal difference
    in terms of speed. The standard configuration in `/etc/samba/smb.conf` is, of
    course, not tuned to every network and the way the network is used, so that this
    can also be optimized. Since this fine-tuning is dependent on many factors, no
    universal solution can be provided. Look at the help files and the many tips on
    optimization in the files `/usr/share/doc/packages/samba/textdocs/Speed.txt` and
    `/usr/share/doc/packages/samba/textdocs/Speed2.txt`.'
  merge: -1
  img_proc: true
- pgno: 392
  md: '# Netatalk


    With the package `netatalk`, obtain a high-performance file and print server for
    MacOS clients. With it, access data on a Linux machine from a Macintosh or print
    to a connected printer.


    Netatalk is a suite of Unix programs that run on kernel-based DDP (Datagram Delivery
    Protocol) and implement the AppleTalk protocol family (ADSP, ATP, ASP, RTMP, NBP,
    ZIP, AEP, and PAP). AppleTalk is, in effect, an equivalent to the more familiar
    protocol known as TCP (Transmission Control Protocol). It has counterparts to
    many services available on TCP/IP, including services for resolving host names
    and time synchronization. For example, the command `nbplkup` (NBP, Name Binding
    Protocol) is used instead of `nslookup` (DNS, Domain Name Service) and `aecho`
    (AEP, AppleTalk Echo Protocol) instead of `ping` (ICMP ECHO_REQUEST, Internet
    Control Message Protocol).


    The three daemons described below are normally started on the server:


    +   - `atalkd` (“AppleTalk Network Manager”) that somewhat correlates the programs
    `ifconfig` and `routed`

    +   - `afpd` (AppleTalk Filing Protocol daemon), which provides an interface for
    Macintosh clients to Unix file systems

    +   - `papd` (Printer Access Protocol daemon), which makes printers available
    in the (AppleTalk) network.


    Of course, you can export server directories not only via Netatalk, but also,
    at the same time, via Samba for Windows clients (see Section Clients on page 374)
    and via NFS (see *NFS — Shared File Systems* on page 365), which is very useful
    in heterogeneous network environments. This centralizes the management of data
    backup and user permissions on the Linux server.


    Note:


    +   - Due to Macintosh client restrictions, the user passwords on the server cannot
    be longer than eight characters.

    +   - Macintosh clients cannot access Unix files with names longer than 31 characters.

    +   - File names may not contain colons (`:`) because they serve as path name
    separators in MacOS.


    The package `netatalk`, series n has to be installed.'
  merge: -1
  img_proc: true
- pgno: 393
  md: '# Configuring the File Server


    In the default configuration, Netatalk is already fully functional as a file server
    for home directories of the Linux system. To use the extended features, define
    some settings in the configuration files. These are located in the `/etc/atalk`
    directory.


    All configuration files are text files. Text that follows a hash mark `#` (comments)
    and empty lines can be disregarded.


    # Configuring the Network — atalkd.conf


    Define, in `/etc/atalk/atalkd.conf`, over which interfaces services are provided.
    This is usually eth0, which means that it suffices if the only value entered here
    is eth0. In the example file that comes with Netatalk, this is the case. Enter
    additional interfaces to use several network cards at the same time. When the
    server is started, it will search the network for already existing zones and servers
    and modify the corresponding lines by entering the set AppleTalk network addresses.
    You will then find a line such as


    ```

    eth0 -phase 2 -net 0-65534 -addr 65280.57

    ```


    at the end of the file. To make more complex configurations, find examples for
    this in the configuration file. Find documentation on additional options in the
    manual page of afpd.


    # Defining File Servers — afpd.conf


    The `afpd.conf` file contains definitions for how your file server appears on
    MacOS machines as an item under the ‘Chooser’ dialog. As is the case with the
    other configuration files, these also contain detailed comments explaining the
    wide variety of options.


    If you do not change anything here, the default server will simply be started
    and displayed with the host name in the ‘Chooser’. Therefore, you do not necessarily
    have to enter anything. However, you can give additional file servers a variety
    of names and options here. For instance, to provide a specific “guest server”
    where everybody can save files as “guest”,


    ```

    "Guest server" -uamlist uams_guest.so

    ```


    Define a server that denies guests access, but which is only accessible for users
    who already exist in the Linux system with


    ```

    "Font server" -uamlist uams_clrtext.so,uams_dhx.so

    ```'
  merge: -1
  img_proc: true
- pgno: 394
  md: 'This behavior is controlled by the option `uamlist`, followed by a list of
    authentication modules to use, separated by commas. If you do not provide this
    option, all procedures are active by default.


    An AppleShare server not only provides its services by default via AppleTalk,
    but also (“encapsulated”) via TCP/IP. The default port is 548. Assign dedicated
    ports to additional AppleShare servers (on the same machine) if these are to likewise
    run via TCP. The availability of the service via TCP/IP enables access to the
    server even over non-AppleTalk networks, such as the Internet.


    In this case, the syntax would read:


    ```

    "Font server" -uamlist uams_clrtxt.so,uams_dhx.so -port 12000

    ```


    The AppleShare server, set to the port 12000, then appears in the network with
    the name “Font server” and will not allow guest access. In this way, it is also
    accessible via TCP/IP routers.


    The file `AppleVolumes.default` (described in detail below) defines which directories
    located on the server are made available by each AppleShare server as network
    “volumes”. Define other files containing unique descriptions for each AppleShare
    server using the option `-defaultvol`, such as with (in one line):


    ```

    "Guest server" -uamlist uams_guest.so -defaultvol

    /etc/atalk/AppleVolumes.guest

    ```


    Further options are explained in the `afpd.conf` file itself.


    # Directories and Access Permissions — AppleVolumes.default


    Here, define directories to export. The access permissions are defined via the
    customary Unix user and group permissions. This is configured in the `AppleVolumes.default`
    file.


    > > **Note**

    > >

    > > Here, the syntax has partially changed. Take this into consideration if you
    are updating this version from a previous one. For example, it is now

    > > `allow:` instead of `access=` (a typical symptom would be if, instead

    > > of the drive descriptions, you were to see a display of the drive options

    > > on the Mac clients in the ‘Chooser’.) Since the new files are created with

    > > the `.rpmnew` endings during an update, it is possible that your previous

    > > settings may no longer function as a result of the modified syntax. We

    > > recommend creating backups of your configuration files, copying your old

    > > configurations from them into your new files, then renaming these files to

    > > the proper names. This way, you will benefit from the current comments

    > > contained in the configuration files, which provide a detailed explanation

    > > of the diverse options.'
  merge: -1
  img_proc: true
- pgno: 395
  md: 'Along with `AppleVolumes.default`, additional files can be created, such as
    `AppleVolumes.guest`, used by some servers (by giving the option `-defaultvol`
    in the `afpd.conf` file — see previous section). The syntax


    ```

    /usr/local/psfonts "PostScript Fonts"

    ```


    indicates that the Linux directory `/usr/local/psfonts` located in the root directory
    is available as an AppleShare volume with the name "PostScript Fonts". Options
    are separated by a space and attached to the end of a line. A very useful option
    is the access restriction:


    ```

    /usr/local/psfonts "PostScript Fonts" allow:User1,@group0

    ```


    which restricts access to the volume "PostScript Fonts" to the user "User1" and
    all members of the group "group0". The users and groups entered here have to be
    known, of course, to the Linux system. Likewise, explicitly deny users access
    with `deny:User2`.


    These restrictions only apply to access via AppleTalk and not to the normal access
    rights users have if they can log in to the server itself.


    Netatalk maps the customary Resource Fork of MacOS files to `.AppleDouble` directories
    in the Linux file system. Using the `nodouble` option, set these directories to
    be created only when they are actually needed. Syntax:


    ```

    /usr/local/guests "Guests" options:nodouble

    ```


    Additional options and features can be found in the explanations included in the
    file itself.


    The tilde (`~`) in this configuration file stands for the home directory for each
    and every user on the server. This way, every user can easily access his home
    directory without each one having to be explicitly defined here. The example file
    installed already includes a tilde, which is why Netatalk makes the home directory
    available by default as long as you do not modify anything in this file.


    `afpd` also searches for a file `AppleVolumes` or `.AppleVolumes` in the home
    directory of a user logged on to the system. Entries in this file supplement the
    entries in the server files `AppleVolumes.system` and `AppleVolumes.default` to
    enable individual type and creator file specifications and to access specific
    directories. These entries are extensions and do not allow access for the user
    for whom access permission is denied from the server side.


    The `netatalk.pam` file is used, via PAM (pluggable authentication modules), for
    authentication purposes. Using PAM is, however, irrelevant in this context.'
  merge: -1
  img_proc: true
- pgno: 396
  md: '# File Specifications — AppleVolumes.system


    In the AppleVolumes.System file, define which customary MacOS type and creator
    specifications are assigned to certain file endings. An entire series of default
    values are already predefined. If a file is displayed by a generic white icon,
    there is not yet an entry for it in this file. If you encounter a problem with
    a text file belonging to another system, which cannot be opened properly in MacOS
    or vice versa, check the entries.


    # Configuring the Print Server


    A laserwriter service is made available by configuring the papd.conf file. The
    printer must be already functioning locally via lpd, so configure a printer as
    described in the Reference Manual. If you can print a text file locally using
    the command `lpr file.txt`, the first step has been successfully completed. You
    do not necessarily need to enter anything in papd.conf if a local printer is configured
    in Linux, because print jobs can simply be forwarded to the print daemon lpd without
    additional specifications. The printer registers itself in the AppleTalk network
    as LaserWriter. You can, however, extend your printer entries by referring to
    File 63.


    ```

    Printer_Reception:pr=lp:pd=/etc/atalk/kyocera.ppd

    ```


    > File 63: `papd.conf` This macro is not allowed. Please consult the documentation.


    This causes the printer named Printer_Reception to appear as a ‘Chooser’ item.
    The corresponding printer description file is usually provided by the vendor.
    Otherwise, refer to the file Laserwriter located in the ‘System Extensions’ folder.
    However, using this file, often you cannot use all of the printer’s features.


    # Starting the Server


    The server can be started at system boot time via its “init script” or manually
    with `rcatalk start`. The init script is located at `/etc/init.d/atalk`. The actual
    starting of the server takes place in the background. It takes about a minute
    until the AppleTalk interfaces are set up and responsive. Check for the status
    as shown in the following (all servers are running if OK is reported three times):


    ```

    earth:  # rcatalk status

    ```'
  merge: -1
  img_proc: true
- pgno: 397
  md: '```

    Checking for service atalk:OK\nearth: #

    ```


    Now it is time to go to a Mac running MacOS. Check for AppleTalk activation, choose
    ‘Filesharing’, double-click ‘AppleShare’. The names of the servers should then
    appear in the window. Double-click a server and log in. Choose the volume and
    there is your shared net volume, accessible from within MacOS. The procedure is
    a bit different for AppleShare servers configured to use TCP only (and no DDP).
    To connect, press the ‘Server IP address’ button and enter the respective IP address.
    If necessary, append the port number, separated by a colon (‘:’).


    # Additional Information


    To take full advantage of all the options netatalk offers, read the corresponding
    manual pages. Find them by entering the command


    ```

    earth: # rpm -qd netatalk

    ```


    The /etc/atalk/netatalk.conf file is not used in our netatalk version, so disregard
    it.\nHelpful URLs:


    +   - http://netatalk.sourceforge.net/\n- http://www.umich.edu/~rsug/netatalk/\n-
    http://thehamptons.com/anders/netatalk/\n- http://cgi.zettabyte.net/form-serve/netatalk/cache/1.html


    We do not currently recommend trying to access an AppleShare file system hosted
    on a Macintosh from a Linux machine. Software is available, but it is in early
    development stages. For more information, refer to


    +   - http://www.panix.com/~dfoster/apfs/'
