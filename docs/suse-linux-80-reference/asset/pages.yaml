    # RPM — the Distribution Package Manager


    In SuSE Linux, RPM (rpm), the “Red Hat Package Manager” serves as the package
    manager. It makes the powerful RPM database available to everyone: users, system
    administrators, and, of course, package builders. Detailed information on installed
    software can be queried from the database at any time.'
