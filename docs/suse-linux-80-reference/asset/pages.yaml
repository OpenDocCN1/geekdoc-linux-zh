- pgno: 398
  md: '# Netware Emulation with MARSNWE


    The Netware emulator MARSNWE can easily replace the file and print services of
    a Novell Netware 2.2 or 3.11 server. It can also be used in this manner as an
    IPX router. However, it does not offer the features of newer Netware versions,
    such as NDS (Netware Directory Services). Workstations running DOS or Windows
    already configured to access a Netware 2.2, 3.11, or 3.12 server can use the Linux
    server with the Netware emulator MARSNWE as a server without having to change
    the configuration much. Administration is best taken care of in Linux, because
    Novell system administration applications can only be utilized under certain conditions
    and have licensing issues as well.


    # Starting the Netware Emulator MARSNWE


    MARSNWE in SuSE Linux can be started immediately after installation, because it
    is already preconfigured for initial testing. The required IPX support on the
    part of the kernel is available as a loadable kernel module and is automatically
    loaded by the start script. The IPX interface is automatically set up by MARSNWE.
    At this point, the network number and the protocol to use will both be read from
    the extensively commented configuration file `/etc/nwserv.conf`. MARSNWE is started
    via the command `rcnwe start`. The done message to the right of the screen in
    green indicates that MARSNWE has been successfully started. Use `rcnwe status`
    to check whether the Netware emulator is running. Halt it with `rcnwe stop`.


    # The Configuration File /etc/nwserv.conf


    The configuration options are summarized in enumerated sections. Every configuration
    starts with the number of the corresponding section. Only sections 1 to 22 are
    relevant here. Not all numbers are used, however. Most of the time, the following
    sections are enough for the configuration:


    +   1  Netware Volumes

    +   2  Server Name

    +   4  IPX Network

    +   13 User Names

    +   21 Printers


    After modifying the configuration, MARSNWE must be restarted with the command
    `rcnwe restart`.

    The configuration options in detail:'
  merge: -1
  img_proc: true
- pgno: 399
  md: '# Volumes (Section 1):


    ```

    1    SYS    /usr/local/nwe/SYS/    kt    711 600

    ```


    Here, the volumes to export are defined. Every line begins with the section number
    (here 1), followed by the volume name and the server directory path. In addition,
    various options can be specified represented by specific letters and a UMASK for
    the generation of both directories and files. If a UMASK is not specified, the
    default value from Section 9 is used. The volume for SYS is already entered. To
    avoid problems with uppercase and lowercase letters in the file names, it is recommended
    to use the k option, so all the file names will be converted to lowercase letters.


    # Server Name (Section 2):


    ```

    2    MARS

    ```


    This specification is optional. The host name will be used by default.


    # Internal Network Number (Section 3):


    ```

    3    auto

    ```


    The internal network number is generated from the network card’s MAC address if
    auto is specified here. This setting is usually retained.


    # IPX Configuration (Section 4):


    ```

    4    0x0    *       AUTO          1

    4    0x22   eth0    ethernet_ii    1

    ```


    Here, the Netware network number is specified as well as to which network interface
    using which protocol the bind should be made. The first example sets up everything
    automatically, while the second binds the network number 0x22 to the network card
    eth0 with the frame type Ethernet-II. If you have several network cards and enter
    all these with different network numbers, IPX will be routed between them.


    # Create Mode (Section 9):


    ```

    9    0751    0640

    ```'
  merge: -1
  img_proc: true
- pgno: 400
  md: 'Enters the default permission with which directories and files are created.


    # UID and GID with minimal permissions (Section 10, 11):


    ```

    10    65534

    11    65534

    ```


    Group ID and user ID for users not logged in. Here nongroup and nobody.


    # Supervisor Login (Section 12):


