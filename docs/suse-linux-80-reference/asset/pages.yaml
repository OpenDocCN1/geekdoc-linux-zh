    List of hosts and domains as a pattern for /etc/hosts.allow, which should have
    access to the documentation server. This variable will only be read if DOC_SERVER
    is set to yes. A subdomain can also be listed here (e.g., with "*.cosmos.com").


    # **language** — Settings for language and locale


    DEFAULT_LANGUAGE="english"


