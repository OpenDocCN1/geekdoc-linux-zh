- pgno: 169
  md: 'After answering these questions, you can enter a clock chip for accelerated
    cards, if you have one. Entering a clock chip avoids clock lines, as the clocks
    needed can be programmed.


    +   1. ChronTel 8391 — `ch8391`

    +   2. TCD2061A and compatibles (ICS9161A, DCS2824) — `icd2061a`

    +   3. ICS2595 — `ics2595`

    +   4. ICS5342 (similar to SDAC, but not completely compatible) — `ics5342`

    +   5. ICS5341 — `ics5341`

    +   6. 63 GenDAC (86C708) and ICS5300 (autodetected) — `s3gendac`

    +   7. S3 SDAC (86C716) — `s3_sdac`

    +   8. STG 1703 (autodetected) — `stg1703`

    +   9. Sierra SC11412 — `sc11412`

    +   10. TI 3025 (autodetected) — `ti3025`

    +   11. TI 3026 (autodetected) — `ti3026`

    +   12. IBM RGB 51x/52x (autodetected) — `ibm_rgb5xx`


    # *Output 11: Setting the Clock Chip*


    If a card without a clock chip is selected, just press **[Enter]** (thus not selecting
    a clock chip). If a card has been selected, the clock chip is set as default (if
    there is one).


    If no clock chip has been set, xf86config suggests running X -probeonly to determine
    the clock timings supported. These are automatically written in XF86Config in
    a separate clocks line.


    Here, we must explain why the automatically defined settings can be **very risky**:
    if the card has a programmable clock chip, the X server, when probing, cannot
    distinguish between the different clocks and only recognizes clocks 0, 1, and
    sometimes, 2. All other values are more or less random numbers (normally, clocks
    0, 1, and 2 are repeated and are replaced by zeros).


    All clocks apart from 0 and 1 are strongly influenced by the preprogrammed clock
    chip. Thus, clock 2 could have a different setting when probed (and which was
    written to the file XF86Config) than when the X server is later started. Then
    all the timings would be wrong and the monitor could be severely damaged.'
  merge: -1
  img_proc: true
- pgno: 170
  md: "A good indication of a programmable clock chip (and the problems this might\
    \ entail) is the multiple zeros or repeating timing values. Absolutely, under\
    \ no circumstances, ever write such values to `XF86Config`.\n\nTo configure clock\
    \ chips, follow these steps:\n\n+   - The best way is to enter an existing *(programmable)*\
    \ clock chip if there is one. It will be programmed according to your `XF86Config`\
    \ and will not contain clock lines. Compare chips on the card with the chips offered\
    \ in the menu. Most newer S3 cards have a programmable clock chip.\n+   \n+  \
    \ - If you do not have a programmable clock chip, you should launch X-probeonly\
    \ and compare these values with those in the manual. If these values correspond\
    \ (±2), enter them in `XF86Config`.\n+   \n+     Unless the manual offers some\
    \ pertinent advice, the values are determined by running X-probeonly (this works\
    \ best on an unloaded machine). Check whether the values are accurate, since clock\
    \ values cannot be determined for every card. (Many zeros or repeating values\
    \ are a sign of invalid settings.) Enter the correct values into `XF86Config`.\
    \ Do not omit any values. Do not try to rearrange them or change them in any way.\
    \ The values have to be entered in their exact order.\n+   \n+     If the P9000\
    \ server is used, the order is irrelevant; just enter the modes for the desired\
    \ clock in the *clocks line*.\n+   \n+   - In general: if there is a programmable\
    \ clock chip, there should be no clocks line in `XF86Config` (exception, P9000).\
    \ For cards without a programmable clock chip, there should be a clocks line in\
    \ `XF86Config`. This avoids tedious (and sometimes even risky) clock probe at\
    \ each start. Furthermore, for cards with unreadable values, there are no invalid\
    \ values and there is no risk to your monitor.\n\nAfter having read the previous\
    \ section, if you want to let clocks be recognized automatically, just answer\
    \ ‘y’ to the following question:\n\n> Do you want me to run “X -probeonly” now?\n\
    \nNow the screen will turn black before the list of probed clocks appears or a\
    \ message will appear that no clocks could be found. If you have selected a clock\
    \ chip, this question will not appear, since the clocks will then be programmed\
    \ automatically. If this is the case, this section will be skipped.\n\n> **Caution**\n\
    > \n> If the previous question has been answered with ‘y’ and the screen remains\
    \ black for more than 30 seconds, cancel testing immediately with `Ctrl` + `Alt`\
    \ + `F1`, or `Ctrl` + `C`. If this does not work, switch off the monitor and the\
    \ computer to prevent damage to your hardware."
  merge: -1
  img_proc: true
- pgno: 171
  md: "# Saving your Configuration\n\nNow write the configuration file. It is recommended\
    \ that you write it to /etc/XF86Config to ensure that, even in a networking environment,\
    \ each machine has its own configuration file — even if they share the /usr file\
    \ system. Specify `/etc/XF86Config` at this point. This includes xf86config and\
    \ the configuration of the X Window System.\n\n# Optimizing the Installation of\
    \ the X Window System\n\nThis section describes the configuration file, `/etc/X11/XF86Config`.\
    \ Each section starts with the keyword `Section <name of section>` and ends with\
    \ `EndSection`. Below is a rough outline of the most important sections.\n\nAfterwards,\
    \ learn how to integrate additional fonts, how to configure input devices, and\
    \ how 3D acceleration is implemented. This is also managed in certain sections\
    \ of the XF86Config file, of course, although integrating an additional font requires\
    \ the help of external programs, which are included with SuSE Linux or are part\
    \ of the default installation. The methods discussed here aim to illustrate the\
    \ possibilities available and serve as an incentive, but they do not claim to\
    \ cover all eventualities.\n\nThe programs SaX2 and xf86config (for XFree86-4.0)\
    \ create the file XF86Config, by default in `/etc/X11`. This is the primary configuration\
    \ file for the X Window System. Find all the settings here concerning your graphics\
    \ card, mouse, and monitor.\n\nXF86Config is divided into several sections, each\
    \ one dealing with a certain aspect of the configuration. A section always has\
    \ the same form:\n\n```\nSection (name of section)\n    entry 1\n    entry 2\n\
    \    entry n\nEndSection\n```\n\nThe following types of sections exist:\n\n| Section\
    \ | Description |\n|---|---|\n| Files | This section describes the paths used\
    \ for fonts and the RGB color table. |\n| ServerFlags | General switches are set\
    \ here. |\n\n*Table 7.4: continued overleaf…*"
  merge: -1
  img_proc: true
- pgno: 172
  md: '| Section | Description |

    |---|---|

    | **InputDevice** | Input devices are configured in this section. In contrast
    to XFree86-3.3, keyboards, mice, and special input devices (touch pad, joysticks,
    etc.) are configured via this section. Important terms here are Driver and the
    options defined by Protocol and Device. |

    | **Monitor** | Describes the monitor used. The individual elements of this are
    the name, which is referred to later in the Screen definition, the bandwidth,
    and the allowed sync frequencies (HorizSync and VertRefresh). Settings are given
    in MHz, kHz, and Hz. Normally, the server refuses any mode line that does not
    correspond with the specification of the monitor. This is to prevent too high
    frequencies from being sent to the monitor by accident. |

    | **Modes** | The mode line parameters are stored here for the specific screen
    resolutions. These parameters can be calculated by SaX2 on the basis of the values
    given by the user and normally do not need to be changed. You can intervene manually
    at this point, however, if, for example, you want to connect a fixed frequency
    monitor. An exact explanation of the individual parameters would be too much for
    this book. Find details on the meaning of individual number values in the HOWTO
    file `/usr/share/doc/howto/en/XFree86-Video-Timings-HOWTO.gz`. |

    | **Device** | This section defines a specific graphics card. It is referenced
    by its descriptive name. |

    | **Screen** | This section puts together a Driver (e.g., vga2), a monitor, and
    a Device to form all the necessary settings for XFree86. In the Display subsection,
    specify the size of the virtual screen (Virtual, the ViewPort, and the Modes)
    used with this virtual screen. |

    | **ServerLayout** | This section defines the layout of a single or multihead
    configuration. The input devices InputDevice and the display devices Screen are
    combined into one section. |


    *Table 7.4: Sections in `/etc/X11/XF86Config`*


    We will now take a closer look at Monitor, Device, and Screen. Further information
    on the other sections can be found in the man page for XFree86 (man XFree86) and
    the man page for XF86Config (man XF86Config).'
  merge: -1
  img_proc: true
- pgno: 173
  md: "There can be several different Monitor sections in XF86Config. Even multiple\
    \ Screen sections are possible. Which one is started depends on the server started.\n\
    \n# Screen Section\n\nFirst, we will take a closer look at the screen section.\
    \ As mentioned above, this combines a monitor with a device section and determines\
    \ which resolution using which color depth should be used. A screen section might\
    \ look like the example in File 12.\n\n```\n```text\nSection \"Screen\"\n    DefaultDepth\
    \ 16\n    SubSection \"Display\"\n        Depth        16\n        Modes     \
    \   \"1152x864\" \"1024x768\" \"800x600\"\n        Virtual      1152x864\n   \
    \ EndSubSection\n    SubSection \"Display\"\n        Depth        24\n       \
    \ Modes        \"1280x1024\"\n    EndSubSection\n    SubSection \"Display\"\n\
    \        Depth        32\n        Modes        \"640x480\"\n    EndSubSection\n\
    \    SubSection \"Display\"\n        Depth        8\n        Modes        \"1280x1024\"\
    \n    EndSubSection\n    Device       \"Device[0]\"\n    Identifier   \"Screen[0]\"\
    \n    Monitor      \"Monitor[0]\"\nEndSection\n```\n```\n\n*File 12: The Screen\
    \ Section of the File /etc/X11/XF86Config*\n\nThe line Identifier (here Screen[0])\
    \ gives this section a defined name with which it can be uniquely referenced in\
    \ the following ServerLayout section. The lines Device and Monitor specify the\
    \ graphics card and the monitor that belong to this definition. These are just\
    \ links to the Device and Monitor sections with their corresponding names or “identifiers”.\
    \ These sections are discussed later in more detail."
  merge: -1
  img_proc: true
- pgno: 174
  md: 'Using `DefaultColorDepth`, select which color depth mode the server will use
    if this is not explicitly stated. There is a Display subsection for each color
    depth. `Depth` assigns the color depth valid for this subsection. Possible values
    for `Depth` are 8, 16, 24, and 32. Not every X server supports all these modes.
    For most cards, 24 and 32 are basically the same. Some take 24 for packed pixel
    24bpp mode, whereas others choose 32 for padded pixel mode.


    After the color depth, a list of resolutions is set (`Modes`). This list is checked
    by the server from left to right. For each resolution, a suitable `Modeline` is
    searched, which has to correspond to one of the given clock rates or a clock rate
    to program the card.


    The first resolution found is the Default mode. With `Ctrl` + `Alt` + `+` (on
    the number pad), switch to the next resolution in the list to the right. With
    `Ctrl` + `Alt` + `−` (on the number pad), switch to the left. This enables you
    to vary the resolution while X is running.


    The last line of the Display subsection with Depth 16 refers to the size of the
    virtual screen. The maximum possible size of a virtual screen depends on the amount
    of memory installed on the graphics card and the desired color depth, not on the
    maximum resolution of the monitor. Since modern graphics cards have a large amount
    of video memory, you can create very large virtual desktops. You should note,
    however, that you may no longer be able to use 3D functionality if you fill most
    of the video memory with a virtual desktop. If the card has 16 MB video RAM, for
    example, the virtual screen can be up to 4096x4096 pixels in size at 8-bit color
    depth. Especially for accelerated cards, however, it is not recommended to use
    up all your memory for the virtual screen, since this memory on the card is also
    used for several font and graphics caches.


    # Device Section


    A device section describes a specific graphics card. You can have as many device
    entries in `XF86Config` as you like, as long as their names are differentiated,
    using the keyword `Identifier`. As a rule — if you have more than one graphics
    card installed — the sections are simply numbered in order: the first one is called
    `Device[0]`, the second one `Device[1]`, and so on. In the following file, you
    can see the section from the Device section of a computer in which a Matrox Millennium
    PCI graphics card is installed.'
  merge: -1
  img_proc: true
- pgno: 175
  md: "```\nSection \"Device\"\n    BoardName       \"MGA2064W\"\n    BusID      \
    \     \"0:19:0\"\n    Driver          \"mga\"\n    Identifier      \"Device[0]\"\
    \n    VendorName      \"Matrox\"\n    Option          \"sw_cursor\"\nEndSection\n\
    ```\n\nIf you use SaX2 for configuring, the device section should look something\
    \ like the above diagram. Both the Driver and BusID are dependent on the hardware\
    \ installed in your computer and are detected by SaX2 automatically. The BusID\
    \ defines the PCI or AGP slot in which the graphics card is installed. This matches\
    \ the ID displayed by the command lspci. Note here that the X server wants details\
    \ in decimal form, but lspci displays these in hexadecimal form. Via the Driver\
    \ parameter, specify the driver to use for this graphics card. If the card is\
    \ a Matrox Millenium, the driver module is called mga. The X server then searches\
    \ through the ModulePath defined in the Files section in the drivers subdirectory.\
    \ In a standard installation, this is the directory /usr/X11R6/lib/modules/drivers.\
    \ For this purpose, simply _drv.o is added to the name, so, in the case of the\
    \ mga driver, the driver file mga_drv.o is loaded. The behavior of the X server\
    \ or of the driver can also be influenced through additional options. An example\
    \ of this is the option sw_cursor, which is set in the device section. This deactivates\
    \ the hardware mouse cursor and depicts the mouse cursor using software. Depending\
    \ on the driver module, there are various options available, which can be found\
    \ in the description files of the driver modules in the directory /usr/X11R6/lib/X11/doc.\
    \ Generally valid options can also be found in the man page for XF86Config (man\
    \ XF86Config) and the man page for XFree86 (man XFree86).\n\n# Monitor Section\n\
    \nMonitor sections each describe, in the same way as the device sections, one\
    \ monitor. The configuration file /etc/X11/XF86Config can again contain as many\
    \ Monitor sections as you want. The server layout section specifies which monitor\
    \ section is relevant. Monitor definitions should only be set by experienced users.\
    \ A critical part of the monitor section is the mode lines, which set horizontal\
    \ and vertical timings for the appropriate resolution. The monitor properties,\
    \ especially the allowed frequencies, are stored in the monitor section."
