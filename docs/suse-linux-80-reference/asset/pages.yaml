- pgno: 101
  md: '# Booting a PC


    After turning on your computer, the first thing that happens is that the BIOS
    (Basic Input Output System) takes control, initializes the screen and keyboard,
    and tests the main memory. Until this task is completed, no external devices or
    external storage media are known to the system.


    Once the basic system has finished its internal setup, it starts to verify the
    hardware around it. Date, time, and information about some of the most important
    external devices are read from the CMOS settings (usually referred to as the CMOS
    setup). After reading the CMOS, the BIOS should recognize the first hard disk,
    including details such as its geometry. It can then start to load the operating
    system (OS) from there.


    To load the OS, the system loads a 512-byte data segment from the first hard disk
    into main memory and executes the code stored at the beginning of this segment.
    The instructions contained there determine the rest of the boot process. This
    is the reason why the first 512 bytes of the hard disk are often called the *Master
    Boot Record* (MBR).


    Although the whole process is rather complicated and this description is oversimplified,
    it should be clear that, up to this point (loading the MBR), the boot sequence
    is independent of the installed operating system and is identical on all PCs.
    Also, all the PC has to access peripheral hardware is those routines (drivers)
    stored in the BIOS.


    # Master Boot Record


    The layout of the MBR has been certified by an independent convention. The first
    446 bytes are reserved for program code. The next 64 bytes offer space for a partition
    table for up to four partitions. See Section *Partitioning Tips* on page 49 and
    Section *Partitioning for Experts* on page 50. Without the partition table, it
    would not be possible to create file systems (called drives under MS-DOS) on the
    hard disk — the disk would be virtually useless without the table. The last two
    bytes have to contain a special “magic number” (AA55). Any MBR that replaces this
    number with a different number is rejected.'
  merge: -1
  img_proc: true
- pgno: 102
  md: '# ## Boot Sectors


    Boot sectors are the first sectors on a hard disk partition, except for the extended
    partition that serves as a “container” for other partitions. They offer 512 bytes
    of space and are designed to contain code able to launch an operating system on
    this partition. Boot sectors of formatted DOS, Windows, and OS/2 partitions do
    exactly that. In contrast, Linux boot partitions are empty at the very start.
    A partition cannot be started directly, although it may contain a kernel and a
    valid root file system. A valid boot sector follows the conventions and enters
    the “magic number” of the MBR into the last two bytes.


    # ## Booting DOS or Windows 95/98


    The MBR contains information that determines which partition of a hard disk is
    “active” — which partition should be searched for the operating system to boot.
    Therefore, DOS has to be installed on the first hard disk. The executable code
    in the MBR (“first stage boot loader”) starts when the marked partition contains
    a valid boot sector.


    If this is the case, the “second stage boot loader” can be started from there.
    DOS system programs can now be loaded and you will see the usual DOS prompt. In
    DOS, only primary partitions can be marked active. Therefore, you cannot use logical
    partitions inside an extended partition as bootable DOS partitions.


    # # Boot Concepts


    The simplest boot concept affects only one machine with one operating system installed.
    A common PC configuration is DOS or Windows 95/98 as the only operating system
    installed. The boot sequence for this case has already been outlined.


    A similar concept can be used for Linux if it is the only operating system used.
    In this case, you could theoretically skip the installation of LILO. The big disadvantage
    of doing this is that you cannot pass additional parameters to the system kernel
    at boot time.


    As soon as there is more than one operating system installed, there are a number
    of new boot possibilities.


    **Booting another OS from a floppy disk:** One OS can be booted from the hard
    disk. Other operating systems can be booted using boot disks.


    +   - *Requirements:* the floppy drive must be bootable'
  merge: -1
