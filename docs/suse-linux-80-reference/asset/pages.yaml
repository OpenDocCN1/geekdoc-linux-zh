- pgno: 379
  md: '# DHCP


    # The DHCP Protocol


    The purpose of the “Dynamic Host Configuration Protocol” is to assign network
    settings centrally from a server rather than configuring them locally on each
    and every workstation. A client configured to use DHCP does not have control over
    its own static address. It is enabled to fully autoconfigure itself according
    to directions from the server.


    One way to use DHCP is to identify each client using the hardware address of its
    network card (which is fixed in most cases) then supply that client with identical
    settings each time it connects to the server. DHCP can also be configured so the
    server assigns addresses to each “interested” host dynamically from an address
    pool set up for that purpose. In the latter case, the DHCP server will try to
    assign the same address to the client each time it receives a request from it
    (even over longer periods). This, of course, will not work if there are more client
    hosts in the network than network addresses available.


    With these possibilities, DHCP can make life easier for system administrators
    in two ways. Any changes (even bigger ones) related to addresses and the network
    configuration in general can be implemented centrally by editing the server’s
    configuration file. This is much more convenient than reconfiguring lots of client
    machines. Also it is much easier to integrate machines, particularly new machines,
    into the network, as they can be given an IP address from the pool. Retrieving
    the appropriate network settings from a DHCP server can be especially useful in
    the case of laptops regularly used in different networks.


    A DHCP server not only supplies the IP address and the netmask, but also the host
    name, domain name, gateway, and name server addresses to be used by the client.
    In addition to that, DHCP allows for a number of other parameters to be configured
    in a centralized way, for example, a time server from which clients may poll the
    current time or even a print server.


    The following section gives an overview of DHCP without describing the service
    in every detail. In particular, we want to show how to use the DHCP server dhcpd
    in your own network to easily manage its entire setup from one central point.'
  merge: -1
  img_proc: true
- pgno: 380
  md: '# DHCP Software Packages


    SuSE Linux comes with three packages related to DHCP, all included in series n.
    The first of these is the DHCP server `dhcpd` distributed by the Internet Software
    Consortium, or ISC. This is the program that assigns and manages the corresponding
    information for the network. Normally with SuSE Linux, there is only this one
    program available as far as the server is concerned, but you can choose between
    two different DHCP client programs. SuSE Linux includes both the package `dhclient`,
    also from the ISC, and the “DHCP client daemon” provided by the package `dhcpd`.


    SuSE Linux installs `dhcpd` by default. The program is very easy to handle and
    will be launched automatically on each system boot to watch for a DHCP server.
    It does not need a configuration file to do its job and should work out of the
    box in most standard setups.


    If you administer a more complex network, you might need the ISC’s `dhclient`,
    which can be controlled via the configuration file `/etc/dhclient.conf`. No matter
    whether you want to include an additional domain in the search list or even to
    emulate the behavior of a Microsoft DHCP client — if you are knowledgeable about
    networks, you will find that the `dhclient` gives all the possibilities to make
    it function according to your needs, down to the last detail.


    # The DHCP Server dhcpd


    The core of any DHCP system is the *dynamic host configuration protocol daemon*.
    This server “leases” addresses and watches how they are used, according to the
    settings as defined in the configuration file `/etc/dhcpd.conf`. By changing the
    parameters and values in this file, a system administrator can influence the program’s
    behavior in numerous ways. Look at a basic sample `/etc/dhcpd.conf` file:'
  merge: -1
  img_proc: true
- pgno: 381
  md: "```\n```conf\ndefault-lease-time 600;        # 10 minutes\nmax-lease-time 7200;\
    \            # 2 hours\n\noption domain-name \"kosmos.all\";\noption domain-name-servers\
    \ 192.168.1.1, 192.168.1.2;\noption broadcast-address 192.168.1.255;\noption routers\
    \ 192.168.1.254;\noption subnet-mask 255.255.255.0;\n\nsubnet 192.168.1.0 netmask\
    \ 255.255.255.0\n{\n    range 192.168.1.10 192.168.1.20;\n    range 192.168.1.100\
    \ 192.168.1.200;\n}\n```\n```\n\n*File 57: The Configuration File /etc/dhcpd.conf*\n\
    \nThis simple configuration file should be sufficient to get the DHCP server to\
    \ assign IP addresses to the hosts of your network. One thing to remember, however,\
    \ is to include a semicolon (;) at the end of each line. Without that character,\
    \ dhcpd will not even start.\n\nAs you might have noticed, the above sample file\
    \ can be subdivided into three different sections. The first one defines how many\
    \ seconds an IP address is “leased” to a requesting host by default (default-lease-time)\
    \ before it should apply for renewal. The section also includes a statement on\
    \ the maximum period for which a machine may keep an IP address assigned by the\
    \ DHCP server without applying for renewal (max-lease-time).\n\nIn the second\
    \ part, some basic network parameters are defined on a global level:\n\n+   -\
    \ The line option `domain-name` defines the default domain of your network.\n\
    +   \n+   - With the entry option `domain-name-servers`, specify up to three values\
    \ for the DNS servers used to resolve IP addresses into host names (and vice versa).\
    \ Ideally, configure a name server on your own machine or somewhere else in your\
    \ network before setting up DHCP. That name server should also define a host name\
    \ for each dynamic address and vice versa. To learn how to configure your own\
    \ name server, read Section DNS — *Domain Name Service* on page 349.\n+   \n+\
    \   - The line option `broadcast-address` defines the broadcast address to be\
    \ used by the requesting host."
  merge: -1
  img_proc: true
- pgno: 382
  md: '+   - With option `routers`, tell the server where to send data packets that
    cannot be delivered to a host on the local network (according to the source and
    target host address and the subnet mask provided). In most cases, especially in
    smaller networks, this router will be identical with the Internet gateway.

    +   - With option `subnet-mask`, specify the netmask assigned to clients.


    The last section of the file is there to define a network, including a subnet
    mask. To finish, specify the address range that the DHCP daemon should use to
    assign IP addresses to interested clients. In our example, clients may be given
    any address between `192.168.1.10` and `192.168.1.20`, as well as `192.168.1.100`
    and `192.168.1.200`.


    After editing these few lines, you should be able to activate the DHCP daemon
    by issuing the command `rcdhcpd start`. The server is ready for use immediately
    after that. Do a basic check to see whether the configuration file is syntactically
    correct by entering the command `rcdhcpd syntax-check`. If you encounter any unexpected
    problems with your configuration — the server aborts with an error or does not
    return “done” on start — you should be able to find out what has gone wrong by
    looking for information either in the main system log `/var/log/messages` or on
    console 10 (Ctrl + Alt + F10).


    # Assigning Fixed IP Addresses to Hosts


    Now that the server is set up to assign dynamic addresses, it is time to have
    a closer look at static addresses and the way to configure them. As mentioned
    above, with DHCP it is also possible to assign a predefined, fixed address to
    one host each time the latter sends a request to the server. As might be expected,
    addresses assigned explicitly will always take priority over addresses from the
    pool of dynamic addresses. Furthermore, a static address will never expire in
    the way a dynamic address would, such as if there were not enough addresses available
    so the server needed to redistribute them among hosts.


    To identify a host configured to get a static address, the DHCP daemon fetches
    the hardware address of that host. This is a numerical code consisting of six
    octet pairs, fixed in most cases, and unique to each network device sold in the
    world, e.g., `00:00:45:12:EE:F4`.


    If the appropriate lines, like the ones in 58, are added to the configuration
    file 57 on page 369, the DHCP daemon will assign the same set of data to the corresponding
    host under all circumstances.'
  merge: -1
  img_proc: true
- pgno: 383
  md: "```\nhost earth {\n    hardware ethernet 00:00:45:12:EE:F4;\n    fixed-address\
    \ 192.168.1.21;\n}\n```\n\n# *File 58: Entry Added to the Configuration File*\n\
    \nThe structure of this entry should be almost self-explanatory: The first line\
    \ sets the DNS name of the newly defined host (host *host name*) and the second\
    \ one its MAC address. On any network-enabled Linux host, this address can be\
    \ determined very easily with the command *ifconfig* plus the network device,\
    \ for example, eth0. If the network card is not enabled, use the command *ifup\
    \ eth0* first. The output should contain something like *link/ether 00:00:45:12:EE:F4*.\n\
    \nIn the above example, a host with a network card having the MAC address *00:00:45:12:EE:F4*\
    \ is assigned the IP address *192.168.1.21* and the host name *earth* automatically.\n\
    \nThe type of hardware to enter is ethernet in nearly all cases, though token-ring,\
    \ which is often found on IBM systems, is also supported.\n\n# The Finer Points\n\
    \nAs stated at the beginning of this chapter, these pages are only intended to\
    \ provide a brief survey of what you can do with DHCP. For more information, the\
    \ page of the *Internet Software Consortium* on the subject (http://www.isc.org/products/DHCP/)\
    \ will prove a good source to read about the details of DHCP, including about\
    \ version 3 of the protocol, currently in beta testing. Apart from that, you can\
    \ always rely on the man pages for further help. Try man dhcpd, man dhcpd.conf,\
    \ man dhcpd.leases, and man dhcp-options. Also, several books about *Dynamic Host\
    \ Configuration Protocol* have been published over the years that take an in-depth\
    \ look at the topic.\n\nWith dhcpd, it is even possible to offer a file to a requesting\
    \ host, as defined with the parameter *filename*, and that this file may contain\
    \ a bootable Linux kernel. This allows you to build client hosts which do not\
    \ need a hard disk — they are enabled to load both their operating system and\
    \ their network data over the network (*diskless clients*), which could be an\
    \ interesting option for both cost and security reasons. Now add the package alice\
    \ to all this and you can do some really amazing things."
  merge: -1
  img_proc: true
- pgno: 384
  md: '# Samba


    With the program package Samba, convert any UNIX machine into a powerful file
    and print server for DOS, Windows, and OS/2 machines. The *Samba-Project* is run
    by the *Samba Team* and was originally developed by the Australian Andrew Tridgell.
    Since its beginnings in 1991, Samba has proven itself to be a stable and reliable
    product that has made its way into the business environment, serving as a supplement
    to or even a replacement for Windows NT servers. Samba has now become a fully-fledged
    and rather complex product. This section presents an overview. In `/usr/share/doc/packages/samba`,
    find many documents that will help build complex network solutions with Samba.
    Samba’s reference file, `/etc/samba/smb.conf`, has its own man page (`man smb.conf`).


    Samba uses the SMB protocol (Server Message Block) from the company Microsoft,
    based on the NetBIOS services. Due to pressure from the company IBM, Microsoft
    released the protocol so that other software manufacturers could establish connections
    to a Microsoft domain network. Samba sets the SMB protocol on top of the TCP/IP
    protocol so the TCP/IP protocol must also be installed on all clients.


    # NetBIOS


    NetBIOS is a software interface (API) designed for communication between machines.
    Here a “name service” is provided. It enables machines connected to the net to
    reserve names for themselves. After reservation, these machines can be addressed
    by their names. There is no central process that checks names. Any machine on
    the network can reserve as many names as it wants, provided the name is not already
    in use.


    The NetBIOS name can now be implemented for different network architectures. An
    implementation that works relatively closely with network hardware is called NetBEUI,
    but this is often referred to as NetBIOS. Network protocols implemented with NetBIOS
    are IPX from Novell (NetBIOS via TCP/IP) and TCP/IP.


    The NetBIOS names sent via TCP/IP have nothing in common with the names used in
    `/etc/hosts` or those defined by DNS. NetBIOS uses its own, completely independent
    naming convention. However, it is recommended to use names that correspond to
    DNS host names to make administration easier. This is the default used by Samba.'
  merge: -1
  img_proc: true
- pgno: 385
  md: '# Clients


    All standard operating systems, such as DOS, Windows, and OS/2, support the SMB
    protocol. The TCP/IP protocol must be installed on all computers. Samba can also
    be used with all the various UNIX “flavors”.


    SMB servers provide hardware space to their clients by means of shares. Here,
    a share includes a directory and its subdirectories. It is exported by means of
    a name and can be accessed by its name. Of course, the share name can be set to
    any name. It does not have to be the name of the export directory. A printer is
    also assigned a name. Clients can access the printer by its name.


    # Installation and Configuration of the Server


    First the package samba from series n should be installed. The SMB services are
    started when the computer is booted. The services can be started manually with
    rcsmb start. With rcsmb stop, the services can be stopped.


    The main configuration file of Samba is /etc/samba/smb.conf. Here the entire service
    is configured. It is divided into two separate sections. In the [global] section,
    the central and general settings are made. The second section is the [share] section.
    Here the directories are released on a user-dependent basis and the file and directory
    permissions are set. If a specific value from the [share] section should be made
    valid for all shares, this can be taken over into the [global] section, making
    it valid for all shares system-wide. This saves some work for the system administrator.
    To present a picture of the whole process, an example is displayed in in Files
    59 and 60 on page 376. An explanation of it is given afterwards.'
  merge: -1
  img_proc: true
- pgno: 386
