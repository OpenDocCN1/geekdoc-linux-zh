    +   - Check your backups of user and system files regularly. Consider that if
    you do not test whether the backup will work, it might actually be worthless.

    +   - Check your log files. Whenever possible, write a small script to search
    for suspicious entries. Admittedly, this is not exactly a trivial task. In the
