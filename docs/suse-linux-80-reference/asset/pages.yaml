- pgno: 103
  md: '+   - *Example:* install DOS or Windows 95/98 on the hard disk and boot Linux
    from a floppy disk

    +   - *Advantage:* skip the potentially tricky boot loader installation

    +   - *Disadvantage:* you have to ensure that you have working boot disks

    +   - It might be an advantage or disadvantage that your Linux is not capable
    of booting without a boot disk, depending on its use.


    **Boot chaining of additional systems:** The same OS is always booted. Others
    can be optionally started from within the first OS.


    +   - *Requirements:* adequate programs for chain booting of operating systems
    must be available

    +   - *Example:* loading Linux from DOS using loadlin or starting a NetWare server
    from DOS with server.exe


    **Installing a boot manager:** Theoretically, this allows you to use an arbitrary
    number of operating systems on a single machine. The choice of systems is done
    at boot time. Changing operating systems requires a reboot.


    +   - *Requirements:* the boot manager must work smoothly with all installed operating
    systems

    +   - *Examples* of coexisting boot managers (at least under certain circumstances,
    see Section *OS/2 and Linux* on page 110) are OS/2 and the DOS boot loader boot.sys


    The following section describes the installation and configuration of a boot manager,
    using the Linux boot manager LILO. A complete description of LILO’s features can
    be found in [Alm94]. This reference can be located and printed by entering


    ```

    earth:/usr/share/doc/packages/lilo # lpr user.dvi

    ```


    This is followed by a description of loadlin.'
