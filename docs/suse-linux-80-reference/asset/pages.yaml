- pgno: 223
  md: "# Gamma correction\n\nTo modify the brightness range of the colors, create\
    \ the files `/etc/lpdfilter/test/cmyk.ps` and `/etc/lpdfilter/test/rgb.ps` as\
    \ follows:\n\n```\n```postscript\n%!PS\ncyan exp magenta exp yellow exp black\
    \ exp setcolortransfer\n```\n```\n\n*File 26: /etc/lpdfilter/test/cmyk.ps: CMYK\
    \ Gamma Correction*\n\n```\n```postscript\n%!PS\nred exp green exp blue exp currenttransfer\
    \ setcolortransfer\n```\n```\n\n*File 27: /etc/lpdfilter/test/rgb.ps: RGB Gamma\
    \ Correction*\n\nThe color model (CMYK or RGB) must be compatible to your printer.\
    \ The values set for cyan, magenta, yellow, black, red, green and blue must be\
    \ between 0.001 and 0.999.\n\nYou can get an overall impression of how the above\
    \ files will take affect in the graphical interface using the following commands\
    \ (without gamma correction):\n\n```\n```shell\nearth:  # gs -r60 \\\n    /usr/share/doc/packages/ghostscript/examples/colorcir.ps\n\
    ```\n```\n\n(with gamma correction, any one of these following examples):\n\n\
    ```\n```shell\nearth:  # gs -r60 /etc/lpdfilter/test/cmyk.ps \\\n    /usr/share/doc/packages/ghostscript/examples/colorcir.ps\n\
    \nearth:  # gs -r60 /etc/lpdfilter/test/rgb.ps \\\n    /usr/share/doc/packages/ghostscript/examples/colorcir.ps\n\
    ```\n```\n\nExit with `Ctrl` + `C`.\n\n# Resetting the printer\n\nTo restore basic\
    \ printer settings, create the file `/etc/lpdfilter/test/reset.ps` as follows:\n\
    \n```\n```postscript\n%!PS\nserverdict begin 0 exitserver\n```\n```\n\n*File 28:\
    \ /etc/lpdfilter/test/reset.ps: Reseting the Printer*\n\nTo activate a PostScript\
    \ preload file, create the script `/etc/lpdfilter/test/pre` as follows:"
  merge: -1
  img_proc: true
- pgno: 224
  md: "```\n```bash\n#!/bin/bash\ncat /etc/lpdfilter/test/preload.ps -\n```\n```\n\
    \n*File 29: /etc/lpdfilter/test/pre: Loading PostScript Preload*\n\nReplace preload\
    \ with the actual preload file name. The script must be executable and readable\
    \ for all users, which is accomplished with chmod:\n\n```\nearth:  # chmod -v\
    \ a+rx /etc/lpdfilter/test/pre\nearth:  # chmod -v a+r /etc/lpdfilter/test/preload.ps\n\
    ```\n\nThe same mechanism can also be used to send a PostScript file to the printer\
    \ after the actual PostScript print data. To restore the original settings of\
    \ a printer after a print job is completed, create the script /etc/lpdfilter/test/pre\
    \ as follows:\n\n```\n```bash\n#!/bin/bash\ncat /etc/lpdfilter/test/preload.ps\
    \ - /etc/lpdfilter/test/reset.ps\n```\n```\n\n*File 30: /etc/lpdfilter/test/pre:\
    \ PostScript Preload and PostScript Reset*\n\n# Example for Configuring a GDI\
    \ Printer\n\nGDI printers cannot usually be used in Linux. See Section *GDI Printers*\
    \ on page 192.\nHowever, special driver applications exist for some GDI printers.\
    \ These driver applications usually supplement Ghostscript by converting the Ghostscript\
    \ output to a printer-specific format. Such driver applications often only allow\
    \ for limited print options, such as black-and-white only.\nGhostscript and the\
    \ driver application thus work together as described in the following (see also\
    \ Section *A Little About Ghostscript* on page 215):\n\n+   1. Ghostscript resolves\
    \ the PostScript data into a matrix containing individual pixels. The matrix data\
    \ is then relayed to the appropriate Ghostscript driver in suitable format and\
    \ resolution.\n+   \n+   2. The matrix data is then converted to the printer-specific\
    \ format by the driver application."
  merge: -1
  img_proc: true
- pgno: 225
  md: "In the following, it is assumed that a driver application for the printer exists\
    \ for the SuSE Linux version you have or that it can be downloaded from the Internet.\
    \ It is also assumed that this driver application functions as described above\
    \ and that you are familiar with working with Unix sources (e.g. with `.zip` and\
    \ `.tar.gz` archives, as well as `.rpm` packages). For more information, see also\
    \ Section *RPM — the Distribution Package Manager* on page 69. After decompressing\
    \ such an archive, you will typically find installation tips in README or INSTALL\
    \ files or in a subdirectory labeled doc. In the case of the `.tar.gz` archives,\
    \ the actual driver application most often has to be compiled and installed.\n\
    \nThe following also runs on the assumptions that the driver application exists\
    \ in `/usr/local/bin/printerdriver`, the Ghostscript driver `pbmraw` with a resolution\
    \ of 600 dpi is required, and that the printer is connected to the first parallel\
    \ port `/dev/lp0`. The Ghostscript driver and resolution actually required are\
    \ ultimately specified in the documentation for the particular driver application.\n\
    \nFirst, the gdi queue is created with lprsetup (as user root):\n\n```\n```sh\n\
    earth:  # lprsetup -add gdi -lprng --device /dev/lp0 \\\n        --driver pbmraw\
    \ --dpi 600 --size a4dj --auto --sf\n```\n```\n\nThe command must now be entered\
    \ in one line without backslash (`\\`). Create the script `/etc/lpd/filter/gdi/post`\
    \ as follows:\n\n```\n```bash\n#!/bin/bash\n/usr/local/bin/printerdriver {driver-specific_parameters}\n\
    ```\n```\n\n*File 31: `/etc/lpd/filter/gdi/post`: Running the Driver Application*\n\
    \nYou may need to enter the appropriate (driver-specific_parameters). The driver-specific\
    \ parameters required are specified in the documentation for the driver application.\n\
    \nThe script must be made executable for all users. Then, restart the printer\
    \ spooler:\n\n```\n```sh\nearth:  # chmod a+rx /etc/lpd/filter/gdi/post\nearth:\
    \  # rclpd stop\nearth:  # rclpd start\n```\n```\n\nNow, all users can print by\
    \ giving the following command:\n\n```\n```sh\nnewbie@earth:  > lpc -Pgdi filename\n\
    ```\n```"
  merge: -1
  img_proc: true
- pgno: 226
  md: '# Print Filter Troubleshooting


    The correct debugging level is activated by removing the comment sign\n# in front
    of the respective line in the main print filter script `/usr/lib/\nlpdfilter/bin/if`.


    ```

    ```\n# DEBUG="off"\n# DEBUG="low"\nDEBUG="medium"\n# DEBUG="high"\n```

    ```


    *File 32: /usr/lib/lpdfilter/bin/if: Debugging Level*


    For DEBUG="low", only the stderr output of `/usr/lib/lpdfilter/bin/if`\nwill be
    saved to a file `/tmp/lpdfilter.if-$$.XXXXXX` ($$ is replaced by the\nprocess
    number and XXXXXX by an arbitrary or unique string).


    For DEBUG="medium", the stderr output of the scripts in `/usr/lib/\nlpdfilter/filter/`,
    which are invoked by `/usr/lib/lpdfilter/bin/if`,\nwill be saved to file with
    the format of `/tmp/lpdfilter.name-$$.XXXXXX`\n(replace name with the name of
    the script to run and `$$.XXXXXX`, as described\nabove).


    For DEBUG="high", the output will not be sent to the printer, but to a file in\nthe
    format of `/tmp/lpdfilter.out-$$.XXXXXX` ($$.XXXXXX is substituted as\ndescribed
    above).


    These files should be deleted each time before performing any more tests by\nentering
    `rm -v /tmp/lpdfilter*`.


    # A Little About Ghostscript


    Ghostscript accepts PostScript and PDF data as input and contains numerous\nGhostscript
    drivers, known as devices in Ghostscript, for converting to other\nformats. The
    Ghostscript conversion takes place in two steps:


    +   1. The PostScript data is converted to a matrix. The image described by the\n   PostScript
    language is resolved into a fine matrix pattern of individual pix-\n   els. This
    process takes place independently of the respective Ghostscript\n   driver. The
    finer the matrix (the higher the resolution), the higher the out-\n   put quality,
    but also the more processor and memory consumption, since\n   the number of dots
    in the matrix quadruples when the resolution is dou-\n   bled.


    +   2. Finally, the image resolved to a dot matrix is now converted to the desired\n   format,
    the desired printer language.'
  merge: -1
  img_proc: true
- pgno: 227
  md: "Ghostscript not only provides printer drivers, but can also process PostScript\
    \ files for screen output (see Section *Printing from Applications in the Basics\
    \ manual) or even convert it to PDF. Use the gv program (package gv) to easily\
    \ view the output of PostScript files on the screen in a graphical user interface\
    \ for Ghostscript.\n\nGhostscript is a very sophisticated application with numerous\
    \ command-line options. As well as the man page for gs (man gs) and the list of\
    \ Ghostscript drivers, the most essential documentation can be found in /usr/share/doc/packages/ghostscript/catalog.devices\
    \ and\nfile:/usr/share/doc/packages/ghostscript/doc/index.html\nfile:/usr/share/doc/packages/ghostscript/doc/use.htm\n\
    file:/usr/share/doc/packages/ghostscript/doc/Devices.htm\nfile:/usr/share/doc/packages/ghostscript/doc/hpdj/gs-hpdj.txt\n\
    file:/usr/share/doc/packages/ghostscript/doc/hpijs/hpijs_readme.html\nfile:/usr/share/doc/packages/ghostscript/doc/stp/README\n\
    If started directly, Ghostscript opens a dialog with its own prompt GS>. Exit\
    \ it with quit.\n\nThe help command gs -h lists the most important options and\
    \ outputs the current list of devices. If a single driver supports several models,\
    \ only basic driver descriptions such as uniprint and stp will appear. The parameter\
    \ files for uniprint and the stp models are listed in more detail in /usr/share/doc/packages/ghostscript/catalog.devices\n\
    \n# Examples for Working with Ghostscript\n\nIn /usr/share/doc/packages/ghostscript/examples,\
    \ find PostScript sample files. The “colorcir” is good for printer tests (file:/usr/share/doc/packages/ghostscript/examples/colorcir.ps).\n\
    \n# X11 Output\n\nIn X, the graphical interface, view a PostScript file on the\
    \ screen with the gs command:\n\n```\nnewbie@earth:  > gs -r60 \\\n    /usr/share/doc/packages/ghostscript/examples/colorcir.ps\n\
    ```\n\nThe resolution is specified with the option -r, which must be compatible\
    \ with the output device (printer or screen). Try it with -r30, for example. To\
    \ quit the program, press (Ctrl) + (C) in the terminal from which gs was started."
  merge: -1
  img_proc: true
- pgno: 228
  md: "# Conversion to PCL5e or PCL6\n\nA PostScript file is converted to the printer-specific\
    \ format for a PCL5e or PCL6 printer with the command\n\n```\n```text\nnewbie@earth:~\
    \ > gs -q -dNOPAUSE -dSAFER -sOutputFile=/tmp/out.prn \\\\\n    -sDEVICE=ljet3\
    \ -r300x300 \\\n    /usr/share/doc/packages/ghostscript/colorcir.ps quit.ps\n\
    ```\n```\n\nwhere the command is given in a single line without backslash ('\\\
    \\'). The assumption is also made that the file /tmp/out.prn does not exist yet.\n\
    \n# Conversion to PCL3\n\nA PostScript file is converted to the printer-specific\
    \ format for a PCL3 printer with the following commands:\n\n```\n```text\nnewbie@earth:~\
    \ > gs -q -dNOPAUSE -dSAFER -sOutputFile=/tmp/out.prn \\\\\n    -sDEVICE=hpdj\
    \ -r300x300 \\\n    -sModel=500 -sColorMode=mono -dCompressionMethod=0 \\\n  \
    \  /usr/share/doc/packages/ghostscript/examples/colorcir.ps \\\\\n    quit.ps\n\
    ```\n```\n\n```\n```text\nnewbie@earth:~ > gs -q -dNOPAUSE -dSAFER -sOutputFile=/tmp/out.prn\
    \ \\\\\n    -sDEVICE=cdj300 -r300x300 \\\n    /usr/share/doc/packages/ghostscript/examples/colorcir.ps\
    \ \\\\\n    quit.ps\n```\n```\n\n```\n```text\nnewbie@earth:~ > gs -q -dNOPAUSE\
    \ -dSAFER -sOutputFile=/tmp/out.prn \\\\\n    -sDEVICE=cdj500 -r300x300 \\\n \
    \   /usr/share/doc/packages/ghostscript/examples/colorcir.ps \\\\\n    quit.ps\n\
    ```\n```\n\n```\n```text\nnewbie@earth:~ > gs -q -dNOPAUSE -dSAFER -sOutputFile=/tmp/out.prn\
    \ \\\\\n    -sDEVICE=cdj550 -r300x300 \\\n    /usr/share/doc/packages/ghostscript/examples/colorcir.ps\
    \ \\\\\n    quit.ps\n```\n```\n\n(Enter each command as a single line and disregard\
    \ the '\\\\'.)\n\n# Conversion to ESC/P, ESC/P2 or ESC/P Dot-Matrix\n\nA PostScript\
    \ file is converted to the printer-specific format for ESC/P2, ESC/P or ESC/P\
    \ dot matrix printers with the commands\n\n```\n```text\nnewbie@earth:~ > gs -q\
    \ -dNOPAUSE -dSAFER -sOutputFile=/tmp/out.prn \\\\\n    @stcany.upp \\\\\n   \
    \ /usr/share/doc/packages/ghostscript/examples/colorcir.ps \\\\\n    quit.ps\n\
    ```\n```"
  merge: -1
  img_proc: true
- pgno: 229
  md: "```\nquit.ps\n\nnewbie@earth:~ > gs -q -dNOPAUSE -dSAFER -sOutputFile=/tmp/out.prn\
    \ \\\\\n    -sDEVICE=cr360x360 \\\\\n    -dBitsPerPixel=1 -dDithering=gsmono -dNoWeave\
    \ \\\\\n    -sOutputCode=plain \\\\\n    /usr/share/doc/packages/ghostscript/examples/colorcir.ps\
    \ \\\\\n    quit.ps\n```\n\nHere, see the difference in the commands when using\
    \ a parameter file for the uniprint driver or for another Ghostscript driver.\
    \ Since all driver-specific parameters are located in the uniprint parameter file,\
    \ it is not necessary to specify any other driver-specific parameters, unlike\
    \ other Ghostscript drivers.\n\n# Direct Printer Output\n\nFollowing each of the\
    \ commands listed above, the printer-specific data is in `/tmp/out.prn`. These\
    \ can now be sent straight to the printer with the following root command (without\
    \ spooler or filter), as long as the printer is connected to the first parallel\
    \ port `/dev/lp0`:\n\n```\nearth: # cat /tmp/out.prn >/dev/lp0\n```\n\n# A Little\
    \ About a2ps\n\nBefore printing an ASCII text file with Ghostscript, it must be\
    \ converted to PostScript, since Ghostscript expects PostScript as input. a2ps\
    \ (package a2ps) is used for this purpose. a2ps is a powerful tool for producing\
    \ high-quality PostScript output from simple text. It is a very sophisticated\
    \ program with numerous command-line options. The most important documentation\
    \ can be found in the man page for a2ps (man a2ps).\n\n# Examples for Working\
    \ with a2ps\n\n# Direct Printer Output of a Text File with a2ps\n\nThe following\
    \ command can be used to convert a text file with a2ps to PostScript so two pages\
    \ are reduced to fit on one:\n\n```\nnewbie@earth:~ > a2ps -2 --medium=A4dd -o=output=/tmp/out.ps\
    \ textfile\n```\n\nTo examine the output of a2ps in the graphical interface, enter\n\
    \n```\nnewbie@earth:~ > gs -r60 /tmp/out.ps\n```"
  merge: -1
  img_proc: true
- pgno: 230
  md: "You may have to scroll the pages in the terminal window where you entered `gs`\
    \ with `↵`. Exit with `Ctrl` + `C`.\n\nThe output of a2ps can be converted to\
    \ the printer-specific format with\n\n```\nnewbie@earth:~> gs -q -dNOPAUSE -dSAFER\
    \ -sOutputFile=/tmp/out.prn \\\n    {driver-parameter} \\\n    /tmp/out.ps quit.ps\n\
    ```\n\nwhere the `{driver-parameter}` is to be specified as described in the previous\
    \ section.\n\nThe output of Ghostscript can be sent straight to the printer (without\
    \ spooler or filter) as root with\n\n```\nearth:  # cat /tmp/out.prn >/dev/lp0\n\
    ```\n\nas long as the printer is connected to the first parallel port /dev/lp0.\n\
    \n# Printing Business Cards\n\nTo demonstrate all the options a2ps has to offer,\
    \ we will introduce how to print business cards. Create a business card as a simple\
    \ text file called\n\n```\nTitle FirstName LastName\nStreet\nPostal/Zip Code City\n\
    E-mail: user@domain\nPhone: area-number-extension\n```\n\n*File 33: card: A Business\
    \ Card*\n\nAdd the ASCII character `\\f` to trigger a formfeed, so each business\
    \ card is treated as a single page.\n\n```\nnewbie@earth:~> echo -en \"\\f\" »card\n\
    ```\n\nReproduce this page to ten pieces in a file cards:\n\n```\nnewbie@earth:~\
    \ > for i in $(seq 1 10) ; do cat card »cards ; done\n```\n\nDefine the longest\
    \ line in cards:\n\n```\nnewbie@earth:~> cat cards | wc -L\n```\n\nConvert the\
    \ file cards to PostScript so that all ten business cards appear in two columns\
    \ of five, each surrounded by a border, with a maximum width according to the\
    \ longest line, and without additional headers or footers:\n\n```\nnewbie@earth:~>\
    \ a2ps -i -j --medium=a4dj -columns=2 -rows=5 \\\n    --no-header --chars-per-line=number\
    \ --output=cards.ps cards\n```"
  merge: -1
  img_proc: true
- pgno: 231
  md: "Give the command in a single line, disregarding the backslash (`\\\\`) and\
    \ replacing number with the number shown in the output of the `cat cards | wc\
    \ -L` command.\n\nAfter testing the results on the screen by entering `gs -r60\
    \ cards.ps` you can print them as described above or with the `lpr` command using\
    \ the print system (`lpr cards.ps`).\n\n# ASCII Text Encoding\n\nBasic information\
    \ for encoding ASCII text can be found in the Basics manual in the YaST2, Printers,\
    \ Manual Configuration chapter. A summary with some additional information follows.\n\
    \nIn simple text, every character is encoded as a certain number. The character\
    \ for each code is defined in the code table. The codes may be displayed differently\
    \ on the screen and in the printer, depending on which code a particular application\
    \ uses.\n\nISO-8859-1 (or Latin 1) is the encoding for Western European languages\
    \ and ISO-8859-2 (or Latin 2) is the encoding for Central and Eastern European\
    \ languages. So, in ISO-8859-1, the code 241 (octal) corresponds to a reversed\
    \ exclamation point, while in ISO-8859-2, a large A with a ogonek. ISO-8859-15\
    \ is basically the same as ISO-8859-1 except for code 244 (octal), which produces\
    \ the Euro symbol.\n\n# Outline\n\nAll commands should be entered as a single\
    \ line, disregarding the backslash (`\\\\`).\n\nCreate an ASCII text sample file\
    \ with\n\n```\nnewbie@earth:  > echo -en \"\\\\rCode 241(octal): \\\\\n\\\\241\\\
    \\r\\\\nCode 244(octal): \\\\244\\\\r\\\\f\" >example\n```\n\nOpen three terminal\
    \ windows in the graphical interface with\n\n```\nnewbie@earth:  > xterm -fn -*-*-*-*-*-*-14-*-*-*-*-iso8859-1\
    \ \\\\\n    -title iso8859-1 &\nnewbie@earth:  > xterm -fn -*-*-*-*-*-*-14-*-*-*-*-iso8859-15\
    \ \\\\\n    -title iso8859-15 &\nnewbie@earth:  > xterm -fn -*-*-*-*-*-*-14-*-*-*-*-iso8859-2\
    \ \\\\\n    -title iso8859-2 &\n```"
  merge: -1
  img_proc: true
- pgno: 232
  md: "Display each sample file in its own terminal window with\n\n```\nnewbie@earth:\
    \ > cat example\n```\n\nIn the “iso8859-1” display: Code 241 as reversed exclamation\
