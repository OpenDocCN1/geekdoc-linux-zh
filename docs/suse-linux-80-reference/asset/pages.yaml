- pgno: 286
  md: '+   - `-c` maximum size of the core files

    +   - `-a` display of limits set


    *Table 11.1: `ulimit`: Setting Resources for the User*


    System-wide settings can be made in `/etc/profile`. There, creating core files
    must be enabled, needed by programmers for “debugging”. A normal user cannot increase
    the values specified in `/etc/profile` by the system administrator, but he can
    make special entries in his own `~/.bashrc`.


    ```

    ```sh

    # limits of physical memory:

    ulimit -m 98304


    # limits of virtual memory:

    ulimit -v 98304

    ```

    ```


    # *File 37: `ulimit`: Settings in `~/.bashrc`*


    Details of memory must be specified in KB. For more detailed information, take
    a look at the man page for bash.


    # The free Command


    The free command is somewhat misleading if your goal is to find out how much RAM
    is currently being used.


    The relevant information can be found in `/proc/meminfo`. These days, users, who
    have access to a modern operating system such as Linux, should not really have
    to worry much about memory. The concept of “available RAM” dates back to before
    the days of unified memory management. The slogan *free memory is bad memory*
    applies well to Linux. As a result, Linux has always made the effort to balance
    out caches without actually allowing free or unused memory.


    Basically, the kernel does not have direct knowledge of any applications or user
    data. Instead, it manages applications and user data in a “page cache”. If memory
    runs short, parts of it will be either written to the swap partition or to files,
    from which they can initially be read with the help of the `mmap` command (see
    the man page for `mmap` (man 2 mmap)).


    Furthermore, the kernel also controls other caches such as the “slab cache”, where
    the caches used for network access are stored. This may explain differences between
    the counters in `/proc/meminfo`. Most, but not all of them, can be accessed via
    `/proc/slabinfo`.'
  merge: -1
  img_proc: true
- pgno: 287
  md: '# The File /etc/resolv.conf


    The file /etc/resolv.conf will be updated by the script /sbin/modify_resolvconf
    exclusively, with no other program having permission to modify /etc/resolv.conf
    directly. Enforcing this rule is the only way to guarantee that the system''s
    network configuration and the relevant files are kept in a consistent state.


    # Booting with the Initial Ramdisk


    # Describing the Problem


    As soon as the Linux kernel has been booted and the root file system (/) mounted,
    programs can be run and further kernel modules can be integrated to provide additional
    functions.


    To mount the root file system, certain conditions must be met. The kernel needs
    the corresponding drivers to access the device on which the root file system is
    located (especially SCSI drivers). The kernel must also contain the code needed
    to read the file system (ext2, reiserfs, romfs, etc.). It is also conceivable
    that the root file system is already encrypted. In this case, a password is needed
    to mount the file system.


    If you just take a look at the problem of SCSI drivers, a number of different
    solutions are possible: the kernel could contain all imaginable drivers. This
    might be a problem because different drivers could conflict with each other. Also,
    the kernel will become very large because of this. Another possibility is to provide
    different kernels, each one containing just one or a few SCSI drivers. This method
    also has the problem that a large number of different kernels are required, a
    problem then increased by the differently optimized kernels (Pentium optimization,
    SMP).


    The idea of loading the SCSI driver as a module leads to the general question
    answered by the concept of an *initial ramdisk*: creating a way of being able
    to run user space programs even before the root file system is mounted.'
  merge: -1
  img_proc: true
- pgno: 288
  md: '# Concept of the Initial Ramdisk


    The initial ramdisk (also called “initdisk” or “initrd”) solves precisely the
    problems described above. The Linux kernel provides an option of having a small
    file system loaded to a RAM disk and running programs there before the actual
    root file system is mounted. The loading of initrd is taken over by the boot loader
    (LILO, loadlin, etc.). Boot loaders only need BIOS routines to load data from
    the boot medium. If the boot loader is able to load the kernel, it can also load
    the initial ramdisk. Special drivers are not required.


    # The Order of the Booting Process with initrd


    The boot loader loads the kernel and the initrd to memory and starts the kernel.
    The boot loader informs the kernel that an initrd exists and where it is located
    in memory.


    If the initrd is compressed (which is typically the case), the kernel depresses
    the initrd and mounts it as a temporary root file system. A program called linuxrc
    is started on this in the initrd. This program can now do all the things necessary
    to mount the proper root file system. As soon as linuxrc finishes, the temporary
    initrd is unmounted and the boot process continues as normal with the mounting
    of the proper root file system. Mounting the initrd and running linuxrc can be
    seen as a short interlude during a normal boot process.


    The kernel tries to remount initrd to the /initrd directly after the actual root
    partition is booted. If this fails because the mount point /initrd does not exist,
    for example, the kernel will attempt to unmount initrd. If this does not work,
    the system is fully functional, but the memory taken up by initrd can no longer
    be unlocked and thus will no longer be available.


    # linuxrc


    These are the only requirements for the program linuxrc in the initrd. It must
    have the special name linuxrc and it must be located in the root directory of
    the initrd. Apart from this, it only needs to be executable by the kernel. This
    means that linuxrc may be dynamically linked. In this case, the “shared libraries”
    in /lib must be completely available in initrd. linuxrc can also be a shell script.
    For this to work, a shell must exist in /bin. In short, initrd must contain a
    minimal Linux system that allows the program linuxrc to be run. When SuSE Linux
    is installed, a statically linked linuxrc is used to keep initrd as small as possible
    (space on boot disks is very limited). linuxrc is run with root permissions.'
  merge: -1
  img_proc: true
- pgno: 289
  md: '# The Real Root File System


    As soon as linuxrc terminates, initrd is unmounted and discarded, the boot process
    carries on as normal, and the kernel mounts the real file system. What is mounted
    as the root file system can be influenced by linuxrc. It just needs to mount the
    /proc file system and write the value of the real root file system in numerical
    form to /proc/sys/kernel/real-root-dev.


    # Boot Loaders


    Most boot loaders (above all, LILO, loadlin, and syslinux) can handle initrd.
    Individual boot loaders are given instructions on how to use initrd as follows:


    +   1. **LILO**


    Entering the following line in /etc/lilo.conf:


    ```

    initrd=/boot/initrd

    ```


    The file /boot/initrd is the initial ramdisk. It can be, but does not have to
    be, compressed.


    +   2. **loadlin.exe**


    run with:


    ```

    C:\> loadlin /kernelimage initrd=C:\loadlin\initrd (parameter)

    ```


    +   3. **syslinux**


    Entering the following line in syslinux.cfg:


    ```

    append initrd=initrd (further parameters)

    ```


    # Using initrd in SuSE


    # Installing the System


    The initrd has already been used for some time for the installation: here the
    user can load modules and make the entries necessary for an installation (above
    all, for the source medium). linuxrc then starts YaST, which carries out the installation.
    When YaST has finished, it tells the kernel where the root file system of the
    freshly installed system is located. linuxrc writes this value to /proc, terminates,
    and informs the kernel to continue booting into the newly installed system.'
  merge: -1
  img_proc: true
- pgno: 290
  md: 'For an installation of SuSE Linux, you are, from the very beginning, booting
    the system being installed. A real reboot after installation only takes place
    if the kernel does not match the modules installed in the system. Since SuSE Linux
    uses a kernel for uniprocessor systems during installation, a reboot is only necessary
    if an SMP kernel was installed in the system with the corresponding modules.


    # Booting the Installed System


    In the past, YaST has provided more than forty kernels for installing the system,
    with the only basic difference a specific SCSI driver. This was necessary to be
    able to mount the root file system after booting. Further drivers could then be
    loaded afterwards as modules. Because optimized kernels are now available, this
    concept is no longer feasible — by now, over one hundred kernel images would be
    needed.


    This is why an initrd is used now, even to start the system normally. The way
    it is used is similar to that for an installation. The linuxrc used here, however,
    is simply a shell script with the task of loading a given module. Typically, this
    is just one single module — the very SCSI driver which is needed to access the
    root file system.


    # Creating an initrd


    An initrd is created by means of the script mkinitrd (previously mk_initrd). In
    SuSE Linux, the modules to load are specified by the variable INITRD_MODULES in
    /etc/sysconfig/kernel. After installation, this variable is automatically occupied
    by the correct values (the installation linuxrc knows which modules were loaded).
    Here it should be mentioned that the modules were loaded in exactly the order
    in which they appear in INITRD_MODULES. This is especially important if a number
    of SCSI drivers are used, since otherwise the names of the hard disks would change.
    Strictly speaking, it would be sufficient just to load those drivers needed to
    access the root file system, because the automatic loading of additional SCSI
    drivers may cause problems (how should it be “triggered” if hard disks hang on
    the second SCSI adapter), we load all SCSI drivers needed at the installation
    by means of initrd.


    The current mkinitrd checks if a SCSI driver is needed for the root file system.
    If you run mkinitrd on a system where / is found on EIDE hard disks, an initrd
    is not needed as the kernel used for SuSE Linux already contains the EIDE driver.
    As there are more and more special EIDE controllers coming onto the market, in
    the future it will probably be necessary, in such cases, to use an initrd to boot
    the installed system.'
  merge: -1
  img_proc: true
- pgno: 291
  md: '> > **Note**

    > >

    > > Because the loading of the `initrd` with the boot loader runs in the same
    way as loading the kernel itself (LILO notices in its map file the location of
    the files), LILO must be reinstalled after every change in `initrd`. After every
    `mkinitrd`, a `lilo` is also necessary.


    # Possible Difficulties — Self-Compiled Kernels


    A self-compiled kernel can often lead to the following problem: out of habit,
    the SCSI driver is hard-linked to the kernel, but the existing `initrd` remains
    unchanged. When you boot, the following occurs. The kernel already contains the
    SCSI driver, so the hardware is detected. `initrd`, however, now tries to load
    the driver again as a module. With some SCSI drivers, especially with `aic7xxx`,
    this leads to the system blocking. Strictly speaking, this is a kernel error.
    An already existing driver should not be allowed to be loaded again as a module.
    The problem is already known from another context, however (serial drivers). There
    are several solutions to the problem: either configure the driver as a module
    (then it will be correctly loaded in the `initrd`) or remove the entry for `initrd`
    from the file `/etc/lilo.conf`. An equivalent to the latter solution is to remove
    the variable `INITRD_MODULES` from `run.mkinitrd`, which then realizes that no
    `initrd` is needed.


    # Prospects


    It is quite possible in the future that an `initrd` will be used for many more
    and much more sophisticated things than loading modules needed to access /.


    +   - High-end EIDE drivers

    +   - Root file system on RAID software (linuxrc sets up the md devices)

    +   - Root file system on the LVM

    +   - Root file system is encrypted (linuxrc asks for the password)

    +   - Root file system on a SCSI hard disk on a PCMCIA adapter.


    # For More Information


    ```

    ```text

    /usr/src/linux/Documentation/ramdisk.txt

    /usr/src/linux/Documentation/initrd.txt

    the man page for initrd (man 4 initrd)

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 292
  md: "# linuxrc\n\nlinuxrc is started during the boot of the kernel, usually as a\
