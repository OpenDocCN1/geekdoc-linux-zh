    for aliases. |

    | `ethers` | Ethernet addresses. |

    | `group` | For user groups, used by `getgrent(3)`. See also the man page for
    group. |

    | `hosts` | For host names and IP addresses, used by `gethostbyname(3)` and similar
    functions. |


    *Table 13.10: continued overleaf.*'
