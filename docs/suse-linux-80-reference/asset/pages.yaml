- pgno: 374
  md: "# # NIS — Network Information Service\n\nAs soon as multiple UNIX systems in\
    \ a network want to access common resources, you have to make sure, for example,\
    \ that all user and group identities are the same for all machines in that network.\
    \ The network should be transparent to the user: whatever machine a user uses,\
    \ he will always find himself in exactly the same environment. This is made possible\
    \ by means of NIS and NFS services. NFS distributes file systems over a network\
    \ and is discussed in Section NFS — Shared File Systems on page 365.\n\nNIS (Network\
    \ Information Service) is a database service that enables access to `/etc/passwd`,\
    \ `/etc/shadow`, and `/etc/group` across a network. NIS can be used for other,\
    \ more specialized tasks (such as for `/etc/hosts` or `/etc/services`).\n\n> >\
    \ **Note**\n> >\n> > The configuration of NIS is easiest in YaST2. Detailed configuration\
    \ instructions can be found in the YaST2 chapter of the *Basic* manual. If you\
    \ still want to custom configure your NIS, you can find the necessary information\
    \ below.\n\n# ## Manual Installation of an NIS Client\n\nSuSE Linux contains all\
    \ the packages needed to install an NIS client. Proceed as follows:\n\n+   - Set\
    \ the NIS domain in the file `/etc/defaultdomain`. The NIS domain name should\
    \ not be confused with the DNS domain name. They have nothing to do with one another.\n\
    +   \n+   - The NIS server is set via `/etc/yp.conf`:\n+   \n+     ```\n+    \
    \ ypserver 192.168.0.1\n+     ```\n+   \n+   - NIS utilizes RPC (Remote Procedure\
    \ Calls). Therefore, the RPC portmapper needs to be running. This server is started\
    \ by `/etc/init.d/portmap`.\n+   \n+   - Complete the entries in `/etc/passwd`\
    \ and `/etc/group`. For a request to be sent to the NIS server, after the local\
    \ files have been searched, a line beginning with a '+' has to be added to the\
    \ relevant files.\n\n¹ NIS is commonly referred to as YP. This comes from “yellow\
    \ pages,” the “yellow pages” on the net."
  merge: -1
  img_proc: true
- pgno: 375
  md: "+   - NIS allows you to set a multitude of other options in the file `/etc/sysconfig/ypbind`.\n\
    +   - The final step in activating the NIS server is to launch `ypbind`. This\
    \ is what actually starts the NIS client.\n+   - To activate your changes, either\
    \ restart your system or enter:\n+   \n+     ```\n+     earth:  # rcnetwork restart\n\
    +     earth:  # rcypbind restart\n+     ```\n\n# NIS Master and Slave Server\n\
    \nAn NIS Server needs package ypserver, series n, and a running portmap. If your\
    \ portmapper has the tcp-wrapper built in, make sure `/etc/hosts.allow` and `/etc/hosts.deny`\
    \ are set up correctly. NIS is mainly used for `/etc/passwd`, `/etc/shadow`, and\
    \ `/etc/group`, but `/etc/hosts` and `/etc/services` can also be shared over the\
    \ network. The client and the server machines need a common domain name. It does\
    \ not need to be a DNS domain name. Pick any name you like. Write the name into\
    \ the file `/etc/defaultdomain`."
  merge: -1
  img_proc: true
- pgno: 376
  md: '# # NFS — Shared File Systems


    As mentioned in Section *NIS — Network Information Service* on page 363, NFS (together
    with NIS) makes a network transparent to the user. With NFS, it is possible to
    distribute file systems over the network. It does not matter at which terminal
    a user is logged in. He will always find himself in the same environment.


    As with NIS, NFS is an asymmetric service. There are NFS servers and NFS clients.
    A machine can be both — it can supply file systems over the network (export) and
    mount file systems from other hosts (import). Generally, these are servers with
    a very large hard disk capacity, whose file systems are mounted by other clients.


    # ## Importing File Systems


    To import file systems from an NFS server, the only requirement is that the RPC
    portmapper is already running. Starting this server has already been covered in
    connection with NIS (see Section *Manual Installation of an NIS Client* on page
    363). If this is the case, other file systems can be mounted (as long as they
    are exported by the server) just as easily as local file systems using the program
    mount with the following syntax:


    ```

    mount -t nfs {host}:{remote path} {local path}

    ```


    If user directories from the machine sun, for example, should be imported, the
    following command can be used:


    ```

    earth:/ # mount -t nfs sun:/home /home

    ```


    # ## Exporting File Systems


    A machine that exports file systems is called an NFS server. On an NFS server,
    there are a few tools that need to be started:


    +   - RPC portmapper (*rpc.portmap*)

    +   - RPC mount daemon (*rpc.mountd*)

    +   - RPC NFS daemon (*rpc.nfsd*)


    These are started by the scripts /etc/init.d/portmap and /etc/init.d/nfsserver
    at boot. Starting the RPC portmapper was described in Section *Manual Installation
    of an NIS Client* on page 363. After these daemons have been started, the configuration
    file /etc/exports decides which directories should be exported to which machines.'
  merge: -1
  img_proc: true
- pgno: 377
  md: 'For each directory to export, one line is needed to specify which machines
    may access that directory with what permissions. All subdirectories of this directory
    will automatically be exported as well. All authorized machines are usually denoted
    with their full names (including domain name), but it is possible to use wildcards
    like ‘*’ or ‘?’. If no machine is specified here, any machine is allowed to import
    this file system with the given permissions.


    Permissions of the file system to export are denoted in brackets after the machine
    name. The most important options are:


    | Option | Description |

    |---|---|

    | `ro` | File system is exported with read-only permission (default). |

    | `rw` | File system is exported with read-write permission. |

    | `root_squash` | This makes sure that the user root of the given machine does
    not have root specific permissions on this file system. This is achieved by assigning
    user ID 65534 to users with user ID 0 (root). This user ID should be set to nobody.
    |

    | `no_root_squash` | Does not assign user ID 0 to user ID 65534 (default). |

    | `link_relative` | Converts absolute links (those beginning with `/`) to a sequence
    of `../`. This is only useful if the whole file system of a machine is mounted
    (default). |

    | `link_absolute` | Symbolic links remain untouched. |

    | `map_identity` | User IDs are exactly the same on both client and server (default).
    |

    | `map-daemon` | Client and server do not have matching user IDs. This tells nfsd
    to create a conversion table for user IDs. `ugidd` is required for this to work.
    |


    # Table 13.13: Permissions for Exported File Systems


    Your exports file might look like File 56.'
  merge: -1
  img_proc: true
