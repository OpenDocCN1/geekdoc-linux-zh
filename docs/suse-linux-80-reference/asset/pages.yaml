  md: "# Boot Disk with LILO\n\nCreate a more capable boot disk with a greeting prompt\
    \ and kernel parameters by transferring the complete LILO booting start machinery\
    \ onto the disk (see Section *The Components of LILO* on page 93). The disk needs\
    \ a file system for this purpose. The Minix file system is best suited for this.\n\
    \nTo do this, proceed as follows:\n\n+   - Create a Minix file system on a new\
    \ and empty floppy disk and mount the disk to, for example, `/mnt` with the commands.\n\
    +   \n+     ```text\n+     earth:  # /sbin/mkfs.minix -c /dev/fd0 1440\n+    \
    \ earth:  # /bin/mount /dev/fd0 /mnt\n+     ```\n+   \n+     If your floppy drive\
    \ supports higher capacities, you can try different values, such as `/dev/fd0u1722`\
    \ or `1722`.\n+   \n+   - Now copy your kernel files and the LILO file `/boot/boot.b`\
    \ to `/mnt`, for example, onto the floppy disk.\n+   \n+   - Optional: create\
    \ a message file `/mnt/message`.\n+   \n+   - Create a `lilo.conf` on `/mnt`.\
    \ — Specify the actual root partition instead of `Your_Root_Device`. See File\
    \ 6 for an example.\n\n```\n```text\n# LILO Configuration file bootdisk\n# Start\
    \ LILO global Section\nboot=/dev/fd0                 # Installation: Floppy\n\
