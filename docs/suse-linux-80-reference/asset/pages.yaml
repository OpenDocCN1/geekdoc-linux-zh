- pgno: 69
  md: '# Updating SuSE Linux


    Software tends to “grow” from version to version. Therefore, we recommend you
    first take a look at the available partition space with `df` before updating.
    If you suspect you are running short of disk space, secure your data before updating
    and repartition your system. There is no general rule of thumb regarding how much
    space each partition should have. Space requirements depend on your particular
    partitioning profile, the software you selected, and the version numbers of SuSE
    Linux 8.0.


    > > **Note**

    > >

    > > It is recommended that you read the README and, in DOS/Windows, README.DOS
    file on your CD. You will find notations there regarding any additional changes
    made *after* this manual went to print.


    # Preparations


    Before you begin your update, copy the old configuration files to a separate medium
    just to be on the safe side. Such media include streamers, removable disks, floppy
    drives, ZIP drives. This primarily applies to files stored in `/etc`. Also, review
    the configuration files in `/var/lib`. Furthermore, it cannot hurt to write the
    current user data in `/home` (the HOME directories) to a backup medium. Back up
    this data as system administrator `root`. Only `root` has read permission for
    all local files.


    Before starting your update, make note of the root partition. The command `df
    /` lists the device name of the root partition. According to the Output 2, the
    root partition to write down is `/dev/hda7`.


    ```

    Filesystem             Size  Used Avail Use% Mounted on

    /dev/hda1              1.9G  189M  1.7G  10% /

    /dev/hda3              3.0G  1.1G  1.7G  38% /

    /dev/hda5               15M  2.4M   12M  19% /boot

    shmfs                  141M     0  141M   0% /dev/shm

    ```


    *Output 2: List with df -h*


    The root partition can be recognized as the one mounted as `/`.'
  merge: -1
  img_proc: true
- pgno: 70
  md: '# Possible Problems


    # PostgreSQL


    Before updating PostgreSQL (package **postgres**), it is usually best to “dump”
    the databases. See the man page for **pg_dump** (man pg_dump). This is, of course,
    only necessary if you actually used PostgreSQL prior to your update.


    # Promise Controller


    The hard disk controller manufactured by Promise is currently found on high-end
    motherboards in numerous computer models, either as a pure IDE controller (for
    UDMA 100) or as an IDE-RAID controller. As of SuSE Linux 8.0, these controllers
    are directly supported by the kernel and treated as a standard controller for
    IDE hard disks. The additional kernel module **pdcraid** is required before you
    can acquire RAID functionality.


    For some updates, hard disks on the Promise Controller may be detected before
    disks on the standard IDE controller. If so, the system will no longer boot following
    a kernel update and usually exit with “Kernel panic: VFS: unable to mount root
    fs”. In this case, the kernel parameter **ide=reverse** must be passed when booting
    to reverse this disk detection process. See Section *The Start Screen* on page
    32. To apply this parameter universally when using YaST2, you must enter it in
    the boot configuration. See Chapter *YaST2, Boot Mode* in the [SuS02a] manual.


    > > **Caution**

    > >

    > > Only the controllers activated in the BIOS are detectable. In particular,
    subsequently activating or deactivating the controllers in the BIOS has a direct
    effect on the device names. Use caution or risk being unable to boot the system.


    # *Technical Explanation*


    The controller sequence depends on the motherboard. Each manufacturer wires its
    supplementary controllers differently. The SCSI shows this sequence. If the Promise
    Controller is listed before the standard IDE controller, the kernel parameter
    **ide=reverse** is required after updating. With the previous kernel (without
    direct Promise support), the controller was ignored so the standard IDE controller
    was detected first. The first disk was then **/dev/hda**. With the new kernel,
    the Promise Controller is detected immediately and its (up to four) disks are
    registered as **/dev/hda**, **/dev/hdb**, **/dev/hdc**, and **/dev/hdd**. The
    previous **/dev/hda** disk becomes **/dev/hde** so is no longer detectable in
    the boot process.'
  merge: -1
  img_proc: true
- pgno: 71
  md: '# ## Updating with YaST2


    Following the preparation procedure outlined in Section *Preparations* on page
    58, you can now boot.


    Boot the system as you did to install it originally then select “Update existing
    system” in YaST2 after confirming the language. YaST2 then tries to determine
    the available root partitions and which packages to update. In addition, you have
    the option of enhancing your system with important new software components.


    # ## Manual Update


    # ### Updating the Base System


    Since basic system components, such as libraries, must be exchanged when updating
    a base system, an update cannot be run from within a currently running Linux system.
    First, set up the update environment. This is normally done using the CD or DVD
    or with a custom boot disk. If you are carrying out manual modifications during
    the update or prefer to perform the entire update with “ncurses-ui” in YaST2 (text
    mode), follow the steps already described in detail in Section *Text-Based Installation
    with YaST2* on page 32. Below is a summary of this procedure.


    +   1. Immediately after booting the kernel from the “boot disk” or from the CD
    or DVD, linuxrc will automatically start.

    +   2. In linuxrc, specify the language and keyboard settings under ‘Settings’
    and click ‘OK’ to confirm each setting.

    +   3. You might need to load the required hardware and software drivers via ‘Kernel
    Modules’. See Section *linuxrc: The Basics* on page 33 for more details on how
    to proceed and *Loading Modules* on page 282 for a description of linuxrc.

    +   4. Go to the menu items ‘Start installation / System’ → ‘Start Installation/Update’
    to select the source medium (see on page 284).

    +   5. The installation environment is loaded from linuxrc then YaST2 started.


    In the YaST opening screen, select the item ‘Update existing system’ after YaST2
    has verified the language and hardware.


    Next, YaST attempts to determine the root partition. Select the root partition
    from the list (for example, /dev/sda3). YaST2 then read the “old” fstab on this
    partition. YaST will analyze the file systems specified there and mount them.
    Then, you can request a backup copy of the system files.'
  merge: -1
  img_proc: true
- pgno: 72
  md: "In the following dialog, either determine whether only the already-installed\
    \ software should be updated or whether important new software components should\
    \ be added to your system (“upgrade mode”). It is recommended to accept one of\
    \ the default selections (e.g., “Base System”).\n\nWarning dialog: Select ‘Yes’\
    \ to start the software installation.\n\nFirst, the RPM database is checked, then\
    \ the main system components are updated. YaST automatically creates backups of\
    \ files modified in the running system since the last installation. In addition,\
    \ old configuration files are backed up with the endings `.rpmorig` and `.rpmsave`\
