  md: "acl is the access control list that defines from which IP addresses access\
    \ can be made to the DNS server.\nThe directory entry specifies where the other\
    \ configuration files are located. `/var/lib/named/` is the default.\nThe process\
    \ ID of named is stored in the pid-file.\n`listen-on` Port defines the port from\
    \ which the name server receives requests.\nzone entries specify the configuration\
    \ files to which IP addresses and host names are assigned to one another. These\
    \ files will have to be set up in the next step in the `/var/lib/named/` directory.\n\
    The complete host table is entered in the `world.zone` file (see File 53). It\
    \ consists of the following:\n\n```\n```text\n$TTL 2D\n\nworld.cosmos. IN SOA\
    \        gateway    root.world.cosmos (\n                            2001040501\
    \ ; serial\n                            1D         ; refresh\n               \
    \             2H         ; retry\n                            1W         ; expiry\n\
    \                            2D )       ; minimum\n\n                        \
    \    IN NS      gateway\n                            IN MX      10 sun\n\ngateway\
    \     IN A           192.168.0.1\n            IN A           192.168.1.1\nsun\
    \         IN A           192.168.0.2\nmoon        IN A           192.168.0.3\n\
    earth       IN A           192.168.1.2\nmars        IN A           192.168.1.3\n\
    ```\n```\n\n# *File 53: The File /var/lib/named/world.zone*\n\nThe option `$TTL`\
    \ specifies the “time to live”. “SOA” stands for “start of authority” and introduces\
    \ the preset record: host name, e-mail address (where the “@” sign is replaced\
    \ with a “.”), serial number (date and double-digit version number), and TTL.\
    \ “NS” marks the name server. “A” signals that the IP addresses of the hosts will\
    \ follow in the domain. The name server “gateway” has two IP addresses, because\
    \ it belongs to two subnetworks.\nIn the next two zone files, the reverse lookup\
    \ takes place for both subnetworks. See the sample files 54 and 55 on the facing\
    \ page."
