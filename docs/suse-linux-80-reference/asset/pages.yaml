- pgno: 91
  md: '# Using YaST2 and Its Keyboard Functions


    Start YaST2 either over the KDE menu system or as root at the prompt by giving
    the command:


    ```

    earth:  # yast

    ```


    YaST2 can be operated using the mouse or keyboard. First and foremost, we will
    outline some tips for operating this tool using the key functions in the console.
    YaST can be essentially operated with the cursor and tab keys, as well as **Alt**
    + *(highlighted character in the menu)*. Use the cursor keys and **Page Up** and
    **Page Down**. The space bar allows you to select individual items in the lists.
    Your selection can be most often confirmed with **Enter** or **↵**. Use either
    **Esc** or ‘Cancel’ to exit menus, screens, or dialogs. Use **Tab** to jump between
    fields and buttons in Yes–No questions and in entry forms. With (**Alt** + **Tab**)
    or (**Shift** + **Tab**), you can go back to previous dialogs.


    > > **Note**

    > >

    > > If you are using YaST2 with ui-ncurses in an xterm, certain key functions
    may be interpreted by the particular window manager you are working with. If this
    is the case, it is best to use the graphical front-end, or to reconfigure or change
    your window manager.


    # The YaST2 Control Center


    After starting YaST2, the YaST2 Control Center will open. The left window panel
    is divided into the categories of ‘Hardware’, ‘Network/Basic’, ‘Advanced Network’,
    ‘Security & Users’, ‘Software’, ‘System’, and ‘Miscellaneous’. When clicking on
    an icon, the respective contents will be listed to the right. Configuration usually
    takes place in several steps. YaST2 guides you through all the dialogs with ‘Next’.
    A help text for each topic is shown in the left margin of this window, explaining
    the necessary entries. Once the required data is entered, complete the process
    in the last configuration dialog with ‘Finish’. Then, the configuration is saved.'
  merge: -1
  img_proc: true
- pgno: 92
  md: '![](img/a4b6c994843f3fbd688003f4cabfa48f_92_0.png)


    *Figure 5.1: YaST2 System Configuration and Administration*


    # Hardware


    New hardware must first be installed and connected according to the vendor’s instructions.
    Connect the external devices such as printer or modem and start the corresponding
    YaST2 module. The majority of conventional devices will automatically be recognized
    by YaST2, at which point, the technical information is displayed. If autodetection
    fails, YaST2 will present a device list (model, manufacturer, etc.) from which
    to select the appropriate device.


    Under ‘Hardware’, find the configuration tools needed for configuring the various
    devices. Refer to the hardware information for data pertaining to the hardware
    autodetected by YaST2. This is especially useful for support requests. The module
    for configuring the graphical interface (X11) should already be familiar from
    the installation. It can also be used in the YaST2 Control Center to connect another
    monitor to an already running system. The same is true for the mouse and keyboard.
    Finally, under ‘Hardware’, you can find modules for configuring printers, scanners
    and TV cards, as well as the partition. Descriptions of the different YaST2 tools
    can be found in the [SuSO2a].'
  merge: -1
  img_proc: true
- pgno: 93
  md: '# Network/Basic


    Under ‘Network/Basic’, YaST2 provides basic configuration tools to pave your way
    into the Internet: configuration of ADSL, T-DSL (in Germany), network card, ISDN,
    modem, host name, and DNS. Documentation for this is also located in the [SuS02a].


    # Network/Advanced


    For advanced Internet users and network administrators, there are modules for
    starting and stopping system services such as inetd, Sendmail (with expert configuration),
    NFS client and server, routing, expert networking, and NIS client. ‘Network for
    Experts’ offers the same functionality as ‘Network card configuration’ under ‘Network/Basic’,
    but you can still configure your modem and ISDN here.


    # Security and Users


    Here, YaST2 offers tools for simple user and group administration. The configuration
    module ‘System Security’ provides various preconfigured levels and expert setting
    options. Read more about this in the [SuS02a] manual.


    # Software


    To install or delete software, use this module. Use it to change the installation
    medium. Also, there are two update tools: one for the “normal” system update and
    one for the online update which runs over our FTP server. Information on this
    can be obtained in the “Configuration” manual.


    # Patch CD Update


    As opposed to the online update, the patches are not retrieved from the FTP server,
    but instead scanned from CD. This CD is available for “SuSE Linux Enterprise Server”
    customers. The advantage is that it goes a lot quicker with a CD.


    After the patch CD is inserted, all the patches stored on the CD will be read
    into and displayed in this YaST2 module screen. Select which one to install from
    the patch list. If you forgot to put the CD into the drive, a warning will appear.
    Then insert the CD and resume updating the patch CD.'
  merge: -1
  img_proc: true
- pgno: 94
