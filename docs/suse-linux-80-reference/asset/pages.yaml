- pgno: 249
  md: "# Drivers in the Kernel\n\nThere is a wide variety of PC hardware components.\
    \ To use this hardware properly, you need a “driver” with which the operating\
    \ system (in Linux, the “kernel”), can access this hardware. There are basically\
    \ two ways of integrating drivers into your system:\n\n+   1. The drivers can\
    \ be compiled directly into the kernel. Such a kernel (“in one piece”) is referred\
    \ to as a monolithic kernel. Some drivers are only available in this form, which\
    \ explains the need for monolithic kernels.\n+   \n+   2. Drivers can be loaded\
    \ into the kernel on demand. At this point, the kernel is referred to as a modularized\
    \ kernel. This has the advantage that only those drivers are loaded that are really\
    \ needed and the kernel thus contains nothing unnecessary. The SuSE boot disk\
    \ kernel makes use of modules to support most hardware configurations.\n\nRegardless\
    \ of whether the drivers are compiled directly into the kernel or loaded as modules,\
    \ a hardware component may still not be recognized by the kernel. If this is the\
    \ case, you have the option of specifying component attributes more exactly.\n\
    \n+   ▪ Specify the information regarding the exact hardware you have and how\
    \ it should be addressed (e.g., address range, interrupt, etc.). Sometimes, the\
    \ driver can find this out on its own. However, it is faster and safer to pass\
    \ the information to the kernel yourself.\n+   \n+   ▪ In problem scenarios, you\
    \ might be able to get your Linux system started using special kernel parameters.\n\
    \nFor monolithic kernels, these parameters must be given at the boot prompt or\
    \ by means of a boot loader. For this reason, the parameters are also called LILO\
    \ parameters, named after the time-honored loader for x86 architectures. Modular\
    \ drivers get their parameters via insmod or modprobe, which load the module itself\
    \ simultaneously.\n\nYou always have to give the parameters when you boot your\
    \ computer as the kernel does not learn. Later, after the installation, kernel\
    \ parameters can be set in the files /etc/lilo.conf or /etc/modules.conf, so that\
    \ LILO or modprobe can interpret them automatically.\n\nUnfortunately, the format\
    \ for parameters compiled directly into the kernel is different from that for\
    \ parameters that are loaded on demand. For this reason they are divided into\
    \ two different groups in the following pages. A few modules now have unified\
    \ parameters (e.g., CD-ROM drives), so the same parameters can be given whether\
    \ you are using modules or the boot prompt."
  merge: -1
  img_proc: true
- pgno: 250
  md: '# # Some Tips on Drivers and Parameters


    Before we present the list of parameters, here are some hints on recognizing hardware,
    adding parameters, and booting with the SuSE boot disk:


    +   - Most drivers can do an *autoprobing*, such as testing different standard
    addresses where this hardware is usually located. While autoprobing, a driver
    might initialize an address that does not belong to it. This can cause the machine
    to hang.

    +   - Some modules can be loaded successfully, even if their hardware is not installed.
    This applies mostly to 3Com network card drivers. You should try autoprobing first.
    Unused drivers can be easily removed. Hardware that is not automatically recognized
    must then be started using the appropriate parameters.

    +   - Finally, there are some hardware components that have more than one driver
    (e.g., NCR 53C810, Ulstrator). As far as we know, there is no significant difference
    between the two Ultrastor drivers. The BSD driver for NCR53C810 also supports
    other NCR53C8xx products (e.g., 53C875), whereas the old NCR driver is the only
    one that recognizes CD writers. Use the one that suits your needs.


    # ## The Parameters


    # ### Notations and Meanings


    The following is an alphabetical list of kernel parameters and the corresponding
    devices. The variables in Table 10.1 always have the same meanings.


    | Variable | Meaning |

    |---|---|

    | ⟨addr⟩ | hexadecimal port address (e.g., 0x300) |

    | ⟨irq⟩ | interrupt the device will use (e.g., 7) |

    | ⟨dma⟩ | DMA channel of the device (e.g., 1) |

    | ⟨Start address⟩ |  |

    | ⟨End address⟩ | hexadecimal memory allocation for shared memory |


    *Table 10.1: Frequently Used Variables for Kernel Parameters*'
  merge: -1
  img_proc: true
- pgno: 251
  md: 'We are mainly concerned with the parameters required for a successful installation,
    but there are other parameters intended for special purposes. Uppercase letters
    are significant.


    A complete introduction to possible kernel parameters can be found after installation
    in the `BootPrompt-HOWTO` in `/usr/share/doc/howto` and in the kernel sources
    in the file `/usr/src/linux/Documentation/kernel-parameters.txt`.


    # Kernel Parameters at the Boot Prompt


    The parameters listed in this section can only be passed to the kernel, for example,
    at the SYSLINUX prompt (boot disk included), at the LILO prompt, or with loadlin.


    If you plan to install one of these drivers as a module, look at the parameters
    in Section *modprobe Parameters* on page 255.


    > > **Note**

    > >

    > > All parameters must be entered directly one after another, separated by commas.
    There should be no spaces between the parameters.


    For example, to enter the parameters for aha1542 at the boot prompt, enter `linux
    aha1542=0x300`. Keep in mind that you always have to precede the parameters with
    the boot configuration’s name. On SuSE boot disks, this is the configuration with
    the name `linux`.


    # General boot parameters


    Certain parameters can be used to control the overall behavior of the Linux kernel.


    +   - *Reboot mode* (shutting down Linux)

    +     `reboot={mode}`

    +     Here, you have the following values for `{mode}`:


    | Variable | Values / Meaning |

    |---|---|

    | `warm` | warm reboot (no memory check) |

    | `cold` | cold reboot (with memory check) |

    | `bios` | BIOS reboot |

    | `hard` | CPU crash reboot (triple fault) |


    *Example:* `reboot=cold`


    This boots the machine after shutdown as if the reset button had been pressed.'
  merge: -1
  img_proc: true
- pgno: 252
  md: "+   - *Protecting memory segments (reserve)*  \n+     `reserve={start1},{range1},...,{startN},{rangeN}`\n\
    \nThis parameter allows you to reserve memory space for hardware that does not\
    \ respond to the autoprobe (and perhaps reacts by crashing).\n\nExample: A “sensitive”\
    \ network card can be protected from being auto-probed and initialized by entering\
    \ `reserve=0x330,32 ether=5,0x330,eth0`. In this example, the network card has\
    \ a 32-bit data bus which starts at address `0x330` and uses interrupt 5.\n\n\
    For a full description of network card parameters, see Section *Other devices*\
    \ on page 250.\n\n+   - *Pacing root partitions*  \n+     `root={partition}`\n\
    \n| Variable | Values / Meaning |\n|---|---|\n| `{partition}` | e.g. `/dev/hda1`,\
    \ `/dev/sdb5` |\n\nExample: `root=/dev/hda5`  \nThis boots the kernel and tries\
    \ to load the root partition from the first logical drive in the extended partition\
    \ to the first (E)IDE hard disk.\n\n+   - *Size of RAM (RAM)*  \n+     `mem={size}`\n\
    \nEnter the size of RAM in bytes, kilobytes (‘K’), or megabytes (‘M’). For 256\
    \ MB RAM, enter `mem=256M`.\n\nWhen using a Pentium clone, try `mem=nopentium`.\
    \ It might make it work.\n\nThe standard kernel included here for i386 and also\
    \ in older SMP systems supports up to 4 GB. The standard SMP kernel is configured\
    \ for 64 GB.\n\n+   - *Number of CPUs when using SMP*  \n+     `maxcpus={number}`\n\
    \nSet the maximum number of CPUs to `{number}` when using an SMP kernel.\n\nExample:\
    \  \n`maxcpus=1`\n\n+   - *Serial console*  \n+     `console={device},{options}`"
