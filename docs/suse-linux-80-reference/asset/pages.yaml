- pgno: 42
  md: '# # 3


    # # Special Installation Procedures


    SuSE Linux can be installed according to a number of local requirements. The various
    methods span from manual installation to fully automated installation. Tips for
    installing manually with text-based YaST2, using the various installation sources
    (CD-ROM, FTP, NFS), and using automated installation sources are presented in
    the following sections. This chapter concludes with installation troubleshooting
    and a tutorial on resolving problems if they arise.


    +   - Text-Based Installation with YaST2 ........................ 32

    +   - Starting SuSE Linux ........................................ 37

    +   - Special Installations ...................................... 41

    +   - Tips and Tricks ............................................. 43

    +   - Partitioning Tips ........................................... 49

    +   - Partitioning for Experts ................................... 50'
  merge: -1
  img_proc: true
- pgno: 43
  md: '# Text-Based Installation with YaST2


    # Background Information


    In addition to installation with the assistance of a graphical interface, SuSE
    Linux can also be installed with the help of the YaST2 text menus (console mode).
    All modules described in Chapter *Installation with YaST2* on page 5 are also
    available in this text mode. The text mode is especially useful if you do not
    need a graphical interface (e.g., for server systems) or if the graphics card
    is not supported by the X Window System.


    # The Start Screen


    Insert CD 1 into the drive and restart the computer. If the computer does not
    boot the CD, reset the boot sequence in the BIOS to CDROM, C, A.


    The start screen appears (Figure 2.1 on page 7). Select ‘Manual Installation’
    within ten seconds so YaST2 does not automatically start. Enter boot parameters
    in the boot options after manual, if your hardware requires such parameters. However,
    such parameters are usually not needed. To switch to text mode, select F2=Text,
    then press Enter.


    Now, a box will appear with the progress display "Loading Linux kernel". The kernel
    boots and linuxrc is started. The menu-driven linuxrc application waits for user
    entries.


    # Possible Problems


    +   - If your CD-ROM drive (ATAPI) crashes when booting the system, refer to Section
    *ATAPI CD-ROM Hangs While Reading* on page 46.

    +   - CD 1, which features an optimized kernel for Pentium processors, is not
    recognized as a boot medium. Try the “boot floppy” or CD 2. Refer to Sections
    *Booting from Disk (SYSLINUX)* on page 43 and *Booting with CD 2* on page 43.

    +   - For graphics cards, including FireGL 1, 2, and 3, the graphical mode does
    not boot (framebuffer). In this case, text-based installation is required.

    +   - Other booting problems can usually be circumvented via kernel parameters.
    Refer to Section *Kernel Parameters at the Boot Prompt* on page 240. The start
    option ‘Installation – Safe Settings’ is provided whenever DMA leads to difficulties.'
  merge: -1
  img_proc: true
- pgno: 44
  md: '# linuxrc: The Basics


    Make installation settings using linuxrc. If necessary, load drivers as kernel
    modules. Finally, linuxrc launches the YaST installation tool, starting the actual
    installation of the system software and other applications.


    Use ↑ or ↓ to choose menu items and ← or → to select a command, such as ‘Ok’ or
    ‘Cancel’. Run the command by pressing ↵.


    Thorough documentation of linuxrc can be found in Section *linuxrc* on page 281.


    # Settings


    The linuxrc application opens with language and keyboard selection options.


    ![](img/a4b6c994843f3fbd688003f4cabfa48f_44_0.png)


    *Figure 3.1: Language Selection*


    +   - Select the installation language (e.g., ‘English’) and confirm with ↵.

    +   - Next, select the keyboard layout (e.g., ‘English’).


    # Possible Problems


    linuxrc does not provide a selection for your preferred keyboard layout. If this
    is the case, select an alternative layout. Following the installation, use YaST
    later to switch to the exact layout.'
  merge: -1
  img_proc: true
- pgno: 45
  md: "# Main Menu in linuxrc\n\nNow, you will find yourself in the main menu in linuxrc\
    \ (Figure 3.2).\n\n![](img/a4b6c994843f3fbd688003f4cabfa48f_45_0.png)\n\n*Figure\
    \ 3.2: Main Menu in linuxrc*\n\nThe following options are offered here:\n\n+ \
    \  - **‘Settings’** Adjust the language, monitor, or keyboard here. This was configured\
    \ in the previous sections.\n+   - **‘System Information’** You will find quite\
    \ a bit of information about the hardware here, if this data was recognized by\
    \ the kernel and activated by the already loaded modules.\n+   - **‘Kernel Modules\
    \ (Hardware Drivers)’** You may need to launch hardware-compatible modules here.\
    \ These also include additional file systems to load (ReiserFS).\n+   \n+    \
    \ *As a rule, you do not need to use this menu item if your hard disks and CD-ROM\
    \ drive (ATAPI) are connected to an (E)IDE controller, as the (E)IDE support is\
    \ already built into the kernel.*\n+   - **‘Installation/System boot’** Continues\
    \ installation.\n+   - **‘Cancel/Reboot’** Cancel the installation.\n+   - **‘Power\
    \ off’** Shuts down the system and cuts off the power."
  merge: -1
  img_proc: true
- pgno: 46
  md: "# Integrating the Hardware Using Modules\n\nSelect loading of kernel modules\
    \ with ‘Kernel module’ only if you need support for SCSI or for PCMCIA or if you\
    \ do not have an ATAPI drive. At present, appropriate modules are also swapped\
    \ out as modules (e.g., IDE) or added (e.g., USB, FireWire, or file systems).\
    \ Read about how modules are loaded in Section Linux on page 281. In the following\
    \ submenu, choose which modules to load. Possible choices are:\n\n+   - **A SCSI\
    \ module** — if you have a SCSI hard disk or SCSI CD-ROM drive.\n+   - **A CD-ROM\
    \ module** — if your CD-ROM drive is *not* connected to the (E)IDE controller\
    \ or the SCSI controller.\n+   - **A network module** — if you want to install\
    \ via NFS or FTP, but this is not discussed here.\n+   - **One or more file systems**\
    \ — such as ReiserFS or ext3.\n\n> **Tip**\n> \n> If you cannot find any support\
    \ for your installation medium (proprietary CD-ROM drive, parallel port CD-ROM\
    \ drive, network cards, PCMCIA) among the standard modules, you may find what\
    \ you need on the modules floppy disk, which contains additional drivers. To do\
    \ this, go to the end of the list and select the item “— More modules —”. You\
    \ are then asked to insert the modules.\n\n# Starting installation\n\nSince you\
    \ have already selected ‘Installation/System boot’, you only need to press `↵`\
    \ to begin the installation.\n\nThe following items are available:\n\n+   - **‘Start\
    \ Installation/Update’** Prepare for an installation or an update of the existing\
    \ system.\n+   - **‘Boot Installed System’** You will probably need this item\
    \ later if you encounter problems when booting your system.\n+   - **‘Boot Rescue\
    \ System’** This option is currently only offered for X86-compatible systems.\n\
    +   - **‘Eject CD’** Eject CD electronically."
  merge: -1
  img_proc: true
- pgno: 47
  md: '![](img/a4b6c994843f3fbd688003f4cabfa48f_47_0.png)


    *Figure 3.3: linuxrc Installation Menu*


    To begin the installation, press `↵` to access the menu item ‘Start Installation/Update’.
    Then, choose the source medium. Usually, the cursor can be left at the default
    selection: ‘CD-ROM’.


    Now press `↵`. The installation environment will be loaded directly from the CD
    1.


    As soon as this procedure is completed, YaST2 starts in the text-based version
    (ncurses). The installation will then continue as described in [Sus02a], Chapter
    *Installation*, or here, in Chapter *Installation with YaST2* on page 5.


    # Possible Problems


    +   - The SCSI adapter is not detected:

    +     - Try loading a module for a compatible driver.

    +     - Use a kernel with the appropriate integrated SCSI driver. Create a boot
    floppy as described in Section *Creating a Boot Disk in DOS* on page 44.

    +   - The ATAPI CD-ROM drive hangs when reading the data: see Section *ATAPI CD-ROM
    Hangs While Reading* on page 46.

    +   - For reasons still unknown, sometimes problems occur when loading data to
    the RAM disk so that YaST2 cannot be started.'
  merge: -1
  img_proc: true
- pgno: 48
  md: '![](img/a4b6c994843f3fbd688003f4cabfa48f_48_0.png)


    *Figure 3.4: Selecting the source medium in linuxrc*


    If this situation arises, the following procedure can often lead to efficient
    results:


    Select ‘Settings’ → ‘Debug (Experts)’ in the linuxrc main menu. There, select
    no in ‘Force root image’. Then go back to the main menu and restart installation.


    # Starting SuSE Linux


    After installation, the question remains as to how you want to boot your system
    normally (booting).


    The following section describes the options you have for booting your SuSE Linux
    system. The best boot method for you will depend on the intended use of your Linux
    system.


    **Boot disk:** You can boot Linux from a *boot disk* ("boot floppy"). This choice
    will always work (as long as the boot disk does not get corrupted) and it is easy.
    The boot disk may have been created during the installation.


    **loadlin:** The loadlin boot option can be configured as follows:'
  merge: -1
  img_proc: true
- pgno: 49
  md: '+   - The computer must be running either in DOS Real mode or have a VCPI server
    in virtual 8086 mode¹. In other words, this method will *not* function in Unix,
    OS/2, Windows NT, or in a DOS window on a Windows 95/98 machine. It does, however,
    function well from MS-DOS or from Windows 95/98 in DOS mode.

    +   - Your computer must have enough DOS memory available: there must be 128 KB
    available below the 640 KB limit, the rest can be on extended/EMS/XMS memory.


    loadlin is fairly labor intensive to set up, but it can be easily integrated into
    the Windows 95/98 boot menu. This requires a manual editing of configuration files.
    One of the biggest advantages of loadlin is that nothing is installed into the
    MBR (*Master Boot Record*) of the hard disk. To other operating systems, Linux
    partitions appear as an unknown type. To install loadlin, you need to know a little
    about Linux and DOS. You should also be able to create configuration files with
    an editor. Find details in Section *Configuring the Boot Mechanism with loadlin*
    on page 120. If you make a mistake in the Windows 95/98 boot menu, this could
    cause problems. In the event of an extreme error, you may loose access to your
    Windows hard drive. *Before* you start modifying your Windows boot menu, make
    sure you can boot your Windows operating system with a boot floppy.


    **LILO:** The universal and technically elegant solution for booting your system
    is LILO. The LILO boot menu can be configured to give a choice of operating systems
    to boot before anything is booted. Set up LILO during the installation or choose
    to configure it later with the help of YaST (see [SuS02a] in Chapter *YaST2*).
    LILO must be installed in the boot sector of your hard disk, which is not without
    some risk. You will need a basic understanding of how the boot process actually
    works if any problems arise. You should also be comfortable enough with the main
    LILO configuration file to edit it. Finally, you are well advised to learn how
    to uninstall LILO in the event that you have difficulties. Nevertheless, LILO
    is considered the best boot method available.


    ¹ A VCPI server is accessed by the program emm386.exe.'
  merge: -1
  img_proc: true
- pgno: 50
  md: "> **Caution**\n> \n> There are BIOS variants that check the structure of the\
    \ boot sector (MBR) and, after a LILO installation, erroneously display a virus\
    \ warning. This problem can be easily removed by entering the BIOS and looking\
    \ for corresponding adjustable settings. For example, you should switch off “virus\
    \ protection”. You can switch this option back on again later. It is unnecessary,\
    \ however, if Linux is the only operating system you are using.\n\nA detailed\
    \ discussion of various boot methods, especially of LILO and loadlin, can be found\
    \ in Chapter *Booting and Boot Managers* on page 89.\n\n# The Graphical SuSE Screen\n\
    \nBeginning from SuSE Linux 7.2, the graphical SuSE screen is enabled on the first\
    \ console, as long as the option \"vga=771\" has been provided as a kernel parameter.\
    \ If you install using YaST2, this option is added to `/etc/lilo.conf`.\n\n# Disabling\
    \ the SuSE Screen\n\nBasically there are three ways to achieve this:\n\n+   -\
    \ Disabling SuSE screen on an as-needed basis:\n\nEnter the command\n\n```\nearth:\
    \  # echo 0 >/proc/splash\n```\n\nto disable the graphical screen. By issuing\
    \ the command\n\n```\nearth:  # echo 0x0f01 >/proc/splash\n```\n\nyou can enable\
    \ the screen again.\n\n+   - Disabling the SuSE screen by default:"
  merge: -1
  img_proc: true
- pgno: 51
  md: "Add the kernel parameter `splash=0` to your boot loader configuration.  \n\
    In most cases, this will mean that the file `/etc/lilo.conf` needs to be edited\
    \ to include the following line:\n\n```\nappend=\"splash=0\"\n```\n\nIf your `lilo.conf`\
    \ already has an append line included in it, just edit this line, for example,\
    \ by changing\n\n```\nappend=\"vga=771\"\n```\n\ninto\n\n```\nappend=\"vga=771\
    \ splash=0\"\n```\n\nHowever, if you prefer the old text mode anyway (which was\
    \ the default with previous versions), you should set this to `\"vga=normal\"\
    `.\n\n+   - **Completely disabling the SuSE screen:**  \n+     Compile a new kernel\
    \ after disabling the option *Use splash screen instead of boot logo* in the menu\
    \ [framebuffer support].\n\n> > **Tip**  \n> > Removing the framebuffer support\
    \ from the kernel will automatically disable the splash screen as well. SuSE cannot\
    \ provide any support for your system if you run it with a custom kernel.\n\n\
    For most users, the recommended method is to edit `/etc/lilo.conf` as described\
    \ above. Execute `lilo` afterwards so LILO reads in the changes in its configuration.\
    \ Also see Section *Installing and Uninstalling LILO* on page 103."
  merge: -1
  img_proc: true
- pgno: 52
  md: '# # Special Installations


    # ## Installation Without a Supported CD-ROM Drive


    What do you do if a standard installation via the CD-ROM drive is not possible?
    Your CD-ROM drive might not be supported if it is an older, “proprietary” model.
    It might be your second computer, a notebook, for example, which might not even
    have a CD-ROM drive, but instead has an Ethernet adapter or a PLIP cable. SuSE
    Linux provides ways of installing over a network connection to such a machine
    without using a supported CD-ROM drive. NFS or FTP via Ethernet or via PLIP (Section
    *Installation from a Network Source* on this page) is available.


    # ## Installation from a Network Source


    We do not offer support for this method of installation. It is only recommended
    for experienced computer users.


    There is no CD-ROM installed on the machine on which you want to install Linux.
    You are able to connect to a remote machine over the network that has an installed
    CD-ROM drive (an CD) or that has a copy of the CD on its hard disk. In addition,
    it is necessary to copy the files `.s.u.S.E.-disk*` from the CD-ROM to the hard
    disk. This can be abbreviated as in the following way:


    ```

    earth: # cp /media/cdrom/.s* /emil


    earth: # cp -a /media/cdrom/suse /emil

    ```


    This “other” computer must “export” the directory in a suitable manner.


    > > **Tip**

    > >

    > > Alternatively, it is sufficient to start the rescue system on the remote machine
    and directly export the CD 1.


    # ## Installation Steps


    +   1. Start the installation of the client as specified in Section *Text-Based
    Installation with YaST2* on page 32.

    +   2. Continue with the installation as described in Section *Linux: The Basis*
    on page 33, but:'
  merge: -1
  img_proc: true
- pgno: 53
  md: '+   - When you come to ‘Kernel modules’, select ‘Networking cards’ and load
    the necessary driver. This is not necessary if you are installing via PLIP.


    +   - When prompted by linuxrc to specify the ‘Source medium’, select ‘Network
    (NFS)’ then configure the network using the available menus. As an alternative,
    install via FTP or SMB.


    +   3. Finish up the installation as described in [SuSE02], Chapter *Installation*
    and in Chapter *Installation with YaST2* on page 5.


    # Possible Problems


    +   - The installation aborts before it has actually started, because the installation
    directory of the “other” machine was not exported with exec permissions. Correct
    this and start again.


    +   - The server does not know the computer on which SuSE Linux should be installed.
    Enter the name and IP address of the computer to install into the file /etc/hosts
    of the server.'
  merge: -1
  img_proc: true
- pgno: 54
  md: "# # Tips and Tricks\n\n# ## Booting from Disk (SYSLINUX)\n\nThe “boot disk”\
    \ method can be used as a fallback solution if you have to deal with special installation\
    \ requirements (e. g., the CD-ROM drive is not available). For more information\
    \ on creating the boot disk, read *Creating a Boot Disk in DOS* on the following\
    \ page and *Creating a Boot Disk in a UNIX-Related System* on page 45.\n\nThe\
    \ bootstrapping process is initiated by the boot loader SYSLINUX (package `syslinux`).\
    \ SYSLINUX is configured so that some minimal hardware detection is performed\
    \ at start-up. Basically this includes the following steps:\n\n+   - Checking\
    \ whether the BIOS provides VESA 2.0 compliant framebuffer support and making\
    \ sure the kernel is booted accordingly.\n+   - Reading out any available monitor\
    \ information (DDC info).\n+   - Reading the first sector of the first hard disk\
    \ (the “MBR”) to arrange for the LILO configuration later, where BIOS IDs will\
    \ be assigned to Linux device names. This answers a test to read out the sector\
    \ using the BIOS’s `lba32` function to find out whether the BIOS supports the\
    \ corresponding features.\n\n> **Tip**\n> \n> If you keep `⇧ Shift` pressed when\
    \ SYSLINUX is started, all of the above steps will be skipped. To ease troubleshooting,\
    \ add the line `verbose 1` to your `syslinux.cfg`, in which case the boot loader\
    \ will tell you which action is being performed.\n\n# ## Possible Problems\n\n\
    If the machine does not want to boot from a floppy, change the boot sequence in\
    \ the BIOS to A, C.\n\n# ## Booting with CD 2\n\nAs well as CD 1, the second CD\
    \ is also bootable. On CD 1, a 2.88 MB boot image is used. The second CD contains\
    \ a traditional image of 1.44 MB in size. Use CD 2 when you know for certain that\
    \ you can boot from CD, but when things do not work with CD 1 (the “fallback”\
    \ solution). Unfortunately, not every BIOS correctly recognizes the large images."
  merge: -1
  img_proc: true
- pgno: 55
  md: '# # Creating a Boot Disk in DOS


    # ## Requirements


    You need a formatted 3.5" floppy disk and a bootable 3.5" floppy drive. If you
    are working in Windows 95/98, launch setup from MS-DOS mode, not from inside a
    DOS window.


    # ## Additional Information


    CD 1, in the directory `/disks`, contains a number of disk images. Such an image
    can be copied to a disk with help from suitable auxiliary programs. This disk
    is then called a boot disk. These disk images also include the “loader”, SYSLINUX,
    and the program linuxrc. SYSLINUX allows selection of a specific kernel for the
    booting process and to add parameters for your hardware, if necessary. The program
    linuxrc supports the loading of kernel modules for your hardware then starts the
    installation.


    # ## Procedure


    The DOS application rawrite.exe (CD 1, directory `\dosutils\rawrite`) is useful
    for generating the SuSE boot and module disks. Requirements for this are a machine
    with a DOS (e.g., FreeDOS) or Windows.


    The procedure described in the following is for working with Windows:


    +   1. Insert the SuSE Linux CD 1.


    +   2. Open a DOS window (in the start menu under ‘Applications’ → ‘MS-DOS Prompt’).


    +   3. Start the rawrite.exe application by giving the correct path name for the
    CD drive. The following example takes place on the C: drive in the Windows directory
    and your CD drive is D:


    ```

    C:\Windows> d:\dosutils\rawrite\rawrite

    ```


    +   4. After starting the application, it will prompt you for the source and destination
    of the file to copy. The image of the bootdisk is stored on CD 1 under `\disks`.
    The file is simply named bootdisk. Do not forget to specify the path for your
    CD drive here either.


    ```

    C:\Windows> d:\dosutils\rawrite\rawrite RaWrite 1.2 -- Write

    disk file to raw floppy diskette


    Enter source file name:  d:\disks\bootdisk Enter destination

    drive:  a:

    ```'
  merge: -1
  img_proc: true
- pgno: 56
  md: 'As soon as you have specified the destination drive a:, rawrite will prompt
    you to insert a formatted disk then press `Enter`. You will subsequently be shown
    the copy progress. This process can be terminated with `Ctrl` + `C`. In this manner,
    you can also create the other floppy images, `modules1` and `modules2`. These
    are required if you have SCSI devices or a network card and want to access them
    during installation. If you have trouble with this, you can use the image `i386`
    instead as fallback.


    # Creating a Boot Disk in a UNIX-Related System


    # Requirements


    You need access to a Unix or Linux system with a CD-ROM drive and a formatted
    disk.

    To create a boot disk:


    +   1. If you need to format the disks first:


    ```

    earth:  # fdformat /dev/fd0u1440

    ```


    +   2. Mount the first CD 1 to /cdrom, for example:


    ```

    earth:  # mount -tiso9660 /dev/cdrom /cdrom

    ```


    +   3. Change to the disks directory on CD:


    ```

    earth:  # cd /cdrom/disks

    ```


    +   4. Create the boot disk with


    ```

    earth:  # dd if=/cdrom/disks/bootdisk of=/dev/fd0 bs=8k

    ```


    In the README file in the directory `disks`, read about what features specific
    kernels have. These files can be read with more or less.


    In this manner, you can also create the other floppy images, `modules1` and `modules2`.
    These are required if you have SCSI devices or a network card and want to access
    them during installation. If you have trouble with this, you can use the image
    `i386` instead.


    Somewhat more complex is using a self-compiled kernel during installation. In
    this case, write the default image (`bootdisk`) to the disk then overwrite the
    actual kernel (`Linux`) with your own kernel (refer to Section *Compiling the
    Kernel* on page 234):


    ```

    earth:  # dd if=/cdrom/disks/scsi01 of=/dev/fd0 bs=8k

    ```'
