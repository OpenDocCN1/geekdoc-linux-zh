    \ section\n\n# Linux bootable partition config begins\nimage = /mnt/vmlinuz  \
    \         # default\n    root = /dev/Your_Root_Device  # Here is your root partition!\n\
    \    label = linux\n# Linux bootable partition config ends\n```\n```\n\n*File\
