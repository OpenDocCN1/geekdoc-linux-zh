- pgno: 81
  md: "Essentially, rpm has three modes. In one mode, it compiles software applications\
    \ from “source” sources and packages them for installation. In the second, it\
    \ installs, upgrades, and cleanly uninstalls software packaged in the RPM format.\
    \ Finally, in the third, it supports queries about packages and maintains the\
    \ RPM database of installed packages.\n\nInstallable RPM archives are packed in\
    \ a special binary format. These archives consist of the program files to be installed\
    \ and certain meta information used during the installation by rpm to configure\
    \ the software package or stored in the RPM database for documentation purposes.\
    \ RPM archives normally have the extension .rpm.\n\n> **Tip**\n> \n> For a number\
    \ of packages, the components needed for software development (libraries, headers,\
    \ include files, etc.) have been put into separate packages. These development\
    \ packages are only needed if you want to compile software yourself, for example,\
    \ the most recent GNOME packages. These development packages can be identified\
    \ by their name extension `-devel` (previously: `dev` or `d`); package `alsa-devel`,\
    \ package `gimp-devel`, package `kdelibs-devel`, etc.\n\n# Verifying Package Authenticity\n\
    \nSince Version 7.1, the SuSE RPM packages have a GnuPG signature:\n\n```\n1024D/9C800ACA\
    \ 2000-10-19 SuSE Package Signing Key <build@suse.de>\nKey fingerprint = 79C1\
    \ 79B2 E1C8 20C1 890F 9994 A84E DAE8 9C80 0ACA\n```\n\nWith the command\n\n```\n\
    earth:~ # rpm --verbose --checksig apache-1.3.12.rpm\n```\n\nverify the signature\
    \ of an RPM package to determine whether it really originates from SuSE or from\
    \ another trustworthy facility. This is especially recommended for update packages\
    \ downloaded from the Internet. Our public package signature key normally resides\
    \ in /root/.gnupg/."
  merge: -1
  img_proc: true
- pgno: 82
  md: '# Managing Packages: Install, Update, and Uninstall


    Normally, RPM installation can be done simply with `rpm -i (package).rpm`. With
    this command, the package will be installed — but only if its dependency requirements
    are met and if it does not conflict with another package. With an error message,
    `rpm` requests those packages that need to be installed to fulfill dependencies.
    In the background, the RPM database ensures that no conflicts will arise — a specific
    file can only belong to one package. By choosing different options, you can force
    `rpm` to ignore these defaults, but be sure to know what you are doing. Otherwise
    you risk compromising the integrity of the system and might jeopardize the ability
    to update the system.


    Use `-U` or `--upgrade` to update a package. This option will remove the files
    of the old version and immediately install the new files. `rpm` updates configuration
    files more cautiously:


    +   - If a configuration file has **not** been changed by the system administrator,
    `rpm` will install the new version of the appropriate file. No action by the system
    administrator is required.

    +   - If a configuration file was changed by the system administrator **before**
    the update, `rpm` will save the changed file with the extension `.rpmorig` or
    `.rpmsave` (backup file) and install the version of the new package, but only
    when the originally installed file and the newer version are different. If this
    is the case, compare the backup file (`.rpmorig` or `.rpmsave`) with the newly
    installed file and make your changes again in the new file. Afterwards, be sure
    to delete all `.rpmorig` and `.rpmsave` files to avoid problems with future updates.

    +   - `.rpmnew` files appear if the configuration file already exists **and**
    if the `noreplace` label was specified in the `.spec` file.


    Following an update, `.rpmsave` and `.rpmnew` files should be removed after comparing
    them, so they do not hinder future updates. The `.rpmorig` extension is assigned
    if the file has not previously been recognized by the RPM database. Otherwise,
    a `.rpmsave` is used. In other words, `.rpmorig` results from updating from a
    foreign format to RPM, while `.rpmsave` results from updating from an RPM-old
    to an RPM-new. `.rpmnew` does not disclose any information as to whether the system
    administrator has made any changes to the configuration file. The `-U` switch
    is not just an equivalent to uninstalling with the `(-e)` option and installing
    with the `(-i)` option. Use `-U` whenever possible.'
  merge: -1
  img_proc: true
- pgno: 83
  md: "> > **Note**\n> > \n> > After every update, check all backup files created\
    \ by `rpm`. These are your old configuration files. If necessary, incorporate\
    \ your customizations from the backup files in the new configuration files. After\
    \ this process, the files with the extensions `.rpmorig` and `.rpmsave` should\
    \ be deleted.\n\nTo remove a package, enter the command:\n\n```\n```bash\nearth:\
    \  # rpm -e {package}\n```\n```\n\nrpm will only delete the package if there are\
    \ no unresolved dependencies. Thus, it is theoretically impossible to delete Tcl/Tk,\
    \ for example, as long as another application requires it. Even in this case,\
    \ RPM calls for assistance from the database.\n\nIf such a deletion is — for whatever\
    \ reason and under unusual circumstances — impossible, even if no additional dependencies\
    \ exist, it may be helpful to rebuild the RPM database using the option `--rebuild`.\
    \ See the side notes below regarding the RPM database (Section *RPM Queries* on\
    \ page 75).\n\n# RPM Queries\n\nWith the `-q` option, rpm initiates queries, making\
    \ it possible to inspect an RPM archive (by adding the option `-p`) and also to\
    \ query the RPM database of installed packages. Several switches are available\
    \ to specify the type of information required (see Table 4.1).\n\n| Option | Description\
    \ |\n|---|---|\n| `-i` | Package information |\n| `-l` | File list |\n| `-f {FILE}`\
    \ | Query a package owned by `{FILE}` (the full path must be specified with `{FILE}`)\
    \ |\n| `-s` | File list with status information (implies `-l`) |\n| `-d` | List\
    \ only documentation files (implies `-l`) |\n| `-c` | List only configuration\
    \ files (implies `-l`) |\n| `--dump` | File list with complete details (to be\
    \ used with `-l`, `-c` or `-d`) |\n| `--provides` | List features of the package\
    \ that another package can request with `--requires` |\n| `--requires, -R` | Capabilities\
    \ the package requires |\n| `--scripts` | (Un)installation scripts (preinstall,\
    \ postinstall, uninstall) |\n\n*Table 4.1: The Most Important RPM Query Options*\
    \ — (`-q` [`-p` ... `{package}`])"
