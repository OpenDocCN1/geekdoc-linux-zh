- pgno: 129
  md: '# Special Boot Problems with Kernels from 2.0 Onwards


    Problems booting with LILO — regardless of whether you are booting from a floppy
    or from a hard disk — might occur after part of the kernel has been loaded (e.g.,
    a SuSE installation kernel). You can select a kernel at the LILO prompt and this
    kernel is loaded (some dots are output onto the screen), but starting the kernel
    fails. Before reaching "uncompressing Linux", the system crashes with different
    behaviors.

    Possible error messages:


    +   - System reboots

    +   - System just hangs

    +   - "crc-error"

    +   - "no free space"

    +   - "Error 0x00"

    +   - "Error 0x01"

    +   - "incomplete literal tree"


    Access to the floppy is attempted, but the system hangs. The cause lies in a combination
    of a big kernel, LILO, and faulty hardware. This affects roughly one percent of
    all machines.


    We assume that this is due to a faulty BIOS that has problems with fast memory
    access. This problem does not occur, if:


    +   - the machine is booted via loadlin (Section *Configuring the Boot Mechanism
    with loadlin* on page 120)

    +   - the kernel has been copied to a floppy with `dd if=/vmlinuz of=/dev/fd0`
    and booted from there

    +   - a smaller kernel, created with `make zImage`, is booted with LILO


    The following BIOS settings also do not cause any problems:


    +   - Disable Internal Cache

    +   - DRAM Precharge Wait State value: *1 and*

    +   - DRAM Wait Burst Timing value: `0x3333`'
  merge: -1
  img_proc: true
- pgno: 130
  md: '# Solution


    First, you should be able to install a system. So, if you cannot boot via loadlin
    or via setup, use an old kernel 1.2.13 boot disk for installation. If you do not
    have such a disk available, change the BIOS settings accordingly.


    For booting in future, use the same medium as during installation. loadlin from
    DOS should not cause any problems. With a boot disk, you should enter the following
    parameters:


    ```

    load_ramdisk=0 root=/dev/(rootpartition)

    ```


    where *(rootpartition)* is your root partition (e.g., hda1).'
