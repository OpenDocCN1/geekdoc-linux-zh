- pgno: 187
  md: '# Main PCM Types: hw and plughw


    ALSA 0.9.x has changed and extended the concept of PCM devices. From now on, by
    selecting a given PCM type, the user can influence how ALSA accesses the sound
    card. The most important PCM types are hw and plughw.


    To understand the difference between the two types, it is necessary to know how
    a PCM device is opened. Setting (at least) the following parameters is required:
    sample format, sample frequency, number of channels, number of periods (previously
    referred to as “fragments”), and size of a period. For example, an application
    may want to play back a WAV file with a sample frequency of 44.1 kHz, but the
    sound card does not support this frequency. In this case, ALSA automatically converts
    the data in the plug-in layer to a format the sound card supports. The conversion
    affects the parameters sample format, sample frequency, and number of channels.


    Selecting the PCM type plughw activates the plug-in layer. Selecting the PCM type
    hw causes ALSA to attempt to open the PCM devices directly with the parameters
    required by the application.


    The complete designator for a PCM device consists of the PCM type followed by
    a colon then the card number followed by the device number, for example:


    `plughw:0,0`'
  merge: -1
  img_proc: true
- pgno: 188
  md: '# The Mixer for the Sound Chip Envy24


    series snd, package alsa


    ![](img/a4b6c994843f3fbd688003f4cabfa48f_188_0.png)


    *Figure 8.1: Monitor and Digital Mixer in envy24control*


    envy24control is a mixer application for sound cards with the Envy24 (ice1712)
    chip. Start the mixer either with ‘SuSE’ → ‘Multimedia’ → ‘Sound’ or at the command
    line with envy24control &.


    Next, we will describe the most important features in envy24control. The Envy24
    chip’s flexibility also means that its functionality can differ depending on the
    sound card. Up-to-date and detailed information about the Envy24 sound chip can
    be found in /usr/share/doc/packages/alsa/alsa-tools/envy24control.


    # Monitor and Patchbay in envy24control


    The signal controls are shown in the ‘Monitor Mixer’ in envy24control. The signals
    can be mixed in the sound card. The signals with the label ‘PCM Out’ are generated
    by applications, which send PCM data to the sound card. The signals of the analog
    inputs are shown under ‘H/W In’. The ‘S/PDIF’ input displays are shown to the
    right of this. Input and output controls for the analog channels must be set under
    ‘Analog Volume’.


    Use the ‘Monitor Mixer’ sliders for the digital mixing. The controls for this
    are shown in ‘Digital Mixer’. The output routing of this mix is defined in the
    ‘Patchbay’. The ‘Patchbay’ contains a column of radio buttons corresponding to
    each output channel, which can be used to select the desired channel source.'
  merge: -1
  img_proc: true
- pgno: 189
  md: '![](img/a4b6c994843f3fbd688003f4cabfa48f_189_0.png)


    *Figure 8.2: Set Signal Routes in the Patchbay*


    # Analog Inputs and Outputs


    The amplification for the analog-to-digital and digital-to-analog converters is
    defined under ‘Analog Volume’. The ‘DAC’ sliders are responsible for the output
    channels. Use the ‘ADC’ sliders for the input channels. Use the radio buttons
