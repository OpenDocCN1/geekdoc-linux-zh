- pgno: 415
  md: 'Here, too, replace the REQUIRED with a list of permitted user names. Using
    ident can slow down the access time quite a bit, because ident lookups will be
    repeated for each request.


    # Transparent Proxy Configuration


    The usual way of working with proxy servers is the following: the web browser
    sends requests to a certain port in the proxy server and the proxy provides these
    required objects, whether they are in its cache or not. When working in a real
    network, several situations may arise:


    +   - For security reasons, it is recommended that all clients use a proxy to
    surf the Internet.

    +   - All clients must use a proxy whether they are aware of it or not.

    +   - In larger networks already using a proxy, it is possible to spare yourself
    the trouble of reconfiguring each machine whenever changes are made in the system.


    In all these cases, a transparent proxy may be used. The principle is very easy:
    the proxy intercepts and answers the requests of the web browser, so that the
    web browser receives the requested pages without knowing from where they are coming.
    This entire process is done transparently, hence the name.


    # Kernel Configuration


    First, make sure the proxy server’s kernel has support for transparent proxying.
    Otherwise, add this option to the kernel and compile it again. More on this topic
    is available in the *SuSE Linux Reference Manual*.


    In the entry corresponding to Networking Options, select ‘Network Firewalls’ then
    the options ‘IP: firewalling’ and ‘IP: Transparent proxying’. Now, save the new
    configuration, compile the new kernel, install it, reconfigure LILO if necessary,
    and retest the system.


    # Configuration Options in /etc/squid.conf


    The options to activate in the /etc/squid.conf file to get the transparent proxy
    up and running are:


    +   - httpd_accel_host virtual'
  merge: -1
  img_proc: true
- pgno: 416
  md: '+   - `httpd_accel_port 80` # the port number where the actual HTTP server
    is located

    +   - `httpd_accel_with_proxy on`

    +   - `httpd_accel_uses_host_header on`


    # Firewall Configuration with SuSEfirewall


    Now redirect all incoming requests via the firewall with help of a port forwarding
    rule to the Squid port.

    To do this, use a SuSE-provided tool: SuSEfirewall. Its configuration file can
    be found in `/etc/sysconfig/scripts/SuSEfirewall2-custom`. Again, the configuration
    file consists of well-documented entries. Even to set only a transparent proxy,
    you must configure a couple firewall options. In our example:


    +   - Device pointing to the Internet: `FW_DEV_WORLD="eth1"`

    +   - Device pointing to the network: `FW_DEV_INT="eth0"`


    Set ports and services (see `/etc/exports`) on the firewall being accessed from
    untrusted networks such as the Internet. In this example, only web services are
    offered to the outside:


    ```

    FW_SERVICES_EXTERNAL_TCP="www"

    ```


    Define ports or services (see `/etc/exports`) on the firewall to be accessed from
    the secure network, both TCP and UDP services:


    ```

    FW_SERVICES_INTERNAL_TCP="domain www 3128"

    FW_SERVICES_INTERNAL_UDP="domain"

    ```


    We are accessing web services and Squid (whose default port is 3128).

    The service “domain” specified before stands for DNS or Domain Name Server.

    It is most common to use this service, otherwise we simply take it out of the
    above entries and set the following option to no:


    ```

    FW_SERVICE_DNS="yes"

    ```


    The most important option is number 15.'
  merge: -1
  img_proc: true
- pgno: 417
  md: '```

    ```text

    #

    # 15.)

    # Which accesses to services should be redirected to a localport

    # on the firewall machine?

    #

    # This can be used to force all internal users to surf via your

    # squid proxy, or transparently redirect incoming webtraffic to

    # a secure webserver.

    #

    #

    # Choice: leave empty or use the following explained syntax of

    # redirecting rules, separated by a space

    # A redirecting rule consists of 1) source IP/net,

