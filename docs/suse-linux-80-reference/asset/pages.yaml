  md: '+   - Mesa general: `/usr/share/doc/packages/mesa/` (package mesa, series x3d)


    # Joystick Configuration


    USB port joysticks are automatically supported by SuSE Linux. Use the YaST2 module
    “Sound Configuration” to configure analog devices on the sound card’s joystick
    port.


    Test your joystick using `jstest /dev/js0`. The command shows the joystick values
    that change when the joystick is moved or you press its buttons.


    If necessary, calibrate the joystick using the jscalibrator (`/usr/bin/jscalibrator`)
    application from package libjsw, series d and package libjsw-calibrator, series
    d.


    ![](img/a4b6c994843f3fbd688003f4cabfa48f_184_0.png)


    *Figure 7.14: Calibrating the Joystick*


    This completes the configuration of your joystick. Your joystick is now ready
    to use. Try starting an application that supports the joystick as an input device,
    such as the game clanbomber, package clanbomber, series fun.


    If you experience any problems, find additional configuration instructions and
    options for the different joystick modules in the file `/usr/src/linux/Documentation/input/joystick.txt`,
    package kernel-source, series d.'
