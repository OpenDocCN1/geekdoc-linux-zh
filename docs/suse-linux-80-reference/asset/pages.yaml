- pgno: 116
  md: "# Uninstalling LILO\n\n> **Caution**\n> \n> Uninstalling a boot manager is\
    \ tricky. Ensure *in advance* that you are able to boot Linux and other systems\
    \ with their respective boot disks. You should have fdisk installed on every boot\
    \ disk, to avoid being unable to access your hard disk at all.\n\nTo uninstall\
    \ LILO, copy the former content of the boot sector over LILO. This requires a\
    \ valid backup of that former content. See Section *Other LILO Configuration Options*\
    \ on page 99, option backupr.\n\n> **Caution**\n> \n> A boot sector backup is\
    \ no longer valid if the partition in question has a new file system (for DOS\
    \ users: has been formatted). The partition table of an MBR backup becomes invalid\
    \ if the hard disk in question has been repartitioned in the meantime. Obsolete\
    \ “backups” are time bombs. It is best to delete them as soon as possible. Unpacking\
    \ old and invalid backups into system sectors is a direct route to data loss.\n\
    \nIt is very simple to regain a DOS, Windows 95/98, or OS/2 MBR. Just enter the\
    \ MS-DOS command (available since 5.0)\n\n```\nC:\\> FDISK /MBR\n```\n\nor, on\
    \ OS/2,\n\n```\nC:\\> FDISK /NEWMBR\n```\n\nThese commands only write the first\
    \ 446 bytes (the boot code) into the MBR and leave partitions untouched.\nFor\
    \ other restorations, first make a backup of the LILO sector in question — just,\
    \ to be on the safe side. Now check, at least twice, whether your old backup file\
    \ is the correct one and if it is exactly 512 bytes in size. Finally, write it\
    \ back, but do not confuse if= and of=:\n\n+   - If LILO resides in partition\
    \ yyyy (e.g., hda1, hda2):\n+     ```\n+     earth:  # dd if=/dev/yyyy of=New-File\
    \ bs=512 count=1\n+     earth:  # dd if=Backup-Date of=/dev/yyyy\n+     ```\n\
    +   - If LILO resides in the MBR of zzz (e.g., hda, sda):\n+     ```\n+     earth:\
    \  # dd if=/dev/zzz of=New-File bs=512 count=1\n+     earth:  # dd if=Backup-Date\
    \ of=/dev/zzz bs=446 count=1\n+     ```"
  merge: -1
  img_proc: true
