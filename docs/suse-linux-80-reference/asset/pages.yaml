    \ vkeybd interface can be configured under ‘View’.\n\n# Setting Up Connections\
    \ Between MIDI Ports\n\nALSA provides a sophisticated infrastructure for the connection\
    \ of several MIDI ports. Sound cards and MIDI applications (provided that they\
    \ support the ALSA sequencer structure) have one or more MIDI ports for communicating\
    \ with each other. These ports can either be connected with the KDE application\
    \ kaconnect or with aconnect. After it starts, kaconnect shows the readable and\
    \ writable MIDI ports available on your system and existing connections. To see\
    \ a demonstration of this, start two MIDI applications with vkeybd and aseqview.\
    \ Specify the port address after the application name. The first application is\
