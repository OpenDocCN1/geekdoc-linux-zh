- pgno: 341
  md: '# Domain Name System


    # DNS


    DNS serves to alleviate the burden of having to remember IP addresses: DNS assists
    in assigning an IP address to one or more names and, vice versa, assigning a name
    to an IP address. In Linux, this conversion is usually carried out by a special
    type of software known as bind. The machine that takes care of this conversion
    is called a name server.


    The names make up a hierarchical system whereby each name component is divided
    by points. The name hierarchy is, however, independent of the IP address hierarchy
    described above.


    Examine a complete name:


    ```

    laurent.suse.de

    hostname.domain

    ```


    A full name, referred to by experts as a “fully qualified domain name” or FQDN
    for short, consists of a host name and a portion of a domain. Here, the partial
    domain consists of any component of the domain — in the above example, suse —
    and the top level domain, TLD.


    TLD assignment has become, due to historical reasons, quite confusing. For instance,
    three-letter domain names are used in the USA, unlike in the rest of the world,
    where the two-letter ISO national codes are the standard. In Table 13.6, various
    TLDs are listed. This overview is by no means complete.


    | TLD | Description |

    |---|---|

    | `.com` | (Commercial) — US companies. |

    | `.edu` | (Educational) — Schools, universities, and other non-commercial institutions
    in the United States. |

    | `.gov` | (Government) — State institutions in the US. |

    | `.org` | (Organizational) — Non-commercial and non-profit organizations in the
    US. |

    | `.de` | Machines in Germany. |

    | `.at` | Machines in Austria. |


    *Table 13.6: Various Top Level Domains*'
  merge: -1
  img_proc: true
- pgno: 342
  md: 'In the early days of the Internet (before 1990), there was a file `/etc/hosts`
    for the purpose of storing the names of all the machines represented over the
    Internet. This quickly proved to be impractical with the rapidly growing number
    of computers connected to the Internet. For this reason, a decentralized database
    was developed to store the host names in a widely distributed manner. This database,
    similar to the above mentioned name server, does not have the data pertaining
    to all hosts in the Internet readily available, but can dispatch requests to other
    name servers.


    The top of the hierarchy is occupied by “root name servers.” The root name servers
    manage the top level domains. The root name servers are managed by the Network
    Information Center, or NIC for short. The root name server recognizes the name
    servers responsible for each top level domain. More information about top level
    domain NICs is available at http://www.internic.net.


    For your machine to resolve an IP address as well, it has to recognize at least
    one name server with an IP address. Configure a name server with the help of YaST2.
    If you have a modem dial-up connection, you may not have to manually configure
    a name server at all. The dial-up protocol provides the name server address as
    the connection is being made.


    DNS can do more than just resolve host names. The name server also “knows” which
    host is receiving e-mail for an entire domain, the mail exchanger (MX). The configuration
    of name server access with SuSE Linux is described in Section DNS — Domain Name
    Service on page 349.


    # whois


    Closely related to DNS is the protocol whois. With this program, you can quickly
    find out who is responsible for any given domain.


    # IPv6 — The Next Generation’s Internet


    # A New Internet Protocol


    Due to the emergence of the WWW (World Wide Web), the Internet has experienced
    explosive growth with a growing number of computers communicating via TCP/IP in
    the last ten years. Since Tim Berners-Lee at CERN (http://public.web.cern.ch/)
    invented the WWW in 1990, the number of Internet hosts has grown from a few thousand
    to about 100 million.'
  merge: -1
  img_proc: true
- pgno: 343
  md: 'An IP address “only” consists of 32 bits. Since quite a few IP addresses cannot
    be used due to organizational circumstances, many IP addresses are lost. The Internet
    is divided into subnetworks. The number of addresses available in your subnet
    is the number of bits squared minus two. For example, a subnetwork has two, six,
    or fourteen addresses available. To connect 128 hosts to the Internet, for instance,
    you will need a “Class C” subnetwork with 256 IP addresses, from which only 254
    are usable. Two IP addresses are subtracted from the subnetwork – the broadcast
    address and the base network address.


    Configuring a host in the TCP/IP network is relatively complicated. As you have
    already seen, you will have to configure the following items on your host: IP
    address, subnetmask, gateway address (if available), and a name server. You will
    already have to know this information or receive it from your provider.


    Every IP packet contains a proof total that verifies each routing procedure and
    will have to be recalculated. This is why very fast routers require a lot of processor
    performance and are more expensive.


    Some services have previously been implemented using broadcasts (for example,
    the Windows network protocol SMB). Hosts for which this service is irrelevant
    are, however, forced to process the packets and subsequently ignore them. This
    could lead to problems in high-speed networks.


    The successor of the previous IP, IPv6, is a solution to all these problems. The
    main goal of its development was to expand significantly the rather limited address
    space, to simplify the configuration of workstations, and to automate them when
    possible. In this section, IPv4 or IP will be mentioned in reference to the Internet
    protocol currently used and IPv6 in reference to the new version 6.


    IPv6 is defined in more detail in RFC 1752. To further delve into the relevant
    material, get an initial introduction in this RFC. IPv6 uses 128-bit addresses
    so features quadrillions of IP addresses, enough for even more general address
    distribution. This enormous amount of IPv6 addresses allows you to “enlarge” even
    the smallest subnetwork to 48 bits.


    This enables you, then, to utilize the above mentioned MAC address as an address
    component. As this address is entirely unique and is strictly defined by the hardware
    vendor, this will make your host configuration a lot easier. In reality, an EUI-64
    token will be consolidated, down to the first 64 bits. In doing so, the last 48
    bits of the MAC address will be removed and the remaining 24 bits will contain
    special information on the token type. This also enables the assignment of an
    EUI-64 token to devices without a MAC address (PPP and ISDN connections).'
  merge: -1
  img_proc: true
- pgno: 344
  md: 'Furthermore, there has been a new development in IPv6: normally, several IP
    addresses are assigned to a network interface. This has the advantage that different
    networks can be made accessible. One of them can be turned into an automatically
    configured network. Specify the MAC address of the network card and a prefix and
    you will not have to configure anything else. All hosts in the local network will
    be accessible right after starting IPv6 (“link-local address”). Moreover, the
    remaining configuration tasks on a workstation can be carried out automatically
    to a greater extent. There is a special protocol for this purpose with which workstations
    can receive an IP address from a router.


    All IPv6 supported hosts absolutely require “multicast” support. Multicast can
    aid several hosts in being accessible at the same time — they do not all have
    to be set to (“broadcast”) or only one to (“unicast”), but, rather, a pair. Which
    of them that is depends on the application. However, a pair of well-defined multicast
    groups exists as well, for example, “all name servers multicast group” or “all
    routers multicast group.”


    As updating all hosts in the Internet from IPv4 to IPv6 is in no way feasible,
    there is a compatibility mode. This maps the previous addresses to IPv6 addresses.
    At the same time, there are mechanisms such as “tunneling” — here, IPv6 packets
    are sent in the form of IPv4 packets. Of course, it is also possible to convert
    IPv6 to IPv4. To reach an IPv6 host from a IPv4 host, the IPv6 host absolutely
    has to have a IPv4 compatibility address.


    # Structure of an IPv6 Address


    An IPv6 address, conditional upon 128 bits, is significantly longer than an IPv4
    address with its 32 bits. An IPv6 address is consequently 16 bytes long. Due to
    the size factor, the new IPv6 addresses are written in a different format than
    the IPv4 addresses used previously. Look at the examples in Table 13.7 on the
    next page.


    As you can see in the table, IPv6 addresses are represented by hexadecimal numbers.
    The hexadecimal numbers are represented in two-byte segments separated by a colon.
    Therefore, there can only be a maximum of eight groups and seven colons in one
    address. Zero-bytes in front of a group can be omitted, but not if there are in
    the middle or at the end of a group. More than four zero-bytes following one another
    can be skipped by the omission character ::. However, only one omission character
    is allowed in one address. This omission procedure is technically referred to
    as “collapsing”. IPv4 compatibility addresses are a specific example of collapsing:
    here, the IPv4 address is simply attached to the predefined prefix for IPv4 compatibility
    addresses.'
  merge: -1
  img_proc: true
- pgno: 345
  md: '| Address type | IPv6 address |

    |---|---|

    | Localhost | `::1` |

    | IPv4-compatible IPv6 address | `::10.10.11.102`<br>(IPv6 supported) |

    | IPv4-mapped IPv6 address | `::ffff:10.10.11.102`<br>(IPv6 is not supported)
    |

    | random address | `3ffe:400:10:100:200:0:ffed:0:a4c3` |

    | Link-local address | `fe80::10:100:1a` |

    | Site-local address | `fec0:1:1:210:21ff:fe00:1a4` |

    | Multicast group<br>“All link-local routers” | `ff02:0:0:0:0:0:0:2` |


    *Table 13.7: Representation of Various IPv6 Addresses*


    Every part of an IPv6 address has a set meaning. The first bytes comprise a prefix
    and specify the address type. The middle portion addresses a network or has no
    meaning while the last part of the address comprises the host segment. Table 13.8
    explains the meaning of some of the more common prefixes.


    | Prefix (hexadecimal) | Usage |

    |---|---|

    | `00` | IPv4 and IPv4 via IPv6 compatibility addresses. This is an IPv4-compatible
    address. The IPv6 packet will still need to be converted to an IPv4 packet via
    an appropriate router. Further special addresses (e.g., loopback devices) are
    likewise designated this prefix. |

    | First digit 2 or 3 | provider-based unicast addresses. As in the previous example,
    you can be designated a subnetwork in IPv6 from a provider. |

    | `fe80` to `febf` | link-local addresses with this prefix cannot be routed and,
    therefore, cannot be accessed in the same subnetwork. |

    | `fec0` to `feff` | site-local. These addresses can be routed, but only internally
    within an organization. In this way, these addresses correspond to the previous
    “private” networks (for example, 10.x.x.x). |

    | `ff` | multicast IPv6 addresses beginning with ff are multicast addresses. |


    *Table 13.8: Various IPv6 Prefixes*'
  merge: -1
  img_proc: true
- pgno: 346
  md: 'As you can already see above, special unicast addresses can get quite long.
    These can no longer simply be memorized. A functional name server is therefore
    even more important for IPv6 than for IPv4. Name servers are so important that
    there is even an autoconfiguration protocol for them.


    # IPv6 Netmasks


    Netmasks are represented by IPv6 in a slightly different way. The categorization
    of networks in classes is no longer practical, since classless routing is used
    from the beginning and the small subnetwork can already take up any number of
    hosts. Since netmasks would get quite long if written out in the previous manner,
    they will now be written in an entirely different format. The format


    ```

    fec0:1:0:210:10ff:fe00:1a4/64

    ```


    indicates that the last 64 bits make up the host segment and the first 64 bits
    are the network segment.


    To be more precise, the 64 means that the netmask is filled up, as indicated at
    left, with 1 bits. Therefore, there are 64 one-bits in the netmask. As in IPv4,
    linking the netmask with the IP address with the logical AND defines whether a
    host is located in the same or in a different subnetwork.


    # For More Information About IPv6


    Of course, the above overview cannot and is not intended to be a comprehensive
    introduction to the very extensive topic of IPv6. For a more in-depth introduction
    in IPv6, refer to `http://www.ipv6.org/`.'
  merge: -1
  img_proc: true
- pgno: 347
  md: '# Network Integration


    Currently TCP/IP is the standard network protocol. All modern operating systems
    can communicate via TCP/IP. Nevertheless, Linux also supports other network protocols,
    for example, IPX (previously) implemented by Novell Netware or Appletalk used
    by Macintosh machines. We will only discuss the integration of a Linux machine
    into a TCP/IP network. To this end, integrating a host with an ethernet card into
    a LAN (Local Area Network) will be discussed. To integrate “exotic” arctek, token
    ring, or FDDI network cards, find further help on this in the kernel sources /usr/src/linux/Documentation.


    # Changes in SuSE Linux 8.0


    With SuSE Linux 8.0, extensive changes have been made to the network configuration.
    Therefore, even an experienced network administrator should read the file /usr/share/doc/packages/sysconfig/README.
    All changes are documented there, particularly the ones made after this manual
    was printed, which can only be found in this file.


    The most important modifications of the network configuration are the following:


    +   - There are no longer network specific settings to be made in the file `/etc/rc.config`.

    +   - The directory `/etc/sysconfig/network` now contains the network-related
    configuration files.

    +   - `ifconfig` and `route` are replaced by package `ip` and package `iproute2`.


    For detailed information on how these changes affect network configuration, see
    the relevant sections.


    # Preparing


    The machine has to have a supported network card. Normally, the network card will
    already be recognized during installation and the appropriate driver mounted.
    See if your card has been integrated properly by entering the command `ifstatus
    eth0`. The output should show the status of the network device eth0.'
  merge: -1
  img_proc: true
- pgno: 348
