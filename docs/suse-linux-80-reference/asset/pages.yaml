- pgno: 262
  md: '`{start}` first address for shared memory. Some drivers use the four lowest
    bits for the debug level. The Lance uses them for its DMA channel.


    `{end}` last address for shared memory. The 3COM 3c503 driver uses this parameter
    to distinguish between internal and external transceivers.


    `{xcvr}` Type of transceiver. The Cabletron E211X card uses the lowest four bits
    for selecting the media.


    `{Name}` The interface''s name (normally eth0)


    # *Table 10.3: Variable Names for Ethernet Network Cards*


    This parameter lets the kernel recognize more than one network card, since only
    the first card is searched by default. This can easily be done with:


    ```

    ether=0,0,eth1

    ```


    By passing 0 for both IRQ and address, the driver is told to launch *auto-probing*,
    which means probing several addresses independently.


    A more complex example:


    ```

    ether=10,0x310,3,0x3c509,eth0

    ```


    This configures the 3c509 card detected first with an IRQ of 10, the address 0x310,
    and with a 10base2 (BNC) connection.


    +   - **Floppy disk drives**

