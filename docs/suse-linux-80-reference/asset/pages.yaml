    \ (Section *Installing and Uninstalling LILO* on the facing page).\n\n+   - **password={password}**\n\
    +   \n+     May be located either in a global or system-specific section. Provides\
    \ secure access to LILO services or booting the corresponding system by means\
    \ of a password. If you take this security seriously, remove the password from\
