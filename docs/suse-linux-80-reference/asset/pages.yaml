- pgno: 294
  md: 'If you have booted from CD or from DOS (via loadlin), these modules are already
    set in linuxrc. This saves tedious loading, but requires additional memory.


    ![](img/a4b6c994843f3fbd688003f4cabfa48f_294_0.png)


    Figure 11.2: Load Modules


    linuxrc offers a list of available drivers. On the left is the name of the module
    and, on the right, a short description of its usage. For some components, there
    are a variety of drivers from which to choose (even never alpha drivers).


    # Passing Parameters


    When you have found a suitable driver, move to it with the cursor and press [Enter].
    This opens a dialog box with an area to add additional parameters for this module.
    More on module parameters can be found in Section *modprobe Parameters* on page
    255.


    Beware that — in contrast to entering the parameters at the kernel prompt (as
    in MILO, SILO, or SYSLINUX) — multiple parameters for the same module must be
    separated here by a blank space.


    In most cases, it is not necessary to specify the hardware in detail. Most drivers
    find their components automatically. Specifying parameters is only necessary if
    you have a network card or an older CD-ROM drive with a proprietary controller
    card. If in doubt, just try pressing [Enter]. Recognizing and initializing certain
    hardware can take some time. Switching to virtual console 4 (Alt + F4) lets you
    watch the kernel messages while loading. SCSI drivers need a while, as they have
    to wait for each device to load.'
