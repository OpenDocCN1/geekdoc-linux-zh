    \ able to follow exactly how LILO saves the locations of its files and which BIOS\
    \ device numbers LILO uses for related hard disks in `/boot/lilo.log`.\n\n+  \
    \ 3. Check the consistency of the hard disk geometry. This actually pertains to\
    \ up to four aspects:\n+   \n+      (a) **Geometry used by LILO** — See the log\
