- pgno: 241
  md: 'The standard SuSE kernel, written to disk during installation and found in
    a correctly installed system, under `/boot`, is configured to support as wide
    a range of hardware as possible. If you have made the right selection during the
    installation or update, this kernel will be specifically optimized for your processor.
    Therefore, it is not necessary to compile your own kernel. However, if you want
    to test experimental features and drivers, you might need to generate a new kernel.
    You will certainly get an interesting insight into the current state of development.


    Several Makefiles are provided with the kernel to automate the process. These
    Makefiles handle nearly all the details for you. The only thing you have to do
    by hand is make selections for hardware settings and other kernel features.


    # Kernel Sources


    To build a kernel, the following packages must be installed: the kernel sources
    (package `kernel-source`), the C compiler (package `gcc`), the GNU binutils (package
    `binutils`), and the include files for the C compiler (package `glibc-devel`).
    They are located in series D (Development). In any case, it is highly recommended
    to install the C compiler, since the C language is inseparable from UNIX operating
    systems.


    The kernel sources are located in `/usr/src/linux`. If you plan to experiment
    with different kernels, unpack them in different subdirectories and create a symbolic
    link to the current kernel source. Since there are software packages that rely
    on the sources being in `/usr/src/linux`, you should maintain this directory as
    a symbolic link to your current kernel source to provide an error-free compilation
    of system programs that need to access the kernel sources.


    # Kernel Modules


    Many drivers and features no longer have to be compiled directly into the kernel,
    but can be loaded at run time as kernel modules. The drivers to compile into the
    kernel and to load as run-time modules is defined in the kernel configuration.
    Kernel modules are located at `/lib/modules/<Version>`, where `<Version>` is the
    current kernel version.'
  merge: -1
  img_proc: true
- pgno: 242
  md: "# 10\nThe Kernel and Kernel Parameters\n\nBasically, components not required\
    \ for booting the system should be built as modules. This makes sure the kernel\
    \ does not get too big to be loaded by the BIOS or a boot loader. Drivers for\
    \ ext2, the SCSI drivers on a SCSI-based system, and similar drivers should be\
    \ compiled into the kernel. In contrast, items such as isofs, msdos, or sound,\
    \ which are not needed for starting your computer system, may be built as modules.\n\
    \n# Handling Modules\n\nThe following commands are available:\n\n+   - `insmod`\
    \  \n+     insmod loads the requested module after searching for it in a subdirectory\
    \ of `/lib/modules/(Version)`. It is better, however, to use modprobe (see below)\
    \ rather than insmod.\n+   \n+   - `rmmod`  \n+     Unloads the requested module.\
    \ This is only possible if this module is no longer needed. For example, the isofs\
    \ module cannot be unloaded while a CD is still mounted.\n+   \n+   - `depmod`\
    \  \n+     Creates the file `modules.dep` in `/lib/modules/(Version)` that defines\
    \ the dependencies of all the modules. This is necessary to ensure that all dependent\
    \ modules are loaded with the selected ones. If `START_KERNEL` is set in `/etc/rc.config`,\
    \ this file will be rebuilt each time the system is started.\n+   \n+   - `modprobe`\
    \  \n+     Loads or unloads a given module while taking into account dependencies\
    \ of this module. This command is extremely powerful and can be used for a lot\
    \ of things (e.g., probing all modules of a given type until one is successfully\
    \ loaded). In contrast to insmod, modprobe checks `/etc/modules.conf` and therefore\
    \ is the preferred method of loading modules. For detailed information on this\
    \ topic, refer to the corresponding man page.\n+   \n+   - `lsmod`  \n+     Shows\
    \ which modules are currently loaded as well as how many other modules are using\
    \ them. Modules started by the kernel daemon are tagged with `autoclean`. This\
    \ label denotes that these modules will automatically be removed once they reach\
    \ their idle time limit."
  merge: -1
  img_proc: true
- pgno: 243
  md: "+   - `modinfo`  \n+     Shows detailed module information.\n\n# /etc/modules.conf\n\
    \n`/etc/modules.conf` affects how modules are loaded. Refer to the man page for\
    \ depmod (`man depmod`).  \nEnter the parameters for modules that access hardware\
    \ directly in this file. Such modules may need system-specific options (e.g.,\
    \ CD-ROM driver or network driver). The parameters entered here are for the most\
    \ part identical to those given to the boot prompt of the kernel; for example,\
    \ with LILO (see Section *Kernel Parameters at the Boot Prompt* on page 240),\
    \ but in many cases the names used at the boot prompt are different (to compare\
    \ these, see Section *modprobe Parameters* on page 255). If a module failed to\
    \ load, try specifying the hardware in this file and use modprobe instead of modprobe\
    \ to load the module.\n\n# Kmod — the Kernel Module Loader\n\nThe kernel module\
    \ loader is the most elegant way to use modules. Kmod performs background monitoring\
    \ and makes sure the required modules are autoloaded when modprobe is run as soon\
    \ as the kernel’s functionality is activated. To use Kmod, set the corresponding\
    \ variable in the kernel configuration ‘Kernel module loader’ (CONFIG_KMOD). \
    \ \nDrivers needed to access the root file system should be compiled directly\
    \ into the kernel. Do not configure your SCSI driver or your file system (normally:\
    \ ext2) as modules.\n\n> > **Caution**  \n> > As SuSE Linux uses initrd (initial\
    \ ramdisk) and integrates the SCSI driver, for example, via initrd, you must make\
    \ sure after compiling your own kernel that you adjust the variable INITRD MODULES\
    \ in the file `/etc/sysconfig/kernel` (Section *Security and Local Administration\
    \ Services* on page 316) and comment out the `initrd` line in `/etc/lilo.conf`\
    \ (see Section *Possible Difficulties — Self-Compiled Kernels* on page 280). If\
    \ you do not do this, the kernel will hang when booted.  \n> > **Caution**\n\n\
    Kernel modules come in handy for rarely-used functionality, such as parport and\
    \ printer support, drivers for floppy drives, and for certain file systems used\
    \ only sporadically."
  merge: -1
  img_proc: true
- pgno: 244
  md: "Kmod is not designed to automatically upload modules. The potential saving\
    \ in memory is only marginal for the RAM capacity of computers today. See also\
    \ `/usr/src/linux/Documentation/kmod.txt`. For reasons of performance, it is better\
    \ for server machines, which have special tasks to perform and need only a few\
    \ drivers, to have a “monolithic” kernel.\n\n# Kernel Configuration\n\nThe configuration\
    \ of the kernel that was installed or updated is saved in the file `/usr/src/linux/.config`.\n\
    \nThe kernel can be configured at the command line, in a menu in text mode, or\
    \ in a menu in the X Window System. Here is a short overview of these three methods.\n\
    \n> **Tip**\n> \n> To use an already existing `.config`, just type `make oldconfig`\
    \ then proceed as described in Section *Compiling the Kernel* on the next page.\n\
    \n# Configuration on the Command Line\n\nTo configure the kernel, change to `/usr/src/linux`\
    \ and enter `make config`. You are asked to choose the options you want supported\
    \ by the kernel to build. There are two or three possible answers here: `Y`, `N`,\
    \ or `M`. `n` means that this device is not compiled directly into the kernel,\
    \ but as a module instead. Any driver needed to boot the system should be integrated\
    \ into the kernel, not loaded as a module. If you press any other key, get a short\
    \ help text about the current option.\n\n# Configuration in Text Mode\n\nA much\
    \ more convenient way of configuring the kernel can be achieved by typing `make\
    \ menuconfig`. With menuconfig you do not have to go through all the questions:\
    \ just make the few changes you want."
  merge: -1
  img_proc: true
- pgno: 245
  md: '# Configuration in the X Window System


    If you have installed and configured the X Window System (package `xf86`) and
    Tcl/Tk (package `tcl` and package `tk`), you can use `make xconfig` as an alternative.
    You will be presented with a GUI (Graphical User Interface) that makes kernel
    configuration very user-friendly. You should have started the X Window System
    as root or you will have to take additional steps like taking over the display
    from another user.


    # Settings in the Kernel Configuration


    All the kernel’s configuration options cannot be covered here in detail. Make
    use of the numerous help texts available on kernel configuration. The latest kernel
    documentation is always in `/usr/src/linux/Documentation`.


    # Compiling the Kernel


    > > **Tip**

    > >

    > > You may remove the comment sign `#` in the main Makefile (approximately line
    92). That is the line containing `EXPORT_INSTALL_PATH=/boot`. This lets you install
    your own kernel to `/boot`.


    We recommend compiling a “bzImage”. As a rule, this avoids the problem of the
    kernel getting too large, as can easily happen if you select too many features
    and create a “zImage”. You will then get error messages like “kernel too big”
    or “System is too big”.


    After customizing the kernel configuration, start compilation by entering:


    ```

    earth:/usr/src/linux # make dep

    earth:/usr/src/linux # make clean

    earth:/usr/src/linux # make bzImage

    ```


    These three commands can be entered on one line as well. They are started one
    after the other. This might be useful for compiling a kernel overnight, for example.
    Just enter:


    ```

    earth:/usr/src/linux # make dep clean bzImage

    ```


    Depending on your system, it will take a few minutes for the kernel to recompile.
    During the compilation, you can still work on one of the other consoles.'
  merge: -1
  img_proc: true
- pgno: 246
  md: 'After a successful compilation, you will find the compressed kernel in `/usr/src/linux/arch/i386/`subarch`/boot`.
    The kernel image — the file that contains the kernel — is called `bzImage`. If
    you cannot find this file, an error probably occurred during the kernel compilation.
    This can easily be overlooked due to the large amount of screen output. If an
    error has taken place, this can be determined by launching the kernel compilation
    again, with


    ```

    earth:/usr/src/linux # make bzImage

    ```


    and watching for corresponding error messages. However, errors do not occur very
    often while the kernel is compiling.


    If you are using the bash shell, enter:


    ```

    earth:/usr/src/linux # make bzImage 2>&1 | tee kernel.out

    ```


    for writing the compilation output to `kernel.out`. If you are using the tcsh
    shell, use the following command:


    ```

    earth:/usr/src/linux # make bzImage |& tee kernel.out

    ```


    If you have configured parts of your kernel to be loaded as modules, you will
    have to launch the module compilation. This can be done by typing:


    ```

    earth:/usr/src/linux # make modules

    ```


    # Installing the Kernel


    After the kernel is compiled, it must be installed so it can be booted. If you
    use LILO, LILO must be reinstalled as well. In the simplest case, copy the new
    kernel to `/boot/vmlinuz` (see Section *Compiling the Kernel* on the facing page)
    then run LILO. To prevent unpleasant surprises, however, it is recommended that
    you keep the old kernel (`/boot/vmlinuz.old`) at first, so that you can still
    boot it if the new kernel does not function as expected:


    ```

    earth:/usr/src/linux # cp /boot/vmlinuz /boot/vmlinuz.old

    earth:/usr/src/linux # cp arch/i386/boot/bzImage /boot/vmlinuz

    earth:/usr/src/linux # lilo

    ```


    The Makefile target `make bzlilo` performs these three steps in one go. Now the
    compiled modules need to be installed. By entering:


    ```

    earth:/usr/src/linux # make modules_install

    ```


    copy these to the correct directories in `/lib/modules/(Version)`. This overwrites
    the old modules with the same kernel version. However, the original modules can
    be reinstalled together with the kernel from the CDs.'
  merge: -1
