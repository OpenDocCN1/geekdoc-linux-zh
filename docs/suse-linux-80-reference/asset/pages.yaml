- pgno: 16
  md: '# Installation with YaST2


    The new SuSE Linux installation system simplifies initial installation and configuration.
    It checks your system for hardware and any previous SuSE Linux installations.
    YaST2 then provides a series of suggestions based on that information. Either
    accept these suggestions or modify them individually as desired. This chapter
    contains information that may be helpful in modifying the suggestions or reconfiguring
    them later.


    +   - Starting Your System from the CD-ROM ................. 6

    +   - The Opening Screen ................................. 6

    +   - YaST2 Takes Over ................................... 7

    +   - Selecting a Language ................................ 7

    +   - Installation Mode ................................... 7

    +   - Installation Suggestions ............................ 8

    +   - Mouse ............................................... 8

    +   - Time Settings ....................................... 9

    +   - Keyboard Layout ..................................... 9

    +   - Partitioning ........................................ 10

    +   - Scope of Installation ............................... 16

    +   - LILO — Installation .................................. 21

    +   - Starting Installation ............................... 22

    +   - System Configuration ................................. 22

    +   - Hardware Configuration ............................... 26

    +   - Graphical Login ...................................... 27'
