- pgno: 248
  md: '# Cleaning Your Hard Disk After Compilation


    If you are low on hard disk space, delete the object files generated during kernel
    compilation using `make clean` in the `/usr/src/linux` directory. If you have
    plenty of disk space and plan to reconfigure the kernel on a regular basis, you
    might want to skip this. Recompiling the kernel is considerably faster then, since
    only the parts affected by changes will actually be recompiled.'
  merge: -1
