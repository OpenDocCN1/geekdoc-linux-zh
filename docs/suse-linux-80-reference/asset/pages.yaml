- pgno: 95
  md: "# Runlevel Editor\n\nRunlevels in Linux are described in more detail in Section\
    \ *Runlevels* on page 298 pp.\n\nAfter this expert module starts, it will be initialized.\
    \ The current default run-level will be shown in the next dialog. This “operation\
    \ mode” will start after your system boots. In SuSE Linux this is usually runlevel\
    \ 5 (full multiuser operation with network and KDM, the graphical login). Runlevel\
    \ 3 also works well (full multiuser operation with network). At this point, with\
    \ the help of YaST2, a different default runlevel can be set. See Table 12.1 on\
    \ page 299. ‘Edit’ continues to an overview of all the services and daemons, supplemented\
    \ with information as to whether they have been activated on your system and for\
    \ which runlevels. Highlight a line with the mouse and activate the check boxes\
    \ for runlevels ‘0’, ‘1’, ‘2’, ‘3’, ‘5’, ‘6’, and ‘S’ and, with that, state which\
    \ service or daemon should be activated for which runlevel. Runlevel 4 is undefined—this\
    \ is always reserved for custom settings.\n\nWith ‘Start’ and ‘Stop’, decide whether\
    \ a server should be implemented. The current status is checked via ‘Update’,\
    \ if this has not already been done automatically. ‘Reset to default value’ allows\
    \ you to restore the default settings to their initial state following installation.\
    \ ‘Activate service’ will only appear if the service is currently disabled. ‘Reset\
    \ all services to default value’ restores all services to their original state\
    \ following installation. ‘Finish’ saves the system configuration.\n\n> **Caution**\n\
    > \n> Caution, no experiments here — this is an expert tool. If certain service\
    \ settings are wrong, the system may not be able to be restarted, possibly requiring\
    \ a reinstallation from scratch, or security gaps could turn up in your system.\n\
    \n# Expert Partitioner\n\nThe partitioning module enables editing and deletion\
    \ of existing partitions, as well as the creation of new ones. Access Soft RAID\
    \ and LVM configuration from here.\n\nIn normal circumstances, partitions are\
    \ specified during installation. However, it is possible to integrate a second\
    \ hard disk in an already existing Linux system. First, the new hard disk must\
    \ be partitioned. Then it must be mounted and entered into the `/etc/fstab` file.\
    \ It may be necessary to copy some of the data to move an `/opt` partition from\
    \ the old hard disk to the new one."
