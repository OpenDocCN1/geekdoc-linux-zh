- pgno: 216
  md: "+   - `status queue` — issues a status report\n+   - `disable queue` — blocks\
    \ new jobs from entering the queue\n+   - `enable queue` — opens the queue for\
    \ new jobs\n+   - `stop queue` — stops the printing of jobs in the queue. The\
    \ job currently being printed will be finished, however.\n+   - `start queue`\
    \ — resumes printing of jobs in the queue\n+   - `down queue` — works like disable\
    \ and stop together\n+   - `up queue` — has the same affect as enable and start\
    \ together\n+   - `abort queue` — is the same as down, except that a job currently\
    \ being printed will be stopped immediately. The jobs are retained in the queue\
    \ and can continue to be processed after restarting the queue with up.\n\nPass\
    \ these commands to `lpc` directly in the command line (e.g., `lpc status`) or\
