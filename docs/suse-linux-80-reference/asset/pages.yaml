- pgno: 220
  md: "Manually adjust the print filter configuration files to add any special settings.\
    \ Every queue has its own separate configuration file `/etc/lpdfilter/queue/conf`\
    \ (replace queue here with the actual queue name), which also contains information\
    \ on each option.\n\n# Adding Special Settings to the Print Filter\n\n+   1. If\
