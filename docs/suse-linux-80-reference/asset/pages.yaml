- pgno: 23
  md: '![](img/a4b6c994843f3fbd688003f4cabfa48f_23_0.png)


    *Figure 2.6: The SuSE Linux Partitioner*


    # Resizing a Windows Partition


    This section assumes the hard disk selected contains Windows 9x or ME. The following
    instructions also apply to Windows XP, if it is installed on a disk formatted
    with the FAT file system. However, if Windows NT, 2000, or XP is installed on
    an NTFS file system, the partition size cannot be reduced.


    If you have a computer on which Windows XP was preinstalled, it is most likely
    running on an NTFS. If you want to reduce the partition size, it is first recommended
    to repartition the whole system and reinstall your Windows XP using your XP installation
    CDs later, preferably with FAT 32 as your file system so that in the future you
    will be able to resize all partitions.


    If there is not enough space for SuSE Linux, choose between two options: either
    completely delete Windows from the hard disk or reduce the Windows partition to
    create enough space for the SuSE Linux installation. See Figure 2.8 on page 14.'
  merge: -1
  img_proc: true
- pgno: 24
  md: "![](img/a4b6c994843f3fbd688003f4cabfa48f_24_0.png)\n\n*Figure 2.7: Selecting\
    \ the Hard Disk*\n\nYaST2 gives a reasonable resizing suggestion for your Windows\
    \ partition. However, it can be modified manually using the method described below.\
    \ If you decide to delete Windows, all data will be irrevocably lost during Linux\
    \ installation.\n\n> **Caution**\n> \n> The Windows Resizer only works if your\
    \ computer has a hard disk with exactly one Windows partition (usually the case\
    \ for most preinstalled Windows computers). Otherwise, you will have to manually\
    \ partition your hard disk.\n\nBefore reducing your Windows partition, boot your\
