- pgno: 158
  md: "# Starting the X Window System\n\nThe X Window System is started with the command\
    \ `startx`. A preconfigured GUI for the KDE window manager is provided for all\
    \ users. We recommend starting the X Window System from a regular user account,\
    \ not as root. X11 server error messages are saved in the `~/.x.err` file and\
    \ `/var/log/XFree86.0.log`. The `startx` command has a few options. For instance,\
    \ you can select 16-bit color depth by typing `startx -- -bpp 16`.\n\n# FAQ and\
    \ Troubleshooting\n\n+   1. **How can the installed graphics card be detected?**\n\
    +      If you do not know what graphics card is on your system, query a list of\
    \ all the cards installed and supported on your system with `sax2 -p`.\n+   \n\
    +   2. **How can I accelerate the start-up of SaX2?**\n+      Provided that the\
    \ hardware has not been modified since SaX2 was last started, significantly accelerate\
    \ start-up using the `sax2 -q` command. In this case, no hardware detection takes\
    \ place. This option is quite useful, especially when reconfiguring. If you have\
    \ started SaX2 via a fastpath, do not give the `-q` option, because the fastpath\
    \ automatically sets this.\n+   \n+   3. **What if the graphics card is not supported?**\n\
    +      If no driver exists for the card’s graphics chipset, you still have the\
    \ option of using the graphics card’s framebuffer. This has the advantage that\
    \ it functions well with almost any modern graphics card and practically any laptop.\
    \ Since the card’s graphics controller is to be circumvented in the absence of\
    \ a driver, the display is accelerated. The X server simply accesses the framebuffer\
    \ directly after having already been switched to graphics mode when the kernel\
    \ starts.\n+   \n+      This works as follows: The Linux kernel loads the card’s\
    \ VGA BIOS at start-up and instructs it to switch to a given VESA graphics mode.\
    \ The text console will be displayed in this configured graphics mode. Unfortunately,\
    \ the VGA BIOS is written in 16-bit code so cannot be loaded in a running Linux\
    \ system. As a consequence, the video mode determined when booting is retained\
    \ until shutdown.\n+   \n+      To use this VESA framebuffer, support must be\
    \ provided by the kernel and the graphics mode selected when booting. The SuSE\
    \ Linux kernel, of course, includes VESA framebuffer support. Select your desired\
    \ graphics mode when booting the system. Pass the parameter `vga=x` to the LILO\
    \ boot prompt, where x stands for a value obtained from Table 7.2 on the following\
    \ page."
  merge: -1
  img_proc: true
- pgno: 159
  md: '| Preferred Color Depth | 640×480 | 800×600 | 1024×768 | 1280×1024 |

    |---|---:|---:|---:|---:|

    | 256 (8 Bit) | 769 | 771 | 773 | 775 |

    | 32 768 (15 Bit) | 784 | 787 | 790 | 793 |

    | 65 536 (16 Bit) | 785 | 788 | 791 | 794 |

    | 16,7 Mill. (24 Bit) | 786 | 789 | 792 | 795 |


    *Table 7.2: Available VESA Modes*


    Alternatively, specifically state this as a vga parameter in the file `/etc/lilo.conf`.
    This value is not incorporated into the append line, but, instead, written directly
    to the configuration file as vga=x.


    After starting the Linux system, log in again as user root and start SaX2 as follows:


    ```

    `earth:/root # sax2 -m 0=fbdev`

    ```


    Note that 0 is a zero and not an uppercase o. This instructs the X server to utilize
    the driver as framebuffer. Since the resolution, color depth, and image repetition
    rate are strictly defined, you can — if you are satisfied with your mouse and
    keyboard settings — have SaX2 instantly save the automatically detected data then
    exit SaX2 again.


    +   4. **Which file contains the results of the configuration?**


    The entire X11 configuration is stored in a file called XF86Config. Find this
    file under `/etc/X11/XF86Config`.


    +   5. **What if the graphics card is supported but not recognized by SaX2?**


    In very rare instances, you may have a graphics card that is supported by XFree86,
    but not recognized by SaX2. In this case, it will be necessary to specify the
    name of the driver module the card supports using the command `sax2 -m 0=<driver>`.
    The option -m assigns a number to a driver name. For example, if you want to assign
    the module nvidia to the primary card that always bears the number 0, the command
    would read `sax2 -m 0=nvidia`. A complete list of all the driver modules can be
    found at `http://www.xfree86.org/4.1.0/Status.html`.


    +   6. **What if SaX2 crashes when testing the X server?**


    In rare cases, SaX2 or even the system can crash when a completed configuration
    is followed by an X server test. This usually means that the driver is faulty,
    which is only significant if more than one X server is started at a time. To prevent
    this, proceed as follows:'
