- pgno: 191
  md: 'Uncompressed audio data of CD quality takes up almost 10 MB per minute. Therefore,
    the MP3 encoding procedure was developed at the Fraunhofer Institute. Unfortunately,
    this procedure is patented. Companies that sell MP3 encoders must pay licensing
    fees. For this reason, the high-performance MP3 encoder developed for Linux, Lame,
    is not included in our distribution, although its source code falls under the
    GPL. Obtain more information about the legal status at the project’s web site,
    http://lame.sourceforge.net. Using Lame is only permitted for research purposes
    in some countries, including Germany and the USA.


    Ogg Vorbis is a free compressed audio format. The Ogg format is already supported
    by KoNCD, xmms, terminatorX, and many other players. This project’s web site can
    be found at http://www.xiph.org/ogg/vorbis. The vorbis-tools package includes
    an encoder and a simple player. The encoder is started at the command line with
    oggenc. The WAV file to compress is the only required parameter. The option `-h`
    presents a summary of additional parameters. In the latest version, the Ogg encoder
    even supports coding with variable bit rate. This way, an even higher compression
    rate can be obtained with the same quality. Parameters can also be specified for
    the bit rate itself. The parameter `-b` defines the average bit rate. `-m` and
    `-M` specifies the minimum and maximum bit rate. Instead of the bit rate, the
    parameter `-q` for the desired quality can be given.


    ogg123 is an Ogg player for the command line. As a parameter, specify the device
    to use for playback. Start the application with a command like


    ```

    ogg123 -d alsa09 mysong.ogg

    ```


    # Buffering and Latencies


    This section explains how to guarantee interruption-free audio playback. This
    is not solely a Linux problem, but a problem that exists for all multitasking
    operating systems. Normally in a multitasking operating system, several processes
    are running simultaneously. Since the processor can only execute one process at
    a time, each process is given a certain amount of processor time by the operating
    system’s scheduler. The switching action between processes normally happens so
    quickly that the user does not notice anything at all.

    For audio output, however, this phenomenon is noticeable in the form of short
    interruptions or clicks. Audio programs therefore use a cache (buffering) for
    output. The audio data stored in the cache will continue to be relayed to the
    output of the sound card, even when the audio application is interrupted by the
    scheduler. A cache large enough to bridge the longest interruptions guarantees
    click-free output.'
  merge: -1
  img_proc: true
- pgno: 192
  md: 'There are conflicting interests in this. The cache size defines the reaction
    time, or the latency, of the application. Especially given interactive applications,
    such as real-time synthesizers and DJ mixer consoles, it is important to keep
    the cache size as small as possible. Basically, the length of interruptions is
    dependent on system load and processor priority. As a consequence, the cache size
    required for click-free output is lessened by increasing the audio application''s
    priority. Therefore, many audio applications attempt to switch their process to
    real-time priority. However, this is only possible when these applications are
    running with root privileges.


    It is always risky to run an application in root mode, because the application
    is allowed to perform any action. A security risk presents itself if the computer
    is connected to the Internet. If this is the case, unauthorized users could take
    advantage of security holes in the application to gain access to your system.


    > > **Caution**

    > >

    > > The commands described in the following should never be executed on machines
    accessible from the Internet or on machines that would suffer serious consequences
    from a system crash or data loss.


    You should use the su􏰀 mechanism to run an application as root. Our example uses
    the timidity++ application. To enable all users to run timidity++ on their system
    with root privileges, modify the /etc/sudoers file. See the man page for sudo
    (man sudo) and the man page for sudoers (man sudoers) for information. Start visudo
    as root and add the following line to the end of the /etc/sudoers file:


    ```

    ALL     ALL=(ALL) /usr/bin/timidity

    ```


    Now all users on the system will be able to start timidity in root mode with sudo
    timidity. A request for the user’s individual password follows if more than five
    minutes have passed since the last sudo command.


    # ALSA and MIDI


    series snd, package alsa, package alsa-review, yk?ehd

    As well as playing PCM data, many sound cards also feature MIDI functionality.
    The ALSA MIDI sequencer implements a powerful architecture for routing MIDI data.'
  merge: -1
  img_proc: true
- pgno: 193
  md: 'Many sound cards possess an external MIDI port for connecting MIDI devices,
    such as synthesizers, keyboards, and sound modules. If the card’s MIDI port is
    supported by ALSA, you can record MIDI files over this port using a sequencer
    application (e.g., jazz). Find a list of the MIDI devices provided by your card
    in the KDE Control Center under ‘Sound’ → ‘Midi’. Also specify which of these
    devices should be used to play MIDI files. Use the command `pmidi -l` to list
    all available MIDI devices and their internal ALSA port numbers. For a “Soundblaster
    Live!” card, for example, this list would appear as follows:


    | Port | Client name | Port name |

    |---|---|---|

    | 72:0 | External MIDI 0 | MIDI 0-0 |

    | 73:0 | Emu10k1 WaveTable | Emu10k1 Port 0 |

    | 73:1 | Emu10k1 WaveTable | Emu10k1 Port 1 |

    | 73:2 | Emu10k1 WaveTable | Emu10k1 Port 2 |

    | 73:3 | Emu10k1 WaveTable | Emu10k1 Port 3 |


    *File 13: Soundblaster Live! MIDI Devices*


    The first column contains the internal port numbers by which the device responds
    to the ALSA driver. Under the remaining columns, find the client and port names
    of each device. Along with the external MIDI port already mentioned, find several
    WaveTable ports. Use a command like `pmidi -p 73:0 mysong.mid` to play a MIDI
    file over one of the ports listed above.


    > > **Note**

    > >

    > > Interrupting a MIDI player during playback can leave a continuous sound playing.
    If this happens, run the `all_notes_off` script or restart ALSA with `rcalsasound
    restart` as root.


    Many sound cards, such as Soundblaster AWE and Live!, have an internal WaveTable
    synthesizer. This converts MIDI events into audible sounds. These MIDI events
    can either be relayed to the WaveTable synthesizer by an external MIDI keyboard
    or by an application (e.g., MIDI player or sequencer). If you have a Soundblaster
    AWE or a Soundblaster Live! card, initialize the WaveTable synthesizer with sound
    fonts to make sounds audible. If you do not have such a card, skip the next section.'
  merge: -1
  img_proc: true
- pgno: 194
  md: "# Loading Sound Fonts (SB Live! and AWE)\n\nThe package uses the `sfload` command\
    \ for loading sound fonts in Soundblaster AWE and Live! cards. The relevant sound\
    \ font files can be found on your sound card’s driver CD. The ALSA start-up script\
    \ can automatically load the required sound fonts for the WaveTable synthesis,\
    \ if the appropriate files pertaining to the Creative Driver CD have been installed\
    \ with YaST2. Currently, the script only works for one sound card. However, ALSA\
    \ can easily manage up to eight sound cards. Then load the sound fonts with the\
    \ command `sfload -D n /usr/share/sfbank/creative/8MBGM.SF2`. `{n}` stands for\
    \ the number of the sound card. This number does not necessarily correspond to\
    \ the order in which the cards were configured. Find the number in YaST2 under\
    \ ‘Hardware’.\n\nIf your driver CD is not available, you can also load already\
    \ installed sound fonts in `/usr/share/sounds/sf2`. The sound font `Vintage_Dreams_Waves_v2.sf2`\
    \ by Ian Wilson contains 128 analog synthesizer sounds and 8 drum sets. It is\
    \ compatible with both SB AWE and SB Live! cards. The ROM sound font `gun1-rom.sf2`\
    \ by Samuel Collins is only compatible with SB AWE cards. It provides an extended\
    \ general MIDI bank for these cards. Review the copyright files and documentation\
    \ in `/usr/share/doc/packages/snd_sf2`. More sound fonts can be found on the Internet.\
    \ See `http://www.hammersound.net`.\n\n> > **Tip**\n> > \n> > ALSA currently only\
    \ supports a maximum sound font size of 32 MB.\n\n# vkeybd — Virtual MIDI Keyboard\n\
    \nIf you do not have an external MIDI keyboard connected to your sound card, use\
    \ the virtual keyboard vkeybd. The internal port numbers listed previously via\
    \ `pmidi -l` are especially of importance here. The application is started at\
    \ the command line by entering `vkeybd --addr 73:0`. The port address might differ\
    \ on your system. Specify the first WaveTable port in the list. If an external\
    \ sound generator is connected, you can specify the external MIDI port here.\n\
    \nvkeybd recognizes a series of additional options. Increase the number of octaves\
    \ to five, for example, with `vkeybd --addr 73:0 --octave 5`. Obtain a summary\
    \ of the command line options with `vkeybd --help` or in the man page for vkeybd\
    \ (`man vkeybd`)."
  merge: -1
  img_proc: true
- pgno: 195
  md: "![](img/a4b6c994843f3fbd688003f4cabfa48f_195_0.png)\n\n*Figure 8.5: vkeybd\
    \ — Complete Virtual MIDI Keyboard*\n\nThe instrument names in the preset list\
    \ are configurable by specifying a preset file using the `--preset` option. The\
