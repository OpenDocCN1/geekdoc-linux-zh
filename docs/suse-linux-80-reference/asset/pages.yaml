  md: '# The Kernel and Ker-

    nel Parameters


    The kernel is the heart of the system. Although the following sections will not
    teach you how to be a kernel “hacker,” they will introduce you to the world of
    kernels. Included are the basics of compiling a customized kernel.


    +   - Kernel Sources ........................................ 230

    +   - Kernel Modules ........................................ 230

    +   - Kernel Configuration .................................. 233

    +   - Settings in the Kernel Configuration .................. 234

    +   - Compiling the Kernel .................................. 234

    +   - Installing the Kernel .................................. 235

    +   - Creating a Boot Disk .................................. 236

    +   - Cleaning Your Hard Disk After Compilation ............. 237

    +   - Drivers in the Kernel .................................. 238

    +   - Some Tips on Drivers and Parameters ................... 239

    +   - The Parameters ........................................ 239'
