- pgno: 96
  md: 'Use caution if you want to repartition the hard disk you are working on — this
    is essentially possible, but you will have to reboot the system right afterwards.
    It is a bit safer to boot from CD then repartition it. The ‘Experts…’ button reveals
    a pop-up menu containing the following commands:


    **Reread Partition Table** Rereads the partitioning from disk. For example, you
    will need this for manual partitioning in the text console.


    **Adopt Mount Points from Existing /etc/fstab** This will only be relevant during
    installation. Reading the old `fstab` is useful for completely reinstalling your
    system rather than just updating it. In this case, it is not necessary to enter
    the mount points by hand.


    **Delete Partition Table and Disk Label** This completely overwrites the old partition
    table. For example, this can be helpful if you have problems with unconventional
    disk labels. Using this method, all data on the hard disk will be lost.


    # Logical Volume Manager (LVM)


    The Logical Volume Manager (LVM) enables flexible distribution of hard disk space
    over several file systems. As it is difficult to modify partitions on a running
    system, LVM was developed: it provides a virtual “pool” (Volume Group — VG for
    short) of memory space, from which logical volumes (LV) can be generated if needed.
    The operating system will access these instead of the physical partitions.


    Features:


    +   - Several hard disks or partitions can be combined into a large logical partition.

    +   - If a LV (e.g., `/usr`) is full, it can be enlarged with the appropriate
    configuration.

    +   - With the LVM, even append hard disks or LVs in a running system. However,
    “hot-swappable” hardware, designed for these types of interventions, is required
    for this.'
  merge: -1
  img_proc: true
- pgno: 97
  md: 'Implementing LVM already makes sense for heavily used home PCs or small servers.
    If you have a growing data stock, as in the case of databases, MP3 archives, or
    user directories, the Logical Volume Manager is just the right thing for you.
    This would allow you file systems that are larger than physical hard disk. Another
    advantage of the LVM is up to 256 LVs can be added. Keep in mind that working
    with the LVM is very different than working with conventional partitions.


    Instructions and further information on configuring the “Logical Volume Manager”
    (LVM) can be found in the official LVM HOWTO and the SuSE documentation:


    +   - http://www.sistina.com/lvm/Pages/howto.html

    +   - http://www.suse.com/us/support/oracle/.


    # Soft RAID


    The purpose of RAID (Redundant Array of Inexpensive Disks) is to combine several
    hard disk partitions into one large “virtual” hard disk for the optimization of
    performance and data security. Using this method, however, one advantage is sacrificed
    for another. “RAID level” defines the pool and common triggering device of all
    hard disks, known as the RAID controller. A RAID controller mostly uses the SCSI
    protocol, because it can drive more hard disks better than the IDE protocol. It
    is also better able to process parallel running commands. Instead of a RAID controller,
    which can often be quite expensive, the Soft RAID is also able to take on these
    tasks. SuSE Linux offers the option of combining several hard disks into one Soft
    RAID system with the help of YaST2 — a very reasonable alternative to Hardware
    RAID.


    # Customary RAID Levels


    **RAID 0** This level improves the performance of your data access. Actually,
    this is not really a RAID, because it does not provide data backup, but the name
    “RAID 0” for this type of system has become the norm. With RAID 0, two hard disks
    are pooled together. The performance is very good — although the RAID system will
    be destroyed and your data lost, even if just one of the many remaining hard disks
    fails.'
  merge: -1
  img_proc: true
- pgno: 98
  md: '**RAID 1** This level provides more than adequate backup for your data, since
    the data is copied to another hard disk 1:1. This is known as “hard disk mirroring”
    — if a disk is destroyed, a copy of its contents is located on another one. All
    of them except one could be damaged without endangering your data. The writing
    performance suffers a little in the copying process when using RAID 1 (ten to
    twenty percent slower), but read access is significantly faster in comparison
    to any of the normal physical hard disks, because the data is duplicated so can
    be parallel scanned.


    **RAID 5** RAID 5 is an optimized compromise between the two other levels in terms
    of performance and redundancy. The hard disk potential equals the number of disks
    used minus one. The data is distributed over the hard disks as with RAID 0. “Parity
    blocks”, created on one of the partitions, are there for security reasons. They
    are linked to each other with XOR — thus enabling the contents, via XDR, to be
    reconstructed by the corresponding parity block in case of system failure. With
    RAID 5, no more than one hard disk can fail at the same time. If one is destroyed,
    it must be replaced as soon as possible to save the data.


    Configuration instructions and more details for Soft RAID can be found in the
    HOWTOs at:


    +   - `/usr/share/doc/packages/raidtools/Software-RAID-HOWTO.html`

    +   - `http://www.LinuxDoc.org/HOWTO/Software-RAID-HOWTO.html`


    or over a Linux RAID mailing list, such as:


    +   - `http://www.mail-archive.com/linux-raid@vger.rutgers.edu`


    There you will find help if unexpected complications arise.


    # Miscellaneous


    ‘Miscellaneous’ gives the option of loading vendor driver CDs, and viewing the
    start protocol (`/var/log/boot.msg`) and the system protocol (`/var/log/messages`)
    as well as configure printers for CUPS and LPD. Instructions for this can be found
    in the “Configuration” manual.'
  merge: -1
  img_proc: true
- pgno: 99
  md: '# Printers for CUPS and LPD


    The default setting for printing is the default print system which implements
    the BSD spooler LPD. package lprold is installed on your system for this purpose.
    With the help of YaST2 switch to the CUPS (Common Unix Printing System) printing
    system or from CUPS back to LPD. The old LPD configuration will be retained. Since
    their configurations file overlap somewhat, both printing systems are mutually
    exclusive — only one can be installed at a time. Follow the instructions in YaST2
    for switching to CUPS and keep your CDs at hand. More information on CUPS can
    be found at http://www.cups.org/


    > > **Note**

    > >

    > > The decisive factor for print quality is not whether you are using LPD or
    CUPS, but the related Ghostscript driver and the parameter settings.'
  merge: -1
  img_proc: true
