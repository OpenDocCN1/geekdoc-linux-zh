- pgno: 238
  md: '```

    earth: # cat ascii-file.ibmpc > /dev/lp0

    ```


    should correctly output an ASCII text file on a printer that prints ASCII text
    and uses DOS/Windows characters.

    If this works, it is recommended to create a print filter that performs this conversion
    of the ASCII text file to the printer-specific format automatically.


    # Example of a Custom Print Filter


    First, create a subdirectory for your custom print filter. Then, change to this
    subdirectory (as user root):


    ```

    earth: # mkdir /usr/local/myprinterfilter

    earth: # cd /usr/local/myprinterfilter

    ```


    Create a bash script (as an ASCII text file) with the name asciifilter, as shown
    in File 34.


    ```

    #!/bin/bash


    # make a temporary file

    INPUT="$(mktemp /tmp/asciifilter.$$.XXXXXX)"


    # First store everything from stdin in $INPUT

    # to have the input as a regular file

    cat >$INPUT


    # Recode the INPUT

    recode lat1..ibmpc $INPUT


    # Add a FormFeed at the end of $INPUT

    # to get the last page out of the printer

    echo -en "\f" >>$INPUT


    # Send $INPUT to stdout

    cat $INPUT


    # Remove the INPUT file

    rm $INPUT

    ```


    File 34: /usr/local/myprinterfilter/asciifilter


    Make this script executable for all users with:


    ```

    earth: # chmod -v a+x /usr/local/myprinterfilter/

    ```'
  merge: -1
  img_proc: true
