  md: 'The last command is “cautious” and does not overwrite the partition table.
    Again, *do not forget*: with `fdisk`, mark the desired starting partition as *bootable*.
    A boot sector backup is done quickly and easily. We recommend doing this frequently.


    # Creating a Linux Boot Disk


    A Linux boot disk consists (somewhat simplified) of one or more Linux kernels,
    possibly managed by LILO. It serves to start your system even if it is not possible
    to boot directly from hard disk (possible reasons: overwritten MBR, misconfigured
    boot manager, errors while installing).


    A boot disk such as this loads *only* the kernel. Everything else, including working
    system programs and `init` start scripts, must be provided by the installation
    on the hard disk. The connection between the boot disk and the system on the hard
    disk is established by the fact that, in the kernel, the root partition in question
    is set as the root device.


    Do not confuse this with the SuSE boot disk used for installation and emergencies.
    To create a new SuSE boot disk, copy the appropriate image from the directory
    `disks` on the SuSE CD-ROM to a floppy disk (see Section *The SuSE Rescue System*
    on page 285).


    # Boot Disk Without LILO


    Normally, if your hard disk controller support has been integrated into your kernel,
    your kernel does *not* need any additional command line with hardware information.
    The easiest way to create a boot disk is to write the actual kernel onto a raw
    disk and adjust the root device, if this has not been done before.


    ```

    earth:  # /sbin/badblocks -v /dev/fd0 1440

    earth:  # dd if=my_kernel of=/dev/fd0 bs=18k

    earth:  # rdev /dev/fd0 my_root_partition

    earth:  # rdev -R /dev/fd0 1

    ```


    The last command makes sure the kernel initially mounts root as read-only (the
    start-up scripts expect this).'
  merge: -1
  img_proc: true
