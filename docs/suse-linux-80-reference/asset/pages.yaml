- pgno: 296
  md: "![](img/a4b6c994843f3fbd688003f4cabfa48f_296_0.png)\n\n*Figure 11.4: Entering\
    \ Parameters for a Module to Load*\n\n# The SuSE Rescue System\n\nSuSE Linux contains\
    \ several Linux rescue systems so that in emergencies, your Linux partitions on\
    \ the hard disks are reachable “from the outside”: via a boot disk or the “Rescue”\
    \ System, loaded from disk, CD, the network, or the SuSE FTP server. There is\
    \ also a bootable SuSE Linux CD (the “LiveEval CD”) that can be used as a rescue\
    \ system. The rescue system includes several help programs with which you can\
    \ remedy large problems with inaccessible hard disks, misconfigured configuration\
    \ files, or other similar problems.\n\nAnother aspect of the rescue system is\
    \ Parted, which is used for modifying the partition size. This program can be\
    \ launched from inside the rescue system itself, if you do not want to take advantage\
    \ of the resizer integrated in YaST2. Information on Parted can be found at:\n\
    \nhttp://www.gnu.org/software/parted/\n\n> **Tip**\n> \n> Always have a boot and\
    \ rescue disk at hand, because the slight effort for creating and maintaining\
    \ the disk is negligible in comparison to the time wasted and work involved when,\
    \ in the case of emergency, you cannot access your system or your CD-ROM drive."
  merge: -1
  img_proc: true
- pgno: 297
  md: '![](img/a4b6c994843f3fbd688003f4cabfa48f_297_0.png)


    *Figure 11.5: Selection of Source Media in linuxrc*


    # Preparations


    For setting up your rescue system, you need two disks free of errors: one as a
    future boot disk and the other for the compressed image of a small root file system.
    The image file bootdisk for booting the system and the file rescue for the root
    file system can be found on the first CD in the /disks directory. There are three
    ways to set up the root file system on the disk:


    +   - with YaST

    +   - in a console using the Linux commands


    ```

    earth:  # /sbin/badblocks -v /dev/fd0 1440

    earth:  # dd if=/media/cdrom/disks/rescue of=/dev/fd0 bs=18k

    ```


    +   - at the DOS prompt (where the CD-ROM drive is Q:)


    ```

    Q:\> cd \dosutils\rawrite Q:\dosutils\rawrite> rawrite.exe

    ```


    As of Version 8.0, the rescue disk is currently based on libc5 (SuSE Linux 5.3),
    since it is possible in this to save some programs, such as an editor, fdisk,
    or e2fsck to a disk.'
  merge: -1
  img_proc: true
- pgno: 298
  md: "> **Note**  \n> The rescue disk cannot be mounted, because it is not a file\
    \ system. It only contains the compressed images of one. Directions for reading\
    \ the file system are in the following paragraph.\n\nTo read the image, you will\
    \ need to decompress the image file then mount the decompressed image as user\
    \ root. If your Linux kernel support the loop device, the procedure is as follows:\n\
    \n```\nearth:  # cp /media/cdrom/disks/rescue /root/rescue.gz\nearth:  # gunzip\
    \ /root/rescue.gz\nearth:  # mount -t ext2 -o loop /root/rescue /mnt\n```\n\n\
    # Starting the Rescue System\n\nThe rescue system is launched by the SuSE boot\
    \ disk you created or by your bootable CD or DVD. It is required that the disk\
    \ and CD-ROM or DVD drives are bootable. If necessary, change the boot series\
    \ in the CMOS setup. Following are the steps for starting the rescue system:\n\
    \n+   1. Start your system with the SuSE boot disk created yourself or with the\
    \ first SuSE Linux CD or DVD inserted into the corresponding drive.\n+   2. Launch\
    \ the entire system or choose ‘Manual Installation’ so that ‘boot options’ can\
    \ be entered and kernel modules to load can be defined.\n+   3. Make the respective\
    \ settings for language and keyboard.\n+   4. Select the item ‘Installation/Start\
    \ system’ in the main menu.\n+   5. If you started with the boot disk, now insert\
    \ the installation CD or the rescue disk with the compressed image of the rescue\
    \ system.\n+   6. In the menu ‘Start installation/system’ select the item ‘Start\
    \ rescue system’ (see Figure 3.3 on page 36) then specify the desired source medium\
    \ (Figure 11.6 on the following page).\n\nSubsequently, we will introduce a few\
    \ tips on selection options:\n\n> ‘CD-ROM’: When loading the rescue system, the\
    \ path `/cdrom` is exported. This makes the installation from *this* CD possible."
  merge: -1
