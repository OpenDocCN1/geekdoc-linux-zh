- pgno: 401
  md: '# Access to Netware Servers and Their Administration


    The package `ncpfs` from the series `n` is a collection of small programs that
    can be used to administer a Netware 2.3.11 server from Linux, mount Netware volumes,
    or manage printers. To access Netware servers newer than version 4, the bindery
    emulation and IPX must be enabled on them.


    The following programs are available. Refer to the man pages for their functions:


    |  |  |  |  |

    |---|---|---|---|

    | `nwmsg` | `ncopy` | `ncpmount` | `ncpumount` |

    | `nprint` | `nsend` | `nwauth` | `nwbocreate` |

    | `nwbols` | `nwboprops` | `nwborm` | `nwbpadd` |

    | `nwbpcreate` | `nwbprm` | `nwbpset` | `nwbpvalues` |

    | `nwdlr` | `nwdpvalues` | `nwfsctrl` | `nwfsinfo` |

    | `nwfstime` | `nwgrant` | `nwpasswd` | `nwpurge` |

    | `nwrevoke` | `nwrights` | `nwsfind` | `nwtrustee` |

    | `nwtrustee2` | `nwuserlist` | `nwvolinfo` | `pqlist` |

    | `pqrm` | `pqstat` | `pserver` | `slist` |


    `ncpmount`, for example, is an essential program used to mount volumes from a
    Netware server in Linux. In turn, `ncpmount` is used to unmount them. Package
    `ncpfs` contains tools for configuring the IPX protocol and IPX routing:


    ```

    ipx_init

    ipx_configure

    ipx_interface

    ipx_internal_net

    ipx_route

    ```


    With `ipx_configure` and `ipx_interface`, configure the network card''s IPX. If
    you already have MARSNWE running, however, it will take care of this configuration
    automatically.


    # IPX Router with ipxrip


    Another package for converting Linux into an IPX router is package `ipxrip` from
    the series `n`. Usually, it is not needed, because an IPX router can be configured
    with MARSNWE or the tools from package `ncpfs`.'
  merge: -1
  img_proc: true
- pgno: 402
  md: '# Configuring an ADSL or T-DSL Connection


    # Default Configuration


    Currently, SuSE Linux supports DSL connections that work with the point-to-point
    over ethernet protocol (PPPoE) used by most major providers. If you are not sure
    what protocol is used for your DSL connection, ask your provider. If you have
    a single-user workstation with a graphical interface, the DSL connection should
    be set up with the YaST2 modules ADSL/T-DSL.


    +   1. The ppp and smpppd packages must be installed. It is best to use YaST2
    for this purpose.

    +   2. Configure your network card with YaST2. Do not activate dhcp, but set a
    fixed IP address instead, e.g. `192.168.2.22`.

    +   3. The parameters set with YaST2 will be saved in the file `/etc/sysconfig/network/providers/dsl-provider0`.
    In addition, there are configuration files for the SuSE meta ppp daemon and its
    frontends kinternet and cinternet. Please consult the man page `man smpppd`.

    +   4. Start the network with the command `rcnetwork start`.

    +   5. With the commands `cinternet --start` and `cinternet --stop` the connection
    can be established or terminated on a non graphical system and On a graphical
    desktop use kinternet that is started automatically if you used YaST2 to set up
    DSL. Click on the gear icon in the control panel. Select ‘Communication/Internet’
    → ‘Internet Tools’ → ‘kinternet’. A plug icon will appear in the control panel.
    Start the connection by clicking on it once and, by clicking on it again, terminate
    the connection.


    # DSL Connection by Dial-on-Demand


    Dial-on-demand means that the connection will automatically be set up when the
    user goes online, for example, when visiting a web site in a browser or when sending
    an e-mail. After a certain amount of idle time when no data is being sent or received,
    the connection will automatically be dropped. Since the dial-up connection via
    PPPoE, the protocol for ADSL, is quite fast, it is almost as if you had an ongoing
    Internet connection.


    However, this really only makes sense if you have a flat-rate connection. If your
    Internet access is billed by the length of time online, make sure that there are
    not any interval processes, such as a cronjob, which may be periodically establishing
    a connection. This could get quite expensive.'
  merge: -1
  img_proc: true
- pgno: 403
  md: 'Although a permanent online connection would also be possible using a DSL flat-rate
    connection, there are certain advantages to having a connection which only exists
    for a short amount of time when needed:


    +   - Most providers drop the connection after a certain period of time.

    +   - A permanent connection can be considered as a drain on resources (e.g. IP
    addresses).

    +   - Being online permanently is a security risk, because hackers may be able
    to systematically comb the system for vulnerable areas. A system that is only
    accessible over the Internet when necessary and is always changing IP addresses
    is significantly more difficult to attack.


    Dial-on-demand can be enabled using YaST2 (also refer to the Basics manual) or
    set it up manually:


    Set the parameter `DEMAND="yes"` in the `/etc/sysconfig/network/providers/dsl-provider0`
    file then define an idle time via the variable `IDLETIME="60"`. This way, an unused
    connection will be dropped after 60 seconds.'
  merge: -1
  img_proc: true
- pgno: 404
  md: "# Proxy Server: Squid\n\nThe following chapter describes how caching web sites\
    \ assisted by a proxy server works and what the advantages of using proxy servers\
    \ are. The most popular proxy cache for Linux and UNIX platforms is Squid. We\
    \ will discuss its configuration, the specifications required to get it running,\
    \ how to configure the system to do transparent proxying, how to gather statistics\
    \ about the cache’s use with the help of programs like Calamaris and cachemgr,\
    \ and how to filter web contents with squidguard.\n\n# About Proxy Caches\n\n\
    Squid acts as a proxy cache. It behaves like an agent that receives requests from\
    \ clients, in this case web browsers, and passes them to the specified server\
    \ provider. When the requested objects arrive at the agent, it stores a copy in\
    \ a disk cache.\n\nBenefits arise when different clients request the same objects:\
    \ these will be served directly from the disk cache, much faster than obtaining\
    \ them from the Internet and, at the same time, saving overall bandwidth for the\
    \ system.\n\n> **Tip**\n> \n> Squid covers a wide range of features, including\
    \ intercommunicating hierarchies of proxy servers to divide the load, defining\
    \ strict access control lists to all clients accessing the proxy, and with the\
    \ help of other applications, allowing or denying access to specific web pages.\
    \ It also can obtain statistics about the most visited web sites, user usage of\
    \ the Internet, and others."
  merge: -1
  img_proc: true
- pgno: 405
  md: 'Squid is not a generic proxy. It proxies normally only between HTTP connections.
    It does also support the protocols FTP, Gopher, SSL, and WAIS, but it does not
    support other Internet protocols, such as Real Audio, news, or videoconferencing.
    Because Squid only supports the UDP protocol to provide communication between
    different caches, many other multimedia programs will not be supported.


    # Some Facts About Cache Proxying


    # Squid and Security


    It is also possible to use Squid together with a firewall to secure internal networks
    from the outside using a proxy cache. The firewall denies all external services
    except for Squid, forcing all World Wide Web connections to be established by
    the proxy.


    It is a firewall configuration including a DMZ, set the proxy there. In this case,
    it is important that all computers in the DMZ send their log files to hosts inside
    the secured network.


    One way to implement this feature is with the aid of a “transparent” proxy. It
    will be covered in Section *Transparent Proxy Configuration* on page 404.


    # Multiple Caches


    “Multiple Caches” means configuring different caches so objects can be exchanged
    between them, reducing the total system load and increasing the chances of finding
    an object already in the local network. It enables the configuration of cache
    hierarchies so a cache is able to forward object requests to sibling caches or
    to a parent cache. It can get objects from another cache in the local network
    or directly from the source.


    Choosing the appropriate topology for the cache hierarchy is very important because
    we do not want to increase the overall traffic on the network. For example, in
    a very large network, it is possible to configure a proxy server for every subnet
    and connect it to a parent proxy, connected in its turn to the proxy cache from
    the ISP.


    All this communication is handled by ICP (Internet Cache Protocol) running on
    top of the UDP protocol. Data transfers between caches are handled using HTTP
    (Hyper Text Transmission Protocol) based on TCP, but for these kinds of connections,
    it is preferable to use faster and simpler protocols capable of reacting to incoming
    requests within a maximum of one or two seconds.'
  merge: -1
  img_proc: true
- pgno: 406
  md: "To find the most appropriate server from which to get the objects, one cache\
    \ sends an ICP request to all sibling proxies. These will answer the requests\
    \ via ICP responses with a HIT code if the object was detected or a MISS if it\
    \ was not. If multiple HIT responses were found, the proxy server will decide\
    \ which server to download depending on factors such as which cache sent the fastest\
    \ answer or which one is closer. If no satisfactory responses have been sent,\
    \ the request will be sent to the parent cache.\n\n> **Tip**\n> \n> To avoid duplication\
    \ of objects in different caches in our network, other ICP protocols are used\
    \ such as CARP (Cache Array Routing Protocol) or HTCP (HyperText Cache Protocol).\
    \ The more objects maintained in the network, the greater the possibility of finding\
    \ the one we want.\n\n# Caching Internet Objects\n\nNot all objects available\
    \ in our network are static. There are a lot of dynamically generated CGI pages,\
    \ visitor counters, or encrypted SSL content documents. This is the reason objects\
    \ like this are not cached: every time you access one, it will have changed.\n\
    \nThe question remains as to how long all the other objects stored in the cache\
    \ should stay there. To determine this, all objects in the cache are assigned\
    \ one of three states. Web and proxy servers find out the status of an object\
    \ by adding headers to these objects such as “Last modified” or “Expires” and\
    \ the corresponding date. Other headers specifying that objects must not be cached\
    \ are used as well.\n\nObjects in the cache are normally replaced, due to a lack\
    \ of free hard disk space, using algorithms such as LRU (Last Recently Used).\
    \ It consists of first replacing the less requested objects.\n\n# System Requirements\n\
    \nThe most important thing is to determine the maximum load the system will have\
    \ to bear. It is, therefore, important to pay more attention to the load picks,\
    \ because these might be more than four times the day’s average. When in doubt,\
    \ it would be better to overestimate the system’s requirements, because having\
    \ Squid working close to the limit of its capabilities could lead to a severe\
    \ loss in the quality of the service."
  merge: -1
  img_proc: true
- pgno: 407
  md: '# # Hard Disk


    # ## Speed: Choosing Fast Hard Disks


    Speed plays an important role in the caching process, so should be of utmost concern.
    In hard disks, this parameter is described as “random seek time”, measured in
    milliseconds. As a rule of thumb, the lower this value, the better. In comparison
    to using IDE or SCSI disks, SCSI is preferable. Newer IDE disks, however, have
    similar seek times as SCSI and, together with DMA-compatible IDE controllers,
    increase the speed of data transfer without considerably increasing the system
    load. Another possibility to speed up the system is to use more disks simultaneously.


    # ## Size of the Disk Cache


    It depends on a few factors. In a small cache, the probability of a HIT (finding
    the requested object already located there) will be small, because the cache is
    easily filled so the less requested objects will be replaced by newer ones. On
    the other hand, if 1 GB is available for the cache and the users only surf 10
    MB a day, it will take more than 100 days to fill the cache.


    Probably the easiest way to determine the needed cache size is to consider the
    maximum transfer rate of our connection. With a 1 MB/s connection, the maximum
    transfer rate will be 125 KB/s. If all this traffic ends up in the cache in one
    hour it will add up to 450 MB and, assuming that all this traffic is generated
    in only 8 working hours, it will reach 3.6 GB in one day. Because the connection
    was not used up to its maximum capacity, we could assume that the total amount
    of data going through the cache is about 2 GB. In the example, to keep all the
    browsed data of one day in the cache, we will require 2 GB of disk space for Squid.
    Summing up, Squid tends to read and write smaller blocks from or to the disk,
    making it more important how fast it detects these objects on the disk than having
    a fast disk.


    # ## RAM


    The amount of memory required by Squid directly correlates to the amount of objects
    allocated in the cache. Squid also stores cache object references and frequently
    requested objects in memory to speed up the retrieving of this data. The memory
    is one million times faster than a hard disk. Compare the seek time of a hard
    disk, about 10 milliseconds, with the 10 nanoseconds access time of the newer
    RAM memories.'
  merge: -1
  img_proc: true
- pgno: 408
  md: 'Every object in RAM memory has a size of 72 bytes (for “small” pointer architectures
    like Intel, Sparc, and MIPS. For Alpha, it is 104 bytes). If the average size
    of an object on the Internet is about 8 KB and 1 GB disk space is available for
    the cache, it will be storing about 130,000 objects, resulting in close to 10
    MB RAM only for meta data. Squid also holds data in memory for other things, such
    as a table with all used IP addresses, a fully qualified domain name cache, hot
    objects (the most requested), buffers, and access control lists.


    It is very important to have more than enough memory for the Squid process, because
    the system performance will be dramatically reduced if it has to be swapped to
    disk. To assist in cache memory management, use the tool `cachemgr.cgi`, as discussed
    in Section `cachemgr.cgi` on page 407.


    # CPU


    Squid is not a program that requires intensive CPU usage. The load of the processor
    is only increased while the contents of the cache are being loaded or checked.
    Using a multiprocessor machine does not increase the performance of the system.
    To increase efficiency, it is better to buy faster disks or add more memory.


    Some examples of configured systems running Squid are available at http://wwwcache.ja.net/servers/squids.html.


    # Starting Squid


    Squid is already preconfigured in SuSE Linux, so you can start it easily right
    after installation. A prerequisite for a smooth start is an already configured
    network, at least one name server and, of course, Internet access. Problems can
    arise if a dial-up connection is used with dynamic DNS configuration. In cases
    such as this, at least the name server should be clearly entered, since Squid
    will not start if it does not detect a DNS in the `/etc/resolv.conf`.'
  merge: -1
  img_proc: true
- pgno: 409
  md: 'To start Squid, enter `rcsquid start` at the command line as root. For the
    initial start-up, the directory structure must first be defined in `/var/squid/cache`.
    This is done by the start script `/etc/init.d/squid` automatically and can take
    a few seconds or even minutes. If done appears to the right in green, Squid has
    been successfully loaded. Test Squid’s functionality on the local system by entering
    localhost and Port 3128 as proxy in the browser. To allow all users to access
    Squid and thus the Internet, change the entry in the configuration file `/etc/squid.conf`
    from `http_access deny all` to `http_access allow all`. However, in doing so,
    consider that Squid is made completely accessible to anyone by this action. Therefore,
    define ACLs that control access to the proxy. More on this is available in Section
    Options for Access Controls on page 402.


    If you have made changes in the configuration file `/etc/squid.conf`, instruct
    Squid to load the changed file. Do this by entering `rcsquid reload` or restart
    Squid with `rcsquid restart`. With `rcsquid status`, determine whether the proxy
    is running and with `rcsquid stop` halt Squid. The latter can take a while, since
    Squid waits up to half a minute (`shutdown_lifetime` option in `/etc/squid.conf`)
    before dropping the connections to the clients then will still have to write its
    data to the disk. If Squid is halted with `kill` or `killall`, this can lead to
    the destruction of the cache, which will then have to be fully removed to restart
    Squid.


    If Squid dies after a short period of time, although it has seemingly been started
    successfully, it can be the result of a faulty name server entry or a missing
    `/etc/resolv.conf` file. The cause of the start failure would then be logged by
    Squid in the `/var/squid/logs/cache.log` file.


    If Squid should be loaded automatically when the system boots, reset the entry
    `START_SQUID=no` to `START_SQUID=yes` in the `/etc/sysconfig/squid` file. An uninstall
    of Squid will neither remove the cache nor the log files. Manually delete the
    `/var/cache/squid` directory.'
  merge: -1
  img_proc: true
- pgno: 410
  md: '# Local DNS Server


    Setting up a local DNS server, such as BIND-8 or BIND-9, makes absolute sense
    even if the server does not manage its own domain. It will then simply act as
    a “caching-only DNS” and will also be able to resolve DNS requests via the root
    name server without requiring any special configuration. If you enter this in
    the /etc/resolv.conf with the IP address 127.0.0.1 for localhost, Squid will detect
    a valid name server when it starts up. Configuring a name server is discussed
    in Section DNS — Domain Name Service on page 349. It is sufficient, however, to
    install the package and to boot it. The name server of the provider should be
    entered in the configuration file /etc/named.conf under forwarders along with
    its IP address. If you have a firewall running, even if it is just personal-firewall,
    make sure the DNS requests will be sent.


    # The Configuration File /etc/squid.conf


    All Squid proxy server settings are made in the /etc/squid.conf file. To start
    Squid for the first time, no changes will be necessary in this file, external
    clients will initially be denied access. The proxy needs to be made available
    for the localhost, usually with 3128 as port. The options are extensive and therefore
    provided with ample documentation and examples in the preinstalled /etc/squid.conf
    file. Nearly all entries begin with a # sign (the lines are commented out) and
    the relevant specifications can be found at the end of the line. The given values
    almost always correlate with the default values, so removing the comment signs
    without changing any of the parameters actually has little effect in most cases.
    It is better to leave the sample as it is and reinsert the options along with
    the modified parameters in the line below. In this way, easily interpret the default
    values and the changes.


    If you have updated an earlier Squid version, it is recommended to edit the new
    /etc/squid.conf and only apply the changes made in the previous file. If you try
    to implement the old squid.conf again, you are running a risk that the configuration
    will no longer function, because options are sometimes modified and new changes
    added.


    # General Configuration Options


    `http_port 3128` This is the port where Squid listens for client requests. The
    default port is 3128, but 8080 is also common. You have the option here of specifying
    several port numbers separated by blank spaces.'
  merge: -1
  img_proc: true
- pgno: 411
  md: '**cache_peer <hostname> <type> <proxy-port> <icp-port>** Here, enter a parent
    proxy as “parent”, for example, or use that of the provider. As <hostname>, the
    name and IP address of the proxy to use are entered and, as <type>, parent. For
    <proxy-port>, enter the port number that is also specified by the operator of
    the parent for use in the browser, usually 8080. Set the <icp-port> to 7 or 0
    if the ICP port of the parent is not known and its use is irrelevant to the provider.
    In addition, `default` and `no-query` should be specified after the port numbers
    to strictly prohibit the use of the ICP protocol. Squid will then behave like
    a normal browser as far as the provider’s proxy is concerned.


    **cache_mem 8 MB** This entry defines the amount of memory Squid can use for the
    caches. The default is 8 MB.


    **cache_dir ufs /var/cache/squid/ 100 16 256** The entry `cache_dir` defines the
    directory where all the objects are stored on disk. The numbers at the end indicate
    the maximum disk space in MB to use and the number of directories in the first
    and second level. The `ufs` parameter should be left alone. The default is 100
    MB occupied disk space in the `/var/cache/squid` directory and creation of 16
    subdirectories inside it, each containing 256 more subdirectories. When specifying
    the disk space to use, leave sufficient reserve disk space. Values from a minimum
    of fifty to a maximum of eighty percent of the available disk space may be the
    most sense here. The last two numbers for the directories should only be increased
    with caution, because too many directories can also lead to performance problems.
    If you have several disks that share the cache, enter several `cache_dir` lines.


    **cache_access_log /var/squid/logs/access.log** path for log messages


    **cache_log /var/squid/logs/cache.log** path for log messages


    **cache_store_log /var/squid/logs/store.log** path for log messages


    These three entries specify the path where Squid will log all its actions. Normally,
    nothing is changed here. If Squid is experiencing a heavy usage burden, it might
    make sense to distribute the cache and the log files over several disks.


    **emulate_httpd_log off** If the entry is set to on, obtain readable log files.
    Some evaluation programs cannot interpret this, however.


    **client_netmask 255.255.255.255** With this entry, mask the logged IP addresses
    in the log files to hide the clients’ identities. The last digit of the IP address
    will be set to zero if you enter 255.255.255.0 here.'
  merge: -1
  img_proc: true
- pgno: 412
  md: '**ftp_user Squid®** With this, set the password Squid should use for the anonymous
    FTP login. It can make sense, however, to specify a valid e-mail address here,
    because most FTP servers can check these for validity.


    **cache_mgr webmaster** An e-mail address to which Squid sends a message if it
    unexpectedly crashes. The default is webmaster.


    **logfile_rotate 0** If you run `squid -k rotate`, Squid can rotate secured log
    files. The files will be enumerated in this process and after reaching the specified
    value, the oldest file at that point will be overwritten. This value here normally
    stands for 0 because archiving and deleting log files in SuSE Linux is carried
    out by a cronjob found in the configuration file `/etc/logrotate.d/syslog`. The
    period of time after which the files are deleted is defined in the `/etc/sysconfig/aaa_base`
    file via the `MAX_DAYS_FOR_LOG_FILES` entry.


    **append_domain <domain>** With append_domain, specify which domain to append
    automatically when none is given. Usually, your own domain is entered here, so
    either www in the browser accesses your own web server.


    **forwarded_for on** If you set the entry to off, Squid will remove the IP address
    and the system name of the client from the HTTP requests.


    **negative_ttl 5 minutes; negative_dns_ttl 5 minutes** Normally, you do not need
    to change these values. If you have a dial-up connection, however, the Internet
    may, at times, not be accessible. Squid will make a note of the failed requests
    then refuse to issue new ones, although the Internet connection has been reestablished.
    In a case such as this, change the minutes to seconds then, after clicking on
    Reload in the browser, the dial-up process should be reengaged after a few seconds.


    **never_direct allow <acl_name>** To prevent Squid from taking requests directly
    from the Internet, use the above command to force connection to another proxy.
    You need to have previously entered this in `cache_peer`. If all is specified
    as the `<acl_name>`, force all requests to be forwarded directly to the parent.
    This might be necessary, for example, if you are using a provider that strictly
    stipulates the use of its proxies or denies its firewall direct Internet access.'
  merge: -1
  img_proc: true
- pgno: 413
  md: '# Options for Access Controls


    Squid provides an intelligent system that controls access to the proxy. By implementing
    ACLs, it can be configured easily and comprehensively. This involves lists with
    rules that are processed sequentially. ACLs must be defined before they can be
    used. Some default ACLs, such as all and localhost, already exist. After defining
    an ACL, implement it, for example, in conjunction with `http_access`.


    `acl <acl_name> <type> <data>` An ACL requires at least three specifications to
    define it. The name `<acl_name>` can be chosen arbitrarily. For `<type>`, select
    from a variety of different options which can be found in the ACCESS CONTROLS
    section in the `/etc/squid.conf` file. The specification for `<data>` depends
    on the individual ACL type and can also be read from a file, for example, via
    host names, IP addresses, or URLs. The following are some simple examples:


    ```

    acl myusers srcdomain .my-domain.com

    acl reaches src 192.168.1.0/255.255.255.0

    acl students src 192.168.7.0 192.168.9.0/255.255.255.0

    acl lunch time MTWHF 12:00-15:00

    ```


    `http_access allow <acl_name>` `http_access` defines who is allowed to use the
    proxy and who can access what on the Internet. For this, ACLs will have to be
    given. `localhost` and `all` have already been defined above, which can deny or
    allow access via `deny` or `allow`. A list containing any number of `http_access`
    entries can be created, processed from top to bottom, and depending on which occurs
    first, access will be allowed or denied to the respective URL. The last entry
    should always be `http_access deny all`. In the following example, the localhost
    has free access to everything while all other hosts are denied access completely.


    ```

    http_access allow localhost

    http_access deny all

    ```


    Another example, where the previously defined ACLs are used: The group teachers
    always has access to the Internet. The group students only gets access Monday
    to Friday during lunch time.


    ```

    http_access deny localhost

    http_access allow teachers

    http_access allow students lunch time

    http_access deny all

    ```'
  merge: -1
  img_proc: true
- pgno: 414
  md: 'The list with the `http_access` entries should only be entered, for the sake
    of readability, at the designated position in the `/etc/squid.conf` file. That
    is, between the text


    ```

    # INSERT YOUR OWN RULE(S) HERE TO ALLOW ACCESS FROM YOUR CLIENTS

    ```


    and the last


    ```

    http_access deny all

    ```


    **redirect_program /usr/bin/squidGuard** With this option, a redirector, such
    as SquidGuard, which is able to block unwanted URLs, can be specified. Internet
    access can be individually controlled for various user groups with the help of
    proxy authentication and the appropriate ACLs. SquidGuard is a package in and
    of itself that can be separately installed and configured.


    **authenticate_program /usr/bin/pam_auth** If users must be authenticated on the
    proxy, a corresponding program, such as pam_auth, can be specified here. When
    accessing pam_auth for the first time, the user will see a login window where
    the user name and password must be entered. In addition, an ACL is still required
    so only clients with a valid login can use the Internet:


    ```

    acl password proxy_auth REQUIRED

    ```


    ```

    http_access allow password

    http_access deny all

    ```


    The REQUIRED after proxy_auth can be replaced with a list of permitted user names
    or with the path to such a list.


    **ident_lookup_access allow <acl_name>** With this, have an ident request run
    for all ACL-defined clients to find each user’s identity. If you apply all to
    the `<acl_name>`, this will be valid for all clients. Also, an ident daemon must
    be running on all clients. For Linux, install the identd package for this purpose.
    For Windows, there is free software available to download from the Internet. To
    ensure that only clients with a successful ident lookup are permitted, a corresponding
    ACL will also have to be defined here:


    ```

    acl identhosts ident REQUIRED

    ```


    ```

    http_access allow identhosts

    http_access deny all

    ```'
