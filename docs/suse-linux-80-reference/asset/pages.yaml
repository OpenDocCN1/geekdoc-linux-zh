    # The 1024-Cylinder Limit


    > **Note**\n\nRecent BIOS versions allow starting operating systems above the
    1024-cylinder limit. The current LILO version can use this BIOS extension. YaST2
    will inform you accordingly of these options for your BIOS while configuring LILO.
    If your BIOS does not include this extension, continue reading here.


    As explained in Section *LILO Locations* on page 94, the entire LILO machinery
    — all data needed for booting — must be available to BIOS calls. The accessible
    cylinders were also discussed in that section. This restriction affects only the
    boot machinery. It is not really required that LILO be installed on the Linux
    root partition. It is even possible, but quite risky, to put the boot machinery
    onto partitions of other operating systems to which Linux has read and write access.


    > **Caution**\n\nThis does not apply to the LILO boot sector, which should never
    be installed onto an unknown partition, because the file system will be severely
    damaged.


    +   - The best method is to create a primary partition (within the allowed section)
    and to install all LILO files (including the LILO boot sector) into this partition.'
