    \ geometry than that of the Linux system running. Only needed in rare cases.\n\
    +   \n+     The linear option does not release you from the constraints of the\
    \ 1024-cylinder limit, which is determined by the BIOS geometry of the boot hard\
    \ disk. Refer also to `/usr/share/doc/sdb/en/html/kgw_lilo_linear.html`.\n\n+\
    \   - **message={message-file}**\n+   \n+     Points to a text file that should\
    \ be shown on screen when booting the system. The file should not be longer than\
    \ twenty-four lines (to prevent the message from scrolling) and contains, for\
    \ example, an overview of the LILO boot selection. This is recommended.\n+   \n\
    +     SuSE Linux normally uses a PCX image instead of the classical start-up message.\
    \ To learn more about this, read `file:/usr/share/doc/sdb/de/html/jkoeke_bootgrafik_72.html`.\n\
    \n> **Note**\n> \n> If this option is set, the message file becomes part of the\
