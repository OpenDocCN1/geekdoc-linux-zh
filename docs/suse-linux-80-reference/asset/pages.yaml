    # 4) local port to redirect the traffic to, separated by a colon;

    # "1.1.1.0/0,0/0,80,3128 0/0,172.20.1.1,80,8080"

    #

    ```

    ```


    *File 64: Option 15 der Firewallkonfiguration*


    The comments above show the syntax to follow. First, the IP address and the netmask
    of the “internal networks” accessing the proxy firewall. Second, the IP address
    and the netmask to which these clients “send” their requests. In the case of web
    proxies, specify the networks 0/0, a wild card that means “to everywhere”. After
    that, enter the “original” port to which these requests are sent and, finally,
    the port to which all these requests are “redirected”. As Squid supports more
    protocols than HTTP, redirect requests from other ports to our proxy, such as
    FTP (port 21), HTTPS, or SSL (port 443). The example uses the default port 3128.
    If there are more networks or services to add, they only need to be separated
    by a single blank character in the corresponding entry.


    ```

    ```text

    FW_REDIRECT_TCP="192.168.0.16/0,0/0,80,3128 192.168.0.16/0,0/0,21,3128"

    FW_REDIRECT_UDP="192.168.0.16/0,0/0,80,3128 192.168.0.16/0,0/0,21,3128"

    ```

    ```


    To start the firewall with the new configuration with it, change any entry in
    the `/etc/sysconfig/SuSEfirewall2` file. The entry `START_FW` must be set to "yes".


    Start Squid as shown in Section *Starting Squid* on page 397. To check if everything
