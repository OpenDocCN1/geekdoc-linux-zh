- pgno: 138
  md: '# The X Window System


    # Historical Background


    The X Window System is the de facto standard GUI for UNIX. Yet the X Window System
    is far more than this — X11 is a network-based system. Applications running on
    the machine `earth` can display their results on the machine `sun`, providing
    the two machines are connected via a network. The network could be a local one
    (LAN) or a connection between computers thousands of miles away via the Internet.


    X11 was first developed as an enterprise of DEC (Digital Equipment Corporation)
    and the project Athena at MIT (Massachusetts Institute of Technology). The first
    release of X11R1 was in September 1987. Since release 6, the X Consortium, Inc.
    has been responsible for the development of the X Window System.


    XFree86™ is a freely available implementation of X servers for PC systems. It
    was developed by a handful of ambitious programmers who founded the XFree86 team
    in 1992. In 1994, this team went on to found the XFree86 Project, whose aim is
    to continue research and development on X11 and to provide it to the public. Since
    March 2000, the completely revised major release XFree86-4.0 has been available
    for download from http://www.XFree86.org. By default, SuSE Linux installs XFree86-4.0.
    Below, take a closer look at the features of this version.


    SuSE would like to thank the XFree86 team for their help and for their permission
    to include beta servers on our CD’s, without which their production would have
    been much more difficult, if at all possible.


    > ¹ Parts of this documentation are taken from chapter *XFree86 Konfigurieren*
    from [HHMK96], which was kindly given to us by Dirk Hohndel.'
  merge: -1
  img_proc: true
- pgno: 139
  md: "The next sections are about configuring the X server. For this purpose SaX2\
    \ and xf86config will be discussed, simple tools for configuring the X Window\
    \ System. SaX2 is intended for configuring XFree86-4.0, SaX is used to configure\
    \ the XFree86 3.3.x versions.\n\nIn contrast to the text-based xf86config, the\
    \ two SaX versions work directly with the X server and they can be operated with\
    \ the mouse. So install, using YaST, the program SaX (package sax, series x) or\
    \ SaX2 (package sax2, series x), together with dependent packages. Whereas XFree86-4.0\
    \ contains all the necessary graphics drivers in the base package, if you use\
    \ XFree86-3.3.x, especially the package xvga16 — and if it is already known —\
    \ the X server that matches your graphics card must be installed. The X servers\
    \ are listed in the series x. If you have forgotten to select a server, SaX will\
    \ detect this and install a suitable server using YaST. In XFree86-4.0 the necessary\
    \ graphics drivers are already included in the base selection.\n\nTo make optimal\
    \ use of the hardware available (graphics card, monitor, keyboard), optimize the\
    \ configuration manually. Certain aspects of this optimization will be explained.\
    \ Even more detailed information on configuring the X Window System can be found\
    \ in the directory `/usr/share/doc/packages/xf86` as well as in the man page for\
    \ `XF86Config` (`man XF86Config`).\n\n> **Caution**\n> \n> Be very careful when\
    \ configuring your X Window System. Never start the X Window System until the\
    \ configuration is finished. A wrongly configured system can cause irreparable\
    \ damage to your hardware (this applies especially to fixed-frequency monitors).\
    \ The authors of this book and SuSE cannot be held responsible for damage. This\
    \ information has been carefully researched, but this does not guarantee that\
    \ all methods presented here are correct and will not damage your hardware.\n\n\
    # Version 4.x of XFree86\n\nThis version of SuSE Linux comes with version 4.x\
    \ of XFree86 which differs from the previously used version 3.3 in a number of\
    \ ways. Overall there are hardly any differences for the user when operating the\
    \ graphical desktop. Applications, such as the graphical desktops KDE or GNOME,\
    \ behave with the new version in the same way as version 3.3.6 included in earlier\
    \ distributions.\n\n²SaX: SuSE Advanced X Configuration Tool. The configuration\
    \ program SaX2 (sax2) to configure XFree86-4.0, makes XF86Setup (package xfsetup,\
    \ series x) obsolete."
  merge: -1
  img_proc: true
- pgno: 140
  md: '# Advantages


    The new X server is no longer a monolithic program, but just a relatively small
    basic scaffolding to which the necessary program modules can be later added, if
    and when required. For example, there are no longer many different X servers and
    graphics cards as in the previous version, but just one executable program called
    XFree86, which can be found in the directory `/usr/X11R6/bin`. This is also the
    actual X server. The graphics driver, which then takes on the task of controlling
    the graphics card, is a loadable module.


    A similar method is used to support the various input devices, fonts, or X protocols.
    This again consists of individual modules that can be later loaded by the X server.
    As a rule, you do not need to worry about these modules. The configuration of
    the modules to operate the graphical desktop on your computer is managed as far
    as possible by SaX2.


    Though this module concept, it is easy for a vendor to implement a driver for
    exotic hardware, such as touch screens or new graphics cards. The developers have
    even ensured that the necessary modules for various operating systems only need
    to be made available once, which means that a graphics driver module compiled
    in FreeBSD, for example, can also be used in Linux and vice versa. This portability,
    however, is limited to the same hardware platform: a module compiled for Linux
    on PowerPCs cannot be used on an Intel PC.


    Support for the mouse has also been significantly improved. Especially under heavy
    loads, the reaction of the mouse to mouse movements is considerably faster and
    more direct than with the previous XFree86 X server. Overall, the output speed
    has also been improved, so graphics operations are generally performed more quickly
    than on the old X server due to the completely revised XAA (*XFree86 Acceleration
    Architecture*).


    Compared to XFree86 3.3.x, the configuration file has a slightly different format
    and is now located in `/etc/X11/XF86Config`. For fine-tuning your X configuration,
    details on the structure of the configuration file and how it functions can be
    found in Section *Optimizing the Installation of the X Window System* on page
    160.


    Error logging has also been improved. The X server creates a very detailed log
    file, which you can always find after the X server has started in the file `/var/log/XFree86.0.log`.
    One of the further features of this version is the support of special options,
    such as True Type fonts. Other features also include the provision of the 3D protocol
    extension, glx, gamma correction of the screen, and the support of multiple graphics
    cards for Multihead configurations. More information on this can be found in Section
    *Optimizing the Installation of the X Window System* on page 160.'
  merge: -1
  img_proc: true
- pgno: 141
  md: '# Changes


    XFree86-4.0 is, of course, based on the version 3.3.x. Unfortunately, not all
    drivers are included, as some are very complex and could not be ported to the
    new XAA architecture. If these graphics cards were supported by SuSE Linux before,
    you can still use these with the XFree86 version-3.3.x. Use SaX to configure these
    cards.


    The graphics cards concerned here are those previously used with the following
    X servers: XF86_S3, XF86_Mach8, XF86_Mach32, and XF86_8514.


    In the case of S3 cards, those that previously required the S3 server are not
    supported by XFree86-4.0. Those that previously worked with the SVGA server will
    work correctly with XFree86-4.0. Basically these are the graphics cards S3 Trio3D,
    Savage4, Savage3D, and Savage2000 chips and almost all 3Dfx Voodoo cards. Graphics
    cards that needed the other X servers listed above (Mach8, Mach32, and 8514) are
    no longer very common. For these graphics cards—as for all the old S3 cards—the
    XFree86-3.3 version continues to be available.


    # Configuration of the X Window System with SaX2


    # Differences Between the X Server and the Window Manager


    In Linux, a graphical interface is any component that ensures all necessary hardware
    components are supported. This service is referred to simply as the X server.


    The graphical interface, the X server, allows your hardware to communicate with
    your software. This is how desktops like KDE and GNOME can display information
    on screen with which the user can interact. These desktops and similar applications
    are often called window managers. In Linux, there are several window managers,
    which can differ greatly in appearance and performance.


    Without a functioning graphical interface—without an activated X server—there
    would be no graphical user environment. SuSE offers the application SaX2 to ease
    the configuration of your graphical interface as much as possible.


    # About SaX2


    The application SaX2 (SuSE Advanced X11 Configuration) is responsible for the
    setup of X Window System, the graphical user interface. SuSE Linux finds itself
    in one of these states following a standard installation:'
  merge: -1
  img_proc: true
- pgno: 142
  md: "**The system is already in graphical mode** — In this case, the graphical user\
    \ interface has already been set up during installation by YaST2. This is possible\
    \ since SaX2 is a modular system so some parts of the application can be used\
    \ in other applications. YaST2 uses a module called SaX in the installation for\
    \ this setup. In this case, SaX2 can be used to adjust the already existing configuration.\
    \ Before starting SaX2, switch to text mode to avoid any potential conflicts with\
    \ the directly activated X server.\n\nYou will have the following options:\n\n\
    +   1. Switch to a text console using `Ctrl` + `Alt` + `F1`\n+   2. Log in to\
    \ the system as user root\n+   3. Enter the command `init 3`. After this command\
    \ has run, the system will be in text mode.\n\n**The system is already text mode**\
    \ — There are a number of reasons why a graphical interface cannot be started\
    \ following installation. Perhaps you did not configure a graphical interface\
    \ during the installation. In this case, the graphical interface can be set up\
    \ rather quickly with SaX2.\n\n> **Note**\n> \n> In the following sections, we\
    \ assume your system is in text mode and that you have logged in as user root.\n\
    \n# Start-Up and Hardware Recognition\n\nTo start SaX2, enter the command `sax2`.\
    \ The application will now start detecting the hardware for the mouse, keyboard,\
    \ graphics card, monitor, and 3D capabilities. These first four are the basic\
    \ components. If these are not set up, the X server cannot be started. 3D capabilities\
    \ in Linux are still in their developmental phase. If SaX2 detects a card with\
    \ 3D capabilities supported by Linux, you will be asked if you want to use these\
    \ features. More on this topic can be found in Chapter 2.\n\n# Configuration\n\
    \nAfter SaX2 has finished detecting the hardware, a temporary configuration will\
    \ be generated that SaX2 uses to run the configuration interface. In many cases,\
    \ the default settings are sufficient. You will have the following selection options\
    \ in this first dialog:"
  merge: -1
  img_proc: true
