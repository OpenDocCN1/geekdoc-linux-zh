- pgno: 418
  md: '# Squid and Other Programs


    In the following section, see how other applications interact with Squid. cachemgr.cgi
    enables the system administrator to check the amount of memory needed for caching
    objects. squidgrd filters web pages. Calamaris is a report generator for Squid.


    # cachemgr.cgi


    The cache manager (cachemgr.cgi) is a CGI utility for displaying statistics about
    the memory usage of a running Squid process. It is also a more convenient way
    to manage the cache and view statistics without logging the server.


    # Setup


    First, a running web server on your system is required. To check if Apache is
    already running, type, as root, rcapache status.


    If a message like this appears:


    ```

    Checking for service httpd: OK

    Server uptime: 1 day 18 hours 29 minutes 39 seconds

    ```


    Apache is running on your machine. Otherwise, type rcapache start to start Apache
    with the SuSE Linux default settings. The last step to set it up is to copy the
    file cachemgr.cgi to the Apache directory cgi-bin:


    ```

    cp /usr/share/doc/packages/squid/scripts/cachemgr.cgi

    /usr/local/httpd/cgi-bin

    ```


    # Cache Manager ACLs in /etc/squid.conf


    There are some default settings in the original file required for the cache manager:


    ```

    acl manager proto cache_object

    acl localhost src 127.0.0.1/255.255.255.255

    ```


    With the following rules:


    ```

    http_access allow manager localhost

    http_access deny manager

    ```'
  merge: -1
  img_proc: true
- pgno: 419
  md: 'the first ACL is the most important, as the cache manager tries to communicate

    with Squid over the cache_object protocol.

    The following rules assume that the web server and Squid are running on the

    same machine. If the communication between the cache manager and Squid

    originates at the web server on another computer, include an extra ACL as in

    Figure 65.


    ```

    acl manager proto cache_object

    acl localhost src 127.0.0.1/255.255.255.255

    acl webserver src 192.168.1.7/255.255.255.255 # IP of webserver

    ```


    File 65: Access Rules


    Then add the rules as in Figure 66.


    ```

    http_access allow manager localhost

    http_access allow manager webserver

    http_access deny manager

    ```


    File 66: Access Rules


    Configure a password for the manager for access to more options like closing

    the cache remotely or viewing more information about the cache. For this, con-

    figure the entry cachemgr_passwd with a password for the manager and the

    list of options to view. This list appears as a part of the entry comments in

    /etc/squid.conf.

    Restart Squid with the option -k reconfigure every time the configuration

    file is changed.


    # Viewing the Statistics


    Go to the corresponding web site:

    http://webserver.example.org/cgi-bin/cachemgr.cgi

    Press ‘continue’ and browse through the different statistics. More details on

    each entry shown by the cache manager is in the Squid FAQ at http://www.

    squid-cache.org/Doc/FAQ/FAQ-9.html


