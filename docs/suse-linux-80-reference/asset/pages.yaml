- pgno: 308
  md: '# # The SuSE Linux Boot Concept


    Booting and initializing a UNIX system can challenge even an experienced system
    administrator. This chapter gives a short overview of the SuSE Linux boot concept.
    The new implementation is compatible with the System Initialization section of
    the LSB specification (Version 1.0). Refer to Section Linux Standard Base (LSB)
    on page 272 for more information on LSB.


    +   - The init Program ........................................ 298

    +   - Runlevels .................................................. 298

    +   - Changing Runlevels ........................................ 300

    +   - Init Scripts .............................................. 300

    +   - SuSEconfig, /etc/sysconfig, and /etc/rc.config ........... 303

    +   - System Configuration: Scripts and Variables .............. 304'
  merge: -1
  img_proc: true
- pgno: 309
  md: 'The simple words “Uncompressing Linux...” signal that the kernel is taking
    control over your hardware. It checks and sets your console—more precisely: the
    BIOS registers of graphics cards and output format—to read BIOS settings and to
    initialize basic hardware interfaces. Next, your drivers “probe” existing hardware
    and initialize it accordingly. After checking the partitions and mounting the
    root file system, the kernel starts init, which “boots” (Unix jargon) the main
    system with all its programs and configurations. The kernel controls the entire
    system, including hardware access and the CPU time programs use.


    # The init Program


    The program init is responsible for correctly initializing all system processes.
    Thus, it is the father of all processes in the entire system.


    init takes a special role. It is started directly by the kernel and resists signal
    9, which normally enables you to kill processes. All other programs are either
    started directly by init or by one of its “child” processes.


    init is centrally configured via the /etc/inittab file. Here, the “runlevels”
    are defined (see Section *Runlevels* on this page). It also specifies which services
    and daemons are available in each of the levels.


    Depending on the entries in /etc/inittab, several scripts are invoked by init,
    which, for reasons of clarity, all reside in the directory /etc/init.d.


    The entire process of starting the system and shutting it down is maintained by
    init. From this point of view, the kernel can be considered a background process
    whose task is to maintain all other processes and to adjust CPU time and hardware
    access according to requests from other programs.


    # Runlevels


    In Linux, *runlevels* define how the system is started. After booting, the system
    starts as defined in /etc/inittab in the line initdefault. Usually this is 3 or
    5 (see Table 12.1 on the next page). An alternative to this is assigning a special
    runlevel at boot time (e.g., at the LILO prompt). The kernel passes any parameters
    it does not need directly to init.


    To change runlevels while the system is running, enter init with the appropriate
    number. Only the super user is allowed to do this.


    ```

    root@earth:/ > init 1

    ```'
  merge: -1
  img_proc: true
- pgno: 310
  md: "| Runlevel | Meaning |\n|---|---|\n| 0 | System halt |\n| S | Single user mode;\
    \ from boot prompt with US keyboard layout |\n| 1 | Single user mode |\n| 2 |\
    \ Local multiuser without remote network (standard) |\n| 3 | Full multiuser with\
    \ network |\n| 4 | Unused |\n| 5 | Full multiuser mode with network and xdm |\n\
    | 6 | System reboot |\n\n*Table 12.1: Valid Runlevels in Linux*\n\nbrings you\
    \ to single user mode, which is used for the maintenance and administration of\
    \ your system. After finishing work in S mode, the system administrator can change\
    \ the runlevel to 3 again by typing:\n\n```\nroot@earth:/> init 3\n```\n\nNow\
    \ all essential programs are started and users can log in and work with the system.\
    \ Table 12.1 below gives an overview of available runlevels. Runlevel 2 should\
    \ not be used on a system whose /usr partition is mounted via NFS. You can halt\
    \ the system using init 0 or reboot it with init 6.\n\nIf you have already installed\
    \ and configured the X Window System properly (Section *The X Window System* on\
    \ page 127) and want users to log in via a graphical user interface, change the\
    \ runlevel to 5. Try it first by typing init 5 to see whether the system works\
    \ as expected. Afterwards, set the default runlevel to 5 in YaST2.\n\n> **Tip**\n\
    > \n> If `/etc/inittab` is damaged, the system might not boot properly. Therefore,\
    \ be extremely careful while editing `/etc/inittab`. To repair damage, try entering\
    \ `init=/bin/sh` at the LILO boot prompt to boot directly into a shell. This looks\
    \ like: `boot: linux init=/bin/sh`"
  merge: -1
  img_proc: true
- pgno: 311
  md: '# Changing Runlevels


    Generally, there are a couple of things that happen if you change runlevels. First,
    stop scripts of the current runlevel are launched, closing down some programs
    essential for the current runlevel. Thereafter, start scripts of the new runlevel
    are started. Here, in most cases, a number of programs will be started. To illustrate
    this, we will show you a change from runlevel 3 to 5:


    +   - The administrator (root) tells init to change runlevels:


    ```

    root@earth:/ > init 5

    ```


    +   - init now consults its configuration file (`/etc/inittab`) and realizes it
    should start `/etc/init.d/rc` with the new runlevel as a parameter.


    +   - Now rc calls all the stop scripts of the current runlevel, but only for
    those where there is no start script in the selected new runlevel. In our example,
    these are all the scripts which reside in `/etc/init.d/rc3.d` (old runlevel was
    3) and which start with a `K`. The number following `K` guarantees a certain order
    to start, as there are some dependencies which have to be taken into consideration.


    > > **Note**

    > >

    > > The names of the stop scripts always begin with `K` for kill. Start scripts
    begin with `S` for start.


    +   - The last thing to start are the start scripts of the new runlevel. These
    are (in our example) in `/etc/init.d/rc5.d` and begin with an `S`. The same procedure
    regarding the order in which they are started is applied here.


    When changing into the same runlevel as the current runlevel, init only checks
    `/etc/inittab` for changes and starts the appropriate steps (e.g., for starting
    a getty on another interface).


    # Init Scripts


    Scripts in `/etc/init.d` are divided into two sections:


    +   - scripts executed directly by init. This only applies while booting and shutting
    down the system immediately (power failure or pressing `Ctrl` + `Alt` + `Del`
    by the user).'
  merge: -1
  img_proc: true
- pgno: 312
  md: 'Table 12.2: Summary of init Script Options


    | Option | Meaning |

    |---|---|

    | start | Starts service |

    | stop | Stops service |

    | restart | Stops service and restarts if service is already running; if it is
    not running it starts the service |

    | reload | Load configuration of service again without stopping and restarting
    it |

    | force-reload | Load configuration of the service again if the service supports
    this, if not a restart is carried out |

    | status | show current status |


    +   - scripts started indirectly by init. These are run when changing the runlevel
    and always call the master script `/etc/init.d/rc`, which guarantees the correct
    order of the relevant scripts.


    All scripts are located in `/etc/init.d`. Scripts for changing the run level are
    also found there, but are called via symbolic links from one of the subdirectories
    (`/etc/init.d/rc0.d` to `/etc/init.d/rc6.d`). This is just for clarity reasons
    and avoids duplicate scripts (e.g. if they are used in several runlevels). Since
    every script can be executed as both a start and a stop script, these scripts
    have to understand the parameters “start” and “stop”. The scripts understand,
    in addition, the restart, reload, force-reload, and status options. These different
    options are explained in Table 12.2.


    After leaving runlevel 3, `/etc/init.d/rc3.d/K40network` is run. `/etc/init.d/rc`
    runs the `/etc/init.d/network` script by means of the stop parameter. After entering
    runlevel 5, the same script is started. This time, however, with the start parameter.


    Links in these runlevel-specific subdirectories simply serve to assign the scripts
    to a certain runlevel. Adding and removing the required links is done by the program
    insserv (or by the link `/usr/lib/lsb/install_initd`) when installing and uninstalling
    packages. Refer to the man page for insserv (man 8 insserv)


    Below, we give a short introduction to the boot and stop scripts that are launched
    first (or last, respectively) as well as an explanation of the maintaining script.'
  merge: -1
  img_proc: true
- pgno: 313
  md: "**boot** — Executed while starting the system directly using init. It is independent\
    \ of the chosen runlevel and is only executed once. Here, file systems are checked,\
    \ the kernel daemon is launched, some unnecessary files in `/var/lock` are deleted,\
    \ and the network is configured for the loopback device (if it has been selected\
    \ in `/etc/rc.config`). Furthermore, the system time is set up with the isapnp\
    \ tools and Plug and Play hardware configured.\n\nIf an error occurs while automatically\
    \ checking and repairing the file system, the system administrator can intervene\
    \ after first entering the root password.\n\nLast to be executed is the script\
    \ `boot.local`.\n\n**boot.local** — Here, you can enter additional commands to\
    \ execute at boot before changing into a runlevel. It can be compared to AUTOEXEC.BAT\
    \ on DOS systems.\n\n**boot.setup** — General settings that have to be performed\
    \ while changing from single user mode to another runlevel. Here, keyboard maps\
    \ are loaded and the kernel daemon is started, which loads modules automatically.\n\
    \n**halt** — This script is only executed while changing into runlevel 0 or 6.\
    \ Here, it is executed either as halt or as reboot. Whether the system shuts down\
    \ or reboots depends on how halt is called.\n\n**rc** This script is of overriding\
    \ importance whenever runlevels are changed. It calls the appropriate stop scripts\
    \ of the current runlevel and the start scripts of the newly selected runlevel.\n\
    \nWith this concept in mind, you can create your own scripts. A skeleton has been\
    \ prepared in `/etc/init.d/skeleton`. The exact format is described in the LSB\
    \ outline. This defines specifically the order of steps and in which levels the\
    \ script should be processed.\n\nNow, create the links in the corresponding `rc?.d`\
    \ to your script to make sure it is launched when you change runlevels (see above\
    \ Section *Changing Runlevels* on page 300 for script names). The man page for\
    \ `init.d` (`man 1 init.d`) gives all the necessary technical background.\n\n\
    > **Caution**\n> \n> Handle these scripts with the utmost care! A faulty script\
    \ may hang your machine! See Section *Runlevels* on page 298 if all else fails."
  merge: -1
  img_proc: true
- pgno: 314
  md: '# SuSEConfig, /etc/sysconfig, and /etc/rc.config


    The main configuration of SuSE Linux can be done via the configuration files in
    `/etc/sysconfig` and the central configuration file called `/etc/rc.config`. In
    the latter, a couple of environment variables are set that are valid for the complete
    system. Each of the scripts in `/etc/init.d` executes `/etc/rc.config` as a first
    step to read the values of the variables that apply to it. `/etc/rc.config` also
    contains the variables set by the user. The configuration files in `/etc/sysconfig`
    are interpreted by single scripts, for example, the ISDN configuration file is
    only read by the isdn script.


    > > **Note**

    > >

    > > From SuSE Linux 6.0, packages with extensive adjustment options store their
    variables in individual files in the directory `/etc/rc.config.d`. This is the
    case, for example, with the package sendmail or the package i4l (ISDN).

    > >

    > > To simplify things, however, we will usually just mention `/etc/rc.config`,
    even if the file has been moved somewhere else.


    Moreover, a large number of configuration files are generated from the settings
    in `/etc/rc.config` and `/etc/sysconfig`. This is the task of `/sbin/SuSEConfig`.
    If you change the network configuration, for example, the file `/etc/hosts.conf`
    is regenerated, as it depends on the configuration you have made.


    So, if you change anything in those files manually, you need to run `/sbin/SuSEConfig`
    afterwards to make sure all changes to the appropriate configuration files are
    made at the correct place. If you change the configuration with YaST2, it automatically
    executes `/sbin/SuSEConfig` and updates your configuration files.


    This concept enables you to make basic changes to your configuration without having
    to reboot the system. Since some changes are rather complex, some programs probably
    have to be restarted for the changes to take effect. If the network configuration
    has changed, the network programs can be restarted using the commands:


    ```

    earth:    # rcnetwork stop

    earth:    # rcnetwork start

    ```


    As you can see, you can easily start and stop init scripts by hand.

    Generally, we recommend the following steps for configuring your system:


    +   - Bring the system into *single user mode* (Runlevel 1):


    ```

    earth:    # init 1

    ```'
  merge: -1
  img_proc: true
- pgno: 315
  md: "+   - Change the configuration files as needed. This can be done using an editor\
    \ of your choice.\n+   - Execute `/sbin/SuSEconfig` to make the changes take effect.\
    \ If you have changed `/etc/rc.config` via YaST2, this is done automatically.\n\
    +   - Bring your system back to the previous runlevel.\n\n```\nroot@earth:   >\
    \ init 3\n```\n\nThis procedure is mainly relevant if you have changed system-wide\
    \ settings (such as network configuration). It is not necessary to go into single\
    \ user mode for small changes, but it ensures all relevant programs are correctly\
    \ restarted.\n\n> **Tip**\n> \n> To disable the automatic configuration of SuSEconfig,\
    \ set the variable `{ENABLE_SUSECONFIG}` in `/etc/sysconfig/suseconfig` to no.\
    \ Do not disable SuSEConfig if you want to use the SuSE installation support.\
    \ It is also possible to disable the autoconfiguration partially.\n\n# System\
    \ Configuration: Scripts and Variables\n\nIn this section, we describe a selection\
    \ of system parameters, including their default settings. If you do not use YaST2\
    \ to change `/etc/rc.config` or the configuration files in `/etc/sysconfig`, make\
    \ sure you set empty parameters as two quotation marks (e.g. `KEYTABLES=\"\"`)\
    \ and that you surround parameters that contain a blank with quotation marks.\
    \ Parameters consisting of only one word do not have to be quoted.\n\n# Basic\
    \ Settings in /etc/rc.config\n\n```\nPATH=\"/sbin:/bin:/usr/sbin:/usr/bin\"\n\
    ```\n\nThis variable is only used internally. Do not change it.\n\n```\nCHECK_PERMISSIONS=\"\
    set\"\n```\n\ndefines whether file permissions will be checked against the `/etc/permissions`\
    \ file. With set, wrong settings will be corrected. With warn, only “warnings”\
    \ will be issued. With no, the feature is disabled."
  merge: -1
