- pgno: 148
  md: '![](img/a4b6c994843f3fbd688003f4cabfa48f_148_0.png)


    *Figure 7.6: Configuration of the Graphics Card*


    # ■ **Changing the Monitor Properties**


    After you have selected the colors and the resolution, change to the monitor tab.


    If the monitor has been detected, it is preselected. If this is the selection
    you want, you do not need to do anything else. If no monitor or just a “VESA-compatible
    monitor” has been selected, select the proper monitor model from the list provided.
    If the monitor is not included in the list, switch tabs to ‘Frequency’ and enter
    the appropriate frequency ranges for your monitor for the *horizontal* and the
    *vertical* deflection frequency in the corresponding fields.


    The corresponding frequency values can be found in the manual supplied by the
    monitor’s manufacturer. Close the properties window and proceed to the next item.


    # **Testing and Saving the Configuration**


    After clicking ‘Done’ in the last dialog, a reference display window appears where
    you can make the following selections.


    +   - ‘Cancel’ — Aborts the changes just made. Returns to the previous screen.

    +   - ‘Save’ — Saves the configuration. Afterwards, you will be asked if you want
    to exit SaX2.'
