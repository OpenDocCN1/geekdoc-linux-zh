- pgno: 356
  md: '# `/etc/nscd.conf`


    The nscd (Name Service Cache Daemon) is configured in this file (see the man pages
    for nscd and nscd.conf). This effects the data resulting from passwd, groups,
    and hosts. The daemon must be restarted every time the name resolution (DNS) is
    changed by modifying the `/etc/resolv.conf` file. Use `rcnscd restart` to restart
    it.


    > > **Caution**

    > >

    > > If, for example, the caching for passwd is activated, it will usually take
    about fifteen seconds until a newly added user is recognized by the system. By
    restarting nscd, reduce this waiting period.


    # `/etc/resolv.conf`


    As is already the case with the `/etc/host.conf` file, this file, by way of the
    resolver library, likewise plays a role in host name resolution. The domain to
    which the host belongs is specified in this file (keyword search). Also listed
    is the status of the name server address (keyword name server) to access. Multiple
    domain names can be specified. When resolving a name that is not fully qualified,
    an attempt is made to generate one by attaching the individual search entries.
    Multiple name servers can be made known by entering several lines, each beginning
    with name server. Comments are preceded with a `#` sign.


    An example of `/etc/resolv.conf` is shown in File 44.


    ```

    ```text

    # /etc/resolv.conf

    #

    # Our domain

    search cosmos.com

    #

    # We use sun (192.168.0.1) as name server

    name server 192.168.0.1

    # End of resolv.conf

    ```

    ```


    *File 44: `/etc/resolv.conf`*


    Some services like pppd (wwdial), ipppd (isdn), dhcp (dhcpcd and dhclient), pcmcia,
    and hotplug modify the file `/etc/resolv.conf`. To do so, they rely on the script
    modify_resolvconf.'
  merge: -1
  img_proc: true
- pgno: 357
  md: 'If the file `/etc/resolv.conf` has been temporarily modified by this script,
    it will contain a predefined comment giving information about the service by which
    it has been modified, about the location where the original file has been backed
    up, and hints on how to turn off the automatic modification mechanism.


    If `/etc/resolv.conf` is modified several times, the file will include modifications
    in a nested form. These can be reverted in a clean way even if this reversal takes
    place in an order different from the order in which modifications were introduced.
    Services that may need this flexibility include isdn, pcmcia, and hotplug.


    If it happens that a service was not terminated in a normal, clean way, `modify_resolvconf`
    can be used to restore the original file. Also, on system boot, a check will be
    performed to see whether there is an uncleaned, modified `resolv.conf` (e.g. after
    a system crash), in which case the original (unmodified) `resolv.conf` will be
    restored.


    YaST2 uses the command `modify_resolvconf check` to find out whether `resolv.conf`
    has been modified and will subsequently warn the user that changes will be lost
    after restoring the file.


    Apart from this, YaST2 will not rely on `modify_resolvconf`, which means that
    the impact of changing `resolv.conf` through YaST2 is the same as that of any
    manual change. In both cases, changes are made on purpose and with a permanent
    effect, while modifications requested by the above-mentioned services are only
    temporary.


    # `/etc/HOSTNAME`


    Here is the host name without the domain name attached. This file is read by several
    scripts while the machine is booting. It may only contain one line where the host
    name is mentioned.


    # Start-Up Scripts


    Apart from the configuration files described above, there are also various scripts
    that load the network programs while the machine is being booted. This will be
    started as soon as the system is switched to one of the multiuser runlevels (see
    also Table 13.12 on the facing page).'
  merge: -1
  img_proc: true
- pgno: 358
  md: '| Script | Description |

    |---|---|

    | `/etc/init.d/network` | This script takes over the configuration for the network
    hardware and software during the system’s start-up phase. |

    | `/etc/init.d/inetd` | Starts inetd. This is only necessary if you want to log
    in to this machine over the network. |

    | `/etc/init.d/portmap` | Starts the portmapper needed for the RPC server, such
    as an NFS server. |

    | `/etc/init.d/nfsserver` | Starts the NFS server. |

    | `/etc/init.d/sendmail` | Controls the sendmail process. |

    | `/etc/init.d/ypserv` | Starts the NIS server. |

    | `/etc/init.d/ypbind` | Starts the NIS client. |


    *Table 13.12: Some Start-Up Scripts for Network Programs*


    # Routing in SuSE Linux


    The routing table is set up in SuSE Linux via the configuration files `/etc/sysconfig/network/routes`
    and `/etc/sysconfig/network/ifroute-*`.


    All the static routes required by the various system tasks can be entered in the
    `/etc/sysconfig/network/routes` file: routes to a host, routes to a host via a
    gateway, and routes to a network. For all interfaces that need individual routing,
    an additional configuration file for each interface can be defined: `/etc/sysconfig/network/ifroute-*`.
    The sign `*` needs to be replaced with the name of the interface. The entries
    in the routing configuration files look like this:


    ```

    DESTINATION          GATEWAY NETMASK   INTER-

    FACE [ TYPE ] [ OPTIONS ]

    DESTINATION          GATEWAY PREFIXLEN INTER-

    FACE [ TYPE ] [ OPTIONS ]

    DESTINATION/ORIGINAL GATEWAY -         INTER-

    FACE [ TYPE ] [ OPTIONS ]

    ```


    To omit GATEWAY, NETMASK, PREFIXLEN or INTERFACE, write `-` instead. The entries
    TYPE and OPTIONS may just be omitted.'
  merge: -1
  img_proc: true
- pgno: 359
  md: '+   - The route’s destination is in the first column. This column may contain
    the IP address of a network or host or, in the case of **reachable** name servers,
    the fully qualified network or host name.

    +   - The second column contains the default gateway or a gateway through which
    a host or network can be accessed.

    +   - The third column contains the netmask for networks or hosts behind a gateway.
    The mask is `255.255.255.255`, for example, for a host behind a gateway.

    +   - The last column is only relevant for networks connected to the local host
    such as loopback, ethernet, ISDN, PPP, and dummy device. The device name must
    be entered here.


    The following scripts in the directory `/sbin` assist with the handling of routes:


    +   - **ifup-route** for setting up a route

    +   - **ifdown-route** for disabling a route

    +   - **ifstatus-route** for checking the status of the routes'
  merge: -1
  img_proc: true
- pgno: 360
  md: '# DNS — Domain Name Service


    DNS (Domain Name Service) is needed to resolve the domain and host names into
    IP addresses. In this way, the IP address `192.168.0.20` is assigned to the host
    name earth, for example. Before setting up your own name server, read the general
    information on DNS in Section *Domain Name System* on page 330.


    # Starting the Name Server BIND


    The name server BIND8, as well as the new version BIND9, is already preconfigured
    in SuSE Linux, so you can easily start it right after installing the distribution.


    If you already have a functioning Internet connection and have entered `127.0.0.1`
    as name server for the local host in `/etc/resolv.conf`, you should normally already
    have a working name resolution without having to know the DNS of the provider.
    BIND carries out the name resolution via the root name server, a notably slower
    process. Normally, the DNS provider should be entered with its IP address in the
    configuration file `/etc/named.conf` under forwarders to ensure effective and
    secure name resolution. If this works so far, the name server will run as a pure
    “caching-only” name server. Only when you configure its own zones will it become
    a proper DNS. A simple example of this can be found in the doc directory under
    `/usr/share/doc/packages/bind8/sample-config`. However, do not set up any official
    domains until you have actually been assigned one from the responsible institution.
    Even if you have your own domain and it is managed by the provider, you are better
    off not to use it, as BIND would otherwise not forward any more requests for this
    domain and the provider’s web server, for example, would not be accessible for
    this domain.


    To start the name server, enter `rcnamed start` at the command line as root. If
    “done” appears to the right in green, named, as the name server process is called,
    has been started successfully. Immediately test the functionality of the name
    server on the local system with the `nslookup` program. The local host should
    appear as the default server with the address `127.0.0.1`. If this is not the
    case, the wrong name server has probably been entered in `/etc/resolv.conf` or
    this file does not exist. For the first test, enter `nslookup “localhost”` or
    `“127.0.0.1”` at the prompt, which should always work. If you receive an error
    message instead, such as “No response from server”, check to see if named is actually
    running using the command `rcnamed status`. If the name server is not starting
    or is exhibiting faulty behavior, find the possible causes of this logged in `/var/log/messages`.'
  merge: -1
  img_proc: true
- pgno: 361
  md: "If you have a dial-up connection, be sure that BIND8, once it starts, will\
    \ review the root name server. If it does not manage this, because an Internet\
    \ connection has not been made, this can cause the DNS requests not to be resolved\
    \ other than for locally defined zones. BIND9 behaves differently, but requires\
    \ quite a bit more resources than BIND8.\n\nTo implement the name server of the\
    \ provider or one that you already have running on your network as “forwarder”,\
    \ enter one or more of these in the options section under forwarders. See File\
    \ 45.\n\n```\noptions {\n        directory \"/var/lib/named\";\n        forwarders\
    \ { 10.11.12.13; 10.11.12.14; };\n        listen-on { 127.0.0.1; 192.168.0.99;\
    \ };\n        allow-query { 127/8; 192.168.0.24; };\n        notify no;\n};\n\
    ```\n\n*File 45: Forwarding Options in named.conf*\n\nThe IP addresses used in\
    \ the example are arbitrary, so must be adjusted to your personal environment.\n\
    \nAfter options follows the zone, “localhost”, “0.0.127.in-addr.arpa”, and “.”\
    \ entries. At least entries from “type hint” should exist. Their corresponding\
    \ files never have to be modified, as they function in their present state. Also,\
    \ be sure that a “;” follows each entry and that the curly braces are properly\
    \ set.\n\nIf you have changed the configuration file /etc/named.conf or to the\
    \ zone files, adjust BIND to reread these files. Do this by entering `rcnamed\
    \ reload`. Otherwise, completely restart the name server by giving the command\
    \ `rcnamed restart`. To stop the name server, enter `rcnamed stop`.\n\n# The Configuration\
    \ File /etc/named.conf\n\nMake all the settings for the name server BIND8 and\
    \ BIND9 in the /etc/named.conf file. The zone data, consisting of the host names,\
    \ IP addresses, and similar, for the domains are stored in separate files in the\
    \ /var/lib/named directory.\n\nThe /etc/named.conf is roughly divided into two\
    \ areas. One is the options section for general settings and the other consists\
    \ of zone entries for the individual domains. Additional sections for logging\
    \ and acl type entries can be added. Comment lines begin with a '#' sign or '//'.\
    \ A minimalistic /etc/named.conf looks like File 46."
  merge: -1
  img_proc: true
- pgno: 362
  md: "```\n```conf\noptions {\n    directory \"/var/lib/named\";\n    forwarders\
    \ 10.0.0.1;\n    notify no;\n};\n\nzone \"localhost\" in {\n    type master;\n\
    \    file \"localhost.zone\";\n};\n\nzone \"0.0.127.in-addr.arpa\" in {\n    type\
    \ master;\n    file \"127.0.0.zone\";\n};\n\nzone \".\" in {\n    type hint;\n\
    \    file \"root.hint\";\n};\n```\n```\n\n*File 46: A Basic /etc/named.conf*\n\
    \nThis example works for both BIND8 and BIND9, because no special options are\
    \ used that are only understood by one version or the other. BIND9.1.1 accepts\
    \ all BIND8 configurations and makes note of options not implemented at start-up.\
    \ Special BIND9 options are, however, not supported by BIND8.\n\n# Important Configuration\
    \ Options\n\n**directory \"/var/lib/named\";** specifies the directory where BIND\
    \ can find the files containing the zone data.\n\n**forwarders 10.0.0.1;** is\
    \ used to specify the name servers (mostly the provider) to which DNS requests,\
    \ which cannot be resolved directly, are forwarded.\n\n**forward first;** causes\
    \ DNS requests to be forwarded first before an attempt is made to resolve them\
    \ via the root name servers. Instead of forward first, forward only can be written\
    \ to have all requests forwarded and none sent to the root name servers. This\
    \ makes sense for firewall configurations."
  merge: -1
  img_proc: true
- pgno: 363
  md: '**listen-on port 53** 127.0.0.1; 192.168.0.1; ; tells BIND to which network
    interface and port to listen. The port 53 specification can be left out, since
    53 is the default port. If this entry is completely omitted, BIND accepts requests
    on all interfaces.


    **query-source address** * port 53; This entry is necessary if a firewall is blocking
    external DNS requests. This tells BIND to post requests externally from port 53
    and not from any of the ports greater than 1024.


    **allow-query** 127.0.0.1; 192.168.1/24; ; defines the networks from which clients
    can post DNS requests. The /24 at the end is an abbreviated expression for the
    netmask, in this case 255.255.255.0.


    **allow-transfer** ! *; ; controls which hosts can request zone transfers. This
    example cuts them off completely due to the ! *. Without this entry, zone transfers
    can be requested anywhere without restrictions.


    **statistics-interval** 0; In the absence of this entry, BIND8 generates several
    lines of statistical information in /var/log/messages. Specifying 0 suppresses
    them completely. Otherwise the time in minutes can be given here.


    **cleaning-interval** 720; This option defines at which time interval BIND8 cleans
    its cache. This triggers an entry in /var/log/messages each time it occurs. The
    time specification is in minutes. The default is 60 minutes.


    **interface-interval** 0; BIND8 regularly searches the network interfaces for
    new or no longer existing interfaces. If this value is set to 0, this will not
    be carried out and BIND8 will only listen at the interfaces detected at start-up.
    Otherwise, the interval can be defined in minutes. The default is 60 minutes.


    **notify** no; no prevents other name servers from being informed when changes
    are made to the zone data or when the name server is restarted.


    # The Configuration Section “logging”


    What, how, and where archiving takes place can be extensively configured in BIND8.
    Normally, the default settings should be sufficient. File 47 represents the simplest
    form of such an entry and will completely suppress any logging:'
  merge: -1
  img_proc: true
- pgno: 364
  md: "```\n```text\nlogging {\n    category default { null; };\n};\n```\n```\n\n\
    *File 47: Entry to Suppress Logging*\n\n# Zone Entry Structure\n\n```\n```text\n\
    zone \"my-domain.de\" in {\n    type master;\n    file \"my-domain.zone\";\n \
    \   notify no;\n};\n```\n```\n\n*File 48: Zone Entry for my-domain.de*\n\nAfter\
    \ zone, the name of the domain to administer is specified, my-domain.de, followed\
    \ by and in a block of relevant options enclosed in curly braces, as shown in\
    \ File 48. To define a “slave zone”, the type is simply switched to slave and\
    \ a name server is specified that administers this zone as master (but can also\
    \ be a “slave”), as shown in File 49.\n\n```\n```text\nzone \"other-domain.de\"\
    \ in {\n    type slave;\n    file \"slave/other-domain.zone\";\n    masters {\
    \ 10.0.0.1; };\n};\n```\n```\n\n*File 49: Zone Entry for other-domain.de*"
  merge: -1
  img_proc: true
- pgno: 365
  md: 'The options:


    +   - **type master**; master indicates that this zone is administered on this
    name server. This assumes that your zone file has been properly created.


    +   - **type slave**; This zone is transferred from another name server. Must
    be used together with masters.


    +   - **type hint**; The zone . of the type hint is used for specification of
    the root name servers. This zone definition can be left alone.


    +   - **file "my-domain.zone" or file "slave/other-domain.zone"**; This entry
    specifies the file where zone data for the domain is located. This file is not
    required by slaves, because its contents is read by another name server. To differentiate
    master and slave files, the directory slave is specified for the slave files.


    +   - **masters { 10.0.0.1; }**; This entry is only needed for slave zones. It
    specifies from which name server the zone file should be transferred.


    +   - **allow-update { ! *; }**; This options controls external write access,
    which would allow clients to make a DNS entry — something which is normally not
    desirable for security reasons. Without this entry, zone updates are not allowed
    at all. Note that with the above sample entry, the same would be achieved because
    ! * effectively bars any clients from such access.


    # Structure of Zone Files


    Two types of zone files are needed: one serves to assign IP addresses to host
    names and the other does the reverse — supplies a host name for an IP address.
    "." has an important meaning in the zone files here. If host names are given without
    ending with a ".", the zone is appended. Thus, complete host names specified with
    a complete domain must end with a ".", so the domain is not added to it again.
    A missing point or one in the wrong place is probably the most frequent cause
    of name server configuration errors. The first case to consider is the zone file
    world.zone, responsible for the domain world.cosmos, as in File 50 on the next
    page.'
  merge: -1
  img_proc: true
- pgno: 366
  md: "```\n```text\n$TTL 2D\nworld.cosmos.    IN SOA    gateway  root.world.cosmos.\
    \ (\n                 2001040901 ; serial\n                 1D         ; refresh\n\
    \                 2H         ; retry\n                 1W         ; expiry\n \
    \                2D )       ; minimum\n\n                 IN NS      gateway\n\
    \                 IN MX      10 sun\n\ngateway          IN A       192.168.0.1\n\
    mars             IN A       192.168.1.1\nsun              IN A       192.168.0.2\n\
    moon             IN A       192.168.0.3\nearth            IN A       192.168.1.2\n\
    mars             IN A       192.168.1.3\n```\n```\n\n*File 50: The File /var/lib/named/world.zone*\n\
    \n**Line 1:** `$TTL` defines the standard TTL that applies for all the entries\
    \ in this file, here 2 days. TTL means “time to live”.\n\n**Line 2:** The SOA\
    \ control record begins here:\n\n+   - The name of the domain to administer is\
    \ `world.cosmos` in the first position. This ends with a “.”, because otherwise\
    \ the zone would be appended a second time. Alternatively, a “@” can be entered\
    \ here. Then, the zone would be extracted from the corresponding entry in `/etc/named.conf`.\n\
    +   - After `IN SOA` is the name of the name server in charge as master for this\
    \ zone. The name is extended from `gateway` to `gateway.world.cosmos`, because\
    \ it does not end with a “.”.\n+   - Afterwards, an e-mail address of the person\
    \ in charge of this name server will follow. Since the “@” sign already has a\
    \ special significance, “.” is to be entered here instead, for root@world.cosmos,\
    \ consequently root.world.cosmos. The “.” sign at the end cannot be neglected,\
    \ otherwise, the zone will still be added here.\n+   - A “(” follows at the end\
    \ here, including the following lines up until “)” into the SOA record."
  merge: -1
  img_proc: true
- pgno: 367
  md: 'Line 3: The serial number is an arbitrary number that is increased each time
    this file is changed. It is needed to inform the secondary name servers (slave
    servers) of changes. For this, a ten-digit number of the date and run number,
    written as YYYYMMDDNN, has become the customary format.


    Line 4: The refresh rate specifies the time interval at which the secondary name
    servers verify the zone serial number. In this case, 1 day.


    Line 5: The retry rate specifies the time interval at which a secondary name server,
    in case of error, attempts to contact the primary server again. Here, 2 hours.


    Line 6: The expiration time specifies the time frame after which a secondary name
    server discards the cached data if it has not renegotiated contact to the primary
    server. Here, it is a week.


    Line 7: The minimum time to live states how long the results of the DNS requests
    from other name servers can be cached before they become invalid and have to be
    requested again.


    Line 9: The IN NS specifies the name server responsible for this domain. The same
    is true that gateway is extended to gateway.world.cosmos because it does not end
    with a `.`. There can be several lines like this, one for the primary and one
    for each secondary name server. If notify is not set to no in `/etc/named.conf`,
    all the name servers listed here will be informed of the changes made to the zone
    data.


    Line 10: The MX record specifies the mail server that accepts, processes, and
    forwards e-mails for the domain world.cosmos. In this example, this is the host
    sun.world.cosmos. The number in front of the host name is the preference value.
    If there are multiple MX entries, the mail server with the smallest value is taken
    first and, if mail delivery to this server fails, an attempt will be made with
    the next higher value.


    Line 12–17: These are the actual address records where one or more IP addresses
    are assigned to the host names. The names are listed here without a `.`, because
    they are entered without a domain added and can all be appended with world.cosmos.
    Two IP addresses are assigned to the host gateway, because it has two network
    cards.


    The pseudodomain in-addr.arpa is used to assist the reverse lookup of IP addresses
    into host names. This will be appended, for this purpose, to the network components
    described here in reverse order. 192.168.1 is thus translated into 1.168.192.in-addr.arpa.
    See File 51.'
  merge: -1
  img_proc: true
- pgno: 368
  md: "```\n```text\n1. $TTL 2D\n2. 1.168.192.in-addr.arpa. IN SOA gateway.world.cosmos.\n\
    \                              root.world.cosmos. (\n3.                      \
    \        2001040901       ; serial\n4.                              2D       \
    \        ; refresh\n5.                              2H               ; retry\n\
    6.                              1W               ; expiry\n7.                \
    \              2D )             ; minimum\n8.\n9.                            \
    \  IN NS            gateway.world.cosmos.\n10.\n11. 1                        \
    \    IN PTR          gateway.world.cosmos.\n12. 2                            IN\
    \ PTR          earth.world.cosmos.\n13. 3                            IN PTR  \
    \        mars.world.cosmos.\n```\n```\n\n# File 51: Reverse Lookup\n\n**Line 1:**\
    \ `$TTL` defines the standard TTL that applies to all entries here.\n\n**Line\
    \ 2:** ‘Reverse lookup’ should be activated with this file for the network `192.168.1.0`.\
    \ Since the zone is called ‘1.168.192.in-addr.arpa’ here, it is, of course, undesirable\
    \ to add this to the host name. Therefore, these are all entered complete with\
    \ domain and ending with ‘.’. The rest corresponds to the previous example described\
    \ for world.cosmos.\n\n**Line 3–7:** See the previous example for world.cosmos.\n\
    \n**Line 9:** This line also specifies the name server responsible for this zone.\
    \ This time, however, the name is entered completely with domain and ending with\
    \ ‘.’.\n\n**Line 11–13:** These are the pointer records which are linked to an\
    \ IP address at the respective host name. Only the last part of the IP address\
    \ is entered at the beginning of the line missing the last ‘.’. Now, if the zone\
    \ is appended to this and the in-addr.arpa is neglected, the entire IP address\
    \ will be backwards.\n\nIn this form, the zone files are usable both for BIND8\
    \ and BIND9. Zone transfers between different versions should not normally be\
    \ an issue."
  merge: -1
  img_proc: true
- pgno: 369
  md: '# DNS Sample Configuration


    In the sample configuration of a name server illustrated here, we will make the
    following assumptions: your domain name is world.cosmos, you have a gateway host
    which establishes the Internet connection, and there are two company internal
    networks connected to one another. This host will be our name server and will
    receive the name “gateway”. Your network appears as follows:


    Network 1 includes the hosts:


    +   - gateway IP 192.168.1.1

    +   - earth IP 192.168.1.2

    +   - mars IP 192.168.1.3


    Network 2 includes the hosts:


    +   - gateway IP 192.168.0.1

    +   - sun IP 192.168.0.2

    +   - moon IP 192.168.0.3


    The hosts earth and mars are only connected with sun and moon via the gateway,
    just as all hosts can only access the Internet via gateway.


    The following files are needed to configure the name server:


    +   - **named.conf** the central configuration file

    +   - **world.zone** contains the host table

    +   - **192.168.1.zone** for the subnetwork with the hosts earth and mars

    +   - **192.168.0.zone** for the subnetwork with the hosts sun and moon

    +   - **localhost.zone** contains the IP address of the local host

    +   - **127.0.0.zone** loopback

    +   - **root.hint** contains the Internet root servers


    The `localhost.zone`, `127.0.0.zone`, and `root.hint` files are automatically
    created during installation of BIND 8.

    The file `/etc/named.conf` will have to be adjusted as in File 52.'
