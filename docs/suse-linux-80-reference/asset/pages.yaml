  md: "+   - Save the configuration without testing the X server\n+   - Start the\
    \ X11 System via `startx` or by logging in graphically\n+   - If the image geometry\
    \ is incorrect, start the `xfine2` program as user `root` and adjust the image.\n\
    \n# 7. **SaX2 starts YaST2. Why?**\n\nThere are cases when SaX2 recognizes that\
    \ the configuration requested cannot be performed without updating or installing\
    \ software. If so, SaX2 will start YaST2 to update already installed software\
    \ or to install missing software.\n\n# 8. **Anti-aliasing does not work in multihead\
    \ environments**\n\nAnti-aliasing support, which mainly affects applications linked\
    \ to Qt libraries, can only function in a multihead environment if all the drivers\
    \ support the RENDER extension. Use the program `xdpyinfo` to find out whether\
    \ the RENDER extension is activated on all displays.\n\n# 9. **What should be\
    \ included in support requests?**\n\nIf you wish to consult support regarding\
    \ a problem with SaX2, it is of utmost importance that you attach a current log\
    \ file to the request. This file is generated in the following manner:\n\n+  \
    \ (a) Run SaX2 without parameters. If SaX2 starts, exit the application using\
    \ `(Ctrl) + (Alt) + (←)`.\n+   \n+   (b) The current log file will then be located\
    \ in `/var/log/SaX.log`.\n\n# 10. **No mouse cursor, just a bar code or a colorful\
    \ square.**\n\nIt can happen that the mouse pointer is not visible or only displayed\
    \ as a square, although the mouse is activated. This error can be fixed by entering\
    \ the following line in the Device section in the file `/etc/X11/XF86Config:`\n\
    \n```\nOption \"sw_cursor\"\n```\n\n# 11. **Image is too small or compressed.\
    \ The available monitor settings have already reached their limit.**\n\n+   (a)\
