    To make changes inside the graphical user environment at a later point in its
    operation, XFine2 can be invoked manually at any time. To do this, simply enter
    the command `xfine2`.


    # Starting the Graphical Interface


    Once you have saved your configuration and exited SaX2, you will find yourself
    once again in text mode and, from there, can switch to the graphical login level.
    To do this, use the command `init 5`. Now you can graphically log in to the system.
