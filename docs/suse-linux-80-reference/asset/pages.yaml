- pgno: 104
  md: '# # An Overview of LILO


    The Linux boot loader is usually installed in the MBR (details below, on the following
    page, and in Section *Installing and Uninstalling LILO* on page 103). When started,
    LILO already has access to both real mode hard disks and, due to its installation,
    is able to find all of the data it needs from the two hard drives without requiring
    any partitioning data. Because of this, operating systems can be booted from the
    first as well as from the second hard disk. The entries in the partition table
    that standard DOS MBR uses to mark the active partition are ignored when using
    LILO in the MBR.


    An important difference from the standard DOS boot sequence is that you can select
    any of the installed systems at boot time when using LILO. After loading the MBR
    into memory, LILO is started and you are asked to select one of the installed
    operating systems.


    # ## About LILO


    LILO is a versatile boot manager. It loads boot sectors of partitions from which
    to boot an operating system or it loads the Linux kernel and boots Linux. Furthermore,
    LILO provides the important option of passing a command to the kernel. For security
    reasons, this can be protected totally or partially with a password.


    # ## Booting with LILO


    When LILO is launched, it displays the text LILO and a greeting message (entered
    during installation — see Section *Other LILO Configuration Options* on page 99).
    Thereafter, a command prompt appears:


    ```

    ```text

    boot:

    ```

    ```


    Here, select your operating system by entering its name. It is then booted. The
    name of the operating system was set during installation. At this point, you can
    pass a parameter line to the Linux kernel. Get a list of all the operating system
    names available by pressing `Tab`.


    # ## The Components of LILO


    The LILO machinery consists of the following components:


    +   - the beginning, or *first stage*, of the LILO code in a boot sector that
    activates the system boot.'
  merge: -1
  img_proc: true
- pgno: 105
  md: '> > **Tip**

    > >

    > > The boot sectors installed by LILO contain a byte sequence similar to that
    which is characteristic for boot sector viruses. Therefore, it is not unusual
    for DOS virus scanners to claim to have detected the AIRCOOP boot sector virus
    in files such as `/boot/chain.b` or `/boot/os2_d.b`.


    +   - the heart of the LILO code, localized in `/boot/boot.b`

    +   - a map file, normally `/boot/map`, where LILO enters the location of Linux
    kernels and other data during its installation

    +   - optional: a message file, the contents of which are shown in the opening
    message preceding the LILO boot selection. It is usually located in `/boot/message`
    (or similar)

    +   - the different Linux kernel and boot sectors that LILO should offer


    > > **Caution**

    > >

    > > Any write access (even through file movements) to any of these files corrupts
    the map file, requiring you to reinstall LILO (see *Installation After Changing
    the Configuration* on page 103). This is especially important when changing kernels.


    # LILO Locations


    This section refers to the *first stage* of LILO mentioned above. Consider this
    general restriction: depending on the BIOS version on your computer, it may be
    required that the kernel image `/boot/vmlinuz` be located on the *first 1024 cylinders*
    of the hard disk. This can be achieved with a small extra partition that can be
    “mounted” in the directory `/boot`, all of which is located within the first 1024
    cylinders.


    For many BIOS versions still available, only these first 1024 cylinders can be
    accessed by the BIOS drivers during the boot phase. In most cases, only the *first
    two hard disks* can be used. If you have a very old BIOS, it is possible that
    the existence of (E)IDE hard disks could prevent your SCSI devices from booting.'
  merge: -1
  img_proc: true
- pgno: 106
  md: "Only newer BIOS versions allow access to additional devices, for example, in\
    \ connection with EIDE hard disk controllers for up to four EIDE devices. Many\
    \ modern SCSI controllers even allow SCSI devices to be “pushed to the front”\
    \ to make them bootable. To use this feature with LiLO, look at the disk options\
    \ on page 101.\n\nFor the sake of simplicity, all this is referred to as the “1024-cylinder\
    \ limit.” It should be considered while partitioning your hard disks *before*\
    \ installing Linux for the first time. Afterwards, it may be too late and may\
    \ cause a lot of extra work. For more information, see Section *The 1024-Cylinder\
    \ Limit* on page 115. The following locations are acceptable for storing the LiLO\
    \ boot sector.\n\n+   - **on a floppy disk.** This is the most secure, but also\
    \ the slowest alternative for booting with LiLO (see Section *Boot Disk with LiLO*\
    \ on page 107). Choose this alternative if you do not want to change boot sectors.\n\
    +   \n+   - **in the boot sector of a primary Linux partition on the first hard\
    \ disk.** This leaves the MBR untouched. Before it can be booted, the partition\
    \ must be marked active, with fdisk. If Linux is fully installed on logical drives\
    \ or partitions on the second hard disk, there is only the boot sector of the\
    \ extended drive of the first drive left, if there is one. Linux fdisk can also\
    \ activate such a partition.\n+   \n+     To boot multiple systems from the hard\
    \ disk, this is extremely awkward. Every time you want to boot, you have to activate\
    \ the corresponding boot sector *beforehand*. The next two variants are much less\
    \ cumbersome.\n+   \n+   - **in the Master Boot Record.** This variation offers\
    \ the highest flexibility. It is the only alternative possible if all of the Linux\
    \ partitions reside on the second hard disk and there is no extended partition\
    \ on the first drive. Every setting of the MBR must be edited with extreme care\
    \ since errors may have severe consequences. The safety aspects are described\
    \ in Section *Installing and Uninstalling LiLO* on page 103.\n+   \n+   - **in\
    \ a boot sector booted by another boot manager.** Try this if you have used another\
    \ boot manager and want to continue using it. Depending on its flexibility and\
    \ power, there are several variations. A common case: you have a primary Linux\
    \ partition on the second hard disk from which you boot Linux. Your boot manager\
    \ is able to boot this partition via a boot sector. Then you can activate your\
    \ Linux partition by installing LiLO into this boot sector and telling your boot\
    \ manager that it is active."
  merge: -1
  img_proc: true
- pgno: 107
  md: '> > **Caution**

    > >

    > > Be careful if you try to make a logical Linux partition bootable by installing
    LILO onto it. Success is not guaranteed for version 8.0, even if your other boot
    manager is able to launch logical partitions.


    Try it if you like. The safest way is to try it with a tiny Linux installation
    to see if it will work. Perhaps you will be lucky. The recommended way is still
    to create a primary and bootable Linux partition.


    # ## Configuring LILO


    LILO is a flexible boot manager that offers many ways of adapting a configuration
    to your needs. The most important options and meanings are described below. For
    more detail, look at [Alm94].


    LILO is configured in `/etc/lilo.conf`. If you are installing LILO for the first
    time, use YaST to configure LILO. Fine-tune by editing `/etc/lilo.conf` later
    stage.


    > > **Note**

    > >

    > > `/etc/lilo.conf` should only be readable for root, as it could contain passwords
    (see Section *Other LILO Configuration Options* on page 99). This is the default
    setting with SuSE Linux. If in doubt, check by running `chmod 0600 /etc/lilo.conf`
    as root.


    It is recommended to keep any existing old and working `lilo.conf` files backed
    up in a safe place. Your settings only take effect when you reinstall LILO after
    changing `/etc/lilo.conf` (see Section *Installing and Uninstalling LILO* on page
    103).


    # ### Structure of lilo.conf


    `/etc/lilo.conf` starts with a global section followed by one or more system sections
    for each operating system LILO should start. A new section is started by a line
    beginning with either `image` or `other`.


    The order of entries in `/etc/lilo.conf` only matters in that the first one in
    the list is booted by default if no user interaction is taken — this can be set
    to delay and timeout.'
  merge: -1
  img_proc: true
