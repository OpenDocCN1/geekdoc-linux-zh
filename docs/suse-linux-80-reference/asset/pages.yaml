- pgno: 217
  md: '# Generating Print Jobs for Local Queues


    The typical print command is `lpr -Pqueue file`.


    If the option `-Pqueue` is omitted, the default is taken from the PRINTER environment
    variable PRINTER. This is also true for the `lpq` and `lprm` commands — see the
    man page for `lpr` (man lpr), the man page for `lpq` (man lpq), and the man page
    for `lprm` (man lprm). The environment variable PRINTER is automatically set when
    you log in and can be checked with the command `echo $PRINTER` and reset to another
    queue with `export PRINTER=queue`.


    # Generating Print Jobs for Remote Queues


    Remote queues can also be accessed by the LPRng spooler via the `lpr` command
    with `lpr -Pqueue@printserver file`. Replace `printserver` with the name or the
    IP address of a print server and `queue` with the queue name on the print server.
    This, of course, also requires that the print server is configured so that you
    can print on its queues. For more information on this, see the item *Printer connected
    to a print server with filtering on the print server* in the section *Printing
    in the TCP/IP Network* below.


    # Showing Status for Remote Queues


    Query the remote queue using the commands:


    ```

    newbie@earth:  > lpq -Pqueue@printserver

    newbie@earth:  > lpq -l -Pqueue@printserver

    newbie@earth:  > lpq -L -Pqueue@printserver

    ```


    This status query can be helpful, particularly if you cannot print over the remote
    queue. Refer to the item *Verify remote lpd* in Section *Printing in the TCP/IP
    Network* below.


    # Deleting Print Jobs in Remote Queues


    All self-generated print jobs can be deleted in remote queues by entering the
    commands:


    ```

    newbie@earth:  > lprm -Pqueue@printserver jobnumber

    newbie@earth:  > lprm -Pqueue@printserver all

    ```


    root does not have any access privileges to remote queues.'
  merge: -1
  img_proc: true
- pgno: 218
  md: "# # The Print Filter\n\nlpdfilter (package lpdfilter) is used as the print\
    \ filter. The basic method of operation of the print filter is described in the\
    \ *Basics* manual in Section *Print Job Procedure*. A detailed description of\
    \ the print job procedure is presented in the following. For an exact analysis\
    \ of the print filter, browse the print filter scripts (especially `/usr/lib/lpdfilter/bin/if`).\
    \ You may also want to proceed as described in Section *Print Filter Troubleshooting*\
    \ on page 215.\n\n+   1. The print filter (`/usr/lib/lpdfilter/bin/if`) defines\
    \ options passed to it directly from the spooler or reads the options from the\
    \ print job’s “control file” and from the `/etc/printcap` and `/etc/lpdfilter/queue/conf`\
    \ files of the respective queue (queue in the path name should be replaced by\
    \ the actual queue name).\n+   \n+   2. It defines the type of data to be printed.\
    \ The script `/usr/lib/lpdfilter/bin/guess` uses the file command to find out\
    \ the type of data. The command’s output defines the type of data to print depending\
    \ on the specifications in the `/etc/lpdfilter/types` file.\n+      - If it is\
    \ an ascii queue, the print filter is forced to treat the data to print as ASCII\
    \ text.\n+      - If it is not an ascii queue, the print filter will attempt to\
    \ detect the type of data to print.\n+   \n+   3. Depending on the type of data\
    \ to print and the queue, the data is then converted to printer-specific information:\n\
    +      - If it is a raw queue, the data is usually relayed directly to the printer\
    \ (or to another queue). However, depending on the settings in `/etc/lpdfilter/queue/conf`,\
    \ it might also be converted with recode. If it is an absolute raw queue — without\
    \ an lpdfilter — you must remove the line `:if=/usr/lib/lpdfilter/bin/if:\\` in\
    \ `/etc/printcap` of the respective queue.\n+      - If it is not a raw queue:"
  merge: -1
  img_proc: true
- pgno: 219
  md: "+   (a) If the print data is not PostScript, it will first be converted to\
