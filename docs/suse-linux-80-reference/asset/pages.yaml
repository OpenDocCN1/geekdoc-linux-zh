- pgno: 17
  md: '# Starting Your System from the CD-ROM


    Insert the first SuSE Linux CD or the DVD into the drive. Then, restart the computer
    to load SuSE Linux, install from the medium located in the drive, and set up your
    machine.


    # The Opening Screen


    As the boot screen appears, SuSE Linux is preparing the installation. Follow its
    progress in the segmented bar on the left.


    If your machine does not boot from the CD-ROM, change the settings in the computer’s
    BIOS. At initial start-up, a diagnosis of the computer’s hardware is conducted
    and, among other things, the random access memory is tested. Recognize this by
    the system memory count. At the bottom of the screen, the key that calls up the
    BIOS setup is listed — usually (Del) or (F1). Press the key specified to access
    the BIOS setup.


    If your machine is equipped with an AWARD BIOS, the relevant entry is labeled
    BIOS FEATURES SETUP. Other manufacturers use similar entries, such as ADVANCED
    CMOS SETUP. Select the corresponding entry and confirm with (↵). Relevant for
    your purposes is the subitem normally listed as ‘Boot Sequence’.


    The default setting for this is usually C, A or A, C. In the first example, when
    booting, the machine searches for boot information on the C drive then on the
    A drive. Select ‘Boot Sequence’ then press (PageUp) and (PageDown) until the A,
    CDROM, C sequence is shown.


    Next, exit these settings by pressing (Esc). To save the changes, select ‘SAVE
    & EXIT SETUP’ or press (F10). At this point, you will be asked if you want to
    exit the BIOS setup and save these new settings.


    If you have a SCSI CD-ROM drive, access the controller’s BIOS — in the case of
    an Adaptec host adapter, with (Ctrl) + (A). Select ‘Disk Utilities’. The system
    checks the hardware installed and displays the corresponding information.


    Make note of the SCSI ID for your CD-ROM. Next, exit the menu with (Esc). Open
    ‘Configure Adapter Settings’. You will find ‘Boot Device Options’ under ‘Additional
    Options’. Select this menu and press (↵). Now enter the CD-ROM drive ID and press
    (↵). Return to the start screen in the SCSI BIOS by pressing (Esc) twice, which
    can be exited by confirming with ‘Yes’ to reboot the machine.


    A few seconds later, SuSE Linux starts loading a minimal Linux system that takes
    over the rest of the installation procedure. A number of messages and copyright
    notices then appear on the screen. At the end of the loading process, the YaST2
    program will start, and a few seconds later, the graphical interface of YaST2,
    the SuSE Linux installation program, is displayed.'
  merge: -1
  img_proc: true
- pgno: 18
  md: '![](img/a4b6c994843f3fbd688003f4cabfa48f_18_0.png)


    *Figure 2.1: The Boot Screen*


    # YaST2 Takes Over


    Now the actual installation of SuSE Linux starts with the YaST2 installation program.
    All YaST2 screens have a common format. All entry fields, lists, and buttons on
    the YaST2 screens can be accessed with your mouse. If your cursor does not move,
    your mouse has not been automatically recognized by Linux. You will then need
    to use your keyboard.


    # Selecting a Language


    SuSE Linux and YaST2 are adapted to use the language selected. English is the
    default setting for the international distribution of SuSE Linux. These settings
    can be changed individually.


    If your mouse does not work, navigate with the arrow keys to the desired language
    then press `Tab` repeatedly until the ‘Next’ is selected. Then press `↵`.


    # Installation Mode


    If you already have a SuSE Linux version installed on your computer, decide whether
    to perform a ‘New Installation’, ‘Update’ the existing installation, or boot the
    existing system. If you do not have a SuSE Linux version installed, begin a new
    installation by clicking ‘Next’ to continue (Figure 2.3 on page 9). Only a ‘New
    Installation’ is discussed in this chapter.'
  merge: -1
  img_proc: true
- pgno: 19
  md: '![](img/a4b6c994843f3fbd688003f4cabfa48f_19_0.png)


    *Figure 2.2: Selecting the Language*


    # Installation Suggestions


    After the hardware has been detected and the mouse configured, YaST2 provides
    information about the detected hardware and the suggested installation and partitioning
    selections. If you modify any of the suggestions, YaST2 returns you to this screen
    after the changes are complete. The following sections are devoted to the various
    configuration settings available.


    # Mouse


    If YaST2 did not recognize your mouse type automatically, use `Tab` until ‘Change’
    is highlighted. Press `Space` and the arrow keys until the menu item ‘Mouse’ is
    selected. Press `Enter` to open a mouse type selection screen, illustrated in
    Figure 2.4 on page 10.


    To select your mouse type, use the up and down arrow keys. Your mouse documentation
    should include a description of the mouse type. Select the mouse type from the
    list. Confirm your selection by pressing `Alt` + `T` or pressing `Tab` then confirming
    with `Enter`.


    Now, test to see if your mouse is working. If the mouse cursor on the screen follows
    your mouse movements, your mouse is configured correctly. If the cursor does not
    move, select a different mouse type and try again.'
  merge: -1
  img_proc: true
- pgno: 20
  md: '![](img/a4b6c994843f3fbd688003f4cabfa48f_20_0.png)


    *Figure 2.3: Selecting Installation Type*


    # ## Time Settings


    In this screen (Figure 2.5 on page 11), choose between Local Time and GMT in the
    field marked ‘Set hardware clock to’. Your selection depends on the BIOS clock
    settings for your computer. If the hardware clock is set in the BIOS to GMT, SuSE
    Linux automatically reflects Standard and Daylight Savings time changes.


    # ## Keyboard Layout


    Select your preferred keyboard layout in this screen. The initial setting corresponds
    to the language chosen. Adjust this if needed. Type any special characters in
    the test field to make sure the keyboard settings are correct. If the characters
    displayed do not correspond with those typed, try a different layout. ‘Next’ returns
    to the suggestions.'
  merge: -1
  img_proc: true
- pgno: 21
  md: '![](img/a4b6c994843f3fbd688003f4cabfa48f_21_0.png)


    *Figure 2.4: Selecting the Mouse Type*


    # Partitioning


    The suggested partitioning appears with a confirmation option, allowing you to
    accept, change, or discard the suggestion. See *More Partitioning Tips* on page
    16 regarding automatic entries in `/etc/fstab`. Clicking “Change” opens the “Partitioner”.


    YaST2 shows all partitions present on the selected hard disk (Figure 2.6 on page
    12). Any free storage space is shown and automatically selected. To assign more
    disk space to Linux, you can assign more partitions following the order from the
    last to the first partition. If you have three partitions, it is not possible
    to use the second one for Linux and the first and third for other operating systems.


    If you choose “Discard”, a dialog appears containing the hard disk selection (Figure
    2.7 on page 13). All the hard disks on your system are listed here. Decide where
    to install SuSE Linux. There is no risk associated with selecting the hard disk,
    as no changes are made at this time.


    The menu “Advanced Settings, Manual Partitioning” shows the previous partitioning
    of your system, which can be manually modified or reused for your new system.


    By clicking “Entire hard disk”, the entire hard disk and all its partitions are
    activated for Linux. If you already installed a Windows operating system with
    a FAT file system, you will be asked if you want to delete or shrink the Windows
    partition (refer to *Resizing a Windows Partition* on page 12). **Caution:** All
    partitions and data existing on this hard disk will be lost.'
  merge: -1
  img_proc: true
- pgno: 22
