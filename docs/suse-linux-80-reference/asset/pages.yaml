- pgno: 354
  md: '# /etc/nsswitch.conf


    With the GNU C Library 2.0, the “Name Service Switch” (NSS) became more important.
    See the man page for `nsswitch.conf(5)` for more details, *The GNU C Library Reference
    Manual*, Chap. “System Databases and Name Service Switch”. Refer to package `libcinfo`,
    series doc.


    In the `/etc/nsswitch.conf` file, the order of certain data is defined. An example
    of `nsswitch.conf` is shown in File 43. Comments are preceded by `#` signs. Here,
    for instance, the entry under “database” hosts means that a request is sent to
    `/etc/hosts` (files) via DNS (see Section *DNS — Domain Name Service* on page
    349).


    ```

    ```text

    #

    # /etc/nsswitch.conf

    #

    passwd:    compat

    group:     compat


    hosts:     files dns

    networks:  files dns


    services:  db files

    protocols: db files


    netgroup:  files

    ```

    ```


    *File 43:* `/etc/nsswitch.conf`


    The “databases” available over NSS are listed in Table 13.10 on the following
    page. In addition, automount, bootparams, netmasks, and publickey are expected
    in the near future.


    | Database | Description |

