    # Activating and Testing the Parallel Port


    After rebooting, the parallel port is activated.

    Rather than rebooting, as user root, it is sufficient to update the dependency
    list of the kernel modules and to unload then reload the kernel modules pertaining
    to the parallel port.


    ```

    ```text

    earth: # depmod -a 2>/dev/null

    earth: # rmmod lp

    earth: # rmmod parport_pc

    earth: # rmmod parport

    earth: # modprobe parport

    earth: # modprobe parport_pc

    earth: # modprobe lp

    ```

    ```


    If the printer is able to print ASCII text, you should be able to enter, as user
    root, the command


    ```

    ```text

    earth: # echo -en "\rHello\r\f" > /dev/lp0

    ```

    ```


    to print a page that contains the word Hello.

    This way, the word Hello is made print-compatible by preceding it with the ASCII
    character \r for the carriage return, followed by the ASCII character \f to trigger
    a line feed.

    /dev/lp1 should be used as a second parallel port and /dev/lp2 for the third.


    # USB Connections


    A USB interrupt must be activated in the computer’s BIOS. For example, in an Award
    BIOS, set the entry such as ‘USB IRQ’ to Enabled in the menu pertaining to ‘PNP
    AND PCI SETUP’.'
