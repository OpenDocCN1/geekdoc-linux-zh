- pgno: 247
  md: '> > **Tip**

    > >

    > > You should make sure that modules whose functionality may now have been directly
    compiled into the kernel are removed from `/lib/modules/<Version>`. Otherwise,
    unexpected effects could occur. This is one reason why the inexperienced user
    is strongly advised against compiling the kernel.


    Enter an additional label Linux.old as boot image in your `/etc/lilo.conf` (also
    see Section *Structure of lilo.conf* on page 96) and rename the old kernel `/boot/vmlinuz.old`.
    Thus, you can make sure you can still boot using the previous kernel if the new
    one does not work properly. This option is described in detail in Chapter *Booting
    and Boot Managers* on page 89.


    When you have adapted `/etc/lilo.conf` to your needs, enter `lilo`. If you boot
    Linux from DOS via `linux.bat` (loadlin), you must copy the kernel to `/dosc/loadlin/bzImage`
    (or to the directory where you have installed loadlin) for it to be available
    for the next boot.


    If you start Linux via the Windows NT boot manager, you will have to copy the
    LILO boot sector to the Windows NT start partition again (see Section *Windows
    NT and Linux on One Hard Disk* on page 108 for details).


    Furthermore, the file `/System.map` contains kernel symbols required by the modules
    to ensure successful launching of kernel functions. This file depends on the current
    kernel. Therefore, once you have compiled and installed the kernel, you should
    copy `/usr/src/linux/System.map` to the directory `/boot`. This file is regenerated
    each time the kernel is recompiled. If you create your kernel using `make bzilo`
    or `make zlilo`, this is done for you automatically.


    If you get an error message such as "System.map does not match current kernel",
    then System.map most likely has not been copied.


    # Creating a Boot Disk


    To create a boot disk with the new kernel, use the following command:


    ```

    earth:/usr/src/linux # make bzdisk

    ```'
