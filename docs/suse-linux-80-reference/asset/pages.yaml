    \     In the selection ‘Default System with Office’, a wide array of office applications\
    \ are available, which incorporate word processing, spreadsheets, drawing tools,\
    \ and a daily planner. It makes your PC an office workstation. If you need a well-balanced\
    \ software system for a fully functional office environment, choose this option.\n\
    \n> **Note**  \n> You can choose additional components and software. To increase\
    \ storage space for SuSE Linux at this point, click ‘Back’ until you reach *Partitioning*\
    \ on page 10. You then can add more hard disk space."
  merge: -1
