- pgno: 283
  md: '# File System Hierarchy Standard (FHS) and the

    Linux Standard Base (LSB)


    # File System Hierarchy Standard (FHS)


    SuSE Linux strives, as far as possible, to conform to the File system Hierarchy
    Standard (FHS, package fhs, series doc. See also http://www.pathname.com/fhs/).
    For this reason, it is sometimes necessary to move files or directories to their
    “correct” places in the file system.


    # Linux Standard Base (LSB)


    SuSE supports the Linux Standard Base project. Current information on this can
    be found at http://www.linuxbase.org.

    The LSB specification version for 8.0 is 1.0. From now on, the Filesystem Hierarchy
    Standard (FHS) is included in the specification and defines settings such as the
    package format and the initialization of the system. See Chapter The SuSE Linux
    Boot Concept on page 297.


    # teTeX — TeX in SuSE Linux


    teTeX is put together according to the TeX Directory Structure (TDS) (see ftp://ftp.dante.de/tex-archive/tds/),
    without compromising the FHS.


    # Example Environments for FTP and HTTP


    # About FTP


    To make it easier to set up an FTP server, the package ftpdir package includes
    an example environment. This is installed in /usr/local/ftp.


    # About HTTP


    Apache is the standard web server in SuSE Linux. Together with the installation
    of Apache, some example documents are made available in /usr/local/httpd. To set
    up your own web server, it is recommended to enter your own DocumentRoot in /etc/httpd/httpd.conf.'
  merge: -1
  img_proc: true
- pgno: 284
  md: '# Hints on Special Software Packages


    # Package cron


    The cron tables are now located in `/var/cron/tabs` (not, as previously, in `/var/lib/cron`).
    `/etc/crontab` serves as a system-wide cron table. Enter the name of the user
    who should run the command directly after the time table (see File 36, where root
    is entered). Package-specific tables, located in `/etc/cron.d`, have the same
    format. See the man page for cron (man 8 cron).


    ```

    1–59/5 * * * * root test -x /usr/sbin/atrun && /usr/sbin/atrun

    ```


    > *File 36: Example of an Entry in /etc/crontab*


    `/etc/crontab` cannot be processed with `crontab -e`. It must be loaded directly
    into an editor, modified, then saved.

    A number of packages install shell scripts to the directories `/etc/cron.hourly`,
    `/etc/cron.daily`, `/etc/cron.weekly`, and `/etc/cron.monthly`, whose instructions
    are controlled by `/usr/lib/cron/run-crons`. `/usr/lib/cron/run-crons` is run
    every fifteen minutes from the main table (`/etc/crontab`). This guarantees that
    processes that may have been neglected can be run at the proper time. Do not be
    surprised if, shortly after booting, the user nobody turns up in the process tables
    and is highly active. This probably means that nobody is just updating the locale
    (see *Section Security and Local Administration Services* on page 316).


    # Log Files — the Package logrotate


    There are a number of system services (“daemons”), which, along with the kernel
    itself, regularly record the system status and specific events to log files. This
    way, the administrator can regularly discern the status of the system at a certain
    point in time, recognize errors or faulty functions, and troubleshoot to reach
    a targeted solution. These log files are normally stored in `/var/log` as specified
    by FHS and grow on a daily basis. The package `logrotate` package helps control
    the growth of these files.


    # Update to logrotate (8.0)


    The old settings listed below will be adopted when updating to 8.0:


    +   - Entries from `/etc/logfile` not associated with a particular package are
    moved to `/etc/logrotate.d/aaa_base`.'
  merge: -1
  img_proc: true
- pgno: 285
  md: "+   - The variable `MAX_DAYS_FOR_LOG_FILES` from the former `rc.config` file\
    \ is mapped as dateext and manage in the configuration file. Refer to the man\
    \ page for `logrotate` (man 8 logrotate).\n\n# Configuration\n\nConfigure logrotate\
    \ with the file `/etc/logrotate.conf`. In particular, the include specification\
    \ primarily configures the additional files to be read. SuSE Linux ensures that\
    \ individual packages install files in `/etc/logrotate.d` (e.g., `syslog` or `yast`).\
