- pgno: 261
  md: 'If the chipset does not belong to the list of known faulty chipsets, and still
    is not recognized, the following parameters can be added instead:


    ```

    `ide{number}={basis}|{control}|{irq}`

    ```


    | Variable | Values / Meaning |

    |---|---|

    | `{number}` | adapter number, usually 0 or 1, but also 3 or 4 |

    | `{basis}` | base address of the adapter, usually `0x1f0`, `0x170`, `0x1e8` or
    `0x168` |

    | `{control}` | control register of the adapters, usually `0x3f6`, `0x376`, `0x3ee`
    or `0x36e` |

    | `{irq}` | interrupt of the adapters, usually 14, 15, 11 or 10 |


    If the chipset does not belong to the list of known faulty chipsets, but still
    causes problems, the following parameters can be added instead:


    ```

    `ide{number}={tune}`

    ```


    | Variable | Values / Meaning |

    |---|---|

    | `{number}` | adapter number, usually 0 or 1, but also 3 or 4 |

    | `{tune}` | autodetune the highest possible PIO value is tried, not supported
    by all chipsets; noautotune no improvement in speed; serialise no time overlapping
    of operations with the next adapter |


    # Other devices


    +   - *Ethernet* network cards


    ```

    `ether={irq},{addr}|{par1}|{par2}|...{par8}|,{Name}`

    ```


    The various parameters for `{par1}` to `{par8}` have different meanings for several
    drivers. Usually, only two parameters are needed, where the first is the start
    address and the second is the end address of *shared memory*. The first non-numerical
    argument is treated as the name.


    `{irq}`    the interrupt used; 0 for autoprobbing

    `{addr}`   port address; 0 for autoprobbing


