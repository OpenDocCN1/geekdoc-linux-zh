- pgno: 332
  md: '# Linux in the Network


    Today, networked computers are so prevalent that stand-alone machines not at least
    connected online part of the time are becoming a rare sight. Linux, really a child
    of the Internet, offers all the necessary networking tools and features for integration
    into all types of network structures.


    An introduction to the customary Linux protocol, TCP/IP, will follow. The various
    services and special features of this protocol are then discussed.


    After introducing the basics, you will be shown how to set up network access using
    a network card with the help of YaST2. The central configuration files will be
    discussed and some of the most essential tools described.


    You can basically configure your entire network using YaST2. Because network configuration
    can get rather complicated, we will only describe the fundamental mechanisms and
    the relevant network configuration files in this chapter.


    The configuration of Internet access with PPP via modem, ISDN, or other connection
    can be completed with YaST2. It is described in the *Configuration Manual*.


    # TCP/IP — The Protocol Used by Linux


    Linux and other Unix operating systems use the TCP/IP protocol. To be exact, it
    not a single network protocol, but a family of network protocols that offer various
    services. TCP/IP was developed based on an application used for military purposes
    and was defined in its present form in an RFC in 1981. RFC stands for “Request
    for Comments”. They are documents that describe various Internet protocols and
    implementation procedures for the operating system and its applications. Access
    these RFC documents directly over the web at http://www.ietf.org/. Since then,
    the TCP/IP protocol has been refined, but the basic protocol has remained virtually
    unchanged since 1981.'
  merge: -1
  img_proc: true
- pgno: 333
  md: "> **Tip**\n> \n> The RFC documents describe the setup of Internet protocols.\
    \ To expand your knowledge about any of the protocols, the appropriate RFC document\
    \ is the right place to start: http://www.ietf.org/rfc.html\n\nThe services listed\
    \ in Table 13.1 are provided for the purpose of exchanging data between two Linux\
    \ machines via TCP/IP.\n\n| Protocol | Description |\n|---|---|\n| TCP | **Transmission\
    \ Control Protocol:** A connection-oriented secure protocol. The data to transmit\
    \ is first sent by the application as a stream of data then converted by the operating\
    \ system to the appropriate format. The data arrives at the respective application\
    \ on the destination host in the original data stream format in which it was initially\
    \ sent. TCP determines whether any data has been lost during the transmission\
    \ and that there is no mix-up. TCP is implemented wherever the data sequence matters.\
    \ |\n| UDP | **User Datagram Protocol:** A connectionless, insecure protocol.\
    \ The data to transmit is sent in the form of packets already generated by the\
    \ application. The order in which the data arrives at the recipient is not guaranteed\
    \ and data loss is a possibility. UDP is suitable for record-oriented applications.\
    \ It features a smaller latency period than TCP. |\n| ICMP | **Internet Control\
    \ Message Protocol:** Essentially, this is not a user-friendly protocol, but a\
    \ special control protocol that issues error reports and can control the behavior\
    \ of machines participating in TCP/IP data transfer. In addition, a special echo\
    \ mode is provided by ICMP that can be viewed using the program ping. |\n| IGMP\
    \ | **Internet Group Management Protocol:** This protocol controls the machine\
    \ behavior when implementing IP multicast. The following sections do not contain\
    \ more information regarding IP multicasting, because of space limitations. |\n\
    \n*Table 13.1: Several Protocols in the TCP/IP Protocol Family*"
  merge: -1
  img_proc: true
- pgno: 334
  md: 'Networks, combined by TCP/IP, comprising a world-wide network are also referred
    to, in their entirety, as “the Internet.”


    Almost all hardware protocols work on a packet-oriented basis. The data to transmit
    is packaged in “bundles”, as it cannot be sent all at once. This is why TCP/IP
    only works with small data packets. The maximum size of a TCP/IP packet is approximately
    sixty-four kilobytes. Actually, the packets are normally quite a bit smaller,
    as the network software can be a limiting factor. The maximum size of a data packet
    on an ethernet is about fifteen hundred bytes. The size of a TCP/IP packet is
    limited to this amount when the data is sent over an ethernet. If more data is
    transferred, more data packets need to be sent by the operating system.


    To be absolutely specific, it should actually not be termed TCP/IP protocol, but
    simply referred to as IP protocol. IP (Internet Protocol) is where the insecure
    data transfer takes place. TCP (Transmission Control Protocol), to a certain extent,
    is simply the upper layer for the IP platform serving to guarantee secure data
    transfer. The IP layer itself is, in turn, supported by the bottom layer, the
    hardware-dependent protocol, such as ethernet.'
  merge: -1
  img_proc: true
- pgno: 335
  md: '# Layer Model


    Professionals refer to this structure as the “layer model”. Network architectures
    can be divided into various layers. See Figure 13.1.


    ![](img/a4b6c994843f3fbd688003f4cabfa48f_335_0.png)


    *Figure 13.1: Simplified Layer Model for TCP/IP*


    The diagram illustrates one or two examples for each layer. As you can see, the
    layers are ordered according to “degrees of abstraction”. The bottommost layer
    is very close to the hardware. The uppermost layer, however, is almost a complete
    abstraction of the hardware. Every layer has its own special function, clarified
    in the following.


    The special functions of each layer are already implicit in their description.
    For example, the network used (e.g., ethernet) is depicted by the bit transfer
    and security layers.


    +   - While layer 1 deals with cable types, signal forms, signal codes, and the
    like, layer 2 is responsible for accessing procedures (which host may send data?)
    and correcting errors. Layer 1 is called the bit transfer layer. Layer 2 is called
    security layer


    +   - Layer 3 is the communication layer and is responsible for remote data transfer.
    The network layer ensures that the data arrives at the correct remote recipient
    and can be delivered.


    +   - Layer 4, the transport layer, is responsible for application data. The transport
    layer ensures the data arrives in the correct order and none is lost. The security
    layer is only there to make sure that the data that has arrived is correct. The
    transport layer protects data from being lost.


    +   - Finally, layer 5 is the layer where data is processed by the application
    itself.'
  merge: -1
  img_proc: true
- pgno: 336
  md: 'For every layer to serve its designated function, additional information regarding
    each layer must be saved in the data packet. This takes place in the header of
    the packet. Every layer attaches a small block of data, called the protocol header,
    to the front of each emerging packet. A sample TCP/IP data packet traveling over
    an ethernet cable is illustrated in Figure 13.2.


    ![](img/a4b6c994843f3fbd688003f4cabfa48f_336_0.png)


    *Figure 13.2: TCP/IP Ethernet Packet*


    The proof sum is located at the end of the packet, not at the beginning. This
    simplifies things for the network hardware. The largest amount of usage data possible
    in one packet is 1460 bytes in an ethernet network.


    When an application sends data over the network, the data passes through each
    layer, all implemented in the Linux kernel except layer 1: network card. Each
    layer is responsible for preparing the data so it can be passed to the next layer
    below. The lowest layer is ultimately responsible for sending the data.


    The entire procedure is reversed when data is received. Like the layers of an
    onion, in each layer the protocol headers are removed from the usage data. Finally,
    layer 4 is responsible for making the data available for use by the applications
    at the destination.


    In this manner, one layer only communicates with the layer directly above or below
    it. For applications, it is irrelevant whether data is being transmitted via a
    100 MBit/s FDDI network or via a 56-kbit/s modem line. Likewise, it is also irrelevant
    for the data transfer what data is being sent, as long as it has been properly
    compressed.


    The nice thing about the layer model is that each layer practically functions
    independently. If, for example, an amplifier is used for the electrical signals
    on the modem line (this actually exists and is known as a repeater), the amplifier
    would just have to recognize layers 1 and 2 to interpret the packets properly.'
  merge: -1
  img_proc: true
- pgno: 337
  md: '**Table 13.2: How an IP Address is Written**


    |  |  |

    |---|---|

    | IP Adress (binary) | `11000000 10101000 00000000 00010100` |

    | IP Adress (decimal) | `192. 168. 0. 20` |


    To ensure correct packet transfer, a gateway would only have to understand the
    protocols up to layer 3 — IP. The packets do not necessarily have to relate to
    one another in any way for the packets to be transferred properly.


    # IP Addresses and Routing


    # IP Addresses


    Every computer on the Internet has a unique 32-bit address. These 32 bits (or
    4 bytes) are normally written as illustrated in the second row in Table 13.2.
    In decimal form, the four bytes are written in the decimal number system, separated
    by periods.


    More precisely, not only does one given host receive an IP address, but, also,
    each network interface in this host. The IP address is assigned to a host or a
    network interface. It cannot be used anywhere else in the world. There are certainly
    exceptions to this rule, but these play a minimal role in the following passages.


    The ethernet card itself has its own unique address: the MAC (media access control)
    address. It is 48 bits long, internationally unique, and is programmed into the
    hardware by the network card vendor. There is, however, an unfortunate disadvantage
    of vendor-assigned addresses — the MAC addresses do not make up a hierarchical
    system, but are instead more or less randomly distributed. Therefore, they cannot
    be used for addressing remote machines. The MAC address plays an important role
    in communication between hosts in a local network and is the main component of
    the protocol header from layer 2.


    The points already indicate that the IP addresses make up a hierarchical system.
    Until the 1990s, the IP addresses were strictly categorized in classes. According
    to this class system, the first byte (Class A: 1.x.x.x — 127.x.x.x), the first
    two bytes (Class B: 128.x.x.x — 191.255.x.x), or the first three bytes (Class
    C: 192.0.0.x — 223.255.255.x) made up the network address and the remaining bytes
    indicated the hosts on a given network. However, this system has proven to be
    too inflexible and therefore was discontinued. Now, “classless routing” (or CIDR,
    Classless Inter Domain Routing) is used.'
  merge: -1
  img_proc: true
- pgno: 338
  md: 'Netmasks were conceived for the purpose of informing the host with the IP address
    192.168.0.20 of the location of the host with the IP address 192.168.0.1.


    # Netmasks and Routing


    To put it simply, the netmask on a host with an IP address defines what is “internal”
    and what is “external”. Hosts located “internally” (professionals say, “in the
    same subnetwork”) respond directly. Hosts located “externally” (“not in the same
    subnetwork”) only respond via a gateway or router. Since every network interface
    can receive its own IP address, it can get quite complicated.


    Before a network packet is sent, the following runs on the computer: the IP address
    is linked to the netmask via a logical AND, and the address of the sending host
    is likewise connected to the netmask via the logical AND. If there are several
    network interfaces available, normally all possible sender addresses will be verified.


    The results of the AND links will be compared. If there are no discrepancies in
    this comparison, the destination, or receiving host, is located in the same subnetwork.
    Otherwise, it will have to be accessed via a gateway. That means that the more
    “1” bits are located in the netmask, the fewer hosts can be accessed directly
    and the more hosts can be reached via a gateway. Several examples are illustrated
    in Table 13.3 on the following page.


    The netmasks appear once again — along with the IP addresses — in decimal form
    divided by periods. Since the netmask is also a 32-bit value, four number values
    are written next to each other. Which hosts are gateways or which address domains
    are accessible over which network interfaces must be entered in the user configurations.


    To give another example: all machines connected with the same ethernet cable are
    usually located in the same subnetwork and are directly accessible. When the ethernet
    is divided by switches or bridges, these hosts can still be reached. However,
    the economical ethernet is no longer suitable for covering larger distances. You
    will then have to transfer the IP packets to another hardware (e.g. FDDI or ISDN).
    These devices are called routers or gateways. A Linux machine can, of course,
    also carry out this task. The respective option is referred to as ip_forwarding.


    If a gateway has been configured, the IP packet will be sent to the appropriate
    gateway. This will then attempt to forward the packet in the same manner, from
    host to host, until it reaches the destination host or the packet’s TTL (time
    to live) has expired.'
