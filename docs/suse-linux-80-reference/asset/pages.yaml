    \n+   - Printer on the parallel port\n+     `lp={parport0} [lp={parport1} [lp={parport2}]]`\n\
    \n| Variable | Values / Meaning |\n|---|---|\n| `{parportX}` | parallel port |\n\
    \nExample: `lp=parport0 lp=parport2`\n\n# modprobe Parameters\n\nThis section\
    \ describes those parameters that can be loaded as modules. If you encounter difficulties\
    \ while loading a driver (although you have entered the parameters), or if there\
    \ is no section describing the parameter, then you may have to integrate this\
    \ driver into a monolithic kernel.\n\nSome drivers cannot be built as modules\
    \ yet and some recognize your hardware properly only if they are compiled into\
    \ the kernel. Despite this, we recommend trying the “module variant” first.\n\n\
    If a driver is loaded as a module, each and every variable used can be overwritten\
    \ on the command line. There is, for example, the variable io in the NE2000 driver\
    \ that specifies the used I/O range. For this, the correct command for loading\
    \ this module is (see Section *Kernel Modules* on page 230):\n\n```\nearth:/ #\
    \ modprobe ne io=0x300 irq=10\n```\n\nBe aware that there should be no spaces\
    \ before or after the `=`. Hexadecimal values must be set in the given form (with\
    \ a leading `0x`).\n\n> **Note**\n> \n> To enter more than one parameter, separate\
    \ them with spaces. This is the main difference from entering parameters at the\
    \ LILO prompt, where no blanks should be used within the parameters for one driver.\n\
    \nThe parameters you enter here can also be integrated into"
