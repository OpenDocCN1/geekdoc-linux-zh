    # Configuring the Print System with lprsetup


    Normally, the printer system is configured with YaST2, as described in the *Basics*
    manual in Chapter *YaST2, Printers*. The lprsetup program is also available. It
    can be fully operated in command-line mode.


    If a printer is configured with YaST2, YaST2 collects the necessary information
    then invokes lprsetup with the necessary options, creating the actual configuration.
    The lprsetup program is intended as an “expert” tool. In contrast to YaST2, lprsetup
    does not provide any assistance in choosing the right values for each of the options.


    `lprsetup --help` briefly outlines the available options. More extensive information
    is available in the man page for `lprsetup` (man `lprsetup`) and the man page
    for `lpdfilter` (man `lpdfilter`).


    For information relating to Ghostscript drivers and driver-specific parameters,
    see Section *A Little About Ghostscript* on page 215.


    # The Printer Spooler and Its Management Tools


    # The Printer Spooler (lpd)


    By default, the LPRng (package `lprng`) is generally used as the printer spooler.
    The printer spooler lpd (Line Printer Daemon) is normally activated when booting
    by invoking the script `/etc/init.d/lpd`. The printer spooler daemon that runs
    in the background can be started and stopped manually by entering:


    ```

    earth:  # rclpd start

    earth:  # rclpd stop

    ```


    The printer spooler checks in the configuration file `/etc/printcap` what print
    queues are defined and organizes the handling of the “spooled” jobs:


    +   - The printer spooler manages the local queues. It sends the data file of
    each job through the print filter, if necessary, then either directly to the printer
    or relays it to another queue.'
  merge: -1
  img_proc: true
- pgno: 215
  md: '+   - It takes into consideration the order of print jobs in the queue.

    +   - It monitors the status of the queues and printer and provides relevant information
    when requested.

    +   - It listens to port 515 to accept (or reject) print jobs from remote computers
    for local queues.

    +   - It relays print jobs on queues to remote machines to their printer spoolers.


    Details on the LPRng spooler can be found in the LPRng Howto in file: `/usr/share/doc/packages/lprng/LPRng-HOWTO.html`,
    in the man page for `printcap` (man printcap), and in the man page for `lpd` (man
    lpd).


    # Management Tools for the Printer Spooler


    You need root permission for numerous manipulations on the print queues. The management
    tools are outlined in the *Basics* manual, in Section *Commands for Managing the
    Print System* and in the LPRng HOWTO in file: `/usr/share/doc/packages/lprng/LPRng-HOWTO.html#LPRNGCLIENTS`.
    For this reason, we only summarize this information below.


    **lpq -Pqueue** shows the print jobs in the queue specified. If `all` is given
    as an LPRng spooler queue, all print jobs will be shown in all queues. `lpq -l
    -Pqueue` shows more extensive information and `lpq -L -Pqueue` outputs a detailed
    status report good for troubleshooting. See *Showing Status for Remote Queues*
    for more information. Also take a look at the man page for `lpq` (man lpq) and
    file: `/usr/share/doc/packages/lprng/LPRng-HOWTO.html#LPQ` in the LPRng HOWTO.


    **lprm -Pqueue jobnumber** deletes the print job with the given job number from
    the specified queue. Only root can delete jobs sent by other users. root can delete
    all print jobs in all queues in the LPRng spooler by entering the command `lprm
    -Pall all`.


    More information is given in Section *Generating Print Jobs* on the next page,
    in the man page for `lprm` (man lprm), in file: `/usr/share/doc/packages/lprng/LPRng-HOWTO.html#LPRM`,
    and in the *Possible Problems* on page 193.


    **lpc** controls the print queues: these can be specified by name or you can specify
    all. Most of the lpc commands listed below can only be executed by root. The most
    important options are:


    +   - `help` — provides a brief overview of the options'
