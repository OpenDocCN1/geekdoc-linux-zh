    to the correct OpenGL libraries or extensions. These scripts are located in `/usr/X11R6/bin`.
    Possible values are:


    +   - `no` — execute no script.

    +   - `switch2mesasoft` — emulation of Mesa-Software (works with all graphics
    cards)

