  \n# 第一部分：文件与用户\n\n## 第一章：引言\n\n如果说有一句话可以总结 GNU/Linux（以及因此的 Unix）的核心概念，那就是“文件和进程”。在本章中，我们将回顾\
  \ Linux 文件和进程模型。理解这些模型非常重要，因为系统调用几乎都与修改文件或进程的某些属性或状态有关。\n\n接下来，由于我们将检查两种风格的代码，我们将简要回顾\
  \ 1999 年标准 C 与原始 C 语言之间的主要差异。接着，我们将详细讨论让 GNU 程序变得“更好”的编程原则；我们将在代码中看到这些原则的应用。之后，我们将讨论一些与编程风格相关的通用问题，并探讨人工智能在软件开发中的应用。\n\
  \n本章包含了一些刻意的简化。详细细节将随着书籍的推进逐步介绍。如果你已经是 Linux 大师了，请原谅我们。\n\n### 1.1 Linux/Unix 文件模型\n\
  \n原始 Unix 设计的目标之一是*简单性*。简单的概念易于学习和使用。当这些概念被转换为简单的 API 时，简单的程序就易于设计、编写和确保正确。此外，简单的代码通常比复杂的设计更小、更高效，且更容易维护和修改。\n\
  \n对简单性的追求受两个因素驱动。从技术角度来看，开发 Unix 的原始 PDP-11 小型计算机的地址空间很小：较小系统总共为 64 KB，大型系统则有 64\
  \ KB 代码和 64 KB 数据。这些限制不仅适用于普通程序（用户级代码），还适用于操作系统本身（内核级代码）。因此，“小即是美”不仅是美学上的考量，而且是因为根本没有选择！\n\
  \n第二个因素是对当时操作系统的反面反应，那些操作系统没必要地复杂，命令语言晦涩，有多种类型的文件 I/O，且缺乏通用性或对称性。（Steve Johnson\
  \ 曾评论道：“使用 TSO 就像试图在沙滩上踢一头死鲸。”TSO 就是上述的一种晦涩的大机分时共享系统。）\n\n#### 1.1.1 文件与权限\n\nUnix\
  \ 文件模型简单到了极致：文件就是一个字节流。仅此而已。操作系统没有对文件施加任何预定义的结构：没有固定或变化的记录大小，没有索引文件，什么都没有。对文件内容的解释完全取决于应用程序。（这并不完全准确，正如我们很快看到的，但对于开始来说足够了。）\n\
  \n一旦你有了一个文件，就可以对文件数据做三件事：读取、写入或执行。\n\nUnix 是为分时小型计算机设计的；这意味着多用户环境。一旦有了多个用户，必须能够指定文件的权限：可能用户\
  \ `jane` 是用户 `fred` 的老板，`jane` 不希望 `fred` 读取最新的性能评估。\n\n出于文件权限目的，用户被分为三个不同的类别：*用户*（user），即文件的所有者；*组*（group），即与该文件相关的用户组（稍后讨论）；*其他*（other），意味着其他人。对于这些类别中的每一类，*每个*文件都有关联的独立读取、写入和执行权限位，总共九个权限位。这出现在\
  \ `ls -l` 输出的第一个字段：\n\n```\n$ ls -l progex.texi\n-rw-rw-r-- 1 arnold arnold 5100\
  \ Jan 25 14:55 progex.texi\n```\n\n\n\n\n在这里，`arnold` 和 `arnold` 是 `progex.texi`\
  \ 的所有者和组，而 `-rw-rw-r--` 是文件类型和权限。第一个字符是连字符 `-` 表示普通文件，`d` 表示目录，或者是一小部分其他字符中的其中一个，表示目前不重要的其他类型文件。随后的每三个字符一组，分别代表所有者、组和“其他”的读、写、执行权限。\n\
  \n在这个示例中，`progex.texi` 所有者和组可读、可写，其他人可读。连字符表示权限缺失；因此，任何人都无法执行该文件，“其他”也无法写入该文件。\n\
  \n文件的所有者和组以数值值的形式存储，称为 `user ID` (UID) 和 `group ID` (GID)；我们在书后部分介绍的标准库函数使得将这些值打印为人类可读的名称成为可能。\n\
  \n文件的所有者可以使用 `chmod`（更改模式）命令更改权限。（因此，文件权限有时被称为“文件模式”）。文件的组和所有者可以分别通过 `chgrp`（更改组）和\
  \ `chown`（更改所有者）命令进行更改。\n\n某些系统允许普通用户将其文件的所有权转移给他人，即“将其送人”。这些细节由 POSIX 标准化，但有些混乱。典型的\
  \ GNU/Linux 配置不允许这种操作。\n\n组权限旨在支持协作工作：虽然组或部门中的某个人可能拥有某个特定文件，但可能该组中的每个人都需要能够修改它。（考虑一份协作编写的营销论文或调查数据。）\n\
  \n当系统检查文件访问时（通常在打开文件时），如果进程的 UID 与文件的 UID 匹配，则应用所有者权限。如果这些权限拒绝了操作（例如，向具有 `-r--rw-rw-`\
  \ 权限的文件写入），操作将失败；Unix 和 Linux 不会继续测试组和其他权限。如果 UID 不同但 GID 匹配，情况也是如此；如果组权限拒绝了操作，操作将失败。\n\
  \n当然，所有者可以随时更改权限。大多数用户不会为自己禁用写权限。\n\nUnix 和 Linux 支持 `superuser`（超级用户）的概念：一个具有特权的用户。该用户被称为\
  \ `root`，其 UID 为零。`root` 被允许做*任何事情*；所有限制都失效，所有大门都敞开，所有抽屉都未锁。（这可能产生重大的安全影响，我们在书中会提到这一点，但不会详尽介绍。）因此，即使文件模式为\
  \ `----------`，`root` 仍然可以读写该文件。（唯一的例外是文件无法执行。但由于 `root` 可以添加执行权限，这种限制并阻止任何事情。）\n\
  \n该规则有一些罕见的例外，但它们都超出了本书的范围。\n\n用户/组/其他、读/写/执行权限模型非常简单，又足够灵活，可以涵盖大多数情况。存在更强大但更复杂的模型，并实现在不同的系统中，但没有哪一个足够标准化且得到广泛实现，到值得在像这样的一本通用书中进行讨论。\n\
  \n### 1.1.2 目录和文件名\n\n一旦你有一个文件，就需要一个地方存放它。这就是 `directory`（在 Windows 和 Mac 系统上被称为“文件夹”）的目的。目录是一种特殊文件，它将文件名与特定的文件元数据集合关联，这些集合被称为\
  \ `inodes`。目录之所以特殊，是因为它们只能由操作系统通过第 4 章第 79 页“文件和文件 I/O”描述的系统调用来更新。它们同样特殊之处在于，操作系统规定了目录条目的格式。\n\
  \n文件名可以包含任何有效的 8 位字节，但 `/`（正斜杠）字符和 ASCII NUL（所有位均为零的字符）除外。早期 Unix 系统文件名限制为 14 字节；现代系统允许单个文件名长达\
  \ 255 字节。\n\ninode 包含了关于文件的所有名称以外的所有信息：类型、所有者、组、权限、大小以及修改和访问时间。它还存储了包含文件数据的磁盘块的位置。这些都是*关于*文件的数据，而不是文件本身的数据，因此该术称为\
  \ `metadata`（元数据）。\n\n对于目录，读、写、执行的含义与文件略不同。读权限意味着搜索目录的能力——即遍历它以查看包含哪些文件。写权限是在目录中创建*并删除*文件的能力。执行权限是在打开或通过方式访问包含的文件或子目录时进入目录的能力。\n\
  \n**注意**\n\n如果你对一个目录具有写权限，你就可以删除该目录中的文件，即使它们不属于你！当交互式使用时，`rm` 命令会注意到这一点，并在这种情况下要求你确认。\n\
  \n`/tmp` 目录对所有人都有写权限，但你在 `/tmp` 中的文件是相当安全的，因为 `/tmp` 通常设置了所谓的粘性位（sticky bit）：\n\n\
  ```\n$ ls -ld /tmp\ndrwxrwxrwt 19 root root 36864 Nov 12 06:54 /tmp\n```\n\n注意 `t`\
  \ 是第一个字段的最后一个位置。在大多数目录中，该位置是 `x`。设置粘性位后，只有你作为文件所有者或 `root` 才能删除你的文件。（我们将在第 11.4.2\
  \ 节“目录和粘性位”，第 392 页详细讨论。）\n\n### 1.1.3 可执行文件\n\n还记得我们说过操作系统没有对文件施加结构吗？很好，我们已经看到对于目录来说这是一个谎言，对于二进制可执行文件也是如此。要运行一个程序，内核必须知道文件的哪些部分代表指令（代码），哪些部分代表数据。这引出了\
  \ `object file format`（目标文件格式）的概念，它定义了这些内容在磁盘文件中的布局方式。\n\n尽管内核只会运行以正确格式布局的文件，但创建这些文件取决于用户级工具。编程语言的编译器（如\
  \ C、C++、Fortran、Go 或 Rust）创建目标文件，然后链接器或加载器（通常命名为 `ld`）将目标文件与库例程绑定以创建最终的可执行文件。注意，即使文件在所有正确的位置都具有所有正确的标记位，如果没有开启相应的执行权限位（或至少为\
  \ `root` 开启一个执行位），内核也不会运行它。\n\n由于编译器、汇编器和加载器都是用户级工具，因此随着需求的发展，更改目标文件格式是（相对）容易的；只需向内核“教授”新格式，就可以使用该格式。加载可执行文件的部分较小，这并非不可完成的任务。因此，Unix\
  \ 目标文件格式随着时间不断演变。原始格式被称为 `a.out`（汇编器输出）。下一个格式在某些商业系统中仍在使用中，被称为 COFF（通用对象文件格式），而目前最广泛使用的格式是\
  \ ELF（可扩展链接格式）。现代 GNU/Linux、BSD 系统和 Solaris 使用 ELF。\n\n内核内核通过查看文件前几个字节中的特殊*魔数*来识别可执行文件是否包含二进制对象代码。这些是内核识别为特殊的两个或四个字节序列。为了向后兼容，现代\
  \ Unix 系统识别多种格式。ELF 文件以四个字符 `\"\\177ELF\"` 开头。\n\n\n\n\n\n除了二进制可执行文件，内核还支持可执行的 `scripts`。此类文件也以魔数开头——在这种情况下，是两个普通字符\
  \ `#!`。脚本是由解释器执行的程序，例如 shell、`awk`、Perl、Python 或 Ruby。`#!` 行提供了解释器的完整路径，以及一个可选的单个参数：\n\
  \n```bash\n#! /usr/bin/awk -f\nBEGIN { print \"hello, world\" }\n```\n\n假设上述内容位于一个命名为\
  \ `hello.awk` 的文件中，并且该文件是可执行的。当你输入 `hello.awk` 时，内核运行该程序就像你输入了 `/usr/bin/awk -f\
  \ hello.awk` 一样。任何额外的命令行参数也会传递给程序。在这种情况下，`awk` 运行程序并打印出众所知的 `hello, world` 信息。\n\
  \n`#!` 机制是隐藏二进制可执行文件与脚本可执行文件区别的一种优雅方式。如果将 `hello.awk` 重命名为 `hello`，输入 `hello` 的用户无法得知（实际上他们也不应该知道）`hello`\
  \ 不是一个二进制可执行程序。\n\n### 1.1.4 设备\n\nUnix 最显著的创新之一是文件 I/O 和设备 I/O 的统一。设备以文件的形式出现在文件系统中，普通权限适用于它们的访问，并且相同的\
  \ I/O 系统调用用于打开、读取、写入和关闭它们。所有让设备看起来像文件的“魔法”都隐藏在内核中。这是驱动简单性原则的另一个体现；我们可以将其表述为*用户代码没有特殊情况*。\n\
  \n有两个设备在日常中使用频繁出现，特别是在 shell 层：`/dev/null` 和 `/dev/tty`。\n\n`/dev/null` 是“垃圾桶”。所有发送到\
  \ `/dev/null` 的数据都会被操作系统丢弃，从其读取的操作总是立即返回文件结束（EOF）。\n\n`/dev/tty` 是进程当前的控制终端——当用户输入中断字符（通常是\
  \ CTRL-C）或执行作业控制（CTRL-Z）时它监听的终端。\n\nGNU/Linux 系统以及许多现代 Unix 系统提供了 `/dev/stdin`、`/dev/stdout`\
  \ 和 `/dev/stderr` 设备，它们为每个进程在启动时继承的打开文件提供了命名方式。\n\n其他设备代表真实的硬件，例如磁盘驱动器、DVD 驱动器和串口。还有软件设备，例如伪\
  \ tty，用于网络登录和窗口系统。`/dev/console` 代表系统控制台，是微型计算机上的特定硬件设备。在现代计算机上，`/dev/console` 是屏幕和键盘，但它可能是一个串口。串口控制台在嵌入式系统中仍然常见。\n\
  \n遗憾的是，设备命名规范并没有标准化，每个操作系统对磁带、磁盘等都有不同的名称。设备的 `ls -l` 输出的第一个字符中具有 `b` 或 `c`：\n\n\
  ```bash\n$ ls -l /dev/tty /dev/zero /dev/nvme0n1\nbrw-rw---- 1 root disk 259, 0\
  \ Nov 11 18:54 /dev/nvme0n1\ncrw-rw-rw- 1 root tty    5, 0 Nov 11 19:15 /dev/tty\n\
  crw-rw-rw- 1 root root   1, 5 Nov 11 18:54 /dev/zero\n```\n\n初始的 `b` 代表块设备，`c` 代表字符设备。设备文件将在[第\
  \ 5.4 节，“获取文件信息”中进一步讨论。\n\n### 1.2 Linux/Unix 进程模型\n\n进程是一个运行中的程序。进程具有以下属性：\n\n\
  *   唯一的进程标识符 (PID)\n*   父进程（带有关联的标识符 PPID）\n*   权限标识符（UID, GID、组集等）\n*   进程组标识符\n\
  *   地址空间，与所有其他进程的地址空间分开\n*   在该地址空间中运行的程序\n*   当前工作目录 `.`\n*   当前根目录 `/`（更改此处是一个高级主题）\n\
  *   一组打开的文件、目录或二者兼有\n*   用于创建新文件的拒绝权限掩码\n*   一组表示环境的字符串\n*   调度优先级（高级主题）\n*   信号处理的设置（高级主题）\n\
  *   通常情况下（但不总是）有一个控制终端（也是高级主题）\n\n进程可以被挂起，在这种情况下它们不是“运行”状态；然而，它们也没有被终止。在任何情况下，在学习曲线上升的早期，不要过于刻求是最好的。\n\
  \n当 `main()` 开始执行时，所有这些都已准备就绪。新进程总是由现有进程创建；现有进程称为*父进程*，新进程称为*子进程*。启动时，内核创建第一个，它承担多种功能。所有其他进程都是\
  \ `init` 的后代。\n\n子与父进程的关系是一对一的；每个进程只有一个父进程，因此很容易找到父进程。父与子进程的关系是一对多的；任何给定进程都可以创建无限数量的子。因此，进程没有简单的方法找到其所有子进程\
  \ PID。\n\n每个进程的地址空间（内存）都是独立的。除非两个进程显式安排共享内存，否则一个进程无法影响另一个进程的地址空间。这很重要；它提供了基本的安全性和可靠性。（为了效率，系统安排所有进程共享相同程序的只读执行代码。这对用户和运行程序都是透明的。）\n\
  \n当前工作目录是相对路径（不以 `/` 开头的路径）所在的目录。这是你在 shell 执行 `cd` 命令后的所在地。\n\n根据约定，所有程序启动时都会打开三个文件：标准输入、标准输出和标准错误。它们分别是输入来源、输出去向和错误消息去向。在本书中，我们将看到这些是如何设置的。父进程可以打开额外的文件并让子进程可用；子进程必须通过某种约定或命令行参数或环境变量知道这些文件的存在。\n\
  \n环境是一组字符串，每个字符串的格式为 `name=value`。存在用于查询和设置环境变量的函数，子进程会继承其父进程的环境。典型的环境变量是 shell\
  \ 中的 `PATH` 和 `HOME` 等。\n\n至重要的一点是，单个进程在其整个生命周期内可能会执行多个程序。除非显式更改，否则所有系统维护的属性（当前目录、打开的文件、PID\
  \ 等）都保持不变。\n\n\n\n\n\n将“启动新进程”与“选择在进程中运行哪个程序”分离来是 Unix 的一项关键创新。它使得许多操作变得简单直观。其他将这两种操作结合的操作系统通用性较差，使用起来也更复杂。\n\
  \n### 1.2.1 管道：将进程钩接在一起\n\n你无疑在 shell 中用过管道构造（`|`）来连接两个或多个正在运行的程序。管道就像一个文件：一个进程使用标准的写操作向其写入，另一个进程使用读操作从其读取。这些进程（通常）并它们的输入/输出是一个管道而不是普通文件。\n\
  \n正如内核隐藏了设备的“魔术”，使其表现得像普通文件一样，内核也为管道做了这些工作：它安排在管道填满时暂停管道的写入者，并在没有数据等待读取时暂停读取者。\n\
  \n因此，带管道的文件 I/O（输入输出）范式充当了连接运行程序的关键机制；不需要临时文件。再次，这是通用性和简单性的体现：用户代码无需处理特殊情况。\n\n\
  ### 1.3 标准 C 与 原始 C\n\n多年来，C 语言的事实定义可以在 Brian Kernighan 和 Dennis Ritchie 合著的书籍《C\
  \ 语言程序》第一版中找到。这本书描述了 C 在 Unix 上以及贝尔实验室开发者将其移植到的系统上的 C 状态。在整本书中，我们称之为“原始 C（Original\
  \ C）”，尽管根据该书的两位作者将其称为为“K&R C”也很常见。（Dennis Ritchie 设计并实现了 C 语言。）\n\n1990 年的 ISO C\
  \ 标准将该语言的定义正式化，包括 C 库中的函数（如 `printf()` 和 `fopen()`）。C 标准委员会在标准化现有实践方面做了令人赞叹的工作，并避免了发明新功能，尽管这有一个显著的例外（以及一些少数微小的例外）。语言中最可见的改变是使用了从\
  \ C++ 借用的“函数原型（function prototypes）”。\n\n标准 C、C++ 和 Java 编程语言都使用函数原型进行函数声明和定义。原型不仅描述了函数的返回值，还描述了参数的数量和类型。有了原型，编译器可以在函数调用处进行完全的类型检查。考虑以下示例，该函数根据给定的角度（度）返回该角度的正弦值：\n\
  \n```\n 1  /* ch-intro-sindegrees.c --- do sin(), converting from degrees */\n 2\n\
  \ 3  #include <math.h>\n 4\n 5  #define PI 3.1415927\n 6\n 7  double\n 8  sin_degrees(double\
  \ degrees)\n 9  {\n10      degrees = fmod(degrees, 360.0); // 取值范围 0-360，类似于 degrees\
  \ %= 360\n11\n12      double circle_fraction = degrees / 360.0;\n13      double\
  \ radians = circle_fraction * 2.0 * PI;    // 转换为弧度\n14\n15      return sin(radians);\n\
  16  }\n```\n\n作为良好的函数的做法，有一个头文件来声明该函数：\n\n```\n1  /* ch-intro-sindegrees.h --- do\
  \ sin(), converting from degrees */\n2\n3  extern double sin_degrees(double degrees);\n\
  ```\n\n这里有一个使用它的测试程序：\n\n```\n 1  /* ch-intro-sindegrees-test1.c --- test sin_degrees()\
  \ function */\n 2\n 3  #include <stdio.h>\n 4  #include <stdlib.h>\n 5  #include\
  \ <math.h>\n 6\n 7  #include \"ch-intro-sindegrees.h\"\n 8\n 9  #define PI 3.1415927\n\
  10\n11  /* main --- 测试它 */\n12\n13  int\n14  main(void)\n15  {\n16      double radians\
  \ = PI * 0.25; // 1/4 PI = 45 度\n17\n18      printf(\"sin(%lf) = %lf\\n\", radians,\
  \ sin(radians));\n19      printf(\"sin_degrees(45) = %lf\\n\", sin_degrees(45));\n\
  20\n21      exit(EXIT_SUCCESS);\n22  }\n```\n\n让我们编译这些部分并运行程序：\n\n```\n$ gcc -c\
  \ ch-intro-sindegrees.c\n$ gcc -c ch-intro-sindegrees-test1.c\n$ gcc ch-intro-sindegrees-test1.o\
  \ ch-intro-sindegrees.o -lm \\\n>     -o ch-intro-sindegrees-test1\n$ ch-intro-sindegrees-test1\n\
  sin(0.785398) = 0.707107\nsin_degrees(45) = 0.707107\n```\n\n到目前为止，一切良好——这正是我们看到的。这有什么意义呢？首先，看第\
  \ 19 行对 `sin_degrees()` 的调用：`sin_degrees(45)`。我们传递了一个 `int`，但函数期望的是 `double`。由于原型的存在，编译器知道在调用之前自动将\
  \ `45` 转换为 `45.0`。如果我们进行了错误的调用，例如 `sin_degrees(\"45\")`，编译器会给我们一个非常显式的错误诊断：\n\n\
  ```\n$ gcc -c ch-intro-sindegrees-test-bad.c\nch-intro-sindegrees-test-bad.c: In\
  \ function 'main':\nch-intro-sindegrees-test-bad.c:19:55: error: incompatible type\
  \ for argument 1 of 'sin_degrees'\n   19 |         printf(\"sin_degrees(45) = %lf\\\
  n\", sin_degrees(\"45\"));\n      |                                            \
  \                  ~~~~\n      |                                               \
  \               |\n      |                                                     \
  \         char *\nIn file included from ch-intro-sindegrees-test-bad.c:7:\nch-intro-sindegrees.h:3:34:\
  \ note: expected 'double' but argument is of type 'char *'\n    3 | extern double\
  \ sin_degrees(double degrees);\n      |                           ~~~~~~\n```\n\n\
  对比使用函数原型的工作方式与没有原型时的方式。在原始 C 中，你声明一个函数时带有返回类型，但无法提供有关参数的信息：\n\n```\nextern double\
  \ sin_degrees();\n```\n\n这里是同一个测试程序，但只有这样的声明，而不是包含头文件：\n\n```\n 1  /* ch-intro-sindegrees-test2.c\
  \ --- test sin_degrees() function */\n 2\n 3  #include <stdio.h>\n 4  #include <stdlib.h>\n\
  \ 5  #include <math.h>\n 6\n 7  extern double sin_degrees();\n 8\n 9  #define PI\
  \ 3.1415927\n10\n11  /* main --- 测试它 */\n12\n13  int\n14  main(void)\n15  {\n16\
  \      double radians = PI * 0.25; // 1/4 PI = 45 度\n17\n18      printf(\"sin(%lf)\
  \ = %lf\\n\", radians, sin(radians));\n19      printf(\"sin_degrees(45) = %lf\\\
  n\", sin_degrees(45));\n20\n21      exit(EXIT_SUCCESS);\n22  }\n```\n\n主要的区别在于第\
  \ 7 行。当我们编译并运行代码时，发生了什么：\n\n```\n$ gcc -c ch-intro-sindegrees-test2.c\n$ gcc ch-intro-sindegrees-test2.o\
  \ ch-intro-sindegrees.o -lm \\\n>     -o ch-intro-sindegrees-test2\n$ ch-intro-sindegrees-test2\n\
  sin(0.785398) = 0.707107                 正确结果\nsin_degrees(45) = 0.000000      \
  \         错误的结果！\n```\n\n在这里，编译器并不知道将 `45` 转换为 `45.0`，因此我们得到了一个非常错误的结果。\n\n这种错误通常会导致难以发现的运行时问题（例如段错误，导致程序崩溃），而\
  \ Unix 的 `lint` 程序是为了处理这类问题而创建的。\n\n原始 C 在函数定义的写法上也与标准 C 不同。函数定义在函数头中列出参数名称，然后在函数体之前声明参数。`int`\
  \ 类型的参数不需要声明，如果函数返回 `int`，也不需要声明：\n\n```\nmyfunc(a, b, c, d)                   \
  \      返回类型为 int\nstruct my_struct *a, *b;\ndouble c;                          \
  \        注意，没有声明参数 d\n{\n    ...\n}\n```\n\n所以，尽管函数原型是对现有实践的激进偏离，但它们额外的类型检查被认为重要到不可或，因此它们在几乎没有反对的情况下被添加到语言中。\n\
  \n在 1990 年的标准 C 中，以原始风格编写的声明和定义都是有效的。这使得使用符合标准的编译器继续编译数百万行代码成为可能。显然，新代码应该使用原型编写，以提高编译时错误检查的可能性。\n\
  \n1999 年的标准 C 继续允许原始风格的声明和定义。然而，“隐式 `int`”规则已被删除；函数必须有返回类型，且所有参数都必须声明。\n\n\n\n\n\
  此外，当程序调用一个未正式声明的函数时，原始的 C 会为该函数创建一个隐式声明，并赋予其返回类型 `int`。1990 年标准 C 也是这样做，并额外说明它没有关于参数的信息。1999\
  \ 年标准 C 不再提供这种“自动声明”功能。\n\n标准 C 中其他值得关注的添加包括来自 C++ 的 `const` 关键字，以及由委员会设计的 `volatile`\
  \ 关键字。1999 年 C 引入了布尔类型（`bool` 和 `<stdbool.h>` 头文件），使得 C 代码变得更加整洁。对于你将在本书中看到的代码，理解不同的函数声明和定义语法是最重要的。\n\
  \n对于使用原始风格定义的 V7 代码，我们添加了注释来显示等效的型声明。否则，我们保持代码原样，倾向于准确展示其原始编写方式，以及你亲自下载代码时会看到的样子。\n\
  \n自 1999 年以来，C 标准经过多次修订。然而，书中的任何程序都不需要这些标准中为语言添加的任何主要新功能，这些功能也不会影响我们对基础 Linux/Unix\
  \ API 的讨论或使用。出于这个原因，我们在示例中坚持使用 1999 C。\n\n### 1.4 为什么 GNU 程序更好\n\n是什么让一个 GNU 程序成为\
  \ GNU 程序的？是什么让 GNU 软件比其他（免费或非免费）软件“更好”？最明显的区别是 GNU 通用公共许可证（GPL），它描述了 GNU 软件的分发条款。但这通常不是你听到人们说“获取\
  \ `xyz` 的 GNU 版本，它好得多”的原因。GNU 软件通常比标准 Unix 版本更健壮，性能也更好。在本节中，我们将探讨其中的一些原因，以及描述 GNU\
  \ 软件设计原则的文档。\n\n本节节选自作者发表在 *Linux Journal* 第 16 期上的一篇文章。（参见 `https://www.linuxjournal.com/article/1135`。）经许可后转载并改编。\n\
  \n*GNU Coding Standards*（GNU 编码标准）手册描述了如何为 GNU 项目编写软件。它涵盖了广泛的内容。你可以在 `https://www.gnu.org/prep/standards.html`\
  \ 在线阅读 *GNU Coding Standards*。查看在线版本获取其他格式源文件的索引。\n\n在本节中，我们只描述 *GNU Coding Standards*\
  \ 中与程序设计和实现相关的部分。\n\n#### 1.4.1 程序设计\n\n*GNU Coding Standards* 的第 3 章提供了关于程序设计的通用建议。四个主要问题是兼容性（与标准和\
  \ Unix）、编写语言、对其他程序非标准特性的依赖（一言之，“无无”）以及“可移植性”的含义。\n\n与标准 C 和 POSIX（以及较小程度上与 Berkeley\
  \ Unix）的兼容性是一个重要目标。但这不是首要目标。通想法是提供所有必要的功能，并带有命令行选项提供严格的 ISO 或 POSIX 模式。\n\nC 是编写\
  \ GNU 软件的首选语言，因为它是最常用的语言。尽管编码标准倾向于使用 C 而非 C++，但 C++ 现在也很常见。一个用 C++ 编写的广泛使用的 GNU\
  \ 软件包是 `groff`（GNU `troff`）。由于 GCC 支持 C++，根据我们的经验，从源码安装 `groff` 并不困难。如今，人们倾向于直接使用其\
  \ GNU/Linux 发发版提供的包管理器。\n\n标准指出，可移植性有点像红��鱼（误导信息）。GNU 工具最终旨在运行在带有 GNU C Library\
  \ 的 GNU 内核上。但由于内核尚未完成，且用户在非 GNU 系统上使用 GNU 工具，可移植性是理想的，尽管不是首要。标准建议使用 Autoconf 在不同\
  \ Unix 系统之间实现可移植性。\n\n此表述指的是 HURD 内核，遗憾的是，它已经开发了十年。如今 GCC 和 GNU C Library (GLIBC)\
  \ 的开发是在基于 Linux 的系统进行的。\n\n#### 1.4.2 程序行为\n\n*GNU Coding Standards* 的第 4 章提供了关于程序行为的通用建议。我们将在下面详细查看其中一个章节。该章关注程序设计、格式化错误消息、编写库（通过使其具有重入性）以及命令行界面的标准。\n\
  \n错误消息格式化非常重要，因为几个工具（特别是 Emacs）使用错误消息来帮助你直接找到源文件或数据文件中发生错误的地方。\n\nGNU 工具应该使用名为 `getopt_long()`\
  \ 的函数来处理命令行。该函数为传统的 Unix 风格选项（`gawk -F: ...`）和 GNU 风格的长选项（`gawk --field-separator=:\
  \ ...`）提供了命令行选项解析。所有程序都应该提供 `--help` 和 `--version` 选项，当在一个程序中使用长名称时，在其他 GNU 程序中也应以相同的方式使用。为此，有一份详尽的当前\
  \ GNU 程序使用的长选项列表。\n\n作为一个简单而显见的例子，`--verbose` 在所有 GNU 程序中的拼写完全相同。相比之下，许多 Unix 程序中使用\
  \ `-v`、`-V`、`-d` 等。第 2 章“参数、选项与环境”（第 23 页）的大部分内容都致力于参数和选项解析的机制。\n\n#### 1.4.3 C\
  \ 代码编程\n\n*GNU Coding Standards* 最具实质性的是第 5 章，它描述了如何编写 C 代码，涵盖了代码格式化、正确使用注释、整洁地使用\
  \ C、命名函数和变量，以及声明或不声明你想要使用的标准系统函数。\n\n代码格式化是一个宗教问题；许多人有自己偏好的不同风格。我们将在第 1.6 节“关于编码风格的一些话”（第\
  \ 18 页）中进行更多说明。\n\n我们认为关于 C 编码章节的重要性在于，这些建议对任何 C 编码都是有效的，而不仅仅适用于你恰好在编写 GNU 程序。所以，如果你只是在学习\
  \ C，即使你已经在 C（或 C++）领域工作了一段时间，我们也建议向你推荐这一章，因为它总结了多年的经验。\n\n#### 1.4.4 使 GNU 程序更好的因素\n\
  \n我们现在检查 *GNU Coding Standards* 第 4 章中标题为“所有程序的程序行为”（Program Behavior for All Programs）的章节。该节提供了软件设计原则，使得\
  \ GNU 程序比其 Unix 对应版本更好。我们引用了该章节的部分，并提供了一些这些原则发挥成效的案例。\n\n通过动态分配所有数据结构，避免对任何数据结构（包括文件名、行、文件和符号）长度或数量的任意限制。在大多数\
  \ Unix 工具中，“长行会被静默截断”。这在 GNU 工具中是不可接受的。\n\n这条规则可能是 GNU 软件设计中最重要的一条规则——*没有任意限制*。所有\
  \ GNU 工具都应该能够管理任意量的数据。\n\n\n\n虽然这一要求可能让程序员的工作变得更加困难，但对用户来说却好得多。曾经，我们有一位 `gawk` 用户定期在超过\
  \ 650,000 个文件（不，这不是拼写错误）上运行 `awk` 程序来收集统计数据。`gawk` 的数据空间会增长到 192 兆以上，程序运行了大约 7 个\
  \ CPU 小时。他无法使用其他的 `awk` 实现来运行他的程序。\n\n这种情况发生在大约 1993 年；今天，这一真理更加显而易见，因为用户现在使用 `gawk`\
  \ 处理 GB 级的日志文件。\n\nGNU `grep` 的原始作者 Mike Haertel 最近对“无任意限制”原则发表了如下的见解：\n\n> 我过去认为\
  \ GNU 标准仅仅是一种奢侈品，或者是一个“为了出于法律原因区分 GNU 和 Unix”的东西，但如今，在缓冲区溢出攻击的时代，它证明自己是非常重要的。\n\n\
  我们再赞同不过！继续正文：\n\n读取文件的工具程序不应丢弃 `NUL` 字符或其他任何非打印字符。程序应该能够正常处理多字节字符编码，如 `UTF-8`。你可以使用\
  \ `libiconv` 来处理各种编码。\n\n[第 15.4 节]，“你能给我拼一遍吗？”，第 540 页提供了多字节字符和编码的概述。\n\n众所周知，Emacs\
  \ 可以编辑任意文件，包括包含二进制数据的文件！\n\n检查每个系统调用的错误返回，除非你确定想要忽略错误。在由于系统调用失败而产生的每个错误消息中，都要包含系统错误文本（来自\
  \ `strerror` 或等效函数），以及文件名（如果有）和工具程序的名称。仅仅写“无法打开 foo.c”或“stat 失败”是不够的。\n\n检查每个系统调用提供了健壮性。这是另一个让程序员生活更艰难但对用户用户更好的情况。详细说明具体哪里出了错误的错误消息会让发现和解决任何问题变得容易得多。\n\
  \n检查和报告错误的机制在 [第 4.3 节]，“确定发生了什么”，第 81 页中进行了讨论。\n\n最后，我们引用了 *GNU 编码规范* 第 1 章的内容，该章节讨论了如何以不同于\
  \ Unix 程序编写的方式编写你的程序：\n\n例如，Unix 工具程序通常针对最小化内存使用进行了优化；如果你转而追求速度，你的程序将会有很大不同。你可以将整个输入文件保存在内存中并在其中进行扫描，而不是使用\
  \ `stdio`。使用比 Unix 程序更晚发现的智能算法。消除对临时文件的使用。用一次扫描而不是两次扫描来完成（我们在汇编器中就是这么做的）。\n\n或者相反，强调简单性而不是速度。对于某些应用程序，今天计算机的运行使得更简单的算法就足够了。\n\
  \n或者追求通用性。例如，Unix 程序通常具有静态表或固定长度的字符串，这会导致任意限制；请用动态分配代替。确保你的程序能够处理输入文件中的 `NULs` 和其他特殊字符。添加一种编程语言以增强扩展性，并用该语言编写程序的一部分。\n\
  \n或者将程序的某些部分转换为独立可用的库。或者使用简单的垃圾回收器，而不是精确跟踪何时释放内存，或者使用新的 GNU 功能，如 `obstacks`。\n\n\
  算法能产生差异的一个绝佳例子是 GNU `diff`。我们系统的早期形态之一是 AT&T 3B1：该系统拥有 `MC68010` 处理器、高达 2 兆的内存和\
  \ 80 兆的磁盘。我们对 `gawk` 的手册进行了大量的编辑，该文件现在几乎有 48,000 行（尽管在当时，它只有 10,000 行左右）。我们以前经常频繁使用\
  \ `diff -c` 来查看我们的更改。在那个缓慢的系统上，切换到 GNU `diff` 让上下文差异比较（context diff）出现的时间发生了惊人的变化。这种差异几乎完全归功于\
  \ GNU `diff` 使用的更好的算法。\n\n最后一段提到了将程序结构化为独立可用的库，并在周围封装一个命令行包装器或其他接口的观点。这方面的一个例子是\
  \ GDB（GNU 调试器），它是作为调试库之上的命令行工具实现的的。这种实现使得在基础调试功能之上编写图形化调试界面成为可能。（GDB 在本书稍后部分介绍；参见\
  \ [第 17 节]，“调试”，第 591 页。）\n\n#### 1.4.5 关于 *GNU 编码规范* 的结语\n\n如果你想开发 GNU 软件、增强现有的\
  \ GNU 软件，或者只是学习如何成为一名更好的程序员，*GNU 编码规范*手册是一份值得阅读的文档。它所倡的原则和技术使得 GNU 软件成为 Unix 社区的首选。\n\
  \n### 1.5 重新回顾可移植性\n\n#### 1.5.1 为什么要可移植性？\n\n你可能在想：“为什么如此强调可移植代码？这对我有什么好处？”这些都是很好的问题。\n\
  \n首先，编写可移植代码往往和不写它一样容易。在如今拥有符合标准的编译器和系统的环境中，编写可移植代码比以往任何时候都要容易。在某种意义上，这正是本书的核心所在。（承认，这是一种“为什么不被移植呢？”式的回答。）\n\
  \n其次，拥有可移植的代码会增加你的用户群。大多数开发者都喜欢有更多用户。如果你编写商业软件，更多的用户意味着更多的销售额。如果你在编写自由或开源软件，更多的用户意味着让世界变得更美好时更多的快乐。\n\
  \n第三，简单来说，可移植的代码是更高质量的代码。谁不喜欢写高质量的代码呢？\n\n最后，看到你的代码在多个系统上运行真的是非常酷的。在当今世界，除了 GNU/Linux，还有\
  \ macOS、BSD 系统、遗留的 Unix 系统，甚至有 OpenVMS 和 IBM 的 z/OS。让程序运行在所有这些系统上是可能的。\n\n#### 1.5.2\
  \ 可移植性建议\n\n可移植性可能像圣杯一样——一直追求，但并不总是能获得。编写可移植代码有几个方面。GNU 编码规范手册讨论了其中许多。但还有其他的。在开发过程中，请在高层和底层都考虑到可移植性。我们建议这些做法：\n\
  \n- **按照标准编码。**\n  尽管可能具有挑战性，但熟悉你所用语言的正式标准是有回报的。特别是 C 和 C++ 的 ISO 标准，因为大多数 Linux\
  \ 编程是用两种语言之一完成的。\n  此外，库和系统调用接口的 POSIX 标准虽然，但具有广泛的行业支持。编写 POSIX 代码大大提高了将代码迁移到 GNU/Linux\
  \ 之外其他系统的机会。这个标准非常易读；它提炼了数十年的经验和良好实践。\n\n- **为任务选择最佳接口。**\n  如果标准接口可以满足你的需求，就在你的代码中使用它。使用\
  \ Autoconf 检测不可用的接口，并为缺陷的系统提供替代版本。（例如，某些旧系统缺少 `memmove()` 函数，手动编写该函数或从 GLIBC 库中提取相当容易。）\n\
  \n- **在新接口后隔离可移植性问题。**\n\n\n\n\n有时你可能需要执行某些特定系统的任务，这些任务在某些系统上适用而在其他系统上不适用。（例如，在某些系统中，每个程序必须自己展开命令行通配符，而不是由\
  \ shell 来完成。）创建一个新的接口，在不需要它的系统上什么都不做，而在需要的系统上执行正确的操作。\n\n- **使用 `Autoconf` 进行配置。**\n\
  \  在这种语境下，*配置*意味着确定系统是否支持某些功能或 API。程序通常使用 `#ifdef` 为此。然而，如果可能，最好避免使用 `#ifdef`。如果不可避免，请将其埋在低层库代码中。使用\
  \ `Autoconf` 来完成需要通过 `#ifdef` 执行的测试检查工作。\n\n- **对于可选功能可以使用 `#ifdef`。**\n  如果确实存在某些可选功能，请为这些功能使用\
  \ `#ifdef`，并配合你的 `configure` 程序的命令行选项来启用或禁用它们。但通常情况下，过多的 `#ifdef` 会导致代码难以阅读和维护。\n\
  \n### 1.6 关于编码风格的文字\n\n`coding style`（编码风格）是关于开发者如何布局代码的（正式或非正式）规范。这指的是大括号的放置和缩进、运算符和关键字以及函数调用周围空格的使用，以及许多其他“风格”方面。\n\
  \n在 C 和 C++ 世界中，有许多不同的编码风格。这些风格一直是不同风格追随者之间争论的话题，往往导致“宗教战争”。\n\n关于编码风格最重要的几点是：\n\
  \n- 拥有一套。使用一致的编码风格使得代码对你和团队中的其他人来说都更容易阅读和维护。\n- 与你正在工作的代码风格保持一致，即使你不喜欢它。在处理他人代码时，可能发生的最糟糕的情况是你按照自己的喜好对其进行重新格式化，然后尝试让原作者接受你的修改。他们不会这么做的。我们个人并不喜欢\
  \ FSF 风格，如果你看我们维护的 `awk`，你会发现它的格式在在那部里程碑式的《Kernighan and Ritchie 书》的两个版本中都是标准的。但这是\
  \ `awk` 在该标准部分中唯一的变异之处。尽管如此，尽管我们不喜欢 FSF 风格，但我们认为在修改其他程序时，坚持使用已有的编码风格是至关重要的。`GNU\
  \ Coding Standards` 也强调了这一点。有时没有可检测的统一风格，在这种情况下，程序可能该用 `indent` 处理一遍了。在本书书中，我们完全按照原始编写方式呈现代码，无论是\
  \ Unix 源码还是 GNU 项目的程序。然而，对于我们编写的示例，编码风格对标准的“K&R”进行了略微修改。为了提高打印文本的可读性，我们使用了四个空格的制表符位（但在代码中使用真实的\
  \ TAB），并遵循将函数名置于行首的习惯。\n\n### 1.7 人工智能并不智能\n\n在我们准备这本书出版时，软件行业当前的热点话题是人工智能（`AI`）。AI\
  \ 显然正影响着该行业，但还不清楚这种影响是好是坏。许多不熟悉开发高质量软件细节的人似乎认为，使用 AI 将让他们在不雇佣程序员的情况下开发出产品。（这结果并不理想。）\n\
  \n是的，AI 可能会让你在极短的时间内完成某项任务，而且目前可能行得通。但以写软件为生计的人明白这并不容易。AI 生成的代码可能正确吗？它易于理解和维护吗？当以后出现新需求时，它能被轻松修改吗？答案很可能是“不是”。\n\
  \n如果你只是学习开发软件，或者只做了一段时间，通过 AI 走捷径的诱惑可能是难以抵抗的。我们强烈建议你不要屈服。人类的知识、推理和经验是不可替代的。AI 并不像你那样“智能”。它没有理解，也没有判断。最好的情况下，你可能在集成开发环境（`IDE`）中将\
  \ AI 作为“编码助手”，在你输入代码时，它可能会提供合理的补全。但你应该始终引导机器的人，而不是反过来。\n\n最后，我们提供这些问题供你思考：如果你总是让\
  \ AI 为你工作，你如何作为一名专业人士成长和发展？你真的会为自己的工作感到自豪吗？你会最大限地发挥你的创造能力吗？你是否比那些真正理解自己在做什么的人更容易被\
  \ AI 替代？我们建议你仔细思考这些问题。\n\n### 1.8 建议阅读材料\n\n1. `The C Programming Language`, 2nd\
  \ ed., by Brian W. Kernighan and Dennis M. Ritchie. Pearson, 1988. ISBN-13: 978-0-13-110362-7。这是\
  \ C 语言的“圣经”，涵盖了 1990 版本的标准 C。这是一本相当厚实的书，在惊人的少量页数内挤满了大量信息。你可能需要通读多次；这样做是非常值得的。\n\
  2. `C: A Reference Manual`, 5th ed., by Samuel P. Harbison III and Guy L. Steele,\
  \ Jr. Pearson, 2002. ISBN-13: 978-0-13-089592-9。这本书也是一部经典。它涵盖了原始 C 以及 1990 和 1999\
  \ 标准。它是《The C Programming Language》极好的伴侣。它涵盖了许多重要项目，例如与国际化相关的类型和库函数，这些在 Kernighan\
  \ 和 Ritchie 的书中是没有的。\n3. `Notes on Programming in C`, by Rob Pike, February 21,\
  \ 1989.这篇文章可以在许多网站上找到；也许被引用最广泛的地方是 `https://www.lysator.liu.se/c/pikestyle.html`。（其他许多实用的文章可以在上一级找到：`https://www.lysator.liu.se/c/`）。Rob\
  \ Pike 在贝尔实验室研究中心工作了多年，那里发明了 C 和 Unix，他在那里进行了开创性的开发。他的笔记将多年的经验提炼成一种“编程清晰性哲学”，非常易读。\n\
  4. 另一篇令人感兴趣的文档是 `Recommended C Style and Coding Standards`，最初编写于贝尔实验室的 Indian Hill\
  \ 站点。其中一个位置是 `https://www.doc.ic.ac.uk/lab/cplus/cstyle.html`。\n5. `Google C++ Style\
  \ Guide` 可能值得研究，因为它的许多要点也适用于 C。`https://google.github.io/styleguide/cppguide.html`\n\
  6. 关于一个（非常有经验的）人使用 AI 的第一手观点，请参见 `https://testprincipia.com/lft/coding-with-ai-no-skills-needed/`。\n\
  \n### 1.9 总结\n\n*   “文件与进程”总结了 Linux/Unix 世界观。将文件视为字节流、将设备视为文件，以及使用标准输入、输出错误，简化了程序设计并统一了数据访问模型。权限模型简单而灵活，同时适用于文件和目录。\n\
  *   进程是正在运行的程序，关联了用户和组标识符以进行权限检查，以及其他属性，如打开的文件和当前工作目录。\n\n\n\n\n\n-   标准 C 与原始 C\
  \ 之间最明显的区别是使用了函数原型进行更严格的类型检查。一个优秀的 C 程序员应该能够读懂原始风格的代码，因为许多现有程序仍在使用它。新代码应该使用原型来编写。\n\
  -   `GNU Coding Standards` 手册描述了如何编写 GNU 程序。它为生成健壮、实用的软件提供了许多宝贵的技术和指导原则。“不设任意限制”原则可能是这些其中最重要的一点。该文档是严肃程序员的必读读物。\n\
  -   使程序具有移植性是一项重大挑战。指南和工具有所帮助，但最终也需要经验。\n-   拥有一种编码风格比风格的具体细节更重要。保持编码风格的一致使得代码更易阅读和维护。\n\
  -   人工智能（AI）并不像你那样具有智能。它对初学者来说似乎很有吸引力且简单上手。在使用时，请务必小心并谨慎使用。\n\n### 练习\n\n1. 阅读并评论\
  \ Richard M. Stallman 写的文章《The GNU Project》，这篇文章最初写于 1998 年 8 月。\n2. 在网上搜索不同的编码风格标准。将其中一些与书中的代码进行比较。尝试取一个中等规模的程序，并使用\
  \ `indent` 程序以不同的方式对其重新格式。你最喜欢哪种风格？为什么？\n\n## 第 2 章 参数、选项与环境\n\n命令行选项和参数解释通常是任何程序的第一个任务。本章将研究\
  \ C（以及 C++）程序如何访问其命令行参数，描述用于解析的标准例程，并查看环境。\n\n### 2.1 选项与约定\n\n`arguments` 一词有两个含义。更技术性的定义是“命令行上的所有单词”。例如：\n\
  \n```\n$ ls main.c opts.c\n```\n在这里，所有四个单词都可以作为程序的参数。\n\n第二个定义更非正式：参数是指命令行上除命令名以外的所有单词。默认情况下，Unix\
  \ Shell 使用空白字符（空格或制表符）将参数隔开。引号允许参数包含空格：\n\n```\n$ echo here are lots of spaces\n\
  here are lots of spaces\n$ echo \"here are lots of spaces\"\nhere are lots of spaces\n\
  ```\n引号对运行中的程序是透明的；`echo` 永远看不见引号字符。在 Shell 中，双引号和单引号是不同的；关于规则的讨论超出了本书的范围。然而，一个简单的规则是，双引号内的文本会被\
  \ Shell 进一步解释，而单引号内的文本则不会。\n\n参数可以进一步分类为`options`（或）operandsandsands 操作数）。在之前的示例中，所有参数都是操作数：`ls`\
  \ 的文件和 `echo` 的原始文本。选项是每个程序解释的特殊参数。选项改变程序的行为或向程序提供信息。根据古老且（几乎）通用的约定，选项以破折号（或或减号）开头，并由单个字母组成。选项参数是选项所需的信息，而不是普通的操作数。例如，`grep`\
  \ 程序的 `-f` 选项意味着“使用后续文件的内容作为搜索模式列表”。参见图 2.1。\n\n图 2.1 命令行组件\n\n因此，`patfile` 不是一个用于搜索的数据文件；而是供\
  \ `grep` 用来定义搜索模式的列表。\n\n#### 2.1.1 POSIX 约定\n\nPOSIX 标准描述了标准格式程序遵循的若干约定。虽然没有要求你的程序必须遵守这些约定，但这样做是个好主意：Linux\
  \ 和 Unix 用户理解并使用这些约定，如果你的程序不遵循它们，你的用户将不会高兴。此外，我们在本章后面讨论的函数将减轻你为你编写的每个程序手动遵守这些约定的负担。以下是根据标准转述的约定：\n\
  \n1.  程序名称应不少于两个字符，不少于九字符。\n2.  程序名称应仅包含小写字母和数字。\n3.  选项名称应该是单个字母数字字符。不应允许数字选项。对于实现\
  \ POSIX 工具的厂商，`-W` 选项保留给厂商特定的选项。\n4.  所有选项都应以 `-` 字符开头。\n5.  对于不需要选项参数的选项，应该可以在单个\
  \ `-` 字符后组合多个选项。例如，`foo -a -b -c` 和 `foo -abc` 应该被视为相同。\n6.  当选项确实需要选项参数时，该参数应通过空格与选项隔开（例如\
  \ `grep -f patfile`）。然而，标准也允许历史做法，即有时选项和操作数可以在同一个字符串中：`fgrep -ffile`。在实践中，`getopt()`\
  \ 和 `getopt_long()` 函数将 `-ffile` 解释为 `-f patfile`，而不是 `-f -p -a -t ...`。\n7.  选项参数不应该是可选的。这意味着当程序文档说明某个选项需要选项参数时，该选项的参数必须存在，否则程序将失败。GNU\
  \ `getopt()` 确实提供了可选选项参数的支持，因为它们有时很有用。\n8.  如果一个选项接受一个可能有多个值的参数，程序应该将该参数接收为单个字符串，值用逗号或空白字符分隔。例如，假设一个假设程序\
  \ `myprog` 的 `-u` 选项需要一个用户列表。那么，它应该以以下两种方式之一被调用：\n\n```\nmyprog -u \"arnold,joe,jane\"\
  \             用逗号分隔\nmyprog -u \"arnold joe jane\"             用空白字符分隔\n```\n在这种情况下，在分割和处理每个值方面你需要自力为之（即没有标准例程），但手动这样做通常是直观的。\n\
  9.  选项应该出现在命令行的最前面，在操作数之前。Unix 版本的 `getopt()` 强制执行这一约定。GNU `getopt()` 默认不这样做，尽管你可以告诉它这样做。\n\
  10. 特殊参数 `--` 表示所有选项的结束。命令行上的任何后续参数都将被视为操作数，即使它们以破折号开头。\n11. 选项给出的顺序不重要。然而，对于互斥选项，当一个选项覆盖了另一个选项的设置时，那么（可以这么）最后一个的获胜。如果重复了带有参数的选项，程序应该按顺序处理这些参数。例如，`myprog\
  \ -u arnold -u jane` 等同于 `myprog -u \"arnold,jane\"`。（你必须自己强制这一点；`getopt()` 帮不了你。）\n\
  12. 操作数的顺序对程序有影响是可以的。每个程序都应该记录此类事项。\n13. 读取或写入命名文件的程序应该将单个参数 `-` 视为标准输入或标准输出，取决于程序的具体情况。\n\
  \n\n\n\n\n14. 不带参数的选项也可以分组在一个参数中，并在前面加一个单字符‘-’。（目前还不清楚这一准则实际上增加了什么内容，因为它看起来与准则 5\
  \ 相似。）\n\n请注意，许多标准程序并没有遵循上述所有约定。其主要原因是历史兼容性；许多此类程序在这些约定定型之前就已经存在了。\n\n## 2.1.2 GNU\
  \ 长选项\n\n正如我们在第 1.4.2 节中所看到的，“程序行为”（第 14 页），GNU 程序鼓励使用使用形如 `--help`、`--verbose`\
  \ 等类的长选项。由于这些选项以两个连字符开头，因此与 POSIX 约定不冲突。它们也更容易记忆，并为所有 GNU 工具之间的一致性提供了可能。（例如，与 `-h`\
  \ 表示“help”、`-i` 表示“information”等相比，`--help` 在任何地方都是那样的。）GNU 长选项有自己的约定，通过 `getopt_long()`\
  \ 函数实现：\n\n1. 对于实现 POSIX 程序的程序，每个短选项（单字母选项）都应该有一个对应的长选项。\n2. 额外的 GNU 特有长选项不需要对应的短选项，但我们建议这样做。\n\
  3. 长选项可以缩写为保持唯一性的最短字符串。例如，如果存在选项 `--verbose` 和 `--verbatim`，那么最短的可能缩写是 `--verbo`\
  \ 和 `--verba`。\n4. 选项参数通过空格或 `=` 号与长选项分隔——例如，`--sourcefile=/some/file` 或 `--sourcefile\
  \ /some/file` 都是可以。\n5. 选项和参数可以在命令行中与操作数混合交替出现；`getopt_long()` 会重新排列，使得所有选项都得到处理，然后按顺序提供所有操作数。（这种行为可以被抑制。）\n\
  6. 选项参数可以是可选的。对于此类选项，如果参数与选项在同一个字符串中，则认为参数存在。这仅适用于短选项。例如，如果 `-x` 是此类选项，给定 `foo -xYANKEES\
  \ -y`，则 `-x` 的参数是 `YANKEES`。对于 `foo -x -y`，则 `-x` 没有参数。\n7. 程序可以选择允许长选项以单连字符开头。（这在许多\
  \ X Window 程序中很常见。）\n\n当我们在本章稍后的部分检查 `getopt_long()` 时，这些许多内容将变得更加清晰。\n\n*GNU 编码标准*手册花费了大量空间来列出\
  \ GNU 程序使用的所有长、短选项。如果你正在编写一个接受长选项的程序，请查看已使用的选项名称是否也适合你使用。\n\n## 2.2 基础命令行处理\n\n\
  C 程序通过其参数 `argc` 和 `argv` 访问其命令行参数。`argc` 参数是一个整数，表示参数的数量，包括命令名。声明 `main()` 有两种常见方式，在于\
  \ `argv` 的声明方式：\n\n```\nint main(int argc, char *argv[])           int main(int\
  \ argc, char **argv)\n{                                          {\n    ...    \
  \                                    ...\n}                                    \
  \      }\n```\n\n从实践上来说，这两种声明之间没有区别，尽管第一个在概念上更清晰：`argv` 是一个指向字符的指针数组。第二种更常用：`argv`\
  \ 是一个指向指针的指针。此外，第二种定义在技术上更正确，也是我们所使用的。图 2.2 描述了这种情况。\n\n![Images](img/fig02-002.jpg)\n\
  \n**图 2.2：** `argv` 的内存\n\n按照约定，`argv[0]` 是程序的名称。（详情请参见第 9.1.4.4 节，“[程序名与 `argv[0]`](#ch09.xhtml_ch09lev3sec8)”（第\
  \ 286 页）。）后续条目是命令行参数。`argv` 数组的最后一个条目是一个 `NULL` 指针。\n\n`argc` 表示有多少参数；由于 C 是基于零索引的，`argv[argc]\
  \ == NULL` 总是成立的。由于由于，特别是在 Unix 代码中，你会看到不同的检查参数结束的方法，例如循环直到计数器大于或等于 `argc`，或者直到\
  \ `argv[i] == 0`，或者当 `*argv != NULL` 等。这些都是等价的。（我们稍微偏好于测试 `argv[i] != NULL`。）\n\n\
  ### 2.2.1 V7 `echo` 程序\n\n命令行处理最简单的例子可能是 V7 `echo` 程序，它将其参数打印到标准输出，用空格分隔并以换行符结束。如果第一个参数是\
  \ `-n`，则省略末尾的换行。（这用于 shell 脚本中的提示。）这是代码：\n\n```\n 1  #include <stdio.h>\n 2\n 3\
  \  main(argc, argv)                       int main(int argc, char **argv)\n 4  int\
  \ argc;\n 5  char *argv[];\n 6  {\n 7      register int i, nflg;\n 8\n 9      nflg\
  \ = 0;\n 10       if(argc > 1 && argv[1][0] == '-' && argv[1][1] == 'n') {\n 11\
  \           nflg++;\n 12           argc--;\n 13           argv++;\n 14       }\n\
  \ 15       for(i=1; i<argc; i++) {\n 16           fputs(argv[i], stdout);\n 17 \
  \          if (i < argc-1)\n 18               putchar(' ');\n 19       }\n 20  \
  \     if(nflg == 0)\n 21           putchar('\\n');\n 22       exit(0);\n 23}\n```\n\
  \n只有 23 行！有两个值得关注的点。首先，同时递减 `argc` 和增加 `argv`（12 和 13）是跳过初始参数的常用方法。其次，对 `-n` 的检查（10）是简单的。`-newline-at-the-end`\
  \ 同样有效。参见 V7 分中的 `/usr/src/cmd/echo.c`。\n\n手动解析选项在 V7 代码中很常见，因为那时 `getopt()` 函数还没有发明。\n\
  \n最后，在这里以及书的其他地方，我们看到了 `register` 的使用。曾经，这个关键字向编译器提供提示，说明如果可能，应将给变量放在寄存器中。该关键字的使用已经过时；现代编译器都基于对源代码的分析来进行寄存器分配，忽略了\
  \ `register` 关键字。我们选择对使用它的代码保持原，但你应该意识到 `register` 没有实际作用。\n\n## 2.3: `getopt()`\
  \ 和 `getopt_long()`\n\n`getopt()` 函数声明如下：\n\n```\n#include <unistd.h>          \
  \                                    POSIX\n\nint getopt(int argc, char *const argv[],\
  \ const char *optstring);\n\nextern char *optarg;\nextern int optind, opterr, optopt;\n\
  ```\n\n### 2.3.1 单字母选项\n\n\n\n\n参数 `argc` 和 `argv` 通常直接从 `main()` 传递进来。`optstring`\
  \ 是一个包含选项字母的字符串。如果字符串中的任何字母后面紧跟着一个冒号，则该选项预计需要一个参数。\n\n要使用 `getopt()`，可以在 `while`\
  \ 循环中反复调用它，直到它返回 `–1` 为止。每当它找到一个有效的选项字母时，它就会返回该字母。如果该选项需要参数，`optarg` 将指向该参数。考虑一个接受不需要参数的\
  \ `-a` 选项和一个需要参数的 `-b` 选项的程序：\n\n```c\nint oc;             /* 选项字符 */\nchar *b_opt_arg;\n\
  \nwhile ((oc = getopt(argc, argv, \"ab:\")) != -1) {\n    switch (oc) {\n    case\
  \ 'a':\n        /* 处理 -a，设置标志，之类的 */\n        break;\n    case 'b':\n        /*\
  \ 处理 -b，从 optarg 获取参数值 */\n        b_opt_arg = optarg;\n        break;\n    case\
  \ ':':\n        ...       /* 错误处理，见正文 */\n    case '?':\n    default:\n        ...\
  \       /* 错误处理，见正文 */\n    }\n}\n```\n\n`getopt()` 在工作时会设置若干几个控制错误处理的变量：\n\n* `char\
  \ *optarg`\n  选项的参数，如果该选项接受参数。\n* `int optind`\n  `argv` 中的当前索引。当 `while` 循环结束时，剩余的操作数可以在\
  \ `argv[optind]` 到 `argv[argc-1]` 中找到。（记住 `argv[argc] == NULL`。）\n* `int optterr`\n\
  \  当此变量为非零时（默认值如此），`getopt()` 会为无效选项和缺失的选项参数打印它自带的错误信息。\n* `int optopt`\n  当发现无效选项字符时，`getopt()`\
  \ 返回 `’?’` 或 `’:’`（见下文），且 `optopt` 包含找到的无效字符。\n\n人非完圣，程序被错误调用是不可避免的，要么使用了无效选项，要么缺少选项参数。在通常情况下，`getopt()`\
  \ 会为这些情况打印自己的信息并返回 `’?’` 。然而，你可以通过两种方式改变它的行为。\n\n首先，通过在调用 `getopt()` 之前将 `opterr`\
  \ 设置为 `0`，你可以强制 `getopt()` 在发现问题时保持沉默。\n\n其次，如果 `optstring` 参数的第一个字符是冒号，那么 `getopt()`\
  \ 将保持沉默*并且*会根据错误类型返回不同的字符，如下所示：\n\n* *无效参数*\n  `getopt()` 返回 `’?’` 且 `optopt` 包含无效的选项字符。（这是正常行为。）\n\
  * *缺失选项参数*\n  `getopt()` 返回 `’:’`。如果 `optstring` 的第一个字符不是冒号，则 `getopt()` 将返回 `’?’`，这会导致该情况与无效参数的情况无法区分。\n\
  \n因此，将 `optstring` 的第一个字符设置为冒号是一个好主意，因为它允许你区分“无效参数”和“缺失选项参数”。代价是，使用冒号也会让 `getopt()`\
  \ 保持沉默，迫使你提供自己的错误信息。这里是之前的示例，这次包含了错误信息处理：\n\n```c\nint oc;             /* 选项字符 */\n\
  char *b_opt_arg;\n\nwhile ((oc = getopt(argc, argv, \":ab:\")) != -1) {\n    switch\
  \ (oc) {\n    case 'a':\n        /* 处理 -a，设置标志，之类的 */\n        break;\n    case\
  \ 'b':\n        /* 处理 -b，从 optarg 获取参数值 */\n        b_opt_arg = optarg;\n      \
  \  break;\n    case ':':\n        /* 缺失选项参数 */\n        fprintf(stderr, \"%s: option\
  \ ‘-%c' requires an argument\\n\",\n                argv[0], optopt);\n        break;\n\
  \    case '?':\n    default:\n        /* 无效选项 */\n        fprintf(stderr, \"%s:\
  \ option ‘-%c' is invalid: ignored\\n\",\n                argv[0], optopt);\n  \
  \      break;\n    }\n}\n```\n\n关于标志或选项变量的命名规范：许多 Unix 代码对任何给定的选项字母 `x` 使用 `x` `flg`\
  \ 形式的名称（例如，参见 V7 版 `echo` 中的 `nflg`；`x`flag` 也很常见）。这对于程序作者来说可能很棒，因为他们不需要查阅文档就知道\
  \ `x` 选项的作用，而且如果选项不是很多话也没问题。但对于试图阅读代码且不背记所有选项字母含义的人来说，这并不友好。使用能够传达每个选项含义的变量名要得多，例如为\
  \ `echo` 的 `-n` 选项使用 `no_newline`。\n\n### 2.3.2 GNU `getopt()` 和选项排序\n\n标准的 `getopt()`\
  \ 函数一旦遇到不以 ‘`-`’ 开头的命令行参数，就会停止寻找选项。GNU `getopt()` 则不同：它会扫描整个命令行以寻找选项。在扫描过程中，它会*重排*（重新排列）`argv`\
  \ 中的元素，以便在它完成工作时，所有选项都移动到前面。你可以使用 `optstring` 中的特殊字符来改变默认行为：\n\n* `optstring[0]\
  \ == '+'`\n  `getopt()` 的行为类似于标准的 `getopt()`。\n* `optstring[0] == '-'`\n  `getopt()`\
  \ 返回找到的长选项在 `longopts` 中的索引。\n* `optstring[0] == ':'`\n  `getopt()` 通过分别返回 `’?’`\
  \ 或 `’:’` 来区分“无效选项”和“缺失选项参数”。\n\n最后，如果 `optstring` 中的选项字母后面跟着两个冒号，则该选项允许有一个可选参数。当参数与选项是同一个\
  \ `argv` 元素时，认为它是存在的；否则。在不存在的情况下，`getopt()` 返回选项字母并将 `optarg` 设置为 `NULL`。例如，给定\n\
  \n```c\nwhile ((c = getopt(argc, argv, \"ab:\")) != -1)\n   ...\n```\n\n对于 `-bYANKEES`，返回\
  \ `b`，且 `optarg` 指向 `\"YANKEES\"`；而对于普通的 `-b` 或 `-b YANKEES`，返回值仍为 `b`，但 `optarg`\
  \ 被设置为 `NULL`。\n\n### 2.3.3 长选项\n\n`getopt_long()` 函数处理前面描述的长选项的解析。另一个例程 `getopt_long_only()`\
  \ 工作完全相同，但它用于*所有*选项都是长选项且以单个 ‘`-`’ 开头的程序。否则，两者的工作方式都类似于较简单的 GNU `getopt()` 函数。以下是声明，来自\
  \ GNU/Linux *getopt*(3) 手页：\n\n```c\n#include <getopt.h>                       \
  \                       GLIBC\n\nint getopt_long(int argc, char *const argv[],\n\
  \                const char *optstring,\n                const struct option *longopts,\
  \ int *longindex);\n\nint getopt_long_only(int argc, char *const argv[],\n     \
  \                const char *optstring,\n                     const struct option\
  \ *longopts, int *longindex);\n```\n\n前三个参数与 `getopt()` 相同。下一个参数是一个指向 `struct option`\
  \ 数组的指针，我们称之为*长选项表*，稍后会描述。`longindex` 参数如果没有设置为 `NULL`，则指向一个变量，该变量将填充找到的长选项在 `longopts`\
  \ 中的索引。这对于错误诊断等非常有用。\n\n#### 2.3.3.1 长选项表\n\n\n\n长选项通过 `struct option` 结构体数组进行描述。`struct\
  \ option` 定义在 `<getopt.h>` 中，其形式如下：\n\n```\nstruct option {\n    const char *name;\n\
  \    int has_arg;\n    int *flag;\n    int val;\n};\n```\n\n结构体中的元素如下：\n\n*   `const\
  \ char *name`\n    这是选项的名称，不包含任何前导横杠——例如，`\"help\"` 或 `\"verbose\"`。\n\n*   `int\
  \ has_arg`\n    这描述长选项是否带有参数，如果是，参数是什么类型的参数。该值必须是表 2.1 中所示的值之一。\n    符号常量是表格中所给数值值的宏。虽然使用数值值也可以，但符号常量的可读性要高得多，在您编写的任何代码中，都应该使用它们代替相应的数字。\n\
  \n*   `int *flag`\n    如果此指针为 `NULL`，则 `getopt_long()` 返回结构体中 `val` 字段的值。如果它不是 `NULL`，则它所指向的变量将被填充\
  \ `val` 中的值，且 `getopt_long()` 返回 `0`。如果 `flag` 不是 `NULL` 但从未出现过该长选项，则指向的变量不会改变。\n\
  \n*   `int val`\n    这是看到长选项时返回的值，或者在 `flag` 为 `NULL` 时加载到 `*flag` 中的值。通常，如果 `flag`\
  \ 不是 `NULL`，则 `val` 是一个真/假值，例如 `1` 或 `0`。另一方面，如果 `flag` 为 `NULL`，则 `val` 通常是一个字符常量。如果长选项对应于短选项，则该字符常量应与该选项的\
  \ `optstring` 参数中出现的常量相同。（这一点在稍后看到一些示例时会变得清晰。）\n\n| 符号常量 | 数值值 | 含义 |\n| --- | ---\
  \ | --- |\n| `no_argument` | `0` | 选项不带参数。 |\n| `required_argument` | `1` | 选项需要参数。\
  \ |\n| `optional_argument` | `2` | 选项的参数是可选的。 |\n\n**表 2.1：** `has_arg` 的值\n\n每个长选项都有一个条目，并填充相应的值。数组的最后一个元素的所有值都应为\
  \ 0。数组不需要排序；`getopt_long()` 执行线性搜索。然而，按长名称进行排序可能会让程序员更容易阅读。\n\n`flag` 和 `val` 的用法初次遇到似乎很困惑。让我们稍后退一步，检查它们为什么是这样工作的。大多数情况下，选项处理包括在看到不同的选项字母时设置不同的标志变量，如下所示：\n\
  \n```\nwhile ((c = getopt(argc, argv, \":af:hv\")) != -1) {\n    switch (c) {\n\
  \    case 'a':\n        do_all = true;\n        break;\n    case 'f':\n        myfile\
  \ = optarg;\n        break;\n    case 'h':\n        do_help = true;\n        break;\n\
  \    case 'v':\n        do_verbose = true;\n        break;\n    ...            \
  \  此处为错误处理代码\n    }\n}\n```\n\n当 `flag` 不是 `NULL` 时，`getopt_long()` 会为您设置变量。这将前面\
  \ `switch` 中的三种情况减少为一种情况。这里是一个长选项表及其配套代码：\n\n```\nint do_all, do_help, do_verbose;\
  \   /* 选项变量，逻辑类型为 bool */\nchar *myfile;\n\nstruct option longopts[] = {\n   { \"\
  all\",     no_argument,       & do_all,     1   },\n   { \"file\",    required_argument,\
  \ NULL,         'f' },\n   { \"help\",    no_argument,       & do_help,    1   },\n\
  \   { \"verbose\", no_argument,       & do_verbose, 1   },\n   { 0, 0, 0, 0 }\n\
  };\n...\ndo_all = do_help = do_verbose = false;\n\nwhile ((c = getopt_long(argc,\
  \ argv, \":f:\", longopts, NULL)) != -1) {\n    switch (c) {\n    case 'f':\n  \
  \      myfile = optarg;\n        break;\n    case 0:\n        /* getopt_long() 设置了一个变量，继续执行即可\
  \ */\n        break;\n    ...               此处为错误处理代码\n    }\n}\n```\n\n注意，传递给 `optstring`\
  \ 参数的值不再包含 `’a’`、`’h’` 或 `’v’`。这意味着不再接受相应的短选项。要同时允许长、短选项，您必须将第一个示例中的对应情况恢复到 `switch`\
  \ 中。\n\n从实践来说，您应该编写程序，使每个短选项都有对应的长选项。在这种情况下，最好的方法是让 `flag` 为 `NULL` 并让 `val` 为对应的单字母。\n\
  \n### 2.3.3.2 长选项，POSIX 风格\n\nPOSIX 标准保留了 `-W` 选项用于厂商特定功能。因此，根据定义，`-W` 在系统间不可移植的。如果\
  \ `-W` 出现在 `optstring` 中且跟着一个冒号（注意：不是分号），`getopt_long()` 将其视为普通选项。例如，GCC 使用 `-W`\
  \ 作为普通选项，而 `gawk` 使用它进行选项解析。因此，在之前的示例中，将调用改为：\n\n```\nwhile ((c = getopt_long(argc,\
  \ argv, \":f:W;\", longopts, NULL)) != -1) {\n```\n\n`getopt_long()` 总结了可能的返回值及其含义：\n\
  \n| 返回代码 | 含义 |\n| --- | --- |\n| `0` | `getopt_long()` 设置了一个标志。 |\n| `1` | 如果 `getopt_long()`\
  \ 应该遍历所有参数，则使用此情况。 |\n| `?` | 无效选项。 |\n| `:` | 缺少选项参数。 |\n| `-1` | 选项结束。 |\n\n最后，我们增强了之前的示例，显示了完整的\
  \ `switch` 语句：\n\n```\nint do_all, do_help, do_verbose;   /* 选项变量，逻辑类型为 bool */\n\
  char *myfile, *user;                /* 输入文件，用户 */\n\nstruct option longopts[] =\
  \ {\n   { \"all\",     no_argument,       & do_all,     1   },\n   { \"file\", \
  \   required_argument, NULL,         'f' },\n   { \"help\",    no_argument,    \
  \   & do_help,    1   },\n   { \"verbose\", no_argument,       & do_verbose, 1 \
  \  },\n   { \"user\",    optional_argument, NULL,         'u' },\n   { 0, 0, 0,\
  \ 0 }\n};\n...\ndo_all = do_help = do_verbose = false;\n\nwhile ((c = getopt_long(argc,\
  \ argv, \":ahvf:W:\", longopts, NULL)) != -1) {\n    switch (c) {\n    case 'a':\n\
  \        do_all = true;\n        break;\n    case 'f':\n        myfile = optarg;\n\
  \        break;\n    case 'h':\n        do_help = true;\n        break;\n    case\
  \ 'u':\n        if (optarg != NULL)\n           user = optarg;\n        else\n \
  \          user = \"root\";\n        break;\n    case 'v':\n        do_verbose =\
  \ true;\n        break;\n    case 0:\n        /* getopt_long() 设置了一个变量，继续执行即可 */\n\
  \        break;\n#if 0\n    case 1:\n        /*\n         * 如果 getopt_long() 应该遍历所有参数，则使用此情况。\n\
  \         * 如果是这样，在 optstring 前面加一个 '-'。\n         * 实际代码（如果有）放在此处。\n         */\n\
  \        break;\n#endif\n    case ':':   /* 缺少选项参数 */\n        fprintf(stderr, \"\
  %s: 选项 ‘-%c' 需要参数\\n\",\n                argv[0], optopt);\n        break;\n   \
  \ case '?':\n    default:    /* 无效选项 */\n        fprintf(stderr, \"%s: 选项 ‘-%c'\
  \ 无效：忽略\\n\",\n                argv[0], optopt);\n        break;\n    }\n}\n```\n\
  \n\n\n\n### 2.3.3.4 用户程序中的 GNU `getopt()` 或 `getopt_long()`\n\n你可能希望在自己的程序中使用 GNU\
  \ `getopt()` 或 `getopt_long()`，并让它们在非 Linux 系统上运行。这可以；只需从 GNU 程序或 GNU C 库源码拷贝源文件。你可以通过\
  \ Git 源码控制系统获取它们。源文件位于 `glibc/posix` 目录下的 `getopt.h`、`getopt.c` 和 `getopt1.c`。它们根据\
  \ GNU 语言通用公共许可证（GNU Lesser General Public License）授权，该许可证允许将库函数包含在专用程序中。你应该随程序附带\
  \ `COPYING.LIB` 文件的副本，以及 `getopt.h`、`getopt.c` 和 `getopt1.c` 文件。\n\n使用 `git clone\
  \ git://sourceware.org/git/glibc.git`。\n\n在你的发行版中包含源文件，并将它们与其他源文件一起编译。在调用 `getopt_long()`\
  \ 的源码中，使用 `#include <getopt.h>` 而不是 `#include \"getopt.h\"`。然后，在编译时，在 C 编译器的命令行中添加\
  \ `-I.`。这样就会优先找到头文件的本地副本。\n\n### 2.4 环境\n\n`environment` 是每个程序的一组 `name=value` 键对。这些键对被称为`环境变量`。每个\
  \ `name` 由一个或多个字母、数字或下划线（`_`）组成，但不能以数字开头。（此规则由 shell 强制执行；C API 可以将其想要的内容放入环境，但代价可能是混淆后续程序。）\n\
  \n运行中的程序从启动它的进程继承环境。这通常是一个 shell。当运行中的程序更改环境变量的值时，新值对该程序以及它创建的任何新进程可见，但父程序中的原始值不受影响。\n\
  \n`环境变量` 经常用于控制程序行为。例如，如果环境中存在 `POSIXLY__CORRECT`，许多 GNU 程序会禁用与 POSIX 标准不兼容的扩展或行为。\n\
  \n你可以决定（并记录）你的程序将使用哪些环境变量来控制其行为。例如，你可能希望使用一个环境变量作为调试选项，而不是命令行参数。使用环境变量的优点是，用户可以在他们的启动文件中设置它们，而不需要记住总是提供一组特定的命令行选项。\n\
  \n当然，使用环境变量的缺点是它们可能会静默地改变程序的行为。Coreutils 的维护者 Jim Meyering 这样描述：\n\n> 它让用户在不改变程序调用方式的情况下轻松自定义程序的工作方式。这既可能是幸运，也可能是诅咒。如果你写了一个依赖于你设置了某个环境变量的脚本，但随后其他人使用了同一个脚本，那么如果那个人没有相同的环境设置，脚本很可能会失败（或者更糟，静默地产生无效结果）。\n\
  \nBash 维护者 Chet Ramey 补充说，如果你编写的脚本调用了一个依赖于特定环境变量的程序，良好的做法是假设在你的脚本启动时该变量是未设置的。\n\n\
  #### 2.4.1 环境管理函数\n\n有几个函数允许你检索、更改或删除环境变量的值。以下是声明：\n\n```\n#include <stdlib.h>\n\
  \nchar *getenv(const char *name);                   ISO C: 获取环境变量\nint setenv(const\
  \ char *name, const char *value,   POSIX: 设置环境变量\n           int overwrite);\nint\
  \ putenv(char *string);                         XSI: 使用字符串设置环境变量\nvoid unsetenv(const\
  \ char *name);                  POSIX: 删除环境变量\nint clearenv(void);             \
  \                  Common: 清空整个环境\n```\n\n`getenv()` 函数是你 99% 时间都会使用的函数。参数是需要查找的环境变量名，例如\
  \ `\"HOME\"` 或 `\"PATH\"`。如果变量存在，`getenv()` 返回一个指向字符字符串值的指针。如果不存在，它返回 `NULL`。例如：\n\
  \n```\nchar *pathval;\n\n/* 查找 PATH；如果不存在，则提供一个默认值 */\nif ((pathval = getenv(\"\
  PATH\")) == NULL)\n    pathval = \"/bin:/usr/bin:/usr/local/bin\";\n```\n\n偶尔，环境变量存在但值为空。在这种情况下，返回值将是非\
  \ `NULL`，但指向的第一个字符将是零字节，即 C 字符串终止符 `\\0`。你的代码应该小心检查返回的指针是否为 `NULL`。即使它不是 `NULL`，如果你打算使用它的值，也请检查字符串是否为空。无论如何，不要盲目地使用返回的值。\n\
  \n要更改环境变量或向环境添加新变量，请使用 `setenv()`：\n\n```\nif (setenv(\"PATH\", \"/bin:/usr/bin:/usr/local/bin\"\
  , true) != 0) {\n    /* 处理失败 */\n}\n```\n\n环境中可能已经存在该变量。如果第三个参数为真（非零），则提供的值将覆盖之前的值。否则，不会覆盖。如果没有内存创建新变量，返回值为\
  \ `-1`，否则为 `0`。`setenv()` 为变量名和新值创建私有副本存储在环境中。\n\n原始 C 没有布尔变量，使用零表示 `false`，非零表示\
  \ `true`——因此 `overwrite` 的类型使用 `int`。然而，在这样的情况下，现代 C 的 `true` 和 `false` 可以并且应该使用。\n\
  \n`setenv()` 的更简单替代方案是 `putenv()`，它接受单个 `\"name=value\"` 字符串并将其放入环境：\n\n```\nif\
  \ (putenv(\"PATH=/bin:/usr/bin:/usr/local/bin\") != 0) {\n    /* 处理失败 */\n}\n```\n\
  \n`putenv()` 会盲目地替换相同变量的任何旧值。此外，可能更重要的是，传递给 `putenv()` 的字符串是被*直接*放入环境中的。这意味着如果你的代码稍后修改了这个字符串（例如，如果它是一个数组而不是字符串），环境也会随之修改。这意味着你*不应该*使用局部变量作为\
  \ `putenv()` 的参数。出于这些原因，更推荐使用 `setenv()`。\n\n**注意**\n\nGNU `putenv()` 的行为有一个额外的（文档说明的）特性：如果参数字符串仅仅是一个名称，没有\
  \ `=` 字符和值，则该命名的变量将被*删除*。\n\n`unsetenv()` 函数从环境中删除变量：\n\n```\nunsetenv(\"PATH\"\
  );\n```\n\n最后，`clearenv()` 函数完全清空环境：\n\n```\nif (clearenv() != 0) {\n    /* 处理失败\
  \ */\n}\n```\n\n该函数没有被 POSIX 标准化，尽管在 GNU/Linux 和几个商业 Unix 变体可用。如果你的应用程序对安全非常敏感，并且希望它完全从零开始构建环境，你应该使用它。如果\
  \ `clearenv()` 不可用，GNU/Linux *clearenv*(3) 手页建议使用 `environ = NULL;` 来完成此任务。\n\n\
  #### 2.4.2 整个环境：environ`\n\n处理环境的正确方法是通过上一节描述的函数。然而，看看“底层”是如何管理的是值得的。\n\n外部变量 `environ`\
  \ 访问环境的方式与 `argv` 访问命令行参数的方式相同。你必须自己声明该变量。尽管被 POSIX 标准化，但 `environ` 故意没有在任何标准头文件中被声明。（这似乎演变自历史做法。）这里是其声明：\n\
  \n```\nextern char **environ;   /* 妈妈，没有头文件！             POSIX\n```\n\n\n\n\n与 `argv`\
  \ 类似，`environ` 的最后一个元素是 `NULL`。然而，并没有一个与 `argc` 对应的“环境计数”变量。这个简单的程序会打印出整个环境：\n\n\
  ```\n/* ch-cmdline-printenv.c --- Print 出环境. */\n\n#include <stdio.h>\n\nextern\
  \ char **environ;      // 无头文件，手动声明\n\nint\nmain(int argc, char **argv)\n{\n   \
  \ int i;\n\n    if (environ != NULL)\n        for (i = 0; environ[i] != NULL; i++)\n\
  \            printf(\"%s\\n\", environ[i]);\n\n    return 0;\n}\n```\n\n虽然这种情况不太可能，但该程序在尝试使用\
  \ `environ` 之前会确保它不是 `NULL`。\n\n变量以随机顺序存储在环境中。尽管某些 Unix Shell 会按变量名对环境进行排序，但并没有正式要求这样做，且许多\
  \ Shell 并不进行排序。\n\n作为实现上的一个特殊特性，你可以通过为 `main()` 声明*第三个*参数来访问环境：\n\n```\nint\nmain(int\
  \ argc, char **argv, char **envp)\n{\n    ...\n}\n```\n\n然后你可以像使用 `environ` 一样使用\
  \ `envp`。虽然你偶尔会在旧代码中看到它，但我们不建议使用它；如果你需要访问整个环境，`environ` 是官方、标准且可移植的方法。\n\nChet Ramey\
  \ 提到，修改 `environ` 是改变使用环境变量的库函数行为的一种（例如区域设置；参见第 15.2.1 节，“语言区域类别与环境变量](#ch15.xhtml_ch15lev2sec1)”，第\
  \ 508 页）。然而，我们建议为此目的使用 `setenv()` 或 `putenv()`，并加上适当的注释。\n\n## 2.4.3 GNU `env`\n\
  \n为了结束本章，这里是 GNU 版本 `env` 命令的部分内容。该命令在单个命令执行期间为环境添加变量。它还可以用于清除该命令的环境或移除特定的环境变量。该程序对我们来说具有双重作用，因为它既演示了\
  \ `getopt_long()`，又演示了本节讨论的几个函数。以下是程序的调用方式：\n\n```\n$ env --help\nUsage: env [OPTION]...\
  \ [-] [NAME=VALUE]... [COMMAND [ARG]...]\n将环境中的每个 NAME 设置为 VALUE 并运行 COMMAND。\n\n\
  长选项的强制参数对于短选项也是强制的。\n  -i, --ignore-environment  从空环境开始\n  -0, --null          \
  \ 每个输出行以 NUL 结束，而不是换行符\n  -u, --unset=NAME     从环境中移除变量\n  -C, --chdir=DIR     \
  \ 更改工作目录到 DIR\n  -S, --split-string=S  处理并将 S 拆分为独立的参数；\n                      \
  \  用于在 shebang 行上传递多个参数\n      --block-signal[=SIG]    阻塞向 COMMAND 传递 SIG 信号(s)\n\
  \      --default-signal[=SIG]  将 SIG 信号的处理重置为默认\n      --ignore-signal[=SIG]   将\
  \ SIG 信号的处理设置为不操作\n      --list-signal-handling  将非默认信号处理列表列到 stderr\n  -v, --debug\
  \          打印每个处理步骤的详细信息\n      --help        显示此帮助并退出\n      --version     输出版本信息并退出\n\
  \n单独的 - 意味着 -i。如果没有 COMMAND，则打印结果环境。\n\nSIG 可以是像 'PIPE' 这样的信号名称，也可以像 '13' 这样的信号数字。如果没有\
  \ SIG，包含所有已知信号。多个信号可以用逗号分隔。空的 SIG 参数为无操作。\n\n退出状态：\n  125  如果 env 命令本身失败\n  126\
  \  如果找到了 COMMAND 但无法调用\n  127  如果找不到 COMMAND\n  -    否则，返回 COMMAND 的退出状态\n\nGNU\
  \ coreutils 在线帮助: <https://www.gnu.org/software/coreutils/>\n完整文档 <...\n 或通过本地可用：info\
  \ '(coreutils) env invocation'\n```\n\n如你所见，`env` 接受许多与修改环境并不直接相关的选项，例如更改目录和修改信号设置。（我们在第\
  \ 10 章，“信号](#ch10.xhtml_ch10)”，第 333 页中讨论了信号。“shebang 行”是可执行脚本的 `#!` 行，正如在第 1.1.3\
  \ 节，“可执行文件](#ch01.xhtml_ch01lev2sec3)”，第 6 页中讨论的那样。）现在，我们专注于操作环境的代码部分。\n\n这些功能是多年添加的。每个新功能都会使程序复杂化；这与我们在序言中倡导的“小即美”方法相悖。\n\
  \n以下是一些示例调用：\n\n```\n$ env -i=PATH             清除环境，运行\n$ env -u=PATH          \
  \   清除环境，运行\n```\n\nGNU Coreutils 包含大量程序，其中许多程序执行相同的常见任务（例如参数解析）。为了方便维护，许多常见用法被定义为宏。`GETOPT_HELP_OPTION_DECL`\
  \ 和 `GETOPT_VERSION_OPTION_DECL`（第 100 和 101 行）就是两个这样的宏。我们很快就会检查它们的定义。第一个函数 `usage()`\
  \ 打印用法信息并退出。它很大，并且仅仅打印了之前显示的文本，因此我们在这里省略它的函数体：\n\n```\nvoid\nusage (int status)\n\
  {\n...\n}\n```\n\n现在，我们跳过中间的代码并进入 `main()`。`main()` 的第一部分声明了变量并设置了国际化：\n\n*   `initialize_main()`（第\
  \ 756 行）处理某些非 POSIX 系统上的命令行通配符和 I/O 重定向。\n\n\n\n\n\n-   `setlocale()`、`bindtextdomain()`\
  \ 和 `textdomain()` 函数（第 758–760 行）均在第 15 章“国际化与本地化],第 507 页”进行了讨论。\n\n-   `initialize_exit_failure()`（第\
  \ 762 行）设置了一个名为 `exit_failure` 的全局变量，并赋予所需的退出状态；该变量在整个 Coreutils 中用于打印错误信息并退出。\n\
  \n-   第 763 行对 `atexit()` 的调用（参见 Section 9.1.5.3“退出函数],第 290 页）注册了一个 Coreutils 库函数进行运行，该函数将刷新所有待处理的输出并关闭\
  \ `stdout`，如果出现问题则报告消息。\n\n-   最后，调用 `initialize_signals()`（第 765 行）设置了默认的信号处理：\n\
  \n```\n748  int\n749  main (int argc, char **argv)\n750  {\n751    int optc;\n752\
  \    bool ignore_environment = false;\n753    bool opt_nul_terminate_output = false;\n\
  754    char const *newdir = nullptr;\n755\n756    initialize_main (&argc, &argv);\n\
  757    set_program_name (argv[0]);\n758    setlocale (LC_ALL, \"\");\n759    bindtextdomain\
  \ (PACKAGE, LOCALEDIR);\n760    textdomain (PACKAGE);\n761\n762    initialize_exit_failure\
