  \ | |\n\n**表 10.2：** 可从信号处理程序中调用的函数\n\n表 10.2 中的列表源自 2024 年 POSIX 标准中*系统接口*卷的第 2.4\
  \ 节，标题为“信号概念”。这些函数许多（如果不是大部分）都是书中未涵盖的高级 API。\n\n#### 10.4.7 我们到为止的故事，第一集\n\n*此前，在《化之道》中……*\n\
  \n— 《化之道：最后空气》\n\n信号是一个复杂的话题，而且它即将变得更加混乱。让我们停顿一下，后退一步，总结一下我们到为止讨论的内容：\n\n*   信号是某些外部事件已发生的指示。\n\
  *   `raise()` 是向当前进程发送信号的 ISO C 函数。我们尚未描述如何向其他进程发送信号。\n*   `signal()` 控制信号的处置——即进程在信号到达时对信号的反应。信号可以被设置为系统默认值、被忽略或被捕获。\n\
  *   当信号被捕获时，会运行处理程序函数。这里是复杂性开始显现的地方：\n    *   – ISO C 未规定在处理程序函数运行之前，信号处置是否会恢复为默认值，或者是否保持原样。前者是\
  \ V7 以及现代 Solaris 等 System V 系统的行为。后者是 BSD 的行为，也出现在 GNU/Linux 中。\n    *   – 当系统调用被信号中断时发生的情况在传统系统与\
  \ BSD 路线之间也不同。传统系统返回 `-1` 并将 `errno` 设置为 `EINTR`。BSD 系统在处理程序返回后重启系统调用。GLIBC 的 `TEMP_FAILURE_RETRY()`\
  \ 宏可以帮助你编写代码来处理返回 `-1` 且 `errno` 设置为 `EINTR` 的系统调用。\n        POSIX 要求部分完成的系统调用返回一个成功值，以指示完成的程度。尚未启动的系统调用将重启。\n\
  \    *   – `signal()` 机制为竞态条件的产生提供了肥沃的土壤。ISO C 的 `sig_atomic_t` 数据类型有助于这种情况，但不能解决它，而且按照定义的机制无法保证其免受竞态条件的影响。\n\
  \    *   – 还有许多许多额外的注意事项，特别是只有标准库函数的子集可以在信号处理程序内部安全地调用。\n\n尽管存在这些问题，对于简单的程序，`signal()`\
  \ 接口通常是足够的，而且它仍然被广泛使用。\n\n#### 10.5 System V Release 3 信号 API：`sigset()` 等\n\n4.0\
  \ 版 BSD（约 1980 年）引入了额外的 API 以提供“可靠”的信号。^4 特别是阻塞信号变得可能。换句话说，程序可以告诉内核：“在接下来的这段时间内保留这些特定的信号，等我准备好接收它们时再交付给我。”一个很大的优势是，这个功能简化了信号处理程序，它们会自动会在阻塞了自己的信号的情况下运行（以避免连续两个信号的问题），并可能还阻塞了其他信号。\n\
  \n这些 API 需要链接单独库 `-ljobs` 才能使用。\n\nSystem V Release 3（约 1984 年）采纳了这些 API 并使其流行起来；在大多数\
  \ Unix 相关的文档和书籍中，你可能会看到这些 API 被称为来自 System V Release 3。函数如下：\n\n```\n#include <signal.h>\
  \                                          Deprecated\n\nint sighold(int sig); \
  \                           将 sig 添加到进程信号掩码\nint sigrelse(int sig);            \
  \               从进程信号掩码中移除 sig\n\nint sigignore(int sig);                      \
  \    sigset(sig, SIG_IGN) 的简写\nint sigpause(int sig);                          \
  \ 挂进程，允许 sig 到达\nvoid (*sigset(int sig, void (*disp)(int)))(int); sighandler_t sigset(int\
  \ sig, sighandler_t disp);\n```\n\n这些函数不再包含在 POSIX 中。然而，它们的行为可以根据每个进程的进程信号掩码来描述。进程信号掩码跟踪进程当前阻塞了哪些信号（如果有）。这在第\
  \ 10.6.2 节“信号集：`sigset_t` 和相关函数”，第 351 页](#ch10.xhtml_page_351)中有更详细的描述。在 System\
  \ V Release 3 API 中，没有检索或修改整个进程信号掩码的方法。这些函数的工作如下：\n\n*   `int sighold(int sig)`\n\
  \    将 `sig` 添加到阻塞进程的列表中（进程信号掩码）。\n*   `int sigrelse(int sig)`\n    从进程信号掩码中移除（释放）`sig`。\n\
  *   `int sigignore(int sig)`\n    忽略 `sig`。这是一个便利函数。\n*   `int sigpause(int sig)`\n\
  \    从进程信号掩码中移除 `sig`，然后挂起进程直到信号到达（参见第 10.7 节“用于进程间通信的信号”，第 360 页](#ch10.xhtml_page_360)）。\n\
  *   `sighandler_t sigset(int sig, sighandler_t disp)`\n    是 `signal()` 的替换方案。（在这里使用了\
  \ GNU/Linux 手页的符号，以便声明更易读。）\n\n对于 `sigset()`，`handler` 参数可以是 `SIG_DFL`、`SIG_IGN`\
  \ 或函数指针，就像 `signal()` 一样。然而，它也可能是 `SIG_HOLD`。在这种情况下，`sig` 被添加到进程的进程信号掩码中，但其关联的操作保持不变。（也就是说，如果它之前有处理程序，则处理程序仍然存在；如果它是默认操作，该操作没有改变。）\n\
  \n当使用 `sigset()` 安装信号处理程序且信号到达时，内核首先将信号添加到进程信号掩码中，阻塞对该信号的额外接收。处理程序运行，并在返回时，内核将进程信号掩码恢复到处理程序运行先前的状态。（在\
  \ POSIX 模型中，如果信号处理程序更改了信号掩码，该更改在处理程序返回时通过恢复之前的掩码被覆盖。）\n\n`sighold()` 和 `sigrelse()`\
  \ 可以一起使用来包围所谓的*临界区*代码：即不应被特定信号中断的代码块，以免数据被信号处理程序中的代码损坏。\n\n**注意**\n\n这些接口曾用于旧代码的标准化。它们可能在你的系统中仍然可用。然而，稍后描述的\
  \ `sigaction()` API 让你能够完成这些 API 能的所有工作，以及更多。你不应该在新程序中使用这些 API。相反，请使用 `sigaction()`。\n\
  \n## 10.6 POSIX 信号\n\nPOSIX API 基于 4.2 和 4.3 版 BSD 的 `sigvec()` API。通过微小的更改，该 API\
  \ 能够涵盖 V7 和 System V Release 3 API 的功能。POSIX 进行了这些更改并将 API 重命名为 `sigaction()`。由于\
  \ `sigvec()` 接口未被广泛使用，我们没有描述它。相反，本节仅描述 `sigaction()`，这正是你本该使用的使用的。（事实上，1994 年的 4.4\
  \ 版 BSD 手册将 `sigvec()` 标记为过时，并将读者指向 `sigaction()`。）\n\n#####10.6.1 揭示问题\n\nSystem\
  \ V Release 3 API 有什么问题？毕竟，它们提供了信号阻塞，因此信号不会丢失，任何给定的信号都可以可靠地处理。\n\n\n\n\n\n答案是，该\
  \ API 一次只能处理*一个信号*。程序通常会处理多个信号。而且当你正在处理某个信号的中间时，你不希望还要担心处理另一个信号。（假设你刚接通办公室电话，这时手机又开始响了：你更希望让电话系统告诉来电者你正在忙另一条线，稍后就会回复，而不是由你自己去处理。）\n\
  \n使用 `sigset()` API，每个信号处理器都必须临时阻塞*所有*其他信号，执行其工作，然后取消这些阻塞。问题在于，在任何两次调用 `sighold()`\
  \ 之间的间隔内，可能会出现尚未被阻塞的信号。这种场景再次充满了竞态条件。\n\n解决方案是能够原子地对一组信号进行操作——即通过一次系统调用完成。你通过操作信号集和进程信号掩码来实现这一点。\n\
  \n## 10.6.2 信号集：`sigset_t` 和相关函数\n\n*进程信号掩码*（process signal mask）是进程当前阻塞的信号列表。POSIX\
  \ API 的强大之处在于，可以对进程信号掩码进行原子操作。\n\n进程信号掩码在程序中用*信号集*表示。这种类型是 `sigset_t`。从概念上讲，它就是一个位掩码，掩码中的\
  \ `0` 和 `1` 值表示特定信号在掩码中不存在或存在：\n\n```\n/* 直接操作信号掩码。不要这样做！ */\nint mask = (1 << SIGHUP)\
  \ | (1 << SIGINT);     /* SIGHUP 和 SIGINT 的位掩码 */\n```\n\n然而，由于系统拥有的信号数量可能比单个 `int`\
  \ 或 `long` 能容纳的还要多，而且大量使用位操作符很难易读，因此存在几个 API 来操作信号集：\n\n```\n#include <signal.h>\
  \                                          POSIX\n\nint sigemptyset(sigset_t *set);\n\
  int sigfillset(sigset_t *set);\nint sigaddset(sigset_t *set, int signum);\nint sigdelset(sigset_t\
  \ *set, int signum);\nint sigismember(const sigset_t *set, int signum);\n```\n\n\
  这些函数如下：\n\n*   `int sigemptyset(sigset_t *set)`\n    清空信号集。返回后，`*set` 中没有任何信号。成功返回\
  \ `0`，错误返回 `-1`。\n\n*   `int sigfillset(sigset_t *set)`\n    完全填充信号集。返回后，`*set`\
  \ 包含系统定义的所有信号。成功返回 `0`，错误返回 `-1`。\n\n*   `int sigaddset(sigset_t *set, int signum)`\n\
  \    向 `*set` 中的进程信号掩码中添加 `signum`。成功返回 `0`，错误返回 `-1`。\n\n*   `int sigdelset(sigset_t\
  \ *set, int signum)`\n    从 `*set` 中的进程信号掩码中移除 `signum`。成功返回 `0`，错误返回 `-1`。\n\n\
  *   `int sigismember(const sigset_t *set, int signum)`\n    如果 `signum` 存在于 `*set`\
  \ 中返回真/假。\n\n在对 `sigset_t` 变量进行任何其他操作之前，你必须调用 `sigemptyset()` 或 `sigfillset()` 之一。这两个接口之所以存在，是因为有时你想从一个空集开始，然后只处理一两个信号；而另有时你想处理所有信号，并可能移除其中一两个。\n\
  \n## 10.6.3 管理信号掩码：`sigprocmask()` 等\n\n进程信号掩码开始时为空——初始时，没有信号被阻塞。（这是一个简化处理；请参见第\
  \ 10.9 节“跨 `fork()` 和 `exec()` 的信号](#ch10.xhtml_ch10lev1sec9)”，以及第 378 页）。三个函数允许你直接操作进程信号掩码：\n\
  \n```\n#include <signal.h>                                               POSIX\n\
  \nint sigprocmask(int how, const sigset_t *set, sigset_t *oldset);\nint sigpending(sigset_t\
  \ *set);\nint sigsuspend(const sigset_t *set);\n```\n\n这些函数如下：\n\n*   `int sigprocmask(int\
  \ how, const sigset_t *set, sigset_t *oldset)`\n    如果 `oldset` 不为 `NULL`，获取当前进程信号掩码并将其放入\
  \ `*oldset`。根据 `set` 的内容和 `how` 的值更新进程信号掩码，`how` 必须是以下值之一：\n\n    | `SIG_BLOCK`\
  \ | 将 `*set` 中的信号与当前进程信号掩码合并。新掩码是当前掩码与 `*set` 的并集。 |\n    | `SIG_UNBLOCK` | 从进程信号掩码中移除\
  \ `*set` 中的信号。如果 `*set` 包含当前不在进程信号掩码中的信号，也没有问题。 |\n    | `SIG_SETMASK` | 用 `*set`\
  \ 的内容替换进程信号掩码。 |\n\n    如果 `set` 为 `NULL` 且 `oldset` 不为空，则 `how` 的值不重要。这种组合可以在不改变内容的情况下检索当前进程信号掩码。\n\
  \n*   `int sigpending(sigset_t *set)`\n    此函数让你查看哪些信号是*挂起*（pending）的；也就是说，`*set`\
  \ 填充了已发送但由于被阻塞尚未递送的信号。\n\n*   `int sigsuspend(const sigset_t *set)`\n    此函数*临时*将进程的信号掩码替换为\
  \ `*set`，然后挂起进程直到接收信号。根据定义，只有不在 `*set` 中的信号才能导致函数返回（请参见第 10.7 节“进程间通信信号](#ch10.xhtml_ch10lev1sec7)”，以及第\
  \ 360 页）。\n\n### 10.6.4 捕获信号：`sigaction()`\n\n最后，我们可以查看 `sigaction()` 函数了。这个函数非常复杂，我们特意省略了许多仅供高级使用的细节。POSIX\
  \ 标准和 `sigaction*(2)` 手页提供了完整的细节，尽管你必须仔细阅读这两者。它的声明如下：\n\n```\n#include <signal.h>\
  \                              POSIX\n\nint sigaction(int signum,\n            \
  \  const struct sigaction *act,\n              struct sigaction *oldset);\n```\n\
  \n参数如下：\n\n*   `int signum`\n    感兴趣的信号，与其他信号处理函数相同。\n\n*   `const struct sigaction\
  \ *act`\n    针对 `signum` 的新处理器规格说明。\n\n*   `struct sigaction *oldset`\n    当前处理器。如果不为\
  \ `NULL`，系统会在安装 `*act` 之前填充 `*oldset`。`act` 可以为 `NULL`，在这种情况下 `*oldset` 会被填充，但其他地方不会发生。\n\
  \n因此，`sigaction()` 在一次操作中同时设置新处理器并获取旧处理器。`struct sigaction` 结构如下：\n\n```\n/* 注意：结构体中的顺序可能会变化。可能还有其他字段！\
  \ */\nstruct sigaction {\n    sigset_t sa_mask;                                \
  \  需要阻塞的额外信号\n    int sa_flags;                                      控制行为\n    void\
  \ (*sa_handler)(int);                           可能与 sa_sigaction 联合体\n    void (*sa_sigaction)(int,\
  \ siginfo_t *, void *);    可能与 sa_handler 联合体\n}\n```\n\n字段如下：\n\n*   `sigset_t\
  \ sa_mask`\n    当处理器函数运行时需要阻塞的*额外*信号集。因此，当处理器被调用时，阻塞信号的总集是进程信号掩码中的、`act->sa_mask`\
  \ 中的以及（如果 `SA_NODEFER` 为清零状态）`signum` 的并集。\n\n*   `int sa_flags`\n    控制内核处理信号的标志位。详见后文讨论。\n\
  \n*   `void (*sa_handler)(int)`\n    指向“传统”处理器函数的指针。它的的*签名*（返回类型和参数列表）与 `signal()`、`bsd_signal()`\
  \ 和 `sigset()` 的处理器函数相同。\n\n*   `void (*sa_sigaction)(int, siginfo_t *, void *)`\n\
  \    指向“新样式”处理器函数的指针。该函数接受三个参数，稍后会描述。\n\n\n\n\n\n使用 `act->sa_handler` 还是 `act->sa_sigaction`\
  \ 取决于 `act->sa_flags` 中的 `SA_SIGINFO` 标志。当该标志存在时，使用 `act->sa_sigaction`；否则，使用 `act->sa_handler`。POSIX\
  \ 和 GNU/Linux 手页都指出，这两个字段在存储上可能会重叠（即属于一个 `union` 的一部分）。因此，你**永远不要**在同一个 `struct\
  \ sigaction` 中同时使用这两个字段。\n\n`sa_flags` 字段是表 10.3 中列出的一个或多个标志值的按位或（OR）结果。\n\n当 `act->sa_flags`\
  \ 中设置了 `SA_SIGINFO` 标志时，`act->sa_sigaction` 字段是一个指向如下如下声明函数的指针：\n\n```\nvoid\naction_handler(int\
  \ sig, siginfo_t *info, void *context)\n{\n    /* handler body here */\n}\n```\n\
  \n`siginfo_t` 结构体提供了关于信号的丰富信息：\n\n```\n/* POSIX 定义. 实际内容可能随系统而异 */\ntypedef struct\
  \ {\n    int si_signo;           /* 信号号 */\n    int si_errno;           /* 如果出错时的\
  \ <errno.h> 值 */\n    int si_code;            /* 信号代码；见正文 */\n    pid_t si_pid;\
  \           /* 发送信号的进程 ID */\n    uid_t si_uid;           /* 发送进程的真实 UID */\n  \
  \  void *si_addr;          /* 异常指令的地址 */\n    int si_status;          /* 退出值，可能包括信号导致\
  \ */\n    long si_band;           /* SIGPOLL/SIGIO 的带事件 */\n    union sigval si_value;\
  \  /* 信号值（高级） */\n} siginfo_t;\n```\n\n`si_signo`、`si_code` 和 `si_value` 字段对所有信号可用。其他字段可以是\
  \ `union` 的成员，因此应仅用于定义它们的信号。`siginfo_t` 结构体中可能还有其他字段。\n\n几乎所有的字段都用于高级用途。完整细节可以在\
  \ POSIX 标准和 `sigaction`(2) 手页中找到。然而，我们可以描述 `si_code` 字段的一种简单用法。\n\n| **标志** | **含义**\
  \ |\n| --- | --- |\n| `SA_NOCLDSTOP` | 此标志仅对 `SIGCHLD` 有意义。设置时，当子进程被 `SIGSTOP`、`SIGTSTP`、`SIGTTIN`\
  \ 或 `SIGTTOU` 停止时，父进程不会接收信号。这些信号将在后文第 10.8.2 节 “作业控制信号”中讨论，参见第 365 页。 |\n| `SA_NOCLDWAIT`\
  \ | 此标志仅对 `SIGCHLD` 有意义。其行为较为复杂。我们将解释推迟到本章的后后部分；参见第 10.8.3 节 “父进程监督：三种不同的策略”，参见第\
  \ 366 页。 |\n| `SA_NODEFER` | 通常情况下，在信号处理器运行时，指定的信号会被阻塞。当设置此标志时，指定的信号在信号处理器运行时不会被阻塞。`SA_NODEFER`\
  \ 是该标志的 POSIX 官方名称（你应该使用它）。 |\n| `SA_NOMASK` | `SA_NODEFER` 的另一种非标准名称。^(5) |\n|\
  \ `SA_SIGINFO` | 信号处理器接受三个参数。如前所述，设置此标志后，应使用 `sa_sigaction` 字段而非 `sa_handler`。根据\
  \ GLIBC 的作者之一 Ulrich Drepper 的说法，此选项应始终与实时信号 `SIGRTMIN` … `SIGRTMAX` 一起使用。 |\n|\
  \ `SA_ONSTACK` | 这是一个高级功能。信号处理器可以使用用户提供的内存作为“备用信号栈”进行调用。内存通过 `sigaltstack()`（参见\
  \ `sigaltstack`(2)）提供给内核供此类使用。书中未对此功能进行其他描述。 |\n| `SA_RESETHAND` | 此标志提供了 V7 行为：当调用处理器时，信号的动作将重置为默认值。`SA_RESETHAND`\
  \ 是该标志的 POSIX 官方名称（你应该使用它）。 |\n| `SA_ONESHOT` | `SA_RESETHAND` 的另一种非标准名称。 |\n| `SA_RESTART`\
  \ | 此标志提供了 BSD 语义：可能因 `EINTR` 失败且接收到此信号的系统调用将重启。 |\n\n**表 10.3：** `sa_flags` 的标志值\n\
  \n^(5) 就我们所能的，`SA_NOMASK` 和 `SA_ONESHOT` 的名称是 GNU/Linux 特有的。如果有人知道不同的情况，请告知我们！\n\
  \n对于 `SIGBUS`、`SIGCHLD`、`SIGFPE`、`SIGILL`、`SIGPOLL`、`SIGSEGV` 和 `SIGTRAP`，`si_code`\
  \ 字段可以取一组特定于每个信号的定义值，表示信号的原因。坦率地说，这些细节有些令人崩溃；日常代码并不真正需要处理它们（尽管我们稍后会查看 `SIGCHLD`\
  \ 的值）。对于所有其他信号，`si_code` 成员具有表 10.4 中的其中一个值。\n\n| **值** | **仅限 GLIBC** | **含义**\
  \ |\n| --- | --- | --- |\n| `SI_ASYNCIO` | | 异步 I/O 完成（高级）。 |\n| `SI_KERNEL` | *✓*\
  \ | 内核发送了信号。 |\n| `SI_MESGQ` | | 消息队列状态改变（高级）。 |\n| `SI_QUEUE` | | 从 `sigqueue()`\
  \ 发送的信号（高级）。 |\n| `SI_SIGIO` | *✓* | 队列了某个 `SIGIO`（高级）。 |\n| `SI_TIMER` | | 定器超时。\
  \ |\n| `SI_TKILL` | *✓* | 通过 `tgkill()` 向线程发送的信号（高级）。 |\n| `SI_USER` | | 由 `kill()`\
  \ 发送的信号。`raise()` 和 `abort()` 也允许产生此值，但并非强制。 |\n\n**表 10.4：** `si_code` 的信号来源值\n\
  \n特别地，`SI_USER` 值非常用用；它允许信号处理器告知信号是由 `raise()` 还是 `kill()`（后文将描述）发送的。你可以使用这些信息来避免再次调用\
  \ `raise()` 或 `kill()`。\n\n三参数信号处理器的第三个参数 `void *context` 是一个高级功能，在书中未另作讨论。\n\n\
  最后，为了查看 `sigaction()` 的用法，让我们查看 `sort.c` 中信号处理器的完整文本：\n\n```\n 72  /* 使用 SA_NOCLDSTOP\
  \ 作为判断 sigaction 机制是否\n73     存在的代理。  */\n   …\n4186  /* 处理中断和挂起。 */\n4187\n4188\
  \  static void\n4189  sighandler (int sig)\n4190  {\n4191    if (! SA_NOCLDSTOP)\
  \                      在非 POSIX 风格系统上\n4192      signal (sig, SIG_IGN);        \
  \         将动作设置为忽略\n4193\n4194    cleanup ();                              运行清理代码\n\
  4195\n4196    signal (sig, SIG_DFL);                   将动作设为默认\n4197    raise (sig);\
  \                             重新发送信号\n4198  }\n```\n\n以下是 `main()` 函数中放置处理器的代码：\n\
  \n\n\n\n\n```\n4352  #if SA_NOCLDSTOP                                   在 POSIX\
  \ 系统上…\n4353      struct sigaction act;\n4354\n4355      sigemptyset (&caught_signals);\
  \                 — 初始化信号集\n4356      for (i = 0; i < nsigs; i++)              \
  \      — 遍历所有信号\n4357        {\n4358          sigaction (sig[i], nullptr, &act);\
  \         — 获取信号的处理器\n4359          if (act.sa_handler != SIG_IGN)             —\
  \ 如果未忽略…\n4360            sigaddset (&caught_signals, sig[i]);     — 将其加入捕获信号集\n\
  4361        }\n4362\n4363      act.sa_handler = sighandler;                   —\
  \ 信号处理函数\n4364      act.sa_mask = caught_signals;                  — 设置处理器的进程信号掩码\n\
  4365      act.sa_flags = 0;                              — 无特殊标志\n4366\n4367   \
  \   for (i = 0; i < nsigs; i++)                    — 遍历所有信号\n4368        if (sigismember\
  \ (&caught_signals, sig[i]))   — 如果正在被捕获…\n4369          sigaction (sig[i], &act,\
  \ nullptr);         — 使用我们的处理器\n4370  #else\n4371      for (i = 0; i < nsigs; i++)\
  \                    在旧版系统上，遍历所有信号…\n4372        if (signal (sig[i], SIG_IGN) !=\
  \ SIG_IGN)     — 如果未忽略该信号…\n4373          {\n4374            signal (sig[i], sighandler);\
  \             — 使用我们的处理器\n4375            siginterrupt (sig[i], 1);            \
  \    — 允许信号中断\n4376          }                           系统调用\n4377  #endif\n```\n\
  \n值得注意的是 4356–4361 行和 4371–4376 行，它们展示了检查信号是否被忽略以及仅在未被忽略时安装处理器的正确方法。\n\n**注意**\n\
  \n`sigaction()` API 和 `signal()` API 不应对同一个信号混合使用。尽管 POSIX 尽力允许最初使用 `signal()`，然后从\
  \ `signal()` 获取表示处理状态的 `struct sigaction` 并再恢复它，但这样做仍然是一个坏主意。如果你仅专门使用其中一种 API，代码将更易于阅读、编写和理解。\n\
  \n### 10.6.5 检索待处理信号：`sigpending()`\n\n前文描述的 `sigpending()` 系统调用允许你检索一组待处理的信号——即即那些已到达但由于被阻塞而尚未递送的信号：\n\
  \n```\n#include <signal.h>                                         POSIX\n\nint\
  \ sigpending(sigset_t *set);\n```\n\n除了取消待处理信号的阻塞以便递送外，你还可以选择忽略它们。将待处理信号的操作设置为 `SIG_IGN`\
  \ 会导致该待处理信号被丢弃（即使它被阻塞了）。同样，对于那些默认动为忽略的信号，将操作设置为 `SIG_DFL` 也会导致此类待处理信号被丢弃。\n\n###\
  \ 10.6.6 使函数可中断：`siginterrupt()`\n\n为了方便起见，可以使用 `siginterrupt()` 函数根据第二个参数的值，使函数对特定信号可中断，或使其变为可重启的。其声明为：\n\
  \n```\n#include <signal.h>                                         已弃\n\nint siginterrupt(int\
  \ sig, int flag);\n```\n\n此函数也已从 POSIX 标准中移除，但在 GNU/Linux 上仍然可用。`siginterrupt()`\
  \ 的行为等于以下代码：\n\n```c\nint\nsiginterrupt(int sig, int flag)\n{\n    int ret;\n  \
  \  struct sigaction act;\n\n    (void) sigaction(sig, NULL, &act);     检索旧设置\n\n\
  \    if (flag)                              如果 flag 为真…\n        act.sa_flags &=\
  \ ~SA_RESTART;       禁用重启\n    else                                   否则…\n    \
  \    act.sa_flags |= SA_RESTART;        启用重启\n\n    ret = sigaction(sig, &act, NULL);\
  \      应用新设置\n    return ret;                            返回结果\n}\n```\n\n成功时返回 `0`，错误时返回\
  \ `-1`。\n\n### 10.6.7 发送信号：`kill()` 和 `killpg()`\n\n用于发送信号的传统 Unix 函数命名为 `kill()`。这个名字有点误导性；它所做的只是发送信号。（通常结果是信号接收者死亡，但事实并非如此。然而，现在更改名字已经太晚了。）`killpg()`\
  \ 函数向特定的进程组发送信号。其声明如下：\n\n```c\n#include <sys/types.h>                         \
  \           POSIX\n#include <signal.h>\n\nint kill(pid_t pid, int sig);\nint killpg(int\
  \ pgrp, sig);                            POSIX XSI\n```\n\n`sig` 参数可以是信号名称或 `0`。在后一种情况下，不发送信号，但内核仍会执行错误检查。特别是，这是验证给定进程或进程组存在的正确方法。`kill()`\
  \ 在成功时返回 `0`，错误时返回 `-1`；`errno` 则指示问题。\n\n| `pid` | 描述 |\n| :--- | :--- |\n| `pid\
  \ > 0` | 是进程号，信号发送到该进程。 |\n| `pid = 0` | 信号发送到发送进程进程组中的所有进程。 |\n| `pid = -1` | 信号发送到系统上的所有进程，除了特殊进程。\
  \ |\n| `pid < -1` | 信号发送到 `pid` 的绝对值所代表的进程组。 |\n\n`sig` 参数可以是信号名称或 `0`。在后一种情况下，不发送信号，但内核仍会执行错误检查。特别是，这是验证给定进程或进程组存在的正确方法。`killpg()`\
  \ 向进程组发送信号。只要 `pgrp` 值大于 `1`，它就等同于 `kill(-pgrp, sig)`。POSIX 规定如果 `pgrp` 小于或等于 `1`，行为未定义。然而，GNU/Linux\
  \ 手册页指出如果 `pgrp` 为 `0`，则信号发送到发送进程进程组。（这与 `kill()` 相同。）\n\n标准 C 函数 `raise()` 本质等同于\n\
  \n```c\nint\nraise(int sig)\n{\n    return kill(getpid(), sig);\n}\n```\n\nC 标准委员会选择\
  \ `raise()` 这个名字是因为 C 同样适用于非 Unix 环境，而 `kill()` 被认为是 Unix 特有的。这也是使用一个更具描述性的名字的好机会。\n\
  \n### 10.6.8 故事回顾，第二集\n\nSystem V Release 3 API 旨在解决原始 V7 信号 API 提出的各种问题。特别是信号阻塞的概念是一个重要的额外概念。\n\
  \n\n\n\n然而，这些 API 的作用还不够彻底，因为它们一次只能处理一个信号，留下了许多窗口，导致不希望的信号可能会进入。POSIX API 通过对多个信号进行**原子性**（`atomically`）操作（信号掩码，在程序中用\
  \ `sigset_t` 类型表示）解决了这个问题，关闭了这些窗口。\n\n我们检查过的第一组函数用于操作 `sigset_t` 值：`sigfillset()`、`sigemptyset()`、`sigaddset()`、`sigdelset()`\
  \ 和 `sigismember()`。\n\n下一组函数与进程信号掩码一起：`sigprocmask()` 设置和检索进程信号掩码，`sigpending()`\
  \ 获取悬挂的信号集，而 `sigsuspend()` 让进程进入睡眠，并临时用其参数中的信号掩码替换进程信号掩码。\n\nPOSIX 的 `sigaction()`\
  \ API 由于需要提供以下内容而变得（非常）复杂了：\n\n- 向后兼容的行为：`sa_flags` 字段中的 `SA_RESETHAND` 和 `SA_RESTART`。\n\
  - 选择接收到的信号是否也被阻塞：`sa_flags` 中的 `SA_NODEFER`。\n- 拥有两种类型信号处理程序的能力：单参数或三参数。\n- 管理 `SIGCHLD`\
  \ 的行为选择：`sa_flags` 中的 `SA_NOCLDSTOP` 和 `SA_NOCLDWAIT`。\n\n`siginterrupt()` 函数是一个便利\
  \ API，用于为给信号启用或禁用可重启的系统调用。\n\n最后，`kill()` 和 `killpg()` 可用于发送信号，不仅发送给当前进程，还可以发送给其他进程（当然是允许）。\n\
  \n## 10.7 用于进程间通信的信号\n\n*这是一个极其糟糕的主意！信号不是用来干这个的！直接说不。*\n\n—— Geoff Collyer\n\n进程间通信（IPC）的主要机制之一是管道，它在第\
  \ 9.3 节，“基本进程间通信：管道和 FIFO](#ch09.xhtml_ch09lev1sec3)”，第 302 页中有所描述。同样，也可以使用信号进行非常简单的\
  \ IPC。(6) 这样做相当笨拙；接收者只能知道某个特定的信号来了。虽然 `sigaction()` API 允许接收者获取发送信号的进程 PID 和所有者，但此类信息通常没有太大帮助。\n\
  \n^(6) 感谢 Ulrich Drepper 帮助我们理解涉及的问题。\n\n### 注释\n\n正如开头引言所示，使用信号进行 IPC 几乎总是一个坏主意。我们建议尽可能避免这样做。但我们的目标是教你如何使用\
  \ Linux/Unixset（包括它们的缺点），由你来对使用什么做出明智的决定。\n\n对于许多程序，信号作为 IPC 可能是唯一的选择。特别是，如果两个通信的程序不是由共同父进程启动的，那么管道就不是选项；如果其中一个通信程序只与标准输入输出工作，那么\
  \ FIFO 文件可能不是选项。（信号通常使用的一个实例是某些系统守护进程程序，例如 `xinetd`，它接受几个信号，建议它应该重新读取其控制文件、进行一致性检查等。）\n\
  \n基于信号的应用程序典型高层结构如下：\n\n```\nfor (;;) {\n    等待信号\n\n    处理信号\n}\n```\n\n等待信号的原始\
  \ V7 接口是 `pause()`：\n\n```c\n#include <unistd.h>                               \
  \                 POSIX\n\nint pause(void);\n```\n\n`pause()` 挂起进程；它只有在信号送达且信号处理程序返回后才会返回。根据定义，`pause()`\
  \ 只对捕获的信号有用——被忽略的信号在到达时会被忽略，而具有终止进程（无论是否有 `core` 文件）的默认动作的信号仍然会执行该操作。\n\n上述描述的高层应用结构的问题在于\
  \ `处理信号` 部分。当这段代码运行时，你不希望必须处理另一个信号；你希望在处理下一个信号之前完成对当前信号的处理。一种解决方案是构造信号处理程序以设置一个标记，并在主循环中检查该标记：\n\
  \n```c\nvolatile sig_atomic_t signal_waiting = 0;  /* 如果有未处理的信号则为真 */\n\nvoid\n\
  handler(int sig)\n{\n    signal_waiting = 1;\n    设置任何其他指示是哪个信号的数据\n}\n```\n\n在主代码中，检查标记：\n\
  \n```c\nfor (;;) {\n    if (! signal_waiting) {      // 如果另一个信号来了\n        pause();\
  \                 // 这段代码被跳过\n        signal_waiting = 1;\n    }\n\n    确定哪个信号来了\n\
  \    signal_waiting = 0;\n    处理信号\n}\n```\n\n遗憾的是，这段代码充满了竞态条件：\n\n```c\nfor (;;)\
  \ {\n    if (! signal_waiting) {\n           <----------------------- 信号可能在此到达，在条件检查之后！\n\
  \        pause();                    // 无论如何都会调用 pause()\n        signal_waiting\
  \ = 1;\n    }\n\n    确定哪个信号来了     <---- 这里的信号可能会覆盖全局数据\n    signal_waiting = 0;\n\
  \    处理信号               <---- 也是如此，特别是当有多个信号时\n}\n```\n\n解决方案是让感兴趣的信号始终保持阻塞，`除非`\
  \ 在等待它到达时。例如，假设 `SIGINT` 是感兴趣的信号：\n\n```c\nvoid\nhandler(int sig)\n{\n    /* sig\
  \ 通过 sigaction() 自动阻塞 */\n    设置关于此信号的任何全局数据\n}\n\nint\nmain(int argc, char **argv)\n\
  {\n    sigset_t set;\n    struct sigaction act;\n\n    … 常规设置，处理选项等. …\n\n    sigemptyset(&\
  \ set);                       初始化集合为空集\n    sigaddset(& set, SIGINT);          \
  \       将 SIGINT 添加到集合\n    sigprocmask(SIG_BLOCK, & set, NULL);      阻塞它\n    act.sa_mask\
  \ = set;                        设置处理程序\n    act.sa_handler = handler;\n    act.sa_flags\
  \ = 0;\n    sigaction(sig, & act, NULL);              安装它\n\n    ...           \
  \                            可能安装了单独的处理程序\n    ...                             \
  \          针对其他信号\n\n    sigemptyset(& set);                       重置为空集，允许 SIGINT\
  \ 到达\n\n    for (;;) {\n        sigsuspend(& set);                    等待 SIGINT\
  \ 到达\n\n        处理信号                            SIGINT 在此处再次被阻塞\n    }\n\n    …\
  \ 其他代码 …\n    return 0;\n}\n```\n\n这种方法的关键在于 `sigsuspend()` `临时` 用作为参数传递的掩码替换进程信号掩码。这允许\
  \ `SIGINT` 到达。一旦到达，它就会被处理；信号处理程序返回，然后 `sigsuspend()` 也会返回。当 `sigsuspend()` 返回时，原始进程信号掩码已恢复。\n\
  \n你可以轻松地将这种范式扩展到多个信号，通过在 `main()` 和信号处理程序期间阻塞所有感兴趣的信号，仅在调用 `sigsuspend()` 时取消阻塞。\n\
  \n鉴于此，你不应该在新代码中使用 `pause()`。`pause()` 被 POSIX 标准化主要是为了支持旧代码。相反，如果你需要构造你的应用程序使用信号进行\
  \ IPC，请专门使用 `sigsuspend()` 和 `sigaction()` API。\n\n### 注释\n\n之前的示例代码假设进程信号掩码初始为空。生产环境代码应该处理程序启动时已存在的任何信号掩码。\n\
  \n## 10.8 重要的特殊用途信号\n\n几个信号具有特殊用途。我们在这里描述最重要的几个。\n\n### 10.8.1 闹钟：`sleep()`、`alarm()`\
  \ 和 `SIGALRM`\n\n通常需要编写如下形式的程序：\n\n```c\nwhile (某个条件不为真) {\n    等待一段时间\n}\n```\n\
  \n这种需求在 shell 脚本中经常出现，例如等待直到特定用户登录：\n\n```bash\nuntil who | grep '^arnold' > /dev/null\n\
  do\n    sleep 10\ndone\n```\n\n\n\n有两种机制，一个较低级，一个较高级，可以让运行中的进程在指定的秒数过去后感知。\n\n###\
  \ 10.8.1.1 难度更大但控制更多：`alarm()` 和 `SIGALRM`\n\n最基本的构建块是 `alarm()` 系统调用：\n\n```\n\
  #include <unistd.h>                                           POSIX\n\nunsigned\
  \ int alarm(unsigned int seconds);\n```\n\n`alarm()` 返回后，程序继续运行。然而，当经过 `seconds`\
  \ 秒后，内核会向进程发送一个 `SIGALRM`。默认动作是终止进程，但你很可能已经为 `SIGALRM` 安装了信号处理程序。\n\n返回 `0`，或者如果之前设置过报警器，则返回在报警器触发前剩余的秒数。然而，一个进程只能有一个这样的报警器；之前的报警器会被取消，新的报警器将取代它。\n\
  \n这里的优点是，由于有了你自己的处理器，你可以在信号到来时执行任何你想做的事。缺点是你必须准备好在多个上下文中工作：即主程序的上下文和信号处理程序的上下文。\n\
  \n### 10.8.1.2 简单易用：`sleep()`\n\n等待固定时间的更简单方法是使用 `sleep()`：\n\n```\n#include <unistd.h>\
  \                                           POSIX\n\nunsigned int sleep(unsigned\
  \ int seconds);\n```\n\n如果进程睡眠了整个指定时间，返回值为 `0`。否则，返回值为剩余的睡眠时间。后一种返回值可能发生在进程休眠期间收到了信号的情况下。\n\
  \n**注意**\n\n`sleep()` 函数通常通过 `signal()`、`alarm()` 和 `pause()` 的组合来实现。这种方法使得 `sleep()`\
  \ 与你自己的 `alarm()` 调用（或用于高级函数 `setitimer()`）混合使用变得危险的，该函数见第 16.3.3 节，“间隔定时器：`setitimer()`\
  \ 和 `getitimer()``](#ch16.xhtml_ch16lev2sec7)”，第 570 页）。现在如果想了解 `nanosleep()` 函数，请参阅第\
  \ 16.3.4 节，“更精确的暂停：`nanosleep()``](#ch16.xhtml_ch16lev2sec8)”，第 573 页。\n\n### 10.8.2\
  \ 作业控制信号\n\n有几个信号用于实现*作业控制*——启动和停止作业以及将它们在后台和前台之间移动的能力。在用户级别，你无疑做过这些：使用 `CTRL-Z`\
  \ 停止作业，使用 `bg` 将停止的作业放入后台，以及偶尔使用 `fg` 将后台或停止的作业移动到前台。\n\n第 9.2.1 节，“作业控制概述](#ch09.xhtml_ch09lev2sec7)”，第\
  \ 300 页 概地描述了作业控制的工作原理。本节通过描述作业控制信号来完成这一概述，因为你可能偶尔想直接捕获它们：\n\n*   `SIGTSTP`\n\n\
  \    此信号产生“终端停止”。当终端上的用户（或模拟终端的窗口）输入特定按键时，内核向进程发送该信号。通常情况下，这是 `CTRL-Z`，就像 `CTRL-C`\
  \ 通常会发送 `SIGINT` 一样。\n\n    `SIGTSTP` 的默认动作是停止（挂起）进程。但你可以像捕获其他信号一样捕获它。如果你的程序改变了终端状态，这样做是一个好主意。例如，考虑\
  \ `vim` 或 `Emacs` 屏幕编辑器，它们会将终端置于逐字符模式。在接收到 `SIGTSTP` 时，它们应该将终端恢复到正常的逐行模式，然后挂起自己。\n\
  \n*   `SIGSTOP`\n\n    此信号也会停止进程，但它不能被捕获、阻塞或忽略。它可以被手动使用（通过 `kill` 命令）作为最后的最后手段，或者通过程序方式使用。例如，上文讨论的\
  \ `SIGTSTP` 处理器在恢复终端状态后，可以使用 `raise(SIGSTOP)` 来停止进程。\n\n*   `SIGTTIN`\n\n*   `SIGTTOU`\n\
  \n    这些信号早些被定义为“后台从 tty 读取”和“后台写入 tty”。*tty* 是一个终端设备。在作业控制系统中，运行在后台的进程被禁止从终端读取或写入终端。当进程尝试任一操作时，内核会向其发送相应的信号。对于这两个信号，默认动作都是停止进程。如果你愿意，可以捕获这些信号，但很少理由这样做。\n\
  \n*   `SIGCONT`\n\n    此信号继续已停止的进程。如果进程正在运行，它会被忽略。如果你愿意，可以捕获它，但同样对于大多数程序来说，没什么理由这样做。继续我们的例子，屏幕编辑器的\
  \ `SIGCONT` 处理器应该在返回之前将终端恢复到逐字符模式并安排重绘屏幕。\n\n当进程停止时，发送给它的任何其他信号都会变为挂起。例外是 `SIGKILL`，它总是会被传递给进程，且不能被捕获、阻塞或忽略。假设除了\
  \ `SIGKILL` 以外的信号已经发送，收到 `SIGCONT` 后，挂起的信号将被传递，进程在处理它们后继续执行。\n\n最后，我们必须注意，如果你想管理作业控制和你的终端设置（例如，如果你正在编写屏幕编辑器），实际上有很多内容需要理解。不幸的是，这些都超出了本书的范围。\n\
  \n### 10.8.3 父级监督：三种不同的策略\n\n如第 9.1.1 节所示，“创建进程：`fork()`](ch09.xhtml_ch09lev2sec1)”，第\
  \ 275 页，调用 `fork()` 的副作用之一是在进程间创建父子关系。父进程可以等待其一个或多个子进程死亡，并使用 `wait()` 系列系统调用之一恢复子进程的退出状态。\n\
  \n未被等待的死亡子进程被称为*僵尸*zombies）。通常，每当子进程死亡时，内核都会向父进程发送 `SIGCHLD` 信号。(7)默认动作是忽略此信号。在这种情况下，僵尸进程会堆积，直到父进程执行\
  \ `wait()` 或父进程本身死亡。在后一种情况下，僵尸子会被重新赋值给 `init` 系统进程（PID 1），由它作为其正常工作的一部分进行收割。同样，活跃的子进程也会重新赋值给\
  \ `init` 并在它们退出时被收割。\n\n^(7) 历史上，BSD 系统使用 `SIGCHLD` 名称，这也是 POSIX 使用的名称。System V\
  \ 有一个名为 `SIGCLD` 的类似信号。GNU/Linux `#define` 将后者定义为前者——见表 10.1。\n\n`SIGCHLD` 不仅用于通知死亡。每当子进程停止（通过前面讨论的作业控制信号之一）时，`SIGCHLD`\
  \ 也会发送给父进程。POSIX 标准表明，当子进程继续时，“可能会发送” `SIGCHLD`；显然历史 Unix 系统之间存在差异。\n\n`struct sigaction`\
  \ 中 `sa_flags` 字段的标志组合以及使用 `SIG_IGN` 作为 `SIGCHLD` 的动作允许你更改内核处理进程停止、继续或死亡的方式。\n\n\
  与信号一样，这里描述的接口和机制非常复杂，因为它们是随着时间演变的。\n\n#### 10.8.3.1 糟糕的父子关系：完全忽略子进程\n\n你可以做的最简单的方法是将\
  \ `SIGCHLD` 的动作改为 `SIG_IGN`。在这种情况下，终止的子进程不会变成僵尸。相反，它们的退出状态会被丢弃，并且它们会被完全从系统中移除。另一种产生相同效果的方法是使用\
  \ `SA_NOCLDWAIT` 标志。在代码中：\n\n\n\n\n\n```\n/* 旧样式： */                      /* 新样式：\
  \ */\n                                      struct sigaction sa;\n             \
  \                         sa.sa_handler = SIG_IGN;\nsignal(SIGCHLD, SIG_IGN);  \
  \           sa.sa_flags = SA_NOCLDWAIT;\n                                      sigemptyset(&\
  \ sa.sa_mask);\n                                      sigaction(SIGCHLD, & sa, NULL);\n\
  ```\n\n### 10.8.3.2 宽松的父进程：最小化监控\n\n或者，你可能关心子进程的终止，而不对简单的状态变化（停止或继续）感兴趣。在这种情况下，使用\
  \ `SA_NOCLDSTOP` 标志，并设置一个信号处理程序，调用 `wait()`（或其同类函数）来回收进程。\n\n通常情况下，你*不能*期望每个死亡的子进程都会产生一个\
  \ `SIGCHLD` 。你应该将 `SIGCHLD` 视为“至少有一个子进程死亡”，并准备在每次处理 `SIGCHLD` 时尽可能回收所有的子进程。\n\n\
  以下程序 `ch-signals-reap1.c` 会阻塞 `SIGCHLD` 直到它准备好回收子进程：\n\n```\n 1  /* ch-signals-reap1.c\
  \ --- 使用循环演示 SIGCHLD 的管理 */\n 2\n 3  #include <stdio.h>\n 4  #include <errno.h>\n\
  \ 5  #include <signal.h>\n 6  #include <string.h>\n 7  #include <unistd.h>\n 8 \
  \ #include <sys/types.h>\n 9  #include <sys/wait.h>\n10\n11  #define MAX_KIDS 42\n\
  12  #define NOT_USED -1\n13\n14  pid_t kids[MAX_KIDS];\n15  size_t nkids = 0;\n\
  ```\n\n`kids` 数组跟踪子进程的 PID。如果某个元素是 `NOT_USED`，则它不代表尚未回收的子进程。（下方的第 93–94 行初始化了它）。`nkids`\
  \ 表示 `kids` 中应该检查多少个值。\n\n由于信号处理程序不应该调用 `printf()` 族的任何成员，我们提供了一个简单的“辅助”函数 `format_num()`，将十进制信号或\
  \ PID 数字转换为字符串。这种方法很原始，但有效用：\n\n```\n17  /* format_num --- 因为无法使用 [sf]printf() 而提供的辅助函数\
  \ */\n18\n19  const char *\n20  format_num(int num)\n21  {\n22  #define NUMSIZ 30\n\
  23      static char buf[NUMSIZ];\n24      int i;\n25\n26      if (num <= 0) {\n\
  27          strcpy(buf, \"0\");\n28          return buf;\n29      }\n30\n31    \
  \  i = NUMSIZ - 1;\n32      buf[i--] = '\\0';\n33\n34      /* 反向向字符串中生成数字。 */\n\
  35      do {\n36          buf[i--] = (num % 10) + '0';\n37          num /= 10;\n\
  38      } while (num > 0);\n39\n40      return & buf[i+1];\n41  }\n```\n\n这里是信号处理函数：\n\
  \n```\n43  /* childhandler --- 捕获 SIGCHLD，回收所有可用的子进程 */\n44\n45  void\n46  childhandler(int\
  \ sig)\n47  {\n48      int status, ret;\n49      int i;\n50      char buf[100];\n\
  51      static const char entered[] = \"Entered childhandler\\n\";\n52      static\
  \ const char exited[] = \"Exited childhandler\\n\";\n53\n54      int junk = write(1,\
  \ entered, strlen(entered));\n55      for (i = 0; i < nkids; i++) {\n56        \
  \  if (kids[i] == NOT_USED)\n57              continue;\n58\n59      retry:\n60 \
  \         if ((ret = waitpid(kids[i], & status, WNOHANG)) == kids[i]) {\n61    \
  \          strcpy(buf, \"\\treaped process \");\n62              strcat(buf, format_num(ret));\n\
  63              strcat(buf, \"\\n\");\n64              junk = write(1, buf, strlen(buf));\n\
  65              kids[i] = NOT_USED;\n66          } else if (ret == 0) {\n67    \
  \          strcpy(buf, \"\\tpid \");\n68              strcat(buf, format_num(kids[i]));\n\
  69              strcat(buf, \" not available yet\\n\");\n70              junk =\
  \ write(1, buf, strlen(buf));\n71          } else if (ret == -1 && errno == EINTR)\
  \ {\n72              junk = write(1, \"\\tretrying\\n\", 10);\n73              goto\
  \ retry;\n74          } else {\n75              strcpy(buf, \"\\twaitpid() failed:\
  \ \");\n76              strcat(buf, strerror(errno));\n77              strcat(buf,\
  \ \"\\n\");\n78              junk = write(1, buf, strlen(buf));\n79          }\n\
  80      }\n81      junk = write(1, exited, strlen(exited));\n82  }\n```\n\n第 54\
  \ 行和第 81 行打印“entered”和“exited”消息，以便我们清楚地看到信号处理程序何时被调用。其他消息以制表符字符开头。\n\n信号处理程序的主部分是一个大循环（第\
  \ 55–80 行）。第 56–57 行检查 `NOT_USED`，如果当前槽位未在使用，则继续循环。\n\n第 60 行对 `kids` 中当前位置的 PID\
  \ 调用了 `waitpid()`。我们提供了 `WNOHANG` 选项，它使得在请求的子进程不可用时，`waitpid()` 会立即返回。此调用是必要的，因为可能并不是所有的子进程都已退出。\n\
  \n根据返回值，代码会采取适当的操作。第 60–65 行处理找到子进程的情况，通过打印消息并将 `kids` 中的相应槽位标记为 `NOT_USED`。\n\n\
  第 66–70 行处理请求的子进程不可用的情况。在这种情况下，返回值为 `0`，因此我们打印一条消息并继续执行。\n\n第 71–73 行处理系统调用被中断的情况。在这种情况下，使用\
  \ `goto` 回到 `waitpid()` 调用是处理这种情况最干净的方法。（由于在信号处理程序运行时，`main()` 会阻塞所有信号 [第 100 行]，这种中断不应该发生。但这个示例展示了如何处理所有情况。）\n\
  \n第 74–79 行处理任何其他错误，打印适当的错误信息。代码继续：\n\n```\n 84  /* main --- 设置子进程相关信息和信号，创建子进程\
  \ */\n 85\n 86  int\n 87  main(int argc, char **argv)\n 88  {\n 89      struct sigaction\
  \ sa;\n 90      sigset_t childset, emptyset;\n 91      int i;\n92\n 93      for\
  \ (i = 0; i < nkids; i++)\n 94          kids[i] = NOT_USED;\n95\n 96      sigemptyset(&\
  \ emptyset);\n97\n 98      sa.sa_flags = SA_NOCLDSTOP;\n 99      sa.sa_handler =\
  \ childhandler;\n100     sigfillset(& sa.sa_mask); /* 在信号处理程序运行时阻塞所有信号 */\n101 \
  \    sigaction(SIGCHLD, & sa, NULL);\n102\n103     sigemptyset(& childset);\n104\
  \     sigaddset(& childset, SIGCHLD);\n105     sigprocmask(SIG_SETMASK, & childset,\
  \ NULL); /* 在 main 中阻塞它 */\n106\n107     for (nkids = 0; nkids < 5; nkids++) {\n\
  108         if ((kids[nkids] = fork()) == 0) {\n109             sleep(3);\n110 \
  \            _exit(0);\n111         }\n112     }\n113\n114     sleep(5);  /* 给孩子们的机会\
  \ */\n115\n116     printf(\"waiting for signal\\n\");\n117     sigsuspend(& emptyset);\n\
  118\n119     return 0;\n120  }\n```\n（注：由于提供的原文代码块中 98-101 行的逻辑与描述略有出入，此处根据上下文对代码逻辑进行了对齐）\n\
  \n第 93–94 行初始化 `kids`。第 96 行初始化 `emptyset`。第 98–101 行设置并安装 `SIGCHLD` 的信号处理程序。注意第\
  \ 98 行使用的 `SA_NOCLDSTOP`，而第 100 行在处理程序运行时阻塞所有信号。\n\n第 103–104 行创建一个仅代表 `SIGCHLD`\
  \ 的信号集，第 106 行将其设置为进程信号掩码。\n\n第 108–113 行创建五个子进程，每个子进程睡眠三秒。在此过程中，它更新了 `kids` 数组和\
  \ `nkids` 变量。\n\n第 115 行通过睡眠更长时间给了孩子们的机会。（这并不能*保证*孩子们会终止，但几率很大。）\n\n最后，第 117–118\
  \ 行打印一条消息并暂停，将阻塞 `SIGCHLD` 的进程信号掩码替换为空集。这允许 `SIGCHLD` 信号通过，从而导致信号处理程序运行。以下是发生的情况：\n\
  \n```\n$ ch-signals-reap1                         运行程序\nwaiting for signal\nEntered\
  \ childhandler\n    reaped process 70395\n    reaped process 70396\n    reaped process\
  \ 70397\n    reaped process 70398\n    reaped process 70399\nExited childhandler\n\
  ```\n\n信号处理程序一次性回收所有的子进程。\n\n以下程序 `ch-signals-reap2.c` 与 `ch-signals-reap1.c` 相似。不同在于它允许\
  \ `SIGCHLD` 在任何时间到达。这种行为增加了接收多个 `SIGCHLD` 的机会，但并*不保证*这一点。因此，信号处理程序仍然准备好在循环中回收多个子进程：\n\
  \n\n\n\n\n```\n 1  /* ch-signals-reap2.c ---  SIGCHLD 管理，每个进程对应一个信号 */\n 2\n   \
  \ … 省省略未更改的代码 …\n12\n13  pid_t kids[MAX_KIDS];\n14  size_t nkids = 0;\n15  size_t\
  \ kidsleft = 0;                /* <<< 添加 */\n16\n    … 省省略 format_num() 的代码 …\n\
  43\n44  /* childhandler --- 捕获 SIGCHLD，回收所有可用的子进程 */\n45\n46  void\n47  childhandler(int\
  \ sig)\n48  {\n49      int status, ret;\n50      int i;\n51      char buf[100];\n\
  52      static const char entered[] = \"Entered childhandler\\n\";\n53      static\
  \ const char exited[] = \"Exited childhandler\\n\";\n\n55      int junk = write(1,\
  \ entered, strlen(entered));\n56      for (i = 0; i < nkids; i++) {\n57        \
  \  if (kids[i] == NOT_USED)\n58              continue;\n\n60      retry:\n61   \
  \       if ((ret = waitpid(kids[i], & status, WNOHANG)) == kids[i]) {\n62      \
  \        strcpy(buf, \"\\treaped process \");\n63              strcat(buf, format_num(ret));\n\
  64              strcat(buf, \"\\n\");\n65              junk = write(1, buf, strlen(buf));\n\
  66              kids[i] = NOT_USED;\n67              kidsleft--;  /* <<< 添加 */\n\
