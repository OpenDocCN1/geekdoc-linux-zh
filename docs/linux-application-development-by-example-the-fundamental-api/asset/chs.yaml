  \ *Internetworking with TCP/IP*, vol. 2, *Design, Implementation, and Internals*,\
  \ 3rd ed., by Douglas E. Comer and David L. Stevens. Pearson, 1998. ISBN-13: 978-13-973843-2.\n\
  \n8. *Internetworking with TCP/IP*, vol. 3, *Client-Server Programming and Applications*,\
  \ *Linux/POSIX Sockets Version*, by Douglas E. Comer and David L. Stevens. Pearson,\
  \ 2000. ISBN-13: 978-0-13-032071-1.\n\n最后，请参见关于 IPv6 的维基百科条目^(9)。\n\n^(9) [`https://en.wikipedia.org/wiki/IPv6`](https://en.wikipedia.org/wiki/IPv6)\n\
  \n## 14.12 总结\n\n* socket API 于 1983 年随 BSD 4.2 发布进入世。它迅速成为网络的标准机制，是当今互联网的基础。\n\n\
  * 两种主要的网络通信类型是*流*（类比电话）和*数据报*（类比邮邮件）。socket API 支持这些及更多，并支持多种网络协议族。TCP/IP 协议族是目前主要的协议。\n\
  \n* `AF_INET` 和 `AF_INET6` 地址族提供 IP 网络。`AF_UNIX` 地址族通过文件系统提供本地进程间的通信。\n\n* IP 协议使用\
  \ 32 位（IPv4）或 128 位（IPv6）地址。IPv4 已使用数十年。IPv6 在世界某些地区已在使用，并可能最终取代 IPv4。\n\n    *\
  \ TCP 在 IP 和*端口*上提供流式网络；端口是指定服务器特定服务的 16 位数字。\n\n    * UDP 在 IP 和端口上提供数据报网络。\n\n\
  \n\n\n\n- 在进行网络编程时，有很多细节需要跟踪，例如要使用的不同类型的地址结构，以及网络字节序与主机字节序。\n- 网络对话的参与者被指定为 `client`（客户端）和\
  \ `server`（服务器）。服务器等待传入的连接。客户端向服务器发起连接。代码流取决于你正在开发的哪种应用程序。\n- 套接系统调用可以总结如下：\n\n\
  | 系统调用 | 目的 |\n| :--- | :--- |\n| `socket()` | 创建一个新 socket。 |\n| `bind()` | 将 socket\
  \ 绑定到地址。 |\n| `listen()` | 等待传入的连接（服务器）。 |\n| `accept()` | 在新的 socket 上接受连接（服务器）。\
  \ |\n| `connect()` | 连接到地址（客户端）。 |\n| `shutdown()` | 关闭连接的一个或两个端点。 |\n| `send()`\
  \ | 在 socket 上发送数据（通常用于 UDP）。 |\n| `sendto()` | 类似于 `send()`，但提供了地址。 |\n| `recv()`\
  \ | 从 socket 接收数据（通常用于 UDP）。 |\n| `recvfrom()` | 类似于 `recv()`，但提供了地址。 |\n| `select()`\
  \ | 等待一个或多个文件描述符变为“就绪”。 |\n| `pselect()` | 类似于 `select()`，具有原子信号掩码功能。 |\n\n### 练习\n\
  \n1. 从阅读 RFC 862 开始。编写一个简单的服务器，读取客户端发送的任何内容并回显给客户端。为你的程序选择一个非特权端口，如 `4242`。将输入打印到\
  \ `stderr` 以供调试。你可以使用 `telnet localhost 4242` 来进行测试。（你可能需要在使用之前先安装 `telnet`。由于它使用明文传输数据的协议，许多现代系统不再默认预装了它。macOS\
  \ 特别如此。）\n\n2. 根据 RFC 862，端口 `7` 被预留给回显服务器（echo servers）：\n\n```\n$ grep echo /etc/services\n\
  echo        7/tcp\necho        7/udp\necho        4/ddp               # AppleTalk\
  \ Echo Protocol\n```\n\n在你的系统上尝试 `telnet localhost echo` 会发生什么？\n\n3. 为你的回显服务器编写一个客户端并进行测试，在一个窗口的\
  \ shell 中运行服务器，在另一个窗口运行客户端。\n\n4. 在第 14.5 节“服务器程序的基本结构”第 478 页中，我们提到 `gethostbyname()`\
  \ 现在被认为是过时的。它的替代品是一个名为 `getaddrinfo()` 的函数。查看 `getaddrinfo` (3) 手页。仔细阅读它，尽管你可以随意跳过\
  \ GLIBC 特有的部分。\n\n使用 `getaddrinfo()` 编写一个程序，查找一个或多个主机并以人类可读的格式打印所有返回的信息。\n\n5. `netcat`\
  \ 程序 `nc` 的设计类似于 `cat`，但用于网络。查看一下 `nc`(1) 手页以感受它的工作原理。\n\n`nc` 有许多功能。编写一个简单的版本，可用于创建任意的服务器（TCP\
  \ 或 UDP）和客户端。通过在一个窗口中作为服务器运行，在另一个窗口中作为客户端连接到你的服务器来对其测试。\n\n6. 复习 `poll`(2) 和 `epoll`(2)\
  \ 手页。考虑这些接口相对于 `select()` 接口的优缺点。\n\n7. 编写两个使用 FIFO 通信的程序——一个“服务器”和一个“客户端”。一个简单的、类似于第一个练习中的回显服务器程序即可。\n\
  \n现在重写它以使用 Unix 局域套接字（Unix domain sockets）。\n\n你更喜欢哪个版本，为什么？\n\n8. 在日常使用中，FIFO 相比\
  \ Unix 局域套接字有一个巨大的优势。是什么？（提示：想想比 C 语言更高的语言编写的程序。）\n\n# 第 15 章\n\n## 国际化与本地化\n\n\
  早期计算机系统通常使用英语输出（提示、错误消息）和输入（查询响应，例如“yes”和“no”）。Unix 系统也是如此，直到 20 世纪 80 年代中期。从 80\
  \ 年代后期，从第一个 C 语言 ISO 标准开始，一直到 90 年代的 POSIX 标准以及当前的 POSIX 标准，开发了许多设施使得程序能够在多种语言中运行，而无需维护同一程序的多个版本。本章描述了现代程序应该如何处理多语言问题。\n\
  \n## 15.1 引言\n\n核心概念是 `locale`（区域设置），程序运行的地方。区域设置封装了关于以下方面的信息：本地字符集；如何显示日期和时间信息；如何格式化和显示金额；以及如何格式化和显示数值（带有或不带千位分隔符，使用什么字符作为小数点等）。\n\
  \n`Internationalization`（国际化）是编写（或修改）程序使其能够在多个区域设置中运行的过程。`Localization`（本地化）是为特定区域设置对国际化程序进行定制的过程。这些术语通常缩写为\
  \ `i18n` 和 `l10n`。（数值表示单词中间出现了多少个字符，这些缩写与全称有细微的视觉相似性。它们也容易输入得多。）另一个频繁出现的术语是 `native\
  \ language support`（原生语言支持），缩写为 `NLS`；NLS 指对执行 i18n 和 l10n 的程序化支持。\n\n此外，一些人使用 `globalization`（全球化，缩写为\
  \ `g10n`）为国际化程序准备所有可能的本地化过程——换句话说，让程序准备好全球使用。\n\nNLS 设施存在两个层面。第一层是 C 库。它提供了关于区域设置的信息；处理格式化日期/时间、数值和金额的许多底层细节工作的例程；以及用于区域设置确定的正则表达式匹配、字符分类和比较的例程。这些库设施出现在\
  \ C 和 POSIX 标准中。此外，2024 年 POSIX 标准包含了一些用于处理程序消息翻译的命令行工具。\n\n在应用程序级别，GNU `gettext`\
  \ 提供了本地化程序的命令和库——即，让所有输出消息以一种或多种自然语言的形式可用。GNU `gettext` 基于 Sun Microsystems 最初为\
  \ Solaris 设计的设计；然而，它是从零开始实现的，并且现在为原始的 Solaris `gettext` 提供了扩展。GNU `gettext` 是程序本地化的事实标准，特别是在\
  \ GNU 世界中。\n\n还存在一个较早的设计，被称为 `catgets()`。尽管这种设计被 POSIX 标准化，但它难用得多，我们不推荐使用。\n\n除了区域设置和\
  \ `gettext`，标准 C 还提供了处理多个字符集及其 `encodings`（编码）的设施——用比直接使用字符值更少的字节表示大字符集的方法。\n\n\
  ## 15.2 区域设置与 C 库\n\n你通过设置环境变量来描述特定类型信息使用哪些区域设置来控制区域特定的行为。任何特定操作系统提供的可用区域设置数量从某些商用\
  \ Unix 系统上的少于十个到 GNU/Linux 系统上的数百个不等。（`locale -a` 打印可用区域设置的完整列表。每个 GNU/Linux 分发版都有安装额外区域设置的机制，如果需要的话。）\n\
  \n\n\n\n\n两个区域，`\"C\"` 和 `\"POSIX\"`，是保证一定存在的。它们作为默认区域，提供了一个七位 ASCII 环境，其行为与传统的、不感知区域的\
  \ Unix 系统相同。其他情况下，区域（locales）指定了语言和国家，以及可选的字符集信息。例如，`\"fr_FR\"` 用于在法国使用系统默认字符集的法语，而\
  \ `\"fr_FR.utf8\"` 则使用 UTF-8 字符编码的 Unicode 字符集。\n\n关于区域名称的更多细节可以在 GNU/Linux 的 `setlocale(3)`\
  \ 手页中找到。通常情况下，GNU/Linux 发行版在安装时会根据安装程序选择的语言为系统设置默认区域，用户不再需要担心它了。\n\n### 15.2.1 区域类别与环境变量\n\
  \n``<locale.h>`` 头文件定义了区域函数和结构。区域类别 `categories` 定义了程序对哪些类型的信息具有感知能力。这些类别以一组符号常量的形式存在。它们列在表\
  \ 15.1 中。\n\n| `LC_ALL` | 此类别包含所有可能的区域信息。它由表中的其余项目组成。 |\n| `LC_COLLATE` | 用于字符串排序（稍后将讨论）和正则表达式范围的类别。\
  \ |\n| `LC_CTYPE` | 用于字符分类（大写、小写等）的类别。这会影响正则表达式的匹配和 ``<ctype.h>`` 中的 `is-XXX()`\
  \ 函数。它也是用于字符编码的类别，无论字符集是否包含多字节字符。 |\n| `LC_MESSAGES` | 用于区域特定消息的类别。该类别在章稍后讨论的 GNU\
  \ `gettext` 中生效。（此未在 C 标准中提及。） |\n| `LC_MONETARY` | 用于格式化货币信息的类别，例如本地货币的本地和国际符号（例如，美元的\
  \ `$` 与 `USD`）、如何格式化负值等。 |\n| `LC_NUMERIC` | 用于格式化数值的类别。某些程序员选择与其他值值设置此值，以便强制将‘`.`’\
  \ 作为小数点，而不是区域中可能指定的符号（某些区域使用逗号）。 |\n| `LC_TIME` | 用于格式化日期和时间的类别。 |\n\n**表 15.1：在\
  \ ``<locale.h>` 中定义的 ISO C 区域类别常量**\n\n这些类别是由各种标准定义的。某些系统可能支持额外的类别，如 `LC_TELEPHONE`\
  \ 或 `LC_ADDRESS`。然而，这些并不是标准化的；任何需要使用它们但仍需要可移植的程序都应该使用 `#ifdef` 来封装相关部分。\n\n默认情况下，C\
  \ 程序和 C 标准库的行为就像它们处于 `\"C\"` 或 `\"POSIX\"` 区域一样，以提供与历史系统行为的性。然而，通过调用 `setlocale()`（如下一节所述），程序可以启用区域感知。一旦程序执行了此操作，用户就可以通过设置环境变量来启用或禁用程序将拥有的区域功能程度。\n\
  \n环境变量名称与表 15.1 中列出的区域类别名称相同。因此，命令\n\n```\nexport LC_NUMERIC=en_DK.utf8 LC_TIME=C\n\
  ```\n\n指定数字应该根据 `\"en_DK.utf8\"`（丹麦的英语）区域打印，但日期和时间值应该按照标准的 `\"C\"` 区域打印。（这个示例仅说明了你*可以*为不同的类别指定不同的区域；这不一定是你*应该*做的事情。）\n\
  \n环境变量 `LC_ALL` 会覆盖所有其他 `LC_xxx` 变量。如果未设置 `LC_ALL`，则库会查找特定的变量（`LC_CTYPE`、`LC_MONETARY`\
  \ 等）。最后，如果这些都没有设置，库会查找变量 `LANG`。这里有一个打印数字和当天时间的小型演示：\n\n```\n$ unset LC_ALL LANG\
  \                                 移除默认变量\n$ ch-i18n-locale-demo                \
  \               打印数字、当前日期、时间\n1.234 = 1.234\n现在是：Thu May 8 18:10:34 2025\n$ export\
  \ LC_NUMERIC=en_DK.utf8 LC_TIME=C            欧洲数字、默认日期、时间\n$ ch-i18n-locale-demo\
  \                               打印数字、当前日期、时间\n1.234 = 1,234\n现在是：Thu May 8 18:10:55\
  \ 2025\n$ export LC_NUMERIC=it_IT.utf8 LC_TIME=it_IT.utf8   意大利数字、日期、时间\n$ ch-i18n-locale-demo\
  \                               打印数字、当前日期、时间\n1.234 = 1,234\n现在是：gio 8 mag 2025,\
  \ 18:13:44\n$ export LC_ALL=C                                   设置覆盖变量\n$ ch-i18n-locale-demo\
  \                               打印数字、当前日期、时间\n1.234 = 1.234\n现在是：Thu May 8 18:10:34\
  \ 2025\n```\n\n我们稍后会展示 `ch-i18n-locale-demo` 的代码：\n\n### 15.2.2 设置区域：`setlocale()`\n\
  \n默认情况下，C 程序和 C 标准库的行为就像处于 `\"C\"` 或 `\"POSIX\"` 区域一样，以提供与历史系统的兼容性。然而，通过调用 `setlocale()`（如下一节所述），程序可以启用区域感知。一旦程序执行了此操作，用户就可以通过设置环境变量来启用或禁用程序将拥有的区域功能程度。\n\
  \n环境变量名称与表 15.1 中列出的区域类别名称相同。因此，命令\n\n```\nexport LC_NUMERIC=en_DK.utf8 LC_TIME=C\n\
  ```\n\n指定数字应该根据 `\"en_DK.utf8\"`（丹麦的英语）区域打印，但日期和时间值应该按照标准的 `\"C\"` 区域打印。（这个示例仅说明了你*可以*为不同的类别指定不同的区域；这不一定是你*应该*做的事情。）\n\
  \n环境变量 `LC_ALL` 会覆盖所有其他 `LC_xxx` 变量。如果未设置 `LC_ALL`，则库会查找特定的变量（`LC_CTYPE`、`LC_MONETARY`\
  \ 等）。最后，如果这些都没有设置，库会查找变量 `LANG`。这里有一个打印数字和当天时间的小型演示：\n\n```\n$ unset LC_ALL LANG\
  \                                 移除默认变量\n$ ch-i18n-locale-demo                \
  \               打印数字、当前日期、时间\n1.234 = 1.234\n现在是：Thu May 8 18:10:34 2025\n$ export\
  \ LC_NUMERIC=en_DK.utf8 LC_TIME=C            欧洲数字、默认日期、时间\n$ ch-i18n-locale-demo\
  \                               打印数字、当前日期、时间\n1.234 = 1,234\n现在是：Thu May 8 18:10:55\
  \ 2025\n$ export LC_NUMERIC=it_IT.utf8 LC_TIME=it_IT.utf8   意大利数字、日期、时间\n$ ch-i18n-locale-demo\
  \                               打印数字、当前日期、时间\n1.234 = 1,234\n现在是：gio 8 mag 2025,\
  \ 18:13:44\n$ export LC_ALL=C                                   设置覆盖变量\n$ ch-i18n-locale-demo\
  \                               打印数字、当前日期、时间\n1.234 = 1.234\n现在是：Thu May 8 18:10:34\
  \ 2025\n```\n\n一旦你，作为程序作者，调用 `setlocale()` 且 `category` 参数为 `LC_CTYPE` 或 `LC_ALL`\
  \ 时，请注意你可能需要处理多字节字符问题，正如本章稍后讨论的那样。\n\n\n\n\n\n这里是我们之前运行的 `ch-i18n-locale-demo.c`\
  \ 代码：\n\n```\n 1  /* ch-i18n-locale-demo.c --- 演示不同的区域格式化 */\n 2\n 3  #include <stdio.h>\n\
  \ 4  #include <locale.h>\n 5  #include <stdlib.h>\n 6  #include <time.h>\n 7\n 8\
  \  /* main --- 设置区域，显示某些差异 */\n 9\n10  int\n11  main(int argc, char **argv)\n12\
  \  {\n13      char buf[BUFSIZ];\n14      time_t now;\n15\n16      setlocale(LC_ALL,\
  \ \"\");\n17      printf(\"1.234 = %g\\n\", 1.234);\n18\n19      time(& now);\n\
  20      struct tm *the_time = localtime(& now);\n21      strftime(buf, sizeof buf,\
  \ \"%c\", the_time);\n22      printf(\"It is now: %s\\n\", buf);\n23\n24      return\
  \ EXIT_SUCCESS;\n25  }\n```\n\n最后，某些旧版本的 GLIBC 将 `setlocale()` 的返回值存储在由 `malloc()`\
  \ 分配的内存中。如果你没有将返回值保存到全局变量、`static` 变量或 `main()` 的局部变量中，那么从技术上说这会导致内存泄漏，可能会被如 `Valgrind`\
  \ 等工具报告（将在书中后后部分讨论；参见 第 17.6.1 节，“Valgrind: 一种功能强大的工具”、“第 634 页”）。你并不真的需要担心这种泄漏，但如果你收到了相关的\
  \ bug 报告，至少你会知道发生了什么。\n\n## 15.2.3 字符串排序：`strcoll()` 和 `strxfrm()`\n\n熟悉的 `strcmp()`\
  \ 函数比较两个字符串，如果第一个字符串小于、等于或大于第二个字符串，则返回负值、零或正值。这种比较是基于机器字符集中字符的数值的。正如此，`strcmp()`\
  \ 的结果永远不变。\n\n然而，在感知区域的世界中，简单的数值比较是不够的。每个区域都定义了内部字符的*排序序列*——也就是说，字符在区域内的相对顺序。例如，在简单的七位\
  \ ASCII 中，字符 `A` 和 `a` 的十进制数值分别为 65 和 97。因此，在片段中：\n\n```\nint i = strcmp(\"A\",\
  \ \"a\");\n```\n\n`i` 为负值。然而，在 `\"en_US.UTF-8\"` 区域中，`A` 在 `a` 之后而不是之前。因此，对于需要感知区域的应用程序使用\
  \ `strcmp()` 是一个坏主意；我们可以说它返回了一个忽略区域的答案。\n\n`strcoll()`（字符串排序）函数用于以感知区域的方式比较字符串：\n\
  \n```\n#include <string.h>                                                 ISO C\n\
  \nint strcoll(const char *s1, const char *s2);\n```\n\n它的返回值与 `strcmp()` 相同，均为负/零/正值。以下程序\
  \ `ch-i18n-compare.c` 交互式地演示了差异：\n\n```\n 1  /* ch-i18n-compare.c --- 演示 strcmp()\
  \ 与 strcoll() */ */\n 2\n 3  #include <stdio.h>\n 4  #include <stdlib.h>\n 5  #include\
  \ <locale.h>\n 6  #include <string.h>\n 7\n 8  int\n 9  main(void)\n10  {\n11  #define\
  \ STRBUFSIZE 1024\n12      char locale[STRBUFSIZE], curloc[STRBUFSIZE];\n13    \
  \  char left[STRBUFSIZE], right[STRBUFSIZE];\n14      char buf[BUFSIZ];\n15    \
  \  int count;\n16\n17      setlocale(LC_ALL, \"\");              /* 设置环境变量区域 */\n\
  18      strcpy(curloc, setlocale(LC_ALL, NULL));    /* 保存它 */\n19\n20      printf(\"\
  --> \"); fflush(stdout);\n21      while (fgets(buf, sizeof buf, stdin) != NULL)\
  \ {\n22          locale[0] = '\\0';\n23          count = sscanf(buf, \"%s %s %s\"\
  , left, right, locale);\n24          if (count < 2)\n25              break;\n26\n\
  27          if (*locale) {\n28              setlocale(LC_ALL, locale);\n29     \
  \         strcpy(curloc, locale);\n30          }\n31\n32          printf(\"%s: strcmp(\\\
  \"%s\\\", \\\"%s\\\") is %d\\n\", curloc, left,\n33                  right, strcmp(left,\
  \ right));\n34          printf(\"%s: strcoll(\\\"%s\\\", \\\"%s\\\") is %d\\n\"\
  , curloc, left,\n35                  right, strcoll(left, right));\n36\n37     \
  \     printf(\"\\n--> \"); fflush(stdout);\n38       }\n39\n40       exit(EXIT_SUCCESS);\n\
  41  }\n```\n\n该程序以交互式的方式演示了差异：\n\n该程序从环境变量区域开始。`curloc` 存储了区域。`left` 和 `right` 是用于比较的字符串。`buf`\
  \ 用于读取输入。`count` 用于计数。`setlocale(LC_ALL, \"\")` 设置为环境区域。`strcpy(curloc, setlocale(LC_ALL,\
  \ NULL))` 保存了它。`printf(\"--> \"); fflush(stdout);` `while (fgets(buf, sizeof buf,\
  \ stdin) != NULL)` 循环读取输入。`locale[0] = '\\0';` 初始化。`count = sscanf(buf, \"%s %s\
  \ %s\", left, right, locale);` 解析输入。`if (count < 2)` 退出循环。`if (*locale)` 如果区域存在，则\
  \ `setlocale(LC_ALL, locale)` 设置区域，`strcpy(curloc, locale)` 更新 `curloc`。`printf(\"\
  %s: strcmp(\\\"%s\\\", \\\"%s\\\") is %d\\n\", curloc, left, right, strcmp(left,\
  \ right));` 打印 `strcmp` 结果，它的结果是忽略区域的。`printf(\"%s: strcoll(\\\"%s\\\", \\\"%s\\\
  \") is %d\\n\", curloc, left, right, strcoll(left, right));` 打印 `strcoll` 结果。`printf(\"\
  \\n--> \"); fflush(stdout);` 打印提示符。`exit(EXIT_SUCCESS);` 退出。\n\n```\n$ ch-i18n-compare\n\
  --> ABC a C\nC: strcmp(\"A\", \"a\") is -1\nC: strcoll(\"A\", \"a\") is -1\n-->\
  \ ABC a en_US.UTF-8\nen_US.UTF-8: strcmp(\"A\", \"a\") is -1\nen_US.UTF-8: strcoll(\"\
  A\", \"a\") is 1\n--> ABC a de_DE.UTF-8\nde_DE.UTF-8: strcmp(\"A\", \"a\") is -1\n\
  de_DE.UTF-8: strcoll(\"A\", \"a\") is 1\n--> ABC a tr_TR.UTF-8\ntr_TR.UTF-8: strcmp(\"\
  A\", \"a\") is -1\ntr_TR.UTF-8: strcoll(\"A\", \"a\") is 1\n--> ABC a sv_SE.UTF-8\n\
  sv_SE.UTF-8: strcmp(\"A\", \"a\") is -1\nsv_SE.UTF-8: strcoll(\"A\", \"a\") is 1\n\
  --> a b en_US.UTF-8\nen_US.UTF-8: strcmp(\"a\", \"b\") is -1\nen_US.UTF-8: strcoll(\"\
  a\", \"b\") is -1\n```\n\n在 `C` 区域中，`A` 在 `a` 之前，因此 `strcmp` 返回负值。`strcoll` 也返回负值。\n\
  \n```\n--> ABC a en_US.UTF-8\nen_US.UTF-8: strcmp(\"A\", \"a\") is -1\nen_US.UTF-8:\
  \ strcoll(\"A\", \"a\") is 1\n--> ABC a de_DE.UTF-8\nde_DE.UTF-8: strcmp(\"A\",\
  \ \"a\") is -1\nde_DE.UTF-8: strcoll(\"A\", \"a\") is 1\n--> ABC a tr_TR.UTF-8\n\
  tr_TR.UTF-8: strcmp(\"A\", \"a\") is -1\ntr_TR.UTF-8: strcoll(\"A\", \"a\") is 1\n\
  --> ABC a sv_SE.UTF-8\nsv_SE.UTF-8: strcmp(\"A\", \"a\") is -1\nsv_SE.UTF-8: strcoll(\"\
  A\", \"a\") is 1\n--> a b en_US.UTF-8\nen_US.UTF-8: strcmp(\"a\", \"b\") is -1\n\
  en_US.UTF-8: strcoll(\"a\", \"b\") is -1\n```\n\n在 `en_US.UTF-8` 区域中，`A` 在 `a` 之后，因此\
  \ `strcoll` 返回正值，而 `strcmp` 返回负值。\n\n该程序清楚地演示了 `strcmp()` 和 `strcoll()` 之间的差异。由于\
  \ `strcmp()` 根据数值工作，它的结果总是恒定的。`strcoll()` 理解排序，其结果随区域而变化。我们在 `en_US.utf8` 区域看到，大写字母在小写字母之后。\n\
  \n### 注意\n\n区域特定的排序在正则表达式的匹配中也是一个问题。正则表达式允许字符范围，例如 `[a-z]`。这种构造的精确含义（包含起始和结束点）仅针对\
  \ `\"C\"` 和 `\"POSIX\"` 区域定义。\n\n对于非 ASCII 区域，如 `[a-z]` 范围也可以匹配大写字母，而不只是小写字母！\n\n\
  长期的可移植解决方案是使用 POSIX 字符类，例如 `[:lower:]]` 和 `[:punct:]`。如果你发现在需要在感知区域系统和旧系统上使用范围表达式，但不想更改程序，解决方案是暴力地在括号内列出每个字符。这并不美观，但有效。\n\
  \n在 GNU 世界，在使范围表现合理方面已取得一些进展。更多信息，请参阅 GNU `awk` 手册中关于范围的讨论。(2)\n\n^(2) [`https://www.gnu.org/software/gawk/manual/html_node/Ranges-and-Locales.html`](https://www.gnu.org/software/gawk/manual/html_node/Ranges-and-Locales.html)\n\
  \n基于区域的排序可能是昂贵的。如果你预计将进行大量的比较，其中至少一个字符串不会改变，或者字符串值之间将多次比较（例如在对列表中），那么你应该考虑使用 `strxfrm()`\
  \ 函数将你的字符串转换为可以使用 `strcmp()` 的版本。其原理是 `strxfrm()` 转换 `src` 的前 `n` 个字符，并将其放入 `dest`\
  \ 中。返回值是存储转换后的字符所需的字节数。如果多于 `n`，则 `dest` 的内容是“未指定的”。\n\n\n\n\n\nPOSIX 标准显式允许 `n`\
  \ 为 0 且 `dest` 为 `NULL`。在这种情况下，`strxfrm()` 返回存储 `src` 的转换版本所需的数组大小（不包括最后的 `’\\0’`\
  \ 字符）。推测，该值随后将用于 `malloc()` 来创建 `dest` 数组，或者用于与预定义的数组边界进行大小检查。（显然，在执行此操作时`src` 必须有一个终止的零字节）。此片段说明了如何使用\
  \ `strxfrm()`：\n\n```\n#define STRBUFSIZE ...\nchar s1[STRBUFSIZE], s2[STRBUFSIZE];\
  \                原始字符串\nchar s1x[STRBUFSIZE], s2x[STRBUFSIZE];              转换后的副本\n\
  size_t len1, len2;\nint cmp;\n… 填充 s1 和 s2 …\nlen1 = strlen(s1);\nlen2 = strlen(s2);\n\
  \nif (strxfrm(s1x, s1, len1) >= STRBUFSIZE || strxfrm(s2x, s2, len2) >= STRBUFSIZE)\n\
  \    /* 太大了，恢复 */\n\ncmp = strcmp(s1x, s2x);\nif (cmp == 0)\n    /* 相等 */\nelse\
  \ if (cmp < 0)\n    /* s1 < s2 */\nelse\n    /* s1 > s2 */\n```\n\n对于一次性比较，直接使用\
  \ `strcoll()` 可能更快。但如果字符串将进行多次比较，先使用一次 `strxfrm()` 然后对转换后的值使用 `strcmp()` 会更快。\n\n\
  没有与 `strncmp()` 或 `strcasecmp()` 对应的区域感知对排序函数。\n\n## 15.2.4 低级数值和货币格式化：`localeconv()`\n\
  \n正确地格式化数值和货币值需要大量的底层信息。这些信息可以在 `struct lconv` 中找到，该结构通过 `localeconv()` 函数获取：\n\n\
  ```\n#include <locale.h>                                           ISO C\n\nstruct\
  \ lconv *localeconv(void);\n```\n\n与 `ctime()` 函数类似，此函数返回一个指向内部 `static` 数据的指针。你应该对返回的数据进行拷贝，因为如果区域发生了变化，后续调用可能会返回不同的值。以下是直接来自\
  \ GLIBC 的 `<locale.h>` 中的 `struct lconv`（略有压缩）：\n\n```\nstruct lconv {\n  /* 数值（非货币）信息。\
  \  */\n  char *decimal_point;          /* 小数点字符。  */\n  char *thousands_sep;   \
  \       /* 千位分隔符。  */\n  /* 每个元素是每组的位数；\n     索引越高的元素越靠左。\n     值为 CHAR_MAX 的元素意味着不再进行进一步分组。\n\
  \     值为 0 的元素意味着上一个元素被用于\n     所有左侧的组。  */\n  char *grouping;\n  /* 货币信息。  */\n\
  \  /* 前三个字符是 ISO 4217 货币符号。\n     第四个字符是分隔符。第五个字符是 '\\0'。  */\n  char *int_curr_symbol;\n\
  \  char *currency_symbol;        /* 本地货币符号。  */\n  char *mon_decimal_point;    \
  \  /* 小数点字符。  */\n  char *mon_thousands_sep;      /* 千位分隔符。  */\n  char *mon_grouping;\
  \           /* 类似于'grouping' 元素（上）。  */\n  char *positive_sign;          /* 正值的符号。\
  \  */\n  char *negative_sign;          /* 负值的符号。  */\n  char int_frac_digits;  \
  \       /* 国际小数位数。  */\n  char frac_digits;             /* 本地小数位数。  */\n  /* 如果\
  \ currency_symbol 位于正值之前为 1，在之后为 0。  */\n  char p_cs_precedes;\n  /* 如果有空格分隔 currency_symbol\
  \ 和正值，则为 1。  */\n  char p_sep_by_space;\n  /* 如果 currency_symbol 位于负值之前为 1，在之后为\
  \ 0.  */\n  char n_cs_precedes;\n  /* 如果有空格分隔 currency_symbol 和负值，则为 1。  */\n  char\
  \ n_sep_by_space;\n  /* 正、负号符号的位置：\n     0 括号包围数量和 currency_symbol。\n     1 符号字符串位于数量和\
  \ currency_symbol 之前。\n     2 符号字符串位于数量和 currency_symbol 之后。\n     3 符号字符串紧邻 currency_symbol\
  \ 之前。\n     4 符号字符串紧邻 currency_symbol 之后。  */\n  char p_sign_posn;\n  char n_sign_posn;\n\
  \  /* 如果 int_curr_symbol 位于正值之前为 1，在之后为 0。  */\n  char int_p_cs_precedes;\n  /*\
  \ 如果有空格分隔 int_curr_symbol 和正值，则为 1。  */\n  char int_p_sep_by_space;\n  /* 如果 int_curr_symbol\
  \ 位于负值之前为 1，在之后为 0。  */\n  char int_n_cs_precedes;\n  /* 如果有空格分隔 int_curr_symbol\
  \ 和负值，则为 1。  */\n  char int_n_sep_by_space;\n  /* 正、负号符号的位置：\n     0 括号包围数量和 int_curr_symbol。\n\
  \     1 符号字符串位于数量和 int_curr_symbol 之前。\n     2 符号字符串位于数量和 int_curr_symbol 之后。\n\
  \     3 符号字符串紧邻 int_curr_symbol 之前。\n     4 符号字符串紧邻 int_curr_symbol 之后。  */\n  char\
  \ int_p_sign_posn;\n  char int_n_sign_posn;\n};\n```\n\n注释使得情况变得相当明了。让我们来看 `struct\
  \ lconv` 中的前几个字段：\n\n*   `decimal_point`: 要使用的小数点字符。在美国和其他英语国家，它是句点，但许多国家使用逗号。\n\
  *   `thousands_sep`: 用于分隔数值中每三位数字的字符。\n*   `grouping`: 一个单字节整数值数组。每个元素指示分组的位数。正如注释所，`CHAR_MAX`\
  \ 意味着不进行进一步分组，`0` 意味着重用上一个元素（我们将在本章后面显示示例代码）。\n*   `int_curr_symbol`: 这是来自 ISO 4217\
  \ 的国际符号。\n*   `currency_symbol`: 这是本地货币符号。\n*   `mon_decimal_point`: 这是小数点字符。\n\
  *   `mon_thousands_sep`: 这是千位分隔符。\n*   `mon_grouping`: 类似于上方的 `grouping` 元素。\n*\
  \   `positive_sign`: 正值的符号。\n*   `negative_sign`: 负值的符号。\n\n其余的大部分值对日常编程没有用处。以下程序\
  \ `ch-i18n-lconv.c` 打印了这些值中的一些，让你对可用内容有一个了解：\n\n```\n#include <stdio.h>\n#include\
  \ <stdlib.h>\n#include <limits.h>\n#include <locale.h>\n\nint\nmain(void)\n{\n \
  \   struct lconv l;\n    int i;\n\n    setlocale(LC_ALL, \"\");\n    l = *localeconv();\n\
  \    printf(\"decimal_point = [%s]\\n\", l.decimal_point);\n    printf(\"thousands_sep\
  \ = [%s]\\n\", l.thousands_sep);\n\n    for (i = 0; l.grouping[i] != 0 && l.grouping[i]\
  \ != CHAR_MAX; i++)\n        printf(\"grouping[%d] = [%d]\\n\", i, l.grouping[i]);\n\
  \n    printf(\"int_curr_symbol = [%s]\\n\", l.int_curr_symbol);\n    printf(\"currency_symbol\
  \ = [%s]\\n\", l.currency_symbol);\n    printf(\"mon_decimal_point = [%s]\\n\",\
  \ l.mon_decimal_point);\n    printf(\"mon_thousands_sep = [%s]\\n\", l.mon_thousands_sep);\n\
  \    printf(\"positive_sign = [%s]\\n\", l.positive_sign);\n    printf(\"negative_sign\
  \ = [%s]\\n\", l.negative_sign);\n\n    return EXIT_SUCCESS;\n}\n```\n\n当使用不同的区域设置运行时，我们意料之中地得到了不同的结果：\n\
  \n```\n$ LC_ALL=en_US.utf8 ch-i18n-lconv  美国区域的结果\ndecimal_point = [.]\nthousands_sep\
  \ = [,]\ngrouping[0] = [3]\ngrouping[1] = [3]\nint_curr_symbol = [USD ]\ncurrency_symbol\
  \ = [$]\nmon_decimal_point = [.]\nmon_thousands_sep = [,]\npositive_sign = []\n\
  negative_sign = [-]\n\n$ LC_ALL=itI_T.utf8 ch-i18n-lconv  意大利区域的结果\ndecimal_point\
  \ = [,]\nthousands_sep = [.]\ngrouping[0] = [3]\ngrouping[1] = [3]\nint_curr_symbol\
  \ = [EUR ]\ncurrency_symbol = [€]\nmon_decimal_point = [,]\nmon_thousands_sep =\
  \ [.]\npositive_sign = []\nnegative_sign = [-]\n```\n\n注意这两个区域设置中的 `int_curr_symbol`\
  \ 值都包含一个尾随空格字符，用于分隔符号与随后的货币值。\n\n## 15.2.5 高级数值和货币格式化：`strfmon()` 和 `printf()`\n\
  \n\n\n\n\n在查看了 `struct lconv` 中的所有字段后，你可能会想：“为了格式化一个货币值，我*真的*必须弄清楚如何使用所有信息吗？”幸运的是，答案是否定的。`strfmon()`\
  \ 函数已经为你完成了所有工作：\n\n我们和你一样高兴，因为我们不需要提供使用这个……呃，全功能 `struct` 的示例代码了。\n\n```c\n#include\
  \ <monetary.h>                                              POSIX\n\nssize_t strfmon(char\
  \ *s, size_t max, const char *format, ...);\n```\n\n该例程类似于 `strftime()`（参见第 6.1.3.2\
  \ 节“复杂时间格式：`strftime()`, 第 160 页”），使用 `format` 将字面量字符和格式化的数字值复制到 `s` 中，存入不超过 `max`\
  \ 个字符。下面的简单的程序 `ch-i18n-strfmon.c` 展示了 `strfmon()` 的工作原理：\n\n```c\n/* ch-i18n-strfmon.c\
  \ --- demonstrate strfmon() */\n\n#include <stdio.h>\n#include <stdlib.h>\n#include\
  \ <locale.h>\n#include <monetary.h>\n\nint\nmain(void)\n{\n    char buf[BUFSIZ];\n\
  \    double val = 1234.567;\n\n    setlocale(LC_ALL, \"\");\n    strfmon(buf, sizeof\
  \ buf, \"You owe me %n (%i)\\n\", val, val);\n\n    fputs(buf, stdout);\n    return\
  \ EXIT_SUCCESS;\n}\n```\n\n在两个不同的 locale 下运行时，它产生如下输出：\n\n```\n$ LC_ALL=en_US.utf8\
  \ ch-i18n-strfmon      In the United States\nYou owe me $1,234.57 (USD 1,234.57)\n\
  $ LC_ALL=fr_FR.utf8 ch-i18n-strfmon      In France\nYou owe me 1 234,57 € (1 234,57\
  \ EUR)\n```\n\n如你所见，`strfmon()` 就像 `strftime()`，将普通字符原封地复制到目标缓冲区，并根据自己的格式规范对参数进行格式化。只有三个：\n\
  \n| | |\n|---|||\n| `%n` | 打印货币值的国家（即本地）形式。 |\n| `%i` | 打印货币值的国际形式。 |\n| `%%` |\
  \ 打印字面量 `%` 字符。 |\n\n要格式化的值必须是 `double` 类型（尽管在作用域内有原型的情况下，其他数值类型的变量将被适当转换为 `double`）。我们在\
  \ `\"en_US.utf8\"` locale 中看到了 `%n` 和 `%i` 的区别：`%n` 使用 `$` 字符，而 `%i` 使用 `USD`，代表“美元”。\n\
  \n灵活性——以及随某种程度的复杂性——伴随着许多为 POSIX 开发的 API 出现，`strfmon()` 也不例外。与 `printf()` 一样，在 `%`\
  \ 和 `i` 或 `n` 之间出现的几个可选项目提供了更强的控制。其完整形式如下：\n\n```\n%[ flags ][ field width ][# left-\
  \ prec ][. right-prec ]i\n%[ flags ][ field width ][# left- prec ][. right-prec\
  \ ]n\n%%                            No flag, field width, etc. allowed\n```\n\n\
  标志列在表 15.2 中。\n\n| 标志 | 含义 |\n|---|---|\n| `=` *c* | 使用单字节字符 *c* 作为数字填充字符，用于左精度。默认填充字符是空格。常见的备用填充字符是\
  \ `0`。 |\n| `^` | 禁用分组字符的使用（例如美国使用的逗号）。 |\n| `(` | 用括号括起负金额。与 `+` 标志互斥。 |\n| `+`\
  \ | 正常处理正值/负值。使用 locale 的正号和负号。与 `(` 标志互斥。 |\n| `!` | 不包含货币符号。如果你希望使用 `strfmon()`\
  \ 对普通数字获得比 `sprintf()` 提供的更灵活的格式化，则此标志非常有用。 |\n| `-` | 结果左对齐。默认是右对齐。在没有字段宽度的情况下，此标志无效。\
  \ |\n\n**表 15.2：** `strfmon()` 的标志。\n\n字段宽度是一个进制数字字符串，提供最小宽度。默认是根据规范的其他部分使用尽可能多的字符。小于字段宽度的值将在左侧填充空格（如果给了\
  \ `-` 标志则在右侧填充）。\n\n左精度由一个 `#` 字符和一个进制数字字符串组成。它表示小数点左侧出现的最小位数；如果转换后的值小于此值，则结果用空格填充。右精度由一个\
  \ `.` 字符和一个进制数字字符串组成。它表示要舍入到位数。\n\n### 15.2.6 示例：在 `gawk` 中格式化数值\n\n`gawk` 实现了它自己的\
  \ `printf()` 和 `sprintf()` 函数。为了完全的 locale 感知，`gawk` 必须像 C 一样支持 `'` 标志。以下来自 gawk\
  \ 5.3.0 中 `builtin.c` 文件的片段展示了 `gawk` 如何使用 `struct lconv`：\n\n```\n\n1  case 'd':\n\
  \ 2  case 'i':\n 3      ...\n 4  #if defined(HAVE_LOCALE_H)\n 5      quote_flag\
  \ = (quote_flag && loc.thousands_sep[0] != 0);\n 6  #endif\n 7      ...\n 8    \
  \  ii = jj = 0;\n 9      do {\n10           PREPEND(*chp);\n11           chp--;\
  \ i--;\n12   #if defined(HAVE_LOCALE_H)\n13           if (quote_flag && loc.grouping[ii]\
  \ && ++jj == loc.grouping[ii]) {\n14               if (i) {    /*仅在还有更多数字时添加 */\n\
  15                   int k;\n16                   const char *ts = loc.thousands_sep;\n\
  17\n18                   for (k = strlen(ts) - 1; k >= 0; k--) {\n19           \
  \            PREPEND(ts[k]);\n20                   }\n21               }\n22   \
  \            if (loc.grouping[ii+1] == 0)\n23                   jj = 0;     /* 继续使用\
  \ loc.grouping[ii] 中的当前值 */\n24               else if (loc.grouping[ii+1] == CHAR_MAX)\n\
  25                   quote_flag = false;\n26               else {\n27          \
  \         ii++;\n28                   jj = 0;\n29              }\n30           }\n\
  31   #endif\n32       } while (i > 0);\n```\n\n（行号相对于片段的开始处。）省略了部分与讨论无关的代码部分，以便于关注重要的部分。\n\
  \n\n\n\n待格式化的整数值首先被正常地格式化到一个单独的缓冲区。字符指针 `chp` 被设置为指向缓冲区的最后一个字符。这部分代码没有显示。\n\n在第\
  \ 16–19 行使用的变量 `loc` 是一个 `struct lconv` 结构体。它在 `main()` 中初始化。我们在这里感兴趣的是 `loc.thousands_sep`（它是千分位分隔符）以及\
  \ `loc.grouping`（它是一个描述分隔符之间数字个数的数组）。元素 0 表示“对所有后续数字使用上一个元素的值”，而值 `CHAR_MAX` 则表示“停止插入千分位分隔符”。\n\
  \n介绍完毕，让我们来看代码。`ii` 和 `jj` 分别用于跟踪 `loc.grouping` 中的位置以及当前组中已转换的数字个数。^(5)\n\n^(5)\
  \ 我们可能应该选择比简单的 `ii` 和 `jj` 更具描述性的名称。由于使用这些变量的代码很短，我们想象力的匮乏并不是一个严重问题。\n\n当转换规范中出现\
  \ `'` 字符时，`quote_flag` 为真。第 4–6 行验证了区域（locale）是否具有千分位分隔符；如果没有，则无需尝试用它来格式化值。\n\n\
  `do`-while` 循环反向生成数字字符，从后向向前填充缓冲区。当前数字在第 10 行被添加到缓冲区。\n\n第 12–31 行是我们感兴趣的部分。工作仅在支持区域的系统上进行，这从\
  \ `<locale.h>` 头文件的存在可以看出来。在这样的系统上，符号常量 `HAVE_LOCALE_H` 将为真。^(6)\n\n^(6) 这一值由 Autoconf\
  \ 和 Automake 机制设置。Autoconf 和 Automake 是强大的软件套件，它们能够以系统化的方式支持广泛的 Unix 系统。\n\n当第 13\
  \ 行的条件为真时，该是添加千分位分隔符了。这个条件用英文可以读作：“如果请求分组，*且* `loc.grouping` 中的当前位置显示了分组数量，*且*当前数字计数等于分组数量。”如果该条件为真，第\
  \ 14–20 行将添加千分位分隔符。如果千分位分隔符包含多个字符，则将反向处理并添加到缓冲区。\n\n一旦 `loc.grouping` 中的当前位置被使用，第\
  \ 22–29 行将向前查看下一个位置的值。如果是 `0`，则应继续使用当前位置的值。我们通过将 `jj` 重置为 `0`（第 23 行）来指定。另一方面，如果下一个位置是\
  \ `CHAR_MAX`，则不应再进行分组，第 25 行通过将 `quote_flag` 设置为 `false` 完全关闭它。否则，下一个值是一个分组值，因此第\
  \ 27 行增加 `ii`，第 28 行将 `jj` 重置为 `0`。\n\n这是底层的详细代码。然而，一旦你理解了 `struct lconv` 中的信息是如何呈现的，代码就很易读（而且写起来也很简单）。\n\
  \n### 15.2.7 格式化日期和时间值：`ctime()` 和 `strftime()`\n\n章节 6.1，“时间与日期”，第 155 页描述了获取和格式化时间和日期值的函数。如果正确调用了\
  \ `setlocale()`，`strftime()` 函数也是区域感知的。下面的程序 `ch-i8n-times.c` 展示了这一点：\n\n```c\n\
  /* ch-i8n-times.c --- 基于区域的时间 */\n\n#include <stdio.h>\n#include <stdlib.h>\n#include\
  \ <locale.h>\n#include <time.h>\n\nint\nmain(void)\n{\n    char buf[100];\n    time_t\
  \ now;\n    struct tm *curtime;\n    setlocale(LC_ALL, \"\");\n    time(& now);\n\
  \    curtime = localtime(& now);\n    (void) strftime(buf, sizeof buf,\n       \
  \     \"It is now %A, %B %d, %Y, %I:%M %p\", curtime);\n\n    printf(\"%s\\n\",\
  \ buf);\n\n    printf(\"ctime() says: %s\", ctime(& now));\n\n    exit(EXIT_SUCCESS);\n\
  }\n```\n\n运行程序时，我们看到 `strftime()` 的结果确实不同，而 `ctime()` 的结果没有：\n\n```bash\n$ LC_ALL=en_US.utf8\
  \ ch-i8n-times                   Time in United States\nIt is now Tuesday, May 27,\
  \ 2025, 02:23 PM\nctime() says: Tue May 27 14:23 2025\n\n$ LC_ALL=fr_FR.utf8 ch-i8n-times\
  \                   Time in France\nIt is now mardi, mai 27, 2025, 02:23\nctime()\
  \ says: Tue May 27 14:23 2025\n```\n\n差异差异是因为 `ctime()` 和 `asctime()` 是遗留接口。`strftime()`\
  \ 作为为 C90 开发的更新接口，是区域感知的。\n\n### 15.2.8 其他区域信息：`nl_langinfo()`\n\n尽管我们之前说 `catgets()`\
  \ API 很难用，但其中一部分非常有用：`nl_langinfo()`。它提供了 `struct lconv` 之外的区域相关信息：\n\n```c\n#include\
  \ <langinfo.h>                                          POSIX\n\nchar *nl_langinfo(nl_item\
  \ item);\n```\n\n`nl_item` 类型可能是 `int` 或 `enum`。`item` 参数是 `<langinfo.h>` 中定义的符号常量。返回值是一个可以直接使用或作为\
  \ `strftime()` 格式字符串的字符串。\n\n可用信息来自多个区域类别。表 15.3 列出了常量、对应的区域类别以及项目的含义。\n\n| **项目名称\
  \ (Item name)** | **类别 (Category)** | **含义 (Meaning)** |\n| --- | --- | --- |\n\
  | `ABDAY_1`, …, `ABDAY_7` | `LC_TIME` | 星期期的缩写。星期一为 1。 |\n| `ABMON_1`, …, `ABMON_12`\
  \ | `LC_TIME` | 月份的缩写。 |\n| `ALTMON_1`, …, `ALTMON_12` | `LC_TIME` | 月份的备用名称，稍后描述。\
  \ |\n| `ALT_DIGITS` | `LC_TIME` | 数字的备用符号，稍后描述。 |\n| `AM_STR`, `PM_STR` | `LC_TIME`\
  \ | 区域的 a.m./p.m. 表示法。 |\n| `CODESET` | `LC_TYPE` | 区域字符集名称；即使用的字符集和编码。 |\n| `CRNCYSTR`\
  \ | `LC_MONETARY` | 货币符号，稍后描述。 |\n| `DAY_1`, …, `DAY_7` | `LC_TIME` | 星期期的名称。星期日为\
  \ 1。 |\n| `D_FMT` | `LC_TIME` | 日期格式。 |\n| `D_T_FMT` | `LC_TIME` | 日期和时间格式。 |\n\
  | `ERA_D_FMT` | `LC_TIME` | 纪元日期格式。 |\n| `ERA_T_FMT` | `LC_TIME` | 纪元日期和时间格式。 |\n\
  | `ERA_T_FMT` | `LC_TIME` | 纪元时间格式。 |\n| `ERA` | `LC_TIME` | 纪元描述段。稍后将详细描述。 |\n\
  | `MON_1`, …, `MON_12` | `LC_TIME` | 月份的名称。 |\n| `RADIXCHAR` | `LC_NUMERIC` | 基数字符。对于\
  \ 10 进制，这是小数点。 |\n| `THOUSEP` | `LC_NUMERIC` | 千分位分隔符。 |\n| `T_FMT_AMPM` | `LC_TIME`\
  \ | 带有 a.m./p.m. 表示的时间格式。 |\n| `T_FMT` | `LC_TIME` | 时间格式。 |\n| `YESEXPR`, `NOEXPR`\
  \ | `LC_MESSAGES` | 表示正、否定回答的字符串。 |\n\n**表 15.3**：`nl_langinfo()` 的项目值\n\n*纪元*（era）是一个特定的历史时期。当它涉及日期和时间时，在皇帝或王朝统治的国家最有意义。^(7)\n\
  \n^(7) 尽管美国人经常提到特定总统的时代，但它们并不像二战前的日本或共产党之前的中国那样是国家日历的正式部分。\n\nPOSIX 纪元规范可以描述公元 1\
  \ 年之前的纪元。在这种情况下，起始日期的绝对数值比结束日期大。例如，亚历山大帝的统治是从公元前 336 年到公元前 323 年。\n\n\n\n\n`nl_langinfo(ERA)`\
  \ 的返回值如果不为 `NULL`，则由一个或多个时代规范组成。每个规范之间通过 `;` 字符分隔。每个时代规范的各个组件之间通过 `:` 字符分隔。这些组件的详细描述请见表\
  \ 15.4。\n\n| **组件** | **含义** |\n| --- | --- |\n| 方向 (Direction) | 一个 `+` 或 `-` 字符。`+`\
  \ 表示该时代从数值较小的年份运行到数值较大的年份，而 `-` 表示相反。 |\n| 偏移量 (Offset) | 最接近时代起始日期的年份。 |\n| 起日期\
  \ (Start date) | 时代开始的日期，格式为 `*yyyy* `/` *mm* `/` *dd*。这些分别代表年、月、日。公元 1 年之前的年份在\
  \ *yyyy* 处使用负值。 |\n| 结束日期 (End date) | 时代结束的日期，格式相同。允许两种额外的特殊形式：`-*` 表示“时间之初”，`+*`\
  \ 表示“时间之尽”。 |\n| 时代名称 (Era name) | 时代的名称，对应 `strftime()` 的 `%EC` 转换规范。 |\n| 时代格式\
  \ (Era format) | 时代内年份的格式，对应 `strftime()` 的 `%EY` 转换规范。 |\n\n**表 15.4:** 时代规范组件\n\
  \n`ALT_DIGITS` 值也需要解释。某些 locale 提供“替代数字”（考虑阿拉伯语，它使用十进制计数系统，但数字 `0`–`9` 使用不同的形状。或者考虑一个使用罗马数字的假设性“古罗马”\
  \ locale）。这些数字出现在 `strftime()` 的各种 `%O` `c` 转换规范中。`nl_langinfo(ALT_DIGITS)` 的返回值是一个分号分隔的字符字符串列表，用于替代数字。第一个应用于\
  \ `0`，下一个用于 `1`，以此此类推。POSIX 规定可以提供最多 100 个替代符号。其目的在于，当 locale 拥有自己的计数系统时，避免限制其使用\
  \ ASCII 数字字符。\n\n类似的逻辑也适用于 `ALTMON_x` 值。\n\n最后，`nl_langinfo(CRNCYSTR)` 返回本地货币符号。返回值的第一个字符如果是\
  \ `-`、`+` 或 `.`，则指示了符号的使用方式：\n\n| `-` | 符号应该出现在数值之前。 |\n| --- | --- |\n| `+` | 符号应该出现在数值之后。\
  \ |\n| `.` | 符号应该替换基数字符（小数点）。 |\n\n## 15.3 程序消息的动态翻译\n\n我们刚刚介绍的标准 C 库接口解决了本地化问题中的简单部分。货币、数值、时间和日期值，以及字符串排序问题，都适合通过特定\
  \ locale 数据表（例如月份和星期名称列表）进行管理。\n\n然而，用户与基于文本程序的大部分交互是以程序输出的消息形式进行的，例如提示或错误消息。问题在于如何避免存在多个版本的程序，这些版本区别仅在于消息字符串的内容。GNU\
  \ 世界的事实上的解决方案是 GNU `gettext`。（GUI 程序在菜单和菜单栏项上也面临类似的问题；通常，每个主要的用户界面工具包都有自己解决该问题的方法。）\n\
  \nGNU `gettext` 允许运行时将程序消息翻译成不同的语言。在程序的代码中，这种翻译涉及几个步骤，每一步都使用不同的库函数。一旦程序本身准备就绪，几个\
  \ shell 级实用程序就可以方便不同语言的翻译准备工作。每个这样的翻译被称为*消息目录*（message catalog）。\n\n这些函数在 GLIBC\
  \ 系统上已经可用几十年。它们现在是标准，因为它们被包含在 2024 年 POSIX 标准中。\n\n### 15.3.1 设置文本域：`textdomain()`\n\
  \n一个完整的应用程序可能包含多个组件：用 C 或 C++ 编写的单独执行文件，或者可以访问 `gettext` 设施的脚本语言（如 `gawk` 或 Bash\
  \ shell）。应用程序的所有组件共享同一个*文本域*（text domain），这是一个用于唯一标识应用程序的字符串。（示例可能是 `\"gawk\"` 或\
  \ `\"coreutils\"`；前者是一个单一程序，后者是整套程序包。）文本域通过 `textdomain()` 设置：\n\n```c\n#include\
  \ <libintl.h>                                        GLIBC/POSIX\n\nchar *textdomain(const\
  \ char *domainname);\n```\n\n每个组件都应该在 `main()` 的初始化活动部分调用此函数，并传入命名文本域的字符串。返回值是当前文本域。如果参数\
  \ `domainname` 为 `NULL`，则返回当前域；否则，将域设置为新值并返回该值。返回 `NULL` 表示发生了某种错误。\n\n如果未用 `textdomain()`\
  \ 设置文本域，默认域为 `\"messages\"`。\n\n### 15.3.2 翻译消息：`gettext()`\n\n设置文本域后的下一步是使用 `gettext()`\
  \ 函数（或其变体）处理*每一个*需要翻译的字符串。有几个函数提供了翻译服务：\n\n```c\n#include <libintl.h>          \
  \                                 GLIBC/POSIX\n\nchar *gettext(const char *msgid);\n\
  char *dgettext(const char *domainname, const char *msgid);\nchar *dcgettext(const\
  \ char *domainname, const char *msgid);\n```\n\n这些函数使用的参数如下：\n\n* `const char *msgid`\n\
  \    要被翻译的字符串。\n\n* `const char *domainname`\n    从中检索翻译的文本域。因此，即使 `main()` 调用了\
  \ `textdomain()` 来设置自己的域，也可以从其他文本域检索消息（这最适用于第三方库）。\n\n* `int category`\n    前面描述的类别之一。默认类别是未调用\
  \ `textdomain()` 时的 `LC_MESSAGES`。假设 `main()` 执行了以下调用：\n\n```c\ntextdomain(\"killerapp\"\
  );\n```\n\n那么 `gettext(\"my message\")` 等于 `dgettext(\"killerapp\", \"my message\"\
  )`。这两个反过来都等于 `dcgettext(\"killerapp\", \"my message\", LC_MESSAGES)`。\n\n你在 99.9%\
  \ 的情况下都会使用 `gettext()`。然而，其他函数提供了处理域或类别的灵活性。在编写库时最需要这种灵活性，因为独立库通常位于自己的文本域中。\n\n\
  所有函数都返回字符串。该字符串是目标 `msgid` 的翻译，如果没有翻译，则返回原始字符串。因此始终会有输出，即使只是原始（可能是英语）消息。例如：\n\n\
  ```c\n/* 国际化的第一个 C 程序。 */\n\n#include <stdio.h>\n#include <locale.h>\n#include <libintl.h>\n\
  #include <stdlib.h>\n\nint\nmain(void)\n{\n    setlocale(LC_ALL, \"\");\n    printf(\"\
  %s\\n\", gettext(\"hello, world\"));\n    return EXIT_SUCCESS;\n}\n```\n\n尽管消息是简单的字符串，但我们并不直接将其作为\
  \ `printf()` 的控制字符串，因为通常情况下翻译可能包含 `%` 字符。\n\n稍后，在第 15.3.4 节](#ch15.xhtml_ch15lev2sec12)\
  \ “让 `gettext()` 易于使用,” 529 页，我们将看到如何在大型现实程序中更方便使用 `gettext()`。\n\n### 15.3.3 处理复数：`ngettext()`\n\
  \n翻译复数带来了特殊的困难。直观的代码可能像这样：\n\n```c\nprintf(\"%d word%s misspelled\\n\", nwords,\
  \ nwords > 1 ? \"s\" : \"\");\n/* 或者 */\nprintf(\"%d %s misspelled\\n\", nwords,\
  \ nwords == 1 ? \"word\" : \"words\");\n```\n\n\n\n对于英语来说这是合理的，但翻译起来会变得困难。首先，许多语言并不像英语那样使用简单的复数形式（大多数单词只需添加\
  \ `s` 后缀）。其次，许多语言（特别是东欧的语言）有多种复数形式，每种形式都指示所指的对象数量。因此，即使是这样的代码也是够的：\n\n```\nif (nwords\
  \ == 1)\n    printf(\"one word misspelled\\n\");\nelse\n    printf(\"%d words misspelled\\\
  n\", nwords);\n```\n\n解决方案是一组专门用于翻译复数值的并行例程：\n\n```c\n#include <libintl.h>     \
  \                                       GLIBC/POSIX\n\nchar *ngettext(const char\
  \ *msgid, const char *msgid_plural,\n               unsigned long int n);\nchar\
  \ *dngettext(const char *domainname, const char *msgid,\n                const char\
  \ *msgid_plural, unsigned long int n);\nchar *dcngettext(const char *domainname,\
  \ const char *msgid,\n                 const char *msgid_plural, unsigned long int\
  \ n, int category);\n```\n\n除了原始的 `msgid`、`domainname` 和 `category` 参数外，这些函数还接受两个额外参数：\n\
  \n- `const char *msgid_plural`\n  用于复数值的默认字符串。稍后给出示例。\n- `unsigned long int n`\n\
  \  项目的数量。\n\n每个区域（locale）的消息目录都规定了如何翻译复数。`ngettext()` 函数（及其变体）会检查 `n`，并根据消息目录中的规范返回\
  \ `msgid` 的相应翻译。如果目录没有 `msgid` 的翻译，或者程序运行在 `\"C\"` 区域下，`ngettext()` 将在 `n == 1`\
  \ 时返回原始的 `msgid`；否则返回原始的 `msgid_plural`。因此，我们的拼写错误示例看起来如下：\n\n详细信息请参见 GNU `gettext`\
  \ 文档。在这里，我们关注的是开发者的需求，而不是翻译者。\n\n```c\nprintf(ngettext(\"%d word misspelled\", \"\
  %d words misspelled\", nwords), nwords);\n```\n\n注意，`nwords` 必须传递给 `ngettext()`\
  \ 以选择格式字符串，然后传递给 `printf()` 进行格式化。此外，小心不要使用值每次都会变化的宏或表达式，如 `n++`！如果你正在进行全局编辑以添加对\
  \ `ngettext()` 的调用而不注意，可能会发生这种情况。\n\n### 15.3.4 让 `gettext()` 易于使用\n\n程序源代码中对 `gettext()`\
  \ 的调用有两个。首先，它在运行时执行翻译，这毕竟是核心点。然而，它还用于标记需要翻译的字符串。`xgettext` 工具读取程序源代码并提取所有需要翻译的原始字符串。（我们将在本章稍后简要介绍其机制。）\n\
  \n但请考虑没有直接使用的 `static` 字符串的情况：\n\n```c\nstatic char *copyrights[] = {\n    \"Copyright\
  \ 2025, Jane Programmer\",\n    \"Permission is granted ...\",\n    ...        \
  \                           LOTS of legalese here\n    \"So there.\",\n    NULL\n\
  };\n\nvoid\ncopyright(void)\n{\n    int i;\n\n    for (i = 0; copyrights[i] != NULL,\
  \ i++)\n       printf(\"%s\\n\", gettext(copyrights[i]));\n}\n```\n\n在这里，我们希望在存在可用翻译时能够打印版权字符串的翻译。然而，`xgettext`\
  \ 提取器应该如何找到这些字符串呢？我们不能将它们封装在 `gettext()` 调用中，因为那在编译时是不行的：\n\n```c\n/* BAD 代码：无法编译\
  \ */\nstatic char *copyrights[] = {\n    gettext(\"Copyright 2025, Jane Programmer\"\
  ),\n    gettext(\"Permission is granted ...\"),\n    ...                       \
  \           LOTS of legalese here\n    NULL\n};\n```\n\n请继续阅读获取答案。\n\n#### 15.3.4.1\
  \ 可移植性程序：`\"gettext.h\"`\n\n我们假设你希望编写一个可以在任何 Unix 系统上配合 GNU `gettext` 库使用的程序，而不仅仅是\
  \ GNU/Linux 系统。下一节描述了针对仅 GNU/Linux 程序的处理方法。\n\n标记字符串的解决方案涉及两个。第一步是使用 GNU `gettext`\
  \ 提供的 `gettext.h` 便利头文件。该文件处理了多个移植性和编译问题，使得在自己的程序中使用 `gettext()` 更加容易：\n\n```c\n\
  #define ENABLE_NLS 1                为了使 gettext() 工作，ENABLE_NLS 必须为真\n#include \"\
  gettext.h\"                代替 <libintl.h>\n```\n\n如果未定义 `ENABLE_NLS` 宏或将其设置为零，则\
  \ `gettext.h` 将 `gettext()` 的调用展开为第一个参数。这使得使用 `gettext()` 的代码能够移植到没有安装 GNU `gettext`\
  \ 也没有对应版本的系统。头文件定义定义宏：\n\n该宏通常由 `configure` 程序自动定义，要么在一个特殊的头文件中，要么在编译器命令行上。`configure`\
  \ 是用 Autoconf 和 Automake 创建的。\n\n```c\n/* 一个伪函数调用，作为自动提取\n   消息的标记，但并不调用 gettext()。运行时\n\
  \   翻译在代码的另一个地方完成。\n   参数 String 应该是一个字面量字符串。连接字符串\n   以及其他字符串表达式将不起作用。\n   宏的展开没有括号，因此它适合作为\n\
  \   static 'char[]' 或 'const char[]' 变量的初始化器。  */\n#define gettext_noop(String)\
  \ String\n```\n\n注释是不言自喻的。有了这个宏，我们现在可以进行第二步。我们将代码重写如下：\n\n```c\n#define ENABLE_NLS\
  \ 1\n#include \"gettext.h\"\n\nstatic char copyrights[] =\n    gettext_noop(\"Copyright\
  \ 2025, Jane Programmer\\n\"\n    \"Permission is granted ...\\n\"\n    ...    \
  \                               LOTS of legalese here\n    \"So there.\");\n\nvoid\n\
  copyright(void)\n{\n   printf(\"%s\\n\", gettext(copyrights));\n}\n```\n\n注意，我们做了两个更改。首先，`copyrights`\
  \ 现在是一个通过标准 C 字符串常量连接功能构建的长字符串。这个单字符串然后被封装在 `gettext_noop()` 调用中。我们需要单字符串，以便让法律术语可以作为一个整体被翻译。（尽管注释中说连接字符串不起作用，但实际上只要你连接的是字符串常量，它们就是有效的。）\n\
  \n第二个更改是在 `copyright()` 中直接作为一个字符串打印翻译。\n\n到这里，你可能在想：“天，每次都要输入 gettext() 真的很痛苦。”没错，你说得对。输入不仅是一项额外的工作，而且让程序源代码更难阅读。因此，一旦你使用了\
  \ `gettext.h` 头文件，GNU `gettext` 手册建议引入两个命名为 `_()` 和 `N_()` 的宏，如下：\n\n```c\n#define\
  \ ENABLE_NLS 1\n#include \"gettext.h\"\n#define _(msgid) gettext(msgid)\n#define\
  \ N_(msgid) msgid\n```\n\n这种方法将使用 `gettext()` 的负担减少到每个可翻译字符串三个额外字符，对于 `static` 字符串仅需四个额外字符：\n\
  \n```c\n#include <stdio.h>\n#include <stdlib.h>\n#define ENABLE_NLS 1\n#include\
  \ \"gettext.h\"\n#define _(msgid) gettext(msgid)\n#define N_(msgid) msgid\n...\n\
  static char copyrights[] =\n    N_(\"Copyright 2025, Jane Programmer\\n\"\n    \"\
  Permission is granted ...\\n\"\n    ...                                   LOTS of\
  \ legalese here\n    \"So there.\");\n\nvoid\ncopyright(void)\n{\n   printf(\"%s\\\
  n\", _(copyrights));\n}\n\nint\nmain(void)\n{\n    setlocale(LC_ALL, \"\");  /*\
  \ gettext.h 也为我们获取 <locale.h> */\n    printf(\"%s\\n\", _(\"hello, world\"));\n\
  \    copyright();\n    exit(EXIT_SUCCESS);\n}\n```\n\n这些宏是非侵入的，实践中，所有使用 GNU `gettext`\
  \ 的 GNU 程序都使用这种约定。如果你打算使用 GNU `gettext`，你也应该遵循这一约定。\n\n#### 15.3.4.2 仅 GLIBC：`<libintl.h>`\n\
  \n\n\n\n\n对于仅在带有 `GLIBC` 的系统中使用的程序，头文件的用法和宏是类似的，但更简单：\n\n```\n#include <stdio.h>\n\
  #include <libintl.h>\n#define _(msgid) gettext(msgid)\n#define N_(msgid) msgid\n\
  … 其他部分都相同 …\n```\n\n正如我们之前所看到的，`<libintl.h>` 头文件声明了 `gettext()` 以及其他函数。你仍然需要定义 `_()`\
  \ 和 `N_()`，但你不需要担心 `ENABLE_NLS` 或是否要随程序源码一起分发 `gettext.h`。\n\n### 15.3.5 使用 `printf()`\
  \ 重新调整词序\n\n在生成翻译内容时，有时英语中显得自然的语序对于其他语言来说是不正确的。例如，在英语中，形容词出现在它所修饰的名词之前，但在许多语言中，它出现在名词*之后*。因此，像下面的代码就会出现问题：\n\
  \n```\nchar *animal_color, *animal;\n\nif (...) {\n    animal_color = _(\"brown\"\
  );\n    animal = _(\"cat\");\n} else if (...) {\n    ...\n} else {\n    ...\n}\n\
  printf(_(\"The %s %s looks at you enquiringly.\\n\"), animal_color, color);\n```\n\
  \n在这里，格式字符串、`animal_color` 和 `animal` 都正确地包含在 `gettext()` 调用中。然而，该语句在被翻译时仍然是错误的，因为*参数的顺序无法在运行时更改*。\n\
  \n为了解决这个问题，POSIX（但*不是* ISO C）版本的 `printf()` 族允许你在格式说明符内部提供一个*位置指定符*（positional specifier）。它的形式为一个十进制数字，紧跟在初始\
  \ `%` 字符之后的一个 `$` 字符。例如：\n\n```\nprintf(\"%2$s, %1$s\\n\", \"world\", \"hello\"\
  );\n```\n\n位置指定符指示使用参数列表中的哪一个参数；计数从 `1` 开始，不包括格式字符串本身。这个示例按正确的顺序打印了著名的“`hello, world`”消息。\n\
  \n任何常规 `printf()` 标志、字段宽度精度都可以跟在位置指定符后面。使用位置指定符的规则如下：\n\n* 位置指定符的形式不能与非位置形式混合。换句话说，要么每个格式说明符都包含位置指定符，要么一个都不包含。当然，`%%`\
  \ 始终可以使用。\n* 如果格式字符串中使用了第 *N* 个参数，那么直到 *N* 之前的所有参数也必须被字符串使用。因此，以下内容是无效的：\n\n   \
  \ ```\n    printf(\"%3$s %1$s\\n\", \"hello\", \"cruel\", \"world\");\n    ```\n\
  \n* 特定的参数可以使用位置指定符多次引用。非位置格式说明符始终按顺序遍历参数列表。\n\n这种机制并不是为应用程序开发人员直接设计的，而是供翻译人员使用的。例如，对于上述格式字符串\
  \ `\"The %s %s looks at you enquiringly.\\n\"`，其法语翻译可能是：\n\n```\n\"Le %2$s %1$s\
  \ te regarde d'un aire interrogateur.\\n\"\n```\n\n（即使这个翻译也不完美：冠词“Le”是区分性别的。为程序准备翻译是一项艰辛苦的工作！）\n\
  \n### 15.3.6 在私有目录中测试翻译\n\n程序中的消息集合被称为*消息目录*（message catalog）。该术语也适用于消息向不同语言的每种翻译。当程序安装时，它的翻译也会安装在标准位置，`gettext()`\
  \ 可以在运行时找到正确的翻译。\n\n将翻译放在标准目录以外的目录中可能是很有用的，特别是对于程序测试。特别是在较大的系统上，普通开发者可能没有在系统目录中安装文件的必要权限。`bindtextdomain()`\
  \ 函数为 `gettext()` 了一个了一个查找翻译的替代位置：\n\n```\n#include <libintl.h>                \
  \                             GLIBC/POSIX\n\nchar *bindtextdomain(const char *domainname,\
  \ const char *dirname);\n```\n\n有用的目录包括代表当前目录的 `.` 和 `/tmp`。从环境变量获取目录也可能很方便，如下所示：\n\
  \n```char\nchar *td_dir;\n\nsetlocale(LC_ALL, \"\");\ntextdomain(\"killerapp\");\n\
  if ((td_dir = getenv(\"KILLERAPP_TD_DIR\")) != NULL)\n    bindtextdomain(\"killerapp\"\
  , td_dir);\n```\n\n`bindtextdomain()` 应该在调用任何 `gettext()` 族函数之前调用。我们可以在第 15.3.9\
  \ 节](#ch15.xhtml_ch15lev2sec17)“创建翻译”、第 536 页](#ch15.xhtml_page_536)中看到如何使用它的示例。\n\
  \n### 15.3.7 设置输出字符集\n\n*字符集*（codeset）是 POSIX 对我们称为“字符集”（character set）的术语——即在特定区域设置字符的定义编码。我们将在本章稍晚些时候讨论字符集及其编码的问题，在第\
  \ 15.4 节](#ch15.xhtml_ch15lev1sec4)“你能帮我拼写那个吗？”、第 540 页](#ch15.xhtml_page_540)。\n\
  \n如果你愿意，可以检查和/或设置文本域的输出字符集。这意味着在找到字符串的翻译后，它在返回之前会被转换为给定的字符集。你通过 `bind_textdomain_codeset()`\
  \ 函数来实现此：\n\n```\n#include <libintl.h>                                GLIBC/POSIX\n\
  \nchar *bind_textdomain_codeset(const char *domainname,\n                      \
  \        const char *codeset);\n```\n\n参数为：\n\n* `const char *domainname`\n  文本域的。\n\
  * `const char *codeset`\n  要使用的字符集名称（例如 `\"UTF-8\"`）。\n\n输出字符集被认为“绑定”到了文本域。要查找某个域当前使用的字符集，请传入感兴趣的域名并为\
  \ `codeset` 传入一个 `NULL` 指针。返回值将是当前绑定的字符集或 `gettext()` 系列例程使用的默认字符集。\n要更改字符集，请传入感兴趣的域名和一个指定新字符集的字符串。`bind_textdomain_codeset()`\
  \ 在发生错误时返回 `NULL`，否则返回绑定的字符集。在这种情况下，`errno`指示错误。\n\n该功能相当特殊。大多数程序可能不需要它，但如果你确实需要，它就在那里。\n\
  \n### 15.3.8 准备国际化程序\n\n到目前为止，我们已经查看了构成国际化程序的所有组件。本节总结了这一过程：\n\n1. 将 `gettext.h`\
  \ 头文件引入应用程序，并在所有源文件包含的头文件中添加 `_()` 和 `N_()` 宏的定义。不要忘记定义 `ENABLE_NLS`常量。\n2. 在适当的情况下调用\
  \ `setlocale()`。简单的方法是调用 `setlocale(LC_ALL, \"\")`，但有时应用程序可能对启用的区域类别更加挑剔。\n3. 为应用程序选择文本域并使用\
  \ `textdomain()` 设置。\n4. 如果进行测试，使用 `bindtextdomain()` 将文本域绑定到特定目录。\n5. 在适当的情况下使用\
  \ `strfmon()`、`strftime()` 以及 `printf()` 的 `'` 标志。如果需要其他区域信息，使用 `nl_langinfo()`，特别是配合\
  \ `strftime()` 使用。\n6. 在适当的情况下调用 `_()` 或 `N_()` 标记所有需要翻译的字符串。\n7. 我们刚刚说“标记所有需要翻译的字符串”。然而，某些不应该这样标记。例如，如果你使用\
  \ `getopt_long()`（参见第 2.1.2 节](#ch02.xhtml_ch02lev2sec2)“GNU 长选项选项”、第 26 页](#ch02.xhtml_page_26)），你可能*不需要*将长选项名称标记为翻译。此外，简单的如\
  \ `\"%d %d\\n\"` 的格式字符串不需要翻译，调试消息也是如此。\n8. 在适当的情况下，使用 `ngettext()`（或其变体）处理单数或大于一的值。\n\
  \n\n\n\n## 9. 使用多个代表完整句子的字符串，而不是使用 `%s` 和 `?:` 进行单词替换，来让翻译人员的工作更轻松。例如：\n\n```\n\
  if (an error occurred) {       /* RIGHT */\n    /* 使用多个字符串来使翻译更容易。 */\n    if (input_type\
  \ == INPUT_FILE)\n        fprintf(stderr, _(\"%s: cannot read file: %s\\n\"),\n\
  \                          argv[0], strerror(errno));\n    else\n        fprintf(stderr,\
  \ _(\"%s: cannot read pipe: %s\\n\"),\n                          argv[0], strerror(errno));\n\
  }\n```\n\n这比这种更好：\n\n```\nif (an error occurred) {      /* WRONG */\n    fprintf(stderr,\
  \ _(\"%s: cannot read %s: %s\\n\"), argv[0],\n            input_type == INPUT_FILE\
  \ ? _(\"file\") : _(\"pipe\"),\n            strerror(errno));\n}\n\n如所示，特意包含注释说明有多个消息是一个好主意——为了方便。\n\
  \n### 5.3 创建翻译\n\n一旦你的程序经过国际化，就需要准备翻译。这是通过几个外壳工具完成的。我们从 第 6.1 节 的国际化版本 `echodate.c`\
  \ 开始，将已格式化的时间转换为 `time_t`：\n\n```\n/* ch-i8n-echodate.c --- 演示翻译 */\n\n#include\
  \ <stdio.h>\n#include <time.h>\n#include <locale.h>\n#include <stdlib.h>\n#define\
  \ ENABLE_NLS 1\n#include \"gettext.h\"\n#define _(msgid) gettext(msgid)\n#define\
  \ N_(msgid) msgid\n\nint\nmain(void)\n{\n    struct tm tm;\n    time_t then;\n \
  \   int count;\n\n    setlocale(LC_ALL, \"\");\n    bindtextdomain(\"echodate\"\
  , \".\");\n    textdomain(\"echodate\");\n\n    printf(\"%s\", _(\"Enter a Date/time\
  \ as YYYY/MM/DD HH:MM:SS : \"));\n    count = scanf(\"%d/%d/%d:%d:%d:%d\",\n   \
  \         &tm.tm_year, &tm.tm_mon, &tm.tm_mday,\n            &tm.tm_hour, &tm.tm_min,\
  \ &tm.tm_sec);\n\n    /* 为了简洁省略了值的检查。 */\n    tm.tm_year -= 1900;\n    tm.tm_mon\
  \ -= 1;\n\n    tm.tm_isdst = -1;   /* 不知道夏令时 */\n\n    then = mktime(&tm);\n\n \
  \   printf(_(\"Got: %s\"), ctime(&then));\n    exit(EXIT_SUCCESS);\n}\n```\n\n特意使用了\
  \ `\"gettext.h\"` 而不是 `<gettext.h>`。如果我们的应用程序带有 `gettext` 库的私有副本，`\"gettext.h\"\
  ` 将找到它，避免系统的副本。相反，如果只有系统的副本，如果没有本地副本，这种情况其实是因为 Solaris 系统也有一个没有 GNU 版本功能强大的 `gettext`\
  \ 库。\n\n继续创建翻译，第一步是提取可翻译的字符串。这是通过 `xgettext` 程序完成的：\n\n```\n$ xgettext --keyword=_\
  \ --keyword=N \\\n--default-domain=echodate echodate.c\n```\n\n`--keyword` 选项告诉\
  \ `xgettext` 寻找 `_()` 和 `N_()` 宏。它已经知道从 `gettext()` 及其变体以及 `gettext_noop()` 中提取字符串。在处理多个文件时，`xgettext`\
  \ 还知道如何处理重复字符串，每个字符串在输出中只出现一次。这为翻译人员节省了工作。\n\n`xgettext` 的输出被称为*移植对象*文件。默认名为 `messages.po`，对应于默认域\
  \ `\"messages\"`。`--default-domain` 选项指示域，用于命名输出文件。在这种情况下，文件名为 `echodate.po`。以下是其内容：\n\
  \n```\n# 描述性标题。\n# Copyright (C) YEAR 所有者\n# 本文件按照 PACKAGE 相同的许可证分发。\n# 第一作者 <EMAIL@ADDRESS>,\
  \ YEAR.\n#\n#, fuzzy\nmsgid \"\"                                               \
  \ 详细信息\nmsgstr \"\"                                               翻译人员完成\n\"Project-Id-Version:\
  \ PACKAGE VERSION\\n\"\n\"Report-Msgid-Bugs-To: \\n\"\n\"POT-Creation-Date: 2025-05-08\
  \ 18:18+0300\\n\"\n\"PO-Revision-Date: YEAR-MO-DA HO:MI+ZONE\\n\"\n\"Last-Translator:\
  \ 全名 <EMAIL@ADDRESS>\\n\"\n\"Language-Team: 语言团队 <LL@li.org>\\n\"\n\"Language: \\\
  n\"\n\"MIME-Version: 1.0\\n\"\n\"Content-Type: text/plain; charset=CHARSET\\n\"\n\
  \"Content-Transfer-Encoding: 8bit\\n\"\n\n#: ch-i18n-echodate.c:23             \
  \                  消息位置\nmsgid \"Enter a Date/time as YYYY/MM/DD HH:MM:SS : \" \
  \    原始消息\nmsgstr \"\"                                               在此翻译\n\n#:\
  \ ch-i18n-echodate.c:36                                相同\n#, c-format\nmsgid \"\
  Got: %s\"\nmsgstr \"\"\n```\n\n此原始文件在每个翻译中都被重用。因此，它是翻译的*模板*，按照惯例，它应该重命名以反映这一事实，并带有\
  \ `.pot`（*移植对象模板*）后缀：\n\n```\n$ mv echodate.po echodate.pot\n```\n\n考虑到我们并不精通许多语言，我们选择将消息翻译成猪语（pig\
  \ Latin）。因此，下一步是生成翻译。我们通过复制模板文件并添加翻译来实现这一点。\n\n```\n$ cp echodate.pot piglat.po\n\
  vim piglat.po\n```\n\n\n\n编译后的 `.mo` 文件存放在文件 `base` `/` `locale` `/` `category`\
  \ `/` `textdomain.mo` 中。在 GNU/Linux 系统上，`base` 为 `/usr/share/locale`。`locale` 是语言，例如\
  \ `es`、`fr` 等。`category` 是本地化类别；对于消息，它是 `LC_MESSAGES`。`textdomain` 是程序的文本域——在我们的例子中，它是\
  \ `echodate`。一个真实的例子是，Coreutils 的法语翻译位于 `/usr/share/locale/fr/LC_MESSAGES/coreutils.mo`。\n\
  \n`bindtextdomain()` 函数更改位置中的 `base` 部分。在 `ch-i18n-echodate.c` 中，我们将其更改为 `.`（点）。因此，有必要创建相应的目录，并将猪爪语（pig\
  \ Latin）翻译文件放在那里：\n\n```\n$ mkdir -p en/LC_MESSAGES                          必须使用真实的语言\n\
  $ cp piglat.mo en/LC_MESSAGES/echodate.mo          将文件放在正确的位置\n```\n\n必须使用真实的语言；因此我们通过使用\
  \ `\"en\"` 来“假装”。翻译就绪后，我们恰当地设置 `LC_ALL`，祈祷运气并运行程序：\n\n对于这本书的第一版，我们花了令人沮丧的 30 或 45\
  \ 分钟尝试使用 `piglat/LC_MESSAGES` 目录并设置 `LC_ALL=piglat`，但无无效果，直到我们发现了这个问题。\n\n```\n\
  $ LC_ALL=en_US.utf8 ch-i18n-echodate              运行程序\nEnteray A Ateday/imetay\
  \ asay YYYY/MM/DD HH:MM:SS : 2025/12/15 18:19:20\nOtgay: Mon Dec 15 18:19:20 2025\n\
  ```\n\n最新版本的 GNU `gettext` 可以在 GNU `gettext` 分发目录找到。\n\n`https://ftp.gnu.org/gnu/gettext`\n\
  \n这一节不可避免地只触及了本地化过程表面。GNU `gettext` 提供了许多用于翻译的工具，特别是为了在程序源代码演变时轻松保持翻译的更新。\n\n手动更新翻译的过程虽然可行，但很枯燥。这项任务很容易用\
  \ `make` 自动化；特别是 GNU `gettext` 与 Autoconf 和 Automake 良好集成，以提供此功能，减轻了程序员的大量开发负担。\n\
  \n我们建议阅读 GNU `gettext` 文档，以学习更多关于这两个特定问题以及 GNU `gettext` 一般的知识。（文档链接将在后文第 15.5 节“建议阅读”第\
  \ 553 页给出。）\n\n在我们描述的 Shell 级工具中，`msgfmt` 被包含在 2024 POSIX 标准中，同时还有用于打印翻译字符串的 Shell\
  \ 级命令 `gettext` 和 `ngettext`。\n\n### 15.4 你能帮我拼写一下吗？\n\n在计算的早期，不同的系统为数值与字形（用于与人类通信的符号，如字母、数字和标点符号）分配了不同的对应关系。最终出现了两个广泛使用的标准：用于\
  \ IBM 及其类似大型机的 EBCDIC 编码，以及用于其他所有设备的 ASCII。今天，除大型机外，ASCII 是目前使用的所有其他字符集的基础。\n\n\
  原始的七位 ASCII 字符集足以美式英语以及大多数标点和特殊字符，如 `$`（尽管没有“分”符号的字符）。然而，有许多语言和许多国家有不同的字符集需求。ASCII\
  \ 无法处理欧洲使用的带重音罗马字母，某些亚洲语言拥有数千个字符。新技术已经演变以解决这些缺陷。\n\ni18n 文献充满了对三个基本术语的引用。一旦我们了它们及其相互的关系，就可以介绍相应的\
  \ C API：\n\n*   `Character set`（字符集）\n    赋予不同整数值的含义的定义——例如，`A` 是 65。任何每个字符使用超过\
  \ 8 比特的字符集被称为多字节字符集。\n\n*   `Character set encoding`（字符集编码）\n    ASCII 使用单字节表示字符。因此，整数值直接以本身的形式存储在磁盘文件中。较晚的字符集（最著名的不同版本的\
  \ Unicode）使用 16 位甚至 32 位的整数值来表示字符。对于大多数定义的字符，整数中的一个、两个甚至三个高位字节为零，使得它们的值可以直接存储在磁盘文件中。编码描述了一种转换\
  \ 16 位或 32 位值的机制。\n\n*   `Language`（语言）\n    特定语言的规则规定了字符集。\n\n#### 15.4.1 宽字符 (Wide\
  \ Characters)\n\n我们从宽字符的概念开始。宽字符是一种可以持有所用字符集中任何值的整数类型。\n\n宽字符在 C 中用 `wchar_t` 表示。C99\
  \ 提供了一个相应的的 `wint_t` 类型，它可以持有 `wchar_t` 可以持有的任何值，以及特殊值 `WEOF`，它类似于 `EOF`。各种类型定义在\
  \ `<wchar.h>` 头文件中。\n\n宽字符的大小为 16 到 32 位，取决于实现。如所述，它们旨在用于操作内存中的数据，通常不直接存储在文件中。\n\
  \n某些系统将 `wchar_t` 定义为 16 位。由于 Unicode 需要的字符多于 16 位能容纳的，C24 标准引入了额外的类型 `char32_t`，其显式大小为\
  \ 32 位。（还有相关的 `char8_t` 和 `char16_t` 类型）。如果你不在乎具有 16 位 `wchar_t` 的系统，你可以继续使用 `wchar_t`\
  \ 代替 `char32_t`。最注意的是 Microsoft Windows 和 IBM 的 AIX。\n\n##### 15.4.1.1 代码中的宽字符\n\
  \n代码中的宽字符表示方式与普通字符类似。你同样的方式编写字符常量，但在其前面加上 `L` 或 `l`。使用 `L` 更具可读性。例如：\n\n```\nwchar_t\
  \ wide_A = L'A';\n```\n\n同样，宽字符字符串被包含在双引号中，并加上 `L` 或 `l`：\n\n```\nwchar_t wide_saying[]\
  \ = L\"Here's lookin' at you, kid!\\n\";    // 数组\nwchar_t *wide_saying2 = L\"Don't\
  \ Panic!\\n\";                   // 指向字符串量的指针\n```\n\n（你不应该为你所有的宽字符串和字符加上 `wide_`\
  \ 前缀；我们这样做仅仅是为了说明。）\n\n##### 15.4.1.2 宽字符函数\n\n\n\n\n\n对于宽字符，C 标准提供了大量的函数和宏，这些函数与处理\
