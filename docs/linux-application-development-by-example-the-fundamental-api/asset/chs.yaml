  ### 7. 索引(#index.xhtml_index)\n\n\n\n\n\n通过观察具体的程序，你不仅可以学习如何使用 `Linux` API，还能检查编写软件时遇到的现实世界问题（性能、可移植性、健壮性）。\n\
  \n虽然本书的标题是*实例化的 Linux 应用开发*，但除非另有说明，我们涵盖的所有内容也适用于其他 Unix 派系统。特别是，我们关注的是 `GNU/Linux`\
  \ 系统。通常，我们用 `Linux` 指 `Linux` 内核，而用 `GNU/Linux` 指整个系统（内核、库、工具）。此外，当我们指的是所有的 `Linux`、`GNU/Linux`\
  \ 和 `Unix` 时，也常说 `Linux`；如果某些内容特定于其中某一个系统，我们会明确指出。\n\n源自原始 Unix 源代码的系统，如 `Solaris`、`HP-UX`\
  \ 和 `AIX`，今天可以归类为遗留系统。然而，许多许多正在开发中的 `BSD` 派系统，如 `NetBSD`、`FreeBSD` 和 `OpenBSD` 等。\n\
  \n### 读者群\n\n本书面向理解编程并熟悉 `C` 基础知识的人士，至少达到 Brian Kernighan 和 Dennis Ritchie 所著的*C\
  \ 语言程序设计*水平。（想要阅读本书的 `Java`、`Python` 和 `Go` 程序员应该理解 `C` 指针，因为 `C` 代码大量使用了它们。）示例同时使用了\
  \ 1999 版本的标准 `C` 和原始 `C`。尽管有更新的 `C` 标准，但我们不需要它们提供的任何特性。\n\n特别是，你应该熟悉所有的 `C` 运算符、控制流结构、变量和指针的声明与使用、字符串管理函数、`exit()`\
  \ 的使用以及文件输入输出的 `<stdio.h>` 系列函数。\n\n你应该理解*标准输入*、*标准输出*和*标准错误*的基本概念，并知道所有 `C` 程序都会接收一个表示调用选项和参数的字符串数组。你还应该熟悉基本的命令行工具，如\
  \ `cd`、`cp`、`date`、`ln`、`ls`、`man`（如果你有 `info` 也是如此）、`rmdir` 和 `rm`；长短命令行选项的使用；环境变量；以及\
  \ I/O 重定向（包括管道）。\n\n我们假设你想要编写不仅能在 `GNU/Linux` 下运行，而且跨越一系列类 Unix 系统的程序。为此，我们对每个接口的可用性进行了标记（仅限\
  \ `GLIBC` 系统，或由 `POSIX` 定义等），并将可移植性建议作为书中不可或缺的一部分。\n\n这里教授的编程可能比你习惯的要低级；这没关系。系统调用是高级操作的底层构建块，因此本质上是低级的。这反过来决定了我们对\
  \ `C` 的使用：API 设计用于用于从 `C` 调用，而将它们与高级语言（如 `C++`、`Java`、`Python` 或 `Go`）接口的代码本质上必然是低级的，而且很可能是用\
  \ `C` 编写的。记住“低级”并不意味着“不好”，它只是意味着“更有挑战性”，会有帮助。\n\n### 你将学到什么\n\n*基础可能会过时，但它们通常不会出错。*\n\
  \n—— Grant Taylor\n\n本书专注于构成 Linux 编程核心的基础 API，即你在编写能够良好利用 `GNU/Linux` 和 `POSIX`\
  \ API 的软件时需要知道的*基础*知识：\n\n*   参数、选项与环境\n*   内存管理\n*   文件输入/输出\n*   文件元数据\n*   进程与信号\n\
  *   进程间通信\n*   用户与组\n*   资源限制\n*   编程支持（排序、参数解析等）\n*   基础网络\n*   国际化\n*   调试\n\n\
  我们刻意保持了主题列表的简短。我们认为，试图从一本书学习“所有相关的知识”是令人畏惧的。大多数读者更倾向于规模较小、重点集中的书籍。\n\n我们的目标是通过示例教你\
  \ `Linux` API，特别是通过使用`系统调用`和`库函数`。我们涵盖的 API 既包括高级也包括低级。*系统调用*是对系统服务的直接请求，例如读取或写入文件。另一方面，*库函数*运行在用户级，可能永远不会向操作系统请求服务。系统调用记录在第\
  \ 2 节，库函数记录在第 3 节。（与手册页一样，你通过 `man` 访问它们。）\n\n偶尔，我们会同时介绍实现某事的高级和低级方法。通常，高级标准接口是通过低级结构实现的。我们希望这种“内部原理”的视角有助于你理解事物是如何运作的；对于你编写的所有代码，你应该始终使用高级标准接口。\n\
  \n同样，我们有时会引入提供某些功能的函数，然后建议（并说明理由）避免使用这些函数！这种方法的主要目的是让你在看到这些函数时能够识别它们，从而理解使用这些函数的代码。对一个主题的全面了解不仅需要理解你能做什么，还需要理解你应该做什么以及不该做什么。\n\
  \n最后，每章都以建议读物和练习结束。一些练习涉及修改或编写代码。另一些则属于“思想实验”或“你为什么认为……”的类别。我们建议你完成所有练习——它们将帮助巩固你对材料的理解。\n\
  \n### 小即美：Unix 程序\n\nHoare 法则：\n\n*每个大程序内部都有一个正挣扎着逃的小程序。*\n\n—— C. A. R. Hoare\n\
  \n最初，我们计划通过使用 GNU 工具的代码来教授 Linux API。然而，即使是简单的命令行程序（如 `mv` 和 `cp`）的现代版本也是巨大且功能丰富的。对于标准工具的\
  \ GNU 变体来说更是如此，它们允许长短选项，满足 `POSIX` 的所有要求，并且通常还有额外的、看似不相关的选项（如输出高亮）。\n\n因此，问“面对这样一个庞大且混乱的森林，我们如何能够关注那一两棵重要的树呢？”就变得合理。换句话说，如果我们展示当前的全功能程序，是否可能看到程序底层的核心操作？\n\
  \n\n\n\n正当 `Hoare’s law`^(4) 启发我们从原始的 Unix 程序中寻找示例代码时。原始 V7 Unix 工具小巧且直观，使得人们很容易看清内部发生了什么，并理解系统调用是如何被使用的。（V7\
  \ 发布于 1979 年左右；它是所有现代 Unix 系统（包括 GNU/Linux 和 BSD 系统）的共同祖先。）\n\n^(4) 这句名言是在 1970\
  \ 年 8 月 10 日至 14 日在波兰雅贝沃纳（Jabłonna）举行的*大型程序高效生产国际研讨会*上提出的。\n\n多年来，Unix 源代码受版权和秘密许可协议的保护，难以研究且无法发布。对于所有商业\
  \ Unix 源代码也是如此。然而，在 2002 年，Caldera（现以 SCO 名运营）通过开源风格的许可提供了原始 Unix 代码（通过 V7 和 32V\
  \ Unix）（参见 附录 B，”第 671 页）。这使得我们能够在书中包含早期 Unix 系统的代码。\n\n## 标准\n\n在本书中，我们提到了几种不同的正式标准。*标准*是一份描述某事物如何运行的文档。许多事物都有正式标准；例如，你墙上电源插座中孔的形状、位置和含义由一项正式标准定义，以确保你国家所有的电源线都能在所有插座中使用。\n\
  \n同样，计算系统的正式标准也定义了它们应当如何工作；这使得开发者和用户知道对软件有何种预期，并让他们能够在软件无法工作时向供应商投诉。\n\n我们在这里感兴趣的包括：\n\
  \n1. *ISO/IEC 国际标准 9899:1999 编程语言 — C，第二版，1999 年*。C 编程语言的第二个正式标准。\n\n2. *ISO/IEC\
  \ 国际标准 14882:2024 编程语言 — C++ ++ *，2024 年*。C++ 编程语言的当前正式标准。\n\n3. *Open Group 规范第\
  \ 8 版，IEEE Std 1003.1^(TM)–2024 版*。^(5) POSIX 标准当前版本；它描述了 Unix 和类 Unix 系统的预期行为。该版本涵盖了\
  \ C/C++ 程序员看到的系统调用和库接口，以及用户看到的 shell 和工具接口。它由几卷组成：\n\n    * *基础定义 (Base Definitions)*。术语、设施和头文件的定义。\n\
  \n    * *系统接口 (System Interfaces)*。系统调用和库函数。POSIX 将它们统称为“函数”。\n\n    * *Shell 和工具\
  \ (Shell and Utilities)*。供 shell 程序中使用以及交互式使用的 shell 语言和工具。\n\n    * *原理说明 (Rationale)*。对于标准中包含或不包含的某些设施的选择提供了解释和理由。\n\
  \n^(5) [`https://pubs.opengroup.org/onlinepubs/9799919799/`](https://pubs.opengroup.org/onlinepubs/9799919799/)\n\
  \n虽然语言标准读起来并不枯燥，但你可能想要购买一份 C 标准，因为它提供了语言的最终定义。可以从 ANSI^(6) 和 ISO.^(7) 购买（C 标准的 PDF\
  \ 版本非常实惠）。\n\n^(6) [`http://www.ansi.org`](http://www.ansi.org)\n\n^(7) [`http://www.iso.ch`](http://www.iso.ch)\n\
  \nPOSIX 标准可以在在线获取。该标准旨在用于 Unix 和类 Unix 系统，也用于非 Unix 系统的实现。因此，它提供的基础功能是 Unix 系统功能的子集。然而，POSIX\
  \ 标准还定义了可选的*扩展*——额外的功能，例如针对线程或实时支持的功能。对我们最重要的是*X/Open 系统接口* (XSI) 扩展，它描述了历史 Unix\
  \ 系统的设施。\n\n在整本书中，我们标记了每个 API 的可用性：ISO C、POSIX、XSI、仅限 GLIBC，或非标准但常用的可用。\n\n## 特性与威力：GNU\
  \ 程序\n\n仅局限于原始 Unix 代码会写出一本有趣的历史书，但在 21 世纪的四分之一处，它将不再非常有用。现代程序没有早期 Unix 系统所样的限制（内存、CPU\
  \ 算力、磁盘空间和速度）。此外，它们需要在多语言环境中运行——ASCII 和美国英语是不够的。\n\n更重要的是，自由软件基金会（FSF）和 GNU 项目^(8)明确倡导的主要自由之一是“学习的自由”。GNU\
  \ 程序旨在提供大量编写良好的程序库，让初级程序员可以将其作为来源进行学习。\n\n^(8) [`http://www.gnu.org`](http://www.gnu.org)\n\
  \n通过使用 GNU 程序，我们希望实现两个目标：向你展示编写良好的现代代码，让你从中学习如何编写良好的代码以及如何良好地使用 API。\n\n我们相信 GNU\
  \ 软件更好，是因为它是自由的（出于“自由”意义，而不是“免费啤酒”）。但人们也公认 GNU 软件在*技术上*通常优于相应的 Unix 程序，我们在第 1.4\
  \ 节“为什么 GNU 程序更好，”第 13 页中解释了原因。\n\n许多 GNU 代码示例来自 `gawk`（GNU `awk`）。主要原因是我们非常熟悉这个程序，因此很容易从中选取示例。\n\
  \n## 章节总结\n\n开车是一个涉及多个并行任务的整体过程。在许多方面，Linux 编程也是如此，要求你理解 API 的多个方面，例如文件 I/O、文件元数据、目录、时间信息的存储等。\n\
  \n书的第一部分介绍了了足够的这些独立项目，以便学习第一个重要的程序 V7 `ls`。然后，我们通过查看文件层次结构以及文件系统的工作和使用方式，完成对文件和用户的讨论。\n\
  \n* *第 1 章](#ch01.xhtml_ch01),“引言，”第 3 页,*\n\n描述了 Unix 和 Linux 的文件和进程模型，查看了原始 C\
  \ 与 1999 年标准 C 区别，并提供了使 GNU 程序通常比标准 Unix 程序更好的原理概述。章节还包含了关于编程风格的建议，以及关于使用 AI 进行软件开发的一些思考。\n\
  \n* *第 2 章](#ch02.xhtml_ch02),“参数、选项与环境，”第 23 页,*\n\n描述了 C 程序如何访问和处理命令行参数及选项，并解释了如何与环境交互。\n\
  \n* *第 3 章](#ch03.xhtml_ch03),“用户级内存管理，”第 51 页,*\n\n提供了运行进程中使用和可用的不同内存的概述。用户级内存管理是每个非平凡应用程序的核心，因此早期理解它非常重要。\n\
  \n* *第 4 章](#ch04.xhtml_ch04),“文件与文件 I/O，”第 79 页,*\n\n讨论了基础的文件 I/O，展示了如何创建和使用文件。这种理解对于后续的所有内容都重要。\n\
  \n\n\n\n描述了目录、硬链接和符号链接的工作原理。随后，描述了文件元数据（如所有者、权限等），并涵盖了如何操作目录。\n\n* 第 6 章, “通用库接口——第一部分”、“第\
  \ 155 页，\n查看了第一组我们需要的通用编程接口，以便我们能够有效利用文件的元数据。\n\n* 第 7 章, “整合：ls”、“第 201 页，\n通过查看\
  \ V7 的 `ls` 程序，将目前为止看到的所有内容整合在一起。\n\n* 第 8 章, “文件系统与目录遍历”、“第 221 页，\n描述了文件系统如何挂载和卸载，以及程序如何判断系统上挂载了什么。它还描述了程序如何轻松地“遍历”整个文件层次结构，并对遇到的每个对象采取适当的操作。\n\
  \n本书第二部分涉及进程创建与管理、通过管道和信号进行进程间通信、用户 ID 和组 ID、资源限制、额外的通用编程接口以及基础网络。接下来，书中描述了使用 GNU\
  \ `gettext` 的国际化，以及若干高级 API。\n\n* 第 9 章, “进程管理与管道”、“第 275 页，\n查看了进程创建、程序执行、使用管道的\
  \ IPC（进程间通信）以及文件描述符管理，包括非阻塞 I/O。\n\n* 第 10 章, “信号”、“第 333 页，\n讨论了信号，这一种简单的进程间通信形式。信号在父进程管理子进程中也起着重要作用。\n\
  \n* 第 11 章, “权限与用户及组 ID”、“第 383 页，\n查看了如何识别进程和文件、权限检查的工作原理，以及 setuid 和 setgid 机制是如何工作的。\n\
  \n* 第 12 章, “资源限制”、“第 405 页，\n描述了进程使用系统资源的方式，特别是如何限制它们使用过多的资源。\n\n* 第 13 章, “通用库接口——第二部分”、“第\
  \ 419 页，\n查看了其余的通用 API；其中许多比第一组通用 API 更具专业性。\n\n* 第 14 章, “套字与基础网络”、“第 473 页，\n\
  引入了不同计算机之间进程通信的基础设施。\n\n* 第 15 章, “国际化与本地化”、“第 507 页，\n解释了如何让你的程序几乎毫无痛苦地支持多语言工作。\n\
  \n* 第 16 章, “扩展接口”、“第 557 页，\n描述了之前章节涵盖的接口的几个扩展版本，并详细介绍了文件锁定。\n\n第三部分通过一个关于调试的章节结束全本书，因为（几乎）没有人能一次性做对，而且我们建议了一个最终项目来巩固你对书中涵盖的\
  \ API 的知识。\n\n* 第 17 章, “调试”、“第 591 页，\n描述了 GDB 调试器的基础知识，尽可能传了我们在该领域的编程经验，并查看了一些用于不同类型调试的有用工具。\n\
  \n* 第 18 章, “整合一切的项目”、“第 659 页，\n介绍了一个重大的编程项目，该项目利用了书中涵盖的所有内容。\n\n几个附录涵盖了感兴趣的话题，包括书中使用的源代码许可协议。\n\
  \n* 附录 A, “十年学会编程”、“第 665 页，\n引用了著名的格言“罗马不是一蹴而就的”。同样，Linux/Unix 的专业知识和理解只能通过时间和实践获得。考虑到这一点，我们包含了这篇由\
  \ Peter Norvig 写的文章，我们强烈推荐。\n\n* 附录 B, “Caldera Ancient UNIX 许可证”、“第 671 页，\n涵盖了书中使用的\
  \ Unix 源代码。\n\n* 附录 C, “GNU 通用公共许可证”、“第 673 页，\n涵盖了书中使用的 GNU 源代码。\n\n* 附录 D, “One\
  \ True Awk 许可证”、“第 685 页，\n涵盖了来自 One True Awk 的源代码。\n\n* 附录 E, “4.4 BSD 许可证”、“第\
  \ 687 页，\n涵盖了 4.4 分发版的源代码。\n\n### 排版惯例\n\n与所有关于计算机主题的书籍一样，我们使用某些排版惯例来传达信息。*定义*或术语的首次使用用斜体表示，如“Definitions”一词。计算机上存在的内容使用等宽字体，例如文件名和命令名。有时在需要强调某一点时，我们会使用粗体字体。\n\
  \n你输入的短代码段包含在单引号中：`ls -l`。`$` 和 `>` 是 Bourne shell 的默认主、次级提示符，用于显示交互示例。在示例中，*用户输入*的字体与普通的`computer\
  \ 输出`不同。示例所示：\n\n```\n$ ls -l *.texi        查看文件。选项是字母 l，而不是数字 1\n-rw-w-r-- 1 arnold\
  \ 33165 Apr 24 18:03 00-preface.texi\n-rw-w-r-- 1 arnold 48622 Apr 24 18:05 01-intro.texi\n\
  -rw-w-r-- 1 arnold 65930 Apr 23 22:43 02-cmdline.texi\n```\n\n我们倾向于使用 Bourne shell\
  \ 及其变体（`ksh93`, `Bash`）而不是 C shell；因此，我们所有的示例只显示 Bourne shell。请注意，C shell 中的引用和续行规则是不同的；如果你使用它，就得自负了！在引用程序中的函数时，我们在函数名后加上一对空括号：`printf()`，`strcpy()`。在引用手册页（通过\
  \ `man` 命令访问）时，我们遵循标准的 Unix 惯例，将命令或函数名写为斜体，并在随后的括号内用正体写出章节：*awk*(1), *printf* (3)。\n\
  \n### 如何获取 Unix 和 GNU 源代码\n\n你可能希望拥有我们在书中使用的程序副本，以便进行自己的实验和审查。所有源代码都可以在网上获得，你的 GNU/Linux\
  \ 分发版包含了 GNU 工具的源代码。\n\n#### Unix 代码\n\n各种“古老”版本 Unix 的存档由 Unix 遗产学会（TUHS）维护。`http://www.tuhs.org`\n\
  \n\n\n\n\n最感兴趣的是，可以在 Web 上浏览旧 Unix 源代码存档。可以从 [`http://www.tuhs.org/UnixTree/`](http://www.tuhs.org/UnixTree/)\
  \ 开始。书中的几乎所有的示例代码都来自第七版研究 Unix 系统（Seventh Edition Research UNIX System），也称为“V7”。\n\
  \nTUHS 站点物理位置位于澳大利亚，尽管全球范围内该存档的镜像——参见 [`http://www.tuhs.org/archive_sites.html`](http://www.tuhs.org/archive_sites.html)\
  \ 。该页面还指出，存档可以通过 `rsync` 进行镜像同步。（如果你没有 `rsync`，请查看 [`http://rsync.samba.org/`](http://rsync.samba.org/)；它是\
  \ GNU/Linux 系统的标准配置。）\n\n在写本文时，你大约需要 6.5–7 GB 字节的磁盘空间来拷贝整个存档。要拷贝该存档，请创建一个空目录并在其中运行以下命令：\n\
  \n```\nmkdir Applications Distributions Documentation Tools\n\nrsync -avz minnie.tuhs.org::UA_Root\
  \           .\nrsync -avz minnie.tuhs.org::UA_Applications   Applications\nrsync\
  \ -avz minnie.tuhs.org::UA_Distributions  Distributions\nrsync -avz minnie.tuhs.org::UA_Documentation\
  \  Documentation\nrsync -avz minnie.tuhs.org::UA_Tools          Tools\n```\n\n（为了方便起见，这些命令可以在本书\
  \ GitHub 仓库中 `ch-01-intro` 目录下的脚本 `get-tuhs-files.sh` 中找到。）\n\n有趣的是，V7 代码中不包含任何版权或许可声明。作者编写代码主要是为了他们自己和他们的研究，将许可问题留给了\
  \ AT&T 的公司许可部门。\n\n## GNU 代码\n\n如果你使用的是 GNU/Linux，那么你的发行版会带有源代码，可能可能是它所使用的任何打包格式（Red\
  \ Hat RPM 文件、Debian DEB 文件、Slackware `.tar.gz` 文件等）。书中的示例来自 GNU Coreutils 9.4 版本。如果你愿意，可以搜索适用于你发行版的源码包。或者按照接下来的几段说明来获取代码。\n\
  \n如果你倾向于自己从 GNU FTP 站点获取文件，可以在此处找到它们：[`https://ftp.gnu.org/gnu/coreutils/coreutils-9.4.tar.gz`](https://ftp.gnu.org/gnu/coreutils/coreutils-9.4.tar.gz)\
  \ 。\n\n`tar` 文件也可以用 `xz` 压缩；该文件比使用 `gzip` 压缩的文件要小一点。\n\n你可以使用 `wget` 或 `curl` 来获取文件：\n\
  \n```\n$ wget https://ftp.gnu.org/gnu/coreutils/coreutils-9.4.tar.gz\n… 获取文件时此处有大量输出\
  \ …\n```\n\n或者，你也可以使用传统的 `ftp` 来获取文件：\n\n```\n$ ftp ftp.gnu.org                \
  \                       Connect to the GNU ftp\nTrying 51.188:21 ...Connected to\
  \ ftp.gnu.org.\nGNU FTP ready.\nName (ftp.gnu.org:anonymous):Use anonymous ftp\n\
  ...Site deleted.\nLogin successful.\nRemote system type UNIX.\nUsing binary mode\
  \ to transfer files.\nftp> cd /gnu/coreutils                               Change\
  \ to the Coreutils directory\nDirectory successfully changed.\nftp> bin\nSwitching\
  \ to Binary mode.\nftp> get coreutils-9.4.tar.gz                           Retrieve\
  \ the file\nlocal: coreutils-9.4.tar.gz\n1471457 bytes received in 0:18 (78.75 KiB/s)\n\
  ftp> quit                               Log off\nGoodbye.\n```\n\n注意，FSF 倾向于你使用\
  \ HTTPS 而不是 FTP；他们的服务器指示他们将禁用 FTP 访问。一旦获取了文件，按照以下方式提取它：\n\n```\n$ gzip -dc < coreutils-9.4.tar.gz\
  \ | tar -xvpf -                       Extract files\n… 解压文件时此处有大量输出 …\n```\n\n使用\
  \ `tar` 的系统可以使用此命令：\n\n```\n$ tar -xvpzf coreutils-9.4.tar.gz                  \
  \                   Extract files\n… 解压文件时此处有大量输出 …\n```\n\n根据 GNU 公共许可，以下是书中引用的所有\
