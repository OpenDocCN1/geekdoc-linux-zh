  \n# 第 11 章\n\n## 权限与用户和组 ID 数字\n\nLinux 遵循 Unix，是一个`多用户系统`。与许多早期的个人电脑操作系统不同（那些系统只有一个用户，任何物理上坐在电脑前的人都有完全控制权），Linux\
  \ 和 Unix 通过其所属的所有者和组来分离文件和进程。在本章中，我们将检查权限检查，并查看检索和设置所有者及组标识符的 API。\n\n## 11.1 检查权限\n\
  \n正如第 5.4.2 节所示，“获取文件信息，”第 131 页，文件系统将文件的用户标识符和组标识符存储为数值；这些类型分别是 `uid_t` 和 `gid_t`。为了简单起见，我们使用缩写\
  \ `UID` 和 `GID` 表示“用户标识符”和“组标识符”。\n\n每个进程都与多个用户和组标识符相关。作为一种简化，使用一个特定的 `UID` 和 `GID`\
  \ 用于权限检查；当进程的 `UID` 与文件的 `UID` 匹配时，文件的用户权限位决定了该进程可以对该文件做什么。如果不匹配，系统将检查进程的 `GID`\
  \ 是否匹配文件的 `GID`，如果它们匹配，则应用组权限；否则应用“其他”权限。\n\n除了文件，`UID` 还控制一个进程如何通过发送信号影响另一个进程。信号在第\
  \ 10 章“信号，”第 333 页中描述。\n\n最后，超级用户 `root` 是一个特殊情况。`root` 通过 `UID` `0` 识别。当进程拥有 `UID`\
  \ `0` 时，内核允许它随心所欲：读取、写入或删除文件，向任意进程发送信号等。（POSIX 在这方面的描述较为模糊，称为具有“适当权限”的进程）。这种语言反过来了\
  \ GNU/Linux 手页和 GLIBC 在线 Info 手册。某些操作系统按用户划分权限，Linux 也向这个方向发展。尽管如此，在实践中，“适当权限”仅指\
  \ `UID` `0` 的进程。）\n\n### 11.1.1 真实 ID 和有效 ID\n\n`UID` 和 `GID` 数字就像身份标识。有时你需要携带多一个身份标识。例如，你可能有一个驾执照或国家身份证。^(1)此外，你的大学或公司可能向你颁发了身份卡。进程也是如此；它们携带有多个\
  \ `UID` 和 `GID` 数字，如下：\n\n^(1) 尽管美国没有官方身份卡，但许多国家都有。\n\n- **真实用户 ID (Real user ID)**\n\
  \  派生（fork）该进程的用户的 `UID`。\n\n- **有效用户 ID (Effective user ID)**\n  用于大多数权限检查的 `UID`。大多数情况下，有效和真实的\
  \ `UIDs` 是相同的。如果可执行程序文件的 `setuid` 位被设置，且该文件的所有者不是运行程序的用户，则在启动时有效 `UID` 可能与真实的不同（稍后详述）。\n\
  \n- **保存的设置用户 ID (Saved set-user ID)**\n  程序启动时（`exec` 之后）的原始有效 `UID`。当进程需要反复切换其真实和有效\
  \ `UID` 时，它在权限检查中起作用。这个概念源自 System V。\n\n- **真实组 ID (Real group ID)**\n  创建进程的用户的\
  \ `GID`，类似于真实的 `UID`。\n\n- **有效组 ID (Effective group ID)**\n  用于权限检查的 `GID`，类似于有效的\
  \ `UID`。\n\n- **保存的设置组 ID (Saved set-group ID)**\n  程序启动时的原始有效 `GID`，类似于保存的设置用户\
  \ ID。\n\n- **补充组集 (Supplemental group set)**\n  4.2 BSD 引入了组集（`group set`）的概念。除了真实和有效的\
  \ `GIDs` 外，每个进程都有一些额外的组，它`同时`属于这些组。因此，当对文件的组权限进行检查时，内核不仅检查有效 `GID`，还会检查组集中所有的 `GIDs`。\n\
  \n任何进程都可以检索所有这些值。普通（非超级用户）进程可以反复切换其真实和有效的用户及组 ID。`root` 进程（有效 `UID` 为 `0` 的进程）也可以根据需要设置这些值（尽管这可以是单向操作）。\n\
  \n### 11.1.2 Setuid 和 Setgid 位\n\n文件权限中的 `setuid` 和 `setgid` 位^(2)会导致进程获得一个与真实不同的有效\
  \ `UID` 或 `GID`。这些位通过 `chmod` 命令手动应用到文件：\n\n```\n$ chmod u+s myprogram         \
  \       添加 setuid 位\n$ chmod g+s myprogram                添加 setgid 位\n$ ls -l myprogram\n\
  -rwsr-sr-x 1 arnold arnold 35120 Feb  8 21:00 myprogram\n```\n\n^(2) C 语言的发明者、Unix\
  \ 的联合创造者 Dennis Ritchie 获得了 `setuid` 位专利：*数据文件内容保护*（Protection of Data File Contents），美国专利号\
  \ 4,135,240。该书 GitHub 仓库中的 `Documents/US4135240.pdf` 文件包含其副本。AT&T 将专利授予了公众，允许任何人使用其技术。\n\
  \n在通常出现 `x` 字符的地方出现 `s` 字符表示 `setuid/setgid` 位的存在。\n\n正如第 8.2.1 节所示，“使用挂载选项，”第 230\
  \ 页，为文件系统 `mount` `nosuid` 选项可以防止内核尊重 `setuid` 和 `setgid` 位。这是一个安全特性；例如，一个 GNU/Linux\
  \ 系统的用户可能会制作一个 USB 闪存，并将一个 shell 可执行文件的副本设置为 `setuid root`。但如果办公室或实验室的 GNU/Linux\
  \ 系统只使用 `nosuid` 选项挂载此类文件系统，那么运行该 shell 就不会提供 `root` 权限。^(3)\n\n^(3) GNU/Linux 和\
  \ Unix 系统的安全本身就是一个深度话题。这只是一个例子；更多请参见第 11.8 节“建议阅读，”第 400 页。\n\nsetuid 程序经典的（且可能被过度使用的）启发性示例是一个游戏程序。假设你写了一个非常酷的游戏，并希望允许系统上的用户玩这个游戏。游戏维护着一个评分文件，列出最高分。\n\
  \n如果你不是系统管理员，你就无法创建一个仅允许玩该游戏的独立组，从而允许他们写入评分文件。但如果你让该文件对全局可写以便任何人都能玩游戏，那么任何人都可以作弊，并将任何名字放在顶端。\n\
  \n然而，通过将游戏程序 `setuid` 为你自己，运行游戏的用户将你的 `UID` 作为他们的有效 `UID`。这样游戏程序就可以根据需要打开并更新评分文件，但任意用户不能编辑它。你也让自己暴露在\
  \ setuid 编程的大部分危险；例如，如果游戏程序有一个可以被利用以产生以你身份运行的 shell 的漏洞，那么*所有*文件都可以被删除或更改。这是一个令人恐惧的想法。\n\
  \n\n\n\n同样的逻辑也适用于 `setgid` 程序，尽管在实践中，`setgid` 程序的使用频率远低于 `setuid` 程序。这很遗憾；许多通过 `setuid`\
  \ `root` 程序完成的任务，本可以很容易通过 `setgid` 程序或设置为普通用户的 `setuid` 程序来完成。\n\n为此设计的程序是 GNU `userv`\
  \ (`https://ftp.gnu.org/gnu/userv/`)。\n\n## 11.2 获取用户和组 ID\n\n从系统获取 `UID` 和 `GID`\
  \ 信息非常直接。相关函数如下：\n\n```c\n#include <unistd.h>                                  \
  \      POSIX\n\nuid_t getuid(void);                        真实和有效 UID\nuid_t geteuid(void);\n\
  gid_t getgid(void);                        真实和有效 GID\ngid_t getegid(void);\n\nint\
  \ getgroups(int size, gid_t list[]);     附加组列表\n```\n\n这些函数是：\n\n* `uid_t getuid(void)`：返回真实的\
  \ `UID`。\n* `uid_t geteuid(void)`：返回有效的 `UID`。\n* `gid_t getgid(void)`：返回真实的 `GID`。\n\
  * `gid_t getegid(void)`：返回有效的 `GID`。\n* `int getgroups(int size, gid_t list[])`：从进程的附加组集中填充最多\
  \ `size` 个元素到 `list` 中。返回填充的元素个数，如果发生错误则返回 `-1`。有效 `GID` 是否也包含在内取决于实现定义。\n\n  在符合\
  \ POSIX 的系统上，你可以传递一个值为零的 `size` 参数；在这种情况下，`getgroups()` 返回进程组集中的组数。然后你可以使用该值动态分配一个足够大的数组。（你也可以使用‘sysconf(_SC_NGROUPS_MAX)`’来获取该值。这将在第\
  \ 12.2 节，“系统限制：`sysconf()`, `pathconf()`, 和 `fpathconf()`，”第 405 页中讨论。）\n\n  在非\
  \ POSIX 系统上，常量 `NGROUPS_MAX` 定义了 `list` 数组所需的最大尺寸。在现代系统中，可以在 `<limits.h>` 中找到该常量，在旧版系统中则在\
  \ `<sys/param.h>` 中。我们稍后会给示例。\n\n你可能已经注意到，没有获取保存的设置用户 ID 或保存的设置组 ID 值的调用。这些只是有效\
  \ `UID` 和有效 `GID` 的原始值。因此，你可以在程序启动时使用如下代码来获取这六个值：\n\n```c\nuid_t ruid, euid, saved_uid;\n\
  gid_t rgid, egid, saved_gid;\n\nint\nmain(int argc, char **argv)\n{\n    ruid =\
  \ getuid();\n    euid = saved_uid = geteuid();\n\n    rgid = getgid();\n    egid\
  \ = saved_gid = getegid();\n\n    … 程序其余部分 …\n}\n```\n\n这是一个获取组集的示例。作为扩展，`gawk`\
  \ 提供了 `awk` 级别访问真实和有效的 `UID`、`GID` 值以及附加组集。为了实现这一点，它必须检索组集。以下函数来自 `gawk` 5.3.0 分发中的\
  \ `main.c`：\n\n```c\n1453  /* init_groupset --- 初始化组集 */\n1454\n1455  static void\n\
  1456  init_groupset()\n1457  {\n1458  #if defined(HAVE_GETGROUPS) && defined(NGROUPS_MAX)\
  \ && NGROUPS_MAX > 0\n1459  #ifdef GETGROUPS_NOT_STANDARD\n1460      /* 对于不符合标准的系统，使用旧方法。\
  \ */\n1461      ngroups = NGROUPS_MAX;\n1462  #else\n1463      /*\n1464       *\
  \ 如果两个参数都为 0，返回值为\n1465       * 组的总数。\n1466       */\n1467      ngroups = getgroups(0,\
  \ NULL);\n1468  #endif\n1469      /* 如果发生错误或没有组，直接放弃并继续运行。 */\n1470      if (ngroups\
  \ <= 0)\n1472          return;\n\n1473      /* 填充组 */\n1474      emalloc(groupset,\
  \ GETGROUPS_T *, ngroups * sizeof(GETGROUPS_T), \"init_groupset\");\n\n1476    \
  \  ngroups = getgroups(ngroups, groupset);\n1477      /* 此处也一样，放弃但继续执行 */\n1478\
  \      if (ngroups == -1) {\n1479          efree(groupset);\n1480          ngroups\
  \ = 0;\n1481          groupset = NULL;\n1482      }\n1483  #endif\n1484  }\n```\n\
  \n`ngroups` 和 `groupset` 变量是全局的；未显示它们的声明。`GETGROUPS_T` 宏（第 1474 行）是第二个参数使用的类型；在\
  \ POSIX 系统上是 `gid_t`，否则是 `int`。\n\n行 1458 和 1483 包裹了整个函数体；对于完全没有组集的古老系统，该函数体为空。\n\
  \n行 1459–1461 处理非 POSIX 系统；`GETGROUPS_NOT_STANDARD` 在程序编译前由配置机制定义。在这种情况下，代码如前文所述使用\
  \ `NGROUPS_MAX`。\n\n行 1462–1468 用于 POSIX 系统，使用值为零的 `size` 参数来检索组组数量。\n\n行 1469–1471\
  \ 进行错误检查。如果返回值小于或等于 `0`，则没有附加组，因此 `init_groupset()` 仅提前返回。\n\n最后，第 1474 行使用 `malloc()`（通过一个错误检查封装宏——参见第\
  \ 3.2.1.8 节，“示例：读取任意长度的行，”第 65 页）分配一个足够大的数组。行 1476 然后填充该数组。行 1478–1482 处理了可能发生的失败情况。\n\
  \n## 11.3 以真实用户身份进行检查：`access()`\n\n大多数情况下，有效和真实的 `UID` 以及 `GID` 值是相同的。因此，文件权限检查是针对有效\
  \ ID 而不是真实 ID 执行并无。\n\n然而，在编写 `setuid` 或 `setgid` 应用时，你有时想检查对于有效 `UID` 和 `GID` 允许的文件操作对于真实的\
  \ `UID` 和 `GID` 是否也是允许的。这就是 `access()` 函数的任务：\n\n```c\n#include <unistd.h>     \
  \                                      POSIX\n\nint access(const char *path, int\
  \ amode);\n```\n\n`path` 参数是用于与真实 `UID/GID` 进行检查的文件路径。`amode` 是一个或多个以下值的按位或运算结果：\n\
  \n* `R_OK`：真实的 `UID/GID` 可以读取该文件。\n* `W_OK`：真实的 `UID/GID` 可以写入该文件。\n* `X_OK`：真实的\
  \ `UID/GID` 可以执行该文件——或者如果是目录，可以搜索该目录。\n* `F_OK`：检查文件是否存在。\n\n路径中的每个组件都会被检查，在某些实现中，当检查\
  \ `root` 时，`access()` 的行为可能像 `X_OK` 为真一样，即使文件权限中没有设置执行位。（这很诡异但属属；在这种情况下，防患于胜于未然。）Linux\
  \ 没有这个问题。\n\n如果 `path` 是一个符号链接，`access()` 会检查符号链接指向的文件。\n\n如果真实的 `UID` 和 `GID` 允许该操作，则返回值为\
  \ `0`，否则为 `-1`。因此，如果 `access()` 返回 `-1`，`setuid` 程序可以拒绝访问有效 `UID/GID` 本可以操作的文件：\n\
  \n```c\nif (access(\"/some/special/file\", R_OK|W_OK) < 0) {\n    fprintf(stderr,\
  \ \"Sorry: /some/special/file: %s\\n\", strerror(errno));\n    exit(1);\n}\n```\n\
  \n例如，`stdbuf` 命令允许你控制使用 `<stdio.h>` 进行输入输出的程序的缓冲。它通过在环境中放置特殊值、安排加载特殊的共享库，然后对所需的程序执行\
  \ `exec` 来实现这一点。为了查找共享库，它会检查多个地方，包括使用 `access()` 检查 `$PATH` 中命名的目录：\n\n\n\n\n\n\
  ```\n135  static void\n136  set_program_path (char const *arg)\n137  {\n138    if\
  \ (strchr (arg, '/')) /* Use absolute or relative paths directly.  */\n139     \
  \ {\n140        program_path = dir_name (arg);\n141      }\n142    else\n143   \
  \   {\n144        char *path = xreadlink (\"/proc/self/exe\");\n145        if (path)\n\
  146          program_path = dir_name (path);\n147        else if ((path = getenv\
  \ (\"PATH\")))\n148          {\n149            char *dir;\n150            path =\
  \ xstrdup (path);\n151            for (dir = strtok (path, \":\"); dir != nullptr;\n\
  152                 dir = strtok (nullptr, \":\"))\n153              {\n154    \
  \            char *candidate = file_name_concat (dir, arg, nullptr);\n155      \
  \          if (access (candidate, X_OK) == 0)\n156                  {\n157     \
  \               program_path = dir_name (candidate);\n158                    free\
  \ (candidate);\n159                    break;\n160                  }\n161     \
  \           free (candidate);\n162              }\n163          }\n164        free\
  \ (path);\n165      }\n166  }\n```\n\n第 147–163 行是对 `$PATH` 的搜索。第 151–162 行的循环尝试在\
  \ `$PATH` 中的每个目录中查找要执行程序的完整名称。第 155 行使用 `access()` 来检查给定文件是否存在并具有可执行权限。\n\n**注意**\n\
  \n在打开（或执行）文件之前使用 `access()` 是一种良好的做法，但存在一个竞态条件：被检查的文件可能在 `access()` 检查和调用 `open()`\
  \ 之间被替换。需要严谨的编程，例如在调用 `access()` 和 `open()` 之前之后使用 `stat()` 和 `fstat()` 检查所有者和权限。\n\
  \n为了解决竞态条件问题，POSIX 强制要求使用 `faccessat()` 系统调用：\n\n```\n#include <unistd.h>      \
  \                                       POSIX\n#include <fcntl.h>\n\nint faccessat(int\
  \ fd, const char *path, int amode, int flag);\n```\n\n与 `access()` 一样，`faccessat()`\
  \ 默认根据真实的 UID 和 GID 检查权限。参数如下：\n\n*   `int fd`\n    一个打开的目录的文件描述符，从该目录开始查找 `path`。可以是\
  \ `AT_FDCWD`，在这种情况下将使用进程当前的工作目录。\n\n*   `const char *path`\n    要检查的文件路径名。绝对路径忽略\
  \ `fd` 的值。否则，查找相对于相对于 `fd` 打开的目录。\n\n*   `int amode`\n    一个或多个 `R_OK`、`W_OK`、`X_OK`\
  \ 或 `F_OK` 的按位或结果，与 `access()` 相同。\n\n*   `int flag`\n    为零，或者以下一个或多个的按位或：\n\n\
  \    *   `AT_EACCESS`\n        根据有效 UID 和 GID 检查权限。\n\n    *   `AT_SYMLINK_NOFOLLOW`\n\
  \        如果 `path` 指向符号链接，则对链接本身进行检查，而不是对链接指向的文件。注意，此标志是 Linux 特有的。\n\nGLIBC 提供了两个名为\
  \ `euidaccess()` 和 `eaccess()` 的附加函数，它们的工作方式类似于 `access()`，但根据有效 UID、GID 和组集进行检查。鉴于\
  \ `faccessat()` 的 `AT_EACCESS` 标志，在新代码中没有需要使用这两个函数。\n\n## 11.4 为目录设置额外的权限位\n\nsetgid\
  \ 和“粘性（sticky）”位在应用于目录时各有特殊含义。\n\n### 11.4.1 新文件和目录的默认组\n\n在原始的 Unix 系统中，当 `open()`\
  \ 或 `creat()` 创建新文件时，该文件将接收创建它的进程的有效 UID 和 GID。\n\nV7、直到 4.1 BSD 以及 System V 直 Release\
  \ 3 都将目录视为文件。然而，随着 4.2 BSD 增加了补充组集，创建新目录的方式发生了变化：新目录继承父目录的组。此外，新文件也继承父目录的组 ID，*而不是*创建进程的有效\
  \ GID。\n\n这种多组和这种工作方式目录的设计思想是为了促进小组协作。使用系统的每个组织项目都会分配一个单独的组。每个项目的顶层目录位于该项目的组中，项目的文件将都具有组读、写（如果需要，还有执行）权限。此外，新文件会自动获得父目录的组。通过同时属于多个组（组集），用户可以使用简单的\
  \ `cd` 命令在项目之间随意移动，且所有文件和目录将保持其正确的组。\n\n在现代系统中会发生什么？嗯，这是少数几个可以“既要鱼子，又要网””的案例之一。SunOS\
  \ 4.0 发明了一种被包含在 System V Release 4 中的机制；它现在至少被 Solaris 和 GNU/Linux 使用。这些系统对新文件或目录父目录上的\
  \ setgid 位赋予了含义，如下所示：\n\n*   *父目录上的 setgid 位未设置*\n    新文件和目录接收创建进程的有效 GID。\n\n*\
  \   *父目录上的 setgid 位已设置*\n    新文件和目录接收父目录的 GID。新目录也会继承 setgid 开启状态。\n\n（在 SunOS 4.0\
  \ 之前，目录上的 setgid 位没有定义的含义。）以下会话显示了 setgid 位的用法：\n\n```\n$ cd /tmp              \
  \                                    移动到 /tmp\n$ ls -ld.                       \
  \                          检查其权限\ndrwxrwxrwt 16 root root 40960 Feb 12 09:09 .\n\
  $ id                                                       检查当前组\nuid=1000(arnold)\
  \ gid=1000(arnold) groups=1000(arnold),4(adm),20(dialout),...\n$ mkdir d1 ; ls -ld\
  \ d1                                     创建一个新目录\ndrwxrwxr-x 2 arnold arnold 4096\
  \ Feb 12 09:09 d1            组了组\n$ chgrp adm d1                               \
  \              更改组\n$ chmod+s d1                                              添加\
  \ setgid 位\n$ ls -ld d1                                                验证更改\ndrwxrws-x\
  \ 2 arnold adm 4096 Feb 12 09:09 d1\n$ cd d1                                   \
  \                 进入该目录\n$ echo this should have group adm on it > f1          \
  \     创建一个文件\n$ ls -l f1                                                 检查权限\n\
  -rw-rw-r-- 1 arnold adm 33 Feb 12 09:10 f1                 从父继承\n$ mkdir d2    \
  \                                             创建一个目录\n$ ls -ld d2              \
  \                                  检查权限\ndrwxrws-x 2 arnold adm 4096 Feb 12 09:10\
  \ d2               组和 setgid 都继承\n```\n\nGNU/Linux 的 `ext2`、`ext3` 和 `ext4` 文件系统工作方式如所示。此外，它们支持特殊的挂载选项\
  \ `grpid` 和 `bsdgroups`，使“使用父目录组”语义成为默认值。（这两个名称相同）。换句话说，当使用这些挂载选项时，父目录不需要设置 setgid\
  \ 位。\n\n相反的挂载选项是 `nogrpid` 和 `sysvgroups`。这是默认行为；但如果存在 setgid 位，仍然会被尊重。（在这里，这两个名称也相同。）\n\
  \nPOSIX 规定新文件和目录继承创建进程的有效 GID 或父目录的组。然而，实现必须提供一种方法让新目录继承父目录的组。此外，标准建议应用程序不要依赖于其中一种行为，但在需要的情况下，应用程序应使用\
  \ `chown()` 强制将新文件或目录的组所有权设置为所需的 GID。\n\n### 11.4.2 目录与粘性位\n\nSherman，将时间穿越机设定到\
  \ 1976 年。\n\n*—* Mr. Peabody\n\n\n\n\n\n`sticky bit`（粘滞位）源于 PDP-11 版本的 Unix，适用于普通可执行文件。该位用于那些预期会被频繁使用的程序，例如\
  \ shell 和编辑器。当一个程序设置了此位时，内核会在交换设备上保留一份程序可执行代码的副本，以便将其快速加载到内存中重用。（从文件系统加载需要更长时间：交换设备上的镜像存储在连续的磁盘块中，而文件系统中的镜像可能分散在整个磁盘上。）可执行的镜像“粘”在交换设备上，因此得此名。\n\
  \n这些镜像让人联想到快乐的年幼程序，它们的脸上和手上沾满了巧克力。\n\n因此，即使程序当前没有被使用，预计它在当另一个用户去运行它时，它很快会被再次使用，所以它可以被快速加载。\n\
  \n现代系统的磁盘和内存硬件比以前的 PDP-11 快得多。它们还使用一种名为 `demand paging`（请求分页）的技术，只将可执行程序中正在执行的部分加载到内存。因此，普通可执行文件的粘滞位今天已经没有作用了，实际上它没有任何效果。\n\
  \n然而，在第 1.1.2 节“目录和文件名”第 5 页中，我们提到，对于原本可写的目录，粘滞位可以防止除文件所有者或 `root` 之外的任何人从该目录删除文件或在其中重命名文件。这里有一个示例：\n\
  \n```\n$ ls -ld /tmp                                                 显示 /tmp 的权限\n\
  drwxrwxrwt 16 root root 40960 Feb 12 09:21 /tmp\n$ cd /tmp                     \
  \                                进入目录\n$ echo this is my file > arnolds-file   \
  \                      创建一个文件\n$ ls -l arnolds-file                            \
  \              显示该文件的权限\n-rw-rw-r-- 1 arnold arnold 16 Feb 12 09:22 arnolds-file\n\
  $ su - miriam                                                 切换到另一个用户\nPassword:\n\
  $ cd /tmp                                                     进入 /tmp\n$ rm arnolds-file\
  \                                             尝试删除文件\nrm: remove write-protected\
  \ regular file 'arnolds-file'?  y    rm 比较谨慎\nrm: cannot remove 'arnolds-file':\
  \ Operation not permitted     内核不允许删除\n```\n\n该功能的首要目的正是为了像 `/tmp` 这样有多个用户希望放置自己文件的目录。一方面，目录需要是世界可写的，以便任何人都能其中创建文件。另一方面，一旦它是世界可写的，任何用户都可以删除任何其他用户的文件！目录粘滞位很好地解决了这个问题。使用\
  \ `chmod +t` 为文件或目录添加粘滞位：\n\n```\n$ mkdir mytmp                                \
  \                 创建目录\n$ chmod a+wxt mytmp                                    \
  \       添加所有写入和粘滞位\n$ ls -ld mytmp                                             \
  \   验证结果\ndrwxrwxrwt 2 arnold arnold 4096 Feb 12 09:26 mytmp\n```\n\n最后，请注意，根据此示例中的权限，目录的所有者也可以删除文件，即使这些文件不属于他。\n\
  \n## 11.5 设置真实和有效 ID\n\n一旦进程必须更改其 UID 和 GID 值时，事情就变得有趣起来。设置组集是直接的。而更改真实和有效的 UID\
  \ 以及 GID 值则更为复杂。\n\n### 11.5.1 更改组集\n\n`setgroups()` 函数安装一个新的组集：\n\n```c\n#include\
  \ <sys/types.h>                                               通用\n#include <unistd.h>\n\
  #include <grp.h>\n\nint setgroups(size_t size, const gid_t *list);\n```\n\n`size`\
  \ 参数表示 `list` 数组中有多少项。如果一切顺利，返回值为 `0`；否则返回 `-1` 并设置 `errno`。\n\n与操作真实和有效 UID、GID\
  \ 值的函数不同，此函数只能由以 `root` 运行的进程调用。这是 POSIX 术语“特权操作”（privileged operation）的一个例子；因此它没有被\
  \ POSIX 正式标准化。\n\n`setgroups()` 被任何登录系统的程序使用，例如用于控制台登录的 `/usr/bin/login` 或通过 `ssh`\
  \ 远程登录的 `/usr/bin/sshd`。在许多 GNU/Linux 系统上，`/bin` 是 `/usr/bin` 的符号链接；如果 `/bin` 是真实目录，`login`\
  \ 和 `sshd` 可能就在那里。\n\nGNU/Linux 的 `setgroups(2)` 手页指出，进程可以通过以下方式丢弃所有组：\n\n```c\n\
  setgroups(0, NULL);\n```\n\n### 11.5.2 更改真实和有效 ID\n\n使用两个不同的用户 ID 运行对程序员来说是一个挑战。程序在处理有效\
  \ UID 时可能需要做一些事情，而在使用真实 UID 时又可能需要做其他事情。\n\n例如，在 Unix 系统拥有作业控制之前，许多程序提供了 `shell\
  \ escapes`（shell 转义）——即在当前程序内部运行命令或交互式 shell 的方法。`ed` 编辑器就是一个很好的例子：输入以 `!` 开头的命令行将把该行的剩余部分作为\
  \ shell 命令运行。输入 `!sh` 会给你提供一个交互式 shell。（这仍然有效——试试看！）假设之前描述的虚拟游戏程序也提供 shell 转义：shell\
  \ 应该以真实用户运行，*而不是*有效用户。否则，游戏玩家直接编辑分数文件或做更多更糟糕的事情再次变得轻而易举！\n\n因此，明确需要能够将有效 UID 改为真实\
  \ UID。此外，能够将有效 UID 切换回*原始值也是很有帮助的。（这就是最初设置保存组用户 ID（saved set-user ID）的原因；这使得重新进程启动时拥有的原始权限变得可能。）\n\
  \n与许多 Unix API 一样，不同的系统以不同的方式解决了这个问题，有时是使用相同的 API 但具有不同的语义，有时是引入了不同的 API。深入历史细节只会让人头疼，所以我们不追究。相反，我们查看\
  \ POSIX 提供了什么以及每个 API 是如何工作的。此外，我们的讨论关注真实和有效的 UID；GID 值的原理类似，因此我们就不再重复这些系统调用的细节。函数如下：\n\
  \n```c\n#include <sys/types.h>                                              POSIX\n\
  #include <unistd.h>\nint seteuid(uid_t euid);                              设置有效\
  \ ID\nint setegid(gid_t egid);                              设置有效 ID\nint setuid(uid_t\
  \ uid);                               设置有效 ID; 如果是 root，则设置所有\nint setgid(gid_t\
  \ gid);                               设置有效 ID\nint setreuid(uid_t ruid, uid_t euid);\
  \                 BSD 兼容性，设置两者\nint setregid(gid_t rgid, gid_t egid);          \
  \       BSD 兼容性，设置两者\n```\n\n共有三组函数。前两个是由 POSIX 创建的：\n\n*   `int seteuid(uid_t euid)`\n\
  \n    此函数仅设置有效 UID。普通（非 `root`）用户只能将 ID 设置为真实、有效或保存组用户 ID 值之一。将反复切换有效 UID 的应用程序应专地使用此函数。\n\
  \n    有效 UID 为零的进程可以将有效 UID 设置为任何值。由于也可以将有效 UID 设置为保存组用户 ID，进程可以通过再次调用 `seteuid()`\
  \ 重新获得其 `root` 权限。\n\n*   `int setegid(gid_t egid)`\n\n    此函数对有效组 ID 起的作用相当于 `seteuid()`\
  \ 对有效用户 ID 起的作用。\n\n下一组函数提供了最初用于更改真实和有效 UID 及 GID 的原始 Unix API。在 POSIX 模型下，这些函数是\
  \ setuid-`root` 程序应该使用的，用于对真实和有效 UID 进行*永久性*更改：\n\n*   `int setuid(uid_t uid)`\n\
  \n\n\n\n对于普通用户，此函数也只设置有效 UID。与 `seteuid()` 类似，有效 UID 可以被设置为当前实际、有效或保存的设置组用户 ID 值中的任何一个。这种更改不是永久的；可以通过后续调用将有效\
  \ UID 更改为另一个值（来自同一源集合）。\n\n然而，对于 `root`，此函数会将实际、有效和保存的设置组用户 ID 的*所有三个者*都设置为给定的值。此外，这种更改是永久的；这些\
  \ ID 无法被改回去。（这是合情理的：一旦保存的设置组用户 ID 被更改，就没有另一个不同的 ID 可以改回去了了。）\n\n*   `int setgid(gid_t\
  \ gid)`\n\n    此函数对有效组 ID 所做的作用等同于 `setuid()` 对有效用户 ID 所做的作用。普通用户与 `root` 之间的相同区别同样适用。\n\
  \n**注意**\n\n更改组 ID 的取决于*有效用户 ID*。有效 GID 为 `0` 时没有特殊权限。\n\n最后，POSIX 提供了两个来自 4.2 BSD\
  \ 的函数以为了历史兼容。最好在新代码中不要这些这些。但是，由于你可能会看到使用这些函数的旧代码，我们在此处描述了它们：\n\n*   `int setreuid(uid_t\
  \ ruid, uid_t euid)`\n\n    此函数将实际和有效的 UID 设置为给定的值。`ruid` 或 `euid` 的值 `–1` 将保持相应\
  \ ID 不变。（这类似于 `chown()`；参见第 5.6.1 节“更改文件所有权：`chown()`, `fchown()`, 和 `lchown()``),146\
  \ 页。）\n\n    `root` 允许将实际和有效 ID 设置为任何值。根据 POSIX，非 `root` 用户只能更改有效 ID；如果普通用户尝试更改实际\
  \ UID，其结果是“未指定的”。然而，GNU/Linux 的 `setreuid`(2) 手页详细说明了 Linux 的行为：实际 UID 可以设置为实际 UID\
  \ 或有效 UID，而有效 UID 可以被设置为实际、有效或保存的设置组用户 ID 中的任何一个。（对于其他系统，请参见 `setreuid`(2) 手页。）\n\
  \n*   `int setregid(gid_t rgid, gid_t egid)`\n\n    此函数对实际和有效组 ID 所做的作用等同于 `setreuid()`\
  \ 对实际和有效用户 ID 所做的作用。普通用户与 `root` 之间的相同区别同样适用。\n\n保存的设置组用户 ID 在 BSD 模型中并不，因此 `setreuid()`\
  \ 和 `setregid()` 的设计目的是简单地交换实际和有效 ID：\n\n```\nsetreuid(geteuid(), getuid());  /*\
  \ 交换实际和有效 ID */\n```\n\n然而，考虑到 POSIX 采用了保存的设置组用户 ID 模型以及 `seteuid()` 和 `setegid()`\
  \ 函数，BSD 函数不应在新代码中使用。即使是 4.4 BSD 文档也将这些函数标记为过时，建议改用 `seteuid()`/`setuid()` 和 `setegid()`/`setgid()`。\n\
  \n### 11.5.3 使用 Setuid 和 Setgid 位\n\n在某些情况下，以 `root` 身份运行的程序必须*不可撤销地*将实际、有效和保存的设置组用户\
  \ ID 全部更改为普通用户的。最明显的是 `login` 程序，你每当登录 GNU/Linux 或 Unix 系统（无论是直接还是远程）时都会使用它。(7)\
  \ 程序存在层级结构，如图 11.1 所示。\n\n^(7) 如今，你可能使用图形界面程序登录，但原理和机制是相同的。如果你切换到 Linux 虚拟终端并登录，你将使用这里描述的同一套程序。\n\
  \n![Images](img/fig11-001.jpg)\n\n**图 11.1:** 从 `init` 到 `getty` 再到 `login` 最后到\
  \ shell\n\n`login` 的代码太复杂无法在此处，因为它处理着许多与当前讨论无关的任务。但我们可以概述登录时发生的步骤，如下所示：\n\n1.  `init`\
  \ 是原始进程。它的 PID 为 `1`。所有其他进程都源自它。内核在启动时手工创建进程 `1` 并在其中运行 `init`。它运行时，实际和有效 UID 都设置为零（即作为\
  \ `root` 运行）。\n\n2.  `init` 读取 `/etc/inittab`，该文件除其他外还告诉 `init` 应该在哪些硬件设备上启动 `getty`\
  \ 进程。对于每个此类设备（如控制台、串口终端或 GNU/Linux 系统上的虚拟终端），`init` 都会派出一个新进程。该新进程随后使用 `exec()`\
  \ 运行 `getty`（“get tty”，即终端）。此命令可能有不同的名称，例如 `agetty`。程序打开设备，重置其状态，并打印“`login:``”提示符。\n\
  \n3.  在读取登录名后，`getty` 会执行 `login`。`login` 程序在密码文件中查找用户名，提示密码并验证密码。如果匹配，登录过程继续。\n\
  \n4.  `login` 切换到用户的家目录，设置初始环境，然后设置初始的打开文件集。它关闭所有文件描述符，打开终端，并使用 `dup()` 将终端的文件描述符拷贝到\
  \ `0`、`1` 和 `2`。这就是已经打开的标准输入、输出和错误文件描述符的来源。\n\n5.  `login` 然后使用 `setgroups()` 设置补充组，使用\
  \ `setgid()` 将实际、有效和保存的设置组 ID 设置为用户的 ID，最后使用 `setuid()` 将实际、有效和保存的设置组用户 ID 全部设置为登录用户的\
  \ ID。注意，对 `setuid()` 的调用必须*最后*执行，这样另外两个调用才能成功。\n\n6.  最后，`login` 执行用户的登录 shell。随后是\
  \ Bourne 风格的 shell。\n\n\n\n\n获取真实、有效和保存的用户 ID（set-user ID）值。成功时返回 `0`，错误返回 `–1`，并通过\
  \ `errno` 指明问题。\n\n```\nint getresgid(gid_t *rgid, gid_t *egid, gid_t *sgid)\n```\n\
  \n获取真实、有效和保存的组 ID（set-group ID）值。成功时返回 `0`，错误返回 `–1`，并通过 `errno` 指明问题。\n\n```c\n\
  int setresuid(uid_t ruid, uid_t euid, uid_t suid)\n```\n\n分别设置真实、有效和保存的用户 ID（set-user\
  \ ID）。当参数值为 `–1` 时，相应的 UID 将保持不变。\n\n当进程以 `root` 身份运行时，参数可以是任意值。（但是，对 `euid` 使用非零值会导致\
  \ `root` 权限永久且不可撤销地丢失。）否则，参数必须是当前的真实、有效或保存的用户 ID 值之一。\n\n```c\nint setresgid(gid_t\
  \ rgid, gid_t egid, gid_t sgid)\n```\n\n分别设置真实、有效和保存的组 ID（set-group ID）。当参数值为 `–1`\
  \ 时，相应的 GID 将保持不变。\n\n`setresuid()` 和 `setresgid()` 函数特别有价值，因为它们的语义定义非常清晰。程序员确切知道调用的效果是什么。\n\
  \n此外，这些调用是“全有全无”的操作：它们要么完全成功并实现预期的更改，要么完全失败并保持现状。这提高了可靠性，因为（再次强调）你可以确切地知道发生了什么。\n\
  \n## 11.7 跨越安全雷区：Setuid `root`\n\n穿越真实的雷区虽然困难，但并非不可能。然而，在没有训练或经验的情况下，这并不是可以轻率尝试的事情。\n\
  \n同样，编写以 setuid `root` 运行的程序也是一项艰巨的任务。有很多许多问题需要注意，几乎任何操作都可能产生意想不到的安全后果。这种尝试应该谨慎地进行。\n\
  \n特别是，深入读 Linux/Unix 安全问题并投入时间学习如何编写 setuid `root` 程序是非常值得的。如果你在只读完这本书而没有读其他任何内容的情况下直接面对这种挑战，请放心，你的系统会被*轻松且立即地*攻破。你或你的客户都不可能感到高兴。\n\
  \n以下是一些指导原则：\n\n*   作为 `root` 时，尽可能少做操作。谨慎地使用你的超能力，只在绝对需要的地方使用。\n*   合理设计你的程序。对程序进行模块化，以便所有的\
  \ `root` 操作都能提前完成，程序的其余部分作为普通用户运行。\n*   在更改或放弃权限时，如果可用，请使用 Linux 特有的 `setresuid()`\
  \ 系统调用。否则，使用 `seteuid()`。只有当你想要更改是永久的时才使用 `setuid()`。\n*   按照正确的顺序从 `root` 切换到普通用户：先设置组和\
  \ GID 值，然后设置 UID 值。\n*   特别注意 `fork()` 和 `exec()`；除非你显式更改，否则真实和有效的 UID 不会在它们之间改变。\n\
  *   考虑为你的应用程序使用 setgid 权限和特殊组。如果这行得通，将为你省去很多烦恼。\n*   考虑丢弃继承的环境。如果你必须保留某些环境变量，请尽可能少地保留。确保为\
  \ `PATH` 和 `IFS` 环境变量提供合理的值。\n*   避免使用 `execlp()` 和 `execvp()`，它们依赖于 `PATH` 环境变量的值（尽管如果你自己重置了\
  \ `PATH`，这个问题就不那么严重）。\n\n这些只是穿越充满陷阱、机关和地雷的危险区域的众多战术之一。请参阅下一节以获取其他信息的线索。\n\n## 11.8\
  \ 推荐阅读\n\nUnix（以及因此 GNU/Linux）安全是一个需要知识和经验才能妥善处理的话题。在互联网时代，它变得更难了，而不是更容易。这里的前三项被认为是“经典”。\n\
  \n1.  *Practical UNIX and Internet Security*, 3rd ed., by Simson Garfinkel, Gene\
  \ Spafford, and Alan Schwartz. O’Reilly, 2003. ISBN-13: 978-0-596-00323-4.\n   \
  \ 这是关于 Unix 安全的标准书籍。\n2.  *Building Secure Software: How to Avoid Security Problems\
  \ the Right Way*, by John Viega and Gary McGraw. Addison-Wesley, 2001. ISBN-13:\
  \ 978-0-201-72152-2.\n    这是一本关于编写安全软件的好书，包含了如何处理 setuid 问题的内容。它假设你熟悉基础的 Linux/Unix\
  \ API；当你读完我们的书时，应该准备好阅读 *Building Secure Software* 了。\n3.  “Setuid Demystified”\
  \ by Hao Chen, David Wagner, and Drew Dean. *Proceedings of the 11th USENIX Security\
  \ Symposium*, August 5–9, 2002. [`http://www.cs.berkeley.edu/~daw/papers/setuid-usenix02.pdf`](http://www.cs.berkeley.edu/~daw/papers/setuid-usenix02.pdf).\n\
  \    Garfinkel, Spafford 和 Schwartz 建议在“甚至考虑编写尝试保存和恢复权限的代码之前”阅读这篇论文。我们非常赞同他们的观点。\n\
  \n接的一组书籍侧重于安全编码。\n\n4.  *Secure Coding in C and C++*, 2nd ed., by Robert C. Seacord.\
  \ Addison-Wesley, 2013. ISBN-13: 978-0-321-82213-0.\n5.  *Secure Coding: Principles\
  \ and Practices*, by Mark G. Graff and Kenneth R. van Wyk. O’Reilly, 2003. ISBN-13:\
  \ 978-0-596-00242-8.\n6.  *Writing Secure Code*, 2nd ed., by Michael Howard and\
  \ David LeBlanc. Microsoft Press, 2003. ISBN-13: 978-0-7356-1722-3.\n7.  *Secure\
  \ Programming HOWTO: Creating Secure Software*, edition v3.72, by David A. Wheeler.\
  \ Published by the author, 2015. Available for free from [`https://dwheeler.com/secure-programs/`](https://dwheeler.com/secure-programs/).\n\
  \    这本全面的书籍涵盖了 C 和 C++ 以及其他语言中安全编程的许多方面。感谢 Nelson H. F. Beebe 让我们知道了这一资源。\n\n以下文本范围更广，侧重于互联网和安全软件设计。\n\
  \n8.  *Computer Security and the Internet: Tools and Jewels from Malware to Bitcoin*,\
  \ 2nd ed., by Paul C. van Oorschot. Springer, 2021. ISBN-13: 978-3-030-83410-4.\n\
  9.  *Thinking Security: Stopping Next Year’s Hackers* by Steven M. Bellovin. Addison-Wesley,\
  \ 2016. ISBN-13: 978-0-13-427754-7.\n10. *Security Engineering: A Guide to Building\
  \ Dependable Distributed Systems*, third edition, by Ross Anderson. Wiley, 2020.\
  \ ISBN-10: 1-119-64278-7, ISBN-13: 978-1-119-64278-7.\n11. *Designing Secure Software:\
  \ A Guide for Developers* by Loren Kohnfelder. No Starch Press, 2021. ISBN-13: 978-1-7185-0192-8.\n\
  12. *Building Secure and Reliable Systems: Best Practices for Designing, Implementing,\
  \ and Maintaining Systems*, by Heather Adkins, Betsy Beyer, Paul Blankinship, Piotr\
  \ Lewandowski, Ana Oprea, and Adam Stubblefield. O’Reilly, 2020. ISBN-13: 978-1-4920-8312-2.\n\
  13. *Secure by Design*, by Dan Bergh Johnsson, Daniel Deogun, and Daniel Sawano.\
  \ Manning, 2019. ISBN-13: 978-1-61729-435-8.\n\n## 11.9 总结\n\n*   使用用户和组 ID 值（UID\
  \ 和 GID）来识别文件和进程是 Linux 和 Unix 成为多用户系统的原因。进程携带真实和有效的 UID 和 GID 值，以及一组附加组。通常情况下，有效的\
  \ UID 决定了一个进程如何影响另一个进程，而有效的 UID、GID 和组组被用于对文件权限进行检查。有效 UID 为零的用户（称为 `root` 或*超级用户*）被允许随心所欲；系统不会对这类用户进行权限检查。\n\
  *   保存的用户 ID（set-user ID）和保存的组 ID（set-group ID）概念源于 System V，并已被 POSIX 采纳，在 GNU/Linux\
  \ 中完全支持。这些独立的 ID 值使得根据需要轻松且正确地切换真实和有效的 UID（以及 GID）。\n\n\n\n\n\n- `Setuid` 和 `setgid`\
  \ 程序会创建有效 ID（effective ID）和真实 ID（real ID）不同的进程。这些程序通过文件权限中的额外位标记为此类。在创建文件后，必须向其添加\
  \ `setuid` 和 `setgid` 位。\n\n- `getuid()` 和 `geteuid()` 分别获取真实和有效 UID 值，而 `getgid()`\
  \ 和 `getegid()` 分别获取真实和有效 GID 值。`getgroups()` 获取附加组集，在 POSIX 环境中，它可以查询系统该组集包含多少成员。\n\
  \n- 组集通过 `setgroups()` 进行更改。该函数没有被 POSIX 标准化，但在所有现代 Unix 系统上都存在。只有 `root` 可以使用它。\n\
  \n- `access()` 函数以*真实*用户的身份进行文件权限检查，这使得 setuid 程序能够检查真实用户的权限。注意，由于文件可能位于非原生或网络文件系统上，通过\
  \ `stat()` 获取的信息往往无法提供完整的全貌。\n\n- `faccessat()` 函数与 `access()` 类似，但它还提供了基于有效 UID\
  \ 和 GID 值进行检查的选项。在 GNU/LINUX 上，你还有一个额外的选项是不跟踪符号链接。\n\n- `setgid` 位和粘滞位（sticky bits）在应用于目录时会引入额外的语义。当目录开启了\
  \ `setgid` 位时，该目录中的新文件将继承该目录的组。新目录也是如此，并且会自动继承 `setgid` 位的设置。如果没有 `setgid` 位，新文件和目录将接收创建进程的有效\
  \ GID。在其他可写目录上，粘滞位限制了删除操作仅允许文件所有者、目录所有者和 `root` 执行。\n\n- 更改 UID 和 GID 是相当复杂的。各种系统调用的语义多年年来发生了变化。仅更改其有效\
  \ UID/GID 的新应用程序应该使用 `seteuid()` 和 `setegid()`。非 `root` 应用程序也可以通过 `setuid()` 和 `setgid()`\
  \ 设置它们的有效 ID。来自 BSD 的 `setreuid()` 和 `setregid()` 调用旨在交换 UID 和 GID 值；但不建议在新程序中使用它们。\n\
  \n- 以 `root` 运行的应用可以使用 `setuid()` 和 `setgid()` 永久更改真实、有效和保存的 ID 值。一个例子是 `login`，它必须从以\
  \ `root` 运行的系统程序转换为以普通用户运行的非特权登录 shell。\n\n- 如果可用，应该 Linux 的 `setresuid()` 和 `setresgid()`\
  \ 函数，因为它们提供了最清晰、最可靠的行为。\n\n- 编写 setuid-`root` 应用不是新手的任务。如果你需要做此类事情，请先阅读安全问题；之前引用的来源是非常棒的。\n\
  \n### 练习\n\n1. 编写 `id` 命令的简单版本。它的作用是在标准输出打印用户 ID、组 ID 以及组名。当有效 ID 和真实 ID 不同时，两者都会被打印。例如：\n\
  \n```\n$ id\nuid=1000(arnold) gid=1000(arnold) groups=1000(arnold),4(adm),20(dialout),21(fax),...\n\
  ```\n\n其用法如下：\n\n```\nid [ user ]\nid -G [ -nr ] [ user ]\nid -g [ -nr ] [ user\
  \ ]\nid -u [ -nr ] [ user ]\n```\n\n带有 *user* 参数时，显示该用户的信息；否则，`id` 打印调用用户的信息。选项如下：\n\
  \n| `-G` | 仅以数值形式打印所有组值，不显示名称。 |\n| `-n` | 仅打印名称，不显示数值。适用于用户值和组值。 |\n| `-g` | 仅打印有效\
  \ GID。 |\n| `-r` | 打印真实 ID 而非有效 ID。 |\n| `-u` | 仅打印有效 UID。 |\n\n2. 编写一个名为 `sume`\
  \ 的简单程序，将其 setuid 设置为你自己。它应该提示输入密码（参见 `getpass`(3)），为了本次练习的目的，密码可以硬编码在程序源代码中。如果运行程序的人正确输入了密码，`sume`\
  \ 应该执行一个 shell。找另一个用户来帮你测试它。\n\n3. 你对将 `sume` 提供给你的朋友有什么感觉？提供给你的同学或同事呢？还是提供给你系统上的每个用户？\n\
  \n4. 使用 `faccessat()` 编写你自己的 `euidaccess()` 版本。考虑你编写该函数的不同方式，以及这些不同方法的优缺点。你是怎么做的？你为什么选择那种方式？\n\
  \n# 第 12 章\n\n## 资源限制\n\n本章涵盖资源限制。虽然今天的系统比原始的 Unix 系统（甚至是早期的 GNU/Linux 系统）大得多，但没有任何东西是无限供应。内存有限，磁盘有限，甚至文件大小也有最终限制。\n\
  \n## 12.1 引言\n\n任何系统有两种限制。首先是操作系统本身对所有用户和所有进程的限制。这些限制一些是静态的（从不改变），另一些可以是动态的。\n\n\
  静态限制的示例是进程可以拥的最大附加组 ID 数（参见第 11.2 节，“检索用户和组 ID](#ch11.xhtml_ch11lev1sec2)”，“第 385\
  \ 页](#ch11.xhtml_page_385)）。动态限制的示例是目录条目文件名的最大长度，这取决于目录所在文件系统的类型（参见第 8.1.2 节，“查看不同的文件系统类型](#ch08.xhtml_ch08lev2sec2)，“第\
  \ 224 页](#ch08.xhtml_page_224)）。\n\n接下来，还有每个进程和每个用户的限制，例如最大打开文件数，或一个用户可以同时运行的最大进程数。POSIX\
  \ 系统提供了查询所有此类限制限制值的函数。\n\nPOSIX 还提供了*选项*——即在给定系统上可能支持也可能不支持的功能。\n\n### 12.2 系统限制：`sysconf()`，`pathconf()`\
  \ 和 `fpathconf()`\n\n两个头文件和三个函数提供了访问系统限制信息的途径。\n\n### 12.2.1 工作原理\n\n首先，你的程序应该包含\
  \ `<limits.h>` 和 `<unistd.h>`。下一步需要理解的是，对于每个限制，都有两个定义的常量。第一个用于在编译时检查是否指定了限制，如果是，它会提供该限制的最小值。第二个常量用于调用\
  \ `sysconf()`、`pathconf()` 或 `fpathconf()`，用以在运行时查找实际的限制值。\n\n### 12.2.2 系统配置常量：`sysconf()`\n\
  \n`sysconf()` 告诉我们关于系统配置常量的信息：\n\n```\n#include <limits.h>                     \
  \       POSIX\n#include <unistd.h>\n\nint sysconf(int name);\n```\n\n让我们来看一个例子。`NGROUPS_MAX`\
  \ 和 `_SC_NGROUPS_MAX` 告诉我们进程可以拥有多少附加组 ID。以下程序检查了编译时和运行时值并打印了它们：\n\n```\n 1  /* ch-limits-ngroups.c\
  \ --- 确定我们可以拥有多少组 ID */\n 2\n 3  #include <stdio.h>\n 4  #include <errno.h>\n 5\
  \  #include <stdlib.h>\n 6  #include <string.h>\n 7  #include <limits.h>\n 8  #include\
  \ <unistd.h>\n 9\n10  int\n11  main(int argc, char **argv)\n12  {\n13      int compile_time_ngroups\
  \ = 0;\n14      int run_time_ngroups = 0;\n15  #ifdef NGROUPS_MAX\n16      compile_time_ngroups\
  \ = NGROUPS_MAX;\n17\n18      run_time_ngroups = sysconf(_SC_NGROUPS_MAX);\n19 \
  \     if (run_time_ngroups < 0) {\n20          fprintf(stderr, \"%s: 无法运行时信息: %s\\\
  n\",\n21                  argv[0], strerror(errno));\n22          exit(EXIT_FAILURE);\n\
  23      }\n24  #endif\n25      printf(\"compile_time_ngroups = %d, run_time_ngroups\
  \ = %d\\n\",\n26              compile_time_ngroups, run_time_ngroups);\n27\n28 \
  \     exit(EXIT_SUCCESS);\n29  }\n```\n\n\n\n\n用于检查的代码被括在 `#ifdef` 和 `#endif` 之间（第\
  \ 15–24 行）。如果定义 `NGROUPS_MAX` 未定义，我们知道附加组的数量为 0。如果它已定义，我们将 `compile_time_ngroups`\
  \ 设置为该值（第 16 行）。第 18 行通过调用 `sysconf()` 检查运行时值，第 19–23 行处理错误返回。最后，第 25–26 行打印这两个值。以下是我们系统上的运行结果：\n\
  \n```\n$ ch-limits-ngroups\ncompile_time_ngroups = 65536, run_time_ngroups = 65536\n\
  ```\n\n（哇！可能的组数量太多了！）\n\n表 12.1 列出了一些重要的系统配置常量及其代表含义。\n\n| **变量名** | **参数名** | **含义**\
  \ |\n| --- | --- | --- |\n| `ARG_MAX` | `_SC_ARG_MAX` | `exec()` 参数的最大长度。 |\n| `CHILD_MAX`\
  \ | `_SC_CHILD_MAX` | 每个用户 ID 的最大并发进程数。 |\n| `HOST_NAME_MAX` | `_SC_HOST_NAME_MAX`\
  \ | 主名的最大长度。 |\n| `LOGIN_NAME_MAX` | `_SC_LOGIN_NAME_MAX` | 用户名的最大长度。 |\n| `NGROUPS_MAX`\
  \ | `_SC_NGROUPS_MAX` | 附加组 ID 的最大数量。 |\n| `OPEN_MAX` | `_SC_OPEN_MAX` | 每个进程打开的文件最大数量。\
  \ |\n| `RE_DUP_MAX` | `_SC_RE_DUP_MAX` | 基本正则表达式中重复出现的最大次数。 |\n| `TZNAME_MAX` |\
  \ `_SC_TZNAME_MAX` | 时区名称的最大长度。 |\n| `_POSIX_VERSION` | `_SC_VERSION` | POSIX.1\
  \ 标准以 `YYYYMM`L 形式通过的年份和月份。这是系统声称符合的 POSIX 标准版本。这很重要，因为不同版本的标准具有不同的 API 和行为。 |\n\
  \n**表 12.1：** 重要的 POSIX 配置常量\n\n返回值并不像大多数情况那样简单，如下所示：\n\n* *发生了错误*\n  返回值为 `-1`，且\
  \ `errno` 将被设置以指示问题。\n* *请求的值是一个限制，但该限制是不确定的*\n  在这种情况下，返回值为 `-1` 但 `errno` 保持不变。为了将此情况与上一种区分开，你应该在调用\
  \ `sysconf()` 之前将 `errno` 设置为 0。\n* *请求的值代表一个选项*\n  正值表示支持该选项。否则返回 `-1`。（我们稍后会讨论选项。）\n\
  * *其他任何值*\n  任何其他返回值都是所请求限制的实际值。它不会小于对应编译时常量的值。\n\n#### 12.2.2.1 POSIX 选项\n\n`sysconf()`\
  \ 也可以用于确定可选功能是否可用。例如，我们可以测试在系统上是否可以使用 FORTRAN 和 C：\n\n```\n 1  /* ch-limits-langdev.c\
  \ --- 我们可以在这个系统上使用 FORTRAN 和 C 吗？ */\n 2\n 3  #include <stdio.h>\n 4  #include <errno.h>\n\
  \ 5  #include <stdlib.h>\n 6  #include <string.h>\n 7  #include <limits.h>\n 8 \
  \ #include <unistd.h>\n 9\n10  int\n11  main(int argc, char **argv)\n12  {\n13 \
  \ #ifdef _POSIX2_FORT_DEV\n14      long fortran = sysconf(_SC_2_FORT_DEV);\n15\n\
  16      printf(\"_POSIX2_FORT_DEV defined ...\\n\");\n17      printf(\"sysconf replies\
  \ about _SC_2_FORT_DEV: %ld\\n\", fortran);\n18  #else\n19      printf(\"No FORTRAN\
  \ available, sorry\\n\");\n20  #endif\n21  #ifdef _POSIX2_C_DEV\n22      long c_dev\
  \ = sysconf(_SC_2_C_DEV);\n23\n24      printf(\"_POSIX2_C_DEV defined ...\\n\");\n\
  25      printf(\"sysconf replies about _SC_2_C_DEV: %ld\\n\", c_dev);\n26  #else\n\
  27      printf(\"No C available, sorry (really?!?)\\n\");\n28  #endif\n29      exit(EXIT_SUCCESS);\n\
  30  }\n```\n\n这段代码非常直接。让我们看看编译并运行它会发生什么：\n\n```\n$ cc ch-limits-langdev.c -o ch-limits-langdev\
  \          编译它\n$ ch-limits-langdev                                    运行它\nNo FORTRAN\
  \ available, sorry                            并不意外\n_POSIX2_C_DEV defined ...  \
  \                            呼呼！C 是可用的\nsysconf replies about _SC_2_C_DEV: 200809\n\
  ```\n\n显然，这些测试在实践中用处不大。让我们看看编译并运行它会发生什么：（等一下，原文重复了某些部分，重点关注核心逻辑）。\n\n#### 12.2.3\
  \ 文件系统限制：`pathconf()` 和 `fconf()`\n\n`pathconf()` 和 `fconf()` 与 `sysconf()` 类似。对于\
  \ `pathconf()`，`path` 参数应该是一个目录。对于 `fconf()`，`fd` 参数应该是一个代表管道的文件描述符。\n\n这里是一个管道的程序示例：\n\
  \n```\n 1  /* ch-limits-pipe.c --- 能够原子地写入多少字节？ */\n 2\n 3  #include <stdio.h>\n\
  \ 4  #include <errno.h>\n 5  #include <stdlib.h>\n 6  #include <string.h>\n 7  #include\
  \ <limits.h>\n 8  #include <unistd.h>\n 9\n10  int\n11  main(int argc, char **argv)\n\
  12  {\n13      int compile_time_size = 0;\n14      long run_time_size = 0;\n15 \
  \ #ifdef _POSIX_PIPE_BUF\n16      compile_time_size = _POSIX_PIPE_BUF;\n17\n18 \
  \     run_time_size = pathconf(\".\", _PC_PIPE_BUF);\n19      if (run_time_size\
  \ < 0) {\n20          fprintf(stderr, \"%s: could not get runtime information\\\
  n\", argv[0], strerror(errno));\n21          exit(EXIT_FAILURE);\n22      }\n23\
  \  #endif\n24      printf(\"compile_time_size = %d, run_time_size = %ld\\n\",\n\
  25              compile_time_size, run_time_size);\n26\n27      exit(EXIT_SUCCESS);\n\
  28  }\n```\n\n以下是运行它时发生的情况：\n\n```\n$ ch-limits-pipe\ncompile_time_size = 512, run_time_size\
  \ = 4096\n```\n\n表 12.2 列出了你可以针对文件和路径进行测试的一些更有用的参数。\n\n| **变量名** | **参数名** | **含义**\
  \ |\n| --- | --- | --- |\n| `_POSIX_CHOWN_RESTRICTED` | `_PC_CHOWN_RESTRICTED` |\
  \ 需要 root 权限才能放弃所有权。 |\n| `_POSIX_LINK_MAX` | `_PC_LINK_MAX` | 指向文件的最大硬链接数。 |\n\
  | `_POSIX_NAME_MAX` | `_PC_NAME_MAX` | 在给定目录下创建的文件名的最大长度。 |\n| `_POSIX_NO_TRUNC`\
  \ | `_PC_NO_TRUNC` | 如果访问超过 `_POSIX_NAME_MAX` 的文件名返回错误，则为真。 |\n| `_POSIX_PATH_MAX`\
  \ | `_PC_PATH_MAX` | 从给定目录开始的相对路径的最大长度。 |\n| `_POSIX_PIPE_BUF` | `_PC_PIPE_BUF`\
  \ | 能够原子地写入管道或 FIFO 的最大字节数。 |\n\n## 12.3 获取配置字符串变量：`confstr()`\n\n\n\n配置变量是某种类型的字符串，它可以提供有用信息、指示如何以特定方式编译你的程序，或者提供在某些情况下使用的环境设置。（这是一个模糊的描述；稍后将会有更多详细信息。）`confstr()`\
  \ 函数提供了对定义的配置变量值的访问：\n\n```c\n#include <unistd.h>                            POSIX\n\
  \nsize_t confstr(int name, char *buffer, size_t len);\n```\n\n大多数配置变量与以不同方式编译 C\
  \ 程序时所需的标志（flags）有关：主要涉及 32 位指针或 64 位指针。它们并不具有通用的参考价值，因此我们不会对它们进行详细描述。有四个配置变量更具代表性：\n\
  \n*   `_CS_PATH`\n    为了访问符合 POSIX 标准的实用程序，在 `PATH` 中使用的值。该值通常是 `\"/bin:/usr/bin\"\
  `。\n*   `_CS_V7_ENV`\n    为了让实用程序以符合 POSIX 规范的方式运行而使用的环境变量和值。在 GNU/Linux 系统上，这通常是\
  \ `POSIXLY_CORRECT=1`。\n*   `_CS_GNU_LIBC_VERSION`\n    在 GLIBC 系统上，这是 GLIBC 版本的值。\n\
  *   `_CS_GNU_LIBPTHREAD_VERSION`\n    在 GLIBC 系统上，这是 `lpthread` 库版本的值。例如，“NPTL 2.39’。NPTL\
  \ 是“原生 POSIX 线程库”，GLIBC 已经使用了它大约二十多年。\n\n`_CS_V7_ENV` 中的 `V7` *并不*与 Unix 第 7 版本有关。相反，它与\
  \ POSIX 标准的第七版有关，该版本发布于 2018 年。在遵循 2024 年标准的的系统中，这些（以及我们即将看到的其他变量）在名称中使用了 `V8`。\n\
  \n以下程序 `ch-limits-confstr.c` 获取并打印了 POSIX 标准配置值的值，以及上述的两个 GLIBC 特有值：\n\n```c\n 1\
  \  /* ch-limits-confstr.c --- 演示 confstr(3) API */\n 2\n 3  #include <stdio.h>\n\
  \ 4  #include <errno.h>\n 5  #include <stdlib.h>\n 6  #include <string.h>\n 7  #include\
  \ <limits.h>\n 8  #include <unistd.h>\n 9\n10  struct config_var {\n11      int\
  \ value;\n12      const char *name;\n13  } config_vars[] = {\n14      // 使用 _CS_POSIX_V7_xxx\
  \ 而不是 _CS_POSIX_V8_xxx，是因为\n15      // 2024 POSIX 标准在本书时太新了。请参正文。\n16      { _CS_PATH,\
  \ \"_CS_PATH\" },\n17      { _CS_POSIX_V7_ILP32_OFF32_CFLAGS, \"_CS_POSIX_V7_ILP32_OFF32_CFLAGS\"\
  \ },\n18      { _CS_POSIX_V7_ILP32_OFF32_LDFLAGS, \"_CS_POSIX_V7_ILP32_OFF32_LDFLAGS\"\
  \ },\n19      { _CS_POSIX_V7_ILP32_OFF32_LIBS, \"_CS_POSIX_V7_ILP32_OFF32_LIBS\"\
  \ },\n20      { _CS_POSIX_V7_ILP32_OFFBIG_CFLAGS, \"_CS_POSIX_V7_ILP32_OFFBIG_CFLAGS\"\
  \ },\n21      { _CS_POSIX_V7_ILP32_OFFBIG_LDFLAGS, \"_CS_POSIX_V7_ILP32_OFFBIG_LDFLAGS\"\
  \ },\n22      { _CS_POSIX_V7_ILP32_OFFBIG_LIBS, \"_CS_POSIX_V7_ILP32_OFFBIG_LIBS\"\
  \ },\n23      { _CS_POSIX_V7_LP64_OFF64_CFLAGS, \"_CS_POSIX_V7_LP64_OFF64_CFLAGS\"\
  \ },\n24      { _CS_POSIX_V7_LP64_OFF64_LDFLAGS, \"_CS_POSIX_V7_LP64_OFF64_LDFLAGS\"\
  \ },\n25      { _CS_POSIX_V7_LP64_OFF64_LIBS, \"_CS_POSIX_V7_LP64_OFF64_LIBS\" },\n\
  26      { _CS_POSIX_V7_LPBIG_OFFBIG_CFLAGS, \"_CS_POSIX_V7_LPBIG_OFFBIG_CFLAGS\"\
  \ },\n27      { _CS_POSIX_V7_LPBIG_OFFBIG_LDFLAGS, \"_CS_POSIX_V7_LPBIG_OFFBIG_LDFLAGS\"\
  \ },\n28      { _CS_POSIX_V7_LPBIG_OFFBIG_LIBS, \"_CS_POSIX_V7_LPBIG_OFFBIG_LIBS\"\
  \ },\n29  //  { _CS_POSIX_V7_THREADS_CFLAGS, \"_CS_POSIX_V7_THREADS_CFLAGS\" },\
  \    // 我们的 GLIBC 中不存在\n30  //  { _CS_POSIX_V7_THREADS_LDFLAGS, \"_CS_POSIX_V7_THREADS_LDFLAGS\"\
  \ },\n31      { _CS_POSIX_V7_WIDTH_RESTRICTED_ENVS, \"_CS_POSIX_V7_WIDTH_RESTRICTED_ENVS\"\
  \ },\n32      { _CS_V7_ENV, \"_CS_V7_ENV\" },\n33      { _CS_GNU_LIBC_VERSION, \"\
  _CS_GNU_LIBC_VERSION\" },\n34      { _CS_GNU_LIBPTHREAD_VERSION, \"_CS_GNU_LIBPTHREAD_VERSION\"\
  \ },\n35      { -1, NULL },\n36  };\n37\n38  int\n39  main(int argc, char **argv)\n\
  40  {\n41      char *buf = NULL;\n42      size_t n;\n43      int i;\n44\n45    \
  \  for (i = 0; config_vars[i].name != NULL; i++) {\n46          if (buf != NULL)\n\
  47              free(buf);\n48\n49          n = confstr(config_vars[i].value, NULL,\
  \ 0);\n50          buf = malloc(n);\n51          if (buf == NULL) {\n52        \
  \      fprintf(stderr, \"%s: could not allocate memory: %s\\n\",\n53           \
  \           argv[0], strerror(errno));\n54              exit(EXIT_FAILURE);\n55\
  \          }\n56          confstr(config_vars[i].value, buf, n);\n57          printf(\"\
  %s = %s\\n\", config_vars[i].name, buf);\n58      }\n59      if (buf != NULL)\n\
  60          free(buf);\n61\n62      exit(EXIT_SUCCESS);\n63  }\n```\n\n以下程序 `ch-limits-confstr.c`\
  \ 获取并打印了 POSIX 标准配置值的值，以及上述的两个 GLIBC 特有值：\n\n```\n$ ch-limits-confstr\n_CS_PATH\
  \ = /bin:/usr/bin\n_CS_POSIX_V7_ILP32_OFF32_CFLAGS = \n_CS_POSIX_V7_ILP32_OFF32_LDFLAGS\
  \ = \n_CS_POSIX_V7_ILP32_OFF32_LIBS = \n_CS_POSIX_V7_ILP32_OFFBIG_CFLAGS = \n_CS_POSIX_V7_ILP32_OFFBIG_LDFLAGS\
  \ = \n_CS_POSIX_V7_ILP32_OFFBIG_LIBS = \n_CS_POSIX_V7_LP64_OFF64_CFLAGS = \n_CS_POSIX_V7_LP64_OFF64_LDFLAGS\
  \ = \n_CS_POSIX_V7_LP64_OFF64_LIBS = \n_CS_POSIX_V7_LPBIG_OFFBIG_CFLAGS = \n_CS_POSIX_V7_LPBIG_OFFBIG_LDFLAGS\
  \ = \n_CS_POSIX_V7_LPBIG_OFFBIG_LIBS = \n_CS_POSIX_V7_WIDTH_RESTRICTED_ENVS = \n\
  _CS_V7_ENV = POSIXLY_CORRECT=1\n_CS_GNU_LIBC_VERSION = glibc 2.39\n_CS_GNU_LIBPTHREAD_VERSION\
  \ = NPTL 2.39\n```\n\n## 12.4 基础进程限制：`ulimit()`\n\n你可能熟悉 shell 中的 `ulimit` 命令。该命令检索和或设置某些限制。它的名称源于\
  \ `ulimit*(2)` 系统调用。该调用在 POSIX 标准中已过时，不再出现在 2024 年的标准中。然而，它被广泛实现，你可能会在旧代码遇到它。由于它已过时，我们仅简要讨论，不提供示例代码：\n\
  \n```c\n#include <ulimit.h>                               Common\n\nlong ulimit(int\
  \ cmd);                     检索限制\nlong ulimit(int cmd, newlimit);           设置限制\n\
  ```\n\n在这里，`cmd` 表示感兴趣的限制。设置限制时必须提供第二个参数。当 V 首次引入此调用时，手册页仅列出了 `cmd` 的数值。幸运的是，现在\
  \ `cmd` 有符号常量：\n\n*   `UL_GETFSIZE` `(1)`\n    返回大小限制，以 512 字节为单位。\n*   `UL_SETFSIZE`\
  \ `(2)`\n    设置大小限制。同样以 512 字节为单位。\n*   `UL_GMEMLIM` `(3)`\n    返回数据段的最大可能地址（堆；见第\
  \ 3.1 节,“Linux/Unix 地址空间,”第 51 页)）。这在 GNU/Linux 上未实现，也没有提供符号常量。\n*   `UL_GDESLIM`\
  \ `(4)`\n    返回当前进程可以打开的最大文件数。这在 GNU/Linux 上实现了，但 GLIBC 未提供符号常量。\n\n### 硬限制软限制：`getrlimit()`\
  \ 和 `setrlimit()`\n\n在 BSD Unix 开发期间，系统比现在要小得多，而且由许多并发用户共享。资源控制在这些系统中非常重要，特别（但不限于）学术环境。因此，BSD\
  \ 开发者创建了一种比 `ulimit()` 复杂得多的设施。\n\n\n\n首先，它们定义了一系列限制，例如 CPU、内存、文件大小等。其次，它们引入了`软限制`（soft\
  \ limits）和`硬限制`（hard limits）的概念。通常情况下，软限制是由内核强制执行的。普通（非超级用户）进程可以提高或降低资源的软限制，但不能超过硬限制的值。此类进程还可以（不可逆地）降低其硬限制。超级用户进程则可以随所欲地操作这些限制。\n\
  \n更改后的限制会被从更改限制的进程中启动的任何后续进程继承。\n\n有一个系统调用用于获取限制，另一个用于设置限制：\n\n```\n#include <sys/resource.h>\
  \                           POSIX\n\nint getrlimit(int resource, struct rlimit *rlp);\n\
  int setrlimit(int resource, const struct rlimit *rlp);\n```\n\n`resource` 的标准值如下：\n\
  \n| 限制 | 含义 |\n| --- | --- |\n| `RLIMIT_AS` | 进程地址空间的最大大小。 |\n| `RLIMIT_CORE` |\
  \ 核心文件（core file）的最大大小，以字节为单位（参见第 17.3.1 节，“获取 `core` 文件”、第 594 页”）。限制为零将防止创建核心文件。\
  \ |\n| `RLIMIT_CPU` | 进程可以使用 CPU 时间的最大量，单位为秒。 |\n| `RLIMIT_DATA` | 进程数据段的最大大小。 |\n\
  | `RLIMIT_FSIZE` | 进程可以创建的文件最大大小，以字节为单位。 |\n| `RLIMIT_NOFILE` | 进程同时打开的文件最大数量。 |\n\
  | `RLIMIT_STACK` | 初始线程栈的最大大小。（我们在本书中不讨论线程。） |\n\nGNU/Linux 提供了许多额外的资源：\n\n| 限制\
  \ | 含义 |\n| --- | --- |\n| `RLIMIT_LOCKS` | 进程可以拥有的 `flock`(2) 和 `fcntl`(2) 锁的最大数量。这适用于旧版本的内核（2.4.0\
  \ 到 2.4.24）。 |\n| `RLIMIT_MEMLOCK` | 进程锁定到物理内存的最大字节数。 |\n| `RLIMIT_MSGQUEUE` | 可为\
  \ POSIX 消息队列分配的最大字节数。 |\n| `RLIMIT_NICE` | “进程 nice 值可以提高到的上限”。 |\n| `RLIMIT_NPROC`\
  \ | 进程的真实用户 ID 可以同时运行的线程最大数量。 |\n| `RLIMIT_RSS` | 进程驻存集（驻留在物理内存中的虚拟内存字节数）的最大字节数。\
  \ |\n| `RLIMIT_RTPRIO` | 进程实时优先级的上限（一项高级功能）。 |\n| `RLIMIT_RTTIME` | 实时调度进程在进行系统调用之前可以运行的最长微秒数（也是高级功能）。\
  \ |\n| `RLIMIT_SIGPENDING` | 为调用进程的真实用户 ID 队列的最大信号数量。 |\n\n一个 `struct rlimit` 结构如下：\n\
  \n```\nstruct rlimit {\n    rlim_t rlim_cur;  /* 软限制 */\n    rlim_t rlim_max;  /*\
  \ 硬限制 (rlim_cur 的上限) */\n};\n```\n\n`rlim_t` 类型是适合你系统的相应大小整数类型。\n\n一个特殊的限制值 `RLIM_INFINITY`\
  \ 表示该特定限制实际上是无限的。这个值应该比任何可能的实际限制都大。\n\n以下程序 `ch-limits-showlimits.c` 打印 POSIX 标准限制的软限制和硬限制：\n\
  \n```\n 1  /* ch-limits-showlimits.c --- 显示当前限制 */\n 2\n 3  #include <stdio.h>\n\
  \ 4  #include <errno.h>\n 5  #include <stdlib.h>\n 6  #include <string.h>\n 7  #include\
  \ <limits.h>\n 8  #include <unistd.h>\n 9  #include <sys/resource.h>\n10\n11  struct\
  \ limit_var {\n12      int value;\n13      const char *name;\n14  } limit_vars[]\
  \ = {\n15      { RLIMIT_AS, \"RLIMIT_AS\" },\n16      { RLIMIT_CORE, \"RLIMIT_CORE\"\
  \ },\n17      { RLIMIT_CPU, \"RLIMIT_CPU\" },\n18      { RLIMIT_DATA, \"RLIMIT_DATA\"\
  \ },\n19      { RLIMIT_FSIZE, \"RLIMIT_FSIZE\" },\n20      { RLIMIT_NOFILE, \"RLIMIT_NOFILE\"\
  \ },\n21      { RLIMIT_STACK, \"RLIMIT_STACK\" },\n22      { -1, NULL },\n23  };\n\
  24\n25  int\n26  main(int argc, char **argv)\n27  {\n28      int i;\n29      struct\
  \ rlimit limits;\n30\n31      for (i = 0; limit_vars[i].name != NULL; i++) {\n32\
  \          if (getrlimit(limit_vars[i].value, & limits) < 0) {\n33             \
  \ fprintf(stderr, \"%s: could not get limit for %s: %s\\n\",\n34               \
  \       argv[0], limit_vars[i].name,\n35                      strerror(errno));\n\
  36              continue;\n37          }\n38          printf(\"%s: soft limit: %lu,\
  \ hard limit: %lu\\n\",\n39                  limit_vars[i].name, limits.rlim_cur,\
  \ limits.rlim_max);\n40      }\n41\n42      exit(EXIT_SUCCESS);\n43  }\n```\n\n\
  在我们的系统上运行时，我们会看到以下内容：\n\n```\n$ ch-limits-showlimits\nRLIMIT_AS: soft limit: 18446744073709551615,\
  \ hard limit: 18446744073709551615\nRLIMIT_CORE: soft limit: 18446744073709551615,\
  \ hard limit: 18446744073709551615\nRLIMIT_CPU: soft limit: 18446744073709551615,\
  \ hard limit: 18446744073709551615\nRLIMIT_DATA: soft limit: 18446744073709551615,\
  \ hard limit: 18446744073709551615\nRLIMIT_FSIZE: soft limit: 18446744073709551615,\
  \ hard limit: 18446744073709551615\nRLIMIT_NOFILE: soft limit: 18446744073709551615,\
  \ hard limit: 18446744073709551615\nRLIMIT_STACK: soft limit: 18446744073709551615,\
  \ hard limit: 18446744073709551615\n```\n\n更改后的限制会被从更改限制的进程中启动的任何后续进程继承。\n\n（注：由于原文中重复出现了两次“Changed\
  \ limits are inherited...”的段落，此处根据注意事项要求仅保留一处翻译。）\n\n有一个系统调用用于获取限制，另一个用于设置限制：\n\n\
  ```\n#include <sys/resource.h>                           POSIX\n\nint getrlimit(int\
  \ resource, struct rlimit *rlp);\nint setrlimit(int resource, const struct rlimit\
  \ *rlp);\n```\n\n`resource` 的标准值如下：\n\n| 限制 | 含义 |\n| --- | --- |\n| `RLIMIT_AS`\
  \ | 进程地址空间的最大大小。 |\n| `RLIMIT_CORE` | 核心文件（core file）的最大大小，以字节为单位（参见第 17.3.1 节，“获取\
  \ `core` 文件”、第 594 页”）。限制为零将防止创建核心文件。 |\n| `RLIMIT_CPU` | 进程可以使用 CPU 时间的最大量，单位为秒。\
  \ |\n| `RLIMIT_DATA` | 进程数据段的最大大小。 |\n| `RLIMIT_FSIZE` | 进程可以创建的文件最大大小，以字节为单位。 |\n\
  | `RLIMIT_NOFILE` | 进程同时打开的文件最大数量。 |\n| `RLIMIT_STACK` | 初始线程栈的最大大小。（我们在本书中不讨论线程。）\
  \ |\n\nGNU/Linux 提供了许多额外的资源：\n\n| 限制 | 含义 |\n| --- | --- |\n| `RLIMIT_LOCKS` | 进程可以拥有的\
  \ `flock`(2) 和 `fcntl`(2) 锁的最大数量。这适用于旧版本的内核（2.4.0 到 2.4.24）。 |\n| `RLIMIT_MEMLOCK`\
  \ | 进程锁定到物理内存的最大字节数。 |\n| `RLIMIT_MSGQUEUE` | 可为 POSIX 消息队列分配的最大字节数。 |\n| `RLIMIT_NICE`\
  \ | “进程 nice 值可以提高到的上限”。 |\n| `RLIMIT_NPROC` | 进程的真实用户 ID 可以同时运行的线程最大数量。 |\n| `RLIMIT_RSS`\
  \ | 进程驻存集（驻留在物理内存中的虚拟内存字节数）的最大字节数。 |\n| `RLIMIT_RTPRIO` | 进程实时优先级的上限（一项高级功能）。 |\n\
  | `RLIMIT_RTTIME` | 实时调度进程在进行系统调用之前可以运行的最长微秒数（也是高级功能）。 |\n| `RLIMIT_SIGPENDING`\
  \ | 为调用进程的真实用户 ID 队列的最大信号数量。 |\n\n一个 `struct rlimit` 结构如下：\n\n```\nstruct rlimit\
  \ {\n    rlim_t rlim_cur;  /* 软限制 */\n    rlim_t rlim_max;  /* 硬限制 (rlim_cur 的上限)\
  \ */\n};\n```\n\n`rlim_t` 类型是适合你系统的相应大小整数类型。\n\n一个特殊的限制值 `RLIM_INFINITY` 表示该特定限制实际上是无限的。这个值应该比任何可能的实际限制都大。\n\
  \n以下程序 `ch-limits-showlimits.c` 打印 POSIX 标准限制的软限制和硬限制：\n\n```\n 1  /* ch-limits-showlimits.c\
  \ --- 显示当前限制 */\n 2\n 3  #include <stdio.h>\n 4  #include <errno.h>\n 5  #include\
  \ <stdlib.h>\n 6  #include <string.h>\n 7  #include <limits.h>\n 8  #include <unistd.h>\n\
  \ 9  #include <sys/resource.h>\n10\n11  struct limit_var {\n12      int value;\n\
  13      const char *name;\n14  } limit_vars[] = {\n15      { RLIMIT_AS, \"RLIMIT_AS\"\
  \ },\n16      { RLIMIT_CORE, \"RLIMIT_CORE\" },\n17      { RLIMIT_CPU, \"RLIMIT_CPU\"\
  \ },\n18      { RLIMIT_DATA, \"RLIMIT_DATA\" },\n19      { RLIMIT_FSIZE, \"RLIMIT_FSIZE\"\
  \ },\n20      { RLIMIT_NOFILE, \"RLIMIT_NOFILE\" },\n21      { RLIMIT_STACK, \"\
  RLIMIT_STACK\" },\n22      { -1, NULL },\n23  };\n24\n25  int\n26  main(int argc,\
  \ char **argv)\n27  {\n28      int i;\n29      struct rlimit limits;\n30\n31   \
  \   for (i = 0; limit_vars[i].name != NULL; i++) {\n32          if (getrlimit(limit_vars[i].value,\
  \ & limits) < 0) {\n33              fprintf(stderr, \"%s: could not get limit for\
  \ %s: %s\\n\",\n34                      argv[0], limit_vars[i].name,\n35       \
  \               strerror(errno));\n36              continue;\n37          }\n38\
  \          printf(\"%s: soft limit: %lu, hard limit: %lu\\n\",\n39             \
  \     limit_vars[i].name, limits.rlim_cur, limits.rlim_max);\n40      }\n41\n42\
  \      exit(EXIT_SUCCESS);\n43  }\n```\n\n在我们的系统上运行时，我们会看到以下内容：\n\n```\n$ ch-limits-showlimits\n\
  RLIMIT_AS: soft limit: 18446744073709551615, hard limit: 18446744073709551615\n\
  RLIMIT_CORE: soft limit: 18446744073709551615, hard limit: 18446744073709551615\n\
  RLIMIT_CPU: soft limit: 18446744073709551615, hard limit: 18446744073709551615\n\
  RLIMIT_DATA: soft limit: 18446744073709551615, hard limit: 18446744073709551615\n\
  RLIMIT_FSIZE: soft limit: 18446744073709551615, hard limit: 18446744073709551615\n\
  RLIMIT_NOFILE: soft limit: 18446744073709551615, hard limit: 18446744073709551615\n\
  RLIMIT_STACK: soft limit: 18446744073709551615, hard limit: 18446744073709551615\n\
  ```\n\n设置限制是直接的。你填充一个 `struct rlimit` 以请求的软限制和硬限制，并将其指针传递给 `setrlimit()`：\n\n```\n\
  int resource = RLIMIT_xxx;          要更改的限制\nstruct rlimit limit;\nlimit.rlim_cur\
  \ = ...                新的软限制值\nlimit.rlim_max = ...                硬限制值\n\nif (setrlimit(resource,\
  \ &limit) < 0) {\n    fprintf(stderr, \"Could not set limit: %s\\n\",\n        strerror(errno));\n\
  }\n...\n```...\n\n## 12.6 总结\n\n* 尽管程序应遵循“无任意限制”原则，但在实践中，任何系统总有一些物理限制。特别是在嵌入式系统中，意识到这些是有益的。\n\
  * 有些限制是静态不变的。另一些是动态的，取决于进程的状况。还有针对特定用户的限制。\n* `sysconf()`、`pathconf()` 提供了访问各种限制的方法，具有编译时检查（#ifdef）和运行时检查。可选功能的检查可以让你确定它们是否可用。\n\
  * `confstr()` 返回配置变量的字符串值，这些提供了有用的信息或控制。只有少数对日常工作非常有用。\n* `ulimit()` 是获取和设置某些进程限制的原始\
  \ System V 调用。它被认为过时多年，但其遗产体现在相关的 内置命令 `ulimit` 的名称中。\n* BSD 调用 `getrlimit()` 和\
  \ `setrlimit()` 定义了比 `ulimit()` 更广泛的限制，并使用了软限制和硬限制的概念。这些是你自己的程序应该使用的。\n\n### 练习题\n\
  \n1. 查看 `getconf` (1) 手页。审查 `sysconf`(3)、`pathconf`(3) 和 `confstr`(3) 手页。编写你自己的\
  \ `getconf` 版本。\n2. `getconf` 在大多数 GNU/Linux 系统中随 GLIBC 源码一起提供。书中 GitHub 仓库包含副本。审查它。它与你的版本相比如何？\n\
  3. 增强 `ch-limits-showlimits.c`，以更符合用户习惯的方式打印大值，例如 KB、MB 和 GB。\n4. 编写一个可以更改限制的程序。即使你的程序不是内置内置的，更改限制是否有效？你可以通过比较运行程序前后\
  \ shell 的 `ulimit` 命令的输出来检查。\n\n\n\n\n5. （困难，或者至少很耗时。）在你的系统上安装一个系统模拟器，如 `SimH`^(3)。在模拟的\
  \ DEC VAX 11/780 上启动 4.3 BSD。探索你所能的限制。你可能需要使用带有内置 `limit` 命令的 `csh` shell 来完成此操作，或者你也可以编写一个简单的\
  \ C 程序。对于后者，请注意默认编译器 `cc` 是针对 K&R C 的，而不是 ANSI/ISO C。\n\n^(3) [`https://simh.trailing-edge.com/`](https://simh.trailing-edge.com/)\n\
  \n# 第 13 章\n\n## 通用库接口——部分 2\n\n第 6 章，“通用库接口——部分 1](#ch06.xhtml_ch06)”，“第 155 页](#ch06.xhtml_page_155)\
  \ 介绍了第一组通用库 API。从某种意义上说，这些 API 支持对 Linux 和 Unix 系统管理的基础对象的操作：时间、文件的用户和组，以及排序和搜索。\n\
  \n这一章的内容更加丰富；这里涵盖的 API 之间没有特别的联系。然而，它们对于日常 Linux/Unix 编程都是有用的。我们的介绍从简单、更通用的 API\
  \ 转向更复杂、更专用的 API。\n\n## 13.1 断言语句：`assert()`\n\n*断言*（assertion）是你对程序执行过程中在某些特定时间点上程序状态做出的陈述。在编程中使用断言最初是由\
  \ C. A. R. Hoare 开发的。^(1) 其核心思想是“程序验证”的一部分：当你设计和开发一个程序时，你可以通过对程序代码的效果做出经过仔细推理的陈述，来证明它是正确的。通常，这类陈述是关于*不变性*（invariants）的——即关于程序状态的、在一段代码执行期间期间应该保持为真的事实。\n\
  \n^(1) 然而，在 1981 年的 ACM 图灵奖演讲中，Hoare 博士指出，Alan Turing 本人推广了这一想法。\n\n断言对于描述两种不变性特别有用：*前置条件*（preconditions）和*后置条件*（postconditions）；这些条件是在代码段执行之前或之后必须成立的条件。前置条件和后置条件的一个简单例子是线性搜索：\n\
  \n```\n/* lsearch --- 返回数组中对应值的索引，如果未找到则返回 -1 */\n\nint\nlsearch(int *array, size_t\
  \ size, int value)\n{\n    size_t i;\n\n    /* precondition: array != NULL */\n\
  \    /* precondition: size > 0 */\n    for (i = 0; i < size; i++)\n        if (array[i]\
  \ == value)\n            return i;\n\n    /* postcondition: i == size */\n\n   \
  \ return -1;\n}\n```\n\n这个示例使用注释来说明这些条件。但如果能够通过代码来测试这些条件，难道不是更好吗？这就是 `assert()`\
  \ 宏的任务：\n\n```\n#include <assert.h>                                            \
  \   ISO C\n\nvoid assert(scalar expression);\n```\n\n当*标量表达式*（scalar expression）为假时，`assert()`\
  \ 宏会打印诊断信息并退出程序（使用 `abort()` 函数；参见第 13.4 节，“自杀：`abort()`](#ch13.xhtml_ch13lev1sec4)”，“第\
  \ 434 页](#ch13.xhtml_page_434)）。`ch-general2-assert.c` 再次提供了 `lsearch()` 函数，这次带有断言和一个\
  \ `main()` 函数：\n\n```\n 1  /* ch-general2-assert.c --- 断言 */\n 2\n 3  #include <stdio.h>\n\
  \ 4  #include <assert.h>\n 5\n 6  /* lsearch --- 返回数组中对应值的索引，如果未找到则返回 -1 */\n 7\n\
  \ 8  int\n 9  lsearch(int *array, size_t size, int value)\n10  {\n11      size_t\
  \ i;\n12\n13      assert(array != NULL);\n14      assert(size > 0);\n15      for\
  \ (i = 0; i < size; i++)\n16          if (array[i] == value)\n17              return\
  \ i;\n18\n19      assert(i == size);\n20\n21      return -1;\n22  }\n23\n24  /*\
  \ main --- 测试断言 */\n 25\n26  int\n27  main(void)\n28  {\n29  #define NELEMS 4\n\
  30      static int array[NELEMS] = { 1, 17, 42, 91 };\n31      int index;\n32\n\
  33      index = lsearch(array, NELEMS, 21);\n34      assert(index == -1);\n35\n\
  36      index = lsearch(array, NELEMS, 17);\n37      assert(index == 1);\n38\n39\
  \      index = lsearch(NULL, NELEMS, 10);  /* 不会返回 */\n40\n41      printf(\"index\
  \ = %d\\n\", index);\n42\n43      return 0;\n44  }\n```\n\n当编译并运行后，第 13 行的断言会“触发”：\n\
  \n```\n$ ch-general2-assert                                运行程序\nch-general2-assert:\
  \ ch-general2-assert.c:13: lsearch: Assertion ‘array != NULL' failed.\nAborted (core\
  \ dumped)\n```\n\n`assert()` 的信息因系统而异。对于 GNU/Linux 上的 GLIBC，信息包含程序名、源代码文件名和行号、函数名，然后是失败断言的文本。\n\
  \n“`Aborted (core dumped)`”信息意味着 `ch-general2-assert` 创建了一个 `core` 文件——即进程在死亡之前其地址空间的快照。^(2)\
  \ 该文件稍后可以使用调试器使用；参见第 17.3 节，“GDB 基础](#ch17.xhtml_ch17lev1sec3)”，“第 593 页](#ch17.xhtml_page_593)。创建\
  \ core 文件是 `assert()` 的一个有意的副作用；其假设是发生了非常严重的错误，你将希望用调试器检查程序以确定原因。\n\n^(2) 该文件的具体位置在不同的\
  \ GNU/Linux 系统中。关于在哪里找到它的讨论推迟到了第 17.3.1 节，“获取 `core` 文件](#ch17.xhtml_ch17lev2sec1)”，“第\
  \ 594 页](#ch17.xhtml_page_594)。\n\n你可以通过使用命令行选项 `-DNDEBUG` 编译程序来禁用断言。当该宏在包含 `<assert.h>`\
  \ 之前定义时，`assert()` 宏将展开为什么都不执行的代码。例如：\n\n```\n$ cc -DNDEBUG=1 ch-general2-assert.c\
  \ -o ch-general2-assert     使用 -DNDEBUG 编译\n$ ch-general2-assert               \
  \                            运行它\nSegmentation fault (core dumped)\n```\n\n在这里，我们得到了真正的\
  \ core dump！我们知道断言被禁用了；没有“断言失败”的消息。那么发生了什么？考虑 `lsearch()` 的第 16 行，当从 `main()` 的第\
  \ 39 行调用时。在这种情况下，`array` 变量为 `NULL`。通过 `NULL` 指针访问内存是一个错误。（从技术上说，各种标准将引用 `NULL`\
  \ 指针时的情况留为“未定义”。大多数现代系统的做法与 GNU/Linux 相同：通过向其发送 `SIGSEGV` 信号来杀死进程；这反过来产生 core dump。这一过程描述在第\
  \ 10 章，“信号](#ch10.xhtml_ch10)，“第 333 页](#ch10.xhtml_page_33)。）\n\n这种情况引发了一个关于断言的重要论点。程序员经常会错误地使用断言*代替*运行时错误检查。在我们案例中，对\
  \ `array != NULL` 的测试应该是运行时检查：\n\n```\nif (array == NULL)\n    return -1;\n```\n\
  \n对 `size > 0` 的测试（第 14 行）问题较小；如果 `size` 为 `0`，循环不会执行且 `lsearch()`（正确地）返回 `-1`。（事实上，这个断言是不需要的，因为代码正确处理了\
  \ `size == 0` 的情况。`size` 的类型是 `size_t`，这是一个无符号类型。）\n\n关闭断言的逻辑是额外的检查会减慢程序性能，因此在程序的生产版本中应该禁用它们。然而，C.\
  \ A. R. Hoare 提出了这一观察：\n\n最后，在调试运行中进行极其详尽的安全检查是荒谬的，因为对结果不予信任；而在生产运行中移除这些检查，因为错误的结果可能会导致昂贵或灾难性的后果。我们会如何看待一个在陆地上训练时戴着救生衣的航海爱好者，一旦进入大海就脱掉它呢？^(3)\n\
  \n\n\n\n\n# 3 节自*语言设计中的提示*。参参见第 13.9 节，“建议阅读](#ch13.xhtml_ch13lev1sec9)”、第 467 页获取完整引用。\n\
  \n考虑到这些观点，我们的建议谨慎地使用断言（assertions）。首先，对于任何给定的断言，考虑它是否应该改为运行时检查。其次，要仔细放置断言，这样即使在程序的生产版本中，你也不会介意开启断言检查。\n\
  \n最后，我们引用 GNU/Linux `assert(3)` 手页中“BUGS”部分的以下内容：\n\n`assert()` 被实现为一个宏；如果所测试的表达式具有副作用，程序的行为将取决于是否定义了\
  \ `NDEBUG` 而不同。这可能会产生“海森堡虫”（Heisenbugs），它们在开启调试时会消失。\n\n物理学中海森堡著名的不确定性原理表明，你对粒子速度测得越精确，对其位置的确定就越不精确，反之亦然。用俗的话说，它意味着观测粒子的行为本身就会影响它。\n\
  \n与粒子物理无关的类似现象也发生在编程中：为了调试而编译程序或在开启调试的情况下运行程序，可能会改变程序的行为。特别是，原始的 bug 可能会消失。这种 bug\
  \ 俗称为*海森堡虫*（heisenbug）。\n\n手页警告我们不要在 `assert()` 调用中放入带有副作用的表达式：\n\n```\nassert(*p++\
  \ == '\\n'); own\n```\n\n这里的副作用是指针 `p` 作为测试的一部分被递增了。当定义了 `NDEBUG` 时，表达式参数会从源代码中*消失*；它永远不会被执行。这可能导致意外之外的失败。然而，一旦为了调试重新启用断言，一切又恢复正常工作了！这类问题在追踪时非常痛苦。\n\
  \n## 13.2 低级内存：`memXXX()` 函数\n\n几个函数为处理任意内存块提供了低级服务。它们的名称都以前缀 `mem` 开头：\n\n```\n\
  #include <string.h>                                             ISO C\n\nvoid *memset(void\
  \ *buf, int val, size_t count);\nvoid *memcpy(void *dest, const void *src, size_t\
  \ count);\nvoid *memmove(void *dest, const void *src, size_t count);\nvoid *memccpy(void\
  \ *dest, const void *src, int val, size_t count);\nint memcmp(const void *buf1,\
  \ const void *buf2, size_t count);\nvoid *memchr(const void *buf, int val, size_t\
  \ count);\n```\n\n### 13.2.1 设置内存：`memset()`\n\n`memset()` 函数将值 `val`（被视为 `unsigned\
  \ char`）拷贝到 `buf` 的前 `count` 个字节。它对于清零动态内存块特别有用：\n\n```\nvoid *p = malloc(count);\n\
  if (p != NULL)\n    memset(p, 0, count);\n```\n\n然而，`memset()` 可以用于任何类型的内存，而不仅仅是动态内存。返回值是第一个参数：`buf`。\n\
  \n### 13.2.2 拷贝内存：`memcpy()`、`memmove()` 和 `memccpy()`\n\n三个函数将一个内存块拷贝到另一个。前两个在处理*重叠*内存区域时的方式有所不同；第三个拷贝内存但在遇到特定值时停止：\n\
  \n*   `void *memcpy(void *dest, const void *src, size_t count)`\n\n    这是最简单的函数。它从\
  \ `src` 拷贝 `count` 个字节到 `dest`。它不处理重叠的内存区域。它返回 `dest`。\n\n*   `void *memmove(void\
  \ *dest, const void *src, size_t count)`\n\n    与 `memcpy()` 类似，它也从 `src` 拷贝 `count`\
  \ 个字节到 `dest`。然而，它可以处理重叠的内存区域。它返回 `dest`。\n\n*   `void *memccpy(void *dest, const\
  \ void *src, int val, size_t count)`\n\n    它从 `src` 拷贝字节到 `dest`，在将 `val` 拷贝到 `dest`\
  \ 后或在拷贝 `count` 个字节后均停止。如果找到了 `val`，它返回一个指向 `dest` 中 `val` 放置位置之后位置的指针。否则，返回 `NULL`。\n\
  \n现在，重叠内存有什么问题？考虑图 13.1。\n\n![Images](img/fig13-001.jpg)\n\n**图 13.1：** 重叠拷贝\n\n\
  目标是将 `data[0]` 到 `data[3]` 中的四个 `struct xyz` 实例拷贝到 `data[3]` 到 `data[6]`。`data[3]`\
  \ 是这里的问题所在；从 `data[0]` 开始在内存中向前移动的逐字节拷贝会在 `data[3]` 被安全拷贝到 `data[6]` 之前覆盖它！（也可以设出一种场景，即通过内存进行后向拷贝会破坏重叠的数据。）\n\
  \n`memcpy()` 函数是最初用于拷贝内存块的 System V API；它对于重叠内存块的行为并没有特别规定某一种方式。对于 1990 年的 C 标准，委员会认为这种缺乏定义的行为是一个问题；因此他们发明了\
  \ `memmove()`。为了历史兼容性，`memcpy()` 被原样保留，其重叠内存的行为被特别说明为未定义，而发明了 `memmove()` 来提供一个能够正确处理问题情况的例程。\n\
  \n在你自己的代码中应该用哪一个？对于一个不知道所传入内存区域的库函数，你应该使用 `memmove()`。这样，你可以保证对于“知道”两个区域不重叠的应用级代码，使用\
  \ `memcpy()` 是安全的。\n\n对于 `memcpy()` 和 `memmove()`（与 `strcpy()` 一样），目标缓冲区是第一个参数，源是第二个。为了记住这一点，请注意其顺序与赋值语句相同：\n\
  \n```\ndest = src;\n```\n\n（许多系统上的手页并没有帮助，它们提供的原型为‘`void *memcpy(void *buf1, void\
  \ *buf2, size_t n)`’，并依赖文字描述来解释哪个是哪个。幸运的是，GNU/Linux 手页使用了更好的名称。）\n\n### 13.2.3 比较内存块：`memcmp()`\n\
  \n`memcmp()` 函数比较两个任意数据缓冲区的 `count` 个字节。它的返回值类似于 `strcmp()`：如果第一个缓冲区小于、等于或大于第二个缓冲区，则返回负值、零或正值。\n\
  \n你可能会想，“为什么不用 `strcmp()` 来此类比较呢？”这两个函数之间的区别是 `memcmp()` 不关心零字节（`\\0` 字符串终止符）。因此，当你需要比较任意数据时，`memcmp()`\
  \ 是应该使用的函数。\n\n`memcmp()` 的另一个优势是它比典型的 C 实现快得多：\n\n```\n/* memcmp --- 示例实现，不可用于实际\
  \ */\n\nint\nmemcmp(const void *buf1, const void *buf2, size_t count)\n{\n    const\
  \ unsigned char *cp1 = (const unsigned char *) buf1;\n    const unsigned char *cp2\
  \ = (const unsigned char *) buf2;\n    int diff;\n\n    while (count-- != 0) {\n\
  \        diff = *cp1++ - *cp2++;\n        if (diff != 0)\n            return diff;\n\
  \    }\n\n    return 0;\n}\n```\n\n这种速度可能是由于许多架构支持的特殊“块内存比较”指令，或者是由于以大于字节的单位进行比较。（后者操作非常复杂，最好留给库作者处理。）\n\
  \n由于这些原因，你*应该总是*使用库版本的 `memcmp()` 而不是自己实现。极率库作者比你更了解机器。\n\n### 13.2.4 搜索字节值：`memchr()`\n\
  \n`memchr()` 函数类似于 `strchr()` 函数：它返回任意缓冲区内特定值的位置。与 `memcmp()` 与 `strcmp()` 类似，使用\
  \ `memchr()` 的主要原因是你可以处理任意二进制数据。\n\n通常，GNU `sort` 对行进行排序。然而，使用 `-z` 选项时，它期望“行”是零终止的字符串。为此，它使用\
  \ `memchr()` 在它读取的每个输入缓冲区内部查找行终止符：\n\n\n\n\n\n```c\n1813          /* Find and record\
  \ each line in the just-read input.  */\n1814          while ((p = memchr (ptr,\
  \ eol, ptrlim - ptr)))\n            {\n             …\n```\n\n`eol` 变量将是 `’\\n’`\
  \ 或零。\n\n## 13.3 临时文件\n\n`临时文件`（temporary file）顾如其名：在程序运行时，它持有着在程序退出后不再需要的数据。一个极佳的例子是\
  \ `sort` 程序。如果命令行上没有指定文件名，或者你使用‘-’作为文件名，`sort` 会读取标准输入。然而，`sort` 在输出排序后的结果之前，必须读取*所有*输入数据。（想一下这一点，你就会发现它是真的。）在读取标准输入时，数据必须存储在某处，直到\
  \ `sort` 能够对其进行排序；这正是临时文件的完美用例。`sort` 也使用临时文件来存储中间排序结果。\n\n令人惊讶的是，有*七种*不同的用于创建临时对象（文件或目录）的标准函数。其中三个通过创建表示（推测是）唯一文件名的字符串来工作。正如我们将看到的，这些通常应该被避免。其他几个通过创建并打开临时对象来工作；这些函数是优的。\n\
  \n#### 13.3.1 生成临时文件名（不推荐）\n\n有三个函数的目的是创建一个唯一的、不存在的文件的*名称*。一旦你拥有了这样一个文件名，就可以用它来创建一个临时文件。由于名称是唯一的，你“保证”了对该文件的独占使用。以下是函数声明：\n\
  \n```c\n#include <stdio.h>\n\nchar *tmpnam(char *s);                           \
  \          ISO C\nchar *tempnam(const char *dir, const char *pfx);           Common\n\
  char *mktemp(char *template);                              ISO C\n```\n\n这些函数都提供了相同主题的不同变体：它们填充或创建一个缓冲区，其中包含唯一临时文件名的路径。文件的唯一性在于，在函数创建并返回该名称时，该名称的文件并不存在。这些函数的工作如下：\n\
  \n* `char *tmpnam(char *s)`：生成一个唯一文件名。如果 `s` 不是 `NULL`，其大小应至少为 `L_tmpnam` 字节，并将唯一名称拷贝到其中。如果\
  \ `s` 是 `NULL`，名称在内部 `static` 缓冲区中生成，该缓冲区可以在后续调用中被覆盖。路径的目录前缀将是 `P_tmpdir`。`P_tmpdir`\
  \ 和 `L_tmpnam` 都定义在 `<stdio.h>` 中。\n\n* `char *tempnam(const char *dir, const char\
  \ *pfx)`：类似于 `tmpnam()`，但允许指定目录前缀。如果 `dir` 是 `NULL`，则使用 `P_tmpdir`。参数 `pfx` 如果不是\
  \ `NULL`，指定最多五个字符作为文件名的开头字符。`tempnam()` 为其生成的分配分配存储。这些存储稍后可以通过 `free()` 释放。\n\n\
  * `char *mktemp(char *template)`：根据模板生成唯一文件名。`template` 的最后六个字符必须是‘XXXXXX’；这些字符将被替换为唯一的后缀。每次调用时的结果都是不同的。\n\
  \n**注意**\n\n`mktemp()` 的 `template` 参数会在原地被覆盖。因此，它*不应*是一个字符串常量。许多旧标准 C 编译器会将字符串常量连同普通的全局变量一起放入数据段。尽管在源代码中被定义为常量，但它们是*可写的*；因此，类似下面的代码并不罕见：\n\
  \n```c\n/* 旧式代码：不要这样做。 */\nchar *tfile = mktemp(\"/tmp/myprogXXXXXX\");\n… 使用 tfile\
  \ …\n```\n\n在现代系统上，此类代码可能会失败；如今的字符串常量位于内存的只读段中。\n\n使用这些函数非常简单。文件 `ch-general2-mktemp.c`\
  \ 演示了 `mktemp()`；改为使用其他函数并不困难：\n\n```c\n 1  /* ch-general2-mktemp.c --- 演示 mktemp()\
  \ 的简单用法。\n 2                              为了简洁省略了错误检查 */\n 3\n 4  #include <stdio.h>\n\
  \ 5  #include <fcntl.h>  /* 用于 open 标志 */\n 6  #include <limits.h> /* 用于 PATH_MAX\
  \ */\n 7  #include <stdlib.h>\n 8  #include <string.h>\n 9  #include <unistd.h>\n\
  10\n11  /* main --- 演示 mktemp() */\n12\n13  int\n14  main(void)\n15  {\n16     \
  \ static const char template[] = \"/tmp/myfileXXXXXX\";\n17      char fname[PATH_MAX];\n\
  18      static char mesg[] =\n19          \"Here's lookin' at you, kid!\\n\";  /*\
  \ 优于 \"hello, world\" */\n20      int fd;\n21\n22      strcpy(fname, template);\n\
  23      mktemp(fname);\n24\n25      /* 竞态条件窗口开启 */\n26\n27      printf(\"Filename\
  \ is %s\\n\", fname);\n28\n29      /* 竞态条件窗口持续到此处 */\n30\n31      fd = open(fname,\
  \ O_CREAT|O_RDWR|O_TRUNC, 0600);\n32      ssize_t junk = write(fd, mesg, strlen(mesg));\n\
  33      close(fd);\n34\n35      /* unlink(fname); */\n36\n37      return 0;\n38\
  \  }\n```\n\n`template` 变量（第 16 行）定义了文件名模板；‘XXXXXX’将被替换为唯一值。第 22 行将模板拷贝到 `fname`，`fname`\
  \ 不是 `const` 的：它是可以被修改的。第 23 行调用 `mktemp()` 生成文件名，第 27 行打印它以便我们看到它是什么。（稍后我们将解释第\
  \ 25 行和第 29 行的注释。）\n\n第 31 行打开文件，如果必要则创建它。第 32 行写入 `mesg` 中的消息，第 33 行关闭文件。（再次，我们使用\
  \ `junk` 变量来避免编译器警告。）在一个在我们完成工作后应该删除文件的程序中，第 35 行就不会被注释掉。（有时，临时文件不应该被取消链接——例如，如果文件在完全写后将进行重命名。）我们将其注释掉，以便我们能够运行此程序并在之后查看文件。以下是程序运行时运行时发生的情况：\n\
  \n```bash\n$ ch-general2-mktemp                       运行程序\nFilename is /tmp/myfileOwMi4K\
  \              打印文件名\n$ cat /tmp/myfileOwMi4K\nHere's lookin' at you, kid!     \
  \           内容是我们预期的\n$ ls -l /tmp/myfileOwMi4K                  所有者和权限也是\n-rw-------\
  \ 1 arnold arnold 28 Feb 16 15:50 /tmp/myfileOwMi4K\n$ rm /tmp/myfileOwMi4K    \
  \                 删除它\n$ ch-general2-mktemp                       同一个文件名被重用了吗？\n\
  Filename is /tmp/myfileW6roou              没有。那很好。\n$ cat /tmp/myfileW6roou    \
  \                再次检查内容\nHere's lookin' at you, kid!\n$ ls -l /tmp/myfileW6roou\
  \                  再次检查所有者和权限\n-rw------- 1 arnold arnold 28 Feb 16 15:50 /tmp/myfileW6roou\n\
  ```\n\n一切看起来都运行良好。`mktemp()` 返回了一个唯一的名称，`ch-general2-mktemp` 以正确的权限创建了文件，且内容如预期所示。那么所有这些函数的问题所在哪里？\n\
  \n从历史上来说，`mktemp()` 使用简单的、*可预测的*算法来生成模板中‘XXXXXX’的替换字符。此外，从文件名*生成*的时间到文件本身被*创建*的时间之间的间隔产生了竞态条件。\n\
  \n这是怎么的？Linux 和 Unix 系统使用*时间分片*，这是一种在所有执行进程之间共享处理器的技术。这意味着，尽管一个程序*看起来*一直在运行，但实际上在某些时候进程处于*睡眠*状态——即在等待在处理器上运行。\n\
  \n现在，考虑一个教授用于跟踪学生成绩的程序。教授和一名恶意的学生同时在使用一个负载很重的多用户系统。教授的程序使用 `mktemp()` 创建临时文件，而该学生在过去观察过评分程序创建和删除临时文件，已经破解了\
  \ `mktemp()` 使用的算法。（GLIBC 版本没有这个问题，但并非所有系统都使用 GLIBC！）[图 13.2] 插明了竞态条件以及该学生如何利用它。\n\
  \n![Images](img/fig13-002.jpg)\n\n\n\n\n\n## 图 13.2: 使用 `mktemp()` 的竞态条件\n\n以下是发生的情况：\n\
  \n1. 评分程序使用 `mktemp()` 生成一个文件名。在 `mktemp()` 返回后，竞态条件窗口现在打开了（位于 `ch-general2-mktemp.c`\
  \ 的第 25 行）。\n\n2. 内核停止了评分程序，以便系统上的其他程序可以运行。这发生在调用 `open()` 之前。\n   当评分程序停止时，学生使用与\
  \ `mktemp()` 返回给评分程序的相同的名称创建了文件。（记住，这个算法很容易推断出来。）学生在创建文件时还为其添加了一个额外的链接，这样当评分程序取消链接（unlink）该文件时，该文件仍然可供查阅。\n\
  \n3. 评分程序现在打开文件并向其写入数据。学生创建文件时具有 `-rw-rw-rw-` 权限，因此这并不是问题。\n\n4. 当评分程序结束时，它取消了临时文件的链接。然而，学生仍然拥有一份拷贝，并可能有提前向同学出售成绩的获利机会。\n\
  \n我们的示例是非常简单的；除了窃取成绩数据外，聪明的（尽管是不道德的）学生可能能够直接修改数据（如果文件是可写的）。如果教授不反复检查他们程序的结果，将没有人会察觉。\n\
  \n### 注意事项\n\n**我们不建议进行任何这些操作！** 如果你是一个学生，*不要尝试任何这些操作*。首先，这是不符合道德的。其次，这可能会导致你被踢出学校。第三，你的教授可能不会那么天真，竟然会使用\
  \ `mktemp()` 来编写他们的程序。该示例仅用于说明！\n\n由于上述及其他原因，本节描述的所有三个函数都应该应该被使用。（嗯，实际上，可能在某些时候\
  \ `mktemp()` 是你唯一的选择；我们将在下一节讨论这一点。）它们存在于 POSIX 和/或 GLIBC 中，仅仅是为了支持在理解这些例程危险性之前编写的旧程序。为此，GNU/Linux\
  \ 系统在链接时会生成警告：\n\n```\n$ cc ch-general2-mktemp.c -o ch-general2-mktemp\n/bin/ld:\
  \ /tmp/cckEiz1G.o: in function ‘main':\nch-general2-mktemp.c:(.text+0x4b): warning:\
  \ the use of ‘mktemp' is dangerous,\nbetter use ‘mkstemp' or ‘mkdtemp'\n```\n\n\
  （我们将在下一个小节介绍 `mkstemp()` 和 `mkdtemp()`。）\n\n### 13.3.2 创建和打开临时文件（良好方法）\n\n有四个没有竞态问题的函数。其中一个旨在用于\
  \ `<stdio.h>` 库：\n\n```\n#include <stdio.h>                                    \
  \  ISO C\n\nFILE *tmpfile(void);\n```\n\n第二个和第三个函数用于基于文件描述符的系统调用：\n\n```\n#include\
  \ <stdlib.h>                                     POSIX\n\nint mkstemp(char *template);\n\
  int mkostemp(char *template, int flag);\n```\n\n第四个函数创建一个唯一命名的目录：\n\n```\n#include\
  \ <stdlib.h>                                     POSIX\n\nchar *mkdtemp(char *template);\n\
  ```\n\n`tmpfile()` 返回一个代表唯一的、打开的临时文件的 `FILE *` 值。该文件以 `\"w+b\"` 模式打开。`w+` 意味着“打开以读写，首先截断文件”，而\
  \ `b` 意味着二进制模式，而不是文本模式。（在 GNU/Linux 或 Unix 系统上没有区别，但在其他系统上有区别。）当文件指针关闭时，文件会被删除；没有方法获取文件的名称来保存其内容。`ch-general2-tmpfile.c`\
  \ 中的程序演示了 `tmpfile()`：\n\n```\n/* ch-general2-tmpfile.c --- demonstrate tmpfile().\n\
  \                             为了简洁省略了错误检查 */\n\n#include <stdio.h>\n\nint\nmain(void)\n\
  {\n    static char mesg[] =\n        \"Here's lookin' at you, kid!\";  /* 胜过 \"\
  hello, world\" */\n    FILE *fp;\n    char buf[BUFSIZ];\n\n    fp = tmpfile(); \
  \                 /* 获取临时文件 */\n    fprintf(fp, \"%s\", mesg);         /* 写入 */\n\
  \    fflush(fp);                      /* 强制输出 */\n\n    rewind(fp);            \
  \          /* 移动到开头 */\n    char *junk;\n    junk = fgets(buf, sizeof buf, fp);\
  \  /* 读取内容 */\n\n    printf(\"Got back <%s>\\n\", buf);     /* 打印检索的数据 */\n\n  \
  \  fclose(fp);                     /* 关闭文件，消失 */\n    return 0;                \
  \       /* 全部完成 */\n}\n```\n\n返回的 `FILE *` 值与 `fopen()` 返回的任何其他 `FILE *` 没有区别。运行时，结果是如预期的那样：\n\
  \n```\n$ ch-general2-tmpfile\nGot back <Here's lookin' at you, kid!>\n```\n\n我们早些看到过\
  \ GLIBC 的作者推荐使用 `mkstemp()` 函数：\n\n```\n$ cc ch-general2-mktemp.c -o ch-general2-mktemp\n\
  /bin/ld: /tmp/cckEiz1G.o: in function ‘main':\nch-general2-mktemp.c:(.text+0x4b):\
  \ warning: the use of ‘mktemp' is dangerous,\nbetter use ‘mkstemp' or ‘mkdtemp'\n\
  ```\n\n该函数与 `mktemp()` 类似，它接受一个以 `XXXXXX` 结尾的文件名，并将这些字符替换为唯一后缀以创建一个唯一的文件名。然而，它又进了一步。它*创建并打开文件*。文件以模式\
  \ `0600`（即 `-rw-------`）创建。因此，只有运行程序的用户可以访问该文件。\n\n此外——这正是使 `mkstemp()` 更安全的原因——是使用\
  \ `O_EXCL` 标志创建的，这保证了文件不存在并防止任何其他人打开该文件。\n\n`mkostemp()` 就像 `mkstemp()`，不同在于你可以传递额外的标志传递给\
  \ `open()`。它是 2024 年 POSIX 标准中引入的。\n\n这两个函数的返回值都是一个可以用于读写的已打开的文件描述符。现在存储在传递给 `mkstemp()`\
  \ 的缓冲区中的路径名应该在完成工作后被用于删除该文件。这些内容在 `ch-general2-mkstemp.c` 中都得到了演示，它是对 `ch-general2-tmpfile.c`\
  \ 的直接修改：\n\n```\n/* ch-general2-mkstemp.c --- demonstrate mkstemp().\n         \
  \                    为了简洁省略了错误检查 */\n\n#include <stdio.h>\n#include <fcntl.h>  /*\
  \ 用于 open 标志 */\n#include <limits.h> /* 用于 PATH_MAX */\n#include <stdlib.h>\n#include\
  \ <string.h>\n#include <unistd.h>\n\n/* main --- 创建临时文件并进行测试 */\n\nint\nmain(void)\n\
  {\n    static const char template[] = \"/tmp/myfileXXXXXX\";\n    char fname[PATH_MAX];\n\
  \    static char mesg[] =\n        \"Here's lookin' at you, kid!\\n\";    /* 胜过\
  \ \"hello, world\" */\n    int fd;\n    char buf[BUFSIZ];\n    int n;\n\n    strcpy(fname,\
  \ template);            /* 拷贝模板 */\n    fd = mkstemp(fname);                /* 创建并打开临时文件\
  \ */\n    printf(\"Filename is %s\\n\", fname);  /* 打印信息 */\n    ssize_t junk;\n\
  \    junk = write(fd, mesg, strlen(mesg));   /* 向文件写入 */\n\n    lseek(fd, 0L, SEEK_SET);\
  \            /* 回到开头 */\n    n = read(fd, buf, sizeof(buf));     /* 读取数据；不是以 \\\
  0 结尾的！ */\n    printf(\"Got back: %.*s\", n, buf);   /* 打印以验证 */\n\n    close(fd);\
  \                          /* 关闭文件 */\n    unlink(fname);                      /*\
  \ 删除它 */\n\n    return 0;\n}\n```\n\n运行时，结果如预期的：\n\n```\n$ ch-general2-mkstemp\n\
  Filename is /tmp/myfileNNOIHm\nGot back: Here's lookin' at you, kid!\n```\n\n###\
  \ 13.3.3 使用 `TMPDIR` 环境变量\n\n\n\n\n许多标准工具都会关注 `TMPDIR` 环境变量，使用其命指定的目录作为存放临时文件的位置。如果未设置\
  \ `TMPDIR`，则临时文件的默认目录通常是 `/tmp`，尽管大多数现代系统也有 `/var/tmp` 目录。`/tmp` 中的所有文件和目录通常在系统启动时由管理\
  \ shell 脚本清理。\n\n该变量可以追溯到系统规模比现在小得多的时代。其设计理念是：`/tmp` 的空间可能不足以满足某些需求，如果其他地方有空间更大的文件系统，通过将\
  \ `TMPDIR` 指向其上的某个目录就可以让程序利用该空间。\n\n因此，如果你有对临时文件的需求，应该检查 `TMPDIR` 环境变量，并在它已设置时使用它。否则，回退到将临时文件存放在\
  \ `/tmp` 中。在自己的程序中使用 `TMPDIR` 是非常简单的。我们提供以下大纲：\n\n```\nconst char template[] = \"\
  myprog.XXXXXX\";\nchar *tmpdir, *tfile;\nsize_t count;\nint fd;\nif ((tmpdir = getenv(\"\
  TMPDIR\")) == NULL)               如果未设置 TMPDIR 值则\n    tmpdir = \"/tmp\";      \
  \                             否则，默认为 /tmp\ncount = strlen(tmpdir) + strlen(template)\
  \ + 2;         计算文件名的大小\ntfile = (char *) malloc(count);                       \
  \ 为之分配空间\nif (tfile == NULL)                                     检查错误\n    /* 恢复\
  \ */\n\nsnprintf(tfile, count, \"%s/%s\", tmpdir, template);     创建最终的模板\nfd = mkstemp(tfile);\
  \                                   创建并打开文件\n… 通过 fd 使用临时文件 …\nclose(fd);      \
  \                                       清理\nunlink(tfile);\nfree(tfile);\n```\n\n\
  根据你的应用程序需求，你可能希望在打开文件后立即将其取消链接（unlink），而不是在清理工作工作时才执行此操作。\n\n## 13.4 自杀：`abort()`\n\
  \n有时程序根本无法继续运行。通常情况下，最好的办法是生成错误消息并调用 `exit()`。然而，对于那些可能是编程问题的错误，不仅退出，还产生一个核心转储（core\
  \ dump）也是很有用的，它会将运行程序的状态保存到文件中，以便后续用调试器进行检查。这正是 `abort()` 函数的职责：\n\n```\n#include\
  \ <stdlib.h>                                    ISO C\n\nvoid abort(void);\n```\n\
  \n`abort()` 函数向进程本身发送一个 `SIGABRT` 信号。即使 `SIGABRT` 被阻塞或忽略，这种情况也会发生。随后，`SIGABRT` 的标准动作（产生核心转储）将会执行。\n\
  \n`abort()` 作用的一个示例是本章开头描述的 `assert()` 宏。当 `assert()` 发现其表达式为假时，它会打印错误消息，然后调用 `abort()`\
  \ 转储核心。\n\n根据 C 标准，`abort()` 是否执行任何清理工作取决于实现。`GLIBC` 版本不执行任何清理工作。同样，对于使用基于文件描述符的系统调用的打开文件，也不会进行处理。（如果所有打开的都是文件或管道，则不需要任何操作。网络连接——稍后在第\
  \ 14 章中讨论，“套接字与基础网络](#ch14.xhtml_ch14)”，第 473 页——也会由系统关闭，但你自己不关闭它们是不种糟糕的做法。）\n\n\
  ## 13.5 非局部 goto\n\n*直接去坐监狱。不要经过起点。不要领取那 200 美元。*\n\n——《大富翁》\n\n你无疑知道 `goto` 是什么：它将控制流转移到当前函数内部某处的某个标签。当节制使用时，`goto`\
  \ 语句有助于提高函数的可读性和正确性。（例如，当所有的错误检查都使用 `goto` 跳到函数末尾的标签（如 `clean_up`）时，该标签处的代码会进行清理工作[关闭文件，等]并返回。））当使用不当时，`goto`\
  \ 语句会导致所谓的“面条代码”，其逻辑变得无法追溯。\n\n`goto` 语句受到 C 语言的限制，只能跳转到当前函数内部的标签。算法尔语言（Algol）家族中的许多语言（如\
  \ Pascal）允许 `goto` 从嵌套函数中“跳出”到早之前的调用函数中。然而，在 C 语言中，通过语言语法本身没有方法跳转到另一个函数（即使是调用者）的位置。这种跳转被称为*非局部\
  \ goto*（nonlocal goto）。\n\n为什么非局部 goto 有用？考虑一个读取命令并处理命令的交互式程序。假设用户启动了一个耗时任务，感到沮丧或改变了执行任务的意愿，然后按下\
  \ CTRL-C 生成 `SIGINT` 信号。当信号处理程序运行时，它可以跳回主读取循环的开头。\n\n\n\n\n```\n662     case Node_K_while:\n\
  663         PUSH_BINDING(loop_tag_stack, loop_tag, loop_tag_valid);\n665       \
  \  stable_tree = tree;\n666         while (eval_condition(stable_tree->lnode)) {\n\
  667             INCREMENT(stable_tree->exec_count);\n668             switch (setjmp(loop_tag))\
  \ {\n669             case 0: /* normal non-jump */\n670                 (void) interpret(stable_tree->rnode);\n\
  671                 break;\n672             case TAG_CONTINUE:  /* continue statement\
  \ */\n673                 break;\n674             case TAG_BREAK: /* break statement\
  \ */\n675                 RESTORE_BINDING(loop_tag_stack, loop_tag, loop_tag_valid);\n\
  676                 return 1;\n677             default:\n678                 cant_happen();\n\
  679             }\n680         }\n681         RESTORE_BINDING(loop_tag_stack, loop_tag,\
  \ loop_tag_valid);\n682         break;\n```\n\n这段代码片段表示一个 `while` 循环。第 663 行通过保存的\
  \ `jmp_buf` 变量栈来管理嵌套循环。第 666–680 行运行 `while` 循环（使用了 C 语言的 `while` 循环！）。第 666 行测试循环条件。如果真，第\
  \ 668 行对 `setjmp()` 的返回值进行 `switch` 操作。如果是 `0`（第 669–671 行），则第 670 行执行语句体。然而，当 `setjmp()`\
  \ 返回 `TAG_CONTINUE` 或 `TAG_BREAK` 时，`switch` 语句会相应地处理它们（分别第 672–673 行和 674–676 行）。\n\
  \n`awk` 级别的 `break` 语句会将 `TAG_BREAK` 传递给 `longjmp()`，而 `awk` 级别的 `continue` 则传递\
  \ `TAG_CONTINUE`。同样，来自 `eval.c`，省略了一些无关细节：\n\n```\n812     case Node_K_break:\n\
  813         INCREMENT(tree->exec_count);\n           ...\n830             longjmp(loop_tag,\
  \ TAG_BREAK);\n831         break;\n832\n833     case Node_K_continue:\n834     \
  \    INCREMENT(tree->exec_count);\n           ...\n851             longjmp(loop_tag,\
  \ TAG_CONTINUE);\n852         break;\n```\n\n你可以将 `setjmp()` 视为放置标签，将 `longjmp()`\
  \ 视为 `goto`，其额外优点是能够知道代码是从哪里“来的”（通过返回值）。\n\n（作为一个顺带的问题，`gawk` 不再以刚刚所示的方式工作，但旧代码非常清楚地表达了我们的观点。）\n\
  \n### 13.5.2 处理信号掩码：`sigsetjmp()` 和 `siglongjmp()`\n\n由于某些可能会让你无聊到死的历史原因，1999 年的\
  \ C 标准对 `setjmp()` 和 `longjmp()` 对进程信号状态的影响保持沉默，而 POSIX 明确指出它们对进程信号掩码的影响（参见 Section\
  \ 10.6, “POSIX Signals”，第 350 页）是未定义的。\n\n换句话说，如果程序在第一次调用 `setjmp()` 和调用 `longjmp()`\
  \ 之间更改了进程信号掩码，那么在 `longjmp()` 之后进程信号掩码的状态是什么？是第一次调用 `setjmp()` 时有效的掩码？还是当前的掩码？POSIX\
  \ 明确表示：“无法得知。”\n\n为了让进程信号掩码的处理显式化，POSIX 引入了两个额外的函数和一个 `typedef`：\n\n```\n#include\
  \ <setjmp.h>                                            POSIX\n\nint sigsetjmp(sigjmp_buf\
  \ env, int savesigs);     注意：是 sigjmp_buf，不是 jmp_buf!\nvoid siglongjmp(sigjmp_buf\
  \ env, int val);\n```\n\n主要区别是 `sigsetjmp()` 的 `savesigs` 参数。如果不为零，则当前的阻塞信号集将被保存在\
  \ `env` 中，以及 `setjmp()` 会保存的其他环境。当 `savesigs` 为真时，带有 `env` 的 `siglongjmp()` 将恢复保存的进程信号掩码。\n\
  \n**注意**\n\nPOSIX 也明确指出，如果 `savesigs` 为零（假），进程信号掩码是否被保存和恢复是未定义的，就像 `setjmp()`/`longjmp()`\
  \ 一样。这反过来意味着，如果你打算使用 `sigsetjmp(env, 0)`，那大何费劲了：重点在于对进程信号掩码的保存和恢复进行控制！\n\n### 13.5.3\
  \ 注意一些重要的限制\n\n在使用 `setjmp()` 和 `longjmp()` 时，有多个技术限制需要注意。\n\n首先，因为环境的保存和恢复可能是混乱的、依赖于机器的任务，因此\
  \ `setjmp()` 和 `longjmp()` 允许被定义为宏。\n\n其次，C 标准将 `setjmp()` 的使用限制在以下情况：\n\n*   作为循环或条件语句（`if`,\
  \ `switch`）的唯一控制表达式。\n*   作为比较表达式（`==`, `<` 等）的一个操作数，另一个操作数是整数常量。该比较表达式可以是循环或条件语句的唯一控制表达式。\n\
  *   作为一元运算符 `!` 的操作数，其结果表达式是循环或条件语句的唯一控制表达式。\n*   作为表达式语句的整个表达式，并可能强制转换为 `void`。例如：\n\
  \n```\n(void) setjmp(buf);\n```\n\n第三，如果你想在调用 `setjmp()` 的函数中，在调用*之后*更改一个局部变量，并且希望该变量在\
  \ `longjmp()` 之后保持其最近一次赋值的值，你必须将该变量声明为 `volatile`。否则，在最初调用 `setjmp()` 之后更改的任何非 `volatile`\
  \ 局部变量都具有不确定的值。（注意 `jmp_buf` 变量本身不需要声明为 `volatile`。）例如：\n\n```\n 1  /* ch-general2-setjmp.c\
  \ ---  setjmp()/longjmp() 和 volatile. */\n 2\n 3  #include <stdio.h>\n 4  #include\
  \ <setjmp.h>\n 5\n 6  jmp_buf env;\n 7\n 8  /* comeback --- 执行 longjmp */\n 9\n\
  10 void\n11 comeback(void)\n12 {\n13     longjmp(env, 1);\n14     printf(\"This\
  \ line is never printed\\n\");\n15 }\n16\n17 /* main --- 调用 setjmp, 弄变量, 打印值 */\n\
  18\n19 int\n20 main(void)\n21 {\n22     int i = 5;\n23     volatile int j = 6;\n\
  24\n25     if (setjmp(env) == 0) {     /* 第一次调用 */\n26         i++;\n27        \
  \ j++;\n28         printf(\"first time: i = %d, j = %d\\n\", i, j);\n29        \
  \ comeback();\n30     } else              /* 第二次调用 */\n31         printf(\"second\
  \ time: i = %d, j = %d\\n\", i, j);\n32\n33     return 0;\n34 }\n```\n\n在这个示例中，只有\
  \ `j`（第 23 行）保证在第二次调用 `printf()` 时保持其值。`i`（第 22 行）的值根据 1999 年 C 标准是不确定的。它可能是 `6`，可能是\
  \ `5`，甚至可能是其他值！以下是我们在系统上得到的结果：\n\n```\n$ ch-general2-setjmp\nfirst time: i = 6,\
  \ j = 7\nsecond time: i = 5, j = 7\n```\n\n第四，正如 Section 13.5.2, “处理信号掩码：`sigsetjmp()`\
  \ 和 `siglongjmp()`，1999 年 C 标准对 `setjmp()` 和 `longjmp()` 对程序信号状态的影响没有任何陈述。如果这很重要，你必须使用\
  \ `sigsetjmp()` 和 `siglongjmp()`。\n\n第五，这些例程提供了巨大的内存泄漏潜力！考虑一个程序，其中 `main()` 调用 `setjmp()`，然后调用了几个嵌套函数，每个函数都使用\
  \ `malloc()` 分配动态内存。如果最深层的函数执行 `longjmp()` 回到 `main()`，那么动态内存的指针就会丢失。考虑 `ch-general2-memleak.c`：\n\
  \n\n\n\n\n```\n 1  /* ch-general2-memleak.c --- demonstrate memory leaks with setjmp()/longjmp().\
  \ */\n 2\n 3  #include <stdio.h>\n 4  #include <malloc.h>     /* for definition\
  \ of ptrdiff_t on GLIBC */\n 5  #include <setjmp.h>\n 6  #include <unistd.h>\n 7\n\
  \ 8  /*\n 9   * Run this on a Solaris or other traditional Unix system.\n10   *\
  \ GLIBC malloc() doesn't use sbrk!\n11   */\n12\n13  jmp_buf env;\n14\n15  void\
  \ f1(void), f2(void);\n16\n17  /* main --- leak memory with setjmp() and longjmp()\
  \ */\n18\n19  int\n20  main(void)\n21  {\n22      char *start_break;\n23      char\
  \ *current_break;\n24      ptrdiff_t diff;\n25\n26      start_break = sbrk((ptrdiff_t)\
  \ 0);\n27\n28      if (setjmp(env) == 0)       /* first time */\n29          printf(\"\
  setjmp called\\n\");\n30\n31      current_break = sbrk((ptrdiff_t) 0);\n32\n33 \
  \     diff = current_break - start_break;\n34      printf(\"memsize = %ld\\n\",\
  \ (long) diff);\n35\n36      f1();\n37\n38      return 0;\n39  }\n40\n41  /* f1\
  \ --- allocate some memory, make a nested call */\n42\n43  void\n44  f1(void)\n\
  45  {\n46      char *p = malloc(1024 * 1024);\n47\n48      f2();\n49  }\n50\n51\
  \  /* f2 --- allocate some memory, make longjmp */\n52\n53  void\n54  f2(void)\n\
  55  {\n56      char *p = malloc(1024 * 1024);\n58\n59      longjmp(env, 1);\n60\
  \  }\n```\n\n该程序使用 `setjmp()` 和 `longjmp()` 建立了一个无限循环。第 26 行使用 `sbrk()`（参见第 3.2.3\
  \ 节“系统调用：brk() 和 sbrk()`、第 72 页）来找到堆的当前起始位置，然后在第 28 行调用 `setjmp()`。第 31 行获取堆的当前起始位置；由于代码通过\
  \ `longjmp()` 重复进入，该位置每次都会发生变化。第 33–34 行计算分配了多少内存并打印该数量。以下是程序运行时的情况：\n\n```\n$ ch-general2-memleak\
  \                       运行该程序\nsetjmp called\nmemsize = 0\nmemsize = 2113536\nmemsize\
  \ = 4210688\nmemsize = 6307840\nmemsize = 8404992\nmemsize = 10502144\nmemsize =\
  \ 12599296\nmemsize = 14696448\n...\n```\n\n该程序像漏子一样内存内存。它会一直运行，直到从键盘中断或内存耗尽（此时它会产生一个巨大的核心转储）。\n\
  \n函数 `f1()` 和 `f2()` 分别分配了内存，而 `f2()` 通过 `longjmp()` 回到 `main()`（第 58 行）。一旦发生这种情况，指向已分配内存的*局部*指针（第\
  \ 46 行和第 56 行）就消失了！这种内存泄漏可能很难追踪，因为它们通常针对的是少量的内存，因此可能在字面上持续多年而不被察觉。（(注 4）。\n\n我们曾在\
  \ `gawk` 中遇到过这样的泄漏。幸运的是，它已经被修复了。\n\n这段代码显然是病态的，但它的目的是为了说明我们的观点：`setjmp()` 和 `longjmp()`\
  \ 会导致难以发现的内存泄漏。假设 `f1()` 在 `f2()` 调用并预期返回*后*正确地调用了 `free()`。那么内存永远不会被释放这一点将不再显而易见。在更大、更真实的程序中，`longjmp()`\
  \ 可能只由 `if` 语句调用，这种泄漏变得更加难以发现。\n\n在存在 `setjmp()` 和 `longjmp()` 的情况下，动态内存必须通过全局变量管理，并且必须拥有能够检测通过\
  \ `longjmp()` 进入的代码（通过检查 `setjmp()` 的返回值）。此类代码随后应该清理不再需要的动态分配内存。在大型程序中，你可能应该创建一个专门的函数和数据结构来管理动态内存，而不是在通过\
  \ `longjmp()` 返回时进行这些操作。\n\n（顺便说一下，我们在 Solaris 系统上运行了此程序。GLIBC 的 `malloc()` 不使用\
  \ `sbrk()`。尽管如此，所说明的观点仍然有效。）\n\n第六个警告是 `longjmp()` 和 `siglongjmp()` 不应该在任何用 `atexit()`\
  \ 注册的函数中使用（参见第 9.1.5.3 节“退出函数”、“第 290 页](#ch09.xhtml_page_290)）。\n\n第七，在具有大量寄存器的机器上，`setjmp()`\
  \ 和 `longjmp()` 可能是昂贵的操作。\n\n考虑到所有这些问题，你应该审视你的程序设计。如果你不需要使用 `setjmp()` 和 `longjmp()`，那么可能不使用它们会更好。然而，如果使用它们是构建你程序的最佳方式，请尽管使用，但要务必小心。\n\
  \n## 13.6 伪随机数\n\n许多应用需要随机数序列。例如，模拟掷骰子、发牌或转动老虎机轮子的游戏程序需要能够从一组可能的值中随机选择其中一个。（考虑 `fortune`\
  \ 程序，它拥有大量精辟的格言；它在每次被调用时都会“随机”打印出不同的格言。）许多加密算法也需要“高质量”的随机数。本节描述了获取随机数序列的不同方法。\n\n\
  **注意**\n\n随机性的本质、随机数的生成以及随机数的“质量”都是宽泛的话题，超出了本书的范围。我们提供了对可用 API 的介绍，但我们只能做到此了。请参见第\
  \ 13.9 节“建议阅读”、“第 467 页](#ch13.xhtml_page_467)”以获取更详细信息的来源。\n\n计算机在设计上是*确定性的*。相同的计算、相同的输入，每次都应该产生相同的输出。因此，它们并不擅长生成真正的随机数——即序列中的每个数字都完全独立于之前的数字（或多个数字）的序列。相反，在程序层面通常处理的数字类型被称为*伪随机*数。也就是说，在任何给定序列中，数字之间似乎是独立的，但整个序列是可重复的。（这种可重复性是一种资产；它提供了程序的整体确定性。）\n\
  \n许多产生伪随机数序列的方法通过对起始值（或“种子”）每次执行相同的计算来实现。随后，存储的种子值会被更新以供下次使用。API 提供了指定新种子的方法。每个初始种子产生相同的伪随机数序列，尽管不同的种子（应该）产生不同的序列。\n\
  \n### 13.6.1 标准 C：`rand()` 和 `srand()`\n\n```\n#include <stdlib.h>             \
  \                         ISO C\n\nint rand(void);\nvoid srand(unsigned int seed);\n\
  ```\n\n`rand()` 每次被调用时返回一个 `0` 到 `RAND_MAX`（包含边界，据我们从 C99 标准可知）之间的伪随机数。常量 `RAND_MAX`\
  \ 必须至少为 32767；它可以更大。\n\n`srand()` 使用 `seed` 为随机数生成器种子。如果应用程序从未调用过 `srand()`，`rand()`\
  \ 的行为就像初始种子为 `1`。\n\n以下程序 `ch-general2-rand.c` 使用 `rand()` 打印骰面：\n\n\n\n\n\n```c\n\
  \ 1  /* ch-general2-rand.c --- 使用 rand() 生成骰子点数 */\n 2\n 3  #include <stdio.h>\n\
  \ 4  #include <stdlib.h>\n 5\n 6  const char *die_faces[] = { /* ASCII 图形规则！ */\n\
  \ 7      \"       \",\n 8      \"   *   \",  /* 1 */\n 9      \"       \",\n10\n\
  11      \"       \",\n12      \" *   * \",  /* 2 */\n13      \"       \",\n14\n\
  15      \"       \",\n16      \" * * * \",  /* 3 */\n17      \"       \",\n18\n\
  19      \" *   * \",\n20      \"       \",  /* 4 */\n21      \" *   * \",\n22\n\
  23      \" *   * \",\n24      \"   *   \",  /* 5 */\n25      \" *   * \",\n26\n\
  27      \" * * * \",\n28      \"       \",  /* 6 */\n29      \" * * * \",\n30  };\n\
  31\n32  /* main --- 打印 N 个不同的骰子面 */\n33\n34  int\n35  main(int argc, char **argv)\n\
  36  {\n37      int nfaces;\n38      int i, j, k;\n39\n40      if (argc != 2) {\n\
  41          fprintf(stderr, \"usage: %s number-die-faces\\n\", argv[0]);\n42   \
  \       exit(EXIT_FAILURE);\n43      }\n44\n45      nfaces = atoi(argv[1]);\n46\n\
  47      if (nfaces <= 0) {\n48          fprintf(stderr, \"usage: %s number-die-faces\\\
  n\", argv[0]);\n49          fprintf(stderr, \"\\tUse a positive number!\\n\");\n\
  50          exit(EXIT_FAILURE);\n51      }\n52\n53      for (i = 1; i <= nfaces;\
  \ i++) {\n54          j = rand() % 6;     /* 强制范围为 0 <= j <= 5 */\n55          printf(\"\
  +-------+\\n\");\n56          for (k = 0; k < 3; k++)\n57              printf(\"\
  |%s|\\n\", die_faces[(j * 3) + k]);\n58          printf(\"+-------+\\n\\n\");\n\
  59      }\n60\n61      return EXIT_SUCCESS;\n62  }\n```\n\n该程序使用简单的 ASCII 图形来打印骰子面的轮廓。你在调用它时传入要打印的骰子面数。这在第\
  \ 45 行通过 `atoi()` 计算得出。（通常情况下，在生产代码中应避免使用 `atoi()`，因为它不进行错误或溢出检查，也不进行任何输入验证。）\n\n\
  关键行是第 54 行，它使用取模运算符 `%` 将 `rand()` 的返回值转换为零到五之间的数字。`j * 3` 的值作为 `die_faces` 数组的起始索引，对应组成每个骰子面的三个字符串。第\
  \ 55 行和第 58 行打印周围的上下边界线，第 56 行和第 57 行的循环打印骰面本身。运行时，它会产生如下输出：\n\n```\n$ ch-general2-rand\
  \ 2         打印两个骰子\n+-------+\n|       |\n| *   * |\n|       |\n+-------+\n\n+-------+\n\
  | *   * |\n|   *   |\n| *   * |\n+-------+\n```\n\n`rand()` 接口追溯到 V7 和 PDP-11。特别是在许多旧系统中，其结果仅是一个\
  \ 16 位数字，这严重限制了可以返回的数字范围。此外，它所使用的算法在现代标准下被认为是“弱”的。（GLIBC 版本的 `rand()` 没有这些问题，但在编写可移植代码时，需要意识到\
  \ `rand()` 并不是最佳使用的 API。）\n\n`ch-general2-rand.c` 使用了一种简单的技术来获取特定范围内的值：`%` 运算符。该技术使用了返回值的低位比特。\n\
  \n### `random()` 和 `srandom()` 函数\n\n`rand()` 接口追溯到 V7 和 PDP-11。特别是在许多旧系统中，其结果仅是一个\
  \ 16 位数字，这严重限制了可以返回的数字范围。此外，它所使用的算法在现代标准下被认为是“弱”的。（GLIBC 版本的 `rand()` 没有这些问题，但在编写可移植代码时，需要意识到\
  \ `rand()` 并不是最佳使用的 API。）\n\n`ch-general2-rand.c` 使用了一种简单的技术来获取特定范围内的值：`%` 运算符。该技术使用了返回值的低位比特。\n\
  \n### POSIX 扩展：`random()` 和 `srandom()`\n\nPOSIX 标准引入了 `random()` 和 `srandom()`，以提供比\
  \ `rand()` 更好的随机数生成器。\n\n```c\nlong random(void);\nvoid srandom(unsigned int seed);\n\
  char *initstate(unsigned int seed, char *state, size_t n);\nchar *setstate(char\
  \ *state);\n```\n\n### 使用 `state` 数组\n\n`random()` 系列族允许你管理随机数生成器的内部状态。当你需要生成独立的随机数序列时，这非常有用。\n\
  \n### 为随机数生成器种子\n\n为了确保你的程序每次运行时产生不同的随机数，你必须为生成器设置种子。一种常用方法是使用当前时间。\n\n```c\n  \
  \    (void) time(&now); /* 使用当天时间和 PID 设置种子 */\n      (void) initstate((unsigned\
  \ int) (now + getpid()), state, sizeof state);\n      (void) setstate(state);\n\
  ```\n\n\n\n\n\n`rand()` 和 `srandom()` 都是伪随机数生成器。对于相同的种子，它们的输出是可重现数字序列。某些应用程序（例如密码学）要求其随机数必须是（更）真正随机的。为此，Linux\
  \ 内核以及各种 BSD 和商业 Unix 系统都提供了特殊的设备文件，用于访问“熵池”（entropy pool），该熵池包含了内核从物理设备和其他源收集的随机位。这里有两个设备文件：\n\
  \n*   `/dev/urandom`\n    从此文件读取时，会等待内核熵池中有足够的随机数据后，再返回请求的长度的数据。该过程不会阻塞（即它不会让出 CPU）。\n\
  \n*   `/dev/random`\n    从此文件读取时，仅在熵池中估计的新的噪声位数范围内返回随机字节。如果位数不足，读取数据的进程可能会阻塞，直到有更多位可用。\n\
  \    `/dev/random` 被认为是一个遗留接口，你几乎应该总是使用 `/dev/urandom`。请参考 `random`(4) 手页，了解你可能仍然需要使用\
  \ `/dev/random` 的情况。\n\n如果你正准备编写高质量的加密算法，你应该先学习一下密码学和随机性；不要依赖这里浅显的介绍！这里再次给出我们的掷骰子程序，这次使用了\
  \ `/dev/urandom`：\n\n```\n 1  /* ch-general2-devrandom.c --- generate die rolls,\
  \ using /dev/urandom. */\n 2\n 3  #include <stdio.h>\n 4  #include <fcntl.h>\n 5\
  \  #include <stdlib.h>\n 6  #include <unistd.h>\n 7\n 8  const char *die_faces[]\
  \ = { /* ASCII graphics rule! */\n        … as before …\n32  };\n33\n34  /* myrandom\
  \ --- return data from /dev/urandom as unsigned long */\n35\n36  unsigned long\n\
  37  myrandom(void)\n38  {\n39      static int fd = -1;\n40      unsigned long data;\n\
  41\n42      if (fd == -1)\n43          fd = open(\"/dev/urandom\", O_RDONLY);\n\
  44\n45      if (fd == -1 || read(fd, & data, sizeof data) <= 0)\n46          return\
  \ random();    /* fall back */\n47\n48      return data;\n49  }\n50\n51  /* main\
  \ --- print N different die faces */\n52\n53  int\n54  main(int argc, char **argv)\n\
  55  {\n56      int nfaces;\n57      int i, j, k;\n58\n        … check args, compute\
  \ nfaces, as before …\n71\n72      for (i = 1; i <= nfaces; i++) {\n73         \
  \ j = myrandom() % 6;     /* force to range 0 <= j <= 5 */\n74          printf(\"\
  +-------+\\n\");\n75          for (k = 0; k < 3; k++)\n76              printf(\"\
  |%s|\\n\", die_faces[(j * 3) + k]);\n78          printf(\"+-------+\\n\");\n79 \
  \         putchar('\\n');\n80      }\n81\n82      return EXIT_SUCCESS;\n83  }\n\
  ```\n\n第 36–49 行提供了对 `/dev/urandom` 的函数调用接口，每次读取一个 `unsigned long` 长度的数据。代价是一个在整个程序生命周期内保持打开的文件描述符。\n\
  \n### 13.6.4 使用 `getrandom()` 代替 `/dev/urandom`\n\n最后，我们简要介绍 `getrandom()` 系统调用；它在\
  \ GNU/Linux 以及某些 BSD 系统（如 NetBSD 和 FreeBSD）可用：\n\n```\n#include <sys/random.h> \
  \                    Linux and others\n\nssize_t getrandom(void *buf, size_t buflen,\
  \ unsigned int flags);\n```\n\n参数为：\n\n*   `void *buf`\n    指向缓冲区的指针，`getrandom()`\
  \ 将将随机字节数据放入该缓冲区。默认是从与使用 `/dev/urandom` 相同的源获取数据。\n*   `size_t buflen`\n    `buf`\
  \ 的大小。\n*   `unsigned int flags`\n    可以是 `0`，或者是这些标志中一个或多个的位或组合：\n    *   `GRND_RANDOM`\n\
  \        从与 `/dev/random` 相同的源获取数据，而不是从 `/dev/urandom`。\n    *   `GRND_NONBLOCK`\n\
  \        如果可用数据不足，则不阻塞。而是返回 `–1` 并 `errno` 设置为 `EAGAIN`。\n\n成功后，`getrandom()` 返回放入\
  \ `buf` 的字节数。这可能小于 `buflen`，例如，如果调用被信号中断。\n\n示例程序 `ch-general2-getrandom.c` 与之前的程序仅区别在于\
  \ `myrandom()` 函数：\n\n```\n34  /* myrandom --- return data from getrandom() as unsigned\
  \ long */\n35\n36  unsigned long\n37  myrandom(void)\n38  {\n39      unsigned long\
  \ data;\n40      if (getrandom(&x data, sizeof(data), 0) != sizeof(data))\n41  \
  \        return random();    /* fall back */\n42\n43      return data;\n44  }\n\
  ```\n\n### 13.6.5 密码学安全的随机数\n\n在 GNU/Linux、macOS 和几个 BSD 系统上可用的三个函数提供了“密码学安全”的随机数：\n\
  \n```\n#include <stdlib.h>                     Linux, macOS, BSDs\n\nuint32_t arc4random(void);\n\
  uint32_t arc4random_uniform(uint32_t upper_bound);\nvoid arc4random_buf(void *buf,\
  \ size_t n);\n```\n\n它们的工作方式如下：\n\n*   `arc4random()`\n    返回一个均匀分布的 32 位整数值。\n\
  *   `arc4random_uniform(uint32_t upper_bound)`\n    返回一个小于 `upper_bound` 的均匀分布的\
  \ 32 位整数值。\n*   `arc4random_buf(void *buf, size_t n)`\n    将 `n` 字节伪随机数据放入 `buf`。\n\
  \n### 13.7 元殊字符扩展\n\n三组复杂度递增的函数集提供了匹配通配符的功能。许多程序需要此类函数。一个例子是 `find`：`find . -name\
  \ *.c -print`。另一个是接受排除通配符模式的许多程序的 `--exclude` 选项。\n\n#### 13.7.1 模式匹配：`fnmatch()`\n\
  \n我们从 `fnmatch()` 函数开始：\n\n```\n#include <fnmatch.h>                           \
  \    POSIX\n\nint fnmatch(const char *pattern, const char *string, int flags);\n\
  ```\n\n该函数根据 `pattern` 匹配 `string`，这是一个通配符模式。`flags` 值（稍后描述）会修改函数的行为。如果 `string`\
  \ 匹配 `pattern`，返回 0；如果发生错误，返回非零值。遗憾的是，POSIX 没有定义特定的错误；因此你只能知道发生了错误，不知道是什么。\n\n`flags`\
  \ 变量是表 13.1 中一个或多个标志的位或：\n\n| **标志名称** | **仅限 GLIBC** | **含义** |\n| --- | --- |\
  \ --- |\n| `FNM_CASEFOLD` | *✓* | 不区分大小写的匹配。 |\n| `FNM_EXTMATCH` | *✓* | 支持 `ksh`\
  \ 引入的扩展模式。见后文。 |\n| `FNM_FILE_NAME` | *✓* | 这是 `FNM_PATHNAME` 的 GNU 别名。 |\n| `FNM_LEADING\
  \ DIR` | *✓* | 这是 GLIBC 内部使用的标志；不要在程序中使用它。详情请参 *fnmatch*(3)。 |\n| `FNM_NOESCAPE`\
  \ | | 反斜杠是普通字符，而不是转义字符。 |\n| `FNM_PATHNAME` | | `string` 中的斜杠必须匹配 `pattern` 中的正斜杠；它不能被\
  \ `*`、`?` 或 `[...] ` 匹配。 |\n| `FNM_PERIOD` | | `string` 中的领先点仅在 `pattern` 也有领先点时才被匹配。点必须是\
  \ `string` 的第一个字符。然而，如果设置了 `FNM_PATHNAME`，斜杠后的点被视为领先点。 |\n\nKorn shell (`ksh`) 引入了一种扩展模式匹配表示，将扩展正则表达式的完整功能引入\
  \ Shell 通配符匹配。通过 `FNM_EXTMATCH` 标志，`fnmatch()` 也支持这些模式。扩展模式根据 *pattern-list* 定义，这是一个由\
  \ `||` 分隔的模式列表：\n\n*   `?(pattern-list)`\n    匹配 *pattern-list* 中任何模式的零次或一次。\n*\
  \   `*(pattern-list)`\n    匹配 *pattern-list* 中任何模式的零次或多次。\n*   `+(pattern-list)`\n\
  \    匹配 *pattern-list* 中任何模式的一次或多次出现。\n*   `@(pattern-list)`\n    匹配 *pattern-list*\
  \ 中任何模式的恰好一次出现。\n*   `!(pattern-list)`\n    不匹配 *pattern-list* 中的任何模式。\n\n\n\n\n\
  \n匹配不符合 `pattern-list` 中任何模式的项。\n\n`fnmatch()` 适用于任何来源的字符串；要匹配的字符串不需要是实际的文件名。但在实践中，你会会在使用\
  \ `readdir()` 读取目录条目的代码中使用 `fnmatch()`（见第 5.3.1 节，“基本目录读取](#ch05.xhtml_ch05lev2sec7)”、“第\
  \ 124 页](#ch05.xhtml_page_124)）：\n\n```\nstruct dirent dp;\nDIR *dir;\nchar pattern[100];\n\
  … 填充 pattern，打开目录，检查错误 ...\nwhile ((dp = readdir(dir)) != NULL) {\n    if (fnmatch(pattern,\
  \ dir->d_name, FNM_PERIOD) == 0)\n        /* 文件名匹配模式 */\n    else\n        continue;\
  \    /* 不匹配 */\n}\n```\n\nGNU `ls` 使用 `fnmatch()`来实现其 `--ignore` 选项。你可以提供多个要忽略的模式（通过多个选项）。`ls`\
  \ 会针对每个文件名测试所有模式。它是通过 `ls.c` 中的 `patterns_match()` 函数实现此点的：\n\n```\n3163  /* 如果\
  \ PATTERNS 之一匹配 FILE，则返回真。  */\n3164\n3165  static bool\n3166  patterns_match (struct\
  \ ignore_pattern const *patterns, char const *file)\n3167  {\n3168    struct ignore_pattern\
  \ const *p;\n3169    for (p = patterns; p; p = p->next)\n3170      if (fnmatch (p->pattern,\
  \ file, FNM_PERIOD) == 0)\n3171        return true;\n3172    return false;\n3173\
  \  }\n```\n\n### 注意事项\n\n如果 `fnmatch()` 在使用多字节字符集的 locale 中使用，它可能是一个开销很大的函数。我们将在第\
  \ 15.4 节，“你能帮我拼出来吗？](#ch15.xhtml_ch15lev1sec4)、“第 540 页](#ch15.xhtml_page_540)”中讨论多字节字符集。\n\
  \n### 13.7.2 文件名扩展：`glob()` 和 `globfree()`\n\n`glob()` 和 `globfree()` 函数比 `fnmatch()`\
  \ 更复杂：\n\n```\n#include <glob.h>                                             POSIX\n\
  \nint glob(const char *pattern, int flags,\n         int (*errfunc)(const char *epath,\
  \ int eerrno),\n         glob_t *pglob);\nvoid globfree(glob_t *pglob);\n```\n\n\
  `glob()` 函数执行目录扫描和通配符匹配，返回所有匹配 `pattern` 的路径名列表。通配符可以包含在路径名的多个位置，而不限于最后一个组件（例如‘/usr/*/*.so’）。参数如下：\n\
  \n* `const char *pattern`\n    要扩展的模式。\n* `int flags`\n    控制 `glob()` 行为的标志位，稍后将描述。\n\
  * `int (*errfunc)(const char *epath, int eerrno)`\n    指向用于报告错误的函数指针。该值可以为 `NULL`。如果它不是\
  \ `NULL`，且 `(*errfunc)()` 返回非零或在 `flags` 中设置了 `GLOB_ERR`，则 `glob()` 停止处理。\n    `(*errfunc)()`\
  \ 的参数是导致问题的路径名以及由 `opendir()`、`readdir()` 或 `stat()` 设置的 `errno` 值。\n* `glob_t *pglob`\n\
  \    指向用于持有结果的 `glob_t` 结构的指针。\n\n`glob_t` 结构持有 `glob()` 生成的路径名列表：\n\n```\ntypedef\
  \ struct {                                                   POSIX\n    size_t gl_pathc;\
  \       为止为止匹配的路径计数\n    char **gl_pathv;       匹配的路径名列表\n    size_t gl_offs;  \
  \      在 gl_pathv 中预留的槽位\n} glob_t;\n```\n\n* `size_t gl_pathc`\n    匹配的路径数量。\n\
  * `char **gl_pathv`\n    匹配的路径名数组。`gl_pathv[gl_pathc]` 始终为 `NULL`。\n* `size_t gl_offs`\n\
  \    `gl_pathv` 中的“预留槽位”。其思想是在 `gl_pathv` 的*前端* 预留槽位，供应用程序以后填充（例如命令名和选项）。然后可以将列表直接传递给\
  \ `execv()` 或 `execvp()`（见第 9.1.4 节，“启动新程序：`exec()` 族](#ch09.xhtml_ch09lev2sec4)、“第\
  \ 283 页](#ch09.xhtml_page_283)）。预留槽位被设置为 `NULL`。为了让这一切工作，必须在 `flags` 中设置 `GLOB_DOOFFS`。\n\
  \n表 13.2 列出了 `glob()` 的标准标志。\n\n| 标志名称 | 含义 |\n| --- | --- |\n| `GLOB_APPEND` |\
  \ 将当前调的结果附加到之前调的结果。 |\n| `GLOB_DOOFFS` | 在 `gl_pathv` 头部预留 `gl_offs` 个位置。 |\n| `GLOB_ERR`\
  \ | 遇到错误时提前返回。 |\n| `GLOB_MARK` | 在每个目录路径名的末尾附加一个 `/` 字符。 |\n| `GLOB_NOCHECK` |\
  \ 如果模式不匹配任何文件名，则原样返回它。 |\n| `GLOB_NOESCAPE` | 将反斜线视为字面字符。这使得无法转义通配符元字符。 |\n| `GLOB_NOSORT`\
  \ | 不对结果进行排序；默认是进行排序。 |\n\n**表 13.2：** `glob()` 的标志。\n\nGLIBC 版本的 `glob_t` 结构包含额外的成员：\n\
  \n```\ntypedef struct {                                               GLIBC\n/*\
  \ POSIX 组件： */\n    size_t gl_pathc;                                   为止为止匹配的路径计数\n\
  \    char **gl_pathv;                                   匹配的路径名列表\n    size_t gl_offs;\
  \                                    在 gl_pathv 中预留的槽位\n\n/* GLIBC 组件： */\n    int\
  \ gl_flags;                                      flags 的拷贝，额外的 GLIBC 标志\n    void\
  \ (*gl_closedir)(DIR *);                        closedir() 的私有版本\n    struct dirent\
  \ *(*gl_readdir)(DIR *);               readdir() 的私有版本\n    DIR *(*gl_opendir)(const\
  \ char *);                  opendir() 的私有版本\n    int (*gl_lstat)(const char *, struct\
  \ stat *);      lstat() 的私有版本\n    int (*gl_stat)(const char *, struct stat *);\
  \       stat() 的私有版本\n} glob_t;\n```\n\n成员如下：\n\n* `int gl_flags`\n    `flags` 的拷贝。如果\
  \ `pattern` 包含任何元字符，还包括 `GLOB_MAGCHAR`。\n* `void (*gl_closedir)(DIR *)`\n    指向\
  \ `closedir()` 替代版本的指针。\n* `struct dirent *(*gl_readdir)(DIR *)`\n    指向 `readdir()`\
  \ 替代版本的指针。\n* `DIR *(*gl_opendir)(const char *)`\n    指向 `opendir()` 替代版本的指针。\n\
  * `int (*gl_lstat)(const char *, struct stat *)`\n    指向 `lstat()` 替代版本的指针。\n* `int\
  \ (*gl_stat)(const char *, struct stat *)`\n    指向 `stat()` 替代版本的指针。\n\n指向标准函数的私有版本主要用于实现\
  \ GLIBC；你极可能不需要它们。由于 GLIBC 提供了 `gl_flags` 字段和额外的标志值，手册和 Info 手册记录了 GLIBC `glob_t`\
  \ 结构的其余部分。表 13.3 列出了额外的标志。\n\n| 标志名称 | 含义 |\n| --- | --- |\n| `GLOB_ALTDIRFUNC`\
  \ | 使用替代目录访问函数（见正文）。 |\n| `GLOB_BRACE` | 执行 csh 和 Bash 风格的大括号扩展。 |\n| `GLOB_MAGCHAR`\
  \ | 如果发现了元字符，则设置在 `gl_flags`。 |\n| `GLOB_NOMAGIC` | 如果模式不包含元字符，则返回模式。 |\n| `GLOB_ONLYDIR`\
  \ | 如果仅匹配目录。见正文。 |\n| `GLOB_PERIOD` | 允许通配符 `*` 和 `?` 匹配开头的点。 |\n| `GLOB_TILDE`\
  \ | 执行 shell 风格的波浪扩展。 |\n| `GLOB_TILDE_CHECK` | 类似于 `GLOB_TILDE`，但如果命名目录出现问题，则返回\
  \ `GLOB_NOMATCH` 而不是将模式放入列表。 |\n\n**表 13.3：** `glob()` 的额外 GLIBC 标志。\n\n\n\n\n\n\
  `glob()` 可以被多次调用：第一次调用*不应*设置 `GLOB_APPEND` 标志，而所有后续调用*必须*设置该标志。你不能在多次调用之间更改 `gl_offs`，如果你修改了\
  \ `gl_pathv` 或 `gl_pathc` 中的任何值，必须在进行下一次调用 `glob()` 之前将它们还原。\n\n多次调用 `glob()` 的能力允许你在单个列表中构建结果。这非常有用；它能够类似于\
  \ shell 的通配符扩展功能的功能，但是在 C 语言编程层面实现的。\n\n如果没有问题，`glob()` 返回 `0`；如果有问题，则返回表 13.4 中的其中一个值。\n\
  \n| **常量** | **含义** |\n| --- | --- |\n| `GLOB_ABORTED` | 扫描提前停止，因为设置了 `GLOB_ERR`\
  \ 或因为 `(*errfunc)()` 返回了非零值。 |\n| `GLOB_NOMATCH` | 没有文件名匹配 `pattern`，且标志中未设置 `GLOB_NOCHECK`。\
  \ |\n| `GLOB_NOSPACE` | 分配动态内存出现问题。 |\n\n**表 13.4：** `glob()` 返回值\n\n`globfree()`\
  \ 释放 `glob()` 动态分配的所有内存。以下程序 `ch-general2-glob.c` 展示了 `glob()`：\n\n```\n 1  /* ch-general2-glob.c\
  \ --- demonstrate glob(). */\n 2\n3  #include <stdio.h>\n 4  #include <errno.h>\n\
  \ 5  #include <glob.h>\n 6  #include <stdlib.h>\n 7  #include <string.h>\n 8\n9\
  \  const char *myname;\n10\n11  /* globerr --- print error message for glob() */\n\
  12\n13  int\n14  globerr(const char *path, int eerrno)\n15  {\n16      fprintf(stderr,\
  \ \"%s: %s: %s\\n\", myname, path, strerror(eerrno));\n17      return 0;   /* let\
  \ glob() keep going */\n18  }\n19\n20  /* main --- expand command-line wildcards\
  \ and print results */\n21\n22  int\n23  main(int argc, char **argv)\n24  {\n25\
  \      int i;\n26      int flags = 0;\n27      glob_t results;\n28      int ret;\n\
  29\n30      if (argc == 1) {\n31          fprintf(stderr, \"usage: %s wildcard ...\\\
  n\", argv[0]);\n32          exit(EXIT_FAILURE);\n33      }\n34\n35      myname =\
  \ argv[0];  /* for globerr() */\n36\n37      for (i = 1; i < argc; i++) {\n38  \
  \        flags |= (i > 1 ? GLOB_APPEND : 0);\n39          ret = glob(argv[i], flags,\
  \ globerr, & results);\n40          if (ret != 0) {\n41              fprintf(stderr,\
  \ \"%s: problem with %s (%s), stopping early\\n\",\n42                  myname,\
  \ argv[i],\n43          /* ugly: */ (ret == GLOB_ABORTED ? \"filesystem problem\"\
  \ :\n44                   ret == GLOB_NOMATCH ? \"no match of pattern\" :\n45  \
  \                 ret == GLOB_NOSPACE ? \"no dynamic memory\" :\n46            \
  \       \"unknown problem\"));\n47              break;\n48          }\n49      }\n\
  50\n51      for (i = 0; i < results.gl_pathc; i++)\n52          printf(\"%s\\n\"\
  , results.gl_pathv[i]);\n53\n54      globfree(& results);\n55      return EXIT_SUCCESS;\n\
  56  }\n```\n\n第 9 行定义了 `myname`，它指向程序名；该变量用于 `globerr()` 的错误信息，该函数定义在第 13–18 行。\n\
  \n第 37–49 行是程序的核心。遍历命令行给出的模式，对每个模式调用 `glob()` 将其结果追加到列表中。循环的大部分是错误处理（第 40–48 行）。第\
  \ 51–52 行打印结果列表，第 54–55 行进行清理并返回。\n\n第 43–46 行写得不好——应该使用一个将整数常量转换为字符串的独立函数；我们之所以这样做主要是为了节省空间。这种代码在小程序中是可以接受的，但较大的程序应该使用函数。\n\
  \n如果你考虑幕后正在进行的所有工作（打开和读取目录、匹配模式、增长列表的动态分配、排序列表），你就会开始体会 `glob()` 为你做了多少工作！这里是一些执行结果：\n\
  \n```\n$ ch-general2-glob '/usr/lib/lib*.so' '../../bookfiles/*.texi'\n/usr/lib/libImageProcessor-x86_64.so\n\
  /usr/lib/libImageProcessor.so\n/usr/lib/libhpdiscovery.so\n/usr/lib/libhpip.so\n\
  /usr/lib/libhpipp.so\n/usr/lib/libhpmud.so\n../../bookfiles/00-preface.texi\n../../bookfiles/01-intro.texi\n\
  ../../bookfiles/02-cmdline.texi\n…\n```\n\n注意，我们必须对参数加引号，以防止 shell 进行扩展！\n\n###\
  \ 13.7.3 Shell 单词扩展：`wordexp()` 和 `wordfree()`\n\nPOSIX 委员会的许多成员认为 `glob()` 做得不够；他们希望有一个能够完成\
  \ shell 能做的所有事情的库函数：波浪号扩展 (`echo ~arnold`)、变量变量扩展 (`echo $HOME`) 和命令替换 (`echo $(cd\
  \ ; pwd)`)。许多其他人认为 `glob()` 并不是实现此目的的正确函数。为了“满足”所有人，POSIX 提供了额外的两个函数，可以完成所有工作：\n\
  \n```c\n#include <wordexp.h>                                      POSIX\n\nint wordexp(const\
  \ char *words,\n            wordexp_t *pwordexp,\n            int flags);\nvoid\
  \ wordfree(wordexp_t *wordexp);\n```\n\n这些函数的工作与 `glob()` 和 `globfree()` 类似，但作用于\
  \ `wordexp_t` 结构体：\n\n```c\ntypedef struct {\n    size_t we_wordc;             \
  \  匹配的单词数\n    char **we_wordv;               扩展后的单词列表\n    size_t we_offs;    \
  \            在 we_wordv 中预留的槽位\n} wordexp_t;\n```\n\n这些成员与之前描述的 `glob_t` 成员完全对应；我们在这里不再重复整个描述。\n\
  \n与 `glob()` 一样，几个标志控制着 `wordexp()` 的行为。标志列在表 13.5 中。\n\n| **常量** | **含义** |\n|\
  \ --- | --- |\n| `WRDE_APPEND` | 将当前调用的结果追加到之前调的结果。 |\n| `WRDE_DOOFFS` | 在 `we_wordv`\
  \ 的开头预留 `we_offs` 位置。 |\n| `WRDE_NOCMD` | 不允许命令替换。 |\n| `WRDE_REUSE` | 重用 `we_wordv`\
  \ 已指向的存储。 |\n| `WRDE_SHOWERR` | 对错误保持沉默。 |\n| `WRDE_UNDEF` | 使未定义的变量产生错误。 |\n\n\
  **表 13.5：** `wordexp()` 标志\n\n如果一切顺利，返回值为 `0`；否则，返回表 13.6 中的一个值。\n\n| **常量** | **含义**\
  \ |\n| --- | --- |\n| `WRDE_BADCHAR` | 元字符（换行、`|`、`&`、`;`、`<`、`>`、`(`、`)`、`{}`）出现在无效位置。\
  \ |\n| `WRDE_BADVAL` | 变量未定义且设置了标志。 |\n| `WRDE_CMDSUB` | 尝试命令替换但设置了 `WRDE_NOCMD`。\
  \ |\n| `WRDE_NOSPACE` | 分配动态内存出现问题。 |\n| `WRDE_SYNTAX` | Shell 语法错误。 |\n\n**表 13.6：**\
  \ `wordexp()` 错误返回值\n\n我们留给你练习（见后文），修改 `ch-general2-glob.c` 以使用 `wordexp()` 和 `wordfree()`。这是我们版本的执行情况：\n\
  \n```\n$ ch-general2-wordexp 'echo $HOME'                      变量扩展\necho\n/home/arnold\n\
  $ ch-general2-wordexp 'echo $HOME/*.gz'                 变量和通配符\necho\n/home/arnold/48000.wav.gz\n\
  /home/arnold/ipmasq-HOWTO.tar.gz\n/home/arnold/rc.firewall-examples.tar.gz\n$ ch-general2-wordexp\
  \ 'echo ~arnold'                    波浪号扩展\necho\n/home/arnold\n$ ch-general2-wordexp\
  \ 'echo ~arnold/.p*'                波浪号和通配符\necho\n/home/arnold/.postitnotes\n/home/arnold/.procmailrc\n\
  /home/arnold/.profile\n$ ch-general2-wordexp \"echo '~arnold/.p*'\"            \
  \  引号有效\necho\n~arnold/.p*\n```\n\n## 13.8 正则表达式\n\n\n\n\n\n`regular expression`（正则表达式）是一种用于描述待匹配文本模式的方法。如果你曾经用过\
  \ `GNU/Linux` 或 `Unix`，你无疑对正则表达式非常熟悉：它们是 Unix 程序员工具箱中的基础部分。它们对于 `grep`、`sed`、`awk`、Perl\
  \ 以及 `ed`、`vi`、`vim` 和 `Emacs` 等编辑器至关重要。Shell 通配符也是正则表达式，尽管其形式比其他工具提供的要有限。如果你对正则表达式完全陌生，我们建议你参考第\
  \ 13.9 节中的“建议阅读”以及第 467 页中提到的书籍或 URL。\n\nPOSIX 定义了两种正则表达式：`basic`（基础）和 `extended`（扩展）。`grep`、`sed`\
  \ 和 `ed` 编辑器等程序使用基础正则表达式。`grep -E` 和 `awk` 程序使用扩展正则表达式。以下函数允许你在程序中使用任一种格式：\n\n```\n\
  #include <sys/types.h>                                        POSIX\n#include <regex.h>\n\
  \nint regcomp(regex_t *preg,\n            const char *regex,\n            int cflags);\n\
  int regexec(const regex_t *preg,\n            const char *string,\n            size_t\
  \ nmatch,\n            regmatch_t pmatch[],\n            int eflags);\nsize_t regerror(int\
  \ errcode,\n                const regex_t *preg,\n                char *errbuf,\n\
  \                size_t errbuf_size);\nvoid regfree(regex_t *preg);\n```\n\n要进行正则表达式匹配，你必须首先编译（compile`）字符串版本的正则表达式。编译将正则表达式转换为内部形式。然后对字符串执行（executed`）编译后的形式，以查看其是否匹配原始正则表达式。函数如下：\n\
  \n*   `int regcomp(regex_t *preg, const char *regex, int cflags)`\n    将正则表达式 `regex`\
  \ 编译为内部形式，并存储在 `preg` 指向的 `regex_t` 结构中。`cflags` 控制编译的执行方式；其值为 `0` 或表 13.7 中一个或多个标志的按位或值。\n\
  \n*   ```\n    int regexec(const regex_t *preg, const char *string, size_t nmatch,\n\
  \                regmatch_t pmatch[], int eflags)\n    ```\n    针对字符串 `string` 执行\
  \ `preg` 中编译的正则表达式。`eflags` 控制执行的实现方式；其值为 `0` 或表 13.8 中一个或多个标志的按位或值。我们稍后会讨论其他参数。\n\
  \n*   ```\n    size_t regerror(int errcode, const regex_t *preg,\n             \
  \       char *errbuf, size_t errbuf_size)\n    ```\n    将 `regcomp()` 或 `regexec()`\
  \ 返回的错误转换为可供人类阅读打印的字符串。\n\n*   `void regfree(regex_t *preg)`\n    释放 `preg` 中编译的正则表达式所使用的动态内存。\n\
  \n`<regex.h>` 头文件定义了许多标志。有些用于 `regcomp()`；另一些用于 `regexec()`。然而，它们都以前缀 `REG_` 开头。表\
  \ 13.7 列出了用于 `regcomp()` 编译正则表达式的标志。\n\n| **常量** | **含义** |\n| --- | --- |\n| `REG_EXTENDED`\
  \ | 使用扩展正则表达式。默认是基础正则表达式。 |\n| `REG_ICASE` | `regexec()` 匹配时忽略大小写。 |\n| `REG_NEWLINE`\
  \ | 可以匹配任何字符的运算符不匹配换行符。 |\n| `REG_NOSUB` | 不需要子模式的起始和结束信息（见正文）。 |\n\n**表 13.7：**\
  \ `regcomp()` 的标志\n\n使用 `regexec()` 进行正则表达式匹配的标志见表 13.8。\n\n| **常量** | **含义** |\n\
  | --- | --- |\n| `REG_NOTBOL` | 不允许 `^`（行首）运算符匹配。 |\n| `REG_NOTEOL` | 不允许 `$`（行尾）运算符匹配。\
  \ |\n\n**表 13.8：** `regexec()` 的标志\n\n`REG_NEWLINE`、`REG_NOTBOL` 和 `REG_NOTEOL`\
  \ 标志之间会相互作用。这有点复杂，所以我们一步步来：\n\n*   当 `cflags` 中不包含 `REG_NEWLINE` 时，换行符就像普通字符。`.`（匹配任何字符）元字符可以匹配它，补补字符列表（`[^...]`）也是如此。此外，`$`\
  \ 不会在嵌入换行符之前立即匹配，`^` 不会在其之后立即匹配。\n\n*   当在 `eflags` 中设置 `REG_NOTBOL` 时，`^` 运算符不匹配字符串的开头。当\
  \ `string` 参数是匹配文本中间的字符地址时这非常有用。\n\n*   同样，当在 `eflags` 中设置 `REG_NOTEOL` 时，`$` 运算符不匹配字符串的末尾。\n\
  \n*   当 `cflags` 中包含 `REG_NEWLINE` 时，那么：\n    *   – 换行符不会被 `.` 或补补字符列表匹配。\n    *\
  \   – `^` 运算符始终会在嵌入换行符之后立即匹配，无论 `REG_NOTBOL` 如何设置。\n    *   – `$` 运算符始终会在嵌入换行符之前立即匹配，无论\
  \ `REG_NOTEOL` 如何设置。\n\n当你像使用 `grep` 那样进行逐行 I/O 时，可以从 `cflags` 中排除 `REG_NEWLINE`。如果你在缓冲区中有多个行，并希望将每一行视为一个独立的字符串，让\
  \ `^` 和 `$` 在其内部匹配，那么你应该包含 `REG_NEWLINE`。\n\n`regex_t` 结构大部分是不透明的。它包含一个用户级代码可以检查的成员；其余部分供正则表达式例程的内部使用：\n\
  \n```\ntypedef struct {\n    … 这里是内部内容 …\n    size_t re_nsub;\n    … 这里是内部内容 …\n\
  } regex_t;\n```\n\n`regmatch_t` 结构至少有两个供用户级代码使用的：\n\n```\ntypedef struct {\n   \
  \ … 这里是可能的内部内容 …\n    regoff_t rm_so;      子字符串起始的字节偏移\n    regoff_t rm_eo;    \
  \  子字符串结束后第一个字符的字节偏移\n    … 这里是可能的内部内容 …\n} regmatch_t;\n```\n\n`re_nsub` 字段和 `regmatch_t`\
  \ 结构都用于子表达式匹配（subexpression matching）。考虑一个扩展正则表达式，例如：\n\n```\n[[:space:]]+([[:digit:]]+)[[:space:]]+([[:alpha:]])+\n\
  ```\n\n两个括号内的子表达式每个都可以匹配一个或多个字符。此外，匹配每个子表达式的文本可以在字符串内的任意位置开始和结束。\n\n`regcomp()`\
  \ 将 `re_nsub` 字段设置为正则表达式中括号包含子表达式的数量。`regexec()` 填充 `regmatch_t` 结构 `pmatch` 数组，包含匹配对应子表达式的文本的起始和结束字节偏移。这些数据共同允许你执行文本替换——删除匹配文本或将匹配文本替换为其他文本，就像在你喜欢的文本编辑器中一样。\n\
  \n`pmatch[0]` 描述 `string` 中匹配整个正则表达式的部分。`pmatch[1]` 到 `pmatch[preg->re_nsub]` 描述匹配每个括号包含子表达式的部分。（因此，子表达式从\
  \ 1 开始编号。）`pmatch` 数组中未使用的元素其 `rm_so` 和 `rm_eo` 元素被设置为 `1`。\n\n`regexec()` 填充 `pmatch`\
  \ 中不超过 `nmatch - 1` 个元素；因此，你应该确保元素数量至少与 `preg->re_nsub` 一多（加 1）。\n\n最后，`regcomp()`\
  \ 的 `REG_NOSUB` 标志表明起始和结束信息不是必需的。当你不需要这些信息时应该使用此标志；它可能会提高 `regexec()` 的性能，产生显著差异。\n\
  \n换句话说，如果你只需要知道“它匹配了吗？”，就包含 `REG_NOSUB`。然而，如果你还需要知道“匹配文本在哪里？”，则请省略它。\n\n\n\n\n\n\
  最后，`regcomp()` 和 `regexec()` 在执行成功时均返回 `0`，若失败则返回特定的错误代码。错误代码列在表 13.9 中。\n\n| `Constant`\
  \ | `Meaning` |\n| --- | --- |\n| `REG_BADBR` | ‘`\\{...\\}`’内部的内容无效。 |\n| `REG_BADPAT`\
  \ | 正则表达式无效。 |\n| `REG_BADRPT` | `?`、`+` 或 `*` 前面没有有效的正则表达式。 |\n| `REG_EBRACE` |\
  \ 大括号（‘`\\{...\\}`’）未正确对齐。 |\n| `REG_EBRACK` | 方括号（‘`[...]`’）未正确对齐。 |\n| `REG_ECOLLATE`\
  \ | 模式使用了无效的排序元素。 |\n| `REG_ECTYPE` | 模式使用了无效的字符类。 |\n| `REG_EESCAPE` | 模式末尾有 `\\\
  ` 字符。 |\n| `REG_EPAREN` | 分组括号（‘`(...)`’ 或‘`\\(...\\)``）未正确对齐。 |\n| `REG_ERANGE`\
  \ | 范围表达式中的终点无效。 |\n| `REG_ESPACE` | 函数内存耗尽。 |\n| `REG_ESUBREG` | ‘`\\*digit`’ 中的数字无效。\
  \ |\n| `REG_NOMATCH` | `regexec()` 未使字符串与模式匹配。 |\n\n**表 13.9: `regcomp()` 和 `regexec()`\
  \ 的错误代码**\n\n为了演示正则表达式例程，`ch-general2-grep.c` 提供了一个标准 `grep` 程序的简单重新实现，该程序在文件中搜索模式。我们的版本默认使用基本正则表达式。它接受\
  \ `-E` 选项来使用扩展正则表达式，并接受 `-i` 选项来忽略大小写。与真实的 `grep` 一样，如果命令行上没有提供文件，我们的 `grep` 将读取标准输入；而且和真实的\
  \ `grep` 一样，可以使用文件名‘`-`’来表示标准输入。（这种技术对于在搜索其他文件的同时搜索标准输入非常有用。）这里是该程序：\n\n```\n 1\
  \  /* ch-general2-grep.c --- 使用 POSIX R.E. 函数的 grep 简单版本。 */\n 2\n 3  #include <stdio.h>\n\
  \ 4  #include <errno.h>\n 5  #include <regex.h>\n 6  #include <stdbool.h>\n 7  #include\
  \ <stdlib.h>\n 8  #include <string.h>\n 9  #include <unistd.h>\n10  #include <sys/types.h>\n\
  11\n12  const char *myname;         /* 用于错误消息 */\n13  bool ignore_case = false;\
  \   /* -i 选项：忽略大小写 */\n14  bool extended = false;      /* -E 选项：使用扩展 RE */\n15 \
  \ int errors = 0;             /* 错误数量 */\n16\n17  regex_t pattern;            /*\
  \ 用于匹配的模式 */\n18\n19  void compile_pattern(const char *pat);\n20  void process(const\
  \ char *name, FILE *fp);\n21  void usage(void);\n```\n\n第 12–17 行声明了程序的全局变量。第一组（第\
  \ 12–15 行）用于选项和错误消息。第 17 行声明了 `pattern`，它存储了编译后的模式。第 19–21 行声明了程序的其他函数。\n\n`main()`\
  \ 从解析参数开始：\n\n```\n23  /* main --- 处理选项，打开文件 */\n24\n25  int\n26  main(int argc,\
  \ char **argv)\n27  {\n28      int c;\n29      int i;\n30      FILE *fp;\n31\n32\
  \      myname = argv[0];\n33      while ((c = getopt(argc, argv, \":iE\")) != -1)\
  \ {\n34          switch (c) {\n35          case 'i':\n36              ignore_case\
  \ = true;\n37              break;\n38          case 'E':\n39              extended\
  \ = true;\n40              break;\n41          case '?':\n42              usage();\n\
  43              break;\n44          }\n45      }\n46\n47      if (optind == argc)\
  \     /* 健全检查 */\n48          usage();\n49\n50      compile_pattern(argv[optind]);\
  \  /* 编译模式 */\n51      if (errors)         /* 编译失败 */\n52          return EXIT_FAILURE;\n\
  53      else\n54          optind++;\n```\n\n第 32 行设置了 `myname`，第 33–48 行解析选项。第 50–54\
  \ 行编译正则表达式，并将结果放入 `pattern` 中。如果出现问题，`compile_pattern()` 会增加 `errors` 的值。（通过这种全局变量将函数耦合在一起通常被认为是不好的做法。对于像这样的小型程序是可以接受的，但在较大的程序中这种耦合可能会变成问题。）如果没有问题，第\
  \ 54 行会增加 `optind`，使得剩余参数成为要处理的文件。\n\n`main()` 的其余部分处理命令行上指定命名的文件：\n\n```\n56  \
  \    if (optind == argc)     /* 无文件，默认到 stdin */\n57          process(\"standard\
  \ input\", stdin);\n58      else {\n59      /* 遍历文件 */\n60      for (i = optind;\
  \ i < argc; i++) {\n61          if (strcmp(argv[i], \"-\") == 0)\n62           \
  \   process(\"standard input\", stdin);\n63          else if ((fp = fopen(argv[i],\
  \ \"r\")) != NULL) {\n64              process(argv[i], fp);\n65              fclose(fp);\n\
  66          } else {\n67              fprintf(stderr, \"%s: %s: could not open:\
  \ %s\\n\",\n68                  argv[0], argv[i], strerror(errno));\n69        \
  \      errors++;\n70           }\n71        }\n72     }\n73\n74     regfree(& pattern);\n\
  75     return errors != 0 ? EXIT_FAILURE : EXIT_SUCCESS;\n76  }\n```\n\n第 56–72\
  \ 行处理文件，搜索匹配模式的行。第 56–57 行在没有提供文件时处理到标准输入；否则，第 60–71 行遍历文件。第 61 行处理名为‘`-`’的文件作为标准输入；第\
  \ 63–66 行在成功打开文件后处理并关闭文件；否则，第 67–70 行向标准错误输出错误信息并增加 `errors`。\n\n第 74 行释放 `pattern`，第\
  \ 75 行根据 `errors` 是否不为 0 返回失败或成功。\n\n\n\n\n如果返回值为 `0`，则该行匹配模式，因此第 122 行会打印文件名和匹配的行号。\n\
  \n最后，`usage()` 函数打印用法信息并退出。当提供无效选项或未提供模式时，会调用它（第 41–43 行和 47–48 行）：\n\n```\n127\
  \  /* usage --- print usage message and exit */\n128\n129  void\n130  usage(void)\n\
  131  {\n132      fprintf(stderr, \"usage: %s [-i] [-E] pattern [ files ... ]\\n\"\
  , myname);\n133      exit(EXIT_FAILURE);\n134  }\n```\n\n就是这些！一个不到 140 行代码实现的、简易但实用的\
  \ `grep` 版本。\n\n## 13.9 建议阅读\n\n1. 《编程珍珠》（*Programming Pearls），第 2 版，Jon Bentley\
