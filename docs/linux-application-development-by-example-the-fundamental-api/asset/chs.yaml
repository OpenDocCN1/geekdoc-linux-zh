  \ = port;\n113      while (connect(s, (struct sockaddr *)&hisctladdr, sizeof (hisctladdr))\
  \ < 0) {\n114          if (hp && hp->h_addr_list[1]) {\n115              int oerrno\
  \ = errno;\n116              extern char *inet_ntoa();\n117\n118              fprintf(stderr,\
  \ \"ftp: connect to address %s: \",\n119                  inet_ntoa(hisctladdr.sin_addr));\n\
  120              errno = oerrno;\n121              perror((char *) 0);\n122    \
  \          hp->h_addr_list++;\n123              bcopy(hp->h_addr_list[0],\n124 \
  \                  (caddr_t)&hisctladdr.sin_addr, hp->h_length);\n125          \
  \    fprintf(stdout, \"Trying %s...\\n\",\n126                  inet_ntoa(hisctladdr.sin_addr));\n\
  127              (void) close(s);\n128              s = socket(hisctladdr.sin_family,\
  \ SOCK_STREAM, 0);\n```\n\n\n\n\n\n让我们从 `send()` 和 `recv()` 开始。如果 `flags` 为 0，它们与\
  \ `write()` 和 `read()` 完全相同。套字必须处于连接状态；我们稍后会讨论这一点。引用标准中的话，对于 `send()`，`flags` 是以下一个或多个项的位或运算结果：\n\
  \n* `MSG_EOR`\n  终止一条记录（如果协议支持）。\n* `MSG_OOB`\n  在支持带外通信（out-of-band communications）的套字上发送带外数据。带外数据的意义和语义取决于协议。\n\
  * `MSG_NOSIGNAL`\n  请求在对不再连接的流面向型套字上尝试发送时，不要发送 `SIGPIPE` 信号。但仍应返回 `EPIPE` 错误。\n\n\
  再次引用标准内容，对于 `recv()`，`flags` 是以下一个或多个项的位或运算结果：\n\n* `MSG_PEEK`\n  窥视一个入的消息。该数据被视为未读状态，下一次\
  \ `recv()` 或类似函数仍将返回这些数据。\n* `MSG_OOB`\n  请求带外数据。带外数据的意义和语义取决于协议。\n* `MSG_WAITALL`\n\
  \  在 `SOCK_STREAM` 套字上，此项请求函数阻塞直到可以返回完整数量的数据。如果套字是基于消息的套字、捕获到信号、连接终止、指定了 `MSG_PEEK`\
  \ 或套字存在待处理错误，则函数可能会返回较少的数据。\n\n带外数据是一个我们不涵盖的高级主题；请参见第 14.11 节中的资源、“建议阅读”、“第 502\
  \ 页。\n\n总的来说，`send()` 和 `recv()` 主要为数据报套字专门化（见下一节）。对于流套字，使用 `read()` 和 `write()`\
  \ 会更好。\n\n## 14.7.2 无连接通信：UDP 套字\n\n到为止，我们一直在描述基于 TCP 的流式通信，其中连接被建立并在整个会话期间保持打开。根据定义，此类套字处于连接状态。\n\
  \nUDP 通信是非连接的：发送的每个数据块与之前发送的内容或之后可能发送的内容无关。尽管大多数普通应用程序使用 TCP，但许多重要的互联网服务使用 UDP——最著名的是域名服务（DNS）。\n\
  \nUDP 套字通过 `socket()` 创建，如下所示：\n\n```\nint sockfd;\n\nsockfd = socket(AF_INET, SOCK_DGRAM,\
  \ IPPROTO_UDP);\nif (sockfd < 0) {\n    fprintf(stderr, \"%s: socket failed: %s\\\
  n\", argv[0], strerror(errno));\n    exit(EXIT_FAILURE);\n}\n```\n\n然后你有两种方法继续发送数据。一种方案是使用\
  \ `connect()` 将套字连接到特定目标，如之前所示（参见第 14.6.2 节、“调用：`connect()`”、“第 489 页）。这样做会将 UDP\
  \ 套字置于连接状态，允许你使用 `write()`/`read()` 和/或 `send()`/`recv()`。\n\n或者你可以在每次想要发送或接收时指定使用的地址。在这种情况下，你将使用\
  \ `sendto()` 和 `recvfrom()`。对于这些函数，`flag` 值与 `send()` 和 `recv()` 相同，而指向 `struct\
  \ sockaddr` 的指针实际上会指向填充适当的 `struct sockaddr_in` 结构。\n\n如果你最初对带有一个地址的 UDP 套字使用 `connect()`，然后通过\
  \ `sendto()` 或 `recvfrom()` 提供不同的地址，则提供的地址将覆盖原始地址。\n\n## 14.8 处理多个打开的连接：`select()`\n\
  \n在原始的 4.2 BSD 系统，有多个类似于 `ftpd` 的网络守护进程。大多数时候它们处于空闲状态，等待来自客户端的接入网络连接。参见图 14.2。\n\
  \n![Images](img/fig14-002.jpg)\n\n**图 14.2：** 多个网络守护进程\n\n经验表明，这种方法是有问题的。每个守护进程即使在空闲时也会占用系统资源，例如一定数量的内存，并占用操作系统内的资源（进程信息、打开的文件等）。\n\
  \n为了解决这个问题，BSD 开发者创建了 `inetd`，这一个“超级服务器”。`inetd` 的工作原理是打开多个套字，为其配置文件列出的每个协议服务打开一个。除了服务本身（如\
  \ `ftp` 或 `telnet`），配置文件还提供了要运行的服务器程序名称、运行程序的用户以及其他信息。（某些 GNU/Linux 系统使用较新版本的 `inetd`，称为\
  \ `xinetd`。在其他系统中，该功能由一个名为 `systemd` 的程序包含。但核心思想是相同的。）\n\n当连接进入某个服务的打开的套字时，`inetd`\
  \ 使用 `accept()` 接受连接，并派生出一个子服务器进程。在子进程中，它将新套字移动到标准输入、标准输出和标准错误，然后执行服务器进程。服务器进程被编写（或重写）为期望文件描述符零、一、二已经可用。某些服务直接由受\
  \ inetd` 内置的函数提供。\n\n使 `inetd`成为可能的魔法系统调用是 `select()`，它允许一个进程同时监控多个打开的文件描述符：\n\n\
  ```\n#include <sys/select.h>                     POSIX\n\nint select(int nfds, fd_set\
  \ *readfds, fd_set *writefds,\n           fd_set *exceptfds, struct timeval *timeout);\n\
  \nvoid FD_CLR(int fd, fd_set *set);\nint FD_ISSET(int fd, fd_set *set);\nvoid FD_SET(int\
  \ fd, fd_set *set);\nvoid FD_ZERO(fd_set *set);\n```\n\n当调用时，`select()` 等待至少有一个文件描述符变为给定操作（如读或写）变得“就绪”。它使用一种名为\
  \ `fd_set` 的数据类型来标记变为可用的文件描述符或描述符。我们稍后会描述 `fd_set` 以及如何使用它们。\n\n`select()` 的参数如下：\n\
  \n* `int nfds`\n  要监控的打开的文件描述符的总数。由于文件描述符的值从零开始，应该是最大的打开的文件描述符的值加一。如果程序在打开描述符后没有关闭任何一个，则可以是最近打开的文件描述符的值加一。\n\
  \  `select()` 可以监控的打开的文件描述符数量有一个限制，稍后将讨论。\n* `fd_set *readfds`\n  准备好读取的文件描述符集。\n\
  * `fd_set *writefds`\n  准备好写入的文件描述符集。\n* `fd_set *exceptfds`\n  发生了“异常情况”的文件描述符集。这是一个我们不再进一步讨论的高级用例。\n\
  * `struct timeval *timeout`\n  如果在 `*timeout` 指定的时间内没有文件描述符可用，则 `select()` 返回 `–1`。如果\
  \ `timeout` 为 `NULL`，则 `select()` 等待直到发生变化。（`struct timeval` 引入于第 5.6.4.2 节、“微秒级分辨率：`utimes()`”、“第\
  \ 149 页。）\n\n`select()` 使用一种名为 `fd_set` 的数据类型。这本质上是一个位图，由文件描述符值索引。一些函数（最初是宏）提供了对\
  \ `fd_set` 的操作：\n\n* `void FD_CLR(int fd, fd_set *set);`\n  从集合中移除（清除）`fd`。\n* `int\
  \ FD_ISSET(int fd, fd_set *set);`\n  检查 `fd` 是否“在”集合中。\n* `void FD_SET(int fd, fd_set\
  \ *set);`\n  将 `fd` 放入集合。\n* `void FD_ZERO(fd_set *set);`\n  清空（初始化或重新初始化）`*set`\
  \ 的内容。\n\n`fd_set` 可以持有高达到 `FD_SETSIZE` 的文件描述符值。\n\n\n\n\n虽然我们在介绍 `select()` 时表现得好像它是为了“仅仅”用于\
  \ `inetd` 才引入的，但事实并非如此。`select()` 可以作用于套字文件描述符、普通文件打开的描述符（这些总是“已就绪”的）以及打开的终端设备描述符。它在\
  \ 4.2 BSD 中与其他套字相关的系统调用一起引入。\n\n### 14.8.1 示例代码：4.4 BSD `inetd`\n\n以下是 4.4 BSD 版本\
