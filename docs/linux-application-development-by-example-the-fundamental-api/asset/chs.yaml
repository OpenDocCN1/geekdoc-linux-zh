  It finds the problem, indicating the source code line, as well as giving a small\
  \ memory dump. Address Sanitizer can find problems with dynamic memory. We show\
  \ an example in the following subsection. Programs compiled with Address Sanitizer\
  \ run more slowly than regular programs, because of the additional checking going\
  \ on. You may not want to use it for the production version of your program. However,\
  \ you should definitely run your test suite with it—if not all the time, then at\
  \ least periodically, and especially before making a formal release.\n\n### 17.6.2.1\
  \ Sanitizer Example: `gawk`’s `printf()` Code\n\nAfter receiving a particularly\
  \ disturbing bug report, for version 5.3.1 of `gawk` we decided to refactor and\
  \ simplify the code that implements `printf()` and `sprintf()`. With the exception\
  \ of formatting floating-point numbers, `gawk` implements these functions itself,\
  \ instead of relying on the underlying library version of `sprintf()`.\n\nThe routine\
  \ in question deals with padding a value with zeros to fill out the precision part\
  \ of a format specification. For an integer value, according to the `printf` (3)\
  \ manpage:\n\n[The precision] gives the minimum number of digits to appear for `d`,\
  \ `i`, `o`, `u`, `x`, and `X` conversions.\n\nHere is the initial version of the\
  \ function:\n\n```c\n1  static char *\n2  zero_fill_to_precision(char *number_value,\
  \ struct flags *flags)\n3  {\n4      char *buf1;\n5      char *cp, *src;\n6    \
  \  size_t buflen;\n7      int prec = flags->precision;\n8      size_t val_len =\
  \ strlen(number_value);\n9\n10     buflen = flags->precision + 1;   // we know val_len\
  \ < precision\n11\n12     emalloc(buf1, char *, buflen, \"zero_fill_to_precision\"\
  );\n13     cp = buf1;\n14     src = number_value;\n15\n16     if (flags->negative)\
  \ {\n17         *cp++ = '-';\n18         src++;\n19         val_len--;\n20     }\
  \ else if (flags->plus) {\n21         *cp++ = '+';\n22     } else if (flags->space)\
  \ {\n23         *cp++ = ' ';\n24     }\n25\n26     for (; prec > val_len; prec--)\n\
  27         *cp++ = '0';\n28\n29     strcpy(cp, src);\n30     free((void *) number_value);\n\
  31\n32     return buf1;\n33  }\n```\n\nWhen we compiled `gawk` with Address Sanitizer\
  \ and ran it through the test suite, we got this error report:\n\n\n\n\n\n```\n\
