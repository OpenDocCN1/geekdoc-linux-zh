  \ Guy L. Steele, Jr.，Pearson, 2002. ISBN-13: 978-0-13-089592-9。\n我们之前提到过这本书。它对 C\
  \ 标准库中多字节和宽字符设施的演变和使用提供了简洁且易懂的描述。这在支持 C99 及更新版本的系统上特别有价值，因为库为了 1999 年 C 标准进行了显著增强。\n\
