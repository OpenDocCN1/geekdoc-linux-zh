  \n这段代码是临界部分的绝佳示例；它必须不中断地运行。管理这段代码的正确方法是用先阻塞后取消阻塞 `SIGCHLD` 的调用将其封装。\n\n#### 10.8.3.3\
  \ 严格父进程控制\n\n`siginfo_t` 结构体和三参数信号处理器使得能够了解子进程发生了什么。对于 `SIGCHLD`，`siginfo_t` 的 `si_code`\
  \ 字段指示发送信号的原因（子进程停止、继续、退出等）。表 10.5 给出了值的完整列表。所有这些值都在 POSIX 标准中定义。\n\n| **值** | **含义**\
  \ |\n| --- | --- |\n| `CLD_CONTINUED` | 一个停止的子进程已继续。当子进程收到 `SIGCONT` 时，某些系统会向父进程发送\
  \ `SIGCHLD`。有些则不会。Linux 是的。 |\n| `CLD_DUMPED` | 子进程异常终止并生成核心转储。 |\n| `CLD_EXITED`\
  \ | 子进程正常退出。 |\n| `CLD_KILLED` | 子进程被信号杀死。 |\n| `CLD_STOPPED` | 子进程被停止。 |\n| `CLD_TRAPPED`\
  \ | 正在被追踪的子进程已停止。（这种情况发生在程序被追踪时——无论是通过调试器还是为了实时监控。在任何情况下，你都不可能在普通情况下看到它。） |\n\n\
