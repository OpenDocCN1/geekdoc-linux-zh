  \ it may equal -1, the getopt end-of-options value.  */\nenum\n{\n  GETOPT_HELP_CHAR\
  \ = (CHAR_MIN - 2),\n  GETOPT_VERSION_CHAR = (CHAR_MIN - 3)\n};\n\n#define GETOPT_HELP_OPTION_DECL\
