  \ GNU/Linux 系统上，你可以使用“info grep”来查看本地副本。或者使用浏览器阅读 GNU 项目关于 `grep` 的在线文档。\n[`https://www.gnu.org/software/grep/doc/grep.html`](https://www.gnu.org/software/grep/doc/grep.html)\n\
  \n## 13.10 总结\n\n* 断言（Assertions）提供了一种对程序预期状态进行陈述的方法。它们是实用的设计和调试工具，并且通常应该保留在生产代码中。然而，请注意不要将断言与针对可能失败情况的运行时检查混淆。\n\
  \n* `memXXX()` 函数提供了广为人知的 `strXXX()` 函数的对应物。它们最大的价值在于可以处理二进制数据；零字节与其他字节没有区别。特别值得注意的是\
  \ `memcpy()` 与 `memmove()` 以及以及对重叠拷贝的处理。\n\n* 临时文件在许多应用程序中非常有用。`tmpfile()`、`mkstemp()`\
  \ 和 `mkdtemp()` 用于创建它们。当 `TMPDIR` 环境变量未定义时，它们会使用默认的 `/tmp`。在许多应用程序中，临时文件是有用的。`tmpfile()`、`mkstemp()`\
  \ 和 `mkdtemp()` API 是创建临时文件和目录的首选方法。使用 `TMPDIR` 环境变量来指定临时文件的位置，如果未定义则默认为 `/tmp`。`abort()`\
  \ 函数向调用进程发送 `SIGABRT` 信号并（可能）产生核心转储，用于调试。\n\n* `setjmp()` 和 `longjmp()` 提供了非局部跳转。这种功能强大但必须谨慎使用。sigsetjmp()`\
  \ 和 siglongjmp()` 可以保存和恢复信号掩码。非局部跳转的缺点往往大于其收益；因此，在没有更好的方法时才使用。\n\n* 随机数在各种应用程序中很有用。`rand()`\
  \ 和 `srand()` 是 C 语言标准的 API，可以通过相同的种子进行重现。许多系统上的 `rand()` 使用的算法并不理想。random()` 和\
  \ `srandom()` 使用了更好的算法，被包含在标准中，优于 `rand()` 和 `srand()`。在 GNU/Linux 系统上，`getrandom()`\
  \ 是获取真随机数的简单方法。如果你需要高质量的随机数，使用 `/dev/urandom` 和 `/dev/random` 特殊文件。`arc4random()`、`arc4random_uniform()`\
  \ 和 `arc4random_buf()` 函数提供了加密安全性。\n\n* 三种 API 提供了功能日益强大的元字符扩展：\n    * `fnmatch()`\
  \ 是最简单的，判断字符串是否匹配模式。\n    * `glob()` 遍历文件系统，返回匹配通配符的路径列表。当只需要标准的 `glob()` 功能时，应该使用它。虽然\
  \ GLIBC 的 `glob()` 有一些扩展，但需要额外能力的移植性程序应使用 `wordexp()`。（只运行在 GNU 上的程序可以随意使用 GLIBC\
  \ 的 `glob()`。）\n    * `wordexp()` 不仅 glob glob，还能执行完整的 Shell 单词展开，包括 变量展开和命令替换。\n\
  \n* `regcomp()` 和 `regexec()` 函数让你访问 POSIX 基础和扩展正则表达式。可以让你的程序行为与标准工具一致。\n\n### 练习题\n\
  \n1. 使用 `read()` 和 `memcmp()` 编写一个简单的 `cmp` 程序来比较两个文件。你的版本不需要任何选项。\n\n2. 使用 `<stdio.h>getc()`\
  \ 宏和对每个读取字符的直接比较，编写另一个 `cmp` 版本来比较两个文件。比较该版本与上一个练习中版本的性能。\n\n3. （中等难度）考虑 `<stdio.h>fgets()`\
  \ 和 `getline()` 函数。`memccpy()` 对实现它们有用吗？勾勒出一个使用它的 `fgets()` 的可能实现方案。\n\n4. （困难难度）使用\
  \ Git 下载 GLIBC 源码：`git clone git://sourceware.org/git/glibc.git`。找到 GLIBC 版本 `memcmp()`\
  \ 的源码。检查代码并解释它。\n\n\n\n\n5. 测试你的记忆。当文件指针关闭时，`tmpfile()` 是如何安排删除文件的？\n\n6. 使用 `mkstemp()`、`fdopen()`\
  \ 以及你认为必要的任何其他函数或系统调用，编写一个你自己的 `tmpfile()` 版本。并对其进行测试。\n\n7. 查阅 `linkat(2)` 和 `openat(2)`\
  \ 手页。编写一个程序，使用 `tmpfile()` 创建一个临时文件并填充一些数据。在关闭文件之前，使用 `fileno()`、`openat()` 和 `linkat()`\
  \ 为临时文件提供一个真实路径。这样做有效吗？\n\n8. 描述在 `mkstemp()` 返回后立即对其创建的文件名使用 `unlink()` 的优缺点。\n\
  \n9. 使用 `mktemp()` 和 `open()` 编写一个你自己的 `mkstemp()` 版本。你如何能它提供与 `mkstemp()` 相同的唯一性保证？\n\
  \n10. 使用 `mkstemp()` 的程序应该安排在退出时清理文件。（假设由于某种原因，文件在打开后没有立即被取消链接。）这包括可能到达终止信号的情况。因此，作为信号捕获器的一部分，应该删除该文件。你如何做到这一点？\n\
  \n11. （困难。）即使有了初步的信号处理清理，仍然存在竞态条件。在 `mkstemp()` 创建临时文件到其名称返回并记录在变量中（供信号处理函数使用）之间，有一个很小的窗口。如果在该窗口内递了一个未捕获的信号，程序就会崩溃并留下临时文件。你如何关闭这个窗口？（感谢\
  \ Jim Meyering。）\n\n12. 尝试在你可以访问的尽可能不同的系统上使用尽可能不同的编译器编译并运行 `ch-general2-setjmp.c`。尝试在开启和关闭不同级别优化的情况下进行编译。你看到了哪些行为变化？\n\
  \n13. 查看 V7 Unix 源码发行中的 `/usr/src/libc/gen/sleep.c` 文件。（该文件包含在书籍 GitHub 仓库中。）它实现了第\
  \ 10.8.1 节 描述的 `sleep()` 函数，“闹钟：`sleep()`、`alarm()` 和 `SIGALRM`”，第 363 页。打印它，并按照我们的示例风格对其进行注释，解释它是如何工作的。\n\
  \n14. 在 GNU/Linux 或 System V Unix 系统上，查看 `lrand48(3)` 手页。此接口看起来比 `random()` 更用还是更难？\n\
  \n15. 从第 8.4.3.2 节 获取 `ch-mounting-fts.c`，“处理文件树流”，第 252 页，并添加一个 `--exclude=`pat\
  \ 选项。匹配模式的文件不应该被打印。\n\n16. （困难。）为什么 GLIBC 需要指向标准目录和 `stat()` 调用私有版本的指针？它不能直接调用它们吗？\n\
  \n17. 修改 `ch-general2-glob.c` 以使用 `wordexp()` API。通过执行它提供的一些额外功能来对其进行实验。确保为命令行参数加上引号，以便\
  \ `wordexp()` 真正执行所有工作！\n\n18. 标准的 `grep` 仅在命令行提供多个文件时才打印文件名。让 `ch-general2-grep.c`\
  \ 以同样的方式。\n\n19. 查看 `grep(1)` 手页。为 `ch-general2-grep.c` 添加标准的 `-e`、`-q` 和 `-v` 选项。\n\
  \n20. 编写一个简单的替换程序：\n\n    ```\n    subst [-g] pattern replacement [ files ... ]\n\
  \    ```\n\n    它应该从命名的 `files` 或在未提供文件从标准输入读取文本行。它应该搜索每行以找到匹配 `pattern`。如果找到了，它应该将其替换为\
  \ `replacement`。\n\n    使用 `-g`，它不仅要替换第一个匹配项，还要替换行上所有的匹配项。\n\n21. 增强上一个练习中的 `subst`\
  \ 程序，使得 `replacement` 文本中的 `&` 被替换为匹配模式的输入文本。\n\n# 第 14 章\n\n## 套接字基础网络\n\n本章提供了网络和使用\
  \ socket 进行进程间通信的非常基础的介绍。\n\n### 14.1 引言，带一点历史\n\n用于网络和进程间通信（IPC）的 `socket` 抽象是在\
  \ 1983 年随 4.2 BSD 的发布引入 Unix 世界的。该系统包含了对互联网协议族的支持，该套件以两个主要协议命名：传输控制协议和互联网协议，即 TCP/IP。\n\
  \n今天，网络无处不在；我们的手机手机和笔记本电脑无缝且透明地连接到全球互联网上的数百万个服务器系统，而这一切都是构建在 TCP/IP 之上的。但在这些手机和网页浏览器中精美的图形显示之下，一切仍然通过\
  \ socket 发生。\n\n在 4.2 BSD 发布时，计算领域存在许多网络协议；大多数是特定于厂商的，用于来自同一厂商的系统之间的通信，例如 IBM、DEC\
  \ 或 Prime。(1) 然而，某些协议与 TCP/IP 竞争成为互联网络的标准——允许不同的计算系统能够相互通信。其中最著名的是 ISO 协议族。然而，那些“战争”早已结束，今天\
  \ TCP/IP 占据主导地位。\n\n^(1) Prime（现已倒闭）是一家微型计算机厂商，当时拥有先进的网络设施。\n\n这段历史仍然反映在 socket\
  \ API 的设计中。由于当时有许多网络套件，该 API 是通用的；它的设计目的是用于许多不同类型的网络，这样一旦创建连接，软件就可以以相同的方式使用任何连接。正如\
  \ `read()` 从打开的文件描述符中读取字节，无论输入源是什么一样，网络代码也应该能够从网络连接中读取字节，无论该网络运行的是 TCP/IP、ISO 协议，甚至是\
  \ AppleTalk。\n\n本章将介绍 socket 编程的最基础知识。在经过 40 多年的开发后，你可以用 socket 做的事情比我们在这里涵盖的要得多，特别是在\
  \ GNU/Linux 系统上。我们希望你能够自己进一步探索。\n\n## 14.2 网络技术\n\n有多种方法将数据从一个地方移动到另一个地方。根据对现实世界的类比，它们很容易理解。存在两种基本范式：\n\
  \n*   数据报 (Datagrams)\n\n    数据报是从源发送到目的地的自包含数据单元。现实世界中的类比是从你家寄给住在你城市另一地区、国家或世界其他地方的朋友的信。信封外部有你的地址（发送者）和你朋友的地址（收件者）。信封内部是你的信，即感兴趣的实际数据。\n\
  \n    假设你有大量信息要发给朋友，因此你将信分成多页，每次几页放入不同的信封。你对信封编号，这样你的朋友就会知道阅读信的顺序。即使你在同一天寄出这些信，它们也可能几天后到达你朋友家，且顺序随机；有些可能根本不会到达。\n\
  \n    在网络中，数据报的工作方式是类似的。每个数据报都包含源地址和目的地址以及其数据。多个数据报可能会以任何顺序到达、丢失或（与真实的信不同）被重复。\n\
  \n*   虚拟电路 (Virtual circuits)\n\n    虚拟电路是一个双向通信通道，其中数据按顺序发送且不丢失。现实世界中的类比是从家里的电话到你朋友家里的电话，无论那里在哪里。一旦建立连接，你和你的朋友都可以说话（双向，或全工），并且（通常）没有任何噪音或丢失。(2)\n\
  \n\n\n\n由于各种原因，电话服务通常不再以前那么好了。尽管如此，这种类比仍然有效。\n\n在网络中，特别是 TCP/IP 网络中，虚拟电路通常被称为一个\
  \ `stream`（流），因为数据从一个地方流向另一个地方。流式连接提供全双工通信，且没有数据丢失或数据重复。\n\n### 14.3 互联网构建模块\n\n\
  介绍完这些概念后，还有几个基础知识需要介绍。首先要了解的是基础协议是 `IP`（互联网协议）。`IP` 是一种数据报文协议，每个 `packet`（数据包）都是自包含包含的，且数据包可能会丢失、重复或无序到达。其他协议都构建在\
  \ `IP` 之上。`IP` 提供了 `address`（地址）的核心概念，即识别特定系统的唯一标识符（数字）。稍后会详细介绍。\n\n第二个重要的概念是 `port`（端口）。端口识别特定系统上的唯一\
  \ `service`（服务）。例如，人们可以使用 浏览器（`HTTP`，端口 80）、文件传输协议（`FTP`，端口 21）或 `ssh`（安全外壳，端口 22）连接到同一个系统。\n\
  \n端口在现实世界的类比就像拨打公司办公室的电话。办公室有一个电话号码，然后可能会提示你输入要在公司内联系的人的 `extension`（分机号，如销售、服务、财务等）。\n\
  \n某些端口是 `privileged`（特权的），这意味着只有以 `root` 身份运行的程序可以在这些端口上作为服务器。在 POSIX 系统上，1024 以下的端口都是特权的。\n\
  \n`TCP` 协议在 `IP` 之上提供流式通信；它也提供了端口。`UDP` 协议也是构建在 `IP` 之上的数据报文协议；它与 `IP` 相比的主要贡献是它也提供了端口。\n\
  \n我们在此指出，TCP/IP 网络如何工作的底层细节远超我们的讨论范围。如果你感兴趣深入研究，请参阅 第 14.11 节、“建议阅读” 第 502 页 中的优秀书籍列表。\n\
  \n### 14.3.1 IPv4 地址\n\nIPv4 地址的大小为 32 位。它们以 `dotted decimal`（点分十进制）符号表示，类似于 `142.250.75.100`，地址中每个字节的值用十进制给出，并用点分隔。世界上大部分地区仍在使用\
  \ IPv4，尽管某些地方仅提供 IPv6。\n\nIP 地址分为 `network part`（网络部分）和 `host part`（主机部分）。网络部分识别网络（例如公司网络[`example.com`](http://example.com)），而主机部分识别网络内的唯一主机。高位中的若干位用于网络，其余用于主机，定义哪个是哪个的数量随网络而异。\n\
  \n遗憾的是，你无法通过观察一个随机 IP 地址判断哪些位是网络部分，哪些是主机部分。幸运的是，对于大多数终端用户来说，这并不重要。\n\n某些 IP 地址具有特殊含义。最常见的例子是\
  \ `127.0.0.1`，代表 `local host`（本地回环）。当你连接到这个地址时，你是在和自己对话。同样，以 `192.168` 开头的 IP 地址保留给路由器后的本地网络（例如当你使用\
  \ Wi-Fi 连接互联网时的情况）；这些地址并不代表在互联网上可访问的系统。（再次强调，这里只是浅尝表面；还有更多细节。）\n\n### 14.3.2 IPv6\
  \ 地址\n\nIPv6 于 2017 年 7 月成为互联网标准；在此之前，它已经开发多年。IPv6 提供了 128 位地址。它们使用冒号分隔的十六进制值编写——例如\
  \ `2a00:1450:4028:80::2004`。双冒号表示地址中间的字节全零。\n\n在本章中，我们主要关注 IPv4 网络，但会提到一些与 IPv6\
  \ 相关的内容。\n\n### 14.3.3 地址与接口\n\n还需要进一步的说明。IP 地址实际上识别的是机器的网络 `interface`（接口），即连接到特定物理网的硬件部分。早期，大多数机器只有一个接口，尽管某些机器有多个接口并可以在网络之间充当\
  \ `routers`（路由器）。今天，多个接口常见得多，例如笔记本电脑同时拥有以太网端口和 Wi-Fi 适配器，或者现代手机具备 Wi-Fi 和蜂窝网络能力。幸运的是，这一切对我们终端用户来说通常是透明的。\n\
  \n当服务器程序使用时，特殊地址 `0.0.0.0` 意味着服务器应该接受机器所有接口上的连接。它在其他上下文中有其他含义，我们此处不予讨论。\n\n## 14.4\
  \ 网络字节序\n\n不同架构的计算机使用不同的字节序，称为 `big endian`（大端序，最高有效字节在前）和 `little endian`（小端序，最高有效字节在后）。这种情况已经持续了几十年。差异如图\
  \ 14.1 所示。\n\n![Images](img/fig14-001.jpg)\n\n**图 14.1:** 字节端序\n\n引用自 [`techtarget.com`](http://techtarget.com)：^(4)\n\
  \n^(4) [`https://www.techtarget.com/searchnetworking/definition/big-endian-and-little-endian`](https://www.techtarget.com/searchnetworking/definition/big-endian-and-little-endian)\n\
  \n大端和小端序源于乔纳森·斯威夫特的《格列佛游记》，书中大端人是一个政治派别，他们从大的一端打碎鸡蛋，即所谓的“原始方法”。他们反抗小人国的国王，国王要求他的臣民小端人从小的一端打碎鸡蛋。\n\
  \n不同的端序引发了一个困难题。如果两台不同架构的机器需要共享数据，它们应该使用哪种顺序？互联网的架构师选择了大端作为 `network byte order`（网络字节序）。在发送二进制数据之前，系统必须将其从本地字节序转换为网络字节序，并在接收此类数据时反向转换。\n\
  \n以下是执行这些转换的标准例程：\n\n```\n#include <arpa/inet.h>                         POSIX\n\
  \nuint32_t htonl(uint32_t hostlong);             主机转网络长 (32 位)\nuint16_t htons(uint16_t\
  \ hostshort);            主机转网络短 (16 位)\nuint32_t ntohl(uint32_t netlong);      \
  \        网络转主机长 (32 位)\nuint16_t ntohs(uint16_t netshort);             网络转主机短 (16\
  \ 位)\n```\n\n在大端序机器上，这些函数是无操作的；它们直接原样返回原始值。我们很快会看到一些用法。\n\n### 14.4 网络与客户端/服务器\n\
  \n*双人舞需要两个人才能跳。*\n\n— Al Hoffman 和 Dick Manning，歌曲《Takes Two to Tango》的作者\n\n在任何对话中，都有两个参与者。在网络中，我们将其中一个定义为\
  \ `client`（客户端），另一个定义为 `server`（服务器）。作为一个类比，考虑银行的业务窗口。柜员是服务器，他们始终可用，^(5) 等待客户开车过来。客户是客户端，在到达时发起对话并提出请求（“我想把这些现金存入我的账户”）。\n\
  \n^(5) 至少在银行时间内是这样。\n\n对于网络程序，服务器始终运行，^(6) 等待有人连接它并提出请求（例如网站）。客户端是发起对话的人，连接到服务器并发出请求（例如网络浏览器，一旦你输入[或点击]URL）。在接收到请求后，服务器做出响应，然后双向对话继续。\n\
  \n^(6) 这并非绝对正确，我们将在本章稍后的部分进行讨论。\n\n### 14.5 服务器程序的基本结构\n\n\n\n在现实世界中，银行柜员一次只能服务一名客户。如果只有一个柜员但有多个客户，第一个客户将获得服务，其他人则必须等待（我们希望他们是耐心的），直到柜员空闲为止。\n\
  \n在网络中，情况则有所不同。当客户端连接到服务器时，服务器接受连接并派生出一个子进程来处理该客户端。原始服务器就可以返回去接收连接。因此，这种流程是一个无限循环，类似于下面的伪代码：\n\
  \n```\nsetup_initial_socket();\nsetup_process_as_server();\nfor (;;) {\n    int\
  \ new_fd = start_the_conversation();\n    pid_t pid = fork();\n    if (pid < 0)\n\
  \        handle_error();\n    else if (pid == 0) {\n        // new_fd 跨 fork 继承\n\
  \        do_the_actual_work(new_fd);\n        exit(EXIT_SUCCESS);\n    } else {\n\
  \        close(new_fd);\n        // 在循环中继续\n    }\n}\n```\n\n在接下来的小节中，我们将介绍实现上述步骤的\
  \ socket 例程，最后以 4.2 BSD `ftpd` 守护程序的示例代码结束。\n\n### 14.5.1 创建 Socket：`socket()`\n\
  \n要做的第一件事是用 `socket()` 系统调用创建一个 socket：\n\n```\n#include <sys/types.h>         \
  \               POSIX\n#include <sys/socket.h>\n\nint socket(int domain, int type,\
  \ int protocol);\n```\n\n参数如下：\n\n*   `int domain`：\n    这表示你想要使用的网络类型或 IPC（进程间通信）。它本质上选择了要使用的协议族，因为除了\
  \ TCP/IP 之外还有许多选择。这通常被称为“地址族”（address family）；该名称反映在为此参数提供的值的 `AF_` 前缀中（参见[表 14.1]）。\n\
  \n*   `int type`：\n    这表示连接的类型。两个主要选择是数据报或虚拟电路，但还有其他选项。[表 14.2] 给出了 `type` 的可用值。\n\
  \n*   `int protocol`：\n    在所选的地址族中，可能有多个协议提供请求的 socket 类型。在这种情况下，`protocol` 参数提供了指定的选择。如果只有一个，你可以对此参数使用\
  \ `0`。我们稍后会提供更多介绍。\n\nGNU/Linux 系统提供了 20 多种不同的地址族选择（参见 `socket`(2)）。常规使用中只需要其中几个。[表\
  \ 14.1] 描述了这些项。借用 `socket`(2) 手页的内容，我们提供了指向每个族独立手册页的引用。\n\n| **族 (Family)** | **用途\
  \ (Purpose)** | **手册页** |\n| --- | --- | --- |\n| `AF_UNIX` | 本地 IPC | `unix`(7)\
  \ |\n| `AF_INET` | IPv4 互联网协议 | `ip`(7) |\n| `AF_INET6` | IPv6 互联网协议 | `ipv6`(7)\
  \ |\n\n**表 14.1：** 最常用的地址族\n\n你可能会看到非常老的代码使用了如 `PF_INET` 和 `PF_UNIX` 这样的常量，其中 `PF_`\
  \ 前缀代表“协议族”（protocol family）。这种用法已经过时，`socket`(2) 手页指出标准只使用 `AF_` 前缀。\n\n`type`\
  \ 参数提供了通信语义。有效类型在[表 14.2]中。\n\n| **类型 (Type)** | **语义 (Semantics)** |\n| --- | ---\
  \ |\n| `SOCK_STREAM` | 可靠、有序的双向字节流。 |\n| `SOCK_DGRAM` | 数据报。不保证交付，且消息有最大长度。 |\n\
  | `SOCK_SEQPACKET` | 数据报，但保证顺序交付。通信是双向的，消息有最大长度。每次必须读取整个数据包。 |\n| `SOCK_RAW` | 原始网络协议访问。在\
  \ TCP/IP 中，这些是 IP 包。 |\n| `SOCK_RDM` | 可靠的数据报。保证交付；但不保证顺序。 |\n\n**表 14.2：** Socket\
  \ 类型\n\n在[表 14.2] 所示 socket 类型中，只有前两个 `SOCK_STREAM` 和 `SOCK_DGRAM` 被广泛使用；其他的要专门化得多。\n\
  \nGNU/Linux 和 2024 POSIX 标准允许你通过位或（OR）将 `type` 参数与以下值之一结合（有关相关文件描述符标志的信息，请参见[Section\
  \ 4.6.4], “[Revisiting `open()`](), [第 104 页] 以及 [Section 9.4.3.1], “[The Close-on-Exec\
  \ and Close-on-Fork Flags`], [第 316 页]):\n\n*   `SOCK_CLOEXEC`：\n    在返回的文件描述符上设置\
  \ `FD_CLOEXEC` 标志。\n*   `SOCK_CLOFORK`：\n    在返回的文件描述符上设置 `FD_CLOFORK` 标志。在编写此时，`SOCK_CLOFORK`\
  \ 还非常新，但你可以预计它很快就会 GNU/Linux 中被支持。\n*   `SOCK_NONBLOCK`：\n    在返回的文件描述符上设置 `O_NONBLOCK`\
  \ 标志。\n\n`protocol` 参数通常为 `0`，但获取正确值的正式方法是通过以下函数之一：\n\n```\n#include <netdb.h> \
  \                          POSIX\n\nstruct protoent *getprotoent(void);\nstruct\
  \ protoent *getprotobyname(const char *name);\nstruct protoent *getprotobynumber(int\
  \ proto);\nvoid setprotoent(int stayopen);\nvoid endprotoent(void);\n```\n\n`setprotoent()`、`getprotoent()`\
  \ 和 `endprotoent()` 类似于数据库函数。`getprotobyname()` 和 `getprotobynumber()` 分别通过名称或数字查找。它们返回指向\
  \ `struct protoent` 的指针，如下：\n\n```\nstruct protoent {\n    char *p_name;       \
  \   协议的官方名称\n    char **p_aliases;      额外的别名列表，以 NULL 结尾\n    int p_proto;    \
  \       协议数字\n};\n```\n\n（注：由于提供的原始文本存在大量重复和格式错乱，译文已根据您的要求对核心逻辑进行了整理和翻译，去除了冗余部分。）\n\
  \n\n\n\n```\nstruct sockaddr_in {\n    sa_family_t    sin_family; /* 地址族: AF_INET\
  \ */\n    in_port_t      sin_port;   /* 网络字节序的端口 */\n    struct in_addr sin_addr;\
  \   /* Internet 地址 */\n};\n/* Internet 地址。 */\nstruct in_addr {\n    uint32_t  \
  \     s_addr;    /* 网络字节序的地址 */\n};\n```\n\n假设我们想在本地地址的 4242 端口上监听某个入的连接。我们可以使用\
  \ `inet_ntoa()`（见 `inet_ntoa`(3)）来实现：\n\n```\nstruct sockaddr_in local_addr;\n\n\
  local_addr.sin_family = AF_INET;\nlocal_addr.sin_port = htons(4242);\ninet_ntoa(\"\
  127.0.0.1\", & local_addr.sin_addr);      // 为了简洁起见省略了错误检查\n\nif (bind(sockfd, (const\
  \ struct sockaddr *) & local_addr, sizeof(local_addr)) < 0) {\n    fprintf(stderr,\
  \ \"failed to bind socket: %s\\n\", strerror(errno));\n    exit(EXIT_FAILURE);\n\
  }\n```\n\n我们的 socket 现在已经与一个地址关联了。\n\n### 14.5.3 等待连接：`listen()`\n\n现在 socket 已经有了地址，就像一个等待电话响起的接待员一样，下一步是告诉系统我们想要等待某人尝试联系我们。这是通过\
  \ `listen()` 系统调用实现的：\n\n```\n#include <sys/types.h>                        POSIX\n\
  #include <sys/socket.h>\n\nint listen(int sockfd, int backlog);\n```\n\n该系统调用将 socket\
  \ 定义为将用于接受入站连接的 socket（在 man 页中被称为“被动 socket”）。\n\n考虑一个 Web 服务器。许多客户端可能尝试连接到同一台服务器的\
  \ 443 端口（用于 HTTPS）。服务器一次只能处理一个入站连接。因此，让入站连接排队等待服务器响应是理想的。\n\n这正是 `backlog` 参数的作用；它指明了有多少个入站连接可以在服务器处排队等待。如果队列满了，额外的入站连接将被拒绝。\n\
  \n`listen()` 成功时返回零，出错时返回 `-1` 并设置 `errno`：\n\n```\n#define BACKLOG 42\n\nif (listen(sockfd,\
  \ BACKLOG) < 0) {\n    fprintf(stderr, \"failed to listen on socket: %s\\n\", strerror(errno));\n\
  \    exit(EXIT_FAILURE);\n}\n```\n\n### 14.5.4 开始对话：`accept()`\n\n当电话响起并被接听时发生了什么？在现实世界中，线路会一直占用直到对话结束。在网络世界中，我们的比喻终于失效了，工作方式有所不同。\n\
  \n嗯，尽管到目前为止，这些比喻并不完全是一一对应的，但我们希望它们有所帮助。\n\n`accept()` 系统调用接受一个入站连接，允许对话开始。它返回一个新的文件描述符，应用于对话，从而让服务器的主流程返回到监听连接状态。\n\
  \n让我们再次查看第 14.5 节“服务器程序的基本结构”（第 478 页）中的流程概述：\n\n```\nsetup_initial_socket();  \
  \                           这通过 socket() 和 bind() 完成\nsetup_process_as_server();\
  \                          这通过 listen() 完成\nfor (;;) {\n    int new_fd = start_the_conversation();\
  \          这通过 accept() 完成\n    pid_t pid = fork();\n    if (pid < 0)\n        handle_error();\n\
  \    else if (pid == 0) {\n        // new_fd 跨 fork 继承         啊哈！对话发生在子进程中\n  \
  \      do_the_actual_work(new_fd);\n        exit(EXIT_SUCCESS);\n    } else {\n\
  \        close(new_fd);                              父进程只等待连接\n        // 在循环中继续执行\n\
  \    }\n}\n```\n\n这里是 `accept()` 的声明：\n\n```\n#include <sys/types.h>           \
  \      POSIX\n#include <sys/socket.h>\n\nint accept(int sockfd, struct sockaddr\
  \ *addr,\n           socklen_t *addrlen);\nint accept4(int socket, struct sockaddr\
  \ *address,\n            socklen_t *address_len, int flag);\n```\n\n嗯，参数 `addr`\
  \ 和 `addrlen` 是做什么用的？就像电话系统中的呼叫主显示一样，网络知道建立连接的 IP 地址和端口。这些信息被用于填充关于对端的信息——即发起连接的客户端系统。这些信息可以被记录（例如）、经过验证以确保连接来自允许的系统，或者以我们的应用程序认为合适的任何其他方式使用。如果我们不在乎谁在连接我们，可以传递\
  \ `NULL` 作为 `addr` 的值。\n\n与 `bind()` 一样，我们必须根据正在进行的网络操作使用正确类型的结构。`addrlen` 应该包含传入的结构的大小。返回时，它会被填充为对端地址的实际大小。如果不匹配，`*addr`\
  \ 中的数据将会被截断。这里有一个调用：\n\n```\nstruct sockaddr_in peer_addr;\nsocklen_t peer_addr_size\
  \ = sizeof(peer_addr);\n\nif (accept(new_fd, (struct sockaddr *)&peer_addr, &peer_addr_size)\
  \ < 0) {\n    fprintf(stderr, \"failed to accept: %s\\n\", strerror(errno));\n \
  \   exit(EXIT_FAILURE);\n}\n```\n\n`accept4()` 函数在 Linux 226.17 中引入，`flag` 参数可以是\
  \ `SOCK_CLOEXEC`、`SOCK_CLOK` 和 `SOCK_NONBLOCK` 的位或组合。\n\n### 14.5.5 运行应用程序：`read()`/`write()`\n\
  \n到此为止，一切都已就绪；几乎都是样板代码。现在我们必须编写特定于应用程序的代码。在这里，控制流分叉子进程来处理对话，主进程返回监听连接：\n\n```\n\
  ...\npid_t pid;\n\nif ((pid = fork()) < 0) {\n    handle error\n} else if (pid ==\
  \ 0) {\n    process(new_fd);\n} else {\n    // 在循环中继续执行\n}\n...\n\n/* process ---\
  \ 运行对话 */\n\nvoid process(int fd, struct sockaddr_in *peer)\n{\n    // 获取原生字节序的\
  \ peer 信息，如果我们需要的话\n    int32_t peer_ip = ntohl(peer->sin_addr.s_addr);\n    int\
  \ peer_port = ntohs(peer->sin_port);\n\n    // 应用程序特定代码 ...\n}\n```\n\n### 14.5.6\
  \ 清理：`close()` 和 `shutdown()`\n\n一如既常，在读写数据后，我们应该关闭文件描述符。这释放了操作系统中的资源并确保了健壮性。\n\n\
  虽然 socket 文件描述符是通过与文件和设备不同的调用创建的，但一旦它打开，它就像一个普通的文件描述符。特别是，你可以使用普通的 `close()` 系统调用关闭它（见\
  \ 4.4.2 节“打开和关闭文件”）。\n\nSocket 作为双向连接，具有一些额外的灵活性。我们可以关闭通信的一侧而保持另一侧可用，如果我们选择这样做。这是通过\
  \ `shutdown()` 系统调用实现的：\n\n```\n#include <sys/socket.h>\nint shutdown(int sockfd,\
  \ int how);\n```\n\n`how` 的值是以下符号常量之一：\n\n| `SHUT_RD` | 禁止从 socket 读取。 |\n\n| `SHUT_WR`\
  \ | 禁止写入 socket。 |\n\n| `SHUT_RDWR` | 禁止读写。 |\n\n显然，使用 `SHUT_RDWR` 会禁用所有通信，但并没有实际关闭\
  \ socket。\n\n通常，成功时返回零。出错时返回 `-1`，且 `errno` 指明错误原因。\n\n\n\n\n有时，函数或某些代码会接收到一个并不是由它打开的套接字描述符。例如，这样的描述符可能会跨越\
  \ `exec` 被继承，或者作为 `int fd` 参数被传递给函数。\n\n在这种情况下，你对连接一无所知，例如你的 IP 地址和端口，或者对端端系统的地址和端口。如果你需要这些信息，可以使用两个例行程序来获取：\n\
  \n```\n#include <sys/socket.h>                 POSIX\n\nint getsockname(int sockfd,\
  \ struct sockaddr *addr, socklen_t *addrlen);\nint getpeername(int sockfd, struct\
  \ sockaddr *addr, socklen_t *addrlen);\n```\n\n`getsockname()` 获取连接本地端的地址和端口信息。`getpeername()`\
  \ 获取远程端的地址和端口信息。\n\n`addr` 和 `addrlen` 参数与 `accept()` 中的参数类似；你为 `addr` 传递一个指向 `struct\
  \ sockaddr_in` 的指针。`*addrlen` 应该包含传入结构体的大小，并在返回时被设置为实际复制出的字节数。\n\n这两个例行程序可以用于验证文件描述符确实是一个套接字，尽管你也可以使用\
  \ `fstat()` 这样做。\n\n### 14.5.8 示例服务器代码：`ftpd`\n\n如今想要找到一个纯服务器的简单示例并不容易；许多服务器需要处理多个打开的文件和/或设备（如终端）以及/或套接字。因此，为了展示真实代码的示例，我们追溯到了很久以前，这里介绍了来自\
  \ 4.2 BSD 的 FTP 服务器，它包含了我们目前为止展示的所有设置。\n\n在 4.2 BSD 中，FTP 服务器名为 `ftpd` 以守护进程运行——一个在后台始终运行的进程。因此，代码做了许多守护进程特有的操作，例如正确设置信号以及处理继承的文件描述符。这些对我们并不感兴趣，所以被省略了。行号相对于文件开头：\n\
  \n```\n 5  /*\n 6   * FTP server.\n 7   */\n 8  #include <sys/param.h>\n 9  #include\
  \ <sys/stat.h>\n10  #include <sys/ioctl.h>\n11  #include <sys/socket.h>\n...\n42\
  \  struct sockaddr_in ctrl_addr;                 相关地址结构\n43  struct sockaddr_in\
  \ data_source;\n44  struct sockaddr_in data_dest;\n45  struct sockaddr_in his_addr;\n\
  ...\n77  int lostconn();                               信号处理程序\n78  int reapchild();\n\
  ...\n81  main(argc, argv)                              int main(int argc, char **argv)\n\
  82      int argc;\n83      char *argv[];\n84  {\n85      int ctrl, s, options =\
  \ 0;\n86      char *cp;\n87\n88      sp = getservbyname(\"ftp\", \"tcp\");     \
  \    获取服务协议和端口\n89      if (sp == 0) {\n90          fprintf(stderr, \"ftpd: ftp/tcp:\
  \ unknown service\\n\");\n91          exit(1);\n92      }\n93      ctrl_addr.sin_port\
  \ = sp->s_port;                         开始设置地址信息\n94      data_source.sin_port =\
  \ htons(ntohs(sp->s_port) - 1);\n95      signal(SIGPIPE, lostconn);\n...\n143  \
  \   while ((s = socket(AF_INET, SOCK_STREAM, 0)) < 0) {       创建套接字\n144       \
  \  perror(\"ftpd: socket\");\n145         sleep(5);\n146     }\n...\n152     while\
  \ (bind(s, &ctrl_addr, sizeof (ctrl_addr), 0) < 0) {  将其绑定到我们的地址\n153         perror(\"\
  ftpd: bind\");\n154         sleep(5);\n155     }\n156     signal(SIGCHLD, reapchild);\n\
  157     listen(s, 10);                                            标记为监听状态\n158 \
  \    for (;;) {\n159          int hisaddrlen = sizeof (his_addr);\n161\n161    \
  \      ctrl = accept(s, &his_addr, &hisaddrlen, 0);         接受连接\n162          if\
  \ (ctrl < 0) {                                      错误处理\n163              if (errno\
  \ == EINTR)\n164                  continue;\n165              perror(\"ftpd: accept\"\
  );\n166              continue;\n167          }\n168          if (fork() == 0) {\
  \                                   分叉子进程\n169              signal (SIGCHLD, SIG_IGN);\n\
  170              dolog(&his_addr);\n171              close(s);                 \
  \                       关闭原始套接字\n172              dup2(ctrl, 0), close(ctrl), dup2(0,\
  \ 1);          将新套接字移动到标准输入输出\n173              /*在此处理 telnet 选项协商 */          留下的复制/粘贴\
  \ :-)\n...\n183              (void) getsockname(0, &ctrl_addr, sizeof (ctrl_addr));\n\
  184              gethostname(hostname, sizeof (hostname));\n185              reply(220,\
  \ \"%s FTP server (%s) ready.\",           发送“我已就绪”消息\n186                  hostname,\
  \ version);\n187              for (;;) {                                       \
  \ 读取/回复循环\n188                  setjmp(errcatch);\n189                  yyparse();\
  \                                    在此处完成工作\n190              }\n191          }\n\
  192          close(ctrl);                                          在父进程中关闭新套接字描述符\n\
  193     }\n194  }\n```\n\n第 8–11 行是基础套接字头文件；还有更多我们省略的。第 42–45 行声明了 `sockaddr_in`\
  \ 结构（稍后会详细介绍它们）。第 77–78 行声明了信号处理程序。\n\n主程序首先通过 `getservbyname`（第 88–92 行）获取服务信息——即使用的协议和端口。服务信息存储在\
  \ `/etc/services` 文件中。查看手册页；它非常直观。\n\n接下来，程序设置端口。FTP 的异常之处在于，它被定义了两个端口——一个用于控制（命令），另一个用于数据：\n\
  \n```\n$ grep -w ftp /etc/services\nftp-data        20/tcp\nftp             21/tcp\n\
  ...\n```\n\n第 94 行将数据端口设置为比控制端口小 1，转换方法是将控制端口值值转换为原生 `short` 然后减 1。\n\n现在我们进入核心部分。第\
  \ 143–146 行创建套接字。第 152–155 行将其绑定到我们的地址（`ctrl_addr`）。第 156 行通过设置信号处理程序来处理回收子进程。第\
  \ 157 行通过 `listen()` 将套接字标记为监听状态。\n\n第 158–193 行是服务器的无限循环。第 161 行调用 `accept()`，第\
  \ 162–167 行通过简单的重试处理任何错误。第 168–191 行分叉子进程来处理对话；父进程中的第 192 行关闭 `accept()` 返回的新套接字文件描述符。\n\
  \n第 8–11 行是基础的套接字头文件；还有更多我们省略的。第 42–45 行声明了 `sockaddr_in` 结构（稍后会详细介绍它们）。第 77–78\
  \ 行声明了信号处理程序。\n\n主程序开始获取服务信息——即使用的协议和端口，通过 `getservbyname`（第 88–92 行）。服务信息存储在 `/etc/services`\
  \ 文件中。查看手册页；它非常直观。\n\n接下来，程序设置端口。FTP 的异常之处在于，它被定义了两个端口——一个用于控制（命令），另一个用于数据：\n\n\
  ```\n$ grep -w ftp /etc/services\nftp-data        20/tcp\nftp             21/tcp\n\
  ...\n```\n\n第 94 行将数据端口设置为比控制端口小 1，转换方法是将控制端口值转换为原生 `short` 然后减 1。\n\n现在我们进入核心部分。第\
  \ 143–146 行创建套接字。第 152–155 行将其绑定到我们的地址（`ctrl_addr`）。第 156 行通过设置信号处理程序来处理回收子进程。第\
  \ 157 行通过 `listen()` 将套接字标记为监听状态。\n\n第 158–193 行是服务器的无限循环。第 161 行调用 `accept()`，第\
  \ 162–167 行通过简单的重试处理任何错误。第 168–191 行分叉子进程来处理对话；父进程中的第 192 行关闭 `accept()` 返回的新套接字描述符。\n\
  \n在子进程中，第 169 行忽略了自身的 `SIGCHLD`。第 170 行记录新连接。第 171 行关闭父进程的原始套接字——我们之前未提到的重要操作。（现代代码可以在创建套接字后设置\
  \ `FD_CLOEXEC` 标志，或在 `socket()` 调用中使用 `SOCK_CLOFORK` 标志。）第 172 行将新套接字移动到描述符 0 和\
  \ 1，即标准输入标准输出。这使得工作代码可以像任何其他程序一样使用它们。\n\n第 173 行很有趣；显然是从 TELNET 服务器复制过来的。第 185–186\
  \ 行向客户端发送“已就绪”消息。第 187–190 行运行无限循环以读取并执行命令。最终，其中一个命令是“quit”，会导致子服务器进程退出。\n\n## 14.6\
  \ 客户端程序的基本结构\n\n在上节中，我们涵盖了套接字基础创建和使用的大部分细节。现在来看客户端视角：如何创建和使用客户端套接字。\n\n### 14.6.1\
  \ 创建套接字：`socket()`\n\n第一部分很简单。创建客户端套接字与创建服务器套接字相同——你调用 `socket()`：\n\n```\nint sockfd;\n\
  \nsockfd = socket(AF_UNIX, SOCK_STREAM, IPPROTO_TCP);\nif (sockfd < 0) {\n    fprintf(stderr,\
  \ \"%s: socket failed: %s\\n\", argv[0], strerror(errno));\n    exit(EXIT_FAILURE);\n\
  }\n```\n\n如之前一样，套接字现在存在，但处于真空状态；它尚未用于任何地方。\n\n### 14.6.2 发起调用：`connect()`\n\n\n\n\
  \n客户端使用 `connect()` 系统调用连接服务器：\n\n```\n#include <sys/types.h>                  \
  \   POSIX\n#include <sys/socket.h>\n\nint connect(int sockfd, const struct sockaddr\
  \ *addr, socklen_t addrlen);\n```\n\n此时，你应该已经熟悉 `addr` 和 `addrlen` 参数了。你需要向一个 `struct\
  \ sockaddr_in` 结构体中填充你想要连接的系统的地址族、地址和端口：\n\n```\nsocklen_t socklen;\nstruct sockaddr_in\
  \ server_addr;\n... 填充它 ...\nsocklen = sizeof(server_addr);\n\nif (connect(sockfd,\
  \ & server_addr, socklen) < 0) {\n    fprintf(stderr, \"could not connect: %s\\\
  n\", strerror(errno));\n    exit(EXIT_FAILURE);\n}\n```\n\n一旦套接建立连接，通信方式与服务器端相同；你使用\
  \ `read()` 接收数据，使用 `write()` 发送数据。\n\n完成后，你可以使用 `shutdown()` 关闭一个或两个端，或者更常见的是直接使用\
  \ `close()` 关闭套接。\n\n### 14.6.3 示例客户端代码：`ftp`\n\n让我们来看 4.4 BSD FTP 客户端 `ftp`。在文件\
  \ `ftp.c` 中，`hookup()` 函数处理了所有的套接字工作。行号相对于文件开头。它于头文件包含和全局变量声明：\n\n```\n38  #include\
  \ <sys/param.h>                     包含头文件\n39  #include <sys/stat.h>\n40  #include\
  \ <sys/ioctl.h>\n41  #include <sys/socket.h>\n42  #include <sys/time.h>\n43  #include\
  \ <sys/file.h>\n...\n64  struct sockaddr_in hisctladdr;             地址结构体\n65  struct\
  \ sockaddr_in data_addr;\n66  int data = -1;\n67  int abrtflag = 0;\n68  int ptflag\
  \ = 0;\n69  struct sockaddr_in myctladdr;\n```\n\n第一步是获取服务器的地址。代码首先检查是否 IP 地址。如果失败，则通过名称查找服务器。这是通过一个名为\
  \ `gethostbyname()` 的函数实现的。该函数仍然存在但已被废弃（更多信息请参见“练习”、“第 504 页”）：\n\n```\n 78  char\
