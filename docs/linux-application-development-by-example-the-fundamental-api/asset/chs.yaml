  \ statb.st_ctime;\n393          else\n394              rep->lmtime = statb.st_mtime;\n\
  395          tblocks += nblock(statb.st_size);\n396      }\n397      return(rep);\n\
  398  }\n```\n\n第 356–396 行处理对 `stat()` 的调用。如果这是一个命令行参数，或者由于选项导致 `statreq` 为真，代码将如下方式填充\
  \ `struct lbuf`：\n\n*   第 357–366 行：调用 `stat()`；如果失败，打印错误信息并设置适当的值，然后返回 `NULL`（表示为\
  \ `0`）。（错误消息实际上应该通过 `fprintf()` 发送到 `stderr`，而不是使用 `printf()` 将其发送到 `stdout`。）\n\
  \n*   第 367–368 行：如果 `stat()` 成功，从 `struct stat` 中设置 inode 编号和大小字段。\n\n*   第 369–384\
  \ 行：处理目录、块设备和字符设备的特殊情况。在所有情况下，代码都会更新 `ltype` 字段。对于设备，`lsize` 值被替换为 `st_rdev` 值。\n\
  \n*   第 385–388 行：从 `struct stat` 的对应字段填充 `lflags`、`luid`、`lgid` 和 `lnl` 字段。第 385\
  \ 行移除文件类型位，留下 12 位权限位（用户/组/其他读/写/执行，以及 setuid、setgid 和 save-text）。\n\n*   第 389–394\
  \ 行：根据命令行选项，使用 `struct stat` 中的三个时间字段之一用于 `struct lbuf` 中的 `lmtime` 字段。\n\n*   第\
  \ 395 行：用文件的块数更新全局变量 `tblocks`。\n\n接下来是 `compar()`，用于配合 `qsort()` 进行排序：\n\n```c\n\
  400  compar(pp1, pp2)                                int compar(struct lbuf **pp1,\n\
  401  struct lbuf **pp1, **pp2;                               struct lbuf **pp2)\n\
  402  {\n403      register struct lbuf *p1, *p2;\n404\n405      p1 = *pp1;\n406 \
  \     p2 = *pp2;\n407      if (dflg==0) {\n408          if (p1->lflags&ISARG &&\
  \ p1->ltype=='d') {\n409              if (!(p2->lflags&ISARG && p2->ltype=='d'))\n\
  410                  return(1);\n411          } else {\n412              if (p2->lflags&ISARG\
  \ && p2->ltype=='d')\n413                  return(-1);\n414          }\n415    \
  \        \n416      if (tflg) {\n417          if(p2->lmtime == p1->lmtime)\n418\
  \              return(0);\n419          if(p2->lmtime > p1->lmtime)\n420       \
  \       return(rflg);\n421          return(-rflg);\n422      }\n423      return(rflg\
  \ * strcmp(p1->lflags&ISARG? p1->ln.namep: p1->ln.lname,\n424                  p2->lflags&ISARG?\
  \ p2->ln.namep: p2->ln.lname));\n425  }\n```\n\n这个函数非常紧凑：在很小的范围内发生了很多操作。首先要记住的是返回值的含义：负值表示第一个文件应该排在数组中比第二个更靠的位置，零表示文件相等，正值表示第二个文件应该排在更靠的位置。\n\
  \n下一步需要理解的是 `ls` 在打印文件信息*之后*打印目录的内容。因此排序的结果应该是命令行指定的目录位于文件之后。\n\n最后，`rflg` 变量帮助实现\
  \ `-r` 选项反转排序顺序。它初始化为 `1`（第 30 行）。如果使用了 `-r`，`rflg` 设置为 `-1`（第 89–91 行）。\n\n以下伪代码描述了\
  \ `compar()` 的逻辑；左侧行号对应 `ls.c` 中的行号：\n\n```407  if ls 必须读取目录   # dflg == 0\n408\
  \      if p1 是命令行参数且 p1 是目录\n409          if p2 不是命令行参数且不是目录\n410              return\
  \ 1 # 第一个在第二个之后\n411          else\n412                 继续执行时间测试\n413      else\n\
  414             # p1 不是命令行目录\n415          if p2 是命令行参数且是目录\n416              return\
  \ -1 # 第一个在第二个之前\n417          else\n418                 继续执行时间测试\n\n419  如果基于时间进行排序\
  \   # tflg 为真\n420      if p2 的时间等于 p1 的时间\n421          return 0\n422      if p2\
  \ 的时间大于 p1 的时间\n423          return rflg 的值（正或负）\n424         # p2 的时间小于 p1 的时间\n\
  425      return rflg 的反值（负或正）\n```\n\n第 423–424 行 `strcmp()` 的参数看起来很乱。发生的情况是，根据文件名是命令行参数还是从目录读取的，必须使用\
  \ `struct lbuf` 中 `ln` 联合体不同的成员。\n\n## 7.3 总结\n\n\n\n\n\n*   V7 `ls` 是一个相对较小的程序，但它涉及了\
  \ Unix 编程的许多基础方面：文件 I/O、文件元数据、目录内容、用户和组、时间和日期值、排序以及动态内存管理。\n*   V7 `ls` 与现代 `ls`\
  \ 之间最显著外部区别在于对 `-a` 和 `-l` 选项的处理。V7 选项比现代版本少得多；一个明显的缺失是缺少 `-R` 递归选项。\n*   对 `flist`\
  \ 的管理是一种利用 PDP-11 架构限制内存的整洁方法，同时仍提供尽可能多的信息。`struct lbuf` 很好地从 `struct stat` 中抽象出所感兴趣的信息；这极极地简化了代码。打印九个权限位的代码紧凑且优雅。\n\
  *   `ls` 的某些部分使用了惊人的微小限制，例如文件数量上限为 `1024`，或者 `makename()` 中 `100` 的缓冲区大小。\n\n###\
