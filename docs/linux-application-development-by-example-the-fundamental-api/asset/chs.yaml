  \         break;\n154\n155     case CLD_TRAPPED:\n156         write(1, \"\\tchild\
  \ trapped\\n\");\n157         break;\n158     }\n```\n\n\n\n\n*   信号处理程序返回后发生的情况取决于系统的类型。传统系统（V7、Solaris\
  \ 以及可能的其他系统）会将信号处理方式重置为默认值。在这些系统上，被中断的系统调用返回 `–1`，并将 `errno` 设置为 `EINTR`。BSD 系统则保留已安装的处理程序，并且仅在没有传输数据时才返回\
  \ `–1` 并将 `errno` 设置为 `EINTR`；否则，它们会重启系统调用。\n\n*   GNU/Linux 遵循 POSIX 标准，与 BSD 相似但并不完全相同。如果没有传输数据，系统调用返回\
  \ `–1`/`EINTR`。否则，它返回传输的数据量。BSD 的“始终重启”行为在 `sigaction()` 接口中可用，但不是默认设置。\n\n*   配合\
  \ `signal()` 使用信号处理程序容易发生竞态条件。在信号处理程序内部应专门使用 `volatile sig_atomic_t` 类型的变量。（为了演示之目的，我们在某些示例中没有遵循这一规则。）同样地，只有表\
  \ 10.2 中的函数才能安全地从信号处理程序内部调用。\n\n*   System V Release 3 信号 API（提取自 4.0 BSD）是对可靠信号的早期尝试。不要在新的代码中使用它。\n\
  \n*   POSIX API 包含多个组件：\n    *   – 进程信号掩码，包含当前被阻塞的信号。\n    *   – 用于表示信号掩码的 `sigset_t`\
  \ 类型，以及用于处理它的 `sigfillset()`、`sigemptyset()`、`sigaddset()`、`sigdelset()` 和 `sigismember()`\
  \ 函数。\n    *   – `sigprocmask()` 函数，用于设置和检索进程信号掩码。\n    *   – `sigpending()` 函数，用于检索等待信号集。\n\
  \    *   – 极其完备的 `sigaction()` API 和 `struct sigaction`。\n\n这些设施结合使用信号阻塞和进程信号掩码来提供可靠的信号。此外，通过各种标志，可以获得可重启的系统调用以及更强大的信号处理程序，后者可以接收关于特定信号原因的更多信息（`siginfo_t`\
  \ 结构）。\n\n*   `kill()` 和 `killpg()` 是 POSIX 发送信号的机制。它们与 `raise()` 有两个不同：(1) 一个进程可以向另一个进程或整个进程组发送信号（当然是在权限允许的情况下）；(2)\
  \ 发送信号 `0` 不发送任何内容但会进行检查。因此，这些函数提供了一种验证特定进程或进程组存在的方法，并具有向其（它们）发送信号的能力。\n\n*   信号可以用进程间通信（IPC）机制，尽管这种用法是结构化程序的糟糕方法，并且容易发生竞态条件。如果有人拿枪指你的头让你这样做，请使用仔细的信号阻塞和\
  \ `sigaction()` 接口来正确实现。\n\n*   `SIGALRM` 和 `alarm()` 系统调用提供了一种经过秒数后通知的低级机制。`pause()`\
  \ 挂起进程直到任何信号进入。`sleep()` 使用这些让进程睡眠指定的时间；`sleep()` 和 `alarm()` 不应一起使用。`pause()` 本身会引发竞态条件；应该使用信号阻塞和\
  \ `sigsuspend()`。\n\n*   作业控制信号为 shell 实现作业控制。大多数时候，你应该让它们设置为默认值，但了解偶尔捕获它们是有意义的。\n\
  \n*   捕获 `SIGCHLD` 让父进程知道其子进程正在做什么。使用 `signal(SIGCHLD, SIG_IGN)`（或带有 `SA_NOCLDWAIT`\
  \ 的 `sigaction()`）完全忽略子进程。使用带有 `SA_NOCLDSTOP` 的 `sigaction()` 只提供终止通知。在后一种，无论是否阻塞\
  \ `SIGCHLD`，`SIGCHLD` 的信号处理程序都应该准备好同时回收多个子进程。最后，使用不带 `SA_NOCLDSTOP` 的 `sigaction()`\
  \ 配合三参数的信号处理程序，可以让你获得接收信号的原因。（呼！）\n\n*   在 `fork()` 之后，子进程中的信号处理方式保持不变，但等待信号和闹器会被清除。在\
  \ `exec` 之后，情况稍显复杂——基本上所有可以不管的保持不变；其他的都会重置为默认值。\n\n### 练习\n\n1.  使用 `sigaction()`\
