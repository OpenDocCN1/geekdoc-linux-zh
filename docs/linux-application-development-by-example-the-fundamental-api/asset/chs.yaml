  \ 行将父进程到子进程的读端复制到 `0`。如果这一切运行正常，子进程的标准输入输出现在已经到位并与父进程连接。（嗯……这段代码可以受益于 Chet Ramey\
  \ 的建议，使用 `dup2()` 代替 `close()` 加上 `dup()`。）\n\n第 2471–2478 行关闭所有原始管道文件描述符，因为它们不再需要了。第\
  \ 2474 行提醒我们标准错误保持原位。这是最好的决定，因为用户将看到协进程的错误。必须捕获标准错误的 `awk` 程序可以使用命令中的 `2>&1` shell\
  \ 符号来重定向协进程的标准错误，或将其发送到单独的文件。\n\n最后，第 2476–2477 行尝试在 shell 上执行 `execl()`，如果失败则适当退出。接下来是父进程的代码：\n\
  \n```c\n2481     /* 父进程 */\n        ...\n2486     rp->pid = pid;\n2487     rp->iop\
  \ = iop_alloc(ctop[0], str, 0);\n2488     find_input_parser(rp->iop);\n2489    \
  \ iop_finish(rp->iop);\n2490     if (! rp->iop->valid) {\n2491         if (! do_traditional\
  \ && rp->iop->errcode != 0)\n2492             update_ERRNO_int(rp->iop->errcode);\n\
  2493         iop_close(rp->iop);\n2494         rp->iop = NULL;\n2495         (void)\
  \ close(ctop[1]);\n2496         (void) close(ptoc[0]);\n2497         (void) close(ptoc[1]);\n\
  2498         (void) kill(pid, SIGKILL);\n2499\n2500         return false;\n2501\
  \     }\n```\n\n\n\n\n父进程的第一步是管理来自协进程的输入端。`rp` 指针指向一个 `struct redirect` 结构体，其中包含一个存储子\
  \ PID 的字段、一个用于输出的 `FILE *` 以及一个名为 `iop` 的 `IOBUF *` 指针。`IOBUF` 是 `gawk` 用于输入的内部数据结构，它内部保留了底层文件描述符的副本。\n\
  \n第 2486 行保存进程 ID 值。第 2487 行为给定的文件描述符和命令字符串分配一个新的 `IOBUF`。这里的第三个参数为零；用于初始化 `errno`\
  \ 的内部副本。\n\n如果分配失败，第 2490–2501 行通过设置 `gawk` 的 `ERRNO` 变量、关闭 `*iop` 结构、关闭管道并向子进程发送“kill”信号使其强制终止。（`kill()`\
  \ 函数详见 第 10.6.7 节 中的 “发送信号：`kill()` 和 `killpg()``，“第 358 页。）接下来的行与之类似：\n\n```\n\
  2502     rp->output.fp = fdopen(ptoc[1], binmode(\"w\"));\n2503     rp->output.mode\
  \ = \"w\";\n2504     rp->output.name = str;\n2505     if (rp->output.fp == NULL)\
  \ {\n2506         iop_close(rp->iop);\n2507         rp->iop = NULL;\n2508      \
  \   (void) close(ctop[0]);\n2509         (void) close(ctop[1]);\n2510         (void)\
  \ close(ptoc[0]);\n2511         (void) close(ptoc[1]);\n2512         (void) kill(pid,\
  \ SIGKILL);\n2514\n         return false;\n2515     }\n```\n\n第 2502–2515 行设置父进程到子进程的输出，通过\
  \ `fdopen()` 将父子进程管道写入端的文件描述符保存到 `FILE *` 中。如果此失败，第 2505–2515 行将采取相同操作：关闭所有管道描述符并向子进程发送信号。\n\
  \n从这里开始，父子进程管道的写端和子父进程管道的读端分别保留在更大的结构中：即 `FILE *` 和 `IOBUF`。它们将由关闭这些结构的常规程序自动关闭。然而，还有两个任务：\n\
  \n```\n2520     os_close_on_exec(ctop[0], str, \"pipe\", \"from\");\n2521     os_close_on_exec(ptoc[1],\
  \ str, \"pipe\", \"from\");\n2522\n2523     (void) close(ptoc[0]);\n2524     (void)\
  \ close(ctop[1]);\n        ...\n2527     return true;\n2528     }\n```\n\n第 2520–2521\
  \ 行为两个保持打开的描述符设置 `close-on-exec` 标志。`os_close_on_exec()` 是一个简单的包装程序，在 Unix 和 POSIX\
  \ 兼容系统上执行，但在没有 `close-on-exec` 标志的系统上不执行操作。这将可移植性问题封装在单一位置，避免了在此处及 `io.c` 其他地方出现大量混乱的\
  \ `#ifdef`。（第 2521 行应表示管道是“通往”子进程的。我们在此后已修复了这一点。）\n\n最后，第 2523–2524 行关闭父进程不需要的端，第\
  \ 2527 行返回 `true` 表示成功。\n\n## 9.6 建议阅读\n\n作业控制非常复杂，涉及进程组、会话、等待机制、信号以及对终端进程组的操作。因此，我们选择不进入细节。不过，你可能想参考以下书籍：\n\
  \n1. *Advanced Programming in the UNIX Environment*, 3rd ed., W. Richard Stevens\
  \ 和 Stephen A. Rago 著。Addison-Wesley, 2013. ISBN-13: 978-0-321-63773-4。\n这本书既全面又深入，涵盖了基础和高级\
  \ Unix 编程。在涵盖进程组、会话、作业控制和信号方面做得非常出色。\n\n2. *The Design and Implementation of the\
  \ FreeBSD Operating System*, 2nd ed., Marshall Kirk McKusick, George V. Neville-Neil\
  \ 和 Robert N. M. Watson 著。Addison-Wesley, 2015\\. ISBN-13: 978-0-321-96897-5.\n\
  这本书对相同材料进行了良好的概述，包括对内核数据结构的讨论。\n\n## 9.7 总结\n\n* 新进程通过 `fork()` 创建。`fork` 之后，两个进程运行相同的代码，唯一的区别是返回值：子进程中为\
  \ `0`，父进程中为正数 PID 号。子进程继承了父进程几乎所有属性的副本，其中打开的文件可能是最重要的。\n* 继承的共享文件描述符使得许多高级别的 Unix\
  \ 语义和优雅的 shell 控制结构成为可能。这是原始 Unix 设计中最基础的部分之一。由于描述符的共享，只有当最后一个打开的文件描述符关闭时，文件才会被真正关闭。这特别影响管道，但也会影响已取消链接（unlinked）但仍打开的文件磁盘块的释放。\n\
  * `getpid()` 和 `getppid()` 调用分别返回当前进程和父进程 ID。父进程死亡的进程会被重新分配给特殊的 `init` 进程（PID 为\
  \ `1`）。因此，PPID 可能会发生，应用程序应该做好准备。\n* `nice()` 系统调用允许你调整进程的优先级。你对其他进程越“友好”，你的优先级就越低，反之亦然。只有超级用户可以对其他进程不那么“友好”。在现代系统中，尤其是单用户系统，没有真正的理由更改\
  \ `nice` 值。\n* `exec()` 系统调用在现有进程中启动新程序。七种不同版本的调用在参数和环境列表的设置上提供了灵活性，代价是最初对于使用哪种最好感到困惑。两个变体模拟了\
  \ shell 的路径搜索机制，并在文件不是二进制可执行文件时回退到使用 shell 解释该文件；这些变体应谨慎使用。\n* 新程序中 `argv[0]` 的值通常来自正在执行的文件名，但这仅是一种约定。与\
  \ `fork()` 类似，在 `exec` 过程中会继承一组显著但并不完全相同的属性。其他属性被重置为合理的默认值。\n* 使用标准退出值 `EXIT_SUCCESS`\
  \ 和 `EXIT_FAILURE` 以获得最大的可移植性。如果定义了自己的退出码，请将其记录文档，且不要定义过多。\n* `atexit()` 函数注册回调函数，在程序终止时按后进先（LIFO）顺序运行。`exit()`、`_exit()`\
  \ 和 `_Exit()` 函数都会终止程序并将退出状态传给父进程。`exit()` 会清理打开的 `FILE *` 流并运行与 `atexit()` 注册的函数。另外两个函数立即退出，仅应在\
  \ fork 子进程中的 `exec` 失败时使用。从 `main()` 返回相当于调用带返回值的 `exit()`。在 C99 和 C++ 中，从 `main()`\
  \ 结束等同于 `exit(0)` 但不是良好的做法。\n* `wait()`、`waitpid()` 和 `waitid()` 是获取退出状态的 POSIX\
  \ 函数。各种宏可以判断进程是否正常退出并确定其退出状态（如果是），或者判断进程是否死于信号以及是哪个信号导致的（如果是）。通过特定选项，`waitpid()`\
  \ 和 `waitid()` 还能提供未死亡但状态改变的孩子的信息。\n* GNU/Linux 和大多数 Unix 系统支持 BSD 的 `wait3()` 和\
  \ `wait4()` 函数。BSD 函数提供 `struct rusage`，允许访问 CPU 时间信息，这可能很有用。但如果 `waitpid()` 或 `waitid()`\
  \ 就能满足需求，它们是更具移植性的方法。\n* 进程组是作业控制机制的一部分，包括信号、会话和对终端状态的操作。`getpgrp()` 返回当前进程的进程组\
  \ ID，`getpgid()` 返回特定进程的 PGID。同样，`setpgrp()` 将当前进程的 PGID 设置为其 PID，使其成为进程组组；`setpgid()`\
  \ 允许父进程为尚未执行 的子进程设置 PGID。\n\n\n\n\n- `Pipes and FIFOs`（管道和 FIFO）为两个进程提供了单向通信通道。管道必须由共同祖先设置，而\
  \ FIFO 可以被任何两个进程使用。管道通过 `pipe()` 创建，而 FIFO 文件通过 `mkfifo()` 创建。管道和 FIFO 都会对其数据进行缓冲，当管道填满或排空时，会停止生产者或消费者。\n\
  \n- `dup()` 和 `dup2()` 创建打开的文件描述符的副本。结合 `close()` 使用，它们允许管道文件描述符被替换为管道的标准输入和输出。为了让管道正常工作，在执行（execing）目标程序之前，必须关闭管道所有未使用端点的副本。`/dev/fd`\
  \ 可用于创建非线性管道，如 Bash 和 Korn Shell 的进程替换功能所演示的那样。\n\n- `dup3()` 以原子操作的方式复制文件描述符并设置任何请求的标志。这有助于避免线程代码中的竞态条件。\n\
  \n- `fcntl()` 是一个用于执行杂杂任务的通用函数。它管理文件描述符本身以及该描述符底层打开文件的属性。在本章中，我们看到 `fcntl()` 用于以下场景：\n\
  \n    - 复制文件描述符，模拟 `dup()`，并几乎模拟 `dup2()` 和 `dup3()`。\n\n    - 获取并设置 `close-on-exec`\
  \ 和 `close-on-fork` 标志。`close-on-exec` 标志可能是更重要的。`dup()` 操作不会复制任何一个标志；对于任何在 fork\
  \ 或 exec 之后不应保持打开的文件描述符，都应该显式地设置这些标志（取决于你的程序逻辑）。在实践中，大多数文件描述符至少应该设置 `close-on-exec`\
  \ 标志。\n\n    - 获取并设置控制底层文件的标志。在这些标志中，`O_NONBLOCK` 可能是最有用的，至少对于 FIFO 和管道而言。它绝对是最复杂的标志。\n\
  \n### 练习\n\n1. 编写一个程序，打印尽可能多关于当前进程的信息：PID、PPID、打开的文件、当前目录、nice 值等。你如何判断哪些文件是打开状态的？如果有多个文件描述符引用同一个文件，请也指出来。（再次，你是如何判断的？）\n\
  \n2. 你认为 `atexit()` 是如何存储回调函数指针的？请实现 `atexit()`，并记住 GNU “无任意限制”的原则。为 `exit()` 拟一个大纲（伪代码）。你缺少哪些信息（`<stdio.h>`\
  \ 库内部），由于这些信息的缺失导致你无法编写 `exit()`？\n\n3. `xargs` 程序设计用于多次运行命令及其参数，当参数数量过多无法直接在命令行中传递时使用。它通过从标准输入读取行，将每行视为命名命令的独立参数，并打包参数直到其数量恰好且仍低于系统最大值为止。例如：\n\
  \n    ```\n    $ grep ARG_MAX /usr/include/*.h /usr/include/*/*.h    命令行\n    bash:\
  \ /bin/grep: Argument list too long               Shell 的错误信息\n\n    $ find /usr/include\
  \ -name '*.h' | xargs grep ARG_MAX  find 和 xargs 正常工作\n    /usr/include/sys/param.h:#define\
  \        NCARGS         ARG_MAX\n    ...\n    ```\n\n    `<limits.h>` 中的常量 `ARG_MAX`\
  \ 代表环境和命令行参数使用的总内存。POSIX 标准没有说明这是否包含指针数组或仅包含字符串本身。\n\n    编写一个按描述运行的简单版本的 `xargs`。在计算可用空间时不要忘记环境。务必仔细管理你的内存。\n\
  \n4. `wait()` 和 `waitpid()` 填充的 `status` 值的布局并没有由 POSIX 定义。从历史角度看，它是一个 16 位的值，如图\
  \ 9.8\n\n    图 9.8：来自 `wait()` 的 status 值布局\n\n    - 第 0–6 位中的非零值表示因信号死亡（death-by-signal）。\n\
  \n    - 信号字段中所有 1 位表示子进程停止。在这种情况下，第 8–15 位包含导致进程停止的信号号。\n\n    - 第 7 位的 1 位表示带核心转储的退出（death\
  \ with core dump）。\n\n    - 如果第 0–7 位为零，则进程正常退出。在这种情况下，第 8–15 位是退出状态。\n\n    根据这些信息，编写\
  \ POSIX 的 `WIFEXITED()` 等宏。\n\n5. 记住 `dup2()` 会先关闭请求的文件描述符，请使用 `close()` 和 `fcntl()`\
  \ 实现 `dup2()`。你如何处理 `fcntl()` 返回值低于请求值的情况？\n\n6. 你的系统有 `/dev/fd` 目录吗？如果有，它是如何实现的？\n\
  \n7. 编写一个新版本的 `ch-processes-pipeline.c`，它只 fork 一个进程。fork 之后，父进程应该重新排列其文件描述符并自身执行一个新程序之一。\n\
  \n8. 编写一个新版本的 `ch-processes-pipeline.c`，创建 FIFO 并设置管道。设置和清理都需要哪些额外的步骤？\n\n9. （困难。）你如何判断你的进程是否调用过\
  \ `chroot()`？编写一个程序来检查并打印指示是或否的消息。你的程序会被受欺骗吗？如果是，是如何被欺骗的？\n\n10. 你的系统有 `/proc` 目录吗？如果有，它提供了什么种的进程信息？\n\
  \n## 第 10 章\n\n## 信号\n\n本章将涵盖信号的内部细节，这是 GNU/Linux API 中一个重要但复杂的部分。\n\n## 10.1 引言\n\
  \n`signal`（信号）是某些事件已经发生的指示——例如，尝试引用不属于你程序地址空间的内存地址，或者用户按下 CTRL-C 停止你的程序（这称为产生中断）。\n\
  \n你的程序只能知道某个信号至少发生一次。通常，你无法判断同一个信号是否发生了多次。你可以区分不同的信号，并控制程序对不同信号的反应。\n\n信号处理机制随着时间的演变。与几乎所有此类机制一样，原始和新的\
  \ API 都是标准且可用的。然而，在基础 API 中，信号处理显示了可能最广泛的变化；要使用大多数 API 需要大量的掌握。因此，这可能是最难的一章。我们将尽力提供连贯的陈述，但如果你比平时更仔细地学习这一章将帮助。\n\
  \n## 10.2 信号动作\n\n每个信号（稍后提供完整列表）都有一个关联的动作。POSIX 将此称为信号的处置（disposition）。当特定信号到达时，内核对进程的操作。默认动作各异：\n\
  \n- *终止（Termination）*\n\n    进程终止。\n\n- *忽略（Ignored）*\n\n    信号被忽略。程序永远感知不到发生了任何事情。\n\
  \n- *核心转储（Core dump）*\n\n    进程终止，内核创建一个包含信号到达时运行程序镜像的 `core` 文件。核心转储稍后可以使用调试器检查程序状态（查看第\
  \ 17 章、“调试,”页 591)）。\n\n    传统的 Unix 系统将文件命名为 `core`，将其放在死亡进程的当前目录下，如果可能在同一目录下创建更多文件，则由你保存任何\
  \ `core` 文件以备后重新检查。\n\n\n\n\n在 GNU/Linux 上，情况要复杂得多；我们将讨论推迟到第 17.3.1 节，“获取 `core`\
  \ 文件](#ch17.xhtml_ch17lev2sec1)”，第 594 页。\n\n*   `Stopped`（停止）\n\n进程已停止。它以后可以继续运行。（如果你使用过\
  \ CTRL-Z、`fg` 和 `bg` 等 shell 作业控制，你就能理解停止进程的意思。）\n\n## 10.3 标准 C 信号：`signal()` 和\
  \ `raise()`\n\nISO C 标准定义了原始的 V7 信号管理 API 以及一个用于发送信号的 API。对于必须在非 POSIX 系统上运行的程序，或者在它们提供的功能已足够的情况下，你应该使用这些\
  \ API。\n\n### 10.3.1 `signal()` 函数\n\n你使用 `signal()` 函数更改信号的操作。你可以将操作更改为：“忽略此信号”、“恢复系统对该信号的默认操作”或“当信号发生时，用信号号作为参数调用我的函数”。\n\
  \n你提供的用于处理信号的函数被称为 `signal handler`（信号处理程序，或简称 `handler`），放置一个处理器就是安排`捕获信号`。\n\n\
  在介绍这些内容后，让我们进入 API。`<signal.h>` 头文件提供了受支持信号的宏定义，并声明了标准 C 提供的信号管理函数：\n\n```\n#include\
  \ <signal.h>                                             ISO C\n\nvoid (*signal(int\
  \ signum, void (*func)(int)))(int);\n```\n\n这个 `signal()` 的声明几乎无法阅读。因此，GNU/Linux\
  \ 的 `signal`(2) 手页将其定义如下：\n\n```\ntypedef void (*sighandler_t)(int);\n\nsighandler_t\
  \ signal(int signum, sighandler_t handler);\n```\n\n现在它变得更易读了。`sighandler_t` 类型是一个指向返回\
  \ `void` 的函数的指针，该函数接受一个整数参数。这个整数就是到达的信号号。\n\n`signal()` 函数接受一个信号号作为第一个参数，接受一个指向函数的指针（新处理器）作为第二个参数。如果不是不是函数指针，第二个参数可以是\
  \ `SIG_DFL`（意味着“恢复默认操作”）或 `SIG_IGN`（意味着“忽略信号”）。\n\n`signal()` 更改 `signum` 的操作并返回之前的操作。（这允许你在需要时稍后恢复之前的操作。）返回值也可能是\
  \ `SIG_ERR`，表示发生了错误。（某些信号无法被捕获或忽略；为它们提供信号处理器或提供无效的 `signum` 都会产生此错误返回。）表 10.1 出了出了\
  \ GNU/Linux 下可用的信号、它们的数值、每个信号的默认操作、定义它们的正式标准或现代操作系统以及每个信号的含义。标记为“former POSIX”的项曾包含在\
  \ POSIX 标准中，但现在不再包含。尽管如此，它们仍然可用。\n\n| **名称** | **数值** | **默认** | **来源** | **含义**\
  \ |\n| --- | --- | --- | --- | --- |\n| `SIGHUP` | 1 | Term | POSIX | 挂断 (Hangup)。\
  \ |\n| `SIGINT` | 2 | Term | ISO C | 中断 (Interrupt)。 |\n| `SIGQUIT` | 3 | Core |\
  \ POSIX | 退出 (Quit)。 |\n| `SIGILL` | 4 | Core | ISO C | 非法指令 (Illegal instruction)。\
  \ |\n| `SIGTRAP` | 5 | Core | POSIX | 跟踪陷阱 (Trace trap)。 |\n| `SIGABRT` | 6 | Core\
  \ | ISO C | 终止 (Abort)。 |\n| `SIGIOT` | 6 | Core | BSD | IOT 陷阱。(1) |\n| `SIGBUS`\
  \ | 7 | Core | POSIX | 总线错误 (Bus error). |\n| `SIGFPE` | 8 | Core | ISO C | 浮点数异常\
  \ (Floating-point exception)。 |\n| `SIGKILL` | 9 | Term | POSIX | 杀死 (Kill)，不可阻塞。\
  \ |\n| `SIGUSR1` | 10 | Term | POSIX | 用户自定义信号 1。 |\n| `SIGSEGV` | 11 | Core | ISO\
  \ C | 段错误 (Segmentation violation)。 |\n| `SIGUSR2` | 12 | Term | POSIX | 用户自定义信号\
  \ 2。 |\n| `SIGPIPE` | 13 | Term | POSIX | 管道断开 (Broken pipe)。 |\n| `SIGALRM` | 14\
  \ | Term | POSIX | 闹钟 (Alarm clock)。 |\n| `SIGTERM` | 15 | Term | ISO C | 终止 (Termination)。\
  \ |\n| `SIGSTKFLT` | 16 | Term | Linux | 处理器上的栈错误（未未使用）。 |\n| `SIGCHLD` | 17 | Ignore\
  \ | POSIX | 子进程状态改变。 |\n| `SIGCLD` | 17 | Ignore | System V | 与 `SIGCHLD` 相同（仅用于兼容性）。\
  \ |\n| `SIGCONT` | 18 | | POSIX | 如果已停止则继续。 |\n| `SIGSTOP` | 19 | Stop | POSIX |\
  \ 停止 (Stop)，不可阻塞。 |\n| `SIGTSTP` | 20 | Stop | POSIX | 键盘停止。 |\n| `SIGTTIN` | 21\
  \ | Stop | POSIX | 从 tty 后台读取。 |\n| `SIGTTOU` | 22 | Stop | POSIX | 向 tty 后台写入。\
  \ |\n| `SIGURG` | 23 | Ignore | POSIX | 套字上的紧急情况。 |\n| `SIGXCPU` | 24 | Core | POSIX\
  \ | 超过 CPU 限制。 |\n| `SIGXFSZ` | 25 | Core | POSIX | 超过文件大小限制。 |\n| `SIGVTALRM` |\
  \ 26 | Term | POSIX | 虚拟闹钟。(XSI) |\n| `SIGPROF` | 27 | Term | former POSIX | 分析分析闹钟。\
  \ |\n| `SIGWINCH` | 28 | Ignore | BSD | 窗口大小变化。 |\n| `SIGIO` | 29 | Term | BSD |\
  \ 现在可以 I/O。 |\n| `SIGPOLL` | 29 | Term | former POSIX | 发生可轮询事件；与 `SIGIO` 相同。(XSI)\
  \ |\n| `SIGPWR` | 30 | Term | System V | 电源故障重启。 |\n| `SIGSYS` | 31 | Core | POSIX\
  \ | 错误的系统调用。 |\n\n键：**Core**: | 终止进程并产生 `core` 文件。\n**Ignore**: | 忽略信号。\n**Stop**:\
  \ | 停止进程。\n**Term**: | 终止进程。\n\n**表 10.1：** GNU/Linux 信号\n\n^(1) 与 `SIGABRT`相同。是为了兼容性提供的。\n\
  \n旧版本的 Bourne shell (`/bin/sh`) 将 `trap`（shell 级信号处理器）直接与信号号关联。因此，精通的 Unix 程序员不仅需要用于\
  \ C 代码的信号名称，还需要相应的信号号！POSIX 要求 `trap` 命令理解符号信号名称（不带 `SIG` 前缀），因此这不再是必要的。然而（尽管违背了我们的判断），为了完整性以及由于你某一天需要处理直接使用信号号的旧\
  \ shell 脚本，我们提供了这些数值。\n\n**注意**\n\n对于许多信号，特别是从 `16` 开始的信号号与信号名称之间的关联在不同平台之间并不一定相同！检查你的系统头文件和手页。表\
  \ 10.1 对于大多数 GNU/Linux 系统是正确的。\n\n某些系统还定义其他信号，例如 `SIGEMT`、`SIGLOST` 和 `SIGINFO`。GNU/Linux\
  \ 的 `signal`(7) 手页提供了列表；如果你的程序需要处理 GNU/Linux 不支持的信号，方法是 `#ifdef`：\n\n```\n#ifdef\
  \ SIGLOST\n…在此处理 SIGLOST …\n#endif\n```\n\n`SIGSTKFLT` 外，表 10.1](#ch10.xhtml_ch10tab01)\
  \ 中列出的信号广泛可用，不需要使用 `#ifdef`。\n\n`SIGKILL` 和 `SIGSTOP` 无法被捕获或忽略（或像后文所述无法阻塞）。它们总是执行表\
  \ 10.1](#ch10.xhtml_ch10tab01) 中列出的默认操作。\n\n你可以使用 `kill -l` 查看支持的信号列表。来自我们的一台 GNU/Linux\
  \ 系统：\n\n\n\n\n\n```\n$ kill -l                 是字母 l，而不是数字 1\n 1) SIGHUP      \
  \ 2) SIGINT       3) SIGQUIT      4) SIGILL       5) SIGTRAP\n 6) SIGABRT      7)\
  \ SIGBUS       8) SIGFPE       9) SIGKILL     10) SIGUSR1\n11) SIGSEGV     12) SIGUSR2\
  \     13) SIGPIPE     14) SIGALRM     15) SIGTERM\n16) SIGSTKFLT   17) SIGCHLD \
  \    18) SIGCONT     19) SIGSTOP     20) SIGTSTP\n21) SIGTTIN     22) SIGTTOU  \
  \   23) SIGURG      24) SIGXCPU     25) SIGXFSZ\n26) SIGVTALRM   27) SIGPROF   \
  \  28) SIGWINCH    29) SIGIO       30) SIGPWR\n31) SIGSYS      34) SIGRTMIN    35)\
  \ SIGRTMIN+1  36) SIGRTMIN+2  37) SIGRTMIN+3\n38) SIGRTMIN+4  39) SIGRTMIN+5  40)\
  \ SIGRTMIN+6  41) SIGRTMIN+7  42) SIGRTMIN+8\n43) SIGRTMIN+9  44) SIGRTMIN+10 45)\
  \ SIGRTMIN+11 46) SIGRTMIN+12 47) SIGRTMIN+13\n48) SIGRTMIN+14 49) SIGRTMIN+15 50)\
  \ SIGRTMAX-14 51) SIGRTMAX-13 52) SIGRTMAX-12\n53) SIGRTMAX-11 54) SIGRTMAX-10 55)\
  \ SIGRTMAX-9  56) SIGRTMAX-8  57) SIGRTMAX-7\n58) SIGRTMAX-6  59) SIGRTMAX-5  60)\
  \ SIGRTMAX-4  61) SIGRTMAX-3  62) SIGRTMAX-2\n63) SIGRTMAX-1  64) SIGRTMAX\n```\n\
  \n`SIGRT` `xxx` 信号是实时信号，这是一个我们未涵盖的高级主题。在 Gnu/Linux 上，它们的范围是 `34`–`64`。其他系统使用不同的范围。\n\
  \n### 10.3.2 通过程序方式发送信号：`raise()`\n\n除了外部生成外，程序还可以使用标准 C 函数 `raise()` 直接向自己发送信号：\n\
  \n```c\n#include <signal.h>                           ISO C\n\nint raise(int sig);\n\
  ```\n\n该函数向调用进程发送信号 `sig`。（这种操作有其用处；我们稍后会展示一个示例。）\n\n由于 `raise()` 是标准 C 定义的，它是进程向自己发送信号移植性最好的方式。还有其他方法，我们将在随后的章节中进一步讨论。\n\
  \n### 10.4 信号处理器的实际应用\n\n一旦安装了信号处理器（signal handler），在它被调用以及返回之后，很多复杂性和变化就会体现出来。\n\
  \n### 10.4.1 传统系统\n\n在安置信号处理器后，你的程序会继续按照原来的运行。直到信号到来（例如，用户按下 CTRL-C 中断你的程序，或者调用了\
  \ `raise()`），事情才会变得有趣。\n\n接收到信号后，内核会在进程执行的任何地方停止它。然后它会模拟一次过程调用到信号处理器，并将信号号作为唯一参数传递给它。内核会安排执行，使得信号处理函数的正常返回（通过\
  \ `return` 或运行到函数末尾）将返回到程序中信号发生点。\n\n一旦信号被处理，当下一次相同的信号到来时会发生什么？处理器会保留在原位吗？还是信号的操作会被重置为默认值？由于历史原因，答案是“视实现而定”。具体来说，C\
  \ 标准将其留为由实现定义（implementation defined）”。\n\n在实践中，V7 和传统的 System V 系统（如 Solaris）会将信号的操作重置为默认值。\n\
  \n让我们在 Solaris 下查看一个简单的信号处理器。以下程序 `ch-signals-catchint.c` 捕获 `SIGINT`。你通常通过在键盘上输入\
  \ CTRL-C 来产生这个信号：\n\n```c\n 1  /* ch-signals-catchint.c --- 捕获 SIGINT，至少一次。 */\n\
  \ 2\n 3  #include <signal.h>\n 4  #include <string.h>\n 5  #include <unistd.h>\n\
  \ 6\n 7  /* handler --- 简单的信号处理器。 */\n 8\n 9  void\n10  handler(int signum)\n11\
  \  {\n12      char buf[200], *cp;\n13      int offset;\n14\n15      /* 费尽周章以避免使用\
  \ fprintf(). */\n16      strcpy(buf, \"handler: caught signal \");\n17      cp =\
  \ buf + strlen(buf); /* cp 指向终止符 '\\0' */\n18      if (signum > 100)   /* 不可能 */\n\
  19          offset = 3;\n20      else if (signum > 10)\n21          offset = 2;\n\
  22      else\n23          offset = 1;\n24      cp += offset;\n25\n26      *cp--\
  \ = '\\0';       /* 终止字符串 */\n27      while (signum > 0) {    /* 反向循环填充数字 */\n28\
  \          *cp-- = (signum % 10) + '0';\n29          signum /= 10;\n30      }\n\
  31      strcat(buf, \"\\n\");\n32      int junk = write(2, buf, strlen(buf));\n\
  33  }\n34\n35  /* main --- 设置信号处理并进入无限循环 */\n36\n37  int\n38  main(void)\n39  {\n\
  40      (void) signal(SIGINT, handler);\n41\n42      for (;;)\n43          pause();\
  \    /* 等待信号，见后文 */\n44\n45      return 0;\n46  }\n```\n\n9-33 行定义了信号处理函数（巧妙命名为\
  \ `handler`）。该函数的作用只是打印捕到的信号号并返回。为了生成消息做了大量的可能工作。\n\n#### 10.4.2 BSD 和 GNU/Linux\n\
  \n在 BSD 系统上，信号处理器在返回后仍保留在原位。GNU/Linux 系统遵循 BSD 的行为。以下是 GNU/Linux 下的情况：\n\n```bash\n\
  $  ch-signals-catchint.c                     运行程序\n^Chandler: caught signal 2  \
  \               输入 ^C，处理器被调用\n^Chandler: caught signal 2                 再次……\n\
  ^Chandler: caught signal 2                 再次！\n^Chandler: caught signal 2     \
  \            救命！\n^Chandler: caught signal 2                 我们如何停止这个？！\n^\\Quit\
  \ (core dumped)                       ^\\，产生 SIGQUIT\n```\n\n在 BSD 或 GNU/Linux 系统上，信号处理器不需要额外的\
  \ `signal(signum, handler)` 调用来重新安装处理器。然而，额外的调用也不会造成损害，因为它维持了现状。\n\n事实上，POSIX 曾提供过\
  \ `bsd_signal()` 函数，它与 `signal()` 相同，不同在于它保证信号处理器保持安装状态：\n\n```c\n#include <signal.h>\n\
  \nvoid (*bsd_signal(int sig, void (*func)(int)))(int);\n```\n\n然而，该函数已从更版本的标准中移除，尽管它在\
  \ GNU/Linux 上仍然可用。正如我们所看到的，POSIX `sigaction()` API 提供了足够的设施让你编写一个功能类似的版本，如果你有需要的话。\n\
  \n\n\n\n4.2 BSD 做的另一个额外更改是：在执行处理函数期间，导致处理函数被调用的信号会被阻塞。本章将在稍后部分进一步讨论信号阻塞。\n\n###\
  \ 10.4.3 忽略信号\n\n在更实际应用中，当信号处理函数被调用时，通常意味着程序应该完成工作并退出。如果大多数程序在接收到 `SIGINT` 后只打印信息并继续运行，将是非常讨厌的；信号的意义在于它们应该停止！\n\
  \n例如，考虑 `sort` 程序。`sort` 可能在排序过程的中间阶段创建了任意数量的临时文件。接收到 `SIGINT` 后，`sort` 应该删除这些临时文件然后退出。以下是\
  \ GNU Coreutils `sort.c` 中信号处理函数的简化版本：\n\n```\n/* 处理中断和挂起信号。      为了演示进行了简化 */\n\
  \nstatic void\nsighandler (int sig)\n{\n  signal (sig, SIG_IGN);               \
  \   从现在起忽略此信号\n  cleanup ();                             清理现场工作\n  signal (sig,\
  \ SIG_DFL);                  恢复默认动作\n  raise (sig);                            现在重新发送信号\n\
  }\n```\n\n将动作设置为 `SIG_IGN` 确保了任何后续进入的 `SIGINT` 信号都不会影响正在进行的清理工作。一旦 `cleanup()` 完成，将动作重置为\
  \ `SIG_DFL` 允许系统在进入的信号可以触发核心转储时执行核心转储。调用 `raise()` 会重新生成信号。重新生成的信号将触发默认动作，该动作很可能会终止程序。（我们将在本章稍后部分显示完整的\
  \ `sort.c` 信号处理函数。）\n\n### 10.4.4 可重启系统调用\n\n`errno` 的 `EINTR` 值（见第 4.3 节，“确定发生了什么”、“第\
  \ 81 页””）表示系统调用被中断。虽然有很多系统调用可能会因此错误值失败，但最重要的两个是 `read()` 和 `write()`。考虑以下代码：\n\n\
  ```\nvoid handler(int signal) { /* 处理信号 */ }\n\nint\nmain(int argc, char **argv)\n\
  {\n    signal(SIGINT, handler);\n    ...\n    while ((count = read(fd, buf, sizeof\
  \ buf)) > 0) {\n        /* 处理缓冲区 */\n    }\n    if (count == 0)\n        /* 文件末尾，清理等等\
  \ */\n    else if (count == -1)\n        /* 失败 */\n    ...\n}\n```\n\n假设在发生 `SIGINT`\
  \ 此时，系统已成功读取（并填充）了部分缓冲区。`read()` 系统调用尚未从内核返回程序，但内核认为它可以递送信号。`handler()` 被调用、运行并返回到\
  \ `read()` 的中间。`read()` 返回了什么？\n\n在过去（V7 以及更早的 System V 系统）中，`read()` 会返回 `–1` 并将\
  \ `errno` 设置为 `EINTR`。无法得知数据是否已经传输。在这种情况下，V7 和 System V 的表现就像什么都没有发生一样：数据没有传输到用户缓冲区或从用户缓冲区传输，文件偏移量也没有改变。\n\
  \n4.2 BSD 改变了这一点。有两种情况：\n\n*   **慢设备**\n    “慢设备”本质上是终端或除普通文件以外的任何设备。在这种情况下，只有当信号到达时没有数据传输时，`read()`\
  \ 才会因 `EINTR` 失败。否则，系统调用将重启，`read()` 将正常返回。\n\n*   **普通文件**\n    系统调用将重启。在这种情况下，`read()`\
  \ 将正常返回；返回值将是所请求的字节数，或者是实际可读的字节数（例如在读取文件末尾附近时）。\n\nBSD 的行为显然非常有价值；你总是知道自己读取了多少数据。\n\
  \nPOSIX 的行为与原始 BSD 行为相似，但并不完全相同。POSIX 指出，只有在传输任何数据之前发生信号时，`read()` 才会因 `EINTR` 失败。尽管\
  \ POSIX 没有提到过“慢设备”，但在实践中，这种条件只发生在此类设备上。\n\n尽管我们描述的是 `read()`，但这些规则适用于所有可能因 `EINTR`\
  \ 失败的系统调用，例如 `wait()` 系列的调用。\n\n否则，如果信号中断了部分成功的 `read()`，返回的是到目前为止读取的字节数。出于这个原因（以及能够处理短文件），你应该始终检查\
  \ `read()` 的返回值，而永远不要假设它读取了请求的全字节数。（稍后描述的 POSIX `sigaction()` API 允许在你需要时获得 BSD\
  \ 可重启系统调用的行为。）\n\n#### 10.4.4.1 示例：GNU Coreutils 的 `safe_read()` 和 `safe_write()`\n\
  \nGNU Coreutils 使用两个程序 `safe_read()` 和 `safe_write()` 来处理传统系统上的 `EINTR` 情况。由于同一个文件通过\
  \ `#include` 和宏实现了这两个函数，代码变得稍微复杂了一些。（这样做避免了代码重复，但是以牺牲一定的可读性为代价的。）来自 Coreutils 发行版的\
  \ `lib/safe-read.c`：\n\n```\n 1  /* 一个在中断后重试的读写接口。\n 2     Copyright (C) 1993-1994,\
  \ 1998, 2002-2006, 2009-2023 Free Software\n3     Foundation, Inc.\n15    … 很多模板代码省略\
  \ …\n19  #include <config.h>\n20\n21  /* 规范。 */\n22  #ifdef SAFE_WRITE\n23  #include\
  \ \"safe-write.h\"\n24  #else\n25  #include \"safe-read.h\"\n26  #endif\n27    …\
  \ 更多模板代码省略 …\n42  #ifdef SAFE_WRITE\n43  #define safe_write\n44  #define rw\n45\
  \  #else\n46  #define safe_read\n47  #define rw\n48  #undef const\n49  #define const\
  \ /* 空 */\n50  #endif\n51\n52  /* 从 FD 读取（写入）最多 COUNT 字节，如果中断则重试。\n53     返回实际读取字节数，EOF\
  \ 时返回零，错误时返回\n54     SAFE_READ_ERROR(SAFE_WRITE_ERROR)。*/\n55  size_t\n56  safe_rw\
  \ (int fd, void const *buf, size_t count)\n57  {\n58    for (;;)\n59      {\n60\
  \        ssize_t result = rw (fd, buf, count);\n61\n62        if (0 <= result)\n\
  63          return result;\n64        else if (IS_EINTR (errno))\n65          continue;\n\
  66        else if (errno == EINVAL && SYS_BUFSIZE_MAX < count)\n67          count\
  \ = SYS_BUFSIZE_MAX;\n68        else\n69          return result;\n70      }\n71\
  \  }\n```\n\n第 42-49 行处理定义，根据需要创建 `safe_read()` 或写入函数（见下文 `safe_write.c`）。\n\n第\
  \ 58-70 行是实际循环，只要因 `EINTR` 失败就一直执行。`IS_EINTR()` 宏未显示，但它处理未定义 `EINTR` 的系统。（如果至少有一个系统，代码就不会设置该宏；这可能是为了在非\
  \ 系统上模拟 Unix。）第 66-67 行确保我们请求的字节数不超过系统处理范围；`SYS_BUFSIZE_MAX` 是由 Coreutils 配置过程设置的。\n\
  \n以下是 `safe_write.c`：\n\n```\n 1  /* 在中断后重试的写入接口。\n 2     Copyright (C) 1993-1994,\
  \ 1998, 2002-2006, 2009-2023 Free Software\n3     Foundation, Inc.\n     … 很多模板代码省略\
  \ …\n16\n17  #define SAFE_WRITE\n18  #include \"safe-read.c\"\n```\n\n第 17 行的 `#define`\
  \ 定义了 `SAFE_WRITE`；这对应于 `safe-read.c` 中的第 21-26 和 42-50 行。\n\n#### 10.4.4.2 GLIBC\
  \ 特有：`TEMP_FAILURE_RETRY()`\n\nGLIBC `<unistd.h>` 文件定义了一个宏 `TEMP_FAILURE_RETRY()`，你可以用它封装任何可能失败并将\
  \ `errno` 设置为 `EINTR` 的系统调用。它的“声明”如下：\n\n```c\n#include <unistd.h>             \
  \                            GLIBC\n\nlong int TEMP_FAILURE_RETRY(expression);\n\
  ```\n\n这是该宏的定义：\n\n\n\n\n\n```c\n/* 评估 EXPRESSION，并重复执行直到其返回 -1 且 'errno'\n   被设置为\
  \ EINTR。  */\n\n# define TEMP_FAILURE_RETRY(expression) \\\n  (__extension__   \
  \                                 \\\n    ({ long int __result;                \
  \           \\\n       do __result = (long int) (expression);       \\\n       while\
  \ (__result == -1L && errno == EINTR);   \\\n       __result; }))\n```\n\n该宏使用了\
  \ C 语言的一种 GCC 扩展（由 `__extension__` 关键字标记），该扩展允许在括号内的大括号语句返回返回值，从而作用于一个简单的表达式。\n\n\
  使用此宏，我们可能将 `safe_read()` 重写如下：\n\n```c\nsize_t\nsafe_read(int fd, void const *buf,\
  \ size_t count)\n{\n   ssize_t result;\n\n   result = TEMP_FAILURE_RETRY(read(fd,\
  \ buf, count));\n\n   return (size_t) result;\n}\n```\n\n### 10.4.5 竞态条件与 `sig_atomic_t`\
  \ (ISO C)\n\n到为止，一次处理一个信号看起来非常简单：在 `main()` 中安装一个信号处理器，并（可选地）让信号处理器在执行的第一件事是重新安装自己（或将动作设置为\
  \ `SIG_IGN`）。\n\n然而，如果两个相同的信号连续到来，会发生什么呢？特别是，如果你的系统将信号的操作重置为默认值，而第二个信号在信号处理器被调用之后但在其重新安装之前进入了，该怎么办？\n\
  \n或者，如果你有使用 `bsd_signal()` 的旧代码，导致处理器保持安装状态，但第二个信号与第一个信号不同呢？通常情况下，第一个信号处理器需要在第二个处理器运行之前完成它的工作，而且每个信号处理器都不应该需要临时忽略所有其他可能的信号！\n\
  \n这两种都是竞态条件。解决这些问题的一种方法是让信号处理器尽可能简单。你可以通过创建指示信号发生的标志变量来实现这一点。信号处理器将变量设置为 true 并返回。然后主逻辑在策略性节点检查标志变量：\n\
  \n```c\nbool sig_int_flag = false;       /* 信号处理器设置为 true */\n                 \
  \                bool is not the correct type; see text\nvoid\nint_handler(int signum)\n\
  {\n    sig_int_flag = true;\n}\n\nint\nmain(int argc, char **argv)\n{\n    bsd_signal(SIGINT,\
  \ int_handler);\n    … 程序继续执行 …\n    if (sig_int_flag) {\n        /* 发生了 SIGINT，处理它\
  \ */\n    }\n    … 逻辑其余部分 …\n}\n```\n\n（注意，这种策略缩短了漏洞窗口，但并没有消除它。）\n\n标准 C 引入了一种特殊类型——`sig_atomic_t`——用于此类标志变量。该名称背后的想法是，对这种类型变量的赋值是原子的：也就是说，它们在一个不可分割的操作中完成。例如，在大多数机器上，对\
  \ `int` 值的赋值是原子的，而结构体赋值很可能通过通过（编译器生成的）循环拷贝所有字节来完成，或者通过发布一个可以被中断的“块移动”指令来完成。由于对 `sig_atomic_t`\
  \ 值的赋值是原子的，一旦开始，它就会在另一个信号进入并中断它之前完成。\n\n拥有一个特殊类型只是故事的一部。`sig_atomic_t` 变量还应该声明为\
  \ `volatile`：\n\n```c\nvolatile sig_atomic_t sig_int_flag = 0;  /* 信号处理器设置为 true（非零）\
  \ */\n… 与之前相同的其余代码 …\n```\n\n`volatile` 关键字告诉编译器变量可以从外部更改，可以说是在编译器的背地的情况下修改。这防止了编译器进行可能会影响代码正确性的优化。\n\
  \n完全围绕 `sig_atomic_t` 变量构建应用程序是不可靠的。处理信号的正确方法将在后文中给出，参见第 10.7 节，“进程间通信信号](#ch10.xhtml_ch10lev1sec7)”，“第\
  \ 360 页](#ch10.xhtml_page_360)。\n\n## 10.4.6 其他注意事项\n\nPOSIX 标准为信号处理器提供了若干注意事项：\n\
  \n*   当对于 `SIGBUS`、`SIGFPE`、`SIGILL`、`SIGSEGV` 或任何其他代表“计算异常”的信号处理器返回时，发生的情况是未定义的。\n\
  *   如果处理器是因为调用 `abort()`、`raise()` 或 `kill()` 而被调用的，则该处理器不能调用 `raise()`。（`abort()`\
  \ 描述在第 13.4 节，“自杀：`abort()`](#ch13.xhtml_ch13lev1sec4)，第 434 页](#ch13.xhtml_page_434)，而\
  \ `kill()` 在本章稍后描述）。`sigaction()` API 配合后文描述的三参数信号处理器，可以让我们判断是否属于这种情况。\n*   信号处理器只能调用表\
  \ 10.2 中的函数。特别是，它们应该避免 `<stdio.h>` 函数。问题在于，当 `<stdio.h>` 函数运行时，可能会进入中断，此时库的内部状态正处于更新中间。对\
  \ `<stdio.h>` 函数的进一步调用可能会损坏内部状态。\n\n| `_Exit()` | `lseek()` | `stpcpy()` |\n| :---\
