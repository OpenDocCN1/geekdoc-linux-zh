  \                      npres++) {\n 71          sscanf(buf, \"%s %s %ld %ld\",\n\
  \ 72                  presidents[npres].lastname,\n 73                  presidents[npres].firstname,\n\
  \ 74                  & presidents[npres].emp_id,\n 75                  & presidents[npres].start_date);\n\
