  \ printf(\"%s, mounted on %s:\\n\", fs->mnt_dir, fs->mnt_fsname);\n\n 276\n 277\
  \      printf(\"\\tf_type: %s\\n\", type2str(vfs.f_type));\n 278      printf(\"\\\
  tf_bsize: %ld\\n\", vfs.f_bsize);\n 279      printf(\"\\tf_blocks: %ld\\n\", vfs.f_blocks);\n\
  \ 280      printf(\"\\tf_bfree: %ld\\n\", vfs.f_bfree);\n 281      printf(\"\\tf_bavail:\
  \ %ld\\n\", vfs.f_bavail);\n 282      printf(\"\\tf_files: %ld\\n\", vfs.f_files);\n\
  \ 283      printf(\"\\tf_ffree: %ld\\n\", vfs.f_ffree);\n 284      printf(\"\\tf_namelen:\
  \ %ld\\n\", vfs.f_namelen);\n 285      printf(\"\\tf_frsize: %ld\\n\", vfs.f_frsize);\n\
  \ 286      printf(\"\\tf_flags: %#lx\\n\", vfs.f_flags);\n 287 }\n```\n\n为了节省空间，我们省略了\
  \ `main()`，它与之前介绍的其他程序保持不变；我们还省略了 `process()`，它现在调用的是 `do_statfs()` 而不是 `do_statvfs()`。\n\
  \n第 14–98 行包含了来自 `statfs`(2) 手册页的文件系统魔数列表。虽然这些数字可以从内核源码的头文件中获取，但这种获取方式非常痛苦（我们尝试过），而且在这里展示这种方式更易于理解。第\
  \ 151–255 行定义了 `type2str()`，它将魔数转换为可打印的字符串。它对（值, 字符串）映射表进行简单的线性搜索。如果魔数不在表格中（这种情况不太可能），`type2str()`\
  \ 会创建一个“unknown type”消息并返回（第 253–254 行）。\n\n`do_statfs()`（第 259–286 行）打印 `struct\
  \ statfs` 中的信息。由于 `fsid` 是一个不透明类型，该成员被省略了。代码非常直观；第 276 行使用 `type2str()` 打印文件系统类型。对于使用\
  \ `statvfs()` 的类似程序，该函数忽略非本地文件系统（第 264–265 行）。以下是我们在系统上的输出：\n\n```\n$ ch-mounting-statfs\
  \                        Run the program\n/, mounted on /dev/nvme0n1p3:        \
  \       Results for ext4 filesystem\n    f_type: EXT2_SUPER_MAGIC\n    f_bsize:\
  \ 4096\n    f_blocks: 12224681\n    f_bfree: 6833922\n    f_bavail: 6204828\n  \
  \  f_files: 3129344\n    f_ffree: 2581271\n    f_namelen: 255\n    f_frsize: 4096\n\
  \    f_flags: 0x1020\n...\n/home, mounted on /dev/nvme0n1p4:\n    f_type: EXT2_SUPER_MAGIC\n\
  \    f_bsize: 4096\n    f_blocks: 107118896\n    f_bfree: 56989695\n    f_bavail:\
  \ 51529996\n    f_files: 27279360\n    f_ffree: 26492809\n    f_namelen: 255\n \
  \   f_frsize: 4096\n    f_flags: 0x1020\n/boot/efi, mounted on /dev/nvme0n1p1: \
  \      Results for vfat filesystem\n    f_type: MSDOS_SUPER_MAGIC\n    f_bsize:\
  \ 4096\n    f_blocks: 267776\n```\n\n总之，在你自己的代码中使用 `statvfs()` 还是 `statfs()` 取决于你的需求。如果你有\
  \ `statvfs()`，使用它可以保持代码的可移植性。\n\n\n\n\n\n```\n 1  /* ch-mounting-chdir.c --- demonstrate\
  \ chdir() and fchdir().\n 2                             Error checking omitted for\
  \ brevity */\n 3\n 4  #include <stdio.h>\n 5  #include <fcntl.h>\n 6  #include <unistd.h>\n\
  \ 7  #include <sys/types.h>\n 8  #include <sys/stat.h>\n 9\n10  int\n11  main(void)\n\
  12  {\n13     int fd;\n14     struct stat sbuf;\n15\n16     fd = open(\".\", O_RDONLY);\
  \   /* open directory for reading */\n17     fstat(fd, & sbuf);          /* obtain\
  \ info, need original permissions */\n18     int junk = chdir(\"..\");     /* 'cd\
  \ ..' */\n19     fchmod(fd, 0);              /* zap permissions on original directory\
  \ */\n20\n21     if (fchdir(fd) < 0)         /* try to 'cd' back, should fail */\n\
  22         perror(\"fchdir back\");\n23\n24     fchmod(fd, sbuf.st_mode & 07777);\
  \   /* restore original permissions */\n25     close(fd);          /* all done */\n\
  26\n27     return 0;\n28  }\n```\n```\n\n第 16 行打开当前目录。第 17 行对打开的目录调用 `fstat()`，以便我们获得其权限的副本。第\
  \ 18 行使用 `chdir()` 在文件层次结构中向上移动。（如果不将第 18 行的结果赋值给 `junk` 变量，编译器将产生一个关于结果未使用的警告。我们在书中任何有需要的地方都会使用这种技术。）第\
  \ 19 行执行了“脏活儿”，关闭了原始目录的所有权限。\n\n第 21–22 行尝试返回原始目录。这在预期中是失败的，因为当前权限不允许这样做。第 24 行恢复了原始权限。`sbuf.st_mode\
  \ & 07777` 获取低位 12 位权限位；这些是普通的 9 位 `rwxrwxrwx` 位，以及 setuid、setgid 和“粘滞”位，我们将在第 11\
  \ 章“权限、用户和组 ID 编号”以及第 383 页中讨论这些内容。最后，第 25 行通过关闭打开的文件描述符来清理。以下是程序运行时时的发生的情况：\n\n\
  ```\n$ ls -ld .                                                   显示当前权限\ndrwxrwxr-x\
  \ 4 arnold arnold 4096 Jan 17 21:24 .\n$ ch-mounting-chdir\nfchdir back: Permission\
  \ denied                               如预期失败\n$ ls -ld .                       \
  \                            再次查看权限\ndrwxrwxr-x 4 arnold arnold 4096 Jan 17 21:24\
  \ .               一切都恢复了原状\n```\n\n### 8.4.2 获取当前目录：`getcwd()`\n\n名之其实宜的 `getcwd()`\
  \ 函数获取当前工作目录的绝对路径名：\n\n```\n#include <unistd.h>                                \
  \     POSIX\n\nchar *getcwd(char *buf, size_t size);\n```\n\n该函数用路径名填充 `buf` ；它期望\
  \ `buf` 拥有 `size` 字节。成功时，它返回第一个参数。否则，如果它需要超过 `size` 字节，它返回 `NULL` 并将 `errno` 设置为\
  \ `ERANGE`。其目的是如果发生了 `ERANGE`，你应该尝试分配更大的缓冲区（使用 `malloc()` 或 `realloc()`）并重试。\n\n\
  Chet Ramey 指出，更好的替代方案是使用 `pathconf(\".\", _PC_PATH_MAX)` 来获取 `getcwd()` 的缓冲区大小。更多信息请参见第\
  \ 12.2.3 节“文件系统限制：`pathconf()` 和 `fpathconf()` 第 409 页。\n\n如果指向当前目录的任何目录组件不可读或不可搜索，则\
  \ `getcwd()` 可能会失败，`errno` 将为 `EACCES`。下面的简单程序演示了它的用法：\n\n```\n/* ch-mounting-getcwd.c\
  \ --- demonstrate getcwd().\n                            Error checking omitted\
  \ for brevity */\n\n#include <stdio.h>\n#include <fcntl.h>\n#include <limits.h>\n\
  #include <unistd.h>\n#include <sys/types.h>\n#include <sys/stat.h>\n\nint\nmain(void)\n\
  {\n    char buf[PATH_MAX];\n    char *cp;\n\n    cp = getcwd(buf, sizeof(buf));\n\
  \    printf(\"Current dir: %s\\n\", buf);\n\n    printf(\"Changing to ..\\n\");\n\
  \    int junk = chdir(\"..\");         /* 'cd ..' */\n\n    cp = getcwd(buf, sizeof(buf));\n\
  \    printf(\"Current dir is now: %s\\n\", buf);\n\n    return 0;\n}\n```\n\n这个简单的程序打印当前目录，切换到父目录，然后打印新的当前目录。（`cp`\
  \ 在这里并不真正需要，但在实际程序中它会被用于错误检查。）运行时，它会产生以下输出：\n\n```\n$ ch-mounting-getcwd\nCurrent\
  \ dir: /home/arnold/work/prenhall/progex1-2e/code/ch-08-mounting\nChanging to ..\n\
  Current dir is now: /home/arnold/work/prenhall/progex1-2e/code\n```\n\n形式上，如果 `buf`\
  \ 参数为 `NULL`，`getcwd()` 的行为是未定义的。在这种情况下，GLIBC 版本的 `getcwd()` 将为你调用 `malloc()`，分配一个大小为\
  \ `size` 的缓冲区。为了进一步提供帮助，如果 `size` 为 `0`，那么它分配的缓冲区将“足够大”以容纳返回的路径名。无论何种情况，在使用缓冲区后应该对返回的指针调用\
  \ `free()`。\n\nGLIBC 的行为很有帮助，但它不是可移植的。对于必须跨平台运行的代码，你可以编写一个替换函数，提供相同的功能，并在 GLIBC\
  \ 系统上让你的替换函数直接调用 `getcwd()`。\n\nGNU/Linux 系统提供了文件 `/proc/self/cwd`。该文件是当前目录的符号链接：\n\
  \n```\n$ cd /tmp                           切换到目录\n$ ls -l /proc/self/cwd       \
  \       查看该文件\nlrwxrwxrwx 1 arnold arnold 0 Jan 17 21:31 /proc/self/cwd -> /tmp\n\
  $ cd                               切换到家目录\n$ ls -l /proc/self/cwd              再次查看\n\
  lrwxrwxrwx 1 arnold arnold 0 Jan 17 21:31 /proc/self/cwd -> /home/arnold\n```\n\n\
  这在 Shell 层面很方便，但在编程层面存在问题。特别是，该文件的大小为零！（这是因为它是 `/proc` 中的文件，由内核模拟；不是真实文件。）\n\n为什么零大小是个问题？如果你还记得第\
  \ 5.4.5 节“处理符号链接, 第 141 页，`lstat()` 在符号链接上返回的是链接名称的字符数，存储在 `struct stat` 的 `st_size`\
  \ 字段中。这个数字随后可以用于 `readlink()` 分配相应大小的缓冲区。这在这里行不通，因为大小为零。你必须使用（或分配）一个你认为足够的缓冲区。然而，由于\
  \ `readlink()` 不会填充超过你提供的字符，你无法判断缓冲区是否足够；`readlink()` 在空间不足时不会失败。（请参见第 5.4.5 节中的\
  \ Coreutils `xreadlink()` 函数，它解决了这个问题。）\n\n除了 `getcwd()`，GLIBC 还有几个其他非移植的例程（注：此处原文为\
  \ routines）。\n\n### 8.4.3 处理文件层次结构：`fts_open()` 及其朋友\n\n（注：此处原文为 nonportable，译为非移植的）\n\
  \n这些例程为你节省了管理缓冲器的麻烦，并提供了与旧版 BSD 系统的兼容性。详情请参见 `getcwd`(3)。\n\n一种常见的编程任务是处理整个文件层次结构，对整个树中的每个文件、每个目录和子目录执行某些操作。例如，`du`\
  \ 打印磁盘使用信息；`chown -R` 递归更改所有者；或者 `find` 程序查找符合特定条件的文件。\n\n\n\n\n此时，你已经掌握了足够的知识来编写代码，手动打开并读取目录，对每个条目调用\
  \ `stat()`（或 `lstat()`），并递归地处理子目录。然而，编写出正确的代码是有挑战性的：如果你在处理子目录时留着父目录打开状态，可能会导致文件描述符耗尽；你必须决定是将符号链接视为其本身，还是将其视为它们所指向的文件；你还必须能够处理那些不可读或不可搜索的目录；等等。如果你在多个应用程序中都需要这段代码，那么反复重复地编写相同的代码也是非常痛苦的。\n\
  \n### 8.4.3.1 `nftw()` 接口\n\n为了消除这些问题，System V 引入了 `ftw()`（“文件树遍历”）函数。`ftw()` 完成了“遍历”文件树（层级结构）的所有工作。你向它提供一个函数指针，它会在遇到每个文件对象时调用该函数。你的函数就可以根据自己的喜意处理每个文件系统对象了。\n\
  \n随着时间的推移，人们发现 `ftw()` 接口并没有完全胜任工作；例如，它最初不支持符号链接。出于这个原因，X/Open 可移植性指南中加入了 `nftw()`（“新的\
  \ `nftw()`” [sic]）；它现在是 POSIX 的一部分。其原型如下：\n\n在过去，POSIX 标准化了 `ftw()` 接口以支持现有代码，但现在不再这样做了。GNU/Linux\
  \ 和商业 Unix 系统继续提供它。然而，由于它的功能有限，我们不再讨论它。如果你感兴趣，请参见 `ftw(3)`。\n\n```\n#include <ftw.h>\
  \                                                   POSIX XSI\n\nint nftw(const\
  \ char *dir,                            起始点\n         int (*fn)(const char *file,\
  \                 指向函数\n                   const struct stat *sb,            四个参数的函数指针\n\
  \                   int flag, struct FTW *s),\n         int nopenfd, int flags);\
  \                    最大打开的 fd 数，标志\n```\n\n以下是各个参数：\n\n*   `const char *dir`\n \
  \   命名要处理的层级结构起始点的字符串。\n*   `int (*fn)(const char *file, const struct stat *sb,\
  \ int flag, struct FTW *s)`\n    指向具有给定参数的函数指针。该函数会在层级结构中的每个对象处被调用。\n*   `int nopenfd`\n\
  \    为了避免文件描述符耗尽，`nftw()` 同时打开的目录不会超过 `nopenfd`。这**并不能**防止 `nftw()` 处理深度超过 `nopenfd`\
  \ 层的层级结构，但较小的 `nopenfd` 值意味着 `nftw()` 必须做更多工作。\n*   `flags`\n    一组通过位或操作组合的标志，用于指导\
  \ `nftw()` 如何处理该层级结构。\n\nGNU Coreutils 的维护者 Jim Meyering 指出，由于递归性质，`nftw()` 的设计并不完美。（它在处理子目录时会递归地调用自己。）如果目录层级变得非常深（在\
  \ 20,000 到 40,000 层范围内！），`nftw()` 可能会耗尽栈空间，导致程序崩溃。还有其他与 `nftw()` 设计相关的问题。因此，5.0\
  \ 之后的 GNU Coreutils 版本切换到了 `fts()` 变例函数，我们即将深入研究。由于这个原因，我们在这本书中不再介绍 `nftw()`。（不过，如果你想查看如何使用它，可以在书的代码仓库中找到\
  \ `ch-mounting-nftw.c`。）\n\n### 8.4.3.2 处理文件树流\n\n我们现在不再讨论 `nftw()`，而是描述一组在“流”中处理文件和目录的变例。也就是说，用户代码运行一个\
  \ `while` 循环，一次地获取并处理文件对象，从而避免了递归中固有的问题。`fts()` 变例随 4.4 BSD 引入。它广泛可用，但令人惊讶的是它并没有被\
  \ POSIX 标准化：\n\n```\n#include <sys/types.h>                                通用\n\
  #include <sys/stat.h>\n#include <fts.h>\n\nFTS *fts_open(char *const *path_argv,\
  \ int options,\n              int (*compar)(const FTSENT **, const FTSENT **));\n\
  FTSENT *fts_read(FTS *ftsp);\nFTSENT *fts_children(FTS *ftsp, int instr);\nint fts_set(FTS\
  \ *ftsp, FTSENT *f, int instr);\nint fts_close(FTS *ftsp);\n```\n\n该设计类似于 `opendir()`\
  \ 变例。你通过 `fts_open()` “打开”一个文件对象流，并通过 `fts_read()` 一次读取一个对象。完成后，你通过 `fts_close()`\
  \ 关闭它。`fts_read()` 在遍历期间可能会更改目录，这是一个可以禁用的性能优化。\n\n打开一个文件流。这种设计与 `opendir()` 变例的设计相似。这套变例功能强大但很复杂。因此我们将一个一个地通过它。第一个是\
  \ `fts_open()`：\n\n```\nFTS *fts_open(char *const *path_argv, int options,\n   \
  \           int (*compar)(const FTSENT **, const FTSENT **))\n```\n\n参数如下：\n\n*\
  \   `path_argv`\n    `argv` 风格的指针数组。每个字符串是一个需要遍历的目录。\n*   `options`\n    位或组合的标志位，告诉\
  \ `fts_read()` 如何处理层级结构。稍后描述这些标志。\n*   `int (*compar)(const FTSENT **, const FTSENT\
  \ **)`\n    指向一个函数的指针，用于排序遍历。例如，你可能希望按字母顺序、文件年龄、文件大小或其他任何标准进行排序。手册页写道如果 `compar()`\
  \ 参数为 `NULL`，目录遍历顺序遵循 `path_argv` 中的顺序，对于其他部分则按其顺序进行。”\n\n这里是用于 `options` 参数的可能标志位。你**必须**提供\
  \ `FTS_LOGICAL` 或 `FTS_PHYSICAL` 之一：\n\n*   `FTS_FOLLOW`\n    如果 `path_argv` 中的任何目录是符号链接，则跟随该链接。即使用链接的目标。即使没有提供\
  \ `FTS_LOGICAL` 也会这样做。\n*   `FTS_LOGICAL`\n    返回符号链接的目标，而不是链接本身。此选项与 `FTS_PHYSICAL`\
  \ 互斥。\n*   `FTS_NOCHDIR`\n    在遍历期间不要更改目录。通常，`fts_read()` 在遍历期间更改目录，这提高了性能。此选项禁用了这种行为。\n\
  *   `FTS_NOSTAT`\n    不要为当前文件获取 `stat()` 信息。如果你不需要这些信息，这可以提高性能。\n*   `FTS_PHYSICAL`\n\
  \    返回符号链接的信息，而不是它们所指向的文件。这很可能是对你最有用的选项。此选项与 `FTS_LOGICAL` 互斥。\n*   `FTS_SEEDOT`\n\
  \    返回目录中 `.` 和 `..` 项的信息。通常，这些项会被跳过。\n*   `FTS_XDEV`\n    不要跨越文件系统边界。即如果遇到不同的挂载文件系统，不要进入。\n\
  \n下一个函数也是你最可能使用的函数，是 `fts_read()`：\n\n*   `FTSENT *fts_read(FTS *ftsp)`\n    返回一个指向\
  \ `FTSENT` 结构体的指针，描述 `ftsp` 所描述层级结构中的下一个文件。\n\n`FTSENT` 结构体如下：\n\n\n\n\n\n```c\n\
  typedef struct _ftsent {\n   unsigned short  fts_info;     /* FTSENT 结构的标志 */\n\
  \   char           *fts_accpath;  /* 访问路径 */\n   char           *fts_path;     /*\
  \ 根路径 */\n   short           fts_pathlen;  /* strlen(fts_path) +\n             \
  \                       strlen(fts_name) */\n   char           *fts_name;     /*文件名\
  \ */\n   short           fts_namelen;  /* strlen(fts_name) */\n   short        \
  \   fts_level;    /* 深度 (-1 到 N) */\n   int             fts_errno;    /* 文件 errno\
  \ */\n   long            fts_number;   /* 本地数值 */\n   void           *fts_pointer;\
  \  /* 本地地址值 */\n   struct _ftsent *fts_parent;   /* 父目录 */\n   struct _ftsent *fts_link;\
  \     /* 下一个文件结构 */\n   struct _ftsent *fts_cycle;    /* 循环结构 */\n   struct stat\
  \    *fts_statp;    /* stat(2) 信息 */\n} FTSENT;\n```\n\n可能还有其他供私私使用的字段。这些字段及其用途如下：\n\
  \n* `unsigned short fts_info`\n    描述文件类型和其他信息的标志。请参见 表 8.3。\n\n* `char *fts_accpath`\n\
  \    相对于当前目录的文件路径。\n\n* `char *fts_path`\n    相对于遍历根目录的文件路径，即 `path_argv` 中对应的字符串。\n\
  \n* `short fts_pathlen`\n    man 页面说明为 `/* strlen(fts_path) + strlen(fts_name) */`，但它实际上似乎是\
  \ `fts_path` 的长度，其中包含了文件名。\n\n* `char *fts_name`\n    文件名。\n\n* `short fts_namelen`\n\
  \    `fts_name` 的长度。\n\n* `short fts_level`\n    当前项的遍历深度。遍历的根是 `path_argv` 中的任何目录；根的级别为\
  \ 0。根的父级级别为 –1。0 之上的级别是根目录的后代。\n\n* `int fts_errno`\n    如果在获取此文件信息时发生错误，`errno`\
  \ 的值。\n\n* `long fts_number`\n* `void *fts_pointer`\n    这两个字段供应用程序使用。它们分别被初始化为\
  \ 0 和 `NULL`。\n\n* `struct _ftsent *fts_parent`\n    指向包含该文件的父目录的 `FTSENT` 结构的指针。\n\
  \n* `struct _ftsent *fts_link`\n    指向 `fts_children()` 返回的链表中下一个 `FTSENT` 结构的指针（见后文）。该列表以\
  \ `NULL` 结束。\n\n* `struct _ftsent *fts_cycle`\n    如果树结构中存在循环，此字段指向层次结构中引用此文件的另一个\
  \ `FTSENT` 结构。循环通常不会发生；请参见 man 页面了解可能发生循环的情况。\n\n* `struct stat *fts_statp`\n  \
  \  指向描述此文件的 `struct stat` 的指针。\n\n表 8.3 描述了 `fts_info` 字段的可能值。\n\n| `FTS_D` | 正在以先序访问的目录。\
  \ |\n| `FTS_DC` | 导致循环的目录。 |\n| `FTS_DEFAULT` | 对于未由表中其他值描述的文件类型的 `FTSENT` 结构。 |\n\
  | `FTS_DNR` | 不可读的目录。`fts_errno` 将描述错误。 |\n| `FTS_DOT` | 未包含在 `path_argv` 中的名为 `.`\
  \ 或 `..` 的文件。只有在向 `fts_open()` 提供了 `FTS_SEEDOT` 时才会显示。 |\n| `FTS_DP` | 正在以后序访问的目录。`FTSENT`\
  \ 结构中的所有其他信息将与先序访问期间完全相同。 |\n| `FTS_ERR` | 发生错误。`fts_errno` 将描述错误。 |\n| `FTS_F`\
  \ | 普通文件。 |\n| `FTS_NS` | 无法获取 `stat()` 信息的文件。`fts_errno` 将描述错误。 |\n| `FTS_NSOK`\
  \ | 未请求 `stat()` 信息的文件。这可能发生在使用 `fts_children()` 时。 |\n| `FTS_SL` | 符号链接。 |\n| `FTS_SLNONE`\
  \ | 指向不存在目标的符号链接。在这种情况下，`fts_statp` 字段指向的 `struct stat` 描述符号链接本身。 |\n\n**表 8.3:**\
  \ `fts_info` 字段的可能值\n\n对 `FTS_D` 和 `FTS_DP` 值的描述需要一些解释。在遍历目录树时，`fts_read()` 会访问目录两次：一次是在沿树向下移动时，另是在访问完目录的所有子项并返回时。第一次在计算机科学中被称为*先序*（preorder）访问（因此为\
  \ `FTS_D`），第二次被称为*后序*（postorder）访问（`FTS_DP`）。\n\n下一个函数是 `fts_children()`：\n\n* `FTSENT\
  \ *fts_children(FTS *sp, int instr)`\n    创建由 `fts_read()` 返回的目录的的 `FTSENT` 结构链表。列表以\
  \ `NULL` 结束。列表包含 `path_argv` 中的特殊情况。\n\n* `int fts_set(FTS *sp, FTSENT *f, int instr)`\n\
  \    指定对 `f` 指向文件的进一步处理。`instr` 参数可以是以下之一：\n\n    * `0`\n        什么都不做。\n\n    *\
  \ `FTS_AGAIN`\n        再次访问该文件。`fts_read()` 的下一次调用将基于目录的后序访问。\n\n    * `FTS_FOLLOW`\n\
  \        仅当引用的文件是符号链接时使用。它会更新 `fts_info` 和 `fts_stat` 字段。如果链接的目标不存在，`fts_info` 字段将设置为\
  \ `FTS_SLNONE`。\n\n    * `FTS_SKIP`\n        不访问此文件的任何子项。该文件可能是 `fts_read()` 或 `fts_children()`\
  \ 返回的。\n\n最后一个函数是最简单的：\n\n* `int fts_close(FTS *sp)`\n    关闭 `sp` 指向的流，并将目录恢复到 `fts_read()`\
  \ 开始时的目录。成功后返回 0，失败返回 -1。\n\n让我们通过一个示例将这一切联系起来。`ch-mounting.c` 处理命令行上指定的文件和目录，对它们运行\
  \ `fts_read()`。处理每个文件的函数打印带有缩进的文件和类型，显示文件的层次结构。为了方便，我们先显示结果，然后展示并讨论程序：\n\n```\n\
  $ pwd                                           我们在哪里\n/home/arnold/work/prenhall/progex1-2e\n\
  $ code/ch-08-mounting/ch-mounting-fts code      遍历 code 目录\ncode (directory preorder\
  \ visit)                 目录\n    fts_accpath: code\n    fts_path: code\n    fts_pathlen:\
  \ 4\n    fts_namelen: 4\n    … 输出输出 …\n    ch-06-general1 (directory preorder visit)\
  \   一级缩进的子目录\n        fts_accpath: ch-06-general1\n        fts_path: code/ch-06-general1\n\
  \        fts_pathlen: 19\n        fts_namelen: 14\n        ch-general1-sortemp.c\
  \ (file)            二级缩进的文件\n            fts_accpath: ch-general1-sortemp.c\n  \
  \          fts_path: code/ch-06-general1/ch-general1-sortemp.c\n            fts_pathlen:\
  \ 41\n            fts_namelen: 21\n…\ncode (directory postorder visit)\n    fts_accpath:\
  \ code\n    fts_path: code\n    fts_pathlen: 4\n    fts_namelen: 4\n```\n\n这里是程序本身：\n\
  \n\n\n\n\n```c\n 1  /* ch-mounting-fts.c --- demonstrate fts() */\n 2\n 3  #include\
  \ <stdio.h>\n 4  #include <errno.h>\n 5  #include <getopt.h>\n 6  #include <fts.h>\
  \    /* gets <sys/types.h> and <sys/stat.h> for us */\n 7  #include <limits.h> \
  \    /* for PATH_MAX */\n 8  #include <stdbool.h>\n 9  #include <stdlib.h>\n10 \
  \ #include <string.h>\n11  #include <unistd.h> /* for getcwd() */\n12\n13  extern\
  \ bool process_ent(FTSENT *fent);\n14\n15  /* usage --- print message and die */\n\
  16\n17  void\n18  usage(const char *name)\n19  {\n20      fprintf(stderr, \"usage:\
  \ %s [-CLcdsx] directory ...\\n\", name);\n21      exit(1);\n22  }\n23\n24  /* main\
  \ --- run fts_*() on each command-line argument */\n25\n26  int\n27  main(int argc,\
  \ char **argv)\n28  {\n29      int i, c;\n30      int errors = 0;\n31      int flags\
  \ = FTS_PHYSICAL;\n32      char start[PATH_MAX], finish[PATH_MAX];\n33\n34     \
  \ while ((c = getopt(argc, argv, \"CLcdsx\")) != -1) {\n35          switch (c) {\n\
  36          case 'C':\n37              flags |= FTS_COMFOLLOW;\n38             \
  \ break;\n39          case 'L':\n40              flags &= ~FTS_PHYSICAL;\n41   \
  \           flags |= FTS_LOGICAL;\n42              break;\n43          case 'c':\n\
  44              flags |= FTS_NOCHDIR;\n45              break;\n46          case\
  \ 'd':\n47              flags |= FTS_SEEDOT;\n48              break;\n49       \
  \   case 's':\n50              flags |= FTS_NOSTAT;\n51              break;\n52\
  \          case 'x':\n53              flags |= FTS_XDEV;\n54              break;\n\
  55          default:\n56              usage(argv[0]);\n57              break;\n\
  58          }\n59      }\n60\n61      if (optind == argc)\n62          usage(argv[0]);\n\
  63\n64      char *junk = getcwd(start, sizeof start);\n65\n66      FTS *fstream;\n\
  67      FTSENT *fent;\n68\n69      if ((fstream = fts_open(argv + optind, flags,\
  \ NULL)) == NULL) {\n70          fprintf(stderr, \"%s: from %s: cannot fts_open:\
  \ %s\\n\",\n71                  argv[0], argv[optind], strerror(errno));\n72   \
  \       exit(1);\n73      }\n74\n75      while ((fent = fts_read(fstream)) != NULL)\
  \ {\n76          if (! process_ent(fent)) {\n77              fprintf(stderr, \"\
  error occurred, bailing out\\n\");\n78              fts_close(fstream);\n79    \
  \          exit(1);\n80          }\n81      }\n82\n83      fts_close(fstream);\n\
  84\n85      junk = getcwd(finish, sizeof finish);\n86      printf(\"Starting dir:\
  \ %s\\n\", start);\n87      printf(\"Finishing dir: %s\\n\", finish);\n88\n89  \
  \    exit(0);\n90  }\n```\n\n第 3–11 行包含了头文件。第 31 行将默认行为设置为 `FTS_PHYSICAL`。第 35–59\
  \ 行处理选项。选项 `FTS_PHYSICAL` 和 `FTS_LOGICAL` 是互斥的，因此我们确保只设置其中一个。\n\n第 64 行使用 `getcwd()`\
  \ 保存起始目录以供以后使用。\n\n第 69–73 行在剩余的命令行参数上打开流。如果失败，我们将带有错误信息退出。\n\n第 75–81 行使用简单的 `while`\
  \ 循环处理文件。如果发生错误，我们将关闭流（第 78 行）并退出。\n\n最后，在处理结束时将到达第 85–87 行。程序关闭流，打印起始和结束目录（它们应该是相同的），并成功退出。\n\
  \n我们真正感兴趣的函数是 `process_ent()`，它处理每个文件。它使用了处理 `FTSENT` 结构的基本模板，即对 `fts_info` 值使用\
  \ `switch` 语句。`print_entry()` 函数是一个辅助例程，用于打印与所有文件相关的信息：\n\n```c\n 92  /* print_entry\
  \ --- print the rest of the FTSENT */\n 93\n 94  void\n 95  print_entry(FTSENT *fent,\
  \ int level)\n 96  {\n 97      printf(\"%*sfts_accpath: %s\\n\", level, \"\", fent->fts_accpath);\n\
  \ 98      printf(\"%*sfts_path: %s\\n\", level, \"\", fent->fts_path);\n 99    \
  \  printf(\"%*sfts_pathlen: %d\\n\", level, \"\", fent->fts_pathlen);\n100     \
  \ printf(\"%*sfts_namelen: %d\\n\", level, \"\", fent->fts_namelen);\n101      if\
  \ (fent->fts_errno != 0)\n102          printf(\"%*sfts_path: %s\\n\", level, \"\"\
  , strerror(fent->fts_errno));\n103\n104  }\n105\n106  /* process_ent --- print out\
  \ each file at the right level */\n107\n108  bool\n109  process_ent(FTSENT *fent)\n\
  110  {\n111      bool retval = true;\n112      const char *name = fent->fts_name;\n\
  113      int level = fent->fts_level <= 0 ? 0 : fent->fts_level;\n114      printf(\"\
  %*s\", level * 4, \"\");  /* indent over */\n115      switch (fent->fts_info) {\n\
  116      case FTS_F:\n117          printf(\"%s (file)\\n\", name);\n118        \
  \  break;\n119      case FTS_D:\n120          printf(\"%s (preorder visit)\\n\"\
  , name);\n121          break;\n122      case FTS_DC:\n123          printf(\"%s (cycle)\\\
  n\", name);\n124          break;\n125      case FTS_DP:\n126          printf(\"\
  %s (postorder visit)\\n\", name);\n127          break;\n128      case FTS_DNR:\n\
  129          printf(\"%s (unreadable directory)\\n\", name);\n130          break;\n\
  131      case FTS_DOT:\n132          printf(\"%s (dot or dot)\\n\", name);\n133\
  \          break;\n134      case FTS_ERR:\n135          printf(\"%s (error: %s)\\\
  n\", name, strerror(fent->fts_errno));\n136          retval = false;\n137      \
  \    break;\n138      case FTS_SL:\n139          printf(\"%s (symbolic link)\\n\"\
  , name);\n140          break;\n141      case FTS_SLNONE:\n142          printf(\"\
  %s (symbolic link, no target)\\n\", name);\n143          break;\n144      case FTS_NS:\n\
  145          printf(\"%s (stat failed: %s)\\n\", name, strerror(errno));\n146  \
  \        retval = false;\n147          break;\n148      case FTS_NSOK:\n149    \
  \      printf(\"%s (stat not requested): %s\\n\", name, strerror(errno));\n150 \
  \         break;\n151      case FTS_DEFAULT:\n152          printf(\"%s (default)\
  \ [?]\\n\", name);\n153          retval = false;\n154          break;\n155     \
  \ default:\n156          printf(\"%s: unknown fts_info %d: can't happen!\\n\", name,\
  \ fent->fts_info);\n157          retval = false;\n158          break;\n159     \
  \ }\n160      if (retval)\n161          print_entry(fent, (level + 1) * 4);\n162\n\
  163      return retval;\n164  }\n```\n\n第 115 行使用一种巧妙的技巧缩进了正确的空格。使用 `%*s`，`printf()`\
  \ 从第一个参数获取字段宽度。该宽度动态计算为 `level * 4`，其中 `level` 源自 `fent->fts_level`。要打印的字符串是 `\"\
  \"`，空字符串）。结果是 `printf()` 为我们生成了正确的空间，而不需要我们运行循环。同样的技巧再次出现在第 164 行。\n\n第 117–162\
  \ 行是 `switch` 语句。在这种情况下，它除了打印文件名和类型（文件、目录等）之外没有做其他事情。第 163–164 行在没有错误的情况下打印其余信息。\n\
  \n虽然这个程序没有使用 `struct stat`，但显而看出，在处理 `FTSENT` 结构时，你可以执行任何你需要的操作。\n\n### 8.5 处理文件层次：GNU\
  \ `du`\n\nGNU Coreutils 中的 `du` 版本使用 `fts()` 套件来遍历一个或多个文件层次，收集并产生有关磁盘空间使用量的统计数据。它有很多选项，可以控制其关于符号链接、数字格式等的行为。这使得代码比简单的版本更难理解（然而，我们不会因此停止脚步）。以下是\
  \ `du` 选项的摘要，稍后查看代码时会很有帮助：\n\n\n\n\n\n```\n$ du --help\n用法: du [OPTION]... [FILE]...\n\
  \  或:  du [OPTION]... --files0-from=F\n汇总一组 FILE 的磁盘占用情况，对目录进行递归。\n\n长选项的强制参数对短选项也是强制的。\n\
  \  -0, --null            以 NUL 结束每行输出，而不是换行符\n  -a, --all             写入所有文件的计数，而不仅仅是目录\n\
  \      --apparent-size   打印显示大小，而不是磁盘占用；虽然\n                          显示大小通常较小，但由于（“稀疏”）文件的\n\
  \                          空洞、内部碎片、间接块等原因，\n                          可能更大\n  -B,\
  \ --block-size=SIZE  在打印之前按 SIZE 缩放大小；例如，\n                           '-BM' 以 1,048,576\
  \ 字节为单位打印大小；\n                           参见下文 SIZE 格式\n  -b, --bytes           等同于\
  \ '--apparent-size --block-size=1'\n  -c, --total           生成总计\n  -D, --dereference-args\
  \  仅对命令行中列出的符号链接进行解引用\n  -d, --max-depth=N     当目录（或文件，配合 --all）位于命令行参数\n      \
  \                    下方 N 层或更少层时打印总计；--max-depth=0 等于\n                        \
  \  --summarize\n      --files0-from=F   汇总文件 F 中指定的 NUL 终止的文件名的\n              \
  \            磁盘占用；如果 F 是 -，则从标准输入读取名称\n  -H                    等同于 --dereference-args\
  \ (-D)\n  -h, --human-readable  以人类可读格式打印大小（例如 1K 234M 2G）\n      --inodes     \
  \     列出 inode 使用信息而不是块使用情况\n  -k                    类似 --block-size=1K\n  -L, --dereference\
  \     解引用所有符号链接\n  -l, --count-links     如果是硬链接，则多次计算大小\n  -m                  \
  \  类似 --block-size=1M\n  -P, --no-dereference  不跟随任何符号链接（这是默认值）\n  -S, --separate-dirs\
  \   对于目录不包含子目录的大小\n      --si              类似 -h，但使用 1000 的幂而不是 1024\n  -s, --summarize\
  \       仅显示每个参数的总计\n  -t, --threshold=SIZE  如果是正数，则排除小于 SIZE 的条目，\n            \
  \              如果是负数则排除大于 SIZE 的条目\n      --time            显示目录或其子目录下任何文件的最后修改时间\n\
  \      --time=WORD       用 WORD 显示时间 own 修改时间：\n                          atime,\
  \ access, use, ctime 或 status\n      --time-style=STYLE  使用 STYLE 显示时间，STYLE 可以：\n\
  \                            full-iso, long-iso, iso, 或 +FORMAT；\n             \
