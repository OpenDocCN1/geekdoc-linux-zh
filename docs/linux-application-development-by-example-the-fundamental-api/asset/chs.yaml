  \ 176–186 行根据文件类型、当前级别、`--max-depth` 选项设置以及 `--threshold` 选项设置来决定是否打印信息。\n\n呼！这代码真多啊。我们认为这处于复杂度谱的顶端，至少对于这类书籍能够轻松展示的内容而言。然而，它证明了现实世界的代码往往是复杂的。管理这种复杂性的最佳方法是使用清晰命名的变量和详细注释。`du.c`\
  \ 在这方面做得；我们能够很容易地提取并检查代码，而无需显示程序的全部 735 行内容！\n\n## 8.6 更改根目录：`chroot()`\n\n当前工作目录通过\
  \ `chdir()` 或 `fchdir()` 设置（参见第 8.4.1 节，“更改目录：`chdir()` 和 `fchdir()``，“第 247 页](#ch08.xhtml_page_247)”），它是进程的一个属性，就像打开的文件集一样。它也会被新进程继承。\n\
  \n较为人知的是，每个进程也有一个当前根目录。路径名 `/` 指向的就是这个目录。大多数情况下，进程的根目录和系统根目录是相同的。然而，超级用户可以使用（你猜到的）`chroot()`\
  \ 系统调用来更改根目录：\n\n```c\n#include <unistd.h>                                     \
  \   Common\n\nint chroot(const char *path);\n```\n\n成功时返回值为 `0`，错误时返回 `–1`。\n\n\
  正如 GNU/Linux `chroot`(2) 手册页所出的，更改根目录不会改变当前目录；必须确保自己留在新根目录之下的程序必须在之后还要执行 `chdir()`：\n\
  \n```c\nif (chroot(\"/new/root\") < 0)                设置新的根目录\n    /* 处理错误 */\n\n\
  if (chdir(\"/some/dir\") < 0)                 路径名现在相对于新根目录\n    /* 处理错误 */\n```\n\
  \n`chroot()` 系统调用最用于守护进程——即必须在特殊隔离环境中运行的后台程序。例如，考虑一个允许匿名 FTP 的 Internet FTP 守护进程（任何人从任何地方都可以连接，无需常规用户名和密码）。显然，这种连接不应该能够看到整个系统上的所有文件。相反，FTP\
  \ 守护进程会 `chroot()` 到特定的目录，该目录包含仅足够使其运行的结构（例如，用于列出文件的自己的 `/bin/ls`，如果是共享的则自己的 C 运行时库副本，可能还有自己的\
  \ `/etc/passwd` 和 `/etc/group` 副本以显示有限的用户名和组名）。\n\nPOSIX 没有标准化这个系统调用，尽管 GNU/Linux\
  \ 和所有 Unix 系统都支持它。（它从 V7 开始就存在了）。它是专门的，但当你需要它时，它非常有用。\n\n## 8.7 总结\n\n- 文件系统是空闲块、inode、元数据和数据块的集合，以特定的方式组织。文件系统与其所属的（物理或逻辑）分区一一一对应。每个文件系统都有自己的根目录；按照惯例，根目录的\
  \ inode 编号始终为 `2`。\n\n- `mount` 命令挂载文件系统，将其嫁接到逻辑分级文件命名空间中。`umount` 命令卸载文件系统。内核安排\
  \ `/.` 和 `/..` 相同；整个命名空间的根目录是它自己的父目录。在所有其他情况下，内核安排让挂载文件系统根目录下的 `..` 指向挂载点的父目录。\n\
  \n- 现代 Unix 系统支持多种类型的文件系统。特别是 Oracle（最初源自 Sun Microsystems）的网络文件系统 (NFS) 被通用的支持，DVD\
  \ 和 CD-ROM 的 ISO 9660 标准也是如此，MS-DOS FAT 分区在所有运行 x86 的 Unix 系统上都受支持。据我们所知，Linux 支持的文件系统数量最多——超过\
  \ 80 个！许多是专门的，但许多其他是通用的，包括多个日志文件系统。\n\n- `/etc/fstab` 文件列出了系统的每个分区、挂载点以及任何挂载选项。`/etc/mtab`\
  \ 列出了当前挂载的文件系统，GNU/Linux 上的 `/proc/self/mount` 也是如此。（在 GNU/Linux 上，`/etc/mtab` 是\
  \ `/proc/self/mounts` 的符号链接。）`mount` 的 `loop` 选项在 GNU/Linux 下对于挂载包含在文件文件镜像特别有用。其他选项用于安全以及挂载外部文件系统，如\
  \ Windows `vfat` 和 NTFS 文件系统。\n\n- `fstab`-格式的文件可以使用 `getmntent()` 系列程序读取。GNU/Linux\
  \ 格式与其他几个 Unix 变体共享，特别是 Solaris。\n\n- `statvfs()` 和 `fstatvfs()` 函数由 POSIX 标准用于获取文件系统信息，例如空闲和使用的磁盘块数、空闲和使用的\
  \ inode 数等。Linux 有自己的获取类似信息的系统调用：`statfs()` 和 `fstatfs()`。\n\n- `chdir()` 和 `fchdir()`\
  \ 让进程更改当前目录。`getcwd()` 获取当前目录的绝对路径。这三个函数用法简单。\n\n- `fts()` 函数族集中了“遍历文件树”的任务——即访问整个目录层级结构中的每个文件对象（文件、设备、符号链接、目录）。不同的标志控制其行为。通过简单的循环读取\
  \ `FTSENT` 结构；用户级代码可以根据需要处理这些结构。`FTSENT` 结构包含了每个文件的名称、该文件的 `struct stat`、文件类型以及该文件在层级中的名称和级别的信息。GNU\
  \ `du` 使用 `fts()` 族来完成工作。\n\n\n\n\n- 最后，`chroot()` 系统调用更改了进程的当前根目录。这是一个特殊但重要的功能，对于某些守护进程类的程序特别有用。\n\
  \n### 练习题\n\n1. 在 GNU/Linux 以及你所访问的尽可能其他不同的 Unix 系统上查看 `mount`(2) 手页。这些系统调用之间有什么区别？\n\
  2. 增强 `ch-mounting-statvfs.c`，使其接受一个提供打开的文件描述符的选项；它应该使用 `fstatvfs()` 来获取文件系统信息。\n\
  3. 增强 `ch-mounting-statvfs.c`，不再忽略 NFS 挂载的文件系统。此类文件系统具有类似于 `server.example.com:/big/disk`\
  \ 的设备路径。\n4. 修改 `ch-mounting-statfs.c`（使用 Linux 特有的 `statfs()` 用的那一个），使其输出看起来像 `df`\
  \ 的输出。\n5. 为你上一个练习编写的程序添加 `-i` 选项，以产生类似于 `df -i` 的输出。\n6. 使用 `opendir()`、`readdir()`、`stat()`\
  \ 或 `fstat()`、`dirfd()` 和 `fchdir()`，编写你自己的 `getcwd()` 版本。你将如何计算缓冲区所需的总大小？你将如何在目录层级结构中移动？\n\
  7. 增强你的 `getcwd()` 版本，如果第一个参数为 `NULL`，则为调用者分配一个缓冲区。\n8. 你可以使用 `fts_read()` 来编写 `getcwd()`\
  \ 吗？如果不能，为什么？\n9. 使用 `fts_read()` 编写你自己的 `chown` 版本，它接受 `-R` 选项以递归处理整个目录树。确保在没有\
  \ `-R` 的情况下，`chown user directory` 不会递归。你将如何测试它？\n10. `nftw()` 函数提供了处理目录层级的不同方法。特别是，它使用递归处理子目录。它由\
  \ POSIX 标准化并在 GLIBC 中可用。阅读 `nftw`(3) 手页。（将其打印出来放在手边可能对你有帮助）。重写你的私有 `chown` 版本以使用\
  \ `nftw()`。\n11. 查看 `find`(1) 手页。如果你尝试从零开始编写 `find`，你更倾向于哪种文件树套件，`nftw()` 还是 `fts()`？为什么？\n\
  \n# 第二部分\n\n# 进程、网络与国际化\n\n## 第 9 章\n\n## 进程管理与管道\n\n正如我们在[第 1 章]中所说的，“引言”，[第 3\
  \ 页]，如果你用三个词来总结 Unix（以及 Linux），那么这三个词将是“文件和进程”。现在我们已经学习了如何操作文件和目录，是时候看看故事的其他部分了：进程。特别是，我们将检查进程是如何被创建和管理的，它们如何与打开的文件进行交互，以及它们如何进行相互通信。后续章节将检查信号——一种进程（或内核）通知另一个进程发生某些事件的粗略方法——权限检查、资源限制以及每个用户和每个进程的资源限制。\n\
  \n在本章中，情况开始变得复杂。特别是，为了尽量完整，我们必须提到一些在本章晚些时候或书中之后提到的内容。在这种情况下，我们提供了前向引用，但你应该能够在不看后文的情况下理解每个节的大意。\n\
  \n### 9.1 进程的创建与管理\n\n与许多许多先驱和后继操作系统不同，Unix 中的进程创建设计目标是廉价的（并且确实如此）。此外，Unix 将“创建一个新进程”的概念与“在进程中运行给定程序”的概念分离开来。这是一个优雅的设计决策，它简化了许多操作。\n\
  \n### 9.1.1 创建进程：`fork()`\n\n启动新程序的第一步是调用 `fork()`：\n\n```\n#include <sys/types.h>\
  \                                               POSIX\n#include <unistd.h>\n\npid_t\
  \ fork(void);\n```\n\n使用 `fork()` 非常简单。在调用之前，有一个进程正在运行，我们称之为 `parent`（父进程）。当 `fork()`\
  \ 返回时，有两个进程：父进程和 `child`（子进程）。\n\n关键点在于：*这两个进程都运行相同的程序*。这两个进程可以根据 `fork()` 的返回值来区分自己：\n\
  \n* **负数**：如果发生错误，`fork()` 返回 `-1`，不会创建新进程。原始进程继续运行。\n* **零**：在子进程中，`fork()` 返回\
  \ `0`。\n* **正数**：在父进程中，`fork()` 返回子进程的正数进程标识符 (PID)。\n\n创建子进程的模板代码如下：\n\n```\npid_t\
  \ child;\n\nif ((child = fork()) < 0)\n    /* 处理错误 */\nelse if (child == 0)\n  \
  \  /* 这是新新进程 */\nelse\n    /* 这是原始的父进程 */\n```\n\n`pid_t` 是一种用于存储 PID 值的符号整数类型。它可能是一个普通的\
  \ `int`，但它使代码更具自说明性，应该用来替代 `int`。\n\n在 Unix 术语中，除了是系统调用的名称外，“fork” 既是动词也是名词。我们可以说“一个进程\
  \ fork（分叉）另一个进程”，以及“在 fork 之后，有两个进程正在运行”。（想象成“路上的分叉口”，而不是“叉子、刀和勺子”）。\n\n##### 9.1.1.1\
  \ `fork()` 之后：共享与不同的属性\n\n子进程从父进程那里“继承”了大量属性的相同拷贝。这些属性中的许多是特殊的且与此处无关的。因此，以下列表故意是不完全的。以下是相关的属性：\n\
  \n* 环境变量；参见[第 2.4 节]“[环境变量]”，[第 37 页]。\n* 所有打开的文件和打开的目录；参见[第 4.4.1 节“[理解文件描述符]”，[第\
  \ 87 页]以及[第 5.3.1 节“[基础目录读取]”，[第 124 页。（这不包括在本章后面描述标记为 close-on-fork 的文件；参见[第 9.4.3.1\
  \ 节“[Close-on-Exec 和 Close-on-Fork 标志]”，[第 316 页]。）\n* umask 设置；参见[第 4.6.2 节“[使用\
  \ `umask()` 控制默认权限]”，[第 102 页]。\n* 当前工作目录；参见[第 8.4.1 节“[更改目录：`chdir()` 和 `fchdir()`]”，[第\
  \ 247 页]。\n* 根目录；参见[第 8.6 节“[更改根目录：`chroot()`]”，[第 269 页]。\n* 当前优先级，又称“nice 值”。我们很快会讨论这一点；参见[第\
  \ 9.1.3 节“[设置进程优先级：`nice()`]”，[第 282 页]。\n* 控制终端。这是允许向进程发送信号的终端设备（物理控制台或终端模拟器窗口，例如\
  \ CTRL-Z 停止运行作业）。这在[第 9.2.1 节“[作业控制概述]”，[第 300 页]中讨论。\n* 进程信号掩码和所有当前信号处理状态（尚未讨论；参见[第\
  \ 10 章]“[信号]”，[第 333 页）。\n* 真实、有效和保存的设置用户 ID 和设置组 ID，以及补充组集（尚未讨论；参见[第 11 章]“[权限与用户组\
  \ ID 号]”，[第 383 页）。\n* 资源限制。这些在[第 12 章]“[资源限制]”，[第 405 页]中讨论。\n* 共享内存段和 System V\
  \ IPC 消息描述符。（我们没有在书中描述这些特性。）\n\n除了 `fork()` 返回值外，这两个进程在以下方面有所不同：\n\n\n\n\n\n*  \
  \ 每个进程都有唯一的进程 ID（PID）和父进程 ID（PPID）。这些内容在第 9.1.2 节“识别进程：`getpid()` 和 `getppid()`”，“第\
  \ 279 页中进行了描述。\n\n*   子进程的 PID 不等于任何已存在的进程组 ID（参见第 9.2 节“进程组”，“第 300 页）。\n\n*  \
  \ 子进程及其未来子进程的累积 CPU 时间被初始化为零。（这是合理的；毕竟它是一个全新的进程。）\n\n*   父进程中挂起的任何信号在子进程中都会清除，任何挂起的告闹器或定时器也是如此。（我们尚未涵盖这些主题；请参见第\
  \ 10 章“信号”，“第 [333 页，以及第 16.3.3 节“间隔定时器：`setitimer()` 和 `getitimer()`”，“第 570 页）。\n\
  \n*   父进程持有的文件锁不会复制到子进程中（同样尚未讨论；参见第 16.2 节“锁文件”，“第 558 页）。\n\n### 9.1.1.2 文件描述符的共享\n\
  \n子进程从父进程继承的所有属性在执行 `fork()` 时，都被设置为其在父进程中相同的值。然而，从那时起，两个进程就会各自运行，（在很大程度上）相互独立。例如，如果子进程更改了目录，父进程的目录不会受到影响。同样，如果子进程更改了它的环境，父进程的环境*不会*发生改变。\n\
  \n打开的文件是这一规则的一个重要例外。打开的文件描述符是*共享*的，一个进程对共享文件描述符的操作会影响另一个进程的文件状态。在学习了图 9.1 后，最好能理解这一点。\n\
  \n![Images](img/fig09-001.jpg)\n\n**图 9.1：** 文件描述符共享\n\n该图显示了内核的内部数据结构。关键数据结构是*文件表*。每个元素引用一个打开的文件。除了其他的记录数据外，文件表还维护了文件中的当前位置（读/写偏移量）。该位置会在每次读取或写入文件时自动调整，或者通过\
  \ `lseek()` 直接调整（参见第 4.5 节“随机访问：在文件内部移动”，“第 96 页）。\n\n`open()` 或 `creat()` 返回的文件描述符充当指向文件表的“每个进程指针数组”的索引。该每个进程数组的大小不会大于\
  \ `getdtablesize()` 返回的值（参见第 4.4.1 节“理解文件描述符”，“第 87 页）。\n\n图 9.1 显示了两个进程共享标准输入和标准输出；对于每个进程，文件描述符\
  \ `0` 和 `1` 指向文件表中各自对应的相同条目。因此，当进程 45（子进程）执行 `read()` 时，共享偏移量会更新；下一次当进程 42（父进程）再次执行\
  \ `read()` 时，它将从进程 45 的 `read()` 结束的位置开始。\n\n这在 Shell 层可以很容易地看到：\n\n```\n$ cat data\
  \                                        显示演示数据文件内容\nline 1\nline 2\nline 3\nline\
  \ 4\n$ ls -l test1 ; cat test1                         测试程序的模式和内容\n-rwxrwxr-x 1\
  \ arnold arnold 82 Jan 25 14:52 test1\n#! /bin/sh\nread line ; echo p: $line   \
  \                      在父进程 Shell 中读取一行并打印\n(read line ; echo c: $line)        \
  \             在子进程 Shell 中读取一行并打印\nread line ; echo p: $line                   \
  \      在父进程 Shell 中读取一行并打印\n$ test1 < data                                    运行程序\n\
  p: line 1                                         父进程从开头开始\nc: line 2          \
  \                               子进程接替了父进程中断的地方\np: line 3                      \
  \                   父进程接替了子进程中断的地方\n```\n\n`test1` 的第一个可执行行从标准输入读取一行，改变文件中的偏移量。`test1`\
  \ 的第二行在*子 Shell*中运行括号括起来的命令。这是一个独立的 Shell 进程——正如你猜的，——通过 `fork()` 创建的。子 Shell 从父进程继承标准输入，包括当前的文件偏移量。该进程读取一行并更新指向文件的*共享*偏移量。当回到父进程\
  \ Shell 中的第三行再次读取文件时，它将从子进程停止的地方开始读取。\n\n尽管 `read` 命令是 Shell 内置的，但外部命令的工作方式也是类似的。一些早期的\
  \ Unix 系统有一个 `line` 命令，它可以读取一行输入（一次读取一个字符！）用于 Shell 脚本中；如果文件偏移量不是共享的，那么在循环中使用此类命令将是不可能的。\n\
  \n文件描述符的共享和继承在 Shell 的 I/O 重定向中起着至关重要的作用；系统调用及其语义使得 Shell 层的原语在 C 中实现非常简单，正如我们在本章后半部分看到的。\n\
  \n### 9.1.1.3 文件描述符的共享与 `close()`\n\n多个文件描述符可以指向同一个打开的文件这一事实具有重要的后果：*在所有文件描述符都关闭之前，文件不会被关闭。*（这之前也讨论过，在第\
  \ 5.1.5.2 节“移除打开的文件”，“第 118 页中，我们描述了如何取消链接一个打开的文件但仍继续使用它。）\n\n我们在本章稍后部分会看到，同一个文件的多个描述符不仅可以跨进程存在，甚至可以存在同一个进程内部；这一规则对于处理管道尤为重要。\n\
  \n如果你需要知道两个描述符是否打开在同一个文件上，可以使用 `fstat()`（参见第 5.4.2 节“获取文件信息”，“第 131 页”）对两个描述符使用两个不同的\
  \ `struct stat` 结构进行操作。如果对应的 `st_dev` 和 `st_ino` 字段相等，它们就是同一个文件。\n\n我们将在章后部分完成对文件描述符操作的讨论。\n\
  \n### 9.1.2 识别进程：`getpid()` 和 `getppid()`\n\n每个进程都有唯一的进程 ID 号（PID）。两个系统调用提供了当前 PID\
  \ 和父进程的 PID：\n\n```\n#include <sys/types.h>                                    \
  \          POSIX\n#include <unistd.h>\n\npid_t getpid(void);\npid_t getppid(void);\n\
  ```\n\n这两个函数非常简单：\n\n*   `pid_t getpid(void)`\n\n    返回当前进程的 PID。\n\n*   `pid_t\
  \ getppid(void)`\n\n    返回父进程的 PID。\n\nPID 值是唯一的；根据定义，运行中的进程不能具有相同的 PID。PID 通常会增大，即子进程的\
  \ PID 通常比父进程高。然而，在许多系统中，PID 值会*回绕*；当超过系统 PID 最大值时，创建的进程将具有最小的未使用的 PID。（POSIX 并不要求这种行为，某些系统随机分配未使用的\
  \ PID。）简而言之，你不应该假设给定的 PID 值以后不会被重用。\n\n如果父进程死亡或退出，子进程将获得一个新的父进程 `init`。在这种情况下，新的父进程\
  \ PID 将是 1，即 `init` 的 PID。这种进程被称为*孤儿进程*。下面的程序 `ch-processes-reparent.c` 展示了这一点。这也是我们看到的第一个\
  \ `fork()` 运行的示例：\n\n\n\n\n\n```\n 1  /* ch-processes-reparent.c --- show that getppid()\
  \ can change values */\n 2\n 3  #include <stdio.h>\n 4  #include <errno.h>\n 5 \
  \ #include <stdlib.h>\n 6  #include <string.h>\n 7  #include <sys/types.h>\n 8 \
  \ #include <unistd.h>\n 9\n10  /* main --- do the work */\n11\n12  int\n13  main(int\
  \ argc, char **argv)\n14  {\n15      pid_t pid, old_ppid, new_ppid;\n16      pid_t\
  \ child, parent;\n17\n18      parent = getpid();      /* before fork() */\n19\n\
  20      if ((child = fork()) < 0) {\n21          fprintf(stderr, \"%s: fork of child\
  \ failed: %s\\n\",\n22              argv[0], strerror(errno));\n23          exit(1);\n\
  24      } else if (child == 0) {\n25          old_ppid = getppid();\n26        \
  \  sleep(2);       /* see Chapter 10 */\n27          new_ppid = getppid();\n28 \
  \     } else {\n29          sleep(1);\n30          exit(0);        /* parent exits\
  \ after fork() */\n31      }\n32\n33      /* only the child executes this */\n34\
  \      printf(\"Original parent: %d\\n\", parent);\n35      printf(\"Child: %d\\\
  n\", getpid());\n36      printf(\"Child's old ppid: %d\\n\", old_ppid);\n37    \
  \  printf(\"Child's new ppid: %d\\n\", new_ppid);\n38\n39      exit(0);\n40  }\n\
  ```\n\n第 18 行使用 `getpid()` 获取初始进程的 PID。第 20–23 行 `fork` 创建子进程，并检查错误返回值。\n\n第 24–27\
  \ 行由子进程执行：第 25 行获取 PPID，第 26 行使进程暂停两秒（参见 Section 10.8.1“闹钟计时：`sleep()`，`alarm()`\
  \ 和 `SIGALRM``，”第 363 页 获取关于 `sleep()` 的信息），然后第 27 行再次获取 PPID。\n\n第 28–31 行在父进程中运行。第\
  \ 29 行让父进程延迟一秒，为子进程完成第一次 `getppid()` 调用足够的时间。第 30 行父进程退出。\n\n第 34–37 行打印这些值。注意，在\
  \ `fork` 之前设置的 `parent` 变量在子进程中仍然保持其值。`fork` 之后，两个进程拥有相同但相互独立的地址空间副本。以下是程序运行时时发生的情况：\n\
  \n```\n$ ch-processes-reparent            Run the program\n$ Original parent: 6582\
  \            Program finishes: shell prompts and child prints\nChild: 6583\nChild's\
  \ old ppid: 6582\nChild's new ppid: 1                Parent is now init\n```\n\n\
  记住这两个程序是*并行*执行的。这在 Figure 9.2 中通过图形所示。\n\n![Images](img/fig09-002.jpg)\n\n**图 9.2：**\
  \ fork 之后并行运行两个进程\n\n**注意**\n\n使用 `sleep()` 让一个进程比另一个存活在大多数情况下是有效的。然而，偶尔会失效，导致难以重现和的\
  \ bug。为了确保行为正确，请使用 `wait()` 或 `waitpid()` 进行显式同步，这些将在章节稍后的部分详细介绍（参见 Section 9.1.6.1“使用\
  \ POSIX 函数：`wait()`，`waitpid()` 和 `waitid()``，”第 294 页）。（还有其他同步方法，但 `wait()` 和 `waitpid()`\
  \ 产生的代码最清晰。）\n\n### 9.1.3 设置进程优先级：`nice()`\n\n随着进程的运行，内核会动态改变每个进程的*优先级*。正如生活一样，高优先级的项目会在低优先级项目之前获得关注。简而言之，每个进程被分配了少量运行时间，称为其*时间片*（time\
  \ slice）。当时间片结束时，如果当前进程仍然是优先级最高的进程，它被允许继续运行。\n\nLinux 与 Unix 一样提供了*抢占式多任务处理*。这意味着当该让另一个进程运行时，内核可以抢占（暂停）当前进程。运行很久的进程（例如计算密集型进程）在时间片结束时优先级会被降低，以让其他进程有机会使用处理器。同样，在等待\
  \ I/O 时空闲的进程（如交互式文本编辑器）会被赋予更高的优先级，以便它们在 I/O 就绪时做出响应。\n\n##### 9.1.3.1 POSIX 与现实\n\
  \nLinux 使用的 `-20` 到 `19` nice 值范围是历史性的；可以追溯到 V7。POSIX 使用更间接的语言表达这种情况，这允许了实现上的灵活性。它使得标准更难阅读和理解，不过，这正是你读这本书的原因。所以，\
  \ POSIX 是这样描述的：\n\n首先，系统维护的*进程 nice 值*范围从 `0` 到 `(2 * NZERO) -1`。常量 `NZERO` 定义在\
  \ `<limits.h>` 中，且至少为 `20`。这为我们提供了 0–39 的范围。\n\n其次，正如我们描述的，当前 nice 值与 `incr` 增量之和被强制限制在这个范围内。\n\
  \n最后，`nice()` 的返回值是进程 nice 值*减去* `NZERO`。当 `NZERO` 值为 `20` 时，这就给了我们最初描述的 `-20` 到\
  \ `19` 的范围。\n\n\n\n\n一旦一个新进程运行（通过 `fork()`），下一步是在该进程中启动一个不同的程序。有多个函数具有不同的用途：\n\n\
  ```\n#include <unistd.h>                                              POSIX\n\n\
  int execve(const char *filename, char *const argv[],        System call\n      \
  \     char *const envp[]);\nint fexecve(int fd, char *const argv[],            \
  \         Also a system call\n            char *const envp[]);\n\nint execl(const\
  \ char *path, const char *arg, ...);          Wrappers\nint execlp(const char *file,\
  \ const char *arg, ...);\nint execle(const char *path, const char *arg, ..., char\
  \ *const envp[]);\nint execv(const char *path, char *const argv[]);\nint execvp(const\
  \ char *file, char *const argv[]);\n```\n\n我们将这些函数称为“exec() 族”。并没有名为 `exec()` 的函数；相反，我们使用这个名称来指代上述列出的任何函数。与\
  \ `fork()`一样，“exec”在 Unix 术语中既可以作为动词（表示执行（运行）程序），也可以作为名词。\n\n### 9.1.4.1 `execve()`\
  \ 系统调用\n\n最容易解释的函数是 `execve()`。它也是主要的底层系统调用（其他大多数都是封装函数，稍后会解释）：\n\n- `int execve(const\
  \ char *filename, char *const argv[], char *const envp[])`\n\n    `filename` 是要执行的程序名称。它可以是全路径或相对路径。该文件必须是内核能够理解的可执行格式。现代系统使用\
  \ ELF（可扩展链接格式）可执行格式。GNU/Linux 理解 ELF 以及其他几种格式。如果解释型脚本使用了 `#!` 特殊第一行来指明要使用的解释器，则可以使用\
  \ `execve()` 执行它们。（不以 `#!` 开头的脚本将失败）。第 1.1.3 节”、“ 可执行文件”、“ 第 6 页 提供了 `#!` 的使用示例。\n\
  \n    `argv` 是一个标准的 C 参数列表——一个指向参数字符串的字符指针数组，包括用于 `argv[0]` 的值，并以 `NULL` 指针终止。\n\
  \n    `envp` 是新进程使用的环境，其布局与全局变量 `environ` 相同（参见 第 2.4 节、“ 环境”、“ 第 37 页）。在新的程序中，该环境将成为\
  \ `environ` 的初始值。\n\n调用 `exec()` 不应该返回。如果返回了，说明出了问题。最常见的情况是请求的程序不存在，或者存在但不可执行（`errno`\
  \ 分别对应 `ENOENT` 和 `EACCES`）。还可能出现更多问题；请参见 `execve`(2) 手页。\n\n假设调用成功，进程地址空间的当前内容将被丢弃。（内核会先安排将\
  \ `argv` 和 `envp` 数据保存在安全的地方。）内核加载新程序的可执行代码，以及任何全局和 `static` 变量。接下来，内核使用传递给 `execve()`\
  \ 的环境初始化环境，然后带有传递给 `execve()` 的 `argv` 数组调用新程序的 `main()` 例程。它统计参数的数量并将该值通过 `argc`\
  \ 传递给 `main()`。\n\n此时，新程序正在运行。它并不知道（也无法发现）在它之前进程中运行的是什么程序。注意，进程 ID (PID) 不会改变。许多其他属性在\
  \ exec 过程中保持不变；我们稍后会详细详细介绍这一点。\n\n在一种松散的类比中，`exec()` 之于进程，就像人生角色之于人。在一天中的不同时间，同一个人可能扮演父母、配偶、朋友、学生、工人、商店顾客等角色。然而，执行不同角色的仍然是同一个底层的人。进程也是如此——它的\
  \ PID、打开的文件、当前目录等并不会改变，而它正在执行的特定工作——通过 `exec()` 运行的程序——是可以改变的。\n\n### 9.1.4.2 通过文件描述符指定可执行文件：`fexecve()`\n\
  \n`fexecve()` 系统调用相对较；它是 2018 年 POSIX 标准引入的。它与 `execve()` 类似，不同在于要执行的文件是通过一个打开的文件描述符指定的：\n\
  \n- `int fexecve(int fd, char *const argv[], char *const envp[])`\n\n    `fd` 是打开的要执行文件的有效文件描述符。它必须是以只读模式（`O_RDONLY`）打开的，或者在\
  \ GNU/Linux 上使用 `O_PATH` 打开。在这里，文件必须是内核能够理解的可执行格式。`argv` 和 `envp` 与 `execve()` 相同。\n\
  \n文件描述符可以是任何已打开的文件，即使是从父进程继承的。但通常情况下，你应该小心传递给 `fexecve()` 的文件描述符。为了避免执行任意（因此可能恶意的）代码，最好传递一个由你自己打开的文件描述符。\n\
  \nPOSIX 规定，你可以使用 `O_EXEC` 标志仅为了执行而打开文件；在 GNU/Linux 上你应该使用 `O_PATH`。请参见 表 4.8，位于\
  \ 第 4.6.4 节 中的 重新审视 `open()`、“ 第 104 页。\n\n### 9.1.4.3 封装函数：`execl()` 等\n\n五个额外的函数作为封装函数，为\
  \ `execve()` 提供了更方便的接口。第一组函数都接受参数列表，每个参数都作为显式的函数参数传递：\n\n- `int execl(const char\
  \ *path, const char *arg, ...)`\n\n    第一个参数 `path` 是要执行的文件的路径。后续参数从 `arg` 开始是放置在\
  \ `argv` 中的各个元素。与之前一样，`argv[0]` 必须显式包含。你必须传递一个终止的 `NULL` 指针作为最后一个参数，以便 `execl()`\
  \ 知道参数列表的结束。新程序将继承当前程序的 `environ` 变量的环境。\n\n- `int execlp(const char *file, const\
  \ char *arg, ...)`\n\n    该函数类似于 `execl()`，但它模拟了 shell 的搜索机制，在 `PATH` 环境变量指定的每个目录中查找\
  \ `file`。如果 `file` 包含 `/` 字符，则不进行搜索。如果环境变量中不存在 `PATH`，`execlp()` 使用默认路径。在 GNU/Linux\
  \ 上，默认是 `\"/bin:/usr/bin\"`，但在其他系统上可能不同。（注意，由于此默认路径中没有没有冒号，当前目录不会被搜索）。此外，如果找到的文件具有执行权限但由于不是已知的可执行格式而无法执行，`execlp()`\
  \ 会假设程序是 shell 脚本，并将文件名作为参数执行 shell。\n\n- `int execle(const char *path, const char\
  \ *arg, ..., char *const envp[])`\n\n    该函数也类似于 `execl()`，但它接受一个额外的参数 `envp`，它将成为新程序的环境。与\
  \ `execl()` 一，你必须在 `envp` 之前提供终止的 `NULL` 指针以结束参数列表。\n\n第二组封装函数接受 `argv` 风格的数组：\n\
  \n- `int execv(const char *path, char *const argv[])`\n\n    该函数类似于 `execve()`，但新程序继承当前程序的\
  \ `environ` 变量的环境。\n\n- `int execvp(const char *file, char *const argv[])`\n\n \
  \   该函数类似于 `execv()`，但它执行与 `execlp()` 相同的 `PATH` 搜索。如果找到的文件无法直接执行，它也会执行相同的退回到执行\
  \ shell 的操作。\n\n表 9.1 总结了七个 `exec()` 函数。\n\n| **函数** | **路径搜索** | **使用 environ**\
  \ | **用途** |\n| --- | --- | --- | --- |\n| `execl()` |   | *✓* | 执行参数列表。 |\n| `execle()`\
  \ |   |  | 使用环境执行参数列表。 |\n| `execlp()` | *✓* | *✓* | 通过 `PATH` 搜索执行参数列表。 |\n\n\n\
  \n\n\n| `execv()` | | ✓ | 使用 `argv` 执行。 |\n| `execve()` | | | 使用 `argv` 和环境执行（系统调用）。\
  \ |\n| `execvp()` | ✓ | ✓ | 通过 `PATH` 搜索并使用 `argv` 执行。 |\n| `fexecve()` | | | 使用\
  \ `argv` 和环境执行（系统调用）。 |\n\n**表 9.1:** `exec()` 族字母顺序摘要\n\n`execlp()` 和 `execvp()`\
  \ 函数的行为旨在模拟 shell（命令壳）的操作；特别地，当文件不是可执行文件时，回退到运行 shell，这正是 shell 的做法。我们建议避免使用这两个函数，除非你确定\
  \ `PATH` 环境变量包含一个合理的目录列表。\n\n### 9.1.4.4 程序名与 `argv[0]`\n\n到为止，我们一直把 `argv[0]` 视为程序名。我们知道它可能包含也可能包含\
  \ `/` 字符，这取决于程序的调用方式；如果包含，那么它通常是调用程序时所用路径的一个良好线索。\n\n然而，现在应该显而易见了，`argv[0]` 是文件名仅仅是一种约定。没有任何什么能阻止你向被执行的程序传递一个任意字符串作为\
  \ `argv[0]`。下面的程序 `ch-processes-run.c` 演示了如何传递任意字符串：\n\n```\n 1  /* ch-processes-run.c\
  \ --- 用不同的名称和任何参数运行程序 */\n 2\n 3  #include <stdio.h>\n 4  #include <errno.h>\n 5\
  \  #include <stdlib.h>\n 6  #include <string.h>\n 7  #include <unistd.h>\n 8\n 9\
  \  /* main --- 调整 argv 并运行指定的程序 */\n10\n11  int\n12  main(int argc, char **argv)\n\
  13  {\n14      char *path;\n15\n16      if (argc < 3) {\n17          fprintf(stderr,\
  \ \"usage: %s path arg0 [ arg ... ]\\n\", argv[0]);\n18          exit(1);\n19  \
  \    }\n20\n21      path = argv[1];\n22\n23      execv(path, argv + 2);  /* 跳过 argv[0]\
  \ 和 argv[1] */\n24\n25      fprintf(stderr, \"%s: execv() failed: %s\\n\", argv[0],\n\
  26          strerror(errno));\n27      exit(1);\n28  }\n```\n\n第一个参数是要运行的程序的路径名，第二个参数是程序的新名称（大多数工具都会忽略它，除了为了输出错误信息）；任何其他参数都会传递给被执行的程序。\n\
  \n第 16–19 行进行错误检查。第 21 行将路径保存在 `path` 中。第 23 行执行 exec；如果执行了第 25–27 行，说明出现了问题。以下是我们运行程序时发生的情况：\n\
  \n```\n$ ch-processes-run /bin/grep whoami foo                   运行 grep\na line\
  \                                                    输入行不匹配\na line with foo in\
  \ it                                     输入行匹配\na line with foo in it          \
  \                           已打印\n^D                                            \
  \            文件结束符\n\n$ ch-processes-run nonexistent-program foo bar           \
  \ 演示失败\nch-processes-run: execv() failed: No such file or directory\n```\n\n接下来的例子有点诡异：我们让\
  \ `ch-processes-run` 运行自身，并将“`foo`”作为程序名。由于第二次运行时参数不足，它打印了用例信息并退出：\n\n```\n$ ch-processes-run\
  \ ./ch-processes-run foo\nusage: foo path arg0 [ arg ... ]\n```\n\n虽然没什么用，但 `ch-processes-run`\
  \ 清楚地表明 `argv[0]` 不需要与实际运行的文件有任何关系。\n\n在 System III（约 1980 年），`cp`、`ln` 和 `mv` 命令是同一个可执行文件，在\
  \ `/bin` 中通过这三个名称建立链接。程序会检查 `argv[0]` 并决定应该做什么。这节省了少量的磁盘空间，代价是增加了源代码的复杂性，并强制程序在被未识别的名称调用时选择一个默认操作。（某些当前的商业\
  \ Unix 系统继续这种做法！）\n\n在没有说明明确理由的情况下，GNU 编码标准建议程序不应基于其名称确定行为。我们看到的一个原因是，管理员经常会在商业\
  \ Unix 系统上与标准工具一起安装 GNU 版本的工具，并使用 `g` 前缀：`gmake`、`gawk` 等。如果这些程序只期望标准名称，当它们用不同的名称运行时，就会失败。\n\
  \n此外，如今磁盘空间很廉价；如果两个几乎相同的程序可以从相同的源代码构建，那么这样做更好，即使用 `#ifdef` 之类的手段。\n\n### 9.1.4.5\
  \ 跨 `exec()` 继承的属性\n\n与 `fork()` 一样，在程序执行 exec 后，许多属性仍保持不变：\n\n*   所有打开的文件和打开的目录；参见\
  \ 第 4.4.1 节“理解文件描述符],第 87 页 以及 第 5.3.1 节 “基础目录读取],第 124 页。\n\n（这不包括在本章后面描述的标记为 close-on-exec（执行时关闭）的文件；请参见\
  \ 第 9.4.3.1 节“Close-on-Exec 和 Close-on-Fork 标志],第 316 页）。POSIX 要求打开的目录流（通过 `opendir()`\
  \ 创建；参见 第 5.3.1 节 “基础目录读取],第 124 页）不保持打开。\n\n*   umask 设置；参见 第 4.6.2 节。\n\n*   当前工作目录；参见\
  \ 第 8.4.1 节 “切换目录`],第 102 页。\n\n*   根目录；参见 第 8.6 节 “切换根目录`],第 269 页。\n\n*   当前 nice\
  \ 值。\n\n*   进程 ID 和父进程 ID。\n\n*   进程组 ID；参见 第 9.2 节 “进程组`],第 300 页。\n\n*   会话 ID\
  \ 和控制终端；两者请参见 第 9.2.1 节 “作业控制`],第 300 页。\n\n*   进程信号掩码和任何挂起的信号，以及未过期的报警或定时器（后文可见\
  \ 第 10 章 “信号`],第 333 页。\n\n*   真实用户 ID 和组 ID 以及补充组集。有效用户 ID 和组 ID（以及保存的 set/组 ID）可以通过被执行文件的\
  \ setuid 和 setgid 位进行设置。（这些内容尚未讨论；参见 第 11 章 “权限与用户和组 ID`],第 383 页）。\n\n*   文件锁（后文可见\
  \ 第 16.2 节 “文件锁定`],第 558 页）。\n\n*   进程及其子进程的 CPU 时间。\n\n*   文件大小和资源限制（后文可见 第 12\
  \ 章 “资源限制`],第 405 页。\n\nexec 之后，信号变性会发生变化；更多信息请参见 第 10.9 节 “跨 `fork()` 和 `exec()`\
  \ 的信号`],第 378 页。\n\n默认情况下，所有打开的文件在执行 exec 后仍保持打开并可用。这就是程序继承标准输入、输出和错误的方式：它们在程序启动时已经准备就绪。\n\
  \n\n\n\n\n大多数情况下，当你 `fork` 并 `exec` 一个独立的程序时，你并不希望它继承文件描述符 `0`、`1` 和 `2` 以外的任何内容。在这种情况下，你可以在\
  \ `fork` 之后但 `exec` 之前手动关闭进程中其他打开的文件。（要这样做，你可以使用基于 `getdtablesize()` 的循环；参见第 4.4.1\
  \ 节“理解文件描述符”、“第 87 页）。或者，你可以标记某个文件描述符在执行 `fork` 或 `exec` 时由系统自动关闭；后者将在章节后后部分进行讨论（参见第\
  \ 9.4.3.1 节“Close-on-Exec 和 Close-on-Fork 标志”、“第 316 页）。\n\n### 9.1.5 终止进程\n\n进程终止涉及两个步骤：进程退出并向系统传递一个退出状态，以及父进程恢复该信息。\n\
  \n### 9.1.5.1 定义进程退出状态\n\n*退出状态*（也常称为*退出值*、*返回码*或*返回值*）是一个八位值，父进程可以在子进程退出时恢复它（在\
  \ Unix 术语中为“当子进程死亡时”）。惯例，退出状态为 `0` 表示程序运行没有问题。任何非零退出状态都表示某种失败；程序自行决定要使用的值及其含义（如果有的话）。（例如，`grep`\
  \ 使用 `0` 表示它至少匹配了一次模式，`1` 表示没有匹配模式，`2` 表示发生了错误。）此退出状态在 shell 级别上（对于 Bourne 风格的 shell）通过特殊变量\
  \ `$?` 可用。\n\nC 标准定义了两个常量，为了为了在非 POSIX 系统上实现严格的可移植性，你应该使用的全部常量：\n\n* `EXIT_SUCCESS`\n\
  \  程序无问题地退出。也可以使用 0 表示成功。\n* `EXIT_FAILURE`\n  程序发生了某种问题。\n\n在实践中，仅使用这些值是相当有限的。相反，你应该选取一组较小的返回码，记录它们的含义并使用它们（例如，`1`\
  \ 用于命令行选项和参数错误，`2` 用于 I/O 错误，`3` 用于数据错误，等等）。为了可读性，使用 `#define` 定义的常量或 `enum` 来它们是有值的。错误列表过长会让使用它们变得繁琐；大多数情况下，调用程序（或用户）只关心零与非零的区别。\n\
  \n当二元的成功/失败区分足够用时，严谨的程序员会使用 `EXIT_SUCCESS` 和 `EXIT_FAILURE`。我们自己的风格更具习惯用法，在 `return`\
  \ 和 `exit()` 中使用显式常量 `0` 或 `1`。这非常常见，以至于在早期就能学会并迅速成为本能。然而，你应该为你的项目做出自己的决定。\n\n**注意**\n\
  \n只有该值的最低有效八位对父进程可见的。因此，你应该使用 0–255 范围内的值。正如我们很快将看到的，`126` 和 `127` 具有惯例含义（在单纯的“失败”之外），你的程序应该遵循这些含义。\n\
  \n由于只有最低有效八位起作用，你*永远不要*使用负退出状态。当从小的负数中提取最后八位时，它们会变成很大的正值！（例如，–1 变成 255，–5 变成 251。）我们见过某些\
  \ C 编程书籍写错了——不要被误导。\n\n### 9.1.5.2 从 `main()` 返回\n\n程序可以通过两种方式之一自愿终止：使用下一节描述的函数之一，或者从\
  \ `main()` 返回。（第三种更极端的方法将在后文中描述，位于第 13.4 节“自杀：`abort()`”、“第 434 页）。在后一种情况下，你应该使用显式的返回值，而不是运行到函数末尾：\n\
  \n```\n/* 正确： */                         /* 错误： */\nint main(int argc, char **argv)\
  \     int main(int argc, char **argv)\n{                                   {\n \
  \   /* 代码在此处 */                     /* 代码在此处 */\n    return 0;                 \
  \          /* ?? main() 返回什么 ?? */\n}                                   }\n```\n\
  \n1999 年 C 标准指出，当 `main()` 通过运行到末尾而返回时，其行为等同于返回了 `0`。（这对于 C++ 也是如此；然而，1990 年的 C\
  \ 标准故意让此情况变为未定义。）在所有情况下，依赖这种行为都是糟糕的做法；某一天你可能在为一个 C 运行时支持匮乏的系统或嵌入式系统编程，或者在其他任何会产生差异的地方编程。（通常情况下，在任何非\
  \ `void` 函数中运行到末尾都是一个坏主意；它只会导致 Bug 代码。而且你的编译器可能不会对此警告你！）\n\n从 `main()` 返回的值会被自动传回系统，父进程稍后可以从那里恢复它。我们将在第\
  \ 9.1.6.1 节“使用 POSIX 函数：`wait()`、`waitpid()` 和 `waitid()`”、“第 294 页”中描述如何实现。\n\n\
  ### 9.1.5.3 退出函数\n\n自愿终止程序的另一种方法是调用退出函数。C 标准定义了以下函数：\n\n```\n#include <stdlib.h>\
  \                                                ISO C\n\nvoid exit(int status);\n\
  void _Exit(int status);\nint atexit(void (*function)(void));\n```\n\n这些函数的工作的工作原理如下：\n\
  \n* `void exit(int status)`\n  此函数终止程序。`status` 被传递给系统供父进程恢复。在程序退出之前，`exit()` 调用所有通过\
  \ `atexit()` 注册的函数，刷新并关闭所有打开的 `<stdio.h>` 流，并移除用 `tmpfile()` 创建的任何临时文件（参见第 13.3.2\
  \ 节“创建和打开临时文件（良好）”、“第 430 页）。当进程退出时，内核关闭任何剩余的文件描述符（网络套接字、`open()` 或 `creat()` 打开的文件和目录，或继承的文件描述符），释放其地址空间并释放它可能使用的任何其他资源。`exit()`\
  \ 永不返回。\n* `void _Exit(int status)`\n  此函数与 POSIX `_exit()` 函数本质相同；我们将稍后讨论它。\n*\
  \ `int atexit(void (*function)(void))`\n  `function` 是指向回调函数的指针，该函数将在程序退出时调用。`exit()`\
  \ 在关闭文件和终止程序之前调用回调函数。其思想是应用程序可以提供一个或多个清理函数，在最终关闭之前运行。提供一个函数被称为*注册*它。\n  `atexit()`\
  \ 成功时返回 `0`，错误时返回 `–1`，并相应设置 `errno`。下面的程序没有做任何实用的工作，但它演示了 `atexit()` 如何工作：\n\n\
  ```\n/* ch-processes-atexit.c --- 演示 atexit().\n为了简洁省略了错误检查。 */\n\n#include <stdio.h>\n\
  #include <stdlib.h>\n\n/*\n * 这里的回调函数只是进行点名。\n * 在实际应用程序中，它们会做更多。\n */\n\nvoid callback1(void)\
  \ { printf(\"callback1 called\\n\"); }\nvoid callback2(void) { printf(\"callback2\
  \ called\\n\"); }\nvoid callback3(void) { printf(\"callback3 called\\n\"); }\n\n\
  /* main --- 注册函数然后退出 */\n\nint\nmain(int argc, char **argv)\n\n{\n   printf(\"registering\
  \ callback1\\n\");  atexit(callback1);\n   printf(\"registering callback2\\n\");\
  \  atexit(callback2);\n   printf(\"registering callback3\\n\");  atexit(callback3);\n\
  \n   printf(\"exiting now\\n\");\n   exit(EXIT_SUCCESS);\n}\n```\n\n当它运行时，会发生什么：\n\
  \n\n\n\n\n```\n$ ch-processes-atexit\nregistering callback1                 Main\
  \ program runs\nregistering callback2\nregistering callback3\nexiting now\ncallback3\
  \ called                      Callback functions run in reverse order\ncallback2\
  \ called\ncallback1 called\n```\n\n如示例所示，用 `atexit()` 注册的函数执行顺序与其注册顺序相反，最后注册的函数先执行。（这也被称为*后进先出*，简称\
  \ LIFO。）\n\nPOSIX 还定义了 `_exit()` 函数。与 `exit()` 不同，后者会调用回调函数并执行 `<stdio.h>` 清理工作，而\
  \ `_exit()` 是“立即死亡”函数：\n\n```\n#include <unistd.h>                             \
  \               POSIX\n\nvoid _exit(int status);\n```\n\n`status` 被传递给系统，与 `exit()`\
  \ 一样，但进程会立即终止。内核仍然会进行常规清理工作：关闭所有打开的文件描述符，释放地址空间使用的内存，并释放进程正在使用的任何其他资源。\n\n在实践中，ISO\
  \ C 的 `_Exit()` 函数与 `_exit()` 是相同的。C 标准规定，`_Exit()` 是否调用用 `atexit()` 注册的函数以及是否关闭打开的文件取决于实现。对于\
  \ GLIBC 系统，它并不这样做，行为类似于 `_exit()`。\n\n使用 `_exit()` 的时机是在 fork 出的子进程中 `exec` 失败时。在这种情况下，你*不应该*使用普通的\
  \ `exit()`，因为它会刷新 `FILE *` 流中持有的任何缓冲区数据。当父进程稍后刷新其缓冲区副本时，缓冲区数据最终会被写入*两次*；显然这并不是什么好事。\n\
  \n例如，假设你想运行一个 shell 命令并自己执行 fork 和 exec。这样的代码看起来如下：\n\n```\nconst char shellcommand[]\
  \ = \"...\";\npid_t child;\n```\n\n```\nif ((child = fork()) == 0) {  /* 子进程 */\n\
  \    execl(\"/bin/sh\", \"sh\", \"-c\", shellcommand, NULL);\n    _exit(errno ==\
  \ ENOENT ? 127 : 126);\n}\n/* 父进程继续执行 */\n```\n\n`errno` 测试和退出值遵循 POSIX shell 使用的约定。如果请求的程序不存在（`ENOENT`——在目录中没有该条目），则退出值为\
  \ `127`。否则，文件存在但由于其他原因无法被 exec，因此退出状态为 `126`。在在你自己的程序中遵循这一约定也是个好主意。\n\n简而言之，为了充分利用\
  \ `exit()` 和 `atexit()`，你应该采取以下操作：\n\n*   定义一组较小的退出状态值，程序将用这些值向调用者传递信息。在代码中使用 `#define`\
  \ 定义的常量或 `enum` 来表示它们。\n*   在程序的文档中记录这些值！\n*   判断为配合 `atexit()` 使用回调函数是否有意义。如果有，请在\
  \ `main()` 中的适当时机注册它们——例如，在解析选项之后，以及在初始化回调函数应该清理的任何数据结构之后。记住，函数是按 LIFO（后进先出）顺序被调用的。\n\
  *   每当发生错误且退出是正确操作时，随处使用 `exit()` 退出程序。使用你定义并记录的错误代码。\n*   例外是 `main()`，如果你愿意，对其可以使用\
  \ `return`。我们自己的风格通常是：出现问题时使用 `exit()`，在 `main()` 结束时如果一切顺利则使用 `return 0`（或 `return\
  \ EXIT_SUCCESS`）。\n*   如果在子进程中 `exec()` 失败，请使用 `_exit()` 或 `_Exit()`。\n\n### 9.1.6\
  \ 回收子进程的退出状态\n\n当进程死亡时，正常的做法是内核释放其所有资源。内核确实保留死进程的退出状态，以及它在生命周期内使用的资源信息，且 `PID` 继续被计为正在使用状态。这种死去的进程被称为*僵尸*。\n\
  \n父进程（无论是原始父进程还是 `init`）都可以回收子进程的退出状态。或者，通过使用未 POSIX 标准化的 BSD 函数，可以回收退出状态以及资源使用信息。状态回收是通过等待进程死亡完成的，这也被*收割*（reaping）进程。^(2)\n\
  \n^(2) 我们不是在编造这些。这些术语确实相当阴森，但这就是最初 Unix 设计师的幽默感。\n\n等待子进程死亡的机制与我们尚未描述的信号机制之间存在着大量的交互。先描述哪一个有点像鸡生蛋蛋鸡的问题；我们选择先讨论子进程等待机制，而第\
  \ 10 章“信号”，第 333 页提供了信号的完整故事。\n\n目前，理解信号是通知进程发生了某些事件的一种就足够了。进程可以产生发送给自己的信号，也可以由其他进程或终端的用户从外部发送。例如，CTRL-C\
  \ 发送一个“中断”信号，CTRL-Z 发送一个作业控制“停止”信号。\n\n默认情况下，许多信号（如中断信号）会导致接收进程死亡。其他信号（如作业控制信号）会使其改变状态。子进程等待机制可以确定进程是否死于信号，如果是的话，是哪种信号。对于停止的进程以及在某些系统中继续运行的进程也是如此。\n\
  \n#### 9.1.6.1 使用 POSIX 函数：`wait()`、`waitpid()` 和 `waitid()`\n\n原始的 V7 系统调用是 `wait()`。基于\
  \ BSD 功能的较新的 POSIX 调用是 `waitpid()`。最新的 POSIX 调用 `waitid()` 比其他两个更通用。函数声明如下：\n\n\
  ```c\n#include <sys/types.h>                                           POSIX\n#include\
  \ <sys/wait.h>\n\npid_t wait(int *status);\npid_t waitpid(pid_t pid, int *status,\
  \ int options);\nint waitid(idtype_t idtype, id_t id, siginfo_t *infop, int options);\n\
  ```\n\n`wait()` 等待*任何*子进程死亡；关于它如何死亡的信息通过 `*status` 返回。（稍后我们将讨论如何解释 `*status`。）返回值为死进程的\
  \ PID，如果发生错误则返回 `-1`。\n\n如果没有子进程，`wait()` 返回 `-1` 并将 `errno` 设置为 `ECHILD`（无子进程）。否则，它会等待第一个子进程死亡或等待信号进入。\n\
  \n`waitpid()` 函数允许你等待特定的子进程退出。它提供了相当大的灵活性，并且优于 `wait()`。它同样返回死进程的 PID，如果发生错误则返回\
  \ `-1`。参数如下：\n\n*   `pid_t pid`\n\n该值指定了通过真实的 `pid` 和进程组来等待哪个子进程。`pid` 值具有以下含义：\n\
  \n    | `pid` < –1 | 等待进程组 ID 等于 `pid` 绝对值的子进程。 |\n    | `pid` = –1 | 等待任何子进程。这是\
  \ `wait()` 的工作方式。 |\n    | `pid` = 0 | 等待进程组 ID 等于父进程组的子进程。 |\n    | `pid` > 0 |\
  \ 等待 PID 等于 `pid` 的特定进程。 |\n\n*   `int *status`\n\n这与 `wait()` 相同。`<sys/wait.h>`\
  \ 定义了各种解释 `*status` 中值的宏，我们稍后会描述它们。\n\n*   `int options`\n\n这应当是 `0` 或以下一个或多个标志的按位或结果：\n\
  \n    *   `WNOHANG`\n\n        如果没有子进程退出，则立即返回。这样你就可以定期检查是否有子进程死亡。（这种定期检查被称为对事件的*轮询*（polling）。）\n\
  \    *   `WUNTRACED`\n\n        返回关于已停止尚未退出的子进程的信息（例如，通过作业控制）。\n    *   `WCONTINUED`\n\
  \n\n\n\n如果子进程的状态自更改以来未被报告，则返回关于该持续运行子进程的信息。这同样用于作业控制。（这是一个 XSI 扩展；POSIX 并不要求实现 XSI\
  \ 扩展的系统支持它。）\n\n有多个宏可以作用于填充的 `*status` 值，以确定发生了什么。这些宏通常成对出现：一个宏用于判断是否发生了某些情况，如果该宏为真，则通过一个或多个宏来获取细节。这些宏如下：\n\
  \n* `WIFEXITED(status)`\n    如果进程退出（而不是改变状态），则该宏非零（真）。\n\n* `WEXITSTATUS(status)`\n\
  \    该宏给出退出状态；它等于传递给 `exit()` 的值或从 `main()` 返回的最低有效八位。你应该只在 `WIFEXITED(status)`\
  \ 为真时才使用此宏。\n\n* `WIFSIGNALED(status)`\n    如果进程因信号导致死亡，则该宏非零。\n\n* `WTERMSIG(status)`\n\
  \    该宏提供终止进程的信号编号。你应该只在 `WIFSIGNALED(status)` 为真时才使用此宏。\n\n* `WIFSTOPPED(status)`\n\
  \    如果进程被停止，则该宏非零。\n\n* `WSTOPSIG(status)`\n    该宏提供停止进程的信号编号。（多个信号可以停止一个进程。）你应该只在\
  \ `WIFSTOPPED(status)` 为真时才使用此宏。作业控制信号在第 10.8.2 节“作业控制信号”、第 365 页中进行了讨论。\n\n* `WIFCONTINUED(status)`\n\
  \    如果进程被继续运行，则该宏非零。没有对应的 `WCONTSIG()` 宏，因为只有一个信号可以导致进程继续运行。（这是一个 XSI 扩展。）\n\n\
  * `WCOREDUMP(status)`\n    如果进程生成了核心转储，则该宏非零。*核心转储*（core dump）是进程终止时创建的运行进程的内存镜像。它旨在后续的调试。某些信号会自动终止进程并产生核心转储。\n\
  \n    Unix 系统将文件命名为 `core`，并将其放在死亡程序的当前目录下（假设该进程在那里有写权限）。在 GNU/Linux 上，情况要复杂得多。我们将关于如何获取核心转储文件的讨论推到第\
  \ 17.3.1 节“获取 `core` 文件”、第 594 页。\n\n    注意此宏是非标准的。GNU/Linux、Solaris 和 BSD 系统支持它，但某些旧版\
  \ Unix 系统不支持。因此，如果你想使用它，请将此类用法封装在‘#ifdef WCOREDUMP ... #endif’中。\n\n最后，POSIX 定义的最新函数是\
  \ `waitid()`。它比其他函数更灵活，因为它只需返回子进程状态更改的信息，而不仅仅是等待死亡。它的参数是：\n\n| 常量 | 仅限 Linux | 含义\
  \ |\n| --- | --- | --- |\n| `P_PID` | | 等待由 `(pid_t) id` 指定的子进程。 |\n| `P_PGID` |\
  \ | 等待任何进程组 ID 等于 `(pid_t) id` 的子进程。 |\n| `P_PIDFD` | ✓ | 等待由 `id` 中的 PID 文件描述符指定的子进程。\
  \ |\n| `P_ALL` | | 等待任何子进程；忽略 `id`。 |\n\n**表 9.2：** `idtype` 的可能值\n\n* `idtype_t\
  \ idtype`\n    这描述了要等待的子进程。`idtype` 的值应该是表 9.2 中的值之一。\n\n* `id_t id`\n    指定要等待的子进程的进程\
  \ ID 或进程组 ID。\n\n* `siginfo_t *infop`\n    与进程相关的信息将填充到此结构中。我们将对 `siginfo_t` 内容的讨论推到第\
  \ 10.6.4 节“捕获信号：`sigaction()`”、第 353 页。\n\n* `int options`\n    以下一个或多个标志的按位或：\n\
  \n    | 标志 | 含义 |\n    | --- | --- |\n    | `WCONTINUED` | 等待因作业控制恢复的子进程。 |\n  \
  \  | `WEXITED` | 等待退出的子进程。 |\n    | `WNOHANG` | 如果没有子进程可以等待，则立即返回。 |\n    | `WNOWAIT`\
  \ | 只检索信息；以后可以再次等待子进程。 |\n    | `WSTOPPED` | 等待因作业控制停止的子进程。 |\n\n如果检索了信息或使用了 `WNOHANG`，则返回\
  \ `0`。否则在出错时返回 `-1`。\n\n大多数程序并不关心子进程*为什么*死亡；它们只关心它*是否*死亡，可能会记录它是否成功退出。GNU Coreutils\
  \ 的 `install` 程序演示了对 `fork()`、`execlp()` 和 `waitpid()` 的这种直接用法。`-s` 会导致 `install`\
  \ 对正在安装的二进制可执行文件运行 `strip` 程序。（`strip` 从可执行文件中移除调试和其他信息。相对而言，这可以节省大量的空间。在具有数 TB\
  \ 硬盘驱动器的现代系统上，通常没有必要在安装时剥离可执行文件。早些显示过一个示例，在第 3.1 节“Linux/Unix 地址空间”、第 51 页。\n\n\
  ```c\n/* 从 NAME 中剥离符号表 */\nstatic bool strip (char const *name)\n{\n  int status;\n\
  \  bool ok = false;\n  pid_t pid = fork ();\n\n  switch (pid)\n    {\n    case -1:\n\
  \      error (0, errno, _(\"fork system failed\"));\n      break;\n    case 0: \
  \         /* 子进程。 */\n      {\n        char const *safe_name = name;\n        if\
  \ (name && *name == '-')\n          safe_name = name_concat (\".\", name);\n   \
  \     execlp (strip, strip, safe_name, nullptr);\n        error (EXIT_FAILURE, errno,\
  \ _(\"cannot run %s\"),\n               quote (strip));\n      }\n    default: \
  \           /* 父进程。 */\n      if (waitpid (pid, &status, 0) < 0)\n        error\
  \ (0, errno, _(\"waiting for strip\"));\n      else if (! WIFEXITED (status) ||\
  \ WEXITSTATUS (status))\n        error (0, 0, _(\"strip process terminated abnormally\"\
  ));\n      else\n        ok = true;      /* strip 成功 */\n      break;\n    }\n \
  \ return ok;\n}\n```\n\n第 495 行调用了 `fork()`。`switch` 语句随后对错误返回（第 499–501 行）、子进程（第\
  \ 502–510 行）和父进程（第 511–519 行）采取正确的行动。（顺便问一下，第 505–506 行发生了什么，为什么？）\n\n第 512 行使用\
  \ `waitpid()` 等待派生子进程的 PID。随后在第 514–515 行使用 `WIFEXITED()` 和 `WEXITSTATUS()` 检查 `status`\
  \ 是否出错。\n\n根据目前为止的描述和代码，似乎父程序必须在特定点等待任何子进程死亡，可能在循环中轮询，等待所有孩子。在第 10.8.3 节“父进程监督：三种不同的策略”、第\
  \ 366 页，我们将看到事实并非如此。相反，信号为子进程死亡时的父通知提供了一系列机制。\n\n##### 9.1.6.2 使用 BSD 函数：`wait3()`\
  \ 和 `wait4()`\n\n\n\n\nBSD `wait3()` 和 `wait4()` 系统调用如果你对子进程所使用的资源感兴趣，它们会很有用。它们不是标准的（意味着它们不属于\
  \ POSIX），但在许多地方都可用，包括 GNU/Linux。它们的声明如下：\n\n```\n#include <sys/types.h>        \
  \                                   共用\n#include <sys/time.h>\n#include <sys/resource.h>\n\
  #include <sys/wait.h>\n\npid_t wait3(int *status, int options, struct rusage *rusage);\n\
  pid_t wait4(pid_t pid, int *status, int options, struct rusage *rusage);\n```\n\n\
  `status` 变量与 `wait()` 和 `waitpid()` 中的相同。之前描述的所有宏（`WIFEXITED()`、`WEXITSTATUS()`\
  \ 等）也可以用于它。\n\n`options` 值也与 `waitpid()` 相同：要么是 `0`，或者是 `WNOHANG` 和 `WUNTRACED`\
  \ 其中一个或两个的位或。\n\n`wait3()` 的行为类似于 `wait()`，获取关于第一个可用的僵尸进程的信息；而 `wait4()` 类似于 `waitpid()`，获取关于特定进程的信息。两者都返回被收养进程的\
  \ PID，错误时返回 `–1`，如果没有可用进程且使用了 `WNOHANG`，则返回 `0`。`pid` 参数可以取与 `waitpid()` 的 `pid`\
  \ 参数相同的值。\n\n`wait3()` 和 `wait4()` 相比 `wait()` 和 `waitpid()` 增加的价值在于 `struct rusage`\
  \ 指针。如果不是 `NULL`，系统将向其中填充关于该进程的信息。该结构在 POSIX 和 `getrusage`(2) 手页中有描述：\n\n```\nstruct\
  \ rusage {\n    struct timeval ru_utime; /* 使用的用户态时间 */\n    struct timeval ru_stime;\
  \ /* 使用的内核时间 */\n    long   ru_maxrss;        /* 最大驻内存大小 */\n    long   ru_ixrss;\
  \         /* 积分共享内存大小 */\n    long   ru_idrss;         /* 积分非共享数据大小 */\n    long\
  \   ru_isrss;         /* 积分非共享栈大小 */\n    long   ru_minflt;        /* 页收回 */\n \
  \   long   ru_majflt;        /* 缺页 */\n    long   ru_nswap;         /* 交换 */\n \
  \   long   ru_inblock;       /* 块输入操作 */\n    long   ru_oublock;       /* 块输出操作\
  \ */\n    long   ru_msgsnd;        /* 发送的消息 */\n    long   ru_msgrcv;        /*\
  \ 接收的消息 */\n    long   ru_nsignals;      /* 接收的信号 */\n    long   ru_nvcsw;     \
  \    /* 自愿上下文切换 */\n    long   ru_nivcsw;        /* 非意愿上下文切换 */\n};\n```\n\n纯 BSD\
  \ 系统（4.3 Reno 及以后）支持所有字段。表 9.3 描述了 `struct rusage` 中 POSIX 和 GNU/Linux 各种字段的可用性。\n\
  \n| **字段** | **POSIX** | **GNU/Linux** |\n| --- | --- | --- |\n| `ru_utime` | ✓\
  \ | ✓ |\n| `ru_stime` | ✓ | ✓ |\n| `ru_maxrss` | | ✓ |\n| `ru_minflt` | | ✓ |\n\
  | `ru_majflt` | | ✓ |\n| `ru_inblock` | | ✓ |\n| `ru_oublock` | | ✓ |\n| `ru_nvcsw`\
  \ | | ✓ |\n| `ru_nivcsw` | | ✓ |\n\n**表 9.3：** `struct rusage` 字段的可用性\n\n只有标记为“POSIX”的字段才由标准定义。表中列出的其他字段由\
  \ Linux 内核维护。然而，你可能想要双重检查 `getrusage`(2) 手页。\n\n最感兴趣的字段是 `ru_utime` 和 `ru_stime`，分别是用户态和内核\
  \ CPU 时间。（用户态 CPU 时间是执行用户级代码所花费的时间。内核 CPU 时间是在内核中代表该进程所花费的时间。）\n\n这两个字段使用 `struct\
  \ timeval`，该结构维护精确到微秒间隔的时间值。关于此结构的更多信息，请参阅 第 5.6.4.2 节，“微秒级时间分辨率：`utimes()`](#ch05.xhtml_ch05lev3sec11),”\
  \ 第 149 页。\n\n在 4.2 和 4.3 BSD 中，`wait()` 和 `wait3()` 的 `status` 参数是一个 `union wait`。它可以放入一个\
  \ `int` 中，并提供与 `WIFEXITED()` 以及其他现代宏相同的信息访问，但通过 `union` 的成员实现。并不是所有成员在所有情况下都是有效的。这些成员及其用途描述在\
  \ 表 9.4 中。\n\n| **POSIX 宏** | **Union 成员** | **用法** | **含义** |\n| --- | --- | ---\
  \ | --- |\n| `WIFEXITED()` | `w_termsig` | `w.w_termsig == 0` | 如果正常退出则为真。 |\n|\
  \ `WEXITSTATUS()` | `w_retcode` | `code = w.w_retcode` | 如果不是通过信号退出的退出状态。 |\n| `WIFSIGNALED()`\
  \ | `w_termsig` | `w.w_termsig != 0` | 如果因信号死亡则为真。 |\n| `WTERMSIG()` | `w_termsig`\
  \ | `sig = w.w_termsig` | 导致终止的信号。 |\n| `WIFSTOPPED()` | `w_stopval` | `w.w_stopval\
  \ == WSTOPPED` | 如果停止则为真。 |\n| `WSTOPSIG()` | `w_stopsig` | `sig = w.w_stopsig`\
  \ | 导致停止的信号。 |\n| `WCOREDUMP()` | `w_coredump` | `w.w_coredump != 0` | 如果子进程转储核心则为真。\
