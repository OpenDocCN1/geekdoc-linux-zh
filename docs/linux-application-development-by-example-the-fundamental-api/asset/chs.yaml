  \n### 1. 源代码\n\n作品的“源代码”是指对该作品进行修改的首选形式。“目标代码”是指作品的任何非源代码形式。\n\n“标准接口”指既是由公认的标准机构定义的官方标准，或者（对于指定特定编程语言的接口）是指在从事该语言的开发人员中被广泛使用的接口。\n\
  \n可执行作品的“系统库”包括除作品本身以外的任何内容，其 (a) 包含在`Major Component`（主要组件）的普通形式中，但不属于该 `Major\
