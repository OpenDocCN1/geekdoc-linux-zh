  \ |\n\n**表 9.4：** 4.2 和 4.3 BSD 的 `union wait`\n\n### 9.2 Process Groups\n\n*进程组*\
  \ 是一组为了作业控制而一起处理的相关进程。具有相同进程组 ID 的进程是该进程组的成员，进程组 ID 与终端相同的进程是*进程组组*。\n\n### 9.2.1\
  \ Job Control Overview\n\n作业控制是一个深入的话题，我们选择不在书中深入探讨。然而，这里有一个快速的概念概述。\n\n与用户工作的终端设备（物理或其他）被称为*控制终端*。\n\
  \n*会话*是与控制终端相关的进程组的集合。每个终端只有一个会话，包含多个进程组。一个进程被指定为*会话组*；这通常是一个可以作业控制的 shell，如 Bash、`mksh`、`zsh`\
  \ 或 `ksh93`。\n\n控制终端也关联有一个进程组标识。当用户输入特殊字符，如 CTRL-C（中断）或 CTRL-Z（停止）时，内核会将给信号发送给终端进程组中的进程。\n\
  \n进程组 ID 与控制终端相同的进程组被允许读取和写入终端。这被称为*前台进程组*。它也接收键盘生成的信号。会话中的任何其他进程组都是*后台进程组*，无法读取或写入终端；当它们尝试时，会接收停止它们的特殊信号。\n\
  \n\n\n\n作业在前台和后台之间切换，并不是通过改变作业的属性来实现，而是通过改变控制终端的进程组来实现。这种改变由作业控制 shell 完成，如果新的进程组被停止了，shell\
  \ 将通过向该进程组的所有成员发送“继续”（continue）信号来继续运行它们。\n\n在过去，用户经常使用连接到调制解器的串行终端拨入集中式微型计算机 Unix\
  \ 系统。当用户关闭连接（挂电话）时，串口线会检测到断开，内核会向连接到该终端的所有进程发送“挂断”（hangup）信号。\n\n这个概念仍然适用：如果发生挂断，内核会将挂断信号发送给前台进程组。（串口硬件仍然存在且仍在在使用，因此你可能会遇到物理挂断。当你关闭终端模拟器的窗口而不是退出\
  \ shell 时，也会收到挂断信号。）如果会话领导者退出，也会发生同样的情况。\n\n*孤儿进程组*是指对于组中的每一个进程，其父进程也在该组内，或者在不同的会话中进程组。（这可能在作业控制\
  \ shell 退出但后台作业仍在运行时发生。）孤儿进程组中的运行进程被允许运行到结束。如果在一个进程组变成孤儿组时已经存在已停止的进程，内核会向这些进程发送一个挂断信号，然后发送一个继续信号。这会导致它们唤醒，从而能够退出，而不是永远保持停止状态。\n\
  \n## 9.2.2 进程组标识：`getpgrp()` 和 `getpgid()`\n\n为了与旧系统兼容，POSIX 提供了多种获取进程组信息的方法：\n\n\
  ```\n#include <unistd.h>                                       POSIX\n\npid_t getpgrp(void);\n\
  pid_t getpgid(pid_t pid);\n```\n\n`getpgrp()` 函数返回当前进程的进程组 ID。`getpgid()` 返回给定进程\
  \ `pid` 的进程组 ID。`pid` 为 `0` 表示“当前进程的进程组”。因此 `getpgid(0)` 与 `getpgrp()` 相同。对于通用编程，应该使用\
  \ `getpgrp()`。\n\n## 9.2.3 进程组设置：`setpgid()` 和 `setpgrp()`\n\n有两个函数用于设置进程组：\n\n\
  ```\n#include <unistd.h>\n\nint setpgid(pid_t pid, pid_t pgid);                \
  \                   POSIX\nint setpgrp(void);                                  \
  \                  Common\n```\n\n`setpgrp()` 函数非常简单：它将进程组 ID 设置为与进程 ID 相同。这样做会在同一会话中创建一个新的进程组，调用进程成为该进程组组。它曾被\
  \ POSIX 标准化，但不再是；尽管如此，它仍然可用。\n\n`setpgid()` 函数用于作业控制。它允许一个进程设置另一个进程的进程组。进程可以仅更改自己的进程组\
  \ ID 或子进程的进程组 ID，但前提是该子进程尚未执行 `exec`。作业控制 shell 会在 `fork` 之后在父进程和子进程中调用此函数。其中一个调用会成功，进程组\
  \ ID 随之改变。（否则，无法保证顺序，例如父进程可能会在子进程 exec 之前更改其进程组 ID。如果父进程的调用先成功，它就可以继续下一个任务，例如操作其他作业或终端。）\n\
  \n使用 `setpgid()` 时，`pgid` 必须是当前会话中的现有进程组，这实际上是将 `pid` 加入该进程组。否则，`pgid` 必须等于 `pid`，以创建一个新的进程组。\n\
  \n`pid` 和 `pgid` 都有一些特殊情况值：\n\n* `pid = 0`\n    在这种情况下，`setpgid()` 将调用进程的进程组更改为\
  \ `pgid`。它等同于 `setpgid(getpid(), pgid)`。\n\n* `pgid = 0`\n    这会将给定进程的进程组 ID 设置为与其\
  \ PID 相同。因此 `setpgid(pid, 0)` 等同于 `setpgid(pid, pid)`。这会导致 PID 为 `pid` 的进程成为进程组组长。\n\
  \n在所有情况下，会话领导者都是特殊的；它们的 `PID`、进程组 ID 和会话 ID 值完全相同，且会话领导者的进程组 ID 无法更改。（会话 ID 通过 `setsid()`\
  \ 设置并通过 `getsid()` 获取。这些是特殊调用；请参见 *setsid*(2) 和 *getsid*(2) 手页。）\n\n## 9.3 基础进程间通信：管道和\
  \ FIFOs\n\n*进程间通信*（IPC）正如其名义：两个独立进程之间通信的方式。Unix 系统上最老的 IPC 机制是*管道*（pipe），一种单向通信通道。写入通道一端的数据会从另一端输出。\n\
  \n### 9.3.1 管道\n\n管道表现为普通文件描述符。在不采取特殊手段的情况下，无法判断文件描述符是文件还是管道。这是一个特性；读取标准输入并写入标准输出的程序不需要知道或关心它们可能正在与另一个进程通信。如果你需要知道，标准的检查方法是对文件描述符尝试\
  \ `lseek(fd, 0L, SEEK_CUR)`；此调用尝试从当前位置偏移零字节——也就是说，它是一个无所事的操作。该操作对于管道会失败，且对其他文件不会造成损坏。\n\
  \n这种操作通常被称为 *no-op*，是“no operation”（无操作）的缩写。\n\n#### 9.3.1.1 创建管道\n\n`pipe()` 系统创建一个管道：\n\
  \n```\n#include <unistd.h>                                               POSIX\n\
  \nint pipe(int filedes[2]);\n```\n\n参数值是一个两个元素整数数组的地址。`pipe()` 成功时返回 `0`，出错时返回 `-1`。\n\
  \n如果调用成功，进程现在拥有两个额外的打开的文件描述符。`filedes[0]` 中的值是管道的*读端*，`filedes[1]` 是*写端*。（一个实用的记忆方法是读端使用索引\
  \ `0`，类似于标准输入是文件描述符 `0`，写端使用索引 `1`，类似于标准输出是文件描述符 `1`。）\n\n如所述，写入写端的数据从读端读取。当你完成管道后，通过调用\
  \ `close()` 关闭两端。下面的简单程序 `ch-processes-pipedemo.c` 通过创建一个管道、向其写入数据，然后从其中读取数据来演示管道的使用：\n\
  \n```\n 1  /* ch-processes-pipedemo.c --- 使用管道演示 I/O. */\n 2\n 3  #include <stdio.h>\n\
  \ 4  #include <errno.h>\n 5  #include <stdlib.h>\n 6  #include <string.h>\n 7  #include\
  \ <unistd.h>\n 8\n 9  /* main --- 创建管道，向其写入，并从中读取。 */\n10\n11  int\n12  main(int\
  \ argc, char **argv)\n13  {\n14      static const char mesg[] = \"Don't Panic!\"\
  ;  /* 一个著名的消息 */\n15      char buf[BUFSIZ];\n16      ssize_t rcount, wcount;\n17\
  \      int pipefd[2];\n18      size_t len;\n19\n20      if (pipe(pipefd) < 0) {\n\
  21          fprintf(stderr, \"%s: pipe failed: %s\\n\", argv[0],\n22           \
  \   strerror(errno));\n23          exit(EXIT_FAILURE);\n24      }\n25\n26      printf(\"\
  Read end = fd %d, write end = fd %d\\n\",\n27          pipefd[0], pipefd[1]);\n\
  28\n29      len = strlen(mesg);\n30      if ((wcount = write(pipefd[1], mesg, len))\
  \ != len) {\n31          fprintf(stderr, \"%s: write failed: %s\\n\", argv[0],\n\
  32              strerror(errno));\n33          exit(EXIT_FAILURE);\n34      }\n\
  35\n36      if ((rcount = read(pipefd[0], buf, BUFSIZ)) != wcount) {\n37       \
  \   fprintf(stderr, \"%s: read failed: %s\\n\", argv[0],\n38              strerror(errno));\n\
  39          exit(EXIT_FAILURE);\n40      }\n41\n42      buf[rcount] = '\\0';\n43\n\
  44            printf(\"Read <%s> from pipe\\n\", buf);\n45      (void) close(pipefd[0]);\n\
  46      (void) close(pipefd[1]);\n47\n48      return EXIT_SUCCESS;\n49  }\n```\n\
  \n\n\n\n第 14–18 行声明了局部变量；其中最感兴趣的是 `mesg`，它是将遍历管道的文本。\n\n第 20–24 行创建了管道并进行了错误检查；第\
  \ 26–27 行打印了新文件描述符的值（仅为了证明它们不会是 `0`、`1` 或 `2`）。\n\n第 29 行获取消息长度以供 `write()` 使用。第\
  \ 30–34 行将消息写入管道，同样包含了错误检查。\n\n第 36–40 行从管道读取内容，同样包含了错误检查。\n\n第 42 行提供了一个终止零字节，以便读取到的数据可以作为普通字符串使用。第\
  \ 44 行打印数据，第 45–46 行关闭管道的两个端。以下是程序运行时的发生的情况：\n\n```\n$ ch-processes-pipedemo\nRead\
  \ end = fd 3, write end = fd 4\nRead <Don't Panic!> from pipe\n```\n\n这个程序没有做任何实用的事情，但它演示了基础知识。注意，程序没有调用\
  \ `open()` 或 `creat()`，且没有使用其继承的三个文件描述符。然而，`write()` 和 `read()` 成功了，证明文件描述符是有效的，且进入管道的数据确实从管道中取出。\n\
  \n我们确定你并不担心。毕竟，你可能每天都在 shell 中几十次管道。\n\n管道的空间是有限的，这一点我们将在下一节中讨论。这意味着如果消息太大，我们的程序将无法工作；`write()`\
  \ 将阻塞，等待有人清空管道。\n\n与其他文件描述符一样，管道的文件描述符会在 `fork` 之后被子进程继承，如果未关闭，在 `exec` 之后仍然可用。我们很快就会看到如何利用这一事实并用管道做一些有趣的事情。\n\
  \n#### 9.3.1.2 管道缓冲\n\n管道会对数据进行*缓存*，这意味着写入管道的数据将由内核留存，直到被读取为止。然而，管道只能容纳有限的已但尚未读取的数据。我们可以将写入进程称为*生产者*，将读取进程称为*消费者*。系统是如何管理满管道和空管道的呢？\n\
  \n当管道满时，系统在生产者下一次尝试向管道 `write()` 数据时会自动*阻塞*生产者。一旦管道排空，系统会将数据拷贝到管道中，然后允许 `write()`\
  \ 系统调用返回给生产者。\n\n同样，如果管道是空的，消费者会在 `read()` 中阻塞，直到管道中有更多数据可读。（阻塞行为可以关闭；这请见第 9.4.3.5\
  \ 节，“管道和 FIFO 的非阻塞 I/O”，“第 320 页。）\n\n当生产者对管道的写端执行 `close()` 时，消费者可以成功读取管道中仍缓存的任何数据。之后，进一步的\
  \ `read()` 调用将返回 `0`，表示文件结束。\n\n相反，如果消费者关闭了读端，对写端的 `write()` 将失败——而且失败得很严重。特别是，内核会向生产者发送一个“断管道”（broken\
  \ pipe）信号，其默认操作是终止进程。\n\n我们对管道最喜欢的类比是夫妻一起洗碗和晾碗。一方负责洗碗，将干净但湿漉的盘子放在水槽边的沥水架上。另一方从沥水架取出盘子并擦干。洗碗的是生产者，沥水架是管道，擦碗的是消费者。\n\
  \n他们晚餐吃了什么尚未说明。\n\n如果晾碗的一方比洗碗的快，沥水架就会空，擦碗的就必须等待更多盘子可用。相反，如果洗碗的一方更快，沥水架就会满，洗碗的必须等待它排空后才能再放入更多干净的盘子。这在图\
  \ 9.3 中所示。\n\n![Images](img/fig09-003.jpg)\n\n**图 9.3:** 管道进程的同步\n\n我们看到 `ch-processes-pipedemo.c`\
  \ 在单个进程中同时对管道进行写入和读取。这只是为了演示之目的。在实践中，如果你在尝试从管道读取之前向管道写入了太多数据，可能会导致死锁局面。\n\n*死锁*是指双方都想要同一个资源，且双方都在等待对方释放资源的情况。在这里，只有一个参与；如果向管道写入了太多数据，`write()`\
  \ 永远不会返回，因为没有人可以从管道读取数据以清空它。\n\n#### 9.3.2 FIFOs\n\n对于传统的管道，两个独立程序访问同一个管道的唯一方法是通过文件描述符继承。这意味着进程必须是共同父进程的子，或者一个进程必须是另一个进程的祖先。\n\
  \n这可能是一个严重的限制。许多系统服务作为*守护进程*daemons）运行，即断开的长运行进程。需要一种简单的方法向此类进程发送数据（并可能从它们接收数据）。文件并不适合；同步困难或不可能，且无法创建管道来完成这项工作，因为没有共同祖先。\n\
  \n为了解决这个问题，System III 发明了 FIFO 的概念。*FIFO*或*命名管道*named pipe）是文件系统中类似于管道的文件。换句话说，一个进程打开\
  \ FIFO 进行写入，另一个进程打开它进行读取。随后写入 FIFO 的数据由读取者读取。数据由内核缓冲，而不是存储在磁盘上。\n\nFIFO 是“先进先出”（first-in\
  \ first-out）的缩写。这就是管道的工作方式。\n\n考虑一个行打印机池化程序。池化守护进程控制物理打印机，创建逐个打印的打印作业。要向队列添加作业，用户级行打印机软件必须与池化程序通信。实现此点的方法是让池化程序创建一个已知文件名的\
  \ FIFO。用户软件可以打开该 FIFO，向其写入请求并将其关闭。池化程序在循环中运行，从 FIFO 读取请求。\n\n`mkfifo()` 函数创建 FIFO\
  \ 文件：\n\n```\n#include <sys/types.h>\n#include <sys/stat.h>\n\nint mkfifo(const\
  \ char *pathname, mode_t mode);\n```\n\n参数 `pathname` 是要创建的 FIFO 名称，`mode` 是赋予它的权限，类似于\
  \ `creat()` 的第二个参数或 `open()` 的第三个参数（请参见第 4.6 节，“创建文件”，“第 101 页）。FIFO 文件可以像任何其他文件一样通过\
  \ `remove()` 或 `unlink()` 删除（请参见第 5.1.5 节，“文件删除”，“第 118 页）。\n\nGNU/Linux *mkfifo*(3)\
  \ 手页指出，必须同时读写 FIFO 才能进行 I/O：“打开读取 FIFO 通常会阻塞，直到另一个进程打开同一个 FIFO 进行写入，反之亦然。”一旦 FIFO\
  \ 文件被打开，它的作用就像普通管道；也就是说，它只是另一个文件描述符。\n\n`mkfifo` 命令将此系统调用带到了命令行。这使得演示 FIFO 文件的操作变得简单：\n\
  \n```\n$ mkfifo afifo                        创建一个 FIFO 文件\n$ ls -l afifo       \
  \                  显示类型和权限，注意开头的 'p'\nprw-rw-r-- 1 arnold arnold 0 Jan 31 21:08\
  \ afifo\n$ cat < afifo &                       在后台读取\n[1] 22100\n$ echo It was a\
  \ Blustery Day > afifo  向 FIFO 写入数据\nIt was a Blustery Day                 cat 打印数据\n\
  [1]+ Done cat < afifo                 cat 退出\n$                                \
  \     Shell 提示下一个命令\n```\n\n## 9.4 文件描述符管理\n\n\n\n\n到此时，拼图的碎片已已经完成。`fork()` 和 `exec()`\
  \ 创建进程并在其中运行程序。`pipe()` 创建一个可以用于进程间通信（IPC）的管道。目前缺失的是一种方法，将管道的文件描述移动到管道生产者和消费者的标准输出和标准输入位置。\n\
  \n`dup()` 和 `dup2()` 系统调用配合 `close()`，允许你移动（准确地说是复制）一个打开的文件描述符到另一个数字。`fcntl()` 系统调用允许你执行相同的操作，并操作打开文件的若干个重要属性。\n\
  \n### 9.4.1 复制打开的文件：`dup()` 和 `dup2()`\n\n有两个系统调用可以创建打开的文件描述符的副本：\n\n```c\n#include\
  \ <unistd.h>                                               POS\n\nint dup(int oldfd);\n\
  int dup2(int oldfd, int newfd);\n```\n\n这些函数如下：\n\n*   `int dup(int oldfd)`\n  \
  \  返回最小未使用的文件描述符值；它是 `oldfd` 的副本。`dup()` 成功时返回非负整数，失败时返回 –1`。\n\n*   `int dup2(int\
  \ oldfd, int newfd)`\n    使 `newfd` 成为 `oldfd` 的副本；如果 `newfd` 已打开，则先将其关闭，仿佛调用了 `close()`。`dup2()`\
  \ 返回新描述符，如果出现问题则返回 –1`。\n\n记得图 9.1 中，两个进程共享内核文件表中同一个文件条目的指针吗？`dup()` 和 `dup2()`\
  \ 在单个进程内创建相同的情况——参见图 9.4。\n\n![Images](img/fig09-004.jpg)\n\n**图 9.4：** “dup2(1,\
  \ 3)”之后的文件描述符共享\n\n在图中，进程执行了 `dup2(1, 3)`，使文件描述符 `3` 成为标准输出（文件描述符 `1`）的副本。正如之前描述的，这两个描述符共享该打开文件的偏移量。\n\
  \n在第 4.4.2 节“打开和关闭文件,”第 88 页中，我们提到 `open()` 总是为打开的文件返回最小未使用的整数文件描述符值，`creat()` 也是。事实上，几乎所有返回新文件描述符的系统调用都遵循这一规则，而不只是\
  \ `open()` 和 `creat()`。（`dup2()` 是例外，因为它提供获取特定新文件描述符的方法，即使它不是最小未使用的。）\n\n结合“返回最小未使用数字”规则和\
  \ `dup()`，现在很容易将管道的文件描述符移动到标准输入和输出位置。假设当前进程是一个 shell，它需要 fork 两个子进程来建立一个简单的两阶段管道，步骤如下：\n\
  \n1. 使用 `pipe()` 创建管道。必须先执行此步，以便两个子进程可以继承打开的文件描述符。\n2. fork 我们称之为“左侧子进程”的进程。这是标准输出进入管道的进程。在该子进程中，执行以下操作：\n\
  \    1. a. 使用 `close(pipefd[0])`，因为左侧子进程不需要管道的读端。\n    2. b. 使用 `close(1)` 关闭原始的标准输出。\n\
  \    3. c. 使用 `dup(pipefd[1])` 将管道的写端复制到文件描述符 `1`。\n    4. d. 使用 `close(pipefd[1])`，因为我们不需要两个打开的副本。\n\
  \    5. e. Exec 要运行的程序。\n3. fork 我们称之为“右侧子进程”的进程。这是标准输入来自管道的进程。该子进程的步骤是左侧子进程的镜像：\n\
  \    1. a. 使用 `close(pipefd[1])`，因为右侧子进程不需要管道的写端。\n    2. b. 使用 `close(0)` 关闭原始的标准输入。\n\
  \    3. c. 使用 `dup(pipefd[0])` 将管道的读端复制到文件描述符 `0`。\n    4. d. 使用 `close(pipefd[0])`，因为我们不需要两个打开的副本。\n\
  \    5. e. Exec 要运行的程序。\n4. 在父进程中，关闭管道的两端：`close(pipefd[0]); close(pipefd[1])`。\n\
  5. 最后，在父进程中使用 `wait()`（或变体）等待两个子进程结束。\n\n注意关闭管道未使用的文件描述符副本有多重要。正如我们之前指出的，除非该文件的最后一个打开的文件描述符被关闭，否则文件不会被关闭。即使多个进程共享文件描述符也是如此。关闭未使用的文件描述符很重要，因为从管道读取的进程在所有管道副本关闭之前不会收到文件结束指示。\n\
  \n在我们的案例，子进程 fork 之后有三个进程：父进程和两个子进程，每个进程都有文件描述符的副本。父进程关闭了两个端。左侧子进程关闭了管道。右侧子进程从管道读取。当左侧子进程结束时，它会收到文件结束通知，然后也可以退出。\n\
  \n以下程序 `processes-pipeline.c` 创建了等同于以下 shell 的效果：\n\n```c\n#include <stdio.h>\n\
  #include <errno.h>\n#include <stdlib.h>\n#include <sys/types.h>\n#include <sys/wait.h>\n\
  #include <unistd.h>\n\nint pipefd[2];\nextern void left_child(void), right_child(void);\n\
  \n/* main --- fork 子进程，等待它们完成 */\nint main(int argc, char **argv)\n{\n    pid_t\
  \ left_pid, right_pid;\n    pid_t ret;\n    int status;\n\n    if (pipe(pipefd)\
  \ < 0) {      /* 创建管道，最要的事 */\n        perror(\"pipe\");\n        exit(EXIT_FAILURE);\n\
  \    }\n    \n    if ((left_pid = fork()) < 0) { /* fork 左侧子进程 */\n        perror(\"\
  fork\");\n        exit(EXIT_FAILURE);\n    } else if (left_pid == 0)\n        left_child();\n\
  \n    if ((right_pid = fork()) < 0) { /* fork 右侧子进程 */\n        perror(\"fork\"\
  );\n        exit(EXIT_FAILURE);\n    } else if (right_pid == 0)\n        right_child();\n\
  \n    close(pipefd[0]);       /* 关闭父进程的管道副本 */\n    close(pipefd[1]);\n\n    while\
  \ ((ret = wait(&status)) > 0) {    /* 等待子进程 */\n        if (ret == left_pid)\n \
  \           printf(\"left child terminated, status: %x\\n\", status);\n        else\
  \ if (ret == right_pid)\n            printf(\"right child terminated, status: %x\\\
  n\", status);\n        else\n            printf(\"yow! unknown child %d terminated,\
  \ status %x\\n\",\n                    ret, status);\n    }\n\n    return EXIT_SUCCESS;\n\
  }\n```\n\n```bash\n$ echo there | sed s/hi/g\nhello there\n```\n\n\n\n\n```\n57\
  \  /* left_child --- 为左子进程执行工作 */\n58\n59  void\n60  left_child(void)\n61  {\n62\
  \      static char *left_argv[] = { \"echo\", \"hi\", \"there\", NULL };\n63\n64\
  \      close(pipefd[0]);\n65      close(1);\n66      int junk = dup(pipefd[1]);\n\
  67      close(pipefd[1]);\n68\n69      execvp(\"echo\", left_argv);\n70      _exit(errno\
  \ == ENOENT ? 127 : 126);\n71  }\n72\n73  /* right_child --- 为右子进程执行工作 */\n74\n\
  75  void\n76  right_child(void)\n77  {\n78      static char *right_argv[] = { \"\
  sed\", \"s/hi/hello/g\", NULL };\n79\n80      close(pipefd[1]);\n81      close(0);\n\
  82      int junk = dup(pipefd[0]);\n83      close(pipefd[0]);\n84\n85      execvp(\"\
  sed\", right_argv);\n86      _exit(errno == ENOENT ? 127 : 126);\n87  }\n```\n\n\
  第 57–71 行是左子进程的代码。该过程遵循上述步骤：关闭管道中不需要的一端，关闭原始标准输出，通过 `dup()` 将管道的写端重定向到 `1`，然后关闭原始的写端。此时，第\
  \ 69 行调用了 `execvp()`，如果执行失败，第 70 行将调用 `_exit()`。（记住，如果 `execvp()` 执行成功，第 70 行将永远不会执行。）\n\
  \n第 73–87 行对右子进程执行类似的步骤。\n\n在两个函数中（第 66 行和第 82 行），`dup()` 的结果被赋值给变量 `junk`，这是因为在当前系统中，如果\
  \ `dup()` 的返回值没有被使用，编译器会发出警告。在生产程序中，我们应该检查返回值是否判断失败。相反，我们（相当草率地）依赖它返回最低可用的文件描述符数字，分别为\
  \ `1` 或 `0`。\n\n以下是程序运行时发生的情况：\n\n```\n$ ch-processes-pipeline                 \
  \     运行程序\nleft child terminated, status: 0             左子进程在输出之前结束(！)\nhello there\
  \                                  右子进程的输出\nright child terminated, status: 0\n\
  $ ch-processes-pipeline                      再次运行程序\nhello there               \
  \                   右子进程的输出和 …\nright child terminated, status: 0            右子进程在左子进程之前结束\n\
  left child terminated, status: 0\n```\n\n注意，子进程结束的顺序是不确定的。它取决于系统负载以及许多可能影响进程调度的其他因素。在编写创建多个进程的代码（特别是调用\
  \ `wait()` 系列函数的代码）时，你应该小心，避免做出关于顺序的假设。\n\n整个过程在图 9.5 中得到了说明。\n\n![图像](img/fig09-005.jpg)\n\
  \n**图 9.5：** 父进程创建管道\n\n图 9.5-A 描述了父进程创建管道（第 24–27 行）和两个子进程（第 29–39 行）之后的情况。\n\n\
  图 9.5-B 显示了父进程关闭管道（第 41–42 行）并开始等待子进程（第 44–52 行）之后的情况。每个子进程已将管道移动到标准输出（左子进程，第 64–67\
  \ 行）和标准输入（右子进程，第 80–83 行）。\n\n最后，图 9.5-C 描述了子进程关闭原始管道（第 64 和 80 行）并调用 `execvp()`（第\
  \ 69 和 85 行）之后的情况。\n\n### 9.4.2 创建非线性管道：`/dev/fd/XX` \n\n许多现代 Unix 系统（包括 GNU/Linux）支持\
  \ `/dev/fd` 目录下的特殊文件。这些文件代表打开的文件描述符，名称如 `/dev/fd/0`、`/dev/fd/1` 等。将此类名称传递给 `open()`\
  \ 会返回一个新的文件描述符，其实际上等同于对给定的文件描述符调用 `dup()`。\n\n在 GNU/Linux 系统上，`/dev/fd` 是指向 `/proc/self/fd`\
  \ 的符号链接，但由于 `/dev/fd` 是这些特殊文件的常用位置，因此你应该在代码中使用它。\n\n这些特殊文件在 Shell 层级有用：至少 Bash、`ksh88`（某些版本）和\
  \ `ksh93` Shell 提供了一种名为*进程替换*（process substitution）的功能，这使得创建*非线性*管道成为可能。Shell 层的表示法对于输入管道使用\
  \ `<<(...)`，输出管道使用 `>(...)`。例如，假设你想将 `diff` 命令应用于两个命令的输出。你通常需要使用临时文件：\n\n```\ncommand1\
  \ > /tmp/out.$$.1\ncommand2 > /tmp/out.$$.2\ndiff /tmp/out.$$.1 /tmp/out.$$.2\n\
  rm /tmp/out.$$.1 /tmp/out.$$.2\n```\n\n使用进程替换，看起来像这样：\n\n```\ndiff <(command1) <(command2)\n\
  ```\n\n不需要记住清理杂乱的临时文件。例如，以下命令显示在我们的系统中，`/bin` 是指向 `/usr/bin` 的符号链接：\n\n```\n$ cd\
  \ /bin\n$ diff <(pwd) <(/bin/pwd)\n1c1\n< /bin\n---\n> /usr/bin\n```\n\n简单的 `pwd`\
  \ 是 Shell 内置的：它打印由 Shell 通过 `cd` 管理的当前逻辑路径。`/bin/pwd` 程序通过物理文件系统遍历来打印路径。\n\n进程替换是如何工作的？Shell\
  \ 创建了子命令（`pwd` 和 `/bin/pwd`）。每个命令的输出都连接到管道上，读端在主进程（`diff`）的一个新文件描述符上打开。然后 Shell\
  \ 将 `/dev/fd` 中的*文件名称*作为命令行参数传递给主进程。我们可以通过开启 Shell 中的执行跟踪来看到这一点：\n\n```\n$ set -x\
  \                                开启执行跟踪\n$ diff <(pwd) <(/bin/pwd)             \
  \  运行命令\n++ pwd                                  Shell 跟踪：子程序\n+ diff /dev/fd/63\
  \ /dev/fd/62            Shell 跟踪：主程序，注意参数\n++ /bin/pwd                         \
  \    Shell 跟踪：子程序\n1c1                                     diff 的输出\n< /bin\n---\n\
  > /usr/bin\n```\n\n这在图 9.6 中得到了说明。\n\n![图像](img/fig09-006.jpg)\n\n**图 9.6：** 进程替换\n\
  \n如果你的系统有 `/dev/fd`，你可能也可以利用这一功能。不过，请务必小心记录你正在操作的内容。C 层级的文件描述符操作比相应的 Shell 操作不透明得多！\n\
  \n顺带提一下，如果 `/dev/fd` 不可用，Bash Shell 会使用 FIFO。因此，如果 Bash 是你的 Shell，你可以在任何符合 POSIX\
  \ 标准的系统上使用进程替换。\n\n### 9.4.3 管理文件属性：`fcntl()`\n\n`fcntl()`（文件控制）系统调用提供了对文件描述符本身或底层打开文件的杂属性的控制。GNU/Linux\
  \ `fcntl`(2) 手页如下描述：\n\n```\n#include <unistd.h>                               \
  \               POSIX\n#include <fcntl.h>\n\nint fcntl(int fd, int cmd, ... /* arg\
  \ */);\n```\n\n换句话说，它接受两个参数；根据第二个参数，它可能接受额外的参数。\n\n该系统调用还用于应用和移除锁。然而，文件锁定本身就是一个很大的课题；我们将讨论推迟到第\
  \ 16.2 节“锁定文件。\n\n#### 9.4.3.1 Close-on-Exec 和 Close-on-Fork 标志\n\n在 `fork()` 之后和\
  \ `exec()` 之前，你应该确保新程序只继承它需要的打开文件。你不希望子进程干扰父进程的打开文件，除非它应该这样做。反之，如果父进程打开了大量文件，这将人为限制子进程可以打开的新文件数量。（参见侧边栏“来自\
  \ `gawk` 的 Close-on-Exec 战故事,”页 318。）\n\n\n\n\n从组织结构来说，这种行为可能会带来问题。你的程序中启动新子进程的部分并不特别需要访问程序中处理打开文件的其他部分。像下面这样的循环是非常痛苦的，因为可能根本没有额外的已打开文件：\n\
  \n```c\nint j;\n\nfor (j = getdtablesize(); j >= 3; j--)    /* 关闭 0, 1, 2 以外的所有\
  \ */\n    (void) close(j);\n```\n\n解决方案是 `close-on-exec flag`（执行时关闭标志位）。它是`文件描述符本身`的属性，而不是底层的打开文件。当设置此标志位时，系统会在进程执行\
  \ `exec` 时自动关闭文件。通过在打开文件时立即设置此标志位，你就不需要担心任何子进程意外地继承它。（`Bash` 壳会自动为它自己使用的所有文件描述符设置此标志位。）\n\
  \n在 Unix、`GNU/Linux` 和 POSIX 存在的大部分时间内，设置 close-on-exec 标志位的唯一方法是使用 `fcntl()`，这正是我们正要讨论的内容。但我们注意到，最近你也可以在打开文件时通过向\
  \ `open()` 传递 `O_CLOEXEC` 标志来设置该标志（参见第 4.6.节，“重温 `open()`,”第 104 页]）。\n\n回到 `fcntl()`，`cmd`\
  \ 参数有两个与文件描述符标志位相关的值：\n\n*   `F_GETFD`\n    获取文件描述符标志位。返回值为所有文件描述符标志位的设置，错误时返回 `-1`。\n\
  *   `F_SETFD`\n    将文件描述符标志位设置为 `arg`（第三个参数）中的值。成功时返回 `0`，错误时返回 `-1`。\n\n多年来，只定义了一个文件描述符标志位：`FD_CLOEXEC`。这个符号常量是\
  \ POSIX 的发明，大多数代码直接使用 `1` 或 `0`：\n\nPOSIX 标准故意没有给它赋值。然而，为了让旧代码继续工作，任何实现可以合理使用的唯一值就是\
  \ `1`。\n\n```c\nif (fcntl(fd, F_SETFD, 1) < 0) ...  /* 尝试设置 close-on-exec，处理任何错误\
  \ */\n\nif (fcntl(fd, F_GETFD) == 1) ...    /* close-on-exec 标志已设置 */\n```\n\n然而，POSIX\
  \ 定义允许额外的标志位，因此编写此类代码的正确方式如下：\n\n```c\nint fd;\nlong fd_flags;\n\nif ((fd_flags\
  \ = fcntl(fd, F_GETFD)) < 0)              /* 获取标志 */\n    /* 处理错误 */\n\nfd_flags\
  \ |= FD_CLOEXEC;                               添加 close-on-exec 标志\nif (fcntl(fd,\
  \ F_SETFD, fd_flags) < 0)                 设置标志\n    /* 处理错误 */\n```\n\n2024 版 POSIX\
  \ 标准引入了一个额外的标志位 `FD_CLOFORK`。在父进程中标记了此标志位的文件描述符在调用 `fork()` 后会在子进程中关闭。它与 close-on-exec\
  \ 标志位的相似之处在于，它也可以通过 `open()` 使用 `O_CLOFORK` 设置，正如我们即将看到的，在许多其他方面也是如此。\n\n为了在文件描述符产生的同时设置\
  \ close-on-exec 和 close-on-fork 标志，POSIX 增加了许多系统调用以及这些系统调用的标志。换句话说，文件描述符的创建（通过 `open()`\
  \ 或 `dup()`）和设置标志变成了一个*原子性*操作。这在多线程程序中非常重要，其中一个线程可能正在打开一个文件，而在它设置其中一个标志位之前，另一个线程就会执行\
  \ `fork` 或 `exec`，从而将打开的文件描述符“泄漏”到新进程或程序中。（这又是一个竞态条件实例。）\n\n考虑到这一点，更容易理解为什么我们即将看到的各种标志位和\
  \ `fcntl()` 命令是存在且合逻辑的。\n\n### 注意\n\nclose-on-exec 和 close-on-fork 标志是`描述符`的属性，而不是底层的`file`。因此，通过\
  \ `dup()` 或 `dup2()`（或通过其他方式）返回的新描述符不会继承原始描述符的这些设置。如果你想在创建时设置 close-on-exec 或 close-on-fork\
  \ 标志，你必须手动设置。系统会在进程执行 `exec` 时自动为你关闭它们。\n\n\n\n\n\n```\nint fd_flags;\n\nif ((fd_flags\
  \ = fcntl(fd, F_GETFL)) < 0)\n    /* handle error */\n\nif ((fd_flags & O_NONBLOCK)\
  \ != 0) {            /* Nonblocking flag is set */\n    fd_flags &= ~O_NONBLOCK;\
  \                   /* Clear it */\n    if (fcntl(fd, F_SETFL, fd_flags) != 0) \
  \    /* Give kernel new value */\n        /* handle error */\n}\n```\n\n除了模式本身，`O_ACCMODE`\
  \ 符号常量是一个 `mask`（掩码），你可以用它从返回值中获取文件访问模式：\n\n```\nfd_flags = fcntl(fd, F_GETFL);\n\
  \nswitch (fd_flags & O_ACCMODE) {\ncase O_RDONLY:\n    … 只读操作 …\n    break;\ncase\
  \ O_WRONLY:\n    … 仅写操作 …\n    break;\ncase O_RDWR:\n    … 读写操作 …\n    break;\n\
  }\n```\n\nPOSIX 要求 `O_RDONLY`、`O_RDWR` 和 `O_WRONLY` 在位上是彼此不同的；因此，像刚才所示的代码保证可以工作，并且是判断任意文件描述符如何打开的简单方法。\n\
  \n通过使用 `F_SETFL` 你也可以更改这些模式，尽管权限检查仍然有效。根据 GNU/Linux `fcntl(2)` 手页，你只能更改 `O_APPEND`、`O_ASYNC`、`O_DIRECT`、`O_NOATIME`\
  \ 和 `O_NONBLOCK` 标志。你不能更改 `O_DSYNC` 和 `O_SYNC` 标志。\n\n### 9.4.3.5 管道和 FIFO 的非阻塞\
  \ I/O\n\n之前，我们使用了两个洗碗和干碗的人的比喻，并使用碗架来描述管道的工作方式：当碗架满时，洗碗的人停止；当它排空时，干碗的人停止。这就是 `blocking`（阻塞）行为：\
  \ 生产者或消费者在 `write()` 或 `read()` 调用中阻塞，等待管道中有更多空间或等待有更多数据进入。\n\n在现实世界中，一个等待碗架排空或填满的人不会只是呆立不动。相反，空闲的人会去寻找其他厨房任务来做（例如扫掉地板上孩子们留下的碎屑），直到碗架再次准备就绪。\n\
  \n好了，我们忽略了两个配夫妻可能想聊天并享受彼此相处的想法。\n\n在 Unix/POSIX 术语中，这种概念被称为 `nonblocking I/O`（非阻塞\
  \ I/O）。也就是说，请求的 I/O 要么完成，要么返回一个错误值，表示没有数据（对于读取者）或没有空间（对于写入者）。非阻塞 I/O 应用于管道和 FIFO，而不适用于普通磁盘文件。它也可以应用于某些设备，例如终端（这出了本书的范围），以及网络连接。\n\
  \n`O_NONBLOCK` 标志可以与 `open()` 使用来指定非阻塞 I/O，并可以通过 `fcntl()` 设置或清除。对于 `open()` 和 `read()`，非阻塞\
  \ I/O 是直观的。\n\n设置或未设置 `O_NONBLOCK` 打开 FIFO 会显示出以下行为：\n\n*   `open(\"/fifo/file\"\
  , O_RDONLY, mode)`\n    阻塞直到 FIFO 被以写打开。\n\n*   `open(\"/fifo/file\", O_RDONLY|O_NONBLOCK,\
  \ mode)`\n    打开文件并立即返回。\n\n*   `open(\"/fifo/file\", O_WRONLY, mode)`\n    阻塞直到\
  \ FIFO 被以读打开。\n\n*   `open(\"/fifo/file\", O_WRONLY|O_NONBLOCK, mode)`\n    如果 FIFO\
  \ 已经以读打开，则打开 FIFO 并立即返回。否则，返回错误（返回 `–1` 且 `errno` 设置为 `ENXIO`）。\n\n正如普通管道所示，对一个不再以写打开的\
  \ FIFO 进行 `read()` 将返回文件结束（返回值为 `0`）。在这种情况下，`O_NONBLOCK` 标志是无关的。对于`空`管道或 FIFO，情况变得更有趣——一个仍然以写方式打开但没有数据的管道：\n\
  \n*   `read(fd, buf, count),` 且 `O_NONBLOCK` 未设置\n    `read()` 阻塞直到有更多数据进入管道或 FIFO。\n\
  \n*   `read(fd, buf, count),` 且 `O_NONBLOCK` 已设置\n    `read()` 立即返回 `–1`，并将 `errno`\
  \ 设置为 `EAGAIN`。\n\n最后，`write()` 的行为更为复杂。为了讨论它，我们必须首先引入 `原子写入`（atomic write）的概念。原子写入是指所有请求的数据都一起写入，而不会与其他写入的数据交织在一起。POSIX\
  \ 在 `<limits.h>` 中定义了常量 `PIPE_BUF`。根据我们稍后将涉及的细节，向管道或 FIFO 写入小于或等于 `PIPE_BUF` 字节的数据要么成功，要么阻塞。`PIPE_BUF`\
  \ 的最小值为 `_POSIX_PIPE_BUF`，其值为为 `512`。`PIPE_BUF` 本身可以更大；当前的 GLIBC 系统将其定义为 `4096`，但在任何情况下，你都应该使用符号常量，而不要期望\
  \ `PIPE_BUF` 在不同系统上具有相同的值。\n\n在所有情况下，对于管道和 FIFO，`write()` 都将数据附加到管道末尾。这是由于管道没有文件偏移量：它们是不可寻的（not\
  \ seekable）。\n\n同样在所有情况下，如所述，多达 `PIPE_BUF` 的写入都是原子的：数据不会与其他写入的数据交织在一起。超过 `PIPE_BUF`\
  \ 字节的写入数据可能会在*任意边界*与其他写入的数据交织。最后意味着你*不能*期望大量数据的每个 `PIPE_BUF` 子块都是原子化写入的。`O_NONBLOCK`\
  \ 的设置不影响这条规则。\n\n与 `read()` 一样，当 `O_NONBLOCK` 未设置时，`write()` 会阻塞直到所有数据写入完毕。\n\n\
  当设置 `O_NONBLOCK` 时，情况最为复杂。对于管道或 FIFO，行为如下：\n\n| | **space** ≥ **nbytes** | **space\
  \ < nbytes** |\n| --- | --- | --- |\n| `nbytes` ≤ `PIPE_BUF` | `write()` 成功 | `write()`\
  \ 返回 `–1`/`EAGAIN` |\n| | | |\n| | | **space > 0** | **space = 0** |\n| `nbytes`\
  \ > `PIPE_BUF` | `write()` 尽可能写入 | `write()` 返回 `–1`/`EAGAIN` |\n\n对于非管道非 FIFO 但可以应用\
  \ `O_NONBLOCK` 的文件，行为如下：\n\n| space > 0 | `write()` 尽可能写入 |\n| space = 0 | `write()`\
  \ 返回 `–1`/`EAGAIN` |\n\n对于管道或 FIFO，无论 `O_NONBLOCK` 设置还是未设置，规则旨在使编程直观：\n\n*   文件结束总是可区分的：`read()`\
  \ 返回零。\n*   如果没有数据可读，`read()` 要么成功或返回“无数据”指示：`–1` 和 `EAGAIN`，意味着“稍后再试”。\n*   如果没有空间写入数据，`write()`\
  \ 将阻塞直到成功（`O_NONBLOCK` 未设置）或返回“现在无空间”错误：`EAGAIN`。\n\n总结来说，如果你打算使用非阻塞 I/O，任何使用 `write()`\
  \ 的代码都必须处理短写（short write），即写入量少于请求量。健壮的代码应该这样写：即使对于普通文件，磁盘也可能满导致 `write()` 只部分成功。\n\
  \n此外，你应该准备好处理 `EAGAIN`，理解在这种情况下 `write()` 失败并不一定是致命错误。对于使用非阻塞 I/O 读取的代码同样如此：意识到\
  \ `EAGAIN` 在这里也不是致命的。（尽管可能需要计算一下这种情况发生的次数，并在次数过多时放弃。）\n\n非阻塞 I/O 确实让你的生活变得复杂，毫无疑问。但对于许多应用程序来说，它是让你能够完成工作的必要条件。再次考虑打印队列处理程序。打印守护进程无法在提交输入作业的\
  \ FIFO 文件上进行阻塞的 `read()`。它必须能够监控运行中的作业，并可能定期检查打印设备的状态（例如，确保它们有纸或没有卡纸）。\n\n### 9.4.3.6\
  \ `fcntl()` 总结\n\n`fcntl()` 系统调用在表 9.6 中摘要。\n\n| **cmd value** | **arg value** |\
  \ **返回值** |\n| --- | --- | --- |\n| `F_DUPFD` | 最低新描述符 | `fd` 参数的副本。 |\n\n\n\n\n\
  \n| `F_DUPFD_CLOEXEC` | 最低新描述符 | `fd` 参数的副本，并设置了 `close-on-exec`。 |\n| `F_DUPFD_CLOFORK`\
  \ | 最低新描述符 | `fd` 参数的副本，并设置了 `close-on-fork`。2024 年 POSIX 标准新增。 |\n| `F_GETFD` |\
  \  | 获取文件描述符标记（close-on-exec, close-on-fork）。 |\n| `F_SETFD` | 新标记位值 | 设置文件描述符标记（close-on-exec,\
  \ close-on-fork）。 |\n| `F_GETFL` |  | 获取底层文件的标记。 |\n| `F_SETFL` | 新标记位值 | 设置底层文件的标记。\
  \ |\n\n#### 表 9.6: `fcntl()` 总结\n\n当复制文件描述符时，会复制文件创建、状态和访问标记。但 `close-on-exec` 和\
  \ `close-on-fork` 标记则不会被复制。\n\n## 9.5 示例：`gawk` 中的双向管道\n\n*双向管道*（two-way pipe）双向连接两个进程。通常情况下，对于至少一个进程，其标准输入和标准输出都设置为指向另一个进程的管道。Korn\
  \ shell（`ksh`）在语言层面引入了双向管道，并称之为*协进程*（coprocess）：\n\n```\ndatabase engine command\
  \ and arguments |&             在后台启动协进程\nprint -p \" database command \"       \
  \                 写入协进程\nread -p db_response                                  从协进程读取\n\
  ```\n\n在这里，*database engine* 代表任何可以被前端程序（在本例中为 `ksh` 脚本）驱动的后端程序。*database engine*的标准输入和标准输出通过两个独立的单向管道连接到\
  \ shell。这如图 9.7 所示。\n\n一次时间只有一个默认协进程（可以通过 `read -p` 和 `print -p` 访问）。shell 脚本可以使用\
  \ `exec` 命令配合特殊的重定向符号，将协进程的文件描述符移动到特定的数字。一旦完成操作，就可以启动另一个协进程。Bash 拥有相当更复杂的协进程机制，但语法不同。\n\
  \n![Images](img/fig09-007.jpg)\n\n**图 9.7:** Korn shell 协进程\n\n在标准 `awk` 中，指向或来自子进程的管道是单向的：没有办法向程序发送数据并读取其响应——你必须使用临时文件。GNU\
  \ `awk` (`gawk`）借用了 `ksh` 的 `|&` 符号来扩展 `awk` 语言：\n\n```\nprint \" a command \" |&\
  \ \" database engine \"                 启动协进程并向写入\n\" database engine \" |& getline\
  \ db_response                 从协进程读取\n```\n\n`gawk` 也对 TCP/IP 套接使用 `|&` 符号（参见第 14\
  \ 章，“Sockets 和基础网络”，第 473 页）。以下来自 `gawk` 5.3.0 分发版中 `io.c` 的代码是 `two_way_open()`\
  \ 函数用于设置简单协进程的部分：它创建了两个管道，派生了子进程并执行了所有的文件描述符操作。我们省略了一些无关的代码（该函数比本该有的大）：\n\n```c\n\
  2164  static int\n2165  two_way_open(const char *str, struct redirect *rp, int extfd)\n\
  2166  {\n         ...\n2357      /* case 4: 通向子进程的双向管道 */\n2358      {\n2359   \
  \   int ptoc[2], ctop[2];\n2360      int pid;\n2361      int save_errno;\n     \
  \    ...\n2367      if (pipe(ptoc) < 0)\n2368          return false;  /* 设置 errno，来自调用者的诊断\
  \ */\n2369\n2370      if (pipe(ctop) < 0) {\n2371          save_errno = errno;\n\
  2372          close(ptoc[0]);\n2373          close(ptoc[1]);\n2374          errno\
  \ = save_errno;\n2375          return false;\n2376      }\n```\n\n第一步是创建两个管道。`ptoc`\
  \ 是“父进程到子”，`ctop` 是“子进程到父进程”。在阅读代码时请记住，索引 `0` 是读端，索引 `1` 是写端。\n\n第 2367–2368 行创建第一个管道\
  \ `ptoc`。第 2370–2376 行创建第二个管道，如果失败则关闭第一个。这非常重要。未能关闭打开但未使用的管道会导致*文件描述符泄漏*（file descriptor\
  \ leaks）。就像内存一样，文件描述符是有限的资源，一旦用完它们就消失了。打开的文件也是如此：确保你的所有错误处理代码在发生故障时，总是关闭你不再需要的任何打开的文件或管道。\n\
  \n显然，你可以关闭它们。但如果你不知道它们是打开状态，那么它们的丢失就和通过内存泄漏丢失内存一样有效。\n\n`save_errno` 保存了 `pipe()`\
  \ 设置的 `errno` 值，以防 `close()` 可能会失败（第 2371 行）。随后 `errno` 在第 2374 行被恢复。代码继续执行：\n\n\
  ```c\n2452     if ((pid = fork()) < 0) {\n2453         save_errno = errno;\n2454\
  \         close(ptoc[0]); close(ptoc[1]);\n2455         close(ctop[0]); close(ctop[1]);\n\
  2456         errno = save_errno;\n2457         return false;\n2458     }\n```\n\n\
  第 2452–2458 行派生子进程，这次如果 `fork()` 失败，则关闭两个管道。在这里同样保存并恢复了原始 `errno` 值，以便稍后生成诊断。\n\n\
  第 2460–2478 行处理子进程的代码，每一步都有适当的错误检查和消息：\n\n```c\n2460     if (pid == 0) { /* 子进程\
  \ */\n2461         if (close(1) == -1)\n2462             fatal(_(\"子进程关闭 stdout\
  \ failed: %s\"),\n2463                 strerror(errno));\n2464         if (dup(ctop[1])\
  \ != 1)\n2465             fatal(_(\"子进程移动管道到 stdout failed (dup: %s)\"), strerror(errno));\n\
  2466         if (close(0) == -1)\n2467             fatal(_(\"子进程关闭 stdin failed:\
  \ %s\"),\n2468                 strerror(errno));\n2469         if (dup(ptoc[0])\
  \ != 0)\n2470             fatal(_(\"子进程移动管道到 stdin failed (dup: %s)\"), strerror(errno));\n\
  2471         if (  close(ptoc[0]) == -1 || close(ptoc[1]) == -1\n2472          \
  \   || close(ctop[0]) == -1 || close(ctop[1]) == -1)\n2473             fatal(_(\"\
  关闭管道 failed: %s\"), strerror(errno));\n2474         /* stderr 不会被复制到子进程的 stdout\
  \ */\n2475         set_sigpipe_to_default();\n2476         execl(\"/bin/sh\", \"\
  sh\", \"-c\", str, NULL);\n2477         _exit(errno == ENOENT ? 127 : 126);\n2478\
