  5. e. 拒绝根据商标法授予某些贸易名称、商标或服务标志的使用；或\n6. f. 要求传输该材料（或其修改版本）的人在接收者承担合同责任时，对该材料的许可方和作者进行赔偿，以补偿这些合同假设直接施加许可方和作者的责任。\n\
