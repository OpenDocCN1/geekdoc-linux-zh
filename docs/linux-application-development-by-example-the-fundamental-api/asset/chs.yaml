  \n[content]\n事实是，你并不想知道这些细节。作为应用程序开发者，你不应该也不需要担心这些问题；让功能运行由库的实现者负责。你的工作是理解概念并让代码使用适当的函数，例如\
  \ `strcoll()`（参见第 15.2.3 节，“字符串排序：`strcoll()` 和 `strxfrm()`](#ch15.xhtml_ch15lev2sec3)，“第\
  \ 512 页）。\n\nGLIBC 系统提供了优秀的本地化支持，包括一组感知多字节的正则表达式匹配例程。例如， POSIX 扩展正则表达式 `[[:alpha:]][[:alnum:]]+`\
  \ 匹配一个字母后跟一个或多个字母或数字。哪些字符属于这些类别的定义取决于区域设置（locale）。例如，此正则表达式会匹配两个字符‘eè’，而传统的 Unix\
  \ ASCII 导向的正则表达式 `[a-zA-Z][a-A-Zz0-9]+` 则可能无法匹配。POSIX 字符类列在表 15.6 中。\n\n| 类名 | 匹配\
  \ |\n| --- | --- |\n| `[:alnum:]` | 字母数字字符。 |\n| `[:alpha:]` | 字母字符。 |\n| `[:blank:]`\
  \ | 空格和制表符字符。 |\n| `[:cntrl:]` | 控制字符。 |\n| `[:digit:]` | 数字字符。 |\n| `[:graph:]`\
  \ | 同时可打印且可见的字符。（换行可打印但不可见，而 `$` 则两者皆是。） |\n| `[:lower:]` | 小写字母。 |\n| `[:print:]`\
  \ | 可打印字符（非控制字符）。 |\n| `[:punct:]` | 标点符号（非字母、数字、控制字符或空格字符）。 |\n| `[:space:]` |\
  \ 空格字符（如空格、制表符、换行等）。 |\n| `[:upper:]` | 大写字母。 |\n| `[:xdigit:]` | 集合 `abcdefABCDEF0123456789`\
  \ 中的字符。 |\n\n**表 15.6: POSIX 正则表达式字符类**\n\n### 15.4.6 结论\n\n世界已变成一个“地球村”，软件作者和供应商不能局限于区域一角。因此，意识到国际化问题和字符集问题，并使你的代码实现国际化和本地化是非常有价值的。\n\
  \n## 15.5 建议阅读\n\n1. *C: A Reference Manual*, 第 5 版，作者为 Samuel P. Harbison III 和\
  \ Guy L. Steele, Jr.，Pearson, 2002. ISBN-13: 978-0-13-089592-9。\n   我们之前提到过这本书。它对\
  \ C 标准库中多字节和宽字符设施的演变和使用提供了简洁且易懂的描述。这在支持 C99 及更新版本的系统上特别有价值，因为库为了 1999 年 C 标准进行了显著增强。\n\
  \n2. *GNU gettext tools*, 作者为 Ulrich Drepper, Jim Meyering, François Pinard 和 Bruno\
  \ Haible。这是 GNU `gettext` 的手册。在 GNU/Linux 系统上，你可以通过 `info gettext` 查看本地副本。手册可以在在线找到：`https://www.gnu.org/software/gettext/manual/`。该网站也提供可打印的\
  \ PDF 版本。\n\n## 15.6 总结\n\n* 程序的国际化和本地化属于*母语语言支持*的大范畴。`i18n`、`l10n` 是这些缩写。 意识到国际化问题和字符集问题，并使你的代码实现国际化和本地化是非常值得的。\n\
  * Program internationalization and localization fall under the general heading of\
  \ *native language support*. `i18n`, `l10n`, ... (此处省略后续重复内容)\n\n\n\n本章描述了几个扩展 API。这里的\
  \ API 在性质上与书中之前描述的相似，或者提供了额外的功能。其中某些内容在涵盖了前提主题之前是无法讨论的。\n\n这里的陈述顺序与书的前半部分章节顺序并行。除外，这些主题之间没有其他关系。我们涵盖了以下主题：动态分配对齐的内存；文件锁；一组适用于亚秒级时间值的调用；以及一组用于存储和检索任意数据值的更高级函数\
  \ set。除非另有说明，本章中的所有 API 均包含在 POSIX 标准中。\n\n## 16.1 分配对齐内存：`posix_memalign()` 和 `memalign()`\n\
  \n对于大多数任务，标准的分配例程——`malloc()`、`realloc()` 等——就足够了。不过，有时你可能需要以特定方式**对齐**（aligned））的内存。换句话说，第一个分配字节的地址是某个数字的倍数。（例如，在某些系统上，向字对齐的缓冲区进行出的内存拷贝要快得多。）有两个函数提供此服务：\n\
  \n```\n#include <stdlib.h>\n\nint posix_memalign(void **memptr, size_t alignment,\
  \ size_t size);    POSIX ADV\nvoid *memalign(size_t boundary, size_t size);    \
  \                    Common\n```\n\n`posix_memalign()` 是一个较新的函数；它是另一个可选扩展——“建议性信息”（ADV）扩展的一部分。该函数的工作方式与其他大多数\
  \ Linux 分配 API 不同。当出现问题时它并不返回 `-1`。相反，成功时返回 `0`，失败时返回 `errno` 值。参数如下：\n\n*   `void\
  \ **memptr`\n\n    一个指向 `void *` 变量的指针。所指向的变量将存入已分配存储的地址。\n\n*   `size_t alignment`\n\
  \n    所需的对齐方式。它必须是 `sizeof(void *)` 的倍数且 2 的幂。\n\n*   `size_t size`\n\n    要分配的字节数。\n\
  \n由 `posix_memalign()` 分配的存储可以使用 `realloc()` 修改并用 `free()` 释放。\n\n`memalign()` 是非标准但广泛提供的函数，工作原理类似。失败时返回\
  \ `NULL`，成功时返回请求的存储空间，其中 `boundary`（2 的幂）表示对齐方式，`size` 表示请求的内存量。\n\n传统上，用 `memalign()`\
  \ 分配的存储不能用 `free()` 释放，因为 `memalign()` 使用 `malloc()` 分配存储并返回该存储中某个适当对齐字节的指针。GLIBC\
  \ 版本没有这个问题。在这两个函数中，如果有 `posix_memalign()`，你应该使用它。\n\n## 16.2 锁定文件\n\n现代 Unix 系统（包括\
  \ GNU/Linux）允许你对文件的部分或全部进行读写锁定。与在 V7 之后开发的 Unix API 的许多其他部分一样，有多种相互冲突的方法来执行文件锁定。本节涵盖了这些可能性。\n\
  \n### 16.2.1 文件锁概念\n\n正如你家门上的锁防止不受欢迎的人进入家中一样，文件上的 `lock`（锁）防止对文件内数据的访问。文件锁是在 V7\
  \ 开发（所有现代 Unix 系统均源于此）之后添加到 Unix 中的，因此在一段时间内，不同的 Unix 系统上存在并使用了多种相互冲突的文件锁机制。BSD\
  \ Unix 和 System V 都有它们互不兼容的锁定调用。最终，POSIX 形式化了 System V 的文件锁方法。幸运的是，System V 和 BSD\
  \ 之间的调用名称不同，因此 GNU/Linux 为了兼顾所有人，支持这两种锁。\n\n表 16.1 总结了不同类型的锁。\n\n| 源 | 函数 | 记录 |\
  \ 整个文件 | 读写 | 建议 | 强制 |\n| --- | --- | --- | --- | --- | --- | --- |\n| BSD | `flock()`\
  \ | | ✓ | ✓ | ✓ | |\n| POSIX | `fcntl()` | ✓ | ✓ | ✓ | ✓ | 不再使用 |\n| POSIX | `lockf()`\
  \ | ✓ | ✓ | ✓ | ✓ | 不再使用 |\n\n**表 16.1:** 文件锁定函数\n\n锁定有多个方面，如下：\n\n*   `Record locking`（记录锁）\n\
  \n    记录锁是对文件部分区域锁定。由于 Unix 文件只是字节流，使用 `range lock`（范围锁）术语会更准确，因为锁是针对一个字节范围的。尽管如此，`record\
  \ lock` 术语仍常用。\n\n*   `Whole-file locking`（全文件锁定）\n\n    全文件锁顾如名，会锁定整个文件，即使在持有锁期间其大小发生了变化。BSD\
  \ 接口仅提供全文件锁定。要使用 POSIX 接口锁定整个文件，请指定长度为零。这被特殊处理为意味着“整个文件”。\n\n*   `Read locking`（读锁）\n\
  \n    读锁防止对正在读取的区域进行写入。一个文件可以有多个读锁，甚至可以在文件的同一区域，且它们互不干扰，因为数据只是被访问而没有被修改。\n\n*  \
  \ `Write locking`（写锁）\n\n    写锁为正在写入的区域提供排除访问。如果该区域被读锁阻塞，则尝试获取写锁将阻塞或失败，取决于锁请求的。一旦获取了写锁，尝试获取读锁将失败。\n\
  \n*   `Advisory locking`（建议性锁定）\n\n    建议性锁与你的门锁非常相似。人们说“锁能让诚实的人保持诚实”，这意味着如果有人真的想闯入你的房子，他们可能会找到办法，尽管大门上装了锁。建议性锁也是如此；它只在所有尝试访问锁定文件的程序都先尝试获取锁时起作用。然而，程序可能完全忽略任何建议性锁并对文件随心所欲的操作（当然，前提是文件权限允许）。\n\
  \n*   `Mandatory locking`（强制锁定）\n\n    强制锁是更强形式的锁：当强制锁生效时，没有其他进程可以访问被锁的文件。任何尝试忽略锁的进程要么阻塞直到锁可用，要么其操作将失败。\n\
  \n建议性锁定对于共享私有文件的协作程序是足够的，当不预计有其他应用程序使用该文件时（例如，我们在第 11.1.2 节 中提到的多人游戏共享得分文件，“Setuid\
  \ and Setgid Bits`,”page 384）。强制锁定对于避免文件冲突至关重要的情况可能是必要的，例如在数据库系统中。POSIX 只标准化建议性锁定。强制锁定在许多商业\
  \ Unix 系统上可用，但细节各异。它曾在 GNU/Linux 上是默认启用的，但后来已被移除。我们将在本节稍后部分讨论这一点。如果你感兴趣，POSIX 标准中\
  \ `fcntl()` 条目的“理由”部分提供了为什么不标准化强制锁定的几个原因。\n\n### 16.2.2 POSIX 锁定：`fcntl()` 和 `lockf()`\n\
  \n`fcntl()`（文件控制）系统调用用于文件锁定。（`fcntl()` 的其他用途已在第 9.4.3 节,“管理文件属性：`fcntl()`](ch09.xhtml_ch09lev2sec14),”page\
  \ 315）。）它的声明如下：\n\n```\n#include <unistd.h>                                    \
  \        POSIX\n#include <fcntl.h>\nint fcntl(int fd, int cmd);                \
  \          与文件锁定无关\nint fcntl(int fd, int cmd, long arg);                与文件锁定无关\n\
  int fcntl(int fd, int cmd, struct flock *lock);\n```\n\n参数如下：\n\n*   `fd`\n\n  \
  \  打开文件的文件描述符。\n\n*   `cmd`\n\n\n\n\n在 `<fcntl.h>` 中定义的符号常量之一。这些将在在本节稍后进行详细介绍。\n\
  \n*   `lock`\n\n指向 `struct flock` 的指针，用于描述请求的锁。\n\n### 16.2.2.1 描述锁\n\n在查看如何获取锁之前，让我们看看如何向操作系统描述锁。你通过\
  \ `struct flock` 结构体来实现，它描述了要锁的字节范围以及请求的锁类型。POSIX 标准规定 `struct flock` 包含“至少”某些成员。这允许实现在需要时提供额外的结构成员。根据\
  \ `fcntl(3)` 手册页（经过稍作编辑）：\n\n```\nstruct flock {\n    ...\n    short l_type;   \
  \    锁的类型: F_RDLCK, F_WRLCK, F_UNLCK\n    short l_whence;     如何解释 l_start: SEEK_SET,\
  \ SEEK_CUR, SEEK_END\n    off_t l_start;      锁的起始偏移量\n    off_t l_len;        要锁的字节数；0\
  \ 表示从开始到文件末尾\n    pid_t l_pid;        阻塞我们锁的进程 PID (F_GETLK 和 F_OFD_GETLK)\n   \
  \ ...\n};\n```\n\n`l_start` 字段是锁的起始字节偏移量。`l_len` 是字节范围的长度——即要锁的字节总数。`l_whence` 指定\
  \ `l_start` 相对于文件的位置；其值与 `lseek()` 参数 `whence` 相同（参见第 4.5 节，“随机访问：在文件内移动](#ch04.xhtml_ch04lev1sec5)],第\
  \ 96 页`），因此该字段得此名。该结构体是自包含的：`l_start` 偏移量和 `l_whence` 值与当前读写的文件偏移量无关。示例代码可能如下：\n\
  \n```\nstruct employee { /* whatever */ };             /* 描述一个员工 */\nstruct flock\
  \ lock;                              /* 锁结构体 */\n...\n/* 锁第 6 个 struct employee\
  \ */\nlock.l_whence = SEEK_SET;                       /* 绝对位置 */\nlock.l_start =\
  \ 5 * sizeof(struct employee);     /* 第 6 个结构的起始位置 */\nlock.l_len = sizeof(struct\
  \ employee);           /* 锁一条记录 */\n```\n\n使用 `SEEK_CUR` 或 `SEEK_END`，你可以相对于文件中的当前位置或相对于文件末尾来锁定范围。对于这两种情况，`l_start`\
  \ 可以为负值，只要绝对起始位置不小于零。因此，要锁定文件中的最后一条记录：\n\n```\n/* 锁最后一个 struct employee */\nlock.l_whence\
  \ = SEEK_END;                       /* 相对于末尾 */\nlock.l_start = -1 * sizeof(struct\
  \ employee);    /* 最后一条结构的起始位置 */\nlock.l_len = sizeof(struct employee);       \
  \    /* 锁一条记录 */\n```\n\n将 `l_len` 设置为 `0` 是一个特殊情况。这意味着锁定从 `l_start` 指出的起始位置一直到文件末尾。这还包括文件末尾之后的任何位置。（换句话说，如果在持有锁期间文件发生了增长，则锁将扩展以覆盖整个文件。）因此，锁定整个文件是锁定单个记录的退化情况：\n\
  \n```\nlock.l_whence = SEEK_SET;                       /* 绝对位置 */\nlock.l_start\
  \ = 0;                               /* 文件开头 */\nlock.l_len = 0;               \
  \                  /* 直到文件结束 */\n```\n\nPOSIX 对 `l_len` 的规定如下：如果 `l_len` 为正数，受影响区域应从\
  \ `l_start` 开始，到 `l_start+l_len-1` 结束。如果 `l_len` 为负数，受影响区域应从 `l_start+l_len` 开始，到\
  \ `l_start-1` 结束。锁可以起始并延伸到文件当前结束之外，但不应延伸到文件开头。通过将 `l_len` 设置为 `0`，可以将锁扩展到该文件偏移量的最大可能值。如果此类锁的\
  \ `l_start` 设置为 `0` 且 `l_whence` 设置为 `SEEK_SET`，则应锁定整个文件。\n\n现在我们知道了如何描述在文件的*哪个位置*锁定，就可以用\
  \ `l_type` 描述锁的*类型*了。可能的值如下：\n\n| `F_RDLCK` | 读锁。文件必须以读模式打开才能应用读锁。 |\n| `F_WRLCK`\
  \ | 写锁。文件必须以写模式打开才能应用写锁。 |\n| `F_UNLCK` | 释放之前持有的锁。 |\n\n因此，锁的完整规范涉及在 `struct flock`\
  \ 结构体中设置共四个字段：三个用于指定字节范围，第四个用于描述锁类型。`l_type` 的 `F_UNLCK` 值用于释放锁。通常情况下，最简单的方法是释放和你获取的完全相同的锁，但也可以通过释放较大且先被锁定的范围内的某个字节范围来“拆分”锁。例如：\n\
  \n```\nstruct employee { /* whatever */ };             /* 描述一个员工 */\nstruct flock\
  \ lock;                              /* 锁结构体 */\n...\n/* 锁 6-8 个 struct employees\
  \ */\nlock.l_whence = SEEK_SET;                       /* 绝对位置 */\nlock.l_start =\
  \ 5 * sizeof(struct employee);     /* 第 6 个结构的起始位置 */\nlock.l_len = sizeof(struct\
  \ employee) * 3;       /* 锁三条记录 */\n… 获取锁（见下一节） …\n/* 释放第 7 条记录：这拆分了锁： */\nlock.l_whence\
  \ = SEEK_SET;                       /* 绝对位置 */\nlock.l_start = 6 * sizeof(struct\
  \ employee);     /* 第 7 个结构的起始位置 */\nlock.l_len = sizeof(struct employee);     \
  \      /* 释放一条记录 */\n```\n\n### 16.2.2 获取和释放基于进程的锁\n\n一旦我们知道了在文件的哪个位置锁定，就可以通过 `l_type`\
  \ 描述锁的类型。`fcntl()` `cmd` 参数可能的值如下：\n\n| `F_GETLK` | 查询是否可以获取锁。 |\n| `F_SETLK` |\
  \ 获取或释放锁。 |\n| `F_SETLKW` | 获取锁，直到可用。 |\n\n`F_GETLK` 命令是“我可以吗？”的查询。它查询由 `struct\
  \ flock` 描述的锁是否可用。如果可用，则不放置锁；相反，操作系统会将 `l_type` 字段改为 `F_UNLCK`。其他字段保持不变。\n\n如果锁不可用，操作系统会填充各个字段以描述阻塞请求的现有锁。在这种情况下，`l_pid`\
  \ 包含持有锁的进程 PID。如果锁被持有，没什么可以做的，除了等待一段时间再次尝试获取锁，或者打印错误消息并放弃。\n\nGNU/Linux `fcntl(3)`\
  \ 手册页指出，这些信息可能不足；进程可能位于另一台机器上！跨网络持有锁还有其他问题；通常，在远程计算机挂载的文件系统上锁定不是个好主意。\n\n`F_SETLK`\
  \ 命令尝试获取指定的锁。如果 `fcntl()` 返回 `0`，则已成功获取。如果它返回 `-1`，则另一个进程持有冲突锁。在这种情况下，`errno` 被设置为\
  \ `EAGAIN`（稍后试）或 `EACCES`（拒绝访问）。这两个值都是可能的，以适应历史系统。\n\n`F_SETLKW` 命令也尝试获取指定的锁。它与\
  \ `F_SETLK` 的区别在于它会等待直到锁可用。\n\n一旦你选择了适当的 `cmd` 参数值，将其作为第二个参数传递给 `fcntl()`，并将指向已填充的\
  \ `struct flock` 的指针作为第三个参数：\n\n```\nstruct flock lock;\nint fd;\n… 打开文件，填充 struct\
  \ flock …\nif (fcntl(fd, F_SETLK, & lock) < 0) {\n    /* 无法获取锁，尝试恢复 */\n}\n```\n\
  \n`lockf()` 函数提供了在文件当前位置获取锁的另一种方式：\n\n\n\n\n\n# 在 GNU/Linux 上，`lockf()` 实现为对 `fcntl()`\
  \ 的“封装”。\n\n```\n#include <sys/file.h>                                         \
  \      POSIX XSI\n\nint lockf(int fd, int cmd, off_t len);\n```\n\n文件描述符 `fd` 必须是以读写模式打开的。`len`\
  \ 指定要锁定的字节数：如果 `len` 为正数，则从当前位置（假设为 `pos`）到 `pos+len` 字节；如果 `len` 为负数，则从 `pos-len`\
  \ 到 `pos-1`。命令如下：\n\n| `F_LOCK` | 在该范围上设置排他锁。该调用将阻塞，直到锁可用。 |\n| `F_TLOCK` | 尝试加锁。这类似于\
  \ `F_LOCK`，但如果锁不可用，`F_TLOCK` 将返回错误。 |\n| `F_ULOCK` | 释放指定的区域。这可能会导致前文描述的锁拆分。 |\n\
  | `F_TEST` | 检查锁是否可用。如果可用，则返回 `0` 并获取锁。否则，返回 `–1` 并将 `errno` 设置为 `EACCES`。 |\n\n\
  成功时返回值为 `0`，错误时返回 `–1`，并适当设置 `errno`。可能的错误返回包括：\n\n| `EAGAIN` | 文件已锁定，针对 `F_TLOCK`\
  \ 或 `F_TEST`。 |\n| `EDEADLK` | 对于 `F_TLOCK`，此操作将导致死锁。 |\n| `ENOLCK` | 操作系统无法分配锁。\
  \ |\n\n`F_TLOCK` 和 `EDEADLK` 的组合是有用的：如果你知道永远没有死锁的风险，请使用 `F_LOCK`。否则，为了安全起见，使用 `F_TLOCK`\
  \ 是值得的。如果锁可用，你就能获取它；但如果不可用，你有机会进行恢复，而不是永久阻塞等待锁。\n\n完成锁操作后，你应该释放它。使用 `fcntl()` 时，获取用于获取锁的原始\
  \ `struct lock`，并将 `l_type` 字段改为 `F_UNLCK`。然后使用 `F_SETLK` 作为 `cmd` 参数：\n\n```\n\
  lock.l_whence = ... ;       /* 同前述 */\nlock.l_start = ... ;        /* 同前述 */\nlock.l_len\
  \ = ... ;          /* 同前述 */\nlock.l_type = F_UNLCK;      /* 解锁 */\nif (fcntl(fd,\
  \ F_SETLK, & lock) < 0) {\n    /* 处理错误 */\n}\n/* 锁已释放 */\n```\n\n使用 `lockf()` 的代码会简单一些。为了简洁，我们省略了错误检查：\n\
  \n```\noff_t curpos, len;\ncurpos = lseek(fd, (off_t) 0, SEEK_CUR);     获取当前位置\n\
  len = ... ;                                 设置正确的锁定字节数\n\nlockf(fd, F_LOCK, len);\
  \                      获取锁\n… 在此处使用被锁区域 …\nlseek(fd, curpos, SEEK_SET);        \
  \         返回锁锁的位置\n\nlockf(fd, F_ULOCK, len);                     解锁文件\n```\n\n\
  如果你没有显式地释放锁，操作系统会在两种情况下为你完成。第一种情况是进程退出（无论是通过 `main()` 返回还是通过 `exit()` 函数，该内容见第 9.1.5.1\
  \ 节，“定义进程退出状态”，[第 289 页]）。另一种情况是你对文件描述符调用了 `close()`——更多内容请见下一节。\n\n### 16.2.2.3\
  \ 锁的注意事项\n\n在进行文件加锁时，需要注意以下几点：\n\n*   如前所述，建议性锁（advisory locking）仅仅是如此。一个不配合的进程可以在正在加锁的进程背后（可以说）做任何它想做的事。\n\
  *   这些调用*不应*与 `<stdio.h>` 库结合使用。该库有自己的缓冲机制，虽然你可以通过 `fileno()` 获取底层文件描述符，但文件中的实际位置可能并不是你认为的位置。通常，标准\
  \ I/O 库并不理解文件锁。\n    *   有几个函数——`flockfile()`、`ftrylockfile()` 和 `funlockfile()`——用于\
  \ `FILE *` 对象。它们提供了针对 `FILE` *对象本身*的锁，而不是针对底层文件的。它们用于多线程程序，以防止多个线程尝试使用同一个打开的 `FILE`\
  \ 指针。\n*   记住，锁在 `fork()` 之后*不会*被子进程继承，但在 `exec` 之后它们*确实*会保留。\n*   对文件上打开的*任何*文件描述符执行\
  \ `close()` 都会移除进程对该文件的*所有*锁，即使该文件仍有其他打开的文件描述符。\n\n`close()` 这样工作很遗憾，但因为这是 `fcntl()`\
  \ 锁最初的实现方式，POSIX 标准将其标准化了。将这种行为作为标准可以避免破坏现有的 Unix 代码。\n\n由于 `fork()`、`exec` 和 `close()`\
  \ 的行为，这些锁被称为*基于进程的*（process-based）。换句话说，锁与进程相关，而不是与文件描述符相关。\n\n### 16.2.2.4 基于文件描述符的锁\n\
  \n为了避免前节描述的基于进程锁的问题，GNU/Linux 引入了基于文件描述符的锁。POSIX 标准也包含了它们，因此它们不再是 GNU/Linux 特有的。\n\
  \n使用与前述相同的 `struct flock` 来获取和释放文件描述符锁。然而，传递给 `fcntl()` 的 `cmd` 参数值不同：\n\n| `F_OFD_GETLK`\
  \ | 询问是否可以获取锁。 |\n| `F_OFD_SETLK` | 获取或释放锁。 |\n| `F_OFD_SETKW` | 获取锁，直到可用。 |\n\n\
  文件描述符锁也是建议性锁，但它们与进程锁的区别在于：你必须将 `l_pid` 设置为零。\n*   锁跨 `fork()` 和 `exec` 继承。\n*  \
  \ 锁通过 `dup()` 传播到新的文件描述符。\n*   只有在关闭最后一个文件时释放锁。\n*   Linux 内核不对文件描述符锁进行死锁检测，而对进程锁则会。\n\
  \n### 16.2.3 BSD 锁：`flock()`\n\nBSD Unix 引入了自己的文件加锁机制 `flock()`。它的声明如下：\n\n```\n\
  #include <sys/file.h>                                               Common\n\nint\
  \ flock(int fd, int operation);\n```\n\n文件描述符 `fd` 代表打开的文件。这些是操作：\n\n| `LOCK_SH`\
  \ | 创建共享锁。可以有多个共享锁。 |\n| `LOCK_EX` | 创建排他锁。只能有一个此类锁。 |\n| `LOCK_UN` | 移除之前的锁。 |\n\
  | `LOCK_NB` | 与 `LOCK_SH` 或 `LOCK_EX` 进行位或时，如果锁不可用则阻塞。 |\n\n默认情况下，如果存在竞争锁，锁请求将阻塞（不返回）。一旦竞争锁被移除且请求的锁被，调用将返回。（这意味着默认情况下存在死锁的可能。）要尝试非阻塞地获取锁，请将\
  \ `LOCK_NB` 与 `operation` 的其他值进行位或。\n\n关于 `flock()` 的要点如下：\n\n*   `flock()` 锁也是建议性锁；一个没有加锁的程序可以进来肆意破坏用\
  \ `flock()` 锁的文件，且不会产生错误。\n*   锁定的是整个文件。没有锁定或解锁文件部分部分的机制。\n*   文件的打开方式对可以放置的锁类型没有影响。（对比\
  \ `fcntl()`，后者文件必须以读模式打开才能加读锁，或以写模式打开才能加写锁。）\n\n\n\n\n\n*   在同一个文件共享上打开多个文件描述符将共享该锁。其中任何一个描述符都可以用于移除锁。与基于进程的\
  \ `fcntl()` 锁不同，在没有显式解锁的情况下，在*所有*该文件的已打开文件描述符都被关闭之前，锁不会被移除。\n\n*   一个进程对一个文件只能持有一个\
  \ `flock()` 锁；连续使用两个不同的锁类型调用 `flock()` 会将锁更改为新类型。\n\n*   在 GNU/Linux 系统上，`flock()`\
  \ 锁与 `fcntl()` 锁之间是*完全独立*的。许多商用 Unix 系统将 `flock()` 实现为在 `fcntl()` 之上的一个“封装器”，但其语义并不相同。\n\
  \n我们不建议在新程序中使用 `flock()`，因为它的语义没有那么灵活，而且该调用没有被 POSIX 标准化。在 GNU/Linux 中对其支持主要是为了兼容为较旧的\
  \ BSD Unix 系统编写的软件。\n\n### Note\n\nGNU/Linux 的 `flock`(2) 手页解释说，在 NFS 文件系统上，`flock()`\
  \ 锁是使用 `fcntl()` 模拟的。因此，远程挂载的 NFS 文件必须以写模式打开，才能通过 `flock()` 获取写锁。\n\n### 16.2.4\
  \ 强制锁定\n\n大多数商用 Unix 系统除了建议性文件锁外，还支持强制性文件锁。强制锁定仅对 `fcntl()` 锁有效。文件的强制锁定由文件的权限设置控制——特别是通过\
  \ `chmod` 命令向文件添加 setgid 位来控制：\n\n```\n$ echo hello, world > myfile            \
  \                   创建文件\n$ ls -l myfile                                       \
  \      显示权限\n-rw-r--r--   1 arnold    devel        13 Apr  3 17:11 myfile\n$ chmod\
  \ g+s myfile                                         添加 setgid 位\n$ ls -l myfile\
  \                                             显示新权限\n-rw-r-Sr-- 1 arnold      devel\
  \        13 Apr  3 17:11 myfile\n```\n\n组执行执行位应保持关闭状态。`S` 表示 setgid 位已开启，但没有开启执行权限；如果两者都开启，则将使用\
  \ `s`。\n\n开启 setgid 且关闭组执行的组合通常没有意义。因此，System V 的开发者选择这种组合来表示“强制强制锁定”。事实上，添加此位就足以让\
  \ Solaris 等商用 Unix 系统强制执行文件锁。\n\n在 GNU/Linux 系统上，以前的情况略有不同。为了强制锁定，必须对文件应用 setgid\
  \ 位，但仅此此是不够的。包含该文件的文件系统还必须在使用 `mount` 命令时带有 `mand` 选项挂载（参见第 8.1.3 节，“挂载文件系统：`mount`](#ch08.xhtml_ch08lev2sec3),”第\
  \ 225 页）。\n\n然而，从 Linux 4.5 内核开始，必须在编译内核时使用 `CONFIG_MANDATORY_FILE_LOCKING` 配置选项来配置强制锁定。否则，使用\
  \ `mand` 选项挂载文件系统将不起作用。从 Linux 内核 5.15 及更高版本开始，不再完全支持强制锁定。\n\n由于不再提供强制性文件锁，我们在此不再进行演示。书的\
  \ GitHub 代码仓库中的 `ch-extended-mandlock.c` 程序演示了强制文件锁定。如果你感兴趣，请查看那里。\n\n## 16.3 更精确的时间\n\
  \n`time()` 系统调用和 `time_t` 类型表示自 Unix 时间（Epoch）格式以来的秒数。一秒钟的*分辨率*实际上并不够；如今的机器非常快，区分亚秒级的时间间隔通常很有用。从\
  \ 4.2 BSD 开始，Berkeley Unix 引入了一系列系统调用，使得获取和使用亚秒时间成为可能。这些调用在所有现代 Unix 系统（包括 GNU/Linux）上都是可用的。\n\
  \n### 16.3.1 微秒级：`gettimeofday()`\n\n第一个任务是获取当天时间：\n\n```\n#include <sys/time.h>\
  \                                         通用\n\nint gettimeofday(struct timeval\
  \ *tv, void *tz);    旧的 POSIX 定义，并非 GLIBC 的\n```\n\n`gettimeofday()` 获取当天时间。成功时返回\
  \ `0`，错误时返回 `–1`。参数如下：\n\n`gettimeofday`(2) 手页记录了一个相应的 `settimeofday()` 函数，供超级用户（`root`）设置整个系统的时间。\n\
  \n*   `struct timeval *tv`\n    该参数指向一个 `struct timeval` 结构（稍后描述），系统将当前时间放入其中。\n\
  \n*   `void *tz`\n    该参数已不再被使用；因此它的类型为 `void *`，你应该始终向它传递 `NULL`。（手页描述了它以前的作用，然后声明它已过时。如果你对细节感兴趣，可以阅读它。）\n\
  \n时间由 `struct timeval` 表示：\n\n```\nstruct timeval {\n    time_t       tv_sec;  \
  \   /* 秒 */\n    suseconds_t tv_usec;     /* 微秒 */\n};\n```\n\n`tv_sec` 值表示自 Unix\
  \ 时间以来的秒；`tv_usec` 是一秒内的微秒数。GLIBC 提供了若干用于 `struct timeval` 对象的宏：\n\n```\n#define\
  \ timerisset(tvp) ((tvp)->tv_sec || (tvp)->tv_usec)\n\n#define timercmp(tvp, uvp,\
  \ cmp) ((tvp)->tv_sec < (uvp)->tv_sec || \\\n        ((tvp)->tv_sec == (uvp)->tv_sec\
  \ && (tvp)->tv_usec < (uvp)->tv_usec))\n\n#define timerclear(tvp) ((tvp)->tv_sec\
  \ = 0, (tvp)->tv_usec = 0)\n```\n\n`tv_sec` 值表示自 Unix 时间以来的秒；`tv_usec` 是一秒内的微秒（显然\
  \ `suseconds_t` 是用于持有亚秒值的）。\n\n两个额外的宏允许你加减 `struct timeval`：\n\n```\n#define timeradd(a,\
  \ b, res) /* res = a + b */ (struct timeval *res)\n#define timersub(a, b, res) /*\
  \ res = a - b */ (struct timeval *res) \n```\n\n这些宏安排的结果使得`0 <= res->tv_usec <=\
  \ 999999`’。\n\n参见第 5.6.4 节，“更改时间戳：`utime()` 及其继者](#ch05.xhtml_ch05lev2sec17),”第\
  \ 148 页，了解关于用于返回当天值的不同数据结构和系统调用的讨论。\n\n如前，`gettimeofday()` 在 40 年前的 4.2 BSD 中引入。尽管\
  \ POSIX 已将其从标准中移除，但它不太会在短期内消失。\n\n### 16.3.2 纳秒级：`clock_gettime()`\n\n目前可用的最细时间分辨率是纳秒。要获取包含纳秒内的当前时间，使用\
  \ `clock_gettime()`：\n\n```\n#include <time.h>                           POSIX\n\
  \nint clock_gettime(clockid_t clockid, struct timespec *tp);\n```\n\n参数为：\n\n* \
  \  `clockid_t clockid`\n    要获取时间的特定系统时钟的标识符。特别是在 GNU/ Linux 上，有很多种。POSIX 定义的唯一我们需要的的是\
  \ `CLOCK_REALTIME`。（其他的请参见 *clock_gettime*(2)）。\n\n*   `struct timespec *tp`\n\n\
  \n\n\n指向 `struct timespec` 的指针，将由系统填充。该结构将在稍后的第 16.3.4 节“更精确的暂停：`nanosleep()`”以及第\
  \ 573 页中介绍。\n\n与往常一样，成功时返回 `0`，失败时返回 `–1` 并设置 `errno` 错误。这是一个小型演示程序：\n\n```c\n/*\
  \ ch-extended-nstime.c --- demonstrate nanosecond clock resolution */\n\n#include\
  \ <stdio.h>\n#include <errno.h>\n#include <stdlib.h>\n#include <string.h>\n#include\
  \ <time.h>\n\nint\nmain(int argc, char **argv)\n{\n    struct timespec now;\n  \
  \  struct tm *the_time;\n    char buf[BUFSIZ];\n    if (clock_gettime(CLOCK_REALTIME,\
  \ & now) < 0) {\n        fprintf(stderr, \"%s: clock_gettime failed: %s\\n\",\n\
  \                argv[0], strerror(errno));\n        exit(EXIT_FAILURE);\n    }\n\
  \n    the_time = localtime(& now.tv_sec);\n\n    strftime(buf, sizeof buf, \"%c\"\
  , the_time);\n    printf(\"It is now: %s and %ld nanoseconds\\n\", buf, now.tv_nsec);\n\
  \n    return EXIT_SUCCESS;\n}\n```\n\n以及示例运行结果：\n\n```\n$ ch-extended-nstime\nIt\
  \ is now: Tue May 27 16:25:42 2025 and 279958485 nanoseconds\n```\n\n### 16.3.3\
  \ 间隔定时器：`setitimer()` 和 `getitimer()`\n\n`alarm()` 函数（参见第 10.8.1 节“闹钟时：`sleep()`、`alarm()`\
  \ 和 `SIGALRM`”，以及第 363 页）安排在指定的秒数通过后发送 `SIGALRM`。它的最小分辨率为一秒。在这里，4.2 BSD 也引入了一个函数和三种接受亚秒时间的不同定时器。\n\
  \n*间隔定时器*（interval timer）就像一个循环的闹钟。你设置它第一次“响铃”的时间，以及此后定时器重复的频率。这两个值都使用 `struct timeval`\
  \ 对象；这意味着它们（可能）具有微秒级分辨率。定时器通过发送信号来“触发”；因此，你必须为定时器安装信号处理器，最好在设置定时器之前安装。\n\n如表 16.2\
  \ 所示，存在三种不同的定时器。\n\n| **定时器** | **信号** | **功能** |\n| --- | --- | --- |\n| `ITIMER_REAL`\
  \ | `SIGALRM` | 按照实时运行。 |\n| `ITIMER_VIRTUAL` | `SIGVTALRM` | 当进程在用户模式下执行时运行。 |\n\
  | `ITIMER_PROF` | `SIGPROF` | 当进程处于用户模式或系统模式时均运行。 |\n\n**表 16.2：** 间隔定时器\n\n第一个定时器\
  \ `ITIMER_REAL` 的用法非常简单。定时器按实时倒计时，在指定的时间通过后发送 `SIGALRM`。由于发送了 `SIGALRM`，你不能将 `setitimer()`\
  \ 的调用与 `alarm()` 的调用混合（后者通常使用前者实现），而且将它们与 `sleep()` 调用混合也是危险的；参见第 10.8.1 节“闹钟时：`sleep()`、`alarm()`\
  \ 和 `SIGALRM`”，以及第 363 页\n\n\n\n第二个定时器 `ITIMER_VIRTUAL` 同样简单。它在进程于用户模式下执行时倒计时。\n\
  \n第三个定时器 `ITIMER_PROF` 更具专业性。当进程处于用户模式或系统模式时，它都会倒计时。\n\n```c\n#include <stdio.h>\n\
  #include <errno.h>\n#include <stdlib.h>\n#include <string.h>\n#include <time.h>\n\
  #include <unistd.h>\n#include <signal.h>\n\nvoid handler(int signo) {\n    static\
  \ char msg[] = \"\\n*** expired, you lose!\\n\";\n    assert(signo == SIGALRM);\n\
  \    write(2, msg, sizeof(msg) - 1);\n    exit(EXIT_FAILURE);\n}\n\nint main() {\n\
