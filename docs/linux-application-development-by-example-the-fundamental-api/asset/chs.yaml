  \ 多字节字符编码\n\n宽字符字符串存储在磁盘上是通过在内存中转换为多字节字符集编码，然后将转换数据写入磁盘文件。同样，此类字符串通过低级块 I/O 从磁盘读取并在内存中从编码版本转换为宽字符版本。\n\
  \n许多编码通过使用*位状态*来表示多字节字符。换句话说，给定字节流中的字节值代表自身，直到遇到特殊的控制值。此时，解释方式会根据当前的位状态发生改变。因此，相同的字节值可以有两个或多个含义：一个用于普通未偏移状态，另一个用于偏移状态。正确编码的字符串应该开始并结束于同一个位状态，称为*初始位状态*。\n\
  \nUnicode 的一个显著优势是它的编码是自纠的；其编码不使用位状态，因此中间的数据丢失不会损坏后续的编码数据。\n\n\n\n\n多字节到宽字符以及宽字符到多字节函数的初始版本维护了一个转换状态的私有副本（例如位移状态以及任何其他可能必要的的内容）。这种设计限制了函数在程序的整个生命周期内只能用于一种转换。示例包括\
  \ `mblen()`（多字节字符长度）、`mbtowc()`（多字节到宽字符）、`wctomb()`（宽字符到多字节）、`mbstowcs()`（多字节字符串到宽字符字符串）和\
  \ `wcstombs()`（宽字符字符串到多字节字符串）。我们不打算介绍这些函数，因为你不应该使用它们。至于你*应该*做些什么，请继续向下看。\n\n###\
  \ 15.4.3 将字节转换为宽字符\n\n处理多字节编码的更新版本函数被称为*可重启动的*（restartable）。这意味着用户级代码在一个独立的类型为 `mbstate_t`\
  \ 的对象中维护转换状态。相应的示例有 `mbrlen()`、`mbrtowc()`、`wcrtomb()`、`mbsrtowcs()` 和 `wcsrtombs()`。（注意它们名称中的\
  \ `r`，代表“restartable”）。我们稍后描述这些函数。\n\n#### 15.4.3.1 转换状态：`mbstate_t`\n\n`mbstate_t`\
  \ 是一个透明类型，类似于 `<stdio.h>` 中的 `FILE` 类型。与 `FILE` 对象不同，用户级代码声明并初始化 `mbstate_t` 对象，并将它们的指针传递给各种函数。但用户级代码永远不会访问或更新\
  \ `mbstate_t` 对象的内容。\n\n初始化一个 `mbstate_t` 对象将其置于我们之前提到的初始位移状态。`mbsinit()` 函数允许你判断\
  \ `mbstate_t` 是否处于初始位移状态：\n\n```\n#include <wchar.h>                           ISO\
  \ C\n\nint mbsinit(const mbstate_t *ps);\n```\n\n如果 `*ps` 处于初始位移状态或 `ps` 为 `NULL`，则\
  \ `mbsinit()` 返回非零（真）。否则返回零。\n\n初始化 `mbstate_t` 对象的最可移植性方法是使用 `memset()`：\n\n```\n\
  mbstate_t mbs;\n\nmemset(& mbs, 0, sizeof(mbstate_t));\n```\n\n也可以通过这种方式初始化：\n\n\
  ```\nmbstate_t mbs = { 0, };\n```\n\n但这在某些系统上可能会产生编译器警告。初始化应该在开始处理输入字节流之前完成。此外，在遇到转换错误后重新初始化\
  \ `mbstate_t` 对象也是一个好主意。\n\n#### 15.4.3.2 转换字节\n\n从多字节编码字符到宽字符的转换可以通过 `mbrtowc()`（产生单个宽字符）或通过\
  \ `mbsrtowcs()`（产生宽字符字符串）来实现：\n\n```\n#include <wchar.h>                       \
  \   ISO C\n\nsize_t mbrtowc(wchar_t *pwc, const char *s, size_t n, mbstate_t *ps);\n\
  size_t mbsrtowcs(wchar_t *dest, const char **src, size_t len, mbstate_t *ps);\n\
  ```\n\n对于 `mbrtowc()`，参数为：\n\n* `wchar_t *pwc`\n    指向接收解码后字符的宽字符的指针。\n* `const\
  \ char *s`\n    指向起始解码的第一个字节的指针。\n* `size_t n`\n    `s` 所向的数据中剩余的最大字节数。\n* `mbstate_t\
  \ *ps`\n    指向 `mbstate_t` 对象的指针。\n\n成功后，`mbrtowc()` 返回读取的字节数。通常这是一个正值。如果转换的字符是\
  \ `L’\\0’`，则可能为零。在这种情况下，`*ps` 被重置为初始位移状态。有两种可能的错误返回。如果 `s` 指向的字节不包含完整的多字节字符，返回值为\
  \ `(size_t)–2`。如果没有找到任何有效的多字节字符，返回值为 `(size_t)–1`，并将 `errno` 设置为 `EILSEQ`。\n\n该函数有点复杂，因为当\
  \ `pwc` 为 `NULL`、`s` 为 `NULL` 且/或 `ps` 为 `NULL` 时，它的行为不同。对于日常代码，这些条件都不应该为真，因此我们不会用细节来扰你。相反，如果你感兴趣，请参阅\
  \ `mbrtowc`(3) 手页。\n\n对于 `mbsrtowcs()`，参数为：\n\n* `wchar_t *dest`\n    目标宽字符字符串。\n\
  * `const char **src`\n    指向源字节指针的指针。随着宽字符的转换，`*src` 会被更新。设计思路是当 `mbsrtowcs()` 返回时，`*src`\
  \ 将指向最后一个转换字节的后续位置。\n* `size_t len`\n    要转换的最大宽字符数。\n* `mbstate_t *ps`\n    指向\
  \ `mbstate_t` 对象的指针。\n\n返回值为转换的宽字符数，不包括终止符 `L’\\0’`。与 `mbrtowc()` 一样，如果遇到无效序列，则返回\
  \ `-1` 并 `errno` 设置为 `EILSEQ`。\n\n在这里，如果 `dest` 和 `ps` 为 `NULL`，函数的行为也可能有所不同。我们建议你查看\
  \ `mbsrtowcs`(3) 手页。\n\n#### 15.4.3.3 字节最大值\n\n在将字节转换为宽字符时，需要注意两个重要的最大值：\n\n```\n\
  #include <limits.h>                              ISO C\n\n#define MB_LEN_MAX ...\n\
  ```\n\n以及：\n\n```\n#include <stdlib.h>                              ISO C\n\n#define\
  \ MB_CUR_MAX ...\n```\n\n`MB_LEN_MAX` 是*任何*语言化中用于多字节字符的最大字节数。在实践中，这并不十分有用。\n\n`MB_CUR_MAX`\
  \ 是*当前*语言化中用于多字节字符的最大字节数。特别是在调用 `mbrtowcs()` 并传递一个可能读取的字节数时，如果你知道输入源字符串至少剩余这么多字节，可以使用\
  \ `MB_CUR_MAX`。\n\n##### 15.4.3.4 示例代码：GNU `ls.c`\n\n以下来自 GNU `ls` 的代码片段展示了我们讨论的多个函数的用法。它来自\
  \ `quote_name_buf()` 函数，该函数的作用获取文件名并对其引号。作为其工作的一部分，它将无效的多字节字符替换为单个 `?`：\n\n\n\n\n\
  \n```\n 1               /* If we have a multibyte sequence, copy it until we\n 2\
  \                  reach its end, replacing each non-printable multibyte\n 3   \
  \               character with a single question mark.  */\n 4               {\n\
  \ 5                  mbstate_t mbstate = { 0, };\n 6                  do\n 7   \
  \                 {\n 8                     wchar_t wc;\n 9                    \
  \ size_t bytes;\n10                     int w;\n11\n12                     bytes\
  \ = mbrtowc (&wc, p, plimit - p, &mbstate);\n13\n14                     if (bytes\
  \ == (size_t) -1)\n15                       {\n16                        /* An invalid\
  \ multibyte sequence was\n17                           encountered.  Skip one input\
  \ byte, and\n18                           put a question mark.  */\n19         \
  \               p++;\n20                        *q++ = '?';\n21                \
  \        displayed_width += 1;\n22                        break;\n23           \
  \           }\n24\n25                    if (bytes == (size_t) -2)\n26         \
  \             {\n27                        /* An incomplete multibyte character\n\
  28                           at the end.  Replace it entirely with\n29         \
  \                  a question mark.  */\n30                        p = plimit;\n\
  31                        *q++ = '?';\n32                        displayed_width\
  \ += 1;\n33                        break;\n34                      }\n35\n36   \
  \                 if (bytes == 0)\n37                      /* A null wide character\
  \ was encountered.  */\n38                      bytes = 1;\n39\n40             \
  \       w = wcwidth (wc);\n41                    if (w >= 0)\n42               \
  \       {\n43                        /* A printable multibyte character.\n44   \
  \                        Keep it.  */\n45                        for (; bytes >\
  \ 0; --bytes)\n46                          *q++ = *p++;\n47                    \
  \    displayed_width += w;\n48                      }\n49                    else\n\
  50                      {\n51                        /* An nonprintable multibyte\
  \ character.\n52                           Replace it entirely with a question\n\
  53                           mark.  */\n54                        p += bytes;\n\
  55                        *q++ = '?';\n56                        displayed_width\
  \ += 1;\n57                      }\n58                    }\n59                \
  \  while (! mbsinit (&mbstate));\n```\n\n（行号相对于片段的开始位置。）第 5 行初始化了命名为 `mbstate` 的\
  \ `mbstate_t` 实例。该代码运行一个 `do`-`while` 循环，只要 `mbstate` 不处于初始状态，循环就会持续（第 6–59 行）。第\
  \ 59 行的循环测试使用 `mbsinit()` 来判断 `mbstate` 是否处于初始偏移状态。\n\n第 12 行执行转换。第 14–23 行处理无效多字节序列的情况，第\
  \ 25–34 行处理不完整的多字节字符。\n\n现在我们已经获得了一个有效的宽字符，必须检查它是否实际上可打印！第 40 行调用 `wcwidth()` 来确定这一点，然后由第\
  \ 41–57 行妥善地处理后续工作。\n\n### 15.4.4 将宽字符转换为字节\n\n正如我们所见，宽字符存储在编码为多字节数据的文件中。如果有必要，会将内存中的多字节编码数据转换为宽字符进行处理。随后，你将能够将任何新的或处理过的宽字符数据转换回多字节编码数据，以便输出到文件或管道。为此目的有两个主要函数：\n\
  \n```\n#include <wchar.h>                         ISO C\n\nsize_t wcrtomb(char *s,\
  \ wchar_t wc, mbstate_t *ps);\nsize_t wcsrtombs(char *dest, const wchar_t **src,\n\
  \                 size_t len, mbstate_t *ps);\n```\n\n`wcrtomb()` 将非零宽字符 `wc` 转换为若干字节并存储在\
  \ `s` 指向的 `char` 数组中。它更新 `*ps` 中的偏移状态。返回写入 `s` 的字节数。如果 `wc` 为 `L’\\0’`，返回值为零。如果\
  \ `wc` 无法转换，返回值为 `(size_t) –1`，并将 `errno` 设置为 `EILSEQ`。\n\n`wcsrtombs()` 接收 `*src`\
  \ 指向的宽字符字符串并转换为多字节编码字符串，将字节存储在 `dest` 指向的 `char` 数组中。`len` 给出了写入 `dest` 的最大字节数，`*ps`\
  \ 维护偏移状态。返回写入 `dest` 的字节数（不包括任何终止符 `’\\0’`），`*src` 更新为指向最后一个写入宽字符之后。如果遇到无效字符，返回值为\
  \ `(size_t) –1`，并将 `errno` 设置为 `EILSEQ`。\n\n与 `mbrtowc()` 和 `mbsrtowcs()` 一样，当指针值之一为\
  \ `NULL` 时，还有额外的用例；详细信息请参见 `wcrtomb`(3) 和 `wcsrtombs`(3) 手页。\n\n以下代码来自 `gawk` 5.3.0\
  \ 中的 `node.c` 文件，它将宽字符字符串转换为多字节字符串。该代码一次处理一个宽字符，而不是使用 `wcsrtombs()`，这是因为 `gawk`\
  \ 字符串可能包含值为零的字符。（这是“无任意限制”GNU 编码原则的一部分，在前文讨论的 第 1.4.4 节、“让 GNU 程序变得更好的因素](#ch01.xhtml_ch01lev2sec9)”以及第\
  \ 15 页中已讨论过。）\n\n```\n950  /* wstr2str --- 将宽字符串转换回多字节字符串 */\n951\n952  NODE *\n\
  953  wstr2str(NODE *n)\n954  {\n955      size_t result;\n956      size_t length;\n\
  957      wchar_t *wp;\n958      mbstate_t mbs;\n959      char *newval, *cp;\n960\n\
  961      assert(n->valref == 1);\n962      assert((n->flags & WSTRCUR) != 0);\n\
  963\n964      /*\n965       * 将 t1->wstptr 中的宽字符转换回多字节字符。\n966       * 这种做法相当糟糕，但是最直接的\n\
  967       * 方法。\n968       */\n969      memset(& mbs, 0, sizeof(mbs));\n970\n971\
  \      length = n->wstlen;\n972      emalloc(newval, char *, (length * gawk_mb_cur_max)\
  \ + 1, \"wstr2str\");\n973\n974      wp = n->wstptr;\n975      for (cp = newval;\
  \ length > 0; length--) {\n976          result = wcrtomb(cp, *wp, & mbs);\n977 \
  \         if (result == (size_t) -1) /* 该怎么办？break 似乎是最好的 */\n978              break;\n\
  979          cp += result;\n980          wp++;\n981      }\n982      *cp = '\\0';\n\
  983\n984      /* 注意。调用者刚刚通过 make_string 创建了 n，所以这个 free 是安全的 */\n985      efree(n->stptr);\n\
  986      n->stptr = newval;\n987      n->stlen = cp - newval;\n988\n989      return\
  \ n;\n990  }\n```\n\n操作从第 969 行开始，那里初始化了 `mbs`。第 971–972 行分配了一个新缓冲区来存放转换后的字节。它分配了可能需要的最大字节数。这避免了在最初分配空间不足时，在转换过程中使用\
  \ `realloc()`。这里的权衡是用某些浪费的空间换取更易编写且确保正确的代码。注意正如前文讨论的，使用了 `gawk_mb_cur_max` 而不是 `MB_CUR_MAX`。\n\
  \n第 974–982 行执行转换，一次处理一个宽字符。第 976 行调用 `wcrtomb()`。如果出现问题，第 977–978 行退出循环。否则，第 979\
  \ 行根据写入的字节数移动指针，第 980 行将 `wp` 加 1。\n\n第 982 行用 `’0’` 终止新字符串。尽管 `gawk` 处理嵌入零字节的字符串，但它也将字符串数据存储以零字节结尾，以防需要与标准\
  \ C 库程序配合。\n\n最后，第 985–987 行释放旧字符串，并将新字符串和长度存储在 `*n` 中。\n\n### 15.4.5 语言\n\n语言问题由本地化（locale）控制。我们在本章之前已经介绍过\
  \ `setlocale()`。POSIX 提供了一套定义本地化工作规则的复杂机制；某些细节请参见 GNU/Linux `locale`(5) 手页，完整内容请参考\
  \ POSIX 标准本身。\n\n\n\n\n\n事实是，你并不想知道这些细节。作为应用程序开发者，你不应该也不需要担心这些问题；让功能运行由库的实现者负责。你的工作是理解概念并让代码使用适当的函数，例如\
  \ `strcoll()`（参见第 15.2.3 节，“字符串排序：`strcoll()` 和 `strxfrm()`”，“第 512 页）。\n\nGLIBC\
  \ 系统提供了优秀的本地化支持，包括一组感知多字节的正则表达式匹配例程。例如， POSIX 扩展正则表达式 `[[:alpha:]][[:alnum:]]+`\
  \ 匹配一个字母后跟一个或多个字母或数字（一个字母字符后跟一个或多个字母数字）。哪些字符属于这些类别的定义取决于区域设置（locale）。例如，此正则表达式会匹配两个字符‘eè’，而传统的\
  \ Unix ASCII 导向的正则表达式 `[a-zA-Z][a-A-Zz0-9]+` 则可能无法匹配。POSIX 字符类列在表 15.6 中。\n\n| 类名\
  \ | 匹配 |\n| --- | --- |\n| `[:alnum:]` | 字母数字字符。 |\n| `[:alpha:]` | 字母字符。 |\n| `[:blank:]`\
  \ | 空格和制表符字符。 |\n| `[:cntrl:]` | 控制字符。 |\n| `[:digit:]` | 数字字符。 |\n| `[:graph:]`\
  \ | 同时可打印且可见的字符。（换行可打印但不可见，而 `$` 则两者皆是。） |\n| `[:lower:]` | 小写字母。 |\n| `[:print:]`\
  \ | 可打印字符（非控制字符）。 |\n| `[:punct:]` | 标点符号（非字母、数字、控制字符或空格字符）。 |\n| `[:space:]` |\
  \ 空格字符（如空格、制表符、换行等）。 |\n| `[:upper:]` | 大写字母。 |\n| `[:xdigit:]` | 集合 `abcdefABCDEF0123456789`\
  \ 中的字符。 |\n\n**表 15.6: POSIX 正则表达式字符类**\n\n### 15.4.6 结论\n\n世界已变成一个“地球村”，软件作者和供应商不能局限于区域一角。因此，意识到国际化问题和字符集问题，并使你的代码实现国际化和本地化是非常有价值的。\n\
