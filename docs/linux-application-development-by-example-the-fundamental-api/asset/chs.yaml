  \ 255          return unknown;\n 256  }\n 257\n 258  /* do_statfs --- Use statfs\
  \ and print info */\n\n259\n260  void\n 261  do_statfs(const struct mntent *fs)\n\
  \ 262  {\n 263      struct statfs vfs;\n\n 264\n 265      if (fs->mnt_fsname[0]\
  \ != '/') /* skip nonreal filesystems */\n 266          return;\n\n 267\n 268  \
  \    if (statfs(fs->mnt_dir, & vfs) != 0) {\n 269          fprintf(stderr, \"%s:\
  \ %s: statfs failed: %s\\n\",\n 270              myname, fs->mnt_dir, strerror(errno));\n\
