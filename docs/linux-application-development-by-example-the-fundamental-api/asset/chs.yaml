  5. 你如何给 V7 `ls` 使用 `malloc()` 的情况打分？（提示：`free()` 调用了多频繁？它应该在哪里被调用？）\n6. 你如何给 V7\
  \ `ls` 的代码清晰度打分？（提示：有多少条注释？）\n7. 列出你将 V7 `ls` 适配到现代系统的步骤。\n8. 在书籍的 GitHub 代码仓库中，`ch-07-ls`\
  \ 目录下，你会找到 V7 版本和 V10 版本的 `ls.c` 代码。后者的代码行数比前者大约大出 40%，代表了此后 10.5 年的 Unix 发展。审查\
  \ V10 版本，并查看哪些是相同的，哪些是新颖且不同的。\n9. 列出你将 V10 `ls` 适配到现代系统的步骤。\n\n# 第 8 章\n\n## 文件系统与目录遍历\n\
  \n本章将完成对 Linux（以及 Unix）文件系统和目录的讨论。我们首先描述了包含文件系统的磁盘分区是如何被添加到（以及从）逻辑文件系统命名空间中的，使得用户通常不需要知道也不需要关心文件物理位于什么位置。在此过程中，我们介绍了用于操作文件系统的\
  \ API。\n\n然后我们描述了如何在分层文件命名空间内移动、如何获取当前工作目录的完整路径，以及如何使用 `fts()` 函数族轻松处理任意目录层次结构（树）。最后，我们描述了特殊但重要的\
  \ `chroot()` 系统调用。\n\n## 8.1 挂载与卸载文件系统\n\n统一的分层文件命名空间是 Linux/Unix 设计的一大优势。本节将查看管理文件、命令和操作系统如何协作，从包含文件数据和元数据的独立物理设备构建出命名空间。\n\
  \n### 8.1.1 回顾背景\n\n第 5 章，“目录与文件元数据 第 111 页”引入了用于文件元数据的 inode，并描述了目录项如何将文件名链接到 inode。它还描述了分区和文件系统，你看到硬链接被限制在单个文件系统内工作，因为目录只包含\
  \ inode 号，而 inode 号在所有正在使用的文件系统中并不是唯一的。\n\n除了 inode 和数据块外，文件系统还包含一个或多个 `superblock`\
  \ 副本。这是一个描述文件系统的特殊磁盘块；其信息随着文件系统自身的更改而更新。例如，superblock 包含了空闲和已用 inode 的计数、空闲和已用块的计数以及其他信息。它还包含一个\
  \ `magic number`：特殊位置上的唯一特殊值，用于标识文件系统的类型。（稍后我们将看到这有什么关系。）\n\n将包含文件系统的分区变为可用状态称为*挂载*（mounting）文件系统。将文件系统从使用状态移除，不无意外地称为*卸载*（unmounting）文件系统。\n\
  \n这两个任务通过 `mount` 和 `umount` [*sic*] 程序完成，它们以相应的系统调用命名。每个 Unix 系统的 `mount()` 系统调用的接口都不同。由于挂载和卸载被视为实现问题，POSIX\
  \ 刻意没有标准化这些系统调用。\n\n你将文件系统挂载到一个目录上；该目录被称为文件系统的*挂载点*（mount point）。按照惯例，该目录应该是空的，但并没有强制规定。然而，如果挂载点不为空，当文件系统挂载在其上时，其所有内容都变得*完全无法访问*^(1)\n\
  \n^(1) GNU/Linux、Solaris、macOS 和 BSD 都提供了更专门的方法来挂载文件和目录。这些有高级用途，我们在此不再进行讨论。\n\n\
  内核维护一个唯一的数字，称为*设备号*（device number），用于标识每个挂载的分区。因此，是 (设备号, inode) 共同唯一地标识了一个文件；当两个文件名的\
  \ `struct stat` 结构指示这两个数字相同时，你可以确定它们指向同一个文件。\n\n如之前所述，用户级软件将 inode 结构和其他元数据放在磁盘分区上，从而创建文件系统。该软件还为文件系统创建一个初始根目录。因此，我们必须区分“命名为\
  \ `/` 的根目录”（它是分层文件名命名空间中的顶层目录）和“文件系统的根目录”（每个文件系统独立的顶层目录）。`/` 目录也是“根文件系统”的“根目录”。\n\
  \n由于侧边栏“根 Inode 号 第 224 页”中描述的原因，文件系统的根目录*总是*具有 inode 号 `2`（尽管这没有正式标准）。由于可能存在多个文件系统，每个文件系统的根目录具有相同的\
  \ inode 号 `2`。在解析路径名时，内核知道每个文件系统挂载在何处，并安排挂载点的名称指向挂载文件系统的根目录。此外，挂载文件系统根目录下的 `..`（dot-dot）被指向挂载点的父目录。\n\
  \n图 8.1 显示了两个文件系统：一个是用于根目录的，另一个是在 `/usr` 挂载前的 `/usr`。图 8.2 显示了 `/usr` 挂载后的情况。\n\n\
  ![Images](img/fig08-001.jpg)\n\n**图 8.1:** 独立的文件系统，挂载前\n\n![Images](img/fig08-002.jpg)\n\
  \n**图 8.2:** 独立的文件系统，挂载后\n\n\n\n\n\n`/` 目录是整个逻辑层次结构的根目录，它在另一个方面也是特殊的：`/.` 和 `/..`\
  \ 指向同一个目录；系统中的任何其他目录都不如此。（因此，在执行完类似 `cd /../../../..` 的命令后，你仍然位于 `/`。）这种行为是以一种简单的方式实现的：`/.`\
  \ 和 `/..` 都是文件系统根目录的硬链接。（你可以在图 8.1 和 图 8.2 中看到这一点。）每个文件系统都是这样工作的，但内核特殊对待 `/`，并且不会将挂载在\
  \ `/` 上的文件系统的 `..` 目录视为特殊情况。\n\n### 8.1.2 查看不同的文件系统类型\n\n在我们开始之前，请注意本节的讨论专门针对 Linux。然而，大多数现代\
  \ Unix 系统具有类似的功能。我们鼓励你探索系统的文档。\n\n从历史上看，V7 Unix 仅支持单一文件系统类型；每个分区的元数据和目录组织结构都是相同的。4.1\
  \ BSD 使用了与 V7 结构相同的文件系统，但块大小为 1,024 字节而不是 512 字节。4.2 BSD 引入了“BSD 快速文件系统”（BSD Fast\
  \ Filesystem），它极大改变了磁盘上 inode 和数据的布局，并允许使用更大的块大小。（通常，使用更大的连续数据块可以提供更高的吞吐量，特别是对于文件读取。）\n\
  \n通过 20 世纪 80 年代的 4.3 BSD 和 System V Release 2，Unix 系统继续支持一种文件系统类型。要将计算机从一种文件系统切换到另一种，你必须先将每个文件系统备份到存档介质（9\
  \ 磁带），升级系统，然后恢复数据。例如，考虑将一台 VAX 11/780 从 4.1 BSD 升级到 4.2 BSD。\n\n20 世纪 80 年代中期，太阳公司（Sun\
  \ Microsystems）开发了一种内核架构，使得同时使用多种文件系统架构成为可能。这种设计应用于他们的 SunOS 操作系统，主要用于支持 Sun 网络文件系统（NFS）。然而，作为结果，它也可以支持多种磁盘架构。System\
  \ V Release 3 使用了类似的架构来支持远程文件系统（RFS），但它仍然仅支持一种磁盘架构。RFS 从未被广泛使用，现在只是一个历史脚注。（比上述两者更早，Research\
  \ Unix 拥有一个“文件系统开关”，允许它同时支持磁盘和网络文件系统。但到那时，Unix 世界已不再使用贝尔实验室研究院的系统，事实上，获取后期 Research\
  \ Unix 系统的副本已变得困难。）\n\nSystem V Release 3 支持两种块大小，512 字节和 1,024 字节，但在磁盘组织上是相同的。\n\
  \n太阳公司的通用设计在商业 Unix 系统中流行并广泛实施，包括 System V Release 4。Linux 和 BSD 使用这种设计的变体来支持多种磁盘文件系统格式。特别是，Intel\
  \ x86 硬件上的所有 Unix 变体通常都能挂载 MS-DOS/Windows FAT 文件系统（包括提供长文件名的系统），以及 ISO 9660 格式的\
  \ DVD 和 CD-ROM。\n\nLinux 有多个原生（即磁盘上的）文件系统。最流行的是 `ext4` 文件系统。然而，还有更多文件系统类型。如果你安装了内核源码，可以在\
  \ `/usr/src/linux/Documentation/filesystems/` 目录中找到大部分它们的信息。（注意，实际位置可能有所不同。）表 8.1\
  \ 列出了各种文件系统名称的集，并对每个进行了简要描述。缩写“RW”意味着“读/写”，“RO”意味着“只读”。\n\n并不是所有的文件系统都受 `mount`\
  \ 命令的支持；请查看 `mount`(8) 获取支持列表。另见 `/proc/filesystems` 和 `/lib/modules/ $(uname -r)/kernel/fs`\
  \ 获取文件系统的完整列表。\n\n日志（Journaling）是一种源自数据库系统的技术，用于提高文件更新的性能，以便在崩溃时能够正确且快速地进行文件系统恢复。截至本文，已有几种不同的日志文件系统。`ext4`\
  \ 就是之一；它的优点是与现有的 `ext2` 和 `ext3` 文件系统向上兼容，并且在 `ext3` 和 `ext4` 之间转换文件系统很容易。（参见 `tune2fs`(8)。）ReiserFS\
  \ 和 XFS 也有大量的关注者。\n\n`fat`、`msdos`、`umsdos` 和 `vfat` 文件系统共享公共代码。通常，你应该使用 `vfat`\
  \ 来挂载 Windows FAT-32（或其他 FAT-xx）分区，如果你想将 FAT 分区作为你的 GNU/Linux 系统的根文件系统，则使用 `umsdos`。\n\
  \nCoherent、Minix、原始 System V 和 Xenix 文件系统具有相似的磁盘结构。`sysv` 文件系统类型支持所有这些；`coherent`、`minix`、`sysv`\
  \ 和 `xenix` 是彼此的别名。\n\nBSD 快速文件系统多年来发生了一些演变。`ufs` 文件系统支持 4.4 BSD 版本的读写操作，这是三个广泛使用的\
  \ BSD 操作系统（FreeBSD、NetBSD 和 OpenBSD）的基础。它还支持太阳公司的 Solaris 文件系统（针对 SPARC 和 Intel\
  \ x86 系统）的读写操作。原始 BSD 格式和来自 NeXTStep 操作系统的格式仅只读模式支持。\n\n| 名称 | 支持 | 描述 |\n| :---\
  \ | :--- | :--- |\n| `9p` | RW | 贝尔实验室的 Plan 9 网络文件服务器协议。 |\n| `adfs` | RW | Acorn\
  \ 高级磁盘文件系统。 |\n| `affs` | RO, RW | Amiga 快速文件系统。只读还是读写取决于文件系统的版本。 |\n| `afs` | RW\
  \ | Andrew 文件系统。 |\n| `autofs` | RW | 用于与自动挂载器守护进程交互的文件系统。 |\n| `bfs` | RW | SCO\
  \ Unix 文件系统。 |\n| `binfmt_misc` | RW | 用于运行编译文件的特殊文件系统（例如 Java 文件）。 |\n| `btrfs`\
  \ | RW | 一种高性能的写时复制文件系统。 |\n| `cifs` | RW | 支持旧版本的 Microsoft SMB 协议。 |\n| `ceph`\
  \ | RW | 分布式文件系统。 |\n| `coda` | RW | 卡内梅隆大学开发的实验性分布式文件系统。 |\n| `cramfs` | RO | 用于\
  \ 存储文件的小型文件系统。 |\n| `devpts` | RW | 用于伪终端的特殊文件系统。 |\n| `ecryptfs` | RW | Linux 的堆栈加密文件系统。参见\
  \ eCryptfs 网站。 |\n| `efivarfs` | RW | 用于管理 (U)EFI 变量的文件系统。 |\n| `erofs` | RO | 增强只读文件系统。\
  \ |\n| `ext2` | RW | 第二扩展文件系统。 |\n| `ext3` | RW | 带日志的 ext2 文件系统。 |\n| `ext4` |\
  \ RW | 带有增强的 ext3 文件系统。这是 GNU/LinuxLinux 文件系统。 |\n| `f2fs` | RW | 存友好文件系统。 |\n|\
  \ `fuse` | | 用户空间文件系统的驱动程序。 |\n| `hfs` | RW | Apple Mac OS 分级文件系统。 |\n| `hfsplus`\
  \ | RW | 带扩展的 hfs 文件系统。 |\n| `hpfs` | RW | OS/2 高性能文件系统。 |\n| `iso9660` | RO | ISO\
  \ 9660 光光文件系统。支持 Rock Ridge 扩展，使得使用它们的 DVD 或 CD-ROM 看起来像普通的（但只读的）文件系统。 |\n| `jffs2`\
  \ | RW | 日志闪存文件系统 2（用于嵌入式系统）。 |\n| `jfs` | RW | IBM 的 Linux 日志文件系统。 |\n| `nilfs2`\
  \ | RW | 具有连续快照的日志结构文件系统。 |\n| `ntfs` | RO | 支持 Windows NTFS 文件系统。 |\n| `ntfs3`\
  \ | RW | 更完整的 Windows NTFS 文件系统支持。 |\n| `ocfs2` | RW | Oracle 集群文件系统（分布式文件系统）。 |\n\
  \n\n\n\n\n| `overlayfs` | RW | 一种提供联合目录的文件系统。 |\n| `proc` | RW | 访问每个进程和内核信息。 |\n\
  | `qnx4` | RW | QNX4（一种小型实时操作系统）文件系统。 |\n| `qnx6` | RW | QNX6 文件系统。 |\n| `ramfs`\
  \ | RW | 用于创建 RAM 磁盘的文件系统。 |\n| `reiserfs` | RW | 一种先进的日志文件系统。 |\n| `romfs` | RO\
  \ | 用于创建简单只读 RAM 磁盘的文件系统。 |\n| `rootfs` | RW | `ramfs` 系统的特殊版本，用于启动引导过程。 |\n| `smbfs`\
  \ | RW | 对 SMB 文件系统（Windows 文件共享）的客户端支持。 |\n| `squashfs` | RO | 流行的压缩只读文件系统。 |\n\
  | `sysv` | RW | System V Release 2、Xenix、Minix 和 Coherent 文件系统。`coherent`、`minix`\
  \ 和 `xenix` 是别名。 |\n| `tmpfs` | RW | 内存磁盘文件系统，支持动态增长。 |\n| `ubifs` | RW | 无排序块映像（Unsorted\
  \ Block Images）；一种闪文件系统。 |\n| `udf` | RO | DVD-ROM 使用的 UDF 文件系统格式。 |\n| `ufs` |\
  \ RO, RW | BSD 快速文件系统；现代系统支持读写。 |\n| `umsdos` | RW | `vfat` 的扩展，使其看起来更像 Unix 文件系统。\
  \ |\n| `vboxsf` | RW | 提供 VirtualBox 共享文件夹的文件系统。 |\n| `vfat` | RW | 所有 MS-DOS/Windows\
  \ FAT 文件系统的变体。`msdos` 和 `fat` 是其组件。 |\n| `virtiofs` | RW | 提供半虚拟化客户访问宿主机系统的文件系统。\
  \ |\n| `vxfs` | RW | Veritas VxFS 日志文件系统。 |\n| `xfs` | RW | 由 SGI 为 Linux 开发的高性能日志文件系统。请参考关于\
  \ XFS 的内核文档。 |\n| `zonefs` | RW | 用于分区块设备（闪存）的文件系统。 |\n\n**表 8.1：** 部分支持的 Linux\
  \ 文件系统\n\n[`https://launchpad.net/ecryptfs`](https://launchpad.net/ecryptfs)\n\n\
  [`https://docs.kernel.org/admin-guide/xfs.html`](https://docs.kernel.org/admin-guide/xfs.html)\n\
  \n表 8.1 中的“RO”标识意味着这些类型的文件系统可以挂载并读取，但不能在上面写入文件或从上面删除文件。（这可能会随时间变化；请检查您的系统文档。）对于某些系统，它们是只读的是因为底层介质本身是只读的；对于其他系统，是因为文件系统支持尚未完全完善。\n\
  \n### 8.1.3 挂载文件系统：`mount`\n\n`mount` 命令用于挂载文件系统，将其内容连接到系统文件层次的挂载层级中。在 GNU/Linux\
  \ 下，这相当复杂，因为它必须处理所有已知的文件系统类型及其选项。通常只有 `root` 用户可以运行 `mount`，尽管可以为某些情况设置例外，这将在本书稍后部分讨论。\n\
  \n你使用 `-t` 选项指定文件系统类型：\n\n```\nmount [ options ] device mount-point\n```\n\n例如（`#`\
  \ 是 `root` 提示符）：\n\n```\n# mount -t iso9660 /dev/dvd /mnt/dvd               挂载 DVD\n\
  # mount -t vfat /dev/sdb1 /mnt/flash               挂载 MS-DOS USB 闪器\n# mount -t\
  \ nfs files.example.com:/ /mnt/files      挂载 NFS 文件系统\n```\n\n你可以使用 `-t auto` 强制\
  \ `mount` 猜测文件系统类型。这通常有效，但如果你确定自己拥有什么种类型的文件系统，提供类型会有帮助，并可以避免 `mount` 猜测错误的概率。`mount`\
  \ 默认就会进行这种猜测，因此 `-t auto` 并不是必须。\n\nGNU/Linux 系统通过回环设备（loopback device）提供了一种特殊的挂载方式。通过这种方式，包含在普通文件中的文件系统映像可以像实际设备一样被挂载。这种能力非常有用，例如对于\
  \ CD-ROM 或 DVD 映像。它允许你创建一个映像并进行尝试，而无需将其刻录到可写光盘上并挂载光盘。以下示例使用了 Ubuntu MATE 桌面 24.04.2\
  \ DVD 映像：\n\n```\n# ls -lh ubuntu-mate-24.04.2-desktop-amd64.iso               \
  \   检查 CD 映像文件\n-rw-rw-r-- 1 arnold arnold 4.1G Feb 18 12:54 ubuntu-mate-24.04.2-desktop-amd64.iso\n\
  # mkdir /mnt/dvd                                                  创建挂载点\n# mount\
  \ -t iso9660 -o ro,loop \\\n>          ubuntu-mate-24.04.2-desktop-amd64.iso /mnt/dvd\
  \         挂载映像\n# cd /mnt/dvd                                                  \
  \   进入目录\n# ls                                                              查看文件\n\
  boot          casper  EFI      md5sum.txt  preseed\nboot.catalog  dists   install\
  \  pool        ubuntu\n# cd                                                    \
  \          退出目录\n# umount /mnt/dvd                                             \
  \    卸载\n```\n\n以这种方式挂载 ISO 9660 映像在测试制作 CD/DVD 映像的脚本时特别有用。你可以在普通文件中创建一个映像，挂载它，并验证其布局是否正确。一旦你确信它是正确的，就可以将映像拷贝到可写磁盘（“刻录”磁盘）或\
  \ U 盘/闪盘。\n\n### 8.1.4 卸载文件系统：`umount`\n\n`umount` 命令用于卸载文件系统，将其内容从系统文件层次中移除。用法如下：\n\
  \n```\numount file-or-device\n```\n\n被卸载的文件系统不能处于忙状态。这意味着没有进程打开该文件系统上的文件，且没有进程将文件系统上的某个目录作为其当前工作目录。参考上一个示例：\n\
  \n```\n$ sudo su -                                               变为 root\n[sudo]\
  \ password for arnold:\n# mount -t iso9660 -o ro,loop \\                       \
  \     挂载 DVD 映像\n>     ubuntu-mate-24.04.2-desktop-amd64.iso /mnt/dvd\n# cd /mnt/dvd\
  \                                             进入目录\n# umount /mnt/dvd          \
  \                               尝试卸载 /mnt/dvd\numount: /mnt/dvd: target is busy.\
  \                         不起作用；它仍在使用中\n# cd                                    \
  \                  退出 /mnt/dvd\n# umount /mnt/dvd                              \
  \           再次尝试卸载 /mnt/dvd\n#                                                 \
  \        沉默是金金：卸载成功\n```\n\n### 8.2 用于文件系统管理的文件\n\n`/etc/fstab` 文件列出了可以挂载的文件系统。大多数文件系统在系统启动时自动挂载。其格式如下：\n\
  \n在 GNU/Linux 和大多数系统上。Solaris 和某些基于 System V Release 4 的系统使用 `/etc/vfstab`，可能具有不同的格式。\n\
  \n```\ndevice mount-point fs-type options dump-freq fsck-pass\n```\n\n（`dump-freq`\
  \ 和 `fsck-pass` 是与当前讨论无关的管理功能。）当生活还更简单时，`/etc/fstab` 看起来可能像这样：\n\n```\n$ cat /etc/fstab\n\
  # device      mount-point   type     options            freq passno\n/dev/hda3 \
  \    /             ext3     defaults              1 1     根文件系统\n/dev/hda5     /d\
  \            ext3     defaults              1 2\nnone          /dev/pts      devpts\
  \   gid=5,mode=620        0 0\nnone          /proc         proc     defaults   \
  \           0 0\nnone          /dev/shm      tmpfs    defaults              0 0\n\
  # Windows 分区:\n/dev/hda1     /win          vfat     noauto,defaults,user,uid=2076,gid=10\
  \  0 0\n/dev/hda3     swap          swap     defaults              0 0\n/dev/cdrom\
  \    /mnt/cdrom    iso9660  noauto,owner,ro       0 0     全局可挂载\n/dev/fd0      /mnt/floppy\
  \   auto     noauto,owner          0 0     软盘，同上\n```\n\n今天，磁盘通常使用通用唯一标识符（UUID）来识别。幸运的是，`/etc/fstab`\
  \ 中的注释提供了一些关于关联实际设备的提示。例如，在我们的当前系统上，该文件如下所示：\n\n\n\n\n\n```\n$ cat /etc/fstab\n\
  # /etc/fstab: static file system information.\n#\n# Use 'blkid' to print the universally\
  \ unique identifier for a\n# device; this may be used with UUID= as a more robust\
  \ way to name devices\n# that works even if disks are added and removed. See fstab(5).\n\
  #\n# <file system> <mount point>   <type>  <options>       <dump>  <pass>\n# / was\
  \ on /dev/nvme0n1p3 during installation\nUUID=fb2e8411-852c-486e-9d6d-cf24d08d2039\
  \ /         ext4    errors=remount-ro  0   1\n# /boot/efi was on /dev/nvme0n1p1\
  \ during installation\nUUID=BCFA-8C70  /boot/efi       vfat    umask=0077      0\
  \       1\n# /home was on /dev/nvme0n1p4 during installation\nUUID=1af92cc0-14e8-4619-9983-55b9ca0a3a41\
  \ /home     ext4    defaults     0   2\n```\n\n允许以 `#` 开头的注释。稍后将对各种选项进行讨论，参见第 8.2.1\
  \ 节“使用挂载选项”，第 230 页。\n\n相同的文件格式也用于 `/etc/mtab`，`mount` 命令在文件系统挂载时会将相关信息写入该文件；`umount`\
  \ 则在文件系统卸载时从该文件中删除这些信息：\n\n```bash\n$ cat /etc/mtab\nsysfs /sys sysfs rw,nosuid,nodev,noexec,relatime\
  \ 0 0\nproc /proc proc rw,nosuid,nodev,noexec,relatime 0 0\nudev /dev devtmpfs rw,nosuid,relatime,size=7958168k,nr_inodes=1989542,mode=755,inode64\
  \ 0 0\ndevpts /dev/pts devpts rw,nosuid,noexec,relatime,gid=5,mode=620,ptmxmode=000\
  \ 0 0\ntmpfs /run tmpfs rw,nosuid,nodev,noexec,relatime,size=1604576k,mode=755,inode64\
  \ 0 0\n/dev/nvme0n1p3 / ext4 rw,relatime,errors=remount-ro 0 0\n...\nbinfmt_misc\
  \ /proc/sys/fs/binfmt_misc binfmt_misc rw,nosuid,nodev,noexec,relatime 0 0\n/dev/nvme0n1p4\
  \ /home ext4 rw,relatime 0 0\n...\n```\n\n事实上，`/etc/mtab` 是 `/proc/self/mounts`\
  \ 的符号链接，后者是内核提供的一个特殊文件。在 Linux 以外的系统上，`/etc/mtab` 通常是一个真实文件。\n\n### 8.2.1 使用挂载选项\n\
  \n`mount` 命令支持用于控制内核允许或不允许对文件系统执行的操作的选项。这些选项相当多。在命令行中，只有两个真正有用：\n\n*   `ro`\n  \
  \  将文件系统挂载为只读。这对于格式化后的 CD-ROM 和 DVD 等只读介质是必要的。（一次性写入的 CD 和 DVD 介质不属于本文的讨论范围。）\n\n\
  *   `loop`\n    使用回环设备将普通文件视为文件系统。我们之前展示过这方面的示例（参见第 8.1.3 节“挂载文件系统：`mount`”，第 225\
  \ 页）。\n\n选项通过 `-o` 命令行选项传递，并可以用逗号隔开进行分组。例如，这里是之前使用的命令行：\n\n```bash\nmount -t iso9660\
  \ -o ro,loop ubuntu-mate-24.04.2-desktop-amd64.iso /mnt/dvd\n```\n\n其余选项旨在用于 `/etc/fstab`（尽管它们也可以在命令行中使用）。以下列表提供了我们认为对日常使用最重要的几个选项：\n\
  \n*   `auto, noauto`\n    标记为 `auto` 的文件系统将在系统启动时通过 `mount -a`（挂载所有文件系统）进行挂载。`noauto`\
  \ 文件系统必须手动挂载。此类文件系统仍然出现在 `/etc/fstab` 中，与其他文件系统一起。（例如，参见之前显示的早期 `/etc/fstab` 文件中\
  \ `/win` 的条目。）\n\n*   `defaults`\n    使用默认选项 `rw`、`suid`、`dev`、`exec`、`auto`、`nouser`\
  \ 和 `async`。（`async` 是一个增加 I/O 吞吐量的高级选项。）手册页指出，真正的默认取决于挂载的文件系统类型。\n\n*   `dev, nodev`\n\
  \    允许（不允许）在文件系统使用字符设备或块设备文件。\n\n*   `exec, noexec`\n    允许（不允许）在文件系统上执行二进制可执行文件。\n\
  \n*   `rw`\n    将文件系统挂载为读/写。\n\n*   `suid, nosuid`\n    支持（不支持）在文件系统的可执行文件上设置 setuid\
  \ 和 setgid 位。\n\n*   `user, nouser`\n    允许（不允许）任何用户挂载此文件系统。这对于 CD-ROM 和 DVD 非常有用；即使你是在单用户工作站上，不需要为了挂载磁盘而切换到\
  \ `root` 也是方便的。只有挂载文件系统的用户才能卸载它。`user` 隐含 `noexec`、`nosuid` 和 `nodev` 选项。\n\n`nodev`、`noexec`\
  \ 和 `nosuid` 选项对于可移动介质上的文件系统安全特别有价值。考虑一个学生环境，允许学生挂载自己的 USB 驱动器。轻而地创建一个带有 setuid-`root`\
  \ shell 或 world 可写硬盘设备文件的文件系统，可能会让野心勃勃的用户更改系统文件的权限。这些选项防止了这种手段，或者至少让它们变得更加困难。\n\n\
  每个文件系统都有其特定的附加选项。对于 `ext4` 来说，一个重要的选项是 `grpid`。我们将该选项的讨论推迟到第 11.4.1 节](#ch11.xhtml_ch11lev2sec3)“新文件和目录的默认组”，第\
  \ 391 页”。所有支持的文件系统的详情可以在 `mount`(8) 手册页中找到。\n\n作为一个具体的示例，重新考虑我们系统之前版本中 Windows 分区的行：\n\
  \n```bash\n# device   mount-point  type  options                            freq\
  \ passno\n/dev/hda1  /win         vfat  noauto,defaults,user,uid=2076,gid=10 0 0\n\
  ```\n\n`noauto` 选项防止 Windows 分区在启动时被挂载。`defaults` 选项等同于 `rw,suid,dev,exec,async`。`user`\
  \ 选项允许我们在不是 `root` 的情况下挂载文件系统。`uid=` 和 `gid=` 选项强制 `/win` 中的文件属于我们（普通用户），这样我们在操作该分区时就不需要是\
  \ `root`。\n\n### 8.2.2 与已挂载的文件系统一起：`getmntent()`\n\n`/etc/fstab`、`/etc/mtab` 和 `/proc/self/mounts`\
  \ 都可以通过 `getmntent()` 系列程序进行程序化读取：\n\n```c\n#include <stdio.h>                 \
  \                               GLIBC\n#include <mntent.h>\n\nFILE *setmntent(const\
  \ char *filename, const char *type);\nstruct mntent *getmntent(FILE *filep);\nint\
  \ addmntent(FILE *filep, const struct mntent *mnt);\nint endmntent(FILE *filep);\n\
  char *hasmntopt(const struct mntent *mnt, const char *opt);\n```\n\n`setmntent()`\
  \ 打开包含挂载点条目的的文件。`filename` 参数是要打开的文件。`type` 参数类似于 `fopen()` 的第二个参数，表示读、写或读/写访问。（考虑\
  \ `mount` 命令，它必须为挂载的每个文件系统向 `/etc/mtab`条目，而 `umount` 则必须删除一个。）返回的 `FILE *` 类型值随后用于其余程序。\n\
  \n这一陈述不再适用于 GNU/Linux，内核内核更新 `/proc/self/mounts`，而 `/etc/mtab` 只是它的符号链接。\n\n`getmntent()`\
  \ 读取文件，返回指向 `static struct mntent` 的指针，其中填充了相应的值。该 `static` 存储在每次调用时都会被覆盖。当没有更多条目时，返回\
  \ `NULL`。（这与读取密码和组文件的程序类似；参见第 6.3 节](#ch06.xhtml_ch06lev1sec3)“用户名和组名”，第 190 页。）\n\
  \n`addmntent()` 用于向打开文件的末尾添加更多信息；它供 `mount` 使用。\n\n`endmntent()` 关闭打开的文件；在处理完成后调用它。*不要*只调用\
  \ `fclose()`；与 `FILE *` 变量相关的其他内部数据结构可能需要清理。\n\n\n\n\n\n`hasmntopt()` 是一个更专业的函数。它扫描作为第一个参数传递的\
  \ `struct mntent`，查找与第二个参数匹配的挂载选项。如果找到了该选项，它将返回匹配子串的地址；否则，返回 `NULL`。\n\n`struct\
  \ mntent` 中的字段直接对应 `/etc/fstab` 文件中的字段。它的结构如下：\n\n```\nstruct mntent {\n   char\
  \ *mnt_fsname;      /* 文件系统所在的设备或服务器。 */\n   char *mnt_dir;         /* 挂载点目录。 */\n\
  \   char *mnt_type;        /* 文件系统类型：ext4, nfs, 等。 */\n   char *mnt_opts;      \
  \  /* 文件系统的逗号分隔的选项。 */\n   int mnt_freq;          /* 储储频率（以天为单位）。 */\n   int mnt_passno;\
  \        /* ‘fsck’的检查序号。 */\n};\n```\n\n处理挂载文件系统的标准范式是编写一个外部循环来读取 `/etc/mtab`，每次处理一个\
  \ `struct mntent`。我们的第一个示例 `ch-mounting-mounted.c` 正是这么做的：\n\n```\n 1  /* ch-mounting-mounted.c\
  \ --- 打印挂载文件系统列表 */\n 2\n 3  /* 注意：GNU/Linux 特有！ */\n 4\n 5  #include <stdio.h>\n\
  \ 6  #include <errno.h>\n 7  #include <mntent.h> /* 用于 getmntent() 等 */\n 8  #include\
  \ <stdlib.h>\n 9  #include <string.h>\n10  #include <unistd.h> /* 用于 getopt() */\n\
  11\n12  void process(const char *filename);\n13  void print_mount(const struct mntent\
  \ *fs);\n14\n15  char *myname;\n16\n17  /* main --- 处理选项 */\n18\n19  int\n20  main(int\
  \ argc, char **argv)\n21  {\n22      int c;\n23      char *file = \"/etc/mtab\"\
  ;   /* 默认读取的文件 */\n24\n25      myname = argv[0];\n26      while ((c = getopt(argc,\
  \ argv, \"f:\")) != -1) {\n27          switch (c) {\n28          case 'f':\n29 \
  \             file = optarg;\n30              break;\n31          default:\n32 \
  \             fprintf(stderr, \"usage: %s [-f fstab-file]\\n\", argv[0]);\n33  \
  \            exit(1);\n34          }\n35      }\n36\n37      process(file);\n38\
  \      return 0;\n39  }\n40\n41  /* process --- 从文件读取 struct mntent 结构体 */\n42\n\
  43  void\n44  process(const char *filename)\n45  {\n46      FILE *fp;\n47      struct\
  \ mntent *fs;\n48\n49      fp = setmntent(filename, \"r\");\n50      if (fp == NULL)\
  \ {\n51          fprintf(stderr, \"%s: %s: could not open: %s\\n\",\n52        \
  \      myname, filename, strerror(errno));\n53          exit(1);\n54      }\n55\n\
  56      while ((fs = getmntent(fp)) != NULL)\n57          print_mount(fs);\n58\n\
  59      endmntent(fp);\n60  }\n61\n62  /* print_mount --- 打印单个挂载项 */\n63\n64  void\n\
  65  print_mount(const struct mntent *fs)\n66  {\n67      printf(\"%s %s %s %s %d\
  \ %d\\n\",\n68          fs->mnt_fsname,\n69          fs->mnt_dir,\n70          fs->mnt_type,\n\
  71          fs->mnt_opts,\n72          fs->mnt_freq,\n73          fs->mnt_passno);\n\
  74  }\n```\n\n与我们目前为止看到的大多数程序不同，这个程序是 Linux 特有的。许多 Unix 系统也有类似的例程，但不能保证它们是完全相同的。\n\
  \n默认情况下，`ch-mounting-mounted` 读取 `/etc/mtab`，打印关于每个挂载文件系统的信息。`-f` 选项允许你指定不同的读取的文件，例如\
  \ `/etc/fstab`。\n\n`main()` 函数处理命令行（第 26–35 行）并对指定的文件调用 `process()`。（该程序遵循了我们的标准模板代码。）\n\
  \n`process()` 随后打开文件（第 49 行），并遍历返回的每个文件系统（第 56–57 行）。完成后，它关闭文件（第 59 行）。\n\n`print_mount()`\
  \ 函数打印 `struct mntent` 中的信息。输出结果与 `cat /etc/mtab` 的结果非常相似：\n\n```\n$ ch-mounting-mounted\
  \                 运行该程序\nsysfs /sys sysfs rw,nosuid,nodev,noexec,relatime 0 0\n\
  proc /proc proc rw,nosuid,nodev,noexec,relatime 0 0\nudev /dev devtmpfs rw,nosuid,relatime,size=7958160k,nr_inodes=1989540,mode=755,inode64\
  \ 0 0\ndevpts /dev/pts devpts rw,nosuid,noexec,relatime,gid=5,mode=620,ptmxmode=000\
  \ 0 0\ntmpfs /run tmpfs rw,nosuid,nodev,noexec,relatime,size=1604576k,mode=755,inode64\
  \ 0 0\n/dev/nvme0n1p3 / ext4 rw,relatime,errors=remount-ro 0 0\n...\n/dev/nvme0n1p4\
  \ /home ext4 rw,relatime 0 0\n...\n```\n\n### 8.3 获取每每个文件系统的信息\n\n打印每个文件系统的信息固然不错，但并不有趣。一旦我们知道某个挂载点代表一个文件系统，我们就想要获取*关于*该文件系统的信息。这允许我们执行诸如打印\
  \ `df` 和 `df -i` 获取的信息的操作：\n\n```\n$ df                                        \
  \              显示空间\nFilesystem     1K-Used Available Mounted on\ntmpfs        \
  \   1604576      123456    1481120 /run\n/dev/nvme0n1p3  1048576      123456   \
  \  925120 /\n```\n\n```\n$ df -i                                               \
  \    显示 节点\nFilesystem       Inodes      Free Use% Mounted on\ntmpfs           \
  \ 1604576  1604576        0% /run\n/dev/nvme0n1p3    821072     821072        0%\
  \ /\n```\n\n#### 8.3.1 POSIX 风格：`statvfs()` 和 `fstatfs()`\n\n早期的 Unix 系统只有一种文件系统。对于它们来说，只要\
  \ `df` 读取每个文件系统的超级块，提取相关的统计数据并进行格式化输出就足够了。（超级块通常是第二个块；第一个是*启动块*。）\n\n然而，在现代世界中，这种方法是不可行的。POSIX\
  \ 提供了两个函数来访问这些信息。主函数是 `statvfs()`。（“vfs”部分来自底层的 SunOS 技术，后来用于 System V Release 4，被称为*虚拟文件系统*）。有两个函数：\n\
  \n```\n#include <sys/types.h>\n#include <sys/statvfs.h>\n\nint statvfs(const char\
  \ *path, struct statvfs *buf);\nint fstatvfs(int fd, struct statvfs *buf);\n```\n\
  \n`statvfs()` 使用路径名处理任何文件；它返回关于包含该文件的文件系统信息。`fstatvfs()` 一个打开的文件描述符作为第一个参数；在这里，返回的信息也是关于包含该文件的文件系统。`struct\
  \ statvfs` 包含以下成员：\n\n```\nstruct statvfs {\n    unsigned long int f_bsize;    \
  \        块大小\n    unsigned long int f_frsize;           片段大小（''基本块大小''）\n    fsblkcnt_t\
  \ f_blocks;                  块的总数\n    fsblkcnt_t f_bfree;                   空闲块总数\n\
  \    fsblkcnt_t f_bavail;                  可用块数（ ≤ f_bfree）\n    fsfilcnt_t f_files;\
  \                   节点总数\n    fsfilcnt_t f_ffree;                   空闲节点总数\n   \
  \ fsfilcnt_t f_favail;                  可用节点数（ ≤ f_files）\n    unsigned long int\
  \ f_fsid;             文件系统 ID\n    unsigned long int f_flag;             标志：ST_RDONLY\
  \ 和/或 ST_NOSUID\n    unsigned long int f_namemax;          文件名最大长度\n};\n```\n\n\
  它所包含的信息足够编写 `df`：\n\n*   `unsigned long int f_bsize`\n\n\n\n\n块大小（block size）是进行\
  \ I/O 的优大小。文件系统尝试在磁盘的连续扇区上保留至少 `f_bsize` 字节的数据。（`sector` 是磁盘上最小的可寻址数据单元。通常，一个磁盘扇区为\
  \ 512 字节。）\n\n*   `unsigned long int f_frsize`\n    某些文件系统（如 BSD Fast Filesystem）区分了块（blocks）和块碎片（fragments）。总大小小于一个块的小文件会存储在若干个碎片中。这避免了磁盘空间的浪费（代价是增加了内核代码的复杂性）。碎片大小在创建文件系统时选定。\n\
  \n*   `fsblkcnt_t f_blocks`\n    文件系统中块的总数（以 `f_bsize` 为单位）。\n\n*   `fsblkcnt_t\
  \ f_bfree`\n    文件系统中的空闲块总数。\n\n*   `fsblkcnt_t f_bavail`\n    实际可以使用的块数。某些文件系统会预留百分比的文件系统块供超级用户使用，以防文件系统满。现代系统预留约百分之五，尽管该数字可以由管理员更改。（参见\
  \ GNU/Linux 系统上的 `tune2fs`(8) 和 Unix 系统上的 `tunefs`(8)。）\n\n*   `fsfilcnt_t f_files`\n\
  \    文件系统中 inode（POSIX 术语中称为“文件序列号”）的总数。该数字通常在创建文件系统时初始化并设为永久性。\n\n*   `fsfilcnt_t\
  \ f_ffree`\n    空闲 inode 的总数。\n\n*   `fsfilcnt_t f_favail`\n    实际可以使用的 inode 数。与块一样，一定百分比的\
  \ inode 被预留给超级用户。\n\n*   `unsigned long int f_fsid`\n    文件系统 ID。POSIX 未规定它代表什么，且它在\
  \ Linux 下似乎没有被使用。\n\n*   `unsigned long int f_flag`\n    提供文件系统信息的标志（flags）。POSIX\
  \ 规定了两个：`ST_RDONLY`，用于只读文件系统（如 DVD 或 CD-ROM），以及 `ST_NOSUID`，它禁止对可执行文件使用 setuid 和\
  \ setgid 权限位。GNU/Linux 系统提供了额外的标志；它们列在表 8.2 中。\n\n*   `unsigned long int f_namemax`\n\
  \    文件名的最大长度。这指的是路径中的每个单独组件——换句话说，目录项的最大长度。在编程中，你可以使用 `pathconf()` 处理此值，该函数在第 12.2.3\
  \ 节](#ch12.xhtml_ch12lev2sec3) “文件系统限制：`pathconf()` 和 `fpathconf()``,” 第 409 页中讨论。\n\
  \n| 标志 | POSIX | 含义 |\n| --- | --- | --- |\n| `ST_MANDLOCK` | | 强制强制锁定（参见第 16.2\
  \ 节](#ch16.xhtml_ch16lev1sec2), “文件锁定,” 第 558 页）。 |\n| `ST_NOATIME` | | 每次访问时不更新访问时间字段。\
  \ |\n| `ST_NODEV` | | 禁止通过设备文件访问。 |\n| `ST_NODIRATIME` | | 不更新目录的访问时间字段。 |\n| `ST_NOEXEC`\
  \ | | 禁止执行二进制文件。 |\n| `ST_NOSUID` | ✓ | 禁止使用 setuid 和 setgid 位。 |\n| `ST_RDONLY`\
  \ | ✓ | 文件系统是只读的。 |\n| `ST_RELATIME` | | 相对于 mtime/ctime 更新 atime；参见 `mount`(2)。\
  \ |\n| `ST_SYNCHRONOUS` | | 所有写入都是同步的（参见第 4.6.4 节](#ch04.xhtml_ch04lev2sec10), “重温\
  \ `open()`,” 第 104 页）。 |\n\n**表 8.2：** `f_flag` 的 GLIBC 值\n\n`fsblkcnt_t` 和 `fsfilcnt_t`\
  \ 类型定义在 `<sys/types.h>` 中。由于磁盘变得非常大，在现代系统中它们是 64 位类型。以下程序 `ch-mounting-statvfs.c`\
  \ 显示了如何使用 `statvfs()`：\n\n```\n 1  /* ch-mounting-statvfs.c --- demonstrate statvfs\
  \ */\n 2\n 3  /* NOTE: GNU/Linux specific! */\n 4\n 5  #include <stdio.h>\n 6  #include\
  \ <errno.h>\n 7  #include <mntent.h> /* for getmntent(), et al. */\n 8  #include\
  \ <stdlib.h>\n 9  #include <string.h>\n10  #include <unistd.h> /* for getopt() */\n\
  11  #include <sys/types.h>\n12  #include <sys/statvfs.h>\n13\n14  void process(const\
  \ char *filename);\n15  void do_statvfs(const struct mntent *fs);\n16\n17  int errors\
  \ = 0;\n18  char *myname;\n19\n20  /* main --- process options */\n21\n22  int\n\
  23  main(int argc, char **argv)\n24  {\n25      int c;\n26      char *file = \"\
  /etc/mtab\";   /* default file to read */\n27\n28      myname = argv[0];\n29   \
  \   while ((c = getopt(argc, argv, \"f:\")) != -1) {\n30          switch (c) {\n\
  31          case 'f':\n32              file = optarg;\n33              break;\n\
  34          default:\n35              fprintf(stderr, \"usage: %s [-f fstab-file]\\\
  n\", argv[0]);\n36              exit(1);\n37          }\n38      }\n39\n40     \
  \ process(file);\n41      return (errors != 0);\n42  }\n43\n44  /* process --- read\
  \ struct mntent from file */\n45  void\n46  process(const char *filename)\n47  {\n\
  48      FILE *fp;\n49      struct mntent *fs;\n50\n51      fp = setmntent(filename,\
  \ \"r\");\n52      if (fp == NULL) {\n53          fprintf(stderr, \"%s: %s: could\
  \ not open: %s\\n\",\n54              myname, filename, strerror(errno));\n55  \
  \        exit(1);\n56      }\n57\n58      while ((fs = getmntent(fp)) != NULL)\n\
  59          do_statvfs(fs);\n60      endmntent(fp);\n61  }\n```\n\n第 1–63 行与 `ch-mounting.c`\
  \ 基本相同。`main()` 处理命令行参数，`process()` 遍历每个挂载的文件系统。`do_statvfs()` 执行实际工作，为每个感兴趣的文件系统打印\
  \ `struct statvfs`：\n\n```\n65  /* do_statvfs --- Use statvfs and print info */\n\
  66\n67  void\n68  do_statvfs(const struct mntent *fs)\n69  {\n70      struct statvfs\
  \ vfs;\n71\n72      if (fs->mnt_fsname[0] != '/') /* skip nonreal filesystems */\n\
  73          return;\n74\n75      if (statvfs(fs->mnt_dir, &vfs) != 0) {\n76    \
  \      fprintf(stderr, \"%s: %s: statvfs failed: %s\\n\",\n77              myname,\
  \ fs->mnt_dir, strerror(errno));\n78          errors++;\n79          return;\n80\
  \      }\n81\n82      printf(\"%s, mounted on %s:\\n\", fs->mnt_dir, fs->mnt_fsname);\n\
  83      printf(\"\\tfbsize: %ld\\n\", (long)vfs.f_bsize);\n84      printf(\"\\tfrsize:\
  \ %ld\\n\", (long)vfs.f_frsize);\n85      printf(\"\\tblocks: %lu\\n\", (unsigned\
  \ long)vfs.f_blocks);\n86      printf(\"\\tfree: %lu\\n\", (unsigned long)vfs.f_bfree);\n\
  87      printf(\"\\tbavail: %lu\\n\", (unsigned long)vfs.f_bavail);\n88      printf(\"\
  \\tfiles: %lu\\n\", (unsigned long)vfs.f_files);\n89      printf(\"\\tffree: %lu\\\
  n\", (unsigned long)vfs.f_ffree);\n90      printf(\"\\tfavail: %lu\\n\", (unsigned\
  \ long)vfs.f_favail);\n91      printf(\"\\tfsid: %#lx\\n\", (unsigned long)vfs.f_fsid);\n\
  92\n93      printf(\"\\tflag: \");\n94      if (vfs.f_flag == 0)\n95          printf(\"\
  (none)\\n\");\n96      else {\n97          if ((vfs.f_flag & ST_RDONLY) != 0)\n\
  98              printf(\"ST_RDONLY \");\n99          if ((vfs.f_flag & ST_NOSUID)\
  \ != 0)\n100              printf(\"ST_NOSUID\");\n101          printf(\"\\n\");\n\
  102      }\n103\n104      printf(\"\\tfnamemax: %ld\\n\", (long)vfs.f_namemax);\n\
  105  }\n```\n\n第 72–73 行跳过了不是基于真实磁盘设备的文件系统。这意味着像 `/proc` 或 `/dev/pts` 这样的文件系统会被忽略。（承认，这种检查是一种启发式方法，但它是有效的：在\
  \ `/etc/mtab` 中，挂载的设备通过完整的设备路径列出——例如 `/dev/hda1`。）第 93–102 行处理的是*标志*（flags）：存在或不存在的单比特信息。请见后续小节关于标志位在\
  \ C 代码中的讨论。这里是 `ch-mounting-statvfs` 的输出：\n\n\n\n\n\n```\n$ ch-mounting-statvfs\
  \                   Run the program\n/, mounted on /dev/nvme0n1p3:           Results\
  \ for ext4 filesystem\n    f_bsize: 4096\n    f_frsize: 4096\n    f_blocks: 12224681\n\
  \    f_bfree: 6836878\n    f_bavail: 6207784\n    f_files: 3129344\n    f_ffree:\
  \ 2581271\n    f_favail: 2581271\n    f_fsid: 0x5768a155354b4366\n    f_flag:\n\
  \    f_namemax: 255\n...\n/home, mounted on /dev/nvme0n1p4:\n    f_bsize: 4096\n\
  \    f_frsize: 4096\n    f_blocks: 107118896\n    f_bfree: 56999265\n    f_bavail:\
  \ 51539566\n    f_files: 27279360\n    f_ffree: 26493955\n    f_favail: 26493955\n\
  \    f_fsid: 0x587ce2de79797a83\n    f_flag:\n    f_namemax: 255\n...\n```\n\n###\
  \ **注意**\n\n尽管 POSIX 规定了 `statvfs()` 和 `fstatvfs()`，但并非所有系统都支持它们，或者支持得正确。许多系统（包括后文描述的\
  \ Linux）有自己的系统调用来提供类似的信息。GNU `df` 使用库例程来获取文件系统信息；该例程的源文件充满了许多不同系统的 `#ifdef`。当前代码倾向于使用\
  \ `statvfs()`，如果不可用，则回退到其他机制。\n\n### 8.3.1.1 编程旁插：位标志（Bit Flags）\n\n一种在许多情况下都适用的常用技术是有一组\
  \ `flag` 值；当某个标志被 `set`（即为真）时，某个事实为真或某个条件适用。标志值通过 `#define` 符号的符号常量或 `enum` 来定义。在本章中，`fts()`\
  \ API（后文将描述）也使用了标志。对于 `struct statvfs` 结构体字段 `f_flag`，只有两个标准标志：\n\n```\n#define\
  \ ST_RDONLY    1     /* 只读文件系统 */        示例定义\n#define ST_NOSUID    2     /* 不允许\
  \ setuid/setgid */\n```\n\n标志值需要是 2 的幂次。当有很多有很多值时，有不同的编写方法。一种方法是使用 `<<` 运算符的链：\n\
  \n```\n#define SYM1   (1<<0)\n#define SYM2   (SYM1<<1)\n#define SYM3   (SYM2<<1)\n\
  ...\n```\n\n另一种是使用十六进制值：\n\n```\n#define SYM1   0x01\n#define SYM2   0x02\n...\n\
  #define SYM14  0x0e\n#define SYM15  0x0f\n...\n```\n\n与其使用 `#define` 创建的常量，使用 `enum`\
  \ 值也十分常见。后者的优势是，当使用调试器时，这些值会显示为它们自身的值。\n\n你甚至可能看到 `enum` 与宏结合使用：\n\n```c\nenum my_symbols\
  \ {\n    SYM1 = 0x01,\n#define SYM1 SYM1\n    SYM2 = 0x02,\n#define SYM2 SYM2\n\
  ...\n    SYM14 = 0x0e,\n#define SYM14 SYM14\n    SYM15 = 0x0f,\n#define SYM15 SYM15\n\
  };\n```\n\n（记住在 C 语言中，如果你将一个宏定义为其自身，该值将保持不变且不会引起递归展开。）为什么要这样做？这允许你通过 `#ifdef` 检查一个值是否被定义，同时仍让符号值在调试器中显示。）\n\
  \n从物理上讲，每个符号常量代表 `f_flag` 值中不同的位位置（因此要求它们是 2 的幂次）。从逻辑上讲，每个值代表一个独立的状态信息位——也就是说，对于这个特定的\
  \ `struct statvfs` 实例，某个事实或条件为真或假。\n\n标志使用 C 位运算符进行设置、测试和清除。例如，`statvfs()` 将使用位或（OR）运算符设置这些标志：\n\
  \n```c\nint statvfs(const char *path, struct statvfs *vfs)\n{\n    … 填充大部分 *vfs\
  \ …\n    vfs->f_flag = 0;                         确保它从零开始\n    if (文件系统是只读的)\n \
  \        vfs->f_flag |= ST_RDONLY;           添加 ST_RDONLY 标志\n    if (文件系统不允许 setuid)\n\
  \         vfs->f_flag |= ST_NOSUID;           添加 ST_NOSUID 标志\n    … 例程剩余部分 …\n\
  }\n```\n\n位与（AND）运算符测试标志是否被设置，而位与与取反（COMPLEMENT）运算符的组合用于清除一个或多个标志：\n\n```c\nif ((vfs.f_flag\
  \ & ST_RDONLY) != 0)               如果 ST_RDONLY 标志被设置则为真\n\nvfs.f_flag &= ~(ST_RDONLY|ST_NOSUID);\
  \            清除两个标志\n```\n\n如果你以前没用过位运算符，它们会令人生生畏。然而，刚刚显示的示例代码代表了常见的 C 语言用法。仔细研究每种操作；也许可以自己画几张图展示这些运算符是如何工作的。一旦你理解了它们，就可以训练自己将这些运算符识别为`管理标志值的高级操作`，而不是将它们视为`低级位操作`。\n\
  \n使用标志值的原因是它们可以极大节省数据空间。单个 `unsigned long` 字段允许你存储至少 32 个独立的位信息。GLIBC（截至本文编写时）为\
  \ `f_flag` 字段定义了 13 个不同的标志。如果你为每个标志使用单独的 `char` 字段，那将使用 13 字节，而不是 `unsigned long`\
  \ 仅使用的 4 字节。如果你有 32 个标志，将是 32 字节而不是只有 4 字节！\n\n查看 GNU/Linux 系统上的 `/usr/include/bits/statvfs.h`。其中三个没有在\
  \ `statvfs`(3) 手册页中记录。\n\n#### 8.3.2 Linux ：`statfs()` 和 `fstatfs()`\n\n`statfs()`\
  \ 和 `fstatfs()` 系统调用是 Linux 特有的。它们的声明如下：\n\n```c\n#include <sys/types.h>       \
  \                            GLIBC\n#include <sys/vfs.h>\nint statfs(const char\
  \ *path, struct statfs *buf);\nint fstatfs(int fd, struct statfs *buf);\n```\n\n\
  与 `statvfs()` 和 `fstatvfs()` 一一样，这两个版本分别作用于文件名或打开的文件描述符。`struct statfs` 如下：\n\n\
  ```c\nstruct statfs {\n   __fsword_t f_type;     /* 文件系统类型（见下文） */\n   __fsword_t\
  \ f_bsize;    /* 最佳传输块大小 */\n   fsblkcnt_t f_blocks;   /* 文件系统中的总数据块 */\n   fsblkcnt_t\
  \ f_bfree;    /* 文件系统中的空闲块 */\n   fsblkcnt_t f_bavail;   /* 非特权用户可用的空闲块 */\n   fsfilcnt_t\
  \ f_files;    /* 文件系统中的节点数 */\n   fsfilcnt_t f_ffree;    /* 文件系统中的空闲节点数 */\n   fsid_t\
  \     f_fsid;     /* 文件系统 ID */\n   __fsword_t f_namelen;  /*文件名最大长度 */\n   __fsword_t\
  \ f_frsize;   /* 块大小（Linux 2.6） */\n   __fsword_t f_flags;    /* 文件系统挂载标志（Linux\
  \ 2.6.36） */\n   __fsword_t f_spare[xxx]; /* 保留字节 */\n};\n```\n\n这些字段与 `statvfs`\
  \ 中的字段类似。在 GLIBC 中，POSIX `statvfs()` 和 `fstatvfs()` 函数是 `statfs()` 和 `fstatfs()`\
  \ 的封装，将值从一种 `struct` 拷贝到另一种。\n\n使用 `statfs()` 或 `fstatfs()` 的优势是它们是系统调用。内核直接返回信息。使用这些调用的主要缺点是它们是\
  \ Linux 特有的。\n\n`struct statfs` 中的一个字段值得特别注意。这是 `f_type` 字段，它指示文件系统的类型。该值是文件系统的魔数，从超级块中提取。*statfs*(2)\
  \ 手册页列出了常用文件系统及其魔数，我们在 `ch-mounting-statfs.c` 中使用了它们。（遗憾的是，没有独立的 `#include` 文件。）列出了\
  \ 84(!) 种不同的文件系统类型；我们在书中省略了大部分以节省空间，但书中 GitHub 上的代码是完整的。\n\n\n\n\n\n```c\n 1  /*\
  \ ch-mounting-statfs.c --- demonstrate Linux statfs */\n  2\n  3  /* NOTE: GNU/Linux\
  \ specific! */\n  4\n  5  #include <stdio.h>\n  6  #include <errno.h>\n  7  #include\
  \ <mntent.h> /* for getmntent(), et al. */\n  8  #include <stdlib.h>\n  9  #include\
