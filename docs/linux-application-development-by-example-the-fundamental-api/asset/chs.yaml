  10. 加分题：为什么 C 编译器无法完全忽略 `register` 关键字？提示：什么操作无法应用于 `register` 变量？\n\n## 第 3 章\n\
  \n## 用户级内存管理\n\n没有存储数据的内存，程序无法完成任何工作（或者说，无法完成任何*有用*的工作）。现实程序无法依赖固定大小的缓冲区或数组。它们必须能够处理不同大小的输入。这导致了对动态分配内存的使用——在运行时而不是编译时分配内存。这就是\
  \ GNU “无限制”原则的实现方式。\n\n由于动态分配内存是非常基础的，我们在查看其他内容之前先介绍它。我们的讨论专注于进程及其内存的用户视角，与 CPU\
  \ 架构无关。\n\n### 3.1 Linux/Unix 地址空间\n\n根据工作定义，我们说*进程*是运行中的程序。这意味着操作系统已将程序的执行文件加载到内存中，安排它可以访问命令行参数和环境变量，并启动了它。进程分配了五个概念上不同的区域：\n\
  \n*   *代码*\n\n    通常称为*文本段*，这是执行指令所在的区域。Linux 和 Unix 的安排方式使得相同程序的多个运行实例可以共享代码；内存中同时只有一份相同程序的指令副本（这对运行中的程序是透明的）。可执行文件中包含文本段的部分是*文本节*。\n\
  \n*   *初始化数据*\n\n    初始化为非零值的全局和 `static` 数据存储在*数据段*中。运行相同程序的每个进程都有自己的数据段。可执行文件中包含数据段的部分是*数据节*。\n\
  \n*   *零初始化数据*\n\n\n\n\n\n默认初始化为零的全局和 `static` 数据存储在俗称为 `BSS` 的区域中^(1)。运行相同程序的每个进程都有自己的\
  \ BSS 区域。运行时，BSS 数据被放置在数据段（data segment）。在可执行文件中，它存储在 `BSS section` 中。\n\n^(1) BSS\
  \ 是“Block Started by Symbol”的缩写，源自 IBM 7094 汇编器的术语。IBM 7094 于 1962 年 9 月推出。\n\n\
  Linux/Unix 可执行文件的格式使得只有初始化为非零值的变量才会在可执行文件的磁盘文件中占用空间。因此，一个声明为 `static char somebuf[2048];`\
  \ 的大数组（它会自动填充零）不会占用 2 KB 的磁盘空间。（某些编译器提供了选项，允许将零初始的数据放入数据段中。）\n\n#### 堆（Heap）\n\n\
  `heap` 是动态内存（通过 `malloc()` 等函数获取）来源。随着在堆上分配内存，进程的地址空间会增长，你可以通过 `ps` 命令观察运行中的程序看到这一点。\n\
  \n虽然可以将内存归给系统并缩小进程的地址空间，但这种情况很少见^(2)（我们将在释放不再需要的动态内存与缩小地址空间区分开来；这在本章稍后会详细讨论。）\n\n\
  ^(2) 某些分配器在分配“较大”时（无论如何定义“大”）确实会将释放内存内存给系统。但你不应该依赖这一点。\n\n堆通常是“向上增长”的。这意味着连续添加到堆中的项，其地址在数值上大于之前的项。堆紧接在数据段的\
  \ BSS 区域之后开始也是常态。\n\n#### 栈（Stack）\n\n`stack segment` 是分配局部变量的地方。局部变量是所有在函数体左大括号（或其他左括号）内部声明的变量，且未被定义为\
  \ `static`。\n\n在大多数架构上，函数参数也放置在栈上，此外还有编译器生成的“不可见”账目记录信息，例如用于函数返回值的空间，以及代表从函数返回到调用者的返回地址存储空间。（某些架构使用寄存器完成所有这些操作。）\n\
  \n正是使用栈处理函数参数和返回值，使得编写*递归*函数（调用自身的函数）变得方便。\n\n存储在栈上的变量在包含它们的函数返回时会“消失”；栈空间会被后续的函数调用用。\n\
  \n在大多数现代架构上，栈是“向下增长”的，这意味着调用链中更深的项位于数值更小的地址。\n\n当程序运行时，初始化数据、BSS 和堆区域通常被放置在一个单一的连续区域内：数据段。栈段和代码段（code\
  \ segment）与数据段以及彼此是分开的。这如图图 3.1\n\n**图 3.1：** Linux/Unix 进程地址空间\n\n尽管理论上栈和堆可能会相互增长，但操作系统防止了这种情况的发生，任何试图让这种情况发生的程序都是在自找麻烦。这在现代系统上尤为如此，因为进程地址空间很大，栈顶与堆尾之间的差距非常大。\n\
  \n不同的内存区域可以分配不同的硬件内存保护。例如，文本段（text segment）可能被标记为“只执行”，而数据段和栈段禁用执行权限。这种做法可以防止某些类型的安全攻击。当然，细节取决于硬件和操作系统，并可能随时间而变化。值得注意的是，标准\
  \ C 和 C++ 都允许将 `const` 项放置在只读内存中。不同段之间的关系总结在表 3.1 中。\n\n| **程序内存** | **地址空间段** |\
  \ **可执行文件节区** |\n| --- | --- | --- |\n| 代码 | Text | Text |\n| 初始化数据 | Data | Data\
  \ |\n| BSS | Data | BSS |\n| 堆 | Data |  |\n| 栈 | Stack |  |\n\n**表 3.1：** 可执行程序段及其位置\n\
  \n`size` 程序打印文本段、数据段和 BSS 段每个部分以字节为单位的大小，以及十进制和十六进制的总大小（`ch-memory-memaddr.c` 程序在本章稍后显示；请参见\
  \ 第 3.2.5 节，“地址空间检查](#ch03.xhtml_ch03lev2sec5)”、“第 74 页](#ch03.xhtml_page_74)）：\n\
  \n```\n$ cc -O ch-memory-memaddr.c -o ch-memory-memaddr           编译程序\n$ ls -l\
  \ ch-memory-memaddr                                显示总大小\n-rwxrwxr-x 1 arnold arnold\
  \ 16240 May 25 13:11 ch-memory-memaddr\n$ size ch-memory-memaddr               \
  \                  各组件大小\n   text data bss \n2648 628 12 3288\n```\n\n\n\n\n最后，我们讨论一个你可能经常看到但我们并不推荐使用的函数。\n\
  \n## 3.2.1 库调用：`malloc()`, `calloc()`, `realloc()`, `free()`\n\n动态内存通过 `malloc()`\
  \ 函数或 `calloc()` 函数进行分配。这些函数返回指向已分配内存的指针。一旦你获得具有特定初始大小的内存块，就可以用 `realloc()` 函数更改其大小。动态内存通过\
  \ `free()` 函数释放。\n\n动态内存使用的调试本身就是一个重要的课题。我们将在第 17.6 节“调试工具 II：内存分配调试器”以及第第 633 页中讨论用于此目的的工具。\n\
  \n### 3.2.1.1 探查 C 语言细节\n\n以下是 GNU/Linux `malloc`(3) 手页中的函数声明：\n\n```\n#include\
  \ <stdlib.h>                                            ISO C\n\nvoid *calloc(size_t\
  \ nmemb, size_t size);     分配并置零\nvoid *malloc(size_t size);                   分配原始内存\n\
  void free(void *ptr);                        释放内存\nvoid *realloc(void *ptr, size_t\
  \ size);       更改现有分配的大小\n```\n\n所有分配函数都返回类型 `void *`。这是一个`无类型`指针或`通用指针`；你对这种指针能做的就是将其强制转换为不同的类型，并赋值给一个有类型的指针。后面将给出示例。\n\
  \n`size_t` 类型是一种无符号整数类型，表示内存量。它被用于动态内存分配，我们在书中各处都能看到它的许多用法。在大多数现代系统中，`size_t` 是\
  \ `unsigned long`，但显式地使用 `size_t` 比使用普通的 `unsigned` 整数类型更好。\n\n`ptrdiff_t` 类型用于指针算术中的地址计算，例如计算指针可能指向数组中的哪个位置：\n\
  \n```\n#define MAXBUF ...\nchar *p;\nchar buf[MAXBUF];\nptrdiff_t where;\np = buf;\n\
  while (some condition) {\n    ...\n    p += something;\n    ...\n    where = p -\
  \ buf;      /* 我们在哪个索引？ */\n}\n```\n\n`<stdlib.h>` 头文件声明了许多标准 C 库例程和类型（如 `size_t`），它还定义了预处理器常量\
  \ `NULL`，它表示“空”或无效指针。（这是一个零值，例如 `0` 或 `((void *) 0)`。但在 C 中，你应该始终使用 `NULL`。旧的 C++\
  \ 代码显式地使用 `0`。现代 C++ 提供了一个内置的空指针，称为 `nullptr`，如果你在 C++ 中工作，你应该使用它。）\n\n### 3.2.1.2\
  \ 初始分配内存：`malloc()`\n\n内存最初通过 `malloc()` 分配。传递的值是请求的总字节数。返回值是指向新分配内存的指针，如果无法分配内存则返回\
  \ `NULL`。在后一种情况下，`errno`将被设置以指示错误（`errno` 是系统调用和库函数设置的一个特殊变量，用于指示发生了什么。它在第 4.3 节“确定发生了什么”以及第第\
  \ 81 页中描述）。例如，假设我们希望分配某个结构体的数量数量。代码看起来如下：\n\n```\nstruct coord {               \
  \           /* 3D 坐标 */\n    int x, y, z;\n} *coordinates;\nunsigned int count;\
  \                     /* 我们需要多少 */\nsize_t amount;                          /* 内存总量\
  \ */\n\n/* ... 以某种方式确定 count... */\namount = count * sizeof(struct coord);  /* 分配多少个字节\
  \ */\n\ncoordinates = (struct coord *) malloc(amount);  /* 获取空间 */\nif (coordinates\
  \ == NULL) {\n    /* 报告错误、恢复或放弃 */\n}\n/* ... 使用 coordinates ... */\n```\n\n这里显示的步骤是非常模化的代码。顺序如下：\n\
  \n1. 声明一个正确类型的指针来指向已分配的内存。\n2. 计算要分配内存的大小（以`字节`计）。这涉及将所需的对象数量与单个对象的大小相乘。这个大小反过来从\
  \ C 的 `sizeof` 运算符获取，该运算符正是为了此目的（以及其他目的）而存在的。因此，虽然特定 `struct` 的大小在编译器和架构之间可能会变化，但\
  \ `sizeof` 始终返回正确的值，且源代码保持正确且具有可移植性。\n\n   在为字符字符串或其他 `char` 类型的数据分配数组时，没有必要乘以 `sizeof(char)`，因为根据定义这始终是\
  \ `1`。但这样做也没有任何害。\n\n3. 通过调用 `malloc()` 分配存储空间，并将函数的返回值赋值给指针变量。将 `malloc()` 的返回值强制转换为被赋值变量的类型是一个良好的习惯。在\
  \ C 中这不是强制的（尽管编译器可能会生成警告）。我们强烈建议*始终*对返回值进行强制转换。\n\n   注意，在 C++ 中，无论上下文如何，将一种类型的指针值赋值另一种类型的指针都需要强制转换。对于动态内存管理，C++\
  \ 程序应该使用 `new` 和 `delete` 来避免类型问题，而不是使用 `malloc()` 和 `free()`。\n\n4. 检查返回值。*永远不要假设内存分配会成功。如果分配失败，`malloc()`\
  \ 返回 `NULL`。如果返回值为 `NULL` 且你在未进行检查的情况下使用它，你的程序将立即因`段错误`（或 `segfault`）而崩溃，这是尝试使用不在你的地址空间中的内存。\n\
  \n   如果你检查了返回值，你至少可以打印诊断消息并优雅地退出。或者你可以尝试其他其他恢复方法。\n\n一旦我们分配了内存并让 `coordinates` 指向它，我们就可以像对待数组一样对待\
  \ `coordinates`，尽管它本质上是一个指针：\n\n```\nint cur_x, cur_y, cur_z;\nsize_t an_index;\n\
  an_index = something;\ncur_x = coordinates[an_index].x;\ncur_y = coordinates[an_index].y;\n\
  cur_z = coordinates[an_index].z;\n```\n\n编译器会生成正确的代码，通过指针索引来检索 `coordinates[an_index]`\
  \ 处的结构成员。\n\n**注意**\n\n`malloc()` 返回的内存*没有*被初始化。它可能包含任何随机垃圾数据。你应该立即用有效数据或至少用零来初始化该内存。对于后者，请使用\
  \ `memset()`（在第 13.2 节` 函数](#ch13.xhtml_ch13lev1sec2)”以及第第 423 页中讨论过）：\n\n```\n\
  memset(coordinates, '\\0', amount);\n```\n\n另一个选项是稍后描述的 `calloc()`。\n\nGeoff Collyer\
  \ 推荐以下分配内存的技术：\n\n```\nsome_type  *pointer;\n\npointer = malloc(count * sizeof(*pointer));\n\
  ```\n\n这种方法保证了 `malloc()` 将分配正确数量的内存，无需查询 `pointer` 的声明。如果 `pointer` 的类型以后发生变化，`sizeof`\
  \ 运算符会自动确保分配的字节数保持正确。（Geoff 的技术省略了我们刚刚讨论的强制转换。在那里保留强制转换也可以在 `pointer` 类型更改且未更新 `malloc()`\
  \ 调用时产生诊断。）\n\n### 3.2.1.3 释放内存：`free()`\n\n当你完成对内存的使用时，通过使用 `free()` 函数将其“还回去”。单个参数是以前从其他分配例程获取的指针：\n\
  \n```\nfree(coordinates);\ncoordinates = NULL;      /* 不是必须的，但好主意 */\n```\n\n一旦调用了\
  \ `free(coordinates)`，`coordinates` 指向的内存就是*禁止访问的*。它现在“属于”分配例程，它们可以根据自己的意愿管理它。它们可以更改内存的内容，甚至从进程的地址空间中释放它！\n\
  \n\n\n\n\n### 访问已释放的内存\n\n如果 `coordinates` 不变，它将继续指向不再属于应用程序的内存。这被称为`悬挂指针`（dangling\
  \ pointer）。在许多系统中，你可以继续访问这块内存没事，至少直到下一次分配或释放更多内存为止。但在许多其他系统中，这种访问是无效的。\n\n总而言之，访问已释放的内存是一个坏主意：它不具有可移植性，也不可靠，而且\
  \ `GNU Coding Standards` 禁止这样做。因此，立即将程序的指针变量设置为 `NULL` 是一个好主意。如果你之后不小心尝试访问已释放的内存，你的程序将立即因段错误（segmentation\
  \ fault）而失败（我们希望这在你将其发布给外界之前发生）。\n\n### 两次释放同一个指针\n\n这导致了“未定义行为”。一旦内存被归还给分配程序，这些程序可能会将释放的块与其他受管理的空闲存储空间合并。释放一个已经释放的内容极可能导致混乱或崩溃，而所谓的“双重释放”（double\
  \ frees）已知会导致安全问题。`GLIBC` 系统通常会在运行时诊断双重释放。这对某些情况有帮助，因为你至少知道程序崩溃的原因。\n\n### 传递未通过\
  \ `malloc()`、`calloc()` 或 `realloc()` 获取的指针\n\n这似乎显而易见，但仍然很重要。即使传递指向动态分配内存中间部分的指针也是坏的：\n\
  \n```\nfree(coordinates + 10);          /* 释放前 10 个以外的所有元素。 */\n```\n\n此调用将不起作用，并可能导致灾难性的后果，例如崩溃。（这是因为许多\
  \ `malloc()` 实现在返回的数据之前保留了“簿记”信息。当 `free()` 使用这些信息时，它会发现那里有无效数据。其他实现将簿记信息放在分配块的末尾；问题同样适用。）\n\
  \n### 缓冲区溢出和下界\n\n访问分配块之外的内存也会导致未定义行为，这仍然是因为这可能是簿记信息，或者可能是根本不在该地址空间内的内存。向此类内存写入内容要糟糕得多，因为它很可能会破坏簿记数据。\n\
  \n### 未释放内存\n\n任何不再动态内存都应该被释放。特别是位于循环内部、递归或深度嵌套函数调用内部分配的内存，应该仔细管理并释放。处理不当会导致`内存泄漏（memory\
  \ leaks），使得进程的内存无限制地增长；最终进程会因为内存不足而死亡。\n\n如果内存是根据每个输入记录或输入的某些其他函数分配的，这种情况可能特别有害：在处理小输入时运行时，内存泄漏不会被察觉，但在处理大输入时运行时，可能会突然变得明显（且令人尴尬）。对于必须持续运行的系统（例如电话交换系统），这种错误更为糟糕。导致此类系统崩溃的内存泄漏会导致重大的资金或其他损害。\n\
  \n即使程序从未因内存不足而崩溃，不断增长的程序其性能也会受到影响，因为操作系统必须管理并将使用的数据保持在物理内存中。在最坏的情况下，这会导致被称为`抖动（thrashing）`的行为，即操作系统忙于在地址空间和物理内存之间移动空间内容，以至于没有实际工作可以完成。\n\
  \n虽然 `free()` 可能将释放的内存归还给系统并缩小进程地址空间，但几乎从未这样做。相反，释放的内存会被保留，以供下一次调用 `malloc()`、`calloc()`\
  \ 或 `realloc()` 分配。\n\n鉴于释放的内存仍然留在进程的地址空间中，在释放之前将其清零可能是值得的。例如，安全敏感型程序可能会选择这样做。\n\
  \n参见第 17.6 节，“调试工具 II：内存分配调试器](#ch17.xhtml_ch17lev1sec6)”、第 633 页，讨论两个非常有用的动态内存调试工具。\n\
  \n#### 3.2.1.4 改变大小：`realloc()`\n\n动态内存相对于静态声明的数组有一个显著优势，那就是可以使用恰好需要的内存，而不更多。没有必要声明一个某个固定大小的全局、`static`或自动数组，并希望它\
  \ (a) 足够大且 (b) 不太大。相反，你可以精确分配你需要的内存，不多也不少。（权衡是，这部分内存必须由你，程序员直接管理。这几乎总是值得的，特别是对于生产环境程序。）\n\
  \n此外，可以更改动态分配内存区域的大小。虽然可以缩小内存块，但更常见的情况是扩展块。大小的改变通过 `realloc()` 处理。继续使用 `coordinates`\
  \ 示例，典型的代码如下：\n\n```\nint new_count;\nsize_t new_amount;\nstruct coord *newcoords;\n\
  \n/* 设置新的 new_count，例如： */\nnew_count = count * 2;          /* 存储空间翻倍 */\nnew_amount\
  \ = new_count * sizeof(struct coord);\n\nnewcoords = (struct coord *) realloc(coordinates,\
  \ new_amount);\nif (newcoords == NULL) {\n    /* 报告错误、恢复或放弃 */\n}\n\ncoordinates\
  \ = newcoords;\n/* 继续使用 coordinates ... */\n```\n\n与 `malloc()` 类似，步骤本质上是模板化的，且概念上相似：\n\
  \n1. 计算要分配的新大小，单位为字节。\n2. 调用 `realloc()`，传入从 `malloc()`（或 `calloc()` 或早前的 `realloc()`\
  \ 调用）获取的原始指针和新大小。\n3. 转换并赋值 `realloc()` 的返回值。稍后会有更多讨论。\n4. 与 `malloc()` 一样，*检查返回值*以确保它不是\
  \ `NULL`。任何内存分配都可能失败。\n\n扩展内存块时，`realloc()` 通常会分配一个大小正确的新块，将数据从旧块拷贝到新块中，并返回新块的指针。\n\
  \n缩小数据块时，`realloc()` 往往只需更新簿记信息并返回相同的指针。这节省了拷贝原始数据的开。然而，如果发生这种情况，*不要尝试使用新大小之外的内存！*\
  \ 内存释放部分现在可能被留作以后分配，甚至可能已从地址空间中移除！\n\n无论何种情况，你都可以假设如果 `realloc()` 没有返回 `NULL`，则旧数据已为你拷贝到新内存中。此外，旧指针不再有效，就像你对它调用了\
  \ `free()` 一样，你不应该使用它。这适用于该数据块中的所有指针，而不仅仅是调用 `realloc()` 的那个特定指针。\n\n你可能注意到我们的示例代码使用单独的变量来指向更改后的存储块。使用相同的初始变量是可能的（但这是一个坏主意），如下所示：\n\
  \n```\ncoordinates = realloc(coordinates, new_amount);\n```\n\n出于以下原因，这是一个坏主意。当\
  \ `realloc()` 返回 `NULL` 时，原始指针仍然有效；继续使用该内存是安全的。但是，如果你重用同一个变量且 `realloc()` 返回 `NULL`，你现在就*丢失*了指向原始内存的指针。该内存内存无法再次使用。更重要的是，那块内存无法再被释放！这会导致内存泄漏，是应该避免的。\n\
  \n\n\n\n标准 C 版本的 `realloc()` 有一些特殊情况：当 `ptr` 参数为 `NULL` 时，`realloc()` 的行为类似于 `malloc()`，分配一块新的存储区域。当\
  \ `size` 参数为 `0` 时，`realloc()` 的行为类似于 `free()`，释放 `ptr` 指向的内存。由于 (a) 这可能会引起困惑，且\
  \ (b) 旧系统没有实现这一功能，我们建议在需要 `malloc()` 时使用 `malloc()`，在需要 `free()` 时使用 `free()`。\n\
  \n### 注意事项\n\n2024 年 C 标准更改了 `realloc()` 的行为，使得如果 `size` 为 `0`，其行为是未定义的。这是一个糟糕的改变，可能会破坏大量现有的代码。正因如此，我们在上一段落中的建议——在需要\
  \ `malloc()` 时使用 `malloc()`，在需要 `free()` 时使用 `free()`——变得愈发重要了。\n\n这里是另一个相当微妙的“陷阱”。^(5)\
  \ 考虑维护指向某些动态分配数据的 `static` 指针的例程，该例程偶尔需要扩大这些数据。它可能还维护指向这些数据的自动（即局部）指针。（为了简洁起见，我们省略了错误检查代码。在生产代码中，请不要这样做。）例如：\n\
  \n^(5) 它源于对 `gawk` 的实际经验。\n\n```\nvoid manage_table(void)\n{\n    static struct\
  \ table *table;\n    struct table *cur, *p;\n    int i;\n    size_t count;\n\n \
  \   ...\n    table = (struct table *) malloc(count * sizeof(struct table));\n  \
  \  /* fill table */\n    cur = & table[i];       /* 指向第 i 个元素 */\n    ...\n    cur->i\
  \ = j;             /* 使用指针 */\n    ...\n    if (some condition) {  /* 需要扩大表 */\n\
  \        count += count/2;\n        p = (struct table *) realloc(table, count *\
  \ sizeof(struct table));\n        table = p;\n    }\n    cur->i = j;           \
  \  /* 问题 1: 更新表元素 */\n\n    other_routine();        /* 问题 2: 见文 */\n    cur->j =\
  \ k;             /* 问题 2: 见文 */\n    ...\n}\n```\n\n这看起来很直接；`manage_table()` 分配数据、使用它、更改大小，等等。但当你查看这段代码时，有些问题并不会显然出现在页面（或屏幕）上。\n\
  \n在标记为 `PROBLEM 1` 的行行中，`cur` 指针被用于更新表元素。然而，`cur` 是基于 `table` 的初始值赋值的。如果 `some condition`\
  \ 为真且 `realloc()` 返回了不同的内存块，那么 `cur` 现在指向原始的已释放的内存！每当 `table` 变化时，指向该内存的任何指针都需要更新。这里缺失的语句是在调用\
  \ `realloc()` 重新赋值 `table` 之后执行的 `cur = & table[i];`。\n\n标记为 `PROBLEM 2` 的两行甚至更加微妙。特别是，假设\
  \ `other_routine()` 对 `manage_table()` 了递归调用。`table` 变量可能会再次被改变，且完全不可察觉！当从 `other_routine()`\
  \ 返回时，`cur` 的值可能再次失效。\n\n人们可能会认为（正如我们所做的那样），解决方案是意识到这一点，并在函数调用后提供一个带有适当注释的 `cur`\
  \ 重新赋值。然而，Brian Kernighan 仁慈地指明了这一点。如果我们使用索引，指针维护问题甚至不会出现：\n\n```\n table = (struct\
  \ table *) malloc(count * sizeof(struct table));\n   /* fill table */\n   ...\n\
  \   table[i].i = j;         /* 修改第 i 个元素的成员 */\n   ...\n   if (some condition) {\
  \  /* 需要扩大表 */\n       count += count/2;\n       p = (struct table *) realloc(table,\
  \ count * sizeof(struct table));\n       table = p;\n   }\n\n   table[i]. j;   \
  \          /* 问题 1 消失 */\n   other_routine();        /* 递归调用，修改了 table */\n   table[i].j;\
  \             /* 问题 2 同样消失 */\n```\n\n如果你有一个指向分配数据的全局副本，使用索引并没有解决问题；在这种情况下，你仍然需要在调用\
  \ `realloc()` 后考虑更新你的全局结构。\n\n### 注意事项\n\n与 `malloc()` 一样，当你扩大内存时，`realloc()` 返回的新分配内存没有填充零。如果有必要，你必须使用\
  \ `memset()` 自行清理它，因为 `realloc()` 只负责分配。\n\n这是一个来自 One True Awk，^(6) 的示例函数，它扩大表并将新分配的内存初始化为零：\n\
  \n^(6) [`https://github.com/onetrueawk/awk`](https://github.com/onetrueawk/awk)\n\
  \n```\n 1  static void resize_gototab(fa *f, int state)\n 2  {\n 3      size_t new_size\
  \ = f->gototab[state].allocated * 2;\n 4      gtte *p = (gtte *) realloc(f->gototab[state].entries,\
  \ new_size * sizeof(gtte));\n 5      if (p == NULL)\n 6          overflo(__func__);\n\
  \ 7\n 8      // 需要将新内存初始化为零\n 9      size_t orig_size = f->gototab[state].allocated;\
  \     // 新内存的后半部分\n                                                            \
  \  // 是大小\n10      memset(p + orig_size, 0, orig_size * sizeof(gtte)); // 清理它\n\
  \ 11\n 12      f->gototab[state].allocated = new_size;         // 更新 gototab 信息\n\
  \ 13      f->gototab[state].entries = p;\n 14  }\n```\n\n行号是从函数开始的，而不是文件。第 3 行计算新大小，第\
  \ 4 行调用 `realloc()`。第 9 行和第 10 行处理初始化新内存。细节在于\n\n\n\n\n你必须预期 `free` 会改变被释放内存块的内容。任何想要从该块中获取的内容都必须在调用\
  \ `free` 之前获取。\n\n理查德·斯尔曼（Richard Stallman）用两个短段提炼了使用 `malloc()` 进行动态内存管理的重要原则。正是对动态内存的使用以及“无任意限制”原则，使得\
  \ GNU 程序比它们的 Unix 程序更加健壮且功能更强。\n\n我们想指出，C 标准要求如果 `realloc()` 返回 `NULL`，则*不会*破坏原始内存块。\n\
  \n### 3.2.1.7 使用私有分配器\n\n`malloc()` 系列函数是一个通用的内存分配器。它必须能够处理对任意大或小内存数量的请求，并在释放不同的分配内存块时完成所有的簿记工作。如果你的程序有大量的动态内存分配，你可能会发现它花费了大量时间在\
  \ `malloc()` 函数上。\n\n你可以做的一件事是编写一个`私有分配器`（private allocator）——一组函数或宏，它们从 `malloc()`\
  \ 分配大块内存，然后逐个分发小块内存。如果你分配了许多相同且较小结构体的单个实例，这种技术特别有用。\n\n例如，`gawk` 使用了这种技术。来自 `gawk`\
  \ 分发中的文件 `awk.h`：\n\n```\n#define getblock(p, id, ty) (void) ((p = (ty) nextfree[id].freep)\
  \ ? \\\n            (ty) (nextfree[id].freep = ((struct block_item *) p)->freep)\
  \ \\\n            : (p = (ty) more_blocks(id)))\n#define freeblock(p, id) (void)\
  \ (((struct block_item *) p)->freep = nextfree[id].freep, \\\n                 \
  \   nextfree[id].freep = (struct block_item *) p)\n```\n\n变量 `nextfree` 指向一个 `block_item`\
  \ 结构体的链表。`getblock()` 宏在列表中存在结构时会从列表中取出第一个结构。否则，它调用 `more_blocks()` 来分配一个新的空闲 `block_items`\
  \ 列表。`freeblock()` 宏通过将一个 `block_item` 置于列表头部来释放它。\n\n**注意**\n\n在首次编写应用程序时，请采用简单的方法：直接使用\
  \ `malloc()` 和 `free()`。*只有当*性能分析显示你的程序在内存分配函数上花费了大量时间时，你才应该考虑编写私有分配器。\n\n### 3.2.1.8\
  \ 示例：读取任意长度的行\n\n既然这毕竟是《实例 Linux 应用开发》（*Linux Application Development by Example*），是时候来看一个真实的例子了。以下代码是\
  \ GNU Make 4.4.1 中的 `readline()` 函数。它可以在文件 `read.c` 中找到。\n\n此函数不应与 Bash、GDB 等其他程序使用的\
  \ `readline` 库混淆。\n\n遵循“无任意限制”原则，`Makefile` 中的行可以是任何长度。因此，此例程的主要工作是读取任意长度的行，并确保它们能够放入正在使用的缓冲区中。\n\
  \n次要工作是处理延续行。与 C 语言一样，以斜杠结尾的行在逻辑上延续到下一行。使用的策略是维护一个缓冲区。缓冲区能容纳的行会被保留在那里，并用指针跟踪缓冲起始、当前行和下一行。这里是该结构：\n\
  \n```\nstruct ebuffer\n  {\n    char *buffer;       /* 缓冲区中当前行的起始。  */\n    char\
  \ *bufnext;      /* 缓冲区中下一行的起始。  */\n    char *bufstart;     /* 整个缓冲区的起始。  */\n\
  \    size_t size;        /* Malloc 分配的缓冲区大小。 */\n    FILE *fp;           /* 文件，如果是内部缓冲区则为\
  \ NULL。  */\n    floc floc;          /* fp 中文件的信息（如果有）。  */\n  };\n```\n\n`size`\
  \ 字段跟踪整个缓冲区的大小，`fp` 是输入文件的 `FILE` 指针。`floc` 结构对于研究此例程并不重要。\n\n`readline()` 函数返回缓冲区中的行数（这里的行号相对于函数开始处，而不是源代码文件）：\n\
  \n```\n 1  static long\n 2  readline (struct ebuffer *ebuf)\n 3  {\n 4    char *p;\n\
  \ 5    char *end;\n 6    char *start;\n 7    long nlines = 0;\n 8\n 9    /* 字符串缓冲区和流缓冲区之间的行为足够不同，\n\
  10       有必要使用不同的函数。要做正确的事（Do the Right Thing）。  */\n11\n12    if (!ebuf->fp)\n\
  13      return readstring (ebuf);\n14\n15    /* 当从文件读取时，我们每读取新行都会从\n16       缓冲区的开头重新开始。\
  \  */\n17\n18    p = start = ebuf->bufstart;\n19    end = p + ebuf->size;\n20  \
  \  *p = '\\0';\n```\n\n初始部分声明变量，如果输入来自字符串（例如来自宏的展开），代码会将工作交由另一个函数 `readstring()`（第\
  \ 12 和第 13 行）。测试 `!ebuf->fp`（第 12 行）是一个更短（且在我们看来不那么清晰）的空指针测试；它等同于 `ebuf->fp == NULL`。\n\
  \n第 18–20 行初始化指针，并在缓冲区末尾插入 NUL 字节（即 C 字符串终止符）。函数随后开始一个循环（第 22–93 行），只要有更多输入循环就会运行：\n\
  \n```\n22    while (fgets (p, (int) (end - p), ebuf->fp) != 0)\n23      {\n24  \
  \      char *p2;\n25        size_t len;\n26        int backslash;\n27\n28      \
  \  len = strlen (p);\n29        if (len == 0)\n30          {\n31            /* 这只在第一个字符是\n\
  32               换行符时发生。这是一个相当棘手的情况；我们\n34               合成一个换行符，以便\n35        \
  \       后续行看起来不像是当前行的一部分。  */\n36            O (error, &ebuf->floc,\n37        \
  \       _(\"warning: NUL character seen; rest of line ignored\"));\n38         \
  \   p[0] = '\\n';\n39            len = 1;\n40          }\n```\n\n`fgets()` 函数（第\
  \ 22 行）接收一个缓冲区指针、读取字节数以及用于读取文件的 `FILE *`。它读取的字节数少 1 个，以便用 `\\0` 终止缓冲区。在遇到换行符或文件结束结束时停止，如果存在换行符，则将其放入缓冲区中。失败时返回\
  \ `NULL`，成功时返回第一个参数的值。\n\n在这种情况下，参数是缓冲区空闲区域指针、剩余剩余以及用于读取的 `FILE` 指针。\n\n在补偿 NUL\
  \ 字节（第 29–40 行）后，代码继续：\n\n```\n42        /* 跳过我们刚刚读取的文本。  */\n43        p += len;\n\
  44\n45        /* 如果最后一个字符不是换行符，说明整行没有放入\n46           缓冲区。获取更多缓冲区并重试。  */\n47  \
  \      if (p[-1] != '\\n')\n48          goto more_buffer;\n49\n50        /* 我们得到了一个换行符，所以给行数加\
  \ 1。  */\n51        ++nlines;\n```\n\n\n\n第 42–51 行将缓冲区中的指针移动过刚刚读取的数据。随后，代码检查读取的最后一个字符是否为换行符。`p[-1]`\
  \ 结构（第 47 行）查看 `p` 之前的字符，就像 `p[0]` 是当前字符而 `p[1]` 是下一个字符一样。这初看起来很奇怪，但如果将其转换为指针算术表达式\
  \ `*(p-1)`，它就更有意义了，而且索引形式可能更容易读。\n\n如果最后一个字符不是换行符，意味着空间已耗尽，代码将跳转（使用 `goto`）获取更多空间（第\
  \ 48 行）。否则，行计数加 1。\n\n第 53–61 行处理符合微软习惯的输入行，该习惯以回车-换行符（CR-LF）组合结尾，而不仅仅是换行符（或 newline），后者是\
  \ Linux/Unix 的习惯：\n\n```\n53  #if !defined(WINDOWS32) && !defined(__MSDOS__) &&\
  \ !defined(__EMX__)\n54        /* 检查行是否真的以 CRLF 结尾；如果是，则忽略\n55           CR。  */\n\
  56        if ((p - start) > 1 && p[-2] == '\\r')\n57          {\n58            --p;\n\
  59            memmove (p-1, p, strlen (p) + 1);\n60          }\n61  #endif\n```\n\
  \n注意，`#ifdef` 排除了 Microsoft 和 OS/2 系统上的代码（对 `__EMX__` 的检查）；这些系统上的 `<stdio.h>` 库会自动处理这种转换。支持标准\
  \ C 的非 Unix 系统也是如此。继续后续：\n\n```\n63       backslash = 0;\n64       for (p2 = p -\
  \ 2; p2 >= start; --p2)\n65         {\n66           if (*p2 != '\\\\')\n67     \
  \        break;\n68           backslash = !backslash;\n69         }\n70\n71    \
  \   if (!backslash)\n72         {\n73           p[-1] = '\\0';\n74           break;\n\
  75         }\n77\n78       /* 这是反斜杠/换行符组合。如果我们还有剩余空间，则\n79          读取另一行。  */\n\
  80       if (end - p >= 80)\n81         continue;\n82\n83       /* 我们在缓冲区末尾需要更多空间，因此重新分配。\n\
  84          确保保留 p 的当前偏移量。*/\n85     more_buffer:\n86       {\n87         size_t\
  \ off = p - start;\n88         ebuf->size *= 2;\n89         start = ebuf->buffer\
  \ = ebuf->bufstart = xrealloc (start, ebuf->size);\n90         p = start + off;\n\
  91         end = start + ebuf->size;\n92         *p = '\\0';\n93       }\n93   \
  \  }\n```\n\n到为止，我们已经处理了将至少一完整行放入缓冲区机制。下一部分处理续行的情况。不过，它必须确保最后的反斜杠不是行尾多个反斜杠的一部分。它通过将\
  \ `backslash` 变量在 `0` 和 `1` 之间切换（第 63–69 行），来跟踪此类反斜杠的总数是奇数还是偶数。我们注意到这段代码几十年来没有改变过(!)；它仍然遵循原始\
  \ C 习惯，使用整数表示布尔值，而不是使用 `bool`。\n\n如果是偶数，测试 `!backslash`（第 71 行）将为真。在这种情况下，最后的换行符被替换为\
  \ NUL 字节，代码退出循环。\n\n另一方面，如果是奇数，则该行包含偶数个反斜杠对（表示转义的反斜杠，如 C 中的 `\\\\`）以及最后的反斜杠-换行符组合。在这种情况下，如果缓冲区中至少剩余\
  \ 80 个空闲字节，程序将 `continue` 循环以读取另一行（第 79–80 行）。使用魔数 `80` 并不理想；定义并使用符号常量会更好。）\n\n\
  这段代码带有实战经验的痕迹；如果发现早期版本简单地检查换行符之前的最后一个反斜杠，直到有人抱怨它在行尾有多个反斜杠时无法工作，这并并不意外。\n\n当到达第 84\
  \ 行时，程序需要缓冲区中更多空间。这就是动态内存管理发挥作用的地方。注意关于保留 `p` 的注释（第 82–83 行）；我们之前在重新初始化动态内存中的指针时讨论过这一点。第\
  \ 88 行调整了内存大小。\n\n注意，这里调用的函数是 `xrealloc()`。许多 GNU 程序在 `malloc()` 和 `realloc()` 周围使用“包装”函数，如果标准程序返回\
  \ `NULL`，会自动打印错误消息并退出。这样的包装函数可能如下：\n\n```\nextern const char *myname;    /* 在 main()\
  \ 中设置 */\n\nvoid *\nxrealloc(void *ptr, size_t amount)\n{\n    void *p = realloc(ptr,\
  \ amount);\n\n    if (p == NULL) {\n        fprintf(stderr, \"%s: out of memory!\
  \ could not get %z bytes\\n\",\n                        myname, amount);\n     \
  \   exit(1);\n    }\n\n    return p;\n}\n```\n\n因此，如果 `xrealloc()` 返回，就能保证返回一个有效指针。（这种策略符合“检查每次调用的错误”的原则，同时避免了直接使用标准例程带来的代码杂乱。）此外，这允许允许使用\
  \ `ptr = xrealloc(ptr, new_size)` 结构，而我们之前警告过不要这样做。\n\n注意，并不总是适合使用这样的包装函数。如果你想自己处理错误，就不应该使用它。另一方面，如果内存耗尽总是致命错误，那么这样的包装函数就非常方便。你甚至可以混合使用：当错误是致命时调用包装函数，而在不需要时直接调用\
  \ `malloc()` 和/或 `realloc()`。\n\n最后，`readline()` 程序检查 I/O 错误，然后返回一个描述性的返回值：\n\n\
  ```\n 95   if (ferror (ebuf->fp))\n 96     pfatal_with_name (ebuf->floc.filenm);\n\
  \ 97\n 98   /* 如果我们找到行，返回数量。\n99       如果我们没找到，但发现了某些东西，这表明我们读取了\n100       没有最终换行符的文件最后一行；返回\
  \ 1。\n101       如果我们什么都没读到，我们到了 EOF；返回 -1。  */\n102\n103    return nlines ? nlines\
  \ : p == ebuf->bufstart ? -1 : 1;\n104  }\n```\n\n通过嵌套的 `?:` 运算符确定返回值不是最好的风格；如果在任何情况下你要做此类操作，请将其分散到多行并对嵌套测试进行缩进。函数\
  \ `pfatal_with_name()`（第 96 行）不返回。\n\n### 3.2.1.9 读取整行：`getline()` 和 `getdelim()`\n\
  \n现在你已经看到了如何读取任意长度的行，可以松口气了，你不需要自己写这样的函数。自 2008 年以来，POSIX 提供了两个函数来实现这一点：这些函数最初由\
  \ GLIBC 提供，但现在已标准化。\n\n```\n#include <stdio.h>                                 \
  \            POSIX\n\nssize_t getline(char **lineptr, size_t *n, FILE *stream);\n\
  ssize_t getdelim(char **lineptr, size_t *n, int delim, FILE *stream);\n```\n\n这两个函数的返回值都是\
  \ `ssize_t`。`ssize_t` 是“符号 `size_t`”。它的用途与 `size_t` 相同，但适用于需要包含负值的地方。\n\n这两个函数都为你管理动态存储，确保包含输入行的缓冲区始终足够容纳输入行。它们的区别在于\
  \ `getline()` 读取到换行符，而 `getdelim()` 使用用户提供的边界。共同参数如下：\n\n*   `char **lineptr`\n\n\
  \    指向 `char *` 指针，用于存储动态分配缓冲区的地址。如果你想让 `getline()` 完成所有工作，应将其初始化为 `NULL`。否则，它应该指向从\
  \ `malloc()` 获取的存储。\n\n*   `size_t *n`\n\n    缓冲区大小指示。如果你分配了自己的缓冲区，`*n` 应包含缓冲区的大小。如果这两个函数更改了缓冲区，将更新\
  \ `*n` 为新的缓冲区大小。\n\n*   `FILE *stream`\n\n    从中获取输入字符的打开的文件。\n\n\n\n\n这些函数在遇到文件结束或错误时返回\
  \ `-1`。字符串包含终止的换行符或分隔符（如果有的话），以及一个终止的零字节。使用 `getline()` 非常简单，如 `ch-memory-getline.c`\
  \ 所示：\n\n```\n/* ch-memory-getline.c --- demonstrate getline(). */\n\n#include <stdio.h>\n\
  \n/* main --- read a line and echo it back out until EOF. */\n\nint\nmain(void)\n\
  {\n    char *line = NULL;\n    size_t size = 0;\n    ssize_t ret;\n\n    while ((ret\
  \ = getline(& line, & size, stdin)) != -1)\n        printf(\"(%lu) %s\", size, line);\n\
  \n    return 0;\n}\n```\n\n这是它的运行示例，显示了缓冲区的大小。第三行输入和输出故意故意得很长，以强制 `getline()` 扩展缓冲区；因此它们发生了换行：\n\
  \n```\n$ ch-memory-getline                                      运行该程序\nthis is a\
  \ line\n(120) this is a line\nAnd another line.\n(120) And another line.\nA llllllllllllllllloooooooooooooooooooooooooooooooonnnnnnnnnnnnnnnnnnngggg\n\
  gggggggg    llliiiiiiiiiiiiiiiiiiinnnnnnnnnnnnnnnnnnnneeeeeeeeee\n(240) A llllllllllllllllloooooooooooooooooooooooooooooooonnnnnnnnnnnnnng\n\
  nnnggggggggggg    llliiiiiiiiiiiiiiiiiiinnnnnnnnnnnnnnnnnnnneeeeeeeeee\n```\n\n\
  ### 3.2.2 字符串拷贝：`strdup()`\n\n一个极其常见的操作是为字符串的拷贝分配存储。它是如此常见，以至于许多程序提供一个简单的函数而不是使用内联代码，而且该函数通常命名为\
  \ `strdup()`：\n\n```\n#include <string.h>\n\n/* strdup --- malloc() storage for\
  \ a copy of string and copy it */\n\nchar *\nstrdup(const char *str)\n{\n    size_t\
  \ len;\n    char *copy;\n\n    len = strlen(str) + 1;   /* 包含终止 '\\0' 的空间 */\n \
  \   copy = malloc(len);\n\n    if (copy != NULL)\n        strcpy(copy, str);\n\n\
  \    return copy;             /* 如果出错则返回 NULL */\n}\n```\n\n自 2001 年起，POSIX 标准已包含了\
  \ `strdup()`。它最初是一个 XSI 扩展；现在是该标准的规范性部分。它也被包含在 2024 年 ISO C 标准中：\n\n```\n#include\
  \ <string.h>                                             POSIX, ISO C 2024\n\nchar\
  \ *strdup(const char *str);                  复制 str\nchar *strndup(const char *s,\
  \ size_t size);      复制最多 size 字节\n```\n\n如果发生错误，返回值为 `NULL`；否则返回一个指向持有 `str` 拷贝的动态分配存储的指针。返回的值在不再需要时应该用\
  \ `free()` 释放。\n\n`strndup()` 与 `strdup()` 类似，但它最多拷贝 `size` 字节，然后追加一个终止的零字节。\n\n\
  ### 3.2.3 系统调用：`brk()` 和 `sbrk()`\n\n我们涵盖的四个例程（`malloc()`、`calloc()`、`realloc()`\
  \ 和 `free()`）是用于动态内存管理的标准、可移植函数。\n\n在 Unix 系统上，标准函数是基于两个额外的、非常原始的例程实现的，这些例程直接更改进程地址空间的大小。我们在这里介绍它们是为了帮助你理解\
  \ GNU/Linux 和 Unix 的工作原理（再次“深入底层”）；尽管你在常规程序中极可能永远不需要使用这些函数。它们的声明如下：\n\n```\n#include\
  \ <unistd.h>                                    通用\n\nint brk(void *end_data_segment);\n\
  void *sbrk(intptr_t increment);\n```\n\n`brk()` 系统调用实际上更改了进程的地址空间。该地址是一个表示数据段结束处的指针（实际上是堆区域，如之前的\
  \ 图 3.1 所示）。它的参数是表示地址空间新结束处的绝对逻辑地址。它在成功时返回 `0`，失败时返回 `-1`。\n\n`sbrk()` 函数更容易使用；它的参数是更改地址空间所需的字节增量。通过通过增量\
  \ `0` 来调用它，你可以确定地址空间当前结束的位置。因此，要将你的地址空间增加 32 字节，请使用如下代码：\n\n```\nchar *p = (char\
  \ *) sbrk(0);         /* 获取地址空间的当前结束 */\nif (brk(p + 32) < 0) {\n    /* 处理错误 */\n\
  }\n/* 否则，修改成功 */\n```\n\n从实践上来说，你不会直接使用 `brk()`。相反，你会专门使用 `sbrk()` 来扩展（甚至缩小）地址空间。（我们稍后将如何这样做，参见\
  \ 第 3.2.5 节，“地址空间检查](#ch03.xhtml_ch03lev2sec5)”，“第 74 页](#ch03.xhtml_page_74)。）\n\
  \n更实际的是，你永远不要使用这些例程。使用它们的程序将无法同时使用 `malloc()`，而这是一个大问题。\n\n### 3.2.4 懒惰程序员调用：`alloca()`\n\
  \n你应该了解另一个额外的分配函数。它名为 `alloca()`；其声明如下：\n\n```\n/* GNU/Linux 头文件 */通用\n#include\
  \ <alloca.h>\n\nvoid *alloca(size_t size);\n```\n\n`alloca()` 函数从栈上分配 `size` 字节。这种做法的好处是，存储在函数返回时就会消失。不需要显式释放它，就像局部变量一样。\n\
  \n初看之下，`alloca()` 似乎是一个万灵妙药；可以分配不需要管理的内存。但由于以下原因，它确实应该避免：\n\n- 该函数是非标准的；它没有包含在任何正式标准（无论是\
  \ ISO 还是 POSIX）中。\n- 该函数不可移植的。尽管它存在于许多 Unix 系统上，但在非 Unix 系统上不存在。\n- 在某些系统中，`alloca()`\
  \ 甚至无法实现。世界并不都是 Intel x86 处理器，也不是 GCC。\n- 早期版本的 `alloca`(3) 手册页指出：“`alloca` 函数取决于机器和编译器。在许多系统中，它的实现存在\
  \ Bug。不建议使用它。”\n- 再次引用手册页：“在许多系统中，`alloca` 不能在函数调用的参数列表中使用，因为 `alloca` 预留的栈空间将出现在函数参数空间的中间。”\n\
  - 使用 `alloca()` 鼓励了粗糙的代码。细致且正确的内存管理并不困难；你只需要思考自己在做什么并提前计划。\n\nGCC 通常使用一个通过内联代码运行的内置版本。因此，`alloca()`\
  \ 还有其他后果：\n\n- 代码是内联的，意味着无法获取此函数的地址，也无法通过链接不同的库来更改其行为。内联代码通常由一条调整栈指针的指令组成，并且不检查栈溢出。因此，没有\
  \ `NULL` 错误返回。\n- 手册页对 GCC 内置 `alloca()` 问题的描述得不够充分。如果发生栈溢出，返回值将是垃圾值。而你无法得知！这个缺陷使得\
  \ GCC 的 `alloca()` 无法在健壮的代码中运行。\n\n这一切都应该说服你为你可能编写的任何新代码都远离 `alloca()`。如果你反正必须使用\
  \ `malloc()` 和 `free()` 编写可移植代码，那么没有理由再编写使用 `alloca()` 的代码。\n\n\n\n\n### 4.1 介绍\
  \ Linux/Unix I/O 模型\n\nThe Linux/Unix API model for I/O is straightforward. It can\
  \ be summed up in four words: open, read, write, close. In fact, those are the names\
  \ of the system calls: `open()`, `read()`, `write()`, and `close()`. Here are their\
  \ declarations:\n\n\n\n\n\n```c\n#include <sys/types.h>                        \
  \                        POSIX\n#include <sys/stat.h>              /* for mode_t\
  \ */\n#include <fcntl.h>                 /* for flags for open() */\n#include <unistd.h>\
  \                /* for ssize_t */\n\nint open(const char *pathname, int flags,\
  \ mode_t mode);\nssize_t read(int fd, void *buf, size_t count);\nssize_t write(int\
  \ fd, const void *buf, size_t count);\nint close(int fd);\n```\n\n在接下来的及后续章节中，我们将通过编写一个非常简单版本的\
  \ `cat` 来演示该模型。它简单到甚至没有选项；它所做的只是将命名文件的内容连接到标准输出。它仅包含最基本的错误报告。编写完成后，我们将将其与 V7 版本的\
  \ `cat` 进行比较。\n\n我们从上到下介绍该程序，首先从命令行开始。在随后的章节中，我们将介绍错误报告，然后进入正题，展示如何进行实际的文件 I/O。\n\
  \n## 4.2 展示基础程序结构\n\n我们版本的 `cat` 遵循了一种通用的实用的结构。第一部分以说明性注释、头文件包含、声明和 `main()` 函数开始：\n\
  \n```c\n 1  /*\n 2   * ch-fileio-cat.c --- Demonstrate open(), read(), write(),\
  \ close(),\n 3   *                     errno and strerror().\n 4   */\n 5\n 6  #include\
  \ <stdio.h>      /* for fprintf(), stderr, BUFSIZ */\n 7  #include <errno.h>   \
  \   /* declare errno */\n 8  #include <fcntl.h>      /* for flags for open() */\n\
  \ 9  #include <string.h>     /* declare strerror() */\n10  #include <unistd.h> \
  \    /* for ssize_t */\n11  #include <sys/types.h>\n12  #include <sys/stat.h>  \
  \ /* for mode_t */\n13\n14  char *myname;\n15  int process(char *file);\n16\n17\
  \  /* main --- loop over file arguments */\n18\n19  int\n20  main(int argc, char\
  \ **argv)\n21  {\n22      int i;\n23      int errs = 0;\n24\n25      myname = argv[0];\n\
  26\n27      if (argc == 1)\n28          errs = process(\"-\");\n29      else\n30\
  \          for (i = 1; i < argc; i++)\n31              errs += process(argv[i]);\n\
  32\n33      return (errs != 0);\n34  }\n    … 章节稍后继续 …\n```\n\n`myname` 变量（第 14\
  \ 行）稍后用于错误消息；`main()` 的第一个动作是将其设置为程序名（`argv[0]`）（第 25 行）。然后 `main()` 遍历参数。对于每个参数，它调用一个名为\
  \ `process()` 的函数来执行工作。\n\n当文件名为 `-`（单个短横线或减号）时，Unix `cat` 会读取标准输入，而不是尝试打开名为 `-`\
  \ 的文件。此外，在没有参数的情况下，`cat` 会读取标准输入。`ch-fileio-cat` 实现了这两种行为。如果没有文件名参数，`argc == 1`（第\
  \ 27 行）检查为真；在这种情况下，`main()` 将 `\"-\"` 传递给 `process()`。否则，`main()` 遍历所有参数，将它们视为待处理的文件。如果其中一个恰好是\
  \ `\"-\"`，程序将处理标准输入。\n\n如果 `process()` 返回非零值，意味着发生了错误。错误累加在 `errs` 变量中（第 28 行和第\
  \ 31 行）。当 `main()` 结束时，如果没有错误则返回 `0`，如果有则返回 `1`（第 33 行）。这是一个相当标准的约定，其含义将在 第 9.1.5.1\
  \ 节 “定义进程退出状态” 第 289 页 中进行详细讨论。\n\n`main()` 中展示的结构是非常通用的：`process()` 可以对文件执行我们想要的任何操作。例如（忽略对\
  \ `\"-\"` 的特殊用途），`process()` 同样可以轻松地删除文件而不是连接它们！\n\n在查看 `process()` 函数之前，我们必须先描述系统调用错误是如何表示的，以及如何进行\
  \ I/O。`process()` 函数本身将在 第 4.4.3 节 “读取与写入” 第 91 页 中介绍。\n\n## 4.3 确定发生了什么\n\n*如果某件事可能出错，它就一定会出错。*\n\
  \n— 墨菲定律\n\n*做好准备。*\n\n— 童子军\n\n错误可能随时发生。磁盘可能会满，用户可能会输入无效数据，读取文件的网络服务器可能会崩溃，网络可能会中断，等等。*始终*检查每项操作是重要的，因为这些情况可能随时发生。\n\
  \n```c\nint result;\nif (result < 0) {\n    // handle error\n}\n```\n\n```c\nssize_t\
  \ result = write(int fd, const void *buf, size_t count);\n```\n\n### 4.3.1 errno\
