  \ PDF 版本。\n\n## 15.6 总结\n\n* 程序的国际化和本地化属于*母语语言支持*的大范畴。`i18n`、`l10n` 是这些缩写。 意识到国际化问题和字符集问题，并使你的代码实现国际化和本地化是非常值得的。*\
  \ GLIBC 系统提供了优秀的本地化支持，包括一组感知多字节的正则表达式匹配例程。例如， POSIX 扩展正则表达式 `[[:alpha:]][[:alnum:]]+`\
  \ 匹配一个字母后跟一个或多个字母或数字。*哪些字符属于这些类别的定义取决于区域设置（locale）。例如，此正则表达式会匹配两个字符‘eè’，而传统的 Unix\
  \ ASCII 导向的正则表达式 `[a-zA-Z][a-A-Zz0-9]+` 则可能无法匹配。* POSIX 字符类列在表 15.6 中。* 程序的国际化和本地化属于*母语语言支持*的大范畴。`i18n`、`l10n`\
