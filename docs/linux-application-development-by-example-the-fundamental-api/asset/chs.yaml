  \n你在代码中发现问题了吗？`buflen` 允许了足够的 NUL 字节。但它没有考虑到格式规范可能包含 `plus`，或者数字可能是 `negative`。在这些情况下，需要额外的字节：\n\
  \n```\nbuflen = (flags->negative || flags->plus || flags->space) + 1; // 我们知道 len\
  \ < precision\n```\n\n括号内的布尔测试结果将是 1 或 0，产生正确的字节数。\n\n总之，当你试图寻找 Bug 时，Address Sanitizer\
  \ 是武器库中非常有用的武器！\n\n**建议：** 内存调试工具无价之。养成使用 `Valgrind` 和/或 Address Sanitizer 检查程序的习惯。如果可能，使用\
  \ `make` 或你使用的任何构建系统自动化这些检查。\n\n### 17.7 请求帮助\n\n*如果有足够的眼睛，所有的 Bug 都无处遁形。* —— Linus\
  \ 法则，Eric S. Raymond 著\n\n有时，无论我们做什么，Bug 依然难以捉摸。我们沉浸在代码中，使用调试器、各种工具、`printf()` 语句等等，但仍然找不到\
  \ Bug。\n\n当这种情况发生时，首要任务是离开电脑一会儿；出去散散步，呼吸新鲜空气，喝杯饮料或咖啡。考虑除你程序以外的任何事情。如果已经是深夜了，回家放松一下，洗个澡，睡一觉。（有时灵感会在洗澡时出现！）\n\
  \n接下来的事情是寻求帮助。找一个同事，向他们解释你正在尝试做的、你看到的以及事情应该如何工作。在这一点可能会发生两种不同的情况：\n\n第一种是你和同事共同努力找到了\
  \ Bug。\n\n第二种是，解释你正在做的以及正在发生的事情这一行为本身让你产生了“啊！”的时刻，你突然意识到问题所在。然后你的同事可以回去做他们的事情，而你可以继续修复你的\
  \ Bug。\n\n事实证明你通常不需要真正的同事。你只需要*大声*解释发生了什么。这一事实导致了一种被称为*小鸭调试*（或 *rubberducking*）的技巧，开发者会在桌子上放一个喜欢的静态物体（例如小黄鸭）。当问题出现时，他们会向这个静态朋友解释，运气好的话就能解决问题并继续。\n\
  \n关于小鸭调试的更多信息可以访问 `https://rubberduckdebugging.com`。（当然了！）\n\n**建议：** 当其他方法都失效时，寻求帮助，无论是来自同事还是来自你最喜欢的静态物体。\n\
  \n### 17.8 软件测试\n\n软件开发包含了艺术和科学的元素；这是使其成为如此迷人且充满挑战的职业的方面之一。本节介绍了软件测试的主题，它也涉及艺术和科学；因此，它比本章的其他部分更通用、层次更高（即：“泛泛而谈”）。\n\
  \n软件测试是软件开发过程中不可或缺的一部分。程序在第一次编译时就 100% 正确运行是非常罕见的。程序本身并不为正确负责；程序的*作者*负责。验证程序是否按照预期方式运行的最方法之一就是测试它。\n\
  \n划分不同类型测试的方法如下：\n\n*   *单元测试*\n\n    这些测试是你为程序的每个独立单元或功能组件编写的测试。作为工作的一部分，你可能还需要编写*脚手架*（scaffolding）——设计用于提供足够的支持框架以作为独立程序运行单元的代码。\n\
  \n\n\n\n\n*当你设计组件时*，为每个功能组件设计测试是非常关重要的。这样做有助于你理清功能设计；了解你将如何测试它，有助于你定义它应该做什么和不应该做什么。\n\
  \n- `集成测试`（Integration tests）\n这些是在所有功能组件都已单独编写、测试和调试后采用的测试。其理念是将所有内容挂载到整体框架中，并对整个部分进行测试，以确保组件之间的交互运行正常。\n\
  \n- `回归测试`（Regression tests）\n不可避免，你（或你的用户！）会发现问题。这些可能是真正的漏洞、设计局限性，或者在奇怪的“边界情况”下的失败。一旦你能够重现并修复问题，请将原始的失败用例保留作为回归测试。\n\
  \n回归测试可以让你确保在做出更改时，没有重新引入旧问题。（这很容易发生。）通过在做出更改后通过测试套件运行程序，你可以（更）有心地认为一切都按照预期方式工作。\n\
  \n测试应该尽可能地自动化。对于以 Linux/Unix 工具风格编写的非 GUI 程序，这尤为容易做到：即读取标准输入或命名文件并写入标准输出和标准错误的程序。至少，测试可以使用简单的\
  \ shell 脚本完成。更复杂的测试通常通过单独的 `test` 子目录和 `make` 程序完成。\n\n软件测试本身就是一个整个子领域，我们并不期望在这里进行详尽阐述；相反，我们的观点是让你意识到测试是开发不可或缺的一部分，并且通常是使用你调试技巧的动力！这里有一份*非常*简短的总结列表：\n\
  \n- 与功能一起设计测试。\n- 测试边界条件：确保功能在有效内部和边界处都能正常工作，并在边界之外能够正确失败。（例如，`sqrt()` 函数在给定负数参数时必须失败。）\n\
  - 在代码中使用断言（参见第 13.1 节，“[断言语句：`assert()`，第 419 页”），并在启用断言的情况下运行测试。\n- 创建并复用测试脚手架。\n\
  - 保存失败用例以进行回归测试。\n- 尽可能自动化测试。\n- 打印失败测试的计数，以便轻松判断成功或失败以及失败程度。\n- 使用 `gcov` 等代码覆盖率工具来验证你的测试套件执行了你的所有代码。\n\
  - 尽早测试并频繁测试。\n- 研究软件测试文献以提高你开发和测试软件的能力。\n\n**建议：** 学习软件测试的最佳实践，并将其成为你工作的标准部分。\n\n\
  ### 17.9 调试规则\n\n调试并不是一种“黑术”。它的原理和技术是任何人都可以学习并一致运的。为此，我们强烈推荐 David J. Agans 编写的《Debugging》一书。该书有一个网站，总结了这些规则并提供了一个可以下载的海报供你打印并贴在办公室的墙上。\n\
  \n`https://www.debuggingrules.com`\n\n为了结束我们的讨论，我们提供了以下材料。这些内容经 David Agans 许可，从《Debugging》中改编，版权所有\
  \ © 2002 David J. Agans，由 AMACOM（美国管理协会的一个分部）出版。我们感谢他。\n\n`http://www.amacombooks.org`\n\
  \n1. **理解系统。** 当其他方法都失败时，请阅读手册。如果你想弄清楚为什么它们没有执行工作，就必须知道出现故障的系统及其所有部分应该做什么。所以，阅读你能通过手（或浏览器）获取的任何所有文档。\n\
  了解功能块和数据路径的位置以及它们如何相互作用，可以为你隔离故障提供路线图。当然，你还必须了解你的领域（语言、操作系统、应用程序）和你的工具（编译器、源码调试器）。\n\
  \n2. **让它失败。** 为了看到漏洞，你必须能够让失败持续地发生。记录你的操作步骤并从一个已知状态开始，这样你就能始终让它再次失败。在失败的系统上查看该漏洞——不要尝试在另一个系统上模拟问题。不要信任间歇性问题的统计数据；它们隐藏漏洞的情况远多于暴露漏洞的情况。相反，尝试通过改变输入、初始条件和时机让它变得一致。\n\
  如果它仍然是间歇性的，你必须让它看起来不是间歇性的。在每次运行期间，在日志中捕捉你能提供的每一比特信息；然后当你有一些坏运行和一些好运行时，将它们进行相互比较。如果你捕捉了足够的数据，你就能像每次都能让它失败一样锁定问题。能够让它每次失败也意味着你将能够判断出何时修复了它。\n\
  \n3. **停止思考并观察。** 某事失败的方式比你想象的要多得多。所以，与其想象可能发生了什么，不如观察它——在系统上安装插桩以便你可以实际看到失败机制。使用任何你可以使用的插桩——调试器、`printf()`、`assert()`、逻辑分析仪，甚至\
  \ LED 和蜂鸣器。深入观察，直到漏洞对肉眼显而易见，而不仅仅是大脑可见。\n如果你必须猜测，请仅使用猜测来缩小搜索范围——在看到它之前不要尝试修复它。如果你必须添加插桩代码，就去写，但要确保从与失败系统相同的代码库开始，并确保添加你的代码后它仍然失败。通常，添加调试器会让它停止失败（这就是为什么他们称之为调试器）。\n\
  \n4. **分而治之。** 每个人都知道这种方法。你进行渐近搜索——从一端开始，跳到中间，看错误在哪个，然后在该方向再次跳半半。通过二分查找，你只需要几次就能到位。困难的部分在于判断你是否已经过了漏洞。一个实用的技巧是向系统输入已知简单数据，这样损坏的数据更容易发现。\n\
  \n5. **一次只改变一种。** 如果你正尝试改进一个流处理模块，同时升级到操作系统的下一个版本，无论你看到的是改进、退化还是没有变化，你都不会知道你的单个更改产生了什么影响。多个更改的相互作用可能是不可预测且令人混乱的，所以不要同时进行。一次只改变一种，这样你就可以确定你看到的任何差异都源于该更改。\n\
  如果你做了一个更改似乎没有影响，请立即撤销。它可能产生了某些你没看到的影响，而这些影响可能会与其他更改结合时出现。这不仅适用于代码，也适用于测试。\n\n\n\n\
  \n\n## 6. 保留审计轨迹\n上述规则的有效性在很大程度上取决于保持良好的记录。在测试和调试的各个方面，都要写下你做了什么、什么时候做的、怎么做的以及结果如何。如果可能，请通过电子方式记录，以便记录可以通过电子邮件发送并附加到\
  \ bug 数据库中。许多线索隐藏在事件模式中，如果不将其记录下来供所有人查看和比较，这些线索就不会被发现。而且线索可能就在那些你认为并不重要的细节中，所以请把它们全部记录下来\n\
  \n## 7. 检查插头\n每个人都有一个关于某个问题的故事，结果发现是因为“头没插好”。有时确实是字面上的没插好，但在软件中，“没插好”可能意味着缺少驱动程序，或者是你认为已经替换掉的旧版本代码。或者是当你坚信是软件问题时，其实是硬件坏了。有一个故事是，硬件工程师和软件工程师互相互相指责，结果发现两者都不是：他们正在使用的测试设备不符合规范。底线问题是，有时你正在寻找的是系统内部的问题，而实际上问题在系统外部、在系统底层、或者在系统的初始化过程中，又你根本就看错了系统。\n\
  \n也不要完全信任你的工具。工具的供应商也是工程师；他们也有 bug，而你可能正是那个发现它们的人。\n\n## 8. 获取新视角\n在调试时寻求帮助有三个原因。\n\
  \n第一个原因是获取新的洞解——另一个人往往能看到某些东西，仅仅是因为他们不像你那样深陷其中。第二个原因是汲取专业知识——他们对系统的了解比你多。第三个原因是获取经验——他们以前遇到过这种类似的问题。\n\
  \n当你向某人描述情况时，报告你看到的症状，而不是你关于程序为什么那样运行的理论。你去找他们是因为你的理论没能取得任何进展——不要把他们也拉入你所陷入的同一个泥潭。\n\
  \n## 9. 如果你没修好，就没修好\n所以你认为修好了？证明给我看。既然你能够让它持续地失败，就设置相同的情景并确保它不再失败。不要假设仅仅因为问题显而易见现在就全修好了。也许它并不显而易见。也许你的修复没做对。也许你的修复根本不在新版本中！测试它！让它不再失败。\n\
  \n你确定是你的代码修复了它吗？还是测试变了，或者有其他代码进去了？一旦你看到你的修复有效了，就把修复撤销让它再次失败。然后把修复放回去，确保它不再失败。这一步确保了确实是你的修复解决了问题。\n\
  \n### 17.10 建议阅读\n以下书籍非常优秀，对测试和调试都有许多见解。除了前两本，其他的都与通用编程有关。它们都值得阅读。\n\n1. *GDB Pocket\
  \ Reference*，Arnold Robbins 著。O’Reilly, 2005。ISBN-13: 978-0-5961-0027-8。这是一个 `GDB`\
  \ 调试器的简用快速参考指南。注意它不是教程。\n\n2. *Debugging*，David J. Agans 著。AMACOM, 2002。ISBN-13:\
  \ 978-0-8144-3445-1。我们强烈推荐这本书。它的语气很轻松，听起来可能很不可思信，但读起来很有趣！\n\n3. *Programming Pearls*,\
  \ 第 2 版，Jon Louis Bentley 著。Addison-Wesley, 2000。ISBN-13: 978-0-201-65788-3。这本书的第\
  \ 5 章对单元测试和构建测试脚架有很好的讨论。\n\n4. *Literate Programming*，Donald E. Knuth 著。Center for\
  \ the Study of Language and Information, Stanford University, 1992。ISBN-13: 978-0-9370-7380-3。这本迷人的书包含了\
  \ Donald Knuth 关于文学化编程的多篇文章——这是他发明并用于创建 `TeX` 和 `Metafont` 的编程技术。特别感兴趣的是题为“The Errors\
  \ of TeX”的文章，它描述了他如何开发和调试 `TeX`，包括他记录的所有发现并修复的问题的日志。\n\n5. *Writing Solid Code*,\
  \ 20 周年第 2 版，Steve Maguire 著。Greyden Press, 2013。ISBN-13: 978-1-57074-055-8。\n\n\
  6. *Code Complete: A Practical Handbook of Software Construction*, 第 2 版，Steve McConnell\
  \ 著。Microsoft Press, 2004。ISBN-13: 978-0-73561-967-8。\n\n7. *The Practice of Programming*，Brian\
  \ W. Kernighan 和 Rob Pike 著。Addison-Wesley, 1999。ISBN-13: 978-0-201-61586-9。这本书包含了关于调试和测试的章节。\n\
  \n8. 我们在书籍的 GitHub 仓库中包含了一份 `n3308.pdf`，*Educational Undefined Behavior Technical\
  \ Report*（未定义行为教育技术报告）。文档指出：\n这是一份教育文档，试图解释 `C` 编程语言中的“未定义行为”概念。这是 `ISO WG14` 未定义行为研究小组共同努力，旨在澄清该术语及其影响。我们建议你阅读它。\n\
  \n9. 关于 `Valgrind` 有有趣的回顾，请参见 Nicholas Nethercote 于 2022 年 7 月 27 日写的 *Twenty Years\
  \ of Valgrind* ^(31)。\n\n### 17.11 总结\n- 调试是软件开发的重要部分。应该使用良好的设计和开发实践减少 bug 的引入，但调试始终是必要的。\n\
  - 应该使用开发实践来减少 bug 的引入，但调试始终是必要的。编译程序程序时不带优化并包含调试符号，以使调试更直观。在许多系统中，使用优化和包含调试符号进行编译是相互互斥的。但\
  \ `GCC` 并非如此，这就是为什么 GNU/Linux 开发者需要意识到这个问题。\n- GNU 调试器 `GDB` 是 GNU/Linux 系统的标准配置，几乎可以用于任何商业系统。断点、观察点以及通过\
  \ `next`、`step` 和 `cont` 进行单步执行提供了对运行程序的的基本控制。`GDB` 还允许你检查数据并调用函数。基于 `GDB` 的图形化调试器可用且易于移植。此外，`Vim`\
  \ 和 `Emacs`（标准编辑器）都有可以在编辑器内运行 `GDB` 的模式。这让调试变得更加容易。\n- `rr` 调试器为可逆、可重复的调试提供了令人兴奋的可能性。\n\
  - 在编写程序时，有很多可以做的事情可以让调试变得更容易。我们涵盖了以下主题：\n    - 用于打印状态的调试宏。\n    - 避免表达式宏。\n    -\
  \ 重新排列代码以便更容易单步执行。\n    - 编写供调试使用的辅助函数。\n    - 避免使用 `union`。\n    - 在程序的生产版本保留调试代码，并有不同的方法开启代码输出。\n\
  \    - 添加哑函数以便更容易设置断点。\n- 除了通用调试器，还有许多工具和库可以帮助调试。`splint` 是老牌 V7 `lint` 程序的现代替代品。它在现代\
  \ GNU/Linux 系统上很容易获得，也可以从源码下载并编译。\n- 表 17.1 列出了一组对代码静态分析有用的 `GCC` 编译器选项。\n- `Valgrind`\
  \ 是一个多功能工具，用于发现动态分配内存问题以及与未初始化内存相关。\n- Address Sanitizer 提供了 `Valgrind` 的补充替代方案，不仅检查动态内存，还检查局部和全局内存。这两个程序都应该用于发现和消除内存相关问题（但不要同时使用！）。\n\
  - 身边有一个友好的无物体让你向它解释问题，是寻找 bug 的另一种方法。\n\n\n\n\n\n-   除了调试工具外，软件测试也是软件开发过程中不可或缺的一部分。应该从所有软件开发项目（甚至是个人项目）开始，就对其进行理解、规划和管理。\n\
  -   调试是一项可以学习的技能。我们推荐阅读 David J. Agans 写的 `Debugging` 一书，并学习应用他的规则。\n\n### 练习题\n\
  \n1.  使用 `GCC` 编译你的其中一个程序，同时使用 `-g` 和 `-O`。在 `GDB` 下运行它，并在 `main()` 中设置断点。单步执行程序，观察执行与原始源代码之间的紧密程度（或关联性）。这对于使用\
  \ `while` 或 `for` 循环的代码特别有效。在单步执行代码时检查变量的值。某些变量可能已经消失了！（`GDB` 会告诉你“value was optimized\
  \ out”，即值已被优化”。）\n\n2.  了解 `GDB` 的 `conditional breakpoint`（条件断点）功能。它如何简化处理仅在执行一定次数后才会出现问题的？\n\
  \n3.  了解 `GDB` 的 `attach` 命令。这为你开启了哪些可能性？\n\n4.  重写 Section 17.4.2.1，“添加调试选项和变量,”第\
  \ 623 页 中的 `parse_debug()` 函数，使用一个包含调试选项字符串、标志位值和字符串长度的表格。\n\n5.  （困难）学习 `gawk`\
  \ 源代码——特别是 `awk.h` 中的 `NODE` 结构。编写一个调试辅助函数，根据 `type` 字段的值打印 `NODE` 的内容。\n\n6.  使用启用了泄漏检查的\
  \ `Valgrind` 运行你使用动态内存的程序。描述你发现的问题（如果有的话）。\n\n7.  使用 `Address Sanitizer` 编译程序并再次运行。描述你发现的问题（如果有的话）。\n\
  \n8.  为 `mv` 程序设计一套测试用例。（阅读 `mv`(1)：确保覆盖了它所有的选项。）\n\n9.  在互联网上搜索软件测试资源。你发现了什么有趣的东西？\n\
  \n## 第 18 章\n\n## 一个整合所有内容的项目\n\n在 Chapter 7，“整合为整体：`ls`),”第 201 页中，我们通过查看 V7 的\
  \ `ls.c` 非常巧妙地整合了此前介绍的所有内容。然而，尽管我们很希望这样做，但并没有一个单一程序足够小到可以包含在这里，以整合我们从 Chapter 8，“文件系统和目录遍历),”第\
  \ 221 页开始介绍的各种概念和 API。\n\n### 18.1 项目描述\n\n在日常使用中，唯一用用到书中几乎所有内容的程序就是 shell（壳）。确实，有一些\
  \ Unix 编程书籍会编写一个小型但可行的 shell 来阐明涉及的原理。\n\n真实的 shell 是庞大且复杂的生物。它们必须处理许多可移植性问题（正如我们在整书中概述的那样），在此之外，它们通常还要处理不同版本\
  \ Unix 中的 漏洞。此外，为了实用，shell 还承担了许多不涉及系统调用 API 的工作，例如维护 shell 变量、保存的命令历史等。提供对像 `Bash`、`ksh93`\
  \ 或 `zsh` 这样全功能 shell 的完整介绍将需要专门的一册书。\n\n相反，我们建议按照以下步骤列表编写你自己的 shell，可以将其作为一项（大型）练习来巩固你的理解，或者如果你在学校里，也可以作为一个合作项目：\n\
  \n1.  设计你的命令“语言”，使其易于用简单的代码进行解释。虽然编译器和解释器技术在编写生产级 shell 时很有价值，但对你现阶段阶段来说可能过载了。\n\
  \n   考虑以下几点：\n\n   -   你将要使用 `i18n` 功能吗？\n   -   哪些命令必须内置到 shell 中？\n   -   为了有用，你的\
  \ shell 需要一个命令搜索路径机制，类似于普通 shell 的 `$PATH`。你将如何设置它？\n   -   你希望支持哪些 I/O 重定向？仅限文件？还是包括管道？你是否希望能够重定向文件描述符\
  \ `0`、`1` 和 `2` 之外的内容？\n   -   决定引号将如何工作；你会使用单引号和双引号，还是只用一种？如何转义引号？引号如何与 I/O 重定向相互作用？\n\
  \   -   你将如何处理将命令放入后台？如何等待后台命令完成？\n   -   决定你是否将拥有 shell 变量。\n   -   你将支持什么种通配符或其他扩展？它们如何与引号相互作用？与\
  \ shell 变量如何作用？\n   -   你应该至少规划一个 `if` 和 `while` 语句。设计一种语法。我们将其称为 *block statements*（块语句）。\n\
  \   -   决定你是否希望允许块语句进行 I/O 重定向。如果是，语法看起来是什么样的？\n   -   决定你的 shell 应该如何处理信号（如果处理的话）。\n\
  \   -   在开始之前设计一个测试框架。\n\n2.  如果你打算使用 `i18n` 功能，请从一开始就开始做。事后改造它们是痛苦的。\n\n3.  开始阶段，shell\
  \ 应该读取一行并将其拆分为单词。甚至不要尝试任何其他操作。\n\n4.  让至少两个内置命令工作。\n\n5.  最初，使用固定搜索路径，例如 `\"/bin:/usr/bin:/usr/local/bin\"\
  `。使用 `fork()` 添加进程创建，使用 `exec()` 添加执行（参见 Chapter 9，“进程管理和管道),”第 275 页）。开始阶段，shell\
  \ 应该等待每个新程序完成。\n\n6.  添加后台运行，并作为一个独立的命令等待进程完成（参见 Chapter 9，“进程管理和管道))）。\n\n7.  添加用户设置的搜索路径（参见\
  \ [Section 2.4，“环境变量),”第 37 页）。\n\n8.  添加文件的 I/O 重定向（参见 Section 9.4，“文件描述符管理](#ch09.xhtml_ch09lev1sec4)),”第\
  \ 307 页）。\n\n9.  添加 shell 变量。测试它们与引号的相互作用。\n\n10. 添加通配符和其他扩展（参见 Section 13.7，“元字符扩展](#ch13.xhtml_ch13lev1sec7)),”第\
  \ 450 页）。测试它们与 shell 变量的相互作用。测试它们与引号的相互作用。\n\n11. 添加管道（参见 Section 9.3，“基础进程间通信：管道和\
  \ FIFO](#ch09.xhtml_ch09lev1sec3)),”第 302 页）。在此时，真正的复杂性开始显现。你可能需要仔细检查你如何管理表示运行命令的数据。\n\
  \n    如果你能实现一个可以完成上述所有功能的可用 shell，你就可以在此停下并获得真正的成就感。\n\n12. 如果你愿意接受进一步挑战，添加 `if`\
  \ 和/或 `while` 语句。\n\n\n\n\n\n15. 添加信号处理（参见第 10 章、“信号”、“第 333 页](#ch10.xhtml_page_333)）。\n\
  \n16. 如果你想将你的 shell 用于实际工作，请探索 GNU Readline 库（在 GNU/Linux 系统上输入 `info readline`\
  \ 或查看 Bash shell 的源码）。该库允许你为交互式程序添加 Emacs 风格或 `vi`-风格的命令行编辑。（Readline 库从 [`https://ftp.gnu.org/gnu/readline/`](https://ftp.gnu.org/gnu/readline/)\
  \ 分发；可以查看一些示例文件，例如 `rl.c` 和 `rltest.c`。）\n\n时刻记住两点：始终能够能够测试你所做的一切，并且“不要有任意的限制！”\n\
  \n完成后，对项目进行事后分析。如果第二次做，你会有什么不同？\n\n祝你好运！\n\n### 18.2 推荐阅读\n\n1. *The UNIX Programming\
  \ Environment*，Brian W. Kernighan 和 Rob Pike 著。Pearson，1984。ISBN-13: 978-0-13-937681-8。\n\
  \n这是关于 Unix 编程的*经典*著作，描述了 Unix 环境的整个全貌，从交互式使用到 shell 编程，使用 `<stdio.h>` 函数和底层系统调用进行编程，使用\
  \ `make`、`yacc` 和 `lex` 进行程序开发，以及使用 `nroff` 和 `troff` 生成文档。\n\n尽管这本书有些年代感，但它仍然非常有阅读价值，我们极力推荐。\n\
  \n2. *The Art of UNIX Programming*，Eric S. Raymond 著。Addison-Wesley，2004。ISBN-13:\
  \ 978-0-13-142901-7。\n\n这是一本更高层次的著作，关注 Unix 编程中的设计问题：Unix 程序是如何工作的，以及如何设计你自己的程序使其舒适地融入\
  \ Linux/Unix 环境。\n\n虽然我们并不总是同意作者的观点，但书中确实包含大量重要材料，值得阅读。\n\n# 第四部分\n\n# 附录\n\n##\
  \ 附录 A\n\n## 十年自学编程\n\n*经验，n：*\n\n*某种只有在你正需要它之后才能获得的东西。*\n\n— Olivier\n\n本章由 Peter\
  \ Norvig 编写（版权所有 © 2001–2014 Peter Norvig），并经许可转载。原始文章（包括超链接）请见 [`https://www.norvig.com/21-days.html`](https://www.norvig.com/21-days.html)。我们包含它是因为我们认为它传达了一个重要的信息。上面的引用是我们长期以来最喜欢的之一，由于它符合本附录的主题，我们也将其包含进来。\n\
  \n### 为什么大家都这么匆忙？\n\n走进任何书店，你都会看到《24 小时自学 Java》，旁边还有数无尽的变体，承诺在几天或几小时内教你 C、SQL、Ruby、算法等。亚马逊的高级搜索\
  \ [title: teach, yourself, hours, since: 2000] 找到了 512 本这样的书。在前十名中，有九本是编程书籍（另一本是关于记账会计的）。将“teach\
  \ yourself”替换为“learn”或将“hours”替换为“days”，也会得到类似的结果。\n\n结论是，要么人们在急于学习编程，要么是编程在某种程度上比其他任何东西都容易得多。Felleisen\
  \ *等人* 在他们的书籍《如何设计程序》中对这一趋势表示了认可，他们说：“糟糕的编程很容易。*白痴*也能在*21 天*内学会，即使他们是*笨蛋*。”《Abstruse\
  \ Goose》漫画也对此有见解。\n\n让我们分析一下像《自学 C++ ++ *在 24 小时内》这样的标题可能意味着什么：\n\n* **自学：** 在 24\
  \ 小时内，你没有时间写出几个重要的程序，并从这些程序的成功和失败中学习。你没有时间与经验丰富的程序员合作并理解生活在 C++ 环境中是什么样的。简而言之，你没有时间学到很多东西。所以这本书只能谈论浅层次的熟悉，而不是深刻的理解。正如亚历山大·波普所说，浅浅的学习是危险的。\n\
  \n* **C++：** 在 24 小时内，你可能可以学习 C++ 的一些语法（如果你已经熟悉另一种语言），但你无法学到关于如何使用这种语言的很多知识。简而言之，如果你是一个\
  \ Basic 程序员，你可以学习使用 C++ 语法编写 Basic 风格的程序，但你无法学习 C++ 实际上擅长（和不擅长）什么。那么意义何在？Alan Perlis\
  \ 曾说过：“一种不能影响你对编程思考方式的语言，是不值得知道的。”一个可能的点是，你必须学习一点 C++（或者更有可能是像 JavaScript 或 Processing\
  \ 之类的），因为你需要与现有工具接口以完成特定任务。但那样你并没有学习如何编程；你是在学习如何完成那个任务。\n\n* **24 小时内：** 遗憾的是，这不够，正如下一节所示。\n\
  \n### 十年自学编程\n\n研究人员（Bloom [1985], Harter & Chase [1999], Hayes [1989]）已经表明，在广泛的领域（包括编程、国际象棋、跳棋、音乐、游泳、拓扑）中，培养专业知识大约需要十年。关键在于刻意练习：不仅仅是一遍又地做，而是通过一个超出你当前能力的任务来挑战自己，尝试它，在执行过程中和之后分析你的表现，并纠任何错误。即使是\
  \ 4 岁时就是音乐神童的莫扎特，在开始之前又花费了 13 年。在另一个领域，披头士乐队似乎在 1964 年凭借一系列冠军单曲和《埃德·苏利文秀》而横空而出。但他们从\
  \ 1957 年起就在利物浦和汉堡的小俱乐部表演，他们的首次巨大成功作品《披头士灵幻俱乐部》于 1967 年发行。\n\nMalcolm Gladwell 普及了这个观点，尽管他关注的是\
  \ 10,000 小时，而不是 10 年。Henri Cartier-Bresson（1908–2004）有另一个标准：“你的前 10,000 张照片是最糟糕的。”（他没有预料到通过数码相机，有些人可以在一周内达到那个标准。）真正的专业知识可能需要一生：Samuel\
  \ Johnson（1709–1784）曾说：“任何领域的卓越都只能通过一生的努力获得；它不能以更廉的价格购买。”而乔叟（1340–1400）抱怨道“生命如此短暂，技艺学习漫长。”希波克拉底（公元前\
  \ 400 年）以引言“技艺长而生命短”而闻名，这是更长引用的一部分：“ars longa, vita brevis, occio praeceps, experimentum\
  \ periculosum, iudicium difficile”，翻译成英文为“生命短，机会，，危险，判断困难。”当然，没有单一数字可以作为最终答案：假设所有技能（例如编程、国际象棋、跳棋和音乐）都需要完全相同的时间来精通是不合理的，假设所有人花费的时间完全相同的。正如\
  \ K. Anders Ericsson 教授所说：“在大多数领域，即使是富有天赋的人，达到最高水平也需要惊人的时间。10,000 小时这个数字只是给你一种感觉，我们谈论的是每周\
  \ 10 到 20 小时的多年，即使是某些人认为最有天赋的人也需要这些时间。”\n\n### 所以你想成为一名程序员\n\n这是我的编程成功配方：\n\n* 对编程产生**兴趣**，并因为有趣而这样做。确保它持续保持足够的趣味，以便你愿意投入你的十年/10,000\
  \ 小时。\n\n\n\n\n\n\n## 编程\n\n最好的学习方式是在实做中学习。从更专业的角度来说，“个人在特定领域内的最高水平并不是随着经验的增加而自动获得的，但即使是经验丰富的个人，也可以通过改进的刻意努力来提高性能水平的提升。”（第\
  \ 366 页）而且“最有效的学习需要一个针对特定个人定义的、难度适中的任务、具有启发性的反馈，以及重复和纠正错误的机会”（第 20–21 页）。*实践中的认知：日常生活中的心智、数学与文化*一书为这一观点提供了一个很有趣的参考。\n\
  \n- **与**其他程序员**交流**；阅读其他程序。这比任何书籍或培训课程都重要。\n\n- 如果你愿意，可以在`大学`里读四年（或在研究生院读更久）。这会让你获得一些需要凭证的工作，并让你对该领域有更深层次的理解，但如果你不喜欢学校，你也可以（通过投入精力）自学或在工作中获得类似的经验。无论如何，仅仅靠书本学习是不够的。《新黑客字典》的作者埃里克·雷蒙德（Eric\
  \ Raymond）说：“计算机科学教育无法让任何人成为专家程序员，就像研究画笔和颜料不能让某人成为专家画家一样。”我雇佣过的最好的程序员之一只有高中学历；他产出了许多出色的软件，拥有自己的新闻组，获得的股票期权足够买下他自己的夜会俱乐部。\n\
  \n- 与其他程序员**一起开展**项目**。在某些项目中做最优秀的程序员；在另一些项目中做最糟糕的。当你是最优秀的时候，你可以测试自己领导项目的能力，并用你的愿景激励他人。当你是最糟糕的时候，你学习了大师们在做什么，也学习了他们不喜欢做什么（因为他们会让你替他们做）。\n\
  \n- **在**其他程序员**之后**接手**项目**。理解别人编写的程序。看看当原程序员不在场时，理解并修复它需要什么。思考如何设计你的程序，以便那些在你之后维护它们的人能过得更容易。\n\
  \n- 至少学习六种**编程语言**。包括一种强调类抽象的语言（如 `Java` 或 `C++`）、一种强调函数式抽象的语言（如 `Lisp`、`ML` 或 `Haskell`）、一种支持语法抽象的语言（如\
  \ `Lisp`）、一种支持声明式规范的语言（如 `Prolog` 或 `C++` 模板），以及一种强调并行性的语言（如 `Clojure` 或 `Go`）。\n\
  \n- 记住“计算机科学”中有一个“**计算机**”。了解你的计算机执行一条指令、从内存中提取一个字（无论是否有缓存缺失）、从磁盘读取连续的字以及在磁盘上寻道新位置需要多久。（参见“答案”，第\
  \ 669 页。）\n\n- 参与语言**标准化**工作。可以是 `ANSI C++` 委员会，也可以是决定你本地编码风格是使用 2 个还是 4 个空格缩进。无论哪种，你都会了解别人喜欢语言的什么特性，他们这种感觉有多深，甚至可能稍微了解他们为什么这么想。\n\
  \n- 要有**离开**语言的明智\n\n要有离开语言的明智，我花了大量时间考虑接下来说什么。我决定谈谈计算机。记住“计算机科学”中有一个“计算机”。了解你的计算机执行一条指令、从内存中提取一个字（无论是否有缓存缺失）、从磁盘读取连续的字以及在磁盘上寻道新位置需要多久。\n\
  \n## 答案\n\n典型 PC 上各种操作的大致耗时：\n\n| 操作 | 计时 |\n| :--- | :--- |\n| 执行指令 | 1/1,000,000,000\
  \ 秒 = 1 ns |\n| 从 L1 缓存提取 | 0.5 ns |\n| 分支预测失败 | 5 ns |\n| 从 L2 缓存提取 | 7 ns |\n\
  | 互斥锁/解锁 | 25 ns |\n| 从主内存提取 | 100 ns |\n| 通过 1Gbps 网络发送 2 字节 | 20,000 ns |\n| 从内存顺序读取\
  \ 1MB | 250,000 ns |\n| 从磁盘新位置存取（寻道） | 8,000,000 ns |\n| 从磁盘顺序读取 1MB | 20,000,000\
  \ ns |\n| 数据包从美国到欧洲并往返 | 150 ms = 150,000,000 ns |\n\n## 参考文献\n\n- Bloom, Benjamin\
  \ (ed.), *Developing Talent in Young People*, Ballantine, 1985.\n- Brooks, Fred,\
  \ *No Bullets*, IEEE Computer, no. 20, 1987, p. 10–19.\n- Bryan, W. & Harter, N.,\
  \ “Studies on the telegraphic: The acquisition of habits,” *Psychology Review*,\
  \ 1899.\n- Hayes, John R., *Complete Problem Solver*, Lawrence Erlbaum.\n- Chase,\
  \ William G. & Simon, Herbert A., “Perception in Chess,” *Cognitive Psychology*,\
  \ 1973, 55–81.\n- Lave, Jean, *Cognition in Practice: Mind, Mathematics, and Culture\
  \ in Everyday Life*, Cambridge University Press, 1988.\n\n## 附录：语言选择\n\n几个人问过他们应该先学习什么编程语言。没有标准答案，但请考虑这些点：\n\
  \n- **使用你的工具**。当被问“我应该用什么操作系统，Windows、Unix 还是 Mac？”时，我的回答通常是：“用你朋友用的。”从朋友那里学习获得的优势将抵消操作系统或编程语言之间的内在差异。也要考虑你未来的朋友：如果你继续下去，将加入的程序员社区。\n\
  \n- **保持简单**。像 `C++` 和 `Java` 这样的编程语言是为大型经验丰富的团队专业开发设计的，他们关注代码的运行效率。因此，这些语言包含了为了这些情况而设计的复杂。你关注的是学习编程。你不需要那种复杂性。你需要一种被设计为让单个新手容易学习和记忆的语言。\n\
  \n\n\n\n\n-   *演奏。* 你更倾向于以什么方式学习钢琴：是普通的交互式方式（在你按下琴键时立即听到每个音符），还是“批量”模式（你只有在完成一整首歌后才能听到音符）？显然，交互模式让学习钢琴变得更容易，对于编程也是如此。坚持使用具有交互模式的语言并使用它。\n\
  \n根据这些标准，我建议第一种编程语言选择 `Python` 或 `Scheme`。另一个选择是 `Javascript`，这并不是因为它对初学者设计得完美，而是因为它有许多在线教程，例如可汗学院的教程。但你的情况可能有所不同，还有其他很好的选择。如果你的年龄是个位数，你可能更喜欢\
  \ `Alice`、`Squeak` 或 `Blockly`（年长的学习者也可能喜欢这些）。重要的是你要做出选择并开始。\n\n## 附录：书籍和其他资源\n\n\
  几个人问过他们应该学习哪些书籍和网页。我反复一遍，“仅靠书本是不够的”，但我可以推荐以下内容：\n\n- **Scheme:**计算机程序的结构与解释》（Abelson\
  \ & Sussman 著）可能是计算机科学最好的入门书籍，它确实将编程作为一种理解计算机科学的方法。你可以在网上看到关于这本书的讲座视频，以及在线全文。这本书具有挑战性，它会淘汰掉那些或许可以通过其他方式获得成功的人。\n\
  \n- **Scheme:** 《如何设计程序》（Felleisen * et al.* 著）是关于如何以优雅且功能化的方式设计程序的最佳书籍之一。\n\n-\
  \ **Python:** 《Python 编程：计算机科学导论》（Zelle 著）是一本使用 `Python` 的优秀入门书籍。\n\n- **Python:**\
  \ `Python.org` 上提供了几个在线教程。\n\n- **Oz:** 《计算机编程的概念、技术和模型》（Van Roy & Haridi 著）被一些人认为是\
  \ Abelson & Sussman 著作的现代继任者。它是一场对编程核心思想的之旅，涵盖的范围比 Abelson & Sussman 的书更广，但读起来可能更容易易懂和跟进。它使用了一种名为\
  \ `Oz` 的语言，虽然这种语言并不广为人知，但可以作为学习其他语言的基础。\n\n## 备注\n\nT. Capey 指出，亚马逊上的《完全问题解决者》（Complete\
  \ Problem Solver）页面现在其“购买此项目的客户还购买了这些项目”部分下包含了《21 天自学孟加拉语》和《自学语法与风格》。我猜看这本书的很大一部分是从该页面过来的。感谢\
  \ Ross Cohen 对 `Hippocrates` 提供的帮助。\n\n## 附录 B\n\n## Caldera Ancient UNIX 许可证\n\n\
