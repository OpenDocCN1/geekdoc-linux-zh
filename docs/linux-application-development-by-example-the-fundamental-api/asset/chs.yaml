  22      int last, first;\n23\n24      e1 = (const struct employee *) e1p;\n25  \
  \    e2 = (const struct employee *) e2p;\n26\n27      if ((last = strcmp(e1->lastname,\
  \ e2->lastname)) != 0)\n28          return last;\n29\n30      /* 姓相同，检查名 */\n31\
  \      if ((first = strcmp(e1->firstname, e2->firstname)) != 0)\n32          return\
  \ first;\n33\n34      /* 姓相同，检查名 */\n35      if ((last = strcmp(e1->lastname, e2->lastname))\
  \ != 0)\n36          return last;\n37\n38      /* 姓相同，检查名 */\n39      /*\n40  check\
  \ ID */\n41\n42\n43      if (e1->emp_id == e2->emp_id)\n44          return 0;\n\
  45      else\n46          return 1;\n47  }\n```\n\n\n\n\n```\n$ cat presdata.txt\n\
  Trump Donald 47 1737396000\nBiden Joseph 46 1611165600\nTrump Donald 45 1484935200\n\
  Obama Barack 44 1232474400\nBush George 43 980013600\nClinton William 42 727552800\n\
  Bush George 41 601322400\nReagan Ronald 40 348861600\nCarter James 39 222631200\n\
  ```\n\n数据根据姓氏、然后是名、最后是资历进行排序的。运行该程序时，会产生如下输出：\n\n此输出基于美国东部时区。\n\n```\n$ ch-extended-tsearch\
  \ < presdata.txt\nDepth: 2\\. Employee:\n    Biden, Joseph   46  Wed Jan 20 13:00:00\
  \ 2021\n\nDepth: 3\\. Employee:\n    Bush, George    41  Fri Jan 20 13:00:00 1989\n\
  \nDepth: 1\\. Employee:\n    Bush, George    43  Sat Jan 20 13:00:00 2001\n\nDepth:\
  \ 3\\. Employee:\n    Carter, James   39  Thu Jan 20 13:00:00 1977\n\nDepth: 2\\\
  . Employee:\n    Clinton, William    42  Wed Jan 20 13:00:00 1993\n\nDepth: 0\\\
  . Employee:\n    Obama, Barack   44  Tue Jan 20 13:00:00 2009\n\nDepth: 2\\. Employee:\n\
  \    Reagan, Ronald  40  Tue Jan 20 13:00:00 1981\n\nDepth: 1\\. Employee:\n   \
  \ Trump, Donald   45  Fri Jan 20 13:00:00 2017\n\nDepth: 2\\. Employee:\n    Trump,\
  \ Donald   47  Mon Jan 20 13:00:00 2025\n```\n\n#### 16.4.6 节点删除与树删除：`tdelete()`\
  \ 和 `tdestroy()`\n\n最后，你可以从树中移除项，并在 GLIBC 系统上删除整棵树：\n\n```c\nvoid *tdelete(const\
  \ void *key, void **rootp,\n              int (*compare)(const void *, const void\
  \ *));\n\n/* GLIBC 扩展，不在于 POSIX 中： */\nvoid tdestroy(void *root, void (*free_node)(void\
  \ *nodep));\n```\n\n`tdelete()` 的参数与 `tsearch()` 相同：键（key）、树根的地址以及比较函数。如果在树中找到了给定的项，它将被移除，且\
  \ `tdelete()` 返回一个指向给定节点父节点的指针。否则，它返回 `NULL`。如果你需要删除原始项（例如为了释放其存储空间），则必须在代码中小心管理这种行为：\n\
  \n```c\nstruct employee *e, key; // 变量声明\nvoid *vp, *root; // 填充要移除项的键\nvp = tfind(&\
  \ key, root, emp_name_compare); // Find 要移除的项\nif (vp != NULL) {\n    e = *((struct\
  \ employee **) vp); // 转换指针\n    free(e); // 释放存储空间\n}\n(void) tdelete(& key, root,\
  \ emp_name_compare); // 现在从树中移除\n```\n\n如果你删除了存储在根节点的项，返回值是“未指定的指针”（POSIX）。更准确地说，手册页说\
  \ `tdelete()` 返回的是一个不能访问的悬空指针。`tdestroy()` 函数是一个 GLIBC 扩展。它允许你销毁整棵树。第一个参数是树的根。第二个参数是一个指向函数的指针，该函数释放树中每个节点所指向的数据。如果这些数据不需要进行任何处理（例如，它们存储在普通数组中，如我们之前的示例所示），则该函数应该什么都不做。不要传递\
  \ `NULL`！这样做会导致崩溃。\n\n## 16.5 总结\n\n- 有时，需要分配按特定边界对齐的内存。`posix_memalign()` 可以做到这一点。它的返回值与书中涵盖的大多数函数不同：`memalign()`\
  \ 也会分配对齐内存，但并非所有系统支持通过 `free()` 释放该内存。\n- 使用 `fcntl()` 进行文件锁提供了记录锁，细化到文件内单个字节的级别。读锁防止对锁定区域的写入，而写锁防止其他进程读取和写入锁定区域。锁定是建议性的，POSIX\
  \ 标准也只规定建议性锁定。这些锁与进程相关。\n- 大多数现代 Unix 系统支持强制性锁定，使用文件的 `setgid` 权限。GNU/Linux 不再支持强制性锁定。\n\
  - 此外，GNU/Linux 提供了与打开的描述符相关的建议性锁定，这些包含在 POSIX 标准中。\n- 在 GNU/Linux 上，`lockf()` 函数是\
  \ `fcntl()` POSIX 锁的封装；而 BSD 的 `flock()` 函数锁（在 GNU/Linux 上）完全独立于 `fcntl()`。BSD 的\
  \ `flock()` 锁是针对整个文件的。\n\n### 练习\n\n1. 使用 `fcntl()` 实现 `lockf()` 函数。\n2. 如果你有支持强制性锁定的非\
  \ Linux 系统，尝试 `ch-extended-lockall` 程序。\n3. 编写一个名为 `strftimes()` 的函数，如下：\n   ```c\n\
  \   size_t strftimes(char *buf, size_t size, const char *format,\n             \
  \       const struct timeval *tp);\n   ```\n   它的行为类似于标准的 `strftime()` 函数，但允许 `%q`\
  \ 表示“当前的微秒数”。你可以从第 6 章练习中写的 `strftime()` 版本开始。\n4. 使用你刚刚写的 `strftimes()` 函数，编写一个增强版的\
  \ `date`，它接受以 `+` 开头的格式字符串并格式化当前日期时间。（参见 `date`(1)）\n5. `ch-extended-timers.c` 对超时的处理相当原始。重写程序，在打印提示后使用\
  \ `setjmp()`并在信号处理程序内部使用 `longjmp()`。这提高了结构或清晰度？\n6. 我们注意到 `ch-extended-timers.c`\
  \ 包含一个故意的竞态条件。假设用户在正确的时间范围内响应，但在取消定时器之前 `ch-extended-timers` 被挂起。你可以调用什么函数来缩小问题窗口？\n\
  7. 按照 16.4.5 节所示，画出树。\n8. 检查 GNU/Linux 系统上的 `/usr/share/dict/words` 文件。（这是 `spell`\
  \ 的拼写字典；在不同系统上可能位于不同位置，可能是指向真实文件的符号链接。（你可能需要安装 `spell` 程序才能获取此文件。）\n\n   首先，使用此\
  \ `awk` 程序创建一个新列表，顺序随机：\n\n   ```bash\n   $ awk '{ list[$0]++ }\n   > END { for\
  \ (i in list) print i }' /usr/share/dict/words > /tmp/wlist\n   ```\n\n\n\n\n\n\
  接下来，编写两个程序。每个程序都应该读取新列表，并将读取的每个单词分别存储在树和数组中。第二个程序应该使用 `qsort()` 对数组进行排序，并使用 `bsearch()`\
  \ 进行搜索。\n\n从树或数组中检索单词 `gravy`。对这两个程序计时，看看哪一个运行得更快。你可能需要将单词检索放在一个多次运行的循环（例如 10,000\
  \ 次）中，以获得足够长的运行时间的显示差异。\n\n使用 `ps` 的输出查看每个程序使用的内存。\n\n9. 重新运行这两个程序，使用原始排序后的字典文件，看看计时结果是否发生了变化。\n\
  \n# 第三部分：调试与最终项目\n\n## 第 17 章：调试\n\n*有时候，你就是无法摆脱炸弹！* \n*—* 蝙蝠\n\n有很多实践——从程序逻辑和数据设计开始，通过代码拆解、组织直到实现——可以帮助尽可能地减少错误和问题。我们鼓励你学习这些；找一些关于软件设计和软件工程的好书籍，并将建议付诸实践！任何超过几百行的程序都应该经过仔细的思考和设计，而不是胡乱修改直到它看起来可以运行。\n\
  \n然而，由于程序员也是人，编程错误是不可避免的。*调试*（Debugging）是追踪和消除程序错误的过程。即使设计良好、实现良好的程序偶尔也会无法工作；当出现问题而你无法确定原因时，将调试器指向代码并观察它的失败是一个好主意。\n\
  \n本章涵盖了一系列主题，从基础的调试建议和技术（用于调试的编译以及 GDB GNU 调试器的基本使用）开始，然后过渡到程序开发和调试期间使用的系列使调试更简单的技术，最后查看一些帮助调试过程的工具。最后我们对软件测试进行了简要介绍，以及一组极佳的“调试规则”，这些规则摘自于我们非常推荐的一本书。\n\
  \n我们的大部分建议都基于我们作为 GNU 项目志愿者维护 `gawk`（GNU `awk`）的长期经验。我们展示的大多数（不是全部）特定示例都来自该程序。\n\
  \n在整个章节中，特定的建议标记为 **Recommendation**（建议）。\n\n### 17.1 首先要任务\n\n*注意，有时要让程序在调试器下失败可能是令人发疯狂的困难，这是另一类且令人沮丧的错误。*\n\
  *—* Chet Ramey\n\n当程序运行异常时，你可能不知道首先该做什么。通常，奇怪的行为是由于误用内存——使用未初始化的值、在动态内存边界之外读取或写入等。因此，在启动调试器*之前*，尝试使用内存调试工具可能会获得更快的结果。\n\
  \n原因是内存工具可以直接指向失败的代码行，而使用调试器更像是开始了一场“搜索并摧毁”的任务，在任务中你必须先隔离问题，然后修复它。一旦你确定内存问题不是问题，就可以继续使用调试器。\n\
  \n由于调试器是一个更通用的工具，我们首先介绍它。在章节的后部分，我们将讨论两个主要的内存调试工具。\n\n那么 Chet Ramey 描述的那种你甚至无法使用调试器的情况该如何呢？在这种情况下，第\
  \ 17.4.2 节中的“运行时调试代码”以及第 622 页中描述的部分或全部技术可能有所帮助。\n\n## 17.2 为了调试而编译\n\n为了使用源代码调试器，被调试的可执行文件（如果称为*目标*）必须使用编译器的\
  \ `-g` 选项进行编译。该选项导致编译器在对象代码中放入额外的*调试符号*——即提供变量、常量、函数等的名称和类型的额外信息。调试器随后使用这些信息将源代码位置与正在执行的代码相匹配，并在运行的程序中检索或存储变量值。\n\
  \n在许多许多 Unix 系统上，`-g` 编译器选项与开启优化的 `-O` 选项是互斥的。这是因为优化会导致对象代码位片段的重排，使得执行的内容与源代码的线性读取之间不再有直接关系。通过禁用优化，你可以让调试器更容易将对象代码与源代码联系起来，反之，单步执行程序就能以直观的方式工作。（单步执行将在稍后描述。）\n\
  \nGCC（GNU 编译器集）允许同时使用 `-g` 和 `-O`。然而，这引入了我们在调试时希望避免的正的问题，即在调试器中跟踪执行将变得相当困难。允许两者同时使用的用处是，你可以在优化的、用于生产环境的可执行文件中保留调试符号。它们只占用磁盘空间，不占用内存。这样，安装的可执行文件在紧急情况下仍然可以调试。\n\
  \n根据我们的经验，如果你需要使用调试器，最好从头重新编译应用程序，仅使用 `-g` 选项。这使得追踪变得容易得多；有足够的细节来跟踪按照编写的方式运行程序，而而不必担心编译器如何重排代码。\n\
  \n有一个例外：*要确保程序仍然运行异常*。可重现性是调试的关键；如果你无法重现问题，追踪并修复它将*困难得多*。极少情况下，不带 `-O` 编译程序会导致其停止。^(1)通常在不带\
  \ `-O` 编译时问题仍然存在，这意味着确实存在某种逻辑错误。\n\n当你的程序在用 `-O` 编译时失败但在不带编译时不失败时，还有另一种可能性：你无意中做了某些依赖于*未定义行为*的操作，这是语言中的灰色区域，标准特别对此未予说明。\n\
  \n关于未定义行为的讨论远出本书的范围。请参阅第 17.10 节中的“建议阅读”以及第 655 页中对 `n3308.pdf` 的引用，获取更多信息。\n\n\
  **Recommendation:** 不要将 `-g` 与 `-O` 混合使用。\n\n## 17.3 GDB 基础\n\n*调试器*是一个允许你控制另一个程序的执行并检查更改子程序状态（如变量值）的程序。调试器有两种：*机器级调试器*在机器指令级别工作，而*源码级调试器*以程序源代码为术语工作。例如，在机器级调试器中，要更改变量的值你需要指定其内存地址。在源码级调试器中，你只需使用变量名。\n\
  \n从历史上看，V7 Unix 有 `adb`，这是一个机器级调试器。System III 有 `sdb`，这是一个源码级调试器，而 BSD Unix 提供了\
  \ `dbx`，也是一个源码级调试器。（两者继续提供 `adb`。）\n\nGDB（GNU 调试器）是一个源码级调试器。它比 `sdb` 或 `dbx` 具有更多功能、更广泛的可移植性且更易用。^(2)\n\
  \n\n\n\n\n# 我们说的是原始的 BSD `dbx`。几十年来，我们一直专门使用 GDB。\n\n与它的先驱一样，GDB 是一个命令行调试器。它一次打印一行源代码，显示提示符，并读取一行包含要执行命令的输入。（还有其他更易于使用\
  \ GDB 的方法，我们稍后会提到。）\n\nGDB 支持 C 和 C++，包括对 `name demangling`（反修饰）的支持，这意味着你可以使用普通的\
  \ C++ 名称命名类成员函数和重载函数。特别是，GDB 理解 C 表达式语法，这在你想要查看复杂表达式的值（例如 `*ptr->x.a[1]->q`）时非常有用。它还理解\
  \ Fortran、D、Objective-C、Java、OpenCL、Pascal、Modula-2 和 Ada。\n\n如果你正在运行 GNU/Linux\
  \ 或 BSD 系统（并且安装了开发工具），那么你应该已经安装了较新版本的 GDB 并可以随时使用。如果没有，你可以从 GNU 项目的 FTP 站点下载 GDB\
  \ 源码并自行编译。\n\n[https://ftp.gnu.org/gnu/gdb/]\n\nGDB 自带有一份手册，长度超过 700 页（不包括附录）。你可以在\
  \ GDB 源码目录中生成手册的可打印版本并自行打印。你也可以从自由软件基金会（FSF）购买装订本；你的购买将帮助 FSF 并直接有助于更多自由软件的生产。（订单信息请参见\
  \ FSF 网站。）本节介绍了 GDB 的基础知识；我们建议阅读手册以学习如何充分利用 GDB 的功能。\n\n[http://www.gnu.org]\n\n\
  ### 17.3.1 获取 `core` 文件\n\n在 Unix 及其派生系统中，运行异常的程序通常会崩溃并留下 `core dump`（核心转储）。事实上，我们在第\
  \ 10.2 节“信号动作”第 333 页看到，许多信号都会导致此类核心转储。\n\n用 `core` 一词指代“内存”可以追溯到计算机早期，当时内存中的每个位都存储在磁环（core）中，磁环上穿过金属。关于这种内存的更多信息可以参考维基百科上关于磁芯内存的文章（`https://en.wikipedia.org/wiki/Magnetic-core_memory`）。\n\
  \n最初，核心转储被创建在崩溃进程当前目录下的一个名为 `core` 的文件中（如果该进程在该处有写权限）。在多年以后，在 GNU/Linux 下，此类文件（默认）被命名为\
  \ `core.pid`，其中 `pid` 是崩溃运行程序的进程 ID 数字。`pid` 扩展意味着你可以在同一目录下拥有多个核心转储文件，这很有帮助，但也很消耗磁盘空间！\n\
  \n### 17.3.1.1 核心文件模式\n\n今天，情况已经不同了。大多数 GNU/Linux 系统并非由开发者使用，如果应用程序在随机目录中产生核心转储，它对任何人可能都没有太大用处。相反，当应用程序崩溃时，向应用程序开发者发送报告，或至少发送给你正在使用的特定\
  \ GNU/Linux 发行版的开发者是有用的。当这种情况发生时，至少在某些系统上，会弹出一个窗口，类似于图 17.1 所示。\n\n![Images](img/fig17-001.jpg)\n\
  \n**图 17.1:** 错误报告弹出窗口\n\n实现这一点的机制相当复杂。详细细节（有很多细节）可以在 `core` 手册页中找到。\n\n基本上，文件 `/proc/sys/kernel/core_pattern`\
  \ 用作要创建的文件名的模板。在该文件中，某些指定符会被替换为关于转储核心进程的相关信息。例如，为了获得传统的 `core.pid` 类型的核心转储，你需要将\
  \ `core.%p` 放入 `/proc/sys/kernel/core_pattern`。\n\n如果 `/proc/sys/kernel/core_pattern`\
  \ 的第一个字符是管道字符（`|`），则该行的剩余部分是待运行的用户空间程序的模板。该程序通过标准输入接收核心文件的内容。要运行的程序必须提供绝对路径。\n\n\
  在我们的系统中，`/proc/sys/kernel/core_pattern` 看起来如下：\n\n```\n$ cat /proc/sys/kernel/core_pattern\n\
  |/usr/share/apport/apport -p%p -s%s\n```\n\n### 17.3.1.2 生成核心转储\n\n让我们尝试创建一个核心转储。以下程序\
  \ `ch-debugging-abort.c` 创建了几个嵌套的函数调用，然后通过 `abort()` 崩溃以创建核心转储：\n\n```c\n/* ch-debugging-abort.c\
  \ --- 一个核心转储 */\n\n#include <stdio.h>\n#include <stdlib.h>\n\n/* recurse --- 建立一些函数调用\
  \ */\nvoid\nrecurse(void)\n{\n    static int i;\n\n    if (++i == 3)\n        abort();\n\
  \    else\n        recurse();\n}\n\nint\nmain(int argc, char **argv)\n{\n    recurse();\n\
  }\n```\n\n让我们编译并运行它：\n\n```bash\n$ cc -O ch-debugging-abort.c -o ch-debugging-abort\
  \          编译程序\n$ ls                                                         检查目录内容\
  \ \nch-debugging-abort ch-debugging-abort.c\n$ ch-debugging-abort a b c        \
  \                           运行程序\nAborted (core dumped)\n$ ls                  \
  \                                       检查一下，成功了！\nch-debugging-abort ch-debugging-abort.c\
  \                     成功了！但真的吗？核心文件在哪里？\n$ ulimit -c                           \
  \                        可能我们有资源限制？\nunlimited                                 \
  \                   嗯，资源限制没有问题\n```\n\n当然，问题在于核心模式文件。我们必须（临时地）向核心模式文件放入一个对我们更有用的模式：\n\
  \n```bash\n$ cp /proc/sys/kernel/core_pattern save_core_pattern         保存原始模式\n\
  $ sudo sh -c 'echo core.%p > /proc/sys/kernel/core_pattern'   以 root 身份更新\n[sudo]\
  \ password for arnold:\n$ cat /proc/sys/kernel/core_pattern                    \
  \      验证更改\ncore.%p\n$ ch-debugging-abort a b c                               \
  \    再次尝试，参数未未使用\nAborted (core dumped)\n$ ls                                  \
  \                       检查一下，成功了！\nch-debugging-abort ch-debugging-abort.c core.36698\
  \ save_core_pattern\n$ sudo sh -c 'cat save_core_pattern > /proc/sys/kernel/core_pattern'\
  \ 恢复原始\n```\n\n\n\n\n对 `/proc/sys/kernel/core_pattern` 的修改是暂时的；它们在重启后不会持续。若要进行永久性更改，你必须修改系统启动文件之一（或创建一个新文件），将你所需的核心转储模式存入其中。具体细节将随\
  \ GNU/Linux 发行版和时间的推移而异，因此我们不会尝试提供具体的建议。\n\n### 17.3.2 运行 GDB\n\n现在我们已经知道如何获取核心文件（core\
  \ file），可以查看如何使用 GDB 来检查它。基本用法如下：\n\n```\ngdb [ options ] [ executable [ core-file-name\
  \ ]]\n```\n\n在这里，`executable` 是要调试的可执行程序。如果提供了 `core-file-name`，它是程序被操作系统杀死并转储核心储（dumped\
  \ core）时创建的 `core` 文件的名称（见前一节）。\n\n如果你忘记在命令行中为文件命名，可以使用 `file executable` 告诉 GDB\
  \ 可执行文件的名称，并使用 `file core -file-name` 告诉 GDB 核心文件的名称。\n\n在有核心转储文件的情况下，GDB 会指示程序崩溃的位置。首先，让我们带有调试符号且不进行优化的情况下重新编译。然后让我们获取一个核心文件。我们将使用之前显示的\
  \ `ch-debugging-abort.c`：\n\n```\n$ rm core.36698 ch-debugging-abort           \
  \                清理并重新开始\n$ cc-g ch-debugging-abort.c -o ch- debugging- abort  \
  \        重新编译，不加 -O\n$ sudo sh-c 'echo core.%p > /proc/sys/kernel/core_pattern'\
  \   以 root 身份更新模式\n$ ch-debugging-abort a b c                                  \
  \ 获取我们的核心转储\nAborted (core dumped)\n$ ls                                       \
  \                  在那儿\nch-debugging-abort ch-debugging-abort.c core.38668 save_core_pattern\n\
  ```\n\n下面是使用该程序的一个简短 GDB 会话：\n\n```\n$ gdb ch-debugging-abort core.38668       \
  \      对程序和核心文件启动 GDB\nGNU gdb (Ubuntu 12.1-0ubuntu1~22.04) 12.1\nCopyright (C)\
  \ 2022 Free Software Foundation, Inc.\n...\n\n输入 \"help\" 以获取帮助。\n输入 \"apropos word\"\
  \ 搜索与 \"word\" 相关的命令...\nReading symbols from ch-debugging-abort...\n[New LWP 38668]\n\
  [Thread debugging using libthread_db enabled]\nUsing host libthread_db library \"\
  /lib/x86_64-linux-gnu/libthread_db.so.1\".\nCore was generated by 'ch-debugging-abort\
  \ a b c'.    GDB 打印了命令行\nProgram terminated with signal SIGABRT, Aborted.\n#0 __pthread_kill_implementation\
  \ (no_tid=0, signo=6, threadid=124448894838592)\n   at ./nptl/pthread_kill.c:44\n\
  44 ./nptl/pthread_kill.c: No such file or directory.\n(gdb) where              \
  \                               打印堆栈跟踪\n#0 __pthread_kill_implementation (no_tid=0,\
  \ signo=6, threadid=124448894838592)\n   at ./nptl/pthread_kill.c:44\n#1 __pthread_kill_internal\
  \ (signo=6, threadid=124448894838592)\n   at ./nptl/pthread_kill.c:78\n#2 __GI___pthread_kill\
  \ (threadid=124448894838592, signo=signo@entry=6)\n   at ./nptl/pthread_kill.c:89\n\
  #3 0x0000712f84042476 in __GI_raise (sig=sig@entry=6) at ../sysdeps/posix/raise.c:26\n\
  #4 0x0000712f840287f3 in __GI_abort () at ./stdlib/abort.c:79\n#5 0x000058ea51873170\
  \ in recurse () at ch-debugging-abort.c:14    <---- 我们需要检查这里\n#6 0x000058ea51873175\
  \ in recurse () at ch-debugging-abort.c:16\n#7 0x000058ea51873175 in recurse ()\
  \ at ch-debugging-abort.c:16\n#8 0x000058ea51873190 in main (argc=1, argv=0x7ffc729fb5d8)\
  \ at ch-debugging-abort.c:22\n```\n\nGDB 打印了导致核心转储的命令行。\n\n`where` 命令打印堆栈跟踪（stack-trace）——即所有调用的函数列表，最近的在最前面。注意\
  \ `recurse()` 函数被调用了三次。`bt` 命令是“back trace”（回溯）的 `where` 的别名；这样输入更方便。\n\n堆栈中的每个函数调用被称为一个“帧”（frame）。这个术语源于编译器领域，在该领域中，每个函数都是独立的。\n\
  \nGDB 打印了导致核心转储的命令行。\n\n`where` 命令打印堆栈跟踪——即所有调用的函数列表，最近的在最前面。注意 `recurse()` 函数被调用了三次。`bt`\
  \ 命令是“back trace”（回溯）的 `where` 的别名；这样输入更方便。\n\n堆栈中的每个函数调用被称为一个“帧”（frame）。这个术语源于编译器领域，在该领域中，每个函数都是独立的。\n\
  \nGDB 打印了导致核心转储的命令行。\n\n`where` 命令打印堆栈跟踪——即所有调用的函数列表，最近的在最前面。注意 `recurse()` 函数被调用了三次。`bt`\
  \ 命令是“back trace”（回溯）的 `where` 的别名；这样输入更方便。\n\n（注：由于原文中存在部分内容重复，译文已根据“不要重复输出原文”的原则进行了去重处理，确保逻辑连贯。）\n\
  \n\n\n\n```\n$ gdb gawk                                               在 gawk 上启动\
  \ GDB\nGNU gdb (Ubuntu 12.1-0ubuntu1~22.04) 12.1\n...\n(gdb) break do_print    \
  \                                 在 do_print 中设置断点\nBreakpoint 1 at 0x426471: file\
  \ builtin.c, line 2321.\n(gdb) run 'BEGIN { print \"hello, world\" }'          \
  \     启动程序\nStarting program: /home/arnold/Gnu/gawk/gawk.git/gawk 'BEGIN { print\
  \ \"hello, world\" }'\n[Thread debugging using libthread_db enabled]\nUsing host\
  \ libthread_db library \"/lib/x86_64-linux-gnu/libthread_db.so.1\".\nBreakpoint\
  \ 1, do_print (nargs=1, redirtype=0) at builtin.c:2321\n2321    {              \
  \                                  执行到达断点\n(gdb) list                          \
  \                     显示源代码\n2316\n2317    /* do_print --- print items, separated\
  \ by OFS, terminated with ORS */\n2318\n2319\n    void\n2320    do_print(int nargs,\
  \ int redirtype)\n2321    {\n2322        struct redirect *rp = NULL;\n2323     \
  \   int errflg = 0;\n2324        FILE *fp = NULL;\n2325        int i;\n```\n\n一旦到达断点，你就可以通过单步执行继续程序。这意味着\
  \ GDB 允许程序每次执行一条源代码语句。GDB 会打印它即将执行的行，然后打印提示符。要运行该语句，使用 `next` 命令：\n\n```\n(gdb)\
  \ next                                            运行当前语句（上方 2322 行）\n2322      \
  \  struct redirect *rp = NULL;               GDB 打印下一语句\n(gdb)                 \
  \                                按 ENTER 运行并进入下一个\n2323        int errflg = 0;\n\
  (gdb)                                                 再次按 ENTER\n2324        FILE\
  \ *fp = NULL;\n...\n2356        for (i = 1; i <= nargs; i++) {\n(gdb)\n2357    \
  \        tmp = args_array[i] = POP();\n```\n\n`step` 命令是单步执行的另一种命令。`next` 和 `step`\
  \ 之间存在着重要的区别。`next` 执行下一个语句。如果该语句包含函数调用，该函数会被调用并在 GDB 重新获得运行程序的控制权之前返回。\n\n相反，当你对包含函数调用的语句使用\
  \ `step` 时，GDB 会进入被调用的函数，允许你继续单步执行（或跟踪）程序。如果一个语句不包含函数调用，则 `step` 与 `next` 相同。\n\n\
  ### 注意\n\n很容易忘记你正在使用哪个命令，并一直按 ENTER 来运行后续每个语句。如果你正在使用 `step`，可能会意外进入库函数，例如 `strlen()`\
  \ 或 `printf()`，而你其实并不想处理它们。在这种情况下，你可以使用 `finish` 命令，它会让程序运行直到当前函数返回。\n\n你可以使用 `print`\
  \ 命令打印内存内容。GDB 理解 C 表达式语法，这使得检查指针指向的结构体变得简单且自然：\n\n```\n(gdb) print *tmp       \
  \                       打印 tmp 指向的结构\n$1 = {sub = {nodep = {l = {lptr = 0x0, li\
  \ = 0x0, ll = 0, lp = 0x0}, r = {\n        rptr = 0x0, preg = {0x0, 0x0}, av = 0x0,\
  \ bv = 0x0, uptr = 0x0,\n        iptr = 0x0}, x = {extra = 0x0, aptr = 0x0, xl =\
  \ 0, cmnt = 0x0},\n     name = 0x4e <error: Cannot access memory at address 0x4e>,\n\
  \     reserved = 5153936, rn = 0xc, cnt = 4294967295, reflags = 0}, val = {\n  \
  \   nm = {fltnum = 0, mpnum = {{_mpfr_prec = 0, _mpfr_sign = 0,\n           _mpfr_exp\
  \ = 0, _mpfr_d = 0x0}}, mpi = {{_mp_alloc = 0,\n           _mp_size = 0, _mp_d =\
  \ 0x0}}}, rndmode = 78,\n     sp = 0x4ea490 \"hello, world\", slen = 12, idx = -1,\
  \ wsp = 0x0, wslen = 0,\n     typre = 0x0, comtype = 0}}, type = Node_val,\n flags\
  \ = (MALLOC | STRING | STRCUR), valref = 2}\n```\n\n注意 `flags` 的值。这是结构体中的一个 `enum`\
  \ 字段，其值为位域。GDB 足够智能这一点并以符号形式打印值！\n\n最后，`cont` (continue) 命令让程序继续。\n\n```\n(gdb)\
  \ cont                                     继续执行\n[Inferior 1 (process 3586) exited\
  \ normally]\n(gdb) quit                                     退出调试器\n调试会话活动中。\n\n\
  \    Inferior 1 [process 36043] 将被杀死。\n\n仍然退出吗？ (y or n) y                     \
  \     是的，真的\n```\n\n\n\n\n\n此参考卡设计用于在 8.5 x 11 英寸（信纸尺寸）的纸上双面打印，横向格式。它提供了最常用 GDB\
  \ 命令的六列摘要。我们建议将其打印出来，并在使用 GDB 时放在键盘旁。为了方便起见，本书的 GitHub 仓库中包含了一份 GDB 16.3（截至本文时的最新版本）的参考卡副本。\n\
  \n**建议：** 投入时间彻底学习 GDB，而不仅仅是我们在本文中所涵盖的内容。\n\n### 17.3.4 逃离“逐行调试”的局限\n\n逐行调试器非常适合在像这样的书中介绍调试器和调试入门方法。然而，尽管逐行界面简单易懂，但它用起来并不尽人意，特别是当你习惯了处理满屏幕的源代码时。\n\
  \n通常，我们所说的*增强型*界面提供多个窗口，其中一个用于输入普通的 GDB 命令，另一个用于显示多行源代码。通常还会有窗口用于显示程序的输出（如果有的话）。\n\
  \n以下是你应该探索的几个选项。可能至少有一个选项会比在终端窗口中使用原生 GDB 更适合你：\n\n*   *内置的 TUI 界面*\n    GDB 有一个内置的基于屏幕的界面，称为用户界面（Terminal\
  \ User Interface），简称 TUI。使用 `gdb --tui ...` 调用它。GDB 手册有一个专门的章节解释 TUI 界面。\n\n*  \
  \ *Curses GDB (CGDB)*\n    Curses GDB 项目为 GDB 提供基于屏幕的界面，包括 C 语言的语法高亮。\n    `https://cgdb.github.io/`\
  \ (https://cgdb.github.io/)\n\n*   *Vim 的 `termdebug` 包*\n    Vim（vi Improved）编辑器提供了一个名为\
  \ `termdebug` 的包，它可以打开三个窗口：一个用于 GDB 提示符，一个用于源代码，一个用于程序输出。（这是我们使用的。）图 17.2 显示了一个示例会话。\n\
  \    `https://www.vim.org` (https://www.vim.org)\n    ![Images](img/fig17-002.jpg)\n\
  \    **图 17.2：** 在 Vim 中调试\n\n*   *Emacs GDB 集成*\n    GNU Emacs 编辑器提供了 GDB 集成。\n\
  \    `https://www.gnu.org/software/emacs/` (https://www.gnu.org/software/emacs/)\n\
  \n*   *`ddd` 调试器*\n    `ddd` 调试器是一个图形化调试器；它构建在 GDB 之上，因此如果你学习了 GDB，立即可以使用 `ddd`。（`ddd`\
  \ 有它自己的手册，如果你打算频繁使用，应该阅读它。）\n    许多 GNU/Linux 系统上都可以安装 `ddd`。可以从 GNU 项目的 `ddd` 下载站点获取源代码（`https://ftp.gnu.org/gnu/ddd/`\
  \ (https://ftp.gnu.org/gnu/ddd/))）。\n\n**建议：** 选择一个增强 GDB 的界面并使用它。\n\n### 17.3.5\
  \ 使用 `rr` 进行重复且可反转的调试\n\n在我们完成本书修订时，我们遇到了一个尚未尝试过的有趣工具。因此这一节不可避免地很短，仅对 `rr` 进行介绍，我们希望你对其进一步探索。\n\
  \n`rr` 作为 GDB 现有功能的增强，提供了可重复、可反转的调试。GDB 手册对*反向执行*（reverse execution）定义如下：\n`https://sourceware.org/gdb/current/onlinedocs/gdb.html/Reverse-Execution.html`\
  \ (https://sourceware.org/gdb/current/onlinedocs/gdb.html/Reverse-Execution.html)\n\
  \n在调试程序时，发现自己走得太远，某些感兴趣的事件已经发生，并不奇怪。如果目标环境支持，GDB 可以允许你通过反向运行程序来“回溯”。\n\n支持反向执行的目标环境应该能够“撤销”程序在正常执行期间发生的机器状态变化。变量、寄存器等应该恢复到之前的值。显然，这要求目标环境具有高度复杂性；并非所有目标环境都支持反向执行。\n\
  \n当程序被反向执行时，最近执行的指令将按反序被“撤销”。程序计数器反向运行，遵循之前执行线程的反方向。当每条指令被“撤销”时，该指令更改的内存和/或寄存器值将恢复到先的状态。在反向执行一段代码后，该代码的所有副作用都应该被“撤销”，所有变量都应该返回到之前的值。\n\
  \n`rr` 调试器通过在跟踪文件中记录程序的执行情况来工作，允许你以确定的方式反复重放执行。它还提供了非常高效的反向执行。\n`https://rr-project.org/`\
  \ (https://rr-project.org/)\n\n关于反向执行和 `rr` 的很好的介绍可以在 `https://stackoverflow.com/questions/1470434/how-does-reverse-debugging-work/53063242#53063242`\
  \ (https://stackoverflow.com/questions/1470434/how-does-reverse-debugging-work/53063242#53063242)\
  \ 找到。\n\n`rr` wiki 提供了 `rr` 的介绍。\n`https://github.com/rr-debugger/wiki/Usage` (https://github.com/rr-debugger/wiki/Usage)\n\
  \n可以在 GitHub 上找到源代码。我们通过系统中的包安装了 `rr`，所以可能也可以这样做，无需从源码编译。`https://github.com/rr-debugger`\
  \ (https://github.com/rr-debugger/)\n\n### 17.3.6 提及：`lldb`\n\n`lldb` 调试器是一个较新的调试器，可以安装在\
  \ GNU/Linux 和几个 BSD 系统上。它使用了 LLVM 项目的基础。\n`https://lldb.llvm.org` (https://lldb.llvm.org)\n\
  `https://www.llvm.org` (https://www.llvm.org)\n\n截至本文，LLDB 支持的操作系统、语言和机器架构少于 GDB。然而，它是\
  \ macOS 的原生调试器，且其命令语言比 GDB 更规范。我们刻意没有提供关于 LLDB 操作系统、语言和支持支持，因为这些肯定随时间变化；请查看网站获取现状。\n\
  \n如果你的系统可用 LLDB 且你刚开始学习使用调试器，可能会尝试一下。\n\n如果你熟悉 GDB，GDB 到 LLDB 的命令映射可能对学习 LLDB 有帮助。\n\
  `https://lldb.llvm.org/use/map.html` (https://lldb.llvm.org/use/map.html)\n\n##\
  \ 17.4 为了调试而编程\n\n有很多使源代码更易于调试的技巧，从简单到复杂不等。在本节中我们将查看其中许多技术。\n\n### 17.4.1 编译时调试代码\n\
  \n某些技术涉及源代码本身。\n\n##### 17.4.1.1 使用调试宏\n\n可能最简单的编译时技术是使用预处理器提供条件编译的代码。例如：\n\n```\n\
  #ifdef DEBUG\n     fprintf(stderr, \"myvar = %d\\n\", myvar);\n     fflush(stderr);\n\
  #endif /* DEBUG */\n```\n\n在编译器命令行中添加 `-DDEBUG` 会导致在程序运行时执行对 `fprintf()` 的调用。\n\n\
  \n\n## **建议：** 将调试信息发送到 `stderr`，这样它们就不会在管道传输中丢失，并且可以通过 I/O 重定向进行捕获。务必使用 `fflush()`\
  \ 以确保消息能尽快强制输出到输出端。\n\n### 注意\n\n`DEBUG` 符号虽然显而易见，但也被严重过度使用了。更好的主意是使用针对你程序的特定符号，例如\
  \ `MYAPPDEBUG`。你甚至可以为程序不同部分的调试代码使用不同的符号，例如文件 I/O、数据验证、内存管理等。\n\n在代码中到处散布大量的 `#ifdef`\
  \ 语句会很快变得非常痛苦。过多的 `#ifdef` 会模糊主程序的逻辑。一定有更好的方法，事实上，有一种经常使用的技术是有条件地为打印操作定义特殊宏：\n\n\
  ```c\n/* 技巧 1 --- 常用但不推荐，详见正文 */\n/* 在应用程序头文件中： */\n#ifdef MYAPPDEBUG\n#define DPRINT0(msg)\
  \                fprintf(stderr, msg)\n#define DPRINT1(msg, v1)            fprintf(stderr,\
  \ msg, v1)\n#define DPRINT2(msg, v1, v2)        fprintf(stderr, msg, v1, v2)\n#define\
  \ DPRINT3(msg, v1, v2, v3)    fprintf(stderr, msg, v1, v2, v3)\n#else /* ! MYAPPDEBUG\
  \ */\n#define DPRINT0(msg)\n#define DPRINT1(msg, v1)\n#define DPRINT2(msg, v1, v2)\n\
  #define DPRINT3(msg, v1, v2, v3)\n#endif /* ! MYAPPDEBUG */\n\n/* 在应用程序源文件中： */\n\
  DPRINT1(\"myvar = %d\\n\", myvar);\n...\nDPRINT2(\"v1 = %d, v2 = %f\\n\", v1, v2);\n\
  ```\n\n这里有多个宏，每个对应不同数量的参数，直到你提供的任何限制。当 `MYAPPDEBUG` 被定义时，对 `DPRINT` x `()` 宏的调用将展开为对\
  \ `fprintf()` 的调用。当 `MYAPPDEBUG` 未定义时，这些调用将展开为空。（这本质上是 `assert()` 的工作原理；我们在 Section\
  \ 13.1，“断言语句：`assert()`](#ch13.xhtml_ch13lev1sec1)”第 419 页描述过 `assert()`。）\n\n这种技术是有效的；我们自己用过，并在教科书中也见过这种推荐。然而，它可以进一步优化，将宏的数量减少到一：\n\
  \n```c\n/* 技巧 2 --- 对新旧编译器兼容性最好 */\n/* 在应用程序头文件中： */\n#ifdef MYAPPDEBUG\n#define\
  \ DPRINT(stuff)   fprintf stuff\n#else\n#define DPRINT(stuff)\n#endif\n\n/* 在应用程序源文件中：\
  \ */\nDPRINT((stderr, \"myvar = %d\\n\", myvar)); // 注意双重括号\n```\n\n注意该宏是如何用两组括号来调用的！通过将\
  \ `fprintf()` 的整个参数列表变为单个参数，你就不需要任意数量的调试宏了。\n\n幸运的是，还有一种更简洁的方法，只要你的编译器至少符合 1999\
  \ C 标准：\n\n```c\n/* 技巧 3 --- 最简洁的方法 */\n/* 在应用程序头文件中： */\n#ifdef MYAPPDEBUG\n#define\
  \ DPRINT(mesg, ...)   fprintf(stderr, mesg, __VA_ARGS__)\n#else\n#define DPRINT(mesg,\
  \ ...)\n#endif\n/* 在应用程序源文件中： */\nDPRINT(\"myvar = %d\\n\", myvar);\n...\nDPRINT(\"\
  v1 = %d, v2 = %f\\n\", v1, v2);\n```\n\n1999 C 标准引入了*可变宏*（variadic macros）——即可以接受可数量参数的宏。（这类似于可变函数，如\
  \ `printf()`。）在宏定义中，三个点 `...` 表示将有 0 个或多个参数。在宏体中，特殊标识符 `__VA_ARGS__` 将被替换为所提供的参数，无论这些参数有多少个。\n\
  \n这种机制的优势是，在调用调试宏时只需要一组括号，使得代码读起来更加自然。它还保留了仅使用一个宏名称的能力，而不是根据参数数量变化的多个名称。\n\n**建议：**\
  \ 使用依赖可变宏的 C99 机制。它应该适用于任何现代 C 或 C++ 编译器。\n\n#### 17.4.1.2 尽可能避免表达式宏\n\n通常情况下，C\
  \ 预处理器宏是一把锋利的双刃剑。它们赋予了你巨大的力量，但也为你提供了伤害自己的很大机会。也就是说，预处理器是一个很有价值的工具，但应该谨慎使用。\n\n为了效率或代码清晰度，经常能看到如下的宏：\n\
  \n```c\n#define RS_is_null   (RS_node->var_value == Nnull_string)\n...\nif (RS_is_null\
  \ || today == TUESDAY) ...\n```\n\n从表面上看，这很好。`RS_is_null` 条件清晰且易于理解。然而，当你使用调试器时，你无法看到展开后的表达式。调试器只显示宏名称，这使得很难查看实际比较的值。\n\
  \n为了解决这个问题，你可以使用变量来存储表达式的结果：\n\n```c\nint is_null;\nis_null = (RS_node->var_value\
  \ == Nnull_string);\n...\nif (is_null || today == TUESDAY) ...\n```\n\n这样，你可以在调试器中检查\
  \ `is_null` 变量。然而，这会让代码变得混乱。更好的方法是使用 `enum`。\n\n**建议：** 使用 `enum` 代替宏来定义符号常量。源代码的使用方式相同，调试器也可以打印\
  \ `enum` 的值。\n\n示例源自 `gawk` 中的 `io.c`：\n\n```c\ntypedef enum scanstate {\n    NOSTATE\
  \ = 1,    /* 尚未开始 (all) */\n    INLEADER = 2,   /* 跳过领先数据 (RS = \"\") */\n    INDATA\
  \ = 3,     /* 在记录体中 (all) */\n    INTERM = 4,     /* 扫描终止符 (RS = \"\", RS = regexp)\
  \ */\n} SCANSTATE;\nSCANSTATE state;\n...\nstate = NOSTATE;\n...\nstate = INLEADER;\n\
  ...\nif (state != INTERM) ...\n```\n\n现在，当从 GDB 查看 `state` 时，我们看到了有用的信息：\n\n```bash\n\
  (gdb) print state\n$1 = NOSTATE\n```\n\n\n\n\n\n```c\ntypedef enum scanstate {\n\
  \    NOSTATE,    /* 尚未扫描（全部） */\n#define NOSTATE NOSTATE\n    INLEADER,   /* 跳过头部数据（RS\
  \ = \"\") */\n#define INLEADER INLEADER\n    INDATA,     /* 在记录正文中（全部） */\n#define\
  \ INDATA INDATA\n    INTERM,     /* 扫描终止符（RS = \"\", RS = regexp) */\n#define INTERM\
  \ INTERM\n} SCANSTATE;\n```\n\n这是怎么回事呢？请记住，在标准的 `C` 中，将一个宏名定义为它本身的值是有效的；宏不会递归展开。这使得条件编译的代码能够根据是否定义了某个值来决定是否包含在代码中，但该值在调试器中仍会正确地作为一个\
  \ `enum` 常量显示，而不是显示为一个数字。\n\n### 17.4.1.3 必要时重排代码\n\n在 `if` 或 `while` 语句中，包含多个由\
  \ `&&` 或 `||` 隔开的组件测试条件，这并不罕见。如果这些测试是函数调用（即使它们不是），则无法对条件的每个独立部分进行单步执行。`GDB` 的 `step`\
  \ 和 `next` 命令是基于 `statements`（语句）而非 `expressions`（表达式）工作的。（将这些内容跨行拆分也没有帮助。）\n\n\
  建议：** 重写原始代码，使用显式的临时变量来存储返回值或条件结果，以便你可以在调试器中检查它们。原始代码应该保留在注释中，以便你（或后来的程序员）了解发生了什么。\n\
  \n这里有一个具体的例子——来自 `gawk` 3.1.8 版本中 `io.c` 文件的 `do_input()` 函数：\n\n```c\n 1  /* do_input\
  \ --- 主输入处理循环 */\n 2\n 3  void\n4  do_input()\n5  {\n 6      IOBUF *iop;\n 7   \
  \   extern int exiting;\n 8      int rval1, rval2, rval3;\n 9\n10      (void) setjmp(filebuf);\
  \ /* 用于 'nextfile' */\n11\n12      while ((iop = nextfile(FALSE)) != NULL) {\n13\
  \          /*\n14           * 原本是：\n15          if (inrec(iop) == 0)\n16       \
  \       while (interpret(expression_value) && inrec(iop) == 0)\n17             \
  \     continue;\n18          * 现在为了方便调试，将其展开。\n19          */\n20         rval1\
  \ = inrec(iop);\n21         if (rval1 == 0) {\n22             for (;;) {\n23   \
  \              rval2 = rval3 = -1; /* 用于调试 */\n24                 rval2 = interpret(expression_value);\n\
  25                 if (rval2 != 0)\n26                     rval3 = inrec(iop);\n\
  27                 if (rval2 == 0 || rval3 != 0)\n28                     break;\n\
  29             }\n30         }\n31         if (exiting)\n32             break;\n\
  33      }\n34  }\n```\n\n（行号相对于例程的开头，而不是文件。）该函数是 `gawk` 主处理循环的核心。外部循环（第 12 行和 33\
  \ 行）遍历命令行数据文件。第 13–19 行的注释显示了原始代码，它从当前文件中读取每条记录并对其处理。\n\n从那以后，`gawk` 的内部实现已经重写；你不会在当前代码库中找到这个函数。\n\
  \n`inrec()` 返回 0 表示 OK 状态，而 `interpret()` 返回非零值也表示 OK 状态。当我们尝试单步执行此循环以验证记录读取过程时，有必要逐个执行每个步骤。\n\
  \n第 20–30 行是重后的代码，它们分别调用每个函数，并将返回值存储在局部变量中，以便从调试器中打印。注意第 23 行如何强制让这些变量在每次循环时都具有已知的无效值：否则，它们将保留上一次循环迭代中的值。第\
  \ 27 行是退出测试；由于代码已改为无限循环（比较第 22 行和第 16 行），跳出循环的测试与原始测试相反。\n\n顺便提一下，我们承认在进行重写时必须仔细研究重写过程，以确保它的行为与原始代码完全一致；事实确实如此。后来我们发现，这种版本的循环可能比原始版本更容易读：\n\
  \n```c\n/* 替换第 22-29 行 */\ndo {\n    rval2 = rval3 = -1; /* 用于调试 */\n    rval2 =\
  \ interpret(expression_value);\n    if (rval2 != 0)\n        rval3 = inrec(iop);\n\
  } while (rval2 == 0 && rval3 == 0);\n```\n\n事实是，这两个版本比原始版本更读，因此可能产生错误。然而，由于代码运行正常，我们决定保持现状。最后，我们注意到并不是所有专家程序员都会同意我们的建议。\n\
  \n### 17.4.1.4 调试助手\n\n一种适用于许多情况的技术是使用标志位（flags）。例如，`gawk` 的数据数据被称为 `NODE`。它有许多字段，最后一个是一组标志位。来自\
  \ `awk.h` 文件：\n\n```c\ntypedef struct exp_node {\n    ...                      \
  \       省略了内容\n    enum flagvals {\n    /* 类型 = Node_val */\n        MALLOC = 0x0001,\
  \         /* 分配内存 */\n        STRING = 0x0002,         /* 分配为字符串 */\n        STRCUR\
  \ = 0x0004,         /* 当前字符串值 */\n        NUMCUR = 0x0008,         /* 当前数值值 */\n\
  \        NUMBER = 0x0010,         /* 分配为数字 */\n        USER_INPUT = 0x0020,    \
  \ /* 用户输入：如果是\n        BOOLVAL = 0x0040,        /* 这是一个布尔值 */\n        INTLSTR =\
  \ 0x0080,        /* 使用本地化版本 */\n        NUMINT = 0x0100,         /* 数值是一个整数 */\n\
  \        INTIND = 0x0200,         /* 整数值为数组索引；\n                               \
  \   * 转换为字符串。\n                                  */\n        WSTRCUR = 0x0400, \
  \       /* 当前宽字符串值 */\n        MPFN = 0x0800,           /* 高精度浮点数 */\n        MPZN\
  \ = 0x0100,          /* 高精度整数 */\n        NO_EXT_SET = 0x02000, /* 扩展无法为该变量赋值 */\n\
  \        NULL_FIELD = 0x04000, /* 这是一个空字段\n\n     /* 类型 = Node_var_array */\n  \
  \       ARRAYMAXED  = 0x08000, /* 数组达到最大尺寸 */\n         HALFHAT     = 0x01000, /*\
  \ 半容量哈希数组树；\n                                  * 见 cint_array.c */\n         XARRAY\
  \      = 0x02000,\n         NUMCONSTSTR = 0x04000, /* 为数值常量提供字符串值 */\n         REGEX\
  \       = 0x080000, /* 这是一个类型正则表达式 */\n     } flags;\n } NODE;\n```\n\n使用标志位是因为它们可以大量节省空间。如果\
  \ `NODE` 结构为每个标志位使用单独的 `bool` 字段，将使用 20 字节，而不是 `enum` 使用的 4 字节。目前 `NODE` 的大小（在 64\
  \ 位 Intel 系统上）为 112 字节。增加 16 字节将将其增加到 128 字节。由于 `gawk` 可能分配数十万（甚至百万）个 `NODE`，减小尺寸是非常关重要的。\n\
  \n\n\n\n说真的！人们经常使用 `gawk` 处理数 GB 级的数据，并将中间值存储在内存中直到完成。记住，*没有任何任意限制！*\n\n这与调试有什么关系呢？尽管如我们之前展示的，GDB\
  \ 知道如何打印符号值的逻辑或（OR）组合，但在某些情况下，你可能需要在调试器之外也这样做——例如，在调试日志消息中，或者在一个你有 C 编译器但没有 GDB\
  \ 的系统上。\n\n**建议：** 提供一个将标记转换为字符串的函数。如果你有多个独立的标记，请设置一个通用的例程。\n\n### 注意\n\n这些调试函数不同寻之处在于，*应用程序代码从不调用它们*。它们存在*仅仅*是为了能够从调试器（或从调试日志消息）中被调用。此类函数应该始终被编译进去，甚至不需要包含\
  \ `#ifdef`，这样你就可以直接使用它们，而无需采取特殊步骤。（通常是很小的）额外代码体积增加对于开发者节省的时间来说是值得的。\n\n首先，我们将向你展示最初是如何做的。这里是来自一个已经古老的版本的\
  \ `gawk` (3.0.6) 中的 `flags2str()`（缩略版）：\n\n```\n 1  /* flags2str --- make a flags\
  \ value readable */\n 2\n 3  char *\n 4  flags2str(flagval)\n 5  int flagval;\n\
  \ 6  {\n 7      static char buffer[BUFSIZ];\n 8      char *sp;\n 9\n10      sp =\
  \ buffer;\n11\n12      if (flagval & MALLOC) {\n13          strcpy(sp, \"MALLOC\"\
  );\n14          sp += strlen(sp);\n15      }\n16      if (flagval & TEMP) {\n17\
  \          if (sp != buffer)\n18              *sp++ = '|';\n19          strcpy(sp,\
  \ \"TEMP\");\n20          sp += strlen(sp);\n21      }\n22      if (flagval & PERM)\
  \ {\n23          if (sp != buffer)\n24              *sp++ = '|';\n25          strcpy(sp,\
  \ \"PERM\");\n26          sp += strlen(sp);\n27      }\n        … much more of the\
  \ same, omitted for brevity …\n82\n83      return buffer;\n84  }\n```\n\n（行号相对于函数的起始位置。）结果是一个字符串，类似于\
  \ `\"MALLOC|PERM|NUMBER\"`。每个标记都是被单独测试的，如果存在，每个标记的操作都是相同的：测试是否不在缓冲区开头，以便我们可以添加“`|`”字符，将字符串复制到相应位置，并更新指针。程序中还存在类似的函数用于格式化和显示其他类型的标记。\n\
  \n这段代码既重复又容易出错，对于 `gawk` 3.1 来说，我们能够对其进行简化和泛化。以下是 `gawk` 现在的做法。从 `awk.h` 中的此定义开始：\n\
  \n```c\n/* for debugging purposes */\nstruct flagtab {\n    int val;           \
  \           Integer flag value\n    const char *name;             String name\n\
  };\n```\n\n该结构体可以表示任何一组标记及其对应的字符串值。每组不同的标记都有一个对应的函数，返回当前已设置标记的可打印表示形式。来自 `gawk`\
  \ 5.3.0 中的 `eval.c`：\n\n```c\n/* flags2str --- make a flags value readable */\n\n\
  const char *\nflags2str(int flagval)\n{\n    static const struct flagtab values[]\
  \ = {\n        { MALLOC, \"MALLOC\" },\n        { STRING, \"STRING\" },\n      \
  \  { STRCUR, \"STRCUR\" },\n        { NUMCUR, \"NUMCUR\" },\n        { NUMBER, \"\
  NUMBER\" },\n        { USER_INPUT, \"USER_INPUT\" },\n        { BOOLVAL, \"BOOL\"\
  \ },\n        { INTLSTR, \"INTLSTR\" },\n        { NUMINT, \"NUMINT\" },\n     \
  \   { INTIND, \"INTIND\" },\n        { WSTRCUR, \"WSTRCUR\" },\n        { MPFN,\
  \ \"MPFN\" },\n        { MPZN, \"MPZN\" },\n        { NO_EXT_SET, \"NO_EXT_SET\"\
  \ },\n        { NULL_FIELD, \"NULL_FIELD\" },\n        { ARRAYMAXED, \"ARRAYMAXED\"\
  \ },\n        { HALFHAT, \"HALFHAT\" },\n        { XARRAY, \"XARRAY\" },\n     \
  \   { NUMCONSTSTR, \"NUMCONSTSTR\" },\n        { REGEX, \"REGEX\" },\n        {\
  \ 0,  NULL },\n    };\n\n    return genflags2str(flagval, values);\n}\n```\n\n`flags2str()`\
  \ 定义了一个将标记值映射到字符串的数组。按照约定，标记值 `0` 表示数组的结束。该代码调用 `genflags2str()`（“通用标记转字符串”）来完成工作。`genflags2str()`\
  \ 是一个将标记值转换为字符串的通用例程。它是 `eval.c` 中紧随其后的函数：\n\n```c\n 1  /* genflags2str --- general\
  \ routine to convert a flag value to a string */\n 2\n 3  const char *\n 4  genflags2str(int\
  \ flagval, const struct flagtab *tab)\n 5  {\n 6      static char buffer[BUFSIZ];\n\
  \ 7      char *sp;\n 8\n9\n10      sp = buffer;\n11\n12      if (flagval & MALLOC)\
  \ {\n13          strcpy(sp, \"MALLOC\");\n14          sp += strlen(sp);\n15    \
  \  }\n16      if (flagval & TEMP) {\n17          if (sp != buffer)\n18         \
  \     *sp++ = '|';\n19          strcpy(sp, \"TEMP\");\n20          sp += strlen(sp);\n\
  21      }\n22      if (flagval & PERM) {\n23          if (sp != buffer)\n24    \
  \          *sp++ = '|';\n25          strcpy(sp, \"PERM\");\n26          sp += strlen(sp);\n\
  27      }\n```\n\n\n\n\n这里是一个简化的 GDB 会话，展示了 `flags2str()` 的用法：\n\n```\n$ gdb gawk\
  \                                                  在 gawk 上启动 GDB\nGNU gdb (Ubuntu\
  \ 12.1-0ubuntu1~22.04) 12.1\n...\nReading symbols from gawk...\n(gdb) break do_print\
  \                                        设置断点\nBreakpoint 1 at 0x426487: file builtin.c,\
  \ line 2310.\n(gdb) run 'BEGIN { print \"hello, world\" }'                  开始运行\n\
  Starting program: /tmp/gawk-5.3.0/gawk 'BEGIN { print \"hello, world\" }'\n[Thread\
  \ debugging using libthread_db enabled]\nUsing host libthread_db library \"/lib/x86_64-linux-gnu/libthread_db.so.1\"\
  .\n\nBreakpoint 1, do_print (nargs=1, redirtype=0) at builtin.c:2310   断点命中\n2310\
  \    {\n(gdb) n                                                     获取一个 NODE 值\n\
  2311        struct redirect *rp = NULL;\n...\n2346            tmp = args_array[i]\
  \ = POP();\n(gdb) print *tmp                                            打印 NODE\n\
  $1 = {sub = {nodep = {l = {lptr = 0x0, li = 0x0, ll = 0, lp = 0x0}, r = {\n    \
  \    rptr = 0x0, preg = {0x0, 0x0}, av = 0x0, bv = 0x0, uptr = 0x0,\n        iptr\
  \ = 0x0}, x = {extra = 0x0, aptr = 0x0, xl = 0, cmnt = 0x0},\n      name = 0x4e\
  \ <error: Cannot access memory at address 0x4e>,\n      reserved = 5154272, rn =\
  \ 0xc, cnt = 4294967295, reflags = 0}, val = {\n      nm = {fltnum = 0, mpnum =\
  \ {{_mpfr_prec = 0, _mpfr_sign = 0,\n            _mpfr_exp = 0, _mpfr_d = 0x0}},\
  \ mpi = {{_mp_alloc = 0,\n            _mp_size = 0, _mp_d = 0x0}}}, rndmode = 78,\n\
  \      sp = 0x4ea5e0 \"hello, world\", slen = 12, idx = -1, wsp = 0x0, wslen = 0,\n\
  \      typre = 0x0, comtype = 0}}, type = Node_val,\n  flags = (MALLOC | STRING\
  \ | STRCUR), valref = 2}\n(gdb) print flags2str(tmp->flags)                    \
  \      打印 flag 值\n$2 = 0x4d3180 <buffer> \"MALLOC|STRING|STRCUR\"\n```\n\n尽管对于这种特定情况，GDB\
  \ 帮我们完成了工作，但该技术对于 flag 值存储在 `int` 而不是 `enum` 的情况仍然具有价值。我们希望你同意，目前的通用机制比原始机制要优雅得多。**建议：**\
  \ 细心设计并使用 `struct` 数组（即：细心设计）通常可以取代重复代码。\n\n### 17.4.1.5 尽可能避免联合体 (Unions)\n\n没有免费的午餐。C\
  \ 语言中的 `union` 是一个相对冷门的机制。它允许通过在同一个物理空间内存储不同类型的项来节省内存；程序处理该空间的方式取决于如何访问它：\n\n```c\n\
  /* union.c --- 联合体的用法示例 */\n#include <stdio.h>\n#include <stdlib.h>\n\nint\nmain(void)\n\
  {\n    union {\n        int i;\n        double f;\n    } u;\n\n    u.i = 52;\n \
  \   printf(\"%d\\n\", u.i);\n\n    u.f = 52.5;\n    printf(\"%lf\\n\", u.f);\n\n\
  \    exit(EXIT_SUCCESS);\n}\n```\n\n\n\n\n\n```\n(gdb) print *tmp              \
  \                              Print NODE\n$1 = {sub = {nodep = {l = {lptr = 0x0,\
  \ li = 0x0, ll = 0, lp = 0x0}, r = {\n        rptr = 0x0, preg = {0x0, 0x0}, av\
  \ = 0x0, bv = 0x0, uptr = 0x0,\n        iptr = 0x0}, x = {extra = 0x0, aptr = 0x0,\
  \ xl = 0, cmnt = 0x0},\n      name = 0x4e <error: Cannot access memory at address\
  \ 0x4e>,\n      reserved = 5154272, rn = 0xc, cnt = 4294967295, reflags = 0}, val\
  \ = {\n      nm = {fltnum = 0, mpnum = {{_mpfr_prec = 0, _mpfr_sign = 0,\n     \
  \       _mpfr_exp = 0, _mpfr_d = 0x0}}, mpi = {{_mp_alloc = 0,\n            _mp_size\
  \ = 0, _mp_d = 0x0}}}, rndmode = 78,\n      sp = 0x4ea5e0 \"hello, world\", slen\
  \ = 12, idx = -1, wsp = 0x0, wslen = 0,\n      typre = 0x0, comtype = 0}}, type\
  \ = Node_val,\n  flags = (MALLOC | STRING | STRCUR), valref = 2}\n```\n\n信息非常混乱。不过，GDB\
  \ 确实让处理变得容易了一些。你可以使用诸如 `($1).sub.val.slen` 这样的表达式来遍历树并列出数据结构。\n\n避免使用 `union` 其他原因。首先，`union`\
  \ 是*未经检查的*。只有通过程序员的注意，才能确保当你访问 `union` 的某部分时，你访问的是上次存储的同一个。我们在 `ch-debugging-union.c`\
  \ 中看到了这一点，该代码同时访问了 `union` 的两个“标识”。\n\n第二个原因与第一个原因相关，即要小心复杂的嵌套 `struct`/`union`\
  \ 组合中的*重叠（overlays）*。例如，早期版本的 `gawk` 拥有以下代码：^(21)\n\n^(21) 这部分代码后来经过了修订，示例行已不再存在。\n\
  \n```\n/* n->lnode 覆盖了数组大小，如果是数组则不要 unref 它 */\nif (n->type != Node_var_array &&\
  \ n->type != Node_array_ref)\n    unref(n->lnode);\n```\n\n最初，并没有 `if`，只有一个对 `unref()`\
  \ 的调用，它释放由 `n->lnode` 指向的 `NODE`。然而，在这一点可能会导致 `gawk` 崩溃。你可以想象在调试器中花费了多久时间才追踪到被被视为指针的内容实际上是一个数组大小这一事实！\n\
  \n`union` 的结构也可能以不同的方式让你吃亏。当为 32 位架构编译时，成员的大小和内存布局可能与为 64 位架构编译时不同。（即使相同位宽的不同架构之间也存在差异！）这也会导致问题；在\
  \ `gawk` 5.3.2 的预发布测试期间，一个 仅在为 32 位编译时才会出现。\n\n顺带提一下，`union` 在 C++ 中的用处要小得多。继承和面向对象的特征使得数据结构管理变成了一种不同的游戏，一种要安全得多的。\n\
  \n**建议：** 在使用 `union` 之前请*非常*仔细地考虑。探索设计的替代方案，并确保你使用它们是有理由的。如果你确定，请仔细地设计和编写它们！\n\n\
  **建议：** 在发布程序*之前*，针对不同的架构和架构大小编译并测试你的程序。\n\n### 17.4.2 运行时调试代码\n\n除了在编译时添加到代码中的内容外，你还可以添加额外的代码来启用运行时调试功能。这对于安装在现场中的应用程序特别有用，因为客户系统可能没有安装源代码（可能甚至没有编译器！）。\n\
  \n本节介绍了我们多年来使用的一些运行时调试技术，从简单到复杂不等。请注意，我们的处理绝非详尽。在这个领域，拥有一些想象力并加以运用它是值得的！\n\n####\
  \ 17.4.2.1 添加调试选项和变量\n\n最简单的技术是设置一个启用调试的命令行选项。此类选项可以在调试时通过条件编译引入。但将该选项保留在程序的*生产*版本中会更灵活。（你可能想也可能不想将该选项也*不记录在文档中*。这有权衡：记录它可以让你你的客户或客户端了解更多关于你系统的内部构造，这你可能并不希望这样做。另一方面，不记录它似乎相当狡猾。如果你正在编写开源或自由软件，最好记录该选项。）\n\
  \n如果你的程序很大，你可能希望你的调试选项能接受一个参数。\n\n```\nstruct option options[] = {\n    ...\n  \
  \  { \"debug\", required_argument, NULL, 'D' },\n    ...\n}\n\nint main(int argc,\
  \ char **argv)\n{\n    ...\n    int c;\n\n    while ((c = getopt_long(argc, argv,\
  \ \"...\", options)) != -1) {\n        switch (c) {\n        ...\n        case 'D':\n\
  \            parse_debug(optarg);\n            break;\n        ...\n        }\n\
  \    }\n    ...\n}\n```\n\n```\nextern debug_values debugging;\n\nvoid parse_debug(const\
  \ char *subsystems)\n{\n    char *sp;\n    for (sp = subsystems; *sp != '\\0';)\
  \ {\n        if (strncmp(sp, \"file\", 4) == 0) {\n            debugging |= DEBUG_FILE;\n\
  \            sp += 4;\n        } else if (strncmp(sp, \"memory\", 6) == 0) {\n \
  \           debugging |= DEBUG_MEM;\n            sp += 6;\n        } else if (strncmp(sp,\
  \ \"ipc\", 3) == 0) {\n            debugging |= DEBUG_IPC;\n            sp += 3;\n\
  \        }\n        ...\n        while (*sp == ' ' || *sp == ',')\n            sp++;\n\
  \    }\n}\n```\n\n最后，应用程序代码可以测试标志：\n\n```\nif ((debugging & DEBUG_FILE) != 0) ...\
  \          在程序的 I/O 部分\n\nif ((debugging & DEBUG_MEM) != 0) ...           在内存管理器中\n\
  \n```\n\n由你决定使用带标志位的单个变量、独立变量，还是一个由符号常量（最好来自 `enum`）索引的 `debugging` 数组。\n\n将调试代码留在生产可执行文件中的代价是程序会变得更大。根据调试代码的位置，它可能还会变慢，因为测试总是执行的但在调试开启之前一直是虚假的。而且正如提到的，可能会有人弄清楚你程序内部是如何工作的，这你可能并不希望。更糟糕，恶意用户可能会开启大量的调试，导致程序慢到不可用的状态！（这被称为*拒绝服务攻击*。）\n\
  \n好处（可能是巨大的）是，已经安装的程序可以在开启调试的情况下重新调用，而无需你构建特殊版本并下载到客户现场。当软件安装在可能没有人的地方，且你*只能*通过互联网远程访问系统时，这种功能可能是救命稻草。\n\
  \n#### 17.4.2.2 使用特殊的环境变量\n\n另一个实用的技巧是让你的应用程序关注特殊的环境变量（无论是否记录）。这对于测试特别有用。我们将分享另一个来自我们\
  \ `gawk` 经验的例子，但首先是一些背景。\n\n\n\n\n\n`gawk` 使用一个名为 `optimal_bufsize()` 的函数来获取 I/O\
  \ 的最佳缓冲区大小。对于小文件，该函数返回文件大小。否则，如果文件系统定义了用于 I/O 的大小，它将返回该值（`struct stat` 中的 `st_blksize`\
  \ 成员；参见第 5.4.2 节],第 131 页）。如果该成员不可，`optimal_bufsize()` 返回 `<stdio.h>` 中的 `BUFSIZ`\
  \ 常量。原始函数（位于 `gawk` 3.0.0 中的 `posix/gawkmisc.c`）如下：\n\n```\n 1  /* optimal_bufsize\
  \ --- determine optimal buffer size */\n 2\n 3  int\n 4  optimal_bufsize(fd, stb)\
  \        int optimal_bufsize(int fd, struct stat *stb);\n 5  int fd;\n 6  struct\
  \ stat *stb;\n 7  {\n 8      /* force all members to zero in case OS doesn't use\
  \ all of them. */\n 9      memset(stb, '\\0', sizeof(struct stat));\n10\n11    \
  \  /*\n12       * System V.n, n < 4, doesn't have the file system block size in\
  \ the\n13       * stat structure. So we have to make some sort of reasonable\n14\
  \       * guess. We use stdio's BUFSIZ, since that is what it was\n15       * meant\
  \ for in the first place.\n16       */\n17  #ifdef HAVE_ST_BLKSIZE\n18  #define\
  \ DEFBLKSIZE (stb->st_blksize ? stb->st_blksize : BUFSIZ)\n19  #else\n20  #define\
  \ DEFBLKSIZE BUFSIZ\n21  #endif\n22\n23      if (isatty(fd))\n24          return\
  \ BUFSIZ;\n25      if (fstat(fd, stb) == -1)\n26          fatal(\"can't stat fd\
  \ %d (%s)\", fd, strerror(errno));\n27      if (lseek(fd, (off_t)0, 0) == -1)  \
  \ /* not a regular file */\n28          return DEFBLKSIZE;\n29      if (stb->st_size\
  \ > 0 && stb->st_size < DEFBLKSIZE) /* small file */\n30          return stb->st_size;\n\
  31      return DEFBLKSIZE;\n32  }\n```\n\n常量 `DEFBLKSIZE` 是“默认块大小”——即来自 `struct\
  \ stat` 的值或 `BUFSIZ`。对于终端（第 23 行）或非普通文件（`lseek()` 失败，第 27 行），返回值也是 `BUFSIZ`。对于较小的普通文件，使用文件大小。在所有其他情况下，都返回\
  \ `DEFBLKSIZE`。知道“最佳”缓冲区大小对于块大小大于 `BUFSIZ` 的文件系统特别有用。\n\n我们曾遇到过一个问题，其中一个测试用例在我们的开发\
  \ GNU/Linux 系统以及我们所能的所有其他 Unix 系统上运行得完美，但在某些其他系统上会持续失败。\n\n很长一段时间，我们无法直接访问失败的系统来运行\
  \ `GDB`。然而，最后我们成功重现了问题；事实证明与 `gawk` 用于读取数据文件时的缓冲区大小有关：在失败的系统中，缓冲区大小比我们的开发系统大。\n\n\
  我们希望有一种方法能够在开发机器上重现该问题：失败的系统在九个时区之外，跨大西洋交互式运行 `GDB` 是痛苦的。我们通过让 `optimal_bufsize()`\
  \ 查看一个特殊的环境变量 `AWKBUFSIZE` 重现了该问题。当值为 `\"exact\"` 时，`optimal_bufsize()` 始终返回文件大小，无论大小是多少。如果\
  \ `AWKBUFSIZE` 的值为某个整数，函数返回该数字。否则，函数将退回到之前的算法。这允许我们能够在无需不断重新编译的情况下运行测试。例如：\n\n```\n\
  $ AWKBUFSIZE=42\n```\n\n运行 `gawk` 时使用 42 字节的缓冲区大小。（测试套件通过。）这里是修改后的 `optimal_bufsize()`\
  \ 版本（来自 `gawk` 5.3.0）：\n\n```\n 1  /* optimal_bufsize --- determine optimal buffer\
  \ size */\n 2\n 3  int\n 4  optimal_bufsize(fd, stb)        int optimal_bufsize(int\
  \ fd, struct stat *stb);\n 5  int fd;\n 6  struct stat *stb;\n 7  {\n 8      /*\
  \ force all members to zero in case OS doesn't use all of them. */\n 9      memset(stb,\
  \ '\\0', sizeof(struct stat));\n10\n11      /*\n12       * System V.n, n < 4, doesn't\
  \ have the file system block size in the\n13       * stat structure. So we have\
  \ to make some sort of reasonable\n14       * guess. We use stdio's BUFSIZ, since\
  \ that is what it was\n15       * meant for in the first place.\n16       */\n17\
  \  #ifdef HAVE_ST_BLKSIZE\n18  #define DEFBLKSIZE (stb->st_blksize ? stb->st_blksize\
  \ : BUFSIZ)\n19  #else\n20  #define DEFBLKSIZE BUFSIZ\n21  #endif\n22\n23      if\
  \ (isatty(fd))\n24          return BUFSIZ;\n25      if (fstat(fd, stb) == -1)\n\
  26          fatal(\"can't stat fd %d (%s)\", fd, strerror(errno));\n27      if (lseek(fd,\
  \ (off_t)0, 0) == -1)   /* not a regular file */\n28          return DEFBLKSIZE;\n\
  29      if (stb->st_size > 0 && stb->st_size < DEFBLKSIZE) /* small file */\n30\
  \          return stb->st_size;\n31      return DEFBLKSIZE;\n32  }\n```\n\n第 3-23\
  \ 行的注释解释了该算法。由于查找环境变量开销很大且只需要执行一次，函数使用 `static` 变量在第一次执行时收集相关信息。第 41-52 行在第一次执行，且仅执行一次。第\
  \ 41 行通过将 `first` 设置为假来强制执行这一点。第 43-52 行处理环境变量，查找 `\"exact\"` 或数字。在数字的情况下，它将字符串转换为十进制，保存在\
  \ `env_val` 中。（我们本应该在这里使用 `strtol()`；当时没有考虑到。）第 53 行每次都执行。如果给出了数值，条件将为真并返回该值（第 54\
  \ 行）。否则，跳转到函数的其余部分。第 64-68 行定义了 `DEFBLKSIZE`；这部分没有变化。最后，第 70-74 行在合适时返回文件大小。如果不是（第\
  \ 76 行），返回 `DEFBLKSIZE`。\n\n我们确实修复了问题，^(23)，在此期间我们保留了新的 `optimal_bufsize()` 以确保问题没有再次发生。\n\
  \n通过重写缓冲区管理代码！代码大小和复杂性的微增被我们现在拥有的测试灵活性所抵消了。此外，由于这是生产代码，很容易让现场用户使用此功能进行测试，以确定是否发生了类似的问题。（到目前为止，我们还没有要求进行测试，但知道如果需要的话我们可以处理这真是件好事。）\n\
  \n\n\n\n\n### 17.4.2.3 添加日志代码\n\n通常情况下，你的应用程序可能运行在一个你无法使用调试器的系统上（例如在客户现场）。在这种情况下，你的目标是能够从外部检查程序的内部状态。实现这一点的唯一方法是让程序本身为你生成这些信息。\n\
  \n有多种方法可以实现这一目标：\n\n*   始终将信息记录到特定的文件中。这是最简单的方法：程序始终写入日志信息。然后你可以在方便的时候查看该文件。\n\n\
  \    它的缺点是，在某个时刻，日志文件将耗尽所有可用磁盘空间。因此，你应该准备多个日志文件，并让程序定期切换到新文件。\n\n    布莱恩·柯尼汉（Brian\
  \ Kernighan）建议按周几命名日志文件：`myapp.log.sun`、`myapp.log.mon` 等。这样做的好处是，你不需要手动将旧文件移走；你可以免费获得整一周的日志文件。缺点是文件名无法按数字进行排序。\n\
  \n*   仅在日志文件已存在时才写入日志文件。当你的程序启动时，如果日志文件存在，它就会将信息写入日志；否则，不写入。要启用日志，请先创建一个空的日志文件。\n\
  \n*   对消息使用固定格式，这种格式可以被 `awk`、Perl 或 Python 等脚本语言轻松解析，以便生成摘要和报告。\n\n*   或者，生成某种形式的\
  \ XML，它是自描述的，并且可能转换为其他格式。（我们并不非常喜欢 XML，但你不应该让这限制你。）如今，JSON 是 XML 的流行替代方案。\n\n* \
  \  使用 `syslog()` 进行记录；日志消息的最终处理由系统管理员控制。（`syslog()` 是一个相当高级的接口；参见 `syslog` (3) 手页。）\n\
  \n记录信息的方法很容易，困难的部分是选择记录*什么*正如程序开发的所有部分一样，*在编码之前先思考*是有益的。记录关键变量的信息。检查它们的值以确保它们在范围内或或其他符合你的预期。记录异常情况；如果发生了不该发生的事情，记录它，并在可能的情况下继续运行。此外，如果你有\
  \ `errno` 值或等效信息，请记录它！换句话说，记录*什么*出了问题，而不仅仅是“发生了一些坏事”。\n\n关键在于只记录追踪问题所需的信息，不多不少。\n\
  \n### 17.4.2.4 运行时调试文件\n\n在以前，我们为一家初创公司工作，该产品的二进制执行文件安装在客户现场。无法对正在运行的程序副本挂载调试器，也无法在客户系统上从调试器运行它。产品的主要组件不是直接从命令行启动的，而是通过执行了大量初始设置的\
  \ shell 脚本间接启动的。\n\n为了让程序开始生成日志信息，我们想出了特殊调试文件的想法。当某个目录存在存在特定名称的文件时，程序会将信息性消息写入日志文件，然后我们可以下载并分析该文件。这样的代码看起来如下：\n\
  \n```c\nstruct stat sbuf;\nextern bool do_logging;      /* 初始化为 false */\n\nif (stat(\"\
  /path/to/magic/.file\", &sbuf) == 0)\n    do_logging = true;\n...\nif (do_logging)\
  \ {\n    在此处编写日志代码：打开文件，写入信息，关闭文件等。\n}\n```\n\n`stat()` 的调用在程序处理每个任务时都会发生。因此，我们可以动态地启用和禁用日志，而无需停止并重启应用程序！\n\
  \n与调试选项和变量一样，这个主题有许多变体：不同的文件用于启用不同子系统的信息记录、添加到调试文件本身中的调试指令等。与所有功能一样，你应该为你将需要的内容设计一个方案，然后整洁地实现它，而不是在凌晨\
  \ 3 点随手写出一些快速而粗劣的代码（遗憾的是，这在初创公司并不罕见）。\n\n**注意**\n\n闪闪发光的并不一定都是黄金。特殊调试文件只是被称为*后门*（back\
  \ doors）的技术示例之一——开发者通过一种或多种方式对程序进行未记录的操作，有时是出于不法之目的。在我们的案例中，这个后门是完全无害的。但毫无道德的开发者可以同样容易安排生成并下载客户列表、人员文件或其他敏感数据的隐藏副本。仅凭这一点，你就应该额外仔细考虑这种技术是否在你的应用程序中可用，甚至在你的司法管辖区内是否合法！\n\
  \n### 17.4.2.5 为断点添加特殊钩子\n\n通常，一个问题可能是复现的，但只有在你的程序处理了数兆字节的输入数据后才能出现。或者你可能知道程序在哪个函数中失败了，但失败只发生在该函数被调用数百次甚至数千次之后。\n\
  \n当你使用调试器工作时，这是一个大问题。如果你在失败的例程中设置断点，你必须输入 `continue` 命令并按回车几百或几千次，才能让程序进入即将失败的状态。至少，这样做是枯燥且容易出错的！它可能变得如此困难，以至于你在还没开始之前就想放弃。\n\
  \n一种解决方案是添加特殊的调试“钩子”（hook）函数，程序在接近你感兴趣的状态时可以调用这些函数。\n\n例如，假设你知道 `check_salary()`\
  \ 函数是失败的地方，但只有在它被调用 1427 次后才会失败。（我们没在开玩笑；我们确实见过一些奇怪的情况。）\n\n为了在 `check_salary()`\
  \ 失败之前捕获它，创建一个只返回的特殊空函数，然后安排 `check_salary()` 在第 1427 次调用它：\n\n```c\n/* debug_dummy\
  \ --- 调试钩子函数 */\n\nvoid debug_dummy(void) { return; }\nstruct salary *check_salary(void)\n\
  {\n    …真实的变量声明 …\n    static int count = 0;     /* 用于调试 */\n\n    if (++count ==\
  \ 1426)\n        debug_dummy();\n\n    … 这里的其余部分代码 …\n}\n```\n\n现在，在 GDB 内部为 `debug_dummy()`\
  \ 设置断点，然后正常运行程序：\n\n```bash\n(gdb) break debug_dummy                           \
  \ 为空函数设置断点\nBreakpoint 1 at 0x8055885: file whizprog.c, line 3137.\n(gdb) run  \
  \                                        启动程序\nStarting program: /home/arnold/whizprog\n\
  \nBreakpoint 1, debug_dummy () at whizprog.c, line 3137\n3137 void debug_dummy(void)\
  \ { return; }            断点已到达\n(gdb) break check_salary                       \
  \    为感兴趣函数设置断点\nBreakpoint 2 at 0x8057913: file whizprog.c, line 3140.\n(gdb) cont\n\
  ```\n\n当到达第二个断点时，程序即将失败，你可以单步执行，进行任何必要的以追踪问题的操作。\n\n与其使用固定常量（``++count == 1426``），你可能希望拥有一个全局变量，由调试器将其设置为任何你需要的值。这避免了重新编译程序的需要。\n\
  \n\n\n\n\n对于 `gawk`，我们更进了一步，将调试钩（debugging hook）机制引入了语言内部，使得钩函数可以从 `awk` 程序中调用。当以调试模式进行编译时，可以使用一个名为\
  \ `stopme()` 的特殊无操作函数。该函数反过来会调用一个同名的 C 函数。这允许我们在问题发生正之前，在出错的 `awk` 程序中插入对 `stopme()`\
  \ 的调用。例如，如果 `gawk` 在处理第 1,200 条输入记录时为 `awk` 程序产生了错误结果，我们可以在 `awk` 程序中添加如下的一行：\n\n\
  ```\nNR == 1198 { stopme() }    # 当记录数 (Number of Records) == 1198 时停止以调试\n\n… awk\
  \ 程序的其余保持不变 …\n```\n\n然后，在 GDB 内部，我们可以对 C 函数 `stopme()` 设置断点并运行 `awk` 程序。一旦该断点触发，我们就可以在\
  \ `gawk` 中怀疑实际问题所在的其他部分设置断点。\n\n钩函数技术本身是非常有用的。然而，将其引入应用层的能力极大地增加了它的实用性，并在追踪晦涩问题时为我们节省了无法计数的调试时间。\n\
  \n## 17.5 调试工具 I：现代 `lint`\n\n除了 GDB 以及你用于通用调试的任何源码钩子外，还有几个非常有用的程序包可以帮助发现不同类型的问题。在本节中，我们将介绍一种静态程序分析器，在下一节中我们将讨论内存管理调试工具。\n\
  \n在原始 C 中，编译器无法检查传递给调调参数是否与函数定义中的参数列表匹配；因为当时没有函数原型（prototypes）。这经常导致微妙的 bug，因为糟糕的函数调用可能只产生轻微的错误结果，这些结果在测试期间未被察觉，或者在测试期间根本没有被调用。例如：\n\
  \n```c\nif (argc < 2)\n    fprintf(\"usage: %s [ options ] files\\n\", argv[0]);\
  \      缺少了 stderr\n```\n\n如果一个包含此片段的程序从未没有以错误的参数数量被调用，那么缺少初始 `FILE *` 参数的 `fprintf()`\
  \ 就不会被调用。\n\nV7 的 `lint` 程序是为了解决此类问题设计的。它对程序中的所有文件进行两次扫描：首先收集函数参数的信息，然后将函数调用与收集的信息进行比较。特殊的“`lint\
  \ library`”文件提供了标准库函数的信息，以便它们也能被检查。`lint` 还会检查其他可疑的结构。\n\n在标准 C 中有了函数原型后，对 `lint`\
  \ 的需求减少了但并未消除，因为 C90、C99 和 C11 仍然允许旧式的函数声明：\n\n```c\nextern int some_func();   \
  \       参数列表未知\n```\n\n此外，程序的许多其他方面也可以进行静态检查——即通过对源代码文本进行分析。\n\n安全编程 Lint (`splint`)\
  \ 是一种现代的 `lint` 替代品。它提供了许多在此无法列出的选项和功能，但非常值得研究。\n\n`http://www.splint.org`\n\n有一需要注意的是，类似\
  \ `lint` 的程序可能会产生如洪水般的警告信息。报告的警告中许多实际上是无害的。在这种情况下，工具允许你提供特殊的注释来表示“是的，我知道这个，这不是问题”。当你在代码中提供大量此类注释时，`splint`\
  \ 的效果最好。\n\n`splint` 是一个强大但复杂的工具；花一些时间学习如何使用它并频繁使用，将帮助你保持代码整洁。\n\n**建议：** 使用编译器警告和一个或多个静态分析工具来帮助发现源代码中的问题。\n\
  \n## 17.6 调试工具 II：内存分配调试器\n\n忽略如程序设计不佳等问题，对于任何大规模的实际应用，C 程序员单一最大的挑战都是动态内存管理（通过 `malloc()`、`realloc()`\
  \ 和 `free()`）。\n\n这一事实通过大量可用于调试动态内存的工具得到了证实。这些工具提供的功能有相当的重叠。例如：\n\n*   内存泄漏检测：被分配后变得不可访问的内存。\n\
  *   未释放内存检测：分配了但从未释放的内存。未释放的内存并不总是 bug，但检测此类情况可以允许你验证它们确实是正常的。\n*   无效释放检测：内存被释放了两次或者传递给\
  \ `free()` 的指针并非来自 `malloc()`。\n*   使用已释放内存检测：通过悬挂指针使用已释放的内存。\n*   内存越界检测：访问或存储到分配范围之外的内存。\n\
  *   关于使用未初始化内存的警告。（许多编译器可以对此发出警告。）\n*   动态函数追踪：当发生错误的内存访问时，你会获得一个从内存使用处到内存分配处的回溯轨迹（traceback）。\n\
  \n某些工具仅仅记录这些事件。另一些工具则安排应用程序以一种惨的方式死亡（通过 `SIGSEGV`），以便可以从调试器内部精确定位代码。\n\n虽然过去开发了许多\
  \ `malloc()` 调试工具且现在仍然可用，但两个几乎提供了上述列表中所有功能的工具已在很大程度上取代了它们：Valgrind 和 Address Sanitizer。我们接下来介绍它们。\n\
  \n### 17.6.1 Valgrind：一个多能工具\n\n遵循 GPL 许可的 Valgrind 程序可以捕获各种问题，包括来自动态内存的问题。Valgrind\
  \ 手册对程序的描述比我们写的好甚至更好，因此我们将在过程中引用（并缩写）：\n\nValgrind 是一个用于构建动态分析工具的框架。它带了一组工具，每个工具都执行某种调试、分析或类似的任务。Valgrind\
  \ 的架构是模块化的，因此可以创建新工具而不会干扰现有结构。\n\n提供了一些实用的工具：\n\n1.  `memcheck` 是内存错误检测器。它可以检测 C\
  \ 和 C++ 程序中常见的以下问题：帮助你的程序更正确。\n2.  `cachegrind` 是缓存和分支预测分析器。它可以帮助你的程序运行得更快。\n3.\
  \  `callgrind` 是一个生成调用图的缓存分析器。它与 Cachegrind 有一些重叠，但也收集了一些 Cachegrind 不具备的信息。\n4.\
  \  `helgrind` 是线程错误检测器。它可以帮助你的多线程程序更正确。\n5.  `drd` 也是一个线程错误检测器。它与 Helgrind 类似，但使用不同的分析技术，因此可能会发现不同的问题。\n\
  6.  `massif` 是堆分析器。它可以帮助你的程序减少内存占用。\n7.  `dhat` 是一种不同的堆分析器。它可以帮助理解块生命周期、块利用率和布局低效的问题。\n\
  8.  `bbv` 是一个实验性的 SimPoint 基本块向量生成器。它对计算机体系研究和开发人员有用。\n\n在日常使用中，最有用的工具是 `memcheck`：\n\
  \nMemcheck 是一个内存错误检测器。它可以检测 C 和 C++ 程序中常见的以下问题：\n\n*   访问你不应访问的内存，例如越界和破坏堆块、越界栈顶以及访问已释放的内存。\n\
  *   使用未定义的值，即未初始化的值或从其他未定义值派出的值。\n*   错误的释放堆内存，例如双释放堆块，或 `malloc`/`new`/`new[]`\
  \ 与 `free`/`delete`/`delete[]` 的使用不匹配。\n*   如果释放值与分配值不匹配，对于大小感知对齐的分配和释放函数也会报告不匹配。\n\
  \n\n\n\n\n*   在 `memcpy` 及相关函数中 `src` 和 `dst` 指针重叠。\n*   向内存分配函数的尺寸参数传递了一个可疑的（推测为负的）值。\n\
  *   在 `realloc` 中使用大小为 0 的值。\n*   使用非 2 的幂作为对齐值。\n*   内存泄漏。\n\n这些问题通过其他手段很难发现，通常在长时间内未被检测到，导致偶尔发生且难以诊断的崩溃。\n\
  \n最后，手册中提到：\n\nValgrind 与 CPU 和操作系统的细节紧密相关，在较小程度上，还与编译器和基础 C 库有关。尽管如此，它支持许多广泛使用的平台，完整列表可以在\
  \ [`http://www.valgrind.org/`](http://www.valgrind.org/) 中查到。\n\nValgrind 是通过标准的\
  \ Unix `./configure`、`make`、`make install` 过程构建的；详细信息请见发行版中的 `README` 文件。\n\n如果你运行的是\
  \ GNU/Linux 系统，你的包管理器应该能够为你安装 Valgrind；你不需要从源码编译它。\n\n当我们编写这本书的第一第一版时，Valgrind 仅适用于运行\
  \ GNU/Linux 的 32 位 Intel 系统。在过去的 20 多年里，它被移植到了许多不同的 CPU 架构和操作系统。截至本文写作，Valgrind\
  \ 运行在以下系统中：\n\n| AMD64/Darwin | ARM64/Android | PPC32/Linux | X86/FreeBSD |\n| :---\
  \ | :--- | :--- | :--- |\n| AMD64/FreeBSD | ARM64/FreeBSD | PPC64/Linux | X86/Linux\
  \ |\n| AMD64/Linux | ARM64/Linux | PPC64LE/Linux | X86/Solaris |\n| AMD64/Solaris\
  \ | MIPS32/Android | S390X/Linux | |\n| ARM/Android | MIPS32/Linux | X86/Android\
  \ | |\n| ARM/Linux | MIPS64/Linux | X86/Darwin | |\n\n尽管 Valgrind 手册可能会让你认为存在名为\
  \ `memcheck`、`cachegrind` 等独立命令，但事实并非如此。相反，一个名为 `valgrind` 的驱动外壳程序运行调试核心，并根据 `--tool=`\
  \ 选项指定相应的工具。默认工具是 `memcheck`；因此，运行纯 `valgrind` 等同于运行 `valgrind --tool=memcheck`。（这提供了与仅进行内存检查的早期版本\
  \ Valgrind 的兼容，而且这样做最有意义，因为 `memcheck` 工具提供了最多的信息。）\n\nValgrind 提供了许多选项。我们建议参阅其文档获取完整细节。选项分为几组；在适用于核心（即适用于所有工具）的选项中，以下可能是最有用的：\n\
  \n*   `--help`\n    列出所有选项。\n*   `--logfile=`file`\n    将日志消息记录到 `file`.pid。你可以在文件名中包含特殊的转义序列，以自定义实际使用的文件名。参见\
  \ `valgrind`(1) 手页。\n*   `--num-callers=`number`\n    在堆栈跟踪中显示 `number` 个调用者。默认值为四个。\n\
  *   `--tool=`tool`\n    使用名为 `tool` 的工具。默认是 `memcheck`。\n*   `--trace-children=no|yes`\n\
  \    同时在子进程上运行跟踪。默认是 `no`。有许多与跟踪子进程相关的选项；参见手页。\n*   `-v, --verbose`\n    更详细的信息。这包括列出加载的库以及各种错误的计数。\n\
  *   `--vgdb=no|yes|full`\n    当 `--vgdb=yes` 或 `--vgdb=full` 时，表现得 adbserver。这允许\
  \ GDB 连接到运行中的进程进行交互式调试。还有一些配合 gdb 使用的额外选项。\n\n对于 `memcheck` 工具的选项，这些是我们认为最有用的：\n\
  \n*   `--keep-stacktraces=alloc|free|alloc-and-free|alloc-then-free|none`\n    控制为动态分配或释放的块保留哪些堆栈跟踪，具体如下：\n\
  \    *   `--keep-stacktraces=alloc-then-free`\n        在分配内存时记录一个堆栈跟踪，在释放时记录另一个；并用第二个替换第一个。因此，“释放后使用”错误仅显示内存被释放的位置。\n\
  \    *   `--keep-stacktraces=alloc-and-free`\n        记录并保留该块的分配和释放跟踪。因此，“释放后使用”错误会显示两者，这可能使错误更容易诊断。\n\
  \    *   `--keep-stacktraces=alloc`\n        仅保留并报告分配跟踪。\n    *   `--keep-stacktraces=free`\n\
  \        仅保留并报告释放跟踪。\n    *   `--keep-stacktraces=none`\n        不记录任何分配或释放的堆栈跟踪。这可以减少\
  \ CPU 和内存消耗，但你将失去 Valgrind 最核心的特性。默认值是 `alloc-and-free`。\n*   `--leak-check=no|summary|full`\n\
  \    在程序结束后查找内存泄漏。默认是 `no`。\n*   `--show-reachable=no|yes`\n    在程序结束时显示可达的块。如果使用\
  \ `--show-reachable=yes`，Valgrind 会查找指向动态分配内存的指针。此类内存不是泄漏，但无论如何知道可能有用。默认是 `no`。\n\
  *   `--track-origins=<yes|no>`\n    Valgrind 会报告条件（如 `if` 和 `while`）中对未初始化内存的使用。使用此选项，它可以跟踪未初始化内存的来源并报告它，这非常有帮助。注意，此选项在\
  \ CPU 时间和内存需求上可能是昂销的。默认是 `no`。\n\n让我们来看看 Valgrind 的运行情况。我们从程序 `ch-debugging-badmem1.c`\
  \ 开始，该程序滥用了动态内存：\n\n```c\n/* ch-debugging-badmem1.c do bad things with memory */\n\
  #include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\n\nint main(int argc,\
  \ char **argv)\n{\n    char *p;\n    int i;\n\n    p = malloc(30);\n\n    strcpy(p,\
  \ \"not 30 bytes\");\n    printf(\"p = %s\\n\", p);\n\n    if (argc == 2) {\n  \
  \      if (strcmp(argv[1], \"-b\") == 0)\n            free(p);    /* free memory\
  \ */\n        else\n            p[0] = 'a'; /* touch outside the bounds */\n   \
  \ }\n\n    return EXIT_SUCCESS;\n}\n```\n\n`-b` 选项写入了分配区域之外的内存。（我们在 `-f` 选项中可以看到。）以下是\
  \ Valgrind 的报告：\n\n```\n$ valgrind ch-debugging-badmem1 -b\n==40682== Memcheck,\
  \ a memory detector\n==40682== Copyright (C) 2002-2017, and GNU GPL'd, by Julian\
  \ Seward et al.\n==40682== Using Valgrind-3.18.1 and LibVEX; rerun with -h for copyright\
  \ info\n==40682== Command: ch-debugging-badmem1 -b\n==40682==\n==40682== Invalid\
  \ write of size 1\n==40682==    at 0x109230: main (ch-debugging-badmem1.c:20)\n\
  ==40682==  Address 0x4a9d06a is 12 bytes after a block of size 30 alloc'd\n==40682==\
  \    at 0x484899: malloc (in /usr/libexec/valgrind/vgpreload_memcheck\n        \
  \                               amd64-linux.so)\n==40682==    by 0x1091C5: main\
  \ (ch-debugging-badmem1.c:13)\n==40682==\np = <not 30 bytes>\n==40682==\n==40682==\
  \ HEAP SUMMARY:\n==40682==     in use at exit: 30 bytes in 1 blocks\n==40682== \
  \  total heap usage: 2 allocs, 1 frees, 4,126 bytes allocated\n==40682==\n==40682==\
  \ LEAK SUMMARY:\n==40682==    definitely lost: 30 bytes in 1 blocks\n==40682== \
  \   indirectly lost: 0 bytes in 0 blocks\n==40682==      possibly lost: 0 bytes\
  \ in 0 blocks\n==40682==    still reachable: 0 bytes in 0 blocks\n==40682==    \
  \     suppressed: 0 bytes in 0 blocks\n==40682== Rerun with --leak-check=full to\
  \ see details of leaked memory\n==40682==\n==40682== ERROR SUMMARY: 1 errors from\
  \ 1 contexts (suppressed: 0 from 0)\n```\n\n\n\n\n\n（输出中的行号是为了方便讨论而添加的。）第 12 行是程序的输出；其余全部来自\
  \ `Valgrind` 的标准错误。错误报告位于第 6–10 行。它指示了错误写入了多少字节（第 6 行）、发生位置（第 7 行）以及堆栈跟踪。第 8–10\
  \ 行描述了内存从哪里分配。第 14–23 行提供了摘要。\n\n`ch-debugging-badmem1` 的 `-f` 选项释放了分配的内存，然后通过悬指针对其写入。以下是\
  \ `Valgrind` 对此情况的报告：\n\n```\n$ valgrind ch-debugging-badmem1-f\n==40751== Memcheck,\
  \ a memory error detector\n...\n==40751== Invalid write of size 1\n==40751==   \
  \ at 0x109266: main (ch-debugging-badmem1.c:23)\n==40751==  Address 0x4a9d040 is\
  \ 0 bytes inside a block of size 30 free'd\n==40751==    at 0x484B27F: free (in\
  \ /usr/libexec/valgrind/vgpreload_memcheck-amd64-linux.so)\n==40751==    by 0x109261:\
  \ main (ch-debugging-badmem1.c:22)\n==40751==  Block was alloc'd at\n==40751== \
  \   at 0x4848899: malloc (in /usr/libexec/valgrind/vgpreload_memcheck-amd64-linux.so)\n\
  ==40751==    by 0x1091C5: main (ch-debugging-badmem1.c:13)\n==40751==\np = <not\
  \ 30 bytes>\n...\n```\n\n这次报告指出写入操作发生在已释放的内存，且对 `free()` 的调用位于 `ch-debugging-badmem1.c`\
  \ 的第 22 行。\n\n当不带选项调用时，`ch-debugging-badmem1.c` 分配了内存并使用，但不释放。`--leak-check=yes`\
  \ 选项报告了此情况：\n\n```\n$ valgrind --leak-check=yes ch-debugging-badmem1\n 1  ==8720==\
  \ Memcheck, a.k.a. Valgrind, a memory error detector for x86-linux.\n...\n 8  p\
  \ = <not 30 bytes>\n 9  ==8720==\n10  ==8720== ERROR SUMMARY: 0 errors from 0 contexts\
  \ (suppressed: 0 from 0)\n11  ==8720== malloc/free: in use at exit: 30 bytes in\
  \ 1 blocks.\n12  ==8720== malloc/free: 1 allocs, 0 frees, 30 bytes allocated.\n\
  ...\n16  ==8720==\n17  ==8720== 30 bytes in 1 blocks are definitely lost in loss\
  \ record 1 of 1\n18  ==8720==    at 0x40025488: malloc (vg_replace_malloc.c:153)\n\
  19  ==8720==    by 0x8048411: main (ch-debugging-badmem1.c:11)\n20  ==8720==   \
  \ by 0x420158D3: __libc_start_main (in /lib/i686/libc-2.2.93.so)\n21  ==8720== \
  \   by 0x8048368: (within /home/arnold/progex/code/ch17/ch-debugging-badmem1)\n\
  22  ==8720==\n23  ==8720== LEAK SUMMARY:\n24  ==8720==    definitely lost: 30 bytes\
  \ in 1 blocks.\n25  ==8720==    possibly lost:   0 bytes in 0 blocks.\n26  ==8720==\
  \    still reachable: 0 bytes in 0 blocks.\n27  ==8720==        suppressed:  0 bytes\
  \ in 0 blocks.\n28  ==8720== Reachable blocks (those to which a pointer was found)\
  \ are not shown.\n29  ==8720== To see them, rerun with: --show-reachable=yes\n```\n\
  \n第 17–29 行提供了泄漏报告；泄漏的内存是在 `ch-debugging-badmem1.c` 的第 11 行分配的。\n\n除了提供动态内存误用的报告外，`Valgrind`\
  \ 还可以诊断未初始化内存的使用。考虑以下程序 `ch-debugging-badmem2.c`：\n\n```\n 1  /* ch-debugging-badmem2.c\
  \ --- do bad things with nondynamic memory */\n 2\n 3  #include <stdio.h>\n 4  #include\
  \ <stdlib.h>\n 5\n 6  int\n 7  main(int argc, char **argv)\n 8  {\n 9      int a_var;\
  \  /* Both of these are uninitialized */\n 10      int b_var;\n 11            /*\
  \ Valgrind won't flag this; */\n 12      a_var = b_var;\n 13\n 14      /* Use uninitialized\
  \ memory; this is flagged. */\n 15      printf(\"a_var = %d\\n\", a_var);\n 16 \
  \     return EXIT_SUCCESS;\n 17  }\n```\n\n运行时，`Valgrind` 产生如下（简化）报告：\n\n```\n$\
  \ valgrind ch-debugging-badmem2\n==194322== Memcheck, a memory error detector\n\
  ...\n==194322== Conditional jump or move depends on uninitialised value(s)\n==194322==\
  \    at 0x48E7AD6: __vfprintf_internal (vfprintf-internal.c:1516)\n==194322==  \
  \  by 0x48D179E: printf (printf.c:33)\n==194322==    by 0x10917A: main (ch-debugging-badmem2.c:16)\n\
  ==194322==  Uninitialised value was created by a stack allocation\n==194322==  \
  \  at 0x109149: main (ch-debugging-badmem2.c:8)\n...\na_var = 0\n==194322== HEAP\
  \ SUMMARY:\n==194322==     in use at exit: 0 bytes in 0 blocks\n==194322==   total\
  \ heap usage: 1 allocs, 1 frees, 4096 bytes allocated\n==194322== All heap blocks\
  \ were freed -- no leaks are possible\n==194322== Use --track-origins=yes to see\
  \ uninitialised values from\n==194322== For lists of detected and suppressed errors,\
  \ rerun with: -s\n==194322== ERROR SUMMARY: 5 errors from 5 contexts (suppressed:\
  \ 0)\n```\n\n此报告告诉了我们何时以及何地使用了未初始值。它没有告诉我们未初始化的值来自哪里。然而，`Valgrind` 贴心地建议我们使用 `--track-origins=yes`\
  \ 选项查找。让我们尝试一下：\n\n```\n$ valgrind --track-origins=yes ch-debugging-badmem2\n==194417==\
  \ Memcheck, a memory error detector\n...\n==194417== Conditional jump or move depends\
  \ on uninitialised value(s)\n==194417==    at 0x48E7AD6: __vfprintf_internal (vfprintf-internal.c:1516)\n\
  ==194417==    by 0x48D179E: printf (printf.c:33)\n==194417==    by 0x10917A: main\
  \ (ch-debugging-badmem2.c:16)\n==194417==  Uninitialised value was created by a\
  \ stack allocation\n==194417==    at 0x109149: main (ch-debugging-badmem2.c:8)\n\
  ...\na_var = 0\n==194417== HEAP SUMMARY:\n==194417==     in use at exit: 0 bytes\
  \ in 0 blocks\n==194417==   total heap usage: 1 allocs, 1 frees, 4096 bytes allocated\n\
  ...\n```\n\n遗憾的是，尽管 `Valgrind` 可以报告一直到位级别的未初始化内存的使用，但它无法对局部和全局变量进行数组边界检查。（Valgrind\
  \ 可以对动态内存进行边界检查，因为它自己处理这些内存，因此知道每个区域的开始和结束。）\n\n`Valgrind` 是一个强大的内存调试工具。它与许多商业产品竞争，并成为内存错误检测的标准工具。通常可以使用发行版的包管理器安装\
  \ `Valgrind`，或者从其网站获取。下一节展示了一个 `Valgrind` 在发现 bug 方面非常有价值的真实示例。\n\n[`www.valgrind.org`](https://www.valgrind.org)\n\
  \n### 17.6.1.1 Valgrind 示例：One True Awk 中的 `gototab`\n\n早早在第 6.2.2.1 节“示例：排序与搜索结合”（第\
  \ 185 页）中，我们描述了结合动态管理与二分查找如何为 One True Awk 使用的正则表达式函数提供巨大的加速。在深入这一节之前，你可能想先回顾一下那一节。\n\
  \n我们展示了如何设置“goto 跳表”：\n\n```c\nstatic int set_gotab(fa *f, int state, int ch, int\
  \ val) /* 隐藏 gotab 实现 */\n{\n    if (f->gototab[state].inuse == 0) {\n        f->gototab[state].entries[0].ch\
  \ = ch;\n        f->gototab[state].entries[0].state = val;\n        f->gototab[state].inuse++;\n\
  \        return val;\n    } else if ((unsigned)ch > f->gototab[state].entries[f->gototab[state].inuse-1].ch)\
  \ {\n        // 尚未见过，插入并返回\n        gtt *tab = & f->gototab[state];\n        if\
  \ (tab->inuse + 1 >= tab->allocated)\n            resize_gototab(f, state);\n  \
  \  }\n    ...\n}\n```\n\n我们没有展示 `resize_gototab()` 函数。这里是原始编写的版本：\n\n```c\nstatic\
  \ void resize_gototab(fa *f, int state)\n{\n    size_t new_size = f->gototab[state].allocated\
  \ * 2;\n    gtte *p = (gtte *) realloc(f->gototab[state].entries, new_size * sizeof(gtte));\n\
  \    if (p == NULL)\n        overflo(__func__);\n    f->gototab[state].allocated\
  \ = new_size;\n    f->gototab[state].entries = p;\n}\n```\n\n\n\n\n\n（你可以通过检查 Git\
  \ 仓库中的提交 `35d4627` 来查看这段代码。）\n\n遗憾的是，这段代码中有一个 bug。（遗漏了某些内容；思考一下 `malloc()` 和 `realloc()`\
  \ 分配内存的本质，然后在继续阅读之前稍花一点时间，看看你是否能发现它。）这个 bug 导致名为 `funstack` 的测试失败，产生的输出与预期的不符。\n\
