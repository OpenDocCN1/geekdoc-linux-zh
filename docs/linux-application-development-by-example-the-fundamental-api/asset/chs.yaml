  \n```\n/* Exit statuses for programs like 'env' that exec other programs.  */\n\
  enum\n{\n  EXIT_TIMEDOUT = 124, /* Time expired before child completed.  */\n  EXIT_CANCELED\
  \ = 125, /* Internal error prior to exec attempt.  */\n  EXIT_CANNOT_INVOKE = 126,\
  \ /* Program located, but not usable.  */\n  EXIT_ENOENT = 127 /* Could not find\
  \ program to exec.  */\n};\n```\n\n最后两个退出状态值 `126` 和 `127` 符合 POSIX 标准。`127` 表示\
  \ `execvp()` 尝试运行的程序不存在（`ENOENT` 意味着目录中没有该文件的条目）。`126` 意味着文件存在，但发生了其他错误。\n\n以下是处理取消环境变量的两个函数。`append_unset_var()`\
  \ 将变量添加到一个可以动态增长的数组中（详见 第 3 章，“用户级内存管理” 节，详见第 51 页）。`unset_envvars()` 遍历数组，并对每个元素调用\
  \ `unsetenv()`：\n\n```\n166  static void\n167  append_unset_var (char const *var)\n\
  168  {\n169    if (usvars_used == usvars_alloc)\n170      usvars = x2nrealloc (usvars,\
  \ &usvars_alloc, sizeof *usvars);\n171    usvars[usvars_used++] = var;\n172  }\n\
  173\n174  static void\n175  unset_envvars (void)\n176  {\n177    for (idx_t i =\
  \ 0; i < usvars_used; ++i)\n178      {\n179        devmsg (\"unset:    %s\\n\",\
  \ usvars[i]);\n180\n181        if (unsetenv (usvars[i]))\n182          error (EXIT_CANCELED,\
  \ errno, _(\"cannot unset %s\"),\n183                 quote (usvars[i]));\n184 \
  \     }\n185  }\n```\n\n## 2.5 总结\n\n*   C 程序通过参数 `argc` 和 `argv` 访问其命令行参数。`getopt()`\
  \ 函数提供了一种一致解析选项及其参数的标准方法。`getopt()` 的 GNU 版本提供了一些扩展，而 `getopt_long()` 和 `getopt_long_only()`\
  \ 则使得解析长格式选项变得简单。\n\n*   环境是一组 `name`=`value` 对，每个程序都从其父进程继承。程序可以根据作者的意愿使用环境变量来改变其行为，除了任何命令行参数。标准例程（`getenv()`、`setenv()`、`putenv()`\
  \ 和 `unsetenv()`）用于获取环境变量的值、更改它们或删除它们。如果有必要，可以通过外部变量 `environ` 或通过向 `main()` 添加第三个参数\
  \ `char**envp` 获取整个环境。后者技术不被推荐。\n\n## 练习题\n\n1.  如果你今天编译 V7 版本的 `echo.c`，你会得到很多警告。修改代码使用现代\
