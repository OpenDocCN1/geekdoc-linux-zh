  \ \"r\")) == NULL) {\n 63          fprintf(stderr, \"%s: %s: could not open: %s\\\
  n\", argv[0],\n 64                          argv[1], strerror(errno));\n 65    \
  \      exit(1);\n 66      }\n 67\n 68      /* Very simple code to read data: */\n\
