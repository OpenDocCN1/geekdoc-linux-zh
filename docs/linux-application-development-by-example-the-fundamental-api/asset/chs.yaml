  \ 转换格式说明符\n\n*区域*（locale）是一种描述当前位置的方法，它考虑了如语言、字符集以及日期、时间和货币金额格式的默认值等因素。我们在第 15 章“国际化与本地化”、第\
  \ 507 页中处理它们。目前，只需要理解 `strftime()` 对于相同格式字符串产生的结果可能会根据当前区域而变化即可。\n\n以 `%E` 和 `%O`\
  \ 开头的版本用于“备用表示”。某些区域有多种方式表示相同的内容；这些说明符提供了对额外表示的访问。如果特定区域不支持备用表示，则 `strftime()` 使用标准版本。\n\
  \n许多 Unix 版本的 `date` 允许你在命令行上提供一个以 `+` 字符开头的格式字符串。随后 `date` 将根据格式字符串格式化当前日期和时间，并将其打印出来：\n\
  \n```\n$ date +'It is now %A, %B %d, %Y, %I:%M %p'\nIt is now Sunday, May 25, 2025,\
  \ 04:35 PM\n```\n\n输出取决于当前区域（系统认为你处于世界的哪个位置；区域和控制它们的环境变量将在稍后的第 15.2 节中讨论，即“区域与 C\
  \ 标准库”在第 508 页。例如，通过将环境变量 `LC_ALL` 设置为 `it_IT.utf8`（意大利），我们可能会得到类似的内容：\n\n```\n\
  $ LC_ALL=it_IT.utf8 date +'It is now %A, %B %d, %Y, %I:%M %p'\nIt is now domenica,\
  \ maggio 25, 2025, 04:36\n```\n\n注意，尽管格式字符串中有 `%p`，但并没有 a.m./p.m. 的指示。通过将 `LC_ALL`\
  \ 设置为 `C`，我们可以得到传统的 Unix 输出：\n\n```\n$ LC_ALL=C date +'It is now %A, %B %d, %Y,\
  \ %I:%M %p'\nIt is now Sunday, May 25, 2025, 04:35 PM\n```\n\n`strftime()` 的许多说明符源于现有的\
  \ Unix `date` 实现。`%n` 和 `%t` 格式在 C 中并不是严格必要的，因为制表符和换行符已经存在。\n\n\n\n\n然而，人类输入的日期并不总是那么容易处理。例如，许多版本的\
  \ `touch` 命令允许你提供一个日期和时间，以便 `touch` 将此设置文件的修改时间或访问时间（使用 `utimensat()`，如第 5.6.4 节\
  \ 中描述的“更改时间戳：`utime()` 及其后续者”、第 148 页）。\n\n将人类输入的日期转换为 `time_t` 值是非常困难的：必须考虑闰年、补偿时区差等问题。因此，C90\
  \ 标准引入了 `mktime()` 函数：\n\n```\n#include <time.h>                               \
  \     ISO C\n\ntime_t mktime(struct tm *tm);\n```\n\n要使用 `mktime()`，需要向 `struct\
  \ tm` 填入适当的值：年、月、日等。如果你知道给定日期是否执行了夏令时，请恰当地设置 `tm_isdst` 字段：`0` 表示“否”，正数表示“是”。否则，使用负值表示“未知”。`tm_wday`\
  \ 和 `tm_yday` 字段会被忽略。\n\n`mktime()` 假设 `struct tm` 代表本地时间，而不是 UTC。它返回一个表示传入日期和时间的\
  \ `time_t` 值；如果给定的日期/时间无法被正确表示，则返回 `(time_t) –1`。成功返回后，`struct tm` 中的所有值都将调整到正确的范围内，且\
  \ `tm_wday` 和 `tm_yday` 也会被正确设置。这里是一个简单的示例：\n\n```\n 1  /* ch-general1-echodate.c\
  \ --- demonstrate mktime(). */\n 2\n 3  #include <stdio.h>\n 4  #include <stdlib.h>\n\
  \ 5  #include <time.h>\n 6\n 7  int\n 8  main(void)\n 9  {\n10       struct tm tm;\n\
  11       time_t then;\n12\n13       printf(\"Enter a Date/time as YYYY/MM/DD HH:MM:SS\
  \ : \");\n14       scanf(\"%d/%d/%d %d:%d:%d\",\n15           & tm.tm_year, & tm.tm_mon,\
  \ & tm.tm_mday,\n16           & tm.tm_hour, & tm.tm_min, & tm.tm_sec);\n17\n18 \
  \      /* Error checking on values omitted for brevity. */\n19       tm.tm_year\
  \ -= 1900;\n20       tm.tm_mon--;\n21\n22       tm.tm_isdst = -1;       /* Don't\
  \ know about DST */\n23\n24       then = mktime(& tm);\n25\n26       printf(\"Got:\
  \ %s\", ctime(& then));\n27       exit(EXIT_SUCCESS);\n28  }\n```\n\n第 13 行提示输入日期和时间，第\
  \ 14–16 行读取它。生产环境代码应该检查 `scanf()` 的返回值。（mktime()` 会检查它收到的值是否在合理范围内。）第 19 行和第 20\
  \ 行补偿了年份和月份不同的基准值。第 24 行表示我们不知道给定的日期时间是否代表夏令时。第 24 行调用了 `mktime()`，第 26 行打印结果。编译并运行时，我们看到它是可以工作的：\n\
  \n```\n$ ch-general1-echodate\nEnter a Date/time as YYYY/MM/DD HH:MM:SS : 2025/07/10\
  \ 12:44:55\nGot: Thu Jul 10 12:44:55 2025\n```\n\n### 将日期和时间解析为 struct tm\n\n通过\
  \ `strftime()`，我们将 `struct tm` 转换为人类可读的字符串。POSIX 提供了另一个例程来执行相反操作：获取一个字符串并将其转回为 `struct\
  \ tm`。这可以让你由于避开手动解析日期以获取 `struct tm` 的痛苦。该例程是 `strptime()`：\n\n```\n#define _XOPEN_SOURCE\
  \                                   GLIBC\n#include <time.h>                   \
  \                    POSIX\n\nchar *strptime(const char *buf, const char *format,\
  \ struct tm *tm);\n```\n\n参数为：\n\n*   `const char *buf`: 要解析的日期字符串的文本。\n*   `const\
  \ char *format`: 描述 `buf` 内容的格式字符串。\n*   `struct tm *tm`: 指向存放值的 `struct tm` 的指针。\n\
  \n发生错误时返回值为 `NULL`。否则，返回值指向未解析的第一个字符。这里是一个简单的示例：\n\n```\n/* ch-general1-parsetime.c\
  \ --- Adapted from POSIX strptime() description. */\n\n#define _XOPEN_SOURCE   \
  \     /* 在 GLIBC 上需要，必须在所有 include 之前! */\n#include <stdio.h>\n#include <stdlib.h>\n\
  #include <errno.h>\n#include <string.h>\n#include <time.h>\n\nint\nmain(int argc,\
  \ char **argv)\n{\n    struct tm tm;\n    time_t t;\n\n    if (strptime(\"15 Dec\
  \ 2025 18:07:53\", \"%b %Y %H:%M:%S\", &tm) == NULL) {\n        fprintf(stderr,\
  \ \"strptime failed: %s\\n\", strerror(errno));\n        exit(EXIT_FAILURE);\n \
  \   }\n\n    printf(\"Year: %d, Month: %d, Day: %d, Hour: %d, Minute: %d, Second:\
  \ %d\\n\",\n        tm.tm_year + 1900, tm.tm_mon + 1, tm.tm_mday,\n        tm.tm_hour,\
  \ tm.tm_min, tm.tm_sec);\n\n    t = mktime(&tm);\n    if (t == -1) {\n        fprintf(stderr,\
  \ \"mktime failed: %s\\n\", strerror(errno));\n        exit(EXIT_FAILURE);\n   \
  \ }\n\n    printf(\"Seconds since Epoch: %ld\\n\", t);\n\n    return EXIT_SUCCESS;\n\
  }\n```\n\n运行时，它产生如下输出：\n\n```\n$ ch-general1-parsetime\nYear: 2025, Month: 12, Day:\
  \ 15, Hour: 18, Minute: 7, Second: 53\nSeconds since Epoch: 1765814873\n```\n\n\n\
  \n\n当前时区与 UTC 之间的差异（以秒为单位）。标准并没有解释这种差异是如何工作的。在实践中，负值表示 UTC 的*东部*（提前或更晚于 UTC）时区，正值表示\
  \ UTC 的*西部*（落后于或更早于 UTC）时区。如果你将此值视为“为了让本地时间与 UTC 一致而需要更改的时间”，那么该值的正负就有意义了。\n\n*\
  \   `extern int daylight`\n\n如果当前时区从不应该应用夏令时转换，则该变量为 0，否则为非零。\n\n### 注意\n\n`daylight`\
  \ 变量*并不*指示当前是否处于夏令时状态！相反，它仅仅说明当前时区是否*可以*夏令时。\n\nPOSIX 标准规定，`ctime()`、`localtime()`、`mktime()`\
  \ 和 `strftime()` 的行为都“如同”它们调用了 `tzset()`。这意味着它们不需要实际调用 `tzset()`，但它们的行为必须像已经调用过它一样。（这种措辞旨在为实现者提供一定的灵活性，同时保证用户级代码的正确运行。）\n\
  \n在实践中，这意味着你几乎不需要自己调用 `tzset()`。不过，如果你需要，它就在那里。\n\n#### 6.1.6.1 BSD 系统的陷阱：是 `timezone()`\
  \ 而不是 `timezone`\n\n几个源自 4.4 BSD 的系统提供了一个 `timezone()` 函数，而不是 POSIX 的 `timezone`\
  \ 变量：\n\n```\n#include <time.h>                                                \
  \   BSD\n\nchar *timezone(int zone, int dst);\n```\n\n`zone` 参数是 GMT 以西的*分钟*数，`dst`\
  \ 在夏令时生效时为真。返回值是一个给出指定时区名称的字符串，或者是相对于 GMT 的值。该函数与同名同行为的 V7 函数兼容。\n\n该函数的存在使得 POSIX\
  \ `timezone` 变量的可移植使用变得困难。幸运的是，我们并没有看到它的巨大需求：对于所有非特殊的需求，`strftime()` 都足够了。\n\n###\
  \ 6.2 排序和搜索函数\n\n排序和搜索是许多应用程序不断需要的两个基本操作。C 库提供了标准接口来执行这些任务。它们在本质上是通用的，适用于任何类型的数据，而不是针对特定应用程序进行优化。\n\
  \n所有例程共享一个共同的主题：数据通过 `void *` 指针进行管理，由用户提供的函数提供排序。请注意，这些 API 适用于*内存中*的数据。对文件进行排序和搜索要复杂得多，超出了本文这类入门书籍的范围。（然而，`sort`\
  \ 命令处理文本文件效果良好；请参见 `sort`(1) 手页。排序二进制文件需要编写专门的程序。）\n\n由于没有一种算法适用于所有应用程序，因此有几组不同的库例程用于维护可搜索的数据集。本章仅涵盖了一个简单的搜索接口。更高级接口在第\
  \ 16.4 节“使用二叉树进行高级搜索”，“第 575 页](#ch16.xhtml_page_575)”中描述。此外，我们故意不解释底层算法，因为这是一本关于\
  \ API 的书，而不是关于算法和数据结构的书。重要的是你可以将 API 视为“黑盒”，它们完成一项特定的工作，而不需要理解它们*如何*完成工作的细节。\n\n\
  ### 6.2.1 排序：`qsort()`\n\n排序通过 `qsort()` 完成：\n\n```\n#include <stdlib.h>       \
  \                                         ISO C\n\nvoid qsort(void *base, size_t\
  \ nmemb, size_t size,\n           int (*compare)(const void *, const void *));\n\
  ```\n\n`qsort()` 的名字来自 C. A. R. Hoare 的快速排序算法，该算法曾被用于最初的 Unix 实现中。（POSIX 标准并没有规定\
  \ `qsort()` 使用这种算法。GLIBC 实现使用了高度优化的快速排序和插入排序的组合。）\n\n`qsort()` 排序任意对象的数组。它通过将数组内部的不透明内存块从一个位置移动到另一个位置来工作，并依赖于你（程序员）提供一个比较函数，以便它确定一个数组元素相对于另一个元素的排序顺序。参数如下：\n\
  \n*   `void *base`\n    数组起始的地址。\n*   `size_t nmemb`\n    数组中的元素总数。\n*   `size_t\
  \ size`\n    数组中每个元素的大小。获取此值的最佳方法是使用 C 语言的 `sizeof` 运算符。\n*   `int (*compare)(const\
  \ void *, const void *)`\n    一个看起来有点吓人的*函数指针*声明。它表示“`compare` 指向一个接受两个 `const void\
  \ *` 参数并返回 `int` 的函数”。\n\n大部分工作在于编写一个正确的比较函数。返回值应该模拟 `strcmp()`：如果第一个值“小于”第二个值，则小于零；如果它们相等，则为零；如果第一个值“大于”第二个值，则大于零。正是比较函数定义了你所排序的任何内容的“小于”和“大于”的含义。例如，为了比较两个\
  \ `double` 值，我们可以使用此函数：\n\n```\nint\ndcomp(const void *d1p, const void *d2p)\n{\n\
  \    const double *d1, *d2;\n\n    d1 = (const double *) d1p;                将指针转换为正确类型\n\
  \    d2 = (const double *) d2p;\n\n    if (*d1 < *d2)                          \
  \  比较并返回正确值\n        return -1;\n    else if (*d1 > *d2)\n        return 1;\n  \
  \  else if (*d1 == *d2)\n        return 0\n    else\n        return -1;     /* NaN\
  \ 排序在实数之前 */\n}\n```\n\n这显示了比较函数的通用模板代码：将参数从 `void *` 转换为所比较类型的类型的指针，然后返回一个比较值。\n\
  \n对于浮点值，简单的减法（如 `return *d1 - *d2`）是不可行的，特别是当一个值非常小，或者一个或两个值是特殊的“非数字”或“无穷大”值时。因此，我们必须手动进行比较，包括考虑非数字值（它甚至与自己都不相等！）。\n\
  \n#### 6.2.1.1 示例：排序员工\n\n对于更复杂的结构，需要更复杂的函数。例如，考虑以下（相当简单的）`struct employee`：\n\n\
  ```\nstruct employee {\n    char lastname[30];\n    char firstname[30];\n    long\
  \ emp_id;\n    time_t start_date;\n};\n```\n\n我们可能会编写一个函数按姓、名和 ID 号对员工进行排序：\n\n\
  ```\nint\nemp_name_id_compare(const void *e1p, const void *e2p)\n{\n    const struct\
  \ employee *e1, *e2;\n    int last, first;\n\n    e1 = (const struct employee *)\
  \ e1p;                          转换指针\n    e2 = (const struct employee *) e2p;\n\n\
  \    if ((last = strcmp(e1->lastname, e2->lastname)) != 0)        比较姓\n        return\
  \ last;                                             姓不同\n\n    /* 同姓，检查名 */\n  \
  \  if ((first = strcmp(e1->firstname, e2->firstname)) != 0)     比较名\n        return\
  \ first;                                            名不同\n\n    /* 同名，检查 ID 号 */\n\
  \    if (e1->emp_id < e2->emp_id)                                 比较员工 ID\n    \
  \    return -1;\n    else if (e1->emp_id == e2->emp_id)\n        return 0;\n   \
  \ else\n        return 1;\n}\n```\n\n这里的逻辑非常直观，最初比较姓，然后是比较名，如果两个名字相同则使用员工 ID 号。通过对字符串使用\
  \ `strcmp()`，我们自动获得返回的正确负/零/正值。\n\n\n\n\n员工 ID 的比较不能仅仅使用减法：假设 `long` 是 64 位而 `int`\
  \ 是 32 位，且两个值仅在高 32 位上不同（例如，低 32 位为 0）。在这种情况下，减法结果将自动强制转换为 `int`，从而丢弃高 32 位并返回一个错误的值。\n\
  \n### 注意\n我们本可以在对姓名进行比较后就停止，在这种情况下，所有姓氏和名字相同的员工将被分在一起，但*没有其他顺序排序*。\n\n这一点很重要：`qsort()`\
  \ 不保证排序是 `stable`（稳定）的。稳定排序是指：如果两个元素根据某些键值（key values）比较相等，它们在最终排序数组中将保持它们彼此的原始顺序。例如，考虑三个姓和名相同且员工编号分别为\
  \ `17`、`42` 和 `81` 的员工。它们在原始数组中的顺序可能是 `42`、`81` 和 `17`（这意味着员工 `42` 的索引比员工 `81` 小，而员工\
  \ `81` 的索引又比员工 `17` 小）。排序后，顺序可能变成 `81`、`42` 和 `17`。如果这是一个问题，那么比较程序必须考虑*所有*重要的键值。（我们的程序已经考虑了）。\n\
  \n通过简单使用不同的函数，我们可以按照资历对员工进行排序：\n\n```c\nint\nemp_seniority_compare(const void *e1p,\
  \ const void *e2p)\n{\n    const struct employee *e1, *e2;\n    double diff;\n\n\
  \    e1 = (const struct employee *) e1p; // 将指针转换为正确类型\n    e2 = (const struct employee\
  \ *) e2p;\n\n    diff = difftime(e1->start_date, e2->start_date); // 比较时间\n    if\
  \ (diff < 0)\n        return -1;\n    else if (diff > 0)\n        return 1;\n  \
  \  else\n        return 0;\n}\n```\n\n为了获得最大的移植性，我们使用了 `difftime()`，它返回两个 `time_t`\
  \ 值之间的秒差。对于这种特定情况，像下面的转换\n\n```c\nreturn (int) difftime(e1->start_date, e2->start_date);\n\
  ```\n\n应该就能解决问题，因为 `time_t` 值在合理的范围内。尽管如此，我们仍然使用了完整的三路 `if` 语句，以确保起见。这里有一个示例数据文件，列出了九位美国总统：\n\
  \n```\n$ cat presdata.txt\nTrump Donald 47 173739600 // 姓, 名, 就职日期\nBiden Joseph\
  \ 46 161165600\nTrump Donald 45 148493200\nObama Barack 44 123247400\nBush George\
  \ 43 98013600\nClinton William 42 72752800\nBush George 41 60132200\nReagan Ronald\
  \ 40 34886100\nCarter James 39 22631200\n```\n\n`ch-general1-sortemp.c` 显示了一个简单的程序，它将该文件读入\
  \ `struct employee` 数组中，然后使用两个不同的函数对其排序：\n\n```c\n/* ch-general1-sortemp.c --- 使用比较函数演示\
  \ qsort() */\n#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\n#include\
  \ <time.h>\n\nstruct employee {\n    char lastname[30];\n    char firstname[30];\n\
  \    long emp_id;\n    time_t start_date;\n};\n\n/* emp_name_compare --- 按名字比较，再按\
  \ ID  */\nint emp_name_compare(const void *e1p, const void *e2p)\n{\n //... 如前所示，为了节省空间已省略\n\
  }\n\n/* emp_seniority_compare --- 按资历比较 */\nint emp_seniority_compare(const void\
  \ *e1p, const void *e2p)\n{\n //... 如前所示，为了节省空间已省略\n}\n\n/* main --- 演示排序 */\nint\
  \ main(void)\n{\n#define NPRES 20\n    struct employee presidents[NPRES];\n    int\
  \ i, npres;\n    char buf[BUFSIZ];\n    /* 读取数据的简单代码： */\n    for (npres = 0; npres\
  \ < NPRES && fgets(buf, BUFSIZ, stdin) != NULL; npres++) {\n        sscanf(buf,\
  \ \"%s %s %ld\\n\",\n              presidents[npres].lastname,\n              presidents[npres].firstname,\n\
  \              &presidents[npres].emp_id,\n              &presidents[npres].start_date);\n\
  \    }\n    /* npres 现在是实际读取的数目。 */\n    /* 首先，按名字排序 */\n    qsort(presidents, npres,\
  \ sizeof(struct employee), emp_name_compare);\n    /* 输出输出 */\n    printf(\"Sorted\
  \ by name:\\n\");\n    for (i = 0; i < npres; i++)\n        printf(\"\\t%s %s\\\
  t%ld%s\",\n              presidents[i].lastname,\n              presidents[i].firstname,\n\
  \              presidents[i].emp_id,\n              ctime(&presidents[i].start_date));\n\
  \    /* 现在，按资历排序 */\n    qsort(presidents, npres, sizeof(struct employee), emp_seniority_compare);\n\
  \    /* 再次打印 */\n    printf(\"Sorted by seniority:\\n\");\n    for (i = 0; i < npres;\
  \ i++)\n        printf(\"\\t%s %s\\t%ld%s\",\n              presidents[i].lastname,\n\
  \              presidents[i].firstname,\n              presidents[i].emp_id,\n \
  \             ctime(&presidents[i].start_date));\n```\n\n 74-81 行读取了数据。注意，任何对 `scanf()`\
  \ 的使用都需要良好的输入数据。例如，如果名字超过 29 个字符，就会出现问题。在这种情况下，我们安全的，但代码必须更加小心。86 行按名字排序了数据，而 98\
  \ 行这次按资历重新排序了数据。在编译并运行时，程序会产生以下结果：\n\n```\n$ ch-general1-sortemp < presdata.txt\n\
  Sorted by name:\n        Biden Joseph 46       Wed Jan 20 13:00:00 2021\n      \
  \  Bush George 41       Fri Jan 20 13:00:00 1989\n        Bush George 43       Sat\
  \ Jan 20 13:00:00 2001\n        Carter James 39       Thu Jan 20 13:00:00 1977\n\
  \        Clinton William 42       Wed Jan 20 13:00:00 1993\n        Obama Barack\
  \ 44       Tue Jan 20 13:00:00 2009\n        Reagan Ronald 40       Tue Jan 20 13:00:00\
  \ 1981\n        Trump Donald 45       Fri Jan 20 13:00:00 2017\n        Trump Donald\
  \ 47       Mon Jan 20 13:00:00 2025\nSorted by seniority:\n        Carter James\
  \ 39       Thu Jan 20 13:00:00 1977\n        Reagan Ronald 40       Tue Jan 20 13:00:00\
  \ 1981\n        Bush George 41       Fri Jan 20 13:00:00 1989\n        Clinton William\
  \ 42       Wed Jan 20 13:00:00 1993\n        Bush George 43       Sat Jan 20 13:00:00\
  \ 2001\n        Obama Barack 44       Tue Jan 20 13:00:00 2009\n        Trump Donald\
  \ 45       Fri Jan 20 13:00:00 2017\n        Biden Joseph 46       Wed Jan 20 13:00:00\
  \ 2021\n        Trump Donald 47       Mon Jan 20 13:00:00 2025\n```\n\n（我们使用下午 1:00\
  \ 作为每位总统开始工作的近似时间。）有一点值得提到：`qsort()` 会重新排列数组中的数据。如果数组中的每个元素都是大型结构体，那么在数组排序期间，会有*大量*数据被反复复制。相反，更好的做法是设置一个*单独的指针数组*，每个指针指向数组中的一个元素，然后使用\
  \ `qsort()` 对指针数组进行排序，通过*排序后的*指针来访问*未排序*的数据。\n\n\n\n\n付出的代价是用于存储指针的额外内存，以及为了修改比较函数以便在比较结构时使用额外的指针间接引用。但获得的好处是速度大幅提升，因为每一步中移动的只有四字节或八字节的指针，而不是一个大型结构体。（我们的\
  \ `struct employee` 在 32 位系统上占用 68 字节，在 64 位系统上占用 80 字节。交换四字节指针移动的数据量比交换结构少 17 倍。即使交换八字节指针的数据量也比交换结构少\
  \ 10 倍。）对于百万个内存结构，这种差异可能是巨大的，如果你正在为内存受限的嵌入式系统这可能更为重要。\n\n### 注意\n\n如果你是 C++ 程序员，请小心！对对象数组使用\
  \ `qsort()` 可能是危险的！`qsort()` 执行原始内存移动，即复制字节。它完全无法感知 C++ 构造，如拷贝构造函数或 `operator=()`\
  \ 函数。相反，请使用 STL 排序函数之一，或使用指针分离数组技术。\n\n### 6.2.1.2 示例：排序目录内容\n\n在第 5.3 节，“读取目录”，第\
  \ 123 页中，我们演示了目录项是按照物理目录顺序返回的。大多数情况下，让目录内容按某种方式排序（例如按名称或修改时间）要有用得多。几个例程可以轻松实现这一点，它们使用\
  \ `qsort()` 作为底层排序代理：\n\n```\n#include <dirent.h>                              \
  \                      POSIX\n\nint scandir(const char *dir, struct dirent ***namelist,\n\
  \            int (*select)(const struct dirent *),\n            int (*compare)(const\
  \ struct dirent **, const struct dirent **));\nint alphasort(const struct dirent\
  \ **a, const struct dirent **b);\n\nint versionsort(const struct dirent **a, const\
  \ struct dirent **b);     GLIBC\n```\n\n`scandir()` 和 `alphasort()` 函数首次在 4.2 BSD\
  \ 中提供。它们一直得到广泛支持，现在已由 POSIX 标准化。`versionsort()` 是一个 GNU 扩展。\n\n`scandir()` 读取由 `dir`\
  \ 命目录，通过 `malloc()` 创建一个 `struct dirent` 指针数组，并将 `*namelist` 指向该数组的开头。指针数组和所指向的\
  \ `struct dirent` 结构都是通过 `malloc()` 分配的；由调用代码使用 `free()` 来避免内存泄漏。\n\n使用 `select`\
  \ 函数指针来选择感兴趣的条目。当此值为 `NULL` 时，所有有效的目录项都包含在最终数组中。否则，会对每个条目调用 `(*select)()`，返回非零（真）的条目将被包含在数组中。\n\
  \n`compare` 函数指针比较两个目录项。它被传递给 `qsort()` 用于排序。\n\n`alphasort()` 按顺序比较文件名。它使用 `strcoll()`\
  \ 函数进行比较。`strcoll()` 与 `strcmp()` 类似，但它考虑了与区域相关的排序规则（参见第 15.2.3 节，“字符串校对：`strcoll()`\
  \ 和 `strxfrm()``”，“第 512 页）。\n\n`versionsort()` 是 GNU 扩展，它使用 GNU 的 `strverscmp()`\
  \ 函数来比较文件名（参见 `strverscmp`(3)).简而言之，该函数理解常见的文件版本命名并并相应的比较。\n\n`ch-general1-sortdir.c`\
  \ 显示了一个与 `ch-fileinfo-catdir.c` 类似的程序。然而，它使用了 `scandir()` 和 `alphasort()` 来完成工作：\n\
  \n```\n 1  /* ch-general1-sortdir.c --- Demonstrate scandir(), alphasort(). */\n\
  \ 2\n 3  #include <stdio.h>              /* for printf() etc. */\n 4  #include <errno.h>\
  \              /* for errno */\n 5  #include <stdlib.h>             /* for free()\
  \ */\n 6  #include <string.h>             /* for strerror() */\n 7  #include <sys/types.h>\
  \          /* for system types */\n 8  #include <dirent.h>             /* for directory\
  \ functions */\n 9\n10  char *myname;\n11  int process(const char *dir);\n12\n13\
  \  /* main --- loop over directory arguments */\n14\n15  int\n16  main(int argc,\
  \ char **argv)\n17  {\n18      int i;\n19      int errs = 0;\n20\n21      myname\
  \ = argv[0];\n22\n23      if (argc == 1)\n24          errs = process(\".\");   \
  \ /* default to current directory */\n25      else\n26          for (i = 1; i <\
  \ argc; i++)\n27              errs += process(argv[i]);\n28\n29      return (errs\
  \ != 0);\n30  }\n31\n32  /* nodots --- ignore dot files */\n33  int\n34  nodots(const\
  \ struct dirent *dp)\n35  {\n36      return dp->d_name[0] != '.';\n37  }\n38\n39\n\
  40  /* process --- do something with */\n41  int\n42  process(const char *dir)\n\
  43  {\n44      DIR *dp;\n45      struct dirent **entries;\n46      int nents, i;\n\
  47\n48      nents = scandir(dir, &entries, nodots, alphasort);\n49      if (nents\
  \ < 0) {\n50          fprintf(stderr, \"%s: %s\\n\", myname, strerror(errno));\n\
  51          return 1;\n52      }\n53\n54      for (i = 0; i < nents; i++) {\n55\
  \          printf(\"%ld %s\\n\", (long)entries[i]->d_ino, entries[i]->d_name);\n\
  56          free(entries[i]);\n57      }\n58      free(entries);\n59      closedir(dp);\n\
  60      return 0;\n61  }\n62  }\n```\n（注：提供的代码块原始文本存在碎片化/损坏；我根据周围上下文重建了逻辑以保持清晰)。\n\
  \n#### 6.2.2 二分查找：`bsearch()`\n\n*线性搜索*几乎如其名之：你从开始处开始检查数组的每个元素，直到找到你需要的元素。对于像查找整数这样简单的任务，这通常采用\
  \ `for` 循环的形式。考虑此函数：\n\n```\n/* ifind --- linear search, return index if found or\
  \ -1 if not */\n\nint\nifind(int x, const int array[], size_t nelems)\n{\n    size_t\
  \ i;\n\n    for (i = 0; i < nelems; i++)\n        if (array[i] == x) /* found it\
  \ */\n            return i;\n\n    return -1;\n}\n```\n\n线性搜索的优点是它简单；在编写时很容易写出正确的代码。此外，它总是有效的。即使在数组末尾添加元素或从数组中删除元素，不需要重新排序。\n\
  \n线性搜索的缺点是速度慢。平均而言，对于包含 `nelems` 个元素的数组，对随机元素的线性搜索在找到目标元素之前需要进行 `nelems / 2` 次比较。随着\
  \ `nelems` 变大，即使在现代高性能系统上，这也会变得极其昂贵。因此，你只应该在小数组上使用线性搜索。\n\n与线性搜索不同，二分查找要求输入数组已经排序。这里的缺点是，如果添加了元素，必须在搜索之前重新排序。（当元素被删除时，数组的剩余内容必须向前移动。这不像重新排序那样昂贵，但仍涉及大量的数据移动。）\n\
  \n\n\n\n二分查找的优势——这是一个非常巨大的优势——在于二分查找的速度快得惊人，最多只需要 `⌊log2⌋ + 1` 次比较，其中 `N` 是数组中的元素个数。`bsearch()`\
  \ 函数的声明如下：\n\n```c\n#include <stdlib.h>                                        \
  \       ISO C\n\nvoid *bsearch(const void *key, const void *base, size_t nmemb,\n\
  \              size_t size, int (*compare)(const void *, const void *));\n```\n\n\
  这些参数及其用途与 `qsort()` 相似：\n\n* `const void *key`\n    在数组中要查找的对象。\n* `const void *base`\n\
  \    数组的起始位置。\n* `size_t nmemb`\n    数组中的元素个数。\n* `size_t size`\n    每个元素的大小，通过\
  \ `sizeof` 获取。\n* `int (*compare)(const void *, const void *)`\n    比较函数。它必须以与 `qsort()`\
  \ 比较函数相同的方式，根据第一个参数是否小于/等于/大于第二个参数来返回负数/零/正数。\n\n`bsearch()` 在未找到对象时返回 `NULL`。否则，它返回指向找到对象的指针。如果有多个数组元素匹配\
  \ `key`，则返回哪一个是不确定的。因此，与 `qsort()` 一样，确保比较函数考虑了被搜索数据结构的所有相关部分。\n\n`ch-general1-searchemp.c`\
  \ 展示了 `bsearch()` 的实际用法，扩展了之前使用的 `struct employee` 示例：\n\n```c\n 1  /* ch-general1-searchemp.c\
  \ --- Demonstrate bsearch(). */\n 2\n 3  #include <stdio.h>\n 4  #include <errno.h>\n\
  \ 5  #include <string.h>\n 6  #include <stdlib.h>\n 7  #include <time.h>\n 8\n 9\
  \  struct employee {\n10       char lastname[30];\n11       char firstname[30];\n\
  12       long emp_id;\n13       time_t start_date;\n14  };\n15\n 16  /* emp_id_compare\
  \ --- compare by ID */\n 17\n 18  int\n 19  emp_id_compare(const void *e1p, const\
  \ void *e2p)\n20  {\n21      const struct employee *e1, *e2;\n22\n 23      e1 =\
  \ (const struct employee *) e1p;\n24      e2 = (const struct employee *) e2p;\n\
  25\n 26      if (e1->emp_id < e2->emp_id)\n27          return -1;\n28      else\
  \ if (e1->emp_id == e2->emp_id)\n29          return 0;\n30      else\n31       \
  \   return 1;\n32  }\n 33\n 34  /* print_employee --- print an employee structure\
  \ */\n 35\n 36  void\n37  print_employee(const struct employee *emp)\n38  {\n39\
  \      printf(\"%s %s\\t%ld\\t%s\", emp->lastname, emp->firstname,\n40         \
  \     emp->emp_id, ctime(& emp->start_date));\n41  }\n```\n\n第 9–14 行定义了 `struct\
  \ employee`；它与之前相同。第 18–32 行作为 `qsort()` 和 `bsearch()` 的比较函数。它只根据员工 ID 编号进行比较。第\
  \ 36–41 行定义了 `print_employee()`，这是一个用于打印结构的方便函数，因为该操作在多处被调用。代码继续如下：\n\n```c\n 43\
  \  /* main --- demonstrate sorting */\n 44\n 45  int\n 46  main(int argc, char **argv)\n\
  \ 47  {\n 48  #define NPRES 20\n 49      struct employee presidents[NPRES];\n 50\
  \      int i, npres;\n 51      char buf[BUFSIZ];\n 52      struct employee *the_pres;\n\
  \ 53      struct employee key;\n 54      int id;\n 55      FILE *fp;\n 56\n 57 \
  \     if (argc != 2) {\n 58          fprintf(stderr, \"usage: %s datafile\\n\",\
