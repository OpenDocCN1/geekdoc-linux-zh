  \n## 4.4 执行输入和输出\n\nLinux 中的所有 I/O 都是通过文件描述符（file descriptors）完成的。节介绍了文件描述符，描述了如何获取和释放它们，并解释了如何使用它们进行\
  \ I/O。\n\n### 4.4.1 理解文件描述符\n\n文件描述符是一个整数值。有效的文件描述符从 `0` 开始，直到某个系统定义的限制。这些整数实际上是每个进程打开文件表的简单索引。（该表在操作系统内部维护；运行中的程序无法访问。）在大多数现代系统中，该表很大。`ulimit\
  \ -n` 命令打印该值：\n\n```\n$ ulimit -n\n1024\n```\n\n在 C 中，通过 `getdtablesize()`（获取描述符表大小）函数返回打开文件的最大数量：\n\
  \n```c\n#include <unistd.h>                                          Common\n\n\
  int getdtablesize(void);\n```\n\n这个小型程序打印了函数的结果：\n\n```c\n/* ch-fileio-maxfds.c\
  \ --- Demonstrate getdtablesize(). */\n\n#include <stdio.h>      /* for fprintf(),\
  \ stderr, BUFSIZ */\n#include <stdlib.h>     /* for exit() */\n#include <unistd.h>\
  \     /* for getdtablesize() */\n\nint\nmain(int argc, char **argv)\n{\n    printf(\"\
  max fds: %d\\n\", getdtablesize());\n    exit(EXIT_SUCCESS);\n}\n```\n\n编译并运行程序后，意料之中程序打印出与\
  \ `ulimit` 相同的值：\n\n```\n$ ch-fileio-maxfds\nmax fds: 1024\n```\n\n文件描述符存储在普通的 `int`\
  \ 变量中；通常会看到形式如 `int fd` 的声明，用于 I/O 系统调用。文件描述符没有预定义的类型。\n\n在通常情况下，每个程序在运行时已经为它打开了三个文件描述符。这些它们是标准输入、标准输出和标准错误，分别对应文件描述符\
  \ `0`、`1` 和 `2`。（如果没有其他重定向，每一个都连接到你的键盘和屏幕。）\n\n### 4.4.2 打开和关闭文件\n\n新的文件描述符（以及其他来源）是从\
  \ `open()` 系统调用获取的。该系统调用打开一个文件用于读写，并返回一个新的文件描述符以供对该文件进行后续操作。我们之前见过它的声明：\n\n```c\n\
  #include <sys/types.h>                                           POSIX\n#include\
  \ <sys/stat.h>\n#include <fcntl.h>\n#include <unistd.h>\n\nint open(const char *pathname,\
  \ int flags, mode_t mode);\n```\n\n这三个参数如下：\n\n* `const char *pathname`: 一个 C 字符串，表示要打开的文件名。\n\
  * `int flags`: `<fcntl.h>` 中定义的一个或多个常量的位或运算结果。我们稍后会描述它们。\n* `mode_t mode`: 正在创建的文件的权限模式。这将在章节后面的部分讨论；请参见第\
  \ 4.6 节“创建文件]第 101 页。打开现有文件时，省略此参数。\n\n`open()` 是少数几个变参（variadic）系统调用之一——即接受可变参数的系统调用。\n\
  \n`open()` 的返回值是新的文件描述符，或者是 `–1` 表示错误，在这种情况下 `errno` 将被设置。对于简单的 I/O，`flags` 参数应该是表\
  \ 4.3 中的值之一。\n\n| 符号常量 | 值 | 含义 |\n| :--- | :--- | :--- |\n| `O_RDONLY` | `0` |\
  \ 仅只读打开文件；写入将失败。 |\n| `O_WRONLY` | `1` | 仅只写打开文件；读取将失败。 |\n| `O_RDWR` | `2` | 以读写打开文件。\
  \ |\n\n**表 4.3：** `open()` 的标志位值\n\n我们稍后将在第 4.6 节“创建文件”]第 101 页中看到。`flags` 稍后会描述。\n\
  \n`close()` 系统调用关闭一个文件：它在系统表中的项被标记为未使用。\n\n```c\n#include <unistd.h>\n\nint close(int\
  \ fd);\n```\n\n成功时返回 `0`，错误时返回 `–1`。发生错误除了报告它外你做不了什么。\n\n在 C 的许多方面，这里应该应用经验和判断。\n\
  \n正如提到的，打开文件的数量虽然很大但是有限的，当你完成工作后应该关闭文件。如果你不，最终将耗尽文件描述符，这种情况会导致你的程序健壮性降低。\n\n系统在进程退出时会关闭所有打开的文件，但除了\
  \ `0`、`1` 和 `2` 之外，依赖这一点是不良好的。\n\n当 `open()` 返回一个新的文件描述符时，它总是返回最小的未使用值。*总是*。因此，如果打开了描述符\
  \ 0-6 且程序关闭了描述符 `5`，那么下次调用 `open()` 将返回 `5`，而不是 `7`。这种行为非常重要；我们稍后的书中看到它是如何干净地实现许多\
  \ Unix 特性的，例如 I/O 重定向和管道。\n\n#### 4.4.2.1 将 `FILE *` 变量映射到文件描述符\n\n标准 I/O 库函数和来自\
  \ `<stdio.h>` 的 `FILE *` 变量（如 `stdin`、`stdout` 和 `stderr`）是基于文件描述符的系统调用构建的。\n\n\
  有时为了执行未定义标准的操作，直接访问与 `<stdio.h>` 文件指针相关的描述符是有用的。`fileno()` 函数返回底层的文件描述符：\n\n```c\n\
  #include <stdio.h>                                        POSIX\n\nint fileno(FILE\
  \ *stream);\n```\n\n我们稍后将在第 4.4.4 节“示例：Unix `cat`”第 94 页中看到一个示例。\n\n#### 4.4.2.2\
  \ 关闭所有打开的文件\n\n\n\n\n打开的文件会被子进程从父进程继承。它们在实际上是`共享`的。特别是，文件位置是共享的。我们将细节留到以后在第 9.1.1.2\
  \ 节“文件描述符共享”以及第 277 页讨论。\n\n由于程序可以继承打开的文件，你偶尔会看到程序关闭其所有文件，以便从一个“干净的状态”开始。特别是，像这样的代码是典型的：\n\
  \n```c\nint i;\n\n/* leave 0, 1, and 2 alone */\nfor (i = 3; i < getdtablesize();\
  \ i++)\n    (void) close(i);\n```\n\n假设 `getdtablesize()` 的结果是 1,024。这段代码可以工作，但它导致了\
  \ (1,024 − 3) * 2 = 2,042 次系统调用。其中 1,020 次是多余，因为 `getdtablesize()` 的返回值不会改变。这里是编写这段代码更好的方法：\n\
  \n```c\nint i, fds;\n\nfor (i = 3, fds = getdtablesize(); i < fds; i++)\n    (void)\
  \ close(i);\n```\n\n这种优化不会影响代码的可读性，但它可以产生影响，特别是在较慢的系统上。通常情况下，值得寻找循环重复计算相同结果的情况，看看这种计算是否可以提取到循环之外。尽管如此，在所有此类情况下，请确保你\
  \ (a) 保持代码的正确性以及 (b) 保持其可读性！\n\n我们将 `close()` 的返回值强制转换为 `void`，因为在这种情况下我们并不关心它，正如我们早些时候在第\
  \ 4.4.2 节“打开和关闭文件”以及第 88 页中提到的那样。事实上，在这种特定情况下，大多数文件描述符可能并不是打开的，因此 `close()` 失败的次数可能比成功的次数多。\n\
  \n### 4.4.3 读取和写入\n\nI/O 分别通过 `read()` 和 `write()` 系统调用完成：\n\n```c\n#include <sys/types.h>\
  \                                               POSIX\n#include <sys/stat.h>\n#include\
  \ <fcntl.h>\n#include <unistd.h>\n\nssize_t read(int fd, void *buf, size_t count);\n\
  ssize_t write(int fd, const void *buf, size_t count);\n```\n\n每个函数都尽可能简单。参数是打开文件的文件描述符、指向用于读取数据到缓冲区或从缓冲区写入数据的缓冲区指针，以及要读取或写入的字节数。\n\
  \n返回值是实际读取或写入的字节数。（这个数字可能小于请求的数量：对于读取操作，当文件中剩余字节数少于 `count` 时会发生这种情况；对于写入操作，如果磁盘满了或发生了其他错误，也会发生这种情况。）如果发生错误，返回值为\
  \ `-1`，此时 `errno` 指明错误。当 `read()` 返回 `0` 时，意味着到达文件末尾。\n\n我们现在可以显示 `ch-fileio-cat`\
  \ 的剩余代码。`process()` 例程在输入文件名为 `\"-\"` 时使用 `0`，代表标准输入（第 50 行和 51 行）。否则，它打开给的文件：\n\
  \n```c\n36  /*\n37   * process --- do something with the file, in this case,\n38\
  \   *             send it to stdout (fd 1).\n39   *             Returns 0 if all\
  \ OK, 1 otherwise.\n40   */\n41\n42  int\n43  process(char *file)\n44  {\n45   \
  \   int fd;\n46      ssize_t rcount, wcount;\n47      char buffer[BUFSIZ];\n48 \
  \     int errors = 0;\n49\n50      if (strcmp(file, \"-\") == 0)\n51          fd\
  \ = 0;\n52      else if ((fd = open(file, O_RDONLY)) < 0) {\n53          fprintf(stderr,\
  \ \"%s: %s: cannot open for reading: %s\\n\",\n54                  myname, file,\
  \ strerror(errno));\n55          return 1;\n56      }\n```\n\n缓冲区 `buffer`（第 47\
  \ 行）的大小为 `BUFSIZ`；该常量由 `<stdio.h>` 定义，是 I/O 的合理的块大小。尽管 `BUFSIZ` 的值在不同系统间不同，但使用此常量的代码是整洁且可移植的。\n\
  \n例程的核心是以下循环，它重复读取数据，直到遇到文件末尾或错误：\n\n```c\n58      while ((rcount = read(fd, buffer,\
  \ sizeof buffer)) > 0) {\n59          wcount = write(1, buffer, rcount);\n60   \
  \       if (wcount != rcount) {\n61              fprintf(stderr, \"%s: %s: write\
  \ error: %s\\n\",\n62                      myname, file, strerror(errno));\n63 \
  \             errors++;\n64              break;\n65          }\n66      }\n```\n\
  \n写入数据的尝试只在 `read()` 的返回值（在 `rcount` 中）大于 0 时发生——也就是说，只有当我们知道缓冲区中确实有数据要输出时才会发生。\n\
  \n`rcount` 和 `wcount` 变量（第 46 行）类型为 `ssize_t`，“有符号 `size_t`”，允许它们持有负值。注意传递给 `write()`\
  \ 的计数值是 `read()` 的返回值（第 59 行）。虽然我们想读取固定大小的 `BUFSIZ` 块，但文件本身可能是 `BUFSIZ` 字节的倍数。当从文件中读取最后的较小块时，返回值表示\
  \ `buffer` 有多少字节接收了新数据。只有这些字节应该复制到标准输出，而不是整个缓冲区。\n\n第 60 行的测试 `wcount != rcount`\
  \ 是检查写入错误的正确方法；\n\n```c\n68      if (rcount < 0) {\n69          fprintf(stderr,\
  \ \"%s: %s: read error: %s\\n\",\n70                  myname, file, strerror(errno));\n\
  71              errors++;\n72      }\n73\n74      if (fd != 0) {\n75          if\
  \ (close(fd) < 0) {\n76              fprintf(stderr, \"%s: %s: close error: %s\\\
  n\",\n77                  myname, file, strerror(errno));\n78              errors++;\n\
  79          }\n80      }\n81\n82      return (errors != 0);\n83  }\n```\n\n`ch-fileio-cat`\
  \ 检查每个系统调用是否存在错误。虽然这很麻烦，但它提供了健壮性（至少是清晰度）：当出现问题时，`ch-fileio-cat` 会打印尽可能具体的错误信息。`errno`\
  \ 和 `strerror()` 的结合使得这很容易。`ch-fileio-cat` 就此结束——只有 83 行代码！\n\n总结一下，关于 I/O 有几点需要理解：\n\
  \n- **I/O 是无定义的**：I/O 系统调用仅仅移动字节。它们不对数据进行任何解释；所有解释都由用户程序完成。这使得读取写入二进制结构与读取文本行一样简单（实际上更容易，尽管使用二进制数据引入了移植性问题）。\n\
  - **I/O 是灵活的**：你可以一次读取或写入任意数量的字节。你甚至可以一个字节字节地读取和写入数据，尽管对于大量数据这样做比分大块处理开销更大。\n- **I/O\
  \ 是简单的**：三值返回值（负表示错误，零表示文件末尾，正表示计数）使得编程变得直观且明显。\n- **I/O 可能是部分的**：`read()` 和 `write()`\
  \ 传输的字节数可能小于请求的数量。应用程序代码（即*你的*代码）必须意识到这一点。\n\n#### 4.4.4 示例：Unix `cat`\n\n正如承诺的，这里是\
  \ V7 版本的 `cat`。(3) 它首先检查选项。V7 `cat` 接受单个选项 `-u` 用于无缓冲输出。\n\n^(3) 查看 V7 发行版中的 `/usr/src/cmd/cat.c`。副本包含本书的\
  \ GitHub 仓库中。该程序在 GNU/Linux 下无需更改即可编译。\n\n\n\n\n其基本设计与上面所示相似；它遍历由命令行参数命名的文件，并一次一个字符地读取每个文件，将字符发送到标准输出。与我们之前的版本不同，它使用了\
  \ `<stdio.h>` 设施。在许多方面，使用标准 I/O 库的代码更容易读和写，因为所有的缓冲问题都由库隐藏了：\n\n```\n 1  /*\n 2 \
  \  * 合并文件。\n 3   */\n 4\n 5  #include <stdio.h>\n 6  #include <sys/types.h>\n 7\
  \  #include <sys/stat.h>\n 8\n 9  char    stdbuf[BUFSIZ];\n10\n11  main(argc, argv)\
  \                           int main(int argc, char **argv)\n12  char **argv;\n\
  13  {\n14      int fflg = 0;\n15      register FILE *fi;\n16      register c;  \
  \                          register int c;\n17      int dev, ino = -1;\n18     \
  \ struct stat statb;\n19\n20      setbuf(stdout, stdbuf);\n21      for(; argc>1\
  \ && argv[1][0]=='-'; argc--,argv++) {\n22          switch(argv[1][1]) {       \
  \        处理选项\n23          case 0:\n24              break;\n25          case 'u':\n\
  26              setbuf(stdout, (char *)NULL);\n27              continue;\n28   \
  \       }\n29          break;\n30      }\n31      fstat(fileno(stdout), &statb);\
  \         第 5 章解释第 31–36 行\n32      statb.st_mode &= S_IFMT;\n33      if (statb.st_mode!=S_IFCHR\
  \ && statb.st_mode!=S_IFBLK) {\n34          dev = statb.st_dev;\n35          ino\
  \ = statb.st_ino;\n36      }\n37      if (argc < 2) {\n38          argc = 2;\n39\
  \          fflg++;\n40      }\n41      while (--argc > 0) {                   遍历文件\n\
  42          if (fflg || (*++argv)[0]=='-' && (*argv)[1]=='\\0')\n43            \
  \  fi = stdin;\n44          else {\n45              if ((fi = fopen(*argv, \"r\"\
  )) == NULL) {\n46                  fprintf(stderr, \"cat: can't open %s\\n\", *argv);\n\
  47                  continue;\n48              }\n49          }\n50          fstat(fileno(fi),\
  \ &statb);         第 5 章解释第 50–56 行\n51          if (statb.st_dev==dev && statb.st_ino==ino)\
  \ {\n52              fprintf(stderr, \"cat: input %s is output\\n\",\n53       \
  \          fflg?\"-\": *argv);\n54              fclose(fi);\n55              continue;\n\
  56          }\n57          while ((c = getc(fi)) != EOF)      将文件内容拷贝到 stdout\n\
  58              putchar(c);\n59          if (fi!=stdin)\n60              fclose(fi);\n\
  61      }\n62      return(0);\n63  }\n```\n\n值得注意的是，程序总是成功退出（第 62 行）；本可以写成记录错误并在\
  \ `main()` 的返回值中指示它们。（进程退出的机制以及不同退出状态值的含义将在 第 9.1.5.1 节 中的“定义进程退出状态”以及 第 289 页 中讨论。）\n\
  \n处理 `struct stat` 和 `fstat()` 函数的代码（第 31–36 行和 50–56 行）无疑是晦涩的，因为我们还没有介绍这些函数，直到下一章才会介绍。（但注意第\
  \ 50 行使用了 `fileno()` 来获取与 `FILE *` 变量关联的底层文件描述符。）这段代码背后的思想是确保没有输入文件与输出文件相同。这样做是为了防止文件无限增长，以防出现如下命令：\n\
  \n```\n$ cat myfile >> myfile         将 myfile 的一个副本追加到自身？\n```\n\n事实上，该检查是有效的：\n\
  \n```\n$ echo hi > myfile            创建一个文件\n$ v7cat myfile >> myfile      尝试将其追加到自身\n\
  cat: input myfile is output\n```\n\n如果你用 `ch-fileio-cat` 尝试这样做，它将一直运行，`myfile` 将一直增长，直到你中断它。GNU\
  \ 版本的 `cat` 确实执行了该检查。请注意，以下内容是 `cat` 无法的：\n\n```\n$ v7cat < myfile > myfile\ncat:\
  \ input - is output\n$ ls -l myfile\n-rw-r--r--    1 arnold   devel          0 Mar\
  \ 24 14:17 myfile\n```\n\n在这种情况下，已经太晚了，因为 shell 在 `cat` 有机会检查文件之前就已经通过 `>` 操作符截断了\
  \ `myfile`！\n\n第 5.4.2 节“检索文件信息”、 第 131 页 解释了 `struct stat` 和与其相关的系统调用。在第 5.4.4.2\
  \ 节“重温 V7 cat”、 第 140 页 中，我们回顾了 V7 `cat.c` 的第 31–36 行和 50–56 行如何使用 `stat` 结构和相关的系统调用。\n\
  \n### 4.5 随机访问：在文件中移动\n\n到为止，我们讨论了顺序 I/O，即从文件开头开始读取或写入，直到结束。通常这就是程序所需要做的。然而，进行随机访问\
  \ I/O 是可能的——即从文件的任意位置读取数据，而无需先读取该位置之前的所有内容。\n\n文件描述符的*偏移量*（offset）是打开文件中下一次读取或写入发生的位置。程序通过\
  \ `lseek()` 系统调用设置偏移量：\n\n```\n#include <sys/types.h>      /* 用于 off_t */      \
  \                  POSIX\n#include <unistd.h>         /*  lseek() 和 whence 值 */\n\
  \noff_t lseek(int fd, off_t offset, int whence);\n```\n\n类型 `off_t`（偏移类型）是一种带符号整数类型，表示文件内的字节位置（从开始的偏移量）。在\
  \ 32 位系统上，该类型通常是 `long`。然而，许多现代系统允许非常大的文件，在这种情况下 `off_t` 可能是一个更不常的类型，例如 C99 `int64_t`\
  \ 或其他扩展类型。`lseek()` 取三个参数，如下：\n\n*   `int fd`\n    打开的文件的描述符。\n\n*   `off_t offset`\n\
  \    要移动到的位置。此值的解释取决于 `whence` 参数。`offset` 可以是正值或负值：负值向文件开头移动；正值向文件末尾移动。\n\n*  \
  \ `int whence`\n    描述 `offset` 相对于文件中的哪个位置。参见表 4.4。\n\n| 符号常量 | 值 | 含义 |\n| ---\
  \ | --- | --- |\n| `SEEK_SET` | `0` | `offset` 是绝对的，即相对于文件开头。 |\n| `SEEK_CUR` |\
  \ `1` | `offset` 相对于文件中的当前位置。 |\n| `SEEK_END` | `2` | `offset` 相对于文件的末尾。 |\n\n**表\
  \ 4.4：** `lseek()` 的 `whence` 值\n\n许多旧代码使用了表 4.4 所示的数值。然而，你编写的任何新代码都应该使用符号值，其含义更清晰。\n\
  \n这些值的含义及其对文件位置的影响在图 4.1 所示。假设文件有 3000 个字节，在每次调用 `lseek()` 之前当前偏移量为 2000，每次调用后的新位置所示。\n\
  \n![Images](img/fig4-001.jpg)\n\n**图 4.1：** `lseek()` 的偏移量\n\n相对于文件开头的负偏移量没有意义；它们会因“无效参数”错误失败。\n\
  \n返回值是文件中的新位置。因此，为了找到你在文件的哪个位置，请使用以下：\n\n```\noff_t curpos;\n...\ncurpos = lseek(fd,\
  \ (off_t) 0, SEEK_CUR);\n```\n\n`lseek()` 中的 `l` 代表 `long`。`lseek()` 是在 V7 Unix\
  \ 扩展文件大时引入的；V6 有一个简单的 `seek()` 系统调用。因此，许多旧文档（和代码）将 `offset` 参数视为 `long` 类型，并且没有转换为\
  \ `off_t`，因此在常量偏移量值上看到 `L` 后缀并不罕见：\n\n```\ncurpos = lseek(fd, 0L, SEEK_CUR);\n```\n\
  \n在具有标准 C 编译器的系统中，由于 `lseek()` 带有原型进行声明，此类旧代码仍然可以工作，因为编译器会自动将 `0L` 从 `long` 提升为\
  \ `off_t`（如果它们类型不同）。\n\n\n\n\n\n`lseek()` 的一个有趣且重要的方面是，它可以跳转到文件末尾之外。随后在该点写入的任何数据都会进入文件，但在文件之前结束的数据与新数据之间会产生一个“间隙”或“洞”。间隙中的数据读取起来就像全是零一样。\n\
  \n下面的程序演示了“洞”的创建。它在文件的开头、中间和远端写入了三个 `struct` 实例。所选偏移量（第 16–18 行，每个结构体的第三个元素）是任意的，但足够大以演示这一点：\n\
  \n```c\n 1  /* ch-fileio-holes.c --- Demonstrate lseek() and holes in files. */\n\
  \ 2\n 3  #include <stdio.h>      /* for fprintf(), stderr, BUFSIZ */\n 4  #include\
  \ <errno.h>      /* declare errno */\n 5  #include <fcntl.h>      /* for flags for\
  \ open() */\n 6  #include <string.h>     /* declare strerror() */\n 7  #include\
  \ <unistd.h>     /* for ssize_t */\n 8  #include <sys/types.h>  /* for off_t, etc.\
  \ */\n 9  #include <sys/stat.h>   /* for mode_t */\n10\n11  struct person {\n12\
  \      char name[10];      /* first name */\n13      char id[10];        /* ID number\
  \ */\n14      off_t pos;          /* position in file, for demonstration */\n15\
  \  } people[] = {\n16      { \"arnold\", \"123456789\", 0 },\n17      { \"miriam\"\
  , \"987654321\", 10240 },\n18      { \"joe\",    \"192837465\", 81920 },\n19  };\n\
  20\n21  int\n22  main(int argc, char **argv)\n23  {\n24      int fd;\n25      int\
  \ i, j;\n26\n27      if (argc < 2) {\n28          fprintf(stderr, \"usage: %s file\\\
  n\", argv[0]);\n29          return 1;\n30      }\n31\n32      fd = open(argv[1],\
  \ O_RDWR|O_CREAT|O_TRUNC, 0666);\n33      if (fd < 0) {\n34          fprintf(stderr,\
  \ \"%s: %s: cannot open for read/write: %s\\n\",\n35                  argv[0], argv[1],\
  \ strerror(errno));\n36          return 1;\n37      }\n38\n39      j = sizeof(people)\
  \ / sizeof(people[0]);    /* count of elements */\n```\n\n第 27–30 行确保程序被正确调用。第 32–37\
  \ 行打开命名的文件并验证打开是否成功。`open()` 的参数和标志将在下一节讨论。\n\n第 39 行中 `j`（数组元素计数）的计算使用了一个巧妙且可移植的技巧：元素数量等于整个数组的大小除以第一个元素的大小。这种惯用法的美妙之处在于它总是正确的——无论你向此类数组添加或删除多少元素，编译器都会计算出来。它也不需要哨兵\
  \ `sentinel` 元素——即一个所有字段都设置为零、`NULL` 或类似的元素。\n\n工作由一个循环完成（第 41–55 行），该循环跳转到每个结构体中给出的字节偏移量（第\
  \ 42 行），然后写入结构体（第 49 行）：\n\n```c\n41      for (i = 0; i < j; i++) {\n42        \
  \  if (lseek(fd, people[i].pos, SEEK_SET) < 0) {\n43              fprintf(stderr,\
  \ \"%s: %s: seek error: %s\\n\",\n44                  argv[0], argv[1], strerror(errno));\n\
  45              (void) close(fd);\n46              return 1;\n47          }\n48\n\
  49          if (write(fd, &people[i], sizeof(people[i])) != sizeof(people[i])) {\n\
  50              fprintf(stderr, \"%s: %s: write error: %s\\n\",\n51            \
  \      argv[0], argv[1], strerror(errno));\n52              (void) close(fd);\n\
  53              return 1;\n54          }\n55      }\n56      /* all ok here */\n\
  57      (void) close(fd);\n58      return 0;\n59  }\n```\n\n以下是程序运行时的结果：\n\n```bash\n\
  $ ch-fileio-holes peoplelist\n$ ls -ls peoplelist\n-rw-r-- 1 user arnold 81952 May\
  \ 25\n-rw-r-- 1 user miriam 10240 May 25\n-rw-r-- 1 user joe    81920 May 25\n4096\
  \ | bc -l               Show blocks if no holes\n$ echo 81952 20000000\n```\n\n\
  我们恰好知道文件中的每个磁盘块使用 4096 字节。（我们如何知道这一点将在 5.4 节讨论。现在先假设它是如此。）最后的 `bc` 命令表明，大小为 81952\
  \ 字节的文件需要 21 个块。然而，`ls` 的 `-s` 选项（告诉我们文件实际使用了多少块）显示它只使用了 12 个块！文件中缺失的块就是“洞”。这如图\
  \ 4.2 所示。\n\n**图 4.2:** 文件中的洞\n\n**注意**\n\n`ch-fileio-holes.c` 执行了直接 I/O。这很好地说明了随机访问的美妙：你可以将磁盘视为一个巨大的结构体数组。在实践中，使用二进制\
  \ I/O 存储活动数据是一个你应该仔细考虑的设计决策。忽略此类问题可能会变得非常昂贵，因为以后可能需要转换你的原始代码。\n\n### 4.6 创建文件\n\n\
  如之前所述，`open()` 显然只打开现有文件。本节描述了如何创建全新的文件。有两种选择：`creat()` 和带有附加标志的 `open()`。最初，`creat()`\
  \ 是创建文件的唯一方法，但 `open()` 后来也增加了这一功能。两种机制都需要指定初始文件权限。\n\n#### 4.6.1 指定初始文件权限\n\n作为\
  \ GNU/Linux 用户，你熟悉 `ls -l` 打印的文件权限：用户（文件所有者）、组和其他的读、写和执行权限。各种组合通常用八进制表示，特别是对于 `chmod`\
  \ 和 `umask` 命令。例如，文件权限 `-rw-r--` 等于八进制的 `0644`，`-rwxr-xr-x` 等于八进制的 `0755`。（开头的 `0`\
  \ 是 C 语言中八进制值的表示法。）\n\n| 符号常量 | 值 | 含义 |\n| --- | --- | --- |\n| `S_IRWU` | `00700`\
  \ | 用户读、写、执行权限。 |\n| `S_IRUSR` | `00400` | 用户读权限。 |\n| `S_IREAD` | | 与 `S_IRUSR`\
  \ 相同。 |\n| `S_IWUSR` | `00200` | 用户写权限。 |\n| `S_IWRITE` | | 与 `S_IWUSR` 相同。 |\n\
  | `S_IXUSR` | `00100` | 用户执行权限。 |\n| `S_IEXEC` | | 与 `S_IXUSR` 相同。 |\n| `S_IRWXG`\
  \ | `00070` | 组读、写、执行权限。 |\n| `S_IRGRP` | `00040` | 组读权限。 |\n| `S_IWGRP` | `00020`\
  \ | 组写权限。 |\n| `S_IXGRP` | `00010` | 组执行权限。 |\n| `S_IRWXO` | `00007` | 其他读、写、执行权限。\
  \ |\n| `S_IROTH` | `00004` | 其他读权限。 |\n| `S_IWOTH` | `00002` | 其他写权限。 |\n| `S_IXOTH`\
  \ | `00001` | 其他执行权限。 |\n\n**表 4.5:** 文件模式 POSIX 符号常量\n\n下面的片段显示了如何创建表示权限 `-rw-r--r--`\
  \ 和 `-rwxr-xr-x`（分别为 `0644` 和 `0755`）的变量：\n\n```c\nmode_t rw_mode, rwx_mode;\n\n\
  rw_mode = S_IRUSR | S_IWUSR | S_IRGRP | S_IROTH;               /* 0644 */\nrwx_mode\
  \ = S_IRWXU | S_IRGRP | S_IXGRP | S_IROTH | S_IXOTH;    /* 0755 */\n```\n\n旧代码使用\
  \ `S_IREAD`、`S_IWRITE` 和 `S_IEXEC` 结合位移来产生相同的结果：\n\n\n\n\n\n```\nmode_t rw_mode,\
  \ rwx_mode;\n\nrw_mode  = (S_IREAD|S_IWRITE) | (S_IREAD >> 3) | (S_IREAD >> 6);\
  \ /* 0644 */\nrwx_mode = (S_IREAD|S_IWRITE|S_IEXEC) |\n           ((S_IREAD|S_IEXEC)\
  \ >> 3) | ((S_IREAD|S_IEXEC) >> 6);  /* 0755 */\n```\n\n遗憾的是，这两种表示法都不直观。现代版本更受青，因为每个权限位都有自己的名称，而且进行位操作出错的机会较少。\n\
  \n表 4.6 中显示的额外权限位可以在更改文件权限时使用，但在初始创建文件时不应使用它们。这些位是否可以包含取决于操作系统，且差异很大。最好的方法不要尝试；相反，你应该在文件创建后显式地更改权限。（更改权限描述参见第\
  \ 5.6.2 节“更改权限：`chmod()` 和 `fchmod()`”，“第 147 页。”这些位的含义在第 11 章“权限与用户 ID 和组 ID 数字”，“第\
  \ 383 页。”）\n\n| **符号常量** | **值** | **含义** |\n\n| --- | --- | --- |\n| `S_ISUID`\
  \ | `04000` | 设置用户 ID。 |\n| `S_ISGID` | `02000` | 设置组 ID。 |\n| `S_ISVTX` | `01000`\
  \ | 保存粘位。 |\n\n**表 4.6:** 用于文件模式的额外 POSIX 符号常量\n\n### 4.6.2 使用 `umask()` 控制默认权限\n\
  \n当标准工具创建文件时，它们使用的默认权限是 `-rw-rw-rw-`（或 `0666`）。由于大多数用户倾向于避免文件所有人可写，每个进程都携带一个 `umask`。`umask`\
  \ 是一组权限位，表示在创建新文件时永远不允许的位。（更改权限时不使用 `umask`。）从概念上讲，发生的操作是\n\n```\nactual_permissions\
  \ = (requested_permissions & (~umask));\n```\n\n`umask` 通常在登录时通过 `$HOME/.profile`\
  \ 中的 `umask` 命令设置。在 C 程序中，它通过 `umask()` 系统调用进行设置：\n\n```c\n#include <sys/types.h>\
  \                                       POSIX\n#include <sys/stat.h>\n\nmode_t umask(mode_t\
  \ mask);\n```\n\n返回旧的 `umask`。因此，要确定当前掩码，你必须将其设置为一个值然后重置（或根据需要更改）：\n\n```c\nmode_t\
  \ mask = umask(0);          /* 获取当前掩码 */\n(void) umask(mask);              /* 恢复它\
  \ */\n```\n\n以下是 `umask` 在 shell 层面的运行示例：\n\n```bash\n$ umask                  \
  \                 显示当前掩码\n0022\n$ touch newfile                           创建一个文件\n\
  $ ls -l newfile                           显示新文件的权限\n-rw-r--r--    1 arnold   devel\
  \         0 Mar 24 15:43 newfile\n$ umask 0                                 将掩码置为空\n\
  $ touch newfile2                          创建第二个文件\n$ ls -l newfile2            \
  \              显示新文件的权限\n-rw-rw-rw-    1 arnold   devel         0 Mar 24 15:44 newfile2\n\
  ```\n\n### 4.6.3 使用 `creat()` 创建文件\n\n`creat()` 系统调用创建新文件。它的声明如下：\n\n是的，它就是这样拼写的。Unix\
  \ 的两位“之父”之一 Ken Thompson 曾被问及如果重来一次，他会做什么改变。他回答说他会用“e”来写 `creat()`。事实上，他在为 *Plan\
  \ 9 from Bell Labs* 操作系统时正是这么做的。\n\n```c\n#include <sys/types.h>               \
  \                           POSIX\n#include <sys/stat.h>\n#include <fcntl.h>\n\n\
  int creat(const char *pathname, mode_t mode);\n```\n\n`mode` 参数代表新文件的权限（如上一节所述）。由\
  \ `pathname` 指定的文件将被创建，其权限根据 `umask` 进行了修改。它以写入（仅写）模式打开，返回值是新文件的文件描述符，如果出现问题则返回\
  \ `-1`。在这种情况下，`errno` 指明错误。如果文件已存在，它在打开时会被截断。\n\n在所有其他方面，`creat()` 返回的文件描述符与 `open()`\
  \ 返回的相同；它们被用于写入和寻道，并且必须关闭。\n\n### 4.6.4 重新回顾 `open()`\n\n`open()` 函数定义为：\n\n```c\n\
  int open(const char *pathname, int flags);\n```\n\n之前我们说，从概念上讲，`creat()` 可以很容易地编写：\n\
  \n```c\nint creat(const char *pathname, mode_t mode)\n{\n    return open(path, O_CREAT|O_WRONLY|O_TRUNC,\
  \ mode);\n}\n```\n\n（事实上，POSIX 标准规定 `creat()` 的行为应当恰好像那样实现的！）\n\n`open()` 可以配合各种标志来控制其行为。表\
  \ 4.7  own 了 `open()` 的额外标志：\n\n| **标志** | **含义** |\n| --- | --- |\n| `O_APPEND`\
  \ | 强制所有写入发生在文件末尾。 |\n| `O_CREAT` | 如果文件不存在则创建它。 |\n| `O_EXCL` | 与 `O_CREAT` 使用时，如果文件存在则导致\
  \ `open()` 失败。 |\n| `O_TRUNC` | 将文件截断为零长度。 |\n\n注意，这里*不会*使用 `O_EXCL` 标志，因为对于 `>`\
  \ 和 `>>`，文件存在并不是错误。\n\n现代系统提供了具有特殊用途的额外标志。表 4.8 简要描述了它们。\n\n| **标志** | **含义** |\n\
  | --- | --- |\n| `O_CLOEXEC` | 为返回的文件描述符设置“执行时关闭”标志（参见第 9.4.3.1 节“执行时关闭和分叉时关闭标志”，“第\
  \ 316 页。”）。 |\n| `O_CLOFORK` | 为返回的文件描述符设置“分叉时关闭”标志（参见第 9.4.3.1 节“执行时关闭和分叉时关闭标志”，“第\
  \ 316 页。”）。 |\n| `O_DIRECTORY` | 如果指定的文件不是目录则失败。 |\n| `O_EXEC` | 仅以执行模式打开。参见第 9.1.4\
  \ 节中对 `fexecve()` 的讨论，“启动新程序：`exec()` 族](#ch09.xhtml_ch09lev2sec4)”，“第 283 页。”。在\
  \ GNU/Linux 上，使用 Linux 特有的 `O_PATH` 代替 `O_EXEC`。 |\n\n\n\n\n| `O_NOCTTY` | 如果打开的设备是终端，则不成为进程的控制终端。（这是一个更高级的话题，将在第\
  \ 9.2 节中简要讨论），控制概述） |\n| `O_NOFOLLOW` | 如果指定的文件是符号链接，则失败。 |\n| `O_NONBLOCK` | 在某些情况下禁用\
  \ I/O 操作的阻塞（参见第 9.4.3 节，“管道和 FIFO 的非阻塞 I/O），[第 320 页）） |\n| `O_SEARCH` | 仅用于搜索目录。\
  \ |\n| `O_TTY_INIT` | 如果打开的设备是终端，则将其设置为合理值。截至本文，Linux 似乎不支持此标志位。 |\n| `O_DSYNC`\
  \ | 确保写入文件的数据在 `write()` 返回之前已写入物理存储。 |\n| `O_RSYNC` | 确保 `read()` 将读取的任何已写入文件的数据在\
  \ `read()` 返回之前已写入物理存储。 |\n| `O_SYNC` | 与 `O_DSYNC` 类似，还会确保所有文件元数据（如访问时间）也已写入物理存储。\
  \ |\n\n**表 4.8：** `open()` 的附加 POSIX 标志\n\n`O_DSYNC`、`O_RSYNC` 和 `O_SYNC` 标志需要一些解释。Unix\
  \ 系统（包括 Linux）维护一个磁盘块内部缓存，称为 `buffer cache`。当 `write()` 系统调用返回时，传递给操作系统的数据已复制到 `buffer\
  \ cache` 中的缓冲区中。它并不一定写入磁盘。\n\n`buffer cache` 提供了显著的性能提升：由于磁盘 I/O 通常比 CPU 和内存操作慢一个数量或更多，如果程序必须等待每次写入完全到达磁盘，速度将大大降低。此外，如果数据最近被写入文件，那么对相同数据的后续读取将发现信息已经在\
  \ `buffer cache` 中，在那里可以立即返回，而无需等待 I/O 操作从磁盘读取它。\n\nUnix 系统还会进行预读（read-ahead）；由于大多数读取是顺序的，在读取一个块时，操作系统会多读取几个连续磁盘块，以便当程序请求它们时，其信息已经在\
  \ `buffer cache` 中。如果有多个程序正在读取同一个文件，它们都将受益，因为它们将从 `buffer cache` 中文件磁盘块的副本获取数据。\n\
  \n所有这些缓存都是极佳的，但当然没有免费的午餐。当数据在 `buffer cache` 中但在写入磁盘之前，存在一个很小但真实的窗口，灾难可能会发生发生——例如，断电。现代磁盘驱动器加剧了这个问题：许多驱动器有自己的内部缓冲区，因此数据可能已经到达驱动器，但在断电时它可能还没有到达介质！对于不在受控电力的数据中心或没有不间断电源（UPS）的小系统来说，这可能是一个问题。\n\
  \n如果你没有 UPS 且将系统用于关键工作，我们强烈建议投资一个。你还应该定期备份。笔记本系统有自己的电池，允许它们在短期停电期间继续工作，但如果无人看管，它们最终会在电量耗尽时自动关闭。\n\
  \n对于大多数应用程序，`buffer cache` 中的数据可能被意外丢失的概率是可以接受的小的。然而，对于某些应用程序来说，*任何*这种概率都是不可接受的。因此，Unix\
  \ 系统引入了*同步 I/O*的概念，使得程序可以保证，如果系统调用已返回，数据已安全地写在物理存储设备上。\n\n`O_DSYNC` 标志保证了数据完整性；数据以及操作系统查找数据所需的任何其他信息在\
  \ `write()` 返回之前都会写入磁盘。然而，元数据（如访问时间）在 `write()` 返回之前可能不会写入。`O_SYNC` 标志要求数据也写入磁盘。（这会显著影响性能。）\n\
  \n**注意**\n\nLinux 实现了 `O_SYNC` 和 `O_DSYNC`。它没有实现 `O_RSYNC` 语义，而是将其视为相同的 `O_SYNC`。此外，Linux\
  \ 定义了一些用于特殊用途的特定标志。我们将描述其中两个。\n\n### 4.7 强制数据写入磁盘\n\n之前，我们描述了 `open()` 的 `O_DSYNC`、`O_RSYNC`\
  \ 和 `O_SYNC` 标志。我们注意到使用这些标志会减慢程序，因为每次 `write()` 都必须等待数据完全到达磁盘。对于稍高的风险水平，可以通过以下两个系统调用来兼得：\n\
  \n```c\n#include <unistd.h>\n\nint fsync(int fd);                              POSIX\
  \ FSC\nint fdatasync(int fd);                          POSIX SIO\n```\n\n你可以通过 `<stdio.h>`\
  \ 文件指针使用这些调用，首先调用 `fflush()`，然后使用 `fileno()` 获取文件描述符。这里有一个 `fpsync()` 函数可以将这两个操作封装在一个调用中；成功时返回\
  \ 0：\n\n```c\nint fpsync(FILE *fp) {\n    if (fp == NULL || fflush(fp) == EOF ||\
  \ fsync(fileno(fp)) < 0)\n        return -1;\n\n    return 0;\n}\n```\n\n### 4.8\
  \ 设置文件长度\n\n两个系统调用可以调整文件的大小：\n\n```c\n#include <unistd.h>\n#include <sys/types.h>\n\
  \nint truncate(const char *path, off_t length);    POSIX XSI\nint ftruncate(int\
  \ fd, off_t length);             POSIX\n```\n\n这些函数的区别在于：`truncate()` 接受文件名参数，而\
  \ `ftruncate()` 处理打开的文件描述符。（*xxx* `()` 和 `f* *xxxx* `()` 的命名约定用于处理文件名或文件描述符的系统调用对是常见的。我们在本章及后续章节中看到了多个示例。）对于两者，`length`\
  \ 参数都是文件的新长度。\n\n\n\n此系统调用源于 4.2 BSD Unix，在早期系统中它只能用于缩短文件的长度，因此得有了这个名字。在现代系统（包括\
  \ Linux）中，这个名称是一个误称，因为通过这些调用，可以扩展文件的长度，而不仅仅是缩短文件。\n\n对于这些调用，被截断的文件必须具有写权限（对于 `truncate()`），或者已以读写模式打开（对于\
  \ `ftruncate()`）。如果文件正在被缩短，新末尾之后的所有数据都将丢失。（因此，你不能在缩短文件后又将其拉长，并期望找到原始数据。）如果文件被扩展（例如在\
  \ `lseek()` 之后写入数据），则文件旧末尾和新末尾之间的数据读取结果将为零。\n\n这些调用与 ‘`open(file, ...|O_TRUNC, mode)`’\
  \ 非常不同。后者会完全截断文件，丢弃其所有数据。而这些调用只是将文件的绝对长度设置为给定值。\n\n这些函数相当专门化；它们在整个 GNU Coreutils\
  \ 代码中总共使用了 9 次。\n\n### 4.9 总结\n\n*   当系统调用失败时，它通常返回 `–1`，并且全局变量 `errno` 被设置为一个指示问题的预定义值。可以使用\
  \ `perror()` 和 `strerror()` 函数来报告错误。\n\n*   文件是通过称为文件描述符的小型整数进行操作的。标准输入、标准输出和标准错误的文件描述符继承自程序的父进程。其他的描述符通过\
  \ `open()` 或 `creat()` 获取。它们通过 `close()` 关闭，`getdtablesize()` 返回允许的最大打开文件数。`umask`\
  \ 的值（通过 `umask()` 设置）会影响为使用 `creat()` 或 `open()` 的 `O_CREAT` 标志创建的新文件所赋予的权限。\n\n\
  *   `read()` 和 `write()` 系统调用分别读取和写入数据。它们的接口非常简单。特别地，它们对数据不进行任何解释；文件是字节的线性流。`lseek()`\
  \ 系统调用提供了随机访问 I/O：在文件内部移动的能力。\n\n*   `open()` 的额外标志提供了同步 I/O 支持，使得数据在 `write()`\
  \ 或 `read()` 返回之前已经一直到达物理存储介质。也可以通过 `fsync()` 或 `fdatasync()` 受控制地强制数据写入磁盘。\n\n\
  *   `truncate()` 和 `ftruncate()` 系统调用设置文件的绝对长度。\n\n### 练习\n\n1.  仅使用 `open()`、`read()`、`write()`\
  \ 和 `close()`，编写一个简单的 `copy` 程序，将由第一个参数命名的文件复制到由第二个参数命名的文件中。\n\n2.  增强 `copy` 程序，使其接受\
  \ `\"-\"`：作为第一个参数使用时表示“标准输入”，作为第二个参数使用时表示“标准输出”。‘`copy - -`’运行正常吗？\n\n3.  查看 GNU/Linux\
  \ 系统上的 `proc(5)` 手页，特别是 `fd` 章节。执行 `ls -l /dev/fd` 并直接检查 `/proc/self/fd` 中的文件。如果\
  \ `/dev/stdin` 等同类文件在 Unix 早期版本中存在，它们将如何简化 V7 `cat` 程序的代码？（许多其他现代 Unix 系统都有 `/dev/fd`\
  \ 目录或文件系统。如果你没有使用 GNU/Linux，请看看你关于你的 Unix 版本可以发现什么。）\n\n4.  即使你现在还不理解，也尝试将 V7 `cat.c`\
  \ 中使用 `struct stat` 和 `fstat()` 函数的代码段复制到 `ch-fileio-cat.c` 中，使其也能对 ‘`cat file >>\
  \ file`’ 报告错误。\n\n5.  （简单。）假设 `strerror()` 存在，编写你自己的 `perror()` 版本。\n\n6.  在你的系统上‘`ulimit\
  \ -n`’的结果是什么？\n\n7.  编写一个简单的 `umask` 程序版本，命名为 `myumask`，它从命令行接受一个八进制掩码。使用基数为 `8`\
  \ 的 `strtol()` 将命令行参数字符串转换为整数值。使用 `umask()` 系统调用将 umask 改为新掩码。\n\n    编译并运行 `myumask`，然后使用普通的\
  \ `umask` 命令检查 umask 的值。解释结果。（提示：在 Bash 中，输入‘`type umask`’。）\n\n8.  修改你之前编写的简单 `copy`\
  \ 程序，使用带有 `O_SYNC` 标志的 `open()`。使用 `time` 命令在大文件上比较原始版本和新版本的性能。\n\n9.  对于 `ftruncate()`，我们提到文件必须已以写模式打开。当文件本身没有写权限时，文件如何能以写模式打开呢？\n\
  \n10. 编写一个 `truncate` 程序，其用法为 ‘`truncate file length`。\n\n## 第 5 章\n\n## 目录与文件元数据\n\
  \n本章继续在学习曲线上向下一个平台：理解目录和文件信息。\n\n在本章中，我们将探索文件信息是如何存储在目录中的、目录本身如何被读取、创建和删除、可用哪些文件信息以及如何检索它们。最后，我们将探索更新文件元数据的其他方法，例如所有者、组、权限以及访问和修改时间。\n\
  \n### 5.1 考虑目录内容\n\n包括 Linux 在内的所有 Unix 系统在磁盘上存储文件信息都使用相同的概念设计。尽管设计的实现上存在很大差异，但\
  \ C 语言级别的接口保持一致，使得编写可以在许多不同系统上编译并运行的可移植程序成为可能。\n\n#### 5.1.1 定义\n\n我们从定义一些术语开始讨论：\n\
  \n*   分区 (Partition)\n\n    物理存储的单元。物理分区通常是磁盘的一部分或整个磁盘。现代系统使得从多个物理分区创建逻辑分区成为可能。\n\
  \n*   文件系统 (Filesystem)\n\n    包含文件数据和元数据的分区（物理或逻辑），即关于文件的信息（与文件内容不同，内容是文件*内部*的信息）。此类元数据包括文件所有权、权限、大小等，以及操作系统用于定位文件内容所需的信息。\n\
  \n    你通过向分区中写入标准信息，将文件系统“放置”在分区中（一对一对应关系）。这是通过用户级程序完成的，例如 GNU/Linux 上的 `mke2fs`\
  \ 或 Unix 上的 `newfs`。（Unix 的 `mkfs` 命令可以创建文件系统，但很难直接使用。`newfs` 使用正确的参数调用它。如果你的系统是\
  \ Unix 系统，请参阅 `newfs`(8) 和 `mkfs`(8) 手页获取详情。）\n\n    某些文件系统仅存在于内存中，例如用于 `/run` 和\
  \ `/proc` 的文件系统。它们的数据是瞬态的，在系统关闭时消失。\n\n    在大多数情况下，GNU/Linux 和 Unix 隐藏了文件系统和分区的存在。（更多细节请参见第\
  \ 8.1 节，“挂载和卸载文件系统”，第 221 页。）一切都通过路径名访问，而不引用文件位于哪个磁盘上。（与几乎所有其他商业操作系统，如 OpenVMS，或任何微软系统的默认行为相比。）\n\
  \n*   索引节点 (Inode)\n\n    “index node”的缩写，最初缩写为“i-node”，是一个描述文件除文件名外的所有信息的小数据块。inode\
  \ 的数量（因此每个文件系统的唯一文件数量）在文件系统创建时设置并永久化。‘`df -i`’可以告诉你你有多少 inode，以及使用了多少。\n\n*   设备\
  \ (Device)\n\n    在文件、文件系统和文件元数据的语境下，代表正在使用（已挂载）的文件系统的唯一数字。(device, inode) 节点唯一地标识一个文件：两个不同的文件保证具有不同的\
  \ (device, inode) 对。这将在本章稍后的部分详细讨论。\n\n*   目录 (Directory)\n\n\n\n\n一种特殊文件，包含一个（inode\
  \ 号，名称）对的列表。目录可以打开进行读取，但不可写入；操作系统负责对目录内容的所有更改。\n\n从概念上讲，每个磁盘块要么包含若干 inode，要么包含文件数据。每个\
  \ inode 而包含指向文件数据块的指针。请参见图 5.1。\n\n![Images](img/fig05-001.jpg)\n\n**图 5.1：** inode\
  \ 和数据块的概念视图\n\n该图显示了分区前端所有的 inode 块以及随其后的数据块。早期的 Unix 文件系统确实是这样组织的。然而，虽然所有现代系统仍然拥有\
  \ inode 和数据块，但其组织方式已经为了提高效率和健壮性发生了变化。细节随系统而异，即使在 GNU/Linux 系统中也有多种文件系统，但其概念是相同的。\n\
  \n### 5.1.2 目录内容\n\n目录建立了文件名与 inode 之间的连接。目录项包含一个 inode 号和文件名。它们还包含一些我们这里不感兴趣的额外记录信息。请参见图\
  \ 5.2。\n\n![Images](img/fig05-002.jpg)\n\n**图 5.2：** 目录的概念内容\n\n早期的 Unix 系统使用双字节\
  \ inode 号和长达 14 字节的文件名。以下是 V7 `/usr/include/sys/dir.h` 的全部内容：\n\n```\n#ifndef DIRSIZ\n\
  #define DIRSIZ  14\n#endif\nstruct direct\n{\n       ino_t   d_ino;\n       char\
  \    d_name[DIRSIZ];\n};\n```\n\n`ino_t` 在 V7 `<sys/types.h>` 中定义为 `typedef unsigned\
  \ int ino_t;`。由于 PDP-11 的 `int` 是 16 位的，因此 `ino_t` 也是。这种组织使得直接读取目录变得容易；因为条项的大小是固定的，代码非常简单。（唯一需要注意的是，完整的\
  \ 14 字符 `d_name` 并不以 NUL 终止。）\n\n目录内容的管理对系统来说也很容易。当文件从目录中删除时，系统会将 inode 号替换为二进制零，表示目录中的“槽位”是空闲的。新文件就可以重用空槽位。这有助于保持目录文件本身的大小合理。（按照惯例，inode\
  \ 号 `1` 是不使用的；inode 号 `2` 总是第一个可用的 inode。更多细节请参见侧边栏“根 inode 号”、“第 224 页](#ch08.xhtml_page_224)，以及第\
  \ 8.1.1 节中的“回顾背景”、“第 221 页](#ch08.xhtml_page_221)”。）\n\n现代系统提供长文件名。每个目录项都是变长的，目录的文件名组件常见限制为\
  \ 255 字节。稍后，我们将展示如何在现代系统上读取目录内容。在 32 位 GNU/Linux 系统上，inode 长度为 32 位，而在 64 位系统上，它是\
  \ 64 位的。（如果安装了适当的软件包，即使在 64 位系统上，你也可以使用 `gcc -m32` 构建 32 位的可执行文件。此类可执行文件的 `ino_t`\
  \ 是 32 位的，而普通的 64 位可执行文件的 `ino_t` 是 64 位的！）\n\n顺带提一下，目录的本质解释了为什么“没有此类文件或目录”的错误是\
  \ `ENOENT`：目录中没有请求文件的条目。\n\n### 5.1.3 硬链接\n\n当使用 `open()` 或 `creat()` 创建文件时，系统会找到一个未使用的\
  \ inode 并将其分配给新文件。它为文件创建目录项，其中包含文件名和 inode 号。`ls` 的 `-i` 选项显示 inode 号：\n\n```\n\
  $ echo hello, world > message                        创建新文件\n$ ls -il message   \
  \                                  同时显示 inode 号\n9438482 -rw-rw-r-- 1 arnold arnold\
  \ 13 Dec 3 21:49 message\n```\n\n由于目录项将文件名与 inode 关联，一个文件可以有多个名称。指向同一个 inode 的每个目录项被称为该文件的链接，或硬链接。链接通过\
  \ `ln` 命令创建。用法为 `ln oldfile newfile`：\n\n```\n$ ln message msg                 \
  \                    创建一个链接\n$ cat msg                                         \
  \   显示新名称的内容\nhello, world\n$ ls -il msg message                               \
  \  显示 inode 号\n9438482 -rw-rw-r-- 2 arnold arnold 13 Dec 3 21:49 message\n9438482\
  \ -rw-rw-r-- 2 arnold arnold 13 Dec 3 21:49 msg\n```\n\n输出显示两个文件的 inode 号是相同的，长格式输出中的第三字段现在是\
  \ `2`。该字段是链接计数，报告该文件有多少个链接（指向该 inode 的目录项）。\n\n这一点怎么强调都不为过：硬链接都指向同一个文件。如果你更改了其中一个文件，你就更改了其他文件：\n\
  \n```\n$ echo \"Hi, how ya doin' ?\" > msg                      通过新名称更改文件\n$ cat\
  \ message                                          通过旧名称显示内容\nHi, how ya doin' ?\n\
  $ ls -il message msg                                   显示信息。大小已更改\n9438482 -rw-rw-r--\
  \ 2 arnold arnold 19 Dec  3 21:50 message\n9438482 -rw-rw-r-- 2 arnold arnold 19\
  \ Dec  3 21:50 msg\n```\n\n尽管我们在同一个目录中为同一个文件创建了两个链接，但硬链接并不限于位于同一个目录；它们可以位于同一文件系统上的任何其他目录。（这在第\
  \ 5.1.6 节中的“符号链接”、“第 119 页](#ch05.xhtml_page_119)”中有更多讨论。）\n\n此外，只要你在创建链接的目录具有写入权限，就可以为你你不拥的文件创建链接。（该文件保留原始文件的所有属性：所有者、权限等。这是因为它是原始文件；它只是获得了一个额外的名称。）你甚至可以为你无法读取或写入的文件创建链接，尽管你对该链接做不了什么！用户级代码无法为目录创建硬链接。\n\
  \n一旦链接被删除，使用与原文件相同的名称创建新文件就会创建一个新文件：\n\n```\n$ rm message                      \
  \                    删除旧名称\n$ echo \"What's happenin?\" > message              \
  \     重用该名称\n$ ls -il msg message                                  显示信息\n9438483\
  \ -rw-rw-r-- 1 arnold arnold 17 Dec  3 21:50 message\n9438482 -rw-rw-r-- 1 arnold\
  \ arnold 19 Dec  3 21:50 msg\n```\n\n注意，两个文件的链接计数现在都等于 `1`。\n\n在 C 级别，链接通过 `link()`\
  \ 系统调用创建：\n\n```c\n#include <unistd.h>                                      POSIX\n\
  \nint link(const char *oldpath, const char *newpath);\n```\n\n如果链接创建成功，返回 `0`，否则返回\
  \ `1`，此时 `errno` 反映错误。一种重要的失败情况是 `newpath` 已经存在。系统不会为你删除它，因为这样做可能会导致文件系统不一致。\n\n\
  #### 5.1.3.1 GNU `link` 程序\n\n`ln` 程序复杂且庞大。然而，GNU Coreutils 包含一个简单的 `link` 程序，它仅对它的两个参数调用\
  \ `link()`。以下示例显示了 `link.c` 中的代码，并删除了一些不相关的部分；行号与实际文件相关：\n\n\n\n\n\n```\n19  /*\
  \ 实现概述：\n20\n21     简单地调用系统 'link' 函数 */\n22\n    … 省略了 #include 语句 …\n30\n31  /*\
  \ 此程序的正式名称（例如，没有 'g' 前缀）。  */\n32  #define PROGRAM_NAME \"link\"\n33\n34  #define\
  \ AUTHORS proper_name (\"Michael Stone\"))\n35\n36  void\n37  usage (int status)\n\
  38  {\n     … 省略了内容 …\n54  }\n55\n56  int\n57  main (int argc, char **argv)\n58\
  \  {\n59    initialize_main (&argc, &argv);\n60    set_program_name (argv[0]);\n\
  61    setlocale (LC_ALL, \"\");\n62    bindtextdomain (PACKAGE, LOCALEDIR);\n63\
  \    textdomain (PACKAGE);\n64\n65    atexit (close_stdout);\n66\n67    parse_gnu_standard_options_only\
  \ (argc, argv, PROGRAM_NAME, PACKAGE_NAME,\n68                                 \
  \    Version, true, usage, AUTHORS,\n69                                     (char\
  \ const *) nullptr);\n70\n71    if (argc < optind + 2)\n      {\n73        if (argc\
  \ < optind + 1)\n74          error (0, 0, _(\"missing operand\"));\n75        else\n\
  76          error (0, 0, _(\"missing operand after %s\"), quote (argv[optind]));\n\
  77        usage (EXIT_FAILURE);\n78      }\n79\n80    if (optind + 2 < argc)\n \
  \     {\n82        error (0, 0, _(\"extra operand %s\"), quote (argv[optind + 2]));\n\
  83        usage (EXIT_FAILURE);\n84      }\n85\n86    if (link (argv[optind], argv[optind\
  \ + 1]) != 0)\n87      error (EXIT_FAILURE, errno, _(\"cannot create link %s to\
  \ %s\"),\n88             quoteaf_n (0, argv[optind + 1]), quoteaf_n (1, argv[optind]));\n\
  89\n90    return EXIT_SUCCESS;\n91  }\n```\n```\n\n第 59–70 行是典型的 Coreutils 模板代码，用于设置国际化（第\
  \ 61–63 行）、退出时的最终操作以及解析参数。第 71–84 行确保调用 `link` 时仅有两个参数。`link()` 系统调用本身发生在第 86 行。（`quote()`\
  \ 和 `quoteaf_n()` 函数提供了适用于当前语言环境的参数引用格式；细节在这里并不重要。）\n\n### 5.1.3.2 点（Dot）和点点（Dot-Dot）\n\
  \n在结束对链接的讨论之前，让我们来看看特殊的 `.` 和 `..` 如何管理。它们本质上就是硬链接。在第一种情况下，`.`（点）是指其所在目录的硬链接，而 `..`（点点）是其父目录的硬链接。操作系统会为你创建这些链接；正如前面提到的，用户级代码无法创建指向目录的硬链接。此示例阐明了这些链接：\n\
  \n```\n$ pwd                                          显示当前目录\n/tmp\n$ ls -ldi /tmp\
  \                                 显示其 inode 号\n2359297 drwxrwxrwt 16 root root 40960\
  \ Dec 3 21:48 /tmp\n$ mkdir x                                      创建一个新目录\n$ ls\
  \ -ldi x                                    并显示其 inode 号\n2359352 drwxrwxr-x 2 arnold\
  \ arnold 4096 Dec 3 21:56 x\n$ ls -ldi x/. x/..                             显示 .\
  \ 和 .. 的 inode 号\n2359352 drwxrwxr-x 2 arnold arnold 4096 Dec 3 21:56 x/.\n2359297\
  \ drwxrwxrwt 17 root root 40960 Dec 3 21:56 x/..\n```\n\n根目录的父目录（`/..`）是一个特殊情况；我们将它的讨论推迟到第\
  \ 8 章，“文件系统与目录遍历](#ch08.xhtml_ch08)”，第 221 页。\n\n\n\n### 5.1.4 文件重命名\n\n鉴于目录项将名称映射到\
  \ inode 号的方式，重命名文件在概念上非常简单：\n\n1. 如果文件的新名对应一个已存在的文件，先删除现有的链接。如果这是该文件的唯一链接，文件本身也会被删除，这意味着它的\
  \ inode 可以被重用，它所占用的磁盘块将被释放。\n2. 使用新名称为文件创建一个新链接。\n3. 删除文件的旧名称（链接）。（删除名称将在下一节中讨论。）\n\
  \n早期版本的 `mv` 命令确实是这样工作的。然而，通过这种方式进行，文件重命名不是*原子性*的；也就是说，它不是在一个不可中断的操作中完成的。在负载沉重的的系统上，恶意用户可以利用竞态条件，破坏重命名操作并用不同的文件替换原始文件。^(1)\n\
  \n^(1) *竞态条件*（race condition）是指时机细节可能产生意外之外的副作用或错误的情况。在这种情况下，目录在很短的一时间内处于不一致状态，正是这种不一致性引入了漏洞。\n\
  \n出于此原因，4.2 BSD 引入了 `rename()` 系统调用：\n\n```\n#include <stdio.h>                \
  \                                   ISO C\n\nint rename(const char *oldpath, const\
  \ char *newpath);\n```\n\n在 Linux 系统上，重命名操作是原子的；手册页说明：\n\n如果 `newpath` 已经存在，它将被原子性地替换，因此另一个尝试访问\
  \ `newpath` 的进程不会发现它缺失。然而，可能会存在一个窗口，`oldpath` 和 `newpath` 同时指向正在被重命的文件。\n\n如果 `newpath`\
  \ 存在但操作由于某些原因失败，`rename()` 保证保留一个 `newpath` 实例。\n\n与其他系统调用一样，返回 `0` 表示成功，返回 `–1`\
  \ 表示错误。\n\n### 5.1.5 删除文件\n\n删除文件意味着删除目录中的文件条目，并减少文件的链接计数（维护在 inode 中）。文件的内容以及持有这些内容的磁盘块在链接计数达到零之前是不会被释放的。\n\
  \n该系统调用命名为 `unlink()`：\n\n```\n#include <unistd.h>                             \
  \            POSIX\n\nint unlink(const char *pathname);\n```\n\n考虑到我们对文件链接的讨论，这个名字是有意义的；此调用删除了文件的给定链接（目录项）。成功返回\
  \ `0`，错误时返回 `–1`。\n\n*删除文件只需要目录的写权限，而不需要文件本身的权限*。这一事实可能会让人困惑，特别是对于新的 Linux/Unix\
  \ 用户来说。然而，由于该操作是针对目录的，这是合理的；修改的是目录的内容，而不是文件的内容。^(2)\n\n^(2) 确实，文件的*元数据*发生了变化（链接数改变），但不会影响任何其他文件属性，也不会影响文件的内容。更新链接计数是对文件进行的唯一不涉及检查文件权限的操作。\n\
  \n#### 5.1.5.1 使用 ISO C: `remove()`\n\nISO C 提供了用于删除文件的 `remove()` 函数；该函数旨在作为一个通用函数，适用于任何支持\
  \ ISO C 的系统，而不仅仅是 Unix 和 GNU/Linux：\n\n```\n#include <stdio.h>                 \
  \                    ISO C\n\nint remove(const char *pathname);\n```\n\n虽然技术上不是系统调用，但其返回值逻辑是一致的：成功返回\
  \ `0`，错误返回 `–1`，并反映 `errno` 值。\n\n在 GNU/Linux 上，`remove()` 使用 `unlink()` 系统调用来删除文件，使用\
  \ `rmdir()` 系统调用（在本章稍后讨论）来删除目录。\n\n#### 5.1.5.2 删除已打开的文件\n\n从 Unix 早期开始，删除已打开的文件是可能的。在成功调用\
  \ `open()` 或 `creat()` 后，直接用文件名调用 `unlink()` 即可。\n\n乍一看，这似乎是一个很奇怪的操作。既然系统会在链接计数归零时释放数据块，还能使用已打开的文件吗？\n\
  \n答案是肯定的，你可以正常使用已打开的文件。系统知道文件是打开状态，因此它会在最后一个该文件的描述符关闭之前延迟释放文件的存储。一旦文件不再被使用，存储就会被释放。\n\
  \n这种操作恰恰也非常有用——它是程序获取临时文件存储的一种简单方法，且保证这些存储在不再需要时自动释放：\n\n\n\n\n\n```\n/* 获取私临时存储，为了简洁省略了错误检查\
  \ */\nint fd;\nmode_t mode = O_CREAT|O_EXCL|O_TRUNC|O_RDWR;\n\nfd = open(\"/tmp/myfile\"\
  , mode, 0000);                 打开文件\nunlink(\"/tmp/myfile\");                  \
  \              移除它\n\n… 继续使用文件 …\nclose(fd);                                   \
  \         关闭文件，释放存储\n```\n\n这种用法的一个例子是 Shell，用于 Shell 脚本中所谓的*此处文档（here documents）*。\n\
  \n这种方法的缺点是，也可能导致一个失控的程序程序用一个打开但匿名的文件填满文件系统，在这种情况下，系统管理员必须尝试找到并杀死该进程。在过去，可能需要重启并进行文件系统一致性检查；幸运的是，这在现代系统中是极罕见的。\n\
  \n### 5.1.6 符号链接（Symbolic Links）\n\n我们在本章开头开始了对分区、文件系统和节点（inodes）的讨论。我们还看到目录项将名称与节点号关联起来。由于目录项不包含其他信息，硬链接被限制在*同一文件系统内*。这是必须的；因为没有办法区分一个文件系统的节点\
  \ `2341` 和另一个文件系统上的节点 `2341`。当尝试尝试时，会发生以下情况：\n\n```bash\n$ mount               \
  \                   显示正在使用的文件系统\n...\n/dev/nvme0n1p3 on / type ext4 (rw,relatime,errors=remount-ro)\n\
  /dev/nvme0n1p4 on /home type ext4 (rw,relatime)\n...\n$ ls -li /tmp/message    \
  \                早先的例子是在 / 的文件系统\n9438483 -rw-rw-r-- 1 arnold arnold 17 Dec 3 21:50\
  \ /tmp/message\n$ cat /tmp/message\nHi, how ya doin' ?\n$ /bin/pwd             \
  \                  当前目录位于不同的文件系统\n/home/arnold\n$ ln /tmp/message .            \
  \          尝试链接\nln: failed to create hard link './message' => '/tmp/message': Invalid\
  \ cross-device link（跨设备链接无效）\n```\n\n大型系统通常有许多分区，既有物理连接的本地磁盘，也有远程挂载的网络文件系统。硬链接限制在同一文件系统的限制是不方便的，例如，如果某些文件或目录必须移动到新位置，但旧软件对旧位置使用了硬编码的文件名。\n\
  \n为了绕过这一限制，4.2 BSD 引入了*符号链接（symbolic links）*。符号链接（也称为*软链接 soft link*）是一种特殊文件（就像目录也是一种特殊文件一样）。文件的内容是被“指向”的文件的*路径*。所有现代\
  \ Unix 系统（包括 Linux）都提供符号链接；事实上，它们现在是 POSIX 的一部分。\n\n符号链接可以指向系统中任意位置的文件。它们也可以指向目录。它们可以使用绝对路径或相对路径来实现。这使得在不同位置之间移动目录变得容易，在原始位置留下一个指向新位置的符号链接。\n\
  \n在处理文件名时，系统会注意到符号链接，并改为对被指向的文件或目录执行操作。使用 `ln` 的 `-s` 选项创建符号链接：\n\n```bash\n$ /bin/pwd\
  \                                       我们在哪里\n/home/arnold                    \
  \                 在不同的文件系统\n$ ln -s /tmp/message ./hello                     创建一个符号链接\n\
  $ cat hello                                      使用它\nHi, how ya doin' ?\n$ ls -l\
  \ hello                                    显示关于它的信息\nlrwxrwxrwx    1 arnold    devel\
  \        12 May   4 16:41 hello -> /tmp/message\n```\n\n链接指向的文件并不一定存在。系统在运行时检测到这一点并采取适当行动：\n\
  \n```bash\n$ rm /tmp/message                            移除被指向的文件\n$ cat ./hello\
  \                                尝试通过软链接使用\ncat: ./hello: No such file or directory（没有此类文件或目录）\n\
  $ echo hi again > hello                      创建新的文件内容\n$ ls -l /tmp/message    \
  \                     显示指向的文件信息 …\n-rw-r--r--    1 arnold   devel       9 May  4\
  \ 16:45 /tmp/message\n$ cat /tmp/message                           …以及内容\nhi again\n\
  ```\n\n符号链接通过 `symlink()` 系统调用创建：\n\n```c\n#include <unistd.h>                 \
  \                           POSIX\n\nint symlink(const char *oldpath, const char\
  \ *newpath);\n```\n\n`oldpath` 参数命名被指向的文件或目录，而 `newpath` 是要创建的符号链接的名称。成功时返回 `0`，错误时返回\
  \ `-1`；查看您的 *symlink*(2) 手册页以获取可能的 `errno` 值。\n\n符号链接也有它们的缺点：\n\n*   它们占用额外的磁盘空间，需要单独的节点和数据块。硬链接只占用一个目录槽位。\n\
  *   它们增加了开销。内核必须花费更多精力来解析包含符号链接的路径。\n*   它们可能会引入“循环”。考虑以下：\n\n```bash\n$ rm -f a\
  \ b                                  确保 ‘a' 和 ‘b' 不存在\n$ ln -s a b             \
  \                     将旧文件 ‘a’ 符号链接到新文件 ‘b’\n$ ln -s b a                       \
  \           将旧文件 ‘b’ 符号链接到新文件 ‘a’\n$ cat a                                     \
  \ 发生了什么？\ncat: a: Too many levels of symbolic links（符号链接层过多）\n```\n\n内核必须能够检测到这种情况并产生错误信息。\n\
  \n*   它们很容易被破坏。如果你移动或重命名了被指向的文件，符号链接将失效。这种情况在硬链接上不会发生。\n\n### 5.2 创建和删除目录\n\n创建和删除目录非常直接。这两个系统调用分别是\
  \ `mkdir()` 和 `rmdir()`：\n\n```c\n#include <sys/types.h>                       \
  \                     POSIX\n#include <sys/stat.h>\n\nint mkdir(const char *pathname,\
  \ mode_t mode);\n\n#include <unistd.h>                                    POSIX\n\
  \nint rmdir(const char *pathname);\n```\n\n成功时返回 `0`，错误时返回 `-1`，并相应设置 `errno`。对于\
  \ `mkdir()`，`mode` 参数代表应用于目录的权限。\n\n这些系统调用是在 4.2 BSD 中引入的出于此前讨论的 `rename()` 相同的原子性原因（见第\
  \ 5.1.4 节，文件重命名）。\n\n这两个函数都会处理创建或删除目录中的 `.` 和 `..`。目录在删除之前必须是空的；如果目录不为空，`errno`\
  \ 将设置为 `ENOTEMPTY`。（在这种情况下，“空”意味着目录只包含 `.` [点] 和 `..` [点点]。）\n\n新目录和所有文件一样被分配一个组\
  \ ID 号。遗憾的是，它的工作方式很复杂。我们将讨论推迟到第 11.4.1 节节新文件和目录的默认组]。\n\n这两个函数一次只处理一个目录级别。如果 `/somedir`\
  \ 存在而 `/somedir/sub1` 不存在，则 `mkdir(\"/somedir/sub1/sub2\")` 将失败。长路径中的每个组件都必须单独创建（因此\
  \ `mkdir` 命令有 `-p` 选项——见 *mkdir*(1)）。\n\n此外，如果 `pathname` 以 `/` 字符结尾，`mkdir()` 和\
  \ `rmdir()` 在某些系统上失败，而在另一些系统上成功。以下程序 `ch-fileinfo-trymkdir.c` 展示了这两个方面：\n\n\n\n\n\
  \n```c\n 1  /* ch-fileinfo-trymkdir.c --- 展示 mkdir() 的行为。\n 2                  \
  \             感谢 Nelson H. F. Beebe 的提供。 */\n 3\n 4  #include <stdio.h>        \
  \      // 用于 printf() 等\n 5  #include <errno.h>              // 用于 errno\n 6  #include\
  \ <stdlib.h>             // 用于 EXIT_SUCCESS\n 7  #include <string.h>           \
  \  // 用于 strerror()\n 8  #include <sys/types.h>          // 用于 mode_t 类型\n 9  #include\
  \ <sys/stat.h>           // 用于 mkdir()\n10\n11  /* do_test --- 测试 mkdir(2) 的结果 */\n\
  12\n13  void\n14  do_test(const char *path)\n15  {\n16      int retcode;\n17\n18\
  \      errno = 0;\n19      retcode = mkdir(path, 0755);\n20      printf(\"mkdir(\\\
  \"%s\\\") returns %d: errno = %d [%s]\\n\",\n21               path, retcode, errno,\
  \ strerror(errno));\n22  }\n23\n24  /* main --- 运行测试 */\n25\n26  int\n27  main(void)\n\
  28  {\n29      do_test(\"/tmp/t1/t2/t3/t4\");                       尝试在子目录中创建\n\
  30      do_test(\"/tmp/t1/t2/t3\");\n31      do_test(\"/tmp/t1/t2\");\n32      do_test(\"\
  /tmp/t1\");\n33\n34      do_test(\"/tmp/u1\");                               创建子目录\n\
  35      do_test(\"/tmp/u1/u2\");\n36      do_test(\"/tmp/u1/u2/u3\");\n37      do_test(\"\
  /tmp/u1/u2/u3/u4\");\n38\n39      do_test(\"/tmp/v1/\");                       \
  \       尾随的 '/' 是如何被处理的？\n40      do_test(\"/tmp/v1/v2/\");\n41      do_test(\"\
  /tmp/v1/v2/v3/\");\n42      do_test(\"/tmp/v1/v2/v3/v4/\");\n43\n44      return\
  \ (EXIT_SUCCESS);\n45  }\n```\n\n以下是 GNU/Linux 下的结果：\n\n```\n$ ch-fileinfo-trymkdir\n\
  mkdir(\"/tmp/t1/t2/t3/t4\") returns -1: errno = 2 [No such file or directory]\n\
  mkdir(\"/tmp/t1/t2/t3\") returns -1: errno = 2 [No such file or directory]\nmkdir(\"\
  /tmp/t1/t2\") returns -1: errno = 2 [No such file or directory]\nmkdir(\"/tmp/t1\"\
  ) returns 0: errno = 0 [Success]\nmkdir(\"/tmp/u1\") returns 0: errno = 0 [Success]\n\
  mkdir(\"/tmp/u1/u2\") returns 0: errno = 0 [Success]\nmkdir(\"/tmp/u1/u2/u3\") returns\
  \ 0: errno = 0 [Success]\nmkdir(\"/tmp/u1/u2/u3/u4\") returns 0: errno = 0 [Success]\n\
  mkdir(\"/tmp/v1/\") returns 0: errno = 0 [Success]\nmkdir(\"/tmp/v1/v2/\") returns\
  \ 0: errno = 0 [Success]\nmkdir(\"/tmp/v1/v2/v3/\") returns 0: errno = 0 [Success]\n\
  mkdir(\"/tmp/v1/v2/v3/v4/\") returns 0: errno = 0 [Success]\n```\n\n注意 GNU/Linux\
  \ 接受尾随的斜杠。并不是所有系统都如此。\n\n### 5.3 读取目录\n\n在原始的 Unix 系统上，读取目录内容非常简单。程序使用 `open()`\
  \ 打开目录，并直接读取二进制 `struct direct` 结构体，每次读取 16 字节。以下代码片段来自 V7 `rmdir` 程序的第 60–74 行；它展示了对目录是否为空的检查：\n\
  \n查看 V7 分发中的 `/usr/src/cmd/rmdir.c`。该副本已包含本书的 GitHub 仓库中。\n\n```\n60  if((fd = open(name,0))\
  \ < 0) {\n61      fprintf(stderr, \"rmdir: %s unreadable\\n\", name);\n62      ++Errors;\n\
  63      return;\n64  }\n65  while(read(fd, (char *)&dir, sizeof dir) == sizeof dir)\
  \ {\n66      if(dir.d_ino == 0) continue;\n67      if(!strcmp(dir.d_name, \".\"\
  ) || !strcmp(dir.d_name, \"..\"))\n68          continue;\n69      fprintf(stderr,\
  \ \"rmdir: %s not empty\\n\", name);\n70      ++Errors;\n71      close(fd);\n72\
  \      return;\n73  }\n74  close(fd);\n```\n\n第 60 行打开目录进行读取（第二个参数为 `0`，等同于 `O_RDONLY`）。第\
  \ 65 行读取 `struct direct`。第 66 行是对空目录槽位的检查；即 inode 号为 `0` 的槽位。第 67 行和第 68 行检查 `.`（点）和\
  \ `..`（点点）。当到达第 69 行时，我们知道已经看到了另一个文件名，因此目录不是空的。\n\n（测试 `!strcmp(s1, s2)` 是 `strcmp(s1,\
  \ s2) == 0` 的简短表达方式——即测试字符串是否相等。坦率地说，我们认为 `!strcmp(s1, s2)` 这种形式风格欠佳。正如 Henry Spencer\
  \ 一所说：“`strcmp()` 不是布尔值！”）\n\n当 4.2 BSD 引入一种允许更长文件名并提供更好性能的新文件格式时，它还引入了几个新函数来提供目录读取抽象。这组函数无论底层文件系统和目录组织如何都可以使用。它的基本部分是由\
  \ POSIX 标准化的，使用它的程序可以在不同的 GNU 系统间移植。\n\n#### 5.3.1 基础读取\n\n目录项由 `struct dirent`\
  \ 表示：\n\n```c\nstruct dirent {\n    ino_t d_ino;\n    char d_name[NAME_MAX];\n};\n\
  ```\n\n由于 `d_name` 长度是变长的，`NAME_MAX` 通常很大（如 255），`struct dirent` 包含了磁盘上的成员。以下函数提供了目录接口：\n\
  \n```c\n#include <sys/types.h>\n#include <dirent.h>\n\nDIR *opendir(const char *name);\
  \         打开目录读取\nstruct dirent *readdir(DIR *dir);       每次返回一个 dirent\nint closedir(DIR\
  \ *dir);                 关闭目录\nvoid rewinddir(DIR *dir);              回到目录开头\n```\n\
  \n一旦你有一个 `DIR` 变量，就可以获取指向下一个 dirent 的指针。`readdir()` 在文件结束或出错时返回 `NULL`。`DIR` 类型类似于\
  \ `<stdio.h>` 中的 `FILE` 类型；它是一个透明类型，意味着应用程序不需要知道内部结构；其内容供目录函数使用。如果 `opendir()` 返回\
  \ `NULL`，则无法打开目录并设置了 `errno`。\n\n最后，`closedir()`类似于 `<stdio.h>` 中的 `fclose()` 函数；它关闭\
  \ `DIR` 变量。`rewinddir()` 可以重新。\n\n有了这些函数（至少在库中），我们可以编写一个简单的 `catdir` 程序来“打印”目录内容。这样的程序位于\
  \ `ch-fileinfo-catdir.c`：\n\n```c\n 1  /* ch-fileinfo-catdir.c --- 展示 opendir(),\
  \ readdir(), closedir(). */\n 2\n 3  #include <stdio.h>              // 用于 printf()\
  \ 等\n 4  #include <errno.h>              // 用于 errno\n 5  #include <string.h>  \
  \           // 用于 strerror()\n 6  #include <sys/types.h>          // 用于系统类型\n 7\
  \  #include <dirent.h>             // 用于目录函数\n 8\n 9  char *myname;\n10  int process(char\
  \ *dir);\n11\n12  /* main --- 遍历目录参数 */\n13\n14  int\n15  main(int argc, char **argv)\n\
  16  {\n17      int i;\n18      int errs = 0;\n19\n20      myname = argv[0];\n21\n\
  22      if (argc == 1)\n23          errs = process(\".\");    /* 默认当前目录 */\n24 \
  \     else\n25          for (i = 1; i < argc; i++)\n26              errs += process(argv[i]);\n\
  27\n28\n      return (errs != 0);\n29  }\n```\n\n该程序与 `ch-fileio-cat.c` 非常相似（见第\
  \ 4.2 节,“基础程序结构,”第 79 页）；`main()` 函数几乎相同。主要区别在于，在没有参数时，它默认使用当前目录。\n\n\n\n\n\n```\n\
  31  /*\n32   * process --- 对目录进行某些操作，在此例中，\n33   *             在标准输出上打印 inode/名称对。\n\
  34   *             如果正常则返回 0，否则返回 1。\n35   */\n36\n37  int\n38  process(char *dir)\n\
  39  {\n40      DIR *dp;\n41      struct dirent *ent;\n42\n43      if ((dp = opendir(dir))\
  \ == NULL) {\n44          fprintf(stderr, \"%s: %s: cannot open for reading: %s\\\
  n\",\n45                          myname, dir, strerror(errno));\n46          return\
  \ 1;\n47      }\n48\n49      errno = 0;\n50      while ((ent = readdir(dp)) != NULL)\n\
  51          printf(\"%8ld %s\\n\", ent->d_ino, ent->d_name);\n52\n53      if (errno\
  \ != 0) {\n54          fprintf(stderr, \"%s: %s: reading directory entries: %s\\\
  n\",\n55                          myname, dir, strerror(errno));\n56          return\
  \ 1;\n57      }\n58\n59      if (closedir(dp) != 0) {\n60          fprintf(stderr,\
  \ \"%s: %s: closedir: %s\\n\",\n61                          myname, dir, strerror(errno));\n\
  62          return 1;\n63      }\n64\n65      return 0;\n66  }\n```\n\n`process()`\
  \ 函数完成了所有工作，其中大部分是错误检查代码。该函数的核心是第 50 和第 51 行：\n\n```\nwhile ((ent = readdir(dp))\
  \ != NULL)\n    printf(\"%8ld %s\\n\", ent->d_ino, ent->d_name);\n```\n\n该循环每次读取一个目录项，直到\
  \ `readdir()` 返回 `NULL` 为止。循环体打印每个条目的 inode 号和文件名。以下是程序运行时时的发生的情况：\n\n```\n$ ch-fileinfo-catdir\
  \             默认使用当前目录\n 9205291 14-extended.texi\n 9205287 10-signals.texi\n 9209448\
  \ part3.texi\n 9208660 15-debugging.texi\n 9207317 07-ls.texi\n 9209450 progex.texi\n\
  \ 9207328 BB-caldera.texi\n 9205286 .\n 9205295 AA-21-days.texi\n ...\n```\n\n输出没有按任何方式排序；它代表了目录的线性内容（我们在第\
  \ 6.2 节“排序和搜索函数”中描述了如何对目录内容进行排序，171 页）。注意，`..` 和 `..` 并不一定是目录中的第一个条目！\n\n#### 5.3.1.1\
  \ 可移植性考虑\n\n有几个可移植性考虑。首先，正如我们刚刚看到的，你不应该假设 `readdir()` 返回的前两个条目总是是 `.`（点）和 `..`（点-点）。许多文件系统使用的目录组织与原始\
  \ Unix 设计不同，`..` 和 `..` 可能会在目录的中间，甚至可能不存在（4）。\n\nGNU/Linux 和其他 Unix 风格操作系统能够挂载许多非\
  \ Unix 系统的文件系统，例如 FAT32 和 NTFS 文件系统。在这种情况下，关于 Unix 文件系统的假设并不适用。\n\n其次，POSIX 标准对\
  \ `d_ino` 的可能值未作说明。它指出返回的结构代表文件的目录条目；这意味着 `readdir()` 在 `d_ino == 0` 时不会返回条目，而是继续处理下一个。因此，在\
  \ GNU/Linux 和 Unix 系统上，`d_ino` 不可能为零。然而，如果可能，最好避免使用此字段。最后，某些系统在 `struct dirent`\
  \ 中使用 `d_fileno` 代替 `d_ino`。如果你必须将目录读取代码移植到此类系统，请注意这一点。\n\n#### 5.3.1.2 `DIR *`\
  \ 对象与文件描述符之间的映射\n\nPOSIX 提供了两个在文件描述符和 `DIR *` 对象之间转换的函数：\n\n```\n#include <dirent.h>\n\
  \nint dirfd(DIR *dp);\nDIR *fdopendir(int fd);\n```\n\n*   `int dirfd(DIR *dp)`\n\
  \    从打开的 `DIR *` 对象提取底层文件描述符。这类似于 `<stdio.h>` 中的 `fileno()` 函数（或宏）。`dirfd()` 通常被实现为一个宏。它是\
  \ BSD 定义的原始目录读取 API 的一部分。\n\n*   `DIR *fdopendir(int fd)`\n    此函数类似于 `opendir()`，但传递的是通过\
  \ `open()` 打开目录的文件描述符。（正如之前侧边栏“间接系统调用”所指出的，直接 `open()` 目录并尝试读取目录条目是复杂的，127 页）。一旦你使用\
  \ `fdopendir()` 获取了 `DIR *`，就应该使用 `closedir()` 来关闭它；这样做会关闭底层文件描述符。\n\n#### 5.3.1.3\
  \ Linux 和 BSD 目录项\n\n虽然我们说过应该只使用 `struct dirent` 的 `d_ino` 和 `d_name` 成员，但了解 BSD\
  \ 和 Linux `struct dirent` 中的 `d_type` 成员是有价值的。这是一个 `unsigned char` 值，存储目录条目命名的文件类型：\n\
  \n```\nstruct dirent {\n    ...\n    ino_t d_ino;                /* 如前所述 */\n  \
  \  char d_name[...];           /* 如前所述 */\n    unsigned char d_type;       /* Linux\
  \ 和现代 BSD */\n    ...\n};\n```\n\n`d_type` 可以具有表 5.1 中描述的任何值。\n\n| 名称 |  |\n| ---\
  \ | --- |\n| `DT_BLK` | 块设备文件 |\n| `DT_CHR` | 字符设备文件 |\n| `DT_DIR` | 目录 |\n| `DT_FIFO`\
  \ | FIFO 或命名管道 |\n| `DT_LNK` | 符号链接 |\n| `DT_REG` | 普通文件 |\n| `DT_SOCK` | 套接字 |\n\
  | `DT_UNKNOWN` | 未知文件类型 |\n| `DT_WHT` | 空条目（仅限 BSD 系统） |\n\n**表 5.1：** `d_type`\
  \ 的值\n\n仅通过读取目录条目就知道文件类型非常方便；它可以节省一次可能昂贵的 `stat()` 系统调用。（`stat()` 调用将在稍后的第 5.4.2\
  \ 节“检索文件信息”中描述，131 页）。\n\n#### 5.3.2 BSD 目录定位函数\n\n有时，标记目录中的当前位置以便以后返回很有。例如，你可能正在编写遍历目录树的代码，并希望遇到每个子目录时递归进入。（如何区分文件和目录将在下一节讨论。）由于这个原因，原始\
  \ BSD 接口包含了两个额外的例程：\n\n```\n#include <dirent.h>                                \
  \          POSIX XSI\n\nlong telldir(DIR *dir);                     返回当前位置\nvoid\
  \ seekdir(DIR *dir, long offset);        移动到给定位置\n```\n\n这些例程类似于 `<stdio.h>` 中的\
  \ `ftell()` 和 `fseek()` 函数。它们分别返回目录中的当前位置，并将当前位置设置为之前获取的值。\n\n这些例程被包含在 POSIX 标准的\
  \ XSI 部分，因为它们只对于使用线性存储目录项实现的目录有意义。\n\n除了对底层目录结构的假设外，使用这些例程比简单的目录读取例程更有风险。这是因为目录的内容可能会动态变化：当文件被添加到或从目录中删除时，操作系统会调整目录的内容。由于目录项是变长度的，早些时候保存的绝对偏移量可能不再代表目录项的起始位置！因此，我们建议除非必要，否则不要使用这些函数。\n\
  \n### 5.4 获取文件信息\n\n读取目录以检索文件名只是战斗的一半。一旦你有了文件名，你就需要知道如何获取与文件关联的其他信息，例如文件的类型、权限、其所有者等。\n\
  \n#### 5.4.1 Linux 文件类型\n\nLinux（以及 Unix）支持以下种类文件类型：\n\n*   *普通文件*\n\n\n\n\n\n顾如其名；用于数据、可执行程序以及你可能喜欢的任何内容。在\
  \ `ls -l` 列表中，它们在权限（模式）字段的第一个字符显示为 `-`。\n\n## 目录\n用于将文件名与节点（inode）关联的特殊文件。在 `ls\
  \ -l` 列表中，它们在权限字段的第一个字符显示为 `d`。\n\n### 符号链接\n正如本章早些介绍。在 `ls -l` 列表中，它们在权限字段的第一个字符显示为\
  \ `l`（字母“ell”，而不是数字“one”）。\n\n### 设备\n代表物理硬件设备和软件伪设备的文件。分为两种：\n\n#### 块设备\nI/O 操作以某些固定物理记录大小的块为进行的设备，例如磁盘驱动器和磁带驱动器。对此类设备的访问通过内核的缓冲区缓存进行。在\
  \ `ls -l` 列表中，它们在权限字段的第一个字符显示为 `b`。\n\n#### 字符设备\n也称为 `raw` 设备。最初，字符设备是指每次处理几个字节进行\
  \ I/O 操作的设备，例如终端。然而，字符设备也用于对磁带和磁盘等块设备进行直接 I/O，绕过缓冲区缓存。在 `ls -l` 列表中，它们在权限字段的第一个字符显示为\
  \ `c`。\n\nLinux 专门将块设备用于磁盘。其他系统则两者都使用。\n\n### 命名管道\n也称为 `FIFOs`（“先进先出”）文件。这些特殊文件像管道一样——一个程序写入它们的数据可以被另一个程序读取；数据不会流入或流磁盘。FIFOs\
  \ 通过 `mkfifo` 命令创建；它们将在第 9.3.2 节“FIFOs”，第 306 页进行讨论。在 `ls -l` 列表中，它们在权限字段的第一个字符显示为\
  \ `p`。\n\n### 套接字\n目的与命名管道相似，通过套接字进程间通信（IPC）系统调用进行管理，见第 14 章“套接字与基础网络”，第 473 页。在\
  \ `ls -l` 列表中，它们在权限字段的第一个字符显示为 `s`。\n\n命名管道和套接字分别由 System V 和 BSD Unix 组独立开发。随着\
  \ Unix 系统的重新收敛，这两类文件都变得普遍可用。\n\n#### 5.4.2 获取文件信息\n\n三个系统调用返回有关文件的信息：\n\n```c\n\
  #include <sys/types.h>                                      POSIX\n#include <sys/stat.h>\n\
  #include <unistd.h>\n\nint stat(const char *file_name, struct stat *buf);\nint fstat(int\
  \ filedes, struct stat *buf);\nint lstat(const char *file_name, struct stat *buf);\n\
  ```\n\n`stat()` 函数接受一个路径并返回关于给定文件的信息。它跟随符号链接；也就是说，当应用于符号链接时，`stat()` 返回的是指向的文件的信息，而不是链接本身的信息。当你想要知道一个文件是否为符号链接时，请使用\
  \ `lstat()` 函数；它不跟随符号链接。\n\n`fstat()` 函数检索已打开文件的信息。对于文件描述符 `0`、`1` 和 `2`（标准输入、输出和错误）特别有用，这些描述符在进程启动时已经打开了。然而，它也可以应用于任何打开的文件。（一个打开的文件描述符绝不会关联符号链接；请确保你理解为什么。）\n\
  \n作为第二个参数传递的值应该是在 `<sys/stat.h>` 中声明的 `struct stat` 的地址。与 `struct dirent` 一样，`struct\
  \ stat` 至少包含以下成员：\n\n```c\nstruct stat {\n    ...\n    dev_t           st_dev; \
  \     /* 设备 */\n    ino_t           st_ino;      /* 节点 */\n    mode_t          st_mode;\
  \     /* 类型和保护 */\n    nlink_t         st_nlink;    /* 硬链接数 */\n    uid_t      \
  \     st_uid;      /* 所有者用户 ID */\n    gid_t           st_gid;      /* 所有者组 ID */\n\
  \    dev_t           st_rdev;     /* 设备类型（块设备或字符设备） */\n    off_t           st_size;\
  \     /* 总大小，字节为单位 */\n    blksize_t       st_blksize;  /* 文件系统 I/O 的块大小 */\n  \
  \  blkcnt_t        st_blocks;   /* 分配的块数 */\n    struct timespec st_atim;     /*\
  \ 最后访问时间 */\n    struct timespec st_mtim;     /* 最后修改时间 */\n    struct timespec\
  \ st_ctim;     /* 最后节点更改时间 */\n    ...\n};\n```\n\n（不同架构上的布局可能不同。）该结构体使用了许多 `typedef`\
  \ 定义的类型。尽管它们（通常）都是整数类型，但使用特殊定义的类型允许它们在不同系统上具有不同的大小。这使得使用它们的用户级代码具有可移植性。以下是对每个字段更详细的描述：\n\
  \n*   `st_dev`\n    挂载文件系统的设备。每个挂载的文件系统都有唯一的 `st_dev` 值。（文件系统和挂载见第 8 章“文件系统与目录遍历”，第\
  \ 221 页。）\n\n*   `st_ino`\n    文件在文件系统内的 inode 编号。(`st_dev`, `st_ino`) 键对唯一标识一个文件。\n\
  \n*   `st_mode`\n    文件的类型及其权限编码在同一个字段中。我们将很快看到如何提取这些信息。\n\n*   `st_nlink`\n   \
  \ 指向该文件的硬链接数（链接计数）。如果文件在打开后被取消链接，该值可能为零。\n\n*   `st_uid`\n    文件的 UID（所有者编号）。\n\n\
  *   `st_gid`\n    文件的 GID（组编号）。\n\n*   `st_rdev`\n    如果文件是块设备或字符设备时的设备类型。`st_rdev`\
  \ 编码设备的信息。我们将很快看到如何提取这些信息。如果文件不是块设备或字符设备，此字段没有意义。\n\n*   `st_size`\n    文件的逻辑大小。正如第\
  \ 4.5 节“随机访问：在文件中移动”，第 96 页所述，文件可能包含空洞，在这种情况下，大小可能无法反映占据的实际存储空间。\n\n*   `st_blksize`\n\
  \    文件的“块大小”。这代表与文件进行 I/O 操作的首选块大小。这通常比物理磁盘扇区大。对于 Linux `ext4` 文件系统，此值为 4,096。\n\
  \n*   `st_blocks`\n    文件使用的“块”数。在 Linux 上，这是以 512 字节块为单位。在其他系统上，块的大小可能不同；请检查本地的\
  \ `stat`(2) 手页。（此数字来自 `<sys/param.h>` 中的 `DEV_BSIZE` 常量。该常量没有标准，但在 Unix 系统上广泛使用。）\n\
  \    块的数量可能多于 `st_size / 512`；除了数据块，文件系统可能使用额外的块来存储数据块的位置。这对于大文件是特别必要的。\n\n*   `st_atim`\n\
  \    文件的访问时间——即最后一次读取文件数据的时间。\n\n*   `st_mtim`\n    文件的修改时间——即最后一次写入或截断文件数据的时间。\n\
  \n*   `st_ctim`\n    文件的 inode 更改时间。这表示元数据最后更改的时间，例如权限或所有者。\n\n用于 `st_atim`、`st_mtim`\
  \ 和 `st_ctim` 字段的 `struct timespec` 类型表示日期和时间。最后三个时间相关的值有时被称为*时间戳*。`struct timespec`\
  \ 结构和其他时间相关类型定义在 `<time.h>` 头文件中。POSIX 规定它至少包含以下字段：\n\n\n\n\n\n```\nstruct timespec\
  \ {\n    ...\n    time_t  tv_sec;   /* seconds */\n    long    tv_nsec;  /* nanoseconds\
  \ */\n    ...\n};\n```\n\n简而言之，`time_t` 类型表示“自纪元（Epoch）以来的秒”。`Epoch` 是计算机系统的“时间起点”。GNU/Linux\
  \ 和 Unix 使用 UTC 世界时间 1970 年 1 月 1 日午夜作为纪元。Microsoft Windows 系统使用当地时间 1980 年 1 月\
  \ 1 日午夜（显然是本地时间）作为纪元。\n\n`UTC` 是协调世界时（Coordinated Universal Time）的一个不依赖语言的缩写。旧的代码（有时是老一辈人）称之为“格林威治标准时间”（GMT），即英国格林威治的时间。当时区被广泛使用时，格林威治被选为所有其他时区的基准位置，无论是在其之前还是之后。\n\
  \n原始的 Unix（以及 POSIX）`struct stat` 包含以下时间戳：\n\n```\n...\ntime_t     st_atime;   \
  \  /* time of last access */\ntime_t     st_mtime;     /* time of last modification\
  \ */\ntime_t     st_ctime;     /* time of last inode change */\n...\n```\n\n为了与旧代码保持兼容性，POSIX\
  \ 要求定义以下宏：\n\n```\n#define st_atime st_atim.tv_sec\n#define st_mtime st_mtim.tv_sec\n\
  #define st_ctime st_ctim.tv_sec\n```\n\n关于如何使用 `time_t` 值的进一步讨论将推到第 6.1 节“时间与日期”，第\
  \ 155 页。与 `time_t` ，`uid_t` 和 `gid_t` 类型表示用户和组 ID，将在第 6.3 节“用户和组名”，第 190 页中讨论。其他大多数类型通常并不感兴趣。\n\
  \n### 注意\n\n`st_ctim` 字段*并不是*文件的“创建时间”！在 Linux 或 Unix 系统并没有这种东西。某些早期的文档曾将（原始的）`st_ctime`\
  \ 字段称为创建时间。这是为了简化文件元数据的展示而进行的误导性尝试。\n\n### 5.4.3 仅限 Linux：指定高精度文件时间\n\n正如我们所看到的，POSIX\
  \ 强制文件时间具有纳秒级精度。因此，符合标准的代码会使用类似 `sbuf.st_mtim.tv_nsec` 的结构获取时间戳的纳秒部分。\n\n在此标准化之前，Linux\
  \ 内核在 `struct stat` 中提供了三个额外的字段，用于文件时间的纳秒级精度：\n\n| 字段 | 描述 |\n| :--- | :--- |\n\
  | `st_atime_nsec` | 文件访问时间的纳秒组件。 |\n| `st_mtime_nsec` | 修改时间的纳秒组件。 |\n| `ctime_nsec`\
  \ | inode 改变时间的纳秒组件。 |\n\n你仍然可以使用这些字段，但这样做不具有可移植性且不建议这样做。我们提到它们是为了让你在旧代码中遇到它们时知道它们的存在。\n\
  \n### 5.4.4 确定文件类型\n\n回想 `st_mode` 字段同时编码了文件的类型和权限。`<sys/stat.h>` 定义了许多确定文件类型的宏。特别是，这些宏在应用于\
  \ `st_mode  字段时会返回真或假。假设以下代码已经执行：\n\n```\nstruct stat stbuf;\nchar filename[PATH_MAX];\
  \ /* PATH_MAX 来自 <limits.h> */\n// 用文件名填充 filename\nif (stat(filename, &stbuf) <\
  \ 0) {\n    /* 错误处理 */\n}\n```\n\n一旦系统填充了 `stbuf`，就可以调用以下宏，并将 `stbuf.st_mode` 作为参数：\n\
  \n* `S_ISREG(stbuf.st_mode)` 如果 `filename` 是普通文件，则返回真。\n* `S_ISDIR(stbuf.st_mode)`\
  \ 如果 `filename` 是目录，则返回真。\n* `S_ISCHR(stbuf.st_mode)` 如果 `filename` 是字符设备，则返回真。设备将在更详细地讨论。\n\
  * `S_ISBLK(stbuf.st_mode)` 如果 `filename` 是块设备，则返回真。\n* `S_ISFIFO(stbuf.st_mode)`\
  \ 如果 `filename` 是 FIFO（管道），则返回真。\n* `S_ISLNK(stbuf.st_mode)` 如果 `filename` 是符号链接，则返回真。（如果使用\
  \ `stat()` 或 `fstat()` 而不是 `lstat()`，可能会返回真。）\n* `S_ISSOCK(stbuf.st_mode)` 如果 `filename`\
  \ 是 socket，则返回真。\n\n### 注意\n\n在 GNU/Linux 上，这些宏返回 `1` 表示真，返回 `0` 表示假。但在其他系统上，它们可能返回非零表示真，而不是\
  \ `1`。（POSIX 规定为非零与零。）因此，你应该始终将这些宏作为独立测试，而不是测试其返回值：\n\n```\nif (S_ISREG(stbuf.st_mode))\
  \ // 正确\nif (S_ISREG(stbuf.st_mode) == 1) // 错误\n```\n\n除了宏之外，`<sys/stat.h>` 还提供了两组位掩码。一组用于测试权限，另一组用于测试文件类型。我们在第\
  \ 4.6 节“创建文件”，第 101 页讨论 `mode_t` 类型以及 `open()` 和 `creat()` 的值时，见过过权限掩码。位掩码、它们在 GNU/Linux\
  \ 中的值及其含义描述于表 5.2。\n\n| 掩码 | 值 | 含义 |\n| :--- | :--- | :--- |\n| `S_IFMT` | `0170000`\
  \ | 文件类型位域的位掩码。 |\n| `S_IFSOCK` | `0140000` | Socket。 |\n| `S_IFLNK` | `0120000`\
  \ | 符号链接。 |\n| `S_IFREG` | `0100000` | 普通文件。 |\n| `S_IFBLK` | `0060000` | 块设备。 |\n\
  | `S_IFDIR` | `0040000` | 目录。 |\n| `S_IFCHR` | `0020000` | 字符设备。 |\n| `S_IFIFO`\
  \ | `0010000` | FIFO。 |\n| `S_ISUID` | `0004000` | 设置用户 ID。 |\n| `S_ISGID` | `0002000`\
  \ | 设置组 ID。 |\n| `S_ISVTX` | `0001000` | 粘位。 |\n| `S_IRWXU` | `0000700` | 用户权限的掩码。\
  \ |\n| `S_IRUSR` | `0000400` | 用户读取权限。 |\n| `S_IWUSR` | `0000200` | 用户写入权限。 |\n\
  | `S_IXUSR` | `0000100` | 用户执行权限。 |\n| `S_IRWXG` | `000070` | 组权限的掩码。 |\n| `S_IRGRP`\
  \ | `0000040` | 组读取权限。 |\n| `S_IWGRP` | `0000020` | 组写入权限。 |\n| `S_IXGRP` | `0000010`\
  \ | 组执行权限。 |\n| `S_IRWXO` | `000007` | 其他权限的掩码。 |\n| `S_IROTH` | `000004` | 其他读取权限。\
  \ |\n| `S_IWOTH` | `000002` | 其他写入权限。 |\n| `S_IXOTH` | `000001` | 其他执行权限。 |\n\n\
  **表 5.2：<sys/stat.h> 中的 POSIX 文件类型位掩码**\n\n其中一些掩码用于隔离 `st_mode` 中编码的不同位集：\n\n* `S_IFMT`\
  \ 代表第 12–15 位，这是编码不同文件类型的地方。\n* `S_IRWXU` 代表第 6–8 位，即用户的权限（读、写、执行）。\n* `S_IRWXG`\
  \ 代表第 3–5 位，即组的权限（读、写、执行）。\n* `S_IRWXO` 代表第 0–2 位，即其他权限（读、写、执行）。\n\n权限和文件类型位在图 5.3\
  \ 中以图表形式给出。\n\n![Images](img/fig05-003.jpg)\n\n**图 5.3：权限和文件类型位**\n\n文件类型掩码的标准化主要是为了与旧代码兼容；不应直接使用它们，因为这种代码的可读性不如相应的宏。POSIX\
  \ 标准明确阐明，未来将不会标准化新的位掩码，且对于任何可能添加的额外文件类型的测试，将仅通过 `S_IS` *xxx* `()` 宏提供。\n\n#### 5.4.4.1\
  \ 设备信息\n\n由于该标准旨在不仅适用于 Unix 系统也适用于非 Unix 系统，因此 POSIX 标准没有定义 `dev_t` 含义。然而，了解 `dev_t`\
  \ 包含的内容是值得的。\n\n\n\n\n\n当 `S_ISBLK(sbuf.st_mode)` 或 `S_ISCHR(sbuf.st_mode)` 为真时，设备信息可以在\
  \ `sbuf.st_rdev` 字段中找到。否则，该字段不包含任何有用信息。\n\n传统上，Unix 设备文件在 `dev_t` 值中编码了一个主设备号（major\
  \ device number）和一个次设备号（minor device number）。主号用于区分设备类型，例如“磁盘驱动器”或“带驱动器”。主号还能区分不同类型的设备，例如\
  \ SSD 磁盘与 USB 磁盘。次设备号用于区分该类型的单元，例如第一个磁盘或第二个磁盘。你可以通过 `ls -l` 查看这些值：\n\n```\n$ ls\
  \ -l /dev/sda*             显示第一个硬盘的数字\nbrw-rw---- 1 root disk 8, 0 Dec  7 11:12\
  \ /dev/sda\nbrw-rw---- 1 root disk 8, 1 Dec  7 11:13 /dev/sda1\n\n$ ls -l /dev/null\
  \             同样显示 /dev/null 的信息\ncrw-rw-rw- 1 root root 1, 3 Dec  2 19:45 /dev/null\n\
  ```\n\n`ls` 显示的不是文件大小，而是主号和次号。在硬盘的情况下，`/dev/sda` 代表整个驱动器。`/dev/sda1` 是驱动器内的第一个分区。如果有额外的分区，它们将被编号为\
  \ `/dev/sda2` 等。它们都共享相同的主设备号（`8`），但具有不同的次设备号。\n\n注意，磁盘设备是块设备（block devices），而 `/dev/null`\
  \ 是字符设备（character device）。块设备和字符设备是独立的实体；即使字符设备和块设备共享相同的主设备号，它们也不一定有联系。\n\n可以使用\
  \ `<sys/sysmacros.h>` 中定义的 `major()` 和 `minor()` 函数从 `dev_t` 值中提取主次设备号：\n\n```\n\
  #include <sys/types.h>                                            通用\n#include <sys/sysmacros.h>\n\
  \nint major(dev_t dev);                               主设备号\nint minor(dev_t dev);\
  \                               次设备号\ndev_t makedev(int major, int minor);     \
  \           创建一个 dev_t 值\n```\n\n（某些系统将它们实现为宏。）\n\n`makedev()` 函数的作用反相反；它接收单独的主号和次号值，并将它们编码为一个\
  \ `dev_t` 值。它的用法超出了本书的范围；好奇心极强的人可以去查看 `mknod`(2)。\n\n以下程序 `ch-fileinfo-devnum.c`\
  \ 展示了如何使用 `stat()` 系统调用、文件类型测试宏，以及最后的 `major()` 和 `minor()` 宏：\n\n```\n/* ch-fileinfo-devnum.c\
  \ --- 演示 stat(), major(), minor(). */\n\n#include <stdio.h>\n#include <errno.h>\n\
  #include <stdlib.h>\n#include <string.h>\n#include <sys/types.h>\n#include <sys/stat.h>\n\
  #include <sys/sysmacros.h>\n\nint\nmain(int argc, char **argv)\n{\n   struct stat\
  \ sbuf;\n   char *devtype;\n\n   if (argc != 2) {\n       fprintf(stderr, \"usage:\
  \ %s path\\n\", argv[0]);\n       exit(1);\n   }\n\n   if (stat(argv[1], & sbuf)\
  \ < 0) {\n       fprintf(stderr, \"%s: stat: %s\\n\", argv[1], strerror(errno));\n\
  \       exit(1);\n   }\n\n   if (S_ISCHR(sbuf.st_mode))\n       devtype = \"char\"\
  ;\n   else if (S_ISBLK(sbuf.st_mode))\n       devtype = \"block\";\n   else {\n\
  \       fprintf(stderr, \"%s is not a block or character device\\n\", argv[1]);\n\
  \       exit(1);\n   }\n\n   printf(\"%s: major: %d, minor: %d\\n\", devtype,\n\
  \           major(sbuf.st_rdev), minor(sbuf.st_rdev));\n\n   exit(0);\n}\n```\n\n\
  当运行程序时，发生的情况如下：\n\n```\n$ ch-fileinfo-devnum /tmp                       尝试一个非设备\n\
  /tmp is not a block or character device\n$ ch-fileinfo-devnum /dev/null        \
  \          字符设备\nchar: major: 1, minor: 3\n$ ch-fileinfo-devnum /dev/sda1      \
  \            块设备\nblock: major: 8, minor: 1\n```\n\n幸运的是，输出与 `ls` 的结果一致，这让我们确信确实编写了正确的代码。\n\
  \n这种技术术语叫做“温暖的感觉”（warm fuzzies）。\n\n复制 `ls` 的输出很好，但这真的有用吗？答案是定的。任何处理文件层次的应用必须能够区分所有不同类型的文件。考虑像\
  \ `tar` 或 `cpio` 这样的存档工具。如果这样的程序将磁盘设备文件视为普通文件并尝试读取它将其内容存储在归文件中，那将是灾难性的！或者考虑 `find`，它可以根据遇到的文件的类型和其他属性执行任意操作。（`find`\
  \ 是一个复杂的程序；如果你不熟悉，请参见 `find`(1)）。甚至是一个再简单的磁盘空间统计软件包也必须区分普通文件和其他所有内容。\n\n### 5.4.4.2\
  \ 重新回顾 V7 的 `cat`\n\n在[第 4.4.4 节]，“[示例：Unix `cat`，”第 94 页，我们承诺回来回顾 V7 `cat` 程序及其对\
  \ `stat()` 系统调用的使用。第一组使用它的行是这些：\n\n```\n31      fstat(fileno(stdout), &statb);\n\
  32      statb.st_mode &= S_IFMT;\n33      if (statb.st_mode!=S_IFCHR && statb.st_mode!=S_IFBLK)\
  \ {\n34          dev = statb.st_dev;\n35          ino = statb.st_ino;\n36      }\n\
  ```\n\n这段代码现在应该可以理解了。第 31 行对标准输出调用 `fstat()` 以填充 `statb` 结构。第 32 行通过与 `S_IFMT` 掩码进行与与运算，丢弃了\
  \ `statb.st_mode` 中文件类型以外的所有信息。第 33 行检查用于标准输出的文件是否为设备文件。在这种情况下，程序将设备号和索引号保存在 `dev`\
  \ 和 `ino` 中。这些值会在第 50–56 行中对每个输入文件进行检查：\n\n```\n50          fstat(fileno(fi), &statb);\n\
  51          if (statb.st_dev==dev && statb.st_ino==ino) {\n52              fprintf(stderr,\
  \ \"cat: input %s is output\\n\",\n53                 fflg?\"-\": *argv);\n54  \
  \            fclose(fi);\n55              continue;\n56          }\n```\n\n如果输入文件的\
  \ `st_dev` 和 `st_ino` 值与输出文件匹配，那么 `cat` 就会报错并继续处理命令行上指定的下一个文件。\n\n检查是无条件进行的，尽管 `dev`\
  \ 和 `ino` 只在输出不是设备文件时才被设置。这运行得良好，因为这些变量的声明如下：\n\n```\n17      int dev, ino = -1;\n\
  ```\n\n由于 `ino` 被初始化为 –1，任何有效的索引号都不可能与之相等。第 17 行的声明风格不好，只初始化了 `ino` 而没有初始化 `dev`。这并不是问题，因为第\
  \ 51 行的测试要求设备号和索引都相等。（良好的编译器会警告 `dev` 在未初始化的情况下被使用。）\n\n这一说法在 V7 中是正确的；现代系统上没有这样的保证。\n\
  \n同样注意两次 `fstat()` 的调用都没有检查错误。这同样很草率，虽然程度较轻；`fstat()` 在有效文件描述符上不太失败。\n\n\n\n\n\n\
  *   `sbuf.st_size` 是所指向的文件名所占的字节数。\n\n我们已经看到 `symlink()` 系统调用会创建一个符号链接。但对于一个已存在的符号链接，我们如何获取它所指向的文件名呢？（`ls`\
  \ 显然可以，所以我们也应该能做到。）\n\n使用 `open()` 打开链接以便用 `read()` 读取它是不可行的；`open()` 会跟随链接找到指向的文件。因此，符号链接需要一个名为\
  \ `readlink()` 的额外系统调用：\n\n```c\n#include <unistd.h>                           \
  \                  POSIX\n\nint readlink(const char *path, char *buf, size_t bufsiz);\n\
  ```\n\n`readlink()` 将由 `path` 命名的符号链接的内容放入 `buf` 指向的缓冲区中。复制的字符数不超过 `bufsiz`。返回值是放入\
  \ `buf` 中的字符数，如果发生错误，则返回 `-1`。`readlink()` *不会*提供末尾的零字节（null byte）。\n\n请注意，如果传递给\
  \ `readlink()` 的缓冲区太小，你将丢失信息；无法获取指向文件的完整名称。要正确使用 `readlink()`，你的代码应该执行以下操作：\n\n\
  1. 使用 `lstat()` 验证你拥有一个符号链接。\n2. 确保存放链接内容的缓冲区至少有 `sbuf.st_size + 1` 字节；`+ 1` 是用于末尾的零字节，以便将缓冲区转换为可用的\
  \ C 字符串。\n3. 调用 `readlink()`。验证返回值是否与 `sbuf.st_size` 相同并无处。\n4. 在链接内容后的字节处赋值 `'\\\
  0'`，使其成为 C 字符串。\n\n执行所有这些操作的代码看起来如下：\n\n```c\n/* 为了简洁，省略了错误检查 */\nint count;\nchar\
  \ linkfile[PATH_MAX], realfile[PATH_MAX];  /* PATH_MAX 在 <limits.h> 中 */\nstruct\
  \ stat sbuf;\n\n… 在 linkfile 中填充目标符号链接的路径 …\nlstat(linkfile, & sbuf);          \
  \                  获取 stat 统计信息\nif (! S_ISLNK(sbuf.st_mode))                  \
  \      检查是否为符号链接\n    /* 不是符号链接，处理它 */\nif (sbuf.st_size + 1 > PATH_MAX)       \
  \             检查缓冲区大小\n    /* 处理缓冲区大小问题 */\n\ncount = readlink(linkfile, realfile,\
  \ PATH_MAX);     读取链接\nif (count != sbuf.st_size)\n    /* 发生了奇怪的情况，处理它 */\n\nrealfile[count]\
  \ = '\\0';                             使其成为 C 字符串\n```\n\n此示例为了演示方便使用了固定大小的缓冲区。实际代码会使用\
  \ `malloc()` 分配正确大小的缓冲区，因为固定大小的数组可能太小。实现此功能的示例代码可以在 GNU Coreutils 5.0 发行版的 `lib/xreadlink.c`\
  \ 文件中找到。它将符号链接的内容读取到 `malloc()` 分配的存储中。我们在这里只展示函数；文件的大部分是样板定义。行号相对于文件开头：\n\n当前的\
  \ Coreutils 代码要复杂得多，掩盖了我们想要演示的问题。\n\n```c\n55  /* 调用 readlink 获取 FILENAME 的符号链接值。\n\
  56     返回指向在 malloc 分配的存储中该 NUL 终止字符串的指针。\n57     如果 readlink 失败，返回 NULL（调用者可以使用\
  \ errno 进行诊断）。\n58     如果 realloc 失败，或者链接值大于 SIZE_MAX :-),\n59     给出诊断并退出。  */\n\
  60\n61  char *\n62  xreadlink (char const *filename)\n63  {\n64    /* 链接值的初始缓冲区大小。2\
  \ 的幂\n65       可以更早检测算术溢出，但不是必须。  */\n66    size_t buf_size = 128;\n67\n68    while\
  \ (1)\n69      {\n70        char *buffer = xmalloc (buf_size);\n71        ssize_t\
  \ link_length = readlink (filename, buffer, buf_size);\n\n73\n74        if (link_length\
  \ < 0)\n75          {\n76             int saved_errno = errno;\n77             free\
  \ (buffer);\n78             errno = saved_errno;\n79             return NULL;\n\
  80          }\n\n81        if ((size_t) link_length < buf_size)\n82          {\n\
  83             buffer[link_length] = 0;\n84             return buffer;\n85     \
  \     }\n\n87\n        free (buffer);\n88        buf_size *= 2;\n89        if (SSIZE_MAX\
  \ < buf_size || (SIZE_MAX / 2 < SSIZE_MAX && buf_size == 0))\n90          xalloc_die\
  \ ();\n91      }\n92  }\n```\n\n函数体由一个无限循环（68–91 行）组成，在第 84 行中断并返回分配的缓冲区。循环从分配初始缓冲区（70\
  \ 行）和读取链接（71 行）开始。 73–79 行处理错误情况，保存并恢复 `errno`，以便其被调用者代码正确处理。\n\n81–85 行处理“成功”情况，即链接内容的长度小于缓冲区大小。在这种情况下，提供了终止零字节（\
  \ 83 行），然后返回缓冲区（ 84 行），跳出无限循环。这确保了整个链接内容都已放入缓冲区中，因为 `readlink()` 无法指示“缓冲区空间不足”。\n\
  \n87–88 行释放缓冲区并在循环顶部将缓冲区大小翻倍，以便下次尝试。89–90 行处理链接过大的情况：`buf_size` 大于 `SSIZE_MAX`，或者\
  \ `SSIZE_MAX` 大于用于存储 `SIZE_MAX` 的相同大小的有符号整数所能表示的值，且 `buf_size` 已溢回为零。（这些情况不太可能，但奇怪的事情确实会发生。）如果任一条件成立，程序将带错误信息退出。否则，函数将继续回到循环顶部，再次尝试分配缓冲区并读取链接。\n\
  \n进一步的解释：`SIZE_MAX / 2 < SSIZE_MAX` 条件仅在 `SIZE_MAX < 2 * SSIZE_MAX` 的系统上为真；我们不知道任何这样的系统，但只有在这样的系统上\
  \ `buf_size` 才会溢回为零。由于在实践中该条件不可能成立，编译器可以优化掉整个表达式，包括接下来的 `buf_size == 0` 测试。\n\n\
  阅读这段代码后，你可能会问：“为什么不用 `lstat()` 来获取符号链接的大小，用 `malloc()` 分配正确大小的缓冲区，然后完事呢？”嗯，有几个原因：\n\
  \n*   `lstat()` 是一个系统调用——最好避免产生它的开销，因为大多数符号链接的内容都能适应 128 字节的初始缓冲区大小。\n*   调用 `lstat()`\
  \ 引入了竞态条件：链接在执行 `lstat()` 和 `readlink()` 之间发生变化，迫使必须进行迭代。\n*   某些系统没有正确为符号链接填充 `st_size`\
  \ 成员。（遗憾，但事实如此。）正如我们在第 8.4.2 节、第 248 页“获取当前目录：`getcwd()`”中所看到的，Linux 在 `/proc` 下提供了特殊的符号链接，其\
  \ `st_size` 为 0，但 `readlink()` 会返回有效内容。\n\n最后，当缓冲区不够大时，`xreadlink()` 使用更大 get `free()`\
  \ 和 `malloc()` 而不是 `realloc()`，以避免 `realloc()` 的无用复制。（因此，第 58 行的注释已过，因为没有使用 `realloc()`；这在\
  \ Coreutils 5.0 之后的版本中已修复。）\n\n### 5.5 避免竞态条件：`openat()` 及其它\n\n可以说，这一节应该属于第 4 章“文件和文件\
  \ I/O”，第 79 页。它出现在在这里是因为它讨论了与本章描述的所有其他系统调用都类似的系统调用。\n\n\n\n\n我们目前介绍的许多标准系统调用都可能存在竞态条件，这与我们之前在第\
  \ 5.1.4 节“文件重命名”中描述的文件重命名问题类似。为了解决这个问题并出于其他原因，POSIX 引入了传统系统调用的许多变体，这些变体接受一个针对目标目录打开的文件描述符、在该目录中执行操作的文件名，以及可能用于控制操作的额外信息和或标志。让我们来看其中一个：\n\
  \n```\n#include <sys/types.h>                           POSIX\n#include <sys/stat.h>\n\
  #include <fcntl.h>\n\nint openat(int dir_fd, const char *pathname, int flags);\n\
  int openat(int dir_fd, const char *pathname, int flags, mode_t mode);\n```\n\n名称中的“at”表示操作是在第一个参数给出的打开目录上进行的。`openat()`\
  \ 的参数如下：\n\n* `dir_fd`\n    一个针对目标目录打开的文件描述符。你可以通过使用 `open()` 打开目录进行读取、通过在父目录上使用\
  \ `openat()`，或者对 `opendir()` 返回的 `DIR *` 使用 `dirfd()` 来获取这样的文件描述符。`dir_fd` 可以是特殊值\
  \ `AT_FDCWD`，在这种情况下将使用进程的当前工作目录。\n\n* `pathname`\n    要打开的目录内的文件名。如果 `pathname`\
  \ 是绝对路径，则忽略 `dir_fd`。如果 `pathname` 是相对路径，则它被视为相对于 `dir_fd` 所指的目录，而不是进程的当前工作目录。\n\
  \n* `flags`\n    可能与 `open()` 一起使用的标志的位位或或结果。请参见表 4.3，也请参见表 4.7。\n\n* `mode`\n \
  \   文件权限，与 `open()` 相同（参见表 4.7）。\n\n`open(2)` 手页指出，`dir_fd`提供了对目录的稳定引用，即使该目录后来被重命名或删除也是如此，它还可以防止包含的文件系统被卸载，就像打开的文件一样。（尚未讨论挂载和卸载文件系统；参见第\
  \ 8 章“文件系统与目录遍历”，第 221 页](#ch08.xhtml_page_221)。）\n\n在打开文件时，值得注意的是 Linux 两个有趣的标志：\n\
  \n* `O_PATH`\n    打开目录，返回一个文件描述符，该描述符可以用于任何 `XXX` `at()` 系统调用，但不适用于其他许多用途。\n\n*\
  \ `O_TMPFILE`\n    在包含 `dir_fd` 所在目录的文件系统中使用匿名 inode 打开文件。在这种情况下，`pathname` 被忽略。该文件从某种上说是未链接的（unlinked），因此当它的最后一个打开文件描述符关闭时，其数据将被释放。`open(2)`\
  \ 手页显示了可以使用 `linkat()` 将匿名文件链接到目录的示例代码。\n\n表 5.3 列出了额外的 `XXX` `at()` 系统调用。它们都遵循之前为\
  \ `openat()` 显示的模式，因此我们不费力详细描述它们，而是让你参考它们各自的手页。\n\n| `execveat()` | `fstatat()`\
  \ | `mknodat()` | `unlinkat()` |\n| `faccessat()` | `futimesat()` | `readlinkat()`\
  \ | `utimensat()` |\n| `fchmodat()` | `linkat()` | `renameat()` |  |\n| `fchownat()`\
  \ | `mkdirat()` | `symlinkat()` |  |\n\n**表 5.3:** 额外的 `XXX` `at()` 系统调用\n\n###\
  \ 5.6 修改所有权、权限和修改时间\n\n几个系统调用允许你更改与文件相关的信息——特别是文件的所有者和组、文件的权限，以及文件的访问时间和和修改时间。\n\
  \n#### 5.6.1 修改文件所有权：`chown()`、`fchown()` 和 `lchown()`\n\n通过三个相似的系统调用更改文件所有权和组：\n\
  \n```\n#include <sys/types.h>                                           POSIX\n\
  #include <unistd.h>\n\nint chown(const char *path, uid_t owner, gid_t group);\n\
  int fchown(int fd, uid_t owner, gid_t group);\nint lchown(const char *path, uid_t\
  \ owner, gid_t group);\n```\n\n`chown()` 作用于 `pathname` 参数，`fchown()` 作用于打开的文件，而\
  \ `lchown()` 作用于符号链接而不是符号链接所指向的文件。在所有其他方面，这三个调用的工作相同，成功时返回 `0`，错误时返回 `-1`。\n\n值得注意的是，有一个系统调用同时更改所有者和组。如果只想更改所有者或仅组，可以在相应位置传入\
  \ `-1`。\n\n你可能会想，“为什么允许更改符号链接的所有权？”因为在调用 `stat()` 和调用 `chown()` 之间，所有权可能发生了变化。这是一个竞态条件。某些系统允许用户更改文件的所有权（setuid\
  \ 和 setgid 文件在所有者更改时会移除相应的位这在从 `.tar` 或 `.cpio` 归档提取文件时可能是一个特殊问题；提取的文件属于归档中编码的 UID\
  \ 或 GID。在这些系统上，`tar` 和 `cpio` 程序有防止这种的选项，但知道 `chown()` 的行为在不同系统间是不同的很有重要的。允许用户更改他们的文件在某些系统上是完全合理的。考虑以下场景：\n\
  \n```bash\n$ mkdir mywork                     创建目录\n$ chmod go-rwx mywork      \
  \        设置权限\n$ cd mywork                        进入目录\n$ program > large_data_file\
  \      创建文件\n$ chmod ugo+rw large_data_file     设置权限\n$ chown otherguy large_data_file\
  \   交给 otherguy\n```\n\n在这个示例中，`large_data_file` 现在属于用户 `otherguy`。原用户可以继续读写该文件，因为权限允许。但\
  \ `otherguy` 将为其占用的空间付费。然而，由于它位于原用户 无法访问的目录中，`otherguy` 无法删除该文件。\n\n考虑到开发 BSD 系统的背景（它们是具有多用户磁盘配额的大型共享系统），这些限制是有意义的。尽管大多数桌面和笔记本\
  \ GNU/Linux 系统只有一个用户，但仍然允许多个用户，例如，家庭内部共享是完全合理的。\n\n某些遗留系统允许用户更改所有权（setuid 和 setgid\
  \ 文件在所有者更改时会移除相应的位）。在这些系统上，更改组是允许的，当然。我们将在第 6.3 节“用户和组名称”，第 190 页了解如何将用户和组名称与其对应的数值联系起来。\n\
  \n#### 5.6.2 修改权限：`chmod()` 和 `fchmod()`\n\n在第 4 章“文件和文件 I/O”，第 79 页以及本章的讨论之后，更改权限几乎是平淡的。它通过两个系统调用之一\
  \ `chmod()` 或 `fchmod()` 完成：\n\n```\n#include <sys/types.h>                    \
  \                         POSIX\n#include <sys/stat.h>\n\nint chmod(const char *path,\
  \ mode_t mode);\nint fchmod(int fd, mode_t mode);\n```\n\n\n\n\n`chmod()` 作用于路径参数，而\
  \ `fchmod()` 作用于已打开的文件。（POSIX 中没有 `lchmod()` 调用，因为系统会忽略符号链接上的权限设置。不过，某些系统确实有此调用。）与大多数其他系统调用一样，这些调用在成功时返回\
  \ `0`，失败时返回 `-1`。只有文件的所有者或 `root` 才能更改文件的权限。\n\n`mode` 值的创建方式与 `open()` 和 `creat()`\
  \ 相同，如 第 4.6 节，“创建文件”，第 101 页所述的。另见 表 5.2，该表列出了权限常量。\n\n如果文件的组与进程的有效组 ID 或其补充组之一不匹配，系统将不允许设置\
  \ setgid 位（`S_ISGID`）。（我们尚未详细讨论过这些问题；请参见 第 11.1.1 节，“实际 ID 和有效 ID”，第 383 页。）当然，这种检查不适用于\
  \ `root` 或以 `root` 运行的代码。\n\n### 5.6.3 使用 `fchown()` 和 `fchmod()` 保证安全\n\n的 Unix\
  \ 系统只有 `chown()` 和 `chmod()` 系统调用。然而，在负载较大的系统中，这些系统调用会受到竞态条件的影响，攻击者可以安排将正在更改所有权或权限的文件替换为另一个文件。\n\
  \n然而，一旦文件打开，竞态条件就不再是问题。程序可以使用 `stat()` 对路径获取文件信息。如果信息是预期的，那么在打开文件后，可以使用 `fstat()`\
  \ 验证文件是否相同（通过比较“之前”和“之后”`struct stat` 结构中的 `st_dev` 和 `st_ino` 字段）。\n\n一旦程序知道文件是同一个，就可以使用\
  \ `fchown()` 或 `fchmod()` 更改所有权或权限。\n\n扩展这一推理导致了后来引入的 `openat()` 以及各种其他的 `XXX` at()`\
  \ 系统调用（参见 表 5.3）。\n\n### 5.6.4 修改时间戳：`utime()` 及其后续者\n\nPOSIX 标准化了一系列系统调用用于更改文件的访问时间和修改时间。我们首先从原始的\
  \ Unix 系统调用开始讨论，然后转向较新的调用，它们在时间戳上具有更高的分辨率。\n\n#### 5.6.4.1 早期 Unix：`utime()`\n\n\
  原始的 `struct stat` 结构包含三个 `time_t` 类型的字段：\n\n*   `st_atime`: 文件最后被访问（读取）的时间。\n* \
  \  `st_mtime`: 文件最后被修改（写入）的时间。\n*   `st_ctime`: 文件的 inode 最后被更改的时间（例如，重命名）。\n\n\
  我们之前看到 `time_t` 值表示“自纪元以来的秒数”，且 `time_t` 值有时被称为时间戳。在 第 6.1 节，“时间与日期”，第 155 页中，我们查看了如何获取和使用这些值。目前，知道\
  \ `time_t` 值是什么以及它代表自纪元以来的秒数就足够。\n\n`utime()` 系统调用允许你更改文件的访问和修改时间戳：\n\n```c\n#include\
  \ <sys/types.h>                                   Common\n#include <utime.h>\n\n\
  int utime(const char *filename, struct utimbuf *buf);\n```\n\n`struct utimbuf` 如下：\n\
  \n```c\nstruct utimbuf {\n    time_t actime;  /* 访问时间 */\n    time_t modtime; /*\
  \ 修改时间 */\n};\n```\n\n如果调用成功，返回 `0`；否则返回 `-1`。如果 `buf` 为 `NULL`，则系统将访问时间和修改时间都设置为当前时间。\n\
  \n要更改其中一个时间而不更改另一个，你需要使用来自 `struct stat` 的原始值。例如：\n\n```c\n/* 为了简洁省略了错误检查 */\nstruct\
  \ stat sbuf;\nstruct utimbuf ut;\ntime_t now;\ntime(& now);                    \
  \        获取当前当天时间，见下一章\nstat(\"/some/file\", & sbuf);             填充 sbuf\nut.actime\
  \ = sbuf.st_atime;              访问时间保持不变\n\nut.modtime = now - (24 * 60 * 60); \
  \     将 modtime 设置为 24 小时前\n\nutime(\"/some/file\", & ut);              设置这些值\n\
  ```\n\n此时，你可能在问自己：“为什么有人想更改文件的访问和修改时间呢？”很好的问题。\n\n为了回答这个问题，考虑创建一个备份归档的程序，例如 `tar`\
  \ 或 `cpio`。这些程序必须读取文件内容以进行归档。当然，读取文件会更改文件的访问时间。\n\n然而，该文件可能在 10 年内没有被人类读取过。执行 `ls\
  \ -lu`（显示访问时间而非默认修改时间）的人应该看到最后最后读取是 10 年前。因此，备份程序应该保存原始的访问和修改时间，读取文件进行归档，然后使用 `utime()`\
  \ 还原原始时间（或者更好，使用我们稍后讨论的额外调用之一）。\n\n同样，考虑归档程序从归档恢复文件的情况。归档存储了文件的原始访问和修改时间。但当文件从归档提取到磁盘上新创建的副本时，新文件的访问和修改时间是当前的日期时间。\n\
  \n然而，如果新创建的文件看起来和归档中的原始文件一样老，会更有用。因此，归档程序需要将访问和修改时间设置为归档中存储的那些。\n\n`utime()` 系统调用不再是\
  \ POSIX 的一部分，但在实践中仍然可用，以兼容旧代码。\n\n#### 5.6.4.2 微秒时间分辨率：`utimes()`\n\n由于现代系统提供的时钟粒度小于一秒，随着时间的推移，增加了额外的函数用于设置分辨率大于一秒的时间戳。\n\
  \n其中第一个是 `utimes()`（注意名称最后的“s”）。此调用为你提供微秒级的时间分辨率：\n\n```c\n#include <sys/time.h>\
  \                                                POSIX XSI\n\nint utimes(const char\
  \ *filename, const struct timeval tvp[2]);\n```\n\n`tvp` 参数应该指向一个包含两个 `struct timeval`\
  \ 结构的数组；这些值分别用于访问时间和修改时间。如果 `tvp` 为 `NULL`，则系统使用当前当天时间。`struct timeval` 如下：\n\n\
  ```c\nstruct timeval {\n    ...\n    time_t       tv_sec;   /* 秒 */\n    suseconds_t\
  \  tv_usec;  /* 微秒 */\n    ...\n};\n```\n\nPOSIX 将此标记为“遗留”函数，意味着它仅标准化以支持旧代码，不应用于新应用程序。主要原因似乎没有定义的包含微秒值的获取访问和修改时间的接口；原始的\
  \ `struct stat` 只包含 `time_t` 值，而不是 `struct timeval` 值，而现代的包含 `struct timespec` 结构。\n\
  \n如果你在想：“天哪，有这么多时间相关的类型！”你是正确的。这是演化的结果，Unix 系统从较小的系统变为越来越强大的系统，具有越发精细的时钟分辨率。\n\n\
  #### 5.6.4.3 纳秒时间分辨率：`futimens()` 和 `utimensat()`\n\n最后，我们达到了当前用于纳秒级分辨率时间戳的函数集。我们之前见过\
  \ `struct timespec` 的定义：\n\n```c\nstruct timespec {\n    ...\n    time_t  tv_sec;\
  \   /* 秒 */\n    long    tv_nsec;  /* 纳秒 */\n    ...\n};\n```\n\n\n\n\n我们即将描述的系统调用使用了较新的模型来指定要操作的文件，你传递的是一个已打开的文件描述符，而不是文件名，或者是一个指向包含该文件的目录描述符（参见第\
  \ 5.5 节，“避免竞态条件：`openat()` 及其伙伴](#ch05.xhtml_ch05lev1sec5)”](第 144 页)）。第一个调用是 `futimens()`（“file-utime-nanoseconds”）：\n\
  \n```\n#include <sys/stat.h>                               POSIX\n\nint futimens(int\
  \ fd, const struct timespec times[2]);\n```\n\n参数为：\n\n*   `fd`: 指向要更新时间的文件的描述符。\n\
  *   `const struct timespec times[2]`: 一个 `struct timespec` 结构体数组，用于指定新的时间值。`times[0]`\
  \ 用于更新访问时间，`times[1]` 用于修改时间。在 `struct timespec` 的字段中可以使用某些特殊值，我们稍后会讨论。如果 `times`\
  \ 为 `NULL`，则两个值都被设置为当前时间。\n\n下一个函数的工作类似，但对符号链接的处理提供了额外的控制。它被称为 `utimensat()`（“utime-nanosecond-at”）：\n\
  \n```\n#include <fcntl.h>                               POSIX\n\nint utimensat(int\
  \ fd, const char *path,\n              const struct timespec times[2], int flag);\n\
  ```\n\n参数为：\n\n*   `fd`: 指向包含要更新时间的文件的目录的描述符。如果 `fd` 为特殊值 `AT_FDCWD`，则使用当前目录。\n\
  *   `path`: 给定目录下的文件名。绝对路径会导致忽略 `fd` 的值。如果 `fd` 是 `AT_FDCWD`，则相对路径被视为相对于当前目录的；否则，它是相对于打开文件描述符时指向的目录的。\n\
  *   `const struct timespec times[2]`: 如前述 `futimens()` 所示。\n*   `flag`: 该值通常应设置为零。但是，如果值为\
  \ `AT_SYMLINK_NOFOLLOW` 且给定的文件是符号链接，系统将更新链接的时间，而*不是*链接指向的文件的时间。\n\n`struct timespec`\
  \ 值中一个或两个 `tv_nsec` 字段的两个特殊值如下修改 `futimens()` 和 `utimensat()` 的行为：\n\n*   `UTIME_NOW`:\
  \ 将相关时间戳（访问时间或修改时间）设置为当前时间。\n*   `UTIME_OMIT`: 不更改相关时间戳。\n\n当使用任一特殊值时，相应的 `tv_sec`\
  \ 字段将被忽略。\n\n### 5.7 总结\n\n*   用户看到的文件和目录层次结构是一个逻辑树，根节点为 `/`。它由一个或多个存储分区组成，每个分区包含一个文件系统。在文件系统中，inode\
  \ 存储了关于文件的信息（元数据），包括文件数据块的位置。\n*   目录建立了文件名和 inode 之间的关联。从概念上说，目录内容只是 (inode, 名称)\
  \ 对的序列。文件的每个目录条目被称为（硬）链接，文件可以有多个链接。由于硬链接仅通过 inode 号工作，因此所有硬链接必须位于同一个文件系统中。符号（软）链接是指向文件或目录的指针，它们基于文件名而非\
  \ inode 号工作，因此不受限制必须位于同一个文件系统中。\n*   硬链接通过 `link()` 创建，符号链接通过 `symlink()` 创建，链接通过\
  \ `unlink()` 删除，文件通过 `rename()` 重命名（可能被移动到另一个目录）。在链接计数归零且该文件的最后一个打开的文件描述符关闭之前，文件的数据块不会被回收。\n\
  *   目录通过 `mkdir()` 创建，通过 `rmdir()` 删除；目录在删除之前必须是为空的（除了 `.` 和 `..` 之外无任何内容）。GNU/Linux\
  \ 版本的 ISO C `remove()` 函数会根据情况调用 `unlink()` 或 `rmdir()`。\n*   目录通过 `opendir()`、`readdir()`、`rewinddir()`\
  \ 和 `closedir()` 处理。`struct dirent` 包含 inode 号和文件名。具有最大可移植性的代码只使用 `d_name` 成员中的文件名。用于保存和恢复目录当前位置的\
  \ BSD `telldir()` 和 `seekdir()` 函数广泛可用，甚至包含在 POSIX 中，但它们的可移植性不如其他目录处理函数完全。GNU/Linux\
  \ 和 BSD 在 `struct dirent` 的 `d_type` 成员中提供了文件类型信息。\n*   文件元数据通过 `stat()` 系列系统调用获取；`struct\
  \ stat` 结构包含了关于文件的所有信息，*除了*文件名。（事实上，由于一个文件可能有多个名称，甚至可能被完全取消链接，因此无法提供名称。）\n*   `<sys/stat.h>`\
  \ 中的 `S_IS` `xxx()` 宏使得确定文件类型可能。`<sys/sysmacros.h>` 中的 `major()` 和 `minor()` 函数使得解码表示块设备和字符设备的\
  \ `dev_t` 值可能。可以使用 `lstat()` 检查符号链接，符号链接的 `struct stat` `st_size` 字段返回持有名称所需的字节数。必须确保缓冲区大小正确，并以尾随零终止所获取的名称。\n\
  *   另一组系统调用通过接收一个已打开的目录的描述符、文件名以及所需的任何额外信息来工作。这些系统调用提供了防止竞态条件的保护。\n*   若干杂杂系统调用更新其他文件信息：用于所有者和组的\
  \ `chown()` 系列，用于权限的 `chmod()` 例程，以及用于更改访问和修改时间的 `utime()` 系列。\n\n### 练习\n\n1. \
  \ 编写一个例程 `const char *fmt_mode(mode_t mode)`。输入是由 `struct stat` 的 `st_mode` 字段提供的\
  \ `mode_t` 值；即它包含权限位和文件类型。输出应该是一个 10 个字符的字符串，与 `ls -l` 输出的第一个字段相同。句话说，第一个字符识别文件类型，其他九个字符识别权限。\n\
  \n    当 `S_ISUID` 和 `S_IXUSR` 位被设置时，使用 `s` 代替 `x`；如果只设置了 `S_ISUID` 位，使用 `S`。对于 `S_ISGID`\
  \ 和 `S_IXGRP` 位也是如此。\n\n    当 `S_ISVTX` 和 `S_IXOTH` 位都被设置时，使用 `t`；对于单独 `S_ISVTX`\
  \ 使用 `T`。\n\n    为了简单起见，你可以使用 `static` 缓冲区，其内容在每次调用例程时被重写。\n2.  扩展 `ch-fileinfo-catdir.c`，对找到每个文件调用\
  \ `stat()`。然后打印 inode 号、`fmt_mode()` 的结果、链接计数和文件名。\n3.  进一步扩展 `ch-fileinfo-catdir.c`，使得如果文件是符号链接，它也将打印指向的文件名。\n\
  4.  添加一个选项，如果文件名是子目录，程序将递归进入该子目录并打印子目录的文件（和目录）的信息。只需要一层递归。\n5.  如果你没有使用 GNU/Linux\
  \ 系统，在你的系统上运行 `ch-fileinfo-trymkdir`（参见第 5.2 节，“创建和删除目录](#ch05.xhtml_ch05lev1sec5)”](第\
  \ 121 页)）并将结果与我们展示的比较。\n6.  编写 `mkdir` 程序。查看本地的 *mkdir*(1) 手页并实现其所有选项。\n7.  在根目录\
  \ `/` 中，`.` 和 `..` 的设备号和 inode 号相同。利用这一信息，编写 `pwd` 程序。\n\n\n\n程序必须通过读取父目录的内容来找到当前目录的名称。然后它必须继续沿着文件系统的层级向上移动，直到到达根目录。\n\
  \n从当前目录到根目录倒序打印目录名很容易。但你的 `pwd` 版本将如何以从根目录开始正确的方式打印目录名呢？\n\n8. 如果你使用递归编写了 `pwd`，请使用迭代重写一遍。如果你使用迭代，请使用递归重写。哪种更好？（提示：考虑非常深嵌套的目录树。）\n\
  \n9. （困难。）阅读 `chmod`(1) 手页。编写代码来解析符号选项参数，该参数允许根据用户、组、其他用户以及“所有”来添加、删除和设置权限。\n\n\
  当你认为它能够正常工作时，编写你自己的 `chmod` 版本，将权限规范应用到命令行中指定的每个文件或目录。\n\n你使用了哪个函数——`chmod()`，还是\
  \ `open()` 和 `fchmod()`——以及为什么？\n\n## 第 6 章\n\n## 通用库接口——部分 1\n\n我们在第 5 章中的目录和文件元数据\
  \ 第 111 页看到，直接读取目录返回的文件名按照它们在目录中存储的顺序排列。我们还看到 `struct stat` 包含了文件的所有信息，除了名称外。然而，该结构体的某些组件无法直接使用；它们只是数值。\n\
  \n本章介绍了充分利用 `struct stat` 组件值所需的其余 API。我们按顺序涵盖了以下主题：用于表示时间的 `time_t` 值和时间格式化函数；排序和搜索函数（用于排序文件名或任何其他数据）；表示用户和组的\
  \ `uid_t` 和 `gid_t` 类型，以及它们与相应的用户和组名转换的函数；最后，一个测试文件描述符是否代表终端的函数。\n\nPOSIX 系统拥有比本章多得多的通用\
  \ API。我们将在稍后介绍更多内容，在第 13 章 通用库接口——部分 2 第 419 页以及第 16 章 扩展接口 第 557 页。\n\n### 6.1\
  \ 时间与日期\n\n时间值存储在名为 `time_t` 的类型中。ISO C 标准保证这是一个数值类型，但没有规定它具体是什么（整数还是浮点数），或者其中存储的值的范围或精度。\n\
  \n在 GNU/Linux 和 Unix 系统上，`time_t` 值表示“自纪元以来的秒数”。*纪元*Epoch）是记录时间的起点，即 UTC 1970 年\
  \ 1 月 1 日午夜。在大多数系统中，`time_t` 是一个 C `long int`。对于 32 位系统，这意味着 `time_t` 将在 2038 年\
  \ 1 月 19 日某时候“溢出”。到那时，我们希望所有人都会使用 64 位系统（或更大！），`time_t` 类型至少有 64 位。\n\n存在各种函数来获取当前时间、计算两个\
  \ `time_t` 值之间的差值、将 `time_t` 值转换为更易用的表示，并将这两种表示格式化为字符字符串。此外，可以将日期时间表示转换回 `time_t`，并提供有限的时区信息。\n\
  \n另一组函数提供了比一秒更高的分辨率当前时间访问。这些函数通过提供两个离散值来工作：自纪元以来的秒数，以及当前秒内的微秒或纳秒数。这些函数在书的后部分介绍，在第\
  \ 16.3.1 节](#ch16.xhtml_ch16lev2sec5) “微秒级：`gettimeofday()`，” 第 567 页 以及第 16.3.2\
  \ 节](#ch16.xhtml_ch16lev2sec6) “纳秒级：`clock_gettime()``,” 第 569 页。\n\n数据结构在第 5.6.4\
  \ 节](#ch05.xhtml_ch05lev2sec17) “更改时间戳：`utime()` 及其替代者” 第 148 页 中简要介绍。\n\n## 6.1.1\
  \ 获取当前时间：`time()` 和 `difftime()`\n\n`time()` 系统调用获取当前的日期和时间；`difftime()` 计算两个 `time_t`\
  \ 值之间的差值：\n\n```\n#include <time.h>                                     ISO C\n\n\
  time_t time(time_t *t);\ndouble difftime(time_t time1, time_t time0);\n```\n\n`time()`\
  \ 返回当前时间。如果参数 `t` 不是 `NULL`，则 `t` 指向的值也会填充当前时间。如果发生错误，它返回 `(time_t) –1` 并设置 `errno`。\n\
  \n尽管 ISO C 没有规定 `time_t` 值中包含什么，但 POSIX 指明它表示秒级的时间。因此，做出这种假设是常见且具有可移植性的。例如，要检查一个时间值是否代表六个月或更久以前的时间，可以使用如下代码：\n\
  \n```\n/* 为了简洁起见省略了错误检查 */\ntime_t now, then, some_time;\n\ntime(& now);       \
  \                                获取当前时间\nthen = now - (6L * 31 * 24 * 60 * 60);\
  \             大约六个月前\n\n… 通过 stat() 设置 some_time，例如 …\nif (some_time < then)\n \
  \  /* 过去 6 个月以前 */\nelse\n   /* 过去 6 个月以内 */\n```\n\n然而，由于严格的可移植性代码可能需要在非 POSIX\
  \ 系统上运行，因此存在 `difftime()` 函数来产生两个时间之间的差值。使用 `difftime()` 的相同测试将写如下所示：\n\n```\ntime_t\
  \ now, some_time;\nconst double six_months = 6.0 * 31 * 24 * 60 * 60;\n\ntime(&\
  \ now);                                       获取当前时间\n… 通过 stat() 设置 some_time，例如\
  \ …\n\nif (difftime(now, some_time) >= six_months)\n   /* 过去 6 个月以前 */\nelse\n \
  \  /* 过去 6 个月以内 */\n```\n\n`difftime()` 的返回类型是 `double`，因为 `time_t` 也可能表示分数秒。在 POSIX\
  \ 系统上，它始终表示整数秒。\n\n在前面的每个示例中，注意使用类型常量来强制使用正确的数学运算类型进行计算：第一个实例中的 `6L` 用于 `long` 整数；第二个实例中的\
  \ `6.0` 用于浮点数。\n\n### 6.1.2 拆解时间：`gmtime()` 和 `localtime()`\n\n在实践中，日期时间的“自纪元以来的秒数”形式除了简单的比较外并不很有用。自己计算时间的组成部分（如月、日、年等）很容易出错，因为必须考虑本地时区（可能带有夏令时）、必须正确计算闰年等等。幸运的是，有两个标准例程为你完成这项工作：\n\
  \n```\n#include <time.h>                                      ISO C\n\nstruct tm\
  \ *gmtime(const time_t *timep);\nstruct tm *localtime(const time_t *timep);\n```\n\
  \n`gmtime()` 返回一个指向 `struct tm` 的指针，表示 UTC 时间。`localtime()` 返回一个指向 `struct tm` 的指针，表示本地时间；也就是说它考虑了当前的时区和夏令时。实际上，这是“墙上时间”，即在挂钟或腕手表上显示的日期和时间。（关于其工作原理稍后讨论；请参见第\
  \ 6.1.6 节](#ch06.xhtml_ch06lev2sec6) “获取时区信息,” 第 168 页。）\n\n这两个函数都返回一个指向 `struct\
  \ tm` 的指针，其结构如下：\n\n\n\n\n\n```c\nstruct tm {\n    int     tm_sec;         /* 秒\
  \ */\n    int     tm_min;         /* 分钟 */\n    int     tm_hour;        /* 小时 */\n\
  \    int     tm_mday;        /* 月中的日 */\n    int     tm_mon;         /* 月份 */\n\
  \    int     tm_year;        /* 年 */\n    int     tm_wday;        /* 星期 */\n   \
  \ int     tm_yday;        /* 一中的中的数 */\n    int     tm_isdst;       /* 夏令时 */\n\
  };\n```\n\n`struct tm` 被称为“分解时间”（broken-down time），因为 `time_t` 值被“拆解”成了它的各个组成部分。这些组成部分、范围及其含义见表\
  \ 6.1。\n\n| 成员变量 | 范围 | 含义 |\n| --- | --- | --- |\n| `tm_sec` | 0–60 | 分钟内的秒。第 60\
  \ 秒用于闰秒。 |\n| | | (C90 的范围为 0–61。) |\n| `tm_min` | 0–59 | 小时内的分钟。 |\n| `tm_hour`\
  \ | 0–23 | 一天内的小时。 |\n| `tm_mday` | 1–31 | 月中的日。 |\n| `tm_mon` | 0–11 | 年中的月份。 |\n\
  | `tm_year` | 0–N | 自 1900 年以来的年数。 |\n| `tm_wday` | 0–6 | 星期，星期日 = 0。 |\n| `tm_yday`\
  \ | 0–365 | 年中的日数，1 月 1 日 = 0。 |\n| `tm_isdst` | < 0, 0, > 0 | 夏令时标志。 |\n\n**表 6.1:**\
  \ `struct tm` 中的字段\n\nISO C 标准将这些大部分值表示为“自 *y* 以来的 *x* 个”。例如，`tm_sec` 是“自分钟以来的秒”，`tm_mon`\
  \ 是“自一月以来的月份”，`tm_wday` 是“自星期日以来的天”，以此此类推。这有助于理解为什么所有值都从 `0` 开始。（逻辑上，唯一的例外是 `tm_mday`，即月中的日，它的范围是\
  \ 1–31。）当然，让它们从零开始也是很实用的；由于 C 数组是从零开始索引的，这使得这些值作为索引变得轻而易举：\n\n```c\nstatic const\
  \ char *const days[] = {                        星期几名称数组\n    \"Sunday\", \"Monday\"\
  , \"Tuesday\", \"Wednesday\",\n    \"Thursday\", \"Friday\", \"Saturday\",\n};\n\
  time_t now;\nstruct tm *curtime;\n\ntime(& now);                               \
  \                获取当前时间\ncurtime = gmtime(& now);                              \
  \     拆解\nprintf(\"Day of the week: %s\\n\", days[curtime->tm_wday]);   索引并打印\n\
  ```\n\n`gmtime()` 和 `localtime()` 都返回一个指向 `struct tm` 的指针。该指针指向每个例程维护的 `static struct\
  \ tm`，并且在每次调用例程时，这些 `struct tm` 结构体可能会被重写。因此，对结构体进行拷贝是一个好主意。重复之前的示例：\n\n```c\nstatic\
  \ const char *const days[] = { /* 如前所示 */ };\ntime_t now;\nstruct tm curtime;  \
  \                                       结构体，而非指针\n\ntime(& now);               \
  \                                获取当前时间\ncurtime = *gmtime(& now);             \
  \                     拆解并复制数据\nprintf(\"Day of the week: %s\\n\", days[curtime.tm_wday]);\
  \    索引并打印，使用 . 而不是 ->\n```\n\n`tm_isdst` 字段表示当前是否实施了夏令时（DST）。值为 `0` 表示夏令时未生效，正值表示已生效，负值表示没有可用的夏令时信息。（C\
  \ 标准故意写得很模糊，只指示了零、正数或负数；这为实现者提供了最大的自由度。）\n\n### 6.1.3 格式化日期和时间\n\n上一节的示例展示了如何使用\
  \ `struct tm` 中的字段来索引字符串数组，以打印包含信息丰富的日期和时间值。虽然你可以编写自己的代码使用此类数组来格式化日期和时间，但标准例程减轻了这项工作。\n\
  \n#### 6.1.3.1 简单时间格式化：`asctime()` 和 `ctime()`\n\n下面列出的两个标准例程产生固定格式的输出：\n\n```c\n\
  #include <time.h>                                  ISO C\n\nchar *asctime(const\
  \ struct tm *tm);\nchar *ctime(const time_t *timep);\n```\n\n与 `gmtime()` 和 `localtime()`\
  \ 一样，`asctime()` 和 `ctime()` 返回指向 `static` 缓冲区的指针，这些在每次调用时可能会被重写。此外，这两个例程返回相同格式的字符串。它们区别在于接受的参数类型。当你只需要简单的日期时间信息时，应该使用\
  \ `asctime()` 和 `ctime()`：\n\n```c\n#include <stdio.h>\n#include <time.h>\n\nint\n\
  main(void)\n{\n    time_t now;\n\n    time(& now);\n    printf(\"%s\", ctime(& now));\n\
  }\n```\n\n运行时，该程序产生如 `Sun May 25 16:32:2025\\n` 格式的输出。`asctime()` 和 `ctime()` 返回指向\
  \ `static` 缓冲区的指针，这些在每次调用时可能会被重写。此外，这两个例程返回相同格式的字符串。它们区别在于接受的参数类型。当你只需要简单的日期时间信息时，应该使用\
  \ `asctime()` 和 `ctime()`：\n\nISO C 标准将这些大部分值表示为“自 *y* 以来的 *x* 个”。例如，`tm_sec` 是“自分钟以来的秒”，`tm_mon`\
  \ 是“自一月以来的月份”，`tm_wday` 是“自星期日以来的天”，以此此类推。这有助于理解为什么所有值都从 `0` 开始。（逻辑上，唯一的例外是 `tm_mday`，即月中的日，它的范围是\
  \ 1–31。）当然，让它们从零开始也是很实用的；由于 C 数组是从零开始索引的，这使得这些值作为索引变得轻而易举：\n\n**表 6.1:** `struct\
  \ tm` 中的字段\n\n#### 6.1.3.2 复杂时间格式化：`strftime()`\n\n虽然 `asctime()` 和 `ctime()` 通常足够用，但它们也有局限性：\n\
  * 输出格式是固定的。\n* 输出不包含时区信息。\n* 输出假设使用英文名称。\n\n格式字符串包含字面字符，其中夹杂着指示要放入字符串内容的占位符，例如完整的星期名称、根据\
  \ 24 小时或 12 小时制的小时、a.m. 或 p.m. 标记。`strftime()` 类似于 `sprintf()`。参数为：\n* `char *s`:\
  \ 用于存放格式化后字符串的缓冲区。\n* `size_t max`: 缓冲区的大小。\n* `const char *format`: 格式字符串。\n* `const\
  \ struct tm *tm`: 表示要格式化的分解时间的 `struct tm` 指针。\n\n如果整个字符串可以在 `max` 个字符内完成格式化，则返回值为放入\
  \ `s` 中的字符数，不包括末尾的零终止。否则，返回值为 `0`。在后一种情况下，`s` 的内容是“不确定的”。下面的简单示例展示了 `strftime()`\
  \ 的用法：\n\n```c\n#include <stdio.h>\n#include <stdlib.h>\n#include <time.h>\n\nint\n\
  main(void)\n{\n    char buf[100];\n    time_t now;\n    struct tm *curtime;\n\n\
  \    time(& now);\n    curtime = localtime(& now);\n    (void) strftime(buf, sizeof\
  \ buf,\n            \"It is now %A, %B %d, %Y, %I:%M %p\", curtime);\n\n    printf(\"\
  %s\\n\", buf);\n    exit(0);\n}\n```\n\n运行时，此程序打印类似的内容：\n\n````\nSunday, May 25,\
  \ 2025, 04:34 PM\n```\n\n表 6.2 提供了转换占位符的完整列表、可能的替代表示及其含义。\n\n| 占位符(s) | 含义 |\n|\
  \ --- | --- |\n| %a | 语言环境的缩写星期名称。 |\n| %A | 语言环境的完整星期名称。 |\n| %b`, `%Ob` | 语言环境的缩写月份名称。\
  \ |\n| %B`, `%OB` | 语言环境的完整月份名称。 |\n| %c`, `%Ec` | 语言环境的“适当”日期和时间表示。 |\n| %C`, `%EC`\
  \ | 世纪（00–99）。 |\n| %d`, `%Od` | 月中的日（01–31）。 |\n| %D | 等于 `%m/%d/%y`。 |\n| %e`,\
  \ `%Oe` | 月中的日。单个数字前有一个空格（1–31）。 |\n\n\n\n\n\n| `%F` | 与 `%Y-%m-%d` 相同（ISO 8601\
  \ 日期格式）。 |\n| `%g` | 周年份的最后两位数字（`00`–`99`）。 |\n| `%G` | ISO 8601 周年份。 |\n| `%h`\
  \ | 与 `%b` 相同。 |\n| `%H`, `%OH` | 24 小时制小时（`00`–`23`）。 |\n| `%I`, `%OI` | 12 小时制小时（`01`–`12`）。\
  \ |\n| `%j` | 一年中的第（`001`–`366`）。 |\n| `%m`, `%Om` | 数字形式的月份（`01`–`12`）。 |\n| `%M`,\
  \ `%OM` | 数字形式的分钟（`00`–`59`）。 |\n| `%n` | 换行字符（``\\n`）。 |\n| `%p` | 区域的 AM/PM 标记。\
  \ |\n| `%r` | 区域的 12 小时制时间。 |\n| `%R` | 与 `%H:%M` 相同。 |\n| `%S`, `%OS` | 数字形式的秒（`00`–`60`）。\
  \ |\n| `%t` | 制表符字符（``\\t`）。 |\n| `%T` | 与 `%H:%M:%S` 相同（ISO 8601 时间格式）。 |\n| `%u`,\
  \ `%Ou` | ISO 8601 星期几，周一 = 1（`1`–`7`）。 |\n| `%U`, `%OU` | 周数，第一个星期日为第一周的第一天（`00`–`53`）。\
  \ |\n| `%V`, `%OV` | ISO 8601 周数（`01`–`53`）。 |\n| `%w`, `%Ow` | 数字形式的星期，星期日 = 0（`0`–`6`）。\
  \ |\n| `%W`, `%OW` | 周数，第一个周一为第一周的第一天（`00`–`53`）。 |\n| `%x`, `%Ex` | 区域的“适当”日期表示。\
  \ |\n| `%X`, `%EX` | 区域的“适当”时间表示。 |\n| `%y`, `%Ey`, `%Oy` | 年份的最后两位数字（`00`–`99`）。\
  \ |\n| `%Y`, `%EY` | 数字形式的年份。 |\n| `%z` |  UTC 时区偏移，格式为 `+hhmm` 或 `-hhmm`。 |\n|\
  \ `%Z` | 区域的时区，如果没有可用的时区信息，则为空字符。 |\n| `%%` | 单个 `%`。 |\n\n**表 6.2:** `strftime()`\
  \ 转换格式说明符\n\n*区域*（locale）是一种描述当前位置的方法，它考虑了如语言、字符集以及日期、时间和货币金额格式的默认值等因素。我们在第 15 章“国际化与本地化”、第\
  \ 507 页中处理它们。目前，只需要理解 `strftime()` 对于相同格式字符串产生的结果可能会根据当前区域而变化即可。\n\n以 `%E` 和 `%O`\
  \ 开头的版本用于“备用表示”。某些区域有多种方式表示相同的内容；这些说明符提供了对额外表示的访问。如果特定区域不支持备用表示，则 `strftime()` 使用标准版本。\n\
  \n许多 Unix 版本的 `date` 允许你在命令行上提供以 `+` 字符开头的格式字符串。随后 `date` 将会根据格式字符串格式化当前日期和时间并打印出来：\n\
  \n```\n$ date +'It is now %A, %B %d, %Y, %I:%M %p'\nIt is now Sunday, May 25, 2025,\
  \ 04:35 PM\n```\n\n输出取决于当前区域（系统认为你处于世界的哪个位置；区域和控制它们的环境变量将在稍后的第 15.2 节中讨论，即“区域与 C\
  \ 标准库”在第 508 页。例如，通过将环境变量 `LC_ALL` 设置为 `it_IT.utf8`（意大利），我们可能会得到类似的内容：\n\n```\n\
  $ LC_ALL=it_IT.utf8 date +'It is now %A, %B %d, %Y, %I:%M %p'\nIt is now domenica,\
  \ maggio 25, 2025, 04:36\n```\n\n注意，尽管格式字符串中有 `%p`，但并没有 a.m./p.m. 的指示。通过将 `LC_ALL`\
  \ 设置为 `C`，我们可以得到传统的 Unix 输出：\n\n```\n$ LC_ALL=C date +'It is now %A, %B %d, %Y,\
  \ %I:%M %p'\nIt is now Sunday, May 25, 2025, 04:35 PM\n```\n\n`strftime()` 的许多说明符源于现有的\
  \ Unix `date` 实现。`%n` 和 `%t` 格式在 C 中并不是严格必要的，因为制表符和换行符已经存在。`strftime()` 的许多说明符源于现有的\
  \ Unix `date` 实现。`%n` 和 `%t` 格式在 C 中并不是严格必要的，因为制表符和换行符已经存在。`strftime()` 的许多说明符源于现有的\
