  \            parse_signal_action_params (optarg, true);\n785            parse_block_signal_params\
  \ (optarg, false);\n786            break;\n787          case IGNORE_SIGNAL_OPTION:\n\
  788            parse_signal_action_params (optarg, false);\n789            break;\n\
  790          case BLOCK_SIGNAL_OPTION:\n791            parse_block_signal_params\
  \ (optarg, true);\n792            break;\n793          case LIST_SIGNAL_HANDLING_OPTION:\n\
  794            report_signal_handling = true;\n795            break;\n796      \
  \    case 'C':\n797            newdir = optarg;\n798            break;\n799    \
  \      case 'S':\n800            parse_split_string (optarg, &optind, &argc, &argv);\n\
  801            break;\n802          case ' ': case '\\t': case '\\n': case '\\v':\
  \ case '\\f': case '\\r':\n803            /* These are undocumented options.  Attempt\
  \ to detect\n804               incorrect shebang usage with extraneous space, e.g.:\n\
  805                  #!/usr/bin/env -i command\n806               In which case\
  \ argv[1] == \"-i command\".  */\n807            error (0, 0, _(\"invalid option\
  \ -- '%c'\"), optc);\n808            error (0, 0, _(\"use -[v]S to pass options\
  \ in shebang lines\"));\n809            usage (EXIT_CANCELED);\n810\n811       \
  \   case_GETOPT_HELP_CHAR;\n812          case_GETOPT_VERSION_CHAR (PROGRAM_NAME,\
  \ AUTHORS);\n813          default:\n814            usage (EXIT_CANCELED);\n815 \
  \         }\n816      }\n818\n819    if (optind < argc && STREQ (argv[optind], \"\
  -\"))\n820      {\n821        ignore_environment = true;\n822        ++optind;\n\
  823      }\n```\n\n特别值得注意的是 `-u` 选项的操作（第 774–775 行）。它通过调用 `append_unset_var()` 取消给定的环境变量，该函数会将变量添加到动态创建的变量数组中。稍后我们将展示这一点。\n\
  \n以下是 Coreutils 发行版 `src/system.h` 中的宏，它们定义了之前看到的声明以及上方使用的 `case_GETOPT_xxx` 宏（第\
