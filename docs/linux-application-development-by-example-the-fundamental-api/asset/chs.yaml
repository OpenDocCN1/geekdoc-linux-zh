  \n“User Product”（用户产品）是指 (1) “消费产品”，即任何通常用于个人、家庭或家用用途的有形个人财产；或 (2) 任何设计或销售用于整合房屋的物品。在判断一种产品是否为消费产品时，疑点情况应倾向于涵盖范围。对于特定用户收到的特定产品，“通常使用”指的是该类产品的典型或常见用途，无论特定用户的状态或该特定用户实际使用、预期或被预期使用该产品的方式。无论产品是否具有实质性的商业、工业或非消费用途，该产品都是消费产品，除非此类用途构成了该产品唯一的显著用途模式。\n\
