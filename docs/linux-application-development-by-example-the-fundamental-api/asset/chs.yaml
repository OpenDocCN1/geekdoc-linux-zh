  \ | `sigismember()` | `wcsstr()` |\n| `htonl()` | `siglongjmp()` | `wcstok()` |\n\
  | `htons()` | `signal()` | `wmemchr()` |\n| `kill()` | `sigpending()` | `wmemcmp()`\
  \ |\n| `killpg()` | `sigprocmask()` | `wmemcpy()` |\n| `le16toh()` | `sigqueue()`\
  \ | `wmemmove()` |\n| `le32toh()` | `sigsuspend()` | `wmemset()` |\n| `le64toh()`\
  \ | `sleep()` | `write()` |\n| `link()` | `sockatmark()` | `writev()` |\n| `linkat()`\
