  \ User:/usr/jane:/bin/sh\n    ```\n2. 考虑 `makename()` 函数。它可以使用 `sprintf()` 来生成拼接的名字吗？为什么或为什么？\n\
  3. `readdir()` 中的第 319–320 行真的是必要的吗？\n4. 取出你为“第 6 章 练习]第 198 页”编写的 `stat` 程序。添加\
