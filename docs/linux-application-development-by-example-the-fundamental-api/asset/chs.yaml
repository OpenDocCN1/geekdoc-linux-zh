  \ GNU/Linux 系统上，`sleep()` 不与间隔定时器交互。然而，对于可移植程序，你不能做出此假设。\n\n与 `gettimeofday()` 一样，这些函数自\
  \ 4.2 BSD 以来一直存在，但也从 2024 年的 POSIX 标准中移除。尽管如此，我们认为描述它们是安全的，因为它们不太可能在短期内消失。\n\n###\
  \ 16.3.4 更精确的暂停：`nanosleep()`\n\n`sleep()` 函数（参见第 10.8.1 节，“闹钟计时：`sleep()`、`alarm()`\
  \ 和 `SIGALRM`](#ch10.xhtml_ch10lev2sec18)、第 363 页）允许程序睡眠指定的秒数。但正如我们所见，它只接受整数秒，这使得无法进行短时间延迟，而且它可能与\
  \ `SIGALRM` 处理程序产生交互。`nanosleep()` 函数弥补了这些缺陷：\n\n```\n#include <time.h>        \
  \                                         POSIX\n\nint nanosleep(const struct timespec\
  \ *req, struct timespec *rem);\n```\n\n这两个参数是请求的睡眠时间，以及如果睡眠提前返回时的剩余时间（如果 `rem` 不为\
  \ `NULL`）。这两个值都是 `struct timespec` 类型：\n\n```\nstruct timespec {\n    ...\n    time_t\
  \ tv_sec;            /* 秒 */\n    long tv_nsec;             /* 纳秒，可能是不同的类型 */\n\
  \    ...\n};\n```\n\n`tv_nsec` 值必须在 0–999,999,999 范围之间。与 `sleep()` 一样，取决于内核何时以及如何调度进程执行，睡眠的时间可能会超过请求的时间。\n\
  \n与 `sleep()` 不同，`nanosleep()` 与任何信号均无交互，因此通常更安全且更易于使用。\n\n如果进程睡眠了完整时间，则返回值为 `0`。否则，返回\
  \ `–1`，并通过 `errno` 指明错误。特别地，如果 `errno` 为 `EINTR`，则 `nanosleep()` 被信号中断了。在这种情况下，如果\
  \ `rem` 不为 `NULL`，它所指向的 `struct timespec` 将被填充为剩余的睡眠时间。这便于再次调用 `nanosleep()` 以继续睡眠。\n\
  \n尽管看起来有点奇怪，但对两个参数使用同一个结构体是完全可以：\n\n```\nstruct timespec sleeptime = /* 任意值 */ ;\n\
  int ret;\n\nret = nanosleep(& sleeptime, & sleeptime);\n```\n\n`struct timeval`\
  \ 和 `struct timespec` 彼此相似，仅在于第二个部分的单位不同。GLIBC 的 `<sys/time.h>` 头文件定义了两个用于相互转换的有用宏：\n\
  \n```\n#define __USE_GNU 1\n#include <sys/time.h>                              \
  \              GLIBC\n\nvoid TIMEVAL_TO_TIMESPEC(struct timeval *tv, struct timespec\
  \ *ts);\nvoid TIMESPEC_TO_TIMEVAL(struct timespec *ts, struct timeval *tv);\n```\n\
  \n它们是这样的定义：\n\n```\n#ifdef __USE_GNU\n/* 用于在 'struct timeval' 和 'struct timespec'\
  \ 之间转换的宏。 */\n# define TIMEVAL_TO_TIMESPEC(tv, ts) {                           \
  \        \\\n    (ts)->tv_sec = (tv)->tv_sec;                                  \
  \ \\\n    (ts)->tv_nsec = (tv)->tv_usec * 1000;                          \\\n}\n\
  # define TIMESPEC_TO_TIMEVAL(tv, ts) {                                     \\\n\
  \    (tv)->tv_sec = (ts)->tv_sec;                                   \\\n    (tv)->tv_usec\
  \ = (ts)->tv_nsec / 1000;                          \\\n}\n#endif\n```\n\n如你所见，你必须定义\
  \ `__USE_GNU` 才能访问这些宏。每当如此时，必须在包含任何头文件之前定义它。\n\n**注意**\n\n某些系统调用使用微秒级精度而另一些使用纳秒级精度，这确实令人困惑。原因是历史性的：微秒级调用是在硬件时钟没有更高分辨率的系统上开发的，而纳秒级调用是较晚开发的，针对具有更高分辨率的系统。\n\
  \n（注：此处原文似乎出现了重复或混乱，已根据上下文逻辑重新梳理）\n[/content]\n```\n\n抱歉，我发现在处理最后一段文本时，你提供的待翻译文本最后部分似乎是另一段完全不同的内容（关于二叉树的描述），且与前面的\
  \ `nanosleep` 章节完全不符。我根据你提供的“需要翻译的文本”最后一段进行了翻译。如果那部分内容是误粘贴，请告知。\n\n**纠正说明：** 你提供的“需要翻译的文本”中从\
  \ `It is indeed confusing...` 之后突然变成了关于 `Binary Tree`的描述。我已针对该部分内容进行了翻译：\n\n[content]\n\
  某些系统调用使用微秒级精度而另一些使用纳秒级精度，这确实令人困惑。原因是历史性的：微秒级调用是在硬件时钟没有更高分辨率的系统上开发的，而纳秒级调用是较晚开发的，针对具有更高分辨率的系统。\n\
  \n**注意**\n\n（注：此处原文似乎出现了重复或混乱，已根据上下文逻辑重新梳理）\n\n\n\n普通二叉树的特征是节点拥有的最多两个孩子。（拥有超过两个子节点的树是有用的，但与此处不相关。）这些子节点分别称为左子节点和右子节点。\n\
  \n二叉搜索树的进一步特征在于：存储在左子节点中的值总是小于节点本身存储的值，而存储在右子节点中的值总是大于节点本身的值。这意味着树中没有重复值。这一事实也解释了为什么树对预先排序的数据处理得并不好：取决于排序顺序，每个新数据项最终都将存储在它之前的某一个项的左侧或右侧，从而形成一个简单的线性列表。\n\
  \n二叉树上的操作如下：\n\n*   **插入（Insertion）**：向树中添加新数据项。\n*   **查找（Lookup）**：在树中寻找一个数据项。\n\
  *   **删除（Removal）**：从树中移除一个数据项。\n*   **遍历（Traversal）**：对树中存储的每一个项执行某些操作。（这与遍历文件系统层次结构相似，正如我们在第\
  \ 8.4.3.2 节中所示，“处理文件树流”，以及第 252 页。）树遍历也被称为树行走（tree walks）。有多种方法可以“访问”存储在树中的项。这里讨论的仅实现了其中一种方法。我们稍后对此进行更多说明。\n\
  \n### 16.4.2 树管理函数\n\n上述操作对应于以下函数：\n\n```\n#include <search.h>                 \
  \                             POSIX XSI\n\nvoid *tsearch(const void *key, void **rootp,\n\
  \                int (*compare)(const void *, const void *));\nvoid *tfind(const\
  \ void *key, const void **rootp,\n                int (*compare)(const void *, const\
  \ void *));\nvoid *tdelete(const void *key, void **rootp,\n                int (*compare)(const\
  \ void *, const void *));\n\ntypedef enum { preorder, postorder, endorder, leaf\
  \ } VISIT;\nvoid twalk(const void *root,\n        void (*action)(const void *nodep,\
  \ const VISIT which, const int depth));\n\n#define _GNU_SOURCE 1\n#include <search.h>\n\
  \nvoid tdestroy(void *root, void (*free_node)(void *nodep));       GLIBC\n```\n\n\
  这些函数最初为 System V 定义，现在已由 POSIX 正式标准化。它们遵循了我们在第 6.2 节“排序和搜索函数”以及第 171 页中看到的其他函数的模式：使用\
  \ `void *` 指针指向任意数据类型，并使用用户提供的比较函数来确定顺序。对于 `qsort()` 和 `bsearch()`，当 `key` 与树节点中的值进行比较时，比较函数必须返回负值/零/正值。\n\
  \nPOSIX 的声明如下：\n\n```\n#include <search.h>\n\nvoid *tdelete(const void *key, void\
  \ **rootp,\n              int(*compar)(const void *, const void *));\nposix_tnode\
  \ *tfind(const void *key,\n                   posix_tnode **rootp,\n           \
  \        int(*compar)(const void *, const void *));\nposix_tnode *tsearch(const\
  \ void *key,\n                     posix_tnode **rootp,\n                     int\
  \ (*compar)(const void *, const void *));\nvoid twalk(const posix_tnode *root,\n\
  \           void (*action)(const void *, VISIT, int));\n```\n\nPOSIX 标准使用了一种类型 `posix_tnode`。`tfind`\
  \ 和 `tsearch` 的原型遵循了：使用 `void *` 指针指向任意数据类型，并使用用户提供的比较函数来确定顺序。对于 `qsort()` 和 `bsearch()`，当\
  \ `key` 与树节点中的值进行比较时，比较函数必须返回负值/零/正值。\n\n### 16.4.3 树插入：`tsearch()`\n\n这些函数用于为树分配节点。为了使用它们，需要提供一个\
  \ `void *` 类型的指针。在创建树时，将其初始化为 `NULL`：\n\n```\nvoid *root;                      \
  \                树根\nvoid *val;                                      指向数据的指针\n\n\
  /* 比较函数 */\nextern int compare(const void *, const void *);\n\n/* 填充数据 */\nval =\
  \ tsearch(key, &root, compare);             插入新项\n```\n\n`tsearch()` 和 `tfind()`\
  \ 函数在二叉树中搜索给定的 `key`。它们接收参数：要搜索的 `key`；指向根的指针 `root`；以及比较函数 `compare`。当找到 `key`\
  \ 时，`tsearch()` 和 `tfind()` 会返回该节点。\n\n**注意**：由于树函数维护的是指针，在使用 `realloc()` 时要格外小心！`tsearch()`\
  \ 和 `tfind()` 返回的是指向数据的指针。\n\n### 16.4.4 树查找与返回指针的使用：`tfind()` 和 `tsearch()`\n\n\
  `tfind()` 和 `tsearch()` 在二叉树中搜索给定的 `key`。它们接收相同的参数：要搜索的 `key`；指向根的指针 `root`；以及比较函数\
  \ `compare`。它们返回匹配 `key` 的节点指针。\n\n通过以下代码代码来展示其工作原理：\n\n```c\nstruct employee {\
  \                               来自第 6 章\n        char lastname[30];\n        char\
  \ firstname[30];\n        long emp_id;\n        time_t start_date;\n};\n\n/* emp_name_id_compare\
  \ --- 按姓名，后按 ID 排序 */\n\nint\nemp_name_id_compare(const void *e1p, const void *e2p)\n\
  {\n... 稍后将完整复制 ...\n}\n\nstruct employee key = { ... };\nvoid *vp = NULL, *root\
  \ = NULL;\nstruct employee *e;\n... 用数据填充树 ...\n\nvp = tfind(& key, root, emp_name_id_compare);\n\
  if (vp != NULL) {  /* 找到了，使用它 */\n    e = *((struct employee **) vp);          \
  \    从树中检索存储的数据\n    /* 使用 *e 中的信息 ... */\n}\n```\n\n\n\n从概念上说，`e = *((struct employee\
  \ **) vp);` 的含义如下：\n\n1. `vp` 是一个 `void *`——也就是说，一个通用指针。它是内部树节点的地址，但它*也是*节点中指向用户数据部分（最可能是另一个\
  \ `void *`）的地址。\n\n2. ‘`(struct employee **) vp`’将内部指针的地址强制转换为正确的类型；它仍然是一个指向指针的指针，但现在指向一个\
  \ `struct employee`。请记住，从一种指针类型到另一种指针类型的强制转换不会改变任何值（位模式）；它们只会改变编译器在类型考量时处理这些值的方式。\n\
  \n3. ‘`*((struct employee **) vp)`’通过新创建的 `struct employee **` 进行间接引用，返回一个可用的 `struct\
  \ employee *` 指针。\n\n4. ‘`e = *((struct employee **) vp)`’将此值存储在 `e` 中以便以后直接使用。\n\
  \n该概念在图 16.2 中所示。\n\n![Images](img/fig16-002.jpg)\n\n**图 16.2：** 树节点及其指针\n\n你可以考虑定义一个宏来简化返回指针的使用：^(7)\n\
  \n^(7) 感谢 Jim Meyering 提供的建议。\n\n```\n#define tree_data(ptr, type) (*(type **) (ptr))\n\
  ...\nstruct employee *e;\nvoid *vp;\n\nvp = tfind(& key, root, emp_name_id_compare);\n\
  if (vp != NULL) {  /* 在这里，使用它 */\n    e = tree_data(vp, struct employee);\n    /*\
  \ 使用 *e 中的信息 ... */\n}\n```\n\n#### 16.4.5 二叉树遍历：`twalk()`\n\n`twalk()` 函数在 `<search.h>`\
  \ 中的声明如下：\n\n```\ntypedef enum { preorder, postorder, endorder, leaf } VISIT;\n\
  void twalk(const void *root,\n           void (*action)(const void *nodep, const\
  \ VISIT which, const int depth));\n```\n\n第一个参数是树的根（*不是*指向根的指针）。第二个参数是一个指向回调函数的指针，该函数带有三个参数被调用：指向正在访问的树节点的指针、一个指示如何访问给定节点的枚举类型，以及一个指示当前节点深度的整数（根的深度为\
  \ `0`，如前文所述）。\n\n遍历或“行走”二叉树有几种方法：\n\n* 左孩子、节点本身、右孩子。\n* 节点本身、左孩子、右孩子。\n* 左孩子、右孩子、节点本身。\n\
  \nGLIBC 的 `twalk()` 函数使用了上述这些方法中的第二种：节点优先，然后是左孩子，最后是右孩子。每遇到一个节点，该节点就被认为被*访问*了。^(8)\
  \ 在访问节点的过程中，函数必须访问节点本身。因此，`VISIT` 类型的值表示该节点是在哪个阶段被遇到的：\n\n^(8) 脑海中浮现出小二叉数据结构坐在一起喝茶吃饼干的画面。或者，如果你在电脑前呆得太久，至少会发生这种情况。\n\
  \n| `preorder` | 在访问任何孩子之前。 |\n| `postorder` | 在访问第一个孩子之后但在访问第二个孩子之前。 |\n| `endorder`\
  \ | 在访问完两个孩子之后。 |\n| `leaf` | 此节点是叶子节点，没有孩子。 |\n\n**注意**\n\n这里使用的术语与数据结构正式文本中使用的术语并不完全匹配。那里使用的术语是*inorder*（中序）、*preorder*（前序）和*postorder*（后序），分别指的是前面列出的三种遍历树的方法。因此，`twalk()`\
  \ 使用前序遍历，但使用 `preorder` 和其他符号常量来指示节点是在哪个阶段被访问的。这可能会引起困惑。\n\n在第 8.4.3.2 节“处理文件树流\
  \ 252 页，我们描述了 `fts()` 函数族如何让你遍历目录层次。这种层次结构也可以被视为树，其中每个节点（目录）可以有多个孩子（文件和/或子目录）。内存中的二叉树只是这种结构的简化版本，其中每个节点最多有两个孩子。\n\
  \n以下程序 `ch-extended-tsearch.c` 展示了树的构建和遍历。它复用了第 6.2 节“排序和搜索函数 171 页”中的 `struct employee`\
  \ 结构和 `emp_name_id_compare()` 函数：\n\n```\n 1  /* ch-extended-tsearch.c --- 演示树管理\
