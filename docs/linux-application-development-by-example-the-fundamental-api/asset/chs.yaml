  \ 的智能版本\n\n你可能注意到 `inetd` 对信号进行了大量的操作——设置信号掩码、阻塞和取消信号。因此，在使用 `select()` 时存在竞态条件，由于这个原因，后来增加了\
  \ `pselect()` 调用：\n\n```c\n#include <sys/select.h>                         POSIX\n\
  \nint pselect(int nfds, fd_set *readfds, fd_set *writefds,\n            fd_set *exceptfds,\
  \ const struct timespec *timeout,\n            const sigset_t *sigmask);\n```\n\n\
  手册页简要地概述了它与 `select()` 的区别，我们直接引用即可：\n\n`select()` 和 `pselect()` 的操作是相同的，但有以下三点不同：\n\
  \n* `select()` 使用 `struct timeval` 类型的超时时间（包含秒和微秒），而 `pselect()` 使用 `struct timespec`（包含秒和纳秒）。\n\
  \n* `select()` 可能会更新 `timeout` 参数以指示剩余时间。`pselect()` 不改变此参数。\n\n* `select()` 没有\
  \ `sigmask` 参数，其行为等同于调用了带有[一个] `NULL sigmask` 参数的 `pselect()`。\n\n`sigmask` 是一个指向信号掩码的指针（参见\
  \ `sigprocmask`(2)）；如果它不为 `NULL`，则 `pselect()` 会首先用 `sigmask` 指向的掩码替换当前的信号掩码，然后执行“select”函数，最后恢复原始的信号掩码。（如果\
  \ `sigmask` 为 `NULL`，则在 `pselect()` 调用期间信号掩码不会被修改。）\n\n以上就是这些。\n\n## 14.10 Unix\
  \ 域套接字\n\n在第 9.3.2 节“FIFOs](第 306 页](#ch09.xhtml_page_306)中，我们介绍了一种名为命名管道的文件类型。它是文件系统中一个文件，可以被两个无关的进程打开，并在它们之间提供通信。\n\
  \n在 socket API 设计和开发期间，BSD 开发者还没有命名管道；它们尚未被发明。然而，对类似命名管道的需求是显而易见的，他们选择了一种不同的方式来解决这个问题：所谓的\
  \ Unix 域套接字。\n\nUnix 域套接字使用 `AF_UNIX` 地址族。其别名是 `AF_LOCAL`。在 GNU/Linux 上，此类套接字可以是流式套接字、数据报套接字或顺序包套接字（参见表\
  \ 14.2）。\n\nUnix 域套接字的地址由 `struct sockaddr_un` 表示：\n\n```c\nstruct sockaddr_un {\n\
  \    sa_family_t sun_family;              /* AF_UNIX */\n    char        sun_path[108];\
  \           /* Pathname */\n};\n```\n\n`sun_path` 元素是套接字在文件系统中的路径。它应该以 NUL 终止。\n\
  \n使用 Unix 域套接字的流程与普通的 TCP/IP 套接字类似；你通过 `socket()` 和 `bind()` 创建套接字并将其“绑定”到文件系统中：\n\
  \n```c\nint sockfd = socket(AF_UNIX, SOCK_STREAM, 0);   // 省略错误检查\nstruct sockaddr_un\
  \ mysock = {\n    AF_UNIX,\n    \"/tmp/mysock\"\n};\nbind(sockfd, & mysock, sizeof(mysock));\
  \         // 省略错误检查\n```\n\n连接然后按照常例通过 `listen()`、`accept()` 和 `connect()` 进行。\n\
  \n由于本章已经足够长了，我们不再打扰你提供示例。Unix 域套接字的功能比我们这里描述的要得多。要获取更多信息，请参见 `unix`(7) 手册页。\n\n\
  ## 14.11 推荐阅读\n\n已故的 Richard Stevens 的以下书籍被认为是网络编程的经典。第一本描述了如何进行网络编程。其他书籍则深入了协议栈本身在\
  \ BSD 操作系统族中实现的细节：\n\n1. *Unix Network Programming: The Sockets Networking API*,\
  \ vol. 1, 3rd ed., by W. Richard Stevens, Bill Fenner, and Andrew M. Rudoff. Addison-Wesley,\
  \ 2003. ISBN-13: 978-0-131-41155-5.\n\n2. *TCP/IP Illustrated*, vol. 1, *The Protocols*,\
  \ 2nd ed., by Kevin R. Fall and W. Richard Stevens. Addison-Wesley, 2011. ISBN-13:\
  \ 978-0-321-33631-6.\n\n3. *TCP/IP Illustrated*, vol. 2, *The Implementation*, by\
  \ Gary R. Wright and W. Richard Stevens. Addison-Wesley, 1995. ISBN-13: 978-0-201-63354-2.\n\
  \n4. *TCP/IP Illustrated*, vol. 3, *TCP for Transactions, HTTP, NNTP, and the Unix\
  \ Domain Protocols*, by W. Richard Stevens. Addison-Wesley, 1996. ISBN-13: 978-0-201-63495-2.\n\
  \nDouglas Comer 的以下书籍也是经典，许多书中出版了多个版本证明了这一点。第一本书是网络学的通用介绍。接下来的两本描述了 TCP/IP 实现，最后一本描述了\
  \ socket 编程。Comer 是一位非常优秀的作者；他的书非常值得读：\n\n5. *Computer Networks and Internets*,\
  \ 6th ed., by Douglas E. Comer. Pearson, 2015. ISBN-13: 978-0-13-358793-7.\n\n6.\
  \ *Internetworking with TCP/IP*, vol. 1, *Principles, Protocol, and Architecture*,\
