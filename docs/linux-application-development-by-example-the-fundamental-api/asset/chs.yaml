  \ */\n 86      printf(\"Sorted by ID:\\n\");\n 87      for (i = 0; i < npres; i++)\
  \ {\n 88          putchar('\\t');\n 89          print_employee(& presidents[i]);\n\
  \ 90      }\n 91\n 92      for (;;) {\n 93          printf(\"Enter ID number: \"\
  );\n 94          if (fgets(buf, BUFSIZ, stdin) == NULL)\n 95                  break;\n\
  \ 96\n 97          sscanf(buf, \"%d\\n\", & id);\n 98          key.emp_id = id;\n\
  \ 99          the_pres = (struct employee *) bsearch(& key, presidents, npres,\n\
  \ 100                          sizeof(struct employee), emp_id_compare);\n 101\n\
  \ 102          if (the_pres != NULL) {\n 103                  printf(\"Found: \"\
  );\n 104                  print_employee(the_pres);\n 105          } else\n 106\
  \                  printf(\"Employee with ID %d not found!\\n\", id);\n 107    \
  \  }\n 108\n 109      putchar('\\n');  /* Print a newline on EOF. */\n 110\n 111\
  \      exit(0);\n 112  }\n```\n\n`main()` 函数从参数检查开始（第 57–60 行）。然后它从命名文件中读取数据（第 68–77\
  \ 行）。标准输入不能用于员工数据，因为其被留给用户输入要搜索的员工 ID。\n\n第 82–89 行对员工进行排序并打印。程序随后进入从第 91 行开始的循环。它提示用户输入搜索的员工\
  \ ID，并在遇到文件结束时退出循环。\n\n第 92–97 行搜索数组，使用 `struct employee` 类型的 `key`。只需设置其 `emp_id`\
  \ 字段即可。\n\n如果找到了匹配项，`bsearch()` 将返回指向该项的指针。否则，返回 `NULL`。在第 101 行测试返回值，并采取相应的操作。最后，第\
  \ 108 行打印一个换行符，以便系统提示符出现在新行。\n\n\n\n\n\n简单介绍一下，`awk` 中的正则表达式匹配使用了基于自动机理论的技术。具体来说，它使用了确定性有限自动机，或\
  \ `DFA`。`DFA` 匹配器从初始状态开始。根据输入字符，它从一个状态移动到下一个状态，直到到达终止状态或确定无法到达。在前一种情况下，它代表的正则表达式已匹配输入文本；在后者，则未匹配。图\
  \ 6.2 显示了正则表达式 '$(a|b)c’ 的状态之间的转换。\n\n![Images](img/fig06-002.jpg)\n\n**图 6.2:**\
  \ 非常简单的 DFA\n\n状态 1 是初始状态，状态 4 是最终状态。该图非常简单。从任何给定状态，根据当前输入字符，可能移动到多个后续状态。这被称为*状态转换*。\n\
  \n在计算早期，当字符总是单字节大小时，状态转换的表示非常简单。可以使用二维表格，行由当前状态索引，列由当前输入字符索引。存储在表格中的值将指示要移动到的下一个状态：\n\
  \n```\nnext_state = transition[current_state][current_char];\n```\n\n在这样的表示中，每行最多占用\
  \ 256 个条目。事实上，`awk` 使用了这样的表示：\n\n```\n...\nif ((ns = f->gototab[s][*p]) != 0)\n\
  \    s = ns;\n...\n```\n\n在这里，`f` 是 `DFA`，`ns` 是下一个状态，`s` 是当前状态，`*p` 是当前输入字符。`gototab`\
  \ 是“goto table”的缩写：一个指示下一个进入哪个状态的表格。\n\n问题是，在当今世界，字符不再仅仅是单字节大小。特别是，Unicode 字符集的的码点（字符值）通常用至少四个字节表示，并在文件中使用一到四个字节编码。（关于这一点，书后部分有更多介绍；请参见第\
  \ 15.4.2 节“多字节字符编码],第 545 页。）有超过百万个有效的 Unicode 码点——准确来说是 1,114,112 个——因此，转换表中的每行拥有超过百万个条目是不行的。\n\
  \n为了解决这个问题，Brian Kernighan 将 goto table 移动到了不同的结构中，通过函数访问。`gototab` 的数据结构由一个“goto\
  \ table entry”组成：\n\n```\ntypedef struct gtt { /* gototab entry */\n    unsigned\
  \ int ch;                    感兴趣的字符\n    unsigned int state;                 要移动到的状态\n\
  } gtt;\n```\n\n最初，他将每行的大小保持在（大约）256 个条目，并在行内使用线性搜索来查找当前输入字符，并从那里返回下一个状态。该函数命名为 `get_gototab()`：\n\
  \n```\nstatic int get_gototab(fa *f, int state, int ch) /* hide gototab implementation\
  \ */\n{\n    int i;\n    for (i = 0; i < f->gototab_len; i++) {\n        if (f->gototab[state][i].ch\
  \ == 0)\n            break;\n        if (f->gototab[state][i].ch == ch)\n      \
  \      return f->gototab[state][i].state;\n    }\n    return 0;\n}\n```\n\n在匹配过程中，如果在\
  \ `gototab` 中没有找到输入字符，它们及其下一个状态将被添加到其中。^(6) 这发生在 `set_gototab()` 中：\n\n^(6) 我们不理解为什么是这样；代码*非常*晦涩。我们在这里选择解释代码做了什么，而不深入究它为什么是那样运行的。\n\
  \n```\nstatic int set_gototab(fa *f, int state, int ch, int val) /* hide gototab\
  \ implementation */\n{\n    int i;\n    for (i = 0; i < f->gototab_len; i++) {\n\
  \        if (f->gototab[state][i].ch == 0 || f->gototab[state][i].ch == ch) {\n\
  \            f->gototab[state][i].ch = ch;\n            f->gototab[state][i].state\
  \ = val;\n            return val;\n        }\n    }\n    overflo(__func__);\n  \
  \  return val; /* 目前未在任何地方使用 */\n}\n```\n\n新的实现方案奏有效，但如果输入文件包含许多 Unicode 字符，`awk`\
  \ 的匹配速度会变得无法接受地缓慢，并且可能会超过条目数量的固定限制。\n\n作者决定看看可以在不对代码进行过多变动的情况下修复这些问题。这涉及到三个更改：\n\
  \n*   根据需要动态增长 `gototab` 的大小。\n*   使用二分查找查找 `gototab` 中的条目。\n*   保持条目排序，以便二分查找能够工作。\n\
  \n首先，结构稍微重排，以适应动态大小调整：\n\n```\ntypedef struct gtte { /* gototab entry */\n    unsigned\
  \ int ch;\n    unsigned int state;\n} gtte;\n\ntypedef struct gtt {  /* gototab\
  \ */\n    size_t allocated;\n    size_t inuse;\n    gtte *entries;\n} gtt;\n```\n\
  \n对于排序和搜索，我们需要一个比较函数：\n\n```\nstatic int entry_cmp(const void *l, const void *r)\n\
  {\n    const gtte *left, *right;\n\n    left = (const gtte *) l;\n    right = (const\
  \ gtte *) r;\n\n    return left->ch - right->ch;\n}\n```\n\n查找条目使用了经典的 `bsearch()`\
  \ 调用：\n\n```c\nstatic int get_gototab(fa *f, int state, int ch) /* hide gototab\
  \ implementation */\n{\n    gtte key;\n    gtte *item;\n\n    key.ch = ch;\n   \
  \ key.state = 0;  /* 无关 */\n    item = bsearch(& key, f->gototab[state].entries,\n\
  \            f->gototab[state].inuse, sizeof(gtte),\n            entry_cmp);\n\n\
  \    if (item == NULL)\n        return 0;\n    else\n        return item->state;\n\
  }\n```\n\n添加新的字符和状态更为复杂，因为列表必须保持排序。^(7)但在伪代码中，它是相当直接的：\n\n^(7) 这里可能会发生大量的排序。`qsort()`\
  \ 的某些版本在近乎有序的数据上表现不佳，在这种情况下可能会发生。GLIBC 中的版本没有这个问题。\n\n```text\n如果数组为空：\n    添加字符和状态\n\
  \    增加使用中条目的计数\n    返回\n否则如果当前字符大于数组中的最后一个字符：\n    // 因为它是更大的，所以数组保持排序\n    如果必要，扩大数组\n\
  \    添加字符和状态\n    增加使用中条目的计数\n    返回\n否则：\n    对列表进行二分查找，以检查我们是否已经有了当前字符\n    如果是，更新状态并返回\n\
  \n// 此时，当前字符不在列表中，因此必须添加：\n    如果必要，扩大数组\n    添加字符和状态\n    增加使用中条目的计数\n    对数组进行排序\n\
  \    返回\n```\n\n在介绍之后，这里是 `set_gototab()` 的新版本：\n\n\n\n\n\n```\nstatic int set_gototab(fa\
  \ *f, int state, int ch, int val) /* hide gototab implementation */\n{\n    if (f->gototab[state].inuse\
  \ == 0) {\n        f->gototab[state].entries[0].ch = ch;\n        f->gototab[state].entries[0].state\
  \ = val;\n        f->gototab[state].inuse++;\n        return val;\n    } else if\
  \ ((unsigned)ch > f->gototab[state].entries[f->gototab[state].inuse-1].ch) {\n \
  \       // not seen yet, insert and return\n        gtt *tab = & f->gototab[state];\n\
  \        if (tab->inuse + 1 >= tab->allocated)\n            resize_gototab(f, state);\n\
  \n        f->gototab[state].entries[f->gototab[state].inuse].ch = ch;\n        f->gototab[state].entries[f->gototab[state].inuse].state\
  \ = val;\n        f->gototab[state].inuse++;\n        return val;\n    } else {\n\
  \        // maybe we have it, maybe we don't\n        gtte key;\n        gtte *item;\n\
  \n        key.ch = ch;\n        key.state = 0;  /* irrelevant */\n        item =\
  \ (gtte *) bsearch(& key, f->gototab[state].entries,\n                f->gototab[state].inuse,\
  \ sizeof(gtte),\n                entry_cmp);\n\n        if (item != NULL) {\n  \
  \          // we have it, update state and return\n            item->state = val;\n\
  \            return item->state;\n        }\n        // otherwise, fall through\
  \ to insert and reallocate.\n    }\n\n    gtt *tab = & f->gototab[state];\n    if\
  \ (tab->inuse + 1 >= tab->allocated)\n        resize_gototab(f, state);\n    f->gototab[state].entries[tab->inuse].ch\
  \ = ch;\n    f->gototab[state].entries[tab->inuse].state = val;\n    ++tab->inuse;\n\
  \    qsort(f->gototab[state].entries,\n        f->gototab[state].inuse, sizeof(gtte),\
  \ entry_cmp);\n\n    return val; /* not used anywhere at the moment */\n}\n```\n\
  \n最终结果是，`awk` 的正则表达式匹配现在既消除了之前的固定限制，又具有可以接受的性能。二分查找解决了问题！\n\n我们将在第 17.6.1.1 节，“Valgrind\
  \ 示例：One True Awk 中的 `gototab`](#ch17.xhtml_ch17lev3sec13)”以及第 642 页返回这一系列函数。\n\n\
  ## 6.3 用户和组名\n\n虽然操作系统使用用户 ID 和组 ID 数字来存储文件所有权并权限检查，但人类更倾向于使用用户和组的名称`。\n\n早期的 Unix\
  \ 系统在简单的文本文件 `/etc/passwd` 和 `/etc/group` 中保留映射名称到 ID 数字的信息。这些文件在现代系统中仍然存在，且其格式与\
  \ V7 Unix 保持不变。然而，它们不再提供完整的信息。具有许多网络主机的大型安装将信息存储在`网络数据库`中：即在少量服务器上存储信息，然后通过网络进行访问。(8）。然而，这种用法对大多数应用程序是`透明`的，因为访问信息是通过与从文本文件中检索信息相同的\
  \ API 完成的。正如此，POSIX 标准仅规范了 API；系统要符合 POSIX 标准，并不需要存在这样的 `/etc/passwd` 和 `/etc/group`\
  \ 文件。\n\n常见的网络数据库包括 Sun Microsystems 的网络信息服务 (NIS) 和 NIS+、Kerberos (Hesiod)、macOS\
  \ DirectoryServices 以及 LDAP（轻量级目录访问协议）。BSD 系统将用户信息存储在磁盘数据库中并自动生成 `/etc/passwd` 和\
  \ `/etc/group` 文件。\n\n这两个数据库的 API 是相似的；我们的讨论重点集中在用户数据库上。\n\n### 6.3.1 用户数据库\n\n\
  传统的 `/etc/passwd` 格式每个用户一行。每行有七个字段，每个字段之间用冒号字符隔开：\n\n```\n$ grep arnold /etc/passwd\n\
  arnold:x:1000:1000:Arnold D. Robbins,,,:/home/arnold:/bin/bash\n```\n\n字段按顺序如下：\n\
  \n*   `用户名`\n    这是用户登录时输入的字符。它也会出现在 `ls -l` 以及任何其他显示用户的上下文中。\n\n*   `密码字段`\n  \
  \  在过去几何时，这是用户的加密密码。今天，该字段可能是一个 `x`（如所示），意味着密码信息存储在另一个并非全局可读的文件。这种分离是一种安全措施；如果非特权用户无法获取加密密码，那么“破解”它将困难得多。\n\
  \n*   `用户 ID 数字`（UID）\n    这应该是唯一的——每个用户一个数字。\n\n*   `组 ID 数字`\n    这是用户的初始组 ID\
  \ 数字。正如后文所讨论的，进程与多个组相关联。\n\n*   `用户的真实姓名`\n    这至少包含姓和名。某些系统允许逗号分隔的字段，用于办公地点、电话号码等（再次所示），但这并没有统一标准。\n\
  \n*   `登录目录`\n    当用户登录时，该目录成为用户的家目录（`$HOME`——`cd` 命令的默认值）。\n\n*   `登录程序`\n    用户登录时运行的程序。这通常是一个\
  \ shell，但并非必须是。如果此字段为空，默认值为 `/bin/sh`。\n\n通过 `<pwd.h>` 中声明的例程访问用户数据库：\n\n```\n#include\
  \ <pwd.h>                                              POSIX\n\nstruct passwd *getpwnam(const\
  \ char *name);\nstruct passwd *getpwuid(uid_t uid);\n\nstruct passwd *getpwent(void);\
  \                                POSIX XSI\nvoid setpwent(void);\nvoid endpwent(void);\n\
  ```\n\n各种 API 使用的 `struct passwd` 中的字段与密码文件中的字段直接对应：\n\n```\nstruct passwd {\n \
  \   char    *pw_name;      /* 用户名 */\n    char    *pw_passwd;    /* 用户密码 */\n  \
  \  uid_t   pw_uid;        /*用户 ID */\n    gid_t   pw_gid;        /* 组 ID */\n  \
  \  char    *pw_gecos;     /* 真实姓名 */\n    char    *pw_dir;       /* 家目录 */\n   \
  \ char    *pw_shell;     /* shell 程序 */\n};\n```\n\n（`pw_gecos` 的名称是历史遗留；在早期 Unix\
  \ 系统开发期间，该字段持有用户在运行 GECO 运行的 Bell Labs Honeywell 系统上的对应账户信息。）\n\n每个例程的作用在以下列表中所示：\n\
  \n*   `struct passwd *getpwent(void)`\n    返回一个指向内部 `static struct passwd` 结构的指针，该结构包含“当前”用户的信息。此例程一次读取整个密码数据库的记录，为每个用户返回一个结构指针。每次返回的是同一个指针；也就是说，内部的\
  \ `struct passwd` 为每个用户条目被覆盖。当 `getpwent()` 到密码数据库末尾时，它返回 `NULL`。因此，它允许你一次一个用户地遍历整个数据库。记录的顺序未定义。\n\
  \n*   `void setpwent(void)`\n    重置内部状态，使得下一次调用 `getpwent()` 返回密码数据库中的第一条记录。\n\n\
  *   `void endpwent(void)`\n    所谓“关闭数据库”，无论它是简单的文件、网络连接还是其他东西。\n\n*   `struct passwd\
  \ *getpwnam(const char *name)`\n    查找 `pw_name` 成员等于 `name` 的用户，返回指向描述用户的 `static\
  \ struct passwd` 指针，如果未找到用户则返回 `NULL`。\n\n*   `struct passwd *getpwuid(uid_t uid)`\n\
  \    同样，查找由 `uid` 指定的用户 ID 数字的用户，返回指向描述用户的 `static struct passwd` 指针，如果未找到用户则返回\
  \ `NULL`。\n\n\n\n\n\n当你有一个用户 ID 数字（例如来自 `struct stat`）并想要打印对应的用户名时，就需要 `getpwuid()`。如果你想根据\
  \ `getuid()` 的返回值查找自己的信息（例如家目录或登录 shell），那么它也很有用。（`getuid()` 将稍后在 第 11.2 节 “检索用户\
  \ ID 组 ID”、第 385 页）。`getpwnam()` 将名称转换为用户 ID 数字，例如，如果你想对文件使用 `chown()` 或 `fchown()`。理论上，这两个例程都会对密码数据库进行线性搜索以找到所需的信息。在实际使用密码文件时，这确实如此；但后台数据库（网络或其他，如\
  \ BSD 系统上的）倾向于使用更高效的存储方法，因此在这些情况下，这些用的用的可能并不很高。\n\n遗憾的是，如果性能是一个问题，并没有标准方法可以知道你的库是如何工作的，而且，它的工作方式在运行时可能会有所变化！（请参见\
  \ GNU/Linux 系统上的 `nsswitch.conf` (5) 手页。）另一方面，API 的意义终究底是为了隐藏细节。\n\n当你需要遍历整个密码数据库时，`getpwent()`\
  \ 就很有用。例如，你可能希望将其所有内容读入内存，对其进行排序，然后使用 `bsearch()` 快速搜索。这对于避免使用 `getpwuid()` 或 `getpwnam()`\
  \ 逐个查找时固有的多次线性搜索非常有用。\n\n**注意**\n\n由 `getpwent()`、`getpwnam()` 和 `getpwuid()` 返回的指针都指向内部的\
  \ `static` 数据。因此，如果你需要保存这些信息，应该对它们的内容进行拷贝。\n\n仔细查看 `struct passwd` 的定义。表示字符字符串的成员是指针；它们也指向内部的\
  \ `static` 数据，如果你要复制该结构，请确保也复制每个成员指向的数据。\n\n### 6.3.2 组数据库\n\n`/etc/group` 组数据库的格式与\
  \ `/etc/passwd` 类似，但字段较少：\n\n```bash\n$ grep arnold /etc/group  | sort\nadm:x:4:syslog,arnold,miriam\n\
  arnold:x:1000:\naudio:x:29:pulse,arnold,miriam\ncdrom:x:24:arnold,miriam,videos\n\
  dialout:x:20:miriam,arnold,videos\n...\n```\n\n同样，每个组占一行，字段之间用冒号分隔。字段如下：\n\n*  \
  \ **组名**\n    这是组的名称，如 `ls -l` 中或任何其他需要组名的上下文中所示所示。\n\n*   **组密码**\n    该字段是历史留下的。它不再被使用。\n\
  \n*   **组 ID 数字**\n    与用户 ID 一样，这对于每个组应该是唯一的。\n\n*   **用户列表**\n    这是一个该组成员的用户列表，用逗号分隔。\n\
  \n在上一个例中，我们看到用户 `arnold` 是多个组的成员。这种成员关系在实践中体现为所谓的“组集”（group set）。除了进程拥有的主用户 ID 和组\
  \ ID 数字外，组集是每个进程携带的额外组 ID 数字集合。系统在执行权限检查时，会将所有组 ID 数字与文件的组 ID 进行比对。该主题在 第 11 章 “权限和用户及组\
  \ ID 数字”、第 383 页 中进行了详细讨论。\n\n组数据库 API 与用户数据库 API 类似。`<grp.h>` 中声明了以下函数：\n\n```c\n\
  #include <grp.h>                                        POSIX\n\nstruct group *getgrnam(const\
  \ char *name);\nstruct group *getgrgid(gid_t gid);\n\nstruct group *getgrent(void);\
  \                           POSIX XSI\nvoid setgrent(void);\nvoid endgrent(void);\n\
  ```\n\n`struct group` 对应于 `/etc/group` 中的记录：\n\n```c\nstruct group {\n    char \
  \   *gr_name;        /* 组名 */\n    char    *gr_passwd;      /* 组密码 */\n    gid_t\
  \   gr_gid;          /* 组 id */\n    char    **gr_mem;        /* 组成员 */\n};\n```\n\
  \n`gr_mem` 字段带有一些说明。虽然它声明为指向指针的指针（`char **`），但最好将其视为字符串数组（类似于 `argv`）。数组的最后一个元素设置为\
  \ `NULL`。当没有列出成员时，数组的第一个元素为 `NULL`。\n\n`ch-general1-groupinfo.c` 展示了如何使用 `struct\
  \ group` 和 `gr_mem` 字段。程序在命令行接受单个用户名，并打印该用户名出现的所有组记录：\n\n```c\n 1  /* ch-general1-groupinfo.c\
  \ --- 演示 getgrent() 和 struct group */\n 2\n 3  #include <stdio.h>\n 4  #include\
  \ <stdlib.h>\n 5  #include <string.h>\n 6  #include <grp.h>\n 7\n 8  extern void\
  \ print_group(const struct group *gr);\n 9\n10  /* main --- 为 argv[1]指定的用户名打印组行\
  \ */\n11\n12  int\n13  main(int argc, char **argv)\n14  {\n15      struct group\
  \ *gr;\n16      int i;\n17\n18      if (argc != 2) {                           \
  \             检查参数\n19          fprintf(stderr, \"usage: %s user\\n\", argv[0]);\n\
  20          exit(1);\n21      }\n22\n23      while ((gr = getgrent()) != NULL) \
  \                     // 获取每个组记录\n24          for (i = 0; gr->gr_mem[i] != NULL;\
  \ i++)            // 查看每个成员\n25              if (strcmp(gr->gr_mem[i], argv[1])\
  \ == 0)       // 如果找到了用户…\n26                  print_group(gr);                \
  \           // 打印记录\n27\n28      endgrent();\n29\n30      exit(0);\n31  }\n```\n\
  \n`main()` 例程首先进行错误检查（第 18–21 行）。程序的核心是一个嵌套循环。外部循环（第 23 行）遍历组组记录。内部循环（第 24 行）遍历\
  \ `gr_mem` 数组的成员。如果其中一个成员与命令行中的名称匹配（第 25 行），则调用 `print_group()` 打印该记录（第 26 行）。这里是\
  \ `print_group()`：\n\n```c\n33  /* print_group --- 打印组记录 */\n34\n35  void\n36  print_group(const\
  \ struct group *gr)\n37  {\n38      int i;\n39\n40      printf(\"%s:%s:%ld:\", gr->gr_name,\
  \ gr->gr_passwd, (long) gr->gr_gid);\n41\n42      for (i = 0; gr->gr_mem[i] != NULL;\
  \ i++) {\n43          printf(\"%s\", gr->gr_mem[i]);\n44          if (gr->gr_mem[i+1]\
  \ != NULL)\n45              putchar(',');\n46      }\n47\n48      putchar('\\n');\n\
  49  }\n```\n\n`print_group()` 函数（第 35–49 行）非常直观，逻辑与 `main()` 中打印成员列表的类似。组成员之间用逗号分隔；因此循环体在检查数组中的下一个元素是否为\
  \ `NULL` 之前打印逗号。即使组中没有成员，这段代码也能正常工作。然而，对于此程序，我们知道是有成员的，否则 `print_group()` 不会被调用！运行程序时的情况如下：\n\
  \n```bash\n$ ch-general1-groupinfo arnold | sort\nadm:x:4:syslog,arnold,miriam\n\
  audio:x:29:pulse,arnold,miriam\ncdrom:x:24:arnold,miriam,videos\ndialout:x:20:miriam,arnold,videos\n\
  ...\n```\n\n有趣的是，`arnold:x:1000:` 这一行缺失了。这是因为成员列表为空，而我们的程序只检查该列表的成员。\n\n## 6.4 终端：`isatty()`\n\
  \nLinux/Unix 标准输入、输出、标准错误模型反对对输入输出设备进行特殊处理。程序通常不需要知道，也不应该关心它们的输出是终端、文件、管道、网络连接、物理设备还是其他。\n\
  \n然而，在某些情况下，程序确实需要知道关联的文件描述符是什么种类型。`stat()` 系列调用通常能提供足够的信息：普通文件、目录、设备等。但有时这些还是不够的，特别是对于交互式程序，你可能需要知道文件描述符是否代表一个\
  \ tty。\n\n\n\n\n\n一个 `tty`（Teletype 的缩写，早期计算机终端的制造商之一）是任何代表终端的设备——即人类用于与计算机交互的设备。这可能是一个硬件设备，例如个人电脑的键盘和显示器，或者是通过串口或调制解调器连接到计算机的旧式视频显示终端，也可以是一个软件\
  \ `pseudoterminal`（伪终端），例如用于窗口系统和网络登录的伪终端。\n\n可以使用 `isatty()` 来进行这种区分：\n\n```c\n\
  #include <unistd.h>                             POSIX\n\nint isatty(int desc);\n\
  ```\n\n如果文件描述符 `desc` 代表终端，该函数返回 `1`，否则返回 `0`。根据 POSIX 标准，`isatty()`可能会设置 `errno`\
  \ 来指示错误；因此，在调用 `isatty()` 之前，你应该将 `errno` 设置为 `0`，如果返回值为 `0` 则检查其值。POSIX 标准还指出，`isatty()`\
  \ 返回 `1` 并不意味着文件描述符另一端有一个人类！\n\n`isatty()` 的一个用是在 `ls` 中，在默认情况下，如果标准输出是终端，它会分列打印文件名；如果不是，则每行打印一个。另一个是\
  \ GNU `grep` 的 `--color` 选项，如果写入终端，它会为输出中的匹配文本着色。\n\n有许多专门处理终端的系统调用和库函数。由于空间原因，我们没有在书中介绍它们。\n\
  \n## 6.5 建议阅读\n\n1. *Mastering Algorithms with C*, Kyle Loudon 著。O’Reilly, 1999.\
  \ ISBN-13: 978-1-56592-453-6。\n   这本书提供了一个使用 C 语言进行算法和数据结构的实用且接地介绍，涵盖了哈希表、树、排序和搜索等内容。\n\
  \n2. *The Art of Computer Programming*, vol. 3: *Sorting and Searching*, 2nd ed.,\
  \ Donald E. Knuth 著. Addison-Wesley, 1998. ISBN-13: 978-0-201-89685-5。\n   这本书通常被认为是排序和搜索领域的权威。请记住，它比\
  \ Loudon 的书要密集得多，也更难读。\n\n3. GTK 项目由几个共同运行的库组成。GTK 是 GNU GNOME 项目使用的底层工具包。在库层次结构的底部是\
  \ GLib，它是一个包含基本类型、数据结构以及处理这些结构的函数的库。GLib 包含了本书到目前为止涵盖的所有基本操作以及更多功能，包括链表和哈希表。要开始使用，请参阅\
  \ GLib 的在线文档。\n   - [`https://www.gtk.org`](https://www.gtk.org)\n   - [`https://www.gnome.org`](https://www.gnome.org)\n\
  \   - [`https://docs.gtk.org/glib/`](https://docs.gtk.org/glib/)\n\n## 6.6 总结\n\n\
  * 时间在内部存储为 `time_t` 值，表示“自纪元以来的秒数”。对于 GNU/Linux 和 Unix 系统来说，纪元是 UTC 时间 1970 年 1\
  \ 月 1 日午夜。当前时间通过 `time()` 系统调用从系统中获取，而 `difftime()` 返回两个 `time_t` 值之间的差值（以秒为单位）。\n\
  \n* `struct tm` 结构体表示“分解的时间”，这是一种更易用的日期和时间表示。`gmtime()` 和 `localtime()` 将 `time_t`\
  \ 值转换为 `struct tm` 值，而 `mktime()` 则执行相反的操作。\n\n* `asctime()` 和 `ctime()` 对时间值进行简单的格式化，返回一个指向固定大小、固定格式的\
  \ `static` 字符字符串的指针。`strftime()` 提供了灵活得多的格式化，包括基于区域的值。`strptime()` 函数解析格式化的日期和时间，并填充\
  \ `struct tm` 的成员。\n\n* 时区信息通过调用 `tzset()` 提供。由于标准例程的行为就像自动调用了 `tzset()` 一样，因此很少需要直接调用此函数。\n\
  \n* 排序数组的标准例程是 `qsort()`。通过使用用户提供的比较函数并告知数组元素的数量及其大小，`qsort()` 可以排序任何类型的数据。这提供了巨大的灵活性。\n\
  \n* `scandir()` 将整个目录读取到 `struct dirent` 数组中。可以使用用户提供的函数来选择包含哪些条目，并提供数组内元素的排序。`alphasort()`\
  \ 是一个按名称对目录条目排序的标准函数；`scandir()` 将比较函数直接传递给 `qsort()`。\n\n* `bsearch()` 函数的工作与 `qsort()`\
  \ 类似。它执行快速的二分搜索。如果线性搜索的成本大于排序数据的成本，请使用它。（搜索数据集合的额外 API 见第 16.4 节，“使用二叉树进行高级搜索”，第\
  \ 575 页。）\n\n* 用户和组数据库可能存储在本地磁盘文件中，也可能通过网络提供。标准 API 故意隐藏了这种区别。每个数据库都提供了对整个数据库的线性扫描，以及对用户/组名或用户/组\
  \ ID 的直接查询。\n\n* 最后，当 `stat()` 不够时，`isatty()` 可以告诉你一个打开的文件是否代表终端设备。\n\n### 练习\n\n\
  1. 编写一个简单的 `date` 命令版本，它可以在命令行接受一个格式字符串，并使用它来格式化并打印当前时间。\n\n2. 当文件超过六个月时，`ls -l`\
  \ 使用更简单的格式来打印修改时间。GNU 版本的 `ls.c` 使用以下计算方法：\n\n   ```c\n   4449  struct timespec\
  \ six_months_ago;\n   /* 如果时间在过去六个月内，则认为是最近的\n   公历年平均为 365.2425 * 24 * 60 * 60\
  \ == 31556952 秒。\n   将此值作为整数写入以避免浮点带来的麻烦。 */\n   six_months_ago.tv_sec = current_time.tv_sec\
  \ - 31556952 / 2;\n   six_months_ago.tv_nsec = current_time.tv_nsec;\n   ```\n\n\
  \   将此与我们计算六个月前时间的示例进行比较。每种方法的优缺点是什么？\n\n3. 编写你自己的 `strftime()` 版本。不要担心区域差异；只需使用月份和星期的英文名称。确保输入缓冲区不会溢出。\n\
  \n   将你的版本与 GitHub 上的作者版本进行比较。\n\n4. 编写一个简单的 `touch` 命令版本，将命令行指定的文件的修改时间更改为当前时间。\n\
  \n5. 为你的 `touch` 命令添加一个选项，在命令行上接受日期和时间规范，并将该值用作命令行指定文件的新修改时间。你可以使用 `strptime()`\
  \ 吗？\n\n6. 为你的 `touch` 版本添加另一个选项，接收文件名，并使用给定文件的修改时间作为命令行指定文件的新修改时间。\n\n7. 增强 `ch-general1-sortemp.c`，对一个独立的指针数组进行排序，这些指针指向员工数组。\n\
  \n8. 为 `ch-general1-sortdir.c` 添加选项，按 inode 号、修改时间、访问时间和大小进行排序。添加一个“反向选项”，使得基于时间的排序让最新的文件在前，而其他标准（大小、inode）按按值从大到小排序。\n\
  \n9. 编写一个简单的 `chown` 命令。其用法应为：\n\n   ```\n   chown user [: group ] files  ...\n\
  \   ```\n\n\n\n\n在这里，`user` 和 `group` 是代表命名文件的新用户和用户组名。`group` 是可选的；如果存在，它将通过冒号与\
  \ `user` 分隔。\n\n要在 GNU/Linux 系统上测试你的版本，你必须以 `root` 身份操作。请务必小心！\n\n10. 增强你的 `chown`，允许使用数字用户或用户组数字，以及名称。\n\
  \n11. 编写函数来拷贝用户和组结构体，包括所指向的数据。使用 `malloc()` 根据需要分配存储。\n\n12. 编写一个专门的用户查找库，将整个用户数据库读取到动态分配的数组中。提供根据用户\
  \ ID 数字和名称的快速（`fast`）查找。确保处理请求的用户未找到的情况。\n\n13. 对用户组数据库执行相同的操作。\n\n14. 增强 `ch-general1-groupinfo.c`，使其也检查\
  \ `struct group` 的 `gr_name` 字段。\n\n15. 编写一个 `stat` 程序，打印命令行上指定的每个文件的 `struct stat`\
  \ 内容。它应该以人类可读的格式打印所有值：`time_t` 值显示日期和时间，`uid_t` 和 `gid_t` 值显示相应的名称（如果可用），以及符号链接的内容。以\
  \ `ls` 相同的方式打印 `st_mode` 字段。\n\n将你的程序与 GNU Coreutils 的 `stat` 程序进行比较，既可以通过比较输出，也可以查看源代码。\n\
  \n16. 去喝杯咖啡（或茶），坐下来，阅读 `stty`(1) 手页，该手册描述了终端的各种选项和设置。当你不再头晕脑胀时，思考一下终端设备的历史，从物理电打字机到视频终端，再到窗口系统。在今天仍支持的特性中，哪些大部分是无关的？哪些对于日常使用仍然是必要的？\n\
  \n# 第 7 章\n\n## 整合一切：`ls`\n\nV7 的 `ls` 命令很好地结合了我们到目前为止看到的所有内容。它使用了我们涵盖的几乎所有 API，涉及了\
  \ Unix 编程的许多方面：内存分配、文件元数据、日期和时间、用户名、目录读取和排序。\n\n## 7.1 V7 `ls` 选项\n\n与现代版本的 `ls`\
  \ 相比，V7 `ls` 只接受少数选项，而且某些选项的含义在 V7 中与当前的 `ls` 不同。选项如下：\n\n| `-a` | 打印所有目录条目。如果不使用此选项，则不打印\
  \ `.`（点）和 `..`（点点）。有趣的是，V7 `ls` 只忽略 `.` 和 `..`，而 V1 到 V6 则忽略任何以点开头的文件。后者的行为是现代版本\
  \ `ls` 的默认行为，。 |\n\n| `-c` | 与 `-t` 或 `-l` 使用时，使用 inode 改变时间（ctime）而不是修改时间。 |\n\
  | `-d` | 对于目录参数，打印目录本身的信息，而不是其内容。 |\n| `-f` | “强制”将每个参数作为目录读取，并打印每个槽中找到名称。此选项禁用了\
  \ `-l`、`-r`、`-s` 和 `-t`，并启用了 `-a。（此选项显然是为了文件系统的调试和修复而存在的。） |\n| `-g` | 对于 ‘ls -l’，使用组名代替用户名。\
  \ |\n| `-i` | 在第一列打印 inode 号，同时打印文件名或长格式列表。 |\n| `-l` | 提供熟悉的长格式输出。但注意，V7 的 ‘ls\
  \ -l’ 只打印用户名，而不是用户名和组名合在一起。 |\n| `-r` | 反转排序顺序，无论是文件名的字母顺序还是按时间排序。 |\n| `-s` | 以\
  \ 512 字节块打印文件大小。V7 `ls`(1) 手页说明，间接块（`indirect blocks`——文件系统用于定位大文件数据块的块）也包含在计算中，但正如我们将看到的，这一表述是不正确的。\
  \ |\n| `-t` | 按修改时间排序输出，最近的在前，而不是按名称排序。 |\n| `-u` | 与 `-t` 和/或 `-l` 使用时，使用访问时间而不是修改时间。\
  \ |\n\nV7 `ls` 与现代 `ls` 之间最大的差异在于 `-a` 选项和 `-l` 选项。现代系统在没有给出 `-a` 的情况下会省略所有点点文件，并在\
  \ `-l` 长格式列表中同时包含用户名和组名。在现代系统中，`-g` 意味着只打印组名，而 `-o` 意味着只打印用户名。就价值而言，GNU `ls` 几乎有\
  \ 60 个选项！\n\n## 7.2 V7 `ls` 代码\n\nV7 分发版中的 `/usr/src/cmd/ls.c` 文件包含了代码。它总共 425 行：\n\
  \n书籍的 GitHub 仓库中包含了一个副本。\n\n```\n 1  /*\n 2   * list file or directory\n 3   */\n\
  \ 4\n 5  #include <sys/param.h>\n 6  #include <sys/stat.h>\n 7  #include <sys/dir.h>\n\
  \ 8  #include <stdio.h>\n 9\n10  #define NFILES  1024\n11  FILE    *pwdf, *dirf;\n\
  12  char    stdbuf[BUFSIZ];\n13\n14  struct lbuf {                             \
  \  收集收集信息\n15      union {\n16          char    lname[15];\n17          char   \
  \ *namep;\n18      } ln;\n19      char    ltype;\n20      short   lnum;\n21    \
  \  short   lflags;\n22      short   lnl;\n23      short   luid;\n24      short \
  \  lgid;\n25      long    lsize;\n26      long    lmtime;\n27  };\n28\n29  int aflg,\
  \ dflg, lflg, sflg, tflg, uflg, iflg, fflg, gflg, cflg;\n30  int rflg    = 1;\n\
  31  long    year;                                  全局变量：自动初始化为 0\n32  int flags;\n\
  33  int lastuid = -1;\n34  char    tbuf[16];\n35  long    tblocks;\n36  int statreq;\n\
  37  struct  lbuf    *flist[NFILES];\n38  struct  lbuf    **lastp = flist;\n39  struct\
  \  lbuf    **firstp = flist;\n40  char    *dotp   = \".\";\n41\n42  char    *makename();\
  \                           char *makename(char *dir, char *file);\n43  struct \
  \ lbuf *gstat();                         struct lbuf *gstat(char *file, int argfl);\n\
  44  char    *ctime();                              char cctime(time_t *t);\n45 \
  \ long    nblock();                              long nblock(long size);\n46\n47\
  \  #define ISARG 010000\n```\n\n程序从文件包含（5-8）开始，然后是变量声明。`struct lbuf`（14-27）封装了 ls\
  \ 感感兴趣的 `struct stat` 部分。我们稍后会看到如何填充该结构。\n\n变量 `aflg`、`dflg` 等（29-30）都指示对应选项的存在。这种变量命名风格是典型的\
  \ V7 风格。`flist`、`lastp` 和 `firstp` 变量（37-39）代表 `ls`报告的文件。注意 `flist` 是一个固定大小的数组，允许处理\
  \ 1024 个文件。我们很快就会看到如何使用这些变量。\n\n在变量声明之后是函数声明（42-45），然后是 `ISARG` 的定义，它区分了命令行命名的文件和读取目录时发现的文件。这里是\
  \ `main()` 函数：\n\n\n\n\n\n```\n 63      if (--argc > 0 && *argv[1] == '-') {\n 64\
  \          argv++;\n 65          while (*++*argv) switch (**argv) {       解析选项\n\
  \ 66\n 67          case 'a':                                所有目录项\n 68         \
  \     aflg++;\n 69              continue;\n 70\n 71          case 's':         \
  \                       按块统计大小\n 72              sflg++;\n 73              statreq++;\n\
  \ 74              continue;\n 75\n 76          case 'd':                       \
  \         目录信息，而非内容\n 77              dflg++;\n 78              continue;\n 79\n\
  \ 80          case 'g':                                使用组名代替用户名\n 81          \
  \    gflg++;\n 82              continue;\n 83\n 84          case 'l':          \
  \                      详细列出\n 85              lflg++;\n 86              statreq++;\n\
  \ 87              continue;\n 88\n 89          case 'r':                       \
  \         反向排序\n 90              rflg = -1;\n 91              continue;\n 92\n 93\
  \          case 't':                                按时间排序，而非名称\n 94            \
  \  tflg++;\n 95              statreq++;\n 96              continue;\n 97\n 98  \
  \        case 'u':                                访问时间，而非修改时间\n 99             \
  \ uflg++;\n100              continue;\n 101\n 102          case 'c':           \
  \                     Inode 改变时间，而非修改时间\n 103              cflg++;\n 104       \
  \       continue;\n 105\n 106          case 'i':                               \
  \ 包含 inode 节点\n 107              iflg++;\n 108              continue;\n 109\n 110\
  \          case 'f':                                强制将每个参数视为目录读取\n 111        \
  \      fflg++;\n 112              continue;\n 113\n 114          default:      \
  \                           忽略未知的选项字母\n 115              continue;\n 116       \
  \   }\n 117          argc--;\n 118      }\n```\n\n第 63–118 行手动解析了命令行选项；当时 `getopt()`\
  \ 尚未发明。当某个选项需要使用 `stat()` 系统调用时，变量 `statreq` 被设置为 `true`。\n\n避免对每个文件都进行不必要的 `stat()`\
  \ 调用是一个重大的性能优化。`stat()` 调用尤为昂贵，因为它可能涉及到 inode 位置的磁盘寻道、读取 inode 的磁盘读取，然后返回到目录内容所在的位置（以便继续读取目录项）。\n\
