- md: '

    A Practical Guide to XEN High Availability


    # About the author


    Sander van Vugt is an independent technical trainer and consultant, specialising
    in Linux storage, virtualization, HA clustering and performance optimization.
    As such, he has been invited to do work all around the globe. Sander is also an
    author who has written over 40 books. He''s a regular contributor to different
    magazines and websites. You can reach Sander at this mail address mail@sandervvugt.nl,
    or his website www.sandervanvugt.nl.


    # About the reader


    This book is written for anyone who wants to create an affordable and stable solution
    for high availability of Xen virtual machines. To get the most out of this book,
    the reader should have a good working knowledge of Linux. The book uses SUSE Linux
    Enterprise as the example distribution. Although the configuration is applicable
    to other distributions as well, there are no guarantees on this.


    # Acknowledgements


    This book has been made possible with the aid of the following people:


    - Mike de Laat of IKW, the Xen HA Implementation at his site has inspired me to
    document what I''ve done, which was the initial start of this book.

    - Rob Bastiaanansen of Books4Brains, Rob is always open for a good idea, even
    if from a commercial perspective it might not be viable.

    - Erno de Korte of Open Horizons. The Open Horizons Community has a book fund
    that helps authors who want to publish about a certain subject realizing the book
    without having to make a major investment first.

    - Corné Groesbeek of NetCB. Corné spent his weekend making transcribing my horrible
    mix between Dutch and English (Dunglish) to decent English.

    - The people on the Pacemaker mailing list. Thanks for answering all my stupid
    questions and thanks for working on this great software.


    # Understanding the Xen HA solution


    In this chapter you''ll get an introduction to Xen virtualization and more specifically,
    the Xen HA solution. Firstly, you''ll get to learn the benefits of working with
    Xen as your virtualization solution. I''ll compare Xen to other virtualization
    solutions, such as VMware and KVM. Next, you''ll learn what exactly is by Xen
    High Availability. In the last part of this chapter, you''ll read what hardware
    to purchase to build a decent Xen High Availability Solution.


    Note: this book is about creating a Xen High Availability solution. The solution
    described will however work for other environments as well. It is likely that
    in the future, KVM will become increasingly important as a virtualization solution.
    Using the setup described in this book, you can create Xen High Availability for
    KVM virtual machines as well. I''ll probably dedicate a chapter to that subject
    in one of the next versions of the book.


    ## 1.1 Free Virtualization with High Availability and optimal performance


    Once the decision has been made to implement a virtualised solution, the majority
    of industry players choose VMware. There are several reasons for doing this, of
    the fear of implementing a solution that cannot be managed effectively is an important
    one. Too many customers pay for the perception of security and hence buy VMware.
    In this book you''ll read about an alternative, which is as good as VMware but
    cheaper: Xen on SUSE Linux Enterprise Server 11, combined with Pacemaker High
    Availability.


    ### SLES or something else?


    In this book I will be discussing the configuration on SUSE Linux Enterprise Server.
    You are no means bound to use the same configuration or purchase the solution
    offered by SUSE Linux Enterprise Server. You can use the components discussed
    here on free software, such as OpenSUSE or Ubuntu as well. If you don''t want
    to use SUSE Linux Enterprise Server, I''d recommend using OpenSUSE instead. The
    structure of this distribution is quite similar to the software discussed here,
    where there will be some differences if you''re using other distributions like
    Ubuntu.


    Let''s be honest. The Open Source virtualization solution we''re going to build
    on top of SUSE Linux Enterprise Server 11, is not as easy and accessible as the
    same solution based on VMware. If you''re looking for a solution where anyone
    can migrate a virtual machine easily from one host to another, using an intuitive
    graphical interface, the SUSE-Xen solution isn''t there yet. You need to know
    command line Linux in order to work with this solution, and from time to time
    will need to work with hard to use commands at the Linux console, or with critical
    XML files.


    Does this mean you shouldn''t use it? Not at all! A solution by VMware also needs
    a specialist to be installed correctly. Often VMware solutions fail because a
    skilled system administrator is misled by the to interface and has missed things
    up. If you start any virtualization project, you need to know what you are doing!


    ## 1.2 Why Xen?


    Before starting a project, you have to ask why exactly is by Xen High Availability.
    In the last part of this chapter, you''ll read what hardware to purchase to build
    a decent Xen High Availability Solution.


    In this chapter, you''ll get an introduction to Xen virtualization and more specifically,
    the Xen HA solution. Firstly, you''ll get to learn the benefits of working with
    Xen as your virtualization solution. I''ll compare Xen to other virtualization
    solutions, such as VMware and KVM. Next, you''ll learn what exactly is by Xen
    High Availability.


    Note: this book is about creating a Xen High Availability solution. The solution
    described will however work for other environments as well. It is likely that
    in the future, KVM will become increasingly important as a virtualization solution.
    Using the setup described in this book, you can create Xen High Availability for
    KVM virtual machines as well. I''ll probably dedicate a chapter to that subject
    in one of the next versions of the book.


    ## 1.3 Xen Technical benefits


    Up to now, we''ve talked about the technical benefits of Xen. These are mainly
    in the way that Xen introduced a revolutionary new approach to virtualization,
    which is known as parvirtualization. In parvirtualization, a software interface
    is used for virtual machines. This software interface is used to communicate directly
    with the underlying hardware. By using this interface, the approach of emulation
    can be avoided. Emulation should be avoided, since all hardware instructions generated
    by virtual machines have to be trapped and translated. This process has a very
    high price in performance terms. In short: parvirtualization makes your virtualization
    solution a lot faster. Currently, Xen is the only player in the virtualization
    space that has completely implemented parvirtualization. Other solutions are still
    trying to get to this point.


    There is something you need to know about parvirtualization. To use parvirtualization,
    you need a special kernel in the operating system that you want to install as
    a virtual machine. This kernel is not available for all operating system. There
    is a parvirtualization kernel for Novell NetWare and Linux, but you won''t find
    one for Windows. You can still virtualize in Xen, but you will have to run it
    in full mode. By using this method, the virtual operating system has to go through
    a layer of emulated drivers, which would cost additional performance. Since Xen
    is using virtualization support on the CPU in this mode, the performance of Windows
    virtual machines is still quite good. Novell has also made available the Virtualization
    Driver Pack, which can be installed in Windows for I/O devices, which means that
