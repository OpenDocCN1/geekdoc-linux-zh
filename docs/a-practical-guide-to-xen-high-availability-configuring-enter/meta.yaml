    ## XEN 高可用性实用指南


    安装服务器后，您需要处理 SAN。由于每个 SAN 都是不同的，我无法非常具体地说明您准确需要执行哪些配置步骤。唯一需要明确的是，您需要将 LUN 作为每个虚拟机的存储后端。因此，如果您有
    50 台虚拟机，您将需要 50 个 LUN。让多个部分共享同一个 SAN 是可能的，但配置的灵活性较低，不建议这样做。您应该检查您的 SAN 是否支持创建许多
    LUN。某些厂商限制了可以在 SAN 上创建的 LUN 数量。您可能需要购买额外的 SAN 许可才能添加所需的 LUN 数量。现在不需要创建所有 LUN，您可以先创建一些
    LUN。确保您现在至少有二或三个 LUN，这将允许您配置前几台虚拟机。


    ## 2.2 将服务器连接到 SAN


    在所有服务器上安装操作系统之后，您就可以将服务器连接到 SAN。我们假设您的服务器配备了两块网卡以连接到 iSCSI SAN。虽然在某些环境中具体步骤可能会略有不同，但这里描述的过程对所需内容提供了良好的指示。对于您希望使用普通以太网卡或特定的
    iSCSI HBA 连接到 SAN 的环境，您将需要此过程。如果您使用光纤（Fibre Channel），配置将不同，因为光纤 HBA 直接连接到 SAN，不需要额外的网络配置。


    ### 2.2.1 创建 iSCSI 连接


    如果您使用 iSCSI，可以配置 SUSE 来建立 iSCSI 连接。请不要对此此产生混淆，您是从 SUSE 配置 iSCSI，而不是从 HBA 配置（HBA
    也可能在 BIOS 中为您提供一些配置选项）。只有当您打算从 SAN 启动操作系统时，才需要 HBA 配置，这在 Xen HA 环境中特别不是这种情况。下面的过程描述了如何从
    SUSE 主机建立 iSCSI 连接，假设您已经在电脑上设置了 IP。


    - 1. 从 YaST 中，选择网络服务 (Network Services) > iSCSI 初始化器 (iSCSI Initiator)。YaST 可能会告诉您尚未安装，并询问是否要安装。建议在此时选择安装。


    - 2. 安装后，您将看到 iSCSI 配置窗口。在此窗口中，指示您希望在启动服务器时自动启动 iSCSI。（由于所有其他内容都取决于此连接的成功创建，您绝对希望它在启动时自动启动）。


    - 3. 您现在将看到 iSCSI 配置窗口。从这里，选择在启动服务器时自动启动 iSCSI 的选项。


    ![](img/b40539f0f23a32fb6110fc27a5bf954e_16_0.png)


    首先，您需要指示 iSCSI 服务在所有节点上自动启动，因此更改手动启动的默认选项。


    - 4. 导航到已发现目标（Discovered Targets）选项卡并点击发现（Discovery）。在此界面中，输入您连接到 SAN 的第一个 IP
    地址。如果您的 SAN 有两个（或更多）IP 地址，请输入第二个以及任何其他 IP 地址。如果收到针对对同一 SAN 进行第二次连接的警告，可以安全地忽略它。


    ![](img/b40539f0f23a32fb6110fc27a5bf954e_17_0.png)


    现在输入您用于连接 SAN 的所有 IP 地址。


    - 5. 激活已连接目标（Connected Targets）标签页。在此选项卡上，您可以看到当前的 iSCSI 连接，其状态应该是“启动时（On Boot）”。这意味着驱动在启动时加载，但没有其他操作会发生发生。为了确保
    iSCSI 连接确实创建，您必须选择每个连接并将启动模式更改为自动（Automatic）。这将确保 iSCSI 连接在启动时真正启动，使您的电脑在启动后看到磁盘。在下面的列表中，可以看到如何使用
    `lsscsi` 命令使磁盘可见；iSCSI 磁盘列出了虚拟磁盘（VIRTUAL-DISK）类型。


    列表：`lsscsi` 显示 iSCSI 磁盘作为虚拟磁盘类型。


    | | | | | | |

