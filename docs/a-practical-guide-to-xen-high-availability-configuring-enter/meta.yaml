    # 2.6 An Alternative Approach to Networking: Using Several Bridges


    In the proceeding, you''ve seen how you can create a network configuration focused
    on the host computer. You''ve set up a bridge that used to connect all virtual
    machines to the network. This also means that there is no priority has been configured
    between the different machines. There is an alternative: you can create several
    bridges so that virtual machines can be assigned to specific network cards. This
    makes it easier to set load balancing between machines that machine can function
    with less bandwidth. If required, you can create a bond device within the virtual
    machine, connecting two of the virtual networks together. To do this, you can
    follow the procedure for the creating of a bond device that has been described
    above. In the next procedure we''ll create more than one network bridge on the
    host computer.'
