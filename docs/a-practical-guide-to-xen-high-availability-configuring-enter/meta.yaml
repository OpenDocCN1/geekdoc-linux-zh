    5. Now specify which operating system you want to install. In this example I''ll
    install SUSE Linux Enterprise Server 10, you can install any other operating system
    as well. The only requirement is that it uses the same processor architecture
    as the host operating system. That means that you cannot install 64-bit on a 32-bit
    host (the opposite is possible) and you cannot install SPARC software on an Intel
    platform.'
