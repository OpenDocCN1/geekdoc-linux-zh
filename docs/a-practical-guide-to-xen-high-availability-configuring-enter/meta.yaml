  md: '# Setting up the LVM Environment


    Now that you have the LVM volumes and resources operational, you can proceed with
    the next step: configuring the Xen virtual machines. This is a task that you should
    be able to do without too much trouble from the virt-manager utility, which is
    the default utility on SLES to manage virtual machines. There are some particularities
    for using this utility in a cluster environment though. The following procedure
    shows what to do.


    +   1. In hb_gui, find out on which host the LVM logical volume that you want
    to use as the storage back-end for the virtual machine is activated. On that host,
    the virt-manager command to start the Virtual Machine Manager interface.


    > Tip: You of course also use the hb_gui to migrate the logical volume to the
    host you need it. Right-click the volume resource and from the menu, select Migrate
    Resource. You will now see a window where you can use the To Node option to indicate
    which host you want to migrate the volume.


    +   2. In Virtual Manager, double-click the localhost line. This changes the status
    of the local host to Active, which means that you can start creating virtual machines.


    ![](img/b40539f0f23a32fb6110fc27a5bf954e_92_0.png)


    To start creating virtual machines, you need to activate the local host.'
  merge: -1
