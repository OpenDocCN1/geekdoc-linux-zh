    # 8.4 Verifying and Synchronizing the Cluster


    In situations, you''ll see that it just doesn''t work the way you want it to.
    There may be two reasons for that. First, you may find that the changes in the
    cluster don''t get synchronized fast enough to the other nodes. Another issue
    may arise if there are errors in the configuration, which can even happen if you''ve
    only created resources from the Linux HA Management Client!


    For both of these cases, there''s a command that might help you. First, you can
    force immediate synchronization of the Cluster Information Base (CIB) between
    the nodes using the cibadmin -S command. This will push the configuration to the
    other nodes and make sure they are up-to-date as well.


    In case you suspect that there are errors in the current cluster configuration
    (or if a log message in /var/log/messages tells you that there are errors), you
    can run crm_verify -L. This command will give you a list of all currently existing
    errors, so you can fix them.'
