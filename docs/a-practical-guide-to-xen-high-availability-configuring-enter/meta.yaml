    XEN 高可用性实用指南


    # 关于作者


    Sander van Vugt 是一位独立技术培训师和顾问，专攻 Linux 存储、虚拟化、HA 集群和性能优化。因此，他受邀在世界各地开展工作。Sander
    也是一位作家，编写过 40 多本书。他还是不同杂志和网站的定期投稿者。你可以通过邮件地址 mail@sandervvugt.nl 或他的网站 www.sandervanvugt.nl
    与 Sander 联系。


    # 关于读者


    本书为任何想要为 Xen 虚拟机创建一个廉价且稳定的高可用性方案的人而编写。为了充分利用本书的内容，读者应该具备良好的 Linux 工作知识。本书使用 SUSE
    Linux Enterprise（SUSE Linux 企业版）作为示例发行版。尽管该配置也适用于其他发行版，但对此不作保证。


    # 致谢


    本书的出版得不开以下人员的帮助：


    - IKW 的 Mike de Laat，他在现场实现的 Xen HA 启发了我记录我的所做工作，这也是这本书的开端。

    - Books4Brains 的 Rob Bastiaanansen，Rob 总是对好主意持开放态度，即使从商业角度来看它可能不可行。

    - Open Horizons 的 Erno de Korte。Open Horizons 社区有一个书籍基金，帮助想要出版特定主题书籍的作者在无需预先进行重大投资的情况下实现书籍。

