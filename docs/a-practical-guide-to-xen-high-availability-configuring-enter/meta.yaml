    a manual mount from all of the nodes that have the o2cb resource running on them.
    I like mounting on a temporary directory, just to confirm that it''s working.
    To do this, use the following command:


    ```

    mount -t ocfs2 /dev/dm-2 /mnt

    ```


    4. Don''t forget to unmount all the OCFS2 mounts. If you don''t do this, you''ll
    see that you can''t get the OCFS2 volume to mount in cluster. To unmount the volume
    on all the nodes, use the following command:


    ```

    umount /mnt

    ```


    If this gives you a "Device is busy" message, you are probably in the /mnt directory.
    Get out and try again!


    Now you need to repeat this procedure once more. For a Xen HA on OCFS2, you need
    two OCFS2 volumes, one to store the disk files on, which has to be big, and another
    one on which you are going to store the configuration files, for which 1 GB of
    available disk space is enough.


