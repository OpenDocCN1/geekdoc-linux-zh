    # XEN 高可用性实用指南


    - OCFS2: OCFS2 集群感知文件系统。该文件系统允许你同时从多个节点对同一个文件具有写权限。

    - OpenAIS 和 Pacemaker：创建本书中所述的解决方案所需的内核集群组件。


    ![](img/b40539f0f23a32fb6110fc27a5bf954e_31_0.png)


    从高可用性扩展（High Availability Extension）安装你所需的所有包。


    5. 现在点击“接受”（Accept）确认你的选择。当询问是否要安装软件依赖项时，点击“继续”（Continue）确认。

    6. 程序结束时，将询问你是否要配置 Novell 客户中心（Novell Customer Center）。执行此步骤允许你为服务器注册 HAE 产品并继续接收更新。现在注册服务器是一个好主意，尽管对于继续安装过程并非必须。如果你想现在注册，请确保你已拥有用于
    Novell 账户的邮箱地址以及产品的注册代码。有了这些信息，你可以按照提示注册服务器并完成安装程序。


    创建基础集群配置


    ## 3.2 连接节点


    现在软件包已经安装完成，你可以为集群创建基础配置了。在操作过程的初始部分，你将确保节点能够相互看到并进行通信。后续步骤描述了如何操作。


    1. 从 YaAST 中，选择“杂项”（Miscellaneous） > “集群”（Cluster）。你现在将看到主窗口，可以在该窗口中创建集群配置。


    ![](img/b40539f0f23a32fb6110fc27a5bf954e_32_0.png)


    从此窗口，你将创建初始集群配置


    2. 首先，从下拉列表中点击“绑定网络地址”（Bind Network Address）选项。此选项用于指定使用哪个网卡传输集群数据包。软件将自动建议服务器上所有可用的网络地址。

    为了获得最佳性能，建议选择一个代表用户体验的网络接口，因此你可以选择发送局域网（LAN）流量的网络。在选择此网络后，你需要指定一个用于集群通信的组播地址。你可以使用任何起始数字在
    224 到 239 之间的 IP 地址，只要它未被其他用途占用。在其他节点上，你将使用相同的组播地址；该组播地址作为组地址，集群中的所有节点都将监听。在示例配置中，我们将使用组播地址
    224.13.14.15。


    > 注意：集群网络接口的另一种方法是使用专用的集群专用接口。这种方法的优点是，局域网上的正常流量不会干扰集群流量。然而，它也存在接口在你不知情的情况下掉线的风险。为了防止此类接口故障，你可以配置
    ping 资源。该集群资源被配置为定期向集群中的节点发送 ping 包。使用你的默认网关是极极佳的选择。在这种情况下，如果 ping 主机掉线，集群将知道存在通信问题，并从无法再次
    ping 的节点上切换资源。关于配置 ping 主机在书中会有讨论。


    3. 在继续之前，你需要决定是否要为集群数据包的通信配置冗余通道。使用冗余通信链路的优势在于，当主通道发生故障时，集群数据包仍然可以传输。如果主通道也用于普通用户流量，可能不希望在不对集群采取任何操作的情况下，集群流量自动切换到冗余通道。这就是为什么可能不想配置冗余通道的理由。如果你配置了冗余通道，你还需要设置一个
    ping 主机，以便集群知道集群中的某个重要连接是否掉线。


    4. 现在激活“服务”（Service）选项。在这里，“启动”（Booting）下，点击单选按钮“开启”（On）。这将确保集群被添加到计算机的所有运行级别（runlevels）中，并自动启动。之后，点击“启动
    OpenAIS”启动你的集群。接下来，点击“完成”（Finish）保存并应用你的更改。


