    \ it's time to have a look at the LAN. In order to create a Xen configuration,\
    \ you'll need to create a bridge device on your operating system and there are\
    \ several ways to do that.\n\nThe bridge device is used as a virtual switch, which\
    \ is contacted by each of the virtual machines, including the hosting operating\
    \ system. Since the bridge device is an essential component of your servers configuration,\
    \ it's recommended to configure fault tolerance on this device. There are two\
    \ approaches to do this, on the host or on the virtual machines. In solution,\
    \ you'll need a bond device, which is a software device (referred to as bond device)\
    \ to which at least two network cards are connected. You'll connect at least two\
    \ network cards, but more than two could be required. An advantage of this, is\
    \ better redundancy. If one of the devices configured in the bond fails, the other\
    \ device just takes over."
