  md: '# A Practical Guide to XEN High Availability


    From the viewpoint of network bonding, you can go in two directions. One solution
    is to join the network cards in the interface and have them share the workload
    on your server. This method however doesn''t work in some configurations. The
    second approach is to configure the bond device in an active/passive configuration.
    This method is supported and offers you the best possible redundancy.


    You can also go for a completely different approach, in which the bond device
    is not created on the host operating system, but in the virtual machines themselves.
    In some network environments, this seems to work better. If you decide to configure
    a bond device in the virtual machines, you can skip the next section which is
    about configuring the bond device on the host machine. Instead, skip ahead to
    section 2.5 where you learn how to configure a network bridge and configure bonding
    later, after you have installed the virtual machines.


    In the following subsections you''ll learn how to configure the bond device on
    either the host operating system, or on the virtual machines.


    When '' on the host environment, you''ll need to create the bond device on the
    host and connect the physical network cards that connect you to the LAN to that
    device. After doing this, you''ll need to connect the bond device to the virtual
    bridge. For a large part, you can perform this procedure by YaST. editing the
    configuration files directly. You''ll have to configure some of the elements though.


    As a first step, you need to create a configuration for the network cards that
    you want to use in the bond device. From YaST, this is easy to do: YaST offers
    an option to configure a network card to be used in a bond device. This procedure
    is described in the following steps:


    +   1. Start YaST, select Network Devices and next choose Network Settings. Then
    select the first network card you want to use and click Edit to modify its settings.
    Have a look at the figure below for the YaST screen from which to do.


    ![](img/b40539f0f23a32fb6110fc27a5bf954e_21_0.png)


    From YaST, it''s easy to configure a network card to be used in a bond device.


    Configuring the Hosts'
