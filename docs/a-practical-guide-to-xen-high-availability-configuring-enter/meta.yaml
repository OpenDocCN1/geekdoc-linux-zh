    # Xen 高可用性实用指南


    ### 设置 LVM


    现在你已经设置了 LVM，可以进行下一步操作：配置虚拟机。此任务可以使用 virt-manager 完成，它是 SLES 上管理虚拟机的默认工具。在集群环境中使用它有一些特殊之处。以下步骤如下：


    - 1. 在 hb_gui 中，找到作为虚拟机后端 LVM 卷已激活。提示：你当然可以使用 hb_gui 迁移它。右键点击卷资源，从菜单中选择 Migrate（迁移）。你现在将看到一个窗口，可以使用
    To Node 选项指定迁移的主机。


    - 2. 在 Virtual Manager 中，双击 localhost 行。这将本地主机的状态改为 Active（激活），意味着你可以开始创建虚拟机。


    ![](img/b40539f0f23a32fb6110fc27a5bf954e_92_0.png)


    要开始创建虚拟机，你需要激活本地主机。


    # Xen 高可用性实用指南


    3. 在 Virtual Manager 界面底部，点击 New（新建）创建一个虚拟机。这将启动虚拟机向导。在向导启动的第一个窗口中，点击 Forward（下一步）继续。


    4. 向导现在询问你是想创建一个新的虚拟机，还是倾向于使用一个已经安装了完整虚拟机的现有磁盘。从该窗口，选择“I need to install an operating
