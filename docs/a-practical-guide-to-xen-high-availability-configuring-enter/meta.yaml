    # XEN 高可用性实用指南


    可以使用半虚拟化技术的存储适配器。这些驱动程序仅作为额外购买提供。有关 Novell 虚拟机驱动程序包的更多信息，可以参考：http://www.novell.com/products/vdriverpack。


    ## 1.4 理解 Xen 高可用性解决方案


    在我们开始讨论硬件和配置之前，让我们先尝试理解一下我们要做什么。为了简单起见，想象有一台虚拟机。你可以在单台宿主机上运行此虚拟机。然而，如果宿主机宕机，虚拟机将无法继续运行。如果涉及到多台虚拟机，这个问题会变得更加严重。


    为了避免出现这种情况，建议使用至少两台物理机构建高可用性解决方案。在这样的解决方案中，你将配置一个能够提供高可用性的集群。集群将安装在宿主机上，并由集群来监控其他节点。如果集群中的一个宿主机宕机，集群也会知道。其优势是，集群将确保如果某个虚拟机宕机，运行在宕机主机上的虚拟机将尽快在备用节点上重启。


    通过为 Xen 环境配置高可用性解决方案，您可以确保最短的停机时间。集群需要一些时间来发现虚拟机或宿主机宕机，并在备用节点上启动该虚拟机。根据可用软件的现状，没有办法可以避免这一点。这在
    Xen 的未来版本中可能会发生变化。（事实上，最近发布的 Xen 4.0 虚拟机监控程序可以做到。你很快就会在大基于 Xen 的解决方案中看到这一点。）


    ## 1.4.1 要求的硬件


    现在你已经知道了使用基于 Xen 构建的虚拟化解决方案的益处，让我们来看构建此类解决方案所需的硬件。首先，你需要一个中心存储区域。该中心存储应该能够被集群中的所有节点访问。在许多环境中，这个中心存储区域实现为
    SAN（存储区域网络）。你可能会听到人们谈论其他解决方案，如 NAS 或 NFS 服务器，但对于书中描述的解决方案，只有 SAN 是可行的。


    实施 SAN 并不需要花费很多，现在有非常廉价的 SAN 解决方案，例如戴尔 MD3000 SAN，它已经针对该环境进行了测试并且运行良好。或者，你可以在
    iSCSI 上构建自己的开源 SAN。要安装一个连接了存储的 Linux 服务器，配置 iSCSI 来共享这些存储，你就拥有了一个廉价的 iSCSI SAN。不需要昂贵的光纤通道解决方案，iSCSI
    在大多数环境中的工作一样良好。书末的附录描述了如何创建此类开源 SAN 解决方案。


    安装 SAN 是不够的。安装之后，你需要确保 SAN 正确连接到虚拟化主机。单连接是不够的，因为如果该连接的电缆损坏，一切都会停止。你需要冗余。建议在以下组件上实现冗余：


    - SAN 中的磁盘控制器

    - SAN 中的网卡

    - 连接到 SAN 的网络交换机

    - 连接到 SAN 的主机中的网卡或 iSCSI HBA


    除了 SAN 和硬件基础设施外，你还需要几台可以运行虚拟机的宿主机。对于高可用环境，你至少需要两台机器，建议至少使用三台机器。如果你只有两台机器且其中一台故障，那么当所有的虚拟机都加载到剩余的单台节点上时，你将面临剩余节点过载的风险。为了降低这种风险，建议使用两台以上的宿主机。然而，如果你有预算限制，解决方案可以在双节点集群上运行。


    ## 1.4.2 为宿主机选择合适的硬件


    你需要在宿主机上配置的最重要的硬件组件之一是 RAM。计算所需的 RAM 并不困难。将所有虚拟机的 RAM 要求相加，向上取整到下一个合理的 RAM 配置即可。例如：如果你想安装四台每台需要
    4 GB 的 Windows 机器，三台每台需要 2 GB 的 OES 服务器，以及八台每台需要 2 GB 的 Linux 服务器，你的总需求将是 34 GB。由于你把此工作负载分布在
    3 台宿主机上，每台主机都需要大约 12 GB。


    最近发布的 Xen 4.0 虚拟机监控程序可以做到。你很快就会在大基于 Xen 的解决方案中看到这一点。


