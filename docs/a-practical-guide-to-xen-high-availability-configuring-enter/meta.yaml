    As you can see from the above, the DRBD device is set up, but still synchronizing.
    This will take some time after initially creating the device. If it some time,
    it will get synchronized completely after a while.


    In this procedure you have read how to set up a DRBD device. That''s a nice start
    if you want to create the open source SAN solution, but it''s not good enough.
    As it is right now, if san1 goes down, you need to set up the drbdset primary
    command manually on the other server. Typically, you don''t want to do that and
    what is you are going to create a Heartbeat cluster solution. In the next section
    you will read how to set up this cluster.


    # 9.4 Setting up the Heartbeat Cluster


    Let''s be about this: setting up a Heartbeat Cluster is just something else. Doing
    properly involves a lot of steps, such as setting STONITH ensures that a failing
    node is not shut down automatically. I''m not covering all, thus assuming that
    your Heartbeat network is already configured. In case it isn''t, use the following
    minimal guidelines to create a simple two-node Heartbeat cluster in SUSE YaST.


    > WARNING: The procedure described below is a minimal procedure and for use in
    a test environment only. Use at your own risk if you want to set up a production
    environment using this procedure!


    - 1. Make sure that name resolving is set up properly. If you are using DNS, probably
    everything is in place already. Not, make sure that the /etc/hosts file on all
    nodes includes names and IP addresses of all other nodes.

    - 2. On san1, start the YaST administration utility, using yast2.

    - 3. From YaST, select Miscellaneous > High Availability. In the window you see
    now, you already see the name of the node that you run YaST from. In the Add Nodes
    bar, enter the name of the node you want to add and click Add. This gives you
    a result as in the figure below. Now click Next to proceed.


    Appendix: Creating an Open Source SAN Solution


    # A Practical Guide to XEN High Availability


    ![](img/b40539f0f23a32fb6110fc27a5bf954e_119_0.png)


    This is what the Node Configuration window should look like after adding all nodes.


    - 4. Next, you need to select an authentication method. Strictly speaking, you
    don''t need any authentication, but if you want to deploy more than one Heartbeat
    network in the broadcast domain, it is a good idea to use SHA1 or MD5 as the authentication
    method. By providing an authentication key with either of these protocols, you
    can prevent networks from mixing by accident.


    ![](img/b40539f0f23a32fb6110fc27a5bf954e_119_1.png)


    Provide an authentication key to prevent Heartbeat clusters from mixing up by
    accident.


    # A Practical Guide to XEN High Availability


    - 5. In the Media Configuration window, you specify what connection is be used
    for the Heartbeat traffic. By default, the Heartbeat traffic will be sent broadcast
    over the default LAN connection. It is a good idea to use the connection that
    is used for the storage synchronization between the two parts of the DRBD device
    here, make sure that device is selected and then click Next to continue. You can
    safely ignore any error messages that are displayed.


    ![](img/b40539f0f23a32fb6110fc27a5bf954e_120_0.png)


    Make sure to select the network interface for the Heartbeat traffic.


    - 6. In the final step of the procedure, you can specify if you want to start
    the Heartbeat service automatically when your server boots or not. Make sure that
    it is started automatically and click Finish to complete this part of the procedure.


    - 7. To finalize the Heartbeat installation, use the /usr/lib[64]/heartbeat/ha
    propagate command. This command will use scp to copy the Heartbeat configuration
    to the other nodes in the network. This command copies the configuration to the
    other node, but doesn''t start Heartbeat on that node as well. To make sure it
    comes up after a reboot, use the following two commands on the other node:


    ```bash

    inservice heartbeat

    heartbeat start

    ```


    Your cluster is now up and running. There are two methods to do a quick check.
    The first is by using the crm_mon -I 1 command. This command shows you information
    about the amount of nodes that were found in the cluster and the associated resources.


    # A Practical Guide to XEN High Availability


    Listing: The crm_mon command gives an easy method to see if nodes in your cluster
    are available.


    ```bash

    sanl/etc $ crm_mon -i 1

    Refresh in ls...


    ===========

    Last updated: Mon Jun 23 20:56:37 2008

    Current DC: sanl (ecbaa864-30cf-4e47-9c1e-395381c3c460)

    2 Nodes configured.

    0 Resources configured.

    ===========

    Node: san1 (ecbaa864-30cf-4e47-9c1e-395381c3c460): online

    Node: san2 (76d72fcb-efd3-4fde-975f-bcafd58bbbd): online

    ```


    The other method to check if the cluster is up and running, is by using the hb_gui
    graphical user interface. To work from this interface, you need to provide the
    user hascluster with a password. First, use passwd hascluster and next type hb_gui
    on either of the nodes in the cluster. After starting it, use Connection > Login
    to authentication. You will now see the current status of the cluster in which
    this moment there will only be two nodes and no resources.


    ![](img/b40539f0f23a32fb6110fc27a5bf954e_121_0.png)


    From the hb_gui interface you can check the current status of the cluster.


    # 9.4.1 Configuring the DRBD resource in Heartbeat


    You have configured your server to start the DRBD service when booting. Normally
    in a Heartbeat cluster, that''s no good, but in this particular scenario, it is.
    All you need to do in Heartbeat, configure the drbddisk resource. The current
    status is that there are two resources available for DRBD. The old drbddisk resource
    does work, the Heartbeat version 2 style OCF agent doesn''t, so in this document
    I''ll describe how to use drbddisk. The prerequisite for using this, is that DRBD
    must be started from the runlevels of all servers involved. Next, from the hb_gui
    interface, create the resource as described below.


    - 1. From one of the nodes, start hb_gui and authenticate as user hacluster.

    - 2. Select Resources > Add New Item and select the Item type. Click OK next.

    - 3. The ultimate goal is to create a resource that manages DRBD as well as the
    iSCSI target service. To make this easier on, you''ll start working on the group
    from the beginning. In the Add Native Resource window you can see from the figure
