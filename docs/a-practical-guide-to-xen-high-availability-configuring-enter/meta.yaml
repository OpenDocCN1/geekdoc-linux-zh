    automatically. You have to add it to the cluster. To do that, two components are
    needed: a unique IP address on which the iSCSI target can be used and a resource
    that will start the iSCSI target service for you. The following procedure describes
    how to add these:


    - 1. Start the hb_gui utility from one of the servers.


    ## A Practical Guide to XEN High Availability


    - 2. Select the iCSITargetGroup you created earlier, right click on it and from
    the drop-down list, select the Item type. Next, enter the Resource ID iSCSI IP_Address
    and from the Type list, select ipaddr2. In the parameters section of the interface,
    you''ll see that the ip parameter has been added automatically. Click the Value
    to add an IP address. ![](img/b40539f0f23a32fb6110fc27a5bf954e_128_0.png)


    You need to enter this in CIDR format. 3. Now click Add Parameter and select cidr_mask.
    In here, enter the netmask your IP address. So /24 and not 255.255.0. Next click
    OK to add it. In case your server has multiple network boards, you also want to
    make sure that the IP address binds to the right interface. To accomplish this,
    click Add Parameter once more and next enter the name of the interface to which
    you want to assign the IP address and click Add to the resource.


    - 4. Apart from the unique IP address to be used by the target, you need to create
    a resource for the iSCSI service. Right-click on iCSITargetGroup and


    Appendix: Creating an Open Source SAN


    from the menu, select Add Item. When asked what kind of resource you want to add,
    make sure to select the Native type.


    - 5. As the name of the resource, enter iSCitarget and from the list of available
    resource types, select iscisarget. Next click Add to add the iSCSI target.


    - 6. Everything is in place now to start the associated resources. Right click
    iCSITargetGroup and from the menu, select Start. This will start the resources
    and since they are in the same group, all will be started on the same node. Congratulations,
    you now have your open source SAN ready to go!


    ## 9.6 Connecting to the SAN


    Now that the SAN is in place, all you need to do, is connect to it. To do that,
    from the server that you want to connect you need to initiate an iSCSI session.
    You can do that by using a software iSCSI initiator as well available for almost
    all operating systems. Alternatively, you can use an iSCSI HBA as well. For instance,
    qlogic HBAs are popular. These contain an integrated iSCSI server that will connect
    to the SAN. Using a hardware HBA is a good idea, because it will its own dedicated
    chip, so it doesn''t have to compete with other system resources for CPU cycles
    and memory. This is because the iSCSI process has absolutely give you the best
    performance. Configuring the iSCSI connection to the SAN falls beyond the scope
    of this article, just read one of those articles that says you need to connect
    to the SAN. You now know how to do that.


    You should also know what exactly you can expect from your Open Source SAN Solution.
    Of course, you can expect availability. But what if the active SAN server goes
    down? In that case the iSCSI initiator will lose its session. That is something
    that comes with SCSI, so if the active SAN node fails, the other node will take
    over fast enough. The servers that are connected to the SAN however need to re-establish
    their connection to get into again. So what you reach, is high availability, and
    that can never be the same as uninterrupted availability.

