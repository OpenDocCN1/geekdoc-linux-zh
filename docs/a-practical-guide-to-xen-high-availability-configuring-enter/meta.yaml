    5. 现在指定你想安装的操作系统。在示例中，我将安装 SUSE Linux Enterprise Server 10，你也可以安装任何操作系统。唯一的要求是它必须使用与主机操作系统相同的处理器架构。这意味着你不能在
    32 位的主机上安装 64 位软件（相反是可以的），并且不能在 Intel 平台上安装 SPARC 软件。


