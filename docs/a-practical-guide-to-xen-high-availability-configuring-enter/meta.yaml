    SVN Revision: 2572 built by lmbdale, 2006-10-25 18:17:21

    cs:Connected:st:Primary/Secondary ld:Consistent

    ns:10472628 nr:0 dw:0 drbd:104726528:0 bm:19176 lo:10 pe:0 ua:0 ap:0

    cs:Unconfigured

    ```


    Everything in place for the stress test? Time to start from the test: the san
    node, you are going to kill the cluster now using the pkill heartbeat command.
    This will terminate the Heartbeat service on node 1 and will make the other node
    primary in the DRBD setup.


    Everything working so far? Very good. In case DRBD is up and running. In case
    you are seeing unstable behavior, it is a good idea to restart of both nodes.
    This will bring up DRBD right from the start as a resource that is managed by
    Heartbeat and increases the chances of success. If this doesn''t work, then don''t
    proceed to the next step. If it works, it is time to configure iSCSI.


    > Note: After restarting the servers in your cluster, it will take some time before
    crm mon -l 1 shows both nodes as up and available again. Normally there is no
    problem, wait for the nodes to come up before proceeding.


    # 9.5 Configuring iSCSI


    There are in general two types of SAN; iSCSI based SAN''s and Fibre Channel based
    expensive hardware and therefore is not an option for the open source. In this
    configuration, we will be using iSCSI. In a typical iSCSI configuration, the iSCSI
    target is the service that is provided by the SAN. In this case, the shared device
    will be the drbd0 device that you have created earlier and is made highly available
    in the preceding step of this procedure. Configuring iSCSI is not a very difficult
    two step procedure. First, you''ll use YaST to set up the iSCSI service and after
    that, you''ll make the iSCSI target service highly available.


    +   1. From the servers in your cluster, start YaST by entering the yast2 command
    (if you prefer clicking, you could also select from the start menu of the server
    of course, first, servers are normally in cold data centers and system administrators
    prefer nice and warm, and second, a typical Linux doesn''t run a GUI, does it?
    So you SSH session, and from there, enter the yast2 command, okay?)


    Appendix: Creating an Open Source SAN'
  merge: -1
  pgno: 124
- img_proc: true
