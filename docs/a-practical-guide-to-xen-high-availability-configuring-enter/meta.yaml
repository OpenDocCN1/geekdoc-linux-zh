    # 6.3 Creating the OCFS2 Volume


    Just creating a resource for OCFS2 in the cluster is not enough. You now have
    to create an OCFS2 volume as well. To do this, you perform the following tasks
    from one of the nodes in the cluster:


    +   1. Use multipath -l to find the name of the device that you want to create
    the OCFS2 file on system. As you are using multipath, you must use one of the
    multipath device names, as dm-0. (dm-2 in this example).


    +   2. Consider the amount of nodes that you want to give to the multipath device.
    In the mkfs.ocfs2 command, you are referring to the amount of nodes by the -N.
    For instance, use mkfs.ocfs2 -N 4 /dev/dm-2 to create a shared file on system
    on /dev/dm-2 with access for four simultaneous nodes. The listing below shows
    what the result of this command looks like.


    Listing: Creating an OCFS2 volume with four nodes


    ```

    node1: # mkfs.ocfs2 -N 4 /dev/dm-2

    mkfs.ocfs2 1.4.1

