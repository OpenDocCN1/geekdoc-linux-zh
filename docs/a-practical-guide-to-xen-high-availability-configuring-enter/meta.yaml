- md: "\n## Type of Operating System\n\nPlease specify the type of operating system\
    \ that will run within the virtual machine. This defines many defaults, and helps\
    \ decide how to start paravirtualized operating systems.\n\n- NetWare\n- Other\n\
    - RedHat\n- SUSE\n  - Novell Open Enterprise Server 2 (Linux)\n  - SUSE (other)\n\
    \  - SUSE Linux Enterprise Desktop 10\n  - SUSE Linux Enterprise Desktop 11\n\
    \  - SUSE Linux Enterprise Server 8\n  - SUSE Linux Enterprise Server 9\n  - SUSE\
    \ Linux Enterprise Server 10\n  - SUSE Linux Enterprise Server 11\n  - openSUSE\n\
    \  - openSUSE 11\n- Solaris\n- Windows\n\n![](img/b40539f0f23a32fb6110fc27a5bf954e_94_0.png)\n\
    \nIn Xen, you can install the operating system of your choice\n\n6. You now see\
    \ the Summary screen, from which you have to add the further configuration of\
    \ your virtual machine. To start with, you need to specify the virtualization\
    \ method you want to use. If your operating system is installed in paravirtualized\
    \ mode (which is the case if the software offers the paravirtualization option),\
    \ you should always install in paravirtualized mode, as it offers a much better\
    \ performance. In all other cases, you need to select Full virtualization.\n\n\
    ## A Practical Guide to XEN Availability\n\n![](img/b40539f0f23a32fb6110fc27a5bf954e_95_0.png)\n\
    \nIf possible, install the operating system in paravirtual mode\n\n7. Next, you\
    \ need to give a name to the virtual machine, after which you click the Hardware\
    \ link to specify how much RAM and CPU cores the virtual machine is allowed to\
    \ use. Hopefully, you have already made a calculation for the amount of RAM your\
    \ machine needs. The result of this is as the Initial Memory, for instance, set\
    \ it to 4096 to give your virtual machine 4GB of RAM. It's also a good idea to\
    \ set the Maximum Memory to a considerably higher amount of RAM, Xen offers the\
    \ possibility to increase the amount of available RAM without restarting the virtual\
    \ machine. As you can imagine, this is very useful after some time you find out\
    \ that the 4GB wasn't enough initially. Setting the maximum amount of memory to\
    \ 8GB does not mean that your server is going to use all of it immediately.\n\n\
    Apart from the RAM requirements, you also need to indicate how many CPU cores\
    \ the virtual machine is allowed to use. Make sure that you select more than the\
    \ actual amount of cores that is physically available in your server! If you don't\n\
    \nSetting up the Xen Environment\n\n## A Practical Guide to XEN High Availability\n\
    \nexpect the virtual machine to have a specific benefit from using more than one\
    \ CPU core, it's even better to limit the amount of virtual CPUs to one. This\
    \ prevents you from having to optimize your server for a multi-CPU environment.\n\
    \n![](img/b40539f0f23a32fb6110fc27a5bf954e_96_0.png)\n\nUsing the Maximum Memory\
    \ parameter you can make it easier to allocate memory to a VM later.\n\n8. At\
    \ the Disks option, you have to indicate what the virtual machine can use as its\
    \ hard disk. You probably guessed it already, it's the LVM volume that you have\
    \ created in the cluster for this purpose. After clicking the link Disks, you\
    \ will notice that the virtual machine has already obtained a default disk. This\
    \ is a 4GB disk file which you can safely delete. Next Click and browse to the\
    \ location where the device you use exists. You should look for a directory with\
    \ the name of the volume group, that exists in the /dev directory. In this directory,\
    \ you will find the device file that you need to address the logical volume you've\
    \ created before.\n\n## A Practical Guide to XEN High Availability\n\n![](img/b40539f0f23a32fb6110fc27a5bf954e_97_0.png)\n\
    \nUse the LVM volume that you've created before as the storage back-end for the\
    \ hard disk in the virtual machine.\n\n9. Back in the Disks window, it's also\
    \ useful to indicate how you are planning to install the virtual machine. Assuming\
    \ that you're using an installation-CD, you can click the CD-Rom button and browse\
    \ to the device that you're using to address the optical drive (such as /dev/cdrom),\
    \ or the location of the ISO file that you want to use for this purpose. Back\
    \ in the Disks window, you should now have a hard disk as well as an optical disk.\
    \ If this indeed is the case, click Apply to save your changes and get back to\
    \ the main menu.\n\n## A Practical Guide to XEN High Availability\n\n![](img/b40539f0f23a32fb6110fc27a5bf954e_98_0.png)\n\
    \nYou have to add a hard disk, as well as an optical drive.\n\n10. In case you\
    \ have configured load balancing on the network, by using several bridges, you\
    \ should now indicate which network adapter in the virtual machine you want to\
    \ connect to which bridge. If you have one bridge only (or have no clue what this\
