    \n现在配置就绪，你可以使用 `modprobe drbd` 加载 DRBD 内核模块。如果出现错误“module not found”，请确保你已为正在使用的内核安装了相应的模块（要确定是哪个内核，请使用\
    \ `uname`）。现在内核已加载，是进行第一次测试了。要执行此，使用带有 `-d`（干运行）选项和 `adjust` 参数的 `drbdadm` 命令。这将确保\
    \ DRBD 设备与你刚刚的配置文件同步。现在运行以下命令：\n\n```\ndrbdadm -d adjust drbd0\n```\n\n此命令会给出一些结果。如果输出看起来所示，你就可以继续并将配置复制到第二台服务器。\n\
    \n```\ndrbdset /dev/drbd0 disk /dev/system/DRBD internal --on-io-error=detach\n\
