    # 理解 Xen HA 解决方案


    在本章中，你将介绍 Xen 虚拟化，特别是 Xen HA 解决方案。首先，你将学习使用 Xen 作为虚拟化解决方案的优势。我将 Xen 与 VMware 和
    KVM 等其他虚拟化解决方案进行比较。接下来，你将了解什么是真正的 Xen 高可用。在本章的最后部分，你将了解到购买哪些硬件来构建一个良好的 Xen 高可用解决方案。


    注意：本书是关于创建 Xen 高可用解决方案的。然而，书中描述的解决方案也适用于其他环境。未来，KVM 可能会作为虚拟化解决方案变得越来越重要。使用书中描述的设置，你也可以为
    KVM 虚拟机创建 Xen 高可用。我可能会在本书的后续版本中专门用章节介绍这个主题。


    ## 1.1 具有高可用性和最佳性能的免费虚拟化


    一旦决定实施虚拟化解决方案，大多数从业者都会选择 VMware。这样做有几个原因，其中担心实施一个无法有效管理的解决方案是一个重要因素。太多的客户为了安全感而购买了
    VMware。在本书中，你将读到一种替代方案，它和 VMware 一样好但更便宜：运行在 SUSE Linux Enterprise Server 11 上的
    Xen，结合 Pacemaker 高可用。


    ### SLES 还是其他？


    在本书中，我将讨论 SUSE Linux Enterprise Server 的配置。你并不一定要使用相同的配置或购买 SUSE Linux Enterprise
    Server 提供的解决方案。你也可以在免费软件（如 OpenSUSE 或 Ubuntu）上使用这里讨论的组件。如果你不想使用 SUSE Linux Enterprise
    Server，我建议改用 OpenSUSE。该发行版的结构与这里讨论的软件非常相似，但如果你使用 Ubuntu 等其他发行版，则会有一些差异。


    诚实地说，我们要在 SUSE Linux Enterprise Server 11 之上构建的开源虚拟化解决方案并不像基于 VMware 的相同解决方案那样简单易易。如果你正在寻找一种任何人都可以使用直观的图形界面将虚拟机从一个主机轻松地迁移到另一个主机的解决方案，那么
    SUSE-Xen 解决方案尚未到位。你需要了解 Linux 命令行才能使用该解决方案，并且有时需要于 Linux 控制台上操作一些难以使用的命令，或者处理关键的
    XML 文件。


    这意味着你不应该使用它吗？完全不是！VMware 的解决方案也需要专家才能正确安装。VMware 解决方案失败往往是因为熟练的系统管理员被简单的界面误导并搞砸了事情。如果你启动任何虚拟化项目，你必须知道自己在做什么！


    ## 1.2 为什么选择 Xen？


    在启动项目之前，你必须问清楚什么是真正的 Xen 高可用。在本章的最后部分，你将了解到购买哪些硬件来构建一个良好的 Xen 高可用解决方案。


