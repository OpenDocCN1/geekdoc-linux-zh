    # 5.1.1 Creating the Logical Volumes


    Now that all preparation has been done, it''s time to create the logical volumes
    themselves. Basically, that would mean you have to pvcreate, vgcreate and after
    that lvcreate to create volumes. Following that, you need to create the appropriate
    resources in the cluster that take care of loading the logical volumes without
    any conflicts. Creating these logical volumes however is different from doing
    it in a stand alone environment, as the cluster is involved in taking care that
    the logical volumes are loaded safely. In theory it looks easy enough, in practice
    you''ll have to do a special trick to make sure it all works.


    The problem is that you cannot create a logical volume directly on a multipath
    device. It should be possible to do it, but in many situations it doesn''t work.
    So''ll first need to stop multipath, stop the cluster as well and then create
    the LVM logical volumes on the underlying devices. In the procedure you can read
    how to do this.'
