    \ 192.168.1.240:7788 C\n```\n\nNow that the DRBD device is up and running, you\
    \ can copy it to the other server:\n\n```\nscp /etc/drbd.conf san2:/etc/drbd.conf\n\
    ```\n\nNext, on the second node you will need to load the DRBD module and test\
    \ the DRBD device. So enter the following commands from SAN2:\n\n```\nmodprobe\
    \ drbd\ndrbdadm -d adjust drbd0\n```\n\nIf all looks good, you can now go on and\
    \ really start the DRBD device. First servers, you need to add the service to\
    \ your current runlevels, using insertv drbd on both servers to start the service.\
    \ This enables the DRBD device, but doesn't put it in a synchronized state. Now\
    \ you need to enter the following command on one of the servers to tell that server\
    \ that should act as the primary (which is active) server:\n\n```\ndrbdset /dev/drbd0\
    \ primary --do-what-i-say\n```\n\nThe DRBD service is now up and running and the\
    \ primary-slave relation should be established as well. Use drbd status to test\
    \ if it is all working well."
  merge: -1
