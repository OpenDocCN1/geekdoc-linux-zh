    # Creating the Basic Cluster Configuration


    Now that the network cards have been configured, it is time to take care of the
    cluster. To configure a High Availability cluster in SLES 11 environment, you
    need the SLES High Availability Extension (HAE). This is a product that is sold
    separately from SLES 11. That means you have to pay an additional price for software
    that is normally available for free (see www.clusterlabs.org). In exchange for
    the money you pay, you get supported software with a ecosystem that is created
    to get you up and running as soon as possible, should you encounter problems.
    It is recommended to use the support if you''re creating the cluster in an enterprise
    environment, but not required. In this procedure I''m assuming that you''re using
    SLES 11 with the HAE though. Make sure that you''ve downloaded the software from
    http://www.novell.com/download and made it available to your SLE servers. You
    need to perform the following steps, which are described in this and subsequent
    chapters.


    +   1. Install the Cluster Software

    2. Create the basic cluster configuration

    3. Set up STONITH

    4. Create resources for the virtual machine storage backend

    5. Create virtual machines as cluster resources


    # 3.1 Installing the Cluster Software


    Before you do anything, you need to make sure that the cluster software is installed.
    The following procedure describes how to use YaST.


    +   1. Make the installation media available to your server. For instance, put
    the installation CD in the optical drive of your server.


    +   2. From YaST, select Software > Add on Products.


    +   3. Click Add, select the option CD and then click Next to proceed.


    +   4. Read the license agreement (if you don''t have anything else to do) and
    click Accept to indicate that you agree to the conditions. Next, from YaST, select
    the software category High Availability and click Details to have a look at the
    available packages. The following packages are offered:


    +   * DRBD: This is the Distributed Replicated Block Device, a RAID like mirroring
    solution over the network. Very useful if you don''t have a SAN, but not the best
    solution in this configuration.

    * ipvsadm:The IP Virtual Server, a network load balancer.

    * LVM2: The Cluster Logical Volume manager (cLVM), which allows you to make logical
    volumes available to nodes on the cluster.'
- md: '

    # A Practical Guide to XEN Availability


    - OCFS2: The OCFS2 cluster-aware file system. This file system allows you to have
    write access from multiple nodes to the same file system simultaneously.

    - OpenAIS and Pacemaker: The core cluster components are required to create the
    solution described in this book.


    ![](img/b40539f0f23a32fb6110fc27a5bf954e_31_0.png)


    Install all packages you need from the High Availability Extension


    5. Now click Accept to confirm your choice. When asked if you want to install
    the software dependencies, click Continue to confirm.

    6. At the end of the procedure you will be asked if you want to configure the
    Novell Customer Center. Performing this step allows you to register the HAE product
    for your server and continue to receiving updates. It is a good idea to register
    your server now, although not required to continue the installation procedure.
    If you want to register now, make sure you have the mail address that is used
    for your Novell account, as well as the registration codes for the product. With
    this information, you can follow the prompts to register your server and complete
    the installation procedure.


    Creating the Basic Cluster Configuration


    ## 3.2 Connecting the nodes


    Now that the software packages are installed, you can create the basic configuration
    for the cluster. In this initial part of the procedure, you''ll ensure that the
    nodes are able to see each other and communicate with one another. The following
    procedure describes how to do this.


    1. From YaAST, select Miscellaneous > Cluster. You''ll now see the main window
    from which you''ll create the cluster configuration.


    ![](img/b40539f0f23a32fb6110fc27a5bf954e_32_0.png)


    From this window, you''ll create the initial cluster configuration


    2. To start, from the drop-down list, click the option Bind Network Address. This
    option is used to specify which network card to use for the cluster packets. The
    software will propose automatically all network addresses that are available on
    your server.

    For best performance, it''s a good idea that you select a network interface that
    is representative for the user experience, hence you can select the network where
    the LAN traffic is sent on. After selecting this network, you need to specify
    a multicast address that will be used for the communication in the cluster. You
    can use any IP address with a starting number between 224 and 239, as it''s not
    already in use for something else. On other nodes you will use the exact same
    multicast address; the multicast address is used as a group address to all nodes
    in the cluster will listen. In this example configuration we''ll use the multicast
    address 224.13.14.15.


    > Note: A different approach for the cluster network interface, is to use a dedicated
    interface for the cluster. This offers the advantage that the normal traffic on
    the LAN will not interfere with the cluster traffic. However, it also involves
    the risk that an interface goes down without you knowing it. To prevent this interface,
    you can configure the ping resource. This cluster resource is configured to send
    ping packets to a node in the cluster on a regular basis. Using your default gateway
    would be an excellent choice for that. In this case ping host goes down, the cluster
    will know that there is a communications problem and fail over resources from
    the node that cannot ping any longer. Configuring a ping host is discussed in
    this book.


    3. Before you continue, you need to decide if you want to configure a redundant
    channel for communication of cluster packets. The advantage of using a redundant
    communications link, is that the cluster packets will still be transmitted the
    primary channel goes down. If the primary channel is also used for the normal
    user traffic, probably won''t want the cluster traffic to fail over to the redundant
    channel without any action being taken on the cluster. This is a good reason why
    you wouldn''t want to configure a redundant channel. If you do the redundant channel,
    you''ll need to set up a ping host as well, so that the cluster will know if an
    important connection in the cluster goes down.


    4. Now activate the Service option. From here, under Booting, click the radio-button
    On. This ensures that the cluster is added to all runlevels on your computer,
    which will start automatically. After that, click Start OpenAIS to start your
    cluster. Next, click Finish to save and apply your changes.


    # A Practical Guide to XEN High Availability


    ![](img/b40539f0f23a32fb6110fc27a5bf954e_34_0.png)


    Indicate that the cluster has to be added to your runlevels and you want to start
    it now.


    5. Congratulations, the cluster software is now activated on the first node. Repeat
    this procedure on all the other nodes that are part of the cluster. Just avoid
    any confusion about this: these are all the nodes on which you want to create
    the virtual machines.

    Once you''ve configured the cluster software on all nodes, you can run the command
    crm mon -i 1 on one of the nodes. The crm mon tool is the Cluster Resource Manager
    Monitor (CRM) - which monitors what''s happening in the cluster resource manager
    the heart of the cluster. This CRM decides on which nodes need to be started and
    using the command crm -i 1, you request its current status, with a one second
    interval. The result should look as follows.


    Listing: Use crm mon -i to monitor the current state of the cluster.


    ```

    ============================

    Last updated: Fri Dec 18 13:37:34 2009

    Current DC: nodeodel1 - partition with quorum

    Version: 1.0.3-0080ec086ae9c20ad5dc4c35620000c0ad68374f0a

    2 Nodes configured, 2 expected votes

    0 Resources configured.

    ============================

    ```


    Online: [ node node2 ]


    ## Creating the Basic Cluster Configuration


    6. In the next step you need to prepare the graphical management tool for the
    cluster, hb_gui. This tool needs a hacluster, which is created for you on each
    node where you have installed the cluster software. If you give this user a password,
    you can log in as this user to create and manage resources in the cluster. Hence,
    you need to use the command passwd hacluster to add a password for this user.
    As an alternative, you can also add an existing user account to the group ha-lacient,
    which will give this user management rights in the cluster. Once you''ve done
    that, you can start the cluster management tool, using the hb_gui command from
    the console. This will show the window that you will see in the following figure:


    ![](img/b40539f0f23a32fb6110fc27a5bf954e_35_0.png)


    The initial hb_gui window


    7. To manage and monitor the cluster from the hb_gui interface, you have to authenticate
    the user. To do this, click Connection, select the Login option and enter the
    password you have just created for the hacluster - authenticate as the user account
    that you have just added to the haclient group. It will take a few seconds before
    hb_gui has read all the information from the cluster. Once this has been done,
    you''ll see a window showing you the current state of the cluster, as below:


