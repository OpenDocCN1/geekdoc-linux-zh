    如果您将集群配置为通过专用链路进行通信，那么在集群中为 ping 主机（ping host）配置一个资源是一个好主意。集群将定期向该专用主机发送数据包，以确认网络内部的通信。


    设置 ping 主机（使用 `pingresource`）的理念是让集群中的每个节点定期 ping 一个外部主机。您不想要一个定期运行 ping 的脚本，而是希望集群来发送
    ping 数据包。要实现这一点，您需要在集群中拥有一个资源。资源有两种类型：原始资源（primitives）和克隆资源（clone resources）。实际上，还有一些其他特殊用途资源，但我们暂时忽略它们。原始资源仅在一个节点上启动，而克隆资源会同时在多个节点上启动。要配置
    pingd，您需要一个克隆资源，因为集群中的每一个节点都需要确认它仍然能够与网络的其余部分通信。下面的步骤解释了如何设置 pingd 资源。


    - 1. 确保 Linux HA 客户端已启动。从那里，选择配置（Configuration） > 资源（Resources）并点击“添加”（Add）添加新资源。


    ![](img/b40539f0f23a32fb6110fc27a5bf954e_40_0.png)


    点击“添加”向集群添加新资源


    - 2. 从“添加”菜单中，选择“克隆”（Clone）以添加克隆资源并点击“确定”（OK）。


    - 3. 在“添加克隆 - 基础设置”（Add Clone - Basic Settings）窗口中，为克隆资源输入一个唯一的名称。在本例中，我们将使用 `pingd-clone`
    作为名称。同时确保资源的“初始状态”（Initial state）设置为“已启动”（Started），然后点击“前进”（Forward）继续。


    # XEN 高可用性实用指南


    | 添加克隆 - 基础设置 | |

    | :--- | :--- |

    | 必需 (Required) | |

    | ID: pingd-clone | |

    | 选项 (Options) | |

    | 资源初始状态：已启动 (Started) | |

    | 最大副本数（默认值为集群中的节点数）：2 | |

    | 单节点上的最大副本数（默认值为 1）：1 | |

    | 在操作成功后停止或启动克隆之前通知所有其他副本：默认值为 false | |

    | 全局（每个克隆副本是否执行不同的功能？）：默认值为 false | |

    | 错错 (Interleave)（更改克隆主节点之间顺序约束的行为，以便实例可以在其对等实例启动后立即启动/停止，而不是等待另一个克隆的所有实例完成）：默认值为
    false | |


    - 4. 现在输入“primitive”并点击“确定”（OK）继续。

    5. 在“添加原始资源”（Add Primitive）窗口中，输入 ID “pingd”。从“类”（Class）下拉列表中选择 `ocf`，选择心跳提供程序（heartbeat
    provider）并点击“下一步”，然后从“类型”（Type）下拉列表中，确保选中了 `pingd`。接着点击“前进”（Forward）继续。


    # XEN 高可用性实用指南


    | 添加原始资源 - 基础设置 | |

    | :--- | :--- |

    | 必需 (Required) | |

    | ID: pingd | |

    | Class: ocf | |

    | Provider: heartbeat | |

    | Type: pingd | |

    | Description: pingd | |

    | 确保该资源是 pingd | |

    | 选项 (Options) | |

    | 资源初始状态：已启动 (Started) | |

    | 来自父节点的： | |

    | 监控 (monitor) |


    ![](img/b40539f0f23a32fb6110fc27a5bf954e_42_0)


    - 6. 在最后步骤中，您需要添加一个 属性。为了让 pingd 运行，您需要一个属性。在确保资源正确后，添加 pingd 属性。


    # 添加原始资源 - 总结


    | 元属性 (Meta Attributes) | 实例属性 (Instance Attributes) | 操作 (Operations) |

    | :--- | :--- | :--- |

    | 名称 (Name) | | |

    | 主机列表 (host_list) | 192.168.1.254 | |


    - 7. 点击“应用”。Linux HA 客户端将显示 pingd。从该屏幕中，选择主机列表。这将让 pingd 在所有节点上运行。


    ![](img/b40539f0f23a32fb6110fc27a5bf954e_43_0.png)


    这就是成功配置 pingd 的外观。


    # 在共享存储上设置 STONITH 以确保资源完整性


    在 HA 集群中，从某个节点迁移资源之前，确保该节点已关闭是非常重要的。这可以防止文件系统损坏。当两个节点尝试写入同一个文件系统时，可以确定您的文件系统将会损坏并导致糟糕的结果。为了防止这种情况发生，您需要
    STONITH。


    设置 STONITH 的理念是：在从出现问题的节点迁移资源或服务之前，STONITH 会确保该节点确实关闭。为了做到这一点，STONITH 将直接关闭。通常这是一种硬件机制。因此，要正确设置
    STONITH，您需要一个设备，例如电源（PDU），它具有可以管理的端口，允许您关闭端口的电源。或者，您可以使用服务器上的管理卡，例如 Dell DRAC
    或 HP ILO。为了连接到此硬件，集群使用 STONITH 资源代理向 STONITH 设备发送关闭命令。


    在配置 STONITH 时，最重要的考虑因素是使用的设备。有很多设备可用，但并非所有设备都支持。在本书中，我们将探索五种方案：


    - APC PDU 设备：这是一种可以通过网络管理的电源分配器。它提供了远程关闭端口的功能。

    - DellAC 管理板：这是安装在您的 Dell 服务器上的管理板。安装后，它可以允许您向服务器发送关闭命令。

    - SSH Stonith 资源：这是一个测试资源，可以帮助您理解如何使用 STONITH，但不应在生产环境中使用。

    - Meatware STONITH 设备：如果您处于生产环境且没有合适的硬件，请使用 Meatware 设备。它什么都不做，但可以防止集群上发生文件系统损坏。

    - Null 设备：如果其他方法都失败了，null 设备是一个很好的选择。它完全什么都不做，但可以让集群保持正常。某些资源需要 STONITH 可用，而这就是
    Null Null 设备所做的全部。


    '
