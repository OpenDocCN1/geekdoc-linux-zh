  md: '# A Practical Guide to XEN High Availability


    ![](img/b40539f0f23a32fb6110fc27a5bf954e_103_0.png)


    From the cluster, you can perform a limited amount of management tasks on the
    virtual machines.


    +   Before doing anything else, you should make sure that the virtual machine
    is running nowhere in the cluster. If it is running, you will have serious problems
    while performing the next step. Use xm list on all hosts to verify that the virtual
    machine you have been working on, is not active anywhere. If it is, use xm destroy
    <vm-name> to “pull the power plug” out of the virtual machine.


    +   At this point you can save your changes. While doing that, the cluster will
    automatically take care that the Xen virtual machine is started.


    As the last part of the configuration, you now have to create constraints. While
    creating the cluster, you ensured that the logical volume required by the virtual
    machine was available before starting the virtual machine. When the cluster tries
    to start the virtual machines automatically, you need to make sure that the volume
    is always loaded on the same host as the virtual machine, and that it is loaded
    before the actual virtual machine itself is started. So you need a collocation
    constraint, as well as an order constraint to take care of this. Once this has
    been done, you have your high availability cluster up and running.'
