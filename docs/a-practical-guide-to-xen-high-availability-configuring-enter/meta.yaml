  md: '# Setting up cLVM Shared Storage


    At this point, the preliminary work has been done and you can start configuring
    the resources that you need for the Xen high availability environment. The first
    part of the configuration, takes care of the storage for your environment. A virtual
    machine needs a hard disk and this virtual hard disk has to be represented by
    something on the host computers. There are two approaches for this configuration.


    Formerly, it was common to configure a cluster file system to take care of the
    storage back-end for virtual machines. OCFS2 (which is included in the SLES11
    HAE) was used to provide one huge file system on which the storage back-end for
    virtual machine was taken of by creating files to represent the virtual disk.
    There are however few disadvantages to this approach:


    +   * OCFS2 adds another layer of complexity to the configuration.

    * Using a file as the storage back-end for a virtual machine is not as fast as
    using direct device access.

    * Using one OCFS2 volume adds a single point of failure to your configuration.

    * In the past, OCFS2 was not stable enough, which in worst-case scenario''s might
    mean the entire cluster went down because of an OCFS problem.


    Against all these disadvantages, there is also one advantages to using OCFS2:
    using files as the storage back-end is more flexible, as you can easily copy the
    disk file to another location. As we want to offer you information to set both
    solutions, in this chapter you can read how to set up a cLVM based storage, where
    the next chapter explains how to set shared storage using OCFS2.


    The alternative to using OCFS2, is the Cluster Logical Volume Manager (cLVM).
    In this configuration, you will create logical volumes that can be managed by
    the cluster. That means the cluster has access to a volume and makes sure it will
    never happen that two nodes access the same volume simultaneously. Also drastically
    decreases the risk of getting into severe file system problems if STONITH fails
    to do its work properly! cLVM is part of the SLES11 HAE, so you can use it without
    any problems.


    In the procedure described below, you will learn how to create cLVM volumes. This
    procedure consists of two parts: you need to create some resources in the cluster
    first that support clustered logical volumes. Without configuring these resources,
    you may have locking issues accessing the volumes. After doing that, you need
    to create and configure the LVM volumes themselves.


    To prepare the cluster to handle cLVM volumes, there are two components you need
    to configure. First, you need to create a resource for the Distributed Lock'
  merge: -1
  pgno: 66
- img_proc: true
  md: '# A Practical Guide to XEN High Availability


    Manager (DLM). This component ensures that if one node has access to a volume,
    all other nodes know about it. Next, you need a supporting resource for cLVM.
    This has nothing to do with specific logical volumes, it''s just a resource that
    makes sure that all supporting modules are loaded in the cluster before you start
    working on the cLVMs themselves. Since the resources take care of the preliminary
    conditions to load cLCM, you can create them as clone resources to be loaded on
    all the nodes. The following procedure describes how to do this.


    +   1. Before creating the resources themselves, you need to tell the LVM stack
    on the host machines that the cluster will take care of locking. To do this, you
    need to change a setting in the /etc/lvm/lvm.conf file. In this file, by default
    you''ll find the option locking_type = 1, you should change this to locking_type
    = 3.


    +   2. After changing the lvm.conf on all nodes in the cluster, you can start
    the hb_gui interface. In there, select Configuration > Resources and click Add.
    This opens the interface from which you can add new nodes simultaneously, you
    need to select the Clone resource type. Give the resource the name dlm-clone and
    make sure that the initial state of the resource is set to Started. Next click
    Forward to go to the next step.'
  merge: -1
