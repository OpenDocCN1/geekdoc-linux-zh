    # Appendix: Creating an Open Source SAN Solution


    To set up a Xen High Availability solution, you need a SAN. In most cases, this
    would be a proprietary SAN solution, based on either Fibre Channel of iSCSI. In
    some cases, this is just not feasible, because a proprietary SAN is normally rather
    expensive. If that is the case for your environment, you might consider the Open
    Source SAN solution. This is an iSCSI SAN that is completely based on open source
    software. You can run it on any distribution you like. In this appendix you''ll
    learn how to set it up on SLES


    > Note: During the final review phase of this book, I''ve had to include some
    information about creating your own SAN solution in the book. Because of the very
    tight deadline, I haven''t been able to write a completely new chapter. However,
    for the readers convenience, I have included this text, which is available as
    a download from my website also. The text is written for SUSE Linux Enterprise
    Server 10 sp2, which is applicable to SLES 11 as well. Based on the knowledge
    about Pacemaker that you have acquired in the first chapters of this book, you
    shouldn''t have a hard time creating your own SLES 11 based open source SAN.


    # 9.1 Your own SAN based on DRBD, Heartbeat and iSCSI


    Not everyone has money to buy a SAN appliance. Few companies can afford having
    a SAN and thus losing critical data when their servers storage caches. You don''t
    need a proprietary SAN appliance, but can build your own SAN using open source
    software as well. This article discusses how to do that. Before starting to build
    your SAN solution, you should determine what exactly you need. Typically, a SAN
    consists of different components of which highly available is the core. If your
    SAN consists of one box, you are playing with fire, if this box fails, your data
    will be unavailable and will cost you money. So in real life, it takes two boxes
    to build a SAN and building an open source SAN, this is not different. This is
    where the Distributed Replicated Block Device (DRBD) comes in. Using this solution,
    you can build your own RAID across the network which means that if one of the
    servers that is providing storage goes down, the other server will take over this
    role.


    In a highly redundant SAN solution, you''ll need one point of access. Some SAN
    solutions work with Fibre Channel. Because this involves an expensive fibre based
    infrastructure, such a solution is not the best you can imagine for an affordable
    open source SAN. Instead of using Fibre Channel, we''ll use an iSCSI based solution
    on which the iSCSI target is used to provide access to the storage device.'
- md: "\n# A Practical Guide to XEN High Availability\n\nOne of the challenges of\
    \ building this flexible SAN solution, is to keep it as versatile as possible.\
    \ That means that a failing component has to switch over automatically. So if\
    \ the SAN box that currently hosts DRBD as well as iSCSI access goes down, the\
    \ other box in the SAN needs to take over automatically. To do this, we'll use\
    \ Heartbeat to monitor and ensure availability of all critical resources in the\
    \ SAN.\n\n![](img/b40539f0f23a32fb6110fc27a5bf954e_113_0.png)\n\nSchematic overview\
    \ of the Open Source SAN\n\n## 9.2 Required Software\n\nTo build such a solution,\
    \ you need the appropriate software. Typically, any Linux distribution will do,\
    \ but in this appendix we'll use SUSE Linux Enterprise Server. This Linux distribution\
    \ is available as a free download from http://www.novell.com/download.\n\nOne\
    \ of the advantages of using SUSE, it is that the distribution is used by the\
    \ developers of the Heartbeat software, that plays a critical role in this setup.\
    \ You'll therefore be secured from optimal integration between the operating system\
    \ and the cluster software when working with SUSE. You could use the open source\
    \ version of SUSE Linux as well, but to build a stable and reliable setup, I would\
    \ always recommend working with the enterprise version.\n\nAppendix: Creating\
    \ an Open Source SAN Solution\n\n# A Practical Guide to XEN High Availability\n\
    \nWhen making your choice for software you want to install, keep it to a minimum.\
    \ After all, you are building a SAN solution here and typically on a SAN you wouldn't\
    \ run any services. From the list of installable software patterns, select the\
    \ following:\n\n- Server Base System\n- Documentation\n- GNOME Desktop Environment\
    \ for Server\n- X Window System\n\nAlso make sure that all the software from the\
    \ High Availability Extension has been installed.\n\nApart from that, select the\
    \ iSCSI target components as well, and you don't need anything else. In fact,\
    \ you can do it with less and choose not to select the GNOME environment and X\
    \ Window System, but since SUSE relies on YaST to configure the box, I'd recommend\
    \ that at least as long as you are still working on the installation, keep the\
    \ graphical environment at hand - this is of course not necessary if you're fine\
    \ with the non-graphical version of YaST2(run instead of yast if you've never\
    \ seen it). Once finished the installation, you can still disable it. Of course,\
    \ you are free to start all graphical components from a desktop in what you would\
    \ prefer.\n\nApart from the software requirement, you should also think about\
    \ the hard disk layout you want when creating a solution like this. No matter\
    \ if you are setting up server hardware or two laptops to test that environment,\
    \ you should take into consideration that a storage device is needed for the SAN\
    \ storage. In this 1, I have used /dev/sdb as an example storage device, but this\
    \ assumes that you have two (or even more) hard drives available. In case you\
    \ don't have that, it may be a very good solution to create an LVM setup in a\
    \ large dedicated volume is made for the SAN storage. The LVM setup also allows\
    \ you to work with a snapshot layer, more about that in this article. On my test\
    \ setup two laptops with a 160 GB hard disk have been used, I've used the following\
    \ disk layout:\n\n- /dev/sda1: a 100 MB Ext2 formatted partition on /boot.\n-\
    \ /dev/sda2: the rest of all available disk space, marked as type 8e for use in\
    \ an LVM environment.\n- /dev/system: the LVM volume group that uses the disk\
    \ space available from /dev/sda2.\n- /dev/system/root: a 10 GB Ext3 formatted\
    \ logical volume for the root of the file system.\n- /dev/system/swap: a 2 GB\
    \ logical volume used as swap space.\n- /dev/system/DRBD: a 100 GB logical volume\
    \ which is just allocated and formatted.\n\n# A Practical Guide to Xen High Availability\n\
    \nTo create such a disk layout, use the YaST integrated module while performing\
    \ the installation.\n\n![](img/b40539f0f23a32fb6110fc27a5bf954e_115_0.png)\n\n\
    To configure the disk layout of your SAN, YaST can be of great help.\n\nThe last\
    \ part to take into consideration when setting up your SAN is networking. I recommend\
    \ using your SAN when it is separated from normal network traffic. You don't want\
    \ synchronization between the storage devices in the DRBD to be interrupted by\
    \ a large file transfer initiated by end-user, and if possible, create a dedicated\
    \ storage network.\n\nNormally, you would also want to configure a separated network\
    \ for Heartbeat traffic, in order that a node doesn't get cast off network when\
    \ traffic is temporarily elevated. In this situation I would prefer not to do\
    \ that. If Heartbeat packets come over the normal network connection, it is likely\
    \ that your DRBD device is not communicating anymore. You wouldn't want Heartbeat\
    \ to ignore a failure in the communications link because a redundant link is still\
    \ replying, while your SAN is in a disconnected state would you?\n\n## 9.3 Configuring\
    \ DRBD\n\nAssuming that your server is up and running according to the mentioned\
    \ installation guidelines, it is time to take the first real step in the SAN configuration\
    \ and set up the DRBD device. Before starting this configuration, make sure that\
    \ you have a storage device available on each of the servers in setting up your\
    \ SAN. In this article, I am working on the /dev/system/DRBD device, this name\
    \ can be different in your configuration. It is also a good idea to use the addbd\
    \ resource script that you can download from:\n\n# A Practical Guide to XEN High\
    \ Availability\n\nhttp://www.networkconsulting.com/linux/scripts/addbd_resource.html.\
    \ This script will create the configuration files automatically for you, preventing\
    \ you from making errors. The procedure below assumes that you are working with\
    \ two servers that use the names san1 and san2. Replace these with the names of\
    \ your servers if necessary.\n\n1. Download the addbd_resource script: http://www.networkconsulting.com/linux/scripts/addbd_resource.html.\
    \ Put it in your user's home directory and make it executable using the following\
    \ command: `chmod +x addbd_resource.sh`.\n\n2. Run addbd_resource.sh script and\
    \ provide the following values:\n- Resource name: drbd\n- Number of DRBD device:\
    \ 0\n- Name of the block to be mirrored: /dev/system/DRBD\n- Name of the first\
    \ server: san1\n- IP address of the first server: (your server's IP address)\n\
    - Name of the second server: san2\n- IP address of the second server: (your server's\
    \ IP address)\n- Sync rate: This refers to the speed used when synchronizing changes\
    \ between the DRBD devices. It can be as fast as the connection between your servers.\
    \ Use 100m on a 100mbit LAN, or 1000m on a Gigabit LAN. Want to make sure that\
    \ DRBD doesn't eat all bandwidth? Set it to somewhat lower.\n- Synchronization\
    \ protocol: protocol C at times gives you the optimal combination of speed and\
    \ reliability.\n\nAfter entering all required parameters, write the configuration\
    \ to the /etc/drbd.conf file. This results in a file with contents as the list\
    \ below:\n\nListing: Example of drbd.conf.\n\n```\n/etc/drbd.conf\n# please have\
    \ a look at the example configuration in /usr/share/doc/drbd/drbd.conf\n# begin\
    \ resource drbd0\nresource drbd0 {\n  protocol C;\n  startup (timeout 120);\n\
    \  disk (on-io-error detach);\n  net {\n    sync {\n      rate 100m;\n    }\n\
    \    group 1;\n    extents 257;\n  }\n\n  san1 {\n    device /dev/drbd0;\n   \
    \ disk /dev/system/DRBD;\n    address 192.168.1.230;\n    meta-disk internal;\n\
    \  }\n\n  san2 {\n    device /dev/drbd0;\n    disk /dev/system/DRBD;\n    address\
    \ 192.168.1.240;\n    meta-disk internal;\n  }\n}\n# end resource drbd0\n```\n\
    \nNow that the configuration is in place, you can load the DRBD kernel module\
    \ using `modprobe drbd`. If this gives you a \"module not found\" error, make\
    \ sure that you have installed the appropriate module for the kernel you are using\
    \ (To find out which kernel it is, use `uname`). Now that the kernel is loaded,\
    \ it is time to run a first test. To do this, use the drbdadm command with -d\
    \ (dry run) option and adjust argument. This will make sure that the DRBD device\
    \ is synchronized with the configuration file that you've just created. To do\
    \ this, now run the following command:\n\n```\ndrbdadm -d adjust drbd0\n```\n\n\
    This command gives some results. If it looks like the output, you are good to\
    \ go and copy the configuration to the second server.\n\n```\ndrbdset /dev/drbd0\
    \ disk /dev/system/DRBD internal --on-io-error=detach\ndrbdset /dev/drbd0 sync\
    \ --rate=100m --extents=257\ndrbdset /dev/drbd0 net 192.168.1.230:192.168.1.240:C\n\
    ```\n\nNow that the DRBD device is up up and running, you can copy it to the other\
    \ server:\n\n```\nscp /etc/drbd.conf san2:/etc/drbd.conf\n```\n\nNext, on the\
    \ second node you will need to load the DRBD module and test the DRBD device.\
    \ So enter the following commands from SAN2:\n\n```\nmodprobe drbd\ndrbdadm -d\
    \ adjust drbd0\n```\n\nIf all looks good, you can now go on and really start the\
    \ DRBD device. First, you need to add the service to your current runlevels, using\
    \ `service drbd start` on both servers to start the service. This enables the\
    \ DRBD device, but doesn't put it in a synchronized state. Now you need to enter\
    \ the following command on one of the servers to tell that server that should\
    \ act as the primary (which is active) server:\n\n```\ndrbdset /dev/drbd0 primary\
    \ --do-what-i-say\n```\n\nThe DRBD service is now up and running and the primary-slave\
    \ relation should be established as well. Use `drbd status` to test if it is all\
    \ working well.\n"
  mdcn: "\n\n# XEN 高可用性实用指南\n\n构建这种灵活的 SAN 解决方案的挑战之一在于让它尽可能通用。这意味着当组件故障时，必须自动进行切换。因此，如果当前托管\
    \ DRBD 和 iSCSI 访问的 SAN 节点宕机，SAN 中的另一个节点需要自动接管。为了实现这一点，我们将使用 Heartbeat 来监控并确保 SAN\
    \ 中所有关键资源的可用性。\n\n![](img/b40539f0f23a32fb6110fc27a5bf954e_113_0.png)\n\n开源 SAN\
    \ 架构概览\n\n## 9.2 所需软件\n\n要构建此类解决方案，你需要适当的软件。通常，任何 Linux 发行版都可以，但在本录中，我们将使用 SUSE\
    \ Linux Enterprise Server。该 Linux 发行版可以从 http://www.novell.com/download 免费下载。\n\
    \n使用 SUSE 的优势之一是该发行版由 Heartbeat 软件的开发者使用，而该软件在此配置中起着至关重要的作用。因此，在与 SUSE 工作时，你可以确保操作系统与集群软件之间的最佳集成。你也可以使用\
    \ SUSE Linux 的开源版本，但为了构建稳定可靠的配置，我始终建议使用企业版本。\n\n附录：创建开源 SAN 解决方案\n\n# XEN 高可用性实用指南\n\
    \n在选择想要安装的软件时，请尽量保持精简。毕竟，你在这里构建的是一个 SAN 解决方案，而且通常在 SAN 上不会运行任何服务。从可安装的软件模式列表中，选择以下项：\n\
    \n- 服务器基础系统 (Server Base System)\n- 文档 (Documentation)\n- 服务器级 GNOME 桌面环境 (GNOME\
    \ Desktop Environment for Server)\n- X 窗口系统 (X Window System)\n\n同时确保已安装高可用性扩展（High\
    \ Availability Extension）的所有软件。\n\n此外，还要选择 iSCSI 目标组件，你不需要其他任何。事实上，你可以用更少的组件完成并不选择\
    \ GNOME 环境和 X 窗口系统，但由于 SUSE 依赖 YaST 来配置机器，我建议至少在安装工作期间保留图形化界面——如果你习惯使用非图形化版本的\
    \ YaST2（如果你没见过，请运行 yast 而不是 yast），这当然不是必须。安装完成后，你仍然可以禁用它。当然，你可以自由地从桌面启动任何你喜欢的图形化组件。\n\
    \n除了软件要求外，在创建此类解决方案时，你还应该考虑你想要的硬盘布局。无论你是设置服务器硬件还是两台笔记本电脑来测试该环境，都应该考虑到 SAN 存储需要一个存储设备。在\
    \ 1 中，我使用了 `/dev/sdb` 作为示例存储设备，但这假设你有两个（甚至更多）硬盘可用。如果没有这种情况，那么为 SAN 存储在一个大型专用卷中创建一个\
    \ LVM 配置可能是一个非常好的解决方案。LVM 配置还允许你使用快照层，关于这一点将在本文中介绍。在我的测试设置中，使用了两台带有 160 GB 硬盘的笔记本电脑，我使用了磁盘布局：\n\
    \n- /dev/sda1：位于 `/boot` 上的 100 MB Ext2 格式分区。\n- /dev/sda2：剩余可用磁盘空间，标记为类型 8e 以供\
    \ LVM 环境使用。\n- /dev/system：使用 /dev/sda2 可用磁盘空间的 LVM 卷组。\n- /dev/system/root：10\
    \ GB Ext3 格式逻辑卷，用于文件系统根目录。\n- /dev/system/swap：2 GB 用于交换空间的逻辑卷。\n- /dev/system/DRBD：100\
    \ GB 已分配并格式化的逻辑卷。\n\n# Xen 高可用性实用指南\n\n要创建此类磁盘布局，在执行安装时使用 YaST 集成模块。\n\n![](img/b40539f0f23a32fb6110fc27a5bf954e_115_0.png)\n\
    \n要配置 SAN 的磁盘布局，YaST 可以提供极大帮助。\n\n在设置 SAN 时，最后一部分需要考虑的是网络。建议当你的 SAN 与普通网络流量分离时使用专用网络。你不希望\
    \ DRBD 存储设备之间的同步被用户启动的文件传输中断。通常，你还希望为 Heartbeat 流量配置一个分离的网络，以便在流量临时升高时，DRBD 设备不会因为通信状态。如果\
    \ Heartbeat 包通过普通网络连接传输，你不会希望 Heartbeat 忽略故障，因为冗余链路仍在响应，而你的 SAN 处于断开状态吗？\n\n##\
    \ 9.3 配置 DRBD\n\n假设你的服务器已根据指南启动运行，现在是进行 SAN 配置的第一步：设置 DRBD 设备。在开始此配置之前，确保每台服务器上都有存储设备。在此文中，我在处理\
    \ `/dev/system/DRBD` 设备，此名称在你的配置中可能会不同。另一个好主意是使用从此处下载的脚本：http://www.networking.com/linux/scripts/addbd_resource.html。该脚本将为你创建配置文件，防止你出错。下面的步骤假设你正在使用名为\
    \ `san1` 和 `san2` 的两台服务器。如有必要，将这些替换为你的服务器名称。\n\n1. 下载 `addbd_resource` 脚本：http://www.networking.com/linux/scripts/addbd_resource.html。将其放入用户目录并使用以下命令设置为可执行：`chmod\
    \ +x addbd_resource.sh`。\n\n2. 运行 `addbd_resource.sh` 脚本并提供以下值：\n- 资源名称：drbd\n\
    - DRBD 设备数量：0\n- 要镜像的块：/dev/system/DRBD\n- 第一台服务器：san1\n- 第一台服务器 IP 地址：（你的服务器\
