  - '[PAGE 113]


    # A Practical Guide to XEN High Availability


    One of the challenges of building this flexible SAN solution, is to keep it as
    versatile as possible. That means that a failing component has to switch over
    automatically. So if the SAN box that currently hosts DRBD as well as iSI access
    goes down, the other box in the SAN needs to take over automatically. To do this,
    we''ll use Heartbeat to monitor and ensure availability of all critical resources
    in the SAN.


    ![](img/b40539f0f23a32fb6110fc27a5bf954e_113_0.png)


    Schematical overview of the Open Source SAN


    # 9.2 Required Software


    To build such a solution, you need the appropriate software. Typically, any Linux
    distribution will do, but in this appendix we''ll use SUSE Linux Enterprise Server.
    This Linux distribution is available as a free download from http://www.novell.com/download.


    One of the advantages of using SUSE, it is that the distribution is used by the
    developers of the Heartbeat software, that plays a critical role in this setup.
    You''ll therefore always be secured from optimal integration between the operating
    system and the cluster software when working with SUSE. You could use the open
    source version of SUSE Linux as well, but to build a stable and reliable setup,
    I would always recommend working with the enterprise version.


    114 Appendix: Creating an Open Source SAN Solution'
  - '[PAGE 114]


    # A Practical Guide to XEN High Availability


    When making your choice for software you want to install, keep it to a minimum.
    After all, you are building a SAN solution here and typically on a SAN you wouldn''t
    run any services. From the list of installable software patterns, select the following:


    +   * Server Base System

    * Documentation

    * GNOME Desktop Environment for Server

    * X Window System


    Also make sure that all the software from the High Availability Extension has
    been installed.


    Apart from that, select the iSCSI target components as well, and you don''t need
    anything else. In fact, you can do it with less and choose not to select the GNOME
    environment and X Window System, but since SUSE relies on YaST to configure the
    box, I''d recommend that at least as long you are still working on the installation,
    keep the graphical environment at hand - this is of course not necessary if you''re
    fine with the non-graphical version of YaST2(run instead of yast if you''ve never
    seen it). Once finished the installation, you can still disable it. Of course,
    are free to start all graphical components from a desktop in what you would prefer.


    Apart from the software requirement, you should also think about the hard disk
    layout you want when creating a solution like this. No matter if you are setting
    up server hardware or two laptops to test that environment, you should take into
    consideration that a storage device is needed for the SAN storage. In this 1,
    I have used /dev/sdb as an example storage device, but this assumes that you have
    two (or even more) hard drives available. In case you don''t have that, it may
    be a very good solution to create an LVM setup in a large dedicated volume is
    made for the SAN storage. The LVM setup also allows you to work with a snapshot
    layer, more about that in this article. On my test setup two laptops with a 160
    GB hard disk have been used, I''ve used the following disk layout:


    +   * /dev/sda1: a 100 MB Ext2 formatted partition on /boot.

    * /dev/sda2: the rest of all available disk space, marked as type 8e for use in
    an LVM environment.

    * /dev/system: the LVM volume group that uses the disk space available from /dev/sda2.

    * /dev/system/root: a 10 GB Ext3 formatted logical volume for the root of the
    file system.

    * /dev/system/swap: a 2 GB logical volume used as swap space.

    * /dev/system/BRDB: a 100 GB logical volume which is just allocated and formatted.'
  - '[PAGE 115]


    # A Practical Guide to Xen High Availability


    To create such a disk layout, use the YaST integrated module while performing
    the installation.


    ![](img/b40539f0f23a32fb6110fc27a5bf954e_115_0.png)


    To configure the disk layout of your SAN, YaST can be of great help.


    The last part to take into consideration when setting up your SAN, is networking.
    I recommend using your SAN when it is separated from normal network traffic. You
    don''t want synchronization between the storage devices in the DRBD to be interrupted
    by a large file transfer initiated by end-user, and if possible, create a dedicated
    storage network.


    Normally, you would also want to configure a separated network for Heartbeat traffic,
    in order that a node doesn''t get cast of network when traffic is temporarily
    elevated. In this situation I would prefer not to do that. If Heartbeat packets
    come over the normal network connection, it is likely that your DRBD device is
    not communicating anymore. You wouldn''t want Heartbeat to ignore a failure in
    the communications link because a redundant link is still replying, while your
    SAN is in a disconnected state would you?


    # 9.3 Configuring DRBD


    Assuming that your server is up and running according to the mentioned installation
    guidelines, it is time to take the first real step in the SAN configuration and
    set up the DRBD device. Before starting this configuration, make sure that you
    have a storage device available on each of the servers in setting up your SAN.
    In this article, I am working on the /dev/system/DRBD device, this name can be
    different in your particular configuration. It is also a good idea to use Ron
    Terry''s addrbd resource script that you can download from:'
