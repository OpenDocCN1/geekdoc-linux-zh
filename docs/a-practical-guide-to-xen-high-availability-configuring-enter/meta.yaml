    ## 3.2.1 Registering and Updating your Server


    After completing the software part of the installation of the HAE, you are prompted
    to register your server. In case you haven''t have done that before, here you
    can read how to register a SLES server and additional products that are installed
    on. To register the server, you can follow the prompts at the end of the software
    installation. Alternatively, you can start the Customer Center program from YaAST
    > Miscellaneous yourself. The following procedure describes how to proceed.


    1. From a browser window , go to www.novell.com, log in using your Novell account
    and go to the Novell Customer Center; you can find an entry to the Novell customer
    center from the menu which shows on top of the Novell web site page.


    2. Select My Products > All Products and locate the SLES and HAE products you''ve
    purchased. In here you see the registration codes that you need for your products.

