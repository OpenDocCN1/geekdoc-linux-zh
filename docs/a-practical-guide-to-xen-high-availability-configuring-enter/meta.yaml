  md: 'from the menu, select Add New Item. When asked what kind of resource you want
    to add, make sure to select the Native resource type.


    +   5. As the name of the resource, enter iSCSI target and from the list of available
    resource types, select iscisarget (lsb). Next click Add to add the iSCSI target
    resource.


    +   6. Everything is in place now to start the three associated resources. Right
    click the iSCSITargetGroup and from the menu, select Start. This will start the
    resources and since they are in the same resource group, all will be started on
    the same node. Congratulations, you now have your open source SAN solution ready
    to go!


    # 9.6 Connecting to the SAN


    Now that the SAN is in place, all you need to do, is connect to it. To do that,
    from the server that you want to connect you need to initiate an iSCSI session.
    You can do that by using a software iSCSI initiator as well are available for
    almost all operating systems. Alternatively, you can use an iSCSI HBA as well.
    For instance, qlogic HBAs are popular. These contain an integrated iSCSI server
    that will connect to the SAN. Using a hardware HBA is a good idea, because it
    will its own dedicated chip, so it doesn''t have to compete with other system
    resources for CPU cycles and memory. This is because the iSCSI process has its
    absolutely give you the best performance. Configuring the iSCSI connection to
    the SAN falls beyond the scope of this article, just read one of those articles
    that says you need to connect to the SAN. You now know how to do that.


    You should also know what exactly you can expect from your Open Source SAN Solution.
    Of course, you can expect availability. But what if the active SAN server goes
    down? In that case the iSCSI initiator will lose its session. That is something
    that comes with SCSI, so if the active SAN node fails, the other node will take
    over fast enough. The servers that are connected to the SAN however need to re-establish
    their connection to get into again. So what you reach, is high availability, and
    that can never be the same as uninterrupted availability.'
  merge: -1
