  md: '3. Before you return to the cluster configuration, you need to confirm that
    the OCFS2 file system can mount on all nodes involved. To test this, you can perform
    a manual mount from all of the nodes that have the o2cb resource running on them.
    I like mounting on a temporary directory, just to confirm that it''s working.
    To do this, use the following command:


    ```

    mount -t ocfs2 /dev/dm-2 /mnt

    ```


    4. Don''t forget to unmount all the OCFS2 mounts. If you don''t do this, you''ll
    see that you can''t get the OCFS2 volume to mount in cluster. To unmount the volume
    on all the nodes, use the following command:


    ```

    umount /mnt

    ```


    If this gives you a "Device is busy" message, you are probably in the /mnt directory.
    Get out and try again!


    Now you need to repeat this procedure once more. For a Xen HA on OCFS2, you need
    two OCFS2 volumes, one to store the disk files on, which has to be big, and another
    one on which you are going to store the configuration files, for which 1 GB of
    available disk space is enough.


    # 6.4 Creating Cluster Resources for OCFS2 Volumes


    Now that you have set up OCFS2 successfully, you need to create a clone resource
    in the cluster, which takes care of mounting the volume on all the nodes. You
    have to take special care of the mount point for these volumes. The smaller volume
    must be mounted on /etc/xen/vm, the bigger volume must be mounted on /var/lib/xen/images
    to give access to the disk files of the virtual machines. The following procedure
    shows how to do this:


    +   1. From the Linux HA Management Client, select Configuration > Resources >
    Clone and click Add. From the Add window, click Add. This brings you to the Add
    Clone window.


    +   2. Give the ID OCFS2-data and make sure the Interleave option is selected.
    Then click Forward to proceed.'
