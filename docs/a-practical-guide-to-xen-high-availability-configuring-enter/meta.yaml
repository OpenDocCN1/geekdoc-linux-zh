    \n在 Xen 中，你可以安装任选的操作系统\n\n6. 现在你看到了“摘要”（Summary）屏幕，你必须在此添加虚拟机的进一步配置。首先，你需要指定想要使用的虚拟化方法。如果你的操作系统是以半虚拟化模式安装的（如果软件提供了半虚拟化选项，情况此类如此），你应该始终以半虚拟化模式安装，因为它提供了许多性能优势。在所有其他情况下，你需要选择“全虚拟化”（Full\
    \ virtualization）。\n\n## XEN可用性实用指南\n\n![](img/b40539f0f23a32fb6110fc27a5bf954e_95_0.png)\n\
    \n如果可能，以半虚拟化模式安装操作系统\n\n7. 接下来，你需要为虚拟机命名，然后点击“硬件”（Hardware）链接来指定虚拟机允许使用的 RAM 和\
    \ CPU 核心数。希望你已经对机器所需的 RAM 数量进行了计算。此结果将作为“初始内存”（Initial Memory），例如，将其设置为 4096 以为虚拟机提供\
