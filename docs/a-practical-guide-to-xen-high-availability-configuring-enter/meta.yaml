    ## A Practical Guide to XEN High Availability\n\nAfter installing the servers,\
    \ you need to take care of the SAN. As every SAN is different, I can't be very\
    \ specific on which configuration steps exactly you need to perform. The only\
    \ thing that should be clear is that you use LUN as the storage back-end for every\
    \ virtual machine. So if you want 50 virtual machines, you will need 50 LUNs.\
    \ It is possible to have multiple shares the same SAN, but the configuration will\
    \ be less flexible, it is not recommended. You should check that your SAN supports\
    \ the creation of many LUNs. Some vendors restrict the amount of LUNs that you\
    \ can create on the SAN. You might have to buy additional SAN licensing to be\
    \ able to add the required amount of LUNs. It's not necessary to create all LUNs\
    \ now, you can create some LUNs. Ensure that you have two or three LUNs at this\
    \ moment, which will allow you to configure the first couple of virtual machines.\n\
    \n## 2.2 Connecting the Servers to the SAN\n\nAfter installing the operating system\
    \ on all of the servers, you can connect the servers to the SAN. We assume that\
    \ your servers are equipped with two network cards to connect to the iSCSI SAN.\
    \ Although the individual steps can be slightly different in some environments,\
    \ the procedure described here gives a good indication of what is required. You'll\
    \ need this procedure for environments where you want to connect to the SAN using\
    \ normal Ethernet cards, or specific iSCSI HBAs. If you're using a Fibre Channel,\
    \ the configuration will be different, as the Fibre Channel HBA connects directly\
    \ to the SAN, without requiring additional network configuration.\n\n### 2.2.1\
    \ Creating the iSCSI Connection\n\nIf you're using iSCSI, you can configure SUSE\
    \ to make the iSCSI connection. Let there be no confusion about this, you'll configure\
    \ iSCSI from SUSE, not from the HBA (which may offer you some configuration options\
    \ from the BIOS also). The HBA configuration is required only if you intend to\
    \ boot the operating systems from the SAN, which is specifically not the case\
    \ in a Xen HA environment. The procedure below, describes how to make the iSCSI\
    \ connection from a SUSE host, assuming that you've already set up IP on your\
    \ computer.\n\n- 1. From YaST, select Network Services > iSCSI Initiator. YaST\
    \ will probably tell you that YaST has not installed yet and ask if you want to\
    \ install it. It is recommended that you select the installation at this point.\n\
    \n- 2. After installation, you'll see the iSCSI configuration window. In this\
    \ window, indicate that you want to start iSCSI automatically when booting the\
    \ server. (As everything else depends on the successful creation of this connection,\
    \ you definitely want it to start automatically when booting).\n\n- 3. You will\
    \ now see the iSCSI configuration window. From here, select the option that starts\
    \ iSCSI automatically when booting the server.\n\n![](img/b40539f0f23a32fb6110fc27a5bf954e_16_0.png)\n\
    \nTo begin with, you need to indicate that the iSCSI service is to be started\
    \ automatically on all nodes, so change the default option that it starts manually.\n\
    \n- 4. Navigate to the Discovered Targets tab and click Discovery. In this interface,\
    \ enter the first IP address that you need to connect to the SAN. If your SAN\
    \ has two (or more) IP addresses, enter the second as well as any other IP addresses.\
    \ If you get a warning against a second connection to the same SAN, you can safely\
    \ ignore that.\n\n![](img/b40539f0f23a32fb6110fc27a5bf954e_17_0.png)\n\nNow enter\
    \ all the IP addresses you're using to connect to the SAN.\n\n- 5. Activate the\
    \ Connected Targets tag. On this tab, you can see the current iSCSI connections,\
    \ which should have the status “On Boot”. That means that the driver is loaded\
    \ when booting, but nothing else will happen automatically. To make sure that\
    \ the iSCSI connection is really created, you have to select each connection and\
    \ toggle Startup until the startup mode has changed to Automatic. This will ensure\
    \ that the iSCSI connection is really initiated when booting, making all the iSCSI\
    \ disk devices visible after booting your computer. In the following listing,\
    \ you can see how to make the disk devices visible using the lsscsi command; the\
    \ iSCSI disks are listed with the VIRTUAL-DISK type.\n\nListing: # lsscsi shows\
