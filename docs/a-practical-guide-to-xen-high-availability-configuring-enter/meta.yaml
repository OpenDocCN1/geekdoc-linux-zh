  md: '# Understanding the Xen HA solution


    In this chapter you''ll get an introduction to Xen virtualization and more specifically,
    the Xen HA solution. Firstly, you''ll get to learn the benefits of working with
    Xen as your virtualization solution. I''ll compare Xen to other virtualization
    solutions, such as VMware and KVM. Next, you''ll learn what exactly is by Xen
    High Availability. In the last part of this chapter, you''ll read what hardware
    to purchase to build a decent Xen High Availability Solution.


    Note: this book is about creating a Xen High Availability solution. The solution
    described will however work for other environments as well. It is likely that
    in the future, KVM will become increasingly important as a virtualization solution.
    Using the setup described in this book, you can create Xen High Availability for
    KVM virtual machines as well. I''ll probably dedicate a chapter to that subject
    in one of the next versions of the book.


    # 1.1 Free Virtualization with High Availability and optimal performance


    Once the decision has been made to implement a virtualised solution, the majority
    of industry players choose VMware. There are several reasons for doing this, of
    the fear of implementing a solution that cannot be managed effectively is an important
    one. Too many customers pay for the perception of security and hence buy VMware.
    In this book you''ll read about an alternative, which is as good as VMware but
    cheaper: Xen on SUSE Linux Enterprise Server 11, combined with Pacemaker High
    Availability.


    SLES or something else?


    In this book I will be discussing the configuration on SUSE Linux Enterprise Server.
    You are no means bound to use the same configuration or purchase the solution
    offered by SUSE Linux Enterprise Server. You can use the components discussed
    here on free software, such as OpenSUSE or Ubuntu as well. If you don''t want
    to use SUSE Linux Enterprise Server, I''d recommend using OpenSUSE instead. The
    structure of this distribution is quite similar to the software discussed here,
    where there will be some differences if you''re using other distributions like
    Ubuntu.


    Let''s be honest. The Open Source virtualization solution we''re going to build
    on top of SUSE Linux Enterprise Server 11, is not as easy and accessible as the
    same solution based on VMware. If you''re looking for a solution where anyone
    can migrate a virtual machine easily from one host to another, using an intuitive
    graphical interface, the SUSE-Xen solution isn''t there yet. You need to know
    command line Linux in order to work with this solution, and from time to you'
  merge: -1
  pgno: 8
- img_proc: true
  md: '# A Practical Guide to XEN High Availability


    will need to work with hard to use commands at the Linux console, or with critical
    XML files.

    Does this mean you shouldn''t use it? Not at all! A solution by VMware also needs
    a specialist to be installed correctly. Often VMware solutions fail because a
    skilled system administrator is misled by the to use interface and has missed
    things up. If you start any virtualization project, you need to know what you
    are doing!


    # 1.2 Why Xen?


    Before starting a virtualization project that is based on Xen, you have to ask
    why you want to do it with Xen. Xen has a reputation of being inferior and less
    reliable solution than VMware.


    It''s true that the market for Xen is not as big as that of VMware, but Xen is
    more than just another geek open source project that has no or little support.
    Let''s have a look at the history of Xen, and the companies currently supporting
    it development.


    Xen was originally developed at the university of Cambridge in the United Kingdom.
    The scientists responsible for the development of the Xen hypervisor (which is
    the core component of Xen virtualization), included it in their XenServer which
    they took to market with their open source project XenSource. Various other vendors
    were involved in the open source project Xen. Among these, cheap developers such
    as AMD and Intel, vendors from the Linux market, such as Red Hat and Novell, and
    Microsoft have involved with Xen. Their current HyperV virtualization solution
    is based on a large part on Xen! If you thought Xen wasn''t serious enough, that''s
    not true. Xen enjoys large industry support , which has increased with Citrix
    acquiring XenSource.


    Since the development of the initial versions of the Xen hypervisor, lots of changes
    take place on the virtualization market. As mentioned, Citrix acquired XenSource.
    Does this mean Xen is owned by Citrix? By no means! Xen is still an open source
    project, of which major players of the open source market is involved in ! Citrix
    is an important player in the development of XenServer, Linux vendors - such as
    Novell, Red Hat and Oracle - offer an Xen benefits, including vendors being able
    to use the open source solutions that have been created by any one of the other
    vendors. For example, if Citrix or any other vendor - makes a change to the Xen
    hypervisor, anyone can implement and use it in his own solution.


    There are some differences between CitrixServer and the Novell solution that we
    discuss in this book. The differences are mainly related to management utilities.
    With Citrix, you get XenCenter, an easy to use management interface that makes
    working in a virtual environment very easy. Apart from that, Citrix offers'
  merge: -1
  pgno: 9
- img_proc: true
  md: 'Citrix Essentials, an extensive - paid for - solution that allows you to perform
    all management tasks on your virtualization environment. In the SUSE environment,
    currently, there''s only the Virtual Machine Manager, known to not be the most
    sophisticated tool for managing virtual machines.


    If you want to take advantage of the benefits of Xen, but at the same time, you
    require an axis to use management solution, you might be better off choosing Citrix
    Xen. If you''re not afraid of the Xen command line and you''re willing to work
    with tools that are not sophisticated, you can save a lot of money using Novell
    Xen.


    Apart from Xen, there is another major player on the Linux virtualization market,
    KVM, the Kernel Virtual Machine. The big difference between Xen and KVM, KVM''s
    integration into the Xen kernel itself. To be able to virtualize with KVM, you
    need only one kernel module. To visualize with Xen, you need to load a Xen hypervisor
    in turn loads Thus Xen is a lot more complicated than KVM. The development of
    KVM however is currently not far as that of Xen, therefor it is recommended to
    build your solution on Xen. Even Red Hat, the company that owns KVM technology,
    still offers Xen as their default virtualization solution.


    # 1.3 Xen Technical benefits


    Up to now, we''ve talked about the technical benefits of Xen. These are mainly
    in the way that Xen introduced a revolutionary new approach to virtualization,
    which is known as parvirtualization. In parvirtualization, a software interface
    is used for virtual machines. This software interface is used to communicate directly
    with the underlying hardware. By using this interface, the approach of emulation
    can be avoided. Emulation should be avoided, since all hardware instructions generated
    by virtual machines have to be trapped and translated. This process has a very
    high price in performance terms. In short: parvirtualization makes your virtualization
    solution a lot faster. Currently, Xen is the only player in the virtualization
    space that has completely implemented parvirtualization. Other solutions are still
    trying to get to this point.


    There is something you need to know about parvirtualization. To use parvirtualization,
    you need a special kernel in the operating system that you want to install as
    a virtual machine. This kernel is not available for all operating system. There
    is a parvirtualization kernel for Novell NetWare and Linux, but you won''t find
    one for Windows. You can still virtualize in Xen, but you will have to run it
    in full mode. By using this method, the virtual operating system has to go through
    a layer of emulated drivers, which would cost additional performance. Since Xen
    is using virtualization support on the CPU in this mode, the performance of Windows
    virtual machines is still quite good. Novell has also made available the Virtualization
    Driver Pack, which can be installed in Windows for I/O devices, which means that
    at least on your network and'
  merge: -1
  pgno: 10
- img_proc: true
  md: '# A Practical Guide to XEN High Availability


    storage adapters you can use paravirtualization technology. These drivers are
    only available as an additional purchase. For more information on the Novell Virtual
    Machine Driver Pack, you can refer to: http://www.novell.com/products/vdriverpack.


    # 1.4 Understanding the Xen High Availability Solution


    Before we start talking about hardware and configurations, let''s try to understand
    what it is that we are going to do. To keep it simple, imagine one virtual machine.
    You can run this virtual machine on a single host. However, if the host goes down,
    the virtual machine won''t run anymore. This problem will only get bigger if several
    virtual machines are involved.


    To avoid a situation like this, it is recommended to build a high availability
    solution, using at least two physical machines. In such a solution, you will configure
    a cluster that gives you the high availability. The cluster will be installed
    on the hosts and the cluster to monitor the other nodes. If one of the hosts in
    the cluster goes down, the cluster will also know it. The advantage is that the
    cluster will ensure that if a virtual machine goes down, the virtual machines
    that were running on the host that went down, will be restarted on an alternative
    node as soon as possible.

    nThrough the configuration of a high availability solution for Xen environments,
    you can ensure minimum downtime. It will take some time for the cluster to notice
    a virtual machine or host went down, and to start up the virtual machine on the
    alternative node. With the current state of the available software, there is no
    way that you can avoid this. This is likely to change in future releases of Xen.(In
    fact, the recently released Xen 4.0 hypervisor can do. You will see this in the
    major Xen-based solutions soon.)


    # 1.4.1 Required Hardware


    Now that you know the benefits of using a virtualization solution that is built
    on Xen, let''s have a look at the hardware required to build such a solution.
    To begin with, you need a central storage area. The centralized storage should
    be accessible by all nodes in the cluster. In many environments, this central
    storage area is implemented as a SAN. You may hear people talk about other solutions
    such as a NAS or a NFS Server, however for the solution described in this book,
    only a SAN is going to work.


    Implementing a SAN does not have to cost a lot, nowadays very affordable SAN solutions
    are available, such as Dell''s MD3000 SAN which has been tested for this environment
    and works well. Alternatively, you could build your own source SAN on iSCSI. To
    install a Linux Server with storage attached, configure iSCSI to share this storage
    and you have a cheap iSCSI SAN. There''s no need for an expensive Fibre Channel
    solution, iSCSI works just as well as most'
  merge: -1
  pgno: 11
- img_proc: true
  md: 'environments. The Appendix at the end of this book describes how to create
    such open source SAN solution.


    Installing the SAN is not enough. After installion, you need to ensure that the
    SAN is connected correctly to the virtualization hosts. A single connection is
    not enough, because if the cable for this connection breaks, everything will stop.
    You need redundancy. It is recommended that redundancy is implemented over the
    following components:


    +   - Disk controllers in the SAN

    - Network cards in the SAN

    - Switches on the network that connects to the SAN

    - Network cards or iSCSI HBA''s in the hosts that connect to the SAN.


    Apart from the SAN and the hardware infrastructure, you also need a couple of
    host machines that you can run the virtual machines on. For a high availability
    environment, you need at least two machines, it is recommended that you use a
    minimum of three machines. Should you have only two machines, and one fails, you
    run the risk of the remaining node being overloaded when all your virtual machines
    are loaded on the single remaining node. To decrease this risk, it is recommended
    to use more than two hosts. If, however, you have budgetary constraints, the solution
    can work on two node cluster.


    # 1.4.2 Choosing the Appropriate Hardware for the Host Machines


    One of the most important hardware components you have to configure on the host,
    is RAM. It''s not difficult to calculate the required RAM. Add the RAM requirements
    of all the virtual machines together, round it up to the next reasonable configuration
    of RAM and you''re good. For example: If you want to install four Windows machines
    that require 4 GB each, and three OES servers that need 2 GB each, as well as
    8 Linux servers that need 2 GB, your total requirement would be 34 GB. Since you
    are going to spread this workload over 3 hosts, you would need a theoretical minimum
    of 16 GB per host. However, configuring 16 GB per host will cause a problem if
    one node fails, you will have only 32 GB available on the remaining hosts. It
    is there recommended to use at least 24GB per node in this scenario.


    In other words: in your calculations make sure that the amount of RAM you need
    to run all of your virtual machines, is offered by the total amount of hosts minus
    1. If you need a total of 80GB for your virtual machines, make sure that you have
    three hosts that have 48 GB of RAM each. With this configuration you ensure the
    cluster remains stable if , after the failure of a host, all the virtual machines
    are migrated across the remaining two hosts!'
  merge: -1
  pgno: 12
- img_proc: true
  md: '# A Practical Guide to XEN High Availability


    Once you have calculated the RAM requirement, you''ll have to decide what to do
    with the network cards in your server. It is likely that your server has multiple
    network ports, so if you''re using iSCSI over a normal network card, you need
    two iSCSI interfaces to start with. Next, you''ll need a network that interfaces
    the user as well and it''s a good idea to configure that in redundancy. In Linux
    terminology, you''ll be implementing NIC bonding.


    In a Xen environment, there are two approaches to NIC bonding. The first approach
    would be to bundle the network cards so that they make one huge with double or
    fourfold bandwidth. This however doesn''t work in a Linux environment. It is recommended
    to put two network ports together in a redundant pair. If you have four network
    cards in your server, you would create two of these in redundant pairs. This will
    also give you another benefit: you can manually load balance between servers.
    If you have a very busy web server, and other servers are not busy, you can assign
    one bond to the web server and the other bond to be shared by all the other servers.
    Right now however, you need to know what hardware to buy for your servers. Just
    make sure that your server have at least two, but preferably four network interfaces
    available for the LAN.


    The ideal scenario would be if you could assign one CPU core per virtual machine.
    If you have two quad-core CPU''s per server, you would have 24 cores.


    The rest of the hardware configuration in your server is not as important. It
    would be a good idea to have a reasonable minimum of local storage, so that you
    can put an image file or ISO on the storage area. The bulk of the storage however
    will be on the SAN. Having an optical drive is an option as well. If you don''t
    have an optical driver, you can create an installation server which works just
    as well.'
  merge: -1
  pgno: 13
- img_proc: true
  md: '# Configuring the Hosts


    At this point, I''ll assume you have all the hardware in place and you are ready
    to start working on the software part of the installation. Configuring the software
    is a multi-step procedure:


    +   * Installation of the host servers

    * Creating the LIN''s on the SAN

    * Connecting the host servers to the SAN, including multipath configuration

    * Configuration of networking on the hosts, including NIC bonding and configuration.

    * Installation of the cluster

    * Creating Xen virtual machines

    * Connecting the Xen virtual machines to the hosts


    In this chapter we will discuss what you need to do to configure the host machines,
    including the configuration of networking on the hosts.


    # Installation of the host machines


    To start, you need to install some software on the host servers. In this book,
    we''ll use SUSE Linux Enterprise Server (SLES) 11 for this purpose. Assuming that
    you have some basic Linux knowledge already, I won''t explain step-by-step what
    you need to do to get SLES 11 installed. In some aspects of the installation,
    you might be required to make specific selections.


    SLES 11 will prompt you early in the configuration phase exactly what you want
    to install. You can choose between a full installation, the installation of a
    parvirtual machine, or installation as a Xen host. You might think that you need
    the latter option, but that''s not the case. Since the Xen host installation patterns
    the minimum number of components, only it better to use the Full installation
    option and add the Xen packages to your installation. By selecting the full installation
    option, you sure that some components are configured automatically and makes the
    overall configuration a lot easier. Another benefit of selecting the full installation
    option, is that it will give you a graphical user interface. A Linux expert wouldn''t
    need a GUI to configure a server, but I''ve written this book for novices and
    they might want to work with the GUI tools. It is much easier to run the tools
    locally rather than tunneling through SSH.


    While installing the servers, you don''t need to do anything in particular with
    regard to networking. We''ll take care of the network configuration later in this
    chapter, so just accept the default settings which will configure one network
    card which will get it''s IP address from a DHCP server. You change this later.'
  merge: -1
  pgno: 14
- img_proc: true
  md: '# A Practical Guide to XEN High Availability


    After installing the servers, you need to take care of the SAN. As every SAN is
    different, I can''t be very specific on which configuration steps exactly you
    need to perform. The only thing that should be clear is that you LUN as the storage
    back-end for every virtual machine. So if you want 50 virtual machines, you will
    need 50 LUNs. It is possible to have multiple shares the same SAN, but the configuration
    will be less flexible, it is not recommended. You should check that your SAN supports
    the creation of many LUNs. Some vendors restricts the amount of LUNs that you
    can create on the SAN. You might have to buy additional SAN licensing to be able
    to add the required amount of LUNs. It''s not necessary to create all LUNs now,
    you can create some LUN''s. Ensure that you have two or three LUNs at this moment,
    which will allow you to configure the first couple of virtual machines.


    # 2.2 Connecting the Servers to the SAN


    After installing the operating system on all of the servers, you can connect the
    servers to the SAN. We assume that your servers are equipped with two network
    card to connect to the iSCSI SAN. Although the individual steps can be slightly
    different in some environment, the procedure described here, gives a good indication
    of what is required. You''ll need this procedure for environments where you want
    to connect to the SAN using normal Ethernet cards, or specific iSCSI HBA''s. If
    you''re using a Fibre Channel, the configuration will be different, as the Fibre
    Channel HBA connects directly to the SAN, without requiring additional network
    configuration.


    # 2.2.1 Creating the iSCSI Connection


    If you''re using iSCSI, you can configure SUSE to make the iSCSI connection. Let
    there be no confusion about this, you''ll configure iSCSI from SUSE, not from
    the HBA (which may offer you some configuration options from the BIOS also). The
    HBA configuration is required only if you intend to boot the operating systems
    from the SAN, which is specifically not the case in a Xen HA environment. The
    procedure below, describes how to make the iSCSI connection from a SUSE host,
    assuming that you''ve already set up IP on your computer.


    +   1. From YaST, select Network Services > iSCSI Initiator. YaST will probably
    tell you that YaST has not installed yet and ask if you want to install it. It
    is recommended that you select the installation at this point.


    +   2. After installation, you''ll see the iSCSI configuration window. In this
    window, indicate that you want to start iSCSI automatically when booting the server.
    (As everything else depends on the successful creation of this connection, you
    definitely want it to start automatically when booting).


    +   3. You will now see the iSCSI configuration window. From here, select the
    option that starts iSCSI automatically when booting the server.'
