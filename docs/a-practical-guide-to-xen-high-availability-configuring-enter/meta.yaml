    # Managing The Cluster


    Now the cluster is up and running, the real work begins. The advantage of a well-designed
    cluster, is that it doesn''t involve that much work. The cluster basically runs
    itself and only in rare situations will it be required to perform specific management
    tasks. The purpose of this short chapter, is to make you familiar with the most
    important management tasks.


    # 8.1 Cleaning Up Resources


    On some occasions, you''ll have to delete a resource and start it again. It may
    even happen that you have to delete a resource that is behaving the way you expected
    it to, and create it again as a new resource. In such situations, you may find
    that the resource doesn''t disappear properly from the overview of resources in
    the hb_gui.


    The reason why resources sometimes keep roaming, is that the cluster maintains
    the actual status of the resources and tries to keep it synchronized. If you''re
    interested, you can display this status information using the cibadmin -Q command.
    This command will dump a lengthy xml configuration, containing the current status
    of the cluster. This status comes from the cib.xml, which is the actual status
    of the cluster (and which you should never touch yourself!). In the file, you''ll
    find a configuration part, which contains the resources that you''ve created,
    and the status part, which contains the actual status. In some cases however,
    the actual status doesn''t get synchronized successfully. That may mean that after
    deleting a resource from the hb_gui, you might still see it roaming around, or
    that changes you''ve applied to resources don''t get applied to the cluster. Cleaning
    up a resource forces the resource to be changed across the nodes in the cluster
    and may help in getting the proper information to other nodes.


    To clean up a resource, just right-click the resource you want to update the status
    of, and select Cleanup Resource from the menu. This will immediately start synchronization
    of the resource and may resolve the issues that you are having with it.'
  - '[PAGE 105]


    # A Practical Guide to XEN High Availability


    ![](img/b40539f0f23a32fb6110fc27a5bf954e_105_0.png)


    If resource problems are due to outdated status information in the CIB, you might
    resolve them by cleaning up the resource.


    After selecting the Cleanup Resource, the graphical application will prompt you
    on which node you want to clean it up. If you know for sure that the problems
    are related to one particular node not being updated properly, from the drop-down
    list, select that menu. Otherwise, just select All nodes to update status information
    on all nodes in the cluster.


    # 8.2 Migrating Resources


    Another common maintenance task, the migration of resources. If a failure occurs
    on the cluster, resources will migrate away from the failing node automatically.
    The cluster atomically load balances migrated resources, which means that they
    are spread across the nodes, trying to avoid one node in the cluster from being
    overloaded by migrated resources. The default behavior, is when the node that
    the resource originally was loaded on, comes back in the cluster, the resource
    will fail back to the original node. If you don''t like this, you can change the
    default resource stickiness. You can find this parameter on the properties of
    the CRM, the Cluster Resource Manager, which is the core component of the cluster.


    If you don''t like the behavior that resources automatically fail back to their
    original nodes, you can change the value of Default Resource Stickiness. The following
    procedure describes how this works:'
- md: '

    # A Practical Guide to XEN High Availability


    1. From the Linux HA Management Client, select Configuration > CRM Config. This
    gives you the current values that are used by the CRM.


    ![](img/b40539f0f23a32fb6110fc27a5bf954e_106_0.png)


    On the CRM Config object you can set default behavior for the cluster.


    2. Select the Default Resource Stickiness parameter. The current value of 0 indicates
    that the resource will try to stay where it is. It also implies that the resource
    will move back to its original location after a critical issue in the cluster
    has been resolved. Change this value to 100000. That means that the resource will
    never move away from its current location, unless the node that it currently is
    goes down.


    Instead of setting the stickiness cluster-wide, you can also use it on specific
    resources. To do that, select the resource from the cluster and click Edit to
    change its values. Next, select the Meta Attributes tab and click Add. From the
    drop-down list, you can now select the Resource Stickiness. Set it to the value
    that you''d prefer for your environment.


    # A Practical Guide to XEN High Availability


    ![](img/b40539f0f23a32fb6110fc27a5bf954e_107_0.png)


    You can also specify resource stickiness on individual nodes.


    When a resource is migrated after a node failure in the cluster, it will follow
    the resource stickiness that is set for the resource. If however you migrate a
    resource by hand, a constraint is created for the resource automatically. This
    is something that can cause confusion, because the location constraint may cause
    the resource to fail to automatically migrate to another node if a node goes down.
    Therefore, after a manual migration, you always have to clear the migration constraint.
    This is an easy action that you can perform from the menu that appears after right-clicking
    a resource. From the menu select Clear Migration Constraint. That will allow the
    resource to go anywhere it wants in the cluster. In the figure below you can see
    a migration constraint that has been set to +INFINITY after the LVMforVM1 resource
    was manually migrated to migrate node1.


    # A Practical Guide to XEN High Availability


    ![](img/b40539f0f23a32fb6110fc27a5bf954e_108_0.png)


    After manually migrating a resource, a migration constraint is created for the
    resource.


    ## 8.3 Changing the Resource Management State


    In some situations, such as an update of the cluster software, you may have to
    shut down the cluster software completely. That may be a problem though, when
    resources that are managed by the cluster would go down also, which is not what
    you''ve created a high availability solution for. To prevent this, you can change
    the state of the cluster resource. By default, resources are in a managed state,
    which means the cluster takes care of the resource and it cannot run without the
    cluster being operational. If you put it in an unmanaged state, the resource will
    run all by itself.


    To put a resource in unmanaged state (and to put back in managed state), you can
    work on individual resources, or you can set the state for the entire cluster.
    To set it for the entire cluster, apply the procedure:


    - 1. From the Linux HA Management Client, select Configuration > CRM Config. This
    shows the current properties of the cluster.

    - 2. Click the Check-box next to the Maintenance Mode option and click Apply to
    save your changes.


    3. Now have a look at the Management part of the hb_gui, this will show that all
    resources in the cluster are now in unmanaged mode.


    ![](img/b40539f0f23a32fb6110fc27a5bf954e_109_0.png)


    After putting the cluster in maintenance mode, all resources reach the unmanaged
    state.


    4. When you''re doing maintenance on the cluster, go back to the properties of
    the CRM Config and remove the check-box next to the Maintenance option. This allows
    the cluster to take back control of the resources so that resources will be safe
    again.


    Like with so many options, you can apply them for the entire cluster, or for individual
    resources. The options to manage Managed Mode are also in the menu that appears
    after right-clicking the resource. Select Unmanage Resource to put an individual
    resource in unmanaged mode, select Manage Resource to put it back to managed mode
    once you''ve finished your work with the cluster.


    ## 8.4 Verifying and Synchronizing the Cluster


    In situations, you''ll see that it just doesn''t work the way you want it to.
    There may be two reasons for that. First, you may find that the changes in the
    cluster don''t get synchronized fast enough to the other nodes. Another issue
    may arise if there are errors in the configuration, which can even happen if you''ve
    only created resources from the Linux HA Management Client!


    For both of these cases, there''s a command that might help you. First, you can
    force immediate synchronization of the Cluster Information Base (CIB) between
    the nodes using the cibadmin -S command. This will push the configuration to the
    other nodes and make sure they are up-to-date as well.


    In case you suspect that there are errors in the current cluster configuration
    (or if you''ve only created resources from the Linux HA Management Client!), you
    can check them.


    # Appendix: Creating an Open Source SAN


    To set up a Xen High Availability solution, you need a SAN. In most cases, this
    would be a proprietary SAN solution, based on either Fibre Channel or iSCSI. Because
    this involves an expensive fibre based infrastructure, such a solution is not
    the best you can imagine for an affordable open source SAN. If that is the case
    for your environment, you might consider the Open Source SAN. This is an iSCSI
    based solution that is completely based on open source software.


    Note: During the final review of this book, I had to include some information
    about creating your own SAN in the book. Because of the tight deadline, the text
    is written for SUSE Linux Server 10 sp2, which is applicable to SLES 11 as well.
    Based on the knowledge about Pacemaker that you have acquired in the first chapters
    of this book, you shouldn''t have a hard time creating your own SLES 11 based
    open source SAN.


    ## 9.1 Your own SAN based on DRBD, Heartbeat and iSCSI


    Not everyone has money to buy a SAN appliance. Few companies can afford having
    a SAN and thus losing critical data when their servers storage fails. You don''t
    need a proprietary SAN appliance, but can build your own SAN using open source
    software as well. This article discusses how to do that. Before starting to build
    your SAN solution, you should determine what exactly you need. Typically, a SAN
    consists of different components of which highly available is the core. If your
    SAN consists of one box, you are playing with fire, if this box fails, your data
    will be unavailable and will cost you money. So in real life, it takes two boxes
    to build a SAN and building an open source SAN, this is not different. This is
    where the Distributed Replicated Block Device (DRBD) comes in. Using this solution,
    you can build your own RAID across the network which means that if one of the
    servers that is providing storage goes down, the other server will take over this
    role.


    In a highly redundant SAN solution, you''ll need one point of access. Some SAN
    solutions work with Fibre Channel. Because this involves an expensive fibre based
    infrastructure, such a solution is not the best you can imagine for an affordable
    open source SAN. Instead of using Fibre Channel, we''ll use an iSCSI based solution
    on which the iSCSI target is used to provide access to the storage device.

    '
