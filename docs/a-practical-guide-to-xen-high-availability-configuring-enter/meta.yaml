    和 Linux 有半虚拟化内核，但你会在 Windows 上找不到。你仍然可以在 Xen 中进行虚拟化，但将不得不以全模式运行。通过使用这种方法，虚拟操作系统必须经过一层仿真驱动程序，这会产生额外的性能开销。由于
