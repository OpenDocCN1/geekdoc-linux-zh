    \ is configured the you want.\n\n## A Practical Guide to XEN Availability\n\n\
    ![](img/b40539f0f23a32fb6110fc27a5bf954e_99_0.png)\n\n11. Now you will see that\
    \ it takes a while for Xen to start the installation. After that, you can perform\
    \ the installation of the virtual machine the way you want to.\n\n![](img/b40539f0f23a32fb6110fc27a5bf954e_99_1.png)\n\
    \n## A Practical Guide to XEN High Availability\n\nWhile installing a virtual\
    \ machine, you will see that you have two mice instead of one. This is annoying,\
    \ but there's not much you can do about it - it is a known problem with the VNC.\n\
    \n12. After installing the virtual machines, there is one last but very important\
    \ step to perform. You need to copy the configuration of the virtual machine to\
    \ all hosts. You could do this by an automated solution, such as NFS shares or\
    \ a volume which can be reached by multiple nodes simultaneously, but you'll find\
    \ that is too much work for something that can be accomplished by hand. So at\
    \ this point, make sure you copy the files in /etc/xen to all hosts and you'll\
    \ be ready to proceed to the next step.\n\n## 7.1.1 Preparing for Live Migration\n\
    \nAmong the cool features of Xen, is Live Migration. This means that you can migrate\
    \ one machine to another, without any down time. The user will notice nothing\
    \ at all while you are live-migrating the machine! If you are using migration\
    \ in a cluster environment, this also gives you the benefit that you\n"
  mdcn: "\n\n## 操作系统类型\n\n请指定将在虚拟机中运行的操作系统类型。这定义了许多默认值，并有助于决定如何启动半虚拟化操作系统。\n\n- NetWare\n\
    - 其他\n- RedHat\n- SUSE\n  - Novell Open Enterprise Server 2 (Linux)\n  - SUSE\
