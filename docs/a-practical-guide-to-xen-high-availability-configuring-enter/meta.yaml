  mdcn: '

    XEN 高可用性实用指南


    ## 4.1 STONITH 还是 cLVM？


    在 Heartbeat 集群的早期时代，防止文件系统损坏的方法只有一种，即 STONITH。在现代的 Pacemaker时代，另一种方法已经可用了：cLVM。在
    cLVM 中，你可以将逻辑卷标记为“私有”，这意味着它一次只能被一台服务器访问。如果一台服务器挂载了它，其他服务器甚至无法看到它。这也是防止文件系统损坏的一种方法。


    如果你使用了 cLVM，那么你离不开 STONITH。集群的某些部分确实需要在服务器上安装 STONITH 软件，因此你可能两者都需要。好消息是，如果你配置了适当的
    STONITH（这是可能的，但由于不同的硬件版本，STONITH 存在一些问题），你可以使用一个虚拟的 STONITH 设备来解决，前提是你仅使用 cLVM
    进行文件系统保护。不过，拥有真实的 STONITH 总是更好的。


    在书中，你可以读到关于设置共享存储的两种不同方法。其中一种使用了 cLVM。如果你决定设置该解决方案，你就不真的需要 STONITH。然而，如果你决定采用由
    OCFS2 文件系统（第 6 章）提供共享存储的解决方案，你仍然需要设置 STONITH。


    ## 4.2 在 APC Master 上设置 STONITH


    我个人喜欢的 STONITH 设备是 APC Master，它作为交换式机架电源单元出售。当你在网络上使用此设备时，将所有服务器的插头连接到 APC Master
    设备。使用该设备的用处是，你可以远程重启设备上的任何端口。APC 为你提供了 Web 界面或 telnet 来操作，而 Pacemaker 可以使用 STONITH
    资源来实现相同的功能。


    在你的集群中使用 APC Master 之前，你需要对其进行设置。你可以使用旧方法（在 Windows 上使用串口线和 Hyperterminal），或者使用以下极其酷的步骤来为设备分配
    IP 地址。在开始之前，确保 APC 已连接到你的局域网，并且你有一些服务器连接到 APC 的电源插座。


    - 1. 写下设备的 MAC 地址。你可以在设备上的标签上找到此地址。


    - 2. 在本地计算机上使用 ARP 为设备定义一个 MAC 地址。在 Linux 上，你可以使用以下命令来实现：


    ```

    arp -s 192.16.1.245 00:c0:b7:4b:c9:d9

    ```


    - 3. 现在使用包大小为 113 字节的 ping 为本地设备也设置 IP 地址：


    ```

    ping 192.168.1.245 -s 113

    ```


    你会看到设备对 ping 包进行了响应。


    - 4. 使用 telnet 连接到设备。默认用户名为 apc，默认密码也是 apc。确保更改密码以防止他人对你的设备捣乱。


    - 5. 接下来，从 Console 菜单选择 Network，选择 TCP/IP 然后选择 Manual boot mode（手动启动模式）。你需要借此告诉设备它不是通过
    DHCP 服务器启动的。


    - 6. 回到 Network 主菜单，指定系统 IP、子网掩码和默认网关地址。


    - 7. 使用 Ctrl-C 退出 Console 菜单，然后选择选项 4 登录。这将更改写入设备并使其持久化。


    此时，你的 APC 设备已准备好在集群中使用。你不应该相信自己没亲眼见过的事物，所以让我们做一个小测试。以下步骤描述了你如何重启 APC 上的端口。


    列表：可以访问 APC PDU 的主菜单


