  - '[PAGE 78]


    5. Once the servers are back on-line, you can enter the pvs command to display
    the logical volumes that are currently available. You''ll notice that the physical
    volumes aren''t available on all servers, that''s no problem and you are going
    to fix this later in this procedure. The cLVM in the cluster makes sure that only
    one node in the cluster can access the logical and physical volumes. You can see
    the result of the pvs command in the listing below.


    Listing: Use the pvs command to get an overview of the devices that are available
    for LVM.


    ```

    node1:~ # pvs

    PV VG Fmt Attr Size PFree

    /dev/dm-0 vm1 lvm2 a- 10,0G 100

    /dev/dm-1 lvm2 -- 9,9G 99%

    ```


    6. You can now connect to the server where pvs gave you a list of physical volumes
    as its result and create the LVM volume groups. The ultimate goal of this procedure
    is to create a logical volume which can be used as the storage back-end for the
    virtual machine. Each virtual machine needs LVM volume. To create this LVM volume,
    you first need to create a logical volume, you need one logical volume per machine.
    To make it easier to connect all the pieces together at a later stadium, it''s
    a good idea to use the name of the virtual machine for the volume group. Hence,
    you would create the volume group for the virtual machine using the command vgcreate
    vgmml /dev/dm-0.


    7. As a last step, you need to create an LVM volume for each of the virtual machines.
    The LVM volume should be as big as the entire volume group. To create this volume
    with an example size of 10GB, you would use lvcreate -L 10G -n lvmml /dev/vgmml.
    Repeat this procedure until you have created all the logical volumes you need.


    8. Now that you have created the logical volumes at the file system level, you
    need to create the resources in the cluster to determine where and how the volumes
    can be loaded. Before starting this procedure, you need to determine how you want
    to access the cluster logical volumes. There are two options: you can access them
    exclusively which means that only one node can access them at the same time, or
    you can configure them as volumes with shared access, where multiple nodes can
    access them at the same time. The latter is definitely a very bad idea, so you
    should make the volumes private volumes.


    9. In hb_gui, select Configuration > Resources > Add and select the resource type
    Primitive. As ID for the volume, use a name that makes it easy for you to recognize
    what the resource is used for, as LVMforVM1. Next select the class ocf, the provider
    Heartbeat and the type LVM. Give the resource the initial state Started and Click
    Forward.'
