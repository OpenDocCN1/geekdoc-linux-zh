    How do you ask for the most recent version? Easy. If you''ve purchased this book,
    visit www.books4brains.com/xenha and register the book. I will maintain a database
    with the mail addresses of everyone who purchased this book, and the date you''ve
    registered your purchase. For a full year after your purchase, you will have access
    to updates, free of charge. There is a catch though. I''m a lazy person, so you
    will have to ask for it. (You will receive contact details after registering.)
    Just ask, and I will send you your personal copy of the book. The book will be
    watermarked, which hopefully discourages you to share the PDF with others. In
    my opinion that''s fair enough. Believe me, this book was not written for the
    money. If you divide the invested time by the expected revenue, I would have been
    better off taking an evening job at the local McDonald''s restaurant in my home
    town. So if someone uses the content, I''d like the benefit of compensation for
    the long hours of work I put in this book.


    This concept is new, so I hope you like it. If it succeeds, I want to apply the
    concept to all my future books as well. If it doesn''t work, I''ll try something
    else to keep you updated with the most up-to-date information.


    Enjoy the book!


