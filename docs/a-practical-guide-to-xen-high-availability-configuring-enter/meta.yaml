    # 9.4 Setting up the Heartbeat Cluster


    Let''s be about this: setting up a Heartbeat Cluster is just something else. Doing
    properly involves a lot of steps, such as setting STONITH ensures that a failing
    node is not shut down automatically. I''m not covering all, thus assuming that
    your Heartbeat network is already configured. In case it isn''t, use the following
    minimal guidelines to create a simple two-node Heartbeat cluster in SUSE YaST.


    > WARNING: The procedure described below is a minimal procedure and for use in
    a test environment only. Use at your own risk if you want to set up a production
    environment using this procedure!


    +   1. Make sure that name resolving is set up properly. If you are using DNS,
    probably everything is in place already. Not, make sure that the /etc/hosts file
    on all nodes includes names and IP addresses of all other nodes.

    2. On san1, start the YaST administration utility, using yast2.

    3. From YaST, select Miscellaneous > High Availability. In the window you see
    now, you already see the name of the node that you run YasT from. In the Add Nodes
    bar, enter the name of the node you want to add and click Add. This gives you
    a result as in the figure below. Now click Next to proceed.


    Appendix: Creating an Open Source SAN Solution'
  merge: -1
  pgno: 118
- img_proc: true
  md: '# A Practical Guide to XEN High Availability


    ![](img/b40539f0f23a32fb6110fc27a5bf954e_119_0.png)


    This is what the Node Configuration window should look like after adding all nodes.


    4. Next, you need to select an authentication method. Strictly speaking, you don''t
    need any authentication, but if you want to deploy more than one Heartbeat network
    in the broadcast domain, it is a good idea to use SHA1 or MD5 as the authentication
    method. By providing an authentication key with either of these protocols, you
    can prevent networks from mixing by accident.


    ![](img/b40539f0f23a32fb6110fc27a5bf954e_119_1.png)


    Provide an authentication key to prevent Heartbeat clusters from mixing up by
    accident.'
  merge: -1
  pgno: 119
- img_proc: true
  md: '# A Practical Guide to XEN High Availability


    5. In the Media Configuration window, you specify what connection is be used for
    the Heartbeat traffic. By default, the Heartbeat traffic will be sent broadcast
    over the default LAN connection. It is a good idea to use the connection that
    is used for the storage synchronization between the two parts of the DRBD device
    here, make sure that device is selected and then click Next to continue. You can
    safely ignore any error messages that are displayed.


    ![](img/b40539f0f23a32fb6110fc27a5bf954e_120_0.png)


    Make sure to select the network interface for the Heartbeat traffic.


    6. In the final step of the procedure, you can specify if you want to start the
    Heartbeat service automatically when your server boots or not. Make sure that
    it is started automatically and click Finish to complete this part of the procedure.


    7. To finalize the Heartbeat installation, use the /usr/lib[64]/heartbeat/ha propagate
    command. This command will use scp to copy the Heartbeat configuration to the
    other nodes in the network. This command copies the configuration to the other
    node, but doesn''t start Heartbeat on that node as well. To make sure it comes
    up after a reboot, use the following two commands on the other node:


    ```

    inserrve heartbeat

    heartbeat start

    ```


    Your cluster is now up and running. There are two methods to do a quick check.
    The first is by using the crm_mon -I 1 command. This command shows you information
