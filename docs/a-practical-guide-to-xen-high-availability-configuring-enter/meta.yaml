    # 6.3 Creating the OCFS2 Volume


    Just creating a resource for OCFS2 in the cluster is not enough. You now have
    to create an OCFS2 volume as well. To do this, you perform the following tasks
    from one of the nodes in the cluster:


    +   1. Use multipath -l to find the name of the device that you want to create
    the OCFS2 file on system. As you are using multipath, you must use one of the
    multipath device names, as dm-0. (dm-2 in this example).


