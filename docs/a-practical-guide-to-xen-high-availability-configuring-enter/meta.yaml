    This will copy required credentials to your server, completing the registration.
    You''ll see that the server has been registered successfully. From the window
    confirming this, click OK.


    - 6. At this point, you can update your server. Open a root console on the server,
    and from that console type the zypper update command. This will patch your server
    with the most recent software. Stay with your server, as you may have to reply
    to a confirmation prompt occasionally.


    # 3.3 Setting up a Pingd Server


    If you set up your cluster to communicate on a dedicated link, it''s a good idea
    to configure a resource for a ping host in your cluster. The cluster will send
    packets to that dedicated host periodically, which confirms communication within
    your network.


    The idea behind setting up a ping host, using the pingresource, is each node in
    the cluster pinging an external host on a regular basis. You don''t want a script
    that pings regularly, you want the cluster to send ping packets. To do that, you
    need a resource in the cluster. There are two types of resources, primitives and
    clone resources. In fact, there are some other special purpose resources as well,
    but we''ll ignore them for the moment. A primitive resource is started on one
    node only, a clone resource is started on multiple nodes simultaneously. To configure
    pingd, you''ll need a clone resource, because every single node in the cluster
    needs to confirm that it is still capable of communicating with the rest of the
    network. The procedure below explains how to set up a pingd resource.


    - 1. Make sure that the Linux HA Client is started. From there, select Configuration
    > Resources and click Add to add a new resource.


    ![](img/b40539f0f23a32fb6110fc27a5bf954e_40_0.png)


    Click Add to add a new resource to the cluster


    - 2. From the Add menu, select Clone to add a clone resource and click OK.


    - 3. In the Add Clone - Basic Settings window, enter a unique name for the clone
    resource. In this example, we''ll use pingd-clone as the name. Also make sure
    that the Initial state of the resource is set to Started and then click Forward
    to proceed.


    # A Practical Guide to XEN High Availability


    | Add Clone - Basic Settings | |

    | :--- | :--- |

    | Required | |

    | ID: pingd-clone | |

    | Options | |

    | Initial state of resource: Started |

    | Maximum number of copies (Defaults to the number of nodes in the cluster): 2
    |

    | Maximum number of copies on a single node (Defaults to 1): 1 |

    | Notify all the other copies before stopping or starting a clone when the action
    was successful: Defaults to false |

    | Globally (Does each copy of clone perform a different function?): Defaults to
    false |

    | Interleave (Changes the behavior of ordering constraints between clones masters
    so that instances can start/stop as soon as their peer instance has rather than
    waiting for every instance of the other clone has): Defaults to false |


    - 4. Now enter “primitive” and click OK to continue.

    5. In the Add Primitive window, enter the ID “pingd”. From Class drop-down list,
    select ocf, choose the heartbeat provider and next from Type drop-down list, make
    sure that pingd is selected. Next click Forward to continue.


    # A Practical Guide to XEN High Availability


    | Add Primitive - Basic Settings | |

    | :--- | :--- |

    | Required | |

    | ID: pingd | |

    | Class: ocf | |

    | Provider: heartbeat | |

    | Type: pingd |

    | Description: pingd resource agent. This is a pingd Agent (in the CIB) the current
    number of nodes can connect to. |

    | Options | |

    | Initial state of resource: "Started" or inherit from its parent: |

    | Add monitor operation |


    ![](img/b40539f0f23a32fb6110fc27a5bf954e_42_0.png)


    - 6. In the final step, you need to add Instance Attributes. This tells the resource
    how to do its work. For pingd, you need one attribute which is host_list attribute
    that contains the IP address of the host you want to ping. To add it, make sure
    Instance Attributes window is selected and click Add. From Name drop-down, select
    host_list and make sure to give it as value the IP address of the host you want
    to ping. Then click OK to save it. This shows you the following window.


    # Add Primitive - Summary Of "pingd"


    | Meta Attributes | Instance Attributes | Operations |

    | :--- | :--- | :--- |

    | Name | | |

    | host_list | 192.168.1.254 | |


    ![](img/b40539f0f23a32fb6110fc27a5bf954e_42_1.png)


    The pingd resource needs to know how to ping.


    - 7. Click Apply twice to save the configuration. This brings you back to the
    main screen of the Linux HA Client. From this screen, in the left pane, click
    Management. This will show you that the pingd clone is up and running on all nodes
    in your cluster.


    ![](img/b40539f0f23a32fb6110fc27a5bf954e_43_0.png)


    This is what it looks like if you''ve configured the ping resource successfully.


    # Setting up STONITH to ensure resource integrity


    Before you set up cluster resources in the cluster with access to shared storage,
    there is an important precautionary measure you have to take to prevent the cluster
    from getting corrupted. The name of the mechanism is STONITH and it stands for
    Shoot The Other Node In The Head.


    In a HA cluster, it is of great importance to be sure that a node is down before
    taking over resources from that node. This decreases the risk of file system corruption
    to a minimum. When two nodes try to write to the same file system at the same
    time, you can be sure that your file system will get corrupted and bad things
    will happen. To prevent these kinds of situations, you need STONITH.


    The idea behind STONITH isexplanatory. Before a resource or service is migrated
    from a node that is supposed to have a problem, STONITH makes sure this node is
    really down. To do this, STONITH will simply shut down. Typically this is a hardware
    mechanism. Therefore to set up STONITH properly, you''ll need a hardware device,
    such as a Power Distribution Unit (PDU) which has manageable ports that allow
    you to shut down the power on one of the ports. Alternatively, you could use a
    management card in your server, such as Dell DRAC or HP ILO. To talk to this hardware,
    the cluster uses a STONITH resource agent that sends a command to the STONITH
    device to shut it down.


    When configuring STONITH, the most important item to consider is the device you
    use. Numerous devices are available, but not all are supported. In this book,
    we''ll explore five options:


    - The APC PDU device. This is a power distribution unit that you can manage over
    the network. It provides the option to shut down a port remotely.

    - The DellAC management board. This is a management board that you have to install
    in your Dell server. Once installed, it allows you to send a shutdown command
    to the server.

    - The SSH Stonith resource. This is a test resource that helps you in understanding
    how to use STONITH, but which should never be used in a production environment.

    - The Meatware STONITH device. If you''re in a production environment and you
    don''t have the appropriate hardware, use the Meatware device. It won''t do anything,
    but it will prevent file system corruption to occur on your cluster.

    - The Null device. If everything else fails, the null Null device is a good choice.
    It doesn''t do anything at all, but it keeps the cluster happy. Some resources
    need STONITH to be available and that all the the Null device is doing.

    '
