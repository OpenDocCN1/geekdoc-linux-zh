  md: '# A Practical Guide to XEN High Availability


    3. In the lower part of the Virtual Machine Manager interface, click New to create
    a new virtual machine. This starts the Virtual Machine wizard. In the first window
    that is started by this wizard, click Forward to proceed.


    4. The wizard now asks you if you want to create a new virtual machine, or if
    you prefer using an existing disk that already has a complete virtual machine
    installed on it. From this window, select "I need to install an operating system"
    and click Forward to continue.


