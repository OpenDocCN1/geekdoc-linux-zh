    # 2.2.2 Configuring Multipath


    After configuring the network cards to connect to the SAN, you''ll notice that
    all of the LUN''s that you have created on the SAN are offered twice. If you have
    access to the SAN through two different controllers, you''ll see LUN listed four
    times! For each of the connections that server makes, you''ll get a corresponding
    disk device on the host computer. So your LUN0 on the SAN, might be known as /dev/sdb,
    /dev/sdc, /dev/sdd as well as /dev/sde on your host computer! You cannot use these
    devices as they are too specific. Each of the drives depends on a specific connection
    and if that connection fails, you''ll lose the corresponding drive. So you need
    a solution that is more generic and doesn''t depend on a specific connection.
    This solution is offered by using multipath.


    Before configuring multipath, it''s important to decide which multipath to use.
    In most environments, you can use the open source Linux multipath driver, as well
    as the multipath driver that is provided by your SAN vendor. In general it''s
    a better to use the Linux multipath driver. Multipath is stable and offers you
    all you need, and it''s maintained by your Linux distribution as well. That means
    the driver is patched each time your Linux server is updated. By using the multipath
    driver of your vendor, you run the risk of needing to recompile it after every
    major upgrade of the kernel. That''s something you really don''t want to do in
    a production environment.


    To enable the multipath driver on SUSE Linux Enterprise Server, perform the following
    steps:


    +   1. It is very likely that the multipath driver has already been installed,
    but it is recommended that you confirm this first. Hence, use the zypper search
    multipath command. In the listing below you can see the result of that. In this
    listing, it''s the first line of the result that matters, the i at the start of
    the line tells you that the multipath software has been installed. If zypper doesn''t
    show you the i, use zypper install multipath to install it now.


    Listing: Use zypper search multipath to find out if multipath has already been
    installed


    ```

    node1# zypper search multipath

    Loading repository data...

    Reading installed packages...

    S | Name | Summary

    ---+---+------------------------------------

    | multipath-tools | Tools to Manage Multipathed Devices with th-> | package

    | multipath-tools | Tools to Manage Multipathed Devices with th-> | srcpackage

    ```'
