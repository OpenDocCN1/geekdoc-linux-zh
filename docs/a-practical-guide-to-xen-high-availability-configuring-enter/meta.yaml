    ## 4.3.2 配置 Meatware STONITH


    在最后一段落中，你读到了如何基于 SSH 设置 STONITH。这种 STONITH 方法有效，但也存在一些缺点。因此，你可能倾向于使用 Meatware
    设备（你自己，作为系统管理员）来替代集群中的 STONITH 节点。这个 STONITH 代理只做一件事：向 syslog 发送消息通知管理员他必须关闭某个节点。之后，管理员必须通过执行反应
    -c 命令来确认其操作。只有在此时，集群才知道一切处于控制状态并迁移资源。通过使用 meatware，你完全没有实现高可用性！但优点是它可以防止资源损坏，因为它们永远不会被加载两次。而且，你永远不会陷入
    STONITH 循环，而使用基于 SSH 的 STONITH 时就会发生。


    要使用 Meatware STONITH，你需要为集群中的每个节点准备一个 STONITH 代理。该代理的任务是在节点故障时关闭它。换句话说，为了关闭 node
    1，集群中的其他地方必须有一个可以关闭它的资源。因此，在配置 SSH STONITH 代理时，你需要一个可以在任何地方运行的原始资源，但在问题时需要关闭的主机上。


    设置 STONITH 以确保资源完整性


    # XEN 高可用性实用指南


    下面的步骤描述了你如何在 node1 上配置 Meatware STONITH 资源，以便在出现问题时关闭 node2。你还将学习如何确保该资源永远不会加载到
    node2 上。


    1. 在 Linux HA 管理客户端中，在 Configuration（配置）选项下选择 Resources（资源）并点击 Add 添加新资源。你会看到一个菜单，可以在其中指定想要创建的资源类型。从此菜单中，选择
    Primitive（原始）选项创建一个普通资源。


    2. 从 Primitive 窗口，你现在必须指定如何配置该资源。首先，你应该给它起一个名称。和往常一样，使用一个有助于以后识别你创建该资源用途的名称是个好主意。在这个示例中，STONITH-node2
    就是一个很好的名字。在 Class（类）选项上，选择 STONITH，并在 Type（类型）上确保你选择了 Meatware。最后，在选项下确保 Init
    State of Resource（资源初始状态）设置为 Started（已启动）。然后点击 Forward 进入下一步，可以在那里输入额外参数。


    3. 你现在会看到一个由三个不同选项卡组成的窗口。默认打开 Instance Attributes（实例属性）选项卡。在此选项卡上，你会看到 hostlist（主机列表）属性。选择此属性，点击
    Edit（编辑）并输入要由此 STONITH 代理管理的主机名称。然后点击 Apply（应用）将资源保存到集群中。


    4. 现在你需要创建一个位置约束，确保该资源可以在任何地方运行，但不在 node1 上。为了实现这一点，你需要给约束赋值为 -INFINITY。这与之前为
    SSH 代理描述的过程完全相同。


    5. 保存配置后，你将拥有运行中的 meatware STONITH 代理。你可以杀死杀死节点来测试它们是否真的有效。这样做之后，集群将知道一切正常并进行资源切换。


    ## 4.3.3 如果其他方法都失败了：Nullstonith


    你很快就会发现，STONITH 可能很难配置。但问题是，某些配置（包括本文讨论的配置）仍然需要配置 STONITH。对于其他方法都失败的情况，你可以使用 Nullstonith
    资源。注意，Stonith 设备不提供任何保护，它只会欺骗集群并假装 STITH 操作已正确执行。从这个角度来看，你可能认为它比基于 SSH 的 STONITH
    方案糟。但如果这是唯一实现可用 STONITH 配置的方法，它也比没有好。


    为了帮助你设置此资源，我们将使用不同的方法。直到为止，你通过图形界面配置资源。作为替代方案，你也可以创建一个输入文件并在集群中使用 crm 命令导入配置。要使用此方法，首先创建一个名为
    nullstonith.txt 的配置文件，内容如下列表所示：


    列表：创建 null-stonith 资源的输入文件。


    ```

    primitive stonith-node1 stonith:null \

    params hostlist="*node1 \

    primitive stonith-node2 stonith:null \

    params hostlist="*node2 \

    location 1-stonith-node1 stonith-node1 -inf: node1

    location 1-stonith-node2 stonith-node2 -inf: node2

    commit

    ```


    接下来，使用以下命令导入配置：


    ```bash

    crm < nullstonith.txt

    ```


    '
