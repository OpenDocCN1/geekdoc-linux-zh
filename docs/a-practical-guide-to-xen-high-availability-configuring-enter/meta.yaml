    5. At this point, you need to make sure that the resource you''ve just created
    can be started anywhere, but on the host that it has to be shutdown. You do this
    by creating a location constraint, which is a rule that specifies where the resource
    is allowed to start. From the hb gui, select Configuration > Constraints and click
    Add to a constraint. Select the Resource location type.


    6. Enter a name for the constraint that allows you to find it easily. It is important
    to be clear about names, as you will end up with lots of resources in the cluster,
    which makes it hard to find the resource that you need. Next, enter the following
    attributes:


    - **Resource**: From the drop-down list, at this point you select the resource
    for which you create the constraint. That would be STONITH-node1 for example.

    - **Score**: The score is an indication of how serious you are about this constraint.
    By using the score -INFINITY (read “never”), you specify that the resource may
    be started anywhere, but on the node that you select in the next step.

    - **Node**: Here you choose the node for which you have created the resource,
    which is the node that your DRAC resource is meant to shut down in case of problems.


    The location constraint makes sure that the STONITH resource is started anywhere,
    but on the node that it has to shut down.


