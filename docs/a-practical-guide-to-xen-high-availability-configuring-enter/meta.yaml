    # XEN 高可用性实用指南


    在关闭主机时，该主机上的虚拟机会在实际关闭发生之前自动迁移到集群中的另一台主机。要使用热迁移（live migration），你需要对主机采取一些预防性措施。你必须更改
    `/etc/xend/xend-config.xsp` 文件中的一个设置，该文件可以在每个 Xen 主机上找到。接下来的步骤描述了具体操作方法：


    - 1. 使用编辑器打开 `/etc/xend/xend-config.xsp` 文件并找到以下行：


    ```

    #(xend-relocation-server no)

    #(xend-relocation-port 8002)

    (xend-relocation-hosts-allow ^localhost -localhost\.localdomain$)

    ```


    - 2. 将这些行更改为如下例所示的内容：


    ```

    (xend-relocation-server yes)

    (xend-relocation-port 8002)

    (xend-relocation-hosts-allow '' ) )

    ```


    你应该意识到，上述示例中的 `xend-relocation-hosts-allow` 行将允许网络中的所有主机将虚拟机迁移到此主机。如果你不希望这样做，应该使用正则表达式进行一些额外的过滤。在
    `xend-config.xsp` 文件中，你可以找到一些可以使用正则表达式示例。此外，确保上述行在配置文件中仅出现一次，以避免配置冲突。


    - 3. 在所有你希望执行热迁移的主机服务器上重复上述步骤。


    - 4. 要测试此过程是否真的有效，你现在可以尝试使用 `xm migrate --live` 命令进行。例如，要将虚拟机 `vml` 迁移到主机节点 `node2`，你将使用以下命令：

    `xm migrate --live vml node2`


    ## 7.2 为虚拟机创建集群资源


    最后一步，你现在需要配置集群来管理虚拟机。这意味着你必须为虚拟机创建一个资源，之后通过一个共存性约束（collocation constraint）确保虚拟机和逻辑卷始终保持在一起。从这里，还需要与
    DLM 和 cVM 资源进行共存，才能成功启动逻辑卷。除了这些共存性约束外，你还需要一些顺序约束（order constraints）。之后，你希望在逻辑卷成功初始化后启动虚拟机！


    在开始之前，请确保你已经停止了刚刚创建的虚拟机。在集群中创建资源后，集群将尝试启动虚拟机，如果该虚拟机已经在其他地方运行，它将无法工作。更糟糕的是：如果你仍然尝试，可能会面临严重的文件系统损坏的风险！


    - 1. 现在创建一个原始资源，使用你选择的 ID（`vmserver1` 或任何你喜欢的名称），确保选择类 `ocf`、提供程序 `heartbeat`
    和类型 `Xen`。（请注意，资源不是按字母顺序列出的，你将首先看到所有以大写字母开头的资源，然后是以小写字母开头的资源。确保资源的初始状态设置为 `started`，然后点击“下一步”继续。


    ![img/b40539f0f23a32fb6110fc27a5bf954e_102_0.png](为 Xen 虚拟机创建资源)


    - 2. 在实例属性（Instance Attributes）窗口中，你将看到一个名为 `xmfile` 的属性。该属性需要用于启动虚拟机的配置文件的精确名称和位置。例如，取决于你使用的配置，它可能是
    `/etc/xen/vm1`。如果你也想使用热迁移，此选项可以确保如果集群中的某个节点发生故障，集群将对在该节点运行的虚拟机执行热迁移。使用此选项意味着在节点真正完成之前需要更长时间（毕竟你首先需要将所有虚拟机从该节点迁移走），但此选项的优势是用户将完全没有停机时间。你可能喜欢的另一个参数是
    `allow mem management`（允许内存管理）。正如其名所示，使用此参数可以在稍后的实例中动态调整内存，如果你发现集群中剩余的主机没有足够的内存托管所有虚拟机，这将非常有用。然而，目前
    Pacemaker 软件从集群管理此参数的能力有限。


    ![img/b40539f0f23a32fb6110fc27a5bf954e_103_0.png](设置 Xen 环境 103)


    在集群中，你可以对虚拟机执行有限的管理任务。


    - 在执行任何其他操作之前，你应该确保该虚拟机没有在集群的任何地方运行。如果它正在运行，在执行下一步时你将会遇到严重的问题。在所有主机上运行 `xm list`
    以验证你正在操作的虚拟机在任何地方都没有激活。如果已激活，使用 `xm destroy <vm-name>` 为虚拟机“拔掉电源”。


    - 在此时，你可以保存更改。在执行此操作时，集群将自动处理 Xen 虚拟机的启动。


    作为配置的最后部分，你现在必须创建约束。在创建集群时，你确保了虚拟机所需的逻辑卷在启动虚拟机之前是可用的。当集群尝试自动启动虚拟机时，你需要确保卷始终加载在与虚拟机相同的主机上。因此，你需要共存约束以及顺序约束来处理此问题。一旦完成，你的高可用集群就处于运行状态。


    ## 管理集群


    现在集群已经在运行，真正的工作开始了。设计良好的集群的优势在于它不需要大量工作。集群基本上会自己运行，只有在少数情况下需要执行特定的管理任务。本短章节的目的是让你熟悉最重要的管理任务。


    ## 8.1 清理资源


    在某些情况下，你必须删除一个资源并重新启动。甚至可能出现你需要删除一个符合预期的资源并将其作为新资源创建。在这种情况下，你可能会发现资源没有从集群中正常消失。


    资源有时漂移是因为集群维护了实际状态。如果你感兴趣，可以使用 `cibadmin -Q` 命令显示此状态。该命令将导出包含当前状态的 XML 配置。此状态来自
    `cibxml`，它是实际状态。但在某些情况下，实际状态并没有同步。


    要清理资源，只需右键点击你想更新状态的资源，并在菜单中选择“清理资源”（Cleanup Resource）。这将立即启动资源的同步并可能解决你遇到的问题。


    ![img/b40539f0f23a32fb6110fc27a5bf954e_105_0.png](XEN 高可用性实用指南)


    如果资源问题由于 CIB 中的状态过时引起，你可以通过清理资源来解决它们。在选择清理资源后，图形应用程序将提示你想在哪个节点上清理。如果你确定问题与某个特定节点未正确更新有关，从下拉列表中选择该节点。否则，选择“所有节点”以更新集群所有节点的状态信息。


    ## 8.2 迁移资源


    另一个常见的维护任务是资源的迁移。如果集群发生故障，资源将自动离开故障节点。集群会自动平衡迁移资源，这意味着它们分布在各个节点上，以避免集群中的某个节点被迁移的资源过载。默认行为是，当资源最初加载的主机重新回到集群时，资源将回回到原始节点。如果你不喜欢这样，可以更改默认的资源粘性（stickiness）。你可以在集群资源管理器（CRM，集群的核心组件）的属性上找到此参数。


