    ## 4.3.1 SSH STONITH


    Up to now we have seen two viable STONITH resources. You may however find yourself
    in a situation where a real STONITH device is not available. The problem is that
    the software discussed in this setup, doesn''t work without a STONITH device.
    Hence, you might want to use a test resource. One of these test resources could
    be the SSH STONITH resource. In this subsection you''ll learn how to configure
    it.


    > **WARNING**: The STONITH resource is not created for a production environment.
    In fact, it''s a bad idea to use it unless it''s for your own test where you don''t
    have real hardware available. The risk with the SSH STONITH resource is that you''ll
    find yourself in some kind of ping-pong loop, which means that servers will kill
    each other without interruption. Use this resource at your own risk!


    To configure SSH STITH, you first need to prepare the nodes in the cluster. You''ll
    need hostname resolving (if you don''t have a DNS server that takes care of that),
    and you need to configure SSH for key-based authentication. Last, you have to
    start the stonith agent. It cannot work without this process. The steps below
    describe how to accomplish these tasks.


    > **Tip**: The stonith agent is also the solution if you find yourself out of
    your runlevels. Just log in to the server directly when it comes up, using `service
    stonith restart`.


    1. In an ideal world, you would take care of hostname resolving. If you don''t
    have a DNS server at hand, you''ll need to create entries in /etc/hosts on all
    servers so that you can reach the nodes in the cluster using their names. Make
    sure that you use the IP address that is used by the cluster itself, not the IP
    address you are connecting to.


    2. On all hosts, use `ssh-keygen -t dsa` to create an SSH key pair. This command
    will ask you a couple of questions. On all of these questions, you can just accept
    the defaults by pressing Enter. Also make sure that you don''t enter a passphrase
    for the private key because that would make it rather complicated to enable automatic
    login in the cluster. The listing below gives an impression of the entire procedure
    of creating the SSH keys.


    List: Using ssh-keygen to create a key pair

    root@node2~$ ssh-keygen -t dsa

    Generating public/private key pair.

    Enter file in which to save the key (/root/.ssh/id_dsa):

    Created directory ''/root/.ssh/

    Enter passphrase (empty for no):

    Enter passphrase again:

    Your identification has been saved in /root/.ssh/id_dsa.

    Your public key has been saved in /root/.ssh/id_dsa.pub.

    The key fingerprint is: d5:f8:bb:ff:f7:a1:ec:64:8f:57:0c:89:d3:a0:74

    The key''s random image is:


    ```

    BEGIN DSA PUBLIC KEY FILE-----

    DSA-1024 ...

    END DSA PUBLIC KEY FILE-----

    ```


    3. Now you need to copy the public key from this to the other hosts. To do this,
    you can use the `ssh-copy-id` command followed by the name of the host where you
    want to copy the keys. You''ll need to do this for every host in the cluster.
    For instance, use `ssh-copy-id` to copy the public key of this host to the host
    that uses the name.


    Listing: Use ssh-copy-id to copy the public key from one host to another

    root@node2~$ ssh-copy-id node1

    The authenticity of host ''node1 (192.168.1.10)'' can''t be established.

    RSA key fingerprint is 8e:4b:ed6:2b:2a:15:54:54:35:20:29:b5

    Are you sure you want to continue connecting (yes/no)? yes

    Warning: Permanently added ''node1 (192.168.1.10)'' (RSA) to the list of known
    hosts.

    Password:


    Now try logging into the machine with `ssh ''node1''`, and check in `.ssh/authorized_keys`
    to make sure we haven''t added extra keys that you were expecting.


    4. Now you need to add the service and make sure it is started automatically from
    the runlevels. The following two commands will do this for you:


    ```bash

    service stonith enable

    service stonith start

    ```


    At this point you''ve done all of the preparation to use STONITH. Now you need
    to create the STONITH resources themselves in the cluster. To this, you can use
    the `hb_gui` utility. So make that it is started and you have logged in using
    the appropriate credentials.


    To use STONITH, you need a STONITH agent for every node in the cluster. This agent
    is responsible for shutting down a failing node. Otherwise, to make sure node1
    is shut down in case of problems, you need a STONITH resource somewhere in the
    cluster that can shut down. Some people like to clone resources for this purpose.
    As you have seen in the previous chapter, there are resources that can be started
    more once in the cluster. The idea behind this configuration is that every host
    in the cluster should be able to terminate a failing host. As this is useful only
    in a situation where you would expect multiple hosts to be failing at the same
    time, I don''t use this configuration.

    '
