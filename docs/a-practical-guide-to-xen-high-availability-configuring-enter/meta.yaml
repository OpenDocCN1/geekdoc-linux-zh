    # 4.3.1 SSH STONITH


    Up to now we have seen two viable STONITH resources. You may however find yourself
    in a situation where a real STONITH device is not available. The problem is that
    the software discussed in this setup, doesnt work without a STONITH device. Hence,
    you might want to use a test resource. One of these test resources could be the
    SSH STONITH resource. In this subsection you''ll learn how to configure it.


    > WARNING: The STONITH resource is not created for a production environment. In
    fact, it''s a bad idea to use it all, unless it''s for your own test lab where
    you don''t have real server hardware available. The risk with the SSH STONITH
    resource, is that you''ll find yourself in some kind of STONITH ping-pong game,
    where you enter a STONITH loop, which means that servers will STONITH each other
    without interruption. Use this resource at your own risk!'
