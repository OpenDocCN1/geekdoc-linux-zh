    5. 在此时，您需要确保您刚刚创建的资源可以在任何地方启动，但必须在需要关闭的主机上启动。您通过创建一个位置约束（location constraint）来实现这一点，这是一个指定允许资源在何处启动的规则。从
    hb gui 界面，选择配置（Configuration） > 约束（Constraints）并点击添加约束（Add to a constraint）。选择资源位置类型。


    6. 为约束输入一个名称以便方便地找到它。名称的清晰非常重要，因为集群中最终会有很多资源，这会导致很难找到您所需的资源。接下来，输入以下属性：


    - **Resource（资源）**: 从下拉列表中选择您为创建约束的资源。例如 STONITH-node1。

    - **Score（分数）**: 分数表示您对此约束的重视程度。通过使用分数 -INFINITY（读作“从”），您指定资源可以在任何地方启动，但在您下一步中选择的节点上启动。

    - **Node（节点）**: 在此处选择您创建资源的节点，即您的 DRAC 资源在出现问题时旨在关闭的节点。


    位置约束确保了 STONITH 资源在任何地方启动，但在它必须关闭的节点上启动。


    此时，您已在一个节点上运行了 DRAC STONITH 资源。您必须对集群中的所有节点重复此过程。


    ## 4.3.1 SSH STONITH


    到目前为止，我们已经看到了两种可行的 STONITH 资源。但您可能会发现自己处于没有实际 STONITH 设备的情况。问题是，此设置中讨论的软件在没有 STONITH
    设备的情况下无法工作。因此，您可能想使用测试资源。这些测试资源之一可以是 SSH STONITH 资源。在本节中，您将学习如何配置它。


    > **警告**：STONITH 资源并非为生产环境创建的。事实上，除非是在您没有可用硬件的自环境中，否则使用它是一个坏主意。SSH STONITH 资源的风险在于，您可能会陷入某种乒乓循环中，这意味着服务器将无间断地互相杀死。使用此资源风险风险自负！


    要配置 SSH STONITH，您首先需要准备集群中的节点。您需要主机名解析（如果您没有处理该问题的 DNS 服务器），并且需要配置基于密钥的 SSH 身份验证。最后，您必须启动
    stonith 代理。没有此进程，它无法工作。下面的步骤描述了如何完成这些任务。


    > **提示**：如果您发现自己处于运行级别（runlevels）之外，stonith 代理也是解决方案。只需在服务器启动时直接登录并使用 `service
    stonith restart` 即可。


    1. 在理想世界中，您将处理主机名解析。如果您手头 DNS 服务器，则需要在所有服务器的 /etc/hosts 中创建条目，以便使用名称访问集群中的节点。请确保您使用的是集群本身使用的
    IP 地址，而不是您连接的 IP 地址。


    2. 在所有主机上，使用 `ssh-keygen -t dsa` 创建 SSH 密钥对。此命令会询问您几个问题。对于所有这些问题，您只需按 Enter 键接受默认值。还要确保不要为私钥输入密码，因为这将使集群中启用自动登录变得相当复杂。下面的列表展示了创建
    SSH 密钥的整个过程。


    列表：使用 ssh-keygen 创建密钥对

    root@node2~$ ssh-keygen -t dsa

    Generating public/private key pair.

    Enter file in which to save the key (/root/.ssh/id_dsa):

    Created directory ''/root/.ssh/

    Enter passphrase (empty for no):

    Enter passphrase again:

    Your identification has been saved in /root/.ssh/id_dsa.

    Your public key has been saved in /root/.ssh/id_dsa.pub.

    The key fingerprint is: d5:f8:bb:ff:f7:a1:ec:64:8f:57:0c:89:d3:a0:74

    The key''s random image is:


    ```

    BEGIN PUBLIC KEY-----

    DSA-1024 ...

    END PUBLIC KEY-----

    ```


    3. 现在您需要将公钥复制到其他主机。要执行此，可以使用 `ssh-copy-id` 命令加上想要复制密钥的主机。您需要对集群中的每个主机执行此操作。例如，使用
    `ssh-copy-id` 将此主机的公钥复制到目标主机。


    列表：使用 ssh-copy-id 复制密钥

    root@node2~$ ssh-copy-id node1

    The authenticity of host ''node1 (192.168.1.10)'' can''t be established.

    RSA key fingerprint is 8e:4b:ed:2b:2a:15:54:54:35:20:29:b5

    Are you sure you want to continue connecting (yes/no)? yes

    Warning: Permanently added ''node1 (192.168.1.10)'' (RSA) to the list of known
    hosts.

    Password:


    现在尝试使用 `ssh ''node1''` 登录机器，并检查 `.ssh/authorized_keys` 以确保我们没有添加预期的密钥。


    4. 现在您需要添加服务并确保它从运行级别自动启动。以下两个命令可以为您完成工作：


    ```bash

    service stonith enable

    service stonith start

    ```


    此时，您已完成使用 STONITH 的所有准备工作。现在您需要在集群中创建 STONITH 资源本身。为此，您可以使用 `hb_gui` 工具。所以请确保它已启动且您已使用相应的凭据登录。


