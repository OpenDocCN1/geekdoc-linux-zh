    # Setting up Shared Storage with OCFS2


    In the days of SLES 10, it was common to set up OCFS2 as shared storage. SLES
    11 can still do that, but the approach is a little different. This chapter describes
    how to set up OCFS2-based shared storage. The information in this chapter is provided
    as an alternative to the information in the previous chapter, if you''ve already
    configured LVM volumes, you can skip this chapter.


    # 6.1 The big picture


    When setting up OCFS2 as the solution, the overall process is going to be different.
    To make sure you''re going to apply the right procedure, you can find an overview
    of the steps you have to perform below:


    +   Configure two LUN''s on the SAN, one generic purpose LUN on which you are
    going to store all the files that are going to be used as a storage back-end for
    the virtual machines and one small LUN that is going to be used to store the configuration
    files.


    +   Set up the base cluster, including the configuration of STONITH as described
    earlier in this book.


    +   Configure OCFS2 and create an order constraint to make sure that STONITH is
    loaded before OCFS2. In this chapter you can read how to perform this procedure.


    +   Configure the virtual machines. Instead of configuring LVM volumes as the
    storage back-end you would use the OCFS2 LUN as the storage back-end for the virtual
    disk files used by the virtual machines.


    # 6.2 Setting up OCFS2


    To apply the procedure described in this chapter, I''ll assume that you''ve installed
    the OCFS2 packages. You can install them using YaST, from the SLES HA repository
    as described earlier in this book. After installing the software, make sure to
    apply the following steps:


    +   Create a clone resource for DLM. The procedure how to do this, is described
    in chapter 5.


    +   From the Linux HA Management Client, select Configuration > Resources > Add.'
