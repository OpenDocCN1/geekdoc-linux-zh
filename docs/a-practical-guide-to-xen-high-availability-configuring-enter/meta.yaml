    ## 8.3 更改资源管理状态


    在某些情况下（例如更新集群软件），您可能需要完全关闭软件。但这可能会导致问题，因为由集群管理的资源也会随之关闭，而这并不是您创建高可用解决方案的初衷。为了防止这种情况，您可以更改集群资源的状态。默认情况下，资源处于管理状态（managed
    state），这意味着集群负责该资源，在集群未运行时它无法运行。如果您将其处于非管理状态（unmanaged state），资源将独立运行。


    要将资源置于非管理状态（以及恢复到管理状态），您可以对单个资源进行操作，也可以为整个集群设置状态。要设置整个集群，请执行以下步骤：


    - 1. 在 Linux HA 管理客户端中，选择配置（Configuration） > CRM 配置（CRM Config）。这显示集群的当前属性。

    - 2. 点击维护模式（Maintenance Mode）旁边的复选框并点击应用（Apply）以保存更改。


    3. 现在查看 hb_gui 的管理部分，这将显示集群中的所有资源现在都处于非管理模式。


    ![](img/b40539f0f23a32fb6110fc27a5bf954e_109_0.png)


    在将集群设置为维护模式后，所有资源都达到非管理状态。


    4. 当您对集群进行维护时，返回 CRM 配置并移除维护模式的复选框。这将允许集群接管资源。像许多选项一样，对于整个集群，这些操作可以在右键点击资源后出现的菜单中。选择取消管理资源（Unmanage
    Resource）将资源置于非管理模式。选择管理资源（Manage Resource）将其恢复到管理模式，一旦您完成了工作。


    ## 8.4 验证并同步集群


    在某些情况下，您可能会发现集群没有以您期望的方式工作。这可能是由于两个原因。首先，您可能会发现集群的更改同步到其他节点的速度不够快。另一个问题可能是由于集群配置中存在错误而导致的，即使您使用了
    Linux HA 管理客户端！对于这两种情况，可以使用 `cibadmin -S` 命令强制节点之间的集群库（CIB）进行同步。这将确保它们是最新的。


    # 附录：创建开源 SAN


    为了设置高可用解决方案，您需要一个 SAN。在大多数情况下，这将基于光纤或 iSCSI 的私有 SAN 解决方案。由于这涉及到昂贵的光纤基础设施，这种解决方案对于负担得起的
    SAN 并不是最佳选择。如果您的环境是这种情况，您可以考虑开源 SAN。这是一个完全基于开源软件的 iSCSI 解决方案。


    注意：在本书的最后评审期间，我不得不包含有关创建自己的 SAN 的信息。由于截止日期，本文针对 SUSE Linux Server 10 sp2 编写，但也适用于
    SLES 11。根据您在本书几章中获得的关于 Pacemaker 的知识，创建自己的 SLES 11 开源 SAN 将不会有困难。


    ## 9.1 基于 DRBD、Heartbeat 和 iSCSI 的自定义 SAN


    并不是都有钱购买 SAN 设备。很少有公司能承受 SAN 并在服务器存储故障时丢失关键数据。您不需要私有 SAN 设备，但可以使用开源软件构建自己的 SAN。本文将讨论如何实现这一点。在开始构建
    SAN 解决方案之前，您应该确定确切需要什么。通常，SAN 由不同的组件组成，其中高可用是核心。如果您的 SAN 由一个盒子组成，您就是在玩火，如果这个盒子故障，您的数据将无法使用并导致您损失金。因此，在现实生活中，需要两个盒子来构建
    SAN，构建开源 SAN 也不例外。这就是分布式复制块设备（DRBD）派上用场。使用此解决方案，您可以在跨网络构建自己的 RAID，这意味着如果提供存储的服务器之一发生故障，另一台服务器将接管该角色。


    '
