    | [0:0:0] | disk | VMware | Virtual Virtual 1.0 | 0 | /dev/sda |

    | [2:0:0] | disk | NECVMWVar | IDE CDR 100 | 0 | /dev/sr0 |

    | [3:0:0] | disk | IET | VIRTUAL-DISK | 0 | /dev/sdb |

    | [3:0:1] | disk | IET | VIRTUAL-DISK | 0 | /dev/sdc |

    | [4:0:0] | disk | IET | VIRTUAL-DISK | 0 | /dev/sdd |

    | [4:0:1] | disk | IET | VIRTUAL-DISK | 0 | /dev/sde |


    ## 18 配置主机


    ### 2.2.2 配置多路径 (Multipath)


    配置网卡连接到 SAN 后，您会注意到在 SAN 上创建的所有 LUN 都出现了两次。如果您通过两个控制器访问 SAN，您将看到 LUN 列出了四次！对于服务器建立的每个连接，您都会主机上获得相应的磁盘设备。因此，您的
    SAN LUN0 可能被称为 /dev/sdb、/dev/sdc、/dev/sdd 以及 /dev/sde。您不能使用这些设备，因为它们太具体了。每个驱动器都依赖于特定的连接，如果该连接失败，您将丢失相应的驱动器。因此，您需要一个更通用且不依赖于特定连接的解决方案。该解决方案是通过使用多路径（multipath）提供的。


    在配置多路径之前，决定使用哪种多路径很重要。在大多数环境中，您可以使用开源的 Linux 多路径驱动，也可以使用您的 SAN 厂商提供的多路径驱动。（注：提供的
    OCR 文本不完整/重复，我已处理可用段落）。

