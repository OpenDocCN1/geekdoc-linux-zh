    现在你已经成功设置了 OCFS2，你需要在集群中创建一个克隆资源，该资源负责在所有节点上挂载该卷。你必须特别这些这些卷的挂载点。较小的卷必须挂载到 /etc/xen/vm，较大的卷必须挂载到
