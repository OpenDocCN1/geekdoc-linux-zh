- img_proc: true
  md: 'resource will not do anything at all, as the cluster will be happy anyway,
    as a STONITH resource is available. Notice that the Null Stonith device does not
    offer any protection, it will just lie to the cluster and pretends as if the STONITH
    operations have been executed properly. From that perspective, you might even
    consider it a worse than the SSH-STONITH solution. But, if it''s the only way
    that can be used to achieve a working STONITH configuration, it''s better than
    nothing.


    To help you in setting up this resource, we will use a different approach. Up
    to now, you have configured resources from the graphical user interface. As an
    alternative, you can also create an input file and import that configuration in
    the cluster using the crm command. To use this method, first create a configuration
    file with the name nullstonithfile.txt and the content that you see in the listing
    below:


    Listing: Input file to create a null-stonith resource.


    ```

    primitive stonith-node1 stonith:null \\

    params hostlist="*node1 \

    primitive stonith-node2 stonith:null \\

    params hostlist="*node2 \

    location 1-stonith-node1 stonith-node1 -inf: node1

    location 1-stonith-node2 stonith-node2 -inf: node2

    commit

    ```


    Notice some variables in this example script that might need to be changed in
    your particular configuration. First, there is the name of the hosts, which in
    this example is set to node1 and node2. Change that to match your host names,
    and add lines if you have more than two nodes. Next, we''ve used the names stonith-node1
    and stonith-node2 for the STONITH resources themselves, and l-stonith-node1 and
    l-stonith-node2 for the location constraints. Make sure that they are changed
    to match your environment. Next, you can import the configuration using the following
    command:


    ```

    crm < nullstonithfile.txt

    ```'
