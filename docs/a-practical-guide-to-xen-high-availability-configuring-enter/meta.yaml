  md: '# Setting up STONITH to ensure resource integrity


    Before you set up cluster resources in the cluster with access to shared storage,
    there is an important precautionary measure you have to take to prevent the cluster
    from getting corrupted. The name of the mechanism is STONITH and it stands for
    Shoot The Other Node In The Head.


    In a HA cluster, it is of great importance to be sure that a node is down before
    taking over resources from that node. This decreases the risk of file system corruption
    to a minimum. When two nodes try to write to the same file system at the same
    time, you can be sure that your file system will get corrupted and bad things
    will happen. To prevent these kinds of situations, you need STONITH.


    The idea behind STONITH is self explanatory. Before a resource or service is migrated
    from a node that is supposed to have a problem, STONITH makes sure this node is
    really down. To do this, STONITH will simply shut down. Typically, this is a hardware
    mechanism. Therefore to set up STONITH properly, you''ll need a hardware device,
    such as a Power Distribution Unit (PDU) which has manageable ports that allow
    you to shut down the power on one of the ports. Alternatively, you could use a
    management card in your server, such as Dell DRAC, or HP ILO. To talk to this
    hardware, the cluster uses a STONITH resource agent that sends a command to the
    STONITH device to shut it down.


    When configuring STONITH, the most important item to consider, is the device you
    use. Numerous devices are available, but not all are supported. In this book,
    we''ll explore five options:


    +   - The APC PDU device. This is a power distribution unit that you can manage
    over the network. It provides the option to shut down a port remotely.

    - The DellAC management board. This is a management board that you have to install
    in your Dell server. Once installed, it allows you to send a shutdown command
    to the server.

    - The SSH Stonith resource. This is a test resource that helps you in understanding
    how to use STONITH, but which should never be used in a production environment.

    - The Meatware STONITH device. If you''re in a production environment and you
    don''t have the appropriate hardware, use the Meatware device. It won''t do anything,
    but it will prevent file system corruption to occur on your cluster.

    - The Null device. If everything else fails, the null Null device is a good choice.
    It doesn''t do anything at all, but it keeps the cluster happy. Some resources
    need STONITH to be available and that all the the Null device is doing.'
  merge: -1
  pgno: 44
- img_proc: true
  md: 'A Practical Guide to XEN High Availability


    # 4.1 STONITH or cLVM?


    In the old days of Heartbeat clustering, there was only one method of preventing
    file system corruption that was STONITH. In the modern days of Pacemaker, another
    approach has been made available: cLVM. In cLVM, you can mark a logical volume
    as private, which means it is accessible by one server at a time. If one server
    has it mounted, others cannot even see it. That''s also a way to prevent file
    system corruption.


    If you have cLVM, you cannot do without STONITH. Some parts of the cluster do
    need STONITH software to be installed on your server, so you probably need both
    of them. The good news is that if you have a proper configuring STONITH (which
    is possible, because of different hardware versions there are some problems with
    STONITH), you can get away with a dummy STONITH device, and if only you use cLVM
    for file system protection. It''s always better to have real STONITH though.


    In this book you can read about two different approaches to set up the shared
    storage. One of them uses cLVM. In case you decide to set up that solution, you
    won''t really need STONITH. However if you decide to go for the solution where
    shared storage is offered from the OCFS2 file system (Chapter 6), you will need
    to set up STONITH anyway.


    # 4.2 Setting up STONITH on the APC Master


    My personal favorite STONITH device, is the APC Master, sold as the switched rack
    Power Distribution Unit. When you use this device on your network, you connect
    the plugs of all the servers to the APC Master device. The benefit of using this
    device, is that you can remotely power-cycle any port on the device. APC gives
    you a web interface or telnet to do this, with Pacemaker can use a STONITH resource
    to accomplish the same.


    Before using the APC Master in your cluster, you need to set it up. You can use
    the old-method, using a serial cable and Hyperterminal on Windows, or you can
    use the following extremely cool procedure to give the device an IP address. Before
    you start, make sure that the APC is connected to your LAN, and that you have
    some servers connected to the power outlets of the APC.


    +   1. Write down the MAC address of the device. You can find this address on
    a sticker on the device.


    +   2. Use ARP to define a MAC address for the device on your local computer.
    On Linux, you would do that using the following command:


    ```

    arp -s 192.168.1.245 00:c0:b7:4b:c9:d9

    ```'
  merge: -1
  pgno: 45
