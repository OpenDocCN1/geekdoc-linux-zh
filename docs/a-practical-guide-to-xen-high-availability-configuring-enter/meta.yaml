    ## 1.3 Xen 的技术优势


    到为止，我们讨论了 Xen 的技术优势。这些优势主要体现在 Xen 引入了一种革命性的虚拟化新方法，被称为半虚拟化（parvirtualization）。在半虚拟化中，虚拟机使用软件接口。该软件接口用于直接与底层硬件通信。通过使用这种接口，可以避免仿真（emulation）。应该避免仿真，因为虚拟机产生的所有硬件指令都必须被捕获并翻译。这个过程在性能上付出了非常高的代价。简而言之：半虚拟化让你的虚拟化解决方案运行快得多。目前，Xen
    是虚拟化领域唯一一个完全实现半虚拟化的玩家。其他解决方案仍在尝试达到这一点。


