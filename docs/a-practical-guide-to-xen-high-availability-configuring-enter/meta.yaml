    # A Practical Guide to XEN High Availability


    shut down a host, the virtual machines on that automatically migrate to another
    host in the cluster before the shutdown actually takes place. use live migration,
    you''ll need to take some precautionary measures on the host machines. You''ll
    have to change a setting in the /etc/xend/xend-config.xsp file, which you will
    find on every Xen host. The following procedure described what to do:


    - 1. With an editor, open the file /etc/xend/xend-config.xsp and find the following
    lines:


    ```

    #(xend-relocation-server no)

    #(xend-relocation-port 8002)

    (xend-relocation-hosts-allow ^localhost -localhost\.localdomain$)

    ```


    - 2. Change these lines to look as this in the following example:


    ```

    (xend-relocation-server yes)

    (xend-relocation-port 8002)

    (xend-relocation-hosts-allow '' ) )

    ```


    You should be aware that the xend-relocation-hosts-allow line from the example
    above will allow all hosts in the network to migrate virtual machines to this
    host. If you don''t want that, you should apply some additional filtering using
    regular expressions. In the xend-config.xsp file you''ll find some examples of
    regular expressions that you can use. Also make sure that the above lines occur
    only once in the configuration file, to avoid conflicts on your configuration.


    - 3. Repeat the procedure described above on all host servers where you want to
    be able to perform live migration


    - 4. To test if this procedure really works, you can now try it out, using the
    xm migrate --live command. For instance, to migrate the virtual machine vml to
    the host node2, you would use the following command:

    xm migrate --live vml node2


    ## 7.2 Creating Cluster Resources for the Virtual Machines


    As the final step, you now need to configure the cluster to manage the virtual
    machine. This means that you have to create a resource for the virtual machine,
    and after that a collocation constraint ensures that the virtual machine and the
    logical volume always stay together. From that the collocation with the DLM and
    cVM resources, in turn are required to start the logical volume successfully.
    Apart from these collocation constraints, you''ll need some order constraints
    as well. After, all you want to start the virtual machines after the logical volumes
    have been initialized successfully!


    Before you, make sure that you''ve stopped the virtual machines that you''ve just
    created. After creating the resource in the cluster, the cluster is going to start
    the virtual machine that''s not going to work if the virtual machine has already
    been somewhere else. Even worse: you may even risk severe file system damage if
    you try it anyway!


    - 1. Now make a primitive resource, with the id of your choice (vmserver1, or
    anything you like), make sure to select the class ''ocf'', provider ''heartbeat''
    and type ''Xen''. (Please note that resources are not listed in alphabetical order,
    you will first see all the resources of which the name starts with an uppercase
    and following that the resources of which the name starts with a lowercase. Make
    sure the initial status of the resource is set to started and next click Forward
    to proceed.


    ![img/b40539f0f23a32fb6110fc27a5bf954e_102_0.png](Creating a resource for the
    Xen virtual machine)


    - 2. In the Instance Attributes window, you''ll see an attribute that has the
    name xmfile. This attribute needs the exact name and location of the configuration
    file that is used to start the virtual machine. For instance, it could be /etc/xen/vm1,
    depending on the configuration that you are using. If you want to use live migration
    as well, this option ensures that if a node in the cluster goes down, the cluster
    performs a live migration on the virtual machines that were running on that. Using
    this option means that it will take a little longer before a node is really done
    (after all, you first need to live-migrate all virtual machines off of it), but
    this option also offers the advantage that users will experience no downtime at
    all. Another parameter that you may like, is allow mem management. As its name
    suggests, using this parameter makes it possible to adjust memory dynamically
    at a later instance, which is useful if you find out the remaining host in your
    cluster doesn''t have enough memory to host all of the virtual machines. For now
    however, the Pacemaker software offers limited abilities to manage this parameter
    from the cluster.


    ![img/b40539f0f23a32fb6110fc27a5bf954e_103_0.png](Setting up the Xen Environment
    103)


    From the cluster, you can perform a limited amount of management tasks on the
    virtual machines.


    - Before doing anything else, you should make sure that the virtual machine is
    running nowhere in the cluster. If it is running, you will have serious problems
    while performing the next step. Use xm list on all hosts to verify that the virtual
    machine you have been working on, is not active anywhere. If it is, use xm destroy
    <vm-name> to “pull the power plug” out of the virtual machine.


    - At this point you can save your changes. While doing that, the cluster will
    automatically take care that the Xen virtual machine is started.


    As the last part of the configuration, you now have to create constraints. While
    creating the cluster, you ensured that the logical volume required by the virtual
    machine was available before starting the virtual machine. When the cluster tries
    to start the virtual machines automatically, you need to make sure that the volume
    is always loaded on the same host as the virtual machine, and that it is loaded
    before the actual virtual machine itself is started. So you need a collocation
    constraint, as well as an order constraint to take care of this. Once this has
    been done, you have your high availability cluster up and running.


    ## Managing The Cluster


    Now the cluster is up and running, the real work begins. The advantage of a well-designed
    cluster, is that it doesn''t involve that much work. The cluster basically runs
    itself and only in rare situations will it be required to perform specific management
    tasks. The purpose of this short chapter, is to make you familiar with the most
    important management tasks.


    ## 8.1 Cleaning Up Resources


    On some occasions, you''ll have to delete a resource and start it again. It may
    even happen that you have to delete a resource that is behaving the way you expected
    it to, and create it again as a new resource. In such situations, you may find
    that the resource doesn''t disappear properly from the cluster.


    The reason why resources sometimes keep roaming, is that the cluster maintains
    the actual status. If you''re interested, you can display this status using the
    cibadmin -Q command. This command will dump a xml configuration, containing the
    current status. This status comes from the cib.xml, which is the actual status.
    In some cases however, the actual status doesn''t get synchronized.


    To clean up a resource, just right-click the resource you want to update the status
    of, and select Cleanup Resource from the menu. This will immediately start synchronization
    of the resource and may resolve the issues that you are having with it.


    ![img/b40539f0f23a32fb6110fc27a5bf954e_105_0.png](A Practical Guide to XEN High
    Availability)


    If resource problems are due to outdated status information in the CIB, you might
    resolve them by cleaning up the resource. After selecting the Cleanup Resource,
    the graphical application will prompt you on which node you want to clean it up.
    If you know for sure that the problems are related to one particular node not
    being updated properly, from the drop-down list, select that menu. Otherwise,
    just select All nodes to update status information on all nodes in the cluster.


    ## 8.2 Migrating Resources


    Another common maintenance task, the migration of resources. If a failure occurs
    on the cluster, resources will migrate away from the failing node automatically.
    The cluster atomically load balances migrated resources, which means that they
    are spread across the nodes, trying to avoid one node in the cluster from being
    overloaded by migrated resources. The default behavior, is when the node that
    the resource originally was loaded on, comes back in the cluster, the resource
    will fail back to the original node. If you don''t like this, you can change the
    default resource stickiness. You can find this parameter on the properties of
    the CRM, the Cluster Resource Manager, which is the core component of the cluster.

