    ## 9.5 Configuring iSCSI


    There are in general two types of SAN; iSCSI based SANs and Fibre Channel based
    expensive hardware and therefore is not an option for the open source. In this
    configuration, we will be using iSCSI. In a typical iSCSI configuration, the iSCSI
    target is the service that is provided by the SAN. In this case, the shared device
    will be the drbd0 device that you have created earlier and is made highly available
    in the preceding step of this procedure. Configuring iSCSI is not a very difficult
    two step procedure. First, you''ll use YaST to set up the iSCSI service and after
    that, you''ll make the iSCSI target service highly available.


    - 1. From the servers in your cluster, start YaST by entering the yast2 command
    (if you prefer clicking, you could also select from the start menu of the server
    of course, first, servers are normally in cold data centers and system administrators
    prefer nice and warm, and second, a typical Linux doesn''t run a GUI, does it?
    So you SSH session, and from there, enter the yast2 command, okay?)


    Appendix: Creating an Open Source SAN


    - 2. Select Miscellaneous > iSCSI Target. This may give a prompt that some software
    must be installed first. If needed, do it. Once done, you''ll see an interface
    in the following figure.


    ![](img/b40539f0f23a32fb6110fc27a5bf954e_125_0.png)


    The YaST iSCSI Target Overview window offers an easy interface to configure iSCSI.


    - 3. On the Service tab, make sure that the option Manually is selected. This
    is because the cluster is going to manage the iSCSI target startup, therefore
    you must make sure that it will not be started automatically. Next, select the
    targets tab. On this tab, you''ll see an example iSCSI target. It is not functional,
    so select it and click Delete to remove it.


    ### iSCSI Target


    iSCSI Target Overview


    List of offered targets: Create a new target by clicking Add. To delete or modify
    an item, select it and press Modify or Delete.


    ![](img/b40539f0f23a32fb6110fc27a5bf954e_126_0.png)


    Service Global Targets


    From the Targets tab, remove the example iSCSI target.


    - 4. Now click Add to add a new iSCSI target. The target name is selected automatically,
    which is fine. For the identifier a unique ID that is generated automatically
    is used. Provide a more readable ID here; you can pick any name you like. Next,
    click the Add button. The LUN number you have to enter here, must be a unique
    ID for the target. Next, make sure that the option Type=fileio is selected and
    browse to the DRBD device /dev/drbd0 to configure that as the iSCSI target storage
    device. No other information is required here, so click OK to close this window
    in then click Next to proceed.


    ## A Practical Guide to XEN High Availability


    ![](img/b40539f0f23a32fb6110fc27a5bf954e_127_0.png)


    Configure the iSCSI target to share the DRBD device.


    - 5. In the authentication settings window, no settings need to be changed. Click
    Next to proceed and when back in the Overview window click Finish to write the
    configuration to your server.


    - 6. After creating the iSCSI target configuration on the first server, you need
    to make sure that the second server has the same configuration. You can ensure
    this by copying the /etc/ietd.conf file to the other server. So assuming san2
    is the other server, use the following to copy the configuration file from a san1
    console:


    ```

    scp /etc/ietd.conf root@san2:/etc/ietd.conf

    ```


