    specify which resource type you want to create. From this menu, select the Primitive
    option to create a normal resource.

    2. From the Primitive window, you will now have to specify how to configure the
    resource. To start with, you should give it a name. As always, it''s a good idea
    to use a name that helps you recognizing later for what purpose you have created
    the resource. In this example, STONITH-node2 would be a nice name. At the Class
    option, select STONITH and for Type, make sure that you have selected Meatware.
    Finally, under the options make sure that the Initials State of Resource is set
    to Started. Then click Forward to proceed to the next step where you can enter
    additional parameters.

    3. You''ll now see a window that consists of three different tabs. By default,
    the Instance Attributes tab is opened. On this tab, you can select the default
    attribute hostlist. Select this attribute, next click Edit and enter the name
    of the host that this STONITH resource has to manage. Next, click Apply to save
    this resource in the cluster.

    4. Now you need to create a location constraint, which makes sure that the resource
    is allowed to shut down anywhere, but not on the node that we''ve created a resource
    to STONITH node1, the location constraint has to make sure the resource is never
    loaded on node1. To do this, you''ll give the constraint value -INFINITY. This
    is exactly the same procedure as has been described at the configuration of the
    SSH STONITH agent.

    5. After saving the configuration, you''ll have the meatware STONITH agents operational.
    You can now test if they really work the way you want them to. The easiest way
    to do that, is by killing the aixsec process passing by one of the nodes. You
    should see a STONITH message passing by the other node, telling you that you manually
    confirm that the failing node is no longer available in the cluster. After doing
    that, by using the meatclient -c command, the cluster will know that everything
    is right, and it will fail over resources.


    # 4.3.3 If Everything Else Fails: Nullstonith


    You will find out soon enough, STONITH may be hard to configure. The problem however
    is that some configurations, including the configuration that is discussed in
    this book, need STONITH to be configured anyway. To help you with that, for situations
    where everything else fails, you can use the Nullstonith resource.'
