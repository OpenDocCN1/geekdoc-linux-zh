- md: '

    ## Setting up cLVM Shared Storage


    At this point, the preliminary work has been done and you can start configuring
    the resources that you need for the Xen high availability environment. The first
    part of the configuration, takes care of the storage for your environment. A virtual
    machine needs a hard disk and this virtual hard disk has to be represented by
    something on the host computers. There are two approaches for this configuration.


    Formerly, it was common to configure a cluster file system to take care of the
    storage back-end for virtual machines. OCFS2 (which is included in the SLES11
    HAE) was used to provide one huge file system on which the storage back-end for
    virtual machine was taken of by creating files to represent the virtual disk.
    There are however few disadvantages to this approach:


    - OCFS2 adds another layer of complexity to the configuration.

    - Using a file as the storage back-end for a virtual machine is not as fast as
    using direct device access.

    - Using one OCFS2 volume adds a single point of failure to your configuration.

    - In the past, OCFS2 was not stable enough, which in worst-case scenarios might
    mean the entire cluster went down because of an OCFS problem.


    Against all these disadvantages, there is also one advantages to using OCFS2:
    using files as the storage back-end is more flexible, as you can easily copy the
    disk file to another location. As we want to offer you information to set both
    solutions, in this chapter you can read how to set up a cLVM based storage, where
    the next chapter explains how to set shared storage using OCFS2.


    The alternative to using OCFS2, is the Cluster Logical Volume Manager (cLVM).
    In this configuration, you will create logical volumes that can be managed by
    the cluster. That means the cluster has access to a volume and makes sure it will
