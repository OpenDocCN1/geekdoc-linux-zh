    ## 设置 cLVM 共享存储


    此时，准备工作已经完成，你可以开始为 Xen 高可用环境配置所需的资源了。配置的第一部分负责你环境的存储设置。虚拟机需要一个硬硬盘，而这个虚拟硬盘必须由宿主机上的某种东西来表示。对于这种配置，有两种方法。


    以前，通常的做法是配置集群文件系统来处理虚拟机的存储后端。OCFS2（包含在 SLES11 HAE 中）用于提供一个巨大的文件系统，通过创建代表虚拟磁盘的文件，在该文件系统中提供虚拟机的存储后端。然而，这种方法也有许多缺点：


    -   OCFS2 为配置增加了另一层复杂性。

    -   使用文件作为虚拟机的存储后端，速度不如直接访问设备快。

    -   使用单个 OCFS2 卷会为你的配置引入单点故障。

    -   在过去，OCFS2 的稳定性不够，在最坏的情况下，可能因为 OCFS2 的问题导致整个集群宕机。


    尽管有这些缺点，使用 OCFS2 也有一个优势：使用文件作为存储后端更加灵活，你可以轻松地将磁盘文件复制到另一个位置。由于我们希望为你提供这两种解决方案的设置信息，在本章中你可以读到如何设置基于
    cLVM 的存储，而下一章将解释如何使用 OCFS2 设置共享存储。


    使用 OCFS2 的替代方案是集群逻辑卷管理器 (cLVM)。在这种配置中，你将创建可以由集群管理的逻辑卷。这意味着集群可以访问该卷，并确保不会发生两个节点同时访问同一个卷的情况。此外，如果
    STONITH 未能正常工作，这极大地降低了发生严重文件系统问题的风险！cLVM 是 SLES11 HAE 的一部分，因此你可以顺利地使用它。


    在下述的步骤中，你将学习如何创建 cLVM 卷。该步骤由两部分组成：你需要在集群中创建一些支持集群逻辑卷的资源。如果不配置这些资源，在访问卷时可能会遇到锁定问题。完成这些之后，你还需要创建并配置
    LVM 卷本身。


    为了让集群准备好处理 cLVM 卷，你需要配置两个组件。首先，你需要为分布式锁管理器 (DLM)创建一个资源。该组件确保了如果一个节点访问某个卷，所有其他节点都会知情。接下来，你需要为
    cLVM 创建一个支持资源。这与特定的逻辑卷无关，它只是一个确保在你开始处理 cLVM 本身之前，集群已加载所有支持模块的资源。由于这些资源负责加载 cLCM
    的前提条件，你可以将它们创建为克隆资源（clone resources），以便加载到所有节点上。接下来的步骤描述了如何操作。


    -   1. 在创建资源本身之前，你需要告诉宿主机上的 LVM 栈集群将负责处理锁定。要做到这一点，你需要更改 /etc/lvm/lvm.conf 文件中的一个设置。在该文件中，默认情况下你会找到
    `locking_type = 1` 选项，你应该将其改为 `locking_type = 3`。


    -   2. 在更改集群中所有节点上的 lvm.conf 后，你可以启动 hb_gui 界面。在界面中选择 Configuration（配置）> Resources（资源）并点击
    Add（添加）。这将打开一个允许你同时添加新节点的界面，你需要选择 Clone 资源类型。为资源命名为 dlm-clone，并确保资源的初始状态设置为 Started（已）。然后点击
    Forward（向前）进入下一步。


    ## 添加克隆 - 基本设置


    必填


    | ID | 选项 |

    | :--- | :--- |

    | dlm-clone | 初始状态：Started |


    -   副本数量（默认值为集群中的节点数）：2

    -   单个节点上的副本数量（默认值为 1）：1

    -   在停止或启动副本之前通知其他副本并在操作成功后通知（默认值为 false）

