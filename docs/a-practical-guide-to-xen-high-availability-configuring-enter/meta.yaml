  md: "# A Practical Guide to XEN High Availability\n\nAs mentioned, you'll probably\
    \ have a problem setting up LVM multipath is operational. It might work though.\
    \ Before you start the procedure described below, it's a good idea to try the\
    \ quick solution. In this solution, you are going to tell the LVM configuration\
    \ file lvm.conf that device mapper devices can be used as well. Do this by including\
    \ the following in the lvm.conf on all the servers:\n\n```\ntypes = { \"device-mapper\"\
    , 16 }\n```\n\nNext, verify if multipath is active in the runlevel and reboot\
    \ your server. After rebooting, use the pvs command to verify that the physical\
    \ volumes have created successfully. Now continue with step 5 of the procedure\
    \ that is described below. If you've had an error creating this configuration,\
    \ you can try the solution that is described in the procedure below:\n\n+   1.\
    \ Enter the multipath -l command. This command shows you multipath devices are\
    \ there and which local devices are connected to them. In the listing below, there\
    \ are two multipath devices, /dev/dm-0 and /dev/dm-1. Local disks /dev/sdb/dev/sdd\
    \ are connected to the dm-0, local disks sdc and sdc are connected to the dm-1.\n\
    \nListing: Before you start, you should have a look at the current multipath configuration:\n\
    \n```\nnode2:- # multipath -1\n149455400000000000001000009c0500000f00000 dm-1\
    \ IET, VIRTUAL-DISK\nsize=[10.0] [features]=0][whandander=0][rw]\n  round-robin\
    \ 0 [pri=0][active]\n    4:0:0 sdc 8:32 [active][undef]\n  round-robin 0 [pri=-1][enabled]\n\
    \    4:0:0 sdb 8:64 [active][undef]\n14945540000000000000010000005c0500000f00000\
    \ dm-0 IET, VIRTUAL-DISK\nsize=[10.0] [features]=0][whandander=0][rw]\n  round-robin\
    \ 0 [pri=-1][active]\n    3:0:0 sdd 8:16 [active][undef]\n  round-robin 0 [pri=-1][enabled]\n\
    \    4:0:0 sdd 8:48 [active][undef]\n```\n\n+   2. Now you need to stop multipath.\
    \ On some configurations, this will work perfectly when editing the /etc/init.d/multipath\
    \ stop. If it doesn't, use inserver -r multipath, followed by pkkill -9 aixec\
    \ and reboot your servers.\n\n+   3. Once the servers are up again, as root open\
    \ a console on one of the servers. From here, you need to issue the pvcreate command\
    \ to make the SAN drives for use in multipath. So following the example from the\
