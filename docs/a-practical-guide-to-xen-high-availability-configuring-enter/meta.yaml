  md: "# A Practical Guide to XEN High Availability\n\nshut down a host, the virtual\
    \ machines on that automatically migrate to another host in the cluster before\
    \ the shutdown actually takes place.\n use live migration, you'll need to take\
    \ some precautionary measures on the host machines. You'll have to change a setting\
    \ in the /etc/xend/xend-config.xsp file, which you will find on every Xen host.\
    \ The following procedure described what to do:\n\n+   1. With an editor, open\
    \ the file /etc/xend/xend-config.xsp and find the following lines:\n\n```\n#(xend-relocation-server\
    \ no)\n#(xend-relocation-port 8002)\n(xend-relocation-hosts-allow ^localhost -localhost\\\
    .localdomain$)\n```\n\n+   2. Change these lines to look as this in the following\
    \ example:\n\n```\n(xend-relocation-server yes)\n(xend-relocation-port 8002)\n\
    (xend-relocation-hosts-allow ' )\n```\n\nYou should be aware that the xend-relocation-hosts-allow\
    \ line from the example above will allow all hosts in the network to migrate virtual\
    \ machines to this host. If you don't want that, you should apply some additional\
    \ filtering using regular expressions. In the xend-config.xsp file you'll find\
    \ some examples of regular expressions that you can use. Also make sure that the\
    \ above lines occur only once in the configuration file, to avoid conflicts on\
    \ your configuration.\n\n+   3. Repeat the procedure described above on all host\
    \ servers where you want to be able to perform live migration\n\n+   4. To test\
    \ if this procedure really works, you can now try it out, using the xm migrate\
    \ --live command. For instance, to migrate the virtual machine vml to the host\
    \ node2,you would use the following command:\nm migrate --live vml node2\n\n#\
    \ 7.2 Creating Cluster Resources for the Virtual Machines\n\nAs the final step,\
    \ you now need to configure the cluster to manage the virtual machine. This means\
