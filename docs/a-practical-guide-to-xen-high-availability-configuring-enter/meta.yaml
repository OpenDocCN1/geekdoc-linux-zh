- img_proc: true
  md: '# 9.4.1 Configuring the DRBD resource in Heartbeat


    You have configured your server to start the DRBD service when booting. Normally
    in a Heartbeat cluster, that''s no good, but in this particular scenario, it is.
    All you need to do in Heartbeat, configure the drbdisk resource. The current status
    is that there are two resources available for DRBD. The old drbdisk resource does
    work, the Heartbeat version 2 style OCF agent doesn''t, so in this document I''ll
    describe how to use drbdisk. The prerequisite for using this, is that DRBD must
    be started from the runlevels of all servers involved. Next, from the hb_gui interface,
    create the resource as described below.


    +   1. From one of the nodes, start hb_gui and authenticate as user hacluster.


    +   2. Select Resources > Add New Item and select the Item type. Click OK next.


    +   3. The ultimate goal is to create a resource that manages DRBD as well as
    the iSCSI target service. To make this easier on, you''ll start working on the
    group from the beginning. In the Add Native Resource window you can see from the
    figure below, enter the resource ID drbd0 and at the option Belong to group type
    “iSCITargetGroup”. Don''t Click add.


    ![](img/b40539f0f23a32fb6110fc27a5bf954e_122_0.png)


    If the Add Native Resource window you specify exactly what the resource should
    do.


    Appendix: Creating an Open Source SAN Solution'
  merge: -1
  pgno: 122
- img_proc: true
  md: '# A Practical Guide to XEN High Availability


    4. Now from the drop-down list of DRBD types, select the resource type with the
    name drbddisk. Next click Add Parameter and enter the value drbd0. This value
    /should reflect the name that you have used when creating the DRBD device in the
    /etc/drbd.conf script. Next, click OK and Add to the resource to your cluster
    configuration.


    5. In the hb_gui interface, you''ll now see that the DRBD resource has been added,
    but it has the status of running. Right-click the resource and click Start to
    start it. You should now see that the resource is running on one of the two nodes
    and that is fine.


    ![](img/b40539f0f23a32fb6110fc27a5bf954e_123_0.png)


    The hb_gui now indicates that the DRBD resource has been started on one of the
    nodes in the cluster.


    The DRBD resource is now running on one of the cluster nodes. In the figure below,
    you can see it is currently being served by san1. Time for a stress test: when
    you pull the plug from san1, the DRBD resource should fail over automatically.
    Before doing this, use watch cat /proc/drbd to monitor the current status of the
    DRBD resource on node san2. You should see that it currently has the status


