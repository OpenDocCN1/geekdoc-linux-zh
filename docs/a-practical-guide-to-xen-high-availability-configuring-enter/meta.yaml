- md: '

    1. In the hb_gui, under the option Configuration, select Resources and click Add
    to add a new resource. You''ll see a menu where you need to specify what type
    of resource you want to create. From this menu, Primitive to create a “normal”
    resource.


    2. In the Add Primitive window, you now have to specify how the resource is to
    be configured. To start, give it a name, preferably one that makes it easy to
    recognize what the resource is doing in your network. For instance, STONITH-node2
    would be a nice name, as this resource is meant to shut down node2 in case of
    problems. At the class option, you select STONITH and next you specify the type
    External/SSH. Lastly, make sure that the Initial State of Resource is set to started
    and then click Forward to proceed and enter additional parameters.


    | Add Primitive - Basic Settings | Required |

    | :--- | :--- |

    | ID: | Stonith-node2 |

    | Class: | stonith |

    | Provider: | |

    | Type: | external/ssh |

    | Description | |

    | ssh-based Linux host reset | |

    | Fine for testing, but not suitable for production! | |

    | Options | |

    | Initial state of resource: Started | |

    | Add monitor operation |


    Creating the STONITH resource


    3. You now see a window with three tabs. By default, the Instance Attributes tab
    is opened. On this tab, you see the hostlist attribute. Select this attribute,
    click Edit and enter the name of the host that is to be managed by this STONITH
    agent. Next click Apply to save the resource in the cluster.


    **Note: If at this point you get an error that the resource cannot be written
    to the cluster, you probably haven''t updated the software on your servers yet.
    Stop what you''re doing immediately and update your servers now, before you do
    anything else!**


    4. Now you need to make sure, that the STONITH agent you''ve just created can
    be started on all hosts, except the host that it is supposed to shut down in case
    of problems. So the resource that you''ve created to shut down node1, must never
    be started on node1. To take care of that, you need a location constraint. By
    configuring this placement rule with a score of -INFINITY (read: never) for node1,
    you''ll make sure that it will never be started on node1. With this constraint,
    from the hb_gui, select Configure > Constraints and add. From the pop-up window,
    select Resource location. As the ID, you have to provide a unique name for the
    resource. Next, from the drop-down list, you have to select the resource to which
    this constraint applies, which in this case is the SSHSTONITH resource for node1.
    Next, give this resource the score -INFINITY and assign it to node1. Now click
    OK to save the resource and apply it. Perform the same steps for the resource
    you''ve created to STONITH-node2.


    | Required | |

    | :--- | :--- |

    | ID: | STONITHNode1Constraint |

    | Resource: | STONITH-node1 |

    | Score: | -INFINITY |

    | Node: | node1 |

    | | Add | Edit | Remove |

    | | Cancel | Reset | QK |


    By using a location constraint, you can make sure that the specific resource will
    never be started on the node it has to STONITH.


    5. At this point, the SSH STONITH resources are created and available to the cluster.
    In the figure below you can see how it should look at this point. It''s recommended
    to restart all nodes in the cluster so that the resources are loaded properly.
    Once you have done this and the resources are loaded, you can proceed to the next
    step where you create resources for the shared storage.


    # A Practical Guide to XEN High Availability


    ![](img/b40539f0f23a32fb6110fc27a5bf954e_62_0.png)


    At this point the STONITH resources are ready for use


    ## 4.3.2 Configuring Meatware STONITH


    In the last paragraph you have read to set UP STONITH based on SSH. This STONITH
    method will work, but there are some disadvantages as well. Therefore, you might
    prefer an alternative to STONITH nodes in the cluster by using the Meatware device
    (yourself, as the system administrator). This STONITH agent does only one thing,
    it sends a message to the syslog to tell the administrator that he has to shut
    down a node. After doing that, the administrator has to confirm his action, by
    issuing the reactant -c command. Only at that point, the cluster will know that
    everything is in a controlled state and it will migrate the resource. That by
    using meatware, you don''t have high availability at all! But the advantage is
    that it will prevent resources from corrupting, as they will never be loaded twice.
    Also, you''ll never find yourself in a STONITH loop, as is the case when using
    SSH based STONITH.


    To use Meatware STONITH, you need a STONITH agent for each of the nodes in the
    cluster. The task of this agent is to shut down a specific node in case it fails.
    In other words, to shut down node 1, somewhere else in the cluster must be a resource
    that can shut it down. So just when configuring the SSH STONITH agent, you need
    a primitive resource that can run anywhere, but on the node that it has to shut
    down in case of problems.


    Setting up STONITH to ensure resource integrity


    # A Practical Guide to XEN High Availability


    The procedure below described how you can configure a Meatware STONITH resource
    on node1 to shut down node2 in case of problems. You''ll also learn how to make
    sure this resource will never be loaded on node2.


    1. In the Linux HA Management Client, under the Configuration option, select Resources
    and Click Add to a new resource. You''ll see a menu in which you can specify which
    resource type you want to create. From this menu, select the Primitive option
    to create a normal resource.


    2. From the Primitive window, you will now have to specify how to configure the
    resource. To start with, you should give it a name. As always, it''s a good idea
    to use a name that helps you recognizing later for what purpose you have created
    the resource. In this example, STONITH-node2 would be a nice name. At the Class
    option, select STONITH and for Type, make sure that you have selected Meatware.
    Finally, under the options make sure that the Init State of Resource is set to
    Started. Then click Forward to proceed to the next step where you can enter additional
    parameters.


    3. You''ll now see a window that consists of three different tabs. By default,
    the Instance Attributes tab is opened. On this tab, you see the hostlist attribute.
    Select this attribute, click Edit and enter the name of the host that is to be
    managed by this STONITH agent. Next click Apply to save the resource in the cluster.


    4. Now you need to create a location constraint, which makes sure that the resource
    is allowed anywhere, but not on node1. To do this, you''ll give the constraint
    value -INFINITY. This is exactly the same procedure as has been described for
    the SSH agent.


    5. After saving the configuration, you''ll have the meatware STONITH agents operational.
    You can now test if they really work by killing one of the nodes. After doing
    that, the cluster will know everything is right and it will fail over resources.


    ## 4.3.3 If Everything Else Fails: Nullstonith


    You will find out soon enough, STONITH may be hard to configure. The problem however
    is that some configurations, including the one discussed in this book, need STONITH
    to be configured anyway. For situations where everything else fails, you can use
    the Nullstonith resource. Note that the Stonith device does not offer any protection,
    it will just lie to the cluster and pretend as if STITH operations have been executed
    properly. From that perspective, you might even consider it worse than the SSH-STONITH
    solution. But, if it''s the only way that can be used to achieve a working STONITH
    configuration, it''s better than nothing.


    To help you in setting up this resource, we will use a different approach. Up
    to now, you have configured resources from the graphical user interface. As an
    alternative, you can also create an input file and import that configuration in
    the cluster using the crm command. To use this method, first create a configuration
    file with the name nullstonith.txt and the content that you see in the listing
    below:


    Listing: Input file to create a null-stonith resource.


    ```

    primitive stonith-node1 stonith:null \

    params hostlist="*node1 \

    primitive stonith-node2 stonith:null \

    params hostlist="*node2 \

    location 1-stonith-node1 stonith-node1 -inf: node1

    location 1-stonith-node2 stonith-node2 -inf: node2

    commit

    ```


    Next, you can import the configuration using the following command:


    ```bash

    crm < nullstonith.txt

    ```

