    ### Setting up the LVM


    Now that you have LVM and resources operational, you can proceed with the next
    step: configuring the virtual machines. This is a task that you should be able
    to do without too much the virt-manager, which is the default utility on SLES
    to manage virtual machines. There are some particularities for using this in a
    cluster environment. The following procedure shows what to do:


