    \ 4.1 STONITH or cLVM?\n\nIn the old days of Heartbeat clustering, there was only\
    \ one method of preventing file system corruption that was STONITH. In the modern\
    \ days of Pacemaker, another approach has been made available: cLVM. In cLVM,\
    \ you can mark a logical volume as private, which means it is accessible by one\
    \ server at a time. If one server has it mounted, others cannot even see it. That's\
    \ also a way to prevent file system corruption.\n\nIf you have cLVM, you cannot\
    \ do without STONITH. Some parts of the cluster do need STONITH software to be\
    \ installed on your server, so you probably need both of them. The good news is\
    \ that if you have a proper configuring STONITH (which is possible, because of\
    \ different hardware versions there are some problems with STONITH), you can get\
    \ away with a dummy STONITH device, and if only you use cLVM for file system protection.\
    \ It's always better to have real STONITH though.\n\nIn this book you can read\
    \ about two different approaches to set up the shared storage. One of them uses\
    \ cLVM. In case you decide to set up that solution, you won't really need STONITH.\
    \ However if you decide to go for the solution where shared storage is offered\
    \ from the OCFS2 file system (Chapter 6), you will need to set up STONITH anyway.\n\
    \n## 4.2 Setting up STONITH on the APC Master\n\nMy personal favorite STONITH\
    \ device, is the APC Master, sold as the switched rack Power Distribution Unit.\
    \ When you use this device on your network, you connect the plugs of all the servers\
    \ to the APC Master device. The benefit of using this device, is that you can\
    \ remotely power-cycle any port on the device. APC gives you a web interface or\
    \ telnet to do this, with Pacemaker can use a STONITH resource to accomplish the\
    \ same.\n\nBefore using the APC Master in your cluster, you need to set it up.\
    \ You can use the old-method, using a serial cable and Hyperterminal on Windows,\
    \ or you can use the following extremely cool procedure to give the device an\
    \ IP address. Before you start, make sure that the APC is connected to your LAN,\
    \ and that you have some servers connected to the power outlets of the APC.\n\n\
    - 1. Write down the MAC address of the device. You can find this address on a\
    \ sticker on the device.\n\n- 2. Use ARP to define a MAC address for the device\
    \ on your local computer. On Linux, you would do that using the following command:\n\
    \n```\narp -s 192.168.1.245 00:c0:b7:4b:c9:d9\n```\n\n- 3. Now use ping with a\
    \ package size of 113 bytes to set the IP address on the local device as well:\n\
    \n```\nping 192.168.1.245 -s 113\n```\n\nYou will see the device answering to\
    \ the ping package.\n\n- 4. Use telnet to the device. The default username is\
    \ apc, the default password is also apc. Make sure to change the password to prevent\
    \ others from having fun with your equipment.\n\n- 5. Next, choose Network from\
    \ the Console menu, select TCP/IP and next Manual boot mode. You need this to\
    \ tell the device that it's not booting through a DHCP server.\n\n- 6. Back in\
    \ the main Network menu, specify the System IP, Subnet Mask and Default Gateway\
    \ address.\n\n- 7. Use Ctrl-C to exit the Console menu, followed by option 4 to\
    \ log out. This will write the changes to the device and make them persistent.\n\
    \nAt this point, your APC device is ready for use in the cluster. You shouldn't\
    \ believe things you haven't seen yourself, so let's do a small test. The following\
    \ procedure describes how you can power cycle a port on the APC.\n\n- 1. Open\
    \ a telnet session to the APC and enter the user name and password that you've\
    \ provided for the device (default for both is apc). This gives you the main menu\
