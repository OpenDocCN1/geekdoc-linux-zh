  md: '# A Practical Guide to XEN High Availability


    > Note: While installing a Xen virtual machine, you will see that you have two
    mice instead of one. This is annoying, but there''s not much that you can do about
    it - it is a known problem to the VNC server that is used while doing the installation.
    Once the installation has been completed, there are other methods to work on your
    virtual machines, and you won''t have this problem no more.


    +   12. After installing the virtual machines, there is one last but very important
    step to perform. You need to copy the configuration of the virtual machine to
    all the other hosts in the network. You could do this by an automated solution
    for file sharing, such as NFS shares or an OCFS volume, which can be reached by
    multiple nodes simultaneously, but you''ll find out that is too much work for
    something that can be accomplished easily by hand. You''ll probably create new
    virtual machines occasionally so you might as well copy the configuration files
    to the other hosts manually. So at this point, make sure that you copy all the
    files in /etc/xen/vm to all hosts in the cluster and you''ll be ready to proceed
    to the next step.


    > Tip: For some vague reason, you might loose the VNC connection from the Virtual
    Machine Manager and get a message that VNC is not able to connect with the hypervisor.
    To solve this problem: just close the installation window that is failing to connect
    and get back to the Virtual Machine Manager. Next, select the virtual machine
    you were installing and Click Open to access to the console again.


    +   13. After manually copying the virtual machine configuration files, you need
    to make sure that all the virtual machines are known to the Xen management databases
    on the other hosts. To do this, you first need to perform a manual migration of
    the LVM volume resource for the virtual machine in the hb_gui to the host you
    need to install the virtual machine in the database. Next, you can use the command
    xm vmname to add the virtual machine to the Xen database on that host. After doing,
    you can use the xm console vmname command to log in that host. You will need to
    press Enter after doing this. This allows you to log in to the host. Shut down
    the virtual machine and repeat this procedure for all other hosts in the cluster.


    > Tip: If you want to install a 32-bit virtual SUSE server that has more than
    3 GB of RAM, you might see that the virtual machine refuses to start up after
    the installation. If this is the case, you''ll need to perform a new installation
    of the virtual machine, in which you have to select the Xen-PAE kernel. Also make
    sure that this kernel is loaded from the GRUB boot loader. This will fix the problem.


    # 7.1.1 Preparing for Live Migration


    Among the cool features of Xen, is Live Migration. This means that you can migrate
    one machine to another, without any down time. The user will notice nothing at
    all while you are live-migrating the machine! If you are using migration in a
    cluster environment, this also gives you the benefit that you'
