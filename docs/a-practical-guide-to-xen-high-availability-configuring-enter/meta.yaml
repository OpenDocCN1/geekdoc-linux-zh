    A Practical Guide to XEN High Availability


    # About the author


    Sander van Vugt is an independent technical trainer and consultant, specialising
    in Linux storage, virtualization, HA clustering and performance optimization.
    As such, he has been invited to do work all around the globe. Sander is also an
    author who has written over 40 books. He''s a regular contributor to different
    magazines and websites. You can reach Sander at this mail address mail@sandervvugt.nl,
    or his website www.sandervanvugt.nl.


    # About the reader


    This book is written for anyone who wants to create an affordable and stable solution
    for high availability of Xen virtual machines. To get the most out of this book,
    the reader should have a good working knowledge of Linux. The book uses SUSE Linux
    Enterprise as the example distribution. Although the configuration is applicable
    to other distributions as well, there are no guarantees on this.


    # Acknowledgements


    This book has been made possible with the aid of the following people:


    +   - Mike de Laat of IKW, the Xen HA Implementation at his site has inspired
    me to document what I''ve done, which was the initial start of this book.


