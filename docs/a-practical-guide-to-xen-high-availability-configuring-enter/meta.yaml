    KVM 等其他虚拟化解决方案进行比较。接下来，你将了解什么是真正的 Xen 高可用。


    注意：本书是关于创建 Xen 高可用解决方案的。然而，书中描述的解决方案也适用于其他环境。未来，KVM 可能会作为虚拟化解决方案变得越来越重要。使用书中描述的设置，你也可以为
