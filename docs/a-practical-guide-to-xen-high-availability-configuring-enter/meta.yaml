    \ {\n    vendor \"DELL\"\n    product \"MD30001\"\n    path_grouping_policy \"\
    group_by_prio\"\n    getuid_callout \"/lib/udev/scsi_id -g -u /dev/%n\"\n    prio_callout\
    \ \"/bin/multipath_prio_rdac /dev/%n\"\n    hardware_handler \"1 rdac\"\n    path_checker\
    \ rdac\n    prio rdac\n    path_selector \"round-robin 0\"\n    failback immediate\n\
    \    rr_weight priorities\n    no_path_retry queue\n    rr_min_io 100\n    product_blacklist_UN_Z\n\
    }\n```\n\n你在配置文件中进行的设置取决于你连接 SAN 的方式。如果默认设置不起作用，可能寻找适用于你特定设备的示例文件是一个好主意。在此此之后仍然无法正常工作，请查看\
    \ multipath.conf 主页获取有关特定参数的信息。特别考虑 path_checker 变量，该参数决定了为特定的 SAN 加载哪个内核模块，并不是每个模块适用于\
    \ SAN 环境。\n\n## 2.3 配置 LAN 接口\n\n现在是时候查看 LAN 了。为了创建 Xen 配置，你需要在操作系统上创建一个桥接设备，有几种方法可以实现。\n\
    \n桥接设备被用作虚拟交换机，每台虚拟机（包括主机操作系统）都与之连接。由于桥接设备是服务器配置的核心组成部分，建议在该设备上配置容错。实现此操作有两种方法：在主机上或在虚拟机上。在解决方案中，你需要一个\
    \ bond 设备，这是一种软件设备（称为 bond 设备），至少连接了两块网卡。你将连接至少两块网卡，但可能需要两块。这样做的优点是具有更好的冗余性。如果\
    \ bond 中配置的某个设备发生故障，另一个设备将接管。\n\n# XEN 高可用性实用指南\n\n从网络绑定（network bonding）的角度来看，你可以从两个方向入手。一种解决方案是加入接口中的网卡并让它们分担服务器的负载。然而，这种方法在某些配置下不起作用。第二种方法是以活动/被动模式配置\
    \ bond 设备。这种方法是支持的，并为你提供可能的冗余性。\n\n你也可以采取完全不同的方法，即 bond 设备不在主机操作系统上创建，而是在虚拟机内部创建。在某些网络环境中，这种方法似乎更好。如果你决定在虚拟机中配置\
    \ bond 设备，可以跳过后续关于在主机上配置 bond 设备的章节。而是直接跳到 2.5 节，在那里你将学习如何在安装虚拟机后配置网络桥接并配置绑定。\n\
    \n在下面的子节中，你将学习如何在主机操作系统或虚拟机上配置 bond 设备。\n\n当在主机环境操作时，你需要在主机上创建 bond 设备，并将连接 LAN\
    \ 的物理网卡连接到该设备。完成后，你需要将 bond 设备连接到虚拟桥接。在很大程度上，你可以通过 YaST 执行此过程，也可以直接编辑配置文件。不过，你必须配置某些元素。\n\
    \n作为第一步，你需要为想要在 bond 设备中使用的网卡创建配置。通过 YaST，这很容易实现：YaST 提供了一个配置网卡用于 bond 设备的选项。此步骤如步骤所示：\n\
    \n- 1. 启动 YaST，选择“网络设备”（Network Devices），然后选择“网络设置”（Network Settings）。然后选择你想要使用的第一个网卡，并点击“编辑”（Edit）修改其设置。查看下图获取操作的\
    \ YaST 界面。\n\n![](img/b40539f0f23a32fb6110fc27a5bf954e_21_0.png)\n\n通过 YaST，可以轻松配置网卡用于\
    \ bond 设备。\n\n配置主机\n\n- 2. 现在选择“无 IP 地址（Bond 设备）”（No IP Address）选项并点击“下一步”保存配置。你现在回到了主窗口，可以看到网卡配置被标记为\
    \ NONE（无）。\n\n- 3. 对所有想要包含 bond 设备中的网卡重复此过程。由于活动/被动响应是唯一被良好支持的方式，因此在每个 bond 设备中包含两块以上的网卡是没有意义的。\n\
    \n现在你需要检查网卡的配置文件。你可以在 /etc/sysconfig/network 目录下找到这些文件，可以通过它们的名称（看起来如 ifcfg-ethX）来识别它们。下面是配置用于\
    \ bond 设备后文件显示的内容。\n\n列表：eth 接口的示例配置文件\n\n```\nBOOTPROTO='none'\nBROADCAST=''\n\
    ETHTOOL_OPTIONS=''\nIPADDR=''\nMTU='\nNAME='8275GB Gigabit Network Connection'\n\
    MASK=''\nNETWORK=''\nREMOTE_IP=''\n```\n\n# XEN 高可用实用指南\n\n## 2.4 创建 bond 设备\n\
    \n如果你想在主机级别配置绑定，现在是时候执行它了。你可以在“网络设置 > 概览”窗口进行操作。要创建 bond 设备，你需要执行几个步骤。首先，你必须创建设备。接下来，你需要指定连接到设备的网卡。最后，你需要指定\
    \ bond 设备使用的协议。以下是该过程的详细说明。\n\n- 1. 启动 YaST，并选择“网络设备 > 网络设置”。然后点击“添加”（Add）创建一个新接口。\n\
    \n- 2. 在“设备类型”下拉列表中选择“Bond”类型。对于配置名称，可以接受默认值。这将创建一个名为 bond0 的设备。使用 ifconfig 或\
    \ ip 地址工具将显示该设备。\n\n![](img/b40539f0f23a32fb6110fc27a5bf954e_23_0.png)\n\n从下拉列表中选择设备类型\
    \ bond 创建设备。\n\n- 3. 现在你需要为设备添加配置。首先，选择将用于设备且没有 IP 配置的网卡。然后你需要选择使用的绑定协议。如果这是你第一次尝试网卡绑定，建议不要更改默认协议。一旦你验证了默认协议工作正常，就可以测试任何协议是否适用于你的环境（这可能需要额外的交换机配置）。此外，YaST\
    \ 不允许没有 IP 地址的 bond 设备，你需要添加一个临时 IP 地址（在此程序的下一步中你将其删除）。\n\n![](img/b40539f0f23a32fb6110fc27a5bf954e_24_0.png)\n\
    \n现在选择用于 bond 设备的网卡以及你想使用的绑定协议。\n\n- 4. 此时，你可以在 YaST 中完成操作，以确保配置写入磁盘。结果将创建一个相应的配置文件。你可以在\
    \ /etc/sysconfig/network/bond0 找到它，内容如下：\n\n列表：bond0 接口的示例配置\n\n```\nBONDING_MASTER='yes'\n\
    BONDING_MODULE_OPTS='mode=active-backup'\nBONDING_SLAVE0='eth0'\nBONDING_SLAVE1='eth1'\n\
    BOOTPROTO='none'\nBROADCAST=''\nETHTOOL_OPTIONS=''\nIPADDR=''\nMTU=''\nNAME=''\n\
    NETMASK=''\nNETWORK=''\nREMOTE_IPADDR=''\nSTARTMODE='auto'\nUSERCONTROL='no'\n\
    ```\n"
