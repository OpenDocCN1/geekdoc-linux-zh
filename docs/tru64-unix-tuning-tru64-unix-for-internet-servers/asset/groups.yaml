    ## 1.4.6 Retransmissions, Out-of-Order Packets, and Bad Checksums


    Use the netstat -p tcp command to check for retransmissions, out-of-order packets,
    and bad checks for the TCP protocol. Use netstat -p udp command to look for bad
    checksums and full sockets for the UDP protocol. You can use out of these commands
    to identify network performance problems by comparing the values in some fields
    to the total of packets received or sent.


    For example, an acceptable percentage of retransmitted packets or duplicate acknowledgments
    is 2 percent or less. An acceptable percentage of bad checksums is 1 percent or
    less.


    A large number of entries in the embryonic connections dropped field may indicate
    that the listen queue is too small or server performance is slow and clients have
    canceled requests. Other important fields to examine the completely duplicate
    packets, out-of-order packets, and discarded fields. For example:


    ```

    # netstat -p tcp

    tcp:

    ```


