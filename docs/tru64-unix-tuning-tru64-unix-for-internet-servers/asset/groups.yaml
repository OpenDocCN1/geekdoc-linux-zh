    The default value is 1073741824 bytes (1GB). If you have an Internet, Web, proxy,
    caching, firewall, or gateway server, the recommended value is 10734718240 (10
    GB).


    ## 2.3 Advanced Tuning Recommendations


    This section offers advanced tuning recommendations for some of the attributes
    for the following subsystems:


    - Generic (Section 2.3.1)

    - Internet (Section 2.3.2)

    - Network (Section 2.3.3)

    - Socket (Section 2.3.4)

    - Virtual memory (Section 2.3.5)


    These recommendations are appropriate only for systems that are primarily used
    as Internet servers and are configured with physical memory. Using a recommended
    attribute value in a non-Internet server may cause a degradation in system performance.


    Because Internet server configurations differ and a recommended value may not
    provide optimal performance for all configurations, be careful when modifying
    attributes. Read the attribute descriptions and determine which values are appropriate
    for your configuration. If modifying an attribute does not improve performance,
    you may want to return to the default value.


    ## 2.3.1 Modifying Generic Attributes


    You may be able to tune Internet server performance by tuning the kmemreserve_percent
    generic (generic) subsystem attribute. This attribute increases the percentage
    of physical memory reserved for kernel memory allocations that are less than or
    equal to the page size (8 KB). Increasing the value of kmmemreserve_percent improves
    network throughput by reducing the number of packets that are dropped while the
    system is under a heavy network load. However, increasing this value consumes
    memory.


    You may want to increase the value of the kmmemreserve_percent attribute if the
    output of the netstat command dropped packets, or if the output of the vmstat
    -M command shows dropped packets the fail_nowait heading. This may occur under
    a heavy network load.


    The default value is 0 (the percentage of reserved physical memory will be the
    smallest of 0.4 percent of available memory and 256 KB). Increase the value (up
    to a maximum of 75) by increments until the output of the vmstat -M command shows
    no entries under the fail_nowait heading.


