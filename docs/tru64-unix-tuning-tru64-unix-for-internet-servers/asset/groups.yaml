    for a user process for Tru64 UNIX Version 4.0G and earlier.


    The operating system limits the number of memory-mapped files that are available
    to each process. Each map entry describes one disjoint portion of a virtual address
    space.


    The two types of Internet servers are multiprocess and multithreaded Internet
    servers. Because multithreaded Internet servers are more likely to use memory-mapped
    files, you may want to increase the maximum number of memory-mapped files if you
    have this type of system.


