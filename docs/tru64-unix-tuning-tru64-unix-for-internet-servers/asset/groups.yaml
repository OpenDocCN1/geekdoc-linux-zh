    Keepalive 允许在连接的套接字上定期发送消息，以保持连接活跃并使活动连接超时。当 keepalive 间隔到同时，未退出的套接字将被清理。如果启 keepalive，这些套接字将一直存在直到您重启系统。


    应用程序通过设置 `setsockopt` 函数的 `SO_KEEPIPE` 属性为套接字启用 keepalive。默认值为 0（禁用 keepalive）。对于未在内部设置
    keepalive 的程序，或者您无法访问应用程序源代码，请将此属性设置为 1。在设置该属性后，所有新连接将具有 keepalive，现有连接将继续使用之前的
    keepalive 设置。


