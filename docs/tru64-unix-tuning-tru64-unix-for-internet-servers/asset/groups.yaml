    - sominconn（节 2.2.3.2）

    - sbcompress_threshold（节 2.2.3.3）


    ## 2.2.3.1 增加最大等待 TCP 连接数


    **somaxconn** 属性指定每个服务器套接字（例如 HTTP 服务器）的最大等待 TCP 连接数（即 socket 监听队列限制）。等待的 TCP
    连接可能是由互联网中的数据包丢失或拒绝服务攻击引起的。繁忙的 Internet 服务器会经历大量的等待连接。如果监听队列限制太小，入站的连接请求可能会被丢弃。


    默认值为 1024。**推荐值**为 65535，这是最大值。请勿高于最大值的数值，因为这可能会导致不可预测的行为。


    ## 2.2.3.2 增加最小等待 TCP 连接数


    **sominconn** 属性指定每个服务器套接字的最小等待 TCP 连接数（backlog）。该属性控制了系统在丢弃额外请求之前能够同时处理的 SYN
    数据包的最大数量。如果客户端用错误的 SYN 数据包填满了 socket 监听队列，网络性能可能会下降，这会阻塞其他连接进入队列。


    **sominconn** 的值将覆盖应用程序特定的 **backlog** 值，对于某些服务器软件来说，该值可能被设置得太低。如果您没有应用程序源代码，请使用
    **somaxconn** 属性设置一个适用于您应用程序的等待连接限制。


    默认值为 0。**推荐值**为 65535，这是最大值。建议将 **sominconn** 属性的值与 somaxconn 属性的值相同。有关 somaxconn
    属性的更多信息，请参见节 2.2.3.1。


    ## 2.2.3.3 启用 mbuf 簇压缩


    sbcompress_threshold 属性控制 socket 层中哪些 mbuf 簇被压缩。默认情况下，mbuf 簇是不压缩的，这会导致代理服务器和缓存服务器消耗所有可用
    mbuf 簇。如果您使用的是 FDDI 而不是以太网，这个问题更容易发生。有关监控 mbuf 簇的信息，请参考节 1.4.2。


    要启用 mbuf 簇压缩，请修改 sbcompress_threshold 属性并指定一个值。如果数据包大小小于此值，数据包将复制到现有的 mbuf 簇中。


    默认值为 0（禁用 mbuf 压缩）。如果您有代理服务器、缓存网关或防火墙，推荐值为 600 字节。


