    ## 改进 Internet 服务器性能


    本章介绍了如何提高您的 Internet 服务器性能。它提供了各种配置指南，并描述了若干监控工具，包括以下主题：


    - 配置硬件（第 1.1 节）

    - 配置内存和交换空间（第 1.2 节）

    - 记录 IP 地址（第 1.3 节）

    - 监控网络统计（第 1.4 节）

    - 监控套字统计（第 1.5 节）

    - 监控虚拟内存统计（第 1.6 节）

    - 收集配置信息（第 1.7 节）


    > 注意

    安装最新版本的 Tru64 UNIX 以及适用于您的操作系统版本的最新补丁。


    ## 1.1 配置硬件


    以下硬件配置指南有助于提高 Internet 服务器性能：


    - 确保您的系统、磁盘、适配器和控制器拥有最新的固件。

    - 确保有足够的内存和交换空间来处理工作负载。

    - 在您的 Internet 服务器配置中使用高性能存储硬件，包括磁盘、适配器和控制器。

    - 使用逻辑存储管理器 (LSM) 或硬件存储配置来实现高性能和高可用性。

    - 在硬件 RAID 配置中使用写回缓存（write-back caches）来显著提高 Internet 服务器性能。

    - 将 /tmp 和 /var/tmp 目录放置在不同的文件系统中，如果可能，请放在不同的磁盘上。为了获得最佳性能，请将目录放在由启用了写回缓存选项的 RAID
    控制器的磁盘。


    ## 1.2 配置内存和交换空间


    您必须提供足够的内存和交换空间来处理服务器工作负载。内存资源和交换空间不足会导致性能问题。配置内存和交换空间，请遵循以下步骤：


    1. 确定您的工作负载需要多少物理内存。

    2. 选择交换空间分配方式，立即或延迟。

    3. 确定您需要多少交换空间。

    4. 配置交换空间以高效分配磁盘 I/O。


    除了系统和应用操作所需的内存外，每个 Internet 服务器连接都需要以下内存资源：


    - 内核套接字结构

    - Internet 协议控制块 (inpcb) 结构

    - TCP 控制块结构

    - 数据包到达和处理时所需的任何缓冲区


    这些内存资源每个连接端点总计 1 KB（不包括套接缓冲区），这意味着您需要 10 MB 的内存来容纳 10,000 个连接。


    您必须确保服务器有足够的内存来处理严苛的峰值负载。配置比服务器繁忙日所需的更多的内存，以便您有足够的内存处理偶尔的活动高峰。


    只要有内存资源来服务连接，服务器处理数百万 TCP 连接的能力没有限制。然而，如果您没有足够的内存，除非现有连接释放，否则服务器将拒绝新请求。使用 `netstat
    -m` 命令监控网络子系统当前使用的内存。有关 `netstat` 命令的更多信息，请参考第 1.4 节。


    ## 1.3 记录 IP 地址


    如果您的 Internet 服务器记录客户端主机名，应用程序将强制系统执行反向 DNS 查询以获取客户端主机名。反向 DNS 查询非常耗时，可能会在有许多客户端的繁忙服务器上引起性能问题。


    您可以修改 Internet 软件以记录客户端网协议 (IP) 地址而不是客户端主机，而不会丢失任何重要信息。记录 IP 地址可能会显著提高 Internet
    服务器的效率。


    咨询 Internet 服务器供应商提供的文档以确定如何禁用客户端主机名的记录。例如，您可以从以下 URL 的 Apache HTTP 服务器文档网站获取有关修改
    Apache HTTP 服务器软件的信息：


    ```

    http://http.apache.com/docs/

    ```


    ## 1.4 监控网络统计


    netstat 命令显示网络统计，包括关于每个协议的网络路由和活动套接字的信息。该命令还显示网络接口的累积统计，包括输入和输出数据包的数量及冲突、用于网络操作的内存信息，以及与
    IP、ICMP、TCP 和 UDP 协议层相关的统计。


    您可以使用 netstat 命令检查以下内容：


    - 输入和输出错误及冲突（第 1.4.1 节）

    - 网络内存使用（第 1.4.2 节）

    - 套接字连接（第 1.4.3 节）

    - 设备驱动错误（第 1.4.4 节）

    - 丢弃或丢失的数据（第 1.4.5 节）

    - 重传、乱序包和错误的校验和（第 1.4.6 节）

    - 路由统计（第 1.4.7 节）

    - 网络协议统计（第 1.4.8 节）


    后续章节介绍了如何使用 netstat 检查这些情况。更多信息请参考您对应操作系统的 netstat(1)：


    ```

    http://www.tru64unix.compaq.com/docs/pub_page/doc_list.html

    ```

    '
