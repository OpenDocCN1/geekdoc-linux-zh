    # ### 2.3.2.1 Increasing the Number of TCP Hash Table


    The tcbhashnum attribute specifies the number of TCP hash tables. Increasing the
    number of hash tables distributes the load and may improve performance. However,
    this will slightly increase the amount of wired memory in the system.


    The default value is 1 hash table, which is the minimum value. For busy Internet
    server SMP systems, the recommended value is 16. The maximum value is 64.


    If you increase the number of hash tables, decrease the size of the hash table.
    Refer to Section 2.2.1.1 for more information. In addition, it is recommended
    that you make the value of this attribute as the same as the'
- md: '

    value of the ipqs attribute. Refer to Section 2.3.2.8 for more information on
    the ipqs attribute.


    ## 2.3.2.2 Increasing the Number of Hash Buckets


    The ifaddr_hsize attribute specifies the number of hash buckets in the kernel
    interface alias table (in_ifaddr).


    If a system is used to serve many different server domain names, each of which
    are bound to a unique IP address, the code that matches packets to the right server
    address uses the hash table to seek lookup operations for the IP addresses. These
    addresses are usually set using ifconfig alias or ifconfig aliasist command. Increasing
    the number of hash buckets in the table can improve performance on systems that
    use large numbers of IP addresses.


    The default value is 32 hash buckets. For most servers that do not use IP aliases
    or if you are using less than 250 aliases, the recommended value is 32. If you
    are using more than 500 interface aliases, the recommended value is 512, which
    is the maximum value.


    For the best performance, the value of this attribute must be rounded down to
    the nearest power of 2.


    ## 2.3.2.3 Modifying the TCP Connection Timeout Limit


    The tcp_keepint attribute specifies the amount of time that partially established
    TCP connection remains on the socket listen queue before it times out. The value
    of the attribute is in 0.5 seconds. Partial connections consume socket listen
    slots and fill the queue in the SYN_RCVD state.


    The default value is 150 units (75 seconds). You do not need to modify the TCP
    portion timeout limit unless the value of the somaxconn_drops attribute often
    increases. Refer to Section 1.5 for information on the event counter.


    If your socket queue limit is set to the maximum value, the default value of this
    attribute is usually adequate. If the somaxconn_drops attribute often prevents
    the socket listen queue from filling up, you can decrease the value of this attribute
    to make partial connections to time sooner out.


    In addition, network performance can degrade if a client overflows a socket listen
    queue with TCP SYN packets, which blocks other users from the queue. To eliminate
    this problem, increase the socket listen queue limit to its maximum value. If
    the system continues to drop SYN packets, set the value of this attribute to 30
    (15 seconds). Monitor the value of the sologback_drops and somaxconn_drops event
    counters to determine if the system is dropping packets.


    Do not set the value of this attribute too low, because you may prematurely break
    connections with clients on slow network paths or network paths that lose many
    packets. Do not set the value to less than 20 units (10 seconds).


    ## 2.3.2.4 Decreasing the Rate of TCP Retransmissions


    The tcp_remit_interval_min attribute specifies the minimum amount of time between
    the first TCP retransmission. For some wide area networks (WANs), the default
    value may be too small and premature retransmission timeouts may occur, which
    can duplicate transmission of packets and the erroneous invocation of the TCP
    congestion-avoidance algorithms.


    You can increase the value of this attribute to slow the rate of TCP retransmissions,
    which decreases congestion and improves performance.


    The default value is 2 units (1 second). Not every connection needs a long retransmission
    time. Usually, the default value of this attribute is adequate. However, for some
    WANs, the default retransmission interval may be too small.


    To check for retransmissions, use the netstat -p command and examine the output
    for data packets retransmitted.


    You can increase the value of this attribute to slow the rate of TCP retransmissions.
    The attribute is specified in units of 0.5 seconds.


    Do not change the default value of this attribute unless you fully understand
    TCP algorithms. Do not specify a value that is less than 1 unit.


    ## 2.3.2.5 Enabling Keepalive Functionality


    Keepalive enables the periodic transmission of messages on a connected socket
    to keep connections active and to time out inactive connections. Sockets that
    do not exit are cleaned up when the keepalive interval expires. If keepalive is
    enabled, those sockets continue to exist until you reboot the system.


    Applications enable keepalive for sockets by setting the setsockopt function''s
    SO_KEEPIIVE attribute. The default value is 0 (keepalive is disabled). To enable
    keepalive for programs that do not set keepalive on over, or if you do not have
    access to the application source code, set this attribute to 1. After you set
    the attribute, all new connections will have keepalive, existing connections will
    continue to use the previous keepalive setting.


    Tuning Recommendations 2-15


    If you modify this attribute without rebooting the system, sockets that already
    exist will continue to use the old behavior until the applications are restarted.


    If you enable keepalive, you can also configure the following TCP options for
    each socket:


    - The tcp_keepidle attribute specifies the amount of idle time, in 0.5-second
    units, before sending a keepalive probe. The default value for this attribute
    is 2 hours.

    - The tcp_keepintvl attribute specifies the amount of time, in 0.5-second units,
    before retransmission of keepalive probes. The default value for this attribute
    is 75 seconds.

    - The tcp_keepcnt attribute specifies the maximum number of keepalive probes that
    are sent before the connection is dropped. The default value for this attribute
    is 8 hours.

    - The tcp_keepinit attribute specifies the maximum amount of time, in 0.5-seconds,
    before an initial connection attempt times out. The default value for this attribute
    is 75 seconds.


    ## 2.3.2.6 Increasing the TCP Connection Timeout Rate


    The tcp_msl attribute determines the maximum lifetime of a TCP segment and the
    timeout value for the TIME_WAIT state. The TCP protocol includes a concept known
    as the Maximum Segment Lifetime (MSL). When a TCP connection enters the TIME_WAIT
    state, it must remain in this state for twice the value of the MSL, or until undetected
    data errors on future connections can occur.


    You can decrease the value of this attribute to make the TCP connection time out
    more quickly at the end of a connection. However, this will increase the chance
    of data corruption.


    The default value is 60 (30 seconds, which means that the TCP connection remains
    in TIME_WAIT state for 60 seconds or twice the value of the MSL). The default
    value of this attribute is set in units of 0.5 seconds. The recommended value
    is the default value; if you use a different value, there is the potential for
    data corruption.


    Although the TCP specifications specify an MSL of 120 seconds, most TCP implementations
    use a value that is less than 120. The Internet FAQ Consortium Web site offers
    more information. For RFC793, refer to the following URL:


    ```

    http://www.rfc.org/rfc793.html

    For RFC1122, refer to the following URL:

    http://www.rfc.org/rfc1172.html

    ```


    In some situations, the default timeout value for the TIME_WAIT state is too large,
    reducing the value of this attribute frees connection resources sooner than the
    default behavior.


    Do not reduce the value of this attribute unless you fully understand the design
    and behavior of your network and the TCP protocol.


    ## 2.3.2.7 Modifying the Range for Outgoing Connection Ports


    When a TCP or UDP application creates an outgoing connection, the kernel dynamically
    allocates a nonreserved port number for each connection.


    The kernel selects the port number from a range of values between ipport_userreserved_min
    (if you are running Tru64 UNIX Version 4.0E or higher) or 1024 (if you are running
    a prior version), and ipport_reserved.


    If you are running Tru64 UNIX Version 4.0E or a higher version of the operating
    system, your system requires a particular range of ports, you can modify the value
    of this attribute.


    The default value is 1024. The maximum value is 65535. Do not specify a value
