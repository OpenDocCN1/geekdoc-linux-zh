    Too much memory allocated to the UBC can cause excessive paging and swapping,
    which may degrade overall system performance. However, an insufficient amount
    of memory allocated to the UBC can degrade file system performance.


    The ubc_minpercent attribute specifies the minimum percentage of memory that only
    the UBC can utilize. The remaining memory is shared with processes. The ubc_maxpercent
    attribute specifies the maximum percentage of memory that the UBC can utilize.
    The ubc_borrowpercent attribute specifies the UBC borrowing threshold.


    Between the value of ubc_borrowpercent attribute and the value of the ubc_maxpercent
    attribute, the memory that is allocated to the UBC is considered borrowed from
    processes. When paging begins, these borrowed pages are reclaimed first, until
    the amount of memory allocated to the UBC decreases the value of the ubc_borrowpercent
    attribute.


    The default value for ubc_minspercent is 10 percent. The default value for ubc_maxpercent
    is 100 percent. The default value for ubc_borrowpercent is 20 percent. On a typical
    Internet server, the default value for each attribute is usually adequate. Also,
    if your disks are busy with file system I/O and the system has sufficient free
    pages, use the default values.


    Use the vmstat command to display information about virtual memory, including
    the free page count.


    If you have a low free page count, you may want to increase the memory available
    to processes by reducing the memory available to the UBC. You should attempt to
    keep in memory the working set of your processes, or it increases the number of
    UBC misses.


    You can reduce the default value of the ubc_maxpercent attribute in increments
    of 10 percent.


    Reducing the borrowed memory by decreasing the value of the ubc_borrowpercent
    attribute may improve the system response time when memory is low. However, this
    may reduce UBC performance.


    # 2.3.5.2 Increasing the Maximum Number of Protected Virtual Pages


    The vpages attribute attribute the maximum number of virtual pages within a process''
    address space can be given individual protection attributes for Tru64 Unix Version
    4.0G and earlier. These protection attributes differ from the protection attributes
    associated with the other pages in the address space.


    Changing the protection attributes of a single page within a virtual memory region
    causes all pages within that region to be treated as'
- md: '

    they had individual protection attributes. For example, each thread of a multithreaded
    task has a user stack in the stack region for the process in which it runs. Because
    multithreaded tasks have guard pages (that is, pages that do not read/write access)
    inserted between the user stacks for the threads, all pages in the stack region
    for the process are treated as though they have individual protection attributes.


    The two primary types of Internet servers are multiprocess and multithreaded Internet
    servers. Because multithreaded Internet servers are more likely to use memory-mapped
    files, you may want to modify the value of this attribute if you have this type
    of system. However, this attribute affects all processes, increasing its value
    will allow the system to consume more memory.


    The default value is the value of the vm-maxvas attribute (the size of valid virtual
    address space in bytes) divided by 8192. If a stack region for a multithreaded
    task exceeds 16 KB pages, you may want to increase the value of vm-vpagemax.


    For example, if the value of the vm-maxvas attribute is 1 GB (the default), set
    the value of this attribute to 131072 pages (1073741824 / 8192 = 131072). Using
    this value can improve the efficiency of Internet servers that maintain large
    tables or resident images.


