    ## 2.2.3 Modifying Socket Attributes


    You may be able to improve Internet server performance by tuning the following
    socket attributes:


    - somaxconn (Section 2.2.3.1)

    - sominconn (Section 2.2.3.2)

    - sbcompress_threshold (Section 2.2.3.3)


    ## 2.2.3.1 Increasing the Maximum Number of Pending TCP Connections


    The **somaxconn** attribute specifies the maximum number of pending TCP connections
    (the socket listen queue limit) for each server socket (for example, the HTTP
    server). Pending TCP connections can be caused by lost packets in the Internet
    or denial of service attacks. Busy Internet servers experience large numbers of
    pending connections. If the listen queue limit is too small, incoming connection
    requests may be dropped.


    The default value is 1024. The **recommended value** is 65535, which is the maximum
    value. Do not specify a value that is higher than the maximum value because this
    can cause unpredictable behavior.


    ## 2.2.3.2 Increasing the Minimum Number of Pending TCP Connections


    The **sominconn** attribute specifies the minimum number of pending TCP connections
    (backlog) for each server socket. The attribute controls the maximum number of
    SYN packets that the system can handle simultaneously before additional requests
    are discarded. Network performance can degrade if a client saturates a socket
    listen queue with erroneous SYN packets, which blocks others from the queue.


    The value of **sominconn** overrides the application-specific **backlog** value,
    which may be set too low for more server software. If you do not have your application
    source code, use the **somaxconn** attribute to set a pending-connection limit
    that is appropriate for your application.


    The default value is 0. The **recommended value** is 65535, which is the maximum
    value. It is recommended that the value of the **sominconn** attribute be the
    same as the value of the somaxconn attribute. See Section 2.2.3.1 for more information
    in the somaxconn attribute.


    ## 2.2.3.3 Enabling the mbuf Cluster Compression


    The sbcompress_threshold attribute controls which mbuf clusters are compressed
    at the socket layer. By default, mbuf clusters are not compressed, which can cache
    proxy servers and caching servers to consume all the available mbuf clusters.
    This problem is more likely to occur if you are using FDDI, instead of Ethernet.
    Refer to Section 1.4.2 for information about monitoring mbuf clustering.


    To enable mbuf cluster compression, modify the sbcompress_threshold attribute
    and specify a value. Packets will be copied into the existing mbuf clusters if
    the packet size is less than this value.


    The default value is 0 (mbuf compression is disabled). If you have a proxy server,
    caching gateway, or firewall, the recommended value is 600 bytes.


