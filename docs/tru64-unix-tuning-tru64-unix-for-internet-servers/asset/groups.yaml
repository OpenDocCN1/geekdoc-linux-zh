  - '[PAGE 43]


    they had individual protection attributes. For example, each thread of a multithreaded
    task has a user stack in the stack region for the process in which it runs. Because
    multithreaded tasks have guard pages (that is, pages that do not read/write access)
    inserted between the user stacks for the threads, all pages in the stack region
    for the process are treated as though they have individual protection attributes.


    The two primary types of Internet servers are multiprocess and multithreaded Internet
    servers. Because multithreaded Internet servers are more likely to use memory-mapped
    files, you may want to modify the value of this attribute if you have this type
    of system. However, this attribute affects all processes, increasing its value
    will allow the system to consume more memory.


    The default value is the value of the vm-maxvas attribute (the size of valid virtual
    address space in bytes) divided by 8192. If a stack region for a multithreaded
    task exceeds 16 KB pages, you may want to increase the value of vm-vpagemax.


    For example, if the value of the vm-maxvas attribute is 1 GB (the default), set
    the value of this attribute to 131072 pages (1073741824 /8192 = 131072). Using
    this value can improve the efficiency of Internet servers that maintain large
    tables or resident images.'
